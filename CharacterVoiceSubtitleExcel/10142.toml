[translation]
10142-CVGroup_Battle_Buffed_1-1 = "Thank you for your kindness."
10142-CVGroup_Battle_Defense_1-1 = "As expected."
10142-CVGroup_Battle_In_1-1 = "The heat may be my weakness, but I shall still do my utmost."
10142-CVGroup_Battle_In_2-1 = "I will put on a dazzling performance."
10142-CVGroup_Battle_Move_1-1 = "Let us proceed carefully."
10142-CVGroup_Battle_Move_2-1 = "Is everyone following me?"
10142-CVGroup_Battle_Recovery_1-1 = "So this is...friendship."
10142-CVGroup_Battle_TacticalAction_1-1 = "On my way."
10142-CVGroup_Battle_Victory_1-1 = "It is our victory."
10142-CVGroup_Battle_Victory_2-1 = "This is the Hyakkaryouran's power."
10142-CVGroup_CommonSkill-1 = "A do-or-die match."
10142-CVGroup_ExSkill_1-1 = "So this is the summer sea..."
10142-CVGroup_ExSkill_2-1 = "Cool wind..."
10142-CVGroup_ExSkill_3-1 = "White waves... I like it."
10142-CVGroup_ExSkill_Level_1-1 = "I dazzled you."
10142-CVGroup_ExSkill_Level_2-1 = "Perhaps I was too bright."
10142-CVGroup_ExSkill_Level_3-1 = "It wasn't intentional."
10142-CVGroup_Formation_In_1-1 = "Allow me. With the Hundred Lotus in hand."
10142-CVGroup_Formation_In_2-1 = "My right hand is fine now. Leave it to me."
10142-CVGroup_Formation_Select-1 = "I shall follow...your commands."
10142-CVGroup_Growup_1-1 = "With this... I release the first seal upon my right hand."
10142-CVGroup_Growup_2-1 = "Yes, my potential for growth is undampened."
10142-CVGroup_Growup_3-1 = "Allow me...to demonstrate the power I've reclaimed from the spirit realm!"
10142-CVGroup_Growup_4-1 = "Thank you, Sensei. The seed within me has bloomed thanks to you."
10142-CVGroup_Relationship_Up_1-1 = "Just as the coming of spring at first snow melt... So to has my once-desolate heart embraced its own spring."
10142-CVGroup_Relationship_Up_2-1 = "Your kindness, Sensei... I wish to embody it as well."
10142-CVGroup_Relationship_Up_3-1 = "Thank you for your steadfast trust in me. I...shall always believe in you as well."
10142-CVGroup_Relationship_Up_4-1 = "Although I have nothing to boast of besides my beauty... May I still remain by your side, Sensei?"
10142-CVGroup_Tactic_In_1-1 = "I will make myself known, here and now."
10142-CVGroup_Tactic_In_2-1 = "I shall lead you to victory."
10142-CVGroup_Tactic_Victory_1-1 = "I am happy to repay your trust in me."
10142-CVGroup_Tactic_Victory_2-1 = "I am no longer simply a stand-in."
