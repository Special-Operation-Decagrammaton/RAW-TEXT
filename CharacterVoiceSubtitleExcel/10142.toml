[translation]
10142-CVGroup_Battle_Buffed_1-1 = "謝謝你這麼關心我。"
10142-CVGroup_Battle_Defense_1-1 = "我早就知道了。"
10142-CVGroup_Battle_In_1-1 = "雖然我很怕熱……但我會加油的。"
10142-CVGroup_Battle_In_2-1 = "我的表現，請好好印在眼裡，老師。"
10142-CVGroup_Battle_Move_1-1 = "謹慎前進吧。"
10142-CVGroup_Battle_Move_2-1 = "大家，有跟上嗎？"
10142-CVGroup_Battle_Recovery_1-1 = "這就是……朋友。"
10142-CVGroup_Battle_TacticalAction_1-1 = "要上了哦。"
10142-CVGroup_Battle_Victory_1-1 = "嗯，是我們贏了。"
10142-CVGroup_Battle_Victory_2-1 = "這就是，百花繚亂的力量。"
10142-CVGroup_CommonSkill-1 = "一決勝負。"
10142-CVGroup_ExSkill_1-1 = "這就是夏天的大海……"
10142-CVGroup_ExSkill_2-1 = "風吹起來好舒服……"
10142-CVGroup_ExSkill_3-1 = "白色的浪花……好美。"
10142-CVGroup_ExSkill_Level_1-1 = "是不是太刺眼了呢？"
10142-CVGroup_ExSkill_Level_2-1 = "是不是耀眼過頭了呢。"
10142-CVGroup_ExSkill_Level_3-1 = "我不是有意為之的……"
10142-CVGroup_Formation_In_1-1 = "嗯，百蓮我也帶上了哦。"
10142-CVGroup_Formation_In_2-1 = "右臂，現在沒問題。\n交給我吧。"
10142-CVGroup_Formation_Select-1 = "如果老師想這麼做的話……\n我會聽你的。"
10142-CVGroup_Growup_1-1 = "這樣子……\n右臂的封印就解開一道了。"
10142-CVGroup_Growup_2-1 = "原來如此。\n看來我也還有成長的空間呢。"
10142-CVGroup_Growup_3-1 = "從黃昏手中取回的……我的力量……\n現在就讓你見識見識。"
10142-CVGroup_Growup_4-1 = "有種花苞綻放的感覺。\n謝謝你，這都是多虧了老師哦。"
10142-CVGroup_Relationship_Up_1-1 = "就像雪融之後，春天便會到來……\n我那片荒蕪的心，似乎也迎來了萌芽的時刻。"
10142-CVGroup_Relationship_Up_2-1 = "果然很溫柔呢。\n我也希望，總有一天能成為像老師一樣的人。"
10142-CVGroup_Relationship_Up_3-1 = "謝謝你一直願意相信我。\n……老師，我很依賴你哦。"
10142-CVGroup_Relationship_Up_4-1 = "雖然我除了長得漂亮以外，並沒什麼特別的長處……\n但是也想待在老師身邊……可以嗎？"
10142-CVGroup_Tactic_In_1-1 = "我要讓大家知道，我究竟是誰。"
10142-CVGroup_Tactic_In_2-1 = "我會引領大家走向勝利的。"
10142-CVGroup_Tactic_Victory_1-1 = "如果能回應老師的期待，那就太好了。"
10142-CVGroup_Tactic_Victory_2-1 = "我已經……不再是誰的「替代品」了。"
