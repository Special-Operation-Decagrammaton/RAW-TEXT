[translation]
10147-CVGroup_Battle_Buffed_1-1 = "哎呀，謝謝你～"
10147-CVGroup_Battle_Covered_1-1 = "我討厭疼痛！"
10147-CVGroup_Battle_Defense_1-1 = "哼嗯～明明是白費力氣。"
10147-CVGroup_Battle_In_1-1 = "別弄痛我哦……？"
10147-CVGroup_Battle_In_2-1 = "我會在角落加油的。"
10147-CVGroup_Battle_Move_1-1 = "還有什麼沒解決的嗎？"
10147-CVGroup_Battle_Move_2-1 = "還沒結束嗎？"
10147-CVGroup_Battle_Recovery_1-1 = "哎呀，謝謝你。"
10147-CVGroup_Battle_TacticalAction_1-1 = "呀啊！"
10147-CVGroup_Battle_Victory_1-1 = "呵呵，是理所當然的結果呢。"
10147-CVGroup_Battle_Victory_2-1 = "該說是老師和我的勝利嗎？"
10147-CVGroup_CommonSkill-1 = "討厭～！"
10147-CVGroup_ExSkill_1-1 = "哎呀，原來你在這裡。\n海邊可是充滿危險的哦。\n來，開始做紫外線對策吧。"
10147-CVGroup_ExSkill_2-1 = "到這邊來。\n真是太沒防備了呢。\n不用客氣哦？"
10147-CVGroup_ExSkill_3-1 = "這樣下去很危險哦！\n乖乖別動……\n我來幫你擦吧。"
10147-CVGroup_ExSkill_Level_1-1 = "小心別曬傷了哦。"
10147-CVGroup_ExSkill_Level_2-1 = "紫外線有多危險……你應該知道吧？"
10147-CVGroup_ExSkill_Level_3-1 = "別客氣，儘管交給我。"
10147-CVGroup_Formation_In_1-1 = "要我出場嗎？"
10147-CVGroup_Formation_In_2-1 = "我不太能忍痛的說……"
10147-CVGroup_Formation_Select-1 = "哎呀？是想要我抱抱嗎？"
10147-CVGroup_Growup_1-1 = "感覺變強了呢。\n呵呵……數據是很誠實的哦？"
10147-CVGroup_Growup_2-1 = "生存率提升了呢。"
10147-CVGroup_Growup_3-1 = "呵呵，NK-ULTRA計畫又前進了一步呢。"
10147-CVGroup_Growup_4-1 = "總是受你照顧呢……謝謝你，老師。"
10147-CVGroup_Relationship_Up_1-1 = "繼續在我身邊守護我吧。"
10147-CVGroup_Relationship_Up_2-1 = "總覺得有種奇怪的感覺。\n或許該動員情報部的全力，查明原因比較好。"
10147-CVGroup_Relationship_Up_3-1 = "和老師在一起的時候……無論多黑暗的地方，我都不怎麼害怕。"
10147-CVGroup_Relationship_Up_4-1 = "千年的約定是絕對的哦，老師。\n從今以後，也請一直待在我身邊。"
10147-CVGroup_Tactic_In_1-1 = "萬魔殿，總攻擊。"
10147-CVGroup_Tactic_In_2-1 = "真希望能用催眠來解決呢……"
10147-CVGroup_Tactic_Victory_1-1 = "呵呵，情報才是勝利的關鍵哦？"
10147-CVGroup_Tactic_Victory_2-1 = "要感謝也沒問題哦，老師？"
