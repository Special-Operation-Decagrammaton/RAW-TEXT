[translation]
10147-CVGroup_Battle_Buffed_1-1 = "เป็นการตัดสินใจที่ยอดเยี่ยมเลยนะ~"
10147-CVGroup_Battle_Covered_1-1 = "ฉันไม่ชอบเจ็บตัวนะ~"
10147-CVGroup_Battle_Defense_1-1 = "ฮึ่ม~ ไม่ได้ผลหรอกนะ?"
10147-CVGroup_Battle_In_1-1 = "ขอแบบไม่เจ็บนะ~"
10147-CVGroup_Battle_In_2-1 = "ฉันจะคอยให้กำลังใจอยู่ตรงมุมนี้นะ"
10147-CVGroup_Battle_Move_1-1 = "เฮ้อ ยังมีอะไรเหลืออีกล่ะ?"
10147-CVGroup_Battle_Move_2-1 = "หืม? ยังไม่จบอีกเหรอ?"
10147-CVGroup_Battle_Recovery_1-1 = "ขอบคุณนะ~"
10147-CVGroup_Battle_TacticalAction_1-1 = "ย่าห์~"
10147-CVGroup_Battle_Victory_1-1 = "ฮุฮุ ผลลัพธ์ตามคาดเลย"
10147-CVGroup_Battle_Victory_2-1 = "นี่คือชัยชนะของครูกับฉันละมั้ง?"
10147-CVGroup_CommonSkill-1 = "มะ... ไม่เอา~!"
10147-CVGroup_ExSkill_1-1 = "อ๊ะ อยู่ตรงนั้นนี่เอง ชายหาดมันอันตรายนะ\nเอาละ แผนรับมือรังสี UV!"
10147-CVGroup_ExSkill_2-1 = "มาทางนี้สิ ไม่ไร้การป้องกันเกินไปหน่อยเหรอ?\nไม่ต้องเกรงใจก็ได้นะ?"
10147-CVGroup_ExSkill_3-1 = "ถ้าเป็นแบบนี้คงอันตรายนะ~\nอยู่นิ่งๆ แบบนั้นแหละ... เดี๋ยวฉันจัดการให้เอง"
10147-CVGroup_ExSkill_Level_1-1 = "อย่าตากแดดมากเกินไปนะ"
10147-CVGroup_ExSkill_Level_2-1 = "รู้ถึงอันตรายของรังสี UV ใช่มั้ย?"
10147-CVGroup_ExSkill_Level_3-1 = "เอาละ เอาละ ไม่ต้องเกรงใจหรอกนะ~"
10147-CVGroup_Formation_In_1-1 = "ต้องออกไปจริงๆ เหรอ?"
10147-CVGroup_Formation_In_2-1 = "อืม... ไม่ชอบเจ็บตัวเลย..."
10147-CVGroup_Formation_Select-1 = "เอ๋? อยากให้กอดเหรอ?"
10147-CVGroup_Growup_1-1 = "รู้สึกเหมือนแข็งแกร่งขึ้นเลยนะ~\nข้อมูลน่ะไม่โกหกหรอก"
10147-CVGroup_Growup_2-1 = "รู้สึกว่าโอกาสรอดชีวิตเพิ่มขึ้นอีกแล้วนะ~"
10147-CVGroup_Growup_3-1 = "ฮุฮุ โปรเจกต์อัลตร้า NK ของฉัน\nกำลังเข้าใกล้ความสมบูรณ์มากขึ้นแล้ว"
10147-CVGroup_Growup_4-1 = "ฉันได้รับความช่วยเหลือทุกครั้งเลยนะ ครู\nขอบคุณเสมอเลยนะ"
10147-CVGroup_Relationship_Up_1-1 = "ฮุฮุ ฝากปกป้องฉันต่อไปด้วยนะ ครู"
10147-CVGroup_Relationship_Up_2-1 = "เป็นความรู้สึกแปลกๆ นะ\nระดมความสามารถของฝ่ายข่าวกรอง แล้วหาสาเหตุดีมั้ย?"
10147-CVGroup_Relationship_Up_3-1 = "ถ้าอยู่กับครู แม้แต่ที่มืดก็ไม่ได้น่ากลัวเท่าไร"
10147-CVGroup_Relationship_Up_4-1 = "เราทำสัญญาพันปีกันไว้แล้วนี่นา\nจากนี้ไปก็ต้องอยู่ข้างๆ ฉันต่อไปนะ ครู"
10147-CVGroup_Tactic_In_1-1 = "เอาละ แพนเดโมเนียม โซไซตี้บุกเต็มกำลัง"
10147-CVGroup_Tactic_In_2-1 = "ใช้การสะกดจิตจบง่ายๆ ไม่ได้เหรอ..."
10147-CVGroup_Tactic_Victory_1-1 = "ฮุฮุ เป็นชัยชนะของพลังแห่งข้อมูลสินะ"
10147-CVGroup_Tactic_Victory_2-1 = "จะแสดงความขอบคุณต่อความช่วยเหลือของฉันก็ได้นะ ครู"
