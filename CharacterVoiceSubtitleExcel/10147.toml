[translation]
10147-CVGroup_Battle_Buffed_1-1 = "あら、ありがとう～"
10147-CVGroup_Battle_Covered_1-1 = "痛いのはイヤよ！"
10147-CVGroup_Battle_Defense_1-1 = "ふ～ん、無駄なのに。"
10147-CVGroup_Battle_In_1-1 = "痛くしないでね……？"
10147-CVGroup_Battle_In_2-1 = "私は隅で応援しているわね。"
10147-CVGroup_Battle_Move_1-1 = "まだ何か残っているのかしら。"
10147-CVGroup_Battle_Move_2-1 = "終わりじゃないの？"
10147-CVGroup_Battle_Recovery_1-1 = "あら、ありがとう。"
10147-CVGroup_Battle_TacticalAction_1-1 = "ひゃっ！"
10147-CVGroup_Battle_Victory_1-1 = "ふふっ、当然の結果ね。"
10147-CVGroup_Battle_Victory_2-1 = "先生と私の勝利、というべきかしら？"
10147-CVGroup_CommonSkill-1 = "嫌～！"
10147-CVGroup_ExSkill_1-1 = "あら、そこにいたの。\n浜辺は危険がたくさんあるの。\nさあ、紫外線対策を始めるわよ。"
10147-CVGroup_ExSkill_2-1 = "こっちに来て頂戴。\n無防備すぎるわね。\n遠慮しなくていいのよ？"
10147-CVGroup_ExSkill_3-1 = "そのままでは危険よ！\nじっとしていなさい……。\n私が塗ってあげるから。"
10147-CVGroup_ExSkill_Level_1-1 = "日焼けには注意するのよ。"
10147-CVGroup_ExSkill_Level_2-1 = "紫外線がどれだけ危険なのか……知っているわよね？"
10147-CVGroup_ExSkill_Level_3-1 = "遠慮しないで頂戴。"
10147-CVGroup_Formation_In_1-1 = "私が出るのかしら？"
10147-CVGroup_Formation_In_2-1 = "痛いのは苦手なんだけど……。"
10147-CVGroup_Formation_Select-1 = "あら？抱っこしてほしいのかしら？"
10147-CVGroup_Growup_1-1 = "強くなった気がするわね。\nふふっ……データは正直よ？"
10147-CVGroup_Growup_2-1 = "生存率が上がったわね。"
10147-CVGroup_Growup_3-1 = "ふふっ、NKウルトラ計画がまた一歩、進んだわね。"
10147-CVGroup_Growup_4-1 = "いつも助けてもらってばかりね……ありがとう、先生。"
10147-CVGroup_Relationship_Up_1-1 = "引き続き、私のそばで守っていて頂戴。"
10147-CVGroup_Relationship_Up_2-1 = "なんだか変な気分ね。\n情報部の総力をあげて、理由を突き止めた方がいいのかもしれないわ。"
10147-CVGroup_Relationship_Up_3-1 = "先生と一緒にいると……どんなに暗い場所でも、あまり怖くないの。"
10147-CVGroup_Relationship_Up_4-1 = "千年の約束は絶対よ、先生。\nこれからもずっと、私のそばにいて頂戴ね。"
10147-CVGroup_Tactic_In_1-1 = "万魔殿、総攻撃よ。"
10147-CVGroup_Tactic_In_2-1 = "催眠で終わらせたいのだけど……。"
10147-CVGroup_Tactic_Victory_1-1 = "ふふっ、情報が勝利の鍵なのよ？"
10147-CVGroup_Tactic_Victory_2-1 = "感謝してもいいのよ、先生？"
