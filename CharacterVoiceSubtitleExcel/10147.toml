[translation]
10147-CVGroup_Battle_Buffed_1-1 = "훌륭한 판단이네~"
10147-CVGroup_Battle_Covered_1-1 = "아픈 건 싫다구~"
10147-CVGroup_Battle_Defense_1-1 = "흐응~ 소용없다구?"
10147-CVGroup_Battle_In_1-1 = "아프지 않게 부탁해~"
10147-CVGroup_Battle_In_2-1 = "나는 구석에서 응원하고 있을게."
10147-CVGroup_Battle_Move_1-1 = "하아, 또 뭐가 남은 걸까?"
10147-CVGroup_Battle_Move_2-1 = "응? 끝난 거 아니었어?"
10147-CVGroup_Battle_Recovery_1-1 = "고마워~"
10147-CVGroup_Battle_TacticalAction_1-1 = "히양~"
10147-CVGroup_Battle_Victory_1-1 = "후후, 당연한 결과야."
10147-CVGroup_Battle_Victory_2-1 = "선생과 나의 승리, 랄까?"
10147-CVGroup_CommonSkill-1 = "시, 싫어~!"
10147-CVGroup_ExSkill_1-1 = "아, 거기 있었네.\n해변은 위험하다구?\n자아, 자외선 대책이야!"
10147-CVGroup_ExSkill_2-1 = "이쪽으로 와.\n너무 무방비한 거 아냐?\n사양하지 않아도 된다구?"
10147-CVGroup_ExSkill_3-1 = "이대로는 위험하겠네~\n그대로 가만히……\n내가 알아서 해줄 테니까."
10147-CVGroup_ExSkill_Level_1-1 = "햇빛 너무 받으면 안 된다?"
10147-CVGroup_ExSkill_Level_2-1 = "자외선의 위험성, 알고 있지?"
10147-CVGroup_ExSkill_Level_3-1 = "자아, 자아. 사양하지 않아도 되니까~"
10147-CVGroup_Formation_In_1-1 = "꼭 나가야 하는 거야?"
10147-CVGroup_Formation_In_2-1 = "으음…… 아픈 건 싫은데……."
10147-CVGroup_Formation_Select-1 = "어라? 안아달라는 걸까?"
10147-CVGroup_Growup_1-1 = "강해진 느낌이 드는데~\n데이터는 거짓말을 하지 않으니까."
10147-CVGroup_Growup_2-1 = "생존 확률이 더 증가한 느낌이네~"
10147-CVGroup_Growup_3-1 = "후후, 나의 NK 울트라 프로젝트가\n더욱 완성에 가까워지고 있어."
10147-CVGroup_Growup_4-1 = "매번 도움만 받네, 선생.\n항상 고마워."
10147-CVGroup_Relationship_Up_1-1 = "후후. 계속해서 나를 보호해 달라고, 선생."
10147-CVGroup_Relationship_Up_2-1 = "이상한 기분이야.\n정보부의 역량을 동원해서 원인을 알아내 볼까?"
10147-CVGroup_Relationship_Up_3-1 = "선생과 함께 있으면, 어두운 곳도 그렇게 무섭지는 않아."
10147-CVGroup_Relationship_Up_4-1 = "천 년의 약속을 했으니,\n앞으로도 계속 내 옆에 있어 줘야겠어. 선생."
10147-CVGroup_Tactic_In_1-1 = "자아, 만마전 총공격이야."
10147-CVGroup_Tactic_In_2-1 = "최면으로 쉽게 끝낼 수 없으려나……."
10147-CVGroup_Tactic_Victory_1-1 = "후후, 정보력의 승리네."
10147-CVGroup_Tactic_Victory_2-1 = "내 도움에 감사를 표해도 좋다구? 선생."
