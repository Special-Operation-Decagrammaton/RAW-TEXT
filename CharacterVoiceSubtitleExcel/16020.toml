[translation]
16020-CVGroup_Battle_Buffed_1-1 = "รู้สึกถึง... พลังอันล้นเหลือ!"
16020-CVGroup_Battle_Covered_1-1 = "กำลังกำบัง ช่วยสนับสนุนทีนะ!"
16020-CVGroup_Battle_Defense_1-1 = "ไม่เป็นไร หลบได้แล้วละ"
16020-CVGroup_Battle_In_1-1 = "FOX 4 บุก"
16020-CVGroup_Battle_In_2-1 = "เอาละ มาลุยกันให้เต็มที่เถอะ!"
16020-CVGroup_Battle_Move_1-1 = "ไปยังพิกัดซุ่มยิงถัดไป"
16020-CVGroup_Battle_Move_2-1 = "จะไปแล้วนะ"
16020-CVGroup_Battle_Recovery_1-1 = "อ่า รอดแล้ว\nแต้งกิ้ว~"
16020-CVGroup_Battle_TacticalAction_1-1 = "ดูเหมือนจะโดนเจอตัวแล้วละ"
16020-CVGroup_Battle_Victory_1-1 = "FOX 4 ภารกิจสำเร็จแล้ว!"
16020-CVGroup_Battle_Victory_2-1 = "นี่เป็นชัยชนะของกองทหาร FOX ค่ะ! เย่~♪"
16020-CVGroup_CommonSkill-1 = "เข้าเป้า"
16020-CVGroup_ExSkill_1-1 = "ระยะทาง 3,500 หลา ลมจากทิศ ENE ความเร็ว 15 น็อต..."
16020-CVGroup_ExSkill_2-1 = "จะหนีจากกระสุนเวทมนตร์นี้ได้รึเปล่านะ?"
16020-CVGroup_ExSkill_3-1 = "ฉันจะปิดฉากด้วยนัดนี้ให้ดู...! "
16020-CVGroup_ExSkill_Level_1-1 = "ปล่อยโดรนลาดตระเวน"
16020-CVGroup_ExSkill_Level_2-1 = "เจอตัวแล้ว~♪"
16020-CVGroup_ExSkill_Level_3-1 = "สลับเป็นกระสุนเจาะเกราะระเบิดแรงสูงเพลิง"
16020-CVGroup_Formation_In_1-1 = "FOX 4 เตรียมตัวพร้อมแล้ว!"
16020-CVGroup_Formation_In_2-1 = "ฮ้าวว... ถึงเวลาออกปฏิบัติการแล้วเหรอ"
16020-CVGroup_Formation_Select-1 = "โอ้ว ดูเหมือนแขนขาจะแข็งแรงกว่าที่คิดนะ?\nฮะฮ่า ถ้างั้นขอคาดหวังสักหน่อยแล้วกันนะ?"
16020-CVGroup_Growup_1-1 = "ถึงเวลาฝึกอบรมพิเศษแล้ว!"
16020-CVGroup_Growup_2-1 = "ขอบคุณที่ช่วยค่ะ คุณครู\nคุณครูเนี่ยพึ่งพาได้จริงๆ เลยน้า"
16020-CVGroup_Growup_3-1 = "วันนี้ดูพร้อมเต็มที่เลยล่ะ?\nพร้อมสำหรับการฝึกทุกรูปแบบเลย"
16020-CVGroup_Growup_4-1 = "ฮู่ว... ฉันจะให้รุ่นน้องมาเห็นด้านที่ไม่น่าดูแบบนี้ไม่ได้สิ"
16020-CVGroup_Relationship_Up_1-1 = "ฮุฮุ เป็นผู้ใหญ่ที่แปลกจริงๆ ด้วย"
16020-CVGroup_Relationship_Up_2-1 = "จนกว่าจะฟื้นฟูสถาบัน SRT กลับมาได้...\nขอฝากตัวด้วยนะ คุณครู"
16020-CVGroup_Relationship_Up_3-1 = "ฉันจะมาหาทุกครั้งที่คุณครูเรียกเลยนะ! เพราะงั้น...\nเวลาที่ฉันเรียก คุณครูก็ต้องมาด้วยล่ะ? สัญญาแล้วนะ!"
16020-CVGroup_Relationship_Up_4-1 = "ฉันจะยิงให้ตรงหัวใจของคุณเลย!\nแบบนี้รึเปล่านะ... ฮ่าฮ่า ฉันแค่อยากลองพูดดูบ้างน่ะ\nมะ... ไม่มีอะไรพิเศษหรอก"
16020-CVGroup_Tactic_In_1-1 = "ยืนยันกองกำลังศัตรู... แล้วเป้าหมายคือใครนะ?"
16020-CVGroup_Tactic_In_2-1 = "เดี๋ยวก่อน... ฉันเป็นคนนำอยู่นี่นา?"
16020-CVGroup_Tactic_Victory_1-1 = "ง่ายจังเลยแฮะ ง่ายสุดๆ ไปเลย~♪"
16020-CVGroup_Tactic_Victory_2-1 = "รีบกลับกันดีกว่า~\nหิวไส้จะขาดแล้วเนี่ย..."
