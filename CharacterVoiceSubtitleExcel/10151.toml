[translation]
10151-CVGroup_Battle_Buffed_1-1 = "공동저자, 감사합니다."
10151-CVGroup_Battle_Covered_1-1 = "천재적인 엄폐, 보시죠."
10151-CVGroup_Battle_Defense_1-1 = "로프반동 회피!"
10151-CVGroup_Battle_In_1-1 = "익숙하진 않지만…… 한 번 해보죠!"
10151-CVGroup_Battle_In_2-1 = "쏘, 쏘지마세요! 저는 특별반 반장이에요?!"
10151-CVGroup_Battle_Move_1-1 = "헤, 헤엑- 크윽, 지구력이-"
10151-CVGroup_Battle_Move_2-1 = "달리기는…… 전공이 아니에요."
10151-CVGroup_Battle_Recovery_1-1 = "훈장 추천서, 추진해볼게요."
10151-CVGroup_Battle_TacticalAction_1-1 = "하앗!"
10151-CVGroup_Battle_Victory_1-1 = "천재 과학자의 승리, 로군요."
10151-CVGroup_Battle_Victory_2-1 = "원리를 알면 간단합니다."
10151-CVGroup_CommonSkill-1 = "천재가 함께라면 기쁘죠?"
10151-CVGroup_ExSkill_1-1 = "과학과 로프반동의 힘으로!"
10151-CVGroup_ExSkill_2-1 = "타고나서 미안해요."
10151-CVGroup_ExSkill_3-1 = "링이 있었으면 더 좋았을텐데요!"
10151-CVGroup_ExSkill_Level_1-1 = "필살기, 갑니다!"
10151-CVGroup_ExSkill_Level_2-1 = "우랴아앗!!"
10151-CVGroup_ExSkill_Level_3-1 = "빠앙-! 아프죠?!"
10151-CVGroup_Formation_In_1-1 = "과학자에게 맡겨주시죠."
10151-CVGroup_Formation_In_2-1 = "편성…… 좋은 직함이네요."
10151-CVGroup_Formation_Select-1 = "와앗! 높아! 공중기술 써봐도 되나요?"
10151-CVGroup_Growup_1-1 = "지금도 천재인데……\n이대로라면, 더 천재가 될거에요……\n정말로, 괜찮으세요, 선생님?"
10151-CVGroup_Growup_2-1 = "더 이상 훈장 달 곳이 없는데……\n바지에라도 달까요."
10151-CVGroup_Growup_3-1 = "또 업적이 늘었네요."
10151-CVGroup_Growup_4-1 = "후후…… 스스로의 재능이 무섭네요."
10151-CVGroup_Relationship_Up_1-1 = "선생님, 제가 만약에\n사실은 별 볼일 없어도\n그래도…… 아, 아니에요. 아무것도."
10151-CVGroup_Relationship_Up_2-1 = "선생님께 칭찬을 받는것……\n당연하다고 생각하지 않아요.\n진심으로…… 감사합니다."
10151-CVGroup_Relationship_Up_3-1 = "말만 앞서고 허세만 부리지만……\n미워하지 않아주셔서 감사해요."
10151-CVGroup_Relationship_Up_4-1 = "최고의 훈장이라고 생각해요.\n선생님과 함께 있는 모든 순간이요."
10151-CVGroup_Tactic_In_1-1 = "사인 부탁, 거절하기 곤란하단 말이죠."
10151-CVGroup_Tactic_In_2-1 = "학술대회 같은 건가요?"
10151-CVGroup_Tactic_Victory_1-1 = "제 지식의 10%도 쓰지 못했답니다?"
10151-CVGroup_Tactic_Victory_2-1 = "아주 간단한 정리였네요."
