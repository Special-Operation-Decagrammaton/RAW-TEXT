[translation]
10151-CVGroup_Battle_Buffed_1-1 = "共同著書に感謝します。"
10151-CVGroup_Battle_Covered_1-1 = "天才的な遮蔽をご覧あれ。"
10151-CVGroup_Battle_Defense_1-1 = "ロープワーク、回避！"
10151-CVGroup_Battle_In_1-1 = "あまり慣れていませんが……やってみましょう！"
10151-CVGroup_Battle_In_2-1 = "う、撃たないでください！私は特別クラスの学級委員長ですよ！？"
10151-CVGroup_Battle_Move_1-1 = "はぁ……はぁ……くっ、持久力が。"
10151-CVGroup_Battle_Move_2-1 = "走りは……専門外です。"
10151-CVGroup_Battle_Recovery_1-1 = "勲章をいただけるよう、連絡してみましょう。"
10151-CVGroup_Battle_TacticalAction_1-1 = "はっ！"
10151-CVGroup_Battle_Victory_1-1 = "天才科学者の勝利、ですね。"
10151-CVGroup_Battle_Victory_2-1 = "原理を理解すれば簡単です。"
10151-CVGroup_CommonSkill-1 = "天才が一緒で嬉しいですよね？"
10151-CVGroup_ExSkill_1-1 = "科学とロープワークの融合っ！"
10151-CVGroup_ExSkill_2-1 = "生まれつき優秀でごめんなさい。"
10151-CVGroup_ExSkill_3-1 = "リングがあったら鬼に金棒だったのに……！"
10151-CVGroup_ExSkill_Level_1-1 = "必殺技、いきます！"
10151-CVGroup_ExSkill_Level_2-1 = "うりゃあっ！！"
10151-CVGroup_ExSkill_Level_3-1 = "ババーン！これでどうでしょう！？"
10151-CVGroup_Formation_In_1-1 = "科学者にお任せあれ。"
10151-CVGroup_Formation_In_2-1 = "編成……いい肩書ですね。"
10151-CVGroup_Formation_Select-1 = "わっ！高い！空中殺法を使ってもいいですか？"
10151-CVGroup_Growup_1-1 = "ただでさえ天才なのに……\nこのままでは、もっと天才になってしまいます……本当に、いいんですか、先生？"
10151-CVGroup_Growup_2-1 = "もう勲章をつける場所がありません……\nズボンにでもつけましょうか。"
10151-CVGroup_Growup_3-1 = "また実績が増えてしまいましたね。"
10151-CVGroup_Growup_4-1 = "ふふ……自分の才能が恐ろしいくらいです。"
10151-CVGroup_Relationship_Up_1-1 = "もし私が……\nただの一般人だったら……それでも先生は、私を……\n……い、いえ、今のは聞かなかったことに。"
10151-CVGroup_Relationship_Up_2-1 = "先生からいただけるお褒めの言葉……\nいつもいただけるものだとは思っていません。\n本当に……ありがとうございます。"
10151-CVGroup_Relationship_Up_3-1 = "見栄っ張りな私を……\n嫌いにならないでいてくださって、ありがとうございます。"
10151-CVGroup_Relationship_Up_4-1 = "先生と共に過ごすすべての時間が――\n私にとって、最高の勲章です。"
10151-CVGroup_Tactic_In_1-1 = "サインのお願い、断りづらいんですよね。"
10151-CVGroup_Tactic_In_2-1 = "学術大会のようなものでしょうか？"
10151-CVGroup_Tactic_Victory_1-1 = "まだ知識の１０％も使ってませんけど？"
10151-CVGroup_Tactic_Victory_2-1 = "とても簡単な定理でしたね。"
