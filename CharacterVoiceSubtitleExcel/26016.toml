[translation]
26016-CVGroup_CommonSkill-1 = "來，笑一個笑一個～！"
26016-CVGroup_ExSkill_1-1 = "是大海！是派對！是獨家新聞──！"
26016-CVGroup_ExSkill_2-1 = "沙卡沙卡～！沙卡沙卡～！"
26016-CVGroup_ExSkill_3-1 = "原稿，脫稿，最棒！"
26016-CVGroup_ExSkill_Level_1-1 = "耶，耶！啊！？耶嘿……！"
26016-CVGroup_ExSkill_Level_2-1 = "這，這是新發售的沙鈴！"
26016-CVGroup_ExSkill_Level_3-1 = "啊哈哈！請閃開～！"
26016-CVGroup_Formation_In_1-1 = "我要來貼身採訪囉～！"
26016-CVGroup_Formation_In_2-1 = "會發生什麼樣的事件呢！"
26016-CVGroup_Formation_Select-1 = "哇～！景色真好呢！"
26016-CVGroup_Growup_1-1 = "哇～！謝謝你，老師！"
26016-CVGroup_Growup_2-1 = "呵呵，感覺就像挖到獨家新聞一樣！"
26016-CVGroup_Growup_3-1 = "敬請期待強化過後的報導！"
26016-CVGroup_Growup_4-1 = "啊哈哈！狀態絕佳！"
26016-CVGroup_Relationship_Up_1-1 = "你想訂閱千秋……？\n耶，耶嘿嘿……好害羞哦。"
26016-CVGroup_Relationship_Up_2-1 = "跟採訪對象的過度交流必須克制！\n不過……現在沒在採訪所以不算。"
26016-CVGroup_Relationship_Up_3-1 = "跟採訪對象建立關係也很重要嘛……\n我才沒有什麼別的心思！……大概吧。"
26016-CVGroup_Relationship_Up_4-1 = "最近你和很多學生都處得很好的傳聞，原來是真的啊？\n呵呵，我可是有掌握情報的哦！"
