[translation]
26016-CVGroup_CommonSkill-1 = "เอาละ ยิ้มค่ะ ยิ้ม~!"
26016-CVGroup_ExSkill_1-1 = "ทะเล! ปาร์ตี้! สกู๊ปพิเศษ!"
26016-CVGroup_ExSkill_2-1 = "โยกเยก~ โยกเยก~!"
26016-CVGroup_ExSkill_3-1 = "ต้นฉบับ เสร็จแล้ว สุดยอด!"
26016-CVGroup_ExSkill_Level_1-1 = "เย่ เย่! อ๊ะ?! ฮิฮิ!"
26016-CVGroup_ExSkill_Level_2-1 = "ละ... ลูกแซ็กรุ่นใหม่ค่ะ!"
26016-CVGroup_ExSkill_Level_3-1 = "อะฮะฮ่า! หลบไปนะคะ~!"
26016-CVGroup_Formation_In_1-1 = "ต้องการให้เกาะติดทำข่าวสินะคะ!"
26016-CVGroup_Formation_In_2-1 = "จะเกิดความวุ่นวายแบบไหนกันนะ~!"
26016-CVGroup_Formation_Select-1 = "ว้าว~! วิวดีจังเลยค่ะ!"
26016-CVGroup_Growup_1-1 = "ว้าว! ขอบคุณค่ะ คุณครู!"
26016-CVGroup_Growup_2-1 = "ฮุฮุ เหมือนความตื่นเต้นของสกู๊ปพิเศษเลยค่ะ!"
26016-CVGroup_Growup_3-1 = "ฝากคาดหวังกับเลขาที่พาวเวอร์อัปแล้วด้วยนะคะ!"
26016-CVGroup_Growup_4-1 = "อะฮะฮ่า! สภาพดีสุดๆ เลยค่ะ!"
26016-CVGroup_Relationship_Up_1-1 = "อยากสมัครติดตามจิอากิเหรอคะ...?\nฮิ... ฮิฮิฮิ เขินจังเลยค่ะ"
26016-CVGroup_Relationship_Up_2-1 = "ห้ามมีปฏิสัมพันธ์กับแหล่งข่าวมากเกินไปนะคะ!\nแต่... ตอนนี้ไม่ได้ทำข่าวอยู่ ถือว่าไม่เป็นไรแล้วกันค่ะ"
26016-CVGroup_Relationship_Up_3-1 = "การสร้างความสัมพันธ์กับแหล่งข่าวเป็นเรื่องสำคัญค่ะ...\nไม่ได้มีความหมายอื่นนะคะ! น่าจะนะคะ..."
26016-CVGroup_Relationship_Up_4-1 = "ข่าวลือที่ว่าช่วงนี้คุณครูสนิทกับนักเรียนคนอื่นๆ\nเป็นเรื่องจริงสินะคะ? ฮุฮุ ฉันรู้หมดแล้วค่ะ!"
