[translation]
10145-CVGroup_Battle_Buffed_1-1 = "คราวหน้าก็ขอฝากด้วยนะ"
10145-CVGroup_Battle_Covered_1-1 = "เราจะหลบไปสักครู่"
10145-CVGroup_Battle_Defense_1-1 = "จงตั้งใจให้มากกว่านี้"
10145-CVGroup_Battle_In_1-1 = "ก็เป็นฤดูร้อนนี่นา จงมองดูเราไว้ให้ดีเล่า"
10145-CVGroup_Battle_In_2-1 = "เวลาเล่นก็ต้องทุ่มสุดกำลัง เป็นเรื่องธรรมดาไม่ใช่หรือ"
10145-CVGroup_Battle_Move_1-1 = "ย้ายที่กันดีมั้ย?"
10145-CVGroup_Battle_Move_2-1 = "ต่อไปคืออะไรเล่า?"
10145-CVGroup_Battle_Recovery_1-1 = "เราขอแสดงความขอบคุณ"
10145-CVGroup_Battle_TacticalAction_1-1 = "ตรงนั้นคงจะดีนะ"
10145-CVGroup_Battle_Victory_1-1 = "มองจนพอใจแล้วหรือยัง ครู?\nเช่นนั้นตอนนี้เราก็อยากขอรางวัลตอบแทนบ้าง"
10145-CVGroup_Battle_Victory_2-1 = "อากาศในสถานที่พักร้อนช่วงฤดูร้อนก็ไม่เลวนะ\nครูเองก็มาร่วมด้วยมั้ยเล่า?"
10145-CVGroup_CommonSkill-1 = "ช่างบังอาจนัก"
10145-CVGroup_ExSkill_1-1 = "เอ๋...? อึก...! เฮ้อ..."
10145-CVGroup_ExSkill_2-1 = "โอ๊ะ... ว้ายย?! มันเป็นอุบัติเหตุน่ะ..."
10145-CVGroup_ExSkill_3-1 = "ฮุฮุ... ว่าอย่างไรนะ?! ฤดูร้อนอย่างนั้นหรือ..."
10145-CVGroup_ExSkill_Level_1-1 = "ก็เย็นสบายขึ้นจริงๆ นะ..."
10145-CVGroup_ExSkill_Level_2-1 = "ดูเหมือนจะมีคนนิสัยเสียอยู่สินะ"
10145-CVGroup_ExSkill_Level_3-1 = "แค่นี้เราไม่ถือสาหรอก"
10145-CVGroup_Formation_In_1-1 = "ฤดูร้อน พักร้อน... ถึงอย่างนั้นก็ยังมีสิ่งที่ละเลยไม่ได้"
10145-CVGroup_Formation_In_2-1 = "อืม อยากใช้เวลาร่วมกับเราหรือ?\nเราก็อยากทำเช่นนั้นกับครูเหมือนกัน"
10145-CVGroup_Formation_Select-1 = "เป็นอย่างไรเล่า? เหมาะกับเราหรือเปล่า?\nฮุฮุ ค่อยๆ ดูก็ได้นะ"
10145-CVGroup_Growup_1-1 = "สิ่งที่เรียกว่าวันพรุ่งนี้น่ะ เป็นเรื่องดีนะ\nอืม พอๆ กับวันหยุดพักผ่อนนั่นละ"
10145-CVGroup_Growup_2-1 = "เพราะมีเวลาว่าง คนเราจึงเติบโตได้\nนั่นเป็นเรื่องที่ดีนะ"
10145-CVGroup_Growup_3-1 = "รู้หรือเปล่า ครู? ทั้งหมดนี้ก็เป็นเพราะครูคอยเฝ้ามองเรามาตลอด\nจะขอบคุณครูอย่างไรก็ยังไม่พอเลยทีเดียว"
10145-CVGroup_Growup_4-1 = "คุณครู! คิกิโตขึ้นแล้วค่ะ! ฮุฮุ ตกใจมากเลยหรือครู?\nเรื่องเมื่อครู่นี้ ให้เป็นความลับระหว่างเราสองคนนะ"
10145-CVGroup_Relationship_Up_1-1 = "ดอกไม้ใต้ร่มใบยังคงอยู่ แม้วสันต์ผ่านพ้น\nแสงตะวันลอดเมฆบางยังสว่างกลางสายฝน\nถึงจะเป็นคำเปรียบเปรยที่เดาได้ไม่ยาก แต่พอจะรู้หรือไม่...\nว่าดอกไม้และแสงตะวันหมายถึงผู้ใด? ฮุฮุ"
10145-CVGroup_Relationship_Up_2-1 = "รูปลักษณ์คือส่วนที่อยู่นอกสุดของจิตใจไม่ใช่หรือ?\nการแต่งกายก็ย่อมต้องเหมาะกับกาลเทศะ\nฮุฮุ... ใช่แล้วละ นั่นเลยเป็นเหตุผลที่เราสวมชุดนี้ต่อหน้าคุณ"
10145-CVGroup_Relationship_Up_3-1 = "ว่ากันว่าหากได้อยู่เคียงข้างสหายร่วมชีวิต\nแม้เปลวเพลิงนับพันกัลป์ก็ไม่หวั่น...\nเราจึงอยากให้ครูอยู่เคียงข้างกันเช่นนี้เรื่อยไป"
10145-CVGroup_Relationship_Up_4-1 = "คือว่านะ คุณครู คิกิน่ะ... ชอบคุณครูที่สุดในโลกเลยค่ะ!\nฮุฮุ อย่าทำหน้าแบบนั้นสิ ควรจะชินได้แล้วไม่ใช่หรือ?"
10145-CVGroup_Tactic_In_1-1 = "เอาละ มาลองหาเส้นทางกันเถอะ"
10145-CVGroup_Tactic_In_2-1 = "ไม่มีร่มไม้บ้างหรือ?"
10145-CVGroup_Tactic_Victory_1-1 = "วันนี้เป็นวันหยุดไม่ใช่หรือ?"
10145-CVGroup_Tactic_Victory_2-1 = "เราแค่หาความสำราญในแบบของเราน่ะ"
