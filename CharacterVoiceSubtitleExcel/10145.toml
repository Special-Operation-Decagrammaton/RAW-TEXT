[translation]
10145-CVGroup_Battle_Buffed_1-1 = "I shall rely on you next time as well."
10145-CVGroup_Battle_Covered_1-1 = "I shall take shelter for a moment."
10145-CVGroup_Battle_Defense_1-1 = "Do try harder."
10145-CVGroup_Battle_In_1-1 = "It is summer. Therefore, please take all of me in."
10145-CVGroup_Battle_In_2-1 = "One must play wholeheartedly. It is natural."
10145-CVGroup_Battle_Move_1-1 = "Let us sally forth."
10145-CVGroup_Battle_Move_2-1 = "And to where next?"
10145-CVGroup_Battle_Recovery_1-1 = "You have my gratitude."
10145-CVGroup_Battle_TacticalAction_1-1 = "I approve of here."
10145-CVGroup_Battle_Victory_1-1 = "Did you bear witness to me, Sensei? I desire my reward now."
10145-CVGroup_Battle_Victory_2-1 = "While on vacation, the summer air is somewhat pleasant. Would you like to enjoy it with me, Sensei?"
10145-CVGroup_CommonSkill-1 = "How insolent."
10145-CVGroup_ExSkill_1-1 = "Hm...? Ugh...! *sigh*"
10145-CVGroup_ExSkill_2-1 = "Huh... Kyah?! That was an accident..."
10145-CVGroup_ExSkill_3-1 = "Fufu... What?! It is summer, I suppose..."
10145-CVGroup_ExSkill_Level_1-1 = "It's cooled down..."
10145-CVGroup_ExSkill_Level_2-1 = "What an insolent fellow."
10145-CVGroup_ExSkill_Level_3-1 = "I feel no offense."
10145-CVGroup_Formation_In_1-1 = "Summer, vacation... Regardless, standards must be upheld..."
10145-CVGroup_Formation_In_2-1 = "Hm, do you desire to spend time with me? However, I am the one who desires to spend time with you, Sensei."
10145-CVGroup_Formation_Select-1 = "Tell me your thoughts. Does this suit me? Fufu, take your time to soak it in."
10145-CVGroup_Growup_1-1 = "The promise of tomorrow is a delightful thing. Mm. As is vacation."
10145-CVGroup_Growup_2-1 = "One must be given the space to grow in order to do so. This is excellent."
10145-CVGroup_Growup_3-1 = "Are you aware, Sensei? This was only possible with your guidance. I cannot express my gratitude enough."
10145-CVGroup_Growup_4-1 = "Sensei! Kiki has grown! Fufu. Did I surprise you, Sensei? That shall be our little secret..."
10145-CVGroup_Relationship_Up_1-1 = "Flowers linger past spring's end under the cover of leaves, and sunlight still pierces through the rainclouds. Perhaps too obvious of a metaphor, but... Do you know who is the flower, and who the sunlight? Fufu."
10145-CVGroup_Relationship_Up_2-1 = "Is it not said that one's appearance is merely a superficial representation of the inner self? Therefore, one must dress to the occasion. Fufu... Which is indeed why I wear this before you."
10145-CVGroup_Relationship_Up_3-1 = "It is said that the company of a lifelong friend will banish fear entirely... Therefore, please remain by my side, Sensei."
10145-CVGroup_Relationship_Up_4-1 = "You know, Sensei. Kiki...likes Sensei the most! Fufu. Stop with that look. It is time you grow accustomed to Kiki."
10145-CVGroup_Tactic_In_1-1 = "We shall uncover the path."
10145-CVGroup_Tactic_In_2-1 = "Is there the shade of a tree nearby?"
10145-CVGroup_Tactic_Victory_1-1 = "I believe I mandated today be my vacation."
10145-CVGroup_Tactic_Victory_2-1 = "That was rather entertaining."
