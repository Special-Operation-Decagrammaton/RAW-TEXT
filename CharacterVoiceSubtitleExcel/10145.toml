[translation]
10145-CVGroup_Battle_Buffed_1-1 = "下次也有勞汝了。"
10145-CVGroup_Battle_Covered_1-1 = "稍微，藏身一下吧。"
10145-CVGroup_Battle_Defense_1-1 = "還不夠精進呢。"
10145-CVGroup_Battle_In_1-1 = "可要將夏日的妾身確實烙印於眼中哦？"
10145-CVGroup_Battle_In_2-1 = "若要玩樂自當全力以赴。此為理所當然吧？"
10145-CVGroup_Battle_Move_1-1 = "換個地方吧。"
10145-CVGroup_Battle_Move_2-1 = "接著是何處？"
10145-CVGroup_Battle_Recovery_1-1 = "感謝。"
10145-CVGroup_Battle_TacticalAction_1-1 = "移動吧。"
10145-CVGroup_Battle_Victory_1-1 = "汝都看見了吧？老師。\n來吧……對於努力過的學生，總該有些獎勵的吧？"
10145-CVGroup_Battle_Victory_2-1 = "偶爾避暑一下也不錯呢。\n那麼老師……這之後的行程可還空著嗎？"
10145-CVGroup_CommonSkill-1 = "無禮之徒。"
10145-CVGroup_ExSkill_1-1 = "哦呀……？\n唔……！？\n唉……"
10145-CVGroup_ExSkill_2-1 = "哦……\n呀啊！？\n這是，意外罷了……"
10145-CVGroup_ExSkill_3-1 = "呵呵……\n什──！？\n……真是夏日呢。"
10145-CVGroup_ExSkill_Level_1-1 = "雖說確是涼快了些……唉。"
10145-CVGroup_ExSkill_Level_2-1 = "看來是有狂妄之輩呢。"
10145-CVGroup_ExSkill_Level_3-1 = "這點程度並不會令妾身不快。"
10145-CVGroup_Formation_In_1-1 = "真是的……\n妾身本想安然度日的呢。"
10145-CVGroup_Formation_In_2-1 = "呼呣，想與妾身共度時光嗎？\n呵呵，妾身本就如此打算哦？"
10145-CVGroup_Formation_Select-1 = "如何？可還合適？\n呵呵，慢慢欣賞便可。"
10145-CVGroup_Growup_1-1 = "有明日可期是件令人欣喜之事。\n唔呣，至少如同休假一般呢。"
10145-CVGroup_Growup_2-1 = "正因留有餘白，人方能成長。\n是樁好事呢。"
10145-CVGroup_Growup_3-1 = "正因有汝一路守望……\n妾身方能行至今日。\n難以言盡感激之情。"
10145-CVGroup_Growup_4-1 = "妃妃，成～長！\n呵呵，嚇一跳了吧？老師。\n這可是我們兩人的祕密哦？"
10145-CVGroup_Relationship_Up_1-1 = "新葉、成蔭、涼意盎然……春去來幾日，夏雲忽嵯峨\n呵呵……汝可明白其中之意？"
10145-CVGroup_Relationship_Up_2-1 = "常言道，外表乃內在的最外層對吧？\n故而理應有與時宜場合相應的裝束。\n呵呵……是啊。\n因此，妾身才特地於汝面前穿上此身哦。"
10145-CVGroup_Relationship_Up_3-1 = "常言道，若與畢生摯友同行，無論去往何處都無所畏懼對吧？\n所以……汝可願與妾身相伴至天涯盡處呢？老師。"
10145-CVGroup_Relationship_Up_4-1 = "妃妃啊……\n世界第一，最喜歡老師了！\n呵呵。別露出那種表情啊。\n事到如今也該習以為常了吧？"
10145-CVGroup_Tactic_In_1-1 = "呼呣，前去探路吧。"
10145-CVGroup_Tactic_In_2-1 = "有沒有樹蔭呢。"
10145-CVGroup_Tactic_Victory_1-1 = "唉……本該是來休假的啊。"
10145-CVGroup_Tactic_Victory_2-1 = "真是場不錯的餘興呢。"
