[translation]
10153-CVGroup_Battle_Buffed_1-1 = "감사합니다! 힘낼게요!"
10153-CVGroup_Battle_Defense_1-1 = "피했어요!"
10153-CVGroup_Battle_In_1-1 = "작전, 시작입니다!"
10153-CVGroup_Battle_In_2-1 = "모두 함께니까, 괜찮을거예요!"
10153-CVGroup_Battle_Move_1-1 = "시야 확보 할게요!"
10153-CVGroup_Battle_Move_2-1 = "제가 먼저 갈게요!"
10153-CVGroup_Battle_Recovery_1-1 = "감사합니다, 도움이 되었어요!"
10153-CVGroup_Battle_TacticalAction_1-1 = "파이, 팅-!"
10153-CVGroup_Battle_Victory_1-1 = "모두, 수고하셨어요!"
10153-CVGroup_Battle_Victory_2-1 = "또 한번, 경험을 쌓았네요!"
10153-CVGroup_CommonSkill-1 = "레이싱 페로로님, 부탁드려요!"
10153-CVGroup_ExSkill_1-1 = "TOT 사격, 개시합니다!"
10153-CVGroup_ExSkill_2-1 = "효력사, 부탁드려요!"
10153-CVGroup_ExSkill_3-1 = "포미 확보, 발포합니다!"
10153-CVGroup_ExSkill_Level_1-1 = "근접 포격에 주의해주세요!"
10153-CVGroup_ExSkill_Level_2-1 = "협차 확인! 멋지네요!"
10153-CVGroup_ExSkill_Level_3-1 = "차탄 장전, 부탁드려요!"
10153-CVGroup_Formation_In_1-1 = "경기, 곧 시작이군요!"
10153-CVGroup_Formation_In_2-1 = "목표는 완주, 입니다!"
10153-CVGroup_Formation_Select-1 = "꺄앗?! 선생님?!"
10153-CVGroup_Growup_1-1 = "감사합니다!\n이걸로 조금은……\n특별해질 수 있겠죠?"
10153-CVGroup_Growup_2-1 = "이런 모습으로 샬레에 있어도,\n이상하거나 하지…… 않죠?"
10153-CVGroup_Growup_3-1 = "괜찮으시겠어요?!\n아무 특별함 없는 제게,\n이렇게나……."
10153-CVGroup_Growup_4-1 = "저, 더 노력할게요!\n선생님이 기대해주시니까요!"
10153-CVGroup_Relationship_Up_1-1 = "선생님? 저…… 이 옷이요-\n네? 어떤 모습이어도,\n좋다구요……? 에, 에헤헤……."
10153-CVGroup_Relationship_Up_2-1 = "아우우…… 선생님께는\n매번 감사한 일 뿐이에요.\n항상, 감사합니다."
10153-CVGroup_Relationship_Up_3-1 = "같이, 전차 타지 않으실래요?\n전차 안은 안전하기도 하고,\n제가 지켜드릴 수도 있으니까요."
10153-CVGroup_Relationship_Up_4-1 = "제게 특별하다고 말씀해주신거……\n저, 기억하고 있어요. 정말로 \n기뻐요, 선생님. 감사합니다."
10153-CVGroup_Tactic_In_1-1 = "코스 확인 하셨나요?"
10153-CVGroup_Tactic_In_2-1 = "저도 힘낼게요!"
10153-CVGroup_Tactic_Victory_1-1 = "위험구간, 통과했어요!"
10153-CVGroup_Tactic_Victory_2-1 = "무사히 끝났어요…… 여러분들 덕분이에요!"
