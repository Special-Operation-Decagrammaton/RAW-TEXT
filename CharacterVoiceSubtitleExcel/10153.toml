[translation]
10153-CVGroup_Battle_Buffed_1-1 = "ありがとうございます！頑張ります！"
10153-CVGroup_Battle_Defense_1-1 = "避けました！"
10153-CVGroup_Battle_In_1-1 = "作戦スタートです！"
10153-CVGroup_Battle_In_2-1 = "一緒なら大丈夫です！"
10153-CVGroup_Battle_Move_1-1 = "視野を確保します！"
10153-CVGroup_Battle_Move_2-1 = "私が前を行きます！"
10153-CVGroup_Battle_Recovery_1-1 = "ありがとうございます、助かりました！"
10153-CVGroup_Battle_TacticalAction_1-1 = "ふぁいっ、おー！"
10153-CVGroup_Battle_Victory_1-1 = "みなさん、お疲れ様でした！"
10153-CVGroup_Battle_Victory_2-1 = "また1つ、経験を積めました！"
10153-CVGroup_CommonSkill-1 = "レーシングペロロ様！お願いします！"
10153-CVGroup_ExSkill_1-1 = "TOT射撃、開始します！"
10153-CVGroup_ExSkill_2-1 = "効力射、お願いします！"
10153-CVGroup_ExSkill_3-1 = "砲尾確保、発砲します！"
10153-CVGroup_ExSkill_Level_1-1 = "至近弾に注意してください！"
10153-CVGroup_ExSkill_Level_2-1 = "夾叉を確認！素敵です！"
10153-CVGroup_ExSkill_Level_3-1 = "次弾装填、お願いします！"
10153-CVGroup_Formation_In_1-1 = "そろそろレースが始まるんですね！"
10153-CVGroup_Formation_In_2-1 = "目標は完走、です！"
10153-CVGroup_Formation_Select-1 = "ひゃっ！？先生！？"
10153-CVGroup_Growup_1-1 = "ありがとうございます！\nこれで少しは……特別になれたでしょうか？"
10153-CVGroup_Growup_2-1 = "この格好でシャーレにいて、変……じゃないでしょうか？"
10153-CVGroup_Growup_3-1 = "いいんですか！？\nなんの取り柄もない私に、こんなに……。"
10153-CVGroup_Growup_4-1 = "私、もっと頑張りますね！\n……先生のご期待に、応えたいんです！"
10153-CVGroup_Relationship_Up_1-1 = "先生？あの……この衣装――\nえ？どんな格好をしていても、好き……？え、えへへ……。"
10153-CVGroup_Relationship_Up_2-1 = "あうぅ……先生には感謝してもしきれないです。\nいつも、ありがとうございます。"
10153-CVGroup_Relationship_Up_3-1 = "一緒に、戦車に乗りませんか？\n戦車の中は安全ですから。\nそれに、私が先生をお守りできますし。"
10153-CVGroup_Relationship_Up_4-1 = "「ヒフミは特別な存在だよ」、って言ってくださったこと……私、忘れません。\n本当に嬉しいです、先生。ありがとうございます。"
10153-CVGroup_Tactic_In_1-1 = "コースの確認はしましたか？"
10153-CVGroup_Tactic_In_2-1 = "私も頑張ります！"
10153-CVGroup_Tactic_Victory_1-1 = "危険地帯を抜けました！"
10153-CVGroup_Tactic_Victory_2-1 = "無事に終わりました……みなさんのおかげです！"
