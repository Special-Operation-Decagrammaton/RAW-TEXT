[translation]
10146-CVGroup_Battle_Buffed_1-1 = "Focus support on me!"
10146-CVGroup_Battle_Covered_1-1 = "Everyone, serve as my shield!"
10146-CVGroup_Battle_Defense_1-1 = "I am being attacked?!"
10146-CVGroup_Battle_In_1-1 = "Don't fall behind, everyone!"
10146-CVGroup_Battle_In_2-1 = "I'll finish this within 3 minutes."
10146-CVGroup_Battle_Move_1-1 = "They were small fries."
10146-CVGroup_Battle_Move_2-1 = "Th-That wasn't the end?!"
10146-CVGroup_Battle_Recovery_1-1 = "Couldn't you have treated me sooner?"
10146-CVGroup_Battle_TacticalAction_1-1 = "I was just about to move, anyway."
10146-CVGroup_Battle_Victory_1-1 = "It was a simple and expected victory."
10146-CVGroup_Battle_Victory_2-1 = "It was not even necessary for me to step in."
10146-CVGroup_CommonSkill-1 = "I, the Great Makoto, am here."
10146-CVGroup_ExSkill_1-1 = "I shall take you to a new horizon."
10146-CVGroup_ExSkill_2-1 = "Kihehe! This sea belongs to Gehenna!"
10146-CVGroup_ExSkill_3-1 = "Weigh anchor! It's time to set sail!"
10146-CVGroup_ExSkill_Level_1-1 = "I haven't gone rusty... Augh?! ...Not yet."
10146-CVGroup_ExSkill_Level_2-1 = "That was simple... Wh-What 's that?! Who goes there?!"
10146-CVGroup_ExSkill_Level_3-1 = "Kihehe! That's all...? Eeek?! ...A-All according to the plan!"
10146-CVGroup_Formation_In_1-1 = "Is the situation serious enough to interrupt my rest?"
10146-CVGroup_Formation_In_2-1 = "Let's get this done quickly. I am currently on a break."
10146-CVGroup_Formation_Select-1 = "Hmm... So, where are we again...?"
10146-CVGroup_Growup_1-1 = "The optimal support required for the best leader. You have my thanks."
10146-CVGroup_Growup_2-1 = "You expect me to do even more than this? You are truly troublesome, Sensei. Kihe."
10146-CVGroup_Growup_3-1 = "Huh? You have a unique perspective, Sensei. To think there was still something for me to learn."
10146-CVGroup_Growup_4-1 = "Kihehe. The training is truly as brutal as I've heard. Anyone other than me would not have been able to handle this."
10146-CVGroup_Relationship_Up_1-1 = "Hmph. It's good that you've now realized this. That's right, you need only look at me."
10146-CVGroup_Relationship_Up_2-1 = "Do you treat other students the same way? ...I do not quite understand."
10146-CVGroup_Relationship_Up_3-1 = "Could it be that you changed your mind? If you wish to walk with me, I am more than willing... But it seems like you still need more time to think."
10146-CVGroup_Relationship_Up_4-1 = "They say your clothes affect your state of mind, but... No! It's nothing!"
10146-CVGroup_Tactic_In_1-1 = "Do I take the lead from here?"
10146-CVGroup_Tactic_In_2-1 = "How did I get thrown into this mess...?"
10146-CVGroup_Tactic_Victory_1-1 = "Kihehe! Yet another achievement to add to my autobiography!"
10146-CVGroup_Tactic_Victory_2-1 = "We're done here. Let's leave this filthy place at once."
