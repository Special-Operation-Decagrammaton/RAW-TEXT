[translation]
10146-CVGroup_Battle_Buffed_1-1 = "支援を集中させよ！"
10146-CVGroup_Battle_Covered_1-1 = "私の盾となる栄誉をくれてやろう！"
10146-CVGroup_Battle_Defense_1-1 = "おい！なんとかしろ！"
10146-CVGroup_Battle_In_1-1 = "後れをとるな！いくぞ！"
10146-CVGroup_Battle_In_2-1 = "3分以内に終わらせてやろう。"
10146-CVGroup_Battle_Move_1-1 = "私一人で十分だ。"
10146-CVGroup_Battle_Move_2-1 = "お、終わったんじゃないのか！？"
10146-CVGroup_Battle_Recovery_1-1 = "まったく、遅いではないか。"
10146-CVGroup_Battle_TacticalAction_1-1 = "いま移動しようとしていたところだ。"
10146-CVGroup_Battle_Victory_1-1 = "当然の勝利だな。喜ぶほどのことではない。"
10146-CVGroup_Battle_Victory_2-1 = "キキッ！マコト様が出るまでもなかったな。"
10146-CVGroup_CommonSkill-1 = "羽沼マコト、ここにあり。"
10146-CVGroup_ExSkill_1-1 = "新たな地へ連れて行ってやろう。"
10146-CVGroup_ExSkill_2-1 = "キキキッ！ここをゲヘナの海とする！"
10146-CVGroup_ExSkill_3-1 = "出航の時はきた！錨を上げろ！"
10146-CVGroup_ExSkill_Level_1-1 = "錆びついては……むっ！？いないようだな。"
10146-CVGroup_ExSkill_Level_2-1 = "造作もな……っ！？誰だ！？"
10146-CVGroup_ExSkill_Level_3-1 = "キキキッ！この程度……ひいっ！？……け、計画通りだ！"
10146-CVGroup_Formation_In_1-1 = "この私の休暇を潰すほどの事態なのか？"
10146-CVGroup_Formation_In_2-1 = "急いで終わらせるぞ！\nマコト様はオフなのだからな。"
10146-CVGroup_Formation_Select-1 = "ああ、理解したとも……それで、我々がいるのは？"
10146-CVGroup_Growup_1-1 = "最適な支援、感謝する。\nやはり優秀なリーダーには相応の品が必要だからな。"
10146-CVGroup_Growup_2-1 = "もっと活躍してほしいのか？\n先生も困った人だな、キキッ。"
10146-CVGroup_Growup_3-1 = "ほう？実に斬新な視点だ。\n新たな学びを得られるとはな。"
10146-CVGroup_Growup_4-1 = "キキキッ。噂通り、厳しい指導だな。\n私だからこそ、耐えられるのだとも言えよう。"
10146-CVGroup_Relationship_Up_1-1 = "ふっ。ようやく分かったのだな。\n――そうだ。マコト様さえ見ていればそれで良い。"
10146-CVGroup_Relationship_Up_2-1 = "先生は他の生徒にも同じように接するのか？\n……理解できないな。"
10146-CVGroup_Relationship_Up_3-1 = "私と共に歩む覚悟は決まったのか？\nでは、今すぐ――なるほど、構わんぞ。\n優秀なリーダーは気が長いものだ。"
10146-CVGroup_Relationship_Up_4-1 = "服装はイメージに影響を及ぼすのでは……いや！何でもない！"
10146-CVGroup_Tactic_In_1-1 = "ああ、指揮は任せろ。片付けてやろう。"
10146-CVGroup_Tactic_In_2-1 = "なぜこのようなことをせねばならない……。"
10146-CVGroup_Tactic_Victory_1-1 = "キキッ！この偉大なる業績を自伝に追記しなければな！"
10146-CVGroup_Tactic_Victory_2-1 = "終わったのだ。さっさと去るとしよう。"
