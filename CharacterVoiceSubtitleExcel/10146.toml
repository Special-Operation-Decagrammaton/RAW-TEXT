[translation]
10146-CVGroup_Battle_Buffed_1-1 = "내게 지원을 집중하라!"
10146-CVGroup_Battle_Covered_1-1 = "다들 이 몸의 방패가 돼라!"
10146-CVGroup_Battle_Defense_1-1 = "공격받고 있지 않느냐?!"
10146-CVGroup_Battle_In_1-1 = "다들, 뒤처지지 마라!"
10146-CVGroup_Battle_In_2-1 = "3분 안에 끝내주지."
10146-CVGroup_Battle_Move_1-1 = "별거 없는 놈들이로군."
10146-CVGroup_Battle_Move_2-1 = "끄, 끝이 아니었다고?!"
10146-CVGroup_Battle_Recovery_1-1 = "더 빨리 치료할 수는 없었나?"
10146-CVGroup_Battle_TacticalAction_1-1 = "안 그래도 이동할 참이었다."
10146-CVGroup_Battle_Victory_1-1 = "간단하고, 당연한 승리다."
10146-CVGroup_Battle_Victory_2-1 = "이 몸이 나설 만한 일도 아니었군."
10146-CVGroup_CommonSkill-1 = "마코토, 여기 있나니."
10146-CVGroup_ExSkill_1-1 = "이 몸이 데려다 주마. 새로운 지평으로."
10146-CVGroup_ExSkill_2-1 = "키히힛! 이 바다는 게헨나의 것이다!"
10146-CVGroup_ExSkill_3-1 = "닻을 올려라! 항해의 시간이다!"
10146-CVGroup_ExSkill_Level_1-1 = "이 몸도 녹슬지는, 우왁?! ……않았군."
10146-CVGroup_ExSkill_Level_2-1 = "이 정도쯤이야 간단…… 뭐, 뭐냣?! 누구냐?!"
10146-CVGroup_ExSkill_Level_3-1 = "키히힛! 고작 이 정도…… 히익?! ……계, 계획대로군!"
10146-CVGroup_Formation_In_1-1 = "내 휴식을 방해할 만큼 중대사인가?"
10146-CVGroup_Formation_In_2-1 = "최대한 빨리 끝내지. 지금 이 몸께서는 휴가 중이란 말이다."
10146-CVGroup_Formation_Select-1 = "으음…… 그러니까, 지금 우리가 있는 위치가……?"
10146-CVGroup_Growup_1-1 = "최고의 리더에게 필요한, 최적의 지원이다. 감사하지."
10146-CVGroup_Growup_2-1 = "나에게 이 이상의 활약을 바라는 건가? 선생도 참으로 난감한 사람이로군. 키킥."
10146-CVGroup_Growup_3-1 = "호오? 선생의 관점은 참으로 신선하군. 이 몸에게 아직 배울 것이 남아 있을 줄이야."
10146-CVGroup_Growup_4-1 = "키키킥. 듣던 대로 가혹하기 짝에 없는 지도로군. 이 몸이 아니었다면 누구라도 소화하지 못했을 거다."
10146-CVGroup_Relationship_Up_1-1 = "훗. 이제라도 알았다면 좋다. 그래, 이 몸만을 바라보면 된다."
10146-CVGroup_Relationship_Up_2-1 = "선생은 다른 학생들에게도 똑같이 대우하나? ……잘 이해가 안 가는군."
10146-CVGroup_Relationship_Up_3-1 = "혹시 마음이 바뀌었나? 이 몸과 함께하겠다면, 지금이라도 이 몸은…… 아직 생각할 시간이 더 필요한 모양이군."
10146-CVGroup_Relationship_Up_4-1 = "옷차림이 심상에 영향을 준다고는 하지만…… 아니! 아무것도 아니다!"
10146-CVGroup_Tactic_In_1-1 = "여기서부터는 이 몸이 지시하면 되나?"
10146-CVGroup_Tactic_In_2-1 = "어째서 이 몸께서 이런 아수라장에……."
10146-CVGroup_Tactic_Victory_1-1 = "키키킷! 자서전에 추가할 또 다른 업적 한 줄이로군!"
10146-CVGroup_Tactic_Victory_2-1 = "볼일은 끝났다. 어서 이 지저분한 곳을 떠나지."
