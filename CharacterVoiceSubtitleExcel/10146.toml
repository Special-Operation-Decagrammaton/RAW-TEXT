[translation]
10146-CVGroup_Battle_Buffed_1-1 = "รวมการสนับสนุนมาที่เรา!"
10146-CVGroup_Battle_Covered_1-1 = "ทุกคน จงเป็นโล่ให้เรา!"
10146-CVGroup_Battle_Defense_1-1 = "กำลังถูกโจมตีอยู่ไม่ใช่เหรอ?!"
10146-CVGroup_Battle_In_1-1 = "ทุกคน อย่ามาช้าล่ะ!"
10146-CVGroup_Battle_In_2-1 = "เราจะจบให้ภายใน 3 นาที"
10146-CVGroup_Battle_Move_1-1 = "เป็นพวกที่ไม่มีอะไรพิเศษเลยสินะ"
10146-CVGroup_Battle_Move_2-1 = "ยะ... ยังไม่จบงั้นเหรอ?!"
10146-CVGroup_Battle_Recovery_1-1 = "รักษาให้เร็วกว่านี้ไม่ได้เหรอ?"
10146-CVGroup_Battle_TacticalAction_1-1 = "เราก็กำลังจะเคลื่อนย้ายอยู่พอดี"
10146-CVGroup_Battle_Victory_1-1 = "เป็นชัยชนะที่ง่ายดายและแน่นอน"
10146-CVGroup_Battle_Victory_2-1 = "ไม่ใช่เรื่องที่ถึงกับต้องให้เราออกโรงเลย"
10146-CVGroup_CommonSkill-1 = "มาโคโตะผู้นี้ อยู่ ณ ที่แห่งนี้แล้ว"
10146-CVGroup_ExSkill_1-1 = "เราจะพาไปสู่ขอบฟ้าใหม่เอง"
10146-CVGroup_ExSkill_2-1 = "คิกคิกคิก! ทะเลแห่งนี้เป็นของเกเฮนน่า!"
10146-CVGroup_ExSkill_3-1 = "ยกสมอ! ได้เวลาออกเรือแล้ว!"
10146-CVGroup_ExSkill_Level_1-1 = "เราเองก็ อ๊าก?! ยังไม่ขึ้นสนิมสินะ..."
10146-CVGroup_ExSkill_Level_2-1 = "แค่นี้ง่ายนิดเดียว... อะ... อะไรน่ะ?! ใครกัน?!"
10146-CVGroup_ExSkill_Level_3-1 = "คิกคิกคิก! เรื่องจิ๊บจ๊อยแค่นี้... เฮือก?!\nปะ... เป็นไปตามแผนสินะ!"
10146-CVGroup_Formation_In_1-1 = "เป็นเรื่องใหญ่ถึงขั้นรบกวนเวลาพักของเราเลยเหรอ?"
10146-CVGroup_Formation_In_2-1 = "เราจะรีบจบให้เร็วที่สุด ก็ตอนนี้เรากำลังอยู่ในช่วงพักร้อนนี่"
10146-CVGroup_Formation_Select-1 = "อืม... สรุปว่า ตอนนี้ตำแหน่งที่พวกเราอยู่คือ...?"
10146-CVGroup_Growup_1-1 = "เป็นการสนับสนุนที่เหมาะที่สุดสำหรับผู้นำสูงสุด ขอบใจนะ"
10146-CVGroup_Growup_2-1 = "อยากให้เราแสดงผลงานมากกว่านี้อีกเหรอ?\nครูนี่ ช่างเป็นคนที่น่าลำบากใจจริงๆ คิกคิก"
10146-CVGroup_Growup_3-1 = "โอ้? มุมมองของครูช่างสดใหม่จริงๆ\nไม่นึกเลยว่าเรายังมีสิ่งต้องเรียนรู้อยู่อีก"
10146-CVGroup_Growup_4-1 = "คิกคิกคิก เป็นการสั่งการที่โหดร้ายตามที่ได้ยินมาเลย\nถ้าไม่ใช่เรา คงไม่มีใครรับมือไหวแน่"
10146-CVGroup_Relationship_Up_1-1 = "หึ ถ้าเข้าใจตอนนี้ก็ยังดี\nใช่แล้ว แค่มองเราเพียงคนเดียวก็พอ"
10146-CVGroup_Relationship_Up_2-1 = "ครูปฏิบัติกับนักเรียนคนอื่นแบบเดียวกันด้วยเหรอ?\nไม่ค่อยเข้าใจเลย..."
10146-CVGroup_Relationship_Up_3-1 = "หรือว่าเปลี่ยนใจแล้ว? ถ้าคิดจะอยู่เคียงข้างเรา ตอนนี้เราก็...\nดูเหมือนยังต้องใช้เวลาคิดมากกว่านี้นะ"
10146-CVGroup_Relationship_Up_4-1 = "ถึงจะบอกว่าการแต่งกายส่งผลต่อจิตใจ...\nไม่สิ! ไม่มีอะไรทั้งนั้น!"
10146-CVGroup_Tactic_In_1-1 = "จากตรงนี้ ให้เราเป็นคนสั่งการก็พอใช่มั้ย?"
10146-CVGroup_Tactic_In_2-1 = "ทำไมเราถึงต้องมาอยู่ในความชุลมุนแบบนี้นะ..."
10146-CVGroup_Tactic_Victory_1-1 = "คิกคิกคิก! เป็นความสำเร็จอีกอย่างที่จะเพิ่มลงใน\nอัตชีวประวัติของเรา!"
10146-CVGroup_Tactic_Victory_2-1 = "ธุระเสร็จแล้ว รีบออกจากที่รกๆ แบบนี้กันเถอะ"
