[translation]
10146-CVGroup_Battle_Buffed_1-1 = "把支援集中到我這裡！"
10146-CVGroup_Battle_Covered_1-1 = "就賜予你們成為我盾牌的榮譽吧！"
10146-CVGroup_Battle_Defense_1-1 = "喂！想點辦法啊！"
10146-CVGroup_Battle_In_1-1 = "別落後了！上吧！"
10146-CVGroup_Battle_In_2-1 = "三分鐘之內解決掉。"
10146-CVGroup_Battle_Move_1-1 = "我一個人就夠了。"
10146-CVGroup_Battle_Move_2-1 = "還，還沒結束嗎！？"
10146-CVGroup_Battle_Recovery_1-1 = "真是的，也太慢了吧。"
10146-CVGroup_Battle_TacticalAction_1-1 = "我正打算移動呢。"
10146-CVGroup_Battle_Victory_1-1 = "這是理所當然的勝利，還不到值得高興的地步。"
10146-CVGroup_Battle_Victory_2-1 = "嘻嘻！根本不需要真琴大人出手嘛。"
10146-CVGroup_CommonSkill-1 = "羽沼真琴，就在這裡。"
10146-CVGroup_ExSkill_1-1 = "就帶你前往新天地吧。"
10146-CVGroup_ExSkill_2-1 = "嘰嘻嘻嘻！就將這裡視為格黑娜的海域！"
10146-CVGroup_ExSkill_3-1 = "啟航的時刻到了！起錨！"
10146-CVGroup_ExSkill_Level_1-1 = "生鏽了嗎……唔！？看來是沒有呢。"
10146-CVGroup_ExSkill_Level_2-1 = "不費吹灰之……！？是誰！？"
10146-CVGroup_ExSkill_Level_3-1 = "嘻嘻嘻！就這種程度……咿！？\n……都，都在計畫之中！"
10146-CVGroup_Formation_In_1-1 = "事態嚴重到值得犧牲本大人的假期嗎？"
10146-CVGroup_Formation_In_2-1 = "快點結束吧！\n畢竟我真琴大人正在休假。"
10146-CVGroup_Formation_Select-1 = "啊啊，我明白了……所以，我們現在在哪裡？"
10146-CVGroup_Growup_1-1 = "最合適的支援，感謝你。\n果然優秀的領袖就該配得上相稱的物品啊。"
10146-CVGroup_Growup_2-1 = "希望我更加活躍嗎？\n老師還真是個令人傷腦筋的人啊，嘻嘻。"
10146-CVGroup_Growup_3-1 = "哦？真是個嶄新的觀點。\n沒想到能學到新知啊。"
10146-CVGroup_Growup_4-1 = "嘻嘻嘻。是如傳聞所言嚴格的指導呢。\n也能說正因為是本大人，才有辦法撐得下去吧。"
10146-CVGroup_Relationship_Up_1-1 = "哼。你總算明白了啊。\n──沒錯。只要看著我真琴大人就夠了。"
10146-CVGroup_Relationship_Up_2-1 = "老師對其他學生也是這樣對待的嗎？\n……真是無法理解。"
10146-CVGroup_Relationship_Up_3-1 = "做好跟我並肩同行的覺悟了嗎？\n那麼，現在馬上──原來如此，無妨。\n優秀的領袖是很有耐心的。"
10146-CVGroup_Relationship_Up_4-1 = "服裝不是會影響形象嗎……不！沒什麼！"
10146-CVGroup_Tactic_In_1-1 = "啊啊，指揮就交給我吧。我會收拾乾淨的。"
10146-CVGroup_Tactic_In_2-1 = "為什麼非得做這種事……"
10146-CVGroup_Tactic_Victory_1-1 = "嘻嘻！得把這偉大的功績加到自傳裡才行！"
10146-CVGroup_Tactic_Victory_2-1 = "結束了。快點離開這裡吧。"
