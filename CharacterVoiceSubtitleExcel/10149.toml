10149-CVGroup_Relationship_Up_3-1 = "(갑자기 가슴이 심하게 뛰는데…… 어째서지? 뭔가 문제가 생긴 걸까……?)"
10149-CVGroup_Relationship_Up_4-1 = "저 된장국을 너무 많이 끓여버렸는데……\n이따가 찾아가도 괜찮을까요?"
10149-CVGroup_Tactic_In_1-1 = "수심 확인. 하강을 개시합니다."
