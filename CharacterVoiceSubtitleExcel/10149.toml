[translation]
10149-CVGroup_Battle_Buffed_1-1 = "ありがとうございます！"
10149-CVGroup_Battle_Defense_1-1 = "い、今のは……？"
10149-CVGroup_Battle_In_1-1 = "みんな、頑張ろうね！"
10149-CVGroup_Battle_In_2-1 = "バディチェック・フィニッシュ。\nネガティブエントリー。"
10149-CVGroup_Battle_Move_1-1 = "移動します。"
10149-CVGroup_Battle_Move_2-1 = "ラインに沿っていきましょう。"
10149-CVGroup_Battle_Recovery_1-1 = "いただきますね！"
10149-CVGroup_Battle_TacticalAction_1-1 = "次のポイントへ行きましょう。"
10149-CVGroup_Battle_Victory_1-1 = "あっ、えっとその……お疲れ様でした！"
10149-CVGroup_Battle_Victory_2-1 = "えっと、シャワーを浴びてきても良いでしょうか……？"
10149-CVGroup_CommonSkill-1 = "水中グレネード……起爆！"
10149-CVGroup_ExSkill_1-1 = "バックロールエントリー……準備完了です。"
10149-CVGroup_ExSkill_2-1 = "3、2……1。"
10149-CVGroup_ExSkill_3-1 = "作業を、始めます……！"
10149-CVGroup_ExSkill_Level_1-1 = "ダイブ、ダイブ！"
10149-CVGroup_ExSkill_Level_2-1 = "Orca 1, Going down."
10149-CVGroup_ExSkill_Level_3-1 = "フレシェット弾に変更します。"
10149-CVGroup_Formation_In_1-1 = "はい、準備はできています！"
10149-CVGroup_Formation_In_2-1 = "潜水の準備、できています！"
10149-CVGroup_Formation_Select-1 = "ひゃっ！ま、待ってください……！\nそっちの方に引っ張ると、バックルが外れちゃいます……！"
10149-CVGroup_Growup_1-1 = "これで、もっと長く潜ることができそうです……！"
10149-CVGroup_Growup_2-1 = "ありがとうございます、先生。\nこれからも頑張りますね……！"
10149-CVGroup_Growup_3-1 = "先生がサポートしてくださるおかげで、とても心強いです。"
10149-CVGroup_Growup_4-1 = "海は広くて……まだまだ分からないことも多いのですが。\n少しだけ分かってきたような気がします。"
10149-CVGroup_Relationship_Up_1-1 = "先生は海、好きですか……？\n私は……好き、です。"
10149-CVGroup_Relationship_Up_2-1 = "水の中でも、外でも――\n先生の安全は、私が守ります。"
10149-CVGroup_Relationship_Up_3-1 = "（胸がドキドキする……なんだろう……病気かな……？）"
10149-CVGroup_Relationship_Up_4-1 = "あの……お味噌汁を作りすぎてしまって……\nもらっていただくことって可能でしょうか？"
10149-CVGroup_Tactic_In_1-1 = "水深、確認。潜降を開始します。"
10149-CVGroup_Tactic_In_2-1 = "残圧確認。BCD異常なし。"
10149-CVGroup_Tactic_Victory_1-1 = "ふぅ……ちゃんと準備しててよかったです！"
10149-CVGroup_Tactic_Victory_2-1 = "みんな、怪我はありませんか？"
