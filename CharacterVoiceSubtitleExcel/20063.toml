[translation]
20063-CVGroup_CommonSkill-1 = "아, 깜빡했다. 우웅."
20063-CVGroup_ExSkill_1-1 = "내가 힘이 될 수 있다면."
20063-CVGroup_ExSkill_2-1 = "이걸로 힘이 난다면, 좋다고 생각해."
20063-CVGroup_ExSkill_3-1 = "가르쳐준 대로 할게."
20063-CVGroup_ExSkill_Level_1-1 = "지원, 도착."
20063-CVGroup_ExSkill_Level_2-1 = "도와주러 왔어."
20063-CVGroup_ExSkill_Level_3-1 = "진입 개시!"
20063-CVGroup_Summon_Retreat_01-1 = "지원 완료, 퇴출!"
20063-CVGroup_Summon_Retreat_02-1 = "전술적 오판했어……!"
20063-CVGroup_Formation_In_1-1 = "좋아, 내가 필요하구나."
20063-CVGroup_Formation_In_2-1 = "선생님도, 준비 됐어?"
20063-CVGroup_Formation_Select-1 = "고마워, 선생님. 마침 높은곳에서 보고싶었어."
20063-CVGroup_Growup_1-1 = "고마워, 선생님에게는 항상 도움만 받게되네."
20063-CVGroup_Growup_2-1 = "더 강해질거야. ……소중한 모두를 지킬 수 있게."
20063-CVGroup_Growup_3-1 = "선생님의 기대에 부응하고 싶어."
20063-CVGroup_Growup_4-1 = "지원해주는 것, 항상 든든해서 좋아."
20063-CVGroup_Relationship_Up_1-1 = "기쁘다, 즐겁다…….\n다른 표현도 더 알았다면 좋았을텐데."
20063-CVGroup_Relationship_Up_2-1 = "모든 것, 절대로 허무하지 않았어."
20063-CVGroup_Relationship_Up_3-1 = "수 많은 인연, 놓치고 싶지 않아."
20063-CVGroup_Relationship_Up_4-1 = "고마워. 곁에 있어주는 선생님이 좋아."
