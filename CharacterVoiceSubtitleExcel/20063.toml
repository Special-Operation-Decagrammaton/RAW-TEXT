[translation]
20063-CVGroup_CommonSkill-1 = "あっ、忘れてた。んっ。"
20063-CVGroup_ExSkill_1-1 = "私が力になれるなら。"
20063-CVGroup_ExSkill_2-1 = "これで元気になるなら、いいんだけど。"
20063-CVGroup_ExSkill_3-1 = "教え通りに。"
20063-CVGroup_ExSkill_Level_1-1 = "支援、到着。"
20063-CVGroup_ExSkill_Level_2-1 = "手伝いに来た。"
20063-CVGroup_ExSkill_Level_3-1 = "進入開始！"
20063-CVGroup_Summon_Retreat_01-1 = "支援完了！撤退する！"
20063-CVGroup_Summon_Retreat_02-1 = "戦術を読み違えた……！"
20063-CVGroup_Formation_In_1-1 = "私が必要？分かった。"
20063-CVGroup_Formation_In_2-1 = "先生も準備はいい？"
20063-CVGroup_Formation_Select-1 = "感謝する、先生。ちょうど上から見下ろしたかったんだ。"
20063-CVGroup_Growup_1-1 = "ありがとう。先生には助けてもらってばかりだ。"
20063-CVGroup_Growup_2-1 = "もっと強くなる。……大切な人を守れるように。"
20063-CVGroup_Growup_3-1 = "先生の期待に応えていきたい。"
20063-CVGroup_Growup_4-1 = "先生の支援があるから、安心して戦える。"
20063-CVGroup_Relationship_Up_1-1 = "嬉しい、楽しい……。\n他に表現できる言葉があればいいのに。"
20063-CVGroup_Relationship_Up_2-1 = "今は知ってる。全てが虚しいわけじゃないって。"
20063-CVGroup_Relationship_Up_3-1 = "これまで結んできた絆を大切にしたいんだ。"
20063-CVGroup_Relationship_Up_4-1 = "ありがとう。そばにいてくれる先生が、好きだ。"
