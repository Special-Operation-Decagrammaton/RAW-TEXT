[translation]
10141-CVGroup_Battle_Buffed_1-1 = "為，為什麼會是我這種人……！？"
10141-CVGroup_Battle_Defense_1-1 = "你這個……！"
10141-CVGroup_Battle_In_1-1 = "不可原諒不可原諒不可原諒……"
10141-CVGroup_Battle_In_2-1 = "我，我要上了！"
10141-CVGroup_Battle_Move_1-1 = "接，接下來是哪裡呢？"
10141-CVGroup_Battle_Move_2-1 = "這邊結束了！"
10141-CVGroup_Battle_Recovery_1-1 = "不，不用為我做到這種地步……！"
10141-CVGroup_Battle_TacticalAction_1-1 = "哼！"
10141-CVGroup_Battle_Victory_1-1 = "下，下次也，一定會……！"
10141-CVGroup_Battle_Victory_2-1 = "全部，都是託大家的福……！"
10141-CVGroup_CommonSkill-1 = "各位……！一起加油吧……！"
10141-CVGroup_ExSkill_1-1 = "老，老師！？……可惡！"
10141-CVGroup_ExSkill_2-1 = "危險！……不可原諒！"
10141-CVGroup_ExSkill_3-1 = "哇啊啊……！？……我，我要把你消滅！"
10141-CVGroup_ExSkill_Level_1-1 = "請消失吧！"
10141-CVGroup_ExSkill_Level_2-1 = "竟敢對老師做出這種事……！"
10141-CVGroup_ExSkill_Level_3-1 = "看招……！"
10141-CVGroup_Formation_In_1-1 = "我，我出發了！"
10141-CVGroup_Formation_In_2-1 = "我，我會盡……全力的……！"
10141-CVGroup_Formation_Select-1 = "適，適合我嗎？哪，哪有啦……耶嘿嘿……"
10141-CVGroup_Growup_1-1 = "真的……可以收下嗎……？"
10141-CVGroup_Growup_2-1 = "這麼貴重的東西竟然要給我……！？\n我，我該怎麼回禮才好……！"
10141-CVGroup_Growup_3-1 = "竟然為了我這種人……真的，非常感謝您……！"
10141-CVGroup_Growup_4-1 = "只要有了這份力量……老師的敵人我就能全部掃平……！"
10141-CVGroup_Relationship_Up_1-1 = "謝謝您，謝謝您，\n真的非常謝謝您……！"
10141-CVGroup_Relationship_Up_2-1 = "很漂亮……啊啊，這件禮服，很漂亮吧。\n咦，我，我嗎……！？"
10141-CVGroup_Relationship_Up_3-1 = "唔，我……這麼幸福，真的可以嗎……？"
10141-CVGroup_Relationship_Up_4-1 = "謝謝您。\n我最重要的……老師……"
10141-CVGroup_Tactic_In_1-1 = "只要和老師一起，不管去哪裡都可以……！"
10141-CVGroup_Tactic_In_2-1 = "我要碾碎……所有人……！"
10141-CVGroup_Tactic_Victory_1-1 = "果，果然老師很厲害！"
10141-CVGroup_Tactic_Victory_2-1 = "是的！垃圾已經塞進垃圾桶裡了！"
