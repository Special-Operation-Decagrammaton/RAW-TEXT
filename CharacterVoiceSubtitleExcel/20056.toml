[translation]
20056-CVGroup_CommonSkill-1 = "อุวะฮะฮ่า! ปัง! ปัง!"
20056-CVGroup_ExSkill_1-1 = "อุวะฮะฮ่า! ...ว้ากกกก?!"
20056-CVGroup_ExSkill_2-1 = "มาเล่นกันหน่อยมั้ย! ....ว้ากกกก?!"
20056-CVGroup_ExSkill_3-1 = "โคยูกิคัมแบ็กแล้ว! ...ว้ากกกก?!"
20056-CVGroup_ExSkill_Level_1-1 = "ทะ... ทับกันหมดแล้ว! ทับกันไปหมดแล้ว!"
20056-CVGroup_ExSkill_Level_2-1 = "บะ... แบบนี้เรียกว่าโชคดีใช่มั้ยคะ...?!"
20056-CVGroup_ExSkill_Level_3-1 = "มะ... ไม่ใช่ความผิดของฉันสักหน่อย!"
20056-CVGroup_Formation_In_1-1 = "กะแล้วเชียว! คงจะมีแค่ฉันสินะคะ?!"
20056-CVGroup_Formation_In_2-1 = "ลุยกันเถอะค่ะ!!!"
20056-CVGroup_Formation_Select-1 = "ว้าก! เดี๋ยวสิ ครั้งนี้ฉันไม่ได้เป็นคนทำนะคะ!"
20056-CVGroup_Growup_1-1 = "วะฮ่าฮ่า! ขอบคุณนะคะ คุณครู!"
20056-CVGroup_Growup_2-1 = "การไม่ปฎิเสธสิ่งที่มอบให้คือมารยาทที่สุภาพ! ขอบคุณนะคะ!"
20056-CVGroup_Growup_3-1 = "เท่านี้ฉันก็ไม่กลัวอะไรแล้วละค่ะ!\nไม่สิ... ก็ไม่ได้เป็นแบบนั้นเสมอไปหรอกค่ะ!"
20056-CVGroup_Growup_4-1 = "หะ... ให้ฉันทั้งหมดเลยเหรอคะ...?\nละ... แล้วคุณครูจะเหลืออะไรล่ะคะ...?"
20056-CVGroup_Relationship_Up_1-1 = "ของขวัญเหรอเนี่ย...!\nวันนี้วันอะไรกันนะคะ...?"
20056-CVGroup_Relationship_Up_2-1 = "มีแค่คุณครูที่จะรู้ได้นะคะ\nรหัสผ่านสู่หัวใจของฉันน่ะ...!"
20056-CVGroup_Relationship_Up_3-1 = "ทำขนาดนี้เลยเหรอเนี่ย...!\nมะ... มันเป็นเรื่องดีแน่นอนค่ะ!"
20056-CVGroup_Relationship_Up_4-1 = "วะฮ่าฮ่าฮ่า! คิดแล้วเชียวว่าเวลาที่อยู่กับคุณครู\nเป็นเวลาที่สนุกที่สุดเลยละค่ะ!"
