[translation]
10143-CVGroup_Formchange_Shun_Battle_Buffed_1-1 = "謝謝您。"
10143-CVGroup_Formchange_Shun_Battle_Covered_1-1 = "稍微躲一下。"
10143-CVGroup_Formchange_Shun_Battle_Defense_1-1 = "但是還得再加把勁才行哦？"
10143-CVGroup_Formchange_Shun_Battle_In_1-1 = "要好好注意腳下哦。"
10143-CVGroup_Formchange_Shun_Battle_In_2-1 = "請好好跟上不要走散了哦。"
10143-CVGroup_Formchange_Shun_Battle_Move_1-1 = "接下來會有什麼在等著呢？"
10143-CVGroup_Formchange_Shun_Battle_Move_2-1 = "就是那裡呢。"
10143-CVGroup_Formchange_Shun_Battle_Recovery_1-1 = "呼。得救了。"
10143-CVGroup_Formchange_Shun_Battle_TacticalAction_1-1 = "我們移動到那邊去吧。"
10143-CVGroup_Formchange_Shun_Battle_Victory_1-1 = "是的，真是非常美好的一天呢。"
10143-CVGroup_Formchange_Shun_Battle_Victory_2-1 = "能和大家一起玩……真的很開心。"
10143-CVGroup_Formchange_Shun_CommonSkill-1 = "哎呀真是的……呵呵。"
10143-CVGroup_Formchange_Shun_ExSkill_1-1 = "呵呵。\n哎呀？\n問題解決了呢。"
10143-CVGroup_Formchange_Shun_ExSkill_2-1 = "真開心。\n啊？\n繼續吧。"
10143-CVGroup_Formchange_Shun_ExSkill_3-1 = "呀啊！\n那是……？\n呵呵呵。"
10143-CVGroup_Formchange_Shun_ExSkill_Level_1-1 = "哎呀哎呀。"
10143-CVGroup_Formchange_Shun_ExSkill_Level_2-1 = "要小心哦？"
10143-CVGroup_Formchange_Shun_ExSkill_Level_3-1 = "發生什麼事了嗎？"
10143-CVGroup_Formchange_Shun_Formation_In_1-1 = "玩耍時要小心別受傷哦。"
10143-CVGroup_Formchange_Shun_Formation_In_2-1 = "有什麼事的話，要馬上告訴我哦？"
10143-CVGroup_Formchange_Shun_Formation_Select-1 = "哎呀……要把我舉高高嗎？呵呵。"
10143-CVGroup_Formchange_Shun_Formchange-1 = "哎呀，請稍等一下哦。"
10143-CVGroup_Formchange_Shun_Growup_1-1 = "看著孩子們的成長，內心就會變得非常溫暖呢。\n咦？老師也是懷著同樣的心情看待我的……？\n真，真是的……謝謝您。"
10143-CVGroup_Formchange_Shun_Growup_2-1 = "為了持續成長而努力是很重要的。\n所以說，我也是……能像這樣被老師守望著真的很開心。"
10143-CVGroup_Formchange_Shun_Growup_3-1 = "即便是我也還能繼續成長嗎……？\n那個……我也會，像其他孩子一樣忍不住想撒嬌呢。"
10143-CVGroup_Formchange_Shun_Growup_4-1 = "梅花園的教官……是屬於守望孩子們的立場。\n所以……像這樣自己成為學生的立場，總覺得有點難為情呢。"
10143-CVGroup_Formchange_Shun_Relationship_Up_1-1 = "我準備了熱帶水果哦。\n有沒有什麼想吃的呢？\n全部，都是老師的，所以請隨意享用喜歡的吧。"
10143-CVGroup_Formchange_Shun_Relationship_Up_2-1 = "如果說，能和我兩人獨處的話……\n老師想做什麼呢？\n我……有想做的事情哦。"
10143-CVGroup_Formchange_Shun_Relationship_Up_3-1 = "即使是夏天也不能大意。\n因為夏季感冒最可怕了。\n要是老師感冒了，我會為您看病的……"
10143-CVGroup_Formchange_Shun_Relationship_Up_4-1 = "所謂回憶，是快樂的、美麗的……\n有時，也會讓人感到些許寂寥。\n我倒是希望，它能始終保持美麗呢。"
10143-CVGroup_Formchange_Shun_Tactic_In_1-1 = "沒問題的，有我跟著呢。"
10143-CVGroup_Formchange_Shun_Tactic_In_2-1 = "請相信我。"
10143-CVGroup_Formchange_Shun_Tactic_Victory_1-1 = "來，各位。要好好跟上來哦？"
10143-CVGroup_Formchange_Shun_Tactic_Victory_2-1 = "請不要太慌張哦～"
