[translation]
10143-CVGroup_Formchange_Shun_Battle_Buffed_1-1 = "ขอบคุณนะคะ~"
10143-CVGroup_Formchange_Shun_Battle_Covered_1-1 = "ขอหลบสักครู่นะคะ"
10143-CVGroup_Formchange_Shun_Battle_Defense_1-1 = "พยายามอีกนิดนะคะ"
10143-CVGroup_Formchange_Shun_Battle_In_1-1 = "ระวังทางเดินด้วยค่ะ"
10143-CVGroup_Formchange_Shun_Battle_In_2-1 = "ค่อยๆ ตามมานะคะ~"
10143-CVGroup_Formchange_Shun_Battle_Move_1-1 = "ต่อไปจะมีอะไรกันนะคะ?"
10143-CVGroup_Formchange_Shun_Battle_Move_2-1 = "อยู่ตรงนั้นค่ะ"
10143-CVGroup_Formchange_Shun_Battle_Recovery_1-1 = "ฮู่ว... ขอบคุณค่ะ"
10143-CVGroup_Formchange_Shun_Battle_TacticalAction_1-1 = "ไปทางนั้นกันดีมั้ยคะ?"
10143-CVGroup_Formchange_Shun_Battle_Victory_1-1 = "วันนี้เป็นวันที่ดีจริงๆ เลยนะคะ"
10143-CVGroup_Formchange_Shun_Battle_Victory_2-1 = "ได้เล่นกับทุกคน... สนุกมากเลยค่ะ"
10143-CVGroup_Formchange_Shun_CommonSkill-1 = "ตายจริง ฮุฮุฮุ"
10143-CVGroup_Formchange_Shun_ExSkill_1-1 = "ฮุฮุ เอ๋? แก้ปัญหาเรียบร้อยแล้วสินะคะ"
10143-CVGroup_Formchange_Shun_ExSkill_2-1 = "ดีจังเลยค่ะ~ หืม? ไปต่อกันดีมั้ยคะ?"
10143-CVGroup_Formchange_Shun_ExSkill_3-1 = "อ๊าย! นั่นมัน...? ฮุฮุฮุ"
10143-CVGroup_Formchange_Shun_ExSkill_Level_1-1 = "ตายจริง ตายจริง"
10143-CVGroup_Formchange_Shun_ExSkill_Level_2-1 = "ต้องระวังหน่อยแล้วนะคะ~"
10143-CVGroup_Formchange_Shun_ExSkill_Level_3-1 = "ไม่มีอะไรเกิดขึ้นใช่มั้ยคะ?"
10143-CVGroup_Formchange_Shun_Formation_In_1-1 = "ต้องระวังเรื่องอุบัติเหตุให้ดีนะคะ"
10143-CVGroup_Formchange_Shun_Formation_In_2-1 = "ถ้ามีอะไรเกิดขึ้น อย่าลืมบอกฉันนะคะ"
10143-CVGroup_Formchange_Shun_Formation_Select-1 = "ตายจริง เล่นชูสูงๆ... งั้นเหรอคะ? ฮุฮุ"
10143-CVGroup_Formchange_Shun_Formchange-1 = "อุ๊ย รอสักครู่นะคะ"
10143-CVGroup_Formchange_Shun_Growup_1-1 = "การเติบโตเป็นเรื่องที่มีความหมายนะคะ\nโดยเฉพาะการได้เฝ้ามองเด็กๆ เติบโต คะ?\nคุณครูก็มองฉันด้วยความรู้สึกแบบเดียวกัน...? ธะ... โธ่... คุณครูนี่ก็นะ..."
10143-CVGroup_Formchange_Shun_Growup_2-1 = "การเป็นคนที่ดียิ่งขึ้น... ฉันคิดว่านั่นเป็นเรื่องสำคัญมากจริงๆ ค่ะ\nเพราะงั้น ฉันเองก็... ดีใจมากจริงๆ ที่คุณครูคอยเฝ้ามองค่ะ"
10143-CVGroup_Formchange_Shun_Growup_3-1 = "ฉันเองก็ยัง... เติบโตต่อไปได้อีกมั้ยคะ?\nถ้ามองในแง่นั้น เมื่ออยู่ต่อหน้าคุณครู\nบางทีฉันก็อาจยังคง... เป็นเด็กอยู่ก็ได้นะคะ"
10143-CVGroup_Formchange_Shun_Growup_4-1 = "ผู้ฝึกสอนแห่งสวนต้นบ๊วย... มีหน้าที่คอยดูแลเด็กๆ ค่ะ\nเพราะงั้น... การที่ฉันมาอยู่ในฐานะนักเรียนแบบนี้\nก็รู้สึกเขินอยู่เหมือนกันนะคะ"
10143-CVGroup_Formchange_Shun_Relationship_Up_1-1 = "ฉันเตรียมผลไม้ฤดูร้อนไว้หลายอย่างเลยค่ะ\nมีอะไรที่อยากทานเป็นพิเศษมั้ยคะ?\nทั้งหมดนี้... เตรียมไว้เพื่อคุณครูค่ะ"
10143-CVGroup_Formchange_Shun_Relationship_Up_2-1 = "คุณครูคะ ถ้าเราได้อยู่กันตามลำพังในที่ที่ไม่มีใครอยู่...\nคุณครูอยากทำอะไรเหรอคะ?\nที่จริงฉัน... คิดเอาไว้แล้วว่าอยากทำอะไรค่ะ"
10143-CVGroup_Formchange_Shun_Relationship_Up_3-1 = "ได้ยินว่ามีคนเป็นหวัดเวลามาเที่ยวตามริมน้ำในฤดูร้อนเยอะเลยค่ะ\nแต่ไม่ต้องเป็นห่วงค่ะ ฉันจะคอยดูแลคุณครูเองค่ะ"
10143-CVGroup_Formchange_Shun_Relationship_Up_4-1 = "ความทรงจำนั้นทั้งสนุกและงดงาม...\nแต่บางครั้งก็ทำให้รู้สึกเหงาได้เหมือนกันนะคะ\nถึงจะอยากให้มันคงความงดงามอยู่แบบนั้นก็เถอะค่ะ"
10143-CVGroup_Formchange_Shun_Tactic_In_1-1 = "ไม่ต้องกังวลนะคะ มีฉันอยู่ทั้งคนค่ะ"
10143-CVGroup_Formchange_Shun_Tactic_In_2-1 = "เชื่อใจฉันนะคะ คุณครู"
10143-CVGroup_Formchange_Shun_Tactic_Victory_1-1 = "เอาละ ทุกคน ต้องตามมาให้ดีนะคะ?"
10143-CVGroup_Formchange_Shun_Tactic_Victory_2-1 = "ทุกคนอย่ารีบร้อนเกินไปนะคะ"
