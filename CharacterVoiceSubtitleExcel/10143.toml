[translation]
10143-CVGroup_Formchange_Shun_Battle_Buffed_1-1 = "Thank you!"
10143-CVGroup_Formchange_Shun_Battle_Covered_1-1 = "I'll hide for a moment."
10143-CVGroup_Formchange_Shun_Battle_Defense_1-1 = "Please put in more effort."
10143-CVGroup_Formchange_Shun_Battle_In_1-1 = "Please watch your step."
10143-CVGroup_Formchange_Shun_Battle_In_2-1 = "Follow me slowly!"
10143-CVGroup_Formchange_Shun_Battle_Move_1-1 = "What is in store for us next?"
10143-CVGroup_Formchange_Shun_Battle_Move_2-1 = "It's over there."
10143-CVGroup_Formchange_Shun_Battle_Recovery_1-1 = "Phew. Thank you."
10143-CVGroup_Formchange_Shun_Battle_TacticalAction_1-1 = "Shall we go?"
10143-CVGroup_Formchange_Shun_Battle_Victory_1-1 = "Today was so fun!"
10143-CVGroup_Formchange_Shun_Battle_Victory_2-1 = "It was fun...being able to play with everyone."
10143-CVGroup_Formchange_Shun_CommonSkill-1 = "Oh my. Fufu."
10143-CVGroup_Formchange_Shun_ExSkill_1-1 = "Fufu. Hm? Problem solved."
10143-CVGroup_Formchange_Shun_ExSkill_2-1 = "This is nice... Hm? Shall we continue?"
10143-CVGroup_Formchange_Shun_ExSkill_3-1 = "Kyah! Isn't that...? Fufu."
10143-CVGroup_Formchange_Shun_ExSkill_Level_1-1 = "My, oh my."
10143-CVGroup_Formchange_Shun_ExSkill_Level_2-1 = "I better be careful!"
10143-CVGroup_Formchange_Shun_ExSkill_Level_3-1 = "Nothing happened, right?"
10143-CVGroup_Formchange_Shun_Formation_In_1-1 = "Keep an eye out for accidents."
10143-CVGroup_Formchange_Shun_Formation_In_2-1 = "Make sure to tell me if something happens!"
10143-CVGroup_Formchange_Shun_Formation_Select-1 = "Oh my, oopsie-daisy...? Fufu."
10143-CVGroup_Formchange_Shun_Formchange-1 = "Oh my, one moment, please."
10143-CVGroup_Formchange_Shun_Growup_1-1 = "To grow is a special thing... Especially when you get to see children grow.\nHm? That's how you feel about me? O-Oh my, Sensei..."
10143-CVGroup_Formchange_Shun_Growup_2-1 = "I believe that trying to become a better person is very important... So it makes me happy...to know that you're watching over me."
10143-CVGroup_Formchange_Shun_Growup_3-1 = "Do I still...have room for growth? In that sense, I may still be a child in your eyes."
10143-CVGroup_Formchange_Shun_Growup_4-1 = "I have to take care of children, since I am an instructor at the Plum Blossom Garden. So it's a bit strange, becoming the student like this."
10143-CVGroup_Formchange_Shun_Relationship_Up_1-1 = "I brought different kinds of summer fruits. Is there anything you're craving? They're all...for you, Sensei."
10143-CVGroup_Formchange_Shun_Relationship_Up_2-1 = "Um, Sensei? If we were somewhere, just the two of us... What would you want to do? Because I have something in mind..."
10143-CVGroup_Formchange_Shun_Relationship_Up_3-1 = "People catch colds from going in the water during the summer more often than you'd think. But you have nothing to worry about, because I'll take care of you."
10143-CVGroup_Formchange_Shun_Relationship_Up_4-1 = "Memories are fun, beautiful...and sometimes bittersweet. Though I do hope they always stay beautiful."
10143-CVGroup_Formchange_Shun_Tactic_In_1-1 = "Don't worry. I'm here."
10143-CVGroup_Formchange_Shun_Tactic_In_2-1 = "Trust me, Sensei."
10143-CVGroup_Formchange_Shun_Tactic_Victory_1-1 = "Everyone, follow me, okay?"
10143-CVGroup_Formchange_Shun_Tactic_Victory_2-1 = "No rushing, everyone."
