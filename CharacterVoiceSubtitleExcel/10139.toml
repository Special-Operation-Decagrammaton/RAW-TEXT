10139-CVGroup_Battle_Victory_1-1 = "真是完美的指揮呢。"
10139-CVGroup_Battle_Victory_2-1 = "FOX2，任務完成。"
10139-CVGroup_CommonSkill-1 = "Danger Close……\n安全距離，已確保。\n……開始轟炸！"
10139-CVGroup_ExSkill_1-1 = "這邊，把手伸過來。"
10139-CVGroup_ExSkill_2-1 = "我來了，已經沒事了。"
10139-CVGroup_ExSkill_3-1 = "我來救你了，還能動嗎？"
10139-CVGroup_ExSkill_Level_1-1 = "煙幕支援，開始！"
10139-CVGroup_ExSkill_Level_2-1 = "反擊的時間到了。"
10139-CVGroup_ExSkill_Level_3-1 = "沒事的，這片粉塵會保護我們。"
10139-CVGroup_Formation_In_1-1 = "FOX2，準備就緒。"
10139-CVGroup_Formation_In_2-1 = "我立刻前往。"
10139-CVGroup_Formation_Select-1 = "便當也有準備好了哦。"
10139-CVGroup_Growup_1-1 = "非常感謝您總是幫助我，我很開心。"
10139-CVGroup_Growup_2-1 = "付出的努力，要是能得到回報就好了呢。"
10139-CVGroup_Growup_3-1 = "從老師獲得的一切……\n我都不會忘記的。"
10139-CVGroup_Growup_4-1 = "（就算是為了成為後輩的榜樣，也得更加努力才行……）"
10139-CVGroup_Relationship_Up_1-1 = "呵呵……果然，是個奇怪的大人呢。"
10139-CVGroup_Relationship_Up_2-1 = "覺得痛苦的時候……\n再也撐不下去的時候，請偷偷告訴我。\n老師的一切，就由我來接受。"
10139-CVGroup_Relationship_Up_3-1 = "雖然說不上是回禮……\n不過方便的話請享用吧。\n這是我特製的豆皮壽司。"
10139-CVGroup_Relationship_Up_4-1 = "雖然SRT特殊學園已經不在了……\n但因為有老師陪在身邊，才有了現在的我。謝謝您。"
10139-CVGroup_Tactic_In_1-1 = "FOX2，待命中。"
