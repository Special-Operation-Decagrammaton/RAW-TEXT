[translation]
10152-CVGroup_Battle_Buffed_1-1 = "「友情」……は大事ですから。"
10152-CVGroup_Battle_Covered_1-1 = "小休止としましょう。"
10152-CVGroup_Battle_Defense_1-1 = "ふふっ、可愛いですね。"
10152-CVGroup_Battle_In_1-1 = "悪魔の召喚儀式……ご一緒にいかがですか？"
10152-CVGroup_Battle_In_2-1 = "さあ、鎮魂歌を奏でましょう。"
10152-CVGroup_Battle_Move_1-1 = "パフォーマンスの場所を変えましょうか。"
10152-CVGroup_Battle_Move_2-1 = "あちらで待っている方がいますね。"
10152-CVGroup_Battle_Recovery_1-1 = "……温かい。"
10152-CVGroup_Battle_TacticalAction_1-1 = "せーの！"
10152-CVGroup_Battle_Victory_1-1 = "次の饗宴を楽しみにしています。"
10152-CVGroup_Battle_Victory_2-1 = "ラブ・アンド・ピース、ですね。"
10152-CVGroup_CommonSkill-1 = "ふふ、インスピレーションが湧いてきました。"
10152-CVGroup_ExSkill_1-1 = "饗宴の幕開けです。"
10152-CVGroup_ExSkill_2-1 = "この瞬間を、待っていました。"
10152-CVGroup_ExSkill_3-1 = "みなさん、準備は良いですか？"
10152-CVGroup_ExSkill_Level_1-1 = "これが社会の福祉だぁぁ！！"
10152-CVGroup_ExSkill_Level_2-1 = "平和……平和だけがあればいい！"
10152-CVGroup_ExSkill_Level_3-1 = "ラブ・アンド・ピーーーース！"
10152-CVGroup_Formation_In_1-1 = "開演の準備は整っています。"
10152-CVGroup_Formation_In_2-1 = "今日は何を聞きたいですか？"
10152-CVGroup_Formation_Select-1 = "ふふっ、この子も、立派な楽器ですよ？"
10152-CVGroup_Growup_1-1 = "先生のおかげで、降りてきました。作曲においては――\n「インスピレーション」\nが何よりも大事ですから。"
10152-CVGroup_Growup_2-1 = "ええ、喜ばしいことです。\n新しい成長の扉を開くことができるのですから。"
10152-CVGroup_Growup_3-1 = "ふふっ……奥底で眠っていた何かが、\n今、目覚めた気がします。"
10152-CVGroup_Growup_4-1 = "成長を実感したとしても、自惚れてはいけません。\n果てなき芸術の世界では――\n――「チャレンジ」。\n……が大事ですから。"
10152-CVGroup_Relationship_Up_1-1 = "音楽とは、アーティストと心を通わせること。\n……であるのなら、\n今この瞬間も音楽と呼べるのではないでしょうか？ふふっ。"
10152-CVGroup_Relationship_Up_2-1 = "ふと……心の音色を奏でたくなりました。\n言葉にできない想いも、旋律になら乗せることができますから。"
10152-CVGroup_Relationship_Up_3-1 = "シンデレラの気持ちがいまなら理解できます。\n12時を目前にして……このまま、\n時間が止まってくれればいいのに、と。\nどれほど願ったことでしょう。"
10152-CVGroup_Relationship_Up_4-1 = "人は生きていく限り、変化していくもの。\nけれど、今のこの気持ちだけは……\n永遠に変わらないでほしい、とそう思っています。"
10152-CVGroup_Tactic_In_1-1 = "ここが、今宵のステージですね。"
10152-CVGroup_Tactic_In_2-1 = "ツムギ音楽隊、出発です。"
10152-CVGroup_Tactic_Victory_1-1 = "ふふ、音楽隊の演奏はいかがでしたか？"
10152-CVGroup_Tactic_Victory_2-1 = "公演の感想、是非お聞かせください。"
