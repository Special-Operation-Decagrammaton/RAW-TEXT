[translation]
10152-CVGroup_Battle_Buffed_1-1 = "'우정' ……은 소중하니까요."
10152-CVGroup_Battle_Covered_1-1 = "잠시 쉴까요?"
10152-CVGroup_Battle_Defense_1-1 = "후후, 귀엽네요."
10152-CVGroup_Battle_In_1-1 = "악마 소환, 같이 해보실래요?"
10152-CVGroup_Battle_In_2-1 = "자, 진혼가를 연주합시다."
10152-CVGroup_Battle_Move_1-1 = "버스킹 장소를 바꿀게요."
10152-CVGroup_Battle_Move_2-1 = "아, 저쪽에 다른 관객이."
10152-CVGroup_Battle_Recovery_1-1 = "……따뜻해."
10152-CVGroup_Battle_TacticalAction_1-1 = "하나~둘!"
10152-CVGroup_Battle_Victory_1-1 = "다음 공연도, 저와 함께해요."
10152-CVGroup_Battle_Victory_2-1 = "러브 앤 피스, 랍니다."
10152-CVGroup_CommonSkill-1 = "아아, 좋은 영감이 떠올랐어요."
10152-CVGroup_ExSkill_1-1 = "향연의 막이 오릅니다."
10152-CVGroup_ExSkill_2-1 = "기다렸던 순간이네요."
10152-CVGroup_ExSkill_3-1 = "다들, 준비됐나요?"
10152-CVGroup_ExSkill_Level_1-1 = "이것이 사회 복지다!!"
10152-CVGroup_ExSkill_Level_2-1 = "평화…… 평화만 있으면 돼!"
10152-CVGroup_ExSkill_Level_3-1 = "러브 앤 피———스!"
10152-CVGroup_Formation_In_1-1 = "공연 준비는 완료되어 있답니다."
10152-CVGroup_Formation_In_2-1 = "오늘은 어떤 곡을 듣고 싶으신가요?"
10152-CVGroup_Formation_Select-1 = "후후, 이 아이도 악기랍니다?"
10152-CVGroup_Growup_1-1 = "선생님 덕분에 떠올랐어요. 작곡에서 소중한—\n'영감'이라는 선물을."
10152-CVGroup_Growup_2-1 = "네, 기쁜 일이에요.\n새로운 성장의 문을 여는 건 말이에요."
10152-CVGroup_Growup_3-1 = "후후, 내면에 잠들었던 뭔가가 깨어났어요."
10152-CVGroup_Growup_4-1 = "성장을 실감하더라도, 자만해서는 안 돼요. 끝없는 예술의 세계에서는—\n—'도전'.\n……이 중요하니까요."
10152-CVGroup_Relationship_Up_1-1 = "음악이란 아티스트와의 교감.\n그런 의미에서, 지금 이 순간도 음악과 같네요."
10152-CVGroup_Relationship_Up_2-1 = "문득…… 마음의 음색을 연주하고 싶어졌어요.\n말로는 표현할 수 없는 마음도, 선율에는 담을 수 있으니까요."
10152-CVGroup_Relationship_Up_3-1 = "신데렐라의 마음이 이제야 이해되네요.\n12시를 앞두고…… 이대로 시간이 멈추길 얼마나 바랐을지."
10152-CVGroup_Relationship_Up_4-1 = "살아간다는 것은, 변해간다는 것.\n하지만 이 순간의 마음은…… 영원했으면 좋겠네요."
10152-CVGroup_Tactic_In_1-1 = "여기가, 오늘의 무대군요."
10152-CVGroup_Tactic_In_2-1 = "츠무기 음악대, 출발합니다."
10152-CVGroup_Tactic_Victory_1-1 = "후후, 음악대의 연주는 어떠셨나요?"
10152-CVGroup_Tactic_Victory_2-1 = "공연 감상, 꼭 들려주세요."
