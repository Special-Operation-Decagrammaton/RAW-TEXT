[translation]
10137-CVGroup_Battle_Buffed_1-1 = "感謝感激大感恩～"
10137-CVGroup_Battle_Defense_1-1 = "不好好瞄準是打不到的哦。"
10137-CVGroup_Battle_In_1-1 = "把手舉起來！敢動我就開槍！\n啊……要動也沒關係哦？"
10137-CVGroup_Battle_In_2-1 = "發現現行犯！出動～"
10137-CVGroup_Battle_Move_1-1 = "就這樣下班不行嗎？"
10137-CVGroup_Battle_Move_2-1 = "咦～剩下的明天再做吧？"
10137-CVGroup_Battle_Recovery_1-1 = "謝啦～！"
10137-CVGroup_Battle_TacticalAction_1-1 = "用計程車移動嘛～！"
10137-CVGroup_Battle_Victory_1-1 = "那個……身為嫌疑人的你有權請律師在場……什麼來著？"
10137-CVGroup_Battle_Victory_2-1 = "手銬只有一副，大家要乖乖跟上哦～"
10137-CVGroup_CommonSkill-1 = "我的書！給我好好賠償啊！"
10137-CVGroup_ExSkill_1-1 = "警察登場～！"
10137-CVGroup_ExSkill_2-1 = "執行正義！！"
10137-CVGroup_ExSkill_3-1 = "給我咬緊牙關啊！"
10137-CVGroup_ExSkill_Level_1-1 = "這樣才有抓的價值！"
10137-CVGroup_ExSkill_Level_2-1 = "別抵抗了嘛！"
10137-CVGroup_ExSkill_Level_3-1 = "有意見的話，就先進來女武神吧。"
10137-CVGroup_Formation_In_1-1 = "好啦好啦，我會做的～\n唉，真麻煩……"
10137-CVGroup_Formation_In_2-1 = "今天的運勢，是第幾名來著？"
10137-CVGroup_Formation_Select-1 = "啊啊……腰好痠～"
10137-CVGroup_Growup_1-1 = "變強了！\n……感覺送醫的人也跟著增加了呢。"
10137-CVGroup_Growup_2-1 = "哦～這樣的話說不定能當上警察呢？\n開玩笑的啦～"
10137-CVGroup_Growup_3-1 = "升職嗎？太歡迎了！\n畢竟不知道什麼時候會被降職嘛！"
10137-CVGroup_Growup_4-1 = "哦！就是這個！力量都湧出來了！"
10137-CVGroup_Relationship_Up_1-1 = "怎麼啦老師，是喜歡我嗎？\n咦～？明明有很多更溫柔的孩子耶？"
10137-CVGroup_Relationship_Up_2-1 = "那個……我姑且也是個女生……\n別看我這樣，其實也挺細膩的哦？"
10137-CVGroup_Relationship_Up_3-1 = "和老師組成搭檔的話，總是會有很多好事呢！"
10137-CVGroup_Relationship_Up_4-1 = "一直以來……真的很謝謝你。\n啊，呃，那個……各方面都是。"
10137-CVGroup_Tactic_In_1-1 = "啊，有帶搜查令嗎？我沒帶哦！"
10137-CVGroup_Tactic_In_2-1 = "躲到哪裡去了呢～？"
10137-CVGroup_Tactic_Victory_1-1 = "些許的損害在容許範圍內！"
10137-CVGroup_Tactic_Victory_2-1 = "輕輕鬆鬆。連熱身都算不上呢！"
