[translation]
10140-CVGroup_Battle_Buffed_1-1 = "ไนซ์ ไทม์มิ่ง!"
10140-CVGroup_Battle_Defense_1-1 = "นี่มันโล่กันกระสุนนะ!"
10140-CVGroup_Battle_In_1-1 = "ออกปฏิบัติการได้!"
10140-CVGroup_Battle_In_2-1 = "FOX 3 บุก!"
10140-CVGroup_Battle_Move_1-1 = "เคลียร์!"
10140-CVGroup_Battle_Move_2-1 = "จะเคลื่อนย้ายไปพื้นที่ถัดไปแล้วนะ"
10140-CVGroup_Battle_Recovery_1-1 = "อ๊ะ ขอบคุณนะ!"
10140-CVGroup_Battle_TacticalAction_1-1 = "สนับสนุนให้ทีนะ!"
10140-CVGroup_Battle_Victory_1-1 = "นี่ละคุณค่าที่แท้จริงของ SRT!"
10140-CVGroup_Battle_Victory_2-1 = "รู้ซึ้งถึงพลังของหน่วยรบพิเศษบ้างรึยังล่ะ?"
10140-CVGroup_CommonSkill-1 = "หน้าอกสองนัด... เฮดช็อตอีกหนึ่งนัด!"
10140-CVGroup_ExSkill_1-1 = "เอ้า มองทางนี้นะ ชีสสสส!"
10140-CVGroup_ExSkill_2-1 = "เอ้าๆ รอยยิ้มเป็นเรื่องดีนะ"
10140-CVGroup_ExSkill_3-1 = "แนวหน้า... ฟ็อกซ์ทรอต!"
10140-CVGroup_ExSkill_Level_1-1 = "แฟลชชีลด์ เริ่มชาร์จ!"
10140-CVGroup_ExSkill_Level_2-1 = "ฉันจะรับการโจมตีทุกรูปแบบให้เอง!"
10140-CVGroup_ExSkill_Level_3-1 = "น่าตื่นเต้นใช่มั้ยล่ะ?"
10140-CVGroup_Formation_In_1-1 = "FOX 3 พร้อมปฏิบัติการแล้ว"
10140-CVGroup_Formation_In_2-1 = "ถึงตาฉันสักทีสินะ!"
10140-CVGroup_Formation_Select-1 = "ฮุฮุ ถ้าพูดถึงโล่นี่ละก็...\nดะ... เดี๋ยวก่อน! เอาคืนมานะ!"
10140-CVGroup_Growup_1-1 = "รู้สึกได้ถึงผลลัพธ์ของการฝึกเลย...\nถ้าเป็นแบบนี้ต่อไป ฉันคงหุ่นดีขึ้นเร็วๆ นี้ก็ได้นะ?"
10140-CVGroup_Growup_2-1 = "อื้ม เป็นการฝึกที่ดีจริงๆ!"
10140-CVGroup_Growup_3-1 = "รู้สึกเหมือนทัศนวิสัยกว้างขึ้นเลยละ\nอาจเป็นเพราะคุณครูอยู่ด้วยละมั้ง..."
10140-CVGroup_Growup_4-1 = "(ยิ่งร่างกายอ่อนล้า... ก็ต้องยิ่งพยายามให้มากขึ้น)"
10140-CVGroup_Relationship_Up_1-1 = "ดะ... เดี๋ยวก่อน... ลืมเรื่องระยะห่างที่เหมาะสมไปรึไง\nนี่มันใกล้เกินไปแล้ว! ใกล้จน Danger Close แล้ว!"
10140-CVGroup_Relationship_Up_2-1 = "นี่ก็เป็น... ส่วนหนึ่งของการฝึกฝนน่ะ\nยะ... อย่าเข้าใจผิดล่ะ!"
10140-CVGroup_Relationship_Up_3-1 = "ต้องการอะไรรึเปล่า?\nฉันจะไปหามาให้เอง... ไม่อยากได้อะไรเลยเหรอ?!"
10140-CVGroup_Relationship_Up_4-1 = "น่าแปลกใจตรงที่... คุณครูเป็นคนที่พึ่งพาได้น่ะ\nเป็นผู้ใหญ่ที่แปลกจริงๆ เลยนะ ฮุฮุ"
10140-CVGroup_Tactic_In_1-1 = "FOX 3 มาถึงพื้นที่เป้าหมายแล้ว"
10140-CVGroup_Tactic_In_2-1 = "ไม่ต้องห่วง ฉันจะเป็นด่านหน้าให้เอง!"
10140-CVGroup_Tactic_Victory_1-1 = "ฮุฮุ\nเห็นฝีมือของฉันชัดๆ แล้วใช่มั้ย?"
10140-CVGroup_Tactic_Victory_2-1 = "อ่า~ วันนี้ก็ลุยเต็มที่เลย\nคุณครูก็พยายามได้ดีมากเลยนะ!"
