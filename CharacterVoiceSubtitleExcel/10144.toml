[translation]
10144-CVGroup_Formchange_ShunSmall_Battle_Buffed_1-1 = "謝謝您！"
10144-CVGroup_Formchange_ShunSmall_Battle_Covered_1-1 = "躲起來！"
10144-CVGroup_Formchange_ShunSmall_Battle_Defense_1-1 = "完全沒有任何問題！"
10144-CVGroup_Formchange_ShunSmall_Battle_In_1-1 = "各位，請多多指教！"
10144-CVGroup_Formchange_ShunSmall_Battle_In_2-1 = "由我來打頭陣吧！"
10144-CVGroup_Formchange_ShunSmall_Battle_Move_1-1 = "接下來是什麼呢？"
10144-CVGroup_Formchange_ShunSmall_Battle_Move_2-1 = "就是那裡呢！"
10144-CVGroup_Formchange_ShunSmall_Battle_Recovery_1-1 = "恢復精神了！"
10144-CVGroup_Formchange_ShunSmall_Battle_TacticalAction_1-1 = "往那邊走吧！"
10144-CVGroup_Formchange_ShunSmall_Battle_Victory_1-1 = "贏了！都是多虧有老師看著！"
10144-CVGroup_Formchange_ShunSmall_Battle_Victory_2-1 = "耶嘿嘿。我做到了！請誇獎我！"
10144-CVGroup_Formchange_ShunSmall_CommonSkill-1 = "那麼……如何呢！"
10144-CVGroup_Formchange_ShunSmall_ExSkill_1-1 = "嗯……\n老師～！"
10144-CVGroup_Formchange_ShunSmall_ExSkill_2-1 = "哎呀呀……\n救救我～！"
10144-CVGroup_Formchange_ShunSmall_ExSkill_3-1 = "唔嗯……\n抱抱我～！"
10144-CVGroup_Formchange_ShunSmall_ExSkill_Level_1-1 = "我會加油的！"
10144-CVGroup_Formchange_ShunSmall_ExSkill_Level_2-1 = "嘿咻！"
10144-CVGroup_Formchange_ShunSmall_ExSkill_Level_3-1 = "要上囉！"
10144-CVGroup_Formchange_ShunSmall_Formation_In_1-1 = "和老師出門呢♪"
10144-CVGroup_Formchange_ShunSmall_Formation_In_2-1 = "耶嘿嘿，我好期待♪"
10144-CVGroup_Formchange_ShunSmall_Formation_Select-1 = "哇哇哇！？\n還以為要掉下去了……耶嘿嘿。"
10144-CVGroup_Formchange_ShunSmall_Formchange-1 = "鏘鏘～！我是小旬！"
10144-CVGroup_Formchange_ShunSmall_Growup_1-1 = "我好像，成長了！\n那個……這是好事，對吧？咦？"
10144-CVGroup_Formchange_ShunSmall_Growup_2-1 = "變成這副模樣，就會開始思考很多事情。\n雖然身體變大了，但是真的有成長嗎……\n啊，總覺得變得有點感傷了呢！\n剛剛那些就當作沒聽到……"
10144-CVGroup_Formchange_ShunSmall_Growup_3-1 = "現在的我，是期間限定的泡影……\n正因如此，才想好好珍惜這段時間。\n因為和老師像這樣度過的每一瞬間，都是無可取代的寶物呀。"
10144-CVGroup_Formchange_ShunSmall_Growup_4-1 = "唔……總覺得，好像又長大了一點……\n……咦，我說了什麼奇怪的話嗎？"
10144-CVGroup_Formchange_ShunSmall_Relationship_Up_1-1 = "突然有點想吃熱帶水果了……\n老師喜歡什麼樣的水果呢？"
10144-CVGroup_Formchange_ShunSmall_Relationship_Up_2-1 = "老師想要玩什麼呢？\n我想要……老師揹我！\n還有……耶嘿嘿，是祕密！"
10144-CVGroup_Formchange_ShunSmall_Relationship_Up_3-1 = "小時候，我曾經太沉迷於玩水結果得了夏季感冒。\n……啊，「現在」也很小呢。\n總之！老師也要小心夏季感冒哦！"
10144-CVGroup_Formchange_ShunSmall_Relationship_Up_4-1 = "現在的我所經歷的一切，會成為對過去的覆寫嗎？\n但一定，不是這樣的吧。\n因為，像這樣度過的所有時間，都成為新的回憶了呢。"
10144-CVGroup_Formchange_ShunSmall_Tactic_In_1-1 = "就算個子小，也做得到哦！"
10144-CVGroup_Formchange_ShunSmall_Tactic_In_2-1 = "包在我身上吧！"
10144-CVGroup_Formchange_ShunSmall_Tactic_Victory_1-1 = "耶嘿嘿，老師，你有看到嗎？"
10144-CVGroup_Formchange_ShunSmall_Tactic_Victory_2-1 = "我出發了！"
