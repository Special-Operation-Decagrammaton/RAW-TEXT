[translation]
10144-CVGroup_Formchange_ShunSmall_Battle_Buffed_1-1 = "ขอบคุณค่ะ!"
10144-CVGroup_Formchange_ShunSmall_Battle_Covered_1-1 = "ฉันจะไปซ่อนค่ะ!"
10144-CVGroup_Formchange_ShunSmall_Battle_Defense_1-1 = "แค่นี้สบายมากค่ะ!"
10144-CVGroup_Formchange_ShunSmall_Battle_In_1-1 = "เอาละค่ะ ทุกคน! ฉันต้องรบกวนด้วยนะคะ!"
10144-CVGroup_Formchange_ShunSmall_Battle_In_2-1 = "ฉันจะนำเองค่ะ!"
10144-CVGroup_Formchange_ShunSmall_Battle_Move_1-1 = "ต่อไปคืออะไรคะ?"
10144-CVGroup_Formchange_ShunSmall_Battle_Move_2-1 = "ตรงโน้นสินะคะ!"
10144-CVGroup_Formchange_ShunSmall_Battle_Recovery_1-1 = "ฉันไม่เป็นไรเพราะได้ทุกคนช่วยไว้ค่ะ!"
10144-CVGroup_Formchange_ShunSmall_Battle_TacticalAction_1-1 = "ฉันจะไปทางนั้นนะคะ!"
10144-CVGroup_Formchange_ShunSmall_Battle_Victory_1-1 = "ชนะแล้วค่ะ! คุณครูเห็นมั้ยคะ?"
10144-CVGroup_Formchange_ShunSmall_Battle_Victory_2-1 = "ฮิฮิฮิ ทำสำเร็จแล้วค่ะ! ชมฉันหน่อยสิคะ!"
10144-CVGroup_Formchange_ShunSmall_CommonSkill-1 = "เอาละ... เป็นยังไงบ้างคะ?"
10144-CVGroup_Formchange_ShunSmall_ExSkill_1-1 = "อึกกก... คุณครู~!"
10144-CVGroup_Formchange_ShunSmall_ExSkill_2-1 = "โอ๊ยๆ... ช่วยด้วยค่ะ~!"
10144-CVGroup_Formchange_ShunSmall_ExSkill_3-1 = "งืออ... อุ้มหน่อยค่ะ!"
10144-CVGroup_Formchange_ShunSmall_ExSkill_Level_1-1 = "ฉันจะพยายามค่ะ!"
10144-CVGroup_Formchange_ShunSmall_ExSkill_Level_2-1 = "ฮึบ~!"
10144-CVGroup_Formchange_ShunSmall_ExSkill_Level_3-1 = "ไปละนะคะ!"
10144-CVGroup_Formchange_ShunSmall_Formation_In_1-1 = "จะได้ไปเที่ยวเล่นกับคุณครูสินะคะ♪"
10144-CVGroup_Formchange_ShunSmall_Formation_In_2-1 = "ฮิฮิฮิ รอไม่ไหวแล้วค่ะ♪"
10144-CVGroup_Formchange_ShunSmall_Formation_Select-1 = "เหวอออ?! เกือบตกไปแล้วค่ะ... แหะๆ"
10144-CVGroup_Formchange_ShunSmall_Formchange-1 = "มาแล้ว~! ชุนหลิงเองค่ะ!"
10144-CVGroup_Formchange_ShunSmall_Growup_1-1 = "ฉันโตขึ้นแล้วค่ะ! เอ่อ...\nแต่นั่นเป็นเรื่องดีหรือเปล่านะคะ...?"
10144-CVGroup_Formchange_ShunSmall_Growup_2-1 = "พออยู่ในร่างนี้ ก็มีเรื่องให้คิดหลายอย่างเลยค่ะ\nถึงร่างกายจะโตขึ้น แต่ฉันเติบโตขึ้นจริงๆ หรือเปล่านะ...\nอ๊ะ เผลออ่อนไหวเกินไปแล้วค่ะ! ช่วยถือว่าไม่ได้ยินเรื่องเมื่อกี้นะคะ..."
10144-CVGroup_Formchange_ShunSmall_Growup_3-1 = "ตัวฉันในตอนนี้เป็นเหมือนฟองสบู่ที่มีเวลาอยู่จำกัด...\nฉันเลยยิ่งอยากถนอมช่วงเวลานี้เอาไว้ค่ะ\nก็เวลาที่ได้อยู่กับคุณครูแบบนี้ เป็นสมบัติล้ำค่าที่ไม่มีสิ่งใดทดแทนได้นี่คะ"
10144-CVGroup_Formchange_ShunSmall_Growup_4-1 = "อึก... รู้สึกเหมือนอะไรบางอย่างโตขึ้นอีกแล้วค่ะ...\nเอ๋? เมื่อกี้ฉันพูดอะไรแปลกๆ ไปหรือเปล่าคะ?"
10144-CVGroup_Formchange_ShunSmall_Relationship_Up_1-1 = "จู่ๆ ก็อยากกินผลไม้ขึ้นมาแล้วค่ะ...\nคุณครูชอบผลไม้อะไรคะ?"
10144-CVGroup_Formchange_ShunSmall_Relationship_Up_2-1 = "คุณครูอยากเล่นอะไรคะ?\nส่วนฉัน... อยากให้คุณครูพาขี่หลังค่ะ!\nแล้วก็... ฮิฮิฮิ เป็นความลับค่ะ!"
10144-CVGroup_Formchange_ShunSmall_Relationship_Up_3-1 = "สมัยเด็กๆ ฉันเคยมัวแต่เล่นน้ำจนเป็นหวัดในหน้าร้อนค่ะ\nถึงตอนนี้ก็ยังอยู่ในร่างเด็กก็เถอะค่ะ...\nเอาเป็นว่า! คุณครูก็ระวังอย่าเป็นหวัดนะคะ!"
10144-CVGroup_Formchange_ShunSmall_Relationship_Up_4-1 = "สิ่งที่ฉันกำลังเจออยู่ตอนนี้ กำลังเขียนทับ\nเรื่องราวในอดีตอยู่หรือเปล่าคะ? แต่ฉันคิดว่า\nมันต้องแตกต่างกันแน่นอนค่ะ ก็ช่วงเวลาทั้งหมดในตอนนี้\nกำลังกลายเป็นความทรงจำครั้งใหม่นี่คะ!"
10144-CVGroup_Formchange_ShunSmall_Tactic_In_1-1 = "ถึงจะตัวเล็ก แต่ก็ทำได้ค่ะ!"
10144-CVGroup_Formchange_ShunSmall_Tactic_In_2-1 = "วางใจฉันได้เลยค่ะ!"
10144-CVGroup_Formchange_ShunSmall_Tactic_Victory_1-1 = "ฮิฮิฮิ เห็นแล้วใช่มั้ยคะ? คุณครู?"
10144-CVGroup_Formchange_ShunSmall_Tactic_Victory_2-1 = "ถ้าอย่างนั้น ฉันไปก่อนนะคะ!"
