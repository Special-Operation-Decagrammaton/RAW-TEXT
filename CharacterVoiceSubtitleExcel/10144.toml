[translation]
10144-CVGroup_Formchange_ShunSmall_Battle_Buffed_1-1 = "Thank you!"
10144-CVGroup_Formchange_ShunSmall_Battle_Covered_1-1 = "I'll hide!"
10144-CVGroup_Formchange_ShunSmall_Battle_Defense_1-1 = "I'm totally fine!"
10144-CVGroup_Formchange_ShunSmall_Battle_In_1-1 = "Now then, everyone! I look forward to working with you!"
10144-CVGroup_Formchange_ShunSmall_Battle_In_2-1 = "I'll take the lead!"
10144-CVGroup_Formchange_ShunSmall_Battle_Move_1-1 = "What's next?"
10144-CVGroup_Formchange_ShunSmall_Battle_Move_2-1 = "There!"
10144-CVGroup_Formchange_ShunSmall_Battle_Recovery_1-1 = "I'm fine now thanks to you!"
10144-CVGroup_Formchange_ShunSmall_Battle_TacticalAction_1-1 = "I'm going that way!"
10144-CVGroup_Formchange_ShunSmall_Battle_Victory_1-1 = "We won! Were you watching, Sensei?"
10144-CVGroup_Formchange_ShunSmall_Battle_Victory_2-1 = "Heehee. We did it! Now praise me!"
10144-CVGroup_Formchange_ShunSmall_CommonSkill-1 = "Now then... How was that?"
10144-CVGroup_Formchange_ShunSmall_ExSkill_1-1 = "Auuuugh... Sensei!"
10144-CVGroup_Formchange_ShunSmall_ExSkill_2-1 = "Owieee... Help me!"
10144-CVGroup_Formchange_ShunSmall_ExSkill_3-1 = "Ugh... Please hug me!"
10144-CVGroup_Formchange_ShunSmall_ExSkill_Level_1-1 = "I'll do my best!"
10144-CVGroup_Formchange_ShunSmall_ExSkill_Level_2-1 = "Heave, ho!"
10144-CVGroup_Formchange_ShunSmall_ExSkill_Level_3-1 = "On my way!"
10144-CVGroup_Formchange_ShunSmall_Formation_In_1-1 = "Gonna go have fun with Sensei! ♪"
10144-CVGroup_Formchange_ShunSmall_Formation_In_2-1 = "Heehee. I'm really excited! ♪"
10144-CVGroup_Formchange_ShunSmall_Formation_Select-1 = "Uwaaah?! I almost fell... Heehee."
10144-CVGroup_Formchange_ShunSmall_Formchange-1 = "Tada! Shunling here!"
10144-CVGroup_Formchange_ShunSmall_Growup_1-1 = "I've grown! Um... But is that a good thing...?"
10144-CVGroup_Formchange_ShunSmall_Growup_2-1 = "Seeing myself like this makes me think... I may have grown physically, but have I in spirit? Ah! I'm getting too pensive! Just forget I said that..."
10144-CVGroup_Formchange_ShunSmall_Growup_3-1 = "I'm like a bubble right now, transient in nature. So I really want to cherish every moment while I can. This time with you will always be an invaluable treasure to me."
10144-CVGroup_Formchange_ShunSmall_Growup_4-1 = "Ugh... I think I've gotten bigger again... Huh? Did I say something weird?"
10144-CVGroup_Formchange_ShunSmall_Relationship_Up_1-1 = "I want some fruit now... What kind of fruit do you like, Sensei?"
10144-CVGroup_Formchange_ShunSmall_Relationship_Up_2-1 = "What do you like to do for fun, Sensei? For me... I like piggyback rides! And also... Heehee. That's a secret!"
10144-CVGroup_Formchange_ShunSmall_Relationship_Up_3-1 = "When I was little, I caught a cold during the summer because I played in the water too long! Well, I guess I'm still little right now. The point is, be careful not to catch a cold, Sensei!"
10144-CVGroup_Formchange_ShunSmall_Relationship_Up_4-1 = "Is everything I experience like this technically overwriting my original experiences? I don't think so, though. All of these different moments are just new memories for me!"
10144-CVGroup_Formchange_ShunSmall_Tactic_In_1-1 = "I might be small, but I can do it!"
10144-CVGroup_Formchange_ShunSmall_Tactic_In_2-1 = "Leave it to me!"
10144-CVGroup_Formchange_ShunSmall_Tactic_Victory_1-1 = "Heehee, did you see that, Sensei?"
10144-CVGroup_Formchange_ShunSmall_Tactic_Victory_2-1 = "I'll be off then!"
