[translation]
20064-CVGroup_CommonSkill-1 = "芳しい花のように。"
20064-CVGroup_ExSkill_1-1 = "光差す、舞台へ。"
20064-CVGroup_ExSkill_2-1 = "演劇とは、己の内面を映す鏡。"
20064-CVGroup_ExSkill_3-1 = "想像を、現実という舞台へ。"
20064-CVGroup_ExSkill_Level_1-1 = "次なる主役はこちら。"
20064-CVGroup_ExSkill_Level_2-1 = "こちらへ、さあ万雷の喝采を。"
20064-CVGroup_ExSkill_Level_3-1 = "あなたの番ですよ。"
20064-CVGroup_Formation_In_1-1 = "わたくしは、何をお手伝いいたしましょう？"
20064-CVGroup_Formation_In_2-1 = "務めを果たして見せましょう。"
20064-CVGroup_Formation_Select-1 = "あの……早く下ろしていただけますか？"
20064-CVGroup_Growup_1-1 = "わたくしの胸のうちには、まだ成長の種があったのですね。"
20064-CVGroup_Growup_2-1 = "心安らかで穏やかな日々が訪れますように。"
20064-CVGroup_Growup_3-1 = "ふむ……良い劇の転換を思いつきました。\nとても魅力的な演出を。"
20064-CVGroup_Growup_4-1 = "これは……世界という舞台を歩んでいくための力、ですね。"
20064-CVGroup_Relationship_Up_1-1 = "この胸の高鳴り……先生に明かせない秘密が、またひとつ増えてしまいましたね。"
20064-CVGroup_Relationship_Up_2-1 = "演者にとって、表情管理は必須だというのに……\n一瞬、崩してしまいそうになりました。"
20064-CVGroup_Relationship_Up_3-1 = "何故でしょうか……先生の前に立つと、すべての秘密を見透かされてしまうような気がします。"
20064-CVGroup_Relationship_Up_4-1 = "こんなに心を砕いてくださるだなんて……\nうっかり、わたくしの本心が顔を出しても、知りませんよ？"
