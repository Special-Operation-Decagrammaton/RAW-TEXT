[translation]
20064-CVGroup_CommonSkill-1 = "향기로운 꽃과 같이."
20064-CVGroup_ExSkill_1-1 = "빛나는, 무대 위로."
20064-CVGroup_ExSkill_2-1 = "연극은, 내면의 거울."
20064-CVGroup_ExSkill_3-1 = "상상을, 현실의 무대로."
20064-CVGroup_ExSkill_Level_1-1 = "다음 주인공이랍니다."
20064-CVGroup_ExSkill_Level_2-1 = "이쪽에, 우레와 같은 갈채를."
20064-CVGroup_ExSkill_Level_3-1 = "당신 차례랍니다."
20064-CVGroup_Formation_In_1-1 = "제가 무엇을 도와드리면 될까요?"
20064-CVGroup_Formation_In_2-1 = "소임을 다해 보이겠어요."
20064-CVGroup_Formation_Select-1 = "저기…… 빨리 끝내 주시겠어요?"
20064-CVGroup_Growup_1-1 = "제 마음속에는, 아직 성장의 씨앗이 있었네요."
20064-CVGroup_Growup_2-1 = "마음 평온하고 온화한 날들이 찾아오기를."
20064-CVGroup_Growup_3-1 = "음…… 좋은 극의 전환이 떠올랐어요. 아주 매력적인 연출이."
20064-CVGroup_Growup_4-1 = "이것은…… 세상이라는 무대를 걸어 나갈 힘, 이랍니다."
20064-CVGroup_Relationship_Up_1-1 = "이 두근거림…… 선생님께 말할 수 없는 비밀이 늘었네요."
20064-CVGroup_Relationship_Up_2-1 = "연기자에겐 평정심이 중요한데…… 순간 잃을 뻔했어요."
20064-CVGroup_Relationship_Up_3-1 = "왜일까요…… 선생님 앞에 서면 모든 비밀이 들킨 기분이 들어요."
20064-CVGroup_Relationship_Up_4-1 = "이렇게까지 마음을 써주시면…… 저도 모르게 본심이 드러날지도 모른답니다?"
