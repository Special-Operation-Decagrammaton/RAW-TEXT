[translation]
10154-CVGroup_Battle_Buffed_1-1 = "助かりました。"
10154-CVGroup_Battle_Covered_1-1 = "ああ、面倒ですね。"
10154-CVGroup_Battle_Defense_1-1 = "ふふっ……。"
10154-CVGroup_Battle_In_1-1 = "素晴らしい作品を探しに行きましょう。"
10154-CVGroup_Battle_In_2-1 = "蹂躙される覚悟はよろしいでしょうか？"
10154-CVGroup_Battle_Move_1-1 = "次の幕へ。"
10154-CVGroup_Battle_Move_2-1 = "この先に素敵な作品があるようですね。"
10154-CVGroup_Battle_Recovery_1-1 = "あら、ありがとうございます。"
10154-CVGroup_Battle_TacticalAction_1-1 = "では、参りましょう。"
10154-CVGroup_Battle_Victory_1-1 = "さて、どんな作品があるのでしょう？"
10154-CVGroup_Battle_Victory_2-1 = "素晴らしい感覚を堪能できました。"
10154-CVGroup_CommonSkill-1 = "華やかに、美しく。"
10154-CVGroup_ExSkill_1-1 = "これが私の審美眼。"
10154-CVGroup_ExSkill_2-1 = "秘められた価値を見せてください。"
10154-CVGroup_ExSkill_3-1 = "ひれ伏しなさい。"
10154-CVGroup_ExSkill_Level_1-1 = "ここに芸術を。"
10154-CVGroup_ExSkill_Level_2-1 = "刻んであげましょう。"
10154-CVGroup_ExSkill_Level_3-1 = "耐えられますか？"
10154-CVGroup_Formation_In_1-1 = "ともに探求しましょう――芸術の道を。"
10154-CVGroup_Formation_In_2-1 = "さあ、感覚の世界を堪能しましょう。"
10154-CVGroup_Formation_Select-1 = "ふふっ、そんなに気になりましたか？"
10154-CVGroup_Growup_1-1 = "……芸術に対する造詣が深まりました。"
10154-CVGroup_Growup_2-1 = "これが先生によるキュレーション……\n筆舌に尽くしがたいですね。"
10154-CVGroup_Growup_3-1 = "芸術の発展をこの目で見届けること……\nそれは私の至上の喜びです。"
10154-CVGroup_Growup_4-1 = "先生へ心からの敬愛を――\nこの瞬間の全てを、記憶に刻みましょう。"
10154-CVGroup_Relationship_Up_1-1 = "ふふっ、積極的な人ですね……嫌いではありませんよ。"
10154-CVGroup_Relationship_Up_2-1 = "先生は私と同じ審美眼の持ち主なようですね。\n話が早くて助かります。"
10154-CVGroup_Relationship_Up_3-1 = "私たちの交流が、希望の光となれば良いのですが。"
10154-CVGroup_Relationship_Up_4-1 = "行動には結果が伴うもの……\nもう分かっていらっしゃいますよね？ふふっ……。"
10154-CVGroup_Tactic_In_1-1 = "先生の指揮、とても楽しみです。"
10154-CVGroup_Tactic_In_2-1 = "勝利が共にあらんことを。"
10154-CVGroup_Tactic_Victory_1-1 = "芸術的な指揮でした。覚えておきますね。"
10154-CVGroup_Tactic_Victory_2-1 = "ふふっ、約束された勝利ですから。"
