[translation]
10154-CVGroup_Battle_Buffed_1-1 = "도움이 됩니다."
10154-CVGroup_Battle_Covered_1-1 = "아아, 귀찮네요."
10154-CVGroup_Battle_Defense_1-1 = "후후후……."
10154-CVGroup_Battle_In_1-1 = "부디, 좋은 수집품이 있기를."
10154-CVGroup_Battle_In_2-1 = "저에게 짓밟힐 준비는 되셨는지?"
10154-CVGroup_Battle_Move_1-1 = "다음 막으로."
10154-CVGroup_Battle_Move_2-1 = "저쪽에 좋은 수집품이 있네요."
10154-CVGroup_Battle_Recovery_1-1 = "어머, 감사합니다."
10154-CVGroup_Battle_TacticalAction_1-1 = "자, 가죠."
10154-CVGroup_Battle_Victory_1-1 = "어떤 작품이 모였을까요?"
10154-CVGroup_Battle_Victory_2-1 = "멋진 감각을 만끽할 수 있었네요."
10154-CVGroup_CommonSkill-1 = "화려하고, 아름답게."
10154-CVGroup_ExSkill_1-1 = "이것이 저의 심미안."
10154-CVGroup_ExSkill_2-1 = "숨겨진 가치를 보여주시길."
10154-CVGroup_ExSkill_3-1 = "고개를 조아리세요."
10154-CVGroup_ExSkill_Level_1-1 = "여기에 예술을."
10154-CVGroup_ExSkill_Level_2-1 = "새겨드리죠."
10154-CVGroup_ExSkill_Level_3-1 = "버텨보시길."
10154-CVGroup_Formation_In_1-1 = "함께 탐구합시다. 예술의 길을."
10154-CVGroup_Formation_In_2-1 = "자, 감각의 세계에 빠져들어 보죠."
10154-CVGroup_Formation_Select-1 = "후후, 그렇게 신경 쓰이셨나요?"
10154-CVGroup_Growup_1-1 = "……예술에 대한 조예가 깊어졌습니다."
10154-CVGroup_Growup_2-1 = "이것이 선생님의 큐레이팅…… 여러 가지 의미로 인상 깊네요."
10154-CVGroup_Growup_3-1 = "예술의 발전을 목도하는 것만큼 기쁜 일도 없죠."
10154-CVGroup_Growup_4-1 = "선생님께 진심 어린 경애를. 이 순간의 모든 것을 기억에 새기죠."
10154-CVGroup_Relationship_Up_1-1 = "후후, 이렇게 적극적으로 어필하는 사람…… 싫지 않습니다."
10154-CVGroup_Relationship_Up_2-1 = "선생님은 저와 같은 심미안을 지니신 것 같네요. 이야기가 빨라서 다행입니다."
10154-CVGroup_Relationship_Up_3-1 = "우리들의 교류가, 희망의 빛이 되면 좋겠네요."
10154-CVGroup_Relationship_Up_4-1 = "행동에는 결과가 따르는 법…… 이미 알고 계시겠죠? 후후……."
10154-CVGroup_Tactic_In_1-1 = "선생님의 지휘, 정말 기대됩니다."
10154-CVGroup_Tactic_In_2-1 = "승리가 함께하기를."
10154-CVGroup_Tactic_Victory_1-1 = "예술적인 지휘였어요. 기억해 두죠."
10154-CVGroup_Tactic_Victory_2-1 = "후후, 약속된 승리였습니다."
