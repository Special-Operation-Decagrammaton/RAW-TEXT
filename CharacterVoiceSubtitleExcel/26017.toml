[translation]
26017-CVGroup_CommonSkill-1 = "プップー。"
26017-CVGroup_CommonSkill_2-1 = "戦車、お呼びですか。"
26017-CVGroup_CommonSkill_3-1 = "ブォーン！ブォォー！ブォォー。"
26017-CVGroup_ExSkill_1-1 = "移動研究所、ただいま到着しました。"
26017-CVGroup_ExSkill_2-1 = "科学的根拠に基づいてます、ご安心を。"
26017-CVGroup_ExSkill_3-1 = "子犬号、降臨です。"
26017-CVGroup_ExSkill_Level_1-1 = "うにゃー。"
26017-CVGroup_ExSkill_Level_2-1 = "ズドーン。"
26017-CVGroup_Formation_In_1-1 = "エキスパートをお探しでしょうか？"
26017-CVGroup_Formation_In_2-1 = "常時待機中ですので。"
26017-CVGroup_Formation_Select-1 = "高いですね。これが大人の目線……。"
26017-CVGroup_Growup_1-1 = "いつもありがとうございます、先生。\nまだまだ成長期ですので、乞うご期待、です。"
26017-CVGroup_Growup_2-1 = "実力がついて、一歩前進するこの感覚……\nだから成長はやめられません。"
26017-CVGroup_Growup_3-1 = "私が成長し続けて、いつか遠い存在になっても……\n見守っていてくださいね。"
26017-CVGroup_Growup_4-1 = "ありがとうございます、先生。\n……これからは感謝を表す言葉を、たくさん覚えていきます。"
26017-CVGroup_Relationship_Up_1-1 = "先生は、私より私のことを理解されているのですね。\n感謝です。ウレシイです。"
26017-CVGroup_Relationship_Up_2-1 = "近頃、先生のことを考える頻度が増えました。\n喜ばしい現象です。"
26017-CVGroup_Relationship_Up_3-1 = "いつも甘やかしてくださり、ありがとうございます。"
26017-CVGroup_Relationship_Up_4-1 = "検証を重ねるたびに、確信します。\n私は、先生のことが好きです。"
