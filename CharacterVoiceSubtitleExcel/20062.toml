[translation]
20062-CVGroup_CommonSkill-1 = "강해지셨어요~! 돌격-!!"
20062-CVGroup_ExSkill_1-1 = "화학은 축복이니라~!"
20062-CVGroup_ExSkill_2-1 = "이거면 괜찮겠지?"
20062-CVGroup_ExSkill_3-1 = "연장전 드갑니당!"
20062-CVGroup_ExSkill_Level_1-1 = "감사는 나중에!"
20062-CVGroup_ExSkill_Level_2-1 = "공부한 보람이 있네요!"
20062-CVGroup_ExSkill_Level_3-1 = "태그매치 같네요!"
20062-CVGroup_Formation_In_1-1 = "끝나면 어디 들려도 되는거죠? 아싸~!"
20062-CVGroup_Formation_In_2-1 = "화학으로 한방 먹여줄게요!"
20062-CVGroup_Formation_Select-1 = "우 우와앗!! 높은곳은 싫어요!"
20062-CVGroup_Growup_1-1 = "엥? 공부 자체는 좋아하는데요?\n책을 보거나 필기하는게 싫은거에요."
20062-CVGroup_Growup_2-1 = "노력은 쓰지만 결과는 달콤하죠!\n오블라토는 없으려나……."
20062-CVGroup_Growup_3-1 = "강해지면 설득력도 좋아지겠죠? 에헤-!"
20062-CVGroup_Growup_4-1 = "아~ 이걸 뭐라고 하더라?\n그거 있잖아요!! 그거!\n아! 맞아! '감사합니다!!' 였어요!"
20062-CVGroup_Relationship_Up_1-1 = "공부는 무지 싫지만\n선생님 옆에서 하면…… 조금 좋을지도?"
20062-CVGroup_Relationship_Up_2-1 = "선생님, 둔감하다는 말 안들어요?\n아, 그렇구나……\n아뇨, 그냥 물어본거에요."
20062-CVGroup_Relationship_Up_3-1 = "같이 카페도 가고, 외출하고…….\n얼마나 큰 의미인지 모르는거 아니시죠?"
20062-CVGroup_Relationship_Up_4-1 = "자주 찾아 와주세요,\n거기가 얼마나 심심한지 아신다면 더 많이요."
