[translation]
20062-CVGroup_CommonSkill-1 = "強くなりましたよ～！とつげーき！"
20062-CVGroup_ExSkill_1-1 = "化学は祝福なりぃ～！"
20062-CVGroup_ExSkill_2-1 = "これなら大丈夫では？"
20062-CVGroup_ExSkill_3-1 = "延長戦といきまっしょい！"
20062-CVGroup_ExSkill_Level_1-1 = "お礼はまた後ほど！"
20062-CVGroup_ExSkill_Level_2-1 = "勉強した甲斐がありましたぁ！"
20062-CVGroup_ExSkill_Level_3-1 = "タッグマッチみたいですね！"
20062-CVGroup_Formation_In_1-1 = "終わったら寄り道していいんですよね？やった～！"
20062-CVGroup_Formation_In_2-1 = "化学で食らわせちゃいますっと！"
20062-CVGroup_Formation_Select-1 = "う、うわあっ！高い所は苦手です！"
20062-CVGroup_Growup_1-1 = "ふぇ？勉強自体は好きですよ？\n参考書開いたり書き取りするのが嫌いなだけで。"
20062-CVGroup_Growup_2-1 = "努力は苦いですけど成果は甘いものですから！\nオブラートがほしいところです……。"
20062-CVGroup_Growup_3-1 = "強くなったら説得力も増しますよね？えへっ！"
20062-CVGroup_Growup_4-1 = "あ～～こういう時なんて言うんだっけ？\nあれですよ、あれ！\nああ、そう！「ありがとうございます」！"
20062-CVGroup_Relationship_Up_1-1 = "勉強は嫌いだけど\n先生がついててくれるなら……いいかも？"
20062-CVGroup_Relationship_Up_2-1 = "先生、鈍感だって言われません？\nあ、そう……いえ、聞いてみただけです。"
20062-CVGroup_Relationship_Up_3-1 = "一緒にカフェ行ったりお出かけしたり……。\nこれの意味、分からないとは言わせませんよ？"
20062-CVGroup_Relationship_Up_4-1 = "もっと会いに来てくださいよね。\nあそこがどれだけ退屈な場所か、知っているならなおさら。"
