[translation]
10148-CVGroup_Battle_Buffed_1-1 = "อ๊ะ ขอบคุณค่ะ"
10148-CVGroup_Battle_Covered_1-1 = "พักหายใจกันหน่อยเถอะค่ะ"
10148-CVGroup_Battle_Defense_1-1 = "อืม ถ้าประมาณนี้ละก็..."
10148-CVGroup_Battle_In_1-1 = "ก็ไหนๆ จะทำแล้ว ฉันจะทำให้ละเอียดค่ะ"
10148-CVGroup_Battle_In_2-1 = "น่ารำคาญ รีบจัดการให้จบเถอะค่ะ"
10148-CVGroup_Battle_Move_1-1 = "ต่อไปเป็นทางนั้นเหรอคะ?"
10148-CVGroup_Battle_Move_2-1 = "ฮู่ว ต่อไปคือ..."
10148-CVGroup_Battle_Recovery_1-1 = "รอดมาได้เพราะคุณครูเลยค่ะ"
10148-CVGroup_Battle_TacticalAction_1-1 = "ค่ะ ค่ะ~ กำลังไปค่ะ"
10148-CVGroup_Battle_Victory_1-1 = "จะรอคำชมนะคะ?"
10148-CVGroup_Battle_Victory_2-1 = "เดี๋ยวกลับมาค่ะ"
10148-CVGroup_CommonSkill-1 = "ลำบากกันทั้งคู่เลยนะคะ"
10148-CVGroup_ExSkill_1-1 = "เต็มหมดแล้วค่ะ... จะปิดลงหรือเปล่านะ\nเอะ... เอ๋?!"
10148-CVGroup_ExSkill_2-1 = "สัมภาระของตัวเองก็ใส่กระเป๋าตัวเอง... เฮ้อ ช่างเถอะค่ะ\nอ๊ะ...?!"
10148-CVGroup_ExSkill_3-1 = "ไม่สิ ดูสถานการณ์แล้วค่อยใส่สิคะ... เฮือก?!"
10148-CVGroup_ExSkill_Level_1-1 = "ต้องสู้กันถึงขนาดนี้เลยเหรอคะ?"
10148-CVGroup_ExSkill_Level_2-1 = "สัมภาระ เกะกะ"
10148-CVGroup_ExSkill_Level_3-1 = "รับนี่ไปก็แล้วกันค่ะ!"
10148-CVGroup_Formation_In_1-1 = "สุดท้ายก็ขาดฉันไม่ได้ใช่มั้ยคะ?"
10148-CVGroup_Formation_In_2-1 = "ค่ะ~ ค่ะ~ อยู่นี่ค่ะ"
10148-CVGroup_Formation_Select-1 = "ฮ้าววว... อ๊ะ อย่ามองนะคะ"
10148-CVGroup_Growup_1-1 = "ถ้าพูดตรงๆ ก็ไม่ได้ดีใจเท่าไรหรอกค่ะ...\nเข้าใจแล้วค่ะ ต้องการฉันใช่มั้ยคะ?"
10148-CVGroup_Growup_2-1 = "เรื่องโบนัสน่ะ สุดท้ายก็คือให้ทำงานเพิ่มใช่มั้ยคะ?\nคะ...? ทำไมถึงพูดเรื่องนั้นตอนนี้เหรอคะ?"
10148-CVGroup_Growup_3-1 = "ถ้าต้องการฉันถึงขนาดนั้น...\nเฮ้อ ช่วยไม่ได้จริงๆ นะคะ"
10148-CVGroup_Growup_4-1 = "นี่ คือว่านะคะ ตอนนี้ฉันดูเหมือนคนที่มาพักผ่อนมากเลยไม่ใช่เหรอคะ?\nเฮ้อ... ช่างเถอะค่ะ"
10148-CVGroup_Relationship_Up_1-1 = "เดี๋ยวออกไปข้างนอกกันมั้ยคะ?\nแค่สองคนน่ะค่ะ"
10148-CVGroup_Relationship_Up_2-1 = "ค่ะ ฉันเข้าใจทั้งหมดค่ะ\nวันนี้พักให้เต็มที่แบบไม่ต้องคิดอะไรเถอะค่ะ"
10148-CVGroup_Relationship_Up_3-1 = "คุณครูก็กลายเป็นคนที่เข้ากับฉันได้พอสมควรแล้วนะคะ?\nหรือว่าตรงกันข้ามนะ..."
10148-CVGroup_Relationship_Up_4-1 = "ฉันไม่ชอบการท่องเที่ยวค่ะ\nแต่ก็... คงขึ้นอยู่กับว่าไปกับใครนะคะ"
10148-CVGroup_Tactic_In_1-1 = "ไม่ทันไร งานก็กองเป็นภูเขาแล้วค่ะ"
10148-CVGroup_Tactic_In_2-1 = "ฉันสภาพร่างกายไม่ค่อยดี ขอแยกกลับก่อนได้มั้ยคะ?"
10148-CVGroup_Tactic_Victory_1-1 = "โอ้ เสร็จแล้วเหรอคะ?\nโอ้โห ทุกคนทำงานหนักเลยนะคะ~"
10148-CVGroup_Tactic_Victory_2-1 = "อยากให้วันนี้... จบลงแค่นี้จังเลยค่ะ..."
