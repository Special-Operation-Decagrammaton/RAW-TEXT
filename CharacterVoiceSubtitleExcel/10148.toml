[translation]
10148-CVGroup_Battle_Buffed_1-1 = "啊，謝謝你。"
10148-CVGroup_Battle_Covered_1-1 = "稍微冷靜一下吧。"
10148-CVGroup_Battle_Defense_1-1 = "好吧，這種程度的話……"
10148-CVGroup_Battle_In_1-1 = "唉……既然要做，我就會做得徹底。"
10148-CVGroup_Battle_In_2-1 = "很麻煩，快點解決掉吧。"
10148-CVGroup_Battle_Move_1-1 = "下一個是那邊嗎？"
10148-CVGroup_Battle_Move_2-1 = "呼，接下來是……"
10148-CVGroup_Battle_Recovery_1-1 = "謝了，幫了大忙。"
10148-CVGroup_Battle_TacticalAction_1-1 = "好好好，我正在過去。"
10148-CVGroup_Battle_Victory_1-1 = "……要誇獎我也沒問題哦？"
10148-CVGroup_Battle_Victory_2-1 = "我在夏萊休息一下再回去。"
10148-CVGroup_CommonSkill-1 = "彼此都很辛苦呢。"
10148-CVGroup_ExSkill_1-1 = "都塞得滿滿的了……這個，真的關得上嗎。\n……咦！？"
10148-CVGroup_ExSkill_2-1 = "自己的東西就由自己……唉，算了。\n……啊嗚！？"
10148-CVGroup_ExSkill_3-1 = "已經塞不下了，你看不出來嗎？\n……咕哈！？"
10148-CVGroup_ExSkill_Level_1-1 = "連這種東西都得拿來當武器嗎……"
10148-CVGroup_ExSkill_Level_2-1 = "行李，很礙事。"
10148-CVGroup_ExSkill_Level_3-1 = "這個送你！"
10148-CVGroup_Formation_In_1-1 = "唉……意思是沒有我就無法運轉了嗎。"
10148-CVGroup_Formation_In_2-1 = "好好好，我在這裡哦。"
10148-CVGroup_Formation_Select-1 = "呼啊……啊。\n那個……請你忘掉。"
10148-CVGroup_Growup_1-1 = "我倒覺得不被期待的程度剛剛好……\n真是的。老師需要我對吧？"
10148-CVGroup_Growup_2-1 = "意思就是叫我多工作一點吧？\n……咦？現在說的理由……？非得解釋不可嗎。"
10148-CVGroup_Growup_3-1 = "就這麼想跟我待在一起嗎？\n……唉，真拿你沒辦法。"
10148-CVGroup_Growup_4-1 = "那個……我其實是來夏萊摸魚的……\n算了，也可以啦……"
10148-CVGroup_Relationship_Up_1-1 = "待會你……\n啊，不是……方便的話，要不要出去走走？就我們兩個。"
10148-CVGroup_Relationship_Up_2-1 = "呵呵。是的，我知道哦。\n這是「一起摸魚吧」的信號對吧？"
10148-CVGroup_Relationship_Up_3-1 = "老師也相當了解我了呢。\n……不，是相反……嗎？"
10148-CVGroup_Relationship_Up_4-1 = "旅行？我討厭啊。\n……雖然，還是得看跟誰去就是了。"
10148-CVGroup_Tactic_In_1-1 = "唉……要做的事堆積如山呢。"
10148-CVGroup_Tactic_In_2-1 = "我身體不舒服，可以早退嗎？"
10148-CVGroup_Tactic_Victory_1-1 = "呼，收拾好了呢。辛苦了。"
10148-CVGroup_Tactic_Victory_2-1 = "今天已經結束了，對吧……？"
