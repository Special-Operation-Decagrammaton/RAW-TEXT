[translation]
10148-CVGroup_Battle_Buffed_1-1 = "あぁ、ありがとうございます。"
10148-CVGroup_Battle_Covered_1-1 = "少し落ち着きましょう。"
10148-CVGroup_Battle_Defense_1-1 = "まぁ、これくらいなら……。"
10148-CVGroup_Battle_In_1-1 = "はぁ……やるからには、徹底的にやりますよ。"
10148-CVGroup_Battle_In_2-1 = "面倒ですし、さっさと片づけましょう。"
10148-CVGroup_Battle_Move_1-1 = "次はそっちですか？"
10148-CVGroup_Battle_Move_2-1 = "ふぅ、次は……。"
10148-CVGroup_Battle_Recovery_1-1 = "どうも。助かりました。"
10148-CVGroup_Battle_TacticalAction_1-1 = "はいはい、向かってますよ。"
10148-CVGroup_Battle_Victory_1-1 = "……褒めてくれてもいいんですよ？"
10148-CVGroup_Battle_Victory_2-1 = "シャーレで一休みしてから帰りますね。"
10148-CVGroup_CommonSkill-1 = "お互い苦労しますね。"
10148-CVGroup_ExSkill_1-1 = "パンパンですけど……これ、ちゃんと閉まるんですかね。\n……えぇっ！？"
10148-CVGroup_ExSkill_2-1 = "自分の物は自分で……はぁ、もういいです。\n……あうっ！？"
10148-CVGroup_ExSkill_3-1 = "もう入らないの、見て分かりません？\n……ぐはっ！？"
10148-CVGroup_ExSkill_Level_1-1 = "こんなものまで武器にしないといけないんですか……。"
10148-CVGroup_ExSkill_Level_2-1 = "荷物、邪魔です。"
10148-CVGroup_ExSkill_Level_3-1 = "これでも、どうぞ！"
10148-CVGroup_Formation_In_1-1 = "はぁ……私がいないと回らないということですか。"
10148-CVGroup_Formation_In_2-1 = "はいはい、ちゃんといますよ。"
10148-CVGroup_Formation_Select-1 = "ふぁ～っ……あっ。\nあの……忘れてください。"
10148-CVGroup_Growup_1-1 = "期待されてないくらいがちょうどいいんですけど……\nまったく。先生には私が必要なんですね？"
10148-CVGroup_Growup_2-1 = "つまり、もっと働けってことです？\n……え？今言う理由……？説明しないとダメなんですか。"
10148-CVGroup_Growup_3-1 = "そんなに一緒にいたいんですか？\n……はぁ、仕方のない人。"
10148-CVGroup_Growup_4-1 = "あの……私、シャーレにはサボりに来てて……\nいえ、いいですけど……。"
10148-CVGroup_Relationship_Up_1-1 = "この後って……。\nあ、いえ……よければ、出かけませんか？2人きりで。"
10148-CVGroup_Relationship_Up_2-1 = "ふふっ。ええ、分かってますよ。\n一緒にサボろう、の合図ですよね？"
10148-CVGroup_Relationship_Up_3-1 = "先生も、だいぶ私を理解してきましたね。\n……いや、逆……でしょうか？"
10148-CVGroup_Relationship_Up_4-1 = "旅行？嫌いですけど。\n……まぁ、誰と行くかによるんじゃないですかね。"
10148-CVGroup_Tactic_In_1-1 = "はぁ……やることが山積みですね。"
10148-CVGroup_Tactic_In_2-1 = "調子が悪いので、早退してもいいですか？"
10148-CVGroup_Tactic_Victory_1-1 = "ふぅ、片づきましたね。お疲れさまでした。"
10148-CVGroup_Tactic_Victory_2-1 = "今日はもう終わり、ですよね……？"
