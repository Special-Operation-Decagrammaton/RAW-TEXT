[translation]
10148-CVGroup_Battle_Buffed_1-1 = "아, 감사합니다."
10148-CVGroup_Battle_Covered_1-1 = "숨을 좀 고르죠."
10148-CVGroup_Battle_Defense_1-1 = "뭐, 이 정도라면……."
10148-CVGroup_Battle_In_1-1 = "뭐, 기왕 하는 거, 철저하게 할 테니까요."
10148-CVGroup_Battle_In_2-1 = "귀찮으니까, 후딱 해치우죠."
10148-CVGroup_Battle_Move_1-1 = "다음은 그쪽인가요?"
10148-CVGroup_Battle_Move_2-1 = "후우, 다음은……."
10148-CVGroup_Battle_Recovery_1-1 = "덕분에 살았어요."
10148-CVGroup_Battle_TacticalAction_1-1 = "네네~ 가고 있어요."
10148-CVGroup_Battle_Victory_1-1 = "칭찬, 기대할게요?"
10148-CVGroup_Battle_Victory_2-1 = "금방 돌아갈게요."
10148-CVGroup_CommonSkill-1 = "피차 고생이네요."
10148-CVGroup_ExSkill_1-1 = "이미 가득 찼다고요…… 제대로 닫히려나.\n……어, 어라?!"
10148-CVGroup_ExSkill_2-1 = "본인 짐은 본인 트렁크…… 하, 됐어요.\n……아앗?!"
10148-CVGroup_ExSkill_3-1 = "아니, 좀 상황을 보고 넣으란 말예요…… 하앗?!"
10148-CVGroup_ExSkill_Level_1-1 = "이렇게까지 싸워야 하나요?"
10148-CVGroup_ExSkill_Level_2-1 = "짐, 거슬려."
10148-CVGroup_ExSkill_Level_3-1 = "이거라도 받으시죠!"
10148-CVGroup_Formation_In_1-1 = "역시 저 없이는 안 되는 거죠?"
10148-CVGroup_Formation_In_2-1 = "네~ 네~ 여기 있어요."
10148-CVGroup_Formation_Select-1 = "하아암…….\n아. 보지 마세요."
10148-CVGroup_Growup_1-1 = "솔직히 말하면, 별로 기쁘지 않은데요……\n알았어요. 제가 필요하신 거죠?"
10148-CVGroup_Growup_2-1 = "상여란 거 말이죠, 결국에는 더 일하라는 거잖아요?\n……네? 그걸 지금 말하는 이유요?"
10148-CVGroup_Growup_3-1 = "그렇게까지 절 원하신다면……\n참, 어쩔 수 없네요."
10148-CVGroup_Growup_4-1 = "저기, 있잖아요. 저 지금, 되게 쉬러 온 사람처럼 보이지 않나요?\n……에휴, 됐어요."
10148-CVGroup_Relationship_Up_1-1 = "혹시, 이따 나가지 않을래요?\n단둘이서요."
10148-CVGroup_Relationship_Up_2-1 = "네, 전부 이해해요.\n오늘은 아무 생각 없이 푹 쉬자고요."
10148-CVGroup_Relationship_Up_3-1 = "선생님도 꽤, 저랑 어울리는 사람이 되었네요?\n아니면 그 반대려나……."
10148-CVGroup_Relationship_Up_4-1 = "여행은 싫어해요.\n……뭐, 누구랑 가느냐에 따라 다르겠지만."
10148-CVGroup_Tactic_In_1-1 = "……벌써부터 일이 산더미네요."
10148-CVGroup_Tactic_In_2-1 = "컨디션이 안 좋은데, 먼저 돌아가도 될까요?"
10148-CVGroup_Tactic_Victory_1-1 = "오오, 끝났나요?\n이야, 다들 수고하셨습니다~"
10148-CVGroup_Tactic_Victory_2-1 = "오늘은 이걸로 끝, 이면 좋겠는데요……?"
