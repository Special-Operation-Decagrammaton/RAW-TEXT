10150-CVGroup_Battle_Recovery_1-1 = "あ、ありがとう。"
10150-CVGroup_Battle_TacticalAction_1-1 = "潮の流れに乗って。"
10150-CVGroup_Battle_Victory_1-1 = "……やっと静かになった。\nこれで読書に集中できる。"
10150-CVGroup_Battle_Victory_2-1 = "今日のお話は……ここまで。"
10150-CVGroup_CommonSkill-1 = "座標、送るね。"
10150-CVGroup_ExSkill_1-1 = "アクティブソナー、展開。"
10150-CVGroup_ExSkill_2-1 = "反響音確認。敵の位置を共有するね。"
10150-CVGroup_ExSkill_3-1 = "どこに隠れても無駄。全部聞こえてるよ。"
10150-CVGroup_ExSkill_Level_1-1 = "弾種切替。水中モード。"
10150-CVGroup_ExSkill_Level_2-1 = "確実に、貫く。"
10150-CVGroup_ExSkill_Level_3-1 = "ORCA2、対応開始。"
