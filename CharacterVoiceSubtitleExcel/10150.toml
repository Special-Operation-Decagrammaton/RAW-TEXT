10150-CVGroup_Battle_Defense_1-1 = "遅い。"
10150-CVGroup_Battle_In_1-1 = "陸……久しぶりに走るかも。"
10150-CVGroup_Battle_In_2-1 = "それじゃあ、始めよっか。"
10150-CVGroup_Battle_Move_1-1 = "移動するよ。"
