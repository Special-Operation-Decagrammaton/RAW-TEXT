10150-CVGroup_Relationship_Up_4-1 = "……おかしいな。\nこんなに静かなのに、読書に集中できない。"
10150-CVGroup_Tactic_In_1-1 = "ダイビングポイント到着。潜降を開始するね。"
10150-CVGroup_Tactic_In_2-1 = "最終チェック完了。下で合流しよっか。"
10150-CVGroup_Tactic_Victory_1-1 = "うん……いい探索だったね。"
10150-CVGroup_Tactic_Victory_2-1 = "ふふっ、また来よっか。\n次は……先生と、二人きりで。ね？"
