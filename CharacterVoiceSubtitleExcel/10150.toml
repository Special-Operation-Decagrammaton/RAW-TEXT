10150-CVGroup_Formation_Select-1 = "ちょっと……どこ触ってるの？"
10150-CVGroup_Growup_1-1 = "陸地でも海について学べるのって、いいことだね。"
10150-CVGroup_Growup_2-1 = "さすがダイビング部のスポンサー。ありがとう。"
10150-CVGroup_Growup_3-1 = "学びの場って、地図に載るようなものじゃないんだよね。本当は。"
