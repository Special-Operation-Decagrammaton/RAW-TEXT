[translation]
10138-CVGroup_Battle_Buffed_1-1 = "ดะ... ได้ผลน่าทึ่งเลยแฮะ?"
10138-CVGroup_Battle_Covered_1-1 = "ขะ... ขอพักเดี๋ยวหนึ่ง!"
10138-CVGroup_Battle_Defense_1-1 = "ไม่หลงกลให้หรอก"
10138-CVGroup_Battle_In_1-1 = "ฮึ่ม หลอกฉันไม่ได้ง่ายๆ หรอก"
10138-CVGroup_Battle_In_2-1 = "ไม่ว่าจะวิญญาณหรืออะไรก็ออกมาเลย!\nฉันจะพิสูจน์ให้เองว่าไม่มีอยู่จริง!"
10138-CVGroup_Battle_Move_1-1 = "คงไม่มีเรื่องอะไรแปลกเกิดขึ้นข้างหน้า... ใช่มั้ย?"
10138-CVGroup_Battle_Move_2-1 = "เหมือนจะเห็นอะไรตรงโน้นเลย...? อะไรน่ะ?"
10138-CVGroup_Battle_Recovery_1-1 = "อ๊ะ! ขอบใจนะ!"
10138-CVGroup_Battle_TacticalAction_1-1 = "ย๊า...!"
10138-CVGroup_Battle_Victory_1-1 = "การคิดเชิงตรรกะของฉันไม่มีช่องโหว่หรอก!"
10138-CVGroup_Battle_Victory_2-1 = "อะไรเหรอที่เรียกว่ารหัสยศาสตร์ ไร้สาระจริงๆ"
10138-CVGroup_CommonSkill-1 = "อันนี้มีแค่อันเดียว เก็บไว้ให้ดีล่ะ!"
10138-CVGroup_ExSkill_1-1 = "คะ... ใครน่ะ?!"
10138-CVGroup_ExSkill_2-1 = "มะ... มีอะไรขยับอยู่ด้วย?!"
10138-CVGroup_ExSkill_3-1 = "ยะ... อย่าเอาแต่ซ่อนตัวสิ ออกมาเลยนะ!"
10138-CVGroup_ExSkill_Level_1-1 = "ฉันไม่ถูกหลอกหรอก!!"
10138-CVGroup_ExSkill_Level_2-1 = "หลอกตาฉันไม่ได้หรอก!"
10138-CVGroup_ExSkill_Level_3-1 = "ฉันจะเปิดโปงให้หมดเลย!!"
10138-CVGroup_Formation_In_1-1 = "จะ... จะพาไปไหนน่ะ...?"
10138-CVGroup_Formation_In_2-1 = "เอาละ เดินนำเลย แล้วฉันจะตามไป"
10138-CVGroup_Formation_Select-1 = "ว้าก!! ปะ... ปล่อยฉันนะ ครูคนบื้อ!"
10138-CVGroup_Growup_1-1 = "แค่ในที่แบบนี้ยังไม่พอหรอก ฉันจะพัฒนาขึ้นเรื่อยๆ\nจนกว่าจะได้เป็นสุดยอดแฟชั่นดีไซเนอร์ของคิโวทอสเลย"
10138-CVGroup_Growup_2-1 = "อ๊ะ! นึกดีไซน์ดีๆ ออกแล้ว!\nไว้ฉันจะเอามาให้คุณครูดูด้วยนะ"
10138-CVGroup_Growup_3-1 = "ถ้าก้าวไปข้างหน้าทีละก้าวแบบนี้เรื่อยๆ...\nสักวันฉันก็ต้อง...!"
10138-CVGroup_Growup_4-1 = "ทะ... ทำไมนะ...? จู่ๆ ก็รู้สึกสมองก็ปลอดโปร่งขึ้นมา...\nหรือว่านี่ก็เป็นรหัสยศาสตร์...?"
10138-CVGroup_Relationship_Up_1-1 = "ฉะ... ฉันไม่เชื่อเรื่องโชคชะตาหรอก! จริงๆ นะ!"
10138-CVGroup_Relationship_Up_2-1 = "ระ... รู้ได้ยังไงน่ะว่าฉันชอบ?\nใช้โทรจิต... หรืออะไรแบบนี้ใช่มั้ย?"
10138-CVGroup_Relationship_Up_3-1 = "รู้สึกเหมือน... ถูกมนต์สะกดแปลกๆ เลย\nฉันไม่เชื่อเรื่องรหัสยศาสตร์แท้ๆ..."
10138-CVGroup_Relationship_Up_4-1 = "ฉันก็ไม่ได้ไม่ชอบที่ถูกปฏิบัติแบบนี้หรอก แต่ว่า... ฮึ่ย~~~!"
10138-CVGroup_Tactic_In_1-1 = "คะ... คงไม่มีอะไรแปลกๆ... หรอกเนอะ?"
10138-CVGroup_Tactic_In_2-1 = "ฮึ่ม ฉันไม่กลัวเรื่องโชคลางพรรค์นั้นหรอก!"
10138-CVGroup_Tactic_Victory_1-1 = "อะไรกัน? ไม่เห็นใช่อะไรใหญ่โตสักหน่อย"
10138-CVGroup_Tactic_Victory_2-1 = "ก็แค่ข่าวลือเท่านั้นน่ะ"
