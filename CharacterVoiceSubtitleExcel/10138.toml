[translation]
10138-CVGroup_Battle_Buffed_1-1 = "神，神奇的效果呢？"
10138-CVGroup_Battle_Covered_1-1 = "等，等一下休息！"
10138-CVGroup_Battle_Defense_1-1 = "沒用！"
10138-CVGroup_Battle_In_1-1 = "哼，想騙我沒那麼容易。"
10138-CVGroup_Battle_In_2-1 = "幽靈還是什麼都出來吧！ 我會證明不存在的！"
10138-CVGroup_Battle_Move_1-1 = "前面，不會發生什麼奇怪的事吧？"
10138-CVGroup_Battle_Move_2-1 = "那邊好像看到什麼……？ 是什麼？"
10138-CVGroup_Battle_Recovery_1-1 = "啊！ 謝謝！"
10138-CVGroup_Battle_TacticalAction_1-1 = "嘿……！"
10138-CVGroup_Battle_Victory_1-1 = "我的邏輯思考沒有破綻！"
10138-CVGroup_Battle_Victory_2-1 = "什麼神秘學。真是無語。"
10138-CVGroup_CommonSkill-1 = "只有一個，好好珍惜！"
10138-CVGroup_ExSkill_1-1 = "你，你是誰啊！？"
10138-CVGroup_ExSkill_2-1 = "什，什麼東西動了？！"
10138-CVGroup_ExSkill_3-1 = "別，別躲著出來！"
10138-CVGroup_ExSkill_Level_1-1 = "騙不了我！！"
10138-CVGroup_ExSkill_Level_2-1 = "騙不過我的眼睛！"
10138-CVGroup_ExSkill_Level_3-1 = "全部揭穿！！"
10138-CVGroup_Formation_In_1-1 = "要，要帶我去哪……？"
10138-CVGroup_Formation_In_2-1 = "好，你先走。我跟著。"
10138-CVGroup_Formation_Select-1 = "刷！！ 放，放下我笨蛋老師！"
10138-CVGroup_Growup_1-1 = "不會在這裡停下。要繼續成長。\n直到成為奇普托斯最棒的時裝設計師！"
10138-CVGroup_Growup_2-1 = "啊！ 想到好設計了！ 之後也給老師看看！"
10138-CVGroup_Growup_3-1 = "這樣一步一步前進……總有一天我也……！"
10138-CVGroup_Growup_4-1 = "為，為什麼……？ 腦袋好像清醒了……。難道這也是神秘學……？"
10138-CVGroup_Relationship_Up_1-1 = "我，我才不信命運！ 真的！"
10138-CVGroup_Relationship_Up_2-1 = "怎，怎麼知道我喜歡的？ 心靈感應……不是吧？"
10138-CVGroup_Relationship_Up_3-1 = "好像中了什麼奇怪的咒語。我明明不信神秘學……"
10138-CVGroup_Relationship_Up_4-1 = "這樣被對待，不是討厭……。嗚嗚~~~！"
10138-CVGroup_Tactic_In_1-1 = "應，應該沒什麼奇怪的吧？"
10138-CVGroup_Tactic_In_2-1 = "哼，迷信什麼的才不怕！"
10138-CVGroup_Tactic_Victory_1-1 = "什麼嘛？ 沒什麼大不了的？"
10138-CVGroup_Tactic_Victory_2-1 = "果然只是謠言而已。"
