[translation]
10138-CVGroup_Battle_Buffed_1-1 = "有，有神奇的效果呢。"
10138-CVGroup_Battle_Covered_1-1 = "休，休息一下！"
10138-CVGroup_Battle_Defense_1-1 = "沒用的！"
10138-CVGroup_Battle_In_1-1 = "哼，想騙我沒那麼容易。"
10138-CVGroup_Battle_In_2-1 = "幽靈還是什麼都出來吧！\n我會證明那些都不存在的！"
10138-CVGroup_Battle_Move_1-1 = "這前面，不會發生什麼……奇怪的事吧？"
10138-CVGroup_Battle_Move_2-1 = "那邊，好像可以看到什麼……是什麼呢。"
10138-CVGroup_Battle_Recovery_1-1 = "啊！謝謝！"
10138-CVGroup_Battle_TacticalAction_1-1 = "呀啊……！"
10138-CVGroup_Battle_Victory_1-1 = "我的邏輯思考裡，沒有任何破綻！"
10138-CVGroup_Battle_Victory_2-1 = "什麼神秘學嘛，真是的。"
10138-CVGroup_CommonSkill-1 = "這是獨一無二的，要好好珍惜哦！"
10138-CVGroup_ExSkill_1-1 = "是，是誰！？"
10138-CVGroup_ExSkill_2-1 = "有，有什麼東西動了耶！？"
10138-CVGroup_ExSkill_3-1 = "別，別躲了快出來！"
10138-CVGroup_ExSkill_Level_1-1 = "我不會被騙的！！"
10138-CVGroup_ExSkill_Level_2-1 = "瞞不過我的雙眼的！？"
10138-CVGroup_ExSkill_Level_3-1 = "我會揭穿這一切！！"
10138-CVGroup_Formation_In_1-1 = "要，要帶我去哪裡……？"
10138-CVGroup_Formation_In_2-1 = "好了，你先走。我會跟在後面的。"
10138-CVGroup_Formation_Select-1 = "嚇啊──！！放，放我下來啦笨蛋老師！"
10138-CVGroup_Growup_1-1 = "我不會就這樣滿足，我會繼續成長。\n直到成為奇普托斯最棒的時裝設計師的那天為止！"
10138-CVGroup_Growup_2-1 = "啊！想到一個好設計了！之後也讓老師你看看！"
10138-CVGroup_Growup_3-1 = "只要像這樣一步一步前進……總有一天我也……！"
10138-CVGroup_Growup_4-1 = "為，為什麼……？感覺，腦袋好像變清醒了……\n難道，這也是神秘學……？"
10138-CVGroup_Relationship_Up_1-1 = "我，我才不相信命運之類的！我是說真的！"
10138-CVGroup_Relationship_Up_2-1 = "為，為什麼會知道我喜歡的東西？\n應該不是……心電感應，之類的吧？"
10138-CVGroup_Relationship_Up_3-1 = "感覺……好像中了什麼奇怪的咒語……\n神秘學什麼的，我明明不信的……"
10138-CVGroup_Relationship_Up_4-1 = "像這樣被對待，並不會，感到討厭……\n唔唔…………！"
10138-CVGroup_Tactic_In_1-1 = "沒，沒有什麼奇怪的……東西吧？"
10138-CVGroup_Tactic_In_2-1 = "哼，迷信什麼的才不可怕！"
10138-CVGroup_Tactic_Victory_1-1 = "怎麼？沒什麼大不了的嘛？"
10138-CVGroup_Tactic_Victory_2-1 = "果然只是謠言而已。"
