[translation]
20059-CVGroup_CommonSkill-1 = "有～一點點燙哦？"
20059-CVGroup_ExSkill_1-1 = "咯呵呵，被騙了吧？"
20059-CVGroup_ExSkill_2-1 = "Surprise～！"
20059-CVGroup_ExSkill_3-1 = "鏘～這是什～麼？"
20059-CVGroup_ExSkill_Level_1-1 = "你看你看！是可愛的棉花糖哦？"
20059-CVGroup_ExSkill_Level_2-1 = "啊哈哈！接招吧～"
20059-CVGroup_ExSkill_Level_3-1 = "你猜到了嗎？"
20059-CVGroup_Formation_In_1-1 = "要在這裡玩嗎？好啊！要玩什麼？"
20059-CVGroup_Formation_In_2-1 = "咯呵呵，交給我吧！"
20059-CVGroup_Formation_Select-1 = "什麼什麼～？這是什麼遊戲？"
20059-CVGroup_Growup_1-1 = "無月醬，好像長大了哦！\n那麼，是哪裡長大了～呢？"
20059-CVGroup_Growup_2-1 = "這也就代表……\n更～誇張一點的惡作劇也可以做的意思囉？\n咯呵呵！"
20059-CVGroup_Growup_3-1 = "沒問題嗎？\n就算到時候控制不了，我也不管哦～？"
20059-CVGroup_Growup_4-1 = "啊哈哈哈！感覺可以玩得更開心了！"
20059-CVGroup_Relationship_Up_1-1 = "老師你啊，對自己做的這些事的意義……真的有搞清楚嗎？咯呵呵。"
20059-CVGroup_Relationship_Up_2-1 = "啊哈哈！我也最～喜歡老師了！各方面都是哦♪"
20059-CVGroup_Relationship_Up_3-1 = "哼嗯……這種感情的名字，我知道哦。\n如果你在意的話，要我告訴你嗎？"
20059-CVGroup_Relationship_Up_4-1 = "嘿～？哼嗯～？這樣啊。\n老師你，想要跟我變得更～要好呢。"
