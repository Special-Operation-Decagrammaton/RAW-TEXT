[translation]
20059-CVGroup_CommonSkill-1 = "ค่อนข้างร้อนนะเนี่ย!"
20059-CVGroup_ExSkill_1-1 = "ฮุฮุฮุ โดนหลอกแล้วสินะ?"
20059-CVGroup_ExSkill_2-1 = "เซอร์ไพรส์~!"
20059-CVGroup_ExSkill_3-1 = "แถ่นแท้น นี่อะไรเอ่ย?"
20059-CVGroup_ExSkill_Level_1-1 = "สายไหมสวยๆ ไงล่ะ!"
20059-CVGroup_ExSkill_Level_2-1 = "เอ้า เอานี่ไปกินซะ!"
20059-CVGroup_ExSkill_Level_3-1 = "คิดไม่ถึงล่ะสิ?"
20059-CVGroup_Formation_In_1-1 = "จะเล่นกันที่นี่เหรอ? ดีละ! เล่นอะไรกันดี?"
20059-CVGroup_Formation_In_2-1 = "ฮุฮุฮุ ไว้ใจเค้าได้เลย!"
20059-CVGroup_Formation_Select-1 = "ฮืม~? นี่เกมอะไรน่ะ?"
20059-CVGroup_Growup_1-1 = "คุณครู! เค้าทำได้แล้ว!\nพัฒนาตรงไหนบ้างน้า~?"
20059-CVGroup_Growup_2-1 = "นี่มัน... หมายความว่าเค้าแกล้งคนอื่นแรงๆ ก็ได้ใช่มั้ย? หุหุหุ"
20059-CVGroup_Growup_3-1 = "ฮืม~? ไม่เป็นไรงั้นเหรอ? จะรับมือไหวแน่เหรอ?"
20059-CVGroup_Growup_4-1 = "อะฮะฮ่า! งั้นก็คงเล่นสนุกได้มากกว่าเดิมแล้วสินะ!"
20059-CVGroup_Relationship_Up_1-1 = "รู้มั้ยว่าแบบนี้มันหมายความว่ายังไง? ฮุฮุฮุ"
20059-CVGroup_Relationship_Up_2-1 = "อะฮะฮ่า! เค้าชอบคุณครูจัง! ในหลายๆ ความหมายเลยละ♪"
20059-CVGroup_Relationship_Up_3-1 = "ความรู้สึกนี้ เค้าก็ไม่รู้ว่ามันคืออะไร\nถ้าอยากรู้ละก็... ให้เค้าอธิบายให้ฟังมั้ย?"
20059-CVGroup_Relationship_Up_4-1 = "ฮืม~ งั้นเหรอ?\nครูอยากใกล้ชิดกับเค้าขึ้นอีกใช่มั้ยล่ะ?"
