[translation]
20060-CVGroup_CommonSkill-1 = "伊吹來把你打扮得可愛一點～！"
20060-CVGroup_ExSkill_1-1 = "哇～！你看你看！\n好漂亮～！"
20060-CVGroup_ExSkill_2-1 = "我看看……最可愛的是～\n這個！送給老師！"
20060-CVGroup_ExSkill_3-1 = "有好多漂亮的貝殼～！\n來，老師！"
20060-CVGroup_ExSkill_4-1 = "哇！好漂～亮！……呼嚕呼嚕。"
20060-CVGroup_ExSkill_5-1 = "貝殼們～集合到這根手指上～！……呼哇。"
20060-CVGroup_ExSkill_6-1 = "老師！這些全～部都是伊吹做的！……誇獎我～"
20060-CVGroup_ExSkill_Level_1-1 = "來，這個！是護身符哦！"
20060-CVGroup_ExSkill_Level_2-1 = "這個可愛的，送給你！"
20060-CVGroup_ExSkill_Level_3-1 = "跟伊吹是一對的呢！"
20060-CVGroup_ExSkill_Level_4-1 = "耶嘿嘿，很可愛對吧～？"
20060-CVGroup_ExSkill_Level_5-1 = "呼……完～成！"
20060-CVGroup_ExSkill_Level_6-1 = "這是「巨匠」伊吹的作品！嘿嘿！"
20060-CVGroup_Formation_In_1-1 = "耶嘿嘿，伊吹來了哦！"
20060-CVGroup_Formation_In_2-1 = "老師也要來嗎？好耶～！"
20060-CVGroup_Formation_Select-1 = "伊吹號，出航～！"
20060-CVGroup_Growup_1-1 = "活力滿滿～！耶嘿嘿！"
20060-CVGroup_Growup_2-1 = "接下來，伊吹會保護老師唷！\n要跟著伊吹哦！"
20060-CVGroup_Growup_3-1 = "難道說……這就是所謂的「長大成人」嗎？"
20060-CVGroup_Growup_4-1 = "伊吹，在船上也會努力哦！"
20060-CVGroup_Relationship_Up_1-1 = "想跟老師玩！老師覺得呢？\n伊吹還想玩更多更～多哦！"
20060-CVGroup_Relationship_Up_2-1 = "伊吹呢，只要跟老師待在一起就超開心的！\n為什麼呢！好神奇！"
20060-CVGroup_Relationship_Up_3-1 = "耶嘿嘿……伊吹在等著老師哦～"
20060-CVGroup_Relationship_Up_4-1 = "老師，你不熱嗎？\n這邊這邊！到陽傘下面，跟伊吹悠閒一下吧！"
