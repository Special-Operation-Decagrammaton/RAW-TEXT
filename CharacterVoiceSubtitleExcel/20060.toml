[translation]
20060-CVGroup_CommonSkill-1 = "イブキがかわいくしてあげる～！"
20060-CVGroup_ExSkill_1-1 = "わぁ～！見て見て！\nきれ～！"
20060-CVGroup_ExSkill_2-1 = "えっとね……一番かわいいのは～\nこれ！先生にあげる！"
20060-CVGroup_ExSkill_3-1 = "きれいな貝殻がいっぱい～！\nはい、先生！"
20060-CVGroup_ExSkill_4-1 = "わあ！すっごくきれー！……むにゃむにゃ。"
20060-CVGroup_ExSkill_5-1 = "貝殻のみんな～この指と～まれ！……ふわぁ。"
20060-CVGroup_ExSkill_6-1 = "先生！これぜーんぶ、イブキが作ったの！……ほめて～"
20060-CVGroup_ExSkill_Level_1-1 = "はいこれ！お守りだよ！"
20060-CVGroup_ExSkill_Level_2-1 = "こっちのかわいいの、あげる！"
20060-CVGroup_ExSkill_Level_3-1 = "イブキとお揃いだね！"
20060-CVGroup_ExSkill_Level_4-1 = "えへへ、かわいいでしょー？"
20060-CVGroup_ExSkill_Level_5-1 = "ふぅ……かんせーい！"
20060-CVGroup_ExSkill_Level_6-1 = "「巨匠」イブキの作品、です！へへ！"
20060-CVGroup_Formation_In_1-1 = "えへへ、イブキがきたよ！"
20060-CVGroup_Formation_In_2-1 = "先生も来るの？やったー！"
20060-CVGroup_Formation_Select-1 = "イブキ号、しゅっこ～！"
20060-CVGroup_Growup_1-1 = "元気もりもり～！えへへっ！"
20060-CVGroup_Growup_2-1 = "これからは、イブキが先生をまもるよ！\nイブキについてきてね！"
20060-CVGroup_Growup_3-1 = "もしかして……これが「大人になる」ってこと？"
20060-CVGroup_Growup_4-1 = "イブキ、お船の上でも頑張るよ！"
20060-CVGroup_Relationship_Up_1-1 = "先生といっぱい遊びたい！ね、先生はどう？\nイブキはもっともーっと遊びたいよ！"
20060-CVGroup_Relationship_Up_2-1 = "イブキね、先生と一緒にいるとすっごく楽しいんだ！\nなんでだろね！不思議！"
20060-CVGroup_Relationship_Up_3-1 = "えへへ……イブキ、先生のこと、待ってたよ～"
20060-CVGroup_Relationship_Up_4-1 = "先生、暑くない？\nこっちこっち！パラソルの下で、イブキとのんびりしよ！"
