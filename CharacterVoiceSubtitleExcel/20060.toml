20060-CVGroup_Growup_4-1 = "ต่อให้อยู่บนทะเล ตอนนี้อิบูกิก็รู้สึกว่าจะไม่แพ้แล้ว!"
20060-CVGroup_Relationship_Up_1-1 = "อยากเล่นกับคุณครู! ให้บ่อยๆ มากกว่านี้!"
20060-CVGroup_Relationship_Up_2-1 = "แปลกจัง~ ทำไมแค่อยู่ข้างๆ คุณครูก็สนุกแล้วนะ?"
20060-CVGroup_Relationship_Up_3-1 = "ฮิฮิฮิ... อิบูกิรอคุณครูอยู่เลย!"
20060-CVGroup_Relationship_Up_4-1 = "ร้อนมั้ย คุณครู? มาเล่นกับอิบูกิใต้ร่มกันเถอะ!"
