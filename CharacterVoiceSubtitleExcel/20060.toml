[translation]
20060-CVGroup_CommonSkill-1 = "อิบูกิจะตกแต่งให้สวยๆ เอง~!"
20060-CVGroup_ExSkill_1-1 = "ว้าว~ คุณครู ดูสิ~! อันที่สวยที่สุด~!"
20060-CVGroup_ExSkill_2-1 = "อันนี้ แล้วก็อันนี้~ อันนี้ให้นะคุณครู!"
20060-CVGroup_ExSkill_3-1 = "มีเปลือกหอยเต็มไปหมดเลย! ฮิฮิ คุณครู นี่!"
20060-CVGroup_ExSkill_4-1 = "ว้าว! เปลือกหอยหลากสีเต็มไปหมด! ฟี้... ฟี้..."
20060-CVGroup_ExSkill_5-1 = "เปลือกหอยทุกชิ้น มารวมกันตรงนี้ ตรงนี้เลย! คร่อก..."
20060-CVGroup_ExSkill_6-1 = "คุณครู นี่อิบูกิทำเองทั้งหมดเลยนะ! ชมหน่อยสิ..."
20060-CVGroup_ExSkill_Level_1-1 = "ถ้ามีอันนี้ละก็ พลังเพิ่มร้อยเท่าเลย!"
20060-CVGroup_ExSkill_Level_2-1 = "จะให้อันที่น่ารักที่สุดนะ!"
20060-CVGroup_ExSkill_Level_3-1 = "เป็นเซ็ตเดียวกับอิบูกิเลย!"
20060-CVGroup_ExSkill_Level_4-1 = "เป็นไง? สวยมั้ย?"
20060-CVGroup_ExSkill_Level_5-1 = "ฮู่ว~ เท่านี้ก็เสร็จแล้ว~!"
20060-CVGroup_ExSkill_Level_6-1 = "ฮุฮุ! ผลงานของจิตรกรอิบูกิค่ะ!"
20060-CVGroup_Formation_In_1-1 = "ฮิฮิฮิ อิบูกิมาแล้ว คุณครู!"
20060-CVGroup_Formation_In_2-1 = "คุณครูก็จะมาด้วยใช่มั้ย?"
20060-CVGroup_Formation_Select-1 = "เรืออิบูกิออกเดินทางแล้ว คุณครู!"
