[translation]
20057-CVGroup_CommonSkill-1 = "Commencing cleaning."
20057-CVGroup_ExSkill_1-1 = "Oh my. Hello there."
20057-CVGroup_ExSkill_2-1 = "So this is where you were?"
20057-CVGroup_ExSkill_3-1 = "Are you done hiding?"
20057-CVGroup_ExSkill_Level_1-1 = "Now then, I'll be wrapping up."
20057-CVGroup_ExSkill_Level_2-1 = "That's it for today's work."
20057-CVGroup_ExSkill_Level_3-1 = "Let's make this place squeaky clean."
20057-CVGroup_Formation_In_1-1 = "Where would you like me to take you?"
20057-CVGroup_Formation_In_2-1 = "Would you like to experience everyday life at Millennium with me?"
20057-CVGroup_Formation_Select-1 = "It feels a bit strange, but also a bit exciting, to call your name like this... Sensei?"
20057-CVGroup_Growup_1-1 = "As a maid, I must be proficient in everything. Same goes as a student as well."
20057-CVGroup_Growup_2-1 = "Thank you for always looking over me. I will repay your kindness one day."
20057-CVGroup_Growup_3-1 = "I believe everything comes down to consistent daily effort. If you were to join me in my routine... Perhaps a different future will be waiting for us."
20057-CVGroup_Growup_4-1 = "I was thinking of new cleaning methods in my free time. Demolition explosives have caught my eye lately."
20057-CVGroup_Relationship_Up_1-1 = "Sometimes I wonder... What if I had met Sensei under different circumstances? Like as classmates, for example... Fufu. But you still would've been you, regardless."
20057-CVGroup_Relationship_Up_2-1 = "It is only natural for a student to be wearing a uniform. Do you know how happy it makes me every time I hear that it looks good, though?"
20057-CVGroup_Relationship_Up_3-1 = "Thank you as always, Sensei. And... And... I thought I'd hardened my resolve, but it's surprisingly difficult to say this. But... I'll always, um, well...admire you."
20057-CVGroup_Relationship_Up_4-1 = "There's an empty classroom... Could you meet me there after school? Fufu. That was a joke. ...For now."
