[translation]
20057-CVGroup_CommonSkill-1 = "打掃，開始了。"
20057-CVGroup_ExSkill_1-1 = "哎呀。您好？"
20057-CVGroup_ExSkill_2-1 = "在這裡啊？"
20057-CVGroup_ExSkill_3-1 = "都躲好了嗎？"
20057-CVGroup_ExSkill_Level_1-1 = "那麼，要收尾了。"
20057-CVGroup_ExSkill_Level_2-1 = "這次的工作，到此為止。"
20057-CVGroup_ExSkill_Level_3-1 = "乾淨地打掃吧。"
20057-CVGroup_Formation_In_1-1 = "要帶你去哪裡？"
20057-CVGroup_Formation_In_2-1 = "千年的日常，要一起嗎？"
20057-CVGroup_Formation_Select-1 = "雖然不新鮮但這樣稱呼也挺新鮮的。……老師？"
20057-CVGroup_Growup_1-1 = "作為女僕，要擅長所有事情。作為學生也一樣。"
20057-CVGroup_Growup_2-1 = "一直照顧我，謝謝。老師的恩情，應該報答才是。"
20057-CVGroup_Growup_3-1 = "一切都是每天的努力。\n如果，老師能陪伴那些日常……也許，會有不同的未來呢。"
20057-CVGroup_Growup_4-1 = "有了餘裕，想著新的打掃方法。\n最近在研究拆除用的爆炸物彈匣……"
20057-CVGroup_Relationship_Up_1-1 = "有時，我不由得會想像。\n如果和老師以不同的方式相遇會變得如何。\n例如……「同學」之類的……呵呵。\n不過，老師果然還是「老師」吧。"
20057-CVGroup_Relationship_Up_2-1 = "學生穿制服是理所當然的。\n不過，被說很適合的話，不管什麼時候都很開心哦？"
20057-CVGroup_Relationship_Up_3-1 = "一直謝謝您。老師。還有…… 還有…… 下了很大決心，但意外地很難說出口。\n但是……一直，那個，是的。敬愛著。"
20057-CVGroup_Relationship_Up_4-1 = "放學後，有空教室……能來嗎？\n 呵呵。開玩笑的。……現在是的。"
