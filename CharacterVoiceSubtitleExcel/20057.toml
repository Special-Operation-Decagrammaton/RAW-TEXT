[translation]
20057-CVGroup_CommonSkill-1 = "จะเริ่มทำความสะอาดเลยนะคะ"
20057-CVGroup_ExSkill_1-1 = "ตายจริง สวัสดีค่ะ"
20057-CVGroup_ExSkill_2-1 = "อยู่ที่นี่เองเหรอคะ?"
20057-CVGroup_ExSkill_3-1 = "ซ่อนตัวเสร็จหรือยังคะ?"
20057-CVGroup_ExSkill_Level_1-1 = "ถ้างั้นฉันจะจัดการให้เสร็จนะคะ"
20057-CVGroup_ExSkill_Level_2-1 = "จบงานนี้เพียงเท่านี้"
20057-CVGroup_ExSkill_Level_3-1 = "ฉันจะทำให้สะอาดเลยค่ะ"
20057-CVGroup_Formation_In_1-1 = "ให้ฉันพาไปที่ไหนดีคะ?"
20057-CVGroup_Formation_In_2-1 = "ไปชมชีวิตประจำวันในมิลเลเนียมด้วยกันมั้ยคะ?"
20057-CVGroup_Formation_Select-1 = "จะว่าไปแล้ว การเรียกแบบนี้\nก็แปลกใหม่ดีเหมือนกันนะคะ คุณครู...?"
20057-CVGroup_Growup_1-1 = "เมดต้องมีความสามารถรอบด้านค่ะ\nนักเรียนก็เหมือนกันค่ะ"
20057-CVGroup_Growup_2-1 = "ขอบคุณที่คอยเฝ้าดูฉันเสมอนะคะ\nฉันต้องตอบแทนบุญคุณของคุณครูแล้วละค่ะ"
20057-CVGroup_Growup_3-1 = "ทุกอย่างขึ้นอยู่กับความพยายามในแต่ละวันค่ะ\nถ้าคุณครูมาใช้ชีวิตประจำวันกับฉัน...\nบางทีอาจมีอนาคตแบบอื่นรอฉันอยู่ก็ได้นะคะ"
20057-CVGroup_Growup_4-1 = "ฉันพอมีเวลาว่าง ก็เลยไปคิดหา\nวิธีทำความสะอาดใหม่มาค่ะ\nช่วงนี้ฉันศึกษาตลับระเบิดสำหรับรื้อถอนอยู่ค่ะ..."
20057-CVGroup_Relationship_Up_1-1 = "บางครั้งฉันก็คิดแบบนั้นค่ะ ถ้าฉันได้เจอคุณครู\nในรูปแบบที่ต่างออกไปจะเป็นยังไงนะ... อย่างเช่น\nเป็น 'เพื่อนร่วมชั้น' กัน... ฮุฮุ\nแต่ยังไงคุณครูก็คงเป็น 'คุณครู' อยู่ดีค่ะ"
20057-CVGroup_Relationship_Up_2-1 = "นักเรียนใส่ชุดนักเรียนเป็นเรื่องปกติอยู่แล้วค่ะ\nแต่ถ้าบอกว่าใส่แล้วเข้ากัน ได้ยินเมื่อไรก็น่าดีใจนะคะ"
20057-CVGroup_Relationship_Up_3-1 = "ขอบคุณเสมอๆ เลยค่ะ คุณครู แล้วก็... แล้วก็...\nฉันรวบรวมความกล้ามาแล้ว แต่ก็พูดออกมายากจังเลยนะคะ\nแต่ว่า... ไม่ว่าจะเมื่อไร เอ่อ... ค่ะ ฉันก็เคารพรักเสมอนะคะ"
20057-CVGroup_Relationship_Up_4-1 = "หลังเลิกเรียนมีห้องเรียนว่างอยู่... ช่วยมาหาที่นั่นจะได้มั้ยคะ?\nฮุฮุ ฉันล้อเล่นค่ะ... อย่างน้อยก็ในตอนนี้นะคะ"
