[translation]
10151-CVGroup_UITitle_Idle1-1 = "블루 아카이브!"
10151-CVGroup_CharacterGet_Idle1-1 = "183호 특별반의 반장, 니키 안나입니다.\n미안해요, 사인은 나중에."
10151-CVGroup_Cafe_Idle1-1 = "(사인용 펜, 준비 오케이!)"
10151-CVGroup_Cafe_Idle2-1 = "이거, 아주 멋진 의자네요!\n앉을수도 있고, 무기로도 쓸 수 있죠!"
10151-CVGroup_Cafe_Idle3-1 = "멋진 디자인…… 감명깊군요."
10151-CVGroup_Cafe_Idle4-1 = "아아…… 눈치채셨군요.\n네에, 그렇답니다.\n제가 니키 안나에요."
10151-CVGroup_Cafe_Idle5-1 = "(이 방에서, 레슬링의 재능이 느껴지네요……)"
10151-CVGroup_WeaponGet_Idle1-1 = "감사합니다, 선생님.\n이거, 전동 공구처럼 쓰임새가 많거든요.\n……정말 감사합니다."
10151-CVGroup_UIEventLobby_Enter1-1 = "붉은겨울의 자랑인\n과학자들의 반-"
10151-CVGroup_UIEventLobby_Enter1-2 = "183호 특별반에, 어서오세요!"
10151-CVGroup_UIEventLobby_Enter1-3 = "그리고, 제가 183호 \n특별반의 반장, \n니키 안나입니다."
10151-CVGroup_UIEventLobby_Enter2-1 = "전차 만드는거요?\n그런거, 식은 죽 먹기랍니다."
10151-CVGroup_UIEventLobby_Enter3-1 = "진척이요? \n아, 아아- 그럼요! \n당연히 잘 되어가죠! "
10151-CVGroup_UIEventLobby_Enter3-2 = "네에……."
10151-CVGroup_UIEventLobby_Enter4-1 = "자신?\n저는 당연히, 자신 있죠……"
10151-CVGroup_UIEventLobby_Enter4-2 = "아하하, 하……."
10151-CVGroup_UIEventLobby_Enter5-1 = "우웃…… 웃……"
10151-CVGroup_UIEventLobby_Enter5-2 = "감사…… 합니다아아……!"
10151-CVGroup_UIEventLobby_Idle1-1 = "네에-\n제가 그 천재입니다."
10151-CVGroup_UIEventLobby_Idle1-2 = "마스크 쓴 대역이\n아니에요."
10151-CVGroup_UIEventLobby_Idle1-3 = "지, 지햐호…… \n혼힝, 마햐효……!"
10151-CVGroup_UIEventLobby_Idle2-1 = "쓰담쓰담……?\n보, 보통은 악수를 하지 않나요?"
10151-CVGroup_UIEventLobby_Idle3-1 = "붉은겨울의 발명은 대부분\n저희 작품이에요."
10151-CVGroup_UIEventLobby_Idle3-2 = "뭐……\n자발적인 건\n아니지만요."
10151-CVGroup_UIEventLobby_Idle4-1 = " 특별반 탈……\n수료도 얼마 안남은\n것 같네요."
10151-CVGroup_UIEventShop_Enter1-1 = "쇼핑, 이네요.\n항상 사와달라고 부탁하고 있어서,\n직접 오는 건 간만이에요."
10151-CVGroup_UIEventShop_Enter2-1 = "쇼핑…….\n어, 어떻게 하는거더라……?"
10151-CVGroup_UIEventShop_Enter3-1 = "'폐점 세일'은 없나요……?\n신문에서는 그런게 있다고……"
10151-CVGroup_UIEventShop_Enter3-2 = "에엣……."
10151-CVGroup_UIEventShop_Idle1-1 = "저기…… \n저도 사고 싶은게 있는데요……"
10151-CVGroup_UIEventShop_Idle1-2 = "같이 찾아주시면 감사하겠습니다."
10151-CVGroup_UIEventShop_Idle1-3 = "그러니까- GOST 5632가\n100kg 정도 필요한데,"
10151-CVGroup_UIEventShop_Idle1-4 = "찾으시면 알려주세요."
10151-CVGroup_UIEventShop_Idle2-1 = "왜, 왜그러시나요?\n제가 뭔가 사드릴 수는 없는데……."
10151-CVGroup_UIEventShop_Buy1-1 = "조달 계약도 필요 없군요,\n감사합니다."
10151-CVGroup_UIEventShop_Buy2-1 = "여기서 열심히 하면\n사면이라던가…… \n하지는 않겠죠."
10151-CVGroup_UIEventShop_Buy3-1 = "훌륭한 선택이에요. \n네에, 제 업적들처럼요."
10151-CVGroup_UIEventShop_Buy4-1 = "계산도 완벽하네요."
10151-CVGroup_UIEventMission_Enter1-1 = "리스트가 잔뜩……\n관리자의 실력, 보여줘야 겠네요."
10151-CVGroup_UIEventMission_Enter2-1 = "'리스트를 확인할 것'"
10151-CVGroup_UIEventMission_Enter2-2 = "네, 체크리스트에 잘 적어뒀네요."
10151-CVGroup_UIEventMission_Idle1-1 = "목표를 먼저 끝내죠.\n사인은 나중에."
10151-CVGroup_UIEventMission_Idle2-1 = "얼른 마치고 같이 쉬죠, 선생님."
10151-CVGroup_UIEventMission_Buy1-1 = "칭찬과 보상은 아무리 많아도\n문제 없습니다."
10151-CVGroup_UIEventMission_Buy2-1 = "선생님께도 보상이 필요해요. \n네에, 당연히요."
10151-CVGroup_UIEventMission_Interaction1-1 = "오늘은 여기까지. \n목표 달성이네요."
