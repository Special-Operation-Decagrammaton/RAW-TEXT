[translation]
20060-CVGroup_UITitle_Idle1-1 = "Blue~ Archive ค่ะ!"
20060-CVGroup_CharacterGet_Idle1-1 = "คราวนี้ไปทะเล! ออกเรือไปกับอิบูกินะ คุณครู!"
20060-CVGroup_Cafe_Idle1-1 = "ก่อนเข้ามาก็ปัดทราย... แล้วก็เช็ดน้ำแล้วด้วย... "
20060-CVGroup_Cafe_Idle2-1 = "ถ้าดื่มกาแฟ จะเล่นสนุกได้นานขึ้นหรือเปล่านะ?"
20060-CVGroup_Cafe_Idle3-1 = "ถ้ารออีกนิดคุณครูก็คงมาละเนอะ?"
20060-CVGroup_Cafe_Idle4-1 = "ที่นี่มีพุดดิ้งขายด้วยหรือเปล่านะ?"
20060-CVGroup_Cafe_Idle5-1 = "กาแฟมีกลิ่นหอม แต่ทำไมรสชาติถึงขมกันนะ?"
20060-CVGroup_WeaponGet_Idle1-1 = "จะกอดแน่นๆ~ แล้วเก็บไว้อย่างดีเลยละ!\nขอบคุณนะคะ คุณครู!"
20060-CVGroup_UIEventLobby_Enter1-1 = "รู้มั้ย? อิบูกิน่ะ เพิ่งมาทะเลครั้งแรก\nก็เลยตื่นเต้นมากเลย"
20060-CVGroup_UIEventLobby_Enter1-2 = "ดีใจจริงๆ ที่ได้มากับคุณครู!"
20060-CVGroup_UIEventLobby_Enter2-1 = "รุ่นพี่อิโรฮะดูงานยุ่งมากเลย"
20060-CVGroup_UIEventLobby_Enter2-2 = "อิบูกิก็อยากช่วยงานด้วย!"
20060-CVGroup_UIEventLobby_Enter3-1 = "ทุกคนอย่าทะเลาะกันนะ... อิบูกิไม่ชอบการทะเลาะกัน..."
20060-CVGroup_UIEventLobby_Enter3-2 = "แงงง... เป็นเพราะอิบูกิเหรอ?\nเพราะอิบูกิเป็นเด็กไม่ดีเหรอ?"
20060-CVGroup_UIEventLobby_Enter4-1 = "อาย อาย! กัปตัน! โยะโฮโฮ!"
20060-CVGroup_UIEventLobby_Enter5-1 = "รู้มั้ย! รู้มั้ย! อิบูกิน่ะ สนุกกับทะเลมากเลย!"
20060-CVGroup_UIEventLobby_Enter5-2 = "คราวหน้าถ้าได้มาอีก... ฟี้... ฟี้..."
20060-CVGroup_UIEventLobby_Idle1-1 = "เป็นอะไรเหรอ คุณครู?"
20060-CVGroup_UIEventLobby_Idle1-2 = "จะเล่นกับอิบูกิเหรอ?"
20060-CVGroup_UIEventLobby_Idle2-1 = "รู้มั้ย? รุ่นพี่จิอากิถ่ายรูปอิบูกิไว้เยอะมากเลยนะ?"
20060-CVGroup_UIEventLobby_Idle2-2 = "เพราะงั้นอิบูกิเลยมีรูปถ่ายเยอะมาก!"
20060-CVGroup_UIEventLobby_Idle3-1 = "คุณครู! ตรงสุดขอบโน้นนนนน~"
20060-CVGroup_UIEventLobby_Idle3-2 = "จนถึงตรงนั้นเลย...! มีแต่ทะเลเต็มไปหมด!"
20060-CVGroup_UIEventLobby_Idle4-1 = "จะได้เจอคุณปลาที่พูดได้มั้ยนะ?"
20060-CVGroup_UIEventLobby_Idle4-2 = "อิบูกิเคยเห็นในหนังมาน่ะ!"
20060-CVGroup_UIEventMission_Enter1-1 = "เชิญเลย คุณครู! ตรงนี้อิบูกิเป็นคนรับผิดชอบ!"
20060-CVGroup_UIEventMission_Enter1-2 = "ก็อิบูกิเป็นสมาชิกแพนเดโมเนียม โซไซตี้เต็มตัวนี่นา!"
20060-CVGroup_UIEventMission_Enter2-1 = "มีแต่อะไรยากๆ เต็มไปหมด...!"
20060-CVGroup_UIEventMission_Enter2-2 = "คุณครูรู้มั้ยว่าทั้งหมดนี่คืออะไร?"
20060-CVGroup_UIEventMission_Buy1-1 = "เก่งมากค่ะ! ฮิฮิฮิ!\nตราประทับต้องปั๊มกันแบบนี้! จำได้แล้วนะ!"
20060-CVGroup_UIEventMission_Buy2-1 = "คุณครู ยุ่งอยู่เหรอ? อิบูกิจะช่วยงานคุณครูด้วย!"
20060-CVGroup_UIEventMission_Interaction1-1 = "คุณครู ตั้งใจ ทำการบ้าน ได้ดีมากค่ะ ฮิฮิฮิ"
20060-CVGroup_UIEventMission_Idle1-1 = "อะแฮ่ม! ตอนนี้อิบูกิกำลังทำงานอยู่!"
20060-CVGroup_UIEventMission_Idle1-2 = "ถ้าจะเล่น ต้องรอหลังงานเสร็จค่ะ!"
20060-CVGroup_UIEventMission_Idle2-1 = "อิบูกิทำคนเดียวได้อยู่แล้ว"
20060-CVGroup_UIEventMission_Idle2-2 = "แต่ก็ชอบการทำงานร่วมกับคุณครูนะ!"
