[translation]
20060-CVGroup_UITitle_Idle1-1 = "ブル～アーカイブ、だよ！"
20060-CVGroup_CharacterGet_Idle1-1 = "イブキもみんなと海行く！\n先生も一緒にしゅっこ～！"
20060-CVGroup_Cafe_Idle1-1 = "海から出たら、砂を落として、身体を拭いて～……。"
20060-CVGroup_Cafe_Idle2-1 = "コーヒーを飲んだら、イブキももっと長く遊べるかなぁ？"
20060-CVGroup_Cafe_Idle3-1 = "先生～まだかなあ～えへへ……。"
20060-CVGroup_Cafe_Idle4-1 = "ここ、プリン売ってるかなぁ？"
20060-CVGroup_Cafe_Idle5-1 = "コーヒーって、いい匂いがするのにすっごく苦いの、なんでだろ～？"
20060-CVGroup_WeaponGet_Idle1-1 = "イブキ、これずっとずーっと大事にするね！\n絶対！ありがとう、先生！"
20060-CVGroup_UIEventLobby_Enter1-1 = "イブキね、海、はじめてだから……すっごく楽しみにしてたの。"
20060-CVGroup_UIEventLobby_Enter1-2 = "先生と一緒に来れて、イブキ嬉しい！"
20060-CVGroup_UIEventLobby_Enter2-1 = "イロハ先輩、忙しそう。"
20060-CVGroup_UIEventLobby_Enter2-2 = "イブキが手伝ってあげる！"
20060-CVGroup_UIEventLobby_Enter3-1 = "みんな、ケンカしないで……ケンカはいやだよぉ……。"
20060-CVGroup_UIEventLobby_Enter3-2 = "うぅ……イブキが悪い子だから……？\nイブキのせい……？"
20060-CVGroup_UIEventLobby_Enter4-1 = "アイアイ！キャプテン！ヨーホー！"
20060-CVGroup_UIEventLobby_Enter5-1 = "あのねあのね、イブキ、海で遊ぶの、本当に楽しかったよ！"
20060-CVGroup_UIEventLobby_Enter5-2 = "だからまた、みんなで、来よう、ね……ぐーぐー……。"
20060-CVGroup_UIEventLobby_Idle1-1 = "先生、どうしたの～？"
20060-CVGroup_UIEventLobby_Idle1-2 = "えへへ、イブキと遊んでくれるの？"
20060-CVGroup_UIEventLobby_Idle2-1 = "チアキ先輩はね、いつもイブキの写真をい～っぱい撮ってくれるんだ！"
20060-CVGroup_UIEventLobby_Idle2-2 = "だから、イブキが映ってる写真、こーんなにあるの！"
20060-CVGroup_UIEventLobby_Idle3-1 = "先生！みて！すごい！すごーい！"
20060-CVGroup_UIEventLobby_Idle3-2 = "ここから、ここまで！ぜーんぶ海だよ～！"
20060-CVGroup_UIEventLobby_Idle4-1 = "お話しできるお魚さん、いるかなぁ？"
20060-CVGroup_UIEventLobby_Idle4-2 = "映画でね、見たの！\nこんにちはー！っておしゃべりできるんだよ！"
20060-CVGroup_UIEventMission_Enter1-1 = "いらっしゃーい先生！\nここはイブキが担当しているよ！"
20060-CVGroup_UIEventMission_Enter1-2 = "イブキも、ぱんでもにうむ〜そさえてぃ〜の一員、だからね！"
20060-CVGroup_UIEventMission_Enter2-1 = "わ～！難しそう……！"
20060-CVGroup_UIEventMission_Enter2-2 = "先生はこれ、ぜんぶわかるの？すごい！すごーい！"
20060-CVGroup_UIEventMission_Buy1-1 = "よくできました、っと。\nえへへ！ハンコのきれいな押し方、教えてもらったの！"
20060-CVGroup_UIEventMission_Buy2-1 = "先生、忙しい？\nイブキも、先生をお手伝いする～！"
20060-CVGroup_UIEventMission_Interaction1-1 = "先生は、宿題を、終わらせ、ました。えへへ。"
20060-CVGroup_UIEventMission_Idle1-1 = "えっへん！イブキはいま、お仕事中なのです！"
20060-CVGroup_UIEventMission_Idle1-2 = "遊ぶのはお仕事が終わってから、だよ！"
20060-CVGroup_UIEventMission_Idle2-1 = "イブキ、一人でできるもん。"
20060-CVGroup_UIEventMission_Idle2-2 = "でも先生と一緒にお仕事するのは、好き！"
