[translation]
20060-CVGroup_UITitle_Idle1-1 = "蔚藍～檔案唷！"
20060-CVGroup_CharacterGet_Idle1-1 = "伊吹也要和大家去海邊！\n老師也一起出航～！"
20060-CVGroup_Cafe_Idle1-1 = "從海裡上來後，把沙子拍掉，再擦乾身體～"
20060-CVGroup_Cafe_Idle2-1 = "如果喝了咖啡，伊吹也能玩得更久嗎？"
20060-CVGroup_Cafe_Idle3-1 = "老師～還沒來嗎～\n耶嘿嘿……"
20060-CVGroup_Cafe_Idle4-1 = "這裡，有賣布丁嗎？"
20060-CVGroup_Cafe_Idle5-1 = "咖啡明明聞起來很香卻非常苦，為什麼呢～？"
20060-CVGroup_WeaponGet_Idle1-1 = "伊吹，會一直一～直珍惜它的！\n一定會！謝謝你，老師！"
20060-CVGroup_UIEventLobby_Enter1-1 = "伊吹，因為是第一次來到海邊……一直超級期待的。"
20060-CVGroup_UIEventLobby_Enter1-2 = "能和老師一起來，伊吹好開心！"
20060-CVGroup_UIEventLobby_Enter2-1 = "伊呂波前輩，看起來好忙。"
20060-CVGroup_UIEventLobby_Enter2-2 = "讓伊吹來幫忙吧！"
20060-CVGroup_UIEventLobby_Enter3-1 = "大家，不要吵架嘛……伊吹討厭吵架……"
20060-CVGroup_UIEventLobby_Enter3-2 = "嗚嗚……是因為伊吹是個壞孩子嗎……？\n是伊吹的錯……？"
20060-CVGroup_UIEventLobby_Enter4-1 = "是的！船長！喲～呵～！"
20060-CVGroup_UIEventLobby_Enter5-1 = "那個那個，伊吹，在海邊玩得真的很開心唷！"
20060-CVGroup_UIEventLobby_Enter5-2 = "所以下次，大家再一起來吧……呼嚕呼嚕……"
20060-CVGroup_UIEventLobby_Idle1-1 = "老師，怎麼了～？"
20060-CVGroup_UIEventLobby_Idle1-2 = "耶嘿嘿，要陪伊吹玩嗎？"
20060-CVGroup_UIEventLobby_Idle2-1 = "千秋前輩他啊，總是幫伊吹拍好～多好多照片！"
20060-CVGroup_UIEventLobby_Idle2-2 = "所以，有伊吹的照片，有這麼多哦！"
20060-CVGroup_UIEventLobby_Idle3-1 = "老師！你看！好厲害！好厲～害！"
20060-CVGroup_UIEventLobby_Idle3-2 = "從這裡，到這裡！全～部都是海唷～！"
20060-CVGroup_UIEventLobby_Idle4-1 = "有會說話的魚兒嗎？"
20060-CVGroup_UIEventLobby_Idle4-2 = "伊吹在電影裡看過！會說「你好～！」哦！"
20060-CVGroup_UIEventMission_Enter1-1 = "歡迎光臨～老師！這裡是由伊吹負責的唷！"
20060-CVGroup_UIEventMission_Enter1-2 = "因為伊吹也是萬～魔～殿～的一員！"
20060-CVGroup_UIEventMission_Enter2-1 = "哇～！看起來好難……！"
20060-CVGroup_UIEventMission_Enter2-2 = "老師，這些你全部都看得懂嗎？\n好厲害！好厲～害！"
20060-CVGroup_UIEventMission_Buy1-1 = "做得很好，蓋章。\n耶嘿嘿！把印章蓋漂亮的方法，伊吹有學過哦！"
20060-CVGroup_UIEventMission_Buy2-1 = "老師，你在忙嗎？\n伊吹也要幫老師的忙～！"
20060-CVGroup_UIEventMission_Interaction1-1 = "老師，把作業，做完了。耶嘿嘿。"
20060-CVGroup_UIEventMission_Idle1-1 = "哼哼！伊吹現在，正在工作！"
20060-CVGroup_UIEventMission_Idle1-2 = "玩樂要等工作結束之後，才可以唷！"
20060-CVGroup_UIEventMission_Idle2-1 = "伊吹一個人也做得到哦。"
20060-CVGroup_UIEventMission_Idle2-2 = "不過伊吹喜歡和老師一起工作！"
