[translation]
20060-CVGroup_UITitle_Idle1-1 = "블루~ 아카이브입니다!"
20060-CVGroup_CharacterGet_Idle1-1 = "이번에는 바다로!\n이부키와 출항이야, 선생님!"
20060-CVGroup_Cafe_Idle1-1 = "들어오기 전에 모래도 털었고…… 물기도 닦았고……. "
20060-CVGroup_Cafe_Idle2-1 = "커피를 마시면, 더 오래 놀 수 있을까?"
20060-CVGroup_Cafe_Idle3-1 = "조금만 기다리면, 선생님도 오겠지?"
20060-CVGroup_Cafe_Idle4-1 = "여기, 푸딩도 팔고 있을까?"
20060-CVGroup_Cafe_Idle5-1 = "커피는 향긋한데, 왜 맛은 씁쓸할까?"
20060-CVGroup_WeaponGet_Idle1-1 = "꼬~옥 껴안고, 정말로 소중하게 보관할게! \n감사합니다, 선생님!"
20060-CVGroup_UIEventLobby_Enter1-1 = "있지,\n이부키 바다는 처음이라\n엄청 기대했는데."
20060-CVGroup_UIEventLobby_Enter1-2 = "선생님이랑 같이 와서\n정말 기뻐!"
20060-CVGroup_UIEventLobby_Enter2-1 = "이로하 선배,\n엄청 바빠 보여."
20060-CVGroup_UIEventLobby_Enter2-2 = "이부키도 도와주고 싶어!"
20060-CVGroup_UIEventLobby_Enter3-1 = "다들 싸우지 마……\n싸우는 거 싫어……."
20060-CVGroup_UIEventLobby_Enter3-2 = "우으으……\n이부키 때문이야?\n이부키가 나쁜 아이라서?"
20060-CVGroup_UIEventLobby_Enter4-1 = "아이 아이! 캡틴! 요호호!"
20060-CVGroup_UIEventLobby_Enter5-1 = "이부키 있지! 있지!\n바다 엄청 즐거웠어!"
20060-CVGroup_UIEventLobby_Enter5-2 = "다음에 또 오면……\n흠냐흠냐……."
20060-CVGroup_UIEventLobby_Idle1-1 = "왜 그래, 선생님?"
20060-CVGroup_UIEventLobby_Idle1-2 = "이부키랑 놀아줄 거야?"
20060-CVGroup_UIEventLobby_Idle2-1 = "있지? 치아키 선배는\n이부키 사진 엄청 많이\n찍어준다?"
20060-CVGroup_UIEventLobby_Idle2-2 = "그래서 이부키는\n사진이 엄청 많아!"
20060-CVGroup_UIEventLobby_Idle3-1 = "선생님!\n저기 끄으으으으읏~"
20060-CVGroup_UIEventLobby_Idle3-2 = "……까지! 바다밖에 없어!"
20060-CVGroup_UIEventLobby_Idle4-1 = "말하는 물고기 씨도\n만날 수 있을까?"
20060-CVGroup_UIEventLobby_Idle4-2 = "이부키 영화에서 봤어!"
20060-CVGroup_UIEventMission_Enter1-1 = "어서와, 선생님!\n여기는 이부키가 담당이야!"
20060-CVGroup_UIEventMission_Enter1-2 = "이부키도 어엿한\n만마전 일원이니까!"
20060-CVGroup_UIEventMission_Enter2-1 = "어려운 게 잔뜩……!"
20060-CVGroup_UIEventMission_Enter2-2 = "선생님은 이거 다 뭔지 알아?"
20060-CVGroup_UIEventMission_Buy1-1 = "참 잘했습니다! 에헤헤!\n이렇게 도장 찍어주는 거야!\n배웠다?"
20060-CVGroup_UIEventMission_Buy2-1 = "선생님, 바빠?\n이부키도 선생님 일 도와줄래!"
20060-CVGroup_UIEventMission_Interaction1-1 = "선생님은, 숙제를, 열심히,\n잘했습니다. 에헤헤."
20060-CVGroup_UIEventMission_Idle1-1 = "에헴! 지금 이부키는\n일하는 중이야!"
20060-CVGroup_UIEventMission_Idle1-2 = "노는 건 일 끝나고 나서입니다!"
20060-CVGroup_UIEventMission_Idle2-1 = "이부키 혼자서도 할 수 있는데."
20060-CVGroup_UIEventMission_Idle2-2 = "그래도 선생님이랑\n같이 일하는 건 좋아!"
