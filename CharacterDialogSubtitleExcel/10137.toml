[translation]
10137-CVGroup_UITitle_Idle1-1 = "Bluuue Archiive!"
10137-CVGroup_CharacterGet_Idle1-1 = "Hello there, I'm Shima Konoka, from Valkyrie Police School's Public Peace Bureau. Would you like to read the day's horoscope together?"
10137-CVGroup_Cafe_Idle1-1 = "There are loooots of people hereee."
10137-CVGroup_Cafe_Idle2-1 = "(Now, let's see if there's a criminal... Eh, I guess there's none here.)"
10137-CVGroup_Cafe_Idle3-1 = "Eh? Where did I...put my badge...?"
10137-CVGroup_Cafe_Idle4-1 = "How peaceful. Ugh... Boring."
10137-CVGroup_Cafe_Idle5-1 = "Is this...legally acceptable?"
10137-CVGroup_WeaponGet_Idle1-1 = "Ah, this is it! I don't need to talk a lot when I have this!"
10137-CVGroup_UIEventLobby_Enter1-1 = "Tsuchinoookooo! Where aaare you?!"
10137-CVGroup_UIEventLobby_Enter1-2 = "*sigh* If I catch you, you'll be dead for real... W-Wait! Where are you?!"
10137-CVGroup_UIEventLobby_Enter2-1 = "Ugh... This is scary..."
10137-CVGroup_UIEventLobby_Enter3-1 = "I-It's not like someone's going to harass— Eek?! Wh-Who's there...?"
10137-CVGroup_UIEventLobby_Enter4-1 = "Whether you're a ghost or not, getting you in handcuffs oughtta...!"
10137-CVGroup_UIEventLobby_Enter5-1 = "I made it through safely! Bring it on, fate!! HAHAHA!!!"
10137-CVGroup_UIEventLobby_Enter5-2 = "W-Wait!! I-I take it back! I'm sorry!"
10137-CVGroup_UIEventLobby_Idle1-1 = "E-Eek?! ...Geez, you scared me!!"
10137-CVGroup_UIEventLobby_Idle2-1 = "Phew... But still, the air is really nice here."
10137-CVGroup_UIEventLobby_Idle3-1 = "Tsuchinoko! If I ever catch you, I'm never letting you go!"
10137-CVGroup_UIEventLobby_Idle4-1 = "S-Stay calm... Stay calm..."
10137-CVGroup_UIEventBoxGachaShop_Enter1-1 = "Let's go!! Let's do this with spirit!!"
10137-CVGroup_UIEventBoxGachaShop_Enter2-1 = "Was your horoscope good today?! I'm counting on you, Sensei!"
10137-CVGroup_UIEventBoxGachaShop_Enter3-1 = "Cleanup time! Let's do our best until the end!"
10137-CVGroup_UIEventBoxGachaShop_Idle1-1 = "You're going to share your luck with me? Yes!!"
10137-CVGroup_UIEventBoxGachaShop_Idle2-1 = "I'm sure it'll work out somehow! Since you're with me, Sensei!"
10137-CVGroup_UIEventBoxGachaShop_BoxGachaPrize1-1 = "Yeah! This is it!"
10137-CVGroup_UIEventBoxGachaShop_BoxGachaPrize2-1 = "Your luck is incredible!! Sensei, you're no joke!"
10137-CVGroup_UIEventBoxGachaShop_BoxGachaPrize3-1 = "I wish it could be like this all the time!"
10137-CVGroup_UIEventBoxGachaShop_BoxGachaFinish1-1 = "For now, let's search until we can't search anymore!"
