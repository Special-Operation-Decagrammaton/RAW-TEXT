[translation]
10137-CVGroup_UITitle_Idle1-1 = "蔚藍～檔案～"
10137-CVGroup_CharacterGet_Idle1-1 = "啊～辛苦了～我是女武神警察學園\n公安局的志真木乃香。\n要一起看今天的占卜嗎？"
10137-CVGroup_Cafe_Idle1-1 = "好多人啊～"
10137-CVGroup_Cafe_Idle2-1 = "（犯罪者……嗯，這裡不會有吧）"
10137-CVGroup_Cafe_Idle3-1 = "咦？ 我的徽章……放去哪了……"
10137-CVGroup_Cafe_Idle4-1 = "真和平啊～唉……好無聊。"
10137-CVGroup_Cafe_Idle5-1 = "這個，法律上沒問題嗎？"
10137-CVGroup_WeaponGet_Idle1-1 = "啊，就是這個！有了這個就簡單多了！"
10137-CVGroup_UIEventLobby_Enter1-1 = "槌之子～！ 在哪～裡～！"
10137-CVGroup_UIEventLobby_Enter1-2 = "被我抓到你就死定了…… 不，不對！ 給我出來～！"
10137-CVGroup_UIEventLobby_Enter2-1 = "嗚嗚……好可怕……"
10137-CVGroup_UIEventLobby_Enter3-1 = "為什麼要做這種──咦？！ 是，是誰……？"
10137-CVGroup_UIEventLobby_Enter4-1 = "不管是鬼還是什麼，只要銬上手銬的話……！"
10137-CVGroup_UIEventLobby_Enter5-1 = "順利結束了呢！ 命運什麼的，看我輕鬆顛覆！！ 哈哈哈！！"
10137-CVGroup_UIEventLobby_Enter5-2 = "不，不是！！ 剛才的不算！！ 並不輕鬆！！對不起！！"
10137-CVGroup_UIEventLobby_Idle1-1 = "嘻，嘻呀？！ ……嚇死我了！！"
10137-CVGroup_UIEventLobby_Idle2-1 = "呼…… 這裡只有空氣是新鮮的呢。"
10137-CVGroup_UIEventLobby_Idle3-1 = "槌之子～！被我抓到就絕對不會再讓你逃走了！"
10137-CVGroup_UIEventLobby_Idle4-1 = "平常心…… 平常心……"
10137-CVGroup_UIEventBoxGachaShop_Enter1-1 = "來吧！！我們一路向前衝！！"
10137-CVGroup_UIEventBoxGachaShop_Enter2-1 = "今天的占卜結果怎麼樣？我就指望老師的運勢了哦！"
10137-CVGroup_UIEventBoxGachaShop_Enter3-1 = "收尾時間！ 要努力堅持到最後哦！"
10137-CVGroup_UIEventBoxGachaShop_Idle1-1 = "要把運氣分給我嗎？ 太棒了！！"
10137-CVGroup_UIEventBoxGachaShop_Idle2-1 = "畢竟是和老師一起，一定沒問題的！"
10137-CVGroup_UIEventBoxGachaShop_BoxGachaPrize1-1 = "嗯──！ 就是這個！"
10137-CVGroup_UIEventBoxGachaShop_BoxGachaPrize2-1 = "運氣超好的耶！？不愧是老師，超扯的！"
10137-CVGroup_UIEventBoxGachaShop_BoxGachaPrize3-1 = "要是每天都這樣就好了～"
10137-CVGroup_UIEventBoxGachaShop_BoxGachaFinish1-1 = "總之先調查到最後看看吧！"
