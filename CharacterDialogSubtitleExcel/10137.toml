[translation]
10137-CVGroup_UITitle_Idle1-1 = "蔚藍～檔案～"
10137-CVGroup_CharacterGet_Idle1-1 = "啊～你好你好～\n我是女武神警察學園公安局的志真木乃香。\n要一起看今天的占卜嗎？"
10137-CVGroup_Cafe_Idle1-1 = "人～還真多啊～"
10137-CVGroup_Cafe_Idle2-1 = "（那麼，犯罪者在……算了，這裡不會有吧）"
10137-CVGroup_Cafe_Idle3-1 = "咦？我的徽章……放到哪裡去了……"
10137-CVGroup_Cafe_Idle4-1 = "真和平啊～唉……好無聊。"
10137-CVGroup_Cafe_Idle5-1 = "這個是合法的嗎？"
10137-CVGroup_WeaponGet_Idle1-1 = "啊，我正想要這個呢！\n有了這個的話，事情就能輕易搞定了！"
10137-CVGroup_UIEventLobby_Enter1-1 = "槌之子啊～！你在哪裡～！？"
10137-CVGroup_UIEventLobby_Enter1-2 = "被我抓到可不會輕易放過……不，不對！快出來～！"
10137-CVGroup_UIEventLobby_Enter2-1 = "嗚嗚……好可怕……"
10137-CVGroup_UIEventLobby_Enter3-1 = "為什麼要做這種討人厭的──噫！？\n是，是誰……？"
10137-CVGroup_UIEventLobby_Enter4-1 = "不管是鬼還是什麼，只要銬上手銬的話……！"
10137-CVGroup_UIEventLobby_Enter5-1 = "順利結束了呢！命運什麼的輕鬆搞定！！\n哈哈哈──"
10137-CVGroup_UIEventLobby_Enter5-2 = "不，不是！！剛才的不算！！並不輕鬆！！對不起！！"
10137-CVGroup_UIEventLobby_Idle1-1 = "噫，噫呀！？\n……嚇死我了！"
10137-CVGroup_UIEventLobby_Idle2-1 = "呼……這裡只有空氣是新鮮的呢。"
10137-CVGroup_UIEventLobby_Idle3-1 = "槌之子～！被我抓到就絕對不會再讓你逃走了！"
10137-CVGroup_UIEventLobby_Idle4-1 = "平常心…… 平常心……"
10137-CVGroup_UIEventBoxGachaShop_Enter1-1 = "來！一路向前衝吧！！"
10137-CVGroup_UIEventBoxGachaShop_Enter2-1 = "今天的占卜結果怎麼樣？我就指望老師的運勢了哦！"
10137-CVGroup_UIEventBoxGachaShop_Enter3-1 = "收尾時間！要努力堅持到最後哦！"
10137-CVGroup_UIEventBoxGachaShop_Idle1-1 = "要把運氣分給我嗎？\n好耶！！"
10137-CVGroup_UIEventBoxGachaShop_Idle2-1 = "畢竟是和老師一起，肯定有辦法的！"
10137-CVGroup_UIEventBoxGachaShop_BoxGachaPrize1-1 = "嗯──！就是這個！"
10137-CVGroup_UIEventBoxGachaShop_BoxGachaPrize2-1 = "運氣超好的耶！？\n老師，你真厲害！"
10137-CVGroup_UIEventBoxGachaShop_BoxGachaPrize3-1 = "要是每天都這樣就好了～"
10137-CVGroup_UIEventBoxGachaShop_BoxGachaFinish1-1 = "總之先調查到最後看看吧！"
