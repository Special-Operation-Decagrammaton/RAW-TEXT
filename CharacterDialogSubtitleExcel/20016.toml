[translation]
20016-CVGroup_UIEventMiniGameMission_Enter1-1 = "やることが山積みですね。\n二つ以上もあるじゃないですか。"
20016-CVGroup_UIEventMiniGameMission_Enter1-2 = "山積みですよ。"
20016-CVGroup_UIEventMiniGameMission_Enter2-1 = "……いつもの仕事よりは幾分まとも、ですね。ふふ。"
20016-CVGroup_UIEventMiniGameMission_Idle1-1 = "う、髪が乱れます。"
20016-CVGroup_UIEventMiniGameMission_Idle1-2 = "雑だと言われたことはありませんか？"
20016-CVGroup_UIEventMiniGameMission_Idle2-1 = "はあ、帽子には触らないでください。被り直すの、大変なんですよ。"
20016-CVGroup_UIEventMiniGameMission_Buy1-1 = "報酬に興味はありませんが、別にいらないわけではありません。"
20016-CVGroup_UIEventMiniGameMission_Buy2-1 = "報酬もあるとは……いいですね。"
20016-CVGroup_UIEventMiniGameMission_Interaction1-1 = "ふぅ、終わりましたね。お疲れ様でした、先生。"
