[translation]
10152-CVGroup_UITitle_Idle1-1 = "블루 아카이브, 앤 피스."
10152-CVGroup_CharacterGet_Idle1-1 = "와일드헌트 예술학원, 오컬트 연구회의\n 시이나 츠무기예요. 네, 기타는 가지고 있어요.\n '러브 앤 피스'.……는 중요하니까요."
10152-CVGroup_Cafe_Idle1-1 = "후후, 다음엔 여기서\n라이브를 해볼까요?"
10152-CVGroup_Cafe_Idle2-1 = "저 장식…… 타악기로\n쓸 수 있겠네요."
10152-CVGroup_Cafe_Idle3-1 = "과자의 집을 만든다면\n이쪽이 좋겠네요."
10152-CVGroup_Cafe_Idle4-1 = "이곳과 어울리는\n배경음악은…… 일단\n데스메탈?"
10152-CVGroup_Cafe_Idle5-1 = "많은 분의 추억이\n깃든 장소네요.\n물론, 저의 추억도."
10152-CVGroup_WeaponGet_Idle1-1 = "감사합니다, 선생님.이 아이가 있으면,\n어디서든 연주회를 열 수 있을 것 같아요.\n평화로 이끄는…… 연옥의 선율을."
10152-CVGroup_UIEventLobby_Enter1-1 = "어서 오세요,\n꿈과 희망의 원더랜드에."
10152-CVGroup_UIEventLobby_Enter2-1 = "후후, 선생님을\n안내할 수 있어서\n기쁘네요."
10152-CVGroup_UIEventLobby_Enter3-1 = "모두의 노력에,\n결실이 있기를."
10152-CVGroup_UIEventLobby_Enter4-1 = "슬슬……\n엔딩의 시간이네요."
10152-CVGroup_UIEventLobby_Enter4-2 = "마지막 향연도\n준비되었어요."
10152-CVGroup_UIEventLobby_Enter5-1 = "선생님의 영혼에 남는\n선율이었다면, 좋겠네요."
10152-CVGroup_UIEventLobby_Idle1-1 = "선생님도\n콥스 페인팅해 보실래요?"
10152-CVGroup_UIEventLobby_Idle1-2 = "저에게 맡겨주세요.\n멋지게 완성해 드릴게요."
10152-CVGroup_UIEventLobby_Idle2-1 = "역시 바니걸로\n안내하는 게 좋았을까요?"
10152-CVGroup_UIEventLobby_Idle3-1 = "제 기타는 평화를\n노래하고 있어요."
10152-CVGroup_UIEventLobby_Idle3-2 = "……네. 거짓말이\n아니랍니다."
10152-CVGroup_UIEventLobby_Idle4-1 = "후후. 세션으로 닿는\n영혼의 공명도 멋지지만…"
10152-CVGroup_UIEventLobby_Idle4-2 = "손끝의 교감도,\n소중히 해나가고 싶네요."
