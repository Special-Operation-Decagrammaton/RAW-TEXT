[translation]
10152-CVGroup_UITitle_Idle1-1 = "ブルーアーカイブ、アンド・ピース。"
10152-CVGroup_CharacterGet_Idle1-1 = "ワイルドハント芸術学院、オカルト研究会の椎名ツムギです。\nええ、ギターは持っていますよ――「ラブ・アンド・ピース」。\n……は大事ですから。"
10152-CVGroup_Cafe_Idle1-1 = "ふふっ、ここでライブをしてみたいですね。"
10152-CVGroup_Cafe_Idle2-1 = "あの飾り……打楽器に使えそうですね。"
10152-CVGroup_Cafe_Idle3-1 = "この辺りなら「お菓子の家」を作れそうです。"
10152-CVGroup_Cafe_Idle4-1 = "ＢＧＭを流すなら……デスメタルがぴったりですね"
10152-CVGroup_Cafe_Idle5-1 = "ここは、みなさんの思い出が宿る場所……\n私にとっても、そうかもしれません。"
10152-CVGroup_WeaponGet_Idle1-1 = "ありがとうございます、先生。\nこの子がいれば、どこでも演奏会が開けそうです。\n平和へと導く――煉獄の旋律を。"
10152-CVGroup_UIEventLobby_Enter1-1 = "ようこそ。夢と希望のワンダーランドへ。"
10152-CVGroup_UIEventLobby_Enter2-1 = "ふふっ、先生を導くことができて光栄です。"
10152-CVGroup_UIEventLobby_Enter3-1 = "みなさんの努力が、実を結びますように。"
10152-CVGroup_UIEventLobby_Enter4-1 = "そろそろ……エンディングのお時間ですね。"
10152-CVGroup_UIEventLobby_Enter4-2 = "饗宴の準備はできています。"
10152-CVGroup_UIEventLobby_Enter5-1 = "先生の魂に残る調べであったのなら、幸いです。"
10152-CVGroup_UIEventLobby_Idle1-1 = "先生もコープス・ペイントをしてみませんか？"
10152-CVGroup_UIEventLobby_Idle1-2 = "私にお任せください。素敵に仕上げて見せますよ？"
10152-CVGroup_UIEventLobby_Idle2-1 = "……やはり、バニーガールの格好で\nお迎えすべきでしたでしょうか？"
10152-CVGroup_UIEventLobby_Idle3-1 = "私のギターは、平和を歌っています。"
10152-CVGroup_UIEventLobby_Idle3-2 = "……ええ、嘘はついてませんとも。"
10152-CVGroup_UIEventLobby_Idle4-1 = "ふふっ。セッションで触れる魂の共鳴も素敵ですが……"
10152-CVGroup_UIEventLobby_Idle4-2 = "指先のふれあいも、大切にしていきたいですね。"
