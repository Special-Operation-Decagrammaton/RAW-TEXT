[translation]
10150-CVGroup_UITitle_Idle1-1 = "ブルーアーカイブ～"
10150-CVGroup_CharacterGet_Idle1-1 = "オデュッセイア海洋高等学校ダイビング部副部長、淵上コトネ。\nえっと……シャーレの先生、で合ってる？\n目が悪いから、あまり見えなくて。"
10150-CVGroup_Cafe_Idle1-1 = "（なんか、変なものがいるような……\n……また、視力落ちたかな）"
10150-CVGroup_Cafe_Idle2-1 = "これ、陸で流行ってるの……？"
10150-CVGroup_Cafe_Idle3-1 = "いい天気……\n午後はマリンスーツを干さないと。"
10150-CVGroup_Cafe_Idle4-1 = "この作家さんの新刊……出てたんだ。"
10150-CVGroup_Cafe_Idle5-1 = "（ゆっくり座れるところ……どこかにあるかな）"
10150-CVGroup_WeaponGet_Idle1-1 = "ダーツはあまり得意じゃないけど……\nこれを使ったら、水中でもブルズアイを狙えそう。\nありがとう、先生。"
10150-CVGroup_UIEventLobby_Enter1-1 = "オデュッセイア海洋高等学校――"
10150-CVGroup_UIEventLobby_Enter1-2 = "違うな……。"
10150-CVGroup_UIEventLobby_Enter1-3 = "ダイビング部へようこそ、先生。"
10150-CVGroup_UIEventLobby_Enter2-1 = "待ってたよ、先生。"
10150-CVGroup_UIEventLobby_Enter2-2 = "ここは私が案内するね。"
10150-CVGroup_UIEventLobby_Enter3-1 = "はぁ……あの子たちが何かやらかしたみたい。"
10150-CVGroup_UIEventLobby_Enter4-1 = "（12海里……）"
10150-CVGroup_UIEventLobby_Enter4-2 = "（ちょうどトライデントの巡回範囲から外れる場所……）"
10150-CVGroup_UIEventLobby_Enter4-3 = "（……怪しいかも）"
10150-CVGroup_UIEventLobby_Enter5-1 = "フジツボ掃除は大変だけど……。"
10150-CVGroup_UIEventLobby_Enter5-2 = "仕方ないね。"
10150-CVGroup_UIEventLobby_Enter5-3 = "私たちにしかできないことだし……。"
10150-CVGroup_UIEventLobby_Enter5-4 = "こういうことから、コツコツと、ね。"
10150-CVGroup_UIEventLobby_Idle1-1 = "先生……ちょっとジロジロ見すぎかも。"
10150-CVGroup_UIEventLobby_Idle1-2 = "私でも気づくくらい。"
10150-CVGroup_UIEventLobby_Idle2-1 = "アイス？嫌いじゃないけど……。"
10150-CVGroup_UIEventLobby_Idle2-2 = "……カロリー、ちょっと高いから。"
10150-CVGroup_UIEventLobby_Idle2-3 = "一応、気にしてるの。"
10150-CVGroup_UIEventLobby_Idle3-1 = "先生、いい声って言われない？"
10150-CVGroup_UIEventLobby_Idle3-2 = "……先生の声で『海底二万里』の朗読、聞いてみたいな。"
10150-CVGroup_UIEventLobby_Idle4-1 = "ダイビング部はみんな2年生だよ……。"
10150-CVGroup_UIEventLobby_Idle4-2 = "それがどうかしたの？"
10150-CVGroup_UIEventLobby_Idle4-3 = "もしかして……私、3年生に見えた？"
10150-CVGroup_UIEventShop_Enter1-1 = "寄付はいつでも大歓迎。"
10150-CVGroup_UIEventShop_Enter1-2 = "ダイビング用品だと……嬉しいかも。"
10150-CVGroup_UIEventShop_Enter2-1 = "海の中で拾ったものと交換する？"
10150-CVGroup_UIEventShop_Enter3-1 = "もう片づけちゃうから、"
10150-CVGroup_UIEventShop_Enter3-2 = "交換したいものがあるなら今のうちにね。"
10150-CVGroup_UIEventShop_Idle1-1 = "今月は部費を少し節約できそう。先生のおかげ。"
10150-CVGroup_UIEventShop_Idle2-1 = "海の掃除をしてると、たまに珍しいものを見つけるんだ。"
10150-CVGroup_UIEventShop_Idle2-2 = "数少ない楽しみ、かも。"
10150-CVGroup_UIEventShop_Buy1-1 = "これは……まだ使えそうだね。"
10150-CVGroup_UIEventShop_Buy2-1 = "手伝ってくれてありがとう、先生。"
10150-CVGroup_UIEventShop_Buy3-1 = "それにするんだ？いいんじゃないかな。"
10150-CVGroup_UIEventShop_Buy4-1 = "え……それ本当に必要なの？"
