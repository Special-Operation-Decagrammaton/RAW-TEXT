[translation]
10150-CVGroup_UITitle_Idle1-1 = "블루 아카이브~"
10150-CVGroup_CharacterGet_Idle1-1 = "오디세이아 해양학원 다이빙부의 부부장, 후치가미 코토네야.\n샬레의 선생님…… 맞지?\n내 눈이 조금 나빠서."
10150-CVGroup_Cafe_Idle1-1 = "(뭔가 이상한 게 보이네……\n눈이 더 나빠졌나?)"
10150-CVGroup_Cafe_Idle2-1 = "요즘 육지에서는 이런 게 유행하는구나……"
10150-CVGroup_Cafe_Idle3-1 = "날씨가 좋네.\n오후에는 슈트를 꺼내 말려야겠어."
10150-CVGroup_Cafe_Idle4-1 = "아, 이 작가의 신간…… 나왔었구나!"
10150-CVGroup_Cafe_Idle5-1 = "(내가 앉을 수 있을만한 곳이…… 어디 없으려나?)"
10150-CVGroup_WeaponGet_Idle1-1 = "다트에 재능이 있는 편은 아니지만……\n이걸 사용하면 물 속에서도 확실하게 불스아이를 노릴 수 있지.\n고마워, 선생님."
10150-CVGroup_UIEventLobby_Enter1-1 = "오디세이아 학원에—"
10150-CVGroup_UIEventLobby_Enter1-2 = "아니,"
10150-CVGroup_UIEventLobby_Enter1-3 = "다이빙부에 어서 와.\n선생님."
10150-CVGroup_UIEventLobby_Enter2-1 = "기다리고 있었어,\n선생님."
10150-CVGroup_UIEventLobby_Enter2-2 = "자, 이 근처는\n내가 안내해줄게."
10150-CVGroup_UIEventLobby_Enter3-1 = "……아무래도\n우리 부원들이\n뭔가 실수를\n저지른 모양이네."
10150-CVGroup_UIEventLobby_Enter4-1 = "(12 해리면)"
10150-CVGroup_UIEventLobby_Enter4-2 = "(정확히 트라이던트의\n순찰 구역을 벗어나는\n지점인데……)"
10150-CVGroup_UIEventLobby_Enter4-3 = "(……뭔가 수상해.)"
10150-CVGroup_UIEventLobby_Enter5-1 = "따개비 청소는\n고되긴 하지만……"
10150-CVGroup_UIEventLobby_Enter5-2 = "그래도 어쩔 수 없지."
10150-CVGroup_UIEventLobby_Enter5-3 = "우리만 할 수 있는\n일이기도 하고……"
10150-CVGroup_UIEventLobby_Enter5-4 = "이런 것부터 차근차근,\n해나가야지."
10150-CVGroup_UIEventLobby_Idle1-1 = "선생님……\n어쩐지 조금\n시선이 노골적인데."
10150-CVGroup_UIEventLobby_Idle1-2 = "안경 없이도\n느껴질 정도로."
10150-CVGroup_UIEventLobby_Idle2-1 = "……아이스크림?\n싫어하진 않지만……"
10150-CVGroup_UIEventLobby_Idle2-2 = "……칼로리가 높아서\n최근에는 조금"
10150-CVGroup_UIEventLobby_Idle2-3 = "신경이 쓰이더라고."
10150-CVGroup_UIEventLobby_Idle3-1 = "선생님.\n목소리 좋다는 이야기\n들은 적 없어?"
10150-CVGroup_UIEventLobby_Idle3-2 = "뭔가 선생님이 읽어주는\n<해저 2만리>를\n한 번 들어보고 싶네."
10150-CVGroup_UIEventLobby_Idle4-1 = "응.\n다이빙부 부원들은 모두\n2학년 동급생이야."
10150-CVGroup_UIEventLobby_Idle4-2 = "갑자기 왜?"
10150-CVGroup_UIEventLobby_Idle4-3 = "혹시……\n내가 나이들어 보인다는\n이야기는 아니겠지?"
10150-CVGroup_UIEventShop_Enter1-1 = "다이빙과 관련된\n물품 기부는"
10150-CVGroup_UIEventShop_Enter1-2 = "언제나 환영이야."
10150-CVGroup_UIEventShop_Enter2-1 = "수면 아래에서\n주워 온 것과 교환할래?"
10150-CVGroup_UIEventShop_Enter3-1 = "이제 곧 정리할 예정이니까."
10150-CVGroup_UIEventShop_Enter3-2 = "교환하고 싶은 물건이 있다면\n지금 보여줘."
10150-CVGroup_UIEventShop_Idle1-1 = "선생님 덕분에\n이번 달은 부비를\n조금은 아낄 수 있겠어."
10150-CVGroup_UIEventShop_Idle2-1 = "해양 쓰레기를 청소하다 보면\n가끔 진귀한 물건을\n찾을 때가 있어."
10150-CVGroup_UIEventShop_Idle2-2 = "미화 활동 중의 몇 안 되는\n즐거움 중 하나랄까."
10150-CVGroup_UIEventShop_Buy1-1 = "이건……\n아직 쓸 수 있겠어."
10150-CVGroup_UIEventShop_Buy2-1 = "도와줘서 고마워,\n선생님."
10150-CVGroup_UIEventShop_Buy3-1 = "그걸 택하려고?\n좋은 선택이라고 생각해."
10150-CVGroup_UIEventShop_Buy4-1 = "어……\n정말로 그게 필요한 거야?"
