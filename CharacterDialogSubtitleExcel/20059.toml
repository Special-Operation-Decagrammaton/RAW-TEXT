[translation]
20059-CVGroup_UITitle_Idle1-1 = "Blue Archive! ฮุฮุฮุ!"
20059-CVGroup_CharacterGet_Idle1-1 = "ฮุฮุฮุ มุสึกิจังแปลงโฉม~ ครั้งใหญ่!\nเอาละ ต้องการอะไรเหรอ? บอกมาได้ทุกอย่างเลย!"
20059-CVGroup_Cafe_Idle1-1 = "อยากมาจัดปาร์ตี้ชุดเดรสกับทุกคนที่นี่จังเลย~"
20059-CVGroup_Cafe_Idle2-1 = "ฮุฮุฮุ นี่คือรสนิยมของคุณครูใช่มั้ย?"
20059-CVGroup_Cafe_Idle3-1 = "จะมีใครมาเล่นด้วยบ้างมั้ยน้า~?"
20059-CVGroup_Cafe_Idle4-1 = "เอ๋ ถ้าลองลูบเบาๆ ก็น่าจะสนุกนะ♪"
20059-CVGroup_Cafe_Idle5-1 = "สนุกจริงๆ ด้วย! ถึงจะไม่รู้เหตุผลก็เถอะ!"
20059-CVGroup_WeaponGet_Idle1-1 = "อื้อ♪ กำลังรออยู่เลย!\nเค้าชอบการสัมผัสแบบนี้น่ะ!"
20059-CVGroup_UIEventLobby_Enter1-1 = "เอาละ จะมีเรื่องอะไรรอพวกเราอยู่บ้างนะ?"
20059-CVGroup_UIEventLobby_Enter2-1 = "งานครั้งนี้ก็ต้องสนุกมากแน่ๆ! ว่ามั้ย?"
20059-CVGroup_UIEventLobby_Idle1-1 = "เล่นสนุกให้เหมือนปฏิบัติจริง!\nปฏิบัติจริงให้เหมือนเล่นสนุก♪"
20059-CVGroup_UIEventLobby_Idle2-1 = "หืม~? เส้นทางการแฝงตัวคือทางโน้นหรือเปล่านะ?"
20059-CVGroup_UIEventLobby_Idle3-1 = "ทำไม? อยากเล่นกับมุสึกิจังเหรอ? ฮุฮุฮุ"
20059-CVGroup_UIEventLobby_Idle4-1 = "ไว้จบงานนี้แล้วไปดูโอเปร่าด้วยกันนะ!\nต้องสนุกแน่นอน♪"
