[translation]
10154-CVGroup_UITitle_Idle1-1 = "ブルーアーカイブ。"
10154-CVGroup_CharacterGet_Idle1-1 = "ワイルドハント芸術学院、芸術評議会会長の雲類鷲マナミと申します。\n「コレクション」――それは時空を越える芸術。\nこの瞬間が、記念すべき作品となりますよう。"
10154-CVGroup_Cafe_Idle1-1 = "先生も……高尚な趣味をお持ちなんですね。"
10154-CVGroup_Cafe_Idle2-1 = "こういった雰囲気も悪くありません。"
10154-CVGroup_Cafe_Idle3-1 = "……なるほど。これも芸術ということにしておきましょう。"
10154-CVGroup_Cafe_Idle4-1 = "ここが先生の博物館、なのですね。"
10154-CVGroup_Cafe_Idle5-1 = "そうですね……コメントは控えておきます。"
10154-CVGroup_WeaponGet_Idle1-1 = "私の敵はワイルドハントの敵。\n愚か者には、わが学院の流儀を身をもって味わっていただきます。"
10154-CVGroup_UIEventLobby_Enter1-1 = "芸術評議会へようこそ、先生。"
10154-CVGroup_UIEventLobby_Enter2-1 = "ワイルドハントの真髄を、どうぞ心ゆくまでご堪能ください。"
10154-CVGroup_UIEventLobby_Enter3-1 = "解決の糸口が見つかってきましたね。"
10154-CVGroup_UIEventLobby_Enter4-1 = "七囚人……本当に面倒な存在です。"
10154-CVGroup_UIEventLobby_Enter5-1 = "これでひとまず一件落着でしょうか。"
10154-CVGroup_UIEventLobby_Enter5-2 = "ワイルドハントの生徒を代表して、感謝申し上げます。"
10154-CVGroup_UIEventLobby_Idle1-1 = "寮監隊に、先生に対しては特例を認めるよう指示しました。"
10154-CVGroup_UIEventLobby_Idle1-2 = "……恩を仇で返すような真似は、されませんよね？"
10154-CVGroup_UIEventLobby_Idle2-1 = "評議会長として立っていると、面白いことにも遭遇するのです。"
10154-CVGroup_UIEventLobby_Idle2-2 = "ふふっ、権力とは不思議なものですね。"
10154-CVGroup_UIEventLobby_Idle3-1 = "あら……先生は、私に対して物怖じしないのですね。"
10154-CVGroup_UIEventLobby_Idle3-2 = "ふふっ、そういう距離感も悪くないです。"
10154-CVGroup_UIEventLobby_Idle4-1 = "親交を深めたいのでしたら、また後ほど。"
10154-CVGroup_UIEventLobby_Idle4-2 = "公私の区別は必要ですから。"
10154-CVGroup_UIEventTreasure_Enter1-1 = "さて、先生の芸術を教えてください。"
10154-CVGroup_UIEventTreasure_Enter2-1 = "先生の審美眼、楽しみにしています。"
10154-CVGroup_UIEventTreasure_Enter3-1 = "有意義な時間でしたね。"
10154-CVGroup_UIEventTreasure_Enter4-1 = "芸術は永遠なり。"
10154-CVGroup_UIEventTreasure_Enter4-2 = "次回もよろしければ、ご一緒してください。"
10154-CVGroup_UIEventTreasure_Idle1-1 = "芸術はいつでも私たちのそばにあるのです。"
10154-CVGroup_UIEventTreasure_Idle1-2 = "先生がお召しになっている服も、芸術の産物です。"
10154-CVGroup_UIEventTreasure_Idle1-3 = "服以外のものも、全てがそうといえるでしょう。"
10154-CVGroup_UIEventTreasure_Idle1-4 = "ですので、物は大切になさってくださいね。"
10154-CVGroup_UIEventTreasure_Idle2-1 = "先生が話の通じる方で安心しました。"
10154-CVGroup_UIEventTreasure_Idle2-2 = "特に、芸術に関しての見解が一致したことは大きいです。"
10154-CVGroup_UIEventTreasure_Idle2-3 = "我が学院では、一番の争点になりますので。"
10154-CVGroup_UIEventTreasure_FindTreasure1-1 = "なるほど……そこが鑑賞のポイントなんですね。"
10154-CVGroup_UIEventTreasure_FindTreasure2-1 = "芸術とは、隅々まで鑑賞してこそ。"
10154-CVGroup_UIEventTreasure_GetTreasure1-1 = "素敵な作品ですね。\nよく見える場所に飾るとしましょう。"
10154-CVGroup_UIEventTreasure_GetTreasure2-1 = "これが先生の芸術……\n実に興味深いです。"
10154-CVGroup_UIEventTreasure_RoundRenewal1-1 = "さて、次はどんな作品が待っているのでしょうか。"
10154-CVGroup_UIEventMission_Enter1-1 = "先生にお願いしたい内容はこちらです。ご確認ください。"
10154-CVGroup_UIEventMission_Enter2-1 = "こちらが業務リストです。芸術的ですね。"
10154-CVGroup_UIEventMission_Idle1-1 = "どうかなさいましたか？"
10154-CVGroup_UIEventMission_Idle2-1 = "退屈させてしまったようですね。\n私で遊んでいる暇があるようで。"
10154-CVGroup_UIEventMission_Buy1-1 = "おや、噂に違わぬ解決能力ですね。"
10154-CVGroup_UIEventMission_Buy2-1 = "ふふっ、私の目に狂いはありませんでしたね。"
10154-CVGroup_UIEventMission_Interaction1-1 = "お疲れ様でした。どうぞこちらの記念品をお持ちください。"
