[translation]
10141-CVGroup_UITitle_Idle1-1 = "蔚藍……檔……案。"
10141-CVGroup_CharacterGet_Idle1-1 = "這，這身打扮可能不太得體……\n不，不過還請多多指教……"
10141-CVGroup_Cafe_Idle1-1 = "（這身打扮……不會被覺得太得意忘形吧……？）"
10141-CVGroup_Cafe_Idle2-1 = "我看看，最不起眼的地方在……"
10141-CVGroup_Cafe_Idle3-1 = "咖啡，好香的味道……耶嘿嘿。"
10141-CVGroup_Cafe_Idle4-1 = "應該不會一路追到這裡……來吧？"
10141-CVGroup_Cafe_Idle5-1 = "當作伴手禮的話……一，一定會很開心吧？"
10141-CVGroup_WeaponGet_Idle1-1 = "我這種人哪有資格收下這個……\n沒，沒事……這是老師決定的事。\n謝謝您！"
10141-CVGroup_UIEventLobby_Enter1-1 = "隨，隨時都可以出發！"
10141-CVGroup_UIEventLobby_Enter1-2 = "不，不管是什麼都請儘管吩咐……！"
10141-CVGroup_UIEventLobby_Enter2-1 = "非，非常謝謝您……！"
10141-CVGroup_UIEventLobby_Enter2-2 = "咦，啊，那個……是針對您願意前來這件事。"
10141-CVGroup_UIEventLobby_Idle1-1 = "對不起！對不起！是，是我的錯，對吧……？"
10141-CVGroup_UIEventLobby_Idle2-1 = "炸彈……彈藥……有需要的東西請儘管說……！"
10141-CVGroup_UIEventLobby_Idle3-1 = "總覺得演變成一場大騷動了呢……"
10141-CVGroup_UIEventLobby_Idle3-2 = "覺得這樣很有趣，會……很奇怪嗎？"
10141-CVGroup_UIEventLobby_Idle4-1 = "話說回來……歌劇……"
10141-CVGroup_UIEventLobby_Idle4-2 = "是什麼樣的內容呢？"
