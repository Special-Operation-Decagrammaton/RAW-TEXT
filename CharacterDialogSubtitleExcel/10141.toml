[translation]
10141-CVGroup_UITitle_Idle1-1 = "Blue... Ar... chive..."
10141-CVGroup_CharacterGet_Idle1-1 = "ชุดนี้อาจจะดูน่าอายสักหน่อย...\nตะ... แต่ก็ขอฝากตัวด้วยนะคะ..."
10141-CVGroup_Cafe_Idle1-1 = "(พอใส่ชุดนี้... ทุกคนจะคิดว่าฉันทำตัวเด่นหรือเปล่าคะ...?) "
10141-CVGroup_Cafe_Idle2-1 = "มีที่นั่งตรงไหนในมุมที่ลับตาคนบ้างมั้ยนะ... "
10141-CVGroup_Cafe_Idle3-1 = "กาแฟกลิ่นหอมจังเลยนะคะ... แหะๆ"
10141-CVGroup_Cafe_Idle4-1 = "พวกศัตรู... คงไม่ไล่ตามมา\nถึงที่แบบนี้หรอกใช่มั้ยคะ?"
10141-CVGroup_Cafe_Idle5-1 = "ถ้าซื้อเป็นของที่ระลึกละก็...\nทะ... ทุกคนต้องถูกใจแน่นอนใช่มั้ยคะ?"
10141-CVGroup_WeaponGet_Idle1-1 = "ฉันรับของแบบนี้ไว้ได้ด้วยเหรอ...\nมะ... ไม่ค่ะ... คุณครูตั้งใจเอามาให้แล้วนี่คะ ขอบคุณค่ะ!"
10141-CVGroup_UIEventLobby_Enter1-1 = "พะ... พร้อมเสมอค่ะ!"
10141-CVGroup_UIEventLobby_Enter1-2 = "มะ... ไม่ว่าเรื่องอะไร ก็บอกมาได้เลยค่ะ...!"
10141-CVGroup_UIEventLobby_Enter2-1 = "ขะ... ขอบคุณค่ะ...!"
10141-CVGroup_UIEventLobby_Enter2-2 = "กะ... ก็เรื่องที่... ช่วยมาหากัน... น่ะค่ะ"
10141-CVGroup_UIEventLobby_Idle1-1 = "ขอโทษด้วยค่ะ! ขอโทษด้วยค่ะ!\nคะ... คงเป็น... ความผิดของฉันใช่มั้ยคะ...?"
10141-CVGroup_UIEventLobby_Idle2-1 = "ระเบิด... กระสุนปืน...\nถ้าต้องการละก็ บอกฉันได้เลยนะคะ...! "
10141-CVGroup_UIEventLobby_Idle3-1 = "ว่าแล้วเชียว กำลังเกิดเรื่องวุ่นวายสินะคะ..."
10141-CVGroup_UIEventLobby_Idle3-2 = "ถ้าเกิดรู้สึกสนุกขึ้นมา... จะถือว่าฉันแปลกมั้ยคะ? "
10141-CVGroup_UIEventLobby_Idle4-1 = "จู่ๆ ฉันก็เกิดสงสัยขึ้นมา... ว่าโอเปร่า..."
10141-CVGroup_UIEventLobby_Idle4-2 = "เป็นเรื่องเกี่ยวกับอะไรเหรอคะ?"
