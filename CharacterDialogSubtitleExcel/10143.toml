10143-CVGroup_UIEventMission_Enter1_Shun-2 = "มาดูกำหนดการของวันนี้มั้ยคะ?"
10143-CVGroup_UIEventMission_Enter2_Shun-1 = "พักร้อนครั้งนี้... ได้มาทำภารกิจตรวจสอบ"
10143-CVGroup_UIEventMission_Enter2_Shun-2 = "ในหุบเขาเลย... อาจเป็นเรื่องที่มีความหมายก็ได้นะ"
10143-CVGroup_UIEventMission_Buy3_Shun-1 = "คุณครู ถ้าไม่รังเกียจละก็ รับผลไม้สักหน่อยมั้ยคะ?"
10143-CVGroup_UIEventMission_Buy3_Shun-2 = "ถือว่าได้พักผ่อนด้วย... นี่ค่ะ"
