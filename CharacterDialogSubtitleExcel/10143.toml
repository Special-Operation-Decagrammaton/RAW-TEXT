10143-CVGroup_UIEventMission_Buy4_Shun-2 = "ดูเหมือนทางนั้นจะเตรียมอะไรไว้ให้หลายอย่างเลยนะคะ"
10143-CVGroup_UIEventMission_Idle1_Shun-1 = "แน่นอนว่าเวลาของคุณครูย่อมเป็นของคุณครูเอง..."
10143-CVGroup_UIEventMission_Idle1_Shun-2 = "แต่บางครั้งฉันก็คิดว่า..."
10143-CVGroup_UIEventMission_Idle1_Shun-3 = "อยากแบ่งปันเวลาบางส่วนด้วยกันค่ะ"
10143-CVGroup_UIEventMission_Idle2_Shun-1 = "คุณครูรู้มั้ยคะ? บางครั้งฉันมักถูกทักว่าทำตัวไม่สมวัย..."
10143-CVGroup_UIEventMission_Idle2_Shun-2 = "แต่บางครั้งการทำแบบนั้นก็ได้ผลนะคะ"
10143-CVGroup_UIEventMission_Idle2_Shun-3 = "อย่างเช่น... ทำให้มีเวลาอยู่กับคุณครูแบบนี้"
10143-CVGroup_UIEventMission_Idle2_Shun-4 = "ได้ง่ายขึ้นด้วยไงคะ...?"
