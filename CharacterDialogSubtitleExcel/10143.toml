[translation]
10143-CVGroup_UITitle_Idle1_Shun-1 = "蔚藍，檔案。"
10143-CVGroup_CharacterGet_Idle1-1 = "您做暖身操了嗎？\n不做確實的話可是不行的哦？"
10143-CVGroup_Cafe_Idle1-1 = "哎呀……真是個好地方呢。"
10143-CVGroup_Cafe_Idle2-1 = "這杯茶……感覺對皮膚很好呢。"
10143-CVGroup_Cafe_Idle3-1 = "（穿著泳裝來這裡，真的沒問題嗎……）"
10143-CVGroup_Cafe_Idle4-1 = "唔唔……肩膀好像要僵掉了……"
10143-CVGroup_Cafe_Idle5-1 = "實在是太舒適了……好想一直待在這裡……"
10143-CVGroup_WeaponGet_Idle1_Shun-1 = "像這樣外出度假的時候，總是會不知不覺鬆懈下來。\n但是，正是這種時候才更要繃緊神經才行哦？\n不遵守規矩的話，可是不行的哦。"
10143-CVGroup_UITitle_Idle1_ShunSmall-1 = "蔚藍檔案！耶嘿嘿。"
10143-CVGroup_UIEventLobby_Enter1_Shun-1 = "抵達祕境了……\n呵呵，感覺如何呢。老師？"
10143-CVGroup_UIEventLobby_Enter1_Shun-2 = "我嗎？總覺得很新鮮，很開心哦。"
10143-CVGroup_UIEventLobby_Enter2_Shun-1 = "待會能耽誤您一點時間嗎……？"
10143-CVGroup_UIEventLobby_Enter2_Shun-2 = "不，並不是什麼大事。"
10143-CVGroup_UIEventLobby_Enter2_Shun-3 = "只是……想和老師兩個人，"
10143-CVGroup_UIEventLobby_Enter2_Shun-4 = "一起在這裡到處看看。"
10143-CVGroup_UIEventLobby_Enter3_Shun-1 = "能和老師還有大家一起來旅行……\n我真的很開心。"
10143-CVGroup_UIEventLobby_Enter3_Shun-2 = "我一定，不會忘記這一天的，直到永遠……"
10143-CVGroup_UIEventLobby_Enter4_Shun-1 = "所謂的孩子，是非常純真的。"
10143-CVGroup_UIEventLobby_Enter4_Shun-2 = "他們比我們想像中的接收了更多樣的東西。"
10143-CVGroup_UIEventLobby_Enter4_Shun-3 = "所以，必須好好引導他們才行。"
10143-CVGroup_UIEventLobby_Enter4_Shun-4 = "如同老師對待我們一樣……"
10143-CVGroup_UIEventLobby_Enter4_Shun-5 = "願意如此地為我們著想。"
10143-CVGroup_UIEventLobby_Enter5_Shun-1 = "辛苦您了，老師。\n嗯……真的是辛苦您了。"
10143-CVGroup_UIEventLobby_Enter6_Shun-1 = "那個……方便的話，現在要不要一起……"
10143-CVGroup_UIEventLobby_Enter6_Shun-2 = "去享受真正的旅行呢？"
10143-CVGroup_UIEventLobby_Idle1_Shun-1 = "熱身運動有做確實嗎？"
10143-CVGroup_UIEventLobby_Idle1_Shun-2 = "下水的時候……"
10143-CVGroup_UIEventLobby_Idle1_Shun-3 = "要從腳開始慢慢潑水，讓身體適應溫度之後再下水哦。"
10143-CVGroup_UIEventLobby_Idle2_Shun-1 = "是的，我就在這裡哦。"
10143-CVGroup_UIEventLobby_Idle2_Shun-2 = "如果覺得冷的話……\n我會幫您暖和身體的。"
10143-CVGroup_UIEventLobby_Idle3_Shun-1 = "哇，那裡不行，老師……！"
10143-CVGroup_UIEventLobby_Idle3_Shun-2 = "唔……"
10143-CVGroup_UIEventLobby_Idle3_Shun-3 = "只能一下下哦……"
10143-CVGroup_UIEventLobby_Idle4_Shun-1 = "真是的！老師……不可以哦！"
10143-CVGroup_UIEventLobby_Idle4_Shun-2 = "等到只剩下我們兩個人的時候再做吧。"
10143-CVGroup_UIEventCardShop_Enter1_ShunSmall-1 = "你好！恭候多時了！"
10143-CVGroup_UIEventCardShop_Enter1_ShunSmall-2 = "我是老師的小旬哦！"
10143-CVGroup_UIEventCardShop_Enter2_ShunSmall-1 = "老師，歡迎回來！"
10143-CVGroup_UIEventCardShop_Enter2_ShunSmall-2 = "咦？用小旬沒問題嗎……？"
10143-CVGroup_UIEventCardShop_Enter2_ShunSmall-3 = "呵呵，我一直都沒問題哦！"
10143-CVGroup_UIEventCardShop_Idle1_ShunSmall-1 = "耶嘿嘿，如何呢？有新鮮感嗎？"
10143-CVGroup_UIEventCardShop_Idle1_ShunSmall-2 = "咦，怎麼了嗎？"
10143-CVGroup_UIEventCardShop_Idle1_ShunSmall-3 = "難道是不想和「小旬」……"
10143-CVGroup_UIEventCardShop_Idle1_ShunSmall-4 = "一起玩嗎……？"
10143-CVGroup_UIEventCardShop_Idle2_ShunSmall-1 = "和老師在一起的時候……"
10143-CVGroup_UIEventCardShop_Idle2_ShunSmall-2 = "是最幸福的。"
10143-CVGroup_UIEventCardShop_Idle2_ShunSmall-3 = "因為……"
10143-CVGroup_UIEventCardShop_Idle2_ShunSmall-4 = "可以坦率面對自己的心情。"
10143-CVGroup_UIEventCardShop_Idle2_ShunSmall-5 = "變成小孩子的身體，真是太棒～了！"
10143-CVGroup_UIEventCardShop_Prize3_ShunSmall-1 = "中獎了！好厲害！"
10143-CVGroup_UIEventCardShop_Prize3_ShunSmall-2 = "那邊好像可以交換商品哦！"
10143-CVGroup_UIEventCardShop_Prize2_ShunSmall-1 = "哇啊！好厲害！老師，再拿近一點讓我看看！"
10143-CVGroup_UIEventCardShop_Prize1_ShunSmall-1 = "這到底是什麼呢……？\n一定是很厲害的東西！"
10143-CVGroup_UIEventCardShop_Prize0_ShunSmall-1 = "全部收集完了，是嗎？\n辛苦你了，老師！"
10143-CVGroup_UIEventCardShop_Enter3_ShunSmall-1 = "啊，老師！耶嘿嘿。等你好久了！"
10143-CVGroup_UIEventCardShop_Enter4_ShunSmall-1 = "該做的事全～部都做完了的話……\n要不要一起去玩呢？"
10143-CVGroup_UIEventCardShop_Enter4_ShunSmall-2 = "當然是……只有我們兩個人哦。"
10143-CVGroup_UIEventMission_Enter1_Shun-1 = "姑且，這也算是查核的一環哦。"
10143-CVGroup_UIEventMission_Enter1_Shun-2 = "來看看今天的行程吧。"
10143-CVGroup_UIEventMission_Enter2_Shun-1 = "沒想到查核對象竟然是這麼漂亮的溪谷……"
10143-CVGroup_UIEventMission_Enter2_Shun-2 = "總覺得，好期待呢。"
10143-CVGroup_UIEventMission_Buy3_Shun-1 = "老師，不介意的話要不要來點水果呢？"
10143-CVGroup_UIEventMission_Buy3_Shun-2 = "順便休息一下……來，請用。"
10143-CVGroup_UIEventMission_Buy4_Shun-1 = "辛苦您了。"
10143-CVGroup_UIEventMission_Buy4_Shun-2 = "那邊好像在幫忙做各種準備哦。"
10143-CVGroup_UIEventMission_Idle1_Shun-1 = "那個……老師的時間，當然是屬於老師的……"
10143-CVGroup_UIEventMission_Idle1_Shun-2 = "但就算只有一部分……只有一點點，也沒關係。"
10143-CVGroup_UIEventMission_Idle1_Shun-3 = "要是能一起度過就好了，我有時候也會這麼想。"
10143-CVGroup_UIEventMission_Idle2_Shun-1 = "雖然偶爾會被說太過冒失……"
10143-CVGroup_UIEventMission_Idle2_Shun-2 = "但那也會有發揮奇效的時候哦。"
10143-CVGroup_UIEventMission_Idle2_Shun-3 = "呵呵，是的。"
10143-CVGroup_UIEventMission_Idle2_Shun-4 = "因為像這樣創造出一起相處的時間了呢。"
10143-CVGroup_UIEventMission_Interaction5-1 = "今天的查核這樣就結束了呢。"
10143-CVGroup_UIEventMission_Interaction5-2 = "接下來……就是自由時間了。"
