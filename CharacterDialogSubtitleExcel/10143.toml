[translation]
10143-CVGroup_UITitle_Idle1_Shun-1 = "Blue... Archive"
10143-CVGroup_CharacterGet_Idle1-1 = "วอร์มอัปมาแล้วหรือยังคะ?\nถ้าไม่ทำให้เรียบร้อย จะถูกฉันดุนะคะ"
10143-CVGroup_Cafe_Idle1-1 = "ว้าว เป็นสถานที่ที่ยอดเยี่ยมจังเลยค่ะ"
10143-CVGroup_Cafe_Idle2-1 = "ไม่ทราบว่าชานั่นดีต่อผิวพรรณหรือเปล่าคะ?"
10143-CVGroup_Cafe_Idle3-1 = "(ใส่ชุดว่ายน้ำในสถานที่แบบนี้ จะไม่เป็นไรเหรอคะ...?)"
10143-CVGroup_Cafe_Idle4-1 = "อึก... ไหล่กลับมาตึงอีกแล้วค่ะ..."
10143-CVGroup_Cafe_Idle5-1 = "ที่นี่เย็นสบายมากจนไม่อยากออกไปเลยค่ะ..."
10143-CVGroup_WeaponGet_Idle1_Shun-1 = "ช่วงพักร้อน... เป็นช่วงที่เราเผลอผ่อนคลายจนประมาทได้ง่ายนะคะ\nฉันเองก็จะระวัง เพราะงั้นคุณครูก็ระวังด้วยนะคะ\nถ้าไม่ทำตามกฎความปลอดภัย จะต้องถูก 'อบรม' นะคะ"
10143-CVGroup_UITitle_Idle1_ShunSmall-1 = "Blue... Archive"
10143-CVGroup_UIEventLobby_Enter1_Shun-1 = "มาถึงดินแดนเร้นลับแล้วนะคะ...\nฮุฮุ เป็นยังไงบ้างคะ คุณครู?"
10143-CVGroup_UIEventLobby_Enter1_Shun-2 = "ฉันเหรอคะ? รู้สึกแปลกใหม่และสนุกดีค่ะ"
10143-CVGroup_UIEventLobby_Enter2_Shun-1 = "ไว้หลังจากนี้ คุณครูพอจะมีเวลามั้ยคะ?"
10143-CVGroup_UIEventLobby_Enter2_Shun-2 = "ฮุฮุ ไม่ใช่เรื่องใหญ่อะไรหรอกค่ะ"
10143-CVGroup_UIEventLobby_Enter2_Shun-3 = "ฉันก็แค่... อยากไปเดินชม"
10143-CVGroup_UIEventLobby_Enter2_Shun-4 = "สถานที่แห่งนี้กับคุณครูน่ะค่ะ"
10143-CVGroup_UIEventLobby_Enter3_Shun-1 = "ได้มาเที่ยวแบบนี้กับคุณครูและทุกคน... ดีจริงๆ เลยนะคะ"
10143-CVGroup_UIEventLobby_Enter3_Shun-2 = "ฉันจะไม่มีวันลืมค่ะ"
10143-CVGroup_UIEventLobby_Enter4_Shun-1 = "เด็กๆ ช่างบริสุทธิ์จริงๆ นะคะ"
10143-CVGroup_UIEventLobby_Enter4_Shun-2 = "เพราะพวกเขาเปิดรับสิ่งต่างๆ มากกว่าที่เราคิดค่ะ"
10143-CVGroup_UIEventLobby_Enter4_Shun-3 = "เพราะอย่างนั้น เราจึงต้องคอยชี้แนะพวกเขาค่ะ"
10143-CVGroup_UIEventLobby_Enter4_Shun-4 = "เหมือนกับเวลาที่คุณครูมองพวกเรา..."
10143-CVGroup_UIEventLobby_Enter4_Shun-5 = "แล้วมีความคิดแบบเดียวกันยังไงล่ะคะ"
10143-CVGroup_UIEventLobby_Enter5_Shun-1 = "คุณครูทำงานหนักมากเลยนะคะ ค่ะ... เป็นอย่างนั้นจริงๆ"
10143-CVGroup_UIEventLobby_Enter6_Shun-1 = "ถ้างั้น อย่างน้อยตั้งแต่ตอนนี้ ก็มาพักร้อนชดเชย..."
10143-CVGroup_UIEventLobby_Enter6_Shun-2 = "ให้เต็มที่ด้วยกันมั้ยคะ?"
10143-CVGroup_UIEventLobby_Idle1_Shun-1 = "เรียกฉันเหรอคะ คุณครู?\nวอร์มร่างกายเรียบร้อยแล้วใช่มั้ยคะ?"
10143-CVGroup_UIEventLobby_Idle1_Shun-2 = "ตอนลงน้ำน่ะ"
10143-CVGroup_UIEventLobby_Idle1_Shun-3 = "ต้องค่อยๆ เอาขาจุ่มน้ำก่อนนะคะ"
10143-CVGroup_UIEventLobby_Idle2_Shun-1 = "ค่ะ ฉันอยู่ตรงนี้ค่ะ"
10143-CVGroup_UIEventLobby_Idle2_Shun-2 = "ถ้ารู้สึกหนาวหรืออะไรละก็... ฉันจะทำให้อบอุ่นเองค่ะ"
10143-CVGroup_UIEventLobby_Idle3_Shun-1 = "ว้าย ตรงนั้นไม่ได้นะคะ คุณครู...!"
10143-CVGroup_UIEventLobby_Idle3_Shun-2 = "อึก..."
10143-CVGroup_UIEventLobby_Idle3_Shun-3 = "แต่ถ้าแค่นิดเดียว ฉันอาจอนุญาตให้ก็ได้ค่ะ...?"
10143-CVGroup_UIEventLobby_Idle4_Shun-1 = "จริงๆ เลย! คุณครูก็... จะโดนดุนะคะ!"
10143-CVGroup_UIEventLobby_Idle4_Shun-2 = "เอาไว้ตอนที่เราอยู่กันสองคนนะ เข้าใจใช่มั้ยคะ...?"
10143-CVGroup_UIEventCardShop_Enter1_ShunSmall-1 = "สวัสดีค่ะ คุณครู! เชิญค่ะ!"
10143-CVGroup_UIEventCardShop_Enter1_ShunSmall-2 = "ฉันชุนหลิงของคุณครูเองค่ะ!"
10143-CVGroup_UIEventCardShop_Enter2_ShunSmall-1 = "ว้าว! คุณครูมาแล้วสินะคะ!"
10143-CVGroup_UIEventCardShop_Enter2_ShunSmall-2 = "อยู่ในร่างนี้จะเป็นอะไรหรือเปล่าน่ะเหรอคะ?"
10143-CVGroup_UIEventCardShop_Enter2_ShunSmall-3 = "ฮุฮุ สำหรับฉัน ไม่ว่าเมื่อไรก็ไม่เป็นไรนะคะ?"
10143-CVGroup_UIEventCardShop_Idle1_ShunSmall-1 = "เป็นยังไงบ้างคะ คุณครู? รู้สึกแปลกใหม่มั้ยคะ?"
10143-CVGroup_UIEventCardShop_Idle1_ShunSmall-2 = "เอ๋? เป็นอะไรไปเหรอคะ? "
10143-CVGroup_UIEventCardShop_Idle1_ShunSmall-3 = "หรือว่า ไม่อยากเล่น"
10143-CVGroup_UIEventCardShop_Idle1_ShunSmall-4 = "กับ 'ชุนหลิง'... คะ?"
10143-CVGroup_UIEventCardShop_Idle2_ShunSmall-1 = "ฉันน่ะ"
10143-CVGroup_UIEventCardShop_Idle2_ShunSmall-2 = "ชอบเวลาที่ได้อยู่กับคุณครูที่สุดเลยค่ะ!"
10143-CVGroup_UIEventCardShop_Idle2_ShunSmall-3 = "เพราะว่า... ในตอนนี้"
10143-CVGroup_UIEventCardShop_Idle2_ShunSmall-4 = "ฉันซื่อตรงกับความรู้สึกได้จริงๆ ค่ะ"
10143-CVGroup_UIEventCardShop_Idle2_ShunSmall-5 = "ร่างเด็กนี่ยอดเยี่ยมที่สุดเลยค่ะ!"
10143-CVGroup_UIEventCardShop_Prize3_ShunSmall-1 = "สุดยอดเลยค่ะ คุณครู! ถูกรางวัลแล้วค่ะ!"
10143-CVGroup_UIEventCardShop_Prize3_ShunSmall-2 = "ได้ยินว่าคนในย่านร้านค้าเตรียมรางวัลไว้ให้ค่ะ!"
10143-CVGroup_UIEventCardShop_Prize2_ShunSmall-1 = "ว้าว! เท่สุดๆ ไปเลยค่ะ!\nคุณครู ฉันก็อยากเห็นรางวัลเหมือนกันค่ะ..."
10143-CVGroup_UIEventCardShop_Prize1_ShunSmall-1 = "อะไรเหรอคะ? ได้อะไรมา?\nต้องเป็นของเด็ดๆ แน่เลยค่ะ!"
10143-CVGroup_UIEventCardShop_Prize0_ShunSmall-1 = "อะไรเหรอคะ? ได้อะไรมา?\nต้องเป็นของเด็ดๆ แน่เลยค่ะ!"
10143-CVGroup_UIEventCardShop_Enter3_ShunSmall-1 = "อ๊ะ คุณครู! ฮิฮิฮิ ฉันกำลังรออยู่แบบนี้เลยนะคะ?"
10143-CVGroup_UIEventCardShop_Enter4_ShunSmall-1 = "ถ้าทำงานเสร็จ~ ทั้งหมดแล้ว... ไปเล่นสนุกกันมั้ยคะ?"
10143-CVGroup_UIEventCardShop_Enter4_ShunSmall-2 = "แน่นอนว่า... แค่เราสองคนนะ... คะ..."
