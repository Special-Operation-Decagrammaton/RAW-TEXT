[translation]
10143-CVGroup_UITitle_Idle1_Shun-1 = "Blue, Archive."
10143-CVGroup_CharacterGet_Idle1-1 = "Did you stretch properly? It's a big no-no if you haven't!"
10143-CVGroup_Cafe_Idle1-1 = "Wow, it's amazing here."
10143-CVGroup_Cafe_Idle2-1 = "By any chance, is that tea good for your skin?"
10143-CVGroup_Cafe_Idle3-1 = "(Is it okay to be wearing a swimsuit here...?)"
10143-CVGroup_Cafe_Idle4-1 = "Ugh... My shoulders are sore again..."
10143-CVGroup_Cafe_Idle5-1 = "It's nice and cool here. I don't want to go outside..."
10143-CVGroup_WeaponGet_Idle1_Shun-1 = "Summer... Vacation... It's a time where people tend to become more lax. I'll take caution, so you should as well, Sensei. If you don't follow the safety rules, I'll have to discipline you, okay?"
10143-CVGroup_UITitle_Idle1_ShunSmall-1 = "Blue, Archive. Heehee."
10143-CVGroup_UIEventLobby_Enter1_Shun-1 = "We're here in the beauty of nature. Fufu, how is it, Sensei?"
10143-CVGroup_UIEventLobby_Enter1_Shun-2 = "What do I think? It's so refreshing and fun."
10143-CVGroup_UIEventLobby_Enter2_Shun-1 = "Could I borrow some of your time later?"
10143-CVGroup_UIEventLobby_Enter2_Shun-2 = "Fufu. It's nothing serious."
10143-CVGroup_UIEventLobby_Enter2_Shun-3 = "I simply wanted to..."
10143-CVGroup_UIEventLobby_Enter2_Shun-4 = "...go exploring with you."
10143-CVGroup_UIEventLobby_Enter3_Shun-1 = "Going on a trip like this with you and the others... It really does feel nice."
10143-CVGroup_UIEventLobby_Enter3_Shun-2 = "I won't forget it."
10143-CVGroup_UIEventLobby_Enter4_Shun-1 = "Kids are very pure."
10143-CVGroup_UIEventLobby_Enter4_Shun-2 = "They take in their surroundings more than we realize."
10143-CVGroup_UIEventLobby_Enter4_Shun-3 = "Which is why we must set a good example."
10143-CVGroup_UIEventLobby_Enter4_Shun-4 = "That must be how you feel..."
10143-CVGroup_UIEventLobby_Enter4_Shun-5 = "...when you look at us."
10143-CVGroup_UIEventLobby_Enter5_Shun-1 = "Great work, Sensei. Yes... Really."
10143-CVGroup_UIEventLobby_Enter6_Shun-1 = "How about we go take a summer vacation..."
10143-CVGroup_UIEventLobby_Enter6_Shun-2 = "...we really get to enjoy together."
10143-CVGroup_UIEventLobby_Idle1_Shun-1 = "Were you looking for me, Sensei? Have you stretched yet?"
10143-CVGroup_UIEventLobby_Idle1_Shun-2 = "Whenever you go in the water..."
10143-CVGroup_UIEventLobby_Idle1_Shun-3 = "You have to enter slowly, starting with your legs."
10143-CVGroup_UIEventLobby_Idle2_Shun-1 = "Yes. I'm here."
10143-CVGroup_UIEventLobby_Idle2_Shun-2 = "If you're cold, I'll warm you up."
10143-CVGroup_UIEventLobby_Idle3_Shun-1 = "Wah, not there, Sensei...!"
10143-CVGroup_UIEventLobby_Idle3_Shun-2 = "Ugh..."
10143-CVGroup_UIEventLobby_Idle3_Shun-3 = "If it's only a little bit, I'll let you."
10143-CVGroup_UIEventLobby_Idle4_Shun-1 = "Seriously! Sensei... That's a no-no!"
10143-CVGroup_UIEventLobby_Idle4_Shun-2 = "Save that for later, when it's just us two, okay?"
10143-CVGroup_UIEventCardShop_Enter1_ShunSmall-1 = "Hi, Sensei! Welcome in!"
10143-CVGroup_UIEventCardShop_Enter1_ShunSmall-2 = "It's your Shunling!"
10143-CVGroup_UIEventCardShop_Enter2_ShunSmall-1 = "Yay! Sensei is here!"
10143-CVGroup_UIEventCardShop_Enter2_ShunSmall-2 = "Am I acceptable, looking like this?"
10143-CVGroup_UIEventCardShop_Enter2_ShunSmall-3 = "Fufu, you say I always am?"
10143-CVGroup_UIEventCardShop_Idle1_ShunSmall-1 = "How is it, Sensei? This new experience?"
10143-CVGroup_UIEventCardShop_Idle1_ShunSmall-2 = "Hm? Is something wrong?"
10143-CVGroup_UIEventCardShop_Idle1_ShunSmall-3 = "Do you not..."
10143-CVGroup_UIEventCardShop_Idle1_ShunSmall-4 = "...want to play...with \"Shunling\"?"
10143-CVGroup_UIEventCardShop_Idle2_ShunSmall-1 = "I..."
10143-CVGroup_UIEventCardShop_Idle2_ShunSmall-2 = "I like it best when I'm with you!"
10143-CVGroup_UIEventCardShop_Idle2_ShunSmall-3 = "Because right now..."
10143-CVGroup_UIEventCardShop_Idle2_ShunSmall-4 = "...I can be as honest as I want."
10143-CVGroup_UIEventCardShop_Idle2_ShunSmall-5 = "Being a kid is the best!"
10143-CVGroup_UIEventCardShop_Prize3_ShunSmall-1 = "That's amazing, Sensei! You won!"
10143-CVGroup_UIEventCardShop_Prize3_ShunSmall-2 = "The shopping district residents have a prize for you!"
10143-CVGroup_UIEventCardShop_Prize2_ShunSmall-1 = "Wow! Incredible! Sensei, I wanna see it too! Pleeease...?"
10143-CVGroup_UIEventCardShop_Prize1_ShunSmall-1 = "What is it? What is it? I'm sure it's something incredible!"
10143-CVGroup_UIEventCardShop_Prize0_ShunSmall-1 = "What is it? What is it? I'm sure it's something incredible!"
10143-CVGroup_UIEventCardShop_Enter3_ShunSmall-1 = "Ah, Sensei! Heehee. I've been waiting for you, you know!"
10143-CVGroup_UIEventCardShop_Enter4_ShunSmall-1 = "When you're aaaaall done with your work... Can we go do something fun?"
10143-CVGroup_UIEventCardShop_Enter4_ShunSmall-2 = "With just the two of us... Of course!"
10143-CVGroup_UIEventMission_Enter1_Shun-1 = "While we labeled it a vacation...it was originally meant to be an audit."
10143-CVGroup_UIEventMission_Enter1_Shun-2 = "Shall we see what's on the schedule today?"
10143-CVGroup_UIEventMission_Enter2_Shun-1 = "This vacation–ahem, audit..."
10143-CVGroup_UIEventMission_Enter2_Shun-2 = "To think it would be in the valley... It may be a fruitful experience."
10143-CVGroup_UIEventMission_Buy3_Shun-1 = "Would you like some fruit, Sensei?"
10143-CVGroup_UIEventMission_Buy3_Shun-2 = "Use this chance to take a break. Here you go."
10143-CVGroup_UIEventMission_Buy4_Shun-1 = "Great job."
10143-CVGroup_UIEventMission_Buy4_Shun-2 = "They've prepared many different things."
10143-CVGroup_UIEventMission_Idle1_Shun-1 = "Naturally, your time is your own."
10143-CVGroup_UIEventMission_Idle1_Shun-2 = "But at times, I also want to..."
10143-CVGroup_UIEventMission_Idle1_Shun-3 = "...have just a little bit of that time."
10143-CVGroup_UIEventMission_Idle2_Shun-1 = "You know, Sensei? Some people call the way I act ridiculous."
10143-CVGroup_UIEventMission_Idle2_Shun-2 = "But it can come in use at times."
10143-CVGroup_UIEventMission_Idle2_Shun-3 = "For example, it makes it easier..."
10143-CVGroup_UIEventMission_Idle2_Shun-4 = "...for me to find time to be with you, Sensei."
10143-CVGroup_UIEventMission_Interaction5-1 = "That's it for today's audit."
10143-CVGroup_UIEventMission_Interaction5-2 = "Which means...now we have free time!"
