[translation]
26016-CVGroup_UITitle_Idle1-1 = "블루~! 아카이, 브!"
26016-CVGroup_CharacterGet_Idle1-1 = "푸른 하늘, 드넓은 바다, 반짝이는 여름의 태양……\n한여름의 꿈이 여기에!\n특종이 있는곳에 제가 있다, 입니다!"
26016-CVGroup_Cafe_Idle1-1 = "치아키 레이더, 온!\n자아, 무슨 이야기를\n하고 있으려나~!"
26016-CVGroup_Cafe_Idle2-1 = "오오-!\n이건 게헨나에서도\n보기 힘드네요……!"
26016-CVGroup_Cafe_Idle3-1 = "모토미야입니다!\n황송합니다!\n인터뷰\n실례하겠습니다!"
26016-CVGroup_Cafe_Idle4-1 = "저 동아리,\n신경쓰이네요……\n체험 입부\n가능할까요?"
26016-CVGroup_Cafe_Idle5-1 = "(대체, 무슨\n사이일까……?)"
26016-CVGroup_WeaponGet_Idle1-1 = "펜은 총보다 강해요!\n……뭐, 이건 펜보다 강하지만요!"
26016-CVGroup_UIEventLobby_Enter1-1 = "이야아~\n완전 큰일났네요!"
26016-CVGroup_UIEventLobby_Enter1-2 = "하하! 하……\n진짜 큰일……\n이네요……."
26016-CVGroup_UIEventLobby_Enter2-1 = "기자에게 경험은\n중요하지만요오……."
26016-CVGroup_UIEventLobby_Enter2-2 = "이건, 쫌……!"
26016-CVGroup_UIEventLobby_Enter3-1 = "다퉈도 좋은건\n하나도 없는데……."
26016-CVGroup_UIEventLobby_Enter3-2 = "우으……."
26016-CVGroup_UIEventLobby_Enter4-1 = "오오……! 캡틴 마코토!\n멋져요! 요-호호~!"
26016-CVGroup_UIEventLobby_Enter5-1 = "다음 주간만마전은\n엄청엄청엄청 두껍겠네요!\n아하핫!"
26016-CVGroup_UIEventLobby_Idle1-1 = "저는 소설가가\n아닌 서기지만…….\n역시 마지막은 해피엔딩이\n아니면 안돼요!"
26016-CVGroup_UIEventLobby_Idle2-1 = "뭐어- \n지금까지도 어떻게든\n해냈으니까요……."
26016-CVGroup_UIEventLobby_Idle3-1 = "다같이 웃는 사진,\n찍고싶네에……."
26016-CVGroup_UIEventLobby_Idle4-1 = "서기답게,\n전부 기록하고 있다구요!"
26016-CVGroup_UIEventLobby_Idle4-2 = "이걸 믿을지 말지는,\n독자들의 몫이겠죠!"
