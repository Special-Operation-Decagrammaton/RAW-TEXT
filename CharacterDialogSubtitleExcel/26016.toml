[translation]
26016-CVGroup_UITitle_Idle1-1 = "蔚藍～！檔案！"
26016-CVGroup_CharacterGet_Idle1-1 = "蔚藍的天空、遼闊的大海、耀眼的常夏太陽……\n一場夏日之夢就在這裡！\n哪裡有獨家新聞，哪裡就有我！"
26016-CVGroup_Cafe_Idle1-1 = "千秋雷達，啟動！\n來～在聊些什麼呢～！"
26016-CVGroup_Cafe_Idle2-1 = "哦哦～！這是在格黑娜也很少見的景象……！"
26016-CVGroup_Cafe_Idle3-1 = "我是元宮！說來冒昧！\n請允許我進行採訪！"
26016-CVGroup_Cafe_Idle4-1 = "那個社團，讓人很在意……可以體驗入部嗎？"
26016-CVGroup_Cafe_Idle5-1 = "（到底是什麼關係呢……？）"
26016-CVGroup_WeaponGet_Idle1-1 = "筆比槍更有力！\n……不過，這個算是例外啦！"
26016-CVGroup_UIEventLobby_Enter1-1 = "哎呀～真的很不得了呢！"
26016-CVGroup_UIEventLobby_Enter1-2 = "啊哈哈……真的，很不得了呢……"
26016-CVGroup_UIEventLobby_Enter2-1 = "雖然我覺得身為記者，經驗是很重要的……"
26016-CVGroup_UIEventLobby_Enter2-2 = "但這個就有點……！"
26016-CVGroup_UIEventLobby_Enter3-1 = "明明吵架不會有任何好處的說……"
26016-CVGroup_UIEventLobby_Enter3-2 = "嗚嗚……"
26016-CVGroup_UIEventLobby_Enter4-1 = "哦哦！真琴船長，真帥氣！喲呵呵～！"
26016-CVGroup_UIEventLobby_Enter5-1 = "下一期的週刊萬魔殿似乎會變得很厚呢！啊哈哈！"
26016-CVGroup_UIEventLobby_Idle1-1 = "雖然我不是小說家而是書記……\n不過最後果然還是要Happy End才行！"
26016-CVGroup_UIEventLobby_Idle2-1 = "嗯，雖然到目前為止都順利解決了……"
26016-CVGroup_UIEventLobby_Idle3-1 = "真想拍一張大家都笑著的照片啊……"
26016-CVGroup_UIEventLobby_Idle4-1 = "身為書記，我可是全～都記錄下來囉！"
26016-CVGroup_UIEventLobby_Idle4-2 = "至於要不要相信這段故事，就交給讀者了！"
