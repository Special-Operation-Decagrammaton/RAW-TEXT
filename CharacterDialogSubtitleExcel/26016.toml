[translation]
26016-CVGroup_UITitle_Idle1-1 = "Blue~! Archive!"
26016-CVGroup_CharacterGet_Idle1-1 = "ท้องฟ้าสีคราม ทะเลกว้างใหญ่ ดวงอาทิตย์ฤดูร้อนที่ส่องประกาย...\nความฝันกลางฤดูร้อนอยู่ที่นี่แล้ว!\nที่ไหนมีสกู๊ปพิเศษ ที่นั่นมีฉันค่ะ!"
26016-CVGroup_Cafe_Idle1-1 = "เรดาร์จิอากิ เปิดทำงาน!\nเอาละ ผู้คนกำลังคุยเรื่องอะไรกันอยู่นะ~!"
26016-CVGroup_Cafe_Idle2-1 = "โอ้โห! ของแบบนี้แม้แต่ในเกเฮนน่าก็หายากนะคะ...!"
26016-CVGroup_Cafe_Idle3-1 = "ฉันโมโตมิยะค่ะ! เป็นเกียรติอย่างยิ่งค่ะ!\nขออนุญาตสัมภาษณ์นะคะ!"
26016-CVGroup_Cafe_Idle4-1 = "ชมรมนั้นสะดุดตาจังค่ะ...\nขอลองทำกิจกรรมชมรมจะได้มั้ยคะ?"
26016-CVGroup_Cafe_Idle5-1 = "(ตกลงนี่เป็นความสัมพันธ์แบบไหนกันแน่นะ...?)"
26016-CVGroup_WeaponGet_Idle1-1 = "ปากกาแข็งแกร่งกว่าปืนค่ะ!\nแต่... เจ้านี่ก็แข็งแกร่งกว่าปากกานะคะ!"
26016-CVGroup_UIEventLobby_Enter1-1 = "ว้าว~ เกิดเรื่องใหญ่สุดๆ เลยนะคะ!"
26016-CVGroup_UIEventLobby_Enter1-2 = "ฮ่าฮ่า! ฮ่า... เป็นเรื่องใหญ่... จริงๆ เลยค่ะ..."
26016-CVGroup_UIEventLobby_Enter2-1 = "ประสบการณ์เป็นสิ่งสำคัญสำหรับนักข่าวก็จริงค่ะ..."
26016-CVGroup_UIEventLobby_Enter2-2 = "แต่นี่มัน ออกจะ...!"
26016-CVGroup_UIEventLobby_Enter3-1 = "ทะเลาะกันไปก็ไม่มีอะไรดีเลยแท้ๆ..."
26016-CVGroup_UIEventLobby_Enter3-2 = "อึก..."
26016-CVGroup_UIEventLobby_Enter4-1 = "โอ้ว...! กัปตันมาโคโตะ! เท่มากค่ะ! โยะโฮโฮ~!"
26016-CVGroup_UIEventLobby_Enter5-1 = "แพนเดโมเนียม โซไซตี้รายสัปดาห์ฉบับหน้า\nต้องหนามากๆๆ แน่เลยค่ะ! อะฮะฮ่า!"
26016-CVGroup_UIEventLobby_Idle1-1 = "ฉันเป็นเลขา ไม่ใช่นักเขียนนิยายก็จริงค่ะ...\nแต่ตอนจบ ต้องให้จบแบบแฮปปี้เอนดิ้งค่ะ!"
26016-CVGroup_UIEventLobby_Idle2-1 = "ก็นะ ที่ผ่านมาก็หาทางออกได้มาตลอดนี่คะ..."
26016-CVGroup_UIEventLobby_Idle3-1 = "อยากถ่ายรูปที่ทุกคนยิ้มด้วยกันจังเลยค่ะ..."
26016-CVGroup_UIEventLobby_Idle4-1 = "สมกับเป็นเลขา ฉันจดบันทึกไว้ทุกอย่างเลยค่ะ!"
26016-CVGroup_UIEventLobby_Idle4-2 = "ส่วนจะเชื่อหรือไม่เชื่อนั้น ก็ขึ้นอยู่กับผู้อ่านแล้วละค่ะ!"
