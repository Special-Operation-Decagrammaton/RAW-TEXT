[translation]
26016-CVGroup_UITitle_Idle1-1 = "ブル～！アーカイ、ブ！"
26016-CVGroup_CharacterGet_Idle1-1 = "青い空、広い海、眩しい常夏の太陽……\nひと夏の夢がここにある！\n特ダネのあるところに私あり、です！"
26016-CVGroup_Cafe_Idle1-1 = "チアキレーダー、オン！\nさ～て、何を話しているのかな～！"
26016-CVGroup_Cafe_Idle2-1 = "おお～！\nこれはゲヘナでも中々見ない光景……！"
26016-CVGroup_Cafe_Idle3-1 = "元宮です！恐縮です！インタビュー失礼します！"
26016-CVGroup_Cafe_Idle4-1 = "あの部活、気になる……体験入部できますかね？"
26016-CVGroup_Cafe_Idle5-1 = "（いったい、どういう関係なんだろ……？）"
26016-CVGroup_WeaponGet_Idle1-1 = "ペンは銃よりも強し！\n……まぁ、これは例外ですけどね！"
26016-CVGroup_UIEventLobby_Enter1-1 = "いや～、ホント大変ですね！"
26016-CVGroup_UIEventLobby_Enter1-2 = "あはは……本当に、大変ですね……。"
26016-CVGroup_UIEventLobby_Enter2-1 = "記者としては経験が大事だと思いますけど……。"
26016-CVGroup_UIEventLobby_Enter2-2 = "これはちょっと……！"
26016-CVGroup_UIEventLobby_Enter3-1 = "ケンカしてもいいことなんて1つもないのに……。"
26016-CVGroup_UIEventLobby_Enter3-2 = "うぅ……。"
26016-CVGroup_UIEventLobby_Enter4-1 = "おお！キャプテンマコト、かっこいいです！ヨーホホ～！"
26016-CVGroup_UIEventLobby_Enter5-1 = "次号の週刊万魔殿が厚くなりそうですね！あははっ！"
26016-CVGroup_UIEventLobby_Idle1-1 = "私は小説家ではなく書記ですが……\nやっぱり最後はハッピーエンドじゃないと！"
26016-CVGroup_UIEventLobby_Idle2-1 = "まあ、今までもなんとかなりましたから……。"
26016-CVGroup_UIEventLobby_Idle3-1 = "みんな笑顔の写真、撮りたいな……。"
26016-CVGroup_UIEventLobby_Idle4-1 = "書記として、ぜーんぶ記録してますよ！"
26016-CVGroup_UIEventLobby_Idle4-2 = "この話を信じるかどうかは、読者に任せます！"
