[translation]
26016-CVGroup_UITitle_Idle1-1 = "Blue! Archive!"
26016-CVGroup_CharacterGet_Idle1-1 = "A blue sky, the vast ocean, and the sparkling summer sun... A midsummer dream awaits right here! Where there's a scoop, there's me!"
26016-CVGroup_Cafe_Idle1-1 = "Chiaki radar, on! Now, what could they be talking about?"
26016-CVGroup_Cafe_Idle2-1 = "Oh! This would be hard to find in Gehenna too...!"
26016-CVGroup_Cafe_Idle3-1 = "Motomiya here! Thank you! May I ask for an interview?"
26016-CVGroup_Cafe_Idle4-1 = "That club looks interesting... Do they allow trial periods?"
26016-CVGroup_Cafe_Idle5-1 = "(What is the nature of their relationship...?)"
26016-CVGroup_WeaponGet_Idle1-1 = "Pens are stronger than guns! ...Well, this one's stronger than any pen, though!"
26016-CVGroup_UIEventLobby_Enter1-1 = "Wow... This is a total disaster!"
26016-CVGroup_UIEventLobby_Enter1-2 = "Haha! Ha... This really is a...total disaster..."
26016-CVGroup_UIEventLobby_Enter2-1 = "Experience is important for a reporter, but..."
26016-CVGroup_UIEventLobby_Enter2-2 = "This is a bit much...!"
26016-CVGroup_UIEventLobby_Enter3-1 = "No good comes from fighting..."
26016-CVGroup_UIEventLobby_Enter3-2 = "Ugh..."
26016-CVGroup_UIEventLobby_Enter4-1 = "Oh...! Captain Makoto, looking so cool! Yo-hoho!"
26016-CVGroup_UIEventLobby_Enter5-1 = "The next Weekly Pandemonium Society will be very, very, very thick! Ahaha!"
26016-CVGroup_UIEventLobby_Idle1-1 = "I'm a secretary, not a writer... But ultimately, it just has to be a happy ending!"
26016-CVGroup_UIEventLobby_Idle2-1 = "Well, we've managed to somehow pull through until now..."
26016-CVGroup_UIEventLobby_Idle3-1 = "I want to take a photo of everyone smiling..."
26016-CVGroup_UIEventLobby_Idle4-1 = "I'm recording everything, like the secretary I am!"
26016-CVGroup_UIEventLobby_Idle4-2 = "Whether or not to believe this is up to the readers!"
