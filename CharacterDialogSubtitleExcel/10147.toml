[translation]
10147-CVGroup_UITitle_Idle1-1 = "蔚藍～檔案～"
10147-CVGroup_CharacterGet_Idle1-1 = "哎呀，你叫我嗎，老師？\n答應我今後數千年的合作吧？"
10147-CVGroup_Cafe_Idle1-1 = "在這裡……應該不需要防曬乳吧。"
10147-CVGroup_Cafe_Idle2-1 = "轉～啊轉……轉～啊轉……\n練習到這種程度應該夠了吧。"
10147-CVGroup_Cafe_Idle3-1 = "人口密度正在提高……危險程度也上升了呢。"
10147-CVGroup_Cafe_Idle4-1 = "老師在哪裡呢。明明想和他互相依靠的說。"
10147-CVGroup_Cafe_Idle5-1 = "那個……總覺得散發著危險的氣息。"
10147-CVGroup_WeaponGet_Idle1-1 = "哎呀，是為我準備的嗎？\n謝謝你，老師。\n但我沒有回禮呢……給你隨意對待我的權利，怎麼樣？"
10147-CVGroup_UIEventLobby_Enter1-1 = "唉……竟然會變成這樣……"
10147-CVGroup_UIEventLobby_Enter1-2 = "沒事的，老師。\n總會有辦法的。"
10147-CVGroup_UIEventLobby_Enter2-1 = "沒想到竟然會漂流……\n就從做得到的事開始著手吧。"
10147-CVGroup_UIEventLobby_Enter3-1 = "幽，幽靈船……是真的嗎？\n老師，你快想想辦法啊……！"
10147-CVGroup_UIEventLobby_Enter4-1 = "真琴醬，完全入戲了呢……\n算了，我相信會沒事的。"
10147-CVGroup_UIEventLobby_Enter5-1 = "這樣就全都解決……了嗎？\n總算是圓滿落幕了呢。"
10147-CVGroup_UIEventLobby_Idle1-1 = "嗯？什麼？"
10147-CVGroup_UIEventLobby_Idle1-2 = "……要我不用太擔心？"
10147-CVGroup_UIEventLobby_Idle1-3 = "呵呵，老師。你是在安慰我嗎？"
10147-CVGroup_UIEventLobby_Idle2-1 = "雖然總覺得和想像中不太一樣……"
10147-CVGroup_UIEventLobby_Idle2-2 = "不過，大海本來就是危險的地方嘛。這也沒辦法。"
10147-CVGroup_UIEventLobby_Idle3-1 = "這件泳裝？"
10147-CVGroup_UIEventLobby_Idle3-2 = "啊啊，沒問題的。\n我有好好擦防曬乳。"
10147-CVGroup_UIEventLobby_Idle3-3 = "果然，還是得穿自己喜歡的才行呢。"
10147-CVGroup_UIEventLobby_Idle4-1 = "……嗯。果然，老師的手很溫暖。"
10147-CVGroup_UIEventLobby_Idle4-2 = "握著的時候，就會覺得安心。"
