[translation]
10147-CVGroup_UITitle_Idle1-1 = "ブル～アーカイブ～"
10147-CVGroup_CharacterGet_Idle1-1 = "あら、呼んだかしら、先生？\nこれから幾千年の協力を約束して頂戴？"
10147-CVGroup_Cafe_Idle1-1 = "ここでは日焼け止めは……いらないのかしら。"
10147-CVGroup_Cafe_Idle2-1 = "ぐ～るぐ～る……ぐ～るぐ～る……。\n練習はこのくらいで良いかしら。"
10147-CVGroup_Cafe_Idle3-1 = "人口密度が上がっている……。\n危険度が上がってきたわね。"
10147-CVGroup_Cafe_Idle4-1 = "先生はどこにいるのかしら。\n背中を預け合いたいのに。"
10147-CVGroup_Cafe_Idle5-1 = "あれは……なんだか危険な香りがするわ。"
10147-CVGroup_WeaponGet_Idle1-1 = "あら、私のために用意してくれたの？\nありがとう、先生。\nでもお礼がないわね……私を好きにする権利、とかどうかしら？"
10147-CVGroup_UIEventLobby_Enter1-1 = "はあ……こんなことになるなんて……。"
10147-CVGroup_UIEventLobby_Enter1-2 = "大丈夫よ、先生。\nなんとかなるわ。"
10147-CVGroup_UIEventLobby_Enter2-1 = "まさか漂流するなんて……\nできることからやっていきましょう。"
10147-CVGroup_UIEventLobby_Enter3-1 = "ゆ、幽霊船って……本当かしら？\n先生、なんとかしなさい……！"
10147-CVGroup_UIEventLobby_Enter4-1 = "マコトちゃん、完全に役に入っちゃってるわね……。\nまあ、大丈夫だと信じているわ。"
10147-CVGroup_UIEventLobby_Enter5-1 = "これで全て解決……したのかしら？\n一件落着、ね。"
10147-CVGroup_UIEventLobby_Idle1-1 = "うん？なに？"
10147-CVGroup_UIEventLobby_Idle1-2 = "……あまり心配しないで大丈夫？"
10147-CVGroup_UIEventLobby_Idle1-3 = "ふふっ、先生。私を慰めてくれているのかしら？"
10147-CVGroup_UIEventLobby_Idle2-1 = "なんだか思っていたのとは違うけれど……。"
10147-CVGroup_UIEventLobby_Idle2-2 = "まぁ、海は元々危険な場所だものね。仕方がないわ。"
10147-CVGroup_UIEventLobby_Idle3-1 = "この水着？"
10147-CVGroup_UIEventLobby_Idle3-2 = "ああ、大丈夫よ。日焼け止めをちゃんと塗っているもの。"
10147-CVGroup_UIEventLobby_Idle3-3 = "やっぱり、自分が気に入っているものを着ないとね。"
10147-CVGroup_UIEventLobby_Idle4-1 = "……うん。やっぱり、先生の手は温かい。"
10147-CVGroup_UIEventLobby_Idle4-2 = "握っていると、安心するの。"
