[translation]
10147-CVGroup_UITitle_Idle1-1 = "Blue Archive!"
10147-CVGroup_CharacterGet_Idle1-1 = "Did you call me, Sensei? Now, now. Pledge your cooperation for the next thousand years."
10147-CVGroup_Cafe_Idle1-1 = "I wonder if I need sunscreen here..."
10147-CVGroup_Cafe_Idle2-1 = "Round and round, round and round... Okay, that's enough practice for now."
10147-CVGroup_Cafe_Idle3-1 = "This place is crowded with people. The risk factors are increasing..."
10147-CVGroup_Cafe_Idle4-1 = "I wonder where Sensei is. We promised to protect each other."
10147-CVGroup_Cafe_Idle5-1 = "That looks a bit dangerous..."
10147-CVGroup_WeaponGet_Idle1-1 = "Huh, you prepared this for me? What should I do? I have nothing to repay you with. I suppose, in that case... I could be your payment?"
10147-CVGroup_UIEventLobby_Enter1-1 = "*sigh* I can't believe this happened..."
10147-CVGroup_UIEventLobby_Enter1-2 = "But don't worry too much, Sensei. It'll work out somehow."
10147-CVGroup_UIEventLobby_Enter2-1 = "This is my first time being stranded... But let's do what we can."
10147-CVGroup_UIEventLobby_Enter3-1 = "A-A ghost ship... Seriously? Sensei, please do something...!"
10147-CVGroup_UIEventLobby_Enter4-1 = "It looks like Makoto got totally carried away... Well, I guess it's fine."
10147-CVGroup_UIEventLobby_Enter5-1 = "Anyway, since it all worked out... I guess everything's okay?"
10147-CVGroup_UIEventLobby_Idle1-1 = "Hm? What's that?"
10147-CVGroup_UIEventLobby_Idle1-2 = "...\"Don't worry too much\"?"
10147-CVGroup_UIEventLobby_Idle1-3 = "Fufu, Sensei. Are you trying to comfort me?"
10147-CVGroup_UIEventLobby_Idle2-1 = "This is a bit different from what I expected..."
10147-CVGroup_UIEventLobby_Idle2-2 = "The sea is inherently dangerous. So, it's understandable."
10147-CVGroup_UIEventLobby_Idle3-1 = "This swimsuit? "
10147-CVGroup_UIEventLobby_Idle3-2 = "Ah. Even if I'm exposing a lot of skin, I have sunscreen. So it's fine."
10147-CVGroup_UIEventLobby_Idle3-3 = "I can't miss out on a style that suits me, after all."
10147-CVGroup_UIEventLobby_Idle4-1 = "Mm. Sensei's hand truly is warm."
10147-CVGroup_UIEventLobby_Idle4-2 = "Holding it puts me at ease."
