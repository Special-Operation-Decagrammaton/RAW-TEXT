[translation]
10147-CVGroup_UITitle_Idle1-1 = "Blue~ Archive~"
10147-CVGroup_CharacterGet_Idle1-1 = "เรียกฉันเหรอ ครู? เอาละ เอาละ\nสัญญาสิว่าจะร่วมมือกันไปอีกพันปี"
10147-CVGroup_Cafe_Idle1-1 = "ตรงนี้ครีมกันแดดคงไม่จำเป็นมั้ง..."
10147-CVGroup_Cafe_Idle2-1 = "หมุนๆ วนๆ หมุนๆ วนๆ...\nดีละ ซ้อมไว้เท่านี้ก่อนแล้วกัน"
10147-CVGroup_Cafe_Idle3-1 = "ผู้มาใช้บริการหนาแน่นเลยนะ\nปัจจัยเสี่ยงกำลังเพิ่มขึ้น..."
10147-CVGroup_Cafe_Idle4-1 = "แล้วครู อยู่ที่ไหนกันนะ\nตกลงกันแล้วว่าจะช่วยปกป้องซึ่งกันและกันนี่นา"
10147-CVGroup_Cafe_Idle5-1 = "นั่นมันดูอันตรายนิดหน่อยนะ..."
10147-CVGroup_WeaponGet_Idle1-1 = "ตายจริง เตรียมไว้ให้ฉันเหรอ? ทำยังไงดีล่ะ\nตอนนี้ฉันไม่มีของอะไรตอบแทนเลยน่ะสิ\nถ้าเสียดายละก็... เอาฉันไปแทนมั้ย?"
10147-CVGroup_UIEventLobby_Enter1-1 = "เฮ้อ... ไม่คิดเลยว่าจะเกิดเรื่องแบบนี้..."
10147-CVGroup_UIEventLobby_Enter1-2 = "แต่ก็อย่าลนลานเกินไปนะ ครู\nเดี๋ยวก็หาทางได้เอง"
10147-CVGroup_UIEventLobby_Enter2-1 = "นี่เป็นครั้งแรกที่ลอยเคว้งกลางทะเลก็จริง...\nแต่ก่อนอื่น ต้องลองทำสิ่งที่ทำได้ก่อน"
10147-CVGroup_UIEventLobby_Enter3-1 = "ระ... เรือผีงั้นเหรอ... จริงเหรอ?\nครู ช่วยทำอะไรสักอย่างที...!"
10147-CVGroup_UIEventLobby_Enter4-1 = "มาโคโตะจังดูจะหลงใหลเข้าขั้นไปแล้วสินะ...\nเอาเถอะ คงไม่เป็นไรหรอก"
10147-CVGroup_UIEventLobby_Enter5-1 = "ยังไงทุกอย่างก็คลี่คลายแล้ว...\nแบบนี้ก็วางใจได้ละมั้ง?"
10147-CVGroup_UIEventLobby_Idle1-1 = "หืม? ทำไมเหรอ?"
10147-CVGroup_UIEventLobby_Idle1-2 = "อย่ากังวลมากเกินไปงั้นเหรอ...?"
10147-CVGroup_UIEventLobby_Idle1-3 = "ฮุฮุ นี่ครูช่วยปลอบฉันอยู่เหรอ?"
10147-CVGroup_UIEventLobby_Idle2-1 = "ถึงจะต่างจากที่คิดไว้นิดหน่อยก็เถอะ..."
10147-CVGroup_UIEventLobby_Idle2-2 = "แต่ทะเลก็เป็นที่ที่อันตรายอยู่แล้วนี่เนอะ\nก็เข้าใจได้อยู่"
10147-CVGroup_UIEventLobby_Idle3-1 = "ชุดว่ายน้ำนี่น่ะเหรอ?"
10147-CVGroup_UIEventLobby_Idle3-2 = "อ่า ถึงจะเปิดเผยผิวเยอะ\nแต่ก็ป้องกันด้วยครีมกันแดดได้ ก็เลยไม่เป็นไรน่ะ"
10147-CVGroup_UIEventLobby_Idle3-3 = "ก็สไตล์ที่เข้ากับตัวเองน่ะ จะให้ยอมแพ้ได้ยังไงกัน"
10147-CVGroup_UIEventLobby_Idle4-1 = "อืม มือของครู อบอุ่นอย่างที่คิดจริงๆ นะ"
10147-CVGroup_UIEventLobby_Idle4-2 = "พอได้จับไว้ก็รู้สึกสบายใจขึ้นมาเลย"
