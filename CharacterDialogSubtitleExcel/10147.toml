[translation]
10147-CVGroup_UITitle_Idle1-1 = "블루~ 아카이브~"
10147-CVGroup_CharacterGet_Idle1-1 = "불렀어, 선생? 자아, 자아.\n천 년의 협력을 약속해달라고."
10147-CVGroup_Cafe_Idle1-1 = "여기는 선크림,\n필요 없으려나……."
10147-CVGroup_Cafe_Idle2-1 = "빙글빙글, 빙글빙글……\n좋아, 이 정도로 연습해 둘까."
10147-CVGroup_Cafe_Idle3-1 = "이용객의 밀집도가 높네.\n위험 요소가 늘어나고 있어……."
10147-CVGroup_Cafe_Idle4-1 = "선생은 어디 있을까.\n서로 보호해 주기로 했는데."
10147-CVGroup_Cafe_Idle5-1 = "저건 좀 위험해\n보이는데……."
10147-CVGroup_WeaponGet_Idle1-1 = "어머, 나를 위해 준비한 거야?\n어쩐다. 지금 답례할 만한 게 없는데.\n뭐, 아쉽다면…… 나라도?"
10147-CVGroup_UIEventLobby_Enter1-1 = "하아…… 이런 일이 생기다니……."
10147-CVGroup_UIEventLobby_Enter1-2 = "그래도 너무 당황하지 마, 선생.\n어떻게든 될 테니까."
10147-CVGroup_UIEventLobby_Enter2-1 = "표류는 처음이지만……\n일단 할 수 있는\n일들을 해봐야지."
10147-CVGroup_UIEventLobby_Enter3-1 = "유, 유령선이라니…… 정말이야?\n선생, 어떻게 좀 해줘……!"
10147-CVGroup_UIEventLobby_Enter4-1 = "마코토 쨩,\n완전히 심취한 모양이야……\n뭐, 괜찮겠지."
10147-CVGroup_UIEventLobby_Enter5-1 = "아무튼, 모든 게\n해결되었으니……\n이걸로 안심이랄까?"
10147-CVGroup_UIEventLobby_Idle1-1 = "응? 왜?"
10147-CVGroup_UIEventLobby_Idle1-2 = "……너무 걱정하지 말라고?"
10147-CVGroup_UIEventLobby_Idle1-3 = "후후, 선생. 나를 위로해 주는 거야?"
10147-CVGroup_UIEventLobby_Idle2-1 = "뭔가 생각했던 거랑은 좀 다르긴 하지만……"
10147-CVGroup_UIEventLobby_Idle2-2 = "바다는 원래 위험한 곳이니까.\n납득할 수 있어."
10147-CVGroup_UIEventLobby_Idle3-1 = "이 수영복? "
10147-CVGroup_UIEventLobby_Idle3-2 = "아아. 노출 범위가 많아도 선크림으로 방어할 수 있으니까 괜찮아."
10147-CVGroup_UIEventLobby_Idle3-3 = "어울리는 스타일은 포기할 수 없으니까 말이야."
10147-CVGroup_UIEventLobby_Idle4-1 = "으응. 선생의 손은\n역시 따뜻하네."
10147-CVGroup_UIEventLobby_Idle4-2 = "잡고 있으면 안심이 돼."
