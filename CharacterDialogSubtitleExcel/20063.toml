[translation]
20063-CVGroup_UITitle_Idle1-1 = "블루 아카이브."
20063-CVGroup_CharacterGet_Idle1-1 = "시라스 아즈사야.\n보충수업부 팀에 합류했어.\n표적, 찾으면 말 해줘."
20063-CVGroup_Cafe_Idle1-1 = "신기한 게 잔뜩 있어,\n매번 새로운 걸\n마주하게 돼."
20063-CVGroup_Cafe_Idle2-1 = "여기는 다양한\n사람들이 모여서\n즐거워."
20063-CVGroup_Cafe_Idle3-1 = "왠지, 계속\n시선을 받는\n기분인데……."
20063-CVGroup_Cafe_Idle4-1 = "우산, 어디에\n기대두고 싶은데."
20063-CVGroup_Cafe_Idle5-1 = "잠시, 휴식을\n취할 수\n있는 곳이……."
20063-CVGroup_WeaponGet_Idle1-1 = "항상 고마워 선생님.\n나는, 선생님의 힘이 되고싶어.\n언젠가…… 선생님의 결의를,\n나도 짊어질 수 있게 해줘."
20063-CVGroup_UIEventLobby_Enter1-1 = "게헨나컵에\n어서와, 선생님."
20063-CVGroup_UIEventLobby_Enter2-1 = "1차 목표는 안전.\n2차 목표는 소중한\n과정 거치기야."
20063-CVGroup_UIEventLobby_Enter3-1 = "나도, 모두를\n본받아야겠어."
20063-CVGroup_UIEventLobby_Enter4-1 = "휘발유와 화약 냄새가\n짙어서……\n두근두근해."
20063-CVGroup_UIEventLobby_Enter5-1 = "최선을 다한 모두가\n원래의 일상으로 돌아가."
20063-CVGroup_UIEventLobby_Enter5-2 = "이런거,\n좋아했던 것 같아."
20063-CVGroup_UIEventLobby_Idle1-1 = "혹시 더워?\n같이 우산 쓸래?"
20063-CVGroup_UIEventLobby_Idle2-1 = "쓰다듬는거, 좋아.\n그렇지만 지금은\n사람이 많으니까\n나중에……."
20063-CVGroup_UIEventLobby_Idle3-1 = "다같이 많은 경험을\n하면 좋겠어."
20063-CVGroup_UIEventLobby_Idle4-1 = "친구, 많이\n만들 수 있으려나."
20063-CVGroup_UIEventMission_Enter1-1 = "임무 개시다."
20063-CVGroup_UIEventMission_Enter2-1 = "최우선 순위부터,\n먼저 정리해보는거야."
20063-CVGroup_UIEventMission_Idle1-1 = "무슨 일이야, 선생님.\n혹시, 같이 사진 찍고 싶은거야?"
20063-CVGroup_UIEventMission_Idle1-2 = "이것도 미션이야?\n목록에 없는 것 같은데."
20063-CVGroup_UIEventMission_Idle2-1 = "목표와 지시가 확실한 것,\n아주 좋아해."
20063-CVGroup_UIEventMission_Buy1-1 = "당연한 보상이야.\n선생님이 노력했으니까."
20063-CVGroup_UIEventMission_Buy2-1 = "그렇지, 마음에 드는 결과야."
20063-CVGroup_UIEventMission_Interaction1-1 = "목표 완료.\n퇴출해도 될 만큼 만족했어."
20063-CVGroup_UIEventMiniGameMission_Enter1-1 = "실전같은 훈련,\n항상 환영이야."
20063-CVGroup_UIEventMiniGameMission_Enter2-1 = "제압과 우승 말고도\n여러 목표가 있구나. 신기해."
20063-CVGroup_UIEventMiniGameMission_Idle1-1 = "좋은 상대들이 많아서,\n기대되는걸."
20063-CVGroup_UIEventMiniGameMission_Idle2-1 = "최근, 근육이 조금 줄은 것 같아.\n좀 더 훈련해야겠어."
20063-CVGroup_UIEventMiniGameMission_Idle3-1 = "응? 불렀어?\n용건이 있다면,\n언제건 무전으로 불러줘."
20063-CVGroup_UIEventMiniGameMission_Buy1-1 = "기쁜걸, 내가 도움이 되었어."
20063-CVGroup_UIEventMiniGameMission_Buy2-1 = "어때, 선생님?\n내가 조금은 빚을 갚게 된걸까?"
20063-CVGroup_UIEventMiniGameMission_Interaction1-1 = "응, 완전작전이네."
