[translation]
20063-CVGroup_UITitle_Idle1-1 = "ブルーアーカイブ。"
20063-CVGroup_CharacterGet_Idle1-1 = "白洲アズサ、補習授業部チームに合流した。\nターゲットを見つけたら教えてほしい。"
20063-CVGroup_Cafe_Idle1-1 = "不思議なものがたくさんあるな……\n来るたびに新鮮な気持ちになる。"
20063-CVGroup_Cafe_Idle2-1 = "ここはいろんな人が集まっていて楽しい。"
20063-CVGroup_Cafe_Idle3-1 = "なんだかじっと見られているような……。"
20063-CVGroup_Cafe_Idle4-1 = "パラソル、どこかに置きたいな。"
20063-CVGroup_Cafe_Idle5-1 = "どこか休憩できる場所は……。"
20063-CVGroup_WeaponGet_Idle1-1 = "いつもありがとう、先生。\n私は、先生の力になりたい。\nいつか……先生の決意を、私にも背負わせてほしい。"
20063-CVGroup_UIEventLobby_Enter1-1 = "ゲヘナカップへようこそ、先生。"
20063-CVGroup_UIEventLobby_Enter2-1 = "大切な思い出を作りたい。\nそのためにも、まずは安全第一だ。"
20063-CVGroup_UIEventLobby_Enter3-1 = "私も、みんなを見習わないと。"
20063-CVGroup_UIEventLobby_Enter4-1 = "ガソリンと火薬のにおいが充満してて……わくわくする。"
20063-CVGroup_UIEventLobby_Enter5-1 = "みんなが最善を出し合って、日常に戻っていく。"
20063-CVGroup_UIEventLobby_Enter5-2 = "こういうのが好きなんだ。"
20063-CVGroup_UIEventLobby_Idle1-1 = "暑いのか？\nパラソル、一緒に使う？"
20063-CVGroup_UIEventLobby_Idle2-1 = "撫でられるのは好きだけど……今は人が多いから、また後で……。"
20063-CVGroup_UIEventLobby_Idle3-1 = "みんなと色んな経験ができるといいな。"
20063-CVGroup_UIEventLobby_Idle4-1 = "友達、たくさん作れるだろうか。"
20063-CVGroup_UIEventMission_Enter1-1 = "任務開始。"
20063-CVGroup_UIEventMission_Enter2-1 = "最優先事項から片づけよう。"
20063-CVGroup_UIEventMission_Idle1-1 = "どうしたんだ、先生？\nもしかして、一緒に写真を撮りたいのか？"
20063-CVGroup_UIEventMission_Idle1-2 = "ミッションのリストにはなかったと思うけど。"
20063-CVGroup_UIEventMission_Idle2-1 = "先生は指示と目標が明確だから、とてもやりやすい。"
20063-CVGroup_UIEventMission_Buy1-1 = "当然の報酬だ。\n先生の努力の賜物だな。"
20063-CVGroup_UIEventMission_Buy2-1 = "うん、満足いく結果だ。"
20063-CVGroup_UIEventMission_Interaction1-1 = "目標達成！\n今日はもう十分だ。"
20063-CVGroup_UIEventMiniGameMission_Enter1-1 = "実践形式の訓練はいつでも歓迎だ。"
20063-CVGroup_UIEventMiniGameMission_Enter2-1 = "制圧と優勝以外にも、目標が山のようにあるんだな。"
20063-CVGroup_UIEventMiniGameMission_Idle1-1 = "相手にとって不足なし。楽しみだ。"
20063-CVGroup_UIEventMiniGameMission_Idle2-1 = "最近、少し筋肉が落ちた気がする。\nもっと訓練しないと。"
20063-CVGroup_UIEventMiniGameMission_Idle3-1 = "ん、なんだ？\n用事があるなら、いつでも無線で呼べばいい。"
20063-CVGroup_UIEventMiniGameMission_Buy1-1 = "私も力になれて嬉しい。"
20063-CVGroup_UIEventMiniGameMission_Buy2-1 = "どうだろう？少しは先生に返せているか？"
20063-CVGroup_UIEventMiniGameMission_Interaction1-1 = "うん、完璧な作戦だった。"
