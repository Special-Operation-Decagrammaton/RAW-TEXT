[translation]
20056-CVGroup_UITitle_Idle1-1 = "Blue~~ Archive!"
20056-CVGroup_CharacterGet_Idle1-1 = "อุวะฮะฮ่า!\nในที่สุดก็มาหาโคยูกิแล้วสินะคะ! คุณครู!"
20056-CVGroup_Cafe_Idle1-1 = "(ไหนดูซิ\nมีตรงไหนที่\nซ่อนได้บ้าง...)"
20056-CVGroup_Cafe_Idle2-1 = "(ที่นี่...\nใช้บัตรของเซมิน่า\nจ่ายเงินได้มั้ยนะ?)"
20056-CVGroup_Cafe_Idle3-1 = "คงจะไม่\nไล่ตามมาถึงที่นี่\nหรอกใช่มั้ย...?"
20056-CVGroup_Cafe_Idle4-1 = "คุณครู คุณครู!\nอยู่ไหนเหรอคะ?"
20056-CVGroup_Cafe_Idle5-1 = "กาแฟวันนี้...\nสุ่มเมล็ดงั้นเหรอ?!\nฮือ... ฉันไม่ชอบ\nการสุ่มเลย..."
20056-CVGroup_WeaponGet_Idle1-1 = "แน่นอนว่าโชคดีที่สุดของฉัน\nก็คือคุณครูยังไงล่ะคะ!\nเพราะงั้น! ฉันจะทำให้ดีที่สุดค่ะ!\nขอบคุณค่ะ!"
20056-CVGroup_UIEventLobby_Enter1-1 = "คะ... ใครน่ะ?!"
20056-CVGroup_UIEventLobby_Enter1-2 = "อ่า...\nคุณครูเองเหรอคะ!!"
20056-CVGroup_UIEventLobby_Enter2-1 = "มาแล้วสินะคะ คุณครู!"
20056-CVGroup_UIEventLobby_Enter2-2 = "ฉันปูพื้นไว้ให้แล้ว"
20056-CVGroup_UIEventLobby_Enter2-3 = "มานั่งก่อนสิคะ!"
20056-CVGroup_UIEventLobby_Enter3-1 = "มาแล้วสินะคะ!"
20056-CVGroup_UIEventLobby_Enter3-2 = "คงทนไม่ไหวสินะคะ?\nใช่มั้ยล่ะคะ?!"
20056-CVGroup_UIEventLobby_Enter4-1 = "ฮุฮุ\nเชื่อมือฉันสิคะ"
20056-CVGroup_UIEventLobby_Enter4-2 = "คุโรซากิ โคยูกิคนนี้น่ะ\nเชี่ยวชาญเรื่อง\nการหลบหนีนะคะ!"
20056-CVGroup_UIEventLobby_Enter5-1 = "เหมือนจะมีเรื่องอะไร\nเยอะเลยแฮะ..."
20056-CVGroup_UIEventLobby_Enter5-2 = "แต่เอาเป็นว่า"
20056-CVGroup_UIEventLobby_Enter5-3 = "มาสนุกกันทั้งคืนก่อนดีกว่า...!"
20056-CVGroup_UIEventLobby_Enter5-4 = "นะ... คะ..."
20056-CVGroup_UIEventLobby_Enter5-5 = "เฮือก..."
20056-CVGroup_UIEventLobby_Idle1-1 = "สัมผัสดีใช่มั้ยล่ะคะ?\nชุดนี้น่ะ\nนุ่มมากเลยนะคะ!"
20056-CVGroup_UIEventLobby_Idle2-1 = "มาช่วยฉันแล้วสินะคะ\nคุณครู!"
20056-CVGroup_UIEventLobby_Idle2-2 = "เอ๋ คุณครูก็\nถูกจับงั้นเหรอคะ?!!"
20056-CVGroup_UIEventLobby_Idle3-1 = "บอร์ดเกมอันนี้มันแปลกๆ นะคะ!"
20056-CVGroup_UIEventLobby_Idle3-2 = "พอถึงตาฉันทีไร\nมันก็ระเบิดทุกทีเลยค่ะ!!"
20056-CVGroup_UIEventLobby_Idle4-1 = "ห้องสำนึกผิด\nวุ่นวายขนาดนี้เลย..."
20056-CVGroup_UIEventLobby_Idle4-2 = "เอาเถอะ แบบนี้ก็คง\nไม่แย่เท่าไร... สินะคะ?"
