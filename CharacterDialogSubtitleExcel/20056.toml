[translation]
20056-CVGroup_UITitle_Idle1-1 = "蔚藍檔案！"
20056-CVGroup_CharacterGet_Idle1-1 = "尼・哈・哈・哈～！\n終於來到這裡了呢，老師！\n來到我黑崎小雪的身邊！"
20056-CVGroup_Cafe_Idle1-1 = "（能躲藏的地方是……這裡！）"
20056-CVGroup_Cafe_Idle2-1 = "（這裡……研討會的卡能用嗎？）"
20056-CVGroup_Cafe_Idle3-1 = "總不會追到這裡來……對吧？"
20056-CVGroup_Cafe_Idle4-1 = "老師在哪裡呀～？"
20056-CVGroup_Cafe_Idle5-1 = "今天的咖啡是……隨機混合！？\n嗚咿……我不太擅長這種的說。"
20056-CVGroup_WeaponGet_Idle1-1 = "我想，最大的幸運肯定是能遇見老師吧！\n所以，那個……我會全力以赴的！\n請多指教囉！"
20056-CVGroup_UIEventLobby_Enter1-1 = "是，是誰！？"
20056-CVGroup_UIEventLobby_Enter1-2 = "……啊，原來是老師啊！！"
20056-CVGroup_UIEventLobby_Enter2-1 = "你來啦，老師！"
20056-CVGroup_UIEventLobby_Enter2-2 = "準備都已經完成了，"
20056-CVGroup_UIEventLobby_Enter2-3 = "總之請先坐下吧！"
20056-CVGroup_UIEventLobby_Enter3-1 = "你來了呢！"
20056-CVGroup_UIEventLobby_Enter3-2 = "果然還是忍不住了吧？\n對吧！？"
20056-CVGroup_UIEventLobby_Enter4-1 = "呵呵，請交給我吧。"
20056-CVGroup_UIEventLobby_Enter4-2 = "逃脫可是我的拿手好戲呢！"
20056-CVGroup_UIEventLobby_Enter5-1 = "總覺得發生了很多事……"
20056-CVGroup_UIEventLobby_Enter5-2 = "嗯，總之今晚就"
20056-CVGroup_UIEventLobby_Enter5-3 = "玩到天亮吧……！"
20056-CVGroup_UIEventLobby_Enter5-4 = "本來是想……這麼說的……"
20056-CVGroup_UIEventLobby_Enter5-5 = "……尼哈。"
20056-CVGroup_UIEventLobby_Idle1-1 = "怎麼樣啊？\n這個觸感……軟綿綿的對吧？"
20056-CVGroup_UIEventLobby_Idle2-1 = "你來救我了啊，老師！"
20056-CVGroup_UIEventLobby_Idle2-2 = "咦，老師也被抓住了嗎！？"
20056-CVGroup_UIEventLobby_Idle3-1 = "這個桌遊很奇怪！"
20056-CVGroup_UIEventLobby_Idle3-2 = "每次輪到我的時候就會爆炸！！"
20056-CVGroup_UIEventLobby_Idle4-1 = "嗚嗚……\n人擠人的反省室……"
20056-CVGroup_UIEventLobby_Idle4-2 = "算了，這樣好像\n也不差吧……？"
