[translation]
10148-CVGroup_UITitle_Idle1-1 = "블루, 아카이브."
10148-CVGroup_CharacterGet_Idle1-1 = "피서까지 와서 무슨 고생을…….\n뭐, 이렇게 된 이상, 서로 살길을 찾아보죠.\n잘 부탁드려요."
10148-CVGroup_Cafe_Idle1-1 = "이래서 눈에\n띄는 차림은\n싫었는데……."
10148-CVGroup_Cafe_Idle2-1 = "가급적\n게헨나 학생이\n적은 곳으로……."
10148-CVGroup_Cafe_Idle3-1 = "만마전 사람들도\n이런 건 좀 배웠으면\n좋겠는데요."
10148-CVGroup_Cafe_Idle4-1 = "오, 제법 아늑해\n보이는 장소."
10148-CVGroup_Cafe_Idle5-1 = "여기 전부,\n선생님이\n꾸민 건가요?"
10148-CVGroup_WeaponGet_Idle1-1 = "누군가 잘해줄 때는, 보통은 꿍꿍이가 있잖아요?\n조금 더 잘하라든지, 노력하라든지.\n그런 거, 저는 귀찮거든요.\n그래도…… 선생님의 기대는,\n그렇게 싫지는 않아요."
10148-CVGroup_UIEventLobby_Enter1-1 = "진짜, 바보 같아."
10148-CVGroup_UIEventLobby_Enter1-2 = "어떻게 이런 일이\n일어날 수가 있죠? 네?"
10148-CVGroup_UIEventLobby_Enter2-1 = "왜 다들 상황의 심각성을\n모르는 거죠?"
10148-CVGroup_UIEventLobby_Enter2-2 = "그나마 선생님이\n같이 계셔서 다행이네요."
10148-CVGroup_UIEventLobby_Enter3-1 = "왜 나는 아직도\n만마전에……."
10148-CVGroup_UIEventLobby_Enter3-2 = "아, 선생님.\n아무것도 아니에요."
10148-CVGroup_UIEventLobby_Enter4-1 = "아아, 진짜~!"
10148-CVGroup_UIEventLobby_Enter4-2 = "왜 부끄러움은\n저 혼자만의 몫인 거죠?!"
10148-CVGroup_UIEventLobby_Enter4-3 = "다들 도대체 몇 살인데\n해적 놀이 같은 걸……."
10148-CVGroup_UIEventLobby_Enter5-1 = "……마무리되었네요."
10148-CVGroup_UIEventLobby_Enter5-2 = "아, 지금\n가까이 오지 마세요.\n말 걸지 마세요."
10148-CVGroup_UIEventLobby_Idle1-1 = "1학년 때, 만마전은\n당연히 다들 우등생이라\n생각했어요."
10148-CVGroup_UIEventLobby_Idle1-2 = "……그때의 저에게\n꿀밤 한 대\n먹이고 싶네요."
10148-CVGroup_UIEventLobby_Idle2-1 = "선생님."
10148-CVGroup_UIEventLobby_Idle2-2 = "다같이 힘내자,\n같은 소리 하려고 했죠?"
10148-CVGroup_UIEventLobby_Idle2-3 = "얼굴에 다 보이거든요."
10148-CVGroup_UIEventLobby_Idle3-1 = "마코토 선배의 장점이요?\n그걸 지금 물어본다고요?\n진심으로요?"
10148-CVGroup_UIEventLobby_Idle3-2 = "어, 글쎄요…………."
10148-CVGroup_UIEventLobby_Idle3-3 = "……입만 다물고 있으면,\n얼굴은 괜찮은 편이죠."
10148-CVGroup_UIEventLobby_Idle4-1 = "새삼스럽지만,\n대화가 통하는 상대의\n소중함을 체감하는\n시간이네요."
10148-CVGroup_UIEventLobby_Idle4-2 = "돌아가면, 치아키한테\n아주 조금은 더\n잘해줘야겠어요."
10148-CVGroup_UIEventShop_Enter1-1 = "하아…… 귀찮다."
10148-CVGroup_UIEventShop_Enter1-2 = "죄송한데,\n혹시 좀 도와주시겠어요?"
10148-CVGroup_UIEventShop_Enter2-1 = "일단, 아무거나 갖다 주시면\n제가 가공해 볼게요."
10148-CVGroup_UIEventShop_Enter2-2 = "……왜 만마전에는\n이걸 하는 사람이\n저밖에 없죠?"
10148-CVGroup_UIEventShop_Enter3-1 = "이제 이 고물들이랑도\n작별이네요."
10148-CVGroup_UIEventShop_Enter3-2 = "아, 남은 건\n전부 가져가셔도 돼요.\n어디 쓰실지 모르겠지만."
10148-CVGroup_UIEventShop_Idle1-1 = "……일부로인가요?"
10148-CVGroup_UIEventShop_Idle1-2 = "아니, 아무것도 아니에요."
10148-CVGroup_UIEventShop_Idle2-1 = "선생님, 그……."
10148-CVGroup_UIEventShop_Idle2-2 = "몸, 닿고 있거든요?"
10148-CVGroup_UIEventShop_Buy1-1 = "아, 감사합니다.\n덕분에 귀찮은 일이\n좀 줄었네요."
10148-CVGroup_UIEventShop_Buy2-1 = "오…… 이걸 이렇게."
10148-CVGroup_UIEventShop_Buy3-1 = "그런 게 필요하신가요?\n흐응……."
10148-CVGroup_UIEventShop_Buy4-1 = "아, 마침 필요했는데,\n감사합니다."
