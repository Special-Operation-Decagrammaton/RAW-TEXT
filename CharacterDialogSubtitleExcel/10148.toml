[translation]
10148-CVGroup_UITitle_Idle1-1 = "Blue Archive"
10148-CVGroup_CharacterGet_Idle1-1 = "มาพักร้อนแล้วต้องลำบากอะไรแบบนี้...\nแต่ในเมื่อเป็นแบบนี้แล้ว ก็ต่างคนต่างหาทางรอดกันเถอะค่ะ\nฝากตัวด้วยนะคะ"
10148-CVGroup_Cafe_Idle1-1 = "เพราะแบบนี้แหละ ฉันถึงไม่ชอบชุดที่เด่นสะดุดตา..."
10148-CVGroup_Cafe_Idle2-1 = "ขอไปที่ที่มีนักเรียนเกเฮนน่าน้อยที่สุด..."
10148-CVGroup_Cafe_Idle3-1 = "คนของแพนเดโมเนียม โซไซตี้\nน่าจะเรียนรู้เรื่องแบบนี้ไว้บ้างนะคะ"
10148-CVGroup_Cafe_Idle4-1 = "โอ้ เป็นที่ที่น่าอยู่ไม่ใช่เล่นเลยนะ"
10148-CVGroup_Cafe_Idle5-1 = "ทั้งหมดนี่ คุณครูตกแต่งเองเลยเหรอคะ?"
10148-CVGroup_WeaponGet_Idle1-1 = "เวลามีใครทำดีกับเรา ปกติมักมีอะไรแอบแฝงใช่มั้ยคะ?\nเช่นให้ทำให้ดีกว่านี้หรือให้พยายามให้มากกว่านี้\nเรื่องแบบนั้นฉันรำคาญน่ะค่ะ แต่ว่า... ถ้าเป็นความคาดหวังของคุณครู\nฉันก็ไม่ได้ไม่ชอบขนาดนั้นค่ะ"
10148-CVGroup_UIEventLobby_Enter1-1 = "ให้ตายสิ ฉันเหมือนคนโง่เลย"
10148-CVGroup_UIEventLobby_Enter1-2 = "เรื่องแบบนี้เกิดขึ้นได้ยังไงกันคะ? หืม?"
10148-CVGroup_UIEventLobby_Enter2-1 = "ทำไมทุกคนถึงไม่เข้าใจ\nความร้ายแรงของสถานการณ์กันเลยคะ?"
10148-CVGroup_UIEventLobby_Enter2-2 = "อย่างน้อยก็ยังดีที่คุณครูอยู่ด้วยกันค่ะ"
10148-CVGroup_UIEventLobby_Enter3-1 = "ทำไมฉันยังต้องอยู่ที่แพนเดโมเนียม โซไซตี้..."
10148-CVGroup_UIEventLobby_Enter3-2 = "อ๊ะ คุณครู ไม่มีอะไรค่ะ"
10148-CVGroup_UIEventLobby_Enter4-1 = "อ่า ให้ตายสิ~!"
10148-CVGroup_UIEventLobby_Enter4-2 = "ทำไมฉันถึงเขินอายอยู่คนเดียวล่ะคะ?!"
10148-CVGroup_UIEventLobby_Enter4-3 = "ทุกคนอายุปาเข้าไปเท่าไรแล้ว\nยังมาเล่นเป็นโจรสลัดอะไรกันอีก..."
10148-CVGroup_UIEventLobby_Enter5-1 = "จบลงจนได้สินะคะ..."
10148-CVGroup_UIEventLobby_Enter5-2 = "อ๊ะ ตอนนี้อย่าเพิ่งเข้ามาใกล้นะคะ อย่าพูดกับฉันด้วยค่ะ"
10148-CVGroup_UIEventLobby_Idle1-1 = "ตอนปี 1 ฉันคิดว่าทุกคนในแพนเดโมเนียม โซไซตี้\nเป็นนักเรียนดีเด่นกันหมดค่ะ"
10148-CVGroup_UIEventLobby_Idle1-2 = "อยากเคาะหน้าผากตัวฉันในตอนนั้นสักทีจริงๆ ค่ะ..."
10148-CVGroup_UIEventLobby_Idle2-1 = "คุณครู"
10148-CVGroup_UIEventLobby_Idle2-2 = "กำลังจะพูดว่ามาพยายามด้วยกันเถอะ ใช่มั้ยคะ?"
10148-CVGroup_UIEventLobby_Idle2-3 = "คำนั้นเขียนอยู่บนหน้าหมดแล้วค่ะ"
10148-CVGroup_UIEventLobby_Idle3-1 = "ข้อดีของรุ่นพี่มาโคโตะเหรอคะ?\nเลือกถามตอนนี้จริงๆ เหรอคะ? เอาจริงเหรอคะ?"
10148-CVGroup_UIEventLobby_Idle3-2 = "เอ่อ นั่นสินะคะ..."
10148-CVGroup_UIEventLobby_Idle3-3 = "ถ้าปิดปากเอาไว้... หน้าตาก็จัดว่าโอเคอยู่ค่ะ"
10148-CVGroup_UIEventLobby_Idle4-1 = "พูดไปก็เหมือนพูดซ้ำ แต่นี่ก็เป็นช่วงเวลาที่ได้สัมผัสถึง\nคุณค่าของคู่สนทนาที่คุยกันรู้เรื่องจริงๆ ค่ะ"
10148-CVGroup_UIEventLobby_Idle4-2 = "ถ้ากลับไปแล้ว ฉันคงต้องทำดีกับจิอากิ\nให้มากกว่านี้หน่อยแล้วค่ะ"
10148-CVGroup_UIEventShop_Enter1-1 = "เฮ้อ... น่ารำคาญจัง"
10148-CVGroup_UIEventShop_Enter1-2 = "ขอโทษนะคะ พอจะช่วยหน่อยได้มั้ยคะ?"
10148-CVGroup_UIEventShop_Enter2-1 = "เอาเป็นว่า ถ้าเอาอะไรมาให้ ฉันจะลองแปรรูปดูค่ะ"
10148-CVGroup_UIEventShop_Enter2-2 = "ทำไมในแพนเดโมเนียม โซไซตี้ ถึงมีแค่ฉันที่ทำเรื่องนี้กันคะ...?"
10148-CVGroup_UIEventShop_Enter3-1 = "ในที่สุดก็ได้บอกลาของเก่าพวกนี้แล้วค่ะ"
10148-CVGroup_UIEventShop_Enter3-2 = "อ้อ จะเอาส่วนที่เหลือไปทั้งหมดก็ได้นะคะ\nถึงจะไม่รู้ว่าจะเอาไปทำอะไรก็เถอะ"
10148-CVGroup_UIEventShop_Idle1-1 = "ตั้งใจทำหรือเปล่าคะ...?"
10148-CVGroup_UIEventShop_Idle1-2 = "เปล่าหรอก ไม่มีอะไรค่ะ"
10148-CVGroup_UIEventShop_Idle2-1 = "คุณครู คือว่า..."
10148-CVGroup_UIEventShop_Idle2-2 = "ตัว... โดนกันอยู่นะคะ?"
10148-CVGroup_UIEventShop_Buy1-1 = "อ่า ขอบคุณนะคะ เพราะได้คุณครูช่วยไว้\nงานน่ารำคาญเลยลดลงไปหน่อยค่ะ"
10148-CVGroup_UIEventShop_Buy2-1 = "โอ้... เอาแบบนี้เหรอ"
10148-CVGroup_UIEventShop_Buy3-1 = "ต้องการของแบบนั้นเหรอคะ? ฮืม..."
10148-CVGroup_UIEventShop_Buy4-1 = "อ๊ะ กำลังอยากได้อยู่พอดี ขอบคุณค่ะ"
