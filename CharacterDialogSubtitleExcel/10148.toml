[translation]
10148-CVGroup_UITitle_Idle1-1 = "蔚藍，檔案。"
10148-CVGroup_CharacterGet_Idle1-1 = "為什麼都來渡假了還得做這種事……\n既然都變成這樣了，就一起加油吧。"
10148-CVGroup_Cafe_Idle1-1 = "就是因為這樣，我才討厭引人注目的打扮……"
10148-CVGroup_Cafe_Idle2-1 = "盡可能找個格黑娜學生少一點的地方……"
10148-CVGroup_Cafe_Idle3-1 = "要是真琴前輩他們也能學著點就好了。"
10148-CVGroup_Cafe_Idle4-1 = "感覺還挺舒服的呢。"
10148-CVGroup_Cafe_Idle5-1 = "這些全都是老師準備的嗎？"
10148-CVGroup_WeaponGet_Idle1-1 = "「再加油一點」、「要努力」之類的。\n這些事情，基本上都很麻煩對吧。\n不過，如果那是老師對我的期待……感覺也不壞呢。"
10148-CVGroup_UIEventLobby_Enter1-1 = "真的是受不了……"
10148-CVGroup_UIEventLobby_Enter1-2 = "到底要怎麼做才會變成這樣？"
10148-CVGroup_UIEventLobby_Enter2-1 = "為什麼沒有人明白事情的嚴重性呢？"
10148-CVGroup_UIEventLobby_Enter2-2 = "唉……幸好有老師在，真是幫了大忙。"
10148-CVGroup_UIEventLobby_Enter3-1 = "為什麼……我怎麼會還待在萬魔殿……"
10148-CVGroup_UIEventLobby_Enter3-2 = "啊，老師。不，沒什麼事。請別放在心上。"
10148-CVGroup_UIEventLobby_Enter4-1 = "真是的，到底是怎樣啊！"
10148-CVGroup_UIEventLobby_Enter4-2 = "為什麼只有我要感到這麼羞恥啊！？"
10148-CVGroup_UIEventLobby_Enter4-3 = "說什麼海盜遊戲……\n請考慮一下自己的年紀好不好……"
10148-CVGroup_UIEventLobby_Enter5-1 = "……總算收拾好了呢。"
10148-CVGroup_UIEventLobby_Enter5-2 = "現在請讓我靜一靜。"
10148-CVGroup_UIEventLobby_Idle1-1 = "萬魔殿是優等生的集合體──\n一年級的時候，我是這麼認為的。"
10148-CVGroup_UIEventLobby_Idle1-2 = "……真想讓當時自己的眼睛看清楚一點。"
10148-CVGroup_UIEventLobby_Idle2-1 = "老師。"
10148-CVGroup_UIEventLobby_Idle2-2 = "你是不是想說「大家一起加油」之類的話？"
10148-CVGroup_UIEventLobby_Idle2-3 = "都寫在你臉上囉。"
10148-CVGroup_UIEventLobby_Idle3-1 = "真琴前輩的優點？\n你是認真在問嗎？"
10148-CVGroup_UIEventLobby_Idle3-2 = "唔～～～～～"
10148-CVGroup_UIEventLobby_Idle3-3 = "長相，還算不錯。\n……如果閉上嘴的話。"
10148-CVGroup_UIEventLobby_Idle4-1 = "沒想到話能說得通居然這麼令人感激……"
10148-CVGroup_UIEventLobby_Idle4-2 = "我看還是對千秋稍微溫柔一點好了。"
10148-CVGroup_UIEventShop_Enter1-1 = "唉……好想翹掉……"
10148-CVGroup_UIEventShop_Enter1-2 = "方便的話，可以幫我一下嗎？"
10148-CVGroup_UIEventShop_Enter2-1 = "總之，只要幫忙拿過來，我會想辦法處理的。"
10148-CVGroup_UIEventShop_Enter2-2 = "話說回來，為什麼除了我以外就沒人會做呢……"
10148-CVGroup_UIEventShop_Enter3-1 = "也該和這些古董說再見了呢。"
10148-CVGroup_UIEventShop_Enter3-2 = "剩下的全部請你帶走吧。\n雖然我不知道你要用在哪。"
10148-CVGroup_UIEventShop_Idle1-1 = "……你是故意的嗎？"
10148-CVGroup_UIEventShop_Idle1-2 = "不，沒什麼。"
10148-CVGroup_UIEventShop_Idle2-1 = "那個，老師……"
10148-CVGroup_UIEventShop_Idle2-2 = "碰到我了……"
10148-CVGroup_UIEventShop_Buy1-1 = "謝謝。多虧有你，麻煩事又少了一件。"
10148-CVGroup_UIEventShop_Buy2-1 = "啊啊……這個是這樣用的。"
10148-CVGroup_UIEventShop_Buy3-1 = "你需要那種東西嗎？嘿……"
10148-CVGroup_UIEventShop_Buy4-1 = "我正好想要這個。謝謝你。"
