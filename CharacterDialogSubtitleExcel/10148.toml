[translation]
10148-CVGroup_UITitle_Idle1-1 = "Blue, Archive."
10148-CVGroup_CharacterGet_Idle1-1 = "I'm still being bothered on my summer vacation... Well, it is what it is, so we'll get through it. Take care of me, okay?"
10148-CVGroup_Cafe_Idle1-1 = "I hate inconspicuous outfits..."
10148-CVGroup_Cafe_Idle2-1 = "Somewhere with as few Gehenna students as possible..."
10148-CVGroup_Cafe_Idle3-1 = "I wish our members would learn a thing or two from here."
10148-CVGroup_Cafe_Idle4-1 = "Huh, looks comfy."
10148-CVGroup_Cafe_Idle5-1 = "Did Sensei do all this?"
10148-CVGroup_WeaponGet_Idle1-1 = "Usually, people are nice because they expect something in return. Like more effort or better work. I hate those stipulations. But if it's you... I don't mind if you have expectations."
10148-CVGroup_UIEventLobby_Enter1-1 = "Seriously, it's so stupid."
10148-CVGroup_UIEventLobby_Enter1-2 = "How could this even happen? How?"
10148-CVGroup_UIEventLobby_Enter2-1 = "Why doesn't anyone else realize how serious this is?"
10148-CVGroup_UIEventLobby_Enter2-2 = "It's a relief that Sensei's here, at least."
10148-CVGroup_UIEventLobby_Enter3-1 = "Why am I still in the Pandemonium Society...?"
10148-CVGroup_UIEventLobby_Enter3-2 = "Ah, Sensei. It's nothing."
10148-CVGroup_UIEventLobby_Enter4-1 = "Ugh, seriously!"
10148-CVGroup_UIEventLobby_Enter4-2 = "Why am I the only one left feeling embarrassed?!"
10148-CVGroup_UIEventLobby_Enter4-3 = "Playing pirates at their age..."
10148-CVGroup_UIEventLobby_Enter5-1 = "...It's finally over."
10148-CVGroup_UIEventLobby_Enter5-2 = "Ah, please don't come any closer for now. Don't talk to me."
10148-CVGroup_UIEventLobby_Idle1-1 = "In my first year, I thought everyone in the Pandemonium Society was a top student."
10148-CVGroup_UIEventLobby_Idle1-2 = "...I wish I could smack some sense into my past self."
10148-CVGroup_UIEventLobby_Idle2-1 = "Sensei."
10148-CVGroup_UIEventLobby_Idle2-2 = "You were about to say something like \"Let's do our best!\", right?"
10148-CVGroup_UIEventLobby_Idle2-3 = "It's written all over your face."
10148-CVGroup_UIEventLobby_Idle3-1 = "Makoto's virtues? You're asking me that now? Seriously?"
10148-CVGroup_UIEventLobby_Idle3-2 = "Um, well..."
10148-CVGroup_UIEventLobby_Idle3-3 = "...She looks fine, as long as she keeps her mouth shut."
10148-CVGroup_UIEventLobby_Idle4-1 = "I appreciate having someone I can share a productive conversation with."
10148-CVGroup_UIEventLobby_Idle4-2 = "When I get back, I think I should treat Chiaki a little bit better."
10148-CVGroup_UIEventShop_Enter1-1 = "*sigh* What a bother."
10148-CVGroup_UIEventShop_Enter1-2 = "Sorry, but could you help me?"
10148-CVGroup_UIEventShop_Enter2-1 = "Just bring me anything and I'll try to handle it."
10148-CVGroup_UIEventShop_Enter2-2 = "...Why am I the only one in the Pandemonium Society doing this?"
10148-CVGroup_UIEventShop_Enter3-1 = "It's time to say goodbye to these scraps."
10148-CVGroup_UIEventShop_Enter3-2 = "Ah, feel free to take whatever's left. I don't know where you'll use it, though."
10148-CVGroup_UIEventShop_Idle1-1 = "...Was that on purpose?"
10148-CVGroup_UIEventShop_Idle1-2 = "No, it's nothing."
10148-CVGroup_UIEventShop_Idle2-1 = "Sensei, um..."
10148-CVGroup_UIEventShop_Idle2-2 = "You're touching, you know?"
10148-CVGroup_UIEventShop_Buy1-1 = "Ah, thank you. That saved me some hassle."
10148-CVGroup_UIEventShop_Buy2-1 = "Oh... So that's how it's done."
10148-CVGroup_UIEventShop_Buy3-1 = "THAT'S what you need? Hmm..."
10148-CVGroup_UIEventShop_Buy4-1 = "Ah, I needed that. Thank you."
