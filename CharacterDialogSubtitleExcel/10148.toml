[translation]
10148-CVGroup_UITitle_Idle1-1 = "ブルー、アーカイブ。"
10148-CVGroup_CharacterGet_Idle1-1 = "どうしてバカンスに来てまでこんなことを……。\nまぁこうなった以上、お互い頑張りましょう。"
10148-CVGroup_Cafe_Idle1-1 = "これだから目立つ格好は嫌なんですよ……。"
10148-CVGroup_Cafe_Idle2-1 = "できるだけ、ゲヘナ生が少ない所に……。"
10148-CVGroup_Cafe_Idle3-1 = "マコト先輩たちも見習ってくれたらいいんですけど。"
10148-CVGroup_Cafe_Idle4-1 = "なかなか居心地が良いですね。"
10148-CVGroup_Cafe_Idle5-1 = "これ全部、先生が揃えたのでしょうか？"
10148-CVGroup_WeaponGet_Idle1-1 = "「もっと頑張れ」とか、「努力しろ」とか。\nそういうのって、基本はめんどくさいじゃないですか。\nでも、それが先生からの期待だったら……悪くはありませんね。"
10148-CVGroup_UIEventLobby_Enter1-1 = "ほんっとうに、もう……。"
10148-CVGroup_UIEventLobby_Enter1-2 = "なにをどうすればこんなことに？"
10148-CVGroup_UIEventLobby_Enter2-1 = "どうして誰も事の深刻さが分からないんでしょうか？"
10148-CVGroup_UIEventLobby_Enter2-2 = "はぁ……先生がいてくれて助かりました。"
10148-CVGroup_UIEventLobby_Enter3-1 = "なぜ……どうして私は、まだ万魔殿に……。"
10148-CVGroup_UIEventLobby_Enter3-2 = "あ、先生。いえ、何でもありません。お気になさらず。"
10148-CVGroup_UIEventLobby_Enter4-1 = "まったく、なんなんですか！"
10148-CVGroup_UIEventLobby_Enter4-2 = "どうして私だけ恥ずかしい思いを！？"
10148-CVGroup_UIEventLobby_Enter4-3 = "海賊ごっこって……自分の年齢考えてくださいよ……。"
10148-CVGroup_UIEventLobby_Enter5-1 = "……片づきましたね。"
10148-CVGroup_UIEventLobby_Enter5-2 = "今は放っておいてください。"
10148-CVGroup_UIEventLobby_Idle1-1 = "万魔殿は優等生の集まりだ、と1年生の頃は思っていました。"
10148-CVGroup_UIEventLobby_Idle1-2 = "……あの時の自分の目を覚まさせたいです。"
10148-CVGroup_UIEventLobby_Idle2-1 = "先生。"
10148-CVGroup_UIEventLobby_Idle2-2 = "「みんなで頑張ろう」とか言おうとしてます？"
10148-CVGroup_UIEventLobby_Idle2-3 = "顔に書いてありますよ。"
10148-CVGroup_UIEventLobby_Idle3-1 = "マコト先輩の長所？\nそれ、本気で聞いてます？"
10148-CVGroup_UIEventLobby_Idle3-2 = "ん～～～～～……。"
10148-CVGroup_UIEventLobby_Idle3-3 = "顔は、悪くないです。\n……黙っていれば。"
10148-CVGroup_UIEventLobby_Idle4-1 = "話が通じることがこうもありがたいとは……。"
10148-CVGroup_UIEventLobby_Idle4-2 = "チアキにはもう少し優しくしてあげますかね。"
10148-CVGroup_UIEventShop_Enter1-1 = "はぁ……サボりたい……。"
10148-CVGroup_UIEventShop_Enter1-2 = "よければ、手を貸してもらえませんか？"
10148-CVGroup_UIEventShop_Enter2-1 = "とりあえず、持ってきてもらえれば、私がどうにかします。"
10148-CVGroup_UIEventShop_Enter2-2 = "というか、どうして私以外できないんでしょうか……。"
10148-CVGroup_UIEventShop_Enter3-1 = "もうこの古物ともお別れですね。"
10148-CVGroup_UIEventShop_Enter3-2 = "残りは全部持っていってください。\nどこで使うか知りませんけど。"
10148-CVGroup_UIEventShop_Idle1-1 = "……わざとですか？"
10148-CVGroup_UIEventShop_Idle1-2 = "いえ、何でもないです。"
10148-CVGroup_UIEventShop_Idle2-1 = "あの、先生……。"
10148-CVGroup_UIEventShop_Idle2-2 = "当たってます……。"
10148-CVGroup_UIEventShop_Buy1-1 = "ありがとうございます。\nおかげで面倒ごとが一つ減りました。"
10148-CVGroup_UIEventShop_Buy2-1 = "ああ……これをこうです。"
10148-CVGroup_UIEventShop_Buy3-1 = "そういうのが必要なんですか？\nへぇ……。"
10148-CVGroup_UIEventShop_Buy4-1 = "ちょうど欲しかったので。ありがとうございます。"
