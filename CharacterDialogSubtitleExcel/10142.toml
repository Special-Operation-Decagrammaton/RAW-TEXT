[translation]
10142-CVGroup_UITitle_Idle1-1 = "蔚藍……檔案……"
10142-CVGroup_CharacterGet_Idle1-1 = "難得像這樣來到海邊了……\n我想和大家一起製造難忘的回憶。\n老師也能……陪我一起嗎？"
10142-CVGroup_Cafe_Idle1-1 = "最涼快的地方在哪裡呢……"
10142-CVGroup_Cafe_Idle2-1 = "交流會……好期待。"
10142-CVGroup_Cafe_Idle3-1 = "想展現出符合委員長身分的……一面呢。"
10142-CVGroup_Cafe_Idle4-1 = "我不太想引人注目呢……"
10142-CVGroup_Cafe_Idle5-1 = "今天的回憶，我想好好珍惜。"
10142-CVGroup_WeaponGet_Idle1-1 = "我還有很多不成熟的地方。\n即便如此，我仍想繼續背負這支百蓮。\n那並不是……\n為了扮演百花繚亂的委員長。\n――而是為了直面自己的內心。"
10142-CVGroup_UIEventLobby_Enter1-1 = "老師，你會見證我們的活躍嗎？"
10142-CVGroup_UIEventLobby_Enter2-1 = "呵呵，至今封印著的力量，就讓你見識見識。"
10142-CVGroup_UIEventLobby_Enter3-1 = "雖然還有餘裕，繼續保持謹慎吧。"
10142-CVGroup_UIEventLobby_Enter4-1 = "要最後衝刺了呢。"
10142-CVGroup_UIEventLobby_Enter4-2 = "大家，一起加油吧。"
10142-CVGroup_UIEventLobby_Enter5-1 = "老師，謝謝你陪我到最後。"
10142-CVGroup_UIEventLobby_Enter5-2 = "下次也一起玩吧。"
10142-CVGroup_UIEventLobby_Idle1-1 = "祭典，氣氛相當熱烈呢。"
10142-CVGroup_UIEventLobby_Idle1-2 = "連我也跟著熱血起來了。"
10142-CVGroup_UIEventLobby_Idle2-1 = "陽光好強……得做好防曬才行。"
10142-CVGroup_UIEventLobby_Idle2-2 = "聽說曬傷也算是燙傷呢。"
10142-CVGroup_UIEventLobby_Idle3-1 = "你……在意我嗎？"
10142-CVGroup_UIEventLobby_Idle3-2 = "對不起。我太引人注目了。"
10142-CVGroup_UIEventLobby_Idle4-1 = "在祭典上吃的烤雞串，有種特別的感覺。"
10142-CVGroup_UIEventLobby_Idle4-2 = "老師不這麼覺得嗎？"
