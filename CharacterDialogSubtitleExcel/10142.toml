[translation]
10142-CVGroup_UITitle_Idle1-1 = "Blue...Archive."
10142-CVGroup_CharacterGet_Idle1-1 = "I wish to forge unforgettable memories with the others at a refreshing beach. Naturally, you are included in this. Would you come with us?"
10142-CVGroup_Cafe_Idle1-1 = "Where would be most refreshing?"
10142-CVGroup_Cafe_Idle2-1 = "A social outing... I am waiting with great anticipation."
10142-CVGroup_Cafe_Idle3-1 = "I wish to present myself...in a way befitting of a president."
10142-CVGroup_Cafe_Idle4-1 = "I wish not to draw all the attention upon myself."
10142-CVGroup_Cafe_Idle5-1 = "Let us treasure the memories made today."
10142-CVGroup_WeaponGet_Idle1-1 = "Despite my plethora of shortcomings, I will continue wielding the Hundred Lotus. Not...for a false claim to the Hyakkaryouran presidency, but rather in an endeavor to confront my own heart."
10142-CVGroup_UIEventLobby_Enter1-1 = "Sensei, will you continue watching us as we strive to do all we can?"
10142-CVGroup_UIEventLobby_Enter2-1 = "Fufu, I shall show everyone what my right hand is capable of."
10142-CVGroup_UIEventLobby_Enter3-1 = "Our time has yet to run out. We must compose ourselves and push forward."
10142-CVGroup_UIEventLobby_Enter4-1 = "Our final effort."
10142-CVGroup_UIEventLobby_Enter4-2 = "Give all your strength, everyone."
10142-CVGroup_UIEventLobby_Enter5-1 = "Sensei, you have my thanks for all you've done."
10142-CVGroup_UIEventLobby_Enter5-2 = "Let us do this again next time."
10142-CVGroup_UIEventLobby_Idle1-1 = "Is this wat they call \"festival fever\"?"
10142-CVGroup_UIEventLobby_Idle1-2 = "My heart is racing."
10142-CVGroup_UIEventLobby_Idle2-1 = "The sun beats down mercilessly... We must take proper measures against the UV rays."
10142-CVGroup_UIEventLobby_Idle2-2 = "A tan is simply the skin being burnt."
10142-CVGroup_UIEventLobby_Idle3-1 = "Am I...on your mind?"
10142-CVGroup_UIEventLobby_Idle3-2 = "I apologize. I stand out too much."
10142-CVGroup_UIEventLobby_Idle4-1 = "Chicken skewers from festivals are special."
10142-CVGroup_UIEventLobby_Idle4-2 = "Don't you agree, Sensei?"
