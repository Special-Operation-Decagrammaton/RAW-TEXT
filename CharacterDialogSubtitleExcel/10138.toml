[translation]
10138-CVGroup_UITitle_Idle1-1 = "哼，蔚藍檔案！"
10138-CVGroup_CharacterGet_Idle1-1 = "狂獵藝術學園的衣斐玲奈。給我等著。\n神秘學什麼的，我會證明全都是騙人的！"
10138-CVGroup_Cafe_Idle1-1 = "那個人適合什麼衣服呢？"
10138-CVGroup_Cafe_Idle2-1 = "這裡的話不會發生奇怪的事吧……？應該不至於吧……"
10138-CVGroup_Cafe_Idle3-1 = "這個擺設……老師也有點品味呢。"
10138-CVGroup_Cafe_Idle4-1 = "那個設計是神秘學吧……？老師也受影響了嗎。"
10138-CVGroup_Cafe_Idle5-1 = "那，那邊好像有奇怪的聲音傳來……"
10138-CVGroup_WeaponGet_Idle1-1 = "如果因為我很小隻就小看我可是會後悔的哦。\n雖然看起來這樣，但我的槍法可是一流的！\n用彈痕畫畫的程度──\n呃，我是說真的哦？！"
10138-CVGroup_UIEventLobby_Enter1-1 = "老師，這邊。"
10138-CVGroup_UIEventLobby_Enter1-2 = "一起來揭穿假謠言吧。"
10138-CVGroup_UIEventLobby_Enter2-1 = "前輩給的護身符……放去哪了……"
10138-CVGroup_UIEventLobby_Enter2-2 = "只，只是因為收到了所以才找的！"
10138-CVGroup_UIEventLobby_Enter3-1 = "我，我到最後都不會放棄的！"
10138-CVGroup_UIEventLobby_Enter3-2 = "我會證明全部都是假的！"
10138-CVGroup_UIEventLobby_Enter4-1 = "嚇啊──！！ 騙子！ 假貨！ 放馬過來！"
10138-CVGroup_UIEventLobby_Enter4-2 = "我要在今晚作個了結！"
10138-CVGroup_UIEventLobby_Enter5-1 = "雖然發生了很多奇怪的事……"
10138-CVGroup_UIEventLobby_Enter5-2 = "嘛，反正蠻開心的就算了吧。"
10138-CVGroup_UIEventLobby_Idle1-1 = "哼，反正全部都是假的！"
10138-CVGroup_UIEventLobby_Idle1-2 = "……大，大概吧。"
10138-CVGroup_UIEventLobby_Idle2-1 = "總，總覺得有股寒意……"
10138-CVGroup_UIEventLobby_Idle2-2 = "是，是風的關係吧……？ 對吧？"
10138-CVGroup_UIEventLobby_Idle3-1 = "唉，什麼槌之子啊。"
10138-CVGroup_UIEventLobby_Idle3-2 = "肯定是把蜥蜴看錯了吧？"
10138-CVGroup_UIEventLobby_Idle4-1 = "咿，咿──！？"
10138-CVGroup_UIEventLobby_Idle4-2 = "……什麼嘛，是老師啊。不要突然戳我啦！"
10138-CVGroup_UIEventShop_Enter1-1 = "可，可疑的東西堆積如山……"
10138-CVGroup_UIEventShop_Enter1-2 = "也許有能用的東西。要看看嗎？"
10138-CVGroup_UIEventShop_Enter2-1 = "老師，你知道這是什麼嗎？"
10138-CVGroup_UIEventShop_Enter2-2 = "有各種各樣的東西呢……"
10138-CVGroup_UIEventShop_Enter3-1 = "嘛，回想起來的話……也算是美好的回憶呢。呵呵。"
10138-CVGroup_UIEventShop_Idle1-1 = "這，這裡應該安全……吧？"
10138-CVGroup_UIEventShop_Idle1-2 = "應該不會突然出現……鬼吧？"
10138-CVGroup_UIEventShop_Idle2-1 = "別，別光看著快來幫忙啊！"
10138-CVGroup_UIEventShop_Idle2-2 = "一個人整理這裡，很可──很累耶！"
10138-CVGroup_UIEventShop_Buy1-1 = "啊，感覺可以派上用場。"
10138-CVGroup_UIEventShop_Buy2-1 = "咦，那個是在破爛堆裡找到的？"
10138-CVGroup_UIEventShop_Buy3-1 = "希望真的能派上用場就好了……"
10138-CVGroup_UIEventShop_Buy4-1 = "來，拿去。畢竟是我拿來的，要感謝我喔？"
10138-CVGroup_UIEventMission_Enter1-1 = "嗯……要確認一下收集到的線索嗎？"
10138-CVGroup_UIEventMission_Enter2-1 = "來一起整理一下事件吧。"
10138-CVGroup_UIEventMission_Buy1-1 = "哼，果然沒什麼嘛。"
10138-CVGroup_UIEventMission_Buy2-1 = "就這樣繼續把真相全部揭開吧！"
10138-CVGroup_UIEventMission_Idle1-1 = "比，比起鬼，吊橋反而更可怕……"
10138-CVGroup_UIEventMission_Idle2-1 = "嚇啊──！！別鬧了快專心調查！"
10138-CVGroup_UIEventMission_Interaction1-1 = "今，今天就到此為止！ 勉強是不好的！"
