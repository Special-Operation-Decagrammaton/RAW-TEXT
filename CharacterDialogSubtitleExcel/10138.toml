[translation]
10138-CVGroup_UITitle_Idle1-1 = "ฮึ่ม Blue Archive!"
10138-CVGroup_CharacterGet_Idle1-1 = "ฉันคินุอิ เรนะ จากสถาบันศิลปะไวลด์ฮันต์ คอยดูเลยนะ\nฉันจะพิสูจน์ให้เห็นว่ารหัสยศาสตร์เป็นเรื่องงมงายทั้งหมดเลย!"
10138-CVGroup_Cafe_Idle1-1 = "คนนั้นจะเหมาะกับเสื้อผ้าแบบไหนนะ?"
10138-CVGroup_Cafe_Idle2-1 = "ที่นี่น่าจะไม่เกิดเรื่องแปลกๆ หรอกเนอะ...? น่าจะนะ..."
10138-CVGroup_Cafe_Idle3-1 = "การจัดวางแบบนี้... คุณครูนี่ก็มีเซนส์ใช้ได้เลยนะ"
10138-CVGroup_Cafe_Idle4-1 = "ดีไซน์อันนั้นมันเป็นรหัสยศาสตร์ใช่มั้ย...?\nคุณครูก็ได้รับอิทธิพลมาด้วยเหรอ?"
10138-CVGroup_Cafe_Idle5-1 = "ดะ... ได้ยินเสียงอะไรแปลกๆ ออกมาจากทางนั้น..."
10138-CVGroup_WeaponGet_Idle1-1 = "ถ้าดูถูกว่าฉันตัวเล็ก ระวังจะเจ็บตัวไม่ใช่น้อย\nเห็นอย่างนี้ฉันก็เก่งเรื่องปืนนะ!\nฉันวาดภาพจากรอยกระสุนได้เลยด้วย... จริงๆ นะ?!!"
10138-CVGroup_UIEventLobby_Enter1-1 = "คุณครู ทางนี้"
10138-CVGroup_UIEventLobby_Enter1-2 = "มาเปิดโปงข่าวลือเหลวไหลของที่นี่ด้วยกันเถอะ"
10138-CVGroup_UIEventLobby_Enter2-1 = "พวกรุ่นพี่ให้เครื่องรางมา แต่ฉันเอาไปไว้ไหนนะ..."
10138-CVGroup_UIEventLobby_Enter2-2 = "นะ... ไหนๆ ได้มาแล้ว ก็เลยลองหาดูก็เท่านั้นน่ะ!"
10138-CVGroup_UIEventLobby_Enter3-1 = "ฉะ... ฉันจะไม่ยอมแพ้จนถึงที่สุดเลย!"
10138-CVGroup_UIEventLobby_Enter3-2 = "ฉันจะพิสูจน์ให้ได้เลยว่าทั้งหมดเป็นเรื่องโกหก!"
10138-CVGroup_UIEventLobby_Enter4-1 = "ว้ากกก! มิจฉาชีพ! พวกเหลวไหล! เข้ามาเลย!"
10138-CVGroup_UIEventLobby_Enter4-2 = "จะปราบให้หมดสิ้นภายในคืนนี้เลย!"
10138-CVGroup_UIEventLobby_Enter5-1 = "ถึงจะมีเรื่องแปลกๆ เกิดขึ้นมากมาย..."
10138-CVGroup_UIEventLobby_Enter5-2 = "แต่ช่างเถอะ ยังไงเราก็ได้สนุกกันนี่นา"
10138-CVGroup_UIEventLobby_Idle1-1 = "ฮึ่ม ยังไงก็เป็นเรื่องหลอกลวงทั้งนั้น!"
10138-CVGroup_UIEventLobby_Idle1-2 = "อะ... อาจจะนะ..."
10138-CVGroup_UIEventLobby_Idle2-1 = "จะ... จู่ๆ ก็ขนลุกขึ้นมา..."
10138-CVGroup_UIEventLobby_Idle2-2 = "คะ... คงเป็นเพราะลมแหละเนอะ...? เนอะ?"
10138-CVGroup_UIEventLobby_Idle3-1 = "เฮ้อ สึจิโนโกะอะไรกัน"
10138-CVGroup_UIEventLobby_Idle3-2 = "คงเห็นสัตว์เลื้อยคลานอะไรแล้วเข้าใจผิดน่ะสิ!"
10138-CVGroup_UIEventLobby_Idle4-1 = "ฮะ... เฮือกก?!"
10138-CVGroup_UIEventLobby_Idle4-2 = "อะไรกัน... คุณครูเองเหรอ เดี๋ยวสิ จู่ๆ ก็อย่ามาจิ้มกันแบบนี้!"
10138-CVGroup_UIEventShop_Enter1-1 = "มะ... มีของแปลกๆ เพียบเลย..."
10138-CVGroup_UIEventShop_Enter1-2 = "อาจมีของที่เป็นประโยชน์ก็ได้นะ ลองมาดูก่อนมั้ย?"
10138-CVGroup_UIEventShop_Enter2-1 = "คุณครู รู้หรือเปล่าว่านี่อะไร?"
10138-CVGroup_UIEventShop_Enter2-2 = "มีของหลายอย่างเลยนะ"
10138-CVGroup_UIEventShop_Enter3-1 = "ถ้ามองย้อนกลับไป... อาจเป็นความทรงจำดีๆ ก็ได้นะ ฮุฮุ"
10138-CVGroup_UIEventShop_Idle1-1 = "ทะ... ที่นี่มันปลอดภัยใช่มั้ย?"
10138-CVGroup_UIEventShop_Idle1-2 = "คงไม่มีผีโผล่ออกมาหรอกเนอะ?"
10138-CVGroup_UIEventShop_Idle2-1 = "ยะ... อย่าเอาแต่ยืนดูสิ มาช่วยกันหน่อย!"
10138-CVGroup_UIEventShop_Idle2-2 = "ให้ฉันจัดของพวกนี้คนเดียว ฉันกลัว... ไม่สิ ฉันเหนื่อยนะ!"
10138-CVGroup_UIEventShop_Buy1-1 = "หืม? อันนั้นน่าจะใช้ได้เลยนะ?"
10138-CVGroup_UIEventShop_Buy2-1 = "อ๊ะ อยู่กับพวกของจุกจิกงั้นเหรอ? อันนั้นน่ะ"
10138-CVGroup_UIEventShop_Buy3-1 = "อยากให้ใช้ประโยชน์ได้จริงๆ จังเลยนะ..."
10138-CVGroup_UIEventShop_Buy4-1 = "เอ้า รับไปสิ ฉันเป็นคนเอามาให้นะ ต้องขอบคุณฉันด้วยล่ะ?"
10138-CVGroup_UIEventMission_Enter1-1 = "อืม... ลองรวบรวมเบาะแสที่เก็บได้จนถึงตอนนี้ดีมั้ย?"
10138-CVGroup_UIEventMission_Enter2-1 = "มาสรุปเหตุการณ์ด้วยกันเถอะ"
10138-CVGroup_UIEventMission_Buy1-1 = "ฮึ่ม เป็นแค่ข่าวลือไร้สาระตามคาด"
10138-CVGroup_UIEventMission_Buy2-1 = "ฉันจะตรวจสอบข่าวลือต่อไปด้วยเอเนอร์จี้นี้ละ!"
10138-CVGroup_UIEventMission_Idle1-1 = "บะ... บอกตามตรงเลยนะว่าสะพานแกว่งๆ นั่นน่ากลัวกว่าผีอีก..."
10138-CVGroup_UIEventMission_Idle2-1 = "ว้ากกก! อย่ามัวเล่นอยู่สิ โฟกัสกับการสืบสวนหน่อย!"
10138-CVGroup_UIEventMission_Interaction1-1 = "ทะ... เท่านี้ก็เสร็จงานของวันนี้แล้ว! อย่าหักโหมมากไปเลยนะ!"
