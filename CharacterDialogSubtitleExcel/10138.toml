[translation]
10138-CVGroup_UITitle_Idle1-1 = "Hmph, Blue Archive!"
10138-CVGroup_CharacterGet_Idle1-1 = "I'm Kinui Rena from Wildhunt Art Academy. Just you watch. I'll prove that the occult is nothing but a total sham!"
10138-CVGroup_Cafe_Idle1-1 = "What kind of clothes would best suit that person...?"
10138-CVGroup_Cafe_Idle2-1 = "Nothing weird is gonna happen here, right...? Probably..."
10138-CVGroup_Cafe_Idle3-1 = "This arrangement... Sensei has decent taste."
10138-CVGroup_Cafe_Idle4-1 = "Isn't that design from the occult...? Maybe Sensei got influenced too."
10138-CVGroup_Cafe_Idle5-1 = "I heard a weird noise from o-over there..."
10138-CVGroup_WeaponGet_Idle1-1 = "You shouldn't underestimate me because I'm small. Despite how I look, I'm good with guns! I can even make a drawing out of bullet marks... It's real, you know?!"
10138-CVGroup_UIEventLobby_Enter1-1 = "Sensei, this way."
10138-CVGroup_UIEventLobby_Enter1-2 = "Let's expose these baseless rumors together."
10138-CVGroup_UIEventLobby_Enter2-1 = "My seniors gave me an amulet. Where did I put it...?"
10138-CVGroup_UIEventLobby_Enter2-2 = "The ONLY reason I'm looking for it is because it was a GIFT!"
10138-CVGroup_UIEventLobby_Enter3-1 = "I-I will never, ever give up!"
10138-CVGroup_UIEventLobby_Enter3-2 = "I WILL prove that it's all a lie!"
10138-CVGroup_UIEventLobby_Enter4-1 = "Shyaah! Con artist! Fake! Bring it on!"
10138-CVGroup_UIEventLobby_Enter4-2 = "I'll bust them all by tonight!"
10138-CVGroup_UIEventLobby_Enter5-1 = "Lots of incredibly suspicious things happened..."
10138-CVGroup_UIEventLobby_Enter5-2 = "Eh, I had fun, so I think it's fine!"
10138-CVGroup_UIEventLobby_Idle1-1 = "Hmph! It's all a big sham anyway!"
10138-CVGroup_UIEventLobby_Idle1-2 = "...P-Probably."
10138-CVGroup_UIEventLobby_Idle2-1 = "E-Everything feels so spooky all of a sudden..."
10138-CVGroup_UIEventLobby_Idle2-2 = "M-Must've been the wind... Right?"
10138-CVGroup_UIEventLobby_Idle3-1 = "*sigh* What do you mean, \"a Tsuchinoko\"?"
10138-CVGroup_UIEventLobby_Idle3-2 = "It was probably just a lizard!"
10138-CVGroup_UIEventLobby_Idle4-1 = "E-EEEEK?!"
10138-CVGroup_UIEventLobby_Idle4-2 = "...Oh, it's just Sensei—wait, but don't poke me out of nowhere like that!"
10138-CVGroup_UIEventShop_Enter1-1 = "Th-There's a whole pile of suspicious things..."
10138-CVGroup_UIEventShop_Enter1-2 = "There might be something useful in there. Want to check it out first?"
10138-CVGroup_UIEventShop_Enter2-1 = "Sensei, do you know what this is?"
10138-CVGroup_UIEventShop_Enter2-2 = "There's so much stuff here..."
10138-CVGroup_UIEventShop_Enter3-1 = "Well, looking back... Maybe I made some good memories. Heehee."
10138-CVGroup_UIEventShop_Idle1-1 = "Th-This place is safe, right?"
10138-CVGroup_UIEventShop_Idle1-2 = "A-A ghost isn't going to jump out at us, right?"
10138-CVGroup_UIEventShop_Idle2-1 = "D-Don't just stare at me! HELP ME!"
10138-CVGroup_UIEventShop_Idle2-2 = "Sorting all this out by myself is scary...I mean, TIRING!"
10138-CVGroup_UIEventShop_Buy1-1 = "Huh? Isn't that kinda useful?"
10138-CVGroup_UIEventShop_Buy2-1 = "Wait, it was in that pile of junk? That one?"
10138-CVGroup_UIEventShop_Buy3-1 = "I hope you find some use for it..."
10138-CVGroup_UIEventShop_Buy4-1 = "Here, take it. I'm the one who brought it, so you should be thankful, okay?"
10138-CVGroup_UIEventMission_Enter1-1 = "Hmm, should we try to put together the clues we've found so far?"
10138-CVGroup_UIEventMission_Enter2-1 = "Let's organize this case together."
10138-CVGroup_UIEventMission_Buy1-1 = "Hmph, I knew it'd be a baseless rumor."
10138-CVGroup_UIEventMission_Buy2-1 = "Let's keep up the pace and move on to the next rumor!"
10138-CVGroup_UIEventMission_Idle1-1 = "H-Honestly, I'm more scared of that shaky bridge than ghosts..."
10138-CVGroup_UIEventMission_Idle2-1 = "Shyaah! Stop fooling around! Focus on the investigation!"
10138-CVGroup_UIEventMission_Interaction1-1 = "Th-That's it for today! It's bad to overdo it!"
