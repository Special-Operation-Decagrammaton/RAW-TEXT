[translation]
20064-CVGroup_UITitle_Idle1-1 = "ブルーアーカイブ、でございます。"
20064-CVGroup_CharacterGet_Idle1-1 = "ごきげんよう、先生。\nワイルドハント芸術学院、芸術評議会の副会長、雲林院ウララと申します。\nこの逢瀬が、芳しく咲く花のように……美しく記憶に残ることを願っています。"
20064-CVGroup_Cafe_Idle1-1 = "花を飾っても良いですね。"
20064-CVGroup_Cafe_Idle2-1 = "ここはとても楽しげな香りがしますね。"
20064-CVGroup_Cafe_Idle3-1 = "ここにもなにか……秘密があるのでしょうか？"
20064-CVGroup_Cafe_Idle4-1 = "ふむ、どこかゆっくりできる場所は……。"
20064-CVGroup_Cafe_Idle5-1 = "あの方には……少し気を配っておいたほうが良さそうです。"
20064-CVGroup_WeaponGet_Idle1-1 = "誰かを傷つけるのは本意ではありませんが……必要な時もあるのでしょう。\n力なき正義は、ただの幻想に過ぎませんから。\nありがとうございます、先生。"
20064-CVGroup_UIEventLobby_Enter1-1 = "評議会へようこそ、先生。"
20064-CVGroup_UIEventLobby_Enter2-1 = "共に、この危機に立ち向かっていきましょう。"
20064-CVGroup_UIEventLobby_Enter3-1 = "できることなら、あの方の手は借りたくないのですが……。"
20064-CVGroup_UIEventLobby_Enter4-1 = "幕が下りるその時まで、共に参りましょう。"
20064-CVGroup_UIEventLobby_Enter5-1 = "事件は解決しましたが……真の危機はこれからのようです。"
20064-CVGroup_UIEventLobby_Idle1-1 = "ご入用のものがあれば、何なりとお申し付けください。"
20064-CVGroup_UIEventLobby_Idle1-2 = "ああ、ですが……できないこともありますからね。"
20064-CVGroup_UIEventLobby_Idle2-1 = "きれいな薔薇には棘がある……。"
20064-CVGroup_UIEventLobby_Idle2-2 = "不用意に手を伸ばせば、傷ついてしまいますよ？"
20064-CVGroup_UIEventLobby_Idle2-3 = "ふふ……わたくしとは関係のないお話かもしれませんが。"
20064-CVGroup_UIEventLobby_Idle3-1 = "言葉を交わさずとも、ただ隣で互いの息遣いを感じるだけで良い……。"
20064-CVGroup_UIEventLobby_Idle3-2 = "そんな関係を好んでいます。"
20064-CVGroup_UIEventLobby_Idle3-3 = "先生には……そういった相手はいらっしゃいますか？"
20064-CVGroup_UIEventLobby_Idle4-1 = "人はみなペルソナを被っているもの……ですから、"
20064-CVGroup_UIEventLobby_Idle4-2 = "わたくしはあまり人を信じない性分なのですが……。"
20064-CVGroup_UIEventLobby_Idle4-3 = "先生にだけは……身を委ねても構わないと思っているのです。"
20064-CVGroup_UIEventShop_Enter1-1 = "色々なものを取り揃えておりますよ。"
20064-CVGroup_UIEventShop_Enter2-1 = "ご入用のものはありますか？"
20064-CVGroup_UIEventShop_Enter3-1 = "この舞台は幕を下ろしましたが――"
20064-CVGroup_UIEventShop_Enter3-2 = "先生のお力になりたい、と心から思っているのです。"
20064-CVGroup_UIEventShop_Enter3-3 = "カーテンコールにしばしお付き合いください。"
20064-CVGroup_UIEventShop_Idle1-1 = "残念ながら、マナミ様のご命令ですので、無料ではないのです。"
20064-CVGroup_UIEventShop_Idle2-1 = "バラの香りを感じますか……？"
20064-CVGroup_UIEventShop_Buy1-1 = "こちらですね。"
20064-CVGroup_UIEventShop_Buy2-1 = "良い香りがしますね。"
20064-CVGroup_UIEventShop_Buy3-1 = "お気に召したのなら幸いです。"
20064-CVGroup_UIEventShop_Buy4-1 = "はい、どうぞ。"
