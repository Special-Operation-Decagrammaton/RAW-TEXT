[translation]
20064-CVGroup_UITitle_Idle1-1 = "블루 아카이브, 랍니다."
20064-CVGroup_CharacterGet_Idle1-1 = "평안하신지요, 선생님.\n와일드헌트 예술학원 예술 평의회의 부회장, \n운린인 우라라 입니다.\n이 만남이, 향기롭게 피어난 꽃처럼……\n아름답게 기억되길 바랍니다."
20064-CVGroup_Cafe_Idle1-1 = "꽃을 장식해도\n좋겠네요."
20064-CVGroup_Cafe_Idle2-1 = "이곳은 무적 \n즐거운 향기가 나네요."
20064-CVGroup_Cafe_Idle3-1 = "이곳에도 뭔가……\n비밀이 있는 걸까요?"
20064-CVGroup_Cafe_Idle4-1 = "으음, 사색에\n잠길만한 곳은……."
20064-CVGroup_Cafe_Idle5-1 = "저분은……\n조금 신경을 써 두는 편이\n좋을 것 같네요."
20064-CVGroup_WeaponGet_Idle1-1 = "누군가를 다치게 할 생각은 없습니다만……\n해야만 할 때도 있는 법이죠.\n힘이 없는 정의는 그저\n환상에 불과할 뿐이니까요.\n감사합니다. 선생님."
20064-CVGroup_UIEventLobby_Enter1-1 = "평의회에 오신 것을\n환영합니다, 선생님."
20064-CVGroup_UIEventLobby_Enter2-1 = "함께, 이 위기에\n맞서 나가요."
20064-CVGroup_UIEventLobby_Enter3-1 = "가능하면, 그분의 손은\n빌리고 싶지\n않습니다만……."
20064-CVGroup_UIEventLobby_Enter4-1 = "막이 내리는 그때까지,\n함께 나아가요."
20064-CVGroup_UIEventLobby_Enter5-1 = "사건은 해결됐지만……\n진짜 위기는\n지금부터 시작이네요."
20064-CVGroup_UIEventLobby_Idle1-1 = "필요한 게 있다면\n무엇이든 말씀해 주세요."
20064-CVGroup_UIEventLobby_Idle1-2 = "아아, 하지만……\n이상한 건 안 되니까요."
20064-CVGroup_UIEventLobby_Idle2-1 = "아름다운 장미에는\n가시가 있어서……"
20064-CVGroup_UIEventLobby_Idle2-2 = "섣불리 건드리면\n찔리고 만답니다?"
20064-CVGroup_UIEventLobby_Idle2-3 = "후후…… 저랑\n관계없는 이야기일지도\n모르지만요."
20064-CVGroup_UIEventLobby_Idle3-1 = "말을 나누지 않아도,\n곁에서 숨결을 느끼는\n것만으로도 좋은……"
20064-CVGroup_UIEventLobby_Idle3-2 = "그런 사이가 좋아요."
20064-CVGroup_UIEventLobby_Idle3-3 = "선생님은……\n그런 사람이 있으실까요?"
20064-CVGroup_UIEventLobby_Idle4-1 = "사람들은 모두\n페르소나를 쓰고 있죠……"
20064-CVGroup_UIEventLobby_Idle4-2 = "그래서 저는 사람을\n잘 믿지 않습니다만……."
20064-CVGroup_UIEventLobby_Idle4-3 = "선생님이라면,\n몸을 기대도\n괜찮다고 생각해요."
20064-CVGroup_UIEventShop_Enter1-1 = "업무에 필요한 상품을\n준비해 봤어요."
20064-CVGroup_UIEventShop_Enter2-1 = "여기서 필요한 물품이\n있으실까요?"
20064-CVGroup_UIEventShop_Enter3-1 = "이 무대는\n막을 내렸습니다만……."
20064-CVGroup_UIEventShop_Enter3-2 = "선생님의 힘이 되고 싶다는\n마음은 그대로랍니다."
20064-CVGroup_UIEventShop_Enter3-3 = "커튼콜이 끝날 때까지\n어울려 주시겠어요?"
20064-CVGroup_UIEventShop_Idle1-1 = "아쉽게도, 마나미 님의 명령이라\n무료는 아니랍니다."
20064-CVGroup_UIEventShop_Idle2-1 = "장미 향기가 느껴지나요……?"
20064-CVGroup_UIEventShop_Buy1-1 = "그쪽으로 준비해 드렸습니다."
20064-CVGroup_UIEventShop_Buy2-1 = "좋은 향기가 나네요."
20064-CVGroup_UIEventShop_Buy3-1 = "마음에 드셨으면 좋겠어요."
20064-CVGroup_UIEventShop_Buy4-1 = "네, 여기요."
