[translation]
10139-CVGroup_UITitle_Idle1-1 = "Blue Archive"
10139-CVGroup_CharacterGet_Idle1-1 = "โยชิโนะ นิโกะแห่งกองทหาร FOX จากสถาบันพิเศษ SRT ค่ะ\nถึงจะยังอ่อนประสบการณ์ แต่ต่อไปก็ฝากเนื้อฝากตัวด้วยนะคะ"
10139-CVGroup_Cafe_Idle1-1 = "(ได้กลิ่นหอม... ของเต้าหู้...)"
10139-CVGroup_Cafe_Idle2-1 = "ถ้าไม่ว่าอะไร ลองทานซูชิเต้าหู้หวาน\nที่เพิ่งทำเสร็จใหม่ๆ สักชิ้นมั้ยคะ?"
10139-CVGroup_Cafe_Idle3-1 = "วันนี้เหมาะกับการซักผ้าเลยนะ\nผ้าปูรองนอนต้องแห้งดีแน่ๆ"
10139-CVGroup_Cafe_Idle4-1 = "ช่วงนี้ฮิตอะไรแบบนี้กันงั้นเหรอ?"
10139-CVGroup_Cafe_Idle5-1 = "การใช้เวลาในวันหยุดแบบนี้ก็...\nอาจจะไม่แย่เท่าไรนะ"
10139-CVGroup_WeaponGet_Idle1-1 = "ฉันได้รับปืนลูกซอง FOX รุ่น 870 มาแล้วค่ะ\nถ้าอยากได้ความช่วยเหลือระยะประชิด\nก็ให้เป็นหน้าที่ของฉันเลยค่ะ"
10139-CVGroup_UIEventLobby_Enter1-1 = "จะเริ่มปฏิบัติการแกะรอยตำนานนับตั้งแต่นี้ค่ะ"
10139-CVGroup_UIEventLobby_Enter2-1 = "กำลังรออยู่เลยค่ะ คุณครู"
10139-CVGroup_UIEventLobby_Enter2-2 = "ฉันจะเริ่มบรีฟนับตั้งแต่นี้ค่ะ ทางนี้ค่ะ"
10139-CVGroup_UIEventLobby_Enter3-1 = "ยินดีต้อนรับสู่กองบัญชาการปฏิบัติการของกองทหาร FOX ค่ะ"
10139-CVGroup_UIEventLobby_Idle1-1 = "พวกคนที่หายตัวไป ไปอยู่ที่ไหนกันนะคะ...?"
10139-CVGroup_UIEventLobby_Idle2-1 = "ไม่ได้ทำภารกิจในนาม SRT มานานเลยนะคะ"
10139-CVGroup_UIEventLobby_Idle3-1 = "ถ้าการทำแบบนี้จะช่วยล้างมลทินของพวกฉันได้ละก็..."
10139-CVGroup_UIEventLobby_Idle3-2 = "ฉันจะพยายามอย่างเต็มที่ค่ะ"
10139-CVGroup_UIEventLobby_Idle4-1 = "ปฏิการร่วมกับชาเล่ต์..."
10139-CVGroup_UIEventLobby_Idle4-2 = "รู้สึกคาดหวังในหลายๆ แง่เลยนะคะ ฮุฮุ"
10139-CVGroup_UIEventLobby_Idle5-1 = "ก่อนเริ่มปฏิบัติการ มากินอะไรรองท้องก่อนมั้ยคะ?"
10139-CVGroup_UIEventShop_Enter1-1 = "อ๊ะ คุณครู"
10139-CVGroup_UIEventShop_Enter1-2 = "ถ้าหากว่าสะดวกมาช่วยฉันจัดของหน่อยได้มั้ยคะ?"
10139-CVGroup_UIEventShop_Enter2-1 = "ระเบิดที่เหลือจากปฏิบัติการครั้งก่อน..."
10139-CVGroup_UIEventShop_Enter2-2 = "อ๊ะ เชิญค่ะ คุณครู"
10139-CVGroup_UIEventShop_Idle1-1 = "มีงานอะไรให้ฉันช่วยมั้ยคะ?"
10139-CVGroup_UIEventShop_Idle2-1 = "เฮือก?!"
10139-CVGroup_UIEventShop_Idle2-2 = "หะ... หูฉันไวต่อความรู้สึกมาก...\nอย่าจับได้มั้ยคะ..."
10139-CVGroup_UIEventShop_Buy1-1 = "เลือกได้ยอดเยี่ยมมากค่ะ"
10139-CVGroup_UIEventShop_Buy2-1 = "ขอบคุณค่ะ"
10139-CVGroup_UIEventShop_Buy2-2 = "ถ้าจะแลกของก็เรียกฉันได้ตลอดเลยค่ะ"
10139-CVGroup_UIEventShop_Buy3-1 = "การสนับสนุนจากชาเลต์เป็นประโยชน์เสมอเลยนะคะ"
