[translation]
10139-CVGroup_UITitle_Idle1-1 = "蔚藍檔案。"
10139-CVGroup_CharacterGet_Idle1-1 = "我是SRT特殊學園，FOX小隊的吉野仁子。\n雖然仍有許多不成熟之處，還請您多多指教。"
10139-CVGroup_Cafe_Idle1-1 = "（是炸豆皮的……味道真香……）"
10139-CVGroup_Cafe_Idle2-1 = "方便的話，要不要嚐嚐\n剛做好的豆皮壽司呢？"
10139-CVGroup_Cafe_Idle3-1 = "今天是適合洗衣服的好天氣呢。\n毛毯應該很快就能曬乾。"
10139-CVGroup_Cafe_Idle4-1 = "最近很流行這種東西嗎……？"
10139-CVGroup_Cafe_Idle5-1 = "這種度過假日的方式，好像也不錯……"
10139-CVGroup_WeaponGet_Idle1-1 = "FOX-870式霰彈槍，我確實收下了。\n近距離支援就請交給我吧。"
10139-CVGroup_UIEventLobby_Enter1-1 = "即刻起，開始執行「怪談追蹤作戰」。"
10139-CVGroup_UIEventLobby_Enter2-1 = "恭候多時了，老師。"
10139-CVGroup_UIEventLobby_Enter2-2 = "簡報即將開始。\n請往這邊。"
10139-CVGroup_UIEventLobby_Enter3-1 = "歡迎來到FOX小隊的作戰本部。"
10139-CVGroup_UIEventLobby_Idle1-1 = "消失的人們，究竟去了哪裡呢……"
10139-CVGroup_UIEventLobby_Idle2-1 = "以SRT的身分接受任務，還真是久違了呢。"
10139-CVGroup_UIEventLobby_Idle3-1 = "我會全力以赴的。\n如果這樣……"
10139-CVGroup_UIEventLobby_Idle3-2 = "能夠洗去我們所背負的汙名……"
10139-CVGroup_UIEventLobby_Idle4-1 = "與夏萊的聯合作戰……"
10139-CVGroup_UIEventLobby_Idle4-2 = "真令人期待呢。呵呵。"
10139-CVGroup_UIEventLobby_Idle5-1 = "老師，作戰前要不要先吃一點東西呢？"
10139-CVGroup_UIEventShop_Enter1-1 = "啊，老師。"
10139-CVGroup_UIEventShop_Enter1-2 = "如果方便的話，能請您幫忙整理物資嗎？"
10139-CVGroup_UIEventShop_Enter2-1 = "上次作戰剩下的彈藥……"
10139-CVGroup_UIEventShop_Enter2-2 = "啊，老師。您好。"
10139-CVGroup_UIEventShop_Idle1-1 = "有什麼需要的東西嗎？"
10139-CVGroup_UIEventShop_Idle2-1 = "呀啊！？"
10139-CVGroup_UIEventShop_Idle2-2 = "耳，耳朵很敏感的……不可以摸……"
10139-CVGroup_UIEventShop_Buy1-1 = "我認為是個不錯的選擇。"
10139-CVGroup_UIEventShop_Buy2-1 = "謝謝惠顧。"
10139-CVGroup_UIEventShop_Buy2-2 = "如果是物資交換的話，隨時歡迎。"
10139-CVGroup_UIEventShop_Buy3-1 = "感謝夏萊一直以來的支援。"
