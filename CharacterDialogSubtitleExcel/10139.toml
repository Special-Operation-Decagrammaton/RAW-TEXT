[translation]
10139-CVGroup_UITitle_Idle1-1 = "Blue Archive."
10139-CVGroup_CharacterGet_Idle1-1 = "Yoshino Niko from SRT Academy's FOX Squad. I still have a lot to learn, but I'm looking forward to working with you."
10139-CVGroup_Cafe_Idle1-1 = "(Fried tofu slices... Smells delicious...)"
10139-CVGroup_Cafe_Idle2-1 = "If you don't mind, would you try a piece of the inarizushi I just made?"
10139-CVGroup_Cafe_Idle3-1 = "Today is a good day for laundry. The blankets will dry quickly."
10139-CVGroup_Cafe_Idle4-1 = "...Are these things trending nowadays?"
10139-CVGroup_Cafe_Idle5-1 = "Spending a day off like this...might not be half bad."
10139-CVGroup_WeaponGet_Idle1-1 = "Confirming receipt of the FOX 870-Shotgun. You can count on me for support in the thick of combat."
10139-CVGroup_UIEventLobby_Enter1-1 = "Let Mission Lore Pursuit commence!"
10139-CVGroup_UIEventLobby_Enter2-1 = "We've been waiting, Sensei."
10139-CVGroup_UIEventLobby_Enter2-2 = "We're beginning the briefing now. This way!"
10139-CVGroup_UIEventLobby_Enter3-1 = "Welcome to the FOX Squad operation headquarters."
10139-CVGroup_UIEventLobby_Idle1-1 = "Where could the vanished people be?"
10139-CVGroup_UIEventLobby_Idle2-1 = "It's been a while since I've taken on a mission as an SRT member..."
10139-CVGroup_UIEventLobby_Idle3-1 = "If this can help us build our reputation again..."
10139-CVGroup_UIEventLobby_Idle3-2 = "I'll do whatever I can."
10139-CVGroup_UIEventLobby_Idle4-1 = "A joint operation with Schale..."
10139-CVGroup_UIEventLobby_Idle4-2 = "I'm looking forward to this, for more reason than one. Fufu."
10139-CVGroup_UIEventLobby_Idle5-1 = "Would you like a quick bite before we begin the mission?"
10139-CVGroup_UIEventShop_Enter1-1 = "Ah, Sensei."
10139-CVGroup_UIEventShop_Enter1-2 = "If you don't mind, could you help organize these supplies?"
10139-CVGroup_UIEventShop_Enter2-1 = "Leftover ammo from our last mission..."
10139-CVGroup_UIEventShop_Enter2-2 = "Ah, welcome, Sensei."
10139-CVGroup_UIEventShop_Idle1-1 = "Is there anything I can help you with?"
10139-CVGroup_UIEventShop_Idle2-1 = "E-Eek!"
10139-CVGroup_UIEventShop_Idle2-2 = "M-My ears are sensitive... So please don't touch them..."
10139-CVGroup_UIEventShop_Buy1-1 = "An excellent choice."
10139-CVGroup_UIEventShop_Buy2-1 = "Thank you."
10139-CVGroup_UIEventShop_Buy2-2 = "Just call me whenever you need to exchange supplies."
10139-CVGroup_UIEventShop_Buy3-1 = "Schale's support is always a huge help."
