[translation]
10146-CVGroup_UITitle_Idle1-1 = "คิกคิกคิก... Blue~ Archive"
10146-CVGroup_CharacterGet_Idle1-1 = "คนมีความสามารถนี่ไม่มีเวลาพักผ่อนตามสบายเลยสินะ\nต้องการความช่วยเหลือจากท่านมาโคโตะผู้นี้ล่ะสิ?"
10146-CVGroup_Cafe_Idle1-1 = "ต้องเอานี่ไปไว้ที่แพนเดโมเนียม โซไซตี้สักอันแล้ว"
10146-CVGroup_Cafe_Idle2-1 = "ฮุฮุ รู้สึกได้ถึงสายตาที่มองมาด้วยความชื่นชมเลยนะ"
10146-CVGroup_Cafe_Idle3-1 = "ที่ชาเล่ต์ก็ด้วยเหรอ...? อ่า เป็นคนดังนี่ลำบากจริงๆ"
10146-CVGroup_Cafe_Idle4-1 = "ครูยืนกรานจะใช้สถานที่คับแคบแบบนี้ไปทำไมกัน..."
10146-CVGroup_Cafe_Idle5-1 = "ตั้งที่ทำการย่อยของแพนเดโมเนียม โซไซตี้\nที่ชายหาดก็ดูไม่เลวนะ"
10146-CVGroup_WeaponGet_Idle1-1 = "ครู เราไขว่คว้าทุกสิ่งที่ปรารถนามาได้แล้ว เพราะงั้น\nความคิดของพวกยอมแพ้ที่ว่า 'คราวนี้ไม่ไหวแน่'\nเราไม่คิดจะมีติดตัวแม้แต่นิดเดียว ตอนนี้ขอพอใจเท่านี้\nแต่ว่านะ สักวันหนึ่งจะต้อง..."
10146-CVGroup_UIEventLobby_Enter1-1 = "นะ..."
10146-CVGroup_UIEventLobby_Enter1-2 = "นี่มัน... เกิดอะไรขึ้นกันแน่?!"
10146-CVGroup_UIEventLobby_Enter2-1 = "มะ... ไม่ได้ตกใจเลยสักนิด"
10146-CVGroup_UIEventLobby_Enter2-2 = "ทุกอย่างกำลังเป็นไปตามแผนของเราอยู่แล้ว อืม!"
10146-CVGroup_UIEventLobby_Enter3-1 = "ยัยอิโรฮะ... แค่เรื่องจิ๊บจ๊อยแค่นั้น\nจะเอาจนถึงเมื่อไรกัน..."
10146-CVGroup_UIEventLobby_Enter4-1 = "เย้~! ยินดีต้อนรับสู่เรือแมน ออฟ แพนเดโมเนียม!\nโยะโฮโฮโฮ!"
10146-CVGroup_UIEventLobby_Enter5-1 = "อ้อ ครู สนุกกับการท่องเที่ยวอยู่หรือเปล่า?"
10146-CVGroup_UIEventLobby_Enter5-2 = "คิกคิกคิก! ถูกต้องตามที่เราคาดไว้จริงๆ!"
10146-CVGroup_UIEventLobby_Enter5-3 = "สุดท้ายแล้ว ทุกอย่างก็ไปได้สวยไม่ใช่เหรอ!"
10146-CVGroup_UIEventLobby_Idle1-1 = "คะ... ครู ขอโทษนะ แต่อย่ายุ่งกับเราเลยจะดีกว่า"
10146-CVGroup_UIEventLobby_Idle1-2 = "ระ... เราเมาเรือ เลยรู้สึกคลื่นไส้..."
10146-CVGroup_UIEventLobby_Idle2-1 = "ชิ เพราะแบบนี้แหละ เราถึงไม่ค่อยอยากมาทะเล"
10146-CVGroup_UIEventLobby_Idle2-2 = "ไม่สิ ถึงแม้คนวางแผนทริปนี้จะเป็นเราก็เถอะ..."
10146-CVGroup_UIEventLobby_Idle2-3 = "อ๊ะ! แต่ว่า! ถ้าครูก็ได้เห็นว่าอิบูกิชอบใจแค่ไหน\nตอนดูการ์ตูนปลาเรื่องนั้นละก็!\nถ้าครูได้ดูด้วยคนละก็!"
10146-CVGroup_UIEventLobby_Idle3-1 = "ตั้งแต่เมื่อกี้แล้วนะ ทำไมถึงเอาแต่มองเราล่ะ...?"
10146-CVGroup_UIEventLobby_Idle3-2 = "อ๊ะ! หรือว่าจะเป็นอย่างนั้น! เมื่อตกอยู่ในสถานการณ์คับขัน\nในที่สุดก็ล่วงรู้ความในใจของตัวเองแล้วงั้นเหรอ?!"
10146-CVGroup_UIEventLobby_Idle3-3 = "ดะ... เดี๋ยวก่อน เรายังไม่ได้เตรียมใจเลย!"
10146-CVGroup_UIEventLobby_Idle4-1 = "ยัยอิโรฮะ... ไม่คิดเลยว่าจะเล่นโซเชียลมีเดียอยู่ด้วย"
10146-CVGroup_UIEventLobby_Idle4-2 = "ว่าแต่ทำไมยังไม่มาติดตาม\nบัญชีแพนเดโมเนียม โซไซตี้ของเราล่ะ?"
10146-CVGroup_UIEventMiniGameMission_Enter1-1 = "ผลงานย่อมได้รับผลตอบแทนเป็นธรรมดา"
10146-CVGroup_UIEventMiniGameMission_Enter1-2 = "นี่แหละคือพื้นฐานของศิลปะการใช้คน"
10146-CVGroup_UIEventMiniGameMission_Enter2-1 = "มาก็ดีเลย ครู! ที่นี่มีงานต้องทำเพียบเลย!"
10146-CVGroup_UIEventMiniGameMission_Enter2-2 = "บางทีครูอาจช่วยเราได้นิดหน่อยนะ"
10146-CVGroup_UIEventMiniGameMission_Idle1-1 = "เรารู้ดีอยู่เต็มอกว่าเรามีเสน่ห์"
10146-CVGroup_UIEventMiniGameMission_Idle1-2 = "แต่ตอนนี้ต้องมีสมาธิกับภารกิจและผลตอบแทนต่างหาก"
10146-CVGroup_UIEventMiniGameMission_Idle2-1 = "ถึงจะบอกว่าการสัมผัสตัวกันพอประมาณ\nจะช่วยเพิ่มความสนิทสนม..."
10146-CVGroup_UIEventMiniGameMission_Idle2-2 = "...แต่เราก็เขินอายเป็นเหมือนกันนะ"
10146-CVGroup_UIEventMiniGameMission_Buy1-1 = "บางทีเราก็คิดว่า... ทั้งหมดนี้อาจเป็นแค่\nความฝันในคืนฤดูร้อนหรือเปล่า"
10146-CVGroup_UIEventMiniGameMission_Buy1-2 = "แต่ก็คงไม่มีทางเป็นแบบนั้นหรอก! คิกคิกคิก!"
10146-CVGroup_UIEventMiniGameMission_Buy2-1 = "การจัดการงานของครูนั้นยอดเยี่ยมจริงๆ"
10146-CVGroup_UIEventMiniGameMission_Buy2-2 = "ยิ่งรู้จัก ก็ยิ่งเป็นคนที่อยากเก็บไว้ข้างกายนะ"
10146-CVGroup_UIEventMiniGameMission_Interaction1-1 = "ไม่มีอะไรที่ปังกว่านี้ ทำทีเดียวจบ\nแล้วได้กำไรก้อนโตบ้างเหรอ?"
10146-CVGroup_UIEventMiniGameMission_Interaction1-2 = "การทำอย่างสม่ำเสมอทุกวันก็สำคัญอยู่หรอก..."
