[translation]
10146-CVGroup_UITitle_Idle1-1 = "嘻嘻嘻……蔚藍～檔案。"
10146-CVGroup_CharacterGet_Idle1-1 = "唉……太過優秀的人，連片刻的休息都不被允許啊。\n就讓我真琴大人助你一臂之力吧，老師。"
10146-CVGroup_Cafe_Idle1-1 = "在萬魔殿也放個一樣的吧。"
10146-CVGroup_Cafe_Idle2-1 = "呵。看來是被真琴大人的氣場震懾住了呢。"
10146-CVGroup_Cafe_Idle3-1 = "這也是與生俱來的天賦嗎？"
10146-CVGroup_Cafe_Idle4-1 = "老師他，為什麼偏愛這種狹窄的地方……？"
10146-CVGroup_Cafe_Idle5-1 = "在海邊蓋座萬魔殿的分館也不錯。"
10146-CVGroup_WeaponGet_Idle1-1 = "老師啊……我呢，已經把想要的東西全都拿到手了。\n真琴大人的字典裡，沒有失敗和不可能這幾個字。\n現在就先滿足於此……但總有一天，我一定會……"
10146-CVGroup_UIEventLobby_Enter1-1 = "這……"
10146-CVGroup_UIEventLobby_Enter1-2 = "……這到底是怎麼回事！？"
10146-CVGroup_UIEventLobby_Enter2-1 = "我，我一點也不慌。"
10146-CVGroup_UIEventLobby_Enter2-2 = "因為一切都正在按照計畫進行啊！"
10146-CVGroup_UIEventLobby_Enter3-1 = "伊呂波那傢伙……\n為了那點小事，到底要鬧到什麼時候……"
10146-CVGroup_UIEventLobby_Enter4-1 = "啊～！歡迎登上萬魔殿之人號！\n喲呵呵！"
10146-CVGroup_UIEventLobby_Enter5-1 = "啊啊，老師。\n航海還愉快嗎？"
10146-CVGroup_UIEventLobby_Enter5-2 = "嘻嘻嘻！一切都在預料之中！"
10146-CVGroup_UIEventLobby_Enter5-3 = "這不是萬事都很順利嗎！"
10146-CVGroup_UIEventLobby_Idle1-1 = "老，老師。\n抱歉，希望你別碰我。"
10146-CVGroup_UIEventLobby_Idle1-2 = "我，我暈船暈得很嚴重……唔。"
10146-CVGroup_UIEventLobby_Idle2-1 = "嗚嗚……所以我才不想來海邊啊。"
10146-CVGroup_UIEventLobby_Idle2-2 = "雖然計畫的……是我真琴大人……唔。"
10146-CVGroup_UIEventLobby_Idle2-3 = "不過，伊吹迷上那部魚的電影之後高興的模樣！\n真想讓老師也看看啊！"
10146-CVGroup_UIEventLobby_Idle3-1 = "為什麼要一直碰我啊……？"
10146-CVGroup_UIEventLobby_Idle3-2 = "原來如此，是這麼回事啊！\n因為身處極限狀態，才終於察覺到了真正的心意吧？"
10146-CVGroup_UIEventLobby_Idle3-3 = "不過先等一下……我還沒做好心理準備。"
10146-CVGroup_UIEventLobby_Idle4-1 = "伊呂波那傢伙……沒想到竟然有在玩社群網站。"
10146-CVGroup_UIEventLobby_Idle4-2 = "可是為什麼，他沒有追蹤萬魔殿的帳號呢？"
10146-CVGroup_UIEventMiniGameMission_Enter1-1 = "正確的行為就該有報酬。"
10146-CVGroup_UIEventMiniGameMission_Enter1-2 = "這是身為上位者理所當然的思維。"
10146-CVGroup_UIEventMiniGameMission_Enter2-1 = "你來得正好，老師！要做的事可多著呢！"
10146-CVGroup_UIEventMiniGameMission_Enter2-2 = "一件一件幫我處理吧！"
10146-CVGroup_UIEventMiniGameMission_Idle1-1 = "真琴大人魅力十足這件事，我非～常清楚。"
10146-CVGroup_UIEventMiniGameMission_Idle1-2 = "不過，現在是專注於任務的時候。"
10146-CVGroup_UIEventMiniGameMission_Idle2-1 = "適度的肢體接觸固然重要──"
10146-CVGroup_UIEventMiniGameMission_Idle2-2 = "──但我也是有羞恥心的啊。"
10146-CVGroup_UIEventMiniGameMission_Buy1-1 = "……有時，腦海裡會突然閃過一個念頭。\n這一切該不會都只是夏夜之夢吧。"
10146-CVGroup_UIEventMiniGameMission_Buy1-2 = "算了，怎麼可能會有那種事嘛！嘻嘻嘻！"
10146-CVGroup_UIEventMiniGameMission_Buy2-1 = "真是相當出色的工作表現。"
10146-CVGroup_UIEventMiniGameMission_Buy2-2 = "越是了解老師，就越想把你留在身邊呢。"
10146-CVGroup_UIEventMiniGameMission_Interaction1-1 = "只有這些嗎？"
10146-CVGroup_UIEventMiniGameMission_Interaction1-2 = "雖然日復一日的努力也很重要……"
