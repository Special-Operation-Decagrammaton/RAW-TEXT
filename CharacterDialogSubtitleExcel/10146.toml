[translation]
10146-CVGroup_UITitle_Idle1-1 = "Kihehe... Blue Archive."
10146-CVGroup_CharacterGet_Idle1-1 = "*sigh* Seems like competent people don't get time to kick back and relax. You need help from me, the Great Makoto, right?"
10146-CVGroup_Cafe_Idle1-1 = "I should put one of these in Pandemonium Society too."
10146-CVGroup_Cafe_Idle2-1 = "Hmph. I can feel the gaze of someone looking up at me."
10146-CVGroup_Cafe_Idle3-1 = "Even at Schale...? Being famous is such a hassle."
10146-CVGroup_Cafe_Idle4-1 = "I wonder why Sensei would insist on a cramped place like this..."
10146-CVGroup_Cafe_Idle5-1 = "It might not be a bad idea to set up Pandemonium Society's branch office on the beach."
10146-CVGroup_WeaponGet_Idle1-1 = "I've achieved everything I've ever desired, Sensei. Therefore, I will never give up or let myself think that I'm at the end of the line. I'm content with this for now, but one day..."
10146-CVGroup_UIEventLobby_Enter1-1 = "...How."
10146-CVGroup_UIEventLobby_Enter1-2 = "...How could this happen?!"
10146-CVGroup_UIEventLobby_Enter2-1 = "I-I was not flustered at all."
10146-CVGroup_UIEventLobby_Enter2-2 = "Everything's going according to my plan, hmm!"
10146-CVGroup_UIEventLobby_Enter3-1 = "Iroha... Just how long is she going to drag this out?"
10146-CVGroup_UIEventLobby_Enter4-1 = "Yarrgh! Welcome aboard the Man o' Pandemonium! Yohohoho!"
10146-CVGroup_UIEventLobby_Enter5-1 = "Ah, Sensei, are you enjoying the trip?"
10146-CVGroup_UIEventLobby_Enter5-2 = "Kihehe! Just as I expected!"
10146-CVGroup_UIEventLobby_Enter5-3 = "Everything worked out in the end!"
10146-CVGroup_UIEventLobby_Idle1-1 = "S-Sensei. Sorry, but please leave me alone."
10146-CVGroup_UIEventLobby_Idle1-2 = "Th-The seasickness is making me feel..."
10146-CVGroup_UIEventLobby_Idle2-1 = "Tch, this is why I didn't want to sail the seas."
10146-CVGroup_UIEventLobby_Idle2-2 = "Sure, yes, I'm the one who planned this trip, but..."
10146-CVGroup_UIEventLobby_Idle2-3 = "Ah! But Ibuki was so happy when she saw that fish cartoon... You should've seen it too!"
10146-CVGroup_UIEventLobby_Idle3-1 = "Why do you keep poking me...?"
10146-CVGroup_UIEventLobby_Idle3-2 = "Ah! Could it be?! Have you finally realized your true feelings after being pushed to the limit?!"
10146-CVGroup_UIEventLobby_Idle3-3 = "W-Wait! I am not mentally ready yet!"
10146-CVGroup_UIEventLobby_Idle4-1 = "Iroha... I can't believe she's on social media."
10146-CVGroup_UIEventLobby_Idle4-2 = "Then why isn't she following my Pandemonium Society account?"
10146-CVGroup_UIEventMiniGameMission_Enter1-1 = "It is only befitting that achievements be rewarded."
10146-CVGroup_UIEventMiniGameMission_Enter1-2 = "Such is the foundation of the military arts."
10146-CVGroup_UIEventMiniGameMission_Enter2-1 = "Welcome, Sensei! There's plenty of work to be done!"
10146-CVGroup_UIEventMiniGameMission_Enter2-2 = "Perhaps you could lend a hand, Sensei."
10146-CVGroup_UIEventMiniGameMission_Idle1-1 = "I understand that I am very attractive."
10146-CVGroup_UIEventMiniGameMission_Idle1-2 = "But now is the time to focus on the mission and rewards."
10146-CVGroup_UIEventMiniGameMission_Idle2-1 = "They say appropriate physical contact fosters a sense of closeness..."
10146-CVGroup_UIEventMiniGameMission_Idle2-2 = "...But even I have a sense of shame."
10146-CVGroup_UIEventMiniGameMission_Buy1-1 = "...Sometimes, I find myself thinking. Perhaps this is all a midsummer night's dream."
10146-CVGroup_UIEventMiniGameMission_Buy1-2 = "Well, there's no way! Kihehe!"
10146-CVGroup_UIEventMiniGameMission_Buy2-1 = "The way you handle work is truly incredible, Sensei."
10146-CVGroup_UIEventMiniGameMission_Buy2-2 = "The more I learn about you, the more I want you by my side."
10146-CVGroup_UIEventMiniGameMission_Interaction1-1 = "Isn't there something with a bigger jackpot?"
10146-CVGroup_UIEventMiniGameMission_Interaction1-2 = "Daily consistency is important, but..."
