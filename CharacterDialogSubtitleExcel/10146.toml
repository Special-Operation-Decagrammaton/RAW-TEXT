[translation]
10146-CVGroup_UITitle_Idle1-1 = "キキキッ……ブルーアーカイブ、だ。"
10146-CVGroup_CharacterGet_Idle1-1 = "はぁ……優秀過ぎる者は、一時の休息も許されないのだな。\nこのマコト様が手を貸してやろう、先生。"
10146-CVGroup_Cafe_Idle1-1 = "万魔殿にも同じものを置くしよう。"
10146-CVGroup_Cafe_Idle2-1 = "ふっ。マコト様のオーラに圧倒されているようだな。"
10146-CVGroup_Cafe_Idle3-1 = "これも持って生まれたもの、ということか。"
10146-CVGroup_Cafe_Idle4-1 = "先生は、なぜこのような狭苦しい場所を好むんだ……？"
10146-CVGroup_Cafe_Idle5-1 = "海辺に万魔殿の分館を建てても良いな。"
10146-CVGroup_WeaponGet_Idle1-1 = "先生よ……私は、欲しいと願ったものは全て手に入れてきた。\nマコト様の辞書に、敗北も不可能の文字も無いのだ。\n今はこれで満足してやるが……いつか、必ず……。"
10146-CVGroup_UIEventLobby_Enter1-1 = "……いっ。"
10146-CVGroup_UIEventLobby_Enter1-2 = "……一体どうなっているんだ！？"
10146-CVGroup_UIEventLobby_Enter2-1 = "ま、まったく慌ててなどいない。"
10146-CVGroup_UIEventLobby_Enter2-2 = "全て計画通りに進んでいるのだからな！"
10146-CVGroup_UIEventLobby_Enter3-1 = "イロハのやつ……あの程度のことで、一体いつまで……。"
10146-CVGroup_UIEventLobby_Enter4-1 = "あ～！マン・オブ・パンデモニウムにようこそ！ヨーホホ！"
10146-CVGroup_UIEventLobby_Enter5-1 = "ああ、先生。航海は楽しんでいるか？"
10146-CVGroup_UIEventLobby_Enter5-2 = "キキキッ！全て予想通りだったな！"
10146-CVGroup_UIEventLobby_Enter5-3 = "万事うまくいったではないか！"
10146-CVGroup_UIEventLobby_Idle1-1 = "せ、先生。悪いが触らないでもらいたい。"
10146-CVGroup_UIEventLobby_Idle1-2 = "ふ、船酔いがひどくて……うっ。"
10146-CVGroup_UIEventLobby_Idle2-1 = "うう……だから海に来たくなかったんだ。"
10146-CVGroup_UIEventLobby_Idle2-2 = "計画したのは……マコト様だが……うっ。"
10146-CVGroup_UIEventLobby_Idle2-3 = "だが、魚の映画に夢中のイブキの喜びようときたら！\n先生にも見せてやりたかった！"
10146-CVGroup_UIEventLobby_Idle3-1 = "なぜ何度も触るんだ……？"
10146-CVGroup_UIEventLobby_Idle3-2 = "そうか、そういうことか！\n極限状態に身を置くことで、本当の気持ちに気づいたんだな？"
10146-CVGroup_UIEventLobby_Idle3-3 = "しかし待ってくれ……まだ、心の準備ができていない。"
10146-CVGroup_UIEventLobby_Idle4-1 = "イロハのやつ……まさかSNSをしているとはな。"
10146-CVGroup_UIEventLobby_Idle4-2 = "しかしなぜ、万魔殿のアカウントをフォローしていないのだ？"
10146-CVGroup_UIEventMiniGameMission_Enter1-1 = "正しき行いには報酬を。"
10146-CVGroup_UIEventMiniGameMission_Enter1-2 = "それが上に立つ者として当然の考えだ。"
10146-CVGroup_UIEventMiniGameMission_Enter2-1 = "よくぞ来てくれたな、先生！やるべきことは多いぞ！"
10146-CVGroup_UIEventMiniGameMission_Enter2-2 = "一つずつ手伝ってくれ！"
10146-CVGroup_UIEventMiniGameMission_Idle1-1 = "マコト様が魅力的であることは、よーく分かっている。"
10146-CVGroup_UIEventMiniGameMission_Idle1-2 = "しかし、今は任務に集中する時だ。"
10146-CVGroup_UIEventMiniGameMission_Idle2-1 = "適度なスキンシップは大切だが――"
10146-CVGroup_UIEventMiniGameMission_Idle2-2 = "――私にだって、羞恥心はあるのだぞ。"
10146-CVGroup_UIEventMiniGameMission_Buy1-1 = "……不意に、脳裏を過ぎる考えがある。\n全て夏の夜の夢なのではないか、と。"
10146-CVGroup_UIEventMiniGameMission_Buy1-2 = "まあ、そんなことはないのだがな！キキキッ！"
10146-CVGroup_UIEventMiniGameMission_Buy2-1 = "実に素晴らしい仕事ぶりだ。"
10146-CVGroup_UIEventMiniGameMission_Buy2-2 = "先生のことを知れば知るほど、そばに置いておきたくなるな。"
10146-CVGroup_UIEventMiniGameMission_Interaction1-1 = "これだけか？"
10146-CVGroup_UIEventMiniGameMission_Interaction1-2 = "日々の努力も肝要ではあるが……。"
