[translation]
10146-CVGroup_UITitle_Idle1-1 = "키키킷…… 블루~ 아카이브다."
10146-CVGroup_CharacterGet_Idle1-1 = "유능한 사람은 느긋히 쉴 시간도 없군.\n이 마코토 님의 도움이 필요한 거겠지?"
10146-CVGroup_Cafe_Idle1-1 = "이건 만마전에도 하나 비치해야겠군."
10146-CVGroup_Cafe_Idle2-1 = "훗. 우러러 보는 시선이 느껴지는군."
10146-CVGroup_Cafe_Idle3-1 = "샬레에서까지……? 아아, 유명인은 괴롭군."
10146-CVGroup_Cafe_Idle4-1 = "선생은 대체 왜 이런 비좁은 장소를 고집하는지……."
10146-CVGroup_Cafe_Idle5-1 = "해변에 만마전 분관을 세우는 것도 나쁘지 않겠군."
10146-CVGroup_WeaponGet_Idle1-1 = "선생이여, 이 몸은 원하는 것은 뭐든\n쟁취했다. 그러니, 이번에는 안 된다,\n같은 패배주의적 사고는 추호도 가질\n생각이 없다. 지금은, 이것으로 만족하지.\n하지만, 언젠가 반드시……."
10146-CVGroup_UIEventLobby_Enter1-1 = "……도."
10146-CVGroup_UIEventLobby_Enter1-2 = "……도대체\n어떻게 된 일이냐?!"
10146-CVGroup_UIEventLobby_Enter2-1 = "저, 전혀\n당황하지 않았다."
10146-CVGroup_UIEventLobby_Enter2-2 = "전부 이 몸의 계획대로\n되고 있으니까, 음!"
10146-CVGroup_UIEventLobby_Enter3-1 = "이로하 녀석……\n고작 그까짓 일로,\n도대체 언제까지……."
10146-CVGroup_UIEventLobby_Enter4-1 = "앓~!\n맨 오브 판데모니움에\n승선한 것을 환영한다!\n요호호호!"
10146-CVGroup_UIEventLobby_Enter5-1 = "아아, 선생,\n여행은 즐기고 있나?"
10146-CVGroup_UIEventLobby_Enter5-2 = "키히힛!\n역시 이 몸의\n예상이 맞았군!"
10146-CVGroup_UIEventLobby_Enter5-3 = "결국,\n다 잘되지 않았느냐!"
10146-CVGroup_UIEventLobby_Idle1-1 = "서, 선생.\n미안하지만 건드리지\n말아줬으면 한다."
10146-CVGroup_UIEventLobby_Idle1-2 = "배, 뱃멀미\n때문에 속이……."
10146-CVGroup_UIEventLobby_Idle2-1 = "쯧, 이래서 바다는\n별로 오고 싶지 않았거늘."
10146-CVGroup_UIEventLobby_Idle2-2 = "아니, 물론, 여행 계획을\n세운 건 이 몸이기는\n하지만……."
10146-CVGroup_UIEventLobby_Idle2-3 = "아아! 그치만!\n이부키가\n그 물고기 만화를\n보고 얼마나 좋아했는지\n선생도 봤으면!"
10146-CVGroup_UIEventLobby_Idle3-1 = "아까부터 왜 자꾸\n이 몸을……?"
10146-CVGroup_UIEventLobby_Idle3-2 = "앗! 혹시 그것인가!\n극한 상황에 이르러,\n마침내 자신의 본심을\n깨달은 건가?!"
10146-CVGroup_UIEventLobby_Idle3-3 = "자, 잠깐, 아직 이 몸은\n마음의 준비가!"
10146-CVGroup_UIEventLobby_Idle4-1 = "이로하 녀석……\n설마 SNS를 하고\n있을 줄은."
10146-CVGroup_UIEventLobby_Idle4-2 = "그런데 왜 이 몸의\n만마전 계정에는 팔로우\n되어 있지 않은 거지?"
10146-CVGroup_UIEventMiniGameMission_Enter1-1 = "성과에는 보상이 주어져야 하는 법이지."
10146-CVGroup_UIEventMiniGameMission_Enter1-2 = "용병술의 기초라는 것이다."
10146-CVGroup_UIEventMiniGameMission_Enter2-1 = "잘 왔다, 선생! 여기는 해야할 일이 잔뜩이지!"
10146-CVGroup_UIEventMiniGameMission_Enter2-2 = "어쩌면 선생이 좀 거들어 줄 수 있겠군."
10146-CVGroup_UIEventMiniGameMission_Idle1-1 = "이 몸이 매력적이라는 건 충분히 이해한다."
10146-CVGroup_UIEventMiniGameMission_Idle1-2 = "하지만, 지금은 임무와 보상에 집중할 때다."
10146-CVGroup_UIEventMiniGameMission_Idle2-1 = "적절한 스킨십은 친애감을 늘려준다고는 하지만……."
10146-CVGroup_UIEventMiniGameMission_Idle2-2 = "……이 몸도 부끄러움을 아는 사람이다."
10146-CVGroup_UIEventMiniGameMission_Buy1-1 = "……가끔씩, 이 몸은 생각한다.이 모든 것이 한여름 밤의 꿈은 아닐지."
10146-CVGroup_UIEventMiniGameMission_Buy1-2 = "뭐, 그럴 리 없지만! 키시싯!"
10146-CVGroup_UIEventMiniGameMission_Buy2-1 = "선생의 일 처리는 정말로 훌륭하다."
10146-CVGroup_UIEventMiniGameMission_Buy2-2 = "알면 알수록 곁에 두고 싶어지는 사람이로군."
10146-CVGroup_UIEventMiniGameMission_Interaction1-1 = "좀 더 한 방에 대박이 터지는 건 없는 건가?"
10146-CVGroup_UIEventMiniGameMission_Interaction1-2 = "매일 꾸준한 것도 중요하긴 하지만……."
