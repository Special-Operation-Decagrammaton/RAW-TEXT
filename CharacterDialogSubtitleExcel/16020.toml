[translation]
16020-CVGroup_UITitle_Idle1-1 = "Blue Archive!"
16020-CVGroup_CharacterGet_Idle1-1 = "Oh, how've you been? I guess this is the first time we're formally meeting. I'm Tenjinyama Otogi, sniper of the FOX Squad. Look forward to working with you."
16020-CVGroup_Cafe_Idle1-1 = "(Sleepy... Need some coffee...)"
16020-CVGroup_Cafe_Idle2-1 = "...Nice! Maybe I'll get a little strength training in."
16020-CVGroup_Cafe_Idle3-1 = "Whoa, now isn't everyone full of spirit?"
16020-CVGroup_Cafe_Idle4-1 = "(I think I recognize that person from the Corrections Bureau...)"
16020-CVGroup_Cafe_Idle5-1 = "Oh, new Fruitjellies merch. I'll just snap a pic for now."
16020-CVGroup_WeaponGet_Idle1-1 = "Confirming receipt for FOX 82-Sniper Rifle. With this baby, my range and accuracy is unbeatable... But it sure does do a number on my shoulder after a while."
16020-CVGroup_UIEventLobby_Enter1-1 = "So the mission's finally starting..."
16020-CVGroup_UIEventLobby_Enter1-2 = "I'm getting pumped!"
16020-CVGroup_UIEventLobby_Enter2-1 = "I've been waiting for you. We can't start the mission without you, Sensei."
16020-CVGroup_UIEventLobby_Idle1-1 = "Mission Lore Pursuit..."
16020-CVGroup_UIEventLobby_Idle1-2 = "Can you really track down \"lore,\" though?"
16020-CVGroup_UIEventLobby_Idle2-1 = "Hm? You called me?"
16020-CVGroup_UIEventLobby_Idle3-1 = "Niko's inarizushi is always so good."
16020-CVGroup_UIEventLobby_Idle4-1 = "I'm worried about Yukino..."
16020-CVGroup_UIEventLobby_Idle4-2 = "I wonder if she's still hanging onto her regrets..."
16020-CVGroup_UIEventMission_Enter1-1 = "Ah, Sensei. Perfect timing."
16020-CVGroup_UIEventMission_Enter1-2 = "I have a list of occurrences I wanted to ask you about."
16020-CVGroup_UIEventMission_Enter2-1 = "Ah, do you have a minute?"
16020-CVGroup_UIEventMission_Enter2-2 = "I've got a few things I want to ask you about."
16020-CVGroup_UIEventMission_Idle1-1 = "Hm? Why are you staring at my hair?"
16020-CVGroup_UIEventMission_Idle1-2 = "What're you thinking?"
16020-CVGroup_UIEventMission_Idle1-3 = "Ahhh, my hair can get caught on things in tight spaces."
16020-CVGroup_UIEventMission_Idle1-4 = "So I braid it daily."
16020-CVGroup_UIEventMission_Idle1-5 = "It's a pain, so I've thought about cutting it..."
16020-CVGroup_UIEventMission_Idle1-6 = "But it felt like a shame after I've already grown it out this much."
16020-CVGroup_UIEventMission_Idle2-1 = "Wh-Whoa?! Could you NOT poke me?!"
16020-CVGroup_UIEventMission_Idle2-2 = "...I don't like unexpected ambushes."
16020-CVGroup_UIEventMission_Buy1-1 = "Hmm... I see."
16020-CVGroup_UIEventMission_Buy1-2 = "So there was an explanation for all those rumors."
16020-CVGroup_UIEventMission_Buy2-1 = "You're already done? Wow...That was fast."
16020-CVGroup_UIEventMission_Buy2-2 = "With those skills, maybe I should start calling you Commander."
16020-CVGroup_UIEventMission_Interaction1-1 = "Hm, that's enough for today. Good work!"
