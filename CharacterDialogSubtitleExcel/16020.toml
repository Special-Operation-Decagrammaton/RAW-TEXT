[translation]
16020-CVGroup_UITitle_Idle1-1 = "蔚藍檔案！"
16020-CVGroup_CharacterGet_Idle1-1 = "呀啊！過得好嗎？\n像這樣正式打招呼還是第一次呢。\nFOX小隊的狙擊手，天神山御伽。\n今後請多指教囉，老師。"
16020-CVGroup_Cafe_Idle1-1 = "（好睏……有沒有咖啡啊……）"
16020-CVGroup_Cafe_Idle2-1 = "好！趁現在來做點肌力訓練吧。"
16020-CVGroup_Cafe_Idle3-1 = "哦哦……幹勁滿滿呢……"
16020-CVGroup_Cafe_Idle4-1 = "（好像在矯正局看過的樣子……？）"
16020-CVGroup_Cafe_Idle5-1 = "啊，這個是《Full Jelly》的新周邊嗎。\n我要拍下來～"
16020-CVGroup_WeaponGet_Idle1-1 = "FOX-82式狙擊步槍，我收下了哦。\n超長距離狙擊和擊破障礙物都再適合不過了……。\n不過，連續射擊的話肩膀會痠呢。"
16020-CVGroup_UIEventLobby_Enter1-1 = "作戰終於要開始了啊……"
16020-CVGroup_UIEventLobby_Enter1-2 = "打起精神來吧～！"
16020-CVGroup_UIEventLobby_Enter2-1 = "我等你很久了哦。\n畢竟老師不在的話就沒辦法開始嘛。"
16020-CVGroup_UIEventLobby_Idle1-1 = "「怪談追蹤作戰」啊……"
16020-CVGroup_UIEventLobby_Idle1-2 = "話說回來，怪談是能用眼睛追蹤的嗎？"
16020-CVGroup_UIEventLobby_Idle2-1 = "嗯？怎麼了嗎？"
16020-CVGroup_UIEventLobby_Idle3-1 = "仁子做的豆皮壽司真是極品呢。\n不管什麼時候吃都好吃。"
16020-CVGroup_UIEventLobby_Idle4-1 = "雪乃他……還好嗎……"
16020-CVGroup_UIEventLobby_Idle4-2 = "好像還有點放不下之前的事的樣子呢。"
16020-CVGroup_UIEventMission_Enter1-1 = "啊，老師。來得正好。"
16020-CVGroup_UIEventMission_Enter1-2 = "我想請教你一些跟事件有關的事。"
16020-CVGroup_UIEventMission_Enter2-1 = "啊，可以打擾一下嗎……"
16020-CVGroup_UIEventMission_Enter2-2 = "我有幾件事想拜託你。"
16020-CVGroup_UIEventMission_Idle1-1 = "嗯？一直盯著我的頭髮，怎麼了嗎？"
16020-CVGroup_UIEventMission_Idle1-2 = "有什麼在意的地方嗎？"
16020-CVGroup_UIEventMission_Idle1-3 = "啊啊……因為在狹窄的地方，頭髮要是被勾到就麻煩了嘛。"
16020-CVGroup_UIEventMission_Idle1-4 = "所以才會像這樣綁起來。"
16020-CVGroup_UIEventMission_Idle1-5 = "乾脆剪掉好了～是有這麼想過啦……"
16020-CVGroup_UIEventMission_Idle1-6 = "不過難得留這麼長了，要剪掉也有點捨不得。"
16020-CVGroup_UIEventMission_Idle2-1 = "唔哇！別戳我啦！？"
16020-CVGroup_UIEventMission_Idle2-2 = "……我不太習慣呢。\n像這樣有人站在身後。"
16020-CVGroup_UIEventMission_Buy1-1 = "嘿……原來如此啊。"
16020-CVGroup_UIEventMission_Buy1-2 = "確實，有成為傳聞的理由呢。"
16020-CVGroup_UIEventMission_Buy2-1 = "已經結束了嗎？\n……真快呢。好厲害啊。"
16020-CVGroup_UIEventMission_Buy2-2 = "叫你「指揮官」會不會比較好呢？"
16020-CVGroup_UIEventMission_Interaction1-1 = "今天到這裡就差不多了吧。\n辛苦了！"
