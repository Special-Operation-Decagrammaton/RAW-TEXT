[translation]
10145-CVGroup_UITitle_Idle1-1 = "Blue Archive. *sigh*"
10145-CVGroup_CharacterGet_Idle1-1 = "*sigh* The sun beats down mercilessly. Now, Sensei, this way..."
10145-CVGroup_Cafe_Idle1-1 = "Hm. The weather is rather interesting."
10145-CVGroup_Cafe_Idle2-1 = "Huh, isn't that...? Fascinating."
10145-CVGroup_Cafe_Idle3-1 = "This must also be \"resting.\" Pleasant."
10145-CVGroup_Cafe_Idle4-1 = "(Is there any place I could lie down for just a moment?)"
10145-CVGroup_Cafe_Idle5-1 = "Coffee with milk... I do enjoy it, however, Saya has advised against it."
10145-CVGroup_WeaponGet_Idle1-1 = "What do you think resides between us, Sensei? I...believe it is our everlasting bond."
10145-CVGroup_UIEventLobby_Enter1-1 = "Now then, it is summer. As well as a vacation."
10145-CVGroup_UIEventLobby_Enter1-2 = "While I can't pretend to know your thoughts..."
10145-CVGroup_UIEventLobby_Enter1-3 = "Don't you know I myself am quite excited?"
10145-CVGroup_UIEventLobby_Enter2-1 = "A wonderful valley."
10145-CVGroup_UIEventLobby_Enter2-2 = "The scenery, in particular."
10145-CVGroup_UIEventLobby_Enter2-3 = "Before nature, humans..."
10145-CVGroup_UIEventLobby_Enter2-4 = "...are such infinitely small creatures."
10145-CVGroup_UIEventLobby_Enter3-1 = "Sensei! Kiki would go anywhere as long as it's with you!"
10145-CVGroup_UIEventLobby_Enter3-2 = "...Do you just intend to watch me?"
10145-CVGroup_UIEventLobby_Enter4-1 = "Seasons of inexperience are natural for us all."
10145-CVGroup_UIEventLobby_Enter4-2 = "Regardless, one must always remain a student..."
10145-CVGroup_UIEventLobby_Enter4-3 = "...of the machinations of this world."
10145-CVGroup_UIEventLobby_Enter5-1 = "Things have wrapped up safe and sound."
10145-CVGroup_UIEventLobby_Enter6-1 = "However, our vacation..."
10145-CVGroup_UIEventLobby_Enter6-2 = "...has not quite ended yet, has it?"
10145-CVGroup_UIEventLobby_Idle1-1 = "Hm? What is it, Sensei?"
10145-CVGroup_UIEventLobby_Idle1-2 = "Fufu, well then. Enjoy to your heart's content."
10145-CVGroup_UIEventLobby_Idle1-3 = "Your Madam's...soft skin?"
10145-CVGroup_UIEventLobby_Idle2-1 = "It's as if I am adrift in a dream, to be able to visit here with you."
10145-CVGroup_UIEventLobby_Idle2-2 = "Fufu... There is no hidden meaning behind my words."
10145-CVGroup_UIEventLobby_Idle2-3 = "It is not as if my health is failing me."
10145-CVGroup_UIEventLobby_Idle2-4 = "So please hear my words for what they are."
10145-CVGroup_UIEventLobby_Idle3-1 = "The blue butterfly in Shanhaijing, at times, represents immortality."
10145-CVGroup_UIEventLobby_Idle3-2 = "In other words..."
10145-CVGroup_UIEventLobby_Idle3-3 = "the blue butterfly doesn't give up so easily."
10145-CVGroup_UIEventLobby_Idle3-4 = "Fufu. Disregard it as a joke, if you please."
10145-CVGroup_UIEventLobby_Idle4-1 = "Thank you."
10145-CVGroup_UIEventLobby_Idle4-2 = "For allowing me to be spoiled by you, Sensei."
10145-CVGroup_UIEventLobby_Idle4-3 = "And I offer an advance apology."
10145-CVGroup_UIEventLobby_Idle4-4 = "For I intend to only get worse from here."
10145-CVGroup_UIEventShop_Enter1-1 = "Hi, Sensei! It's Kiki!"
10145-CVGroup_UIEventShop_Enter1-2 = "Kiki will be taking care of the shop!"
10145-CVGroup_UIEventShop_Enter1-3 = "Eh? \"Kisaki\"? What's that? Kiki doesn't know!"
10145-CVGroup_UIEventShop_Enter2-1 = "Welcome, Sensei!"
10145-CVGroup_UIEventShop_Enter2-2 = "Kiki was doing a good job taking care of the shop! Please praise Kiki!"
10145-CVGroup_UIEventShop_Enter3-1 = "Yay! Sensei's here!"
10145-CVGroup_UIEventShop_Enter3-2 = "Make sure you didn't miss anything, 'kay?"
10145-CVGroup_UIEventShop_Idle1-1 = "What's your favorite? Hm, for Kiki..."
10145-CVGroup_UIEventShop_Idle1-2 = "Kiki likes whatever Sensei likes!"
10145-CVGroup_UIEventShop_Idle2-1 = "Kiki tried putting on a swimsuit..."
10145-CVGroup_UIEventShop_Idle2-2 = "What do you think? Does it look good? Is Kiki cute?"
10145-CVGroup_UIEventShop_Idle2-3 = "The thing is, Kiki...is bad at swimming."
10145-CVGroup_UIEventShop_Buy1-1 = "Ah, Kiki liked that too!"
10145-CVGroup_UIEventShop_Buy2-1 = "This is...that, right? Kiki knows too!"
10145-CVGroup_UIEventShop_Buy2-2 = "Thank you so much!"
10145-CVGroup_UIEventShop_Buy3-1 = "Yay! Kiki too! Kiki wants to see too!"
10145-CVGroup_UIEventShop_Buy4-1 = "Mhm! It's over here! Did Kiki do a good job, Sensei?"
