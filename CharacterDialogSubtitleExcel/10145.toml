[translation]
10145-CVGroup_UITitle_Idle1-1 = "蔚藍檔案，啊……呵呵。"
10145-CVGroup_CharacterGet_Idle1-1 = "呼呣……這陽光真強啊。\n來，老師，到這邊來……"
10145-CVGroup_Cafe_Idle1-1 = "呼呣，真是不可思議的氣溫呢……"
10145-CVGroup_Cafe_Idle2-1 = "哦？那是……？真有意思啊。"
10145-CVGroup_Cafe_Idle3-1 = "休息呢。著實舒暢啊。"
10145-CVGroup_Cafe_Idle4-1 = "（能躺下的地方在……）"
10145-CVGroup_Cafe_Idle5-1 = "咖啡牛奶……不過，咖啡因一事才剛遭沙耶唸過呢。"
10145-CVGroup_WeaponGet_Idle1-1 = "老師認為寄託於這件武器之中的意義為何？\n……妾身認為，象徵著兩人始終如一的羈絆哦。"
10145-CVGroup_UIEventLobby_Enter1-1 = "湛藍的天空，耀眼的陽光──是夏天呢。\n既然如此，就該去避暑吧？"
10145-CVGroup_UIEventLobby_Enter1-2 = "呵呵……\n汝心中作何想法雖不得而知。"
10145-CVGroup_UIEventLobby_Enter1-3 = "妾身可是相當地雀躍哦？"
10145-CVGroup_UIEventLobby_Enter2-1 = "真是個好地方呢。"
10145-CVGroup_UIEventLobby_Enter2-2 = "尤其是那處──"
10145-CVGroup_UIEventLobby_Enter2-3 = "於大自然面前……"
10145-CVGroup_UIEventLobby_Enter2-4 = "吾等將深切地體會到自身的無力呢。"
10145-CVGroup_UIEventLobby_Enter3-1 = "只要是和老師一起，妃妃無論去哪裡都很開心！"
10145-CVGroup_UIEventLobby_Enter3-2 = "……怎麼，只是看著嗎？"
10145-CVGroup_UIEventLobby_Enter4-1 = "人人皆有稚拙未熟之時。"
10145-CVGroup_UIEventLobby_Enter4-2 = "然而，世間萬理仍須不斷參悟。"
10145-CVGroup_UIEventLobby_Enter4-3 = "吾等亦是如此。"
10145-CVGroup_UIEventLobby_Enter5-1 = "安然結束了呢。"
10145-CVGroup_UIEventLobby_Enter6-1 = "呵呵。然而，吾等的避暑……"
10145-CVGroup_UIEventLobby_Enter6-2 = "才正要開始，對吧？"
10145-CVGroup_UIEventLobby_Idle1-1 = "嗯？怎麼了，老師。"
10145-CVGroup_UIEventLobby_Idle1-2 = "呵呵，來吧。盡情地享受吧。"
10145-CVGroup_UIEventLobby_Idle1-3 = "這可是門主的──玉肌哦？"
10145-CVGroup_UIEventLobby_Idle2-1 = "竟能與老師一同來到此處……當真，如夢一般啊。"
10145-CVGroup_UIEventLobby_Idle2-2 = "呵呵……妾身並無深意。"
10145-CVGroup_UIEventLobby_Idle2-3 = "身子也並非有任何不適。"
10145-CVGroup_UIEventLobby_Idle2-4 = "照字面之意理解便可。"
10145-CVGroup_UIEventLobby_Idle3-1 = "青色的蝴蝶，於山海經中意味著「不滅」。"
10145-CVGroup_UIEventLobby_Idle3-2 = "「永不言棄」……"
10145-CVGroup_UIEventLobby_Idle3-3 = "亦可如此換言呢。"
10145-CVGroup_UIEventLobby_Idle3-4 = "呵呵，無須在意。汝僅需視作戲言便可。"
10145-CVGroup_UIEventLobby_Idle4-1 = "令汝隨妾身任性真是抱歉呢，老師。"
10145-CVGroup_UIEventLobby_Idle4-2 = "感激不盡。"
10145-CVGroup_UIEventLobby_Idle4-3 = "啊啊，說得也是……先向汝賠個不是吧。"
10145-CVGroup_UIEventLobby_Idle4-4 = "因為接下來……妾身打算更加任性哦。"
10145-CVGroup_UIEventShop_Enter1-1 = "老師你好！我是妃妃！"
10145-CVGroup_UIEventShop_Enter1-2 = "今天是妃妃來顧店哦！"
10145-CVGroup_UIEventShop_Enter1-3 = "咦，妃姬？\n妃妃有點不太懂……"
10145-CVGroup_UIEventShop_Enter2-1 = "歡迎光臨，老師！"
10145-CVGroup_UIEventShop_Enter2-2 = "妃妃，很努力地在顧店哦？所以請摸摸我！"
10145-CVGroup_UIEventShop_Enter3-1 = "非常感謝您的光臨！"
10145-CVGroup_UIEventShop_Enter3-2 = "為了避免錯過，還請慢慢參觀哦！"
10145-CVGroup_UIEventShop_Idle1-1 = "老師喜歡哪個呢？\n妃妃喜歡……"
10145-CVGroup_UIEventShop_Idle1-2 = "只要是老師選的東西，什麼都喜歡！"
10145-CVGroup_UIEventShop_Idle2-1 = "妃妃試著穿上泳裝了……"
10145-CVGroup_UIEventShop_Idle2-2 = "如何呢？適合嗎？可愛嗎？"
10145-CVGroup_UIEventShop_Idle2-3 = "其實妃妃……不太擅長游泳。"
10145-CVGroup_UIEventShop_Buy1-1 = "啊，那個妃妃也很好奇！"
10145-CVGroup_UIEventShop_Buy2-1 = "啊！這種時候要這麼說對吧！"
10145-CVGroup_UIEventShop_Buy2-2 = "「非常感謝您的惠顧！」"
10145-CVGroup_UIEventShop_Buy3-1 = "哇啊！請讓妃妃也看看！"
10145-CVGroup_UIEventShop_Buy4-1 = "來，請收下！\n請問妃妃做得好嗎？"
