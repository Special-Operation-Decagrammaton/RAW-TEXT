[translation]
10145-CVGroup_UITitle_Idle1-1 = "Blue Archive... สินะ ฮู่ว..."
10145-CVGroup_CharacterGet_Idle1-1 = "ฮู่ว... แดดแรงจริงเชียว นี่ ครู มาทางนี้..."
10145-CVGroup_Cafe_Idle1-1 = "ฮืม... อุณหภูมิช่างน่าประหลาดเสียจริง..."
10145-CVGroup_Cafe_Idle2-1 = "โอ้ สิ่งนั้นมัน...? น่าสนใจจริงเชียว"
10145-CVGroup_Cafe_Idle3-1 = "นี่คงเป็นการพักผ่อนอีกแบบสินะ ดีจริงๆ"
10145-CVGroup_Cafe_Idle4-1 = "(จะมีที่ให้เราเอนกายสักครู่มั้ยนะ...?)"
10145-CVGroup_Cafe_Idle5-1 = "กาแฟใส่นม... แม้เราจะชอบ แต่ซายะก็กำชับให้ระวังเอาไว้..."
10145-CVGroup_WeaponGet_Idle1-1 = "ครูคิดว่าสิ่งที่สถิตอยู่ในนี้คือสิ่งใดหรือ?\nสำหรับเรา... มันคือสายสัมพันธ์อันไม่เปลี่ยนแปลงระหว่างเราสองคน"
10145-CVGroup_UIEventLobby_Enter1-1 = "เอาละ นี่คือฤดูร้อน และการพักร้อน"
10145-CVGroup_UIEventLobby_Enter1-2 = "ไม่รู้ว่าครูจะคิดอย่างไร แต่..."
10145-CVGroup_UIEventLobby_Enter1-3 = "ตอนนี้เรากำลังตื่นเต้นอยู่ไม่น้อยเลยนะ?"
10145-CVGroup_UIEventLobby_Enter2-1 = "เป็นหุบเขาที่ดีจริงเชียว"
10145-CVGroup_UIEventLobby_Enter2-2 = "โดยเฉพาะทิวทัศน์ตรงนั้น"
10145-CVGroup_UIEventLobby_Enter2-3 = "มนุษย์น่ะ เมื่ออยู่ต่อหน้าธรรมชาติแล้ว"
10145-CVGroup_UIEventLobby_Enter2-4 = "ก็เป็นเพียงตัวตนอันน้อยนิดถึงเพียงนี้"
10145-CVGroup_UIEventLobby_Enter3-1 = "คุณครู! คิกิน่ะ! ถ้าได้อยู่กับคุณครูจะไปที่ไหนก็ได้ทั้งนั้นค่ะ!"
10145-CVGroup_UIEventLobby_Enter3-2 = "จะเอาแต่มองดูอยู่เฉยๆ หรือ...?"
10145-CVGroup_UIEventLobby_Enter4-1 = "ทุกคนย่อมเคยมีช่วงเวลาที่ยังอ่อนหัด"
10145-CVGroup_UIEventLobby_Enter4-2 = "แต่เรื่องนั้นก็ส่วนเรื่องนั้น กฎเกณฑ์ของโลกน่ะ"
10145-CVGroup_UIEventLobby_Enter4-3 = "ย่อมเป็นสิ่งที่ต้องศึกษาอยู่เสมอ"
10145-CVGroup_UIEventLobby_Enter5-1 = "ทุกอย่างจบลงด้วยดีแล้วสินะ"
10145-CVGroup_UIEventLobby_Enter6-1 = "แต่การพักร้อน 'ของเรา'"
10145-CVGroup_UIEventLobby_Enter6-2 = "ดูเหมือนจะยังไม่จบลงอย่างสมบูรณ์นะ?"
10145-CVGroup_UIEventLobby_Idle1-1 = "หืม? เป็นอะไรไปหรือ ครู?"
10145-CVGroup_UIEventLobby_Idle1-2 = "ฮุฮุ เอาละ จงดื่มด่ำให้เต็มที่เถอะ"
10145-CVGroup_UIEventLobby_Idle1-3 = "ผิวเนียนนุ่มของประมุข... อย่างไรเล่า?"
10145-CVGroup_UIEventLobby_Idle2-1 = "ช่างเหมือนฝันจริงๆ ที่ได้มายังสถานที่แบบนี้กับครู"
10145-CVGroup_UIEventLobby_Idle2-2 = "ฮุฮุ... ไม่ได้มีความหมายพิเศษอะไรหรอก"
10145-CVGroup_UIEventLobby_Idle2-3 = "สุขภาพของเราก็ไม่ได้แย่ด้วย"
10145-CVGroup_UIEventLobby_Idle2-4 = "เราอยากให้ครูเข้าใจตามที่พูดไปตรงๆ"
10145-CVGroup_UIEventLobby_Idle3-1 = "ในซานไห่จิง ผีเสื้อสีน้ำเงินบางครั้งก็สื่อถึงความเป็นนิรันดร์"
10145-CVGroup_UIEventLobby_Idle3-2 = "นั่นหมายความว่า ผีเสื้อสีน้ำเงินนั้น..."
10145-CVGroup_UIEventLobby_Idle3-3 = "มีความหมายว่าไม่ยอมแพ้ง่ายๆ เช่นกัน"
10145-CVGroup_UIEventLobby_Idle3-4 = "ฮุฮุ ไม่เป็นไร จะคิดว่าเป็นเพียงเรื่องล้อเล่นก็ได้"
10145-CVGroup_UIEventLobby_Idle4-1 = "วันนี้... ขอบคุณมากจริงๆ"
10145-CVGroup_UIEventLobby_Idle4-2 = "ที่ยอมตามใจเรานะ ครู"
10145-CVGroup_UIEventLobby_Idle4-3 = "และเราขอโทษไว้ก่อนล่วงหน้า"
10145-CVGroup_UIEventLobby_Idle4-4 = "เพราะจากนี้ไป เราจะอ้อนให้มากยิ่งกว่านี้น่ะสิ"
10145-CVGroup_UIEventShop_Enter1-1 = "สวัสดีค่ะ คุณครู! คิกิเองค่ะ!"
10145-CVGroup_UIEventShop_Enter1-2 = "คิกิได้มาดูแลร้านค้าค่ะ!"
10145-CVGroup_UIEventShop_Enter1-3 = "คะ? คิซากิน่ะเหรอคะ? คิกิไม่รู้เรื่องแบบนั้นหรอกค่ะ!"
10145-CVGroup_UIEventShop_Enter2-1 = "เชิญค่ะ คุณครู!"
10145-CVGroup_UIEventShop_Enter2-2 = "คิกิตั้งใจดูแลร้านค้าอยู่ค่ะ! ชมกันหน่อยสิคะ!"
10145-CVGroup_UIEventShop_Enter3-1 = "ว้าว! คุณครูมาหากันด้วยค่ะ!"
10145-CVGroup_UIEventShop_Enter3-2 = "ถ้ายังขาดอะไรอยู่ ก็เชิญเลือกชมได้เต็มที่เลยค่ะ!"
10145-CVGroup_UIEventShop_Idle1-1 = "คุณครูชอบของแบบไหนเหรอคะ? ส่วนคิกิน่ะ..."
10145-CVGroup_UIEventShop_Idle1-2 = "ถ้าเป็นของที่คุณครูเลือกให้ ไม่ว่าอะไรก็ชอบค่ะ!"
10145-CVGroup_UIEventShop_Idle2-1 = "คิกิลองใส่ชุดว่ายน้ำมาค่ะ..."
10145-CVGroup_UIEventShop_Idle2-2 = "เป็นยังไงบ้างคะ? เข้ากันดีมั้ยคะ? น่ารักหรือเปล่าคะ?"
10145-CVGroup_UIEventShop_Idle2-3 = "จริงๆ แล้ว คิกิ... ว่ายน้ำไม่ค่อยเก่งค่ะ"
10145-CVGroup_UIEventShop_Buy1-1 = "อ๊ะ คิกิก็ว่าอันนั้นดูดีเหมือนกันค่ะ!"
10145-CVGroup_UIEventShop_Buy2-1 = "ในเวลาแบบนี้... ต้องเป็นแบบนั้นใช่มั้ยคะ? คิกิเองก็รู้เหมือนกันนะคะ!"
10145-CVGroup_UIEventShop_Buy2-2 = "ขอบคุณเสมอเลยค่ะ!"
10145-CVGroup_UIEventShop_Buy3-1 = "ว้าว! คิกิขอดูด้วยค่ะ! คิกิดูด้วย!"
10145-CVGroup_UIEventShop_Buy4-1 = "ค่ะ! นี่ค่ะ! คิกิทำได้ดีใช่มั้ยคะ คุณครู?"
