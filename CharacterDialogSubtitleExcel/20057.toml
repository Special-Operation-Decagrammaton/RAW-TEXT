[translation]
20057-CVGroup_UITitle_Idle1-1 = "Blue Archive."
20057-CVGroup_CharacterGet_Idle1-1 = "Millennium Science School, Call Sign 03, Murokasa Akane. Greeting you as a student today. Fufu. Though I was always a student, you know?"
20057-CVGroup_Cafe_Idle1-1 = "To start, I would like to prepare a cake."
20057-CVGroup_Cafe_Idle2-1 = "This place has a soothing effect to it."
20057-CVGroup_Cafe_Idle3-1 = "I'd like to have that piece of furniture in our club room."
20057-CVGroup_Cafe_Idle4-1 = "(The cleaning was carried out well...but it could have been tidied up more neatly.)"
20057-CVGroup_Cafe_Idle5-1 = "(For this width... The amount of explosives I'd need is...)"
20057-CVGroup_WeaponGet_Idle1-1 = "Owning a gun is essential in Kivotos, regardless of whether you're a maid or a student. I'll continue to work hard with this \"cleaning\" tool you've given me, Sensei."
20057-CVGroup_UIEventLobby_Enter1-1 = "I've been waiting, Sensei."
20057-CVGroup_UIEventLobby_Enter1-2 = "Let me be your guide in Millennium."
20057-CVGroup_UIEventLobby_Enter2-1 = "If there's any place you wish to go, please ask me."
20057-CVGroup_UIEventLobby_Enter3-1 = "While it is always bustling in Millennium..."
20057-CVGroup_UIEventLobby_Enter3-2 = "...it's reached a new level entirely today."
20057-CVGroup_UIEventLobby_Enter3-3 = "Though, it is good that things are so lively."
20057-CVGroup_UIEventLobby_Enter4-1 = "It's finally over."
20057-CVGroup_UIEventLobby_Enter4-2 = "Both the Expo and the commotion."
20057-CVGroup_UIEventLobby_Enter5-1 = "Did you enjoy the Millennium EXPO?"
20057-CVGroup_UIEventLobby_Enter5-2 = "I was honored to be able to spend time with you, Sensei."
20057-CVGroup_UIEventLobby_Enter5-3 = "...Yes, truly."
20057-CVGroup_UIEventLobby_Idle1-1 = "Being able to spend time with you like this..."
20057-CVGroup_UIEventLobby_Idle1-2 = "I quite like it."
20057-CVGroup_UIEventLobby_Idle2-1 = "Please let me know if you begin feeling hungry."
20057-CVGroup_UIEventLobby_Idle2-2 = "I know of a good dining hall."
20057-CVGroup_UIEventLobby_Idle2-3 = "If I were a maid, of course, I would simply cook for you..."
20057-CVGroup_UIEventLobby_Idle2-4 = "However, I'm just a student right now."
20057-CVGroup_UIEventLobby_Idle3-1 = "Did you say my name, Sensei?"
20057-CVGroup_UIEventLobby_Idle3-2 = "You called for me without a particular reason?"
20057-CVGroup_UIEventLobby_Idle3-3 = "Fufu. Oh my."
20057-CVGroup_UIEventLobby_Idle4-1 = "Fufu."
20057-CVGroup_UIEventLobby_Idle4-2 = "I am not very ticklish."
20057-CVGroup_UIEventLobby_Idle4-3 = "Sensei... How about you?"
