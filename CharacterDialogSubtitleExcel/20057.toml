[translation]
20057-CVGroup_UITitle_Idle1-1 = "Blue Archive ฮุฮุฮุ"
20057-CVGroup_CharacterGet_Idle1-1 = "มุโรคาสะ อาคาเนะ รหัสประจำตัวซีโร่ทรีจากโรงเรียนวิทย์มิลเลเนียม\nขอทักทายในฐานะนักเรียนค่ะ ฮุฮุ ถึงปกติจะเป็นนักเรียนอยู่แล้วก็เถอะค่ะ"
20057-CVGroup_Cafe_Idle1-1 = "อย่างแรกฉันอยากเตรียมเค้กให้จังเลยค่ะ"
20057-CVGroup_Cafe_Idle2-1 = "เป็นสถานที่ที่น่าอบอุ่นใจจังเลยนะคะ"
20057-CVGroup_Cafe_Idle3-1 = "อยากมีเฟอร์นิเจอร์นี้ในห้องชมรมบ้างจังเลยค่ะ"
20057-CVGroup_Cafe_Idle4-1 = "(การทำความสะอาดกำลังดำเนินไปได้ด้วยดี...\nแต่น่าเสียดายที่จะจบลงนะคะ)"
20057-CVGroup_Cafe_Idle5-1 = "(ความกว้างขนาดนี้... ต้องใช้ระเบิดมากแค่ไหนนะ...)"
20057-CVGroup_WeaponGet_Idle1-1 = "ปืนเป็นสิ่งจำเป็นในคิโวทอส ไม่ว่าจะกับเมดหรือนักเรียนก็ตามค่ะ\nฉันจะตั้งใจทำงานไปกับ 'อุปกรณ์ทำความสะอาด' ที่ได้จากคุณครูค่ะ"
