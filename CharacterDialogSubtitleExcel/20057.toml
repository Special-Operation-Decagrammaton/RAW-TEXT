[translation]
20057-CVGroup_UITitle_Idle1-1 = "蔚藍檔案。呵呵。"
20057-CVGroup_CharacterGet_Idle1-1 = "千年科學學園，代號03室笠朱音。\n以學生身份向您問候。呵呵，不過我本來就是學生呢。"
20057-CVGroup_Cafe_Idle1-1 = "首先想準備蛋糕呢。"
20057-CVGroup_Cafe_Idle2-1 = "這裡總感覺很讓人放鬆呢。"
20057-CVGroup_Cafe_Idle3-1 = "那個家具，想在部室也放一個呢。"
20057-CVGroup_Cafe_Idle4-1 = "（打掃得很好……但有點可惜呢）"
20057-CVGroup_Cafe_Idle5-1 = "（這個面積……需要的炸藥量是……）"
20057-CVGroup_WeaponGet_Idle1-1 = "在奇普托斯，槍是必需品。不管女僕還是學生都一樣。\n在眾多的槍枝中……我會和老師給我的這個「打掃工具」一起，繼續精益求精的。"
20057-CVGroup_UIEventLobby_Enter1-1 = "恭候多時了，老師。"
20057-CVGroup_UIEventLobby_Enter1-2 = "千年的導覽就交給我吧。"
20057-CVGroup_UIEventLobby_Enter2-1 = "如果有想去的地方，請隨時跟我說。"
20057-CVGroup_UIEventLobby_Enter3-1 = "雖然平時就很熱鬧……"
20057-CVGroup_UIEventLobby_Enter3-2 = "今天的千年又更是如此呢。"
20057-CVGroup_UIEventLobby_Enter3-3 = "雖然有活力是件好事……"
20057-CVGroup_UIEventLobby_Enter4-1 = "終於來到最後階段了呢。"
20057-CVGroup_UIEventLobby_Enter4-2 = "無論是EXPO，還是讓人恐慌的事件。"
20057-CVGroup_UIEventLobby_Enter5-1 = "千年EXPO，老師玩得開心嗎？"
20057-CVGroup_UIEventLobby_Enter5-2 = "我很榮幸能和老師一起度過。"
20057-CVGroup_UIEventLobby_Enter5-3 = "……嗯，是真的。"
20057-CVGroup_UIEventLobby_Idle1-1 = "能像這樣和老師度過時光……"
20057-CVGroup_UIEventLobby_Idle1-2 = "我真的感到很高興。"
20057-CVGroup_UIEventLobby_Idle2-1 = "如果肚子餓了請跟我說哦。"
20057-CVGroup_UIEventLobby_Idle2-2 = "我有推薦的學生餐廳。"
20057-CVGroup_UIEventLobby_Idle2-3 = "如果是「女僕」的我就親自準備了……"
20057-CVGroup_UIEventLobby_Idle2-4 = "但是，我現在是「學生」。"
20057-CVGroup_UIEventLobby_Idle3-1 = "您叫我嗎，老師？"
20057-CVGroup_UIEventLobby_Idle3-2 = "只是叫看看嗎……？"
20057-CVGroup_UIEventLobby_Idle3-3 = "唔呵呵，哎呀哎呀。"
20057-CVGroup_UIEventLobby_Idle4-1 = "呵呵。"
20057-CVGroup_UIEventLobby_Idle4-2 = "我不是會怕癢的人哦。"
20057-CVGroup_UIEventLobby_Idle4-3 = "至於老師是什麼類型……可以告訴我嗎？"
