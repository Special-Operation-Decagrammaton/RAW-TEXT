[translation]
26017-CVGroup_UITitle_Idle1-1 = "블루, 아카이브."
26017-CVGroup_CharacterGet_Idle1-1 = "183호 특별반, 후루하타 라나입니다.\n음……. 재부팅은 해보셨습니까?"
26017-CVGroup_Cafe_Idle1-1 = "선생님. 아보카도,\n보셨습니까.\n만약에 아보카도가 있다면\n우유를 6개 사야합니다."
26017-CVGroup_Cafe_Idle2-1 = "북적이는군요.\n다함께 놀 수 있다면\n좋겠습니다."
26017-CVGroup_Cafe_Idle3-1 = "의젓하게\n잘 놀고 있었습니다.\n걱정마시길."
26017-CVGroup_Cafe_Idle4-1 = "세상은 넓군요.\n다양한 사람들은\n흥미롭습니다."
26017-CVGroup_Cafe_Idle5-1 = "183호와는\n다른 분위기가\n흥미롭습니다."
26017-CVGroup_WeaponGet_Idle1-1 = "음. 천공카드를 많이 만들 수 있겠군요.\n심판 보기도 편할듯 합니다."
26017-CVGroup_UIEventLobby_Enter1-1 = "부붐,\n부부부부부-\n부부부-!"
26017-CVGroup_UIEventLobby_Enter1-2 = "방금건 추운날\n아침의 디젤 엔진\n시동소리 입니다."
26017-CVGroup_UIEventLobby_Enter1-3 = "어떻습니까.\n비슷했을까요."
26017-CVGroup_UIEventLobby_Enter2-1 = "다양한 전차가 많아서,\n텐션이 오릅니다."
26017-CVGroup_UIEventLobby_Enter3-1 = "183호의 행방은\n과연-"
26017-CVGroup_UIEventLobby_Enter3-2 = "……나레이션\n흉내였습니다."
26017-CVGroup_UIEventLobby_Enter4-1 = "웃는 얼굴들이\n많군요……."
26017-CVGroup_UIEventLobby_Enter4-2 = "저도 웃게 됩니다."
26017-CVGroup_UIEventLobby_Enter5-1 = "게헨나컵, 끝났습니다.\n주차장 막히기 전에\n얼른 나가시지요."
26017-CVGroup_UIEventLobby_Idle1-1 = "인파가 많은 행사입니다.\n어린아이를\n잃어버리지 않도록\n주의해주십시오."
26017-CVGroup_UIEventLobby_Idle2-1 = "손을 잡으면,\n미아 방지가 됩니다."
26017-CVGroup_UIEventLobby_Idle2-2 = "실험으로 증명된\n이론이니, 확실합니다."
26017-CVGroup_UIEventLobby_Idle3-1 = "쓰담쓰담도 좋습니다만,\n손 잡기도\n잊지 말아주세요."
26017-CVGroup_UIEventLobby_Idle4-1 = "저기가 \n재미있어보입니다.\n데려가주시면\n감사하겠습니다."
26017-CVGroup_UIEventShop_Enter1-1 = "음, 등가교환, 인가요."
26017-CVGroup_UIEventShop_Enter2-1 = "물건을 살 때는, 우선순위를\n책정하면 좋다고 생각합니다."
26017-CVGroup_UIEventShop_Enter3-1 = "세간에 '폐점 세일'이란게\n있다고 들었습니다만,\n여기는 하지 않는 모양이군요."
26017-CVGroup_UIEventShop_Idle1-1 = "저는 파는게 아닙니다.\n선생님이라면\n굳이 사지 않으셔도 됩니다."
26017-CVGroup_UIEventShop_Idle2-1 = "쓰담쓰담, 감사합니다.\n뭐라도 사드릴까요."
26017-CVGroup_UIEventShop_Buy1-1 = "최적의 상품이라 할 수 있겠군요."
26017-CVGroup_UIEventShop_Buy2-1 = "선생님도 사용하시나요?"
26017-CVGroup_UIEventShop_Buy3-1 = "선생님. '잔돈은 넣어둬'\n라는 말을 하신적 있으신가요."
26017-CVGroup_UIEventShop_Buy4-1 = "심부름 메모도 없이…….\n전부 외우셨군요. 멋이 있으십니다."
26017-CVGroup_UIEventMission_Enter1-1 = "과제군요. 받아들이죠."
26017-CVGroup_UIEventMission_Enter2-1 = "업무입니다.\n제가 해둘까도 생각했습니다만,"
26017-CVGroup_UIEventMission_Enter2-2 = "선생님의 즐거움을\n훔쳐가지 않겠습니다."
26017-CVGroup_UIEventMission_Idle1-1 = "냐앗."
26017-CVGroup_UIEventMission_Idle1-2 = "제 코…… 뭔가 문제가 있었을까요?\n오염되었거나, 형태가 이상했다던지?"
26017-CVGroup_UIEventMission_Idle2-1 = "선생님의 멋진 모습,\n질리질 않습니다."
26017-CVGroup_UIEventMission_Buy1-1 = "멋지군요, 뭔가 해냈습니다."
26017-CVGroup_UIEventMission_Buy2-1 = "자세한건 모릅니다만,"
26017-CVGroup_UIEventMission_Buy2-2 = "선생님이라면 아마도\n멋진일을 하셨겠지요."
26017-CVGroup_UIEventMission_Interaction1-1 = "오늘은 여기까지 입니다.\n너무 섭섭하지 마시길 바랍니다."
26017-CVGroup_UIEventMiniGameMission_Enter1-1 = "전차레이싱 미션에\n오신걸 환영합니다."
26017-CVGroup_UIEventMiniGameMission_Enter2-1 = "보통 레이싱의 미션은\n'사고 안치기', '우승하기'정도로\n알고 있습니다만."
26017-CVGroup_UIEventMiniGameMission_Idle1-1 = "먀앙."
26017-CVGroup_UIEventMiniGameMission_Idle1-2 = "선생님은 제 뺨을 선호하시는건가요.\n기쁘다고 생각합니다."
26017-CVGroup_UIEventMiniGameMission_Idle2-1 = "저는 시동버튼이 아닙니다.\n쓰담쓰담 쪽이 더 좋습니다."
26017-CVGroup_UIEventMiniGameMission_Buy1-1 = "노력에는 보상이 따르죠……\n보상에도 노력이 따를까요?"
26017-CVGroup_UIEventMiniGameMission_Buy2-1 = "보상 수령의 루트 파악했습니다.\n아주 간단하군요."
26017-CVGroup_UIEventMiniGameMission_Interaction1-1 = "선생님의 처리 속도, 진공관 같습니다.\n베리 패스트."
