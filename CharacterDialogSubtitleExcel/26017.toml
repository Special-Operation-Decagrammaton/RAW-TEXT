[translation]
26017-CVGroup_UITitle_Idle1-1 = "ブルー、アーカイブ。"
26017-CVGroup_CharacterGet_Idle1-1 = "183号特別クラス、古畑ラナです。 \nふむ……再起動は試しましたか？"
26017-CVGroup_Cafe_Idle1-1 = "先生、アボカドはありましたか？\nアボカドがあったなら、牛乳を6本買わないといけませんので。"
26017-CVGroup_Cafe_Idle2-1 = "賑やかです。\nみんなと仲良くできると良いですね。"
26017-CVGroup_Cafe_Idle3-1 = "ちゃんと、大人しくしていました。\nご心配には及びません。"
26017-CVGroup_Cafe_Idle4-1 = "世界は広いですね。\n色んな人がいて、考察のし甲斐があります。"
26017-CVGroup_Cafe_Idle5-1 = "なんだか183号と雰囲気が違って。\n興味深いです。"
26017-CVGroup_WeaponGet_Idle1-1 = "ふむ、パンチカードがいっぱい作れそうで良いですね。\nこれで判定も捗りそうです。"
26017-CVGroup_UIEventLobby_Enter1-1 = "ブン、ブブブブブーブブブブブー！"
26017-CVGroup_UIEventLobby_Enter1-2 = "今のは寒い朝のディーゼルエンジン駆動音です。"
26017-CVGroup_UIEventLobby_Enter1-3 = "いかがでしょう、似ていましたか。"
26017-CVGroup_UIEventLobby_Enter2-1 = "色んな戦車が見られて、テンションが上がります。"
26017-CVGroup_UIEventLobby_Enter3-1 = "はたして、183号特別クラスの運命は――"
26017-CVGroup_UIEventLobby_Enter3-2 = "……今のは天の声の真似です。"
26017-CVGroup_UIEventLobby_Enter4-1 = "笑顔の人がたくさんいますね……。"
26017-CVGroup_UIEventLobby_Enter4-2 = "こちらまで笑顔になってしまいます。"
26017-CVGroup_UIEventLobby_Enter5-1 = "ゲヘナカップ、終わりましたね。\n駐車場が混み合う前に、急いで帰りましょう。"
26017-CVGroup_UIEventLobby_Idle1-1 = "人が密集しています。\n子供を迷子にさせないよう、ご注意ください。"
26017-CVGroup_UIEventLobby_Idle2-1 = "手を繋げば、迷子防止になります。"
26017-CVGroup_UIEventLobby_Idle2-2 = "実験で証明された理論ですので、間違いありません。"
26017-CVGroup_UIEventLobby_Idle3-1 = "なでなでも良いですが、手を繋ぐことも、お忘れなく。"
26017-CVGroup_UIEventLobby_Idle4-1 = "あそこ、楽しそうです。\n連れていっていただけると嬉しいです。"
26017-CVGroup_UIEventShop_Enter1-1 = "ふむ、等価交換、ですか。"
26017-CVGroup_UIEventShop_Enter2-1 = "お買い物の際は、優先順位をつけると良いと思います。"
26017-CVGroup_UIEventShop_Enter3-1 = "世には「閉店セール」というものが存在すると聞いていましたが……。\nここではやっていないのですね。"
26017-CVGroup_UIEventShop_Idle1-1 = "私は売りものではありません。\nそれに、先生でしたら、わざわざ購入する必要もないかと。"
26017-CVGroup_UIEventShop_Idle2-1 = "なでなでを、ありがとうございます。\n何か欲しいものはありますか？"
26017-CVGroup_UIEventShop_Buy1-1 = "最適な品といえるでしょう。"
26017-CVGroup_UIEventShop_Buy2-1 = "先生もお使いですか？"
26017-CVGroup_UIEventShop_Buy3-1 = "先生。「お釣りは取っておけ」と言ってみたこと、ありますか？"
26017-CVGroup_UIEventShop_Buy4-1 = "買い物メモもなしに……全部覚えられたんですね。\nカッコ良いです。"
26017-CVGroup_UIEventMission_Enter1-1 = "課題ですね。\n受けて立ちましょう。"
26017-CVGroup_UIEventMission_Enter2-1 = "お仕事です。\n代わりに終わらせておくことも検討しましたが、"
26017-CVGroup_UIEventMission_Enter2-2 = "先生の楽しみを奪っては、いけませんので。"
26017-CVGroup_UIEventMission_Idle1-1 = "にゃあっ。"
26017-CVGroup_UIEventMission_Idle1-2 = "私の鼻が……どうかされましたか？\n汚染されてましたか？\n変形してましたか？"
26017-CVGroup_UIEventMission_Idle2-1 = "先生のご活躍を、ずっと眺めていたいです。"
26017-CVGroup_UIEventMission_Buy1-1 = "やりましたね。素敵です。"
26017-CVGroup_UIEventMission_Buy2-1 = "詳しいことは分かりませんが、"
26017-CVGroup_UIEventMission_Buy2-2 = "先生のことですので。\nきっと、何か素晴らしいことを成し遂げられたのでしょう。"
26017-CVGroup_UIEventMission_Interaction1-1 = "今日はここまでです。続きはまた今度。\nそんな寂しそうな顔しないでください。"
26017-CVGroup_UIEventMiniGameMission_Enter1-1 = "戦車レーシングミッションへ、ようこそ。"
26017-CVGroup_UIEventMiniGameMission_Enter2-1 = "通常、レーシングのミッションとは「事故を起こさない」「優勝する」だと認識していますが。"
26017-CVGroup_UIEventMiniGameMission_Idle1-1 = "みゃあ。"
26017-CVGroup_UIEventMiniGameMission_Idle1-2 = "先生は私のほっぺたがお好きなんですね。\n嬉しく思います。"
26017-CVGroup_UIEventMiniGameMission_Idle2-1 = "私はスタートボタンではありません。\nなでなでのほうが好きです。"
26017-CVGroup_UIEventMiniGameMission_Buy1-1 = "努力には報酬が伴うものですが……報酬にも努力が伴うのでしょうか？"
26017-CVGroup_UIEventMiniGameMission_Buy2-1 = "報酬受取のルートを把握。とても簡単なんですね。"
26017-CVGroup_UIEventMiniGameMission_Interaction1-1 = "先生の処理速度、真空管のごとく、です。ベリーファスト。"
