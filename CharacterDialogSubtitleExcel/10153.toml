[translation]
10153-CVGroup_UITitle_Idle1-1 = "ブルーアーカイブ！"
10153-CVGroup_CharacterGet_Idle1-1 = "え？この衣装ですか？\n支給品のユニフォームですよ？\nえへへっ……よろしくお願いします！"
10153-CVGroup_Cafe_Idle1-1 = "ふぅ……ここはとても過ごしやすいです。\nクルセイダーちゃんのクーラー、早く直さないと……。"
10153-CVGroup_Cafe_Idle2-1 = "みなさん個性的で、ちょっと羨ましいです……。"
10153-CVGroup_Cafe_Idle3-1 = "わあ、すごく可愛いです！"
10153-CVGroup_Cafe_Idle4-1 = "（だ、大胆な格好です……）"
10153-CVGroup_Cafe_Idle5-1 = "（やっぱり、私は普通な方、ですね……）"
10153-CVGroup_WeaponGet_Idle1-1 = "ありがとうございます！\nこの銃、取り回しがいいので戦車の中でも扱いやすいんです。"
10153-CVGroup_UIEventLobby_Enter1-1 = "ついに本戦ですね！先生！"
10153-CVGroup_UIEventLobby_Enter2-1 = "完走目指して頑張ります！"
10153-CVGroup_UIEventLobby_Enter3-1 = "みなさん、結果を気にせず楽しめたらいいのですが……。"
10153-CVGroup_UIEventLobby_Enter4-1 = "みなさんが、笑顔であれますように！"
10153-CVGroup_UIEventLobby_Enter5-1 = "この大会が、みなさんにとって――"
10153-CVGroup_UIEventLobby_Enter5-2 = "大切な青春の思い出になっていたら嬉しいです。"
10153-CVGroup_UIEventLobby_Idle1-1 = "この衣装ですか？\n公式のユニフォームです！"
10153-CVGroup_UIEventLobby_Idle2-1 = "あ、先生も分かりますか？"
10153-CVGroup_UIEventLobby_Idle2-2 = "これ、とっても良い素材が使われてるんです！"
10153-CVGroup_UIEventLobby_Idle3-1 = "個性豊かな戦車がこんなに……！"
10153-CVGroup_UIEventLobby_Idle3-2 = "先生、一緒に観に行きませんか？"
10153-CVGroup_UIEventLobby_Idle4-1 = "先生も戦車、好きですか？"
10153-CVGroup_UIEventLobby_Idle4-2 = "えへへっ、一緒ですね！\n私も大好きです！"
10153-CVGroup_UIEventShop_Enter1-1 = "欲しいものがあればおっしゃってくださいね！"
10153-CVGroup_UIEventShop_Enter2-1 = "何かお探しですか？お手伝いしますよ！"
10153-CVGroup_UIEventShop_Enter3-1 = "お買い忘れはありませんか？\n最後までお付き合いします！"
10153-CVGroup_UIEventShop_Idle1-1 = "ペロロ様のグッズですか？\n売り場までご案内します！"
10153-CVGroup_UIEventShop_Idle2-1 = "えっ？私が必要……？\n私でよければ、何でも言ってくださいね！"
10153-CVGroup_UIEventShop_Buy1-1 = "それ、すっごく良いですよね！\n分かります！"
10153-CVGroup_UIEventShop_Buy2-1 = "買えるときに貯めておくのも大事ですから。"
10153-CVGroup_UIEventShop_Buy3-1 = "お買い物って、楽しいですよね！"
10153-CVGroup_UIEventShop_Buy4-1 = "他のものも見ていきませんか？"
10153-CVGroup_UIEventMiniGameMission_Enter1-1 = "先生、今日も一緒に頑張りましょう！"
10153-CVGroup_UIEventMiniGameMission_Enter2-1 = "結果を出すのも大事ですが、安全第一ですよ！"
10153-CVGroup_UIEventMiniGameMission_Idle1-1 = "あうっ。"
10153-CVGroup_UIEventMiniGameMission_Idle1-2 = "……ほっぺに何かついてましたか？"
10153-CVGroup_UIEventMiniGameMission_Idle2-1 = "偉いね、って……あれ？私に言ってますか？\nまだ何もしてませんよ！？"
10153-CVGroup_UIEventMiniGameMission_Buy1-1 = "こんなにたくさん……！嬉しいです！やりましたね、先生！"
10153-CVGroup_UIEventMiniGameMission_Buy2-1 = "えへへっ、先生のおかげです！"
10153-CVGroup_UIEventMiniGameMission_Interaction1-1 = "目標達成です！あっという間でしたね！"
