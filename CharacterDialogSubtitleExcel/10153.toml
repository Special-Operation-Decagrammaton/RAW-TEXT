[translation]
10153-CVGroup_UITitle_Idle1-1 = "블루 아카이브!"
10153-CVGroup_CharacterGet_Idle1-1 = "네? 이 옷 말인가요?\n지급받은 유니폼인데요?\n에헤헤…… 잘 부탁드려요!"
10153-CVGroup_Cafe_Idle1-1 = "후우…… 여기, 정말 쾌적해요. 크루세이더쨩의 에어컨, 빨리 고쳐야하는데……"
10153-CVGroup_Cafe_Idle2-1 = "다들 개성이 많아서, 조금 부러워요……."
10153-CVGroup_Cafe_Idle3-1 = "아앗, 너무 귀여워요!"
10153-CVGroup_Cafe_Idle4-1 = "(엄청, 대담한 차림새에요!)"
10153-CVGroup_Cafe_Idle5-1 = "(역시, 저는 너무 평범한 걸까요……)"
10153-CVGroup_WeaponGet_Idle1-1 = "감사합니다!\n이 총,\n짧아서 차 안에서 쓰기 편해요."
10153-CVGroup_UIEventLobby_Enter1-1 = "드디어 본선이네요!\n선생님!"
10153-CVGroup_UIEventLobby_Enter2-1 = "목표는 완주, 힘낼게요!"
10153-CVGroup_UIEventLobby_Enter3-1 = "모두, 결과는\n신경쓰지 않고\n즐기면 좋겠어요……."
10153-CVGroup_UIEventLobby_Enter4-1 = "모두가\n미소지을 수 있기를!"
10153-CVGroup_UIEventLobby_Enter5-1 = "이 대회가,\n모든 분들에게"
10153-CVGroup_UIEventLobby_Enter5-2 = "소중한 청춘의 추억이\n될 수 있다면 기쁠거에요."
10153-CVGroup_UIEventLobby_Idle1-1 = "이 옷, 말씀이신가요?\n공식 유니폼이에요!"
10153-CVGroup_UIEventLobby_Idle2-1 = "선생님도\n알아보시겠나요?"
10153-CVGroup_UIEventLobby_Idle2-2 = "이거, 재질이 되게\n좋은 의상이에요!"
10153-CVGroup_UIEventLobby_Idle3-1 = "독특한 전차들이\n이렇게나 많이……!"
10153-CVGroup_UIEventLobby_Idle3-2 = "선생님, 같이\n구경하러 가실래요?"
10153-CVGroup_UIEventLobby_Idle4-1 = "선생님도 전차,\n좋아하세요?"
10153-CVGroup_UIEventLobby_Idle4-2 = "에헤헤- 똑같네요!\n저도 엄청 좋아해요!"
10153-CVGroup_UIEventShop_Enter1-1 = "필요하신게 있으시면\n말씀해주세요!"
10153-CVGroup_UIEventShop_Enter2-1 = "찾으시는게 있으신가요?\n같이 찾아봐요!"
10153-CVGroup_UIEventShop_Enter3-1 = "잊지 않고 다 사셨나요?\n같이 잘 찾아보죠!"
10153-CVGroup_UIEventShop_Idle1-1 = "페로로님 굿즈요?\n매장까지 안내해드릴게요!"
10153-CVGroup_UIEventShop_Idle2-1 = "네? 제가 필요하시다구요?\n저로 좋다면, 뭐든지 말해주세요!"
10153-CVGroup_UIEventShop_Buy1-1 = "그거, 되게 좋죠!\n동감이에요!"
10153-CVGroup_UIEventShop_Buy2-1 = "구할 수 있을 때\n미리미리 챙겨두는게 중요하죠!"
10153-CVGroup_UIEventShop_Buy3-1 = "쇼핑하는거, 즐겁죠!"
10153-CVGroup_UIEventShop_Buy4-1 = "다른 물건도 보러 가실래요?"
10153-CVGroup_UIEventMiniGameMission_Enter1-1 = "선생님, 오늘도 함께 힘내요!"
10153-CVGroup_UIEventMiniGameMission_Enter2-1 = "좋은 성과도 중요하지만,\n가장 중요한 건 안전이에요!"
10153-CVGroup_UIEventMiniGameMission_Idle1-1 = "으응?"
10153-CVGroup_UIEventMiniGameMission_Idle1-2 = "……뺨에 뭔가 묻었나요?"
10153-CVGroup_UIEventMiniGameMission_Idle2-1 = "칭찬인가요? 네?\n저 아직 아무것도 안 했는데요?!"
10153-CVGroup_UIEventMiniGameMission_Buy1-1 = "이렇게나 잔뜩, 기뻐요!\n해냈네요, 선생님!"
10153-CVGroup_UIEventMiniGameMission_Buy2-1 = "에헤헤-!\n선생님 덕분인걸요!"
10153-CVGroup_UIEventMiniGameMission_Interaction1-1 = "목표 달성이에요!\n순식간이었네요!"
