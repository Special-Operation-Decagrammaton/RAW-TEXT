[translation]
10149-CVGroup_UITitle_Idle1-1 = "ブルー！アーカイブッ！"
10149-CVGroup_CharacterGet_Idle1-1 = "オデュッセイア海洋高等学校、ダイビング部の部長……渡海、ココロです……。\n海に何か落とした時は、言ってくださいね。"
10149-CVGroup_Cafe_Idle1-1 = "いいダイビング日和。\n今日はいつもより深く潜れそう。"
10149-CVGroup_Cafe_Idle2-1 = "シャーレに、こんな場所が……。"
10149-CVGroup_Cafe_Idle3-1 = "あの人はもしかして……ううん、見間違いだよね。"
10149-CVGroup_Cafe_Idle4-1 = "すごい……こんなきれいなカケラ、どこにあったんだろう？"
10149-CVGroup_Cafe_Idle5-1 = "うう、寒い……あったかいお味噌汁……飲みたいなぁ……。"
10149-CVGroup_WeaponGet_Idle1-1 = "ありがとうございます、先生。\nこの装備なら、水中でも安定した作業ができそうです。\n……ふふっ、可愛い。"
10149-CVGroup_UIEventLobby_Enter1-1 = "ダイビング部へようこそ、先生！"
10149-CVGroup_UIEventLobby_Enter1-2 = "昆布茶……よろしければどうぞ……。"
10149-CVGroup_UIEventLobby_Enter2-1 = "ま、また私たちが何かミスってしまいましたか……？"
10149-CVGroup_UIEventLobby_Enter3-1 = "うぅ……潜れなくなるのは嫌だなぁ……。"
10149-CVGroup_UIEventLobby_Enter4-1 = "お宝の地図……。"
10149-CVGroup_UIEventLobby_Enter4-2 = "本当に、お宝ってあるのかな……。"
10149-CVGroup_UIEventLobby_Enter4-3 = "……他に方法はない、か。"
10149-CVGroup_UIEventLobby_Enter5-1 = "ふぅ……フジツボのお掃除、頑張ります……。"
10149-CVGroup_UIEventLobby_Idle1-1 = "えっと……なにかご用でしょうか？"
10149-CVGroup_UIEventLobby_Idle2-1 = "「アクアシール」のアイス……。"
10149-CVGroup_UIEventLobby_Idle2-2 = "身体が冷えちゃうから、あんまり冷たいものを食べないようにしていて……。"
10149-CVGroup_UIEventLobby_Idle3-1 = "エアタンクのチャージ代に……レギュレーターの交換……。"
10149-CVGroup_UIEventLobby_Idle3-2 = "うぅ……今月も厳しそう……。"
10149-CVGroup_UIEventLobby_Idle4-1 = "あは、あははっ！く、くすぐったいです……！"
10149-CVGroup_UIEventTreasure_Enter1-1 = "今日の先生は、私のバディですよ。"
10149-CVGroup_UIEventTreasure_Enter2-1 = "さあ、行きましょう。"
10149-CVGroup_UIEventTreasure_Enter2-2 = "水の世界へ。"
10149-CVGroup_UIEventTreasure_Enter3-1 = "一応……見落としがないか、もう一度確認しましょう。"
10149-CVGroup_UIEventTreasure_Enter4-1 = "お疲れ様です、先生。"
10149-CVGroup_UIEventTreasure_Enter4-2 = "今、片付けをしていたところです。"
10149-CVGroup_UIEventTreasure_Idle1-1 = "そ、その手信号は……。"
10149-CVGroup_UIEventTreasure_Idle1-2 = "誤解しちゃいます……。"
10149-CVGroup_UIEventTreasure_Idle2-1 = "えっ！わ、私の後ろに、なにか……？"
10149-CVGroup_UIEventTreasure_Idle2-2 = "こ、怖いこと言わないでください！"
10149-CVGroup_UIEventTreasure_Idle2-3 = "サメならともかく、私、こ、怖いものは苦手なんです……！"
10149-CVGroup_UIEventTreasure_FindTreasure1-1 = "この中に……何かがありそうです。"
10149-CVGroup_UIEventTreasure_FindTreasure2-1 = "あっ……！いま、動きましたよ！"
10149-CVGroup_UIEventTreasure_GetTreasure1-1 = "見つけました！"
10149-CVGroup_UIEventTreasure_GetTreasure2-1 = "わあ……！これが隠れてたんですね！"
10149-CVGroup_UIEventTreasure_RoundRenewal1-1 = "次のポイントを目指しましょう。"
10149-CVGroup_UIEventMission_Enter1-1 = "ブリーフィングを始めます！"
10149-CVGroup_UIEventMission_Enter2-1 = "作業計画を伝えますので、集中してください……！"
10149-CVGroup_UIEventMission_Idle1-1 = "水中作業の時は、ちゃんと目標を定めないといけません。"
10149-CVGroup_UIEventMission_Idle2-1 = "ど、どうしました？"
10149-CVGroup_UIEventMission_Idle2-2 = "……私、ポイントを見逃してました？"
10149-CVGroup_UIEventMission_Buy1-1 = "もう終わったんですか？先生、すごいです……！"
10149-CVGroup_UIEventMission_Buy2-1 = "あ、はい！それで大丈夫です！早い……。"
10149-CVGroup_UIEventMission_Interaction1-1 = "今日はこれで終わりにしましょう。"
10149-CVGroup_UIEventMission_Interaction1-2 = "ちゃんと休憩も挟まないと。"
