[translation]
10140-CVGroup_UITitle_Idle1-1 = "蔚藍檔案。"
10140-CVGroup_CharacterGet_Idle1-1 = "我是SRT特殊學園，FOX小隊的尖兵，高倉胡桃哦。\n老師的護衛就交給我吧，我會全力守護你的。\n就是這樣，請多指教囉。"
10140-CVGroup_Cafe_Idle1-1 = "（啊，那把槍上的裝飾好可愛……是在哪裡買的呢？）"
10140-CVGroup_Cafe_Idle2-1 = "（總覺得……我看起來最像大人……？）"
10140-CVGroup_Cafe_Idle3-1 = "這裡的窗戶好乾淨啊……簡直就像我的盾牌一樣。"
10140-CVGroup_Cafe_Idle4-1 = "嗚嗚，肌肉痠痛……是不是訓練過頭了呢……"
10140-CVGroup_Cafe_Idle5-1 = "堂堂正正地……抬頭挺胸……我是老手！"
10140-CVGroup_WeaponGet_Idle1-1 = "FOX-45式衝鋒槍，我收下了。\n雖然火力再高一點的話我會更開心……\n算了，沒差。我的職責是小隊的尖兵。\n負責的是防守，而不是擊破。"
10140-CVGroup_UIEventLobby_Enter1-1 = "「怪談追蹤作戰」……終於要開始了呢。"
10140-CVGroup_UIEventLobby_Enter2-1 = "我會全力以赴的──可不能玷汙了SRT的名聲啊！"
10140-CVGroup_UIEventLobby_Idle1-1 = "在受害者增加之前……"
10140-CVGroup_UIEventLobby_Idle1-2 = "加快腳步吧，老師。"
10140-CVGroup_UIEventLobby_Idle2-1 = "在作戰中吃的豆皮壽司……最讚了。"
10140-CVGroup_UIEventLobby_Idle2-2 = "當，當然，就算沒有那個，我也會好好作戰的！"
10140-CVGroup_UIEventLobby_Idle3-1 = "不管是妖怪還是什麼，我都不會讓它為所欲為的！"
10140-CVGroup_UIEventLobby_Idle4-1 = "喂！不要突然摸人家的肚子啦！？"
10140-CVGroup_ClueSearch_Login_1-1 = "該怎麼辦呢……"
10140-CVGroup_ClueSearch_Login_1-2 = "啊，老師！你來得很剛好嘛！"
10140-CVGroup_ClueSearch_Login_1-3 = "我正在彙整蒐集到的線索，可以幫我一下嗎？"
10140-CVGroup_ClueSearch_Login_2-1 = "你來啦，老師。\n我們來開始推理吧！"
10140-CVGroup_ClueSearch_1-1 = "根據目前的情報能得知的是……"
10140-CVGroup_ClueSearch_2-1 = "啊！別亂碰啦！\n我可是有好好排列過的耶！"
10140-CVGroup_ClueSearch_Find_1-1 = "這份資料，好像在哪裡見過……"
10140-CVGroup_ClueSearch_Registration_1-1 = "很厲害嘛！推理得很完美！"
10140-CVGroup_ClueSearch_Completion_1-1 = "很好！證明完成了！"
