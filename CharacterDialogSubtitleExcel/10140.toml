[translation]
10140-CVGroup_UITitle_Idle1-1 = "Blue Archive"
10140-CVGroup_CharacterGet_Idle1-1 = "ทาคาคุระ คุรุมิ พลชี้เป้าของกองทหาร FOX จากสถาบันพิเศษ SRT\nให้การคุ้มกันคุณครูเป็นหน้าที่ของฉันนะ\nฉันจะปกป้องอย่างสุดกำลังเลยละ ถ้างั้นก็... ฝากตัวด้วยนะ!"
10140-CVGroup_Cafe_Idle1-1 = "(เครื่องประดับของปืนนั้นน่ารักจัง... ไปซื้อมาจากไหนนะ?)"
10140-CVGroup_Cafe_Idle2-1 = "(บางที... ฉันอาจจะอายุมากที่สุดในนี้ก็ได้!)"
10140-CVGroup_Cafe_Idle3-1 = "หน้าต่างที่ขัดสะอาดจนระยิบระยับ...\nเหมือนกับโล่ของฉันเลยนะ"
10140-CVGroup_Cafe_Idle4-1 = "อึก... ปวดกล้ามเนื้อจัง...\nหรือว่าเมื่อวานฝึกหนักมากเกินไป?"
10140-CVGroup_Cafe_Idle5-1 = "ยืดอก... อย่างมั่นใจ...\nก็ฉันเป็นผู้เชี่ยวชาญนี่นา!"
10140-CVGroup_WeaponGet_Idle1-1 = "ได้รับปืนกลมือ FOX รุ่น 45 มาแล้ว\nถึงจะอยากให้ยิงแรงกว่านี้หน่อยก็เถอะ...\nเอาเถอะ ก็หน้าที่ของฉันคือการคุ้มครองกองหทาร\nไม่ใช่การจัดการศัตรูนี่เนอะ"
10140-CVGroup_UIEventLobby_Enter1-1 = "<ปฏิบัติการแกะรอยตำนาน> ในที่สุดก็เริ่มแล้วสินะ..."
10140-CVGroup_UIEventLobby_Enter2-1 = "ฉันจะทำให้เต็มที่ ไม่ให้เสียชื่อ SRT เลยละ!"
10140-CVGroup_UIEventLobby_Idle1-1 = "ก่อนจะมีผู้เสียหายมากไปกว่านี้..."
10140-CVGroup_UIEventLobby_Idle1-2 = "เรารีบไปกันเถอะ คุณครู"
10140-CVGroup_UIEventLobby_Idle2-1 = "ซูชิเต้าหู้หวานที่กินระหว่างทำปฏิบัติการ...\nก็เป็นอาหารรสเลิศอีกแบบนะ..."
10140-CVGroup_UIEventLobby_Idle2-2 = "นะ... แน่นอนว่าฉันไม่ได้ตั้งตารอปฏิบัติการ\nเพราะเรื่องนี้หรอกนะ!"
10140-CVGroup_UIEventLobby_Idle3-1 = "ไม่ว่าจะเป็นผีหรือคน...\nถ้าสร้างความเดือดร้อนตามใจชอบ\nฉันก็ไม่ยกโทษให้หรอก"
10140-CVGroup_UIEventLobby_Idle4-1 = "เดี๋ยวก่อน! ทำไมจู่ๆ ถึงมาจิ้มหน้าท้องคนอื่นล่ะ?"
10140-CVGroup_ClueSearch_Login_1-1 = "ทำไงดีล่ะ..."
10140-CVGroup_ClueSearch_Login_1-2 = "อ๊ะ คุณครู มาได้จังหวะพอดีเลย"
10140-CVGroup_ClueSearch_Login_1-3 = "ฉันกำลังวิเคราะห์เบาะแสที่หามาได้อยู่เลย\nพอจะช่วยหน่อยได้มั้ย?"
10140-CVGroup_ClueSearch_Login_2-1 = "มาแล้วเหรอ คุณครู\nมาเริ่มสันนิษฐานกันเลยดีกว่า!"
10140-CVGroup_ClueSearch_1-1 = "ข้อเท็จจริงที่เราสันนิษฐานได้จากเบาะแสนี้..."
10140-CVGroup_ClueSearch_2-1 = "อ๊ะ อย่าแตะต้องนะ!\nฉันจัดเอาไว้ให้ดูง่ายๆ แล้วนะ!"
10140-CVGroup_ClueSearch_Find_1-1 = "จำได้ว่าเคยเห็นข้อมูลนี้ จากที่ไหนมาแล้วนี่นา..."
10140-CVGroup_ClueSearch_Registration_1-1 = "สุดยอดเลย! สันนิษฐานได้เยี่ยมมาก!"
10140-CVGroup_ClueSearch_Completion_1-1 = "ดีละ! งั้นก็พิสูจน์ได้เรียบร้อย!"
