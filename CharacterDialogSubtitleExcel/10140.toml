[translation]
10140-CVGroup_UITitle_Idle1-1 = "Blue Archive."
10140-CVGroup_CharacterGet_Idle1-1 = "I'm Takakura Kurumi, the point woman for SRT Academy's FOX Squad. Leave the leading to me, Sensei. I'll protect you to the best of my abilities. That said... I look forward to working with you!"
10140-CVGroup_Cafe_Idle1-1 = "(That gun accessory is cute... I wonder where she bought it.)"
10140-CVGroup_Cafe_Idle2-1 = "(I just might...be the most mature one here!)"
10140-CVGroup_Cafe_Idle3-1 = "That clean window is shining...just like my shield."
10140-CVGroup_Cafe_Idle4-1 = "Ugh, my muscles are sore... Did I push myself too hard in training yesterday?"
10140-CVGroup_Cafe_Idle5-1 = "Be proud... Stand up straight... Because I'm a veteran!"
10140-CVGroup_WeaponGet_Idle1-1 = "Confirming receipt of FOX 45-Submachine Gun. I wish it had a bit more firepower... Oh well, my role is to protect the squad, not to crush the enemy, after all."
10140-CVGroup_UIEventLobby_Enter1-1 = "Mission Lore Pursuit... So it's finally time."
10140-CVGroup_UIEventLobby_Enter2-1 = "I'll do my best to honor the name of SRT!"
10140-CVGroup_UIEventLobby_Idle1-1 = "Before there are more victims..."
10140-CVGroup_UIEventLobby_Idle1-2 = "We have to hurry, Sensei."
10140-CVGroup_UIEventLobby_Idle2-1 = "Inarizushi during a mission...really is a delicacy..."
10140-CVGroup_UIEventLobby_Idle2-2 = "Th-That's not why I get excited for missions, though!"
10140-CVGroup_UIEventLobby_Idle3-1 = "Whether it be a ghost or a person... I won't tolerate anything running wild."
10140-CVGroup_UIEventLobby_Idle4-1 = "Wait! Why are you poking my stomach?!"
10140-CVGroup_ClueSearch_Login_1-1 = "What should I do...?"
10140-CVGroup_ClueSearch_Login_1-2 = "Ah, Sensei. Perfect timing."
10140-CVGroup_ClueSearch_Login_1-3 = "I was organizing the clues we've gathered, would you mind giving me a hand?"
10140-CVGroup_ClueSearch_Login_2-1 = "You're here, Sensei. Let's start solving this mystery!"
10140-CVGroup_ClueSearch_1-1 = "What we can deduce with this clue is..."
10140-CVGroup_ClueSearch_2-1 = "Ah, don't touch it! I've organized everything very precisely to make it easy to read!"
10140-CVGroup_ClueSearch_Find_1-1 = "I've seen this data somewhere..."
10140-CVGroup_ClueSearch_Registration_1-1 = "Amazing! That was a perfect deduction!"
10140-CVGroup_ClueSearch_Completion_1-1 = "Perfect! And that's all done!"
