[translation]
10140-CVGroup_UITitle_Idle1-1 = "블루 아카이브."
10140-CVGroup_CharacterGet_Idle1-1 = "SRT 특수학원, FOX 소대의 포인트맨 타카쿠라 쿠루미야.\n선생님의 호위는 내게 맡겨줘. 전력으로 지킬 테니까. 그럼…… 잘 부탁해!"
10140-CVGroup_Cafe_Idle1-1 = "(저 총기 악세서리, 귀엽네…… 어디서 산 걸까?)"
10140-CVGroup_Cafe_Idle2-1 = "(어쩐지…… 여기선 내가 제일 어른스러울지도!)"
10140-CVGroup_Cafe_Idle3-1 = "깨끗이 닦인 창문이 반짝거리는 게… 마치 내 방패 같네."
10140-CVGroup_Cafe_Idle4-1 = "으윽, 근육통이…… 어제 훈련을 너무 격하게 했나?"
10140-CVGroup_Cafe_Idle5-1 = "당당하게…… 가슴을 펴고…… 나는 베테랑이니까!"
10140-CVGroup_WeaponGet_Idle1-1 = "FOX 45식 기관단총 수령 완료.\n조금 더 화력이 강했으면 좋겠지만…… 뭐, 내 역할은 소대를 지키는 거지 적을 쳐부수는 게 아니니까."
10140-CVGroup_UIEventLobby_Enter1-1 = "<로어 추적 작전> 드디어 시작인가……"
10140-CVGroup_UIEventLobby_Enter2-1 = "SRT의 이름에 부끄럽지 않도록, 전력을 다해주겠어!"
10140-CVGroup_UIEventLobby_Idle1-1 = "더 이상의 피해자가 늘어나기 전에……"
10140-CVGroup_UIEventLobby_Idle1-2 = "서두르자, 선생님."
10140-CVGroup_UIEventLobby_Idle2-1 = "작전 중에 먹는 유부초밥…… 이게 또 별미란 말이지……"
10140-CVGroup_UIEventLobby_Idle2-2 = "무, 물론 이것 때문에 작전을 기대하는 건 아니지만!"
10140-CVGroup_UIEventLobby_Idle3-1 = "귀신이든 사람이든…… 제멋대로 구는 건 용서할 수 없어."
10140-CVGroup_UIEventLobby_Idle4-1 = "잠깐! 갑자기 남의 배는 왜 찔러 보는 거야?!"
10140-CVGroup_ClueSearch_Login_1-1 = "어쩌지……"
10140-CVGroup_ClueSearch_Login_1-2 = "아, 선생님. 마침 잘 왔어."
10140-CVGroup_ClueSearch_Login_1-3 = "수집한 단서를 정리하는 중이었는데, 좀 도와줄래?"
10140-CVGroup_ClueSearch_Login_2-1 = "왔구나, 선생님. 바로 추리를 시작하자고!"
10140-CVGroup_ClueSearch_1-1 = "이 단서로 추론할 수 있는 진실은……"
10140-CVGroup_ClueSearch_2-1 = "앗, 만지지 마! 보기 쉽게 정리해두었는데!"
10140-CVGroup_ClueSearch_Find_1-1 = "이 자료, 어디에서 본 기억이 있는데……"
10140-CVGroup_ClueSearch_Registration_1-1 = "대단해! 완벽한 추리였어!"
10140-CVGroup_ClueSearch_Completion_1-1 = "좋아! 이것으로 증명 완료!"
