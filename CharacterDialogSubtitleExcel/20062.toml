[translation]
20062-CVGroup_UITitle_Idle1-1 = "블루…… 음~ ……아! 아카이브!"
20062-CVGroup_CharacterGet_Idle1-1 = "안녕안녕~! 183호 특별반, 니키 에리나에요~.\n어- 오늘은 날도 좋고-\n……어라, 뭐라고 하더라?"
20062-CVGroup_Cafe_Idle1-1 = "와~! 외풍이\n안들어오잖아! 최고!"
20062-CVGroup_Cafe_Idle2-1 = "옷 예쁘다!\n그거 어디서 샀어요?!"
20062-CVGroup_Cafe_Idle3-1 = "아아……\n붉은겨울 번화가보다\n더 좋을지도……."
20062-CVGroup_Cafe_Idle4-1 = "따듯해……\n감기 걱정은\n없겠네요!"
20062-CVGroup_Cafe_Idle5-1 = "저 분, 화학자에\n소질이 있을지도?!"
20062-CVGroup_WeaponGet_Idle1-1 = "이거면 곰도 논쟁도\n완벽하게 준비 완료!"
20062-CVGroup_UIEventLobby_Enter1-1 = "외부인?! \n와, 진짜로……?!"
20062-CVGroup_UIEventLobby_Enter1-2 = " 오세요, 오세요!\n대환영이에요!"
20062-CVGroup_UIEventLobby_Enter2-1 = "혹시 최신자\n신문 있으세요?"
20062-CVGroup_UIEventLobby_Enter2-2 = "한달내로 나온거면\n좋아요!!"
20062-CVGroup_UIEventLobby_Enter3-1 = "안녕안녕 선생님~ \n오늘도 춥죠~"
20062-CVGroup_UIEventLobby_Enter3-2 = "감기 안걸리게 조심……."
20062-CVGroup_UIEventLobby_Enter3-3 = "푸헤읏취이!!"
20062-CVGroup_UIEventLobby_Enter4-1 = "아! 창문 꼭 닫아주세요!\n바람도 들어오고…… "
20062-CVGroup_UIEventLobby_Enter4-2 = "곰도 들어오니까요!"
20062-CVGroup_UIEventLobby_Enter5-1 = "후에에에엥!!!\n선생님 덕분이에요~!!"
20062-CVGroup_UIEventLobby_Idle1-1 = "우우…… 우우우웃……!"
20062-CVGroup_UIEventLobby_Idle1-2 = "……우아악!! "
20062-CVGroup_UIEventLobby_Idle1-3 = "재채기, 들어갔잖아!!"
20062-CVGroup_UIEventLobby_Idle2-1 = "히익! 깜짝이야……!"
20062-CVGroup_UIEventLobby_Idle2-2 = "또 순록이 들어온 줄 알았어요!"
20062-CVGroup_UIEventLobby_Idle3-1 = "응? 혹시 배고프세요?"
20062-CVGroup_UIEventLobby_Idle3-2 = "그러면 뭐라도 만들어 드릴게요!\n저, 식사 담당이거든요!"
20062-CVGroup_UIEventLobby_Idle4-1 = "츄, 츄워효……."
20062-CVGroup_UIEventLobby_Idle4-2 = "두피도 얼어버린 것 같하아……."
20062-CVGroup_UIEventShop_Enter1-1 = "쇼핑!!\n제 전문 분야에요!!"
20062-CVGroup_UIEventShop_Enter2-1 = "뭐부터 사볼까나-♪"
20062-CVGroup_UIEventShop_Enter3-1 = "우웃……. \n쇼핑은 당분간 서비스 종료다아……."
20062-CVGroup_UIEventShop_Idle1-1 = "선생님도 이거 살거에요?\n사버리죠 사버리죠!"
20062-CVGroup_UIEventShop_Idle2-1 = "뭘 살지를 모르겠다면,\n 하나씩 다 사보는거에요!"
20062-CVGroup_UIEventShop_Buy1-1 = "오와앙-! 선생님 멋져요!\n어른의 재력 최고!"
20062-CVGroup_UIEventShop_Buy2-1 = "어흠, 어흠! \n아아- 이게 있으면 행복하겠, 네에-"
20062-CVGroup_UIEventShop_Buy2-2 = "누가 떠-억- 하고\n사주지 않으려나아-"
20062-CVGroup_UIEventShop_Buy3-1 = "혹시나 해서인데요…….\n외출증이나, 그런건 없어요?"
20062-CVGroup_UIEventShop_Buy4-1 = "그러니까 총 합이…….\n하나, 둘……."
20062-CVGroup_UIEventShop_Buy4-2 = "에이, 모르겠다!"
20062-CVGroup_UIEventMission_Enter1-1 = "숙제 따위 할까보냐-!"
20062-CVGroup_UIEventMission_Enter2-1 = "숙제 하기싫어 하기싫어\n하기싫어어-!!"
20062-CVGroup_UIEventMission_Idle1-1 = "찔러도 숙제는 안 끝난다구요?"
20062-CVGroup_UIEventMission_Idle2-1 = "왜요?\n앗, 설마 미루고 나중에 하기?! \n좋아요!!"
20062-CVGroup_UIEventMission_Buy1-1 = "숙제는 싫지만 보상은 좋아요!\n우헤헤-♪"
20062-CVGroup_UIEventMission_Buy2-1 = "오~ 좋네요~!"
20062-CVGroup_UIEventMission_Buy2-2 = "최신 신문지로 포장해주면\n더 좋았을텐데!"
20062-CVGroup_UIEventMission_Interaction1-1 = "예이-! 숙제 끝-! \n놀러갑시다아 선생님!!"
