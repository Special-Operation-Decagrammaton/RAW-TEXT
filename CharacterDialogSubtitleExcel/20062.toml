[translation]
20062-CVGroup_UITitle_Idle1-1 = "ブルー……ん～……あっ！アーカイブ！"
20062-CVGroup_CharacterGet_Idle1-1 = "どもども～！183号特別クラス、二木（にき）エリナで～す。\nえー、本日はお日柄もよく――……あれ、なんて言うんだっけ？"
20062-CVGroup_Cafe_Idle1-1 = "わ～！風が入ってこなくて最高！"
20062-CVGroup_Cafe_Idle2-1 = "服かわいい～！それどこで買ったんですか！？"
20062-CVGroup_Cafe_Idle3-1 = "あぁ……レッドウィンターの繫華街より良いかも……。"
20062-CVGroup_Cafe_Idle4-1 = "あったかーい……風邪引かなくてすみそうです！"
20062-CVGroup_Cafe_Idle5-1 = "あの人、化学者の素質があるかも！？"
20062-CVGroup_WeaponGet_Idle1-1 = "これで熊相手でもバッチリです！もちろん弁論も！"
20062-CVGroup_UIEventLobby_Enter1-1 = "外の人！？えっ、本当に……！？"
20062-CVGroup_UIEventLobby_Enter1-2 = "どーぞどーぞ！大歓迎です！"
20062-CVGroup_UIEventLobby_Enter2-1 = "最近の新聞持ってたりします？"
20062-CVGroup_UIEventLobby_Enter2-2 = "一ヶ月以内だとめっちゃ嬉しいです！"
20062-CVGroup_UIEventLobby_Enter3-1 = "どもども先生～！今日も寒いですよね～"
20062-CVGroup_UIEventLobby_Enter3-2 = "風邪引かないように……"
20062-CVGroup_UIEventLobby_Enter3-3 = "ぶえっくしょんっ！！"
20062-CVGroup_UIEventLobby_Enter4-1 = "あ！窓はちゃんと閉めてくださいね！\n風入ってくるし……"
20062-CVGroup_UIEventLobby_Enter4-2 = "最悪熊が来るんで！"
20062-CVGroup_UIEventLobby_Enter5-1 = "ふええええん！！！\n先生のおかげです～～！！"
20062-CVGroup_UIEventLobby_Idle1-1 = "うぅ……うううぅぅっ……！"
20062-CVGroup_UIEventLobby_Idle1-2 = "……んあ～～っ！"
20062-CVGroup_UIEventLobby_Idle1-3 = "くしゃみ引っ込んじゃったぁ！！"
20062-CVGroup_UIEventLobby_Idle2-1 = "ヒィッ！ビックリしたぁ……！"
20062-CVGroup_UIEventLobby_Idle2-2 = "またトナカイかと思ったぁ！"
20062-CVGroup_UIEventLobby_Idle3-1 = "ん？お腹空いたんです？"
20062-CVGroup_UIEventLobby_Idle3-2 = "んじゃなんか作りますね！私、食事担当なんで！"
20062-CVGroup_UIEventLobby_Idle4-1 = "さ、さぶい……"
20062-CVGroup_UIEventLobby_Idle4-2 = "頭皮まで、凍っちゃうよぉ……。"
20062-CVGroup_UIEventShop_Enter1-1 = "ショッピング！！\n私の得意分野です！！"
20062-CVGroup_UIEventShop_Enter2-1 = "なに買おっかな～♪　"
20062-CVGroup_UIEventShop_Enter3-1 = "うぅ……\nショッピングはしばらくお休みでーす。"
20062-CVGroup_UIEventShop_Idle1-1 = "先生もこれ狙ってました？\n買いましょ買いましょ！"
20062-CVGroup_UIEventShop_Idle2-1 = "どれを買うか悩んだときは、とりあえず全部買ってみるんですよ！"
20062-CVGroup_UIEventShop_Buy1-1 = "おわあ～！先生カッコイイ！\nオトナの財力！最高！"
20062-CVGroup_UIEventShop_Buy2-1 = "ゴホンゴホン！\nアーアー！コレガアッタラ幸セ、ダナ～"
20062-CVGroup_UIEventShop_Buy2-2 = "誰カガばーっと買ってくれたり、\nシナイカナー"
20062-CVGroup_UIEventShop_Buy3-1 = "ちなみになんですけど……\n外出許可証とか、持ってたりします？　"
20062-CVGroup_UIEventShop_Buy4-1 = "合計……いち、に……えっと……。"
20062-CVGroup_UIEventShop_Buy4-2 = "まあ、いい感じで！"
20062-CVGroup_UIEventMission_Enter1-1 = "宿題なんてやるもんかー！"
20062-CVGroup_UIEventMission_Enter2-1 = "宿題やだやだやだやだやだ～～！"
20062-CVGroup_UIEventMission_Idle1-1 = "つっついても宿題は終わりませんよぉ？"
20062-CVGroup_UIEventMission_Idle2-1 = "なんですか？\nえっ？もしかして後回しにするんです？やったー！"
20062-CVGroup_UIEventMission_Buy1-1 = "宿題は嫌だけどご褒美は好きです！\nうっへへっ♪　"
20062-CVGroup_UIEventMission_Buy2-1 = "お～いいですね～！"
20062-CVGroup_UIEventMission_Buy2-2 = "新聞が最新だったら最高だったんですけど！"
20062-CVGroup_UIEventMission_Interaction1-1 = "いぇーい！宿題おーわり！遊びに行きましょ～先生！！"
