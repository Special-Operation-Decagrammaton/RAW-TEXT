[translation]
10145-859-10-1 = "湛藍的天空，\n耀眼的陽光──是夏天呢。\n既然如此，就該去避暑吧？"
10145-859-20-1 = "呵呵……\n汝心中作何想法\n雖不得而知。"
10145-859-30-1 = "妾身可是相當地雀躍哦？"
10145-859-40-1 = "真是個好地方呢。"
10145-859-50-1 = "尤其是那處──"
10145-859-60-1 = "於大自然面前……"
10145-859-70-1 = "吾等將深切地\n體會到自身的無力呢。"
10145-859-80-1 = "只要是和老師一起，\n妃妃無論去哪裡\n都很開心！"
10145-859-90-1 = "……怎麼，\n只是看著嗎？"
10145-859-100-1 = "人人皆有\n稚拙未熟之時。"
10145-859-110-1 = "然而，世間萬理"
10145-859-120-1 = "仍須不斷參悟。\n吾等亦是如此。"
10145-859-130-1 = "安然結束了呢。"
10145-859-140-1 = "呵呵。然而，\n吾等的避暑……"
10145-859-150-1 = "才正要開始，對吧？"
10145-859-160-1 = "嗯？怎麼了，\n老師。"
10145-859-170-1 = "呵呵，來吧。\n盡情地享受吧。"
10145-859-180-1 = "這可是門主的──玉肌哦？"
10145-859-190-1 = "竟能與老師\n一同來到此處……\n當真，如夢一般啊。"
10145-859-200-1 = "呵呵……\n妾身並無深意。"
10145-859-210-1 = "身子也並非有任何不適。"
10145-859-220-1 = "照字面之意理解便可。"
10145-859-230-1 = "青色的蝴蝶，\n於山海經中\n意味著「不滅」。"
10145-859-240-1 = "「永不言棄」……"
10145-859-250-1 = "亦可如此換言呢。"
10145-859-260-1 = "呵呵，無須在意。\n汝僅需視作戲言便可。"
10145-859-270-1 = "令汝隨妾身任性\n真是抱歉呢，\n老師。"
10145-859-280-1 = "感激不盡。"
10145-859-290-1 = "啊啊，說得也是……\n還是先向汝賠個不是吧。"
10145-859-300-1 = "因為接下來……\n妾身打算更加任性哦。"
10145-859-790-1 = "老師你好！\n我是妃妃！"
10145-859-800-1 = "今天是妃妃來顧店哦！"
10145-859-810-1 = "咦，妃姬？\n妃妃有點不太懂……"
10145-859-820-1 = "歡迎光臨，老師！"
10145-859-830-1 = "妃妃，很努力地\n在顧店哦？\n所以請摸摸我！"
10145-859-840-1 = "非常感謝您的光臨！"
10145-859-850-1 = "為了避免錯過，\n還請慢慢參觀哦！"
10145-859-860-1 = "老師喜歡哪個呢？\n妃妃喜歡……"
10145-859-870-1 = "只要是老師選的東西，\n什麼都喜歡！"
10145-859-880-1 = "妃妃試著穿上泳裝了……"
10145-859-890-1 = "如何呢？適合嗎？可愛嗎？"
10145-859-900-1 = "其實妃妃……\n不太擅長游泳。"
10145-859-910-1 = "啊，那個\n妃妃也很好奇！"
10145-859-920-1 = "啊！這種時候\n要這麼說對吧！"
10145-859-930-1 = "「非常感謝您的惠顧！」"
10145-859-940-1 = "哇啊！\n請讓妃妃也看看！"
10145-859-950-1 = "來，請收下！\n請問妃妃做得好嗎？"
