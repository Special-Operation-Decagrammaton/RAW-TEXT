[translation]
10145-10 = "湛藍的天空，\n耀眼的陽光──是夏天呢。\n既然如此，就該去避暑吧？"
10145-20 = "呵呵……\n汝心中作何想法\n雖不得而知。"
10145-30 = "妾身可是相當地雀躍哦？"
10145-40 = "真是個好地方呢。"
10145-50 = "尤其是那處──"
10145-60 = "於大自然面前……"
10145-70 = "吾等將深切地\n體會到自身的無力呢。"
10145-80 = "只要是和老師一起，\n妃妃無論去哪裡\n都很開心！"
10145-90 = "……怎麼，\n只是看著嗎？"
10145-100 = "人人皆有\n稚拙未熟之時。"
10145-110 = "然而，世間萬理"
10145-120 = "仍須不斷參悟。\n吾等亦是如此。"
10145-130 = "安然結束了呢。"
10145-140 = "呵呵。然而，\n吾等的避暑……"
10145-150 = "才正要開始，對吧？"
10145-160 = "嗯？怎麼了，\n老師。"
10145-170 = "呵呵，來吧。\n盡情地享受吧。"
10145-180 = "這可是門主的──玉肌哦？"
10145-190 = "竟能與老師\n一同來到此處……\n當真，如夢一般啊。"
10145-200 = "呵呵……\n妾身並無深意。"
10145-210 = "身子也並非有任何不適。"
10145-220 = "照字面之意理解便可。"
10145-230 = "青色的蝴蝶，\n於山海經中\n意味著「不滅」。"
10145-240 = "「永不言棄」……"
10145-250 = "亦可如此換言呢。"
10145-260 = "呵呵，無須在意。\n汝僅需視作戲言便可。"
10145-270 = "令汝隨妾身任性\n真是抱歉呢，\n老師。"
10145-280 = "感激不盡。"
10145-290 = "啊啊，說得也是……\n還是先向汝賠個不是吧。"
10145-300 = "因為接下來……\n妾身打算更加任性哦。"
10145-790 = "老師您好！\n我是妃妃！"
10145-800 = "今天是妃妃來顧店哦！"
10145-810 = "咦，妃姬？\n妃妃有點不太懂……"
10145-820 = "歡迎光臨，老師！"
10145-830 = "妃妃，很努力地\n在顧店哦？\n所以請摸摸我！"
10145-840 = "非常感謝您的光臨！"
10145-850 = "為了不錯過任何好物，\n還請慢慢參觀哦！"
10145-860 = "老師喜歡哪個呢？\n妃妃喜歡……"
10145-870 = "只要是老師選的東西，\n什麼都喜歡！"
10145-880 = "妃妃試著穿上泳裝了……"
10145-890 = "如何呢？適合嗎？可愛嗎？"
10145-900 = "其實妃妃……\n不太擅長游泳。"
10145-910 = "啊，那個\n妃妃也很好奇！"
10145-920 = "啊！\n這種時候\n要這麼說對吧！"
10145-930 = "「非常感謝您的惠顧！」"
10145-940 = "哇啊！\n請讓妃妃也看看！"
10145-950 = "來，請收下！\n請問妃妃做得好嗎？"
