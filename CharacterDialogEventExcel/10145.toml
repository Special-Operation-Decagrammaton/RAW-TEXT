[translation]
10145-859-10-1 = "Now then, it is summer. As well as a vacation."
10145-859-20-1 = "While I can't pretend to know your thoughts..."
10145-859-30-1 = "Don't you know I myself am quite excited?"
10145-859-40-1 = "A wonderful valley."
10145-859-50-1 = "The scenery, in particular."
10145-859-60-1 = "Before nature, humans..."
10145-859-70-1 = "...are such infinitely small creatures."
10145-859-80-1 = "Sensei! Kiki would go anywhere as long as it's with you!"
10145-859-90-1 = "...Do you just intend to watch me?"
10145-859-100-1 = "Seasons of inexperience are natural for us all."
10145-859-110-1 = "Regardless, one must always remain a student..."
10145-859-120-1 = "...of the machinations of this world."
10145-859-130-1 = "Things have wrapped up safe and sound."
10145-859-140-1 = "However, our vacation... "
10145-859-150-1 = "...has not quite ended yet, has it?"
10145-859-160-1 = "Hm? What is it, Sensei?"
10145-859-170-1 = "Fufu, well then. Enjoy to your heart's content."
10145-859-180-1 = "Your Madam's...soft skin?"
10145-859-190-1 = "It's as if I am adrift in a dream, to be able to visit here with you."
10145-859-200-1 = "Fufu... There is no hidden meaning behind my words."
10145-859-210-1 = "It is not as if my health is failing me."
10145-859-220-1 = "So please hear my words for what they are."
10145-859-230-1 = "The blue butterfly in Shanhaijing, at times, represents immortality."
10145-859-240-1 = "In other words..."
10145-859-250-1 = "...the blue butterfly doesn't give up so easily."
10145-859-260-1 = "Fufu. Disregard it as a joke, if you please."
10145-859-270-1 = "Thank you."
10145-859-280-1 = "For allowing me to be spoiled by you, Sensei."
10145-859-290-1 = "And I offer an advance apology."
10145-859-300-1 = "For I intend to only get worse from here."
10145-859-790-1 = "Hi, Sensei! It's Kiki!"
10145-859-800-1 = "Kiki will be taking care of the shop!"
10145-859-810-1 = "Eh? \"Kisaki\"? What's that? Kiki doesn't know!"
10145-859-820-1 = "Welcome, Sensei!"
10145-859-830-1 = "Kiki was doing a good job taking care of the shop! Please praise Kiki!"
10145-859-840-1 = "Yay! Sensei's here!"
10145-859-850-1 = "Make sure you didn't miss anything, 'kay?"
10145-859-860-1 = "What's your favorite? Hm, for Kiki..."
10145-859-870-1 = "Kiki likes whatever Sensei likes!"
10145-859-880-1 = "Kiki tried putting on a swimsuit..."
10145-859-890-1 = "What do you think? Does it look good? Is Kiki cute?"
10145-859-900-1 = "The thing is, Kiki...is bad at swimming."
10145-859-910-1 = "Ah, Kiki liked that too!"
10145-859-920-1 = "This is...that, right? Kiki knows too!"
10145-859-930-1 = "Thank you so much!"
10145-859-940-1 = "Yay! Kiki too! Kiki wants to see too!"
10145-859-950-1 = "Mhm! It's over here! Did Kiki do a good job, Sensei?"
