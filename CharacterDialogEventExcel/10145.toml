[translation]
10145-10 = "Now then, it is summer. As well as a vacation."
10145-20 = "While I can't pretend to know your thoughts..."
10145-30 = "Don't you know I myself am quite excited?"
10145-40 = "A wonderful valley."
10145-50 = "The scenery, in particular."
10145-60 = "Before nature, humans..."
10145-70 = "...are such infinitely small creatures."
10145-80 = "Sensei! Kiki would go anywhere as long as it's with you!"
10145-90 = "...Do you just intend to watch me?"
10145-100 = "Seasons of inexperience are natural for us all."
10145-110 = "Regardless, one must always remain a student..."
10145-120 = "...of the machinations of this world."
10145-130 = "Things have wrapped up safe and sound."
10145-140 = "However, our vacation... "
10145-150 = "...has not quite ended yet, has it?"
10145-160 = "Hm? What is it, Sensei?"
10145-170 = "Fufu, well then. Enjoy to your heart's content."
10145-180 = "Your Madam's...soft skin?"
10145-190 = "It's as if I am adrift in a dream, to be able to visit here with you."
10145-200 = "Fufu... There is no hidden meaning behind my words."
10145-210 = "It is not as if my health is failing me."
10145-220 = "So please hear my words for what they are."
10145-230 = "The blue butterfly in Shanhaijing, at times, represents immortality."
10145-240 = "In other words..."
10145-250 = "...the blue butterfly doesn't give up so easily."
10145-260 = "Fufu. Disregard it as a joke, if you please."
10145-270 = "Thank you."
10145-280 = "For allowing me to be spoiled with you, Sensei."
10145-290 = "And I offer an advance apology."
10145-300 = "For I intend to only get worse from here."
10145-790 = "Hi, Sensei! It's Kiki!"
10145-800 = "Kiki will be taking care of the shop!"
10145-810 = "Eh? \"Kisaki\"? What's that? Kiki doesn't know!"
10145-820 = "Welcome, Sensei!"
10145-830 = "Kiki was doing a good job taking care of the shop! Please praise Kiki!"
10145-840 = "Yay! Sensei's here!"
10145-850 = "Make sure you didn't miss anything, 'kay?"
10145-860 = "What's your favorite? Hm, for Kiki..."
10145-870 = "Kiki likes whatever Sensei likes!"
10145-880 = "Kiki tried putting on a swimsuit..."
10145-890 = "What do you think? Does it look good? Is Kiki cute?"
10145-900 = "The thing is, Kiki...is bad at swimming."
10145-910 = "Ah, Kiki liked that too!"
10145-920 = "This is...that, right? Kiki knows too!"
10145-930 = "Thank you so much!"
10145-940 = "Yay! Kiki too! Kiki wants to see too!"
10145-950 = "Mhm! It's over here! Did Kiki do a good job, Sensei?"
