[translation]
10145-859-10-1 = "青い空、\n眩しい日差し――夏じゃ。\nとなれば、避暑じゃろう？"
10145-859-20-1 = "ふふっ……\n其方がどう思っているかは\n知らぬが。"
10145-859-30-1 = "妾は、\nとても浮かれておるぞ？"
10145-859-40-1 = "良い場所じゃのう。"
10145-859-50-1 = "とくにあそこ――"
10145-859-60-1 = "自然の前では、"
10145-859-70-1 = "妾たちは無力であると\n痛感させられるのう。"
10145-859-80-1 = "先生と一緒なら、\nキキはどこでも\n嬉しいです！"
10145-859-90-1 = "……なんじゃ、\n見ているだけかえ？"
10145-859-100-1 = "誰しも未熟な時は\nあるというもの。"
10145-859-110-1 = "じゃが、世の理は"
10145-859-120-1 = "学び続けねばならぬ。\n妾たちとて、な。"
10145-859-130-1 = "無事に終わったのう。"
10145-859-140-1 = "ふふっ……じゃが、\n妾たちの避暑は、"
10145-859-150-1 = "まだまだこれから\nじゃろう？"
10145-859-160-1 = "ん？どうしたのじゃ、\n先生。"
10145-859-170-1 = "ふふっ、ほれ。\n存分に堪能すると良い。"
10145-859-180-1 = "門主の柔肌――じゃよ？"
10145-859-190-1 = "ここへ先生と\n来られるなんて……\nまこと、夢のようじゃ。"
10145-859-200-1 = "ふふっ……\n深い意味はないさの。"
10145-859-210-1 = "身体の調子が\n悪いわけでもない。"
10145-859-220-1 = "言葉とおりに\n受け止めると良い。"
10145-859-230-1 = "青い蝶は、\n山海経において「不滅」を\n意味する。"
10145-859-240-1 = "「諦めを知らぬ」"
10145-859-250-1 = "とも言い換えられるな。"
10145-859-260-1 = "ふふ。なあに、\nただの戯言だと\n思ってくれて構わんよ。"
10145-859-270-1 = "妾のワガママに\n付き合ってもらって\n悪いのう、先生。"
10145-859-280-1 = "恩に着る。"
10145-859-290-1 = "ああ、そうさな……\n先に謝っておこうか。"
10145-859-300-1 = "……今からもっと、\n我が儘を言うつもり\nじゃからの。"
10145-859-790-1 = "先生こんにちは！\nキキです！"
10145-859-800-1 = "今日はお店番を\nすることになりました！"
10145-859-810-1 = "えっ、キサキ？\nキキにはちょっと\n分からないです……。"
10145-859-820-1 = "いらっしゃいませ、先生！"
10145-859-830-1 = "キキ、お店番\n頑張ってるんですよ？\nなでなでしてください！"
10145-859-840-1 = "来てくださり\nありがとうございます！"
10145-859-850-1 = "お買い逃しのないよう、\nゆっくり見ていって\nくださいね！"
10145-859-860-1 = "先生はどれが好きですか？\nキキは～……。"
10145-859-870-1 = "先生が選んだ\nものなら、\n何でも好きです！"
10145-859-880-1 = "水着、\n着てみたんですが……。"
10145-859-890-1 = "どうでしょう？\n似合っていますか？\n可愛いですか？"
10145-859-900-1 = "実はキキ……泳ぐの\n得意じゃないんです。"
10145-859-910-1 = "あっ、それキキも\n気になってました！"
10145-859-920-1 = "あっ！\nこういう時には\nこう言うんですよね！"
10145-859-930-1 = "「お買い上げ\nありがとうございます！」"
10145-859-940-1 = "わあ！\nキキにも見せて\nください！"
10145-859-950-1 = "はい、どうぞ！\nキキ、よくできてますか？"
