[translation]
10145-859-10-1 = "เอาละ นี่คือฤดูร้อน\nและการพักร้อน"
10145-859-20-1 = "ไม่รู้ว่าครู\nจะคิดอย่างไร แต่ว่า..."
10145-859-30-1 = "ตอนนี้เรากำลังตื่นเต้น\nอยู่ไม่น้อยเลยนะ?"
10145-859-40-1 = "เป็นหุบเขาที่ดีจริงเชียว"
10145-859-50-1 = "โดยเฉพาะ\nทิวทัศน์ตรงนั้น"
10145-859-60-1 = "มนุษย์น่ะ\nเมื่ออยู่ต่อหน้าธรรมชาติแล้ว"
10145-859-70-1 = "ก็เป็นเพียงตัวตน\nอันน้อยนิดถึงเพียงนี้"
10145-859-80-1 = "คุณครู! คิกิน่ะ!\nถ้าได้อยู่กับคุณครู\nจะไปที่ไหนก็ได้ทั้งนั้นค่ะ!"
10145-859-90-1 = "จะเอาแต่มองดู\nอยู่เฉยๆ หรือ...?"
10145-859-100-1 = "ทุกคนย่อมเคยมี\nช่วงเวลาที่ยังอ่อนหัด"
10145-859-110-1 = "แต่เรื่องนั้นก็ส่วนเรื่องนั้น\nกฎเกณฑ์ของโลกน่ะ"
10145-859-120-1 = "ย่อมเป็นสิ่งที่ต้อง\nศึกษาอยู่เสมอ"
10145-859-130-1 = "ทุกอย่างจบลงด้วยดีแล้วสินะ"
10145-859-140-1 = "แต่การพักร้อน\n'ของเรา'"
10145-859-150-1 = "ดูเหมือนจะยังไม่\nจบลงอย่างสมบูรณ์นะ?"
10145-859-160-1 = "หืม? เป็นอะไรไปหรือ ครู?"
10145-859-170-1 = "ฮุฮุ เอาละ\nจงดื่มด่ำให้เต็มที่เถอะ"
10145-859-180-1 = "ผิวเนียนนุ่มของประมุข...\nอย่างไรเล่า?"
10145-859-190-1 = "ช่างเหมือนฝันจริงๆ\nที่ได้มายัง\nสถานที่แบบนี้กับครู"
10145-859-200-1 = "ฮุฮุ... ไม่ได้มีความหมายพิเศษ\nอะไรหรอก"
10145-859-210-1 = "สุขภาพของเรา\nก็ไม่ได้แย่ด้วย"
10145-859-220-1 = "เราอยากให้ครู\nเข้าใจตามที่\nพูดไปตรงๆ"
10145-859-230-1 = "ในซานไห่จิง\nผีเสื้อสีน้ำเงินบางครั้งก็\nสื่อถึงความเป็นนิรันดร์"
10145-859-240-1 = "นั่นหมายความว่า\nผีเสื้อสีน้ำเงินนั้น..."
10145-859-250-1 = "มีความหมายว่า\nไม่ยอมแพ้\nง่ายๆ เช่นกัน"
10145-859-260-1 = "ฮุฮุ ไม่เป็นไร\nจะคิดว่าเป็นเพียง\nเรื่องล้อเล่นก็ได้"
10145-859-270-1 = "วันนี้...\nขอบคุณมากจริงๆ"
10145-859-280-1 = "ที่ยอมตามใจเรานะ ครู"
10145-859-290-1 = "และเราขอโทษ\nไว้ก่อนล่วงหน้า"
10145-859-300-1 = "เพราะจากนี้ไป\nเราจะอ้อนให้มาก\nยิ่งกว่านี้น่ะสิ"
10145-859-790-1 = "สวัสดีค่ะ คุณครู!\nคิกิเองค่ะ!"
10145-859-800-1 = "คิกิได้มาดูแลร้านค้าค่ะ!"
10145-859-810-1 = "คะ? คิซากิน่ะเหรอคะ?\nคิกิไม่รู้เรื่องแบบนั้นหรอกค่ะ!"
10145-859-820-1 = "เชิญค่ะ คุณครู!"
10145-859-830-1 = "คิกิตั้งใจดูแลร้านค้าอยู่ค่ะ!\nชมกันหน่อยสิคะ!"
10145-859-840-1 = "คุณครูมาหา\nกันด้วยค่ะ!"
10145-859-850-1 = "ถ้ายังขาดอะไรอยู่\nก็เชิญเลือกชมได้เต็มที่เลยค่ะ!"
10145-859-860-1 = "คุณครูชอบของแบบไหนเหรอคะ?\nส่วนคิกิน่ะ..."
10145-859-870-1 = "ถ้าเป็นของที่คุณครูเลือกให้\nไม่ว่าอะไรก็ชอบค่ะ!"
10145-859-880-1 = "คิกิลองใส่\nชุดว่ายน้ำมาค่ะ..."
10145-859-890-1 = "เป็นยังไงบ้างคะ? เข้ากันดีมั้ยคะ?\nน่ารักหรือเปล่าคะ?"
10145-859-900-1 = "จริงๆ แล้ว คิกิ...\nว่ายน้ำไม่ค่อยเก่งค่ะ"
10145-859-910-1 = "อ๊ะ คิกิก็ว่าอันนั้น\nดูดีเหมือนกันค่ะ!"
10145-859-920-1 = "ในเวลาแบบนี้... ต้องเป็นแบบนั้นใช่มั้ยคะ?\nคิกิเองก็รู้เหมือนกันนะคะ!"
10145-859-930-1 = "ขอบคุณเสมอเลยค่ะ!"
10145-859-940-1 = "ว้าว! คิกิขอดูด้วยค่ะ!\nคิกิดูด้วย!"
10145-859-950-1 = "ค่ะ! นี่ค่ะ!\nคิกิทำได้ดีใช่มั้ยคะ คุณครู?"
