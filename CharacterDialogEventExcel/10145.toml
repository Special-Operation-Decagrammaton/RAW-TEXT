[translation]
10145-10 = "เอาละ นี่คือฤดูร้อน\nและการพักร้อน"
10145-20 = "ไม่รู้ว่าครู\nจะคิดอย่างไร แต่ว่า..."
10145-30 = "ตอนนี้เรากำลังตื่นเต้น\nอยู่ไม่น้อยเลยนะ?"
10145-40 = "เป็นหุบเขาที่ดีจริงเชียว"
10145-50 = "โดยเฉพาะ\nทิวทัศน์ตรงนั้น"
10145-60 = "มนุษย์น่ะ\nเมื่ออยู่ต่อหน้าธรรมชาติแล้ว"
10145-70 = "ก็เป็นเพียงตัวตน\nอันน้อยนิดถึงเพียงนี้"
10145-80 = "คุณครู! คิกิน่ะ!\nถ้าได้อยู่กับคุณครู\nจะไปที่ไหนก็ได้ทั้งนั้นค่ะ!"
10145-90 = "จะเอาแต่มองดู\nอยู่เฉยๆ หรือ...?"
10145-100 = "ทุกคนย่อมเคยมี\nช่วงเวลาที่ยังอ่อนหัด"
10145-110 = "แต่เรื่องนั้นก็ส่วนเรื่องนั้น\nกฎเกณฑ์ของโลกน่ะ"
10145-120 = "ย่อมเป็นสิ่งที่ต้อง\nศึกษาอยู่เสมอ"
10145-130 = "ทุกอย่างจบลงด้วยดีแล้วสินะ"
10145-140 = "แต่การพักร้อน\n'ของเรา'"
10145-150 = "ดูเหมือนจะยังไม่\nจบลงอย่างสมบูรณ์นะ?"
10145-160 = "หืม? เป็นอะไรไปหรือ ครู?"
10145-170 = "ฮุฮุ เอาละ\nจงดื่มด่ำให้เต็มที่เถอะ"
10145-180 = "ผิวเนียนนุ่มของประมุข...\nอย่างไรเล่า?"
10145-190 = "ช่างเหมือนฝันจริงๆ\nที่ได้มายัง\nสถานที่แบบนี้กับครู"
10145-200 = "ฮุฮุ... ไม่มีความหมาย\nอะไรพิเศษหรอก"
10145-210 = "สุขภาพของเรา\nก็ไม่ได้แย่ด้วย"
10145-220 = "เราอยากให้ครู\nเข้าใจตามที่\nพูดไปตรงๆ"
10145-230 = "ในซานไห่จิง\nผีเสื้อสีน้ำเงินบางครั้งก็\nสื่อถึงความเป็นนิรันดร์"
10145-240 = "นั่นหมายความว่า\nผีเสื้อสีน้ำเงินนั้น..."
10145-250 = "มีความหมายว่า\nไม่ยอมแพ้\nง่ายๆ เช่นกัน"
10145-260 = "ฮุฮุ ไม่เป็นไร\nจะคิดว่าเป็นเพียง\nเรื่องล้อเล่นก็ได้"
10145-270 = "วันนี้...\nขอบคุณมากจริงๆ"
10145-280 = "ที่ยอมตามใจเรานะ"
10145-290 = "และเราขอโทษ\nล่วงหน้าไว้ก่อน"
10145-300 = "เพราะจากนี้ไป\nเราจะอ้อนให้มาก\nยิ่งกว่านี้น่ะสิ"
10145-790 = "สวัสดีค่ะ คุณครู!\nคิกิเองค่ะ!"
10145-800 = "คิกิได้มาดูแลร้านค้าค่ะ!"
10145-810 = "คะ? คิซากิน่ะเหรอคะ?\nคิกิไม่รู้เรื่องแบบนั้นหรอกค่ะ!"
10145-820 = "เชิญค่ะ คุณครู!"
10145-830 = "คิกิตั้งใจดูแลร้านค้าอยู่ค่ะ!\nชมกันหน่อยสิคะ!"
10145-840 = "คุณครูมาหา\nกันด้วยค่ะ!"
10145-850 = "ถ้ายังขาดอะไรอยู่\nก็เชิญเลือกชมได้เต็มที่เลยค่ะ!"
10145-860 = "คุณครูชอบของแบบไหนเหรอคะ?\nส่วนคิกิน่ะ..."
10145-870 = "ถ้าเป็นของที่คุณครูเลือกให้\nไม่ว่าอะไรก็ชอบค่ะ!"
10145-880 = "ฉันลองใส่\nชุดว่ายน้ำมาค่ะ..."
10145-890 = "เป็นยังไงบ้างคะ?\nเข้ากับฉันมั้ยคะ?\nน่ารักหรือเปล่าคะ?"
10145-900 = "จริงๆ แล้ว คิกิ...\nว่ายน้ำไม่ค่อยเก่งค่ะ"
10145-910 = "อ๊ะ คิกิก็ว่าอันนั้น\nดูดีเหมือนกันค่ะ!"
10145-920 = "ในเวลาแบบนี้... ต้องอันนั้นใช่มั้ยคะ?\nคิกิก็รู้นะคะ!"
10145-930 = "ขอบคุณเสมอเลยค่ะ!"
10145-940 = "ว้าว! คิกิขอดูด้วยค่ะ!\nคิกิดูด้วย!"
10145-950 = "ค่ะ! นี่ค่ะ!\nคิกิทำได้ดีใช่มั้ยคะ คุณครู?"
