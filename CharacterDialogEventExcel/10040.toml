[translation]
10040-813-310-1 = "ชมรมวิจัยศาสตร์นินจา\nออกปฏิบัติการค่ะ...!"
10040-813-320-1 = "ไม่ว่ายังไงก็คง...\nทำได้ใช่มั้ย...คะ?"
10040-813-330-1 = "เรื่องพวกนี้\nพวกเราจะแก้ไขเองค่ะ!"
10040-813-340-1 = "ตะ...ตอนนี้เราตกลง\nว่าจะทำแบบนั้นค่ะ...?"
10040-813-350-1 = "ตะ...แต่ว่าดูเหมือน\nจะแก้ไขไม่ได้ง่ายๆ เลยนะคะ...\nฉันจะพยายามค่ะ...!"
10040-813-360-1 = "ดูเหมือนจะเรียบร้อย...\nแล้วนะคะ..."
10040-813-370-1 = "นี่ก็เพราะได้คุณครู\nช่วยเอาไว้ค่ะ"
10040-813-380-1 = "ขอบคุณมากค่ะ\nคุณครู ฉัน... พอช่วยคุณครู...\nได้บ้างรึเปล่าคะ...?"
10040-813-390-1 = "ขะ...ขอโทษค่ะ\nที่ตัวโตแบบนี้..."
10040-813-400-1 = "เรื่องแบบนี้..."
10040-813-410-1 = "เป็นเรื่องที่ชมรมวิจัยศาสตร์นินจา\nจะต้องแก้ไขค่ะ... บางที..."
10040-813-420-1 = "อะ...อาจจะทำได้ดีก็ได้...ค่ะ\nคือฉัน..."
10040-813-630-1 = "อุปกรณ์นินจาและอื่นๆ ก็เตรียมมา\nพร้อมหมดแล้ว เชิญเลือกดูได้เลยค่ะ..."
10040-813-640-1 = "ถ้าต้องการอะไร\nแล้วพวกเราช่วยได้ก็คงดีนะคะ..."
10040-813-650-1 = "คลี่คลายเหตุการณ์ได้แล้วก็จริง...\nถ้าสนใจอะไรละก็...\nตอนนี้ยังไม่สายไปนะคะ..."
10040-813-660-1 = "อา... คือว่าตัวฉัน...\nไม่ใช่สินค้าที่วางขายนะคะ..."
10040-813-670-1 = "คือว่าฉันเกะกะหรือเปล่าคะ?\nขอโทษด้วยค่ะ ฉันจะหลีกทางให้ค่ะ..."
10040-813-680-1 = "ค่ะ ฉันว่ามันเป็นอุปกรณ์นินจา\nที่ยอดเยี่ยมมากเลยค่ะ...!"
10040-813-690-1 = "ถ้าฉันเป็นประโยชน์\nให้คุณครูได้สักนิดคงดีค่ะ..."
10040-813-700-1 = "ขอบคุณค่ะ คุณครู"
10040-813-710-1 = "ของชิ้นนั้น แล้วก็ชิ้นนี้...\nสมกับเป็นคุณครูจริงๆ เลยค่ะ!"
