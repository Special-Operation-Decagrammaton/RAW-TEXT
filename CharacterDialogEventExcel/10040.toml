[translation]
10040-813-310-1 = "忍術研究部、\n出動です……！"
10040-813-320-1 = "きっと何とか、\nなります……よね？"
10040-813-330-1 = "この事件は、私たちが、\n解決します……！"
10040-813-340-1 = "今ので、\n決まってました……？"
10040-813-350-1 = "簡単には、解決でき\nなさそう、ですね……\n頑張り、ます……！"
10040-813-360-1 = "そろそろ、落ち着き\nそうな、感じが……"
10040-813-370-1 = "これもみんなと、\n先生のお陰、です……"
10040-813-380-1 = "お疲れ様でした、先生。\n私……少しは役に、\n立てましたか……？"
10040-813-390-1 = "大きくって、\nごめんなさい……"
10040-813-400-1 = "どうして、\nこんなことに……"
10040-813-410-1 = "忍術研究部が、解決して、\nみせます……多分……"
10040-813-420-1 = "私に何とか、できるので、\nしょうか……"
10040-813-630-1 = "忍具など、\n色々揃ってますので……どうぞ"
10040-813-640-1 = "何か必要でしたら、\nこちらで。お役に立てると、\n良いのですが……"
10040-813-650-1 = "事件は無事、終わりましたが……\n何か、気になるようでしたら、\nあっはい。まだ、間に合いますので……"
10040-813-660-1 = "ん……？えっと、私はその、\n売り物ではなく……"
10040-813-670-1 = "もしかして、邪魔、ですか？\nごめんなさい、どきますね……"
10040-813-680-1 = "はい、良い忍具だと、\n思います……！"
10040-813-690-1 = "少しでも、\nお役に立てればと……"
10040-813-700-1 = "ありがとう、ございます、\n先生。"
10040-813-710-1 = "なるほど、それと、それと……\n流石は先生、です！"
