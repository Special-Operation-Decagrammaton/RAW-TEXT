[translation]
10040-813-310-1 = "인법연구부,\n출동이에요…!"
10040-813-320-1 = "분명, 어떻게든,\n되겠……죠?"
10040-813-330-1 = "이 사건은 저희가\n해결합니다!"
10040-813-340-1 = "지, 지금 그렇게\n하기로 해, 했으니까요…?"
10040-813-350-1 = "간단하게는, 해결되지\n않을 것, 같네요….\n힘낼, 게요…!"
10040-813-360-1 = "슬슬, 마무리될 것\n같은, 느낌이……."
10040-813-370-1 = "이것도 모두와, 선생님\n덕분, 이에요……."
10040-813-380-1 = "수고하셨습니다.\n선생님. 저…. 조금은\n도움이, 되었을까요……?"
10040-813-390-1 = "커, 커다랗기만\n해서 죄송해요오……"
10040-813-400-1 = "어째서 이런 일이……"
10040-813-410-1 = "인법연구부가 해결할,\n거예요…. 아마도……."
10040-813-420-1 = "자, 잘할 수 있을, 까요,\n제가……"
10040-813-630-1 = "닌자도구 등, 여러 가지를\n준비했으니까….\n골라 보세요…."
10040-813-640-1 = "무언가 필요하시다면, 이쪽에서.\n도움이 된다면, 좋겠는데요……."
10040-813-650-1 = "사건은 무사히, 끝났지만…….\n뭔가, 신경 쓰이신다면, 네.\n아직, 늦지 않았으니까요……."
10040-813-660-1 = "아…. 저기, 저는 그게,\n파는 물건이 아니라……."
10040-813-670-1 = "혹시, 방해, 되나요?\n죄송합니다.\n비켜 있을게요……."
10040-813-680-1 = "네, 훌륭한\n닌자도구라고,\n생각해요…!"
10040-813-690-1 = "조금이라도,\n도움이 되었으면…."
10040-813-700-1 = "감사, 합니다, 선생님."
10040-813-710-1 = "과연, 그거랑, 그거랑…….\n역시, 선생님, 이시네요!"
