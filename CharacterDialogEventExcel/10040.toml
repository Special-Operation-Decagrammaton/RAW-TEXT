10040-813-310-1 = "Let's go, Ninjutsu Research Club!"
10040-813-320-1 = "I'm sure we'll figure it out, right...?"
10040-813-330-1 = "We'll solve this incident!"
10040-813-340-1 = "B-Because we decided to do so...?"
10040-813-350-1 = "I guess it's not gonna be that simple to resolve... I'll try my best!"
10040-813-360-1 = "I think it's about over..."
