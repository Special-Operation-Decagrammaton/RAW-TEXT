[translation]
16005-803-200-1 = "あっ、せ、先生…！？\nえ、えっと…その…\nよ、よろしく\nお願いします…！"
16005-803-210-1 = "（この水着、\n先生はどう思うかな…）"
16005-803-220-1 = "あっ、\nあぅぅ…！！！"
16005-803-230-1 = "あ…あの…\nうぅ…えっと…。"
16005-803-240-1 = "あ、先生…\nわ、私の方は、\n準備できてます…。"
16005-803-250-1 = "（どうしよう\nどうしよう\nどうしよう\nどうしよう…！？）"
16005-803-260-1 = "つ、ツルギ！"
16005-803-270-1 = "出撃します…！"
