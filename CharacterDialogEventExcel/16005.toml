[translation]
16005-803-200-1 = "คะ...คุณครู!? นะ.. นี่มัน..?\nถะ... ถ้าอย่างนั้นก็...\nระ...รบกวนด้วยนะคะ...!"
16005-803-210-1 = "(แต่งตัวแบบนี้\nคุณครูจะคิดยังไงนะ...)"
16005-803-220-1 = "ฮะ... เฮือก...!!!"
16005-803-230-1 = "เอ่อ... คือ...\nอืม... คือว่า..."
16005-803-240-1 = "ฉะ...ฉันพร้อมแล้วค่ะ...\nคุณครู..."
16005-803-250-1 = "(ทำยังไงดี ทำยังไงดี\nทำยังไงดี... ทำยังไงดี...!?)"
16005-803-260-1 = "ซึ...ซึรุกิ!"
16005-803-270-1 = "จะบุกโจมตีแล้วนะคะ!"
