[translation]
16005-803-200-1 = "老、老師…！？這、這個…。\n就、就是那個…。\n請、請多多指教…！"
16005-803-210-1 = "(這種樣子…\n老師\n會怎麼想呢…)"
16005-803-220-1 = "呼、呼…！！！"
16005-803-230-1 = "哦…這…\n嗯…那個…"
16005-803-240-1 = "啊，老師……\n我、我準備好了…"
16005-803-250-1 = "(怎麼辦呢？怎麼辦呢？\n怎麼辦呢？怎麼辦呢…？！)"
16005-803-260-1 = "弦、弦生！"
16005-803-270-1 = "我要出擊了…！"
16005-10803-200-1 = "老、老師…！？ 這、這個…\n那、那個…\n萬、萬事拜託了…！"
16005-10803-210-1 = "(這種模樣…\n老師\n會怎麼想我呢…)"
16005-10803-220-1 = "呃、呃哈…！！！"
16005-10803-230-1 = "喔… 那個…\n呃… 那個…"
16005-10803-240-1 = "啊，老師……\n我、我準備好了…"
16005-10803-250-1 = "(怎麼辦？怎麼辦？\n怎麼辦？怎麼辦…！？)"
16005-10803-260-1 = "弦、弦生！"
16005-10803-270-1 = "要出動了…！"
16005-900803-200-1 = "啊，老，老師…！？\n那，那個…這個…\n請，請多多指教…！"
16005-900803-210-1 = "（這套泳裝…\n　老師會怎麼想呢…）"
16005-900803-220-1 = "啊，啊嗚…！！！"
16005-900803-230-1 = "那…那個…\n嗚…呃…"
16005-900803-240-1 = "啊，老師…\n我，我準備好了…"
16005-900803-250-1 = "（怎麼辦怎麼辦\n　怎麼辦怎麼辦…！？）"
16005-900803-260-1 = "弦，弦生！"
16005-900803-270-1 = "現在出擊…！"
