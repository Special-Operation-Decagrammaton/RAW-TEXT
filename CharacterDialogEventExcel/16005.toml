16005-803-220-1 = "Wh-Whoa!"
16005-803-230-1 = "Oh... Um... Uh..."
16005-803-240-1 = "I...I'm ready, Sensei."
16005-803-250-1 = "(What to do, what to do...? What am I going to do?!)"
16005-803-260-1 = "Ts-Tsurugi!"
16005-803-270-1 = "Let's go!"
