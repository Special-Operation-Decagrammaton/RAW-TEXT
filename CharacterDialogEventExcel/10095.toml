[translation]
10095-825-1110-1 = "ฉันกำลังรอให้นายท่าน\nมาถึงอยู่เลยค่ะ\nวันนี้ก็ขอรบกวนด้วยนะคะ"
10095-825-1120-1 = "ตอนนี้ฉัน\nเหมือนเมดใช่มั้ยคะ!?"
10095-825-1130-1 = "คฤหาสน์หลังใหญ่จังเลยนะคะ...\nงานที่ต้องทำก็น่าจะมีอยู่เยอะ\nไม่แพ้กันเลยค่ะ"
10095-825-1140-1 = "ถ้าทำทีละอย่างๆ\nไปเรื่อยๆ\nก็คงจะเสร็จละค่ะ"
10095-825-1150-1 = "ก็ฉันมีคุณครูอยู่ด้วยนี่คะ"
10095-825-1160-1 = "ที่นี่กำลังเกิด\nอะไรขึ้นกันแน่คะ..."
10095-825-1170-1 = "ไม่ได้ ไม่ได้\nเราต้องตั้งสติสิ"
10095-825-1180-1 = "ขืนให้พี่โมโมอิ\nทำทั้งหมดละก็...!"
10095-825-1190-1 = "อย่างที่บอกเลยค่ะ...\nชีวิตก็คือการเกิด\nสิ่งที่คาดไม่ถึงสินะคะ"
10095-825-1200-1 = "แต่ฉันก็จะพยายาม\nจนถึงที่สุดเลยค่ะ\nนายท่าน"
10095-825-1210-1 = "ถึงจะยังบกพร่อง\nอยู่หลายเรื่อง\nแต่ก็พึ่งพาฉันได้เลยค่ะ!"
10095-825-1220-1 = "เราทำสิ่งนั้นกัน\nจนหมดเลยนะคะเนี่ย..."
10095-825-1230-1 = "ถึงตอนนี้ฉันยังไม่เชื่อเลยค่ะ\nระหว่างนั้นฉันคิดด้วยนะคะ\nว่านี่มันเกิดอะไรขึ้น..."
10095-825-1240-1 = "ขอบคุณค่ะ คุณครู\nเพราะได้คุณครูช่วยไว้เลยค่ะ"
10095-825-1250-1 = "เรียกฉันเหรอคะ คุณครู?"
10095-825-1260-1 = "ค่ะ ฉันกำลังครุ่นคิดว่า\nมีงานอะไรบ้าง\nที่เมดทำกันน่ะค่ะ"
10095-825-1270-1 = "คะ? เท่าที่เป็นตอนนี้\nก็เพียงพอแล้วเหรอคะ...?"
10095-825-1280-1 = "สิ่งที่สำคัญ\nคือการเริ่มทำตั้งแต่\nสิ่งที่ทำได้ตอนนี้ค่ะ"
10095-825-1290-1 = "ฉันจะบอก...\nแค่ที่นี่นะคะ"
10095-825-1300-1 = "ถ้าไม่ทำแบบนั้น\nชมรมของเรา\nก็อาจไปต่อไม่ได้..."
10095-825-1310-1 = "ว่ากันว่าประสบการณ์ต่างๆ\nเป็นแรงกระตุ้น\nความคิดสร้างสรรค์..."
10095-825-1320-1 = "แต่ว่าแบบนี้มัน..."
10095-825-1330-1 = "ทั้งสภาพแวดล้อม ชุด ปัจจัย...\nมีเงื่อนไขทุกอย่าง\nครบเลยนะคะ"
10095-825-1340-1 = "นายท่าน ถ้าอย่างนั้น\nวันนี้ฉันก็จะอยู่ด้วยค่ะ"
10095-10825-1110-1 = "ฉันกำลังรอให้นายท่าน\nมาถึงอยู่เลยค่ะ\nวันนี้ก็ขอรบกวนด้วยนะคะ"
