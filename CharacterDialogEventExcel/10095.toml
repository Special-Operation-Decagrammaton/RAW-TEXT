[translation]
10095-825-1110-1 = "ご主人様が来るのを、\nお待ちしておりました。\n本日もよろしく\nお願いします。"
10095-825-1120-1 = "今のちょっと\nメイドっぽかった\nですよね！？"
10095-825-1130-1 = "すごい豪邸ですね……\nやることもたくさん\nありそうです。"
10095-825-1140-1 = "ひとつずつ着実に\nやっていけば何とか\nなるはずです。"
10095-825-1150-1 = "先生も、一緒ですから。"
10095-825-1160-1 = "ここで一体何が\n起こっているの\nでしょう……？"
10095-825-1170-1 = "ダメダメ、私だけでも\nちゃんと気を引き\n締めないと。"
10095-825-1180-1 = "お姉ちゃんに\n全部任せてたら……！"
10095-825-1190-1 = "文字通り……\n想像もつかないことが\n起こるのが人生、\nなんですね。"
10095-825-1200-1 = "でも、最後まで\n修行します、ご主人様。"
10095-825-1210-1 = "至らないところの\n多い私ですが、\n頼ってください！"
10095-825-1220-1 = "あれを全部\nやり遂げたん\nですね……"
10095-825-1230-1 = "今でも信じられ\nないです。途中、\nどうなってしまうのかと\n思っていましたが……"
10095-825-1240-1 = "ありがとうございます。\n全部、先生の\nおかげです。"
10095-825-1250-1 = "呼びましたか、先生？"
10095-825-1260-1 = "はい。\nメイドらしい仕事って\n何があるんだろう\nと悩んでました。"
10095-825-1270-1 = "え？その姿勢だけでも\n十分……？"
10095-825-1280-1 = "大切なのは、\n今できることから\nこなすことです。"
10095-825-1290-1 = "……ここだけの\n話ですが、"
10095-825-1300-1 = "そうしないとうちの\n部は上手く\n回らないので……"
10095-825-1310-1 = "色んな経験は\n創作の原動力とは\nいいますが……"
10095-825-1320-1 = "これはちょっと……"
10095-825-1330-1 = "環境、衣服、要素……\nすべての条件が\n揃ったことに\nなりますね。"
10095-825-1340-1 = "では、ご主人様。\n本日も、お供させて\nいただきます。"
