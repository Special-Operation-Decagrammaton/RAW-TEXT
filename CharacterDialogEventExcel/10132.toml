[translation]
10132-853-180-1 = "先生……！？\nこのドレス……やっぱり、\n変、でしょうか……？"
10132-853-190-1 = "おかえりなさい、\n先生……。"
10132-853-200-1 = "ええと、\nこの格好は、\nその……。"
10132-853-210-1 = "一体……何が\n起きてるんですか……？"
10132-853-220-1 = "ステージの上は……\n不思議、です。"
10132-853-230-1 = "たくさんの方に、\n見られてる、のに……"
10132-853-240-1 = "孤独、だと思う瞬間が、\nあります……。"
10132-853-250-1 = "みなさん……！私……\n帰って、きました……！"
10132-853-260-1 = "私は……\nこの衣装に、相応しい\nのでしょうか……。"
10132-853-270-1 = "やっぱり、\n目立ってます、よね……？"
10132-853-280-1 = "うぅ……\n私、忍者なのに……。"
10132-853-290-1 = "き、き、ききキレイ、\nですか……！？"
10132-853-300-1 = "ひゃうううぅ……。"
10132-853-310-1 = "この服も、"
10132-853-320-1 = "変装の術だと、\n思えば……。"
10132-853-590-1 = "やることを、\nまとめて、みました……。"
10132-853-600-1 = "どれも簡単ではない、\nですが……"
10132-853-610-1 = "先生なら、きっと……！"
10132-853-620-1 = "えっと……\n私のまとめたものに……\n問題でも、ありましたか……？"
10132-853-630-1 = "先生……？\nどうか、しましたか……？"
10132-853-640-1 = "さすが、です……！"
10132-853-650-1 = "先生ならできるって、\n信じてました……！"
10132-853-660-1 = "すごいです……！\n先生にも、忍者の才能が……！？"
10132-853-670-1 = "お疲れ様、です……！\n素晴らしいフィナーレ、でした！"
