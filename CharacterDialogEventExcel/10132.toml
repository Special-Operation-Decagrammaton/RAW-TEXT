10132-853-200-1 = "Th-This outfit is um... "
10132-853-210-1 = "Wh-What is this...? What is happening right now...?"
10132-853-220-1 = "It's strange up on the stage."
10132-853-230-1 = "I'm sure I'm getting more attention than ever..."
10132-853-240-1 = "But it's surprisingly lonely..."
10132-853-250-1 = "Everyone...! I'm back...!"
10132-853-260-1 = "Am I really a person befitting of this outfit...?"
