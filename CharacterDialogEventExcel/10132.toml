[translation]
10132-853-180-1 = "老師……！？\n這套禮服……\n果然，很奇怪吧……？"
10132-853-190-1 = "歡迎回來，老師……"
10132-853-200-1 = "呃，這副打扮是，\n那個……"
10132-853-210-1 = "究竟……發生了\n什麼事呢……？"
10132-853-220-1 = "舞台上面……\n真是不可思議。"
10132-853-230-1 = "明明被許多人看著……"
10132-853-240-1 = "卻有著，令人感到\n孤單的瞬間……"
10132-853-250-1 = "大家……！\n我，回來了……！"
10132-853-260-1 = "我……真的配得上\n這套衣服嗎……？"
10132-853-270-1 = "果然，很顯眼，\n對吧……？"
10132-853-280-1 = "嗚嗚……\n我，明明是忍者……"
10132-853-290-1 = "漂，漂，漂漂漂亮，\n是嗎……！？"
10132-853-300-1 = "呀嗚嗚嗚……"
10132-853-310-1 = "這套衣服，"
10132-853-320-1 = "只要想成，\n是變裝之術的話……"
10132-853-590-1 = "我把該做的事，\n整理了一下……"
10132-853-600-1 = "雖然每樣都不簡單……"
10132-853-610-1 = "不過是老師的話，\n一定……！"
10132-853-620-1 = "那個……我整理的東西……\n有什麼問題嗎……？ "
10132-853-630-1 = "老師……？\n請問，怎麼了嗎……？"
10132-853-640-1 = "不，不愧是您……！"
10132-853-650-1 = "我始終相信，\n老師能辦到的……！"
10132-853-660-1 = "真厲害……！莫非老師，\n也有忍者的才能……！？"
10132-853-670-1 = "辛苦了……！\n是個精彩的結尾！"
