[translation]
10132-853-180-1 = "คะ... คุณครู...?!\nชะ... ชุดนี้ มันดูแปลกๆ ใช่มั้ยคะ...?"
10132-853-190-1 = "มะ... มาแล้วเหรอคะ\nคุณครู...?"
10132-853-200-1 = "คะ... คือว่าชุดนี้... "
10132-853-210-1 = "อะ... อะไรกันคะเนี่ย...?\nนี่มันเกิดเรื่องอะไรขึ้น\nกันแน่คะ...?"
10132-853-220-1 = "ตอนอยู่บนเวที...\nมันแปลกๆ นะคะ"
10132-853-230-1 = "ทั้งที่ได้รับความสนใจ\nมากกว่าครั้งไหนแท้ๆ"
10132-853-240-1 = "แต่มันรู้สึกโดดเดี่ยว\nจนใจหายเลยค่ะ..."
10132-853-250-1 = "ทุกคน...!\nฉัน... กลับมาแล้วค่ะ...!"
10132-853-260-1 = "ตัวฉันน่ะ เหมาะกับชุดนี้\nจริงๆ เหรอคะ...?"
10132-853-270-1 = "มะ... มันดูเด่นเกินไปสินะคะ\nคุณครู...?"
10132-853-280-1 = "ฮือออ\nนินจาไม่ควรทำอะไร\nแบบนี้เลย..."
10132-853-290-1 = "สะ... สะ... สะ\nสวยงั้นเหรอคะ...?!"
10132-853-300-1 = "ฮึกกก..."
10132-853-310-1 = "ถะ... ถ้าคิดว่า"
10132-853-320-1 = "ชุดนี้เป็นส่วนหนึ่ง\nของวิชาแปลงกาย\nก็อาจจะไม่เป็นไร..."
10132-853-590-1 = "ฉะ... ฉันลองรวบรวม\nภารกิจที่ที่ต้องทำมาแล้วค่ะ"
10132-853-600-1 = "ไม่ใช่ภารกิจง่ายๆ เลย..."
10132-853-610-1 = "แต่คุณครูทำได้แน่นอนค่ะ!"
10132-853-620-1 = "ระ... รายการที่ฉันสรุปมา\nมีปัญหาตรงไหนรึเปล่าคะ...? "
10132-853-630-1 = "คะ? ระ... เรื่องแบบนี้\nไม่ได้มีอยู่ในภารกิจนี่คะ..."
10132-853-640-1 = "คะ... คิดแล้วเชียว...!"
10132-853-650-1 = "ว่าคุณครูจะต้อง\nทำสำเร็จจนได้!"
10132-853-660-1 = "สุดยอดเลยค่ะ! คิดแล้วเชียวว่าคุณครู\nมีพรสวรรค์ด้านนินจาจริงๆ ด้วย...! "
10132-853-670-1 = "ทะ... ทำได้ดีมากเลยค่ะ...!\nเป็นฟินาเล่ที่งดงามมาเลยค่ะ!"
