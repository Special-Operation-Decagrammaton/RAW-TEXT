10132-853-280-1 = "Ugh, a ninja shouldn't be like this..."
10132-853-290-1 = "I-I-I-I'm pretty...?!"
10132-853-300-1 = "Huuu..."
10132-853-310-1 = "I-If I think of..."
10132-853-320-1 = "...this outfit as a form of disguise... That might work..."
10132-853-590-1 = "I-I organized the missions we need to complete..."
