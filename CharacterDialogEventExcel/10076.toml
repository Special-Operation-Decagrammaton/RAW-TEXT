[translation]
10076-817-630-1 = "응원과 설명이라면\n맡겨주세요!"
10076-817-640-1 = "플레-이 플레-이! 선생님!\n힘내라 힘내라! 선생님!"
10076-817-650-1 = "어때요? 힘이 나셨나요?"
10076-817-660-1 = "달아오르는 느낌이네요!\n파이팅입니다!"
10076-817-670-1 = "거의 다 왔습니다!\n마지막까지 응원할게요!"
10076-817-680-1 = "후아-! 힘들었네요!"
10076-817-690-1 = "하지만 개운합니다!"
10076-817-700-1 = "음? 무슨 일이신가요?"
10076-817-710-1 = "뭔가 궁금한 거라도\n있으신가요?"
10076-817-720-1 = "그렇다면, 제가…!"
10076-817-730-1 = "그, 그렇게 자꾸 찌르시면…"
10076-817-740-1 = "조금 부끄러운데요…."
10076-817-750-1 = "히익!? 아. 서,\n선생님이셨군요…?"
