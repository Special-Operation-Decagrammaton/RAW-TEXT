[translation]
10076-817-630-1 = "ถ้าเรื่องการเชียร์\nและการอธิบายละก็\nไว้ใจฉันได้เลยค่ะ!"
10076-817-640-1 = "ฮูเร่~ ฮูเร่! คุณครู!\nพยายามเข้า... สู้เค้านะ\nคุณครู!"
10076-817-650-1 = "เป็นไงคะ? มีแรงฮึดขึ้นบ้างมั้ยคะ?"
10076-817-660-1 = "รู้สึกถึงไฟที่ลุกโชนในตัวเลยค่ะ!\nสู้ๆ นะคะ!"
10076-817-670-1 = "ใกล้แล้วค่ะ!\nฉันจะเชียร์จนถึงที่สุดเลยค่ะ!"
10076-817-680-1 = "ฮู่ว! เหนื่อยจังเลยค่ะ!"
10076-817-690-1 = "แต่ว่าก็สดชื่นสุดๆ ไปเลยค่ะ!"
10076-817-700-1 = "หืม? มีอะไรเหรอคะ?"
10076-817-710-1 = "สงสัยเรื่องอะไรอยู่\nหรือเปล่าคะ?"
10076-817-720-1 = "ถ้าอย่างนั้น ฉันก็จะ...!"
10076-817-730-1 = "ถะ...ถะ...ถ้าคุณครู\nมาแตะกันแบบนั้น..."
10076-817-740-1 = "มันน่าเขินอยู่นิดหน่อยนะคะ..."
10076-817-750-1 = "เฮือก!? ฮู่ว...\nคะ... คุณครูเองเหรอคะ?"
10076-10817-630-1 = "ถ้าเป็นเรื่องการเชียร์\nกับการอธิบายละก็\nไว้ใจฉันได้เลยค่ะ!"
