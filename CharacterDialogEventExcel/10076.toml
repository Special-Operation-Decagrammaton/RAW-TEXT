[translation]
10076-817-630-1 = "応援と説明なら\nお任せください！"
10076-817-640-1 = "フレーフレー！\nせーんせい！\n頑張れ頑張れ！\nせんせい！"
10076-817-650-1 = "どうですか？\n元気出ましたか？"
10076-817-660-1 = "盛り上がってますね！\n頑張ってください！"
10076-817-670-1 = "あと少しです！\n最後まで応援しています！"
10076-817-680-1 = "ふぅー…\n大変でしたね！"
10076-817-690-1 = "でも、やりきった\n気持ちです！"
10076-817-700-1 = "あれ、どうか\nされましたか？"
10076-817-710-1 = "何か気になることでも\nありましたか？"
10076-817-720-1 = "それなら、この私が…！"
10076-817-730-1 = "そ、そんなに何度も\nつつかれると…"
10076-817-740-1 = "ちょっと恥ずかしい\nですね…。"
10076-817-750-1 = "ひぃっ！？あっ、せ、\n先生でしたか…！"
