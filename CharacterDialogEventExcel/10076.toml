[translation]
10076-817-630-1 = "如果需要應援和說明，\n請交給我吧！"
10076-817-640-1 = "加油加油！\n幫老師上油！\n再接再厲！\n為老師勉勵！"
10076-817-650-1 = "如何？\n有精神了嗎？"
10076-817-660-1 = "熱血沸騰呢！\n請加油！"
10076-817-670-1 = "還差一點！\n我會支持你到最後的！"
10076-817-680-1 = "呼…\n真是累人呢！"
10076-817-690-1 = "可是，\n做完後心情暢快！"
10076-817-700-1 = "咦，怎麼了嗎？"
10076-817-710-1 = "有什麼在意的地方嗎？"
10076-817-720-1 = "既然如此，就由我來…！"
10076-817-730-1 = "像，像這樣\n一直戳我的話…"
10076-817-740-1 = "有點不好意思呢…"
10076-817-750-1 = "咿！？\n啊，是老師啊…！"
