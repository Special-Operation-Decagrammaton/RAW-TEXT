[translation]
10076-817-630-1 = "Leave the cheering—and explaining—to me!"
10076-817-640-1 = "Play, play, run and play! You can do it, go Sensei!"
10076-817-650-1 = "How was that? Did it give you a burst of energy?"
10076-817-660-1 = "Things are heating up! You can do this!"
10076-817-670-1 = "Almost there! I'll cheer you on until the very end!"
10076-817-680-1 = "Ugh! I'm exhausted."
10076-817-690-1 = "But I also feel...refreshed!"
10076-817-700-1 = "Oh? What is it?"
10076-817-710-1 = "Do you have a question for me?"
10076-817-720-1 = "Then, I...!"
10076-817-730-1 = "I-If you keep poking me like that..."
10076-817-740-1 = "This is a bit embarrassing..."
10076-817-750-1 = "Eek! W-Was that you, Sensei...?"
