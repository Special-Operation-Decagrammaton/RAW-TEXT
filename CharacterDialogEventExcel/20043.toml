[translation]
20043-820-1170-1 = "さあ先生！\n新年だよ～！"
20043-820-1180-1 = "美食を求める\n冒険をはじめよっか！"
20043-820-1190-1 = "食べたいものとかある？"
20043-820-1200-1 = "私はね、\nあれもこれも、\nぜーんぶ食べたい！"
20043-820-1210-1 = "美味しそう～に\n食べる先生を\n見ているだけで、"
20043-820-1220-1 = "すっごく幸せな\n気持ちになるんだ！"
20043-820-1230-1 = "先生と一緒にいると、\n発見がいっぱい！"
20043-820-1240-1 = "新しい味に\n出会ったときみたいに、\nドキドキする！"
20043-820-1250-1 = "冒険は仲間と\n行くものなんだって！"
20043-820-1260-1 = "美食の冒険に\n出るときは、\n先生も一緒に行こ～！"
20043-820-1270-1 = "私も美食研究会の\n一員だもん！"
20043-820-1280-1 = "新しい味を探す\n冒険はやめないよ！"
20043-820-1290-1 = "それが私の、美食道！"
