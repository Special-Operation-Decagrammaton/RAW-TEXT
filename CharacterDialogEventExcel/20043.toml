[translation]
20043-820-1170-1 = "자 선생님! 새해야~!"
20043-820-1180-1 = "미식 모험을\n시작해 볼까!"
20043-820-1190-1 = "뭔가 먹고 싶은 거 있어,\n선생님?"
20043-820-1200-1 = "나는 아주 많아!"
20043-820-1210-1 = "나는 말이야.\n선생님이 맛있게\n먹고 있는 걸 그냥\n바라만 보고 있어도,"
20043-820-1220-1 = "충분히 행복해!"
20043-820-1230-1 = "선생님과 있는 시간은\n모든 게 새로워."
20043-820-1240-1 = "새로운 맛을\n찾았을 때처럼, 말이지."
20043-820-1250-1 = "어딘가에서 들었는데,\n모험은 같이\n떠나는 게 좋대."
20043-820-1260-1 = "그러니까 미식 모험을\n떠날 때에는,\n선생님도 함께야!"
20043-820-1270-1 = "나도 미식연구회의\n일원이라구!"
20043-820-1280-1 = "새로운 맛을 찾는\n모험은 멈추지 않아!"
20043-820-1290-1 = "그것이 나의 미식도!"
