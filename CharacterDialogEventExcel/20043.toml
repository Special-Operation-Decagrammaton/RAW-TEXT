[translation]
20043-820-1170-1 = "เอ้า คุณครู! ปีใหม่แล้วนะ~!"
20043-820-1180-1 = "มาออกผจญภัย\nค้นหาอาหารเลิศรสกันมั้ย!"
20043-820-1190-1 = "มีอะไรที่อยากกินรึเปล่า\nคุณครู?"
20043-820-1200-1 = "ฉันมีของที่อยากกินเยอะแยะเลย!"
20043-820-1210-1 = "ฉันน่ะ แค่เห็นคุณครู\nกินของที่อยากกิน\nอย่างเอร็ดอร่อย"
20043-820-1220-1 = "ก็มีความสุขแล้วละ!"
20043-820-1230-1 = "ช่วงเวลาที่ได้อยู่กับคุณครู\nก็รู้สึกแปลกใหม่ทั้งหมดเลย"
20043-820-1240-1 = "ตอนที่ค้นหา\nรสชาติแปลกใหม่น่ะ"
20043-820-1250-1 = "ฉันเคยได้ยินมาจากที่ไหนสักแห่ง\nว่าการออกไปผจญภัย\nด้วยกันเป็นสิ่งที่ดีน่ะ"
20043-820-1260-1 = "เพราะงั้นตอนออกผจญภัย\nค้นหาอาหารเลิศรส\nคุณครูก็ต้องไปด้วยกันนะ!"
20043-820-1270-1 = "ฉันเองก็เป็นสมาชิก\nชมรมชิมอาหารเหมือนกันนะ!"
20043-820-1280-1 = "การผจญภัยค้นหารสชาติใหม่ๆ\nจะไม่หยุดอยู่แค่นี้หรอก!"
20043-820-1290-1 = "นั่นละคือเส้นทาง\nอาหารเลิศรสของฉัน!"
