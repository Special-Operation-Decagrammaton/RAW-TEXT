[translation]
20043-820-1170-1 = "來吧，老師！\n新年到囉～！"
20043-820-1180-1 = "開始追尋\n美食的冒險吧！"
20043-820-1190-1 = "有什麼想吃的嗎？"
20043-820-1200-1 = "我的話呢，\n這些跟那些\n全～都想吃！"
20043-820-1210-1 = "光是看著老師吃得\n津～津有味的樣子，"
20043-820-1220-1 = "就會有種非常\n幸福的感覺！"
20043-820-1230-1 = "跟老師待在一起，\n就會有很多發現！"
20043-820-1240-1 = "就像遇見新滋味\n的時候一樣，\n讓人心動動！"
20043-820-1250-1 = "聽說有句話叫\n「冒險要與夥伴同行」！"
20043-820-1260-1 = "展開美食冒險的時候，\n老師也一起去吧～！"
20043-820-1270-1 = "我也是美食研究會\n的一員嘛！"
20043-820-1280-1 = "尋找新滋味的\n冒險將永無止境！"
20043-820-1290-1 = "這就是我的美食之道！"
