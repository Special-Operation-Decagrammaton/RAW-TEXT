[translation]
20004-803-80-1 = "วันนี้ร้อนมากๆ เลยนะ\nระวังเป็นลมแดดด้วยนะคะ"
20004-803-90-1 = "เอาละ เรามาเริ่ม\nการฝึกพิเศษภาคฤดูร้อนกันเถอะ!"
20004-803-100-1 = "ฉันเพิ่งเคยมาทะเล กับเพื่อนๆ\nนักเรียนโรงเรียนทรีนิตี้คนอื่น...\nเลยรู้สึกตื่นเต้นนิดหน่อยค่ะ"
20004-803-110-1 = "ผู้รู้ย่อมชอบน้ำ...\nคนที่เป็นอัจฉริยะ\nยังไงก็ต้องชอบน้ำอยู่แล้วล่ะ"
20004-803-120-1 = "(ชุดว่ายน้ำ...\nถ้าเป็นสีอื่นที่ไม่ใช่สีดำ\nจะดีหรือเปล่านะ…)"
20004-803-130-1 = "เมื่อกี้เหมือนได้ยินเสียงกรีดร้อง\nของรุ่นพี่ซึรุกิ จากที่ไหนสักแห่ง..."
20004-803-420-1 = "ทั้งภารกิจและการพักผ่อน\nฉันจะไม่พลาดทั้งสองอย่างค่ะ"
20004-803-430-1 = "คงไม่มีนักเรียนมาก่อความวุ่นวาย\nที่นี่หรอกใช่ไหมคะ?"
20004-803-440-1 = "ถึงจะอยู่ที่สถานที่พักผ่อน\nก็ห้ามละเลยเด็ดขาดค่ะ"
20004-10803-80-1 = "วันนี้ร้อนมากๆ เลยนะ\nระวังเป็นลมแดดด้วยนะคะ"
20004-10803-90-1 = "เอาละ เรามาเริ่ม\nการฝึกพิเศษภาคฤดูร้อนกันเถอะ!"
