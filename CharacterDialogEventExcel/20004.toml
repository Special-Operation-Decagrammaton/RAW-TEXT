[translation]
20004-803-80-1 = "今日も蒸し暑いですね…。\n熱中症には十分\n気をつけてください。"
20004-803-90-1 = "さあ、夏季特別訓練を\n始めましょう！"
20004-803-100-1 = "トリニティの他の\n方たちと海に来るなんて\n初めてで…少し、\n緊張してしまいますね。"
20004-803-110-1 = "知者楽水…\n知恵ある者は水を楽しむ、\nと言います。"
20004-803-120-1 = "（水着くらい、\n黒じゃなくても\n良かったかな…）"
20004-803-130-1 = "今、どこからか\nツルギ先輩の\n叫び声が…"
20004-803-420-1 = "任務も休息も、\nしっかりとやります。"
20004-803-430-1 = "まさか、こんなところで\n問題を起こそうとする\n問題児はいませんよね？"
20004-803-440-1 = "リゾート地でも、\n油断は禁物です。"
