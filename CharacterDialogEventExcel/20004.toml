[translation]
20004-803-80-1 = "今天也相當熱耶。\n請注意別中暑。"
20004-803-90-1 = "好，夏季特殊訓練\n開始吧！"
20004-803-100-1 = "和三一的其他學生\n來海邊是第一次…\n有點緊張耶。"
20004-803-110-1 = "智者樂水…\n就說有智慧的人\n通常都很喜歡水。"
20004-803-120-1 = "(夏季的泳裝\n就算不是黑色\n也不錯嗎…)"
20004-803-130-1 = "此刻，某處傳來弦生前輩的\n吶喊聲…"
20004-803-420-1 = "任務跟休息\n我都不會錯過的。"
20004-803-430-1 = "在這種地方，\n應該不會有想要引起動亂的問題學生了吧？"
20004-803-440-1 = "在度假勝地\n也不能掉以輕心。"
20004-10803-80-1 = "今天也超級熱的，\n請小心中暑。"
20004-10803-90-1 = "那麼！夏季特別訓練！\n要開始囉！"
20004-10803-100-1 = "這是我第一次\n與三一其他的學生一起來海邊…\n有點緊張呢。"
20004-10803-110-1 = "智者樂水…\n說是有智慧的人\n就會喜歡水。"
20004-10803-120-1 = "(夏日泳裝\n即使不是黑色\n也會喜歡嗎…)"
20004-10803-130-1 = "現在，從某處傳來了\n弦生前輩的呼喊聲…"
20004-10803-420-1 = "任務跟休息\n我都不會錯過的。"
20004-10803-430-1 = "在這種地方，\n應該不會有想要引起動亂的問題學生了吧？"
20004-10803-440-1 = "在度假勝地\n也不能掉以輕心。"
20004-900803-80-1 = "今天也非常熱呢…\n請務必小心中暑。"
20004-900803-90-1 = "來，開始夏季特別訓練吧！"
20004-900803-100-1 = "我還是第一次\n跟其他三一的學生\n一起來海邊…\n有點緊張呢。"
20004-900803-110-1 = "智者樂水…\n就是有智慧的人\n會喜歡水的意思。"
20004-900803-120-1 = "（只有泳裝的話，\n　就算不是黑色\n　也沒關係吧…）"
20004-900803-130-1 = "剛才，好像\n從哪裡傳來了\n弦生前輩的叫聲…"
