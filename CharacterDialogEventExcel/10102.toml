[translation]
10102-838-340-1 = "えへへ、あちこち、\n楽しそうな人が\nたくさんいますね…。"
10102-838-350-1 = "海…お祭り…"
10102-838-360-1 = "もしかしたら今が\n私の人生の最高潮かも\nしれません…"
10102-838-370-1 = "いろんな意味で初めて\n経験することばかりです…"
10102-838-380-1 = "海のお祭りって\n元々こういう\nものなんですか…？"
10102-838-390-1 = "さ、最後まで\n楽しんでおかないと、"
10102-838-400-1 = "もったいなくて\n眠れないかも\nしれませんよ…！"
10102-838-410-1 = "終わりました…\n終わってしまいましたね…"
10102-838-420-1 = "もう私の人生にこんな日は\nこないでしょうね…。"
10102-838-430-1 = "え？また海に連れてきて\nくださるんですか？"
10102-838-440-1 = "えへへ、\nありがとうございます。"
10102-838-450-1 = "じゃあ次は\nリゾートホテルとかに…。"
10102-838-460-1 = "ひえっ？な、\n何か任せる仕事でも？"
10102-838-470-1 = "ただ呼んだだけ…？\nなんで…？"
10102-838-480-1 = "あ、アツコちゃんや\nミサキさんは水着が\nよく似合ってますね…。"
10102-838-490-1 = "え？私も似合ってる？\nありがとうございます……"
10102-838-500-1 = "海辺に流れ着いた\n海藻を拾いましたけど…。"
10102-838-510-1 = "これって\n食べられないですよね…？"
10102-838-520-1 = "海もお祭りも\n楽しいですが…。"
10102-838-530-1 = "やっぱりその分、\n日常に戻ったときに\n苦しいですよね…"
10102-838-540-1 = "えへへ、ここはいろいろ\n売ってますね。"
10102-838-550-1 = "買っていただけるなら\n断りはしません、えヘヘ。"
10102-838-560-1 = "良さそうなものがいっぱい…"
10102-838-570-1 = "ショップが\n終わってしまいましたね。"
10102-838-580-1 = "私は買えませんでしたが、\n見ているのは楽しかったです…。"
10102-838-590-1 = "わ、私は何がいいものなのか\nよくわからないので…"
10102-838-600-1 = "先生が選んだほうがいいと\n思いますけど…。"
10102-838-610-1 = "ひ、ひええっ！？"
10102-838-620-1 = "そ、そんなものも\nあったんですね…！"
10102-838-630-1 = "高いものをそんな簡単に…\n大人ってすごいですね…"
10102-838-640-1 = "もしかして私への\nプレゼントですか……？"
10102-838-650-1 = "もしそうでしたら、\nありがとうございます。えヘヘ…"
10102-838-660-1 = "あ、それ、私も目を\nつけていたものです。えへへ。"
