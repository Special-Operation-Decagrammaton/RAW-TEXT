[translation]
10102-838-340-1 = "Heehee. It's full of cheerful-looking people..."
10102-838-350-1 = "The sea... The festival..."
10102-838-360-1 = "This might be the peak of my life..."
10102-838-370-1 = "They're all new experiences for me..."
10102-838-380-1 = "Are beach festivals always like this...?"
10102-838-390-1 = "I-If I don't enjoy it until the end,"
10102-838-400-1 = "I might not be able to sleep...!"
10102-838-410-1 = "It's over... It's finished..."
10102-838-420-1 = "I'll never have a day like this again, will I?"
10102-838-430-1 = "What? You'll bring me to the ocean again?"
10102-838-440-1 = "Heehee. Thank you."
10102-838-450-1 = "How about we go to a resort next time...?"
10102-838-460-1 = "Eek! D-Do you need me to do something?"
10102-838-470-1 = "You called me for no reason? How come...?"
10102-838-480-1 = "A-A-Atsuko and Misaki look good in their swimsuits..."
10102-838-490-1 = "What? Me too? Thank you..."
10102-838-500-1 = "I picked up some seaweed that washed up on the beach..."
10102-838-510-1 = "We can't eat this, can we...?"
10102-838-520-1 = "I'm happy with the sea and the festival..."
10102-838-530-1 = "But I'll be so sad when I go back to my everyday life..."
10102-838-540-1 = "Heehee. They're selling all sorts of things."
10102-838-550-1 = "I won't refuse if you get me one, though. Heeheehee."
10102-838-560-1 = "So many pretty things..."
10102-838-570-1 = "The shop is closed."
10102-838-580-1 = "I didn't get to buy anything, but it was fun looking around."
10102-838-590-1 = "I-I don't know which ones are good..."
10102-838-600-1 = "So I think you should choose..."
10102-838-610-1 = "E-Eek!!"
10102-838-620-1 = "Th-They even sell things like that...!"
10102-838-630-1 = "You can buy such expensive things like it's nothing... Adults are amazing..."
10102-838-640-1 = "Could it be a present for me...?"
10102-838-650-1 = "If so, thank you. Heehee..."
10102-838-660-1 = "Oh, that one. I had my eye on that. Heehee."
