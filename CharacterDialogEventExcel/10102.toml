[translation]
10102-838-340-1 = "แหะๆ ไม่ว่าที่ไหน\nก็มีคนที่ท่าทางสนุกๆ\nเต็มไปหมดเลยนะคะ"
10102-838-350-1 = "ทะเล... งานเทศกาล..."
10102-838-360-1 = "บางทีตอนนี้อาจจะเป็น\nจุดที่ดีที่สุดในชีวิตของฉันก็ได้..."
10102-838-370-1 = "มีแต่เรื่องที่ฉันเพิ่งได้เจอ\nเป็นครั้งแรกเลยนะคะ..."
10102-838-380-1 = "งานเทศกาลที่ทะเล\nปกติเป็นแบบนี้เหรอคะ...?"
10102-838-390-1 = "ถะ... ถ้าฉันไม่สนุกกับงาน\nไปจนถึงจบงานละก็"
10102-838-400-1 = "ฉันอาจจะเสียดาย\nจนนอนไม่หลับก็ได้นะคะ...!"
10102-838-410-1 = "จบแล้วสินะคะ...\nมันจบแล้วค่ะ..."
10102-838-420-1 = "จากนี้ชีวิตของฉันคง\nไม่มีวันแบบนี้อีกแล้วสินะคะ"
10102-838-430-1 = "คะ? จะพาฉันมา\nทะเลอีกเหรอคะ?"
10102-838-440-1 = "แหะๆ ขอบคุณค่ะ"
10102-838-450-1 = "งั้นเอาไว้คราวหน้าค่อยไป\nรีสอร์ตติดทะเล..."
10102-838-460-1 = "เฮือก? มะ... มีงานอะไร\nจะสั่งฉันเหรอคะ?"
10102-838-470-1 = "แค่ลองเรียกดูเหรอคะ?\nทำไมล่ะ...?"
10102-838-480-1 = "อะ... อาสึโกะจัง\nกับคุณมิซากิ\nเหมาะกับชุดว่ายน้ำจังค่ะ..."
10102-838-490-1 = "คะ? ฉันก็ด้วยเหรอคะ?\nขอบคุณค่ะ..."
10102-838-500-1 = "ฉันเก็บสาหร่ายที่โดนซัด\nขึ้นมาบนชายหาดมาน่ะค่ะ..."
10102-838-510-1 = "คงกินไม่ได้ใช่มั้ยคะ...?"
10102-838-520-1 = "งานเทศกาลที่ทะเล\nก็สนุกดีอยู่หรอกค่ะ..."
10102-838-530-1 = "แต่ยิ่งเป็นแบบนี้ ตอนกลับไป\nใช้ชีวิตแบบเดิม คงเสียใจใช่มั้ยคะ..."
10102-838-540-1 = "แหะๆ ตรงนี้มีของขาย\nหลายอย่างเลยนะคะ"
10102-838-550-1 = "ถ้าซื้อให้ ฉันจะไม่\nปฏิเสธหรอกค่ะ แหะๆๆ..."
10102-838-560-1 = "มีของดีๆ เพียบเลย..."
10102-838-570-1 = "ร้านปิดแล้วสินะคะ"
10102-838-580-1 = "ถึงฉันจะไม่ได้ซื้อ แต่แค่ได้ดู\nก็สนุกแล้วค่ะ..."
10102-838-590-1 = "ฉะ... ฉันไม่รู้ว่า\nชิ้นไหนดีน่ะค่ะ..."
10102-838-600-1 = "คุณครูเลือกเอง\nน่าจะดีกว่านะคะ..."
10102-838-610-1 = "ฮะ... เฮือก?!"
10102-838-620-1 = "มะ... มีของแบบนั้น\nด้วยเหรอคะเนี่ย...!"
10102-838-630-1 = "ซื้อของแพงๆ ได้ง่ายแบบนั้นเลย...\nผู้ใหญ่เนี่ย สุดยอดไปเลยนะคะ..."
10102-838-640-1 = "หรือว่านั่นจะเป็นของขวัญ\nให้ฉันหรือเปล่าคะ...?"
10102-838-650-1 = "ถ้าใช่ก็ขอบคุณค่ะ\nแหะๆๆ..."
10102-838-660-1 = "อ๊ะ นั่นก็เป็นของที่\nฉันเล็งไว้เหมือนกันค่ะ แหะๆ"
10102-10838-340-1 = "แหะๆ ไม่ว่าที่ไหน\nก็มีคนที่ดูสนุกสนาน\nเต็มไปหมดเลยนะคะ"
