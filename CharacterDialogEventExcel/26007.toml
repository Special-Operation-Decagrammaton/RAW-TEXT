[translation]
26007-814-260-1 = "お疲れ様です、先生。\n準備ならお任せください！"
26007-814-270-1 = "お待ちしておりました、\n先生！一緒に\n頑張りましょう！"
26007-814-280-1 = "さあ、張り切って\n行きましょうか！"
26007-814-290-1 = "もう少しで\n何とかなりそうですね。\n頑張りましょう、先生！"
26007-814-300-1 = "後片付けも\n大事ですよね、\nお手伝いします！"
26007-814-310-1 = "…えっと、先生？\nどうかされましたか？"
26007-814-320-1 = "ど、どうしましたか？\nどこかに虫とか\n付いてます…？"
26007-814-330-1 = "えっと…先生、\n呼びましたか？"
26007-814-340-1 = "す、すみません、\nあまり見られると\n恥ずかしいです…"
26007-814-440-1 = "目標のリストを\n整理しておきました。"
26007-814-450-1 = "こちらが現在の目標です。"
26007-814-460-1 = "目標が一つずつ\n達成されていくのって、\n気持ち良いですよね。"
26007-814-470-1 = "こうやって一緒にリストを\n整理してるだけで、\n何だか楽しいです。"
26007-814-480-1 = "はい、お疲れ様でした！"
26007-814-490-1 = "さすがは先生ですね！"
