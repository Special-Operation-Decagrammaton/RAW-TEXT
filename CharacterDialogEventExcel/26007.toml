[translation]
26007-814-260-1 = "เชิญค่ะ คุณครู\nไว้ใจเรื่องการเตรียมการได้เลยค่ะ!"
26007-814-270-1 = "ฉันกำลังรออยู่เลยค่ะ คุณครู!\nมาพยายามด้วยกันเถอะค่ะ!"
26007-814-280-1 = "มาพยายามด้วยกันเถอะค่ะ!"
26007-814-290-1 = "ถ้าพยายามมากขึ้นละก็\nคงทำได้สำเร็จแน่ค่ะ\nพยายามเข้านะคะ คุณครู!"
26007-814-300-1 = "การเก็บกวาดก็เป็นเรื่องสำคัญนะคะ\nฉันจะช่วยเองค่ะ!"
26007-814-310-1 = "เอ๋? คุณครู...?\nทะ...ทำไมทำแบบนั้นล่ะคะ...?"
26007-814-320-1 = "มะ...มีอะไรเหรอคะ?\nมีแมลง...\nเกาะอยู่ที่ไหนเหรอคะ?"
26007-814-330-1 = "อืม... คุณครู\nเรียกฉันเหรอคะ?"
26007-814-340-1 = "ขะ...ขอโทษค่ะ\nถ้าคุณครูจ้องกันแบบนั้น\nฉันเขินนะคะ..."
26007-814-440-1 = "ฉันจัดการ\nรายการที่ต้องการไว้แล้วค่ะ!"
26007-814-450-1 = "รายการข้างต้น\nคือรายการเป้าหมายค่ะ"
26007-814-460-1 = "การทำเป้าหมายสำเร็จไปทีละ\nรายการ ก็เพลินดีอยู่นะคะ"
26007-814-470-1 = "และการได้เขียนรายการแบบนี้\nก็น่าสนุกเหมือนกันค่ะ "
26007-814-480-1 = "ค่ะ ทำได้ดีมากค่ะ!"
26007-814-490-1 = "สมกับเป็นคุณครูเลยค่ะ!"
26007-10814-350-1 = "ฉันจัดการ\nรายการที่ต้องการไว้แล้วค่ะ!"
