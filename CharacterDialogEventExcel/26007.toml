[translation]
26007-814-260-1 = "어서 오세요, 선생님.\n준비라면 맡겨주세요!"
26007-814-270-1 = "기다리고 있었습니다,\n선생님!\n함께 힘내봐요!"
26007-814-280-1 = "자, 힘 내서 가보죠!"
26007-814-290-1 = "조금만 더 하면\n어떻게든 될 것 같네요.\n힘내죠, 선생님!"
26007-814-300-1 = "뒷정리도 중요하죠.\n제가 도울게요!"
26007-814-310-1 = "……어라, 선생님?\n왜 그러시나요?"
26007-814-320-1 = "왜, 왜 그러세요?\n어디 벌레라도\n붙어 있나요…?"
26007-814-330-1 = "음…. 선생님,\n부르셨나요?"
26007-814-340-1 = "죄, 죄송해요.\n그치만 그렇게\n보시면 부끄러워요…."
26007-814-440-1 = "목표 리스트를\n정리해 봤어요!"
26007-814-450-1 = "이상이 이번의\n목표 리스트입니다."
26007-814-460-1 = "목표를 하나씩 달성해 나가는 건,\n즐거운 일이잖아요."
26007-814-470-1 = "그저 이렇게 같이 리스트 정리를\n하는 것만으로도…. 뭔가 즐겁네요."
26007-814-480-1 = "네, 수고하셨습니다!"
26007-814-490-1 = "역시 선생님이세요!"
