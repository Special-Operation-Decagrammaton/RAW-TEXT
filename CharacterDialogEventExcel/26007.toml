[translation]
26007-814-260-1 = "辛苦了，老師。\n準備的話請交給我吧！"
26007-814-270-1 = "我等你很久了，\n老師！\n一起加油吧！"
26007-814-280-1 = "好，充滿幹勁的\n努力吧！"
26007-814-290-1 = "還差一點\n就有辦法解決了呢。\n加油吧，老師！"
26007-814-300-1 = "善後處理\n也很重要呢，\n我來幫忙！"
26007-814-310-1 = "那個……老師？\n怎麼了嗎？"
26007-814-320-1 = "怎，怎麼了嗎？\n有哪裡\n沾上蟲子了嗎……？"
26007-814-330-1 = "那個……老師，\n你叫我了嗎？"
26007-814-340-1 = "不，不好意思，\n一直被盯著看的話\n我會害羞……"
26007-814-440-1 = "我整理好了\n目標清單。"
26007-814-450-1 = "這邊就是\n現在的目標。"
26007-814-460-1 = "目標一個個的達成，\n很舒服呢。"
26007-814-470-1 = "光是這樣一起\n整理清單，\n就感覺很開心。"
26007-814-480-1 = "好的，辛苦老師了！"
26007-814-490-1 = "真不愧是老師呢！"
26007-10814-350-1 = "我整理了目標的清單。"
