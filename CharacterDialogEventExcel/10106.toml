[translation]
10106-841-150-1 = "อ่า~ อ่า~ อ่า อ่า~"
10106-841-160-1 = "อ๊ะ... คะ... คุณครู!?"
10106-841-170-1 = "ขอบคุณที่มานะคะ\nคุณครู"
10106-841-180-1 = "ซะ... ซากุระโกะ ดีใจมากเลยค่ะ"
10106-841-190-1 = "ผ่านมาครึ่งทางแล้วสินะคะ\nอืม..."
10106-841-200-1 = "มีคำกล่าวที่ว่า\nเวลาแห่งความสนุกนั้น\nผ่านไปในพริบตา..."
10106-841-210-1 = "แต่ฉันรู้สึกเหมือนกับว่า\nมันผ่านไปเร็วมากจริงๆ ค่ะ"
10106-841-220-1 = "ฮุฮุ รู้สึกเสียดายอะไรงั้นเหรอคะ?"
10106-841-230-1 = "บังเอิญจังเลยนะคะ...\nฉันก็เหมือนกันค่ะ"
10106-841-240-1 = "หืม? ทำไมเหรอคะ?"
10106-841-250-1 = "จะ... จับมือ... เหรอคะ?"
10106-841-260-1 = "รู้สึกใกล้ชิดกับทุกๆ คน\nมากกว่าตอนที่\nใส่ชุดซิสเตอร์เลยค่ะ"
10106-841-270-1 = "ฮุฮุุ ชุดนี้ดีจังเลยนะคะ"
10106-841-280-1 = "เอ่อ...\nมีธุระอะไรหรือเปล่าคะ?"
10106-841-290-1 = "ถึงจะโดนเรียกหลายๆ ครั้ง\nแต่ฉันก็ไม่รู้ว่าควรจะ\nทำยังไงดีเลยคะ"
10106-841-300-1 = "มีท่าเต้นลับ\nที่กำลังฝึกอยู่ด้วยค่ะ..."
10106-841-310-1 = "ถะ... ถ้าคุณครูสะดวก\nจะลองชมสักหน่อยมั้ยคะ?"
10106-841-540-1 = "ฉันจัดรายการงาน\nของคุณครูเอาไว้แล้วค่ะ"
10106-841-550-1 = "มาแล้วเหรอคะ คุณครู"
10106-841-560-1 = "ว่าแต่ว่าคุณครู...\nตอนนี้เราอยู่กันแค่สองคนนะคะ"
10106-841-570-1 = "คะ? ปะ... เปล่านะคะ...\nฉันแค่พูดไปเฉยๆ เอง"
10106-841-580-1 = "ไม่ได้มีความหมายพิเศษ\nอะไร... เลย..."
10106-841-590-1 = "ชุดนั้นเหมาะดีงั้นเหรอคะ...?\nฮุฮุ ขอบคุณค่ะ"
10106-841-600-1 = "ค่ะ ตรวจสอบเรียบร้อยค่ะ"
10106-841-610-1 = "ดีจังเลยนะคะ"
