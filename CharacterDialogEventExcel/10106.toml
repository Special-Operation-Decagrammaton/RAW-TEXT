[translation]
10106-841-150-1 = "아~ 아~ 아아~"
10106-841-160-1 = "앗… 서, 선생님!?"
10106-841-170-1 = "와주셔서 감사합니다,\n선생님."
10106-841-180-1 = "사, 사쿠라코, 기뻐요!"
10106-841-190-1 = "벌써 반이나 지났네요.\n으음……."
10106-841-200-1 = "즐거운 시간은 눈 깜짝할\n사이라고는 하지만…"
10106-841-210-1 = "너무나도 한순간에 지나가\n버린 것 같은 기분입니다."
10106-841-220-1 = "후후, 미련이 남으시나요?"
10106-841-230-1 = "우연이네요. …저도 그런데."
10106-841-240-1 = "응? 왜 그러시죠?"
10106-841-250-1 = "아, 악수……인가요?"
10106-841-260-1 = "수녀복을 입었을 때보다\n모두와 더\n가까워진 것 같아요."
10106-841-270-1 = "후훗, 이 복장도 좋군요."
10106-841-280-1 = "그…… 용무가\n있으신 걸까요?"
10106-841-290-1 = "몇 번이나 부르시면\n……그게, 뭘 하면\n좋을지 모르겠습니다."
10106-841-300-1 = "연습 중인 비장의\n안무가 있습니다만……"
10106-841-310-1 = "괜, 괜찮으시면 보시겠어요?"
10106-841-540-1 = "선생님의 업무를\n정리해 두었습니다."
10106-841-550-1 = "잘 찾아오셨습니다, 선생님."
10106-841-560-1 = "그러고 보니, 선생님…\n지금, 단둘이 있네요."
10106-841-570-1 = "네? 아, 아니…\n말 그대로의 의미고,"
10106-841-580-1 = "특별히 깊은 의미는\n없습니다…만…"
10106-841-590-1 = "그 옷, 잘 어울린다구요…?\n후후, 감사합니다."
10106-841-600-1 = "네, 확인하였습니다."
10106-841-610-1 = "아주 좋네요."
