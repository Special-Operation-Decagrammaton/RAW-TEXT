[translation]
10106-841-150-1 = "あーあーあーあー"
10106-841-160-1 = "あっ……せ、先生！？"
10106-841-170-1 = "お越し下さり\nありがとうございます、\n先生。"
10106-841-180-1 = "さ、サクラコ、\n嬉しいです！"
10106-841-190-1 = "もう半分が\n過ぎて\nしまったのですね……。"
10106-841-200-1 = "素晴らしい時間はあっと\nいう間とは申しますが…"
10106-841-210-1 = "あまりにも一瞬で\n過ぎ去ってしまったような\n心地です。"
10106-841-220-1 = "ふふっ、\n名残惜しいのですか？"
10106-841-230-1 = "…偶然ですね、\n私もです。"
10106-841-240-1 = "先生、\n何か御用でしょうか？"
10106-841-250-1 = "……あ、握手……\nでしょうか？"
10106-841-260-1 = "シスター服の時よりも、\n皆さんと親密に\nなれた気がします。"
10106-841-270-1 = "ふふっ、この服装も\n良いものですね。"
10106-841-280-1 = "その……何か御用が\nあるのでしょうか？"
10106-841-290-1 = "何度も呼ばれると…\nその、何をすれば良いのか\n分かりません。"
10106-841-300-1 = "練習中のとっておきの\n振り付けが\nあるのですが……"
10106-841-310-1 = "よ、よろしければ\nご覧になりますか？"
10106-841-540-1 = "先生の業務を\nまとめておきました。"
10106-841-550-1 = "いらっしゃったのですね、\n先生。"
10106-841-560-1 = "そういえば、先生……いま、\n二人きりですね。"
10106-841-570-1 = "え？い、いえ…言葉通りで、"
10106-841-580-1 = "特に深い意味は\nないのです…が…。"
10106-841-590-1 = "その服、よく似合ってる……？\nふふ、ありがとうございます。"
10106-841-600-1 = "はい、\nこちら確認いたしました。"
10106-841-610-1 = "はい、よくできました。"
