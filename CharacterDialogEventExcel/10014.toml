[translation]
10014-801-10-1 = "是慶典唷，主公！\n來，要從哪裡開始玩呢？"
10014-801-20-1 = "主公主公！\n慶典真令人期待呢！"
10014-801-30-1 = "伊樹菜會隨時\n在身邊服侍！"
10014-801-40-1 = "慶典越來越\n熱鬧了呢！"
10014-801-50-1 = "主公，接下來\n要去哪裡呢？"
10014-801-60-1 = "慶典，就快要\n結束了呢……"
10014-801-70-1 = "能，能請您\n陪伊樹菜直到最後嗎，\n主公……！"
10014-801-80-1 = "雖然百夜之春\n櫻花祭結束了……"
10014-801-90-1 = "不過往後還有\n很多慶典對吧？"
10014-801-100-1 = "到時候能再陪\n伊樹菜一起去嗎，主公？"
10014-801-110-1 = "哼～哼哼～哼哼～♪\n伊樹菜哐哐，\n哐～哐哐～♪"
10014-801-120-1 = "唔，這個氣息……\n是主公呢！"
10014-801-130-1 = "您是來找\n伊樹菜的對吧！\n耶嘿嘿！"
10014-801-140-1 = "糰子、仙貝、\n御好燒……！"
10014-801-150-1 = "好多想和主公\n一起吃的東西！"
10014-801-160-1 = "伊樹菜，準備萬全！\n會一邊守護主公，\n一邊導覽慶典的！忍忍！"
10014-10801-10-1 = "是慶典！主公！\n來，我們要哪裡開始玩？"
10014-10801-20-1 = "主公！主公！慶典\n真是令人期待！"
10014-10801-30-1 = "伊樹菜！\n會隨侍在主公身邊！"
10014-10801-40-1 = "慶典已經\n這麼熱鬧了耶。"
10014-10801-50-1 = "主公！\n接下來要\n逛哪裡？"
10014-10801-60-1 = "啊…慶典這麼快\n就結束了嗎……"
10014-10801-70-1 = "…儘管如此！\n還是請您要陪著伊樹菜\n一起到最後，主公！"
10014-10801-80-1 = "雖然百夜櫻祭\n結束了……"
10014-10801-90-1 = "不過往後還有\n非常多慶典，"
10014-10801-100-1 = "到時候\n請再陪伊樹菜一起參加吧！主公！"
10014-10801-110-1 = "哼~哼哼哼~哼♪\n伊樹菜伊樹菜忍忍~♪"
10014-10801-120-1 = "啊？這個氣息…\n是主公耶！"
10014-10801-130-1 = "您是來找伊樹菜的嗎？\n耶嘿嘿！"
10014-10801-140-1 = "糰子、仙貝、\n大阪燒…！"
10014-10801-150-1 = "好多都是我想和主公\n一起吃的東西！"
10014-10801-160-1 = "伊樹菜，準備完成！\n我會一邊守護主公，\n一邊帶主公參觀慶典！忍忍！"
