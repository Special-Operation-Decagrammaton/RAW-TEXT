[translation]
10014-801-10-1 = "งานเทศกาลค่ะ นายท่าน!\nเริ่มจากไปเที่ยวที่ไหนก่อนดีคะ?"
10014-801-20-1 = "นายท่าน! นายท่าน!\nงานเทศกาลดูน่าสนุกมากๆ เลยค่ะ"
10014-801-30-1 = "อิซุนะ! จะอยู่ข้างๆ\nเหมือนเป็นเงาตามตัวเลยค่ะ!"
10014-801-40-1 = "งานเทศกาล\nดูครึกครื้นมากๆ เลยค่ะ"
10014-801-50-1 = "นายท่าน! แล้วตอนนี้\nเราจะไปที่ไหนต่อดีคะ?"
10014-801-60-1 = "อา... ตอนนี้งานเทศกาล...\nก็ใกล้จะจบแล้วสินะคะ..."
10014-801-70-1 = "แต่ว่า...! ช่วยอยู่กับอิซุนะ\nจนจบงานเทศกาล\nด้วยนะคะ นายท่าน!"
10014-801-80-1 = "ถึงเทศกาลแห่งค่ำคืนสีขาว\nจะจบลงไปแล้ว..."
10014-801-90-1 = "แต่ว่าต่อจากนี้ไป ก็คงจะมี\nงานเทศกาลอื่นๆ อีกเต็มไปหมดเลยค่ะ"
10014-801-100-1 = "เอาไว้ถึงตอนนั้น ไว้ไปเที่ยว\nกับอิซุนะอีกครั้งนะคะ นายท่าน!"
10014-801-110-1 = "ลัล~ ลัลลัลล้า~ ลา♪\nอิซุนะ~ อิซุนะ~ ลัลล้า~♪"
10014-801-120-1 = "อ๊ะ? เสียงแบบนี้...\nนายท่านนี่นา!"
10014-801-130-1 = "มาหาอิซุนะเหรอคะ?\nฮิฮิฮิ!"
10014-801-140-1 = "ดังโงะ.. เซ็มเบ...\nโอโคโนมิยากิ...!"
10014-801-150-1 = "มีของกินอร่อยๆ ที่อยากกิน\nกับนายท่านเต็มไปหมดเลยค่ะ!"
10014-801-160-1 = "อิซุนะ พร้อมลุย!\nอิซุนะจะคอยปกป้องนายท่าน\nพร้อมกับพาชมงานเทศกาลเองค่ะ นินนิน~!"
10014-10801-10-1 = "งานเทศกาลค่ะ นายท่าน!\nเริ่มจากไปเที่ยวที่ไหนก่อนดีคะ?"
