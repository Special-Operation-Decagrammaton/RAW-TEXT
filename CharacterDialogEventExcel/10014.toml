[translation]
10014-801-10-1 = "축제예요! 주군!\n자, 어디부터 놀러 가볼까요?"
10014-801-20-1 = "주군! 주군! 축제가\n정말 기대되네요!"
10014-801-30-1 = "이즈나!\n곁에서 따르겠습니다!"
10014-801-40-1 = "벌써 축제도\n이렇게나 무르익었네요."
10014-801-50-1 = "주군!\n다음엔 어떤 곳을\n들러볼까요?"
10014-801-60-1 = "아…. 축제도 이제\n금방 끝나버리는 건가요…."
10014-801-70-1 = "…그래도!\n마지막까지 이즈나와\n함께 해주세요. 주군!"
10014-801-80-1 = "백야앵제는\n끝나버렸지만…."
10014-801-90-1 = "축제는 앞으로도\n아직 잔뜩 있어요."
10014-801-100-1 = "그때는 또 이즈나와\n어울려주세요! 주군!"
10014-801-110-1 = "흥~ 흥흥흥~ 흥♪\n이즈나이즈나 캥캥~♪"
10014-801-120-1 = "앗? 이 기척은…\n주군이네요!"
10014-801-130-1 = "이즈나를 찾아주신 건가요?\n에헤헷!"
10014-801-140-1 = "경단, 센베이,\n오코노미야키…!"
10014-801-150-1 = "주군과 같이 먹고 싶은\n음식이 잔뜩이에요!"
10014-801-160-1 = "이즈나, 준비 만전!\n주군을 지켜드리면서,\n축제를 안내하겠습니다! 닌닌!"
