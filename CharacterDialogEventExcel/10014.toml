[translation]
10014-801-10-1 = "お祭りですよ、主殿！\nさあ、どこから遊びに\n行きましょうか？"
10014-801-20-1 = "主殿主殿、\nお祭りとっても\n楽しみですね！"
10014-801-30-1 = "イズナ、ずっとそばで\nお供しますので！"
10014-801-40-1 = "お祭りがどんどん盛り\n上がってきましたね！"
10014-801-50-1 = "主殿、次は\nどこへ行きましょうか？"
10014-801-60-1 = "お祭り、\nもうすぐ終わって\nしまいますね……。"
10014-801-70-1 = "せ、せめて最後まで、\nイズナと一緒にいて\nいただけますか、主殿……！"
10014-801-80-1 = "百夜ノ春ノ桜花祭は、\n終わって\nしまいましたが……"
10014-801-90-1 = "お祭りはこれからもまだ\nたくさんありますよね"
10014-801-100-1 = "その時はまたイズナと\n一緒に行ってくれますか、\n主殿！"
10014-801-110-1 = "ふん～ふふん～\nふんふん～♪\nイズナこんこん、\nこんここ～ん♪"
10014-801-120-1 = "むっ、この気配は……\n主殿ですね！"
10014-801-130-1 = "イズナのこと、見つけて\nくださったんですね！\nえへへっ！"
10014-801-140-1 = "お団子、おせんべい、\nお好み焼き……！"
10014-801-150-1 = "主殿と一緒に\n食べたい物が\nたーくさんです！"
10014-801-160-1 = "イズナ、準備万端です！\n主殿のことをお守りしつつ、\nお祭りをご案内します！\nニンニン！"
