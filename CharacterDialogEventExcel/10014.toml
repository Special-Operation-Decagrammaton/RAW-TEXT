[translation]
10014-801-10-1 = "My lord! It's the festival! Where should we go first?"
10014-801-20-1 = "My lord! Izuna is really excited for the festival!"
10014-801-30-1 = "Izuna shall follow you!"
10014-801-40-1 = "The festival is already at this stage."
10014-801-50-1 = "My lord! Were should we look next?"
10014-801-60-1 = "Aw. The festival is ending soon, right?"
10014-801-70-1 = "Whatever it takes! Please stick with Izuna till the very end, my lord!"
10014-801-80-1 = "The Hyakkiyako Cherry Blossom Festival is already over..."
10014-801-90-1 = "There's still plenty of festivals to come."
10014-801-100-1 = "Please hang out with Izuna again, my lord!"
10014-801-110-1 = "Hmm hmm hmmm. Izuna, on the lookout! ♪"
10014-801-120-1 = "Izuna senses a presence... It's my lord!"
10014-801-130-1 = "Were you looking for Izuna? Heehee."
10014-801-140-1 = "Dango, senbei, okonomiyaki...!"
10014-801-150-1 = "There's so much food Izuna wants to eat with you!"
10014-801-160-1 = "Izuna is ready! My lord, Izuna will protect you by being your festival guide! Nin nin!"
