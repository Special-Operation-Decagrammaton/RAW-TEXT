[translation]
10140-120 = "<ปฏิบัติการแกะรอยตำนาน>\nในที่สุดก็เริ่มแล้วสินะ..."
10140-130 = "ฉันจะทำให้เต็มที่\nไม่ให้เสียชื่อ\nSRT เลยละ!"
10140-140 = "ก่อนจะมีผู้เสียหาย\nมากไปกว่านี้..."
10140-150 = "เรารีบไปกันเถอะ คุณครู"
10140-160 = "ซูชิเต้าหู้หวานที่กิน\nระหว่างทำปฏิบัติการ...\nก็เป็นอาหารรสเลิศ\nอีกแบบนะ..."
10140-170 = "นะ... แน่นอนว่าฉัน\nไม่ได้ตั้งตารอปฏิบัติการ\nเพราะเรื่องนี้หรอกนะ!"
10140-180 = "ไม่ว่าจะเป็นผีหรือคน...\nถ้าสร้างความเดือดร้อนตามใจชอบ\nฉันก็ไม่ยกโทษให้หรอก"
10140-190 = "เดี๋ยวก่อน!\nทำไมจู่ๆ ถึงมาจิ้ม\nหน้าท้องคนอื่นล่ะ?!"
10140-400 = "ทำไงดีล่ะ..."
10140-410 = "อ๊ะ คุณครู\nมาได้จังหวะพอดีเลย"
10140-420 = "ฉันกำลังวิเคราะห์\nเบาะแสที่หามาได้อยู่เลย\nพอจะช่วยหน่อยได้มั้ย?"
10140-430 = "มาแล้วเหรอ คุณครู\nมาเริ่มสันนิษฐาน\nกันเลยดีกว่า!"
10140-440 = "ข้อเท็จจริงที่\nเราสันนิษฐานได้\nจากเบาะแสนี้..."
10140-450 = "อ๊ะ อย่าแตะต้องนะ!\nฉันจัดเอาไว้\nให้ดูง่ายๆ แล้วนะ!"
10140-460 = "จำได้ว่าเคยเห็นข้อมูลนี้\nจากที่ไหนมาแล้วนี่นา..."
10140-470 = "สุดยอดเลย!\nสันนิษฐานได้เยี่ยมมาก!"
10140-480 = "ดีละ!\nงั้นก็พิสูจน์ได้เรียบร้อย!"
