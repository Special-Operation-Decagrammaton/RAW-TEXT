[translation]
10140-857-120-1 = "<ปฏิบัติการแกะรอยตำนาน>\nในที่สุดก็เริ่มแล้วสินะ..."
10140-857-130-1 = "ฉันจะทำให้เต็มที่\nไม่ให้เสียชื่อ\nSRT เลยละ!"
10140-857-140-1 = "ก่อนจะมีผู้เสียหาย\nมากไปกว่านี้..."
10140-857-150-1 = "เรารีบไปกันเถอะ คุณครู"
10140-857-160-1 = "ซูชิเต้าหู้หวานที่กินระหว่าง\nทำปฏิบัติการ... ก็เป็นอาหาร\nรสเลิศอีกแบบนะ..."
10140-857-170-1 = "นะ... แน่นอนว่าฉัน\nไม่ได้ตั้งตารอปฏิบัติการ\nเพราะเรื่องนี้หรอกนะ!"
10140-857-180-1 = "ไม่ว่าจะเป็นผีหรือคน...\nถ้าสร้างความเดือดร้อนตามใจชอบ\nฉันก็ไม่ยกโทษให้หรอก"
10140-857-190-1 = "เดี๋ยวก่อน!\nทำไมจู่ๆ ถึงมาจิ้ม\nหน้าท้องคนอื่นล่ะ?!"
10140-857-400-1 = "ทำไงดีล่ะ..."
10140-857-410-1 = "อ๊ะ คุณครู\nมาได้จังหวะพอดีเลย"
10140-857-420-1 = "ฉันกำลังวิเคราะห์\nเบาะแสที่หามาได้อยู่เลย\nพอจะช่วยหน่อยได้มั้ย?"
10140-857-430-1 = "มาแล้วเหรอ คุณครู\nมาเริ่มสันนิษฐาน\nกันเลยดีกว่า!"
10140-857-440-1 = "ข้อเท็จจริงที่\nเราสันนิษฐานได้\nจากเบาะแสนี้..."
10140-857-450-1 = "อ๊ะ อย่าแตะต้องนะ!\nฉันจัดเอาไว้\nให้ดูง่ายๆ แล้วนะ!"
10140-857-460-1 = "จำได้ว่าเคยเห็นข้อมูลนี้\nจากที่ไหนมาแล้วนี่นา..."
10140-857-470-1 = "สุดยอดเลย!\nสันนิษฐานได้เยี่ยมมาก!"
10140-857-480-1 = "ดีละ!\nงั้นก็พิสูจน์ได้เรียบร้อย!"
10140-858-120-1 = "<ปฏิบัติการแกะรอยตำนาน>\nในที่สุดก็เริ่มแล้วสินะ..."
10140-858-130-1 = "ฉันจะทำให้เต็มที่\nไม่ให้เสียชื่อ\nSRT เลยละ!"
