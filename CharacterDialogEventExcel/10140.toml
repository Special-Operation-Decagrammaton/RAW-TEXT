10140-858-150-1 = "เรารีบไปกันเถอะ คุณครู"
10140-858-160-1 = "ซูชิเต้าหู้หวานที่กิน\nระหว่างทำปฏิบัติการ...\nก็เป็นอาหารรสเลิศ\nอีกแบบนะ..."
10140-858-170-1 = "นะ... แน่นอนว่าฉัน\nไม่ได้ตั้งตารอปฏิบัติการ\nเพราะเรื่องนี้หรอกนะ!"
