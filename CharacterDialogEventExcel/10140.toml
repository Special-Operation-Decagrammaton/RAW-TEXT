[translation]
10140-857-120-1 = "「ロア追跡作戦」\n……いよいよね。"
10140-857-130-1 = "全力で行くわ――\nSRTの名に\n泥を塗れないもの！"
10140-857-140-1 = "被害が増える前に……"
10140-857-150-1 = "急ぐわよ、先生。"
10140-857-160-1 = "作戦中に食べる\nいなり寿司……最高。"
10140-857-170-1 = "も、もちろん、\nそれがなくても\n作戦はちゃんとやるわよ！"
10140-857-180-1 = "お化けだろうが\nなんだろうが、\n好きにはさせないわ！"
10140-857-190-1 = "ちょっと！\n急に人のお腹\n触らないでよ！？"
10140-857-400-1 = "どうしよう……。"
10140-857-410-1 = "あ、先生！\nいいところに\n来たじゃない！"
10140-857-420-1 = "集めた手がかりを\nまとめてるんだけど、\nちょっと\n手伝ってくれない？"
10140-857-430-1 = "来たわね、先生。\n推理をはじめていくわよ！"
10140-857-440-1 = "今の情報で\n分かることは……。"
10140-857-450-1 = "あっ！触らないでよ！\nちゃんと\n並び替えてるんだから！"
10140-857-460-1 = "この資料、どこかで\n見たことあるような……。"
10140-857-470-1 = "すごいじゃない！\n完璧な推理だったわ！"
10140-857-480-1 = "よし！\n証明完了よ！"
