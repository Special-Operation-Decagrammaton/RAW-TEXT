[translation]
10140-857-120-1 = "「怪談追蹤作戰」\n……終於要開始了呢。"
10140-857-130-1 = "我會全力以赴的──\n可不能玷汙了SRT的名聲啊！"
10140-857-140-1 = "在受害者增加之前……"
10140-857-150-1 = "加快腳步吧，老師。"
10140-857-160-1 = "在作戰中吃的\n豆皮壽司……\n最讚了。"
10140-857-170-1 = "當，當然，\n就算沒有那個，\n我也會好好作戰的！"
10140-857-180-1 = "不管是妖怪\n還是什麼，\n我都不會讓它\n為所欲為的！"
10140-857-190-1 = "喂！不要突然摸\n人家的肚子啦！？"
10140-857-400-1 = "該怎麼辦呢……"
10140-857-410-1 = "啊，老師！\n你來得很剛好嘛！"
10140-857-420-1 = "我正在彙整\n蒐集到的線索，\n可以幫我一下嗎？"
10140-857-430-1 = "你來啦，老師。\n我們來開始推理吧！"
10140-857-440-1 = "根據目前的情報\n能得知的是……"
10140-857-450-1 = "啊！別亂碰啦！\n我可是有好好\n排列過的耶！"
10140-857-460-1 = "這份資料，好像\n在哪裡見過……"
10140-857-470-1 = "很厲害嘛！\n推理得很完美！"
10140-857-480-1 = "很好！\n證明完成了！"
