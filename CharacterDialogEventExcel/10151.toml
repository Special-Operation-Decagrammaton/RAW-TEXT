[translation]
10151-862-10-1 = "レッドウィンターが誇る\n科学者の学級――"
10151-862-30-1 = "そして、私が183号\n特別クラスの委員長、\n仁木アンナです。"
10151-862-50-1 = "進捗？え、ええ！\nもちろん、\n順調ですよ！"
10151-862-60-1 = "ええ……。"
10151-862-70-1 = "自信？\nも、もちろん\nありますとも……"
10151-862-80-1 = "ええ……あはは……。"
10151-862-90-1 = "うっ……うっ……"
10151-862-100-1 = "ありがとう……\nございました……っ！"
10151-862-150-1 = "レッドウィンターに\nおける発明のほとんどは\n私たちが行ったものです。"
10151-862-370-1 = "ショッピング、ですね。\nいつも買ってきてもらっているので、\n自分で来たのは久しぶりです。"
10151-862-400-1 = "ええっ……。"
10151-862-420-1 = "一緒に探してくださると、\n嬉しいです。"
10151-862-430-1 = "えっと……GOST5632を\n100kgほど……"
10151-862-440-1 = "見つけたら、教えて下さいね。"
10151-862-660-1 = "称賛と褒賞は、\nいくらあっても構いません。"
10151-862-670-1 = "先生にも報酬が必要です。\nええ、当然。"
10151-864-980-1 = "これ、全部達成したら……\n褒めていただけますか？"
10151-864-990-1 = "一番簡単で、褒められるもの……\nないでしょうか？"
10151-864-1000-1 = "きゃあっ！？"
10151-864-1010-1 = "き、緊張なんてしていません！"
10151-864-1020-1 = "肩凝っていましたか……？\n緊張のせいでしょうか。"
10151-864-1030-1 = "いただいてしまいましょう！\nええ、報酬ですもの。"
10151-864-1040-1 = "報酬の受け取り証明書的な\nものは……\nないのでしょうか？"
