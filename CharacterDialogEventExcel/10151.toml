[translation]
10151-862-20-1 = "Welcome to Spec Ops No. 183!"
10151-862-40-1 = "Building a tank? I could do that in my sleep."
10151-862-110-1 = "Yes, I am that genius."
10151-862-120-1 = "Not the masked stand-in."
10151-862-130-1 = "For realsies... I REALLY am...!"
10151-862-140-1 = "Pat pat...? A-Aren't you supposed to do a handshake?"
10151-862-160-1 = "Well... Not voluntarily, though..."
10151-862-170-1 = "Looks like it won't be long before we escap—I mean, graduate Spec Ops."
10151-862-380-1 = "Shopping... H-How do I do this again...?"
10151-862-390-1 = "Is there a \"closing sale\"...? I've read about those in the newspaper..."
10151-862-410-1 = "Um... There's something I want to buy too..."
10151-862-450-1 = "Wh-What is it? I can't buy you anything..."
10151-862-460-1 = "No need for a procurement contract, thank you."
10151-862-470-1 = "If I work hard here, maybe I'll be pardoned... Probably not."
10151-862-480-1 = "Excellent choice. Excellent, just like my achievements."
10151-862-490-1 = "The calculations are perfect too."
10151-862-610-1 = "There are lots of lists... It's time to show what a manager is capable of."
10151-862-620-1 = "\"Check the list.\""
10151-862-630-1 = "Yes, it's on the checklist."
10151-862-640-1 = "Let's complete our objectives first. Autographs can come later."
10151-862-650-1 = "Let's get this done, so we can rest, Sensei."
