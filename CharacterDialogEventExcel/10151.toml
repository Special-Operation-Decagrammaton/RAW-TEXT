[translation]
10151-862-10-1 = "レッドウィンターが誇る\n科学者の学級――"
10151-862-20-1 = "183号特別クラスへ、\nようこそ！"
10151-862-30-1 = "そして、私が183号\n特別クラスの委員長、\n仁木アンナです。"
10151-862-40-1 = "戦車づくり？\nそんなのお茶の子\nさいさいです。"
10151-862-50-1 = "進捗？え、ええ！\nもちろん、\n順調ですよ！"
10151-862-60-1 = "ええ……。"
10151-862-70-1 = "自信？\nも、もちろん\nありますとも……"
10151-862-80-1 = "ええ……あはは……。"
10151-862-90-1 = "うっ……うっ……"
10151-862-100-1 = "ありがとう……\nございました……っ！"
10151-862-110-1 = "ええ、\n私がその天才ですよ。"
10151-862-120-1 = "正真正銘のホンモノ、\nです。"
10151-862-130-1 = "ほ、ほんおに……\nほんおの、れすから……！"
10151-862-140-1 = "ナデナデ……？\nふ、ふつう、\n握手をするものでは？"
10151-862-150-1 = "レッドウィンターに\nおける発明のほとんどは\n私たちが行ったものです。"
10151-862-160-1 = "まぁ……\n本意ではありませんが。"
10151-862-170-1 = "特別クラス脱しゅ……\n修了の日は近いですね。"
10151-862-370-1 = "ショッピング、ですね。\nいつも買ってきてもらっているので、\n自分で来たのは久しぶりです。"
10151-862-380-1 = "お買い物……\nど、どうやるのでしたっけ？"
10151-862-390-1 = "「閉店セール」は\nないのですか……？\n新聞にはあるって……"
10151-862-400-1 = "ええっ……。"
10151-862-410-1 = "その……私も買いたいものが\nあるのですが……"
10151-862-420-1 = "一緒に探してくださると、\n嬉しいです。"
10151-862-430-1 = "えっと……GOST5632を\n100kgほど……"
10151-862-440-1 = "見つけたら、教えて下さいね。"
10151-862-450-1 = "ど、どうしました？\n私は買ってあげることは\nできませんよ？"
10151-862-460-1 = "調達契約も必要ないのですね、\n助かりました。"
10151-862-470-1 = "ここで頑張ったら……\n恩赦がもらえたり、しませんかね？\nしませんよね。"
10151-862-480-1 = "素晴らしい判断です。\nええ、私の業績と同じくらい。"
10151-862-490-1 = "計算も完璧ですね。"
10151-862-610-1 = "リストがこんなに……\n管理職としての腕がなりますね。"
10151-862-620-1 = "「リストを確認すること」"
10151-862-630-1 = "ええ、Todoリストにも\n書いてありました。"
10151-862-640-1 = "ノルマを先に終わらせましょう。\nサインはまた後ほど。"
10151-862-650-1 = "すぐに終わらせて\n休憩に入りましょう、先生。"
10151-862-660-1 = "称賛と褒賞は、\nいくらあっても構いません。"
10151-862-670-1 = "先生にも報酬が必要です。\nええ、当然。"
10151-864-980-1 = "これ、全部達成したら……\n褒めていただけますか？"
10151-864-990-1 = "一番簡単で、褒められるもの……\nないでしょうか？"
10151-864-1000-1 = "きゃあっ！？"
10151-864-1010-1 = "き、緊張なんてしていません！"
10151-864-1020-1 = "肩凝っていましたか……？\n緊張のせいでしょうか。"
10151-864-1030-1 = "いただいてしまいましょう！\nええ、報酬ですもの。"
10151-864-1040-1 = "報酬の受け取り証明書的な\nものは……\nないのでしょうか？"
