[translation]
10151-10 = "レッドウィンターが誇る\n科学者の学級――"
10151-30 = "そして、私が183号\n特別クラスの委員長、\n仁木アンナです。"
10151-50 = "進捗？え、ええ！\nもちろん、\n順調ですよ！"
10151-60 = "ええ……。"
10151-70 = "自信？\nも、もちろん\nありますとも……"
10151-80 = "ええ……あはは……。"
10151-90 = "うっ……うっ……"
10151-100 = "ありがとう……\nございました……っ！"
10151-150 = "レッドウィンターに\nおける発明のほとんどは\n私たちが行ったものです。"
10151-370 = "ショッピング、ですね。\nいつも買ってきてもらっているので、\n自分で来たのは久しぶりです。"
10151-400 = "ええっ……。"
10151-420 = "一緒に探してくださると、\n嬉しいです。"
10151-430 = "えっと……GOST5632を\n100kgほど……"
10151-440 = "見つけたら、教えて下さいね。"
10151-660 = "称賛と褒賞は、\nいくらあっても構いません。"
10151-670 = "先生にも報酬が必要です。\nええ、当然。"
10151-980 = "これ、全部達成したら……\n褒めていただけますか？"
10151-990 = "一番簡単で、褒められるもの……\nないでしょうか？"
10151-1000 = "きゃあっ！？"
10151-1010 = "き、緊張なんてしていません！"
10151-1020 = "肩凝っていましたか……？\n緊張のせいでしょうか。"
10151-1030 = "いただいてしまいましょう！\nええ、報酬ですもの。"
10151-1040 = "報酬の受け取り証明書的な\nものは……\nないのでしょうか？"
