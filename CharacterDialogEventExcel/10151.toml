[translation]
10151-862-110-1 = "ค่า~\nฉันคืออัจฉริยะคนนั้นเองค่ะ"
10151-862-120-1 = "ไม่ใช่สตันท์แมน\nที่สวมหน้ากากค่ะ"
10151-862-130-1 = "ฮะ... ฮิงๆ นะ...\nฮัวฮิง... ฮิงๆ ฮ่ะ...!"
10151-862-140-1 = "ลูบหัว...? ปะ... ปกติต้องจับมือกันไม่ใช่เหรอคะ?"
10151-862-160-1 = "ก็...\nถึงไม่ได้สมัครใจ\nก็เถอะค่ะ"
10151-862-170-1 = "ดูเหมือนอีกไม่นาน\nจะได้ออกไป...\nจะเรียนจบจาก\nห้องเรียนพิเศษแล้วค่ะ"
10151-862-390-1 = "ไม่มีของที่ 'ลดล้างสต็อก' บ้างเหรอคะ...?\nเห็นในหนังสือพิมพ์บอกว่ามีนี่นา..."
10151-862-450-1 = "ทะ... ทำไมทำแบบนั้นล่ะคะ?\nฉันซื้ออะไรให้\nไม่ได้หรอกนะ..."
10151-862-460-1 = "ไม่ต้องทำสัญญาจัดซื้อด้วยสินะ\nขอบคุณค่ะ"
10151-862-470-1 = "ถ้าตั้งใจทำงานที่นี่\nจะได้รับนิรโทษกรรม...\nคงไม่ใช่สินะคะ"
10151-862-480-1 = "เลือกได้ดีมากเลยค่ะ\nค่า เหมือนผลงานของฉันไงคะ"
10151-862-490-1 = "คิดเงินได้เป๊ะเลยละค่ะ"
10151-862-610-1 = "รายการของเต็มไปหมดเลย...\nคงต้องแสดงฝีมือของ\nผู้ดูแลหน่อยแล้วละค่ะ"
10151-862-620-1 = "'ตรวจสอบรายการ'"
10151-862-630-1 = "ค่ะ เขียนไว้ในเช็กลิสต์\nเรียบร้อยแล้วค่ะ"
10151-862-640-1 = "ทำตามลิสต์ให้เสร็จก่อนเถอะค่ะ\nส่วนลายเซ็นเอาไว้ทีหลัง"
10151-862-650-1 = "รีบทำให้เสร็จแล้วไปพัก\nด้วยกันเถอะค่ะ คุณครู"
