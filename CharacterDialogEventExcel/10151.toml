[translation]
10151-10 = "붉은겨울의 자랑인\n과학자들의 반-"
10151-20 = "183호 특별반에, 어서오세요!"
10151-30 = "그리고, 제가 183호 \n특별반의 반장, \n니키 안나입니다."
10151-40 = "전차 만드는거요?\n그런거, 식은 죽 먹기랍니다."
10151-50 = "진척이요? \n아, 아아- 그럼요! \n당연히 잘 되어가죠! "
10151-60 = "네에……."
10151-70 = "자신?\n저는 당연히, 자신 있죠……"
10151-80 = "아하하, 하……."
10151-90 = "우웃…… 웃……"
10151-100 = "감사…… 합니다아아……!"
10151-110 = "네에-\n제가 그 천재입니다."
10151-120 = "마스크 쓴 대역이\n아니에요."
10151-130 = "지, 지햐호…… \n혼힝, 마햐효……!"
10151-140 = "쓰담쓰담……?보, 보통은 악수를 하지 않나요?"
10151-150 = "붉은겨울의 발명은 대부분\n저희 작품이에요."
10151-160 = "뭐……\n자발적인 건\n아니지만요."
10151-170 = " 특별반 탈……\n수료도 얼마 안남은\n것 같네요."
10151-370 = "쇼핑, 이네요.\n항상 사와달라고 부탁하고 있어서,\n직접 오는 건 간만이에요."
10151-380 = "쇼핑…….\n어, 어떻게 하는거더라……?"
10151-390 = "'폐점 세일'은 없나요……?\n신문에서는 그런게 있다고……"
10151-400 = "에엣……."
10151-410 = "저기…… \n저도 사고 싶은게 있는데요……"
10151-420 = "같이 찾아주시면 감사하겠습니다."
10151-430 = "그러니까- GOST 5632가\n100kg 정도 필요한데,"
10151-440 = "찾으시면 알려주세요."
10151-450 = "왜, 왜그러시나요?\n제가 뭔가 사드릴\n수는 없는데……."
10151-460 = "조달 계약도 필요 없군요,\n감사합니다."
10151-470 = "여기서 열심히 하면\n사면이라던가…… \n하지는 않겠죠."
10151-480 = "훌륭한 선택이에요. \n네에, 제 업적들처럼요."
10151-490 = "계산도 완벽하네요."
10151-610 = "리스트가 잔뜩……\n관리자의 실력, 보여줘야 겠네요."
10151-620 = "'리스트를 확인할 것'"
10151-630 = "네, 체크리스트에 잘 적어뒀네요."
10151-640 = "목표를 먼저 끝내죠.\n사인은 나중에."
10151-650 = "얼른 마치고 같이 쉬죠, 선생님."
10151-660 = "칭찬과 보상은 아무리 많아도\n문제 없습니다."
10151-670 = "선생님께도 보상이 필요해요. \n네에, 당연히요."
