[translation]
10151-110 = "是的——\n我就是那位天才。"
10151-120 = "才不是戴著面具的\n替身。"
10151-130 = "偶、偶系天才……\n請、請多指教……！"
10151-140 = "摸、摸摸……？一、一般不是握手嗎？"
10151-160 = "嗯……\n雖然不是\n自願的就是了。"
10151-170 = "特別班的退……\n感覺離結業\n也沒多久了呢。"
10151-390 = "沒有『歇業特賣』嗎……？\n報紙上說有那種……"
10151-450 = "怎、怎麼了嗎？\n我可沒辦法買東西\n送給您……。"
10151-460 = "也不需要採購合約呢，\n謝謝您。"
10151-470 = "在這裡努力的話，\n特赦之類的……\n應該不會有吧。"
10151-480 = "真是明智的選擇。\n是的，就像我的功績一樣。"
10151-490 = "計算也完美無缺呢。"
10151-610 = "清單好多……\n該展現管理者的實力了。"
10151-620 = "『確認清單』"
10151-630 = "嗯，已經好好寫在檢查清單上了。"
10151-640 = "先完成目標吧。\n簽名晚點再說。"
10151-650 = "趕快完成後一起休息吧，老師。"
