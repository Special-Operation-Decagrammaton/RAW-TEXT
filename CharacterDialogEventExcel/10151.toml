[translation]
10151-10 = "レッドウィンターが誇る\n科学者の学級――"
10151-20 = "183号特別クラスへ、\nようこそ！"
10151-30 = "そして、私が183号\n特別クラスの委員長、\n仁木アンナです。"
10151-40 = "戦車づくり？\nそんなのお茶の子\nさいさいです。"
10151-50 = "進捗？え、ええ！\nもちろん、\n順調ですよ！"
10151-60 = "ええ……。"
10151-70 = "自信？\nも、もちろん\nありますとも……"
10151-80 = "ええ……あはは……。"
10151-90 = "うっ……うっ……"
10151-100 = "ありがとう……\nございました……っ！"
10151-110 = "ええ、\n私がその天才ですよ。"
10151-120 = "正真正銘のホンモノ、\nです。"
10151-130 = "ほ、ほんおに……\nほんおの、れすから……！"
10151-140 = "ナデナデ……？\nふ、ふつう、\n握手をするものでは？"
10151-150 = "レッドウィンターに\nおける発明のほとんどは\n私たちが行ったものです。"
10151-160 = "まぁ……\n本意ではありませんが。"
10151-170 = "特別クラス脱しゅ……\n修了の日は近いですね。"
10151-370 = "ショッピング、ですね。\nいつも買ってきてもらっているので、\n自分で来たのは久しぶりです。"
10151-380 = "お買い物……\nど、どうやるのでしたっけ？"
10151-390 = "「閉店セール」は\nないのですか……？\n新聞にはあるって……"
10151-400 = "ええっ……。"
10151-410 = "その……私も買いたいものが\nあるのですが……"
10151-420 = "一緒に探してくださると、\n嬉しいです。"
10151-430 = "えっと……GOST5632を\n100kgほど……"
10151-440 = "見つけたら、教えて下さいね。"
10151-450 = "ど、どうしました？\n私は買ってあげることは\nできませんよ？"
10151-460 = "調達契約も必要ないのですね、\n助かりました。"
10151-470 = "ここで頑張ったら……\n恩赦がもらえたり、しませんかね？\nしませんよね。"
10151-480 = "素晴らしい判断です。\nええ、私の業績と同じくらい。"
10151-490 = "計算も完璧ですね。"
10151-610 = "リストがこんなに……\n管理職としての腕がなりますね。"
10151-620 = "「リストを確認すること」"
10151-630 = "ええ、Todoリストにも\n書いてありました。"
10151-640 = "ノルマを先に終わらせましょう。\nサインはまた後ほど。"
10151-650 = "すぐに終わらせて\n休憩に入りましょう、先生。"
10151-660 = "称賛と褒賞は、\nいくらあっても構いません。"
10151-670 = "先生にも報酬が必要です。\nええ、当然。"
