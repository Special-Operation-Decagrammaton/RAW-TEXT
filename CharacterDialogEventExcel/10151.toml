[translation]
10151-110 = "ค่า~\nฉันคืออัจฉริยะคนนั้นเองค่ะ"
10151-120 = "ไม่ใช่สตันท์แมน\nที่สวมหน้ากากค่ะ"
10151-130 = "ฮะ... ฮิงๆ นะ...\nฮัวฮิง... ฮิงๆ ฮ่ะ...!"
10151-140 = "ลูบหัว...? ปะ... ปกติต้องจับมือกันไม่ใช่เหรอคะ?"
10151-160 = "ก็...\nถึงไม่ได้สมัครใจ\nก็เถอะค่ะ"
10151-170 = "ดูเหมือนอีกไม่นาน\nจะได้ออกไป...\nจะเรียนจบจาก\nห้องเรียนพิเศษแล้วค่ะ"
10151-390 = "ไม่มีของที่ 'ลดล้างสต็อก' บ้างเหรอคะ...?\nเห็นในหนังสือพิมพ์บอกว่ามีนี่นา..."
10151-450 = "ทะ... ทำไมทำแบบนั้นล่ะคะ?\nฉันซื้ออะไรให้\nไม่ได้หรอกนะ..."
10151-460 = "ไม่ต้องทำสัญญาจัดซื้อด้วยสินะ\nขอบคุณค่ะ"
10151-470 = "ถ้าตั้งใจทำงานที่นี่\nจะได้รับนิรโทษกรรม...\nคงไม่ใช่สินะคะ"
10151-480 = "เลือกได้ดีมากเลยค่ะ\nค่า เหมือนผลงานของฉันไงคะ"
10151-490 = "คิดเงินได้เป๊ะเลยละค่ะ"
10151-610 = "รายการของเต็มไปหมดเลย...\nคงต้องแสดงฝีมือของ\nผู้ดูแลหน่อยแล้วละค่ะ"
10151-620 = "'ตรวจสอบรายการ'"
10151-630 = "ค่ะ เขียนไว้ในเช็กลิสต์\nเรียบร้อยแล้วค่ะ"
10151-640 = "ทำตามลิสต์ให้เสร็จก่อนเถอะค่ะ\nส่วนลายเซ็นเอาไว้ทีหลัง"
10151-650 = "รีบทำให้เสร็จแล้วไปพัก\nด้วยกันเถอะค่ะ คุณครู"
