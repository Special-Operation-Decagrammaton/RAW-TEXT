[translation]
10067-825-350-1 = "先生、来ましたか。"
10067-825-360-1 = "潜入任務、準備は\n完了しております。"
10067-825-370-1 = "準備はできています。\nいつでもご指示を。"
10067-825-380-1 = "ここには、何か秘密が\n隠れていそうです。"
10067-825-390-1 = "困惑する気持ちは\n分かります。ですが\n私を信じてください。"
10067-825-400-1 = "私はいつでも\n先生の味方です。"
10067-825-410-1 = "すべて、つつがなく\nまとまって何よりです。"
10067-825-420-1 = "今回の教訓を基に、より\n完璧なエージェントを\n目指し努めて参ります。"
10067-825-430-1 = "はい、先生。\n何かありましたか？"
10067-825-440-1 = "うっ…この服は、\n感覚がダイレクトに\n伝わりますね…"
10067-825-450-1 = "…素材が薄いから、\n当然ですが…。"
10067-825-460-1 = "バニースーツ、ですか？"
10067-825-470-1 = "メイド服とは\n異なる利点があって、\nよいと思っております。"
10067-825-480-1 = "バニー姿、よく\n似合ってる、ですか？"
10067-825-490-1 = "ん…その、\nありがとう、ございます。褒められるとは、\n思ってもおらず…。"
10067-825-680-1 = "先生でしたか。\n本日のミッションは、\nこちらになります。"
10067-825-690-1 = "ミッションは\n重要事項の一つです。"
10067-825-700-1 = "今日も一歩ずつ、\n着実に進んでいきましょう。"
10067-825-710-1 = "毎日課せられる日課は、\n時に負担に\nなることもあります。"
10067-825-720-1 = "大丈夫です、\n私が先生の力になります。"
10067-825-730-1 = "エージェントとミッションは、\n切っても切れない関係。"
10067-825-740-1 = "…つまり今の先生は、\nエージェントでもあるという事です。"
10067-825-750-1 = "本日のミッション、\nコンプリートです。\nお疲れ様でした、先生。"
10067-825-760-1 = "私からみてもかなり\nハードなスケジュールでした。"
10067-825-770-1 = "さすがです、先生。"
10067-825-800-1 = "先生でしたか。\n本日のミッションは、\nこちらになります。"
