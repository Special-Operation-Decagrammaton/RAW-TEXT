[translation]
10067-825-350-1 = "선생님 오셨군요."
10067-825-360-1 = "잠입 임무,\n준비는 완료했습니다."
10067-825-370-1 = "준비는 되어 있습니다.\n언제든지 지시를."
10067-825-380-1 = "여기에는, 뭔가 비밀이\n숨어있을 것 같군요."
10067-825-390-1 = "혼란스러운 기분은\n이해합니다.\n하지만 저를 믿어 주세요."
10067-825-400-1 = "저는 언제든지\n선생님 편입니다."
10067-825-410-1 = "모두, 차질없이\n정리되어 다행입니다."
10067-825-420-1 = "이번 교훈을 바탕으로, 보다\n완벽한 에이전트를 목표로\n노력하도록 하겠습니다."
10067-825-430-1 = "네. 선생님.\n무슨 일이신지요?"
10067-825-440-1 = "웃… 이 옷은,\n감각이 다이렉트로\n전해지네요…"
10067-825-450-1 = "…소재가 얇으니까\n당연하겠지만요…"
10067-825-460-1 = "바니 슈트, 말인가요?"
10067-825-470-1 = "메이드복과는\n다른 이점이 있어서,\n좋다고 생각합니다."
10067-825-480-1 = "바니 모습,\n잘 어울린다, 고요?"
10067-825-490-1 = "음… 그, 감사, 합니다.\n칭찬받을 줄은,\n생각지도 못했네요…"
10067-825-680-1 = "선생님이시군요.\n오늘의 미션은, 이쪽입니다."
10067-825-690-1 = "미션은 중요 사항 중\n하나입니다."
10067-825-700-1 = "오늘도 한 걸음씩,\n차근차근 나아갑시다."
10067-825-710-1 = "매일 부과되는 일과란,\n때로 부담스러운 것이기도 하죠."
10067-825-720-1 = "괜찮습니다, 제가 선생님의\n힘이 되어 드리겠습니다."
10067-825-730-1 = "에이전트와 미션은\n떼려야 뗄 수 없는 관계."
10067-825-740-1 = "…즉 지금의 선생님은,\n에이전트이기도 하시다는 것이죠."
10067-825-750-1 = "오늘의 미션, 컴플리트입니다.\n수고하셨습니다, 선생님."
10067-825-760-1 = "제가 보아도 상당히\n힘든 일정이었습니다."
10067-825-770-1 = "선생님은 역시 대단하십니다."
10067-825-800-1 = "선생님이시군요.\n오늘의 미션은, 이쪽입니다."
