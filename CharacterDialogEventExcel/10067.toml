[translation]
10067-825-350-1 = "มาแล้วเหรอคะคุณครู"
10067-825-360-1 = "ฉันเตรียมภารกิจแฝงตัว\nเสร็จแล้วค่ะ"
10067-825-370-1 = "เตรียมตัวพร้อมแล้วค่ะ\nออกคำสั่งได้ทุกเมื่อเลยค่ะ"
10067-825-380-1 = "ที่นี่เหมือนมีความลับ\nอะไรซ่อนไว้เลยค่ะ"
10067-825-390-1 = "ฉันเข้าใจ\nความรู้สึกสับสนค่ะ\nแต่ก็เชื่อใจฉันด้วยนะคะ"
10067-825-400-1 = "ฉันอยู่ข้างคุณครู\nทุกเมื่อเลยค่ะ"
10067-825-410-1 = "โล่งอกไปทีนะคะ\nที่ทุกอย่างเรียบร้อยดี"
10067-825-420-1 = "จากบทเรียนนี้ ฉันจะ\nพยายามให้มากขึ้นเพื่อเป็น\nสายลับที่สมบูรณ์แบบค่ะ"
10067-825-430-1 = "ค่ะ คุณครู\nมีเรื่องอะไรเหรอคะ?"
10067-825-440-1 = "ชุด... ชุดนี้\nให้ความรู้สึก\nโดยตรงเลยนะคะ..."
10067-825-450-1 = "...แต่ก็แน่นอนอยู่แล้ว\nผ้ามันบางน่ะค่ะ"
10067-825-460-1 = "ชุดบันนี่น่ะเหรอคะ?"
10067-825-470-1 = "ฉันชอบเพราะว่า\nมันมีข้อได้เปรียบ\nที่ต่างจากชุดเมดค่ะ"
10067-825-480-1 = "ฉันดูเข้ากับ\nบันนี่งั้นเหรอคะ?"
10067-825-490-1 = "อืม... ขะ... ขอบคุณค่ะ\nไม่คิดเลยนะคะ\nว่าจะได้รับคำชมด้วย..."
10067-825-680-1 = "คุณครูนี่เอง\nภารกิจวันนี้อยู่ทางนี้ค่ะ"
10067-825-690-1 = "ภารกิจก็เป็นหนึ่งใน\nสิ่งสำคัญที่ต้องทำค่ะ"
10067-825-700-1 = "วันนี้ก็ค่อยๆ\nก้าวไปทีละก้าวนะคะ"
10067-825-710-1 = "หน้าที่แต่ละวันที่มากไป\nบางครั้งก็เป็นภาระได้นะคะ"
10067-825-720-1 = "ไม่เป็นไรค่ะ ฉันจะเป็น\nกำลังใจให้คุณครูเองค่ะ"
10067-825-730-1 = "ภารกิจกับสายลับ\nเป็นสิ่งที่แยกจากกันไม่ได้ค่ะ"
10067-825-740-1 = "...แปลว่าตอนนี้คุณครู\nก็เป็นเหมือนสายลับอีกคนค่ะ"
10067-825-750-1 = "เสร็จภารกิจวันนี้แล้วค่ะ\nทำได้ดีมากค่ะคุณครู"
10067-825-760-1 = "ขนาดฉันยังคิดว่านี่เป็นงานที่\nลำบากไม่ใช่เล่นเลยค่ะ"
10067-825-770-1 = "คุณครูยอดเยี่ยมจังเลยนะคะ"
10067-825-800-1 = "คุณครูนี่เอง\nภารกิจวันนี้อยู่ทางนี้ค่ะ"
10067-825-810-1 = "ภารกิจก็เป็นหนึ่งใน\nสิ่งสำคัญที่ต้องทำค่ะ"
