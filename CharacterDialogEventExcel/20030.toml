[translation]
20030-818-570-1 = "<황륜대제>…\n새로운 미식의 지평이,\n열리는 날이 왔군요."
20030-818-580-1 = "오셨군요, 선생님."
20030-818-590-1 = "그러면, 지금부터 저와――"
20030-818-600-1 = "노점 정복에\n도전해보시겠어요?"
20030-818-610-1 = "우후후. 선생님,\n즐기고 계신가요?"
20030-818-620-1 = "저는 더할 나위 없이\n즐기고 있답니다."
20030-818-630-1 = "어느새 <황륜대제>도\n막바지…"
20030-818-640-1 = "즐거운 시간은 순식간,\n이라고 합니다만…"
20030-818-650-1 = "추억은 언제까지고\n남기 마련이겠죠."
20030-818-660-1 = "평안하신지요, 선생님.\n노점 제패라면\n완료했답니다."
20030-818-670-1 = "저는 살이 찌지 않는\n체질입니다만, 많이 먹을 수\n있는 것은 아니어서…"
20030-818-680-1 = "언제나, 안타까운\n마음으로 가득하답니다."
20030-818-690-1 = "조금, 몸을 움직이고\n싶어졌어요."
20030-818-700-1 = "저도, 참여해도 될까요?\n…'빵 먹기 경주'에"
20030-818-710-1 = "<황륜대제>의 노점은\n그야말로, '미식 박람회'\n그 자체!"
20030-818-720-1 = "아아, 궁극의 맛이,\n분명 거기에…!"
20030-818-730-1 = "선생님… 잠시 함께\n걷지 않으시겠어요?"
20030-818-740-1 = "…평소와는 다른 복장도,\n나름대로 좋네요."
