[translation]
20030-818-570-1 = "<ฮาโลเฟสติวัล>...\nวันแห่งการเริ่มต้นเส้นทาง\nแห่งอาหารเลิศรสครั้งใหม่\nมาถึงแล้วสินะคะ"
20030-818-580-1 = "มาแล้วเหรอคะ คุณครู"
20030-818-590-1 = "ถ้างั้นตั้งแต่นี้คุณครูกับฉัน..."
20030-818-600-1 = "เรามาลองทำชาเลนจ์\nพิชิตร้านอาหารแผงลอยกันมั้ยคะ?"
20030-818-610-1 = "ฮุฮุฮุ คุณครู...\nสนุกหรือเปล่าคะ?"
20030-818-620-1 = "ฉันกำลังสนุกสุดๆ\nแบบอดใจไม่อยู่เลยละค่ะ"
20030-818-630-1 = "งาน <ฮาโลเฟสติวัล> ครั้งนี้\nใกล้จบลงแล้ว..."
20030-818-640-1 = "เวลาแสนสนุกผ่านไป\nเพียงแค่พริบตาเท่านั้น..."
20030-818-650-1 = "เหลือเพียงแค่\nความทรงจำเท่านั้นสินะคะ"
20030-818-660-1 = "สบายดีหรือเปล่าคะ คุณครู\nถ้าเรื่องพิชิตร้านแผงลอยละก็\nฉันทำสำเร็จแล้วละค่ะ"
20030-818-670-1 = "ฉันเป็นพวกกินเท่าไร\nก็ไม่ค่อยอ้วนน่ะค่ะ แต่ว่า\nฉันกินได้ไม่เยอะหรอกนะคะ..."
20030-818-680-1 = "ไม่ว่ายังไง\nก็รู้สึกเสียดายอยู่ดีค่ะ"
20030-818-690-1 = "ยังรู้สึกอยากขยับร่างกาย\nต่ออีกสักหน่อยน่ะค่ะ"
20030-818-700-1 = "ฉันร่วมแข่งกินขนมปังด้วย\nได้หรือเปล่าคะ?"
20030-818-710-1 = "ร้านแผงลอยใน <ฮาโลเฟสติวัล>\nก็เหมือนกับงาน 'นิทรรศการอาหาร\nเลิศรส' เลยละค่ะ~"
20030-818-720-1 = "อ่า... รสชาติที่ล้ำลึก\nจะต้องอยู่ที่นั่นไม่ผิดแน่...!"
20030-818-730-1 = "คุณครู... ไปเดินดูด้วยกัน\nสักหน่อยมั้ยคะ?"
20030-818-740-1 = "นานๆ ทีได้ใส่ชุดที่ต่างจากปกติ\nก็ดีเหมือนกันนะคะ"
