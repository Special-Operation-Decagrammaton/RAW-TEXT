[translation]
20030-818-570-1 = "「晄輪大祭」…\n美食的新境界，\n已經到來。"
20030-818-580-1 = "您來了啊，老師。"
20030-818-590-1 = "那麼，現在開始\n和我一起──"
20030-818-600-1 = "挑戰征服路邊攤吧？"
20030-818-610-1 = "唔呵呵。\n老師，玩得開心嗎？"
20030-818-620-1 = "我非常樂在其中。"
20030-818-630-1 = "不知不覺「晄輪大祭」\n也已經進入尾聲……"
20030-818-640-1 = "雖說快樂的時光\n轉瞬即逝……"
20030-818-650-1 = "但回憶將會永遠留下。"
20030-818-660-1 = "您好，老師。\n我已經征服路邊攤了。"
20030-818-670-1 = "我雖然是不會胖的體質，\n卻不代表能吃很多…"
20030-818-680-1 = "總是讓我感到十分沮喪。"
20030-818-690-1 = "有點想活動一下身體了。"
20030-818-700-1 = "我也可以參加嗎？\n…「吃麵包競走」。"
20030-818-710-1 = "「晄輪大祭」的攤位，\n正是「美食的博覽會」！"
20030-818-720-1 = "啊啊，究極的美味，\n肯定就在那裡…！"
20030-818-730-1 = "老師…要不要\n一起走走呢？"
20030-818-740-1 = "…與平時不同的打扮，\n也別有一番風味唷。"
