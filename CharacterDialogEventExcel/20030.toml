[translation]
20030-818-570-1 = "「晄輪大祭」… 。\n新たな美食の地平が、\nやって参りましたわ。"
20030-818-580-1 = "いらしたのですね、\n先生。"
20030-818-590-1 = "それでは、\n今から私と――"
20030-818-600-1 = "屋台征服と\n洒落込みましょうか。"
20030-818-610-1 = "うふふ。先生、\n楽しんでおりますか？"
20030-818-620-1 = "私はこの上なく\n謳歌しておりますわ。"
20030-818-630-1 = "気がついたら\n「晄輪大祭」も終盤に…。"
20030-818-640-1 = "楽しい時間は\nあっという間、\nと言いますけれども…"
20030-818-650-1 = "思い出はいつまでも\n残るものですわ。"
20030-818-660-1 = "ごきげんよう、先生。\n屋台の制覇なら\n済んでおりますわ。"
20030-818-670-1 = "私は太らない体質ですが、\nたくさん食べられる\nわけではなく…。"
20030-818-680-1 = "いつも、もどかしい\n気持ちでいっぱいです。"
20030-818-690-1 = "少し、身体を動かしたく\nなりました。"
20030-818-700-1 = "私も、参加して\nよろしいでしょうか？\n…「パン食い競争」に。"
20030-818-710-1 = "「晄輪大祭」の屋台は\nまさに、「美食の博覧会」\nそのもの！"
20030-818-720-1 = "ああ、究極の味わいが、\nきっとそこに…！"
20030-818-730-1 = "先生…少しだけ、\n一緒に歩きませんか？"
20030-818-740-1 = "…いつもと違う格好も、\n乙なものですよ。"
