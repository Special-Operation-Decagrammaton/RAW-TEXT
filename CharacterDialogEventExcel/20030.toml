[translation]
20030-818-570-1 = "The Kivotos Halo Festival... It's the dawn of a new culinary era."
20030-818-580-1 = "Thank you for coming, Sensei."
20030-818-590-1 = "So, will you join me..."
20030-818-600-1 = "...in my conquest of the food stalls?"
20030-818-610-1 = "Sensei, are you enjoying yourself?"
20030-818-620-1 = "I myself couldn't be having more fun."
20030-818-630-1 = "And so the Kivotos Halo Festival is coming to an end..."
20030-818-640-1 = "They say that good times are fleeting, but..."
20030-818-650-1 = "...memories are forever."
20030-818-660-1 = "How are you holding up, Sensei? I've finished my conquest of the food stalls..."
20030-818-670-1 = "I don't gain weight easily, but I also can't eat much, so..."
20030-818-680-1 = "I'm always filled with regret about the food I couldn't try."
20030-818-690-1 = "I need to move my body for a bit."
20030-818-700-1 = "Would it be okay if I join the race? The bread-eating race, that is."
20030-818-710-1 = "The Kivotos Halo Festival street stalls are like a culinary exhibition!"
20030-818-720-1 = "I'm convinced I'll find the ultimate flavor here somewhere...!"
20030-818-730-1 = "Sensei... Will you take a walk with me?"
20030-818-740-1 = "...It's nice to have a different outfit for a change."
