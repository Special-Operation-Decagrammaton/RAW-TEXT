[translation]
16011-818-280-1 = "讓您久等了，老師。\n準備好了嗎？"
16011-818-290-1 = "正好比賽\n要開始了。\n一起去吧。"
16011-818-300-1 = "氣氛相當熱烈呢。"
16011-818-310-1 = "這樣的話，\n「晄輪大祭」……\n可以算是成功了吧。"
16011-818-320-1 = "晄輪大祭也迎來了\n最後階段。"
16011-818-330-1 = "堅持到最後吧。"
16011-818-340-1 = "託老師的福，\n「晄輪大祭」取得了\n巨大的成功。"
16011-818-350-1 = "真的辛苦您了。"
16011-818-360-1 = "老，老師……！"
16011-818-370-1 = "就，就算那樣看著我……"
16011-818-380-1 = "差不多該出發了……"
16011-818-390-1 = "有什麼需要的嗎？"
16011-818-500-1 = "要確認比賽紀錄嗎？"
16011-818-510-1 = "我整理了進展狀況。\n要確認一下嗎？"
16011-818-520-1 = "那個……現在您看到的\n已經是全部了。"
16011-818-530-1 = "還有其他\n想確認的事嗎……？"
16011-818-540-1 = "已確認。\n很棒的記錄呢。"
16011-818-550-1 = "這個…\n說不定是新紀錄唷。"
