[translation]
16011-818-280-1 = "ฉันกำลังรออยู่เลยค่ะ คุณครู\nพร้อมแล้วหรือยังคะ?"
16011-818-290-1 = "การแข่งขันใกล้จะ\nเริ่มพอดีเลยค่ะ\nเราไปด้วยกันเลยไหมคะ?"
16011-818-300-1 = "บรรยากาศคึกคักมากเลยนะคะ"
16011-818-310-1 = "แบบนี้ก็พูดได้ว่า\nฮาโลเฟสติวัลครั้งนี้\nประสบความสำเร็จได้เลยค่ะ"
16011-818-320-1 = "มาถึงช่วงสุดท้ายของ\nฮาโลเฟสติวัลแล้วสินะคะ"
16011-818-330-1 = "มาออกแรงสู้อีกนิด\nจนกว่าจะจบงานนะคะ"
16011-818-340-1 = "ฮาโลเฟสติวัลประสบ\nความสำเร็จสูงมากๆ\nเพราะคุณครูเลยนะคะ"
16011-818-350-1 = "คุณครูทำได้\nดีมากๆ เลยละค่ะ"
16011-818-360-1 = "คะ... คุณครูคะ...?"
16011-818-370-1 = "ถะ... ถึงจะจ้องกันแบบนั้น..."
16011-818-380-1 = "ตอนนี้เราต้อง\nออกเดินทางกันแล้วละค่ะ..."
16011-818-390-1 = "ต้องการอะไร\nงั้นเหรอคะ?"
16011-818-500-1 = "ลองดูสถิติการแข่งขัน\nดูหน่อยไหมคะ?"
16011-818-510-1 = "ฉันบันทึกการแข่งขันไว้แล้วค่ะ\nจะลองดูสักหน่อยไหมคะ?"
16011-818-520-1 = "อืม... ตอนนี้ฉันมีให้ดู\nแค่เพียงเท่านี้ค่ะ..."
16011-818-530-1 = "หรือว่ามีอย่างอื่น\nที่อยากดูอีกเหรอคะ...?"
16011-818-540-1 = "ฉันเช็กดูแล้วค่ะ\nเป็นสถิติที่ยอดเยี่ยมเลยค่ะ"
16011-818-550-1 = "นี่น่ะ... อาจจะเป็น\nสถิติใหม่ก็ได้นะคะ"
16011-10818-280-1 = "ฉันกำลังรออยู่เลยค่ะ คุณครู\nพร้อมแล้วหรือยังคะ?"
