[translation]
16011-818-280-1 = "I've been waiting for you, Sensei. Are you ready?"
16011-818-290-1 = "The games are about to begin. Let's get going, shall we?"
16011-818-300-1 = "Everything is in full swing."
16011-818-310-1 = "I think it's safe to call this Kivotos Halo Festival a success... Don't you agree?"
16011-818-320-1 = "We're entering the final stretch of the Kivotos Halo Festival."
16011-818-330-1 = "Let's make sure to finish strong."
16011-818-340-1 = "The Kivotos Halo Festival was a massive success thanks to you, Sensei."
16011-818-350-1 = "Thank you for all your hard work."
16011-818-360-1 = "S-Sensei?"
16011-818-370-1 = "If you keep staring at me like that..."
16011-818-380-1 = "It's about time we started heading out..."
16011-818-390-1 = "Is there something you need?"
16011-818-500-1 = "You want to take a look at the match records?"
16011-818-510-1 = "I have a summary right here. Feel free to peruse it."
16011-818-520-1 = "For now, this is all I have to show you..."
16011-818-530-1 = "Is there anything else you'd like to see?"
16011-818-540-1 = "Got it. What an excellent record."
16011-818-550-1 = "This... This might be a new record."
