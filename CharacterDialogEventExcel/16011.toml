[translation]
16011-818-280-1 = "お待ちしておりました、\n先生。準備は\nよろしいですか？"
16011-818-290-1 = "ちょうど試合が\n始まるところです。\n一緒に参りましょうか。"
16011-818-300-1 = "結構盛り上がって\nいますね。"
16011-818-310-1 = "これなら、\n「晄輪大祭」は成功……\nと考えてもいいですね。"
16011-818-320-1 = "「晄輪大祭」も大詰めを\n迎えていますね。"
16011-818-330-1 = "最後まで\n頑張りましょう。"
16011-818-340-1 = "先生のおかげで、\n「晄輪大祭」は大成功を\n収めることができました。"
16011-818-350-1 = "本当に\nお疲れ様でした。"
16011-818-360-1 = "せ、先生……？"
16011-818-370-1 = "そ、そんなに\n見つめられても……。"
16011-818-380-1 = "そろそろ出発の\nお時間ですよ……。"
16011-818-390-1 = "何か必要なものでも\nありますか？"
16011-818-500-1 = "試合の記録を確認しますか？"
16011-818-510-1 = "進行状況を整理しました。\n 確認しますか？"
16011-818-520-1 = "えっと……現在お見せ\nできるのはこれで全てです。"
16011-818-530-1 = "他に確認したいことでも\nありますか……?"
16011-818-540-1 = "確認しました。\n素晴らしい記録ですね。"
16011-818-550-1 = "これは……\n新記録かもしれません。"
