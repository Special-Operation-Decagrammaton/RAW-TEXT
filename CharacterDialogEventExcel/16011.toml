[translation]
16011-818-280-1 = "기다리고 있었습니다,\n선생님. 준비는 되셨나요?"
16011-818-290-1 = "마침 경기가\n시작되려던 참입니다.\n함께 출발해 보실까요."
16011-818-300-1 = "꽤 분위기가 들떠 있군요."
16011-818-310-1 = "이정도면 황륜대제는\n성공적……이라고\n봐도 되겠지요."
16011-818-320-1 = "황륜대제도 막바지에\n접어들었군요."
16011-818-330-1 = "마지막까지\n힘내도록 하죠."
16011-818-340-1 = "선생님 덕분에\n황륜대제도 대성공을\n거둘 수 있었습니다."
16011-818-350-1 = "정말 수고\n많으셨습니다."
16011-818-360-1 = "서, 선생님……?"
16011-818-370-1 = "그, 그렇게\n쳐다 보셔도……."
16011-818-380-1 = "슬슬 출발해야 할\n시간입니다만……."
16011-818-390-1 = "뭔가 필요한 게\n있으신가요?"
16011-818-500-1 = "경기 기록을\n살펴보시겠습니까?"
16011-818-510-1 = "진행 상황을 정리해 보았습니다.\n확인해 보시겠습니까?"
16011-818-520-1 = "으음…… 지금 보여드릴 수\n있는 건 이게 전부입니다."
16011-818-530-1 = "더 확인하고 싶으신 게\n있으신 걸까요……?"
16011-818-540-1 = "확인했습니다.\n훌륭한 기록이네요."
16011-818-550-1 = "이건… 신기록일지도\n모르겠습니다."
