[translation]
10068-816-340-1 = "あっ、先生！\nこっちですよ！"
10068-816-350-1 = "自警団の\nスーパーヒーロー！"
10068-816-360-1 = "宇沢レイサ、\nご挨拶申し上げます！"
10068-816-370-1 = "おおおっ！\n盛り上がって\nまいりました！"
10068-816-380-1 = "ラストスパート！です！"
10068-816-390-1 = "最後まで、\n駆けぬけましょう！"
10068-816-400-1 = "はい！\n宇沢レイサ、\n待機中です！"
10068-816-410-1 = "どうかしましたか？\nいつでも\nお声がけください！"
10068-816-420-1 = "事件ですか！？\nどこですか！？\n誰の事ですか！？"
10068-816-430-1 = "んん……\nじっとしているのが、\n一番、難しいです……。"
10068-816-440-1 = "パトロール中に集めた物です！先生もご覧になりますか？"
10068-816-450-1 = "この仕事をしていると、\n落とし物をよく\n見かけるんですよね……"
10068-816-460-1 = "無事持ち主が\n見つかるといいんですが"
10068-816-470-1 = "他に何か必要なものは\nありますか？\n確認してまいります！"
10068-816-480-1 = "うん？何かお探しですか？"
10068-816-490-1 = "それはここには\nないものでしょうか？"
10068-816-500-1 = "必要な物が\nありましたら何なりと！"
10068-816-510-1 = "すぐにお持ちしますので！"
10068-816-520-1 = "ほお、なるほどなるほど。"
10068-816-530-1 = "んむ！\nそれもいいですね。"
10068-816-540-1 = "お探しのものは、\nそちらでしたか！"
10068-816-550-1 = "はい、こちらです、\nどうぞー！"
10068-816-560-1 = "あっ！\nこんにちは、先生！"
10068-816-570-1 = "解決しなきゃいけない\n事件が山積みです！"
10068-816-580-1 = "リストをご用意しました！\n一緒にチェックしていきましょう！"
10068-816-590-1 = "うん……？先生？\nどうしました？"
10068-816-600-1 = "集中！\n作業に集中してください！"
10068-816-610-1 = "おおー！\nさすが先生です！"
10068-816-620-1 = "いいですね！順調です！！"
