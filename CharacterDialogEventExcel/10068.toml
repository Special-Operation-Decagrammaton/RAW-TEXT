[translation]
10068-816-340-1 = "Oh, Sensei! Over here!"
10068-816-350-1 = "Here comes the superhero of the Vigilante Crew!"
10068-816-360-1 = "It is I, Uzawa Reisa! Hi!"
10068-816-370-1 = "Ooooh... Things are heating up!"
10068-816-380-1 = "The final sprint!"
10068-816-390-1 = "Let's keep trying our best until the very end!"
10068-816-400-1 = "That's right! Uzawa Reisa's here on standby!"
10068-816-410-1 = "What is it? Whatever it is, feel free to let me know!"
10068-816-420-1 = "There was an incident? Where?! Who's the culprit?!"
10068-816-430-1 = "Um... Being still is...really difficult for me..."
10068-816-440-1 = "I found some stuff on my patrol today! Lemme show you!"
10068-816-450-1 = "In this line of work...I see a lot of lost stuff."
10068-816-460-1 = "I sure hope they find their owners!"
10068-816-470-1 = "Is there anything you need more of? Lemme check and see what we've got!"
10068-816-480-1 = "Hm? What are you looking for?"
10068-816-490-1 = "Is it not here?"
10068-816-500-1 = "Okay! Just let me know if you need anything!"
10068-816-510-1 = "I'll go get it for you right away!"
10068-816-520-1 = "Oooh, I see, I see."
10068-816-530-1 = "Hm! Yep, that's good too!"
10068-816-540-1 = "So, that's what you needed?"
10068-816-550-1 = "Okay! Here it is!"
10068-816-560-1 = "Oh! Hey there, Sensei!"
10068-816-570-1 = "There's a whole mountain of things to do!"
10068-816-580-1 = "So...I made a list! Let's check everything off together."
10068-816-590-1 = "Huh? Sensei? What's wrong?"
10068-816-600-1 = "Concentrate! We gotta focus, okay?"
10068-816-610-1 = "Wow! I knew it, Sensei!"
10068-816-620-1 = "Nice! It's all going so well!"
