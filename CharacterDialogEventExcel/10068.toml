[translation]
10068-816-340-1 = "啊，老師！\n我在這邊唷！"
10068-816-350-1 = "自衛隊的超級英雄！"
10068-816-360-1 = "宇沢澪紗\n向你問好！"
10068-816-370-1 = "喔喔喔！\n熱鬧起來了！"
10068-816-380-1 = "最後衝刺！的說！"
10068-816-390-1 = "讓我們衝刺到\n最後一刻吧！"
10068-816-400-1 = "是！宇沢澪紗，\n待命中！"
10068-816-410-1 = "有什麼事嗎？\n請隨時告訴我！"
10068-816-420-1 = "是事件嗎！？\n在哪裡呢！？\n是誰的事呢！？"
10068-816-430-1 = "唔唔……\n乖乖待著\n是最難的……"
10068-816-440-1 = "這是巡邏中收集到的物品！\n老師也要過目一下嗎？"
10068-816-450-1 = "做這份工作，\n時常會看到遺失物呢……"
10068-816-460-1 = "希望失主能\n順利找到它們。"
10068-816-470-1 = "還有其他需要的東西嗎？\n我會去確認的！"
10068-816-480-1 = "嗯？在找什麼嗎？"
10068-816-490-1 = "是這裡沒有的東西嗎？"
10068-816-500-1 = "如果有任何需要\n的東西請儘管說！"
10068-816-510-1 = "我會馬上拿來的！"
10068-816-520-1 = "哦，原來如此原來如此。"
10068-816-530-1 = "嗯呣！\n那個也不錯呢。"
10068-816-540-1 = "在找的東西\n原來是那個啊！"
10068-816-550-1 = "來，在這裡，\n請收下～！"
10068-816-560-1 = "啊！你好，老師！"
10068-816-570-1 = "需要解決的事件\n堆積如山呢！"
10068-816-580-1 = "我準備了清單！\n一起確認吧！"
10068-816-590-1 = "嗯……？老師？\n怎麼了嗎？"
10068-816-600-1 = "專心！\n請專心在作業上！"
10068-816-610-1 = "喔喔～！\n不愧是老師！"
10068-816-620-1 = "真棒呢！很順利！！"
