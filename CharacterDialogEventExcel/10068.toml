[translation]
10068-816-340-1 = "อ๊ะ คุณครู! ทางนี้ค่ะ!"
10068-816-350-1 = "ซูเปอร์ฮีโร่\nแห่งกลุ่มรักษาความสงบ!"
10068-816-360-1 = "อุซาวะ เรอิสะ\nขอรายงานตัวค่ะ!"
10068-816-370-1 = "โอ๊สสสส-!\nกำลังร้อนแรงเลยค่ะ!"
10068-816-380-1 = "ใกล้จะถึงแล้วค่ะ!"
10068-816-390-1 = "วิ่งสุดใจ\nให้ถึงเส้นชัยเลย!"
10068-816-400-1 = "ค่ะ! อุซาวะ เรอิสะ\nกำลังรอคำสั่งค่ะ!"
10068-816-410-1 = "มีเรื่องอะไรเหรอคะ?\nบอกฉันได้ตลอดเลยค่ะ!"
10068-816-420-1 = "เกิดเหตุอะไรเหรอคะ??\nที่ไหนคะ!?\nใครก่อเรื่องคะเนี่ย!?"
10068-816-430-1 = "อืม...\nการอยู่เฉยๆ เนี่ย\nยากที่สุดเลยค่ะ..."
10068-816-440-1 = "มันเป็นของที่เก็บได้ตอนลาดตระเวนค่ะ\nคุณครูก็มาดูด้วยไหมคะ?"
10068-816-450-1 = "พอทำงานนี้ไปเรื่อยๆ\nก็ได้เจอของหายบ่อยๆ เลยค่ะ..."
10068-816-460-1 = "ฉันก็อยากตามหา\nเจ้าของให้หรอกนะคะ"
10068-816-470-1 = "แต่มีชิ้นไหนที่คุณครูอยากได้ไหมคะ?\nฉันจะไปเช็กมานะคะ!"
10068-816-480-1 = "หืม? หาอะไรเหรอคะ?"
10068-816-490-1 = "ที่อยากได้ไม่มีตรงนี้เหรอคะ?"
10068-816-500-1 = "ถ้ามีอะไรที่อยากได้\nก็บอกฉันได้เลยนะคะ!"
10068-816-510-1 = "ฉันจะเอามาให้ทันทีเลยค่ะ!"
10068-816-520-1 = "โอ้วว อันนั้นเหรอ"
10068-816-530-1 = "อืม! มันก็ดีเหมือนกันค่ะ"
10068-816-540-1 = "อยากได้อันนั้นเหรอคะ?"
10068-816-550-1 = "นี่ค่ะ รับไปเลยค่ะ~!"
10068-816-560-1 = "อ๊ะ! สวัสดีค่ะคุณครู!"
10068-816-570-1 = "มีเรื่องที่ฉันต้องคลี่คลาย\nเยอะเป็นภูเขาเลยค่ะ!"
10068-816-580-1 = "ฉันทำเป็นลิสต์ไว้แล้วค่ะ!\nไปเช็กด้วยกันเลยค่ะ!"
10068-816-590-1 = "หืม...? คุณครู?\nทำไมเป็นแบบนั้นล่ะคะ?"
10068-816-600-1 = "ตั้งใจหน่อยค่ะ!\nช่วยโฟกัสกับงานด้วยค่ะ!"
10068-816-610-1 = "โอ้ว!\nต้องอย่างนี้แหละคุณครู!"
10068-816-620-1 = "ดีเลยค่ะ!\nเรียบร้อยดีจังเลยค่ะ!!"
