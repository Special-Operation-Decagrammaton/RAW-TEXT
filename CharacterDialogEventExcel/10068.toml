[translation]
10068-816-340-1 = "아, 선생님! 이쪽입니다!"
10068-816-350-1 = "자경단의 슈퍼히어로!"
10068-816-360-1 = "우자와 레이사\n인사드립니다!"
10068-816-370-1 = "오오옷-!\n달아오르고 있습니다!"
10068-816-380-1 = "막판 스퍼-트! 입니다!"
10068-816-390-1 = "마지막까지,\n달려 나갑시다!"
10068-816-400-1 = "네! 우자와 레이사\n대기 중입니다!"
10068-816-410-1 = "무슨 일이세요?\n언제든지 말씀 해주세요!"
10068-816-420-1 = "사건인가요!?\n어디죠!?\n누구의 일이죠!?"
10068-816-430-1 = "으음…….\n가만히 있는 게\n제일 힘듭니다……."
10068-816-440-1 = "순찰 중에 모은 물건입니다!\n선생님도 보시겠어요?"
10068-816-450-1 = "이 일을 하다 보면,\n분실물을 자주 보게 되네요…."
10068-816-460-1 = "무사히 주인을\n찾았으면 좋겠습니다만"
10068-816-470-1 = "더 필요하신 것 있으신가요?\n확인하고 오겠습니다!"
10068-816-480-1 = "응? 뭘 찾으시나요?"
10068-816-490-1 = "그건 여기에는 없는 건가요?"
10068-816-500-1 = "필요한 게 있으면\n뭐든 말씀해 주세요!"
10068-816-510-1 = "바로 가져다드릴께요!"
10068-816-520-1 = "오호, 과연과연."
10068-816-530-1 = "음! 그것도 좋죠."
10068-816-540-1 = "그게 필요하셨군요?"
10068-816-550-1 = "자, 여기 있습니다~!"
10068-816-560-1 = "앗! 안녕하세요, 선생님!"
10068-816-570-1 = "해결해야 할 사건이\n산더미에요!"
10068-816-580-1 = "리스트를 준비해 두었습니다!\n함께 체크해 보시죠!"
10068-816-590-1 = "응……? 선생님?\n왜 그러시죠?"
10068-816-600-1 = "집중!\n작업에 집중해 주세요!"
10068-816-610-1 = "오오-!\n역시 선생님!"
10068-816-620-1 = "좋습니다! 순조롭군요!!"
