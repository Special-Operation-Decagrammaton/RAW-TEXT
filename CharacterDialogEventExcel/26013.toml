[translation]
26013-838-170-1 = "A festival by the beach... I've never experienced anything like this."
26013-838-180-1 = "Are you having fun, Sensei?"
26013-838-190-1 = "I hope nothing...interrupts the festival..."
26013-838-200-1 = "You don't experience this kind of excitement every day."
26013-838-210-1 = "The festival is almost over..."
26013-838-220-1 = "They say where there's a beginning, there's an end..."
26013-838-230-1 = "But it is a bit sad."
26013-838-240-1 = "The festival, it's over..."
26013-838-250-1 = "Still, it's okay. The sea is still beautiful."
26013-838-260-1 = "I can touch the sand, and follow the waves..."
26013-838-270-1 = "The sea is a joyful place."
26013-838-280-1 = "I think...the outdoor stage would be fun."
26013-838-290-1 = "Let's go watch it together, Sensei."
26013-838-300-1 = "I'm happy that everyone's here."
26013-838-310-1 = "Of course, you're included in \"everyone.\""
26013-838-320-1 = "Thank you for bringing me to the festival."
26013-838-330-1 = "I hope you have fun too."
26013-838-670-1 = "Hi, Sensei."
26013-838-680-1 = "Here. It's a list of chores."
26013-838-690-1 = "...It's a long list. Let's finish them one by one."
26013-838-700-1 = "Did you call me?"
26013-838-710-1 = "Heehee. Don't look at me, look next to you."
26013-838-720-1 = "Well done, Sensei."
26013-838-730-1 = "You're so diligent. It's making me enthusiastic too."
