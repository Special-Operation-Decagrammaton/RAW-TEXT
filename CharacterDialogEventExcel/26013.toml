[translation]
26013-838-170-1 = "海のお祭り…\nこんなの、はじめて。"
26013-838-180-1 = "先生、楽しんでる？"
26013-838-190-1 = "お祭りの間は、何も\n起こらないといいな…"
26013-838-200-1 = "こんなに楽しい時間、\nめったにないから。"
26013-838-210-1 = "お祭りはあと少しで…"
26013-838-220-1 = "はじまりがあれば終わりが\nある、っていうけど…"
26013-838-230-1 = "ちょっと、寂しいな。"
26013-838-240-1 = "お祭り、\n終わっちゃったね…"
26013-838-250-1 = "でも大丈夫だよ。海は、\n変わらずきれいだから。"
26013-838-260-1 = "砂に触れたり、\n波を追いかけたり…"
26013-838-270-1 = "海って、楽しいね。"
26013-838-280-1 = "野外ステージ…\n楽しそう。"
26013-838-290-1 = "先生、一緒に見に行こう。"
26013-838-300-1 = "みんなと一緒だから、\n楽しいんだと思う。"
26013-838-310-1 = "もちろん\n「みんな」の中には、\n先生もいるよ。"
26013-838-320-1 = "お祭りに\n連れてきてくれて、\nありがとう。"
26013-838-330-1 = "先生も、楽しんでね。"
26013-838-670-1 = "こんにちは、先生。"
26013-838-680-1 = "はい、これ、\nやることリストだよ。"
26013-838-690-1 = "…多いね。一つずつ、\n終わらせていこう。"
26013-838-700-1 = "呼んだ？"
26013-838-710-1 = "ふふ、私じゃなくて隣を見て。"
26013-838-720-1 = "お疲れ様、先生。"
26013-838-730-1 = "先生、頑張ってるね。\n私もやる気出てきた。"
