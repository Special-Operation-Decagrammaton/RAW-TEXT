[translation]
26013-838-170-1 = "งานเทศกาลริมทะเล...\nเพิ่งจะเคยเห็น... ครั้งแรกเลย"
26013-838-180-1 = "คุณครู กำลังสนุกอยู่หรือเปล่า?"
26013-838-190-1 = "ในช่วงงานเทศกาล หวังว่า\nจะไม่มีเรื่องอะไรเกิดขึ้นนะ..."
26013-838-200-1 = "เวลาที่สนุกแบบนี้\nไม่ได้มีบ่อยๆ นี่เนอะ"
26013-838-210-1 = "งานเทศกาลใกล้จะจบแล้วสินะ..."
26013-838-220-1 = "ว่ากันว่าถ้ามีจุดเริ่มต้น\nก็ย่อมมีจุดสิ้นสุด..."
26013-838-230-1 = "แต่ก็น่าเสียดายอยู่นะ"
26013-838-240-1 = "งานเทศกาลจบแล้ว..."
26013-838-250-1 = "แต่ก็ไม่เป็นไรหรอก\nยังไงทะเลก็ยังสวยเหมือนเดิม"
26013-838-260-1 = "ได้แตะทราย\nได้ไล่ตามคลื่น..."
26013-838-270-1 = "ทะเลนี่สนุกจังเลยนะ"
26013-838-280-1 = "การแสดงกลางแจ้ง...\nน่าจะสนุกนะ"
26013-838-290-1 = "คุณครู เราไปดูด้วยกันเถอะ"
26013-838-300-1 = "พออยู่กับทุกคนก็สนุกนะ"
26013-838-310-1 = "แน่นอนว่า 'ทุกคน' ที่ว่า\nก็มีคุณครูรวมอยู่ด้วยนะ"
26013-838-320-1 = "ขอบคุณที่พาฉันมางานเทศกาลนะ"
26013-838-330-1 = "คุณครูก็ต้องสนุกไปด้วยนะ"
26013-838-670-1 = "สวัสดี คุณครู"
26013-838-680-1 = "เอ้า นี่\nรายการงานที่ต้องทำน่ะ"
26013-838-690-1 = "เยอะจังเลย... มาทำทีละอย่างกันเถอะ"
26013-838-700-1 = "เรียกฉันเหรอ?"
26013-838-710-1 = "ฮุฮุ อย่ามองฉันสิ มองข้างๆ โน่น"
26013-838-720-1 = "ทำได้ดีมากเลยคุณครู"
26013-838-730-1 = "คุณครู ขยันจังเลย\nฉันเองก็ได้แรงบันดาลใจบ้างแล้วละ"
