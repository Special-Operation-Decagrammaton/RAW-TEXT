[translation]
26013-838-170-1 = "바다의 축제…\n이런 건, 처음이야."
26013-838-180-1 = "선생님, 즐기고 있어?"
26013-838-190-1 = "축제 동안에는, 아무 일도\n일어나지 않았으면 좋겠어…"
26013-838-200-1 = "이렇게 즐거운 시간,\n좀처럼 없으니까."
26013-838-210-1 = "축제가 끝나가네…"
26013-838-220-1 = "시작이 있으면\n끝이 있다고 하지만…"
26013-838-230-1 = "조금, 아쉽네."
26013-838-240-1 = "축제, 끝나버렸네…"
26013-838-250-1 = "그래도 괜찮아.\n바다는 여전히 아름다우니까."
26013-838-260-1 = "모래를 만지고,\n파도를 쫓고…"
26013-838-270-1 = "바다는 즐겁네."
26013-838-280-1 = "야외무대…\n재밌을 거 같아."
26013-838-290-1 = "선생님, 같이 보러 가자."
26013-838-300-1 = "모두와 함께 와서 즐거워."
26013-838-310-1 = "물론 '모두' 안에는\n선생님도 포함이야."
26013-838-320-1 = "축제에 데려와 줘서 고마워."
26013-838-330-1 = "선생님도 즐기도록 해."
26013-838-670-1 = "안녕, 선생님."
26013-838-680-1 = "자, 이거,\n할 일 목록이야."
26013-838-690-1 = "…많네. 하나씩 끝내보자."
26013-838-700-1 = "불렀어?"
26013-838-710-1 = "후후, 나 말고 옆을 봐."
26013-838-720-1 = "수고했어, 선생님."
26013-838-730-1 = "선생님, 열심히네.\n나도 의욕이 생겼어."
