[translation]
26013-838-170-1 = "海邊的慶典……\n我還是第一次參加。"
26013-838-180-1 = "老師，玩得開心嗎？"
26013-838-190-1 = "慶典期間，要是能\n平安無事就好了……"
26013-838-200-1 = "因為這麼愉快的時間，\n可是很稀有的。"
26013-838-210-1 = "慶典再一下就……"
26013-838-220-1 = "雖然說有開始就\n必然伴隨著結束……"
26013-838-230-1 = "還是有點遺憾呢。"
26013-838-240-1 = "慶典，結束了呢……"
26013-838-250-1 = "不過沒關係的。\n因為大海依舊很美麗。"
26013-838-260-1 = "能像這樣摸著沙子、\n追逐海浪……"
26013-838-270-1 = "大海真有趣呢。"
26013-838-280-1 = "野外舞台……\n好像很有趣。"
26013-838-290-1 = "老師，一起去看看吧。"
26013-838-300-1 = "因為是和大家一起，\n我覺得很開心。"
26013-838-310-1 = "當然「大家」之中\n也包含老師唷。"
26013-838-320-1 = "謝謝你帶我們\n來參加慶典。"
26013-838-330-1 = "老師也要好好享受哦。"
26013-838-670-1 = "你好，老師。"
26013-838-680-1 = "來，這給你，\n是待辦清單唷。"
26013-838-690-1 = "……真多呢。\n一樣一樣來解決吧。"
26013-838-700-1 = "你叫我嗎？"
26013-838-710-1 = "呵呵，要看的不是我是旁邊唷。"
26013-838-720-1 = "辛苦你了，老師。"
26013-838-730-1 = "老師，你很努力呢。\n連我也產生鬥志了。"
