[translation]
26006-802-290-1 = "哎呀，老師？\n你帶食物來了嗎！？"
26006-802-300-1 = "辛苦了！\n根據收到的支援物資，"
26006-802-310-1 = "我們也會\n準備些東西回報的！"
26006-802-320-1 = "慶典只剩下一半了呢。"
26006-802-330-1 = "……嘛，雖然本來就和我們\n沒有什麼關係。"
26006-802-340-1 = "伊凡．庫帕拉也\n沒剩多久了呢。"
26006-802-350-1 = "如果有什麼\n看起來很好吃，\n或是對這裡的生活有幫助的東西，"
26006-802-360-1 = "請務必拿來！"
26006-802-370-1 = "今天是最後一天，老師。\n有什麼東西忘了嗎？"
26006-802-380-1 = "慶典結束了，\n如果還有什麼東西的話，\n請一定要給我……！"
26006-802-390-1 = "227號特別班隨時都\n缺乏甜食啊……"
26006-802-400-1 = "何時才能\n回到本校舍呢……"
26006-802-410-1 = "啊……\n看起來很好吃……"
26006-802-420-1 = "咦？這，這個，\n可以給我嗎？"
26006-10802-290-1 = "哦，老師？\n你是不是帶了\n一些吃的東西？"
26006-10802-300-1 = "辛苦了！\n老師帶來的支援物資，"
26006-10802-310-1 = "我們也會\n準備些東西來報答的！"
26006-10802-320-1 = "慶典已經\n過了一半了呢。"
26006-10802-330-1 = "…那個，\n雖然一開始\n就是和我們不相干的事情。"
26006-10802-340-1 = "伊凡·庫帕拉\n也快要結束了呢。"
26006-10802-350-1 = "如果有看到\n覺得好吃的食物，\n或是對這裡的生活有幫助的東西，"
26006-10802-360-1 = "請務必帶來給我們！"
26006-10802-370-1 = "今天是慶典的最後一天呢。\n…老師，\n沒有遺漏掉什麼吧？"
26006-10802-380-1 = "雖然慶典結束了，\n但若是老師還有一些物品的話，\n請一定要帶給我！"
26006-10802-390-1 = "227號特別班\n無時無刻都缺乏甜食啊…"
26006-10802-400-1 = "什麼時候才能\n回到主校舍…。"
26006-10802-410-1 = "哇啊啊…\n看起來好好吃…"
26006-10802-420-1 = "什麼？這個東西\n我們真的可以收下嗎？"
