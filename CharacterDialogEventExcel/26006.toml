[translation]
26006-802-290-1 = "Oh, Sensei? Did you bring something to eat?"
26006-802-300-1 = "Thank you so much for the supplies!"
26006-802-310-1 = "We'll find some way to repay you!"
26006-802-320-1 = "The festival is already halfway over."
26006-802-330-1 = "Well, we don't have anything to do with it anyways..."
26006-802-340-1 = "Looks like Ivan Kupala will be over soon too."
26006-802-350-1 = "If you find anything else that might be delicious or useful..."
26006-802-360-1 = "Please bring it to us!"
26006-802-370-1 = "It's the last day of the festival, Sensei. Anything you're forgetting?"
26006-802-380-1 = "The festival is over, but we still need all the supplies we can get!"
26006-802-390-1 = "Spec Ops No. 227 is always low on sweets..."
26006-802-400-1 = "When do you think we can return to the main institute...?"
26006-802-410-1 = "Wow! That looks so tasty!"
26006-802-420-1 = "Can we really eat it?"
