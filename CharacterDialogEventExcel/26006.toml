[translation]
26006-802-290-1 = "เอ๋? คุณครูเหรอคะ?\nเตรียมพวกของกิน\nมาด้วยหรือเปล่าคะ?"
26006-802-300-1 = "ขอบคุณมากค่ะ!\nพวกเราจะตอบแทนคุณครู"
26006-802-310-1 = "ให้สมกับที่คุณครู\nนำของมาสนับสนุนพวกเราค่ะ"
26006-802-320-1 = "งานเทศกาล\nผ่านมาครึ่งทางแล้วนะคะ"
26006-802-330-1 = "คือว่าที่จริงแล้ว...\nถึงมันจะไม่ใช่เรื่องที่เกี่ยวกับ\nพวกฉันตั้งแต่แรกก็เถอะค่ะ"
26006-802-340-1 = "งานเทศกาลอีวาน คูปาลา\nเหลือเวลาอีกไม่มากแล้วค่ะ"
26006-802-350-1 = "ถ้าคุณครูมีอาหารที่ดูน่าอร่อย\nหรือว่าอุปกรณ์ สิ่งของที่จำเป็น\nสำหรับการใช้ชีวิตที่นี่ละก็..."
26006-802-360-1 = "รบกวนเอามาให้พวกเราด้วยนะคะ!"
26006-802-370-1 = "วันนี้เป็นวันสุดท้ายแล้ว\nคุณครู... ไม่ได้ลืมอะไรใช่มั้ยคะ?"
26006-802-380-1 = "ถึงงานเทศกาลจะสิ้นสุดลงแล้ว\nแต่ถ้าคุณครูยังมีของใช้เหลืออยู่ละก็\nนำมาแลกที่ฉันได้เลยนะคะ!"
26006-802-390-1 = "ที่ห้องพิเศษ 227 น่ะ\nมีของหวานไม่พอตลอดเลยค่ะ..."
26006-802-400-1 = "เมื่อไหร่จะได้กลับไป\nที่อาคารเรียนหลักกันนะ..."
26006-802-410-1 = "ว้าว...\nน่ากินจังเลย..."
26006-802-420-1 = "คะ? พูดจริงเหรอคะ?\nฉันรับไว้ได้จริงๆ เหรอคะ?"
26006-10802-290-1 = "เอ๋? คุณครูเหรอคะ?\nเตรียมพวกของกิน\nมาด้วยรึเปล่าคะ?"
