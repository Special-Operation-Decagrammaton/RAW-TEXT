[translation]
26006-802-290-1 = "어라, 선생님?\n뭔가 먹을 것을\n가지고 오셨나요?"
26006-802-300-1 = "수고하셨습니다!\n가져다주신 지원 물자만큼"
26006-802-310-1 = "저희도 뭔가\n보답을 드릴게요!"
26006-802-320-1 = "축제도 벌써\n절반이나 지났네요."
26006-802-330-1 = "……뭐, 애초에\n저희와는 상관없는\n일이지만요."
26006-802-340-1 = "이반 쿠팔라도\n이제 얼마 남지 않았네요."
26006-802-350-1 = "뭔가 맛있어 보이는 음식이나,\n이곳에서의 생활에 도움이\n될 만한 물건이 있다면"
26006-802-360-1 = "꼭 가져다주세요!"
26006-802-370-1 = "오늘이 축제의 마지막 날이네요.\n…선생님,\n뭔가 잊으신 건 없으신가요?"
26006-802-380-1 = "축제는 끝났지만, 혹시 아직도\n갖고 계신 물건이 있다면\n저에게 꼭 가져다주세요!"
26006-802-390-1 = "227호 특별반은 언제나\n단 음식이 부족하단 말이죠……"
26006-802-400-1 = "언제쯤에야\n본교사로 돌아갈 수 있을지…."
26006-802-410-1 = "우와아……\n맛있어 보여……"
26006-802-420-1 = "네? 이거, 정말로\n받아도 괜찮나요?"
