[translation]
26006-802-290-1 = "あれ、先生？\n何か食べ物を持って\nきてくれたんですか！？"
26006-802-300-1 = "お疲れ様です！\n頂いた支援物資に応じて、"
26006-802-310-1 = "私たちからも\n何かお返しをしますね！"
26006-802-320-1 = "お祭りも、残すところ\n半分くらいになって\nしまいましたね。"
26006-802-330-1 = "……まあ、もともと私たちには\nほとんど関係無いのですが。"
26006-802-340-1 = "イワン・クパーラも\nもう残り僅かですね。"
26006-802-350-1 = "何か美味しそうなものや、\nここでの生活に役立ちそうな\nものがありましたら"
26006-802-360-1 = "ぜひ持ってきて\nいただけますと！"
26006-802-370-1 = "今日が最終日ですね、先生。\n何か忘れ物はありませんか？"
26006-802-380-1 = "お祭りは終わりましたが、もし\nまだ何か持っていたら、\nぜひ私にください……！"
26006-802-390-1 = "227号特別クラスには、\nいつも甘い物が\n足りなくって……。"
26006-802-400-1 = "いつになったら、\n本校舎に帰れるのかな……。"
26006-802-410-1 = "あっ……\n美味しそう……。"
26006-802-420-1 = "えっ？こ、これ、\n貰っても良いんですか？"
