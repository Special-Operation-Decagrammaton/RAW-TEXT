[translation]
10121-847-10-1 = "ご覧ください先生！\n海ですの、海っ！"
10121-847-20-1 = "ふふん～♪蒼は～\n水に入りて流るる～"
10121-847-30-1 = "まさに、海！ですの！"
10121-847-40-1 = "先輩方と同じ\n舞台で競う日が\n来るなんて……。"
10121-847-50-1 = "で、でもこの百花繚乱の\nえり～とであり、\n希望の星である身共は！"
10121-847-60-1 = "そう簡単に引き下がる\nわけには参りませんわ！"
10121-847-70-1 = "待望の……\nくらいまっくす！\nですの！"
10121-847-80-1 = "ど、どうしましょう先生！\n身共、あまりの緊張に\n手が震えてきましたの！"
10121-847-90-1 = "この短い期間で、先輩方の\n雰囲気が変わったように\n感じますわ。"
10121-847-100-1 = "しかし皆さん、\nどんな時よりも\n輝いておりますの！"
10121-847-110-1 = "……キキョウ先輩と\nレンゲ先輩は昔からの\n知り合いなのです。"
10121-847-120-1 = "幼馴染、\nというやつですわ。"
10121-847-130-1 = "お二人にはきっと、"
10121-847-140-1 = "身共の知らない\n思い出がたくさん\nあるのでしょうね。"
10121-847-150-1 = "そう考えると、\nなんだか少しさみしい\n気がします……。"
10121-847-160-1 = "先生？どうして\nそんなにじっと……？"
10121-847-170-1 = "よかったら、身共と\n遊びに行きませんか！？"
10121-847-180-1 = "ふふっ、\n先生ったらもう。"
10121-847-190-1 = "見学したいと\n仰るのなら、\n身共もご一緒しますわ。"
10121-847-200-1 = "皆さんなんだか、\n海に慣れている\nみたいですの。"
10121-847-210-1 = "もしかして身共だけ、\n海びぎなー\n……でしょうか！？"
10121-847-460-1 = "わあ！不思議な物が\nいっぱいありますの！"
10121-847-470-1 = "先生、\nどれからご覧になりますか？"
10121-847-480-1 = "彩り豊かで見ていて\n飽きませんわ！\nドキドキしますの～！"
10121-847-490-1 = "あぁ……楽しい時間は\nあっという間ですの……"
10121-847-500-1 = "でも、しょんぼりした\n気持ちは、帰る前に全部\n振り払ってしまいますわ！"
10121-847-510-1 = "身共も知っています！\nこれがうぃんどーしょっぴんぐ、\nですの！"
10121-847-520-1 = "ふふっ、心配はいりません。\n身共はいつも傍におりますわ。"
10121-847-530-1 = "わあっ！\n身共も近くで見たいですわ！"
10121-847-540-1 = "ふむ、先生はそのような\nご趣味なのですね？"
10121-847-550-1 = "お目が高いっ！ですわ♪"
10121-847-560-1 = "ふんふふん～\n何にしようかな～♪"
