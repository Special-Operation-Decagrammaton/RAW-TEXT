[translation]
10121-847-10-1 = "Look, Sensei! The beach! It's the beach!"
10121-847-20-1 = "Heehee! The expanse of blue water is endless! ♪"
10121-847-30-1 = "It's the beach!"
10121-847-40-1 = "I did not anticipate that the day I would be in competition against my seniors would arrive in this way..."
10121-847-50-1 = "H-However, as a promising elite and the Hyakkaryouran's rising hope..."
10121-847-60-1 = "...I shall not readily back down!"
10121-847-70-1 = "It's the climax we have anticipated!"
10121-847-80-1 = "What am I to do, Sensei? My hands are shaking with nerves!"
10121-847-90-1 = "So quickly did the atmosphere amongst my seniors shift..."
10121-847-100-1 = "But it's only made them shine ever brighter!"
10121-847-110-1 = "...Kikyou and Renge have known each other for a long time."
10121-847-120-1 = "They're childhood friends."
10121-847-130-1 = "Undoubtedly, the two of them..."
10121-847-140-1 = "...share many stories in which I play no part."
10121-847-150-1 = "That thought elicits a feeling of loneliness in me..."
10121-847-160-1 = "Sensei? Why are you staring at me like that?"
10121-847-170-1 = "Rather than sitting idly by, let us venture out for some fun!"
10121-847-180-1 = "Fufu. I'm serious, Sensei."
10121-847-190-1 = "If you prefer to simply sit and watch, then I will join you."
10121-847-200-1 = "It would appear everyone is well accustomed to the sea."
10121-847-210-1 = "Perhaps I am the only sea novice?! Is that it?!"
10121-847-460-1 = "Whoa! Over here! Over there! Everything is new!"
10121-847-470-1 = "Sensei, what should we see first?!"
10121-847-480-1 = "My heart is aflutter! It's so sparkly that I need only look to find new amusements!"
10121-847-490-1 = "Ahhh. Fun times truly pass in the mere blink of an eye!"
10121-847-500-1 = "Be sure to leave all our regrets here before we return!"
10121-847-510-1 = "I know of this! Yes, yes, it's called \"window shopping,\" correct?"
10121-847-520-1 = "Heehee, worry not. I will always be by your side!"
10121-847-530-1 = "Wow! I would like to see it more closely as well!"
10121-847-540-1 = "Heh, so this is the kind of thing you like, Sensei?"
10121-847-550-1 = "Honored guest, you have good taste! ♪"
10121-847-560-1 = "Hmm! What to choose... ♪"
