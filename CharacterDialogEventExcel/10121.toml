[translation]
10121-847-10-1 = "您請看，老師！\n是大海呢，大海！"
10121-847-20-1 = "哼哼～♪ 蒼藍～\n匯入水中流淌無盡～"
10121-847-30-1 = "正是大海！的說！"
10121-847-40-1 = "沒想到會有跟前輩們\n同台較勁的這天……"
10121-847-50-1 = "不，不過身為\n百花繚亂的菁～英\n和希望之星的小女子！"
10121-847-60-1 = "可不會這麼輕易\n就退讓的！"
10121-847-70-1 = "是期待已久的……\n高潮時刻！的說！"
10121-847-80-1 = "怎，怎麼辦，老師！\n小女子因為太緊張的\n關係，手都在發抖了！"
10121-847-90-1 = "在這短短的時間裡，\n感覺前輩們的氣氛\n似乎變了呢。"
10121-847-100-1 = "但是大家，\n都比任何時候\n更加閃耀！"
10121-847-110-1 = "……桔梗前輩和\n蓮華前輩從很久以前\n就認識了。"
10121-847-120-1 = "也就是所謂的\n青梅竹馬。"
10121-847-130-1 = "他們兩位想必……"
10121-847-140-1 = "有著許多小女子\n不知道的回憶吧。"
10121-847-150-1 = "這麼一想，\n總覺得有點寂寞……"
10121-847-160-1 = "老師？為何這樣\n一直盯著……？"
10121-847-170-1 = "方便的話，要不要\n跟小女子一起去玩呢！？"
10121-847-180-1 = "呵呵，老師真是的。"
10121-847-190-1 = "如果您說想去\n見學的話，小女子\n也會陪同的。"
10121-847-200-1 = "總覺得大家，好像\n都很習慣大海呢。"
10121-847-210-1 = "難道只有小女子是\n海邊新手……嗎！？"
10121-847-460-1 = "哇！有好多神奇的東西！"
10121-847-470-1 = "老師，您想先看哪一個呢？"
10121-847-480-1 = "繽紛的色彩完全看不膩呢！\n真令人興奮～！"
10121-847-490-1 = "啊啊……快樂的時光\n真是轉瞬即逝……"
10121-847-500-1 = "不過，這些失落的心情，\n會在回去之前全部拋開的！"
10121-847-510-1 = "小女子也知道！\n這就是Window Shopping對吧！"
10121-847-520-1 = "呵呵，不必擔心。\n小女子隨時在您身旁。"
10121-847-530-1 = "哇啊！\n小女子也想近距離看看！"
10121-847-540-1 = "呼呣，老師原來\n有這樣的興趣嗎？"
10121-847-550-1 = "真有眼光！的說♪"
10121-847-560-1 = "哼～哼哼～\n該選哪個好呢～♪"
