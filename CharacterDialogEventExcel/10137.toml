[translation]
10137-856-10-1 = "สึจิ! โนโกะ!\nอยู่ไหน! น่ะ!"
10137-856-20-1 = "เฮอะ ถ้าจับได้ ฉันเอาตาย..."
10137-856-30-1 = "ดะ... เดี๋ยวก่อนสิ! อยู่ที่ไหนน่ะ?!"
10137-856-30-2 = "อึก... น่ากลัว..."
10137-856-40-1 = "คงไม่มีมีใครมาก่อกวน...\nเฮือก?! คะ... ใครน่ะ...?"
10137-856-50-1 = "ต่อให้เป็นผีหรืออะไรก็ช่าง\nถ้าจับใส่กุญแจมือก็จบเห่...!"
10137-856-60-1 = "ผ่านไปได้ด้วยดีค่ะ!\nโชคชะตา เข้ามาเลย!!\nฮ่าฮ่าฮ่า!!"
10137-856-70-1 = "มะ... ไม่สิ!! ถะ... ถอนคำพูด!!\nขอโทษค่ะ คุณโชคชะตา!!!"
10137-856-80-1 = "ฮะ... เฮือก?!\nโธ่... ตกใจหมดเลย!!"
10137-856-90-1 = "ฮู่ว... แต่ยังไง\nอากาศก็ดีมากเลยนะคะ"
10137-856-100-1 = "สึจิโนโกะ! ถ้าจับตัวได้\nฉันไม่มีวันปล่อยไปแน่ค่ะ!"
10137-856-110-1 = "ตะ... ต้องสุขุม...\nสุขุม..."
10137-856-430-1 = "ไปกันเลย!! ทุ่มสุดตัวกันเลยค่ะ!!"
10137-856-440-1 = "วันนี้ดวงดีมั้ยคะ?!\nฉันจะเชื่อใจคุณครูค่ะ!"
10137-856-450-1 = "ได้เวลาปิดจ๊อบ!\nสู้ต่อให้ถึงที่สุดนะคะ!"
10137-856-460-1 = "จะแบ่งดวงให้เหรอคะ?\nดีเลย!!"
10137-856-470-1 = "ยังไงก็จะผ่านไปได้ด้วยดีค่ะ!\nก็ฉันอยู่กับคุณครูนี่คะ!"
10137-856-480-1 = "อึก! อันนี้แหละ!"
10137-856-490-1 = "ดวงดีมากเลยนะคะ!\nคุณครู ไม่ธรรมดาเลยค่ะ!"
10137-856-500-1 = "อยากให้เป็นแบบนี้ทุกวันจังค่ะ~"
10137-856-510-1 = "ก่อนอื่นฉันจะลองหาให้ถึงที่สุดค่ะ!"
