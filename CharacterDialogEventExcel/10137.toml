[translation]
10137-856-10-1 = "ツチノコやーい！\nどこだー！？"
10137-856-20-1 = "捕まえたらた\nだじゃおかな……"
10137-856-30-1 = "い、いや！でてこーい！"
10137-856-30-2 = "ううっ……怖っ……。"
10137-856-40-1 = "なんでこんな嫌がらせ\nみたいな――ひっ！？\nだっ、誰……？"
10137-856-50-1 = "お化けだろうが手錠を\nかけられるなら……！"
10137-856-60-1 = "無事終わったっすね！運命\nなんてちょろいもんっす！\nはっはっはっ――"
10137-856-70-1 = "い、いや！今のなし！\nちょろくないっす！\nごめんなさい！！"
10137-856-80-1 = "ひ、ひゃっ！？……って、\nビックリした！"
10137-856-90-1 = "ふぅ……ここ、空気だけは\n美味しいんすよね。"
10137-856-100-1 = "ツチノコー！捕まえたら\n絶対に逃がさないっす！"
10137-856-110-1 = "平常心……平常心……。"
10137-856-430-1 = "さあ！\nどんどんいくっすよ！！"
10137-856-440-1 = "今日の占いはどうでした？\n先生の運勢を\n信じてますよ！"
10137-856-450-1 = "後片づけタイム！\n最後まで気張ってくっすよ！"
10137-856-460-1 = "運勢、\n分けてくれるんすか？\nやったぁ！"
10137-856-470-1 = "先生と一緒だし\nなんとかなるっす！"
10137-856-480-1 = "くぅー！これこれ！"
10137-856-490-1 = "すっごいツイてますね！？\n先生、マジパないっす！"
10137-856-500-1 = "毎日こうならいいんすけどね～"
10137-856-510-1 = "一応、最後まで調べて\nみるっすよ！"
