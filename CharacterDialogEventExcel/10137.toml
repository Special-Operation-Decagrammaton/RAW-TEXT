[translation]
10137-10 = "สึจิ! โนโกะ!\nอยู่ไหน! น่ะ!"
10137-20 = "เฮอะ ถ้าจับได้ ฉันเอาตาย..."
10137-30 = "อึก... น่ากลัวจัง..."
10137-40 = "คงไม่มีมีใครมาก่อกวน...\nเฮือก?! คะ... ใครน่ะ...?"
10137-50 = "ต่อให้เป็นผีหรืออะไรก็ช่าง\nถ้าจับใส่กุญแจมือก็จบเห่...!"
10137-60 = "ผ่านไปได้ด้วยดีค่ะ!\nโชคชะตา เข้ามาเลย!!\nฮ่าฮ่าฮ่า!!"
10137-70 = "มะ... ไม่สิ!! ถะ... ถอนคำพูด!!\nขอโทษค่ะ คุณโชคชะตา!!!"
10137-80 = "― [log=아카네 교복]เป็นเรื่องที่น่าอาย[/log]"
10137-90 = "[wa:1530]― [log=아카네 교복]การซื่อสัตย์[wa:2200]กับความรู้สึกของตัวเอง[/log]"
10137-100 = "― [log=아카네 교복]ทำให้เราเองก็ยังต้องแปลกใจ[wa:1100]อยู่เสมอเลยเลยนะคะ[/log]"
10137-110 = "[wa:520]― [log=아카네 교복]ค่ะ [wa:1050]เป็นอย่างที่คุณครูว่าเลยค่ะ[/log]"
10137-430 = "ไปกันเลย!! ทุ่มสุดตัวกันเลยค่ะ!!"
10137-440 = "วันนี้ดวงดีมั้ยคะ?!\nฉันจะเชื่อใจคุณครูค่ะ!"
10137-450 = "ได้เวลาปิดจ๊อบ!\nสู้ต่อให้ถึงที่สุดนะคะ!"
10137-460 = "จะแบ่งดวงให้เหรอคะ?\nดีละ!!"
10137-470 = "ยังไงก็จะผ่านไปได้ด้วยดีค่ะ!\nก็ฉันอยู่กับคุณครูนี่คะ!"
10137-480 = "อึก! อันนี้แหละ!"
10137-490 = "ดวงดีมากเลยนะคะ!\nคุณครู ไม่ธรรมดาเลยค่ะ!"
10137-500 = "อยากให้เป็นแบบนี้ทุกวันจังค่ะ~"
10137-510 = "ก่อนอื่นฉันจะลองหาให้ถึงที่สุดค่ะ!"
