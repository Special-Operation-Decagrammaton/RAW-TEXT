[translation]
10137-10 = "槌之子～！\n在哪～裡～！"
10137-20 = "被我抓到你就死定了……\n 不，不對！ 給我出來～！"
10137-30 = "嗚嗚……好可怕……"
10137-40 = "為什麼要做這種──咦！？ \n是，是誰……？"
10137-50 = "不管是鬼還是什麼，\n只要銬上手銬的話……！"
10137-60 = "順利結束了呢！ \n 命運什麼的，看我輕鬆顛覆！！\n哈哈哈！！"
10137-70 = "不，不是！！ 剛才的不算！！\n 並不輕鬆！！對不起！！"
10137-80 = "嘻，嘻呀！？\n……嚇死我了！！"
10137-90 = "呼……\n這裡只有空氣是新鮮的呢。"
10137-100 = "槌之子～！被我抓到就\n絕對不會再讓你逃走了！"
10137-110 = "平常心……\n平常心……"
10137-430 = "來吧！！我們一路向前衝！！"
10137-440 = "今天的占卜結果怎麼樣？\n我就指望老師的運勢了哦！"
10137-450 = "收尾時間！\n  要努力堅持到最後哦！"
10137-460 = "要把運氣分給我嗎？\n太棒了！！"
10137-470 = "畢竟是和老師一起，\n一定沒問題的！"
10137-480 = "嗯──！ 就是這個！"
10137-490 = "運氣超好的耶！？\n不愧是老師，超扯的！"
10137-500 = "要是每天都這樣就好了～"
10137-510 = "總之先調查到最後看看吧！"
