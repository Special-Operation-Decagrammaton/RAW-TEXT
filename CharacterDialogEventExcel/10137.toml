[translation]
10137-856-10-1 = "槌之子啊～！\n你在哪裡～！？"
10137-856-20-1 = "被我抓到可不會\n輕易放過……"
10137-856-30-1 = "不，不對！快出來～！"
10137-856-30-2 = "嗚嗚……好可怕……"
10137-856-40-1 = "為什麼要做這種\n討人厭的──噫！？\n是，是誰……？"
10137-856-50-1 = "不管是鬼還是什麼，\n只要銬上手銬的話……！"
10137-856-60-1 = "順利結束了呢！\n命運什麼的輕鬆搞定！！\n哈哈哈──"
10137-856-70-1 = "不，不是！！剛才的不算！！\n並不輕鬆！！對不起！！"
10137-856-80-1 = "噫，噫呀！？\n……嚇死我了！"
10137-856-90-1 = "呼……這裡只有\n空氣是新鮮的呢。"
10137-856-100-1 = "槌之子～！被我抓到就\n絕對不會再讓你逃走了！"
10137-856-110-1 = "平常心……\n平常心……"
10137-856-430-1 = "來！一路向前衝吧！！"
10137-856-440-1 = "今天的占卜結果怎麼樣？\n我就指望老師的運勢囉！"
10137-856-450-1 = "收尾時間！\n要努力堅持到最後哦！"
10137-856-460-1 = "要把運氣分給我嗎？\n好耶！！"
10137-856-470-1 = "畢竟是和老師一起，\n肯定有辦法的！"
10137-856-480-1 = "嗯──！就是這個！"
10137-856-490-1 = "運氣超好的耶！？\n老師，你真厲害！"
10137-856-500-1 = "要是每天都這樣就好了～"
10137-856-510-1 = "總之先調查到最後看看吧！"
