[translation]
10137-856-10-1 = "츠치노-코야아-!\n어딨-니-!"
10137-856-20-1 = "하아, 넌 잡히면 죽…… "
10137-856-30-1 = "아, 아니! 어딨-니-!"
10137-856-30-2 = "으으……. 무서운데……."
10137-856-40-1 = "누가 해코지라도\n하는 건-- 히익?!\n누, 누구우……?"
10137-856-50-1 = "귀신이건 뭐건,\n수갑 채우면 땡이지……!"
10137-856-60-1 = "무사히 넘어갔슴다!\n운명아, 덤벼라!!\n핫핫하!!"
10137-856-70-1 = "아, 아니!! 취, 취소!!\n미안합니다, 운명님!!!"
10137-856-80-1 = "히, 히얏?!\n……아이, 깜짝이야!!"
10137-856-90-1 = "휴…… 그래도 공기는\n무지 좋슴다."
10137-856-100-1 = "츠치노코-! 잡으면 평생\n안 놔줄 검다!"
10137-856-110-1 = "펴, 평정심……\n평정심……."
10137-856-430-1 = "가자!! 팍팍 가보는 검다!!"
10137-856-440-1 = "오늘 운세 좋으셨슴까?!\n선생님만 믿겠슴다!"
10137-856-450-1 = "뒷정리 타임!\n끝까지 힘내는 검다!"
10137-856-460-1 = "운 나눠주시는 검까?\n좋아쓰!!"
10137-856-470-1 = "뭐라도 될 검다!\n선생님하고 함께니까!"
10137-856-480-1 = "크으! 이거거든!"
10137-856-490-1 = "엄청 운 좋네요?!\n선생님, 장난 아니심다!"
10137-856-500-1 = "맨날 이러면 좋겠슴다~"
10137-856-510-1 = "일단, 끝까지 찾아보는 검다!"
