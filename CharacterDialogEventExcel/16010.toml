[translation]
16010-817-340-1 = "พอแต่งตัวแบบนี้...\nมันดูน่าอายนิดหน่อย..."
16010-817-350-1 = "แต่เพื่อความสำเร็จ\nของ <ฮาโลเฟสติวัล> แล้ว..."
16010-817-360-1 = "ฮุฮุ หวังว่าจะเป็น\nเทศกาลที่สนุกนะ"
16010-817-370-1 = "(ไม่ว่าจะฝึกแค่ไหน\nแต่ก็ยังไม่ชินกับ\nเชียร์ลีดเดอร์เท่าไรเลย...)"
16010-817-380-1 = "<ฮาโลเฟสติวัล> น่าจะ\nเตรียมใกล้เสร็จหมดแล้ว\nมาออกแรงสู้... อีกนิดเถอะ"
16010-817-390-1 = "ขอบคุณที่ช่วยนะ\nคุณครู"
16010-817-400-1 = "แล้วพวกฉันจะเชียร์\nในการแข่งกีฬานี้นะ"
16010-817-410-1 = "สะ... สู้ๆ\nสู้เขานะ... คุณครู...!"
16010-817-420-1 = "ชุดนี้ฉันทำขึ้นเอง...\nแต่คนอื่นจะคิดว่า\nมันมากไปมั้ยนะ..."
16010-817-430-1 = "รู้สึกกังวลเรื่อง\nหางของฉันเหรอ...?"
16010-817-440-1 = "จะให้พูดตอนนี้...\nก็ยังไงๆ อยู่..."
16010-817-450-1 = "ไว้ฉันจะแอบไป\nแก้ชุดให้ใหม่นะ..."
16010-817-460-1 = "ความปรารถนาของฉัน\nคือแพชชั่นที่แรงกล้า..."
16010-817-470-1 = "เข้ามาสิคุณครู ฉันเตรียมของ\nที่จำเป็นของฮาโลเฟสติวัลอยู่"
16010-817-480-1 = "ช่วยเอาของจำเป็นของ\nฮาโลเฟสติวัลไว้ทางนี้ให้ทีนะ"
16010-817-490-1 = "ทำได้ดีมากคุณครู ถ้ามีของอะไร\nเหลืออีก ฉันจะเอาไปแลกให้นะ"
16010-817-500-1 = "หืม?\nมีเรื่องอะไรเหรอ?"
16010-817-510-1 = "เอ่อ... ถ้าเป็นเรื่องเชียร์\nฉันจะทำให้ทีหลัง คือว่าตอนนี้มัน..."
16010-817-520-1 = "อื้ม ของชิ้นนี้ดีเลย\nขอบคุณที่ช่วยนะ"
16010-817-530-1 = "ของตอบแทนเล็ก ๆ น้อย ๆ น่ะ...\nตอบแทนที่มาช่วยกัน ช่วยรับไว้หน่อยนะ"
16010-817-540-1 = "ถ้าเป็นอันนี้ละก็...\nทุกคนต้องชอบแน่ๆ"
16010-817-550-1 = "ช่วยได้มากเลยละ\nขอบคุณนะคุณครู"
