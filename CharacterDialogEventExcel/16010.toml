[translation]
16010-817-340-1 = "這個樣子，\n有點不習慣呢…"
16010-817-350-1 = "但如果是為了\n「晄輪大祭」的成功…"
16010-817-360-1 = "呵呵，\n希望會是一場\n歡樂的慶典。"
16010-817-370-1 = "（不管練習多少次，\n都不太習慣當應援團…）"
16010-817-380-1 = "「晄輪大祭」的準備\n快告一段落了。\n還剩一點…再加把勁吧。"
16010-817-390-1 = "謝謝你幫忙，\n老師。"
16010-817-400-1 = "在慶典正式開始時，\n也請享受我們的應援吧。"
16010-817-410-1 = "加，加油，\n加油…！老師！"
16010-817-420-1 = "雖然是我做的衣服…\n但大家…都不在意嗎…"
16010-817-430-1 = "你說你很在意\n這件衣服的尾巴附近…？"
16010-817-440-1 = "雖然現在…\n不能說…"
16010-817-450-1 = "但之後，\n會偷偷告訴你構造…"
16010-817-460-1 = "燃燒熱情…\n果然很浪漫呢。"
16010-817-470-1 = "老師，歡迎光臨。\n我正在收集\n「晄輪大祭」需要的東西。"
16010-817-480-1 = "請把「晄輪大祭」\n需要的物資帶回這裡。"
16010-817-490-1 = "辛苦了，老師。\n如果有剩餘的物資，\n我可以幫你兌換。"
16010-817-500-1 = "嗯？怎麼了？"
16010-817-510-1 = "那個…之後再為你應援。\n現在有點…"
16010-817-520-1 = "嗯，真是好東西啊。\n謝謝你的幫忙。"
16010-817-530-1 = "雖然不成敬意…\n但謝謝你的幫助。\n希望你能收下。"
16010-817-540-1 = "這樣的話…我想大家都會高興的。"
16010-817-550-1 = "幫大忙了唷。\n謝謝你，老師。"
