[translation]
16010-817-340-1 = "この格好、ちょっと\n慣れないけど…"
16010-817-350-1 = "でも「晄輪大祭」が\n成功するためなら…"
16010-817-360-1 = "ふふ、楽しい\nお祭りになると良いね。"
16010-817-370-1 = "（チアリーディング、\nどれだけ練習しても\nあんまり慣れない…）"
16010-817-380-1 = "「晄輪大祭」の準備も\nほとんど終わったみたい。\nあともう少し…頑張ろう。"
16010-817-390-1 = "手伝ってくれて\nありがとう、先生。"
16010-817-400-1 = "本祭でも私たちの\n応援を楽しんでね。"
16010-817-410-1 = "が、頑張れ、\n頑張れ…！先生！"
16010-817-420-1 = "私が作った服だけど…\nみんな…あんまり\n気にしてないのかな…"
16010-817-430-1 = "この服のしっぽの\n辺りが気になるって…？"
16010-817-440-1 = "今は…ちょっと\n言えないけど…"
16010-817-450-1 = "後でこっそり、\n構造を教えてあげる…"
16010-817-460-1 = "やっぱり情熱を\n燃やすのは…\nロマンだね。"
16010-817-470-1 = "先生、いらっしゃい。\n「晄輪大祭」の準備に必要な\n資材を集めていたところ。"
16010-817-480-1 = "「晄輪大祭」の準備に\n必要な物資は、\nここに持ってきてね。"
16010-817-490-1 = "お疲れさま、先生。\nもし残った物資があったら、\n私が交換してあげる。"
16010-817-500-1 = "ん？どうしたの？"
16010-817-510-1 = "あの…応援なら後でしてあげる。\n今はちょっと…"
16010-817-520-1 = "うん、良いものだね。\n手伝ってくれてありがとう。"
16010-817-530-1 = "ささやかだけど…\n手伝ってくれたお礼。\n受けとってほしい。"
16010-817-540-1 = "これなら…みんな喜ぶと思う。"
16010-817-550-1 = "すごく役に立ったよ。\nありがとう、先生。"
