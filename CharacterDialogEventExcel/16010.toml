[translation]
16010-817-340-1 = "Dressing like this is a bit..."
16010-817-350-1 = "I just need to keep in mind that this outfit is for the sake of the Kivotos Halo Festival..."
16010-817-360-1 = "Heehee. I'm looking forward to a fun festival."
16010-817-370-1 = "(I can't seem to get comfortable with cheerleading no matter how much I practice...)"
16010-817-380-1 = "Preparations for the Kivotos Halo Festival are almost set. Just one last push..."
16010-817-390-1 = "Thank you for all your help, Sensei."
16010-817-400-1 = "Whatever happens, our cheers won't let you down."
16010-817-410-1 = "S-Sensei! Sensei! You're o-our star! Time for g-gunplay... We'll go far!"
16010-817-420-1 = "I did make the outfit, but...maybe... Do people...not like it?"
16010-817-430-1 = "...The back?"
16010-817-440-1 = "Hmm... Not now."
16010-817-450-1 = "But I'll explain more later..."
16010-817-460-1 = "I always knew that romance...is what sets passion alight."
16010-817-470-1 = "Welcome, Sensei. For now, we need to gather supplies needed for the Kivotos Halo Festival."
16010-817-480-1 = "Anything we need for the Kivotos Halo Festival should be brought here."
16010-817-490-1 = "Thank you, Sensei. If you have anything left over, I can exchange it for you."
16010-817-500-1 = "Hm? What's the matter?"
16010-817-510-1 = "Cheering... I'll cheer for you later, I promise. Right now I'm still a bit..."
16010-817-520-1 = "Good job. Thank you for helping."
16010-817-530-1 = "It's just a small token of my appreciation. I hope you like it."
16010-817-540-1 = "This... Anyone would love this."
16010-817-550-1 = "You helped out a lot. Thank you, Sensei."
