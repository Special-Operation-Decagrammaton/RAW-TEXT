[translation]
10053-818-10-1 = "歡迎來到「晄輪大祭」！\n我很努力地準備\n今天的活動唷！"
10053-818-20-1 = "雖然我是實行委員，\n但我打算親自參加\n幾個項目。"
10053-818-30-1 = "老師，我活躍的表現，\n請好好地看著唷？"
10053-818-40-1 = "大運動會\n開始後才注意到……"
10053-818-50-1 = "……比想像中\n還要忙呢。\n各種意義上來說……"
10053-818-60-1 = "晄輪大祭也\n接近尾聲了……\n請堅持到最後一刻唷！"
10053-818-70-1 = "晄輪大祭\n到此結束了。\n老師，辛苦了。"
10053-818-80-1 = "那個，\n如果可以的話……"
10053-818-90-1 = "後夜祭的\n營火晚會，\n要一起去嗎？"
10053-818-100-1 = "狀態檢查完畢。\n裝備確認完畢。"
10053-818-110-1 = "「晄輪大祭」的計畫……\n很完美！"
10053-818-120-1 = "現在不知為何，\n有一群不安分的\n學生集團…"
10053-818-130-1 = "啊，你說我臉頰上的\n星星標誌嗎？"
10053-818-140-1 = "是剛才真紀\n給我畫的。"
10053-818-150-1 = "因為是難得的慶典，\n所以給我畫了\n臉部彩繪。"
10053-818-160-1 = "我果然看起來……\n有點興奮嗎……？"
