[translation]
10053-818-10-1 = "「晄輪大祭」へようこそ！\n今日のために、頑張って\n準備しましたよ！"
10053-818-20-1 = "実行委員ではありますが、\nいくつかの種目に\n出場する予定です。"
10053-818-30-1 = "先生、私の活躍、\nちゃんと見てて\nくださいね？"
10053-818-40-1 = "大運動会が\n始まってから気づいた\nことですが……"
10053-818-50-1 = "……思ったより\nずっと忙しいですね。\n色んな意味で……"
10053-818-60-1 = "晄輪大祭も、もう終盤……\n最後まで気を\n緩めないでくださいね！"
10053-818-70-1 = "晄輪大祭も\nこれで終わりですね。\n先生、お疲れ様でした。"
10053-818-80-1 = "その、\nもしよかったら……"
10053-818-90-1 = "後夜祭の\nキャンプファイヤー、\n一緒に行きませんか？"
10053-818-100-1 = "コンディション\nチェックよし、\n装備よし。"
10053-818-110-1 = "「晄輪大祭」の計画は……\n完璧！"
10053-818-120-1 = "今なんだか、\n物騒な生徒の\n集団が…"
10053-818-130-1 = "あ、ほっぺたの\n星マークのことですか？"
10053-818-140-1 = "さっきマキに描いて\nもらったんです。"
10053-818-150-1 = "せっかくのお祭りです\nから、フェイスペイントを\nしてあげる、と。"
10053-818-160-1 = "やっぱり、ちょっと……\n 浮かれているように\n見えます……？"
