[translation]
10053-818-10-1 = "Welcome to the Kivotos Halo Festival! Tremendous work has gone into preparing for this day!"
10053-818-20-1 = "Though I'm part of the Executive Committee, I'm also planning on participating in a few matches."
10053-818-30-1 = "You'll be rooting for me out there, right Sensei?"
10053-818-40-1 = "I only realized this after field day began..."
10053-818-50-1 = "But I'm so much busier than I thought I would be... In so many different ways..."
10053-818-60-1 = "We're in the second half now... Keep your guard up until the very end!"
10053-818-70-1 = "I guess that marks the end of the Kivotos Halo Festival... Thank you, Sensei, for your hard work."
10053-818-80-1 = "Oh, if it's okay with you..."
10053-818-90-1 = "Would you like to go to the after-festival bonfire together?"
10053-818-100-1 = "Physical condition? Check. Equipment? Check."
10053-818-110-1 = "My plans for the Kivotos Halo Festival...are airtight!"
10053-818-120-1 = "That group of students seems a little shady..."
10053-818-130-1 = "Hm? The star on my cheek?"
10053-818-140-1 = "Maki drew it on for me!"
10053-818-150-1 = "It's a festival, after all. So she offered to do a little face painting."
10053-818-160-1 = "Hmm... Is it too much...?"
