[translation]
10053-818-10-1 = "ยินดีต้อนรับสู่ฮาโลเฟสติวัล\nฉันเตรียมงานมาสุดฝีมือ\nเพื่อวันนี้เลยนะคะ!"
10053-818-20-1 = "ถึงจะเป็นกรรมการจัดงาน\nแต่ฉันก็จะลงแข่ง\nในบางรายการด้วยค่ะ"
10053-818-30-1 = "คุณครูคะ คุณครูต้องจับตาดู\nความทุ่มเทของฉันนะคะ"
10053-818-40-1 = "ฉันเพิ่งมารู้หลังจากที่\nงานมหกรรมแข่งขันกีฬา\nเริ่มไปแล้ว..."
10053-818-50-1 = "ฉันยุ่งมากๆ เลยนะคะ\nมากกว่าที่คิดอีก\nในหลายๆ ด้านเลยค่ะ..."
10053-818-60-1 = "มาถึงครึ่งหลังของการแข่งขันแล้ว...\nอย่าเพิ่งวางใจจนกว่า\nจะจบการแข่งขันนะคะ!"
10053-818-70-1 = "ฮาโลเฟสติวัลจบลง\nเพียงเท่านี้สินะคะ คุณครู\nขอบคุณมากเลยนะคะ"
10053-818-80-1 = "เอ่อ แล้วก็\nถ้าสะดวกละก็..."
10053-818-90-1 = "เราไปแคมป์ไฟ\nตอนอาฟเตอร์ ปาร์ตี้\nด้วยกันไหมคะ?"
10053-818-100-1 = "เช็กสภาพร่างกายเรียบร้อย\nเช็กอุปกรณ์ต่างๆ เรียบร้อย"
10053-818-110-1 = "แผนการฮาโลเฟสติวัล...\nช่างสมบูรณ์แบบ!"
10053-818-120-1 = "มีกลุ่มนักเรียนที่ดูเป็นตัวป่วน\nอะไรสักอย่างในตอนนี้ด้วย..."
10053-818-130-1 = "อ้อ ดาวที่อยู่บนแก้ม\nนี่น่ะเหรอคะ?"
10053-818-140-1 = "เมื่อกี้มากิ\nวาดให้ฉันน่ะค่ะ"
10053-818-150-1 = "พอดีเธอบอกว่าจะเพนต์หน้า\nให้เพราะเทศกาลไม่ได้มีกัน\nบ่อยๆ น่ะค่ะ"
10053-818-160-1 = "หรือว่ามัน...\nไม่ค่อยสวยงั้นเหรอคะ...?"
