[translation]
10053-818-10-1 = "<황륜대제>에 어서 오세요!\n오늘을 위해서, 그동안\n열심히 준비했다고요!"
10053-818-20-1 = "일단은 실행위원이지만,\n몇몇 경기는 직접\n출전할 예정이라서요."
10053-818-30-1 = "선생님. 제 활약, 잘\n지켜봐 주셔야 해요?"
10053-818-40-1 = "대운동회가\n시작되고 나서야\n깨달았는데……"
10053-818-50-1 = "……생각했던 것보다\n훨씬 바쁘네요.\n여러가지 의미로……"
10053-818-60-1 = "대회도 어느덧 후반부……\n마지막까지 긴장을\n늦추지 말아주세요!"
10053-818-70-1 = "황륜대제도 이것으로\n종료네요. 선생님,\n수고 많으셨습니다."
10053-818-80-1 = "저 그리고\n괜찮으시다면……"
10053-818-90-1 = "후야제에 있을\n캠프파이어에\n같이 가지 않으실래요?"
10053-818-100-1 = "컨디션 체크 완료.\n장비 체크 완료."
10053-818-110-1 = "황륜대제의 계획은……\n완벽해!"
10053-818-120-1 = "지금 뭔가 불온해 보이는\n학생 무리가…"
10053-818-130-1 = "아, 뺨의\n이 별 말인가요?"
10053-818-140-1 = "아까 마키가\n그려주었답니다."
10053-818-150-1 = "모처럼의 축제이니\n페이스 페인팅을\n해준다고 해서요."
10053-818-160-1 = "역시 조금……\n들뜬 것처럼\n보이려나요……?"
