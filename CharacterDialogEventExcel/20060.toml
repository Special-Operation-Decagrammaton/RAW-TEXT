[translation]
20060-610 = "イブキね、\n海、はじめてだから……\nすっごく楽しみに\nしてたの。"
20060-620 = "先生と一緒に来れて、\nイブキ嬉しい！"
20060-630 = "イロハ先輩、忙しそう。"
20060-640 = "イブキが手伝ってあげる！"
20060-650 = "みんな、\nケンカしないで……\nケンカはいやだよぉ……。"
20060-660 = "うぅ……イブキが\n悪い子だから……？\nイブキのせい……？"
20060-670 = "アイアイ！\nキャプテン！\nヨーホー！"
20060-680 = "あのねあのね、イブキ、\n海で遊ぶの、\n本当に楽しかったよ！"
20060-690 = "だからまた、\nみんなで、来よう、\nね……ぐーぐー……。"
20060-700 = "先生、どうしたの～？"
20060-710 = "えへへ、イブキと\n遊んでくれるの？"
20060-720 = "チアキ先輩はね、\nいつもイブキの写真を\nい～っぱい撮って\nくれるんだ！"
20060-730 = "だから、\nイブキが映ってる写真、\nこーんなにあるの！"
20060-740 = "先生！みて！\nすごい！すごーい！"
20060-750 = "ここから、ここまで！\nぜーんぶ海だよ～！"
20060-760 = "お話しできるお魚さん、\nいるかなぁ？"
20060-770 = "映画でね、見たの！\nこんにちはー！って\nおしゃべりできるんだよ！"
20060-1060 = "いらっしゃーい先生！\nここはイブキが担当しているよ！"
20060-1070 = "イブキも、\nぱんでもにうむ〜\nそさえてぃ〜の一員、\nだからね！"
20060-1080 = "わ～！難しそう……！"
20060-1090 = "先生はこれ、\nぜんぶわかるの？\nすごい！すごーい！"
20060-1100 = "よくできました、っと。\nえへへ！\nハンコのきれいな押し方、\n教えてもらったの！"
20060-1110 = "先生、忙しい？\nイブキも、\n先生をお手伝いする～！"
20060-1120 = "えっへん！\nイブキはいま、\nお仕事中なのです！"
20060-1130 = "遊ぶのは\nお仕事が終わってから、\nだよ！"
20060-1140 = "イブキ、一人でできるもん。"
20060-1150 = "でも先生と\n一緒にお仕事するのは、\n好き！"
