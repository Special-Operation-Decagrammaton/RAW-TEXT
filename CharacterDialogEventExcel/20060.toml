[translation]
20060-860-610-1 = "รู้มั้ย? อิบูกิน่ะ\nเพิ่งมาทะเลครั้งแรก\nเลยตื่นเต้นมากเลย"
20060-860-620-1 = "ดีใจจริงๆ\nที่ได้มากับคุณครู!"
20060-860-630-1 = "รุ่นพี่อิโรฮะ\nดูงานยุ่งมากเลย"
20060-860-640-1 = "อิบูกิก็อยากช่วยงานด้วย!"
20060-860-650-1 = "ทุกคนอย่าทะเลาะกันนะ...\nอิบูกิไม่ชอบการทะเลาะกัน..."
20060-860-660-1 = "แงงง...\nเป็นเพราะอิบูกิเหรอ?\nเพราะอิบูกิเป็นเด็กไม่ดีเหรอ?"
20060-860-670-1 = "อาย อาย! กัปตัน! โยะโฮโฮ!"
20060-860-680-1 = "รู้มั้ย! รู้มั้ย! อิบูกิน่ะ\nสนุกกับทะเลมากเลย!"
20060-860-690-1 = "คราวหน้าถ้าได้มาอีก...\nฟี้... ฟี้..."
20060-860-700-1 = "เป็นอะไรเหรอ คุณครู?"
20060-860-710-1 = "จะเล่นกับอิบูกิเหรอ?"
20060-860-720-1 = "รู้มั้ย? รุ่นพี่จิอากิ\nถ่ายรูปอิบูกิ\nไว้เยอะมากเลยนะ?"
20060-860-730-1 = "เพราะงั้นอิบูกิ\nเลยมีรูปถ่ายเยอะมาก!"
20060-860-740-1 = "คุณครู!\nตรงสุดขอบโน้นนนนน~"
20060-860-750-1 = "จนถึงตรงนั้นเลย...! มีแต่ทะเลเต็มไปหมด!"
20060-860-760-1 = "จะได้เจอคุณปลา\nที่พูดได้มั้ยนะ?"
20060-860-770-1 = "อิบูกิเคยเห็นในหนังมาน่ะ!"
20060-860-1060-1 = "เชิญเลย คุณครู!\nตรงนี้อิบูกิเป็นคนรับผิดชอบ!"
20060-860-1070-1 = "ก็อิบูกิเป็นสมาชิก\nแพนเดโมเนียม โซไซตี้เต็มตัวนี่นา!"
20060-860-1080-1 = "มีแต่อะไรยากๆ เต็มไปหมด...!"
20060-860-1090-1 = "คุณครูรู้มั้ยว่าทั้งหมดนี่คืออะไร?"
20060-860-1100-1 = "เก่งมากค่ะ! ฮิฮิฮิ! ตราประทับต้อง\nปั๊มกันแบบนี้! จำได้แล้วนะ!"
20060-860-1110-1 = "คุณครู ยุ่งอยู่เหรอ?\nอิบูกิจะช่วยงานคุณครูด้วย!"
20060-860-1120-1 = "อะแฮ่ม! ตอนนี้อิบูกิ\nกำลังทำงานอยู่!"
20060-860-1130-1 = "ถ้าจะเล่น ต้องรอหลังงานเสร็จค่ะ!"
20060-860-1140-1 = "อิบูกิทำคนเดียวได้อยู่แล้ว"
20060-860-1150-1 = "แต่ก็ชอบการทำงาน\nร่วมกับคุณครูนะ!"
