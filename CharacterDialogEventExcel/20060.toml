[translation]
20060-860-610-1 = "イブキね、\n海、はじめてだから……\nすっごく楽しみに\nしてたの。"
20060-860-620-1 = "先生と一緒に来れて、\nイブキ嬉しい！"
20060-860-630-1 = "イロハ先輩、忙しそう。"
20060-860-640-1 = "イブキが手伝ってあげる！"
20060-860-650-1 = "みんな、\nケンカしないで……\nケンカはいやだよぉ……。"
20060-860-660-1 = "うぅ……イブキが\n悪い子だから……？\nイブキのせい……？"
20060-860-670-1 = "アイアイ！\nキャプテン！\nヨーホー！"
20060-860-680-1 = "あのねあのね、イブキ、\n海で遊ぶの、\n本当に楽しかったよ！"
20060-860-690-1 = "だからまた、\nみんなで、来よう、\nね……ぐーぐー……。"
20060-860-700-1 = "先生、どうしたの～？"
20060-860-710-1 = "えへへ、イブキと\n遊んでくれるの？"
20060-860-720-1 = "チアキ先輩はね、\nいつもイブキの写真を\nい～っぱい撮って\nくれるんだ！"
20060-860-730-1 = "だから、\nイブキが映ってる写真、\nこーんなにあるの！"
20060-860-740-1 = "先生！みて！\nすごい！すごーい！"
20060-860-750-1 = "ここから、ここまで！\nぜーんぶ海だよ～！"
20060-860-760-1 = "お話しできるお魚さん、\nいるかなぁ？"
20060-860-770-1 = "映画でね、見たの！\nこんにちはー！って\nおしゃべりできるんだよ！"
20060-860-1060-1 = "いらっしゃーい先生！\nここはイブキが担当しているよ！"
20060-860-1070-1 = "イブキも、\nぱんでもにうむ〜\nそさえてぃ〜の一員、\nだからね！"
20060-860-1080-1 = "わ～！難しそう……！"
20060-860-1090-1 = "先生はこれ、\nぜんぶわかるの？\nすごい！すごーい！"
20060-860-1100-1 = "よくできました、っと。\nえへへ！\nハンコのきれいな押し方、\n教えてもらったの！"
20060-860-1110-1 = "先生、忙しい？\nイブキも、\n先生をお手伝いする～！"
20060-860-1120-1 = "えっへん！\nイブキはいま、\nお仕事中なのです！"
20060-860-1130-1 = "遊ぶのは\nお仕事が終わってから、\nだよ！"
20060-860-1140-1 = "イブキ、一人でできるもん。"
20060-860-1150-1 = "でも先生と\n一緒にお仕事するのは、\n好き！"
