[translation]
20060-610 = "있지,\n이부키 바다는 처음이라\n엄청 기대했는데."
20060-620 = "선생님이랑 같이 와서\n정말 기뻐!"
20060-630 = "이로하 선배,\n엄청 바빠 보여."
20060-640 = "이부키도 도와주고 싶어!"
20060-650 = "다들 싸우지 마……\n싸우는 거 싫어……."
20060-660 = "우으으……\n이부키 때문이야?\n이부키가 나쁜 아이라서?"
20060-670 = "아이 아이! 캡틴! 요호호!"
20060-680 = "이부키 있지! 있지!\n바다 엄청 즐거웠어!"
20060-690 = "다음에 또 오면……\n흠냐흠냐……."
20060-700 = "왜 그래, 선생님?"
20060-710 = "이부키랑 놀아줄 거야?"
20060-720 = "있지? 치아키 선배는\n이부키 사진 엄청 많이\n찍어준다?"
20060-730 = "그래서 이부키는\n사진이 엄청 많아!"
20060-740 = "선생님!\n저기 끄으으으으읏~"
20060-750 = "……까지! 바다밖에 없어!"
20060-760 = "말하는 물고기 씨도\n만날 수 있을까?"
20060-770 = "이부키 영화에서 봤어!"
20060-1060 = "어서와, 선생님!\n여기는 이부키가 담당이야!"
20060-1070 = "이부키도 어엿한\n만마전 일원이니까!"
20060-1080 = "어려운 게 잔뜩……!"
20060-1090 = "선생님은 이거 다 뭔지 알아?"
20060-1100 = "참 잘했습니다! 에헤헤!\n이렇게 도장 찍어주는 거야!\n배웠다?"
20060-1110 = "선생님, 바빠?\n이부키도 선생님 일 도와줄래!"
20060-1120 = "에헴! 지금 이부키는\n일하는 중이야!"
20060-1130 = "노는 건 일 끝나고 나서입니다!"
20060-1140 = "이부키 혼자서도 할 수 있는데."
20060-1150 = "그래도 선생님이랑\n같이 일하는 건 좋아!"
