[translation]
20060-610 = "รู้มั้ย? อิบูกิน่ะ\nเพิ่งมาทะเลครั้งแรก\nเลยตื่นเต้นมากเลย"
20060-620 = "ดีใจจริงๆ\nที่ได้มากับคุณครู!"
20060-630 = "รุ่นพี่อิโรฮะ\nดูงานยุ่งมากเลย"
20060-640 = "อิบูกิก็อยากช่วยงานด้วย!"
20060-650 = "ทุกคนอย่าทะเลาะกันนะ...\nอิบูกิไม่ชอบการทะเลาะกัน..."
20060-660 = "แงงง...\nเป็นเพราะอิบูกิเหรอ?\nเพราะอิบูกิเป็นเด็กไม่ดีเหรอ?"
20060-670 = "อาย อาย! กัปตัน! โยะโฮโฮ!"
20060-680 = "รู้มั้ย! รู้มั้ย! อิบูกิน่ะ\nสนุกกับทะเลมากเลย!"
20060-690 = "คราวหน้าถ้าได้มาอีก...\nฟี้... ฟี้..."
20060-700 = "เป็นอะไรเหรอ คุณครู?"
20060-710 = "จะเล่นกับอิบูกิเหรอ?"
20060-720 = "รู้มั้ย? รุ่นพี่จิอากิ\nถ่ายรูปอิบูกิ\nไว้เยอะมากเลยนะ?"
20060-730 = "เพราะงั้นอิบูกิ\nเลยมีรูปถ่ายเยอะมาก!"
20060-740 = "คุณครู!\nตรงสุดขอบโน้นนนนน~"
20060-750 = "จนถึงตรงนั้นเลย...! มีแต่ทะเลเต็มไปหมด!"
20060-760 = "จะได้เจอคุณปลา\nที่พูดได้มั้ยนะ?"
20060-770 = "อิบูกิเคยเห็นในหนังมาน่ะ!"
20060-1060 = "เชิญเลย คุณครู!\nตรงนี้อิบูกิเป็นคนรับผิดชอบ!"
20060-1070 = "ก็อิบูกิเป็นสมาชิก\nแพนเดโมเนียม โซไซตี้เต็มตัวนี่นา!"
20060-1080 = "มีแต่อะไรยากๆ เต็มไปหมด...!"
20060-1090 = "คุณครูรู้มั้ยว่าทั้งหมดนี่คืออะไร?"
20060-1100 = "เก่งมากค่ะ! ฮิฮิฮิ! ตราประทับต้อง\nปั๊มกันแบบนี้! จำได้แล้วนะ!"
20060-1110 = "คุณครู ยุ่งอยู่เหรอ?\nอิบูกิจะช่วยงานคุณครูด้วย!"
20060-1120 = "อะแฮ่ม! ตอนนี้อิบูกิ\nกำลังทำงานอยู่!"
20060-1130 = "ถ้าจะเล่น ต้องรอหลังงานเสร็จค่ะ!"
20060-1140 = "อิบูกิทำคนเดียวได้อยู่แล้ว"
20060-1150 = "แต่ก็ชอบการทำงาน\nร่วมกับคุณครูนะ!"
