[translation]
20060-860-610-1 = "伊吹，因為是第一次\n來到海邊……\n一直超級期待的。"
20060-860-620-1 = "能和老師一起來，\n伊吹好開心！"
20060-860-630-1 = "伊呂波前輩，\n看起來好忙。"
20060-860-640-1 = "讓伊吹來幫忙吧！"
20060-860-650-1 = "大家，\n不要吵架嘛……\n伊吹討厭吵架……"
20060-860-660-1 = "嗚嗚……是因為伊吹\n是個壞孩子嗎……？\n是伊吹的錯……？"
20060-860-670-1 = "是的！船長！\n喲～呵～！"
20060-860-680-1 = "那個那個，伊吹，\n在海邊玩得\n真的很開心唷！"
20060-860-690-1 = "所以下次，大家\n再一起來吧……\n呼嚕呼嚕……"
20060-860-700-1 = "老師，怎麼了～？"
20060-860-710-1 = "耶嘿嘿，要\n陪伊吹玩嗎？"
20060-860-720-1 = "千秋前輩他啊，\n總是幫伊吹拍\n好～多好多照片！"
20060-860-730-1 = "所以，有伊吹的照片，\n有這麼多哦！"
20060-860-740-1 = "老師！你看！\n好厲害！好厲～害！"
20060-860-750-1 = "從這裡，到這裡！\n全～部都是海唷～！"
20060-860-760-1 = "有會說話的魚兒嗎？"
20060-860-770-1 = "伊吹在電影裡看過！\n會說「你好～！」哦！"
20060-860-1060-1 = "歡迎光臨～老師！\n這裡是由伊吹負責的唷！"
20060-860-1070-1 = "因為伊吹也是\n萬～魔～殿～的一員！"
20060-860-1080-1 = "哇～！看起來好難……！"
20060-860-1090-1 = "老師，這些你\n全部都看得懂嗎？\n好厲害！好厲～害！"
20060-860-1100-1 = "做得很好，蓋章。\n耶嘿嘿！\n把印章蓋漂亮的方法，\n伊吹有學過哦！"
20060-860-1110-1 = "老師，你在忙嗎？\n伊吹也要幫老師的忙～！"
20060-860-1120-1 = "哼哼！\n伊吹現在，正在工作！"
20060-860-1130-1 = "玩樂要等工作結束之後，\n才可以唷！"
20060-860-1140-1 = "伊吹一個人也做得到哦。"
20060-860-1150-1 = "不過伊吹喜歡\n和老師一起工作！"
