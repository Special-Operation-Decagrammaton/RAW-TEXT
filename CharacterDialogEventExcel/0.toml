[translation]
0-821-10-1 = "虚妄のサンクトゥム\n攻略戦、開始\nいたします。"
0-821-20-1 = "お待ちしておりました、\n先生。"
0-821-30-1 = "現在、\n虚妄のサンクトゥム\n攻略戦が進行中です。"
0-821-40-1 = "虚妄のサンクトゥムで\n収集した敵のデータは、\n引き続き分析を\n行っております。"
0-821-50-1 = "虚妄のサンクトゥムの\n破壊を急がなければ、\n学園都市の未来は……。"
0-821-60-1 = "これはキヴォトス全域に\n降りかかった災禍……。"
0-821-70-1 = "虚妄のサンクトゥム\n攻略戦には、シャーレの\n力が必要です。"
0-821-80-1 = "時間に余裕は\nありませんが……。\n落ち着いて、"
0-821-90-1 = "一つひとつ\n解決していきましょう。"
0-821-100-1 = "お、お疲れさまです、\n先生……。"
0-821-110-1 = "問題は山積みですが……\nわ、私も頑張ります！"
0-821-120-1 = "先生……お疲れの\nようですが、お身体の\nほうは大丈夫ですか？"
0-821-130-1 = "睡眠はちゃんと取って\nいますか？"
0-821-140-1 = "どうも、\nご無理されている\nようなので……。"
0-821-150-1 = "いや～お疲れ、\n先生。相変わらず\n忙しそうだね。"
0-821-160-1 = "いやいや、私を\n連れてったところで\n役に立たないからね。"
0-821-170-1 = "流石の私もサボれなくてさ。\nま、こんな時くらい頑張るよ。"
0-821-180-1 = "あははっ。残念だけど、私の持ち\n場はここだからさ。連れていきた\nい気持ちは分かるけどね。ふふ。"
0-821-190-1 = "それにする？いいよ。"
0-821-200-1 = "はい、ちゃんと渡したからね。"
0-821-210-1 = "おっ、いいね～。\n先生、見る目あるじゃん。"
0-821-220-1 = "ほ～、それにするんだ。"
0-822-10-1 = "先生、\nウトナピシュティム\nブリッジは\n現在待機中です。"
0-822-20-1 = "アトラ・ハシースの\n箱舟占領戦、\n進行中です。"
0-822-30-1 = "こうしている今も、\n時間は刻一刻と\n過ぎていきます。"
0-822-40-1 = "残された時間は\nあと僅かです。"
0-822-50-1 = "迅速に任務を\n遂行しましょう。"
0-822-60-1 = "この格好、ですか？"
0-822-70-1 = "…は、はい。\nありがとうございます。"
0-822-80-1 = "疲れていないといえば\n嘘になりますが…"
0-822-90-1 = "大丈夫です。\n任務には支障を\nきたしませんので。"
0-822-100-1 = "この規模のオーパーツを\n占領するのは、決して\n簡単ではありませんが…。"
0-822-110-1 = "キヴォトスの未来のため、"
0-822-120-1 = "この任務は必ず\n成功させなければ\nなりません。"
0-822-130-1 = "ん、補給物資がいるの？"
0-822-140-1 = "必要なものが\nあったら言ってね。"
0-822-150-1 = "考えてみるとすごいよね～。"
0-822-160-1 = "こんなとこまで\n来ちゃうなんて、\n思ってもみなかったよ。"
0-822-170-1 = "あははっ。\n地上に降りるまで\n怪我しないでよね、先生。"
0-822-180-1 = "お、いいの選んだね。"
0-822-190-1 = "はい、これ。頑張ってね。"
0-822-200-1 = "おー、なるほど。\nそれにしたんだ。"
0-822-210-1 = "そうこなくっちゃね。"
0-822-220-1 = "アトラ・ハシースの\n箱舟占領戦…"
0-822-230-1 = "私も精一杯お手伝いします。"
0-822-240-1 = "先生…\n必要なものがありましたら、\n何でも仰ってください。"
0-822-250-1 = "うぅ…この服、\n少し胸元が…。"
0-822-260-1 = "皆さんの頑張りを\n見ていると…"
0-822-270-1 = "私も、もっと先生のお力に\nなりたいと思うのです。"
0-822-280-1 = "お疲れさまでした、先生。"
0-822-290-1 = "…作戦も大切ですが、\nどうかご自愛くださいね。"
0-822-300-1 = "はい、お疲れさまでした！"
0-823-10-1 = "これが最後の\n戦いですよ、先生！"
0-823-20-1 = "ついにここまできました…\nアトラ・ハシースの箱舟\nでの決戦です！"
0-823-30-1 = "最後まで\nサポートします！"
0-823-40-1 = "はい…\n私も、頑張ります！"
0-823-50-1 = "こちらで物資を\n補給していってください！"
0-823-60-1 = "最後までサポートします！"
0-823-70-1 = "はい…\n私も、頑張ります！"
0-823-80-1 = "こちらですね、先生。"
0-823-90-1 = "確認しました。\nどうぞ！"
0-824-10-1 = "こんにちは、先生。\nこちらでD.U.シラトリ区の\n復旧作業を\n行っております。"
0-824-20-1 = "ここが\nD.U.シラトリ区です。"
0-824-30-1 = "どこも状況は\n似たようなものですが、\nこちらの区も復旧を\n急がなければいけませんね。"
0-824-40-1 = "復旧は順調に\n進んでいますね。"
0-824-50-1 = "この調子でしたら、\nじきに元の町並みを\n取り戻せるでしょう。"
0-824-60-1 = "復旧作業も終わりが\n見えてきました。"
0-824-70-1 = "先生のご尽力に\n感謝いたします。"
0-824-80-1 = "シラトリ区の復旧作業は\n完了いたしました。"
0-824-90-1 = "よろしければ、\nご一緒に現場を\n確認しませんか？"
0-824-100-1 = "お呼びですか、先生？\nそれで、ご用件は…？"
0-824-110-1 = "多くの生徒が\n協力してくれたおかげで、\n復興は順調です。"
0-824-120-1 = "シャーレに\nお願いして正解でした。"
0-824-130-1 = "…そのご様子ですと、\n体調は問題\nなさそうですね。"
0-824-140-1 = "…安心、しました。"
0-824-150-1 = "崩れた建物は\n建て直すことが\nできますが、"
0-824-160-1 = "失った健康は\n取り戻せません。"
0-824-170-1 = "決して、\nご無理はなさらずに。"
0-824-180-1 = "あ、先生。\nいらっしゃい。"
0-824-190-1 = "残った資材、回収するよ～"
0-824-200-1 = "（パリッ）もぐもぐ…。"
0-824-210-1 = "ん、先生じゃん。"
0-824-220-1 = "ふふっ、もしかして\n先生もサボり？"
0-824-230-1 = "はぁ。都市の\n復旧なんてめんど…。"
0-824-240-1 = "D.U.の建物が\n全部お菓子だったら\nいいのに。"
0-824-250-1 = "そしたらいつでも\n明太子味が…！"
0-824-260-1 = "こんなに忙しいのは\n生まれて初めてだよ…。"
0-824-270-1 = "でもまぁ、世話になったわけだし、\nたまには身体を\n動かすのも悪くないからね。"
0-824-280-1 = "それが必要なの？"
0-824-290-1 = "いいよ～。\n好きに持ってって。"
0-824-300-1 = "それ、私も\n気になってたんだよね～。"
0-824-310-1 = "はいはい、\n持ってっていいよ。\nまたどうぞ～。"
0-824-320-1 = "必要なものがあったら、\n自分で交換してって～。"
0-824-330-1 = "あ、帳簿もちゃんと\n書いといてよ。"
0-824-340-1 = "こ、こんにちは、先生。"
0-824-350-1 = "今日もお互い、\n頑張りましょう…。"
0-824-360-1 = "復旧作業、計画通り\n進むといいですね。"
0-824-370-1 = "先生がいらっしゃるので、\n心配はしておりませんが。"
0-824-380-1 = "作業中の資材があちこちに…。"
0-824-390-1 = "先生も足元に\nお気をつけください。"
0-824-400-1 = "ここ最近のリン先輩は、\n特に無理を\nされているみたいで…。"
0-824-410-1 = "ちょっと心配です。"
0-824-420-1 = "も、もう終わったのですか？\n流石です、先生！"
0-824-430-1 = "お疲れさまでした、先生！\nささやかではありますが、\n連邦生徒会からのお礼です…！"
0-50822-10-1 = "先生、\nウトナピシュティム\nブリッジは\n現在待機中です。"
0-50822-20-1 = "アトラ・ハシースの\n箱舟占領戦、\n進行中です。"
0-50822-30-1 = "こうしている今も、\n時間は刻一刻と\n過ぎていきます。"
0-50822-40-1 = "残された時間は\nあと僅かです。"
0-50822-50-1 = "迅速に任務を\n遂行しましょう。"
0-50822-60-1 = "この格好、ですか？"
0-50822-70-1 = "…は、はい。\nありがとうございます。"
0-50822-80-1 = "疲れていないといえば\n嘘になりますが…"
0-50822-90-1 = "大丈夫です。\n任務には支障を\nきたしませんので。"
0-50822-100-1 = "この規模のオーパーツを\n占領するのは、決して\n簡単ではありませんが…。"
0-50822-110-1 = "キヴォトスの未来のため、"
0-50822-120-1 = "この任務は必ず\n成功させなければ\nなりません。"
0-60000-10-1 = "待っていたわ、先生。\n時間を無駄には\nできないの。"
0-60000-20-1 = "さあ、早速\nはじめましょう。"
0-60000-30-1 = "これが本日の業務内容。\n先生の活躍、\n期待しているわ。"
0-60000-40-1 = "まだ事態は\n終わっていないわ。"
0-60000-50-1 = "気を引き締めて\nいきましょう。"
0-60000-60-1 = "終わりが\n見えてきたわね。"
0-60000-70-1 = "最後まで、向上心を\n忘れないように。"
0-60000-80-1 = "無事終了したわね。"
0-60000-90-1 = "やり残しがないか、\n今のうちに\n確認してちょうだい。"
0-60000-100-1 = "そう警戒しないで\nちょうだい。"
0-60000-110-1 = "…私も傷つくのよ？"
0-60000-120-1 = "あの…\n私の事はいいから、"
0-60000-130-1 = "あっちを\n確認してちょうだい。"
0-60000-140-1 = "だから、\n私の事はいいから…"
0-60000-150-1 = "あら、何かあったのかしら？"
0-60000-160-1 = "困っている事があるのなら、\nなんでも相談してちょうだい。"
0-60000-170-1 = "私は、先生の補佐として\nここにいるのだから。"
0-60000-180-1 = "少し集中してもらえるかしら？"
0-60000-190-1 = "いえ、私ではなく、仕事に…。"
0-60000-200-1 = "おかげで助かったわ、先生。"
0-60000-210-1 = "次回もまた、\nお願いしてもいいかしら？"
0-60000-220-1 = "そう警戒しないでちょうだい。"
0-60000-230-1 = "…私も傷つくのよ？"
0-60000-240-1 = "あの…私の事はいいから、"
0-60000-250-1 = "あっちを確認してちょうだい。"
0-60000-260-1 = "だから、私の事はいいから…"
0-60000-270-1 = "それを選んだの。\nなるほど。"
0-60000-280-1 = "ふむ…\n私も異論はないわ。"
0-60000-290-1 = "そう、良い判断だと思うわ。"
0-60000-300-1 = "先生にとって、\nそれが必要なのね。"
0-60000-310-1 = "あら、何か\nあったのかしら？"
0-60000-320-1 = "困っている事が\nあるのなら、なんでも\n相談してちょうだい。"
0-60000-330-1 = "私は、先生の補佐として\nここにいるのだから。"
0-60000-340-1 = "少し集中して\nもらえるかしら？"
0-60000-350-1 = "いえ、私ではなく、\n仕事に…。"
0-60000-360-1 = "そう警戒しないで\nちょうだい。"
0-60000-370-1 = "…私も傷つくのよ？"
0-60000-380-1 = "あの…\n私の事はいいから、"
0-60000-390-1 = "あっちを\n確認してちょうだい。"
0-60000-400-1 = "だから、\n私の事はいいから…"
0-60000-410-1 = "なるほど。良いものを当てたわね。\nおめでとう。"
0-60000-420-1 = "ああ、これは良い商品よ。\n私が保証するわ。"
0-60000-430-1 = "おめでとう。やはり先生は\n幸運の持ち主なのね。"
0-60000-431-1 = "…もう終わったの？\n次のリストを持ってくるわね。"
0-60000-440-1 = "あら、何か\nあったのかしら？"
0-60000-450-1 = "困っている事が\nあるのなら、なんでも\n相談してちょうだい。"
0-60000-460-1 = "私は、先生の補佐として\nここにいるのだから。"
0-60000-470-1 = "少し集中して\nもらえるかしら？"
0-60000-480-1 = "いえ、私ではなく、\n仕事に…。"
0-60000-490-1 = "そう警戒しないで\nちょうだい。"
