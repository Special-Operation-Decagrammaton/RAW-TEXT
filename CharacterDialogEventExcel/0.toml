[translation]
0-821-10-1 = "虛假的聖所攻略戰\n現在開始。"
0-821-20-1 = "恭候多時了，\n老師。"
0-821-30-1 = "現在，\n虛假的聖所攻略戰\n正在進行中。"
0-821-40-1 = "在虛假的聖所\n收集到的敵人資料\n將會繼續進行分析。"
0-821-50-1 = "不盡快破壞\n虛假的聖所的話，\n學園都市的未來就……"
0-821-60-1 = "這是降臨在\n整個奇普托斯的災禍……"
0-821-70-1 = "要進行虛假的聖所\n攻略戰，夏萊的\n力量是必須的。"
0-821-80-1 = "時間雖然緊迫…\n不過冷靜下來，"
0-821-90-1 = "一一解決吧。"
0-821-100-1 = "您，您辛苦了，\n老師……"
0-821-110-1 = "雖然問題堆積如山……\n我，我也會加油的！"
0-821-120-1 = "老師……您看起來很累，\n身體方面還好嗎？"
0-821-130-1 = "有好好睡覺嗎？"
0-821-140-1 = "您似乎\n在勉強自己……"
0-821-150-1 = "哎呀～辛苦你了，\n老師。依然\n看起來很忙碌呢。"
0-821-160-1 = "不不，就算帶我過去\n也派不上用場的。"
0-821-170-1 = "就連我也沒辦法偷懶了。\n算了，這種時候\n還是會好好努力的。"
0-821-180-1 = "啊哈哈。很遺憾，我負責\n的工作崗位是這裡。不過想要\n帶我去的心情我也能理解啦。呵呵。"
0-821-190-1 = "要這個嗎？可以唷。"
0-821-200-1 = "來，已經交給你囉。"
0-821-210-1 = "哦，不錯嘛～\n老師，你真有眼光。"
0-821-220-1 = "哦～選了那個啊。"
0-822-10-1 = "老師，\n生命守護者艦橋，\n正在待機中。"
0-822-20-1 = "阿特拉哈西斯的方舟\n占領戰，正在進行中。"
0-822-30-1 = "即使是現在，\n時間依然\n一分一秒地流逝。"
0-822-40-1 = "留給我們的時間\n所剩不多。"
0-822-50-1 = "迅速地進行任務吧。"
0-822-60-1 = "這身服裝，是嗎？"
0-822-70-1 = "…好，好的。謝謝您。"
0-822-80-1 = "說不累是騙人的…"
0-822-90-1 = "沒問題的。\n不至於會\n妨礙到任務。"
0-822-100-1 = "要占領這種規模的歐帕茲\n絕非簡單的事…"
0-822-110-1 = "為了奇普托斯的未來，"
0-822-120-1 = "這項任務一定\n要成功才行。"
0-822-130-1 = "嗯？有補給物資嗎？"
0-822-140-1 = "有什麼需要的儘管跟我說。"
0-822-150-1 = "仔細想想還真厲害呢～"
0-822-160-1 = "居然能跑到這種地方，\n我想都沒想過呢。"
0-822-170-1 = "啊哈哈。\n在降落到地上之前\n別受傷了唷，老師。"
0-822-180-1 = "哦，選了個好東西呢。"
0-822-190-1 = "來，給你。加油哦。"
0-822-200-1 = "哦～原來如此。\n你選了那個啊。"
0-822-210-1 = "這樣就對了。"
0-822-220-1 = "阿特拉哈西斯的\n方舟占領戰…"
0-822-230-1 = "我也會盡力\n幫忙的。"
0-822-240-1 = "老師…如果有\n任何需要的東西，\n請儘管告訴我。"
0-822-250-1 = "唔…這件衣服\n胸前有點…"
0-822-260-1 = "看著大家\n努力的樣子…"
0-822-270-1 = "我也想幫上老師\n更多的忙。"
0-822-280-1 = "辛苦了，老師。"
0-822-290-1 = "…雖然作戰也很重要，\n還請您務必保重哦。"
0-822-300-1 = "好的，您辛苦了！"
0-823-10-1 = "這就是最後的\n戰鬥了，老師！"
0-823-20-1 = "終於到達這裡了…\n在阿特拉哈西斯的方舟\n的決戰！"
0-823-30-1 = "我會支援到\n最後一刻！"
0-823-40-1 = "是…\n我也會加油的！"
0-823-50-1 = "請在這裡\n補給物資！"
0-823-60-1 = "我會支援到\n最後一刻！"
0-823-70-1 = "是…\n我也會加油的！"
0-823-80-1 = "是這個對吧，老師。"
0-823-90-1 = "確認完畢。\n請收下！"
0-824-10-1 = "您好，老師。\n這裡正在進行\nD.U.白鳥區的\n修復作業。"
0-824-20-1 = "這裡是\nD.U.白鳥區。"
0-824-30-1 = "雖然各處的狀況都很類似，\n這區的修復也得\n加緊腳步才行呢。"
0-824-40-1 = "修復正順利\n進行著呢。"
0-824-50-1 = "照這個情況，\n很快就能恢復\n原來的街道了吧。"
0-824-60-1 = "修復作業也快\n進入尾聲了。"
0-824-70-1 = "非常感謝\n老師的盡力協助。"
0-824-80-1 = "白鳥區的\n修復作業\n已經完成。"
0-824-90-1 = "可以的話，\n要不要一起\n確認現場呢？"
0-824-100-1 = "您找我嗎，老師？\n那麼，有什麼事…？"
0-824-110-1 = "多虧許多學生們的合作，\n復興狀況很順利。"
0-824-120-1 = "拜託夏萊\n是正確的。"
0-824-130-1 = "…看您的樣子，\n身體似乎\n沒什麼問題呢。"
0-824-140-1 = "…終於能放心了。"
0-824-150-1 = "崩塌的建築物\n還能重新建造，"
0-824-160-1 = "但失去的健康\n就不會再回來了。"
0-824-170-1 = "請千萬，\n不要勉強自己。"
0-824-180-1 = "啊，老師。\n歡迎你來。"
0-824-190-1 = "剩下的材料會回收唷～"
0-824-200-1 = "（喀滋）嚼嚼…"
0-824-210-1 = "嗯？這不是老師嗎。"
0-824-220-1 = "呵呵，難道\n老師也在偷懶？"
0-824-230-1 = "唉。都市\n修復什麼的真麻煩…"
0-824-240-1 = "D.U.的建築要是\n全都是點心就好了。"
0-824-250-1 = "這樣就隨時能\n吃到明太子口味…！"
0-824-260-1 = "這麼忙碌\n還是生平第一次呢…"
0-824-270-1 = "但是，畢竟曾經受人照顧，\n偶爾讓身體活動一下也不錯。"
0-824-280-1 = "需要那個嗎？"
0-824-290-1 = "可以唷～\n想拿就拿走吧。"
0-824-300-1 = "那個東西，我也\n挺喜歡的呢～"
0-824-310-1 = "好的好的。\n可以拿走了唷。\n下次再來～"
0-824-320-1 = "如果有需要的東西，\n就自己兌換吧～"
0-824-330-1 = "啊，要記得\n寫在帳簿上唷。"
0-824-340-1 = "您，您好，老師。"
0-824-350-1 = "今天也一起加油吧…"
0-824-360-1 = "修復作業，能依照\n計畫進行就好了呢。"
0-824-370-1 = "既然有老師在，\n就不需要擔心了。"
0-824-380-1 = "使用中的材料到處都是…"
0-824-390-1 = "請老師也要\n小心腳步。"
0-824-400-1 = "最近琳前輩\n似乎特別\n勉強自己……"
0-824-410-1 = "讓我有點擔心。"
0-824-420-1 = "已，已經結束了嗎？\n不愧是您，老師！"
0-824-430-1 = "辛苦您了，老師！\n雖然微不足道，\n這是聯邦學生會的謝禮…！"
0-50822-10-1 = "老師，\n生命守護者艦橋，\n正在待機中。"
0-50822-20-1 = "阿特拉哈西斯的方舟\n占領戰，正在進行中。"
0-50822-30-1 = "即使是現在，\n時間依然\n一分一秒地流逝。"
0-50822-40-1 = "剩餘的時間\n所剩不多。"
0-50822-50-1 = "迅速地進行任務吧。"
0-50822-60-1 = "這身服裝，是嗎？"
0-50822-70-1 = "…是，是的。\n謝謝您。"
0-50822-80-1 = "說不累是騙人的…"
0-50822-90-1 = "沒問題的。\n不至於會\n妨礙到任務。"
0-50822-100-1 = "要占領這種規模的歐帕茲\n絕非簡單的事…"
0-50822-110-1 = "為了奇普托斯的未來，"
0-50822-120-1 = "這項任務一定\n要成功才行。"
0-60000-10-1 = "我正在等你，老師。\n不能再浪費時間了。"
0-60000-20-1 = "來，我們趕快開始吧。"
0-60000-30-1 = "這就是今天的工作內容。\n老師的活躍，\n我很期待哦。"
0-60000-40-1 = "事情還沒有完全結束。"
0-60000-50-1 = "繃緊神經加油吧。"
0-60000-60-1 = "快要看到終點了呢。"
0-60000-70-1 = "直到最後\n都別忘記上進的心。"
0-60000-80-1 = "順利結束了呢。"
0-60000-90-1 = "有沒有沒做完的事情，\n趁現在去確認一下吧。"
0-60000-100-1 = "請不要那麼警戒我。"
0-60000-110-1 = "……我也是會受傷的哦？"
0-60000-120-1 = "那個…\n不用在意我的事了，"
0-60000-130-1 = "請去那邊確認一下吧。"
0-60000-140-1 = "都說了\n不用在意我的事了……"
0-60000-150-1 = "哎呀，發生什麼事了嗎？"
0-60000-160-1 = "如果有什麼煩惱的話，\n無論什麼事都來找我商量吧。"
0-60000-170-1 = "畢竟我是為了輔佐老師\n才會在這裡的。"
0-60000-180-1 = "能請你稍微專心一點嗎？"
0-60000-190-1 = "不，不是專心看我，\n是專心工作……"
0-60000-200-1 = "託你的福得救了，老師。"
0-60000-210-1 = "下次也可以拜託你嗎？"
0-60000-220-1 = "請不要那麼警戒我。"
0-60000-230-1 = "……我也是會受傷的哦？"
0-60000-240-1 = "那個…不用在意我的事了，"
0-60000-250-1 = "請去那邊確認一下吧。"
0-60000-260-1 = "都說了不用在意我的事了……"
