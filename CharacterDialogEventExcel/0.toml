0-821-10-1 = "Operational Plan: Nisir's Summit is beginning."
0-821-20-1 = "I've been waiting, Sensei."
0-821-30-1 = "Operational Plan: Nisir's Summit is in progress."
0-821-40-1 = "I've been analyzing the data on our enemies that we've collected from the False Sanctum."
0-821-50-1 = "If we don't destroy the False Sanctum quickly, the future of Kivotos will be..."
0-821-60-1 = "A calamity has befallen all of Kivotos..."
