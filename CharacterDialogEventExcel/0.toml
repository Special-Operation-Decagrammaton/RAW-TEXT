0-60000-270-1 = "그걸 선택한 건가. 과연."
0-60000-280-1 = "흐음. 그래.\n나도 이견없어."
0-60000-290-1 = "그렇구나,\n좋은 판단이라고 생각해."
0-60000-300-1 = "선생님한테는\n그게 필요한 거구나."
