0-60000-800-1 = "그러니까\n나는 괜찮으니까…."
0-60000-810-1 = "좋은 징조인걸.\n나쁘지 않아."
0-60000-820-1 = "순조롭네.\n계속 확인해보자."
0-60000-830-1 = "이건… 생각 외인걸."
0-60000-840-1 = "…여기에 이런\n물건이 숨어있었구나."
0-60000-850-1 = "자, 다음 임무를\n계속하자."
