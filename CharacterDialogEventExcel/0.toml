0-60000-510-1 = "あの…\n私の事はいいから、"
0-60000-520-1 = "あっちを\n確認してちょうだい。"
0-60000-530-1 = "だから、\n私の事はいいから…"
0-60000-540-1 = "まさか当てるだなんて…\nすごいわね、先生。"
0-60000-550-1 = "悪くないわね。"
0-60000-560-1 = "良いと思うわ。"
0-60000-570-1 = "まだまだあるもの。\n続けていきましょう。"
