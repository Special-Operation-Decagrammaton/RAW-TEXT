0-60000-600-1 = "私は、先生の補佐として\nここにいるのだから。"
0-60000-610-1 = "少し集中してもらえるかしら？"
0-60000-620-1 = "いえ、私ではなく、仕事に…。"
0-60000-630-1 = "そう警戒しないでちょうだい。"
0-60000-640-1 = "…私も傷つくのよ？"
0-60000-650-1 = "あの…私の事はいいから、"
0-60000-660-1 = "あっちを確認してちょうだい。"
0-60000-670-1 = "だから、私の事はいいから…"
0-60000-680-1 = "はい、お疲れ様。先生。"
0-60000-690-1 = "これで解決ね。ありがとう。"
0-60000-700-1 = "本日の業務は、これで全てね。\nお疲れ様、先生。"
0-60000-710-1 = "あら、何か\nあったのかしら？"
0-60000-720-1 = "困っている事が\nあるのなら、\nなんでも相談して\nちょうだい。"
0-60000-730-1 = "私は、先生の\n補佐としてここに\nいるのだから。"
0-60000-740-1 = "少し集中して\nもらえるかしら？"
0-60000-750-1 = "いえ、\n私ではなく、\n仕事に…。"
0-60000-760-1 = "そう警戒しないで\nちょうだい。"
0-60000-770-1 = "…私も傷つくのよ？"
0-60000-780-1 = "あの…\n私の事はいいから、"
0-60000-790-1 = "あっちを確認して\nちょうだい。"
0-60000-800-1 = "だから、\n私の事はいいから…"
0-60000-810-1 = "いい傾向ね、\n悪くないわ。"
0-60000-820-1 = "順調ね、\n続けましょう。"
0-60000-830-1 = "これは…\n予想外だわ。"
0-60000-840-1 = "…ここに\nこんなものが\n隠れていたのね。"
0-60000-850-1 = "さあ、次の任務を\n始めましょう。"
