[translation]
0-821-10-1 = "거짓된 성소 공략전,\n개시합니다."
0-821-20-1 = "기다리고 있었습니다.\n선생님."
0-821-30-1 = "현재, 거짓된 성소\n공략전이 진행 중입니다."
0-821-40-1 = "거짓된 성소에서\n수집한 적의 데이터는,\n계속해서 분석하고\n있습니다."
0-821-50-1 = "거짓된 성소의\n파괴를 서두르지 않으면,\n학원도시의 미래는……."
0-821-60-1 = "이것은 키보토스\n전역에 닥친 재해…."
0-821-70-1 = "거짓된 성소\n공략전에는 샬레의\n힘이 필요합니다."
0-821-80-1 = "시간 여유는\n없습니다만…….\n침착하게,"
0-821-90-1 = "하나씩 해결하시죠."
0-821-100-1 = "수, 수고 많으세요.\n선생님……"
0-821-110-1 = "문제가 엄청 쌓여\n있지만……\n저, 저도 힘낼게요!"
0-821-120-1 = "선생님……\n피곤해보이시는데\n괜찮으신가요?"
0-821-130-1 = "잠은 좀 주무시고\n계신가요……"
0-821-140-1 = "무리하시는\n것 같아서……"
0-821-150-1 = "이야~ 고생이 많네.\n선생. 여전히\n바빠보이네."
0-821-160-1 = "아니아니,\n나를 데려간들\n도움이 안 되니까."
0-821-170-1 = "아무리 나라도\n땡땡이 칠 수는 없어서 말이지.\n뭐, 이런 때 정도는 힘낼게."
0-821-180-1 = "하하하, 미안하지만 나는 여기를\n지켜야 해. 데려가고 싶은\n마음은 이해하지만. 쿠후후."
0-821-190-1 = "그걸로 할래? 좋아."
0-821-200-1 = "자아, 확실하게 전달했으니까."
0-821-210-1 = "오, 좋네~\n선생님, 안목이 있잖아."
0-821-220-1 = "호~ 그걸로 하는구나."
0-822-10-1 = "선생님,\n우트나피쉬팀 브릿지,\n현재 대기 중입니다."
0-822-20-1 = "아트라하시스 방주\n점령전, 진행 중입니다."
0-822-30-1 = "이러고 있는 동안에도,\n시간은 시시각각\n흐르고 있습니다."
0-822-40-1 = "남은 시간이\n얼마 없습니다…"
0-822-50-1 = "빠르게 임무를 진행하죠."
0-822-60-1 = "이 모습, 말인가요?"
0-822-70-1 = "…아아. 네.\n…감사합니다."
0-822-80-1 = "피곤하지 않다면\n거짓말이 되겠습니다만…."
0-822-90-1 = "괜찮습니다.\n임무에 지장을 줄\n정도까진 아니기에."
0-822-100-1 = "이 정도 규모의 오파츠를\n점령하는 게 결코\n간단한 일은 아니지만…."
0-822-110-1 = "키보토스의 미래를 위해,"
0-822-120-1 = "이 임무는 반드시\n성공시켜야 합니다."
0-822-130-1 = "응? 보급물자가 필요해?"
0-822-140-1 = "필요한 게 있으면 말해줘."
0-822-150-1 = "생각해보면 굉장하네."
0-822-160-1 = "이런 곳까지 와버릴 줄은\n상상도 못했다니까."
0-822-170-1 = "아하하, 지상에 내려갈\n때까지 다치지 말라고,\n선생."
0-822-180-1 = "오, 좋은 거 골랐네."
0-822-190-1 = "자, 여기. 힘내라구."
0-822-200-1 = "오~ 과연.\n그걸로 골랐구나."
0-822-210-1 = "그렇게 나와야지."
0-822-220-1 = "아트라하시스의\n방주 점령전…."
0-822-230-1 = "저도 최선을 다해\n도와드리겠습니다."
0-822-240-1 = "선생님… 필요한 게\n있으시다면 뭐든\n말씀해 주세요."
0-822-250-1 = "으… 이 옷,\n약간 가슴 부분이…"
0-822-260-1 = "다들 힘내고 계신 걸\n보고 있으면…"
0-822-270-1 = "저도, 더욱 더 선생님의\n힘이 되어드리고 싶어요."
0-822-280-1 = "수고하셨습니다, 선생님."
0-822-290-1 = "…작전도 중요하지만,\n부디 몸조심 하세요."
0-822-300-1 = "네! 수고하셨습니다."
0-823-10-1 = "이제 최종 결전이에요,\n선생님!"
0-823-20-1 = "드디어 여기까지 왔어요…\n아트라하시스의 방주\n에서의 결전이에요!"
0-823-30-1 = "마지막까지\n서포트 할게요!"
0-823-40-1 = "네…\n저도 힘낼게요!"
0-823-50-1 = "여기서 물자를\n보급해 주세요!"
0-823-60-1 = "마지막까지\n서포트 할게요!"
0-823-70-1 = "네…\n저도 힘낼게요!"
0-823-80-1 = "이것 말씀이시군요, 선생님."
0-823-90-1 = "확인했습니다. 자요!"
0-824-10-1 = "어서 오십시오, 선생님.\n이곳에서 D.U.의\n시라토리구 복구 작업을\n진행하고 있습니다."
0-824-20-1 = "여기는 D.U.의\n시라토리구입니다."
0-824-30-1 = "어느 곳이나 상황은\n비슷합니다만, 이곳 역시\n복구를 서둘러야겠군요."
0-824-40-1 = "복구는 순조롭게\n진행되고 있네요."
0-824-50-1 = "이대로라면,\n곧 원래 거리 모습으로\n돌아오겠지요."
0-824-60-1 = "복구 작업도\n끝이 보이네요."
0-824-70-1 = "선생님의 노고에\n감사드립니다."
0-824-80-1 = "시라토리구의\n복구 작업은\n완료되었습니다."
0-824-90-1 = "괜찮으시다면,\n함께 현장을\n확인해보시겠습니까?"
0-824-100-1 = "부르셨습니까, 선생님?\n그래서, 어떤\n용건으로…?"
0-824-110-1 = "많은 학생의 협력\n덕택에, 복구는\n순조롭군요."
0-824-120-1 = "샬레에\n부탁하길 잘했어요."
0-824-130-1 = "…그 모습을 보아하니,\n건강은 이제 괜찮으신가\n보군요."
0-824-140-1 = "…안심, 했습니다."
0-824-150-1 = "부서진 건물은\n다시 지을 수 있지만,"
0-824-160-1 = "잃어버린 건강은\n돌아오지 않으니까요."
0-824-170-1 = "결코,\n무리하지 마시길."
0-824-180-1 = "아, 선생. 어서 와."
0-824-190-1 = "남은 자재, 회수할게~"
0-824-200-1 = "(와작) 우물우물…"
0-824-210-1 = "응? 선생이잖아?"
0-824-220-1 = "후후, 혹시\n선생도 땡땡이?"
0-824-230-1 = "하아. 도시\n복구라니, 귀찮아…"
0-824-240-1 = "D.U.의 건물이 모두\n과자집이라면 좋을 텐데."
0-824-250-1 = "그렇다면 언제라도 명란 맛을…!"
0-824-260-1 = "이렇게 바쁜 건\n태어나서 처음이야…."
0-824-270-1 = "그래도 뭐, 신세진 것도 있고,\n가끔은 몸을 움직이는 것도\n나쁘지 않으니까."
0-824-280-1 = "그게 필요해?"
0-824-290-1 = "좋아. 필요한만큼 가져가."
0-824-300-1 = "그거, 나도 눈여겨\n보던 건데~."
0-824-310-1 = "자, 자.\n가져가도 좋아.\n다음에 또 와~."
0-824-320-1 = "필요한 게 있으면,\n알아서 바꿔 가~."
0-824-330-1 = "아, 장부에 적는 건\n잊지 말고."
0-824-340-1 = "아, 안녕하세요. 선생님."
0-824-350-1 = "오늘도 서로, 힘내요…."
0-824-360-1 = "복구 작업, 계획대로\n진행되면 좋겠네요."
0-824-370-1 = "선생님이 계시니까,\n걱정할 건 없지만요."
0-824-380-1 = "작업 자재가 여기저기에…."
0-824-390-1 = "선생님도 발밑을\n조심하세요."
0-824-400-1 = "요즘 린 선배는,\n특히 무리하고 있는\n것 같아서…."
0-824-410-1 = "조금 걱정이네요."
0-824-420-1 = "버, 벌써 끝내셨나요?\n역시 선생님이세요!"
0-824-430-1 = "수고하셨습니다, 선생님!\n사소한 것이지만,\n총학생회가 드리는 답례입니다…!"
