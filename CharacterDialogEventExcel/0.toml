0-821-90-1 = "Let's take it step by step."
0-821-100-1 = "Th-Thanks for your hard work, Sensei..."
0-821-110-1 = "Problems keep piling up...b-but I'm going to do my best!"
0-821-120-1 = "Sensei... You look tired. Are you okay?"
0-821-130-1 = "Have you been sleeping enough?"
0-821-140-1 = "It seems like you're pushing yourself too hard."
0-821-150-1 = "Wow, you're working so hard, Sensei! Or is this just how busy you usually are?"
0-821-160-1 = "No, no. I wouldn't be useful."
0-821-170-1 = "I can't run away at a time like this, so...I guess I'll have to do my best."
0-821-180-1 = "Hahaha. Sorry, but I have to stay and protect this place! Though I understand why you'd want me to go with you. Heehee."
0-821-190-1 = "That? Okay."
0-821-200-1 = "All right! I took care of that delivery."
0-821-210-1 = "Good call. You have a good eye, Sensei."
0-821-220-1 = "Oho! You're choosing this one here, right?"
0-822-10-1 = "Sensei, Utnapishtim Bridge is on standby."
0-822-20-1 = "The Ark of Atrahasis Conquest is underway."
0-822-30-1 = "Time passes, even now."
0-822-40-1 = "We don't have much time left..."
0-822-50-1 = "Let's continue the mission quickly."
0-822-60-1 = "This?"
0-822-70-1 = "Ah, sure... Thank you."
0-822-80-1 = "I'd be lying if I said I wasn't tired."
0-822-90-1 = "But don't worry. I won't let it affect my work."
0-822-100-1 = "It definitely won't be easy to occupy an artifact of this scale..."
0-822-110-1 = "But for the future of Kivotos..."
0-822-120-1 = "We must succeed. We have to."
0-822-130-1 = "Huh? Do you need supplies?"
0-822-140-1 = "Let me know if you need anything."
0-822-150-1 = "When you think about it, this really is amazing."
0-822-160-1 = "I never expected to be somewhere like this."
0-822-170-1 = "Hahaha. Please wait until we're back on the ground to get hurt, Sensei."
0-822-180-1 = "Oh, that's a good one."
0-822-190-1 = "Here you go. Good luck."
0-822-200-1 = "Oh, that one? I see!"
0-822-210-1 = "That's the right attitude!"
0-822-220-1 = "The Ark of Atrahasis Conquest..."
0-822-230-1 = "I'll do my very best to help you."
