0-60000-10-1 = "기다리고 있었어. 선생님.\n시간 낭비할 것 없으니까"
0-60000-20-1 = "그럼 지금 바로 시작할까?"
0-60000-30-1 = "이게 오늘 업무 내용.\n선생님의 활약, 기대할게."
0-60000-40-1 = "아직 상황은 끝나지 않았어."
0-60000-50-1 = "정신 바짝 차리고 가는 거야."
0-60000-60-1 = "슬슬 끝이\n보이는 것 같네. "
0-60000-70-1 = "하지만\n마지막까지 향상심을\n유지하는 게 중요해."
0-60000-80-1 = "무사히 끝났네."
0-60000-90-1 = "남아 있는 부분은 없는지,\n지금 확인해줘."
0-60000-100-1 = "너무 그렇게\n경계하진 말아줘."
0-60000-110-1 = "…나도 상처받는다고?"
0-60000-120-1 = "저기… 나는 괜찮으니까,"
0-60000-130-1 = "저쪽을 확인해야지."
0-60000-140-1 = "그러니까\n나는 괜찮으니까…."
0-60000-150-1 = "어라, 뭔가 문제라도 있어? "
0-60000-160-1 = "곤란한 일이 있으면\n무엇이든 상담해 줘."
0-60000-170-1 = "나는 선생님 보좌로\n여기 있는 거니까."
0-60000-180-1 = "조금만 집중해주겠어?"
0-60000-190-1 = "아니, 내가 아니라 일에…."
0-60000-200-1 = "덕분에 살았어, 선생님."
0-60000-210-1 = "다음에도 또 부탁해도 될까?"
0-60000-220-1 = "너무 그렇게 경계하진 말아줘."
