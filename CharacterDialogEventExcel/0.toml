[translation]
0-821-10-1 = "ปฏิบัติการบุกยึดหอคอย\nแห่งคำลวง เริ่มขึ้นแล้วค่ะ"
0-821-20-1 = "กำลังรออยู่เลยค่ะ\nคุณครู"
0-821-30-1 = "ขณะนี้กำลังเริ่มปฏิบัติการ\nบุกยึดหอคอยแห่งคำลวงอยู่ค่ะ"
0-821-40-1 = "อยู่ในระหว่างวิเคราะห์\nข้อมูลของศัตรูที่รวมตัวอยู่ใน\nหอคอยแห่งคำลวงอยู่ค่ะ"
0-821-50-1 = "ถ้าไม่รีบทำลายหอคอยแห่งคำลวง\nโดยเร็วละก็...\nอนาคตของเมืองแห่งการศึกษาคง..."
0-821-60-1 = "มันปรากฏขึ้นทั่วทั้ง\nคิโวทอส..."
0-821-70-1 = "เพื่อให้ปฏิบัติการบุกยึด\nหอคอยแห่งคำลวงสำเร็จ\nเราต้องให้ทางชาเล่ต์ช่วยค่ะ"
0-821-80-1 = "ถึงเวลาจะมีไม่มากแล้ว...\nแต่ว่าตอนนี้ มาค่อยๆ แก้ปัญหา"
0-821-90-1 = "ไปทีละเรื่องเถอะค่ะ"
0-821-100-1 = "ขะ... ขอบคุณมากเลยนะคะ\nคุณครู"
0-821-110-1 = "มีปัญหาต่างๆ...\nโถมเข้ามาไม่หยุดแต่ว่า...\nฉะ... ฉันก็จะพยายามค่ะ!"
0-821-120-1 = "คุณครู...\nดูเหนื่อยมากเลยนะคะ\nเป็นอะไรหรือเปล่าคะ?"
0-821-130-1 = "หรือว่าตอนนี้...\nกำลังหลับอยู่เหรอคะ..."
0-821-140-1 = "ดูเหมือนคุณครู...\nจะฝืนตัวเองเกินไป..."
0-821-150-1 = "อา~ ลำบากแย่เลยนะ\nคุณครูเองก็ยังดูงานยุ่ง\nอยู่เหมือนเดิมเลย "
0-821-160-1 = "ไม่สิ ถึงจะหิ้วฉันไปด้วย\nก็ไม่มีประโยชน์อะไรหรอกน่า"
0-821-170-1 = "ต่อให้เป็นฉันก็โดดงานไม่ได้เหมือนกัน\nก็นะ ต้องพยายามหน่อยแหละ"
0-821-180-1 = "ฮ่าฮ่าฮ่า โทษทีนะ แต่ว่าฉันต้องคอย\nเฝ้าที่นี่น่ะ เข้าใจว่าอยากพาฉันไปด้วย\nแต่ไม่ได้หรอกนะ ฮุฮุฮุ"
0-821-190-1 = "เอาแบบนั้นเหรอ? ก็ได้"
0-821-200-1 = "เอ้า ส่งไปเรียบร้อยแล้ว"
0-821-210-1 = "โอ้ ดีเลยนะเนี่ย~\nคุณครูนี่ตาแหลมใช้ได้เลย"
0-821-220-1 = "โห~ เลือกอันนั้นสินะ"
0-822-10-1 = "คุณครู ตอนนี้กำลังดำเนินการ\nสะพานอุตนาพิชทิมอยู่ค่ะ"
0-822-20-1 = "ปฏิบัติการเรืออะทราฮาซิส\nกำลังดำเนินการอยู่ค่ะ"
0-822-30-1 = "ตอนที่มัวทำแบบนี้อยู่\nเวลาก็ค่อยๆ ผ่านไป\nทุกนาทีแล้วนะคะ "
0-822-40-1 = "เหลือเวลา\nอีกไม่มากแล้วค่ะ..."
0-822-50-1 = "รีบจัดการภารกิจเถอะค่ะ"
0-822-60-1 = "เรื่องชุดนี้น่ะเหรอคะ?"
0-822-70-1 = "อ่า... ค่ะ\n...ขอบคุณค่ะ"
0-822-80-1 = "ถ้าบอกว่าไม่เหนื่อยเลยละก็\nคงจะเป็นการโกหกกันค่ะ..."
0-822-90-1 = "ไม่เป็นไรค่ะ\nไม่ได้ถึงขั้นเป็นอุปสรรค\nต่อการทำภารกิจหรอกค่ะ"
0-822-100-1 = "กว่าจะได้สำนักงาน\nที่ใหญ่ขนาดนี้ได้\nไม่ใช่เรื่องง่ายๆ เลย..."
0-822-110-1 = "เพื่อความสงบสุข\nของคิโวทอสแล้ว"
0-822-120-1 = "จะต้องทำภารกิจนี้\nให้สำเร็จเท่านั้นค่ะ"
0-822-130-1 = "หืม? มีเสบียงอยู่ด้วยเหรอ?"
0-822-140-1 = "ถ้ามีอะไรที่ต้องการละก็ บอกมาได้เลยนะ"
0-822-150-1 = "พอมาคิดดูแล้วก็สุดยอดเลยน้า"
0-822-160-1 = "ไม่คิดไม่ฝันเลย\nว่าจะได้มาที่แบบนี้น่ะ"
0-822-170-1 = "อะฮ่าฮ่า จนกว่าจะลงจอด\nที่พื้นดิน ก็อย่าบาดเจ็บล่ะ คุณครู"
0-822-180-1 = "โอ๊ะ เลือกของดีเลยนะ"
0-822-190-1 = "เอ้า นี่... พยายามเข้าล่ะ"
0-822-200-1 = "โอ้~ ในที่สุด\nก็เลือกชิ้นนั้นสินะ"
0-822-210-1 = "ต้องแบบนี้สิ"
0-822-220-1 = "ปฏิบัติการยึดครอง\nเรืออะทราฮาซิส..."
0-822-230-1 = "ฉันเองก็จะพยายาม\nช่วยเหลืออย่างเต็มที่ค่ะ"
0-822-240-1 = "คุณครู... ถ้าต้องการอะไร\nก็บอกฉันได้เลยนะคะ"
0-822-250-1 = "ฮือ... สะ...เสื้อ\nตรงหน้าอกมันแน่นไปนิด..."
0-822-260-1 = "พอเห็นทุกคน\nพยายามกันอย่างเต็มที่..."
0-822-270-1 = "ฉันเองก็ยิ่งอยาก\nเป็นกำลังให้คุณครูยิ่งขึ้นค่ะ"
0-822-280-1 = "ขอบคุณมากค่ะคุณครู"
0-822-290-1 = "...ภารกิจสำคัญก็จริง\nแต่ช่วยระวังตัวด้วยนะคะ"
0-822-300-1 = "ค่ะ ทำได้ดีมากค่ะ! "
0-823-10-1 = "ต่อไปนี้คือศึกตัดสินแล้วค่ะ\nคุณครู!"
0-823-20-1 = "ในที่สุดก็มาถึงที่นี่แล้วสินะคะ...\nนี่เป็นศึกตัดสินของ\nเรืออะทราฮาซิสแล้วค่ะ!"
0-823-30-1 = "หนูจะสนับสนุน\nให้ถึงที่สุดค่ะ!"
0-823-40-1 = "ค่ะ... หนูเองก็จะพยายามด้วยคนค่ะ!"
0-823-50-1 = "ช่วยส่งของมาทางนี้\nได้เลยนะคะ!"
0-823-60-1 = "หนูจะสนับสนุน\nให้ถึงที่สุดค่ะ!"
0-823-70-1 = "ค่ะ... หนูเองก็จะพยายามด้วยคนค่ะ!"
0-823-80-1 = "อันนี้สินะคะ คุณครู"
0-823-90-1 = "ตรวจสอบเรียบร้อยค่ะ นี่ค่ะ!"
0-824-10-1 = "เชิญค่ะ คุณครู\nตอนนี้กำลังดำเนินการ\nพื้นที่เขตชิราโทริ\nของ D.U. ค่ะ"
0-824-20-1 = "ที่นี่คือเขตชิราโทริ\nของ D.U. ค่ะ "
0-824-30-1 = "ไม่ว่าที่ไหน\nสถานการณ์ก็คล้ายกันค่ะ\nต้องรีบฟื้นฟูที่นี่ให้ได้โดยเร็วแล้วค่ะ"
0-824-40-1 = "งานฟื้นฟูดำเนินไป\nอย่างราบรื่นดีค่ะ"
0-824-50-1 = "ถ้าเป็นแบบนี้ต่อไปละก็\nอีกไม่นานก็คงกลับไป\nเป็นเหมือนเดิมได้แล้วค่ะ"
0-824-60-1 = "งานฟื้นฟูดูเหมือน\nจะเสร็จเรียบร้อยแล้วค่ะ"
0-824-70-1 = "ขอบคุณสำหรับ\nความทุ่มเทของคุณครูนะคะ"
0-824-80-1 = "งานฟื้นฟูเขตชิราโทริ\nเสร็จเรียบร้อยแล้วค่ะ"
0-824-90-1 = "ถ้าคุณครูสะดวกละก็...\nจะไปตรวจสอบพื้นที่\nด้วยกันไหมคะ?"
0-824-100-1 = "เรียกฉันเหรอคะ คุณครู?\nไม่ทราบว่า...\nมีเรื่องอะไร...?"
0-824-110-1 = "ด้วยความช่วยเหลือ\nของนักเรียนหลายๆ คน\nเลยฟื้นฟูได้ราบรื่นดีค่ะ"
0-824-120-1 = "โชคดีที่ไปขอให้\nทางชาเล่ต์ช่วยค่ะ"
0-824-130-1 = "จากที่เห็น...\nตอนนี้สุขภาพ\nดีขึ้นแล้วสินะคะ"
0-824-140-1 = "ค่อยยังชั่ว...หน่อยค่ะ"
0-824-150-1 = "อาคารที่พังทลายลงมา\nเราสามารถสร้างขึ้นใหม่ได้"
0-824-160-1 = "แต่ว่าสุขภาพที่เสียไป\nจะเรียกคืนมาไม่ได้ค่ะ"
0-824-170-1 = "เพราะงั้น...\nอย่าฝืนตัวเองเกินไปนะคะ"
0-824-180-1 = "อ๊ะ คุณครู เชิญเลย"
0-824-190-1 = "วัสดุที่เหลือ เก็บคืนเรียบร้อย~"
0-824-200-1 = "(เคี้ยวขนม) ง่ำๆ ง่ำๆ"
0-824-210-1 = "หืม...? คุณครูนี่นา?"
0-824-220-1 = "ฮุฮุ หรือว่า...\nคุณครูก็โดดงานมาเหรอ?"
0-824-230-1 = "เฮ้อ งานฟื้นฟูเมืองนี่\nวุ่นวายจริงๆ เลย..."
0-824-240-1 = "ถ้าตรงอาคารของ D.U.\nมีร้านขนมอยู่ก็คงจะดีนะ"
0-824-250-1 = "ถ้าเป็นแบบนั้นก็จะกินมันฝรั่งทอด\nรสไข่ปลาได้ตลอด...!"
0-824-260-1 = "ตั้งแต่เกิดมา...\nเพิ่งจะเคยงานยุ่งขนาดนี้เลย"
0-824-270-1 = "แต่ก็นะ ฉันติดหนี้คุณครูอยู่ แล้วพอได้\nขยับตัวแบบนี้บ้าง มันก็ไม่ได้แย่อะไร"
0-824-280-1 = "อยากได้อันนั้นเหรอ?"
0-824-290-1 = "ได้สิ เอาไปได้เท่าที่ต้องการเลย"
0-824-300-1 = "อันนั้น...\nฉันก็เล็งอยู่เหมือนกันนะ~"
0-824-310-1 = "เอ้าๆ เอาไปซะสิ แล้วไว้มาอีกนะ~"
0-824-320-1 = "ถ้าต้องการอะไรละก็\nหยิบๆ เปลี่ยนเอาได้เลย~"
0-824-330-1 = "อ๊ะ แล้วก็อย่าลืมจดลง\nในรายการบัญชีด้วยล่ะ"
0-824-340-1 = "สะ... สวัสดีค่ะ คุณครู"
0-824-350-1 = "วันนี้ก็มาพยายามไปด้วยกันนะคะ"
0-824-360-1 = "ถ้างานฟื้นฟู... ดำเนินไป\nตามแผนก็คงดีนะคะ"
0-824-370-1 = "คุณครูอยู่ที่นี่ทั้งคน...\nฉันไม่มีเรื่องที่ต้องกังวลหรอกค่ะ"
0-824-380-1 = "วัสดุซ่อมแซม\nมันกระจัดกระจายไปหมดเลย..."
0-824-390-1 = "ตอนเดินๆ อยู่ คุณครูเองก็\nระมัดระวังด้วยนะคะ"
0-824-400-1 = "ช่วงนี้ดูเหมือนว่ารุ่นพี่ริน\nจะฝืนร่างกายตัวเองมากเกินไป..."
0-824-410-1 = "ฉันเลยกังวลนิดหน่อยน่ะค่ะ"
0-824-420-1 = "สะ... เสร็จแล้วเหรอคะ?\nสมกับเป็นคุณครูเลยค่ะ!"
0-824-430-1 = "ทำได้ดีมากเลยค่ะ คุณครู! ถึงมันจะ\nเป็นของเล็กๆ น้อยๆ แต่ก็เป็นของ\nตอบแทนจากองค์การนักเรียนค่ะ...!"
0-50822-10-1 = "คุณครู ตอนนี้กำลังดำเนินการ\nสะพานอุตนาพิชทิมอยู่ค่ะ"
0-50822-20-1 = "ปฏิบัติการเรืออะทราฮาซิส\nกำลังดำเนินการอยู่ค่ะ"
0-50822-30-1 = "ตอนที่มัวทำแบบนี้อยู่\nเวลาก็ค่อยๆ ผ่านไป\nทุกนาทีแล้วนะคะ "
0-50822-40-1 = "เหลือเวลา\nอีกไม่มากแล้วค่ะ..."
0-50822-50-1 = "รีบจัดการภารกิจเถอะค่ะ"
0-50822-60-1 = "หมายถึงชุดนี้เหรอคะ?"
0-50822-70-1 = "อ่า... ค่ะ\n...ขอบคุณค่ะ"
0-50822-80-1 = "ถ้าบอกว่าไม่เหนื่อยละก็\nคงจะเป็นการพูดโกหกแล้วค่ะ..."
0-50822-90-1 = "ไม่เป็นไรค่ะ\nไม่ได้ถึงขั้นเป็นอุปสรรค\nต่อการทำภารกิจหรอกค่ะ"
0-50822-100-1 = "กว่าจะได้สำนักงาน\nที่ใหญ่ขนาดนี้ได้\nไม่ใช่เรื่องง่ายๆ เลย..."
0-50822-110-1 = "เพื่อความสงบสุขของคิโวทอส"
0-50822-120-1 = "จะต้องทำภารกิจนี้\nให้สำเร็จเท่านั้นค่ะ"
0-60000-10-1 = "กำลังรออยู่เลย คุณครู\nเราไม่มีเวลากันแล้วนะ"
0-60000-20-1 = "ถ้างั้นเรามาเริ่มกันเลยมั้ย?"
0-60000-30-1 = "นี่คือรายละเอียดงานวันนี้\nฉันจะรอดูความกระตือรือร้น\nของคุณครูนะ"
0-60000-40-1 = "สถานการณ์มันยังไม่จบหรอกนะ"
0-60000-50-1 = "ฉันจะค่อยๆ ทำบัญชีไป"
0-60000-60-1 = "ดูเหมือนว่า\nใกล้จะจบแล้วสินะ "
0-60000-70-1 = "แต่ว่า...\nสิ่งสำคัญคือตั้งใจ\nปรับปรุงให้ถึงที่สุด"
0-60000-80-1 = "จบลงไปได้ด้วยดี\nแล้วละนะ"
0-60000-90-1 = "ช่วยตรวจสอบให้หน่อยนะ\nว่าไม่มีงานอะไรเหลืออยู่แล้ว"
0-60000-100-1 = "ไม่ต้องมาคอยระวังกัน\nขนาดนั้นก็ได้"
0-60000-110-1 = "...ฉันเองก็เจ็บเป็นเหมือนกันนะ"
0-60000-120-1 = "เอ่อ...\nฉันไม่เป็นไรหรอก"
0-60000-130-1 = "ช่วยตรวจสอบทางนั้น\nให้หน่อยสิ"
0-60000-140-1 = "ก็บอกแล้วไง\nว่าฉันไม่เป็นไรน่ะ..."
0-60000-150-1 = "เอ๋? มีปัญหาอะไรรึเปล่า? "
0-60000-160-1 = "ถ้ามีเรื่องยุ่งยากอะไร\nก็มาปรึกษาฉันได้ตลอดเลยนะ"
0-60000-170-1 = "ก็ฉันอยู่ที่นี่\nเพื่อช่วยเหลือคุณครูนี่นา"
0-60000-180-1 = "ช่วยตั้งใจหน่อยได้หรือเปล่า?"
0-60000-190-1 = "เดี๋ยวสิ... ฉันหมายถึงงาน\nไม่ใช่ตั้งใจมองฉัน"
0-60000-200-1 = "ไม่โดนงานทับตายเพราะได้\nคุณครูช่วยเอาไว้เลย"
0-60000-210-1 = "คราวหน้า ฉันจะขอ\nให้มาช่วยอีกได้รึเปล่า?"
0-60000-220-1 = "ไม่ต้องมาคอยระวังกัน\nขนาดนั้นก็ได้"
0-60000-230-1 = "...ฉันเองก็เจ็บเป็นเหมือนกันนะ"
0-60000-240-1 = "เอ่อ...\nฉันไม่เป็นไรหรอก"
0-60000-250-1 = "ช่วยตรวจสอบทางนั้น\nให้หน่อยสิ"
0-60000-260-1 = "ก็บอกแล้วไง\nว่าฉันไม่เป็นไรน่ะ..."
0-60000-270-1 = "จะเลือกอันนั้นเหรอ\nว่าแล้วเชียว"
