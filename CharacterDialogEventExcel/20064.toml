[translation]
20064-865-150-1 = "評議会へようこそ、先生。"
20064-865-160-1 = "共に、この危機に\n立ち向かって\nいきましょう。"
20064-865-170-1 = "できることなら、\nあの方の手は\n借りたく\nないのですが……。"
20064-865-180-1 = "幕が下りるその時まで、\n共に参りましょう。"
20064-865-190-1 = "事件は解決しましたが……\n真の危機は\nこれからのようです。"
20064-865-200-1 = "ご入用のものがあれば、\n何なりと\nお申し付けください。"
20064-865-210-1 = "ああ、ですが……\nできないことも\nありますからね。"
20064-865-220-1 = "きれいな\n薔薇には棘がある……"
20064-865-230-1 = "不用意に手を伸ばせば、\n傷ついてしまいますよ？"
20064-865-240-1 = "ふふ……わたくしとは\n関係のない\nお話かもしれませんが。"
20064-865-250-1 = "言葉を交わさずとも、\nただ隣で互いの息遣いを\n感じるだけで良い……"
20064-865-260-1 = "そんな関係を\n好んでいます。"
20064-865-270-1 = "先生には……\nそういった相手は\nいらっしゃいますか？"
20064-865-280-1 = "人はみなペルソナを\n被っているもの……\nですから、"
20064-865-290-1 = "わたくしはあまり人を\n信じない\n性分なのですが……。"
20064-865-300-1 = "先生にだけは……身を\n委ねても構わないと\n思っているのです。"
20064-865-310-1 = "色々なものを\n取り揃えておりますよ。"
20064-865-320-1 = "ご入用のものはありますか？"
20064-865-330-1 = "この舞台は\n幕を下ろしましたが――"
20064-865-340-1 = "先生のお力になりたい、と\n心から思っているのです。"
20064-865-350-1 = "カーテンコールに\nしばしお付き合いください。"
20064-865-360-1 = "残念ながら、\nマナミ様のご命令ですので、\n無料ではないのです。"
20064-865-370-1 = "バラの香りを感じますか……？"
20064-865-380-1 = "こちらですね。"
20064-865-390-1 = "良い香りがしますね。"
20064-865-400-1 = "お気に召したのなら幸いです。"
20064-865-410-1 = "はい、どうぞ。"
