[translation]
20064-865-150-1 = "평의회에 오신 것을\n환영합니다, 선생님."
20064-865-160-1 = "함께, 이 위기에\n맞서 나가요."
20064-865-170-1 = "가능하면, 그분의 손은\n빌리고 싶지\n않습니다만……."
20064-865-180-1 = "막이 내리는 그때까지,\n함께 나아가요."
20064-865-190-1 = "사건은 해결됐지만……\n진짜 위기는\n지금부터 시작이네요."
20064-865-200-1 = "필요한 게 있다면\n무엇이든 말씀해 주세요."
20064-865-210-1 = "아아, 하지만……\n이상한 건 안 되니까요."
20064-865-220-1 = "아름다운 장미에는\n가시가 있어서……"
20064-865-230-1 = "섣불리 건드리면\n찔리고 만답니다?"
20064-865-240-1 = "후후…… 저랑\n관계없는 이야기일지도\n모르지만요."
20064-865-250-1 = "말을 나누지 않아도,\n곁에서 숨결을 느끼는\n것만으로도 좋은……"
20064-865-260-1 = "그런 사이가 좋아요."
20064-865-270-1 = "선생님은……\n그런 사람이 있으실까요?"
20064-865-280-1 = "사람들은 모두\n페르소나를 쓰고 있죠……"
20064-865-290-1 = "그래서 저는 사람을\n잘 믿지 않습니다만……."
20064-865-300-1 = "선생님이라면,\n몸을 기대도\n괜찮다고 생각해요."
20064-865-310-1 = "업무에 필요한 상품을\n준비해 봤어요."
20064-865-320-1 = "여기서 필요한 물품이\n있으실까요?"
20064-865-330-1 = "이 무대는\n막을 내렸습니다만……."
20064-865-340-1 = "선생님의 힘이 되고 싶다는\n마음은 그대로랍니다."
20064-865-350-1 = "커튼콜이 끝날 때까지\n어울려 주시겠어요?"
20064-865-360-1 = "아쉽게도, 마나미 님의 명령이라\n무료는 아니랍니다."
20064-865-370-1 = "장미 향기가 느껴지나요……?"
20064-865-380-1 = "그쪽으로 준비해 드렸습니다."
20064-865-390-1 = "좋은 향기가 나네요."
20064-865-400-1 = "마음에 드셨으면 좋겠어요."
20064-865-410-1 = "네, 여기요."
