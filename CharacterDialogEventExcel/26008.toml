[translation]
26008-815-10-1 = "歡迎光臨，老師！\n歡迎來到海之家版本的\n百夜堂！"
26008-815-20-1 = "唔噎，老師！？\n準備還沒，\n結束耶……！？"
26008-815-30-1 = "總，總之！\n這邊請！"
26008-815-40-1 = "雖然最初\n都在混亂……\n不過危機就是\n轉機！"
26008-815-50-1 = "趁這個機會，\n我會讓百夜堂\n更加廣為人知的！"
26008-815-60-1 = "呵呵呵，目前\n都按照計劃……"
26008-815-70-1 = "啊，老師！\n歡迎光臨！\n多虧了老師，\n各方面都很順利！"
26008-815-80-1 = "雖然這次的計劃\n化為烏有了……"
26008-815-90-1 = "但是我的夢想，\n還什麼都沒有結束！"
26008-815-100-1 = "有找到什麼\n想要的東西嗎？"
26008-815-110-1 = "百夜堂還會\n繼續進化唷！\n來，讓我們\n幹盡十足的加油吧！"
26008-815-120-1 = "同時管理\n複數的店舖，\n這件事\n很辛苦呢……"
26008-815-130-1 = "嘛，不過\n也很開心！"
26008-815-140-1 = "等，老師！\n我才不是\n販賣商品啊！"
26008-815-150-1 = "而且現在，\n是營業時間……"
26008-815-480-1 = "有很多，在海邊\n有用處的各種商品唷！"
26008-815-490-1 = "有什麼不要的東西的話，\n也有在進行交換！"
26008-815-500-1 = "雖然很可惜，海之家的營業\n結束了…"
26008-815-510-1 = "…不過！沒關係，\n因為快樂的回憶\n是永遠的！"
26008-815-520-1 = "來了來了～，\n剛才叫了靜子嗎？"
26008-815-530-1 = "良好的東西以適當價格！\n這是生意的基本！"
26008-815-540-1 = "謝謝您的光臨！"
26008-815-550-1 = "啊，不錯呢！\n也是我推薦的商品！"
26008-815-560-1 = "請問有成為滿足的購物嗎？\n評論也很重要，可以的話\n請幫我宣傳哦！"
26008-815-570-1 = "來，請收下！\n一直以來謝謝您的惠顧！"
26008-10815-10-1 = "歡迎光臨，老師！\n歡迎來到海之家\n版本的百夜堂！"
26008-10815-20-1 = "咦，老師！？還沒\n準備完成哦……！？"
26008-10815-30-1 = "總，總之！\n這邊請！"
26008-10815-40-1 = "雖然一開始很混亂……\n但危機就是轉機！"
26008-10815-50-1 = "要藉此機會，\n讓百夜堂\n更廣為人知！"
26008-10815-60-1 = "呵呵呵，目前為止\n都按照計劃進行……"
26008-10815-70-1 = "啊，老師！\n歡迎光臨！\n託老師的福，\n一切都很順利！"
26008-10815-80-1 = "雖然這次的計劃\n打水飄了……"
26008-10815-90-1 = "我的夢想，\n還沒有結束！"
26008-10815-100-1 = "有找到什麼\n想要的東西嗎？"
26008-10815-110-1 = "百夜堂還會繼續進化唷！\n來，讓我們鼓起幹勁吧！"
26008-10815-120-1 = "要同時管理\n複數的店舖，\n真辛苦呢……"
26008-10815-130-1 = "不過也挺開心的就是了！"
26008-10815-140-1 = "等等，老師！\n我不是商品哦！"
26008-10815-150-1 = "而且現在，\n是營業時間……"
26008-10815-480-1 = "各種在海邊能用的東西\n都很齊全唷！"
26008-10815-490-1 = "如果有什麼不要的東西，\n也可以來交換！"
26008-10815-500-1 = "很遺憾，海之家已經\n結束營業了…"
26008-10815-510-1 = "…但！沒關係，\n快樂的回憶是永恆的！"
26008-10815-520-1 = "嗨嗨～\n剛剛有叫靜子嗎？"
26008-10815-530-1 = "用合理的價格賣好東西！\n這是做生意的基本！"
26008-10815-540-1 = "謝謝您的光臨！"
26008-10815-550-1 = "啊，選得好！\n它也是我推薦的商品！"
26008-10815-560-1 = "對購買的產品滿意嗎？\n口碑也很重要，\n可以的話，請幫忙宣傳哦！"
26008-10815-570-1 = "來，請收下！\n謝謝您一直以來的惠顧！"
