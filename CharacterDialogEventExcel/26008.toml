[translation]
26008-815-10-1 = "เชิญค่ะ คุณครู!\nยินดีต้อนรับสู่\nร้านเฮียกคิยาโค สาขาริมทะเลค่ะ!"
26008-815-20-1 = "คุณครู?! ตอนนี้\nยังเตรียมการ\nไม่เสร็จดีเลยนะคะ...?!"
26008-815-30-1 = "อะ...เอาเป็นว่า เชิญทางนี้ก่อนค่ะ!"
26008-815-40-1 = "ถึงตอนแรกๆ\nจะยังสับสนอยู่บ้าง\nแต่วิกฤตก็คือโอกาส!"
26008-815-50-1 = "ฉันจะใช้โอกาสนี้ทำให้\nร้านเฮียกคิยาโคเป็นที่รู้จักค่ะ!"
26008-815-60-1 = "จนถึงตอนนี้...\nก็เป็นไปตามแผน..."
26008-815-70-1 = "อ๊ะ คุณครู! เชิญเลยค่ะ!\nวันนี้เพราะมีคุณครูอยู่คอยช่วย...\nก็เลยผ่านไปได้อย่างราบรื่นค่ะ!"
26008-815-80-1 = "แผนครั้งนี้คือการกลายเป็น\nฟองน้ำไปค่ะ..."
26008-815-90-1 = "ความฝันของฉัน\nยังไม่สำเร็จเลยค่ะ~!"
26008-815-100-1 = "หาของที่ต้องการ\nเจอแล้วหรือยังคะ?"
26008-815-110-1 = "ร้านเฮียกคิยาโคของเรา\nจะต้องรุ่งเรืองยิ่งขึ้นค่ะ\nเอาละค่ะ มาพยายามกันเถอะค่ะ!"
26008-815-120-1 = "จัดการร้านหลายๆ ร้านพร้อมกัน\nนี่ก็เป็นงานใหญ่เอาเรื่องอยู่\nเหมือนกันนะคะ..."
26008-815-130-1 = "แต่ว่ามันก็สนุกดีอยู่หรอกค่ะ!"
26008-815-140-1 = "อ๊ะ เดี๋ยวสิ คุณครู!\nฉันไม่ใช่ของขายนะคะ!"
26008-815-150-1 = "แล้วอีกอย่างตอนนี้...\nก็ไม่ใช่เวลาเปิดทำการด้วยค่ะ..."
26008-815-480-1 = "ฉันเตรียมของหลายๆ อย่างที่จะเป็น\nประโยชน์ตอนอยู่ที่ทะเลมาด้วยค่ะ!"
26008-815-490-1 = "ถ้ามีสิ่งของที่ไม่ได้ใช้\nเอามาแลกได้นะคะ!"
26008-815-500-1 = "น่าเสียดาย แต่ว่าร้านริมทะเล\nปิดให้บริการแล้ว..."
26008-815-510-1 = "แต่ว่า...! ไม่เป็นไรหรอกค่ะ\nควาทรงจำที่สนุกสนาน\nจะอยู่กับเราตลอดไป!"
26008-815-520-1 = "ค่า ค่า~\nเรียกชิซุโกะเหรอคะ?"
26008-815-530-1 = "ของดีราคาถูกๆ!\nคือพื้นฐานของการขายของค่ะ"
26008-815-540-1 = "ขอบคุณที่มาใช้บริการค่า!"
26008-815-550-1 = "อ๊ะ เลือกได้ยอดเยี่ยมเลยค่ะ!\nฉันก็แนะนำชิ้นนั้นค่ะ"
26008-815-560-1 = "พอใจกับการเลือกซื้อสินค้ารึเปล่าคะ?\nการบอกปากต่อปากก็เป็นเรื่องสำคัญ\nช่วยพูดต่อเยอะๆ เลยนะคะ!"
26008-815-570-1 = "ค่า! นี่ค่ะ!\nขอบคุณมากๆ เลยค่า~!"
26008-10815-10-1 = "เชิญค่ะ คุณครู!\nยินดีต้อนรับสู่\nร้านเฮียกคิยาโค สาขาริมทะเลค่ะ!"
