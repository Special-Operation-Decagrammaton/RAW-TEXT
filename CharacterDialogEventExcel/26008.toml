[translation]
26008-815-10-1 = "Hello, Sensei! Welcome to Momoyodou, Beach Shack edition!"
26008-815-20-1 = "Ah, Sensei? We aren't ready yet...?!"
26008-815-30-1 = "P-Please come this way for now!"
26008-815-40-1 = "It was confusing at first...but a crisis is an opportunity in disguise!"
26008-815-50-1 = "And we'll use this opportunity to promote Momoyodou even more!"
26008-815-60-1 = "Heeheehee... It's been going as planned so far..."
26008-815-70-1 = "Oh, Sensei! Welcome! Everything is going smoothly, thanks to you!"
26008-815-80-1 = "The plan ended in failure, but..."
26008-815-90-1 = "I won't give up on achieving my dreams!"
26008-815-100-1 = "Did you find what you were looking for?"
26008-815-110-1 = "Momoyodou is constantly evolving, thanks to our hard work!"
26008-815-120-1 = "It's not easy to manage multiple shops at the same time..."
26008-815-130-1 = "But it's okay, because it's fun!"
26008-815-140-1 = "Oh? Sensei! I'm not for sale!"
26008-815-150-1 = "Not only that, but these are business hours..."
26008-815-480-1 = "I've gathered some things that might be useful at the beach!"
26008-815-490-1 = "If you have any items you don't want, I'll exchange them for other products here!"
26008-815-500-1 = "Unfortunately, the Beach Shack has closed..."
26008-815-510-1 = "But that's okay! We'll always have our memories."
26008-815-520-1 = "Yes, yes! Did you call me?"
26008-815-530-1 = "A good item for a good price! That's called good business."
26008-815-540-1 = "Thank you for coming!"
26008-815-550-1 = "Oh, good choice! I recommend that one too!"
26008-815-560-1 = "How was your shopping experience? Be sure to tell your friends about us!"
26008-815-570-1 = "Yes! Here! Thank you, as always!"
