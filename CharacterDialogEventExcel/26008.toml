[translation]
26008-815-10-1 = "어서 오세요, 선생님!\n바다의 집 버전 백야당에\n오신 것을 환영합니다!"
26008-815-20-1 = "앗, 선생님?!\n아직 준비가,\n끝나지 않았는데요…?!"
26008-815-30-1 = "이, 일단!\n이쪽으로 오세요!"
26008-815-40-1 = "처음에는 무슨 일인가\n했지만요…. 그렇다고\n해도 위기는 찬스!"
26008-815-50-1 = "이번 기회에 백야당을\n더욱 널리 알리겠어요!"
26008-815-60-1 = "후훗, 지금으로서는\n계획대로…."
26008-815-70-1 = "아, 선생님! 어서 오세요!\n선생님 덕분에,\n여러모로 순조롭다구요!"
26008-815-80-1 = "이번 계획은 물거품이\n되어버렸지만……."
26008-815-90-1 = "제 꿈은, 아직 끝나지\n않았으니까요!"
26008-815-100-1 = "뭔가 원하는\n물건은 찾으셨나요?"
26008-815-110-1 = "백야당은 아직 더\n진화할 거예요!\n자! 잔뜩 힘내서 가보죠!"
26008-815-120-1 = "여러 점포를 동시에\n관리한다는 건 큰일이네요……"
26008-815-130-1 = "뭐어, 즐겁기도 하지만요!"
26008-815-140-1 = "아 잠깐, 선생님! 저는\n파는 물건이 아니에요!"
26008-815-150-1 = "게다가 지금은\n영업시간이니까요……."
26008-815-480-1 = "여러가지로, 바다에서\n도움이 되는 것들을\n준비하고 있어요!"
26008-815-490-1 = "혹시 안 쓰는 물건이\n있으시다면, 교환해 드릴게요!"
26008-815-500-1 = "아쉽게도 바다의 집 영업은 종료되었습니다…"
26008-815-510-1 = "…만! 괜찮아요,\n즐거웠던 추억은 영원하니까!"
26008-815-520-1 = "네, 네~\n지금 시즈코를 부르셨나요?"
26008-815-530-1 = "좋은 물건을 적정 가격에!\n장사의 기본이에요!"
26008-815-540-1 = "이용해 주셔서 감사합니다!"
26008-815-550-1 = "아, 좋네요!\n저도 추천하는 물건이에요!"
26008-815-560-1 = "만족스럽게 쇼핑하셨나요?\n입소문도 중요하니까,\n괜찮으면 널리 알려주세요!"
26008-815-570-1 = "네, 여기 있습니다!\n매번 감사해요!"
