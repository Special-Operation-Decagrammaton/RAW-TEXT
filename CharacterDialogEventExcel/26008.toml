[translation]
26008-815-10-1 = "いらっしゃいませ、先生！\n海の家バージョンの\n百夜堂へ、ようこそ！"
26008-815-20-1 = "え゛、先生！？\nまだ準備、終わって\nないんですが……！？"
26008-815-30-1 = "と、とりあえず！\nこちらへどうぞ！"
26008-815-40-1 = "最初は混乱して\nばかりでしたが……\nとはいえピンチは\nチャンス！"
26008-815-50-1 = "この機会に、\n百夜堂をもっと\n広く知らしめて\nみせます！"
26008-815-60-1 = "ふふふっ、今のところ\n計画通り……"
26008-815-70-1 = "あ、先生！\nいらっしゃいませ！\n先生のおかげで、\n色々と順調です！"
26008-815-80-1 = "今回の計画は水の泡に\nなってしまいましたが……"
26008-815-90-1 = "私の夢は、まだ何も\n終わっていませんので！"
26008-815-100-1 = "何か欲しい物は\n見つかりましたか？"
26008-815-110-1 = "百夜堂はまだまだ\n進化しますよ！\nさあ、張り切って\nいきましょう！"
26008-815-120-1 = "複数の店舗を\n同時に管理する、\nというのは\n大変ですね……"
26008-815-130-1 = "まぁ、楽しくも\nあるんですが！"
26008-815-140-1 = "ちょっ、先生！\n私は売りもの\nじゃないですよ！"
26008-815-150-1 = "それに今は、\n営業時間\nなんですから……。"
26008-815-480-1 = "色々と、海で役立つものを\n取り揃えていますよ！"
26008-815-490-1 = "何か不要なものがあったら、\n交換も承ってます！"
26008-815-500-1 = "残念ながら、海の家の営業は\n終了しました…"
26008-815-510-1 = "…が！大丈夫です、\n楽しい思い出は\n永遠なので！"
26008-815-520-1 = "はいは～い、\n今シズコのこと呼びました？"
26008-815-530-1 = "良い物を適正価格で！\n商売の基本です！"
26008-815-540-1 = "ご利用ありがとう\nございました！"
26008-815-550-1 = "あ、良いですね！\n私としてもお薦めの品です！"
26008-815-560-1 = "満足いくお買い物になりましたか？\n口コミも大事なので、良かったら\n広めてくださいね！"
26008-815-570-1 = "はい、どうぞ！\nいつもありがとうございますっ！"
