[translation]
10101-838-10-1 = "다음에 할 일은……."
10101-838-20-1 = "아, 선생,\n혹시 도울 일이 있나?"
10101-838-30-1 = "어, 어서 오세요!\n몇 분이신가요!"
10101-838-40-1 = "…아, 선생이었군.\n미안하다. 인사가\n몸에 배어서 그만."
10101-838-50-1 = "아르바이트는\n아직 끝나지 않았다."
10101-838-60-1 = "끝까지,\n정신 차리고 가자."
10101-838-70-1 = "축제도 막바지로군.\n즐거웠나? 선생."
10101-838-80-1 = "이번 일도 무사히 끝마쳤군."
10101-838-90-1 = "선생 덕분이다.\n은혜를 입었어."
10101-838-100-1 = "바다는… 끝없이 넓고,\n놀라울 정도로 물이 많군."
10101-838-110-1 = "감탄했다."
10101-838-120-1 = "조금 더 시간이 있으면,\n무대의 완성도를\n높일 수 있었을 텐데…"
10101-838-130-1 = "바닷바람은 시원하군."
10101-838-140-1 = "땀을 식히기에 안성맞춤이다."
10101-838-150-1 = "즐거운 축제가 될 수\n있도록, 최선을 다하겠다."
10101-838-160-1 = "선생도 부디 축제를\n즐겨줬으면 한다."
10101-838-750-1 = "아, 선생, 미안하지만\n조금 도와줬으면 한다."
10101-838-760-1 = "나 혼자서는 조금 버겁군."
10101-838-770-1 = "오늘의 업무 목록이다.\n선생, 도와주겠나?"
10101-838-780-1 = "아르바이트로 생계를\n유지하고 있는 몸이다."
10101-838-790-1 = "업무의 안건은,\n확실히 관리해야만 하지."
10101-838-800-1 = "서, 선생?\n나한테 볼일이라도?"
10101-838-810-1 = "덕분에 살았다.\n선생은 일 처리가 빠르군."
10101-838-820-1 = "벌써 정리한 건가…?"
10101-838-830-1 = "답례로 이걸…\n받아주겠나."
