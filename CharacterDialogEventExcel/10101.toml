[translation]
10101-838-10-1 = "งานที่จะทำต่อไปก็..."
10101-838-20-1 = "อ๊ะ ครู\nมีงานอะไรให้ฉันช่วยมั้ย?"
10101-838-30-1 = "ชะ... เชิญค่ะ!\nมากี่ท่านคะ?"
10101-838-40-1 = "อ๊ะ... ครูเองสินะ\nขอโทษที ฉันทักทายแบบนี้\nจนติดเป็นนิสัยแล้วน่ะ"
10101-838-50-1 = "งานพาร์ทไทม์\nยังไม่เสร็จเลย"
10101-838-60-1 = "มาตั้งใจทำ\nจนกว่างานจะเสร็จกันเถอะ"
10101-838-70-1 = "งานเทศกาลจบลงแล้วสินะ\nสนุกหรือเปล่า ครู?"
10101-838-80-1 = "งานนี้ก็สำเร็จได้ด้วยดีสินะ"
10101-838-90-1 = "ต้องขอบคุณครูเลยนะ\nฉันติดหนี้บุญคุณแล้วละ"
10101-838-100-1 = "ทะเล... กว้างใหญ่ไม่มีที่สิ้นสุด\nแล้วก็มีน้ำทะเลเยอะจนน่าตกใจเลย"
10101-838-110-1 = "น่าประทับใจจัง"
10101-838-120-1 = "ถ้ามีเวลามากกว่านี้อีกหน่อย\nก็คงทำให้การแสดงบนเวที\nสมบูรณ์แบบกว่านี้ได้นะ..."
10101-838-130-1 = "ลมทะเลเย็นสบายดีจัง"
10101-838-140-1 = "เหมาะกับการเดินคลายร้อนเลย"
10101-838-150-1 = "ฉันจะทำให้เต็มที่ ให้เป็น\nงานเทศกาลที่สนุกเลยละ"
10101-838-160-1 = "ครู หวังว่าครูก็จะสนุก\nกับงานเทศกาลด้วยนะ"
10101-838-750-1 = "อ๊ะ ครู ขอโทษนะ\nแต่มาช่วยฉันหน่อยสิ"
10101-838-760-1 = "ฉันทำคนเดียวไม่ไหวน่ะ"
10101-838-770-1 = "นี่คือรายการภารกิจของวันนี้\nครู มาช่วยหน่อยได้มั้ย?"
10101-838-780-1 = "ฉันหาเลี้ยงตัวเอง\nด้วยงานพาร์ทไทม์น่ะ"
10101-838-790-1 = "ฉันต้องใส่ใจ\nรายละเอียดของงานสิ"
10101-838-800-1 = "คะ... ครู?\nมีธุระกับฉันเหรอ?"
10101-838-810-1 = "รอดมาได้เพราะครูเลยนะ\nครูจัดการงานไวจัง"
10101-838-820-1 = "เสร็จแล้วเหรอเนี่ย...?"
10101-838-830-1 = "รับสิ่งนี้ไว้...\nเป็นของตอบแทนสิ"
