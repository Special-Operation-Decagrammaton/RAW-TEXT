[translation]
10101-838-10-1 = "Next up..."
10101-838-20-1 = "Oh, Sensei. Is there anything I can do to help?"
10101-838-30-1 = "W-Welcome! How many in your party?"
10101-838-40-1 = "...Oh, it's you, Sensei. I'm sorry. The greeting just automatically pops out."
10101-838-50-1 = "My part-time job isn't over yet."
10101-838-60-1 = "Let's stay awake until the end."
10101-838-70-1 = "The festival is almost finished. Did you enjoy it, Sensei?"
10101-838-80-1 = "I safely finished this job too."
10101-838-90-1 = "It's all thanks to you, Sensei. I owe you one."
10101-838-100-1 = "The sea...is endlessly large. It's an amazing amount of water."
10101-838-110-1 = "It's admirable."
10101-838-120-1 = "If only I'd had more time, I could have completed everything for the performance..."
10101-838-130-1 = "The sea breeze is nice and cool."
10101-838-140-1 = "It's perfect for cooling myself."
10101-838-150-1 = "I'll do my best to make it a joyful festival."
10101-838-160-1 = "I hope that you enjoy it too, Sensei."
10101-838-750-1 = "Oh, Sensei. I'm sorry, but can you lend me a hand?"
10101-838-760-1 = "I could use some help."
10101-838-770-1 = "This is the work I need to do today. Would you help me with it, Sensei?"
10101-838-780-1 = "I earn a living through part-time jobs."
10101-838-790-1 = "The agenda must be properly managed."
10101-838-800-1 = "S-Sensei? Do you need something?"
10101-838-810-1 = "You saved me. You're a fast worker."
10101-838-820-1 = "Have you finished organizing it already...?"
10101-838-830-1 = "Please take this...as a token of appreciation."
