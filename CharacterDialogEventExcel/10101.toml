[translation]
10101-838-10-1 = "次の仕事は…"
10101-838-20-1 = "あ、先生、\n何か手伝ってほしいのか？"
10101-838-30-1 = "い、いらっしゃいませ！\n何名様…"
10101-838-40-1 = "…あ、先生だったか。\nすまない。反射でつい。"
10101-838-50-1 = "アルバイトはまだ\n終わっていない。"
10101-838-60-1 = "最後まで、\n気を引き締めていこう。"
10101-838-70-1 = "お祭りも終盤だな。\n楽しめたか？先生。"
10101-838-80-1 = "今回の仕事も、\n無事に終わったな。"
10101-838-90-1 = "先生のおかげだ。\n恩に着る。"
10101-838-100-1 = "海は…\n果てしなく広くて、\n驚くほど水が多いのだな。"
10101-838-110-1 = "感心した。"
10101-838-120-1 = "もう少し\n時間があったら、\nステージの完成度を\nあげられたのに…。"
10101-838-130-1 = "海風は涼しいな。"
10101-838-140-1 = "熱を冷ますのに\nちょうどいい。"
10101-838-150-1 = "楽しいお祭りになるよう、\n最善を尽くそう。"
10101-838-160-1 = "先生も、どうかお祭りを\n楽しんでくれ。"
10101-838-750-1 = "悪いが先生、\n少し力を貸してくれ。"
10101-838-760-1 = "私一人では手が回らなくてな。"
10101-838-770-1 = "今日の業務リストだ。\n先生、手伝ってもらえるか？"
10101-838-780-1 = "アルバイトで生計を\n立てている身だ。"
10101-838-790-1 = "仕事の案件は、しっかり\n管理しなければならない。"
10101-838-800-1 = "せ、先生、私に用か？"
10101-838-810-1 = "おかげで助かった。\n先生は敏腕だな。"
10101-838-820-1 = "もう片付けたのか…？"
10101-838-830-1 = "お礼にこれを…\n受け取ってくれ。"
