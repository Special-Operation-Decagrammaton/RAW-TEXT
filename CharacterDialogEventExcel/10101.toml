[translation]
10101-838-10-1 = "接下來的工作是……"
10101-838-20-1 = "啊，老師，\n需要我幫你什麼忙嗎？"
10101-838-30-1 = "歡，歡迎光臨！\n請問幾位……！"
10101-838-40-1 = "……啊，原來是老師啊。\n抱歉，出於反射就……"
10101-838-50-1 = "打工還沒有結束。"
10101-838-60-1 = "直到最後，\n都繃緊神經吧。"
10101-838-70-1 = "慶典也進入尾盤了。\n玩得開心嗎？老師。"
10101-838-80-1 = "這次的工作，\n也順利落幕了呢。"
10101-838-90-1 = "這都多虧了老師。\n我欠你一份人情。"
10101-838-100-1 = "大海……\n寬闊得像沒有盡頭，\n水也多得令人訝異呢。"
10101-838-110-1 = "令人佩服。"
10101-838-120-1 = "要是能再多一些時間，\n就能讓表演的完成度\n更高了……"
10101-838-130-1 = "海風真涼爽。"
10101-838-140-1 = "正好適合將熱冷卻下來。"
10101-838-150-1 = "為了讓慶典變得更有趣，\n我會全力以赴。"
10101-838-160-1 = "老師也請\n好好享受慶典吧。"
10101-838-750-1 = "不好意思，老師，\n麻煩助我一臂之力吧。"
10101-838-760-1 = "我一個人實在忙不過來。"
10101-838-770-1 = "這是今天的工作清單。\n老師，能請你幫忙嗎？"
10101-838-780-1 = "我現在靠著打工\n來維持生計。"
10101-838-790-1 = "所以工作的案件，\n必須得認真管理才行。"
10101-838-800-1 = "老，老師？\n找我有什麼事嗎？"
10101-838-810-1 = "多虧有你才能得救。\n老師真能幹啊。"
10101-838-820-1 = "已經處理好了嗎……？"
10101-838-830-1 = "謝禮是這個……\n你就收下吧。"
