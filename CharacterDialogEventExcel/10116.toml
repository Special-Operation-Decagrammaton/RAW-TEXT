[translation]
10116-834-480-1 = "ได้เวลาทำภารกิจพิเศษแล้วสินะ"
10116-834-490-1 = "งั้นก็มาเริ่มกันเลย"
10116-834-500-1 = "ถ้าได้อยู่กับครู\nงานนี้ก็ไม่มีปัญหา"
10116-834-510-1 = "ยังไม่เจองานยากเลย\nสั่งการครั้งต่อไปก็ฝากด้วยนะ"
10116-834-520-1 = "ตอนนี้เป็นขั้นสุดท้ายแล้วใช่มั้ย?"
10116-834-530-1 = "ฝากระวังเรื่อง\nการแบ่งเวลาด้วยนะ"
10116-834-540-1 = "ภารกิจเสร็จแล้ว\nแต่อยากใส่ชุดเดรสนี้\nไปเรื่อยๆ จัง"
10116-834-550-1 = "หืม?\nมีงานจะสั่งเหรอ?"
10116-834-560-1 = "ก็แค่... ลองเรียกดู\nงั้นเหรอ? ทำไมล่ะ?"
10116-834-570-1 = "เพราะฉันสวย... งั้นเหรอ...?"
10116-834-580-1 = "ครูเนี่ย...\nชอบล้อเล่นอะไรแปลกๆ นะ"
10116-834-590-1 = "อึก อย่าพูดอย่างนั้น\nออกมาง่ายๆ แบบนี้สิ"
