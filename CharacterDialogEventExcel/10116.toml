[translation]
10116-834-480-1 = "特殊任務の時間だ。"
10116-834-490-1 = "では、はじめよう。"
10116-834-500-1 = "先生がいるのなら、\n問題ないな。"
10116-834-510-1 = "順調だな。\nこのあとの指揮も、\nよろしく頼む。"
10116-834-520-1 = "作戦は終盤に\n差しかかっている。"
10116-834-530-1 = "時間配分に\n注意してくれ。"
10116-834-540-1 = "この後も……ずっとこれを\n着ていたいのだが。\n難しいのだろうか。"
10116-834-550-1 = "どうかしたのか？"
10116-834-560-1 = "何も無いのか……？"
10116-834-570-1 = "私が、きれい……？"
10116-834-580-1 = "先生は……\n変な冗談を言うんだな。"
10116-834-590-1 = "っ、そういうことを\n軽々しく言うな。"
