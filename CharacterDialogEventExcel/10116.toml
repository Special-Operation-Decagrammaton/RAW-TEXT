[translation]
10116-834-480-1 = "特殊任務的時間到了。"
10116-834-490-1 = "那麼開始吧。"
10116-834-500-1 = "有老師在的話，\n就沒問題了。"
10116-834-510-1 = "挺順利的呢。\n之後的指揮也拜託了。"
10116-834-520-1 = "作戰已進入終盤。"
10116-834-530-1 = "記得留意時間分配。"
10116-834-540-1 = "在這之後……我也想\n繼續穿著這套禮服。\n會有困難嗎？"
10116-834-550-1 = "怎麼了嗎？"
10116-834-560-1 = "沒什麼事……？"
10116-834-570-1 = "我很漂亮……？"
10116-834-580-1 = "老師你……也會\n開這種奇怪的玩笑呢。"
10116-834-590-1 = "請，請不要\n隨便說那種話。"
