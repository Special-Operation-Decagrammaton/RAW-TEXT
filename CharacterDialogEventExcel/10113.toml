[translation]
10113-844-10-1 = "게헨나에 오신 것을\n환영합니다. 선생님."
10113-844-20-1 = "무탈한 시간을\n보내실 수 있기를\n기원합니다."
10113-844-30-1 = "……"
10113-844-40-1 = "진심입니다."
10113-844-50-1 = "오셨습니까, 선생님."
10113-844-60-1 = "비번인 날입니다만,"
10113-844-70-1 = "저는 언제든 경계를\n늦추지 않을 겁니다."
10113-844-80-1 = "이것은 제법\n흥미로운 시체……"
10113-844-90-1 = "실례."
10113-844-100-1 = "황당하고\n호기심 넘치는……"
10113-844-110-1 = "이것도 실례."
10113-844-120-1 = "위급한 상황이\n된 것 같군요."
10113-844-130-1 = "이성적으로는\n이 사태가 빠르게\n마무리되기를\n바라야 하겠습니다만."
10113-844-140-1 = "……"
10113-844-150-1 = "조금만 더,\n재미있는 광경을 볼 수\n있으면 좋겠습니다."
10113-844-160-1 = "지금은 농담입니다.\n믿어 주십시오."
10113-844-170-1 = "긴급 상황, 종료입니다."
10113-844-180-1 = "선생님께서도\n수고 많으셨습니다."
10113-844-190-1 = "휴일이든 아니든,\n응급의학부가 할 일은\n변치 않습니다."
10113-844-200-1 = "이곳은 저의 학원이고,\n참으로 많은 일들이\n일어나는 곳입니다."
10113-844-210-1 = "……종합적으로,\n저에게는 꽤\n즐거운 장소입니다."
10113-844-220-1 = "제 옷, 어울리나요?"
10113-844-230-1 = "제가 그런 말을 하다니\n신선하시다고요?"
10113-844-240-1 = "주위에서 권해 준\n잡지에서 읽은\n말입니다만."
10113-844-250-1 = "선생님이 저에게\n신선함을 느끼셨다니,\n보람이 있네요."
10113-844-260-1 = "혹시 다음 휴일에\n게헨나를 방문하실\n생각이 있으시다면."
10113-844-270-1 = "저에게 먼저\n연락을 주시면\n감사하겠습니다."
10113-844-280-1 = "그편이 가장\n안전할 테니까요."
10113-844-600-1 = "안녕하세요. 선생님.\n히무로 세나입니다."
10113-844-610-1 = "무엇이 나올지\n모른다는 점에서,"
10113-844-620-1 = "이곳은 응급 상황과\n비슷한 부분이\n있을지도 모릅니다."
10113-844-630-1 = "어서 오십시오. 선생님."
10113-844-640-1 = "행운과 건강이\n항상 함께\n하시기를 바랍니다."
10113-844-650-1 = "남은 것이\n있으신가요?"
10113-844-660-1 = "저 역시 마지막까지\n보조하겠습니다."
10113-844-670-1 = "우연을 좋아하시나요,\n선생님?"
10113-844-680-1 = "저는 나름대로\n좋아하는 편입니다."
10113-844-690-1 = "행운을 바라기보다는,\n불운을 대비하는 편이\n좋다고 하죠."
10113-844-700-1 = "예방 역시 응급의학의\n중요한 부분입니다."
10113-844-710-1 = "맡겨 주십시오."
10113-844-720-1 = "축하드립니다. 선생님."
10113-844-730-1 = "좋아 보이는 상품이군요."
10113-844-740-1 = "과연, 그것이 당첨 상품이군요."
10113-844-750-1 = "저에게도 보여 주실 수 있겠습니까?\n호기심이 생기는군요."
10113-844-760-1 = "대단하십니다. 선생님."
10113-844-770-1 = "정말 수고 많으셨습니다."
