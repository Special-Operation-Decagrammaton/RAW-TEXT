[translation]
10113-844-10-1 = "歡迎蒞臨格黑娜學園。"
10113-844-20-1 = "願老師能度過\n平和的時光。"
10113-844-30-1 = "……"
10113-844-40-1 = "這是我的真心話。"
10113-844-50-1 = "你來啦，老師。"
10113-844-60-1 = "雖然今天並非上班日，"
10113-844-70-1 = "我也不會放鬆警戒。"
10113-844-80-1 = "這真是令人\n感興趣的屍……"
10113-844-90-1 = "失禮了。"
10113-844-100-1 = "相當有趣的……"
10113-844-110-1 = "這也同樣失禮呢。"
10113-844-120-1 = "差不多得加緊腳步了。"
10113-844-130-1 = "雖然希望能盡早平息……"
10113-844-140-1 = "……"
10113-844-150-1 = "可以的話，\n要是能再看到一些\n有趣的東西，什麼的。"
10113-844-160-1 = "……剛才是開玩笑的。\n真的是。"
10113-844-170-1 = "處理完畢了呢。"
10113-844-180-1 = "辛苦你了，老師。"
10113-844-190-1 = "無論休假與否，\n隸屬急救醫學部\n的事實都不會改變。"
10113-844-200-1 = "格黑娜學園\n會發生許多事件。"
10113-844-210-1 = "……是個\n挺歡樂的地方哦。"
10113-844-220-1 = "這套衣服，適合我嗎？"
10113-844-230-1 = "……聽到這種話\n覺得很新鮮？"
10113-844-240-1 = "雖然這是雜誌上\n寫的台詞……"
10113-844-250-1 = "能讓老師產生\n那種想法的話，\n這麼說也值得了。"
10113-844-260-1 = "下次來格黑娜的時候，"
10113-844-270-1 = "如果能聯絡我的話，\n我會很開心的。"
10113-844-280-1 = "這樣應該也是最安全的。"
10113-844-600-1 = "你好，老師。"
10113-844-610-1 = "就「不知道會發生什麼」\n這點來說，"
10113-844-620-1 = "急救處置跟這個地方\n或許有點類似呢。"
10113-844-630-1 = "你來啦，老師。"
10113-844-640-1 = "願幸運和健康與你同在。"
10113-844-650-1 = "還有沒做完的事嗎？"
10113-844-660-1 = "我也會陪同到最後的。"
10113-844-670-1 = "你喜歡偶然嗎，老師？"
10113-844-680-1 = "我的話，還挺喜歡的哦。"
10113-844-690-1 = "有句話說比起祈求幸運，\n更應該防備厄運。"
10113-844-700-1 = "在急救處置方面，\n防備也是很重要的。"
10113-844-710-1 = "請交給我吧。"
10113-844-720-1 = "恭喜你，老師。"
10113-844-730-1 = "是個不錯的東西呢。"
10113-844-740-1 = "原來如此。\n那就是中獎啊。"
10113-844-750-1 = "能讓我也看看嗎？\n我非常感興趣。"
10113-844-760-1 = "真厲害呢，老師。"
10113-844-770-1 = "真的辛苦你了。"
