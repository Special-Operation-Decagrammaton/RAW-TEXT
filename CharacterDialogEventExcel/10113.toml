[translation]
10113-844-10-1 = "ようこそ、\nゲヘナ学園へ。"
10113-844-20-1 = "どうか平和な時間を\n過ごせますように。"
10113-844-30-1 = "……。"
10113-844-40-1 = "本心ですよ。"
10113-844-50-1 = "いらっしゃったの\nですね、先生。"
10113-844-60-1 = "今日は当番の日では\nありませんが、"
10113-844-70-1 = "警戒を怠ることは\nありません。"
10113-844-80-1 = "これは\n興味深い死た……"
10113-844-90-1 = "失礼。"
10113-844-100-1 = "なかなかおもしろ……"
10113-844-110-1 = "これも失礼でしたね。"
10113-844-120-1 = "そろそろ\n急がなければ\nなりません。"
10113-844-130-1 = "一刻も早く、収束して\nほしいのですが……"
10113-844-140-1 = "……。"
10113-844-150-1 = "できればもう少し\n面白いものが\n見れたら、なんて。"
10113-844-160-1 = "……今のは冗談です。\n本当ですから。"
10113-844-170-1 = "対応完了ですね。"
10113-844-180-1 = "お疲れ様でした、先生。"
10113-844-190-1 = "休日であろうと、\n救急医学部の所属である\nことに変わりはないです。"
10113-844-200-1 = "ゲヘナ学園では\nたくさんの出来事が\n起こります。"
10113-844-210-1 = "……結構、楽しい\n場所ですよ。"
10113-844-220-1 = "この服、似合って\nいるでしょうか？"
10113-844-230-1 = "……そんなことを\n聞くなんて新鮮？"
10113-844-240-1 = "雑誌にあった\n台詞だったのですが……"
10113-844-250-1 = "先生にそう思って\nいただけたのなら\n言った甲斐がありました。"
10113-844-260-1 = "次にゲヘナに\n来る際は、"
10113-844-270-1 = "私にご連絡頂けると\n嬉しいです。"
10113-844-280-1 = "その方が、一番\n安全でしょうから。"
10113-844-600-1 = "こんにちは、先生。"
10113-844-610-1 = "何が起こるか\n分からないという\n意味で、"
10113-844-620-1 = "応急処置とこの場所は\n似ているのかも\nしれません。"
10113-844-630-1 = "いらっしゃったの\nですね、先生。"
10113-844-640-1 = "幸運と健康がおそばに\nありますように。"
10113-844-650-1 = "やり残したことは\nありませんか？"
10113-844-660-1 = "私も最後まで\nお付き合いします。"
10113-844-670-1 = "偶然はお好きですか？\n先生。"
10113-844-680-1 = "私は、それなりに\n好きですよ。"
10113-844-690-1 = "幸運を願うより、\n不運に備えるべきと\n言いますよね。"
10113-844-700-1 = "応急処置において\n備えは重要です。"
10113-844-710-1 = "私にお任せください。"
10113-844-720-1 = "おめでとうございます、\n先生。"
10113-844-730-1 = "良さそうな品ですね。"
10113-844-740-1 = "なるほど。\nそれが当たりなのですね。"
10113-844-750-1 = "私にも見せていただけますか？\nとても興味深いです。"
10113-844-760-1 = "すごいですね、先生。"
10113-844-770-1 = "本当にお疲れ様でした。"
