[translation]
10113-844-10-1 = "Welcome to Gehenna, Sensei."
10113-844-20-1 = "I hope you have a safe stay here."
10113-844-30-1 = "..."
10113-844-40-1 = "I mean it."
10113-844-50-1 = "You're here, Sensei."
10113-844-60-1 = "I'm off duty today,"
10113-844-70-1 = "but I'm never going to let my guard down."
10113-844-80-1 = "This is quite an interesting corpse..."
10113-844-90-1 = "Excuse me."
10113-844-100-1 = "Ridiculous, but very interesting..."
10113-844-110-1 = "Excuse me for that too."
10113-844-120-1 = "...An URGENT SITUATION, it seems like."
10113-844-130-1 = "Rationally speaking, I should be hoping all of this blows over quickly."
10113-844-140-1 = "..."
10113-844-150-1 = "But I wish I could take in more of it first."
10113-844-160-1 = "That was a joke. Really."
10113-844-170-1 = "Emergency over."
10113-844-180-1 = "Good work, Sensei."
10113-844-190-1 = "Even when I'm on a day off, the Medical Emergency Club always has the same duty."
10113-844-200-1 = "This is my academy, a place where many things happen."
10113-844-210-1 = "...Overall, it's quite an enjoyable place for me."
10113-844-220-1 = "Do these clothes look good on me?"
10113-844-230-1 = "Hmm? You're not used to hearing me say that?"
10113-844-240-1 = "I just read it in a magazine someone recommended to me."
10113-844-250-1 = "But if I made you feel something, I'm glad."
10113-844-260-1 = "If you plan on visiting Gehenna on your next day off,"
10113-844-270-1 = "I would appreciate it if you'd get a hold of me first."
10113-844-280-1 = "That would be the safest way."
10113-844-600-1 = "Hello, Sensei. This is Himuro Sena."
10113-844-610-1 = "When it comes to unpredictability,"
10113-844-620-1 = "this place is something like an emergency."
10113-844-630-1 = "Welcome, Sensei."
10113-844-640-1 = "I hope that fortune and good health will always be with you."
10113-844-650-1 = "Was there anything else?"
10113-844-660-1 = "I'll support you until the end."
10113-844-670-1 = "Do you like coincidences, Sensei?"
10113-844-680-1 = "I tend to like them."
10113-844-690-1 = "They say it's better to be prepared for bad luck than to hope for good luck."
10113-844-700-1 = "Prevention is also important in emergency medicine."
10113-844-710-1 = "Leave it to me."
10113-844-720-1 = "Congratulations, Sensei."
10113-844-730-1 = "That looks interesting."
10113-844-740-1 = "I see, so that's the prize."
10113-844-750-1 = "Could I see it? I'm curious."
10113-844-760-1 = "Incredible, Sensei."
10113-844-770-1 = "Thank you for all your hard work."
