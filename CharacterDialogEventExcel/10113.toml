[translation]
10113-844-10-1 = "ยินดีต้อนรับสู่\nเกเฮนน่าค่ะ คุณครู"
10113-844-20-1 = "ขอให้ได้ใช้เวลา\nอย่างปลอดภัยนะคะ"
10113-844-30-1 = "..."
10113-844-40-1 = "ฉันพูดจริงนะคะ"
10113-844-50-1 = "มาแล้วเหรอคะคุณครู"
10113-844-60-1 = "วันนี้ฉันเวรออฟ"
10113-844-70-1 = "ฉันจะไม่การ์ดตก\nไม่ว่าจะตอนไหนค่ะ"
10113-844-80-1 = "นี่เป็นศพที่\nน่าสนใจทีเดียว..."
10113-844-90-1 = "ขอโทษค่ะ"
10113-844-100-1 = "ขอโทษที่ฉันเหลวไหล\nและอยากรู้อยากเห็น..."
10113-844-110-1 = "มากเกินเหตุด้วยค่ะ"
10113-844-120-1 = "เป็นสถานการณ์\nฉุกเฉินเลยนะคะ"
10113-844-130-1 = "ตามจรรยาบรรณแล้ว\nฉันควรหวังว่า\nสถานการณ์นี้จะ\nจบลงได้อย่างรวดเร็ว"
10113-844-140-1 = "..."
10113-844-150-1 = "แต่ฉันอยากดู\nทัศนียภาพที่สนุก\nต่ออีกหน่อยค่ะ"
10113-844-160-1 = "ล้อเล่นค่ะ\nเชื่อฉันเถอะนะคะ"
10113-844-170-1 = "สิ้นสุดสถานการณ์ฉุกเฉินค่ะ"
10113-844-180-1 = "คุณครูก็\nทำได้ดีมากเลยค่ะ"
10113-844-190-1 = "ไม่ว่าจะวันหยุดหรือวันไหนๆ\nงานของชมรมหน่วยแพทย์ฉุกเฉิน\nก็ไม่เปลี่ยนแปลงค่ะ"
10113-844-200-1 = "ที่นี่คือโรงเรียนของฉัน\nและเป็นที่ที่มีเรื่องเกิดขึ้น\nมากมายเลยค่ะ"
10113-844-210-1 = "โดยรวมแล้ว...\nเป็นสถานที่ที่\nน่าสนุกสำหรับฉันค่ะ"
10113-844-220-1 = "ชุดของฉัน... เข้ากับฉันมั้ยคะ?"
10113-844-230-1 = "รู้สึกแปลกใหม่\nที่ฉันพูดอะไรแบบนั้นเหรอคะ?"
10113-844-240-1 = "เป็นคำที่ฉันอ่านเจอ\nจากนิตยสารที่\nคนรอบตัวแนะนำให้น่ะค่ะ"
10113-844-250-1 = "แต่ถ้าคุณครูรู้สึกได้ถึง\nความแปลกใหม่จากฉัน\nก็คุ้มค่าอยู่นะคะ"
10113-844-260-1 = "ถ้าวันหยุดครั้งหน้า\nคุณครูจะแวะมาที่\nเกเฮนน่าละก็"
10113-844-270-1 = "อยากให้ติดต่อ\nมาบอกฉันก่อนค่ะ"
10113-844-280-1 = "แบบนั้นจะปลอดภัย\nมากที่สุดน่ะค่ะ"
10113-844-600-1 = "สวัสดีค่ะ คุณครู\nฮิมูโระ เซนะเองค่ะ"
10113-844-610-1 = "ในแง่ของการไม่รู้\nว่าจะได้อะไรแล้ว"
10113-844-620-1 = "ตรงนี้ก็ถือว่า\nก็มีส่วนคล้ายกับ\nสถานการณ์ฉุกเฉินนะคะ"
10113-844-630-1 = "ยินดีต้อนรับค่ะ คุณครู"
10113-844-640-1 = "ขอให้โชคและสุขภาพดี\nอยู่กับคุณครู\nไปตลอดนะคะ"
10113-844-650-1 = "มีอะไรเหลือ\nหรือเปล่าคะ?"
10113-844-660-1 = "ฉันจะเป็นผู้ช่วย\nจนเสร็จงานเลยค่ะ"
10113-844-670-1 = "ชอบความบังเอิญมั้ยคะ\nคุณครู?"
10113-844-680-1 = "ฉันค่อนข้าง\nชอบเลยค่ะ"
10113-844-690-1 = "ว่ากันว่าการรับมือกับโชคร้าย\nย่อมดีกว่าการคาดหวัง\nว่าจะโชคดีค่ะ"
10113-844-700-1 = "การป้องกันก็เป็นสิ่งสำคัญ\nเพื่อไม่ให้เกิดเหตุฉุกเฉินค่ะ"
10113-844-710-1 = "ให้เป็นหน้าที่ฉันเองค่ะ"
10113-844-720-1 = "ยินดีด้วยค่ะ คุณครู"
10113-844-730-1 = "เป็นของที่ดูดีเลยนะคะ"
10113-844-740-1 = "สุ่มได้อันนี้สินะคะ"
10113-844-750-1 = "ขอให้ฉันดูด้วยได้มั้ยคะ?\nชักจะอยากรู้แล้วสิ"
10113-844-760-1 = "น่าทึ่งจังเลยค่ะ คุณครู"
10113-844-770-1 = "ทำได้ดีมากเลยค่ะ"
