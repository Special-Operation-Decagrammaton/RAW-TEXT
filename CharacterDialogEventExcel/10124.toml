[translation]
10124-848-520-1 = "I didn't expect to come to the beach like this."
10124-848-530-1 = "Hm? I look excited?"
10124-848-540-1 = "Fufu, perhaps so."
10124-848-550-1 = "The mission hasn't changed, but the change in location brings a fresh feeling to it."
10124-848-560-1 = "So I'm looking forward to the next couple of days."
10124-848-570-1 = "Ah, Sensei. Have you seen Ichika and Mika by any chance?"
10124-848-580-1 = "I haven't seen hide nor tail of them."
10124-848-590-1 = "Could...something have happened to them?"
10124-848-600-1 = "Even if you tell me to not worry and just enjoy..."
10124-848-610-1 = "Well, I'll trust your words, Sensei."
10124-848-620-1 = "I can't believe all that happened right under my nose."
10124-848-630-1 = "I am bit ashamed. I was so caught up in enjoying myself that I neglected my duties."
10124-848-640-1 = "You're glad I had fun?"
10124-848-650-1 = "Only you would say that to me, Sensei."
10124-848-660-1 = "Perhaps not exactly according to plan, but things still ended well."
10124-848-670-1 = "You played an instrumental role in that, Sensei."
10124-848-680-1 = "As a representative of the Justice Task Force, I would like to thank you once again."
10124-848-690-1 = "Our Ichika has grown a little as well."
10124-848-700-1 = "On a personal level, I'd also like to thank you for that."
10124-848-710-1 = "Due to our own internal affairs, we're in your debt."
10124-848-720-1 = "Even if you tell me to not worry about it..."
10124-848-730-1 = "Well, I suppose that's what I'd expect you to say."
10124-848-740-1 = "But I wanted to express how I felt, at the very least."
10124-848-750-1 = "Thank you. Truly."
10124-848-760-1 = "This event meant a lot to the Justice Task Force as a whole."
10124-848-770-1 = "Because one day, she'll have to serve in this role on her own."
10124-848-780-1 = "As you already know, public affairs are not Tsurugi's specialty."
10124-848-790-1 = "Because of that, I ended up..."
10124-848-800-1 = "...becoming the main point of communication with the Tea Party."
10124-848-810-1 = "...Thinking about it, I've been serving those three for quite some time now."
10124-848-820-1 = "To be honest, I'd given up on ever being able to visit the beach."
10124-848-830-1 = "I really should thank Mika for this."
