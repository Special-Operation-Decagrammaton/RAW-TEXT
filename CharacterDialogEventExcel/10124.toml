[translation]
10124-848-520-1 = "ไม่คิดเลยนะคะว่าจะได้\nมาทะเลด้วยวิธีนี้"
10124-848-530-1 = "คะ? ฉันดูตื่นเต้นเหรอคะ?"
10124-848-540-1 = "ฮุฮุ บางทีก็อาจจะ\nเป็นอย่างนั้นก็ได้นะคะ"
10124-848-550-1 = "ต่อให้เป็นภารกิจเดิม แต่ถ้า\nเปลี่ยนสถานที่ ความรู้สึกก็\nเปลี่ยนได้ขนาดนี้เลยนะคะ"
10124-848-560-1 = "ฉันเริ่มตั้งตารอ\nภารกิจต่อไปแล้วละค่ะ"
10124-848-570-1 = "อ๊ะ คุณครู เห็นอิจิกะ\nกับคุณมิกะบ้างมั้ยคะ?"
10124-848-580-1 = "ฉันไม่เห็น\nมาสักพักแล้วน่ะค่ะ"
10124-848-590-1 = "จะมีปัญหาอะไร\nเกิดขึ้นหรือเปล่าคะ?"
10124-848-600-1 = "ต่อให้บอกฉันว่าอย่ากังวล\nแล้วไปเล่นสนุกก็เถอะ..."
10124-848-610-1 = "แต่คำพูดของคุณครู\nก็น่าจะถูกต้องละค่ะ"
10124-848-620-1 = "คิดไม่ถึงเลยค่ะ\nว่าจะเกิดเรื่องวุ่นวายแบบนั้น"
10124-848-630-1 = "ฉันเหมือนจะลืมหน้าที่หลัก\nแล้วไปสนุกอยู่อย่างเดียวเลย\nน่าอายจังเลยค่ะ"
10124-848-640-1 = "ค่อยยังชั่วที่ฉัน\nได้สนุกสนานงั้นเหรอคะ?"
10124-848-650-1 = "คนที่พูดแบบนั้นกับฉัน\nมีแค่คุณครูคนเดียว\nเท่านั้นค่ะ"
10124-848-660-1 = "ถึงจะต่างจากแผนไปบ้าง\nแต่ภารกิจนี้ก็จบลง\nอย่างราบรื่นนะคะ"
10124-848-670-1 = "คุณครูช่วยไว้ได้\nเยอะมากเลยค่ะ"
10124-848-680-1 = "ฉันขอขอบคุณอีกครั้งค่ะในฐานะ\nตัวแทนชมรมทวงความยุติธรรมค่ะ"
10124-848-690-1 = "อิจิกะของพวกเราก็\nดูจะเปลี่ยนไปนิดหน่อยด้วยค่ะ"
10124-848-700-1 = "ฉันขอขอบคุณ\nเป็นการส่วนตัวนะคะ"
10124-848-710-1 = "เราติดหนี้บุญคุณคุณครู\nด้วยเหตุผลภายใน\nของพวกเราค่ะ"
10124-848-720-1 = "ต่อให้จะบอกว่า\nไม่ต้องใส่ใจก็เถอะ..."
10124-848-730-1 = "ฉันรู้ว่าคุณครู\nจะพูดอย่างนั้น\nอยู่แล้วค่ะ"
10124-848-740-1 = "อย่างน้อยฉันก็\nอยากจะพูดคำคำนั้นค่ะ"
10124-848-750-1 = "ขอบคุณจริงๆ นะคะ..."
10124-848-760-1 = "แผนการนี้ก็มีความหมาย\nกับชมรมทวงความยุติธรรม\nมากเลยค่ะ"
10124-848-770-1 = "สักวันหนึ่ง\nเด็กคนนั้นต้องทำงาน\nเลขาฯ คนเดียวน่ะค่ะ"
10124-848-780-1 = "ซึรุกิไม่เหมาะกับการ\nทำงานกับภายนอก\nอย่างที่ทราบมาค่ะ"
10124-848-790-1 = "เพราะอย่างนั้น\nงานเกี่ยวกับสภาน้ำชา"
10124-848-800-1 = "ส่วนมากจะเป็นฉัน\nที่ได้รับผิดชอบน่ะค่ะ"
10124-848-810-1 = "พอคิดแบบนั้น...\nก็นานแล้วนะคะ\nที่ฉันทำงานให้ 3 คนนั้น"
10124-848-820-1 = "ที่จริงฉันเลิกคิด\nไปแล้วค่ะว่ามาทะเล\nแล้วจะได้เล่นสนุกสนาน"
10124-848-830-1 = "คงจะต้องไปขอบคุณ\nคุณมิกะแล้วละค่ะ"
