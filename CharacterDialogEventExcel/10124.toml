[translation]
10124-848-520-1 = "まさか、海に\n来られるだなんて\n思いもしませんでした。"
10124-848-530-1 = "え？楽しそう？"
10124-848-540-1 = "ふふっ、ご想像に\nお任せします。"
10124-848-550-1 = "場所が違えば、任務への\n気持ちも変わって\nくるものですね。"
10124-848-560-1 = "少しだけ、\nこれからの事が\n楽しみです。"
10124-848-570-1 = "あ、先生。\nミカ様とイチカを\n見かけませんでしたか？"
10124-848-580-1 = "先ほどから姿が\n見えなくて。"
10124-848-590-1 = "面倒事に\n巻き込まれてないと\nいいのですが……。"
10124-848-600-1 = "心配しなくて大丈夫……？"
10124-848-610-1 = "先生が仰るなら、\n信じますが……。"
10124-848-620-1 = "まさか、裏で\nあのような騒動が\nあっただなんて。"
10124-848-630-1 = "気付けなかった\n自分が恥ずかしいです。"
10124-848-640-1 = "楽しめてたなら\nそれでいい……？"
10124-848-650-1 = "私にそんなことを\n言ってくれるのは、\n先生だけでしょうね。"
10124-848-660-1 = "イレギュラーは\nありましたが、今回の\n任務も無事終了しました。"
10124-848-670-1 = "先生が\n手助けして下さった\nおかげです。"
10124-848-680-1 = "正義実現委員会を\n代表して、改めて\nお礼申し上げます。"
10124-848-690-1 = "イチカも、少しは\n変わったようですし。"
10124-848-700-1 = "本当にありがとう\nございました。"
10124-848-710-1 = "今回も、先生を\n頼る結果になって\nしまいましたね。"
10124-848-720-1 = "気にするな、ですか……"
10124-848-730-1 = "先生の事ですから、\nそうおっしゃると\n思っていましたが……。"
10124-848-740-1 = "せめて、気持ちだけでも\n受け取ってください。"
10124-848-750-1 = "本当に、ありがとう\nございます。"
10124-848-760-1 = "正義実現委員会に\nとっても、今回の計画は\n重要な意味を持ちます。"
10124-848-770-1 = "あの子も、いつかは\n独り立ちする\nことになりますから。"
10124-848-780-1 = "ご存知の通り、\nツルギは折衝や交渉を\n不得手としています。"
10124-848-790-1 = "ですので、\nティーパーティーとの\n連絡も、"
10124-848-800-1 = "主に私が\n担当することに\nなっているんです。"
10124-848-810-1 = "……思えば、あの\nお三方との付き合いも\n長くなったものです。"
10124-848-820-1 = "本当は……\n海に来るのを\n諦めていたんです。"
10124-848-830-1 = "ミカ様には、\n感謝しないとですね。"
