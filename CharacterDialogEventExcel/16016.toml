[translation]
16016-841-320-1 = "Hello, Sensei."
16016-841-330-1 = "You came here to see me— I mean, the stage, right?"
16016-841-340-1 = "I've been waiting, Sensei."
16016-841-350-1 = "This seat is just for you. Please make yourself at home."
16016-841-360-1 = "The show is still going on. Please focus!"
16016-841-370-1 = "Please listen until the very end."
16016-841-380-1 = "Heehee, that was a great show."
16016-841-390-1 = "Sensei... Is there a problem?"
16016-841-400-1 = "Is this also...a part of fan service?"
16016-841-410-1 = "If you enjoyed it, that's enough."
16016-841-420-1 = "Ah, ah, ah."
16016-841-430-1 = "..I was doing vocal warm-ups, so I'd be prepared to sing at any moment."
