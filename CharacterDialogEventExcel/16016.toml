[translation]
16016-841-320-1 = "สวัสดีค่ะ คุณครู"
16016-841-330-1 = "ไม่ได้มาดูฉัน...\nแต่มาดูการแสดงสินะคะ?"
16016-841-340-1 = "กำลังรออยู่เลยค่ะ\nคุณครู"
16016-841-350-1 = "ฉันเตรียมที่นั่งไว้ให้แล้ว\nเชิญนั่งได้ตามสบายเลยนะคะ"
16016-841-360-1 = "การแสดงยังคงดำเนินต่อไป\nช่วยจดจ่อกับการแสดงด้วยนะคะ!"
16016-841-370-1 = "ช่วยฟังจนจบเพลงสุดท้าย\nแล้วค่อยกลับนะคะ"
16016-841-380-1 = "ฮุฮุ เป็นการแสดง\nที่สุดยอดมากเลยค่ะ"
16016-841-390-1 = "คุณครู...\nมีเรื่องอะไรเหรอคะ?"
16016-841-400-1 = "นี่ก็เป็นแฟนเซอร์วิส\nอย่างหนึ่ง... เหรอคะ?"
16016-841-410-1 = "ถ้าคุณครูชอบ\nแค่นั้นก็เพียงพอแล้วค่ะ"
16016-841-420-1 = "อ่า~ อ่า~ อ่า~"
16016-841-430-1 = "ฉันกำลังฝึกออกเสียง\nเตรียมพร้อมเพื่อจะ\nร้องเพลงได้ตลอดค่ะ"
