[translation]
16016-841-320-1 = "こんにちは、先生。"
16016-841-330-1 = "私…ではなく、ステージを\n見に来られたのですよね。"
16016-841-340-1 = "お待ちしておりました、\n先生。"
16016-841-350-1 = "お席をご用意して\nおります。どうぞ\nおかけください。"
16016-841-360-1 = "ステージは\n続いておりますよ、\n集中してください！"
16016-841-370-1 = "最後まで、\n聞いていって\nくださいね。"
16016-841-380-1 = "ふふ、とても素敵な\nステージでした。"
16016-841-390-1 = "先生……\nなにか御用でしょうか？"
16016-841-400-1 = "これもファンサービス…\nなのでしょうか？"
16016-841-410-1 = "先生に楽しんで\nいただけたのなら、\nそれで十分です。"
16016-841-420-1 = "あ、あ―、あ―。"
16016-841-430-1 = "……いつでも歌えるよう、\n発声練習を\nしておりました。"
