[translation]
10028-806-220-1 = "어서 와, 주인님!\n토끼들이 기다리고 있어!"
10028-806-230-1 = "아스나와 함께!\n자, 출발-!"
10028-806-240-1 = "빨리 끝내면 놀 수 있겠지?"
10028-806-250-1 = "마지막까지 신나게 놀자!"
10028-806-260-1 = "아, 주인님! 여기 여기!"
10028-806-270-1 = "주인님-! 아스나랑 놀자! 응?"
10028-806-280-1 = "아, 주인님, 얏호!"
10028-806-290-1 = "같이 아무 의미 없이\n달려 보지 않을래?\n분명 즐거울 거야!"
10028-806-300-1 = "응, 뭐야뭐야?\n그런 새로운 놀이?"
10028-806-310-1 = "그러면 나도 주인님,\n원하는 만큼 손대도 돼?"
10028-806-320-1 = "아, 주인님!\n주인님이 올 때까지\n심심했다구~"
10028-806-330-1 = "그러니깐, 지금부터\n같이 재밌게 놀자!"
10028-806-450-1 = "즐거운 복불복 시간이야,\n주인님!"
10028-806-460-1 = "두근두근두근두근두근~!"
10028-806-470-1 = "아직 여긴 들어가도 되나봐!"
10028-806-480-1 = "아하하하!\n어딜 보는 거야?"
10028-806-490-1 = "뭐가 나올까~?\n슬슬 긴장되는데!"
10028-806-500-1 = "우와아아아아!!\n대박 대박\n역시 주인님이야!!"
10028-806-510-1 = "와우!\n역시 주인님이야!"
10028-806-520-1 = "쨔안-!"
10028-806-530-1 = "……엣, 어라!?"
10028-806-540-1 = "아하하하!\n이게 뭐야~ 이상해~!"
