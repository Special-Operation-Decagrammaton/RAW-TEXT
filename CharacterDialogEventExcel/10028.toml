[translation]
10028-806-220-1 = "ご主人様、ようこそ！\nバニーさんたちが\nお出迎えだよ！"
10028-806-230-1 = "じゃあアスナと一緒に、\n出発進行ー！"
10028-806-240-1 = "早く終わったら、\nその分遊んでも良いよね？"
10028-806-250-1 = "最後まで楽しく遊ぼう！"
10028-806-260-1 = "あっ、ご主人様！\nこっちこっち！"
10028-806-270-1 = "ご主人様ー！\nアスナと遊ぼう！ね？"
10028-806-280-1 = "あ、ご主人様、やっほー！"
10028-806-290-1 = "一緒に意味も無く\nその辺走らない？\nきっと楽しいよ！"
10028-806-300-1 = "ん、なになに？\nそういう新しい遊び？"
10028-806-310-1 = "じゃあ私も\nご主人様のこと、\n好きなだけ触っても良い？"
10028-806-320-1 = "あ、ご主人様！\nご主人様が来るまで\n退屈だったよ～。"
10028-806-330-1 = "だから、今から\n一緒に楽しく遊ぼうっ！"
10028-806-450-1 = "楽しい運試しの時間だよ、\nご主人様！"
10028-806-460-1 = "ドキドキしてきた～！"
10028-806-470-1 = "まだまだこっちは\n入っても良いみたいだね！"
10028-806-480-1 = "あはっ。ねぇねぇ、\nどこ見てるの～？"
10028-806-490-1 = "何が出るかな～？\nちょっと緊張してきた！"
10028-806-500-1 = "わーーーーっ！！\nすごいすごい、\nさっすがご主人様！"
10028-806-510-1 = "おーっ！\nさすがはご主人様だね！"
10028-806-520-1 = "じゃーん！"
10028-806-530-1 = "……って、あれ？"
10028-806-540-1 = "あはっ！何これ変なの～！"
