[translation]
10028-806-220-1 = "主人，歡迎你！\n兔子小姐們\n出來迎接你了唷！"
10028-806-230-1 = "就跟明日奈一起，\n出發──！"
10028-806-240-1 = "早點做完的話，\n就可以玩久一點對吧？"
10028-806-250-1 = "開心地玩到最後吧！"
10028-806-260-1 = "啊，主人！這裡這裡！"
10028-806-270-1 = "主人～！\n和明日奈一起玩吧！吶？"
10028-806-280-1 = "啊，主人，呀齁～！"
10028-806-290-1 = "要不要一起漫無目的地\n在那裡跑一跑？\n一定會很開心的唷！"
10028-806-300-1 = "嗯，什麼什麼？\n要玩那種新遊戲嗎？"
10028-806-310-1 = "那我也可以\n隨意摸主人嗎？"
10028-806-320-1 = "啊，主人！\n主人來之前\n我好無聊唷～"
10028-806-330-1 = "所以，從現在開始\n一起開心地玩吧！"
10028-806-450-1 = "是開心的試手氣時間唷，\n主人！"
10028-806-460-1 = "我都興奮起來了～！"
10028-806-470-1 = "看來這裡還可以進去呢！"
10028-806-480-1 = "啊哈，吶吶，\n你在看哪裡呀～？"
10028-806-490-1 = "會出現什麼呢～？\n有點緊張起來了！"
10028-806-500-1 = "哇────！！\n好厲害好厲害，\n真不愧是主人！"
10028-806-510-1 = "哦～！\n不愧是主人呢！"
10028-806-520-1 = "鏘──！"
10028-806-530-1 = "……呃，咦？"
10028-806-540-1 = "啊哈！\n那是什麼，好奇怪～！"
10028-10806-220-1 = "主人，歡迎！\n兔子們來迎接你了！"
10028-10806-230-1 = "那就和明日奈一起，\n出發吧──！"
10028-10806-240-1 = "早點結束的話，\n可以玩那個吧？"
