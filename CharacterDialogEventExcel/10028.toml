[translation]
10028-806-220-1 = "เชิญเลยค่ะนายท่าน!\nกระต่ายแสนน่ารักกำลังรออยู่ค่ะ!"
10028-806-230-1 = "ออกเดินทางกันเถอะ!\nไปพร้อมกับอาสึนะ!"
10028-806-240-1 = "ถ้าเสร็จงานเร็วก็ไปเที่ยวได้ใช่ไหม?"
10028-806-250-1 = "มาเล่นสนุกให้เต็มที่เลย!"
10028-806-260-1 = "อ๊ะ นายท่าน!\nทางนี้ๆ ทางนี้!"
10028-806-270-1 = "นายท่าน-!\nมาเล่นกับอาสึนะเถอะ!"
10028-806-280-1 = "อ๊ะ นายท่าน! ยะฮู้ว~!"
10028-806-290-1 = "ไปวิ่งให้สนุกสุด\nเหวี่ยงกันเลยดีไหม?\nต้องสนุกมากแน่ๆ เลย!"
10028-806-300-1 = "หือ อะไรน่ะ?\nจะเล่นแบบนั้นเหรอ?"
10028-806-310-1 = "ถ้างั้นอาสึนะเอง...\nก็ลูบๆ นายท่านเท่าที่\nอยากลูบได้เลยเหรอ?"
10028-806-320-1 = "อ๊ะ นายท่าน!\nตอนนายท่านยังไม่มา\nน่าเบื่อมากเลยล่ะ~"
10028-806-330-1 = "เพราะงั้นตอนนี้\nเรามาเล่นให้สนุก\nสุดเหวี่ยงกันเลยเถอะ!"
10028-806-450-1 = "ได้เวลาการสุ่มแสนสนุกแล้ว\nนายท่าน!"
10028-806-460-1 = "ตึกตัก ตึกตัก ตึกตัก~!"
10028-806-470-1 = "ดูเหมือนจะลองได้อีกนะ!"
10028-806-480-1 = "ฮ่ะฮ่ะฮ่า!\nมองทางไหนอยู่น่ะ?"
10028-806-490-1 = "จะมีอะไรออกมานะ~?\nตื่นเต้นจังเลย!"
10028-806-500-1 = "ว้าวววววว!!\nสุดยอดเลย\nสมกับเป็นนายท่านจริงๆ!"
10028-806-510-1 = "ว้าววว!\nสมกับเป็นนายท่านเลยล่ะ!"
10028-806-520-1 = "แต่นแต๊น~!"
10028-806-530-1 = "เอ๋...? เอ๋…!?"
10028-806-540-1 = "ฮ่ะฮ่ะฮ่า!\nอะไรกันเนี่ย~"
