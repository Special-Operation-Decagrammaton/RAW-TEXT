10097-10827-770-1 = "まぁ、\n普段用じゃないことは\n間違いないね。くひひ…"
10097-900827-10-1 = "これはあくまでも事件の\n調査のための潜入作戦……\n無事に終わると\nいいのですが。"
10097-900827-20-1 = "RABBIT1。\n作戦準備完了しました。\n先生、指示を。"
10097-900827-30-1 = "最後にエビがたっぷり\n入ったサンドイッチを\n食べたのは、\nいつだったのでしょう。"
10097-900827-40-1 = "（あまり、\n浮かれている感じに\n見えませんように……）"
10097-900827-50-1 = "不在の間、\nぴょんこのお世話は、"
10097-900827-60-1 = "ヴァルキューレ\n生活安全局の\n皆さんに\nお願いしています。"
10097-900827-70-1 = "たまに、ぴょんこが\nRABBIT小隊より"
10097-900827-80-1 = "生活安全局の皆さんに\n懐いているように見えて、\n少し寂しくも\nありますが……"
10097-900827-90-1 = "RABBIT小隊初の\n遠征作戦か……\n少し心が躍っている。"
10097-900827-100-1 = "今こそ、\n私たちSRTの出番だな！"
10097-900827-110-1 = "RABBIT2、準備完了！\nいつでもいけるぞ！"
10097-900827-120-1 = "一応、普通の観光客っぽい\n格好をしてみたんだが……"
10097-900827-130-1 = "怪しまれたり……\nしないよな？"
10097-900827-140-1 = "あの……先生、\n私のお腹に、\nなにかついてるのか？"
10097-900827-150-1 = "私、実は海産物は\nあまり好きじゃないんだ。\n保存が難しいからな。"
10097-900827-160-1 = "ああでも、乾燥イカ\nみたいな干物なら……\n私も好きだぞ！"
10097-900827-170-1 = "ひぃ……\nホラー小説に出てくる\n漁村みたい……"
10097-900827-180-1 = "早く学園に戻りたい……"
10097-900827-190-1 = "あ、私たちの学園は、\nもう……"
10097-900827-200-1 = "も、も、もしかして\nお呼びですか……？"
10097-900827-210-1 = "（どうして\nこんなへんぴな村まで\n来てしまったのかな……）"
10097-900827-220-1 = "この髪型、\nミヤコちゃんが\n作戦に出る直前に\n編んでくれたんです。"
10097-900827-230-1 = "ふふっ……これ、\n可愛いかも……"
10097-900827-240-1 = "スズメも、イタチも、\nカモメも……。"
10097-900827-250-1 = "野生の動物たちが\n私に寄ってくる理由は\nなんなんでしょう……？"
10097-900827-260-1 = "ここがエビで\n有名な夜戸浦村…"
10097-900827-270-1 = "実際に来てみたのは、\n初めてかも。"
10097-900827-280-1 = "一体、この村で\n何が起きてるの？"
10097-900827-290-1 = "霧のせいかな…？"
10097-900827-300-1 = "夏なのにちょっと寒い…"
10097-900827-310-1 = "うーん。たしかに、\nどこか破滅の\n匂いがするような…"
10097-900827-320-1 = "SRTの作戦とはいえ、"
10097-900827-330-1 = "夏の海って\nいつもと違うから\n気分転換になるね。"
10097-900827-340-1 = "この浮き輪が怪しい？"
10097-900827-350-1 = "まぁ、\n普段用じゃないことは\n間違いないね。くひひ…"
