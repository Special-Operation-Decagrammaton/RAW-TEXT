[translation]
10097-827-620-1 = "This is Yatoura Village, renowned as the birthplace of shrimp..."
10097-827-630-1 = "This is my first time visiting in person."
10097-827-640-1 = "What exactly is going on in this village?"
10097-827-650-1 = "You mean about the Deep Ones...?"
10097-827-660-1 = "If the rumors are true, what magnitude of explosion could they withstand?"
10097-827-670-1 = "That kusaya... Is it the fermentation process that makes it smell so much?"
10097-827-680-1 = "I want to try making it... Heehee"
10097-827-690-1 = "Heehee. Now..."
10097-827-700-1 = "I wonder if I'll be able to taste that delicious basil shrimp sandwich again?"
10097-827-710-1 = "Is it because of the fog...?"
10097-827-720-1 = "It's summer, but there's a bit of a chill..."
10097-827-730-1 = "Hm, 100% percent. I can smell a sense of doom from somewhere..."
10097-827-740-1 = "Even though it's for an SRT operation..."
10097-827-750-1 = "It feels nice and refreshing to be out by the sea in the summer."
10097-827-760-1 = "You think this tube looks suspicious?"
10097-827-770-1 = "Well, it's not your everyday float used for water play. Heehee..."
