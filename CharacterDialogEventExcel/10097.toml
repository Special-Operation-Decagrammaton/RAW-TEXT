[translation]
10097-827-620-1 = "這裡就是以蝦子聞名的夜戶浦村…"
10097-827-630-1 = "這還是第一次實地造訪呢。"
10097-827-640-1 = "這個村子到底發生了什麼事？"
10097-827-650-1 = "「深處的存在」…"
10097-827-660-1 = "如果那個傳聞是真的，\n真的連超大炸彈也抵擋的了嗎？"
10097-827-670-1 = "「臭魚乾」光是發酵就能散發出那種味道嗎？"
10097-827-680-1 = "好想試做一次看看…\n咯嘻嘻。"
10097-827-690-1 = "呵呵，\n這下終於可以吃到"
10097-827-700-1 = "美味的羅勒鮮蝦三明治了吧？"
10097-827-710-1 = "是因為霧的關係嗎…？"
10097-827-720-1 = "明明是夏天卻有點冷…"
10097-827-730-1 = "唔嗯。\n確實有股毀滅的氣息…"
10097-827-740-1 = "雖然說是SRT的作戰，"
10097-827-750-1 = "但夏天的海和平時不一樣，\n有種轉換心情的感覺呢。"
10097-827-760-1 = "你說這個游泳圈很奇怪？"
10097-827-770-1 = "嘛，\n因為這不是常見的那種。\n咯嘻嘻…"
10097-10827-620-1 = "這裡就是以蝦子聞名的夜戶浦村…"
10097-10827-630-1 = "實際到這裡來\n好像還是第一次呢。"
10097-10827-640-1 = "究竟，這個村子裡\n發生了什麼呢？"
10097-10827-650-1 = "「深處的存在」……"
10097-10827-660-1 = "如果那個傳聞是真的，\n會連超大的炸彈\n也抵擋的了嗎？"
10097-10827-670-1 = "「臭魚乾」光是發酵\n就能散發出那種味道嗎？"
10097-10827-680-1 = "好像，有點想試做\n一次看看……咯嘻嘻。"
10097-10827-690-1 = "呵呵。這下終於……"
10097-10827-700-1 = "可以吃到好吃的\n羅勒鮮蝦三明治了吧？"
10097-10827-710-1 = "是因為霧的關係嗎……？"
10097-10827-720-1 = "明明是夏天卻有點冷……"
10097-10827-730-1 = "唔嗯。好像確實\n有股毀滅的氣息……"
10097-10827-740-1 = "雖然說是SRT的作戰，"
10097-10827-750-1 = "但夏天的海和平時不同，\n能轉換一下心情呢。"
10097-10827-760-1 = "這個游泳圈很奇怪？"
10097-10827-770-1 = "這個嘛，畢竟確實\n不是平時用的那種。\n咯嘻嘻……"
10097-900827-10-1 = "這終究只是為了\n調查事件的潛入作戰……\n希望能順利結束。"
10097-900827-20-1 = "RABBIT1，\n已完成作戰準備。\n老師，請下指示。"
10097-900827-30-1 = "最後一次吃到\n放滿蝦子的三明治\n是什麼時候呢。"
10097-900827-40-1 = "（小心不要\n讓人覺得\n很興奮……）"
10097-900827-50-1 = "我們不在的這段期間，\n蹦蹦的照顧"
10097-900827-60-1 = "交給了女武神\n生活安全局的大家。"
10097-900827-70-1 = "有時，我覺得蹦蹦\n比起RABBIT小隊，"
10097-900827-80-1 = "好像更喜歡\n生活安全局的大家，\n覺得有點難過……"
10097-900827-90-1 = "RABBIT小隊首次的\n遠征作戰啊……\n心情有點興奮。"
10097-900827-100-1 = "現在正是\n我們SRT出馬的時候！"
10097-900827-110-1 = "RABBIT2，準備完畢！\n隨時都能出發！"
10097-900827-120-1 = "我姑且也打扮得像\n普通的觀光客一樣了……"
10097-900827-130-1 = "看起來……\n應該不會很奇怪吧？"
10097-900827-140-1 = "那個……老師，\n我的肚子上沾到\n什麼東西了嗎？"
10097-900827-150-1 = "我，其實\n不是很喜歡海產。\n因為很難保存。"
10097-900827-160-1 = "啊啊不過，像魷魚乾\n之類的乾貨的話……\n我也很喜歡！"
10097-900827-170-1 = "噫噫……\n簡直就像恐怖小說裡\n會出現的漁村一樣……"
10097-900827-180-1 = "好想趕快回學園去……"
10097-900827-190-1 = "啊，可是我們的\n學園已經……"
10097-900827-200-1 = "難，難，難道\n你找我嗎……？"
10097-900827-210-1 = "（為什麼會跑到這種\n偏僻的村莊呢……）"
10097-900827-220-1 = "這個髮型，是都子醬在\n作戰出發前幫我綁的。"
10097-900827-230-1 = "呵呵……這個髮型，\n好像有點可愛……"
10097-900827-240-1 = "從麻雀、黃鼠狼\n到海鷗……"
10097-900827-250-1 = "野生的動物們\n跑到我身邊的理由\n究竟是什麼呢……"
10097-900827-260-1 = "這裡就是以蝦子聞名的夜戶浦村…"
10097-900827-270-1 = "實際到這裡來\n好像還是第一次呢。"
10097-900827-280-1 = "究竟，這個村子裡\n發生了什麼呢？"
10097-900827-290-1 = "是因為霧的關係嗎……？"
10097-900827-300-1 = "明明是夏天卻有點冷……"
10097-900827-310-1 = "唔嗯。好像確實\n有股毀滅的氣息……"
10097-900827-320-1 = "雖然說是SRT的作戰，"
10097-900827-330-1 = "但夏天的海和平時不同，\n能轉換一下心情呢。"
10097-900827-340-1 = "這個游泳圈很奇怪？"
10097-900827-350-1 = "這個嘛，畢竟確實\n不是平時用的那種。\n咯嘻嘻……"
