10097-900827-10-1 = "นี่เป็นปฏิบัติการแฝงตัวที่\nแสนอันตราย เพื่อสืบข้อมูล\nเกี่ยวกับเหตุการณ์ที่เกิดขึ้น...\nหวังว่าจะผ่านไปได้ด้วยดีนะคะ"
10097-900827-20-1 = "RABBIT 1 เตรียมพร้อม\nสำหรับออกปฏิบัติการแล้วค่ะ\nคุณครูคะ! ขอคำสั่งด้วยค่ะ!"
10097-900827-30-1 = "ครั้งสุดท้ายที่ได้กิน\nแซนด์วิชสอดไส้กุ้งแน่นๆ\nแบบนี้คือเมื่อไรกันนะ..."
10097-900827-40-1 = "(ไม่ควรทำตัวให้ดู\nหละหลวมแบบนี้เลยแท้ๆ...)"
10097-900827-50-1 = "ตอนที่ฉันไม่อยู่\nก็เลยเอาเจ้าเปียงโกะ"
10097-900827-60-1 = "ไปฝากให้ทางสำนัก\nรักษาความปลอดภัยของวัลคิรี่\nช่วยดูแลแทนน่ะค่ะ"
10097-900827-70-1 = "บางครั้งฉันก็รู้สึกเสียใจนิดๆ\nที่ดูเหมือนว่าเจ้าเปียงโกะ"
10097-900827-80-1 = "จะชอบคนของทางสำนักรักษา\nความปลอดภัยมากกว่า\nสมาชิกกองทหาร RABBIT อีกค่ะ"
10097-900827-90-1 = "อาจเพราะนี่เป็นการเดินทางไกล\nเพื่อออกปฏิบัติการครั้งแรก...\nก็เลยตื่นเต้นนิดหน่อยน่ะ"
10097-900827-100-1 = "คราวนี้ถึงเวลา\nออกโรงของ SRT แล้ว! "
10097-900827-110-1 = "RABBIT 2 เตรียมพร้อม!\nพร้อมเข้าปฏิบัติการทุกเมื่อ!"
10097-900827-120-1 = "อืม ตอนนี้ก็เปลี่ยนมาใส่\nชุดธรรมดาเหมือนกับ\nนักท่องเที่ยวคนหนึ่งแล้ว..."
10097-900827-130-1 = "ไม่ได้ดูแปลกๆ ใช่รึเปล่า? "
10097-900827-140-1 = "นี่... คุณครู ที่หน้าท้อง\nของฉันมีอะไรติดอยู่รึไง?"
10097-900827-150-1 = "ส่วนตัวแล้วฉันไม่ได้\nชอบอาหารทะเลขนาดนั้นหรอก\nมันเก็บรักษายากน่ะ"
10097-900827-160-1 = "ก็นะ ถ้าเป็นพวกปลาหมึก\nตากแห้งละก็...\nฉันเองก็ชอบเหมือนกัน!"
10097-900827-170-1 = "งื้อ... ดูเหมือนหมู่บ้าน\nชาวประมงที่อยู่ในนิยาย\nสยองขวัญเลย..."
10097-900827-180-1 = "อยากกลับไป\nโรงเรียนเร็วๆ จัง..."
10097-900827-190-1 = "ไม่สิ... โรงเรียนของเรา\nไม่เหลืออยู่อีกแล้วนี่คะ..."
10097-900827-200-1 = "มะ... ไม่ทราบว่า ระ...เรียกฉันเหรอคะ...?"
10097-900827-210-1 = "(ทำไมถึงมาที่\nหมู่บ้านที่อยู่ห่างไกล\nแบบนี้ได้กันนะ...)"
10097-900827-220-1 = "ผมทรงนี้...\nมิยาโกะจังถักให้\nก่อนที่จะออกมาปฏิบัติการค่ะ"
10097-900827-230-1 = "ฮิฮิ... แบบนี้...\nก็อาจจะดูน่ารักก็ได้..."
10097-900827-240-1 = "ทั้งนกกระจาบ ทั้งเพียงพอน...\nแล้วก็นกนางนวล..."
10097-900827-250-1 = "ทำไมพวกสัตว์ป่า\nถึงชอบเข้าหาฉัน\nอยู่เรื่อยเลยนะคะ...?"
10097-900827-260-1 = "ที่นี่คือหมู่บ้านยาโตอูระ\nที่โด่งดังเรื่องแหล่งกำเนิดกุ้ง..."
