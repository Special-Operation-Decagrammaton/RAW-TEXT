[translation]
10097-827-620-1 = "ที่นี่คือหมู่บ้านยาโตอูระ\nที่โด่งดังเรื่องแหล่งกำเนิดกุ้ง..."
10097-827-630-1 = "เพิ่งเคยมาครั้งแรก\nเลยนะเนี่ย"
10097-827-640-1 = "มีเรื่องอะไรเกิดขึ้น\nในหมู่บ้านนี้กันนะ"
10097-827-650-1 = "เรื่องตัวตนแห่งห้วงลึกน่ะ..."
10097-827-660-1 = "ถ้าข่าวลือนั่นเป็นความจริง\nมันจะทนระเบิดลูกมหึมา\nได้มั้ยนะ?"
10097-827-670-1 = "คูซายะนั่นน่ะ\nแค่หมักก็มีกลิ่นแรง\nขนาดนั้นเลยเหรอ?"
10097-827-680-1 = "อยากลองทำดู\nสักครั้งจัง... ฮิฮิฮิ"
10097-827-690-1 = "ฮุฮุ ทีนี้..."
10097-827-700-1 = "จะได้ชิมแซนด์วิชกุ้งโหระพา\nอร่อยๆ อีกรอบมั้ยนะ?"
10097-827-710-1 = "เป็นเพราะหมอกหรือเปล่านะ...?"
10097-827-720-1 = "ฤดูร้อนแท้ๆ แต่รู้สึก\nเย็นสบายดีจัง..."
10097-827-730-1 = "อืม ฉันได้กลิ่น\nความพินาศ\nจากที่ไหนจริงๆ นะ..."
10097-827-740-1 = "ถึงจะมาทำปฏิบัติการของ SRT"
10097-827-750-1 = "แต่พอได้มาทะเลฤดูร้อน\nก็เหมือนได้เปลี่ยน\nบรรยากาศไปเลยเนอะ"
10097-827-760-1 = "ห่วงยางอันนี้\nดูน่าสงสัยงั้นเหรอ?"
10097-827-770-1 = "ก็นะ มันไม่ใช่\nห่วงยางที่เอาไว้\nเล่นน้ำทั่วไปหรอก ฮุฮุ..."
