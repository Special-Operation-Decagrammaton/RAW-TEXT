10097-900827-10-1 = "Today's mission is to infiltrate and investigate... I hope we don't run into any trouble."
10097-900827-20-1 = "RABBIT 1, preparations completed. Sensei, your orders, please."
10097-900827-30-1 = "When was the last time I had a shrimp sandwich...?"
10097-900827-40-1 = "(I shouldn't look too excited...)"
10097-900827-50-1 = "I've made arrangements for our absence."
10097-900827-60-1 = "The students at the Valkyrie Public Safety Bureau will be watching Bun Bun while we're gone."
10097-900827-70-1 = "I have to admit, I get a little jealous sometimes..."
10097-900827-80-1 = "It's just that... Bun Bun seems to like the Public Safety Bureau students more than us sometimes."
10097-900827-90-1 = "RABBIT Squad's first away mission... I'm getting excited."
10097-900827-100-1 = "This is a chance for SRT to show our stuff!"
10097-900827-110-1 = "RABBIT 2, preparations completed! We can enter at any time!"
10097-900827-120-1 = "Well, I tried to dress like a normal tourist..."
10097-900827-130-1 = "I don't look suspicious... Do I?"
10097-900827-140-1 = "Hey... Sensei, is there something on my stomach?"
10097-900827-150-1 = "I don't personally like seafood much. It's too difficult to preserve."
10097-900827-160-1 = "I do like dried seafood though, like dried squid!"
10097-900827-170-1 = "Eek... I-It's just like a fishing village from a h-horror story..."
10097-900827-180-1 = "I-I just w-wanna go back to th-the school..."
10097-900827-190-1 = "Oh, w-wait... I don't have a school t-to go back to..."
10097-900827-200-1 = "D-Did you call me, by any chance...?"
10097-900827-210-1 = "(How did we end up in such a remote village...?)"
10097-900827-220-1 = "Miyako braided my hair b-before we came on this mission."
10097-900827-230-1 = "Heehee... This could be cute..."
10097-900827-240-1 = "Sparrows, weasels, seagulls..."
10097-900827-250-1 = "Wh-Why do wild animals keep c-coming to me...?"
