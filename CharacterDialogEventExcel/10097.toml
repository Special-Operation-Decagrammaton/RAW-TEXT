[translation]
10097-827-620-1 = "ここがエビで\n有名な夜戸浦村…"
10097-827-630-1 = "実際に来てみたのは、\n初めてかも。"
10097-827-640-1 = "一体、この村で\n何が起きてるの？"
10097-827-650-1 = "「深きもの」…"
10097-827-660-1 = "あの噂が本当なら、\nすっごい大きな爆弾にも\n耐えられるのかな？"
10097-827-670-1 = "「くさや」って発酵させるだけで、あんなニオイになるの？"
10097-827-680-1 = "一度、\n作ってみたいかも…\nくひひ。"
10097-827-690-1 = "ふふ。これでやっと、"
10097-827-700-1 = "おいしい\nバジルシュリンプの\nサンドイッチが\n食べられるんだよね？"
10097-827-710-1 = "霧のせいかな…？"
10097-827-720-1 = "夏なのにちょっと寒い…"
10097-827-730-1 = "うーん。たしかに、\nどこか破滅の\n匂いがするような…"
10097-827-740-1 = "SRTの作戦とはいえ、"
10097-827-750-1 = "夏の海って\nいつもと違うから\n気分転換になるね。"
10097-827-760-1 = "この浮き輪が怪しい？"
10097-827-770-1 = "まぁ、\n普段用じゃないことは\n間違いないね。くひひ…"
10097-10827-620-1 = "ここがエビで\n有名な夜戸浦村…"
