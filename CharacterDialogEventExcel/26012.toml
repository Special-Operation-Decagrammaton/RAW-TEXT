[translation]
26012-837-260-1 = "歡迎回來！\n老師喜歡滑水道\n還是波浪池呢？"
26012-837-270-1 = "中務桐乃，\n本次擔任救生員！"
26012-837-280-1 = "水上樂園裡\n竟然會有怪物，\n究竟是怎麼回事……！"
26012-837-290-1 = "這次輪到本官\n大顯身手了！"
26012-837-300-1 = "老師和遊客的安全\n就由本官守護！"
26012-837-310-1 = "雖然很擔心，\n但總算順利結束了！\n辛苦了！"
26012-837-320-1 = "為了穿泳裝，\n我暫時忍住了\n美食巡禮……"
26012-837-330-1 = "結果回過神來，\n已經完成了\n美食廣場巡禮……"
26012-837-340-1 = "要試試滑水道嗎？"
26012-837-350-1 = "本官推薦刺激度\n滿點的滑水道！"
26012-837-360-1 = "孩子們玩耍的模樣，\n真是太可愛了！"
26012-837-370-1 = "嗯？有需要本官\n幫忙的工作嗎？\n請儘管說！"
26012-837-570-1 = "今天的工作來了！\n雖然還挺多的，一起加油吧！"
26012-837-580-1 = "一個一個細心解決！\n本官也會加油的唷，老師！"
26012-837-590-1 = "啊哈哈！禁止搔癢救生員唷！"
26012-837-600-1 = "呵呵，不用那麼著急，\n本官會幫忙的！"
26012-837-610-1 = "不愧是老師！好厲害！"
26012-837-620-1 = "辛苦了，老師！"
