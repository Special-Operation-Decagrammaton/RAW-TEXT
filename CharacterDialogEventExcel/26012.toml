[translation]
26012-837-260-1 = "Welcome! Sensei, which do you prefer, the slide or the wave pool?"
26012-837-270-1 = "Nakatsukasa Kirino, reporting as a lifeguard this time!"
26012-837-280-1 = "A monster at the water park? How is this possible...?!"
26012-837-290-1 = "This time, it's finally my turn to step up!"
26012-837-300-1 = "I'll ensure the safety of Sensei and the guests!"
26012-837-310-1 = "I was really concerned, but it all turned out well in the end! Great job!"
26012-837-320-1 = "I've even held back on food adventures, so I could wear my swimsuit..."
26012-837-330-1 = "When I came to my senses, I found myself on a food court pilgrimage..."
26012-837-340-1 = "How about a water slide?"
26012-837-350-1 = "I can recommend the most exhilarating one!"
26012-837-360-1 = "The kids playing are so cute!"
26012-837-370-1 = "Yes? Is there something you need? Just let me know if there's anything at all!"
26012-837-570-1 = "This is today's task list! It's a lot, but let's give it our all!"
26012-837-580-1 = "One at a time! I'll do my best too, Sensei!"
26012-837-590-1 = "Ahaha! Tickling the lifeguard is not allowed!"
26012-837-600-1 = "Heehee. Hold your horses. I'll help you out!"
26012-837-610-1 = "As expected, you're amazing, Sensei!"
26012-837-620-1 = "Great work, Sensei!"
