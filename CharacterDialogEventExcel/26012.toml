[translation]
26012-837-260-1 = "おかえりなさい！先生は\nスライダーと波のプール、\nどちらが好きですか？"
26012-837-270-1 = "中務キリノ、\n今回はライフセーバーを\nしております！"
26012-837-280-1 = "ウォーターパークに\n怪物だなんて、なんと\nいうことでしょう……！"
26012-837-290-1 = "今度は本官が\n活躍する番ですね！"
26012-837-300-1 = "先生とお客様の\n安全は本官が\n守ります！"
26012-837-310-1 = "かなり心配でしたが、\n無事に終わりましたね！\nお疲れ様でした！"
26012-837-320-1 = "水着を着るために、\nグルメ巡りをしばらく\n我慢していましたが……"
26012-837-330-1 = "気がついたら\nフードコート巡りを\nしてしまいました……"
26012-837-340-1 = "ウォータースライダーは\nいかがですか？"
26012-837-350-1 = "本官が一番スリル\n満点のスライダーを\nおすすめします！"
26012-837-360-1 = "子供たちが遊ぶ姿、\nかわいいですね！"
26012-837-370-1 = "はい？本官が必要な\n仕事でしょうか？\n何でも言ってください！"
26012-837-570-1 = "今日のお仕事です！\n結構多いですが、頑張りましょう！"
26012-837-580-1 = "一つ一つ丁寧に！\n本官も頑張りますよ、先生！"
26012-837-590-1 = "あはは！ライフセーバーを\nくすぐるのは禁止ですよ！"
26012-837-600-1 = "ふふっ、そんな急かさなくても、\n本官がお手伝いしますので！"
26012-837-610-1 = "さすが先生です！すごいです！"
26012-837-620-1 = "お疲れ様でした、先生！"
