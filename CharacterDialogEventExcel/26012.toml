[translation]
26012-837-260-1 = "เชิญค่ะ! ระหว่างสไลเดอร์\nกับสระคลื่น คุณครู\nชอบอะไรมากกว่าเหรอคะ?"
26012-837-270-1 = "นาคัตสึคาสะ คิริโนะ\nคราวนี้ได้มาเป็น\nไลฟ์การ์ดค่ะ!"
26012-837-280-1 = "สัตว์ประหลาดในสวนน้ำงั้นเหรอ\nมันเรื่องอะไรกันเนี่ย...!"
26012-837-290-1 = "คราวนี้ถึงเวลาที่\nฉันจะได้โชว์ฝีมือ\nแล้วสินะคะ!"
26012-837-300-1 = "ฉันจะดูแลความปลอดภัย\nของคุณครูกับลูกค้าให้เองค่ะ!"
26012-837-310-1 = "ฉันกังวลมากเลย\nแต่ก็จบลงด้วยดีนะคะ!\nทำได้ดีมากค่ะ!"
26012-837-320-1 = "ฉันหยุดตระเวนหาร้านเด็ด\nไปสักพัก เพื่อให้ใส่\nชุดว่ายน้ำได้เลยนะคะ..."
26012-837-330-1 = "พอรู้ตัวอีกที\nฉันก็ไปเดินมาทั่ว\nศูนย์อาหารแล้วค่ะ..."
26012-837-340-1 = "สไลเดอร์สระน้ำ\nเป็นยังไงบ้างคะ?"
26012-837-350-1 = "ฉันจะแนะนำสไลเดอร์\nที่หวาดเสียวที่สุด\nให้เองค่ะ!"
26012-837-360-1 = "เด็กๆ เล่นน้ำกัน\nน่ารักจังเลยนะคะ!"
26012-837-370-1 = "คะ? มีงานที่ต้องให้\nฉันไปทำเหรอคะ?\nบอกมาได้ทุกอย่างเลยค่ะ!"
26012-837-570-1 = "นี่คือสิ่งที่ต้องทำวันนี้ค่ะ!\nถึงจะแอบเยอะ แต่ฉันก็จะสู้ค่ะ!"
26012-837-580-1 = "ค่อยๆ ทำไปทีละอย่าง!\nฉันก็จะสู้นะคะคุณครู!"
26012-837-590-1 = "อะฮ่าฮ่า! ห้ามจั๊กจี้\nไลฟ์การ์ดนะคะ!"
26012-837-600-1 = "ฮุฮุ ต่อให้ไม่รบเร้ากันขนาดนั้น\nฉันก็จะช่วยอยู่แล้วค่ะ"
26012-837-610-1 = "สมกับเป็นคุณครูจริงๆ เลย!\nสุดยอดไปเลยค่ะ!"
26012-837-620-1 = "ขอบคุณนะคะคุณครู!"
