[translation]
10075-829-10-1 = "よし、先生も揃った\nことだし、これより、\n知識解放戦線の時間だよ！"
10075-829-20-1 = "おかえり、先生。\n色んな事件が\n起こってるみたいだし、\n外に出よっか！"
10075-829-30-1 = "せっかくのネタが\n見つかるチャンス、\n逃すわけには\nいかないじゃん？"
10075-829-40-1 = "こんなことになるなんて、\n最初は思いも\nしなかったなぁ……"
10075-829-50-1 = "まさかこんな\n展開になるなんて……"
10075-829-60-1 = "本当、人生どう\n転ぶか分かんない\nもんだねぇ……"
10075-829-70-1 = "色々あったけど、\nなんとか片付いたね。"
10075-829-80-1 = "資料もたくさん\n集まったし、\n結果オーライってことで！"
10075-829-90-1 = "呼んだ？"
10075-829-100-1 = "私？……\n忙しいけど\n忙しくない、\nそんなとこだけど。"
10075-829-110-1 = "モミジは背中を\n預けられる仲間で、\n後輩だよ！"
10075-829-120-1 = "好みはまあ……\n人それぞれだし？"
10075-829-130-1 = "なに？先生……\nもしかして暇？"
10075-829-140-1 = "別に遊んでもいいけど～？"
10075-829-150-1 = "く、くすぐった\nいってば……。\nもう！そこまでにして！"
10075-829-580-1 = "ミッション！"
10075-829-590-1 = "原稿の締め切りも、ある種の\nミッションだと思って挑んでるんだ。"
10075-829-600-1 = "任された以上は、確実にこなす！\nそれが知識解放戦線だからね！"
10075-829-610-1 = "何？先生？\n……呼んでみたかっただけ？"
10075-829-620-1 = "いや～そんなセリフ、\n直球で言われると\n私も反応に困っちゃうじゃん。"
10075-829-630-1 = "お話するよ。先生！\n先生はしゃべってて！\n私はそこからネタを見つけるから！"
10075-829-640-1 = "おお、すごいすごい！\nお世辞じゃないよ！本心だよ！"
10075-829-650-1 = "ほら、このまじまじの\n大真面目な目をみて！"
10075-829-660-1 = "ミッションコンプリート！\n報酬を受け取ってくださーい！"
10075-829-670-1 = "どう？私の営業スマイル。"
