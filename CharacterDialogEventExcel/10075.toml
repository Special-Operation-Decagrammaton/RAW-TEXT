[translation]
10075-829-10-1 = "ดีละ ครูก็มาถึงแล้ว\nต่อไปนี้คือเวลาของชมรม\nแนวร่วมปลดปล่อยความรู้!"
10075-829-20-1 = "เข้ามาเลย ครู ตอนนี้น่าจะ\nมีเรื่องเกิดขึ้นเยอะเลยละ\nไปข้างนอกกันไหม!"
10075-829-30-1 = "นี่เป็นโอกาสในการหา\nแรงบันดาลใจเลยนะ\nจะพลาดได้ยังไงกันล่ะ?"
10075-829-40-1 = "ตอนแรกไม่ได้คิดเลย\nว่าจะกลายเป็น\nเรื่องแบบนี้ไปได้..."
10075-829-50-1 = "คิดไม่ถึงเลย\nว่าจะออกมาเป็นแบบนี้..."
10075-829-60-1 = "ไม่รู้เลยจริงๆ\nว่าชีวิตจะออกมา\nเป็นยังไง..."
10075-829-70-1 = "ถึงจะเกิดเรื่องขึ้นมากมาย\nแต่ยังไงก็จัดการให้เรียบร้อย\nจนได้นะ"
10075-829-80-1 = "ข้อมูลก็หามาได้เพียบเลย\nสรุปแล้วก็ถือว่า\nทำได้ดีเลยละ!"
10075-829-90-1 = "เรียกฉันเหรอ?"
10075-829-100-1 = "ฉันเหรอ? ...ก็ยุ่งอยู่หรอกนะ\nแต่ก็ดูเหมือนไม่ได้ยุ่งน่ะ"
10075-829-110-1 = "โมมิจิ\nเป็นทั้งเพื่อนและรุ่นน้อง\nที่ฉันไว้วางใจได้!"
10075-829-120-1 = "เรื่องรสนิยมก็... แต่ละคน\nก็ต่างกันออกไปนี่นะ?"
10075-829-130-1 = "ทำไมเหรอ? ครู...\nมีเวลาว่างไหม?"
10075-829-140-1 = "ฉันอยากให้มา\nเล่นกับฉันหน่อยน่ะ~"
10075-829-150-1 = "มะ... มันจั๊กจี้นะ...\nจริงๆ เลย! พอได้แล้ว!"
10075-829-580-1 = "ภารกิจ!"
10075-829-590-1 = "ฉันคิดและท้าทายตัวเองเสมอว่า\nการส่งต้นฉบับเป็นภารกิจอย่างหนึ่ง"
10075-829-600-1 = "ถ้าเป็นงานของฉัน ฉันจะจัดการแน่นอน!\nนั่นละชมรมแนวร่วมปลดปล่อยความรู้!"
10075-829-610-1 = "ทำไมเหรอ? ครู?\n...แค่ลองเรียกดูงั้นเหรอ?"
10075-829-620-1 = "นี่~ ถ้าพูดบทนั้นมาตรงๆ\nฉันก็ตอบโต้ลำบากน่ะสิ"
10075-829-630-1 = "มาคุยกันเถอะครู! ครูพูดของครูไปเลยนะ!\nส่วนฉันจะหาข้อมูลอยู่ตรงนั้น!"
10075-829-640-1 = "ว้าว สุดยอด! สุดยอดเลย! ไม่ได้พูดไป\nงั้นๆ นะ! ฉันหมายความแบบนั้นจริงๆ!"
10075-829-650-1 = "เอาละ มาดูสายตา\nคู่ที่จริงจังนี่สิ!"
10075-829-660-1 = "มิชชัน คอมพลีต!\nไปรับรางวัลได้เลยค่า~!"
10075-829-670-1 = "เป็นไงบ้าง? รอยยิ้มรับลูกค้าของฉันน่ะ"
10075-10829-10-1 = "ดีละ ครูก็มาถึงแล้ว\nต่อไปนี้คือเวลาของชมรม\nแนวร่วมปลดปล่อยความรู้!"
