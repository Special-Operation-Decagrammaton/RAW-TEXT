[translation]
20011-809-390-1 = "Oh, welcome, Sensei. So? Did you make your New Year's wish?"
20011-809-400-1 = "S-Sensei. Why are you here?! Y-You're here f-for me?!"
20011-809-410-1 = "Oh, sorry, forget it..."
20011-809-420-1 = "It's the new year, but it's still pretty wild!"
20011-809-430-1 = "Well, I do think it's good that it's so lively."
20011-809-440-1 = "*sigh* The Kurokame Gang, the Kaitenger... Why are these things happening one after another?"
20011-809-450-1 = "Will my part-time job pay me without any issues?"
20011-809-460-1 = "We've been flustered since the beginning of the new year, but things seem to be calming down."
20011-809-470-1 = "Great job, Sensei. Want to go back together and eat some osechi?"
20011-809-480-1 = "A-As I said before, this is not cosplay!"
20011-809-490-1 = "I'm wearing it for my part-time job!"
20011-809-500-1 = "Wh-What, Sensei? You're staring at me weird..."
20011-809-510-1 = "I-I know what it looks like, but I really am working hard!"
20011-809-520-1 = "When my shift ends, I want to go get a warm meal with Ayane and the others..."
20011-809-530-1 = "Huh? You want me to say it one more time? Again?"
20011-809-540-1 = "Ugh... Fine! This is the last time though, okay?!"
20011-809-550-1 = "...E-Evil spirits, begone! There! Are you happy now?"
20011-809-860-1 = "Oh, Sensei. Are you here to pick your omikuji? They're over here."
20011-809-870-1 = "How about picking out an omikuji?"
20011-809-880-1 = "...Are you sure you can promote omikuji like this?"
20011-809-890-1 = "Oh, the New Year's event is over, but you can still pick out an omikuji."
20011-809-900-1 = "Here, Sensei!"
20011-809-910-1 = "T-Try your luck, Sensei!"
20011-809-920-1 = "My heart is starting to pound for some reason...!"
20011-809-930-1 = "It's okay if you get a bad result. I'm a miko!"
20011-809-940-1 = "D-Don't laugh like that! I was just being supportive!"
20011-809-950-1 = "Oh, you got a great blessing!! That's amazing, Sensei!"
20011-809-960-1 = "If you pick out a great blessing, you get a special prize! Here!"
20011-809-970-1 = "You picked a blessing, Sensei! Congratulations!"
20011-809-980-1 = "On that note, here is a prize given by the lucky miko!"
20011-809-990-1 = "A modest blessing? That's not bad, right?"
20011-809-1000-1 = "Here, this is for Sensei and your modest blessing!"
20011-809-1010-1 = "Huh? A small blessing?"
20011-809-1020-1 = "Don't be disappointed, Sensei. Here, let me give you this!"
20011-809-1030-1 = "It's a future blessing... I guess it kind of suits you..."
20011-809-1040-1 = "Oh, I didn't mean it in a bad way. Anyway, take this. It's the prize for picking a future blessing."
20011-809-1050-1 = "C-Curse?! Ah, hahaha... That's...that's f-fine!"
20011-809-1060-1 = "Here, I'll give you this, so don't worry about it, okay?"
