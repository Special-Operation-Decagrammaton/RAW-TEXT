[translation]
20011-809-390-1 = "あっ、いらっしゃい。\n先生。もう新年の\nお願いごとはしてきた？"
20011-809-400-1 = "せ、先生、\nどうしてここに！？\nも、もしかして\nわざわざ私に……！？"
20011-809-410-1 = "やっ、ごめん、\n今の無し……"
20011-809-420-1 = "新年とはいえ、\n騒がしいわね～"
20011-809-430-1 = "まあ、活気があって\n良いと思うけど。"
20011-809-440-1 = "はぁ……黒亀組とか、\nカイテンジャーとか……\nどうしてこう\n次から次へと……"
20011-809-450-1 = "バイト代、ちゃんと\nもらえるのかな……？"
20011-809-460-1 = "新年早々\nバタバタだったけど、\nそろそろ\n落ち着いてきたかな"
20011-809-470-1 = "お疲れ様、先生。\n一緒に帰って、\nおせちでも食べる？"
20011-809-480-1 = "な、何度も\n言ってるけど、\nこれコスプレじゃ\nないから！"
20011-809-490-1 = "バイト用のちゃんと\nした格好だから！"
20011-809-500-1 = "な、なに、先生？\nそんなにじっと見て……"
20011-809-510-1 = "ま、真面目に\n働いてるだけじゃん。"
20011-809-520-1 = "バイトが終わったら、\nアヤネちゃんとか\n先輩たちを呼んで\n食べ歩きとかしたいなー……"
20011-809-530-1 = "え、もう一回\nやってほしい？\nまた？"
20011-809-540-1 = "うっ……分かった、\n分かったわよ！\nやればいいんでしょ！"
20011-809-550-1 = "……あ、悪霊退散ー！\nほら、これで満足！？"
20011-809-860-1 = "あっ、先生。\nおみくじ引きにきたの？\nおみくじならここだよ。"
20011-809-870-1 = "おみくじは\nいかがですかー！"
20011-809-880-1 = "……おみくじって、\nこうやって宣伝して\n良いものなのかな？"
20011-809-890-1 = "あ、新年のイベントは\nもう終わっちゃったけど、\nまだおみくじは引けるよ"
20011-809-900-1 = "はい、先生！"
20011-809-910-1 = "新年の運試しだよ、\n決まっちゃうんだよ、\n先生！"
20011-809-920-1 = "何だか\nドキドキしてきた……！"
20011-809-930-1 = "まあ、悪い結果が出ても\n大丈夫よ。ほら、\n巫女さんの\n私がいるんだし……！"
20011-809-940-1 = "……そ、そんなに\n笑わないで！\n頑張って言ったのに！"
20011-809-950-1 = "え、大吉！？\nすごいじゃん先生！"
20011-809-960-1 = "大吉を引くと、特別な\n商品が貰えるんだよ！\nはい！"
20011-809-970-1 = "吉だって！\n先生、おめでと！"
20011-809-980-1 = "というわけでここで、\n幸運の巫女から\n賞品の贈呈～！"
20011-809-990-1 = "中吉かー、うん、\n良いんじゃない？"
20011-809-1000-1 = "じゃあ中吉を当てた\n先生には、\nこれをあげる！"
20011-809-1010-1 = "うん？小吉？"
20011-809-1020-1 = "ガッカリしないで、\n先生。ほら、先生に\nこれあげるから。"
20011-809-1030-1 = "末吉かぁ……何となく\n先生っぽいって\nいうか……"
20011-809-1040-1 = "あ、いや、\n悪口じゃなくて！\nとにかくはいこれ、\n末吉の賞品ね。"
20011-809-1050-1 = "きょ、凶！？\nあ、あはは……\nその、だ、大丈夫！"
20011-809-1060-1 = "ほら、\nこれあげるから！\n気にしないで、ね？"
