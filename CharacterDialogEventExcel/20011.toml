[translation]
20011-809-390-1 = "อ๊ะ เชิญเลย คุณครู\nทำไมเหรอ? ขอพรวันปีใหม่\nไปแล้วงั้นเหรอ?"
20011-809-400-1 = "คะ... คุณครู\nทะ...ทำไมถึงอยู่ที่นี่!?\nหรือว่าคิดจะแกล้งฉันน่ะ...!?"
20011-809-410-1 = "อา... โทษทีนะ ลืมมันไปเถอะ..."
20011-809-420-1 = "ถึงจะบอกว่าเป็นปีใหม่ก็เถอะ\nแต่วุ่นวายจริงๆ เลยน้า~"
20011-809-430-1 = "มีพลังล้นเหลือน่ะ\nมันก็ดีอยู่หรอกนะ"
20011-809-440-1 = "เฮ้อ... ทั้งพวกแก๊งคุโรคาเมะ\nแล้วก็พวกไคเทนเจอร์...\nทำไมถึงโผล่มาไม่หยุดเลยนะ"
20011-809-450-1 = "ฉันจะทำงานพาร์ทไทม์\nจบได้อย่างราบรื่นไหมนะ?"
20011-809-460-1 = "ถึงจะมีเรื่องฉุกละหุก\nตั้งแต่ต้นปีก็ตาม\nแต่ท่าทางจะสงบลงแล้วละนะ"
20011-809-470-1 = "ทำได้ดีมากคุณครู\nพอกลับไปแล้ว\nเราไปกินโอเซจิกันไหม?"
20011-809-480-1 = "ถะ... ถึงจะบอกไปหลายครั้งแล้ว\nก็เถอะ ว่านี่มันไม่ใช่ชุดคอสเพลย์นะ!"
20011-809-490-1 = "ฉันแค่แต่งชุด\nสำหรับทำงานพิเศษต่างหาก!"
20011-809-500-1 = "อะไรน่ะ? คุณครู\nทำไมถึงยิ้มอรุ่มเจ๊าะ\nมองฉันแบบนั้น..."
20011-809-510-1 = "ถะ...ถึงจะเห็นแบบนี้\nแต่ฉันก็ตั้งใจทำงานอยู่นะ?"
20011-809-520-1 = "พอเสร็จงานพาร์ทไทม์แล้ว\nฉันอยากจะชวนอายาเนะจัง\nแล้วก็พวกรุ่นพี่\nมากินอะไรฉลองกันหน่อย..."
20011-809-530-1 = "เอ๋? อยากให้ฉันพูดให้ฟัง\nอีกสักครั้งงั้นเหรอ?"
20011-809-540-1 = "เอ่อ... ขะ... เข้าใจแล้ว!\nเข้าใจแล้วน่า!\nแค่พูดก็พอใช่ไหมล่ะ!"
20011-809-550-1 = "ขะ...ขับไล่วิญญาณร้าย...!\nเอ้า! พะ...พอแล้วใช่ไหม!?"
20011-809-860-1 = "อ๊ะ คุณครู มาเสี่ยงทาย\nโอะมิกุจิเหรอ?\nโอะมิกุจิอยู่ตรงนี้ไงล่ะ"
20011-809-870-1 = "มาลองเสี่ยงทาย\nโอะมิกุจิกันไหมคะ...!"
20011-809-880-1 = "โอะมิกุจิน่ะ...\nพูดโฆษณาแบบนี้\nได้ด้วยเหรอ?"
20011-809-890-1 = "อ่า... ถึงเทศกาลฉลองปีใหม่\nจะจบไปแล้วแต่ว่า...\nยังมาเสี่ยงทายโอะมิกุจิได้อยู่นะ"
20011-809-900-1 = "นี่ไงคุณครู!"
20011-809-910-1 = "มะ...มาลองทดสอบ\nดวงของตัวเองได้เลยคุณครู!"
20011-809-920-1 = "ทำไมถึงรู้สึก...\nตื่นเต้นแบบนี้นะ...!"
20011-809-930-1 = "แต่ก็นะ... ถึงผลที่ออกมา\nจะไม่โอเคก็ไม่เป็นไรหรอก\nยังมีฉันที่เป็นมิโกะอยู่ด้วยทั้งคนนะ!"
20011-809-940-1 = "ยะ... อย่าหัวเราะสิ!\nฉันตั้งใจพูดแบบนั้นเลยนะ!"
20011-809-950-1 = "เอ๋ โชคดีมากงั้นเหรอ!?\nสุดยอดเลยนะ คุณครู!"
20011-809-960-1 = "ถ้าได้โชคดีมากละก็\nจะได้รางวัลพิเศษด้วยนะ!\nเอาล่ะ!"
20011-809-970-1 = "เสี่ยงได้คำว่าโชคดีล่ะ\nคุณครู! ยินดีด้วยนะ!"
20011-809-980-1 = "หรือก็หมายความว่านี่ก็คือ\nของรางวัลที่\nมิโกะแห่งความโชคดีมอบให้ไงล่ะ~!"
20011-809-990-1 = "โชคดีปานกลาง...\nอื้อ ก็ไม่ได้แย่เลยนี่นา"
20011-809-1000-1 = "สำหรับโชคดีปานกลาง\nฉันจะให้ของรางวัลชิ้นนี้!"
20011-809-1010-1 = "หืม? โชคดีเล็กน้อย?"
20011-809-1020-1 = "อย่าผิดหวังไปเลยนะคุณครู\nถ้างั้นฉันจะให้ของชิ้นนี้\nกับคุณครูก็แล้วกัน"
20011-809-1030-1 = "โชคดีตามกรรมงั้นเหรอ...\nจะบอกว่าสมกับเป็นคุณครูดีมั้ยนะ..."
20011-809-1040-1 = "อ๊ะ ไม่ได้พูดถึงในความหมาย\nที่ไม่ดีนะ! ยังไงก็รับนี่ไปสิ\nรางวัลเสี่ยงทายได้โชคดีตามกรรมน่ะ"
20011-809-1050-1 = "ชะ... โชคร้าย!?\nเอ่อ... แหะๆ...\nมะ...ไม่เป็นไร!"
20011-809-1060-1 = "เอาละ! ฉันจะให้ของชิ้นนี้นะ!\nหือ? ไม่ต้องคิดมากหรอกนะ"
20011-10809-390-1 = "อ๊ะ เชิญเลย คุณครู\nทำไมเหรอ? ขอพรวันปีใหม่\nไปแล้วงั้นเหรอ?"
