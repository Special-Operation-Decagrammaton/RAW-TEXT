[translation]
10074-828-330-1 = "差不多該\n開始了吧？"
10074-828-340-1 = "歡樂的「夏日活動」\n要開始了唷～"
10074-828-350-1 = "哎呀，已經到\n折返點了呢……？"
10074-828-360-1 = "越來越接近尾聲了呢。"
10074-828-370-1 = "……稍微，\n有點寂寞。"
10074-828-380-1 = "來確認一下\n有沒有遺失物吧。"
10074-828-390-1 = "嗯？有什麼事嗎？"
10074-828-400-1 = "哎呀，沒想到\n老師還有這一面呢♡"
10074-828-410-1 = "在這裡被老師做的事，\n我全都記得哦～？"
10074-828-420-1 = "回去之後…\n請做好覺悟♡"
10074-828-430-1 = "唔呵呵……♡"
10074-828-600-1 = "今後會發生什麼，\n真讓人期待呢。"
10074-828-610-1 = "呵呵。大家\n都在等著老師唷。"
10074-828-620-1 = "啊，在這種地方，\n做那種事……♡"
10074-828-630-1 = "呵呵，老師，\n有什麼事嗎？"
10074-828-640-1 = "哎呀，這真是相當……"
10074-828-650-1 = "努力是值得的呢～"
