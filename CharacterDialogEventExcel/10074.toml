[translation]
10074-828-330-1 = "そろそろ\nはじめましょうか？"
10074-828-340-1 = "楽しい「夏のイベント」の\nはじまりですよ～。"
10074-828-350-1 = "あら、もう折り返し\nなんですね……？"
10074-828-360-1 = "終わりが\n近づいてきましたね。"
10074-828-370-1 = "……少しだけ、\n寂しいです。"
10074-828-380-1 = "忘れ物はないか、\n確認してみましょうか。"
10074-828-390-1 = "ん？どうされました？"
10074-828-400-1 = "あら、先生に\nこんな一面があるなんて♡"
10074-828-410-1 = "ここで先生にされたこと、\n全部覚えてますからね～？"
10074-828-420-1 = "帰ったら……\n覚悟していてください♡"
10074-828-430-1 = "うふふ……♡"
10074-828-600-1 = "このさき何が起こるのか、\n楽しみですね。"
10074-828-610-1 = "ふふっ。\n皆さんが、先生を待っていますよ。"
10074-828-620-1 = "あぁ、\nこんなところで、そんな……♡"
10074-828-630-1 = "ふふっ、\n先生、何かありましたか？"
10074-828-640-1 = "あら、これはかなり……。"
10074-828-650-1 = "頑張った甲斐がありましたね～"
