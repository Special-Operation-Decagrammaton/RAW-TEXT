[translation]
10074-828-330-1 = "ถ้างั้นก็\nมาเริ่มกันเลยไหมคะ?"
10074-828-340-1 = "กิจกรรมฤดูร้อนแสนสนุก\nเริ่มขึ้นแล้วค่า~ ฮุฮุ"
10074-828-350-1 = "ตายจริง ตอนนี้จะให้กลับไป\nก็คงยากแล้วสินะคะ...?"
10074-828-360-1 = "ใกล้จะเสร็จแล้วสินะคะ"
10074-828-370-1 = "เหงาๆ อยู่หน่อยนะคะ"
10074-828-380-1 = "ลองดูกันไหมคะ\nว่าลืมอะไรไปบ้างหรือเปล่า?"
10074-828-390-1 = "หืม? มีเรื่องอะไรเหรอคะ?"
10074-828-400-1 = "ตายจริง คุณครูก็มี\nมุมแบบนี้กับเขาด้วยเหรอคะ♡"
10074-828-410-1 = "สิ่งที่คุณครูทำที่นี่น่ะ\nฉันจำได้หมดเลยละค่ะ~"
10074-828-420-1 = "ถ้ากลับไปละก็...\nเตรียมตัวไว้เลยนะคะ♡"
10074-828-430-1 = "ฮุฮุฮุ...♡"
10074-828-600-1 = "อยากรู้จังเลยนะคะ\nว่าต่อไปจะเกิดเรื่องอะไร"
10074-828-610-1 = "ฮุฮุ ทุกคนกำลัง\nรอคุณครูอยู่ค่ะ"
10074-828-620-1 = "อ๊า... มาทำในที่แบบนี้ได้ไง...♡"
10074-828-630-1 = "ฮุฮุ\nคุณครูมีเรื่องอะไรมาเหรอคะ?"
10074-828-640-1 = "ตายจริง นี่มัน..."
10074-828-650-1 = "คุ้มกับที่ตั้งใจมากเลยนะคะ"
