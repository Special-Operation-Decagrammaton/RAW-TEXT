10074-828-340-1 = "This is the start of a fun summer event. Heehee!"
10074-828-350-1 = "Ah... Is it too late to turn back...?"
10074-828-360-1 = "We're almost there."
10074-828-370-1 = "It's a little lonely..."
10074-828-380-1 = "Let's look around to see if we missed anything."
10074-828-390-1 = "Huh? What is it?"
10074-828-400-1 = "Wow, Sensei, I've never seen this side of you. ♥"
10074-828-410-1 = "Will you remember everything you did here?"
10074-828-420-1 = "Just be ready...when you return. ♥"
10074-828-430-1 = "Heeheehee... ♥"
10074-828-600-1 = "I'm excited to see what's in store for the future."
10074-828-610-1 = "Everyone is waiting for you, Sensei."
10074-828-620-1 = "Ah, something like that...in a place like this... ♥"
10074-828-630-1 = "Sensei, did something happen?"
10074-828-640-1 = "Wow, this is quite..."
10074-828-650-1 = "This was definitely worth all the hard work."
