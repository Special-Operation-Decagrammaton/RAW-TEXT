[translation]
10074-828-330-1 = "그럼,\n슬슬 시작해 볼까요?"
10074-828-340-1 = "즐거운 '여름 이벤트'의\n시작이에요~ 후후."
10074-828-350-1 = "어머, 이제 돌이키기\n어려워졌네요……?"
10074-828-360-1 = "끝이 가까워졌네요."
10074-828-370-1 = "조금은, 쓸쓸합니다."
10074-828-380-1 = "빠뜨린 게 있는지\n살펴볼까요?"
10074-828-390-1 = "음? 무슨 일이실까요?"
10074-828-400-1 = "어머, 선생님에게\n이런 면이 있었다니♡"
10074-828-410-1 = "여기서 선생님이 하신 거,\n다 기억하고 있다구요~?"
10074-828-420-1 = "돌아가면…\n각오해 주세요♡"
10074-828-430-1 = "후후후……♡"
10074-828-600-1 = "앞으로 무슨 일이 일어날지,\n기대되네요."
10074-828-610-1 = "후훗. 다들 선생님을\n기다리고 있어요."
10074-828-620-1 = "아, 이런 곳에서, 그런…♡"
10074-828-630-1 = "후훗,\n선생님 무슨 일 있었나요?"
10074-828-640-1 = "어머나, 이건 꽤……."
10074-828-650-1 = "열심히 한 보람이 있었네요"
