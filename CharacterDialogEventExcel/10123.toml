[translation]
10123-848-360-1 = "วันนี้ก็เย็นสบายจังเลยนะคะ"
10123-848-370-1 = "ฉันก็พูดไปงั้นละค่ะ..."
10123-848-380-1 = "จากนี้ไปฉันจะ\nเป็นคนแนะนำให้ค่ะ"
10123-848-390-1 = "เป็นช่วงที่กำลังสนุกเลยนะคะ"
10123-848-400-1 = "ว่ามั้ยคะ?"
10123-848-410-1 = "ฉันจะไม่ถอนคันเร่ง\nจนถึงที่สุดเลยค่ะ"
10123-848-420-1 = "ทั้งสดชื่น"
10123-848-430-1 = "แต่ก็เสียดายด้วยนะคะ"
10123-848-440-1 = "พูดออกมาเถอะค่ะ"
10123-848-450-1 = "เขินอะไรขนาดนั้นกันคะ?"
10123-848-460-1 = "จะจั๊กจี้กันเหรอคะ?"
10123-848-470-1 = "ฮุฮุ ยินดีเลยค่ะ"
10123-848-480-1 = "ด้านอื่นๆ ของคุณครู..."
10123-848-490-1 = "ฉันอยากเห็นมันจังเลยค่ะ"
10123-848-500-1 = "พอฤดูร้อนก็สบายๆ นะคะ"
10123-848-510-1 = "หมายถึงการแต่งตัวน่ะค่ะ"
