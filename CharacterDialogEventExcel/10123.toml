[translation]
10123-848-360-1 = "今天也是平靜的一天呢。"
10123-848-370-1 = "……這只是比喻而已。"
10123-848-380-1 = "接下來就由我來引導。"
10123-848-390-1 = "不覺得現在才是"
10123-848-400-1 = "最有趣的時期嗎？"
10123-848-410-1 = "直到最後，\n我都不會鬆開油門。"
10123-848-420-1 = "雖然心情十分舒暢……"
10123-848-430-1 = "卻也有股不捨的感覺呢。"
10123-848-440-1 = "請用言語表達出來。\n用言語。"
10123-848-450-1 = "是什麼讓你這麼害羞呢？"
10123-848-460-1 = "要搔癢嗎？"
10123-848-470-1 = "呵呵。是老師的話\n我非常歡迎。"
10123-848-480-1 = "老師的另外一面……"
10123-848-490-1 = "也想看看呢。"
10123-848-500-1 = "只是因為是夏天，"
10123-848-510-1 = "所以才會打扮的\n比較清涼。"
