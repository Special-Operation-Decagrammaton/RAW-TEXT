[translation]
10123-848-360-1 = "오늘도 시원한 하루네요."
10123-848-370-1 = "……말이 그렇다는 거예요."
10123-848-380-1 = "지금부터는\n제가 안내해 드리죠."
10123-848-390-1 = "한창 즐거울 때네요."
10123-848-400-1 = "그렇지 않나요?"
10123-848-410-1 = "마지막까지 엑셀을\n풀지 않을 거예요."
10123-848-420-1 = "개운하기도 하고,"
10123-848-430-1 = "섭섭하기도 하네요."
10123-848-440-1 = "말로 하세요, 말로."
10123-848-450-1 = "뭐가 그리 부끄러우신가요?"
10123-848-460-1 = "간지럽히시는 건가요?"
10123-848-470-1 = "후후.\n환영이랍니다."
10123-848-480-1 = "선생님의 또 다른 모습도……."
10123-848-490-1 = "보고 싶네요."
10123-848-500-1 = "여름이라 가볍게"
10123-848-510-1 = "입은 것뿐이랍니다."
