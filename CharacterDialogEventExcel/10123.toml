[translation]
10123-848-360-1 = "It's another cool day today."
10123-848-370-1 = "...Is what one might say."
10123-848-380-1 = "Allow me to guide you today."
10123-848-390-1 = "That's youth for you."
10123-848-400-1 = "Isn't that so?"
10123-848-410-1 = "I won't let up on the pedal until the very end."
10123-848-420-1 = "It's refreshing..."
10123-848-430-1 = "...and bittersweet, all at the same time."
10123-848-440-1 = "Say it aloud. Say it."
10123-848-450-1 = "What are you so embarrassed for?"
10123-848-460-1 = "Are you tickling me?"
10123-848-470-1 = "Fufu. Anytime."
10123-848-480-1 = "A different side of you..."
10123-848-490-1 = "I'd like to see that too."
10123-848-500-1 = "I dressed light..."
10123-848-510-1 = "...because it's summer."
