[translation]
10064-809-1070-1 = "เหนื่อยหน่อยนะ ครู\nดีจังที่ได้เจอครูที่\nงานเทศกาลแบบนี้ด้วย"
10064-809-1080-1 = "ขอพรเสร็จแล้วเหรอ?"
10064-809-1090-1 = "ถึงทุกสิ่งทุกอย่างที่เกิดขึ้น\nจะไม่เป็นไปตามที่คิดก็จริง"
10064-809-1100-1 = "แต่การขอพรก็เป็นสิ่ง\nที่ทำได้ตามที่ต้องการนี่นะ"
10064-809-1110-1 = "รู้สึกได้กลิ่น...\nอะไรไม่ดีเลย..."
10064-809-1120-1 = "ตู้บริจาค\nโดนขโมยไปงั้นเหรอ..."
10064-809-1130-1 = "ฉันไม่ได้อยากจะเข้าไป\nพัวพันกับเรื่องน่ารำคาญหรอก..."
10064-809-1140-1 = "แต่ถ้าเป็นคำสั่งของประธาน\nก็คงช่วยไม่ได้ละนะ"
10064-809-1150-1 = "เฮ้อ... วุ่นวายกัน\nจริงๆ เลยแฮะ"
10064-809-1160-1 = "แถมตอนท้ายก็ยังต้อง\nปะทะกับหุ่นยนต์ประหลาด\nพวกนั้นอีก..."
10064-809-1170-1 = "แต่ว่า...\nพอเกิดเรื่องแบบนั้น\nก็ไม่ได้รู้สึกเบื่อเลย"
10064-809-1180-1 = "ปีนี้ก็ขอให้มีแต่วันที่\nสงบสุขเหมือนเดิมนะ"
10064-809-1190-1 = "ใช้เงินที่เก็บไว้สำหรับซื้อ\nอัลบั้มใหม่ขอพรไปหมดแล้ว\nจะไม่เป็นไรแน่งั้นเหรอ?"
10064-809-1200-1 = "ก็นะ... ถึงมันจะดูเป็นการ\nทำเกินตัวไปหน่อยก็เถอะ"
10064-809-1210-1 = "แต่แลกกับรอยยิ้มของประธาน\nแบบนั้นละก็ ถือว่าเป็นราคา\nที่ไม่ได้แพงอะไรเลยละ"
10064-809-1220-1 = "ช่วงนี้ฮารุกะ...\nดูเหมือนจะฝืน\nเกินตัวไปอยู่สักหน่อย"
10064-809-1230-1 = "จะเป็นอะไรรึเปล่านะ..."
10064-809-1240-1 = "(...พวกแก๊งคุโระกาเมะ\nรู้สึกสังหรณ์ใจไม่ดีเลยแฮะ...)"
10064-809-1420-1 = "คุณครูมาพอดีเลยนะ\nฉันมีเรื่องที่อยากจะขอ\nความช่วยเหลือจากคุณครูน่ะ"
10064-809-1430-1 = "ขอโทษที่มีเรื่องรบกวน\nตั้งแต่วันปีใหม่แบบนี้...\nแต่ขอเวลาหน่อยได้รึเปล่า?"
10064-809-1440-1 = "หน่วยรับจ้างสารพัดมีเรื่อง\nไหว้วานคุณครูแบบนี้..."
10064-809-1450-1 = "พอบทบาทสลับกันแบบนี้...\nก็รู้สึกแปลกๆ เหมือนกันนะ"
10064-809-1460-1 = "โทษที ฉันไม่เหมือนมุสึกิหรอก\nไม่ค่อยชินกับเรื่องแบบนี้เท่าไรน่ะ..."
10064-809-1470-1 = "ในเวลาแบบนี้ คือว่า... ฉันไม่รู้เลย\nควรจะต้องทำหน้ายังไงดี..."
10064-809-1480-1 = "ขอบคุณที่ช่วยนะ เอ้านี่ ถึงตาของ\nหน่วยรับจ้างสารพัด 68 แล้ว"
10064-809-1490-1 = "ขอบคุณนะ รอดมาได้\nเพราะได้ครูช่วยเอาไว้เลย"
10064-10809-1070-1 = "เหนื่อยหน่อยนะ ครู\nดีจังที่ได้เจอครูที่\nงานเทศกาลแบบนี้ด้วย"
