[translation]
10064-809-1070-1 = "辛苦了，老師。\n在會場也能遇見老師，\n真不錯呢。"
10064-809-1080-1 = "已經參拜過了嗎？"
10064-809-1090-1 = "雖然無法事事如願，"
10064-809-1100-1 = "不過許願的時候，\n是自由的。"
10064-809-1110-1 = "才剛過年，\n情勢好像就不太對勁……"
10064-809-1120-1 = "賽錢箱小偷是……"
10064-809-1130-1 = "雖然我沒打算\n把麻煩事記在腦袋裡，"
10064-809-1140-1 = "但既然是社長的命令\n也沒辦法。"
10064-809-1150-1 = "唉，真是\n一場災難。"
10064-809-1160-1 = "最後還得對付那個\n奇怪的機器人……"
10064-809-1170-1 = "不過……也因此\n不會感到無聊。"
10064-809-1180-1 = "希望今年安穩的\n日子也能持續下去。"
10064-809-1190-1 = "你說把買新專輯的錢\n全部用作香油錢\n沒關係嗎？"
10064-809-1200-1 = "嘛……確實是\n有點逞強沒錯，"
10064-809-1210-1 = "不過只要能看到\n社長的笑容，\n這還算便宜的。"
10064-809-1220-1 = "遙香他，最近\n看起來好像很勞累。"
10064-809-1230-1 = "沒事吧……"
10064-809-1240-1 = "（……黑龜組啊。\n有股不好的預感）"
10064-809-1420-1 = "老師，你來得正好。\n有件事想請你幫忙。"
10064-809-1430-1 = "抱歉新年就這樣……\n能占用一點時間嗎？"
10064-809-1440-1 = "便利屋居然\n委託老師……"
10064-809-1450-1 = "和平時的立場相反，\n總覺得很新鮮。"
10064-809-1460-1 = "抱歉，我和無月不同，\n不習慣這種事……"
10064-809-1470-1 = "這種時候……那個……\n不知道該露出\n什麼表情才好……"
10064-809-1480-1 = "謝謝你的幫忙。\n來，這是便利屋68的謝禮。"
10064-809-1490-1 = "謝謝，老師。\n多虧有你，幫大忙了。"
