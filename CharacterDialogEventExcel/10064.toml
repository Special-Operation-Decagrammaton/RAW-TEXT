[translation]
10064-809-1070-1 = "수고했어, 선생.\n행사장에서도 선생을\n만날 수 있어서 좋네."
10064-809-1080-1 = "소원은 다 빌었어?"
10064-809-1090-1 = "세상만사가 뜻대로\n되지는 않지만,"
10064-809-1100-1 = "소원을 비는 것 만큼은,\n자유니까."
10064-809-1110-1 = "뭔가, 정초부터\n말썽의 향기가……"
10064-809-1120-1 = "새전함\n도둑이라니……"
10064-809-1130-1 = "귀찮은 일에 머리를\n들이밀 생각은 없지만,"
10064-809-1140-1 = "사장의 명령이라면\n어쩔 수 없지."
10064-809-1150-1 = "하아, 정말\n재난이었네."
10064-809-1160-1 = "마지막에는\n이상한 로봇까지\n상대해야 했으니……"
10064-809-1170-1 = "하지만……\n덕분에 지루하진\n않았어."
10064-809-1180-1 = "올해도 평안한\n하루가 계속되기를."
10064-809-1190-1 = "신작 앨범 구입에\n쓸 돈을 모두 새전으로\n써버렸는데, 괜찮냐고?"
10064-809-1200-1 = "뭐…… 확실히\n조금 무리하기는 했지만."
10064-809-1210-1 = "사장의 미소를 볼 수\n있다면, 그리 비싼\n값은 아니지."
10064-809-1220-1 = "하루카, 최근에\n조금 무리한\n것처럼 보이던데."
10064-809-1230-1 = "괜찮으려나……"
10064-809-1240-1 = "(……검은거북파라.\n좋지 않은\n예감이 드는걸.)"
10064-809-1420-1 = "선생, 마침 잘 왔어.\n도움을 요청하고 싶은\n일이 있어서."
10064-809-1430-1 = "새해부터 부탁을 해서\n미안하지만…\n잠깐 시간 좀 내줄 수 있을까?"
10064-809-1440-1 = "흥신소가 선생에게\n의뢰를 하다니……"
10064-809-1450-1 = "평소와는 입장이 정반대라,\n어쩐지 새롭네."
10064-809-1460-1 = "미안. 무츠키와 달리\n이런 데 익숙하질 않아서……"
10064-809-1470-1 = "이럴 때는…… 그……\n어떤 표정을 지어야 할 지\n모르겠어……"
10064-809-1480-1 = "도와줘서 고마워.\n자, 흥신소 68에서 주는 사례야."
10064-809-1490-1 = "고마워, 선생.\n덕분에 살았어."
10064-10809-1070-1 = "수고했어, 선생.\n행사장에서도 선생을\n만날 수 있어서 좋네."
10064-10809-1080-1 = "소원은 다 빌었어?"
