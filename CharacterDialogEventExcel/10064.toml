[translation]
10064-809-1070-1 = "お疲れ、先生。\n会場でも先生に\n会えるの、良いね。"
10064-809-1080-1 = "もうお参りはした？"
10064-809-1090-1 = "世の中思い通りには\nいかないけど、"
10064-809-1100-1 = "お願い事をする時は、\n自由だからさ。"
10064-809-1110-1 = "新年早々、\n雲行きが怪しい\nような……。"
10064-809-1120-1 = "賽銭箱泥棒って……。"
10064-809-1130-1 = "厄介ごとに首を\n突っ込むつもりは\nなかったんだけど、"
10064-809-1140-1 = "社長の命令なら\n仕方ないか。"
10064-809-1150-1 = "はあ、\nまったく災難だったよ。"
10064-809-1160-1 = "最後は変な\nロボットの相手まで\nさせられたし……。"
10064-809-1170-1 = "でも……おかげで\n退屈はしなかった。"
10064-809-1180-1 = "今年も穏やかな\n日々が続きますように。"
10064-809-1190-1 = "新作アルバム代を全部\nお賽銭に使っちゃって、\nよかったのかって？"
10064-809-1200-1 = "ま……確かに\nちょっと無理したけど、"
10064-809-1210-1 = "社長の笑顔が\n見れるなら、\n安いもんだよ。"
10064-809-1220-1 = "ハルカ、\n最近疲れてるように\n見えるけど。"
10064-809-1230-1 = "大丈夫かな……。"
10064-809-1240-1 = "（……黒亀組か。\n嫌な予感がする。）"
10064-809-1420-1 = "先生、丁度いいところに。\n頼みたいことがあるの。"
10064-809-1430-1 = "新年から悪いけど……。\nちょっと時間もらえる？"
10064-809-1440-1 = "便利屋が先生に\n依頼だなんて……"
10064-809-1450-1 = "いつもと立場が逆で、\nなんだか新鮮。"
10064-809-1460-1 = "ごめん、ムツキと違って\nこういうのに慣れてなくて……"
10064-809-1470-1 = "こういう時……その……\nどんな顔をすればいいか、\n分からない……。"
10064-809-1480-1 = "手伝ってくれてありがと。\nはい、便利屋68からのお礼だよ。"
10064-809-1490-1 = "ありがと、先生。\nおかげで助かったよ。"
