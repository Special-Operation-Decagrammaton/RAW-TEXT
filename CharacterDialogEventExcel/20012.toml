[translation]
20012-810-170-1 = "辛苦了，老師。"
20012-810-180-1 = "有什麼需要的話\n請隨時跟我說。"
20012-810-190-1 = "……真是吵雜的現場呢。\n或許先做好準備比較好。"
20012-810-200-1 = "我想或許需要進行事後處理\n所以留在了這裡。"
20012-810-210-1 = "有什麼需要的話\n請隨時跟我說。"
20012-810-220-1 = "……保險起見，跟您說一聲。\n我並不是商品。"
20012-810-230-1 = "很抱歉，因為這是規定，\n所以沒辦法免費給您。"
20012-810-240-1 = "是個不錯的判斷。"
20012-810-250-1 = "那個似乎不錯呢。"
20012-810-260-1 = "我立刻準備。"
20012-810-270-1 = "好的，那麼\n請稍待片刻。"
20012-810-280-1 = "您辛苦了，老師。\n這是工作的清單，\n麻煩您了。"
20012-810-290-1 = "這是工作的進行狀況。\n請您進行確認。"
20012-810-300-1 = "……老師？\n請專注在工作上。"
20012-810-310-1 = "……很抱歉，但我\n沒辦法代替老師工作。"
20012-810-320-1 = "好的，已確認完畢。"
20012-810-330-1 = "似乎已經順利處理完畢了呢。"
