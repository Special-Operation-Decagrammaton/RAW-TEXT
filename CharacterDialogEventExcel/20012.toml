[translation]
20012-810-170-1 = "수고하십니다. 선생님."
20012-810-180-1 = "무언가 하실 말씀이 있으시다면\n언제든 이야기해 주십시오."
20012-810-190-1 = "……어수선한 현장이군요.\n준비를 해 두는 편이\n좋을지도 모르겠습니다."
20012-810-200-1 = "후속조치가 필요할 것 같아\n남아있었습니다."
20012-810-210-1 = "필요하신 게 있으시면\n말씀해주십시오."
20012-810-220-1 = "……혹시나 해서\n드리는 말씀, 입니다만.\n저는 상품이 아니라서요."
20012-810-230-1 = "죄송하지만 규정이 있는지라,\n그냥 드릴 순 없습니다."
20012-810-240-1 = "나쁘지 않은 판단입니다."
20012-810-250-1 = "그게 좋을 것 같군요."
20012-810-260-1 = "바로 준비하겠습니다."
20012-810-270-1 = "네. 잠시만 기다려주십시오."
20012-810-280-1 = "반갑습니다. 선생님.\n이번 업무의 리스트입니다.\n잘 부탁드립니다."
20012-810-290-1 = "현재까지의 업무 진행 상황입니다.\n확인 부탁드립니다."
20012-810-300-1 = "……선생님?\n업무에 집중해 주십시오."
20012-810-310-1 = "……죄송합니다만, 제가\n일을 대신 해드릴 순 없습니다."
20012-810-320-1 = "네. 확인하였습니다."
20012-810-330-1 = "잘 처리되었습니다."
