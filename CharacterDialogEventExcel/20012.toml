[translation]
20012-810-170-1 = "お疲れ様です、先生。"
20012-810-180-1 = "何かありましたら\nいつでも声をかけてください。"
20012-810-190-1 = "……騒がしい現場ですね。準備を\nしておいた方が良いかもしれません。"
20012-810-200-1 = "事後処理が発生するのではと思い、\nここに残っておりました。"
20012-810-210-1 = "何かありましたら\nいつでもお声がけください。"
20012-810-220-1 = "……念のため、ですが。\n私は商品ではありませんので。"
20012-810-230-1 = "申し訳ありませんが\n規則ですので、無料で\n差し上げるわけにはいきません。"
20012-810-240-1 = "悪くない判断です。"
20012-810-250-1 = "それが良さそうですね。"
20012-810-260-1 = "すぐに用意します。"
20012-810-270-1 = "はい、では\n少々お待ちください。"
20012-810-280-1 = "お疲れ様です、先生。\nこちらお仕事のリストですので、\nよろしくお願いします。"
20012-810-290-1 = "こちら、お仕事の進捗状況です。\nご確認をお願いします。"
20012-810-300-1 = "……先生？\nお仕事に集中してください。"
20012-810-310-1 = "……すみませんが、私が\nお仕事を肩代わりすることは\nできませんので。"
20012-810-320-1 = "はい、確認しました。"
20012-810-330-1 = "問題なく終えられたようですね。"
