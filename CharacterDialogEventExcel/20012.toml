[translation]
20012-810-170-1 = "You're here, Sensei."
20012-810-180-1 = "If you need anything, please let me know."
20012-810-190-1 = "What a commotion. We should make preparations, just in case."
20012-810-200-1 = "I stayed because follow-up measures seemed necessary."
20012-810-210-1 = "If you need anything, please let me know."
20012-810-220-1 = "Just to clarify I am not a reward..."
20012-810-230-1 = "I'm sorry, but rules are rules. I can't just give myself away."
20012-810-240-1 = "That's not bad thinking."
20012-810-250-1 = "I agree with the decision."
20012-810-260-1 = "I'll get ready right now."
20012-810-270-1 = "Okay, please wait a moment."
20012-810-280-1 = "Hello, Sensei. Here's the list of tasks. Good luck."
20012-810-290-1 = "Here is the work progress so far. Please review it."
20012-810-300-1 = "...Sensei? Please pay attention to the task."
20012-810-310-1 = "I'm sorry, but I can't do the work for you."
20012-810-320-1 = "Yes, I've checked."
20012-810-330-1 = "It's been processed."
