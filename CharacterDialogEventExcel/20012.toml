[translation]
20012-810-170-1 = "มาแล้วเหรอคะ คุณครู"
20012-810-180-1 = "หากมีของที่จำเป็น\nก็บอกได้เลยนะคะ"
20012-810-190-1 = "...งานเทศกาลวุ่นวายจังเลยนะคะ\nฉันคิดว่าเราควรเตรียมตัว\nให้พร้อมไว้ดีกว่าค่ะ"
20012-810-200-1 = "ฉันอยู่ที่นี่ เพราะต้องรายงาน\nการติดตามผลอยู่ค่ะ"
20012-810-210-1 = "หากมีของที่จำเป็น\nก็บอกได้เลยนะคะ"
20012-810-220-1 = "ขออภัยที่ต้องพูดแบบนี้ค่ะ\nแต่ว่าฉันไม่ใช่สินค้าหรอกนะคะ"
20012-810-230-1 = "เนื่องจากมันมีกฎระบุไว้อยู่\nฉันคงให้ฟรีๆ ไม่ได้หรอกค่ะ"
20012-810-240-1 = "ตัดสินใจได้ไม่เลวเลยนะคะ"
20012-810-250-1 = "ฉันเห็นด้วยกับการตัดสินใจค่ะ"
20012-810-260-1 = "ฉันจะเตรียมไว้ให้พร้อมค่ะ"
20012-810-270-1 = "ค่ะ ช่วยรอสักครู่นะคะ"
20012-810-280-1 = "ยินดีที่ได้พบค่ะ คุณครู\nนี่เป็นรายการภารกิจครั้งนี้ค่ะ\nขอรบกวนด้วยนะคะ"
20012-810-290-1 = "นี่เป็นรายงานสถานการณ์ทำภารกิจ\nขณะนี้ค่ะ รบกวนตรวจสอบด้วยค่ะ"
20012-810-300-1 = "...คุณครู?\nช่วยตั้งใจทำภารกิจด้วยค่ะ"
20012-810-310-1 = "...ขอโทษค่ะ ฉันทำภารกิจ\nแทนคุณครูไม่ได้หรอกนะคะ"
20012-810-320-1 = "ค่ะ ตรวจสอบเรียบร้อยค่ะ"
20012-810-330-1 = "จัดการได้เรียบร้อยดีนะคะ"
