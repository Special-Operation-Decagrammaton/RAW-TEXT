[translation]
10080-831-100-1 = "왔어, 선생님?\n그럼 시작해볼까?"
10080-831-110-1 = "뭐 도와줄까?"
10080-831-120-1 = "이건 우리의\n이야기니까, 협력할게☆"
10080-831-130-1 = "잘 돼가는 중이야?"
10080-831-140-1 = "슬슬 끝이 보이기\n시작했나?"
10080-831-150-1 = "못다한 일은 없는지,\n다시 한번 확인해 보는 게\n좋을 거야☆"
10080-831-160-1 = "헤에~?\n그렇게 나오는 거구나."
10080-831-170-1 = "해야 할 게\n따로 있으실 텐데?"
10080-831-180-1 = "…내 참을성에도\n한계가 있다구☆"
10080-831-190-1 = "어라라…….\n이거, 괜찮은 거야?"
10080-831-480-1 = "진행상황 한 번,\n확인해 볼까?"
10080-831-490-1 = "확인하러 왔구나.\n뭐 도와줄까?"
10080-831-500-1 = "포기, 라는 말을\n모르는 타입인가 봐?"
10080-831-510-1 = "헤에…….?"
10080-831-520-1 = "꽤 열심히 했네?\n칭찬해줄게☆"
10080-831-530-1 = "조금은 도움이 되지 않을까?"
