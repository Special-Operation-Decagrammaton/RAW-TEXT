[translation]
10080-831-100-1 = "待ってたわよぉ、先生。\nそれじゃ始めましょうか？"
10080-831-110-1 = "なにか\n手伝いましょうかぁ？"
10080-831-120-1 = "これはコッチの話だから、\n協力するゾ☆"
10080-831-130-1 = "うまくいってる～？"
10080-831-140-1 = "そろそろ終わりが\n見えてきたかしら？"
10080-831-150-1 = "やり残したことはないか、\nもう一回確認して\nみるといいゾ☆"
10080-831-160-1 = "へぇ？\nそういう事\nしちゃうんだぁ。"
10080-831-170-1 = "他にやることが\nあるんじゃなぁい？"
10080-831-180-1 = "……私の我慢にも\n限界があるんだゾ☆"
10080-831-190-1 = "……あらあら。\nこれ、大丈夫かしらぁ？"
10080-831-480-1 = "進捗を確認してみましょうかぁ。"
10080-831-490-1 = "確認にきたのねぇ。\n何か手伝いましょうかぁ？"
10080-831-500-1 = "諦め、って言葉を知らない\n感じかしらぁ？"
10080-831-510-1 = "へぇ……？"
10080-831-520-1 = "なかなか頑張ったんじゃなぁい？\n褒めてつかわすゾ☆"
10080-831-530-1 = "少しは役に立んじゃなぁい？"
