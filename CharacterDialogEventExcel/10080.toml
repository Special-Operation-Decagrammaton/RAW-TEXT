[translation]
10080-831-100-1 = "มาแล้วเหรอคุณครู?\nงั้นมาเริ่มกันเลยมั้ย?"
10080-831-110-1 = "ให้ฉันช่วยอะไรดีล่ะ?"
10080-831-120-1 = "นี่คือเรื่องของเรา\nงั้นฉันจะร่วมมือนะ☆"
10080-831-130-1 = "กำลังไปได้ด้วยดีใช่มั้ย?"
10080-831-140-1 = "เริ่มจะเห็น\nจุดสิ้นสุดรึยังนะ?"
10080-831-150-1 = "ลองตรวจสอบดูอีกที\nว่ามีอะไรยังไม่เสร็จมั้ย\nก็น่าจะดีนะ☆"
10080-831-160-1 = "เอ๋~?\nเล่นอะไรแบบนี้นี่เองสินะ"
10080-831-170-1 = "มีงานอย่างอื่นที่ต้องทำ\nอยู่หรือเปล่า?"
10080-831-180-1 = "ความอดทนของฉันก็มีขีดจำกัดนะ☆"
10080-831-190-1 = "ตายจริง...\nแบบนี้ไม่เป็นไรเหรอ?"
10080-831-480-1 = "มาดูความคืบหน้า\nกันหน่อยมั้ย?"
10080-831-490-1 = "เข้ามาตรวจสอบสินะ\nให้ฉันช่วยอะไรดี?"
10080-831-500-1 = "เป็นคนที่ไม่รู้จัก\nคำว่ายอมแพ้เลยสินะเนี่ย?"
10080-831-510-1 = "เอ๋...?"
10080-831-520-1 = "ขยันไม่เบาเลยนะเนี่ย\nขอชื่นชมเลย☆"
10080-831-530-1 = "น่าจะเป็นประโยชน์อยู่บ้างนะ"
