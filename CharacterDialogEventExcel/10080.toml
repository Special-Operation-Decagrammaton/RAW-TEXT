[translation]
10080-831-100-1 = "我在等你哦，老師。\n那麼就開始吧？"
10080-831-110-1 = "需要我幫點忙嗎？"
10080-831-120-1 = "這畢竟跟我們有關，\n我會幫忙的哦☆"
10080-831-130-1 = "還順利嗎～？"
10080-831-140-1 = "差不多能看見\n終點了嗎？"
10080-831-150-1 = "有沒有還沒做完的事，\n最好再確認一次哦☆"
10080-831-160-1 = "嘿～？居然\n做這種事啊？"
10080-831-170-1 = "不是還有其他\n該做的事嗎？"
10080-831-180-1 = "……我的忍耐\n也是有極限的喔☆"
10080-831-190-1 = "……哎呀哎呀。\n這樣沒問題嗎？"
10080-831-480-1 = "來確認一下進度吧。"
10080-831-490-1 = "是來確認的吧。\n需要我幫點忙嗎？"
10080-831-500-1 = "「放棄」這個詞，\n感覺你似乎不知道呢？"
10080-831-510-1 = "嘿～？"
10080-831-520-1 = "還挺努力的嘛？\n值得稱讚哦☆"
10080-831-530-1 = "多少有幫上忙嘛？"
