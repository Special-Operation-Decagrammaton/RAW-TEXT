[translation]
13013-829-160-1 = "你來了啊，老師！"
13013-829-170-1 = "耶嘿嘿，\n我一直在等你。"
13013-829-180-1 = "你好，老師！"
13013-829-190-1 = "只要是我能做到的事，\n請儘管告訴我吧！"
13013-829-200-1 = "感覺事情好像\n越鬧越大了……"
13013-829-210-1 = "不過一定，\n會沒事的吧？\n老師……"
13013-829-220-1 = "事到如今，\n已經無法回頭了。"
13013-829-230-1 = "知識解放戰線\n將會繼續前進！"
13013-829-240-1 = "總算是\n平靜下來了呢……\n大家都平安無事，\n真是太好了。"
13013-829-250-1 = "是，老師。\n你找我嗎？"
13013-829-260-1 = "愛瑠前輩，現在\n在做什麼呢……"
13013-829-270-1 = "希望沒有\n在什麼地方暴走……"
13013-829-280-1 = "不管是讀文章，\n還是欣賞圖畫，\n我都非常喜歡。"
13013-829-290-1 = "漫畫總是能\n教會我們很多事！"
13013-829-300-1 = "老，老師？\n那樣盯著我看……\n我會很不好意思……"
13013-829-310-1 = "在找什麼嗎，老師？\n請慢慢看哦。"
13013-829-320-1 = "我已經很習慣陳列\n和展示物品了。\n請交給我吧！"
13013-829-330-1 = "請看到滿意為止吧！"
13013-829-340-1 = "要是之後後悔\n就太可惜了不是嗎。"
13013-829-350-1 = "商店的管理，是嗎……？"
13013-829-360-1 = "不會，和圖書館的管理相比，\n這種事不算什麼。"
13013-829-370-1 = "如果這裡面夾雜著\n絕版書的初版的話……\n我……該怎麼辦才好……"
13013-829-380-1 = "啊！這，這絕對\n不是出於私心……！"
13013-829-390-1 = "啊，你選了那個呢。"
13013-829-400-1 = "請稍等……\n來，請收下！"
13013-829-410-1 = "這個時候固定要說的台詞是……"
13013-829-420-1 = "「哎呀～！眼光真不賴呢，\n　這位客人！」"
13013-829-430-1 = "「感謝您的多次惠顧！」"
13013-829-440-1 = "剛才那樣，很像老手是嗎？\n嘿嘿，耶嘿嘿……"
13013-829-450-1 = "歡迎光臨，老師！\n想要什麼呢？"
13013-829-460-1 = "要試手氣嗎！"
13013-829-470-1 = "我可以在旁邊看嗎？\n耶嘿嘿。"
13013-829-480-1 = "啊，有什麼\n比較有興趣的嗎？"
13013-829-490-1 = "是，老師。\n有什麼事嗎？"
13013-829-500-1 = "「在需要的時候\n為你帶來一點\n小小的幸運」……"
13013-829-510-1 = "我很想說一次看看，\n這種類型的台詞！"
13013-829-520-1 = "嗚哇，中大獎了！\n真厲害！不愧是老師！"
13013-829-530-1 = "老師的\n運氣很好呢……\n真帥氣，老師！"
13013-829-540-1 = "請讓我也看一下吧。"
13013-829-550-1 = "呣呣……這也是\n能用的東西唷！"
13013-829-560-1 = "嗚咦咦……"
13013-829-570-1 = "請，請不要太灰心，\n老師。還有我在！"
