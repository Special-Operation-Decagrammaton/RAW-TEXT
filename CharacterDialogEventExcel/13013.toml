[translation]
13013-829-160-1 = "Welcome, Sensei!"
13013-829-170-1 = "Heehee. I've been waiting!"
13013-829-180-1 = "Hi, Sensei!"
13013-829-190-1 = "If there's anything I can do, just let me know."
13013-829-200-1 = "Seems like things are getting bigger and bigger..."
13013-829-210-1 = "But I'm sure it'll be okay, right, Sensei...?"
13013-829-220-1 = "It's too late to turn back now."
13013-829-230-1 = "The Knowledge Liberation Front will push on!"
13013-829-240-1 = "Somehow, it's finally over... I'm just glad everyone's safe."
13013-829-250-1 = "Yes? Did you call me, Sensei?"
13013-829-260-1 = "I wonder what Meru is doing right now..."
13013-829-270-1 = "I just hope she's not going crazy somewhere..."
13013-829-280-1 = "I like reading text just as much as looking at pictures."
13013-829-290-1 = "Comics can teach us so many things."
13013-829-300-1 = "S-Sensei? I feel embarrassed...when you look at me like that..."
13013-829-310-1 = "Are you looking for something, Sensei? Take your time."
13013-829-320-1 = "I'm used to arranging and displaying things. Just leave it to me!"
13013-829-330-1 = "Look around as much as you'd like."
13013-829-340-1 = "I'd hate for you to get the wrong things."
13013-829-350-1 = "Managing the shop...?"
13013-829-360-1 = "This is nothing compared to managing the library."
13013-829-370-1 = "What if there's an out-of-print first edition book mixed in here somewhere...? What should I do...?"
13013-829-380-1 = "Oh! I-I'm not saying I'd snatch it up for myself...!"
13013-829-390-1 = "Oh, so you picked that one."
13013-829-400-1 = "Wait just a moment... Yes, here!"
13013-829-410-1 = "And...what's the line...?"
13013-829-420-1 = "\"Oh! You have great taste!\""
13013-829-430-1 = "Thank you so much!"
13013-829-440-1 = "I was so professional just now! Heehee..."
13013-829-450-1 = "Welcome, Sensei. What would you like?"
13013-829-460-1 = "Are you getting your fortune?"
13013-829-470-1 = "Can I watch from the side? Heehee."
13013-829-480-1 = "Is there something wrong?"
13013-829-490-1 = "Yes, Sensei? What's going on?"
13013-829-500-1 = "A little luck, just for you..."
13013-829-510-1 = "I've always wanted to say something like that!"
13013-829-520-1 = "Wow, you won! That's amazing, Sensei!"
13013-829-530-1 = "Sensei, you have really great luck! This is so great!"
13013-829-540-1 = "Can I see?"
13013-829-550-1 = "Hmm... This is pretty good!"
13013-829-560-1 = "Aah..."
13013-829-570-1 = "D-Don't be too sad. At least you have me, Sensei!"
