[translation]
13013-829-160-1 = "いらしたんですね、先生！"
13013-829-170-1 = "えへへ、\nずーっと待ってました。"
13013-829-180-1 = "こんにちは、先生！"
13013-829-190-1 = "私にできることなら、\n何でも言ってください！"
13013-829-200-1 = "どんどん、\n事が大きく\nなっていくような……。"
13013-829-210-1 = "でもきっと、\n大丈夫ですよね？\n先生……。"
13013-829-220-1 = "こうなった以上、\n後戻りはできません。"
13013-829-230-1 = "知識解放戦線は\n進み続けます！"
13013-829-240-1 = "なんとか\n落ち着きましたね……。\nみんなが無事で、\n本当によかったです。"
13013-829-250-1 = "はい、先生。\nお呼びですか？"
13013-829-260-1 = "メル先輩、\n今頃どうしてるかな……。"
13013-829-270-1 = "どこかで暴走してないと\nいいんですが……。"
13013-829-280-1 = "文字を読むことも、\n絵を見ることも\n大好きです。"
13013-829-290-1 = "漫画はいつだって\n私たちに色々なことを\n教えてくれます！"
13013-829-300-1 = "せ、先生？そんなに\n見つめられると私……\n恥ずかしいです……。"
13013-829-310-1 = "何かお探しですか、先生？\nゆっくり見ていってくださいね。"
13013-829-320-1 = "物を並べたり展示するのは\n慣れてますから。\n私に任せてください！"
13013-829-330-1 = "好きなだけ\n見ていってください！"
13013-829-340-1 = "あとで後悔するなんて、\nもったいないじゃないですか。"
13013-829-350-1 = "ショップの管理、ですか……？"
13013-829-360-1 = "いえ、図書館の管理に比べれば、\nこれぐらい平気です。"
13013-829-370-1 = "この中に、絶版になっていた本の\n初版が紛れていたら……\n私は……どうすれば……。"
13013-829-380-1 = "あっ！こ、これは決して\n個人的な願望とかではなく……！"
13013-829-390-1 = "あ、それを\nお選びになったんですね。"
13013-829-400-1 = "少々お待ちください……\nはいこちら、どうぞ！"
13013-829-410-1 = "ここはお決まりのセリフを……"
13013-829-420-1 = "「いやー！お目が高いですね、お客さん！」"
13013-829-430-1 = "「毎度あり！」"
13013-829-440-1 = "今の、ベテランっぽかった、\nですか？へへ、えへへっ……。"
13013-829-450-1 = "いらっしゃいませ、先生！\n何にされますか？"
13013-829-460-1 = "運試しですか！"
13013-829-470-1 = "隣で見ていても\nいいですか？\nえへへ。"
13013-829-480-1 = "あっ、何か気になる\nものでもありましたか？"
13013-829-490-1 = "はい、先生。\nどうしたんですか？"
13013-829-500-1 = "「必要なときに\nもたらされる、\n小さな幸運を」……。"
13013-829-510-1 = "一度言ってみた\nかったです、\nこういうセリフ！"
13013-829-520-1 = "うわあっ！大当たり！\nすごいです！さすが先生！"
13013-829-530-1 = "先生は\n運がいいんですね……\nカッコいいです、先生！"
13013-829-540-1 = "ちょっと私にも\n見せてください。"
13013-829-550-1 = "むむ……これも\n使えるものですよ！"
13013-829-560-1 = "ふえーん……"
13013-829-570-1 = "あ、あまり気を\n落とさないでください、\n先生。私がいますよ！"
