[translation]
13013-829-160-1 = "มาแล้วเหรอคะคุณครู!"
13013-829-170-1 = "แหะๆๆ ฉันกำลังรอ\nคุณครูอยู่เลยละค่ะ"
13013-829-180-1 = "สวัสดีค่ะ คุณครู!"
13013-829-190-1 = "ถ้าเป็นเรื่องที่ฉันทำได้ละก็\nบอกฉันได้ทุกอย่างเลยนะคะ"
13013-829-200-1 = "เหมือนว่าเรื่องจะ\nใหญ่ขึ้นเรื่อยๆ เลย..."
13013-829-210-1 = "แต่ว่ามันจะผ่านไปได้ด้วยดี\nใช่ไหมคะ? คุณครู..."
13013-829-220-1 = "ถ้าเป็นแบบนี้แล้วละก็\nไม่น่าย้อนกลับได้แล้วค่ะ"
13013-829-230-1 = "ชมรมแนวร่วมปลดปล่อยความรู้\nจะเดินหน้าต่อไปค่ะ!"
13013-829-240-1 = "ไม่ว่ายังไงก็จัดการเสร็จ\nจนได้นะคะ... โล่งอกไปทีค่ะ\nที่ทุกคนปลอดภัย"
13013-829-250-1 = "ค่ะ คุณครู เรียกฉันเหรอคะ?"
13013-829-260-1 = "รุ่นพี่เมรุ\nกำลังทำอะไรอยู่นะ..."
13013-829-270-1 = "หวังว่าจะไม่ไปหัวร้อน\nอยู่ที่ไหนนะคะ"
13013-829-280-1 = "ฉันชอบทั้งอ่านหนังสือ\nแล้วก็ดูรูปวาดเลยค่ะ\nชอบมากๆ เลย"
13013-829-290-1 = "หนังสือการ์ตูนน่ะ\nมีอะไรให้เราได้เรียนรู้\nอยู่ตลอดเลยค่ะ!"
13013-829-300-1 = "คะ... คุณครู?\nถ้าจะจ้องกันแบบนี้ละก็...\nฉันเขินนะคะ..."
13013-829-310-1 = "หาอะไรอยู่เหรอคะคุณครู?\nค่อยๆ เดินหาดูนะคะ"
13013-829-320-1 = "ฉันคุ้นเคยกับการจัดแสดงของและจัด\nนิทรรศการน่ะค่ะ วางใจได้เลยค่ะ!"
13013-829-330-1 = "เดินดูได้ตามที่ต้องการเลยนะคะ!"
13013-829-340-1 = "จะได้ไม่มาเสียดายภายหลังไงคะ"
13013-829-350-1 = "เรื่องจัดการร้านค้าน่ะเหรอคะ...?"
13013-829-360-1 = "ไม่ค่ะ ถ้าเทียบกับจัดการห้องสมุดแล้ว\nแค่นี้ไม่เท่าไรเลยค่ะ"
13013-829-370-1 = "ถ้าในนี้มีฉบับพิมพ์ครั้งแรกที่ไม่วางขาย\nอีกแล้วอยู่ด้วยละก็... ฉันจะทำยังไงดี..."
13013-829-380-1 = "อ๊ะ! นะ... นี่มัน\nไม่ใช่ความชอบส่วนตัวนะ...!"
13013-829-390-1 = "อ่า เลือกเล่มนี้มาสินะคะ"
13013-829-400-1 = "ช่วยรอสักครู่นะคะ...\nค่ะ นี่ค่ะ!"
13013-829-410-1 = "บทพูดที่กำหนดไว้ตรงนี้..."
13013-829-420-1 = "'ว้าว! ตาถึงจังเลยนะคะคุณลูกค้า!'"
13013-829-430-1 = "ขอบคุณทุกครั้งเลยนะคะ!"
13013-829-440-1 = "ฉันดูเหมือนมืออาชีพอย่างนั้นเหรอคะ?\nแหะๆ แหะๆๆ..."
13013-829-450-1 = "เชิญค่ะคุณครู!\nจะรับอะไรดีคะ?"
13013-829-460-1 = "มาดูดวงเหรอคะ!"
13013-829-470-1 = "ขอฉันนั่งอยู่ข้างๆ\nได้ไหมคะ? แหะๆๆ"
13013-829-480-1 = "อ่า... มีเรื่องอะไรที่\nกวนใจอยู่หรือเปล่าคะ?"
13013-829-490-1 = "คะ คุณครู?\nมีเรื่องอะไรเหรอคะ?"
13013-829-500-1 = "โชคเล็กๆ\nสำหรับเวลาที่จำเป็น…"
13013-829-510-1 = "ฉันอยากลองพูด\nบทพูดแบบนั้นดูสักครั้งน่ะค่ะ!"
13013-829-520-1 = "ว้าว ถูกรางวัลด้วยค่ะ!\nสุดยอดไปเลยค่ะ!\nว่าแล้วเชียวว่าคุณครูต้องได้!"
13013-829-530-1 = "คุณครูเนี่ย\nโชคดีจังเลยนะคะ...\nเท่ระเบิดไปเลยค่ะ คุณครู!"
13013-829-540-1 = "ขอให้ฉัน\nได้ดูด้วยคนสิคะ"
13013-829-550-1 = "อืมม...\nประมาณนี้น่าจะได้ค่ะ!"
13013-829-560-1 = "แงง..."
13013-829-570-1 = "ยะ... อย่าเสียกำลังใจ\nให้มากเกินไปนะคะ\nคุณครู ฉันอยู่นี่ทั้งคนนะคะ!"
