[translation]
10086-833-10-1 = "歡迎回來，老師。"
10086-833-20-1 = "因為萬魔殿的關係\n一定很辛苦吧……"
10086-833-30-1 = "如果可以，\n希望你能幫忙。"
10086-833-40-1 = "你來了啊，老師。"
10086-833-50-1 = "又得麻煩你，\n真對不起。"
10086-833-60-1 = "……不必在意？\n呵呵，真有老師的風格。"
10086-833-70-1 = "還在繼續啊……"
10086-833-80-1 = "也是，這麼簡單\n就結束的話，\n那就不是萬魔殿了。"
10086-833-90-1 = "明明一直在持續，\n居然還沒結束啊。"
10086-833-100-1 = "該說是惡毒，\n還是貪心呢……"
10086-833-110-1 = "不過，我也\n不打算輸。"
10086-833-120-1 = "終於結束了呢。"
10086-833-130-1 = "鬧哄哄的那些日子，\n也有這樣落幕的一天。"
10086-833-140-1 = "……雖然發生了很多事。"
10086-833-150-1 = "如果有稍微讓老師覺得\n開心就好了，真的。"
10086-833-160-1 = "每當和萬魔殿\n有麻煩的時候\n都很傷腦筋……"
10086-833-170-1 = "這次有老師\n在真是太好了。"
10086-833-180-1 = "居然突然舉辦派對……"
10086-833-190-1 = "真的是到底\n在想什麼啊。"
10086-833-200-1 = "……如果問平常\n知不知道的話，\n那就另當別論了。"
10086-833-210-1 = "無論事態如何，\n風紀委員會該做的\n事都不會改變。"
10086-833-220-1 = "這也是常有的事了。"
10086-833-230-1 = "這樣的騷動，在格黑娜\n只是家常便飯而已。"
10086-833-240-1 = "嗯？格黑娜……很可怕？"
10086-833-250-1 = "我，我覺得也不到\n那種程度吧……"
