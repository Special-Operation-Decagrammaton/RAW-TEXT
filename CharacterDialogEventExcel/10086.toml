[translation]
10086-833-10-1 = "Welcome, Sensei."
10086-833-20-1 = "I'm sure the Pandemonium Society is giving you a hard time..."
10086-833-30-1 = "But I'd like to ask for your help."
10086-833-40-1 = "You're here, Sensei."
10086-833-50-1 = "Sorry to ask you for another favor."
10086-833-60-1 = "...Don't worry about it? Fufu. How like you."
10086-833-70-1 = "I see. So it's still happening..."
10086-833-80-1 = "Well, it wouldn't be the Pandemonium Society if things ended neatly."
10086-833-90-1 = "Even after all this, it's still not over."
10086-833-100-1 = "I'm not sure whether to call them gluttonous or greedy."
10086-833-110-1 = "Well, we're not going to simply roll over and accept it."
10086-833-120-1 = "It's finally over."
10086-833-130-1 = "After days of commotion, this is how it ends."
10086-833-140-1 = "Still... A lot happened."
10086-833-150-1 = "I hope that you had a little fun at least, Sensei. Really."
10086-833-160-1 = "Whenever there's trouble with the Pandemonium Society, it's always a hassle, but..."
10086-833-170-1 = "I'm glad that this time, you were here, Sensei."
10086-833-180-1 = "Throwing a party at the last minute..."
10086-833-190-1 = "What are they thinking? Really?"
10086-833-200-1 = "It's not like we can know, but still..."
10086-833-210-1 = "Whatever happens, the Prefect Team's mission doesn't change."
10086-833-220-1 = "This sort of thing happens all the time, after all."
10086-833-230-1 = "It wouldn't be Gehenna without the chaos."
10086-833-240-1 = "Hm? Gehenna's...scary?"
10086-833-250-1 = "N-Now, now. I think you might be being a little hyperbolic..."
