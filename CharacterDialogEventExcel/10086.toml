[translation]
10086-833-10-1 = "어서 와. 선생님."
10086-833-20-1 = "판데모니움 소사이어티\n때문에, 고생이겠지만…."
10086-833-30-1 = "괜찮다면 도와줬으면 좋겠어."
10086-833-40-1 = "왔구나. 선생님."
10086-833-50-1 = "또 다시 부탁을 해서 미안해."
10086-833-60-1 = "…신경 쓸 필요 없다고?\n후후. 선생님답네."
10086-833-70-1 = "아직도 계속되고 있구나…."
10086-833-80-1 = "뭐, 간단히 끝나면\n판데모니움 소사이어티가\n아니겠지."
10086-833-90-1 = "이렇게 계속하는데도\n아직 끝나지 않는구나."
10086-833-100-1 = "게걸스럽다고 할지.\n탐욕스럽다고 할지."
10086-833-110-1 = "뭐, 이쪽도\n져줄 생각은 없지만."
10086-833-120-1 = "드디어 끝났네."
10086-833-130-1 = "떠들썩했던 날들도,\n이렇게 막을 내리는 거구나."
10086-833-140-1 = "…여러 가지 일이 있었지만."
10086-833-150-1 = "조금이라도 선생님이\n즐거웠다면 다행이야. 정말로."
10086-833-160-1 = "판데모니움 소사이어티와\n트러블이 있을 때마다\n곤혹스럽지만…."
10086-833-170-1 = "이번엔 선생님이\n있어 줘서 다행이야."
10086-833-180-1 = "갑작스럽게 파티 개최라니…"
10086-833-190-1 = "정말 무슨 생각을\n하고 있는 걸까."
10086-833-200-1 = "……평소엔\n알고 있느냐 하면,\n그건 또 아니지만."
10086-833-210-1 = "어떤 일이 있건, 선도부가\n해야 할 일은 달라지지 않아."
10086-833-220-1 = "늘 있는 일이니까."
10086-833-230-1 = "이런 소동, 게헨나에서는\n늘 있는 일이긴 해."
10086-833-240-1 = "응? 게헨나가…… 무서워?"
10086-833-250-1 = "그, 그 정도까진\n아니라고 생각하는데…."
