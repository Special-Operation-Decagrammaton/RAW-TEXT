[translation]
10086-833-10-1 = "เข้ามาสิ คุณครู"
10086-833-20-1 = "ถึงจะเหนื่อยใจกับ\nแพนเดโมเนียม โซไซตี้ก็เถอะ..."
10086-833-30-1 = "แต่ถ้าไม่ติดอะไร ฉันก็อยากให้มาช่วยหน่อย"
10086-833-40-1 = "มาแล้วเหรอ คุณครู"
10086-833-50-1 = "ขอโทษที่ฉันขอร้องอีกครั้งนะ"
10086-833-60-1 = "ไม่ต้องใส่ใจงั้นเหรอ?\nฮุฮุ สมกับเป็นคุณครูเลยนะ"
10086-833-70-1 = "ยังเกิดเรื่องอยู่อีกสินะ..."
10086-833-80-1 = "แต่ถ้าจบลงง่ายๆ\nก็คงไม่ใช่แพนเดโมเนียม\nโซไซตี้หรอกเนอะ"
10086-833-90-1 = "ถึงจะเป็นแบบนี้ไปเรื่อยๆ\nก็ยังไม่จบลงสินะ"
10086-833-100-1 = "ต้องเรียกว่าเกินงาม\nหรือโลภมากดีนะ"
10086-833-110-1 = "แต่ก็นะ ฉันเอง\nก็ไม่คิดจะยอมแพ้ให้หรอก"
10086-833-120-1 = "ในที่สุดก็จบสักที"
10086-833-130-1 = "วันที่วุ่นวายก็มี\nฉากจบเหมือนกันสินะ"
10086-833-140-1 = "ถึงจะเกิดเรื่องขึ้นมากมาย"
10086-833-150-1 = "แต่ก็โชคดีนะที่คุณครู\nสนุกอยู่บ้าง... จริงๆ นะ"
10086-833-160-1 = "ทุกครั้งที่มีปัญหากับ\nแพนเดโมเนียม โซไซตี้\nฉันจะอึดอัดใจ..."
10086-833-170-1 = "แต่ครั้งนี้โชคดีนะ\nที่มีคุณครูอยู่ด้วย"
10086-833-180-1 = "ให้เปิดงานปาร์ตี้กะทันหันเลย..."
10086-833-190-1 = "คิดอะไรของเขา\nอยู่กันนะ"
10086-833-200-1 = "ถ้าถามว่าปกติ\nฉันรู้อยู่แล้วรึเปล่า\nก็ใช่ว่าจะรู้หรอก"
10086-833-210-1 = "ไม่ว่าจะเกิดเรื่องอะไรขึ้น\nงานที่คณะกรรมการวินัย\nต้องทำ ก็เหมือนเดิม"
10086-833-220-1 = "มันเป็นเรื่องที่เกิดขึ้น\nอยู่ตลอดน่ะ"
10086-833-230-1 = "ความวุ่นวายแบบนี้เป็นเรื่องที่\nเกิดขึ้นบ่อยๆ ในเกเฮนน่าน่ะ"
10086-833-240-1 = "หืม? เกเฮนน่า... น่ากลัวเหรอ?"
10086-833-250-1 = "ฉะ... ฉันไม่คิดว่า\nมันจะถึงขนาดนั้นนะ..."
