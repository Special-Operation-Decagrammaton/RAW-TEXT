[translation]
10086-833-10-1 = "おかえり、先生。"
10086-833-20-1 = "万魔殿のせいで\n大変だろうけど……"
10086-833-30-1 = "よかったら\n手伝ってほしい。"
10086-833-40-1 = "来たわね、先生。"
10086-833-50-1 = "またお願いすることに\nなってしまって、\nごめんなさい。"
10086-833-60-1 = "……気にしなくていい？\nふふ、先生らしいね。"
10086-833-70-1 = "まだ続いているのね……。"
10086-833-80-1 = "まあ、簡単に終わったら\n万魔殿じゃないか。"
10086-833-90-1 = "こんなに続けてるのに\nまだ終わらないのね。"
10086-833-100-1 = "意地汚いというか、\n貪欲というか……"
10086-833-110-1 = "まあ、こっちも\n負けるつもりは\nないのだけど。"
10086-833-120-1 = "ようやく終わったね。"
10086-833-130-1 = "賑やかだったあの日々も、\nこうして幕を下ろす\n日がくる。"
10086-833-140-1 = "……色んなことが\nあったけど。"
10086-833-150-1 = "少しでも先生が\n楽しかったなら\n良かった、本当に。"
10086-833-160-1 = "万魔殿とトラブルが\nあるたびに\n困惑させられるけど……"
10086-833-170-1 = "今回は、先生が\nいてくれてよかった。"
10086-833-180-1 = "突然のパーティー\nだなんて…"
10086-833-190-1 = "本当に一体何を\n考えているのかしら。"
10086-833-200-1 = "……普段も\n分かっているのかと\nいったら、それは\nまた別なんだけど。"
10086-833-210-1 = "どんな事態だろうと、\n風紀委員会が\nやることは変わらないわ。"
10086-833-220-1 = "いつものことだから。"
10086-833-230-1 = "こんな騒動、ゲヘナでは\n日常茶飯事なんだけどね。"
10086-833-240-1 = "ん？ゲヘナが……怖い？"
10086-833-250-1 = "そ、そこまでじゃない、\nと思うけど……"
