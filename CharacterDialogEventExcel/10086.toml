[translation]
10086-10 = "歡迎回來，老師。"
10086-20 = "因為萬魔殿的關係\n一定很辛苦吧……"
10086-30 = "如果可以，\n希望你能幫忙。"
10086-40 = "你來了啊，老師。"
10086-50 = "又得麻煩你，\n真對不起。"
10086-60 = "……不用在意？\n呵呵，真有老師的風格呢。"
10086-70 = "每當和萬魔殿\n有麻煩的時候\n都很傷腦筋……"
10086-80 = "這次有老師\n在真是太好了。"
10086-90 = "居然突然舉辦派對……"
10086-100 = "真的是到底\n在想什麼啊。"
10086-110 = "……如果問平常\n知不知道的話，\n那就另當別論了。"
10086-120 = "無論事態如何，\n風紀委員會該做的\n事都不會改變。"
10086-130 = "這也是常有的事了。"
10086-140 = "這樣的騷動，在格黑娜\n只是家常便飯而已。"
10086-150 = "嗯？格黑娜……很可怕？"
10086-160 = "我，我覺得也不到\n那種程度吧……"
