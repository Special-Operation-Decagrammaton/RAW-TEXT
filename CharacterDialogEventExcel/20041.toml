20041-70000-11460-1 = "ถึงจะได้มาเจอกัน\nกลางคัน..."
20041-70000-11470-1 = "แต่ก็ฝากตัวด้วยนะ ครู"
20041-70000-11480-1 = "มาได้ถูกจังหวะ\nเลยนะครู"
20041-70000-11490-1 = "เป็นการกระทำที่\nสมเหตุสมผลมาก"
20041-70000-11500-1 = "ที่นี่คือฐานของฮิมาริ..."
20041-70000-11510-1 = "ไม่สิ\nฐานของพวกเราสินะ"
20041-70000-11520-1 = "ฉันยังรู้สึกว่า\nไม่ใช่เรื่องจริงอยู่เลย"
20041-70000-11530-1 = "การได้มาทำภารกิจ\nร่วมกันกับครูอย่างนี้น่ะ..."
20041-70000-11540-1 = "มันอาจจะฟังดูแปลกๆ\nที่ฉันพูดแบบนี้"
20041-70000-11550-1 = "แต่ทุกคนปฏิบัติตัวกับฉัน\nอย่างเปิดเผยเลย..."
20041-70000-11560-1 = "ใช่ว่าฉัน\nจะไม่ชอบหรอกนะ..."
20041-70000-11570-1 = "ถ้าเป็นเรื่องวิศวกรรม..."
20041-70000-11580-1 = "ขอโทษนะ ฉันยังไม่แตกฉาน\nในเรื่องแบบนั้นน่ะ"
20041-70000-11590-1 = "เรียกหาฉันเหรอ ครู?\nแค่สงสัยว่าฉัน\nทำอะไรอยู่งั้นเหรอ?"
20041-70000-11600-1 = "การกระทำที่\nไม่สมเหตุสมผลแบบนั้น\nก็ละๆ บ้างเถอะ"
20041-70000-11610-1 = "ก็... ใช่ว่าฉัน\nจะไม่ชอบหรอก..."
20041-70000-11620-1 = "ฉันคิดว่าตัวเอง\nต้องรอบรู้ในทุกเรื่องน่ะ"
20041-70000-11630-1 = "ตอนนี้ก็คิดว่า...\nยังมีสิ่งที่ต้อง\nเรียนรู้อยู่อีกมาก"
20041-70000-11640-1 = "น่าทึ่งจังเลย พอมาคิดดู\nนี่ก็คงเป็นเพราะ\nได้ครูช่วยไว้สินะ"
20041-70000-11650-1 = "ฉันรับช่วงงาน\nต่อจากฮิมาริแล้ว"
20041-70000-11660-1 = "สรุปว่า... เราเจอวัตถุปริศนา\nที่เกิดจากพลัง"
20041-70000-11670-1 = "ทวยเทพไร้นาม\nในทุกหนทุกแห่งสินะ"
20041-70000-11680-1 = "ตอนนี้เราต้องการวัตถุตัวอย่าง\nเพื่อใช้เติมเสบียงอีกครั้ง"
20041-70000-11690-1 = "มาแล้วเหรอ ครู\nได้ตัวอย่างมาแค่ไหนน่ะ?"
20041-70000-11700-1 = "ขอบคุณที่ให้ความร่วมมือนะ"
20041-70000-11710-1 = "ฉันกำลังวิเคราะห์วัตถุปริศนาอยู่\nแล้วก็จะได้ผลลัพธ์จากตรงนั้นละ"
20041-70000-11720-1 = "ว่าแต่ อุปกรณ์นี้มัน\nร้อนจังเลย..."
20041-70000-11730-1 = "เอมิน่าจะลำบาก\nพอตัวเลยนะ"
20041-70000-11740-1 = "ฉันไม่มีอะไรไม่พอใจในโครงสร้าง\nการทำงานของอุปกรณ์นี้หรอก"
20041-70000-11750-1 = "แปลกใจงั้นเหรอ? ฮุฮุ เห็นอย่างนี้\nฉันก็ยอมรับในสิ่งที่ต้องยอมรับนะ"
20041-70000-11760-1 = "แต่ว่าดีไซน์มัน\nมันควรจะ..."
20041-70000-11770-1 = "ต่อให้มาชวนฉันคุย\nก็ไม่มีอะไรเปลี่ยนแปลงหรอก"
20041-70000-11780-1 = "หืม? ทำแล้วจะได้เห็น\nฉันเปลี่ยนสีหน้างั้นเหรอ?"
20041-70000-11790-1 = "เข้าใจแล้ว... เพราะแบบนี้สินะ\nคนถึงบอกว่าบางครั้งครูก็ใจร้ายน่ะ..."
20041-70000-11800-1 = "นี่คือผลลัพธ์จาก\nการวิเคราะห์ในครั้งนี้"
20041-70000-11810-1 = "ยินดีต้อนรับค่ะ\nจะรับชิ้นไหนเหรอคะ?"
20041-70000-11820-1 = "ฉันแค่ลองเลียนแบบดูน่ะ...\nลืมเรื่องเมื่อกี้ไปเถอะ"
20041-70000-11830-1 = "เมื่อนานมาแล้ว ฉันเคยบอกว่า\nได้แลกเปลี่ยนสิ่งของแบบนี้"
20041-70000-11840-1 = "ในบางมุมก็รู้สึกเหมือน\nได้ย้อนกลับไปยังอดีตเลย"
20041-70000-11850-1 = "เป็นผลลัพธ์ที่สมเหตุสมผลเลยละ\nเลือกได้ดีมาก"
20041-70000-11860-1 = "ได้ผลออกมาแล้ว\nฉันจะให้ครูเป็นคนเลือกแล้วกัน"
20041-70000-11870-1 = "จากตรงนี้ไป\nฉันใช้วิธีวิเคราะห์\nที่ต่างออกไปหน่อย"
20041-70000-11880-1 = "ถ้าให้พูดง่ายๆ คือ\nมันเป็นผลมาจาก\nความบังเอิญน่ะ"
20041-70000-11890-1 = "พวกของอย่างล็อตเตอรีน่ะ\nมีความเป็นไปได้สูงที่จะสูญเสีย"
20041-70000-11900-1 = "แต่กับตรงนี้...\nก็คงช่วยไม่ได้ละนะ"
20041-70000-11910-1 = "เหมือนว่าฮิมาริจะยัง\nชอบอะไรแบบนี้อยู่นะ"
20041-70000-11920-1 = "ก็นะ... ลองดูหลายๆ แบบ\nก็น่าจะดีเหมือนกัน"
20041-70000-11930-1 = "การคาดการณ์\nผลการวิเคราะห์\nอย่างแม่นยำไม่ได้..."
20041-70000-11940-1 = "ในฐานะที่สังกัดเซมิน่าแล้ว\nมันน่าเสียใจนิดหน่อยนะ"
20041-70000-11950-1 = "ถ้าหากผลลัพธ์\nออกมาไม่ดีละก็..."
20041-70000-11960-1 = "ขอโทษนะ ครู\nส่วนนั้นฉันเองก็\nทำอะไรให้ไม่ได้"
20041-70000-11970-1 = "ถึงท้ายที่สุด\nมันจะผิดพลาด"
20041-70000-11980-1 = "คำพูดที่ว่า\nพระเจ้าไม่ทอยลูกเต๋าน่ะ"
20041-70000-11990-1 = "ฉันเข้าใจ\nด้านนั้นดี"
20041-70000-12000-1 = "เรื่องกลศาสตร์ควอนตัมน่ะ\nที่จริงแล้วมันไม่ใช่\nเรื่องที่จะเข้าใจได้หรอก"
20041-70000-12010-1 = "ก็แค่... ท่องจำ\nแล้วริเริ่มดูน่ะ"
20041-70000-12020-1 = "ว่ากันว่าโลก\nอยู่นอกเหนือ\nการรับรู้ของเรา"
20041-70000-12030-1 = "อืม... เหมือนกับการวิเคราะห์ที่\nฝากไว้กับโชคนี้ละ"
20041-70000-12040-1 = "จะได้...\nจริงๆ เหรอ?"
20041-70000-12050-1 = "นี่คงเป็นกฎ\nว่าด้วยจำนวนมากสินะ"
20041-70000-12060-1 = "ถ้าไม่ถูก\nก็ต้องเล่นจนกว่าจะถูก"
20041-70000-12070-1 = "มันก็ไม่ใช่คำที่ผิดหรอกนะ..."
20041-70000-12080-1 = "เรื่องส่วนใหญ่ของโลกเกิดจาก\nการแจกแจงแบบปกติอยู่แล้ว"
20041-70000-12090-1 = "ยินดีด้วยนะ ครู\nทำได้ดีมาก"
