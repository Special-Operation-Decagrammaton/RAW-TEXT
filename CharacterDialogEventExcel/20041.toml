[translation]
20041-843-280-1 = "適切なタイミングね。"
20041-843-290-1 = "そろそろ来る頃だと\n思っていたわ。"
20041-843-300-1 = "全て順調よ。\nでも、安心できる\n段階ではないわ。"
20041-843-310-1 = "近々、まとまった\n報告ができそうよ。"
20041-843-320-1 = "もう少し待って\nちょうだい。"
20041-843-330-1 = "解決できてよかったわ。"
20041-843-340-1 = "……これは本心よ。"
20041-843-350-1 = "……突然私に触れて、\nどうしたのかしら？"
20041-843-360-1 = "言葉で\n伝えてくれるかしら。"
20041-843-370-1 = "だから……その……"
20041-843-380-1 = "私に……何を、\n求めているの？"
20041-843-800-1 = "リストアップは\n済んでいるわ。"
20041-843-810-1 = "これが今日のタスクよ。"
20041-843-820-1 = "……先生の意図が\n理解できないわ。"
20041-843-830-1 = "無言で触れるだけでは、\n伝わらないのよ。"
20041-843-840-1 = "……もしかして、"
20041-843-850-1 = "同じことをしてほしいの？"
20041-843-860-1 = "確認するわね。"
20041-843-870-1 = "リストを更新しておいたわ。"
20041-10843-280-1 = "適切なタイミングね。"
20041-10843-290-1 = "そろそろ来る頃だと\n思っていたわ。"
20041-10843-300-1 = "全て順調よ。\nでも、安心できる\n段階ではないわ。"
20041-10843-310-1 = "近々、まとまった\n報告ができそうよ。"
20041-10843-320-1 = "もう少し待って\nちょうだい。"
20041-10843-330-1 = "解決できてよかったわ。"
20041-10843-340-1 = "……これは本心よ。"
20041-10843-350-1 = "……突然私に触れて、\nどうしたのかしら？"
20041-10843-360-1 = "言葉で\n伝えてくれるかしら。"
20041-10843-370-1 = "だから……その……"
20041-10843-380-1 = "私に……何を、\n求めているの？"
20041-10843-800-1 = "リストアップは\n済んでいるわ。"
20041-10843-810-1 = "これが今日のタスクよ。"
20041-10843-820-1 = "……先生の意図が\n理解できないわ。"
20041-10843-830-1 = "無言で触れるだけでは、\n伝わらないのよ。"
20041-10843-840-1 = "……もしかして、"
20041-10843-850-1 = "同じことをしてほしいの？"
20041-10843-860-1 = "確認するわね。"
20041-10843-870-1 = "リストを更新しておいたわ。"
20041-70000-11460-1 = "途中参加という\n形になるのかしら。"
20041-70000-11470-1 = "……これからよろしく\n頼むわね、先生。"
20041-70000-11480-1 = "貴方は、時間を\n厳守できる人なのね。"
20041-70000-11490-1 = "まさに合理的な行動よ。"
20041-70000-11500-1 = "ここがヒマリの……"
20041-70000-11510-1 = "いえ、\n私たちの基地なのね。"
20041-70000-11520-1 = "……まだ、\n実感がわかないの。"
20041-70000-11530-1 = "先生と……同じ作戦に\n身を置いていることが。"
20041-70000-11540-1 = "……みんなには、\n気兼ねなく\n接してもらっているわ。"
20041-70000-11550-1 = "嫌というわけでは、\nないのだけれど……"
20041-70000-11560-1 = "少し戸惑っているのは、\n事実よ。"
20041-70000-11570-1 = "工学の分野以外は……"
20041-70000-11580-1 = "ごめんなさい、\nそれほど詳しくないの。"
20041-70000-11590-1 = "……なにかしら？\n……話しかけて\nみたかっただけ？"
20041-70000-11600-1 = "そういう非合理的な\n行動は控えて頂戴、\n先生。"
20041-70000-11610-1 = "……不愉快とまでは、\n言ってないわ。"
20041-70000-11620-1 = "以前は、すべてを\n掌握しなければ\nならないと考えていたの。"
20041-70000-11630-1 = "でも、今は……人間一人に\n掌握できる範疇の\n限界に気がつけたわ。"
20041-70000-11640-1 = "……先生のおかげ、\nかしら。"
20041-70000-11650-1 = "ヒマリから\n引き継ぎがあったわ。"
20041-70000-11660-1 = "現在、\n各地から「名も無き神」による"
20041-70000-11670-1 = "謎の物質が\n見つかっている、と。"
20041-70000-11680-1 = "サンプルがあれば、\n再補給も可能になるわ。"
20041-70000-11690-1 = "集めたサンプルを\n見せてちょうだい。"
20041-70000-11700-1 = "協力、感謝するわ。"
20041-70000-11710-1 = "「物質」の分析中よ。そこから\n副産物を生産しているの。"
20041-70000-11720-1 = "この装置、\nかなり熱を放っているわね……"
20041-70000-11730-1 = "エイミには少し\n厳しいんじゃないかしら。"
20041-70000-11740-1 = "装置の構造に不満はないの。"
20041-70000-11750-1 = "意外？ふふ、私だって、\n優れたものは素直に認めるわ。"
20041-70000-11760-1 = "ああでも、デザインと\n細部にもう少し合理性を……"
20041-70000-11770-1 = "……そんなことをしても、\n得られるものは\n何もないと思うわ。"
20041-70000-11780-1 = "……私の表情の\n変化が見られる？"
20041-70000-11790-1 = "……貴方が変わっていると\n言われる理由が、分かったわ。"
20041-70000-11800-1 = "今回の分析結果よ。"
20041-70000-11810-1 = "いらっしゃいませ、\nどちらになさいますか？"
20041-70000-11820-1 = "……真似してみただけよ。\n今のは忘れなさい。"
20041-70000-11830-1 = "過去にあった\n「物々交換」も、"
20041-70000-11840-1 = "こうだったのかしら。"
20041-70000-11850-1 = "合理的な選択ね。"
20041-70000-11860-1 = "最終選択は貴方に委ねるわ。"
20041-70000-11870-1 = "ここでは、少し\n変わった分析方法を\n採用しているの。"
20041-70000-11880-1 = "一言でいうと――\n「偶然に基づいた\n抽出」よ。"
20041-70000-11890-1 = "「くじ」で損を\nする可能性は、\n確率論でも立証済み。"
20041-70000-11900-1 = "……けれど、\n今は仕方ないわね。"
20041-70000-11910-1 = "……ヒマリの嗜好は\n変わらないのね。"
20041-70000-11920-1 = "……多面的考察は\n必要だもの。ええ。"
20041-70000-11930-1 = "分析結果の予測が正確に\nできないというのは……"
20041-70000-11940-1 = "セミナーの人間として、\n少し遺憾ね。"
20041-70000-11950-1 = "もし期待通りの結果が\n得られなかったとしても…"
20041-70000-11960-1 = "私にできることはないの。\n先に謝っておくわね。"
20041-70000-11970-1 = "「神はサイコロを\n振らない」……"
20041-70000-11980-1 = "この命題は誤りだと\nされているのだけれども、"
20041-70000-11990-1 = "私は――ある側面に\nおいては、\n同意しているわ。"
20041-70000-12000-1 = "量子力学という学問は、\n理解するものではないわ。"
20041-70000-12010-1 = "……暗記するものよ。"
20041-70000-12020-1 = "世界とは、人間の\n認知の外にあるもの。"
20041-70000-12030-1 = "……そうね、\nこの運任せの分析と一緒。"
20041-70000-12040-1 = "……それは……！\n本当に……？"
20041-70000-12050-1 = "大数の法則、ね。"
20041-70000-12060-1 = "当たるまで引き続ける…？"
20041-70000-12070-1 = "理論上、間違っては\nないのだけれど…"
20041-70000-12080-1 = "世界の大半は正規分布の\n中に存在する……"
20041-70000-12090-1 = "成し遂げたわね、先生。\nおめでとう。"
