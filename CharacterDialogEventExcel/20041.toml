[translation]
20041-843-280-1 = "You've arrived just in time."
20041-843-290-1 = "Right. I expected you to come around this time."
20041-843-300-1 = "Things are going well, but not to a point where we can let our guard down."
20041-843-310-1 = "We're almost there."
20041-843-320-1 = "I can tell you about it soon."
20041-843-330-1 = "All's well that ends well."
20041-843-340-1 = "...And I mean that."
20041-843-350-1 = "Hm? What's the matter? Poking me like that..."
20041-843-360-1 = "It's hard to understand unless you put it into words."
20041-843-370-1 = "Um, so... Um..."
20041-843-380-1 = "Is there something you need or...anything?"
20041-843-800-1 = "I organized your to-do list."
20041-843-810-1 = "Welcome, Sensei. Here's your to-do list for the day."
20041-843-820-1 = "If you keep on poking me without saying anything..."
20041-843-830-1 = "...I won't be able to understand."
20041-843-840-1 = "By any chance, did you want me to..."
20041-843-850-1 = "...do the same?"
20041-843-860-1 = "Got it. I'll check it off."
20041-843-870-1 = "I'll update the \"completed\" list."
20041-10843-280-1 = "You've arrived just in time."
20041-10843-290-1 = "Right. I expected you to come around now."
20041-10843-300-1 = "Things are going well, but not to the point where we can let our guard down."
20041-10843-310-1 = "We're almost there."
20041-10843-320-1 = "I can tell you about it soon."
20041-10843-330-1 = "All's well that ends well."
20041-10843-340-1 = "...And I mean that."
20041-10843-350-1 = "Hm? What's the matter? Poking me like that..."
20041-10843-360-1 = "It's hard to understand unless you put it into words."
20041-10843-370-1 = "Um, so... Um..."
20041-10843-380-1 = "Is there something you need or...anything?"
20041-10843-800-1 = "I organized your to-do list."
20041-10843-810-1 = "Welcome, Sensei. Here's your to-do list for the day."
20041-10843-820-1 = "If you keep on poking me without saying anything..."
20041-10843-830-1 = "That makes no sense to me."
20041-10843-840-1 = "By any chance, did you want me to..."
20041-10843-850-1 = "...do the same?"
20041-10843-860-1 = "Got it. I'll check it off."
20041-10843-870-1 = "I'll update the \"completed\" list."
20041-70000-11460-1 = "I've only been with you partway..."
20041-70000-11470-1 = "But I look forward to working with you, Sensei."
20041-70000-11480-1 = "You came at the perfect time, Sensei."
20041-70000-11490-1 = "What a rational choice."
20041-70000-11500-1 = "So this is Himari's..."
20041-70000-11510-1 = "I mean OUR base."
20041-70000-11520-1 = "I still can't believe it."
20041-70000-11530-1 = "I'm carrying out the same mission as you."
20041-70000-11540-1 = "It sounds weird coming from me."
20041-70000-11550-1 = "But everyone's treating me so casually..."
20041-70000-11560-1 = "It's not that I dislike it..."
20041-70000-11570-1 = "Outside of engineering..."
20041-70000-11580-1 = "I'm sorry. I don't think I know much about them yet."
20041-70000-11590-1 = "Did you call, Sensei? You were just wondering what I was up to?"
20041-70000-11600-1 = "Try to cut back on irrational actions like that."
20041-70000-11610-1 = "Um... It's not that I hate it..."
20041-70000-11620-1 = "I once believed that I had to know everything."
20041-70000-11630-1 = "Now... I realize there are still things I need to learn."
20041-70000-11640-1 = "How odd. Maybe this is also thanks to you, in a way."
20041-70000-11650-1 = "Himari briefed me on the situation."
20041-70000-11660-1 = "To put it simply, we've discovered mysterious substances..."
20041-70000-11670-1 = "...from the Nameless Gods' power."
20041-70000-11680-1 = "And we need samples. We also think we can resupply with them."
20041-70000-11690-1 = "You're here, Sensei. How many samples do you have?"
20041-70000-11700-1 = "Thank you for your cooperation."
20041-70000-11710-1 = "I'm analyzing the mysterious substances. I'll have the results soon."
20041-70000-11720-1 = "Anyways, this device gives off an incredible amount of heat..."
20041-70000-11730-1 = "Eimi would have a hard time around it."
20041-70000-11740-1 = "I have no complaints regarding how this device functions."
20041-70000-11750-1 = "That's unexpected? Fufu. Even I know when to make concessions."
20041-70000-11760-1 = "It's just that...if the design was a bit more..."
20041-70000-11770-1 = "Nothing's going to change, even if you talk to me."
20041-70000-11780-1 = "Huh? You saw my expression change?"
20041-70000-11790-1 = "...I see. So this is why people say that you can be mean sometimes..."
20041-70000-11800-1 = "That's the result of this analysis."
20041-70000-11810-1 = "Welcome. Which one would you like?"
20041-70000-11820-1 = "I was just trying to imitate... Forget what just happened."
20041-70000-11830-1 = "They say people traded each other for items like this in the past."
20041-70000-11840-1 = "In a way, it feels like we've gone back in time."
20041-70000-11850-1 = "Seems to be a rational result. Good choice."
20041-70000-11860-1 = "The results are in. I'll let you decide which one to choose, Sensei."
20041-70000-11870-1 = "We used a bit of a different analysis method over here."
20041-70000-11880-1 = "To put it simply, it's extraction based on contingency."
20041-70000-11890-1 = "Statistically speaking, it's highly likely for something like a lottery to end in a loss."
20041-70000-11900-1 = "...However, I suppose we have no other choice here."
20041-70000-11910-1 = "Seems like Himari still enjoys things like this."
20041-70000-11920-1 = "Well... I suppose it's good to have various approaches."
20041-70000-11930-1 = "The fact that the analysis results cannot be predicted accurately..."
20041-70000-11940-1 = "...as a member of Seminar, I find it a bit unfortunate."
20041-70000-11950-1 = "If the results aren't satisfactory..."
20041-70000-11960-1 = "I'm sorry, Sensei. There's nothing I can do about that either."
20041-70000-11970-1 = "Although it turned out to be false..."
20041-70000-11980-1 = "...when people said that the gods don't play dice."
20041-70000-11990-1 = "There's something I can understand about it."
20041-70000-12000-1 = "The field of quantum mechanics isn't something you \"understand,\" so to speak."
20041-70000-12010-1 = "You begin with...memorizing things and go from there."
20041-70000-12020-1 = "The world is something that's beyond our understanding."
20041-70000-12030-1 = "...That's correct. Just like this analysis that relies on luck."
20041-70000-12040-1 = "Did that...really work?"
20041-70000-12050-1 = "I suppose it's the law of large numbers."
20041-70000-12060-1 = "If you don't hit the jackpot, keep going until you hit it..."
20041-70000-12070-1 = "That's not wrong to say, but..."
20041-70000-12080-1 = "They say most things in the world are within normal distribution."
20041-70000-12090-1 = "Congrats, Sensei. Great work."
