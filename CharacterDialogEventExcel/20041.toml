[translation]
20041-843-280-1 = "알맞은 타이밍에\n도착했네."
20041-843-290-1 = "그래. 지금쯤\n올 거라 생각했어."
20041-843-300-1 = "순조롭게 진행\n중이지만, 아직 안심할\n정도는 아니야."
20041-843-310-1 = "이제 거의 다 왔어."
20041-843-320-1 = "곧 말해줄 수 있겠네."
20041-843-330-1 = "잘 해결돼서 다행이네."
20041-843-340-1 = "……이건 진심이야."
20041-843-350-1 = "응? 무슨 일이야?\n갑자기 건드리고."
20041-843-360-1 = "말로 표현해\n주지 않으면,\n이해하기 힘들어."
20041-843-370-1 = "아니, 그러니까……\n으음……."
20041-843-380-1 = "뭔가 필요한 거라도\n있는 거야?"
20041-843-800-1 = "해야 할 일들을\n정리해 봤어."
20041-843-810-1 = "잘 왔어, 선생님.\n오늘의 할 일들이야."
20041-843-820-1 = "말없이\n건드리기만 하면……"
20041-843-830-1 = "이해할 수 없어."
20041-843-840-1 = "혹시 나도 똑같이"
20041-843-850-1 = "해주길 바라는 거야?"
20041-843-860-1 = "확인했어. 체크할게."
20041-843-870-1 = "완료된 리스트로 바꿔둘게."
20041-10843-280-1 = "알맞은 타이밍에\n도착했네."
