[translation]
20041-843-280-1 = "มาถึงตรงเวลา\nพอดีเลยนะ"
20041-843-290-1 = "อื้อ ฉันคิดว่าจะมา\nราวๆ นี้ละ"
20041-843-300-1 = "งานกำลังราบรื่น\nแต่ก็ยังวางใจไม่ได้หรอก"
20041-843-310-1 = "เกือบถึงแล้วละ"
20041-843-320-1 = "คงบอกได้เร็วๆ นี้แล้วนะ"
20041-843-330-1 = "โล่งอกไปทีนะที่คลี่คลายได้"
20041-843-340-1 = "ฉันพูดจริงนะ..."
20041-843-350-1 = "หืม? มีเรื่องอะไรเหรอ?\nจู่ๆ ก็มาสะกิดกัน"
20041-843-360-1 = "ถ้าไม่บอกเป็นคำพูด\nฉันก็ไม่เข้าใจหรอกนะ"
20041-843-370-1 = "ไม่สิ คือว่า...\nอืม..."
20041-843-380-1 = "มีอะไรที่ต้องการ\nหรือเปล่า?"
20041-843-800-1 = "ฉันลองสรุป\nงานที่ต้องทำแล้ว"
20041-843-810-1 = "มาแล้วเหรอ คุณครู\nนี่คืองานที่ต้องทำวันนี้"
20041-843-820-1 = "ถ้าเอาแต่สะกิดกัน\nโดยไม่พูดอะไร..."
20041-843-830-1 = "ฉันก็ไม่เข้าใจหรอกนะ"
20041-843-840-1 = "หรือว่าอยากให้ฉัน"
20041-843-850-1 = "ทำอย่างเดียวกันน่ะ?"
20041-843-860-1 = "โอเค ฉันจะเช็กให้นะ"
20041-843-870-1 = "ฉันจะเปลี่ยนเป็นลิสต์ที่สมบูรณ์ให้"
