[translation]
20041-843-280-1 = "時機相當適當呢。"
20041-843-290-1 = "我也覺得你應該\n差不多要到了。"
20041-843-300-1 = "一切都很順利。\n不過，還不到\n可以安心的階段。"
20041-843-310-1 = "不久之後，應該就能\n給出統整好的報告。"
20041-843-320-1 = "再稍等一會吧。"
20041-843-330-1 = "能解決真是太好了。"
20041-843-340-1 = "……這是我的真心話。"
20041-843-350-1 = "……突然碰我，\n有什麼事嗎？"
20041-843-360-1 = "能請你用說的\n告訴我嗎？"
20041-843-370-1 = "所以……那個……"
20041-843-380-1 = "你找我……\n是想尋求什麼嗎？"
20041-843-800-1 = "清單的列舉已經完成了。"
20041-843-810-1 = "這就是今日的待辦事項。"
20041-843-820-1 = "……無法理解老師的意圖。"
20041-843-830-1 = "默默觸摸可是\n無法傳達的哦。"
20041-843-840-1 = "莫非……"
20041-843-850-1 = "你希望我做同樣的事嗎？"
20041-843-860-1 = "我會確認的。"
20041-843-870-1 = "清單已經更新了。"
20041-10843-280-1 = "時機相當適當呢。"
20041-10843-290-1 = "我也覺得你應該\n差不多要到了。"
20041-10843-300-1 = "一切都很順利。\n不過，還不到\n可以安心的階段。"
20041-10843-310-1 = "不久之後，應該就能\n給出統整好的報告。"
20041-10843-320-1 = "再稍等一會吧。"
20041-10843-330-1 = "能解決真是太好了。"
20041-10843-340-1 = "……這是我的真心話。"
20041-10843-350-1 = "……突然碰我，\n有什麼事嗎？"
20041-10843-360-1 = "能請你用說的\n告訴我嗎？"
20041-10843-370-1 = "所以……那個……"
20041-10843-380-1 = "你找我……\n是想尋求什麼嗎？"
20041-10843-800-1 = "清單的列舉已經完成了。"
20041-10843-810-1 = "這就是今日的待辦事項。"
20041-10843-820-1 = "……無法理解老師的意圖。"
20041-10843-830-1 = "默默觸摸可是\n無法傳達的哦。"
20041-10843-840-1 = "莫非……"
20041-10843-850-1 = "你希望我做同樣的事嗎？"
20041-10843-860-1 = "我會確認的。"
20041-10843-870-1 = "清單已經更新了。"
20041-70000-11460-1 = "雖然是以中途參加\n的形式……"
20041-70000-11470-1 = "……往後請多\n指教囉，老師。"
20041-70000-11480-1 = "你是個能夠\n嚴守時間的人呢。"
20041-70000-11490-1 = "真是合理的行動。"
20041-70000-11500-1 = "這裡就是陽葵的……"
20041-70000-11510-1 = "不，是我們的基地啊。"
20041-70000-11520-1 = "……我還是，\n有點缺乏實感。"
20041-70000-11530-1 = "對於能跟老師……\n參加同一個作戰這點。"
20041-70000-11540-1 = "……大家對待我\n都還挺隨興的。"
20041-70000-11550-1 = "雖然我沒有\n不喜歡的意思……"
20041-70000-11560-1 = "但讓我感到\n有點困惑也是事實。"
20041-70000-11570-1 = "在工學的範圍以外……"
20041-70000-11580-1 = "對不起，我\n並不是那麼了解。"
20041-70000-11590-1 = "……怎麼了嗎？\n……只是試著搭話而已？"
20041-70000-11600-1 = "那種不合理的行為，\n還請克制一點，老師。"
20041-70000-11610-1 = "……但我也沒說不喜歡。"
20041-70000-11620-1 = "以前，我曾認為\n必須掌握一切。"
20041-70000-11630-1 = "不過現在……我已經\n察覺一名人類能夠掌握的\n範疇是存在極限的。"
20041-70000-11640-1 = "……也許，\n是多虧了老師吧。"
20041-70000-11650-1 = "我從陽葵那邊接手了。"
20041-70000-11660-1 = "現在，各地都能發現\n因「無名之神」──"
20041-70000-11670-1 = "而產生的神祕物質。"
20041-70000-11680-1 = "只要有樣本的話，\n要重新補給也是可能的。"
20041-70000-11690-1 = "讓我看看\n收集回來的樣本吧。"
20041-70000-11700-1 = "謝謝你的合作。"
20041-70000-11710-1 = "正在進行「物質」的分析。\n並且從中生產副產物。"
20041-70000-11720-1 = "這個裝置，會放出\n相當多的熱氣呢……"
20041-70000-11730-1 = "對英美來說\n可能會有點辛苦。"
20041-70000-11740-1 = "我對裝置的構造\n並沒有不滿。"
20041-70000-11750-1 = "覺得意外？呵呵，即便是我，\n面對優秀的東西也會老實承認的。"
20041-70000-11760-1 = "不過，要是設計跟細節\n能再多一些合理性……"
20041-70000-11770-1 = "……就算做那種事情，\n我也不認為能有所收穫。"
20041-70000-11780-1 = "……能見到\n我表情的變化？"
20041-70000-11790-1 = "……你之所以被說奇怪\n的理由，我現在知道了。"
20041-70000-11800-1 = "這是這次的分析結果。"
20041-70000-11810-1 = "歡迎光臨，\n請問要點什麼呢？"
20041-70000-11820-1 = "……只是模仿一下而已。\n剛才的請你忘了吧。"
20041-70000-11830-1 = "過去所謂的\n「以物易物」……"
20041-70000-11840-1 = "就是這麼回事嗎。"
20041-70000-11850-1 = "是合理的選擇呢。"
20041-70000-11860-1 = "最終選擇就交給你了。"
20041-70000-11870-1 = "這個地方，採用了\n稍有差異的分析方法。"
20041-70000-11880-1 = "一言以蔽之──就是\n「基於偶然的提取」。"
20041-70000-11890-1 = "因「彩券」而損失的\n可能性，在機率學上\\也已經得到了證明。"
20041-70000-11900-1 = "……不過，\n現在也沒辦法了。"
20041-70000-11910-1 = "……陽葵的嗜好\n依舊沒變呢。"
20041-70000-11920-1 = "……多方面的考察\n也是必要的。嗯嗯。"
20041-70000-11930-1 = "對於分析結果的預測\n無法正確執行這點……"
20041-70000-11940-1 = "作為研討會的一員，\n實在有點遺憾。"
20041-70000-11950-1 = "即便無法獲得與\n預期相同的結果……"
20041-70000-11960-1 = "我也無能為力。\n在此先向你道歉。"
20041-70000-11970-1 = "「神不會擲骰子」……"
20041-70000-11980-1 = "這個命題雖然被\n認為是錯誤的……"
20041-70000-11990-1 = "但我──\n在某方面是同意的。"
20041-70000-12000-1 = "量子力學這門學問，\n並不是用來理解。"
20041-70000-12010-1 = "……是用來背誦的。"
20041-70000-12020-1 = "所謂的世界，是存在於\n人類認知之外的東西。"
20041-70000-12030-1 = "……是啊，就跟這種\n依靠運氣的分析一樣。"
20041-70000-12040-1 = "那是……！\n居然真的……？"
20041-70000-12050-1 = "大數法則……是嗎。"
20041-70000-12060-1 = "抽到中獎為止……？"
20041-70000-12070-1 = "理論上，雖然\n這樣並沒有錯……"
20041-70000-12080-1 = "世界的絕大部分都\n存在於常態分佈之中……"
20041-70000-12090-1 = "你辦到了呢，老師。\n恭喜你。"
