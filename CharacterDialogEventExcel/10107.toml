[translation]
10107-833-1300-1 = "Whoa! Lots of fun things!"
10107-833-1310-1 = "Sensei! Over here! Sit next to me!"
10107-833-1320-1 = "I saved you a seat, Sensei!"
10107-833-1330-1 = "The party is in full swing!"
10107-833-1340-1 = "Are you enjoying it too, Sensei?"
10107-833-1350-1 = "This rambunctious party is almost over!"
10107-833-1360-1 = "Let's enjoy it to the fullest, so we have no regrets!"
10107-833-1370-1 = "A lot happened, but in the end..."
10107-833-1380-1 = "It was a toootally fun party!"
10107-833-1390-1 = "Yes? You called?!"
10107-833-1400-1 = "Let's look for a picture to use in next issue!"
10107-833-1410-1 = "Sensei, say \"aah\"!"
10107-833-1420-1 = "Ta-da! It's the Pandemonium Society's special chocolate!"
10107-833-1430-1 = "How is it? It's sweet and delicious, right?"
10107-833-1440-1 = "Fun music, scrumptious food, it's all great, but..."
10107-833-1450-1 = "Being with you makes everything feel different!"
