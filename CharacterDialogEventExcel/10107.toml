[translation]
10107-833-1300-1 = "ว้าว~! มีเรื่องน่าสนุกๆ เพียบเลย~!"
10107-833-1310-1 = "คุณครู! ทางนี้ค่ะ!\nที่นั่งข้างๆ ฉัน!"
10107-833-1320-1 = "ฉันจองที่นั่ง\nไว้ให้คุณครูแล้วค่ะ~!"
10107-833-1330-1 = "บรรยากาศงานปาร์ตี้\nมาถึงจุดพีคแล้วค่ะ!"
10107-833-1340-1 = "คุณครูเองก็สนุกอยู่\nใช่มั้ยคะ~?"
10107-833-1350-1 = "ปาร์ตี้แสนสนุก\nกำลังใกล้จะจบแล้วละค่ะ!"
10107-833-1360-1 = "มาสนุกกันให้เต็มที่\nจนไม่เสียใจทีหลังกันเถอะค่ะ!"
10107-833-1370-1 = "ถึงจะมีเรื่องต่างๆ เกิดขึ้นมากมาย\nแต่สุดท้ายแล้ว..."
10107-833-1380-1 = "มันก็เป็นปาร์ตี้\nที่สนุกสุดๆ เลยนะคะ!"
10107-833-1390-1 = "คะ? เรียกฉันเหรอคะ~?!"
10107-833-1400-1 = "มาถ่ายรูปที่จะ\nใช้ประโยชน์ได้\nในฉบับต่อไปกันเลยมั้ยคะ~!"
10107-833-1410-1 = "คุณครู\nอ๊ะ~ ลองทำดูสิคะ!"
10107-833-1420-1 = "แถ่นแท้น ช็อกโกแลตโฮมเมด\nของแพนเดโมเนียม โซไซตี้ค่ะ!"
10107-833-1430-1 = "เป็นยังไงบ้างคะ?\nหวานอร่อยดีใช่มั้ยคะ!"
10107-833-1440-1 = "ถึงเสียงเพลงระรื่นหู\nกับอาหารอร่อยๆ เป็นเรื่องดีก็จริง..."
10107-833-1450-1 = "แต่พอได้อยู่กับคุณครูแบบนี้\nก็รู้สึกว่ามีบางอย่าง\nต่างออกไปเลยนะคะ!"
