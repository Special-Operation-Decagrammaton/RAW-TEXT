[translation]
10107-833-1300-1 = "와아~!\n재밌는 게 잔뜩~!"
10107-833-1310-1 = "선생님! 여기에요!\n제 옆자리!"
10107-833-1320-1 = "선생님 자리,\n맡아놨습니다~!"
10107-833-1330-1 = "파티 분위기가\n무르익었네요!"
10107-833-1340-1 = "선생님도\n즐기고 계신가요~?"
10107-833-1350-1 = "슬슬 즐거운\n파티도 끝나가네요!"
10107-833-1360-1 = "후회 없이\n즐기도록 할까요!"
10107-833-1370-1 = "이런저런 일들이\n있었지만,\n결론적으로는…"
10107-833-1380-1 = "완~전 즐거운\n파티였네요!"
10107-833-1390-1 = "네? 부르셨나요~?!"
10107-833-1400-1 = "다음 호에\n쓸만한 사진,\n건져볼까요~!"
10107-833-1410-1 = "선생님,\n아~ 해보세요!"
10107-833-1420-1 = "짠! 만마전 특제\n초콜릿이랍니다!"
10107-833-1430-1 = "어때요?\n달콤해서 맛있죠!"
10107-833-1440-1 = "즐거운 음악도,\n맛있는 음식도 좋지만…"
10107-833-1450-1 = "역시, 선생님이\n함께 있으니\n뭔가 다르네요!"
