[translation]
10107-833-1300-1 = "わ～！\nお楽しみが\nいっぱい！"
10107-833-1310-1 = "先生！\nこっちです！\n私の隣！"
10107-833-1320-1 = "先生の席、とって\nありますよ～！"
10107-833-1330-1 = "盛り上がってますね～！"
10107-833-1340-1 = "先生、\n楽しんでますか～？"
10107-833-1350-1 = "楽しいパーティーも\n大詰め！"
10107-833-1360-1 = "最後まで満喫して\nいきましょ～！"
10107-833-1370-1 = "いろいろ\nありましたけど…"
10107-833-1380-1 = "最っ高に！\n楽しい時間でした！"
10107-833-1390-1 = "は～い！\nお呼びですか～？"
10107-833-1400-1 = "次号に\n使えそうな写真、\n撮っていきますよ～"
10107-833-1410-1 = "先生、あ～ん\nしてください！"
10107-833-1420-1 = "はいっ、今のは\n「万魔殿特製チョコ」\nでした！"
10107-833-1430-1 = "どうですか？\n甘くて\nおいしいですよね！"
10107-833-1440-1 = "素敵な音楽も、\n美味しい料理も\n好きですけど…"
10107-833-1450-1 = "やっぱり、\n先生と一緒だと\nなんか違いますね！"
