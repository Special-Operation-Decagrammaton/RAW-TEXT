[translation]
16008-810-10-1 = "今日も忙しそうだね、\n先生。"
16008-810-20-1 = "さっき買ってきたん\nだけど、チョコドーナッツ\nでも食べる？"
16008-810-30-1 = "パトロール\nめんどくさ……。"
16008-810-40-1 = "いやぁ、青春だねぇ……。\n熱くて楽しそうで\n結構なことだ……"
16008-810-50-1 = "なーんかトラブルの\n予感が……。"
16008-810-60-1 = "最終的に何とか\n落ち着いたね。"
16008-810-70-1 = "この平和がずっと続いて\nほしいもんだけど……。"
16008-810-80-1 = "ふぅ、平和だねぇ。"
16008-810-90-1 = "バレンタインデーの\nこういう賑やかな\n雰囲気は、悪くないね。"
16008-810-100-1 = "何より……\nこの時期が\n終わるとすぐに、"
16008-810-110-1 = "売れ残ったチョコ\nドーナッツが大量に\n安売りされるから！"
16008-810-120-1 = "よっぽどのことが\nない限り、"
16008-810-130-1 = "私たち生活安全局まで\n出動するようなことは\n無いと思うけどね。"
16008-810-140-1 = "例えば……"
16008-810-150-1 = "災厄の狐が\n装甲車を盗むとか。"
16008-810-160-1 = "ははっ、冗談冗談。\nそんなこと\n起きっこないって。"
