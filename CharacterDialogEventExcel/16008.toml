[translation]
16008-810-10-1 = "Looks like you're busy, as usual, Sensei."
16008-810-20-1 = "I bought some chocolate donuts. Do you want one?"
16008-810-30-1 = "I don't wanna go on patrol..."
16008-810-40-1 = "Everyone is so lively. Ah, the passion of youth! How nice..."
16008-810-50-1 = "I have a feeling something bad is gonna happen."
16008-810-60-1 = "It ended without any huge issues."
16008-810-70-1 = "I hope this peace lasts forever..."
16008-810-80-1 = "Ah, so peaceful."
16008-810-90-1 = "I love the lively atmosphere of Valentine's Day so much."
16008-810-100-1 = "When all the commotion is over..."
16008-810-110-1 = "There'll be leftover chocolate donuts on sale!"
16008-810-120-1 = "Unless something major happens..."
16008-810-130-1 = "...the Public Safety Bureau won't need to get involved."
16008-810-140-1 = "For example..."
16008-810-150-1 = "Say the Fox of Calamity were to steal an armored tank."
16008-810-160-1 = "Haha. Kidding! Just a joke! There's no way that could happen so easily."
