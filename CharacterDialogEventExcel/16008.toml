[translation]
16008-810-10-1 = "วันนี้ก็ยุ่งน่าดูเลยสินะ คุณครู"
16008-810-20-1 = "จะชิมโดนัทช็อกโกแลต\nที่ซื้อมาเมื่อกี้ดูสักชิ้นไหม?"
16008-810-30-1 = "ไม่อยากไปลาดตระเวนเลย..."
16008-810-40-1 = "ทุกคนสมเป็นวัยรุ่นจัง\nไฟแรงสุดๆ ไฟแรงมาก~"
16008-810-50-1 = "รู้สึกสังหรณ์ใจ\nไม่ดีเอาซะเลย..."
16008-810-60-1 = "สุดท้ายก็จบได้โดย\nไม่มีปัญหาอะไรแฮะ"
16008-810-70-1 = "ถ้าสงบสุขแบบนี้\nไปเรื่อยๆ ก็คงดีสินะ..."
16008-810-80-1 = "เฮ้อ สงบสุขดีจังเลย~"
16008-810-90-1 = "ฉันชอบบรรยากาศครึกครื้น\nของวันวาเลนไทน์แบบนี้\nมากๆ เลยล่ะ"
16008-810-100-1 = "พองานเทศกาลจบลง..."
16008-810-110-1 = "โดนัทช็อกโกแลตที่เหลือ\nก็จะลดราคาเยอะเลยล่ะ!"
16008-810-120-1 = "ถ้าไม่เกิดเรื่อง\nที่รุนแรงมากจริงๆ..."
16008-810-130-1 = "สำนักรักษาความปลอดภัย\nคงไม่ได้ออกโรงหรอก"
16008-810-140-1 = "ยกตัวอย่างเช่น..."
16008-810-150-1 = "จิ้งจอกแห่งความพินาศ\nขโมยรถหุ้มเกราะไป..."
16008-810-160-1 = "ฮ่าฮ่า เรื่องแบบนั้น\nคงไม่ได้เกิดขึ้นง่ายๆ หรอก"
16008-10810-10-1 = "วันนี้ดูยุ่งจังเลยน้าครู~"
16008-10810-20-1 = "ฉันเพิ่งซื้อโดนัทช็อกโกแลตมา\nจะกินสักชิ้นมั้ย?"
16008-10810-30-1 = "ขี้เกียจลาดตระเวนจัง..."
16008-10810-40-1 = "ทุกคนสมกับเป็นวัยรุ่นกันจัง\nไฟแรงสุดๆ ไฟแรงมาก~\nดีแล้วละนะ..."
16008-10810-50-1 = "รู้สึกสังหรณ์ใจ\nไม่ดีเอาซะเลย..."
16008-10810-60-1 = "สุดท้ายก็จบได้โดย\nไม่มีปัญหาอะไรแฮะ"
