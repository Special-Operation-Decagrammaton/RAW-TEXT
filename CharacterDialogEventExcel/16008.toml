[translation]
16008-810-10-1 = "今天似乎也\n很忙呢，老師。"
16008-810-20-1 = "雖然是剛剛才買的，\n要不要吃巧克力甜甜圈？"
16008-810-30-1 = "巡邏真麻煩……"
16008-810-40-1 = "哎呀，真是青春呢……\n看起來既熱情又快樂\n真是不錯……"
16008-810-50-1 = "總～覺得有股\n會出狀況的預感……"
16008-810-60-1 = "結果總算是\n平靜下來了呢。"
16008-810-70-1 = "希望這樣的和平\n可以持續下去……"
16008-810-80-1 = "呼，真是和平呢。"
16008-810-90-1 = "情人節這種\n熱鬧的氣氛，\n真不錯呢。"
16008-810-100-1 = "更重要的是……\n這個時期結束之後， "
16008-810-110-1 = "賣剩的巧克力甜甜圈\n就會大量特價！"
16008-810-120-1 = "只要沒有發生\n相當嚴重的事，"
16008-810-130-1 = "我想應該不會\n連我們生活安全局\n都要出動。"
16008-810-140-1 = "例如……"
16008-810-150-1 = "災厄之狐偷走\n裝甲車之類的。"
16008-810-160-1 = "哈哈，開玩笑開玩笑。\n那種事不會發生啦。"
