[translation]
16008-810-10-1 = "오늘도 바빠 보이네, 선생."
16008-810-20-1 = "아까 산 거긴 하지만,\n초코 도넛이라도 먹을래?"
16008-810-30-1 = "순찰 하기 싫어……"
16008-810-40-1 = "이야, 다들 청춘이구만……\n뜨겁게 즐기는 것 같아서\n다행이야……"
16008-810-50-1 = "뭔가 말썽의 예감이……"
16008-810-60-1 = "결국 어떻게든 잘 끝났네."
16008-810-70-1 = "이 평화가 계속되면\n좋을 텐데 말이야……"
16008-810-80-1 = "후우, 평화롭구만."
16008-810-90-1 = "발렌타인 데이의\n이런 떠들썩한 분위기는,\n나쁘지 않아."
16008-810-100-1 = "무엇보다……\n이 시즌이 끝나면,"
16008-810-110-1 = "팔다 남은 초코 도넛을\n잔뜩, 저렴하게 판매하니까!"
16008-810-120-1 = "엄청난 소동이\n벌어지지 않는 한,"
16008-810-130-1 = "우리 생활안전국까지\n출동하는 일은 없을 거라고\n생각하지만……"
16008-810-140-1 = "예를 들자면"
16008-810-150-1 = "재액의 여우가 장갑차라도\n탈취한다던가……"
16008-810-160-1 = "하하. 농담이야, 농담.\n그런 일이 일어날 리 없잖아."
