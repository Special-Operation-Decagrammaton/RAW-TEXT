[translation]
10146-10 = "นะ..."
10146-20 = "นี่มัน...\nเกิดอะไรขึ้นกันแน่?!"
10146-30 = "มะ... ไม่ได้ตกใจ\nสักนิดเดียว"
10146-40 = "เพราะทุกอย่างกำลังเป็นไป\nตามแผนของเราอยู่แล้ว อืม!"
10146-50 = "ยัยอิโรฮะ...\nแค่เรื่องจิ๊บจ๊อยแค่นั้น\nจะเอาจนถึงเมื่อไรกัน..."
10146-60 = "เย้~! ยินดีต้อนรับสู่เรือ\nแมน ออฟ แพนเดโมเนียม!\nโยะโฮโฮโฮ!"
10146-70 = "อ้อ ครู\nสนุกกับการท่องเที่ยว\nอยู่หรือเปล่า?"
10146-80 = "คิกคิกคิก!\nถูกต้องตาม\nที่เราคาดไว้จริงๆ!"
10146-90 = "สุดท้ายแล้ว\nทุกอย่างก็ไปได้สวยไม่ใช่เหรอ!"
10146-100 = "คะ... ครู\nขอโทษนะ แต่อย่ายุ่ง\nกับเราเลยจะดีกว่า"
10146-110 = "ระ... เราเมาเรือ\nเลยรู้สึกคลื่นไส้..."
10146-120 = "ชิ เพราะแบบนี้แหละ\nเราถึงไม่ค่อยอยากมาทะเล"
10146-130 = "ไม่สิ ถึงแม้คนวางแผน\nทริปนี้จะเป็นเราก็เถอะ..."
10146-140 = "อ๊ะ! แต่ว่า! ถ้าครูก็ได้เห็นว่า\nอิบูกิชอบใจแค่ไหน ตอนดู\nการ์ตูนปลาเรื่องนั้นละก็!"
10146-150 = "ถ้าครูได้ดูด้วยคนละก็!"
10146-160 = "ตั้งแต่เมื่อกี้แล้วนะ ทำไมถึง\nเอาแต่มองเราล่ะ...?"
10146-170 = "อ๊ะ! หรือว่าจะเป็นอย่างนั้น!"
10146-180 = "เมื่อตกอยู่ในสถานการณ์คับขัน\nในที่สุดก็ล่วงรู้ความในใจ\nของตัวเองแล้วงั้นเหรอ?!"
10146-190 = "ดะ... เดี๋ยวก่อน เรายัง\nไม่ได้เตรียมใจเลย!"
10146-200 = "ยัยอิโรฮะ...\nไม่คิดเลยว่าจะเล่น\nโซเชียลมีเดียอยู่ด้วย"
10146-210 = "ว่าแต่ทำไมยังไม่มาติดตาม\nบัญชีแพนเดโมเนียม โซไซตี้\nของเราล่ะ?"
10146-1170 = "ผลงานย่อมได้รับ\nผลตอบแทนเป็นธรรมดา"
10146-1180 = "นี่แหละคือพื้นฐาน\nของศิลปะการใช้คน"
10146-1190 = "มาก็ดีเลย ครู!\nที่นี่มีงานต้องทำเพียบเลย!"
10146-1200 = "บางทีครูอาจช่วยเราได้\nนิดหน่อยนะ"
10146-1210 = "เรารู้ดีอยู่เต็มอกว่าเรามีเสน่ห์"
10146-1220 = "แต่ตอนนี้ต้องมีสมาธิกับภารกิจ\nและผลตอบแทนต่างหาก"
10146-1230 = "ถึงจะบอกว่าการสัมผัสตัวกันพอประมาณ\nจะช่วยเพิ่มความสนิทสนม..."
10146-1240 = "...แต่เราก็เขินอาย\nเป็นเหมือนกันนะ"
10146-1250 = "บางทีเราก็คิดว่า..."
10146-1260 = "ทั้งหมดนี้อาจเป็นแค่\nความฝันในคืนฤดูร้อนหรือเปล่า"
10146-1270 = "แต่ก็คงไม่มีทาง\nเป็นแบบนั้นหรอก!"
10146-1280 = "คิกคิกคิก!"
10146-1290 = "การจัดการงานของครูนั้น\nยอดเยี่ยมจริงๆ"
10146-1300 = "ยิ่งรู้จัก ก็ยิ่งเป็นคนที่\nอยากเก็บไว้ข้างกายนะ"
