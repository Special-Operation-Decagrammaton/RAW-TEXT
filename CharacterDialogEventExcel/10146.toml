[translation]
10146-860-10-1 = "นะ..."
10146-860-20-1 = "นี่มัน...\nเกิดอะไรขึ้นกันแน่?!"
10146-860-30-1 = "มะ... ไม่ได้ตกใจ\nสักนิดเดียว"
10146-860-40-1 = "เพราะทุกอย่างกำลังเป็นไป\nตามแผนของเราอยู่แล้ว อืม!"
10146-860-50-1 = "ยัยอิโรฮะ...\nแค่เรื่องจิ๊บจ๊อยแค่นั้น\nจะเอาจนถึงเมื่อไรกัน..."
10146-860-60-1 = "เย้~! ยินดีต้อนรับสู่เรือ\nแมน ออฟ แพนเดโมเนียม!\nโยะโฮโฮโฮ!"
10146-860-70-1 = "อ้อ ครู\nสนุกกับการท่องเที่ยว\nอยู่หรือเปล่า?"
10146-860-80-1 = "คิกคิกคิก!\nถูกต้องตาม\nที่เราคาดไว้จริงๆ!"
10146-860-90-1 = "สุดท้ายแล้ว\nทุกอย่างก็ไปได้สวยไม่ใช่เหรอ!"
10146-860-100-1 = "คะ... ครู\nขอโทษนะ แต่อย่ายุ่ง\nกับเราเลยจะดีกว่า"
10146-860-110-1 = "ระ... เราเมาเรือ\nเลยรู้สึกคลื่นไส้..."
10146-860-120-1 = "ชิ เพราะแบบนี้แหละ\nเราถึงไม่ค่อยอยากมาทะเล"
10146-860-130-1 = "ไม่สิ ถึงแม้คนวางแผน\nทริปนี้จะเป็นเราก็เถอะ..."
10146-860-140-1 = "อ๊ะ! แต่ว่า! ถ้าครูก็ได้เห็นว่า\nอิบูกิชอบใจแค่ไหน ตอนดู\nการ์ตูนปลาเรื่องนั้นละก็!"
10146-860-150-1 = "ถ้าครูได้ดูด้วยคนละก็!"
10146-860-160-1 = "ตั้งแต่เมื่อกี้แล้วนะ ทำไมถึง\nเอาแต่มองเราล่ะ...?"
10146-860-170-1 = "อ๊ะ! หรือว่าจะเป็นอย่างนั้น!"
10146-860-180-1 = "เมื่อตกอยู่ในสถานการณ์คับขัน\nในที่สุดก็ล่วงรู้ความในใจ\nของตัวเองแล้วงั้นเหรอ?!"
10146-860-190-1 = "ดะ... เดี๋ยวก่อน เรายัง\nไม่ได้เตรียมใจเลย!"
10146-860-200-1 = "ยัยอิโรฮะ...\nไม่คิดเลยว่าจะเล่น\nโซเชียลมีเดียอยู่ด้วย"
10146-860-210-1 = "ว่าแต่ทำไมยังไม่มาติดตาม\nบัญชีแพนเดโมเนียม โซไซตี้\nของเราล่ะ?"
10146-860-1170-1 = "ผลงานย่อมได้รับ\nผลตอบแทนเป็นธรรมดา"
10146-860-1180-1 = "นี่แหละคือพื้นฐาน\nของศิลปะการใช้คน"
10146-860-1190-1 = "มาก็ดีเลย ครู!\nที่นี่มีงานต้องทำเพียบเลย!"
10146-860-1200-1 = "บางทีครูอาจช่วยเราได้\nนิดหน่อยนะ"
10146-860-1210-1 = "เรารู้ดีอยู่เต็มอกว่าเรามีเสน่ห์"
10146-860-1220-1 = "แต่ตอนนี้ต้องมีสมาธิกับภารกิจ\nและผลตอบแทนต่างหาก"
10146-860-1230-1 = "ถึงจะบอกว่าการสัมผัสตัวกันพอประมาณ\nจะช่วยเพิ่มความสนิทสนม..."
10146-860-1240-1 = "...แต่เราก็เขินอาย\nเป็นเหมือนกันนะ"
10146-860-1250-1 = "บางทีเราก็คิดว่า..."
10146-860-1260-1 = "ทั้งหมดนี้อาจเป็นแค่\nความฝันในคืนฤดูร้อนหรือเปล่า"
10146-860-1270-1 = "แต่ก็คงไม่มีทาง\nเป็นแบบนั้นหรอก!"
10146-860-1280-1 = "คิกคิกคิก!"
10146-860-1290-1 = "การจัดการงานของครูนั้น\nยอดเยี่ยมจริงๆ"
10146-860-1300-1 = "ยิ่งรู้จัก ก็ยิ่งเป็นคนที่\nอยากเก็บไว้ข้างกายนะ"
