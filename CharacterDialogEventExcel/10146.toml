[translation]
10146-860-10-1 = "...How."
10146-860-20-1 = "...How could this happen?!"
10146-860-30-1 = "I-I was not flustered at all."
10146-860-40-1 = "Everything's going according to my plan, hmm!"
10146-860-50-1 = "Iroha... Just how long is she going to drag this out?"
10146-860-60-1 = "Yarrgh! Welcome aboard the Man o' Pandemonium! Yohohoho!"
10146-860-70-1 = "Ah, Sensei, are you enjoying the trip?"
10146-860-80-1 = "Kihehe! Just as I expected!"
10146-860-90-1 = "Everything worked out in the end!"
10146-860-100-1 = "S-Sensei. Sorry, but please leave me alone."
10146-860-110-1 = "Th-The seasickness is making me feel..."
10146-860-120-1 = "Tch, this is why I didn't want to sail the seas."
10146-860-130-1 = "Sure, yes, I'm the one who planned this trip, but..."
10146-860-140-1 = "Ah! But Ibuki was so happy when she saw that fish cartoon..."
10146-860-150-1 = "You should've seen it too!"
10146-860-160-1 = "Why do you keep poking me...?"
10146-860-170-1 = "Ah! Could it be?!"
10146-860-180-1 = "Have you finally realized your true feelings after being pushed to the limit?!"
10146-860-190-1 = "W-Wait! I am not mentally ready yet!"
10146-860-200-1 = "Iroha... I can't believe she's on social media."
10146-860-210-1 = "Then why isn't she following my Pandemonium Society account?"
10146-860-1170-1 = "It is only befitting that achievements be rewarded."
10146-860-1180-1 = "Such is the foundation of the military arts."
10146-860-1190-1 = "Welcome, Sensei! There's plenty of work to be done!"
10146-860-1200-1 = "Perhaps you could lend a hand, Sensei."
10146-860-1210-1 = "I understand that I am very attractive."
10146-860-1220-1 = "But now is the time to focus on the mission and rewards."
10146-860-1230-1 = "They say appropriate physical contact fosters a sense of closeness..."
10146-860-1240-1 = "...But even I have a sense of shame."
10146-860-1250-1 = "...Sometimes, I find myself thinking."
10146-860-1260-1 = "Perhaps this is all a midsummer night's dream."
10146-860-1270-1 = "Well, there's no way!"
10146-860-1280-1 = "Kihehe!"
10146-860-1290-1 = "The way you handle work is truly incredible, Sensei."
10146-860-1300-1 = "The more I learn about you, the more I want you by my side."
