10146-1170 = "It is only befitting that achievements be rewarded."
10146-1180 = "Such is the foundation of the military arts."
10146-1190 = "Welcome, Sensei! There's plenty of work to be done!"
10146-1200 = "Perhaps you could lend a hand, Sensei."
10146-1210 = "I understand that I am very attractive."
10146-1220 = "But now is the time to focus on the mission and rewards."
10146-1230 = "They say appropriate physical contact fosters a sense of closeness..."
10146-1240 = "...But even I have a sense of shame."
10146-1250 = "...Sometimes, I find myself thinking."
10146-1260 = "Perhaps this is all a midsummer night's dream."
10146-1270 = "Well, there's no way!"
10146-1280 = "Kihehe!"
10146-1290 = "The way you handle work is truly incredible, Sensei."
10146-1300 = "The more I learn about you, the more I want you by my side."
