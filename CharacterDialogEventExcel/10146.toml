[translation]
10146-10 = "……いっ。"
10146-20 = "……一体どうなって\nいるんだ！？"
10146-30 = "ま、まったく\n慌ててなどいない。"
10146-40 = "全て計画通りに進んで\nいるのだからな！"
10146-50 = "イロハのやつ……\nあの程度のことで、\n一体いつまで……。"
10146-60 = "あ～！\nマン・オブ・\nパンデモニウムに\nようこそ！ヨーホホ！"
10146-70 = "ああ、先生。\n航海は楽しんでいるか？"
10146-80 = "キキキッ！\n全て予想通りだったな！"
10146-90 = "万事うまく\nいったではないか！"
10146-100 = "せ、先生。\n悪いが触らないで\nもらいたい。"
10146-110 = "ふ、船酔いがひどくて\n……うっ。"
10146-120 = "うう……\nだから海に\n来たくなかったんだ。"
10146-130 = "計画したのは……\nマコト様だが……うっ。"
10146-140 = "だが、魚の映画に夢中の\nイブキの\n喜びようときたら！"
10146-150 = "先生にも見せて\nやりたかった！"
10146-160 = "なぜ何度も触るんだ……？"
10146-170 = "そうか、そういうことか！"
10146-180 = "極限状態に\n身を置くことで、\n本当の気持ちに\n気づいたんだな？"
10146-190 = "しかし待ってくれ……\nまだ、心の準備が\nできていない。"
10146-200 = "イロハのやつ……\nまさかSNSを\nしているとはな。"
10146-210 = "しかしなぜ、\n万魔殿のアカウントを\nフォローしていないのだ？"
10146-1170 = "正しき行いには報酬を。"
10146-1180 = "それが上に立つ者として\n当然の考えだ。"
10146-1190 = "よくぞ来てくれたな、先生！\nやるべきことは多いぞ！"
10146-1200 = "一つずつ手伝ってくれ！"
10146-1210 = "マコト様が魅力的であることは、\nよーく分かっている。"
10146-1220 = "しかし、\n今は任務に集中する時だ。"
10146-1230 = "適度なスキンシップは\n大切だが――"
10146-1240 = "――私にだって、\n羞恥心はあるのだぞ。"
10146-1250 = "……不意に、\n脳裏を過ぎる考えがある。"
10146-1260 = "全て夏の夜の夢なのでは\nないか、と。"
10146-1270 = "まあ、\nそんなことはないのだがな！"
10146-1280 = "キキキッ！"
10146-1290 = "実に素晴らしい仕事ぶりだ。"
10146-1300 = "先生のことを知れば知るほど、\nそばに置いておきたくなるな。"
