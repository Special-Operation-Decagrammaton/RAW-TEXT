[translation]
10146-860-10-1 = "這……"
10146-860-20-1 = "……這到底是\n怎麼回事！？"
10146-860-30-1 = "我，我一點也不慌。"
10146-860-40-1 = "因為一切都正在\n按照計畫進行啊！"
10146-860-50-1 = "伊呂波那傢伙……\n為了那點小事，\n到底要鬧到什麼時候……"
10146-860-60-1 = "啊～！歡迎登上\n萬魔殿之人號！\n喲呵呵！"
10146-860-70-1 = "啊啊，老師。\n航海還愉快嗎？"
10146-860-80-1 = "嘻嘻嘻！\n一切都在預料之中！"
10146-860-90-1 = "這不是萬事\n都很順利嗎！"
10146-860-100-1 = "老，老師。\n抱歉，希望你別碰我。"
10146-860-110-1 = "我，我暈船暈得\n很嚴重……唔。"
10146-860-120-1 = "嗚嗚……所以\n我才不想來海邊啊。"
10146-860-130-1 = "雖然計畫的……\n是我真琴大人……唔。"
10146-860-140-1 = "不過，伊吹迷上\n那部魚的電影之後\n高興的模樣！"
10146-860-150-1 = "真想讓老師也看看啊！"
10146-860-160-1 = "為什麼要一直碰我啊……？"
10146-860-170-1 = "原來如此，\n是這麼回事啊！"
10146-860-180-1 = "因為身處極限狀態，\n才終於察覺到了\n真正的心意吧？"
10146-860-190-1 = "不過先等一下……\n我還沒做好心理準備。"
10146-860-200-1 = "伊呂波那傢伙……\n沒想到竟然有在\n玩社群網站。"
10146-860-210-1 = "可是為什麼，\n他沒有追蹤\n萬魔殿的帳號呢？"
10146-860-1170-1 = "正確的行為就該有報酬。"
10146-860-1180-1 = "這是身為上位者\n理所當然的思維。"
10146-860-1190-1 = "你來得正好，老師！\n要做的事可多著呢！"
10146-860-1200-1 = "一件一件幫我處理吧！"
10146-860-1210-1 = "真琴大人魅力十足這件事，\n我非～常清楚。"
10146-860-1220-1 = "不過，現在是\n專注於任務的時候。"
10146-860-1230-1 = "適度的肢體接觸\n固然重要──"
10146-860-1240-1 = "──但我也是\n有羞恥心的啊。"
10146-860-1250-1 = "……有時，腦海裡\n會突然閃過一個念頭。"
10146-860-1260-1 = "這一切該不會\n都只是夏夜之夢吧。"
10146-860-1270-1 = "算了，怎麼可能\n會有那種事嘛！"
10146-860-1280-1 = "嘻嘻嘻！"
10146-860-1290-1 = "真是相當出色的工作表現。"
10146-860-1300-1 = "越是了解老師，\n就越想把你留在身邊呢。"
