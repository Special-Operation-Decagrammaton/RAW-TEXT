[translation]
10146-10 = "……도."
10146-20 = "……도대체\n어떻게 된 일이냐?!"
10146-30 = "저, 전혀\n당황하지 않았다."
10146-40 = "전부 이 몸의 계획대로\n되고 있으니까, 음!"
10146-50 = "이로하 녀석……\n고작 그까짓 일로,\n도대체 언제까지……."
10146-60 = "앓~!\n맨 오브 판데모니움에\n승선한 것을 환영한다!\n요호호호!"
10146-70 = "아아, 선생,\n여행은 즐기고 있나?"
10146-80 = "키히힛!\n역시 이 몸의\n예상이 맞았군!"
10146-90 = "결국,\n다 잘되지 않았느냐!"
10146-100 = "서, 선생.\n미안하지만 건드리지\n말아줬으면 한다."
10146-110 = "배, 뱃멀미\n때문에 속이……."
10146-120 = "쯧, 이래서 바다는\n별로 오고 싶지 않았거늘."
10146-130 = "아니, 물론, 여행 계획을\n세운 건 이 몸이기는\n하지만……."
10146-140 = "아아! 그치만! 이부키가\n그 물고기 만화를 보고\n얼마나 좋아했는지……"
10146-150 = "선생도 봤으면!"
10146-160 = "아까부터 왜 자꾸\n이 몸을……?"
10146-170 = "앗! 혹시 그것인가!"
10146-180 = "극한 상황에 이르러,\n마침내 자신의 본심을\n깨달은 건가?!"
10146-190 = "자, 잠깐, 아직 이 몸은\n마음의 준비가!"
10146-200 = "이로하 녀석……\n설마 SNS를 하고\n있을 줄은."
10146-210 = "그런데 왜 이 몸의\n만마전 계정에는 팔로우\n되어 있지 않은 거지?"
10146-1170 = "성과에는 보상이 주어져야\n하는 법이지."
10146-1180 = "용병술의 기초라는 것이다."
10146-1190 = "잘 왔다, 선생!\n여기는 해야할 일이 잔뜩이지!"
10146-1200 = "어쩌면 선생이\n좀 거들어 줄 수 있겠군."
10146-1210 = "이 몸이 매력적이라는 건\n충분히 이해한다."
10146-1220 = "하지만, 지금은 임무와 보상에\n집중할 때다."
10146-1230 = "적절한 스킨십은 친애감을\n늘려준다고는 하지만……."
10146-1240 = "……이 몸도 부끄러움을\n아는 사람이다."
10146-1250 = "……가끔씩,\n이 몸은 생각한다."
10146-1260 = "이 모든 것이\n한여름 밤의 꿈은 아닐지."
10146-1270 = "뭐, 그럴 리 없지만!"
10146-1280 = "키시싯!"
10146-1290 = "선생의 일 처리는\n정말로 훌륭하다."
10146-1300 = "알면 알수록 곁에 두고\n싶어지는 사람이로군."
