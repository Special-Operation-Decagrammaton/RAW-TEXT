[translation]
10146-10 = "...How."
10146-20 = "...How could this happen?!"
10146-30 = "I-I was not flustered at all."
10146-40 = "Everything's going according to my plan, hmm!"
10146-50 = "Iroha... Just how long is she going to drag this out?"
10146-60 = "Yarrgh! Welcome aboard the Man o' Pandemonium! Yohohoho!"
10146-70 = "Ah, Sensei, are you enjoying the trip?"
10146-80 = "Kihehe! Just as I expected!"
10146-90 = "Everything worked out in the end!"
10146-100 = "S-Sensei. Sorry, but please leave me alone."
10146-110 = "Th-The seasickness is making me feel..."
10146-120 = "Tch, this is why I didn't want to sail the seas."
10146-130 = "Sure, yes, I'm the one who planned this trip, but..."
10146-140 = "Ah! But Ibuki was so happy when she saw that fish cartoon..."
10146-150 = "You should've seen it too!"
10146-160 = "Why do you keep poking me...?"
10146-170 = "Ah! Could it be?!"
10146-180 = "Have you finally realized your true feelings after being pushed to the limit?!"
10146-190 = "W-Wait! I am not mentally ready yet!"
10146-200 = "Iroha... I can't believe she's on social media."
