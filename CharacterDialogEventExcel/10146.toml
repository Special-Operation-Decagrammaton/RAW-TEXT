[translation]
10146-860-10-1 = "……いっ。"
10146-860-20-1 = "……一体どうなって\nいるんだ！？"
10146-860-30-1 = "ま、まったく\n慌ててなどいない。"
10146-860-40-1 = "全て計画通りに進んで\nいるのだからな！"
10146-860-50-1 = "イロハのやつ……\nあの程度のことで、\n一体いつまで……。"
10146-860-60-1 = "あ～！\nマン・オブ・\nパンデモニウムに\nようこそ！ヨーホホ！"
10146-860-70-1 = "ああ、先生。\n航海は楽しんでいるか？"
10146-860-80-1 = "キキキッ！\n全て予想通りだったな！"
10146-860-90-1 = "万事うまく\nいったではないか！"
10146-860-100-1 = "せ、先生。\n悪いが触らないで\nもらいたい。"
10146-860-110-1 = "ふ、船酔いがひどくて\n……うっ。"
10146-860-120-1 = "うう……\nだから海に\n来たくなかったんだ。"
10146-860-130-1 = "計画したのは……\nマコト様だが……うっ。"
10146-860-140-1 = "だが、魚の映画に夢中の\nイブキの\n喜びようときたら！"
10146-860-150-1 = "先生にも見せて\nやりたかった！"
10146-860-160-1 = "なぜ何度も触るんだ……？"
10146-860-170-1 = "そうか、そういうことか！"
10146-860-180-1 = "極限状態に\n身を置くことで、\n本当の気持ちに\n気づいたんだな？"
10146-860-190-1 = "しかし待ってくれ……\nまだ、心の準備が\nできていない。"
10146-860-200-1 = "イロハのやつ……\nまさかSNSを\nしているとはな。"
10146-860-210-1 = "しかしなぜ、\n万魔殿のアカウントを\nフォローしていないのだ？"
10146-860-1170-1 = "正しき行いには報酬を。"
10146-860-1180-1 = "それが上に立つ者として\n当然の考えだ。"
10146-860-1190-1 = "よくぞ来てくれたな、先生！\nやるべきことは多いぞ！"
10146-860-1200-1 = "一つずつ手伝ってくれ！"
10146-860-1210-1 = "マコト様が魅力的であることは、\nよーく分かっている。"
10146-860-1220-1 = "しかし、\n今は任務に集中する時だ。"
10146-860-1230-1 = "適度なスキンシップは\n大切だが――"
10146-860-1240-1 = "――私にだって、\n羞恥心はあるのだぞ。"
10146-860-1250-1 = "……不意に、\n脳裏を過ぎる考えがある。"
10146-860-1260-1 = "全て夏の夜の夢なのでは\nないか、と。"
10146-860-1270-1 = "まあ、\nそんなことはないのだがな！"
10146-860-1280-1 = "キキキッ！"
10146-860-1290-1 = "実に素晴らしい仕事ぶりだ。"
10146-860-1300-1 = "先生のことを知れば知るほど、\nそばに置いておきたくなるな。"
