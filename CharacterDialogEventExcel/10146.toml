[translation]
10146-860-10-1 = "……도."
10146-860-20-1 = "……도대체\n어떻게 된 일이냐?!"
10146-860-30-1 = "저, 전혀\n당황하지 않았다."
10146-860-40-1 = "전부 이 몸의 계획대로\n되고 있으니까, 음!"
10146-860-50-1 = "이로하 녀석……\n고작 그까짓 일로,\n도대체 언제까지……."
10146-860-60-1 = "앓~!\n맨 오브 판데모니움에\n승선한 것을 환영한다!\n요호호호!"
10146-860-70-1 = "아아, 선생,\n여행은 즐기고 있나?"
10146-860-80-1 = "키히힛!\n역시 이 몸의\n예상이 맞았군!"
10146-860-90-1 = "결국,\n다 잘되지 않았느냐!"
10146-860-100-1 = "서, 선생.\n미안하지만 건드리지\n말아줬으면 한다."
10146-860-110-1 = "배, 뱃멀미\n때문에 속이……."
10146-860-120-1 = "쯧, 이래서 바다는\n별로 오고 싶지 않았거늘."
10146-860-130-1 = "아니, 물론, 여행 계획을\n세운 건 이 몸이기는\n하지만……."
10146-860-140-1 = "아아! 그치만! 이부키가\n그 물고기 만화를 보고\n얼마나 좋아했는지……"
10146-860-150-1 = "선생도 봤으면!"
10146-860-160-1 = "아까부터 왜 자꾸\n이 몸을……?"
10146-860-170-1 = "앗! 혹시 그것인가!"
10146-860-180-1 = "극한 상황에 이르러,\n마침내 자신의 본심을\n깨달은 건가?!"
10146-860-190-1 = "자, 잠깐, 아직 이 몸은\n마음의 준비가!"
10146-860-200-1 = "이로하 녀석……\n설마 SNS를 하고\n있을 줄은."
10146-860-210-1 = "그런데 왜 이 몸의\n만마전 계정에는 팔로우\n되어 있지 않은 거지?"
10146-860-1170-1 = "성과에는 보상이 주어져야\n하는 법이지."
10146-860-1180-1 = "용병술의 기초라는 것이다."
10146-860-1190-1 = "잘 왔다, 선생!\n여기는 해야할 일이 잔뜩이지!"
10146-860-1200-1 = "어쩌면 선생이\n좀 거들어 줄 수 있겠군."
10146-860-1210-1 = "이 몸이 매력적이라는 건\n충분히 이해한다."
10146-860-1220-1 = "하지만, 지금은 임무와 보상에\n집중할 때다."
10146-860-1230-1 = "적절한 스킨십은 친애감을\n늘려준다고는 하지만……."
10146-860-1240-1 = "……이 몸도 부끄러움을\n아는 사람이다."
10146-860-1250-1 = "……가끔씩,\n이 몸은 생각한다."
10146-860-1260-1 = "이 모든 것이\n한여름 밤의 꿈은 아닐지."
10146-860-1270-1 = "뭐, 그럴 리 없지만!"
10146-860-1280-1 = "키시싯!"
10146-860-1290-1 = "선생의 일 처리는\n정말로 훌륭하다."
10146-860-1300-1 = "알면 알수록 곁에 두고\n싶어지는 사람이로군."
