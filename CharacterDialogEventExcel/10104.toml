[translation]
10104-840-10-1 = "เชิญค่ะคุณครู ใกล้จะเปิด\nเทศกาลเงาจันทร์แล้วค่ะ"
10104-840-20-1 = "ขอบคุณที่มานะคะ"
10104-840-30-1 = "ขอให้สนุกกับเทศกาลเงาจันทร์\nที่ซานไห่จิงภูมิใจนะคะ"
10104-840-40-1 = "ถึงจะเป็นสถานการณ์ที่คาดไม่ถึง..."
10104-840-50-1 = "แต่สำหรับมังกรดำ ย่านการค้าฯ\nและซานไห่จิงแล้ว..."
10104-840-60-1 = "การมีอยู่ของคุณครู\nเป็นแรงใจให้พวกเรามากๆ ค่ะ"
10104-840-70-1 = "เทศกาลเงาจันทร์เปิดได้\nอย่างราบรื่นเลยนะคะ"
10104-840-80-1 = "ส่วนเรื่องวุ่นวายนั่น เอาเป็นว่า\nอย่าเพิ่งใส่ใจเลยค่ะ..."
10104-840-90-1 = "งานเทศกาลเป็นอย่างไรบ้างคะ?"
10104-840-100-1 = "ซานไห่จิงกับย่านการค้าเทพเต่าดำ\nรอให้คุณครูมาเยือน\nทุกเมื่อเลยนะคะ"
10104-840-110-1 = "เทศกาลเงาจันทร์คืองานที่\nจะได้โชว์ฝีมือของ\nย่านการค้าเทพเต่าดำค่ะ"
10104-840-120-1 = "คุณครูพักผ่อนเถอะค่ะ"
10104-840-130-1 = "ถ้าแกล้งกัน ฉันจะตอบกลับ\nด้วยภาษากายนะคะ"
10104-840-140-1 = "ฉันล้อเล่นค่ะ คุณครู\nจะแกล้งฉันเท่าไรก็ได้ค่ะ"
10104-840-150-1 = "แต่ถ้าทำเยอะเกินไป\nฉันจะลำบากนะคะ\nเอาแต่พอดีเถอะค่ะ"
10104-840-160-1 = "มีเรื่องอะไรเหรอคะคุณครู?"
10104-840-170-1 = "คะ...?\nแค่ลองเรียกดู\nงั้นเหรอคะ...?"
10104-840-180-1 = "ถ้าเรียกร้องความสนใจ\nหลายๆ ครั้งแบบนี้\nระวังต่อไปไม่มีใครเชื่อนะคะ"
10104-840-190-1 = "แม้ว่าฉันจะเชื่อใจ\nคุณครูอยู่เสมอก็เถอะค่ะ..."
10104-840-200-1 = "ฉะ... ฉันไม่ค่อย\nบ้าจี้น่ะค่ะ"
10104-840-210-1 = "จะ... จริงนะคะ\nทำไปก็ไม่มีประโยชน์หรอกค่ะ\nเพราะงั้น หยุดนะ...!"
10104-840-220-1 = "อะฮ่าฮ่าฮ่าฮ่า!"
10104-840-230-1 = "หยุดเถอะค่ะ... ฉันขอละ"
10104-840-450-1 = "ฉันดูแลร้านได้ดีเลยค่ะ"
10104-840-460-1 = "ถ้างั้น... วันนี้\nอยากได้อะไรเหรอคะ?"
10104-840-470-1 = "เพียงแค่มาบอกกัน\nย่านการค้าเทพเต่าดำก็จะไปให้ค่ะ"
10104-840-480-1 = "สักวันหนึ่ง... แม้จะต้องไปถึง\nสุดขอบคิโวทอสก็ตาม!"
10104-840-490-1 = "ไม่ได้ลืมของอะไรใช่มั้ยคะ?"
10104-840-500-1 = "ค่อยๆ ดูของให้หมด\nจะได้ไม่เสียดายทีหลังนะคะ"
10104-840-510-1 = "ของลึกลับของย่านการค้าเทพเต่าดำ?\nเมนูที่ซ่อนอยู่...?"
10104-840-520-1 = "อืม... ของแบบนั้นไม่มีหรอกค่ะ..."
10104-840-530-1 = "ถึงจะทำสีหน้าแบบนั้นก็เถอะค่ะ..."
10104-840-540-1 = "ถ้าขาดเหลืออะไร\nก็บอกฉันได้ตลอดนะคะ!"
10104-840-550-1 = "แต่ของที่หมดแล้ว\nฉันก็ช่วยไม่ได้นะคะ..."
10104-840-560-1 = "ค่ะ นี่คือของที่ฉันแนะนำค่ะ"
10104-840-570-1 = "หาของไปใช้เองที่บ้าน\nหรือเอาไปเป็นของขวัญคะ?"
10104-840-580-1 = "ขอบคุณทุกครั้งเลยนะคะ!"
10104-840-590-1 = "ฉันพูดคำนี้อยู่บ่อยๆ แต่พอได้\nพูดกับคุณครู ก็แปลกใหม่ดีนะคะ"
10104-840-600-1 = "ท่านประธานก็พูดอย่างนี้บ่อยๆ ค่ะ"
10104-840-610-1 = "บอกว่าถ้าได้อะไรมาฟรีๆ\nคนนั้นก็คือของขวัญน่ะค่ะ"
10104-840-620-1 = "แต่ถ้าคุณครูเป็นของขวัญละก็..."
10104-840-630-1 = "ปะ... เปล่าค่ะ ไม่มีอะไรหรอกค่ะ"
