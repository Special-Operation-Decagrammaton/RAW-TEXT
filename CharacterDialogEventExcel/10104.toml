[translation]
10104-900840-10-1 = "ようこそ、先生。\nまもなく、月影祭が\n開催されます。"
10104-900840-20-1 = "来てくださって\nありがとうございます。"
10104-900840-30-1 = "山海経が誇る月影祭を\nご堪能ください。"
10104-900840-40-1 = "月影祭こそ、\n玄武商会の\n腕の見せ所です。"
10104-900840-50-1 = "先生はゆっくり\nなさってください。"
10104-900840-60-1 = "…イタズラには、\n肉体言語で\nお返ししますよ。"
10104-900840-70-1 = "冗談です、先生。\nイタズラでしたら、\nいくらでも。"
10104-900840-80-1 = "…あまり頻繁だと\n困りますので。\nほどほどに。"
10104-900840-90-1 = "なんでしょうか、先生？"
10104-900840-100-1 = "…え？\n呼んでみただけ…？"
10104-900840-110-1 = "…何度も気を\n引き続けたら、そのうち、\n誰にも信じてもらえなく\nなりますよ？"
10104-900840-120-1 = "…私はいつまでも、\n先生を信じますが。"
10104-900840-130-1 = "わ、私は、くすぐっても\n効かない体質ですので。"
10104-900840-140-1 = "ほ、本当です。\nやっても無駄ですから、\nだから、やめ…！"
10104-900840-150-1 = "あ、ははははは！"
10104-900840-160-1 = "…もう、やめて\nくださいってば。"
