[translation]
10104-840-10-1 = "ようこそ、先生。\nまもなく、月影祭が\n開催されます。"
10104-840-20-1 = "来てくださって\nありがとうございます。"
10104-840-30-1 = "山海経が誇る月影祭を\nご堪能ください。"
10104-840-40-1 = "予想外の状況ですが…"
10104-840-50-1 = "玄龍門、玄武商会、\nそして山海経にとって…"
10104-840-60-1 = "先生の存在はとても\n励みになります。"
10104-840-70-1 = "無事、月影祭を開催する\nことができました。"
10104-840-80-1 = "…あの騒動は、一旦、\n気にしないで\nおきましょう。"
10104-840-90-1 = "お祭りは\nいかがでしたか？"
10104-840-100-1 = "山海経と玄武商会は、\nいつでも先生のお越しを\nお待ちしております。"
10104-840-110-1 = "月影祭こそ、\n玄武商会の\n腕の見せ所です。"
10104-840-120-1 = "先生はゆっくり\nなさってください。"
10104-840-130-1 = "…イタズラには、\n肉体言語で\nお返ししますよ。"
10104-840-140-1 = "冗談です、先生。\nイタズラでしたら、\nいくらでも。"
10104-840-150-1 = "…あまり頻繁だと\n困りますので。\nほどほどに。"
10104-840-160-1 = "なんでしょうか、先生？"
10104-840-170-1 = "…え？\n呼んでみただけ…？"
10104-840-180-1 = "…何度も気を\n引き続けたら、そのうち、\n誰にも信じてもらえなく\nなりますよ？"
10104-840-190-1 = "…私はいつまでも、\n先生を信じますが。"
10104-840-200-1 = "わ、私は、くすぐっても\n効かない体質ですので。"
10104-840-210-1 = "ほ、本当です。\nやっても無駄ですから、\nだから、やめ…！"
10104-840-220-1 = "あ、ははははは！"
10104-840-230-1 = "…もう、やめて\nくださいってば。"
10104-840-450-1 = "店番は得意な方です。"
10104-840-460-1 = "さて…今日は何を\nお探しですか？"
10104-840-470-1 = "お声掛けいただければ\nどこでも、玄武商会は参ります。"
10104-840-480-1 = "…いつかは、キヴォトスの\n果てまでも！"
10104-840-490-1 = "買い逃しはありませんか？"
10104-840-500-1 = "後悔のないよう、どうぞ最後まで\nゆっくりとご覧ください。"
10104-840-510-1 = "玄武商会の秘蔵品？\n隠しメニュー…？"
10104-840-520-1 = "えっと…\nそんなものはないのですが…"
10104-840-530-1 = "そんな顔をされましても…"
10104-840-540-1 = "足りないものがありましたら、\nおっしゃってください。"
10104-840-550-1 = "…売り切れてしまったものは\nどうしようもないのですが。"
10104-840-560-1 = "はい、私の\nオススメの品ですね。"
10104-840-570-1 = "こちら、ご自宅用ですか？\nプレゼント用ですか？"
10104-840-580-1 = "毎度ありがとうございます！"
10104-840-590-1 = "…いつも口にしている言葉なのに\n先生相手だとなんだか新鮮ですね。"
10104-840-600-1 = "会長はおっしゃっていました。"
10104-840-610-1 = "何かが無償で与えられたのなら、\n それはすなわち、自身が商品に\nなっていることを意味すると。"
10104-840-620-1 = "ですがもし先生が\n商品なのでしたら…"
10104-840-630-1 = "あ、いえ、\nなんでもありません。"
