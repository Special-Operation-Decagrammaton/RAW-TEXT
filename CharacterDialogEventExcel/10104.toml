[translation]
10104-840-10-1 = "Welcome, Sensei. The Moonlight Festival will start soon."
10104-840-20-1 = "Thank you for coming."
10104-840-30-1 = "Enjoy Shanhaijing's Moonlight Festival."
10104-840-40-1 = "We didn't expect this situation, but..."
10104-840-50-1 = "For the Genryumon, Black Tortoise Promenade, and Shanhaijing..."
10104-840-60-1 = "...your presence is very encouraging, Sensei."
10104-840-70-1 = "The Moonlight Festival was a success."
10104-840-80-1 = "...Let's just ignore the disturbance for now."
10104-840-90-1 = "How was the festival?"
10104-840-100-1 = "Shanhaijing and the Black Tortoise Promenade are always waiting for you to visit, Sensei."
10104-840-110-1 = "The Moonlight Festival is the perfect time to show off the skills of the Black Tortoise Promenade."
10104-840-120-1 = "You should rest, Sensei."
10104-840-130-1 = "...I'll respond to pranks physically."
10104-840-140-1 = "I'm kidding, Sensei. Pranks are fine."
10104-840-150-1 = "It would only be a problem if it was too frequent, so please control yourself."
10104-840-160-1 = "What's going on, Sensei?"
10104-840-170-1 = "...What? You just wanted to chat?"
10104-840-180-1 = "...If you keep joking around like that, eventually no one's going to believe you."
10104-840-190-1 = "But I'll always believe you, Sensei."
10104-840-200-1 = "I-I'm not really ticklish."
10104-840-210-1 = "R-Really. There's no point in trying. So stop...!"
10104-840-220-1 = "Ahahaha!"
10104-840-230-1 = "...Please stop."
10104-840-450-1 = "Protecting the store is important."
10104-840-460-1 = "So...what are you looking for today?"
10104-840-470-1 = "If you ask us, the Black Tortoise Promenade will go anywhere."
10104-840-480-1 = "...To the ends of Kivotos, someday!"
10104-840-490-1 = "Did you forget anything?"
10104-840-500-1 = "I don't want you to regret anything, so please look around carefully."
10104-840-510-1 = "The Black Tortoise Promenade's secret item? A hidden menu...?"
10104-840-520-1 = "Um... There's no such thing..."
10104-840-530-1 = "Not even if you give me that look..."
10104-840-540-1 = "If anything's missing, please feel free to let me know."
10104-840-550-1 = "...But there's nothing we can do about sold out items."
10104-840-560-1 = "Yes, that's an item I recommend."
10104-840-570-1 = "Will you be using it at home, or giving it to someone?"
10104-840-580-1 = "Thank you so much!"
10104-840-590-1 = "People say that all the time, but saying it to you, Sensei...it sounds new."
10104-840-600-1 = "There's something the president used to say."
10104-840-610-1 = "If something's given to you for free, you've become the product."
10104-840-620-1 = "But if you're the product, Sensei..."
10104-840-630-1 = "N-Never mind. It's nothing."
