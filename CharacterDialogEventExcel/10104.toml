[translation]
10104-840-10-1 = "歡迎您，老師。\n不久後，\n月影祭即將舉行。"
10104-840-20-1 = "感謝您的光臨。"
10104-840-30-1 = "山海經自豪的月影祭，\n還請您盡情享受。"
10104-840-40-1 = "雖然是意料之外\n的情況……"
10104-840-50-1 = "對玄龍門、玄武商會，\n以及山海經來說……"
10104-840-60-1 = "老師的存在\n是非常大的鼓勵。"
10104-840-70-1 = "我們順利\n舉辦了月影祭。"
10104-840-80-1 = "……那場騷動，\n就暫且不去理會吧。"
10104-840-90-1 = "您覺得祭典如何呢？"
10104-840-100-1 = "山海經和玄武商會，\n隨時等候著老師的光臨。"
10104-840-110-1 = "月影祭正是玄武商會\n展示實力的時候。"
10104-840-120-1 = "請老師慢慢享受。"
10104-840-130-1 = "……面對惡作劇，\n我會用肢體語言回應哦。"
10104-840-140-1 = "開玩笑的，老師。\n惡作劇的話，請您自便。"
10104-840-150-1 = "……但太頻繁的話\n會讓我有點困擾。\n還請適可而止。"
10104-840-160-1 = "有什麼事嗎，老師？"
10104-840-170-1 = "……咦？\n只是叫叫看而已……？"
10104-840-180-1 = "……一直這樣引起\n注意的話，遲早會\n沒人相信您的哦？"
10104-840-190-1 = "……雖然我會一直\n相信老師就是了。"
10104-840-200-1 = "我，我是被搔癢也\n不受影響的體質。"
10104-840-210-1 = "是，是真的。\n就算試也沒用的，\n所以，請您……！"
10104-840-220-1 = "啊，啊哈哈哈哈！"
10104-840-230-1 = "……真是的，\n就說請您住手了。"
10104-840-450-1 = "我算是擅長看店的人。"
10104-840-460-1 = "那麼……\n您今天要找什麼呢？"
10104-840-470-1 = "只要您開口，無論何處，\n玄武商會都會趕到。"
10104-840-480-1 = "……有朝一日，就算是\n奇普托斯的盡頭也一樣！"
10104-840-490-1 = "有沒有漏買什麼？"
10104-840-500-1 = "為了避免留下遺憾，\n還請慢慢欣賞到最後。"
10104-840-510-1 = "玄武商會的珍藏品？\n隱藏菜單……？"
10104-840-520-1 = "呃……\n沒有那種東西……"
10104-840-530-1 = "就算您露出那種表情也……"
10104-840-540-1 = "如果有缺少的東西，\n還請跟我說一聲。"
10104-840-550-1 = "……但如果是已經\n賣完的商品就沒辦法了。"
10104-840-560-1 = "來，是我推薦的商品。"
10104-840-570-1 = "這是要自用的嗎？\n還是送禮用的呢？"
10104-840-580-1 = "感謝您的惠顧！"
10104-840-590-1 = "……明明是經常說的話，\n對老師說總覺得很新鮮呢。"
10104-840-600-1 = "會長曾經說過──"
10104-840-610-1 = "如果無償獲得了某些東西，\n那麼那同時也代表自己\n成為了商品的意思。"
10104-840-620-1 = "不過如果老師\n是商品的話……"
10104-840-630-1 = "啊，不，沒什麼。"
