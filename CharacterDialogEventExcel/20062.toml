[translation]
20062-180 = "외부인?! \n와, 진짜로……?!"
20062-190 = "오세요, 오세요!\n대환영이에요!"
20062-200 = "혹시 최신자\n신문 있으세요?"
20062-210 = "한달내로 나온거면\n좋아요!!"
20062-220 = "안녕안녕 선생님~ \n오늘도 춥죠~"
20062-230 = "감기 안걸리게 조심……."
20062-240 = "푸헤읏취이!!"
20062-250 = "아! 창문 꼭 닫아주세요!\n바람도 들어오고…… "
20062-260 = "곰도 들어오니까요!"
20062-270 = "후에에에엥!!!\n선생님 덕분이에요~!!"
20062-280 = "우우…… 우우우웃……!"
20062-290 = "……우아악!! "
20062-300 = "재채기, 들어갔잖아!!"
20062-310 = "히익! 깜짝이야……!"
20062-320 = "또 순록이 들어온 줄 알았어요!"
20062-330 = "응? 혹시 배고프세요?"
20062-340 = "그러면 뭐라도 만들어 드릴게요!\n저, 식사 담당이거든요!"
20062-350 = "츄, 츄워효……."
20062-360 = "두피도 얼어버린 것 같하아……."
20062-500 = "쇼핑!!\n제 전문 분야에요!!"
20062-510 = "뭐부터 사볼까나-♪"
20062-520 = "우웃……. \n쇼핑은 당분간\n서비스 종료다아……."
20062-530 = "선생님도 이거 살거에요?\n사버리죠 사버리죠!"
20062-540 = "뭘 살지를 모르겠다면,\n 하나씩 다 사보는거에요!"
20062-550 = "오와앙-! 선생님 멋져요!\n어른의 재력 최고!"
20062-560 = "어흠, 어흠! \n아아- 이게 있으면\n행복하겠, 네에-"
20062-570 = "누가 떠-억- 하고\n사주지 않으려나아-"
20062-580 = "혹시나 해서인데요…….\n외출증이나, 그런건 없어요?"
20062-590 = "그러니까 총 합이…….\n하나, 둘……."
20062-600 = "에이, 모르겠다!"
20062-690 = "숙제 따위 할까보냐-!"
20062-700 = "숙제 하기싫어 하기싫어\n하기싫어어-!!"
20062-710 = "찔러도 숙제는 안 끝난다구요?"
20062-720 = "왜요?\n앗, 설마 미루고 나중에 하기?! \n좋아요!!"
20062-730 = "숙제는 싫지만 보상은 좋아요!\n우헤헤-♪"
20062-740 = "오~ 좋네요~!"
20062-750 = "최신 신문지로 포장해주면\n더 좋았을텐데!"
