[translation]
20062-862-180-1 = "외부인?! \n와, 진짜로……?!"
20062-862-190-1 = "오세요, 오세요!\n대환영이에요!"
20062-862-200-1 = "혹시 최신자\n신문 있으세요?"
20062-862-210-1 = "한 달 내로 나온 거면\n좋아요!!"
20062-862-220-1 = "안녕안녕 선생님~ \n오늘도 춥죠~"
20062-862-230-1 = "감기 안 걸리게 조심……."
20062-862-240-1 = "푸헤읏취이!!"
20062-862-250-1 = "아! 창문 꼭 닫아주세요!\n바람도 들어오고…… "
20062-862-260-1 = "곰도 들어오니까요!"
20062-862-270-1 = "후에에에엥!!!\n선생님 덕분이에요~!!"
20062-862-280-1 = "우우…… 우우우웃……!"
20062-862-290-1 = "……우아악!! "
20062-862-300-1 = "재채기, 들어갔잖아!!"
20062-862-310-1 = "히익! 깜짝이야……!"
20062-862-320-1 = "또 순록이 들어온 줄 알았어요!"
20062-862-330-1 = "응? 혹시 배고프세요?"
20062-862-340-1 = "그러면 뭐라도 만들어 드릴게요!\n저, 식사 담당이거든요!"
20062-862-350-1 = "츄, 츄워효……."
20062-862-360-1 = "두피도 얼어버린 것 같하아……."
20062-862-500-1 = "쇼핑!!\n제 전문 분야예요!!"
20062-862-510-1 = "뭐부터 사볼까나-♪"
20062-862-520-1 = "우웃……. \n쇼핑은 당분간\n서비스 종료다아……."
20062-862-530-1 = "선생님도 이거 살 거에요?\n사버리죠 사버리죠!"
20062-862-540-1 = "뭘 살지를 모르겠다면,\n 하나씩 다 사보는 거에요!"
20062-862-550-1 = "오와앙-! 선생님 멋져요!\n어른의 재력 최고!"
20062-862-560-1 = "어흠, 어흠! \n아아- 이게 있으면\n행복하겠, 네에-"
20062-862-570-1 = "누가 떠-억- 하고\n사주지 않으려나아-"
20062-862-580-1 = "혹시나 해서인데요…….\n외출증이나, 그런 건 없어요?"
20062-862-590-1 = "그러니까 총합이…….\n하나, 둘……."
20062-862-600-1 = "에이, 모르겠다!"
20062-862-690-1 = "숙제 따위 할까 보냐-!"
20062-862-700-1 = "숙제 하기 싫어 하기 싫어\n하기 싫어어-!!"
20062-862-710-1 = "찔러도 숙제는 안 끝난다구요?"
20062-862-720-1 = "왜요?\n앗, 설마 미루고 나중에 하기?! \n좋아요!!"
20062-862-730-1 = "숙제는 싫지만 보상은 좋아요!\n우헤헤-♪"
20062-862-740-1 = "오~ 좋네요~!"
20062-862-750-1 = "최신 신문지로 포장해주면\n더 좋았을 텐데!"
