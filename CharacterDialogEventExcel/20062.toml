[translation]
20062-862-190-1 = "歡迎、歡迎！\n熱烈歡迎！"
20062-862-330-1 = "嗯？難道您肚子餓了嗎？"
20062-862-500-1 = "購物！！\n正是我的專業領域！！"
20062-862-510-1 = "先買什麼好呢～♪"
20062-862-520-1 = "嗚嗚……\n購物暫時\n停止服務啦……。"
20062-862-530-1 = "老師也要買這個嗎？\n買吧買吧！"
20062-862-540-1 = "不知道要買什麼的話，\n就每樣都買一個吧！"
20062-862-550-1 = "哇啊～！老師好帥！\n大人的財力最棒了！"
20062-862-560-1 = "咳、咳！\n啊～要是有這個的話\n我就會很幸福，是的～"
20062-862-570-1 = "不會有人大～方～地\n買給我嗎～"
20062-862-580-1 = "我只是以防萬一問一下……。\n沒有外出證之類的嗎？"
20062-862-590-1 = "所以總和是……。\n一、二……。"
20062-862-600-1 = "唉，不管了！"
20062-862-690-1 = "我才不要做什麼作業咧！"
20062-862-700-1 = "不想寫作業、不想寫作業\n不想寫啦——！！"
20062-862-710-1 = "就算戳我，作業也不會完成喔？"
20062-862-720-1 = "為什麼？\n啊，難道要拖到之後再做？！\n好啊！！"
