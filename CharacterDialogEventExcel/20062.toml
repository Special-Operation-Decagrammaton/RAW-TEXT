[translation]
20062-180 = "外の人！？\nえっ、本当に……！？"
20062-200 = "最近の新聞\n持ってたりします？"
20062-220 = "どもども先生～！\n今日も寒いですよね～"
20062-240 = "ぶえっくしょんっ！！"
20062-250 = "あ！窓はちゃんと\n閉めてくださいね！\n風入ってくるし……"
20062-260 = "最悪熊が来るんで！"
20062-270 = "ふええええん！！！\n先生のおかげです～～！！"
20062-280 = "うぅ……\nうううぅぅっ……！"
20062-290 = "……んあ～～っ！"
20062-300 = "くしゃみ\n引っ込んじゃったぁ！！"
20062-310 = "ヒィッ！\nビックリしたぁ……！"
20062-320 = "またトナカイかと\n思ったぁ！"
20062-340 = "んじゃなんか作りますね！\n私、食事担当なんで！"
20062-350 = "さ、さぶい……"
20062-360 = "頭皮まで、\n凍っちゃうよぉ……。"
20062-730 = "宿題は嫌だけどご\n褒美は好きです！\nうっへへっ♪"
20062-740 = "お～いいですね～！"
20062-1060 = "うう……こんなところにも\n宿題が……。"
20062-1070 = "終わらせないと\nダメですかぁ……？"
20062-1080 = "ひえっ！？\n服に何かついてました？"
20062-1090 = "勝手に触っちゃだめですよ！？\n腐食性の物質だったら\nどうするんですか！"
20062-1100 = "早く終わらせて\n遊びに行きましょーよ！\nは～や～く～！"
20062-1110 = "ん～っ！\nやっぱりご褒美ってあま～いっ！"
20062-1120 = "やっほーい！\nこれですよね！"
