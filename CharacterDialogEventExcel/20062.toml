[translation]
20062-862-180-1 = "外の人！？\nえっ、本当に……！？"
20062-862-200-1 = "最近の新聞\n持ってたりします？"
20062-862-220-1 = "どもども先生～！\n今日も寒いですよね～"
20062-862-240-1 = "ぶえっくしょんっ！！"
20062-862-250-1 = "あ！窓はちゃんと\n閉めてくださいね！\n風入ってくるし……"
20062-862-260-1 = "最悪熊が来るんで！"
20062-862-270-1 = "ふええええん！！！\n先生のおかげです～～！！"
20062-862-280-1 = "うぅ……\nうううぅぅっ……！"
20062-862-290-1 = "……んあ～～っ！"
20062-862-300-1 = "くしゃみ\n引っ込んじゃったぁ！！"
20062-862-310-1 = "ヒィッ！\nビックリしたぁ……！"
20062-862-320-1 = "またトナカイかと\n思ったぁ！"
20062-862-340-1 = "んじゃなんか作りますね！\n私、食事担当なんで！"
20062-862-350-1 = "さ、さぶい……"
20062-862-360-1 = "頭皮まで、\n凍っちゃうよぉ……。"
20062-862-730-1 = "宿題は嫌だけどご\n褒美は好きです！\nうっへへっ♪"
20062-862-740-1 = "お～いいですね～！"
20062-864-1060-1 = "うう……こんなところにも\n宿題が……。"
20062-864-1070-1 = "終わらせないと\nダメですかぁ……？"
20062-864-1080-1 = "ひえっ！？\n服に何かついてました？"
20062-864-1090-1 = "勝手に触っちゃだめですよ！？\n腐食性の物質だったら\nどうするんですか！"
20062-864-1100-1 = "早く終わらせて\n遊びに行きましょーよ！\nは～や～く～！"
20062-864-1110-1 = "ん～っ！\nやっぱりご褒美ってあま～いっ！"
20062-864-1120-1 = "やっほーい！\nこれですよね！"
