[translation]
20062-180 = "外の人！？\nえっ、本当に……！？"
20062-190 = "どーぞどーぞ！\n大歓迎です！"
20062-200 = "最近の新聞\n持ってたりします？"
20062-210 = "一ヶ月以内だとめっちゃ\n嬉しいです！"
20062-220 = "どもども先生～！\n今日も寒いですよね～"
20062-230 = "風邪引かないように……"
20062-240 = "ぶえっくしょんっ！！"
20062-250 = "あ！窓はちゃんと\n閉めてくださいね！\n風入ってくるし……"
20062-260 = "最悪熊が来るんで！"
20062-270 = "ふええええん！！！\n先生のおかげです～～！！"
20062-280 = "うぅ……\nうううぅぅっ……！"
20062-290 = "……んあ～～っ！"
20062-300 = "くしゃみ\n引っ込んじゃったぁ！！"
20062-310 = "ヒィッ！\nビックリしたぁ……！"
20062-320 = "またトナカイかと\n思ったぁ！"
20062-330 = "ん？お腹空いたんです？"
20062-340 = "んじゃなんか作りますね！\n私、食事担当なんで！"
20062-350 = "さ、さぶい……"
20062-360 = "頭皮まで、\n凍っちゃうよぉ……。"
20062-500 = "ショッピング！！\n私の得意分野です！！"
20062-510 = "なに買おっかな～♪"
20062-520 = "うぅ……\nショッピングはしばらく\nお休みでーす。"
20062-530 = "先生もこれ狙ってました？\n買いましょ買いましょ！"
20062-540 = "どれを買うか悩んだときは、\nとりあえず全部\n買ってみるんですよ！"
20062-550 = "おわあ～！先生カッコイイ！\nオトナの財力！最高！"
20062-560 = "ゴホンゴホン！\nアーアー！\nコレガアッタラ幸セ、ダナ～"
20062-570 = "誰カガばーっと買ってくれたり、\nシナイカナー"
20062-580 = "ちなみになんですけど……\n外出許可証とか、\n持ってたりします？　　"
20062-590 = "合計……いち、\nに……えっと……。"
20062-600 = "まあ、いい感じで！"
20062-690 = "宿題なんてやるもんかー！"
20062-700 = "宿題やだやだやだやだやだ～～！"
20062-710 = "つっついても宿題は\n終わりませんよぉ？"
20062-720 = "なんですか？えっ？\nもしかして\n後回しにするんです？やったー！"
20062-730 = "宿題は嫌だけどご\n褒美は好きです！\nうっへへっ♪"
20062-740 = "お～いいですね～！"
20062-750 = "新聞が最新だったら\n最高だったんですけど！　"
