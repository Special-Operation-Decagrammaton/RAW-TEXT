[translation]
20062-190 = "歡迎、歡迎！\n熱烈歡迎！"
20062-330 = "嗯？難道您肚子餓了嗎？"
20062-500 = "購物！！\n正是我的專業領域！！"
20062-510 = "先買什麼好呢～♪"
20062-520 = "嗚嗚……\n購物暫時\n停止服務啦……。"
20062-530 = "老師也要買這個嗎？\n買吧買吧！"
20062-540 = "不知道要買什麼的話，\n就每樣都買一個吧！"
20062-550 = "哇啊～！老師好帥！\n大人的財力最棒了！"
20062-560 = "咳、咳！\n啊～要是有這個的話\n我就會很幸福，是的～"
20062-570 = "不會有人大～方～地\n買給我嗎～"
20062-580 = "我只是以防萬一問一下……。\n沒有外出證之類的嗎？"
20062-590 = "所以總和是……。\n一、二……。"
20062-600 = "唉，不管了！"
20062-690 = "我才不要做什麼作業咧！"
20062-700 = "不想寫作業、不想寫作業\n不想寫啦——！！"
20062-710 = "就算戳我，作業也不會完成喔？"
20062-720 = "為什麼？\n啊，難道要拖到之後再做？！\n好啊！！"
