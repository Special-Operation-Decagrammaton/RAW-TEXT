[translation]
20062-190 = "เชิญเลยค่ะ เชิญเข้ามาเลย!\nยินดีต้อนรับสุดๆ เลยค่ะ!"
20062-330 = "หืม? หิวอยู่เหรอคะ?"
20062-500 = "ช้อปปิ้ง!!\nงานถนัดของฉันเลยค่ะ!!"
20062-510 = "ซื้ออะไรก่อนดีนะ~♪"
20062-520 = "อึก...\nช่วงนี้ขอปิดบริการ\nให้ซื้อของก่อนนะ..."
20062-530 = "คุณครูจะซื้ออันนี้ด้วยเหรอคะ?\nซื้อเลยค่ะ ซื้อไปเลยสิคะ!"
20062-540 = "ถ้าไม่รู้ว่าจะซื้ออะไร\nก็ซื้อไปอย่างละชิ้นเลยค่ะ!"
20062-550 = "ว้าว~! คุณครูเท่มากเลยค่ะ!\nพลังเงินของผู้ใหญ่นี่\nยอดเยี่ยมที่สุด!"
20062-560 = "อะแฮ่ม อะแฮ่ม!\nอ่า~ ถ้ามีเจ้านี่ละก็\nคงมีความสุข..."
20062-570 = "ไม่มีใครใจป้ำ\nซื้อให้บ้างเลยเหรอ~"
20062-580 = "แค่พูดเผื่อๆ ไว้ก่อนนะคะ...\nไม่มีใบอนุญาต\nออกนอกสถานที่\nหรืออะไรแบบนั้นบ้างเหรอคะ?"
20062-590 = "ถ้าอย่างนั้น รวมทั้งหมดก็...\nหนึ่ง สอง..."
20062-600 = "เฮ้อ ไม่รู้ด้วยแล้ว!"
20062-690 = "ใครจะมีเวลาไปทำการบ้านกันล่ะ!"
20062-700 = "ไม่อยากทำการบ้าน ไม่อยากทำ\nไม่อยากทำการบ้าน~!!"
20062-710 = "ถึงจะมาสะกิดกัน\nการบ้านก็ไม่เสร็จหรอกนะคะ?"
20062-720 = "ทำไมล่ะคะ?\nอ๊ะ หรือว่าจะผลัดไปทำทีหลัง?!\nดีเลยค่ะ!!"
