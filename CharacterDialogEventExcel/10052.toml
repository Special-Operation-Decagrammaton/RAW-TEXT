[translation]
10052-817-200-1 = "Hmm. According to my schedule, we should be preparing for the Kivotos Halo Festival now."
10052-817-210-1 = "We'd better hurry. We don't want to miss the opening ceremony!"
10052-817-220-1 = "(Hmm... Next on the agenda is...)"
10052-817-230-1 = "It’s not long until the Halo Festival begins."
10052-817-240-1 = "Let's do our best until the very end."
10052-817-250-1 = "Thank you for your hard work, Sensei. Everyone has really given it their all..."
10052-817-260-1 = "I'm sure this year's Kivotos Halo Festival will be amazing."
10052-817-270-1 = "All eyes will be on us during the festival..."
10052-817-280-1 = "...so we need to do our best to showcase the true value of Millennium!"
10052-817-290-1 = "I'm not that athletic..."
10052-817-300-1 = "But at the end of the day, this is another one of Seminar's duties."
10052-817-310-1 = "(...I suppose not everyone is that excited for the festival...)"
10052-817-320-1 = "I am absolutely, 100% certain that, without fail, Yuuka is going to nag my ears off."
10052-817-330-1 = "Heh heh... I'm already picturing Yuuka's flustered face."
10052-817-560-1 = "Here, this is a list of tasks that must be completed in preparation for the Kivotos Halo Festival."
10052-817-570-1 = "Just in time, Sensei, for me to ask you for help."
10052-817-580-1 = "Oh? Why can't I do it?"
10052-817-590-1 = "Haha. Oh, Sensei. I'm busy already, of course. I could do it later, but..."
10052-817-600-1 = "I learned a lot. Well, you are a teacher."
10052-817-610-1 = "You're very reliable. I'm surprised."
