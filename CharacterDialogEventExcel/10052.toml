[translation]
10052-817-200-1 = "那麼，\n開始準備\n「晄輪大祭」吧。"
10052-817-210-1 = "為了不耽誤開幕式，\n加油吧！"
10052-817-220-1 = "（嗯…接下來\n要準備的東西是…）"
10052-817-230-1 = "距離「晄輪大祭」開始\n只剩下一點時間了。"
10052-817-240-1 = "請努力到最後。"
10052-817-250-1 = "辛苦了，老師。\n大家都同心協力\n準備好了。"
10052-817-260-1 = "這次的「晄輪大祭」\n一定也會相當歡樂。"
10052-817-270-1 = "因為是奇普托斯中\n相當引人注目的慶典，"
10052-817-280-1 = "為了呈現出\n千年的真正價值，\n我會全力以赴的！"
10052-817-290-1 = "我不擅長運動…"
10052-817-300-1 = "但這也是\n研討會的工作。"
10052-817-310-1 = "（…並不是所有人，\n都期待著慶典的到來…）"
10052-817-320-1 = "等優香醬醒來後，\n一定會嘮叨個沒完吧？"
10052-817-330-1 = "呵呵…\n還真是期待，\n優香醬慌張的樣子。"
10052-817-560-1 = "這是準備「晄輪大祭」\n所需的工作列表。"
10052-817-570-1 = "啊，來得正好。\n有工作想拜託老師…"
10052-817-580-1 = "咦？怎麼了？"
10052-817-590-1 = "呵呵，不行唷。\n現在正忙著呢…\n以後會再好好陪你的。"
10052-817-600-1 = "真不愧是老師。\n我學到一課了。"
10052-817-610-1 = "做得真好啊。\n令人佩服。"
10052-10817-200-1 = "那麼，\n讓我們開始準備\n「晄輪大祭」吧。"
10052-10817-210-1 = "為了不耽誤開幕式，\n加油吧！"
