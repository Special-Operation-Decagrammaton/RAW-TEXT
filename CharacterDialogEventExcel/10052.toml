[translation]
10052-817-200-1 = "それでは、一緒に\n「晄輪大祭」の\n準備をはじめましょう。"
10052-817-210-1 = "開会式に遅れないよう、\n頑張りましょうね！"
10052-817-220-1 = "（えっと… このあとに\n用意するものは…）"
10052-817-230-1 = "「晄輪大祭」開催まで\nあとわずかですね。"
10052-817-240-1 = "最後まで\n頑張ってください。"
10052-817-250-1 = "お疲れ様でした先生。\n皆で一致団結して\n準備しましたから、"
10052-817-260-1 = "今回の「晄輪大祭」も\n楽しいこと\n間違いなしです。"
10052-817-270-1 = "キヴォトス中の\n注目が集まる\nお祭りですから、"
10052-817-280-1 = "ミレニアムの真価を\n示せるよう、\n最善を尽くします！"
10052-817-290-1 = "運動は得意では\nありませんが…"
10052-817-300-1 = "これも一応、\nセミナーの\n仕事ですから。"
10052-817-310-1 = "（…皆がお祭りを楽しみに\nしているわけでは、\nないのですね…）"
10052-817-320-1 = "ユウカちゃんが\n目覚めたら、きっと\n小言の嵐でしょうね。"
10052-817-330-1 = "ふふ…ユウカちゃんの\n慌てる姿、\n今から楽しみです。"
10052-817-560-1 = "こちら、「晄輪大祭」の\n準備に必要な\n業務一覧になります。"
10052-817-570-1 = "あ、丁度良いところに！\n先生にお願いしたいお仕事が\nありまして…。"
10052-817-580-1 = "あれ？どうされました？"
10052-817-590-1 = "ふふ、ダメですよ。\n今は忙しいので…\nあとでちゃんと構ってあげます。"
10052-817-600-1 = "さすがです、先生。\n勉強になりました。"
10052-817-610-1 = "いい仕事っぷりですね。\n感心しました。"
