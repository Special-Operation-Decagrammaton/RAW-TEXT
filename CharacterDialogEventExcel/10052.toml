[translation]
10052-817-200-1 = "เอาละ ถ้างั้นก็\nมาเริ่มเตรียมงาน\n<ฮาโลเฟสติวัล> กันค่ะ"
10052-817-210-1 = "ต้องรีบเตรียมตัวนะคะ\nจะได้ไม่สายในพิธีเปิดงานค่ะ!"
10052-817-220-1 = "(อืม... ของชิ้นต่อไป\nที่ต้องเตรียมคืออะไรนะ...)"
10052-817-230-1 = "ใกล้ถึงวันเปิดงาน\n<ฮาโลเฟสติวัล> แล้วค่ะ"
10052-817-240-1 = "มาพยายามให้ถึงที่สุดกันนะคะ"
10052-817-250-1 = "ทำได้ดีมากเลยค่ะ คุณครู\nทุกคนช่วยกันออกแรง\nเตรียมงานนี้ขึ้นมา"
10052-817-260-1 = "<ฮาโลเฟสติวัล> ครั้งนี้ก็\nต้องสนุกเหมือนทุกครั้งแน่ค่ะ"
10052-817-270-1 = "นี่คืองานเทศกาลที่\nทั้งคิโวทอสให้ความสนใจ"
10052-817-280-1 = "ฉันจะพยายามให้เต็มที่\nเพื่อแสดงคุณค่าของ\nมิลเลเนียมออกมาค่ะ"
10052-817-290-1 = "ถึงฉันจะไม่ถนัด\nเรื่องพละกำลัง..."
10052-817-300-1 = "แต่นี่ก็เป็น\nงานของเซมิน่านี่คะ"
10052-817-310-1 = "(...ไม่ใช่ทุกคนสินะคะ\nที่กำลังตั้งตารอ\nงานเทศกาลนี้...)"
10052-817-320-1 = "ถ้ายูกะจังตื่นขึ้นมา\nก็คงจะบ่นนู่นนี่\nเยอะเลยใช่มั้ยคะ?"
10052-817-330-1 = "ฮุฮุ... อยากเห็นแล้วละค่ะ\nว่าสีหน้าตอนตกใจ\nของยูกะจะเป็นยังไง"
10052-817-560-1 = "นี่คือรายการสิ่งที่จำเป็น\nในการเตรียมฮาโลเฟสติวัลค่ะ"
10052-817-570-1 = "มาได้จังหวะเลยค่ะ\nฉันมีเรื่องอยากขอร้อง\nคุณครูอยู่พอดีเลยค่ะ"
10052-817-580-1 = "คะ? มีเรื่องอะไรเหรอคะ?"
10052-817-590-1 = "ฮุฮุ ไม่ได้นะคะ ตอนนี้ฉันกำลังยุ่ง...\nเดี๋ยวจะมาดูแลทีหลังนะคะ"
10052-817-600-1 = "สมกับเป็นคุณครูเลยนะคะ\nฉันได้เรียนรู้เยอะเลยค่ะ"
10052-817-610-1 = "จัดการได้เยี่ยมยอดเลยนะคะ\nประทับใจมากเลยค่ะ"
10052-10817-200-1 = "เอาละ ถ้างั้นก็\nมาเริ่มเตรียมงาน\n<ฮาโลเฟสติวัล> กันค่ะ"
