[translation]
26014-843-510-1 = "Ah, hello, Sensei."
26014-843-520-1 = "...It feels awkward to greet you differently from usual."
26014-843-530-1 = "Maybe I should go with cuter greetings..."
26014-843-540-1 = "I-I was just talking to myself!"
26014-843-550-1 = "It's quite a hectic event..."
26014-843-560-1 = "Just a bit more, and it'll be over. Let's do our best, Sensei."
26014-843-570-1 = "To think it's already over..."
