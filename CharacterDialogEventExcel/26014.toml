[translation]
26014-843-510-1 = "辛，辛苦了，老師。"
26014-843-520-1 = "……實在說不習慣呢。"
26014-843-530-1 = "應該用更可愛的\n打招呼方式……"
26014-843-540-1 = "……剛，剛才那只是\n我在自言自語而已！"
26014-843-550-1 = "真的是……\n讓人無法放鬆。"
26014-843-560-1 = "就剩一點了，老師。\n一起加油吧。"
26014-843-570-1 = "已經結束了啊。"
26014-843-580-1 = "結束之後反而……\n有種意猶未盡的感覺。"
26014-843-590-1 = "怎，怎麼了？\n有委託嗎？"
26014-843-600-1 = "這，這是千年\n指定的制服啊……？"
26014-843-610-1 = "有哪裡怪怪的嗎？"
26014-843-620-1 = "那個……老師。"
26014-843-630-1 = "難得穿上制服，\n不如……"
26014-843-640-1 = "跟我一起……"
26014-843-650-1 = "……果，果然\n還是算了。\n別放在心上。"
