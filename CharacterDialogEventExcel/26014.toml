[translation]
26014-843-510-1 = "お、お疲れ、先生。"
26014-843-520-1 = "……言い慣れないな。"
26014-843-530-1 = "もう少し\n可愛い挨拶を……"
26014-843-540-1 = "……い、今のは\n独り言だ！"
26014-843-550-1 = "まったく……\n気が休まらない。"
26014-843-560-1 = "あと少しだ、先生。\n一緒に頑張ろう。"
26014-843-570-1 = "終わったんだな。"
26014-843-580-1 = "終わってみると逆に……\n名残惜しく感じる。"
26014-843-590-1 = "ど、どうしたんだ？\n依頼か？"
26014-843-600-1 = "こ、これは\nミレニアム指定の\n制服だけど……？"
26014-843-610-1 = "何か変な\nところでもあるのか？"
26014-843-620-1 = "えっと……先生。"
26014-843-630-1 = "せっかくの制服だ、\nからその、"
26014-843-640-1 = "私と一緒に……"
26014-843-650-1 = "……や、やはり、\n何でもない。\n気にしないでくれ。"
