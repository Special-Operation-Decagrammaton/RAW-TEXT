26014-843-590-1 = "H-Huh? Wh-What's wrong? Is there anything you need me to do?"
26014-843-600-1 = "Th-This is just Millennium's designated, simple school uniform..."
26014-843-610-1 = "Is there anything weird about it?"
26014-843-620-1 = "Um... Sensei?"
26014-843-630-1 = "Since we're here..."
26014-843-640-1 = "...would you like to..."
26014-843-650-1 = "...N-Never mind. It's nothing. Sorry."
