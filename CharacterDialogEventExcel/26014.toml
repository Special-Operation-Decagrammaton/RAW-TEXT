[translation]
26014-843-510-1 = "อ้อ สวัสดี คุณครู"
26014-843-520-1 = "ปกติฉันไม่ได้ทักแบบนี้\nก็เลยไม่ค่อยคุ้นน่ะ..."
26014-843-530-1 = "ต้องทักทาย\nให้น่ารักขึ้น..."
26014-843-540-1 = "มะ... เมื่อกี้\nฉันพูดคนเดียวน่ะ!"
26014-843-550-1 = "เป็นงานที่หัวหมุน\nมากกว่าที่คิดอีกนะ..."
26014-843-560-1 = "ทำต่ออีกนิด\nก็เสร็จแล้วละ\nสู้เค้านะคุณครู"
26014-843-570-1 = "งานจบแล้วเหรอเนี่ย"
26014-843-580-1 = "รู้สึก... เสียดาย\nแปลกๆ นะ"
26014-843-590-1 = "หะ... หืม?\nทะ... ทำไมเหรอ?\nมีอะไรจะสั่งให้ทำเหรอ?"
26014-843-600-1 = "นะ... นี่คือ\nชุดนักเรียนธรรมดา\nของมิลเลเนียมไง...?"
26014-843-610-1 = "หรือมีส่วนไหน\nที่แปลกงั้นเหรอ?"
26014-843-620-1 = "เอ่อ... คุณครู"
26014-843-630-1 = "ไหนๆ ฉันก็ใส่ชุดนี้แล้ว"
26014-843-640-1 = "เราไป..."
26014-843-650-1 = "มะ... ไม่ดีกว่า...\nไม่มีอะไรทั้งนั้น\nขอโทษนะ"
