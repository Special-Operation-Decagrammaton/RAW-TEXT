[translation]
10044-814-150-1 = "私たちのリゾートに\nようこそ～、"
10044-814-160-1 = "なんて☆"
10044-814-170-1 = "夏、海、紛れもない\nリゾート地ですよ～！"
10044-814-180-1 = "そろそろ身体も\n温まってきましたね～？"
10044-814-190-1 = "まだまだ元気よく\n行きましょう～！"
10044-814-200-1 = "満足満足です～、"
10044-814-210-1 = "先生も楽しめましたか？"
10044-814-220-1 = "はーい☆先生、\n私のこと呼びました？"
10044-814-230-1 = "少し暑いですね～。\n先生は体調、\n大丈夫ですか？"
10044-814-240-1 = "ふふっ、何だか\n楽しくなってきました。"
10044-814-250-1 = "こうして汗をかくのも、\nたまには良いですね☆"
10044-814-350-1 = "じゃーん！\nいらっしゃいませ～☆"
10044-814-360-1 = "…なんて。ふふっ、\nはしゃぎすぎで\nしょうか？"
10044-814-370-1 = "ふふっ…\n何が出るでしょう～？"
10044-814-380-1 = "整理整頓の\nお時間ですよ～☆"
10044-814-390-1 = "躊躇ってると、\n私が代わりに\n引いちゃいますよ～？"
10044-814-400-1 = "あははっ！先生、\nくすぐったいですよ～"
10044-814-410-1 = "おお～！\nさすがは先生です☆"
10044-814-420-1 = "わ、すごいです！先生、\nもう一回引いてみてください！"
10044-814-430-1 = "これは多分、すごいもの…！\nですかね？"
