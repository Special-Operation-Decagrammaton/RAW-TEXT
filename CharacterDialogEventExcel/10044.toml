[translation]
10044-814-150-1 = "저희의 리조트에\n오신 것을\n환영합니다~"
10044-814-160-1 = "에헷☆"
10044-814-170-1 = "여름, 바다,\n틀림없는 휴양지예요~!"
10044-814-180-1 = "슬슬 몸도\n따뜻해졌네요~?"
10044-814-190-1 = "아직은 더 힘을\n내보자구요~!"
10044-814-200-1 = "만족 만족이에요~"
10044-814-210-1 = "선생님도 즐기셨나요?"
10044-814-220-1 = "네~☆ 선생님,\n저 부르셨나요?"
10044-814-230-1 = "조금 덥네요.\n선생님은 괜찮으세요?"
10044-814-240-1 = "후훗, 왠지\n즐거워졌어요."
10044-814-250-1 = "이렇게 땀을\n흘리는 것도\n가끔은 좋네요☆"
10044-814-350-1 = "쨔안! 어서 오세요~☆"
10044-814-360-1 = "…랄까나.\n후훗, 조금 들떠\n보였을까요?"
10044-814-370-1 = "후훗… 뭐가 나올까요~?"
10044-814-380-1 = "정리정돈의\n시간이에요~☆"
10044-814-390-1 = "자꾸 그러시면\n제가 직접\n뽑을 거예요?"
10044-814-400-1 = "아하하! 선생님,\n간지러워요~"
10044-814-410-1 = "오오~!\n역시, 선생님이에요☆"
10044-814-420-1 = "와, 대단해요! 선생님,\n한 번 더 뽑아볼까요?"
10044-814-430-1 = "이건 어쩌면, 굉장한 것……!\n일지도요?"
