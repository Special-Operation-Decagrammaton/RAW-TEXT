[translation]
10044-814-150-1 = "ขอต้อนรับสู่รีสอร์ต\nของพวกเราค่ะ~ "
10044-814-160-1 = "ฮิฮิ☆"
10044-814-170-1 = "ฤดูร้อน ทะเล\nที่นี่เป็นสถานที่พักผ่อน\nไม่ผิดแน่นอนค่ะ~!"
10044-814-180-1 = "จู่ๆ ร่างกาย..\nก็รู้สึกร้อนๆ ขึ้นเหมือนกันนะคะ~?"
10044-814-190-1 = "มาพยายามให้เต็มที่\nจนหยดสุดท้ายกันเถอะค่ะ~!"
10044-814-200-1 = "น่าพอใจมากๆ เลยค่า~"
10044-814-210-1 = "คุณครูก็สนุกเหมือนกันใช่มั้ยคะ?"
10044-814-220-1 = "ค่าา~☆\nคุณครูเรียกฉันเหรอคะ?"
10044-814-230-1 = "ร้อนจังเลยนะคะ\nคุณครูเป็นอะไรรึเปล่าคะ?"
10044-814-240-1 = "ฮิฮิ ไม่รู้ทำไม\nถึงได้รู้สึกสนุกมากเลยค่ะ"
10044-814-250-1 = "บางครั้ง...\nการได้เหงื่อออกเยอะๆ\nแบบนี้ก็ดีเหมือนกันนะคะ☆"
10044-814-350-1 = "แต่นแต๊น! เชิญเลยค่า~☆"
10044-814-360-1 = "แบบนี้... รึเปล่านะ\nฮิฮิ รู้สึก...\nตื่นเต้นรึเปล่าคะ?"
10044-814-370-1 = "ฮิฮิ... จะได้อะไรกันน้า~?"
10044-814-380-1 = "ได้เวลาจัดระเบียบแล้วค่ะ☆"
10044-814-390-1 = "ถ้าทำแบบนั้นบ่อยๆ\nฉันจะหยิบให้\nเองเลยนะคะ"
10044-814-400-1 = "อะฮ่ะฮ่ะ คุณครู\nมันจักจี้นะคะ~"
10044-814-410-1 = "โอ้~! สมกับเป็น\nคุณครูจริงๆ เลยค่ะ☆"
10044-814-420-1 = "ว้าว สุดยอดเลยค่ะ! คุณครู\nลองหยิบเพิ่มอีกมั้ยคะ?"
10044-814-430-1 = "อาจได้ของดีๆ ก็ได้นะคะ...?"
