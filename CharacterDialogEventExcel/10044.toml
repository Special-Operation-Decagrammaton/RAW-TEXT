[translation]
10044-814-150-1 = "歡迎來到我們的\n渡假勝地～"
10044-814-160-1 = "開玩笑的☆"
10044-814-170-1 = "夏天、大海\n貨真價實的渡假勝地唷～！"
10044-814-180-1 = "身體也差不多\n變得暖和了呢～？"
10044-814-190-1 = "繼續精神飽滿地\n加油吧～！"
10044-814-200-1 = "滿足滿足～"
10044-814-210-1 = "老師也玩得開心嗎？"
10044-814-220-1 = "是～☆老師，\n你有叫我嗎？"
10044-814-230-1 = "有點熱呢～。\n老師身體，\n還好嗎？"
10044-814-240-1 = "唔呵呵，總覺得\n變得開心起來了。"
10044-814-250-1 = "像這樣流汗，\n偶爾也不錯呢☆"
10044-814-350-1 = "鏘～！\n歡迎光臨～☆"
10044-814-360-1 = "……開玩笑的。唔呵呵，\n太興奮了嗎？"
10044-814-370-1 = "唔呵呵……\n會跑出什麼呢～？"
10044-814-380-1 = "整理整頓的\n時間到囉～☆"
10044-814-390-1 = "要是猶豫的話，\n我就要代替\n老師抽了唷～？"
10044-814-400-1 = "啊哈哈！老師，\n好癢哦～"
10044-814-410-1 = "哦哦～！\n真不愧是老師☆"
10044-814-420-1 = "哇，好厲害！老師，\n請再抽一次看看！"
10044-814-430-1 = "這大概是，\n很厲害的東西……！\n應該是吧？"
