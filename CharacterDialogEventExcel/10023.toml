[translation]
10023-804-140-1 = "มาแล้วเหรอ คุณครู\nเตรียมของจำเป็นสำหรับ\nค่ายฤดูร้อนพร้อมแล้วละ"
10023-804-150-1 = "ถ้าเทียบกับงานของหัวหน้าแล้ว\nแค่นี้ไม่ใช่เรื่องใหญ่หรอก"
10023-804-160-1 = "อืม...\nของชิ้นนี้ก็ใช้ได้เลยนะ"
10023-804-170-1 = "ไม่เลวเลยนี่คุณครู"
10023-804-180-1 = "เอากล่องเสบียงตราเกเฮนน่า\nมาแลกที่นี่ได้นะ"
10023-804-190-1 = "เวลาเข้าค่ายก็ผ่านมาครึ่งทางแล้ว\nถ้ามีของที่จำเป็นละก็\nรีบมาเลือกไปด้วยล่ะ"
10023-804-200-1 = "เวลาเข้าค่ายเหลือน้อยแล้ว\nถ้ามีของที่จำเป็นละก็\nรีบมาเลือกไปด้วยล่ะ"
10023-804-210-1 = "วันนี้เป็นวันสุดท้ายแล้วเหรอ\nเป็นวันหยุดที่สนุกจริงๆ..."
10023-804-220-1 = "ไม่สิ ค่ายฝึกฤดูร้อนต่างหาก"
10023-804-230-1 = "การฝึกฤดูร้อนจบแล้ว อย่าลืม\nตรวจดูว่าลืมอะไรไว้หรือเปล่าล่ะ"
10023-804-240-1 = "ทำไมถึงเอาแต่\nยืนจ้องแบบนั้นล่ะ?"
10023-804-250-1 = "ฉันไม่แจกฟรีหรอกนะ"
10023-804-260-1 = "เห... มีของแบบนี้อยู่ด้วยเหรอ\nคุณครูโชคดีจังเลยน้า"
10023-10804-140-1 = "มาแล้วเหรอ คุณครู\nเตรียมของจำเป็นสำหรับ\nค่ายฤดูร้อนพร้อมแล้วล่ะ"
10023-10804-150-1 = "ถ้าเทียบกับงานของหัวหน้าแล้ว\nแค่นี้ไม่ใช่เรื่องใหญ่หรอก"
10023-10804-160-1 = "อืม...\nของชิ้นนี้ก็ใช้ได้เลยนะ"
