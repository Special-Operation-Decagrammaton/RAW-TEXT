[translation]
10023-804-140-1 = "呀，老師。\n夏季合宿需要的東西，\n幾乎都準備好了唷。"
10023-804-150-1 = "和陽奈委員長的忙碌程度相比，\n這點程度的事不算什麼。"
10023-804-160-1 = "嗯，\n不錯嘛？"
10023-804-170-1 = "嘿，氣度不錯嘛。老師。"
10023-804-180-1 = "如果撿到有格黑娜校徽的\n箱子的話，就拿過來吧。\n可以交換各種東西唷。"
10023-804-190-1 = "合宿時間只剩下一半。需要什麼東西的話，\n加緊腳步比較好。"
10023-804-200-1 = "合宿時間所剩不多了。\n需要什麼的話\n早點告訴我。"
10023-804-210-1 = "今天就是最後一天啊。\n真是讓人暈頭轉向的休……"
10023-804-220-1 = "不，是合宿。"
10023-804-230-1 = "來，夏天已經結束了唷。\n確認一下有沒有剩下什麼東西吧。"
10023-804-240-1 = "……為什麼\n一直盯著這裡看？"
10023-804-250-1 = "可不能免費給你啊。"
10023-804-260-1 = "嘿……\n還有這種東西啊。\n老師的運氣很好呢。"
10023-10804-140-1 = "你來了啊，老師。\n夏季合宿需要的東西，\n全部都準備好了。"
10023-10804-150-1 = "相較於委員長的工作，\n這點程度的事不算什麼。"
10023-10804-160-1 = "嗯，\n是不錯的東西耶。"
10023-10804-170-1 = "以老師來說算不賴了。"
10023-10804-180-1 = "若是撿到印有格黑娜校徽的\n補給箱，\n在這個地方可交換。"
10023-10804-190-1 = "合宿時間現在剩一半而已耶。若是有需要的物品，\n就要事先通知。"
10023-10804-200-1 = "夏季合宿期間剩下不多了，\n如果有需要的物品，\n要快點告訴我。"
10023-10804-210-1 = "今天是最後一天嗎？\n真是多災多難的休假…"
10023-10804-220-1 = "不，是夏季合宿。"
10023-10804-230-1 = "夏季訓練全都結束了。\n確認一下是否有剩餘的物品。"
10023-10804-240-1 = "……為什麼在這裡不動，\n一直盯著看？"
10023-10804-250-1 = "我不能免費送你。"
10023-10804-260-1 = "嘿嘿……\n原來有這種東西啊？\n老師的運氣很好呢！"
