10023-804-140-1 = "You're here, Sensei. We've prepared whatever you might need for summer camp."
10023-804-150-1 = "My schedule is always a lot lighter compared to the president."
10023-804-160-1 = "Hmm. That's not bad."
10023-804-170-1 = "Not bad, Sensei."
