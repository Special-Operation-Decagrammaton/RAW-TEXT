10023-10804-180-1 = "ถ้าเก็บกล่องเสบียง\nตราเกเฮนน่าได้ละก็\nเอามาแลกที่นี่ได้นะ"
10023-10804-190-1 = "เวลาเข้าค่ายก็ผ่านมาครึ่งทางแล้ว\nถ้ามีของที่จำเป็นละก็\nรีบมาเลือกไปด้วยล่ะ"
10023-10804-200-1 = "เวลาเข้าค่ายเหลือน้อยแล้ว\nถ้ามีของที่จำเป็นละก็\nรีบมาเลือกไปด้วยล่ะ"
10023-10804-210-1 = "วันนี้เป็นวันสุดท้ายแล้วเหรอ\nเป็นวันหยุดที่สนุกจริงๆ..."
