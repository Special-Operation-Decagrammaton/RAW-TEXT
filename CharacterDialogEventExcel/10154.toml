[translation]
10154-865-10-1 = "예술 평의회에\n어서 오세요, 선생님."
10154-865-20-1 = "와일드헌트의 진수를,\n부디 마음껏\n만끽해 주시길."
10154-865-30-1 = "해결의 실마리가\n보이기 시작했군요."
10154-865-40-1 = "일곱 죄수……\n정말 귀찮은 존재네요."
10154-865-50-1 = "이것으로\n사건 해결이군요."
10154-865-60-1 = "와일드헌트 학생을\n대표해, 감사드립니다."
10154-865-70-1 = "사감대에 선생님의\n검문검색을 당분간\n완화하라 지시했습니다."
10154-865-80-1 = "……설마 은혜를\n원수로 갚진 않으시겠죠?"
10154-865-90-1 = "평의회장 자리에\n있다 보면,\n재미있는 일이 많답니다."
10154-865-100-1 = "후후, 권력이란\n신기한 것이군요."
10154-865-110-1 = "어머…… 선생님은\n저를 어렵게 대하지\n않으시는군요."
10154-865-120-1 = "후후, 이런 거리감도\n나쁘지 않네요."
10154-865-130-1 = "교감이 목적이라면,\n나중에 상대해 드리죠."
10154-865-140-1 = "공과 사는 중요한 거니까."
10154-865-420-1 = "자, 선생님의 예술을\n알려주세요."
10154-865-430-1 = "선생님의 심미안,\n기대하겠습니다."
10154-865-440-1 = "유의미한 시간이었네요."
10154-865-450-1 = "예술은 영원한 것."
10154-865-460-1 = "다음에도 괜찮다면,\n또 함께하죠."
10154-865-470-1 = "예술이란 항상\n우리의 곁에 있답니다."
10154-865-480-1 = "선생님이\n입고 계신 옷도,\n예술의 산물이죠."
10154-865-490-1 = "옷뿐만 아니라,\n모든 것이 그렇다고\n할 수 있습니다."
10154-865-500-1 = "그러니, 물건을\n소중히 여겨주시길."
10154-865-510-1 = "선생님이 말이 통하는 분이라\n안심했습니다."
10154-865-520-1 = "특히, 예술에 관한 견해가\n일치하는 것은 큰 의미가 있죠."
10154-865-530-1 = "우리 학원에서는\n가장 큰 쟁점이 되니까요."
10154-865-540-1 = "과연…… 그 부분이\n감상 포인트인 거군요."
10154-865-550-1 = "예술이란,\n작은 편린도 놓칠 수 없는 법."
10154-865-560-1 = "멋진 작품이군요.\n잘 보이는 곳에 장식해 두죠."
10154-865-570-1 = "이것이 선생님의 예술…….\n실로 흥미롭습니다."
10154-865-580-1 = "자, 다음에는\n어떤 작품이 기다리고 있을까요."
10154-865-590-1 = "선생님께 부탁드리고 싶은\n내용은 다음과 같습니다.\n확인해 주세요."
10154-865-600-1 = "이쪽이 업무 리스트입니다.\n예술적이죠?"
10154-865-610-1 = "무슨 일이 있으신 걸까요?"
10154-865-620-1 = "지루하게 해드린 모양이네요.\n저에게 장난을 칠 여유가\n있으신 걸 보니."
10154-865-630-1 = "역시, 소문대로의\n해결 능력이군요."
10154-865-640-1 = "후훗, 제 안목은\n틀림이 없었군요."
