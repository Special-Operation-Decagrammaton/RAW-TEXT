[translation]
10094-825-920-1 = "มาแล้ว! เห็นแล้ว!\nแล้วก็ชนะแล้ว... มั้ยนะ?"
10094-825-930-1 = "เอาเป็นว่า!\nเมดไซบะ โมโมอิ\nได้เวลาออกโรงแล้ว!"
10094-825-940-1 = "อ๊ะ คุณครู!\nทำไมไม่เตรียมตัว...!"
10094-825-950-1 = "เอ๋...? เดี๋ยวสิ เดี๋ยวๆ\nรอกันก่อนสิ คุณครู!"
10094-825-960-1 = "แงงง\nงานเยอะจังเลย!"
10094-825-970-1 = "คิดไม่ถึงเลย\nว่าจะเป็นแบบนี้..."
10094-825-980-1 = "ไม่เข้าใจ\nไม่เข้าใจเลย..."
10094-825-990-1 = "โจร? ประมูล? งานศิลปะ?\nนี่มันอะไรกัน!\nพล็อตเกมเหรอ!?"
10094-825-1000-1 = "ถึงจะเกิดเรื่องมากมาย\nแต่เหล่าผู้กล้าก็ปราบคนชั่ว"
10094-825-1010-1 = "และกลับมายัง\nฐานของตัวเอง\nได้อย่างองอาจ...!"
10094-825-1020-1 = "ก็จบประมาณนั้นละ\nหืม? คุณครู\nพยายามได้ดีมากเลย!"
10094-825-1030-1 = "หืม? อยากเห็นฉัน\nตอนทำงานเมดเหรอ...?"
10094-825-1040-1 = "ก็นะ ก็ฉันใส่\nชุดเมดอยู่แล้วนี่! อื้ม!"
10094-825-1050-1 = "ทำไมวิชาเมด\nไม่มีให้โดดงาน\nแล้วนอนกลางวันเลยนะ?"
10094-825-1060-1 = "คุณครูไม่คิดเหรอ\nว่านี่คือปัญหาน่ะ?"
10094-825-1070-1 = "จริงสิ! นี่ คุณครู รู้อะไรหรือเปล่า?\nว่าคฤหาสน์หลังนี้น่ะ..."
10094-825-1080-1 = "ซ่อนความลับสุดยอดเอาไว้\nเลยนะ! ลางสังหรณ์ของฉัน\nบอกมาอย่างนั้นน่ะ!"
10094-825-1090-1 = "จะ... จั๊กจี้นะ! คุณครู!\nฉันเป็นคนบ้าจี้นะ!"
10094-825-1100-1 = "แต่ก็ใช่ว่าจะไม่ชอบหรอก!"
