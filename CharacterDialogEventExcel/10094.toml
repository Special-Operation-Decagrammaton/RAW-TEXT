[translation]
10094-825-920-1 = "来た！見た！\nそして勝った……\nっけ？"
10094-825-930-1 = "とにかく！\nメイドの才羽モモイ、\n出陣だよ！"
10094-825-940-1 = "あ、先生！\n準備ならとっくに……！"
10094-825-950-1 = "あれぇ……？\nちょ、ちょっと\n待っててね、先生！"
10094-825-960-1 = "うえぇん、\n仕事が多すぎるよぉ！"
10094-825-970-1 = "こんな事になるなんて、\n知らなかったのにぃ……"
10094-825-980-1 = "理解できない、\n理解できないよ……"
10094-825-990-1 = "怪盗？オークション？\n美術品？何それ！\nなんかのゲームの設定！？"
10094-825-1000-1 = "多くの事があったが、\n勇者たちは悪を倒し、"
10094-825-1010-1 = "堂々と故郷へと\n帰還したのであった……！"
10094-825-1020-1 = "ま、そんなエンディング\nだったよね。ん？\n先生？お疲れ様！"
10094-825-1030-1 = "ん～？メイドらしい\n働きぶりを見たい……？"
10094-825-1040-1 = "まあ一応、メイド服に\nなっているからね！\nうん！"
10094-825-1050-1 = "メイドの科目には\nどうして、サボって\n昼寝する授業がないの？"
10094-825-1060-1 = "これって、\n問題だと思わない？"
10094-825-1070-1 = "そうだ！ねえ、先生。\n知ってる？\nこのお屋敷には……"
10094-825-1080-1 = "すっごい秘密が\n隠されているんだって！\n私の直感が、\nそう言ってるの！"
10094-825-1090-1 = "く、くすぐったいよ！\n先生！私、くすぐりに\n弱いんだから"
10094-825-1100-1 = "イヤなわけじゃ\nないけどさぁ！？"
