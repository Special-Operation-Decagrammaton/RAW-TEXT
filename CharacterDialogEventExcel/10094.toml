[translation]
10094-825-920-1 = "我來！我見！\n然後我征服……\n嗎？"
10094-825-930-1 = "總之！\n女僕才羽桃井，\n上陣囉！"
10094-825-940-1 = "啊，老師！\n我早就準備好了……！"
10094-825-950-1 = "咦……？\n等，等一下啦，\n老師！"
10094-825-960-1 = "嗚咿，\n工作太多了啦！"
10094-825-970-1 = "沒想到事情會變成這樣……"
10094-825-980-1 = "無法理解，\n完全無法理解……"
10094-825-990-1 = "怪盜？拍賣？\n藝術品？那是什麼啊！\n像是遊戲裡才有的設定！？"
10094-825-1000-1 = "經歷了許多事情，\n勇者們擊敗了邪惡，"
10094-825-1010-1 = "堂堂地回到了故鄉……！"
10094-825-1020-1 = "嘛，結局就是這樣吧。\n嗯？老師？\n辛苦了！"
10094-825-1030-1 = "嗯？\n想看女僕的工作表現……？"
10094-825-1040-1 = "嘛，畢竟我穿著女僕裝嘛！\n嗯！"
10094-825-1050-1 = "女僕的學科裡為什麼\n沒有偷懶午睡的課程呢？"
10094-825-1060-1 = "你不覺得這是個問題嗎？"
10094-825-1070-1 = "對了！吶，老師。\n你知道嗎？\n這座宅邸裡……"
10094-825-1080-1 = "藏著一個大祕密！\n我的直覺是這樣告訴我的！"
10094-825-1090-1 = "好，好癢！\n老師！我怕癢啦。"
10094-825-1100-1 = "但也不是說討厭啦！？"
10094-10825-920-1 = "我來！我見！\n然後我征服……嗎？"
10094-10825-930-1 = "總之！\n女僕才羽桃井，\n上陣囉！"
10094-10825-940-1 = "啊，老師！\n準備的話我早就……！"
10094-10825-950-1 = "咦……？\n先，先等一下哦，老師！"
10094-10825-960-1 = "嗚咿，\n工作太多了啦！"
10094-10825-970-1 = "事情居然會變成這樣，\n我完全不知道……"
10094-10825-980-1 = "無法理解，\n無法理解啦……"
10094-10825-990-1 = "怪盜？拍賣？藝術品？\n那是什麼啊！\n某款遊戲的設定！？"
10094-10825-1000-1 = "儘管經歷了許多事情，\n勇者們仍擊敗了邪惡，"
10094-10825-1010-1 = "威風地回到了故鄉……！"
10094-10825-1020-1 = "嘛，結局就是這樣吧。\n嗯？老師？辛苦了！"
10094-10825-1030-1 = "嗯？想看符合女僕\n身分的工作表現……？"
10094-10825-1040-1 = "也對，畢竟我\n正穿著女僕裝嘛！嗯！"
10094-10825-1050-1 = "女僕的學科裡為什麼\n沒有偷懶午睡的課程呢？"
10094-10825-1060-1 = "不覺得這是個問題嗎？"
10094-10825-1070-1 = "對了！吶，老師。\n你知道嗎？\n這座宅邸裡……"
10094-10825-1080-1 = "隱藏著天大的祕密哦！\n我的直覺是這麼說的！"
10094-10825-1090-1 = "很，很癢耶！老師！\n我很怕癢啦！"
10094-10825-1100-1 = "雖然也不討厭\n就是了！？"
