[translation]
10094-825-920-1 = "왔도다, 보았도다!\n그리고 이겼…… 나?"
10094-825-930-1 = "아무튼!\n메이드 사이바 모모이,\n출격이라구!"
10094-825-940-1 = "아, 선생님!\n준비라면 진작에……!"
10094-825-950-1 = "어라.....?잠깐, 잠깐만\n기다려줘, 선생님!"
10094-825-960-1 = "우에엥,\n일이 너무 많아!"
10094-825-970-1 = "이렇게 될 줄은,\n몰랐는데……"
10094-825-980-1 = "이해할 수 없어,\n이해할 수 없어…"
10094-825-990-1 = "괴도? 경매? 미술품?\n뭐야 그거!\n무슨 게임의 설정!?"
10094-825-1000-1 = "많은 일이 있었지만,\n용사들은 악을 물리치고."
10094-825-1010-1 = "당당히,\n자신들의 보금자리로\n귀환한 것이었다……!"
10094-825-1020-1 = "뭐, 그런 엔딩이었지.\n응? 선생님?\n수고 많았어!"
10094-825-1030-1 = "응? 메이드다운\n일하는 모습을\n보고싶어……?"
10094-825-1040-1 = "뭐, 일단,\n메이드복이니까! 응!"
10094-825-1050-1 = "메이드 과목에는 왜\n땡땡이 치고 낮잠 자는\n수업이 없을까?"
10094-825-1060-1 = "이거, 문제라고\n생각하지 않아?"
10094-825-1070-1 = "맞다! 저기, 선생님. 그거 알아?이 저택에는……"
10094-825-1080-1 = "엄청난 비밀이\n숨겨져 있대!\n내 직감이,\n그렇게 말하고 있어!"
10094-825-1090-1 = "간, 간지러워! 선생님!\n나, 간지럼에 약하다고!"
10094-825-1100-1 = "싫은건 아니지만!"
