[translation]
10069-826-10-1 = "啊啊，老師。\n我在等你唷。\n覺得山海經怎麼樣？"
10069-826-20-1 = "沒有迷路真是太好了。"
10069-826-20-2 = "畢竟山海經的路\n相當複雜啊。"
10069-826-30-1 = "玄龍門的孩子們……\n真是一點也沒變呢。\n不管是優點還是缺點。"
10069-826-40-1 = "不用擔心。\n因為我們……\n「玄武商會」\n是老師的友方。"
10069-826-50-1 = "雖然發生了很多事，\n幸好順利結束了。"
10069-826-50-2 = "這全都多虧了老師。\n有沒有忘了什麼東西？\n有的話我去幫你找。"
10069-826-60-1 = "最近肩膀有點僵硬……\n有沒有人願意\n幫我按摩一下呢。"
10069-826-60-2 = "像是老師之類的……\n（偷瞄）……"
10069-826-70-1 = "啊哈哈，\n就算那樣搔癢我，\n也什麼都不會出現的唷？"
10069-826-70-2 = "雖然研究中的料理\n要多少有多少……"
10069-826-80-1 = "不過會提供給客人的\n永遠只有最棒的料理！"
10069-826-80-2 = "嘛……如果是\n研究中的料理，\n就另當別論了。"
10069-826-90-1 = "在我眼裡的老師，\n是什麼都能成為的存在。"
10069-826-90-2 = "是客人，是夥伴，\n還是……嗯……"
10069-826-90-3 = "抱歉，這個話題\n到此為止。"
10069-826-200-1 = "雖然現在以料理聞名，"
10069-826-200-2 = "不過玄武商會的本質，\n依舊還是商業。"
10069-826-200-3 = "物品管理就\n放心交給我們吧。"
10069-826-210-1 = "商品的下訂、流通……\n雖然都很重要，"
10069-826-210-2 = "不過同樣重要的還有\n商品的配置及擺設。\n來，慢慢看吧。"
10069-826-220-1 = "雖然事情已經處理得差不多了，\n不過我暫時還是打算繼續經營商店。"
10069-826-220-2 = "畢竟人家不是常說\n「為山九仞，功虧一簣」嗎？"
10069-826-230-1 = "嗯？怎麼了？\n有什麼讓你在意的事嗎？"
10069-826-240-1 = "如果有什麼需要的東西，\n或不夠的東西，儘管跟我說。"
10069-826-240-2 = "……在下次見面之前，\n 我會把東西準備好的。"
10069-826-250-1 = "謝謝惠顧～哈哈，\n顧店什麼的真是久違了呢。"
10069-826-260-1 = "你要那個嗎？可以唷。\n我對商品的品質還是很有自信的。"
10069-826-270-1 = "在賣光之前做出選擇吧。\n沒有什麼是比等商品進貨……\n更痛苦的事了。"
10069-826-280-1 = "老師應該也知道，\n世上沒有白吃的午餐。"
10069-826-280-2 = "如果能無償地\n獲得什麼東西……"
10069-826-280-3 = "那就代表在不知不覺間，\n老師自己變成商品了哦。"
10069-826-290-1 = "來，老師。\n試手氣時間到了唷。"
10069-826-300-1 = "來，選吧選吧。\n會抽到什麼呢？"
10069-826-310-1 = "為了避免後悔，\n在這裡全部用光吧。"
10069-826-320-1 = "商會也是有\n各種工作的啊。\n這也是其中之一。"
10069-826-330-1 = "不管什麼事，\n運氣都很重要。"
10069-826-340-1 = "好厲害！\n連我也嚇了一跳。\n恭喜你，老師。"
10069-826-350-1 = "這可是挺少見的\n卡片呢，真厲害。"
10069-826-350-2 = "連我也期待起來了。"
10069-826-360-1 = "我看看……結果是……？\n嘛，也不錯吧？"
10069-826-370-1 = "哎呀……嘛嘛，\n別那麼失望，老師。\n還有下次機會的。"
