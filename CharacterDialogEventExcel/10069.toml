[translation]
10069-826-10-1 = "아, 선생님 기다리고 있었어.\n어때? 산해경은?"
10069-826-20-1 = "미아가 되지 않아서\n다행이네."
10069-826-20-2 = "산해경의 길은\n복잡하니까."
10069-826-30-1 = "현룡문 애들……\n안 변하네.\n좋게도 나쁘게도."
10069-826-40-1 = "걱정 마.\n나는…… '현무상회'는\n선생님 편이니까."
10069-826-50-1 = "이러니 저러니 해도\n무사히 마무리됐네."
10069-826-50-2 = "전부 선생님 덕분이야.\n잊어버린 물건은 없지?\n있다면, 찾아 줄 테니까."
10069-826-60-1 = "요즘 어깨가 뻐근해서……\n누가 주물러주지 않으려나."
10069-826-60-2 = "선생님이라든가……\n힐끔……"
10069-826-70-1 = "하하 그렇게 간지럽혀도,\n아무것도 안 나온다고?"
10069-826-70-2 = "연구 중인 요리라면,\n얼마든지 내놓겠지만."
10069-826-80-1 = "손님에게는 언제나\n최고의 요리를 제공한다고!"
10069-826-80-2 = "뭐…… 연구중인 요리는,\n이야기가 조금 다르지만."
10069-826-90-1 = "선생님은 나에게 있어서,\n무엇이든 될 수 있는 사람이야."
10069-826-90-2 = "손님이면서 동료이기도 하고,\n그리고…… 음……"
10069-826-90-3 = "미안. 이야기는\n여기까지만."
10069-826-200-1 = "요리로 유명해졌지만,"
10069-826-200-2 = "현무상회의 본질은 상업이지."
10069-826-200-3 = "물품 관리는 안심하고 맡겨."
10069-826-210-1 = "상품의 발주, 유통……\n그것도 중요하지만,"
10069-826-210-2 = "그만큼 중요한 건,\n상품 진열과 배치.\n자, 천천히 보라고."
10069-826-220-1 = "일은 정리되었지만,\n아직 당분간은 가게를\n 계속할 생각이야."
10069-826-220-2 = "「구인공휴일궤」라는\n말이 있으니까."
10069-826-230-1 = "음, 무슨 일이야?\n뭐 신경 쓰이는 점이라도 있었어?"
10069-826-240-1 = "필요한 거, 부족한 거 있으면\n뭐든지 말해."
10069-826-240-2 = "……다음 번까지는,\n 제대로 구입해 둘 테니까."
10069-826-250-1 = "매번 감사합니다-!\n하하. 점포를 보는 건\n오랜만인걸."
10069-826-260-1 = "그걸로 할래? 좋아.\n상품의 질에는,\n자신이 있다고."
10069-826-270-1 = "매진되기 전에 골라 보라고.\n재입고를 기다리는 것만큼\n괴로운 일은…… 없으니까."
10069-826-280-1 = "선생님도 알고 있겠지만,\n거래에 공짜는 없어."
10069-826-280-2 = "무언가가 공짜로\n주어진다면……"
10069-826-280-3 = "그건 모르는 사이에\n선생님 자신이\n상품이 되어 있다는 소리야."
10069-826-290-1 = "자, 선생님.\n운을 시험해 볼 시간이야."
10069-826-300-1 = "자, 골라 봐. 골라 봐.\n뭐가 나올까?"
10069-826-310-1 = "후회하지 않게,\n여기서 전부 쓰고 가."
10069-826-320-1 = "상회의 일도 여러 가지가 있어.\n이것도 그 중 하나."
10069-826-330-1 = "무슨 일이든, 운은 중요해."
10069-826-340-1 = "대단해!\n이거, 진심으로 놀랐다고.\n축하해. 선생님."
10069-826-350-1 = "좀처럼 나오지 않는\n카드였는데, 꽤 하잖아."
10069-826-350-2 = "나까지 즐거워졌어."
10069-826-360-1 = "어디 보자…… 결과는……?\n뭐, 좋지 않아?"
10069-826-370-1 = "앗차…… 뭐, 뭐.\n너무 실망하지 마. 선생님.\n다음이라는 게 있으니까."
