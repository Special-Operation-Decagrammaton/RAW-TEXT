[translation]
10069-826-10-1 = "ああ、先生。\n待ってたよ。\nどう？山海経は？"
10069-826-20-1 = "迷子にならなくて\nよかったね。"
10069-826-20-2 = "山海経の道は\n入り組んでるからさ。"
10069-826-30-1 = "玄龍門の子たち……\n変わらないな。\nよくも悪くも。"
10069-826-40-1 = "心配ご無用。\nあたしは……\n「玄武商会」は\n先生の味方だから。"
10069-826-50-1 = "なんだかんだ\n無事に終わって\nよかったよ。"
10069-826-50-2 = "全部先生のおかげ。\n忘れ物は大丈夫？\nあったら探してくるよ。"
10069-826-60-1 = "最近肩が凝っててさ……\n誰か揉んでくれ\nないかなあ。"
10069-826-60-2 = "先生とか……\nチラッ……。"
10069-826-70-1 = "あはは、\nそんなにくすぐっても、\nなんも出ないよ？"
10069-826-70-2 = "研究中の料理なら、\nいくらでも出すけど。"
10069-826-80-1 = "お客にはいつだって\n最高の料理を提供するよ！"
10069-826-80-2 = "まぁ……研究中の料理は、\nちょっと違うけどね。"
10069-826-90-1 = "あたしにとっての先生は、\n何にでもなれる\n存在なんだ。"
10069-826-90-2 = "お客様にも、仲間にも、\nそれから…… ん……"
10069-826-90-3 = "ごめん、話はここまで。"
10069-826-200-1 = "料理で有名に\nなっちゃったけど、"
10069-826-200-2 = "玄武商会の本質は\n商業なんだよね。"
10069-826-200-3 = "物品管理は、\n安心して任せてよ。"
10069-826-210-1 = "商品の発注、流通……\nそれも大事だけど、"
10069-826-210-2 = "同じくらい重要なのは、\n商品の配置と並び。\nさ、ゆっくり見てって。"
10069-826-220-1 = "事は片付いたけど、\nまだしばらくは\n店を続けるつもり。"
10069-826-220-2 = "「九仞の功を一簣に虧く」\nって言うからね。"
10069-826-230-1 = "ん、どうしたのさ？\nなんか気になるとこでもあった？"
10069-826-240-1 = "必要なもの、\n足りないものがあったら、\n何でも言って。"
10069-826-240-2 = "……次回までには、\nちゃんと仕入れとくから。"
10069-826-250-1 = "毎度あり！はは、\n店番なんて久しぶりだなあ。"
10069-826-260-1 = "それにする？良いよ。\n商品の質には、自信があるんだ。"
10069-826-270-1 = "売り切れる前に選んでって。\n入荷待ちほどつらいことは……\nないからね。"
10069-826-280-1 = "先生も知ってる通り、\n取引にタダはない。"
10069-826-280-2 = "何かが無償で\n与えられたのなら…… "
10069-826-280-3 = "それは知らないうちに、\n先生自身が商品に\nなってるんだよ。"
10069-826-290-1 = "はい、先生。\n運試しの時間だよ。"
10069-826-300-1 = "さ、選んで選んで。\n何が出るかな？"
10069-826-310-1 = "後悔しないよう、\nここで全部使っていって。"
10069-826-320-1 = "商会の仕事も\n色々あるんだ。\nこれもその一つ。"
10069-826-330-1 = "何事も、運は大事。"
10069-826-340-1 = "すごい！これは驚いたよ。\nおめでとう、先生。"
10069-826-350-1 = "なかなか出ない\nカードなのに、やるね。"
10069-826-350-2 = "こっちも\n楽しくなってきた。"
10069-826-360-1 = "どれどれ……結果は……？\nま、いいんじゃない？"
10069-826-370-1 = "ありゃあ……まぁまぁ、\nそう落ち込まないで、\n先生。次があるからさ。"
