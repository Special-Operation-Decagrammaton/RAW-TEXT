[translation]
10069-826-10-1 = "อ๊ะ คุณครู กำลังรออยู่เลย\nซานไห่จิง เป็นยังไงบ้างล่ะ?"
10069-826-20-1 = "ค่อยยังชั่วหน่อยนะ\nที่ไม่หลงทาง"
10069-826-20-2 = "ก็ถนนหนทางของซานไห่จิงน่ะ\nมันซับซ้อนออกจะตายไป"
10069-826-30-1 = "พวกมังกรดำ...\nไม่เปลี่ยนไปเลยนะ\nทั้งเรื่องดี และเรื่องไม่ดี"
10069-826-40-1 = "ไม่ต้องห่วงไปนะ ฉันน่ะ...\n'ย่านการค้าเทพเต่าดำ' น่ะ\nอยู่ข้างคุณครูนะ"
10069-826-50-1 = "ถึงจะเกิดเรื่องโน้นเรื่องนี้\nแต่ก็จบลงไปได้ด้วยดีละนะ"
10069-826-50-2 = "ต้องขอบคุณคุณครูเลยนะ\nไม่ลืมอะไรไว้ใช่มั้ย? ถ้ามีก็บอก\nได้เลย ฉันจะช่วยหาให้เอง"
10069-826-60-1 = "ช่วงนี้รู้สึกปวดไหล่จัง...\nจะมีใครมาช่วยนวดให้บ้างมั้ยนะ..."
10069-826-60-2 = "อย่างเช่นคุณครู...\n(เหล่มอง)..."
10069-826-70-1 = "ฮ่าฮ่า! ถึงจะมาจั๊กจี้ฉันแบบนี้\nก็ไม่มีอะไรหล่นออกมาหรอกนะ"
10069-826-70-2 = "ถ้าเป็นอาหารที่กำลังศึกษาอยู่ละก็\nฉันทำออกมาให้ชิมได้ทุกเมื่อแหละ"
10069-826-80-1 = "ไม่ว่าเมื่อไร ฉันก็จะทำ\nอาหารที่ดีที่สุดให้ลูกค้าไงล่ะ!"
10069-826-80-2 = "ก็นะ... แต่ถ้าเป็นอาหาร\nที่กำลังศึกษาอยู่ก็อาจจะ\nต่างไปนิดหน่อย"
10069-826-90-1 = "สำหรับฉัน คุณครูน่ะ...\nคือคนที่เป็นทุกอย่างให้แล้ว..."
10069-826-90-2 = "เป็นทั้งลูกค้า...\nแล้วก็เป็นเพื่อน...\nแล้วก็... อืม..."
10069-826-90-3 = "โทษที เรื่องนั้น\nเอาไว้เท่านี้แล้วกัน"
10069-826-200-1 = "ถึงเราจะโด่งดังเพราะเรื่องอาหาร"
10069-826-200-2 = "แต่แก่นแท้ของย่านการค้า\nเทพเต่าดำก็คือเรื่องการค้านะ"
10069-826-200-3 = "เรื่องการดูแลสิ่งของ\nไว้ใจพวกเราได้เลย"
10069-826-210-1 = "การสั่งซื้อสินค้า การขนส่ง...\nเรื่องพวกนั้นสำคัญก็จริง"
10069-826-210-2 = "แต่สิ่งที่สำคัญที่สุดก็คือการจัดวางและ\nโชว์สินค้า เอาละ ค่อยๆ เลือกดูแล้วกัน"
10069-826-220-1 = "ถึงงานจะจบลงไปแล้ว แต่ฉันว่า\nจะเปิดร้านต่อไปอีกสักพักน่ะ"
10069-826-220-2 = "เหมือนคำกล่าวที่ว่า 'หากหยุดพัก\nจะไม่ถึงเป้าหมาย' ไงละ"
10069-826-230-1 = "อืม... มีเรื่องอะไรเหรอ?\nกังวลเรื่องอะไรอยู่รึเปล่า?"
10069-826-240-1 = "ถ้ามีของที่จำเป็นหรือขาดเหลือ\nอะไรก็บอกได้เลยนะ"
10069-826-240-2 = "...ฉันจะซื้อเตรียมเอาไว้\nจนถึงคราวหน้าเอง"
10069-826-250-1 = "ขอบคุณมากค่ะ-! ฮ่าฮ่า ฉันไม่ได้\nมาดูแลร้านแบบนี้นานแล้ว"
10069-826-260-1 = "จะเอาอันนั้นเหรอ ก็ดีนะ ฉันมั่นใจ\nเรื่องคุณภาพสินค้านะ จะบอกให้"
10069-826-270-1 = "เลือกดีๆ ก่อนของจะหมดละ ให้รอจน\nของมาเติมน่ะ มันทรมานใจจะตาย..."
10069-826-280-1 = "คุณครูเองก็น่าจะรู้ การซื้อขายน่ะ\nไม่มีคำว่าฟรีหรอกนะ"
10069-826-280-2 = "ถ้าจะให้อะไรฟรีๆ ละก็..."
10069-826-280-3 = "หมายความว่าคุณครูกลายเป็นสินค้า\nไปซะเองโดยไม่รู้ตัวยังไงล่ะ"
10069-826-290-1 = "เอาละ คุณครู\nได้เวลาทดสอบดวงกันแล้ว"
10069-826-300-1 = "เอาละ เลือกเลยสิ เลือกเลย\nจะสุ่มได้อะไรกันนะ?"
10069-826-310-1 = "ใช้ให้หมดที่นี่เลยนะ\nจะได้ไม่ต้องเสียใจ"
10069-826-320-1 = "งานของทางย่านการค้า\nก็มีอยู่หลายๆ อย่าง\nและนี่ก็เป็นงานสำคัญอย่างหนึ่ง"
10069-826-330-1 = "ดวงสำคัญมากในทุกๆ เรื่องนะ"
10069-826-340-1 = "สุดยอดเลย!\nนี่มัน... น่าทึ่งสุดๆ ไปเลย\nยินดีด้วยนะ คุณครู"
10069-826-350-1 = "สุดยอดเลย การ์ดนี้\nไม่ได้สุ่มได้ง่ายๆ\nหรอกนะ"
10069-826-350-2 = "ฉันเองก็สนุกเหมือนกัน"
10069-826-360-1 = "ไหนดูซิ... ผลก็คือ...?\nก็... ไม่เลวเลยนะ?"
10069-826-370-1 = "โธ่เอ๊ย... อะไรกันๆ\nอย่าเสียใจไปเลยน่า คุณครู\nยังมีโอกาสคราวหน้าอีกนะ"
10069-10826-10-1 = "อ๊ะ คุณครู กำลังรออยู่เลย\nซานไห่จิง เป็นยังไงบ้างล่ะ?"
10069-10826-20-1 = "ค่อยยังชั่วหน่อยนะ\nที่ไม่หลงทาง"
