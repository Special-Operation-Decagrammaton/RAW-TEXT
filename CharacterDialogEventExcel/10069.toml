[translation]
10069-826-10-1 = "Oh, there you are, Sensei. How are you enjoying Shanhaijing?"
10069-826-20-1 = "I'm glad you didn't get lost."
10069-826-20-2 = "The streets of Shanhaijing are complicated."
10069-826-30-1 = "Those Genryumon guys never change. For better or worse."
10069-826-40-1 = "Don't worry. The Black Tortoise Promenade—and myself—are on your side."
10069-826-50-1 = "After all that, we're finished."
10069-826-50-2 = "It's all thanks to you, Sensei. You haven't lost anything, have you? If so, I'll go find it."
10069-826-60-1 = "My shoulders have been so stiff lately... I need a massage."
10069-826-60-2 = "Maybe from Sensei...? *gulp*"
10069-826-70-1 = "Haha! You can't tickle the truth out of me, you know!"
10069-826-70-2 = "I can offer you one of the dishes I'm still studying, but..."
10069-826-80-1 = "I always provide the highest quality food to my guests!"
10069-826-80-2 = "And, well... If I'm still studying a dish, it might not be at that level yet."
10069-826-90-1 = "Sensei, you are very important to me."
10069-826-90-2 = "You're a customer and a colleague and...um..."
10069-826-90-3 = "Sorry, I've said too much..."
10069-826-200-1 = "We're known for our food..."
10069-826-200-2 = "But the main work of the Black Tortoise Promenade is commerce."
10069-826-200-3 = "You can leave product management to us."
10069-826-210-1 = "Of course, product sourcing and distribution are important..."
10069-826-210-2 = "But so are presentation and the layout of your goods. Take your time and look carefully."
10069-826-220-1 = "Things have been taken care of, but I plan on continuing the store for a while."
10069-826-220-2 = "It's important to always finish your work."
10069-826-230-1 = "Hm. What's wrong? Are you concerned about something?"
10069-826-240-1 = "Just let me know if you need anything."
10069-826-240-2 = "...I'll buy the right one next time."
10069-826-250-1 = "Thank you as always! It's been a while since I saw the store. Haha."
10069-826-260-1 = "Do you want that one? A good pick. Quality guaranteed!"
10069-826-270-1 = "Make your purchase before it's sold out. There's nothing worse than waiting for the next shipment."
10069-826-280-1 = "As you probably know, Sensei, there's no such thing as a free lunch."
10069-826-280-2 = "If a product you use or consume is free..."
10069-826-280-3 = "All that means is you've become the product yourself without even knowing!"
10069-826-290-1 = "Now, Sensei. It's time to test your luck."
10069-826-300-1 = "Make a choice. I wonder what will come out."
10069-826-310-1 = "Spend it all here or you'll regret it later."
10069-826-320-1 = "This is just one of the many enterprises the Promenade is involved in."
10069-826-330-1 = "As with anything, luck is important."
10069-826-340-1 = "Amazing! What a surprise! Congratulations, Sensei."
10069-826-350-1 = "This card is really rare. It's quite valuable."
10069-826-350-2 = "I'm really happy for you."
10069-826-360-1 = "Let's see here... The result is....? Well, it's still good..."
10069-826-370-1 = "Yikes... Well, well... Don't be too disappointed, Sensei. There's always next time."
