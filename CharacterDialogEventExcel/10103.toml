[translation]
10103-900839-10-1 = "レッドウィンターと\n山海経、両校の威信を\nかけたこの交流会…"
10103-900839-20-1 = "なんとしてでも\n成功させなければ！"
10103-900839-30-1 = "ここで何を\nしているのかって？"
10103-900839-40-1 = "見ての通り、書記長の\n身を守るべく護衛を\nしているところだが――"
10103-900839-50-1 = "…い、いない！？\nチェリノ書記長！？\nどちらに！？"
10103-900839-60-1 = "山海経の街は\n迷路みたいだ…"
10103-900839-70-1 = "突撃には不向きだな。"
10103-900839-80-1 = "はっ！\nイチ部活相手に\n苦戦とは。"
10103-900839-90-1 = "玄龍門も\n大したことないな。"
10103-900839-100-1 = "我が事務局の権威を\n上げるためには、"
10103-900839-110-1 = "相手がどんな手を\n使ってこようと決して\n懐柔されずどっしりと――"
10103-900839-120-1 = "…うん？これか？"
10103-900839-130-1 = "玄武商会からもらった\n中華まんだが。"
10103-900839-140-1 = "門主のガードから\nサングラスをもらった。"
10103-900839-150-1 = "格好といい、\n存在感といい、あれは…\n只者ではないぞ…"
10103-900839-160-1 = "チーパオの下に\nインナーを履くのは\nルール違反だと\n聞いたが…"
10103-900839-170-1 = "本当にこれで\nあっているのか？"
10103-900839-180-1 = "他校のしきたりは\n尊重すべきだが…"
10103-900839-190-1 = "突撃に適した服装では、\nないような…"
