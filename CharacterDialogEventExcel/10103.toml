[translation]
10103-839-10-1 = "The prestige of Red Winter and Shanhaijing hang in the balance of this exchange meeting..."
10103-839-20-1 = "It must be a success, no matter what!"
10103-839-30-1 = "You want to know what I'm doing here?"
10103-839-40-1 = "As you can plainly see, I'm in the middle of escorting the Great Leader, for her safety."
10103-839-50-1 = "H-Huh? Great Leader Cherino?! Where did she go?"
10103-839-60-1 = "What does Shanhaijing think they're doing? Treating us like this..."
10103-839-70-1 = "Don't think I'll let them get away with it!"
10103-839-80-1 = "Allowing a coup d'etat in front of outsiders..."
10103-839-90-1 = "Those Shanhaijing guys have really embarrassed themselves."
10103-839-100-1 = "If we were talking about Red Winter Federal Academy..."
10103-839-110-1 = "...Ahem! A coup d'etat is really a minor issue."
10103-839-120-1 = "*sigh* I'm exhausted..."
10103-839-130-1 = " I never thought I'd start to miss the snowfields of Red Winter."
10103-839-140-1 = "The streets of Shanhaijing are too complicated..."
10103-839-150-1 = "They aren't suited for a charge."
10103-839-160-1 = "Intimidated by a single club..."
10103-839-170-1 = "The members of the Genryumon must be softer than they look."
10103-839-180-1 = "For the sake of the authority of the student council..."
10103-839-190-1 = "We can't let things slide, no matter how hard our opponents try to persuade..."
10103-839-200-1 = "Hm? What am I holding?"
10103-839-210-1 = "...Just some dumplings I got for free from the Black Tortoise Promenade."
10103-839-220-1 = "The president's bodyguard gave me sunglasses..."
10103-839-230-1 = "Her outfit, her presence... She was no ordinary person."
10103-839-240-1 = "I heard that it's a rule that you can't wear a slip under a qipao."
10103-839-250-1 = "Is that right?"
10103-839-260-1 = "I don't want to insult the customs of other academies, but..."
10103-839-270-1 = "It just doesn't seem like the right outfit for a charge..."
10103-839-520-1 = "What are you doing here? I'm just organizing what we need for the exchange meeting..."
10103-839-530-1 = "Would you mind donating some supplies?"
10103-839-540-1 = "I think this exchange meeting is going to be larger than expected."
10103-839-550-1 = "The exchange meeting is over, but supply donations are always welcome."
10103-839-560-1 = "We're all in the same boat, so we might as well help other academies."
10103-839-570-1 = "(This Peking opera mask...is kind of scary if you stare at it long enough...)"
10103-839-580-1 = "Oh, that's a good item."
10103-839-590-1 = "We have enough to hold a successful exchange meeting."
10103-839-600-1 = "Um... Sensei. I'm not making any accusations, but...where did you get all these supplies...?"
10103-839-610-1 = "Excellent! Sensei's name will continue to be praised in both schools!"
