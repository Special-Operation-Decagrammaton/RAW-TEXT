[translation]
10103-839-10-1 = "เรดวินเทอร์กับซานไห่จิง\nงานแลกเปลี่ยนนี้... มีศักดิ์ศรี\nของ 2 โรงเรียนเป็นเดิมพัน"
10103-839-20-1 = "ไม่ว่ายังไงก็ต้อง\nทำให้สำเร็จให้ได้!"
10103-839-30-1 = "ฉันมาทำอะไร\nอยู่ที่นี่น่ะเหรอ?"
10103-839-40-1 = "ก็อย่างที่เห็นว่า\nฉันกำลังคุ้มกัน\nท่านเลขาธิการอยู่"
10103-839-50-1 = "เอะ... เอ๋?\nท่านเลขาธิการเชริโน่?!\nไปไหนซะแล้วล่ะ?"
10103-839-60-1 = "พวกเด็กซานไห่จิง\nคิดแผนการอะไรอยู่กันแน่นะ?\nถึงได้ปฏิบัติต่อพวกเรา\nกันขนาดนี้..."
10103-839-70-1 = "อย่าคิดว่าฉันจะ\nยอมปล่อยไปเฉยๆ นะ!"
10103-839-80-1 = "ปล่อยให้มีการปฏิวัติ\nต่อหน้าคนนอกแบบนี้..."
10103-839-90-1 = "เจ้าพวกซานไห่จิง\nทำเรื่องน่าอับอายเสียจริง"
10103-839-100-1 = "ถ้าเป็นสถาบันสหภาพ\nเรดวินเทอร์ของเราละก็\nไม่มีทางเด็ดขาด...!"
10103-839-110-1 = "อะแฮ่ม...!\nก็แค่การปฏิวัติ\nเรื่องเล็กน้อยน่า"
10103-839-120-1 = "เฮ้อ เหนื่อยจัง..."
10103-839-130-1 = "ไม่คิดเลยว่าจะ\nคิดถึงทุ่งหิมะ\nของเรดวินเทอร์ขึ้นมา"
10103-839-140-1 = "ถนนหนทางในซานไห่จิง\nซับซ้อนเหลือเกิน..."
10103-839-150-1 = "ไม่เหมาะสำหรับ\nการบุกจู่โจมเลย"
10103-839-160-1 = "ประหม่ากับแค่\nชมรมอะไรเนี่ยนะ"
10103-839-170-1 = "พวกมังกรดำก็\nอ่อนแอกว่าที่เห็นแฮะ"
10103-839-180-1 = "หากจะเพิ่มอำนาจ\nของสภานักเรียนละก็"
10103-839-190-1 = "ไม่ว่าอีกฝ่ายจะเสนอ\nการประนีประนอมยังไง\nก็ไม่ควรหลงกล..."
10103-839-200-1 = "หืม? ฉันกำลังถือ\nอะไรอยู่น่ะเหรอ?"
10103-839-210-1 = "เกี๊ยวที่ย่านการค้าเทพเต่าดำ\nแถมมาให้น่ะสิ"
10103-839-220-1 = "ฉันได้แว่นกันแดดเป็นของขวัญ\nจากผู้พิทักษ์ของประมุขมาน่ะ..."
10103-839-230-1 = "ทั้งการแต่งตัวและกิริยาท่าทาง...\nดูไม่ใช่คนธรรมดาๆ เลยละ..."
10103-839-240-1 = "ได้ยินว่ามีกฎ\nห้ามใส่กางเกงซับใน\nในชุดกี่เพ้าด้วยนะ"
10103-839-250-1 = "แบบนี้ถูกต้องจริงๆ เหรอ?"
10103-839-260-1 = "ฉันไม่ได้จะดูหมิ่นธรรมเนียม\nของโรงเรียนอื่นหรอกนะ"
10103-839-270-1 = "แต่ชุดแบบนี้มัน\nดูไม่เหมาะสม\nกับการบุกจู่โจมเลย..."
10103-839-520-1 = "นี่มันเรื่องอะไรกันเนี่ย?\nทำไมฉันถึงมาจัดของที่จำเป็น\nในงานแลกเปลี่ยนอยู่ที่นี่..."
10103-839-530-1 = "ถ้าไม่ว่าอะไร ช่วยบริจาค\nสิ่งของหน่อยได้มั้ย?"
10103-839-540-1 = "งานแลกเปลี่ยนครั้งนี้\nดูเป็นงานใหญ่กว่าที่คิดน่ะ"
10103-839-550-1 = "งานแลกเปลี่ยนจบไปแล้ว\nแต่ก็มาบริจาคของได้ทุกเมื่อนะ"
10103-839-560-1 = "ในเมื่อลงเรือลำเดียวกันแล้ว\nต่อให้เป็นโรงเรียนอื่นก็ต้องช่วยกันสิ"
10103-839-570-1 = "(หน้ากากงิ้วนี่มัน...\nแค่จ้องก็น่ากลัวแล้ว...)"
10103-839-580-1 = "โอ้ว เป็นของที่ดีเลยนะ"
10103-839-590-1 = "มีเยอะขนาดนี้ คงจัดงานแลกเปลี่ยนได้สำเร็จแน่"
10103-839-600-1 = "นี่... ครู ฉันไม่ได้ข้องใจหรอกนะ...\nแต่ไปเอาของมาจากไหนตั้งเยอะตั้งแยะน่ะ...?"
10103-839-610-1 = "ยอดเยี่ยม! ชื่อของคุณครู\nคงเป็นที่พูดถึงในหมู่เด็กนักเรียน\nของสองโรงเรียนต่อไปแน่นอน!"
10103-10839-10-1 = "เรดวินเทอร์กับซานไห่จิง\nงานแลกเปลี่ยนนี้... มีศักดิ์ศรี\nของ 2 โรงเรียนเป็นเดิมพัน"
