[translation]
10103-839-10-1 = "レッドウィンターと\n山海経、両校の威信を\nかけたこの交流会…"
10103-839-20-1 = "なんとしてでも\n成功させなければ！"
10103-839-30-1 = "ここで何を\nしているのかって？"
10103-839-40-1 = "見ての通り、書記長の\n身を守るべく護衛を\nしているところだが――"
10103-839-50-1 = "…い、いない！？\nチェリノ書記長！？\nどちらに！？"
10103-839-60-1 = "山海経は一体何を\n企んでいるんだ？我々に\nこんな扱いをして…"
10103-839-70-1 = "ただで済むと思うな！"
10103-839-80-1 = "他校生の前で騒動を\n容認するだなんて。"
10103-839-90-1 = "山海経も、\n醜態を晒したな。"
10103-839-100-1 = "我々レッドウィンター\n連邦学園なら、\n断じてそんなことは…！"
10103-839-110-1 = "…ごほん！\nまあ、その程度、\n些細なことだ。"
10103-839-120-1 = "ふぅ…疲れた…"
10103-839-130-1 = "レッドウィンターの\n雪原が恋しくなる日が\nくるとは…。"
10103-839-140-1 = "山海経の街は\n迷路みたいだ…"
10103-839-150-1 = "突撃には不向きだな。"
10103-839-160-1 = "はっ！\nイチ部活相手に\n苦戦とは。"
10103-839-170-1 = "玄龍門も\n大したことないな。"
10103-839-180-1 = "我が事務局の権威を\n上げるためには、"
10103-839-190-1 = "相手がどんな手を\n使ってこようと決して\n懐柔されずどっしりと――"
10103-839-200-1 = "…うん？これか？"
10103-839-210-1 = "玄武商会からもらった\n中華まんだが。"
10103-839-220-1 = "門主のガードから\nサングラスをもらった。"
10103-839-230-1 = "格好といい、\n存在感といい、あれは…\n只者ではないぞ…"
10103-839-240-1 = "チーパオの下に\nインナーを履くのは\nルール違反だと\n聞いたが…"
10103-839-250-1 = "本当にこれで\nあっているのか？"
10103-839-260-1 = "他校のしきたりは\n尊重すべきだが…"
10103-839-270-1 = "突撃に適した服装では、\nないような…"
10103-839-520-1 = "何の用だ？私か？\n交流会用に片付けていたところだ。"
10103-839-530-1 = "よかったら物資の寄付を\n頼めるか？"
10103-839-540-1 = "今回の交流会、思ったより\n大規模になりそうでな。"
10103-839-550-1 = "交流会は終わったが…\n物資の寄付ならいつでも歓迎だ。"
10103-839-560-1 = "乗りかかった船だ。\n他校に手を貸そうではないか。"
10103-839-570-1 = "（京劇のお面…よく見ると、\nなんだか怖いな…）"
10103-839-580-1 = "おお、これは立派な品だ。"
10103-839-590-1 = "これだけあれば、交流会の成功は間違いないだろう。"
10103-839-600-1 = "あの…先生。疑ってるわけでは\nないんだが…これだけの\n物資を、一体どこから…？"
10103-839-610-1 = "素晴らしい！先生の名は、\n両校で語り継がれるだろう！"
