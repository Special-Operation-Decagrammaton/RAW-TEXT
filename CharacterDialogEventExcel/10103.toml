[translation]
10103-839-10-1 = "赤冬與山海經，\n攸關兩校威信的\n這場交流會……"
10103-839-20-1 = "無論如何都得\n辦成功才行！"
10103-839-30-1 = "問我在這裡做什麼？"
10103-839-40-1 = "如你所見，正在\n擔任守護書記長\n安全的護衛──"
10103-839-50-1 = "……不，不見了！？\n潔莉諾書記長！？\n您在哪裡！？"
10103-839-60-1 = "山海經究竟\n在打什麼主意？\n這樣對待我們……"
10103-839-70-1 = "別想就這麼算了！"
10103-839-80-1 = "居然在外校學生面前\n讓騷動發生……"
10103-839-90-1 = "山海經也出盡洋相了啊。"
10103-839-100-1 = "換作是我們赤冬\n聯邦學園的話，\n那種事絕對……！"
10103-839-110-1 = "……咳哼！\n算了，那種程度\n只是小問題而已。"
10103-839-120-1 = "呼……好累……"
10103-839-130-1 = "想不到竟然會有\n開始懷念起赤冬\n雪原的這天啊……"
10103-839-140-1 = "山海經的街道\n就跟迷宮一樣……"
10103-839-150-1 = "並不適合突擊啊。"
10103-839-160-1 = "哈！竟然會因為區區\n一個社團陷入苦戰……"
10103-839-170-1 = "玄龍門也不怎麼樣嘛。"
10103-839-180-1 = "為了樹立\n我大事務局的權威，"
10103-839-190-1 = "對方無論使出任何手段\n都絕不會受到懷柔，\n而會穩重地──"
10103-839-200-1 = "……嗯？這個？"
10103-839-210-1 = "是玄武商會\n招待的中華包子。"
10103-839-220-1 = "我從門主的護衛\n手中收到了墨鏡。"
10103-839-230-1 = "外表也好，\n存在感也罷，那……\n絕非等閒之輩啊……"
10103-839-240-1 = "聽說在旗袍裡面穿\n內衣是不合規矩的……"
10103-839-250-1 = "真的是這樣嗎？"
10103-839-260-1 = "雖然應該尊重\n他校的風俗……"
10103-839-270-1 = "但這似乎並非\n適合突擊的服裝啊……"
10103-839-520-1 = "有什麼事？我嗎？\n正在為交流會做整理。"
10103-839-530-1 = "不介意的話，\n物資的捐贈可以麻煩你嗎？"
10103-839-540-1 = "這次的交流會，規模\n似乎會變得比預期中更大啊。"
10103-839-550-1 = "交流會雖然結束了……\n但物資的捐贈隨時都很歡迎。"
10103-839-560-1 = "既然都走到這一步了，\n就對他校伸出援手吧。"
10103-839-570-1 = "（京劇的面具……\n仔細一看，好像有點可怕……）"
10103-839-580-1 = "哦哦，這是好東西啊。"
10103-839-590-1 = "有這麼多的話，\n交流會肯定會成功的。"
10103-839-600-1 = "那個……老師。我沒有\n要懷疑你的意思……但這麼多\n的物資，你究竟是從哪裡……？"
10103-839-610-1 = "太厲害了！老師的名號，\n將會被兩校不斷傳頌吧！"
