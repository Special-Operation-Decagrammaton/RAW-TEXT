[translation]
20038-900839-200-1 = "大規模交流会は、\nレッドウィンター\n事務局としても\n初の試みです。"
20038-900839-210-1 = "私もとっても楽しみです。"
20038-900839-220-1 = "先生、チーパオ姿の\nチェリノちゃんには\nもう会いました？"
20038-900839-230-1 = "ふふっ、とっても\n可愛いと思いませんか？"
20038-900839-240-1 = "あ…私も似合ってる、\nですか？"
20038-900839-250-1 = "…それは、ありがとう\nございます。"
20038-900839-260-1 = "山海経の公園は\n広くてきれいですね。"
20038-900839-270-1 = "街頭演説に\nぴったりです。"
20038-900839-280-1 = "ここでチェリノ会長の\n偉大さを語るのは…"
20038-900839-290-1 = "外交問題になって\nしまいますよね…。"
20038-900839-300-1 = "変わるもの、\n変わらぬもの。"
20038-900839-310-1 = "…選ぶのは\n難しいですね。"
20038-900839-320-1 = "…レッドウィンター\n連邦学園は変わっていく\nばかりではありますが。"
20038-900839-330-1 = "先ほどルミ会長から、\n安眠効果のある\n茶葉をいただきました。"
20038-900839-340-1 = "今晩はこちらで、\nチェリノちゃんに\nミルクティーを淹れ\nようと思っているんです。"
20038-900839-350-1 = "「錬丹術研究会」という\n部活では、若返りの薬を\n研究しているそうです。"
20038-900839-360-1 = "これは…記録して\nおかないとですね。"
