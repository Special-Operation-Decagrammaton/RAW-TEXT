[translation]
20038-200 = "大規模交流会は、\nレッドウィンター\n事務局としても\n初の試みです。"
20038-210 = "私もとっても楽しみです。"
20038-220 = "先生、チーパオ姿の\nチェリノちゃんには\nもう会いました？"
20038-230 = "ふふっ、とっても\n可愛いと思いませんか？"
20038-240 = "あ…私も似合ってる、\nですか？"
20038-250 = "…それは、ありがとう\nございます。"
20038-260 = "山海経の公園は\n広くてきれいですね。"
20038-270 = "街頭演説に\nぴったりです。"
