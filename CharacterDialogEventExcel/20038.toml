[translation]
20038-839-280-1 = "大規模交流会は、\nレッドウィンター\n事務局としても\n初の試みです。"
20038-839-290-1 = "私もとっても楽しみです。"
20038-839-300-1 = "先生、チーパオ姿の\nチェリノちゃんには\nもう会いました？"
20038-839-310-1 = "ふふっ、とっても\n可愛いと思いませんか？"
20038-839-320-1 = "あ…私も似合ってる、\nですか？"
20038-839-330-1 = "…それは、ありがとう\nございます。"
20038-839-340-1 = "（山海経の黒い君主…\n想像よりもずっと\n強いお方でした）"
20038-839-350-1 = "（…可愛いだけでは\nないのですね。\nふふっ）"
20038-839-360-1 = "騒動には慣れていた\nつもりでしたが…"
20038-839-370-1 = "他校のものを\n目の当たりにすると…"
20038-839-380-1 = "なんだか不思議な\n気分です。"
20038-839-390-1 = "交流会、とっても\n楽しかったです。"
20038-839-400-1 = "今度は門主様を\n我がレッドウィンターに\n招待しなくては、ふふ。"
20038-839-410-1 = "山海経の公園は\n広くてきれいですね。"
20038-839-420-1 = "街頭演説に\nぴったりです。"
20038-839-430-1 = "ここでチェリノ会長の\n偉大さを語るのは…"
20038-839-440-1 = "外交問題になって\nしまいますよね…。"
20038-839-450-1 = "変わるもの、\n変わらぬもの。"
20038-839-460-1 = "…選ぶのは\n難しいですね。"
20038-839-470-1 = "…レッドウィンター\n連邦学園は変わっていく\nばかりではありますが。"
20038-839-480-1 = "先ほどルミ会長から、\n安眠効果のある\n茶葉をいただきました。"
20038-839-490-1 = "今晩はこちらで、\nチェリノちゃんに\nミルクティーを淹れ\nようと思っているんです。"
20038-839-500-1 = "「錬丹術研究会」という\n部活では、若返りの薬を\n研究しているそうです。"
20038-839-510-1 = "これは…記録して\nおかないとですね。"
20038-839-620-1 = "交流会を記念して、\n交換券イベントを\n行っております！"
20038-839-630-1 = "門主様の人形を\nお持ちでしたら、\n景品と交換させて\nいただきます！"
20038-839-640-1 = "まだ人形の交換は\n承っておりますよ。"
20038-839-650-1 = "交換忘れのないよう、\nご利用ください。"
20038-839-660-1 = "この人形、私が\nデザインしたのですよ。"
20038-839-670-1 = "チェリノ会長の人形を\n作っていた日頃の\n経験が役立って\nよかったです。"
20038-839-680-1 = "交換券として\n作ったものですが…"
20038-839-690-1 = "どうしたものか手元に\n残したいという生徒が\n多くて、なかなか\n回収できません。"
20038-839-700-1 = "…景品に何か問題でも\nあったのでしょうか？"
20038-839-710-1 = "おめでとうございます、\n当たりです！"
20038-839-720-1 = "当たりです！\n先生は運がいいのですね。"
20038-839-730-1 = "これは…1等ですね！\n流石先生です！"
20038-839-740-1 = "あら、こんなにたくさん…"
20038-839-750-1 = "景品をお持ちしますね。\n少々お待ちください。"
20038-839-760-1 = "こんにちは、先生。\n交流会のスケジュールを\nまとめておきました。"
20038-839-770-1 = "両校の生徒が集結しておりますので\n処理すべきお仕事が山積みです。"
20038-839-780-1 = "どうかされましたか？"
20038-839-790-1 = "めっ、ですよ。今はお仕事に\n集中していただかないと。"
20038-839-800-1 = "お見事です。ここが\nレッドウィンターでしたら勲章を\n差し上げたのに…"
20038-839-810-1 = "ご協力くださり、\nありがとうございます。"
