[translation]
20038-839-280-1 = "สำนักเลขาธิการเรดวินเทอร์\nก็ไม่เคยมางานแลกเปลี่ยน\nที่ใหญ่ขนาดนี้มาก่อน"
20038-839-290-1 = "ฉันเองก็คาดหวังมากเลยค่ะ"
20038-839-300-1 = "คุณครู เห็นเชริโน่จัง\nในชุดกี่เพ้าหรือยังคะ?"
20038-839-310-1 = "ฮุฮุ น่ารักมากเลย\nว่ามั้ยคะ?"
20038-839-320-1 = "อ่า... ฉันก็เหมาะ\nกับชุดนี้งั้นเหรอคะ?"
20038-839-330-1 = "ขอบคุณค่ะ..."
20038-839-340-1 = "(ราชาทมิฬของซานไห่จิง...\nเป็นคนที่แข็งแกร่ง\nกว่าที่คิดเยอะเลยนะคะ)"
20038-839-350-1 = "(คงจะเอ็นดูเธอเฉยๆ\nไม่ได้แล้วนะคะ ฮุฮุ)"
20038-839-360-1 = "ฉันคิดว่าตัวเอง\nค่อนข้างคุ้นเคย\nกับการปฏิวัติแล้วเสียอีก..."
20038-839-370-1 = "แต่พอได้เจอ\nที่โรงเรียนอื่น"
20038-839-380-1 = "ก็รู้สึกแปลกๆ นะคะ"
20038-839-390-1 = "เป็นงานแลกเปลี่ยน\nที่สนุกมากๆ เลยค่ะ"
20038-839-400-1 = "ครั้งหน้าต้องเชิญ\nท่านประมุขไปเยือน\nเรดวินเทอร์ให้ได้เลยค่ะ ฮุฮุ"
20038-839-410-1 = "สวนในซานไห่จิง\nกว้างขวางและสะอาดจังเลยค่ะ"
20038-839-420-1 = "เหมาะที่จะใช้ปราศรัย\nนอกสถานที่เลยค่ะ"
20038-839-430-1 = "ถ้ามาอธิบายถึงความยิ่งใหญ่\nของประธานเชริโน่ที่นี่ละก็"
20038-839-440-1 = "คงเป็นปัญหา\nทางการทูตใช่มั้ยคะ...?"
20038-839-450-1 = "การเปลี่ยนแปลง\nกับการไม่เปลี่ยนแปลง"
20038-839-460-1 = "เป็นปัญหาที่\nเลือกยากเลยนะคะ..."
20038-839-470-1 = "ถึงเรดวินเทอร์จะเปลี่ยนอยู่ทุกวัน\nจนเป็นเรื่องใหญ่ก็เถอะค่ะ"
20038-839-480-1 = "เมื่อกี้ฉันได้ของขวัญ\nเป็นใบชาที่ช่วยให้หลับสบาย\nจากประธานรูมิมาค่ะ"
20038-839-490-1 = "เย็นนี้คงต้องเอามาทำ\nชานมให้เชริโน่จังแล้วละค่ะ"
20038-839-500-1 = "ชมรมวิจัยศาสตร์การปรุงยา\nกำลังวิจัยยาที่ทำให้\nเด็กลงอยู่เหรอคะ?"
20038-839-510-1 = "นั่นน่ะ... ฉันต้อง\nจดเรื่องนี้เอาไว้\nแล้วละค่ะ"
20038-839-620-1 = "เรากำลังจัดกิจกรรมตั๋วแลกเปลี่ยน\nเพื่อเป็นที่ระลึกงานแลกเปลี่ยนอยู่ค่ะ!"
20038-839-630-1 = "ถ้าอยากได้ตุ๊กตา\nของท่านประมุข\nเราจะให้แลก\nเป็นของสมนาคุณค่ะ!"
20038-839-640-1 = "กิจกรรมแลกของ\nยังจัดอยู่นะคะ"
20038-839-650-1 = "อย่าลืมมาแลกของ\nจนกว่าจะสิ้นสุด\nกิจกรรมนะคะ"
20038-839-660-1 = "ตุ๊กตาตัวนี้\nฉันเป็นคนออกแบบเองค่ะ"
20038-839-670-1 = "ประสบการณ์จากการ\nทำตุ๊กตารูปประธานเชริโน่\nช่วยฉันได้เยอะเลยค่ะ"
20038-839-680-1 = "ตั๋วนี้ทำมาเพื่อใช้แลกของ..."
20038-839-690-1 = "แต่มีนักเรียนหลายคน\nที่อยากเก็บไว้\nก็เลยไม่เอามาแลกค่ะ"
20038-839-700-1 = "มีปัญหาอะไรกับ\nของสมนาคุณหรือเปล่าคะ?"
20038-839-710-1 = "ยินดีด้วยค่ะ!\nถูกรางวัลค่ะ!"
20038-839-720-1 = "ถูกรางวัลค่ะ!\nคุณครูโชคดีจังเลยนะคะ"
20038-839-730-1 = "นี่มัน... รางวัลที่ 1 เลยนะคะ!\nสมกับเป็นคุณครูเลยค่ะ!"
20038-839-740-1 = "ว้าว เยอะขนาดนี้เลย..."
20038-839-750-1 = "ฉันจะรีบไปเอามาให้ค่ะ\nรอสักครู่นะคะ"
20038-839-760-1 = "เชิญเลยค่ะ คุณครู\nฉันกำลังจัดการ\nตารางงานแลกเปลี่ยนอยู่ค่ะ"
20038-839-770-1 = "คงเพราะเป็นงานที่นักเรียนจาก 2 โรงเรียน\nมาอยู่ที่เดียวกัน เลยมีงานที่ต้องทำ\nค่อนข้างเยอะเลยค่ะ"
20038-839-780-1 = "ค่ะ มีเรื่องอะไรงั้นเหรอคะ?"
20038-839-790-1 = "ไม่ได้ค่ะ\nตอนนี้ฉันต้องจดจ่อกับงานค่ะ"
20038-839-800-1 = "ฝีมือยอดเยี่ยมเลยนะคะ ถ้าที่นี่เป็น\nเรดวินเทอร์ ฉันคงให้เหรียญตราแล้วค่ะ"
20038-839-810-1 = "ขอบคุณที่ให้ความร่วมมือนะคะ"
