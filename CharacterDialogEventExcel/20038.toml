[translation]
20038-839-280-1 = "An exchange meeting of this scale is a first, even for the Red Winter Office."
20038-839-290-1 = "I'm excited, too."
20038-839-300-1 = "Sensei, have you seen Cherino in a qipao?"
20038-839-310-1 = "Heh heh, isn't she adorable?"
20038-839-320-1 = "Oh... I look good, too?"
20038-839-330-1 = "...Thank you."
20038-839-340-1 = "(The Dark Monarch of Shanhaijing... She's much more powerful than I thought.)"
20038-839-350-1 = "(I can't just think that she's cute, heh heh.)"
20038-839-360-1 = "I thought I was used to coup d'etats now..."
20038-839-370-1 = "Coming face to face with one at a different academy..."
20038-839-380-1 = "It feels strange."
20038-839-390-1 = "It's been a wonderful exchange meeting."
20038-839-400-1 = "We'll have to host them at Red Winter next time! Heehee."
20038-839-410-1 = "The parks in Shanhaijing are so big and clean."
20038-839-420-1 = "Perfect for street speeches!"
20038-839-430-1 = "If we extol the greatness of President Cherino here..."
20038-839-440-1 = "...it could become a diplomatic incident, huh?"
20038-839-450-1 = "Things that change, or things that don't..."
20038-839-460-1 = "It's hard to choose."
20038-839-470-1 = "But it is a problem that Red Winter Academy changes every single day."
20038-839-480-1 = "President Rumi gave me tea leaves for sleep."
20038-839-490-1 = "I'm going to use them to make milk tea for Cherino tonight."
20038-839-500-1 = "Some club called the Eastern Alchemy Society is working on medicine that makes you younger?"
20038-839-510-1 = "This...needs to be recorded."
20038-839-620-1 = "To celebrate the exchange meeting, we're holding an exchange ticket event!"
20038-839-630-1 = "If you have Madam's doll, you can exchange it for a prize here!"
20038-839-640-1 = "The exchange event is still in progress."
20038-839-650-1 = "Don't forget to exchange your items before it ends."
20038-839-660-1 = "I designed this doll."
20038-839-670-1 = "All my experience making President Cherino dolls came in handy."
20038-839-680-1 = "They were made to use for exchange tickets, but..."
20038-839-690-1 = "So many students just wanted to keep them. We've had trouble getting them back."
20038-839-700-1 = "Do you think there was an issue with the prizes?"
20038-839-710-1 = "Congratulations! You're a winner!"
20038-839-720-1 = "You're a winner! You have good luck, Sensei."
20038-839-730-1 = "This is...first place! Of course you'd win, Sensei."
20038-839-740-1 = "Oh my, so many..."
20038-839-750-1 = "I'll bring them right away. Just a moment, please."
20038-839-760-1 = "Welcome, Sensei. I was organizing the schedule for the exchange meeting."
20038-839-770-1 = "There's a lot to take care of, since students from both schools will be here."
20038-839-780-1 = "Yes. How can I help you?"
20038-839-790-1 = "No. Please focus on work for now."
20038-839-800-1 = "Amazing work. If this was Red Winter, I would've given you a medal..."
20038-839-810-1 = "Thank you for your cooperation."
