[translation]
10015-855-10-1 = "오늘 할 일은\n무엇일까요?"
10015-855-20-1 = "앗, 아리스가 정리해야\n하는 것이었죠……."
10015-855-30-1 = "갑옷이 없어도……"
10015-855-40-1 = "그리고 만일,\n빛의 검마저\n없어져도……"
10015-855-50-1 = "그래도,\n아리스는 아리스입니다."
10015-855-60-1 = "모두와 함께라면,\n그리고."
10015-855-70-1 = "선생님이 계신다면요!"
10015-855-220-1 = "선생님!\n미션입니다, 미션!"
10015-855-230-1 = "네! 아리스는 언제나\n한결같은 선생님이,\n정말 좋습니다!"
10015-855-240-1 = "뽜밤뽜밤-!"
10015-855-250-1 = "선생님이\n보상을 획득했습니다!"
10015-855-260-1 = "멋집니다, 선생님!"
10015-855-270-1 = "하나하나\n해 나가는 겁니다!"
