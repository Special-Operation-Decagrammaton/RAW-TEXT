[translation]
10015-855-10-1 = "今日の任務は、\nなんでしょう？"
10015-855-20-1 = "あっ、お片づけは、\nアリスの\n担当でしたね……。"
10015-855-30-1 = "アーマーがなくても……。"
10015-855-40-1 = "たとえ、\n光の剣を失っても……。"
10015-855-50-1 = "それでも、\nアリスはアリスです。"
10015-855-60-1 = "みんなが\nいてくれるなら……\nそして。"
10015-855-70-1 = "先生がいてくれるなら！"
10015-855-220-1 = "先生！\nミッションです、ミッション！"
10015-855-230-1 = "はい！アリスは、\nいつも変わらない先生が、\n大好きです！"
10015-855-240-1 = "ぱんぱかぱーん！"
10015-855-250-1 = "先生が報酬を獲得しました！"
10015-855-260-1 = "すごいです、先生！"
10015-855-270-1 = "この調子で一歩ずつ、\n進んでいきましょう！"
