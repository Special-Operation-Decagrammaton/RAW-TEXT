[translation]
10015-855-10-1 = "งานของวันนี้\nคืออะไรเหรอคะ?"
10015-855-20-1 = "อ๊ะ อาริสึต้องเป็น\nคนจัดการให้นี่คะ..."
10015-855-30-1 = "ถึงจะไม่มีชุดเกราะ..."
10015-855-40-1 = "และต่อให้จะไม่มี\nดาบแห่งแสง..."
10015-855-50-1 = "แต่ยังไง\nอาริสึก็ยังเป็นอาริสึค่ะ"
10015-855-60-1 = "ตราบใดที่ได้อยู่กับทุกคน\nและก็"
10015-855-70-1 = "มีคุณครูอยู่ด้วยน่ะค่ะ!"
10015-855-220-1 = "คุณครู!\nภารกิจมาแล้วค่ะ ภารกิจ!"
10015-855-230-1 = "ค่ะ! อาริสึชอบคุณครูที่เสมอต้น\nเสมอปลายมากๆ เลยละค่ะ!"
10015-855-240-1 = "ปาปัม ปาปัม ป๊าม!"
10015-855-250-1 = "คุณครู\nได้รับรางวัลแล้วค่ะ!"
10015-855-260-1 = "เยี่ยมมากเลยค่ะ คุณครู!"
10015-855-270-1 = "ค่อยๆ ทำไป\nทีละอย่างนะคะ!"
