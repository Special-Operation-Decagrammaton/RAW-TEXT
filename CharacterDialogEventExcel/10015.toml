[translation]
10015-855-10-1 = "今天的任務，\n是什麼呢？"
10015-855-20-1 = "啊，整理是愛麗絲\n的工作呢……"
10015-855-30-1 = "就算沒有裝甲……"
10015-855-40-1 = "即使失去了\n光之劍……"
10015-855-50-1 = "即便如此，\n愛麗絲還是愛麗絲。"
10015-855-60-1 = "只要大家都在……\n然後。"
10015-855-70-1 = "老師也在的話！"
10015-855-220-1 = "老師！\n是任務，任務！"
10015-855-230-1 = "是！愛麗絲最喜歡\n始終如一的老師了！"
10015-855-240-1 = "乓啪喀乓──！"
10015-855-250-1 = "老師獲得了報酬！"
10015-855-260-1 = "真厲害，老師！"
10015-855-270-1 = "就這樣一步步\n繼續前進吧！"
