[translation]
16018-851-810-1 = "ครู รู้มั้ยว่านี่อะไร?"
16018-851-820-1 = "เหมือนตู้ขายสินค้าเลย..."
16018-851-830-1 = "น่าจะใช้ได้แค่\nเหรียญเฉพาะนะ"
16018-851-840-1 = "ก็นะ ไหนๆ ก็\nใช้ได้แต่ที่นี่แล้ว...\nงั้นก็ลองดูสักหน่อยแล้วกัน"
16018-851-850-1 = "เอ๋ จะปิดแล้วเหรอ\nใช้เหรียญที่มีให้หมดกันเถอะ"
16018-851-860-1 = "รูปที่ติดอยู่ข้างๆ...\nชุดเดียวกับ\nเด็กพวกนั้นเลยนี่นา?"
16018-851-870-1 = "คงไม่โผล่ออกมาจาก\nข้างในนี้หรอกเนอะ...?"
16018-851-880-1 = "ว้าว ระยิบระยับจัง...\nนี่คือการ์ดแรร์เหรอ?"
16018-851-890-1 = "ไม่ได้เห็นบ่อยๆ เลย\nเป็นการ์ดแรร์สินะ?"
16018-851-900-1 = "สีทองนี่นา ดีแน่เลย!\nหมุนไปอีกเยอะๆ เลยนะ!"
16018-851-910-1 = "ฮึ่ม ใบไหนดี\nใบไหนเกลือนะ...\nไม่เห็นจะรู้เลยสักนิด"
16018-851-920-1 = "สีดำนี่นา?\nเป็นสีที่ฉันชอบเลยละ!"
16018-851-930-1 = "แฮ่ก... แฮ่ก...\nพวกนั้นคือใครกันแน่น่ะ?!"
16018-851-940-1 = "สาวน้อยเวทมนตร์งั้นเหรอ?\nไม่ใช่เวทมนตร์จริงๆ ใช่มั้ย?!"
16018-851-950-1 = "ทะ... ทำอะไรน่ะ!\nรีบทำงานเข้าสิ!"
16018-851-960-1 = "(ครูเป็นคนดีเกินไป\nจนเป็นปัญหาแล้วเนี่ย)"
16018-851-970-1 = "นี่ ฉันจะบอกให้\nเพราะน่าจะยังไม่รู้นะ"
16018-851-980-1 = "ถ้าลูบหมวกกันน็อก\nมันจะหนวกหูน่ะ"
16018-851-990-1 = "......"
16018-851-1000-1 = "แค่นิดเดียวนะ\nจริงๆ เลยเชียว..."
16018-851-1010-1 = "ใช่แล้ว ต้องแบบนี้ละ!"
16018-851-1020-1 = "ยอดไปเลยนะ นี่ละใช่เลย!"
16018-851-1030-1 = "เสร็จงานวันนี้แล้ว!\nงานกล้วยๆ นะเนี่ย!"
16018-851-1040-1 = "งานแค่นี้น่ะหมูๆ!"
