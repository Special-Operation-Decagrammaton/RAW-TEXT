[translation]
16018-851-810-1 = "ねぇ先生、\nこれって何かわかる？"
16018-851-820-1 = "……自販機、\nに見えるんだけど。"
16018-851-830-1 = "専用のやつしか\n使えないみたいね。"
16018-851-840-1 = "まあ、これにしか\n使わないだろうし……\n試しに一回\n入れてみなさいよ。"
16018-851-850-1 = "あら、閉店時間みたい。\n残ってるやつは\n全部使っちゃいましょ。"
16018-851-860-1 = "横に貼ってあるこの絵……\nあの子たちと\n同じ服じゃない？"
16018-851-870-1 = "まさか中から\n不意打ちされたりとか\nしないわよね……？"
16018-851-880-1 = "うわ、キラキラしてる……\nこれって超レアって\nことかしら？"
16018-851-890-1 = "あんまり見かけない\nヤツね。レアなのかしら？"
16018-851-900-1 = "金色……ふふっ、\nなんか当たりっぽいわね！\nもっとあるかしら？"
16018-851-910-1 = "うぅ〜ん、どれがレアで\nどれがハズレなのか……\n全然分からないわ。"
16018-851-920-1 = "あっ、黒！\nうちの好きな色よ！"
16018-851-930-1 = "はぁっ、はぁっ……ちょっと、\nあんたら何者なのよ！？"
16018-851-940-1 = "魔法少女って……まさか\nホントに魔法を使えるとか\n言わないでしょうね！？"
16018-851-950-1 = "……って、何やってんのよ！\nさっさと自分の\n仕事しなさいっての！"
16018-851-960-1 = "（まったくもう……\n先生って人が良すぎるのが\n玉にキズなのよね……）"
16018-851-970-1 = "はぁ……知らないだろうから\n一応言っとくけど。"
16018-851-980-1 = "ヘルメットを触られると、\n音が反響してすごくうるさいの。"
16018-851-990-1 = "……"
16018-851-1000-1 = "ちょっとだけよ\n……まったく。"
16018-851-1010-1 = "これくらいもらわないと、\n割に合わないわよね！"
16018-851-1020-1 = "すごいじゃない！\nこういうのを待ってたのよ！"
16018-851-1030-1 = "はいっ、今日のノルマ終了！\n楽勝だったわね。"
16018-851-1040-1 = "この程度、\nうちにかかれば朝飯前よ♪"
