[translation]
16018-851-810-1 = "問你哦老師，\n你知道這是什麼嗎？"
16018-851-820-1 = "……看起來，像是\n自動販賣機的樣子。"
16018-851-830-1 = "好像只能用\n專用的代幣呢。"
16018-851-840-1 = "算了，反正也只能\n用在這裡……\n就試投一次看看吧。"
16018-851-850-1 = "哎呀，\n好像到關店時間了。\n把剩下的全部用掉吧。"
16018-851-860-1 = "旁邊貼的這張圖……\n不是跟那些孩子們\n一樣的衣服嗎？"
16018-851-870-1 = "應該不會從裡面\n突然跳出來偷襲吧……？"
16018-851-880-1 = "哇，在閃閃發亮……\n這是超級稀有的意思嗎？"
16018-851-890-1 = "是很少見到的東西呢。\n稀不稀有呢？"
16018-851-900-1 = "金色……呵呵，\n好像中獎了呢！\n還會有嗎？"
16018-851-910-1 = "唔嗯～哪個是稀有\n哪個是槓龜……\n完全搞不懂。"
16018-851-920-1 = "啊，黑色！\n是我喜歡的顏色！"
16018-851-930-1 = "哈啊，哈啊……不是，\n你們到底是誰啊！？"
16018-851-940-1 = "魔法少女……\n該不會跟我說你們\n真的會用魔法吧！？"
16018-851-950-1 = "……等等，在做什麼啦！\n快去做你們自己的工作！"
16018-851-960-1 = "（真是的……老師\n　美中不足的就是　人太好這點……）"
16018-851-970-1 = "唉……你可能不知道，\n所以姑且跟你說一聲。"
16018-851-980-1 = "頭盔被碰到的話，\n聲音會反射得超級吵。"
16018-851-990-1 = "……"
16018-851-1000-1 = "就一下下哦……真是的。"
16018-851-1010-1 = "要是不拿這些的話，\n就太不划算了呢！"
16018-851-1020-1 = "很厲害嘛！\n這就是我在等的哦！"
16018-851-1030-1 = "好，今天的額度結束！\n輕輕鬆鬆呢。"
16018-851-1040-1 = "這種程度，\n交給我就是小菜一碟啦♪"
