[translation]
16018-851-810-1 = "Sensei, do you know what this is?"
16018-851-820-1 = "...It looks like a vending machine..."
16018-851-830-1 = "Looks like it only takes exclusive medals."
16018-851-840-1 = "I guess that means we can only use it here... So let's give it a shot."
16018-851-850-1 = "Huh, it's closing time. Let's use all our medals and leave."
16018-851-860-1 = "That picture... Aren't those their outfits?"
16018-851-870-1 = "They're not going to pop out of the frame or anything, right...?"
16018-851-880-1 = "Whoa, it's shiny... Is this what they call super rare?"
16018-851-890-1 = "That one's hard to find. Is it rare?"
16018-851-900-1 = "It's gold, so I guess it's good! Let's pull a bunch more!"
16018-851-910-1 = "Ugh, I have no clue...as to what's good and what's not."
16018-851-920-1 = "Huh? Black? That's my favorite color!"
16018-851-930-1 = "*huff* *huff* ...Just what is their deal?!"
16018-851-940-1 = "Magical girls? They're not actually magic, right?!"
16018-851-950-1 = "Wh-What are you doing?! Go do your job already!"
16018-851-960-1 = "(Sensei, you're too good of a person.)"
16018-851-970-1 = "I'm telling you this because I don't think you know."
16018-851-980-1 = "But it's really loud for me whenever someone pats my helmet."
16018-851-990-1 = "..."
16018-851-1000-1 = "Only a little bit, then. ...Seriously."
16018-851-1010-1 = "Yeah, that's more like it!"
16018-851-1020-1 = "Great! This is it!"
16018-851-1030-1 = "That's it for today! Easy peasy!"
16018-851-1040-1 = "This is light work!"
