[translation]
10057-820-10-1 = "เชิญค่ะคุณครู ตายจริง...\nวันปีใหม่แบบนี้ก็ทำงานด้วยเหรอคะ?\nบางครั้งเวลาพักผ่อนก็สำคัญนะคะ"
10057-820-20-1 = "เอาละ มาดื่มชา\nกับฉันสักหน่อยนะคะ"
10057-820-30-1 = "ฮุฮุฮุ ได้เจอกับคุณครู\nตั้งแต่วันปีใหม่แบบนี้\nดีใจจังเลยค่ะ"
10057-820-40-1 = "ฉันน่ะ ไม่ว่าเมื่อไร\nก็เตรียมพร้อมเสมอค่ะ"
10057-820-50-1 = "ถึงสถานการณ์\nจะยุ่งยากนิดหน่อยก็เถอะค่ะ..."
10057-820-60-1 = "จิตใจที่ใฝ่หาอาหารเลิศรส\nของฉันไม่สั่นคลอน\nเพราะเรื่องแค่นี้หรอกค่ะ"
10057-820-70-1 = "ฉันหวังว่าทุกคน\nจะทำให้ดีที่สุด"
10057-820-80-1 = "ฉันจะชิมอาหารด้วยความจริงใจ\nและความกระตือรือร้นค่ะ"
10057-820-90-1 = "ถึงเวลาจะผ่านไป\nเรื่องราวต่างๆ ก็คงจะ\nถูกลืมใช่มั้ยคะ"
10057-820-100-1 = "แต่ถ้าฉันกับคุณครูจำได้...\nมันจะไม่เป็นอะไรค่ะ"
10057-820-110-1 = "ค่ะ ต้องไม่เป็นไรแน่ค่ะ"
10057-820-120-1 = "ฮุฮุฮุ\nเรียกฉันเหรอคะ คุณครู?"
10057-820-130-1 = "มาจักจี้ฉันแบบนั้นบ่อยๆ\nถ้าเครื่องติดมันจะลำบากนะคะ"
10057-820-140-1 = "ไม่นึกเลยนะคะว่า\nคุณครูจะชอบเล่นซุกซน\nแบบนี้น่ะค่ะ?"
10057-820-150-1 = "จริงอยู่ที่การใส่ฟุริโซเดะ\nก็มีเรื่องที่ยุ่งยากอยู่ค่ะ"
10057-820-160-1 = "แต่ว่านี่ก็เพื่อเส้นทาง\nของอาหารรสเลิศค่ะ"
10057-820-170-1 = "เพื่อเข้าถึงสุดยอดรสชาติ\nจะต้องเตรียมใจ ไม่หวั่นไหว\nกับอะไรทั้งนั้นค่ะ"
10057-820-180-1 = "ไม่ว่าใคร...\nก็ขัดขวางพวกเราไม่ได้ค่ะ\nฮุฮุฮุ"
10057-820-630-1 = "คุณครูเอง...\nก็มาเสี่ยงทายโอะมิกุจิเหรอคะ...?\nเชิญทางนี้เลยค่ะ"
10057-820-640-1 = "ฮุฮุฮุ\nไม่ต้องร้อนใจ\nขนาดนั้นก็ได้ค่ะ"
10057-820-650-1 = "ฮุฮุฮุ...\nฉันเพิ่งเคยทำงานแบบนี้เลยค่ะ"
10057-820-660-1 = "ไม่รู้ทำไม แต่สนุกมากเลยค่ะ"
10057-820-670-1 = "คุณครูคะ ถ้าโอะมิกุจิละก็...\nยังเสี่ยงทายได้อยู่นะคะ\nอย่าลืมมาเสี่ยงทายนะคะ"
10057-820-680-1 = "เจอของที่หาอยู่หรือยังคะ?"
10057-820-690-1 = "ฮุฮุฮุ ถ้าเป็นชิ้นนั้นละก็\nอาจจะอยู่ใกล้ๆ ก็ได้นะคะ?"
10057-820-700-1 = "การหายใจเข้าลึกๆ\nและทำใจเย็นๆ\nก็เป็นเรื่องสำคัญเหมือนกันนะคะ"
10057-820-710-1 = "ก็เหมือนกับขนมหวาน\nที่ทานในอาหารคอร์สค่ะ"
10057-820-720-1 = "ตายจริง โชคดีครั้งใหญ่เลยนี่คะ!\nสมกับที่เป็นคุณครูจริงๆ\nดวงดีสุดๆ ไปเลยละค่ะ!"
10057-820-730-1 = "ฉันเตรียมสินค้าพิเศษ\nเอาไว้ให้คุณครูที่เสี่ยงทาย\nได้โชคดีครั้งใหญ่แล้วค่ะ"
10057-820-740-1 = "ถ้าเสี่ยงทายได้โชคดีมาก\nแสดงว่าโชคกำลังมาแล้วค่ะ"
10057-820-750-1 = "ขอให้ปีนี้เป็นปีที่สุดปัง\nอีกหนึ่งปีนะคะ"
10057-820-760-1 = "โชคดีกลาง... ไม่เป็นไรนะคะ\nสินค้าสำหรับโชคดีกลาง อยู่ด้านนี้ค่ะ"
10057-820-770-1 = "โชคดีเล็ก...\nก็ไม่ได้แย่เลยนะคะ"
10057-820-780-1 = "ได้ยินว่าสิ่งสำคัญสำหรับ\nการเรียกโชคดีให้มาหา\nคือการรวบรวมสิ่งเล็กๆ ไว้ด้วยกันค่ะ"
10057-820-790-1 = "โชคดีนิดนึง... จะกลับมา\nเป็นโชคดีมากในภายหลังค่ะ..."
10057-820-800-1 = "โชคดีสินะคะ\nค่ะ เชิญทางนี้เลยค่ะ"
10057-820-810-1 = "ไม่เป็นไรค่ะ\nผลเสี่ยงทายโอะมิกุจิ\nคือการทำนายดวงปัจจุบันค่ะ"
10057-820-820-1 = "ในอนาคต...\nจะกลายเป็นโชคดีค่ะ..."
10057-820-830-1 = "...คะ? ได้รับการปลอบใจจากฉันแล้ว\nมันทั้งสุขและเศร้าเลยเหรอคะ...?\nคะ... คือว่าเรื่องนั้น..."
