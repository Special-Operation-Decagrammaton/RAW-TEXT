[translation]
10057-820-10-1 = "先生、おかえりなさいませ。\nあら…お正月も\nお仕事ですか？\n時には休憩も大切ですよ。"
10057-820-20-1 = "さあ、一緒に\nお茶を致しましょう。"
10057-820-30-1 = "うふふ、お正月から\nお会いできるとは、\nうれしい限りですわ。"
10057-820-40-1 = "私はいつでも\n準備できておりますよ？"
10057-820-50-1 = "少しばかり複雑な\n状況ではありますが…。"
10057-820-60-1 = "私の美食への思いは、\nこの程度で挫けたりなど\nいたしません。"
10057-820-70-1 = "各々が最善を\n尽くすことを願って。"
10057-820-80-1 = "熱意と誠意を込めて、\n味わわせて\nいただきましょう。"
10057-820-90-1 = "時の流れに従って、事件は\n忘れられることでしょう。"
10057-820-100-1 = "ですが、私と先生が\n覚えている限り…\n大丈夫ですわ。"
10057-820-110-1 = "ええ、きっと。"
10057-820-120-1 = "うふふ。\nお呼びですか、先生？"
10057-820-130-1 = "そう何度もくすぐられては\n困ってしまいますわ。"
10057-820-140-1 = "先生ったら、\n意外とイタズラが\nお好きなんですね？"
10057-820-150-1 = "たしかに振袖は、\n少々煩わしく\n思うところもあります。"
10057-820-160-1 = "ですが、これも\n全て美食の道へと\n通ずるのです。"
10057-820-170-1 = "究極の味に\nたどり着くためには、\n揺るぎない覚悟が\n必要なのです。"
10057-820-180-1 = "…誰にも私たちを\n止める事などできません。\nうふふっ。"
10057-820-630-1 = "先生も\nおみくじを引きに…？\nこちらですわ。"
10057-820-640-1 = "うふふっ、\nそんなに焦らなくても\n大丈夫ですよ。"
10057-820-650-1 = "うふふっ…\nこのようなこと、初めて\n体験いたしましたわ。"
10057-820-660-1 = "なんだか楽しいですわね。"
10057-820-670-1 = "先生、おみくじでしたら、\nまだ受け付けておりますよ。\n忘れずにお引きくださいね。"
10057-820-680-1 = "探し物は\n見つかりましたか？"
10057-820-690-1 = "うふふ、\n意外と身近なところに\nあるかもしれませんわよ？"
10057-820-700-1 = "落ち着いて、\n呼吸を整える\n時間も大切ですわ。"
10057-820-710-1 = "コース料理で頂く\nグラニテのように。"
10057-820-720-1 = "あら、大吉ですわ！\n流石先生、\n運も持っていますのね！"
10057-820-730-1 = "大吉を引いた先生には、\n特別な商品を\nご用意しておりますわ。"
10057-820-740-1 = "吉とは運が\n回ってきていますわね。"
10057-820-750-1 = "今年も素敵な\n一年になるよう、\n願っておりますわ。"
10057-820-760-1 = "中吉…\nなかなか良いですわね。\nこちらが中吉の商品です。"
10057-820-770-1 = "小吉…\n悪くはありませんわね。"
10057-820-780-1 = "福を呼び込むには、\n小さな積み重ねが\n大切と申しますもの。"
10057-820-790-1 = "末吉は、\n後に吉と転じる兆し…。"
10057-820-800-1 = "つまり、吉兆ですわね。\nはい、こちらをどうぞ。"
10057-820-810-1 = "大丈夫ですわ。\nおみくじの結果は\n現在の運勢ですもの。"
10057-820-820-1 = "今後、福に転じるとも\n申しますから…"
10057-820-830-1 = "…え？私に慰められると、\nうれしいような\n悲しいような…？\nそ、それは一体…"
