[translation]
10057-820-10-1 = "Welcome, Sensei. Oh my... You're working on New Year's Day? Don't forget to take a break sometimes."
10057-820-20-1 = "Now then, let's enjoy a cup of tea together."
10057-820-30-1 = "Heehee. It's nice to see you this New Year's Day."
10057-820-40-1 = "Don't you know? I'm always prepared."
10057-820-50-1 = "The circumstances are a little complicated, but..."
10057-820-60-1 = "...My passion for fine dining won't be impeded by something like this."
10057-820-70-1 = "I hope we all do our best."
10057-820-80-1 = "I taste food using every ounce of my passion and sincerity."
10057-820-90-1 = "Time marches on...and memories fade."
10057-820-100-1 = "But as long as you and I remember... It'll all be okay."
10057-820-110-1 = "Yes, I'm certain."
10057-820-120-1 = "Heeheehee. Did you call me, Sensei?"
10057-820-130-1 = "Please refrain from tickling me like that."
10057-820-140-1 = "I didn't know you enjoyed goofing off like that, Sensei."
10057-820-150-1 = "Furisodes can be a bit inconvenient, to be sure."
10057-820-160-1 = "But one must have proper dress when fine dining."
10057-820-170-1 = "To craft the ultimate flavor, one must have an unflinching resolve."
10057-820-180-1 = "...No one will be able to stop us. Heeheehee."
10057-820-630-1 = "Sensei, are you here to pick an omikuji too? This way."
10057-820-640-1 = "Heeheehee. You don't have to be so tense."
10057-820-650-1 = "Heeheehee... It's my first time doing something like this."
10057-820-660-1 = "It's kind of fun."
10057-820-670-1 = "Sensei, they're still serving omikuji. Please don't forget to pick one out."
10057-820-680-1 = "Did you find what you were looking for?"
10057-820-690-1 = "Heeheehee... Maybe it's closer than you think."
10057-820-700-1 = "It's important to take it easy sometimes."
10057-820-710-1 = "It's like having a little granita with your full course meal."
10057-820-720-1 = "Oh, you drew the great blessing! You're quite lucky, Sensei! As to be expected."
10057-820-730-1 = "I prepared a special gift for drawing a great blessing, Sensei."
10057-820-740-1 = "You drew a blessing. That means some good luck is coming your way."
10057-820-750-1 = "I hope you have a happy New Year."
10057-820-760-1 = "...You got a modest blessing. Here's your prize."
10057-820-770-1 = "A small blessing... That's not too bad."
10057-820-780-1 = "To bring great luck, they say you need to work on the small things first."
10057-820-790-1 = "A future blessing means you're likely to be lucky down the road..."
10057-820-800-1 = "That's a good sign. All right then, this way."
10057-820-810-1 = "It's okay. The result of the omikuji only shows your current luck."
10057-820-820-1 = "It could turn into good fortune later..."
10057-820-830-1 = "Huh? You feel happy and sad at the same time, because I comforted you? I-I don't understand..."
