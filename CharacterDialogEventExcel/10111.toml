[translation]
10111-843-180-1 = "เฮ้! ครู!\nทางนี้ ทางนี้!"
10111-843-190-1 = "โธ่ ครู\nทำไมมาช้าแบบนี้เนี่ย?"
10111-843-200-1 = "เอาละๆ!\nตั้งสติเข้า!"
10111-843-210-1 = "ทนอีกหน่อยนะ"
10111-843-220-1 = "ไว้เสร็จงานแล้ว\nฉันจะมาเล่นด้วย!"
10111-843-230-1 = "ฮ่า! สนุกจังเลยเนอะ\nว่ามั้ย?"
10111-843-240-1 = "หืม? เรียกฉันเหรอ?\nถ้าเรียกมาแล้วก็ต้องพูดสิ"
10111-843-250-1 = "หืม? แค่ลองจิ้มดูงั้นเหรอ?\nอะไรของเค้าเนี่ย..."
10111-843-260-1 = "เฮ้อ... ทำตัว\nเหมือนเป็นเด็กไปได้"
10111-843-270-1 = "ฉันจะจำไว้นะ\nต่อไปฉันจะมาจิ้มบ้าง\nเตรียมตัวโดนไว้เลย"
