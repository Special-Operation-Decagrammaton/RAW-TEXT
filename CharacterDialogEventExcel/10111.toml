[translation]
10111-843-180-1 = "여! 선생!\n여기야, 여기!"
10111-843-190-1 = "아, 선생!\n왜 이렇게 늦었어?"
10111-843-200-1 = "자, 자!\n정신 바짝 차리자고!"
10111-843-210-1 = "조금만 참아,"
10111-843-220-1 = "다 끝나면\n놀아줄 테니까!"
10111-843-230-1 = "하-! 나름대로\n재밌었어, 그렇지?"
10111-843-240-1 = "어? 불렀어?\n불렀으면 말을 해야\n할 거 아냐."
10111-843-250-1 = "아앙? 그냥 한 번\n찔러봤다고?\n그건 또 무슨……."
10111-843-260-1 = "…하아, 어린애 같은\n짓하고 말이야."
10111-843-270-1 = "기억해 두겠어.\n다음엔 내가 찌를\n테니까, 각오하라고."
