[translation]
10111-843-180-1 = "よお、先生！\nこっち、こっち！"
10111-843-190-1 = "あ、先生じゃん！\n遅いぞ！"
10111-843-200-1 = "ほら、気をしっかり\n持ってくれ！"
10111-843-210-1 = "あとちょっとだろ？"
10111-843-220-1 = "終わったら\n遊んでやるから、\nちったあ我慢しな！"
10111-843-230-1 = "はぁー！楽しかった！\n先生はどうだった？"
10111-843-240-1 = "なんだ？\n用事があるなら\nさっさと言ってくれ。"
10111-843-250-1 = "はぁ？\nつついてみただけ？\nなんだそりゃ"
10111-843-260-1 = "……はぁ、ガキみてぇな\nことしやがって。"
10111-843-270-1 = "ははっ！\n次はあたしの番だからな。\n覚悟しとけよ。"
