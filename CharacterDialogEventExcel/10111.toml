[translation]
10111-843-180-1 = "Yo! Sensei! Here, over here!"
10111-843-190-1 = "Sensei! What took you so long?"
10111-843-200-1 = "Now, now! Stay focused!"
10111-843-210-1 = "Hold on just a little longer..."
10111-843-220-1 = "I'll play with you when I'm done!"
10111-843-230-1 = "Ha! It was fun, right?"
10111-843-240-1 = "Huh? You called? If you did, you ought to say something."
10111-843-250-1 = "Huuuh? You just poked me for the sake of poking me? What does that even...?"
10111-843-260-1 = "*sigh* So childish."
10111-843-270-1 = "I'll remember this. I'll be the one to poke next time, so brace yourself."
