[translation]
20051-851-180-1 = "先生！\nこっちです！こっち！"
20051-851-190-1 = "ふふっ、私の速さに\n目が追いつかな\nかったんですね？"
20051-851-200-1 = "自警団のスーパーマジカル\nウォーリアー！"
20051-851-210-1 = "テルミット～\n……ピンク！です！"
20051-851-220-1 = "うわあ！お客さんが\nいっぱいですね！"
20051-851-230-1 = "ふっふっふ……誰も\n気づいていないよう\nですね……。"
20051-851-240-1 = "平凡な私が、実は自警団の\nスーパーエースであり、"
20051-851-250-1 = "魔法少女で\nあることをっ……！"
20051-851-260-1 = "変身は\n解けちゃいましたけど……"
20051-851-270-1 = "魔法は終わりません！\nえへへっ！"
20051-851-280-1 = "はい！\nテルミットピンクです！\n宇沢レイサでもあります！"
20051-851-290-1 = "ふふっ、\nずっと練習してきた\n変身のポーズを……"
20051-851-300-1 = "ここでお見せしましょう！\nまずは………"
20051-851-310-1 = "ひゃあっ！？"
20051-851-320-1 = "い、いま……知り合いと\n目があった気が……。"
20051-851-330-1 = "これですか？テルミット\nピンクのステッキです！"
20051-851-340-1 = "公式のステッキは\nちょっと高くて……"
20051-851-350-1 = "なので、自前のものを\nデコってみました！"
20051-851-360-1 = "テルミットピンク！変身！"
20051-851-370-1 = "さあ！平和を\n守りに行きましょう！"
20051-851-470-1 = "シュルル～\nシャキーンシャキーン！！\nキラッ！"
20051-851-480-1 = "ようこそ！\nマジカル市場へ！"
20051-851-490-1 = "半額シールはないですよ！？\nここはスーパーじゃ\nありませんから！"
20051-851-500-1 = "あ、この服は\n売り物じゃないですよ！\n一着しかないので！"
20051-851-510-1 = "お土産屋さんみたいで、\n楽しいですね！"
20051-851-520-1 = "取引……すなわち、\n契約を交わすということ！"
20051-851-530-1 = "これが大人の財力……！\nヒーローみたいです！"
20051-851-540-1 = "それ、なんだか\nマジカルアイテムみたいです！"
20051-851-550-1 = "マジカル・ショッピング！\nですね！"
20051-851-680-1 = "わあっ！これは！カードが\n引けるやつですね！\nすごく懐かしいです！"
20051-851-690-1 = "こう！ガコガコッ！\nと回せばいいんですよ！"
20051-851-700-1 = "こういうの、\nまだ残っていたんですね！"
20051-851-710-1 = "さあ先生！\n早く回しましょう！"
20051-851-720-1 = "さあ、残った分ぜ～んぶ\n使って回しましょう！"
20051-851-730-1 = "何が出るんでしょう！\n楽しみです！"
20051-851-740-1 = "ここ、すごく素敵ですね！\nここが私の家だったら\nいいのに……！"
20051-851-750-1 = "ああっ！それは！\nウルトラレア！？"
20051-851-760-1 = "私も一度しか引いた\nことがない、\n超！レアカードですよ！？"
20051-851-770-1 = "おおっ！\nスーパーレア！あまり\n見かけないんですよ！"
20051-851-780-1 = "ゴールド！！いいですね！\nキラキラしています！"
20051-851-790-1 = "ああっ、ああ……。"
20051-851-800-1 = "それはハズレ\nカードですね！私も\n実物は初めて見ます！"
