[translation]
20051-851-180-1 = "Sensei! Here, over here!"
20051-851-190-1 = "Fufu, I suppose you couldn't keep up with how fast I was?"
20051-851-200-1 = "The Vigilante Crew's super-magical warrior!"
20051-851-210-1 = "Thermite Pink is here!"
20051-851-220-1 = "Whoa! There are so many guests!"
20051-851-230-1 = "Fufufu... I don't think anyone's noticed yet..."
20051-851-240-1 = "That an ordinary person like me was actually the Vigilante Crew's super ace..."
20051-851-250-1 = "...and a magical girl!"
20051-851-260-1 = "The transformation is over..."
20051-851-270-1 = "...but magic isn't! Eheehee!"
20051-851-280-1 = "Yes! Thermite Pink here! Also known as Uzawa Reisa!"
20051-851-290-1 = "Fufu, I'll show you my transformation pose..."
20051-851-300-1 = "I've been practicing! For starters..."
20051-851-310-1 = "Kyaaah?!"
20051-851-320-1 = "I-I feel like I just made eye contact with someone I know..."
20051-851-330-1 = "This? It's Thermite Pink's magic wand!"
20051-851-340-1 = "The official wand is a bit pricy..."
20051-851-350-1 = "So I tried decorating it with stuff I have at home!"
20051-851-360-1 = "Thermite Pink! Transformation!"
20051-851-370-1 = "Now! Let's go protect peace!"
20051-851-470-1 = "Swoosh! Bam-bam!! Sparkle!"
20051-851-480-1 = "Welcome to the magic store!"
20051-851-490-1 = "We don't have half-off stickers, okay?! This isn't a supermarket!"
20051-851-500-1 = "This outfit is not for sale! I have no extras!"
20051-851-510-1 = "This feels nice. It's just like a souvenir shop!"
20051-851-520-1 = "Exchange... In other words, making a contract!"
20051-851-530-1 = "So this is the adult's wealth...! Like a hero!"
20051-851-540-1 = "This feels like a magic item for some reason!"
20051-851-550-1 = "So it's magical shopping!"
20051-851-680-1 = "Whoa! This is...! It's the thing you use to pull cards! I haven't seen one in so long!"
20051-851-690-1 = "You insert a medal, like this! And clink! Clank! There you go!"
20051-851-700-1 = "They still had these machines here!"
20051-851-710-1 = "All right, Sensei! Let's give it a spin!"
20051-851-720-1 = "Let's put in all the remaining medals and spin!"
20051-851-730-1 = "I wonder what we'll get! I'm excited!"
20051-851-740-1 = "This place is incredible! I wish this was my home...!"
20051-851-750-1 = "Aah!! Isn't that an ultra-rare one?!"
20051-851-760-1 = "I only pulled that once in my life before. It's a super-rare card!"
20051-851-770-1 = "Ooh! A super-rare card! These are hard to find!"
20051-851-780-1 = "Gold! That's nice! It's shiny!"
20051-851-790-1 = "Ah, ah..."
20051-851-800-1 = "That's a dud! This is actually my first time seeing one too!"
