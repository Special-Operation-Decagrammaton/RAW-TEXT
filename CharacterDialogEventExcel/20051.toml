[translation]
20051-851-180-1 = "คุณครู!\nตรงนี้ค่ะ ตรงนี้!"
20051-851-190-1 = "ฮุฮุ ฉันเร็วเกิน\nจนตามไม่ทันสินะคะ?"
20051-851-200-1 = "ซูเปอร์ เมจิคัล วอริเออร์\nแห่งกลุ่มรักษาความสงบ!"
20051-851-210-1 = "เทอร์ไมต์ พิงค์เองค่ะ!"
20051-851-220-1 = "ว้าวว!\nมีคนมาเที่ยวเยอะจังเลยค่ะ!"
20051-851-230-1 = "ฮุฮุฮุ... เหมือนจะไม่มีใคร\nสังเกตได้เลยนะคะ..."
20051-851-240-1 = "ว่าฉันที่ธรรมดาคนนี้\nที่จริงเป็นซูเปอร์เอซ\nของกลุ่มรักษาความสงบ"
20051-851-250-1 = "และเป็นสาวน้อย\nเวทมนตร์ด้วย...!"
20051-851-260-1 = "ถึงจะกลับร่างเดิมแล้ว"
20051-851-270-1 = "แต่เวทมนตร์ก็ยัง\nไม่หมดหรอกนะคะ! ฮิฮิฮิ!"
20051-851-280-1 = "ค่ะ! เทอร์ไมต์ พิงค์เองค่ะ!\nรู้จักกันในชื่อ\nอุซาวะ เรอิสะด้วยค่ะ!"
20051-851-290-1 = "ฮุฮุ ท่าโพสตอนแปลงร่าง\nที่ฉันหมั่นฝึกซ้อมมา..."
20051-851-300-1 = "ฉันจะโชว์ให้เห็นที่นี่ค่ะ!\nก่อนอื่นก็..."
20051-851-310-1 = "อ๊าย!?"
20051-851-320-1 = "มะ... เมื่อกี้เหมือน\nได้สบตากับ\nคนที่รู้จักเลย..."
20051-851-330-1 = "อันนี้น่ะเหรอคะ? ไม้กายสิทธิ์ของ\nเทอร์ไมต์ พิงค์ยังไงล่ะคะ!"
20051-851-340-1 = "แท่งไฟออฟฟิเชียล\nมันค่อนข้างแพง..."
20051-851-350-1 = "ฉันก็เลยเอาอันที่มีที่บ้าน\nมาตกแต่งดูค่ะ!"
20051-851-360-1 = "เทอร์ไมต์ พิงค์! เปลี่ยนร่าง!"
20051-851-370-1 = "เอาละ! ไปรักษาความสงบสุขกันค่ะ!"
20051-851-470-1 = "ชูรูรู ปาปัมปาป๊าม!!!\nวิ้งวับ!"
20051-851-480-1 = "เชิญเข้าสู่ตลาดเวทมนตร์ค่ะ!"
20051-851-490-1 = "ไม่มีสติกเกอร์ครึ่งราคาหรอกค่ะ!\nที่นี่ไม่ใช่ซูเปอร์มาร์เก็ตนะคะ!"
20051-851-500-1 = "ชุดนี้ไม่ขายค่ะ!\nพอดีไม่มีสำรองน่ะค่ะ!"
20051-851-510-1 = "ดีจังเลยนะคะ เหมือนร้านขายของที่ระลึกเลย!"
20051-851-520-1 = "การซื้อขาย...\nก็คือการทำสัญญา!"
20051-851-530-1 = "นี่สินะความร่ำรวยของผู้ใหญ่...!\nเหมือนฮีโร่เลยค่ะ!"
20051-851-540-1 = "รู้สึกเหมือนเป็นไอเทมเวทมนตร์เลยนะคะ!"
20051-851-550-1 = "นี่ก็คือเมจิคัล ช็อปปิ้ง! สินะคะ!"
20051-851-680-1 = "ว้าว! นี่มัน!\nเกมเลือกการ์ดนี่คะ!\nไม่ได้เล่นมานานมากเลยค่ะ!"
20051-851-690-1 = "ใส่เหรียญเข้าไป\nแล้วก็หมุน! ครืดด! กึก!\nเท่านี้เองค่ะ!"
20051-851-700-1 = "ยังมีเครื่องแบบนี้\nอยู่อีกสินะคะเนี่ย!"
20051-851-710-1 = "เอาละ คุณครู!\nรีบหมุนดูสิคะ!"
20051-851-720-1 = "เอาละ ใส่เหรียญที่เหลือ\nให้หมด แล้วหมุนเลยค่ะ!"
20051-851-730-1 = "จะได้อะไรคะ!\nอยากรู้จังเลยค่ะ!"
20051-851-740-1 = "ที่นี่ยอดเยี่ยมจังเลยนะคะ!\nอยากให้ที่นี่\nเป็นบ้านของฉันจัง...!"
20051-851-750-1 = "อ๊ะ!! นี่มัน\nอัลตราแรร์!?"
20051-851-760-1 = "ฉันก็เพิ่งเคยหมุนออก\nแค่ครั้งเดียวเหมือนกันค่ะ\nเป็นการ์ดที่แรร์มากๆ เลยนะคะ!"
20051-851-770-1 = "โอ้ว! ซูเปอร์แรร์ค่ะ!\nหาไม่ได้ง่ายๆ เลยนะคะ!"
20051-851-780-1 = "โกลด์! ดีเลยค่ะ!\nวิบวับวิบวับเลย!"
20051-851-790-1 = "อ๊ะ... อ่า..."
20051-851-800-1 = "แบบนั้นคือการ์ดเน่าค่ะ!\nฉันเองก็เพิ่งเคย\nเห็นของจริงค่ะ!"
