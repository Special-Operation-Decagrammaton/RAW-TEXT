[translation]
10117-846-10-1 = "歡迎～"
10117-846-20-1 = "準備完畢～"
10117-846-30-1 = "老師～大危機～"
10117-846-40-1 = "Help me～\n快幫幫我～"
10117-846-50-1 = "發車準備～\n沒有問題～"
10117-846-60-1 = "老師～要加速囉～"
10117-846-70-1 = "已經結束了～？\n還想再玩～"
10117-846-80-1 = "真開心呢～\n再一起玩吧。"
10117-846-90-1 = "咦～？\n想跟光一起玩嗎？"
10117-846-100-1 = "好癢哦～"
10117-846-110-1 = "嗚嗚，我要報仇～！"
10117-846-120-1 = "請給我摸摸，\n誇誇我嘛～"
10117-846-130-1 = "誇誇我～雖然我\n什麼都沒做就是了。"
10117-846-140-1 = "要吃點心嗎～？\n等一下哦～"
10117-846-150-1 = "啊……全部都\n被我吃光了……\nSorry～"
10117-846-510-1 = "Train shop～\n想要什麼呀～？"
10117-846-520-1 = "歡迎光臨～\n歡迎參觀～是這樣嗎？"
10117-846-530-1 = "路線會一直延續下去哦～\n商店也一起～"
10117-846-540-1 = "推薦？唔嗯……"
10117-846-550-1 = "要自己選才對～"
10117-846-560-1 = "光也想玩，但在忍耐～\n老師也忍耐一下吧～"
10117-846-570-1 = "哦～那個很棒吧～"
10117-846-580-1 = "真有品味～咻～咻～"
10117-846-590-1 = "老師，真聰明～"
10117-846-600-1 = "也買給光！也買給光嘛！"
