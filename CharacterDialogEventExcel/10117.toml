[translation]
10117-846-10-1 = "ようこそー"
10117-846-20-1 = "じゅんびかんりょー"
10117-846-30-1 = "せんせーぴんち！"
10117-846-40-1 = "へるぷみー、たすけてー"
10117-846-50-1 = "走行準備ー、\n問題なーし。"
10117-846-60-1 = "せんせー\nスピード上げるよー。"
10117-846-70-1 = "もう終わりー？\nもっと遊びたいー。"
10117-846-80-1 = "楽しかったねー\nまたあそぼ。"
10117-846-90-1 = "えー？\nヒカリとあそびたいの？"
10117-846-100-1 = "くすぐったーいー。"
10117-846-110-1 = "ううー\nやりかえしてやるー！"
10117-846-120-1 = "なでなでプリーズ、\nほめてほめてー"
10117-846-130-1 = "ほめてー……\n何もしてないけど。"
10117-846-140-1 = "お菓子たべるー？\nちょっとまってねー"
10117-846-150-1 = "あー……\n全部食べちゃった……\nソーリー"
10117-846-510-1 = "トレインショップー\nなにがほしいー？"
10117-846-520-1 = "いらっしゃーい。\nみていってくださーい、\nだって？"
10117-846-530-1 = "線路はどこまでも\nつづくーよー\nお店もいっしょー"
10117-846-540-1 = "おすすめ？うーん……"
10117-846-550-1 = "自分で選ぶのだー"
10117-846-560-1 = "ヒカリも遊びたいけど\nがまんしてるー\nせんせーもがまんしてー"
10117-846-570-1 = "おー、それいいよねー"
10117-846-580-1 = "センスあるー\nひゅーひゅー"
10117-846-590-1 = "せんせい、\nかしこーい。"
10117-846-600-1 = "ヒカリのぶんも！\nヒカリのぶんも！"
