[translation]
10117-846-10-1 = "เข้ามาสิ คุณครู"
10117-846-20-1 = "ฮิคาริพร้อมแล้ว"
10117-846-30-1 = "คุณครู งานเข้าแล้ว"
10117-846-40-1 = "ช่วยด้วย เฮลป์มี..."
10117-846-50-1 = "เตรียมเดินรถ ไร้ปัญหา"
10117-846-60-1 = "ว่าไงล่ะ คุณครู?\nไปซิ่งกันเลยมั้ย?"
10117-846-70-1 = "เกือบจบแล้วสินะ\nอยากเล่นต่อจัง"
10117-846-80-1 = "สนุกใช่มั้ยล่ะ?\nไว้มาเล่นกันอีกนะ คุณครู"
10117-846-90-1 = "หืม? ทำไมเหรอ?\nอยากเล่นกับฮิคาริเหรอ?"
10117-846-100-1 = "จั๊กจี้นะ"
10117-846-110-1 = "ฮึ่ม จะแก้แค้นเลยคอยดู"
10117-846-120-1 = "ลูบหัวให้หน่อย พลีส\nชมฮิคาริหน่อย"
10117-846-130-1 = "ถึงจะไม่ได้ทำอะไรเลย\nแต่ก็ชมกันหน่อยนะ"
10117-846-140-1 = "เอาของว่างมั้ย? เดี๋ยวนะ..."
10117-846-150-1 = "อ่า... กินหมดไปแล้ว... ซอรี่"
10117-846-510-1 = "มีของที่อยากได้มั้ย?\nลองเลือกดูสิ"
10117-846-520-1 = "เชิญเลย\nอยากซื้ออะไรเหรอ?"
10117-846-530-1 = "ทางรถไฟเชื่อมกันหมดนั่นละ\nร้านก็เปิดให้ตลอดเหมือนกัน"
10117-846-540-1 = "ให้แนะนำเหรอ? อืม..."
10117-846-550-1 = "ไม่เอา ต้องเลือกเองสิ"
10117-846-560-1 = "ฮิคาริก็อยากไปเล่นเหมือนกัน\nแต่ฮึบไว้อยู่น่ะ ครูก็ฮึบไว้นะ"
10117-846-570-1 = "โอ้ อันนี้ดีเลย"
10117-846-580-1 = "เซนส์ดีนะเนี่ย ฮุฮุ"
10117-846-590-1 = "เลือกของดีเลยนะ\nคุณครูฉลาดจริงๆ"
10117-846-600-1 = "จะซื้อให้ฮิคาริด้วยเหรอ?"
