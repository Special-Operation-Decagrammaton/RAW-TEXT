[translation]
10117-846-10-1 = "Welcooome, Sensei."
10117-846-20-1 = "Hikari is ready."
10117-846-30-1 = "Sensei. Emergency."
10117-846-40-1 = "Help Hikari. Heeelp."
10117-846-50-1 = "Operation preparations. No issue."
10117-846-60-1 = "How is it, Sensei? Should we go...faaaster?"
10117-846-70-1 = "It's almost over. Hikari wanted to play more."
10117-846-80-1 = "Had fun? Let's play again, Sensei."
10117-846-90-1 = "Hm? Why? You wanna play with Hikari?"
10117-846-100-1 = "Tiiickles. Tickle."
10117-846-110-1 = "Boo. Hikari will get reveeenge."
10117-846-120-1 = "Head pats, please. Compliment Hikari."
10117-846-130-1 = "Nope. Didn't do anything. But still. Gimme."
10117-846-140-1 = "Want snacks? Hold on..."
10117-846-150-1 = "Ah... Hikari ate them all. Sooorry."
10117-846-510-1 = "Is there anything you need? Pick, piiick."
10117-846-520-1 = "Welcome. What do you want to buy?"
10117-846-530-1 = "Railroad tracks go everywhere. Like the shop."
10117-846-540-1 = "Hikari? Recommend? Umm..."
10117-846-550-1 = "No. You have to choose."
10117-846-560-1 = "Hikari wants to play. But holding back. So you have to, too, Seeensei."
10117-846-570-1 = "Oh. That's good."
10117-846-580-1 = "You have...good taste! Hu hu."
10117-846-590-1 = "Good choice. Smart Sensei."
10117-846-600-1 = "Are you buying something for Hikari too?"
