[translation]
16017-846-330-1 = "き、来てくださり\nありがとう\nございます……。"
16017-846-340-1 = "お、大人が一緒に\nいてくださると……\n安心、します。"
16017-846-350-1 = "いつもはこうじゃ\nないんですけどっ！\n今回が特殊なだけで……。"
16017-846-360-1 = "あー……いえ、そうでも\nないかもしれないですけ\nど……。"
16017-846-370-1 = "で、でも\n修羅場ってほどじゃないし…\nたぶん……知りませんけど。"
16017-846-380-1 = "うう……な、なんだか\n面倒なことになってる\n気がするんですけど……。"
16017-846-390-1 = "幹部の皆さん……信じて\n大丈夫なんですよね…？"
16017-846-400-1 = "ふぅ……\nこ、ここまで来たら、\nもう大丈夫ですよね……？"
16017-846-410-1 = "はぁ……\nやっと終わり\nましたけど……。"
16017-846-420-1 = "先生も本当に……\nお疲れさまでした。"
16017-846-430-1 = "な、なんですか？"
16017-846-440-1 = "えっ……も、もしかして\n私何かしました……？"
16017-846-450-1 = "く、雲行きが\n怪しいんですけどぉ…。"
16017-846-460-1 = "何事もないと\nいいんですけど……。"
16017-846-470-1 = "ど、どうして幹部連中って\nあんなんばっかなん\nですか……。"
16017-846-480-1 = "現場の事なんか\n全然見てないん\nですけど……。"
16017-846-490-1 = "……ど、\nどうしたんですか？"
16017-846-500-1 = "く、\nくすぐったいんですけど…\nそこ、あんまり…ひゃっ"
16017-846-720-1 = "本当に終わる\n気がしないんですけど……。"
16017-846-730-1 = "せ、先生がいてくれて、\nよかったです……"
16017-846-740-1 = "心強いっていうか……\n安心できるっていうか……"
16017-846-750-1 = "えへへ。"
16017-846-760-1 = "さ、触ってもなんも\nないんですけどっ！？"
16017-846-770-1 = "ど、どうにかしないと……\nうう……。"
16017-846-780-1 = "わ、わあ…… ！"
16017-846-790-1 = "す、すご\nすぎるんですけど！？"
