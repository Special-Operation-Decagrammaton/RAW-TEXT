[translation]
16017-846-330-1 = "Sensei... Thank you for coming..."
16017-846-340-1 = "I-It feels reassuring to have an adult around..."
16017-846-350-1 = "H-Highlander isn't always like this...! It's just that this time, it's..."
16017-846-360-1 = "W-Well, actually, it is like this most of the time..."
16017-846-370-1 = "B-But it's not always a total disaster. Maybe... I'm not sure."
16017-846-380-1 = "Ugh... I-It feels like this situation is becoming very annoying..."
16017-846-390-1 = "I'm not sure if I can trust the officers... Umm..."
16017-846-400-1 = "Phew... B-But it seems like things are wrapping up okay..."
16017-846-410-1 = "I-It's over...somehow..."
16017-846-420-1 = "Thank you for your h-hard work, Sensei..."
16017-846-430-1 = "Wh-What is it..."
16017-846-440-1 = "Eh... D-Did I do something wrong...?"
16017-846-450-1 = "I-I have a bad feeling..."
16017-846-460-1 = "Everything will be okay, right...?"
16017-846-470-1 = "Wh-Why are all our officers like that...?"
16017-846-480-1 = "They don't understand the pain of us technicians..."
16017-846-490-1 = "...Wh-Why are you doing this...?"
16017-846-500-1 = "It tickles... That's my weak spot..."
16017-846-720-1 = "I-It feels like there's still lots left over..."
16017-846-730-1 = "S-Sensei... I'm glad you're here."
16017-846-740-1 = "I guess I feel reassured...or perhaps relieved..."
16017-846-750-1 = "Heehee."
16017-846-760-1 = "E-Even if you poke me like that... I-It won't trigger a help menu or anything like that..."
16017-846-770-1 = "I-I need to do something... Ughhh..."
16017-846-780-1 = "W-Whoa..."
16017-846-790-1 = "I-It wasn't an easy task..."
