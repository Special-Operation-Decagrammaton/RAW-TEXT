[translation]
16017-846-330-1 = "คุณครู...\nขอบคุณที่มานะคะ..."
16017-846-340-1 = "ถะ... ถ้ามีผู้ใหญ่อยู่ด้วย\nก็จะวางใจได้น่ะค่ะ..."
16017-846-350-1 = "ทะ... ที่ไฮแลนเดอร์\nไม่ได้เป็นแบบนี้ตลอด\nหรอกค่ะ แค่ครั้งนี้มัน..."
16017-846-360-1 = "มะ... ไม่สิ\nส่วนใหญ่ก็เป็นอย่างนั้นนะ..."
16017-846-370-1 = "ตะ... แต่ถึงยังไง\nก็ไม่ถึงกับอลหม่านหรอกค่ะ\nน่าจะ... นะคะ"
16017-846-380-1 = "ฮือ... ระ... รู้สึกว่า\nจะเป็นงานที่น่ารำคาญ\nเอามากๆ เลยค่ะ..."
16017-846-390-1 = "ฉันจะเชื่อพวกผู้บริหารได้มั้ยนะ...\nอืม..."
16017-846-400-1 = "ฮู่ว... ตะ... แต่ถึงยังไง\nก็รู้สึกเหมือน\nใกล้จะเสร็จแล้วนะคะ..."
16017-846-410-1 = "ทะ... ทำสำเร็จจนได้ค่ะ..."
16017-846-420-1 = "คุณครูก็ทำได้\nดะ... ดีมากเลยค่ะ..."
16017-846-430-1 = "มะ... มีเรื่องอะไรเหรอคะ...?"
16017-846-440-1 = "เอ๋... ระ... หรือว่า\nฉันทำอะไรลงไปเหรอคะ...?"
16017-846-450-1 = "ทะ... ทำไม\nลางสังหรณ์ไม่ดีเลย..."
16017-846-460-1 = "คงไม่มีอะไรใช่มั้ยคะ...?"
16017-846-470-1 = "คะ... คนที่เป็นผู้บริหาร\nทำไมเป็นแบบนั้นกันหมดนะ..."
16017-846-480-1 = "ไม่รู้กันเลยว่า\nคนทำงานต้องเหนื่อยแค่ไหน..."
16017-846-490-1 = "ทะ... ทำไมถึง\nทำอย่างนั้นล่ะคะ..."
16017-846-500-1 = "จั๊กจี้นะคะ...\nตรงนั้นเป็นจุดอ่อนของฉัน..."
16017-846-720-1 = "ระ... รู้สึกเหมือน...\nจะยังไม่จบเลยนะคะ..."
16017-846-730-1 = "คะ... ค่อยยังชั่วนะคะ\nที่คุณครูอยู่ตรงนี้ด้วย..."
16017-846-740-1 = "ต้องบอกว่ามั่นใจ...\nหรือวางใจได้ดีนะ..."
16017-846-750-1 = "แหะๆ"
16017-846-760-1 = "ถะ... ถึงจะจิ้มฉันแบบนั้น\nฉันก็ช่วยอะไร\nไม่ได้หรอกค่ะ..."
16017-846-770-1 = "ตะ... ต้องทำอะไร\nสักอย่างสิ... อึก..."
16017-846-780-1 = "วะ... ว้าว..."
16017-846-790-1 = "นะ... นั่นไม่ใช่\nเรื่องง่ายเลยนะคะ..."
