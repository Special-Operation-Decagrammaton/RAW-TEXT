[translation]
10131-852-300-1 = "トリニティに来たのは\n初めてですわ……。"
10131-852-310-1 = "ご、ご迷惑を\nおかけしないように\nいたしますわね。"
10131-852-320-1 = "トリニティという場所――\nそしてそこで生まれる\n物語。"
10131-852-330-1 = "ふふ、私、\nどちらもとても\n気に入りましたわ。"
10131-852-340-1 = "もっとも……あまりに\n全てが上手くいき過ぎて"
10131-852-350-1 = "少し不安にも\nなってしまいますが……。"
10131-852-360-1 = "物語の一幕であれば、"
10131-852-370-1 = "こういったシーンから\n波乱が生まれる\nものですから。"
10131-852-380-1 = "やはり……そうなる\n気がしていましたわ。"
10131-852-390-1 = "ええ……私くらいは、\nしっかりしませんと……。"
10131-852-400-1 = "よかった……\n本当に、よかったですわ。"
10131-852-410-1 = "心から感謝いたしますわ、\n先生。"
10131-852-420-1 = "そして……\n申し訳ありません、先生。"
10131-852-430-1 = "皆さんがとても親切に\nしてくださって、\n安心できました。"
10131-852-440-1 = "……ですがやはり私は、\nただの一生徒に\n過ぎませんのに。"
10131-852-450-1 = "お呼びですか、先生？"
10131-852-460-1 = "え？\n高笑い？"
10131-852-470-1 = "そんなはしたない真似、\nこんな場所では\nいたしませんわ！"
10131-852-480-1 = "……私たち二人きりの\n場でしたら、\nお話は別ですが。"
10131-852-490-1 = "そんな風に何度も\nからかうのはおやめに\nなってください。"
10131-852-500-1 = "さもないと――"
10131-852-510-1 = "先生の様子を\n一つ残らず記録して……"
10131-852-520-1 = "評を書かせて\nいただきますわよ？"
10131-852-530-1 = "「先生は今日も\n三善タカネに\nちょっかいをかけていた」"
10131-852-540-1 = "「私はこの事実を\nキヴォトス全土に\n公表することを決意した」"
10131-852-550-1 = "ふふっ。そうですわよね？\nご理解いただけて\n何よりです。"
10131-852-560-1 = "見識を深めるという\nことは、世界を見る\n視野を広げること。"
10131-852-570-1 = "それは、自分自身の世界を\n拡張することでも\nありますわ。"
10131-852-580-1 = "ですが……\nそう考えるうちに、"
10131-852-590-1 = "ふと、気になったのです。"
10131-852-600-1 = "先生の見ている\n世界というのは、"
10131-852-610-1 = "いったいどのような\nものなのでしょう……？"
10131-852-830-1 = "たとえトリニティにいても、\n日課を怠ってはなりません。"
10131-852-840-1 = "……好き勝手に\n振る舞っていては。"
10131-852-850-1 = "我が部長のように\nなってしまいますもの。"
10131-852-860-1 = "チェックリストを\n用意いたしましたわ。"
10131-852-870-1 = "大したものでは\nありませんが……"
10131-852-880-1 = "評の構成を\n考えたりするのとほとんど\n同じようなものですから。"
10131-852-890-1 = "物語というものは、\n小さな章の積み重ねに\n過ぎません。"
10131-852-900-1 = "執筆過程では"
10131-852-910-1 = "必ずしも物語の順序通りに\n作られているとは限りませんが。"
10131-852-920-1 = "ですが、最終的に\n何らかの形としてまとまり、"
10131-852-930-1 = "表出するという意味では――"
10131-852-940-1 = "こうした課題を着実に\nこなすことと、似ているの\nかもしれませんわね。"
10131-852-950-1 = "繰り返されることは、\n軽んじられがちですわ。"
10131-852-960-1 = "だって、\n退屈だから……？"
10131-852-970-1 = "小さな積み重ねを\n疎かにしていては、"
10131-852-980-1 = "いずれ足元を\nすくわれますわよ。"
10131-852-990-1 = "優しい小言だね……？"
10131-852-1000-1 = "え、ええ……\n説教くさいのは\n自覚しておりますとも。"
10131-852-1010-1 = "評論家なんて所詮、\n重箱の隅をつつく\n小言屋ですもの。"
10131-852-1020-1 = "5点満点！\nお見事ですわ！"
10131-852-1030-1 = "誠実に課題を\nやり遂げた方には、"
10131-852-1040-1 = "報酬があって\n然るべきですから。"
10131-852-1050-1 = "はい、こちらをどうぞ。\n私のポケットマネー\nですわ。ふふ。"
