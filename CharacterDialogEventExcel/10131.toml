[translation]
10131-852-300-1 = "ถึงฉันเพิ่งจะ\nเคยมาที่ทรีนิตี้\nเป็นครั้งแรก..."
10131-852-310-1 = "ฉะ... ฉันจะพยายามเต็มที่\nไม่ให้สร้างความลำบาก\nอย่างเด็ดขาดค่ะ"
10131-852-320-1 = "สถานที่ที่เรียกว่าทรีนิตี้\nและเรื่องราวต่างๆ\nที่อุบัติขึ้น ณ ที่นั้น"
10131-852-330-1 = "ฮุฮุ ฉันน่ะ\nชอบทั้งสองอย่างเลยค่ะ"
10131-852-340-1 = "ทุกอย่างราบรื่นดีมาก"
10131-852-350-1 = "จนรู้สึกสังหรณ์ใจไม่ดี\nนิดหน่อยเลยค่ะ..."
10131-852-360-1 = "ถ้าเป็นตอนที่ใกล้จะจบเรื่อง"
10131-852-370-1 = "เวลาแบบนี้มักจะเกิด\nเรื่องวุ่นวายขึ้นนี่คะ"
10131-852-380-1 = "ไม่รู้ว่าเพราะอะไร\nถึงคิดว่าจะเกิด\nเรื่องแบบนั้นค่ะ..."
10131-852-390-1 = "ค่ะ... อย่างน้อย\nฉันก็ควรต้องคุมสติให้ดีค่ะ"
10131-852-400-1 = "โล่งอกไปทีนะคะ...\nค่อยยังชั่วจริงๆ ค่ะ"
10131-852-410-1 = "ขอบคุณจริงๆ ค่ะ\nคุณครู"
10131-852-420-1 = "แล้วก็...\nขอโทษนะคะ คุณครู"
10131-852-430-1 = "ทุกคนปฏิบัติด้วยอย่างใจดี\nทำให้ฉันเบาใจมากเลยค่ะ"
10131-852-440-1 = "แต่ถึงยังไง ฉันก็เป็น\nแค่เพียงนักเรียนธรรมดาๆ\nคนหนึ่งเองนะคะ"
10131-852-450-1 = "เรียกฉันเหรอคะ คุณครู?"
10131-852-460-1 = "คะ?\n'เสียงหัวเราะแบบนั้น' เหรอคะ? "
10131-852-470-1 = "ไม่เอาค่ะ!\nอย่างน้อยก็\nขอไม่ทำที่นี่ค่ะ!"
10131-852-480-1 = "...แต่ถ้าเป็น\nตอนที่อยู่กันสองคน\nก็อาจจะทำก็ได้นะคะ..."
10131-852-490-1 = "ช่วยเลิกล้อเล่น\nแบบนั้นทีเถอะค่ะ"
10131-852-500-1 = "ถ้าไม่อย่างนั้นละก็...!"
10131-852-510-1 = "ฉันจะคอยบันทึกการกระทำ\nของคุณครูไว้ทุกฝีก้าวเลยค่ะ"
10131-852-520-1 = "ฉันจะช่วยเขียน\nคำวิจารณ์ให้ยังไงล่ะคะ"
10131-852-530-1 = "ในวันนี้คุณครูก็ยังคง\nกลั่นแกล้งมิโยชิ ทาคาเนะ\nอย่างไม่หยุดหย่อน'"
10131-852-540-1 = "ฉันตั้งใจแน่วแน่แล้วว่า\nจะเล่าความจริงเรื่องนี้\nให้ทั้งคิโวทอสได้รับรู้'"
10131-852-550-1 = "ฮุฮุ นั่นสินะคะ?\nค่อยยังชั่วหน่อย\nที่คุณครูเข้าใจนะคะ"
10131-852-560-1 = "การเปิดหูเปิดตาให้กว้างไกล\nก็คือการขยายมุมมองที่มีต่อโลก\nให้กว้างขึ้นนั่นเองค่ะ"
10131-852-570-1 = "และในความหมายหนึ่ง\nนั่นก็คือการเปิดโลกของตัวเอง\nให้กว้างใหญ่ขึ้นด้วยเช่นกันค่ะ"
10131-852-580-1 = "แต่ว่า… พอคิดแบบนี้แล้ว"
10131-852-590-1 = "ก็มีเรื่องที่สงสัยขึ้นมาน่ะค่ะ"
10131-852-600-1 = "โลกที่เรียกว่า 'คุณครู'\nแท้จริงแล้ว"
10131-852-610-1 = "จะเป็นโลกแบบไหนน่ะค่ะ...?"
10131-852-830-1 = "แม้จะอยู่ที่ทรีนิตี้ แต่ก็ห้ามลืม\nเรื่องที่ต้องทำเด็ดขาดค่ะ"
10131-852-840-1 = "ไม่อย่างนั้น ฉันอาจจะกลายเป็น\nเหมือนหัวหน้าที่ชอบทำเป็นแกล้งลืม"
10131-852-850-1 = "ว่าอะไรสำคัญไปซะก่อนน่ะค่ะ"
10131-852-860-1 = "ฉันทำรายการตรวจสอบ\nมาให้แล้วค่ะ คุณครู"
10131-852-870-1 = "ไม่ใช่เรื่องใหญ่อะไรหรอกค่ะ"
10131-852-880-1 = "สำหรับฉันแล้วมันแทบจะไม่ต่างจาก\nการเรียบเรียงบทวิจารณ์เลยละค่ะ"
10131-852-890-1 = "สิ่งที่เรียกว่าเรื่องราวมันก็คือการร้อยเรียง\nบทเล็กๆ เข้าด้วยกันนั่นละค่ะ"
10131-852-900-1 = "แต่ขั้นตอนการเขียนจริงๆ"
10131-852-910-1 = "มันอาจไม่ได้เรียงตามลำดับแบบนั้น\nเสมอไปก็ได้นะคะ"
10131-852-920-1 = "แต่ว่า ถ้าในความหมายที่ว่า\nสุดท้ายมันต้องถูกสรุปออกมา"
10131-852-930-1 = "เป็นรูปธรรมแล้วละก็..."
10131-852-940-1 = "มันอาจจะคล้ายกับการที่เราค่อยๆ\nสะสมความสำเร็จจากภารกิจเล็กๆ\nไปพร้อมๆ กันก็ได้นะคะ"
10131-852-950-1 = "อะไรที่ทำจนเป็นปกติน่ะ...\nมักจะถูกมองข้ามได้ง่ายใช่มั้ยล่ะคะ"
10131-852-960-1 = "ก็นะ… มันเป็นเรื่องน่าเบื่อนี่คะ"
10131-852-970-1 = "แต่ถ้าเราละเลยความพยายาม\nเล็กๆ น้อยๆ ละก็"
10131-852-980-1 = "สักวันหนึ่งมันอาจจะย้อนกลับมา\nเป็นอุปสรรคได้เหมือนกันนะคะ"
10131-852-990-1 = "ที่ฉันพูดเมื่อกี้ มันฟังดูเหมือน\nการบ่นที่น่าเอ็นดูมากเลยงั้นเหรอคะ?"
10131-852-1000-1 = "ค่า ค่า... ฉันรู้อยู่แล้วละ\nว่าตัวเองเป็นคนที่ขี้บ่นค่ะ"
10131-852-1010-1 = "สุดท้ายแล้วนักวิจารณ์ก็คือพวกช่างติ\nที่ชอบหาเรื่องบ่นไปเรื่อยนั่นละค่ะ"
10131-852-1020-1 = "5 คะแนนเต็ม!\nสุดยอดเลยค่ะ!"
10131-852-1030-1 = "สำหรับคนที่ตั้งใจ\nทำภารกิจอย่างซื่อสัตย์น่ะ "
10131-852-1040-1 = "การได้รับรางวัลตอบแทน\nมันก็เป็นเรื่องธรรมดานี่คะ"
10131-852-1050-1 = "อ่ะ นี่ค่ะ\nฉันเตรียมมาให้แล้วค่ะ"
