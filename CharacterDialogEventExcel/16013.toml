[translation]
16013-828-240-1 = "沒時間磨蹭了！\n快走吧！"
16013-828-250-1 = "既然有我在，\n就不能有任何馬虎哦！"
16013-828-260-1 = "呵呵，很順利！"
16013-828-270-1 = "加油吧！\n沒剩多久了！"
16013-828-280-1 = "考量到萬一的情況，\n再不要再確認一下？"
16013-828-290-1 = "噫，噫噫！？\n嚇我一跳……\n真是的！做什麼啦老師！"
16013-828-300-1 = "有，有什麼事啦……\n不要一直叫我。"
16013-828-310-1 = "啊啊真是的！\n有事的話就好好說！"
16013-828-320-1 = "嗯？怎麼了？"
