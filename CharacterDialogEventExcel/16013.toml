[translation]
16013-828-240-1 = "ไม่มีเวลามารีรอ\nอยู่นะคุณครู!\nรีบไปกันเถอะ!"
16013-828-250-1 = "อยู่กับฉันทั้งคน\nไม่มีอะไรที่ทำลวกๆ หรอก!"
16013-828-260-1 = "ฮุฮุ ไร้ปัญหา!"
16013-828-270-1 = "พยายามเข้านะ!\nเหลืออีกไม่เยอะแล้ว!"
16013-828-280-1 = "แค่เผื่อไว้ก่อนน่ะ\nลองตรวจสอบดูอีกรอบไหม?"
16013-828-290-1 = "ฮะ... เฮือก!?\nตกใจหมดเลย...\nฉันตกใจนะ คุณครู!"
16013-828-300-1 = "ทะ... ทำอะไรตั้งแต่เมื่อกี้แล้ว...\nอย่าเอาแต่เรียกสิ"
16013-828-310-1 = "อ่า... จริงๆ เลย!\nถ้ามีธุระอะไร\nก็บอกกันดีๆ สิ!"
16013-828-320-1 = "หืม? มีเรื่องอะไรเหรอ?"
