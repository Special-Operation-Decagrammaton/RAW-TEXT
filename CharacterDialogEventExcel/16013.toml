[translation]
16013-828-240-1 = "もたもたしてる\n時間はないの！\n早くいこ！"
16013-828-250-1 = "私がついてる以上、\n手を抜いたら\nダメだからね！"
16013-828-260-1 = "ふふっ、順調ね！"
16013-828-270-1 = "頑張ろ！\nあとちょっとだから！"
16013-828-280-1 = "万が一って事もあるし、\nもう一度見てみない？"
16013-828-290-1 = "ひ、ひいっ！？\nびっくりしたぁ……。\nもう！なんなのよ先生！"
16013-828-300-1 = "さ、さっきから何よ……。\n何度も呼ばないでっ。"
16013-828-310-1 = "ああもう！\n用事があるなら\nちゃんと言葉にして！"
16013-828-320-1 = "ん？どうしたの？"
