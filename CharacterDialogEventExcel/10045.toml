[translation]
10045-814-10-1 = "呀～老師，\n辛苦了～"
10045-814-20-1 = "好熱……\n熱到感覺\n要被曬乾了……"
10045-814-30-1 = "明明沒有動\n卻好熱唷……"
10045-814-40-1 = "差不多\n不出發不行？"
10045-814-50-1 = "唔嘿～\n好麻煩啊……"
10045-814-60-1 = "好像已經\n沒什麼時間了，差不多\n來動一動吧～"
10045-814-70-1 = "老師，還有什麼事\n沒有做嗎？"
10045-814-80-1 = "真沒辦法呢～\n讓大叔\n來幫你吧"
10045-814-90-1 = "老師～來找大叔\n沒關係嗎？"
10045-814-100-1 = "會被罵唷？"
10045-814-110-1 = "唔呼……\n就算那樣戳，\n大叔身上\n也什麼都不會跑出來呀……"
10045-814-120-1 = "該不會\n老師也累了嗎？"
10045-814-130-1 = "那樣的話要一起\n在那邊睡一覺嗎？"
10045-814-140-1 = "好～睏……"
10045-10814-10-1 = "呀～老師，辛苦了～"
