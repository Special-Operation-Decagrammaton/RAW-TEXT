[translation]
10045-814-10-1 = "오~, 선생.\n수고수고~."
10045-814-20-1 = "더워……\n더워서 말라버릴\n것 같아……."
10045-814-30-1 = "가만히 있는데도\n더워~"
10045-814-40-1 = "슬슬 움직여야 할까…?"
10045-814-50-1 = "으헤ー ,\n귀찮구만…."
10045-814-60-1 = "이제 그다지 시간도\n없는 것 같고,\n슬슬 움직여볼까~"
10045-814-70-1 = "선생, 아직도\n할 일이 남은 거야?"
10045-814-80-1 = "어쩔 수 없네.\n아저씨가 도와줄게."
10045-814-90-1 = "선생~. 아저씨한테\n신경 써도 되는 거야?"
10045-814-100-1 = "혼날 거라고?"
10045-814-110-1 = "으응…….\n그렇게 찔러 대도,\n아저씨한테서는\n아무것도 안 나와……."
10045-814-120-1 = "혹시\n선생도 지쳤어?"
10045-814-130-1 = "그러면 같이\n저쪽에서 한숨 잘까?"
10045-814-140-1 = "졸~려어~~~."
