[translation]
10045-814-10-1 = "โย่ว~ ครู\nเหนื่อยหน่อยน้า~"
10045-814-20-1 = "ร้อนจังเลย ร้อน~\nร้อนจนเหมือน\nจะแห้งตายอยู่แล้ว..."
10045-814-30-1 = "ถึงจะอยู่เฉยๆ แบบนี้\nแต่ก็ร้อนจังเลย..."
10045-814-40-1 = "เตรียมตัวกลับกันเลยดีมั้ย...?"
10045-814-50-1 = "แหะๆ\nขี้เกียจจังเลย..."
10045-814-60-1 = "เหมือนจะไม่มีเวลาแล้ว\nรีบไปกันเถอะ~"
10045-814-70-1 = "ครูยังมีงาน\nที่ต้องทำเหลืออยู่เหรอ?"
10045-814-80-1 = "งั้นก็ช่วยไม่ได้นะ\nเดี๋ยวลุงคนนี้จะช่วยเอง"
10045-814-90-1 = "ครู~ สนใจตาลุงคนนี้\nหน่อยได้รึเปล่า?"
10045-814-100-1 = "มีปัญหาอยู่งั้นเหรอ?"
10045-814-110-1 = "อือฮึ...\nถึงจะเรียกแบบนั้น\nลุงก็ไม่มีอะไรให้หรอกนะ..."
10045-814-120-1 = "หรือว่าครูเองก็\nเหนื่อยเหมือนกันเหรอ?"
10045-814-130-1 = "ถ้าอย่างนั้น...\nเราไปพักงีบตรงนั้นกันดีมั้ย?"
10045-814-140-1 = "ง่วง~ จาง~ เลย~~"
