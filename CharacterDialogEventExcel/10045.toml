[translation]
10045-814-10-1 = "やー先生、お疲れ様ー"
10045-814-20-1 = "あっつい…\n暑くて干からびそう…"
10045-814-30-1 = "動いてないのに暑いよ～…"
10045-814-40-1 = "そろそろ\n行かなきゃダメ？"
10045-814-50-1 = "うへー、\n面倒くさいなぁ…。"
10045-814-60-1 = "もうあんまり時間が\n無さそうだし、そろそろ\n動くとしようか～"
10045-814-70-1 = "先生、まだやる\nことが残ってるの？"
10045-814-80-1 = "ふふん、仕方ないなあ。\nおじさんが\n手伝ってあげよう"
10045-814-90-1 = "先生～、\nおじさんに\n構ってて良いの？"
10045-814-100-1 = "怒られちゃうよ？"
10045-814-110-1 = "うーん…そんなに\nつつかれても、\nおじさんからは\n何も出てこないけど…"
10045-814-120-1 = "もしかして、\n先生も疲れた？"
10045-814-130-1 = "それなら一緒に、\n向こうで一眠りする？"
10045-814-140-1 = "ねーむぃ…"
