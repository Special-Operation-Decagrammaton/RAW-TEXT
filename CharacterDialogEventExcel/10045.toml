[translation]
10045-814-10-1 = "Oh, Sensei. Great work!"
10045-814-20-1 = "It's so hot! I'm feeling parched in this heat..."
10045-814-30-1 = "It's hot, even when I'm not moving at all..."
10045-814-40-1 = "Should we get going...?"
10045-814-50-1 = "Heh... I'm feeling lazy..."
10045-814-60-1 = "We don't have a lot of time now. Shall we make our way over? Preferably at a leisurely pace."
10045-814-70-1 = "Sensei, are you still busy?"
10045-814-80-1 = "Ugh... I guess there's no way around it. This old-timer will help you out."
10045-814-90-1 = "Sensei! Is it okay if you play hooky with this old grandma?"
10045-814-100-1 = "Really? Won't you get in trouble?"
10045-814-110-1 = "Hahaha... You're not gonna gain anything by doing that!"
10045-814-120-1 = "Are you tired too?"
10045-814-130-1 = "Should we take a nap over there?"
10045-814-140-1 = "I'm sleepy!"
