[translation]
10090-835-180-1 = "(ยะ... อย่าตกใจนะ\nอย่าตกใจ...!)"
10090-835-190-1 = "คุณครู ทุกคน!\nยินดีต้อนรับสู่\nเฮียกคิยาโคค่ะ"
10090-835-200-1 = "เพื่อให้ทุกคนมีความทรงจำ\nที่ดีที่สุดในเฮียกคิยาโค!"
10090-835-210-1 = "ซาโตฮามะ อุมิกะ\nจะพยายามอย่างเต็มที่ค่ะ!"
10090-835-220-1 = "คุณครู... ตอนนี้ฉัน...\nจะไม่เป็นไรใช่มั้ยคะ...?"
10090-835-230-1 = "ฮือ... หวังว่ากำหนดการ\nจะไม่คลาดเคลื่อนมากเกินนะคะ"
10090-835-240-1 = "ตะ... แต่ก็แน่นอนว่า\nการจัดการปัญหา\nคืองานของฉันค่ะ!"
10090-835-250-1 = "พวกปีศาจ... พวกตัวปัญหา...!"
10090-835-260-1 = "แต่ถึงยังไง...\nในหมู่เด็กที่ชอบงานเทศกาล\nก็ไม่มีเด็กไม่ดีค่ะ"
10090-835-270-1 = "ใช่มั้ยคะ... คุณครู?"
10090-835-280-1 = "อ๊ะ คุณครู!\nขอบคุณที่อยู่ช่วย\nจนถึงจบงานเลยนะคะ"
10090-835-290-1 = "โชคดีจริงๆ ค่ะ\nที่มีคุณครูอยู่ด้วย!"
10090-835-300-1 = "ฉัน... จะทำออกมาได้ดีมั้ยคะ?\nฉันกำลังทำได้ดีหรือเปล่าคะ...?"
10090-835-310-1 = "อ่า... ขอบคุณนะคะ\nที่ช่วยพูดอย่างนั้น..."
10090-835-320-1 = "ถ้าทำให้ทุกอย่าง\nเป็นงานเทศกาลละก็...!"
10090-835-330-1 = "คะ? เหมือนบทพูดของคนบ้างาน\nเทศกาลงั้นเหรอคะ? อะไรกัน..."
10090-835-340-1 = "ไม่สิ เดี๋ยวนะคะ คนบ้างานเทศกาล...\nงั้นขอเอาอันนี้เป็นแรงบันดาลใจ..."
10090-835-350-1 = "ถ้าอยู่ด้วยกันแล้ว\nก็ไม่มีอะไรต้องกลัวค่ะ"
10090-835-360-1 = "จะว่าอย่างนี้ได้มั้ยนะ\nเพราะการเตรียมงาน\nคือการต้องร่วมมือกัน"
10090-835-370-1 = "เพื่อทำออกมาให้เสร็จ\nภายในเวลาที่กำหนดค่ะ"
10090-835-380-1 = "ไว้คราวหน้าก็...\nมาที่เฮียกคิยาโคอีกนะคะ"
10090-835-390-1 = "ตอนนั้นฉันจะทำให้ได้เห็น\nงานเทศกาลที่ยอดเยี่ยมเลยละค่ะ!"
10090-835-530-1 = "อ๊ะ คุณครู! "
10090-835-540-1 = "แหะๆๆ ใช่แล้วค่ะ\nนี่คือร้านค้าพิเศษของการทัศนศึกษา"
10090-835-550-1 = "ค่อยๆ ดูของตามใจเลยนะคะ!"
10090-835-560-1 = "มีของชิ้นไหนที่ถูกใจมั้ยคะ?"
10090-835-570-1 = "หรือว่ามีของอะไร\nที่อยากได้หรือเปล่าคะ?"
10090-835-580-1 = "บอกฉันได้ทุกอย่างเลยค่ะ!"
10090-835-590-1 = "ร้านค้าทัศนศึกษา\nปิดลงแล้วค่ะ..."
10090-835-600-1 = "แต่งานเทศกาลของเฮียกคิยาโค\nจะเริ่มตั้งแต่ตอนนี้นะคะ!"
10090-835-610-1 = "คะ? ค่ะ ไม่เป็นไรค่ะ\nทั้งการกระจายของ การจัดการ การค้าขาย"
10090-835-620-1 = "ที่ฉันได้บริการร้านเฮียกคิยาโค\nเคียงข้างกับท่านประธาน"
10090-835-630-1 = "เลยได้เรียนรู้มาด้วยค่ะ"
10090-835-640-1 = "ไม่ได้ลำบากขนาดนั้นหรอกค่ะ\nฉันชินแล้วน่ะค่ะ"
10090-835-650-1 = "แต่พอมีคุณครูมาที่นี่ด้วย...\nก็ดีจังเลยนะคะ แหะๆๆ"
10090-835-660-1 = "จะเอาอันนั้นเหรอคะ?\nขอบคุณค่ะ!"
10090-835-670-1 = "ค่า! เลือกได้ดีเลยค่ะ!"
10090-835-680-1 = "ว้าว! ถ้าเป็นฉัน\nฉันก็คงเลือกอันเดียวกันค่ะ!"
10090-835-690-1 = "ขอบคุณที่มาอุดหนุนนะคะ\nแหะๆๆ"
