[translation]
10090-835-180-1 = "(D-Don't panic. Don't panic!)"
10090-835-190-1 = "Sensei! Everyone! Welcome to Hyakkiyako!"
10090-835-200-1 = "May you leave Hyakkiyako with many cherished memories!"
10090-835-210-1 = "This is Satohama Umika here. I will give it my all!"
10090-835-220-1 = "I didn't do too bad just now, did I?"
10090-835-230-1 = "Ugh...I hope the schedule doesn't get too messed up..."
10090-835-240-1 = "W-Well, it's my job to fix that too!"
10090-835-250-1 = "Mouryo... You troublemakers!"
10090-835-260-1 = "Still...any kid who enjoys festivals isn't a bad one."
10090-835-270-1 = "...Isn't that right, Sensei?"
10090-835-280-1 = "Oh, Sensei! Thank you so much for staying with us until the end."
10090-835-290-1 = "I'm so grateful to have you here!"
10090-835-300-1 = "How am I doing? Did I do good?"
10090-835-310-1 = "Wow... Thank you for that. I really appreciate it..."
10090-835-320-1 = "Of course... If I turn everything into a festival—!"
10090-835-330-1 = "Huh? I sounded like some kind of festival fiend just now? How?"
10090-835-340-1 = "Oh, wait a minute. A festival fiend... I could use that as inspiration..."
10090-835-350-1 = "If we work together, we've got nothing to fear!"
10090-835-360-1 = "Or so they say. When it comes to work prep, everyone HAS to work together."
10090-835-370-1 = "That's the only way we'll be able to finish it before the deadline."
10090-835-380-1 = "Please come again...to Hyakkiyako."
10090-835-390-1 = "Next time, I'll show you a truly spectacular festival!"
10090-835-530-1 = "Ah, Sensei!"
10090-835-540-1 = "Heeheehee. That's right. It's the special field trip store."
10090-835-550-1 = "Feel free to explore as you like!"
10090-835-560-1 = "Anything catch your eye?"
10090-835-570-1 = "Or is there something you need?"
10090-835-580-1 = "Whatever it is, just let me know!"
10090-835-590-1 = "The field trip shop is now closed..."
10090-835-600-1 = "But the Hyakkiyako festival has just begun!"
10090-835-610-1 = "Huh? Yes, that's fine. Distribution, management, sales, I can handle it all."
10090-835-620-1 = "I ran Momoyodou alongside the boss, you see."
10090-835-630-1 = "So I just picked those skills up naturally."
10090-835-640-1 = "The work's not hard. I'm used to it by now."
10090-835-650-1 = "Anyway, it's really nice to have you here, Sensei. Heeheehee."
10090-835-660-1 = "You want to go with that? Thank you!"
10090-835-670-1 = "Yes, that's a great choice!"
10090-835-680-1 = "Wow! I wanted that one too!"
10090-835-690-1 = "Thank you for your business. Heeheehee."
