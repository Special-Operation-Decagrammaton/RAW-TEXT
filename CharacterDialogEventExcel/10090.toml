[translation]
10090-835-180-1 = "（あ、慌てないで、\n慌てないで……！）"
10090-835-190-1 = "先生、皆さん！\n百鬼夜行へようこそ！"
10090-835-200-1 = "百鬼夜行で、最高の\n思い出を残せるように！"
10090-835-210-1 = "里浜ウミカ、\nベストを尽くします！"
10090-835-220-1 = "先生……いま私、\n大丈夫でしたよね……？"
10090-835-230-1 = "ううう……日程があまり\nずれないといいですね……"
10090-835-240-1 = "も、もちろんそれを\n戻すのも私の\n仕事なんですが！"
10090-835-250-1 = "魑魅一座のせいで……！"
10090-835-260-1 = "でも……お祭りが好きな\n子たちに、悪い子は\nいないでしょうから。"
10090-835-270-1 = "……そうですよね、先生？"
10090-835-280-1 = "あ、先生！\n最後までお付き合いいただき、\n本当にありがとうございます。"
10090-835-290-1 = "先生がいてくださって、\n本当によかったです！"
10090-835-300-1 = "私、うまくやれる\nでしょうか？\nうまくやれているの\nでしょうか……？"
10090-835-310-1 = "ううう……\nそう言ってくださって\nありがとうございます……"
10090-835-320-1 = "やっぱり……\nすべてをお祭りに\nしてしまえば……！"
10090-835-330-1 = "はい？今のは何かお祭り怪\n人のようなセリフだった？\nそんな……"
10090-835-340-1 = "いえ、待ってください。\nお祭り怪人……\nこれをモチーフにして……"
10090-835-350-1 = "一緒なら何も\n怖くないと言います。"
10090-835-360-1 = "といいますか、仕事の\n準備というのはみんなで\n力を合わせてこそ、"
10090-835-370-1 = "ようやく締め切り内に\n終わらせることが\nできるものですから。"
10090-835-380-1 = "今度また……\n百鬼夜行にきてください。"
10090-835-390-1 = "その時は本当に格好良くて\n素晴らしいお祭りを\nお見せしますね！"
10090-835-530-1 = "あっ、先生！"
10090-835-540-1 = "えへへ。そうです。\n修学旅行の特別ショップです。"
10090-835-550-1 = "思う存分見て行ってください！"
10090-835-560-1 = "お気に召したものは\nありましたか？"
10090-835-570-1 = "それと、必要なものは\nありますか？"
10090-835-580-1 = "何でもおっしゃってください！"
10090-835-590-1 = "修学旅行ショップの\n営業は終了しました……"
10090-835-600-1 = "でも百鬼夜行の\nお祭りはこれからです！"
10090-835-610-1 = "はい？はい。大丈夫です。\n流通、管理、営業。"
10090-835-620-1 = "社長のそばで百夜堂を\n一緒に運営していたので。"
10090-835-630-1 = "自然と学びました。"
10090-835-640-1 = "そんなに大変ではありません。\n慣れてますから。"
10090-835-650-1 = "でも先生が来てくださるなら……\nいいですね。えへへ。"
10090-835-660-1 = "それになさいますか？\nありがとうございます！"
10090-835-670-1 = "はい、それは良い選択です！"
10090-835-680-1 = "わあ！\n私でもそれを選んだと思います！"
10090-835-690-1 = "ご利用ありがとうございます。\nえへへ。"
