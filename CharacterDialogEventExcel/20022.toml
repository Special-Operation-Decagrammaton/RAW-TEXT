[translation]
20022-820-340-1 = "สวัสดีค่ะคุณครู!\nขอพรอะไร\nในวันปีใหม่เหรอคะ?"
20022-820-350-1 = "ฉันก็จะขอพร\nข้างๆ คุณครูเองค่ะ"
20022-820-360-1 = "ไม่หนาวเหรอคะ?\nทานอาหารร้อนๆ\nสักหน่อยดีมั้ยคะ?"
20022-820-370-1 = "ค่ะ... ตั้งแต่นี้ไป...\nฉันจะแสดงฝีมือทำอาหาร\nให้ชมเองค่ะ!"
20022-820-380-1 = "ฉันจะพยายามเต็มที่...\nเพราะงั้นถ้าคุณครูคอยดู...\nก็จะขอบคุณมากเลยค่ะ"
20022-820-390-1 = "ไม่รู้ทำไมถึงกลายเป็น\nเรื่องใหญ่โตไปซะแล้ว แต่ว่า...\nเรื่องที่ฉันทำก็ไม่ได้เปลี่ยนไปค่ะ"
20022-820-400-1 = "ก็แค่ทำให้ดีที่สุด\nเท่านั้นเองค่ะ"
20022-820-410-1 = "นอกจากนั้น... คุณครู\nก็อยู่ข้างๆ ด้วย...\nเลยค่อนข้างอุ่นใจค่ะ!"
20022-820-420-1 = "จบลงไปได้ด้วยดี\nค่อยโล่งใจหน่อยค่ะ"
20022-820-430-1 = "คือว่า... อาหารของฉัน...\nถูกปากหรือเปล่าคะ?"
20022-820-440-1 = "ค่ะ คุณครู?\nมีอะไรรึเปล่าคะ?"
20022-820-450-1 = "สกู๊ตเตอร์คันนี้\nก็ใช้ในหลายๆ อย่างค่ะ"
20022-820-460-1 = "ถ้าเกิดไม่มีเจ้านี่ละก็...\nจะทำยังไงนะ?"
20022-820-470-1 = "ฉันอยากลองทำ\nอาหารปีใหม่อย่างอื่น\nนอกจากโอเซจิดูบ้างค่ะ"
20022-820-480-1 = "ค่ะ ถ้ากินหมดนั่นละก็...\nน้ำหนักคงขึ้นแน่ๆ ค่ะ"
20022-820-490-1 = "อาจไม่ถึงกับเป็น\nพรวันปีใหม่..."
20022-820-500-1 = "แต่ปีนี้ขอให้ไม่เกิดเรื่องอะไร\nกับห้องชมรมโภชนาการค่ะ..."
20022-820-510-1 = "คุณครู เชิญเลยค่ะ\nคุณพ่อค้าหลายๆ คน\nช่วยเตรียมของให้น่ะค่ะ"
20022-820-520-1 = "นี่เป็นครั้งแรกที่ฉันมาดูแล\nร้านค้าค่ะ แหะๆๆ"
20022-820-530-1 = "ทั้งงานเทศกาล และงานแข่ง\nทำอาหารก็จบลงแล้วค่ะ"
20022-820-540-1 = "ฉันยังมีสิ่งที่ต้องเตรียม\nสำหรับพรุ่งนี้อยู่ค่ะ\nคุณครูค่อยๆ เลือกชมก่อนนะคะ"
20022-820-550-1 = "ไม่เป็นไรค่ะ ไม่ต้องห่วงนะคะ"
20022-820-560-1 = "ถ้าเป็นเรื่องจัดการคลังละก็\nฉันมั่นใจค่ะ"
20022-820-570-1 = "คะ? อาหารพิเศษจาก\nชมรมโภชนาการงั้นเหรอคะ?"
20022-820-580-1 = "คือว่า... ถ้าไม่ติดอะไร\nให้ฉันทำให้มั้ยคะ?"
20022-820-590-1 = "อ๊ะ ถ้าอย่างนั้น...\nช่วยรอสักครู่นะคะ"
20022-820-600-1 = "อันนั้นเป็นสินค้าแนะนำเลยนะคะ!"
20022-820-610-1 = "อ๊ะ... ค่ะ อันนี้หรือเปล่าคะ?"
20022-820-620-1 = "ถูกใจรึเปล่าคะ?\nแล้วมาอีกนะคะ!"
