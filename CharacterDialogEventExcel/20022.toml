[translation]
20022-820-340-1 = "こんにちは、先生！\n新年のお願いは\n決まりましたか？"
20022-820-350-1 = "私も隣でお祈りしますね！"
20022-820-360-1 = "寒くありませんか？\n温かい食事でも\nいかがでしょう？"
20022-820-370-1 = "はい…\n今こそ料理の腕前を\n披露するときですね！"
20022-820-380-1 = "私、頑張りますから…\n見守ってくださると\n嬉しいです。"
20022-820-390-1 = "なんだかすごいことに\nなってしまいましたが、\n私のやることは\n変わりません。"
20022-820-400-1 = "ただ最善を尽くす、\nそれだけです。"
20022-820-410-1 = "それに…先生がそばに\nいてくださりますから\n百人力です！"
20022-820-420-1 = "無事に終わって\n良かったです。"
20022-820-430-1 = "その…私の料理、\nお口に合いましたか？"
20022-820-440-1 = "はい、先生？\nどうかしましたか？"
20022-820-450-1 = "このスクーターは\n色々なことに\n使っているんですよ。"
20022-820-460-1 = "これまで\n無くなってしまったら…\nどうしましょう…。"
20022-820-470-1 = "おせち以外の\nお正月料理にも\n挑戦してみたいです！"
20022-820-480-1 = "あっ、でも…作ったものを\n全部食べたら…\n太ってしまいそう…。"
20022-820-490-1 = "新年のお願い…\nではありませんが、"
20022-820-500-1 = "今年は給食室が\n無事でありますように…。"
20022-820-510-1 = "先生、いらっしゃいませ。\n商店街の方に色々なものを\n用意していただきました！"
20022-820-520-1 = "売り子さんをするの、\n初めてなんです。えへへ。"
20022-820-530-1 = "お祭りも料理大会も\n終わりましたね。"
20022-820-540-1 = "私は明日の下ごしらえが\n残っていますが…\n先生はゆっくりしててくださいね。"
20022-820-550-1 = "大丈夫ですよ。\n心配しないでください。"
20022-820-560-1 = "倉庫の管理でしたら、\nそれなりに自信がありますから。"
20022-820-570-1 = "えっ？\n給食部の特製料理、ですか…？"
20022-820-580-1 = "もしよろしければ\nお作りしましょうか？"
20022-820-590-1 = "あ、それでしたら\n少々お待ちください。"
20022-820-600-1 = "そちら、いちおしの商品です！"
20022-820-610-1 = "えっと…はい、こちらですね？"
20022-820-620-1 = "気に入っていただけましたか？\nまた来てくださいね！"
