[translation]
20022-820-340-1 = "Hello, Sensei! Did you decide on your New Year's wish?"
20022-820-350-1 = "Here, I'll pray next to you!"
20022-820-360-1 = "Are you cold? Do you need a warm meal?"
20022-820-370-1 = "Yes... Now is the time to show off my cooking skills!"
20022-820-380-1 = "I'm gonna try my best. Come watch me!"
20022-820-390-1 = "Even though it's become such a big deal, it doesn't change what I need to do."
20022-820-400-1 = "All I can do is try my best."
20022-820-410-1 = "Besides... I feel reassured with you at my side!"
20022-820-420-1 = "I'm glad it ended well."
20022-820-430-1 = "So...Sensei? Was my food to your liking?"
20022-820-440-1 = "Yes, Sensei? What's going on?"
20022-820-450-1 = "This scooter is so helpful."
20022-820-460-1 = "If I lose this too, whatever will I do...?"
20022-820-470-1 = "I want to try making other New Year's foods as well. Not just osechi."
20022-820-480-1 = "Oh, but... If I eat all of that, I'll definitely gain weight."
20022-820-490-1 = "I don't know if I'd call it a New Year's wish, but..."
20022-820-500-1 = "I hope the cafeteria stays safe this year..."
20022-820-510-1 = "Sensei, welcome. The market owners prepared all manner of products."
20022-820-520-1 = "It's my first time running the shop. Heeheehee."
20022-820-530-1 = "Both the festival and the cooking contests have ended."
20022-820-540-1 = "I have to prepare for tomorrow...but you should take your time and look around."
20022-820-550-1 = "It's fine. Don't worry."
20022-820-560-1 = "I feel confident I can manage our inventory."
20022-820-570-1 = "Huh? A special School Lunch Club dish, you say?"
20022-820-580-1 = "If you want...I can make something for you."
20022-820-590-1 = "All right, please give me a minute."
20022-820-600-1 = "That's my top recommendation!"
20022-820-610-1 = "Oh... Yes. You mean this one, right?"
20022-820-620-1 = "Did you enjoy it? Please come again!"
