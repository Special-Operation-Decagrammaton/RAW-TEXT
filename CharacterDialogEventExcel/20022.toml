[translation]
20022-820-340-1 = "안녕하세요. 선생님!\n새해의 소원은\n정하셨나요?"
20022-820-350-1 = "저도 옆에서\n같이 빌어 드릴게요!"
20022-820-360-1 = "춥지 않으세요?\n따뜻한 식사라도\n어떠신가요?"
20022-820-370-1 = "네…지금이야말로\n요리 솜씨를\n보여줄 때군요!"
20022-820-380-1 = "저, 열심히 할 테니까…\n지켜봐 주시면\n감사하겠습니다."
20022-820-390-1 = "왠지 엄청난 일이\n되어버렸지만, 제가\n하는 일은 변하지 않아요."
20022-820-400-1 = "그저 최선을 다하는 것,\n그것뿐입니다."
20022-820-410-1 = "게다가… 선생님께서\n곁에 있어 주시니\n마음이 든든해요!"
20022-820-420-1 = "무사히 마무리되어서\n다행이에요."
20022-820-430-1 = "그…… 제 요리,\n입맛에 맞으셨나요?"
20022-820-440-1 = "네, 선생님?\n무슨 일이세요?"
20022-820-450-1 = "이 스쿠터는 여러 용도에\n사용하고 있어요."
20022-820-460-1 = "이것마저 없어져 버리면…\n어쩌죠…"
20022-820-470-1 = "오세치 이외의\n새해 요리에도\n도전해 보고 싶어요!"
20022-820-480-1 = "네, 뭐, 그걸 다 먹으면…\n살이 찌겠지만요."
20022-820-490-1 = "새해 소원… 까지는\n아니지만,"
20022-820-500-1 = "올해에는 급식실이\n무사했으면 좋겠네요…"
20022-820-510-1 = "선생님, 어서 오세요.\n상가 분들이 여러 가지\n물품을 준비해 주셨어요."
20022-820-520-1 = "가게를 보는 건 처음이네요.\n에헤헤."
20022-820-530-1 = "축제도 요리대회도 끝났네요."
20022-820-540-1 = "저는 내일을 위한 준비가\n남아 있습니다만… 선생님은\n차분히 둘러보다 가세요."
20022-820-550-1 = "괜찮아요. 걱정하지 마세요."
20022-820-560-1 = "창고 관리라면, 나름대로\n자신이 있으니까요."
20022-820-570-1 = "네? 급양부 특제 요리,\n말씀이신가요……?"
20022-820-580-1 = "혹시 괜찮으시다면\n만들어 드릴까요?"
20022-820-590-1 = "아, 그거라면\n잠시만 기다려주세요."
20022-820-600-1 = "그건, 가장 추천하는 상품입니다!"
20022-820-610-1 = "앗… 네.\n이거 말씀하시는 거죠?"
20022-820-620-1 = "마음에 드셨어요?\n또 와 주세요!"
