[translation]
20034-820-960-1 = "ว้าว! คุณครู!\nขอพรวันปีใหม่\nไปแล้วหรือยังคะ?"
20034-820-970-1 = "ถ้ายังละก็...\nไปขอพรกับฉันมั้ยคะ?"
20034-820-980-1 = "ว่ากันว่าถ้ากินอะไร\nตอนอากาศหนาว\nร่างกายจะอบอุ่นขึ้นนะคะ"
20034-820-990-1 = "มีโอเซจิมากมาย\nกำลังรอพวกเรา\nอยู่นะคะ~"
20034-820-1000-1 = "มีอะไรที่สดใหม่..."
20034-820-1010-1 = "ไม่สิ มีอะไรที่น่ากินมั้ยนะ...\nอันนี้ก็ไม่ใช่..."
20034-820-1020-1 = "ค่ะ! ดูเหมือนจะมี\nเรื่องวุ่นวายเกิดขึ้นนะคะ"
20034-820-1030-1 = "ดูเป็นเรื่อง\nโกลาหล★เลยนะคะเนี่ย"
20034-820-1040-1 = "ฉันไม่ได้ไม่ชอบหรอกค่ะ"
20034-820-1050-1 = "แต่ก็มีหลายคนที่\nไม่สะดวกกับเรื่องแบบนี้ค่ะ"
20034-820-1060-1 = "บรรยากาศปีใหม่\nกำลังจะจบแล้วสินะคะ"
20034-820-1070-1 = "โอเซจิอร่อยสุดๆ~ ไปเลยค่ะ★"
20034-820-1080-1 = "มีเรื่องอะไรเหรอคะคุณครู?"
20034-820-1090-1 = "ตายจริง\nแกล้งฉันเล่นเหรอคะ?\nคุณครู~?"
20034-820-1100-1 = "จะไหวเหรอคะ?\nพอดีการแก้แค้นของฉัน..."
20034-820-1110-1 = "อาจจะพิเศษ\nอยู่นิดหน่อยนะคะ"
20034-820-1120-1 = "คุณครูเบื่อเหรอคะ?"
20034-820-1130-1 = "ฉันสามารถทำให้\nคุณครูหายเบื่อ\nได้นะคะ"
20034-820-1140-1 = "ว่ายังไงล่ะคะ...?"
20034-820-1150-1 = "คุณครูเนี่ย เจ้าเล่ห์จังนะคะ"
20034-820-1160-1 = "ค่ะ จับได้แล้วค่ะ★\nจากนี้ฉันไม่ปล่อยไปแน่ค่ะ~"
