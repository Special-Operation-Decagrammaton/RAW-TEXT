[translation]
20034-820-960-1 = "와아! 선생님!\n새해맞이 기원,\n이미 하셨나요?"
20034-820-970-1 = "아직이라면…\n저와 함께 어떠신가요?"
20034-820-980-1 = "추울 때 뭔가를 먹으면,\n몸이 따뜻해진다고\n하잖아요."
20034-820-990-1 = "자, 많은 오세치들이\n우리를 기다리고\n있다고요~?"
20034-820-1000-1 = "뭔가 싱싱한…"
20034-820-1010-1 = "아뇨, 먹음직스러운…\n이것도 아니고…"
20034-820-1020-1 = "네! 떠들썩한 일이\n벌어지고 있는 것 같아요."
20034-820-1030-1 = "여러 가지 의미로\n와장창★ 한 일이네요."
20034-820-1040-1 = "저는 싫어하지 않지만,"
20034-820-1050-1 = "이런 걸 어려워하는\n사람도 있을 테니까요."
20034-820-1060-1 = "설날 분위기도 끝나가네요."
20034-820-1070-1 = "오세치, 정~말 맛있었어요★"
20034-820-1080-1 = "무슨 일이신가요. 선생님?"
20034-820-1090-1 = "어머, 저한테\n장난치시는 건가요?\n선생님~?"
20034-820-1100-1 = "괜찮으시겠어요?\n저의 복수는…"
20034-820-1110-1 = "조금, 특별할 수도\n있는데요?"
20034-820-1120-1 = "선생님, 심심하신가요?"
20034-820-1130-1 = "저라면, 선생님을\n심심하지 않게\n해드릴 수 있는데,"
20034-820-1140-1 = "어떠신가요…?"
20034-820-1150-1 = "선생님만, 치사해요."
20034-820-1160-1 = "네, 잡았어요★\n이제 놓치지 않을 거예요~"
