[translation]
20034-820-960-1 = "わあ！先生！お参り、\nもう行きましたか？"
20034-820-970-1 = "まだでしたら…\n私と一緒に、\nいかがですか？"
20034-820-980-1 = "寒いときに何かを\n食べると、身体が\n温まるって言いますよね。"
20034-820-990-1 = "ほら、たくさんの\nお節が私たちを\n待ってますよ～？"
20034-820-1000-1 = "何か水々しい…"
20034-820-1010-1 = "違いますね、肉々しい…\nこれでもなくて…"
20034-820-1020-1 = "はい！騒々しいことが\n起こってるみたいです。"
20034-820-1030-1 = "いろんな意味で、\nめちゃくちゃ★ですね。"
20034-820-1040-1 = "私は嫌いじゃ\nないですけど、"
20034-820-1050-1 = "こういうの、苦手な方も\nいるかもしれません。"
20034-820-1060-1 = "お正月ムードも\n落ち着きましたね。"
20034-820-1070-1 = "お節、と～っても\n美味しかったです★"
20034-820-1080-1 = "何かありましたか？\n先生？"
20034-820-1090-1 = "あら、私に\nイタズラですか？\n先生～？"
20034-820-1100-1 = "いいんですか？\n私の仕返しは…"
20034-820-1110-1 = "ちょっと、\n変わってるかもですよ？"
20034-820-1120-1 = "先生、退屈ですか？"
20034-820-1130-1 = "私でしたら、先生を\n退屈させませんけど、"
20034-820-1140-1 = "いかがですか…？"
20034-820-1150-1 = "先生ばかりずるいです。"
20034-820-1160-1 = "はいっ、捕まえました★\nもう離しませんよ～"
