[translation]
20034-820-960-1 = "Wow, Sensei! Did you already make your New Year's resolution?"
20034-820-970-1 = "If you haven't yet... Would you like to make one with me?"
20034-820-980-1 = "They say hot food in cold weather is the best way to warm up your body."
20034-820-990-1 = "Huh? There's a bunch of osechi waiting for us?"
20034-820-1000-1 = "I want...something fresh..."
20034-820-1010-1 = "No. Something yummy... No, it's not that either..."
20034-820-1020-1 = "Yes! It looks like something exciting is happening."
20034-820-1030-1 = "In many ways, it's been a lively day. ★"
20034-820-1040-1 = "I don't mind it."
20034-820-1050-1 = "It might be challenging for other people though."
20034-820-1060-1 = "Seems the New Year's atmosphere is coming to a close."
20034-820-1070-1 = "The osechi was absolutely delicious. ★"
20034-820-1080-1 = "What's going on, Sensei?"
20034-820-1090-1 = "Oh my, are you teasing me, Sensei?"
20034-820-1100-1 = "Are you sure you want to play that game?"
20034-820-1110-1 = "My revenge is a very...special dish..."
20034-820-1120-1 = "You bored, Sensei?"
20034-820-1130-1 = "If I had my way, I'd make sure you never had a dull moment."
20034-820-1140-1 = "What do you say?"
20034-820-1150-1 = "Only for you, Sensei? That's not fair."
20034-820-1160-1 = "Yes! Gotcha. There's no escape! ★"
