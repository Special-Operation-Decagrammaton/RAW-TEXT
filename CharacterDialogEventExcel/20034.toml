[translation]
20034-820-960-1 = "哇！老師！\n參拜，已經去過了嗎？"
20034-820-970-1 = "如果還沒的話……\n和我一起，如何呀？"
20034-820-980-1 = "寒冷的時候吃點東西，\n身體會變得暖和對吧？"
20034-820-990-1 = "來，許多御節料理\n正在等著我們唷～？"
20034-820-1000-1 = "有種多汁……"
20034-820-1010-1 = "不對，豐滿……\n好像也不是……"
20034-820-1020-1 = "對了！是好像\n發生了熱鬧的事。"
20034-820-1030-1 = "在各種意義上，\n都非常混亂★呢。"
20034-820-1040-1 = "雖然我並不討厭…"
20034-820-1050-1 = "不過這種事，或許\n有人會覺得困擾呢。"
20034-820-1060-1 = "新年的氛圍\n也沉靜下來了呢。"
20034-820-1070-1 = "御節料理，\n真～的很好吃★"
20034-820-1080-1 = "有什麼事嗎？老師？"
20034-820-1090-1 = "哎呀，是在\n對我惡作劇嗎？\n老師～？"
20034-820-1100-1 = "這樣好嗎？\n我的復仇……"
20034-820-1110-1 = "可能，會有點特別唷？"
20034-820-1120-1 = "老師，你覺得無聊嗎？"
20034-820-1130-1 = "如果是我，應該\n不會讓老師無聊……"
20034-820-1140-1 = "意下如何呢……？"
20034-820-1150-1 = "只有老師太狡猾了。"
20034-820-1160-1 = "好，我抓到了★\n不會再放開了唷～"
