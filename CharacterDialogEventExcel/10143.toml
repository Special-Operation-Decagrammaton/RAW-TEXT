[translation]
10143-310 = "มาถึงดินแดนเร้นลับแล้วนะคะ...\nฮุฮุ เป็นยังไงบ้างคะ คุณครู?"
10143-320 = "ฉันเหรอคะ?\nรู้สึกแปลกใหม่\nและสนุกดีค่ะ"
10143-330 = "ไว้หลังจากนี้\nคุณครูพอจะมีเวลามั้ยคะ?"
10143-340 = "ฮุฮุ\nไม่ใช่เรื่องใหญ่อะไรหรอกค่ะ"
10143-350 = "ฉันก็แค่...\nฉันอยากไปเดินชม"
10143-360 = "สถานที่แห่งนี้\nกับคุณครูน่ะค่ะ"
10143-370 = "ได้มาเที่ยวแบบนี้\nกับคุณครูและทุกคน...\nดีจริงๆ เลยนะคะ"
10143-380 = "ฉันจะ\nไม่มีวันลืมค่ะ"
10143-390 = "เด็กๆ ช่างบริสุทธิ์\nจริงๆ นะคะ"
10143-400 = "เพราะพวกเขา\nเปิดรับสิ่งต่างๆ\nมากกว่าที่เราคิดค่ะ"
10143-410 = "เพราะอย่างนั้น เราจึงต้อง\nคอยชี้แนะพวกเขาค่ะ"
10143-420 = "เหมือนกับเวลาที่\nคุณครูมองพวกเรา..."
10143-430 = "แล้วมีความคิด\nแบบเดียวกันยังไงล่ะคะ"
10143-440 = "คุณครูทำงานหนัก\nมากเลยนะคะ\nค่ะ... เป็นอย่างนั้นจริงๆ"
10143-450 = "ถ้างั้น อย่างน้อยตั้งแต่ตอนนี้\nก็มาพักร้อนชดเชย..."
10143-460 = "ให้เต็มที่ด้วยกันมั้ยคะ?"
10143-470 = "เรียกฉันเหรอคะ คุณครู?\nวอร์มร่างกาย\nเรียบร้อยแล้วใช่มั้ยคะ?"
10143-480 = "ตอนลงน้ำน่ะ"
10143-490 = "ต้องค่อยๆ เอาขา\nจุ่มน้ำก่อนนะคะ"
10143-500 = "ค่ะ ฉันอยู่\nตรงนี้ค่ะ"
10143-510 = "ถ้ารู้สึกหนาวหรืออะไรละก็...\nฉันจะทำให้\nอุ่นเองค่ะ"
10143-520 = "ว้าย ตรงนั้นไม่ได้นะคะ\nคุณครู...!"
10143-530 = "อึก..."
10143-540 = "แต่ถ้าแค่นิดเดียว ฉันอาจ\nอนุญาตให้ก็ได้ค่ะ...?"
10143-550 = "จริงๆ เลย! คุณครูก็...\nจะโดนดุนะคะ!"
10143-560 = "เอาไว้ตอนที่เรา\nอยู่กันสองคนนะ\nเข้าใจใช่มั้ยคะ...?"
10143-570 = "สวัสดีค่ะ คุณครู!\nเชิญค่ะ!"
10143-580 = "ฉันชุนหลิง\nของคุณครูเองค่ะ!"
10143-590 = "ว้าว!\nคุณครูมาแล้วสินะคะ!"
10143-600 = "อยู่ในร่างนี้จะเป็นอะไร\nหรือเปล่าน่ะเหรอคะ?"
10143-610 = "ฮุฮุ สำหรับฉัน ไม่ว่าเมื่อไร\nก็ไม่เป็นไรนะคะ?"
10143-611 = "อ๊ะ คุณครู! ฮิฮิฮิ\nฉันกำลังรออยู่\nแบบนี้เลยนะคะ?"
10143-612 = "ถ้าทำงานเสร็จ~ ทั้งหมดแล้ว...\nไปเล่นสนุกกันมั้ยคะ?"
10143-613 = "แน่นอนว่า...\nแค่เราสองคนนะ... คะ"
10143-620 = "เป็นยังไงบ้างคะ คุณครู?\nรู้สึกแปลกใหม่มั้ยคะ?"
10143-630 = "เอ๋? เป็นอะไรไปเหรอคะ?"
10143-640 = "หรือว่า"
10143-650 = "ไม่อยากเล่น\nกับ 'ชุนหลิง'... คะ?"
10143-660 = "ฉันน่ะ"
10143-670 = "ชอบเวลาที่\nได้อยู่กับคุณครู\nที่สุดเลยค่ะ!"
10143-680 = "เพราะว่า...\nในตอนนี้"
10143-690 = "ฉันซื่อตรงกับ\nความรู้สึกได้จริงๆ ค่ะ"
10143-700 = "ร่างเด็กนี่สุดยอดที่สุดเลยค่ะ!"
10143-710 = "สุดยอดเลยค่ะ คุณครู!\nถูกรางวัลแล้วค่ะ!"
10143-720 = "ได้ยินว่าคนในย่านร้านค้า\nเตรียมรางวัลไว้ให้ค่ะ!"
10143-730 = "ว้าว! เท่สุดๆ ไปเลยค่ะ!\nคุณครู ฉันก็อยากเห็น\nรางวัลเหมือนกันค่ะ..."
10143-740 = "อะไรเหรอคะ? อะไรเหรอคะ?\nต้องเป็นของเด็ดๆ แน่เลยค่ะ!"
10143-750 = "อะไรเหรอคะ? อะไรเหรอคะ?\nต้องเป็นของเด็ดๆ แน่เลยค่ะ!"
10143-960 = "ถึงจะบอกว่าพักร้อน...\nแต่จริงๆ จุดประสงค์คือ\nการตรวจสอบนี่คะ"
10143-970 = "มาดูกำหนดการ\nของวันนี้มั้ยคะ?"
10143-980 = "พักร้อนครั้งนี้...\nได้มาทำภารกิจตรวจสอบ"
10143-990 = "ในหุบเขาเลย...\nอาจเป็นเรื่องที่มีความหมายก็ได้นะ"
10143-1000 = "คุณครู ถ้าไม่รังเกียจละก็\nรับผลไม้สักหน่อยมั้ยคะ?"
10143-1010 = "ถือว่าได้พักผ่อนด้วย...\nนี่ค่ะ"
10143-1020 = "ยอดเยี่ยมมากเลยค่ะ"
10143-1030 = "ดูเหมือนทางนั้นจะ\nเตรียมอะไรไว้ให้\nหลายอย่างนะคะ"
10143-1040 = "แน่นอนว่าเวลา\nของคุณครู ย่อมเป็น\nของคุณครูเอง..."
10143-1050 = "แต่บางครั้ง\nฉันก็คิดว่า..."
10143-1060 = "อยากแบ่งปัน\nเวลาบางส่วน\nด้วยกันค่ะ"
10143-1070 = "คุณครูรู้มั้ยคะ?\nบางครั้งฉันมักถูกทักว่า\nทำตัวไม่สมวัย..."
10143-1080 = "แต่บางครั้งการทำ\nแบบนั้นก็ได้ผลนะคะ"
10143-1090 = "อย่างเช่น...\nทำให้มีเวลา\nอยู่กับคุณครูแบบนี้"
10143-1100 = "ได้ง่ายขึ้น\nด้วยไงคะ...?"
