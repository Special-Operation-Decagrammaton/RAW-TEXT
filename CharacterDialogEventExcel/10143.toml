[translation]
10143-859-310-1 = "抵達祕境了……\n呵呵，感覺如何呢。\n老師？"
10143-859-320-1 = "我嗎？\n總覺得很新鮮，\n很開心哦。"
10143-859-330-1 = "待會能耽誤您\n一點時間嗎……？"
10143-859-340-1 = "不，並不是什麼大事。"
10143-859-350-1 = "只是……\n想和老師兩個人，"
10143-859-360-1 = "一起在這裡到處看看。"
10143-859-370-1 = "能和老師還有大家\n一起來旅行……\n我真的很開心。"
10143-859-380-1 = "我一定，\n不會忘記這一天的，\n直到永遠……"
10143-859-390-1 = "所謂的孩子，\n是非常純真的。"
10143-859-400-1 = "他們比我們想像中的\n接收了更多樣的東西。"
10143-859-410-1 = "所以，必須好好\n引導他們才行。"
10143-859-420-1 = "如同老師\n對待我們一樣……"
10143-859-430-1 = "願意如此地\n為我們著想。"
10143-859-440-1 = "辛苦您了，老師。\n嗯……真的是辛苦您了。"
10143-859-450-1 = "那個……方便的話，\n現在要不要一起……"
10143-859-460-1 = "去享受真正的旅行呢？"
10143-859-470-1 = "熱身運動\n有做確實嗎？"
10143-859-480-1 = "下水的時候……"
10143-859-490-1 = "要從腳開始慢慢潑水，\n讓身體適應溫度\n之後再下水哦。"
10143-859-500-1 = "是的，\n我就在這裡哦。"
10143-859-510-1 = "如果覺得冷的話……\n我會幫您暖和身體的。"
10143-859-520-1 = "哇，那裡不行，\n老師……！"
10143-859-530-1 = "唔……"
10143-859-540-1 = "只能一下下哦……"
10143-859-550-1 = "真是的！老師……\n不可以哦！"
10143-859-560-1 = "等到只剩下我們\n兩個人的時候再做吧。"
10143-859-570-1 = "你好！\n恭候多時了！"
10143-859-580-1 = "我是老師的\n小旬哦！"
10143-859-590-1 = "老師，歡迎回來！"
10143-859-600-1 = "咦？用小旬\n沒問題嗎……？"
10143-859-610-1 = "呵呵，\n我一直都沒問題哦！"
10143-859-611-1 = "啊，老師！\n耶嘿嘿。\n等你好久了！"
10143-859-612-1 = "該做的事全～部\n都做完了的話……\n要不要一起去玩呢？"
10143-859-613-1 = "當然是……\n只有我們兩個人哦。"
10143-859-620-1 = "耶嘿嘿，如何呢？\n有新鮮感嗎？"
10143-859-630-1 = "咦，怎麼了嗎？"
10143-859-640-1 = "難道是不想和\n「小旬」……"
10143-859-650-1 = "一起玩嗎……？"
10143-859-660-1 = "和老師在一起的時候……"
10143-859-670-1 = "是最幸福的。"
10143-859-680-1 = "因為……"
10143-859-690-1 = "可以坦率面對\n自己的心情。"
10143-859-700-1 = "變成小孩子的身體，\n真是太棒～了！"
10143-859-710-1 = "中獎了！\n好厲害！"
10143-859-720-1 = "那邊好像可以\n交換商品哦！"
10143-859-730-1 = "哇啊！好厲害！\n老師，再拿近一點\n讓我看看！"
10143-859-740-1 = "這到底是什麼呢……？\n一定是很厲害的東西哦！"
10143-859-750-1 = "這到底是什麼呢……？\n一定是很厲害的東西哦！"
10143-859-960-1 = "姑且，這也算是\n查核的一環哦。"
10143-859-970-1 = "來看看今天的行程吧。"
10143-859-980-1 = "沒想到查核對象\n竟然是這麼漂亮的溪谷……"
10143-859-990-1 = "總覺得，好期待呢。"
10143-859-1000-1 = "老師，不介意的話\n要不要來點水果呢？"
10143-859-1010-1 = "順便休息一下……\n來，請用。"
10143-859-1020-1 = "辛苦您了。"
10143-859-1030-1 = "那邊好像在幫忙\n做各種準備哦。"
10143-859-1040-1 = "那個……老師的時間，\n當然是屬於老師的……\n"
10143-859-1050-1 = "但就算只有一部分……\n只有一點點，也沒關係。"
10143-859-1060-1 = "要是能一起度過就好了，\n我有時候也會這麼想。"
10143-859-1070-1 = "雖然偶爾會被說\n太過冒失……"
10143-859-1080-1 = "但那也會有\n發揮奇效的時候哦。"
10143-859-1090-1 = "呵呵。是的。"
10143-859-1100-1 = "因為像這樣\n創造出一起\n相處的時間了呢。"
