[translation]
10143-859-310-1 = "秘境に到着……\nふふっ、いかがですか、\n先生？"
10143-859-320-1 = "私ですか？\nなんだか新鮮で、\n楽しいですよ。"
10143-859-330-1 = "後でお時間\nよろしいでしょうか……？"
10143-859-340-1 = "いえ、大したこと\nではありません。"
10143-859-350-1 = "ただ……先生と二人で、"
10143-859-360-1 = "ここを見て回りたくて。"
10143-859-370-1 = "先生と皆さんと一緒に\n旅行に来られて……。\nとてもうれしいです。"
10143-859-380-1 = "きっと、\n私はこの日を忘れません、\nずっと……。"
10143-859-390-1 = "子供というのは、\nとても純粋です。"
10143-859-400-1 = "私たちが思っている\n以上に色んなことを\n受け取っていて。"
10143-859-410-1 = "だから、導いて\nあげないと\nいけないんです。"
10143-859-420-1 = "先生が私たちに対して、"
10143-859-430-1 = "そう思って\nくださるように。"
10143-859-440-1 = "お疲れさまでした、先生。\nええ……本当に。"
10143-859-450-1 = "その……よかったら、\n今から一緒に……。"
10143-859-460-1 = "本当の旅行を\n楽しみませんか？"
10143-859-470-1 = "準備運動は\nしっかりしましたか？"
10143-859-480-1 = "水に入る時は、"
10143-859-490-1 = "足からゆっくり水をかけて\n温度に慣らしてから\n入るんですよ。"
10143-859-500-1 = "はい、\n私はここにいますよ。"
10143-859-510-1 = "もしも寒い\nようでしたら……\n温めてあげますからね。"
10143-859-520-1 = "わっ、そこは\nダメです、先生……っ！"
10143-859-530-1 = "っ……。"
10143-859-540-1 = "少しだけ、ですよ……。"
10143-859-550-1 = "もう！先生ったら……\nめっ、です！"
10143-859-560-1 = "二人きりになってから\nにしましょうね。"
10143-859-570-1 = "こんにちは！\nお待ちしてました！"
10143-859-580-1 = "先生の\nシュエリンですよ！"
10143-859-590-1 = "先生、\nおかえりなさい！"
10143-859-600-1 = "え？シュエリンで\n大丈夫なのか……？"
10143-859-610-1 = "ふふっ、私はいつでも\n大丈夫ですよ！"
10143-859-611-1 = "あっ、先生！えへへ。\nお待ちしてました！"
10143-859-612-1 = "やることぜーんぶ\n終わってるなら……\n遊びに行きませんか？"
10143-859-613-1 = "もちろん……\n二人きり、で。"
10143-859-620-1 = "えへへっ、\nどうでしょう？\n新鮮ですか？"
10143-859-630-1 = "あれ、\nどうかされたんですか？"
10143-859-640-1 = "もしかして\n「シュエリン」とは……。"
10143-859-650-1 = "遊びたくないのですか？"
10143-859-660-1 = "先生と一緒にいる時が、"
10143-859-670-1 = "一番幸せです。"
10143-859-680-1 = "だって……。"
10143-859-690-1 = "自分の気持ちに\n素直になれますから。"
10143-859-700-1 = "子供の身体になるのって、\n最高～です！"
10143-859-710-1 = "当たりです！\nすごいです！"
10143-859-720-1 = "あっちで商品と\n交換できるみたいですよ！"
10143-859-730-1 = "わあ！すごい！\n先生、もっと近くで\n見せてください！"
10143-859-740-1 = "これは\n一体何でしょう……？\nきっとすごいものですよ！"
10143-859-750-1 = "これは\n一体何でしょう……？\nきっとすごいものですよ！"
10143-859-960-1 = "一応、これも\n査察の一環なんです。"
10143-859-970-1 = "今日のスケジュールを\n見ていきましょうか。"
10143-859-980-1 = "査察対象がこんな\n綺麗な渓谷だなんて……。"
10143-859-990-1 = "なんだか、楽しみですね。"
10143-859-1000-1 = "先生、よかったら\nフルーツを頂きませんか？"
10143-859-1010-1 = "休憩がてら……\nはい、どうぞ。"
10143-859-1020-1 = "お疲れさまでした。"
10143-859-1030-1 = "あちらの方で色々と\n準備してくださっている\nみたいですよ。"
10143-859-1040-1 = "その……先生のお時間は、\nもちろん先生の\nものですが……。"
10143-859-1050-1 = "一部だけでも……\nほんの少し、\nでもいいので。"
10143-859-1060-1 = "一緒に過ごせたら、\nと思う時が\nあるんです。"
10143-859-1070-1 = "たまにそそっかしすぎる\nと言われることが\nあるのですが……。"
10143-859-1080-1 = "それが功を奏す\n時もあるんです。"
10143-859-1090-1 = "ふふっ。ええ。"
10143-859-1100-1 = "こうやって一緒に\nいる時間が、\n作れましたから。"
