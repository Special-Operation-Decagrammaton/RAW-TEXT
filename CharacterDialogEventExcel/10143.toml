[translation]
10143-859-310-1 = "มาถึงดินแดนเร้นลับแล้วนะคะ...\nฮุฮุ เป็นยังไงบ้างคะ คุณครู?"
10143-859-320-1 = "ฉันเหรอคะ?\nรู้สึกแปลกใหม่\nและสนุกดีค่ะ"
10143-859-330-1 = "ไว้หลังจากนี้\nคุณครูพอจะมีเวลามั้ยคะ?"
10143-859-340-1 = "ฮุฮุ\nไม่ใช่เรื่องใหญ่อะไรหรอกค่ะ"
10143-859-350-1 = "ฉันก็แค่...\nฉันอยากไปเดินชม"
10143-859-360-1 = "สถานที่แห่งนี้\nกับคุณครูน่ะค่ะ"
10143-859-370-1 = "ได้มาเที่ยวแบบนี้\nกับคุณครูและทุกคน...\nดีจริงๆ เลยนะคะ"
10143-859-380-1 = "ฉันจะ\nไม่มีวันลืมค่ะ"
10143-859-390-1 = "เด็กๆ ช่างบริสุทธิ์\nจริงๆ นะคะ"
10143-859-400-1 = "เพราะพวกเขา\nเปิดรับสิ่งต่างๆ\nมากกว่าที่เราคิดค่ะ"
10143-859-410-1 = "เพราะอย่างนั้น เราจึงต้อง\nคอยชี้แนะพวกเขาค่ะ"
10143-859-420-1 = "เหมือนกับเวลาที่\nคุณครูมองพวกเรา..."
10143-859-430-1 = "แล้วมีความคิด\nแบบเดียวกันยังไงล่ะคะ"
10143-859-440-1 = "คุณครูทำงานหนัก\nมากเลยนะคะ\nค่ะ... เป็นอย่างนั้นจริงๆ"
10143-859-450-1 = "ถ้างั้น อย่างน้อยตั้งแต่ตอนนี้\nก็มาพักร้อนชดเชย..."
10143-859-460-1 = "ให้เต็มที่ด้วยกันมั้ยคะ?"
10143-859-470-1 = "เรียกฉันเหรอคะ คุณครู?\nวอร์มร่างกาย\nเรียบร้อยแล้วใช่มั้ยคะ?"
10143-859-480-1 = "ตอนลงน้ำน่ะ"
10143-859-490-1 = "ต้องค่อยๆ เอาขา\nจุ่มน้ำก่อนนะคะ"
10143-859-500-1 = "ค่ะ ฉันอยู่\nตรงนี้ค่ะ"
10143-859-510-1 = "ถ้ารู้สึกหนาวหรืออะไรละก็...\nฉันจะทำให้อบอุ่นเองค่ะ"
10143-859-520-1 = "ว้าย ตรงนั้นไม่ได้นะคะ\nคุณครู...!"
10143-859-530-1 = "อึก..."
10143-859-540-1 = "แต่ถ้าแค่นิดเดียว ฉันอาจ\nอนุญาตให้ก็ได้ค่ะ...?"
10143-859-550-1 = "จริงๆ เลย! คุณครูก็...\nจะโดนดุนะคะ!"
10143-859-560-1 = "เอาไว้ตอนที่เรา\nอยู่กันสองคนนะ\nเข้าใจใช่มั้ยคะ...?"
10143-859-570-1 = "สวัสดีค่ะ คุณครู!\nเชิญค่ะ!"
10143-859-580-1 = "ฉันชุนหลิง\nของคุณครูเองค่ะ!"
10143-859-590-1 = "ว้าว!\nคุณครูมาแล้วสินะคะ!"
10143-859-600-1 = "อยู่ในร่างนี้จะเป็นอะไร\nหรือเปล่าน่ะเหรอคะ?"
10143-859-610-1 = "ฮุฮุ สำหรับฉัน ไม่ว่าเมื่อไร\nก็ไม่เป็นไรนะคะ?"
10143-859-611-1 = "อ๊ะ คุณครู! ฮิฮิฮิ\nฉันกำลังรออยู่\nแบบนี้เลยนะคะ?"
10143-859-612-1 = "ถ้าทำงานเสร็จ~ ทั้งหมดแล้ว...\nไปเล่นสนุกกันมั้ยคะ?"
10143-859-613-1 = "แน่นอนว่า...\nแค่เราสองคนนะ... คะ"
10143-859-620-1 = "เป็นยังไงบ้างคะ คุณครู?\nรู้สึกแปลกใหม่มั้ยคะ?"
10143-859-630-1 = "เอ๋? เป็นอะไรไปเหรอคะ?"
10143-859-640-1 = "หรือว่า"
10143-859-650-1 = "ไม่อยากเล่น\nกับ 'ชุนหลิง'... คะ?"
10143-859-660-1 = "ฉันน่ะ"
10143-859-670-1 = "ชอบเวลาที่\nได้อยู่กับคุณครู\nที่สุดเลยค่ะ!"
10143-859-680-1 = "เพราะว่า...\nในตอนนี้"
10143-859-690-1 = "ฉันซื่อตรงกับ\nความรู้สึกได้จริงๆ ค่ะ"
10143-859-700-1 = "ร่างเด็กนี่สุดยอดที่สุดเลยค่ะ!"
10143-859-710-1 = "สุดยอดเลยค่ะ คุณครู!\nถูกรางวัลแล้วค่ะ!"
10143-859-720-1 = "ได้ยินว่าคนในย่านร้านค้า\nเตรียมรางวัลไว้ให้ค่ะ!"
10143-859-730-1 = "ว้าว! เท่สุดๆ ไปเลยค่ะ!\nคุณครู ฉันก็อยากเห็น\nรางวัลเหมือนกันค่ะ..."
10143-859-740-1 = "อะไรเหรอคะ? อะไรเหรอคะ?\nต้องเป็นของเด็ดๆ แน่เลยค่ะ!"
10143-859-750-1 = "อะไรเหรอคะ? อะไรเหรอคะ?\nต้องเป็นของเด็ดๆ แน่เลยค่ะ!"
10143-859-960-1 = "ถึงจะบอกว่าพักร้อน... แต่จริงๆ แล้ว\nจุดประสงค์คือการตรวจสอบค่ะ"
10143-859-970-1 = "มาดูกำหนดการ\nของวันนี้มั้ยคะ?"
10143-859-980-1 = "พักร้อนครั้งนี้...\nได้มาทำภารกิจตรวจสอบ"
10143-859-990-1 = "ในหุบเขาเลย...\nอาจเป็นเรื่องที่มีความหมายก็ได้นะ"
10143-859-1000-1 = "คุณครู ถ้าไม่รังเกียจละก็\nรับผลไม้สักหน่อยมั้ยคะ?"
10143-859-1010-1 = "ถือว่าได้พักผ่อนด้วย...\nนี่ค่ะ"
10143-859-1020-1 = "ยอดเยี่ยมมากเลยค่ะ"
10143-859-1030-1 = "ดูเหมือนทางนั้นจะเตรียมอะไร\nไว้ให้หลายอย่างเลยนะคะ"
10143-859-1040-1 = "แน่นอนว่าเวลาของคุณครู\nย่อมเป็นของคุณครูเอง..."
10143-859-1050-1 = "แต่บางครั้ง\nฉันก็คิดว่า..."
10143-859-1060-1 = "อยากแบ่งปันเวลาบางส่วน\nด้วยกันค่ะ"
10143-859-1070-1 = "คุณครูรู้มั้ยคะ? บางครั้งฉัน\nมักถูกทักว่าทำตัวไม่สมวัย..."
10143-859-1080-1 = "แต่บางครั้งการทำ\nแบบนั้นก็ได้ผลนะคะ"
10143-859-1090-1 = "อย่างเช่น... ทำให้มีเวลา\nอยู่กับคุณครูแบบนี้"
10143-859-1100-1 = "ได้ง่ายขึ้นด้วยไงคะ...?"
