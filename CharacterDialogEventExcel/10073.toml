[translation]
10073-828-10-1 = "여기에요, 선생님.\n조사 준비는\n다 해두었습니다."
10073-828-20-1 = "여름은 무덥고…….\n서 있는 것만으로,\n힘에 겨워요…."
10073-828-30-1 = "이제\n절반 정도 왔나……."
10073-828-40-1 = "곧 있으면, 이곳에서의\n조사도 끝이네요."
10073-828-50-1 = "마, 만약을 위해…\n확인해 보시죠."
10073-828-60-1 = "서, 선생님?\n왜, 왜 그러시죠?"
10073-828-70-1 = "제 얼굴에 뭔가\n묻어 있나요...?"
10073-828-80-1 = "갑자기\n그렇게 부르셔도……."
10073-828-90-1 = "필요한 게 있으시면,\n말로 해 주세요……."
10073-828-100-1 = "밖은,\n좋아하지 않아도……."
10073-828-110-1 = "단둘이 있을 수 있었고…\n나쁘지만은 않네요."
10073-828-530-1 = "그럼,\n조사 내용을 정리해 볼까요."
10073-828-540-1 = "여러가지, 알게 됐네요."
10073-828-550-1 = "음…\n아직 뭔가 더 조사하실 거라도?"
10073-828-560-1 = "저, 저를 조사해도,\n아무것도 안나와요…!"
10073-828-570-1 = "이건……. 의미가 있겠네요."
10073-828-580-1 = "역시, 선생님."
