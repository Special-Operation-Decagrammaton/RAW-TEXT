[translation]
10073-828-10-1 = "ทางนี้ค่ะ คุณครู\nฉันเตรียมการสำรวจไว้แล้วค่ะ"
10073-828-20-1 = "ฤดูร้อนนี่ ช่างร้อนอบอ้าว...\nแค่ยืนอยู่เฉยๆ ก็หมดแรงแล้วค่ะ..."
10073-828-30-1 = "ตอนนี้ เรามาถึง\nครึ่งทางแล้วไหมนะ..."
10073-828-40-1 = "อีกนิดเดียว การสำรวจที่นี่\nก็คงเสร็จแล้วละค่ะ"
10073-828-50-1 = "คะ.. แค่เผื่อไว้น่ะค่ะ...\nลองตรวจสอบดูสิคะ"
10073-828-60-1 = "คะ... คุณครู?\nทะ... ทำไมจ้องแบบนั้นล่ะคะ?"
10073-828-70-1 = "มีอะไรติดอยู่\nบนหน้าฉันเหรอคะ..."
10073-828-80-1 = "จะเรียกหาฉัน\nกะทันหันแบบนั้น..."
10073-828-90-1 = "ถ้ามีอะไรที่ต้องการ\nก็พูดบอกกันนะคะ..."
10073-828-100-1 = "ถึงฉันจะ\nไม่ชอบไปข้างนอก..."
10073-828-110-1 = "แต่ได้อยู่ด้วยกันสองต่อสอง...\nมันก็ไม่เลวนะคะ"
10073-828-530-1 = "ถ้างั้น เรามาสรุป\nการสำรวจดีไหมคะ"
10073-828-540-1 = "ได้รู้อะไรหลายอย่างเลยนะคะ"
10073-828-550-1 = "อืม... มีอะไรอยากสำรวจเพิ่ม\nอีกเหรอคะ?"
10073-828-560-1 = "สะ... สำรวจฉันไป\nก็ไม่ได้อะไรขี้นมาหรอกค่ะ...!"
10073-828-570-1 = "ของชิ้นนี้... น่าจะมี\nความหมายเลยนะคะ"
10073-828-580-1 = "คุณครูนี่เยี่ยมจริงๆ"
