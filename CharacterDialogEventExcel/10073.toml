[translation]
10073-828-10-1 = "Over here, Sensei. Preparations for the investigation have been made."
10073-828-20-1 = "The summer is so hot... Even standing here doing nothing is exhausting..."
10073-828-30-1 = "Are we about halfway...?"
10073-828-40-1 = "Our investigation here will be over soon."
10073-828-50-1 = "Let's check just in case..."
10073-828-60-1 = "S-Sensei? Wh-What's wrong?"
10073-828-70-1 = "Is there something on my face...?"
10073-828-80-1 = "Even if you suddenly call me like that..."
10073-828-90-1 = "If you need anything, please just tell me..."
10073-828-100-1 = "Even though I don't really like being outside..."
10073-828-110-1 = "...it wasn't too bad since I got to be alone with you."
10073-828-530-1 = "Now, let me summarize our investigation findings."
10073-828-540-1 = "We've come to learn many things."
10073-828-550-1 = "Hmm... Is there more to investigate?"
10073-828-560-1 = "There's nothing more to discover, not even if you investigated me...!"
10073-828-570-1 = "This...could be very meaningful."
10073-828-580-1 = "I knew I could count on you, Sensei."
