[translation]
10073-828-10-1 = "こちらです、先生。\n調査準備は、\n済んでおりますので。"
10073-828-20-1 = "夏は、蒸し暑くて……。\nた、立っているだけで、\n精一杯です……。"
10073-828-30-1 = "これで、\nあと半分……。"
10073-828-40-1 = "もう少しで、\nここでの調査も\n終わりですね。"
10073-828-50-1 = "ね、念のため……\n確認してみてください。"
10073-828-60-1 = "せ、先生？\nど、どうしました？"
10073-828-70-1 = "私の顔に、\n何かついて\nいるんですか……？"
10073-828-80-1 = "いきなり、\n呼ばれても……。"
10073-828-90-1 = "……用件があるのなら、\n言葉にしてください……。"
10073-828-100-1 = "外は、好きでは\nありませんが……。"
10073-828-110-1 = "二人きりに\nなれましたし……\n良しとします。"
10073-828-530-1 = "それでは、\n調査内容をまとめましょう。"
10073-828-540-1 = "色々と、分かってきました。"
10073-828-550-1 = "えーと……\nまだ何か、調べたい事でも？"
10073-828-560-1 = "わ、私を調べても、\n何にもなりませんよ……！"
10073-828-570-1 = "これは……\n意味がありそうですね。"
10073-828-580-1 = "流石です、先生。"
