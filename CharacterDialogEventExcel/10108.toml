[translation]
10108-842-10-1 = "เชิญค่ะ คุณครู!"
10108-842-20-1 = "ฉันไม่รู้เลยค่ะ\nว่าคุณครูจะมาน่ะ"
10108-842-30-1 = "สวัสดีค่ะ คุณครู"
10108-842-40-1 = "ฉันจะจัดปาร์ตี้ชุดนอน\nส่งท้ายปีน่ะค่ะ..."
10108-842-50-1 = "แต่ก็มีปัญหาน่าปวดหัว..."
10108-842-60-1 = "โค~ ยู~ กิ~!!!"
10108-842-70-1 = "ครั้งนี้ฉันจะ\nไม่ยอมให้จริงๆ แล้วนะคะ!"
10108-842-80-1 = "อย่าห้ามฉันนะคะ!!!"
10108-842-90-1 = "คลี่คลาย\nจนได้นะคะ..."
10108-842-100-1 = "เรื่องนี้ก็ต้อง\nขอบคุณคุณครูเลยนะคะ"
10108-842-110-1 = "โคยูกิน่ะเหรอคะ?"
10108-842-120-1 = "ฉันว่าจะหยวนๆ ให้...\nแค่ครั้งนี้ครั้งเดียวค่ะ"
10108-842-130-1 = "อ๊ะ มาแล้วสินะคะ คุณครู\nถ้ามีเวลาละก็...\nพักสักหน่อยแล้วค่อยไปมั้ยคะ?"
10108-842-140-1 = "คะ? ฉันในชุดนี้\nก็แปลกตาดีงั้นเหรอคะ?"
10108-842-150-1 = "ขะ... ขอบคุณค่ะ "
10108-842-160-1 = "ฉันได้ฟัง\nคำพูดแบบนี้จากคุณครูด้วย..."
10108-842-170-1 = "ดีใจจังเลยค่ะ"
10108-842-180-1 = "ฉันยังไม่รู้สึกเลยค่ะ\nว่าตัวเองเป็น\nเด็กนักเรียนม.ปลาย..."
10108-842-190-1 = "ถ้างั้นปกติแล้ว\nเห็นฉันเป็นยังไงเหรอคะ?!"
10108-842-200-1 = "บอร์ดเกมสนุกเพราะสมจริง\nแต่การควบคุมการพูด\nก็เป็นเรื่องที่ยุ่งยากอยู่นะคะ"
10108-842-210-1 = "นักเรียนมิลเลเนียมหลายคน\nก็บกพร่องในเรื่อง\nการจัดระเบียบนะคะ"
10108-842-220-1 = "นี่ คุณครู\nหยุดจิ้มเอว\nของฉันได้มั้ยคะ...?"
10108-842-230-1 = "ถ้าพูดว่าฉันน้ำหนักขึ้น\nหรืออะไรทำนองนั้น\nฉันจะโกรธจริงๆ ด้วยค่ะ"
10108-842-410-1 = "มีของที่ต้องการหรือเปล่าคะ?"
10108-842-420-1 = "ฉันกำลังเคลียร์ของสิ้นปีอยู่\nถ้าต้องการอะไรก็\nเอาไปได้เลยค่ะ"
10108-842-430-1 = "ฉันกำลังจัดของสำหรับ\nปาร์ตี้ชุดนอนอยู่ค่ะ"
10108-842-440-1 = "ถ้าคุณครูก็มีของที่อยากได้\nก็บอกฉันนะคะ"
10108-842-450-1 = "สวัสดีค่ะ คุณครู"
10108-842-460-1 = "ถ้าลืมอะไรตรงไหน\nก็ตรวจสอบให้รอบคอบ\nจนเสร็จเลยนะคะ!"
10108-842-470-1 = "แค่เตรียมปาร์ตี้เอง แต่รู้สึกเหมือนทำ\nให้งานบัญชีเลื่อนออกไปเลยนะคะ..."
10108-842-480-1 = "จะว่าไป\nที่ร้านสะดวกซื้อชาเล่ต์"
10108-842-490-1 = "ก็มีเด็กน่ารักๆ คนหนึ่ง\nที่ดูแลร้านอยู่นี่คะ..."
10108-842-500-1 = "เห็นเฝ้าอยู่หน้าเคาน์เตอร์ตลอดเลย\nไม่รู้ว่าจะได้พักผ่อนบ้างหรือเปล่านะคะ?"
10108-842-510-1 = "จะเอาชิ้นนั้นเหรอคะ?"
10108-842-520-1 = "เป็นการใช้จ่ายที่\nสมเหตุสมผลเลยค่ะ"
10108-842-530-1 = "ส่วนใบเสร็จ...\nอ้อ ฉันจะเก็บไว้เองค่ะ"
10108-842-540-1 = "ไว้ฉันจะใส่เพิ่มใน\nบัญชีของชาเล่ต์ให้ค่ะ"
10108-842-550-1 = "ฮุฮุ ฉันน่าจะวิเคราะห์รูปแบบการ\nใช้จ่ายของคุณครูได้เลยนะคะ"
