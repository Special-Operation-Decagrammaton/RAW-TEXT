[translation]
10108-842-10-1 = "Welcome, Sensei."
10108-842-20-1 = "I didn't think you would come."
10108-842-30-1 = "Hello, Sensei."
10108-842-40-1 = "We were going to have a pajama party to celebrate the end of the year, but..."
10108-842-50-1 = "...there's been a slight problem."
10108-842-60-1 = "KO! YU! KI!!!"
10108-842-70-1 = "I'm not letting her off easy this time! For real!"
10108-842-80-1 = "So please don't try to stop me!"
10108-842-90-1 = "Somehow, everything was resolved..."
10108-842-100-1 = "In a way, it's also thanks to you, Sensei."
10108-842-110-1 = "Are you talking about Koyuki?"
10108-842-120-1 = "...I'm going to let it go. Just this once."
10108-842-130-1 = "Ah, you're here, Sensei. Would you like to rest a little before you go? Only if you want to..."
10108-842-140-1 = "What? You find this side of me refreshing?"
10108-842-150-1 = "Th-Thank you. "
10108-842-160-1 = "Hearing that from you, Sensei..."
10108-842-170-1 = "It makes me really happy."
10108-842-180-1 = "You had the sudden realization that I'm a high school girl?"
10108-842-190-1 = "What was I to you before?!"
10108-842-200-1 = "Board games are realistic in that they are fun, but managing the pieces seems a bit tricky."
10108-842-210-1 = "This rings even more true when you consider certain Millennium students who are terrible at organizing and tidying up."
10108-842-220-1 = "Um, Sensei? Would you please stop poking my waist...?"
10108-842-230-1 = "...I'm going to genuinely get mad if you try to point out that I've gained weight."
10108-842-410-1 = "Do you need something?"
10108-842-420-1 = "With the end of the year approaching, I've been organizing supplies. Feel free to take anything you need."
10108-842-430-1 = "I'm collecting supplies for the pajama party."
10108-842-440-1 = "If there's anything you need, just let me know."
10108-842-450-1 = "Hello, Sensei."
10108-842-460-1 = "Make sure you didn't miss anything! Please check carefully!"
10108-842-470-1 = "Preparing for this party just feels like an extension of my accounting work..."
10108-842-480-1 = "Come to think of it, at the convenience store in Schale..."
10108-842-490-1 = "...there's a cute kid who manages the store."
10108-842-500-1 = "She's always there. I wonder if she gets to take proper breaks."
10108-842-510-1 = "Is that what you'd like to go with?"
10108-842-520-1 = "It seems like a reasonable choice."
10108-842-530-1 = "I'll hang onto the receipt..."
10108-842-540-1 = "I'll put it down in Schale's ledger later."
10108-842-550-1 = "Heehee. I'll be able to analyze your shopping habits this way, Sensei."
