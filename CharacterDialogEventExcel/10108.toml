[translation]
10108-842-10-1 = "いらっしゃっ\nたんですね、\n先生！"
10108-842-20-1 = "まさか先生が来るとは\n思いませんでした。"
10108-842-30-1 = "こんにちは、先生。"
10108-842-40-1 = "せっかくだから\nパジャマパーティーを、\nと思ったんですが……"
10108-842-50-1 = "ちょっと厄介な\nことに\nなってしまって…。"
10108-842-60-1 = "コ～ユ～キ～！！"
10108-842-70-1 = "今度こそ\n許さないんだから！"
10108-842-80-1 = "先生も\n止めないで\nくださいね！？"
10108-842-90-1 = "なんとか\n解決できましたね……"
10108-842-100-1 = "今回も先生には\nお世話になりました。"
10108-842-110-1 = "コユキ、ですか？"
10108-842-120-1 = "……今回は、大目に\n見てあげるつもりです。"
10108-842-130-1 = "あ、いらしたんですね。\n先生。よかったら……\n少し休んでいきませんか？"
10108-842-140-1 = "えっ？\nこういう私も新鮮……？"
10108-842-150-1 = "あ、ありがとう\nございます。"
10108-842-160-1 = "……先生に\nそう言われると……"
10108-842-170-1 = "嬉しいですね、すごく。"
10108-842-180-1 = "あらためて私が女子\n高生だって実感した…？"
10108-842-190-1 = "普段は私のこと、どう\n思っていたんですか！？"
10108-842-200-1 = "ボードゲームは現実味が\nあって楽しいけど、\n駒の管理が大変ですね。"
10108-842-210-1 = "ミレニアムには、\n整理整頓が苦手な子、\n多いんですよね……。"
10108-842-220-1 = "あの、先生？\nお腹周り、つつくの、\nやめてくれませんか…？"
10108-842-230-1 = "…太ったとか言ったら、\n本気で怒りますからね。"
10108-842-410-1 = "必要なものはありましたか？"
10108-842-420-1 = "年末を迎えて備品を\n整理しているので、よかったら\n持っていってください。"
10108-842-430-1 = "パジャマパーティーのために\n備品を整理してるんです。"
10108-842-440-1 = "先生も必要なものが\nあれば言ってくださいね。"
10108-842-450-1 = "こんにちは、先生。"
10108-842-460-1 = "やり残したことはないか、\n最後まで\nチェックしていってくださいね！"
10108-842-470-1 = "パーティー準備のはずなのに、\nなんだか会計の仕事を\nしているみたいです……。"
10108-842-480-1 = "そういえばシャーレの\nコンビニも、"
10108-842-490-1 = "女の子が１人で売り場管理を\nしてましたよね……？"
10108-842-500-1 = "ほとんど席を外\nしてなかったのですが、\nちゃんと休めてるのでしょうか。"
10108-842-510-1 = "それにしますか？"
10108-842-520-1 = "合理的な消費ですね。"
10108-842-530-1 = "領収証は……\nあ、こっちで取っておきますね。"
10108-842-540-1 = "シャーレの家計簿に\n書いておきます。"
10108-842-550-1 = "ふふっ、先生の消費パターンが\n分析できそうです。"
