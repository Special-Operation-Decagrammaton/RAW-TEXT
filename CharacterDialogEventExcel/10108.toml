[translation]
10108-842-10-1 = "你來啦，老師！"
10108-842-20-1 = "沒想到老師會過來。"
10108-842-30-1 = "你好，老師。"
10108-842-40-1 = "難得有機會就來\n開個睡衣派對，\n本來是這麼想的……"
10108-842-50-1 = "結果卻變得\n有點傷腦筋……"
10108-842-60-1 = "小～雪～！！"
10108-842-70-1 = "這次我絕對\n不會放過你的！"
10108-842-80-1 = "老師也請不要\n阻止我哦！？"
10108-842-90-1 = "總算是解決了呢……"
10108-842-100-1 = "這次也受老師照顧了。"
10108-842-110-1 = "小雪，是嗎？"
10108-842-120-1 = "……這次，\n我打算放過他。"
10108-842-130-1 = "啊，你來啦，老師。\n如果不介意的話……\n要不要稍微休息一下？"
10108-842-140-1 = "咦？\n這樣的我也很新鮮？"
10108-842-150-1 = "謝，謝謝。"
10108-842-160-1 = "能聽到老師\n這麼說……"
10108-842-170-1 = "真讓人開心，非常開心。"
10108-842-180-1 = "再次認知到了\n我是個女高中生……？"
10108-842-190-1 = "所以你平常都是\n怎麼看待我的！？"
10108-842-200-1 = "桌遊的真實感雖然\n有趣，但棋子的管理\n也很不容易呢。"
10108-842-210-1 = "而且在千年，\n不擅長整理整頓的孩子，\n還挺多的……"
10108-842-220-1 = "那個，老師？\n能請你不要再戳我的\n肚子附近了嗎……？"
10108-842-230-1 = "……要是敢說我胖了，\n我真的會生氣的哦。"
10108-842-410-1 = "有需要什麼東西嗎？"
10108-842-420-1 = "我正在整理迎接年末的備品，\n有需要的話請儘管拿吧。"
10108-842-430-1 = "為了睡衣派對，\n我正在整理備品。"
10108-842-440-1 = "老師如果需要什麼的話，\n請跟我說一聲吧。"
10108-842-450-1 = "你好，老師。"
10108-842-460-1 = "有沒有遺漏什麼事情，\n還請在結束之前確認一下哦！"
10108-842-470-1 = "明明是在做派對的準備，\n總覺得像是在做\n會計的工作一樣……"
10108-842-480-1 = "話說夏萊的便利商店，"
10108-842-490-1 = "也是由一個女孩子單獨\n在管理賣場對吧……？"
10108-842-500-1 = "他幾乎不曾離開崗位，\n真的有好好休息嗎？"
10108-842-510-1 = "要那個嗎？"
10108-842-520-1 = "真是合理的消費呢。"
10108-842-530-1 = "收據就……\n啊，我先幫你收著吧。"
10108-842-540-1 = "之後再幫你記到\n夏萊的記帳本裡。"
10108-842-550-1 = "呵呵，好像能分析出\n老師的消費習慣呢。"
