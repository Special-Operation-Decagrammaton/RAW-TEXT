[translation]
20037-837-150-1 = "นี่ ครู\nเหนื่อยหน่อยนะ"
20037-837-160-1 = "สวนน้ำ...\nฉันก็ชอบที่นี่นะ\nถ้าไม่ได้มาทำงานน่ะ..."
20037-837-170-1 = "ทุกคนกระตือรือร้นจังเลย\nคงเพราะว่ามาเที่ยวสินะ?"
20037-837-180-1 = "เอาละ ใกล้ถึง\nเวลาเลิกงานแล้ว!"
20037-837-190-1 = "ถึงจะเกิดเรื่องขึ้นมากมาย\nแต่ก็จบลงจนได้สินะ\nครูก็ทำได้ดีเหมือนกัน"
20037-837-200-1 = "สไลเดอร์สระน้ำเหรอ?"
20037-837-210-1 = "อ่า ไม่ได้กลัวหรอก\nต้องบอกว่า... ขะ...\nขี้เกียจเล่นมากกว่า..."
20037-837-220-1 = "ร้อนจัง... ต้องมาทำงาน\nในวันแบบนี้ แย่ที่สุดเลย~"
20037-837-230-1 = "ยิ่งเป็นวันที่ร้อนแบบนี้\nก็ยิ่งต้องเติมน้ำตาลนะ"
20037-837-240-1 = "เพราะแบบนี้ละ\nโดนัทถึงได้เป็นสิ่งสำคัญ"
20037-837-250-1 = "อ๊ะ! ทะ... ทุกอย่าง\nเรียบร้อยดี!\nเอ๋ ครู? ตกใจหมดเลย"
20037-837-480-1 = "มาแลกของเหรอ?\nมีของหลายอย่างเลย\nลองเลือกดูนะ"
20037-837-490-1 = "ฮ้า~ เย็นสบายจัง~\nครูก็พักที่นี่ก่อน\nแล้วค่อยไปนะ"
20037-837-500-1 = "ร้านปิดแล้ว~\nเอาละ ไปเลี้ยงฉลอง\nที่เสร็จงานกันเถอะครู"
20037-837-510-1 = "ต่อให้เป็นครู\nก็ให้ฟรีไม่ได้หรอกนะ"
20037-837-520-1 = "อย่ามองฉันสิ มองของนู่น~"
20037-837-530-1 = "ว้าว?! มีอะไรแบบนี้ด้วยเหรอ?"
20037-837-540-1 = "คะ... คุณครูดวงดีกว่าที่คิดนะเนี่ย?"
20037-837-550-1 = "ยินดีด้วยน้า~\nได้รางวัลที่ 1 เลย"
20037-837-560-1 = "น่าจะเสร็จหมดแล้วเนอะ\nเราเหนื่อยกันทั้งคู่เลยนะครู"
