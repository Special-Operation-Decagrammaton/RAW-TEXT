[translation]
20037-837-150-1 = "やぁ、先生。お疲れー"
20037-837-160-1 = "ウォーターパーク……\n仕事じゃなきゃ、\n好きな場所なのに……"
20037-837-170-1 = "みんな元気いいね～。\n遊びに来てるからか。"
20037-837-180-1 = "さあ、もうすぐ\n退勤時間だよ！"
20037-837-190-1 = "色々あったけど、\nなんとか終わったね。\n先生もお疲れさん。"
20037-837-200-1 = "ウォータースライダー？"
20037-837-210-1 = "いや、\n怖いというより……め、\nめんどくさいかなぁ……"
20037-837-220-1 = "あっつい……\nこんな日に仕事だなんて、\n最悪だよ～"
20037-837-230-1 = "こういう熱い日に\nこそ糖分補給は\n大事だからね。"
20037-837-240-1 = "そう、ドーナッツは\n生活必需品ってわけ。"
20037-837-250-1 = "はっ！げ、現場異常無し！\n……って、先生？\nびっくりしたぁ。"
20037-837-480-1 = "交換しに来たの？\n色々あるから見てって～"
20037-837-490-1 = "は～ぁ、すずし～～\n先生もゆっくりして\nいってよ。"
20037-837-500-1 = "営業終了～っとさぁ、\n先生。打ち上げにでも\n行こっか？"
20037-837-510-1 = "いくら先生でも、\nタダでは渡せないなぁ？"
20037-837-520-1 = "私じゃなくて、\n商品を見なよ～"
20037-837-530-1 = "うわぁ！？\nそんなのあったんだ！"
20037-837-540-1 = "せ、先生。\n思ったより運がいいんだね？"
20037-837-550-1 = "おめでと～これ、1等だよ。"
20037-837-560-1 = "これで全部終わりかな。\nいやぁ、2人とも頑張ったね。"
