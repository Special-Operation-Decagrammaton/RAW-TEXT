[translation]
20037-837-150-1 = "呀，老師。辛苦了～"
20037-837-160-1 = "水上樂園……\n不是工作的話，\n還挺喜歡的說……"
20037-837-170-1 = "大家都很有精神呢～\n大概因為是來玩的吧。"
20037-837-180-1 = "好，\n快到下班時間了！"
20037-837-190-1 = "雖然發生了很多事，\n但總算是結束了。\n老師也辛苦了。"
20037-837-200-1 = "滑水道？"
20037-837-210-1 = "不，與其說是害怕……\n不如說是麻煩吧……"
20037-837-220-1 = "好熱……竟然\n得在這種日子工作，\n真是糟透了～"
20037-837-230-1 = "像這種炎熱的日子，\n糖分補給才格外重要呢。"
20037-837-240-1 = "沒錯，所以甜甜圈\n就是生活必需品。"
20037-837-250-1 = "哈！現，現場無異常！\n……咦，老師？\n嚇我一跳。"
20037-837-480-1 = "你是來換東西的嗎？\n這裡有很多品項可以看～"
20037-837-490-1 = "哈～好涼快～～\n老師你也來放鬆一下吧。"
20037-837-500-1 = "營業結束～\n老師，要不要去慶祝一下？"
20037-837-510-1 = "就算是老師，\n也不能算你免費唷？"
20037-837-520-1 = "別看我，看商品啦～"
20037-837-530-1 = "哇！？原來有這種東西啊！"
20037-837-540-1 = "老，老師。\n你的運氣比我想的還要好呢？"
20037-837-550-1 = "恭喜～這個，\n是一等獎唷。"
20037-837-560-1 = "這樣就全部結束了吧。\n哎呀，我們兩人都很努力呢。"
