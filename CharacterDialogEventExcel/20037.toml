[translation]
20037-837-150-1 = "Hey, Sensei, I see you've been working hard."
20037-837-160-1 = "The water park... I'd love it...if I wasn't working here!"
20037-837-170-1 = "Everyone's so full of energy. Is it because they're here to play?"
20037-837-180-1 = "Oh, yay! It's almost time to leave work!"
20037-837-190-1 = "We've had our ups and downs, but we made it through the day. You worked hard as well, Sensei."
20037-837-200-1 = "The water slide?"
20037-837-210-1 = "No, it's not that it's scary... It's more like...b-bothersome, I'd say..."
20037-837-220-1 = "It's so hot... Working on a day like this is the worst!"
20037-837-230-1 = "On a hot day like this, it's essential to keep your sugar levels up."
20037-837-240-1 = "Therefore, donuts are a must."
20037-837-250-1 = "Ack! E-Everything's under control at the scene! ...Huh, Sensei? You startled me."
20037-837-480-1 = "Are you here for an exchange? We have a variety of options, so feel free to have a look around."
20037-837-490-1 = "Ahh... It's so nice and cool. You should relax a little while longer."
20037-837-500-1 = "The shop is now closed. How about we go out for a little after-work get-together?"
20037-837-510-1 = "Even for you, Sensei, I can't give it away for free."
20037-837-520-1 = "Check out the products, not me!"
20037-837-530-1 = "Wow?! There's such a thing?"
20037-837-540-1 = "S-Sensei, you're luckier than I thought!"
20037-837-550-1 = "Congrats! You got first place!"
20037-837-560-1 = "Is this it? Wow, we both worked really hard."
