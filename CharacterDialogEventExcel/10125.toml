[translation]
10125-849-10-1 = "ผู้ถูกนำทางภายใต้\nการชี้นำของอาร์คาน่าเอ๋ย\nเชิญทางนี้"
10125-849-20-1 = "เอาละ มาเปิดเผย\nความลับที่หลับใหลอยู่ที่..."
10125-849-30-1 = "ไวลด์ฮันต์กันเถอะ"
10125-849-40-1 = "อืม... ปฏิบัติการครั้งนี้\nจะให้ฝ่ายดูแลหอพัก\nรู้ไม่ได้เด็ดขาด..."
10125-849-50-1 = "อีกนิดเดียวเท่านั้น\nเราก็จะได้พบกับบทสรุป\nที่จะไม่มีวันเสียใจภายหลัง!"
10125-849-60-1 = "คราวหน้า..."
10125-849-70-1 = "ฉันอยากสร้างสรรค์\nผลงานที่ยอดเยี่ยม\nร่วมกับมาสเตอร์อีกค่ะ"
10125-849-80-1 = "อุฮุฮุ สนใจ\nเรื่องเวทมนตร์เหรอคะ?"
10125-849-90-1 = "มาสเตอร์\nฉันดูดวงให้มั้ยคะ?"
10125-849-100-1 = "แน่นอนว่าฉัน\nไม่เก็บค่าครูหรอกค่ะ"
10125-849-110-1 = "บอกฉันได้เลยนะคะ!"
10125-849-120-1 = "ยะ... อย่าแตะ\nหมวกสิคะ"
10125-849-130-1 = "นี่เป็นสัญลักษณ์\nของนักเวทนะคะ\nห้ามถอดออกค่ะ!"
10125-849-140-1 = "อ๊ะ นั่นมัน\nอักขระเวท...!"
10125-849-150-1 = "ถ้ายังจับไม่เลิก...\nอาจจะระเบิดก็ได้นะ\nอุฮุฮุ"
10125-849-280-1 = "เอาละ มาทดลอง\nอุปกรณ์เวทกันเถอะ!"
10125-849-290-1 = "โอ้ ของพวกนี้\nแค่มองก็สัมผัสได้ถึงพลังเวท...!"
10125-849-300-1 = "ที่นี่คงจะรวบรวมอุปกรณ์เวท\nไม่ได้อีกแล้วละ"
10125-849-310-1 = "แต่ก็ไม่เป็นไรหรอกนะคะ!"
10125-849-320-1 = "ทั้งอุปกรณ์เวทและ\nความทรงจำกับมาสเตอร์"
10125-849-330-1 = "ก็ยังคงสร้างใหม่ได้มากมาย\nในอนาคตนี่ค่ะ"
10125-849-340-1 = "มีของที่ถูกใจ\nหรือเปล่าคะ?"
10125-849-350-1 = "ฉันคาดหวังความลึกซึ้ง\nในสุนทรียภาพของมาสเตอร์\nอยู่นะคะ!"
10125-849-360-1 = "อ่า เป็นอุปกรณ์ที่\nมีพลังเวทอยู่เต็มเปี่ยมเลยนะคะ!"
10125-849-370-1 = "สมกับเป็นมาสเตอร์จริงๆ\nสายตาเฉียบคมมากค่ะ!"
10125-849-380-1 = "ถ้างั้นมาทดลองใช้\nกันเลยมั้ยคะ?!"
10125-849-390-1 = "อ๊ะ ฉันก็คิดว่าชิ้นนั้น\nเป็นของที่ดีเหมือนกันค่ะ"
