[translation]
10125-10849-10-1 = "アルカナに\n導かれし者よ……\nこちらへ。"
10125-10849-20-1 = "さあ、ワイルドハントに\n眠る秘密を……"
10125-10849-30-1 = "共に解き明かしましょう。"
10125-10849-40-1 = "うう……寮監隊に\nバレませんように……。"
10125-10849-50-1 = "あと少し！\n悔いなきフィナーレを\n迎えましょう！"
10125-10849-60-1 = "マスター！また一緒に……"
10125-10849-70-1 = "素晴らしい芸術を\n作りましょう！"
10125-10849-80-1 = "にゅふふ、魔法に\n興味がおありですか？"
10125-10849-90-1 = "マスター、占って\nさしあげましょうか？"
10125-10849-100-1 = "もちろんお代は\nいりません。"
10125-10849-110-1 = "お気軽に\nお声がけください！"
10125-10849-120-1 = "ぼ、帽子は\nダメですからっ。"
10125-10849-130-1 = "こ、これは魔法使いの\n象徴なので……\n脱げないんです！"
10125-10849-140-1 = "あっ、そこには\n魔法刻印が……！"
10125-10849-150-1 = "何度も突っつくと……\n暴発しちゃうかも。\nにゅふふっ。"
10125-10849-280-1 = "さぁ、魔道具を\n手に入れましょう！"
10125-10849-290-1 = "おお、この品揃え……\n眺めるだけでも魔力が……！"
10125-10849-300-1 = "ここではもう魔道具を\n集められなくなって\nしまいましたが、"
10125-10849-310-1 = "構いません！"
10125-10849-320-1 = "マスターとの\n思い出も魔道具も、"
10125-10849-330-1 = "これからいっぱい\n見つけていけますから！"
10125-10849-340-1 = "お気に召すものは\nありましたか？"
10125-10849-350-1 = "マスターの審美眼、\n期待しています！"
10125-10849-360-1 = "これは強い魔力を\n感じますね……！"
10125-10849-370-1 = "さすがマスター！\nお目が高い！"
10125-10849-380-1 = "では、早速試して\nみましょうか！"
10125-10849-390-1 = "あっ、私もそれが\nいいと思っていたんです！"
