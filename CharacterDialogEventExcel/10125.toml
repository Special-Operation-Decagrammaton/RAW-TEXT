[translation]
10125-849-10-1 = "The one guided by the Arcana. This way."
10125-849-20-1 = "Now then, let us uncover the secret that lies beneath Wildhunt..."
10125-849-30-1 = "You and I, together."
10125-849-40-1 = "Umm, I can't let the Prefectural Council find out about my plan..."
10125-849-50-1 = "Just a little more! Let us welcome the finale with no regrets!"
10125-849-60-1 = "Next time too..."
10125-849-70-1 = "I want to create an incredible piece of art with you, Master!"
10125-849-80-1 = "Nyuhuhu, are you interested in magic?"
10125-849-90-1 = "Master, would you like me to read your fortune?"
10125-849-100-1 = "For free, of course."
10125-849-110-1 = "Just let me know!"
10125-849-120-1 = "P-Please don't touch my hat."
10125-849-130-1 = "This is the symbol of a magician, so it should never come off!"
10125-849-140-1 = "Ah, I made a magic engraving over there...!"
10125-849-150-1 = "If you keep touching it... It might explode. Nyuhuhu."
10125-849-280-1 = "Now then, let us get our hands on the magic tools!"
10125-849-290-1 = "Ooh, these items... I can feel their magic power just by looking at them...!"
10125-849-300-1 = "I can't get magic tools from here anymore..."
10125-849-310-1 = "...but that's okay!"
10125-849-320-1 = "Whether it's memories with you or magic tools..."
10125-849-330-1 = "...I'll have more and more of them in the future!"
10125-849-340-1 = "Was there anything to your liking?"
10125-849-350-1 = "I'm looking forward to seeing your style, Master!"
10125-849-360-1 = "Oh my, this item is full of magic powers!"
10125-849-370-1 = "I'd expect nothing less! You have good taste!"
10125-849-380-1 = "Let's test it out right now!"
10125-849-390-1 = "Ah, I thought that was a good one too!"
