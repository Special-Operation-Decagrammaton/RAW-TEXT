[translation]
10125-849-10-1 = "受阿爾克那\n引導之人啊……\n請到這邊來。"
10125-849-20-1 = "來，沉睡於\n狂獵的祕密……"
10125-849-30-1 = "就讓我們一起解開吧。"
10125-849-40-1 = "嗚嗚……拜託別被\n舍監隊發現……"
10125-849-50-1 = "還差一點！\n一起迎接無悔\n的終曲吧！"
10125-849-60-1 = "御者！再一起……"
10125-849-70-1 = "創造出精彩的藝術吧！"
10125-849-80-1 = "妞呵呵，\n對魔法有興趣嗎？"
10125-849-90-1 = "御者，要不要\n我幫你占卜？"
10125-849-100-1 = "當然不需要\n任何報酬。"
10125-849-110-1 = "請隨時跟我說！"
10125-849-120-1 = "帽，帽子不行啦。"
10125-849-130-1 = "這，這是\n魔法使的象徵……\n所以不能脫下來！"
10125-849-140-1 = "啊，那裡有\n魔法刻印……！"
10125-849-150-1 = "一直戳的話……\n可能會暴走哦。\n妞呵呵。"
10125-849-280-1 = "來，取得魔道具吧！"
10125-849-290-1 = "哦哦，這個商品陣容……\n光看就感覺魔力已經……！"
10125-849-300-1 = "雖然這裡已經不能\n再收集魔道具了，"
10125-849-310-1 = "不過沒關係！"
10125-849-320-1 = "與御者的回憶，\n還有魔道具，"
10125-849-330-1 = "接下來都能找到更多！"
10125-849-340-1 = "有看到喜歡的東西嗎？"
10125-849-350-1 = "御者的審美，\n我很期待！"
10125-849-360-1 = "這個能感受到\n強大的魔力呢……！"
10125-849-370-1 = "不愧是御者！\n眼光真好！"
10125-849-380-1 = "那麼，趕緊\n來試試看吧！"
10125-849-390-1 = "啊，我也覺得\n那個不錯！"
