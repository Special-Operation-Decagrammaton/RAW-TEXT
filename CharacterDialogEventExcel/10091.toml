[translation]
10091-836-120-1 = "어서 와, 선생님!"
10091-836-130-1 = "연습 좀 도와줄 수 있어?"
10091-836-140-1 = "아, 아. 아아아~."
10091-836-150-1 = "……!? 으, 으에엑!?\n선생님!? 언제부터……!"
10091-836-160-1 = "잘 되고 있는 느낌이……\n들기도 하고,"
10091-836-170-1 = "아닌 거 같기도 하고……."
10091-836-180-1 = "집중, 집중!"
10091-836-190-1 = "아직 안 끝났어!"
10091-836-200-1 = "후우……."
10091-836-210-1 = "선생님. 그……."
10091-836-220-1 = "어, 어땠어……?"
10091-836-230-1 = "……? 마이크에 관심 있어?"
10091-836-240-1 = "선생님도 한 곡, 부를래?"
10091-836-250-1 = "응? 뭐 필요한\n거라도 있어?"
10091-836-260-1 = "정말… 또 건드리네…."
10091-836-270-1 = "이번에야말로 화낸다?"
10091-836-280-1 = "아아, 정말!"
10091-836-290-1 = "볼일이 있으면,\n제대로 말로 해!"
10091-836-620-1 = "안녕하세요,\n오늘도 상황 보러 왔어?"
10091-836-630-1 = "진행 상태를 보러 온 거지?"
10091-836-640-1 = "나만 보지 말고,\n제대로 집중해."
10091-836-650-1 = "어허! 안 돼."
10091-836-660-1 = "응. 체크했어."
10091-836-670-1 = "오오, 잘됐네."
