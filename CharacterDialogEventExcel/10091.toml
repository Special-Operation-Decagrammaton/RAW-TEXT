[translation]
10091-836-120-1 = "いらっしゃい、先生！"
10091-836-130-1 = "ちょっと練習\n手伝ってくれない？"
10091-836-140-1 = "あ、あ、ああぁー"
10091-836-150-1 = "……うわっ！？先生！？\nいつから……！"
10091-836-160-1 = "上手くいくような気が……"
10091-836-170-1 = "するような、\nしないような……。"
10091-836-180-1 = "集中！集中！"
10091-836-190-1 = "まだ終わってないんだし！"
10091-836-200-1 = "ふぅ……。"
10091-836-210-1 = "先生、その……"
10091-836-220-1 = "ど、どうだった……？"
10091-836-230-1 = "……ん？マイクに\n興味あるの？"
10091-836-240-1 = "先生も一曲、\n歌ってみる？"
10091-836-250-1 = "ん？何か必要なものでも？"
10091-836-260-1 = "もう……\nまたつついて……"
10091-836-270-1 = "今度こそ怒るよ？"
10091-836-280-1 = "ああ、もう！"
10091-836-290-1 = "用があるなら、\nちゃんと言葉にして！"
10091-836-620-1 = "こんにちは、\n今日も様子見？"
10091-836-630-1 = "進捗状況を見に来たの？"
10091-836-640-1 = "私ばっか見てないで、\nちゃんと集中してよね。"
10091-836-650-1 = "こらっ！ダメ。"
10091-836-660-1 = "うん、オッケー！"
10091-836-670-1 = "おお、良かったね。"
