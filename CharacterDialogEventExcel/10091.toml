[translation]
10091-836-120-1 = "เข้ามาสิ คุณครู!"
10091-836-130-1 = "พอจะช่วยซ้อมดนตรีหน่อยได้มั้ย?"
10091-836-140-1 = "อ่า... อ่า อ้าาา~"
10091-836-150-1 = "วะ... เหวออออ!?\nคุณครู!? มาตั้งแต่ตอนไหน...!"
10091-836-160-1 = "ฉันรู้สึกว่า...\nกำลังเป็นไปได้ด้วยดี"
10091-836-170-1 = "แต่ก็เหมือนจะไม่ดีด้วย..."
10091-836-180-1 = "ตั้งใจหน่อย ตั้งใจ!"
10091-836-190-1 = "ยังไม่จบแค่นี้หรอกนะ!"
10091-836-200-1 = "ฮู่ว..."
10091-836-210-1 = "คุณครู เอ่อ..."
10091-836-220-1 = "ปะ... เป็นไงบ้าง...?"
10091-836-230-1 = "สนใจไมโครโฟนขึ้นมาเหรอ...?"
10091-836-240-1 = "คุณครูอยากร้องสักเพลงมั้ย?"
10091-836-250-1 = "หืม? มีอะไรที่\nอยากได้งั้นเหรอ?"
10091-836-260-1 = "จริงๆ เลย... มากวนกันอีกแล้ว..."
10091-836-270-1 = "ครั้งนี้ฉันจะโกรธแล้วนะ"
10091-836-280-1 = "อ่า... จริงๆ เลย!"
10091-836-290-1 = "ถ้ามีธุระจะคุย\nก็บอกกันดีๆ สิ!"
10091-836-620-1 = "สวัสดี\nวันนี้ก็มาดูสถานการณ์เหรอ?"
10091-836-630-1 = "มาดูความคืบหน้าใช่มั้ย?"
10091-836-640-1 = "อย่าเอาแต่มองฉันสิ\nมีสมาธิหน่อย"
10091-836-650-1 = "เดี๋ยวเหอะ! ไม่ได้นะ"
10091-836-660-1 = "อื้อ โอเค"
10091-836-670-1 = "โอ้ ดีเลยนะ"
10091-10836-120-1 = "มาแล้วเหรอ คุณครู!"
