[translation]
10091-836-120-1 = "歡迎你，老師！"
10091-836-130-1 = "能幫我練習一下嗎？"
10091-836-140-1 = "啊，啊，啊啊──"
10091-836-150-1 = "……哇！？老師！？\n你是從什麼時候……！"
10091-836-160-1 = "感覺會很順利……"
10091-836-170-1 = "又好像不會……"
10091-836-180-1 = "集中！集中！"
10091-836-190-1 = "還沒結束呢！"
10091-836-200-1 = "呼……"
10091-836-210-1 = "老師，那個……"
10091-836-220-1 = "如，如何……？"
10091-836-230-1 = "……嗯？\n對麥克風有興趣嗎？"
10091-836-240-1 = "老師要不要也來唱一首？"
10091-836-250-1 = "嗯？\n有什麼需要的東西嗎？"
10091-836-260-1 = "真是的……\n又在戳我……"
10091-836-270-1 = "這次真的要生氣囉？"
10091-836-280-1 = "啊啊，真是的！"
10091-836-290-1 = "有需要的話，\n就好好說出來！"
10091-836-620-1 = "你好，\n今天也來查看情況嗎？"
10091-836-630-1 = "是來看進度如何的吧？"
10091-836-640-1 = "不要一直盯著我看，\n請好好集中精神。"
10091-836-650-1 = "喂！不行。"
10091-836-660-1 = "嗯，OK！"
10091-836-670-1 = "哦哦，太好了。"
