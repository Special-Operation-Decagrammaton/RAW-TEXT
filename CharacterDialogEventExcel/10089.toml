[translation]
10089-834-10-1 = "เอาละ ถึงเวลาทำงานแล้ว\nคุณครู"
10089-834-20-1 = "มาได้จังหวะพอดีเลย\nฉันมีอะไรจะให้คุณครูดูน่ะ"
10089-834-30-1 = "เวลาช่างผ่านไป..."
10089-834-40-1 = "เร็วจังเลยนะ\nงานใกล้จะเสร็จแล้วเหรอ...?"
10089-834-50-1 = "ห้ามวางมือจนกว่าจะ\nเสร็จงานเด็ดขาด"
10089-834-60-1 = "หืม...? คุณครู?\nมีเรื่องอะไรเหรอ?"
10089-834-70-1 = "ชู่ว! ชู่ว! เงียบๆ สิ!"
10089-834-80-1 = "เดี๋ยวถูกจับได้\nว่าแอบเข้ามานะ...!"
10089-834-90-1 = "เฮือก...!?"
10089-834-100-1 = "อ่า... คุณครูนี่เอง"
10089-834-110-1 = "ทะ... ที่นี่อันตรายนะ...\nไปคุยกันข้างนอกเถอะ"
10089-834-310-1 = "งั้นก็รวบรวมเบาะแสดูดีมั้ยนะ?"
10089-834-320-1 = "คุณครู ฉันอยากจัดการข้อมูลน่ะ"
10089-834-330-1 = "มาช่วยกันหน่อยได้มั้ย?"
10089-834-340-1 = "ฉันยังต้องหาข้อมูล\nเกี่ยวกับเป้าหมายเพิ่มน่ะ คุณครู"
10089-834-350-1 = "ตะ... ตั้งใจหน่อยสิ คุณครู!\nไม่ใช่ที่ฉัน ที่ข้อมูลน่ะ!"
10089-834-360-1 = "หะ... หืม?\nมีอะไรจะพูดกับฉันเหรอ...?"
10089-834-370-1 = "อ๋อ เป็นแบบนั้นนี่เอง"
10089-834-380-1 = "เข้าใจครบถ้วนแล้วละ"
10089-834-390-1 = "สมแล้วที่เป็นพาร์ทเนอร์ของฉัน"
10089-834-400-1 = "เรามีข้อมูลครบแล้ว...\nแต่ก็ลองหาไว้เผื่ออีกหน่อยเถอะ"
