[translation]
10089-834-10-1 = "さあ、仕事の\n時間よ、先生。"
10089-834-20-1 = "ちょうどいいわ、先生に\n見せたいものがあるの。"
10089-834-30-1 = "もうこんな時間…。"
10089-834-40-1 = "早いものね。そろそろ\n幕引きかしら…？"
10089-834-50-1 = "仕上げまで手を\n抜いちゃだめよ。"
10089-834-60-1 = "ん…？先生？何か\n話でもあるのかしら…？"
10089-834-70-1 = "し、しーっ！静かに！"
10089-834-80-1 = "潜入がバレちゃう\nでしょう…！"
10089-834-90-1 = "ひいっ…！？"
10089-834-100-1 = "あ…先生じゃないの。"
10089-834-110-1 = "こ、ここはまずいわ…\n外で話しましょう。"
10089-834-310-1 = "それじゃ、手がかりを\n集めるわよ。"
10089-834-320-1 = "先生、資料を\nまとめたいの。"
10089-834-330-1 = "付き合って\nもらえるかしら？"
10089-834-340-1 = "ターゲットのことを、\nもうちょっと\n調べたいわね。"
10089-834-350-1 = "しゅ、集中しなさい。\nいや、私じゃなくて、\n資料に！"
10089-834-360-1 = "ん、ん？わ、私に\n何か用なの……？"
10089-834-370-1 = "ああ、\nそういうことだったのね。"
10089-834-380-1 = "完全に、理解したわ。"
10089-834-390-1 = "さすが、私の見込んだ\nパートナーだわ。"
10089-834-400-1 = "情報は揃ったけど…念のため、\nもう少し見てみましょう。"
