[translation]
10089-834-10-1 = "Time to go to work, Sensei."
10089-834-20-1 = "Great timing. I have something to show you."
10089-834-30-1 = "Would you look at the time..."
10089-834-40-1 = "That was quick... Is it already over?"
10089-834-50-1 = "Hang on until the very end."
10089-834-60-1 = "Huh? Sensei? What's the matter?"
10089-834-70-1 = "Sh-Shhh! Quiet!"
10089-834-80-1 = "They'll find out about the infiltration!"
10089-834-90-1 = "Eek?!"
10089-834-100-1 = "Oh...it's just you, Sensei."
10089-834-110-1 = "It's too dangerous here... Let's talk outside."
10089-834-310-1 = "Now then, shall we gather some clues?"
10089-834-320-1 = "Sensei, let's organize the documents."
10089-834-330-1 = "Would you mind helping me?"
10089-834-340-1 = "I need to learn more about the target."
10089-834-350-1 = "F-Focus, Sensei. No, not on me! On the documents!"
10089-834-360-1 = "H-Huh? You got something to say?"
10089-834-370-1 = "Oh. So that's what it was."
10089-834-380-1 = "I understand completely."
10089-834-390-1 = "As expected of the business partner I've been scouting."
10089-834-400-1 = "We have the needed intel...but let's dig a bit deeper. Just in case."
