[translation]
10089-834-10-1 = "자, 일할 시간이야.\n선생님."
10089-834-20-1 = "마침 잘 왔어.\n선생님에게 보여줄 게 있거든."
10089-834-30-1 = "벌써 시간이 이렇게……"
10089-834-40-1 = "빠르네.\n슬슬 막을 내리는 걸까……?"
10089-834-50-1 = "마지막까지 손 떼면 안 돼."
10089-834-60-1 = "음…? 선생님?\n무슨 일이야?"
10089-834-70-1 = "쉬, 쉿! 조용히!"
10089-834-80-1 = "잠입이 들켜 버리잖아…!"
10089-834-90-1 = "히익…!?"
10089-834-100-1 = "아…. 선생님이잖아."
10089-834-110-1 = "여, 여기는 위험해…\n밖에서 이야기하자."
10089-834-310-1 = "그럼, 단서를 모아볼까."
10089-834-320-1 = "선생님, 자료를 정리하고 싶어."
10089-834-330-1 = "어울려 줄 수 있을까?"
10089-834-340-1 = "타깃에 대해,\n좀 더 알아보고 싶어."
10089-834-350-1 = "지, 집중해.\n아니, 나 말고, 자료에!"
10089-834-360-1 = "으, 으응?\n뭔가 할 말이라도 있어……?"
10089-834-370-1 = "아아, 그런 거였구나."
10089-834-380-1 = "완전히, 이해했어."
10089-834-390-1 = "역시, 내가 눈여겨본 파트너야."
10089-834-400-1 = "정보는 갖추어졌지만…\n만약을 위해, 조금 더 살펴보자."
