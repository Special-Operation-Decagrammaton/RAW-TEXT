[translation]
10089-834-10-1 = "來，工作的時間\n到囉，老師。"
10089-834-20-1 = "來得正好，我有\n東西想給老師看。"
10089-834-30-1 = "已經這麼晚了……"
10089-834-40-1 = "時間過得真快。\n差不多該謝幕了嗎……？"
10089-834-50-1 = "直到收尾都不能鬆懈哦。"
10089-834-60-1 = "嗯……？老師？\n有什麼話想說嗎……？"
10089-834-70-1 = "噓，噓！安靜一點！"
10089-834-80-1 = "不然我們的潛入\n會被發現的……！"
10089-834-90-1 = "噫噫……！？"
10089-834-100-1 = "啊……這不是老師嗎。"
10089-834-110-1 = "這，這裡不太妙……\n去外面說吧。"
10089-834-310-1 = "那麼，來收集線索吧。"
10089-834-320-1 = "老師，我想整理資料。"
10089-834-330-1 = "可以跟我一起嗎？"
10089-834-340-1 = "目標的事，\n我還想多調查一下。"
10089-834-350-1 = "專，專心一點！\n不，不是對我，\n是對資料！"
10089-834-360-1 = "呃，嗯？找，找我\n有什麼事嗎……？"
10089-834-370-1 = "啊啊，原來是那樣啊。"
10089-834-380-1 = "我完全明白了。"
10089-834-390-1 = "不愧是我看上的夥伴。"
10089-834-400-1 = "雖然情報已經湊齊……\n以防萬一，再檢查一下吧。"
