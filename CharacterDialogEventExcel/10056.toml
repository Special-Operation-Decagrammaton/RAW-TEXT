[translation]
10056-819-10-1 = "老師！聖誕節到了唷！"
10056-819-20-1 = "連我都\n興奮不已呢。"
10056-819-30-1 = "希望大家都能收到\n名為「幸福」的禮物……"
10056-819-40-1 = "今年的聖誕節，\n您有什麼計畫嗎？"
10056-819-50-1 = "那個……\n如果可以的話，\n我們兩人……"
10056-819-60-1 = "不，沒有，\n什麼都沒有！"
10056-819-70-1 = "沒錯！\n是聖誕老人芹奈唷！"
10056-819-80-1 = "有什麼需要幫忙的嗎？"
10056-819-90-1 = "聖誕節的時候，\n請呼叫\n聖誕老人芹奈唷！"
10056-819-100-1 = "老師？\n怎麼了嗎？"
10056-819-260-1 = "聖誕節的慈善募款\n在這裡！"
10056-819-270-1 = "請捐款給\n那些有困難的人！"
10056-819-280-1 = "聖誕節慈善募款\n結束了。"
10056-819-290-1 = "請確認有沒有未完成的事。"
10056-819-300-1 = "老師，\n請讓我幫您什麼忙吧。"
10056-819-310-1 = "花繪醬，不要緊吧……"
10056-819-320-1 = "非常謝謝。\n來，這是禮物唷。"
10056-819-330-1 = "聖誕快樂！\n祝你有美好的一天！"
10056-819-340-1 = "這麼貴重的東西……\n捐出來沒關係嗎？"
