[translation]
10056-819-10-1 = "คุณครู!\nคริสต์มาสแล้วค่ะ!"
10056-819-20-1 = "ฉันเองก็ตื่นเต้น\nเหมือนกันเลยค่ะ"
10056-819-30-1 = "ขอให้มีของขวัญที่ชื่อว่า\nความสุขแก่ทุกคนด้วยเถอะ..."
10056-819-40-1 = "คริสต์มาสคราวนี้คุณครูมีแพลนอะไรมั้ยคะ?"
10056-819-50-1 = "ถ้าเกิดว่า... สะดวกละก็\nมา... กับฉันสองคน"
10056-819-60-1 = "ปะ... เปล่าค่ะ\nไม่มีอะไรค่ะ!"
10056-819-70-1 = "ค่ะ! ซานต้าเซรินะค่ะ!"
10056-819-80-1 = "มีอะไรให้ฉันช่วยมั้ยคะ?"
10056-819-90-1 = "ในวันคริสต์มาส ช่วยมาหา\nซานต้าเซรินะด้วยนะคะ"
10056-819-100-1 = "คุณครู?\nมีเรื่องอะไรหรือเปล่าคะ?"
10056-819-260-1 = "บริจาคเพื่อการกุศล\nในวันคริสต์มาสทางนี้เลยค่ะ!"
10056-819-270-1 = "รบกวนบริจาคให้\nคนที่ทุกข์ยากด้วยนะคะ!"
10056-819-280-1 = "การบริจาคเพื่อการกุศล\nในวันคริสต์มาสสิ้นสุดแล้วค่ะ"
10056-819-290-1 = "รบกวนตรวจสอบด้วยนะคะ\nว่ามีอะไรตกหล่นหรือเปล่า"
10056-819-300-1 = "คุณครู ขอให้ฉันได้ช่วยเถอะค่ะ"
10056-819-310-1 = "ฮานาเอะ จะเป็นอะไรไหมนะ..."
10056-819-320-1 = "ขอบคุณค่ะ\nส่วนนี่ก็ของขวัญค่ะ"
10056-819-330-1 = "เมอร์รีคริสต์มาส!\nขอให้เป็นวันที่ดีนะคะ!"
10056-819-340-1 = "เอาของมีค่าแบบนี้...\nมาบริจาคได้เหรอคะ?"
