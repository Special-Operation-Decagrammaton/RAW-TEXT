[translation]
10056-819-10-1 = "先生！クリスマスですよ！"
10056-819-20-1 = "私まで\nワクワクしてきます。"
10056-819-30-1 = "皆さんに「幸せ」という\n名のプレゼントが\n届きますように……"
10056-819-40-1 = "今年のクリスマス、\n何かご予定はありますか？"
10056-819-50-1 = "その……\nもしよろしければ、\n私と二人で……"
10056-819-60-1 = "い、いえっ、\nなんでもありません！"
10056-819-70-1 = "はい！\nサンタのセリナですよ！"
10056-819-80-1 = "何かお手伝いすることは\nありますか？"
10056-819-90-1 = "クリスマスには、\nサンタのセリナを\n呼んでくださいね！"
10056-819-100-1 = "先生？\nどうかしましたか？"
10056-819-260-1 = "クリスマスのチャリティー募金は\nこちらです！"
10056-819-270-1 = "困っている方々のために、\nどうか寄付をお願いします！"
10056-819-280-1 = "クリスマスのチャリティー募金は\n終了しました。"
10056-819-290-1 = "やり残した事はないか、\n確認してくださいね。"
10056-819-300-1 = "先生、\n何かお手伝いさせてください。"
10056-819-310-1 = "ハナエちゃん、大丈夫かな……"
10056-819-320-1 = "ありがとうございます。\nはい、こちらがプレゼントですよ。"
10056-819-330-1 = "メリークリスマス！\n素敵な一日をお過ごしください！"
10056-819-340-1 = "こんなに貴重なものまで……\n寄付していただいていいんですか？"
