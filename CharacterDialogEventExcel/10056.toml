[translation]
10056-819-10-1 = "Sensei! It's Christmas!"
10056-819-20-1 = "My heart is racing. I'm so excited."
10056-819-30-1 = "I hope to deliver everyone the gift of happiness."
10056-819-40-1 = "Do you have any plans for Christmas?"
10056-819-50-1 = "If you...don't mind...maybe the two of us..."
10056-819-60-1 = "O-Oh, never mind. It's nothing!"
10056-819-70-1 = "Yes! It's Santa Serina!"
10056-819-80-1 = "Is there anything I can do to help?"
10056-819-90-1 = "This Christmas, please call Santa Serina!"
10056-819-100-1 = "Sensei? What's happening?"
10056-819-260-1 = "This way for the Christmas donation charity!"
10056-819-270-1 = "Please consider donating to those in need!"
10056-819-280-1 = "The Christmas donation charity is over."
10056-819-290-1 = "Please make sure you didn't forget anything!"
10056-819-300-1 = "Sensei, please let me assist you."
10056-819-310-1 = "I hope Hanae is okay..."
10056-819-320-1 = "Thank you. This is for you."
10056-819-330-1 = "Merry Christmas! Have a wonderful day!"
10056-819-340-1 = "This is so precious... Are you sure you want to donate this?"
