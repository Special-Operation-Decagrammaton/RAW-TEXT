[translation]
10056-819-10-1 = "선생님!\n크리스마스가 왔어요!"
10056-819-20-1 = "저까지 가슴이\n두근거리네요."
10056-819-30-1 = "모두에게 행복이라는\n이름의 선물이 내리길……"
10056-819-40-1 = "이번 크리스마스, 뭔가\n예정이라도 있으신가요?"
10056-819-50-1 = "혹시…… 괜찮으시다면,\n저와 둘이서……"
10056-819-60-1 = "아, 아뇨.\n아무것도 아니에요!"
10056-819-70-1 = "네! 산타 세리나예요!"
10056-819-80-1 = "도와드릴 일이 있을까요?"
10056-819-90-1 = "크리스마스에는, 산타\n세리나를 찾아 주세요!"
10056-819-100-1 = "선생님?\n무슨 일이라도 있으세요?"
10056-819-260-1 = "크리스마스 자선 모금은\n이쪽입니다!"
10056-819-270-1 = "어려운 분들을 위해서\n기부 부탁드려요!"
10056-819-280-1 = "크리스마스 자선 모금은\n종료됐습니다."
10056-819-290-1 = "빠트린 것은 없는지 확인해 주세요."
10056-819-300-1 = "선생님, 뭐든지 돕게 해주세요."
10056-819-310-1 = "하나에 쨩, 괜찮을까……"
10056-819-320-1 = "감사합니다.\n자, 여기 선물이에요."
10056-819-330-1 = "메리 크리스마스!\n멋진 하루 되세요!"
10056-819-340-1 = "이렇게 귀중한 것까지……\n기부해 주셔도 괜찮으신가요?"
10056-10819-10-1 = "선생님!\n크리스마스가 왔어요!"
