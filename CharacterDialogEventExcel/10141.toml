10141-900834-310-1 = "มะ... ไม่ว่าเรื่องอะไร\nก็บอกมาได้เลยนะคะ...!"
10141-900834-320-1 = "ขะ... ขอบคุณค่ะ...!"
10141-900834-330-1 = "กะ... ก็เรื่องที่...\nมาหา... น่ะค่ะ"
10141-900834-340-1 = "ขอโทษนะคะ ขอโทษค่ะ!\nปะ... เป็นเพราะฉันสินะคะ...?"
10141-900834-350-1 = "ระเบิด... กระสุนปืน...\nถ้าต้องการละก็\nบอกฉันได้เลยนะคะ...!"
10141-900834-360-1 = "ว่าแล้วเชียว เกิดเรื่อง\nใหญ่โตขึ้นแล้วสินะคะ..."
10141-900834-370-1 = "ถ้าเกิดรู้สึกสนุกขึ้นมา\nตัวฉันคงจะดูแปลกๆ รึเปล่าคะ? "
10141-900834-380-1 = "จู่ๆ ฉันก็เกิดสงสัยขึ้นมา...\nว่าโอเปร่า..."
10141-900834-390-1 = "เป็นเรื่องเกี่ยวกับอะไรน่ะค่ะ?"
