[translation]
10141-834-660-1 = "隨，隨時都可以出發！"
10141-834-670-1 = "不，不管是什麼\n都請儘管吩咐……！"
10141-834-680-1 = "非，非常謝謝您……！"
10141-834-690-1 = "咦，啊，那個……\n是針對您願意\n前來這件事。"
10141-834-700-1 = "對不起！對不起！\n是，是我的錯，\n對吧……？"
10141-834-710-1 = "炸彈……彈藥……\n有需要的東西\n請儘管說……！"
10141-834-720-1 = "總覺得演變成一場\n大騷動了呢……"
10141-834-730-1 = "覺得這樣很有趣，\n會……很奇怪嗎？"
10141-834-740-1 = "話說回來……\n歌劇……"
10141-834-750-1 = "是什麼樣的內容呢？"
10141-10834-660-1 = "隨、隨時都可以去！"
