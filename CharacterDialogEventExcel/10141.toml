[translation]
10141-834-660-1 = "어, 언제든 가능합니다!"
10141-834-670-1 = "무, 무엇이든\n말씀해 주세요……!"
10141-834-680-1 = "가, 감사합니다……!"
10141-834-690-1 = "그, 그러니까,\n와 주신…… 거요."
10141-834-700-1 = "죄송합니다! 죄송합니다!\n제, 제 탓, 이겠지요……?"
10141-834-710-1 = "폭탄…… 탄환……\n필요하시면\n말씀 주세요……! "
10141-834-720-1 = "어쩐지 큰 소동이\n벌어지고 있네요……."
10141-834-730-1 = "……어쩐지 즐겁다면 저,\n이상한 걸까요? "
10141-834-740-1 = "갑자기 궁금한 건데……\n오페라는……"
10141-834-750-1 = "무슨 내용이었을까요?"
