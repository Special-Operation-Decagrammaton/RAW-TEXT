[translation]
10141-300 = "隨、隨時都可以去！"
10141-310 = "不、不管什麼\n都請儘管吩咐……！"
10141-320 = "那，那真是太好了……！"
10141-330 = "咦，啊，那個……\n是針對你願意\n前來這件事。"
10141-340 = "對不起！對不起！\n是、是我的錯，\n對吧……？"
10141-350 = "炸彈……彈藥……只要有需要的\n東西，儘管說……！"
10141-360 = "總覺得演變成一場\n大騷動了呢……"
10141-370 = "覺得這很有趣\n的我……\n是不是很奇怪呢？"
10141-380 = "話說回來……\n歌劇……"
10141-390 = "是什麼樣的\n內容呢？"
