[translation]
10141-834-660-1 = "พะ... พร้อมเสมอค่ะ!"
10141-834-670-1 = "มะ... ไม่ว่าเรื่องอะไร\nก็บอกมาได้เลยค่ะ...!"
10141-834-680-1 = "ขะ... ขอบคุณค่ะ...!"
10141-834-690-1 = "กะ... ก็เรื่องที่...\nช่วยมาหากัน... น่ะค่ะ"
10141-834-700-1 = "ขอโทษด้วยค่ะ! ขอโทษด้วยค่ะ!\nคะ... คงเป็น... ความผิดของฉันใช่มั้ยคะ...?"
10141-834-710-1 = "ระเบิด... กระสุนปืน...\nถ้าต้องการละก็ บอกฉันได้เลยนะคะ...! "
10141-834-720-1 = "ว่าแล้วเชียว กำลัง\nเกิดเรื่องวุ่นวายสินะคะ..."
10141-834-730-1 = "ถ้าเกิดรู้สึกสนุกขึ้นมา...\nจะถือว่าฉันแปลกมั้ยคะ?"
10141-834-740-1 = "จู่ๆ ฉันก็เกิดสงสัยขึ้นมา...\nว่าโอเปร่า..."
10141-834-750-1 = "เป็นเรื่องเกี่ยวกับอะไรเหรอคะ?"
