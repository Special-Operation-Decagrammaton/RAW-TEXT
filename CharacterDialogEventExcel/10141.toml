[translation]
10141-300 = "พะ... พร้อมเสมอเลยค่ะ!"
10141-310 = "มะ... ไม่ว่าเรื่องอะไร\nก็บอกมาได้เลยนะคะ...!"
10141-320 = "ขะ... ขอบคุณค่ะ...!"
10141-330 = "กะ... ก็เรื่องที่...\nมาหา... น่ะค่ะ"
10141-340 = "ขอโทษนะคะ ขอโทษค่ะ!\nปะ... เป็นเพราะฉันสินะคะ...?"
10141-350 = "ระเบิด... กระสุนปืน...\nถ้าต้องการละก็\nบอกฉันได้เลยนะคะ...!"
10141-360 = "ว่าแล้วเชียว เกิดเรื่อง\nใหญ่โตขึ้นแล้วสินะคะ..."
10141-370 = "ถ้าเกิดรู้สึกสนุกขึ้นมา\nตัวฉันคงจะดูแปลกๆ รึเปล่าคะ? "
10141-380 = "จู่ๆ ฉันก็เกิดสงสัยขึ้นมา...\nว่าโอเปร่า..."
10141-390 = "เป็นเรื่องเกี่ยวกับอะไรน่ะค่ะ?"
10141-660 = "พะ... พร้อมเสมอค่ะ!"
10141-670 = "มะ... ไม่ว่าเรื่องอะไร\nก็บอกมาได้เลยค่ะ...!"
10141-680 = "ขะ... ขอบคุณค่ะ...!"
10141-690 = "กะ... ก็เรื่องที่...\nช่วยมาหากัน... น่ะค่ะ"
10141-700 = "ขอโทษค่ะ! ขอโทษด้วยค่ะ!\nคะ... คงเป็น... ความผิดของฉันใช่มั้ยคะ...?"
10141-710 = "ระเบิด... กระสุนปืน...\nถ้าต้องการละก็ บอกฉันได้เลยนะคะ...! "
10141-720 = "ว่าแล้วเชียว กำลัง\nเกิดเรื่องวุ่นวายสินะคะ..."
10141-730 = "ถ้าเกิดรู้สึกสนุกขึ้นมา...\nจะถือว่าฉันแปลกมั้ยคะ? "
10141-740 = "จู่ๆ ฉันก็เกิดสงสัยขึ้นมา...\nว่าโอเปร่า..."
10141-750 = "เป็นเรื่องเกี่ยวกับอะไรเหรอคะ?"
