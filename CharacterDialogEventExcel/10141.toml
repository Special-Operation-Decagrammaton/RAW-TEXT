[translation]
10141-834-660-1 = "い、いつでもいけます！"
10141-834-670-1 = "な、なんでも\n言ってください……！"
10141-834-680-1 = "あ、ありがとう\nございます……！"
10141-834-690-1 = "えっ、あ、えっと……\n来てくださった\nことに対して、です。"
10141-834-700-1 = "すみません！すみません！\nわ、私のせい、\nですよね……？"
10141-834-710-1 = "爆弾……弾薬……必要な\n物があれば何なりと……！"
10141-834-720-1 = "なんだか大変な騒ぎに\nなっていますね……。"
10141-834-730-1 = "これを楽しいと\n思うのは……\n変、でしょうか？"
10141-834-740-1 = "そういえば……\nオペラ……"
10141-834-750-1 = "どんな\n内容だったんでしょう？"
