19009253-836-1160-1 = "みんなで一緒に\n頑張りましょう！"
19009253-836-1170-1 = "みんなで一緒に\n頑張りましょう！"
19009253-836-1180-1 = "みんな頑張って\nますね……！私も……！"
19009253-836-1190-1 = "うん！いい感じ！"
19009253-836-1200-1 = "ありがとうございます、\n先生。……ただ、\nそれを伝えたくて。"
