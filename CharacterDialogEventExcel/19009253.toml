19009253-836-1160-1 = "สู้ๆ นะคะ\nทุกคน!"
19009253-836-1170-1 = "สู้ๆ นะคะ\nทุกคน!"
19009253-836-1180-1 = "ทุกคนตั้งใจกันจังเลยนะคะ...!\nงั้นฉันก็...!"
