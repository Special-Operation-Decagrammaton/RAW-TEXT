[translation]
10085-832-160-1 = "We've gotta get back indoors. It's freezing."
10085-832-170-1 = "Camping, at a time like this..."
10085-832-180-1 = "I can't with the vice president sometimes."
10085-832-190-1 = "There's...nothing to do...here..."
10085-832-200-1 = "Th-There was a bear nearby...?"
10085-832-210-1 = "Is it okay for us to stay here?"
10085-832-220-1 = "It was a little rough, but I guess these kinds of experiences can be nice sometimes..."
10085-832-230-1 = "O-Only...if it's from time to time...!"
10085-832-240-1 = "The closest convenience store...is beyond that mountain..."
10085-832-250-1 = "(The Wi-Fi signal...is gone?)"
10085-832-260-1 = "This energy drink...is warm."
10085-832-270-1 = "I wouldn't normally say yes, but I'm doing a lot of things I wouldn't normally do."
10085-832-280-1 = "The hard work never ends, huh, Sensei? Even after such a tough year, you're still letting us drag you around..."
10085-832-290-1 = "...Huh? What do you mean you're enjoying yourself?"
10085-832-300-1 = "...I guess Sensei is popular for a reason."
10085-832-310-1 = "Did the vice president force you to come along too, Sensei?"
10085-832-320-1 = "If you don't mind, could you lend me a hand?"
10085-832-330-1 = "A-ACK! O-Oh... It's just you, Sensei."
10085-832-340-1 = "I'm sorry. I thought you were a bear."
10085-832-350-1 = "We've got to make sure we clean up everything."
10085-832-360-1 = "I don't even wanna imagine the vice president's reaction if we're not thorough..."
10085-832-370-1 = "You know, if this was a game, we could've collected all of this with just one click."
10085-832-380-1 = "Huh? What? Did I get something on my clothes?"
10085-832-390-1 = "Yeah, I think we'll manage with this."
10085-832-400-1 = "This...is for me?"
10085-832-410-1 = "Thanks. I'll give you everything I gathered in return."
10085-832-420-1 = "You gathered all this yourself?"
10085-832-430-1 = "Wow... You're made for the outdoors, Sensei."
10085-832-440-1 = "Hey, Sensei. Look, I'm making curry."
10085-832-450-1 = "I like watching it boil in the pot."
10085-832-460-1 = "It makes me feel all warm and fuzzy."
10085-832-470-1 = "So, the curry is technically ready..."
10085-832-480-1 = "But if you want to add more ingredients, let me know."
10085-832-490-1 = "Uh, is this thing working?"
10085-832-500-1 = "Can you taste test it please, Sensei?"
10085-832-510-1 = "I read once that chocolate is a good secret ingredient for curry."
10085-832-520-1 = "...So, maybe an energy drink could also work?"
10085-832-530-1 = "...! Whoa. It's actually good."
10085-832-540-1 = "I didn't know curry could be this good."
10085-832-550-1 = "Seriously! It's delicious."
10085-832-560-1 = "It's definitely better than instant curry."
10085-832-570-1 = "Wh-What a...taste...!"
10085-832-580-1 = "Ugh. I really tried. I'm sorry."
