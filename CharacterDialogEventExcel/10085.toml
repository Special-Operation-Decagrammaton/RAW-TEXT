[translation]
10085-832-160-1 = "춥다…\n빨리 따듯한 실내로\n돌아가고 싶어…"
10085-832-170-1 = "이런 시기에 캠핑이라니."
10085-832-180-1 = "부부장도 너무해…"
10085-832-190-1 = "여기선…\n할 수 있는 게…\n아무것도 없어…"
10085-832-200-1 = "그, 근처에서\n곰이 나왔다고…?"
10085-832-210-1 = "여기 있어도\n괜찮은 거야?"
10085-832-220-1 = "다소 고생하긴 했지만,\n가끔씩은 이런 경험도\n나쁘진 않을 지도…"
10085-832-230-1 = "가, 가끔… 정말로\n가끔씩이라면…!"
10085-832-240-1 = "가장 가까운 편의점이…\n저 산 너머인가…"
10085-832-250-1 = "(와이파이의 신호가…\n사라졌어?)"
10085-832-260-1 = "따듯한 에너지 드링크라…"
10085-832-270-1 = "평소라면 논외겠지만,\n오늘만큼은 괜찮을지도."
10085-832-280-1 = "선생님도 고생이 많네.\n연말인데, 이런 곳까지\n끌려오다니…"
10085-832-290-1 = "응? 이런 상황도\n나름 즐겁다고?"
10085-832-300-1 = "…역시 선생님은\n인싸였나."
10085-832-310-1 = "…선생님도 부부장에게\n부탁을 받고 왔어? "
10085-832-320-1 = "혹시 괜찮다면,\n좀 도와줄 수 있을까…?"
10085-832-330-1 = "으, 으앗…?\n…아, 선생님이구나…"
10085-832-340-1 = "미안, 곰이 나타난 줄 알았어."
10085-832-350-1 = "뒷정리는 확실하게 하고 가야지."
10085-832-360-1 = "나중에 부부장에게\n한 소리 들을지도 모르니까."
10085-832-370-1 = "채집이라… 이게 게임이었다면\n클릭 한 번으로 끝났을 텐데…"
10085-832-380-1 = "응? 왜 그래?\n옷에 뭐라도 묻었어?"
10085-832-390-1 = "응, 이거라면 괜찮을 것 같아."
10085-832-400-1 = "이거, 나한테 주는 거야?"
10085-832-410-1 = "고마워. 내가 모은 것도 줄게."
10085-832-420-1 = "벌써 이렇게 모아 온 거야?"
10085-832-430-1 = "…선생님은 캠핑에\n재능이 있구나…"
10085-832-440-1 = "아, 선생님.\n지금 카레를\n끓이던 중이었어."
10085-832-450-1 = "보글보글 끓고 있는\n냄비를 보고 있노라면…"
10085-832-460-1 = "왠지 따듯한 기분이 들어…"
10085-832-470-1 = "카레의 준비는 끝났지만…"
10085-832-480-1 = "혹시 더 넣고 싶은\n재료가 있다면 지금 말해줘."
10085-832-490-1 = "음… 이거 제대로\n되고 있는 건가?"
10085-832-500-1 = "선생님, 맛 좀 봐줄래?"
10085-832-510-1 = "카레에 숨김맛으로\n초콜릿을 넣기도\n한다던데."
10085-832-520-1 = "…그럼\n에너지 드링크를\n넣어봐도…"
10085-832-530-1 = "아…!\n엄청나게 맛있어."
10085-832-540-1 = "카레로 이런 맛을\n낼 수 있었다니…"
10085-832-550-1 = "음, 맛있게 잘 됐네."
10085-832-560-1 = "레토르트 카레에\n비하면 그럭저럭\n괜찮은 편이려나."
10085-832-570-1 = "이, 인상적인 맛이네…"
10085-832-580-1 = "욱… 미안,\n이건 먹을 수 없겠어…"
