[translation]
10085-832-160-1 = "หนาวจัง...\nอยากรีบกลับไปอยู่\nในอาคารที่อบอุ่นๆ แล้ว..."
10085-832-170-1 = "ให้มาแคมป์ปิ้งช่วงนี้เนี่ยนะ"
10085-832-180-1 = "รองหัวหน้าทำเกินไปแล้ว..."
10085-832-190-1 = "อยู่ที่นี่...\nไม่เห็นจะมี...\nอะไรให้ทำเลย..."
10085-832-200-1 = "มะ... มีหมีโผล่ออกมา\nแถวๆ นี้งั้นเหรอ...?"
10085-832-210-1 = "งั้นเราจะ\nอยู่ที่นี่กันได้เหรอ?"
10085-832-220-1 = "ถึงจะต้องลำบากอยู่บ้าง\nแต่การได้มาทำอะไรแบบนี้\nก็อาจจะไม่แย่ก็ได้..."
10085-832-230-1 = "ตะ... แต่ต้องนานๆ ทีนะ\nนานๆ ทีถึงจะมาน่ะ...!"
10085-832-240-1 = "ร้านสะดวกซื้อที่ใกล้ที่สุด...\nอยู่เลยเขาลูกโน้นไปเหรอ..."
10085-832-250-1 = "(สัญญาณ Wi-Fi...\nหายไปแล้วเหรอ?)"
10085-832-260-1 = "เครื่องดื่มชูกำลังแบบอุ่นๆ..."
10085-832-270-1 = "ปกติฉันคงจะไม่สนเลย\nแต่วันนี้อาจจะโอเคก็ได้"
10085-832-280-1 = "คุณครูก็คงเหนื่อยน่าดูนะ\nสิ้นปีทั้งที แต่โดนลาก\nมาในที่แบบนี้ซะงั้น..."
10085-832-290-1 = "หืม? สถานการณ์แบบนี้\nก็สนุกเหมือนกันงั้นเหรอ?"
10085-832-300-1 = "คุณครูนี่นะ\nสนุกกับคนอื่นไปทั่วเลย"
10085-832-310-1 = "คุณครูก็มาเพราะ\nรองหัวหน้าไปขอไว้เหรอ? "
10085-832-320-1 = "ถ้าไม่ติดอะไรละก็\nมาช่วยอะไรฉันหน่อยได้มั้ย...?"
10085-832-330-1 = "วะ... ว้าก...?\nอ่า คุณครูนี่เอง..."
10085-832-340-1 = "ขอโทษนะ นึกว่าหมีออกมาน่ะ"
10085-832-350-1 = "ต้องเก็บกวาดให้เรียบร้อยก่อนไป"
10085-832-360-1 = "ไม่งั้นอาจโดนรองหัวหน้า\nเทศน์ใส่อีกชุดก็ได้"
10085-832-370-1 = "เรื่องเก็บรวบรวม... ถ้านี่เป็นเกม\nแค่คลิกครั้งเดียวก็คงเสร็จแล้ว..."
10085-832-380-1 = "หืม? ทำไมเหรอ?\nมีอะไรเปื้อนเสื้อฉันรึเปล่า?"
10085-832-390-1 = "อืม ถ้าเป็นอันนี้ไม่เป็นไรหรอก"
10085-832-400-1 = "อันนี้... ให้ฉันเหรอ?"
10085-832-410-1 = "ขอบคุณนะ งั้นฉันก็จะให้\nอันที่ฉันรวบรวมมาด้วยเหมือนกัน"
10085-832-420-1 = "รวบรวมมาได้ขนาดนี้เลยเหรอ?"
10085-832-430-1 = "คุณครูมีพรสวรรค์\nด้านแคมป์ปิ้งนะเนี่ย..."
10085-832-440-1 = "อ๊ะ คุณครู ฉันกำลัง\nต้มแกงกะหรี่อยู่น่ะ"
10085-832-450-1 = "พอเห็นหม้อที่\nน้ำเดือดปุดๆ แบบนี้แล้ว..."
10085-832-460-1 = "รู้สึกอบอุ่นยังไงก็ไม่รู้..."
10085-832-470-1 = "ทำแกงกะหรี่เสร็จแล้ว..."
10085-832-480-1 = "แต่ถ้าอยากใส่วัตถุดิบ\nอะไรเพิ่ม ก็บอกฉันนะ"
10085-832-490-1 = "อืม... กำลังไปได้\nด้วยดีไหมนะ?"
10085-832-500-1 = "คุณครู มาชิมให้หน่อยสิ"
10085-832-510-1 = "เห็นว่ามีคนใส่ช็อกโกแลต\nเป็นรสชาติลับ\nในแกงกะหรี่ด้วยนะ"
10085-832-520-1 = "ถ้างั้นลองใส่\nเครื่องดื่มชูกำลัง\nดูดีมั้ย..."
10085-832-530-1 = "…!\nอร่อยจนอยากร้องขอชีวิตเลย"
10085-832-540-1 = "แกงกะหรี่ออกรสชาติ\nแบบนี้ได้ด้วยเหรอเนี่ย"
10085-832-550-1 = "อืม อร่อยมากเลย"
10085-832-560-1 = "ถ้าเทียบกับแกงกะหรี่สำเร็จรูป\nมันก็พอใช้ได้อยู่นะ"
10085-832-570-1 = "ระ... รสชาติมันก็ตราตึง\nอยู่หรอกนะ..."
10085-832-580-1 = "อึก... ขอโทษนะ\nอันนี้ฉันกินไม่ได้หรอก..."
