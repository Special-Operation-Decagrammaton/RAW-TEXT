[translation]
10085-832-160-1 = "寒い…早く暖かい\n室内に戻りたい…。"
10085-832-170-1 = "こんな時期に\nキャンプだなんて…"
10085-832-180-1 = "副部長、ひどい。"
10085-832-190-1 = "ここ…\nやれることが…\n何もない…。"
10085-832-200-1 = "ち、近くに\n熊が出たの…？"
10085-832-210-1 = "ここにいて\n本当に大丈夫？"
10085-832-220-1 = "大変な思いをしたけど、\nたまにはこういう\n経験も悪くな…"
10085-832-230-1 = "た、たまには、\n本当に、たまになら…！"
10085-832-240-1 = "一番近いコンビニが…\nあの山の先…。"
10085-832-250-1 = "（Wi-Fiが…消えた？）"
10085-832-260-1 = "暖かいエナドリ…"
10085-832-270-1 = "普段なら論外だけど、\n今日だけは、\nあってもいいかも…。"
10085-832-280-1 = "先生も大変だね。\n年末なのに、\nこんなところまで\n連れて来られちゃって。"
10085-832-290-1 = "え？\n今の状況も楽しい…？"
10085-832-300-1 = "…やっぱり先生は、\n陽キャだったかぁ。"
10085-832-310-1 = "…先生も副部長に\n言われてきたの？"
10085-832-320-1 = "よかったら、ちょっと\n手伝ってもらっても、いい…？"
10085-832-330-1 = "う、うわっ！\n…あ、先生…。"
10085-832-340-1 = "ごめん、熊かと思って…。"
10085-832-350-1 = "片付けはしっかりしないと。"
10085-832-360-1 = "あとで副部長に\n怒られたら、いやだし。"
10085-832-370-1 = "採集…これがゲームなら\n1タップで終わったのに…。"
10085-832-380-1 = "どうしたの？\n服になんかついてる？"
10085-832-390-1 = "そうだね、これならいけそう。"
10085-832-400-1 = "これを私に？"
10085-832-410-1 = "ありがとう、私が\n集めたものもあげる。"
10085-832-420-1 = "もうこんなに集めたの？"
10085-832-430-1 = "…先生って、キャンプの\n才能があるんだね…。"
10085-832-440-1 = "あ、先生。いま、\nカレー作ってたところ。"
10085-832-450-1 = "ぶくぶくしてる\n鍋を見てると…"
10085-832-460-1 = "なんか和む気がする。"
10085-832-470-1 = "カレーの準備は\nできたけど…"
10085-832-480-1 = "他に入れたい具材が\nあれば、言って。"
10085-832-490-1 = "ん…これ、ちゃんと\n出来てるのかな。"
10085-832-500-1 = "先生、味見してくれる？"
10085-832-510-1 = "カレーの隠し味に\nチョコを入れることも\nあるみたい。"
10085-832-520-1 = "…それなら\nエナドリを入れても…。"
10085-832-530-1 = "あっ…！\nすごく美味しい！"
10085-832-540-1 = "カレーでこんな味が\n出せるなんて…。"
10085-832-550-1 = "うん、これは美味しい。"
10085-832-560-1 = "レトルトカレーと\n比べたら、まあまあ\n美味しいかも。"
10085-832-570-1 = "い、印象深い味、\nだね…。"
10085-832-580-1 = "うっ…ごめん、これは、\n食べられない…。"
