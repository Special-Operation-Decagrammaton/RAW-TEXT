[translation]
10085-832-160-1 = "好冷……\n想趕快回到\n溫暖的室內……"
10085-832-170-1 = "竟然在這種時期露營……"
10085-832-180-1 = "副部長，真過分。"
10085-832-190-1 = "這裡……\n根本沒什麼……\n能做的事……"
10085-832-200-1 = "附，附近\n有熊出沒……？"
10085-832-210-1 = "待在這裡\n真的沒問題嗎？"
10085-832-220-1 = "雖然有點辛苦，\n但偶爾感受這種\n經驗也不……"
10085-832-230-1 = "我，我是說偶爾，\n真的偶爾就好……！"
10085-832-240-1 = "最近的便利商店……\n在那座山的另一邊……"
10085-832-250-1 = "（Wi-Fi……\n　消失了？）"
10085-832-260-1 = "熱的能量飲料……"
10085-832-270-1 = "平常不會考慮，\n但只限今天的話，\n或許還能接受……"
10085-832-280-1 = "老師也真辛苦呢。\n明明都年底了，\n還被抓來這種地方。"
10085-832-290-1 = "咦？現在的狀況\n也挺愉快的……？"
10085-832-300-1 = "……果然\n老師是陽角嗎。"
10085-832-310-1 = "……老師也是被\n副部長叫來的嗎？"
10085-832-320-1 = "不介意的話，\n幫我個小忙，可以嗎……？"
10085-832-330-1 = "唔，唔啊！\n……啊，老師……"
10085-832-340-1 = "抱歉，我以為是熊……"
10085-832-350-1 = "收拾必須確實完成。"
10085-832-360-1 = "不然之後副部長\n要是生氣可就不好了。"
10085-832-370-1 = "採集……如果這是遊戲，\n只要點一下就行了說……"
10085-832-380-1 = "怎麼了？\n衣服沾到什麼了嗎？"
10085-832-390-1 = "也對，這樣應該可行。"
10085-832-400-1 = "要給我這個？"
10085-832-410-1 = "謝謝，我也把\n收集到的給你。"
10085-832-420-1 = "已經收集這麼多了？"
10085-832-430-1 = "……老師你，原來\n有露營的才能啊……"
10085-832-440-1 = "啊，老師。\n我正在煮咖哩。"
10085-832-450-1 = "看著正在咕嘟\n咕嘟的鍋子……"
10085-832-460-1 = "莫名有種安穩的感覺……"
10085-832-470-1 = "咖哩已經準備好了……"
10085-832-480-1 = "如果其他想加入的\n材料就告訴我吧。"
10085-832-490-1 = "嗯……這樣\n能順利煮好嗎？"
10085-832-500-1 = "老師，\n可以幫我試試味道嗎？"
10085-832-510-1 = "為了增加咖哩的風味，\n似乎能加入巧克力……"
10085-832-520-1 = "……既然如此，\n加入能量飲料應該也……"
10085-832-530-1 = "啊…！\n超好吃的！"
10085-832-540-1 = "咖哩居然能有\n這種味道……"
10085-832-550-1 = "嗯，這個很好吃。"
10085-832-560-1 = "和即食咖哩相比，\n還算普通好吃吧。"
10085-832-570-1 = "是，是讓人\n印象深刻的味道呢……"
10085-832-580-1 = "唔……抱歉，\n這我沒辦法吃……"
