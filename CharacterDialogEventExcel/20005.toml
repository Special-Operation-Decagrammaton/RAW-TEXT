[translation]
20005-803-140-1 = "爽やかな海の\n香りがしますね～。"
20005-803-150-1 = "楽しいバカンスになると\n良いですね！"
20005-803-160-1 = "準備万端です！\nペロロ様の浮き輪も\nしっかり持ちました！"
20005-803-170-1 = "あれ？脱衣所のカギ、\n確かここに置いたはず…？"
20005-803-180-1 = "あの、えっと…\nそ、そんなに\nじっと見られると、\n恥ずかしいです…。"
20005-803-190-1 = "ついに来ました！\n海ですよ、海！"
