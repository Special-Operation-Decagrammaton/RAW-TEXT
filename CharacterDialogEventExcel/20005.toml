[translation]
20005-803-140-1 = "상쾌한 바다\n냄새가 나네요~"
20005-803-150-1 = "즐거운 바캉스가\n되면 좋겠네요!"
20005-803-160-1 = "준비 만전이에요!\n페로로 님의 튜브도\n확실히 가지고 왔어요!"
20005-803-170-1 = "어라?\n분명 탈의실 열쇠를\n여기 두었었는데…."
20005-803-180-1 = "아, 저기…\n그, 그렇게 빤히\n바라보시면 부끄러워요…."
20005-803-190-1 = "드디어 왔어요!\n바다예요, 바다!"
