[translation]
20005-803-140-1 = "聞到清爽海洋\n的味道了～"
20005-803-150-1 = "希望會是\n愉快的假期！"
20005-803-160-1 = "準備齊全！\n佩洛洛的泳圈\n也帶來了！"
20005-803-170-1 = "咦？\n更衣室的鑰匙\n明明是放在這邊…"
20005-803-180-1 = "那個…\n那、那樣直盯著我看的話，\n我會很害羞…"
20005-803-190-1 = "終於到了！\n海邊！是海邊！"
20005-10803-140-1 = "有著\n清爽大海的味道呢~"
20005-10803-150-1 = "希望能度過一個\n愉快的休假！"
20005-10803-160-1 = "做了萬全準備！\n佩洛洛的泳圈也\n確實地帶來了！"
20005-10803-170-1 = "咦？\n我明明把更衣室的鑰匙\n放在這裡了啊…"
20005-10803-180-1 = "啊，那個…\n那、那樣直勾勾地盯者我看的話，\n我會害羞的…"
20005-10803-190-1 = "終於到了！\n是大海耶！大海！"
20005-900803-140-1 = "有股清爽\n大海的氣味呢～"
20005-900803-150-1 = "希望會是一段\n開心的假期！"
20005-900803-160-1 = "準備非常萬全！\n佩洛洛大人的泳圈\n也確實帶來了！"
20005-900803-170-1 = "咦？更衣室的鑰匙\n應該放在這裡才對啊…？"
20005-900803-180-1 = "啊，那個…\n那，那樣一直盯著看，\n我會很害羞的…"
20005-900803-190-1 = "終於到了！\n是大海唷，大海！"
