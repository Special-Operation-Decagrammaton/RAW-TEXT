[translation]
20005-803-140-1 = "ได้กลิ่นหอมสดชื่นของทะเล\nด้วยล่ะค่ะ~"
20005-803-150-1 = "ถ้าใช้วันหยุดพักผ่อนแบบสบายๆ\nได้ก็คงจะดีนะคะ!"
20005-803-160-1 = "ฉันพร้อมแล้วค่ะ!\nเตรียมห่วงยางเพโรโร่\nสำหรับว่ายน้ำมาเรียบร้อยแล้วค่ะ!"
20005-803-170-1 = "เอ๋?\nฉันวางกุญแจห้องเปลี่ยนเสื้อ\nเอาไว้ตรงนี้นี่นา..."
20005-803-180-1 = "อ่า คือว่า...\nฉะ... ฉันเขินนะคะ\nอย่าจ้องตาเป็นมันแบบนั้นสิคะ..."
20005-803-190-1 = "เรามาถึงแล้วค่ะ!\nดูสิคะ ทะเลค่ะ!"
