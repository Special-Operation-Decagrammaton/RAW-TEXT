[translation]
10078-830-10-1 = "와핫핫하-!\n또 보는구만, 선생님!"
10078-830-20-1 = "선생님! 여기다, 여기!\n기다리고 있었다고~?"
10078-830-30-1 = "딱~ \n바쁠 때 아닌가?"
10078-830-40-1 = "보자,\n좀 거들어 주지."
10078-830-50-1 = "자~,\n업무 종료 시간이\n다가온다!"
10078-830-60-1 = "너무 느긋하게 있을\n여유는 없다고!\n가자!"
10078-830-70-1 = "고생 많았어, 선생님.\n마지막으로 한 번 싹\n훑어볼까?"
10078-830-80-1 = "음? 뭐 할 말 있어?"
10078-830-90-1 = "내가 반격하지 않을 거라고\n생각하고 마음대로\n하다니…… 각오하라고!"
10078-830-100-1 = "그건 재촉하는 건가?"
10078-830-110-1 = "……나중에 제~대로 책임,\n질 수 있겠지?"
10078-830-120-1 = "와핫핫핫하!\n간지럼피우지 말라고!\n간지러워!"
10078-830-220-1 = "자. 뭘 찾으시나?"
10078-830-230-1 = "자! 여기는 뭐든지 있어!\n없는 것 말고는!\n와핫핫핫!"
10078-830-240-1 = "곧 가게 마감이니까!\n있는 만큼 가져가~!"
10078-830-250-1 = "응? 왜 그러지?"
10078-830-260-1 = "한눈팔면 다 팔려버린다!"
10078-830-270-1 = "음, 역시 그걸로 했구나.\n선생님은 좋은 심미안을\n가지고 있군."
10078-830-280-1 = "훌륭하구만!"
10078-830-290-1 = "과연! 그것도 나쁘지 않아!"
10078-830-300-1 = "그걸 갖고 싶었구나!"
