[translation]
10078-830-10-1 = "Wahaha! We meet again, Sensei!"
10078-830-20-1 = "Sensei! Over here! I've been waiting for you, you know?"
10078-830-30-1 = "You're...busy right about now, right?"
10078-830-40-1 = "Well then, why don't I help you out?"
10078-830-50-1 = "Now! The end of the work day is almost here!"
10078-830-60-1 = "There's no time to kick back and relax! Let's go!"
10078-830-70-1 = "Good work, Sensei. Let's go over it one more time!"
10078-830-80-1 = "Hm? Do you have something to say?"
10078-830-90-1 = "You think you can do whatever you want and I won't retaliate...? Just you wait!"
10078-830-100-1 = "Are you egging me on?"
10078-830-110-1 = "...Are you sure you can handle the consequences of this later on?"
10078-830-120-1 = "Wahaha! Don't tickle me! I'm too ticklish!"
10078-830-220-1 = "Now, what do you need?"
10078-830-230-1 = "Now! We've got everything here! Everything except for what we don't! Wahaha!"
10078-830-240-1 = "The store's gonna close soon! Grab as much as you can!"
10078-830-250-1 = "Huh? What's wrong?"
10078-830-260-1 = "Don't get distracted or they'll sell out!"
10078-830-270-1 = "Hm, I see. You have a good eye, Sensei."
10078-830-280-1 = "Excellent!"
10078-830-290-1 = "As expected! That's not bad at all!"
10078-830-300-1 = "You wanted that, did you?"
