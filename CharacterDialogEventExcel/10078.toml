[translation]
10078-830-10-1 = "วะฮ่าฮ่าฮ่า!\nได้เจอกันอีกแล้วนะคุณครู!"
10078-830-20-1 = "คุณครู! ทางนี้ๆ!\nฉันกำลังรออยู่เลยนะ~"
10078-830-30-1 = "ตอนนี้~\nกำลังยุ่งเลยใช่มั้ย?"
10078-830-40-1 = "ไหนดูซิ\nเดี๋ยวฉันช่วยนะ"
10078-830-50-1 = "เอาละ~\nใกล้จะถึงเวลา\nปิดงานแล้ว!"
10078-830-60-1 = "เราไม่มีเวลา\nมาชักช้ากันอยู่นะ!\nไปกันเถอะ"
10078-830-70-1 = "เหนื่อยมากเลยนะคุณครู\nเรามาตรวจตราดู\nเป็นครั้งสุดท้ายมั้ย?"
10078-830-80-1 = "หืม? มีอะไรจะบอกเหรอ?"
10078-830-90-1 = "คิดว่าฉันจะไม่ตอบโต้\nแล้วทำอะไรตามใจงั้นเหรอ\nเตรียมตัวโดนไว้เลยนะ!"
10078-830-100-1 = "จะรบเร้ากันงั้นเหรอ?"
10078-830-110-1 = "...ต่อไปจะ\nรับผิดชอบไหว~ ใช่มั้ย?"
10078-830-120-1 = "วะฮะฮะฮะฮ่า!\nอย่ามาจั๊กจี้กันสิ!\nจั๊กจี้นะ!"
10078-830-220-1 = "อืม หาอะไรอยู่เหรอ?"
10078-830-230-1 = "เอาละ! ตรงนี้มีทุกอย่างเลย!\nถ้าไม่นับของที่ไม่มีน่ะนะ! วะฮะฮะฮ่า!"
10078-830-240-1 = "ใกล้จะปิดร้านแล้วนะ!\nเหมาไปให้หมดเลย~!"
10078-830-250-1 = "หืม? เป็นอะไรเหรอ?"
10078-830-260-1 = "ถ้าวอกแวกละก็ เดี๋ยวของจะขายหมดซะก่อนนะ!"
10078-830-270-1 = "อืม เอาชิ้นนั้นไปนี่เอง\nคุณครูตาถึงอยู่นะเนี่ย"
10078-830-280-1 = "ยอดเยี่ยมเลย!"
10078-830-290-1 = "ชิ้นนั้นก็ไม่เลวเลยนะ!"
10078-830-300-1 = "อยากได้ชิ้นนั้นเองสินะ!"
