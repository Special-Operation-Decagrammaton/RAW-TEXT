[translation]
10078-830-10-1 = "哈～哈哈哈哈！\n又見面了啊，老師！"
10078-830-20-1 = "老師！這邊這邊！\n等你很久囉～！"
10078-830-30-1 = "正好到了要忙起來\n的時候了啊？"
10078-830-40-1 = "我看，\n就讓我來幫點忙吧。"
10078-830-50-1 = "來吧，\n工作就快完成了！"
10078-830-60-1 = "沒時間悠哉了！\n我們走吧！"
10078-830-70-1 = "辛苦了，老師。\n最後再大致瀏覽一下吧。"
10078-830-80-1 = "嗯？有什麼事嗎？"
10078-830-90-1 = "如果以為\n我不會反擊\n就為所欲為……\n要做好覺悟哦！"
10078-830-100-1 = "那是在催我嗎？"
10078-830-110-1 = "……之後會好～好\n負起責任的吧？"
10078-830-120-1 = "哈～哈哈哈哈！\n別搔我癢啦！\n很癢耶！"
10078-830-220-1 = "那麼，要找什麼呢？"
10078-830-230-1 = "來！這裡什麼都有哦！\n除了沒有的東西之外！\n哈～哈哈哈！"
10078-830-240-1 = "店馬上就要打烊了！\n有多少就拿多少吧～！"
10078-830-250-1 = "嗯？怎麼了？"
10078-830-260-1 = "一不留神就會賣光的！"
10078-830-270-1 = "嗯，果然選了那個。\n老師很有眼光呢。"
10078-830-280-1 = "太棒了！"
10078-830-290-1 = "原來如此！這個也不錯呢！"
10078-830-300-1 = "原來是想要那個啊！"
