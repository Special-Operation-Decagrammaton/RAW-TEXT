[translation]
10078-830-10-1 = "ハーハッハッハッハ！\nまた会ったな、先生！"
10078-830-20-1 = "先生！こっちだこっち！\n待ちわびていたぞ～！"
10078-830-30-1 = "ちょうど\n忙しくなってきた\n頃合いじゃあないか？"
10078-830-40-1 = "どれ、\n少し手伝ってやろう。"
10078-830-50-1 = "さあ、\nもう業務終了時間が\n近いぞ！"
10078-830-60-1 = "あまりのんびりしている\n余裕はない！行こう！"
10078-830-70-1 = "お疲れ様だな、先生。\n最後にざっと見て\nいこうじゃあないか。"
10078-830-80-1 = "うん？何か用かな？"
10078-830-90-1 = "私が反撃しないと\n思って好き放題\nしおってからに……\n覚悟しておくのだな！"
10078-830-100-1 = "それは急かして\nいるのかな？"
10078-830-110-1 = "……後で\nちゃ～んと責任、\n取れるんだろうな？"
10078-830-120-1 = "ハーハッハッハッハ！\nくすぐるのを\nやめてくれ！\nくすぐったい！"
10078-830-220-1 = "さあ、何をお探しかな？"
10078-830-230-1 = "さあ！ここにはなんでもあるぞ！\n無いもの以外はな！\nハーッハッハッハッ！"
10078-830-240-1 = "もう店じまいだからな！\nあるだけ持っていけ～！"
10078-830-250-1 = "ん？どうしたんだ？"
10078-830-260-1 = "よそ見をしていたら\n売り切れてしまうぞ！"
10078-830-270-1 = "うむ、やはりそれにしたのだな。\n先生は良い審美眼を持っている。"
10078-830-280-1 = "素晴らしい！"
10078-830-290-1 = "なるほど！それも悪くないな！"
10078-830-300-1 = "それが欲しかったのだな！"
