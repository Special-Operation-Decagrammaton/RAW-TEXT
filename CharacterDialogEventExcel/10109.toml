[translation]
10109-842-240-1 = "ฮุฮุ สวัสดีค่ะ คุณครู\nนี่ก็นานแล้วนะคะ"
10109-842-250-1 = "ที่ฉันไม่ได้เจอคุณครู\nในค่ำคืนที่มิลเลเนียมแบบนี้"
10109-842-260-1 = "เป็นค่ำคืนที่ดีจังเลยค่ะ คุณครู\nฮุฮุ ชุดนี้น่ะเหรอคะ?"
10109-842-270-1 = "พอดีฉันกำลังเตรียม\nปาร์ตี้ชุดนอนกับ\nสมาชิกเซมิน่าอยู่น่ะค่ะ"
10109-842-280-1 = "คุณครูมีอะไรปิดบัง\nอยู่หรือเปล่าคะ?"
10109-842-290-1 = "(จ้อง~)"
10109-842-300-1 = "ฮุฮุ งานสนุกกว่าที่คิด\nเยอะเลยนะคะ"
10109-842-310-1 = "ขอบคุณที่ทำงานอย่างหนักนะคะ คุณครู"
10109-842-320-1 = "ถ้ายังไม่เหนื่อยละก็\nมาอยู่กับฉัน\nต่ออีกหน่อยมั้ยคะ?"
10109-842-330-1 = "ค่ำคืนในฤดูหนาว\nยาวนานจังเลยนะคะ..."
10109-842-340-1 = "เราใส่ชุดนอนวิ่งวุ่น\nไปรอบโรงเรียน\nจนถึงดึกดื่นเลย"
10109-842-350-1 = "รู้สึกตื่นเต้นเหมือน\nทำเรื่องอะไรไม่ดีเลยนะคะ"
10109-842-360-1 = "ฉันรู้กฎส่วนใหญ่\nของบอร์ดเกมดี "
10109-842-370-1 = "แต่ก็ไม่ค่อยได้\nเล่นจริงๆ บ่อยนักค่ะ"
10109-842-380-1 = "ยูกะจังน่ะ ต่อให้จะพูด\nไปอย่างนั้น แต่ก็ดู\nค่อนข้างตื่นเต้นนะคะ"
10109-842-390-1 = "ฉันไม่ได้เห็นยูกะจัง\nที่มีความปรารถนาอย่างแรงกล้า\nแบบนั้นนานแล้วค่ะ"
10109-842-400-1 = "(ถ้าประธานริโอะ\nมาเข้าร่วมปาร์ตี้ด้วย\nก็น่าจะดีนะ...)"
10109-842-560-1 = "อ๊ะ คุณครู ฉันกำลังจัดบอร์ดเกม\nที่จะใช้เล่นในปาร์ตี้อยู่เลยค่ะ"
10109-842-570-1 = "มาช่วยจัด\nบอร์ดเกมหน่อยได้มั้ยคะ?"
10109-842-580-1 = "มันปนกันยุ่ง\nกว่าที่คิดเยอะเลยค่ะ..."
10109-842-590-1 = "ถึงปาร์ตี้จะจบไปแล้ว"
10109-842-600-1 = "แต่ถ้ามีบอร์ดเกม\nที่สนใจก็บอกฉันนะคะ"
10109-842-610-1 = "ถึงมันจะดึกแล้ว..."
10109-842-620-1 = "แต่ถ้าเป็นคำขอร้องของคุณครูละก็\nฉันเล่นต่อด้วยอีกหน่อยดีมั้ยคะ?"
10109-842-630-1 = "บอร์ดเกมก็มี\nหลายประเภทเลยนะคะ"
10109-842-640-1 = "จริงๆ เลย ฉันบอกให้ทุกคน\nเก็บกวาดให้เรียบร้อยแล้วนี่นา..."
10109-842-650-1 = "อ๊ะ อยู่ทางนั้น\nสินะคะ"
10109-842-660-1 = "หรือว่า ดีไซน์นี้มัน..."
10109-842-670-1 = "อุ๊ย เป็นบอร์ดเกม\nที่น่าสนุกเลยนะคะ"
10109-842-680-1 = "อันนี้เล่นยังไง\nเหรอคะ?"
10109-842-690-1 = "ค่ะ มาเก็บกวาด\nกันต่อเลยค่ะ"
10109-842-700-1 = "อ๊ะ คุณครู ถ้าไม่ติดอะไร"
10109-842-710-1 = "มาช่วยเตรียมปาร์ตี้\nสักเดี๋ยวได้มั้ยคะ?"
10109-842-720-1 = "ฉันกำลังแบ่งงานของแต่ละคน\nในปาร์ตี้ชุดนอนอยู่ค่ะ"
10109-842-730-1 = "ค่ะ บอกฉันได้เลยค่ะ"
10109-842-740-1 = "ถ้ามัดผมก็สะดวกอยู่หรอกค่ะ แต่ว่า\nมันเย็นๆ ตรงท้ายทอยจังเลยนะคะ..."
10109-842-750-1 = "นี่ก็สามครั้งแล้ว...\nคุณครูมองอยู่ตลอดเลยใช่มั้ยคะ?"
10109-842-760-1 = "ฮุฮุ เป็นไอเดียที่ดีเลยค่ะ"
10109-842-770-1 = "สมกับที่เป็นคุณครูเลยนะคะ\nฉันจะจดจำเอาไว้ค่ะ"
10109-10842-240-1 = "สวัสดีค่ะ คุณครู\nนี่ก็นานแล้วนะคะ"
