[translation]
10109-842-240-1 = "ふふっ、\nこうして真夜中の\nミレニアムで先生と"
10109-842-250-1 = "お会いするなんて……\nなんだか久しぶりな\n気がします。"
10109-842-260-1 = "こんばんは、先生。\nふふ、これですか？"
10109-842-270-1 = "セミナーの皆さんと\nパジャマパーティーを\nすることになったんです。"
10109-842-280-1 = "……先生、何か隠し事を\nしていませんか？"
10109-842-290-1 = "じーっ……"
10109-842-300-1 = "ふふ、想定外では\nありますが、面白く\nなってきましたね。"
10109-842-310-1 = "先生、もうお休みに\nなりますか？"
10109-842-320-1 = "まだでしたら少しだけ…\n私たちに付き合って\nいただけませんか？"
10109-842-330-1 = "冬の夜は…\n長いですから。"
10109-842-340-1 = "パジャマで深夜の\nキャンパスを\n歩いていると……"
10109-842-350-1 = "ちょっと悪いことを\nしているみたいで、\nワクワクしますね。"
10109-842-360-1 = "ボードゲームのルールは\n把握していますが、"
10109-842-370-1 = "実際に遊んだ\nことは…片手で\n数えられるほどしか…。"
10109-842-380-1 = "ユウカちゃん……\nああ言ってますけど、\n浮かれているんだと\n思います。"
10109-842-390-1 = "あんなやる気に\n満ちた顔は久しぶりに\n見ました。"
10109-842-400-1 = "（リオ会長もパーティーに\n来ていただきたかったん\nですが……）"
10109-842-560-1 = "今、パーティーに使う\nボードゲームを\nまとめているのですが…"
10109-842-570-1 = "思ったより\n散らかってしまって……"
10109-842-580-1 = "先生、\n手を貸していただいても\nよろしいですか？"
10109-842-590-1 = "パーティーは\n終わりましたが、"
10109-842-600-1 = "気になるボードゲームが\nありましたら、\nお気軽にどうぞ。"
10109-842-610-1 = "もう遅い時間ですよ？"
10109-842-620-1 = "……でも先生の\nお願いでしたら、\nご一緒いたします。"
10109-842-630-1 = "ボードゲームって、\n種類がたくさん\nあるんですね。"
10109-842-640-1 = "使ったものは元の\n位置に戻す、\nあれだけ言ったのに……"
10109-842-650-1 = "ああ、そこに\nあったんですね。"
10109-842-660-1 = "この形は、もしかして…"
10109-842-670-1 = "あら、面白そうですね。"
10109-842-680-1 = "これは……どのように\nして遊ぶのでしょう？"
10109-842-690-1 = "はい、次。\n整理整頓、続けますよ。"
10109-842-700-1 = "あ、先生、\n手が空いていましたら、"
10109-842-710-1 = "パーティーの準備を\n手伝っていただけませんか？"
10109-842-720-1 = "パジャマパーティーの\n役割分担を決めている\nところなんです。"
10109-842-730-1 = "はい、\nなんでもお申し付けください。"
10109-842-740-1 = "結ぶのは楽なんですが…\n少しうなじがスースーして…。"
10109-842-750-1 = "3回目……先生がこちらを\n見た回数のことです。"
10109-842-760-1 = "ふふ、名案です、先生。"
10109-842-770-1 = "なるほど、\n今のは参考にいたします。"
