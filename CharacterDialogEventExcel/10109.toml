[translation]
10109-842-240-1 = "Hello, Sensei. It's so late at night to be running into you."
10109-842-250-1 = "I haven't seen you at Millennium in too long."
10109-842-260-1 = "Good evening, Sensei. Oh, this outfit?"
10109-842-270-1 = "I was preparing for a pajama party with the other members of Seminar."
10109-842-280-1 = "Are you hiding something, Sensei?"
10109-842-290-1 = "(staaare)"
10109-842-300-1 = "Heehee, things are going more enjoyably than I expected."
10109-842-310-1 = "Great job, Sensei."
10109-842-320-1 = "If you aren't too tired yet, would you mind spending a little more time with us?"
10109-842-330-1 = "...Winter nights can be very long."
10109-842-340-1 = "Wandering around the campus in our pajamas in the late hours of the night..."
10109-842-350-1 = "...makes my heart pound, like I'm doing something bad."
10109-842-360-1 = "I know most of the rules for the board games, but... "
10109-842-370-1 = "...I don't have much actual experience playing them."
10109-842-380-1 = "Despite what she says, Yuuka seems quite excited."
10109-842-390-1 = "I haven't seen Yuuka this enthusiastic in a long while."
10109-842-400-1 = "(It would have been nice if President Rio had also attended the party...)"
10109-842-560-1 = "Ah, Sensei. I was just organizing the board games we're going to play at the party."
10109-842-570-1 = "Could you help me organize the board games?"
10109-842-580-1 = "...It's a bigger mess than I expected."
10109-842-590-1 = "The party is over, but..."
10109-842-600-1 = "...please let me know if there's a board game you're interested in."
10109-842-610-1 = "It's a bit late, but..."
10109-842-620-1 = "...if you'd like, I can stay and play a little more."
10109-842-630-1 = "There's quite a variety of board games."
10109-842-640-1 = "Seriously... I told everyone to tidy up after themselves."
10109-842-650-1 = "Ah, so it was over there."
10109-842-660-1 = "Could this design be...?"
10109-842-670-1 = "Oh my, what an interesting looking board game."
10109-842-680-1 = "I wonder how you play this."
10109-842-690-1 = "Yes, let's keep on organizing."
10109-842-700-1 = "Oh, Sensei. If you don't mind..."
10109-842-710-1 = "...could you lend a hand with the party preparations?"
10109-842-720-1 = "We were delegating which roles we would each take on at the pajama party."
10109-842-730-1 = "Yes, please tell me."
10109-842-740-1 = "It's more comfortable tying my hair up, but the back of my neck feels a little cool..."
10109-842-750-1 = "...That was three times. You were watching, right?"
10109-842-760-1 = "Heehee, that's a good idea."
10109-842-770-1 = "Just what I'd expect you to say. I'll make note of it."
