[translation]
10115-845-190-1 = "Do you like baseball, Sensei?"
10115-845-200-1 = "Because I love it!"
10115-845-210-1 = "Today's game is important!"
10115-845-220-1 = "But every game is important!"
10115-845-230-1 = "The game isn't going well..."
10115-845-240-1 = "We can still make a comeback!"
10115-845-250-1 = "They say real baseball starts from the 9th inning, with 2 outs!"
10115-845-260-1 = "You have to be prepared to grab the opportunity when it arises!"
10115-845-270-1 = "I still can't believe it."
10115-845-280-1 = "I hit a home run... That hit, that trajectory..."
10115-845-290-1 = "Baseball is really amazing!"
10115-845-300-1 = "What's wrong, Sensei? Do you have any questions about the rules of baseball?"
10115-845-310-1 = "I was looking through the game records."
10115-845-320-1 = "It's easy nowadays because they're all organized on the internet."
10115-845-330-1 = "But in the past, people had to dig for resources piece by piece."
10115-845-340-1 = "D-Don't poke my sides..."
10115-845-350-1 = "Sensei! Not my armpit either...!"
10115-845-360-1 = "Since we're at a game, and there are lots of people..."
10115-845-370-1 = "...should we order something to eat?"
10115-845-380-1 = "Baseball stadium foods are delicacies!"
10115-845-390-1 = "Although the prices are...a bit. Let's not think about it. Yeah."
10115-845-530-1 = "They're holding a raffle at the stadium!"
10115-845-540-1 = "I don't know how I got roped into helping them out, though..."
10115-845-550-1 = "Welcome!"
10115-845-560-1 = "Would you like to try your luck?"
10115-845-570-1 = "How is it, Sensei? Did I sound professional?"
10115-845-580-1 = "Hello, Sensei. If you have any leftover raffle tickets, please use them all before you leave!"
10115-845-590-1 = "I'm just helping out for today, but they said they'll pay me for the part-time work!"
10115-845-600-1 = "I'm thinking of changing my mitt first."
10115-845-610-1 = "In baseball, skills are important, but so is luck."
10115-845-620-1 = "...Maybe I just need more luck to be able to hit a home run?"
10115-845-630-1 = "First place! It's the first place prize, Sensei! Woah, how amazing!"
10115-845-640-1 = "This is the second place prize! It's a shame that you didn't get first place, but this is still incredible!"
10115-845-650-1 = "A lucky prize."
10115-845-660-1 = "In a way, this prize is the essence of a raffle, right?"
10115-845-670-1 = "An honorable mention..."
10115-845-680-1 = "Well, whatever. This is still good, right?"
10115-845-690-1 = "A participation award..."
10115-845-700-1 = "Don't worry about it, Sensei! They say participation is what really matters! Yeah!"
10115-845-710-1 = "...Okay, nothing happened! ...Isn't that right, Sensei?"
10115-845-720-1 = "What really matters in these kinds of situations is to be consistent with your work output!"
10115-845-730-1 = "Just like training!"
10115-845-740-1 = "Repetitive work IS pretty boring..."
10115-845-750-1 = "...but there's a lot you can learn from it too!"
10115-845-760-1 = "They say great players eat the same things, sleep at the same time..."
10115-845-770-1 = "...and meet the same, strict standards for training everyday..."
10115-845-780-1 = "I'm...not sure if I have the energy for all that..."
10115-845-790-1 = "You're making me realize how incredible you are again."
10115-845-800-1 = "Clocking in every day...getting swarmed by work..."
10115-845-810-1 = "What? Don't I also go to school every day?"
10115-845-820-1 = "But I heard work is way harder than school, no?"
10115-845-830-1 = "It's like...the fruits of training!"
10115-845-840-1 = "Congratulations, Sensei!"
10115-845-850-1 = "You did it, Sensei!"
10115-845-860-1 = "I'm going to work hard too. Please watch me!"
10115-845-870-1 = "And that's it for today's schedule!"
10115-845-880-1 = "Sooo, do you have some spare time after this?"
