[translation]
10115-845-190-1 = "ชอบเบสบอล\nมั้ยคะคุณครู?"
10115-845-200-1 = "ฉันชอบมากเลยค่ะ!"
10115-845-210-1 = "การแข่งขันวันนี้\nเป็นเกมสำคัญเลยค่ะ!"
10115-845-220-1 = "ที่จริงก็ไม่มีการแข่งขันไหน\nที่ไม่สำคัญหรอกค่ะ!"
10115-845-230-1 = "แม้เกมจะดูละเอียดอ่อน..."
10115-845-240-1 = "แต่ฉันเชื่อว่า\nเกมจะพลิกได้ค่ะ!"
10115-845-250-1 = "ว่ากันว่าเบสบอลต้องลุ้น\nตั้งแต่ปลายอินนิ่งที่ 9 ค่ะ!"
10115-845-260-1 = "ถ้าไม่เตรียมพร้อมอยู่เสมอ\nโอกาสก็ไม่เข้าหาหรอกค่ะ!"
10115-845-270-1 = "ฉันยังไม่อยากเชื่อเลยค่ะ"
10115-845-280-1 = "ฉันตีลูกโฮมรันเหรอเนี่ย...\nการตีครั้งนั้น วิถีแบบนั้น..."
10115-845-290-1 = "เบสบอลมันดีจริงๆ เลยนะคะ!"
10115-845-300-1 = "ทำไมเหรอคะ คุณครู?\nคุณครูพอรู้กติกา\nของเบสบอลมั้ยคะ?"
10115-845-310-1 = "ฉันกำลังหา\nสถิติการแข่งขันอยู่ค่ะ"
10115-845-320-1 = "ตอนนี้มันสะดวก\nเพราะมีในอินเทอร์เน็ต"
10115-845-330-1 = "ได้ยินว่าแต่ก่อน\nต้องไล่หาข้อมูล\nทีละอย่างๆ เองเลยนะคะ"
10115-845-340-1 = "ยะ... อย่าจิ้มสีข้างกันสิคะ"
10115-845-350-1 = "คุณครู!\nตรงรักแร้ก็ด้วยค่ะ...!"
10115-845-360-1 = "ตอนนี้การแข่งขันยังไม่จบ\nแล้วคนก็เยอะด้วย..."
10115-845-370-1 = "สั่งอะไรมาดีมั้ยคะ?"
10115-845-380-1 = "อาหารในสนามเบสบอล\nรสชาติดีนะคะ!"
10115-845-390-1 = "แต่ราคา... ก็ค่อนข้างจะ...\nเราลืมๆ มันไปเถอะค่ะ"
10115-845-530-1 = "ได้ยินว่าในสนามกีฬา\nมีสุ่มแจกรางวัลด้วยค่ะ!"
10115-845-540-1 = "ไม่รู้ทำไมฉันถึง\nกลายมาเป็นผู้ช่วย\nได้นะคะเนี่ย..."
10115-845-550-1 = "เชิญค่ะ!"
10115-845-560-1 = "มาลองเสี่ยงโชค\nดูมั้ยคะ?"
10115-845-570-1 = "เป็นไงคะ คุณครู?\nตอนนี้ฉันเหมือนมือโปรมั้ยคะ?"
10115-845-580-1 = "สวัสดีค่ะคุณครู ถ้ายังมี\nบัตรสุ่มเหลืออยู่\nก็ควรมาใช้ให้หมดเลยนะคะ!"
10115-845-590-1 = "ถึงฉันจะเป็นผู้ช่วย\nสุ่มรางวัลรายวัน\nแต่ว่าฉันก็จะได้\nค่าจ้างงานพาร์ทไทม์ค่ะ!"
10115-845-600-1 = "ฉันว่าจะเปลี่ยน\nถุงมือคู่ใหม่ก่อนค่ะ"
10115-845-610-1 = "สำหรับเบสบอลแล้ว\nทักษะก็เป็นสิ่งสำคัญ\nแต่ก็ต้องมีโชคช่วยด้วยค่ะ"
10115-845-620-1 = "ที่ฉันตีลูกโฮมรันไม่ได้...\nน่าจะเป็นเพราะฉัน\nโชคไม่ดีนะคะ!"
10115-845-630-1 = "รางวัลที่ 1! ได้รางวัลที่ 1 เลยค่ะ\nคุณครู! ว้าว สุดยอดเลยค่ะ!"
10115-845-640-1 = "นี่รางวัลที่ 2 เลยนะคะ!\nถึงจะน่าเสียดาย\nที่ไม่ได้รางวัลที่ 1\nแต่นี่ก็ดีแล้วค่ะ!"
10115-845-650-1 = "รางวัลแห่งความโชคดีสินะคะ"
10115-845-660-1 = "จะว่าไป\nอาจเรียกได้ว่าของชิ้นนี้\nเป็นแก่นแท้ของการสุ่มรางวัล\nเลยก็ได้นะคะ?"
10115-845-670-1 = "รางวัลชมเชย... สินะคะ"
10115-845-680-1 = "แต่ก็ไม่เป็นไรหรอกค่ะ\nชิ้นนี้ก็พอใช้ได้เลยนี่คะ?"
10115-845-690-1 = "รางวัลเข้าร่วม..."
10115-845-700-1 = "ไม่เป็นไรนะคะคุณครู!\nว่ากันว่าแค่เข้าร่วม\nก็ถือว่ามีความหมายแล้วค่ะ!"
10115-845-710-1 = "เอาละ...\nไม่มีเรื่องอะไรทั้งนั้นค่ะ!\nใช่มั้ยคะ... คุณครู?"
10115-845-720-1 = "สิ่งสำคัญของงานแบบนี้ ฉันว่าคือ\nการทำต่อเนื่องให้เท่ากันในทุกวันค่ะ"
10115-845-730-1 = "การฝึกซ้อมก็เหมือนกันค่ะ!"
10115-845-740-1 = "ถึงงานที่ทำซ้ำๆ\nมันจะน่าเบื่อ..."
10115-845-750-1 = "แต่เราจะได้บางอย่าง\nจากสิ่งนั้นอย่างแน่นอนค่ะ"
10115-845-760-1 = "นักกีฬาเก่งๆ จะกินของเดิมๆ\nและนอนเวลาเดิมทุกวัน"
10115-845-770-1 = "ส่วนเรื่องการฝึกซ้อม\nก็จะทำตามมาตรฐานค่ะ..."
10115-845-780-1 = "ฉัน... น่าจะทำ\nแบบนั้นไม่ไหวหรอกค่ะ..."
10115-845-790-1 = "ฉันรู้สึกว่าคุณครู\nก็ยอดเยี่ยมเหมือนกันค่ะ"
10115-845-800-1 = "ไปทำงานทุกวัน...\nแล้วก็โหมงานหนักตลอด..."
10115-845-810-1 = "คะ? ฉันก็ไปโรงเรียนทุกวัน\nเหมือนกันงั้นเหรอคะ?"
10115-845-820-1 = "แต่ได้ยินว่าการทำงานมันยากกว่า\nการเรียนเยอะเลยไม่ใช่เหรอคะ?"
10115-845-830-1 = "นี่เป็นเหมือนกับ...\nผลจากการฝึกซ้อมเลยค่ะ!"
10115-845-840-1 = "ยินดีด้วยค่ะ คุณครู!"
10115-845-850-1 = "สำเร็จแล้วนะคะ คุณครู!"
10115-845-860-1 = "ฉันก็จะพยายามค่ะ!\nคอยเฝ้าดูฉันด้วยนะคะ!"
10115-845-870-1 = "งานวันนี้เสร็จเท่านี้!"
10115-845-880-1 = "ถ้างั้น หลังจากนี้\nพอมีเวลามั้ยคะ?"
