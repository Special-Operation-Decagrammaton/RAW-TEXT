[translation]
10115-845-190-1 = "老師！你喜歡棒球嗎？"
10115-845-200-1 = "我非常喜歡！"
10115-845-210-1 = "今天是重要的比賽哦！"
10115-845-220-1 = "不，沒有一場\n比賽不是那樣的！"
10115-845-230-1 = "不詳的氣氛……"
10115-845-240-1 = "不過我還是相信！\n哪怕從現在開始也好，\n一起上演逆轉劇吧！"
10115-845-250-1 = "棒球在九局下半\n兩出局之後才是\n重頭戲哦！"
10115-845-260-1 = "不怠於準備的人，\n機會的女神\n才會對他微笑！"
10115-845-270-1 = "真不敢相信……"
10115-845-280-1 = "我竟然……\n打出了全壘打……"
10115-845-290-1 = "棒球……實在太棒了！"
10115-845-300-1 = "如果是規則的話，\n請儘管問我吧！"
10115-845-310-1 = "……我正在看比賽紀錄。"
10115-845-320-1 = "如此龐大的紀錄，\n以前好像都是\n用紙本管理的。"
10115-845-330-1 = "現在簡直\n無法想像呢……"
10115-845-340-1 = "哇哇，很癢耶！"
10115-845-350-1 = "老師！\n請不要摸奇怪的地方！"
10115-845-360-1 = "真是的……\n現在還在比賽耶……！？\n而且有人在看哦？"
10115-845-370-1 = "球場美食！\n這也是絕品哦！"
10115-845-380-1 = "老師，去吃點東西吧！"
10115-845-390-1 = "至於價格……\n在意的話就輸了！"
10115-845-530-1 = "老師！體育場\n正在舉辦抽獎！"
10115-845-540-1 = "其實我被抓來\n幫忙了……"
10115-845-550-1 = "現在正在舉辦抽獎！"
10115-845-560-1 = "請來看看吧！"
10115-845-570-1 = "怎麼樣？\n有像是店員嗎？"
10115-845-580-1 = "剩下的抽獎券，\n請記得用完哦！"
10115-845-590-1 = "好像也會照常支付\n打工的薪水哦！"
10115-845-600-1 = "嘿嘿，來買個新手套吧？"
10115-845-610-1 = "選手必須具備的，\n是技術和運氣。"
10115-845-620-1 = "……之所以\n打不出全壘打，\n說不定是運氣不好！"
10115-845-630-1 = "哇！1等獎！\n是1等獎耶！\n太厲害了！"
10115-845-640-1 = "是2等獎呢！\n真不愧是你，老師！"
10115-845-650-1 = "好像是幸運獎呢！\n老師！"
10115-845-660-1 = "總覺得現在的話，\n感覺能打出全壘打！"
10115-845-670-1 = "是3等獎呢。"
10115-845-680-1 = "有得獎是件好事！"
10115-845-690-1 = "參加獎啊……"
10115-845-700-1 = "沒關係的，老師！\n不是有句話叫\n「參加就有意義」嗎！"
10115-845-710-1 = "…………剛才\n什麼都沒發生。\n對吧，老師？"
10115-845-720-1 = "重要的……\n是每天持之以恆！"
10115-845-730-1 = "就跟訓練一樣呢！"
10115-845-740-1 = "就算是例行公事，\n只要習慣就沒問題了！"
10115-845-750-1 = "每天累積的成果，\n會讓人越來越輕鬆的哦。"
10115-845-760-1 = "偉大的選手從起床時間、\n訓練清單到餐點內容都會\n全部做好規劃……"
10115-845-770-1 = "並且照著進行。"
10115-845-780-1 = "我的話……\n感覺做不到……"
10115-845-790-1 = "現在說可能有點晚了……\n不過老師還真厲害呢。"
10115-845-800-1 = "早上就要上班，\n整天都在工作……"
10115-845-810-1 = "跟每天上學一樣……？"
10115-845-820-1 = "但我聽說大人比學校\n辛苦很多倍耶？不是嗎？"
10115-845-830-1 = "努力有所收穫，\n就是這麼回事吧！"
10115-845-840-1 = "恭喜你，老師！"
10115-845-850-1 = "成功了呢，老師！"
10115-845-860-1 = "為了不輸給你，\n我也會打起精神的！"
10115-845-870-1 = "今天就到此為止！\n辛苦了！"
10115-845-880-1 = "老師！你接下來有空嗎？"
