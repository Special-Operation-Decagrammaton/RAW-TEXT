[translation]
10115-845-190-1 = "先生！\n野球はお好きですか？"
10115-845-200-1 = "私は、大好きです！"
10115-845-210-1 = "今日は重要な\n試合ですよ！"
10115-845-220-1 = "いえ、そうでない\n試合などありませんが！"
10115-845-230-1 = "不穏な空気……"
10115-845-240-1 = "でも、私は信じてます！\n今からでも逆転劇を\n起こしてやりましょう！"
10115-845-250-1 = "野球は\n9回裏2アウトからが\n本番ですよ！"
10115-845-260-1 = "準備を怠らない者に、\nチャンスの女神が\nほほ笑むんですから！"
10115-845-270-1 = "信じられません……"
10115-845-280-1 = "私が……\nホームランを……"
10115-845-290-1 = "野球って……\n本当に最高ですね！"
10115-845-300-1 = "ルールのことでしたら\nなんでも私に\n聞いてください！"
10115-845-310-1 = "……試合記録を\n見ていました。"
10115-845-320-1 = "この膨大な記録を、\n昔は紙で管理して\nいたんだそうです。"
10115-845-330-1 = "……今では\n考えられない\nですよね……。"
10115-845-340-1 = "わわっ、\nくすぐったい！"
10115-845-350-1 = "先生！変なところ\n触らないでください！"
10115-845-360-1 = "もう……\n試合中ですよ……！？\n人目もありますからね？"
10115-845-370-1 = "球場飯！これが\nまた絶品なんですよ！"
10115-845-380-1 = "先生、何か\n食べましょう！"
10115-845-390-1 = "値段は……\n気にしたら負けです！"
10115-845-530-1 = "先生！スタジアムで\n抽選会をやってます！"
10115-845-540-1 = "実は私、その\n手伝いをすることに\nなりまして……。"
10115-845-550-1 = "ただいま、抽選会\n開催中です！"
10115-845-560-1 = "どうぞ\nお立ち寄りください！"
10115-845-570-1 = "どうでした？\nスタッフっぽ\nかったですか？"
10115-845-580-1 = "余ってる抽選券、全部\n使ってってくださいね！"
10115-845-590-1 = "ちゃんとバイト代も\n出るみたいです！"
10115-845-600-1 = "へへ、グローブ、\n買い替えよっかな！"
10115-845-610-1 = "選手に求められるのは、\nテクニックと、運です。"
10115-845-620-1 = "……ホームランが\n打てなかったのは、\n運が悪かったからかも！"
10115-845-630-1 = "うわあ！1等賞！\n1等賞ですよ！\nすごいです！"
10115-845-640-1 = "2等賞ですね！\nさすがです、先生！"
10115-845-650-1 = "ラッキー賞だそうです！\n先生！"
10115-845-660-1 = "なんだか今なら\nホームランが\n打てそうな気がします！"
10115-845-670-1 = "3等賞ですね。"
10115-845-680-1 = "賞があるのは\n良いことです！"
10115-845-690-1 = "参加賞かぁ……"
10115-845-700-1 = "大丈夫ですよ、先生！\n参加することに\n意義がある、って\n言うじゃないですか！"
10115-845-710-1 = "…………いま、何も\n起きませんでした。\nね？先生？"
10115-845-720-1 = "大切なのは……\n毎日コツコツ続けること！"
10115-845-730-1 = "練習と同じですね！"
10115-845-740-1 = "ルーティンも、\n慣れれば大丈夫です！"
10115-845-750-1 = "毎日の積み重ねで\n苦にならなくなりますよ。"
10115-845-760-1 = "偉大な選手は起床時間から\n訓練メニュー、果ては献立一つに\n至るまで全てスケジュールし、"
10115-845-770-1 = "その通りにこなすそうです。"
10115-845-780-1 = "私には……\nできる気がしません……。"
10115-845-790-1 = "今更ですけど……\n先生ってすごいんですね。"
10115-845-800-1 = "朝出勤して、\n一日中お仕事して……"
10115-845-810-1 = "毎日登校するのと一緒……？"
10115-845-820-1 = "でも大人は学校の何倍も大変って\n聞きますよ？違うんですか？"
10115-845-830-1 = "努力が実を結んだ、って\nことですよね！"
10115-845-840-1 = "おめでとう\nございます、先生！"
10115-845-850-1 = "やりましたね、先生！"
10115-845-860-1 = "私も負けないよう、\n気合入れていきます！"
10115-845-870-1 = "今日はここまで！\nお疲れさまでした！"
10115-845-880-1 = "先生！このあとお時間、\nありますか？"
