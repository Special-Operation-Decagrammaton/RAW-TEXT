[translation]
10142-847-810-1 = "先生、私たちの活躍を\n見届けてくれる？"
10142-847-820-1 = "ふふっ、\n今まで封じてた力、\n見せてあげる。"
10142-847-830-1 = "まだ余裕はあるけど、\n気を抜かずにいこう。"
10142-847-840-1 = "ラストスパートだね。"
10142-847-850-1 = "みんな、頑張ろう。"
10142-847-860-1 = "先生、\n最後までありがとう。"
10142-847-870-1 = "次も一緒に楽しもうね。"
10142-847-880-1 = "お祭り、\n大盛り上がりだね。"
10142-847-890-1 = "こっちまで\n熱くなってくる。"
10142-847-900-1 = "日差しが強い……\nちゃんと紫外線対策\nしないと。"
10142-847-910-1 = "日焼けって\n火傷なんだって。"
10142-847-920-1 = "私が……気になるの？"
10142-847-930-1 = "ごめんなさい。\n目立ってしまって。"
10142-847-940-1 = "お祭りで食べる\n焼き鳥って、\n特別な感じがする。"
10142-847-950-1 = "先生もそう思わない？"
