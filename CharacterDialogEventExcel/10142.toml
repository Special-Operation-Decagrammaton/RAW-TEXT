[translation]
10142-810 = "Sensei, will you continue watching us as we strive to do all we can?"
10142-820 = "Fufu, I shall show everyone what my right hand is capable of."
10142-830 = "Our time has yet to run out. We must compose ourselves and push forward."
10142-840 = "Our final effort."
10142-850 = "Give all your strength, everyone."
10142-860 = "Sensei, you have my thanks for all you've done."
10142-870 = "Let us do this again next time."
10142-880 = "Is this wat they call \"festival fever\"?"
10142-890 = "My heart is racing."
10142-900 = "The sun beats down mercilessly... We must take proper measures against the UV rays."
10142-910 = "A tan is simply the skin being burnt."
10142-920 = "Am I...on your mind?"
10142-930 = "I apologize. I stand out too much."
10142-940 = "Chicken skewers from festivals are special."
10142-950 = "Don't you agree, Sensei?"
