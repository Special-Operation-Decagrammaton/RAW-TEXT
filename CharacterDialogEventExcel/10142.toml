[translation]
10142-847-810-1 = "Sensei, will you continue watching us as we strive to do all we can?"
10142-847-820-1 = "Fufu, I shall show everyone what my right hand is capable of."
10142-847-830-1 = "Our time has yet to run out. We must compose ourselves and push forward."
10142-847-840-1 = "Our final effort."
10142-847-850-1 = "Give all your strength, everyone."
10142-847-860-1 = "Sensei, you have my thanks for all you've done."
10142-847-870-1 = "Let us do this again next time."
10142-847-880-1 = "Is this what they call \"festival fever\"?"
10142-847-890-1 = "My heart is racing."
10142-847-900-1 = "The sun beats down mercilessly... We must take proper measures against the UV rays."
10142-847-910-1 = "A tan is simply the skin being burnt."
10142-847-920-1 = "Am I...on your mind?"
10142-847-930-1 = "I apologize. I stand out too much."
10142-847-940-1 = "Chicken skewers from festivals are special."
10142-847-950-1 = "Don't you agree, Sensei?"
