[translation]
10142-847-810-1 = "老師，你會見證\n我們的活躍嗎？"
10142-847-820-1 = "呵呵，\n至今封印著的力量，\n就讓你見識見識。"
10142-847-830-1 = "雖然還有餘裕，\n繼續保持謹慎吧。"
10142-847-840-1 = "要最後衝刺了呢。"
10142-847-850-1 = "大家，一起加油吧。"
10142-847-860-1 = "老師，\n謝謝你陪我到最後。"
10142-847-870-1 = "下次也一起玩吧。"
10142-847-880-1 = "祭典，氣氛\n相當熱烈呢。"
10142-847-890-1 = "連我也跟著\n熱血起來了。"
10142-847-900-1 = "陽光好強……\n得做好防曬才行。"
10142-847-910-1 = "聽說曬傷\n也算是燙傷呢。"
10142-847-920-1 = "你……在意我嗎？"
10142-847-930-1 = "對不起。\n我太引人注目了。"
10142-847-940-1 = "在祭典上吃的烤雞串，\n有種特別的感覺。"
10142-847-950-1 = "老師不這麼覺得嗎？"
