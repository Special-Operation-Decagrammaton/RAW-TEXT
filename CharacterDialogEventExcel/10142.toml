[translation]
10142-810 = "คุณครู คอยเฝ้าดู\nฝีมือของพวกเราได้มั้ย?"
10142-820 = "ฮุฮุ ฉันจะแสดงพลังของแขนขวา\nของฉันให้ทุกคนได้เห็นเอง"
10142-830 = "ยังมีเวลาอยู่\nตั้งสติให้ดีแล้วค่อยไปกันนะ"
10142-840 = "ถึงเวลาฮึดสู้\nครั้งสุดท้ายแล้วละ"
10142-850 = "ทุกคน พยายามเข้านะ"
10142-860 = "คุณครู\nขอบคุณที่พยายามจนถึงที่สุดนะ"
10142-870 = "คราวหน้าก็มาสนุกด้วยกันอีกล่ะ"
10142-880 = "เพราะบรรยากาศของ\nเทศกาลหรือเปล่านะ?"
10142-890 = "รู้สึกได้ว่า\nหัวใจร้อนผ่าวขึ้นมาเลย"
10142-900 = "แดดแรงมาก...\nต้องหาแผนรับมือ\nรังสี UV ให้ดีแล้วละ"
10142-910 = "ผิวที่ไหม้แดด\nถือเป็นแผลไหม้อย่างหนึ่งนะ"
10142-920 = "กำลังใส่ใจ\nเรื่องของฉันอยู่เหรอ?"
10142-930 = "ขอโทษนะ\nพอดีฉันเป็นที่สะดุดตาง่ายน่ะ"
10142-940 = "ยากิโทริที่กินใน\nงานเทศกาล มันพิเศษไปเลยนะ"
10142-950 = "คุณครูก็\nคิดเหมือนกันใช่มั้ย?"
