[translation]
10142-847-810-1 = "คุณครู คอยเฝ้าดู\nฝีมือของพวกเราได้มั้ย?"
10142-847-820-1 = "ฮุฮุ ฉันจะแสดงพลังของแขนขวา\nของฉันให้ทุกคนได้เห็นเอง"
10142-847-830-1 = "ยังมีเวลาอยู่\nตั้งสติให้ดีแล้วค่อยไปกันนะ"
10142-847-840-1 = "ถึงเวลาฮึดสู้\nครั้งสุดท้ายแล้วละ"
10142-847-850-1 = "ทุกคน พยายามเข้านะ"
10142-847-860-1 = "คุณครู\nขอบคุณที่พยายามจนถึงที่สุดนะ"
10142-847-870-1 = "คราวหน้าก็มาสนุกด้วยกันอีกล่ะ"
10142-847-880-1 = "เพราะบรรยากาศของ\nเทศกาลหรือเปล่านะ?"
10142-847-890-1 = "รู้สึกได้ว่า\nหัวใจร้อนผ่าวขึ้นมาเลย"
10142-847-900-1 = "แดดแรงมาก...\nต้องหาแผนรับมือ\nรังสี UV ให้ดีแล้วละ"
10142-847-910-1 = "ผิวที่ไหม้แดด\nถือเป็นแผลไหม้อย่างหนึ่งนะ"
10142-847-920-1 = "กำลังใส่ใจ\nเรื่องของฉันอยู่เหรอ?"
10142-847-930-1 = "ขอโทษนะ\nพอดีฉันเป็นที่สะดุดตาง่ายน่ะ"
10142-847-940-1 = "ยากิโทริที่กินใน\nงานเทศกาล มันพิเศษไปเลยนะ"
10142-847-950-1 = "คุณครูก็\nคิดเหมือนกันใช่มั้ย?"
