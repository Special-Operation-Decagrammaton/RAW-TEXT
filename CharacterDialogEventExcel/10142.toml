[translation]
10142-810 = "老師，你會見證\n我們的活躍嗎？"
10142-820 = "呵呵，\n至今封印著的力量，\n就讓你見識見識。"
10142-830 = "雖然還有餘裕，\n繼續保持謹慎吧。"
10142-840 = "要最後衝刺了呢。"
10142-850 = "大家，一起加油吧。"
10142-860 = "老師，\n謝謝你陪我到最後。"
10142-870 = "下次也一起玩吧。"
10142-880 = "祭典，氣氛\n相當熱烈呢。"
10142-890 = "連我也跟著\n熱血起來了。"
10142-900 = "陽光好強……\n得做好防曬才行。"
10142-910 = "聽說曬傷\n也算是燙傷呢。"
10142-920 = "你……在意我嗎？"
10142-930 = "對不起。\n我太引人注目了。"
10142-940 = "在祭典上吃的烤雞串，\n有種特別的感覺。"
10142-950 = "老師不這麼覺得嗎？"
