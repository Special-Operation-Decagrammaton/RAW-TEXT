[translation]
16019-854-2150-1 = "歡迎光臨\n飛鳥馬季的商店。"
16019-854-2160-1 = "……我說謊了。\n這是大家的商店。"
16019-854-2170-1 = "雖然沒能準備\n太多商品……"
16019-854-2180-1 = "希望能對老師\n有所幫助。"
16019-854-2190-1 = "歡迎光臨\n飛鳥馬季的商店。"
16019-854-2200-1 = "……我說謊了。\n這是大家的商店。"
16019-854-2210-1 = "雖然沒能準備\n太多商品……"
16019-854-2220-1 = "希望能對老師\n有所幫助。"
16019-854-2230-1 = "我是飛鳥馬季。\n透過螢幕向您問好。"
16019-854-2240-1 = "本應親自拜訪，遺憾面臨\n緊急事態只能透過通訊，\n還請見諒。"
16019-854-2250-1 = "即使面臨緊急事態，\n飛鳥馬季的商店\n依然在營業。"
16019-854-2260-1 = "是的，老師。\n我在這裡。"
16019-854-2270-1 = "不會逃也不會躲──"
16019-854-2280-1 = "不……如果我消失的話，\n老師會拚命找我嗎？"
16019-854-2290-1 = "您覺得呢？"
16019-854-2300-1 = "這是具備保溫性與穩定性，\n還有身心放鬆效果的──"
16019-854-2310-1 = "簡直跟我一樣\n優秀的戰鬥服。"
16019-854-2320-1 = "老師，和我一起\n確認服裝的功能吧。"
16019-854-2330-1 = "要盡情貼著我也無妨，\n請不必客氣。"
16019-854-2340-1 = "是的，老師。\n我在這裡。"
16019-854-2350-1 = "不會逃也不會躲──"
16019-854-2360-1 = "不……如果我消失的話，\n老師會拚命找我嗎？"
16019-854-2370-1 = "您覺得呢？"
16019-854-2380-1 = "這是具備保溫性與穩定性，\n還有身心放鬆效果的──"
16019-854-2390-1 = "簡直跟我一樣\n優秀的戰鬥服。"
16019-854-2400-1 = "老師，和我一起\n確認服裝的功能吧。"
16019-854-2410-1 = "要盡情貼著我也無妨，\n請不必客氣。"
16019-854-2420-1 = "請稍等。"
16019-854-2430-1 = "我會憑藉完美女僕的記憶力，\n想起庫存的位置。"
16019-854-2440-1 = "雖然被迫改用線上服務，\n不過營業不受影響。"
16019-854-2450-1 = "因為最佳特務\n不會挑選活躍的場合。"
16019-854-2460-1 = "感謝您的購買。"
16019-854-2470-1 = "順帶一提，只要您說一聲，\n我也可以購買。"
16019-854-2480-1 = "是那個商品對吧，\n我明白了。"
16019-854-2490-1 = "在補貨完成之前，\n要不要和我邊玩邊等呢？"
16019-854-2500-1 = "您喜歡這種東西呢，\n我明白了。"
16019-854-2510-1 = "好的，請收下。\n期待您再次光臨。"
16019-854-2520-1 = "幾次都行，請來見我吧。"
16019-854-2530-1 = "感謝您的購買。"
16019-854-2540-1 = "順帶一提，只要您說一聲，\n我也可以購買。"
16019-854-2550-1 = "是那個商品對吧，\n我明白了。"
16019-854-2560-1 = "在補貨完成之前，\n要不要和我邊玩邊等呢？"
16019-854-2570-1 = "您喜歡這種東西呢，\n我明白了。"
16019-854-2580-1 = "好的，請收下。\n期待您再次光臨。"
16019-854-2590-1 = "幾次都行，請來見我吧。"
16019-854-2600-1 = "好的，我覺得很不錯。"
16019-854-2610-1 = "那個商品，\n請從後面的架子拿取。"
16019-854-2620-1 = "如果買錯的話可以退貨。"
16019-854-2630-1 = "……抱歉。\n是不行的。"
16019-854-2640-1 = "如果想要的話，\n可以將與我的通話券\n作為贈品附上。"
16019-854-2650-1 = "當然，您想要對吧？"
