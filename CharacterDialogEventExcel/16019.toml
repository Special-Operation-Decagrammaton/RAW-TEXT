[translation]
16019-854-2150-1 = "ようこそ、\n飛鳥馬トキのお店へ。"
16019-854-2160-1 = "……嘘をつきました。\nみんなのお店です。"
16019-854-2170-1 = "あまり品数は\n用意できませんでしたが……。"
16019-854-2180-1 = "先生のお役に\n立てればと思います。"
16019-854-2190-1 = "ようこそ、\n飛鳥馬トキのお店へ。"
16019-854-2200-1 = "……嘘をつきました。\nみんなのお店です。"
16019-854-2210-1 = "あまり品数は\n用意できませんでしたが……。"
16019-854-2220-1 = "先生のお役に\n立てればと思います。"
16019-854-2230-1 = "飛鳥馬トキです。\n画面越しにご挨拶いたします。"
16019-854-2240-1 = "直接伺うべきところ、\n緊急事態につき通信にて\n失礼します。"
16019-854-2250-1 = "緊急事態であっても、\n飛鳥馬トキのお店は\n営業しています。"
16019-854-2260-1 = "はい、先生。\n私はここです。"
16019-854-2270-1 = "逃げも隠れもしませ――"
16019-854-2280-1 = "いえ……姿を消したら、\n先生は血眼になって\n探してくれますか？"
16019-854-2290-1 = "いかがでしょうか。"
16019-854-2300-1 = "保温性と安定性、そして\n心身のリラックス効果もある――"
16019-854-2310-1 = "まるで私のような、\n優秀な戦闘服です。"
16019-854-2320-1 = "先生、私と一緒にスーツの\n機能を確認しましょう。"
16019-854-2330-1 = "好きなだけ私にくっついていて\n構いませんので、ご遠慮なく。"
16019-854-2340-1 = "はい、先生。\n私はここです。"
16019-854-2350-1 = "逃げも隠れもしませ――"
16019-854-2360-1 = "いえ……姿を消したら、\n先生は血眼になって\n探してくれますか？"
16019-854-2370-1 = "いかがでしょうか。"
16019-854-2380-1 = "保温性と安定性、そして\n心身のリラックス効果もある――"
16019-854-2390-1 = "まるで私のような、\n優秀な戦闘服です。"
16019-854-2400-1 = "先生、私と一緒にスーツの\n機能を確認しましょう。"
16019-854-2410-1 = "好きなだけ私にくっついていて\n構いませんので、ご遠慮なく。"
16019-854-2420-1 = "少々お待ちを。"
16019-854-2430-1 = "パーフェクトメイドの記憶力で、\n在庫の場所を\n思い出してみせます。"
16019-854-2440-1 = "やむを\n得ずオンライン対応中ですが、\n営業に支障はありません。"
16019-854-2450-1 = "ベストエージェントは、\n活躍の場を選びませんので。"
16019-854-2460-1 = "ご購入、\nありがとうございます。"
16019-854-2470-1 = "ちなみに、一言いただければ\n私も購入できます。"
16019-854-2480-1 = "そちらの商品ですね、\n承知しました。"
16019-854-2490-1 = "再入荷が完了するまで、\n私と遊んで待ちませんか？"
16019-854-2500-1 = "こういうものが\nお好きなのですね、\n分かりました。"
16019-854-2510-1 = "はい、どうぞ。またのご利用を\nお待ちしております。"
16019-854-2520-1 = "何度でも、\n私に会いに来てください。"
16019-854-2530-1 = "ご購入、\nありがとうございます。"
16019-854-2540-1 = "ちなみに、一言いただければ\n私も購入できます。"
16019-854-2550-1 = "そちらの商品ですね、\n承知しました。"
16019-854-2560-1 = "再入荷が完了するまで、\n私と遊んで待ちませんか？"
16019-854-2570-1 = "こういうものが\nお好きなのですね、\n分かりました。"
16019-854-2580-1 = "はい、どうぞ。またのご利用を\nお待ちしております。"
16019-854-2590-1 = "何度でも、\n私に会いに来てください。"
16019-854-2600-1 = "はい、良いと思います。"
16019-854-2610-1 = "その商品は、\n後ろの棚からお取りください。"
16019-854-2620-1 = "買い間違えた場合には\n返品が可能です。"
16019-854-2630-1 = "……すみません。\nできませんでした。"
16019-854-2640-1 = "ご希望であれば、私との通話券を\nオマケで付けておきます。"
16019-854-2650-1 = "もちろん、\nご希望ですよね？"
