[translation]
16019-854-2150-1 = "เชิญเข้าสู่ร้านของ\nอะซุมะ โทคิค่ะ คุณครู"
16019-854-2160-1 = "ฉันโกหกค่ะ...\nเป็นร้านของทุกคนน่ะค่ะ"
16019-854-2170-1 = "ถึงจะเตรียมสินค้ามา\nไม่ได้มาก..."
16019-854-2180-1 = "แต่ยังไงก็หวังว่า\nจะเป็นประโยชน์ต่อคุณครูนะคะ"
16019-854-2190-1 = "เชิญเข้าสู่ร้านของ\nอะซุมะ โทคิค่ะ คุณครู"
16019-854-2200-1 = "ฉันโกหกค่ะ...\nเป็นร้านของทุกคนน่ะค่ะ"
16019-854-2210-1 = "ถึงจะเตรียมสินค้ามา\nไม่ได้มาก..."
16019-854-2220-1 = "แต่ยังไงก็หวังว่า\nจะเป็นประโยชน์ต่อคุณครูนะคะ"
16019-854-2230-1 = "อะซุมะ โทคิ\nขอทักทายผ่านระบบสื่อสารค่ะ"
16019-854-2240-1 = "ถ้าสถานการณ์ไม่เร่งด่วนแบบนี้ละก็\nฉันคงไปหาด้วยตัวเองแล้วค่ะ"
16019-854-2250-1 = "ไม่ว่าสถานการณ์จะฉุกเฉินแค่ไหน\nแต่ร้านของโทคิก็เปิดให้บริการค่ะ"
16019-854-2260-1 = "ค่ะ คุณครู\nฉันอยู่ตรงนี้ค่ะ"
16019-854-2270-1 = "ฉันไม่หนี\nแล้วก็ไม่ซ่อนตัวด้วยค่ะ"
16019-854-2280-1 = "ไม่สิ... ถ้าเกิดฉันหายไป\nคุณครูจะร้อนรุ่มใจ\nแล้วมาตามหาฉันมั้ยคะ?!"
16019-854-2290-1 = "เป็นยังไงบ้างคะ คุณครู"
16019-854-2300-1 = "ทั้งรักษาความอบอุ่น ทั้งปลอดภัย\nและทำให้ร่างกายและจิตใจมั่นคง"
16019-854-2310-1 = "นี่เป็นชุดต่อสู้ที่ยอดเยี่ยม\nไม่ต่างจากตัวฉันเลยนะคะ"
16019-854-2320-1 = "คุณครูมาตรวจสอบ\nฟังก์ชันของชุดนี้กับฉันสิคะ"
16019-854-2330-1 = "อยู่ข้างๆ ฉันได้\nเท่าที่ต้องการเลยค่ะ\nไม่ต้องปฏิเสธนะคะ"
16019-854-2340-1 = "ค่ะ คุณครู\nฉันอยู่ตรงนี้ค่ะ"
16019-854-2350-1 = "ฉันไม่หนี\nแล้วก็ไม่ซ่อนตัวด้วยค่ะ"
16019-854-2360-1 = "ไม่สิ... ถ้าเกิดฉันหายไป\nคุณครูจะร้อนรุ่มใจ\nแล้วมาตามหาฉันมั้ยคะ?!"
16019-854-2370-1 = "เป็นยังไงบ้างคะ คุณครู"
16019-854-2380-1 = "ทั้งรักษาความอบอุ่น ทั้งปลอดภัย\nและทำให้ร่างกายและจิตใจมั่นคง"
16019-854-2390-1 = "นี่เป็นชุดต่อสู้ที่ยอดเยี่ยม\nไม่ต่างจากตัวฉันเลยนะคะ"
16019-854-2400-1 = "คุณครูมาตรวจสอบ\nฟังก์ชันของชุดนี้กับฉันสิคะ"
16019-854-2410-1 = "อยู่ข้างๆ ฉันได้\nเท่าที่ต้องการเลยค่ะ\nไม่ต้องปฏิเสธนะคะ"
16019-854-2420-1 = "ช่วยรอสักครู่นะคะ"
16019-854-2430-1 = "เมดที่เพอร์เฟกต์ขอนึกก่อน\nว่าสินค้าชิ้นนั้นอยู่ตรงไหนค่ะ"
16019-854-2440-1 = "ถึงจะต้องเปิดร้านออนไลน์อย่างช่วยไม่ได้\nแต่ก็ไม่เป็นอุปสรรคต่อการขายค่ะ"
16019-854-2450-1 = "สุดยอดสายลับน่ะ\nไม่เลือกสถานที่หรอกค่ะ"
16019-854-2460-1 = "ขอบคุณที่ซื้อนะคะ"
16019-854-2470-1 = "ถ้าอยากซื้อฉันไปด้วย\nก็แค่บอกกันก็พอค่ะ"
16019-854-2480-1 = "เอาเป็นอันนั้นสินะคะ\nเข้าใจแล้วค่ะ"
16019-854-2490-1 = "มาใช้ช่วงเวลาดีๆ กับฉันจนกว่าจะ\nเติมสต๊อกสินค้าจนเสร็จมั้ยคะ?"
16019-854-2500-1 = "ชอบของแบบนี้สินะคะ\nเข้าใจแล้วค่ะ"
16019-854-2510-1 = "ค่ะ นี่ค่ะ\nโอกาสหน้าเชิญใหม่นะคะ"
16019-854-2520-1 = "แวะมาดูหน้าฉันก็ยังดีค่ะ"
16019-854-2530-1 = "ขอบคุณที่ซื้อนะคะ"
16019-854-2540-1 = "ถ้าอยากซื้อฉันไปด้วย\nก็แค่บอกกันก็พอค่ะ"
16019-854-2550-1 = "เอาเป็นอันนั้นสินะคะ\nเข้าใจแล้วค่ะ"
16019-854-2560-1 = "มาใช้ช่วงเวลาดีๆ กับฉันจนกว่าจะ\nเติมสต๊อกสินค้าจนเสร็จมั้ยคะ?"
16019-854-2570-1 = "ชอบของแบบนี้สินะคะ\nเข้าใจแล้วค่ะ"
16019-854-2580-1 = "ค่ะ นี่ค่ะ\nโอกาสหน้าเชิญใหม่นะคะ"
16019-854-2590-1 = "แวะมาดูหน้าฉันก็ยังดีค่ะ"
16019-854-2600-1 = "นั่นเป็นของที่ดีเลยนะคะ"
16019-854-2610-1 = "สินค้านั้น ช่วยหยิบจาก\nชั้นวางด้านหลังนะคะ"
16019-854-2620-1 = "ถ้าซื้อผิดไป\nก็เอามาคืนได้ค่ะ"
16019-854-2630-1 = "ขอโทษด้วยค่ะ...\nมีคนบอกว่าไม่ได้ค่ะ"
16019-854-2640-1 = "ถ้าอยากได้ละก็ ฉันจะแถม\nบัตรโทรศัพท์สำหรับโทรหาฉันให้ค่ะ"
16019-854-2650-1 = "ต้องอยากได้\nใช่มั้ยล่ะคะ?"
