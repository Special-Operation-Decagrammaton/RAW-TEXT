[translation]
20061-1480 = "嗯！真是美麗的海灘！"
20061-1490 = "在這裡就可以蓋出\n能一覽大海的溫泉了！"
20061-1510 = "哦哦，老師？\n這不是老師嗎！"
20061-1520 = "很遺憾，溫泉\n還沒蓋好哦？"
20061-1530 = "好痛啊……真是的，\n希望一花醬也能稍微\n手下留情一點。"
20061-1550 = "我們的感情明明\n這麼好的說……\n老師也這麼覺得吧？"
20061-1560 = "一顆火種。"
20061-1570 = "就是從一顆\n小小的火種\n開始的。"
20061-1580 = "將會變成什麼樣子……\n你也很好奇吧？"
20061-1590 = "哎呀～\n這下可被擺了一道呢！\n哈～哈哈哈哈！"
20061-1610 = "……在你看來是這樣嗎？"
20061-1630 = "私人海灘啊。\n真是布爾喬亞的極致呢。"
20061-1640 = "要不要也像我們一樣，\n擁有自己的理念呢？"
20061-1650 = "而它們至今仍被埋沒著。"
20061-1660 = "我們才會來到這裡。"
20061-1670 = "呼呣……那就是茶會啊。"
20061-1680 = "我可什麼都沒做哦。"
20061-1690 = "嗯？怎麼啦，老師！\n這樣很癢耶！哈哈！\n快停下來啦！"
