[translation]
20061-1480 = "ชายหาดนี้\nช่างยอดเยี่ยมจริงๆ"
20061-1490 = "คงสร้างออนเซ็น\nที่ยอดเยี่ยมได้แน่!"
20061-1510 = "โอ้~ คุณครู!\nคุณครูนี่นา!"
20061-1520 = "ทำไงดีล่ะ ออนเซ็น\nยังไม่เปิดให้บริการเลยนะ?"
20061-1530 = "โอ๊ยๆๆ~ อิจิกะจัง\nใจร้ายเกินไปหน่อยหรือเปล่า?"
20061-1550 = "เราคนกันเอง\nผ่อนปรนให้กันหน่อยก็ได้นี่นา!"
20061-1560 = "เชื้อไฟอันเดียว"
20061-1570 = "ปกติแล้วเริ่มจาก\nเชื้อไฟเล็กๆ\nเพียงอันเดียวนี่แหละ"
20061-1580 = "จะเกิดอะไรขึ้นนะ?\nไม่อยากรู้เหรอ?"
20061-1590 = "โอ้โห~\nโดนเล่นงานเสียน่วมเลยสินะ\nวะฮะฮะฮ่า!"
20061-1610 = "อืม...\nฉันไม่เห็นรู้เลย"
20061-1630 = "ฮึ่ม!\nชายหาดส่วนตัวงั้นเหรอ\nพวกชนชั้นนายทุนก็เป็นเสียอย่างนี้~"
20061-1640 = "ถ้ารู้จักแบ่งปันให้คนอื่น\nเหมือนชมรมพัฒนาออนเซ็น\nของเรา ก็คงดีนะ?"
20061-1650 = "ยังไม่ได้เผยคุณค่า\nของตัวเองออกมา"
20061-1660 = "พวกเราถึงได้มาที่นี่ไง"
20061-1670 = "นั่นคือสภาน้ำชา\nที่ลือกันสินะ..."
20061-1680 = "ฉันยังไม่ได้\nทำอะไรเลยนะ?"
20061-1690 = "อะฮ่า! อะฮะฮ่า!\nทำอะไรน่ะ คุณครู!\nมันจั๊กจี้นะ!"
