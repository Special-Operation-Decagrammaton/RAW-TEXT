[translation]
20061-848-1480-1 = "青い空、広い海！"
20061-848-1480-2 = "うむ！\n美しいビーチだ！"
20061-848-1490-1 = "ここなら海を一望できる\n温泉が作れるな！"
20061-848-1510-1 = "おお、先生？\n先生じゃあないか！"
20061-848-1520-1 = "残念ながら温泉は\nまだできてないぞ？"
20061-848-1530-1 = "痛いなぁ……まったく、\nイチカちゃんも少しは\n手加減してほしいものだ。"
20061-848-1550-1 = "私たちの仲だって\nいうのに……\n先生もそう思うだろう？"
20061-848-1560-1 = "――火種が一つ。"
20061-848-1570-1 = "連鎖反応とは、"
20061-848-1570-2 = "ほんの小さな火種から\n始まるものさ。"
20061-848-1580-1 = "では――火種を一つ、\n落としたら。"
20061-848-1580-2 = "どうなるのか……\n気になるだろう？"
20061-848-1590-1 = "いやぁ～\nこれは一杯食わされたな！\nハーハッハッハッハ！"
20061-848-1610-1 = "ん？\n機嫌が良さそうに見える？"
20061-848-1610-2 = "……そう、\n見えるんだな？"
20061-848-1630-1 = "プライベートビーチ、か。\nブルジョワの極みだな。"
20061-848-1640-1 = "我々のように\n理念を持つのは\nいかがかな？"
20061-848-1650-1 = "トリニティに数多存在する\n「潜在的な温泉」――"
20061-848-1650-2 = "それが\n未だ埋もれたままでいる。"
20061-848-1660-1 = "だから、"
20061-848-1660-2 = "我々が来たのさ。"
20061-848-1670-1 = "ふむ……あれが\nティーパーティー、か。"
20061-848-1680-1 = "いいのかね？\nこうも簡単に\n接触できて……"
20061-848-1680-2 = "彼女らのSPは\nどうしたんだ？"
20061-848-1680-3 = "そんな目で\n見ないでくれ、先生。"
20061-848-1680-4 = "別に何もしてやいないさ。"
20061-848-1690-1 = "ん？なんだ、先生！\nくすぐったいじゃあ\nないか！っはは！\nやめたまえよ！"
