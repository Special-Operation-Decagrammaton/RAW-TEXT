[translation]
20061-848-1480-1 = "อืม~ บิวตี้ฟูล!"
20061-848-1480-2 = "ชายหาดนี้\nช่างยอดเยี่ยมจริงๆ"
20061-848-1490-1 = "คงสร้างออนเซ็น\nที่ยอดเยี่ยมได้แน่!"
20061-848-1510-1 = "โอ้~ คุณครู!\nคุณครูนี่นา!"
20061-848-1520-1 = "ทำไงดีล่ะ ออนเซ็น\nยังไม่เปิดให้บริการเลยนะ?"
20061-848-1530-1 = "โอ๊ยๆๆ~ อิจิกะจัง\nใจร้ายเกินไปหน่อยหรือเปล่า?"
20061-848-1550-1 = "เราคนกันเอง\nผ่อนปรนให้กันหน่อยก็ได้นี่นา!"
20061-848-1560-1 = "เชื้อไฟอันเดียว"
20061-848-1570-1 = "คุณครู สิ่งที่เรียกว่า\nปฏิกิริยาลูกโซ่น่ะ"
20061-848-1570-2 = "ปกติแล้วเริ่มจาก\nเชื้อไฟเล็กๆ\nเพียงอันเดียวนี่แหละ"
20061-848-1580-1 = "ถ้าโยนเชื้อไฟลงไป\nแค่อันเดียว"
20061-848-1580-2 = "จะเกิดอะไรขึ้นนะ?\nไม่อยากรู้เหรอ?"
20061-848-1590-1 = "โอ้โห~\nโดนเล่นงานเสียน่วมเลยสินะ\nวะฮะฮะฮ่า!"
20061-848-1610-1 = "หืม?\nฉันดูอารมณ์ดีงั้นเหรอ?"
20061-848-1610-2 = "อืม...\nฉันไม่เห็นรู้เลย"
20061-848-1630-1 = "ฮึ่ม!\nชายหาดส่วนตัวงั้นเหรอ\nพวกชนชั้นนายทุนก็เป็นเสียอย่างนี้~"
20061-848-1640-1 = "ถ้ารู้จักแบ่งปันให้คนอื่น\nเหมือนชมรมพัฒนาออนเซ็น\nของเรา ก็คงดีนะ?"
20061-848-1650-1 = "น่าเสียดายที่\n'ออนเซ็นศักยภาพสูง'\nจำนวนมากในทรีนิตี้"
20061-848-1650-2 = "ยังไม่ได้เผยคุณค่า\nของตัวเองออกมา"
20061-848-1660-1 = "เพราะงั้น"
20061-848-1660-2 = "พวกเรา\nถึงได้มาที่นี่ไง"
20061-848-1670-1 = "นั่นคือสภาน้ำชา\nที่ลือกันสินะ..."
20061-848-1680-1 = "อุตส่าห์เป็นชั้นสูงสุด\nที่มีเพียงคนน้อยนิด\nเท่านั้นที่เข้าถึงได้แท้ๆ..."
20061-848-1680-2 = "แต่ระบบรักษาความปลอดภัย\nออกจะหละหลวมไปหน่อยนะ?"
20061-848-1680-3 = "หืม?\nเป็นอะไรไปเหรอ คุณครู?"
20061-848-1680-4 = "ฉันยังไม่ได้\nทำอะไรเลยนะ?"
20061-848-1690-1 = "อะฮ่า! อะฮะฮ่า!\nทำอะไรน่ะ คุณครู!\nมันจั๊กจี้นะ!"
