[translation]
20061-1480 = "이 얼마나\n멋진 해변인가."
20061-1490 = "멋진 온천이\n만들어지겠어!"
20061-1510 = "오~ 선생님!\n선생님 아니야!"
20061-1520 = "어쩌지, 온천은\n아직 개장 전인데?"
20061-1530 = "아야야~ 이치카 쨩,\n너무한 거 아니야?"
20061-1550 = "우리 사이인데 적당히\n좀 봐줄 수도 있지!"
20061-1560 = "불씨 하나."
20061-1570 = "보통 아주 작은\n불씨 하나에서\n시작한단 말이지."
20061-1580 = "어떻게 될까?\n궁금하지 않아?"
20061-1590 = "이야~\n호된 꼴을 당했네,\n와핫핫하!"
20061-1610 = "……글쎄,\n난 모르겠는데."
20061-1630 = "흥!\n프라이빗 비치라니,\n이래서 부르주아 놈들은~"
20061-1640 = "우리 온천개발부처럼\n남에게 베풀 줄\n알았으면 좋겠는데,\n말이야 ?"
20061-1650 = "그 가치를\n드러내지 못하고 있어."
20061-1660 = "우리가\n여기 온 거야."
20061-1670 = "저게 소문의\n티파티인가……."
20061-1680 = "아무것도\n안 하고 있는데?"
20061-1690 = "아핫! 아하하!\n뭐하는 거야, 선생님!\n간지럽다고!"
