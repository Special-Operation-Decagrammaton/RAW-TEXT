[translation]
20061-848-1480-1 = "蔚藍的天空，\n廣闊的大海！"
20061-848-1480-2 = "嗯！真是美麗的海灘！"
20061-848-1490-1 = "在這裡就可以蓋出\n能一覽大海的溫泉了！"
20061-848-1510-1 = "哦哦，老師？\n這不是老師嗎！"
20061-848-1520-1 = "很遺憾，溫泉\n還沒蓋好哦？"
20061-848-1530-1 = "好痛啊……真是的，\n希望一花醬也能稍微\n手下留情一點。"
20061-848-1550-1 = "我們的感情明明\n這麼好的說……\n老師也這麼覺得吧？"
20061-848-1560-1 = "一顆火種。"
20061-848-1570-1 = "所謂的連鎖反應，"
20061-848-1570-2 = "就是從一顆\n小小的火種\n開始的。"
20061-848-1580-1 = "那麼──如果\n丟下一顆火種，"
20061-848-1580-2 = "將會變成什麼樣子……\n你也很好奇吧？"
20061-848-1590-1 = "哎呀～\n這下可被擺了一道呢！\n哈～哈哈哈哈！"
20061-848-1610-1 = "嗯？看起來心情很好？"
20061-848-1610-2 = "……在你看來是這樣嗎？"
20061-848-1630-1 = "私人海灘啊。\n真是布爾喬亞的極致呢。"
20061-848-1640-1 = "要不要也像我們一樣，\n擁有自己的理念呢？"
20061-848-1650-1 = "在三一當中存在眾多的\n「潛在溫泉」──"
20061-848-1650-2 = "而它們至今仍被埋沒著。"
20061-848-1660-1 = "所以──"
20061-848-1660-2 = "我們才會來到這裡。"
20061-848-1670-1 = "呼呣……那就是茶會啊。"
20061-848-1680-1 = "這樣好嗎？居然能\n這麼輕易接觸到……"
20061-848-1680-2 = "他們的SP\n都跑哪去了？"
20061-848-1680-3 = "別用那種眼神\n看我啊，老師。"
20061-848-1680-4 = "我可什麼都沒做哦。"
20061-848-1690-1 = "嗯？怎麼啦，老師！\n這樣很癢耶！哈哈！\n快停下來啦！"
