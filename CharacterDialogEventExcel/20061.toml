[translation]
20061-848-1480-1 = "으음~ 뷰티풀!"
20061-848-1480-2 = "이 얼마나\n멋진 해변인가."
20061-848-1490-1 = "멋진 온천이\n만들어지겠어!"
20061-848-1510-1 = "오~ 선생님!\n선생님 아니야!"
20061-848-1520-1 = "어쩌지, 온천은\n아직 개장 전인데?"
20061-848-1530-1 = "아야야~ 이치카 쨩,\n너무한 거 아니야?"
20061-848-1550-1 = "우리 사이인데 적당히\n좀 봐줄 수도 있지!"
20061-848-1560-1 = "불씨 하나."
20061-848-1570-1 = "선생님. 연쇄 반응이란\n것은 말야,"
20061-848-1570-2 = "보통 아주 작은\n불씨 하나에서\n시작한단 말이지."
20061-848-1580-1 = "불씨 하나,\n딱 하나만 떨어트리면,"
20061-848-1580-2 = "어떻게 될까?\n궁금하지 않아?"
20061-848-1590-1 = "이야~\n호된 꼴을 당했네,\n와핫핫하!"
20061-848-1610-1 = "응?\n기분 좋아 보인다고?"
20061-848-1610-2 = "……글쎄,\n난 모르겠는데."
20061-848-1630-1 = "흥!\n프라이빗 비치라니,\n이래서 부르주아 놈들은~"
20061-848-1640-1 = "우리 온천개발부처럼\n남에게 베풀 줄\n알았으면 좋겠는데,\n말이야 ?"
20061-848-1650-1 = "유감스럽게도,\n트리니티의 많은\n'잠재적 온천'이"
20061-848-1650-2 = "그 가치를\n드러내지 못하고 있어."
20061-848-1660-1 = "그래서"
20061-848-1660-2 = "우리가\n여기 온 거야."
20061-848-1670-1 = "저게 소문의\n티파티인가……."
20061-848-1680-1 = "오직 극소수 인물만이\n접할 수 있는\n최고위층치고는……"
20061-848-1680-2 = "보안이 좀 어설프네?"
20061-848-1680-3 = "응?\n왜 그래, 선생님?"
20061-848-1680-4 = "아무것도\n안 하고 있는데?"
20061-848-1690-1 = "아핫! 아하하!\n뭐하는 거야, 선생님!\n간지럽다고!"
