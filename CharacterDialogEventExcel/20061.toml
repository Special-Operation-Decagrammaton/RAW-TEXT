[translation]
20061-848-1480-1 = "Mm, beautiful!"
20061-848-1480-2 = "What a wonderful beach."
20061-848-1490-1 = "It's going to make a fantastic hot spring!"
20061-848-1510-1 = "Oh! Sensei! Isn't that you, Sensei?!"
20061-848-1520-1 = "What should we do? The hot spring hasn't opened yet."
20061-848-1530-1 = "Oww... Ichika, isn't that a bit harsh?"
20061-848-1550-1 = "We're so close—cut me some slack!"
20061-848-1560-1 = "A single spark."
20061-848-1570-1 = "Sensei. A chain reaction..."
20061-848-1570-2 = "It usually starts with just a tiny spark, you know."
20061-848-1580-1 = "Just one. If I drop a single spark..."
20061-848-1580-2 = "What would happen? Aren't you curious?"
20061-848-1590-1 = "Ow! They got me good! Wahahaha!"
20061-848-1610-1 = "Hm? I look like I'm in a good mood?"
20061-848-1610-2 = "...Hm, I wonder."
20061-848-1630-1 = "Hmph! A private beach. This is why those bourgeoisie are..."
20061-848-1640-1 = "It'd be nice if they knew how to be generous, just like the Hot Springs Department, you know?"
20061-848-1650-1 = "Unfortunately, many \"potential hot springs\" in Trinity..."
20061-848-1650-2 = "have failed to reveal their true value."
20061-848-1660-1 = "Which is why..."
20061-848-1660-2 = "We came here."
20061-848-1670-1 = "So that's the rumored Tea Party..."
20061-848-1680-1 = "For such lofty people who can only be seen by a select few..."
20061-848-1680-2 = "Isn't their security a bit sloppy?"
20061-848-1680-3 = "Hm? What's wrong, Sensei?"
20061-848-1680-4 = "I'm not doing anything, you know?"
20061-848-1690-1 = "Aha! Ahaha! What are you doing, Sensei?! That tickles!"
