[translation]
10138-856-120-1 = "先生、こっち。"
10138-856-130-1 = "一緒にインチキを\n解き明かすわよ。"
10138-856-140-1 = "先輩がくれたお守り……\nどこやったっけ……。"
10138-856-150-1 = "い、一応もらいものだから\n探してるだけ！"
10138-856-160-1 = "さ、最後まで\n諦めないんだから！"
10138-856-170-1 = "全部ウソだって\n証明してやるわ！"
10138-856-180-1 = "シャーッ！インチキ！\nデタラメ！\nかかってきなさい！"
10138-856-190-1 = "今夜で\nケリをつけてあげる！"
10138-856-200-1 = "変なこと\nばっかだったけど……。"
10138-856-210-1 = "まあ、楽しかったから\nいいや。"
10138-856-220-1 = "ふんっ、どうせ\n全部インチキなんだから！"
10138-856-230-1 = "……た、たぶんね。"
10138-856-240-1 = "な、なんだか\n寒気がする……。"
10138-856-250-1 = "か、風のせい\nだよね……？ね？"
10138-856-260-1 = "はぁ、なーにが\nツチノコよ。"
10138-856-270-1 = "トカゲの見間違いでしょ？"
10138-856-280-1 = "ひ、ひいぃっ！？"
10138-856-290-1 = "……なんだ、先生か。\nって、急につつかないで！"
10138-856-300-1 = "あ、怪しい物が山のように……。"
10138-856-310-1 = "使える物があるかも。\n一応見てみる？"
10138-856-320-1 = "先生、これ何だか知ってる？"
10138-856-330-1 = "なんか色々あるんだけど……。"
10138-856-340-1 = "まぁ、振り返ってみたら……\n良い思い出かもね。ふふ。"
10138-856-350-1 = "こ、ここは安全……だよね？"
10138-856-360-1 = "いきなりオバケとか……\n出てこないよね……？"
10138-856-370-1 = "み、見てないで手伝ってよ！"
10138-856-380-1 = "1人でこれ整理するの、\nこわ――大変なんだけど！？"
10138-856-390-1 = "あ、何かに使えそう。"
10138-856-400-1 = "えっ、ガラクタの\n中にあったの？それ。"
10138-856-410-1 = "本当に役に立つと\nいいんだけど……。"
10138-856-420-1 = "はい、どうぞ。\n一応取ってきたの\n私なんだから感謝してね？"
10138-856-520-1 = "うーん……集まった\n手がかりを確認する？"
10138-856-530-1 = "一緒に出来事を整理するよ。"
10138-856-540-1 = "ふんっ、やっぱ大したこと\nなかったじゃん。"
10138-856-550-1 = "この調子でじゃんじゃん\n暴いていくわよ！"
10138-856-560-1 = "お、オバケより、\n吊り橋の方が怖いんだけど……。"
10138-856-570-1 = "シャーッ！\n遊んでないで調査に集中！"
