[translation]
10138-120 = "老師，這邊。"
10138-130 = "一起來揭穿騙局吧。"
10138-140 = "前輩給的護身符……\n放到哪裡去了……"
10138-150 = "只，只是因為收到了\n所以才找的！"
10138-160 = "我，我到最後\n都不會放棄的！！"
10138-170 = "我會證明\n全部都是假的！"
10138-180 = "嚇啊──！騙子！\n假貨！放馬過來！"
10138-190 = "我要在今晚作個了結！"
10138-200 = "雖然發生了很多\n奇怪的事……"
10138-210 = "算了，反正挺開心的\n就算了吧。"
10138-220 = "哼，反正全部都是假的！"
10138-230 = "……大，大概吧。"
10138-240 = "總，總覺得\n有股寒意……"
10138-250 = "是，是風的關係吧……？\n對吧？"
10138-260 = "唉，什麼槌之子啊。"
10138-270 = "肯定是把蜥蜴看錯了吧？"
10138-280 = "噫，噫噫──！？"
10138-290 = "……什麼嘛，是老師啊。\n不要突然戳我啦！"
10138-300 = "可，可疑的東西堆積如山……"
10138-310 = "也許有能用的東西。\n要看看嗎？"
10138-320 = "老師，你知道這是什麼嗎？"
10138-330 = "有各種各樣的東西呢……"
10138-340 = "嗯，回想起來……\n也算是美好的回憶呢。呵呵。"
10138-350 = "這，這裡應該安全……吧？"
10138-360 = "應該不會突然出現……\n鬼之類的東西吧？"
10138-370 = "別，別光看著\n快來幫忙啊！"
10138-380 = "一個人整理這裡，\n很恐──很辛苦耶！"
10138-390 = "啊，感覺可以派上用場。"
10138-400 = "咦，那東西在破爛堆裡嗎？"
10138-410 = "要是真的能\n派上用場就好了……"
10138-420 = "來，拿去。\n畢竟是我拿來的，\n要感謝我哦？"
10138-520 = "嗯……要確認一下\n收集到的線索嗎？"
10138-530 = "來一起整理一下事件吧。"
10138-540 = "哼，果然沒什麼嘛。"
10138-550 = "就這樣繼續揭開真相吧！"
10138-560 = "跟，跟鬼比起來，\n吊橋反而更可怕……"
10138-570 = "嚇啊──！！\n別鬧了快專心調查！"
