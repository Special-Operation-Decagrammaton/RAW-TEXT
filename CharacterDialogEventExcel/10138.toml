[translation]
10138-856-120-1 = "คุณครู ทางนี้"
10138-856-130-1 = "มาเปิดโปง\nข่าวลือเหลวไหล\nของที่นี่ด้วยกันเถอะ"
10138-856-140-1 = "พวกรุ่นพี่ให้เครื่องรางมา\nแต่ฉันเอาไปไว้ไหนนะ..."
10138-856-150-1 = "นะ... ไหนๆ ได้มาแล้ว\nก็เลยลองหาดูก็เท่านั้นน่ะ!"
10138-856-160-1 = "ฉะ... ฉันจะไม่ยอมแพ้\nจนถึงที่สุดเลย!"
10138-856-170-1 = "ฉันจะพิสูจน์ให้ได้เลยว่า\nทั้งหมดเป็นเรื่องโกหก!"
10138-856-180-1 = "ว้ากกก! มิจฉาชีพ!\nพวกเหลวไหล! เข้ามาเลย!"
10138-856-190-1 = "จะปราบให้หมดสิ้น\nภายในคืนนี้เลย!"
10138-856-200-1 = "ถึงจะมีเรื่องแปลกๆ\nเกิดขึ้นมากมาย..."
10138-856-210-1 = "แต่ช่างเถอะ ยังไงเราก็ได้สนุกกันนี่นา"
10138-856-220-1 = "ฮึ่ม ยังไงก็เป็นเรื่องหลอกลวงทั้งนั้น!"
10138-856-230-1 = "อะ... อาจจะนะ..."
10138-856-240-1 = "จะ... จู่ๆ ก็\nขนลุกขึ้นมา..."
10138-856-250-1 = "คะ... คงเป็นเพราะลม\nแหละเนอะ...? เนอะ?"
10138-856-260-1 = "เฮ้อ สึจิโนโกะอะไรกัน"
10138-856-270-1 = "คงเห็นตะกวดแล้วเข้าใจผิดน่ะสิ!"
10138-856-280-1 = "ฮะ... เฮือกก?!"
10138-856-290-1 = "อะไรกัน... คุณครูเองเหรอ\nเดี๋ยวสิ จู่ๆ ก็อย่ามาจิ้มกันแบบนี้!"
10138-856-300-1 = "มะ... มีของแปลกๆ เพียบเลย..."
10138-856-310-1 = "อาจมีของที่เป็นประโยชน์ก็ได้นะ\nลองมาดูก่อนมั้ย?"
10138-856-320-1 = "คุณครู รู้หรือเปล่าว่านี่คืออะไร?"
10138-856-330-1 = "มีของหลายอย่างเลยนะ"
10138-856-340-1 = "ถ้ามองย้อนกลับไป...\nอาจเป็นความทรงจำดีๆ ก็ได้นะ ฮุฮุ"
10138-856-350-1 = "ทะ... ที่นี่มันปลอดภัยใช่มั้ย?"
10138-856-360-1 = "คงไม่มีผีโผล่ออกมาหรอกเนอะ?"
10138-856-370-1 = "ยะ... อย่าเอาแต่ยืนดูสิ\nมาช่วยกันหน่อย!"
10138-856-380-1 = "ให้ฉันจัดของพวกนี้คนเดียว\nฉันกลัว... ไม่สิ ฉันเหนื่อยนะ!"
10138-856-390-1 = "หืม? อันนั้นน่าจะใช้ได้เลยนะ?"
10138-856-400-1 = "อ๊ะ อยู่กับพวกของจุกจิกงั้นเหรอ?\nอันนั้นน่ะ"
10138-856-410-1 = "อยากให้ใช้ประโยชน์\nได้จริงๆ จังเลยนะ..."
10138-856-420-1 = "เอ้า รับไปสิ ฉันเป็นคนเอามาให้นะ\nต้องขอบคุณฉันด้วยล่ะ?"
10138-856-520-1 = "อืม... ลองรวบรวมเบาะแส\nที่เก็บได้จนถึงตอนนี้ดีมั้ย?"
10138-856-530-1 = "มาสรุปเหตุการณ์ด้วยกันเถอะ"
10138-856-540-1 = "ฮึ่ม เป็นแค่ข่าวลือไร้สาระตามคาด"
10138-856-550-1 = "ฉันจะตรวจสอบข่าวลือต่อไป\nด้วยเอเนอร์จี้นี้ละ!"
10138-856-560-1 = "บะ... บอกตามตรงเลยนะว่า\nสะพานแกว่งๆ นั่นน่ากลัวกว่าผีอีก..."
10138-856-570-1 = "ว้ากกก! อย่ามัวเล่นอยู่สิ\nโฟกัสกับการสืบสวนหน่อย!"
