[translation]
10138-856-120-1 = "Sensei, this way."
10138-856-130-1 = "Let's expose these baseless rumors together."
10138-856-140-1 = "My seniors gave me an amulet. Where did I put it...?"
10138-856-150-1 = "The ONLY reason I'm looking for it is because it was a GIFT!"
10138-856-160-1 = "I-I will never, ever give up!"
10138-856-170-1 = "I'll prove that it's all a lie!"
10138-856-180-1 = "Shyaaah! Con artist! Fake! Bring it on!"
10138-856-190-1 = "I'll bust them all by tonight!"
10138-856-200-1 = "Lots of incredibly suspicious things happened..."
10138-856-210-1 = "Eh, I had fun, so I think it's fine!"
10138-856-220-1 = "Hmph! It's all a big sham anyway!"
10138-856-230-1 = "...P-Probably."
10138-856-240-1 = "E-Everything feels so spooky all of a sudden..."
10138-856-250-1 = "M-Must've been the wind... Right?"
10138-856-260-1 = "*sigh* What do you mean, \"a Tsuchinoko\"?"
10138-856-270-1 = "It was probably just a lizard!"
10138-856-280-1 = "E-EEEEK?!"
10138-856-290-1 = "...Oh, it's just Sensei—wait, but don't poke me out of nowhere like that!"
10138-856-300-1 = "Th-There's a whole pile of suspicious things..."
10138-856-310-1 = "There might be something useful in there. Want to check it out first?"
10138-856-320-1 = "Sensei, do you know what this is?"
10138-856-330-1 = "There's so much stuff here..."
10138-856-340-1 = "Well, looking back... Maybe I made some good memories. Heehee."
10138-856-350-1 = "Th-This place is safe, right?"
10138-856-360-1 = "A-A ghost isn't going to jump out at us, right?"
10138-856-370-1 = "D-Don't just stare at me! HELP ME!"
10138-856-380-1 = "Sorting all this out by myself is scary—I mean, TIRING!"
10138-856-390-1 = "Huh? Isn't that kinda useful?"
10138-856-400-1 = "Wait, it was in that pile of junk? That one?"
10138-856-410-1 = "I hope you find some use for it..."
10138-856-420-1 = "Here, take it. I'm the one who brought it, so you should be thankful, okay?"
10138-856-520-1 = "Hmm, should we try to put together the clues we've found so far?"
10138-856-530-1 = "Let's organize this case together."
10138-856-540-1 = "Hmph, I knew it'd be a baseless rumor."
10138-856-550-1 = "Let's keep up the pace and move on to the next rumor!"
10138-856-560-1 = "H-Honestly, I'm more scared of that shaky bridge than ghosts..."
10138-856-570-1 = "Shyaaah! Stop fooling around! Focus on the investigation!"
