[translation]
10138-120 = "คุณครู ทางนี้"
10138-130 = "มาเปิดโปง\nข่าวลือเหลวไหล\nของที่นี่ด้วยกันเถอะ"
10138-140 = "พวกรุ่นพี่ให้เครื่องรางมา\nแต่ฉันเอาไปไว้ไหนนะ..."
10138-150 = "นะ... ไหนๆ ได้มาแล้ว\nก็เลยลองหาดูก็เท่านั้นน่ะ!"
10138-160 = "ฉะ... ฉันจะไม่ยอมแพ้\nจนถึงที่สุดเลย!"
10138-170 = "ฉันจะพิสูจน์ให้ได้เลยว่า\nทั้งหมดเป็นเรื่องโกหก!"
10138-180 = "ว้ากกก! มิจฉาชีพ!\nพวกเหลวไหล! เข้ามาเลย!"
10138-190 = "จะปราบให้หมดสิ้น\nภายในคืนนี้เลย!"
10138-200 = "ถึงจะมีเรื่องแปลกๆ\nเกิดขึ้นมากมาย..."
10138-210 = "แต่ช่างเถอะ ยังไงเราก็ได้สนุกกันนี่นา"
10138-220 = "ฮึ่ม ยังไงก็เป็นเรื่องหลอกลวงทั้งนั้น!"
10138-230 = "อะ... อาจจะนะ..."
10138-240 = "จะ... จู่ๆ ก็\nขนลุกขึ้นมา..."
10138-250 = "คะ... คงเป็นเพราะลม\nแหละเนอะ...? เนอะ?"
10138-260 = "เฮ้อ สึจิโนโกะอะไรกัน"
10138-270 = "คงเห็นตะกวดแล้วเข้าใจผิดน่ะสิ!"
10138-280 = "ฮะ... เฮือกก?!"
10138-290 = "อะไรกัน... คุณครูเองเหรอ\nเดี๋ยวสิ จู่ๆ ก็อย่ามาจิ้มกันแบบนี้!"
10138-300 = "มะ... มีของแปลกๆ เพียบเลย..."
10138-310 = "อาจมีของที่เป็นประโยชน์ก็ได้นะ\nลองมาดูก่อนมั้ย?"
10138-320 = "คุณครู รู้หรือเปล่าว่านี่อะไร?"
10138-330 = "มีของหลายอย่างเลยนะ"
10138-340 = "ถ้ามองย้อนกลับไป...\nอาจเป็นความทรงจำดีๆ ก็ได้นะ ฮุฮุ"
10138-350 = "ทะ... ที่นี่มันปลอดภัยใช่มั้ย?"
10138-360 = "คงไม่มีผีโผล่ออกมาหรอกเนอะ?"
10138-370 = "ยะ... อย่าเอาแต่ยืนดูสิ\nมาช่วยกันหน่อย!"
10138-380 = "ให้ฉันจัดของพวกนี้คนเดียว\nฉันกลัว... ไม่สิ ฉันเหนื่อยนะ!"
10138-390 = "หืม? อันนั้นน่าจะใช้ได้เลยนะ?"
10138-400 = "อ๊ะ อยู่กับพวกของจุกจิกงั้นเหรอ?\nอันนั้นน่ะ"
10138-410 = "อยากให้ใช้ประโยชน์\nได้จริงๆ จังเลยนะ..."
10138-420 = "เอ้า รับไปสิ ฉันเป็นคนเอามาให้นะ\nต้องขอบคุณฉันด้วยล่ะ?"
10138-520 = "อืม... ลองรวบรวมเบาะแส\nที่เก็บได้จนถึงตอนนี้ดีมั้ย?"
10138-530 = "มาสรุปเหตุการณ์ด้วยกันเถอะ"
10138-540 = "ฮึ่ม เป็นแค่ข่าวลือไร้สาระตามคาด"
10138-550 = "ฉันจะตรวจสอบข่าวลือต่อไป\nด้วยเอเนอร์จี้นี้ละ!"
10138-560 = "บะ... บอกตามตรงเลยนะว่า\nสะพานแกว่งๆ นั่นน่ากลัวกว่าผีอีก..."
10138-570 = "ว้ากกก! อย่ามัวเล่นอยู่สิ\nโฟกัสกับการสืบสวนหน่อย!"
