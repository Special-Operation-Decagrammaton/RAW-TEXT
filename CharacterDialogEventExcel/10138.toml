[translation]
10138-856-120-1 = "老師，這邊。"
10138-856-130-1 = "一起來揭穿騙局吧。"
10138-856-140-1 = "前輩給的護身符……\n放到哪裡去了……"
10138-856-150-1 = "只，只是因為收到了\n所以才找的！"
10138-856-160-1 = "我，我到最後\n都不會放棄的！！"
10138-856-170-1 = "我會證明\n全部都是假的！"
10138-856-180-1 = "嚇啊──！騙子！\n假貨！放馬過來！"
10138-856-190-1 = "我要在今晚作個了結！"
10138-856-200-1 = "雖然發生了很多\n奇怪的事……"
10138-856-210-1 = "算了，反正挺開心的\n就算了吧。"
10138-856-220-1 = "哼，反正全部都是假的！"
10138-856-230-1 = "……大，大概吧。"
10138-856-240-1 = "總，總覺得\n有股寒意……"
10138-856-250-1 = "是，是風的關係吧……？\n對吧？"
10138-856-260-1 = "唉，什麼槌之子啊。"
10138-856-270-1 = "肯定是把蜥蜴看錯了吧？"
10138-856-280-1 = "噫，噫噫──！？"
10138-856-290-1 = "……什麼嘛，是老師啊。\n不要突然戳我啦！"
10138-856-300-1 = "可，可疑的東西堆積如山……"
10138-856-310-1 = "也許有能用的東西。\n要看看嗎？"
10138-856-320-1 = "老師，你知道這是什麼嗎？"
10138-856-330-1 = "有各種各樣的東西呢……"
10138-856-340-1 = "嗯，回想起來……\n也算是美好的回憶呢。呵呵。"
10138-856-350-1 = "這，這裡應該安全……吧？"
10138-856-360-1 = "應該不會突然出現……\n鬼之類的東西吧？"
10138-856-370-1 = "別，別光看著\n快來幫忙啊！"
10138-856-380-1 = "一個人整理這裡，\n很恐──很辛苦耶！"
10138-856-390-1 = "啊，感覺可以派上用場。"
10138-856-400-1 = "咦，那東西在破爛堆裡嗎？"
10138-856-410-1 = "要是真的能\n派上用場就好了……"
10138-856-420-1 = "來，拿去。\n畢竟是我拿來的，\n要感謝我哦？"
10138-856-520-1 = "嗯……要確認一下\n收集到的線索嗎？"
10138-856-530-1 = "來一起整理一下事件吧。"
10138-856-540-1 = "哼，果然沒什麼嘛。"
10138-856-550-1 = "就這樣繼續揭開真相吧！"
10138-856-560-1 = "跟，跟鬼比起來，\n吊橋反而更可怕……"
10138-856-570-1 = "嚇啊──！！\n別鬧了快專心調查！"
