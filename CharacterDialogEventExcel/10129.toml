[translation]
10129-851-10-1 = "ถะ... ถ้าจ้องกันมากไป\nฉันจะประหม่านะคะ..."
10129-851-20-1 = "นี่ก็เพื่อการแฝงตัว\nเท่านั้นค่ะ"
10129-851-30-1 = "ถึงจะคิดว่าเป็น\nชุดที่สวยเลยก็เถอะ..."
10129-851-40-1 = "เหมือนผู้ชมจะ\nหลั่งไหลเข้ามา\nเยอะขึ้นเลยนะคะ..."
10129-851-50-1 = "ทุกคนดูชื่นชอบ\nกันจังเลยค่ะ"
10129-851-60-1 = "ไม่ว่าจะเป็นการช่วยรูปแบบไหน\nแต่ก็โล่งอกที่ได้ช่วยนะคะ"
10129-851-70-1 = "ทำให้ฉันมั่นใจ\nในตัวเองมากขึ้นเลยค่ะ"
10129-851-80-1 = "ขอบคุณนะคะ คุณครู"
10129-851-90-1 = "ภารกิจแฝงตัวเสร็จแล้ว\nแต่การลาดตระเวน\nยังดำเนินต่อไปค่ะ"
10129-851-100-1 = "ต่อไปก็หวังว่า\nจะได้เจอกันอีกบ่อยๆ นะคะ"
10129-851-110-1 = "อย่าดึงกันสิคะ!\nฉันไม่ใช่พร็อพนะคะ!"
10129-851-120-1 = "ตามมาตราที่ 6\nของกฎหมายเวทมนตร์ อืม...\nแล้วก็..."
10129-851-130-1 = "ฉันไม่ชินกับบทพูด\nก็เลยจำไม่ค่อยได้ค่ะ"
10129-851-140-1 = "ว้ายย! คะ... คิกคิก!!\nอ๊ะ... อ๊าย...!\nจั๊กจี้ค่ะ...!"
10129-851-150-1 = "ฉันเป็นคน\nบ้าจี้นะคะ...!"
10129-851-160-1 = "บรรยากาศนี้ของสวนสนุก\nฉันชอบจังเลยค่ะ"
10129-851-170-1 = "ก็เพราะมัน...\nสงบสุขมากเลยนี่คะ"
10129-851-380-1 = "ชะ... เชิญค่ะ\nคุณครู..."
10129-851-390-1 = "มีอะไรที่\nต้องการหรือเปล่าคะ..."
10129-851-400-1 = "เป็นการลาดตระเวนที่น่าจดจำเลยค่ะ\nขอบคุณนะคะ"
10129-851-410-1 = "หวังว่าจะเจอของ\nที่ต้องการนะคะ"
10129-851-420-1 = "นึกถึงเรื่องที่\nร้านสะดวกซื้อเลยนะคะ"
10129-851-430-1 = "ค่ะ ทางนี้เลยค่ะ"
10129-851-440-1 = "ค่ะ นี่ค่ะ"
10129-851-450-1 = "ขอบคุณที่ให้ความร่วมมือ\nกันตลอดเลยนะคะ"
10129-851-460-1 = "ขอให้เป็นประโยชน์\nกับคุณครูนะคะ"
10129-851-560-1 = "เป็นเครื่องที่เก่าเลยนะคะ\nแต่ฉันไม่รู้นะคะว่า\nยังใช้งานได้หรือเปล่า...?"
10129-851-570-1 = "ถ้าใส่เหรียญก็จะใช้งานได้สินะคะ"
10129-851-580-1 = "ค่อยยังชั่วหน่อยนะคะ\nที่คุณเรอิสะกำลังสนุกเลย"
10129-851-590-1 = "อยากให้ได้การ์ดระดับ\nหายากๆ จังเลยค่ะ"
10129-851-600-1 = "ถึงเวลาปิดแล้วสินะคะ\nลองเช็กดูนะคะว่า\nมีเหรียญเหลือหรือเปล่า"
10129-851-610-1 = "ฉันรู้สึกถึงสายตาที่มองมา\nจากรอบๆ ตั้งแต่เมื่อกี้แล้ว..."
10129-851-620-1 = "รีบเลือกเข้าเถอะค่ะ\nก่อนจะถูกจ้องไปมากกว่านี้"
10129-851-630-1 = "สีรุ้งสินะคะ\nมันดี... หรือเปล่าคะ?"
10129-851-640-1 = "สีชมพู... สินะคะ"
10129-851-650-1 = "สีทองค่ะ"
10129-851-660-1 = "สีเหมือนท้องฟ้าเลยนี่คะ\nสดชื่นจังเลยค่ะ"
10129-851-670-1 = "สีดำ...\nลางไม่ดีเท่าไรเลยค่ะ"
