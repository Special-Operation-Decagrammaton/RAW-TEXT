[translation]
10129-851-10-1 = "そ、そんなに\n見つめられると、\n緊張します……。"
10129-851-20-1 = "あくまで捜査の\nために着ているだけです。"
10129-851-30-1 = "可愛い衣装だとは\n思いますが……。"
10129-851-40-1 = "どんどん観客が\n増えているような……。"
10129-851-50-1 = "皆さん喜んでいますね。"
10129-851-60-1 = "形は何であれ、お役に\n立てているようで\n良かったです。"
10129-851-70-1 = "自分のやっていることに、\nちゃんと自信を\n持てるようになりました。"
10129-851-80-1 = "ありがとうございます、\n先生。"
10129-851-90-1 = "潜入捜査は終わり\nましたが、これからも\nパトロールは続きます。"
10129-851-100-1 = "今後ともよろしく\nお願いいたします。"
10129-851-110-1 = "ひ、引っ張っては\nいけません！\n飾りではありません！"
10129-851-120-1 = "6条右回りの魔法は、\nうーん……えっと……。"
10129-851-130-1 = "慣れないセリフが多く……\n覚えづらいです。"
10129-851-140-1 = "きゃっ！ひ、\nひゃはっ！ひゃぁっ……！\nくすぐったいです……！"
10129-851-150-1 = "私、本当に\nくすぐられるのに\n弱くて……！"
10129-851-160-1 = "遊園地の空気が、\nとても好きなんです。"
10129-851-170-1 = "とても……平和なので。"
10129-851-380-1 = "い、いらっしゃいませ。\n先生……。"
10129-851-390-1 = "お探しのものは\nありますか……？"
10129-851-400-1 = "思い出に残る任務でしたね。\nありがとうございました。"
10129-851-410-1 = "探しているものが\n見つかると良いのですが。"
10129-851-420-1 = "コンビニでのことを\n思い出しますね。"
10129-851-430-1 = "はい、こちらですね。"
10129-851-440-1 = "はい、どうぞ。"
10129-851-450-1 = "いつも協力してくださり\nありがとうございます。"
10129-851-460-1 = "先生のお役に\n立ちますよう。"
10129-851-560-1 = "古いマシンですね。\nちゃんと\n動くのでしょうか……？"
10129-851-570-1 = "これを投入すれば\n動くようです。"
10129-851-580-1 = "レイサさん、\n楽しんでいるみたいで\nよかったです。"
10129-851-590-1 = "レア度が高い？\nカードが出ると\nいいですね。"
10129-851-600-1 = "もう閉園時間ですね。\n残った分がないか\n確かめてみましょう。"
10129-851-610-1 = "なんだか周囲からの視線を\n感じるのですが……。"
10129-851-620-1 = "人目を集めてしまう前に、\n早く引きましょう……！"
10129-851-630-1 = "虹色ですね。これは\n良いものなのでしょうか？"
10129-851-640-1 = "ピンク色……ですね。"
10129-851-650-1 = "金色ですね。"
10129-851-660-1 = "水色ですか。\n爽やかですね。"
10129-851-670-1 = "黒……少し不吉ですね。"
