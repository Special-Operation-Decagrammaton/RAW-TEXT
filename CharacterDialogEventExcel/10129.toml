[translation]
10129-851-10-1 = "I-I get nervous when you stare at me so closely..."
10129-851-20-1 = "This is all for the infiltration."
10129-851-30-1 = "Although, I do think this is a pretty outfit..."
10129-851-40-1 = "It feels like the crowd is getting bigger and bigger..."
10129-851-50-1 = "Everyone is happy with it."
10129-851-60-1 = "Regardless of how, I'm glad I could be of help."
10129-851-70-1 = "I was able to become more confident."
10129-851-80-1 = "Thank you, Sensei."
10129-851-90-1 = "The infiltration is over, but the patrol continues."
10129-851-100-1 = "I wish I could see you more often."
10129-851-110-1 = "Please don't pull! That's not a decoration!"
10129-851-120-1 = "With six-groove, right-hand twist rifling magic, um...and..."
10129-851-130-1 = "I'm not familiar with the lines, so it's hard to memorize them."
10129-851-140-1 = "Kyaaah! E-Eek!! A-Aah...! That tickles...!"
10129-851-150-1 = "I'm weak to tickling...!"
10129-851-160-1 = "I like the atmosphere at the amusement park."
10129-851-170-1 = "It's really...peaceful."
10129-851-380-1 = "W-Welcome. Sensei..."
10129-851-390-1 = "Is there anything you need...?"
10129-851-400-1 = "That was a memorable patrol. Thank you."
10129-851-410-1 = "I hope you can find what you need."
10129-851-420-1 = "This reminds me of what happened at the convenience store."
10129-851-430-1 = "Yes, this way."
10129-851-440-1 = "Here it is."
10129-851-450-1 = "Thank you for always cooperating with us."
10129-851-460-1 = "I'm glad it could be of help to Sensei."
10129-851-560-1 = "It's an old machine. I'm not sure if it still works, though..."
10129-851-570-1 = "I suppose it runs when you put in a medal."
10129-851-580-1 = "I'm glad Reisa is enjoying herself."
10129-851-590-1 = "I hope you get that one card... I think it's called \"rare\"?"
10129-851-600-1 = "It's almost closing time. Please check if you have any medals left."
10129-851-610-1 = "I've been feeling someone's gaze for a while..."
10129-851-620-1 = "Let's do this quickly, before we attract more attention."
10129-851-630-1 = "It's rainbow. Is this...a good thing?"
10129-851-640-1 = "It's...pink."
10129-851-650-1 = "It's gold."
10129-851-660-1 = "It's sky blue. How refreshing."
10129-851-670-1 = "Black... This feels a bit ominous."
