[translation]
16007-802-100-1 = "Welcome to the Red Winter Academy Secretariat, Sensei."
16007-802-110-1 = "Did you find Cherino's special Matryoshka on the academy grounds?"
16007-802-120-1 = "Trade as much as you want here!"
16007-802-130-1 = "Are you enjoying the festival?"
16007-802-140-1 = "Tell me right away if you find the president's Matryoshka!"
16007-802-150-1 = "Aw, there's not much time left until the festival ends."
16007-802-160-1 = "What a shame..."
16007-802-170-1 = "Today is the last day of Ivan Kupala's festival."
16007-802-180-1 = "Take a close look around Red Winter Academy to make sure you don't forget anything!"
16007-802-190-1 = "The festival is over, but the remaining Matryoshka..."
16007-802-200-1 = "You can trade as many as you want here!"
16007-802-210-1 = "I designed that Matryoshka doll shaped like the president."
16007-802-220-1 = "Heehee. Cute, right?"
16007-802-230-1 = "I have this feeling when I see the little Matryoshka dolls inside the bigger ones..."
16007-802-240-1 = "It's a bit sad..."
16007-802-250-1 = "You've won a prize! Congratulations!"
16007-802-260-1 = "Oh, you've won! You are lucky as well, Sensei!"
16007-802-270-1 = "Heehee. You drew something really good. Please take good care of it!"
16007-802-280-1 = "It's an adorable gift. Just like Great Leader Cherino!"
