[translation]
16007-802-100-1 = "レッドウィンター事務局へ\nようこそ、先生。"
16007-802-110-1 = "学園の敷地内にある会長を\n模したマトリョーシカは、\nもう見つけられましたか？"
16007-802-120-1 = "それがあれば、ここで\n商品と交換することが\nできますよ！"
16007-802-130-1 = "お祭り、楽しんで\nいらっしゃいますか？"
16007-802-140-1 = "会長のマトリョーシカを\n見つけましたら、いつでも\nこちらに来てください！"
16007-802-150-1 = "お祭りも、\nもう佳境ですね……。"
16007-802-160-1 = "寂しいですが、\n仕方ありません。"
16007-802-170-1 = "今日が、\nイワン・クパーラ\n最終日です。"
16007-802-180-1 = "思い残しが無いように\n思う存分楽しんで\nくださいね！"
16007-802-190-1 = "お祭りは終わりましたが、\nまだマトリョーシカを\nお持ちでしたら、"
16007-802-200-1 = "ここで交換できますよ。"
16007-802-210-1 = "その会長の形をした\nマトリョーシカは、私が\nデザインしたんですよ。"
16007-802-220-1 = "ふふ……\n可愛いと思いませんか？"
16007-802-230-1 = "こんなにも可愛い\nマトリョーシカを手放さ\nないといけないなんて……"
16007-802-240-1 = "何だか胸が\n苦しいですよね、\nそう思いません？"
16007-802-250-1 = "当たりです！\nおめでとうございます！"
16007-802-260-1 = "あら、当たりですよ！\n先生は運が良いですね。"
16007-802-270-1 = "ふふ、良い物が当たりましたね。\nぜひ大切に使ってください！"
16007-802-280-1 = "チェリノ会長らしい、\n可愛いプレゼントですね！"
