[translation]
16007-802-100-1 = "ยินดีต้อนรับสู่ สำนักเลขาธิการ\nสหภาพเรดวินเทอร์ค่ะ\nคุณครู"
16007-802-110-1 = "ไม่ทราบว่าคุณครูพบตุ๊กตา\nแม่ลูกดกแบบพิเศษ ของประธาน\nเชริโน่ในเขตโรงเรียนของเรามั้ยคะ?"
16007-802-120-1 = "นำมาแลกที่นี่ได้นะคะ!"
16007-802-130-1 = "คุณครู\nสนุกกับงานเทศกาลหรือเปล่าคะ?"
16007-802-140-1 = "ถ้าคุณครูพบตุ๊กตาแม่ลูกดก\nของท่านประธานละก็...\nรบกวนนำมาให้ฉันด้วยนะคะ!"
16007-802-150-1 = "งานเทศกาลครั้งนี้...\nอีกไม่นานก็จะจบลงแล้วนะคะ"
16007-802-160-1 = "น่าเสียดายจัง..."
16007-802-170-1 = "วันนี้เป็นวันสุดท้าย\nของงานเทศกาลอีวาน คูปาลาค่ะ"
16007-802-180-1 = "ตรวจสอบให้ละเอียด\nจะได้แน่ใจว่าไม่ลืมอะไรไว้นะคะ!"
16007-802-190-1 = "ถึงงานเทศกาลจะจบไปแล้ว\nแต่สามารถนำตุ๊กตาแม่ลูกดกที่เหลืออยู่"
16007-802-200-1 = "มาแลกที่นี่\nได้ตลอดเลยนะคะ"
16007-802-210-1 = "ตุ๊กตาแม่ลูกดก\nที่หน้าตาเหมือนท่านประธาน\nฉันเป็นคนออกแบบเองค่ะ"
16007-802-220-1 = "ฮุฮุ...\nน่ารักใช่มั้ยคะ?"
16007-802-230-1 = "ตุ๊กตาแม่ลูกดกน่ารักๆ พวกนั้น...\nพอได้มองตุ๊กตาตัวน้อยๆ\nแบบนั้นแล้ว..."
16007-802-240-1 = "ก็รู้สึกปวดใจเหมือนกันนะคะ"
16007-802-250-1 = "ถูกรางวัลแล้วค่ะ\nยินดีด้วยค่ะ!"
16007-802-260-1 = "อุ๊ย ถูกรางวัลด้วยค่ะ!\nคุณครูนี่โชคดีจริงๆ เลยนะคะ"
16007-802-270-1 = "ฮิฮิ ตาถึงมากเลยค่ะ\nกรุณาใช้มันอย่างดีด้วยนะคะ!"
16007-802-280-1 = "ของขวัญที่น่ารักๆ\nเหมือนท่านประธานเลยค่ะ!"
16007-10802-100-1 = "ยินดีต้อนรับสู่ สำนักเลขาธิการ\nสหภาพเรดวินเทอร์ค่ะ\nคุณครู"
