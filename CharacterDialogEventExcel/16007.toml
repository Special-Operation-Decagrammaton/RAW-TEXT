[translation]
16007-802-100-1 = "歡迎來到\n赤冬事務局，老師。"
16007-802-110-1 = "您在學園裡找到\n模仿會長的\nMatryoshka了嗎？"
16007-802-120-1 = "如果有的話，\n可以在這裡\n交換商品唷！"
16007-802-130-1 = "慶典玩得開心嗎？"
16007-802-140-1 = "如果找到了\n會長的俄羅斯娃娃，\n請隨時來這裡！"
16007-802-150-1 = "慶典已漸入佳境呢……"
16007-802-160-1 = "雖然很寂寞，\n但也沒辦法。"
16007-802-170-1 = "今天是\n伊凡．庫帕拉\n的最後一天。"
16007-802-180-1 = "為了不留遺憾，\n請盡情享受吧！"
16007-802-190-1 = "雖然慶典結束了，\n但如果你還有\n俄羅斯娃娃的話，"
16007-802-200-1 = "可以在這裡交換。"
16007-802-210-1 = "那個會長形狀的\n俄羅斯娃娃，\n是我設計的唷。"
16007-802-220-1 = "嘿嘿……\n不覺得很可愛嗎？"
16007-802-230-1 = "竟然要和\n這麼可愛的\n俄羅斯娃娃分開……"
16007-802-240-1 = "真是讓人心碎，\n不這麼覺得嗎？。"
16007-802-250-1 = "中獎了！\n恭喜！"
16007-802-260-1 = "哎呀，中獎了！\n老師運氣很好呢。"
16007-802-270-1 = "呵呵，抽中了好東西呢。\n請謹慎使用！"
16007-802-280-1 = "是像潔莉諾會長一樣\n可愛的禮物呢！"
16007-10802-100-1 = "赤冬學園事務局\n歡迎您的到來。\n老師。"
16007-10802-110-1 = "您在學園用地尋找潔莉諾\n會長的特製俄羅斯娃娃\n嗎？"
16007-10802-120-1 = "在這個地方\n可以進行交換！"
16007-10802-130-1 = "慶典\n玩得愉快嗎？"
16007-10802-140-1 = "會長的俄羅斯娃娃\n找到時，隨時可以\n來找我！"
16007-10802-150-1 = "慶典現在\n快要結束了呢…"
16007-10802-160-1 = "真可惜…。"
16007-10802-170-1 = "今天是伊凡·庫帕拉\n慶典的\n最後一天。"
16007-10802-180-1 = "為了防止有忘記帶走的物品，\n把赤冬學園\n仔細繞一下吧！"
16007-10802-190-1 = "雖然慶典結束了，\n剩下的俄羅斯娃娃"
16007-10802-200-1 = "可以在這裡\n進行交換。"
16007-10802-210-1 = "那個有會長外型的\n俄羅斯娃娃\n是我設計的。"
16007-10802-220-1 = "嘿嘿…\n可愛吧？"
16007-10802-230-1 = "看著可愛的\n俄羅斯娃娃\n裂開的模樣…"
16007-10802-240-1 = "總覺得很心痛。"
16007-10802-250-1 = "中獎！\n恭喜你！"
16007-10802-260-1 = "哇！中獎了！\n老師運氣不錯呢。"
16007-10802-270-1 = "嘿嘿，抽到了不錯的物品呢。\n請珍惜使用！"
16007-10802-280-1 = "是像潔莉諾會長一樣\n可愛的禮物呢！"
