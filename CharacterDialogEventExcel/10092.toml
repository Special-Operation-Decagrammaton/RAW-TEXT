[translation]
10092-836-300-1 = "You're late, Sensei! C'mon, hurry!"
10092-836-310-1 = "Ah, Sensei! Here, over here!"
10092-836-320-1 = "The performance already started! Follow me!"
10092-836-330-1 = "Is it the climax? I've got it!"
10092-836-340-1 = "Phew. That was pretty refreshing. Don't you think so, Sensei?"
10092-836-350-1 = "Ah, wh-what are you doing?! Use your words, your words!"
10092-836-360-1 = "Stop messing with me! I'm gonna get pissed!"
10092-836-370-1 = "Huh? You called?"
10092-836-380-1 = "Do you wanna hold the guitar? Here."
