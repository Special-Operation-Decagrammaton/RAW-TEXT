[translation]
10092-836-300-1 = "遅いよ、先生！\n早く行くよ！"
10092-836-310-1 = "あ、先生！\nこっちよ、こっち！"
10092-836-320-1 = "演奏が始まってるわよ！\nついてきて！"
10092-836-330-1 = "クライマックスかしら？\n任せて！"
10092-836-340-1 = "ふう、気持ちよかった。\nね、先生？"
10092-836-350-1 = "あ、な、何するのよ！？\n言葉にしてよ、言葉に！"
10092-836-360-1 = "いたずらはやめて……！\n怒るよ！！"
10092-836-370-1 = "ん？……呼んだ？"
10092-836-380-1 = "ギター触ってみたいの？\nはい。"
10092-836-520-1 = "はい、はい！時間ないよ！\nとっとと持ってって！"
10092-836-530-1 = "あ、先生！\nこっちよ、こっち！"
10092-836-540-1 = "余らせとくのも\n勿体ないでしょ？"
10092-836-550-1 = "なるべく取れるもの\n取っていきなさいよ。"
10092-836-560-1 = "な、何よ！？\nビックリしたじゃない！"
10092-836-570-1 = "いたずらはやめてってば！\nビックリするじゃない！！"
10092-836-580-1 = "ふ～ん？\nいいんじゃない？"
10092-836-590-1 = "悪くない選択ね。"
10092-836-600-1 = "いいね。\n私もそれ狙ってたんだ。"
10092-836-610-1 = "それでいくの？オッケー。"
