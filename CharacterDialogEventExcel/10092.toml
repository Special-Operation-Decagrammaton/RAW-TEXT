10092-836-560-1 = "Wh-What's wrong?! You scared me!"
10092-836-570-1 = "Stop messing around! You keep surprising me!"
10092-836-580-1 = "Hm? Not bad, right?"
10092-836-590-1 = "Not a bad choice."
10092-836-600-1 = "Pretty good. I was aiming for that too."
