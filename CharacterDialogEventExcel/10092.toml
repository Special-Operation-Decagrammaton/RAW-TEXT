[translation]
10092-836-300-1 = "你好慢唷，老師！\n快走吧！"
10092-836-310-1 = "啊，老師！\n這邊啦，這邊！"
10092-836-320-1 = "演奏已經開始囉！\n跟我來！"
10092-836-330-1 = "你說高潮嗎？\n交給我！"
10092-836-340-1 = "呼，真爽快。\n是吧，老師？"
10092-836-350-1 = "啊，怎，怎麼了啦！？\n用講的啦，用講的！"
10092-836-360-1 = "再捉弄我的話……！\n我要生氣囉！！"
10092-836-370-1 = "嗯？\n……叫我嗎？"
10092-836-380-1 = "想試試吉他嗎？\n來。"
10092-836-520-1 = "好了，好了！沒時間了！\n快拿去吧！"
10092-836-530-1 = "啊，老師！\n這邊啦，這邊！"
10092-836-540-1 = "留著也可惜對吧？"
10092-836-550-1 = "儘量把能拿走的拿走吧。"
10092-836-560-1 = "做，做什麼啦！？\n害我嚇了一跳！"
10092-836-570-1 = "就說別再捉弄我了！\n會害我嚇到！！"
10092-836-580-1 = "哼～嗯？\n還不錯嘛？"
10092-836-590-1 = "不錯的選擇呢。"
10092-836-600-1 = "不錯嘛。\n我也看上了那個。"
10092-836-610-1 = "就決定是它了嗎？\nOK。"
