[translation]
10092-836-300-1 = "มาช้านะคุณครู!\nรีบไปกันเถอะ!"
10092-836-310-1 = "อ๊ะ คุณครู!\nทางนี้ ทางนี้!"
10092-836-320-1 = "การแสดงดนตรีเริ่มแล้ว!\nตามมาเลย!"
10092-836-330-1 = "ไคลแมกซ์งั้นเหรอ? วางใจได้เลย!"
10092-836-340-1 = "เฮ้อ โล่งจัง\nว่ามั้ยคุณครู?"
10092-836-350-1 = "อ๊ะ ทะ... ทำอะไรน่ะ!?\nก็บอกกันสิ บอกมา!"
10092-836-360-1 = "เลิกแกล้งกันได้แล้ว...!\nเดี๋ยวฉันโกรธนะ!! "
10092-836-370-1 = "หืม? เรียกฉันเหรอ...?"
10092-836-380-1 = "อยากลองจับกีตาร์เหรอ? รับไปสิ"
10092-836-520-1 = "เอาละๆ! ฉันไม่มีเวลานะ!\nรีบเอาไปสิ!"
10092-836-530-1 = "อ๊ะ! คุณครู!\nทางนี้ ทางนี้!"
10092-836-540-1 = "ถ้าเหลือทิ้งไว้ก็เสียดายแย่"
10092-836-550-1 = "เอาไปให้เยอะๆ เลยนะ"
10092-836-560-1 = "อะ... อะไรเนี่ย!?\nตกใจหมดเลย!"
10092-836-570-1 = "บอกให้เลิกแกล้งกันไง!\nฉันตกใจนะ!! "
10092-836-580-1 = "ฮึ่ม~? มันก็ดีไม่ใช่เหรอ?"
10092-836-590-1 = "เลือกได้ไม่เลวเลยนี่"
10092-836-600-1 = "ไม่เลวเลยนะ ฉันเองก็\nเล็งอันนั้นอยู่เหมือนกัน"
10092-836-610-1 = "จะเอาอันนั้นไปเหรอ?\nโอเค"
