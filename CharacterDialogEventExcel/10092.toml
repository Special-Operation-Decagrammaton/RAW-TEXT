[translation]
10092-836-300-1 = "늦었잖아, 선생님!\n빨리 가자!"
10092-836-310-1 = "아, 선생님!\n여기야, 여기!"
10092-836-320-1 = "연주가 시작됐어! 따라와!"
10092-836-330-1 = "클라이막스인가? 맡겨둬!"
10092-836-340-1 = "하아, 개운했다.\n그치, 선생님?"
10092-836-350-1 = "아, 뭐, 뭐 하는 거야!?\n말로 하라고, 말로!"
10092-836-360-1 = "장난 그만 쳐……!\n화낼 거야!!"
10092-836-370-1 = "응? …….불렀어?"
10092-836-380-1 = "기타 만져보고 싶어? 자."
10092-836-520-1 = "자, 자! 시간 없어!\n얼른 가져가!"
10092-836-530-1 = "아! 선생님!\n여기야, 여기!"
10092-836-540-1 = "남기고 가는 거 아깝지?"
10092-836-550-1 = "최대한 챙겨가."
10092-836-560-1 = "뭐, 뭐야!?\n깜짝 놀랐잖아!"
10092-836-570-1 = "장난은 그만하라고!\n놀랐잖아!!"
10092-836-580-1 = "흐응~? 괜찮지 않아?"
10092-836-590-1 = "나쁘지 않은 선택이네."
10092-836-600-1 = "괜찮네. 나도 그거\n노리고 있었거든."
10092-836-610-1 = "그걸로 가는 거야?\n오케이-."
