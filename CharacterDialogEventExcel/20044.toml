[translation]
20044-845-10-1 = "雖然我不太清楚\n棒球的規則……"
20044-845-20-1 = "但這股熱情……\n連我都感到心胸澎湃了。"
20044-845-30-1 = "……真是驚人的熱情呢。"
20044-845-40-1 = "得小心脫水症狀才行。"
20044-845-50-1 = "與運動家精神\n相去甚遠的──\n某種不好的事情\n似乎正在發生。"
20044-845-60-1 = "我們走吧，指導員。"
20044-845-70-1 = "對勝利的執著\n如果超過限度……"
20044-845-80-1 = "就會引發預期之外\n的問題呢。"
20044-845-90-1 = "又學到了新的一課。"
20044-845-100-1 = "那麼指導員，\n既然事態已經\n有所收斂……"
20044-845-110-1 = "現在就開始訓練吧。"
20044-845-120-1 = "這套制服……\n也兼備機能性，\n真不錯呢。"
20044-845-130-1 = "指導員？\n你找我嗎？"
20044-845-140-1 = "……想確認我\n腿部的肌肉是嗎？"
20044-845-150-1 = "呵呵，如果是這樣的話，\n請不必客氣。"
20044-845-160-1 = "這台飲料機？"
20044-845-170-1 = "大約25kg左右吧。"
20044-845-180-1 = "對低負荷的訓練\n來說剛剛好。"
20044-845-400-1 = "歡迎，請慢慢看吧。"
20044-845-410-1 = "如果能找到喜歡的\n東西就好了呢。"
20044-845-420-1 = "盤點完成得\n比預期中還早。"
20044-845-430-1 = "因為跟訓練部的\n備品管理有點類似。"
20044-845-440-1 = "有沒有漏買什麼，\n請再確認一次吧。"
20044-845-450-1 = "掌握數量，\n並迅速提供……"
20044-845-460-1 = "感覺能鍛鍊爆發力呢。"
20044-845-470-1 = "即便在工作中，\n我也會留意正確的姿勢。"
20044-845-480-1 = "畢竟我可是\n訓練部的部長啊。"
20044-845-490-1 = "來，請收下吧。"
20044-845-500-1 = "還有其他需要的東西嗎？"
20044-845-510-1 = "我明白了。\n請稍等。"
20044-845-520-1 = "我正在免費發送飲料，\n要不要來一杯呢？"
