[translation]
20044-845-10-1 = "野球のルールに\n詳しくは\nありませんが……"
20044-845-20-1 = "この盛り上がり……\n私まで胸が\n高鳴ってきました。"
20044-845-30-1 = "……凄まじい\n熱気ですね。"
20044-845-40-1 = "脱水症状に\n気をつけないと。"
20044-845-50-1 = "スポーツマンシップとは\n程遠い――\n何か良からぬことが\n起きているようです。"
20044-845-60-1 = "行きましょう、\nトレーナー。"
20044-845-70-1 = "勝利への執着が\n度を過ぎると、"
20044-845-80-1 = "予期せぬ問題を\n引き起こして\nしまうのですね。"
20044-845-90-1 = "新たな学びです。"
20044-845-100-1 = "それでは\nトレーナー、事態も\n収束したことですし、"
20044-845-110-1 = "今からトレーニングに\nいくとしましょう。"
20044-845-120-1 = "この制服……機能性を\n兼ね備えていて、\nいいですね。"
20044-845-130-1 = "トレーナー？\nお呼びでしょうか？"
20044-845-140-1 = "……私の足の筋肉を\n確かめたいんですか？"
20044-845-150-1 = "ふふ、\nそういうことでしたら、\n好きなだけどうぞ。"
20044-845-160-1 = "このドリンクサーバー？"
20044-845-170-1 = "25kgくらい\nでしょうか。"
20044-845-180-1 = "低負荷のトレーニングに\nちょうど良いです。"
20044-845-400-1 = "どうぞ、\nゆっくりご覧ください。"
20044-845-410-1 = "お気に入りの品が\n見つかると良いですね。"
20044-845-420-1 = "棚だし、想定より早く\n終えることができました。"
20044-845-430-1 = "トレーニング部の備品管理に\n少し似ていたので。"
20044-845-440-1 = "買い逃しがないか、\nもう一度確認してみてください。"
20044-845-450-1 = "品数を把握し、\n素早く提供する……"
20044-845-460-1 = "瞬発力が\n鍛えられそうです。"
20044-845-470-1 = "仕事中も、正しい姿勢を\n意識しています。"
20044-845-480-1 = "私はトレーニング部の\n部長ですから。"
20044-845-490-1 = "はい、お受け取りください。"
20044-845-500-1 = "他に必要なものは\nありませんか？"
20044-845-510-1 = "かしこまりました、\n少々お待ちください。"
20044-845-520-1 = "ドリンクをサービスさせて\nいただいてますが、どうでしょう？"
