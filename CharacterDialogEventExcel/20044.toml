[translation]
20044-845-10-1 = "ฉันไม่ค่อยรู้กติกา\nการแข่งเบสบอลเท่าไร..."
20044-845-20-1 = "แต่ความคึกคักที่ส่งต่อออกมา\nก็ทำให้ฉันใจเต้นไปด้วยนะคะ"
20044-845-30-1 = "บรรยากาศน่าตื่นเต้น\nจังเลยค่ะเทรนเนอร์"
20044-845-40-1 = "ระวังอาการ\nขาดน้ำด้วยนะคะ"
20044-845-50-1 = "ตอนนี้เหมือนจะ\nเกิดเรื่องที่ห่างไกลกับ\nจิตวิญญาณแห่งการ\nแข่งขันกีฬาเลยค่ะ"
20044-845-60-1 = "ต้องทำอะไรสักอย่าง\nแล้วค่ะเทรนเนอร์!"
20044-845-70-1 = "ความปรารถนาในชัยชนะ\nก็เป็นสิ่งสำคัญอยู่หรอก"
20044-845-80-1 = "แต่ถ้ามันมากเกินไป\nก็อาจก่อให้เกิด\nปัญหาอื่นได้ค่ะ"
20044-845-90-1 = "ฉันได้เรียนรู้\nอีกเรื่องเลยนะคะ"
20044-845-100-1 = "ทุกอย่างเหมือนจะ\nจบลงด้วยดีแล้วค่ะ"
20044-845-110-1 = "งั้นเรามาเทรนด้วยกัน\nเพื่อเป็นการฉลอง\nดีมั้ยคะ?"
20044-845-120-1 = "ตอนแรกฉันแค่ใส่ชุดนี้\nเพื่อไม่ให้เตะตาใครน่ะค่ะ...\nแต่ในแง่ของประสิทธิภาพ\nก็ไม่เลวเลยนะคะ"
20044-845-130-1 = "เรียกฉันเหรอคะ เทรนเนอร์?\nต้องการอะไรที่เย็นสดชื่นเหรอคะ?"
20044-845-140-1 = "เทรนเนอร์? เป็นอะไรไปคะ?\nอยากดูกล้ามเนื้อที่ขา\nของฉันเหรอคะ?"
20044-845-150-1 = "เชิญมาจับดู\nให้เต็มที่เลยค่ะ ฮุฮุ"
20044-845-160-1 = "น้ำหนักของเครื่องนี้น่ะเหรอคะ?"
20044-845-170-1 = "รู้สึกว่าน่าจะ\n25 กิโลนะคะ"
20044-845-180-1 = "เป็นน้ำหนักที่เหมาะกับ\nการออกกำลังกายแบบ\nใช้แรงน้อยแต่ทำซ้ำหลายครั้งค่ะ"
20044-845-400-1 = "มาแล้วเหรอคะ เทรนเนอร์"
20044-845-410-1 = "มาดูก่อนได้เลยค่ะ\nว่ามีของที่ถูกใจหรือเปล่า"
20044-845-420-1 = "พอได้ดูแลอุปกรณ์เทรนนิ่งบ่อยๆ"
20044-845-430-1 = "ฉันก็เลยปรับตัวให้เข้ากับ\nงานแบบนี้ได้เร็วเลยค่ะ"
20044-845-440-1 = "รบกวนตรวจสอบด้วยนะคะ\nว่าไม่ได้ลืมอะไรไป"
20044-845-450-1 = "นี่คงเหมือนกับอุปกรณ์เทรนนิ่งค่ะ\nทั้งคุณภาพ ปริมาณ การแสดงผลที่รวดเร็ว..."
20044-845-460-1 = "ทุกปัจจัยล้วนสำคัญหมดเลยนะคะ"
20044-845-470-1 = "ถึงจะอยู่ระหว่างทำงาน\nแต่ก็ต้องคอยระวัง\nท่าทางให้ถูกต้องค่ะ"
20044-845-480-1 = "เพราะฉันเป็นหัวหน้า\nชมรมออกกำลังกาย\nของมิลเลเนียมค่ะ"
20044-845-490-1 = "ค่ะ นี่ค่ะ"
20044-845-500-1 = "ต้องการอะไรอีกมั้ยคะ?\nเทรนเนอร์?"
20044-845-510-1 = "ได้เลยค่ะ รอเดี๋ยวนะคะ"
20044-845-520-1 = "ฉันแถมเครื่องดื่มให้แก้วหนึ่งดีมั้ยคะ?"
