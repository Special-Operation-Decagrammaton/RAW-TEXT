[translation]
20044-845-10-1 = "While I don't know all the rules to baseball..."
20044-845-20-1 = "...the energy in the air makes my heart beat faster."
20044-845-30-1 = "What an incredible scene, Trainer."
20044-845-40-1 = "Make sure you stay hydrated."
20044-845-50-1 = "Something very unsportsmanlike seems to be going on."
20044-845-60-1 = "We have to do something, Trainer!"
20044-845-70-1 = "Striving for victory is important."
20044-845-80-1 = "However, taken too far, that can cause its own problems."
20044-845-90-1 = "I learned something new."
20044-845-100-1 = "It seems like everything ended well."
20044-845-110-1 = "Shall we celebrate with a workout?"
20044-845-120-1 = "I wore this to blend in...but it isn't bad from a functional perspective either."
20044-845-130-1 = "Trainer? Did you call me?"
20044-845-140-1 = "What's wrong, Trainer? Do you want to check my calves?"
20044-845-150-1 = "If so, feel them as much as you'd like. Fufu."
20044-845-160-1 = "How much does this beverage equipment weigh?"
20044-845-170-1 = "About 25 kilograms?"
20044-845-180-1 = "It's perfect for extended low-weight, high-rep training."
20044-845-400-1 = "You're here, Trainer."
20044-845-410-1 = "Are there any items to your liking?"
20044-845-420-1 = "I manage our training supplies..."
20044-845-430-1 = "...so adapting to this role was quick and easy."
20044-845-440-1 = "Please double-check to make sure you didn't forget anything."
20044-845-450-1 = "Figuring out the quantity and providing it quickly..."
20044-845-460-1 = "I believe that can assist with agility training."
20044-845-470-1 = "Even when I'm working, I'm consciously maintaining good posture."
20044-845-480-1 = "I'm the president of the Athletics Training Club, after all."
20044-845-490-1 = "Yes. I'm here."
20044-845-500-1 = "Is there anything else you need, Trainer?"
20044-845-510-1 = "Understood. Give me a moment."
20044-845-520-1 = "Would you like a complimentary drink?"
