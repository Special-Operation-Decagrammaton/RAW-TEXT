[translation]
20042-832-700-1 = "暇だなぁ……"
20042-832-710-1 = "携帯ゲーム\n機でも持ってくれば\n良かった……。"
20042-832-720-1 = "電磁波を\n感じてみたいかも……。"
20042-832-730-1 = "自然のキャンバスに何か\n描いてみようかな。"
20042-832-740-1 = "（あ、壁画……\n消すの忘れてた）"
20042-832-750-1 = "（ま、別に何も\n起こらないよね？）"
20042-832-760-1 = "思ってたよりは\n悪くなかったかも？"
20042-832-770-1 = "夕飯の水炊きは\n美味しかったし……。"
20042-832-780-1 = "スマホ持ってきて\nいいなら、また\n来たいかも。"
20042-832-790-1 = "べ、別にキャンプが好きに\nなったわけじゃないよ…！"
20042-832-800-1 = "うぅ……年末特番を\n見れないなんて……。"
20042-832-810-1 = "チヒロ先輩ひどい！"
20042-832-820-1 = "あの雲……\nサーバーコンピューターに\n似てるかも。"
20042-832-830-1 = "うぅ、\nキーボード打ちたい～\n暇すぎるよぉ～！"
20042-832-840-1 = "ねぇ先生、なにか手を使う\nおもちゃとか持ってない？\n輪ゴムでもいいから！"
20042-832-850-1 = "先生は\n楽しんでるみたいだね、\nキャンプ。"
20042-832-860-1 = "じゃあ、あたしも\nちょっとは\n楽しんでみよっかな！"
