[translation]
20042-832-700-1 = "I'm bored..."
20042-832-710-1 = "I really wish I'd brought at least SOME kind of gaming device."
20042-832-720-1 = "I want to feel electromagnetic waves..."
20042-832-730-1 = "Maybe I'll draw something, using nature as a canvas."
20042-832-740-1 = "(Ah, that mural... I forgot to erase it.)"
20042-832-750-1 = "(Well, no big deal, right?)"
20042-832-760-1 = "Mm. Not as bad of an experience as I expected."
20042-832-770-1 = "The Mizutaki I had for dinner, that was really the best..."
20042-832-780-1 = "I think I might want to come again sometime, as long as I have my phone."
20042-832-790-1 = "O-Of course, that doesn't mean I LIKE camping now!"
20042-832-800-1 = "Ugh... There are so many fun channels at the end of the year, and I can't watch them all..."
20042-832-810-1 = "Chihiro is so mean for that!"
20042-832-820-1 = "Ah, that cloud... It looks like a server computer."
20042-832-830-1 = "It's been a while since I've touched a keyboard, and my hands are just itching to do something."
20042-832-840-1 = "Sensei, do you have any handheld toys, by any chance? A rubber band? Anything?"
20042-832-850-1 = "So you're probably enjoying it out here, Sensei."
20042-832-860-1 = "Well, I'll try to cheer up a bit, then."
