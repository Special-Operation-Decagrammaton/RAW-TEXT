[translation]
20042-832-700-1 = "심심해……"
20042-832-710-1 = "단순한 게임기라도\n가져왔으면\n좋았을 텐데……"
20042-832-720-1 = "전자파를\n느끼고 싶어……"
20042-832-730-1 = "자연을 캔버스 삼아서\n뭐라도 그려볼까."
20042-832-740-1 = "(아, 그 벽화……\n지우는 거 깜빡했네.)"
20042-832-750-1 = "(뭐, 별일이야\n있겠어?)"
20042-832-760-1 = "으음. 생각보다는\n나쁘지 않은\n경험이었어."
20042-832-770-1 = "특히 저녁에 먹은\n미즈타키는 정말\n최고였어…"
20042-832-780-1 = "핸드폰만 있다면\n한 번쯤은 다시 와도\n괜찮을 것 같아."
20042-832-790-1 = "무, 물론 캠핑이\n좋아졌다는\n뜻은 아니지만……!"
20042-832-800-1 = "으으… 연말에는 재미있는\n방송이 잔뜩 있는데,\n그 실황을 볼 수 없다니…"
20042-832-810-1 = "치히로 선배도 너무해!"
20042-832-820-1 = "아, 저 구름… 뭔가\n서버 컴퓨터랑 생긴 게\n닮은 것 같기도."
20042-832-830-1 = "으으, 오랜만에\n키보드에서 손을 떼고\n가만히 있으려니\n손이 심심해서 못 견디겠어."
20042-832-840-1 = "선생님, 뭔가 손으로\n가지고 놀만한 장난감\n같은 거 안 갖고 있어?\n고무줄이라도 괜찮으니까!"
20042-832-850-1 = "선생님은 즐기고\n있구나, 캠핑."
20042-832-860-1 = "그럼, 나도 조금은\n기분을 내볼까!"
