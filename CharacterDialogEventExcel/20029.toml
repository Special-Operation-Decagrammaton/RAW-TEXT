[translation]
20029-815-650-1 = "あ、おかえりなさい、\n先生。"
20029-815-660-1 = "海の家ですよ。頑張って\n準備いたしました！"
20029-815-670-1 = "お待ちしておりました。\n先生。"
20029-815-680-1 = "ふふ。お祭り運営委員会の\nみなさんを手伝うのも\n楽しいですね。"
20029-815-690-1 = "リゾート狩り…\nとんでもないことに\nなってしまっていますね…"
20029-815-700-1 = "いいえ、こういう時こそ\n気を引き締めなければ\nなりませんね。"
20029-815-710-1 = "最初から、不安じゃ\nなかったといえば\n嘘ですが…"
20029-815-720-1 = "これもすべて、\n先生がいてくださった\nおかげです。"
20029-815-730-1 = "夏の海の思い出…\n素敵な言葉ですね。"
20029-815-740-1 = "今年は特に、\n強くそう思いました。"
20029-815-750-1 = "先生？\nお呼びでしょうか？"
20029-815-760-1 = "いつでもお声がけ\nくださいね。"
20029-815-770-1 = "結構暑いですね…\n熱中症にはお気を\nつけください、先生。"
20029-815-780-1 = "…いざとなったら\n私がお世話しますよ。"
20029-815-790-1 = "シズコちゃん…\n大丈夫でしょうか？\n少し、心配です。"
20029-815-800-1 = "事件を解決するのは…\n難しい気もしますが、"
20029-815-810-1 = "皆さんと協力すれば、\nきっと大丈夫ですよね。"
20029-815-820-1 = "今こそ修行の成果を\n見せるとき、\nかもしれませんね。"
