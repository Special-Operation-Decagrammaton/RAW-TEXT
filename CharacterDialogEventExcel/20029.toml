[translation]
20029-815-650-1 = "啊，歡迎回來，老師。"
20029-815-660-1 = "這裡是海之家唷。\n我們很努力地做了準備！"
20029-815-670-1 = "恭候您的光臨。\n老師。"
20029-815-680-1 = "呵呵。\n幫忙節慶營運管理部\n的各位也很開心呢。"
20029-815-690-1 = "渡假勝地狩獵…\n事情變得一發\n不可收拾了呢…"
20029-815-700-1 = "不，越是這種時候，\n越要打起精神。"
20029-815-710-1 = "要說從一開始\n就不擔心的話，\n那是騙人的……"
20029-815-720-1 = "這一切，都是\n多虧有老師在。"
20029-815-730-1 = "夏日大海的回憶……\n真是美妙的詞彙呢。"
20029-815-740-1 = "特別是今年，\n我的感受尤其強烈。"
20029-815-750-1 = "老師？\n您叫我嗎？"
20029-815-760-1 = "請隨時呼喚我哦。"
20029-815-770-1 = "還挺熱的呢……\n請小心不要中暑，\n老師。"
20029-815-780-1 = "…萬一有什麼緊急情況，\n我會照顧你的。"
20029-815-790-1 = "靜子醬…還好嗎？\n有點擔心。"
20029-815-800-1 = "要解決事件…\n感覺雖然有點困難，"
20029-815-810-1 = "但只要大家合作，\n一定沒問題的吧。"
20029-815-820-1 = "現在或許就是展現\n修行成果的時候呢。"
