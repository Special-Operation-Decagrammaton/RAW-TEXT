[translation]
20029-815-650-1 = "ชะ...เชิญเลยค่ะคุณครู"
20029-815-660-1 = "ร้านสาขาริมทะเลค่ะ\nเรากำลังเตรียมตัวกัน\nอย่างเต็มที่เลยค่ะ"
20029-815-670-1 = "ฉันกำลังรออยู่เลยค่ะ คุณครู"
20029-815-680-1 = "ฮุฮุ พอได้มาช่วย\nชมรมจัดงานเทศกาลแบบนี้\nฉันภูมิใจมากเลยละค่ะ"
20029-815-690-1 = "ล่ารีสอร์ต...\nเกิดเรื่องใหญ่โต\nขึ้นแล้วสินะคะ..."
20029-815-700-1 = "ไม่หรอกค่ะ ในเวลาแบบนี้\nจะต้องเตรียมใจไว้ให้ดีค่ะ"
20029-815-710-1 = "ถ้าบอกว่าตอนแรก\nฉันไม่รู้สึกกังวลเลย\nก็คงจะเป็นการพูดโกหก..."
20029-815-720-1 = "แต่ที่คลายกังวลได้\nก็เพราะมีคุณครูอยู่ด้วยไงล่ะคะ"
20029-815-730-1 = "คำพูดที่ว่า...\n\"ความทรงจำในฤดูร้อน\"\nเป็นคำที่วิเศษจริงๆ เลยนะคะ"
20029-815-740-1 = "และครั้งนี้ก็เหมือนว่า\nจะยิ่งพิเศษมากกว่าเดิมเลยค่ะ"
20029-815-750-1 = "คุณครู? เรียกฉันเหรอคะ?"
20029-815-760-1 = "มีอะไรก็บอกฉันได้ตลอดเลยนะคะ"
20029-815-770-1 = "ร้อนสุดๆ ไปเลยนะคะ...\nระวังโรคลมแดดด้วยนะคะ\nคุณครู"
20029-815-780-1 = "แต่ถ้าเกิดฉุกเฉินขึ้นมา\nฉันจะดูแลให้เองค่ะ"
20029-815-790-1 = "ชิซุโกะจัง... จะไม่เป็นอะไร\nแน่ใช่มั้ยคะ?\nรู้สึกเป็นห่วงจังเลยค่ะ"
20029-815-800-1 = "การคลี่คลายสถานการณ์...\nดูเหมือนจะเป็นเรื่องยากก็จริง"
20029-815-810-1 = "แต่ถ้าทุกคนร่วมมือกันละก็\nจะต้องผ่านไปได้ด้วยดีแน่นอนค่ะ"
20029-815-820-1 = "ตอนนี้อาจจะเป็นเวลา\nที่จะแสดงผลลัพธ์\nของการฝึกฝนก็ได้นะคะ"
