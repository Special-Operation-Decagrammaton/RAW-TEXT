[translation]
20029-815-650-1 = "Ah, please come in, Sensei."
20029-815-660-1 = "This is the Beach Shack. I have many things to offer you."
20029-815-670-1 = "I've been waiting for you, Sensei."
20029-815-680-1 = "Heehee. Helping the Festival Operations Department is very fulfilling."
20029-815-690-1 = "The Resort Hunt... It's becoming more complicated than I expected..."
20029-815-700-1 = "It's at times like this that I need to pull myself together."
20029-815-710-1 = "I'd be lying if I said I wasn't nervous at first, but..."
20029-815-720-1 = "I owe this all to you, Sensei."
20029-815-730-1 = "Memories of the beach in the summer... What a beautiful thing."
20029-815-740-1 = "It seems especially beautiful today."
20029-815-750-1 = "Sensei, did you call me?"
20029-815-760-1 = "Let me know if you ever need anything."
20029-815-770-1 = "It's pretty hot. Be careful not to get heatstroke, Sensei."
20029-815-780-1 = "If there's anything wrong, I'll take care of you."
20029-815-790-1 = "Will Shizuko be okay? I'm a little worried."
20029-815-800-1 = "It may seem like it'll be difficult to solve the case, but..."
20029-815-810-1 = "...it'll be okay if everyone works together."
20029-815-820-1 = "This may be the best time to show off the results of my training."
