[translation]
10051-817-10-1 = "자, 다함께 최고의\n<황륜대제>를 위해\n힘을 모으는 거야!"
10051-817-20-1 = "이런 재미있어 보이는…"
10051-817-30-1 = "아니, 밀레니엄의\n명예가 걸린 일이라면"
10051-817-40-1 = "우리 엔지니어부가\n당연히 도와야지."
10051-817-50-1 = "음, <황륜대제>\n준비도 착실히\n진행되고 있군."
10051-817-60-1 = "<황륜대제> 개최도\n이제 머지않았어."
10051-817-70-1 = "벌써부터 흥분이\n가라앉지 않는걸."
10051-817-80-1 = "수고 많았어, 선생님.\n먼저 응원석에서\n기다리고 있을게."
10051-817-90-1 = "응원은 아직\n익숙하지 않지만…"
10051-817-100-1 = "어쩔 수 없지.\n최선을 다할게."
10051-817-110-1 = "한번 받은 의뢰는\n끝까지 수행하는 게"
10051-817-120-1 = "우리 엔지니어부의\n모토니까!"
10051-817-130-1 = "그러고보니 세미나의\n깐깐한 회계가…\n모습이 보이질 않네."
10051-817-140-1 = "어디 아픈 게\n아니였으면 좋겠는데."
10051-817-150-1 = "(모두가 평온하게 축제를\n즐길 수 있었으면\n좋겠는데…)"
10051-817-160-1 = "평소에 움직이는 일이\n적다고는 하지만"
10051-817-170-1 = "코토리와 히비키의 체력이\n이렇게까지 떨어졌다니…"
10051-817-180-1 = "축제가 끝난 뒤에\n엔지니어부 부실에"
10051-817-190-1 = "체력 단련 로봇이라도\n만들어 놓을까?"
