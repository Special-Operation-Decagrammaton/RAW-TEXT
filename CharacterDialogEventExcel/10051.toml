[translation]
10051-817-10-1 = "เอาละ มารวมพลัง\nเพื่อ <ฮาโลเฟสติวัล>\nที่ยอดเยี่ยมกันเลย!"
10051-817-20-1 = "แบบนี้จะน่าสนุกมั้ยนะ..."
10051-817-30-1 = "ไม่สิ ถ้าเป็นเรื่องเกียรติยศ\nของมิลเลเนียมแล้วละก็"
10051-817-40-1 = "ชมรมวิศวกรรมของเรา\nก็ต้องไปช่วยอยู่แล้ว"
10051-817-50-1 = "อืม การเตรียมตัว\nเพื่อ <ฮาโลเฟสติวัล>\nกำลังไปได้สวยเลยนะ"
10051-817-60-1 = "ใกล้ถึงวันเปิดงาน\n<ฮาโลเฟสติวัล> แล้วละ"
10051-817-70-1 = "ชักตื่นเต้น\nจนจะทนไม่ไหวแล้วแฮะ"
10051-817-80-1 = "ทำได้ดีมากคุณครู\nแล้วฉันจะไปรอ\nบนอัฒจันทร์เชียร์นะ"
10051-817-90-1 = "ฉันยังไม่ชิน\nกับการเชียร์เลย..."
10051-817-100-1 = "แต่ก็ช่วยไม่ได้\nจะทำให้ดีที่สุดแล้วกัน"
10051-817-110-1 = "ชมรมวิศวกรรม\nมีคติพจน์ว่า"
10051-817-120-1 = "ต้องทำภารกิจที่ได้รับมา\nให้สำเร็จน่ะ!"
10051-817-130-1 = "จะว่าไป... ไม่เห็น\nนักบัญชีจอมเฮี้ยบ\nของเซมิน่าเลยแฮะ"
10051-817-140-1 = "หวังว่าคงไม่ได้\nเจ็บป่วยตรงไหนนะ"
10051-817-150-1 = "(หวังว่าทุกคน\nจะมีความสุข\nกับเทศกาลนะ...)"
10051-817-160-1 = "ถึงปกติจะไม่ได้มีเรื่อง\nให้ขยับตัวเท่าไรก็เถอะ"
10051-817-170-1 = "แต่พละกำลังของโคโทริ\nกับฮิบิกิลดลงขนาดนี้เชียว..."
10051-817-180-1 = "หลังจบงานเทศกาล\nคงต้องไปห้องชมรมวิศวกรรม"
10051-817-190-1 = "แล้วสร้างหุ่นยนต์\nฝึกพละกำลังแล้วดีมั้ยนะ?"
