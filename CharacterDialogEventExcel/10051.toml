[translation]
10051-817-10-1 = "さあ、皆で最高の\n「晄輪大祭」にする\nために、力を合わせよう！"
10051-817-20-1 = "なんて面白そうな…"
10051-817-30-1 = "ミレニアムの名誉が\nかかっているからね。"
10051-817-40-1 = "私たちエンジニア部が\n手伝うのは当然の事だよ。"
10051-817-50-1 = "うむ、「晄輪大祭」の\n準備は着実に\n進んでいるね。"
10051-817-60-1 = "「晄輪大祭」の\n開催まであと少し。"
10051-817-70-1 = "今から興奮が\n収まらないよ。"
10051-817-80-1 = "お疲れ様、先生。\n先に応援席で待ってるね。"
10051-817-90-1 = "応援はまだ\n慣れてないけど…"
10051-817-100-1 = "仕方ない、\n精一杯頑張るよ。"
10051-817-110-1 = "一度引き受けた依頼は、\n最後まで成し遂げる。"
10051-817-120-1 = "それが私たち\nエンジニア部の\nモットーだからね！"
10051-817-130-1 = "そういえば、セミナーの\nしっかり者の会計…\n彼女の姿が見えないね。"
10051-817-140-1 = "体調を崩してないと\n良いけれど。"
10051-817-150-1 = "（皆が穏やかに、祭りを\n楽しめるといいな…)"
10051-817-160-1 = "普段動くことが\n少ないとは言え、"
10051-817-170-1 = "コトリとヒビキの\n体力がここまで\n落ちていたとは…"
10051-817-180-1 = "祭りが終わったら、\nエンジニア部の部室に"
10051-817-190-1 = "体づくりサポートの\nロボットでも作って\n置いておこうかな。"
