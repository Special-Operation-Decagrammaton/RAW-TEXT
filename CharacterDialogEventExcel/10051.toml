[translation]
10051-817-10-1 = "Let's do our best to make this Kivotos Halo Festival as great as possible!"
10051-817-20-1 = "The energy is palpable..."
10051-817-30-1 = "Millennium's honor is at stake."
10051-817-40-1 = "Of course the Engineering Department will help."
10051-817-50-1 = "Good to see that preparations for the Kivotos Halo Festival are going well."
10051-817-60-1 = "It's almost time for the Kivotos Halo Festival."
10051-817-70-1 = "I'm already getting excited. I'll try to contain myself."
10051-817-80-1 = "Well done, Sensei. I'll be waiting by the cheering event stage."
10051-817-90-1 = "My cheers still need fine-tuning..."
10051-817-100-1 = "There's no helping it. I'll do my best."
10051-817-110-1 = "A request received will become a design achieved!"
10051-817-120-1 = "That is the eternal motto of the Engineering Department!"
10051-817-130-1 = "Come to think of it, I haven't seen Seminar's resident perfectionist anywhere..."
10051-817-140-1 = "I hope she isn't sick."
10051-817-150-1 = "(In fact, I hope everyone can enjoy the festival to the fullest...)"
10051-817-160-1 = "I get that we're not an athletics club..."
10051-817-170-1 = "...but I didn't think Kotori and Hibiki would be this out of shape..."
10051-817-180-1 = "There's only one way to get fit. The Engineering Department's next undertaking will be..."
10051-817-190-1 = "...designing an exercise robot."
