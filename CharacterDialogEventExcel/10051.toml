[translation]
10051-817-10-1 = "來，為了一同成就\n最棒的「晄輪大祭」，\n集合彼此的力量吧！"
10051-817-20-1 = "多麼有趣啊…"
10051-817-30-1 = "畢竟這關係到\n千年的名譽。"
10051-817-40-1 = "我們工程師部\n幫忙也是當然的。"
10051-817-50-1 = "唔呣，「晄輪大祭」\n的準備正按部就班地進行。"
10051-817-60-1 = "距離「晄輪大祭」\n還有一點時間。"
10051-817-70-1 = "現在就已經\n興奮到不行了。"
10051-817-80-1 = "辛苦了，老師。\n我先到應援席等你唷。"
10051-817-90-1 = "雖然我\n還不習慣應援…"
10051-817-100-1 = "但沒辦法了，\n我會全力以赴的。"
10051-817-110-1 = "一旦接到委託，\n就要做到最後。"
10051-817-120-1 = "這是我們\n工程師部的\n座右銘！"
10051-817-130-1 = "這麼說來，\n研討會的可靠會計…\n沒見到他的身影呢。"
10051-817-140-1 = "希望不是因為\n身體不舒服。"
10051-817-150-1 = "（希望大家都能\n　平安地享受慶典…）"
10051-817-160-1 = "雖然說平時\n就很少運動，"
10051-817-170-1 = "但亞都梨和響的體力\n居然會下降成這樣…"
10051-817-180-1 = "等慶典結束後，要不要\n在工程師部的部室裡"
10051-817-190-1 = "做個輔助健身的\n機器人擺著呢？"
