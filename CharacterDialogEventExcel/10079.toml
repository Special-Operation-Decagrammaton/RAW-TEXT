[translation]
10079-831-10-1 = "มาเริ่มกันเลยดีมั้ย"
10079-831-20-1 = "ฉันเตรียมตัวพร้อมแล้ว\nคุณครูล่ะ?"
10079-831-30-1 = "ทำไปได้เยอะเลยนะเนี่ย"
10079-831-40-1 = "ตอนนี้รู้สึกเหมือน\nจะเสร็จแล้วเนอะ?"
10079-831-50-1 = "งั้นก่อนอื่นก็\nลองตรวจสอบดูสิ"
10079-831-60-1 = "หืม...? เรียกฉันเหรอ?"
10079-831-70-1 = "อะไรเนี่ย\nแกล้งกันเหรอ?"
10079-831-80-1 = "มีเรื่องอื่นที่\nต้องทำไม่ใช่เหรอ?"
10079-831-90-1 = "เฮ้อ...\nรู้แล้ว รู้แล้วน่า\nให้ฉันทำอะไรให้ดี?"
10079-831-380-1 = "ได้เจอกันที่นี่อีกแล้วนะคุณครู\nไปดูรอบๆ กันหน่อยดีมั้ย?"
10079-831-390-1 = "รู้สึกดีเลยนะเนี่ย?\nตอนนี้เราอาจจะเจอของดีๆ ก็ได้นะ"
10079-831-400-1 = "เอาละ ถ้ายังมีอะไรเหลืออยู่\nงั้นเราไปดูให้ทั่วๆ ก่อนจะไม่ทันดีกว่า"
10079-831-410-1 = "มันน่าเสียดายนะ"
10079-831-420-1 = "ให้กดทางโน้น\nไม่ใช่มากดฉันสิ!"
10079-831-430-1 = "อะฮ่าฮ่าฮ่า!\nอะ... อะไรเนี่ย!? จั๊กจี้นะ!!"
10079-831-440-1 = "โอ๊ะ ได้แล้ว! ยินดีด้วยนะ!"
10079-831-450-1 = "อันนี้มัน\nเป็นของแรร์เลยไม่ใช่เหรอ?"
10079-831-460-1 = "ของดีทีเดียวเลยนะ"
10079-831-470-1 = "ปิดจ๊อบด้วยชิ้นนี้เลยใช่มั้ย\nทำได้ดีมากเลยคุณครู!"
