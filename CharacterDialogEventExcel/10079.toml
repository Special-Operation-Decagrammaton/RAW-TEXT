[translation]
10079-831-10-1 = "そろそろ\n始めようかしら。"
10079-831-20-1 = "私は準備オッケー。\n先生は？"
10079-831-30-1 = "かなり進んだわね。"
10079-831-40-1 = "もうほとんど\n終わった感じよね？"
10079-831-50-1 = "一応、もっかい\n確認してみて。"
10079-831-60-1 = "……ん、\nなんか呼んだ？"
10079-831-70-1 = "なんだ、\n冷やかしか。"
10079-831-80-1 = "他にやんなきゃ\nいけない事、\nあるんじゃないの？"
10079-831-90-1 = "はあ……\nわかった、わかった。\n何か手伝おうか？"
10079-831-380-1 = "また会ったわね、先生。\nちょっと回していく？"
10079-831-390-1 = "いい感じじゃない？\n今ならいいの出るかもね。"
10079-831-400-1 = "ほら、まだ残ってるなら\n手遅れになる前に\n全部回したら？"
10079-831-410-1 = "もったいないわよ。"
10079-831-420-1 = "私じゃなくて\nあっち押しなさいよ！"
10079-831-430-1 = "あははは！\nな、なに！？\nくすぐったい！！"
10079-831-440-1 = "あら、当たりじゃない！\nおめでと！"
10079-831-450-1 = "これ、\n結構レアなんじゃない？"
10079-831-460-1 = "そこそこ\nいいものなんじゃない？"
10079-831-470-1 = "これで大体終了かな。\nお疲れ様、先生！"
