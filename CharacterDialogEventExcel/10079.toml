[translation]
10079-831-10-1 = "那我們就開始吧。"
10079-831-20-1 = "我準備OK，\n老師你呢？"
10079-831-30-1 = "進度相當不錯呢。"
10079-831-40-1 = "感覺已經幾乎\n結束了呢？"
10079-831-50-1 = "姑且還是\n再確認一次吧。"
10079-831-60-1 = "……嗯？你叫我嗎？"
10079-831-70-1 = "什麼嘛，\n是在開玩笑啊。"
10079-831-80-1 = "不是還有其他\n必須做的事嗎？"
10079-831-90-1 = "唉……\n知道了知道了。\n要我幫你什麼嗎？"
10079-831-380-1 = "又見面了呢，老師。\n要不要抽抽看？"
10079-831-390-1 = "感覺還不錯嘛？\n說不定現在\n會出現好東西。"
10079-831-400-1 = "來，如果還有剩的話，\n最好在來不及之前抽完哦？"
10079-831-410-1 = "不然就太可惜囉。"
10079-831-420-1 = "不要按我，\n按那邊啦！"
10079-831-430-1 = "啊哈哈哈！\n怎，怎麼了！？\n很癢耶！！"
10079-831-440-1 = "哎呀，中獎了呢！恭喜你！"
10079-831-450-1 = "這個，是不是\n還挺稀有的？"
10079-831-460-1 = "還算是不錯的東西吧？"
10079-831-470-1 = "這樣就大致結束了吧。\n辛苦你了，老師！"
