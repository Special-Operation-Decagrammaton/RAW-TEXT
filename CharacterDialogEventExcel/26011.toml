[translation]
26011-831-200-1 = "มาแล้วเหรอคะคุณครู!\nงั้นเราออกเดินทางกันเลยค่ะ!"
26011-831-210-1 = "ฉันกำลังรออยู่เลยค่ะ\nคุณครู!"
26011-831-220-1 = "ผ่านมาครึ่งทางแล้วนะคะเนี่ย!\nสู้ให้ถึงตอนจบเลยนะ!"
26011-831-230-1 = "เริ่มจะเห็น\nตอนจบแล้วสินะคะ...!"
26011-831-240-1 = "มาดูอีกครั้ง!\nเป็นครั้งสุดท้ายก่อนไปมั้ยคะ?"
26011-831-250-1 = "หืม? คุณครู?\nเป็นอะไรไปคะ?"
26011-831-260-1 = "ให้ฉันช่วยอะไรมั้ยคะ?"
26011-831-270-1 = "อืม... คุณครู ตอนนี้ไม่ใช่\nเวลามาเล่นสนุกอยู่นะคะ"
26011-831-280-1 = "โธ่! คุณครูเนี่ย!\nตั้งใจหน่อย! ตั้งใจหน่อยค่ะ!"
26011-831-290-1 = "ทาด๊า! ฉันเตรียมของมา\nเยอะเลยละค่ะ!"
26011-831-300-1 = "ตรงนี้ค่ะ คุณครู!\nชอบอันไหนก็เลือกไปนะคะ!"
26011-831-310-1 = "เช็กให้ดีนะคะ~\nว่ามีงานอะไรเหลือรึเปล่า"
26011-831-320-1 = "เอ๋? หาอะไรเหรอคะ?"
26011-831-330-1 = "คนที่คุณครูต้องสนใจ\nไม่ใช่ฉัน แต่เป็นทางนั้นต่างหาก..."
26011-831-340-1 = "อ้อ อันนั้นเหรอคะ? ดีเลยค่ะ!"
26011-831-350-1 = "ฮึ่ม! ตาแหลมนะคะเนี่ย~\n..อะไรกันเนี่ย!"
26011-831-360-1 = "หาเจอแล้วสินะคะ! ฉันเห็นด้วยค่ะ!"
26011-831-370-1 = "โอ้วว~ ต้องอย่างนี้แหละ!\nฉันก็คิดว่าอันนี้ดีเหมือนกันค่ะ!"
