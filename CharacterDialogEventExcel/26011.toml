[translation]
26011-831-200-1 = "来てくれたんですね、\n先生！\nでは早速行きましょう！"
26011-831-210-1 = "待ってましたよ、先生！"
26011-831-220-1 = "もう残り半分！？\n最後まで頑張りましょう！"
26011-831-230-1 = "そろそろ、\n終わりが見えて\nきましたね……！"
26011-831-240-1 = "最後に！\nもう一度見て\nいきませんか？"
26011-831-250-1 = "あれ？先生、\nどうかしました？"
26011-831-260-1 = "何か、\nお手伝いしましょうか？"
26011-831-270-1 = "……むむ、先生、\n今は遊んでる場合じゃ\nないですよ。"
26011-831-280-1 = "もう！先生！\n集中！集中ですよ！"
26011-831-290-1 = "じゃーん！\n色々用意してみました！"
26011-831-300-1 = "こちらです、先生！\n好きなものを\n選んじゃってください！"
26011-831-310-1 = "やり残しはないか、\nチェック、チェックですよ～！"
26011-831-320-1 = "あれ？何かお探しですか？"
26011-831-330-1 = "えっと、見てもらいたいのは、\n私じゃなくて\nあっちなんですけど……。"
26011-831-340-1 = "あっ、それ！いいですね！"
26011-831-350-1 = "ふむ！お目が高いですねぇ～\n……なんちゃって！"
26011-831-360-1 = "お探しのものは\nそれだったんですね！納得です！"
26011-831-370-1 = "おおー！やっぱり！\n私もそれがいいと思ってました！"
