[translation]
10087-833-260-1 = "おかえりなさい、先生。"
10087-833-270-1 = "準備はちゃんと\nできましたか？"
10087-833-280-1 = "覚悟をしっかりと\n決めてくださいね。"
10087-833-290-1 = "準備ならつつがなく\n完了しました。"
10087-833-300-1 = "ゲヘナ風紀委員会の\n行政官として…"
10087-833-310-1 = "今こそ立ち上がる\n時かと。"
10087-833-320-1 = "簡単には終わらない……\nということですね。"
10087-833-330-1 = "まあ、だからと\nいって諦めるわけには\nいきませんが。"
10087-833-340-1 = "ほんっとう～に！\nしつこいですね！"
10087-833-350-1 = "はぁ……まあ、\nいいでしょう！"
10087-833-360-1 = "それならこちらも\n最後までやってやる\n覚悟はできていますから！"
10087-833-370-1 = "さあ、引き続きよろしく\nお願いいたします！先生！"
10087-833-380-1 = "やっと\n終わりましたか……。"
10087-833-390-1 = "本当に色々あったと\nいうか…"
10087-833-400-1 = "もう疲れ果てたと\nいいますか。"
10087-833-410-1 = "……帰ってコーヒーでも\n一杯、いかがですか？\n先生。"
10087-833-420-1 = "今回のパーティーも\n結局こんな事に……。"
10087-833-430-1 = "本当、どうなって\nしまうんでしょうか。"
10087-833-440-1 = "まあ、構いません……"
10087-833-450-1 = "何が起こっても、\n私たち風紀委員会が……。"
10087-833-460-1 = "いえ、私が\n解決してみせます！"
10087-833-470-1 = "今の私はヒナ委員長を\n補佐するもう一人の\nスパイ。"
10087-833-480-1 = "であれば、今まで\n隠していた真の実力をお\n見せする時でしょう。"
10087-833-490-1 = "ふふ、楽しみに\nしていてくださいね。"
10087-833-500-1 = "今年は静かにしていたと\n思ったら……"
10087-833-510-1 = "いえ、ゲヘナではどだい\n無茶な話だったの\nでしょうか……はあ。"
10087-833-820-1 = "おかえりなさい、先生。"
10087-833-830-1 = "ちょうど解決していただきたい\n仕事があるのです。"
10087-833-840-1 = "お願いしても良いですか？"
10087-833-850-1 = "ふふ、ここまで来たのですから、\n逃げられると思わないでくださいね。"
10087-833-860-1 = "はい、業務リストが\nい～っぱい♪ですよ。"
10087-833-870-1 = "はーい、サボるつもりでしたら\n諦めてください。"
10087-833-880-1 = "私がすぐ隣で監視……\n失礼、補佐していますので。"
10087-833-890-1 = "目の前の仕事をする前に、\n他のことをしたい気持ちはわかります。"
10087-833-900-1 = "でも……そういうのは仕事\nが全部終わってから。"
10087-833-910-1 = "ふふっ……いいですね？"
10087-833-920-1 = "へぇ、やるじゃないですか。"
10087-833-930-1 = "はい、働いた報酬はちゃんと\nありますよ。当然です。"
10087-833-940-1 = "なんと……\n一気に解決したのですか。"
10087-833-950-1 = "へぇ……正直感心しました。\nさすが先生ですね。"
