[translation]
10087-833-260-1 = "어서 오세요. 선생님."
10087-833-270-1 = "준비는 모두 되셨나요?"
10087-833-280-1 = "각오, 단단히 해주세요."
10087-833-290-1 = "준비라면 차질 없이\n완료되었습니다."
10087-833-300-1 = "게헨나 선도부의\n행정관으로서…"
10087-833-310-1 = "지금이야말로 일어설 때겠죠."
10087-833-320-1 = "간단하게는\n끝나지 않는다…라는\n말씀이시군요."
10087-833-330-1 = "뭐, 그렇다고\n포기할 수는 없지만요."
10087-833-340-1 = "저어엉말~! 끈질기네요!"
10087-833-350-1 = "후우, 뭐, 좋아요!"
10087-833-360-1 = "그렇다면 이쪽도 끝까지\n해줄 각오가 되어있으니까!"
10087-833-370-1 = "자, 계속해서\n부탁드린다구요! 선생님!"
10087-833-380-1 = "드디어 끝났나요……."
10087-833-390-1 = "정말 여러 가지 일이\n있었다고 할지."
10087-833-400-1 = "이젠 진이 빠졌다고 할지."
10087-833-410-1 = "……돌아가서 커피라도\n한잔하실래요? 선생님."
10087-833-420-1 = "이번 파티도\n결국 이렇게……."
10087-833-430-1 = "정말, 어떻게\n되어버리는 걸까요."
10087-833-440-1 = "뭐, 상관없어요…."
10087-833-450-1 = "무슨 일이 일어나도,\n우리 선도부가……."
10087-833-460-1 = "아니, 제가\n해결해 보이겠어요!"
10087-833-470-1 = "지금의 전 히나 부장님을\n보좌하는 또 한 명의 스파이."
10087-833-480-1 = "역시 여기에선, 그간 감춰왔던\n진정한 실력을 보일 때겠죠."
10087-833-490-1 = "후후, 기대하시라구요."
10087-833-500-1 = "올해는\n조용하나 싶었더니……."
10087-833-510-1 = "아니, 게헨나에선 역시\n무리인 이야기려나요. 하아."
10087-833-820-1 = "어서 오세요. 선생님."
10087-833-830-1 = "마침 해결해 주셨으면 하는\n일이 있어서요."
10087-833-840-1 = "부탁드려도 될까요?"
10087-833-850-1 = "후후, 여기까지 오셨다면\n도망칠 수 없습니다."
10087-833-860-1 = "네, 업무 리스트가\n잔뜩♪ 이니까요."
10087-833-870-1 = "네에, 땡땡이 치실\n생각이라면 그만두세요."
10087-833-880-1 = "제가 바로 곁에서 감시…\n실례, 보좌하고 있으니까요."
10087-833-890-1 = "눈앞에 닥친 일을 하기 전에,\n딴짓을 하고 싶은 마음은 이해해요."
10087-833-900-1 = "다만 그런 건 일이 전부 끝난 후에."
10087-833-910-1 = "…아시겠죠?"
10087-833-920-1 = "흐응~ 제법이잖아요."
10087-833-930-1 = "네, 일한 보수는 제대로 있어요.\n당연한 일이에요."
10087-833-940-1 = "세상에…\n단번에 해결하신 건가요."
10087-833-950-1 = "헤에… 솔직히 감탄했습니다.\n역시 선생님이시네요."
