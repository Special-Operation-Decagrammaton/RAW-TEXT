[translation]
10087-833-260-1 = "เชิญค่ะ คุณครู"
10087-833-270-1 = "ทุกอย่างพร้อมหรือยังคะ?"
10087-833-280-1 = "เตรียมตัวให้ดีด้วยนะคะ"
10087-833-290-1 = "เรื่องเตรียมการ\nสำเร็จอย่างราบรื่นแล้วค่ะ"
10087-833-300-1 = "ในฐานะเจ้าหน้าที่ของ\nคณะกรรมการวินัยเกเฮนน่า"
10087-833-310-1 = "ตอนนี้คือเวลาที่ฉันต้องลุกขึ้นมาค่ะ"
10087-833-320-1 = "มันคงจะไม่จบลงไป\nได้ง่ายๆ เลย... สินะคะ"
10087-833-330-1 = "แต่ถึงอย่างนั้น\nก็จะล้มเลิกไม่ได้หรอกค่ะ"
10087-833-340-1 = "ไม่ยอมถอดใจจริงๆ เลยนะคะ~!"
10087-833-350-1 = "ฮู่ว แต่ก็ดีค่ะ!"
10087-833-360-1 = "ถ้างั้นทางเราก็จะเตรียมพร้อม\nจนจบเรื่องให้เหมือนกัน!"
10087-833-370-1 = "เอาละ ต้องขอรบกวน\nต่อเลยนะคะ คุณครู!"
10087-833-380-1 = "ในที่สุดก็จบสักทีนะคะ..."
10087-833-390-1 = "ฉันควรบอกว่า\nเกิดเรื่องขึ้นมากมายเลย"
10087-833-400-1 = "หรือว่าตอนนี้หมดแรงแล้วดีนะ"
10087-833-410-1 = "กลับไปดื่มกาแฟ\nกันสักแก้วไหมคะคุณครู?"
10087-833-420-1 = "สุดท้ายแล้ว\nปาร์ตี้ครั้งนี้ก็..."
10087-833-430-1 = "จริงๆ เลย เป็นแบบนี้\nขึ้นมาได้ยังไงคะเนี่ย"
10087-833-440-1 = "แต่ก็ไม่เป็นไรหรอกค่ะ"
10087-833-450-1 = "ไม่ว่าจะเกิดเรื่องอะไร\nคณะกรรมการวินัยของเรา..."
10087-833-460-1 = "ไม่สิ ฉันจะ\nลองคลี่คลายดูค่ะ!"
10087-833-470-1 = "ตอนนี้ฉันคือสายลับอีกคน\nที่คอยเป็นผู้ช่วยประธานฮินะ"
10087-833-480-1 = "ตอนนี้ถึงเวลาแสดงฝีมือที่แท้จริง\nที่ซ่อนมาตลอดแล้วค่ะ"
10087-833-490-1 = "ฮุฮุ ตั้งตารอได้เลยค่ะ"
10087-833-500-1 = "ก็คิดอยู่ว่า\nปีนี้จะเงียบๆ รึเปล่า..."
10087-833-510-1 = "ไม่สิ เรื่องแบบนั้นคงยาก\nที่จะเกิดในเกเฮนน่ารึเปล่าคะ? เฮ้อ"
10087-833-820-1 = "เชิญค่ะคุณครู"
10087-833-830-1 = "มีเรื่องที่ฉันอยากให้\nช่วยคลี่คลายพอดีเลยค่ะ"
10087-833-840-1 = "ช่วยหน่อยได้ไหมคะ?"
10087-833-850-1 = "ฮุฮุ ถ้ามาถึงตรงนี้แล้ว\nก็หนีไม่ได้แล้วละค่ะ"
10087-833-860-1 = "ค่ะ เพราะงานที่ต้องทำ\nยาวเป็นหางว่าว♪ เลยค่ะ"
10087-833-870-1 = "ค่ะ หยุดความคิดที่จะ\nโดดงานเลยนะคะ"
10087-833-880-1 = "ฉันจับตาดูอยู่ข้างๆ... ขอโทษค่ะ\nเป็นเพราะฉันคอยช่วยเหลืออยู่น่ะค่ะ"
10087-833-890-1 = "ฉันเข้าใจความรู้สึกที่อยากทำอย่างอื่น\nก่อนจะทำเรื่องที่อยู่ตรงหน้าค่ะ"
10087-833-900-1 = "แต่เรื่องแบบนั้น\nเอาไว้ทำหลังจากงานจบ"
10087-833-910-1 = "เข้าใจไหมคะ...?"
10087-833-920-1 = "หืม~ ไม่ธรรมดาเลยนะคะ"
10087-833-930-1 = "ค่ะ ฉันมีค่าตอบแทนจากงาน\nอย่างสมน้ำสมเนื้อเลย มันแน่อยู่แล้วค่ะ"
10087-833-940-1 = "อะไรกัน...!\nจัดการได้ในรวดเดียวเลยเหรอคะ?"
10087-833-950-1 = "เอ๋... พูดตามตรงว่าประทับใจเลยค่ะ\nสมกับที่เป็นคุณครูเลย"
