[translation]
20050-850-280-1 = "老師！這邊這邊～！"
20050-850-290-1 = "總覺得事情變得\n亂七八糟的呢……"
20050-850-300-1 = "算了，盡力試試看吧！"
20050-850-310-1 = "這種委託雖然是\n第一次接……"
20050-850-320-1 = "如果是美代醬的作戰，\n一定沒問題的！"
20050-850-330-1 = "這次的委託……\n好像還挺有趣的？"
20050-850-340-1 = "呀啊～\n結束了結束了～"
20050-850-350-1 = "……咦？\n大家都累癱了？"
20050-850-360-1 = "嗯，老師？\n我的臉上是\n沾到粉了嗎？"
20050-850-370-1 = "啊哈！哈哈哈！"
20050-850-370-2 = "真是的～！\n那樣戳我的話……\n就換我反擊啦～！"
20050-850-380-1 = "大，大家……\n別那麼灰心嘛～"
20050-850-390-1 = "面臨任何危機都沒問題！\n特殊交易部……"
20050-850-400-1 = "總是能夠找到出路的唷！"
20050-850-600-1 = "有好多有趣的事唷～！\n嘿嘿，期待一下吧，老師！"
20050-850-610-1 = "雖然會碰上困難，\n但沒有什麼是不可能的～！"
20050-850-620-1 = "好厲害～！\n老師什麼都能做到耶～！"
20050-850-630-1 = "獎勵可不能忘記唷～"
20050-850-640-1 = "嗯？怎麼了？"
20050-850-650-1 = "雖然辛苦，但是很開心？\n耶嘿嘿，跟我一樣呢！"
