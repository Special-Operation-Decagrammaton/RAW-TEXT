[translation]
20050-10850-280-1 = "先生！こっちこっち～！"
20050-10850-290-1 = "なんだか話がごちゃごちゃ\nしちゃってるね……"
20050-10850-300-1 = "ま、やるだけ\nやってみるよ！"
20050-10850-310-1 = "こういう依頼は\n初めてだけど……"
20050-10850-320-1 = "ミヨちゃんの作戦なら、\nきっと大丈夫！"
20050-10850-330-1 = "今回の依頼……\n割と面白いかも？"
20050-10850-340-1 = "ひゃあ～\n終わった終わった～"
20050-10850-350-1 = "……あれ？\nみんなヘロヘロ？"
20050-10850-360-1 = "ん、先生？\nボクの顔、\n粉でもついてる？"
20050-10850-370-1 = "あは！あははっ！"
20050-10850-370-2 = "も～！そんなに\nつっつくなら\n……お返しだ～っ！"
20050-10850-380-1 = "み、みんな、\nどんよりしないで～……。"
20050-10850-390-1 = "どんなピンチでも大丈夫！\n特殊交易部は……"
20050-10850-400-1 = "いつだって、\n抜け道を\n見つけ出すんだよ！"
20050-10850-600-1 = "楽しいことが\nいっぱいだよ～！\nへへ、期待しててね先生！"
20050-10850-610-1 = "難しいことはあっても、\n不可能はな～い！"
20050-10850-620-1 = "すっご～い！\n先生、\nなんでもできるんだね～！"
20050-10850-630-1 = "ご褒美は\n忘れちゃダメだよ～"
20050-10850-640-1 = "うん？どしたの？"
20050-10850-650-1 = "大変だったけど、\n楽しかった？\nえへへ、ボクと一緒だねっ！"
