[translation]
20050-850-280-1 = "Welcome, Sensei! This way!!"
20050-850-290-1 = "Feels like there's something complicated going on..."
20050-850-300-1 = "But, well, I guess I'll face it!"
20050-850-310-1 = "It's my first time accepting a commission like this..."
20050-850-320-1 = "Well, I guess Miyo will come up with an amazing plan, right?"
20050-850-330-1 = "I guess we might've accepted an odd, but interesting, commission...?"
20050-850-340-1 = "It's over!"
20050-850-350-1 = "Hm? Why does everyone look so tired?"
20050-850-360-1 = "What, Sensei? Is there stone dust or something on my face?"
20050-850-370-1 = "Ahaha!"
20050-850-370-2 = "If you keep poking me, I'll poke you too, okay?"
20050-850-380-1 = "I-I think it's okay for everyone to relax a little..."
20050-850-390-1 = "Don't worry! The Free Trade Cartel..."
20050-850-400-1 = "...always finds a way!"
20050-850-600-1 = "We have loooooots of fun things prepared for you, Sensei!"
20050-850-610-1 = "Nothing's impossible! It might be hard, though!"
20050-850-620-1 = "As expected, Sensei! You're amazing!"
20050-850-630-1 = "Did you get your rewards? Don't forget to take them with you!"
20050-850-640-1 = "Hm? Is there anything you want to know?"
20050-850-650-1 = "It was hard, but fun? Heehee, I feel the same way, Sensei."
