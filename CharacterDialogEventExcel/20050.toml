[translation]
20050-850-280-1 = "เชิญเลย คุณครู!\nทางนี้!!"
20050-850-290-1 = "เหมือนจะเกิดเรื่อง\nซับซ้อนเลยนะ..."
20050-850-300-1 = "เอาเป็นว่า\nลองดูสักตั้งก่อนแล้วกัน!"
20050-850-310-1 = "งานแบบนี้\nเป็นครั้งแรกเลยละ..."
20050-850-320-1 = "แต่มิโยะจังก็น่าจะ\nวางแผนให้อย่างดีละเนอะ?"
20050-850-330-1 = "พวกเราเหมือนจะรับ\nงานบางอย่างที่ทั้งแปลก\nแต่ก็สนุกมาเลยละ...?"
20050-850-340-1 = "เสร็จแล้ว~"
20050-850-350-1 = "หืม? แต่ทำไมถึงอ่อนเปลี้ย\nเพลียแรงกันหมดเลยล่ะ?"
20050-850-360-1 = "ทำไมเหรอ คุณครู?\nหน้าของฉัน\nมีฝุ่นจากหินติดอยู่เหรอ?"
20050-850-370-1 = "อะฮะฮ่า!"
20050-850-370-2 = "ถ้าจิ้มกันบ่อยๆ\nเดี๋ยวฉันจิ้มคืนบ้างนะ?"
20050-850-380-1 = "ทะ... ทุกคนไม่ต้อง\nเครียดกันมากก็ได้นะ..."
20050-850-390-1 = "ไม่เป็นไร!\nชมรมการค้าพิเศษ"
20050-850-400-1 = "คิดหาวิธีได้\nได้ตลอดละ!"
20050-850-600-1 = "มีงานสนุกๆ เตรียมไว้\nเพียบ~ เลยละ คุณครู"
20050-850-610-1 = "ไม่มีอะไรที่เป็นไปไม่ได้หรอก!\nถึงมันจะยากก็เถอะ!"
20050-850-620-1 = "สมกับที่เป็นคุณครูเลย!\nสุดยอด!"
20050-850-630-1 = "รับรางวัลไปหรือยัง?\nอย่าลืมเสียล่ะ รับไปด้วยนะ!"
20050-850-640-1 = "หืม?\nสงสัยอะไรตรงไหนเหรอ?"
20050-850-650-1 = "ถึงจะเหนื่อย แต่ก็สนุกงั้นเหรอ?\nแหะๆ ฉันก็ด้วยนะ คุณครู"
