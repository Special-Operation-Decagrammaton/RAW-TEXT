[translation]
26015-848-840-1 = "อ่า~ รู้สึกสังหรณ์ใจ\nไม่ค่อยดีเลยค่ะ~"
26015-848-850-1 = "แต่ก็เอาเถอะ\nในเมื่อคุณครูอยู่ด้วย"
26015-848-860-1 = "งั้นก็คงคลี่คลาย\nไปได้ด้วยดีละนะคะ~"
26015-848-870-1 = "ทะเล... ทะเล\nไม่คิดเลยนะคะว่า\nจะได้มาด้วยเหตุผลนี้"
26015-848-880-1 = "เราไม่รู้เลยนะคะ\nว่าชีวิตจะเป็นยังไงบ้าง~"
26015-848-890-1 = "คุณมิกะ..."
26015-848-900-1 = "เป็นคนที่แตกต่างจาก\nที่ฉันคิดไว้เยอะเลยค่ะ"
26015-848-910-1 = "อ้อ ฉันหมายถึง\nในทางที่ดีนะคะ!"
26015-848-920-1 = "รู้สึกยังไงที่ได้มาทะเลน่ะเหรอคะ?"
26015-848-930-1 = "อืม... จะว่ายังไงดีนะ"
26015-848-940-1 = "ถ้าคิดถึงไม่กี่วันที่ผ่านมานี้\nฉันว่าฉันน่าจะไม่ชอบทะเลค่ะ\nฮ่าฮ่า!"
26015-848-950-1 = "ถึงเวลากลับแล้วสินะคะ"
26015-848-960-1 = "โล่งใจแต่ก็เสียดาย..."
26015-848-970-1 = "ซะที่ไหนล่ะคะ..."
26015-848-980-1 = "ในที่สุดก็ได้กลับบ้านแล้ว!\nงานเสร็จแล้ว!\nฉันรู้สึกแบบนี้ต่างหากค่ะ ฮ่าฮ่า!"
26015-848-990-1 = "เสียงคลื่นซัดสาด\nเสียงนกนางนวลร้อง\nกลิ่นเค็มของเกลือ..."
26015-848-1000-1 = "รู้สึกเหมือนมาถึงทะเล\nจริงๆ แล้วนะคะ"
26015-848-1010-1 = "ว้าว~ ทุกคนดู\nตื่นเต้นจังเลยนะคะ"
26015-848-1020-1 = "ฉันก็อยากสนุกได้แบบนั้น\nบ้างจังเลยค่ะ"
26015-848-1030-1 = "อ๊ะ คุณครู\nที่นี่ไม่มีปัญหาอะไรหรอกค่ะ~"
26015-848-1040-1 = "ถึงจะเป็นทะเล\nแต่การไม่มีปัญหาอะไร\nมันก็ดีที่สุดค่ะ"
26015-848-1050-1 = "เอ่อ คุณครูคะ?\nอยู่กับฉัน แต่ว่า\nดูไม่สนุกเท่าไรเลยนะคะ?"
26015-848-1060-1 = "ฉันก็... ไม่ได้ไม่ชอบ\nการที่ได้อยู่ด้วยกันหรอกนะคะ"
26015-848-1330-1 = "อ๊ะ คุณครู!\nมาช่วยฉันเหรอคะ?"
26015-848-1340-1 = "ว้าว~ ฉันกำลังคิดเลยว่าคนเดียว\nจะไหวมั้ย ขอบคุณมากนะคะ"
26015-848-1350-1 = "ฮ่าฮ่า วุ่นวายจังเลยนะคะ~"
26015-848-1360-1 = "อ๊ะ คุณครู สวัสดีค่ะ"
26015-848-1370-1 = "ขอโทษที่จู่ๆ ก็รบกวนนะคะ\nพอจะช่วยฉันหน่อยได้มั้ยคะ...?"
26015-848-1380-1 = "คิดเสียว่าช่วยชีวิตคนหนึ่งคนนะคะ!"
26015-848-1390-1 = "แหะๆ...\nงานกองเท่าภูเขาเลยนะคะ..."
26015-848-1400-1 = "ก็นะ... ถ้าทำไปทีละอย่างๆ\nเดี๋ยวก็คงทำเสร็จใช่มั้ยล่ะคะ?"
26015-848-1410-1 = "ฉันเข้าใจ...\nความรู้สึกนั้นดี~ เลยค่ะ"
26015-848-1420-1 = "ถ้ามีงานค้างเยอะมาก\nคนเราก็ย่อมลืมกันได้ค่ะ..."
26015-848-1430-1 = "จัดการได้อีกเรื่องแล้วนะคะ~\nขอบคุณที่ทำงานหนักค่ะ~"
26015-848-1440-1 = "โอ้ว~\nมีเคล็ดลับอะไรดีๆ สินะคะ"
26015-848-1450-1 = "อ่า... ฉันไม่ได้ประชดนะคะ\nฉันพูดเพราะชื่นชมจากใจจริงค่ะ"
