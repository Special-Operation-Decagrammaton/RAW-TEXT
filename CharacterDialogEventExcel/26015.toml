[translation]
26015-848-840-1 = "あ～あ……早速、\n雲行き怪しいっすね～"
26015-848-850-1 = "ま、なんとか\nなるんじゃないっすか？"
26015-848-860-1 = "先生もいるっすから。"
26015-848-870-1 = "こんな風に海に\nくることになるとは\n思わなかったっす。"
26015-848-880-1 = "何が起きるかなんて、\n分からないもんっすね～"
26015-848-890-1 = "ミカ様……"
26015-848-900-1 = "なんか思ってたのと\n違ったんすよね～"
26015-848-910-1 = "もちろん、\nいい意味で！っすよ？"
26015-848-920-1 = "海に来た感想っすか？"
26015-848-930-1 = "そうっすね……。"
26015-848-940-1 = "ちょっとだけ、海が\n嫌いになったかもっす！\nあはは！"
26015-848-950-1 = "もう帰る時間っすか。"
26015-848-960-1 = "名残惜し――"
26015-848-970-1 = "――くはないっすね。"
26015-848-980-1 = "あー！仕事終わり！\nやっと解放！って\n感じっす！"
26015-848-990-1 = "波の音に、\nカモメの鳴き声、\n潮の香り……。"
26015-848-1000-1 = "海に来てるって、\n実感が湧くっす。"
26015-848-1010-1 = "はは、みんな\n浮かれてるっすね～"
26015-848-1020-1 = "私もああやって\n楽しめたら、\nよかったんすけど。"
26015-848-1030-1 = "先生、ここは\n異常なしっす～"
26015-848-1040-1 = "やっぱ、\n何事もないのが\n一番っすよね。"
26015-848-1050-1 = "あの、先生？\n私といても、\n退屈するだけっすよ？"
26015-848-1060-1 = "私は……\n先生といられて、\n好都合っすけど。"
26015-848-1330-1 = "先生！もしかして、\n手伝いにきてくれたんすか？"
26015-848-1340-1 = "いや～ちょっと\n行き詰ってたんで……\n助かるっす～"
26015-848-1350-1 = "はは、もーめちゃくちゃ……"
26015-848-1360-1 = "あ、先生、どうもっす。"
26015-848-1370-1 = "早速で悪いんすけど、\n手伝ってもらえないっすか……？"
26015-848-1380-1 = "これも人助けだと思って！"
26015-848-1390-1 = "はぁ……\nやることてんこ盛りっすね……。"
26015-848-1400-1 = "ま、眺めてても仕方ないし、\nやってりゃいつか終わるっすよね。"
26015-848-1410-1 = "……先生の気持ち、\nよ～く分かるっす。"
26015-848-1420-1 = "山積みの仕事からは、目を\nそらしたくなるっすよね……。"
26015-848-1430-1 = "これで一個片付いたっすね～\nお疲れ様っす～"
26015-848-1440-1 = "先生って結構\n要領いいっすよね～"
26015-848-1450-1 = "あ……今のは皮肉じゃなくて、\n本心っすよ。"
