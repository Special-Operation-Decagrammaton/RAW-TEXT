[translation]
26015-848-840-1 = "Ah. I'm already getting a bad feeling."
26015-848-850-1 = "But since you're here..."
26015-848-860-1 = "...I'm sure things will work out, one way or another."
26015-848-870-1 = "The beach... I didn't expect I'd come to the beach like this."
26015-848-880-1 = "That's just how life is sometimes!"
26015-848-890-1 = "Mika..."
26015-848-900-1 = "She's not what I expected."
26015-848-910-1 = "Ah! I mean that in a good way."
26015-848-920-1 = "How do I feel about the beach?"
26015-848-930-1 = "Hmm... How should I put this?"
26015-848-940-1 = "If I think about the past few days, I don't think I've had the best impression. Haha!"
26015-848-950-1 = "It's already time to go back."
26015-848-960-1 = "That bittersweet feeling..."
26015-848-970-1 = "...I don't have it at all."
26015-848-980-1 = "I'm finally going home! Work's over! That's what I'm feeling! Haha!"
26015-848-990-1 = "The sound of waves crashing and seagulls crying, and the smell of salt..."
26015-848-1000-1 = "This really is the beach."
26015-848-1010-1 = "Oh my, everyone's very excited."
26015-848-1020-1 = "I wish I could feel the same way."
26015-848-1030-1 = "Ah, Sensei. There's not much going on right now."
26015-848-1040-1 = "Even at the beach, I'd be happiest if things were uneventful."
26015-848-1050-1 = "Um, Sensei? You know staying with me won't be that fun, right?"
26015-848-1060-1 = "Although I don't hate...being together."
26015-848-1330-1 = "Ah, Sensei! Did you come to help?"
26015-848-1340-1 = "Oh my, I was a little worried that I wouldn't be able to get it done alone. Thank you!"
26015-848-1350-1 = "Haha, what a mess."
26015-848-1360-1 = "Ah, Sensei. Hey there."
26015-848-1370-1 = "Sorry to pounce on you, but could you lend me a hand?"
26015-848-1380-1 = "You'd literally be saving my life!"
26015-848-1390-1 = "Haha... There's so much to do..."
26015-848-1400-1 = "Maybe we just have to tackle things one by one, and it'll go faster than we think!"
26015-848-1410-1 = "...I know that feeling reaaally well."
26015-848-1420-1 = "Once too much work piles up, you kinda just want to ignore it."
26015-848-1430-1 = "That's one problem solved! Good work!"
26015-848-1440-1 = "Ooh, you're quite skilled, aren't you?"
26015-848-1450-1 = "Ah... I wasn't being sarcastic! I was genuinely impressed."
