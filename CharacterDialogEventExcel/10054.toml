[translation]
10054-818-170-1 = "Sensei! Over here! The games are about to begin!"
10054-818-180-1 = "I've been waiting for you, Sensei! Shall we get going?"
10054-818-190-1 = "You've all done so much to make the festival so amazing."
10054-818-200-1 = "I'll be sure to match all your hard work!"
10054-818-210-1 = "Let's do our best until the very end!"
10054-818-220-1 = "Thank you for your hard work, Sensei!"
10054-818-230-1 = "You never know when someone might be in need of help..."
10054-818-240-1 = "Let's look around a little more."
10054-818-250-1 = "Is there anything I can do to help?"
10054-818-260-1 = "...Sensei? ...What is it?"
10054-818-270-1 = "I-If you keep calling my name like that... I'm going to get embarrassed..."
10054-818-400-1 = "Hello, Sensei. Are you looking for anything?"
10054-818-410-1 = "If it's all right with you, would you like to take a look around?"
10054-818-420-1 = "The games have concluded, but we have plenty of supplies still!"
10054-818-430-1 = "If you don't mind, could you help me organize these?"
10054-818-440-1 = "M-Me...? I was just thinking I'd like to be helpful..."
10054-818-450-1 = "I-If you keep staring at me like that... I'm going to get all flustered..."
10054-818-460-1 = "I'll get it ready immediately."
10054-818-470-1 = "Is there anything else you need?"
10054-818-480-1 = "Is that what you've settled on? Got it."
10054-818-490-1 = "It's nice to be prepared."
