[translation]
10054-818-170-1 = "先生、こちらです！\nまもなく試合が\n始まります！"
10054-818-180-1 = "お待ちしておりました、\n先生！それでは、\n参りましょう。"
10054-818-190-1 = "みなさん、\nとても頑張っていますね。"
10054-818-200-1 = "私もみなさんの\n思いに応えられるよう、\n精進します！"
10054-818-210-1 = "最後まで精一杯\n頑張りましょう。"
10054-818-220-1 = "先生、\nお疲れ様でした。"
10054-818-230-1 = "まだ助けが必要な方が\nいらっしゃるかもしれ\nませんので、"
10054-818-240-1 = "もうちょっと\n見て回りましょう。"
10054-818-250-1 = "何かお手伝いできる\n事はありますか？"
10054-818-260-1 = "……先生？\nどうかしましたか……？"
10054-818-270-1 = "そ、そんな風に\n何度も呼ばれると……\n恥ずかしいです……。"
10054-818-400-1 = "こんにちは、先生。\n何かお探しですか？"
10054-818-410-1 = "よかったらご覧になりますか？"
10054-818-420-1 = "試合は無事終わりましたが、\n商品が残ってしまいましたね。"
10054-818-430-1 = "よろしければ、お片付けを\n手伝っていただけませんか？"
10054-818-440-1 = "わ、私ですか……？\n私は……先生のお手伝いが\nできれば、と思いまして……。"
10054-818-450-1 = "ずっと見つめられると……\nその……少し、\n恥ずかしいです……。"
10054-818-460-1 = "すぐにご用意いたしますね。"
10054-818-470-1 = "他に必要なものは\nありませんか？"
10054-818-480-1 = "それになさったのですね、\nかしこまりました。"
10054-818-490-1 = "準備しておいた\n甲斐がありました。"
