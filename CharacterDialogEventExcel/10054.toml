[translation]
10054-818-170-1 = "老師，這邊！\n比賽馬上\n就要開始了！"
10054-818-180-1 = "讓您久等了，老師！\n那麼，我們走吧。"
10054-818-190-1 = "大家，\n都很努力呢。"
10054-818-200-1 = "我也會努力，\n不辜負大家的期待！"
10054-818-210-1 = "拚盡全力，\n奮戰到最後一刻吧。"
10054-818-220-1 = "老師，\n您辛苦了。"
10054-818-230-1 = "可能還有人\n需要幫助，"
10054-818-240-1 = "我們再去稍微看看吧。"
10054-818-250-1 = "有什麼我\n可以幫忙的嗎？"
10054-818-260-1 = "……老師？\n怎麼了……？"
10054-818-270-1 = "像，像這樣\n被叫這麼多次……\n好害羞……"
10054-818-400-1 = "你好，老師。\n你在找什麼呢？"
10054-818-410-1 = "可以的話，要看看嗎？"
10054-818-420-1 = "比賽順利結束了，\n但是還有剩下的商品。"
10054-818-430-1 = "如果可以的話，\n可以幫我收拾一下嗎？"
10054-818-440-1 = "我，我嗎……？\n我想說……老師如果\n需要幫忙的話……"
10054-818-450-1 = "一直被盯著看的話……\n那個……有點，\n不好意思……"
10054-818-460-1 = "馬上給您準備。"
10054-818-470-1 = "沒有需要\n其他東西了嗎？"
10054-818-480-1 = "您說那個是吧，\n知道了。"
10054-818-490-1 = "做好準備是值得的。"
10054-10818-170-1 = "老師，這邊！\n比賽馬上\n就要開始了！"
10054-10818-180-1 = "讓您久等了，老師！\n那麼，我們走吧。"
10054-10818-190-1 = "大家，\n都很努力呢。"
10054-10818-200-1 = "我也會為了\n不辜負大家的期待，\n精益求精的！"
10054-10818-210-1 = "拚盡全力，\n奮戰到最後一刻吧。"
10054-10818-220-1 = "老師，\n您辛苦了。"
10054-10818-230-1 = "可能還有人\n需要幫助，"
10054-10818-240-1 = "我們再去\n稍微看看吧。"
10054-10818-250-1 = "有什麼我\n可以幫忙的嗎？"
10054-10818-260-1 = "……老師？\n怎麼了……？"
10054-10818-270-1 = "像，像這樣\n被叫這麼多次……\n好害羞……"
10054-10818-400-1 = "您好，老師。\n在找什麼嗎？"
10054-10818-410-1 = "方便的話要不要來逛逛呢？"
10054-10818-420-1 = "比賽順利結束了，\n但是還有剩下的商品。"
10054-10818-430-1 = "如果可以的話，\n能幫我一起收拾嗎？"
10054-10818-440-1 = "我，我嗎……？\n我想說……如果能幫上\n老師的忙就好了……"
10054-10818-450-1 = "一直被盯著看的話……\n那個……有點不好意思……"
10054-10818-460-1 = "馬上為您準備。"
10054-10818-470-1 = "還有需要\n其他東西嗎？"
10054-10818-480-1 = "您要那個對吧，我知道了。"
10054-10818-490-1 = "做好準備是值得的。"
10054-900818-110-1 = "老師，這邊！\n比賽馬上\n就要開始了！"
10054-900818-120-1 = "讓您久等了，老師！\n那麼，我們走吧。"
10054-900818-130-1 = "有什麼我\n可以幫忙的嗎？"
10054-900818-140-1 = "……老師？\n怎麼了……？"
10054-900818-150-1 = "像，像這樣\n被叫這麼多次……\n好害羞……"
