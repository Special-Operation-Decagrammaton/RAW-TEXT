[translation]
10054-818-170-1 = "선생님, 이쪽이에요!\n곧 경기가 시작될\n예정이랍니다!"
10054-818-180-1 = "기다리고 있었답니다, 선생님!\n그럼, 출발하실까요?"
10054-818-190-1 = "여러분,\n정말 열심이시네요."
10054-818-200-1 = "저도 여러분의\n마음에 보답할 수\n있도록 정진하겠습니다!"
10054-818-210-1 = "마지막까지 최선을\n다하도록 해요!"
10054-818-220-1 = "선생님,\n수고하셨습니다!"
10054-818-230-1 = "도움이 필요한 사람이\n남아있을지도 모르니,"
10054-818-240-1 = "좀 더 둘러보시죠."
10054-818-250-1 = "뭔가 도와드릴 수\n있는 일이 있을까요?"
10054-818-260-1 = "……선생님?\n왜 그러세요……?"
10054-818-270-1 = "그, 그렇게\n계속 부르시면……\n부끄러워요……."
10054-818-400-1 = "안녕하세요, 선생님.\n찾으시는 게 있으신가요?"
10054-818-410-1 = "괜찮으시다면 한번\n둘러보시겠어요?"
10054-818-420-1 = "경기는 무사히 끝났지만\n상품이 남아버렸네요."
10054-818-430-1 = "괜찮으시다면, 정리를\n도와주실 수 있을까요?"
10054-818-440-1 = "저, 저요……?\n저는…… 선생님의 도움이\n되었으면 좋겠다고, 생각해서……."
10054-818-450-1 = "그렇게 계속 보시면…… 그…….\n조금 부끄러운걸요……."
10054-818-460-1 = "지금 바로 준비하겠습니다."
10054-818-470-1 = "더 필요하신\n물건은 없으신가요?"
10054-818-480-1 = "그걸로 고르셨나요?\n알겠습니다."
10054-818-490-1 = "준비해 둔 보람이 있네요."
