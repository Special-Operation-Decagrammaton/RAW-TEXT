[translation]
10054-818-170-1 = "คุณครู ทางนี้ค่ะ!\nการแข่งขันใกล้จะ\nเริ่มแล้วนะคะ!"
10054-818-180-1 = "กำลังรออยู่เลยค่ะคุณครู\nเรามาออกเดินทาง\nพร้อมกันเลยมั้ยคะ?"
10054-818-190-1 = "ทุกคนเนี่ย\nตั้งใจกันมากเลยนะคะ"
10054-818-200-1 = "ฉันจะพยายามเพื่อ\nเป็นการตอบแทน\nน้ำใจของทุกคนค่ะ!"
10054-818-210-1 = "มาพยายามให้เต็มที่\nจนถึงที่สุดกันเถอะค่ะ!"
10054-818-220-1 = "ทำได้ดีมากค่ะ\nคุณครู!"
10054-818-230-1 = "อาจจะยังมีคนที่ต้องการ\nความช่วยเหลืออยู่ก็ได้"
10054-818-240-1 = "เราไปดูรอบๆ สนาม\nกันอีกสักหน่อยเถอะค่ะ"
10054-818-250-1 = "พอจะมีอะไร\nให้ฉันช่วยบ้างไหมคะ?"
10054-818-260-1 = "คุณครูคะ...?\nทำไมทำแบบนี้ล่ะคะ...?"
10054-818-270-1 = "ถะ... ถ้าเอาแต่\nเรียกกันแบบนี้...\nฉันเขินนะคะ..."
10054-818-400-1 = "สวัสดีค่ะคุณครู\nกำลังหาอะไรอยู่รึเปล่าคะ?"
10054-818-410-1 = "ยังไงก็ลองดูให้ทั่วๆ ก่อน\nดีไหมคะ?"
10054-818-420-1 = "การแข่งขันจบลงแล้ว\nแต่ของยังเหลือเยอะเลยค่ะ"
10054-818-430-1 = "ถ้าสะดวกละก็ คุณครูช่วย\nเก็บของหน่อยได้ไหมคะ?"
10054-818-440-1 = "ฉะ.. ฉันน่ะเหรอคะ...?\nฉันคิดว่าอยากมาช่วยเหลือคุณครู..."
10054-818-450-1 = "ถะ... ถ้าจ้องกันแบบนั้นละก็...\nฉันก็แอบเขินอยู่นะคะ..."
10054-818-460-1 = "ฉันจะเตรียมให้ตอนนี้เลยค่ะ"
10054-818-470-1 = "มีของอย่างอื่น\nที่ต้องการอีกไหมคะ?"
10054-818-480-1 = "เลือกเป็นอันนี้สินะคะ\nเข้าใจแล้วค่ะ"
10054-818-490-1 = "คุ้มค่าที่เตรียมไว้เลยนะคะเนี่ย"
10054-10818-170-1 = "คุณครู ทางนี้ค่ะ!\nการแข่งขันใกล้จะ\nเริ่มแล้วนะคะ!"
