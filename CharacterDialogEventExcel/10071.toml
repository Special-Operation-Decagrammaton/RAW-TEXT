[translation]
10071-827-10-1 = "これはあくまでも事件の\n調査のための潜入作戦……\n無事に終わると\nいいのですが。"
10071-827-20-1 = "RABBIT1。\n作戦準備完了しました。\n先生、指示を。"
10071-827-30-1 = "どうやら、住民の\n皆さんの気分を害して\nしまったようです……。 "
10071-827-40-1 = "どうすれば\n良いのでしょう……。"
10071-827-50-1 = "ふふ……\n海水浴を楽しむ以上に、\n私たちSRTらしい夏に\nなりました。"
10071-827-60-1 = "お疲れ様でした、先生。"
10071-827-70-1 = "作戦のためでは\nありますが、\nせっかくの海ですし……。"
10071-827-80-1 = "……少し、\nお時間いただけますか？"
10071-827-90-1 = "最後にエビがたっぷり\n入ったサンドイッチを\n食べたのは、\nいつだったのでしょう。"
10071-827-100-1 = "（あまり、\n浮かれている感じに\n見えませんように……）"
10071-827-110-1 = "不在の間、\nぴょんこのお世話は、"
10071-827-120-1 = "ヴァルキューレ\n生活安全局の\n皆さんに\nお願いしています。"
10071-827-130-1 = "たまに、ぴょんこが\nRABBIT小隊より"
10071-827-140-1 = "生活安全局の皆さんに\n懐いているように見えて、\n少し寂しくも\nありますが……"
10071-827-530-1 = "来てくれましたか、先生。\n調査に必要なリストを\nまとめてみました。"
10071-827-540-1 = "……以上が、今日の潜入作戦の\nターゲットになります。"
10071-827-550-1 = "どうされましたか？"
10071-827-560-1 = "あの……この水着、\n生地が少し薄くて……。"
10071-827-570-1 = "その……\nそんなに見つめられると……\n気になってしまうのですが……。"
10071-827-580-1 = "さすがです、先生。\n信じていました。"
10071-827-590-1 = "ご協力、\nありがとうございました。\n助かりました。"
