[translation]
10071-827-10-1 = "Today's mission is to infiltrate and investigate... I hope we don't run into any trouble."
10071-827-20-1 = "RABBIT 1, preparations completed. Sensei, your orders, please."
10071-827-30-1 = "I'm afraid I've upset the town residents..."
10071-827-40-1 = "What should I do?"
10071-827-50-1 = "Heehee... We really did this summer in full SRT-style, didn't we? It was more fun than a simple beach vacation, in a lot of ways."
10071-827-60-1 = "Great job, Sensei."
10071-827-70-1 = "I know we're here on a mission, but we are at the beach after all..."
10071-827-80-1 = "...Do you have some time for us?"
10071-827-90-1 = "When was the last time I had a shrimp sandwich...?"
10071-827-100-1 = "(I shouldn't look too excited...)"
10071-827-110-1 = "I've made arrangements for our absence."
10071-827-120-1 = "The students at the Valkyrie Public Safety Bureau will be watching Bun Bun while we're gone."
10071-827-130-1 = "I have to admit, I get a little jealous sometimes..."
10071-827-140-1 = "It's just that... Bun Bun seems to like the Public Safety Bureau students more than us sometimes."
10071-827-530-1 = "Welcome, Sensei. I've organized a list of things we'll need for the investigation."
10071-827-540-1 = "...This is the target for today's undercover operation."
10071-827-550-1 = "Yes. H-How can I help you?"
10071-827-560-1 = "Um... The fabric of this swimsuit is somewhat thin..."
10071-827-570-1 = "I-If you look at me like that... I don't know what to say..."
10071-827-580-1 = "As I'd expect, Sensei. I had faith in you."
10071-827-590-1 = "Thank you for your assistance. You were a huge help."
