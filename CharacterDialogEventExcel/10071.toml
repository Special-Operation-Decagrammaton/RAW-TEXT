[translation]
10071-827-10-1 = "นี่เป็นปฏิบัติการแฝงตัวที่\nแสนอันตราย เพื่อสืบข้อมูล\nเกี่ยวกับเหตุการณ์ที่เกิดขึ้น...\nหวังว่าจะผ่านไปได้ด้วยดีนะคะ"
10071-827-20-1 = "RABBIT 1 เตรียมพร้อม\nสำหรับออกปฏิบัติการแล้วค่ะ\nคุณครูคะ! ขอคำสั่งด้วยค่ะ!"
10071-827-30-1 = "ไม่ว่ายังไงก็ดูเหมือนว่า\nจะไปทำให้ชาวเมือง\nเสียความรู้สึกเข้าซะแล้วละค่ะ..."
10071-827-40-1 = "จะทำยังไงดีคะ...?"
10071-827-50-1 = "ฮุฮุ... แค่ได้สนุกไปกับ\nการเล่นน้ำทะเล เท่านี้ก็สมกับ\nเป็นฤดูร้อนของ SRT แล้วละค่ะ"
10071-827-60-1 = "ขอบคุณที่ทำงานอย่างหนัก\nเลยนะคะ คุณครู"
10071-827-70-1 = "ถึงจะมาที่นี่เพราะเรื่องปฏิบัติการ...\nแต่ก็อุตส่าห์ได้มาถึงทะเลทั้งที..."
10071-827-80-1 = "...ฉันขอรบกวนเวลา\nคุณครูสักหน่อยได้มั้ยคะ?"
10071-827-90-1 = "ครั้งสุดท้ายที่ได้กิน\nแซนด์วิชสอดไส้กุ้งแน่นๆ\nแบบนี้ คือเมื่อไรกันนะ..."
10071-827-100-1 = "(ไม่ควรทำตัวให้ดู\nหละหลวมแบบนี้เลยแท้ๆ...)"
10071-827-110-1 = "ตอนที่ฉันไม่อยู่\nก็เลยเอาเจ้าเปียงโกะ"
10071-827-120-1 = "ไปฝากให้ทางสำนัก\nรักษาความปลอดภัยของวัลคิรี\nช่วยดูแลแทนน่ะค่ะ"
10071-827-130-1 = "บางครั้งฉันก็รู้สึกเสียใจนิดๆ\nที่ดูเหมือนว่าเจ้าเปียงโกะ"
10071-827-140-1 = "จะชอบคนของทางสำนักรักษา\nความปลอดภัยมากกว่า\nสมาชิกกองทหาร RABBIT อีกค่ะ"
10071-827-530-1 = "เชิญค่ะคุณครู ฉันจัดเรียงรายการสิ่งของ\nที่จำเป็นสำหรับการสืบสวนไว้แล้วค่ะ"
10071-827-540-1 = "นะ...นี่คือเป้าหมาย\nของปฏิบัติการแฝงตัววันนี้ค่ะ"
10071-827-550-1 = "มีเรื่องอะไรงั้นเหรอคะ?"
10071-827-560-1 = "คือว่า... ผ้าที่ใช้ทำชุดว่ายน้ำชุดนี้\nมันค่อนข้างบางนิดหน่อย..."
10071-827-570-1 = "ถะ...ถ้าจ้องกันแบบนั้น\nมันรู้สึกน่าอึดอัดใจอยู่นะคะ..."
10071-827-580-1 = "สมกับเป็นคุณครูจริงๆ\nฉันเชื่อมือคุณครูค่ะ"
10071-827-590-1 = "ขอบคุณที่ช่วยค่ะ คุณครูช่วย\nพวกเราได้มากเลยค่ะ"
10071-10827-10-1 = "นี่เป็นปฏิบัติการแฝงตัวที่\nแสนอันตราย เพื่อสืบข้อมูล\nเกี่ยวกับเหตุการณ์ที่เกิดขึ้น...\nหวังว่าจะผ่านไปได้ด้วยดีนะคะ"
