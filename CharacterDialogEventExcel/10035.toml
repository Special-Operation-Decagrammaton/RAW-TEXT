[translation]
10035-812-10-1 = "อ่า... คะ...คุณครู..."
10035-812-20-1 = "กะ... กำลังรออยู่เลยค่ะ..."
10035-812-30-1 = "มาแล้วเหรอคะ คุณครู..."
10035-812-40-1 = "จะ...เจอกันที่นี่อีกแล้วนะคะ"
10035-812-50-1 = "ตะ...ตอนนี้ก็ผ่านไป\nครึ่งทางแล้วนะคะ..."
10035-812-60-1 = "รู้สึกเหมือน..."
10035-812-70-1 = "ไม่มีอะไรหรอกค่ะ \nไม่ต้องใส่ใจหรอกค่ะ"
10035-812-80-1 = "ตอนนี้เหลือเวลาอีก\nไม่มากแล้วนะคะ..."
10035-812-90-1 = "ฮือ..."
10035-812-100-1 = "ถ้าได้เจอกันต่อไปเรื่อยๆ\nแบบนี้ก็คงดีนะคะ"
10035-812-110-1 = "เอ่อ... คะ...ค่ะ...\nเรียกฉันเหรอคะ...?"
10035-812-120-1 = "คุณครูมีอะไรจะพูดรึเปล่าคะ?"
10035-812-130-1 = "เฮือกกก...!?"
10035-812-140-1 = "คือว่า... คุณครูคะ...\nฉันว่าตอนนี้เป็นเวลาดี\nที่จะเริ่มได้แล้วนะคะ..."
10035-812-150-1 = "คือว่า... คุณครู...\nมีอะไรจะพูดกับฉันรึเปล่าคะ...?"
10035-812-370-1 = "ฉันจัดเตรียมรายการ\nงานที่ต้องทำไว้ให้แล้วค่ะ"
10035-812-380-1 = "อยู่ทางนี้ค่ะ นี่เป็นงานที่รบกวน\nให้คุณครูช่วยทำให้ค่ะ..."
10035-812-390-1 = "หืม...? คุณครู...?"
10035-812-400-1 = "เปล่าค่ะ... ไม่เป็นไรค่ะ..."
10035-812-410-1 = "ช่วยกันจัดเตรียมรายการสองคน\nแบบนี้ก็สนุกดีนะคะ..."
10035-812-420-1 = "อ๊ะ... ค่ะ\nจัดการได้เรียบร้อยแล้วค่ะ..."
10035-812-430-1 = "อย่างนั้นเองเหรอคะ...\nค่ะ ฉันจะตรวจสอบเอาไว้ค่ะ..."
10035-812-440-1 = "งะ...งานวันนี้...\nเสร็จสิ้นเพียงเท่านี้ค่ะ...\nขอบคุณนะคะคุณครู..."
