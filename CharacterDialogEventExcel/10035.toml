[translation]
10035-812-10-1 = "啊，老，老師……"
10035-812-20-1 = "我，我一直在等你……"
10035-812-30-1 = "你來啦，老師……"
10035-812-40-1 = "沒，沒想到\n還能再見面……"
10035-812-50-1 = "時間也只剩下\n一半了啊……"
10035-812-60-1 = "感覺有點……"
10035-812-70-1 = "沒什麼，\n請別在意。"
10035-812-80-1 = "沒剩多少了呢……"
10035-812-90-1 = "呼……"
10035-812-100-1 = "要是能一直像這樣……\n待在身邊的話……"
10035-812-110-1 = "啊，是，是的……\n你叫我嗎……？"
10035-812-120-1 = "怎，怎麼了嗎……？"
10035-812-130-1 = "噫……！？"
10035-812-140-1 = "那個……老師……\n差不多……\n該行動了……"
10035-812-150-1 = "那個……難道，\n找我有什麼事……？"
10035-812-370-1 = "我，我試著整理了\n待辦清單……"
10035-812-380-1 = "就，就是這些。\n麻煩老師了……"
10035-812-390-1 = "老，老師？\n這是，什麼意思……？"
10035-812-400-1 = "啊，沒什麼，\n請別在意……"
10035-812-410-1 = "就，就算只是像這樣\n兩個人一起確認清單……\n總覺得，也很愉快呢……"
10035-812-420-1 = "啊，辛苦了……\n總算是順利解決了呢。"
10035-812-430-1 = "啊，這樣啊……\n那麼，我會去確認的。\n辛苦你了。"
10035-812-440-1 = "今，今天的工作，\n這樣就結束……了呢。\n謝，謝謝你，老師。"
