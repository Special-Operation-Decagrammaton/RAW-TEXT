[translation]
10035-812-10-1 = "Oh... S-Sensei."
10035-812-20-1 = "I've been waiting."
10035-812-30-1 = "You're here, Sensei..."
10035-812-40-1 = "W-We meet again..."
10035-812-50-1 = "Already halfway done..."
10035-812-60-1 = "It's a little..."
10035-812-70-1 = "It's nothing. Please don't worry about it..."
10035-812-80-1 = "We don't have much time left..."
10035-812-90-1 = "Hmm..."
10035-812-100-1 = "I wish I could always...see you like this."
10035-812-110-1 = "Ah, y-yes... Did you call me...?"
10035-812-120-1 = "Were you trying to say something...?"
10035-812-130-1 = "Eeek?!"
10035-812-140-1 = "Um... Sensei... We should...get started..."
10035-812-150-1 = "Um... Is there anything you want to tell me?"
10035-812-370-1 = "I've made a list of your tasks..."
10035-812-380-1 = "This way. These are the things I need your help with..."
10035-812-390-1 = "Hmm...? Sensei..."
10035-812-400-1 = "It's okay... No worries..."
10035-812-410-1 = "It's nice to organize the list with you like this..."
10035-812-420-1 = "Oh... Yes. It all worked out."
10035-812-430-1 = "I see... Yes, I'll check."
10035-812-440-1 = "Th-This is all we have today. Thank you, Sensei..."
