[translation]
10035-812-10-1 = "아. 서, 선생님……."
10035-812-20-1 = "기, 기다리고\n있었어요……."
10035-812-30-1 = "오셨군요, 선생님……."
10035-812-40-1 = "또, 또 만났네요……."
10035-812-50-1 = "벌써 기간도\n절반쯤 지나갔네요……."
10035-812-60-1 = "뭔가 조금……."
10035-812-70-1 = "아니에요.\n신경 쓰지 마세요……."
10035-812-80-1 = "이제 얼마\n안 남았네요……."
10035-812-90-1 = "흐으……."
10035-812-100-1 = "계속 이렇게…….\n있을 수 있다면……."
10035-812-110-1 = "아, 네, 네…….\n부르셨어요……?"
10035-812-120-1 = "뭐, 뭔가 하실\n말씀이라도……?"
10035-812-130-1 = "히에엑……!?"
10035-812-140-1 = "저……. 선생님…….\n슬슬……. 시작\n하시는 게……."
10035-812-150-1 = "저……. 혹시 저한테\n하실 말씀이라도……?"
10035-812-370-1 = "하실 일들의 리스트를\n정리해 보았습니다……."
10035-812-380-1 = "이쪽이에요.\n선생님께 부탁드릴 일들입니다……."
10035-812-390-1 = "음……? 선생님……."
10035-812-400-1 = "아니에요……. 괜찮습니다……."
10035-812-410-1 = "이렇게 둘이서 리스트를\n정리하는 것도 즐겁네요……."
10035-812-420-1 = "아……. 네.\n잘 해결됐습니다……."
10035-812-430-1 = "그렇군요…….\n네. 체크해 둘 게요……."
10035-812-440-1 = "오, 오늘 일은…….\n여기서 끝났습니다…….\n감사합니다, 선생님……."
