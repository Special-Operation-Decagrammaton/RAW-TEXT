[translation]
10035-812-10-1 = "あ、せ、先生……。"
10035-812-20-1 = "お、お待ちして\nおりました……。"
10035-812-30-1 = "いらっしゃいましたか、\n先生……。"
10035-812-40-1 = "ま、またお会い\nできるとは……。"
10035-812-50-1 = "もう期間も\n残り半分ですか……。"
10035-812-60-1 = "何だか少し……"
10035-812-70-1 = "いえ、\n気にしないでください。"
10035-812-80-1 = "あと少し、ですね……"
10035-812-90-1 = "ふぅ……。"
10035-812-100-1 = "ずっとこうやって……\n傍にいられたら……。"
10035-812-110-1 = "あっ、は、はい……\nお呼びでしょうか？"
10035-812-120-1 = "ど、どうかされましたか\n……？"
10035-812-130-1 = "ひぇっ……！？"
10035-812-140-1 = "あの……先生……。\nそろそろ……\n動かれた方が……？"
10035-812-150-1 = "えっと……\nもしかして私に、\n何かご用事が……？"
10035-812-370-1 = "や、やることリストを\nまとめてみました……。"
10035-812-380-1 = "こ、こちらです。先生には、\nお手数をおかけしますが……。"
10035-812-390-1 = "せ、先生？\nこれは、どういう……？"
10035-812-400-1 = "あ、いえ、\nお気になさらず……。"
10035-812-410-1 = "こ、こうやってただ、\nふたりでリストを確認しているだけで……\n何だか、楽しいですね……。"
10035-812-420-1 = "あ、お疲れ様です……\n何とか上手くいったようですね。"
10035-812-430-1 = "あ、そうでしたか……\nでは、チェックしておきますね。\nお疲れ様でした。"
10035-812-440-1 = "きょ、今日の分は、\nこれで終わり……ですね。\nあ、ありがとうございました、先生。"
