[translation]
10021-803-10-1 = "夏…海…。"
10021-803-20-1 = "…ん？な、何で\nそんなにこっちを\n見てるんだ…。"
10021-803-30-1 = "おかえり、先生。\nやるべきことがまだまだ\nたくさんあるよ。"
10021-803-40-1 = "この水着、\n可愛い…ふふっ…"
10021-803-50-1 = "せ、先生…？\nいつから見てた…？"
10021-803-60-1 = "み、見ないで…\nこういうの、\n慣れてないから…"
10021-803-70-1 = "その…\nや、やっぱり\n何でもない…\n気にしないで。"
