[translation]
10021-803-10-1 = "바다….\n여름…."
10021-803-20-1 = "으, 응? 뭐야.\n뭘 보는 거야…"
10021-803-30-1 = "어서 와, 선생님.\n해야 할 것들이 잔뜩이야."
10021-803-40-1 = "이 수영복…\n귀여워… 후후…"
10021-803-50-1 = "…서, 선생님…?\n언제부터 보고 있었어…?"
10021-803-60-1 = "그, 그만 봐…\n이런 거,\n익숙하지 않으니까…"
10021-803-70-1 = "아, 아냐. 괜찮아…\n바, 방금 말은\n신경 쓰지 마."
