[translation]
10021-803-10-1 = "ทะเล...\nฤดูร้อน..."
10021-803-20-1 = "หืม? อะไรน่ะ?\nมองอะไรน่ะ..."
10021-803-30-1 = "เชิญเลยคุณครู\nมีเรื่องที่ต้องทำเพียบเลยล่ะ"
10021-803-40-1 = "ชุดว่ายน้ำชุดนี้...\nน่ารักจังเลย... ฮุฮุ..."
10021-803-50-1 = "คะ...คุณครู...?\nมายืนดูอยู่ตั้งแต่เมื่อไร...?"
10021-803-60-1 = "ยะ...หยุดมองได้แล้ว...\nแบบนี้... ฉันไม่ชินเท่าไรเลย..."
10021-803-70-1 = "ปะ...เปล่าหรอก ไม่เป็นไร...\nลืมที่ฉันพูดไปเมื่อกี้นี้เถอะ"
