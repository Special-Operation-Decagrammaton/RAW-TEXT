[translation]
10021-803-10-1 = "大海…\n夏天…"
10021-803-20-1 = "呃、嗯？什麼？\n你在看什麼…"
10021-803-30-1 = "老師，快點來。\n要做的事非常多。"
10021-803-40-1 = "這件泳裝…\n好可愛…呵呵…"
10021-803-50-1 = "…老、老師…？\n你從什麼時候開始看的…？"
10021-803-60-1 = "別、別看了…\n這種事，\n我並不習慣…"
10021-803-70-1 = "沒、沒有，沒關係…\n別、別在意剛才那番話。"
10021-10803-10-1 = "大海…\n夏日…"
10021-10803-20-1 = "呃、嗯？什麼？\n在看什麼…"
10021-10803-30-1 = "快來，老師。.\n要做的事情有好多呢！"
10021-10803-40-1 = "這泳裝…\n好可愛… 呵呵…"
10021-10803-50-1 = "…老、老師…？\n你是從哪時候就看到了…？"
10021-10803-60-1 = "別、別看了…\n我不習慣，\n這個樣子…"
10021-10803-70-1 = "不、不是的，沒關係…\n剛、剛剛的話別放在心上。"
10021-900803-10-1 = "大海…夏天…"
10021-900803-20-1 = "嗯…？\n為，為什麼\n要一直看我這裡…"
10021-900803-30-1 = "歡迎回來，老師。\n該做的事情還有很多哦！"
10021-900803-40-1 = "這套泳裝…\n真可愛… 呵呵…"
10021-900803-50-1 = "老，老師…？\n你從什麼時候開始看的…？"
10021-900803-60-1 = "別，別看我…\n我還不習慣\n穿成這樣…"
10021-900803-70-1 = "那個…\n果，果然\n還是算了…\n別在意。"
