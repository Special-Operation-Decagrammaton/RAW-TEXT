[translation]
10047-815-330-1 = "아, 기다리고 있었어.\n선생님."
10047-815-340-1 = "……어라? 왜 기다렸더라?"
10047-815-350-1 = "어서 오세요,\n바다의 집에~"
10047-815-360-1 = "……맞나?"
10047-815-370-1 = "다들 즐거워 보이네~\n응, 건강한 건 좋은 거야~"
10047-815-380-1 = "모두 열심히 하는 것 같네.\n그럼, 나도 힘내야지."
10047-815-390-1 = "응? 벌써 끝난 거야?\n그럼 선생님, 다 같이\n물놀이 하자?"
10047-815-400-1 = "모두 바쁜 것 같으니까….\n선생님이랑 나랑, 놀까?"
10047-815-410-1 = "그러고 보니 카호가,\n위험해지면"
10047-815-420-1 = "바로 방범용 유탄을\n쏘라고 했어."
10047-815-430-1 = "아, 실은\n열사병 대책으로……."
10047-815-440-1 = "자, 말차맛 라무네."
10047-815-450-1 = "선생님도 마실래?"
10047-815-460-1 = "선생님? 불렀어? 나도 방금,\n마음속으로 불렀는데-"
10047-815-470-1 = "우연이네~"
10047-815-580-1 = "할 일이 잔뜩이야~\n선생님도 큰일이네~?"
10047-815-590-1 = "아, 선생님. 목표 리스트……?\n라는 걸 받았어. 선생님, 갖고 싶어?"
10047-815-600-1 = "콕콕하는 것도, 일이야?\n그럼 나도 선생님한테\n콕콕 해줄게."
10047-815-610-1 = "땡땡이치면 안 돼~라고,\n아까 니야 부장이-"
10047-815-620-1 = "와아- 굉장해……!"
10047-815-630-1 = "선생님, 열심히 했네.\n착하다. 착해."
