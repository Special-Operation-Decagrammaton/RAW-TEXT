[translation]
10047-815-330-1 = "Oh, I've been waiting for you, Sensei."
10047-815-340-1 = "...Huh? Why was I waiting?"
10047-815-350-1 = "Welcome to the Beach Shack!"
10047-815-360-1 = "...How was that?"
10047-815-370-1 = "Everyone seems happy. There's nothing more important than being happy and healthy."
10047-815-380-1 = "Everyone is working hard. I should work harder, too."
10047-815-390-1 = "Huh? Is it already over? Then, Sensei, let's play in the water together."
10047-815-400-1 = "Everyone else seems busy... Why don't we play?"
10047-815-410-1 = "Come to think of it, Kaho told me that when I'm in danger..."
10047-815-420-1 = "I should just throw a grenade."
10047-815-430-1 = "I've brought you something for heatstroke prevention..."
10047-815-440-1 = "Here. Matcha Ramune."
10047-815-450-1 = "Why don't you try it?"
10047-815-460-1 = "Sensei, did you call? I was just about to call you, too."
10047-815-470-1 = "What a coincidence!"
10047-815-580-1 = "There's so much to do. It's overwhelming, right?"
10047-815-590-1 = "Oh, Sensei. I received something called...a task list. Do you want it?"
10047-815-600-1 = "Is poking people on the task list? Then I'll poke you too, Sensei."
10047-815-610-1 = "President Niya says I shouldn't slack off."
10047-815-620-1 = "Wow, amazing..."
10047-815-630-1 = "Sensei, great job. You did well."
