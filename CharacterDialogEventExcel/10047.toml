10047-10815-470-1 = "真巧呢～"
10047-10815-580-1 = "要做的事真多～\n老師也很辛苦呢～？"
10047-10815-590-1 = "啊，老師。目標清單……？\n我拿到了這個東西。\n老師，想要嗎？"
