[translation]
10047-815-330-1 = "กำลังรออยู่เลย\nคุณครู"
10047-815-340-1 = "เอ๋...? รอทำไมน่ะเหรอ?"
10047-815-350-1 = "ยินดีต้อนรับสู่\nร้านริมทะเล~"
10047-815-360-1 = "ใช่รึเปล่านะ?"
10047-815-370-1 = "ทุกคนดูสนุกกันใหญ่เลย~\nอื้อ การมีสุขภาพแข็งแรง\nคือเรื่องที่ดีที่สุด"
10047-815-380-1 = "ทุกคนพยายามกันอย่างเต็มที่เลยน้า\nถ้างั้นฉันก็ต้องพยายามด้วย"
10047-815-390-1 = "หืม? จบแล้วเหรอ?\nถ้างั้นคุณครู... เราไป\nเล่นน้ำด้วยกันมั้ย?"
10047-815-400-1 = "ทุกคนดูยุ่งกันหมด...\nคุณครูมาเล่นด้วยกัน... กับฉันมั้ย?"
10047-815-410-1 = "พอมาคิดๆ ดูแล้ว คาโฮะน่ะ\nถ้าเกิดอันตรายขึ้นมาละก็..."
10047-815-420-1 = "คงจะยิงระเบิด\nรักษาความปลอดภัยทันทีเลยละ"
10047-815-430-1 = "อ่า ที่จริงมันมีไว้\nป้องกันโรคลมแดด..."
10047-815-440-1 = "อ่ะนี่ น้ำรามูเนะรสชาเขียว"
10047-815-450-1 = "คุณครูดื่มดูมั้ย?"
10047-815-460-1 = "คุณครู? เรียกฉันเหรอ?\nเมื่อกี้ฉันเองก็...\nเรียกคุณครูอยู่ในใจเหมือนกัน-"
10047-815-470-1 = "บังเอิญจังเลยนะ~"
10047-815-580-1 = "มีงานที่ต้องทำเยอะเลย~\nคุณครูเองก็เจอปัญหาใหญ่อยู่สินะ~"
10047-815-590-1 = "อ๊ะ คุณครู ได้ของที่เรียกว่า...\nรายการเป้าหมายมาแล้ว คุณครูอยากได้ไหม?"
10047-815-600-1 = "การจิ้มๆ แบบนี้ก็เป็นงานเหรอ?\nถ้างั้นฉันจะไปจิ้มๆ คุณครูบ้างนะ"
10047-815-610-1 = "จะอู้ไม่ได้น้า~\nเมื่อกี้หัวหน้านิยะบอกมา-"
10047-815-620-1 = "ว้าว- สุดยอดเลย...!"
10047-815-630-1 = "คุณครูพยายามมากเลยนะ\nดีมาก ดีมาก~"
