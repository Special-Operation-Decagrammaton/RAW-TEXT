[translation]
10047-815-330-1 = "啊，在等你唷，\n老師～"
10047-815-340-1 = "……咦？\n為什麼在等呢？"
10047-815-350-1 = "歡迎光臨，\n歡迎來到海之家～"
10047-815-360-1 = "……這樣對嗎？"
10047-815-370-1 = "大家看起來很開心呢～\n嗯，有精神是好事"
10047-815-380-1 = "大家，似乎都在努力呢\n那，我也要加油"
10047-815-390-1 = "咦，已經結束了？\n那老師，大家一起\n玩水吧？"
10047-815-400-1 = "大家似乎很忙……\n老師和我，玩吧？"
10047-815-410-1 = "話說佳穗她，\n感覺到危險的話"
10047-815-420-1 = "要立刻發射防犯用的榴彈\n對我這麼說了"
10047-815-430-1 = "啊，其實為了預防中暑……"
10047-815-440-1 = "來，抹茶氣泡水。"
10047-815-450-1 = "老師也，喝吧？"
10047-815-460-1 = "老師，叫我嗎？\n我剛才，也在心中\n叫了老師"
10047-815-470-1 = "真巧呢"
10047-815-580-1 = "要做的事好多啊～\n老師也很辛苦呢～？"
10047-815-590-1 = "啊，老師\n目標清單……？我拿到了這樣的東西\n老師，想要嗎？"
10047-815-600-1 = "戳戳這件事，也是工作嗎？\n那，我也來戳戳老師"
10047-815-610-1 = "不可以偷懶唷～\n剛才仁耶部長她"
10047-815-620-1 = "哇啊，好厲害……！"
10047-815-630-1 = "老師，努力了呢。\n好乖好乖"
10047-10815-330-1 = "啊，在等你唷，老師～"
10047-10815-340-1 = "……咦？\n我在等什麼咧？"
10047-10815-350-1 = "歡迎光臨，\n歡迎來到海之家～"
