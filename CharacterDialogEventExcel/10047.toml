[translation]
10047-815-330-1 = "あ、待ってたよ、\n先生～"
10047-815-340-1 = "……あれ？\n何で待ってたんだっけ？"
10047-815-350-1 = "いらっしゃいませ、\nようこそ海の家へ～"
10047-815-360-1 = "……合ってる？"
10047-815-370-1 = "みんな楽しそうだね～\nうん、元気なのは良いこと"
10047-815-380-1 = "みんな、頑張ってる\nみたいだね\nじゃあ、私も頑張る"
10047-815-390-1 = "え、もう終わり？\nじゃあ先生、みんなで\n水遊びしよう？"
10047-815-400-1 = "みんな忙しそうだし……\n先生と私で、遊ぼっか？"
10047-815-410-1 = "そういえばカホが、\n危険を感じたら"
10047-815-420-1 = "すぐ防犯用の榴弾を\n撃つようにって言ってた"
10047-815-430-1 = "あ、実は熱中症対策に……"
10047-815-440-1 = "はい、抹茶ラムネ。"
10047-815-450-1 = "先生も、飲もう？"
10047-815-460-1 = "先生、呼んだ？\n私も今、心の中で\n呼んでたの"
10047-815-470-1 = "偶然だね"
10047-815-580-1 = "やることがいっぱいだ～\n先生も大変だね～？"
10047-815-590-1 = "あ、先生\n目標リスト……？っていうのを貰ったの\n先生、欲しい？"
10047-815-600-1 = "ツンツンするのも、お仕事なの？\nじゃあ、私も先生にツンツンしてあげる"
10047-815-610-1 = "サボっちゃ駄目だよ～って、\nさっきニヤ部長が"
10047-815-620-1 = "わあ、すごい……！"
10047-815-630-1 = "先生、頑張ったね。\n良い子良い子"
