[translation]
10128-850-150-1 = "我是特殊交易部的\n營業室長！若狹冬！"
10128-850-160-1 = "如果有什麼想要的東西，\n歡迎隨時找我商量。"
10128-850-170-1 = "呵，呵呵……"
10128-850-180-1 = "和平常一樣呢。\n沒有問題。"
10128-850-190-1 = "（怎麼會……？\n　到底是哪裡\n　出錯了……？）"
10128-850-200-1 = "（已經結束了？對吧？\n　果然結束了對吧！？）"
10128-850-210-1 = "呵……呵呵……\n這類的委託，\n暫時先別接了吧……"
10128-850-220-1 = "沒錯，特殊交易部的\n窗口負責人就是我。"
10128-850-230-1 = "進行接觸、承接委託，\n並讓客人滿意……"
10128-850-240-1 = "這就是我的職責。"
10128-850-250-1 = "要是沒有美代\n和律醬的支援，"
10128-850-260-1 = "我這種人\n就只是個普通的\n藝術學院生而已。"
10128-850-270-1 = "……藝術這種東西，\n其實還挺困難的呢。"
10128-850-500-1 = "庫存非常充足哦。\n還請盡情參觀選購。"
10128-850-510-1 = "找到想要的東西了嗎？"
10128-850-520-1 = "短時間內還沒問題哦。\n請慢慢參觀。"
10128-850-530-1 = "想要這裡沒有的東西……？"
10128-850-540-1 = "……那我們到那邊談吧。"
10128-850-550-1 = "哈哈！戳我也不會變便宜唷？"
10128-850-560-1 = "不愧是老師。\n眼光真不錯呢。"
10128-850-570-1 = "那個，是我最推薦的商品。"
10128-850-580-1 = "商品無法退換貨。\n敬請見諒。"
10128-850-590-1 = "好選擇。\n需要幫你包裝嗎？"
