[translation]
10128-850-150-1 = "ขอกล่าวทักทายค่ะ!\nฉันคือหัวหน้าฝ่ายธุรกิจ\nชมรมการค้าพิเศษ วากาสะ ฟุยุค่ะ!"
10128-850-160-1 = "ถ้าต้องการของอะไร\nก็มาสอบถามได้\nไม่ต้องเกรงใจนะคะ"
10128-850-170-1 = "ฮุ... ฮุฮุ... ฮุ..."
10128-850-180-1 = "งะ... งานแค่นี้น่ะ\nฉันรับมือไหว\nอยู่แล้วค่ะ"
10128-850-190-1 = "(ทำไมเป็นแบบนี้ล่ะ?\nทำอะไรผิดเนี่ย?)"
10128-850-200-1 = "(นี่มันพังแล้วใช่มั้ยคะ?\nใช่มั้ยคะ?\nใช่ใช่มั้ยคะ?!)"
10128-850-210-1 = "ฮุ... ฮุฮุ...\nคงต้องหลีกเลี่ยง\nงานแบบนี้ไปสักพักแล้วละค่ะ..."
10128-850-220-1 = "ค่ะ ใช่แล้วค่ะ\nฉันคือหน้าตา\nของชมรมเองค่ะ"
10128-850-230-1 = "แอบนัดพบ รับงาน\nแล้วก็เจรจากับลูกค้า..."
10128-850-240-1 = "ค่ะ นั่นคือ\nหน้าที่ของฉันค่ะ"
10128-850-250-1 = "แน่นอนว่าถ้าไม่มีการซัพพอร์ต\nจากมิโยะและริตสึจัง"
10128-850-260-1 = "ฉันก็คงเป็นแค่\nนักเรียนโรงเรียนศิลปะ\nธรรมดาๆ คนหนึ่งค่ะ"
10128-850-270-1 = "ศิลปะเป็นสิ่งที่...\nไม่ง่ายเลยนะคะ"
10128-850-500-1 = "มีเวลาและสินค้าในสต๊อก\nเหลือเฟือเลยค่ะ\nค่อยๆ ดูได้เลยนะคะ"
10128-850-510-1 = "มีของที่หาอยู่หรือเปล่าคะ?"
10128-850-520-1 = "ยังเหลือเวลาอีกหน่อย\nจนกว่าจะปิดร้านค่ะ\nค่อยๆ เลือกของดูนะคะ"
10128-850-530-1 = "มีของอื่นที่อยากได้\nต่างหากงั้นเหรอคะ?"
10128-850-540-1 = "งั้นมาบอกฉัน\nทางนี้สิคะ..."
10128-850-550-1 = "ฮะฮ่า! ถะ... ถึงจะจิ้มกันแบบนั้น\nแต่ก็ไม่ลดราคาให้หรอกนะคะ"
10128-850-560-1 = "สายตาเฉียบคมมากเลยค่ะ"
10128-850-570-1 = "ฉันก็เล็งสินค้านั้น\nอยู่เหมือนกันค่ะ"
10128-850-580-1 = "เปลี่ยนของและขอคืนเงิน\nไม่ได้นะคะ?"
10128-850-590-1 = "เลือกได้ยอดเยี่ยมเลยค่ะ\nอยากให้ห่อสินค้าให้ด้วยมั้ยคะ?"
