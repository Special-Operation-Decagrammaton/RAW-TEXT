[translation]
10128-10850-150-1 = "特殊交易部の営業室長！\n若狭フユです！"
10128-10850-160-1 = "なにか欲しいものが\nありましたら、お気軽に\nご相談ください。"
10128-10850-170-1 = "ふ、ふふ……"
10128-10850-180-1 = "いつも通りですね。\n問題ありません。"
10128-10850-190-1 = "（どうして……？\nどこで間違え\nちゃったの……？）"
10128-10850-200-1 = "（もう終わり？\nそうだよね？\nやっぱ終わりだよね！？）"
10128-10850-210-1 = "ふ……ふふ……\nこの手の依頼、しばらくは\nやめとこうかな……。"
10128-10850-220-1 = "ええ、特殊交易部の\n窓口担当は私です。"
10128-10850-230-1 = "接触し、依頼につなげて、\nお客様に満足を\n提供する……。"
10128-10850-240-1 = "それが、私の役割です。"
10128-10850-250-1 = "ミヨとリッちゃんの\nサポートがなかったら、"
10128-10850-260-1 = "私なんて\nただの一芸術学院生に\nすぎませんから。"
10128-10850-270-1 = "……芸術って、\n難しいんですよね。"
10128-10850-500-1 = "在庫は十分ありますよ。\nどうぞ、心ゆくまで\n見て行ってください。"
10128-10850-510-1 = "欲しいものは\n見つかりましたか？"
10128-10850-520-1 = "まだしばらくは\n大丈夫ですよ。\nごゆっくりどうぞ。"
10128-10850-530-1 = "ここには無いものが\n欲しい……？"
10128-10850-540-1 = "……お話はあちらで\n伺いましょうか。"
10128-10850-550-1 = "ははっ！つっついても、\n安くなりませんよ？"
10128-10850-560-1 = "さすが先生。\nお目が高いですね。"
10128-10850-570-1 = "それ、私の\nイチオシなんです。"
10128-10850-580-1 = "返品交換は\nできませんので。\nご了承ください。"
10128-10850-590-1 = "ナイスチョイスです。\nこちら、お包みしますか？"
