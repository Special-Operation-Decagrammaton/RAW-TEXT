[translation]
10128-850-150-1 = "Hello! I'm Wakasa Fuyu, the Sales Manager of the Free Trade Cartel!"
10128-850-160-1 = "If there's anything you need, please feel free to contact me."
10128-850-170-1 = "Fu, fufu, fu..."
10128-850-180-1 = "I-I can easily handle something like this, you know?"
10128-850-190-1 = "(How did things end up this way? What did I do wrong?)"
10128-850-200-1 = "(This is doomed, right? Right? Really is, right?!)"
10128-850-210-1 = "Fu... Fufu... I should avoid commissions like this one for a while..."
10128-850-220-1 = "Yes, you're right. I am the face of our club."
10128-850-230-1 = "Going to meetings, taking commissions, handling customers..."
10128-850-240-1 = "Yes, that is my role."
10128-850-250-1 = "Of course, without support from Miyo or Ritsu..."
10128-850-260-1 = "...I would've been just an ordinary art student."
10128-850-270-1 = "...Art really isn't easy at all."
10128-850-500-1 = "We're still open and have plenty of stock. Please take your time."
10128-850-510-1 = "Is there anything you're looking for?"
10128-850-520-1 = "The shop will stay open for a while longer. Please take your time."
10128-850-530-1 = "You have something specific you're looking for?"
10128-850-540-1 = "...We should talk about it over there."
10128-850-550-1 = "Pfft! E-Even if you poke me like that, you're not getting a discount!"
10128-850-560-1 = "You have sophisticated eyes."
10128-850-570-1 = "I also had my eyes on that product."
10128-850-580-1 = "Refunds and exchanges would be difficult, you know?"
10128-850-590-1 = "That's a great choice. Do you need it wrapped, by any chance?"
