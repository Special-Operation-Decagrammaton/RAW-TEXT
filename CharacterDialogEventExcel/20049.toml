[translation]
20049-838-860-1 = "あ、来たんだ。\nあー……まあ、\nそれなりに楽しんでるよ。"
20049-838-870-1 = "海って、\nこういう\nところなんだ……。"
20049-838-880-1 = "はあ……\n静かに過ごしたい。"
20049-838-890-1 = "なんとかしてよ、先生。"
20049-838-900-1 = "何、この人混み……。\n危険はないみたいだけど。"
20049-838-910-1 = "もう終わりなんだ……。\n……うん、たしかに\n悪くなかった。\n認めるよ。今回だけね。"
20049-838-920-1 = "なに？"
20049-838-930-1 = "先生がなんと言おうと\n楽しむつもりはないよ。"
20049-838-940-1 = "（……いつもより、\n新鮮かも）"
20049-838-950-1 = "な、なに？\nなんで突っついたの？\n私、ぬいぐるみじゃ\nないんだけど……！"
20049-838-960-1 = "……暇なの？\nステージでも\n見てきたら？"
20049-838-970-1 = "私？興味ないけど……\nまあ、先生が\n行きたいなら。"
20049-838-980-1 = "付き合ってあげるよ。"
