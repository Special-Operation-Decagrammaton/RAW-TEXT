[translation]
10030-808-130-1 = "是，準備已經完成了。"
10030-808-140-1 = "支援請交給我吧。"
10030-808-150-1 = "或許差不多到了該盡\n最後努力的時機了呢，老師。"
10030-808-160-1 = "要進行最後衝刺對吧，\n我會幫忙的。"
10030-808-170-1 = "善後工作\n和事前準備一樣重要。"
10030-808-180-1 = "老，老師……！？\n請，請專注\n在工作上……！"
10030-808-190-1 = "在這裡度過沒有意義\n的時間，有點那個……"
10030-808-200-1 = "沒，沒有，雖然\n我並不討厭……"
10030-808-210-1 = "請問我該\n幫忙什麼呢，老師？"
10030-808-220-1 = "請，請別開玩笑了……"
