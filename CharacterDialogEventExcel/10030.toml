[translation]
10030-808-130-1 = "네, 준비는 끝났습니다."
10030-808-140-1 = "서포트는 맡겨주세요."
10030-808-150-1 = "슬슬 속도를 내야 할\n때네요, 선생님."
10030-808-160-1 = "라스트 스퍼트군요.\n돕겠습니다."
10030-808-170-1 = "뒷정리도 준비만큼\n중요하니까요."
10030-808-180-1 = "선생님……?\n어, 업무에\n집중해 주세요……!"
10030-808-190-1 = "여기서 무의미하게\n시간을 보내는 건……."
10030-808-200-1 = "아, 아뇨.\n싫어하지는\n않습니다만……."
10030-808-210-1 = "무엇을 도와드리면\n될까요, 선생님?"
10030-808-220-1 = "노, 농담은\n그만둬 주세요……."
