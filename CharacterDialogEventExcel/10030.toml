[translation]
10030-808-130-1 = "ค่ะ ฉันเตรียมพร้อมแล้วละค่ะ"
10030-808-140-1 = "ไว้ใจเรื่องการสนับสนุนได้เลยค่ะ"
10030-808-150-1 = "คุณครู ได้เวลาค่อยๆ\nเพิ่มความเร็วแล้วนะคะ"
10030-808-160-1 = "จุดสุดท้ายแล้วค่ะ\nเดี๋ยวฉันจะช่วยเองค่ะ"
10030-808-170-1 = "การเก็บกวาดหลังเสร็จงาน\nก็เป็นเรื่องสำคัญเหมือนกันนะคะ"
10030-808-180-1 = "คุณครู...?\nชะ...ช่วยตั้งใจ\nกับภารกิจด้วยค่ะ...!"
10030-808-190-1 = "ที่มาใช้เวลาเอื่อยเฉื่อย\nอยู่ที่นี่แบบนี้..."
10030-808-200-1 = "ปะ...เปล่าค่ะ\nฉันก็ไม่ได้ไม่ชอบหรอกค่ะ..."
10030-808-210-1 = "ให้ฉันช่วยเรื่องอะไรดีคะ\nคุณครู?"
10030-808-220-1 = "หยุดพูดล้อเล่น\nเถอะค่ะ คุณครู..."
