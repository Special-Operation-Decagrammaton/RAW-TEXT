[translation]
10030-808-130-1 = "はい、準備は\nできています。"
10030-808-140-1 = "サポートは\nお任せください。"
10030-808-150-1 = "そろそろ追い込みをかけても\n良いタイミングかも\nしれませんね、先生。"
10030-808-160-1 = "ラストスパートですね、\nお手伝いしますよ。"
10030-808-170-1 = "後片付けは、\n準備と同じくらい\n大切ですからね。"
10030-808-180-1 = "せ、先生……！？\nぎょ、業務に\n集中してください……！"
10030-808-190-1 = "ここで無意味に時間を\n過ごすのは、その……"
10030-808-200-1 = "い、いえ、私は嫌では\nないのですが……"
10030-808-210-1 = "何をお手伝いすれば\nよろしいですか、先生？"
10030-808-220-1 = "じょ、冗談は\nやめてください……"
