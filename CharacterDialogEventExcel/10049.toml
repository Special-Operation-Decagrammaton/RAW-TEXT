10049-816-30-1 = "Is it going well? ...I should hope so."
10049-816-40-1 = "This should be the last spurt. Are you still okay?"
10049-816-50-1 = "Cleanup is also important. Is there something you haven't finished yet?"
10049-816-60-1 = "Huh? What's going on?"
10049-816-70-1 = "Don't worry. I'm not going anywhere."
10049-816-80-1 = "...That tickles."
10049-816-90-1 = "Ugh! Knock it off! Go do your job!"
10049-816-100-1 = "Let's see. What's gonna come out?"
10049-816-110-1 = "Okay, let's spin!"
10049-816-120-1 = "Take a look and see if there's anything else you want to exchange."
10049-816-130-1 = "Hm? Are you sure it's okay for me to spin instead?"
10049-816-140-1 = "Sensei. Look at this! Not me!"
10049-816-150-1 = "Oh... That's pretty awesome! Congratulations."
10049-816-160-1 = "Yeah. It looks like a good one."
