[translation]
10049-816-10-1 = "歡迎回來，老師。\n今天也請多指教囉。"
10049-816-20-1 = "好了，快點走吧。\n有很多事要做呢。"
10049-816-30-1 = "情況如何？\n……那就好。"
10049-816-40-1 = "差不多要\n最後衝刺了，\n還撐得住嗎？"
10049-816-50-1 = "事後收拾也很重要。\n還有什麼\n沒做完的事嗎？"
10049-816-60-1 = "嗯，怎麼了？"
10049-816-70-1 = "不用擔心，\n我哪裡都不會去哦。"
10049-816-80-1 = "……就說很癢了。"
10049-816-90-1 = "啊啊真是的，好了！\n做你該做的事！"
10049-816-100-1 = "來看看，\n會出現什麼呢？"
10049-816-110-1 = "來，\n多轉幾次吧？"
10049-816-120-1 = "好好看看，\n還有沒有什麼\n要交換的東西吧。"
10049-816-130-1 = "咦，要我代替你轉嗎？"
10049-816-140-1 = "老師，不是看我，\n要看這裡啊。"
10049-816-150-1 = "哦……真厲害，\n恭喜。"
10049-816-160-1 = "看起來挺好的呢，嗯。"
10049-816-170-1 = "啊，總覺得\n出現了什麼很厲害的東西……"
