[translation]
10049-816-10-1 = "おかえり、先生。\n今日もよろしくね。"
10049-816-20-1 = "ほら、早く行こう。\nやることが山積みだよ。"
10049-816-30-1 = "調子はどう？\n……なら良いんだけど。"
10049-816-40-1 = "そろそろ\nラストスパートかな、\n行けそう？"
10049-816-50-1 = "後片付けも大事。\n何かやり残した\nことはある？"
10049-816-60-1 = "ん、どうしたの？"
10049-816-70-1 = "心配しなくても、\nどっか行ったり\nしないよ。"
10049-816-80-1 = "……くすぐったいってば。"
10049-816-90-1 = "ああもう、ほら！\nやる事やって！"
10049-816-100-1 = "さて、何が\n出てくるのかな？"
10049-816-110-1 = "さあ、\nたくさん回そっか。"
10049-816-120-1 = "まだ交換できる\nものがないか、\nちゃんと見ておいてね。"
10049-816-130-1 = "えっ、私が代わりに\n回していいの？"
10049-816-140-1 = "先生、私じゃなくて\nこっちを見てよ。"
10049-816-150-1 = "お……すごいね、\nおめでとう"
10049-816-160-1 = "かなり良さそうだね、\nうん"
10049-816-170-1 = "あ、何か\nすごそうなものが……"
