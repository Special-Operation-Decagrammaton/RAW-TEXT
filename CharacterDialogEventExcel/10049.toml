[translation]
10049-816-10-1 = "เชิญเลยคุณครู\nวันนี้ก็ขอรบกวนด้วยนะ"
10049-816-20-1 = "เอ้า รีบไปกันเถอะ\nมีงานที่ต้องทำเยอะแยะเลยนะ"
10049-816-30-1 = "ไปได้สวยรึเปล่า?\nถ้าอย่างนั้น...\nก็ค่อยยังชั่วหน่อย"
10049-816-40-1 = "ตอนนี้ก็เหลือ\nอีกไม่กี่ที่แล้ว\nไหวอยู่ใช่มั้ย?"
10049-816-50-1 = "การเก็บกวาดก็เป็นเรื่องสำคัญ\nมีอะไรที่ยัง\nทำไม่เสร็จอีกรึเปล่าน่ะ?"
10049-816-60-1 = "หืม? ทำไมเหรอ?"
10049-816-70-1 = "ไม่ต้องห่วงหรอกน่า\nฉันไม่ได้คิดจะหนีไปไหน\nอยู่แล้วด้วย"
10049-816-80-1 = "มันจั๊กจี้นะ"
10049-816-90-1 = "โธ่เอ๊ย หยุดเถอะน่า\nไปทำงานต่อได้แล้ว!"
10049-816-100-1 = "ไหนดูซิ จะได้อะไรนะ?"
10049-816-110-1 = "ลองสุ่มดูเลยมั้ย?"
10049-816-120-1 = "ดูให้ดีๆ ด้วยล่ะ\nว่ามีอะไรที่ต้องแลกอีกรึเปล่า"
10049-816-130-1 = "อยากให้ฉัน\nสุ่มให้งั้นเหรอ?"
10049-816-140-1 = "คุณครู มองทางนี้สิ\nอย่ามัวแต่มองฉัน"
10049-816-150-1 = "โอ้... สุดยอดเลยนี่นา\nยินดีด้วยนะ"
10049-816-160-1 = "ได้ของดีเลยนี่นา\nอื้อ"
10049-816-170-1 = "อ๊ะ เหมือนจะได้อะไร\nที่สุดยอดมากๆ มาด้วยนะ..."
