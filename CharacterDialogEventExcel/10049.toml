[translation]
10049-816-10-1 = "어서 와, 선생님.\n오늘도 잘 부탁해."
10049-816-20-1 = "자, 빨리 가자.\n할 일이 잔뜩이라고."
10049-816-30-1 = "잘 되고 있어?\n……그렇다면\n다행이지만."
10049-816-40-1 = "슬슬\n라스트 스퍼트일까.\n할 수 있겠어?"
10049-816-50-1 = "뒷정리도 중요해.\n뭐, 아직 못 끝낸\n거라도 있어?"
10049-816-60-1 = "응? 무슨 일이야?"
10049-816-70-1 = "걱정 안 해도,\n어디 안 간다니까."
10049-816-80-1 = "……간지럽다니까."
10049-816-90-1 = "아아~ 좀! 자! 자!\n일이나 해!"
10049-816-100-1 = "보자, 뭐가 나올까?"
10049-816-110-1 = "자, 잔뜩 돌려볼까?"
10049-816-120-1 = "아직 더 교환할 게\n없는지, 잘 봐 봐."
10049-816-130-1 = "응? 내가 대신\n돌려도 돼?"
10049-816-140-1 = "선생님, 나 말고\n여기를 보라고."
10049-816-150-1 = "오…… 굉장한데,\n축하해."
10049-816-160-1 = "꽤 좋아 보이는데, 응."
10049-816-170-1 = "아, 뭔가 굉장해\n보이는 게……."
