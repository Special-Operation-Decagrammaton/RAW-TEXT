[translation]
26016-860-780-1 = "이야아~\n완전 큰일났네요!"
26016-860-790-1 = "하하! 하……\n진짜 큰일……\n이네요……."
26016-860-800-1 = "기자에게 경험은\n중요하지만요오……."
26016-860-810-1 = "이건, 쫌……!"
26016-860-820-1 = "다퉈도 좋은건\n하나도 없는데……."
26016-860-830-1 = "우으……."
26016-860-840-1 = "오오……! 캡틴 마코토!\n멋져요! 요-호호~!"
26016-860-850-1 = "다음 주간 만마전은\n엄청엄청엄청 두껍겠네요!\n아하핫!"
26016-860-860-1 = "저는 소설가가\n아닌 서기지만……."
26016-860-870-1 = "역시 마지막은 해피엔딩이\n아니면 안 돼요!"
26016-860-880-1 = "뭐어- \n지금까지도 어떻게든\n해냈으니까요……."
26016-860-890-1 = "다 같이 웃는 사진,\n찍고 싶네에……."
26016-860-900-1 = "서기답게,\n전부 기록하고 있다구요!"
26016-860-910-1 = "이걸 믿을지 말지는,\n독자들의 몫이겠죠!"
