[translation]
26016-860-780-1 = "哎呀～\n真的很不得了呢！"
26016-860-790-1 = "啊哈哈……\n真的，很不得了呢……"
26016-860-800-1 = "雖然我覺得身為記者，\n經驗是很重要的……"
26016-860-810-1 = "但這個就有點……！"
26016-860-820-1 = "明明吵架不會有\n任何好處的說……"
26016-860-830-1 = "嗚嗚……"
26016-860-840-1 = "哦哦！真琴船長，\n真帥氣！喲呵呵～！"
26016-860-850-1 = "下一期的週刊萬魔殿\n似乎會變得很厚呢！\n啊哈哈！"
26016-860-860-1 = "雖然我不是小說家\n而是書記……"
26016-860-870-1 = "不過最後果然還是要\nHappy End才行！"
26016-860-880-1 = "嗯，雖然到目前為止\n都順利解決了……"
26016-860-890-1 = "真想拍一張大家\n都笑著的照片啊……"
26016-860-900-1 = "身為書記，我可是\n全～都記錄下來囉！"
26016-860-910-1 = "至於要不要\n相信這段故事，\n就交給讀者了！"
