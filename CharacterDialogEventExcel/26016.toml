[translation]
26016-780 = "いや～、\nホント大変ですね！"
26016-790 = "あはは……本当に、\n大変ですね……。"
26016-800 = "記者としては\n経験が大事だと\n思いますけど……。"
26016-810 = "これはちょっと……！"
26016-820 = "ケンカしても\nいいことなんて\n1つもないのに……。"
26016-830 = "うぅ……。"
26016-840 = "おお！キャプテンマコト、\nかっこいいです！\nヨーホホ～！"
26016-850 = "次号の週刊万魔殿が\n厚くなりそうですね！\nあははっ！"
26016-860 = "私は小説家ではなく\n書記ですが……"
26016-870 = "やっぱり最後は\nハッピーエンド\nじゃないと！"
26016-880 = "まあ、今までもなんとか\nなりましたから……。"
26016-890 = "みんな笑顔の写真、\n撮りたいな……。"
26016-900 = "書記として、\nぜーんぶ記録してますよ！"
26016-910 = "この話を\n信じるかどうかは、\n読者に任せます！"
