[translation]
26016-780 = "ว้าว~\nเกิดเรื่องใหญ่สุดๆ เลยนะคะ!"
26016-790 = "ฮ่าฮ่า! ฮ่า...\nเป็นเรื่องใหญ่...\nจริงๆ เลยค่ะ..."
26016-800 = "ประสบการณ์เป็นสิ่งสำคัญ\nสำหรับนักข่าวก็จริงค่ะ..."
26016-810 = "แต่นี่มัน ออกจะ...!"
26016-820 = "ทะเลาะกันไป\nก็ไม่มีอะไรดีเลยแท้ๆ..."
26016-830 = "อึก..."
26016-840 = "โอ้ว...! กัปตันมาโคโตะ!\nเท่มากค่ะ! โยะโฮโฮ~!"
26016-850 = "แพนเดโมเนียม โซไซตี้\nรายสัปดาห์ฉบับหน้าต้องหนามากๆๆ\nแน่เลยค่ะ! อะฮะฮ่า!"
26016-860 = "ฉันเป็นเลขา\nไม่ใช่นักเขียนนิยายก็จริงค่ะ..."
26016-870 = "แต่ตอนจบ ต้องให้จบ\nแบบแฮปปี้เอนดิ้งค่ะ!"
26016-880 = "ก็นะ ที่ผ่านมาก็หาทางออก\nได้มาตลอดนี่คะ..."
26016-890 = "อยากถ่ายรูปที่ทุกคน\nยิ้มด้วยกันจังเลยค่ะ..."
26016-900 = "สมกับเป็นเลขา\nฉันจดบันทึกไว้\nทุกอย่างเลยค่ะ!"
26016-910 = "ส่วนจะเชื่อหรือไม่เชื่อนั้น\nก็ขึ้นอยู่กับผู้อ่านแล้วละค่ะ!"
