[translation]
26016-860-780-1 = "いや～、\nホント大変ですね！"
26016-860-790-1 = "あはは……本当に、\n大変ですね……。"
26016-860-800-1 = "記者としては\n経験が大事だと\n思いますけど……。"
26016-860-810-1 = "これはちょっと……！"
26016-860-820-1 = "ケンカしても\nいいことなんて\n1つもないのに……。"
26016-860-830-1 = "うぅ……。"
26016-860-840-1 = "おお！キャプテンマコト、\nかっこいいです！\nヨーホホ～！"
26016-860-850-1 = "次号の週刊万魔殿が\n厚くなりそうですね！\nあははっ！"
26016-860-860-1 = "私は小説家ではなく\n書記ですが……"
26016-860-870-1 = "やっぱり最後は\nハッピーエンド\nじゃないと！"
26016-860-880-1 = "まあ、今までもなんとか\nなりましたから……。"
26016-860-890-1 = "みんな笑顔の写真、\n撮りたいな……。"
26016-860-900-1 = "書記として、\nぜーんぶ記録してますよ！"
26016-860-910-1 = "この話を\n信じるかどうかは、\n読者に任せます！"
