[translation]
26016-780 = "이야아~\n완전 큰일났네요!"
26016-790 = "하하! 하……\n진짜 큰일……\n이네요……."
26016-800 = "기자에게 경험은\n중요하지만요오……."
26016-810 = "이건, 쫌……!"
26016-820 = "다퉈도 좋은건\n하나도 없는데……."
26016-830 = "우으……."
26016-840 = "오오……! 캡틴 마코토!\n멋져요! 요-호호~!"
26016-850 = "다음 주간만마전은\n엄청엄청엄청 두껍겠네요!\n아하핫!"
26016-860 = "저는 소설가가\n아닌 서기지만……."
26016-870 = "역시 마지막은 해피엔딩이\n아니면 안돼요!"
26016-880 = "뭐어- \n지금까지도 어떻게든\n해냈으니까요……."
26016-890 = "다같이 웃는 사진,\n찍고싶네에……."
26016-900 = "서기답게,\n전부 기록하고 있다구요!"
26016-910 = "이걸 믿을지 말지는,\n독자들의 몫이겠죠!"
