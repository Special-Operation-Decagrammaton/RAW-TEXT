[translation]
26016-780 = "哎呀～\n真的很不得了呢！"
26016-790 = "啊哈哈……\n真的，很不得了呢……"
26016-800 = "雖然我覺得身為記者，\n經驗是很重要的……"
26016-810 = "但這個就有點……！"
26016-820 = "明明吵架不會有\n任何好處的說……"
26016-830 = "嗚嗚……"
26016-840 = "哦哦！真琴船長，\n真帥氣！喲呵呵～！"
26016-850 = "下一期的週刊萬魔殿\n似乎會變得很厚呢！\n啊哈哈！"
26016-860 = "雖然我不是小說家\n而是書記……"
26016-870 = "不過最後果然還是要\nHappy End才行！"
26016-880 = "嗯，雖然到目前為止\n都順利解決了……"
26016-890 = "真想拍一張大家\n都笑著的照片啊……"
26016-900 = "身為書記，我可是\n全～都記錄下來囉！"
26016-910 = "至於要不要\n相信這段故事，\n就交給讀者了！"
