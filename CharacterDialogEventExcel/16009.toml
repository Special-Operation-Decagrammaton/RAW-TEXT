[translation]
16009-813-430-1 = "앗, 선생 공!\n지금이야말로 인법\n연구부가 활약할 때야!"
16009-813-440-1 = "자, 샤샥! 하고\n깔끔하게\n해결해버리자고!"
16009-813-450-1 = "우와아, 뭔가 엄청난\n대소동이 되어버렸다…."
16009-813-460-1 = "서, 선생 공. 괜찮아?\n믿고 있으니까, 응?!"
16009-813-470-1 = "우갹, 벌써 이런\n시간이…. 이거,\n늦지 않으려나…?"
16009-813-480-1 = "아, 정말, 망량즈\n녀석들 진짜 끈질겨…!"
16009-813-490-1 = "나는 마지막까지 포기\n하지 않아…! 인법\n연구부의 정식 인가도!"
16009-813-500-1 = "<소녀인법첩 미치룻치>\n의 구독자 수 100명\n달성도!"
16009-813-510-1 = "우에에에….\n가, 간신히 끝났다……?\n이제 돌아가도 돼?"
16009-813-520-1 = "후아아…. 빨리 돌아가서,\n닌자 영화나 보고 싶어…."
16009-813-530-1 = "아무 생각할 필요 없는\nB급 영화로…."
16009-813-540-1 = "망량즈는 날뛰고 있지.\n음양부에선 압력이\n들어오지."
16009-813-550-1 = "게헨나의 만마전은\n엄청 귀찮지….\n이젠 뭐가 뭔지…."
16009-813-560-1 = "…햣?! 서, 선생 공?!\n지금 뭘 한 거야?!"
16009-813-570-1 = "가, 갑자기 찌르면\n깜짝 놀란다구……?!"
16009-813-580-1 = "닌자란,\n포기하지 않는 자."
16009-813-590-1 = "마지막까지 달리고,\n무슨 일이 있어도\n임무를 완수한다…."
16009-813-600-1 = "우리들 인법연구부도\n그렇다는걸,\n보여주도록 하겠어!"
16009-813-610-1 = "음양부의 의뢰를\n깔끔하게 해결하고,"
16009-813-620-1 = "이번에야말로\n정식 동아리로\n인정받을 거니까!"
