[translation]
16009-813-430-1 = "อ๊ะ! ทะ... ท่านอาจารย์...!\nตอนนี้พวกข้าน้อย\nกำลังทำกิจกรรมชมรมอยู่แหละ!"
16009-813-440-1 = "เอ้า เอาละๆ!\nมาจัดการกันให้เสร็จเร็วๆ\nกันดีกว่า!"
16009-813-450-1 = "ว้าว... รู้สึกเหมือน\nจะเกิดเรื่องวุ่นวายครั้งใหญ่เลยนะ..."
16009-813-460-1 = "ทะ...ท่านอาจารย์ ไม่เป็นไรใช่มั้ย?\nพวกข้าน้อยเชื่อมั่นในท่านอาจารย์นะ"
16009-813-470-1 = "วะ...ว้าก! เวลาล่วงเลยมา\nขนาดนี้แล้วเหรอ...\nมันไม่ช้าไปใช่มั้ยนะ...?"
16009-813-480-1 = "อ๊ะ เจ้าพวกปีศาจ...\nน่ารำคาญจริงๆ เลยเชียว...!"
16009-813-490-1 = "ข้าน้อยจะไม่ยอมแพ้\nจนถึงที่สุดเลย...!\nทั้งเรื่องขึ้นทะเบียนชมรม"
16009-813-500-1 = "และเรื่องการเพิ่มผู้ติดตาม\nช่องวิดีโอ <วิถีนินจาสาว\nมิจิรุจจี้> ให้ได้ 100 คนด้วย!"
16009-813-510-1 = "วะฮะฮะฮะ...\nจบแล้วงั้นเหรอ...?\nตอนนี้ก็กลับได้แล้วใช่มั้ย?"
16009-813-520-1 = "เฮ้อ... อยากรีบกลับไป\nดูหนังนินจาจังเลย..."
16009-813-530-1 = "หนังเกรดบี...\nที่ดูแล้วไม่ต้องคิดอะไรมาก"
16009-813-540-1 = "พวกปีศาจออกอาละวาด\nแถมยังถูกพวกชมรมหยินหยาง\nกดดันอีก..."
16009-813-550-1 = "พวกแพนเดโมเนียม โซไซตี้\nน่ารำคาญชะมัด...\nจะอะไรกันอีกนะ..."
16009-813-560-1 = "หา?! ทะ...ท่านอาจารย์?!\nทำอะไรน่ะ?!"
16009-813-570-1 = "ถะ...ถ้าจู่ๆ มาจิ้มกันแบบนี้\nมันตกใจนะ...?!"
16009-813-580-1 = "นินจาน่ะ...\nคือผู้ที่ไม่ยอมแพ้"
16009-813-590-1 = "ผู้ที่พยายามจนถึงที่สุด\nไม่ว่าจะเกิดอะไรขึ้น\nก็จะต้องทำภารกิจให้สำเร็จ"
16009-813-600-1 = "ชมรมวิจัยศาสตร์นินจาของเรา...\nก็จะแสดงความมุ่งมั่น\nให้เห็นเอง!"
16009-813-610-1 = "จัดการภารกิจของชมรม\nหยินหยางให้เรียบร้อย"
16009-813-620-1 = "คราวนี้ก็คงจะได้\nรับการยอมรับ\nเป็นชมรมทางการซะที!"
16009-10813-430-1 = "อ๊ะ ท่านอาจารย์...!\nตอนนี้ถึงเวลาชมรมวิจัย\nศาสตร์นินจาออกปฏิบัติการแล้ว!"
16009-10813-440-1 = "เอ้า เอาละๆ!\nมาจัดการกันให้เสร็จเร็วๆ\nกันดีกว่า!"
