[translation]
16009-813-430-1 = "あっ、先生殿！\n今こそ忍術研究部が\n活躍する時だよ！"
16009-813-440-1 = "さあ、ササっと鮮やかに\n解決しちゃおう！"
16009-813-450-1 = "うわぁ、何か\nすごい大騒ぎに\nなっちゃった……"
16009-813-460-1 = "せ、先生殿、\n大丈夫だよね？\n信じてるからね、ね！？"
16009-813-470-1 = "うっぎゃ、もうこんな\n時間……これ、\n間に合うのかな……？"
16009-813-480-1 = "ああもう、魑魅一座\nほんっとしつこい……！"
16009-813-490-1 = "私は最後まで\n諦めない……！\n忍術研究部の認可も！"
16009-813-500-1 = "「少女忍法帖ミチルっち」\nのチャンネル\n登録者100名も！"
16009-813-510-1 = "うえぇぇ……や、やっと\n終わった……？\nもう帰って良い？"
16009-813-520-1 = "ふあぁ……\n早く帰って、忍者の\n映画とか見たい……"
16009-813-530-1 = "何も考える\n必要の無い\nB級のやつ……"
16009-813-540-1 = "魑魅一座は暴れるわ、\n陰陽部から圧力が\nかかるわ、"
16009-813-550-1 = "ゲヘナの万魔殿は\nめんどうだわで……\nもう一体何なのさぁ……"
16009-813-560-1 = "……ひゃっ！？\nせ、先生殿！？\n今何した！？"
16009-813-570-1 = "きゅ、急に触られると\nびっくりするん\nだけど……！？"
16009-813-580-1 = "忍者とは、\n諦めないもの"
16009-813-590-1 = "最後まで走り抜け、\n何があっても任務を\n全うする……"
16009-813-600-1 = "私たち忍術研究部も\nそうなんだってこと、\n見せてあげる！"
16009-813-610-1 = "陰陽部の依頼を\n鮮やかに解決して、"
16009-813-620-1 = "今度こそ正式な\n部活として認めて\nもらうんだから！"
