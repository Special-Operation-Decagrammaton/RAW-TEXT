[translation]
16009-813-430-1 = "Oh, Sensei! This is the perfect time for the Ninjutsu Research Club to shine!"
16009-813-440-1 = "Okay, let's just take care of it at lightning speed!"
16009-813-450-1 = "Whoa, it turned into a big commotion somehow..."
16009-813-460-1 = "S-Sensei, are you okay? I believe in you!"
16009-813-470-1 = "Argh, look at the time! Oh, no... Can I make it?"
16009-813-480-1 = "Ugh, those Mouryo bastards are so persistent!"
16009-813-490-1 = "I'm not gonna give up until the end! The Ninjutsu Research Club will be officially recognized!"
16009-813-500-1 = "And \"Michiruchi, a Girl's Ninja Scroll\" will reach a hundred subscribers!"
16009-813-510-1 = "Ugh... I-I managed to finish it... Can I go back now?"
16009-813-520-1 = "Argh... I just wanna go back and watch a ninja movie..."
16009-813-530-1 = "Something I can watch mindlessly, like a B-rated movie..."
16009-813-540-1 = "The Mouryo are running amok, and the Yin-Yang Club is pressuring me."
16009-813-550-1 = "The Gehenna Pandemonium Society is so annoying... And I'm so confused now..."
16009-813-560-1 = "...Huh? S-Sensei?! What did you just do?"
16009-813-570-1 = "I-I was surprised because you poked me all of a sudden!"
16009-813-580-1 = "To a ninja, there's no such thing as quitting."
16009-813-590-1 = "We run until the finish line. No matter what happens, we complete the mission..."
16009-813-600-1 = "I'll prove the greatness of the Ninjutsu Research Club!"
16009-813-610-1 = "I'm going to successfully fulfill the Yin-Yang Club's request..."
16009-813-620-1 = "...and be recognized as an official club!"
