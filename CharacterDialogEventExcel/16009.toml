[translation]
16009-813-430-1 = "啊，老師大人！\n現在正是忍術研究部\n活躍的時候！"
16009-813-440-1 = "來，唰唰地\n漂亮解決事件吧！"
16009-813-450-1 = "唔哇，好像變成\n不得了的大騷動了……"
16009-813-460-1 = "老，老師大人，\n會沒事的吧？\n我相信你哦，吶！？"
16009-813-470-1 = "嗚啊，已經到\n這個時間了……\n這，來的及嗎……？"
16009-813-480-1 = "啊啊真是的，\n妖怪劇團有夠煩人……！"
16009-813-490-1 = "我直到最後\n都不會放棄的……！\n不管是忍術研究部的認可！"
16009-813-500-1 = "還是「少女忍法帖 小小三千留」\n的訂閱人數達到100人！"
16009-813-510-1 = "唔咦……\n終，終於結束了……？\n可以回去了？"
16009-813-520-1 = "呼啊……好想趕快\n回去看忍者電影……"
16009-813-530-1 = "那種完全不用思考的\nB級的那種……"
16009-813-540-1 = "妖怪劇團在作亂，\n又被陰陽部施壓，"
16009-813-550-1 = "格黑娜的萬魔殿\n也很麻煩……\n到底想怎樣啊……"
16009-813-560-1 = "……噫呀！？\n老，老師大人！？\n你剛才做了什麼！？"
16009-813-570-1 = "突，突然戳我\n會害我嚇到的……！？"
16009-813-580-1 = "所謂忍者，\n就是不會放棄的人。"
16009-813-590-1 = "不斷衝刺直到最後，\n不管發生什麼\n都要完成任務……"
16009-813-600-1 = "我們忍術研究部\n也是一樣這點，\n就讓你見識一下吧！"
16009-813-610-1 = "漂亮地解決\n陰陽部的委託，"
16009-813-620-1 = "這次一定要被認可\n為正式的社團！"
