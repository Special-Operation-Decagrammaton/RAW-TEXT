[translation]
20021-819-110-1 = "老師，\n聖誕節\n終於來了！"
20021-819-120-1 = "我也進入聖誕節\n模式了唷～！"
20021-819-130-1 = "老師有什麼\n想要的東西嗎？"
20021-819-140-1 = "我會寫一封信\n跟聖誕老人請求的！"
20021-819-150-1 = "一起\n加油吧，老師！"
20021-819-160-1 = "還剩一點！\n雖然很有成就感……"
20021-819-170-1 = "但也有點\n寂寞呢。"
20021-819-180-1 = "已經到\n結束的時間了呢。"
20021-819-190-1 = "我會\n幫忙收拾的！"
20021-819-200-1 = "老師，怎麼了？\n有什麼事嗎？"
20021-819-210-1 = "被那樣\n盯著看的話……"
20021-819-220-1 = "這樣子，很奇怪嗎？"
20021-819-230-1 = "怎麼了？\n忘了什麼東西嗎……？\n咦，不是嗎？"
20021-819-240-1 = "唔唔唔……\n像那樣到處\n摸的話……"
20021-819-250-1 = "我也會把\n老師\n摸回來的！"
20021-819-350-1 = "救護騎士團主辦的\n慈善活動現正舉辦中！"
20021-819-360-1 = "啊，老師！歡迎！\n要不要來抽個籤呀？"
20021-819-370-1 = "慈善活動\n結束了！"
20021-819-380-1 = "如果手上還有\n抽獎券的話，\n我來幫你兌換！"
20021-819-390-1 = "咦，\n有什麼事嗎？"
20021-819-400-1 = "今天的聖誕老人花繪\n會帶給你幸福唷～！"
20021-819-410-1 = "哇，中大獎了！"
20021-819-420-1 = "欸嘿嘿。\n如果你喜歡我的禮物，\n我會很高興的！"
20021-819-430-1 = "哇啊……！\n竟然有這樣的東西……！"
20021-819-440-1 = "以下是今天要做的事！"
20021-819-450-1 = "一件一件，不用著急！"
20021-819-460-1 = "那份清單，\n是在這裡對吧？\n……咦，是哪一個呢？"
20021-819-470-1 = "總覺得事情\n很多呢……"
20021-819-480-1 = "這個也能做手術的話\n就好了。"
20021-819-490-1 = "好厲害！不愧是老師！"
20021-819-500-1 = "辛苦了，老師。\n我也很開心！"
