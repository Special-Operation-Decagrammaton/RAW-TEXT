[translation]
20021-819-110-1 = "Sensei! It's finally here! It's Christmas!"
20021-819-120-1 = "Christmas mode, activated!"
20021-819-130-1 = "Sensei, is there anything you want?"
20021-819-140-1 = "I'll write a letter to Santa Claus!"
20021-819-150-1 = "Let's keep it up, Sensei!"
20021-819-160-1 = "We're almost there! It's rewarding, but..."
20021-819-170-1 = "It's a little sad too, you know?"
20021-819-180-1 = "It's time to wrap it up."
20021-819-190-1 = "I'll help you clean up!"
20021-819-200-1 = "Sensei? Is something wrong?"
20021-819-210-1 = "Why... Why're you looking at me like that?"
20021-819-220-1 = "Do I look weird?"
20021-819-230-1 = "What's wrong? Did you forget something...? No, that's not it?"
20021-819-240-1 = "Ack...! Why do you keep poking me...?"
20021-819-250-1 = "If you don't stop, I'm gonna poke you too, Sensei!"
20021-819-350-1 = "The Remedial Knights are hosting a charity event right now!"
20021-819-360-1 = "Welcome, Sensei! Do you wanna draw some lots?"
20021-819-370-1 = "The charity event is over!"
20021-819-380-1 = "If you still have a lottery ticket, I'll exchange it for you!"
20021-819-390-1 = "Huh? What's wrong?"
20021-819-400-1 = "Today, Santa Hanae is delivering happiness!"
20021-819-410-1 = "Wow, you won!"
20021-819-420-1 = "Heehee. I hope you like my gift."
20021-819-430-1 = "Whoa...! I didn't expect to find this in here!"
20021-819-440-1 = "I'll show you today's work!"
20021-819-450-1 = "Let's tackle it step-by-step!"
20021-819-460-1 = "This list... Is this right? Wh-Which one...?"
20021-819-470-1 = "There's so much..."
20021-819-480-1 = "I wish I could perform surgery on this."
20021-819-490-1 = "Amazing! I knew I could count on you!"
20021-819-500-1 = "Great work, Sensei! I'm so happy!"
