[translation]
20021-819-110-1 = "คุณครูคะ ในที่สุด\nก็ถึงวันคริสต์มาสแล้วค่ะ!"
20021-819-120-1 = "ตอนนี้ฉันก็\nอยู่ในโหมดคริสต์มาสค่ะ~!"
20021-819-130-1 = "คุณครูมีอะไร\nที่อยากได้รึเปล่าคะ?"
20021-819-140-1 = "ฉันจะเขียนจดหมาย\nบอกซานตาคลอสให้ค่ะ!"
20021-819-150-1 = "มาพยายามด้วยกันนะคะคุณครู!"
20021-819-160-1 = "ใกล้จะถึงแล้วค่ะ!\nถึงจะน่าภาคภูมิใจ..."
20021-819-170-1 = "แต่ก็น่าเสียดายนิดหน่อยนะคะ"
20021-819-180-1 = "ถึงเวลาเก็บกวาดกันแล้วละค่ะ"
20021-819-190-1 = "ฉันจะช่วยจัดการ\nให้เรียบร้อยเองค่ะ!"
20021-819-200-1 = "คุณครู ทำไมเป็นแบบนั้นล่ะคะ?\nมีเรื่องอะไรหรือเปล่าคะ?"
20021-819-210-1 = "ถ้ายังจ้องกัน\nอยู่แบบนี้ละก็..."
20021-819-220-1 = "ชุดนี้มันแปลกๆ เหรอคะ?"
20021-819-230-1 = "ทำไมเป็นแบบนั้นล่ะคะ?\nลืมอะไรไว้งั้นเหรอคะ...\nเอ๋ ไม่ใช่เหรอคะ?"
20021-819-240-1 = "อ๊ะ...\nถ้ามาจิ้มกันบ่อยๆ..."
20021-819-250-1 = "ฉันก็จะ\nจิ้มคุณครูแรงๆ บ้างนะคะ!"
20021-819-350-1 = "ชมรมอัศวินบรรเทาทุกข์\nกำลังจัดงานการกุศลอยู่ค่ะ!"
20021-819-360-1 = "อ๊ะ คุณครู! เชิญเลยค่ะ!\nสนใจเสี่ยงโชคดูสักหน่อย\nไหมล่ะคะ?"
20021-819-370-1 = "กิจกรรมการกุศล\nจบลงแล้วค่ะ!"
20021-819-380-1 = "ถ้ายังมีสลากอยู่\nฉันจะแลกให้ค่ะ!"
20021-819-390-1 = "คะ?\nมีปัญหาอะไรหรือเปล่าคะ?"
20021-819-400-1 = "วันนี้ซานต้าฮานาเอะ\nมาแจกจ่ายความสุขค่า~!"
20021-819-410-1 = "ว้าว ถูกรางวัลด้วยค่ะ!"
20021-819-420-1 = "ฮุฮุ หวังว่าจะถูกใจ\nของขวัญจากฉันนะคะ!"
20021-819-430-1 = "ว้าว...\nข้างในมีของพวกนี้เหรอเนี่ย...!"
20021-819-440-1 = "งานของวันนี้อยู่ทางนี้ค่ะ!"
20021-819-450-1 = "อย่าใจร้อนนะคะ\nค่อยๆ ทำทีละอย่างค่ะ!"
20021-819-460-1 = "ดูจากลิสต์แล้ว ใช่ตรงนี้ไหมนะ?\nเอ๋... ตรงไหนกันแน่นะ?"
20021-819-470-1 = "งานดูเยอะจังเลยนะคะ..."
20021-819-480-1 = "ถ้าผ่าตัดได้เลย\nก็คงจะดีนะคะ"
20021-819-490-1 = "สุดยอดเลย! สมกับเป็นคุณครูเลยค่ะ!"
20021-819-500-1 = "ทำได้ดีมากเลยค่ะคุณครู!\nฉันเองก็ดีใจค่ะ!"
