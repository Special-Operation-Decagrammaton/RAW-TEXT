[translation]
20021-819-110-1 = "선생님, 드디어\n크리스마스가 찾아왔습니다!"
20021-819-120-1 = "저도 크리스마스\n모드예요~!"
20021-819-130-1 = "선생님은 뭔가\n바라는 것이 있으세요?"
20021-819-140-1 = "제가 산타클로스께\n편지를 써 드릴게요!"
20021-819-150-1 = "함께 힘내죠, 선생님!"
20021-819-160-1 = "이제 거의 다 왔어요!\n보람차지만……"
20021-819-170-1 = "조금, 아쉽기도 하네요."
20021-819-180-1 = "벌써 정리할\n시간이네요."
20021-819-190-1 = "뒷정리,\n도와드릴게요!"
20021-819-200-1 = "선생님, 왜 그러세요?\n무슨 일이라도 있으신가요?"
20021-819-210-1 = "그렇게 계속\n바라보시면……"
20021-819-220-1 = "이 복장, 이상한가요?"
20021-819-230-1 = "왜 그러세요? 뭔가\n잊어버린 물건이라도……\n어, 아니라고요?"
20021-819-240-1 = "으우우……\n자꾸 쿡쿡 찌르시면……"
20021-819-250-1 = "저도 선생님을\n마구 찔러 버릴 거예요!"
20021-819-350-1 = "구호기사단이 주관하는\n자선 행사가 개최 중이에요!"
20021-819-360-1 = "앗, 선생님! 어서 오세요!\n제비뽑기는 어떠신가요?"
20021-819-370-1 = "자선 이벤트는\n종료되었습니다!"
20021-819-380-1 = "아직 추첨권을\n가지고 계신다면\n제가 교환해드릴게요!"
20021-819-390-1 = "네?\n무슨 문제라도 있으신가요?"
20021-819-400-1 = "오늘의 하나에 산타는\n행복을 전한답니다~!"
20021-819-410-1 = "우와, 당첨이네요!"
20021-819-420-1 = "후후, 제 선물이\n마음에 드셨으면 좋겠어요!"
20021-819-430-1 = "와아……!\n이런 것이 들어 있었다니…!"
20021-819-440-1 = "오늘 할 일은 이쪽이에요!"
20021-819-450-1 = "하나씩, 조급해하지 말고 진행하죠!"
20021-819-460-1 = "이 리스트, 여기 맞나?\n……어, 어느 쪽이지?"
20021-819-470-1 = "뭔가 일이 많네요……"
20021-819-480-1 = "이것도 수술해 버릴 수 있으면\n좋을 텐데요."
20021-819-490-1 = "대단해요! 역시 선생님이세요!"
20021-819-500-1 = "수고하셨어요, 선생님!\n저도 기뻐요!"
