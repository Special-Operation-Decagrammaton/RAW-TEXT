[translation]
20021-819-110-1 = "先生、\nいよいよクリスマスが\nやってきました！"
20021-819-120-1 = "私もクリスマスモード\nですよ～！"
20021-819-130-1 = "先生は何か\n欲しいものありますか？"
20021-819-140-1 = "私がサンタさんにお願いの\n手紙を書きますよ！"
20021-819-150-1 = "一緒に\n頑張りましょう、先生！"
20021-819-160-1 = "あと少しです！\n達成感はありますけど……"
20021-819-170-1 = "ちょっと寂しくも\nなりますね。"
20021-819-180-1 = "もうお開きの\nお時間ですね。"
20021-819-190-1 = "後片付け、\nお手伝いしますよ！"
20021-819-200-1 = "先生、どうしました？\n何かありましたか？"
20021-819-210-1 = "そんなにジッと\n見つめられると……"
20021-819-220-1 = "この格好、変ですか？"
20021-819-230-1 = "どうしました？\n何か忘れ物でも……？\nえっ、違う？"
20021-819-240-1 = "ううう……\nそんなにあちこち\n触ってくるなら……"
20021-819-250-1 = "私だって先生のこと、\nいっぱい\n触りかえしちゃいます！"
20021-819-350-1 = "救護騎士団主催の\nチャリティーイベントを\n開催中でーす！"
20021-819-360-1 = "あっ、先生！ようこそ！\nくじはいかがですか？"
20021-819-370-1 = "チャリティーイベントは\n終了しました！"
20021-819-380-1 = "まだ手元に抽選券が\nあるなら、\n私が引き換えますよ！"
20021-819-390-1 = "あれっ、\n何かありましたか？"
20021-819-400-1 = "今日のハナエサンタは\n幸せをお届けしますよ～！"
20021-819-410-1 = "わあっ、大当たり！"
20021-819-420-1 = "えへへ。私のプレゼント、\n気に入ってもらえたら嬉しいです！"
20021-819-430-1 = "わあっ……！\nこんなものが入ってたなんて……！"
20021-819-440-1 = "今日のやる事はこちらです！"
20021-819-450-1 = "一つずつ、焦らずいきましょう！"
20021-819-460-1 = "このリスト、\nここで合ってたっけ？\n……あれ、どっちだろ？"
20021-819-470-1 = "なんだかお仕事が\nいっぱいですね……。"
20021-819-480-1 = "これも手術できちゃえば\nいいのに。"
20021-819-490-1 = "すごい！さすが先生です！"
20021-819-500-1 = "お疲れさまでした、先生。\n私もうれしいです！"
