[translation]
10114-844-290-1 = "ยินดีต้อนรับสู่\nสถาบันเกเฮนน่าค่ะ คุณครู!"
10114-844-300-1 = "ขอให้มีช่วงเวลาที่...\nสนุกและปลอดภัยนะคะ!"
10114-844-310-1 = "ว้าว!\nคุณครูมาแล้วสินะคะ!"
10114-844-320-1 = "ปะ... เป็นยังไงบ้างคะ?\nชุดของฉัน... เข้ากับฉันมั้ยคะ...?"
10114-844-330-1 = "แง... แงง..."
10114-844-340-1 = "แพนจัง...\nอยู่ในความรับผิดชอบ\nของฉันค่ะ... ไม่ว่ายังไงฉันต้อง...!"
10114-844-350-1 = "เพราะถึงยังไง\nสถาบันเกเฮนน่า\nก็เป็นโรงเรียนของฉันค่ะ!"
10114-844-360-1 = "ฉันจะไม่\nอยู่นิ่งๆ อย่างนี้หรอกค่ะ!"
10114-844-370-1 = "คิดว่าจะแก้ปัญหา\nไม่ได้แล้วเสียอีกค่ะ..."
10114-844-380-1 = "ขอบคุณนะคะ คุณครู\nพอมีคุณครูอยู่ด้วย ทุกอย่าง\nก็คลี่คลายได้ด้วยดีเลยค่ะ!"
10114-844-390-1 = "ฉันใส่ชุดที่เข้ากับ\nงานพาร์ทไทม์คาเฟ่\nที่ฉันได้ทำค่ะ"
10114-844-400-1 = "ถ้าคุณครูมีเวลา\nก็แวะมาพักผ่อน...\nสักหน่อยมั้ยคะ?"
10114-844-410-1 = "งานพาร์ทไทม์คาเฟ่\nก็แปลกใหม่และสนุกดีนะคะ"
10114-844-420-1 = "แต่ถ้าในแง่ของ\nการฝึกทำอาหาร\nแล้วละก็"
10114-844-430-1 = "งานของชมรมโภชนาการ\nสำคัญกว่าเยอะเลยค่ะ"
10114-844-440-1 = "อะฮะฮะฮ่า!\nจริงๆ เลย คุณครูคะ!\nมันจั๊กจี้นะคะ!"
10114-844-450-1 = "ฮู่ว... ขอบคุณค่ะ"
10114-844-460-1 = "หายประหม่าขึ้นมาหน่อยแล้วค่ะ"
10114-844-470-1 = "ฉันกำลังรออยู่เลยค่ะ คุณครู!\nมาทางนี้สิคะ!"
10114-844-480-1 = "อยากได้อะไรหรือเปล่าคะลูกค้า?\nให้ฉันเอาเมนูมาให้มั้ยคะ?"
10114-844-490-1 = "ฮุฮุ คุณครู"
10114-844-500-1 = "เชิญเลือกดูให้หนำใจ\nจนปิดร้านเลยนะคะ!"
10114-844-510-1 = "ฉันถูกชมบ่อยๆ ว่าคล่องแคล่วค่ะ"
10114-844-520-1 = "ประสบการณ์จากชมรมโภชนาการ\nช่วยได้เยอะเลยค่ะ!"
10114-844-530-1 = "คะ คุณครู? เรียกหาฉันเหรอคะ?"
10114-844-540-1 = "ต่อให้เรียกฉันอย่างไร้เหตุผล\nหรือมีของที่ต้องการจริงๆ..."
10114-844-550-1 = "ฉันก็ชอบทั้งหมดค่ะ!"
10114-844-560-1 = "ต้องการสิ่งนี้สินะ!\nช่วยรอสักครู่นะคะ"
10114-844-570-1 = "ฉันก็คิดว่าเป็นการเลือกที่ดีค่ะ\nจะรีบไปเตรียมมาให้นะคะ"
10114-844-580-1 = "มีของในสต๊อกเหลือเฟือค่ะ\nไม่ต้องกังวลนะคะ!"
10114-844-590-1 = "ถ้าขาดเหลืออะไร\nก็บอกฉันได้ตลอดนะคะ!"
10114-844-780-1 = "ในคาเฟ่ การเตรียมวัตถุดิบ\nก็เป็นสิ่งสำคัญ! เหมือนงาน\nชมรมโภชนาการเลยนะคะ"
10114-844-790-1 = "ฉันชอบการทำงานให้เสร็จ\nมันทำให้ฉันอิ่มเอมใจน่ะค่ะ"
10114-844-800-1 = "รับออเดอร์\nแล้วก็เอาอาหารมาเสิร์ฟ..."
10114-844-810-1 = "ตอนนี้งานแบบนั้นถือเป็น\n'ภารกิจ' ของฉันแล้วค่ะ"
10114-844-820-1 = "เรียกฉันเหรอคะ คุณครู?\nมีอะไรให้ฉันช่วยมั้ยคะ?"
10114-844-830-1 = "ยอดเยี่ยมเลยค่ะ คุณครู!\nนี่ค่ะ รับไปได้เลย!"
10114-844-840-1 = "การได้รางวัลสมกับที่พยายาม...\nเป็นสิ่งที่ยอดเยี่ยมไปเลยค่ะ!"
