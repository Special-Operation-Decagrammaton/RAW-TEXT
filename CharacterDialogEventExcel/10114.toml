[translation]
10114-844-290-1 = "願意來到格黑娜學園……\n真的非常感謝！"
10114-844-300-1 = "還請度過一段\n愉快的時光哦。"
10114-844-310-1 = "哇！老師，你來啦！"
10114-844-320-1 = "這套制服……\n適，適合我嗎？"
10114-844-330-1 = "噫噫……嗚……"
10114-844-340-1 = "餅醬它……\n都怪我不好……\n得想想辦法才行……！"
10114-844-350-1 = "不能就這樣\n置之不理……"
10114-844-360-1 = "因為我，是\n格黑娜的學生！"
10114-844-370-1 = "我一度還想說\n不知道會變成怎樣……"
10114-844-380-1 = "多虧了老師\n才能順利解決！\n非常謝謝你！"
10114-844-390-1 = "因為咖啡廳的打工，\n所以穿上了制服。"
10114-844-400-1 = "不介意的話……\n要不要休息一下？"
10114-844-410-1 = "咖啡廳的工作，\n真的非常有趣。"
10114-844-420-1 = "不過因為很少\n做料理……"
10114-844-430-1 = "讓我覺得應該更努力\n做供給部的工作才行！"
10114-844-440-1 = "啊哈哈！老師！\n很癢耶……！"
10114-844-450-1 = "……呼，謝謝你。"
10114-844-460-1 = "託你的福，\n讓我稍微放鬆了。"
10114-844-470-1 = "恭候多時了，老師！\n這邊請！"
10114-844-480-1 = "需要幫您拿菜單嗎？"
10114-844-490-1 = "呵呵，老師。"
10114-844-500-1 = "在結束之前，\n還請慢慢享受！"
10114-844-510-1 = "打工時，我的動作\n經常會被誇獎……"
10114-844-520-1 = "是因為活用了\n供給部的經驗嗎？"
10114-844-530-1 = "是，老師。\n要點餐嗎？"
10114-844-540-1 = "光是能被老師叫來……"
10114-844-550-1 = "我就很開心了！"
10114-844-560-1 = "我明白了！\n馬上為您準備！"
10114-844-570-1 = "是那個對吧！\n我立刻幫您送去，請稍等。"
10114-844-580-1 = "庫存非常充足！\n無須擔心！"
10114-844-590-1 = "如果有缺少什麼的話，\n請隨時跟我說！"
10114-844-780-1 = "就算是咖啡廳，準備也很重要！\n這是跟供給部的共通點呢。"
10114-844-790-1 = "每日的工作……\n能一點一點地完成，我很喜歡。"
10114-844-800-1 = "接受點餐，運送料理……"
10114-844-810-1 = "這些就是服務生的「任務」。"
10114-844-820-1 = "老師，有需要\n我幫忙的事嗎？"
10114-844-830-1 = "真厲害！老師！\n來，請收下這個！"
10114-844-840-1 = "努力能獲得回報……\n真的很棒呢。"
