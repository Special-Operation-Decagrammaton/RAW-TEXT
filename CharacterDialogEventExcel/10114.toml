[translation]
10114-844-290-1 = "Welcome to Gehenna Academy, Sensei!"
10114-844-300-1 = "I hope you have a fun, SAFE stay!"
10114-844-310-1 = "Yay! Sensei is here!"
10114-844-320-1 = "Wh-What do you think? My clothes, do they...suit me?"
10114-844-330-1 = "Waah... Waaaah..."
10114-844-340-1 = "Pan-Pan is... It's my fault... I have to do something...!"
10114-844-350-1 = "But still, Gehenna Academy is my school too!"
10114-844-360-1 = "I'm not going to sit still and do nothing!"
10114-844-370-1 = "I was worried how it was going to turn out..."
10114-844-380-1 = "Thank you, Sensei. With you around, it feels like everything's going to be fine!"
10114-844-390-1 = "I ended up working part-time at a cafe, so I tried wearing a fitting outfit."
10114-844-400-1 = "If you don't mind, how about...a short break?"
10114-844-410-1 = "Part-time cafe work is a fresh and fun experience, too."
10114-844-420-1 = "But still, when it comes to practicing cooking,"
10114-844-430-1 = "the School Lunch Club's work feels more important."
10114-844-440-1 = "Ahahaha! Seriously, Sensei! That tickles!"
10114-844-450-1 = "...Phew, thank you."
10114-844-460-1 = "That helped me loosen up a bit."
10114-844-470-1 = "I've been waiting, Sensei! Come on, this way!"
10114-844-480-1 = "Is there anything you're looking for, customer? Would you like to see the menu?"
10114-844-490-1 = "Heehee, Sensei."
10114-844-500-1 = "Look around to your heart's content, for as long as you like!"
10114-844-510-1 = "People often compliment my swiftness."
10114-844-520-1 = "It seems like my experience with the School Lunch Club helped!"
10114-844-530-1 = "Yes, Sensei? Did you call me?"
10114-844-540-1 = "Even if you called me without a reason, or even if you wanted something..."
10114-844-550-1 = "I'm happy regardless!"
10114-844-560-1 = "Ah, so that's what you want! Please give me a moment."
10114-844-570-1 = "Good choice! I'll get it to you momentarily."
10114-844-580-1 = "We have plenty of supplies. Don't you worry!"
10114-844-590-1 = "If there's anything missing, please let me know anytime!"
10114-844-780-1 = "Ingredient preparation is important in a cafe too, of course! That's a common element with the School Lunch Club."
10114-844-790-1 = "I like doing what I'm tasked to do. For some reason, it makes me feel proud."
10114-844-800-1 = "Taking orders, bringing dishes..."
10114-844-810-1 = "Perhaps those are \"missions\" for me right now, you know what I mean?"
10114-844-820-1 = "Did you call for me, Sensei? Is there anything I can help with?"
10114-844-830-1 = "That's incredible, Sensei! Here, have this!"
10114-844-840-1 = "Being rewarded for all your hard work...it's really amazing!"
