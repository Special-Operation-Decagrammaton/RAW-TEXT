[translation]
10114-844-290-1 = "ゲヘナ学園まで\nお越しくださり……\nありがとうございます！"
10114-844-300-1 = "どうか楽しいひと時を\nお過ごしくださいね。"
10114-844-310-1 = "わあ！先生、来て\nくださったんですね！"
10114-844-320-1 = "この制服……\nに、似合ってますか？"
10114-844-330-1 = "ひぃん……うう……"
10114-844-340-1 = "パンちゃんが……\n私のせいです……\nなんとかしないと……！"
10114-844-350-1 = "このまま放っておく\nわけにはいきません……"
10114-844-360-1 = "私は、ゲヘナの\n生徒ですから！"
10114-844-370-1 = "一時はどうなることかと\n思いましたが……"
10114-844-380-1 = "先生のおかげで\nどうにかなりました！\nありがとうございます！"
10114-844-390-1 = "カフェのアルバイトで、\n制服を着ることに\nなったんです。"
10114-844-400-1 = "よろしければ……\n一息ついて\nいきませんか？"
10114-844-410-1 = "カフェのお仕事、\nすごく楽しいです。"
10114-844-420-1 = "でもお料理は\nあまりしないので……"
10114-844-430-1 = "給食部のお仕事を\nもっと頑張らなきゃって\n思いました！"
10114-844-440-1 = "あはは！先生！\nくすぐったいです……！"
10114-844-450-1 = "……ふぅ、\nありがとうございます。"
10114-844-460-1 = "おかげさまで、少し\nリラックスできました。"
10114-844-470-1 = "お待ちしておりました、先生！\nこちらへどうぞ！"
10114-844-480-1 = "メニューを\nお持ちしましょうか？"
10114-844-490-1 = "ふふっ、先生。"
10114-844-500-1 = "最後まで、ごゆっくり\nお楽しみください！"
10114-844-510-1 = "アルバイト中、動きを褒めて\nいただけることが多いんです……"
10114-844-520-1 = "給食部での経験が\n活きているのでしょうか？"
10114-844-530-1 = "はい先生、何か\nご注文ですか？"
10114-844-540-1 = "先生に\nお呼びいただいただけで……"
10114-844-550-1 = "私はとても嬉しいです！"
10114-844-560-1 = "分かりました！\n今すぐご用意します！"
10114-844-570-1 = "そちらですね！ただいまお持ち\nしますので、少々お待ちください。"
10114-844-580-1 = "在庫は十分にあります！\nご心配なく！"
10114-844-590-1 = "もし足りないものがありましたら、\nいつでも仰ってくださいね！"
10114-844-780-1 = "カフェでも仕込みは大事です！\n給食部との共通点ですね。"
10114-844-790-1 = "日課……\nコツコツできて、私は好きです。"
10114-844-800-1 = "注文を受けて、\nお料理を運ぶ……"
10114-844-810-1 = "これがウェイトレスの\n「ミッション」です。"
10114-844-820-1 = "先生、何かお手伝いできること、\nありますか？"
10114-844-830-1 = "すごいです！先生！\nはいこちら、受け取ってください！"
10114-844-840-1 = "努力が報われるって……\n素敵ですよね。"
