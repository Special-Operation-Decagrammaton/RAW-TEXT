[translation]
20048-848-200-1 = "老師，歡迎您的到來。\n這邊請坐。"
20048-848-210-1 = "想要不著痕跡地\n偷懶是需要技術的。"
20048-848-220-1 = "呵呵……\n我告訴您訣竅吧？"
20048-848-230-1 = "留下的工作讓人\n有點擔心……"
20048-848-240-1 = "希望都有在\n順利進行……"
20048-848-250-1 = "各種事件接連\n不斷呢……"
20048-848-260-1 = "如果只是場\n惡夢就好了……"
20048-848-270-1 = "已經到回去的時間了嗎。"
20048-848-280-1 = "在這裡發生的事，\n有朝一日也會變成\n美好的回憶吧。"
20048-848-290-1 = "有什麼事嗎？"
20048-848-300-1 = "天氣真熱呢……"
20048-848-310-1 = "請人準備一些\n冰涼的飲料吧。"
20048-848-320-1 = "當然，是冰紅茶\n以外的種類。"
20048-848-330-1 = "哎呀老師，您對\n這本書有興趣嗎？"
20048-848-340-1 = "老師，在那邊的話\n皮膚會曬傷的。"
20048-848-350-1 = "請到這邊來。\n陽傘底下很涼快唷。"
20048-848-1070-1 = "還請慢慢參觀。"
20048-848-1080-1 = "庫存準備得十分充足。"
20048-848-1090-1 = "畢竟，這還是\n我第一次看店。"
20048-848-1100-1 = "希望您……多多包涵。"
20048-848-1110-1 = "購物，您還滿意嗎？"
20048-848-1120-1 = "那麼，差不多\n該回去了，老師。"
20048-848-1130-1 = "接待客人，其實\n也算是交涉的一種……？"
20048-848-1140-1 = "原來如此，聽您這麼說，\n緊張感好像稍微緩解了。"
20048-848-1150-1 = "接待、結帳、陳列……"
20048-848-1160-1 = "業務範圍比想像中\n還要廣泛呢。"
20048-848-1170-1 = "您真有眼光呢，老師。"
20048-848-1180-1 = "請稍等。\n我來為您包裝。"
20048-848-1190-1 = "咦！？我想要的東西……？"
20048-848-1200-1 = "呵呵，那我就\n收下您的心意吧。"
20048-848-1210-1 = "呵呵，感覺已經\n掌握看店的訣竅了。"
