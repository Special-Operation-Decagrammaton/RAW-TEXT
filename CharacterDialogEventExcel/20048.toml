[translation]
20048-848-200-1 = "คุณครู มาแล้วเหรอคะ?\nเชิญนั่งตรงนี้ก่อนค่ะ"
20048-848-210-1 = "แม้แต่การขี้เกียจก็ต้องอาศัย\nเคล็ดลับและความพยายาม"
20048-848-220-1 = "ฮุฮุ... ฉันจะช่วยสอนให้เองค่ะ"
20048-848-230-1 = "ฉันยังนึกถึงงาน\nที่ค้างอยู่ตลอดเลยค่ะ..."
20048-848-240-1 = "ต่อให้ฉันไม่อยู่\nก็จะไม่เป็นไรใช่มั้ยคะ...?"
20048-848-250-1 = "ชอบรู้สึกเหมือนจะเกิด\nปัญหาขึ้นอยู่เรื่อยเลย... "
20048-848-260-1 = "ฉันคงแค่คิดไปเองใช่มั้ยคะ...?"
20048-848-270-1 = "ถึงเวลาต้องกลับแล้วสินะคะ"
20048-848-280-1 = "การจากไปเพื่อให้ได้คิดถึง\nสถานที่แห่งนี้แล้วมาอีกครั้ง"
20048-848-290-1 = "มีเรื่องอะไรเหรอคะ คุณครู?"
20048-848-300-1 = "ร้อนจังเลยนะคะ..."
20048-848-310-1 = "ต้องมีเครื่องดื่มเย็นๆ แล้วละค่ะ"
20048-848-320-1 = "อืม ไม่เอาชาเย็นนะคะ"
20048-848-330-1 = "คุณครูก็สนใจ\nหนังสือเล่มนี้เหรอคะ?"
20048-848-340-1 = "คุณครู แสงแดดจ้าไปหน่อย\nว่ามั้ยคะ?"
20048-848-350-1 = "เข้ามาในร่มกันแดด\nของฉันสิคะ"
20048-848-1070-1 = "ค่อยๆ ดูได้เลยนะคะ"
20048-848-1080-1 = "ฉันเตรียมของไว้\nเหลือเฟือเลยค่ะ"
20048-848-1090-1 = "เป็นครั้งแรกเลยนะคะที่ได้ต้อนรับลูกค้า"
20048-848-1100-1 = "เพราะงั้นก็...\nขอฝากตัวด้วยนะคะ คุณครู"
20048-848-1110-1 = "พอใจกับการซื้อของมั้ยคะ?"
20048-848-1120-1 = "เอาละ ทีนี้ก็กลับด้วยกัน\nเถอะค่ะคุณครู"
20048-848-1130-1 = "การต้อนรับก็ถือเป็น\nงานทางการทูตเหรอคะ...?"
20048-848-1140-1 = "พอคิดแบบนั้น\nฉันก็เบาใจขึ้นมาเลยนะคะ"
20048-848-1150-1 = "เรียงของ คิดเงิน เข้าก่อนออกก่อน..."
20048-848-1160-1 = "วันนี้รู้สึกว่าคำที่คุ้นเคย\nกลับแปลกหูขึ้นมาเลยค่ะ "
20048-848-1170-1 = "ตาถึงมากเลยค่ะ\nคุณครู"
20048-848-1180-1 = "ช่วยรอสักครู่นะคะ\nฉันจะห่อสินค้าให้ค่ะ"
20048-848-1190-1 = "เอ๋ ให้เลือกของฉันด้วยเหรอคะ?"
20048-848-1200-1 = "ฮุฮุ ฉันขอรับไว้แค่\nน้ำใจแล้วกันค่ะ"
20048-848-1210-1 = "ฮุฮุ ตอนนี้ฉันชำนาญ\nขึ้นมาหน่อยแล้วมั้ยคะ?"
