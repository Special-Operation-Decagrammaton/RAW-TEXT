[translation]
20048-848-200-1 = "先生、ようこそ\nお越しくださいました。\nこちらへおかけください。"
20048-848-210-1 = "バレないように\n手を抜くためには\n技術が求められます。"
20048-848-220-1 = "ふふ……コツを教えて\n差し上げましょうか？"
20048-848-230-1 = "残してきた業務が\n気がかりで……"
20048-848-240-1 = "上手く回っていると\n良いのですが……。"
20048-848-250-1 = "なにかと事件が\n続きますね……"
20048-848-260-1 = "ただの悪い夢だったら\n良かったのですが……。"
20048-848-270-1 = "もう帰る時間ですか。"
20048-848-280-1 = "ここで起きたことも、\nいつの日か良い思い出話に\nなるのでしょうね。"
20048-848-290-1 = "何かご用ですか？"
20048-848-300-1 = "暑いですね……"
20048-848-310-1 = "何か冷たい飲み物を\n用意させましょう。"
20048-848-320-1 = "ええ、\nアイスティー以外の、\nですが。"
20048-848-330-1 = "あら先生、\nこの本にご興味が？"
20048-848-340-1 = "先生、そこでは肌が\n焼けてしまいます。"
20048-848-350-1 = "どうぞこちらへ。\nパラソルの下は\n涼しいですよ。"
20048-848-1070-1 = "ゆっくりご覧ください。"
20048-848-1080-1 = "在庫は十分に\nご用意しております。"
20048-848-1090-1 = "なにぶん、\n店番は初めてでして。"
20048-848-1100-1 = "何卒……お手柔らかに\nお願いします。"
20048-848-1110-1 = "お買い物、\nご満足いただけましたか？"
20048-848-1120-1 = "では、そろそろ\n帰りましょう、先生。"
20048-848-1130-1 = "接客もいわば、\n交渉事の一種……？"
20048-848-1140-1 = "なるほど、そう聞くと、\n緊張が少しほぐれそうです。"
20048-848-1150-1 = "接客に会計、陳列……"
20048-848-1160-1 = "思ったよりも業務範囲が\n多岐にわたるのですね。"
20048-848-1170-1 = "お目が高いですね、先生。"
20048-848-1180-1 = "少々お待ちください。\n包装してまいります。"
20048-848-1190-1 = "えっ！？私が欲しいもの……？"
20048-848-1200-1 = "ふふっ、お気持ちだけ\nいただいておきますね。"
20048-848-1210-1 = "ふふ、店番の勘所を\n押さえられた気がします。"
