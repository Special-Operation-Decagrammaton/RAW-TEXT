[translation]
20048-848-200-1 = "Sensei, you're here. Please, come sit."
20048-848-210-1 = "There's a certain art to slacking off."
20048-848-220-1 = "Fufu... I'll teach you."
20048-848-230-1 = "I can't stop thinking about my work back at home."
20048-848-240-1 = "Are things running smoothly without me?"
20048-848-250-1 = "There seem to be commotions left and right. "
20048-848-260-1 = "It must be in my head, right?"
20048-848-270-1 = "It's time to head back."
20048-848-280-1 = "Until next time..."
20048-848-290-1 = "What is happening, Sensei?"
20048-848-300-1 = "It's hot..."
20048-848-310-1 = "We'll require some cold drinks."
20048-848-320-1 = "Um, besides the iced tea."
20048-848-330-1 = "Sensei, are you also interested in this book?"
20048-848-340-1 = "Sensei, the sun's hot, no?"
20048-848-350-1 = "Come under my parasol."
20048-848-1070-1 = "Take your time."
20048-848-1080-1 = "We've prepared plenty of items."
20048-848-1090-1 = "This is my first time serving customers."
20048-848-1100-1 = "So... Please be patient with me, Sensei."
20048-848-1110-1 = "Have you shopped to your heart's content?"
20048-848-1120-1 = "Now, let's return together, Sensei."
20048-848-1130-1 = "Hospitality is also a type of diplomacy...?"
20048-848-1140-1 = "I see. Thinking of it that way puts my mind at ease."
20048-848-1150-1 = "Stocks, calculations, first in, first out..."
20048-848-1160-1 = "These familiar words feel strangely unfamiliar today. "
20048-848-1170-1 = "You have a sharp eye, Sensei."
20048-848-1180-1 = "Please wait a moment. I'll wrap it for you."
20048-848-1190-1 = "Huh? Pick out something for myself?!"
20048-848-1200-1 = "Fufu, I appreciate the sentiment, but it's fine."
20048-848-1210-1 = "Fufu, am I doing a little better now?"
