[translation]
26017-240 = "부붐,\n부부부부부-\n부부부-!"
26017-250 = "방금건 추운날\n아침의 디젤 엔진\n시동소리 입니다."
26017-260 = "어떻습니까.\n비슷했을까요."
26017-270 = "다양한 전차가 많아서,\n텐션이 오릅니다."
26017-280 = "183호의 행방은\n과연-"
26017-290 = "……나레이션\n흉내였습니다."
26017-300 = "웃는 얼굴들이\n많군요……."
26017-310 = "저도 웃게 됩니다."
26017-320 = "게헨나컵, 끝났습니다.\n주차장 막히기 전에\n얼른 나가시지요."
26017-330 = "인파가 많은 행사입니다.\n어린아이를\n잃어버리지 않도록\n주의해주십시오."
26017-340 = "손을 잡으면,\n미아 방지가 됩니다."
26017-350 = "실험으로 증명된\n이론이니, 확실합니다."
26017-360 = "쓰담쓰담도 좋습니다만,\n손 잡기도\n잊지 말아주세요."
26017-370 = "저기가 \n재미있어보입니다.\n데려가주시면\n감사하겠습니다."
26017-470 = "음, 등가교환, 인가요."
26017-480 = "물건을 살 때는, 우선순위를\n책정하면 좋다고 생각합니다."
26017-490 = "세간에 '폐점 세일'이란게\n있다고 들었습니다만,\n여기는 하지 않는 모양이군요."
26017-500 = "저는 파는게 아닙니다.\n선생님이라면\n굳이 사지 않으셔도 됩니다."
26017-510 = "쓰담쓰담, 감사합니다.\n뭐라도 사드릴까요."
26017-520 = "최적의 상품이라 할 수 있겠군요."
26017-530 = "선생님도 사용하시나요?"
26017-540 = "선생님. '잔돈은 넣어둬'\n라는 말을 하신적 있으신가요."
26017-550 = "심부름 메모도 없이…….\n전부 외우셨군요. 멋이 있으십니다."
26017-640 = "과제군요. 받아들이죠."
26017-650 = "업무입니다.\n제가 해둘까도 생각했습니다만,"
26017-660 = "선생님의 즐거움을\n훔쳐가지 않겠습니다."
26017-670 = "냐앗."
26017-680 = "제 코…… 뭔가 문제가 있었을까요?\n오염되었거나, 형태가 이상했다던지?"
26017-690 = "선생님의 멋진 모습,\n질리질 않습니다."
26017-700 = "멋지군요, 뭔가 해냈습니다."
26017-710 = "자세한건 모릅니다만,"
26017-720 = "선생님이라면 아마도\n멋진일을 하셨겠지요."
26017-900 = "전차레이싱 미션에\n오신걸 환영합니다."
26017-910 = "보통 레이싱의 미션은\n'사고 안치기', '우승하기'정도로\n알고 있습니다만."
26017-920 = "먀앙."
26017-930 = "선생님은 제 뺨을 선호하시는건가요.\n기쁘다고 생각합니다."
26017-940 = "저는 시동버튼이 아닙니다.\n쓰담쓰담 쪽이 더 좋습니다."
26017-950 = "노력에는 보상이 따르죠……\n보상에도 노력이 따를까요?"
26017-960 = "보상 수령의 루트 파악했습니다.\n아주 간단하군요."
