[translation]
26017-864-240-1 = "ブン、\nブブブブブー\nブブブブブー！"
26017-864-250-1 = "今のは寒い朝の\nディーゼルエンジン\n駆動音です。"
26017-864-260-1 = "いかがでしょう、\n似ていましたか。"
26017-864-270-1 = "色んな戦車が見られて、\nテンションが\n上がります。"
26017-864-280-1 = "はたして、183号\n特別クラスの運命は――"
26017-864-290-1 = "……今のは天の声の\n真似です。"
26017-864-300-1 = "笑顔の人が\nたくさんいますね……。"
26017-864-310-1 = "こちらまで笑顔に\nなってしまいます。"
26017-864-320-1 = "ゲヘナカップ、\n終わりましたね。\n駐車場が混み合う前に、\n急いで帰りましょう。"
26017-864-330-1 = "人が密集しています。\n子供を迷子に\nさせないよう、\nご注意ください。"
26017-864-340-1 = "手を繋げば、\n迷子防止になります。"
26017-864-350-1 = "実験で証明された\n理論ですので、\n間違いありません。"
26017-864-360-1 = "なでなでも良いですが、\n手を繋ぐことも、\nお忘れなく。"
26017-864-370-1 = "あそこ、楽しそうです。\n連れていっていただけると\n嬉しいです。"
26017-864-470-1 = "ふむ、等価交換、ですか。"
26017-864-480-1 = "お買い物の際は、優先順位を\nつけると良いと思います。"
26017-864-490-1 = "世には「閉店セール」というものが\n存在すると聞いていましたが……。\nここではやっていないのですね。"
26017-864-500-1 = "私は売りものではありません。\nそれに、先生でしたら、\nわざわざ購入する必要もないかと。"
26017-864-510-1 = "なでなでを、\nありがとうございます。\n何か欲しいものはありますか？"
26017-864-520-1 = "最適な品といえるでしょう。"
26017-864-530-1 = "先生もお使いですか？"
26017-864-540-1 = "先生。「お釣りは取っておけ」\nと言ってみたこと、ありますか？"
26017-864-550-1 = "買い物メモもなしに……\n全部覚えられたんですね。\nカッコ良いです。"
26017-864-640-1 = "課題ですね。\n受けて立ちましょう。"
26017-864-650-1 = "お仕事です。代わりに\n終わらせておくことも\n検討しましたが、"
26017-864-660-1 = "先生の楽しみを奪っては、\nいけませんので。"
26017-864-670-1 = "にゃあっ。"
26017-864-680-1 = "私の鼻が……どうかされましたか？\n汚染されてましたか？\n変形してましたか？"
26017-864-690-1 = "先生のご活躍を、\nずっと眺めていたいです。"
26017-864-700-1 = "やりましたね。素敵です。"
26017-864-710-1 = "詳しいことは分かりませんが、"
26017-864-720-1 = "先生のことですので。\nきっと、何か素晴らしいことを\n成し遂げられたのでしょう。"
26017-864-900-1 = "戦車レーシングミッションへ、\nようこそ。"
26017-864-910-1 = "通常、レーシングのミッションとは\n「事故を起こさない」「優勝する」\nだと認識していますが。"
26017-864-920-1 = "みゃあ。"
26017-864-930-1 = "先生は私のほっぺたが\nお好きなんですね。\n嬉しく思います。"
26017-864-940-1 = "私はスタートボタンではありません。\nなでなでのほうが好きです。"
26017-864-950-1 = "努力には報酬が伴うものですが……\n報酬にも努力が伴うのでしょうか？"
26017-864-960-1 = "報酬受取のルートを把握。\nとても簡単なんですね。"
