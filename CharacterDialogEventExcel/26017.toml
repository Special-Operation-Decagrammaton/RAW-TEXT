[translation]
26017-240 = "ブン、\nブブブブブー\nブブブブブー！"
26017-250 = "今のは寒い朝の\nディーゼルエンジン\n駆動音です。"
26017-260 = "いかがでしょう、\n似ていましたか。"
26017-270 = "色んな戦車が見られて、\nテンションが\n上がります。"
26017-280 = "はたして、183号\n特別クラスの運命は――"
26017-290 = "……今のは天の声の\n真似です。"
26017-300 = "笑顔の人が\nたくさんいますね……。"
26017-310 = "こちらまで笑顔に\nなってしまいます。"
26017-320 = "ゲヘナカップ、\n終わりましたね。\n駐車場が混み合う前に、\n急いで帰りましょう。"
26017-330 = "人が密集しています。\n子供を迷子に\nさせないよう、\nご注意ください。"
26017-340 = "手を繋げば、\n迷子防止になります。"
26017-350 = "実験で証明された\n理論ですので、\n間違いありません。"
26017-360 = "なでなでも良いですが、\n手を繋ぐことも、\nお忘れなく。"
26017-370 = "あそこ、楽しそうです。\n連れていっていただけると\n嬉しいです。"
26017-470 = "ふむ、等価交換、ですか。"
26017-480 = "お買い物の際は、優先順位を\nつけると良いと思います。"
26017-490 = "世には「閉店セール」というものが\n存在すると聞いていましたが……。\nここではやっていないのですね。"
26017-500 = "私は売りものではありません。\nそれに、先生でしたら、\nわざわざ購入する必要もないかと。"
26017-510 = "なでなでを、\nありがとうございます。\n何か欲しいものはありますか？"
26017-520 = "最適な品といえるでしょう。"
26017-530 = "先生もお使いですか？"
26017-540 = "先生。「お釣りは取っておけ」\nと言ってみたこと、ありますか？"
26017-550 = "買い物メモもなしに……\n全部覚えられたんですね。\nカッコ良いです。"
26017-640 = "課題ですね。\n受けて立ちましょう。"
26017-650 = "お仕事です。代わりに\n終わらせておくことも\n検討しましたが、"
26017-660 = "先生の楽しみを奪っては、\nいけませんので。"
26017-670 = "にゃあっ。"
26017-680 = "私の鼻が……どうかされましたか？\n汚染されてましたか？\n変形してましたか？"
26017-690 = "先生のご活躍を、\nずっと眺めていたいです。"
26017-700 = "やりましたね。素敵です。"
26017-710 = "詳しいことは分かりませんが、"
26017-720 = "先生のことですので。\nきっと、何か素晴らしいことを\n成し遂げられたのでしょう。"
26017-900 = "戦車レーシングミッションへ、\nようこそ。"
26017-910 = "通常、レーシングのミッションとは\n「事故を起こさない」「優勝する」\nだと認識していますが。"
26017-920 = "みゃあ。"
26017-930 = "先生は私のほっぺたが\nお好きなんですね。\n嬉しく思います。"
26017-940 = "私はスタートボタンではありません。\nなでなでのほうが好きです。"
26017-950 = "努力には報酬が伴うものですが……\n報酬にも努力が伴うのでしょうか？"
26017-960 = "報酬受取のルートを把握。\nとても簡単なんですね。"
