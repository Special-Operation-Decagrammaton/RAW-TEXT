[translation]
20052-852-10-1 = "リスクなくして\nリターンなし。"
20052-852-20-1 = "さて、事業を\n始めましょうかぁ。"
20052-852-30-1 = "今こそ、\nお見せしましょう。"
20052-852-40-1 = "不毛の地・レッド\nウィンターで生き残った、\n我が出版部の手腕をっ！"
20052-852-50-1 = "……手腕というより、"
20052-852-60-1 = "サバイバル力、のほうが\nあってるかも\nしれませんがねぇ。"
20052-852-70-1 = "来てますねぇ……\n流れが、来てますねぇ！"
20052-852-80-1 = "出版部長として、\nこれはなんとしてでも\nモノにしてみせますよぉ！"
20052-852-90-1 = "どうして\nこんなことに……。"
20052-852-100-1 = "いえまあ……原因は\n特定できそうな気が、\nしますけど……"
20052-852-110-1 = "まだまだ諦めるわけには\nいきませんよ……！"
20052-852-120-1 = "いやぁ～一時は\nどうなることかと……。"
20052-852-130-1 = "うまくいって\n良かったです～……って、\n反省会、ですかぁ？"
20052-852-140-1 = "えっと……それは\nまた今度……じゃダメ、\nですかねぇ……？"
20052-852-150-1 = "クリエイターの\n皆さんは……"
20052-852-160-1 = "何かを生み出す力は\nあるのに、"
20052-852-170-1 = "それを広めることに\n関しては――"
20052-852-180-1 = "興味を示さないケースが、\n多いんですよねぇ……。"
20052-852-190-1 = "本……\n文章とは大切なもの。"
20052-852-200-1 = "それは最小限のインプット\nで最大限のアウトプットを\n引き出す――"
20052-852-210-1 = "「可能性」を\n秘めている商品、\nなのですから……！"
20052-852-220-1 = "何かをゼロから\n作り出せるということは、\n素晴らしいことです。"
20052-852-230-1 = "それを可能にさせる\n才能もまた。"
20052-852-240-1 = "……。"
20052-852-250-1 = "良いですよねぇ、\nそういう才能。"
20052-852-260-1 = "心から……\nそう思いますよぉ。"
20052-852-270-1 = "トリニティの生徒の\n皆さんには、心から\n感謝しているんですよぉ？"
20052-852-280-1 = "……そんな目でみないで\nくださいって。"
20052-852-290-1 = "ちゃ～んと、本心から\n思っていますとも。"
20052-852-620-1 = "事業の基本は\nなんだと思いますぅ？\n物品……？交換……？"
20052-852-630-1 = "もちろん、\nお金、ですよねぇ！"
20052-852-640-1 = "よくぞ\n来てくださりました！"
20052-852-650-1 = "資金と商品の行き交う、\n事業の現場へ！"
20052-852-660-1 = "ムフフ、では、\nどうぞごゆっくり。"
20052-852-670-1 = "棚の奥にお宝が眠ってる\nこともありますから。"
20052-852-680-1 = "最後までよ～く\nみていってくださいねぇ、先生。"
20052-852-690-1 = "ああ、もちろん私を\nじっくり見ても構いませんよ？"
20052-852-700-1 = "私に話しかけたところで、\n安くなることは\n絶対にないですよぉ？"
20052-852-710-1 = "割引が一つ決定するまで、\n裏では数えきれないほどの\n交渉と……"
20052-852-720-1 = "……政治的な取引が、\n行われているんですからぁ。"
20052-852-730-1 = "想像もしませんでしたよ、\n先生相手に事業を\nする日がくるだなんて。"
20052-852-740-1 = "いや～長生きして\nみるもんですねぇ。"
20052-852-750-1 = "おおっ！\nお目が高いですねぇ先生！"
20052-852-760-1 = "でしたらこちらも、\nよろしければ\nいかがですか？"
20052-852-770-1 = "ここだけの話ですが……。"
20052-852-780-1 = "私は成果物をこの目で\n確かめる瞬間が……一番、\n興奮するんですよぉ……！"
20052-852-790-1 = "良いですか？先生。\n文化とは、お金なのです。"
20052-852-800-1 = "すなわち、\n購入という行為は――"
20052-852-810-1 = "文化的な活動と\n言えるでしょう。"
20052-852-820-1 = "品質は\n保証いたしますよぉ？"
