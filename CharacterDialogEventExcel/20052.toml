[translation]
20052-852-10-1 = "With no risk, there's no return."
20052-852-20-1 = "Now then, shall we get to business...?"
20052-852-30-1 = "I'll show you now."
20052-852-40-1 = "The skills of a Publishing Department that survived a harsh Red Winter!"
20052-852-50-1 = "Well..."
20052-852-60-1 = "It's probably closer to \"survival instinct,\" though."
20052-852-70-1 = "It's here... The momentum is here!"
20052-852-80-1 = "I can't call myself the Publishing Department President if I miss this!"
20052-852-90-1 = "...How did it come to this...?"
20052-852-100-1 = "I mean... I have the gist of what caused this..."
20052-852-110-1 = "But I can't give up just yet..."
20052-852-120-1 = "Wow... I was really concerned at one point!"
20052-852-130-1 = "What? You're glad things went well, but I should reflect on myself?"
20052-852-140-1 = "Um... Can we push that back to a later time...?"
20052-852-150-1 = "Creators are..."
20052-852-160-1 = "...good at creating things..."
20052-852-170-1 = "...but they're surprisingly uninterested..."
20052-852-180-1 = "...in the methods to spread their works..."
20052-852-190-1 = "The reason why books...why text is important..."
20052-852-200-1 = "...is because they are products with the \"potential\" to bring..."
20052-852-210-1 = "...maximum output with minimal input!"
20052-852-220-1 = "It's incredible to be able to create something."
20052-852-230-1 = "The same goes for having the talent to make it happen."
20052-852-240-1 = "..."
20052-852-250-1 = "Having such talent, it's great."
20052-852-260-1 = "I truly...believe that."
20052-852-270-1 = "I'm thankful to the Trinity students."
20052-852-280-1 = "Huh, why are you looking at me like that?"
20052-852-290-1 = "I'm serious."
20052-852-620-1 = "What do you think the basics of business are, Sensei? Naturally there's exchange... Trade..."
20052-852-630-1 = "And money, of course!"
20052-852-640-1 = "Welcome!"
20052-852-650-1 = "To the heart of business, where money and goods flow freely!"
20052-852-660-1 = "Heh, heh, heh. Please look around!"
20052-852-670-1 = "There might be hidden treasure waiting deep inside the shelves."
20052-852-680-1 = "Keep your eyes peeled until the end, Sensei."
20052-852-690-1 = "Ah, of course, you can also keep your eyes peeled for me, you know?"
20052-852-700-1 = "The price isn't going down even if you talk to me, okay?"
20052-852-710-1 = "Offering a discount would require tremendous business considerations..."
20052-852-720-1 = "...and even closed-door political negotiations."
20052-852-730-1 = "I never thought I'd see a day when I'd be doing business with you, Sensei."
20052-852-740-1 = "Yeah, seriously, life's full of surprises."
20052-852-750-1 = "Nice, nice!"
20052-852-760-1 = "Is there anything else you need?"
20052-852-770-1 = "I'm only telling you this here..."
20052-852-780-1 = "It's so thrilling to see the results with my own eyes!"
20052-852-790-1 = "Culture is money. That's the reality."
20052-852-800-1 = "In that regard, what you just purchased..."
20052-852-810-1 = "...could be considered cultural in a sense, you know?"
20052-852-820-1 = "I guarantee the quality, okay?"
