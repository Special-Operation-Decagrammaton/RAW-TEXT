[translation]
20052-852-10-1 = "ถ้าไม่ลองเสี่ยงดู\nก็คงไม่รู้ผลหรอกค่ะ"
20052-852-20-1 = "ไหนดูซิ... มาเริ่มทำธุรกิจ\nกันเลยดีมั้ยคะ...?"
20052-852-30-1 = "ถึงเวลาที่ฉันจะแสดง\nให้คุณครูได้เห็นแล้วค่ะ"
20052-852-40-1 = "ฝีมือของชมรมสื่อสิ่งพิมพ์\nผู้อยู่รอดในเรดวินเทอร์!"
20052-852-50-1 = "อันที่จริง..."
20052-852-60-1 = "ฉันคิดว่ามันใกล้เคียง\nกับสัญชาตญาณ\nการเอาตัวรอดมากกว่า"
20052-852-70-1 = "มาแล้วค่ะ… จังหวะนี้แหละ!"
20052-852-80-1 = "ถ้าปล่อยให้หลุดมือไป\nอย่าเรียกตัวเองว่า\nชมรมสื่อสิ่งพิมพ์เลยค่ะ!"
20052-852-90-1 = "ทำไม…\nถึงเป็นแบบนี้ได้นะคะ..."
20052-852-100-1 = "ไม่หรอกค่ะ... ที่จริงแล้ว\nก็พอจะเดาสาเหตุ\nได้อยู่แล้วละค่ะ..."
20052-852-110-1 = "แต่ยังไงตอนนี้\nก็คงจะยอมแพ้\nไม่ได้หรอกค่ะ..."
20052-852-120-1 = "เฮ้อ~ ตอนนั้นก็เป็นห่วงแทบแย่\nว่าจะเป็นยังไงต่อไปน่ะค่ะ"
20052-852-130-1 = "คะ? ถึงจะโชคช่วย\nแต่ก็ควรสำนึกผิดบ้าง\nงั้นเหรอคะ?"
20052-852-140-1 = "คือ... เอาไว้\nค่อยทำคราวหน้า\nไม่ได้เหรอคะ...?"
20052-852-150-1 = "พวกผู้คนที่ใช้\nความคิดสร้างสรรค์น่ะค่ะ"
20052-852-160-1 = "พวกเขาสร้างสรรค์\nอะไรดีๆ ออกมาก็จริง"
20052-852-170-1 = "แต่วิธีที่จะเผยแพร่\nผลงานพวกนั้นออกไป"
20052-852-180-1 = "กลับน้อยมาก\nจนน่าใจหายเลยค่ะ..."
20052-852-190-1 = "เหตุผลที่หนังสือ...\nตัวอักษรเป็นสิ่งสำคัญ"
20052-852-200-1 = "เพราะมันเป็นสินค้าที่\nลงแรงลงทุนน้อย\nแต่กลับมี 'ความเป็นไปได้'"
20052-852-210-1 = "ที่จะทำให้เกิดผลลัพธ์\nที่ยิ่งใหญ่ยังไงล่ะคะ!"
20052-852-220-1 = "การที่จะทำบางอย่างออกมาได้\nเป็นสิ่งที่วิเศษไปเลยนะคะ"
20052-852-230-1 = "และการมีพรสวรรค์ที่จะทำให้\nสิ่งนั้นเป็นไปได้ก็เช่นกันค่ะ"
20052-852-240-1 = "......"
20052-852-250-1 = "ดีจังเลยนะคะ\nพรสวรรค์แบบนั้นน่ะ"
20052-852-260-1 = "ฉันคิดแบบนั้น...\nจากใจจริงค่ะ"
20052-852-270-1 = "ฉันรู้สึกขอบคุณ\nเหล่านักเรียนของทรีนิตี้\nมากเลยค่ะ"
20052-852-280-1 = "อะไรกันคะ\nทำไมมองแบบนั้นล่ะคะ"
20052-852-290-1 = "นั่นพูดออกมาจากใจเลยนะคะ"
20052-852-620-1 = "พื้นฐานของธุรกิจคืออะไรกันแน่คะ คุณครู?\nจะเป็นเรื่องแลกเปลี่ยน... พบปะ... หรือเปล่านะ"
20052-852-630-1 = "คงเป็นเรื่องเงินอยู่แล้วสินะคะ!"
20052-852-640-1 = "ยินดีต้อนรับค่ะ!"
20052-852-650-1 = "ขอต้อนรับเข้าสู่ สมรภูมิธุรกิจที่มีทั้งเงิน\nและสินค้าหมุนเวียนแห่งนี้ค่ะ!"
20052-852-660-1 = "ฮิ ฮิ ฮิ\nเชิญเลือกดูได้เลยค่ะ!"
20052-852-670-1 = "ที่ที่ลึกที่สุดของชั้นวาง บางครั้งก็\nมีขุมทรัพย์หลับใหลอยู่ยังไงล่ะคะ"
20052-852-680-1 = "เลือกดูให้ครบทุกซอกทุกมุม\nเลยนะคะ คุณครู"
20052-852-690-1 = "อ๊ะ หรือว่าจะจ้องมองฉัน\nให้เต็มที่ก็ยินดีนะคะ"
20052-852-700-1 = "ถึงจะพยายามชวนคุย\nแต่ฉันไม่ลดราคาให้หรอกนะคะ"
20052-852-710-1 = "กว่าจะตัดสินใจลดราคาได้แต่ละครั้ง\nก็ต้องคิดให้ดี เพราะเรื่องพวกนี้"
20052-852-720-1 = "บ่อยครั้งก็มีเรื่องธุรกิจ การเมือง อำนาจมืด\nเข้ามาเอี่ยวด้วยไม่น้อยเลยละค่ะ"
20052-852-730-1 = "นึกไม่ถึงเลยค่ะว่า จะมีวันที่ฉัน\nต้องมาทำธุรกิจกับคุณครูแบบนี้"
20052-852-740-1 = "อ่า~ จริงๆ เลยนะคะ ชีวิตคนเรา\nมีอะไรให้ประหลาดใจได้ตลอดเลย"
20052-852-750-1 = "ดีจังเลยค่ะ ดีจริงๆ เลย!"
20052-852-760-1 = "ยังมีอย่างอื่นที่คุณครูต้องการ\nเพิ่มเติมอีกรึเปล่าคะ?"
20052-852-770-1 = "เรื่องนี้ฉันบอกคุณครู\nที่นี่เท่านั้นนะคะ..."
20052-852-780-1 = "สำหรับฉันตอนที่ได้เห็น\nผลลัพธ์ด้วยตาของตัวเอง\nคือช่วงเวลาที่ตื่นเต้นที่สุดเลยค่ะ"
20052-852-790-1 = "วัฒนธรรมก็คือเงินค่ะ\nนี่คือโลกแห่งความเป็นจริงค่ะ"
20052-852-800-1 = "เพราะงั้นของที่คุณครู\nเพิ่งซื้อไปเมื่อกี้..."
20052-852-810-1 = "ในอีกแง่หนึ่ง มันก็อาจจะ\nเรียกได้ว่า 'วัฒนธรรม' อย่างหนึ่ง\nก็ได้นะคะ"
20052-852-820-1 = "เรื่องคุณภาพเอง\nก็ไว้ใจได้เลยค่ะ"
