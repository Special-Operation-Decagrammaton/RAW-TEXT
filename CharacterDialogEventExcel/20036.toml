[translation]
20036-814-510-1 = "さあ、先生！\n時間なんて無いわよ！\n早く行きましょう！"
20036-814-520-1 = "あ、先生！\nこっち、こっち！"
20036-814-530-1 = "ん？どうしたの？\nなにかやることある？"
20036-814-540-1 = "先生……\n何してんの。"
20036-814-550-1 = "それ、面白いと\n思ってんの？ねぇ？"
20036-814-560-1 = "変なことばっかして\nないでやることやって！\n早く！"
