[translation]
20036-814-510-1 = "來吧，老師！\n沒時間了！\n我們快走吧！"
20036-814-520-1 = "啊，老師！\n這邊，這邊！"
20036-814-530-1 = "嗯？怎麼了？\n有什麼事要做嗎？"
20036-814-540-1 = "老師……\n你在幹嘛啦。"
20036-814-550-1 = "你覺得那樣很有趣嗎？\n嗯？"
20036-814-560-1 = "別再做奇怪的事了，\n快做正事啦！快點！"
