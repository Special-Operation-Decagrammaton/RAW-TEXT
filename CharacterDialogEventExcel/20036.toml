[translation]
20036-814-510-1 = "자, 선생님!\n시간이 없어!\n빨리 가자고!"
20036-814-520-1 = "아, 선생님!\n이쪽이야, 이쪽!"
20036-814-530-1 = "응? 왜?\n해야 할 거 있어?"
20036-814-540-1 = "선생님…….\n뭐하는거야?"
20036-814-550-1 = "그거,\n재밌어하는 거야?\n어?"
20036-814-560-1 = "이상한 짓 좀\n하지 말고,\n해야할 걸 해! 얼른!"
