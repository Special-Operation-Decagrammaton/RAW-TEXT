[translation]
20036-814-510-1 = "เอาละ คุณครู!\nเราไม่มีเวลาแล้ว!\nรีบไปกันเถอะ!"
20036-814-520-1 = "อ๊ะ คุณครู!\nทางนี้ ทางนี้!"
20036-814-530-1 = "หืม? ทำไมเหรอ?\nมีอะไรต้องทำเหรอ?"
20036-814-540-1 = "คุณครู...\nทำอะไรน่ะ?"
20036-814-550-1 = "แบบนั้นมัน\nสนุกเหรอ?\nหา?"
20036-814-560-1 = "เลิกทำอะไรแปลกๆ\nแล้วไปทำเรื่องที่\nต้องทำได้แล้ว! เร็วเข้า!"
