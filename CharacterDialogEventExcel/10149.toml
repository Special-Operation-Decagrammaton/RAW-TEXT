[translation]
10149-861-10-1 = "ダイビング部へようこそ、\n先生！"
10149-861-20-1 = "昆布茶……\nよろしければどうぞ……。"
10149-861-30-1 = "ま、また私たちが\n何かミスって\nしまいましたか……？"
10149-861-40-1 = "うぅ……\n潜れなくなるのは\n嫌だなぁ……。"
10149-861-50-1 = "お宝の地図……"
10149-861-60-1 = "本当に、\nお宝ってあるのかな……。"
10149-861-70-1 = "……他に方法はない、か。"
10149-861-80-1 = "ふぅ……\nフジツボのお掃除、\n頑張ります……。"
10149-861-90-1 = "えっと……\nなにかご用でしょうか？"
10149-861-100-1 = "「アクアシール」の\nアイス……。"
10149-861-110-1 = "身体が冷えちゃうから、\nあんまり冷たいものを\n食べないように\nしていて……。"
10149-861-120-1 = "エアタンクの\nチャージ代に……\nレギュレーターの交換……"
10149-861-130-1 = "うぅ……\n今月も厳しそう……。"
10149-861-140-1 = "あは、あははっ！く、\nくすぐったいです……！"
10149-861-500-1 = "今日の先生は、\n私のバディですよ。"
10149-861-510-1 = "さあ、行きましょう。"
10149-861-520-1 = "水の世界へ。"
10149-861-530-1 = "一応……\n見落としがないか、\nもう一度確認しましょう。"
10149-861-540-1 = "お疲れ様です、先生。"
10149-861-550-1 = "今、片付けを\nしていたところです。"
10149-861-560-1 = "そ、その手信号は……"
10149-861-570-1 = "誤解しちゃいます……。"
10149-861-580-1 = "えっ！\nわ、私の後ろに、\nなにか……？"
10149-861-590-1 = "こ、怖いこと\n言わないでください！"
10149-861-600-1 = "サメならともかく、私、\nこ、怖いものは\n苦手なんです……！"
10149-861-610-1 = "この中に……\n何かがありそうです。"
10149-861-620-1 = "あっ……\nいま、動きましたよ！"
10149-861-630-1 = "見つけました！"
10149-861-640-1 = "わあ……！\nこれが隠れてたんですね！"
10149-861-650-1 = "次のポイントを\n目指しましょう。"
10149-861-660-1 = "ブリーフィングを\n始めます！"
10149-861-670-1 = "作業計画を伝えますので、\n集中してください……！"
10149-861-680-1 = "水中作業の時は、\nちゃんと目標を\n定めないといけません。"
10149-861-690-1 = "ど、どうしました？"
10149-861-700-1 = "……私、\nポイントを見逃してました？"
10149-861-710-1 = "もう終わったんですか？\n先生、すごいです……！"
10149-861-720-1 = "あ、はい！\nそれで大丈夫です！早い……。"
