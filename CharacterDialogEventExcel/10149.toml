[translation]
10149-10 = "ยะ... ยินดีต้อนรับ\nสู่ชมรมดำน้ำค่ะ คุณครู!"
10149-20 = "ระ... รับชาสาหร่ายสกัด...\nสักแก้วมั้ยคะ?"
10149-30 = "ชะ... ชมรมดำน้ำของเรา\nไปก่อความผิดพลาดอะไร\nเข้าอีกแล้วเหรอคะ?"
10149-40 = "อึก...\nไม่อยากให้\nดำน้ำไม่ได้เลย..."
10149-50 = "แผนที่สมบัติงั้นเหรอ..."
10149-60 = "ถึงจะไม่คิดว่า\nจะมีแผนที่สมบัติ\nจริงๆ ก็เถอะ..."
10149-70 = "แต่ตอนนี้...\nก็ไม่มีวิธีอื่นแล้วนี่คะ"
10149-80 = "สุดท้ายแล้วก็ต้อง\nเอาแต่ขัดเพรียงกันต่อไป\nอีกพักใหญ่อยู่ดีสินะคะ..."
10149-90 = "มีอะไรที่\nอยากให้ช่วย\nหรือเปล่าคะ?"
10149-100 = "ไอศกรีมของ\n<อควา ซีล> งั้นเหรอคะ..."
10149-110 = "ฉันไม่ค่อยชอบ\nของที่ทำให้ตัวเย็น\nเลยยังไม่เคยกินค่ะ"
10149-120 = "ค่าอัดถังอากาศ... บวกกับ\nค่าเปลี่ยนเรกูเลเตอร์\nตัวเก่าเข้าไปอีก..."
10149-130 = "อึก เดือนนี้ก็\nตึงมืออีกแล้วสินะ..."
10149-140 = "อะฮ่า อะฮะฮ่า!\nจะ... จั๊กจี้ค่ะ...!"
10149-500 = "วันนี้คุณครูช่วย\nเป็นบัดดี้ให้ฉันนะคะ"
10149-510 = "เอาละ ถ้างั้นก็\nลงไปสู่"
10149-520 = "โลกใต้ผิวน้ำกันมั้ยคะ?"
10149-530 = "เอาเป็นว่า... มาลองตรวจดู\nอีกสักครั้งดีกว่าค่ะ ว่ามีอะไร\nตกหล่นไปหรือเปล่า"
10149-540 = "อ๊ะ ยินดีต้อนรับค่ะ"
10149-550 = "กำลังจัดของ\nอยู่พอดีเลยค่ะ"
10149-560 = "ถะ... ถ้าส่ง\nสัญญาณมือแบบนั้น..."
10149-570 = "ฉันจะเข้าใจผิดเอานะคะ..."
10149-580 = "คะ?\nมีอะไรอยู่ข้างหลังฉัน...?"
10149-590 = "ยะ... อย่าพูด\nเรื่องน่ากลัวสิคะ!"
10149-600 = "ถ้าเป็นฉลามก็ว่าไปอย่าง\nแต่ฉันไม่ชอบเรื่องลี้ลับค่ะ!"
10149-610 = "ข้างในนี้...\nเหมือนจะมีอะไรอยู่ค่ะ"
10149-620 = "อ๊ะ...!\nเมื่อกี้มันขยับค่ะ!"
10149-630 = "เจอแล้วค่ะ!"
10149-640 = "ว้าว... ไม่นึกเลยว่า\nจะมีของแบบนี้ซ่อนอยู่..."
10149-650 = "จะย้ายไป\nจุดถัดไปนะคะ"
10149-660 = "จะเริ่มการสรุป\nก่อนลงน้ำค่ะ!"
10149-670 = "จะ... จากนี้ไป ฉันจะ\nอธิบายแผนงานให้ฟัง\nตั้งใจฟังนะคะ...!"
10149-680 = "ก่อนทำงานใต้น้ำ\nการกำหนดเป้าหมายให้ชัดเจน\nเป็นเรื่องสำคัญค่ะ"
10149-690 = "มะ... มีอะไรเหรอคะ?"
10149-700 = "หรือว่ามีจุดไหน\nที่ฉันตกหล่นไปเหรอคะ...?"
10149-710 = "สะ... เสร็จแล้วเหรอคะ?\nสุดยอดเลยค่ะ"
10149-720 = "ค่ะ ค่ะ! ใช่แล้วค่ะ...\nเร็วมากเลยนะคะ"
