[translation]
10149-10 = "다, 다이빙부에\n어서 오세요. 선생님!"
10149-20 = "다, 다시마 차라도……\n한 잔 드릴까요?"
10149-30 = "저, 저희 다이빙부가\n또 무슨 실수라도\n저질렀나요?"
10149-40 = "우으……\n다이빙을 할 수 없게\n되는 건 싫은데……"
10149-50 = "보물 지도라……"
10149-60 = "제대로 된 보물 지도가\n있을 거라고\n생각하진 않지만……"
10149-70 = "……지금은\n다른 방법도 없으니."
10149-80 = "결국 한동안은\n따개비 청소만\n계속하게 되었네요……."
10149-90 = "뭔가,\n부탁하실 일이라도\n있으신가요?"
10149-100 = "<아쿠아 씰>의\n아이스크림이라……"
10149-110 = "저는 몸이 찬 건\n그리 좋아하지 않아서,\n먹어본 적은 없지만요."
10149-120 = "공기통 충전 비용에……\n낡은 레귤레이터\n교체 비용까지\n더하면……"
10149-130 = "으으,\n이번 달도 빠듯한가……"
10149-140 = "아하, 아하핫!\n가, 간지러워요……!"
10149-500 = "오늘은 선생님께서\n제 버디가 되어주세요."
10149-510 = "자, 그럼\n수면 아래의 세계로"
10149-520 = "들어가 볼까요?"
10149-530 = "일단은…… 놓친 건\n없는지, 다시 한 번\n확인해 보죠."
10149-540 = "아, 어서오세요."
10149-550 = "마침 정리를\n하던 중이었어요."
10149-560 = "그, 그런\n수신호를 보내시면……"
10149-570 = "오해해 버린다고요……"
10149-580 = "네?\n제 뒤에 뭔가가……?"
10149-590 = "무, 무서운 소리\n말아주세요!"
10149-600 = "저 상어라면 몰라도\n오컬트는 싫어하니까요!"
10149-610 = "이 안에……\n뭔가 있는 것 같네요."
10149-620 = "앗……!\n방금 움직였어요!"
10149-630 = "찾았습니다!"
10149-640 = "우와…… 이런 게\n숨어 있었을 줄이야……"
10149-650 = "다음 포인트로\n이동할게요."
10149-660 = "사전 브리핑을\n시작하겠습니다!"
10149-670 = "지, 지금부터\n작업 계획을 말씀드릴테니\n집중해주세요……!"
10149-680 = "수중 작업 전에는\n확실히 목표를\n정리하는 게 중요해요."
10149-690 = "무, 무슨 일이신가요?"
10149-700 = "……혹시 제가 놓친\n포인트라도 있나요?"
10149-710 = "버, 벌써 끝나셨나요?\n대단하시네요."
10149-720 = "네, 네! 맞아요……\n빠르시네요."
