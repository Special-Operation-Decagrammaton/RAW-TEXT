[translation]
10149-861-10-1 = "W-Welcome to the Diving Club, Sensei!"
10149-861-20-1 = "W-Would you like...a cup of kelp tea?"
10149-861-30-1 = "D-Did our Diving Club make a mistake again?"
10149-861-40-1 = "Ugh... I hate the idea of not being able to dive anymore..."
10149-861-50-1 = "A treasure map..."
10149-861-60-1 = "I don't suppose there's a proper treasure map..."
10149-861-70-1 = "...But I suppose we have no other choice."
10149-861-80-1 = "So we wound up cleaning barnacles for a while..."
10149-861-90-1 = "Is there something you'd like from me?"
10149-861-100-1 = "Ice cream from \"Aqua Seal\"..."
10149-861-110-1 = "I don't like things that give me the chills, so I never had it before."
10149-861-120-1 = "If I add the air tank refill cost...to the price of replacing the old regulator..."
10149-861-130-1 = "Ugh, this month is going to be tight as well..."
10149-861-140-1 = "Aha, ahaha! Th-That tickles...!"
10149-861-500-1 = "Please be my buddy today, Sensei."
10149-861-510-1 = "Now, shall we dive into the world"
10149-861-520-1 = "beneath the surface?"
10149-861-530-1 = "Let's...double check to make sure we didn't miss anything."
10149-861-540-1 = "Ah, welcome."
10149-861-550-1 = "I was just cleaning up."
10149-861-560-1 = "I-If you give hand signals like that..."
10149-861-570-1 = "I might misunderstand..."
10149-861-580-1 = "What? There's something behind me...?"
10149-861-590-1 = "D-Don't say scary things like that!"
10149-861-600-1 = "I might be fine with that shark, but I hate occult stuff!"
10149-861-610-1 = "It feels like...there's something in here."
10149-861-620-1 = "Ah...! It just moved!"
10149-861-630-1 = "Found it!"
10149-861-640-1 = "Whoa... I didn't expect something like this to be hiding here..."
10149-861-650-1 = "Moving to the next point."
10149-861-660-1 = "Let's start the preliminary briefing!"
10149-861-670-1 = "I-I'll begin explaining the work plan now, so please focus...!"
10149-861-680-1 = "It's important to set clear objectives before an underwater operation."
10149-861-690-1 = "Wh-What's that?"
10149-861-700-1 = "...Did I skip over a point?"
10149-861-710-1 = "Y-You're already done? That's amazing."
10149-861-720-1 = "Y-Yes! That's right... You're quick."
