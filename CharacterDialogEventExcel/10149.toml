[translation]
10149-10 = "W-Welcome to the Diving Club, Sensei!"
10149-20 = "W-Would you like...a cup of kelp tea?"
10149-30 = "D-Did our Diving Club make a mistake again?"
10149-40 = "Ugh... I hate the idea of not being able to dive anymore..."
10149-50 = "A treasure map..."
10149-60 = "I don't suppose there's a proper treasure map..."
10149-70 = "...But I suppose we have no other choice."
10149-80 = "So we wound up cleaning barnacles for a while..."
10149-90 = "Is there something you'd like from me?"
10149-100 = "Ice cream from \"Aqua Seal\"..."
10149-110 = "I don't like things that give me the chills, so I never had it before."
10149-120 = "If I add the air tank refill cost...to the price of replacing the old regulator..."
10149-130 = "Ugh, this month is going to be tight as well..."
10149-140 = "Aha, ahaha! Th-That tickles...!"
10149-500 = "Please be my buddy today, Sensei."
10149-510 = "Now, shall we dive into the world"
10149-520 = "beneath the surface?"
10149-530 = "Let's...double check to make sure we didn't miss anything."
10149-540 = "Ah, welcome."
10149-550 = "I was just cleaning up."
10149-560 = "I-If you give hand signals like that..."
10149-570 = "I might misunderstand..."
10149-580 = "What? There's something behind me...?"
10149-590 = "D-Don't say scary things like that!"
10149-600 = "I might be fine with that shark, but I hate occult stuff!"
10149-610 = "It feels like...there's something in here."
10149-620 = "Ah...! It just moved!"
10149-630 = "Found it!"
10149-640 = "Whoa... I didn't expect something like this to be hiding here..."
10149-650 = "Moving to the next point."
10149-660 = "Let's start the preliminary briefing!"
10149-670 = "I-I'll begin explaining the work plan now, so please focus...!"
10149-680 = "It's important to set clear objectives before an underwater operation."
10149-690 = "Wh-What's that?"
10149-700 = "...Did I skip over a point?"
10149-710 = "Y-You're already done? That's amazing."
10149-720 = "Y-Yes! That's right... You're quick."
