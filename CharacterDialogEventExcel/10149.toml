[translation]
10149-10 = "ダイビング部へようこそ、\n先生！"
10149-20 = "昆布茶……\nよろしければどうぞ……。"
10149-30 = "ま、また私たちが\n何かミスって\nしまいましたか……？"
10149-40 = "うぅ……\n潜れなくなるのは\n嫌だなぁ……。"
10149-50 = "お宝の地図……"
10149-60 = "本当に、\nお宝ってあるのかな……。"
10149-70 = "……他に方法はない、か。"
10149-80 = "ふぅ……\nフジツボのお掃除、\n頑張ります……。"
10149-90 = "えっと……\nなにかご用でしょうか？"
10149-100 = "「アクアシール」の\nアイス……。"
10149-110 = "身体が冷えちゃうから、\nあんまり冷たいものを\n食べないように\nしていて……。"
10149-120 = "エアタンクの\nチャージ代に……\nレギュレーターの交換……"
10149-130 = "うぅ……\n今月も厳しそう……。"
10149-140 = "あは、あははっ！く、\nくすぐったいです……！"
10149-500 = "今日の先生は、\n私のバディですよ。"
10149-510 = "さあ、行きましょう。"
10149-520 = "水の世界へ。"
10149-530 = "一応……\n見落としがないか、\nもう一度確認しましょう。"
10149-540 = "お疲れ様です、先生。"
10149-550 = "今、片付けを\nしていたところです。"
10149-560 = "そ、その手信号は……"
10149-570 = "誤解しちゃいます……。"
10149-580 = "えっ！\nわ、私の後ろに、\nなにか……？"
10149-590 = "こ、怖いこと\n言わないでください！"
10149-600 = "サメならともかく、私、\nこ、怖いものは\n苦手なんです……！"
10149-610 = "この中に……\n何かがありそうです。"
10149-620 = "あっ……\nいま、動きましたよ！"
10149-630 = "見つけました！"
10149-640 = "わあ……！\nこれが隠れてたんですね！"
10149-650 = "次のポイントを\n目指しましょう。"
10149-660 = "ブリーフィングを\n始めます！"
10149-670 = "作業計画を伝えますので、\n集中してください……！"
10149-680 = "水中作業の時は、\nちゃんと目標を\n定めないといけません。"
10149-690 = "ど、どうしました？"
10149-700 = "……私、\nポイントを見逃してました？"
10149-710 = "もう終わったんですか？\n先生、すごいです……！"
10149-720 = "あ、はい！\nそれで大丈夫です！早い……。"
