[translation]
10149-861-10-1 = "歡迎來到潛水部，\n老師！"
10149-861-20-1 = "昆布茶……\n不嫌棄的話請用……"
10149-861-30-1 = "我、我們是不是\n又闖了什麼禍\n呢……？"
10149-861-40-1 = "嗚嗚……\n不能再潛水的話\n我會很難過的……"
10149-861-50-1 = "藏寶圖……"
10149-861-60-1 = "真的，\n會有寶藏嗎……"
10149-861-70-1 = "……也沒別的辦法了，是吧。"
10149-861-80-1 = "呼……\n清理藤壺這件事，\n我會加油的……"
10149-861-90-1 = "那個……\n有什麼事嗎？"
10149-861-100-1 = "「Aqua Seal」的\n冰淇淋……"
10149-861-110-1 = "因為身體會變冷，\n所以我盡量\n不吃太冰的東西\n……"
10149-861-120-1 = "氣瓶的\n充氣費用……\n還有調節器的更換……"
10149-861-130-1 = "嗚嗚……\n這個月看來也很吃緊……"
10149-861-140-1 = "啊哈、啊哈哈！\n好、好癢啊……！"
10149-861-500-1 = "今天的老師，\n就是我的潛伴喔。"
10149-861-510-1 = "那麼，我們出發吧。"
10149-861-520-1 = "前往水中的世界。"
10149-861-530-1 = "姑且……\n再確認一次\n有沒有遺漏吧。"
10149-861-540-1 = "辛苦你了，老師。"
10149-861-550-1 = "我現在正在\n收拾東西。"
10149-861-560-1 = "那、那個手勢是……"
10149-861-570-1 = "我會誤會的啦……"
10149-861-580-1 = "咦！\n我、我的後面，\n有什麼東西……？"
10149-861-590-1 = "別、別說這麼\n可怕的話啦！"
10149-861-600-1 = "鯊魚也就算了，我、\n我最怕可怕的\n東西了……！"
10149-861-610-1 = "這裡面……\n好像有什麼東西呢。"
10149-861-620-1 = "啊……\n剛剛動了一下！"
10149-861-630-1 = "找到了！"
10149-861-640-1 = "哇啊……！\n原來藏著這個啊！"
10149-861-650-1 = "我們前往\n下一個定點吧。"
10149-861-660-1 = "簡報\n現在開始！"
10149-861-670-1 = "我要說明作業計畫了，\n請大家專心聽……！"
10149-861-680-1 = "進行水中作業時，\n一定要確實\n設定好目標才行。"
10149-861-690-1 = "怎、怎麼了嗎？"
10149-861-700-1 = "……我是不是\n漏看了哪個定點？"
10149-861-710-1 = "已經結束了嗎？\n老師，你好厲害……！"
10149-861-720-1 = "啊、好的！\n這樣就可以了！好快……"
