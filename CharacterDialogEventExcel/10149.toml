[translation]
10149-861-10-1 = "ยะ... ยินดีต้อนรับ\nสู่ชมรมดำน้ำค่ะ คุณครู!"
10149-861-20-1 = "ระ... รับชาสาหร่ายสกัด...\nสักแก้วมั้ยคะ?"
10149-861-30-1 = "ชะ... ชมรมดำน้ำของเรา\nไปก่อความผิดพลาดอะไร\nเข้าอีกแล้วเหรอคะ?"
10149-861-40-1 = "อึก...\nไม่อยากให้\nดำน้ำไม่ได้เลย..."
10149-861-50-1 = "แผนที่สมบัติงั้นเหรอ..."
10149-861-60-1 = "ถึงจะไม่คิดว่า\nจะมีแผนที่สมบัติ\nจริงๆ ก็เถอะ..."
10149-861-70-1 = "แต่ตอนนี้...\nก็ไม่มีวิธีอื่นแล้วนี่คะ"
10149-861-80-1 = "สุดท้ายแล้วก็ต้อง\nเอาแต่ขัดเพรียงกันต่อไป\nอีกพักใหญ่อยู่ดีสินะคะ..."
10149-861-90-1 = "มีอะไรที่\nอยากให้ช่วย\nหรือเปล่าคะ?"
10149-861-100-1 = "ไอศกรีมของ\n<อควา ซีล> งั้นเหรอคะ..."
10149-861-110-1 = "ฉันไม่ค่อยชอบ\nของที่ทำให้ตัวเย็น\nเลยยังไม่เคยกินค่ะ"
10149-861-120-1 = "ค่าอัดถังอากาศ... บวกกับ\nค่าเปลี่ยนเรกูเลเตอร์\nตัวเก่าเข้าไปอีก..."
10149-861-130-1 = "อึก เดือนนี้ก็\nตึงมืออีกแล้วสินะ..."
10149-861-140-1 = "อะฮ่า อะฮะฮ่า!\nจะ... จั๊กจี้ค่ะ...!"
10149-861-500-1 = "วันนี้คุณครูช่วย\nเป็นบัดดี้ให้ฉันนะคะ"
10149-861-510-1 = "เอาละ ถ้างั้นก็\nลงไปสู่"
10149-861-520-1 = "โลกใต้ผิวน้ำกันมั้ยคะ?"
10149-861-530-1 = "เอาเป็นว่า... มาลองตรวจดู\nอีกสักครั้งดีกว่าค่ะ ว่ามีอะไร\nตกหล่นไปหรือเปล่า"
10149-861-540-1 = "อ๊ะ ยินดีต้อนรับค่ะ"
10149-861-550-1 = "กำลังจัดของ\nอยู่พอดีเลยค่ะ"
10149-861-560-1 = "ถะ... ถ้าส่ง\nสัญญาณมือแบบนั้น..."
10149-861-570-1 = "ฉันจะเข้าใจผิดเอานะคะ..."
10149-861-580-1 = "คะ?\nมีอะไรอยู่ข้างหลังฉัน...?"
10149-861-590-1 = "ยะ... อย่าพูด\nเรื่องน่ากลัวสิคะ!"
10149-861-600-1 = "ถ้าเป็นฉลามก็ว่าไปอย่าง\nแต่ฉันไม่ชอบเรื่องลี้ลับค่ะ!"
10149-861-610-1 = "ข้างในนี้...\nเหมือนจะมีอะไรอยู่ค่ะ"
10149-861-620-1 = "อ๊ะ...!\nเมื่อกี้มันขยับค่ะ!"
10149-861-630-1 = "เจอแล้วค่ะ!"
10149-861-640-1 = "ว้าว... ไม่นึกเลยว่า\nจะมีของแบบนี้ซ่อนอยู่..."
10149-861-650-1 = "จะย้ายไป\nจุดถัดไปนะคะ"
10149-861-660-1 = "จะเริ่มการสรุป\nก่อนลงน้ำค่ะ!"
10149-861-670-1 = "จะ... จากนี้ไป ฉันจะ\nอธิบายแผนงานให้ฟัง\nตั้งใจฟังนะคะ...!"
10149-861-680-1 = "ก่อนทำงานใต้น้ำ\nการกำหนดเป้าหมายให้ชัดเจน\nเป็นเรื่องสำคัญค่ะ"
10149-861-690-1 = "มะ... มีอะไรเหรอคะ?"
10149-861-700-1 = "หรือว่ามีจุดไหน\nที่ฉันตกหล่นไปเหรอคะ...?"
10149-861-710-1 = "สะ... เสร็จแล้วเหรอคะ?\nสุดยอดเลยค่ะ"
10149-861-720-1 = "ค่ะ ค่ะ! ใช่แล้วค่ะ...\nเร็วมากเลยนะคะ"
