[translation]
20010-808-230-1 = "歡迎光臨。\n歡迎來到227號溫泉浴場！"
20010-808-240-1 = "啊哇哇！老，老師！？\n咦，請問今天\n有預約嗎……！？"
20010-808-250-1 = "從溫泉浴場開始營運，\n轉眼間已經一周了。"
20010-808-260-1 = "我是不是也快要\n培養出身為\n女將的風采了呢……！"
20010-808-270-1 = "溫泉浴場的營運\n居然會是件\n這麼困難的事……"
20010-808-280-1 = "真是讓人意想不到。"
20010-808-290-1 = "雖然溫泉浴場已經\n不在了……但我是不會\n因為這點小事就氣餒的！"
20010-808-300-1 = "不只能賺錢，\n還能飽覽許多\n漂亮的景色……"
20010-808-310-1 = "溫泉浴場，最棒了呢！"
20010-808-320-1 = "怎麼了嗎，老師？\n有什麼備品不夠了嗎？"
20010-808-330-1 = "呵呵……現在的我\n和從前的我已經完全\n不一樣了唷！"
20010-808-340-1 = "呵呵，\n現在的我\n游刃有餘到……"
20010-808-350-1 = "餐後的布丁\n可以吃兩個！"
20010-808-360-1 = "溫泉商品也\n準備了很多唷！"
20010-808-370-1 = "如果有用不到的東西，\n可以在這裡和\n別的商品進行交換！"
20010-808-380-1 = "雖然遺憾，但是\n227號溫泉浴場的營業\n已經結束了……"
20010-808-390-1 = "老師？\n怎麼了嗎？"
20010-808-400-1 = "就，就算是老師，\n免費給您也……！"
20010-808-410-1 = "謝謝惠顧！"
20010-808-420-1 = "一直以來\n很謝謝你，老師。"
20010-808-430-1 = "感謝您\n今天的惠顧！"
20010-808-440-1 = "這，這麼好的東西，\n我真的，可以收下嗎……？"
