[translation]
20010-808-230-1 = "Hello. Welcome to the Hot Springs Resort No. 227!"
20010-808-240-1 = "Wow! S-Sensei?! D-Did you have a reservation for today?!"
20010-808-250-1 = "It's been almost one week since I started running the hot springs resort."
20010-808-260-1 = "I think I can call myself a good hostess, right?"
20010-808-270-1 = "I didn't know that running a hot springs resort..."
20010-808-280-1 = "...would be so difficult."
20010-808-290-1 = "The hot springs resort is gone...but I won't give up!"
20010-808-300-1 = "I can earn money and enjoy the beautiful scenery..."
20010-808-310-1 = "The hot springs resort is the best!"
20010-808-320-1 = "Yes? Are you all out of bath products?"
20010-808-330-1 = "Heehee... I'm no longer the old me!"
20010-808-340-1 = "Heehee. Now that I am overflowing with tranquility..."
20010-808-350-1 = "I'm planning on eating two puddings after my meal!"
20010-808-360-1 = "I'm preparing items needed to run a hot springs resort!"
20010-808-370-1 = "If you have any unused products, we'll exchange them for other items here!"
20010-808-380-1 = "Unfortunately, Hot Springs Resort No. 227 is closed for business..."
20010-808-390-1 = "Sensei? How can I help you?"
20010-808-400-1 = "E-Even if it's Sensei, I can't give it away for free, okay?"
20010-808-410-1 = "Thank you for the great deal."
20010-808-420-1 = "Thank you for always helping me, Sensei."
20010-808-430-1 = "Thank you for your business today!"
20010-808-440-1 = "C-Can I really accept such a good item?"
