[translation]
20010-808-230-1 = "어서 오세요.\n227호 온천장에 오신\n것을 환영합니다!"
20010-808-240-1 = "아와와! 서, 선생님!?\n어라, 오늘 예약이 되어\n있으셨던가요……!?"
20010-808-250-1 = "온천장을 운영한 지 벌써\n1주일 가까이 되었네요."
20010-808-260-1 = "이만하면 저도\n훌륭한 여주인이라\n할 수 있겠죠?"
20010-808-270-1 = "온천장을 운영하는 게\n이렇게 어려운 일일 줄은……"
20010-808-280-1 = "전에는 미처 몰랐어요."
20010-808-290-1 = "온천장은 사라지고 말았\n지만……저는 이런 일로\n실망하지 않으니까요!"
20010-808-300-1 = "돈도 벌고\n아름다운 풍경도 잔뜩\n볼 수 있다니…"
20010-808-310-1 = "온천장은 최고네요!"
20010-808-320-1 = "무슨 일이신가요,\n선생님? 무언가 부족한\n물품이라도 있나요?"
20010-808-330-1 = "후후…… 지금의 저는,\n지금까지와는 완전히\n다르니까요!"
20010-808-340-1 = "후후.\n지금의 저는 여유가\n넘쳐나기 때문에……"
20010-808-350-1 = "식사 후에\n푸딩을 두 개나\n먹을 예정이랍니다!"
20010-808-360-1 = "온천 용품도 잔뜩\n준비하고 있답니다!"
20010-808-370-1 = "혹시 안 쓰는 물건이\n있으시다면 여기서\n다른 상품으로 교환해드릴게요!"
20010-808-380-1 = "아쉬운 일입니다만,\n227호 온천장의 영업은\n종료되었습니다……"
20010-808-390-1 = "선생님?\n무슨 일이신가요?"
20010-808-400-1 = "아, 아무리 선생님이라\n하더라도 공짜로\n드릴 수는 없거든요?"
20010-808-410-1 = "좋은 거래에 감사드립니다."
20010-808-420-1 = "언제나 도와주셔서\n감사합니다, 선생님."
20010-808-430-1 = "오늘도 이용해주셔서\n감사합니다!"
20010-808-440-1 = "이, 이런 좋은 물건을\n받아도 괜찮은 걸까요?"
