[translation]
20010-808-230-1 = "いらっしゃいませ。\n227号温泉郷へようこそ！"
20010-808-240-1 = "あわわっ！せ、先生！？\nあれ、今日ご予約\nされてましたっけ……！？"
20010-808-250-1 = "この温泉郷を\n運営し始めてから、\nはや1週間。"
20010-808-260-1 = "そろそろ私も、女将としての\n風格が出てきたのでは\nないでしょうか……！"
20010-808-270-1 = "温泉の運営が\nこんなにも難しい\nことだったなんて……"
20010-808-280-1 = "想像していませんでした"
20010-808-290-1 = "温泉郷は無くなって\nしまいましたが……これしきの\nことでめげる私ではありません！"
20010-808-300-1 = "お金も稼げて、\nきれいな景色も\nたくさん見られて……"
20010-808-310-1 = "温泉郷、最高ですね！"
20010-808-320-1 = "どうかしましたか、先生？\n何か足りない\n備品とかありました？"
20010-808-330-1 = "ふふっ……今の私は、\nこれまでとは一味も二味も\n違いますよ！"
20010-808-340-1 = "ふふっ、今の私は\n余裕があるので何と……"
20010-808-350-1 = "食後にプリンを、\n二つも食べちゃいます！"
20010-808-360-1 = "温泉グッズなどもたくさん\n準備していますよ！"
20010-808-370-1 = "もし使っていないものなどが\nありましたら、こちらで別の商品と\n交換させていただきます！"
20010-808-380-1 = "無念ではありますが、\n227号温泉郷の営業は\n終了いたしました……。"
20010-808-390-1 = "先生？\nどうされましたか？"
20010-808-400-1 = "い、いくら先生でも、\nタダでお渡しするわけには……！"
20010-808-410-1 = "お買い上げありがとう\nございます！"
20010-808-420-1 = "いつもありがとうございます、\n先生。"
20010-808-430-1 = "本日もご利用いただき、\nありがとうございます！"
20010-808-440-1 = "こ、こんなに良い物を\n頂いてしまって、\n良いのでしょうか……！？"
