[translation]
20010-808-230-1 = "สวัสดีค่ะคุณครู\nยินดีต้อนรับสู่\nออนเซ็น No.227 ค่ะ"
20010-808-240-1 = "วะ..ว้าย! คะ...คุณครู?!\nเอ๋? วันนี้จองที่พักเอาไว้\nแล้วอย่างนั้นเหรอคะ…!?"
20010-808-250-1 = "ออนเซ็นของเราเปิดมาได้\nตอนนี้ก็ครบ 1 อาทิตย์แล้วค่ะ"
20010-808-260-1 = "ถ้าแบบนี้...ตอนนี้ฉัน\nก็เรียกได้ว่าเป็นนายหญิง\nที่ยอดเยี่ยมแล้วใช่ไหมคะ?"
20010-808-270-1 = "ฉันไม่เคยรู้เลยว่าดูแลออนเซ็น\nจะเป็นงานที่ยากแบบนี้..."
20010-808-280-1 = "ฉันไม่รู้มาก่อนเลยล่ะค่ะ"
20010-808-290-1 = "ตอนนี้ออนเซ็นหายไปแล้ว\nแต่ฉันไม่ยอมแพ้แค่นี้หรอกค่ะ!"
20010-808-300-1 = "ได้ดูวิวที่สวยงาม\nพร้อมกับหาเงินได้แบบนี้..."
20010-808-310-1 = "ออนเซ็นนี่ยอดเยี่ยมที่สุดเลยค่ะ!"
20010-808-320-1 = "มีอะไรเหรอคะคุณครู\nอุปกรณ์อาบน้ำ\nหมดแล้วเหรอคะ?"
20010-808-330-1 = "ฮุฮุ ตอนนี้ฉันไม่ใช่คนเดิม\nแบบเมื่อก่อนแล้วนะคะ!"
20010-808-340-1 = "ฮุฮุ เพราะว่าตอนนี้...\nฉันรู้สึกผ่อนคลายมากเลยค่ะ..."
20010-808-350-1 = "หลังจากทานมื้ออาหารแล้ว\nพวกเราวางแผนจะกิน\nพุดดิ้งสักสองถ้วยเลยละค่ะ!"
20010-808-360-1 = "ฉันเตรียมสิ่งของจำเป็น\nสำหรับบริการเอาไว้เยอะแยะเลยค่ะ!"
20010-808-370-1 = "ถ้ามีสิ่งของที่ไม่ได้ใช้ในออนเซ็น\nสามารถมาแลกเป็นไอเทมอื่น\nกับพวกเราได้นะคะ!"
20010-808-380-1 = "ถึงจะน่าเสียดาย...\nแต่ออนเซ็น No.227 ของเรา\nปิดให้บริการแล้วค่ะ..."
20010-808-390-1 = "คุณครู มีเรื่องอะไรหรือเปล่าคะ?"
20010-808-400-1 = "ถะ...ถึงจะเป็นคุณครูก็เถอะ\nแต่ก็คงจะให้ไปฟรีๆ ไม่ได้หรอกนะคะ"
20010-808-410-1 = "ขอบคุณที่มาใช้บริการแลกเปลี่ยนค่ะ"
20010-808-420-1 = "ไม่ว่าเมื่อไหร่...\nคุณครูก็ช่วยฉันอยู่เสมอ\nขอบคุณมากเลยค่ะ!"
20010-808-430-1 = "วันนี้ก็ขอบคุณที่มาใช้บริการนะคะ!"
20010-808-440-1 = "ขะ...ของดีๆ แบบนี้\nให้ฉันได้จริงๆ เหรอคะ?"
20010-10808-230-1 = "สวัสดีค่ะคุณครู\nยินดีต้อนรับสู่\nออนเซ็น No.227 ค่ะ"
