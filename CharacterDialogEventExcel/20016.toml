[translation]
20016-813-210-1 = "真是的，\n問題堆積如山呢。"
20016-813-220-1 = "唉……真是\n做不下去了。"
20016-813-230-1 = "已經過了不少時間，\n還趕得上嗎？"
20016-813-240-1 = "差不多該收尾了呢……\n直到最後都不能掉以輕心。"
20016-813-250-1 = "因為我討厭麻煩的事。"
20016-813-260-1 = "看來已經平靜下來了呢。\n辛苦你了，老師。"
20016-813-270-1 = "交流會好像\n被搞得一團糟了呢。"
20016-813-280-1 = "唉……真希望\n多少能考慮一下\n負責善後的人的立場。"
20016-813-290-1 = "為什麼要跑到別人的\n自治區來收拾殘局……"
20016-813-300-1 = "這種事就是\n中階管理者的\n辛苦的地方。"
20016-813-850-1 = "這些就是不得不\n解決的問題呢。"
20016-813-860-1 = "清單的確認\n就拜託你了唷，老師。"
20016-813-870-1 = "雖然很麻煩……\n不過正因如此，\n更慶幸有老師在呢。"
20016-813-880-1 = "好～～～累……"
20016-813-890-1 = "呼……解決一件事了，對吧。"
20016-813-900-1 = "解決了嗎？\n辛苦了。"
