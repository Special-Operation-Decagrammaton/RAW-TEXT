20016-813-210-1 = "Seriously, there are so many problems."
20016-813-220-1 = "*sigh*... I can't do this."
20016-813-230-1 = "It's taking a while. Do you think it can be done in time?"
20016-813-240-1 = "It's getting there...but don't let your guard down until the end."
20016-813-250-1 = "I hate annoying stuff."
20016-813-260-1 = "It looks like the commotion ended. Great work, Sensei."
20016-813-270-1 = "The exchange meeting somehow ended up a mess."
20016-813-280-1 = "*sigh* ...Why can't they consider the person who has to clean up the mess afterwards?"
20016-813-290-1 = "Why am I in still stuck putting things in order in a different district?"
20016-813-300-1 = "I guess this is the pain of a middle manager."
20016-813-850-1 = "These are the problems that need to be solved."
20016-813-860-1 = "Please check the list, Sensei."
20016-813-870-1 = "It's annoying, but I'm glad you're with me, Sensei."
