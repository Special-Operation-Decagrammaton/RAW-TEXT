[translation]
20016-140 = "全く、\n問題が山積みですね"
20016-150 = "はぁ……やってられ\nませんねー……。"
20016-160 = "交流会、何だか\nめちゃくちゃになって\nしまいましたね"
20016-170 = "はぁ……少しは後処理を\nする人の立場も考えて\nほしいものです"
20016-180 = "どうして他所の自治区に\n来てまで、後始末を……"
20016-190 = "こういうのが、\n中間管理職の\n辛いところですね"
20016-210 = "全く、\n問題が山積みですね"
20016-220 = "はぁ……やってられ\nませんねー……。"
20016-230 = "結構時間も\n経っていますが、\n間に合いそうですか？"
20016-240 = "そろそろ仕上げですね……\n最後まで油断しない\nように。"
20016-250 = "面倒ごとは嫌なので。"
20016-260 = "どうやら落ち着いたよう\nですね。お疲れ様でした、\n先生。"
20016-270 = "交流会、何だか\nめちゃくちゃになって\nしまいましたね"
20016-280 = "はぁ……少しは後処理を\nする人の立場も考えて\nほしいものです"
20016-290 = "どうして他所の自治区に\n来てまで、後始末を……"
20016-300 = "こういうのが、\n中間管理職の\n辛いところですね"
20016-850 = "この辺りが、\n解決しなくては\nいけないものですね"
20016-860 = "リストの確認、\nよろしくお願いしますよ。\n先生"
20016-870 = "めんどくさいですが……\nだからこそ、先生がいて\n良かったですね"
20016-880 = "だーーーるい……"
20016-890 = "ふぅ……一件落着、\nですかね"
20016-900 = "解決しましたか、\nお疲れ様です"
20016-1140 = "やることが山積みですね。\n二つ以上も\nあるじゃないですか。"
20016-1150 = "山積みですよ。"
20016-1160 = "……いつもの仕事よりは\n幾分まとも、\nですね。ふふ。"
20016-1170 = "う、髪が乱れます。"
20016-1180 = "雑だと言われたことは\nありませんか？"
20016-1190 = "はあ、帽子には\n触らないでください。\n被り直すの、大変なんですよ。"
20016-1200 = "報酬に興味はありませんが、\n別にいらないわけでは\nありません。"
20016-1210 = "報酬もあるとは……いいですね。"
