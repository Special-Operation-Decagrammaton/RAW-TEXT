[translation]
20016-813-210-1 = "全く、\n問題が山積みですね"
20016-813-220-1 = "はぁ……やってられ\nませんねー……。"
20016-813-230-1 = "結構時間も\n経っていますが、\n間に合いそうですか？"
20016-813-240-1 = "そろそろ仕上げですね……\n最後まで油断しない\nように。"
20016-813-250-1 = "面倒ごとは嫌なので。"
20016-813-260-1 = "どうやら落ち着いたよう\nですね。お疲れ様でした、\n先生。"
20016-813-270-1 = "交流会、何だか\nめちゃくちゃになって\nしまいましたね"
20016-813-280-1 = "はぁ……少しは後処理を\nする人の立場も考えて\nほしいものです"
20016-813-290-1 = "どうして他所の自治区に\n来てまで、後始末を……"
20016-813-300-1 = "こういうのが、\n中間管理職の\n辛いところですね"
20016-813-850-1 = "この辺りが、\n解決しなくては\nいけないものですね"
20016-813-860-1 = "リストの確認、\nよろしくお願いしますよ。\n先生"
20016-813-870-1 = "めんどくさいですが……\nだからこそ、先生がいて\n良かったですね"
20016-813-880-1 = "だーーーるい……"
20016-813-890-1 = "ふぅ……一件落着、\nですかね"
20016-813-900-1 = "解決しましたか、\nお疲れ様です"
20016-864-1140-1 = "やることが山積みですね。\n二つ以上も\nあるじゃないですか。"
20016-864-1150-1 = "山積みですよ。"
20016-864-1160-1 = "……いつもの仕事よりは\n幾分まとも、\nですね。ふふ。"
20016-864-1170-1 = "う、髪が乱れます。"
20016-864-1180-1 = "雑だと言われたことは\nありませんか？"
20016-864-1190-1 = "はあ、帽子には\n触らないでください。\n被り直すの、大変なんですよ。"
20016-864-1200-1 = "報酬に興味はありませんが、\n別にいらないわけでは\nありません。"
20016-864-1210-1 = "報酬もあるとは……いいですね。"
