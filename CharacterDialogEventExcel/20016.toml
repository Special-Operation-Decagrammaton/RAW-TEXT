[translation]
20016-813-210-1 = "จริงๆ เลย\nมีปัญหาเยอะแยะเลยนะคะ"
20016-813-220-1 = "เฮ้อ...\nไม่ไหวจริงๆ ด้วยค่ะ"
20016-813-230-1 = "เวลาผ่านไปขนาดนี้แล้ว\nคุณครูจะยอมมาตาม\nเวลาที่ฉันขอได้รึเปล่าคะ"
20016-813-240-1 = "รู้สึกเหมือนจัดการทุกอย่างแล้ว...\nแต่ว่าเราจะวางใจ\nจนกว่าจะเสร็จงานไม่ได้ค่ะ"
20016-813-250-1 = "ถึงฉันจะไม่ชอบ\nงานที่น่ารำคาญก็เถอะ"
20016-813-260-1 = "เหมือนว่าจะจัดการเรื่องวุ่นวายได้\nแล้วนะคะ เหนื่อยหน่อยนะคะ\nคุณครู"
20016-813-270-1 = "งานแลกเปลี่ยนคราวนี้\nกลายเป็นงานที่วุ่นวายไปซะแล้วค่ะ"
20016-813-280-1 = "เฮ้อ... อยากให้คิดถึง\nหน้าที่ของคนที่ต้องคอย\nเก็บกวาดงานบ้างจังเลยค่ะ"
20016-813-290-1 = "ทำไมถึงมาที่เขตปกครองตนเอง\nของคนอื่นแล้วสร้างความวุ่นวาย..."
20016-813-300-1 = "เรื่องแบบนี้\nในฐานะผู้ดูแลกลาง\nมันน่าปวดหัวมากเลยค่ะ"
20016-813-850-1 = "นี่เป็นปัญหาที่จะต้อง\nแก้ไขสินะคะ"
20016-813-860-1 = "รบกวนตรวจสอบรายการ\nด้วยนะคะ คุณครู"
20016-813-870-1 = "ถึงจะน่ารำคาญสักหน่อย\nแต่มีคุณครูอยู่ด้วยแบบนี้\nค่อยยังชั่วหน่อยค่ะ"
20016-813-880-1 = "เหนื่อย~ จัง~ เลย~"
20016-813-890-1 = "ฮู่ว... ผ่านไปได้\nอีกเรื่องนึงแล้วนะคะ"
20016-813-900-1 = "แก้ไขได้แล้วเหรอคะ?\nขอบคุณมากค่ะ"
