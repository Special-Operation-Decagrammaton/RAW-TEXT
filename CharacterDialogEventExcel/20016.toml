[translation]
20016-864-1140-1 = "やることが山積みですね。\n二つ以上も\nあるじゃないですか。"
20016-864-1150-1 = "山積みですよ。"
20016-864-1160-1 = "……いつもの仕事よりは\n幾分まとも、\nですね。ふふ。"
20016-864-1170-1 = "う、髪が乱れます。"
20016-864-1180-1 = "雑だと言われたことは\nありませんか？"
20016-864-1190-1 = "はあ、帽子には\n触らないでください。\n被り直すの、大変なんですよ。"
20016-864-1200-1 = "報酬に興味はありませんが、\n別にいらないわけでは\nありません。"
20016-864-1210-1 = "報酬もあるとは……いいですね。"
