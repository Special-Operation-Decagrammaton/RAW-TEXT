[translation]
20045-835-920-1 = "Welcome to~\nเฮียกคิยาโค!"
20045-835-930-1 = "ยินดีต้อนรับสู่เฮียกคิยาโคค่ะ~!"
20045-835-940-1 = "คุณครู!\nกำลังสนุกอยู่มั้ยคะ?"
20045-835-950-1 = "ตอนนี้ฉันคุ้นชินขึ้นเยอะเลย!\nจะพยายามจนถึงที่สุดเลยค่ะ!"
20045-835-960-1 = "คุณครู! ต่อไปก็มาเฮียกคิยาโค\nแล้วมาหาพีน่าอีกนะคะ!"
20045-835-970-1 = "ท้าดา! ถ้าเป็นเรื่องไกด์\nให้เป็นหน้าที่ของฉันเองค่ะ!"
20045-835-980-1 = "ฉันจะระมัดระวัง\nจะได้ไม่หลงทางค่ะ!"
20045-835-990-1 = "พอมีคุณครูอยู่ด้วย\nก็มีชีวิตชีวาขึ้นเลยนะคะ"
20045-835-1000-1 = "ทุกคนสนุกกัน\nพีน่าก็ชื่นใจค่ะ"
