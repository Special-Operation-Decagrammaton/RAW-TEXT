[translation]
20045-835-920-1 = "Welcome to~\n백귀야행!"
20045-835-930-1 = "백귀야행에 어서 오세요~!"
20045-835-940-1 = "선생님!\n잘 즐기고 계신가요?"
20045-835-950-1 = "이제는 제법 익숙해졌습니다!\n마지막까지 힘내겠습니다!"
20045-835-960-1 = "선생님! 다음에도 백귀야행과\n이 피나를 찾아주세요!"
20045-835-970-1 = "짜잔! 가이드는\n맡겨라! 입니다!"
20045-835-980-1 = "미아가 되지 않도록\n조심하는 겁니다!"
20045-835-990-1 = "선생님도 함께하셔서\n더 활기차네요."
20045-835-1000-1 = "모두가 즐거워서,\n피나는 기쁩니다!"
