[translation]
20045-835-920-1 = "Welcome to～\n百鬼夜行！"
20045-835-930-1 = "歡迎來到百鬼夜行～！"
20045-835-940-1 = "老師！\n玩得還開心嗎？"
20045-835-950-1 = "我已經大致\n習慣當導覽員了！會努力到最後的唷！"
20045-835-960-1 = "下次來百鬼夜行的時候，\n請跟菲娜說一聲哦！"
20045-835-970-1 = "鏘～！\n導覽就交給我吧！的說！"
20045-835-980-1 = "請小心不要迷路了哦！"
20045-835-990-1 = "有老師在，\n既熱鬧又開心呢！"
20045-835-1000-1 = "大家感覺都很高興，\n菲娜也很開心！"
