[translation]
20045-835-920-1 = "Welcome to～\n百鬼夜行！"
20045-835-930-1 = "百鬼夜行へ、ようこそ\nいらっしゃいマシタッ！"
20045-835-940-1 = "センセイ！\n楽しんでマスか？"
20045-835-950-1 = "だいぶガイドにも\n慣れてきマシタ！\n最後まで頑張りマスよ！"
20045-835-960-1 = "また百鬼夜行に\nお越しの際は、\nフィーナに\nお声がけクダサイね！"
20045-835-970-1 = "ジャーン！\nガイドは\nお任せあれ！デス！"
20045-835-980-1 = "迷子にならないように\n気をつけてクダサイね！"
20045-835-990-1 = "先生がいると、\n賑やかで楽しいデス！"
20045-835-1000-1 = "みんなが楽しそうで、\nフィーナも嬉しいデス！"
