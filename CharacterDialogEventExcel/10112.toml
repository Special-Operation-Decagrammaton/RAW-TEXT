[translation]
10112-843-390-1 = "Ah! Sensei! Over here!"
10112-843-400-1 = "Master... No, I mean..."
10112-843-410-1 = "Sensei! I've been waiting for this!"
10112-843-420-1 = "Yahoo! Are you having fun, Sensei?"
10112-843-430-1 = "Let's have fun till the end, Mas— I mean Sensei!"
10112-843-440-1 = "Wow, it's already over. Time really does fly."
10112-843-450-1 = "But I had sooo much fun!"
10112-843-460-1 = "Sensei, is there anyplace you want to go? I'll guide you."
10112-843-470-1 = "Hm? What? Is there anything you'd like to ask me?"
10112-843-480-1 = "Ahaha! That tickles!"
10112-843-490-1 = "Did you want to play, Sensei?"
10112-843-500-1 = "Heehee, then I'll tickle you too, Sensei! Come here!"
