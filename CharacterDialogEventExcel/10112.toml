[translation]
10112-843-390-1 = "あ！先生！\nこっちだよー！"
10112-843-400-1 = "ご主人様……\nじゃなくて、"
10112-843-410-1 = "先生！やっと会えた～！"
10112-843-420-1 = "やほ！\n先生！楽しんでるー？"
10112-843-430-1 = "ふふっ、\n最後まで遊びつくそ～！\nご主人様、ううん、先生！"
10112-843-440-1 = "はあ～終わっちゃった。\nあっという\n間だったね……"
10112-843-450-1 = "……もちろん！\nすっ～～ごく、\n楽しかったよ！"
10112-843-460-1 = "先生、どこか行きたい\nところある？\n案内するよ～"
10112-843-470-1 = "うん？どうしたの？\n何か頼み事？"
10112-843-480-1 = "あはは、\nくすぐったい～！"
10112-843-490-1 = "もしかして先生、\n遊びたいの？"
10112-843-500-1 = "じゃあ私も先生を\nこちょこちょしちゃお～！\n逃がさないよ～あははっ！"
