[translation]
10112-843-390-1 = "อ๊ะ! คุณครู!\nทางนี้~!"
10112-843-400-1 = "นายท่าน... ไม่สิ"
10112-843-410-1 = "คุณครู!\nในที่สุดก็ได้เจอกันแล้ว~!"
10112-843-420-1 = "ยะฮู้ว! คุณครู!\nกำลังสนุกอยู่มั้ย~?"
10112-843-430-1 = "ฮุฮุ มาสนุกกัน\nจนจบงานเลยนะ~! นายท่าน\nไม่สิ คุณครู!"
10112-843-440-1 = "งานจบแล้วเหรอเนี่ย\nเวลาผ่านไปไวจังเลยเนอะ?"
10112-843-450-1 = "แต่ว่าฉันก็\nสนุกมากๆ เลยละ!"
10112-843-460-1 = "คุณครู อยากไป\nตรงไหนหรือเปล่า?\nฉันจะพาไปเอง~"
10112-843-470-1 = "หืม? ทำไมล่ะ?\nมีเรื่องอยากขอให้\nอาสึนะทำให้เหรอ?"
10112-843-480-1 = "อะฮ่าฮ่า จั๊กจี้นะ~!"
10112-843-490-1 = "คุณครูอยาก\nเล่นสนุกเหรอ?"
10112-843-500-1 = "ฮิฮิ งั้นอาสึนะ\nก็จะจั๊กจี้คุณครูบ้าง! เอาละ\nมาทางนี้สิ! เร็วเข้า!"
