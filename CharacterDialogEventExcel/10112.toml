[translation]
10112-843-390-1 = "아! 선생님!\n이쪽이야~!"
10112-843-400-1 = "주인님…… 이 아니라,"
10112-843-410-1 = "선생님!\n드디어 만났다~!"
10112-843-420-1 = "야호! 선생님!\n즐기고 있어~?"
10112-843-430-1 = "후훗, 마지막까지\n놀아보자구~! 주인님,\n아니, 선생님!"
10112-843-440-1 = "벌써 끝이라니,\n시간이 너무 빠르지?"
10112-843-450-1 = "하지만 너무너무\n즐거웠어!"
10112-843-460-1 = "선생님, 어디 가고\n싶은 곳 있어?\n안내할게~"
10112-843-470-1 = "응? 왜?\n아스나에게 부탁할\n일이라도 있어?"
10112-843-480-1 = "아하하, 간지러워~!"
10112-843-490-1 = "혹시 선생님,\n놀고 싶은 거야?"
10112-843-500-1 = "헤헤, 그럼 아스나도\n선생님 간지럽힐래! 자,\n이쪽으로 와! 얼른!"
