[translation]
10112-843-390-1 = "啊！老師！\n這邊唷～！"
10112-843-400-1 = "主人……不對，"
10112-843-410-1 = "老師！\n終於見到你了～！"
10112-843-420-1 = "呀齁！老師！\n玩得開心嗎～？"
10112-843-430-1 = "呵呵，要玩到\n最後一刻唷～！\n主人，不對，老師！"
10112-843-440-1 = "啊～結束了。\n真是一轉眼\n就過去了呢……"
10112-843-450-1 = "……當然！\n我非～～常開心唷！"
10112-843-460-1 = "老師，你有想\n去什麼地方嗎？\n我可以帶你去唷～"
10112-843-470-1 = "嗯？怎麼了？\n有事要拜託我嗎？"
10112-843-480-1 = "啊哈哈，好癢哦～！"
10112-843-490-1 = "難道老師，\n你想玩嗎？"
10112-843-500-1 = "那我也來對老師\n搔癢癢吧～！不會\n讓你逃走的唷～啊哈哈！"
