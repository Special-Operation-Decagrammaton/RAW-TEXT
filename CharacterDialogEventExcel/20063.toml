[translation]
20063-140 = "게헨나컵에\n어서와, 선생님."
20063-150 = "1차 목표는 안전.\n2차 목표는 소중한\n과정 거치기야."
20063-160 = "나도, 모두를\n본받아야겠어."
20063-170 = "휘발유와 화약 냄새가\n짙어서……\n두근두근해."
20063-180 = "최선을 다한 모두가\n원래의 일상으로 돌아가."
20063-190 = "이런거,\n좋아했던 것 같아."
20063-200 = "혹시 더워?\n같이 우산 쓸래?"
20063-210 = "쓰다듬는거, 좋아.\n그렇지만 지금은\n사람이 많으니까\n나중에……."
20063-220 = "다같이 많은 경험을\n하면 좋겠어."
20063-230 = "친구, 많이\n만들 수 있으려나."
20063-560 = "임무 개시다."
20063-570 = "최우선 순위부터,\n먼저 정리해보는거야."
20063-580 = "무슨 일이야, 선생님.\n혹시, 같이 사진 찍고 싶은거야?"
20063-590 = "이것도 미션이야?\n목록에 없는 것 같은데."
20063-600 = "목표와 지시가 확실한 것,\n아주 좋아해."
20063-610 = "당연한 보상이야.\n선생님이 노력했으니까."
20063-620 = "그렇지, 마음에 드는 결과야."
20063-820 = "실전같은 훈련,\n항상 환영이야."
20063-830 = "제압과 우승 말고도\n여러 목표가 있구나. 신기해."
20063-840 = "좋은 상대들이 많아서,\n기대되는걸."
20063-850 = "최근, 근육이 조금 줄은 것 같아.\n좀 더 훈련해야겠어."
20063-860 = "응? 불렀어?\n용건이 있다면,\n언제건 무전으로 불러줘."
20063-870 = "기쁜걸, 내가 도움이 되었어."
20063-880 = "어때, 선생님?\n내가 조금은 빚을 갚게 된걸까?"
