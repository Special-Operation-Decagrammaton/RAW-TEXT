[translation]
20063-864-140-1 = "게헨나컵에\n어서 와, 선생님."
20063-864-150-1 = "1차 목표는 안전.\n2차 목표는 소중한\n과정 거치기야."
20063-864-160-1 = "나도, 모두를\n본받아야겠어."
20063-864-170-1 = "휘발유와 화약 냄새가\n짙어서……\n두근두근해."
20063-864-180-1 = "최선을 다한 모두가\n원래의 일상으로 돌아가."
20063-864-190-1 = "이런 거,\n좋아했던 것 같아."
20063-864-200-1 = "혹시 더워?\n같이 우산 쓸래?"
20063-864-210-1 = "쓰다듬는 거, 좋아.\n그렇지만 지금은\n사람이 많으니까\n나중에……."
20063-864-220-1 = "다 같이 많은 경험을\n하면 좋겠어."
20063-864-230-1 = "친구, 많이\n만들 수 있으려나."
20063-864-560-1 = "임무 개시다."
20063-864-570-1 = "최우선 순위부터,\n먼저 정리해 보는 거야."
20063-864-580-1 = "무슨 일이야, 선생님.\n혹시, 같이 사진 찍고 싶은 거야?"
20063-864-590-1 = "이것도 미션이야?\n목록에 없는 것 같은데."
20063-864-600-1 = "목표와 지시가 확실한 것,\n아주 좋아해."
20063-864-610-1 = "당연한 보상이야.\n선생님이 노력했으니까."
20063-864-620-1 = "그렇지, 마음에 드는 결과야."
20063-864-820-1 = "실전 같은 훈련,\n항상 환영이야."
20063-864-830-1 = "제압과 우승 말고도\n여러 목표가 있구나. 신기해."
20063-864-840-1 = "좋은 상대들이 많아서,\n기대되는걸."
20063-864-850-1 = "최근, 근육이 조금 준 것 같아.\n좀 더 훈련해야겠어."
20063-864-860-1 = "응? 불렀어?\n용건이 있다면,\n언제건 무전으로 불러줘."
20063-864-870-1 = "기쁜걸, 내가 도움이 되었어."
20063-864-880-1 = "어때, 선생님?\n내가 조금은 빚을 갚게 된 걸까?"
