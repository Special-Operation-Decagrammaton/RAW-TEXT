[translation]
20063-140 = "ゲヘナカップへ\nようこそ、先生。"
20063-150 = "大切な思い出を\n作りたい。そのためにも、\nまずは安全第一だ。"
20063-160 = "私も、みんなを\n見習わないと。"
20063-170 = "ガソリンと\n火薬のにおいが\n充満してて……\nわくわくする。"
20063-180 = "みんなが最善を\n出し合って、\n日常に戻っていく。"
20063-190 = "こういうのが好きなんだ。"
20063-200 = "暑いのか？\nパラソル、一緒に使う？"
20063-210 = "撫でられるの\nは好きだけど……\n今は人が多いから、\nまた後で……。"
20063-220 = "みんなと\n色んな経験が\nできるといいな。"
20063-230 = "友達、たくさん\n作れるだろうか。"
20063-560 = "任務開始。"
20063-570 = "最優先事項から片づけよう。"
20063-580 = "どうしたんだ、先生？\nもしかして、一緒に\n写真を撮りたいのか？"
20063-590 = "ミッションのリストには\nなかったと思うけど。"
20063-600 = "先生は指示と目標が明確だから、\nとてもやりやすい。"
20063-610 = "当然の報酬だ。\n先生の努力の賜物だな。"
20063-620 = "うん、満足いく結果だ。"
20063-820 = "実践形式の訓練は\nいつでも歓迎だ。"
20063-830 = "制圧と優勝以外にも、\n目標が山のようにあるんだな。"
20063-840 = "相手にとって不足なし。\n楽しみだ。"
20063-850 = "最近、少し筋肉が\n落ちた気がする。\nもっと訓練しないと。"
20063-860 = "ん、なんだ？\n用事があるなら、\nいつでも無線で呼べばいい。"
20063-870 = "私も力になれて嬉しい。"
20063-880 = "どうだろう？\n少しは先生に返せているか？"
