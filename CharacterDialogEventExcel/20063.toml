[translation]
20063-864-140-1 = "ゲヘナカップへ\nようこそ、先生。"
20063-864-150-1 = "大切な思い出を\n作りたい。そのためにも、\nまずは安全第一だ。"
20063-864-160-1 = "私も、みんなを\n見習わないと。"
20063-864-170-1 = "ガソリンと\n火薬のにおいが\n充満してて……\nわくわくする。"
20063-864-180-1 = "みんなが最善を\n出し合って、\n日常に戻っていく。"
20063-864-190-1 = "こういうのが好きなんだ。"
20063-864-200-1 = "暑いのか？\nパラソル、一緒に使う？"
20063-864-210-1 = "撫でられるの\nは好きだけど……\n今は人が多いから、\nまた後で……。"
20063-864-220-1 = "みんなと\n色んな経験が\nできるといいな。"
20063-864-230-1 = "友達、たくさん\n作れるだろうか。"
20063-864-560-1 = "任務開始。"
20063-864-570-1 = "最優先事項から片づけよう。"
20063-864-580-1 = "どうしたんだ、先生？\nもしかして、一緒に\n写真を撮りたいのか？"
20063-864-590-1 = "ミッションのリストには\nなかったと思うけど。"
20063-864-600-1 = "先生は指示と目標が明確だから、\nとてもやりやすい。"
20063-864-610-1 = "当然の報酬だ。\n先生の努力の賜物だな。"
20063-864-620-1 = "うん、満足いく結果だ。"
20063-864-820-1 = "実践形式の訓練は\nいつでも歓迎だ。"
20063-864-830-1 = "制圧と優勝以外にも、\n目標が山のようにあるんだな。"
20063-864-840-1 = "相手にとって不足なし。\n楽しみだ。"
20063-864-850-1 = "最近、少し筋肉が\n落ちた気がする。\nもっと訓練しないと。"
20063-864-860-1 = "ん、なんだ？\n用事があるなら、\nいつでも無線で呼べばいい。"
20063-864-870-1 = "私も力になれて嬉しい。"
20063-864-880-1 = "どうだろう？\n少しは先生に返せているか？"
