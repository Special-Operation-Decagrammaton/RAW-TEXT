[translation]
10026-806-10-1 = "喂！\n工作時間到囉，老師！"
10026-806-20-1 = "沒時間摸魚了，\n走吧！"
10026-806-30-1 = "我是要做就要\n做得徹底的類型。"
10026-806-40-1 = "喂，趕快開始收拾吧！"
10026-806-50-1 = "善後工作就交給我吧，\n那是我擅長的領域！"
10026-806-60-1 = "有什麼事\n需要我幫忙嗎，老師？"
10026-806-70-1 = "哈哈！不錯嘛！"
10026-806-80-1 = "那麼，不是做\n這種事的時候了。"
10026-806-90-1 = "為，為什麼要那樣\n一直盯著我看啊……\n來，趕快開始工作吧。"
10026-806-550-1 = "那麼～去清掃一下吧？"
10026-806-560-1 = "那麼，快開始吧！"
10026-806-570-1 = "怎麼？\n你在幫我加油嗎？\n哈！挺有趣的啊。"
10026-806-580-1 = "對我來說，\n這只是\n小菜一碟！"
10026-806-590-1 = "嘿，挺有品味的嘛？"
10026-806-600-1 = "會好好幹活的。"
10026-10806-10-1 = "喂！\n工作時間到了，老師！"
10026-10806-20-1 = "沒時間悠哉了，\n走吧！"
10026-10806-30-1 = "我是既然要做，\n就做得徹底的類型。"
10026-10806-40-1 = "好啦，開始收拾吧！"
10026-10806-50-1 = "善後工作就交給我吧，\n這是我的專業領域！"
10026-10806-60-1 = "有什麼需要幫忙嗎，\n老師？"
10026-10806-70-1 = "哈哈！還不壞嘛！"
10026-10806-80-1 = "好了，\n現在不是磨蹭的時候。"
10026-10806-90-1 = "為，為什麼要那樣\n一直盯著我看啊……\n好了，快點開始工作吧。"
