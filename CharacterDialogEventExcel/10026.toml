[translation]
10026-806-10-1 = "자아-!\n일 할 시간이야, 선생!"
10026-806-20-1 = "지체할 시간 없다고.\n바로 시작하지!"
10026-806-30-1 = "미리미리 처리하는 게\n취향이라서 말이지."
10026-806-40-1 = "깔끔하게 마무리\n지어 보자고."
10026-806-50-1 = "뒷정리야?\n그런 건 또 내 전문이지!"
10026-806-60-1 = "뭔가 더 시킬\n일이라도 있어, 선생?"
10026-806-70-1 = "크하하하!\n나쁘지 않네!"
10026-806-80-1 = "꾸물거릴 시간 없다고."
10026-806-90-1 = "왜, 왜 계속 쳐다보는 거야.\n빨리 일이나 하자니까?"
10026-806-550-1 = "자~ 청소라도 하러 갈까?"
10026-806-560-1 = "자아, 빨리 시작하자고!"
10026-806-570-1 = "뭐야.\n격려해 주는 거야?\n하! 재미있네."
10026-806-580-1 = "나한테 걸리면,\n이 정도는\n식은 죽 먹기지!"
10026-806-590-1 = "헤에.\n제법 센스가 있잖아?"
10026-806-600-1 = "일은 확실하게 한다고."
