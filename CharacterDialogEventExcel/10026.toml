[translation]
10026-806-10-1 = "おらっ！\n仕事の時間だぞ、先生！"
10026-806-20-1 = "油売ってる暇はねぇ、\n行くぞ！"
10026-806-30-1 = "やるからには徹底的に\nやるタイプでなぁ。"
10026-806-40-1 = "おらっ、片付け始めんぞ！"
10026-806-50-1 = "後片付けなら任せとけ、\nあたしの専門分野だ！"
10026-806-60-1 = "何か手伝うことでも\nあるか、先生？"
10026-806-70-1 = "ははっ！悪くねぇな！"
10026-806-80-1 = "さて、こうしてる\n場合じゃねぇな。"
10026-806-90-1 = "なっ、何をそんなじっと\n見てんだよ……。ほら、\nさっさと仕事始めんぞ。"
10026-806-550-1 = "さあ～て、掃除でもしに行くか？"
10026-806-560-1 = "さあ、早く始めようぜっ！"
10026-806-570-1 = "なんだ？応援でも\nしてくれてんのか？\nはっ！面白いじゃん。"
10026-806-580-1 = "あたしにかかれば、\nこれくれぇ朝飯前だ！"
10026-806-590-1 = "へえ、なかなか\nセンスあるじゃねえか？"
10026-806-600-1 = "仕事はきっちりやるぞ。"
