[translation]
10026-806-10-1 = "เอาล่ะ...!\nได้เวลาทำงานแล้วคุณครู!"
10026-806-20-1 = "ไม่มีเวลาพักแล้วนะ\nเริ่มเลยแล้วกัน!"
10026-806-30-1 = "ฉันเป็นพวกที่ชอบ\nเตรียมการไว้ล่วงหน้าน่ะ"
10026-806-40-1 = "มาทำงานให้เสร็จ\nให้เรียบร้อยกันเถอะ"
10026-806-50-1 = "งานเก็บกวาดเหรอ?\nเรื่องนั้นฉันถนัดเลยนะ!"
10026-806-60-1 = "มีงานอะไร\nที่จะให้ทำหรือเปล่าคุณครู?"
10026-806-70-1 = "ฮะฮ่าฮ่าฮ่า!\nไม่เลวเลยนี่!"
10026-806-80-1 = "ไม่มีเวลามาอืดอาดแล้วนะ"
10026-806-90-1 = "ทะ...ทำไมถึงจ้องกันแบบนั้นล่ะ\nรีบทำงานกันได้แล้ว"
10026-806-550-1 = "เอาละ~\nไปทำความสะอาดกันเลยมั้ย?"
10026-806-560-1 = "รีบๆ เริ่มได้แล้ว"
10026-806-570-1 = "อะไรน่ะ มาให้กำลังใจฉันเหรอ?\nเฮอะ! บันเทิงชะมัด"
10026-806-580-1 = "ถ้าเป็นฉันละก็\nแค่นี้เรื่องกล้วยๆ!"
10026-806-590-1 = "หืมม...\nมีเซนส์เหมือนกันนะเนี่ย?"
10026-806-600-1 = "ทำงานก็ต้องทำให้ชัดเจน"
