[translation]
10110-843-10-1 = "やぁ、先生。"
10110-843-20-1 = "相も変わらず\n忙しないね。"
10110-843-30-1 = "良いところに来たね、\n先生。"
10110-843-40-1 = "渇望もかくや\nというところさ。"
10110-843-50-1 = "ふむ、\n気運の高まりが…。"
10110-843-60-1 = "何、まだ気にする\nことは無いさ。"
10110-843-70-1 = "終幕も近いか……。"
10110-843-80-1 = "言わずとも、\nすぐその目に映るとも。"
10110-843-90-1 = "君の行いに感謝を。"
10110-843-100-1 = "たとえその過程で、\n君が何を視たと\nしてもね。"
10110-843-110-1 = "うん？"
10110-843-120-1 = "私に何か話すべき\n事柄でも？"
10110-843-130-1 = "ここに在るという\n事実が必要かい？"
10110-843-140-1 = "時には、こういった\n例外も悪くは無い。"
10110-843-150-1 = "普段のトリニティと\n異なる環境に、"
10110-843-160-1 = "……こそばゆい\nものだね。"
10110-843-170-1 = "いや、\n否定の意味ではないよ。"
10110-843-660-1 = "事前に見越していたからね。"
10110-843-670-1 = "意のままに見ると良い。"
10110-843-680-1 = "君の欲望の形を\n教えてくれるかい？"
10110-843-690-1 = "何、躊躇うことは無いとも。"
10110-843-700-1 = "刮目したまえ、"
10110-843-710-1 = "瞬きの間に\n消えてしまわぬように。"
10110-843-720-1 = "……成程？"
10110-843-730-1 = "私を金銭で\n飼い馴らせるとでも？"
10110-843-740-1 = "そうして君が伸ばした手は、"
10110-843-750-1 = "私の手を拒まないことを\n意味するのだろう？"
10110-843-760-1 = "それを選び取るのだね。"
10110-843-770-1 = "最初から悪い選択など\n在りはしないよ。"
10110-843-780-1 = "見つけたものと手にしたものは、\nきちんと同じかな？"
10110-843-790-1 = "さあ、\nその実存を握りしめると良い。"
10110-843-900-1 = "君の目を必要と\nするものが多いようだね。"
10110-843-910-1 = "ああ、待ち侘びていたよ……"
10110-843-920-1 = "なに、勘のようなものさ。"
10110-843-930-1 = "君という存在の解釈を\n揺らがせないでくれ。"
10110-843-940-1 = "……変化しないということに、\n安堵を覚えるものだよ先生。"
10110-843-950-1 = "君の労苦に感謝を。"
10110-843-960-1 = "実に見事だ。"
