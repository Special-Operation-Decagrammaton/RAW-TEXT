[translation]
10110-843-10-1 = "어서 오세요, 선생님."
10110-843-20-1 = "바빠 보이시네요."
10110-843-30-1 = "아, 선생님이시군요."
10110-843-40-1 = "마침 잘 오셨어요."
10110-843-50-1 = "슬슬 진척도가……"
10110-843-60-1 = "아, 아무것도\n아니에요."
10110-843-70-1 = "거의 다 끝났군요."
10110-843-80-1 = "……나중에 말씀\n드리겠습니다."
10110-843-90-1 = "많은 일들이 있었네요."
10110-843-100-1 = "도와주셔서 감사합니다."
10110-843-110-1 = "절 부르셨나요?"
10110-843-120-1 = "무슨 일이시죠?"
10110-843-130-1 = "저는 어디 가지\n않는답니다."
10110-843-140-1 = "가끔은 이런 것도\n즐겁네요."
10110-843-150-1 = "트리니티 밖이라서\n그런 걸까요?"
10110-843-160-1 = "간지러워요……"
10110-843-170-1 = "그렇지만,\n싫은 건 아니네요."
10110-843-660-1 = "이것저것 준비해 보았어요."
10110-843-670-1 = "둘러보세요."
10110-843-680-1 = "필요하신 게 있으실까요?"
10110-843-690-1 = "우선 말씀해 보세요."
10110-843-700-1 = "혹시 모르니,"
10110-843-710-1 = "한 번 더 살펴보세요.\n선생님."
10110-843-720-1 = "…저를?"
10110-843-730-1 = "후후, 저는\n판매하고 있지 않아요."
10110-843-740-1 = "재미있네요."
10110-843-750-1 = "이제는 제가\n찌를 차례일까요?"
10110-843-760-1 = "그것도 좋지요."
10110-843-770-1 = "나쁘지 않은 선택이에요."
10110-843-780-1 = "아, 그게 필요하셨군요."
10110-843-790-1 = "네. 여기 있답니다."
10110-843-900-1 = "꼼꼼히 확인하고 가세요."
10110-843-910-1 = "선생님이 오실 줄"
10110-843-920-1 = "알고 있었습니다.\n후후, 감이라는 것이지요."
10110-843-930-1 = "……선생님이라는 존재에\n대해, 해석이 달라지게\n하지 말아주세요."
10110-843-940-1 = "…후후,\n여전하시군요, 선생님."
10110-843-950-1 = "고생하셨습니다."
10110-843-960-1 = "훌륭하시네요."
