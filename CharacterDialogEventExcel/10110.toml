[translation]
10110-843-10-1 = "เชิญค่ะ คุณครู"
10110-843-20-1 = "ดูงานยุ่งจังเลยนะคะ"
10110-843-30-1 = "อ๊ะ คุณครูเองเหรอคะ"
10110-843-40-1 = "มาได้จังหวะพอดีเลยค่ะ"
10110-843-50-1 = "พอดีว่าความคืบหน้ามัน..."
10110-843-60-1 = "มะ... ไม่มีอะไร\nหรอกค่ะ"
10110-843-70-1 = "เกือบเสร็จแล้วสินะคะ"
10110-843-80-1 = "ไว้ฉันจะมาบอก\nทีหลังนะคะ..."
10110-843-90-1 = "เกิดเรื่องขึ้นเยอะเลยนะคะ"
10110-843-100-1 = "ขอบคุณที่ช่วยนะคะ"
10110-843-110-1 = "เรียกหาฉันเหรอคะ?"
10110-843-120-1 = "มีเรื่องอะไรหรือเปล่าคะ?"
10110-843-130-1 = "ฉันไม่ได้จะไปไหน\nหรอกนะคะ"
10110-843-140-1 = "บางครั้งการทำแบบนี้\nก็สนุกเหมือนกันนะคะ"
10110-843-150-1 = "เป็นเพราะว่าอยู่นอกทรีนิตี้\nหรือเปล่านะคะ?"
10110-843-160-1 = "จั๊กจี้ค่ะ..."
10110-843-170-1 = "แต่ว่า ใช่ว่าฉัน\nจะไม่ชอบหรอกนะคะ"
10110-843-660-1 = "ฉันเตรียมนู่นเตรียมนี่\nไว้ให้แล้วค่ะ"
10110-843-670-1 = "ลองเดินดูรอบๆ สิคะ"
10110-843-680-1 = "มีอะไรที่ต้องการหรือเปล่าคะ?"
10110-843-690-1 = "บอกฉันมาก่อนได้เลยค่ะ"
10110-843-700-1 = "ลองดูเผื่อๆ "
10110-843-710-1 = "อีกสักรอบก็ดีนะคะ\nคุณครู"
10110-843-720-1 = "ฉันน่ะเหรอ...?"
10110-843-730-1 = "ฮุฮุ ฉันน่ะ\nไม่มีขายหรอกค่ะ"
10110-843-740-1 = "สนุกจังเลยนะคะ"
10110-843-750-1 = "ต่อไปเป็นตาฉัน\nจิ้มบ้างใช่มั้ยคะ?"
10110-843-760-1 = "นั่นก็ดีเลยนะคะ"
10110-843-770-1 = "เลือกได้ไม่เลวเลยค่ะ"
10110-843-780-1 = "อ๊ะ อยากได้อันนั้นสินะคะ"
10110-843-790-1 = "ค่ะ อยู่นี่ค่ะ"
10110-843-900-1 = "ตรวจสอบให้รอบคอบก่อนไปนะคะ"
10110-843-910-1 = "ฉันรู้อยู่แล้วค่ะ"
10110-843-920-1 = "ว่าคุณครูจะมา\nฮุฮุ ฉันลางสังหรณ์ดีน่ะค่ะ"
10110-843-930-1 = "อย่าทำให้ฉันตีความตัวตน\nของคุณครูผิดแปลกไปสิคะ"
10110-843-940-1 = "ฮุฮุ...\nคุณครูยังเหมือนเดิมเลยนะคะ"
10110-843-950-1 = "ทำได้ดีมากค่ะ"
10110-843-960-1 = "ยอดเยี่ยมเลยค่ะ"
