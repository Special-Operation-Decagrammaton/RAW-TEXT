[translation]
10025-805-10-1 = "산책가기 딱\n좋은 날씨네요~"
10025-805-20-1 = "오늘은 제가 산해경을\n직접 안내해드릴게요!"
10025-805-30-1 = "슈, 슌 언니는\n어디로 갔을까요……."
10025-805-40-1 = "(아직…… 안 들켰겠죠?)"
10025-805-50-1 = "선생님, 저쪽에 맛있어\n보이는 과자가 잔뜩 있어요!"
10025-805-60-1 = "(후후, 어려진 몸도\n제법 나쁘지 않을지도…….)"
10025-805-290-1 = "어서오세요, 선생님.\n오늘의 수업도\n잘 부탁드릴게요!"
10025-805-300-1 = "후후, 이 크기도\n가끔은 편리하네요!"
10025-805-310-1 = "으음…… 졸려졌어요……"
10025-805-320-1 = "고맙습니다!"
10025-805-330-1 = "후후. 감사합니다,\n선생님."
