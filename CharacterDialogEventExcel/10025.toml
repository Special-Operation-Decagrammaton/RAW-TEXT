[translation]
10025-805-10-1 = "是非常適合\n散步好天氣呢。"
10025-805-20-1 = "今天就由我來\n帶你參觀山海經哦！"
10025-805-30-1 = "旬，旬姐姐\n跑去哪裡了呢……？"
10025-805-40-1 = "（應，應該還沒\n被發現吧……？)"
10025-805-50-1 = "老師，那邊有很多\n看起來很好吃的點心！"
10025-805-60-1 = "（呵呵。這個\n身體也沒那麼糟嘛）"
10025-805-290-1 = "歡迎回來！\n老師！今天的課程\n也請多多指教！"
10025-805-300-1 = "呵呵，這個大小\n有時候也挺方便的呢！"
10025-805-310-1 = "嗯嗯……\n想睡覺了……"
10025-805-320-1 = "非常感謝！"
10025-805-330-1 = "呵呵。非常謝謝，\n老師。"
