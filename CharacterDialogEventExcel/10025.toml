[translation]
10025-805-10-1 = "お散歩にぴったりの\nお天気ですねっ。"
10025-805-20-1 = "今日は私が、\n山海経を案内しますねっ！"
10025-805-30-1 = "しゅ、\nシュンお姉さんはどこに\n行ったんでしょうね…？"
10025-805-40-1 = "（ま、まだバレて\nませんよね……？）"
10025-805-50-1 = "先生、あそこに美味しそうなお菓子がいっぱいあります！"
10025-805-60-1 = "（ふふっ。この身体も、\nそれほど悪くないですね）"
10025-805-290-1 = "おかえりなさい、です！\n先生！今日の授業も\nよろしくお願いします！"
10025-805-300-1 = "ふふっ、このサイズも\n時には便利ですね！"
10025-805-310-1 = "んん……\n眠くなってきました……"
10025-805-320-1 = "ありがとうございます！"
10025-805-330-1 = "ふふ。ありがとう\nございます、先生。"
