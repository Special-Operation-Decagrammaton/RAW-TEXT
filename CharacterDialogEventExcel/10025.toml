[translation]
10025-805-10-1 = "อากาศแบบนี้เหมาะกับ\nการไปเดินเล่นมากเลยนะคะ~"
10025-805-20-1 = "วันนี้ฉันจะพาคุณครู\nเดินชมโรงเรียนซานไห่จิงเองค่ะ!"
10025-805-30-1 = "พะ...พี่ชุน...\nหายไปไหนกันนะ"
10025-805-40-1 = "(นี่... ความยังไม่แตกใช่มั้ยนะ?)"
10025-805-50-1 = "คุณครูคะ ทางด้านโน้นมีขนม\nที่ดูน่าอร่อยอยู่เต็มไปหมดเลยค่ะ!"
10025-805-60-1 = "(ฮุฮุ ถึงตัวจะดูเด็กลง\nแต่ก็ไม่ได้แย่เท่าไรนะ...)"
10025-805-290-1 = "เชิญเลยค่ะ คุณครู\nคาบเรียนวันนี้\nก็ขอรบกวนด้วยนะคะ!"
10025-805-300-1 = "ฮุฮุ ตัวเล็กไซซ์มินิแบบนี้\nบางครั้งก็สบายดีเหมือนกันนะคะ!"
10025-805-310-1 = "งืม... ง่วงจังเลยค่ะ"
10025-805-320-1 = "ขอบคุณมากค่ะ!"
10025-805-330-1 = "ฮิฮิ ขอบคุณค่ะ...\nคุณครู"
