[translation]
10062-70000-10320-1 = "お待ちしておりました。\n先生。"
10062-70000-10330-1 = "どのような地形や\n気候であっても"
10062-70000-10340-1 = "完璧な補佐をお約束\nさせていただきます。"
10062-70000-10350-1 = "大船に乗ったつもりで、\n私に任せてください。"
10062-70000-10360-1 = "……そうでないと、\n寂しいです。"
10062-70000-10370-1 = "私を待たせましたね、\n先生。別に平気です。"
10062-70000-10380-1 = "拗ねてなんかいません。\n先生が戻ったら"
10062-70000-10390-1 = "絶対におそばを離れ\nないでいようなんてことも\n思っていませんので、"
10062-70000-10400-1 = "ご安心を。"
10062-70000-10410-1 = "天あり、地あり、\n飛鳥馬トキあり。"
10062-70000-10420-1 = "……意味はありません。\n言ってみただけです。"
10062-70000-10430-1 = "寒くないのかと\nよく聞かれるので、"
10062-70000-10440-1 = "大丈夫だと\n答えていますが\n実は寒いです。"
10062-70000-10450-1 = "なので先生、\n温めてください。"
10062-70000-10460-1 = "私の任務は基地の\n管理と警備です。"
10062-70000-10470-1 = "言い換えれば、\n先生にくっついて\n行動すること、です。"
10062-70000-10480-1 = "……理屈が変？\n先生はまだまだですね。"
10062-70000-10490-1 = "単刀直入に\n申し上げます。"
10062-70000-10500-1 = "今、先生は私に\n集中しなければ\nなりません。"
10062-70000-10510-1 = "理由は、この場にいるのが\n先生と私だけだからです。"
10062-70000-10520-1 = "先生、手をこちらへ。\n私が温めて\n差し上げます。"
10062-70000-10530-1 = "……！……手が……\n冷たくない……！？"
10062-70000-10540-1 = "クッ……やはりあの時、\n先生の手袋を\n隠しておくべきでした。"
10062-70000-10990-1 = "おかえりなさい、先生。\n集めたサンプルは、\nこちらにお願いします。"
10062-70000-11000-1 = "分析には大量の「物質」が\n必要です。つまり、先生の\n出番ということです。"
10062-70000-11010-1 = "先生、\nお茶でも飲まれますか？"
10062-70000-11020-1 = "こちら、氷河を溶かしたお湯で\n淹れたものです。"
10062-70000-11030-1 = "……古代の味が\n……するかもしれません。"
10062-70000-11040-1 = "以前、リオ様がこれに似た実験を\nされたことがありますので。"
10062-70000-11050-1 = "この任務に、\n少し懐かしさを覚えます。"
10062-70000-11060-1 = "先生はとんでもないものを\n盗んでいきました……\nそれは……私の心です。"
10062-70000-11070-1 = "…そんなに慌てないでください。\n言ってみただけです、はい。"
10062-70000-11080-1 = "…「アレ」をやってほしい、\nですか？本当に、\nよろしいのですね…？"
10062-70000-11090-1 = "承知しました…ぴょん。"
10062-70000-11100-1 = "ただいまサンプルの分析中です。\nつまり、私は暇ということです。"
10062-70000-11110-1 = "……何をすべきか、\n先生なら分かりますよね？"
10062-70000-11120-1 = "何があっても\n先生を守ります。"
10062-70000-11130-1 = "それだけが\nここにいる理由ですので。"
10062-70000-11140-1 = "良いですね。"
10062-70000-11150-1 = "私もそれが良いと思います。"
10062-70000-11160-1 = "先生のお役に立つのなら\nどうぞ、ご自由に\nお持ちください。"
10062-70000-11170-1 = "先生の選ばれたものですから、\n価値があるに決まっています。"
10062-70000-11180-1 = "もちろん、\n私には及びませんが。"
10062-70000-11190-1 = "すぐにご用意いたします。\n少々お待ちを。"
10062-70000-12320-1 = "ここは……ヒマリ部長が\n「多少の調整」を入れた\n場所になります。"
10062-70000-12330-1 = "乱数と確定……\n先生はどちらを\n選びますか？"
10062-70000-12340-1 = "運試しですね。"
10062-70000-12350-1 = "不運は私が引き受け\nますので、先生には幸運が\n巡ってくるはずです。"
10062-70000-12360-1 = "…逆じゃないと嫌…？\nそう、ですか？"
10062-70000-12370-1 = "ヒマリ部長とリオ様の\n違いが、だんだん\n分かってきました。"
10062-70000-12380-1 = "どちらが正しいかは、\n私にはまだ\n分かりませんが…"
10062-70000-12390-1 = "お二方のことを思うと、\nなんだか…言葉にできない\n感情がこみ上げてきます。"
10062-70000-12400-1 = "どこかで聞いた\n話なのですが……"
10062-70000-12410-1 = "人生には、小さな幸運が\n必要だといいます。"
10062-70000-12420-1 = "でなければ、辛く苦しい\n道のりを生きることに\nなってしまいますので。"
10062-70000-12430-1 = "結果がどのようなものに\nなろうとも、\n私は先生の味方です。"
10062-70000-12440-1 = "ですので、先生も私の\n味方をしてくださいね。"
10062-70000-12450-1 = "私、この任務が\n終わったら……先生と\n幸せに暮らすんです。"
10062-70000-12460-1 = "フラグ……？\nなんですか、それは。"
10062-70000-12470-1 = "先生の気の向くままに\nお選びください。\nそれが正解ですから。"
10062-70000-12480-1 = "おお、パチパチパチ\nパチパチパチ。"
10062-70000-12490-1 = "……今のは、\n私の精一杯のお祝いです。"
10062-70000-12500-1 = "どうですか？\n感動しましたか？"
10062-70000-12510-1 = "お見事です。先生。\nその勢いでもう一回、\nいきましょう。"
10062-70000-12520-1 = "2等当選、\nおめでとうございます。"
10062-70000-12530-1 = "1等の内容？一日中私が\n身の回りを補佐して\n差し上げる券です。"
10062-70000-12540-1 = "その不屈の精神……\n私も見習いたいと\n思います。"
10062-70000-12550-1 = "……こんなに純粋な目で\n尊敬を伝えてくる生徒、"
10062-70000-12560-1 = "えらいと思いませんか？"
10062-70000-12570-1 = "迅速に褒めてください。"
