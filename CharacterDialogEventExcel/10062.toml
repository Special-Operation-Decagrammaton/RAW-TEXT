[translation]
10062-70000-10320-1 = "恭候多時了，老師。"
10062-70000-10330-1 = "無論是怎樣的\n地形或氣候，"
10062-70000-10340-1 = "我都承諾您會\n提供完美的輔佐。"
10062-70000-10350-1 = "就當作是登上了大船，\n儘管交給我吧。"
10062-70000-10360-1 = "……不然的話，\n我會寂寞的。"
10062-70000-10370-1 = "您讓我等了呢，老師。\n其實也沒關係。"
10062-70000-10380-1 = "我沒有在鬧彆扭。\n要是老師回來──"
10062-70000-10390-1 = "就絕對不再離開他\n身邊吧之類的念頭，\n也完全沒有，"
10062-70000-10400-1 = "請您放心。"
10062-70000-10410-1 = "有天，有地，\n有飛鳥馬季。"
10062-70000-10420-1 = "……沒有什麼意義。\n只是想說說看而已。"
10062-70000-10430-1 = "經常會有人\n問我冷不冷，"
10062-70000-10440-1 = "雖然總是回答還好，\n但我其實覺得很冷。"
10062-70000-10450-1 = "所以老師，\n請溫暖我吧。"
10062-70000-10460-1 = "我的任務是基地\n的管理和警備。"
10062-70000-10470-1 = "換句話說，就是要\n緊貼老師行動的意思。"
10062-70000-10480-1 = "……邏輯很奇怪？\n看來老師還差得遠呢。"
10062-70000-10490-1 = "我就開門見山地說了。"
10062-70000-10500-1 = "現在，老師必須\n專注在我身上。"
10062-70000-10510-1 = "至於理由，\n就是現場只有\n老師跟我兩個人而已。"
10062-70000-10520-1 = "老師，請把手給我。\n我會溫暖您的。"
10062-70000-10530-1 = "……！手竟然……\n不冷……！？"
10062-70000-10540-1 = "唔……果然那時候\n就該把老師的手套\n藏起來才對。"
10062-70000-10990-1 = "歡迎回來，老師。\n收集到的樣本，麻煩放在這邊。"
10062-70000-11000-1 = "分析需要大量的「物質」。\n換句話說，該輪到老師出馬了。"
10062-70000-11010-1 = "老師，要喝杯茶嗎？"
10062-70000-11020-1 = "這杯，是用冰河\n融化的熱水泡的。"
10062-70000-11030-1 = "或許能嘗到古代的\n味道……也說不定。"
10062-70000-11040-1 = "以前，莉央大人\n曾經做過類似的實驗。"
10062-70000-11050-1 = "因此這個任務，\n讓我有股懷念的感覺。"
10062-70000-11060-1 = "老師偷走了無比重要的東西……\n那就是……我的心。"
10062-70000-11070-1 = "……請不必那麼驚慌。\n只是隨口說說而已，嗯。"
10062-70000-11080-1 = "……希望我做「那個」，是嗎？\n這樣真的好嗎……？"
10062-70000-11090-1 = "我明白了……蹦。"
10062-70000-11100-1 = "現在正在分析樣本。\n也就是說，我現在很閒。"
10062-70000-11110-1 = "……該怎麼做，\n老師應該明白吧？"
10062-70000-11120-1 = "無論發生什麼，\n我都會保護老師。"
10062-70000-11130-1 = "因為那就是我\n待在這裡的唯一理由。"
10062-70000-11140-1 = "真不錯呢。"
10062-70000-11150-1 = "我也覺得那個很好。"
10062-70000-11160-1 = "如果能幫上老師的忙，\n來，請您儘管拿吧。"
10062-70000-11170-1 = "畢竟是老師選擇的東西，\n肯定會有價值的。"
10062-70000-11180-1 = "當然，還是\n比不過我就是了。"
10062-70000-11190-1 = "我立刻為您準備。\n還請稍待片刻。"
10062-70000-12320-1 = "這裡是……陽葵部長\n實施了「某些調整」\n的地方。"
10062-70000-12330-1 = "亂數與確定……\n老師會選擇哪邊呢？"
10062-70000-12340-1 = "是試手氣呢。"
10062-70000-12350-1 = "厄運會由我來承受，\n所以幸運應該會\n降臨在老師身上才對。"
10062-70000-12360-1 = "得反過來才行……？\n是嗎？"
10062-70000-12370-1 = "陽葵部長和\n莉央大人的區別，\n我漸漸能分出來了。"
10062-70000-12380-1 = "至於哪邊才是正確的，\n雖然我還不清楚……"
10062-70000-12390-1 = "但是一想到他們兩位，\n就會……湧現出\n難以言喻的感情。"
10062-70000-12400-1 = "雖然這只是我\n從某個地方聽來的……"
10062-70000-12410-1 = "有句話說，人生\n必須要有小小的幸運。"
10062-70000-12420-1 = "否則人生的道路，就會\n變得太艱難而痛苦了。"
10062-70000-12430-1 = "無論結果如何，\n我都會站在老師這邊。"
10062-70000-12440-1 = "因此，也請老師\n要站在我這邊哦。"
10062-70000-12450-1 = "我，在完成這項任務\n之後……就會和老師\n過著幸福的生活。"
10062-70000-12460-1 = "Flag……？\n那是什麼意思。"
10062-70000-12470-1 = "請老師隨意選擇吧。\n因為那就是正確解答。"
10062-70000-12480-1 = "哦哦～啪啪啪啪啪啪。"
10062-70000-12490-1 = "……剛才的，\n是我最真心的祝賀。"
10062-70000-12500-1 = "怎麼樣？\n有覺得感動嗎？"
10062-70000-12510-1 = "太厲害了。老師。\n乘著這股氣勢\n再來一次吧。"
10062-70000-12520-1 = "抽中二等獎，恭喜您。"
10062-70000-12530-1 = "一等獎的內容？\n是我會貼身輔佐您\n一整天的票券。"
10062-70000-12540-1 = "那不屈的精神……\n我也想向其學習。"
10062-70000-12550-1 = "……以如此純粹的眼神\n表達尊敬的學生，"
10062-70000-12560-1 = "不覺得很了不起嗎？"
10062-70000-12570-1 = "請迅速給予稱讚。"
