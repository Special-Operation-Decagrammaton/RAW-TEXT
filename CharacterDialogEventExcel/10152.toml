[translation]
10152-849-500-1 = "어서 오세요,\n꿈과 희망의 원더랜드에."
10152-849-510-1 = "후후, 선생님을\n안내할 수 있어서\n기쁘네요."
10152-849-520-1 = "모두의 노력에,\n결실이 있기를."
10152-849-530-1 = "슬슬……\n엔딩의 시간이네요."
10152-849-540-1 = "마지막 향연도\n준비되었어요."
10152-849-550-1 = "선생님의 영혼에 남는\n선율이었다면, 좋겠네요."
10152-849-560-1 = "선생님도\n콥스 페인팅해 보실래요?"
10152-849-570-1 = "저에게 맡겨주세요.\n멋지게 완성해 드릴게요."
10152-849-580-1 = "역시 바니걸로\n안내하는 게 좋았을까요?"
10152-849-590-1 = "제 기타는 평화를\n노래하고 있어요."
10152-849-600-1 = "……네. 거짓말이\n아니랍니다."
10152-849-610-1 = "후후. 세션으로 닿는\n영혼의 공명도 멋지지만…"
10152-849-620-1 = "손끝의 교감도,\n소중히 해나가고 싶네요."
