[translation]
10152-500 = "어서 오세요,\n꿈과 희망의 원더랜드에."
10152-510 = "후후, 선생님을\n안내할 수 있어서\n기쁘네요."
10152-520 = "모두의 노력에,\n결실이 있기를."
10152-530 = "슬슬……\n엔딩의 시간이네요."
10152-540 = "마지막 향연도\n준비되었어요."
10152-550 = "선생님의 영혼에 남는\n선율이었다면, 좋겠네요."
10152-560 = "선생님도\n콥스 페인팅해 보실래요?"
10152-570 = "저에게 맡겨주세요.\n멋지게 완성해 드릴게요."
10152-580 = "역시 바니걸로\n안내하는 게 좋았을까요?"
10152-590 = "제 기타는 평화를\n노래하고 있어요."
10152-600 = "……네. 거짓말이\n아니랍니다."
10152-610 = "후후. 세션으로 닿는\n영혼의 공명도 멋지지만…"
10152-620 = "손끝의 교감도,\n소중히 해나가고 싶네요."
