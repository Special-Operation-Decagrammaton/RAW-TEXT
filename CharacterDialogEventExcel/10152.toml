[translation]
10152-849-500-1 = "ようこそ。夢と\n希望のワンダーランドへ。"
10152-849-510-1 = "ふふっ、先生を導く\nことができて光栄です。"
10152-849-520-1 = "みなさんの努力が、\n実を結びますように。"
10152-849-530-1 = "そろそろ……\nエンディングの\nお時間ですね。"
10152-849-540-1 = "饗宴の準備は\nできています。"
10152-849-550-1 = "先生の魂に残る\n調べであったのなら、\n幸いです。"
10152-849-560-1 = "先生もコープス・\nペイントを\nしてみませんか？"
10152-849-570-1 = "私にお任せください。\n素敵に仕上げて\n見せますよ？"
10152-849-580-1 = "…やはり、バニーガールの\n格好でお迎えすべきで\nしたでしょうか？"
10152-849-590-1 = "私のギターは、\n平和を歌っています。"
10152-849-600-1 = "……ええ、\n嘘はついてませんとも。"
10152-849-610-1 = "ふふっ。\nセッションで触れる\n魂の共鳴も素敵ですが……"
10152-849-620-1 = "指先のふれあいも、\n大切にしていきたい\nですね。"
