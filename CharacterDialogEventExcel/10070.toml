[translation]
10070-826-100-1 = "先生か。\nようこそ山海経へ。"
10070-826-110-1 = "ああ、ちなみに……\n玄武商会に行くのは\nオススメしないぞ。"
10070-826-120-1 = "ここが山海経だ。"
10070-826-120-2 = "ふっ。あまり\nキョロキョロするな、\n迷子になられても困る。"
10070-826-130-1 = "玄武商会の奴らの\n仕業だろう。"
10070-826-130-2 = "この程度、\n調べなくとも分かる。"
10070-826-140-1 = "いったい、どうして\nこうなったんだ……"
10070-826-140-2 = "くっ……\n小難しいことは\n苦手だ……！"
10070-826-150-1 = "こんな終わり方、想像すら\nしていなかった……。"
10070-826-150-2 = "まあ、無事に終わって\n良かったといえば\nそうだが。"
10070-826-160-1 = "ん？何か話したい\nことでもあるのか？\n――なら、いい。"
10070-826-160-2 = "人には……ただ名前を\n呼びたくなる日も\nあるものだからな。"
10070-826-170-1 = "どうかしたのか？"
10070-826-170-2 = "我々には、\nまだやるべきことが\n残ってるだろう。"
10070-826-170-3 = "たとえそれが、\n「悪」と呼ばれる\nものだとしても……な。"
10070-826-170-4 = "――ちょっと今の台詞、\n格好良くなかったか？"
10070-826-180-1 = "いつにも増して\n山海経が騒がしいな。"
10070-826-180-2 = "これも、\n先生がいるから\nなのか……？"
10070-826-190-1 = "事件が起きたら\nまず最初に動くのが、\n我々執行部だ。"
10070-826-190-2 = "そういうことだ、行くぞ。"
10070-826-380-1 = "目的、課題、任務、\nミッション――\nすべて同じ意味の言葉だ。"
10070-826-380-2 = "心配するな、一つずつ\nこなしていけばいい。"
10070-826-390-1 = "複数の任務がある時は、\nまず簡単なものから片付ける。\nその方が色々とスムーズだぞ。"
10070-826-400-1 = "日課が難しいと感じたら、\nすぐに言ってくれ。"
10070-826-400-2 = "いつでも先生の\n味方になるぞ。"
10070-826-410-1 = "これは、玄龍門の者でも\n難しい内容のはずだが……\n正直驚いたぞ、先生。"
10070-826-420-1 = "それをこなすとは、\n流石、先生だ。\n私の目に狂いは無かったな。"
10070-826-430-1 = "難しい任務も\nよくやってくれている。"
10070-826-430-2 = "だ、だが……！この程度、\n玄龍門では普通のことだ！"
