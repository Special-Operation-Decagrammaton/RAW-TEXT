[translation]
10070-826-100-1 = "คุณครูเองเหรอ\nขอต้อนรับสู่ซานไห่จิงนะ"
10070-826-110-1 = "อ่า... ขอบอกไว้ก่อน...\nฉันไม่แนะนำให้ไปที่\nย่านการค้าเทพเต่าดำนะ"
10070-826-120-1 = "ที่นี่คือซานไห่จิงนะ"
10070-826-120-2 = "เฮ้อ อย่ามัวแต่\nมองทางจนเพลินล่ะ\nถ้าหลงทางไปเดี๋ยวจะแย่เอา"
10070-826-130-1 = "คงเป็นฝีมือของคน\nจากย่านการค้าเทพเต่าดำนั่นละ"
10070-826-130-2 = "เรื่องแค่นี้น่ะ\nไม่ต้องสืบให้เสียเวลา\nก็รู้ได้อยู่แล้ว"
10070-826-140-1 = "ทำไมถึงเป็นอย่างนี้ได้นะ..."
10070-826-140-2 = "อึก...\nเรื่องวุ่นวายน่ะ\nน่าเบื่อชะมัด...!"
10070-826-150-1 = "สุดท้ายก็จบแบบนี้งั้นเหรอ\nคิดไม่ถึงเลยทีเดียว..."
10070-826-150-2 = "แต่ก็ค่อยยังชั่ว\nดูเหมือนว่าจะผ่าน\nไปได้ด้วยดี"
10070-826-160-1 = "หืม? มีอะไร\nอยากจะพูดรึเปล่า?\nถ้างั้นก็ดี..."
10070-826-160-2 = "คนเราน่ะ...\nบางทีก็มีวันที่อยากจะ\nเรียกชื่อเฉยๆ อยู่บ้าง"
10070-826-170-1 = "มีอะไรเหรอ?"
10070-826-170-2 = "น่าจะมีงานที่พวกเรา\nต้องทำเหลืออยู่อีกนะ..."
10070-826-170-3 = "ถึงแม้สิ่งนั้นจะ\nเป็นสิ่งที่เรียกว่า\n\"ความร้ายกาจ\" ก็ตาม..."
10070-826-170-4 = "ที่พูดไปเมื่อกี้\nมันเท่สุดๆ เลยว่ามั้ย"
10070-826-180-1 = "ที่ซานไห่จิง\nดูครึกครื้นกว่าปกติ"
10070-826-180-2 = "เป็นเพราะคุณครู\nมาที่นี่หรือเปล่านะ...?"
10070-826-190-1 = "เวลาเกิดเหตุขึ้น กลุ่มที่\nเคลื่อนไหวก่อน ก็คือ\nคณะบริหารของเรานี่ละ"
10070-826-190-2 = "เพราะงั้น ไปกันเถอะ"
10070-826-380-1 = "เป้าหมาย งาน หน้าที่ ภารกิจ...\nมันก็หมายถึงสิ่งเดียวกัน"
10070-826-380-2 = "ไม่ต้องห่วง ค่อยๆ จัดการ\nไปทีละอย่างก็ได้"
10070-826-390-1 = "ตอนที่มีภารกิจเข้ามาหลายๆ อย่าง\nต้องเริ่มจัดการจากภารกิจง่ายๆ ก่อน\nทำแบบนั้นแล้วงานจะง่ายขึ้นเยอะเลย"
10070-826-400-1 = "เวลาที่รู้สึกว่าภารกิจมันยาก\nก็รีบบอกฉันเลยละ"
10070-826-400-2 = "ไม่ว่าเมื่อไร\nฉันก็จะอยู่ข้างคุณครูเอง"
10070-826-410-1 = "นี่เป็นรายละเอียดที่ยากมาก...\nแม้แต่คนในสำนักมังกรดำเองก็ตาม\nบอกตามตรง ฉันตกใจจริงๆ นะ คุณครู"
10070-826-420-1 = "ทำงานนั้นสำเร็จแล้วเหรอ สมกับเป็น\nคุณครูจริงๆ ฉันมองคนไม่ผิดจริงด้วย"
10070-826-430-1 = "ถึงจะเป็นงานยาก\nแต่ก็ทำได้ดีเลยละ"
10070-826-430-2 = "ตะ... แต่ว่า...! แค่นี้ก็ยังถือว่า\nธรรมดาสำหรับสำนักมังกรดำนะ!"
