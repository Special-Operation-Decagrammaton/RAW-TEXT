[translation]
10070-826-100-1 = "是老師啊。\n歡迎來到山海經。"
10070-826-110-1 = "啊啊，順帶一提……\n我不建議你去\n玄武商會哦。"
10070-826-120-1 = "這裡就是山海經。"
10070-826-120-2 = "呼。別一直\n東張西望，要是\n迷路我會很困擾的。"
10070-826-130-1 = "這肯定是玄武商會\n那些傢伙幹的好事。"
10070-826-130-2 = "這種程度的事，\n不用調查也知道。"
10070-826-140-1 = "究竟為什麼會\n變成這樣呢……"
10070-826-140-2 = "唔……\n我不擅長處理\n麻煩的事……！"
10070-826-150-1 = "這種收尾方式，\n我連想都沒想過……"
10070-826-150-2 = "總之，要說幸好\n事情圓滿落幕也沒錯。"
10070-826-160-1 = "嗯？有什麼話\n想對我說嗎？\n──那，可以。"
10070-826-160-2 = "畢竟人類……\n有時候就是會想\n叫一下別人的名字。"
10070-826-170-1 = "怎麼了嗎？"
10070-826-170-2 = "我們還有\n該做的事\n沒做完吧？"
10070-826-170-3 = "即使那些是被\n他人稱為「惡」\n的事情也一樣……啊。"
10070-826-170-4 = "──不覺得剛才\n那句台詞很帥嗎？"
10070-826-180-1 = "山海經好像比\n平常更吵鬧啊。"
10070-826-180-2 = "這也是因為\n老師在這裡\n的關係嗎……？"
10070-826-190-1 = "每當有事件發生，\n最先出動的\n就是我們執行部。"
10070-826-190-2 = "所以，出發吧。"
10070-826-380-1 = "目標、課題、任務、工作──\n全都是意義相同的詞彙。"
10070-826-380-2 = "別擔心，只要\n一樣一樣解決就行了。"
10070-826-390-1 = "同時有複數的任務時，\n要從簡單的任務開始處理。\n這樣一來各方面都會比較順利。"
10070-826-400-1 = "如果覺得每日任務太難，\n就立刻告訴我吧。"
10070-826-400-2 = "我永遠都會\n站在老師這一邊。"
10070-826-410-1 = "這些，即使對玄龍門的人來說\n都是有點難度的內容……\n老實說確實震驚到我了，老師。"
10070-826-420-1 = "竟然能夠完成，\n不愧是老師。\n我的眼光果然沒錯。"
10070-826-430-1 = "困難的任務\n也能順利解決。"
10070-826-430-2 = "但，但是……！這種程度，\n在玄龍門也不算什麼！"
