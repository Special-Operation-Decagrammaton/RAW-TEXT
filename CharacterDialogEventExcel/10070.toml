[translation]
10070-826-100-1 = "Sensei? Hurry over to Shanhaijing."
10070-826-110-1 = "Oh, and I suggest you steer clear of the Black Tortoise Promenade."
10070-826-120-1 = "This is Shanhaijing."
10070-826-120-2 = "Heh. Don't let your eyes wander too much. I'd hate for you to get lost."
10070-826-130-1 = "This must the be doing of the Black Tortoise Promenade."
10070-826-130-2 = "I can tell that much at a glance."
10070-826-140-1 = "How did this happen...?"
10070-826-140-2 = "Ugh... I hate it when things get complicated...!"
10070-826-150-1 = "What an ending...I never imagined..."
10070-826-150-2 = "Well... I think things ended well. Good."
10070-826-160-1 = "Oh? You got something to say? Go ahead."
10070-826-160-2 = "There are some days when I just want to tell people what I really think."
10070-826-170-1 = "Why?"
10070-826-170-2 = "We've still got business to finish."
10070-826-170-3 = "And even if it's dirty business...somebody's got to do it."
10070-826-170-4 = "Wasn't that a cool line?"
10070-826-180-1 = "Shanhaijing is noisier than usual."
10070-826-180-2 = "Is it because you're here...?"
10070-826-190-1 = "If there's action to be had, we'll be the first ones to act."
10070-826-190-2 = "So let's go."
10070-826-380-1 = "Purpose. Duty. Operation. Mission. They all mean the same."
10070-826-380-2 = "Don't worry. We'll take this one at a time."
10070-826-390-1 = "When there are multiple missions, I take care of the simple ones first. That makes things go more smoothly."
10070-826-400-1 = "If you ever feel overwhelmed by your tasks, let me know right away."
10070-826-400-2 = "I will always be on your side, Sensei."
10070-826-410-1 = "This would have been difficult for even a Genryumon member... I'm surprised, Sensei."
10070-826-420-1 = "You really did it, Sensei! I knew I wasn't wrong about you."
10070-826-430-1 = "You've been taking on difficult missions like a pro."
10070-826-430-2 = "B-But...! Any Genryumon member can do that!"
