[translation]
10084-832-10-1 = "Ugh. I can still feel the cold under all these layers."
10084-832-20-1 = "I didn't even realize I was shivering."
10084-832-30-1 = "People who come outdoors like this to celebrate the new year are the poster children of inefficiency."
10084-832-40-1 = "(Not even the vice president will suspect that I brought wiretaps with me.)"
10084-832-50-1 = "(Heehee...)"
10084-832-60-1 = "A BEAR?! Right now??"
10084-832-70-1 = "The universe is working against me."
10084-832-80-1 = "I need to hurry back and edit the audio files with Sensei's voice..."
10084-832-90-1 = "I-I mean, I can't wait to go home and rest!"
10084-832-100-1 = "If there's one thing I can't stand, it's absolute silence."
10084-832-110-1 = "But then again, when it's quiet..."
10084-832-120-1 = "Well, the quieter it is, the better I can hear Sensei's voice."
10084-832-130-1 = "The wind... It's like it's crying."
10084-832-140-1 = "I'm monitoring all frequency communications within a three kilometer radius..."
10084-832-150-1 = "Huh. Nothing."
10084-832-590-1 = "S-Sensei! Are you busy?"
10084-832-600-1 = "Would you help me with setting up the camp, please?"
10084-832-610-1 = "Hello, Sensei. The vice president gave me very specific orders on how to set up the camping equipment. I really am doing my best..."
10084-832-620-1 = "I was told that this camping equipment was easy to use..."
10084-832-630-1 = "But setting it up isn't easy at all."
10084-832-640-1 = "Were you trying to say something...?"
10084-832-650-1 = "Wait right there. I'm going to bring my recording devices."
10084-832-660-1 = "I see. I'll remember that."
10084-832-670-1 = "Can you show me how you did that again?"
10084-832-680-1 = "I would like a verbal, step-by-step explanation, please."
10084-832-690-1 = "Sleeping will be a lot more comfortable tonight with this."
