[translation]
10084-832-10-1 = "服に隙間風が\n入ってくるので…"
10084-832-20-1 = "つい身体を\n丸めてしまいます。"
10084-832-30-1 = "わざわざ外で\n年越しするなんて…\n効率性に欠けます。"
10084-832-40-1 = "（いくら副部長でも、\nこんなところに盗聴器を\n隠してるだなんて思っても\nいないでしょう。）"
10084-832-50-1 = "（ふふ…）"
10084-832-60-1 = "どうしてこの\nタイミングで熊が…"
10084-832-70-1 = "世界の悪意を\n感じます…。"
10084-832-80-1 = "早く戻って、\n録音した先生の\n音声ファイルを編集し…"
10084-832-90-1 = "で、ではなく、\n早く休憩を取りたいと\n思います！"
10084-832-100-1 = "沈黙と静寂…\n私が最も苦手と\nする環境です…。"
10084-832-110-1 = "唯一の利点は…"
10084-832-120-1 = "先生の声が雑音なく\nはっきり聴こえること、\nでしょうか。"
10084-832-130-1 = "この風…少し…\n泣いているような。"
10084-832-140-1 = "周波数検索中…\n半径3km内の\n通信記録は…"
10084-832-150-1 = "0件。"
10084-832-590-1 = "せ、先生…\nもしよろしければ…"
10084-832-600-1 = "キャンプの設営にご協力、\nいただけますでしょうか…。"
10084-832-610-1 = "あ、先生。副部長の指示で、\nキャンプの設営をしているところです。"
10084-832-620-1 = "たしか「超カンタン設営」の\nキャンプ装備、と\n聞いていたのですが…"
10084-832-630-1 = "設置は全然簡単じゃ\nなかったような…"
10084-832-640-1 = "何か仰りたい事が…？"
10084-832-650-1 = "少々お待ちください、\n録音の準備をしますので。"
10084-832-660-1 = "なるほど、参考にします。"
10084-832-670-1 = "今の、もう一度\n見せていただけますか？"
10084-832-680-1 = "できれば、口頭での解説も\n一緒に、お願いします。"
10084-832-690-1 = "これなら、今晩は\n快適に過ごせるかと。"
