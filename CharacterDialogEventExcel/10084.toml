[translation]
10084-832-10-1 = "ลมเย็นๆ พัดผ่าน\nตามเสื้อผ้า..."
10084-832-20-1 = "ทำให้ฉันตัวหด\nโดยไม่รู้ตัวเลยค่ะ"
10084-832-30-1 = "ต้องออกมาถึงข้างนอก\nเพื่อส่งท้ายปีเก่าแบบนี้...\nไม่ไหวเอาซะเลยค่ะ"
10084-832-40-1 = "(ต่อให้เป็นรองหัวหน้า\nก็คงคิดไม่ถึงหรอกค่ะ\nว่าฉันแอบเอาเครื่องดักฟัง\nมาในที่แบบนี้ด้วย)"
10084-832-50-1 = "(ฮุฮุ...)"
10084-832-60-1 = "ทำไมหมีต้องโผล่มา\nในจังหวะนี้ด้วยนะ..."
10084-832-70-1 = "โลกนี้มันช่าง\nโหดร้ายจังเลยค่ะ..."
10084-832-80-1 = "ต้องรีบกลับไปตัดต่อ\nไฟล์เสียงของคุณครู\nที่บันทึกไว้..."
10084-832-90-1 = "มะ... ไม่สิ ฉันอยากรีบ\nไปพักผ่อนน่ะค่ะ...!"
10084-832-100-1 = "ความเงียบสงบ...\nนี่เป็นสภาพแวดล้อม\nที่ฉันไม่ชอบที่สุดเลยละค่ะ..."
10084-832-110-1 = "ข้อดีเดียวที่มีคงเป็น"
10084-832-120-1 = "การได้ฟังเสียงของคุณครู\nอย่างชัดเจน โดยไม่มี\nเสียงอื่นรบกวนค่ะ"
10084-832-130-1 = "สายลมนี่...\nกำลังร้องไห้อยู่สินะคะ"
10084-832-140-1 = "กำลังค้นหาความถี่...\nบันทึกการสื่อสาร\nภายในรัศมี 3 กม."
10084-832-150-1 = "ไม่มีเลย"
10084-832-590-1 = "คะ... คุณครู...\nถ้าไม่ว่าอะไรละก็..."
10084-832-600-1 = "มาช่วยกันตั้งแคมป์\nหน่อยได้มั้ยคะ..."
10084-832-610-1 = "อ๊ะ คุณครู ฉันกำลังติดตั้งของที่จำเป็น\nในแคมป์ตามคำสั่งของรองหัวหน้าอยู่ค่ะ"
10084-832-620-1 = "ได้ยินว่าเป็นอุปกรณ์ค่ายพักแรม\nสำหรับการแคมป์ปิ้งง่ายๆ..."
10084-832-630-1 = "แต่การกางเต็นท์นี่ก็\nมันไม่ง่ายเลยนะคะ"
10084-832-640-1 = "มีอะไรจะบอกฉันรึเปล่าคะ...?"
10084-832-650-1 = "รอฉันสักเดี๋ยวนะคะ\nฉันจะไปเอาเครื่องบันทึกเสียงมาค่ะ"
10084-832-660-1 = "อย่างนี้นี่เองสินะคะ ฉันจะจดจำไว้ค่ะ"
10084-832-670-1 = "ที่คุณครูเพิ่งทำเมื่อกี้\nช่วยทำให้ดูอีกครั้งได้มั้ยคะ?"
10084-832-680-1 = "ถ้าเป็นไปได้ก็ช่วยพูด\nอธิบายไปด้วยนะคะ"
10084-832-690-1 = "เท่านี้ก็น่าจะใช้เวลาคืนนี้\nได้อย่างสบายแล้วละค่ะ"
10084-10832-10-1 = "ลมเย็นๆ พัดผ่าน\nตามเสื้อผ้า..."
