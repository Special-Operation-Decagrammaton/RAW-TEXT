[translation]
10084-832-10-1 = "因為風會從衣服\n縫隙吹進來……"
10084-832-20-1 = "讓人不自覺地\n縮起身體。"
10084-832-30-1 = "特地出來\n過年什麼的……\n真是欠缺效率。"
10084-832-40-1 = "（就算是副部長，\n　應該也想不到\n　我會把竊聽器\n　藏在這種地方吧）"
10084-832-50-1 = "（呵呵……）"
10084-832-60-1 = "為什麼熊會在\n這種時候……"
10084-832-70-1 = "感覺到了\n世界的惡意……"
10084-832-80-1 = "得趕快回去\n編輯錄到的\n老師的語音檔……"
10084-832-90-1 = "不，不對，我是想\n趕快休息……！"
10084-832-100-1 = "沉默和寂靜……\n是我最討厭的環境……"
10084-832-110-1 = "唯一的好處……"
10084-832-120-1 = "就只有能在沒有雜音\n的情況下清楚聽到\n老師的聲音了吧。"
10084-832-130-1 = "這陣風……有種……\n在哭泣的感覺。"
10084-832-140-1 = "正在搜尋頻率……\n半徑3km內的\n通訊紀錄……"
10084-832-150-1 = "0件。"
10084-832-590-1 = "老，老師……\n如果可以的話……"
10084-832-600-1 = "帳篷的搭設可以請你幫忙嗎……"
10084-832-610-1 = "啊，老師。\n我正依照副部長的指示\n進行帳篷的搭設。"
10084-832-620-1 = "我聽說這是\n「超簡單搭設」的\n露營裝備……"
10084-832-630-1 = "但設置起來好像\n一點也不簡單……"
10084-832-640-1 = "有什麼想說的話嗎……？"
10084-832-650-1 = "請稍等一下。\n我要做錄音的準備。"
10084-832-660-1 = "原來如此，我會參考的。"
10084-832-670-1 = "剛才那個，\n能再讓我看一次嗎？"
10084-832-680-1 = "可以的話，麻煩\n一起附上口頭解說。"
10084-832-690-1 = "這樣一來，今晚\n應該能舒服地度過了。"
