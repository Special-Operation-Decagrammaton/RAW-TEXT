[translation]
10093-835-400-1 = "是開心愉快的\n修學旅行呢！\n老師也準備好了嗎？"
10093-835-410-1 = "夜櫻綺羅羅，\n享受準備完畢～！"
10093-835-420-1 = "老師也在享受旅行嗎？"
10093-835-430-1 = "真讚！\n我也超享受的唷！"
10093-835-440-1 = "旅行結束\n雖然令人遺憾……"
10093-835-450-1 = "沒關係。開心的事\n之後還會有很多很多！"
10093-835-460-1 = "呼啊！直到最後都\n沒有空檔休息呢！\n超開心的！"
10093-835-470-1 = "期待的事？"
10093-835-480-1 = "新的地方、新的美食，\n還有最重要的……\n新朋友們吧！"
10093-835-490-1 = "我找到一個感覺能\n拍出好照片的地方，\n老師要不要一起去？"
10093-835-500-1 = "是在那裡的一棵\n超大的樹……！"
10093-835-510-1 = "嗯？怎麼了？\n發生了什麼\n有趣的事嗎？"
10093-835-520-1 = "啊哈哈！真巧呢！\n我也正在看著老師哦！"
10093-835-700-1 = "歡迎，老師！\n準備好了嗎？"
10093-835-710-1 = "會出現什麼呢～\n不覺得很期待嗎？"
10093-835-720-1 = "努力到最後吧，老師！"
10093-835-730-1 = "哪張會中獎呢～"
10093-835-740-1 = "反正不抽也\n不會知道，\n儘管抽吧！"
10093-835-750-1 = "哇！\n是超級稀有的卡片耶！\n老師好厲害！"
10093-835-760-1 = "是張好卡片呢！\n恭喜你！"
10093-835-770-1 = "雖然是常見的卡片……\n不過卡面很可愛，\n也不錯吧？"
10093-835-780-1 = "啊，這，這我\n倒是沒料到……"
10093-835-790-1 = "別，別失望！老師！\n還有下一次的！"
