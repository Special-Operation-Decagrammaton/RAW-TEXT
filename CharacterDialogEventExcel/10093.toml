[translation]
10093-835-400-1 = "楽しい楽しい\n修学旅行だね！\n先生も準備できた？"
10093-835-410-1 = "夜桜キララ、\n楽しむ準備完了～！"
10093-835-420-1 = "先生も旅行楽しんでる？"
10093-835-430-1 = "いいね！\nあたしも超満喫してるよ！"
10093-835-440-1 = "旅行が終わっちゃうのは\n名残惜しいけど……"
10093-835-450-1 = "大丈夫。楽しいことは、\nまだまだあるからね！"
10093-835-460-1 = "ふわぁ！最後まで\n休む暇なかったね！\n超楽しかった！"
10093-835-470-1 = "楽しみにしてること？"
10093-835-480-1 = "新しい場所、\n新しいグルメ、\nそして何よりも……\n新しい友達でしょ！"
10093-835-490-1 = "いい写真が撮れそうな\nとこ見つかったけど、\n先生もどう？"
10093-835-500-1 = "あそこのすっごい大きい\n木なんだけどさ……！"
10093-835-510-1 = "うん？どうしたの？\n何か面白そうなことでも\nあった？"
10093-835-520-1 = "あははっ！偶然だね！\nあたしも先生の\nこと見てたんだ！"
10093-835-700-1 = "いらっしゃい、先生！\n準備はいい？"
10093-835-710-1 = "何が出るかな～\nワクワクしない？"
10093-835-720-1 = "最後まで頑張ろう、先生！"
10093-835-730-1 = "どれが当たりかな～"
10093-835-740-1 = "引いてみないと\n分かんないし、\nスパッと行こう！"
10093-835-750-1 = "わぁ！\n超レアカードじゃん！\n先生、すっごい！"
10093-835-760-1 = "いいカードだね！\nおめでとう！"
10093-835-770-1 = "よく見るカードだけど……\n絵柄も可愛いし、\n別にいんじゃない？"
10093-835-780-1 = "あっ、こ、これは\n予想外だなぁ……"
10093-835-790-1 = "が、がっかりしないで！\n先生！次あるから！"
