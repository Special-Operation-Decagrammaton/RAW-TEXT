[translation]
10093-835-400-1 = "ทัศนศึกษาสนุกมากเลย!\nครูก็พร้อมแล้วหรือยัง?"
10093-835-410-1 = "โยซากุระ คิราระ\nพร้อมไปสนุกแล้วละ!"
10093-835-420-1 = "ครูสนุกกับการทัวร์อยู่มั้ย?"
10093-835-430-1 = "ดีเลย! ฉันเองก็กำลัง\nสนุกสุดเหวี่ยงเลย!"
10093-835-440-1 = "น่าเสียดายจังเลย\nที่การทัวร์ครั้งนี้จบลง..."
10093-835-450-1 = "แต่ไม่เป็นไรหรอก\nเดี๋ยวก็มีเรื่องสนุกอื่นอีก!"
10093-835-460-1 = "เฮ้อ! ไม่ได้พัก\nจนถึงตอนสุดท้ายเลยสินะ!\nสนุกสุดๆ ไปเลย!"
10093-835-470-1 = "สิ่งที่ตั้งตารอเหรอ?"
10093-835-480-1 = "สถานที่ใหม่ๆ ของกินใหม่ๆ\nและที่สำคัญที่สุด...\nก็คือเพื่อนใหม่ไงล่ะ!"
10093-835-490-1 = "ฉันเจอที่ที่น่าจะถ่ายรูปสวย\nมาด้วยแหละ คุณครูคิดว่าไง?"
10093-835-500-1 = "ต้นไม้ต้นใหญ่ๆ\nที่อยู่ทางโน้นน่ะ...!"
10093-835-510-1 = "หืม? มีอะไรเหรอ?\nเจอเรื่องอะไรน่าสนุกๆ เหรอ?"
10093-835-520-1 = "อะฮ่าฮ่า! บังเอิญจัง!\nฉันก็มองครูอยู่พอดีเลย!"
10093-835-700-1 = "เชิญเลยครู!\nพร้อมรึยัง?"
10093-835-710-1 = "จะได้อะไรน้า~\nตื่นเต้นมั้ย?"
10093-835-720-1 = "สู้ๆ จนจบงานเลยนะครู!"
10093-835-730-1 = "จะได้ของชิ้นไหนน้า~"
10093-835-740-1 = "ถ้าไม่ลองสุ่มก็ไม่รู้นะ\nไม่ต้องลังเลแล้ว สุ่มเลย!"
10093-835-750-1 = "ว้าว!\nนี่มันการ์ดหายากนี่นา!\nสุดยอดไปเลยครู!"
10093-835-760-1 = "ได้การ์ดดีเลย!\nดีใจด้วยนะ!"
10093-835-770-1 = "พอดูไปดูมาบ่อยๆ แล้วมันก็...\nรูปมันก็น่ารักดีอยู่หรอกนะ?"
10093-835-780-1 = "อ๊ะ อะ... อันนี้ฉันคาดไม่ถึงแฮะ..."
10093-835-790-1 = "อย่าผิดหวังไปเลยนะครู!\nยังมีครั้งหน้าอีกนะ!"
10093-10835-400-1 = "ทัศนศึกษาสนุกมากเลย!\nครูก็พร้อมแล้วหรือยัง?"
