[translation]
10093-835-400-1 = "What a fun-filled field trip! Ready, Teach?"
10093-835-410-1 = "Yozakura Kirara, all set to have fun!"
10093-835-420-1 = "Are you enjoying the trip, Teach?"
10093-835-430-1 = "Awesome! I'm having a great time too!"
10093-835-440-1 = "It's sad that our field trip is coming to an end..."
10093-835-450-1 = "Don't worry! There'll be plenty of good times ahead!"
10093-835-460-1 = "Wow! Non-stop excitement from start to finish! It was an absolute blast!"
10093-835-470-1 = "What do I look forward to?"
10093-835-480-1 = "New places, new foods, and above all...new friends!"
10093-835-490-1 = "I found the perfect spot for photos. What do you think?"
10093-835-500-1 = "It's that massive tree over there!"
10093-835-510-1 = "Huh? What's up? Did you see something interesting?"
10093-835-520-1 = "Haha! What a coincidence! I was looking at you too, Teach!"
10093-835-700-1 = "Welcome, Teach! All ready?"
10093-835-710-1 = "I wonder what it'll be! Aren't you excited?"
10093-835-720-1 = "Stay strong until the very end, Teach!"
10093-835-730-1 = "I wonder what the winning prize will be!"
10093-835-740-1 = "Let's draw one right now! We won't know until we try!"
10093-835-750-1 = "Wow! A rare card! Amazing!"
10093-835-760-1 = "That's a good card! Congrats!"
10093-835-770-1 = "Even though it's a familiar sight...isn't the artwork so charming?"
10093-835-780-1 = "Oops. I-I didn't expect this..."
10093-835-790-1 = "Don't feel down, Teach! There's always next time!"
