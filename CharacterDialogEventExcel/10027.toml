[translation]
10027-806-100-1 = "準備はできてる。\nさあ行こう、先生。"
10027-806-110-1 = "……そろそろ作戦の時間？"
10027-806-120-1 = "大丈夫、いつでも行ける。"
10027-806-130-1 = "油断は禁物。\nなにせ、進み始めた\n時間は待ってくれない。"
10027-806-140-1 = "そろそろ終わりが\n見えてきたな……。"
10027-806-150-1 = "私の方はいつでも\n準備できてるから、\n任せて。"
10027-806-160-1 = "仕上げは最後まで、\n確実に。"
10027-806-170-1 = "先生、\n何か手伝えることはある？"
10027-806-180-1 = "……ん、どうかした？\n何か作戦に関する話？"
10027-806-190-1 = "ほら、そろそろ\n出発の時間だから……\nそういうのは後で。"
10027-806-200-1 = "出発する時は声をかけて。\nこっちは\n準備出来てるから。"
10027-806-210-1 = "……ん？先生、\n今私のことを呼んだ？"
10027-806-340-1 = "作戦の報酬か……"
10027-806-350-1 = "まずは中身を\nざっと確認してみよう"
10027-806-360-1 = "これは、効率を考えないと……\n数字を扱うのは苦手だ……"
10027-806-370-1 = "先生、見て。どうやらまだ\n間に合うみたいだ。"
10027-806-380-1 = "え、代わりに計算……？"
10027-806-390-1 = "せ、先生は私が数学苦手なの、\n知ってるだろう……！？"
10027-806-400-1 = "ごめん、計算とかはちょっと、\n手助けしてあげられない……。"
10027-806-410-1 = "ああ、良い選択だと思う。"
10027-806-420-1 = "それを選んだんだ。\nうん、良いと思う。"
10027-806-430-1 = "うん、悪くない。"
10027-806-440-1 = "流石は先生、良い判断だ。"
