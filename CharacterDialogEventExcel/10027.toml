[translation]
10027-806-100-1 = "เตรียมพร้อมแล้วล่ะ\nออกเดินทางกันเถอะคุณครู"
10027-806-110-1 = "ถึงเวลาทำภารกิจแล้วเหรอ?"
10027-806-120-1 = "ฉันเตรียมพร้อมอยู่ตลอดเลยล่ะ"
10027-806-130-1 = "ห้ามการ์ดตกเด็ดขาดนะคุณครู\nเวลามันไม่คอยเราหรอกนะ"
10027-806-140-1 = "ใกล้จะจบแล้วสินะ..."
10027-806-150-1 = "ไม่มีปัญหา\nทุกอย่างเตรียมพร้อมไว้แล้วล่ะ"
10027-806-160-1 = "ต้องปิดฉากให้เด็ดขาดสิ"
10027-806-170-1 = "ฉันจะช่วยเองนะคุณครู"
10027-806-180-1 = "หืม? มีอะไรเหรอ?\nเรื่องเกี่ยวกับภารกิจเหรอ?"
10027-806-190-1 = "น่าจะต้อง...\nค่อยๆ ออกเดินทางกันนะ"
10027-806-200-1 = "ถ้าตัดสินใจได้แล้วก็บอกนะ\nฉันเตรียมพร้อมไว้ทุกเวลาอยู่แล้ว"
10027-806-210-1 = "หืม...?\nคุณครูเรียกฉันเหรอ?"
10027-806-340-1 = "เป็นผลของการปฏิบัติการสินะ"
10027-806-350-1 = "ถ้างั้นก็มาดูรายละเอียดกันเลยไหม"
10027-806-360-1 = "เป็นงานที่เน้นประสิทธิภาพสินะ\nฉันไม่ถนัดเรื่องนับเลขเลย..."
10027-806-370-1 = "มันน่าจะยัง\nหาได้อีกอยู่นะคุณครู"
10027-806-380-1 = "หืม...?\nให้คิดเลขให้แทนงั้นเหรอ?"
10027-806-390-1 = "คะ...คุณครูน่าจะรู้เรื่องที่ฉัน\nคิดเลขไม่เก่งอยู่แล้วนี่นา...?!"
10027-806-400-1 = "ขอโทษนะ เรื่องคิดเลขน่ะ\nฉันคงช่วยไม่ได้หรอก"
10027-806-410-1 = "เลือกได้ยอดเยี่ยมมาก"
10027-806-420-1 = "เลือกอันนั้นเหรอ\nอื้อ เลือกได้ดีเลยนะ"
10027-806-430-1 = "อืม ฉันก็เห็นด้วยเหมือนกัน"
10027-806-440-1 = "สมกับที่เป็นคุณครูจริงๆ"
