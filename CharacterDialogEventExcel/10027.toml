[translation]
10027-806-100-1 = "All ready, Sensei. Let's leave."
10027-806-110-1 = "Is it about time for a mission?"
10027-806-120-1 = "It's fine. I'm always on stand by."
10027-806-130-1 = "Danger comes when you least expect it, Sensei. Time waits for no one."
10027-806-140-1 = "The end is approaching."
10027-806-150-1 = "Everything is ready on my side. Leave it to me."
10027-806-160-1 = "Must finish strong."
10027-806-170-1 = "I will help, Sensei."
10027-806-180-1 = "Huh? What is it? Is it related to the mission?"
10027-806-190-1 = "It's about time we start heading out, so let's talk about that later."
10027-806-200-1 = "Let me know when we're ready to go. I can go right away."
10027-806-210-1 = "...Huh? Did you call me, Sensei?"
10027-806-340-1 = "It's the mission results."
10027-806-350-1 = "Shall we check the contents?"
10027-806-360-1 = "It requires efficiency. If only I were any good at math..."
10027-806-370-1 = "Look, Sensei. We're not too late."
10027-806-380-1 = "Wait, you want me to calculate it for you?"
10027-806-390-1 = "B-But I told you I'm bad at math!"
10027-806-400-1 = "I-I can't solve something like this..."
10027-806-410-1 = "A great choice."
10027-806-420-1 = "So that's your choice. Now I get it."
10027-806-430-1 = "Yes, I agree."
10027-806-440-1 = "I knew I could count on you."
