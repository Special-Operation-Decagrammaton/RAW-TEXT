10027-10806-390-1 = "老，老師知道我\n數學不好吧……！？"
10027-10806-400-1 = "抱歉，計算之類的\n我幫不上忙……"
10027-10806-410-1 = "啊啊，我覺得是個好選擇。"
10027-10806-420-1 = "選了那個啊。\n嗯，我覺得很好。"
10027-10806-430-1 = "嗯，還不錯。"
10027-10806-440-1 = "不愧是老師，判斷得真好。"
