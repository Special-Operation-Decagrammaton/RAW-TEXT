[translation]
10027-806-100-1 = "준비는 됐어.\n출발하자, 선생님."
10027-806-110-1 = "……슬슬 작전 시간인가?"
10027-806-120-1 = "괜찮아, 언제든 갈 수 있다."
10027-806-130-1 = "방심은 금물이다.\n여하튼, 흘러간 시간은\n기다려 주지 않으니까."
10027-806-140-1 = "슬슬 끝이 보이기 시작했군……"
10027-806-150-1 = "내 쪽은 언제든 준비되었으니,\n맡겨 둬."
10027-806-160-1 = "마무리는 확실하게 해야지."
10027-806-170-1 = "내가 도와주겠어, 선생님."
10027-806-180-1 = "응? 무슨 일이지?\n작전과 관련된 일인가?"
10027-806-190-1 = "자, 슬슬 출발할\n시간이니까……\n그런 건 나중에."
10027-806-200-1 = "출발할 때 말해줘.\n이쪽은 준비되었으니까."
10027-806-210-1 = "……응?\n선생님, 지금 불렀나?"
10027-806-340-1 = "작전의 성과로군."
10027-806-350-1 = "일단 내용물을 훑어보도록 할까."
10027-806-360-1 = "이건 효율을 따져봐야겠어…….\n숫자를 다루는 건 서투른데……."
10027-806-370-1 = "선생님. 이거 봐. 아무래도\n아직 늦진 않은 모양이다."
10027-806-380-1 = "뭐, 대신 계산해 달라고……?"
10027-806-390-1 = "서, 선생님은 내가\n수학을 잘 못하는 걸,\n알고 있을 텐데……?!"
10027-806-400-1 = "미안, 계산 같은 건 좀\n도와줄 수 없다……."
10027-806-410-1 = "훌륭한 선택이다."
10027-806-420-1 = "그것을 골랐군.\n응. 좋다고 생각해."
10027-806-430-1 = "응. 나도 동의한다."
10027-806-440-1 = "역시 선생님이로군."
