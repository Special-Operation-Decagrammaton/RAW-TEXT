[translation]
10027-806-100-1 = "準備已經完成。\n出發吧，老師。"
10027-806-110-1 = "……快到作戰時間了？"
10027-806-120-1 = "沒問題，我隨時可以出發。"
10027-806-130-1 = "不能掉以輕心。\n畢竟流逝的時間\n是不等人的。"
10027-806-140-1 = "差不多要結束了呢……"
10027-806-150-1 = "我隨時都\n做好了準備，\n交給我吧。"
10027-806-160-1 = "收尾要確實做到最後。"
10027-806-170-1 = "老師，#n有什麼我能幫忙的嗎？"
10027-806-180-1 = "……嗯，怎麼了？\n是和作戰有關的事嗎？"
10027-806-190-1 = "你看，快要到\n出發時間了……\n那種事等等再說。"
10027-806-200-1 = "要出發的時候和我說一聲。\n我已經準備好了。"
10027-806-210-1 = "……嗯？老師，\n你剛才叫我嗎？"
10027-806-340-1 = "是作戰的報酬啊……"
10027-806-350-1 = "先大致確認\n一下內容物吧。"
10027-806-360-1 = "這個，得考慮效率才行……\n但我不擅長面對數字啊……"
10027-806-370-1 = "老師，你看。\n看來似乎還來的及呢。"
10027-806-380-1 = "咦，要我幫你計算……？"
10027-806-390-1 = "老，老師也知道\n我不擅長數學吧……！？"
10027-806-400-1 = "抱歉，計算之類的事，\n我有點幫不上忙……"
10027-806-410-1 = "啊啊，是個不錯的選擇。"
10027-806-420-1 = "選擇了那個啊。\n嗯，我覺得很好。"
10027-806-430-1 = "嗯，不錯。"
10027-806-440-1 = "不愧是老師，判斷的很好。"
10027-10806-100-1 = "準備好了。\n走吧，老師。"
10027-10806-110-1 = "……差不多到作戰時間了？"
10027-10806-120-1 = "沒問題，隨時可以出發。"
10027-10806-130-1 = "不可掉以輕心。\n畢竟，一旦開始，\n時間是不等人的。"
10027-10806-140-1 = "差不多要結束了……"
10027-10806-150-1 = "我這邊隨時都準備好了，\n交給我吧。"
10027-10806-160-1 = "確實地完成到最後。"
10027-10806-170-1 = "老師，\n有什麼可以幫忙的嗎？"
10027-10806-180-1 = "……嗯，怎麼了？\n是要說關於作戰的事嗎？"
10027-10806-190-1 = "好了，差不多\n到出發時間了……\n有事以後再說吧。"
10027-10806-200-1 = "要出發的時候說一下。\n這邊已經準備好了。"
10027-10806-210-1 = "……嗯？老師，\n你剛才有叫我嗎？"
10027-10806-340-1 = "作戰的報酬嗎……"
10027-10806-350-1 = "先大致確認一下\n內容物吧。"
10027-10806-360-1 = "這個，如果不考慮效率的話……\n我不擅長處理數字……"
10027-10806-370-1 = "老師，你看。\n好像還來得及。"
