[translation]
10055-808-450-1 = "ยะฮู้ว คุณครู\nถ้าไม่ติดอะไร มาช่วยงาน\nของออนเซ็นหน่อยได้ไหม?"
10055-808-460-1 = "พอมีเวลาหน่อยไหม?\nฉันอยากชวนขยับร่างกาย\nก่อนจะลงไปแช่ตัวน่ะ"
10055-808-470-1 = "โนโดกะนี่ก็ขยันเหลือเกิน~"
10055-808-480-1 = "ฮุฮุ รอบนี้\nชามอร์สหมักมาได้ที่เลย"
10055-808-490-1 = "หืม...? อยากอาบน้ำ\nกับฉันเหรอ?"
10055-808-500-1 = "ล้อเล่นน่า\nอย่าทำหน้าจริงจังแบบนั้นสิ"
10055-808-510-1 = "ขอบคุณมากนะ\nถ้าไม่ติดอะไร ลองมอร์ส... สักกรึ๊บไหม?"
10055-808-520-1 = "สมกับเป็นคุณครูจริงๆ เลย\nรู้แล้วว่าทำไมคนอื่นถึงชอบกันนัก"
