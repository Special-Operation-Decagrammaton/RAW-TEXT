[translation]
10055-808-450-1 = "やっほー、先生。\nよかったら温泉郷の仕事を\n手伝ってもらえないかな。"
10055-808-460-1 = "ちょっといい？\n温泉に浸かる前に軽く運動したくて。"
10055-808-470-1 = "ノドカは\n頑張り屋さんなんだから。"
10055-808-480-1 = "ふふ、今回のモルスは\nよく出来てる。"
10055-808-490-1 = "ん？一緒に\nお風呂に行きたいの？"
10055-808-500-1 = "冗談。\nそんな真顔にならないで。"
10055-808-510-1 = "お疲れ様。\nよかったらモルス一口、どう？"
10055-808-520-1 = "さすが先生。\n皆に人気の理由が分かったよ。"
