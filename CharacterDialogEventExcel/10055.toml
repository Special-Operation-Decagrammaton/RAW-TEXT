[translation]
10055-808-450-1 = "Awesome, it's Sensei. Can you help us out at the hot springs resort a little?"
10055-808-460-1 = "Do you have a moment? Before we go in the water, let's warm up a little."
10055-808-470-1 = "Nodoka is working so hard!"
10055-808-480-1 = "Heehee. The mors came out perfectly this time."
10055-808-490-1 = "Oh? Are you saying you want to take a bath with me?"
10055-808-500-1 = "It was a joke. You didn't have to react like that."
10055-808-510-1 = "Good job. Do you want a sip of mors?"
10055-808-520-1 = "I see...why you're so popular with everyone, Sensei."
