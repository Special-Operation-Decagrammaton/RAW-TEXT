[translation]
10055-808-450-1 = "呀齁～老師。\n方便的話可以請你\n協助溫泉浴場的工作嗎。"
10055-808-460-1 = "有空嗎？\n我想在泡溫泉之前\n稍微運動一下。"
10055-808-470-1 = "和香真是個認真的人呢。"
10055-808-480-1 = "呵呵，這次的\n漿果汁做得很好。"
10055-808-490-1 = "……嗯？\n想跟我一起洗澡嗎？"
10055-808-500-1 = "開玩笑的。\n別露出那麼認真的表情。"
10055-808-510-1 = "辛苦了。\n要不要來一口漿果汁？"
10055-808-520-1 = "不愧是老師。\n我知道你有人氣的理由了唷。"
