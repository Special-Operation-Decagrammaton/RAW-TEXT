[translation]
26009-825-160-1 = "คุณครู! คือว่า... "
26009-825-170-1 = "ยินดีต้อนรับค่ะนายท่าน"
26009-825-180-1 = "ฉันยังไม่คุ้นเคย\nกับที่ที่มีคนเยอะ\nขนาดนี้น่ะค่ะ..."
26009-825-190-1 = "ฉันคิดว่านี่ก็\nเป็นงานอย่างหนึ่ง\nเช่นกันค่ะ..."
26009-825-200-1 = "ทั้งทำความสะอาด\nทั้งรับลูกค้า..."
26009-825-210-1 = "งือ... ถ้ามีลูกค้าน้อยกว่านี้\nสักหน่อยก็คงจะดีสิคะ..."
26009-825-220-1 = "กะ... เกิดเรื่องใหญ่\nแล้วค่ะ...!"
26009-825-230-1 = "คุณครู...\nช่วยด้วยค่ะ...!"
26009-825-240-1 = "เกิดเรื่องแบบนั้นได้ยังไง\nฉันยังไม่อยากเชื่อเลยค่ะ..."
26009-825-250-1 = "คลี่คลายเรื่องนั้นได้\nเพราะได้คุณครูช่วยไว้เลยค่ะ"
26009-825-260-1 = "กะ... กล่อง...! กล่องหายไปไหน\nแล้วคะ...? ถ้าไม่มีกล่องใบนั้น ฉันคง..."
26009-825-270-1 = "อ๊ะ ช่วยหามาให้แล้วเหรอคะ...!"
26009-825-280-1 = "ขอบคุณนะคะคุณครู..."
26009-825-290-1 = "นะ... น่ากลัวมากเลย\nแต่ว่า..."
26009-825-300-1 = "ประสบการณ์นี้\nอาจจะเป็นประโยชน์\nต่อเกมก็ได้..."
26009-825-310-1 = "คุณครูคะ ฉัน...\nจะทำได้ดีไหมคะ?"
26009-825-320-1 = "งือ... อยากกลับไป\nเล่นเกมจัง..."
26009-825-330-1 = "แต่ว่าจะมาเอาแต่ตัวสั่น\nอยู่แบบนี้ไม่ได้ใช่ไหมคะ"
26009-825-340-1 = "ถ้าฉันไม่ยอมทำ\nในสิ่งที่ทำได้ละก็..."
