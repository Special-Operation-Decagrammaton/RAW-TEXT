[translation]
26009-825-160-1 = "先生！えっと…"
26009-825-170-1 = "おかえりなさいませ、\nご主人様。"
26009-825-180-1 = "こんなに人が\nいるところは、\n慣れてなくて…。"
26009-825-190-1 = "これもある意味、\nイベントだとは\n思いますが…。"
26009-825-200-1 = "掃除におもてなし…"
26009-825-210-1 = "うう、\nお客さんがもうちょっと\n少なかったら…。"
26009-825-220-1 = "た、大変なことに\nなってしまいました…！"
26009-825-230-1 = "先生…\n助けてください…！"
26009-825-240-1 = "あんなことが\n起きたなんて、\n未だに信じられません…"
26009-825-250-1 = "解決できたのは、\n全部先生のお陰です。"
26009-825-260-1 = "は、箱は？\n箱はどこに？\nあれがないと、\nわたし…"
26009-825-270-1 = "あ、見つけて\nくださったんですね！"
26009-825-280-1 = "ありがとうございます、\n先生。"
26009-825-290-1 = "その…すごく、\n怖いですが…"
26009-825-300-1 = "この体験は、\nゲームに生かせるかも\nしれませんし…。"
26009-825-310-1 = "先生。\nわたし…上手く\nできるでしょうか？"
26009-825-320-1 = "うう…\n帰ってゲームしたい…。"
26009-825-330-1 = "でも、震えてばかりじゃ\nいけませんよね。"
26009-825-340-1 = "わたしにできることを\nしないと…。"
