[translation]
26009-825-160-1 = "선생님! 저기… "
26009-825-170-1 = "어서 오세요, 주인님."
26009-825-180-1 = "이렇게나\n많은 사람이 있는 곳은,\n익숙하지 않아서…"
26009-825-190-1 = "이것도 어떻게 보면,\n이벤트라고는\n생각하지만요…"
26009-825-200-1 = "청소에 접대에…"
26009-825-210-1 = "으으…\n손님들이 조금만\n적었어도…"
26009-825-220-1 = "큰, 큰일이\n나 버렸어요…!"
26009-825-230-1 = "선생님… \n도와주세요…!"
26009-825-240-1 = "그런 일이 일어났다니,\n아직도 믿을 수 없어요…"
26009-825-250-1 = "해결할 수 있었던 건,\n다 선생님 덕분이에요."
26009-825-260-1 = "사, 상자가…!\n상자가, 어디 있죠…? \n그게 없으면, 저는…"
26009-825-270-1 = "아, 찾아 주셨군요…!"
26009-825-280-1 = "감사합니다. 선생님…"
26009-825-290-1 = "그… 굉장히,\n무섭지만…"
26009-825-300-1 = "이 경험은, \n게임으로 살릴 수\n있을지도 모르니…"
26009-825-310-1 = "선생님. 저…\n잘할 수 있을까요?"
26009-825-320-1 = "으으…돌아가서\n게임 하고 싶어…"
26009-825-330-1 = "하지만, 떨기만 하면\n안 되겠죠."
26009-825-340-1 = "제가 할 수 있는 일을\n하지 않으면…"
