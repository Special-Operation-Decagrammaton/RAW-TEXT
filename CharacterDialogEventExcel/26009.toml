[translation]
26009-825-160-1 = "老師！那個… "
26009-825-170-1 = "歡迎回來，主人。"
26009-825-180-1 = "人這麼\n多的地方，\n我不太習慣…"
26009-825-190-1 = "雖然我覺得，\n某方面來說\n這也算是活動…"
26009-825-200-1 = "打掃跟接待…"
26009-825-210-1 = "嗚嗚，\n要是客人能\n再少一點…"
26009-825-220-1 = "出，出大事了…！"
26009-825-230-1 = "老師…\n請幫幫我…！"
26009-825-240-1 = "竟然會發生那種事，\n我到現在還不敢相信…"
26009-825-250-1 = "之所以能夠解決，\n全都是多虧了老師。"
26009-825-260-1 = "箱，箱子呢？\n箱子跑哪去了？\n沒有那個的話，我…"
26009-825-270-1 = "啊，你幫我找到了呢…！"
26009-825-280-1 = "謝謝你，老師。"
26009-825-290-1 = "那個…雖然，\n非常害怕…"
26009-825-300-1 = "但這些經驗，\n說不定能\n轉化成遊戲…"
26009-825-310-1 = "老師。我…\n有辦法做好嗎？"
26009-825-320-1 = "嗚嗚…\n想回去玩遊戲…"
26009-825-330-1 = "但是，不能\n光是發抖對吧。"
26009-825-340-1 = "如果我不做\n我能做的事…"
