[translation]
26009-825-160-1 = "Sensei! Um..."
26009-825-170-1 = "Welcome, Master."
26009-825-180-1 = "There's so many people here... I'm not used to crowds..."
26009-825-190-1 = "But I can think of it like a special event, right?"
26009-825-200-1 = "Cleaning, hosting..."
26009-825-210-1 = "Ugh... I just wish there were fewer guests..."
26009-825-220-1 = "Th-There's big trouble!"
26009-825-230-1 = "Sensei...please help me!"
26009-825-240-1 = "I still can't believe all of that happened..."
26009-825-250-1 = "But...it all turned out okay. Thanks to you."
26009-825-260-1 = "Th-The box... Where is the box...? Without it, I..."
26009-825-270-1 = "Oh! You found it!"
26009-825-280-1 = "Thank you, Sensei."
26009-825-290-1 = "Um... Even though it was scary..."
26009-825-300-1 = "...all of this might be good inspiration for the game I'm working on..."
26009-825-310-1 = "Sensei, will...will I do okay?"
26009-825-320-1 = "Ugh... I really want to go home and play games..."
26009-825-330-1 = "But I can't just sit here being scared... That helps no one."
26009-825-340-1 = "After all, if I don't try to do everything I can..."
