[translation]
20058-420 = "很熱鬧對吧。"
20058-430 = "可能會有點手忙腳亂，\n不過拜託你囉，老師。"
20058-440 = "呀齁，老師。\n我正好在找你呢。"
20058-450 = "我們的學生\n都不太安分，\n很辛苦吧……"
20058-460 = "如果有什麼\n需要幫忙的就說吧。\n我什麼都會做哦。"
20058-470 = "這樣就……\n沒問題了吧。"
20058-480 = "有點擔心。"
20058-490 = "呃……\n那個要怎麼辦啊。"
20058-500 = "放著不管的話\n會出事，對吧？"
20058-510 = "雖然發生了很多事，\n但很開心呢。"
20058-520 = "老師覺得怎麼樣呢？"
