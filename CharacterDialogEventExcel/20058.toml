[translation]
20058-835-1010-1 = "ที่นี่คึกคักมากเลยใช่มั้ย?"
20058-835-1020-1 = "ถึงจะวุ่นวายหน่อย\nแต่ก็รบกวนด้วยนะ คุณครู"
20058-835-1030-1 = "ยะฮู้ว คุณครู\nฉันกำลัง\nตามหาอยู่พอดี"
20058-835-1040-1 = "ก็อย่างที่รู้ว่า\nเพื่อนๆ ของฉันน่ะ\nอยู่ไม่ค่อยสุขเท่าไร"
20058-835-1050-1 = "ถ้ามีอะไรให้ช่วย\nก็บอกได้ตลอดเลยนะ"
20058-835-1060-1 = "แบบนี้จะเป็นอะไรมั้ยนะ..."
20058-835-1070-1 = "รู้สึกกังวลนิดหน่อยแฮะ"
20058-835-1080-1 = "อึก ทำยังไงดีล่ะ"
20058-835-1090-1 = "ปล่อยอันนั้นไว้แบบนั้น\nคงไม่ได้เนอะ?"
20058-835-1100-1 = "ถึงจะเกิดเรื่องมากมาย\nแต่มันก็สนุกดีนะ"
20058-835-1110-1 = "คุณครูล่ะ เป็นไงบ้าง?"
