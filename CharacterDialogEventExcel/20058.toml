[translation]
20058-420 = "ที่นี่คึกคักมากเลยใช่มั้ย?"
20058-430 = "ถึงจะวุ่นวายหน่อย\nแต่ก็รบกวนด้วยนะ คุณครู"
20058-440 = "ยะฮู้ว คุณครู\nฉันกำลัง\nตามหาอยู่พอดี"
20058-450 = "ก็อย่างที่รู้ว่า\nเพื่อนๆ ของฉันน่ะ\nอยู่ไม่ค่อยสุขเท่าไร"
20058-460 = "ถ้ามีอะไรให้ช่วย\nก็บอกได้ตลอดเลยนะ"
20058-470 = "แบบนี้จะเป็นอะไรมั้ยนะ..."
20058-480 = "รู้สึกกังวลนิดหน่อยแฮะ"
20058-490 = "อึก ทำยังไงดีล่ะ"
20058-500 = "ปล่อยอันนั้นไว้แบบนั้น\nคงไม่ได้เนอะ?"
20058-510 = "ถึงจะเกิดเรื่องมากมาย\nแต่มันก็สนุกดีนะ"
20058-520 = "คุณครูล่ะ เป็นไงบ้าง?"
