[translation]
20058-835-1010-1 = "很熱鬧對吧。"
20058-835-1020-1 = "可能會有點手忙腳亂，\n不過拜託你囉，老師。"
20058-835-1030-1 = "呀齁，老師。\n我正好在找你呢。"
20058-835-1040-1 = "我們的學生\n都不太安分，\n很辛苦吧……"
20058-835-1050-1 = "如果有什麼\n需要幫忙的就說吧。\n我什麼都會做哦。"
20058-835-1060-1 = "這樣就……\n沒問題了吧。"
20058-835-1070-1 = "有點擔心。"
20058-835-1080-1 = "呃……\n那個要怎麼辦啊。"
20058-835-1090-1 = "放著不管的話\n會出事，對吧？"
20058-835-1100-1 = "雖然發生了很多事，\n但很開心呢。"
20058-835-1110-1 = "老師覺得怎麼樣呢？"
