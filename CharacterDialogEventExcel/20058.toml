[translation]
20058-835-1010-1 = "賑やかだよね。"
20058-835-1020-1 = "ちょっとバタバタすると\n思うけど、よろしく先生。"
20058-835-1030-1 = "やっほ、先生。\nちょうど探してたんだ。"
20058-835-1040-1 = "うちの生徒って\nあんまり落ち着きないから\n大変だよね……。"
20058-835-1050-1 = "手伝えること\nあったら言って。\nなんでもするよ。"
20058-835-1060-1 = "これで大丈夫、かな……。"
20058-835-1070-1 = "ちょっと心配。"
20058-835-1080-1 = "げ……どうすんのさアレ。"
20058-835-1090-1 = "ほっといたら\nまずい、よね？"
20058-835-1100-1 = "色々あったけど、\n楽しかったなぁ。"
20058-835-1110-1 = "先生はどうだった？"
