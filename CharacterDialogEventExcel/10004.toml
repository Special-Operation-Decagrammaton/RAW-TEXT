[translation]
10004-833-980-1 = "Ah, Sensei. There's a whole pile of tasks to be done. I was hoping you'd lend a hand."
10004-833-990-1 = "Would you mind helping me out a little bit?"
10004-833-1000-1 = "Welcome, Sensei."
10004-833-1010-1 = "The party aside, there's something else I must do as part of the Prefect Team."
10004-833-1020-1 = "Seems the work is never done, no matter how much you finish."
10004-833-1030-1 = "Hm? You feel that in your bones? Heehee. So you work a lot, as well..."
10004-833-1040-1 = "I have no plans to stop working."
10004-833-1050-1 = "I am Gehenna's head prefect, after all."
10004-833-1060-1 = "Ah, thank you."
10004-833-1070-1 = "This is a small gift for your help. Please, take it."
10004-833-1080-1 = "Perfect. As expected of you, Sensei. I think I can rest easy now..."
10004-833-1090-1 = "This is a small gift for your help. Here."
