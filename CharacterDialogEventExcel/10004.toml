[translation]
10004-833-980-1 = "อ่า คุณครู ฉันมีหลายเรื่องเลยที่\nอยากให้ช่วยคลี่คลายให้หน่อย"
10004-833-990-1 = "พอจะช่วยหน่อยได้มั้ย?"
10004-833-1000-1 = "เข้ามาสิ คุณครู"
10004-833-1010-1 = "ฉันมีเรื่องอื่นนอกเหนือจากปาร์ตี้\nที่ต้องทำในฐานะคณะกรรมการวินัย"
10004-833-1020-1 = "งานเป็นสิ่งที่ต่อให้ทำ\nมากเท่าไรๆ ก็ไม่หมดสักทีน่ะ"
10004-833-1030-1 = "หืม? รู้สึกเหมือนกันเลยงั้นเหรอ?\nฮุฮุ คุณครูก็เหนื่อยเหมือนกันสินะ..."
10004-833-1040-1 = "ฉันไม่คิดจะวางมือจากงานหรอก"
10004-833-1050-1 = "ก็ฉันเป็นประธานกรรมการวินัย\nของเกเฮนน่านี่นะ"
10004-833-1060-1 = "อ่า ขอบคุณนะ"
10004-833-1070-1 = "นี่เป็นการตอบแทนที่ช่วยกัน\nช่วยรับไว้ด้วยนะ"
10004-833-1080-1 = "คุณครูทำได้สมบูรณ์แบบจริงๆ\nขอบคุณที่ทำให้วางใจได้นะ..."
10004-833-1090-1 = "นี่เป็นการตอบแทนที่ช่วย รับไปสิ"
