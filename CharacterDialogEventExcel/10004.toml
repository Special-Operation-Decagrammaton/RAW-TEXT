[translation]
10004-833-980-1 = "あ、先生。ちょうど解決して\nほしい仕事が溜まってたの。"
10004-833-990-1 = "少し手伝ってくれるかしら？"
10004-833-1000-1 = "いらっしゃい、先生。"
10004-833-1010-1 = "パーティーとは別に、風紀委員として\nやるべきことがあるの。"
10004-833-1020-1 = "仕事って、いつまでたっても\n終わらないものね。"
10004-833-1030-1 = "ん、本当に、心から共感する？\nふふっ、先生も大変なんだね……"
10004-833-1040-1 = "仕事の手を抜くつもりはないよ。"
10004-833-1050-1 = "私は、ゲヘナの\n風紀委員長だから。"
10004-833-1060-1 = "あ、ありがとう。"
10004-833-1070-1 = "これは手伝ってくれたお礼。\n受け取って。"
10004-833-1080-1 = "さすが先生。完璧だった。\nおかげで安心できそう……"
10004-833-1090-1 = "これは手伝ってくれたお礼。\nはい。"
