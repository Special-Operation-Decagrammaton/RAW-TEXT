[translation]
10004-833-980-1 = "啊，老師。正好有些事\n希望能請你解決。"
10004-833-990-1 = "可以請你幫個忙嗎？"
10004-833-1000-1 = "歡迎你來，老師。"
10004-833-1010-1 = "有些與派對無關，\n身為風紀委員該做的事。"
10004-833-1020-1 = "工作這種東西，總是\n怎麼做都做不完呢。"
10004-833-1030-1 = "嗯？真的打從心底有同感？\n呵呵，老師也很辛苦呢……"
10004-833-1040-1 = "我沒打算丟下工作哦。"
10004-833-1050-1 = "因為我，\n是格黑娜的風紀委員長。"
10004-833-1060-1 = "謝，謝謝你。"
10004-833-1070-1 = "這是幫忙的謝禮。收下吧。"
10004-833-1080-1 = "不愧是老師，真完美。\n託你的福，感覺能放心了……"
10004-833-1090-1 = "這是幫忙的謝禮。來。"
