[translation]
10001-701-10130-1 = "มาแล้วสินะคุณครู\nยินดีที่ได้พบกันอีกนะ"
10001-701-10140-1 = "ฮ้าว... ง่วงจัง..."
10001-701-10150-1 = "พอใส่เสื้อตัวนี้...\nแล้วหนาวรึเปล่างั้นเหรอ?"
10001-701-10160-1 = "นั่นสินะ\nฉันชอบที่มันระบายลมได้ดีน่ะ"
10001-701-10170-1 = "ชุดนี้ใส่สบายก็จริง\nแต่ว่ามันชอบม้วนกลับเข้าข้างในอยู่เรื่อย..."
10001-701-10180-1 = "แย่จัง..."
10001-701-10190-1 = "เสร็จเร็ว...\nกว่าที่คิดเอาไว้อีกนะ"
10001-701-10200-1 = "ยืนยันสำเร็จ"
