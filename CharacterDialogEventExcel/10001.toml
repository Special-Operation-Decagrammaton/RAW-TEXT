[translation]
10001-701-10130-1 = "你回來啦，老師。\n很高興再次見到你。"
10001-701-10140-1 = "哈呃……好睏……"
10001-701-10150-1 = "你說這件衣服……\n不會冷嗎？"
10001-701-10160-1 = "唔嗯，很通風，\n我很喜歡。"
10001-701-10170-1 = "這件衣服雖然很涼快，\n但是彈殼總是會彈進衣服裡…"
10001-701-10180-1 = "真是令人頭大。"
10001-701-10190-1 = "比想像中…還要早結束呢！"
10001-701-10200-1 = "證明完成！"
