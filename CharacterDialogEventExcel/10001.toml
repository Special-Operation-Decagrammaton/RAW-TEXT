[translation]
10001-701-10130-1 = "帰ってきたんだね、先生。\nまた会えてうれしい。"
10001-701-10140-1 = "はう……眠い……。"
10001-701-10150-1 = "この服……\n寒くないかって？"
10001-701-10160-1 = "んー、風通しがいいから\n私は好きだよ。"
10001-701-10170-1 = "この服は涼しいけど、\n薬莢がよく服の中に\n入ってくるから……"
10001-701-10180-1 = "困る。"
10001-701-10190-1 = "思ってたより………\n早く終わった。"
10001-701-10200-1 = "証明完了。"
