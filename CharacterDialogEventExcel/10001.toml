[translation]
10001-701-10130-1 = "돌아왔구나, 선생님.\n다시 만나서 반가워."
10001-701-10140-1 = "하으… 졸려…"
10001-701-10150-1 = "이 옷……\n춥지 않냐고?"
10001-701-10160-1 = "글쎄, 바람이\n잘 들어서 나는 좋아."
10001-701-10170-1 = "이 옷은 시원하지만, 자꾸\n탄피가 옷 안으로 굴러들어와서…"
10001-701-10180-1 = "곤란해."
10001-701-10190-1 = "생각보다……\n일찍 끝났네."
10001-701-10200-1 = "증명 완료."
