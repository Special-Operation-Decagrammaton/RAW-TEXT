[translation]
10120-836-390-1 = "ฮุฮุ มาทางนี้สิ\nคุณครู"
10120-836-400-1 = "เลือกนั่งได้ตามสบายเลยนะ"
10120-836-410-1 = "อีกไม่นาน\nการแสดงก็จะเริ่มขึ้นแล้วละ"
10120-836-420-1 = "อยากได้ขนมเยอะอีกหน่อย..."
10120-836-430-1 = "ไม่สิ ต้องฝึกซ้อมให้เยอะกว่านี้...!"
10120-836-440-1 = "เอาละ ตอนนี้ก็เข้าใกล้\nช่วงฟินาเล่ไปอีกขั้นแล้ว...!"
10120-836-450-1 = "อ่า... สุดยอดเลยนะ\nทำได้ดีมากเลยคุณครู"
10120-836-460-1 = "หืม? มีอะไรเหรอคุณครู?"
10120-836-470-1 = "ถ้าคิดจะสะกิดกันละก็\nช่วยสะกิดตรงไหล่แล้วกัน..."
10120-836-480-1 = "พอได้ตีกลองก็เลยรู้ว่า\nมันเมื่อยไหล่น่าดูเลยแฮะ"
10120-836-490-1 = "ถึงจะสะกิดฉันยังไง\nก็ไม่มีมาการองให้หรอกนะ คุณครู"
10120-836-500-1 = "นั่งก่อนสิ คุณครู"
10120-836-510-1 = "ฉันจะแสดงให้ดูเอง\nว่ามือกลองน่ะเป็นยังไง...!"
