[translation]
10120-836-390-1 = "ふふ、よくぞ来てくれた、\n先生。"
10120-836-400-1 = "楽にしていてくれて\n構わない。"
10120-836-410-1 = "もうすぐ\n演奏が始まるよ。"
10120-836-420-1 = "もっとお菓子が……"
10120-836-430-1 = "いや、練習が必要だ……！"
10120-836-440-1 = "さあ、フィナーレまで\nあと一歩……！"
10120-836-450-1 = "……あぁ、すごかったよ。\nお疲れ様、先生。"
10120-836-460-1 = "ん？どうしたの、先生？"
10120-836-470-1 = "つつくなら、\nこっちもお願い……。"
10120-836-480-1 = "練習で肩が\nひどく凝っててね……。"
10120-836-490-1 = "そんなにつついても、\nマカロンは出ないよ。"
10120-836-500-1 = "そこ座って、先生。"
10120-836-510-1 = "ドラムの真髄、見せて\nあげようじゃないか……！"
