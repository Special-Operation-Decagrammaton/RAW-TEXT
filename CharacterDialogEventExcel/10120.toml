[translation]
10120-836-390-1 = "후후, 어서 오라고,\n선생님."
10120-836-400-1 = "편한 곳에 앉아."
10120-836-410-1 = "곧 연주가\n시작될 테니."
10120-836-420-1 = "좀 더 과자가……"
10120-836-430-1 = "아니 연습이 필요해……!"
10120-836-440-1 = "자, 피날레까지\n이제 한 걸음……!"
10120-836-450-1 = "……아아, 굉장했지.\n수고했어, 선생님."
10120-836-460-1 = "응? 무슨 일이야, 선생님?"
10120-836-470-1 = "찌를 거라면\n어깨를 찔러 줘……"
10120-836-480-1 = "드럼을 치다 보니\n어깨가 뻐근하네……"
10120-836-490-1 = "아무리 찔러도 마카롱은\n안 나온다고, 선생님."
10120-836-500-1 = "앉아 봐, 선생님."
10120-836-510-1 = "드럼이 무엇인지\n알려주지……!"
