[translation]
10120-836-390-1 = "呵呵，真高興\n你來了，老師。"
10120-836-400-1 = "放輕鬆也沒關係。"
10120-836-410-1 = "演奏馬上就要開始囉。"
10120-836-420-1 = "還需要更多點心……"
10120-836-430-1 = "不，還需要\n更多練習……！"
10120-836-440-1 = "來吧，離謝幕\n只差一步了……！"
10120-836-450-1 = "……啊啊，很厲害唷。\n辛苦你了，老師。"
10120-836-460-1 = "嗯？怎麼了，老師？"
10120-836-470-1 = "要戳的話，\n這邊也麻煩了……"
10120-836-480-1 = "練習讓肩膀\n超僵硬的……"
10120-836-490-1 = "就算那樣戳，\n也不會跑出馬卡龍哦。"
10120-836-500-1 = "坐在那邊吧，老師。"
10120-836-510-1 = "鼓的真髓，\n就讓你見識見識吧……！"
