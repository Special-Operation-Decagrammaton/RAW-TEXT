10120-836-390-1 = "Heehee. Welcome, Sensei."
10120-836-400-1 = "Make yourself at home."
10120-836-410-1 = "The performance will begin shortly."
10120-836-420-1 = "We need more snacks..."
10120-836-430-1 = "NO, we need more practice...!"
10120-836-440-1 = "Okay, just one more part until the finale...!"
10120-836-450-1 = "...Ah, it was incredible. Good work, Sensei."
10120-836-460-1 = "Hm? What's the matter, Sensei?"
10120-836-470-1 = "If you're going to poke me, poke my shoulders..."
10120-836-480-1 = "They're so sore from the drumming..."
10120-836-490-1 = "No matter how much you poke me, you're not getting any macarons, Sensei."
10120-836-500-1 = "Sit down, Sensei."
10120-836-510-1 = "I'll show you what the drum can do!"
