19009251-836-810-1 = "นี่คือการเริ่ม...\nในตำนานเลย"
19009251-836-820-1 = "นี่คือการเริ่ม...\nในตำนานเลย"
19009251-836-830-1 = "ไม่มีเวลามาลังเลแล้ว!\n\"Time is Money\" นะ\nคุณครู!"
19009251-836-840-1 = "เพลงก็เหมือนขนมมาดแลน\nมันต้องใช้เวลา\nกว่าจะสมบูรณ์ได้น่ะ"
19009251-836-850-1 = "เพลงที่สุดยอด...\nใกล้จะเสร็จสมบูรณ์แล้ว..."
