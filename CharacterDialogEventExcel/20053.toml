[translation]
20053-853-10-1 = "What's better for an infiltration, onigiri or hyorogan...?"
20053-853-20-1 = "Hm? You're here, Honorable Sensei!"
20053-853-30-1 = "Nice outfit, Honorable Sensei."
20053-853-40-1 = "Seeing you in something like this is new..."
20053-853-50-1 = "Aaaah...! Why the heck is there a fight happening in a FASHION SHOW venue?!"
20053-853-60-1 = "...Mmm, I miss her. Tsukuyo."
20053-853-70-1 = "I wonder if she's doing well... Is she eating ramen properly?"
20053-853-80-1 = "Yes...! With this, the Ninjutsu Research Club is back!"
20053-853-90-1 = "Over here! Honorable Sensei, this way! Hurry!"
20053-853-100-1 = "I'm bored..."
20053-853-110-1 = "Hm? Situations always seem to happen every time I say that?"
20053-853-120-1 = "Ugh... I feel like this dress is a bit tight..."
20053-853-130-1 = "Why do people wear stuff like this?!"
20053-853-140-1 = "What makes a ninja, ninja...?"
20053-853-150-1 = "The outfit...doesn't seem to be it."
20053-853-160-1 = "I'll show you...! That my ninja way..."
20053-853-170-1 = "...won't be stopped by something like clothes!"
20053-853-330-1 = "Oh, you're here, Honorable Sensei! Take your time and look around."
20053-853-340-1 = "About this item..."
20053-853-350-1 = "We have everything except what we don't have! Nyahaha!"
20053-853-360-1 = "Fufu, let's close for the day and go get the new ninja meal, Honorable Sensei!"
20053-853-370-1 = "Choose carefully, buy boldly...!"
20053-853-380-1 = "This is a merch-purchasing technique...!"
20053-853-390-1 = "One day, I'll have \"Michiruchi, A Girl's Ninja Scroll\" merch displayed here...!"
20053-853-400-1 = "Good. Good choice."
20053-853-410-1 = "Yeah, that's the correct choice for a ninja!"
20053-853-420-1 = "For here, or to go—"
20053-853-430-1 = "Ah, wrong place."
20053-853-440-1 = "Oooh...! Yes! That's our store's signature product!"
20053-853-450-1 = "Actually, everything here is!"
20053-853-460-1 = "Fufu, welcome, Honorable Sensei."
20053-853-470-1 = "I, too, happen to be choosing ramen."
20053-853-480-1 = "Hm. A nice smell..."
20053-853-490-1 = "...doesn't seem to be the only thing they've got! Let's go!"
20053-853-500-1 = "Thank you for the food... I'm completely stuffed..."
20053-853-510-1 = "Noodle and broth... That's like ninja and ninjutsu..."
20053-853-520-1 = "What's your favorite ramen, Honorable Sensei?"
20053-853-530-1 = "I feel it...!"
20053-853-540-1 = "The kind of taste that can inspire new ninjutsu!"
20053-853-550-1 = "Auuugh...?! Th-This flavor is...! "
20053-853-560-1 = "Ugh, not bad, huh...?"
20053-853-570-1 = "It's not bad. But that's all! It's just \"not bad\"...!"
20053-853-580-1 = "Ugh, i-is this even ramen...?"
