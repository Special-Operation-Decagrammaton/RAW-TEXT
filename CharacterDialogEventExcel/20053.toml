[translation]
20053-853-10-1 = "帶去潛入任務的話，\n該選飯糰還是兵糧丸……"
20053-853-20-1 = "嗯？老師大人！\n歡迎你來！"
20053-853-30-1 = "老師大人……\n打扮得很讚嘛。"
20053-853-40-1 = "這種感覺也挺新鮮的呢。"
20053-853-50-1 = "啊～～！\n為什麼會在時裝秀\n打起來啊！？"
20053-853-60-1 = "好想見到月夜……"
20053-853-70-1 = "他過得好嗎……拉麵，\n希望他有好好吃……"
20053-853-80-1 = "忍術研究部，完全復活！"
20053-853-90-1 = "老師大人也是！\n這邊這邊！"
20053-853-100-1 = "總覺得有點閒呢……"
20053-853-110-1 = "嗯？\n你說講這種話\n絕對會出事？"
20053-853-120-1 = "嗚嗚……這套衣服，\n緊到很難活動……"
20053-853-130-1 = "大家到底喜歡它的\n哪一點啊……！"
20053-853-140-1 = "服裝並非\n忍者的條件……"
20053-853-150-1 = "既然如此，\n讓忍者之所以為\n忍者的是……！？"
20053-853-160-1 = "仔細看好了……！\n區區的禮服，"
20053-853-170-1 = "對忍者而言根本\n不構成任何阻礙，\n這樣的事實……！"
20053-853-330-1 = "歡迎，老師大人！\n慢慢看吧。"
20053-853-340-1 = "啊！不過關於這個商品，\n我個人覺得──"
20053-853-350-1 = "除了沒有的東西之外，\n什麼都有哦！呵呵呵！"
20053-853-360-1 = "哼哼～快點關門，\n去吃新的忍者套餐吧～！"
20053-853-370-1 = "選擇要慎重，\n購入要大膽……！"
20053-853-380-1 = "這就是購買周邊時的關鍵……！"
20053-853-390-1 = "總有一天，要在這裡擺上\n「少女忍法帖小小三千留」\n的周邊……！"
20053-853-400-1 = "哦哦～那個啊。\n是個好選擇嘛？"
20053-853-410-1 = "沒錯！是忍者的話\n就得選那個才行！"
20053-853-420-1 = "這個，要幫您加熱……"
20053-853-430-1 = "啊，說錯了。"
20053-853-440-1 = "哦哦……！\n那正是首推商品！"
20053-853-450-1 = "雖然全部都是首推就是了！"
20053-853-460-1 = "啊，老師大人也來啦！"
20053-853-470-1 = "……我？\n正在煩惱該選哪種。"
20053-853-480-1 = "嗯嗯～味道真香──"
20053-853-490-1 = "雖然也不只這樣啦！\n總之，走吧～！"
20053-853-500-1 = "多謝款待……\n已經什麼都吃不下了……"
20053-853-510-1 = "麵和湯……\n那正是忍者和忍術……"
20053-853-520-1 = "老師大人喜歡\n什麼樣的拉麵？"
20053-853-530-1 = "哦哦……！"
20053-853-540-1 = "是能啟發新忍術\n的味道……！！"
20053-853-550-1 = "唔喵……！？\n這，這個味道是……！ "
20053-853-560-1 = "嗯，挺不賴的嘛……？"
20053-853-570-1 = "雖然不差……不差……\n但真的就是這樣而已……"
20053-853-580-1 = "咦……這是拉麵嗎……？"
