[translation]
20053-853-10-1 = "潜入任務に\n持って行くなら、\nおにぎりか兵糧丸か――"
20053-853-20-1 = "ん？先生殿！\nいらっしゃい！"
20053-853-30-1 = "先生殿……\n良い格好じゃん。"
20053-853-40-1 = "こういう感じも\n新鮮だね。"
20053-853-50-1 = "だ～～っ！なんで\nファッションショーで\n戦い始めるのさっ！？"
20053-853-60-1 = "ツクヨに会いたい……。"
20053-853-70-1 = "元気かな……ラーメン、\nちゃんと食べれてると\nいいけど……。"
20053-853-80-1 = "忍術研究部、\n完全復活！"
20053-853-90-1 = "先生殿も！\nこっちこっち！"
20053-853-100-1 = "なんかヒマだなぁ……。"
20053-853-110-1 = "ん？こういうこと言うと\n絶対何か起きるって？"
20053-853-120-1 = "うぅ……これ、\nキツくて動きにくい……。"
20053-853-130-1 = "みんなこれの\n何がいいの！？"
20053-853-140-1 = "服装は忍者の\n条件にあらず……"
20053-853-150-1 = "なれば、忍者を忍者たら\nしめるものは何か……！？"
20053-853-160-1 = "とくと見よ……！\nドレスごとき、"
20053-853-170-1 = "忍者にとって\n何の障害でもない、\nということを……！"
20053-853-330-1 = "いらっしゃい、先生殿！\nゆっくり見てってね。"
20053-853-340-1 = "あ！でも、この商品なんだけど、\n私が思うには―― "
20053-853-350-1 = "無い物以外、\nぜーんぶあるよ！ふっふっふ！"
20053-853-360-1 = "ふっふん～早く閉めて、\n新しい忍者定食を\n食べに行こーよ！"
20053-853-370-1 = "選択は慎重に、\n購入は大胆に……！"
20053-853-380-1 = "それが\nグッズを買う時の掟……！"
20053-853-390-1 = "いつかここに、\n少女忍法帖ミチルっちの\nグッズを……！ "
20053-853-400-1 = "おぉ～それかぁ。\n良い選択じゃん？"
20053-853-410-1 = "そう！忍者なら\nそれを選ばなくっちゃね！"
20053-853-420-1 = "こちら、温めま……"
20053-853-430-1 = "あっ、間違えた。"
20053-853-440-1 = "おお……！それはまさに！\nイチオシ商品！"
20053-853-450-1 = "まあ、全部\nイチオシなんだけど！"
20053-853-460-1 = "あ、先生殿も来たんだね！"
20053-853-470-1 = "……私？どれにするか\n悩んでたとこ。"
20053-853-480-1 = "んん～いい匂い――"
20053-853-490-1 = "だけでもないけど！\nまあ、いってみよー！"
20053-853-500-1 = "ごちそうさまでした……\nもう何も入んない……。"
20053-853-510-1 = "麺とスープ……\nそれはまさに忍者と忍術……。"
20053-853-520-1 = "先生殿はどんなラーメンが好き？"
20053-853-530-1 = "おぉ……！"
20053-853-540-1 = "新しい忍術を\nひらめけそうな味だよ……！！"
20053-853-550-1 = "うにゃっ……！？\nこ、この味は……！ "
20053-853-560-1 = "んっ、なかなかやるじゃん……？"
20053-853-570-1 = "悪くないけど……悪くはない……\nほんと、それだけ……。"
20053-853-580-1 = "えっ……これ、\nラーメンなの……？"
