[translation]
20039-900840-170-1 = "山海経へ\nよくぞ参った、先生。"
20039-900840-180-1 = "月影祭を心ゆくまで\n楽しんでいくと良い。"
20039-900840-190-1 = "行き先に悩んだ時には\n妾に申し付けよ。"
20039-900840-200-1 = "すぐに人を手配しよう。"
20039-900840-210-1 = "月影祭では数多の\n物語が交差する。"
20039-900840-220-1 = "ふふ、興味があるのなら\nこれを機に調べて\nみてはどうじゃ？"
20039-900840-230-1 = "玄武商会は月影祭に\n乗じて外部と交流を\n深めようとしておる。"
20039-900840-240-1 = "門主として、\n特段立場は\n表明しておらぬが…"
20039-900840-250-1 = "玄龍門と玄武商会、\nどちらに非が\nあるものか…ふむ。"
20039-900840-260-1 = "すまぬ、先生。\n門主といえども、\nすべてを見通せる\nわけではないのじゃ…。"
20039-900840-270-1 = "妾が門主として居る間は、\n山海経での安全を\n保証しよう。"
20039-900840-280-1 = "相手が誰であろうとな。"
20039-900840-290-1 = "無論、先生も\n例外ではない。"
