[translation]
20039-840-240-1 = "歡迎蒞臨山海經，老師。"
20039-840-250-1 = "還請盡情享受月影祭。"
20039-840-260-1 = "倘若不知該去何處，\n不妨告訴妾身。"
20039-840-270-1 = "妾身會馬上安排人手。"
20039-840-280-1 = "沒想到會變成這樣……"
20039-840-290-1 = "給老師添麻煩了。"
20039-840-300-1 = "汝……會陪在\n妾身身旁吧？"
20039-840-310-1 = "一切都將回歸己身……"
20039-840-320-1 = "那麼，讓吾等\n前去奪回山海經吧。"
20039-840-330-1 = "真是有勞汝了，老師。"
20039-840-340-1 = "作為玄龍門的門主，\n以及作為一名學生……"
20039-840-350-1 = "在此向汝致上\n真誠的敬意與感謝。"
20039-840-360-1 = "月影祭中，\n有許多故事交織。"
20039-840-370-1 = "呵呵，若有興趣的話，\n不妨藉此機會調查調查？"
20039-840-380-1 = "玄武商會打算藉著月影祭\n加深與外部的交流。"
20039-840-390-1 = "作為門主，妾身雖\n未特別表明立場……"
20039-840-400-1 = "玄龍門與玄武商會，\n究竟何者有錯……呼呣。"
20039-840-410-1 = "對不起，老師。\n即便身為門主，\n也無法看透一切……"
20039-840-420-1 = "在妾身擔任門主期間，\n於山海經的安全\n就將獲得保證。"
20039-840-430-1 = "無論對象是誰。"
20039-840-440-1 = "當然，老師也不例外。"
20039-840-640-1 = "汝來了啊。\n現在……"
20039-840-650-1 = "是啊，應該說是\n補給時間吧。呵呵。"
20039-840-660-1 = "妾身為汝\n準備了餘興。"
20039-840-670-1 = "盡情享受便是。"
20039-840-680-1 = "……不過，還請\n留意別吃太多哦？"
20039-840-690-1 = "還有時間。"
20039-840-700-1 = "一同待到最後吧。"
20039-840-710-1 = "怎麼了嗎？\n老師。"
20039-840-720-1 = "……呼呣，\n想先讓妾身嘗嘗看？"
20039-840-730-1 = "那意味著什麼──\n汝明白嗎？呵呵。"
20039-840-740-1 = "妾身不介意哦？"
20039-840-750-1 = "老師要不要也來一個？"
20039-840-760-1 = "味道已經試過了。\n儘管放心吧，呵呵。"
20039-840-770-1 = "談到月影祭的名物，\n那便是點心。"
20039-840-780-1 = "來，一起找找看吧？"
20039-840-790-1 = "學習新知是件好事。"
20039-840-800-1 = "對吧？"
20039-840-810-1 = "老師喜歡甜食嗎？"
20039-840-820-1 = "妾身的話……\n馬馬虎虎吧。"
20039-840-830-1 = "哦，真有趣。"
20039-840-840-1 = "要讓妾身也品嘗看看嗎？"
20039-840-850-1 = "做得好，老師。"
20039-840-860-1 = "不過，汝並不會\n就此滿足。沒錯吧？"
20039-840-870-1 = "每日作業，是吧？\n……為何妾身會在這裡？"
20039-840-880-1 = "因為這亦是門主的職責。"
20039-840-890-1 = "日日新，\n又日新──"
20039-840-900-1 = "意味著每日都應不斷進步。"
20039-840-910-1 = "若是需要協助的話，\n隨時都能幫忙哦？"
20039-840-920-1 = "怎麼了，老師。\n想試著搔癢妾身嗎？"
20039-840-930-1 = "呵呵，真是個無禮的傢伙。"
20039-840-940-1 = "……不過，妾身准了。"
20039-840-950-1 = "想一同嬉鬧嗎？"
20039-840-960-1 = "無妨。隨汝高興吧。\n畢竟是妾身與老師之間的事啊。"
20039-840-970-1 = "……不過有旁人在的時候，\n記得注意分寸哦？"
20039-840-980-1 = "啊啊。畢竟是汝達成之事，\n儘管拿去便是。"
20039-840-990-1 = "汝真誠實啊。"
20039-840-1000-1 = "果然若能實現的話，\n真盼望汝能在妾身身邊……"
20039-840-1010-1 = "不，請忘了吧。"
