[translation]
20039-840-240-1 = "ขอต้อนรับสู่\nซานไห่จิงนะ ครู"
20039-840-250-1 = "สนุกกับเทศกาล\nเงาจันทร์ให้เต็มที่นะ"
20039-840-260-1 = "ถ้าไม่รู้จะไปที่ไหน\nก็มาบอกเราได้"
20039-840-270-1 = "แล้วเราจะเรียกคน\nมาพาเที่ยวให้เอง"
20039-840-280-1 = "ไม่คิดเลยว่า...\nเรื่องจะเป็นเช่นนี้ไปได้"
20039-840-290-1 = "ทำให้ครูเดือดร้อน\nจนได้สินะ"
20039-840-300-1 = "ครูคงจะ\nอยู่ข้างๆ เราใช่มั้ย...?"
20039-840-310-1 = "ทุกอย่างจะหมุนไป\nแล้วกลับมายัง\nที่เดิมในที่สุด..."
20039-840-320-1 = "ไปเอาซานไห่จิงของเรา\nกลับคืนมากันเถอะ"
20039-840-330-1 = "เหนื่อยแย่เลยนะ ครู"
20039-840-340-1 = "ในฐานะประมุขมังกรดำ\nและนักเรียนคนหนึ่ง"
20039-840-350-1 = "เราขอแสดงความเคารพ\nและความนับถืออย่างสุดซึ้ง"
20039-840-360-1 = "ในเทศกาลเงาจันทร์\nมีเรื่องราวมากมายเลยละ"
20039-840-370-1 = "ฮุฮุ หากสนใจ\nก็ใช้โอกาสนี้\nสำรวจดูมั้ยเล่า?"
20039-840-380-1 = "ย่านการค้าเทพเต่าดำใช้\nเทศกาลเงาจันทร์ในการขยาย\nการแลกเปลี่ยนกับภายนอกอยู่น่ะ"
20039-840-390-1 = "ถึงเราจะไม่ได้แสดงจุดยืน\nเป็นพิเศษในฐานะประมุขก็เถอะ..."
20039-840-400-1 = "มังกรดำ\nกับย่านการค้าเทพเต่าดำ\nฝ่ายไหนกันนะ\nที่ผิดมาตั้งแต่แรก..."
20039-840-410-1 = "ขอโทษนะครู\nถึงเราจะเป็นประมุข\nแต่เรื่องที่ยากจะรับรู้\nเราก็มิอาจรู้หรอก..."
20039-840-420-1 = "ในยามที่เราเป็นประมุข\nเราจะรับรองความปลอดภัย\nในซานไห่จิงให้เอง"
20039-840-430-1 = "ไม่ว่าจะกับใครก็ตาม"
20039-840-440-1 = "แน่นอนว่า\nกับครูก็ด้วย"
20039-840-640-1 = "มาถึงแล้วหรือ\nตอนนี้น่ะ..."
20039-840-650-1 = "นั่นสินะ คงต้องบอกว่าตอนนี้\nคือเวลาชดเชยพละกำลัง\nของเราหรือเปล่านะ ฮุฮุ"
20039-840-660-1 = "เราเตรียมความบันเทิง\nเล็กๆ น้อยๆ ไว้ให้"
20039-840-670-1 = "เชิญสนุกให้เต็มที่"
20039-840-680-1 = "แต่ก็ระวัง...\nอย่ากินให้มากเกินไปเล่า"
20039-840-690-1 = "ยังมีเวลาเหลืออีกเยอะเลยละ"
20039-840-700-1 = "อยู่ด้วยกัน\nให้จบงานเลยนะ"
20039-840-710-1 = "เรื่องอะไรอย่างนั้นหรือ ครู?"
20039-840-720-1 = "หืม? อยากให้เรา\nลองชิมก่อนงั้นหรือ?"
20039-840-730-1 = "รู้หรือเปล่าว่า\nนั่นหมายความ\nว่าอย่างไร? ฮุฮุ"
20039-840-740-1 = "แต่เราไม่สนใจหรอกนะ"
20039-840-750-1 = "ครูก็กินดูมั้ยเล่า?"
20039-840-760-1 = "เราลองชิมไปแล้ว\nวางใจได้ ฮุฮุ"
20039-840-770-1 = "ของขึ้นชื่ออย่างหนึ่งของ\nเทศกาลเงาจันทร์ก็คือของว่าง"
20039-840-780-1 = "งั้นไปหาของว่างกิน\nด้วยกันมั้ยเล่า?"
20039-840-790-1 = "การได้เรียนรู้สิ่งใหม่\nถือเป็นเรื่องที่ดี"
20039-840-800-1 = "คิดเหมือนกันมั้ยเล่า?"
20039-840-810-1 = "ชอบอะไรหวานๆ\nงั้นหรือครู?"
20039-840-820-1 = "ส่วนเรา... คงต้องบอกว่า\nเฉยๆ น่ะ"
20039-840-830-1 = "โฮ่ น่าสนใจดีนี่"
20039-840-840-1 = "ให้เราลองชิม\nด้วยคนได้หรือไม่?"
20039-840-850-1 = "สำเร็จจนได้สินะครู "
20039-840-860-1 = "แต่หากเป็นครู\nก็คงไม่พอใจหรอก\nว่ามั้ยเล่า?"
20039-840-870-1 = "กิจวัตรอย่างนั้นหรือ?\nทำไมเราถึงมาอยู่ที่นี่น่ะหรือ...?"
20039-840-880-1 = "นี่ก็เป็นหน้าที่ของประมุข\nเหมือนกันมิใช่หรือไง?"
20039-840-890-1 = "มีสุภาษิตที่ว่า 'ใหม่ทุกทิวา'"
20039-840-900-1 = "แปลว่าเราต้องพัฒนา\nขึ้นใหม่ในทุกวันน่ะ"
20039-840-910-1 = "หากต้องการความช่วยเหลือ\nเราก็จะยื่นมือช่วยในทุกเมื่อ"
20039-840-920-1 = "เป็นอะไรไปหรือครู?\nอยากจั๊กจี้เรางั้นหรือ?"
20039-840-930-1 = "ฮุฮุ ไม่สุภาพเอาเสียเลย"
20039-840-940-1 = "แต่เราจะให้อภัยในเรื่องนั้นแล้วกัน"
20039-840-950-1 = "จะแกล้งเรางั้นหรือ?"
20039-840-960-1 = "ดีละ เราอนุญาตให้ทำเต็มที่เลย\nเราคนกันเองมิใช่หรือไง?"
20039-840-970-1 = "แต่ตอนมีคนอื่นอยู่ด้วย\nก็อย่าทำเล่า"
20039-840-980-1 = "ใช่ ครูทำมันได้สำเร็จ\nไม่ต้องปฏิเสธหรอก รับไปเถอะ"
20039-840-990-1 = "ครูช่างขยันจังเลยนะ"
20039-840-1000-1 = "ถ้าเป็นไปได้ เราอยากให้\nมาอยู่ข้างกายเลย..."
20039-840-1010-1 = "เปล่า ไม่มีอะไร\nลืมไปเสียเถอะ"
