[translation]
20039-840-240-1 = "山海経へ\nよくぞ参った、先生。"
20039-840-250-1 = "月影祭を心ゆくまで\n楽しんでいくと良い。"
20039-840-260-1 = "行き先に悩んだ時には\n妾に申し付けよ。"
20039-840-270-1 = "すぐに人を手配しよう。"
20039-840-280-1 = "こんなことに\nなろうとはな…"
20039-840-290-1 = "先生には迷惑をかける。"
20039-840-300-1 = "其方は…妾のそばに\n居てくれるのじゃろう？"
20039-840-310-1 = "すべては巡り巡って\n己に帰ってくるもの…"
20039-840-320-1 = "さあ、我が山海経を\n取り戻しにゆこうか。"
20039-840-330-1 = "ほんにご苦労じゃった、\n先生。"
20039-840-340-1 = "玄龍門の門主として、\nそして一人の\n生徒として、"
20039-840-350-1 = "其方に心からの敬意と、\n感謝を。"
20039-840-360-1 = "月影祭では数多の\n物語が交差する。"
20039-840-370-1 = "ふふ、興味があるのなら\nこれを機に調べて\nみてはどうじゃ？"
20039-840-380-1 = "玄武商会は月影祭に\n乗じて外部と交流を\n深めようとしておる。"
20039-840-390-1 = "門主として、\n特段立場は\n表明しておらぬが…"
20039-840-400-1 = "玄龍門と玄武商会、\nどちらに非が\nあるものか…ふむ。"
20039-840-410-1 = "すまぬ、先生。\n門主といえども、\nすべてを見通せる\nわけではないのじゃ…。"
20039-840-420-1 = "妾が門主として居る間は、\n山海経での安全を\n保証しよう。"
20039-840-430-1 = "相手が誰であろうとな。"
20039-840-440-1 = "無論、先生も\n例外ではない。"
20039-840-640-1 = "来たのじゃな。\n今は…"
20039-840-650-1 = "そうさな。\n補充の時、\nと言うべきかの。ふふ。"
20039-840-660-1 = "其方のために\nお楽しみを用意した。"
20039-840-670-1 = "存分に\n楽しんでいくが良い。"
20039-840-680-1 = "…じゃが、\n食べ過ぎには\n注意じゃぞ？"
20039-840-690-1 = "まだ時間はある。"
20039-840-700-1 = "最後まで共にいよう。"
20039-840-710-1 = "どうかしたのか？\n先生。"
20039-840-720-1 = "…ふむ、まずは妾に\n食べてみてほしい？"
20039-840-730-1 = "それが何を\n意味するのか――\n分かっているのかえ？\nふふ。"
20039-840-740-1 = "妾は構わぬぞ？"
20039-840-750-1 = "先生も一つどうじゃ？"
20039-840-760-1 = "味見はしてある。\n安心すると良い、\nふふっ。"
20039-840-770-1 = "月影祭の名物といえば\nおやつじゃ。"
20039-840-780-1 = "さあ、一緒に\n探してみようかの？"
20039-840-790-1 = "新しきを知るのは\n良いことじゃ。"
20039-840-800-1 = "そうじゃろう？"
20039-840-810-1 = "先生は甘いものは\n好きかえ？"
20039-840-820-1 = "妾は…そこそこじゃな。"
20039-840-830-1 = "ほう、興味深いのう。"
20039-840-840-1 = "妾にも味見させて\nくれるかえ？"
20039-840-850-1 = "よくやった、先生。"
20039-840-860-1 = "じゃが、其方はこれで\n満足などしない。\nそうじゃろう？"
20039-840-870-1 = "日課、じゃな？\n…なぜ妾がここに 居るのか？"
20039-840-880-1 = "これも門主の\n務めじゃからの。"
20039-840-890-1 = "日々新たにして、\nまた日に新たなり――"
20039-840-900-1 = "日々新しく前に\n進むべきという意味じゃ。"
20039-840-910-1 = "手助けが必要なら\nいつでも力になるぞ？"
20039-840-920-1 = "なんじゃ、先生。\n妾をくすぐってみたいのかえ？"
20039-840-930-1 = "ふふ。なんとも\n無礼なヤツじゃ"
20039-840-940-1 = "…じゃが、許そう。"
20039-840-950-1 = "じゃれ合いたいのか？"
20039-840-960-1 = "よい、好きなだけしてみせよ。\n妾と先生のことじゃからのう。"
20039-840-970-1 = "…他に人がいる時は、\nわきまえるんじゃぞ？"
20039-840-980-1 = "ああ。其方がやり遂げたのだから\n遠慮せず持っていくがよい。"
20039-840-990-1 = "其方は誠実じゃな。"
20039-840-1000-1 = "やはり出来ることなら\n妾のそばに…"
20039-840-1010-1 = "いや、忘れてくれ。"
