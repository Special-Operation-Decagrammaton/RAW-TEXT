[translation]
20039-840-240-1 = "Welcome to Shanhaijing, Sensei."
20039-840-250-1 = "I hope you enjoy the Moonlight Festival to the fullest."
20039-840-260-1 = "Let me know if you don't know where to go."
20039-840-270-1 = "I'll have someone help you right away."
20039-840-280-1 = "I didn't know it would turn out like this..."
20039-840-290-1 = "I'm causing trouble for you, Sensei."
20039-840-300-1 = "You'll...stay by my side, won't you?"
20039-840-310-1 = "Everything will come full circle and return to you..."
20039-840-320-1 = "Now, let us go reclaim our Shanhaijing."
20039-840-330-1 = "Great work, Sensei."
20039-840-340-1 = "As president of the Genryumon, and also as a student..."
20039-840-350-1 = "You have my genuine respect and gratitude."
20039-840-360-1 = "Many stories cross paths during the Moonlight Festival."
20039-840-370-1 = "Fufu. If you're interested, why don't you investigate?"
20039-840-380-1 = "The Black Tortoise Promenade is using the Moonlight Festival as an opportunity to mingle with the outside world."
20039-840-390-1 = "Although I made no particular statement as president..."
20039-840-400-1 = "The Genryumon and Black Tortoise Promenade. Which side does the underlying problem lie on...?"
20039-840-410-1 = "I'm sorry, Sensei. Even though I'm president, there are things I don't know."
20039-840-420-1 = "As long as I'm president, I will guarantee the safety of Shanhaijing."
20039-840-430-1 = "No matter who the opponent is."
20039-840-440-1 = "That goes for you too, Sensei."
20039-840-640-1 = "You're here. Right now..."
20039-840-650-1 = "I see. Well, it's time to refresh yourself now. Fufu."
20039-840-660-1 = "We've prepared some entertainment for you."
20039-840-670-1 = "Please enjoy."
20039-840-680-1 = "...But please be careful not to overeat."
20039-840-690-1 = "There's still time remaining."
20039-840-700-1 = "Let's stay together until the very end."
20039-840-710-1 = "What is it, Sensei?"
20039-840-720-1 = "Huh? You want me to taste it first?"
20039-840-730-1 = "Do you know what that means? Fufu."
20039-840-740-1 = "What if that doesn't bother me?"
20039-840-750-1 = "Do you want a bite, Sensei?"
20039-840-760-1 = "I've already tried it. You don't have to worry. Heehee."
20039-840-770-1 = "The snacks are one of the Moonlight Festival's specialties."
20039-840-780-1 = "Should we look for them together?"
20039-840-790-1 = "Learning something new is a good thing."
20039-840-800-1 = "Don't you agree?"
20039-840-810-1 = "Do you like sweets, Sensei?"
20039-840-820-1 = "To me, they're...just so-so."
20039-840-830-1 = "Oh... That's interesting."
20039-840-840-1 = "Can I try it, too?"
20039-840-850-1 = "You did it, Sensei. "
20039-840-860-1 = "But you won't rest on your laurels. Right?"
20039-840-870-1 = "Work, you say? ...You're wondering why I'm here?"
20039-840-880-1 = "It's because this is the president's duty, too."
20039-840-890-1 = "Each day is a new day."
20039-840-900-1 = "That means you have to better yourself every single day."
20039-840-910-1 = "If you ever need help, I'll always lend you a hand."
20039-840-920-1 = "What is it, Sensei? You want to tickle me?"
20039-840-930-1 = "Fufu. That's a bit rude."
20039-840-940-1 = "But I'll forgive even that."
20039-840-950-1 = "Are you playing a prank?"
20039-840-960-1 = "Okay. I'll allow it. Just between you and me, Sensei."
20039-840-970-1 = "...but please don't when other people are around."
20039-840-980-1 = "Yes. You made this happen. Don't refuse, just take it."
20039-840-990-1 = "You're very loyal, Sensei."
20039-840-1000-1 = "If I can, I'd like to keep you by my side forever..."
20039-840-1010-1 = "No, no. Forget it."
