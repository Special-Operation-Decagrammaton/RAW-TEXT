[translation]
10017-802-10-1 = "これより、\n粛清を始める！"
10017-802-20-1 = "ふふふ、革命の時間だ！"
10017-802-30-1 = "今回のイワン・クパーラも\n楽しみだな！"
10017-802-40-1 = "私の助けが必要か、\nカムラッド？"
10017-802-50-1 = "この髭の権威を\n疑うような生徒が、まだ\n残っていたとはな……。"
10017-802-60-1 = "どいつもこいつも\n粛清だ、粛清！"
10017-802-70-1 = "今回のイワン・クパーラの\nために大きくて、\nえーっとそれから……"
10017-802-80-1 = "……すっごく大きい\nプリンを用意したぞ！"
10017-802-90-1 = "粛清が終わったら、\n皆で分けて\n食べるとしよう。"
