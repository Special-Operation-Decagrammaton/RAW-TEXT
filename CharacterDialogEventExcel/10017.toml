[translation]
10017-802-10-1 = "現在，\n開始肅清！"
10017-802-20-1 = "呵呵呵，\n革命的時間到了！"
10017-802-30-1 = "這次的伊凡．庫帕拉\n也讓人非常期待！"
10017-802-40-1 = "需要我的幫忙嗎，\n同志？"
10017-802-50-1 = "竟然存在\n懷疑這鬍子權威\n的學生……"
10017-802-60-1 = "全部肅清，\n肅清！"
10017-802-70-1 = "為了這次的伊凡．庫帕拉，\n準備了一個很大，\n該怎麼說……"
10017-802-80-1 = "……巨無霸的\n布丁喔！"
10017-802-90-1 = "肅清結束後，\n大家一起分著吃吧。"
10017-10802-10-1 = "從現在起\n開始整頓！"
10017-10802-20-1 = "呼呼，\n革命時間！"
10017-10802-30-1 = "這次伊凡·庫帕拉慶典\n也讓人非常期待！"
10017-10802-40-1 = "嗯？\n需要我的幫忙嗎，同志？"
10017-10802-50-1 = "質疑鬍子權威的\n不良學生們\n竟然還存在…"
10017-10802-60-1 = "全部肅清，肅清！"
10017-10802-70-1 = "為了這次的伊凡·庫帕拉\n準備了非常巨大…\n嗯…還要怎麼形容呢…"
10017-10802-80-1 = "非常非常巨大的\n布丁喔！"
10017-10802-90-1 = "整頓結束時，\n一起分來吃吧。"
10017-900802-10-1 = "從現在起\n開始肅清！"
10017-900802-20-1 = "哼哼哼，\n革命的時間到了！"
10017-900802-30-1 = "這次的伊凡．庫帕拉\n也很令人期待啊！"
10017-900802-40-1 = "需要咱的幫忙嗎，同志？"
10017-900802-50-1 = "質疑這個鬍子的\n權威的學生們\n竟然還存在啊……"
10017-900802-60-1 = "全部都肅清，肅清！"
10017-900802-70-1 = "為了這次的伊凡．庫帕拉\n準備了巨大，\n呃，比那個還……"
10017-900802-80-1 = "……非常巨大的布丁喔！"
10017-900802-90-1 = "肅清結束之後，\n大家一起分著吃吧。"
