[translation]
10017-802-10-1 = "ถ้างั้นจากนี้...\nจะเริ่มทำการกวาดล้าง!"
10017-802-20-1 = "ฮุฮุ...\nถึงเวลาแห่งการปฏิวัติแล้ว!"
10017-802-30-1 = "งานเทศกาลอีวาน คูปาลา\nก็น่าตื่นเต้นเหมือนกัน!"
10017-802-40-1 = "หืม?\nต้องการให้เราช่วยงั้นเหรอสหาย?"
10017-802-50-1 = "ยังมีพวกนักเรียน\nที่สงสัยในอำนาจของหนวด\nอยู่อีกงั้นเหรอ..."
10017-802-60-1 = "กวาดล้างให้หมดทุกคนเลย!"
10017-802-70-1 = "เทศกาลอีวาน คูปาลาครั้งนี้...\nเราได้เตรียมพุดดิ้งยักษ์..."
10017-802-80-1 = "ขนาดใหญ่มากๆ เอาไว้ด้วย!"
10017-802-90-1 = "พอกวาดล้างเสร็จแล้ว\nเรามาแบ่งพุดดิ้งกินกันเถอะ"
