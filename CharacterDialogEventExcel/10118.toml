[translation]
10118-846-160-1 = "Pahyahya! You ready?"
10118-846-170-1 = "Then, DEPAAARTING!"
10118-846-180-1 = "It was super last minute, so thanks for coming!"
10118-846-190-1 = "The situation is what you'd call \"urgent.\" So I'll leave it to you, Sensei!"
10118-846-200-1 = "This is fine, right?"
10118-846-210-1 = "Well, as long as the brakes don't break!"
10118-846-220-1 = "Ahhh! It's all gonna be over soon! I just know it!"
10118-846-230-1 = "Hyaaah! It's finally over!"
10118-846-240-1 = "It worked out, right? Pahyahya!"
10118-846-250-1 = "Huh? What's wrong?"
10118-846-260-1 = "Nothing? Geez. I can poke you too, you know!"
10118-846-270-1 = "*sigh* How did it turn out this way?"
10118-846-280-1 = "Eh, it'll work out, riiight?"
10118-846-290-1 = "Anything fun going on?"
10118-846-300-1 = "Something to help with my nerves!"
10118-846-310-1 = "But I don't have any nerves! Pahyahyahya!"
10118-846-320-1 = "Keep riding with Highlander Railroad, 'kay? I'm looking forward to it, Sensei"
10118-846-610-1 = "Look around as much as you'd like."
10118-846-620-1 = "Just tell me if you can't find something you want!"
10118-846-630-1 = "I mean, not that I'd know where it is! Pahyahya!"
10118-846-640-1 = "Work's finally done, but you can swing by if you want anything else?"
10118-846-650-1 = "Yeah! What about me?"
10118-846-660-1 = "...You want me to pick for you?"
10118-846-670-1 = "No way! You gotta pick it yourself, or else it doesn't mean anything!"
10118-846-680-1 = "Oh, that one! Nice!"
10118-846-690-1 = "Good choice! Pahyahya!"
10118-846-700-1 = "I want that too."
10118-846-710-1 = "You've got good taste, don't you?"
