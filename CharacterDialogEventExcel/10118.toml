[translation]
10118-846-160-1 = "噗哈哈！準備好了嗎？"
10118-846-170-1 = "準備出～發！"
10118-846-180-1 = "謝謝你這麼突然\n還願意過來。"
10118-846-190-1 = "現在情況相當不妙啊～\n拜託你囉，老師！"
10118-846-200-1 = "這個，沒問題吧？"
10118-846-210-1 = "算了，只要控制裝置\n沒問題就行了吧！"
10118-846-220-1 = "哦，差不多要結束了嗎？\n好像有那種感覺。"
10118-846-230-1 = "呀～！\n終於結束了～！！"
10118-846-240-1 = "還挺不錯的吧？\n噗哈哈～"
10118-846-250-1 = "怎麼了怎麼了？\n有什麼事嗎？"
10118-846-260-1 = "「什麼也沒有」？\n啊？那我也來戳一戳吧。"
10118-846-270-1 = "唉～怎麼會變成這樣呢。"
10118-846-280-1 = "算了，\n總會有辦法吧……？"
10118-846-290-1 = "有什麼有趣的事嗎～？"
10118-846-300-1 = "可以舒緩緊張的那種～！"
10118-846-310-1 = "雖然我也沒在\n緊張就是了。\n啊哈哈！"
10118-846-320-1 = "今後也請多多支持\n高地人鐵道！\n拜託你囉，老師♪"
10118-846-610-1 = "逛到滿意為止吧。"
10118-846-620-1 = "要找什麼東西的話\n就說一聲吧？"
10118-846-630-1 = "雖然我也不知道\n放在哪裡就是了。噗哈哈！"
10118-846-640-1 = "工作雖然結束了，\n如果有想要的東西就再過來吧。"
10118-846-650-1 = "咦，什麼什麼？"
10118-846-660-1 = "「希望我幫你挑」？"
10118-846-670-1 = "不行不行！\n自己選才有意義啦。"
10118-846-680-1 = "哦～那個嗎？\n不錯不錯～！"
10118-846-690-1 = "Good choice！噗哈。"
10118-846-700-1 = "我也很想要呢，那個。"
10118-846-710-1 = "品味還不錯嘛？"
