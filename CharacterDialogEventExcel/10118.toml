[translation]
10118-846-160-1 = "パヒャヒャッ！\n準備はいい？"
10118-846-170-1 = "いざしゅっぱーつ！"
10118-846-180-1 = "急な呼び出しだったのに\n来てくれてありがとね。"
10118-846-190-1 = "マジで状況やばくてさ～\nよろしくね、先生！"
10118-846-200-1 = "これ、\n大丈夫なんだよね？"
10118-846-210-1 = "ま、制御装置に\n問題なきゃ大丈夫か。"
10118-846-220-1 = "お、そろそろ終わる感じ？\nそんな気がしてきたかも。"
10118-846-230-1 = "ひゃー！\nやっと終わったー！！"
10118-846-240-1 = "結構よかったんじゃ\nない？パヒャヒャッ"
10118-846-250-1 = "なになに？どしたの？"
10118-846-260-1 = "「何でもない」？はぁ？\nんじゃ、こっちも\nつっついちゃお。"
10118-846-270-1 = "あーあ、\n何でこんなことに。"
10118-846-280-1 = "ま、なんとか\nなるっしょ……？"
10118-846-290-1 = "なんか面白いこと\nなーいー？"
10118-846-300-1 = "緊張ほぐすような\nやつとかさぁ！"
10118-846-310-1 = "ま、\n別に緊張してないけど。\nあははっ！"
10118-846-320-1 = "今後もハイランダー鉄道\nをごひいきに！\nよろしくね、せんせ♪"
10118-846-610-1 = "好きなだけ見てってよ。"
10118-846-620-1 = "なんか探してる\nものあったら言ってね？"
10118-846-630-1 = "ま、どこにあるかは\n知らないけど。\nパヒャヒャッ！"
10118-846-640-1 = "仕事は終わったけど、\n欲しいものあるなら\nまた来てよね。"
10118-846-650-1 = "え、なになに？"
10118-846-660-1 = "「代わりに選んでほしい」？"
10118-846-670-1 = "ダメダメ！\n自分で選ぶことに\n意味があるんだって。"
10118-846-680-1 = "お、それ？\n良いね良いねぇ。"
10118-846-690-1 = "グッドチョイス！\nパヒャッ。"
10118-846-700-1 = "私もほしいんだよね、それ。"
10118-846-710-1 = "なかなかいい\n趣味してんじゃん？"
