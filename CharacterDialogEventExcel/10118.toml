[translation]
10118-846-160-1 = "วะฮะฮ่า! พร้อมหรือยัง?"
10118-846-170-1 = "งั้นก็~ ไปกันเลย!"
10118-846-180-1 = "จู่ๆ ฉันก็เรียกมาแท้ๆ\nขอบคุณที่มานะ"
10118-846-190-1 = "สถานการณ์ค่อนข้างวิกฤตเลยละ~\nงั้นก็รบกวนด้วยนะ คุณครู!"
10118-846-200-1 = "แบบนี้คงไม่เป็นไรเนอะ?"
10118-846-210-1 = "เอาเถอะ แค่ระบบเบรก\nไม่พังก็พอแล้ว!"
10118-846-220-1 = "อ่า~ เหมือนจะได้ข้อสรุปแล้ว!\nรู้สึกจะเป็นแบบนั้นนะ!"
10118-846-230-1 = "เย้~! ในที่สุดก็เสร็จงานสักที!!"
10118-846-240-1 = "ไม่เลวเลยใช่มั้ยล่ะ? อะฮ่า~"
10118-846-250-1 = "ทำไมเหรอ? มีเรื่องอะไรหรือเปล่า?"
10118-846-260-1 = "ไม่ใช่เรื่องใหญ่อะไรงั้นเหรอ?\nให้ตายสิ~ เดี๋ยวฉันจิ้มบ้างนะ?"
10118-846-270-1 = "เฮ้อ~ กลายเป็นแบบนี้ไปได้เนอะ"
10118-846-280-1 = "แต่ก็น่าจะไม่เป็นอะไรหรอกเนอะ...?"
10118-846-290-1 = "ไม่มีอะไรสนุกๆ เลยเหรอ?"
10118-846-300-1 = "อะไรที่มันคลาย\nความตึงเครียดได้น่ะ!"
10118-846-310-1 = "แต่ว่าฉันก็ไม่ได้\nเครียดอะไรหรอกนะ วะฮะฮ่า~"
10118-846-320-1 = "ต่อไปก็มาใช้ทางรถไฟ\nไฮแลนเดอร์อีกนะ!\nรบกวนด้วยละ คุณครู~"
10118-846-610-1 = "เลือกดูได้ตามต้องการเลย"
10118-846-620-1 = "ถ้าอยากได้อะไรเป็นพิเศษ\nก็บอกได้ตลอดเลยนะ"
10118-846-630-1 = "แต่ฉันไม่รู้หรอกนะ\nว่ามันอยู่ที่ไหน วะฮะฮ่า!"
10118-846-640-1 = "ถึงงานจะเสร็จแล้ว แต่ถ้ามีของ\nที่อยากได้ก็มาหาได้ตลอดนะ"
10118-846-650-1 = "อื้อ! ฉันเหรอ?"
10118-846-660-1 = "ให้ฉันเลือกให้แทนเหรอ?"
10118-846-670-1 = "ไม่ได้ๆ!\nต้องเลือกเองสิ จะได้มีความหมาย"
10118-846-680-1 = "โอ้~ เอาอันนั้นเหรอ! ดีเลยนะ~!"
10118-846-690-1 = "กู๊ดช้อยส์! ฮะฮ่า"
10118-846-700-1 = "ฉันก็อยากได้อันนี้เหมือนกัน"
10118-846-710-1 = "ตาถึงเลยนะเนี่ย?"
