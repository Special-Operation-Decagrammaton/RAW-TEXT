[translation]
26010-827-270-1 = "ひぃ……\nホラー小説に出てくる\n漁村みたい……"
26010-827-280-1 = "早く学園に戻りたい……"
26010-827-290-1 = "あ、私たちの学園は、\nもう……"
26010-827-300-1 = "ここの住民は\nすごく怖くて……\n調査のために\n話していると……"
26010-827-310-1 = "に、逃げてしまいたく\nなるのです……"
26010-827-320-1 = "さきほど、\n船長さんから\n温かいコーヒーを\nいただきました。"
26010-827-330-1 = "思ったより……\n怖くない人なのかも……"
26010-827-340-1 = "この村にも、\n少し愛着が\n湧いてきました。"
26010-827-350-1 = "……でもやっぱり、\n私にとっては\n子ウサギ公園が一番\n落ち着く場所です。"
26010-827-360-1 = "も、も、もしかして\nお呼びですか……？"
26010-827-370-1 = "（どうして\nこんなへんぴな村まで\n来てしまったのかな……）"
26010-827-380-1 = "この髪型、\nミヤコちゃんが\n作戦に出る直前に\n編んでくれたんです。"
26010-827-390-1 = "ふふっ……これ、\n可愛いかも……"
26010-827-400-1 = "スズメも、イタチも、\nカモメも……。"
26010-827-410-1 = "野生の動物たちが\n私に寄ってくる理由は\nなんなんでしょう……？"
26010-827-420-1 = "あの……きれいな石とか、\n貝殻を見つけたら、\n私に持ってきてください。"
26010-827-430-1 = "あ、先生。\n私と一緒に小石集め……\nしませんか？"
26010-827-440-1 = "そろそろ\n帰る時間みたいですが……"
26010-827-450-1 = "小石集め……戻ってもまた、\n付き合ってくださいね。"
26010-827-460-1 = "えっ、あの、その……"
26010-827-470-1 = "私が小石ほど存在感が\n薄いのはわかりますが……"
26010-827-480-1 = "そんなに触っても……\n存在感が強くなることは\nないと思いますよ……？"
26010-827-490-1 = "この小石……\n本当にきれいですね……！"
26010-827-500-1 = "すみません……\nこれくらいしかなくて……"
26010-827-510-1 = "白くて……\nきらきらしてる……"
26010-827-520-1 = "ささやかですが、これも……\n受け取ってくれますか……？"
