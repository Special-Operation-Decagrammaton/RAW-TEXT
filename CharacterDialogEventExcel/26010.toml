[translation]
26010-827-270-1 = "噫噫……\n簡直就像恐怖小說裡\n會出現的漁村一樣……"
26010-827-280-1 = "好想趕快回學園去……"
26010-827-290-1 = "啊，可是我們的\n學園已經……"
26010-827-300-1 = "這裡的居民好可怕……\n每次為了調查\n跟他們搭話的時候……"
26010-827-310-1 = "我，我都會忍不住\n想逃跑……"
26010-827-320-1 = "剛才船長\n給了我一杯\n熱咖啡。"
26010-827-330-1 = "說不定……\n他沒有我想得\n那麼可怕……"
26010-827-340-1 = "對這個村子，\n我也稍微\n湧現了一些感情。"
26010-827-350-1 = "……不過\n果然對我來說，\n兔寶寶公園才是\n最能安心的地方。"
26010-827-360-1 = "難，難，難道\n你找我嗎……？"
26010-827-370-1 = "（為什麼會跑到這種\n　偏僻的村莊呢……）"
26010-827-380-1 = "這個髮型，是都子醬在\n作戰出發前幫我綁的。"
26010-827-390-1 = "呵呵……這個髮型，\n好像有點可愛……"
26010-827-400-1 = "從麻雀、黃鼠狼\n到海鷗……"
26010-827-410-1 = "野生的動物們\n跑到我身邊的理由\n究竟是什麼呢……"
26010-827-420-1 = "那個……有找到\n漂亮的石頭或貝殼的話，\n請帶回來給我。"
26010-827-430-1 = "啊，老師。\n要不要和我一起……\n收集小石頭呢？"
26010-827-440-1 = "差不多到\n該回去的時間了……"
26010-827-450-1 = "回去之後……還請再\n陪我一起收集小石頭哦。"
26010-827-460-1 = "咦，啊，那個……"
26010-827-470-1 = "雖然我知道\n我的存在感跟\n小石頭一樣薄弱……"
26010-827-480-1 = "不過就算老師那樣摸……\n我想存在感也不會\n因此增加的哦……？"
26010-827-490-1 = "這顆小石頭……\n真的很漂亮呢……！"
26010-827-500-1 = "對不起……\n我只有這種東西……"
26010-827-510-1 = "白白的……\n還會閃閃發亮……"
26010-827-520-1 = "雖然沒什麼特別的，即便如此……\n你也願意收下嗎……？"
