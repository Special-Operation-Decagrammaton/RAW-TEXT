[translation]
26010-827-270-1 = "Eek... I-It's just like a fishing village from a h-horror story..."
26010-827-280-1 = "I-I just w-wanna go back to th-the school..."
26010-827-290-1 = "Oh, w-wait... I don't have a school t-to go back to..."
26010-827-300-1 = "The residents here are so s-scary...! I-I talked to them for the investigation..."
26010-827-310-1 = "I-I just wanna run away..."
26010-827-320-1 = "The c-captain gave me some warm coffee earlier."
26010-827-330-1 = "Maybe he's not as scary as I thought..."
26010-827-340-1 = "I think I'm starting to develop a f-fondness for this town."
26010-827-350-1 = "But still, Kousagi Park is where I feel most safe."
26010-827-360-1 = "D-Did you call me, by any chance...?"
26010-827-370-1 = "(How did we end up in such a remote village...?)"
26010-827-380-1 = "Miyako braided my hair b-before we came on this mission."
26010-827-390-1 = "Heehee... This could be cute..."
26010-827-400-1 = "Sparrows, weasels, seagulls..."
26010-827-410-1 = "Wh-Why do wild animals keep c-coming to me...?"
26010-827-420-1 = "If...you happen to find any p-pretty rocks or shells, p-please bring them to me."
26010-827-430-1 = "Sensei, will you c-collect pebbles? ...With m-me?"
26010-827-440-1 = "We should s-start heading back, but..."
26010-827-450-1 = "C-Can we collect pebbles t-together again?"
26010-827-460-1 = "Um, so does that mean..."
26010-827-470-1 = "I-I slip completely under everyone's notice...just like the p-pebbles..."
26010-827-480-1 = "Even touching me like that...w-won't help me stand out more..."
26010-827-490-1 = "This pebble is really pretty...!"
26010-827-500-1 = "I'm sorry... This is all I have to give you..."
26010-827-510-1 = "It's white...and shiny..."
26010-827-520-1 = "It's not much but...w-will you accept this...?"
