[translation]
26010-827-270-1 = "งื้อ... ดูเหมือนหมู่บ้าน\nชาวประมงที่อยู่ในนิยาย\nสยองขวัญเลย..."
26010-827-280-1 = "อยากกลับไป\nโรงเรียนเร็วๆ จัง..."
26010-827-290-1 = "ไม่สิ... โรงเรียนของเรา\nไม่เหลืออยู่อีกแล้วนี่คะ..."
26010-827-300-1 = "ชาวเมืองทุกคนที่นี่...\nน่ากลัวมากๆ...\nพอลองพูดคุยด้วย\nเพื่อจะสืบข้อมูล..."
26010-827-310-1 = "กะ...ก็รู้สึกอยากหนีไป\nจากที่นี่เลยค่ะ..."
26010-827-320-1 = "เมื่อกี้ได้กาแฟอุ่นๆ\nแก้วหนึ่งมาจาก\nไต้ก๋งเรือด้วยค่ะ"
26010-827-330-1 = "พอมาคิดๆ ดูแล้ว...\nอาจจะไม่ได้เป็นคน\nน่ากลัวแบบนั้นก็ได้..."
26010-827-340-1 = "ดูเหมือนว่าจะค่อยๆ... \nผูกพันกับหมู่บ้านนี้ขึ้นมา\nทีละนิดๆ แล้วละค่ะ"
26010-827-350-1 = "...แต่ถึงยังไง สำหรับฉัน\nโคะอุซางิ การ์เด้น\nก็ยังคงเป็นสถานที่\nที่รู้สึกอุ่นใจที่สุดค่ะ"
26010-827-360-1 = "มะ... ไม่ทราบว่า\nระ...เรียกฉันเหรอคะ...?"
26010-827-370-1 = "(ทำไมถึงมาที่\nหมู่บ้านที่อยู่ห่างไกล\nแบบนี้ได้กันนะ......)"
26010-827-380-1 = "ผมทรงนี้...\nมิยาโกะจังถักให้\nก่อนที่จะออกมาปฏิบัติการค่ะ"
26010-827-390-1 = "ฮิฮิ... แบบนี้...\nก็อาจจะดูน่ารักก็ได้..."
26010-827-400-1 = "ทั้งนกกระจาบ ทั้งเพียงพอน...\nแล้วก็นกนางนวล..."
26010-827-410-1 = "ทำไมพวกสัตว์ป่า\nถึงชอบเข้าหาฉัน\nอยู่เรื่อยเลยนะคะ...?"
26010-827-420-1 = "คือว่าถ้าเจอก้อนหินหรือเปลือกหอย\nสวยๆ ก็ช่วยเก็บมาให้ฉันด้วยนะคะ"
26010-827-430-1 = "อ๊ะ คุณครูสนใจมาช่วยฉัน...\nเก็บก้อนกรวดมั้ยคะ?"
26010-827-440-1 = "ดูเหมือนใกล้ถึงเวลา\nที่จะต้องกลับแล้ว..."
26010-827-450-1 = "แต่ว่าหลังจากนี้... ไว้มารวบรวม\nก้อนกรวดด้วยกันอีกนะคะ"
26010-827-460-1 = "เอ๊ะ คะ...คือว่า..."
26010-827-470-1 = "ถึงตัวตนของฉันจะจืดจาง\nเหมือนกับพวกก้อนกรวดก็จริง..."
26010-827-480-1 = "ถึงจะลูบๆ แบบนั้นแต่ยังไงตัวตน\nของฉันก็ไม่หายจืดจางหรอกค่ะ..."
26010-827-490-1 = "ก้อนกรวดพวกนี้...\nสวยมากๆ เลยค่ะ...!"
26010-827-500-1 = "ขอโทษด้วยนะคะ...\nที่ฉันมอบให้ได้แค่เท่านี้..."
26010-827-510-1 = "สีขาว... เป็นประกายแวววาว"
26010-827-520-1 = "ถึงมันอาจจะดูไม่น่ารักเท่าไร\nแต่ก็ช่วยรับมันไปได้รึเปล่าคะ...?"
