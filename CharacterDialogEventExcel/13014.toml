[translation]
13014-847-220-1 = "青い海！青い空！\n白い雲！\n最高の響きだよな！"
13014-847-230-1 = "もちろん、\n優勝はいただくよ。\n先生も応援よろしくな！"
13014-847-240-1 = "残りの期間も\n全力を尽くそう！"
13014-847-250-1 = "最後の最後まで\n気は抜けないな！"
13014-847-260-1 = "お祭りは\n終わったけど……\n青春はまだまだ続くよ！"
13014-847-270-1 = "夏限定の青春活動！\n師匠、楽しみだな！"
13014-847-280-1 = "師匠、\nアタシと泳ぎたいのか？"
13014-847-290-1 = "いいよ、\nどっちが速いか勝負だ！"
13014-847-300-1 = "油断大敵だな。\n気を引き締めていこう。"
13014-847-310-1 = "師匠の解説、\n期待してるからね！"
13014-847-570-1 = "海辺の宝探し！\nどんなものが\n隠されてるのかな？"
13014-847-580-1 = "一緒に宝探しするのも\n青春っぽいよな！\nよ～っし、やってみよう！"
13014-847-590-1 = "あ～楽しかった！\nまたやりたいね。"
13014-847-600-1 = "大切な思い出に\nなったよ。師匠、\nありがとな。"
13014-847-610-1 = "色んな宝物があって\n目移りしちゃうなぁ。"
13014-847-620-1 = "うん？アタシの一番\n大切な宝物は何かって？"
13014-847-630-1 = "そ、それは……"
13014-847-640-1 = "言えない！\n絶対に秘密！"
13014-847-650-1 = "夢見てた青春が、\nまた一つ現実に……。"
13014-847-660-1 = "ほ、本当にありがとう、\n師匠……！"
13014-847-670-1 = "お！これ、\nお宝じゃないか！？"
13014-847-680-1 = "師匠！\n手がかりを見つけたよ！"
13014-847-690-1 = "お宝ゲット！\nさぁて、報酬は……！"
13014-847-700-1 = "さすが師匠！\nいい手際だったよ！"
13014-847-710-1 = "次のお宝を\n見つけに行こう！"
