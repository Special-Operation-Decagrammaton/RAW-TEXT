[translation]
13014-847-220-1 = "ทะเลสีฟ้า! ท้องฟ้าสีคราม!\nเมฆสีขาว!\nนี่ละยอดเยี่ยมที่สุด!"
13014-847-230-1 = "ฮุฮุ ชัยชนะต้องเป็นของ\nพวกเรา! ท่านอาจารย์ก็\nจะช่วยเชียร์ใช่มั้ย?"
13014-847-240-1 = "เวลาเหลือไม่มากแล้ว\nฉันจะใส่ให้เต็มที่เลย!"
13014-847-250-1 = "ต้องตื่นตัวอยู่เสมอ\nจนถึงวินาทีสุดท้ายเลยละ!"
13014-847-260-1 = "ถึงเทศกาลจะจบลงแล้ว...\nแต่การเป็นวัยรุ่นของเรา\nจะยังดำเนินต่อไป!"
13014-847-270-1 = "กิจกรรมวัยรุ่นในฤดูร้อน!\nฉันรอไม่ไหวแล้วละ ท่านอาจารย์!"
13014-847-280-1 = "ท่านอาจารย์อยาก\nว่ายน้ำกับฉันงั้นเหรอ?"
13014-847-290-1 = "ดีละ งั้นมาแข่งกันว่า\nใครจะว่ายเร็วกว่ากัน!"
13014-847-300-1 = "ความประมาทคือศัตรูตัวฉกาจ\nฉันต้องตื่นตัวอยู่ตลอดแล้วละ"
13014-847-310-1 = "แล้วฉันจะรอฟังการบรรยาย\nการแข่งขันของท่านอาจารย์นะ"
13014-847-570-1 = "ท่านอาจารย์! เกมล่าสมบัติในชายหาด!\nจะมีอะไรซ่อนอยู่บ้างนะ?"
13014-847-580-1 = "เกมล่าสมบัติก็เป็น\nหนึ่งในกิจกรรมวัยรุ่นนะ!\nไปเล่นด้วยกันเถอะ!"
13014-847-590-1 = "อ่า สนุกจังเลย\nอยากให้มีอีกจัง"
13014-847-600-1 = "เป็นความทรงจำที่ดีเลยละ\nท่านอาจารย์ ขอบคุณนะ"
13014-847-610-1 = "เห็นสมบัติหลายอย่าง\nเต็มไปหมดเลยแฮะ"
13014-847-620-1 = "หืม? สมบัติที่ล้ำค่าที่สุด\nของฉันคืออะไรน่ะเหรอ?"
13014-847-630-1 = "ระ... เรื่องนั้น..."
13014-847-640-1 = "ฉะ... ฉันบอกไม่ได้หรอก!\nความลับ! เป็นความลับสุดยอดเลย!"
13014-847-650-1 = "วัยรุ่นที่ฉันใฝ่ฝัน\nเป็นความจริงขึ้นมาอีกอย่างแล้ว..."
13014-847-660-1 = "ขะ... ขอบคุณจริงๆ นะ\nท่านอาจารย์..."
13014-847-670-1 = "โอ๊ะ! นี่มัน\nสมบัติไม่ใช่เหรอ!?"
13014-847-680-1 = "ท่านอาจารย์!\nฉันเจอเบาะแสแล้ว!"
13014-847-690-1 = "มีสมบัติเพียบเลย!\nเอาละ ไปล่ารางวัลกัน...!"
13014-847-700-1 = "สมแล้วที่เป็นท่านอาจารย์!\nฝีมือดีเลยละ!"
13014-847-710-1 = "ไปล่าสมบัติ\nชิ้นต่อไปกันเถอะ!"
13014-10847-220-1 = "ทะเลสีฟ้า! ท้องฟ้าสีคราม!\nเมฆสีขาว!\nนี่ละยอดเยี่ยมที่สุด!"
