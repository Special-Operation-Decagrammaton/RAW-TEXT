[translation]
13014-847-220-1 = "藍海！藍天！白雲！\n聽起來真悅耳啊！"
13014-847-230-1 = "當然，會收下冠軍哦。\n老師也要幫我加油啊！"
13014-847-240-1 = "剩下的時間\n也要全力以赴！"
13014-847-250-1 = "到最後的最後\n都不能鬆懈！"
13014-847-260-1 = "祭典雖然結束了……\n但青春還會持續下去！"
13014-847-270-1 = "夏日限定的青春活動！\n師父，真令人期待啊！"
13014-847-280-1 = "師父，想跟我\n一起游泳嗎？"
13014-847-290-1 = "好啊，來比比看\n誰游得比較快吧！"
13014-847-300-1 = "大意是大敵。\n打起精神來吧。"
13014-847-310-1 = "師父的解說，\n我很期待哦！"
13014-847-570-1 = "海邊的尋寶！\n會藏著什麼樣的東西呢？"
13014-847-580-1 = "一起尋寶也很青春對吧！\n好～來試試看吧！"
13014-847-590-1 = "啊～真開心！\n還想再玩一次呢。"
13014-847-600-1 = "是段珍貴的回憶哦。\n師父，謝謝你啦。"
13014-847-610-1 = "各種寶物令人\n眼花撩亂啊。"
13014-847-620-1 = "嗯？問我最重要的\n寶物是什麼？"
13014-847-630-1 = "那，那是……"
13014-847-640-1 = "不能說！\n絕對會保密！"
13014-847-650-1 = "夢想中的青春，\n又實現了一個……"
13014-847-660-1 = "真，真的很謝謝你，\n師父……！"
13014-847-670-1 = "喔！這不是寶物嗎！？"
13014-847-680-1 = "師父！\n找到線索了唷！"
13014-847-690-1 = "寶物到手！\n那麼，獎勵是……！"
13014-847-700-1 = "不愧是師父！\n手法真漂亮！"
13014-847-710-1 = "去找下一個寶物吧！"
