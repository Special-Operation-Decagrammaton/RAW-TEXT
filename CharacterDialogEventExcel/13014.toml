[translation]
13014-847-220-1 = "Blue sea! Blue sky! White clouds! The best sounds!"
13014-847-230-1 = "Fufu, victory is ours! You'll cheer for me, right, Sensei?"
13014-847-240-1 = "There's not much time left! Let's give it our all!"
13014-847-250-1 = "We can't let our guard down until the very, very end!"
13014-847-260-1 = "The festival's over...but our youth will live on!"
13014-847-270-1 = "Limited-edition summer youth activities! Mentor, I'm excited!"
13014-847-280-1 = "Mentor, do you want to swim with me?"
13014-847-290-1 = "Okay! Let's see who's faster!"
13014-847-300-1 = "Never let your guard down. Stay sharp."
13014-847-310-1 = "I'll be looking forward to your commentary, Mentor!"
13014-847-570-1 = "Mentor! It's a beach treasure hunt! I wonder what's hiding in there!"
13014-847-580-1 = "Treasure hunts are absolutely a youth activity! Let's hunt together!"
13014-847-590-1 = "Ah, that was fun. Let's do another one, next time."
13014-847-600-1 = "I made another precious memory. Thank you, Mentor."
13014-847-610-1 = "I see a lot of great treasure..."
13014-847-620-1 = "Hm? What's my most precious treasure?"
13014-847-630-1 = "Th-That's..."
13014-847-640-1 = "That's a secret! Secret! An absolute secret!"
13014-847-650-1 = "The youth I once dreamed of came to life again..."
13014-847-660-1 = "Thank you so much. Mentor..."
13014-847-670-1 = "Oh! Isn't this treasure?!"
13014-847-680-1 = "Mentor! I found a clue!"
13014-847-690-1 = "Treasure secured! Now, let's see what it is...!"
13014-847-700-1 = "As expected of Mentor! Your skills are amazing!"
13014-847-710-1 = "Let's go search for the next treasure!"
