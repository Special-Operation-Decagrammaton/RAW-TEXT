[translation]
10022-804-10-1 = "เข้ามาสิคุณครู ก็อย่างที่เห็น\nเตรียมการฝึกภาคฤดูร้อนสมบูรณ์\nแบบแล้ว มีอะไรก็บอกมาได้เลยนะ"
10022-804-20-1 = "อา... คุณครูเองเหรอ\nตรวจสอบแผนการฝึก\nภาคฤดูร้อนแล้วใช่มั้ย?"
10022-804-30-1 = "วันนี้ร้อนสุดๆ เลย\nเตรียมน้ำดื่มให้พร้อมด้วยล่ะ"
10022-804-40-1 = "ฤดูร้อนแล้วนะ\nทั้งร้อนแล้วก็ชื้น\nน่าหงุดหงิดไปหมดเลย..."
10022-804-50-1 = "ช่วยไม่ได้นะ เพราะทั้งหมดนี่\nก็เป็นส่วนหนึ่งของการฝึกสินะ"
10022-804-60-1 = "ที่ชายหาด\nมักจะมีอันตรายซ่อนอยู่เสมอ"
10022-804-70-1 = "อาจเกิดอุบัติเหตุ\nที่คาดไม่ถึงขึ้นเมื่อไรก็ได้"
10022-804-80-1 = "อืม...\nถ้าเกิดอะไรขึ้นละก็\nเรียกฉันก็ได้นะ"
10022-804-90-1 = "การฝึกภาคฤดูร้อน...\nไม่คิดเลยว่าจะได้\nมาฝึกกับคุณครู..."
10022-804-100-1 = "รู้สึกแปลกๆ นิดหน่อยนะ..."
10022-804-110-1 = "ชุดนี้เป็นชุดที่เตรียม\nมาเพื่อการฝึกภาคฤดูร้อน"
10022-804-120-1 = "ไม่ได้ซื้อชุดใหม่หรอก"
10022-804-130-1 = "ฉันคิดว่าเอาชุดเก่าที่มีมาใส่\nมันน่าจะมีประโยชน์\nมากกว่าน่ะ..."
10022-804-330-1 = "ตั้งแต่นี้ไป ค่ายฤดูร้อน\nกำลังจะเริ่มแล้วละ"
10022-804-340-1 = "ถึงจะน่ารำคาญ แต่นี่ก็เป็น\nหนึ่งของการฝึกนี่นา"
10022-804-350-1 = "ทั้งร้อน แล้วก็น่ารำคาญ..."
10022-804-360-1 = "ผลของการฝึก\nดูเหมือนจะเห็นได้ชัดเลยนะ"
10022-10804-10-1 = "เชิญเลย คุณครู ก็อย่างที่เห็น\nการเตรียมค่ายฝึกฤดูร้อนสมบูรณ์\nแบบเลย บอกฉันได้ทุกอย่างนะ"
10022-10804-20-1 = "อา... คุณครูเองเหรอ\nตรวจสอบแผนการฝึก\nภาคฤดูร้อนแล้วใช่มั้ย?"
10022-10804-30-1 = "วันนี้ร้อนสุดๆ เลย\nเตรียมน้ำดื่มให้พร้อมด้วยล่ะ"
10022-10804-40-1 = "ฤดูร้อนแล้วสินะ\nทั้งร้อนแล้วก็ชื้น\nน่าหงุดหงิดไปหมดเลย..."
10022-10804-50-1 = "ช่วยไม่ได้นะ เพราะทั้งหมดนี่\nก็เป็นส่วนหนึ่งของการฝึก"
10022-10804-60-1 = "ที่ชายหาด\nมักจะมีอันตรายซ่อนอยู่เสมอ"
10022-10804-70-1 = "อาจเกิดอุบัติเหตุ\nที่คาดไม่ถึงขึ้นเมื่อไรก็ได้"
10022-10804-80-1 = "คือว่า...\nถ้าเกิดเรื่องอะไรขึ้นละก็\nเรียกฉันได้นะ"
10022-10804-90-1 = "คิดแล้วว่าการฝึก\nภาคฤดูร้อนปีนี้\nจะได้ร่วมฝึกกับคุณครู"
10022-10804-100-1 = "รู้สึกแปลกๆ นิดหน่อยน่ะ..."
10022-10804-110-1 = "ชุดนี้เป็นชุดที่เตรียม\nมาเพื่อการฝึกภาคฤดูร้อน..."
