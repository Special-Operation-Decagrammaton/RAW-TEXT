[translation]
10022-804-10-1 = "Welcome, Sensei. We're ready for summer camp. Let me know if you need anything."
10022-804-20-1 = "Oh, you're here, Sensei. Did you get to check the summer camp schedule?"
10022-804-30-1 = "So hot today... Stay hydrated."
10022-804-40-1 = "It's summer. The heat and humidity are leaving me lethargic..."
10022-804-50-1 = "...but it all comes with the territory of training."
10022-804-60-1 = "Dangers are always lurking at the beach."
10022-804-70-1 = "You never know when and where accidents will occur. Be careful."
10022-804-80-1 = "Um... You can call me if you need me."
10022-804-90-1 = "I never expected to spend summer camp training with you."
10022-804-100-1 = "That's...somewhat new and refreshing."
10022-804-110-1 = "This outfit is suitable for summer training."
10022-804-120-1 = "There's no sense in throwing out things that are still good."
10022-804-130-1 = "I just thought that this would be effective. That's all."
10022-804-330-1 = "The summer training camp will begin now."
10022-804-340-1 = "It's annoying, but it's part of training."
10022-804-350-1 = "It's hot and annoying..."
10022-804-360-1 = "I'm seeing real effects from the boot camp."
