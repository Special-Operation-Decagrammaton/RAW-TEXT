[translation]
10022-804-10-1 = "いらっしゃい、先生。\n見ての通り、夏合宿の\n準備は完璧。何でも言って。"
10022-804-20-1 = "ああ、先生。\n合宿のスケジュールは\nちゃんと確認した？"
10022-804-30-1 = "今日もこんなに暑いし、\n水分補給はこまめにね。"
10022-804-40-1 = "夏……。蒸し暑くて、\nだるくて、何もかも\nめんどうだけど……。"
10022-804-50-1 = "これもトレーニングの\n一環、仕方ない。"
10022-804-60-1 = "海には常に危険が伴う。"
10022-804-70-1 = "いつどこで事故が起こるか\n分からないから、\n気を付けて。"
10022-804-80-1 = "その……\n何かあったら、私のことを\n呼んでくれれば。"
10022-804-90-1 = "夏のトレーニング合宿。\nまさか今年は、\n先生と一緒だなんて……"
10022-804-100-1 = "……ちょっと新鮮。"
10022-804-110-1 = "この水着はあくまで、\nトレーニングのためで…。"
10022-804-120-1 = "新しい物を買わなくても、"
10022-804-130-1 = "そのまま使えば\n効率的かなって……。"
10022-804-330-1 = "これより、夏合宿の\nトレーニングを始める。"
10022-804-340-1 = "面倒だけど、\nこれもトレーニングの一環。"
10022-804-350-1 = "暑い、めんどくさい……。"
10022-804-360-1 = "ちゃんと合宿の\n効果があったみたい。"
