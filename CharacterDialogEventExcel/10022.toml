[translation]
10022-804-10-1 = "歡迎你，老師。\n如你所見，夏季合宿的\n準備很完美。有問題儘管說。"
10022-804-20-1 = "啊啊，老師。\n合宿的行程表\n有仔細確認了嗎？"
10022-804-30-1 = "今天也這麼熱，\n要注意補充水分哦。"
10022-804-40-1 = "夏天……又熱\n又濕又懶，\n做什麼都很麻煩……"
10022-804-50-1 = "不過這也是訓練\n的一環，沒有辦法。"
10022-804-60-1 = "海時常伴隨著危險。"
10022-804-70-1 = "不知何時何地\n會發生意外，\n要小心。"
10022-804-80-1 = "那個……\n有什麼事的話，\n可以叫我哦。"
10022-804-90-1 = "夏季訓練合宿。\n沒想到今年\n可以和老師一起……"
10022-804-100-1 = "……感覺有點新鮮。"
10022-804-110-1 = "這件泳裝只不過是\n為了訓練……"
10022-804-120-1 = "不買新的，"
10022-804-130-1 = "直接穿原本這件\n我覺得比較有效率……"
10022-804-330-1 = "從現在起開始\n夏季合宿的訓練。"
10022-804-340-1 = "雖然麻煩，\n但這也是訓練的一環。"
10022-804-350-1 = "好熱，好麻煩……"
10022-804-360-1 = "合宿好像有效果了。"
10022-10804-10-1 = "快過來。老師。就如同你看見的，\n夏季合宿訓練的準備很完美。\n有什麼要求都可以提出來。"
10022-10804-20-1 = "啊啊，是老師呀。\n夏季合宿的訓練計劃表\n仔細確認過了嗎？"
10022-10804-30-1 = "天氣很熱。\n要注意補充水分。"
10022-10804-40-1 = "是夏天耶……\n很熱，很濕，\n做什麼都很麻煩，但是……"
10022-10804-50-1 = "這也是訓練的一環，\n是無法避免的。"
10022-10804-60-1 = "海邊，\n總是充滿著危險。"
10022-10804-70-1 = "畢竟隨時隨地都可能會有意外發生，\n所以要小心啊！"
10022-10804-80-1 = "那個…\n如果有什麼事情，\n叫我就可以了。"
10022-10804-90-1 = "夏季合宿訓練，\n沒想到…\n今年竟然和老師一起進行。"
10022-10804-100-1 = "…有點…新鮮呢。"
10022-10804-110-1 = "這個泳裝只是\n為了訓練準備的……"
10022-10804-120-1 = "即使不買新的東西，"
10022-10804-130-1 = "我只是這樣覺得…\n穿原來有的泳衣\n比較有效率。"
10022-10804-330-1 = "從現在起開始\n夏季合宿的訓練。"
10022-10804-340-1 = "雖然麻煩，\n但這也是訓練的一環。"
10022-10804-350-1 = "好熱，好麻煩……"
10022-10804-360-1 = "合宿好像有效果了。"
