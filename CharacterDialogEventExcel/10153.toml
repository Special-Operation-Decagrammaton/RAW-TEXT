[translation]
10153-864-10-1 = "ついに本戦ですね！\n先生！"
10153-864-20-1 = "完走目指して\n頑張ります！"
10153-864-30-1 = "みなさん、結果を\n気にせず楽しめたら\nいいのですが……。"
10153-864-40-1 = "みなさんが、\n笑顔であれますように！"
10153-864-50-1 = "この大会が、\nみなさんにとって――"
10153-864-60-1 = "大切な青春の思い出に\nなっていたら\n嬉しいです。"
10153-864-70-1 = "この衣装ですか？\n公式の\nユニフォームです！"
10153-864-80-1 = "あ、先生も\n分かりますか？"
10153-864-90-1 = "これ、とっても\n良い素材が\n使われてるんです！"
10153-864-100-1 = "個性豊かな\n戦車がこんなに……！"
10153-864-110-1 = "先生、一緒に\n観に行きませんか？"
10153-864-120-1 = "先生も戦車、\n好きですか？"
10153-864-130-1 = "えへへっ、\n一緒ですね！\n私も大好きです！"
10153-864-380-1 = "欲しいものがあれば\nおっしゃってくださいね！"
10153-864-390-1 = "何かお探しですか？\nお手伝いしますよ！"
10153-864-400-1 = "お買い忘れはありませんか？\n最後までお付き合いします！"
10153-864-410-1 = "ペロロ様のグッズですか？\n売り場までご案内します！"
10153-864-420-1 = "えっ？私が必要……？\n私でよければ、\n何でも言ってくださいね！"
10153-864-430-1 = "それ、すっごく良いですよね！\n分かります！"
10153-864-440-1 = "買えるときに\n貯めておくのも大事ですから。"
10153-864-450-1 = "お買い物って、楽しいですよね！"
10153-864-460-1 = "他のものも見ていきませんか？"
10153-864-740-1 = "先生、今日も一緒に\n頑張りましょう！"
10153-864-750-1 = "結果を出すのも大事ですが、\n安全第一ですよ！"
10153-864-760-1 = "あうっ。"
10153-864-770-1 = "……ほっぺに\n何かついてましたか？"
10153-864-780-1 = "偉いね、って……あれ？　\n私に言ってますか？\nまだ何もしてませんよ！？"
10153-864-790-1 = "こんなにたくさん……！\n嬉しいです！\nやりましたね、先生！"
10153-864-800-1 = "えへへっ、先生のおかげです！"
