[translation]
10153-10 = "드디어 본선이네요!\n선생님!"
10153-20 = "목표는 완주, 힘낼게요!"
10153-30 = "모두, 결과는\n신경쓰지 않고\n즐기면 좋겠어요……."
10153-40 = "모두가\n미소지을 수 있기를!"
10153-50 = "이 대회가,\n모든 분들에게"
10153-60 = "소중한 청춘의 추억이\n될 수 있다면 기쁠거에요."
10153-70 = "이 옷, 말씀이신가요?\n공식 유니폼이에요!"
10153-80 = "선생님도\n알아보시겠나요?"
10153-90 = "이거, 재질이 되게\n좋은 의상이에요!"
10153-100 = "독특한 전차들이\n이렇게나 많이……!"
10153-110 = "선생님, 같이\n구경하러 가실래요?"
10153-120 = "선생님도 전차,\n좋아하세요?"
10153-130 = "에헤헤- 똑같네요!\n저도 엄청 좋아해요!"
10153-380 = "필요하신게 있으시면\n말씀해주세요!"
10153-390 = "찾으시는게 있으신가요?\n같이 찾아봐요!"
10153-400 = "잊지 않고 다 사셨나요?\n같이 잘 찾아보죠!"
10153-410 = "페로로님 굿즈요?\n매장까지 안내해드릴게요!"
10153-420 = "네? 제가 필요하시다구요?\n저로 좋다면, 뭐든지 말해주세요!"
10153-430 = "그거, 되게 좋죠!\n동감이에요!"
10153-440 = "구할 수 있을 때\n미리미리 챙겨두는게 중요하죠!"
10153-450 = "쇼핑하는거, 즐겁죠!"
10153-460 = "다른 물건도 보러 가실래요?"
10153-740 = "선생님, 오늘도 함께 힘내요!"
10153-750 = "좋은 성과도 중요하지만,\n가장 중요한 건 안전이에요!"
10153-760 = "으응?"
10153-770 = "……뺨에 뭔가 묻었나요?"
10153-780 = "칭찬인가요? 네?\n저 아직 아무것도 안 했는데요?!"
10153-790 = "이렇게나 잔뜩, 기뻐요!\n해냈네요, 선생님!"
10153-800 = "에헤헤-!\n선생님 덕분인걸요!"
