[translation]
10153-10 = "ついに本戦ですね！\n先生！"
10153-20 = "完走目指して\n頑張ります！"
10153-30 = "みなさん、結果を\n気にせず楽しめたら\nいいのですが……。"
10153-40 = "みなさんが、\n笑顔であれますように！"
10153-50 = "この大会が、\nみなさんにとって――"
10153-60 = "大切な青春の思い出に\nなっていたら\n嬉しいです。"
10153-70 = "この衣装ですか？\n公式の\nユニフォームです！"
10153-80 = "あ、先生も\n分かりますか？"
10153-90 = "これ、とっても\n良い素材が\n使われてるんです！"
10153-100 = "個性豊かな\n戦車がこんなに……！"
10153-110 = "先生、一緒に\n観に行きませんか？"
10153-120 = "先生も戦車、\n好きですか？"
10153-130 = "えへへっ、\n一緒ですね！\n私も大好きです！"
10153-380 = "欲しいものがあれば\nおっしゃってくださいね！"
10153-390 = "何かお探しですか？\nお手伝いしますよ！"
10153-400 = "お買い忘れはありませんか？\n最後までお付き合いします！"
10153-410 = "ペロロ様のグッズですか？\n売り場までご案内します！"
10153-420 = "えっ？私が必要……？\n私でよければ、\n何でも言ってくださいね！"
10153-430 = "それ、すっごく良いですよね！\n分かります！"
10153-440 = "買えるときに\n貯めておくのも大事ですから。"
10153-450 = "お買い物って、楽しいですよね！"
10153-460 = "他のものも見ていきませんか？"
10153-740 = "先生、今日も一緒に\n頑張りましょう！"
10153-750 = "結果を出すのも大事ですが、\n安全第一ですよ！"
10153-760 = "あうっ。"
10153-770 = "……ほっぺに\n何かついてましたか？"
10153-780 = "偉いね、って……あれ？　\n私に言ってますか？\nまだ何もしてませんよ！？"
10153-790 = "こんなにたくさん……！\n嬉しいです！\nやりましたね、先生！"
10153-800 = "えへへっ、先生のおかげです！"
