[translation]
10046-815-160-1 = "นายท่าน~ ทางนี้~ ทางนี้ค่ะ~!\nที่ตรงนี้อิซุนะ\nจองไว้เรียบร้อยแล้วค่ะ!"
10046-815-170-1 = "อ๊ะ กำลังรออยู่เลยค่ะ! นายท่าน!\nอิซุนะเตรียมพร้อมแล้วค่ะ!\nสั่งการมาได้เลยค่า!"
10046-815-180-1 = "คราวนี้ไม่ได้มีแค่อิซุนะ\nกับนายท่านเท่านั้น แต่ยังมี\nอีกหลายๆ คนช่วยด้วยค่ะ!"
10046-815-190-1 = "ดูจะสนุกแล้วก็ร่าเริงมากเลยนะคะ\nนายท่าน!"
10046-815-200-1 = "(กลืนน้ำลาย...)\nภารกิจร่วมกับนายท่าน\nจบลงแค่เท่านี้แล้วเหรอคะ...!"
10046-815-210-1 = "อิซุนะก็จะพยายาม\nเพื่อไม่ให้แพ้\nทุกๆ คนค่ะ นินนิน!"
10046-815-220-1 = "ฤดูร้อนคราวนี้มีเรื่องยิ่งใหญ่\nเต็มไปหมดเลยค่ะ! จนตาของ\nอิซุนะหมุนติ้วๆ ไม่หยุดเลยค่ะ"
10046-815-230-1 = "แต่ว่าอิซุนะเอง...\nก็สนุกในทุกๆ วันเลยค่ะ! ฮิฮิฮิ!\nขอบคุณค่ะ! นายท่าน!"
10046-815-240-1 = "ร้านสาขาริมทะเล\nฐานทัพภารกิจครั้งนี้ค่ะ...!"
10046-815-250-1 = "พอเรียกว่าฐานทัพ...\nรู้สึกเหมือนเป็นนินจาเลยค่ะ!"
10046-815-260-1 = "ลั้ลลัลลา~ ที่ร้านริมทะเล\nมีอาหารเยอะแยะเลยค่ะ!"
10046-815-270-1 = "นายท่านชอบทานอะไรคะ?\nบิงซู? หรือว่าทาโกะยากิ?"
10046-815-280-1 = "อิซุนะน่ะ ถ้าได้กินกับนายท่านละก็\nอร่อยทุกอย่างเลยค่ะ~!"
10046-815-290-1 = "ไม่ว่าจะเจอเรื่องอันตราย\nหรือเรื่องลำบากแค่ไหน\nภาพของตัวฉันที่เผชิญหน้าต่อไป..."
10046-815-300-1 = "หรือว่าท่านชิซุโกะ\nจะเป็นนินจากันนะคะ?"
10046-815-310-1 = "ไม่ว่าเรื่องอะไร\nก็ออกคำสั่งมาได้เลยค่ะ!"
10046-815-320-1 = "เดี๋ยวฉันจะคลี่คลายแบบ\n\"ฉึบฉึบ\" เหมือนนินจาเลยค่ะ!"
10046-10815-160-1 = "นายท่าน~ ทางนี้~ ทางนี้ค่ะ~!\nที่ตรงนี้อิซุนะ\nจองไว้เรียบร้อยแล้วค่ะ!"
