[translation]
10046-815-160-1 = "主公～！這裡！\n在這裡～！\n伊樹菜在這裡，\n準備了座位！"
10046-815-170-1 = "啊，恭候多時了！主公！\n伊樹菜準備好了！\n請下令！"
10046-815-180-1 = "這次不僅是\n伊樹菜和主公\n很多的人\n都來幫忙了"
10046-815-190-1 = "總覺得很熱鬧\n很開心呢，\n主公！"
10046-815-200-1 = "（吞口水）……和主公一起\n進行的任務，終於\n漸入佳境了呢……！"
10046-815-210-1 = "伊樹菜也會\n為了不輸給大家\n而努力的！忍忍！"
10046-815-220-1 = "這個夏天，有很多\n厲害的事！\n已經讓伊樹菜的眼睛\n到轉圈圈的程度……"
10046-815-230-1 = "……伊樹菜每一天，\n都非常的開心！欸嘿嘿！\n謝謝您，主公！"
10046-815-240-1 = "海之家是，\n這次的據點……！"
10046-815-250-1 = "聽到據點，\n總覺得很像忍者呢！"
10046-815-260-1 = "哼哼哼～♪\n海之家有很多\n各種料理呢！"
10046-815-270-1 = "主公喜歡\n什麼樣的料理呢？\n刨冰？章魚燒？"
10046-815-280-1 = "伊樹菜呢，只要是和\n主公一起的話\n什麼都很好吃！"
10046-815-290-1 = "無論面臨什麼樣的\n危險和苦難都以\n正面面對的那個身影……"
10046-815-300-1 = "該不會……\n靜子大人，\n是忍者嗎？"
10046-815-310-1 = "請下達任何命令！"
10046-815-320-1 = "我會像忍者一樣\n唰唰唰的\n解決的！"
10046-10815-160-1 = "主公～！這裡！\n在這裡～！\n伊樹菜已經\n為您準備好了座位！"
10046-10815-170-1 = "啊，恭候多時了！主公！\n伊樹菜準備好了！請下令！"
10046-10815-180-1 = "這次不僅有伊樹菜\n和主公，還獲得了\n很多人的幫助。"
10046-10815-190-1 = "總覺得既熱鬧\n又開心呢，主公！"
10046-10815-200-1 = "（吞口水）……\n和主公一起進行的任務，\n總算漸入佳境了呢……！"
10046-10815-210-1 = "伊樹菜也會努力\n不輸給大家的！\n忍忍！"
10046-10815-220-1 = "這個夏天，發生了\n很多厲害的事！\n讓伊樹菜都快感到\n頭暈目眩了……"
10046-10815-230-1 = "……伊樹菜每天，\n都過得很開心！耶嘿嘿！\n非常謝謝您！主公！"
10046-10815-240-1 = "海之家是\n這次的據點……！"
10046-10815-250-1 = "聽到據點，\n總覺得很像忍者呢！"
10046-10815-260-1 = "哼哼哼～♪海之家有\n各式各樣的料理呢！"
10046-10815-270-1 = "主公喜歡什麼呢？\n刨冰？章魚燒？"
10046-10815-280-1 = "伊樹菜，只要是\n和主公在一起，\n什麼都覺得好吃！"
10046-10815-290-1 = "無論面對什麼樣的\n危險和苦難都正面\n面對的姿態……"
10046-10815-300-1 = "難道說……\n靜子閣下是忍者嗎？"
10046-10815-310-1 = "請隨意吩咐！"
10046-10815-320-1 = "像忍者一樣\n唰唰唰地解決吧！"
10046-900815-100-1 = "主公～！這裡！\n在這裡～！\n伊樹菜已經\n為您準備好了座位！"
10046-900815-110-1 = "啊，恭候多時了！主公！\n伊樹菜已經準備就緒！\n請儘管吩咐！"
10046-900815-120-1 = "海之家是\n這次的據點……！"
10046-900815-130-1 = "聽到據點，\n總覺得很像忍者呢！"
10046-900815-140-1 = "哼哼哼～♪海之家有\n各式各樣的料理呢！"
10046-900815-150-1 = "主公喜歡什麼樣的呢？\n刨冰？章魚燒？"
10046-900815-160-1 = "伊樹菜，只要是\n和主公在一起，\n什麼都覺得好吃！"
