[translation]
10046-815-160-1 = "主殿～！こっち！\nこっちですー！\nこちらにイズナが、\nお席をご用意しました！"
10046-815-170-1 = "あっ、お待ちして\nおりました！主殿！\nイズナは準備できて\nおります！どうぞご用命を！"
10046-815-180-1 = "今回はイズナと\n主殿だけでなく\nたくさんの方々が\n協力してくださいました"
10046-815-190-1 = "何だかにぎやかで\n楽しいですね、\n主殿！"
10046-815-200-1 = "ごくり……主殿と一緒に\nこなしてきた任務も、遂に\n佳境へと差し掛かり\nつつありますね……！"
10046-815-210-1 = "イズナもみんなに\n負けないよう頑張ります！\nニンニン！"
10046-815-220-1 = "この夏は、すごいことが\nたくさんでした！\nもうイズナの目は\n回ってしまいそうなほどで……。"
10046-815-230-1 = "……イズナは毎日、とっても\n楽しかったです！えへへっ！\nありがとうございました！\n主殿！"
10046-815-240-1 = "海の家が、\n今回の拠点……！"
10046-815-250-1 = "拠点と聞くと、何だか\n忍者っぽいですね！"
10046-815-260-1 = "ふんふんふん～♪\n海の家は色んな\n料理がいっぱいですね！"
10046-815-270-1 = "主殿はどんなものが\n好きですか？\nかき氷？たこ焼き？"
10046-815-280-1 = "イズナは、主殿と一緒なら\n何でも美味しいです！"
10046-815-290-1 = "どんな危険や苦難に\n直面しても真正面から\n立ち向かうあの姿……"
10046-815-300-1 = "もしかして……\nシズコ殿は、\n忍者なのでは？"
10046-815-310-1 = "何でもご用命ください！"
10046-815-320-1 = "忍者のように\nサササッと解決して\nみせましょう！"
