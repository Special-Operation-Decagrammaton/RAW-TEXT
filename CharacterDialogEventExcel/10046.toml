[translation]
10046-815-160-1 = "My lord, here! Over here! Izuna got a spot!"
10046-815-170-1 = "Oh, Izuna has been waiting, my lord! Izuna is yours to command!"
10046-815-180-1 = "We've got many people on our side this time, my lord!"
10046-815-190-1 = "It's boisterous and fun, my lord!"
10046-815-200-1 = "*gulp* But we've already come so far in our mission...!"
10046-815-210-1 = "Izuna is gonna work hard to prove herself to everyone! Nin nin!"
10046-815-220-1 = "So much happened this summer! It makes Izuna's head spin..."
10046-815-230-1 = "...But every day was so fun! Heeheehee! Thank you, my lord!"
10046-815-240-1 = "The Beach Shack is our base for this mission."
10046-815-250-1 = "The word \"base\" makes Izuna feel like a real ninja!"
10046-815-260-1 = "Hm hm hm. ♪ The Beach Shack has all kinds of food!"
10046-815-270-1 = "What would you like, my lord? Shaved ice? Takoyaki?"
10046-815-280-1 = "Everything is delicious as long as Izuna is with you, my lord!"
10046-815-290-1 = "She always faces danger and challenges head-on..."
10046-815-300-1 = "Is it possible that Shizuko is...a ninja?"
10046-815-310-1 = "Let me know if you need anything!"
10046-815-320-1 = "Izuna will get it done in a flash, like a ninja!"
