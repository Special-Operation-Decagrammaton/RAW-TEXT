[translation]
16012-820-190-1 = "Oh, you're here, Sensei! It's loud outside. Should we go check it out?"
16012-820-200-1 = "There are lots of extra-delicious foods on New Year's Day..."
16012-820-210-1 = "I always end up spending too much money..."
16012-820-220-1 = "I feel like it'll be really annoying..."
16012-820-230-1 = "When it comes to bad luck...my intuition is dead on..."
16012-820-240-1 = "I had a feeling it would turn out this way..."
16012-820-250-1 = "But since you're with me, Sensei, I'm sure it'll work out somehow."
16012-820-260-1 = "Ugh, I'm so tired. I'm glad everything worked out."
16012-820-270-1 = "That osechi was good! I ate so much!"
16012-820-280-1 = "Oh, what's up, Sensei? Oh... Did you wanna talk to me...by any chance?"
16012-820-290-1 = "Seriously, don't poke me like that! You're messing up my kimono."
16012-820-300-1 = "Cleaning it is not the problem!"
16012-820-310-1 = "Hakamas are better... They're way easier to move in."
16012-820-320-1 = "I have to braid up my hair too?!"
16012-820-330-1 = "I can't pull that off! There's no way..."
16012-820-840-1 = "Is all this here for you, Sensei? You've got a lot of work ahead..."
16012-820-850-1 = "Well, let me know if you need help."
16012-820-860-1 = "Now's not the time to relax! Good luck, Sensei."
16012-820-870-1 = "Huh? Did you call? Are you gonna buy me something?"
16012-820-880-1 = "Heehee. Just kidding."
16012-820-890-1 = "It's not that I don't like loud environments. If I didn't, then I wouldn't be able to get along with the Gourmet Research Society."
16012-820-900-1 = "See? You can do it, too."
16012-820-910-1 = "Heehee. I've always wanted to say that."
16012-820-920-1 = "Honestly, I don't think I could've done it myself... Such is the power of an adult..."
16012-820-930-1 = "Not bad."
16012-820-940-1 = "Are we done for today?"
16012-820-950-1 = "Then let's go grab something delicious!"
