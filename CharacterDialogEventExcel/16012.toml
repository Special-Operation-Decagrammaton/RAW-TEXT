[translation]
16012-820-190-1 = "あっ、やっほー先生。\nなんだか騒がしいね。\n見に行ってみる？"
16012-820-200-1 = "お正月って普段とは\n違う美味しいものが\nたくさんあるのよね…"
16012-820-210-1 = "ついついお金を\n使っちゃう。"
16012-820-220-1 = "なんだか厄介な\nことになりそうな…。"
16012-820-230-1 = "私の直感って、嫌なときに\n限って当たるから…。"
16012-820-240-1 = "こうなるような\n気はしてたけど…。"
16012-820-250-1 = "ま、先生と一緒なら、\nなんとかなるんじゃない？"
16012-820-260-1 = "はあ～、疲れた疲れた。\nなんとか終わって\n良かったわね。"
16012-820-270-1 = "おせちもおいしかったし、\nお腹いっぱい\n食べられたし！"
16012-820-280-1 = "ん？どうしたの、先生？\nあ、もしかして……\n私と話したかったんだ？"
16012-820-290-1 = "もう、そんなに\nつつかないで！せっかくの\n着物が崩れちゃうでしょ。"
16012-820-300-1 = "クリーニング…\nってそういう\n問題じゃないの！"
16012-820-310-1 = "私は袴の方が好きかな…\n動きやすいし。"
16012-820-320-1 = "髪を上で\n結わないのって…？"
16012-820-330-1 = "そーゆーの私には\n似合わないし…\nいいかな…。"
16012-820-840-1 = "これ、ぜーんぶ先生がやるの？\nなんだか大変そう…"
16012-820-850-1 = "ま、何かあったら声かけてよね。"
16012-820-860-1 = "余裕ぶってる\n場合じゃないわよ！\nほら、頑張って、先生。"
16012-820-870-1 = "ん、呼んだ？\n何か奢ってくれるの？"
16012-820-880-1 = "ふふっ、冗談。"
16012-820-890-1 = "騒がしいのも嫌いじゃないわ。\nでなかったら、美食研究会の\nみんなと一緒にいないでしょ？"
16012-820-900-1 = "なあに、先生も\nやればできるじゃない。"
16012-820-910-1 = "ふふっ。こういうセリフ、\n言ってみたかったんだ。"
16012-820-920-1 = "私ひとりじゃ\nできなかったと思う…。\nこれが大人の力…"
16012-820-930-1 = "なかなかやるじゃない。"
16012-820-940-1 = "今日の仕事はこれでおしまい？"
16012-820-950-1 = "それならおいしいもの\n食べに行きましょ！"
