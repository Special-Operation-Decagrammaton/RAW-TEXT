[translation]
16012-820-190-1 = "อ๊ะ ยะโฮ คุณครู\nข้างนอกเสียงดังกันน่าดูเลย\nเราออกไปดูด้วยกันมั้ย?"
16012-820-200-1 = "ช่วงวันปีใหม่มี\nของอร่อยๆ เยอะกว่า\nวันธรรมดาเยอะเลยนะ..."
16012-820-210-1 = "ดันใช้เงินไป...\nโดยไม่คิดซะแล้ว"
16012-820-220-1 = "เหมือนมันชักจะน่ารำคาญ\nขึ้นเรื่อยๆ แล้วนะ..."
16012-820-230-1 = "ลางสังหรณ์เรื่องซวยๆ\nของฉันน่ะ...\nแม่นมากเลยนะ..."
16012-820-240-1 = "ก็นะ... คิดอยู่แล้วแหละ\nว่าอาจจะกลายเป็นแบบนี้"
16012-820-250-1 = "แต่ยังไงก็มีคุณครูอยู่ด้วย\nเดี๋ยวก็คงคลี่คลายเองนั่นแหละ"
16012-820-260-1 = "อา... เหนื่อยจัง... เหนื่อยสุดๆ\nสุดท้ายก็จบลงด้วยดี\nค่อยยังชั่วหน่อย"
16012-820-270-1 = "โอเซจิก็อร่อยสุดยอด\nกินไปซะพุงกางเลย!"
16012-820-280-1 = "เอ๋? มีเรื่องอะไรเหรอ คุณครู?\nอ๊ะ หรือว่า...\nอยากคุยกับฉันงั้นเหรอ?"
16012-820-290-1 = "อย่ามาสะกิดกันแบบนั้นสิ!\nไม่ได้ใส่ชุดกิโมโน\nมาตั้งนานแล้วนี่นา"
16012-820-300-1 = "ค่าซักรีด... ไม่สิ\nปัญหามันไม่ใช่เรื่องนั้นสักหน่อย"
16012-820-310-1 = "ฉันเหมาะกับฮากามะ\nมากกว่านะ...\nเคลื่อนไหวสะดวกกว่า"
16012-820-320-1 = "ให้ม้วนผมขึ้นเหรอ...?"
16012-820-330-1 = "ทะ...ทรงผมแบบนั้น\nไม่เหมาะกับฉันหรอกน่า\nพอเลยๆ"
16012-820-840-1 = "นี่เป็นงานของคุณครูหมดเลยเหรอ?\nดูน่าจะเหนื่อยนะ..."
16012-820-850-1 = "ก็นะ... ถ้าอยากให้ช่วยก็บอกล่ะ"
16012-820-860-1 = "ดูท่าจะไม่มีเวลาให้พักเลยแฮะ\nพยายามเข้านะ คุณครู"
16012-820-870-1 = "หืม? เรียกฉันเหรอ?\nจะซื้ออะไรให้เหรอไง?"
16012-820-880-1 = "ฮิฮิ ล้อเล่นน่า"
16012-820-890-1 = "ฉันไม่ได้ไม่ชอบเสียงดังหรอก\nถ้าไม่งั้นคงจะอยู่รวมกับพวกสมาชิก\nชมรมชิมอาหารไม่ได้กันพอดีน่ะสิ?"
16012-820-900-1 = "อะไรน่ะ ถ้าเป็นคุณครูละก็\nทำได้แน่ๆ"
16012-820-910-1 = "ฮุฮุ ฉันอยากลอง\nพูดแบบนี้มานานแล้ว"
16012-820-920-1 = "ถ้าให้ฉันทำคนเดียวคงทำไม่ได้แน่ๆ\nนี่สินะ พลังของผู้ใหญ่..."
16012-820-930-1 = "ไม่เลวเลยนี่นา"
16012-820-940-1 = "งานวันนี้เสร็จแล้วงั้นเหรอ?"
16012-820-950-1 = "ถ้างั้นไปหาอะไรอร่อยๆ\nกินด้วยกันเถอะ!"
