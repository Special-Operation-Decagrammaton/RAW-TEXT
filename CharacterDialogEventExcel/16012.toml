[translation]
16012-820-190-1 = "啊，呀齁～老師。\n感覺很熱鬧呢。\n要一起去看看嗎？"
16012-820-200-1 = "新年的時候\n有很多和平時\n不一樣的美食呢…"
16012-820-210-1 = "不知不覺\n就把錢花掉了。"
16012-820-220-1 = "總覺得事情\n好像會變得很麻煩…"
16012-820-230-1 = "我的直覺，總是只有\n在不好的時候才會中…"
16012-820-240-1 = "雖然有預感\n會變成這樣…"
16012-820-250-1 = "不過，和老師一起\n總會有辦法的吧？"
16012-820-260-1 = "哈啊～累了累了。\n總算是順利結束，\n太好了。"
16012-820-270-1 = "御節料理很好吃，\n又有飽餐一頓！"
16012-820-280-1 = "哦？怎麼了嗎，老師？\n啊，難道…\n你想和我說話？"
16012-820-290-1 = "真是的，別那樣戳我！\n難得的和服會亂掉啦。"
16012-820-300-1 = "清洗…\n不，不是那個問題！"
16012-820-310-1 = "我可能更喜歡褶裙吧……\n畢竟活動起來很方便。"
16012-820-320-1 = "問我要不要\n把頭髮往上紮…？"
16012-820-330-1 = "那種髮型\n又不適合我…\n真的好嗎…"
16012-820-840-1 = "這些，全～都是老師要做的嗎？\n總覺得很辛苦…"
16012-820-850-1 = "嘛，有事的話就說一聲吧。"
16012-820-860-1 = "現在不是假裝\n從容的時候了！\n來吧，加油，老師。"
16012-820-870-1 = "嗯？叫我？\n要買什麼給我嗎？"
16012-820-880-1 = "呵呵，開玩笑的。"
16012-820-890-1 = "我並不討厭熱鬧哦。\n不然也不會和\n美食研究會的大家在一起了吧？"
16012-820-900-1 = "什麼嘛，老師也是\n想做就做得到的嘛。"
16012-820-910-1 = "呵呵。這種台詞，\n我早就想講講看了。"
16012-820-920-1 = "如果只靠我一個人，\n我想應該辦不到…\n這就是大人的力量…"
16012-820-930-1 = "挺厲害的嘛。"
16012-820-940-1 = "今天的工作結束了嗎？"
16012-820-950-1 = "那就去吃點\n好吃的東西吧！"
