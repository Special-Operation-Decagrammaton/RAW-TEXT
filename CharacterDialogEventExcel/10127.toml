[translation]
10127-10850-10-1 = "いらっしゃいませ、先生。\nちょうどプロットを\n書き終えたところです。"
10127-10850-20-1 = "先生にお会いできて、\nすごく安心しました。"
10127-10850-30-1 = "ワイルドハントに\n入学した時は、"
10127-10850-40-1 = "まさかこんな事をする\n羽目になるなんて想像も\nしていませんでした。"
10127-10850-50-1 = "事態が複雑に\nなってきましたね……。"
10127-10850-60-1 = "……諦めるわけには。"
10127-10850-70-1 = "物語は完結させて\nこそ、です。"
10127-10850-80-1 = "無事に終わって\n良かったです。"
10127-10850-90-1 = "……はぁ。こんな依頼、\nもうたくさんです。"
10127-10850-100-1 = "あっ……タイピング音、\nうるさかったですか？"
10127-10850-110-1 = "どうしてこんなことに\n巻き込まれて\nしまったんでしょう……。"
10127-10850-120-1 = "そ、そんなに\nじっと見つめて……"
10127-10850-130-1 = "ふふっ。嬉しいです。"
10127-10850-140-1 = "お仕事のあとは、\nぜひ私たちの寮へ遊びに\n来てくださいね。"
10127-10850-410-1 = "ようこそ、先生。\nこちらですよ。"
10127-10850-420-1 = "お手をどうぞ。\n……一緒にカードを\n引きませんか？"
10127-10850-430-1 = "物語の結末まで……\n悔いのないよう、\n見届けていってください。"
10127-10850-440-1 = "何か問題でも\nありましたか？"
10127-10850-450-1 = "お目当てのカードは\nありますか？"
10127-10850-460-1 = "すごいです！\n私もこの目で見るのは\n初めてのカードですよ！"
10127-10850-470-1 = "運がいいですね、先生！\nこの流れに乗って、\n次も……！"
10127-10850-480-1 = "普通には、\n普通の美学と\nいうものがあります。"
10127-10850-490-1 = "気を落とさないで\nください、先生。不運は、\n次の幸運の前兆ですよ。"
