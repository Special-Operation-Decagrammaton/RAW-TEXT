[translation]
10127-850-10-1 = "เชิญค่ะ คุณครู\nฉันเพิ่งเขียนพล็อตเรื่อง\nเสร็จพอดีเลยค่ะ"
10127-850-20-1 = "พอได้เจอคุณครู\nฉันก็โล่งใจขึ้น\nมากเลยละค่ะ"
10127-850-30-1 = "ตอนเข้าเรียน\nที่ไวลด์ฮันต์"
10127-850-40-1 = "ฉันคิดไม่ถึงเลยค่ะ\nว่าจะได้มาทำงาน\nแบบนี้น่ะ..."
10127-850-50-1 = "สถานการณ์ค่อนข้าง\nพลิกผันเลยนะคะ"
10127-850-60-1 = "แต่ถึงยังไง...\nฉันก็ยอมแพ้ไม่ได้ค่ะ"
10127-850-70-1 = "ฉันต้องเขียนให้จบเรื่องนี่คะ"
10127-850-80-1 = "โล่งอกไปที\nที่จบลงด้วยดีนะคะ"
10127-850-90-1 = "แต่จากนี้ไป...\nฉันจะไม่รับงาน\nแบบนี้แล้วค่ะ เฮ้อ…"
10127-850-100-1 = "คะ? เครื่องพิมพ์ดีดของฉัน\nเสียงดังไปหรือเปล่าคะ...?"
10127-850-110-1 = "ฉันเข้ามาเกี่ยวข้องกับ\nเรื่องแบบนี้ได้ยังไงกันนะคะ..."
10127-850-120-1 = "ถ้ายังจ้องฉัน\nขนาดนี้ละก็..."
10127-850-130-1 = "ดีจังเลยนะคะ ฮุฮุ"
10127-850-140-1 = "ไว้เสร็จงานแล้ว\nแวะมาเที่ยวที่หอพัก\nของพวกฉันสิคะ"
10127-850-410-1 = "ยินดีต้อนรับค่ะ คุณครู\nเชิญทางนี้เลยค่ะ"
10127-850-420-1 = "ยื่นมือมาสิคะ คุณครู\nมาเลือกการ์ดด้วยกันนะคะ"
10127-850-430-1 = "ตอนจบสำคัญนะคะ\nมาดูตอนจบของที่แห่งนี้\nแล้วค่อยไปนะคะ"
10127-850-440-1 = "คะ?\nการ์ดมีปัญหาตรงไหนเหรอคะ?"
10127-850-450-1 = "มีการ์ดที่\nอยากได้มั้ยคะ?"
10127-850-460-1 = "นี่มัน...! เป็นการ์ดที่ฉันก็\nเคยเห็นแต่ในหนังสือ\nเท่านั้นค่ะ...!"
10127-850-470-1 = "ดวงดีจังเลยนะคะ คุณครู!\nงั้นก็ขอพึ่งดวงนี้\nแล้วไปต่อเลย..."
10127-850-480-1 = "ความธรรมดา\nก็มีสุนทรียศาสตร์\nในความธรรมดาของมันนะคะ "
10127-850-490-1 = "อย่าผิดหวังไปเลยค่ะ คุณครู\nบางทีโชคร้ายก็กลายมา\nเป็นโชคดีได้นะคะ"
