[translation]
10127-850-10-1 = "Welcome, Sensei. I just finished writing the plot."
10127-850-20-1 = "Seeing you makes me feel at ease."
10127-850-30-1 = "When I first enrolled in Wildhunt..."
10127-850-40-1 = "...I never imagined I'd be doing something like this."
10127-850-50-1 = "Things have gotten complicated."
10127-850-60-1 = "...But I still can't give up."
10127-850-70-1 = "The story must be finished."
10127-850-80-1 = "Fortunately, everything ended well."
10127-850-90-1 = "...But still, I don't think I'll be accepting a commission like this again. Ugh..."
10127-850-100-1 = "Hm? Is my typewriter too loud...?"
10127-850-110-1 = "I wonder how I got involved in all this..."
10127-850-120-1 = "If you keep staring at me like that..."
10127-850-130-1 = "It's nice, fufu."
10127-850-140-1 = "You should come visit our dormitory when you're done with work."
10127-850-410-1 = "Welcome, Sensei. Please come this way."
10127-850-420-1 = "Give me your hand, Sensei. Let's pull a card together."
10127-850-430-1 = "Endings are important. Let's go watch the finale of this place without any regret."
10127-850-440-1 = "Hm? Is there something wrong with the card?"
10127-850-450-1 = "Is there a card you're looking for?"
10127-850-460-1 = "This is...! I've also only seen this card in books...!"
10127-850-470-1 = "You have good luck, Sensei! Let's keep this pace going...!"
10127-850-480-1 = "Ordinariness is an aesthetic of its own. "
10127-850-490-1 = "Don't get discouraged, Sensei. Misfortune can hint at future fortune."
