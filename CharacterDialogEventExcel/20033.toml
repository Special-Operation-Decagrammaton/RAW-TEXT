[translation]
20033-833-520-1 = "It's a shop that was specially opened in honor of the Gehenna Party."
20033-833-530-1 = "Feel free to take a look around. Kihehe."
20033-833-540-1 = "...I was wondering who that was. Have you decided on your purchase, Sensei?"
20033-833-550-1 = "Kehe. It's a shame, but this is the end for this temporary store."
20033-833-560-1 = "Oh, don't look so down and out."
20033-833-570-1 = "We'll make the next one even larger and more luxurious! Kihehe!"
20033-833-580-1 = "All the goods here are items that the Pandemonium Society has prepared."
20033-833-590-1 = "Ahh, it was possible thanks to our vast financial power."
20033-833-600-1 = "We've just begun! Don't be surprised just yet. Kihehe."
20033-833-610-1 = "Hm? What did I do with the goods?"
20033-833-620-1 = "Kihehe. Are you plotting to take your place at my side?"
20033-833-630-1 = "You don't have any particular aim? Is that so...?"
20033-833-640-1 = "Oho, to think you'd choose that path. I applaud your skilled evaluation."
20033-833-650-1 = "I was going to recommend you take that one."
20033-833-660-1 = "Kihehe. Excellent choice."
20033-833-670-1 = "Kihehe. I am in a good mood today."
20033-833-680-1 = "I'll throw in a little bonus! Here's a cooperation proposal from the Pandemonium Society!"
20033-833-690-1 = "...Huh? You don't need it?"
20033-833-700-1 = "So that's what you wanted, Sensei? Kihehehe. You're a strange one."
