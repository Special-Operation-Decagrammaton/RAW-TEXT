[translation]
20033-833-520-1 = "ゲヘナの宴を記念し、\n特別に開店した店舗だ。"
20033-833-530-1 = "思う存分見ていくがいい、\nキキッ。"
20033-833-540-1 = "……誰かと思ったら、先生か。\n購入する品は、もう決めたのか？"
20033-833-550-1 = "キキッ、残念だが、\n臨時店舗はここまでだ。"
20033-833-560-1 = "そう寂しい顔をするでない。"
20033-833-570-1 = "次は更に規模を拡張し、盛大かつ\n豪華に帰ってくるからな、キキキッ！"
20033-833-580-1 = "ここにある品はすべて、\n我が万魔殿が用意したものだ。"
20033-833-590-1 = "ああ、我々に財力があるからこそ\n可能だったということだ。"
20033-833-600-1 = "驚くのはまだ早いぞ、\nクックックッ。"
20033-833-610-1 = "うむ？品はどうした？"
20033-833-620-1 = "キキキッ、もしかして、\n先生の目当てはこのマコト様の\nほうだったりするのか？"
20033-833-630-1 = "……特に用はない……？\n……そうか。"
20033-833-640-1 = "ほお、それを選ぶとは。\nその審美眼、高く評価してやろう。"
20033-833-650-1 = "それは私のオススメだ。"
20033-833-660-1 = "キッキッキッ、\nいいものを選んだな。"
20033-833-670-1 = "キキキッ、今日の私は\n気分がいい。"
20033-833-680-1 = "おまけをつけてやろう！\n万魔殿の協力提案書だ！"
20033-833-690-1 = "……何？要らない、だと？"
20033-833-700-1 = "それが欲しかったのか、先生。\nキッキッ、変わった人だな。"
