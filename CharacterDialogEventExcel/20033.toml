[translation]
20033-833-520-1 = "게헨나 파티를 기념해,\n특별히 개점한 상점이다."
20033-833-530-1 = "맘껏 둘러보도록. 키킷."
20033-833-540-1 = "……누군가 했더니, 선생인가.\n구입할 물건은, 이미 정했나?"
20033-833-550-1 = "키킷, 아쉽지만,\n임시 상점은 여기까지다."
20033-833-560-1 = "그렇게 아쉬운 표정 짓지 말도록."
20033-833-570-1 = "다음엔 더욱 규모를 확장해서,\n성대하고 호화롭게 돌아올 테니까, 키키킥!"
20033-833-580-1 = "여기 있는 물건은 전부, 우리\n판데모니움 소사이어티가 마련한 것이다."
20033-833-590-1 = "아아, 우리에게 재력이\n있기에 가능했던 일이지."
20033-833-600-1 = "놀라긴 이르다고.\n큭큭큭."
20033-833-610-1 = "음? 물건은 어쨌지?"
20033-833-620-1 = "키키킷, 혹시, 선생의 목적은\n이 마코토 님 쪽인가?"
20033-833-630-1 = "…특별히 용무는 없다…?\n…그런가."
20033-833-640-1 = "호오, 그걸 고르다니.\n그 심미안, 높이 평가해 주마."
20033-833-650-1 = "그건 이 몸도 추천하는 물건이다."
20033-833-660-1 = "킥킥킥. 좋은 물건을 골랐군."
20033-833-670-1 = "키키킥, 오늘의 이 몸은\n기분이 좋군."
20033-833-680-1 = "덤을 주도록 하지!\n판데모니움 소사이어티의 협력 제안서다!"
20033-833-690-1 = "…뭐? 필요 없다고?"
20033-833-700-1 = "그게 갖고 싶었나. 선생.\n킥킥, 별난 사람이로군."
