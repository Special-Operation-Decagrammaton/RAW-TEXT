[translation]
20033-833-520-1 = "นี่คือร้านที่เปิดเป็นพิเศษ\nเป็นที่ระลึกให้ปาร์ตี้เกเฮนน่า"
20033-833-530-1 = "เข้ามาชมให้หนำใจเลยสิ หึหึ"
20033-833-540-1 = "นึกว่าใครที่ไหน ครูเองเหรอ\nคิดได้รึยังว่าจะซื้ออะไร?"
20033-833-550-1 = "คิกคิก น่าเสียดายนะ\nแต่ร้านค้าชั่วคราวเปิดถึงแค่เท่านี้"
20033-833-560-1 = "อย่าทำหน้าเหมือนเสียดายแบบนั้นสิ"
20033-833-570-1 = "ไว้รอบหน้าฉันจะขยายร้าน\nแล้วกลับมาอย่างสง่างามเลย คิกคิกคิก!"
20033-833-580-1 = "ของทุกชิ้นที่นี่ เป็นของที่\nแพนเดโมเนียม โซไซตี้เตรียมมา"
20033-833-590-1 = "อ้อ ที่เป็นอย่างนี้ได้\nเพราะเรามีกำลังทรัพย์ยังไงล่ะ"
20033-833-600-1 = "ยังเร็วไปที่จะตกใจนะ\nหึหึหึ"
20033-833-610-1 = "หืม? ของมันเป็นยังไงเหรอ?"
20033-833-620-1 = "คิกคิกคิก หรือว่าเป้าหมายของครู\nคือท่านมาโคโตะผู้นี้?"
20033-833-630-1 = "ไม่ได้มีธุระอะไรเป็นพิเศษ...?\nงั้นเหรอ?"
20033-833-640-1 = "โอ้ เลือกชิ้นนั้นเหรอ\nรสนิยมดีจังเลยนะ"
20033-833-650-1 = "นั่นเป็นของที่เรา\nก็แนะนำเหมือนกัน"
20033-833-660-1 = "คิกคิกคิก เลือกของดีเลยนะ"
20033-833-670-1 = "คิกคิกคิก วันนี้เรา\nอารมณ์ดีเลยละ"
20033-833-680-1 = "งั้นจะแถมของให้แล้วกัน! นี่คือหนังสือยื่น\nเสนอความร่วมมือกับแพนเดโมเนียม โซไซตี้!"
20033-833-690-1 = "อะไรนะ? ไม่ต้องการเหรอ?"
20033-833-700-1 = "อยากได้อันนี้เหรอครู\nหึหึ เป็นคนแปลกดีแฮะ"
