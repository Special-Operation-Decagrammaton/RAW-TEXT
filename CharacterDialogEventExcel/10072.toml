[translation]
10072-827-150-1 = "RABBIT小隊初の\n遠征作戦か……\n少し心が躍っている。"
10072-827-160-1 = "今こそ、\n私たちSRTの出番だな！"
10072-827-170-1 = "怪しい……。この村、\n絶対何かあるだろ。"
10072-827-180-1 = "不愛想な住民の\n支援なんか、\n気が進まないが……"
10072-827-190-1 = "市民のサポートも、\n特殊部隊の仕事だからな。"
10072-827-200-1 = "誤解が解けてよかった。\nこれでエビ不足は\n解消されたな。"
10072-827-210-1 = "RABBIT2、準備完了！\nいつでもいけるぞ！"
10072-827-220-1 = "一応、普通の観光客っぽい\n格好をしてみたんだが……"
10072-827-230-1 = "怪しまれたり……\nしないよな？"
10072-827-240-1 = "あの……先生、\n私のお腹に、\nなにかついてるのか？"
10072-827-250-1 = "私、実は海産物は\nあまり好きじゃないんだ。\n保存が難しいからな。"
10072-827-260-1 = "ああでも、乾燥イカ\nみたいな干物なら……\n私も好きだぞ！"
