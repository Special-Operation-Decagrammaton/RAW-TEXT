[translation]
10072-827-150-1 = "RABBIT Squad's first away mission... I'm getting excited."
10072-827-160-1 = "This is a chance for SRT to show our stuff!"
10072-827-170-1 = "There's something...suspicious about this town. They're hiding something..."
10072-827-180-1 = "I really don't wanna help those jerks! Ugh."
10072-827-190-1 = "But providing assistance to civilians is part of SRT's duties."
10072-827-200-1 = "I'm glad the misunderstanding has been resolved. Now, there's no need to worry about a lack of shrimp."
10072-827-210-1 = "RABBIT 2, preparations completed! We can enter at any time!"
10072-827-220-1 = "Well, I tried to dress like a normal tourist..."
10072-827-230-1 = "I don't look suspicious... Do I?"
10072-827-240-1 = "Hey... Sensei, is there something on my stomach?"
10072-827-250-1 = "I don't personally like seafood much. It's too difficult to preserve."
10072-827-260-1 = "I do like dried seafood though, like dried squid!"
