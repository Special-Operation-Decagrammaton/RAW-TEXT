[translation]
20032-70000-10190-1 = "ว่าไง คุณครู\nฐานใหม่เป็นยังไงบ้าง?"
20032-70000-10200-1 = "มีงานที่ต้องทำเยอะขึ้น\nมากเลย..."
20032-70000-10210-1 = "ค่อยๆ ทำไปทีละอย่างแล้วกัน"
20032-70000-10220-1 = "เชิญเลยคุณครู\nบอกมาได้ทุกเรื่องเลยนะ"
20032-70000-10230-1 = "หัวหน้าฮิมาริ\nดูเหมือนจะยุ่งอยู่นะ"
20032-70000-10240-1 = "แต่ก็ดูเหมือนจะสนุกอยู่ด้วย\nคงไม่เป็นอะไรใช่มั้ย"
20032-70000-10250-1 = "ถ้าหนาวก็มาทางนี้สิ คุณครู"
20032-70000-10260-1 = "แบบนั้นจะมีประสิทธิภาพ\nต่อกันและกันดีกว่าใช่มั้ยล่ะ?"
20032-70000-10270-1 = "อุณหภูมิและสภาพแวดล้อม\nมีความสัมพันธ์กันอย่างใกล้\nชิด"
20032-70000-10280-1 = "เพราะงั้น ที่นี่เย็นสบายดี\nฉันเลยชอบมากเลยละ"
20032-70000-10290-1 = "เหนื่อยหน่อยนะ ครู\nขอดูสิ่งนั้นหน่อยได้มั้ย?"
20032-70000-10300-1 = "ถ้ามีคุณครูอยู่ด้วยละก็\nอัตราประสบความสำเร็จ\nของภารกิจจะเพิ่มขึ้น"
20032-70000-10310-1 = "สภาพร่างกายฉันก็ดีขึ้นด้วย..."
20032-70000-10750-1 = "ที่นี่คือที่วิเคราะห์สิ่งที่คุณครู...\nรวบรวมมาให้น่ะ อาจจะใช่นะ"
20032-70000-10760-1 = "ยิ่งมีตัวอย่างเยอะก็ยิ่งดีน่ะ\nรบกวนด้วยนะ"
20032-70000-10770-1 = "มาพอดีเลยนะ เดี๋ยวคุณครูก็\nจะได้รู้ถึงความสำคัญของ\nประสิทธิภาพเองแหละ"
20032-70000-10780-1 = "หืม? มีเรื่องอะไรเหรอ?"
20032-70000-10790-1 = "แค่เรียกดูเฉยๆ เหรอ...?\nทำไมล่ะ...?"
20032-70000-10800-1 = "เอาเถอะ... ถ้าคุณครู\nอยากทำแบบนั้น"
20032-70000-10810-1 = "เอาอันนี้ไป แล้วลองไปเล่นอันนั้นดู\nจะมีอะไรออกมาด้วยล่ะ"
20032-70000-10820-1 = "ฉันเองก็ไม่ค่อยรู้หรอก..."
20032-70000-10830-1 = "หัวหน้าอธิบายมาแบบนั้นน่ะ"
20032-70000-10840-1 = "ระหว่างที่วิเคราะห์\nจะไม่ค่อยมีงานทำหรอก..."
20032-70000-10850-1 = "คุณครู...\nขอนั่งตักได้รึเปล่า?"
20032-70000-10860-1 = "อุณหภูมิร่างกาย\nจะกลายเป็นตัวแปรได้"
20032-70000-10870-1 = "ในช่วงที่วิเคราะห์อยู่\nก็เลยโดนบอกไม่ให้เข้าไปใกล้น่ะ..."
20032-70000-10880-1 = "ถึงจะรู้อยู่แล้วก็เถอะ\nแต่ก็รู้สึกเสียใจยังไงไม่รู้"
20032-70000-10890-1 = "ถูกใจที่นี่... จังเลย"
20032-70000-10900-1 = "ย้ายบางส่วนของห้องชมรม\nมาไว้ที่นี่ไม่ได้เหรอ?"
20032-70000-10910-1 = "เอ้า นี่"
20032-70000-10920-1 = "แบบนี้เรียกว่า...\nการแลกเปลี่ยนสินค้าเหรอ?"
20032-70000-10930-1 = "ผลออกมาแล้วละ\nจะเอาอะไรไปดีล่ะ?"
20032-70000-10940-1 = "อื้อ อันนั้นก็ดูใช้ได้นะ"
20032-70000-10950-1 = "ฉันอยากให้ผลที่ออกมา\nหลากหลายกว่านี้จัง"
20032-70000-10960-1 = "แค่ในตอนนี้...\nก็เพียงพอแล้วงั้นเหรอ?\nอย่างนี้นี่เอง "
20032-70000-10970-1 = "ถึงไม่ค่อยแน่ใจเท่าไร"
20032-70000-10980-1 = "แต่ก็หวังว่านี่จะ\nเป็นประโยชน์กับคุณครูนะ"
20032-70000-12100-1 = "ตั้งแต่นี้จะขอเปลี่ยนแปลง\nวิธีวิเคราะห์ตัวอย่างสักหน่อย"
20032-70000-12110-1 = "ถึงจะบอกว่าเป็นสถานที่\nสำหรับทดสอบโชคก็ตาม..."
20032-70000-12120-1 = "สิ่งที่ไม่แน่นอนมีแค่อนาคต\nเพียงอย่างเดียวก็น่าจะพอแล้วนะ...?"
20032-70000-12130-1 = "เดิมพันด้วยดวงของคุณครูดีมั้ย?"
20032-70000-12140-1 = "งั้นฝากในส่วนของฉันด้วยนะ"
20032-70000-12150-1 = "ดูเหมือนหัวหน้าจะ\nปรับเปลี่ยนอะไรบางอย่างน่ะ"
20032-70000-12160-1 = "ส่วนตัวแล้วฉันแอบเสียดายนิดหน่อย"
20032-70000-12170-1 = "ฉันเป็นพวกชอบผลลัพธ์\nที่มันแน่นอนน่ะ"
20032-70000-12180-1 = "โทคิบอกว่า\nชอบวิธีนี้น่ะ"
20032-70000-12190-1 = "ถึงเธอจะไม่แสดงออก\nทางสีหน้าก็เถอะ"
20032-70000-12200-1 = "จริงๆ แล้วโทคิเป็นพวก\nสนุกกับทุกๆ เรื่องเลยนะ"
20032-70000-12210-1 = "ถึงฉันจะไม่ค่อยเข้าใจ\nพวกวิธีการก็เถอะ"
20032-70000-12220-1 = "แต่ก็รู้ว่ามีอะไร\nที่มันเปลี่ยนไปนิดหน่อย"
20032-70000-12230-1 = "ถ้าสุ่มได้โชคร้าย\nฉันอาจทิ้งคุณครู\nไว้ที่นี่ก็ได้นะ~?"
20032-70000-12240-1 = "ล้อเล่นน่า... ไม่ว่าจะ\nโชคดีหรือโชคร้าย\nฉันก็จะอยู่ข้างๆ คุณครูเอง"
20032-70000-12250-1 = "แต่ถ้าไม่ถูกใจผลลัพธ์\nบอกฉันก็แล้วกัน"
20032-70000-12260-1 = "ฉันจะปลอบใจให้เอง"
20032-70000-12270-1 = "ได้รางวัลละ\nยินดีด้วยนะคุณครู"
20032-70000-12280-1 = "เรื่องสุดยอดแบบนี้\nมีจริงๆ ด้วยสินะ..."
20032-70000-12290-1 = "ตกใจหมดเลย...\nคุณครูนี่โชคดีจังเลยนะ"
20032-70000-12300-1 = "เป็นผลลัพธ์ที่ได้มาจาก\nความพยายามของพวกเรา\nกับคุณครูไงล่ะ"
20032-70000-12310-1 = "ยินดีด้วยนะคุณครู\nชนแก้วกันหน่อยมั้ย?"
