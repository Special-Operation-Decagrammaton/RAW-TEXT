[translation]
20032-70000-10190-1 = "Hi, Sensei. How is the new base?"
20032-70000-10200-1 = "There are lots of things to do..."
20032-70000-10210-1 = "Let's take it step by step."
20032-70000-10220-1 = "Welcome, Sensei. You can tell me anything you'd like."
20032-70000-10230-1 = "President Himari seems busy."
20032-70000-10240-1 = "...But she also appears to be having fun, so I see no problem."
20032-70000-10250-1 = "Come here if you're cold, Sensei."
20032-70000-10260-1 = "That would be more efficient, wouldn't it?"
20032-70000-10270-1 = "Temperature and performance are closely related."
20032-70000-10280-1 = "And it feels nice here, so I like it."
20032-70000-10290-1 = "Good work, Sensei. What do you have there?"
20032-70000-10300-1 = "When you're around, the odds of success for any operation goes up."
20032-70000-10310-1 = "...And I perform better as well."
20032-70000-10750-1 = "This is where we analyze the things that you gathered... Probably."
20032-70000-10760-1 = "The more samples the better. I'll leave you to it."
20032-70000-10770-1 = "Perfect timing. Did you also realize the importance of efficiency?"
20032-70000-10780-1 = "Hm? What's the matter?"
20032-70000-10790-1 = "...You just called? Why...?"
20032-70000-10800-1 = "Well, if that's what you wanted to do..."
20032-70000-10810-1 = "If you take this, then do this to make something come out of it."
20032-70000-10820-1 = "I don't really get it..."
20032-70000-10830-1 = "but that's what the president said."
20032-70000-10840-1 = "There's not much to do during an analysis."
20032-70000-10850-1 = "...Sensei, can I sit on your lap?"
20032-70000-10860-1 = "My temperature is a disruptive variable,"
20032-70000-10870-1 = "so I was told to not get close during the analysis..."
20032-70000-10880-1 = "I get it, but it still hurts to hear."
20032-70000-10890-1 = "This place... I like it."
20032-70000-10900-1 = "Can't we take part of the club room and move it to here?"
20032-70000-10910-1 = "Okay, here you go."
20032-70000-10920-1 = "...Do they call this \"bartering\"?"
20032-70000-10930-1 = "We have the results. Which one would you like?"
20032-70000-10940-1 = "Yup, that looks good."
20032-70000-10950-1 = "It would've been better if the results varied more."
20032-70000-10960-1 = "...This is enough? I see."
20032-70000-10970-1 = "I don't really get it..."
20032-70000-10980-1 = "...but I hope this helps you, Sensei."
20032-70000-12100-1 = "From here on out, let's change our sample analysis methods a bit."
20032-70000-12110-1 = "Apparently this is a place to test your luck..."
20032-70000-12120-1 = "Isn't the future already uncertain enough?"
20032-70000-12130-1 = "Should I bet on your luck, Sensei?"
20032-70000-12140-1 = "Then please do what you can for mine as well."
20032-70000-12150-1 = "It seems like the president has changed some things..."
20032-70000-12160-1 = "I personally think it could be better."
20032-70000-12170-1 = "I prefer the results to be guaranteed."
20032-70000-12180-1 = "Toki says she likes this method."
20032-70000-12190-1 = "She doesn't show it in her face..."
20032-70000-12200-1 = "...but she does have a certain zest for things."
20032-70000-12210-1 = "I don't know much about the methodology,"
20032-70000-12220-1 = "but I understand that something has changed."
20032-70000-12230-1 = "Sensei, if you pull a miss, I might leave you here."
20032-70000-12240-1 = "...That was a joke. Regardless of whether you get lucky or not, I'll stay by your side, Sensei."
20032-70000-12250-1 = "If you're not satisfied with the results, let me know."
20032-70000-12260-1 = "I'll be here to console you."
20032-70000-12270-1 = "You won! Congrats, Sensei."
20032-70000-12280-1 = "So there really was a \"jackpot\"..."
20032-70000-12290-1 = "I'm surprised... You're really lucky, Sensei."
20032-70000-12300-1 = "It's a result of our combined efforts."
20032-70000-12310-1 = "Congratulations, Sensei. Cheers!"
