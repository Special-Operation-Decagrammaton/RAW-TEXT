[translation]
20032-70000-10190-1 = "老師，你好。\n覺得新基地如何？"
20032-70000-10200-1 = "要做的事真多……"
20032-70000-10210-1 = "一件一件去解決吧。"
20032-70000-10220-1 = "歡迎回來，老師。\n儘管開口吧。"
20032-70000-10230-1 = "陽葵部長，好像很忙。"
20032-70000-10240-1 = "……不過看起來\n很開心，應該沒事吧。"
20032-70000-10250-1 = "覺得冷就\n過來這邊吧，老師。"
20032-70000-10260-1 = "那樣的話，對彼此\n都更有效率才對？"
20032-70000-10270-1 = "氣溫與狀態有著\n密不可分的關係。"
20032-70000-10280-1 = "所以，這裡\n很涼我喜歡。"
20032-70000-10290-1 = "辛苦了，老師。\n那個，能讓我看看嗎？"
20032-70000-10300-1 = "只要有老師在，\n作戰的成功率就會上升。"
20032-70000-10310-1 = "……我的狀態\n也會比較好。"
20032-70000-10750-1 = "這裡就是將老師收集回來的東西……\n加以分析的地點。應該吧。"
20032-70000-10760-1 = "樣本永遠不嫌多。\n麻煩你囉。"
20032-70000-10770-1 = "來得正是時候呢。\n效率是很重要的，老師也明白了嗎？"
20032-70000-10780-1 = "嗯？怎麼了嗎？"
20032-70000-10790-1 = "……只是叫叫看而已？\n為什麼……？"
20032-70000-10800-1 = "……算了，老師\n想要的話，也行吧。"
20032-70000-10810-1 = "聽說只要拿這個做那個，\n就會有東西跑出來。"
20032-70000-10820-1 = "……雖然我也不是很懂，"
20032-70000-10830-1 = "但根據部長的說明\n大概就是這樣哦。"
20032-70000-10840-1 = "分析的時候\n好像沒什麼事能做。"
20032-70000-10850-1 = "……老師的大腿，\n我可以坐嗎？"
20032-70000-10860-1 = "「因為體溫也會\n　成為變數……"
20032-70000-10870-1 = "所以分析時不要靠近」，\n被這麼說了……"
20032-70000-10880-1 = "雖然我也能理解，\n但好像還是有點寂寞。"
20032-70000-10890-1 = "這個地方……\n我好像挺喜歡的。"
20032-70000-10900-1 = "不能把部室的一部分\n搬來這裡嗎？"
20032-70000-10910-1 = "來，給你。"
20032-70000-10920-1 = "……這種行為，\n是叫做「以物易物」嗎？"
20032-70000-10930-1 = "結果出來囉。\n你想拿哪一份？"
20032-70000-10940-1 = "嗯。那個挺不錯的呢。"
20032-70000-10950-1 = "要是結果也能\n有多樣性就好了。"
20032-70000-10960-1 = "……現狀就夠了？\n這樣啊。"
20032-70000-10970-1 = "雖然我也搞不太清楚，"
20032-70000-10980-1 = "要是這個能幫上\n老師的忙就好了。"
20032-70000-12100-1 = "從現在起，\n要稍微調整一下\n樣本的調查方式。"
20032-70000-12110-1 = "好像說……\n是能試手氣的地方。"
20032-70000-12120-1 = "不確定的東西，\n只有未來就夠了吧。"
20032-70000-12130-1 = "要賭在老師的運氣上嗎？"
20032-70000-12140-1 = "那麼，我的份也拜託了。"
20032-70000-12150-1 = "陽葵部長似乎\n有點變了……"
20032-70000-12160-1 = "對我來說好像有點遺憾。"
20032-70000-12170-1 = "畢竟我比較喜歡\n結果明確一點。"
20032-70000-12180-1 = "這個方式，季好像\n還挺滿意的。"
20032-70000-12190-1 = "……雖然沒有\n表現在臉上，"
20032-70000-12200-1 = "不過季是幾乎能享受\n所有情況的類型對吧。"
20032-70000-12210-1 = "方法論……\n我雖然不是很清楚，"
20032-70000-12220-1 = "不過有東西改變了\n這點，我還是知道的。"
20032-70000-12230-1 = "如果抽到摃龜的話，我\n說不定會丟下老師不管哦？"
20032-70000-12240-1 = "……剛才是開玩笑的。\n無論運氣是好是壞，\n我都會陪在老師身邊的。"
20032-70000-12250-1 = "對結果不滿意的話，\n就跟我說吧。"
20032-70000-12260-1 = "我可以安慰你。"
20032-70000-12270-1 = "中獎了呢。\n恭喜你，老師。"
20032-70000-12280-1 = "原來大獎什麼的，\n真的存在啊……"
20032-70000-12290-1 = "嚇我一跳……老師\n真的很幸運呢。"
20032-70000-12300-1 = "這是老師和我們的努力\n獲得的結果，對吧。"
20032-70000-12310-1 = "恭喜你，老師。\n要來乾杯嗎？"
