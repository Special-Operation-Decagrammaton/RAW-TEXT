[translation]
20032-70000-10190-1 = "先生、こんにちは。\n新しい基地はどう？"
20032-70000-10200-1 = "やることがたくさん……"
20032-70000-10210-1 = "一つずつ、\n片づけていこっか。"
20032-70000-10220-1 = "おかえり、先生。\nなんでも言ってね。"
20032-70000-10230-1 = "ヒマリ部長、忙しそう。"
20032-70000-10240-1 = "…でも楽しそうだから、\n大丈夫か。"
20032-70000-10250-1 = "寒かったら\nこっちにおいで、先生。"
20032-70000-10260-1 = "そのほうが、\nお互い効率が\n良いと思うし？"
20032-70000-10270-1 = "気温とコンディションは\n密接な関係にあるんだ。"
20032-70000-10280-1 = "だから、ここは\n快適で気に入ってる。"
20032-70000-10290-1 = "お疲れ様、先生。\nそれ、ちょっと見せて？"
20032-70000-10300-1 = "先生がいてくれると、\n作戦の成功率が\n上昇するの。"
20032-70000-10310-1 = "……私も、調子良いし。"
20032-70000-10750-1 = "ここは先生が集めてくれたものを…\n分析する場所。多分。"
20032-70000-10760-1 = "サンプルが多いに越したことは\nないから。よろしくね。"
20032-70000-10770-1 = "いいところに来てくれたね。\n効率が大事って、\n先生も分かってくれた？"
20032-70000-10780-1 = "うん？どうしたの？"
20032-70000-10790-1 = "……呼んでみただけ？\nなんで……？"
20032-70000-10800-1 = "……まぁ、\n先生がそうしたいなら、いっか。"
20032-70000-10810-1 = "コレを持って、アレすると、\nナンカでるんだって。"
20032-70000-10820-1 = "……私も\nよく分かってないんだけど、"
20032-70000-10830-1 = "部長の説明によると\nそんなところらしいよ。"
20032-70000-10840-1 = "分析中はやることが\nあんまりないんだ。"
20032-70000-10850-1 = "……先生の膝の上、\n座っていい？"
20032-70000-10860-1 = "体温が変数に\nなっちゃうから、"
20032-70000-10870-1 = "分析中は近寄らないように、って\n言われたの……"
20032-70000-10880-1 = "分かってはいるんだけど、\nちょっと寂しいかも。"
20032-70000-10890-1 = "この場所……\n好きかも。"
20032-70000-10900-1 = "部室の一部、\nここに持ってきたらダメかな？"
20032-70000-10910-1 = "はい、どうぞ。"
20032-70000-10920-1 = "……こういうの、\n「物々交換」って言うんだっけ？"
20032-70000-10930-1 = "結果が出たよ。どれにする？"
20032-70000-10940-1 = "うん。それ、いいね。"
20032-70000-10950-1 = "結果にもバリエーションが\nあったらいいんだけど。"
20032-70000-10960-1 = "……現状で十分？そっか。"
20032-70000-10970-1 = "あんまりよく\n分からないけど、"
20032-70000-10980-1 = "これが先生の\n役に立つといいな。"
20032-70000-12100-1 = "ここからは、\nサンプルの調べ方を\nちょっと変えてみるね。"
20032-70000-12110-1 = "運を試せる場所……\nなんだって。"
20032-70000-12120-1 = "不確かなのは、\n未来だけでいいのにね"
20032-70000-12130-1 = "先生の運に\nかけてみよっか。"
20032-70000-12140-1 = "じゃあ、\n私の分もよろしくね。"
20032-70000-12150-1 = "ヒマリ部長が\nなにかを変えたみたい…"
20032-70000-12160-1 = "私としては\nちょっと\n物足りないかも。"
20032-70000-12170-1 = "結果がハッキリしてる\n方が好きだし。"
20032-70000-12180-1 = "この方式、トキは\n気に入ってるんだって。"
20032-70000-12190-1 = "……顔に出ないだけで、"
20032-70000-12200-1 = "トキって大抵の\nことはなんでも\n楽しむタイプだよね。"
20032-70000-12210-1 = "方法論……にはあまり\n詳しくないけど、"
20032-70000-12220-1 = "何かが変わったって\nことは、わかるよ。"
20032-70000-12230-1 = "ハズレを引いたら、\n先生を\nおいていっちゃうかも？"
20032-70000-12240-1 = "……今のは冗談。\n運がよくても悪くても、\n私は先生の隣にいるよ。"
20032-70000-12250-1 = "結果が気に\n入らなかったら、\n私に言って。"
20032-70000-12260-1 = "慰めてあげる。"
20032-70000-12270-1 = "当たりだね。\nおめでとう、先生。"
20032-70000-12280-1 = "大当たりって、\n本当にあったんだ……。"
20032-70000-12290-1 = "驚いた……先生は本当に\n運がいいんだね。"
20032-70000-12300-1 = "先生と私たちの努力で\n得られた結果、だね。"
20032-70000-12310-1 = "おめでとう、先生。\n乾杯でもする？"
