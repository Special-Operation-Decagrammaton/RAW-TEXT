[translation]
20040-833-1120-1 = "어서 와, 선생.\n보고 싶은 만큼\n마음껏 둘러보라구~"
20040-833-1130-1 = "우리 만마전이\n야심 차게 준비한\n행사니까,"
20040-833-1140-1 = "분명히 선생\n마음에도 쏙 들 거야."
20040-833-1150-1 = "어머,\n잘 풀리지 않나 보네."
20040-833-1160-1 = "뭐, 마코토 쨩이\n어떻게든 하지 않을까?"
20040-833-1170-1 = "여기서 선생의\n도움을 받게 될 줄이야."
20040-833-1180-1 = "후훗, 부탁할게, 선생?"
20040-833-1190-1 = "파티는 이걸로 끝."
20040-833-1200-1 = "어때? 내 말대로\n어떻게든 됐지?"
20040-833-1210-1 = "흐응, 자꾸\n건드리고 말이야…"
20040-833-1220-1 = "뭐 원하는 게 있어?"
20040-833-1230-1 = "선생은, 무엇을 원하실까?"
20040-833-1240-1 = "후훗, 선생…\n내게 최면을 걸어봐."
20040-833-1250-1 = "물론 내게는 듣지 않는…"
20040-833-1260-1 = "응? 괜찮다고?"
20040-833-1270-1 = "후훗, 그런 말 말고…\n자아."
20040-833-1280-1 = "선생, 그렇게 멍하니\n서 있다가는 마코토 쨩의\n음모에 휘말리고 말 걸?"
20040-833-1290-1 = "자, 이쪽으로 와."
