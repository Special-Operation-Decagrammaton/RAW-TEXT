[translation]
20040-833-1120-1 = "เชิญเลย คุณครู\nเลือกดูได้ตามสบาย\nเลยนะ~"
20040-833-1130-1 = "นี่เป็นงานอีเวนต์ที่\nแพนเดโมเนียม โซไซตี้ของเรา\nตั้งใจเตรียมอย่างเต็มที่"
20040-833-1140-1 = "ครูจะต้องถูกใจแน่นอนเลยละ"
20040-833-1150-1 = "โอ๊ะ\nดูเหมือนจะไม่ค่อยได้ผลสินะ"
20040-833-1160-1 = "เอาเถอะ เดี๋ยวมาโคโตะจัง\nก็คงหาทางทำอะไรสักอย่างละมั้ง?"
20040-833-1170-1 = "ฉันคิดว่าจะได้รับ\nความช่วยเหลือจากครูที่นี่ซะอีก"
20040-833-1180-1 = "ฮุฮุ ขอฝากด้วยนะ ครู"
20040-833-1190-1 = "ปาร์ตี้... จบแล้วละ"
20040-833-1200-1 = "เป็นยังไง? มันเป็นไป\nตามที่ฉันบอกเลยใช่มั้ยล่ะ?"
20040-833-1210-1 = "หืม บอกว่าอย่ามา\nสะกิดกันบ่อยไงล่ะ..."
20040-833-1220-1 = "มีอะไรที่อยากได้รึไง?"
20040-833-1230-1 = "ครู อยากได้อะไรหรือไง?"
20040-833-1240-1 = "ฮุฮุ ครู...\nลองสะกดจิตฉันดูสิ"
20040-833-1250-1 = "แน่นอนว่ามันไม่ได้ผลกับฉัน..."
20040-833-1260-1 = "หืม? ไม่เป็นไรงั้นเหรอ?"
20040-833-1270-1 = "ฮุฮุ อย่าพูดแบบนั้นสิ\nเอาเลยๆ"
20040-833-1280-1 = "ครู ถ้ามัวแต่ยืนเหม่ออยู่แบบนั้น\nเดี๋ยวก็โดนดึงเข้าไปวุ่นวายกับ\nแผนการของมาโคโตะจังหรอก?"
20040-833-1290-1 = "เอาละ มาทางนี้สิ"
