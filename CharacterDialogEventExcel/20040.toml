[translation]
20040-833-1120-1 = "Welcome, Sensei. Take your time looking around."
20040-833-1130-1 = "The Pandemonium Society worked very hard on this event..."
20040-833-1140-1 = "...so I'm sure you'll find it to your liking."
20040-833-1150-1 = "Oh my. I suppose things aren't working out."
20040-833-1160-1 = "Well, Makoto can most likely solve it somehow, yes?"
20040-833-1170-1 = "I wasn't expecting your assistance here."
20040-833-1180-1 = "Heehee, I'll leave it to you then, Sensei."
20040-833-1190-1 = "And that's all for the party."
20040-833-1200-1 = "Just as I said, it worked out somehow, didn't it?"
20040-833-1210-1 = "Hm? You keep pestering me..."
20040-833-1220-1 = "Is there something you want?"
20040-833-1230-1 = "Sensei, what is it you would like?"
20040-833-1240-1 = "Heehee, Sensei... Try to hypnotize me."
20040-833-1250-1 = "Of course, it won't work on..."
20040-833-1260-1 = "Huh? It's okay?"
20040-833-1270-1 = "Heehee, don't say that... Here."
20040-833-1280-1 = "Sensei, if you stand idly by, you might get involved in Makoto's plot."
20040-833-1290-1 = "Come this way."
