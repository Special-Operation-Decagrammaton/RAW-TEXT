[translation]
20040-833-1120-1 = "いらっしゃい、先生。\n好きなだけ\n見ていって頂戴。"
20040-833-1130-1 = "私たち万魔殿が\n手掛けた\nパーティーだもの。"
20040-833-1140-1 = "先生も気に入るに\n決まってるわ。"
20040-833-1150-1 = "あら、進捗が\n芳しくないようね。"
20040-833-1160-1 = "まあ、\nマコトちゃんが\nなんとか\nするんじゃない？"
20040-833-1170-1 = "ここで先生の\n手を借りることに\nなるなんてね。"
20040-833-1180-1 = "ふふっ、\n頼んだわよ、先生？"
20040-833-1190-1 = "パーティーは\nこれで終わり。"
20040-833-1200-1 = "ね？私の言ったとおり、\nなんとか\nなったでしょう？"
20040-833-1210-1 = "ふ～ん、そんなに\nちょっかいを出して…"
20040-833-1220-1 = "何をされたいの？"
20040-833-1230-1 = "先生は、なにを\nご所望かしら？"
20040-833-1240-1 = "ふふっ、先生…\n私に催眠を\nかけてみなさい。"
20040-833-1250-1 = "もちろん私には\n効かな…"
20040-833-1260-1 = "うん？\n遠慮しておく？"
20040-833-1270-1 = "ふふっ、そんなこと\n言わずに…ほらほら。"
20040-833-1280-1 = "そんな風に\nぼんやりしていたら、\nマコトちゃんに\n絡まれてしまうわよ？"
20040-833-1290-1 = "ほら、こっちに\n来なさい。"
