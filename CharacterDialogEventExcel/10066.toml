[translation]
10066-825-10-1 = "คุณครู เร็วเข้าเถอะค่ะ!\nกิจกรรมค่ะ กิจกรรม!"
10066-825-20-1 = "ถ้าเป็นอาริสึละก็\nไม่ว่าตอนไหนก็โอเคค่ะ!\nคุณครู... พร้อมแล้วรึยังคะ?"
10066-825-30-1 = "อาริสึตั้งใจทำความสะอาด\nและป้องกันมากเลยนะคะ\nชมอาริสึหน่อยสิคะ!"
10066-825-40-1 = "ฮือ... กลายเป็น...\nเรื่องใหญ่ไปซะแล้วค่ะ "
10066-825-50-1 = "แต่ว่าอาริสึ\nไม่เป็นไรหรอกค่ะ\nก็เป็นผู้กล้าเมดนี่คะ!"
10066-825-60-1 = "เป็นการผจญภัย\nที่สุดยอดมากเลยค่ะ!"
10066-825-70-1 = "ถ้าอยู่กับคุณครูละก็\nไม่ว่าจะเป็นอะไร\nอาริสึก็ไม่กลัวทั้งนั้นค่ะ!"
10066-825-80-1 = "ถึงเลเวลยังไม่สูง...\nพอที่จะก้าวข้ามเมดได้..."
10066-825-90-1 = "แต่อาริสึก็จะพยายามค่ะ!"
10066-825-100-1 = "คุณครูคะ ถ้าเกิดว่า\nเจอรุ่นพี่เนรุแถวนี้ละก็\nติดต่ออาริสึทันทีเลยนะคะ"
10066-825-110-1 = "ต้องติดต่อมานะคะ!\nสัญญากับอาริสึแล้วนะคะ!"
10066-825-120-1 = "ทำอาหาร ทำความสะอาด\nและการซักผ้า\nคือพื้นฐานของเมดค่ะ!"
10066-825-130-1 = "คุณครูเองก็จะ\nเข้าร่วมเควสด้วยมั้ยคะ?"
10066-825-140-1 = "ถะ... ถึงจะจิ้มแบบนั้นแต่ก็ไม่มี\nอะไรดร็อปออกมาหรอกนะคะ..."
10066-825-150-1 = "อาริสึไม่ใช่\nมอนสเตอร์นะคะ!"
10066-825-500-1 = "เชิญค่ะคุณครู!"
10066-825-510-1 = "ผู้กล้าเมดก็สามารถ\nดูร้านค้าให้ได้นะคะ!"
10066-825-520-1 = "มีเสบียงไอเทม\nให้แลกเหลือเฟือเลยค่ะ"
10066-825-530-1 = "แต่ถ้าเป็นคุณครูละก็น่าจะเหมา\nไปทั้งหมดได้เลยนะคะ"
10066-825-540-1 = "ถึงกิจกรรมจะจบไปแล้ว\nแต่ร้านก็ยังเปิดอยู่นะคะ"
10066-825-550-1 = "มีเวลาจำกัดนะคะ อย่าลืมล่ะ\nสัญญากับอาริสึแล้วนะคะ"
10066-825-560-1 = "ยินดีต้อนรับสู่\nร้านอุปกรณ์ของอาริสึค่ะ!"
10066-825-570-1 = "ซื้อไอเทมและโพชั่นที่เป็น\nประโยชน์ต่อการผจญภัยได้ที่นี่ค่ะ!"
10066-825-580-1 = "อืม... คุณครูจะซื้อรอยยิ้มเหรอคะ?"
10066-825-590-1 = "ก็ได้ค่ะ โมโมอิบอกไว้ว่า\nรอยยิ้มราคา 0 เครดิตค่ะ!"
10066-825-600-1 = "ปาปัม ปาปัม ป๊าม! คุณครู\nซื้อไอเทมเรียบร้อยแล้วค่า!"
10066-825-610-1 = "อาริสึจะให้รอยยิ้มพิมพ์ใจ\nเป็นของแถมนะคะ!"
10066-825-620-1 = "โฮ โฮ...\nตาถึงมากเลยค่ะคุณลูกค้า"
10066-825-630-1 = "เวลานี้ต้องพูดบทนี้ค่ะ!\nอาริสึเรียนมาค่ะ!"
10066-825-640-1 = "นักเดินทางเอ๋ย...\nนั่นคือสิ่งที่เจ้าเลือกงั้นหรือ...?"
10066-825-650-1 = "เป็นไงคะคุณครู?\nอาริสึอยากพูดบทนี้มานานแล้วค่ะ!"
10066-825-660-1 = "การดูแลคลังไอเทม\nก็เป็นงานของเมดค่ะ!"
10066-825-670-1 = "วันนี้อาริสึ\nก็จะพยายามนะคะ!"
