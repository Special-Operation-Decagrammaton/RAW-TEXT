[translation]
10066-825-10-1 = "先生、急いでください！\nイベントですよ、\nイベント！"
10066-825-20-1 = "アリスなら、\nいつでもOKです！\n先生の準備は\n終わりましたか？"
10066-825-30-1 = "アリス、\n掃除も警備も\n頑張りました。\n褒めてください！"
10066-825-40-1 = "うぅ…\n大変なことに\nなってしまいました。"
10066-825-50-1 = "でもアリスは大丈夫です。\nメイド勇者ですから！"
10066-825-60-1 = "すごい冒険でした！"
10066-825-70-1 = "先生と一緒なら、\nアリスは何も\n怖くありません！"
10066-825-80-1 = "まだメイド克服レベルは\n高くないですが…"
10066-825-90-1 = "アリス、頑張ります！"
10066-825-100-1 = "先生、どこかで\nネル先輩を発見したら、\nすぐに教えてくださいね。"
10066-825-110-1 = "絶対ですよ？\nアリスとの約束です！"
10066-825-120-1 = "お料理、お掃除、お洗濯！\nどれもメイドの基本です！"
10066-825-130-1 = "先生もクエストに\n参加しますか？"
10066-825-140-1 = "そ、そんなに\n突っついても何も\nドロップしませんよ…？"
10066-825-150-1 = "アリスは\nモンスターでは\nありません！"
10066-825-500-1 = "いらっしゃいませ、先生！"
10066-825-510-1 = "メイド勇者は\nお店番も出来ます！"
10066-825-520-1 = "交換アイテムの在庫は、\nたっぷりあります！"
10066-825-530-1 = "でも先生だったら全部\nゲット出来ちゃうかも\nしれません。"
10066-825-540-1 = "イベントは終了しましたが、\nまだ営業中です。"
10066-825-550-1 = "期間限定なので\n忘れないでください。\nアリスとの約束ですよ？"
10066-825-560-1 = "ようこそ、\nアリスの道具屋へ！"
10066-825-570-1 = "ここでは冒険に\n役立つアイテムや\nポーションが買えますよ！"
10066-825-580-1 = "ん…\n先生、スマイルですか？"
10066-825-590-1 = "分かりました。\nスマイルは0クレジットだと、\nモモイが言ってました！"
10066-825-600-1 = "パンパカパーン！\n先生がアイテムを購入しました！"
10066-825-610-1 = "プレミアムスマイルを\nおまけしておきます！"
10066-825-620-1 = "ほほう…お客さん、\nお目が高いですね。"
10066-825-630-1 = "こういう時に言うセリフです！\nアリス、覚えました！"
10066-825-640-1 = "旅人よ、\nそれが汝の選択か…？"
10066-825-650-1 = "先生、どうですか？このセリフ、\n言ってみたかったんです！"
10066-825-660-1 = "アイテム倉庫の管理も\nメイドのお仕事です！"
10066-825-670-1 = "アリス、\n今日も頑張ります！"
