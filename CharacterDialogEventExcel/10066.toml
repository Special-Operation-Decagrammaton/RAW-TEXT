[translation]
10066-825-10-1 = "老師，請加快動作！\n是活動唷，活動！"
10066-825-20-1 = "愛麗絲的話，隨時都OK！\n老師的準備完成了嗎？"
10066-825-30-1 = "愛麗絲，不管是\n打掃還是戒備\n都很努力。\n請稱讚愛麗絲！"
10066-825-40-1 = "嗚……變成\n很嚴重的事情了。"
10066-825-50-1 = "但是愛麗絲沒問題。\n因為是女僕勇者！"
10066-825-60-1 = "是場了不起的冒險！"
10066-825-70-1 = "只要跟老師在一起，\n愛麗絲什麼都不怕！"
10066-825-80-1 = "雖然女僕克服等級\n還不高……"
10066-825-90-1 = "愛麗絲，會加油的！"
10066-825-100-1 = "老師，如果在哪裡\n發現了寧瑠前輩的話，\n請馬上通知哦。"
10066-825-110-1 = "絕對要哦？\n是和愛麗絲的約定！"
10066-825-120-1 = "料理、打掃、洗衣服！\n每個都是女僕的基礎！"
10066-825-130-1 = "老師也要\n參加任務嗎？"
10066-825-140-1 = "就，就算那樣戳\n也不會掉落\n任何東西喔……？"
10066-825-150-1 = "愛麗絲不是怪物！"
10066-825-500-1 = "歡迎光臨，老師！"
10066-825-510-1 = "女僕勇者\n要顧店也沒問題！"
10066-825-520-1 = "兌換道具的庫存，\n有非常多！"
10066-825-530-1 = "但如果是老師\n說不定能全都獲得。"
10066-825-540-1 = "活動雖然結束了，\n不過還在營業中。"
10066-825-550-1 = "因為是期間限定，\n還請不要忘記。\n是和愛麗絲的約定唷？"
10066-825-560-1 = "歡迎來到\n愛麗絲的道具店！"
10066-825-570-1 = "在這裡可以買到\n對冒險有幫助的\n道具和藥水唷！"
10066-825-580-1 = "嗯…老師，微笑是嗎？"
10066-825-590-1 = "知道了。桃井說過\n微笑是0信用貨幣！"
10066-825-600-1 = "乓啪喀乓！\n老師購買了道具！"
10066-825-610-1 = "送你高級微笑\n作為贈品！"
10066-825-620-1 = "齁齁…這位客人，\n眼光真不錯呢。"
10066-825-630-1 = "是這種時候要說的台詞！\n愛麗絲還記得！"
10066-825-640-1 = "旅人啊，\n這就是汝的選擇嗎…？"
10066-825-650-1 = "老師，怎麼樣呢？這句台詞，\n愛麗絲一直想說說看！"
10066-825-660-1 = "道具倉庫的管理\n也是女僕的工作！"
10066-825-670-1 = "愛麗絲，\n今天也會努力的！"
