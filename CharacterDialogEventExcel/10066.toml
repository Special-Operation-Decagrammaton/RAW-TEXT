[translation]
10066-825-10-1 = "Please hurry, Sensei! It is a very special event!"
10066-825-20-1 = "My loadout is equipped! I am ready to go! What about you, Sensei?"
10066-825-30-1 = "I have worked very hard to clean and keep watch. Did I do a satisfactory job?"
10066-825-40-1 = "Uh... This is much more complicated than I expected..."
10066-825-50-1 = "But I am okay! Because I am a hero maid!"
10066-825-60-1 = "That was an incredible adventure!"
10066-825-70-1 = "As long as we are in a party together, I am not afraid of anything, Sensei!"
10066-825-80-1 = "My maid level still is not very high..."
10066-825-90-1 = "But I will continue to grind for more EXP!"
10066-825-100-1 = "Sensei, please tell me if you see Neru anywhere."
10066-825-110-1 = "Promise me, okay?"
10066-825-120-1 = "Cooking, cleaning, laundry... A maid must level up many skills."
10066-825-130-1 = "Will you join me on this quest, Sensei?"
10066-825-140-1 = "Um, you can hit me, but I will not drop any loot..."
10066-825-150-1 = "I am not a mob!"
10066-825-500-1 = "Welcome, Sensei!"
10066-825-510-1 = "A hero maid can even work as a shopkeeper!"
10066-825-520-1 = "We have many powerful items in stock!"
10066-825-530-1 = "But since it is you, Sensei... I think you can have whatever you want!"
10066-825-540-1 = "The event is over, but the shop is still open!"
10066-825-550-1 = "However, only for a little bit longer! So you cannot dilly-dally! Promise!"
10066-825-560-1 = "Welcome to Aris' Adventure Supplies!"
10066-825-570-1 = "We have many powerful potions and materials to aid in your quest!"
10066-825-580-1 = "Oh! A smile, Sensei?"
10066-825-590-1 = "Right away! Momoi told me that smiles are free!"
10066-825-600-1 = "Bum bum bum! Item acquired!"
10066-825-610-1 = "I shall grant you an upgrade! One premium smile, coming up!"
10066-825-620-1 = "Hohoho... You have quite an eye for quality, dear guest."
10066-825-630-1 = "How did I do? I memorized dialogue for these kinds of situations!"
10066-825-640-1 = "O' weary traveler, is this your choice?"
10066-825-650-1 = "Did you like it, Sensei? I have been wanting to try that one!"
10066-825-660-1 = "Inventory management is also part of a maid's duty!"
10066-825-670-1 = "I will work hard again today!"
