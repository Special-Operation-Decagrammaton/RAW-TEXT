[translation]
16015-10 = "เชิญค่ะคุณครู!\nฉันกำลังรออยู่เลยค่ะ!"
16015-20 = "คุณครู! ถ้าสะดวกละก็\nช่วยดูผลการฝึกซ้อม\nให้หน่อยนะคะ!"
16015-30 = "คุณครู? เรียกฉันเหรอคะ...?"
16015-40 = "อะ... เอ๋..."
16015-50 = "ถ้าเอาแต่จิ้มกันอย่างนี้ละก็..."
16015-60 = "จะ... จั๊กจี้นะคะ\nคุณครู..."
16015-70 = "อะฮ่าฮ่า..."
16015-80 = "จริงๆ เลยเชียว~!\nเดี๋ยวฉันเอาคืนบ้างนะคะ!"
16015-90 = "จะ... จั๊กจี้นะคะ!\nคุณครู..."
16015-100 = "อะฮ่าฮ่า..."
16015-110 = "จริงๆ เลยเชียว~!\nเดี๋ยวฉันเอาคืนบ้างนะคะ!"
16015-690 = "สวัสดีค่ะคุณครู!\nฉันกำลังรออยู่เลยค่ะ!"
16015-700 = "มาแล้วเหรอคะคุณครู!\nฉันสรุปความคืบหน้าเอาไว้ให้แล้วค่ะ!"
16015-710 = "คะ...คุณครู...!"
