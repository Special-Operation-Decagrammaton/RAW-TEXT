[translation]
16015-836-10-1 = "歡迎回來，老師！\n我一直在等你哦！"
16015-836-20-1 = "老師！可以的話，\n請看看我練習的成果！"
16015-836-30-1 = "很順利呢！\n我也會加油的！"
16015-836-40-1 = "我會努力到最後！\n請拭目以待，老師！"
16015-836-50-1 = "哇……真爽快！\n老師覺得如何？"
16015-836-60-1 = "老師？\n……你有叫我嗎？"
16015-836-70-1 = "那，那個……"
16015-836-80-1 = "被那樣\n戳來戳去的話……"
16015-836-90-1 = "很，很癢耶，\n老師……"
16015-836-100-1 = "啊哈哈……"
16015-836-110-1 = "真是的～！\n我要反擊回去囉？"
16015-836-690-1 = "你好，老師！\n我一直在等你！"
16015-836-700-1 = "你來了啊，老師！\n進度已經整理好了！"
16015-836-710-1 = "老，老師……？"
16015-836-720-1 = "別，別看我，\n請看那邊……"
16015-836-730-1 = "好的！就是這些！"
16015-836-740-1 = "確認完成！"
