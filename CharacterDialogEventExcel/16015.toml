[translation]
16015-836-10-1 = "Welcome, Sensei! I've been waiting for you!"
16015-836-20-1 = "Sensei! If you don't mind, please watch the results of our practice!"
16015-836-30-1 = "It's going well! I'll do my best, too!"
16015-836-40-1 = "I'll do my best until the very end! Please watch me, Sensei!"
16015-836-50-1 = "Phew... That felt refreshing! What about you, Sensei?"
16015-836-60-1 = "Did you call for me? Sensei?"
16015-836-70-1 = "E-Eh..."
16015-836-80-1 = "If you keep poking me like that..."
16015-836-90-1 = "Th-That tickles. Sensei..."
16015-836-100-1 = "Ahaha..."
16015-836-110-1 = "Seriously! Do you want me to do it back to you?!"
16015-836-690-1 = "Welcome, Sensei! I've been waiting for you!"
16015-836-700-1 = "You're here, Sensei! I was logging our current progress!"
16015-836-710-1 = "S-Sensei...?"
16015-836-720-1 = "L-Look over there, not at me..."
16015-836-730-1 = "Yes! Here you go!"
16015-836-740-1 = "Confirmed!"
