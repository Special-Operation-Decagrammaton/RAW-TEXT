[translation]
16015-836-10-1 = "おかえりなさい、先生！\nお待ちしておりました！"
16015-836-20-1 = "先生！よかったら練習の\n成果を見てください！"
16015-836-30-1 = "順調ですね！\n私も頑張ります！"
16015-836-40-1 = "最後まで頑張ります！\n見ていてください、先生！"
16015-836-50-1 = "はぁ……スッキリした！\n先生はいかがでしたか？"
16015-836-60-1 = "先生？……呼びました？"
16015-836-70-1 = "え、ええと……。"
16015-836-80-1 = "そんなに\nつつかれたら……。"
16015-836-90-1 = "く、くすぐったいです、\n先生……。"
16015-836-100-1 = "あはは……。"
16015-836-110-1 = "もう～！私もやり\n返しちゃいますよ？"
16015-836-690-1 = "こんにちは、先生！\nお待ちしておりました！"
16015-836-700-1 = "来てくださったんですね、先生！\n進行状況をまとめておきました！"
16015-836-710-1 = "せ、先生……？"
16015-836-720-1 = "わ、私じゃなくて\nあちらを見てください……"
16015-836-730-1 = "はい！こちらです！"
16015-836-740-1 = "確認完了です！"
