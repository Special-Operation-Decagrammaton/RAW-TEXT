[translation]
16015-836-10-1 = "어서 오세요, 선생님!\n기다리고 있었어요!"
16015-836-20-1 = "선생님! 괜찮으시다면\n연습의 성과를 봐주세요!"
16015-836-30-1 = "순조롭네요!\n저도 열심히 하겠습니다!"
16015-836-40-1 = "끝까지 열심히 하겠습니다!\n지켜봐 주세요, 선생님!"
16015-836-50-1 = "하아…개운해!\n선생님은 어떠셨나요?"
16015-836-60-1 = "선생님? ……부르셨나요?"
16015-836-70-1 = "에, 에에……."
16015-836-80-1 = "그렇게 자꾸 찌르시면……."
16015-836-90-1 = "가, 간지러워요.\n선생님……."
16015-836-100-1 = "아하하……."
16015-836-110-1 = "정말~!\n저도 똑같이 할 거예요!?"
16015-836-690-1 = "안녕하세요, 선생님!\n기다리고 있었어요!"
16015-836-700-1 = "오셨군요, 선생님!\n진행 상황을 정리해 두었어요!"
16015-836-710-1 = "서, 선생님……?"
16015-836-720-1 = "저, 저 말고 저쪽을 봐주세요……."
16015-836-730-1 = "네! 여기 있습니다!"
16015-836-740-1 = "확인 완료입니다!"
