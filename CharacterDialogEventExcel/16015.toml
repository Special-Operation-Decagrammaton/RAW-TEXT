[translation]
16015-836-10-1 = "เชิญค่ะคุณครู!\nฉันกำลังรออยู่เลยค่ะ!"
16015-836-20-1 = "คุณครู! ถ้าสะดวกละก็\nช่วยดูผลการฝึกซ้อม\nให้หน่อยนะคะ!"
16015-836-30-1 = "ราบรื่นดีเลยค่ะ!\nฉันเองก็จะพยายามนะคะ!"
16015-836-40-1 = "ฉันจะพยายามจนถึงที่สุดเลยค่ะ!\nช่วยเฝ้ามองฉันด้วยนะคะคุณครู!"
16015-836-50-1 = "ฮ่า... โล่งจัง!\nคุณครูว่าเป็นยังไงบ้างคะ?"
16015-836-60-1 = "คุณครู? เรียกฉันเหรอคะ...?"
16015-836-70-1 = "อะ... เอ๋..."
16015-836-80-1 = "ถ้าเอาแต่จิ้มกันอย่างนี้ละก็..."
16015-836-90-1 = "จะ... จั๊กจี้นะคะ\nคุณครู..."
16015-836-100-1 = "แหะๆๆ..."
16015-836-110-1 = "จริงๆ เลยเชียว~!\nเดี๋ยวฉันเอาคืนบ้างนะคะ!"
16015-836-690-1 = "สวัสดีค่ะคุณครู!\nฉันกำลังรออยู่เลยค่ะ!"
16015-836-700-1 = "มาแล้วเหรอคะคุณครู!\nฉันสรุปความคืบหน้าเอาไว้ให้แล้วค่ะ!"
16015-836-710-1 = "คะ... คุณครู...?"
16015-836-720-1 = "ยะ... อย่ามองฉันสิคะ ไปดูตรงนั้นค่ะ..."
16015-836-730-1 = "ค่ะ! อยู่นี่ค่ะ!"
16015-836-740-1 = "ตรวจสอบเรียบร้อยค่ะ!"
16015-10836-10-1 = "เชิญค่ะคุณครู!\nฉันกำลังรออยู่เลยค่ะ!"
