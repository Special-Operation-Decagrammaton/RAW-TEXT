[translation]
10032-809-230-1 = "Oh Sensei, found you! It's the new year and you're working like always!"
10032-809-240-1 = "Wow! I'm surprised to see you right at the start of the new year, Sensei!"
10032-809-250-1 = "High five!"
10032-809-260-1 = "So, Sensei, what toy should we play with today?"
10032-809-270-1 = "Hanetsuki? Fukuwarai? Daruma otoshi! Heeheehee! ♪"
10032-809-280-1 = "Hmm, I'm kinda getting tired of playing with toys. I'm going to play with Sensei instead!"
10032-809-290-1 = "What do you think? It's a great idea, right?"
10032-809-300-1 = "Heehee. That was fun! You had fun too, right?"
10032-809-310-1 = "I hope this year is full of fun stuff, just like this!"
10032-809-320-1 = "Oh, Aru seems to be in some kind of trouble! Well, it's okay because it's fun for me!"
10032-809-330-1 = "Out of the blue, there's a offering box thief! I just love the chaos at the start of the new year!"
10032-809-340-1 = "Ugh! It's so boring just sitting around doing nothing! Let's go, Sensei!"
10032-809-350-1 = "Looks like there'll be lots of commotion this year as well."
10032-809-360-1 = "Aru, Kayoko, and Haruka are all relying on you, Sensei, so do your best! ♪"
10032-809-370-1 = "Huh? Me? Well, what do you think?"
10032-809-380-1 = "What do you think?"
10032-809-730-1 = "Welcome to Mutsuki's special exchange center!"
10032-809-740-1 = "Hello, Sensei! You have the lucky pouch, right? Let's open it up!"
10032-809-750-1 = "Sensei! Hello! The New Year's event is over, but..."
10032-809-760-1 = "It's still not enough! If there are any leftover lucky pouches, we should open all of them!"
10032-809-770-1 = "I wonder what's inside! *ba-dump* *ba-dump*"
10032-809-780-1 = "Huh? Why am I looking at it like that?"
10032-809-790-1 = "Well, because it's always fun to open lucky pouches!"
10032-809-800-1 = "Wow! I can't believe this was inside! I'm shocked! I envy you!"
10032-809-810-1 = "I want it too!"
10032-809-820-1 = "Yeah! It's a good item, Sensei!"
10032-809-830-1 = "This might all be thanks to me! You can be grateful. Heeheehee!"
10032-809-840-1 = "Oh, maybe you won something! Heeheehee. I mean, I did pick it for you."
10032-809-850-1 = "Think of it as an extension of me and cherish it, okay?"
