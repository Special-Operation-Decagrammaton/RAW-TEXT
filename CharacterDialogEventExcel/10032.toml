[translation]
10032-809-230-1 = "啊，老師，找～到你了！\n到了新年竟然還要工作，\n你還是老樣子呢，老師！"
10032-809-240-1 = "哇哦！沒想到剛過新年\n就能像這樣見到你，\n嚇我一跳呢，老師！"
10032-809-250-1 = "耶，擊掌！"
10032-809-260-1 = "來吧，老師，今天\n要玩什麼玩具呢？"
10032-809-270-1 = "羽根突、\n笑福面、\n打達摩！\n咯呵呵♪"
10032-809-280-1 = "唔嗯～玩也玩得\n有點膩了……\n差不多該開始\n玩老師了吧！"
10032-809-290-1 = "怎麼樣？\n不覺得是個好主意嗎？"
10032-809-300-1 = "啊～真開心！\n怎麼樣？\n老師也玩得很開心嗎？"
10032-809-310-1 = "要是今年也能像這樣\n充滿有趣的事情就好了！"
10032-809-320-1 = "啊哈，總覺得亞瑠醬\n好像很辛苦呢～\n算了，我倒是覺得有趣\n所以無所謂！"
10032-809-330-1 = "想不到居然會有\n賽錢箱小偷呢～\n才剛過新年就亂哄哄的，\n看來好像完全不會厭煩！"
10032-809-340-1 = "嗯～果然只是一直\n待著真的好無聊！\n走吧，老師！"
10032-809-350-1 = "雖然今年好像也會\n發生各式各樣的事情，"
10032-809-360-1 = "不過不管是亞瑠醬、\n佳世子醬還是遙香醬\n都很依賴老師哦♪"
10032-809-370-1 = "咦？我？呵呵，\n我反而想問，\n你覺得我是怎麼想的呢？"
10032-809-380-1 = "究竟是怎麼樣呢～？"
10032-809-730-1 = "歡迎來到無月醬的\n特別交換所～！"
10032-809-740-1 = "啊，老師！\n你有帶福袋吧？\n快點打開來看看吧！"
10032-809-750-1 = "啊，老師！\n你好呀～！\n雖然新年的活動\n已經結束了……"
10032-809-760-1 = "不過還不滿足對吧！\n如果還有剩下的福袋，\n就趕緊全都拆開吧！"
10032-809-770-1 = "那麼那麼，\n會出現什麼東西呢～？\n心動動！"
10032-809-780-1 = "嗯？問我\n為什麼一直盯著看？"
10032-809-790-1 = "你想想，開福袋這種事\n不管看幾次都很有趣不是嗎？"
10032-809-800-1 = "哇哦～！裡面\n居然有這種東西，\n無月醬也嚇了一跳！"
10032-809-810-1 = "真好真好～\n我也好想要～"
10032-809-820-1 = "啊，好像抽到了\n不錯的東西呢！老師！"
10032-809-830-1 = "這股幸運說不定\n也是託我的福哦？\n要感謝我也可以唷？咯呵呵！"
10032-809-840-1 = "啊，中獎了嗎？\n啊哈。畢竟我都\n特別幫你抽了。"
10032-809-850-1 = "要把它當成是我，\n好好愛惜哦？"
10032-10809-230-1 = "啊，老師，找～到你了！\n到了新年竟然還要工作，\n你還是老樣子呢，老師！"
