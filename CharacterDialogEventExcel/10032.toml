[translation]
10032-809-230-1 = "あっ、先生見ーつけた！\n新年になっても\n仕事だなんて、\n相変わらずだね先生！"
10032-809-240-1 = "わお！新年早々こうして\n会えるなんて\nびっくりだね、先生！"
10032-809-250-1 = "いぇーい、ハイタッチ！"
10032-809-260-1 = "さあ先生、今日は\nどんなオモチャで遊ぶ？"
10032-809-270-1 = "羽根つきに、\n福笑いに、\nだるま落とし！\nくふふっ♪"
10032-809-280-1 = "うーん、ちょっと\nマンネリになってきたし……\nそろそろ先生で\n遊ぼっかな！"
10032-809-290-1 = "どう？\n良いアイデアだと\n思わない？"
10032-809-300-1 = "あ～楽しかった！\nどう、先生も楽しめた？"
10032-809-310-1 = "今年もこんな風に、\n楽しいことが\nたっくさんあるといいな！"
10032-809-320-1 = "あはっ、何だか\nアルちゃん大変そうだね～\nまっ、私は面白いから\n良いんだけど！"
10032-809-330-1 = "まさか\nお賽銭泥棒なんてね～\n新年早々騒がしくって、\n全然飽きずに済みそう！"
10032-809-340-1 = "ん～、やっぱり\nじっとしてるだけじゃ\nつまんない！行こ、先生！"
10032-809-350-1 = "こうやって今年も\n色んな事が\n起きそうだけど、"
10032-809-360-1 = "アルちゃんもカヨコちゃんも\nハルカちゃんも、\n先生のことを\n頼りにしてるからね♪"
10032-809-370-1 = "え、私？ふふっ、\n逆に聞くけどー、\n私はどうだと思う？"
10032-809-380-1 = "さあ、どうかな～？"
10032-809-730-1 = "ムツキちゃんの\n特別交換所へ\nようこそ～！"
10032-809-740-1 = "あ、先生！\n福袋持ってるよね？\n早く開けてみようよ！"
10032-809-750-1 = "あっ、先生！\nおはよー！\n新年のイベントは\n終わっちゃったけど……"
10032-809-760-1 = "まだまだ物足りないよね！\n余ってる福袋があったら\nじゃんじゃん\n開けちゃおう！"
10032-809-770-1 = "さてさて、\n何が出てくるかな～？\nドキドキ！"
10032-809-780-1 = "うん？\nどうしてそんなに\n見てるのって？"
10032-809-790-1 = "だって、福袋を\n開けるところって\n何回見ても\n楽しいでしょ！"
10032-809-800-1 = "わーお！ こんなものが\n入ってたなんて、\nムツキちゃんもびっくり！"
10032-809-810-1 = "良いな良いな～\n私も欲しいな～"
10032-809-820-1 = "あっ、良さそうものが\n当たったね！先生！"
10032-809-830-1 = "この幸運も私のおかげかもよ？\n感謝してくれても\nいいんだよ？くふふっ！"
10032-809-840-1 = "おっ、当たりかな？\nあはっ、せっかく私が\n引いてあげたんだから"
10032-809-850-1 = "これを私だと思って、\n大切にしてね？"
