[translation]
10032-809-230-1 = "อ๊ะ คุณครู เจอตัวแล้ว!\nถึงจะปีใหม่แล้ว แต่งานก็เยอะ\nเหมือนเดิมเลย! คุณครู!"
10032-809-240-1 = "ว้าวววว! ได้มาเจอกัน\nตั้งแต่ปีใหม่แบบนี้\nน่าตกใจจริงๆ นะ! คุณครู!"
10032-809-250-1 = "เย้ ไฮไฟว์!"
10032-809-260-1 = "เอาล่ะคุณครู วันนี้...\nเอาของเล่นอะไรมาเล่นกันดี?"
10032-809-270-1 = "ฮาเนะสึกิ?\nฟุคุวาราคิ?\nดารุมะโอโตชิ?\nฮุฮุฮุ~♪"
10032-809-280-1 = "อืมม~ เบื่อของเล่นแล้วล่ะ\nตั้งแต่นี้ไป\nให้คุณครูมาเล่นด้วยดีกว่า!"
10032-809-290-1 = "ว่ายังไง?\nเป็นความคิดที่ดีเลยใช่ไหม?"
10032-809-300-1 = "อา~ สนุกจังเลย!\nคุณครูก็สนุกใช่ไหม?"
10032-809-310-1 = "ถ้าตลอดปีนี้ มีแต่เรื่องสนุกๆ\nตลอดทั้งปีเลยก็คงจะดีนะ!"
10032-809-320-1 = "อ่ะฮ่า ท่าทางอารุจัง\nจะเจอเรื่องใหญ่เข้าแล้วน้า~\nแต่ว่าฉันก็สนุกแหละ\nเพราะงั้นไม่เป็นไรหรอก!"
10032-809-330-1 = "ตู้บริจาคโดนขโมยไป\nโดยไม่ทันรู้ตัวงั้นเหรอ~\nมีเรื่องวุ่นวายตั้งแต่ปีใหม่แบบนี้\nสุดยอดไปเลยน้า~!"
10032-809-340-1 = "อื้อ~! ว่าแล้วเชียว\nอยู่เฉยๆ มันน่าเบื่อนะ!\nไปกันเถอะ! คุณครู!"
10032-809-350-1 = "ปีนี้ก็ดูเหมือนว่า\nจะมีเรื่องวุ่นวาย\nเกิดขึ้นอีกเยอะแยะเลย"
10032-809-360-1 = "แต่อารุจัง คาโยโกะจัง\nแล้วก็ฮารุกะจังน่ะ\nหวังพึ่งคุณครูอยู่นะ\nเพราะงั้นก็ฝากด้วยล่ะ ♪"
10032-809-370-1 = "หืม? ฉันเหรอ?\nนั่นสินะ\nคิดว่ายังไงล่ะ?"
10032-809-380-1 = "ยังไงดีน้า~?"
10032-809-730-1 = "ยินดีต้อนรับสู่จุดแลกของ\nของมุสึกิจังนะ~!"
10032-809-740-1 = "ว่าไง~! คุณครู!\nมีถุงโชคดีอยู่รึเปล่า?\nรีบเปิดดูเถอะ!"
10032-809-750-1 = "อ๊ะ คุณครู! ว่าไง~!\nถึงเทศกาลฉลองปีใหม่\nจะจบไปแล้ว..."
10032-809-760-1 = "แต่มันก็ยังไม่พอหรอกนะ!\nถ้ายังมีถุงโชคดีอยู่ละก็\nเปิดดูให้หมดเลยเถอะ!"
10032-809-770-1 = "นี่ๆ ได้อะไรงั้นเหรอ~?\nตื่นเต้นจัง!"
10032-809-780-1 = "หืม? ถามว่าทำไมเค้าถึง\nจ้องแบบนั้นน่ะเหรอ?"
10032-809-790-1 = "ก็นะ เวลาที่เปิด\nดูของในถุงโชคดีน่ะ\nมันน่าสนุกจะตายไป!"
10032-809-800-1 = "ว้าว! ในกล่องมีของแบบนี้อยู่งั้นเหรอ?\nมุสึกิ...ช็อก! น่าอิจฉาจุง~"
10032-809-810-1 = "เค้าก็อยากได้เหมือนกันนะ~"
10032-809-820-1 = "อื้อ! ของดีเลยนะเนี่ย!\nคุณครู!"
10032-809-830-1 = "อาจเป็นเพราะโชคจากเค้ารึเปล่า\nจะขอบคุณเค้าก็ได้นะ ฮึฮึ!"
10032-809-840-1 = "อ๊ะ ถูกรางวัลงั้นเหรอ? ฮิฮิฮิ\nสมแล้วที่เค้าเป็นคนเลือกให้"
10032-809-850-1 = "คิดซะว่าเป็นเค้า\nแล้วก็ใช้อย่างทะนุถนอมล่ะ~"
10032-10809-230-1 = "อ๊ะ คุณครู เจอตัวแล้ว!\nถึงจะปีใหม่แล้ว แต่งานก็เยอะ\nเหมือนเดิมเลยนะ! คุณครู!"
