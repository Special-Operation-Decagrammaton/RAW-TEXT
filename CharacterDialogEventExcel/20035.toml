[translation]
20035-835-10-1 = "Welcome, Sensei... Glad you made it to Hyakkiyako..."
20035-835-20-1 = "I'll be your guide today."
20035-835-30-1 = "Tour Guide Kasuga Tsubaki. I'll do my best. *yawn*..."
20035-835-40-1 = "How's Hyakkiyako been? Are you making the most of your time here?"
20035-835-50-1 = "If there's somewhere you want to go, let me know anytime..."
20035-835-60-1 = "If it's in Hyakkiyako, I can guide you there."
20035-835-70-1 = "That festival...was quite impressive, wasn't it?"
20035-835-80-1 = "There are other big festivals in Hyakkiyako too... So don't go without your tour guide."
20035-835-90-1 = "*yawn*... What's wrong, Sensei?"
20035-835-100-1 = "I was nodding off, so you tried to wake me?"
20035-835-110-1 = "Hmm...that tickles..."
20035-835-120-1 = "Something like that won't hinder my training..."
20035-835-130-1 = "If you keep acting like a bully..."
20035-835-140-1 = "I might just sleep in bed with you, Sensei..."
20035-835-150-1 = "Huh? You'd like that...?"
20035-835-160-1 = "I think you just want more attention..."
20035-835-170-1 = "...There's no need. I'm already giving you plenty of attention..."
20035-835-800-1 = "If you don't do your daily tasks diligently..."
20035-835-810-1 = "...you won't have sweet dreams."
20035-835-820-1 = "You checked your schedule? In that case, I'll be your guide."
20035-835-830-1 = "Ugh... Don't wake me up so rudely, Sensei..."
20035-835-840-1 = "Hmm? No, I didn't fall asleep. Really..."
20035-835-850-1 = "I'll guide you to our next destination, Sensei..."
20035-835-860-1 = "But before that, a quick nap..."
20035-835-870-1 = "Here, take this... You've earned it, Sensei. Heehee."
20035-835-880-1 = "You're quite diligent about your training..."
20035-835-890-1 = "But I won't be defeated... Zzz..."
