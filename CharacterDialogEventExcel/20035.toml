[translation]
20035-835-10-1 = "เชิญเลย คุณครู...\nยินดีต้อนรับสู่เฮียกคิยาโคค่ะ..."
20035-835-20-1 = "วันนี้ฉันจะเป็นไกด์\nให้คุณครูเอง"
20035-835-30-1 = "ไกด์คาซึกะ สึบากิ\nจะพยายามนะคะ ฮ้าว..."
20035-835-40-1 = "เฮียกคิยาโคเป็นยังไงบ้าง...?\nกำลังสนุกอยู่ใช่มั้ย...?"
20035-835-50-1 = "ถ้ามีที่ที่อยากไป\nก็บอกฉันได้ตลอดนะ..."
20035-835-60-1 = "ถ้าเป็นเฮียกคิยาโค\nฉันพาทัวร์ได้หมดเลย..."
20035-835-70-1 = "เทศกาล...\nยอดเยี่ยมไปเลยใช่มั้ย?"
20035-835-80-1 = "ในเฮียกคิยาโคยังมี\nเทศกาลอื่นอีกเยอะแยะเลย...\nแล้วฉันจะรอนะ"
20035-835-90-1 = "เอ๋...\nมีอะไรเหรอคุณครู?"
20035-835-100-1 = "เหมือนฉันกำลังง่วงนอน\nก็เลยปลุกดูงั้นเหรอ?"
20035-835-110-1 = "งืม... จั๊กจี้นะ..."
20035-835-120-1 = "แต่แค่นั้นน่ะ\nขัดขวางการฝึกฝนของฉัน\nไม่ได้หรอก..."
20035-835-130-1 = "ถ้ายังจะแกล้งอยู่แบบนั้น..."
20035-835-140-1 = "ฉันจะพาไปนอน\nบนเตียงด้วยกันเลยนะ..."
20035-835-150-1 = "หืม...? ถ้าได้แบบนั้น\nก็ยิ่งดีเลยงั้นเหรอ...?"
20035-835-160-1 = "อยากให้ฉันใส่ใจ\nงั้นเหรอ...?"
20035-835-170-1 = "ไม่ต้องทำขนาดนั้น\nฉันก็ใส่ใจคุณครู\nอยู่แล้วนะ..."
20035-835-800-1 = "ถ้าไม่ตั้งใจทำงาน\nของวันนี้ละก็..."
20035-835-810-1 = "ว่ากันว่าจะไม่นอนฝันดีนะ..."
20035-835-820-1 = "เช็กกำหนดการแล้วหรือยัง...?\nงั้นฉันจะเป็นไกด์ให้เอง"
20035-835-830-1 = "งืม... อย่าปลุกกัน\nอย่างนั้นสิครู..."
20035-835-840-1 = "หืม...? เปล่านะ\nฉันไม่ได้หลับ บอกว่าไม่ได้หลับ..."
20035-835-850-1 = "ฉันจะพาไปยัง\nจุดต่อไปนะ คุณครู..."
20035-835-860-1 = "แต่ของีบก่อนไปสักหน่อย..."
20035-835-870-1 = "เอ้านี่... รับไปสิคะ\nทำได้ดีมากเลยคุณครู ฮุฮุ"
20035-835-880-1 = "คุณครูก็ตั้งใจฝึก\nเหมือนกันนะ..."
20035-835-890-1 = "ฉันยอมแพ้ไม่ได้แล้ว\nคร่อก zzZ..."
