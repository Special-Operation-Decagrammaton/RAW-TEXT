[translation]
20035-835-10-1 = "어서 와, 선생님……\n백귀야행에 잘 오셨어요……"
20035-835-20-1 = "오늘은 내가 선생님을\n안내해 줄게."
20035-835-30-1 = "가이드 카스가 츠바키,\n힘내겠습니다. 후암……"
20035-835-40-1 = "백귀야행은 어때……?\n제대로 즐기고 있어……?"
20035-835-50-1 = "가고 싶은 곳이 있다면,\n언제든지 말해 줘……"
20035-835-60-1 = "백귀야행이라면,\n안내할 수 있으니까……"
20035-835-70-1 = "축제…… 대단했지?"
20035-835-80-1 = "백귀야행에는 또 다른\n축제들도 많아……\n기다리고 있을게?"
20035-835-90-1 = "후에……\n왜 그래, 선생님?"
20035-835-100-1 = "졸고 있는 것 같아서,\n깨워 봤다고?"
20035-835-110-1 = "우웅…… 간지러워……"
20035-835-120-1 = "하지만 그 정도로,\n나의 수행을\n막을 수는 없을 거야……"
20035-835-130-1 = "자꾸 그렇게 장난치면……"
20035-835-140-1 = "침대에 같이\n누워 버릴 거야……?"
20035-835-150-1 = "응……? 오히려\n그러고 싶다고……?"
20035-835-160-1 = "혹시 신경 써 주기를\n바라는 거야……?"
20035-835-170-1 = "……그렇게 하지 않아도,\n나는 충분히 선생님을\n신경 쓰고 있는데……"
20035-835-800-1 = "매일의 일과를 제대로 하지 않으면……"
20035-835-810-1 = "좋은 꿈은 꿀 수 없대……"
20035-835-820-1 = "일정표는 확인했어……?\n그러면 내가 가이드를 해 줄게."
20035-835-830-1 = "우웅…… 그렇게 깨우지\n말아 줘, 선생님……"
20035-835-840-1 = "웅……? 아니야.\n안 잤어. 안 잤다니까……"
20035-835-850-1 = "다음 목적지로\n안내해 줄게, 선생님……"
20035-835-860-1 = "그 전에, 조금만 자고 나서……"
20035-835-870-1 = "자, 여기…… 받아가세요.\n고생 많았어, 선생님. 후훗."
20035-835-880-1 = "선생님도 수행에 열심이구나……"
20035-835-890-1 = "나도 질 수 없지. 코오……"
