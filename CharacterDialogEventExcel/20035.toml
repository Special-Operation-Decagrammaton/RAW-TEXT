[translation]
20035-835-10-1 = "歡迎回來，老師……\n歡迎來到百鬼夜行……"
20035-835-20-1 = "今天就由我來\n為老師導覽。"
20035-835-30-1 = "導覽員春日椿，\n會努力的。呼啊……"
20035-835-40-1 = "百鬼夜行如何……？\n有樂在其中嗎……？"
20035-835-50-1 = "如果有想去的地方，\n隨時可以告訴我……"
20035-835-60-1 = "如果是百鬼夜行的話，\n我可以幫你導覽……"
20035-835-70-1 = "慶典……很厲害吧？"
20035-835-80-1 = "百鬼夜行還有很多\n別的慶典……等你來哦？"
20035-835-90-1 = "呼咦……\n怎麼啦老師？"
20035-835-100-1 = "我看起來像在打瞌睡，\n所以就試著叫醒我？"
20035-835-110-1 = "唔……好癢……"
20035-835-120-1 = "但是，這種程度\n無法阻止我的修行哦……"
20035-835-130-1 = "一直這樣\n惡作劇的話……"
20035-835-140-1 = "就要一起躺在\n床上了哦……？"
20035-835-150-1 = "嗯……？反而\n希望那樣……？"
20035-835-160-1 = "難道你希望我\n關心你嗎……？"
20035-835-170-1 = "……就算不那麼做，\n 我也已經非常關心\n老師了呀……"
20035-835-800-1 = "不把每天的工作\n做好的話……"
20035-835-810-1 = "聽說就不能做好夢……"
20035-835-820-1 = "行程表已經確認過了……？\n那，我就來為你導覽吧。"
20035-835-830-1 = "唔嗯……不要那樣\n搖我，老師……"
20035-835-840-1 = "嗯……？沒有。\n我沒睡。就說我沒睡嘛……"
20035-835-850-1 = "我來為你導覽到\n下一個目的地，老師……"
20035-835-860-1 = "在那之前，先小睡一下……"
20035-835-870-1 = "那個，這裡……請收下吧。\n辛苦你了，老師。呵呵。"
20035-835-880-1 = "老師也很認真修行呢……"
20035-835-890-1 = "我也不能輸。呼嚕……"
