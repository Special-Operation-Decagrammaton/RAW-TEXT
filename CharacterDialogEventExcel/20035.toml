[translation]
20035-835-10-1 = "おかえり、先生……\n百鬼夜行にようこそ……"
20035-835-20-1 = "今日は私が先生を\n案内してあげる。"
20035-835-30-1 = "ガイド春日ツバキ、\n頑張ります。ふぁ……"
20035-835-40-1 = "百鬼夜行は\nどうだった……？\nちゃんと楽しんでる……？"
20035-835-50-1 = "行きたいところがあったら\nいつでも言って……"
20035-835-60-1 = "百鬼夜行なら\n案内できるから……"
20035-835-70-1 = "お祭り……すごかったね？"
20035-835-80-1 = "百鬼夜行にはまた他の\nお祭りもたくさん\nあるよ……待ってるね？"
20035-835-90-1 = "ふえ……\nどうしたの先生？"
20035-835-100-1 = "居眠りしてるように\n見えたから、起こして\nみたって？"
20035-835-110-1 = "んん……くすぐったい……"
20035-835-120-1 = "でも、その程度で私の\n修行を止めることは\nできないよ……"
20035-835-130-1 = "ずっとそうやって\nいたずらしたら……"
20035-835-140-1 = "ベッドで一緒に\n横になっちゃうよ……？"
20035-835-150-1 = "ん……？\nむしろそうしたいの……？"
20035-835-160-1 = "もしかして\n気にしてほしいの……？"
20035-835-170-1 = "……そんなこと\nしなくても、私は\n十分先生のことを\n気にしてるのに……"
20035-835-800-1 = "毎日の日課をちゃんと\nやらないと……"
20035-835-810-1 = "いい夢は\n見られないんだって……"
20035-835-820-1 = "日程表は確認した……？\nじゃあ、私がガイドしてあげる。"
20035-835-830-1 = "うーん…… \nそんなに揺らさないで、先生……"
20035-835-840-1 = "ん……？ いや。\n 寝てない。寝てないってば……"
20035-835-850-1 = "次の目的地に\n案内してあげる、先生……"
20035-835-860-1 = "その前に、少しだけ寝てから……"
20035-835-870-1 = "はい、これ…… 受け取って。\nお疲れ様、先生。 ふふっ。"
20035-835-880-1 = "先生も修行を\n頑張っているんだね……"
20035-835-890-1 = "私も負けられない。ぐぅ……"
