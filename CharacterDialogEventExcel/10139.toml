[translation]
10139-10 = "จะเริ่มปฏิบัติการ\nแกะรอยตำนานเลยนะคะ"
10139-20 = "กำลังรออยู่เลยค่ะ\nคุณครู"
10139-30 = "ฉันจะเริ่มบรีฟเลยนะคะ\nทางนี้ค่ะ"
10139-40 = "ยินดีต้อนรับสู่\nกองบัญชาการปฏิบัติการ\nของกองทหาร FOX ค่ะ"
10139-50 = "พวกคนที่หายตัวไป\nไปอยู่ที่ไหน\nกันนะคะ...?"
10139-60 = "ไม่ได้ทำภารกิจ\nในนามของ SRT\nมานานเลยนะคะ"
10139-70 = "ถ้าการทำแบบนี้\nจะช่วยล้างมลทิน\nของพวกฉันได้ละก็..."
10139-80 = "ฉันจะพยายามเต็มที่เลยค่ะ"
10139-90 = "ปฏิการร่วมกับชาเล่ต์..."
10139-100 = "รู้สึกคาดหวัง\nในหลายๆ แง่เลยนะคะ ฮุฮุ"
10139-110 = "ก่อนเริ่มปฏิบัติการ\nมากินอะไรรองท้อง\nหน่อยมั้ยคะ?"
10139-290 = "อ๊ะ คุณครู"
10139-300 = "ถ้าหากว่าสะดวก\nมาช่วยฉันจัดของหน่อยได้มั้ยคะ?"
10139-310 = "กระสุนที่เหลือ\nจากปฏิบัติการครั้งก่อน..."
10139-320 = "อ๊ะ เชิญค่ะ\nคุณครู"
10139-330 = "มีงานอะไรให้\nฉันช่วยมั้ยคะ?"
10139-340 = "เฮือก?!"
10139-350 = "หะ... หูฉันไวต่อความรู้สึกมาก...\nอย่าจับได้มั้ยคะ..."
10139-360 = "เลือกได้ยอดเยี่ยมมากค่ะ"
10139-370 = "ขอบคุณค่ะ"
10139-380 = "ถ้าจะแลกของ\nก็เรียกฉันได้ตลอดเลยค่ะ"
10139-390 = "การสนับสนุนจากชาเล่ต์\nเป็นประโยชน์เสมอเลยนะคะ"
