[translation]
10139-857-10-1 = "จะเริ่มปฏิบัติการ\nแกะรอยตำนาน\nนับตั้งแต่นี้ค่ะ"
10139-857-20-1 = "กำลังรออยู่เลยค่ะ\nคุณครู"
10139-857-30-1 = "ฉันจะเริ่มบรีฟเลยนะคะ\nทางนี้ค่ะ"
10139-857-40-1 = "ยินดีต้อนรับสู่\nกองบัญชาการปฏิบัติการ\nของกองทหาร FOX ค่ะ"
10139-857-50-1 = "พวกคนที่หายตัวไป\nไปอยู่ที่ไหน\nกันนะคะ...?"
10139-857-60-1 = "ไม่ได้ทำภารกิจ\nในนามของ SRT\nมานานเลยนะคะ"
10139-857-70-1 = "ถ้าการทำแบบนี้\nจะช่วยล้างมลทิน\nของพวกฉันได้ละก็..."
10139-857-80-1 = "ฉันจะพยายามเต็มที่เลยค่ะ"
10139-857-90-1 = "ปฏิการร่วมกับชาเล่ต์..."
10139-857-100-1 = "รู้สึกคาดหวัง\nในหลายๆ แง่เลยนะคะ ฮุฮุ"
10139-857-110-1 = "ก่อนเริ่มปฏิบัติการ\nมากินอะไรรองท้อง\nหน่อยมั้ยคะ?"
10139-857-290-1 = "อ๊ะ คุณครู"
10139-857-300-1 = "ถ้าหากว่าสะดวก\nมาช่วยฉันจัดของหน่อยได้มั้ยคะ?"
10139-857-310-1 = "กระสุนที่เหลือ\nจากปฏิบัติการครั้งก่อน..."
10139-857-320-1 = "อ๊ะ เชิญค่ะ\nคุณครู"
10139-857-330-1 = "มีงานอะไรให้\nฉันช่วยมั้ยคะ?"
10139-857-340-1 = "เฮือก?!"
10139-857-350-1 = "หะ... หูฉันไวต่อความรู้สึกมาก...\nอย่าจับได้มั้ยคะ..."
10139-857-360-1 = "เลือกได้ยอดเยี่ยมมากค่ะ"
10139-857-370-1 = "ขอบคุณค่ะ"
10139-857-380-1 = "ถ้าจะแลกของ\nก็เรียกฉันได้ตลอดเลยค่ะ"
10139-857-390-1 = "การสนับสนุนจากชาเล่ต์\nเป็นประโยชน์เสมอเลยนะคะ"
