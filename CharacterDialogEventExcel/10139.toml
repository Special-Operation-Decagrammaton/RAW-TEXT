[translation]
10139-857-10-1 = "지금부터\n로어 추적 작전을\n시작하겠습니다."
10139-857-20-1 = "기다리고 있었습니다,\n선생님."
10139-857-30-1 = "바로 브리핑을\n시작하겠습니다.\n이쪽으로."
10139-857-40-1 = "FOX 소대의\n작전 본부에\n어서오세요."
10139-857-50-1 = "사라진 사람들은\n어디로\n가버린 걸까요……?"
10139-857-60-1 = "SRT의 이름으로\n임무를 수행하는 것도\n정말 오랜만이네요."
10139-857-70-1 = "이렇게라도\n저희의 오명을\n씻어낼 수 있다면……"
10139-857-80-1 = "최선을 다하겠습니다."
10139-857-90-1 = "샬레와의 합동 작전……"
10139-857-100-1 = "여러모로\n기대가 되네요, 후훗."
10139-857-110-1 = "작전 시작 전에\n간단하게 요기라도\n어떠신가요?"
10139-857-290-1 = "아, 선생님."
10139-857-300-1 = "혹시 괜찮으시면,\n물자 정리를 도와주시겠어요?"
10139-857-310-1 = "지난 작전에서 쓰고\n남은 탄약이……"
10139-857-320-1 = "아, 어서 오세요.\n선생님."
10139-857-330-1 = "뭔가 제가 도울 일이\n있을까요?"
10139-857-340-1 = "으햑?!"
10139-857-350-1 = "귀, 귀는 예민하니까……\n만지지 말아 주세요……"
10139-857-360-1 = "훌륭한 선택이네요."
10139-857-370-1 = "감사합니다."
10139-857-380-1 = "물자의 교환이라면\n언제든지 불러주세요."
10139-857-390-1 = "샬레의 지원은\n언제나 큰 도움이 되네요."
