[translation]
10139-857-10-1 = "Let Mission Lore Pursuit commence!"
10139-857-20-1 = "We've been waiting, Sensei."
10139-857-30-1 = "We're beginning the briefing now. This way!"
10139-857-40-1 = "Welcome to the FOX Squad operation headquarters."
10139-857-50-1 = "Where could the vanished people be?"
10139-857-60-1 = "It's been a while since I have taken on a mission as an SRT member..."
10139-857-70-1 = "If this can help us build our reputation again..."
10139-857-80-1 = "I'll do whatever I can."
10139-857-90-1 = "A joint operation with Schale..."
10139-857-100-1 = "I'm looking forward to this, for more reasons than one. Fufu."
10139-857-110-1 = "Would you like a quick bite before we begin the mission?"
10139-857-290-1 = "Ah, Sensei."
10139-857-300-1 = "If you don't mind, could you help organize these supplies?"
10139-857-310-1 = "Leftover ammo from our last mission..."
10139-857-320-1 = "Ah, welcome, Sensei."
10139-857-330-1 = "Is there anything I can help you with?"
10139-857-340-1 = "E-Eek!"
10139-857-350-1 = "M-My ears are sensitive... So please don't touch them..."
10139-857-360-1 = "An excellent choice."
10139-857-370-1 = "Thank you."
10139-857-380-1 = "Just call me whenever you need to exchange supplies."
10139-857-390-1 = "Schale's support is always a huge help."
