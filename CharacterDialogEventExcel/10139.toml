[translation]
10139-10 = "Let Mission Lore Pursuit commence!"
10139-20 = "We've been waiting, Sensei."
10139-30 = "We're beginning the briefing now. This way!"
10139-40 = "Welcome to the FOX Squad operation headquarters."
10139-50 = "Where could the vanished people be?"
10139-60 = "It's been a while since I have taken on a mission as an SRT member..."
10139-70 = "If this can help us build our reputation again..."
10139-80 = "I'll do whatever I can."
10139-90 = "A joint operation with Schale..."
10139-100 = "I'm looking forward to this, for more reason than one. Fufu."
10139-110 = "Would you like a quick bite before we begin the mission?"
10139-290 = "Ah, Sensei."
10139-300 = "If you don't mind, could you help organize these supplies?"
10139-310 = "Leftover ammo from our last mission..."
10139-320 = "Ah, welcome, Sensei."
10139-330 = "Is there anything I can help you with?"
10139-340 = "E-Eek!"
10139-350 = "M-My ears are sensitive... So please don't touch them..."
10139-360 = "An excellent choice."
10139-370 = "Thank you."
10139-380 = "Just call me whenever you need to exchange supplies."
10139-390 = "Schale's support is always a huge help."
