[translation]
10139-857-10-1 = "即刻起，開始執行\n「怪談追蹤作戰」。"
10139-857-20-1 = "恭候多時了，老師。"
10139-857-30-1 = "簡報即將開始。\n請往這邊。"
10139-857-40-1 = "歡迎來到\nFOX小隊的作戰本部。"
10139-857-50-1 = "消失的人們，\n究竟去了哪裡呢……"
10139-857-60-1 = "以SRT的身分\n接受任務，\n還真是久違了呢。"
10139-857-70-1 = "我會全力以赴的。\n如果這樣……"
10139-857-80-1 = "能夠洗去我們\n所背負的汙名……"
10139-857-90-1 = "與夏萊的聯合作戰……"
10139-857-100-1 = "真令人期待呢。\n呵呵。"
10139-857-110-1 = "老師，作戰前要不要\n先吃一點東西呢？"
10139-857-290-1 = "啊，老師。"
10139-857-300-1 = "如果方便的話，\n能請您幫忙\n整理物資嗎？"
10139-857-310-1 = "上次作戰剩下的彈藥……"
10139-857-320-1 = "啊，老師。您好。"
10139-857-330-1 = "有什麼需要的東西嗎？"
10139-857-340-1 = "呀啊！？"
10139-857-350-1 = "耳，耳朵很敏感的……\n不可以摸……"
10139-857-360-1 = "我認為是個不錯的選擇。"
10139-857-370-1 = "謝謝惠顧。"
10139-857-380-1 = "如果是物資交換的話，\n隨時歡迎。"
10139-857-390-1 = "感謝夏萊\n一直以來的支援。"
