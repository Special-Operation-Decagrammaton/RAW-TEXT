[translation]
10139-10 = "即刻起，開始執行\n「怪談追蹤作戰」。"
10139-20 = "恭候多時了，老師。"
10139-30 = "簡報即將開始。\n請往這邊。"
10139-40 = "歡迎來到\nFOX小隊的作戰本部。"
10139-50 = "消失的人們，\n究竟去了哪裡呢……"
10139-60 = "以SRT的身分\n接受任務，\n還真是久違了呢。"
10139-70 = "我會全力以赴的。\n如果這樣……"
10139-80 = "能夠洗去我們\n所背負的汙名……"
10139-90 = "與夏萊的聯合作戰……"
10139-100 = "真令人期待呢。\n呵呵。"
10139-110 = "老師，作戰前要不要\n先吃一點東西呢？"
10139-290 = "啊，老師。"
10139-300 = "如果方便的話，\n能請您幫忙\n整理物資嗎？"
10139-310 = "上次作戰剩下的彈藥……"
10139-320 = "啊，老師。您好。"
10139-330 = "有什麼需要的東西嗎？"
10139-340 = "呀啊！？"
10139-350 = "耳，耳朵很敏感的……\n不可以摸……"
10139-360 = "我認為是個不錯的選擇。"
10139-370 = "謝謝惠顧。"
10139-380 = "如果是物資交換的話，\n隨時歡迎。"
10139-390 = "感謝夏萊一直以來的支援。"
