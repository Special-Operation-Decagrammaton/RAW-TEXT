[translation]
10139-863-10-1 = "これより、\nロア追跡作戦を\n開始します。"
10139-863-20-1 = "お待ちしていました、\n先生。"
10139-863-30-1 = "すぐにブリーフィングを\n始めます。こちらへ。"
10139-863-40-1 = "ようこそ、\nFOX小隊の作戦本部へ。"
10139-863-50-1 = "消えた方々は、\nどこに行って\nしまったんでしょう……。"
10139-863-60-1 = "SRTとして\n任務を受けるのは、\n久しぶりですね。"
10139-863-70-1 = "全力で臨みます。\nこれで、"
10139-863-80-1 = "私たちの\n汚名をそそぐことが\nできるなら……。"
10139-863-90-1 = "シャーレとの合同作戦……"
10139-863-100-1 = "楽しみですね。\nふふっ。"
10139-863-110-1 = "先生、作戦前に\n腹ごしらえは\nいかがですか？"
10139-863-290-1 = "あっ、先生。"
10139-863-300-1 = "もしよかったら、\n物資の片づけを\n手伝っていただけませんか？"
10139-863-310-1 = "前の作戦で余った弾薬は……。"
10139-863-320-1 = "あ、先生。\nこんにちは。"
10139-863-330-1 = "何か、ご入用のものは\nありますか？"
10139-863-340-1 = "ひゃっ！？"
10139-863-350-1 = "み、耳は敏感で……\n触っちゃ、ダメです……。"
10139-863-360-1 = "良い選択だと思います。"
10139-863-370-1 = "ありがとうございます。"
10139-863-380-1 = "物資の交換でしたら、いつでも。"
10139-863-390-1 = "シャーレの支援……\nいつもありがとうございます。"
