[translation]
10148-860-400-1 = "ให้ตายสิ ฉันเหมือนคนโง่เลย"
10148-860-410-1 = "เรื่องแบบนี้เกิดขึ้น\nได้ยังไงกันคะ? หืม?"
10148-860-420-1 = "ทำไมทุกคนถึงไม่เข้าใจ\nความร้ายแรงของ\nสถานการณ์กันเลยคะ?"
10148-860-430-1 = "อย่างน้อยก็ยังดีที่\nคุณครูอยู่ด้วยกันค่ะ"
10148-860-440-1 = "ทำไมฉันยังต้องอยู่ที่\nแพนเดโมเนียม โซไซตี้..."
10148-860-450-1 = "อ๊ะ คุณครู\nไม่มีอะไรค่ะ"
10148-860-460-1 = "อ่า ให้ตายสิ~!"
10148-860-470-1 = "ทำไมฉันถึง\nเขินอายอยู่คนเดียวล่ะคะ?!"
10148-860-480-1 = "ทุกคนอายุปาเข้าไปเท่าไรแล้ว\nยังมาเล่นเป็นโจรสลัดอะไรกันอีก..."
10148-860-490-1 = "จบลงจนได้สินะคะ..."
10148-860-500-1 = "อ๊ะ ตอนนี้อย่าเพิ่ง\nเข้ามาใกล้นะคะ\nอย่าพูดกับฉันด้วยค่ะ"
10148-860-510-1 = "ตอนปี 1 ฉันคิดว่าทุกคนใน\nแพนเดโมเนียม โซไซตี้\nเป็นนักเรียนดีเด่นกันหมดค่ะ"
10148-860-520-1 = "อยากเคาะหน้าผาก\nตัวฉันในตอนนั้น\nสักทีจริงๆ ค่ะ..."
10148-860-530-1 = "คุณครู"
10148-860-540-1 = "กำลังจะพูดว่า\nมาพยายามด้วยกันเถอะ ใช่มั้ยคะ?"
10148-860-550-1 = "คำนั้นเขียนอยู่บนหน้าหมดแล้วค่ะ"
10148-860-560-1 = "ข้อดีของรุ่นพี่มาโคโตะเหรอคะ?\nเลือกถามตอนนี้จริงๆ เหรอคะ?\nเอาจริงเหรอคะ?"
10148-860-570-1 = "เอ่อ นั่นสินะคะ..."
10148-860-580-1 = "ถ้าปิดปากเอาไว้...\nหน้าตาก็จัดว่าโอเคอยู่ค่ะ"
10148-860-590-1 = "พูดไปก็เหมือนพูดซ้ำ แต่นี่ก็เป็น\nช่วงเวลาที่ได้สัมผัสถึงคุณค่าของ\nคู่สนทนาที่คุยกันรู้เรื่องจริงๆ ค่ะ"
10148-860-600-1 = "ถ้ากลับไปแล้ว ฉันคงต้อง\nทำดีกับจิอากิ\nให้มากกว่านี้หน่อยแล้วค่ะ"
10148-860-920-1 = "เฮ้อ... น่ารำคาญจัง"
10148-860-930-1 = "ขอโทษนะคะ\nพอจะช่วยหน่อยได้มั้ยคะ?"
10148-860-940-1 = "เอาเป็นว่า ถ้าเอาอะไรมาให้\nฉันจะลองแปรรูปดูค่ะ"
10148-860-950-1 = "ทำไมในแพนเดโมเนียม โซไซตี้\nถึงมีแค่ฉันที่ทำเรื่องนี้กันคะ...?"
10148-860-960-1 = "ในที่สุดก็ได้บอกลา\nของเก่าพวกนี้แล้วค่ะ"
10148-860-970-1 = "อ้อ จะเอาส่วนที่เหลือ\nไปทั้งหมดก็ได้นะคะ\nถึงจะไม่รู้ว่าจะเอาไปทำอะไรก็เถอะ"
10148-860-980-1 = "ตั้งใจทำหรือเปล่าคะ...?"
10148-860-990-1 = "เปล่าหรอก ไม่มีอะไรค่ะ"
10148-860-1000-1 = "คุณครู คือว่า..."
10148-860-1010-1 = "ตัว... โดนกันอยู่นะคะ?"
10148-860-1020-1 = "อ่า ขอบคุณนะคะ เพราะได้\nคุณครูช่วยไว้ งานน่ารำคาญ\nเลยลดลงไปหน่อยค่ะ"
10148-860-1030-1 = "โอ้... เอาแบบนี้เหรอ"
10148-860-1040-1 = "ต้องการของแบบนั้นเหรอคะ?\nฮืม..."
10148-860-1050-1 = "อ๊ะ กำลังอยากได้อยู่พอดี\nขอบคุณค่ะ"
