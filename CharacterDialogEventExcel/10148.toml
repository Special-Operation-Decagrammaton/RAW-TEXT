[translation]
10148-400 = "ให้ตายสิ ฉันเหมือนคนโง่เลย"
10148-410 = "เรื่องแบบนี้เกิดขึ้น\nได้ยังไงกันคะ? หืม?"
10148-420 = "ทำไมทุกคนถึงไม่เข้าใจ\nความร้ายแรงของ\nสถานการณ์กันเลยคะ?"
10148-430 = "อย่างน้อยก็ยังดีที่\nคุณครูอยู่ด้วยกันค่ะ"
10148-440 = "ทำไมฉันยังต้องอยู่ที่\nแพนเดโมเนียม โซไซตี้..."
10148-450 = "อ๊ะ คุณครู\nไม่มีอะไรค่ะ"
10148-460 = "อ่า ให้ตายสิ~!"
10148-470 = "ทำไมฉันถึง\nเขินอายอยู่คนเดียวล่ะคะ?!"
10148-480 = "ทุกคนอายุปาเข้าไปเท่าไรแล้ว\nยังมาเล่นเป็นโจรสลัดอะไรกันอีก..."
10148-490 = "จบลงจนได้สินะคะ..."
10148-500 = "อ๊ะ ตอนนี้อย่าเพิ่ง\nเข้ามาใกล้นะคะ\nอย่าพูดกับฉันด้วยค่ะ"
10148-510 = "ตอนปี 1 ฉันคิดว่าทุกคนใน\nแพนเดโมเนียม โซไซตี้\nเป็นนักเรียนดีเด่นกันหมดค่ะ"
10148-520 = "อยากเคาะหน้าผาก\nตัวฉันในตอนนั้น\nสักทีจริงๆ ค่ะ..."
10148-530 = "คุณครู"
10148-540 = "กำลังจะพูดว่า\nมาพยายามด้วยกันเถอะ ใช่มั้ยคะ?"
10148-550 = "คำนั้นเขียนอยู่บนหน้าหมดแล้วค่ะ"
10148-560 = "ข้อดีของรุ่นพี่มาโคโตะเหรอคะ?\nเลือกถามตอนนี้จริงๆ เหรอคะ?\nเอาจริงเหรอคะ?"
10148-570 = "เอ่อ นั่นสินะคะ..."
10148-580 = "ถ้าปิดปากเอาไว้...\nหน้าตาก็จัดว่าโอเคอยู่ค่ะ"
10148-590 = "พูดไปก็เหมือนพูดซ้ำ แต่นี่ก็เป็น\nช่วงเวลาที่ได้สัมผัสถึงคุณค่าของ\nคู่สนทนาที่คุยกันรู้เรื่องจริงๆ ค่ะ"
10148-600 = "ถ้ากลับไปแล้ว ฉันคงต้อง\nทำดีกับจิอากิ\nให้มากกว่านี้หน่อยแล้วค่ะ"
10148-920 = "เฮ้อ... น่ารำคาญจัง"
10148-930 = "ขอโทษนะคะ\nพอจะช่วยหน่อยได้มั้ยคะ?"
10148-940 = "เอาเป็นว่า ถ้าเอาอะไรมาให้\nฉันจะลองแปรรูปดูค่ะ"
10148-950 = "ทำไมในแพนเดโมเนียม โซไซตี้\nถึงมีแค่ฉันที่ทำเรื่องนี้กันคะ...?"
10148-960 = "ในที่สุดก็ได้บอกลา\nของเก่าพวกนี้แล้วค่ะ"
10148-970 = "อ้อ จะเอาส่วนที่เหลือ\nไปทั้งหมดก็ได้นะคะ\nถึงจะไม่รู้ว่าจะเอาไปทำอะไรก็เถอะ"
10148-980 = "ตั้งใจทำหรือเปล่าคะ...?"
10148-990 = "เปล่าหรอก ไม่มีอะไรค่ะ"
10148-1000 = "คุณครู คือว่า..."
10148-1010 = "ตัว... โดนกันอยู่นะคะ?"
10148-1020 = "อ่า ขอบคุณนะคะ เพราะได้\nคุณครูช่วยไว้ งานน่ารำคาญ\nเลยลดลงไปหน่อยค่ะ"
10148-1030 = "โอ้... เอาแบบนี้เหรอ"
10148-1040 = "ต้องการของแบบนั้นเหรอคะ?\nฮืม..."
10148-1050 = "อ๊ะ กำลังอยากได้อยู่พอดี\nขอบคุณค่ะ"
