[translation]
10148-400 = "ほんっとうに、もう……。"
10148-410 = "なにをどうすれば\nこんなことに？"
10148-420 = "どうして誰も事の深刻さが\n分からないんでしょうか？"
10148-430 = "はぁ……先生がいてくれて\n助かりました。"
10148-440 = "なぜ……どうして私は、\nまだ万魔殿に……。"
10148-450 = "あ、先生。\nいえ、何でもありません。\nお気になさらず。"
10148-460 = "まったく、\nなんなんですか！"
10148-470 = "どうして私だけ\n恥ずかしい思いを！？"
10148-480 = "海賊ごっこって……\n自分の年齢考えて\nくださいよ……。"
10148-490 = "……片づきましたね。"
10148-500 = "今は放って\nおいてください。"
10148-510 = "万魔殿は\n優等生の集まりだ、\nと1年生の頃は\n思っていました。"
10148-520 = "……あの時の自分の目を\n覚まさせたいです。"
10148-530 = "先生。"
10148-540 = "「みんなで頑張ろう」\nとか言おうとしてます？"
10148-550 = "顔に書いてありますよ。"
10148-560 = "マコト先輩の長所？\nそれ、本気で聞いてます？"
10148-570 = "ん～～～～～……。"
10148-580 = "顔は、悪くはないです。\n……黙っていれば。"
10148-590 = "話が通じることがこうも\nありがたいとは……。"
10148-600 = "チアキにはもう少し\n優しくしてあげますかね。"
10148-920 = "はぁ……サボりたい……。"
10148-930 = "よければ、\n手を貸してもらえませんか？"
10148-940 = "とりあえず、\n持ってきてもらえれば、\n私がどうにかします。"
10148-950 = "というか、\nどうして私以外でき\nないんでしょうか……。"
10148-960 = "もうこの古物ともお別れですね。"
10148-970 = "残りは全部\n持っていってください。\nどこで使うか\n知りませんけど。"
10148-980 = "……わざとですか？"
10148-990 = "いえ、何でもないです。"
10148-1000 = "あの、先生……。"
10148-1010 = "当たってます……。"
10148-1020 = "ありがとうございます。\nおかげで面倒ごとが\n一つ減りました。"
10148-1030 = "ああ……これをこうです。"
10148-1040 = "そういうのが必要なんですか？\nへぇ……。"
10148-1050 = "ちょうど欲しかったので。\nありがとうございます。"
