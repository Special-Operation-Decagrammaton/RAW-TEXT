[translation]
10148-860-400-1 = "진짜, 바보 같아."
10148-860-410-1 = "어떻게 이런 일이\n일어날 수가 있죠? 네?"
10148-860-420-1 = "왜 다들 상황의 심각성을\n모르는 거죠?"
10148-860-430-1 = "그나마 선생님이\n같이 계셔서 다행이네요."
10148-860-440-1 = "왜 나는 아직도\n만마전에……."
10148-860-450-1 = "아, 선생님.\n아무것도 아니에요."
10148-860-460-1 = "아아, 진짜~!"
10148-860-470-1 = "왜 부끄러움은\n저 혼자만의 몫인 거죠?!"
10148-860-480-1 = "다들 도대체 몇 살인데\n해적 놀이 같은 걸……."
10148-860-490-1 = "……마무리되었네요."
10148-860-500-1 = "아, 지금\n가까이 오지 마세요.\n말 걸지 마세요."
10148-860-510-1 = "1학년 때, 만마전은\n당연히 다들 우등생이라\n생각했어요."
10148-860-520-1 = "……그때의 저에게\n꿀밤 한 대\n먹이고 싶네요."
10148-860-530-1 = "선생님."
10148-860-540-1 = "다같이 힘내자,\n같은 소리 하려고 했죠?"
10148-860-550-1 = "얼굴에 다 보이거든요."
10148-860-560-1 = "마코토 선배의 장점이요?\n그걸 지금 물어본다고요?\n진심으로요?"
10148-860-570-1 = "어, 글쎄요…………."
10148-860-580-1 = "……입만 다물고 있으면,\n얼굴은 괜찮은 편이죠."
10148-860-590-1 = "새삼스럽지만,\n대화가 통하는 상대의\n소중함을 체감하는\n시간이네요."
10148-860-600-1 = "돌아가면, 치아키한테\n아주 조금은 더\n잘해줘야겠어요."
10148-860-920-1 = "하아…… 귀찮다."
10148-860-930-1 = "죄송한데,\n혹시 좀 도와주시겠어요?"
10148-860-940-1 = "일단, 아무거나 갖다 주시면\n제가 가공해 볼게요."
10148-860-950-1 = "……왜 만마전에는\n이걸 하는 사람이\n저밖에 없죠?"
10148-860-960-1 = "이제 이 고물들이랑도\n작별이네요."
10148-860-970-1 = "아, 남은 건\n전부 가져가셔도 돼요.\n어디 쓰실지 모르겠지만."
10148-860-980-1 = "……일부로인가요?"
10148-860-990-1 = "아니, 아무것도 아니에요."
10148-860-1000-1 = "선생님, 그……."
10148-860-1010-1 = "몸, 닿고 있거든요?"
10148-860-1020-1 = "아, 감사합니다.\n덕분에 귀찮은 일이\n좀 줄었네요."
10148-860-1030-1 = "오…… 이걸 이렇게."
10148-860-1040-1 = "그런 게 필요하신가요?\n흐응……."
10148-860-1050-1 = "아, 마침 필요했는데,\n감사합니다."
