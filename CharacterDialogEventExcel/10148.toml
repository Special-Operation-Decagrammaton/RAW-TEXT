[translation]
10148-860-400-1 = "真的是受不了……"
10148-860-410-1 = "到底要怎麼做\n才會變成這樣？"
10148-860-420-1 = "為什麼沒有人明白\n事情的嚴重性呢？"
10148-860-430-1 = "唉……幸好有老師在，\n真是幫了大忙。"
10148-860-440-1 = "為什麼……我怎麼會\n還待在萬魔殿……"
10148-860-450-1 = "啊，老師。\n不，沒什麼事。\n請別放在心上。"
10148-860-460-1 = "真是的，\n到底是怎樣啊！"
10148-860-470-1 = "為什麼只有我\n要感到這麼羞恥啊！？"
10148-860-480-1 = "說什麼海盜遊戲……\n請考慮一下自己的\n年紀好不好……"
10148-860-490-1 = "……總算收拾好了呢。"
10148-860-500-1 = "現在請讓我靜一靜。"
10148-860-510-1 = "萬魔殿是\n優等生的集合體──\n一年級的時候，\n我是這麼認為的。"
10148-860-520-1 = "……真想讓當時自己\n的眼睛看清楚一點。"
10148-860-530-1 = "老師。"
10148-860-540-1 = "你是不是想說\n「大家一起加油」\n之類的話？"
10148-860-550-1 = "都寫在你臉上囉。"
10148-860-560-1 = "真琴前輩的優點？\n你是認真在問嗎？"
10148-860-570-1 = "唔～～～～～"
10148-860-580-1 = "長相，還算不錯。\n……如果閉上嘴的話。"
10148-860-590-1 = "沒想到話能說得通\n居然這麼令人感激……"
10148-860-600-1 = "我看還是對千秋\n稍微溫柔一點好了。"
10148-860-920-1 = "唉……好想偷懶……"
10148-860-930-1 = "方便的話，\n可以幫我一下嗎？"
10148-860-940-1 = "總之，只要幫忙拿過來，\n我會想辦法處理的。"
10148-860-950-1 = "話說回來，\n為什麼除了我以外\n就沒人會做呢……"
10148-860-960-1 = "也該和這些古董\n說再見了呢。"
10148-860-970-1 = "剩下的全部\n請你帶走吧。\n雖然我不知道\n你要用在哪。"
10148-860-980-1 = "……你是故意的嗎？"
10148-860-990-1 = "不，沒什麼。"
10148-860-1000-1 = "那個，老師……"
10148-860-1010-1 = "碰到我了……"
10148-860-1020-1 = "謝謝。多虧有你，\n麻煩事又少了一件。"
10148-860-1030-1 = "啊啊……這個是這樣用的。"
10148-860-1040-1 = "你需要那種東西嗎？\n嘿……"
10148-860-1050-1 = "我正好想要這個。\n謝謝你。"
