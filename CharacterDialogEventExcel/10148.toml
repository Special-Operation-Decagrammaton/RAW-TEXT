[translation]
10148-400 = "진짜, 바보 같아."
10148-410 = "어떻게 이런 일이\n일어날 수가 있죠? 네?"
10148-420 = "왜 다들 상황의 심각성을\n모르는 거죠?"
10148-430 = "그나마 선생님이\n같이 계셔서 다행이네요."
10148-440 = "왜 나는 아직도\n만마전에……."
10148-450 = "아, 선생님.\n아무것도 아니에요."
10148-460 = "아아, 진짜~!"
10148-470 = "왜 부끄러움은\n저 혼자만의 몫인 거죠?!"
10148-480 = "다들 도대체 몇 살인데\n해적 놀이 같은 걸……."
10148-490 = "……마무리되었네요."
10148-500 = "아, 지금\n가까이 오지 마세요.\n말 걸지 마세요."
10148-510 = "1학년 때, 만마전은\n당연히 다들 우등생이라\n생각했어요."
10148-520 = "……그때의 저에게\n꿀밤 한 대\n먹이고 싶네요."
10148-530 = "선생님."
10148-540 = "다같이 힘내자,\n같은 소리 하려고 했죠?"
10148-550 = "얼굴에 다 보이거든요."
10148-560 = "마코토 선배의 장점이요?\n그걸 지금 물어본다고요?\n진심으로요?"
10148-570 = "어, 글쎄요…………."
10148-580 = "……입만 다물고 있으면,\n얼굴은 괜찮은 편이죠."
10148-590 = "새삼스럽지만,\n대화가 통하는 상대의\n소중함을 체감하는\n시간이네요."
10148-600 = "돌아가면, 치아키한테\n아주 조금은 더\n잘해줘야겠어요."
10148-920 = "하아…… 귀찮다."
10148-930 = "죄송한데,\n혹시 좀 도와주시겠어요?"
10148-940 = "일단, 아무거나 갖다 주시면\n제가 가공해 볼게요."
10148-950 = "……왜 만마전에는\n이걸 하는 사람이\n저밖에 없죠?"
10148-960 = "이제 이 고물들이랑도\n작별이네요."
10148-970 = "아, 남은 건\n전부 가져가셔도 돼요.\n어디 쓰실지 모르겠지만."
10148-980 = "……일부로인가요?"
10148-990 = "아니, 아무것도 아니에요."
10148-1000 = "선생님, 그……."
10148-1010 = "몸, 닿고 있거든요?"
10148-1020 = "아, 감사합니다.\n덕분에 귀찮은 일이\n좀 줄었네요."
10148-1030 = "오…… 이걸 이렇게."
10148-1040 = "그런 게 필요하신가요?\n흐응……."
10148-1050 = "아, 마침 필요했는데,\n감사합니다."
