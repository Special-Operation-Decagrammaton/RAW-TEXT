[translation]
10148-860-400-1 = "ほんっとうに、もう……。"
10148-860-410-1 = "なにをどうすれば\nこんなことに？"
10148-860-420-1 = "どうして誰も事の深刻さが\n分からないんでしょうか？"
10148-860-430-1 = "はぁ……先生がいてくれて\n助かりました。"
10148-860-440-1 = "なぜ……どうして私は、\nまだ万魔殿に……。"
10148-860-450-1 = "あ、先生。\nいえ、何でもありません。\nお気になさらず。"
10148-860-460-1 = "まったく、\nなんなんですか！"
10148-860-470-1 = "どうして私だけ\n恥ずかしい思いを！？"
10148-860-480-1 = "海賊ごっこって……\n自分の年齢考えて\nくださいよ……。"
10148-860-490-1 = "……片づきましたね。"
10148-860-500-1 = "今は放って\nおいてください。"
10148-860-510-1 = "万魔殿は\n優等生の集まりだ、\nと1年生の頃は\n思っていました。"
10148-860-520-1 = "……あの時の自分の目を\n覚まさせたいです。"
10148-860-530-1 = "先生。"
10148-860-540-1 = "「みんなで頑張ろう」\nとか言おうとしてます？"
10148-860-550-1 = "顔に書いてありますよ。"
10148-860-560-1 = "マコト先輩の長所？\nそれ、本気で聞いてます？"
10148-860-570-1 = "ん～～～～～……。"
10148-860-580-1 = "顔は、悪くはないです。\n……黙っていれば。"
10148-860-590-1 = "話が通じることがこうも\nありがたいとは……。"
10148-860-600-1 = "チアキにはもう少し\n優しくしてあげますかね。"
10148-860-920-1 = "はぁ……サボりたい……。"
10148-860-930-1 = "よければ、\n手を貸してもらえませんか？"
10148-860-940-1 = "とりあえず、\n持ってきてもらえれば、\n私がどうにかします。"
10148-860-950-1 = "というか、\nどうして私以外でき\nないんでしょうか……。"
10148-860-960-1 = "もうこの古物ともお別れですね。"
10148-860-970-1 = "残りは全部\n持っていってください。\nどこで使うか\n知りませんけど。"
10148-860-980-1 = "……わざとですか？"
10148-860-990-1 = "いえ、何でもないです。"
10148-860-1000-1 = "あの、先生……。"
10148-860-1010-1 = "当たってます……。"
10148-860-1020-1 = "ありがとうございます。\nおかげで面倒ごとが\n一つ減りました。"
10148-860-1030-1 = "ああ……これをこうです。"
10148-860-1040-1 = "そういうのが必要なんですか？\nへぇ……。"
10148-860-1050-1 = "ちょうど欲しかったので。\nありがとうございます。"
