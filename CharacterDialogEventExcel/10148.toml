[translation]
10148-400 = "真的是受不了……"
10148-410 = "到底要怎麼做\n才會變成這樣？"
10148-420 = "為什麼沒有人明白\n事情的嚴重性呢？"
10148-430 = "唉……幸好有老師在，\n真是幫了大忙。"
10148-440 = "為什麼……我怎麼會\n還待在萬魔殿……"
10148-450 = "啊，老師。\n不，沒什麼事。\n請別放在心上。"
10148-460 = "真是的，\n到底是怎樣啊！"
10148-470 = "為什麼只有我\n要感到這麼羞恥啊！？"
10148-480 = "說什麼海盜遊戲……\n請考慮一下自己的\n年紀好不好……"
10148-490 = "……總算收拾好了呢。"
10148-500 = "現在請讓我靜一靜。"
10148-510 = "萬魔殿是\n優等生的集合體──\n一年級的時候，\n我是這麼認為的。"
10148-520 = "……真想讓當時自己\n的眼睛看清楚一點。"
10148-530 = "老師。"
10148-540 = "你是不是想說\n「大家一起加油」\n之類的話？"
10148-550 = "都寫在你臉上囉。"
10148-560 = "真琴前輩的優點？\n你是認真在問嗎？"
10148-570 = "唔～～～～～"
10148-580 = "長相，還算不錯。\n……如果閉上嘴的話。"
10148-590 = "沒想到話能說得通\n居然這麼令人感激……"
10148-600 = "我看還是對千秋\n稍微溫柔一點好了。"
10148-920 = "唉……好想偷懶……"
10148-930 = "方便的話，\n可以幫我一下嗎？"
10148-940 = "總之，只要幫忙拿過來，\n我會想辦法處理的。"
10148-950 = "話說回來，\n為什麼除了我以外\n就沒人會做呢……"
10148-960 = "也該和這些古董\n說再見了呢。"
10148-970 = "剩下的全部\n請你帶走吧。\n雖然我不知道\n你要用在哪。"
10148-980 = "……你是故意的嗎？"
10148-990 = "不，沒什麼。"
10148-1000 = "那個，老師……"
10148-1010 = "碰到我了……"
10148-1020 = "謝謝。多虧有你，\n麻煩事又少了一件。"
10148-1030 = "啊啊……這個是這樣用的。"
10148-1040 = "你需要那種東西嗎？\n嘿……"
10148-1050 = "我正好想要這個。\n謝謝你。"
