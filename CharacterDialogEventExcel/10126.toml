[translation]
10126-849-160-1 = "오컬연에 온 걸\n환영해…… 선생."
10126-849-170-1 = "……학원의 비밀이,\n기다리고 있어."
10126-849-180-1 = "잠들어 있는 비밀들이……\n잔뜩 있다구?"
10126-849-190-1 = "경고. 경고.\n이벤트가 끝나갑니다."
10126-849-200-1 = "……라네."
10126-849-210-1 = "수고했어 선생."
10126-849-220-1 = "이 추억은……\n다음 생에도 간직할 거야.\n히힛."
10126-849-230-1 = "선생의 손은……\n따뜻하네."
10126-849-240-1 = "응? 그쪽의 까마귀?\n난 모르는 아이야……"
10126-849-250-1 = "내가……\n좋아?"
10126-849-260-1 = "제대로 말해달라구.\n히히……."
10126-849-270-1 = "마음껏 쓰다듬어도 돼……\n전생에서처럼."
10126-849-400-1 = "선생을 위해서……\n학원의 비밀을 정리했어."
10126-849-410-1 = "자……\n함께 학원의 비밀을\n파헤쳐보자."
10126-849-420-1 = "이 비밀을\n풀어낼 줄이야……"
10126-849-430-1 = "역시 선생."
10126-849-440-1 = "고생했어……\n모두가 기뻐할 거야.\n히히."
10126-849-450-1 = "와일드헌트에는……\n아직 알려지지 않은\n비밀이 잔뜩 있다구."
10126-849-460-1 = "내가……\n좋은 거구나……?"
10126-849-470-1 = "정말 기뻐……\n이히힛!"
