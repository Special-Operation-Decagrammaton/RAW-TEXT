[translation]
10126-10849-160-1 = "オカ研に\nようこそぉ……先生。"
10126-10849-170-1 = "……学院の秘密が、\n待ってるよ。"
10126-10849-180-1 = "眠っている秘密が……\nたくさんあるんだよ？"
10126-10849-190-1 = "ケイコク、ケイコク！\nマモナクイベントガ\n終了シマス！"
10126-10849-200-1 = "……だってさぁ。"
10126-10849-210-1 = "お疲れ様、先生。"
10126-10849-220-1 = "この思い出は……\n来世まで持ってくよぉ。\nイヒッ。"
10126-10849-230-1 = "先生の手……\nあったかい。"
10126-10849-240-1 = "そのカラス……\n知らない子だねぇ。"
10126-10849-250-1 = "私のこと、\n好きぃ？"
10126-10849-260-1 = "ちゃんと……\n言葉にして？\nイヒッ……。"
10126-10849-270-1 = "好きなだけ撫でなよ……\n前世みたいにさ。"
10126-10849-400-1 = "先生のために……\n学院の秘密をまとめたよぉ。"
10126-10849-410-1 = "さ……一緒に解き明かそうかぁ。"
10126-10849-420-1 = "この秘密を\n解けるなんて……"
10126-10849-430-1 = "先生はすごいねぇ。"
10126-10849-440-1 = "お疲れ様ぁ……\nみんなも喜ぶよぉ。\nイヒッ。"
10126-10849-450-1 = "ワイルドハントには……\nまだ知られざる秘密が\nいっぱいあるよぉ。"
10126-10849-460-1 = "私のこと、\n好きなんだ……？"
10126-10849-470-1 = "嬉しい……\nイヒヒッ！"
