[translation]
10126-849-160-1 = "ยินดีต้อนรับสู่\nชมรมวิจัยรหัสยศาสตร์นะ... ครู"
10126-849-170-1 = "ความลับของสถาบัน...\nกำลังรออยู่..."
10126-849-180-1 = "ความลับที่ยังคงหลับใหลอยู่...\nมีเยอะมากเลยนะ"
10126-849-190-1 = "คำเตือน คำเตือน\nกิจกรรมใกล้จะจบลงแล้วค่ะ"
10126-849-200-1 = "เขาว่างั้นน่ะ..."
10126-849-210-1 = "เหนื่อยหน่อยนะ ครู"
10126-849-220-1 = "ฉันจะรักษาความทรงจำนี้ไว้...\nไปจนถึงชาติหน้าเลย ฮิฮิ"
10126-849-230-1 = "มือของคุณครู...\nอบอุ่นจัง"
10126-849-240-1 = "หืม? อีกาตรงนั้นน่ะเหรอ?\nฉันไม่รู้จักเด็กคนนั้นหรอก..."
10126-849-250-1 = "ชอบ...\nฉันเหรอ?"
10126-849-260-1 = "พูดมาให้ชัดๆ หน่อยสิ\nฮิฮิ..."
10126-849-270-1 = "ลูบได้ตามที่ต้องการเลย...\nเหมือนในชาติก่อนไง"
10126-849-400-1 = "ฉันจัดการความลับของสถาบัน\nเพื่อครูแล้วละ..."
10126-849-410-1 = "เอาละ... มาวิเคราะห์เจาะลึก\nความลับของสถาบันกันเถอะ"
10126-849-420-1 = "ไม่คิดเลยว่า\nจะไขความลับนี้ได้"
10126-849-430-1 = "ต้องอย่างนี้สิ ครู"
10126-849-440-1 = "ทำได้ดีมากเลย...\nทุกคนจะต้องดีใจแน่ๆ ฮิฮิ"
10126-849-450-1 = "ที่ไวลด์ฮันต์น่ะ... ยังมีความลับ\nอีกมากมายที่ยังไม่ถูกเปิดเผยอยู่"
10126-849-460-1 = "ชอบฉัน...\nสินะ...?"
10126-849-470-1 = "ดีใจจัง...\nฮิฮิฮิ"
