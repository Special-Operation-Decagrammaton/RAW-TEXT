[translation]
10126-849-160-1 = "歡迎來到\n神秘研……老師。"
10126-849-170-1 = "……學院的祕密，\n正在等著你哦。"
10126-849-180-1 = "沉睡的祕密……\n有很多唷？"
10126-849-190-1 = "警告，警告！\n活動即將結束！"
10126-849-200-1 = "……就是這樣。"
10126-849-210-1 = "辛苦了，老師。"
10126-849-220-1 = "這段回憶……\n我會帶到來世去的。\n咿嘻。"
10126-849-230-1 = "老師的手……\n好溫暖。"
10126-849-240-1 = "那隻烏鴉……\n是不認識的孩子呢。"
10126-849-250-1 = "你喜歡我嗎？"
10126-849-260-1 = "要好好……\n說出口哦？\n咿嘻……"
10126-849-270-1 = "想怎麼撫摸都可以……\n就像前世一樣。"
10126-849-400-1 = "為了老師……\n我整理了學院的祕密唷。"
10126-849-410-1 = "來……跟我一起解開吧。"
10126-849-420-1 = "居然能解開\n這個祕密……"
10126-849-430-1 = "老師真厲害呢。"
10126-849-440-1 = "辛苦了……\n大家也會很高興的。\n咿嘻。"
10126-849-450-1 = "在狂獵之中……\n還有許多不為人知的\n祕密唷。"
10126-849-460-1 = "你喜歡我嗎……？"
10126-849-470-1 = "好開心……咿嘻嘻！"
