[translation]
16020-857-200-1 = "作戰終於要開始了啊……"
16020-857-210-1 = "打起精神來吧～！"
16020-857-220-1 = "我等你很久了哦。\n畢竟老師不在的話\n就沒辦法開始嘛。"
16020-857-230-1 = "「怪談追蹤作戰」啊……"
16020-857-240-1 = "話說回來，\n怪談是能用眼睛\n追蹤的嗎？"
16020-857-250-1 = "嗯？怎麼了嗎？"
16020-857-260-1 = "仁子做的豆皮壽司\n真是極品呢。\n不管什麼時候吃都好吃。"
16020-857-270-1 = "雪乃他……\n還好嗎……"
16020-857-280-1 = "好像還有點放不下\n之前的事的樣子呢。"
16020-857-490-1 = "啊，老師。\n來得正好。"
16020-857-500-1 = "我想請教你一些\n跟事件有關的事。"
16020-857-510-1 = "啊，可以打擾一下嗎……"
16020-857-520-1 = "我有幾件事想拜託你。"
16020-857-530-1 = "嗯？一直盯著我的頭髮，\n怎麼了嗎？"
16020-857-540-1 = "有什麼在意的地方嗎？"
16020-857-550-1 = "啊啊……\n因為在狹窄的地方，\n頭髮要是被勾到\n就麻煩了嘛。"
16020-857-560-1 = "所以才會像這樣綁起來。"
16020-857-570-1 = "乾脆剪掉好了～\n是有這麼想過啦……"
16020-857-580-1 = "不過難得留這麼長了，\n要剪掉也有點捨不得。"
16020-857-590-1 = "唔哇！\n別戳我啦！？"
16020-857-600-1 = "……我不太習慣呢。\n像這樣有人站在身後。"
16020-857-610-1 = "嘿……\n原來如此啊。"
16020-857-620-1 = "確實，有成為\n傳聞的理由呢。"
16020-857-630-1 = "已經結束了嗎？\n……真快呢。\n好厲害啊。"
16020-857-640-1 = "叫你「指揮官」\n會不會比較好呢？"
