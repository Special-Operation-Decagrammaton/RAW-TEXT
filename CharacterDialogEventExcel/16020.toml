[translation]
16020-857-200-1 = "ในที่สุดปฏิบัติการ\nก็เริ่มแล้วสินะ..."
16020-857-210-1 = "ความรู้สึกตื่นเต้น\nพุ่งพล่านขึ้นมาเลย~"
16020-857-220-1 = "ฉันกำลังรออยู่เลย\nถ้าไม่มีคุณครู\nก็เริ่มปฏิบัติการไม่ได้นี่นา"
16020-857-230-1 = "<ปฏิบัติการแกะรอยตำนาน>\nงั้นเหรอ..."
16020-857-240-1 = "ตำนานเป็นสิ่งที่\nเราไปตามแกะรอย\nได้จริงๆ เหรอ?"
16020-857-250-1 = "หืม? เรียกฉันเหรอ?"
16020-857-260-1 = "ซูชิเต้าหู้หวานฝีมือนิโกะ\nไม่ว่าจะกินตอนไหน\nก็อร่อยเหาะตลอดเลย"
16020-857-270-1 = "เป็นห่วง\nยูกิโนะจัง..."
16020-857-280-1 = "จะยังกังวลเรื่องงาน\nที่ผ่านมาหรือเปล่านะ"
16020-857-490-1 = "อ๊ะ คุณครู\nมาได้จังหวะพอดีเลย"
16020-857-500-1 = "ฉันมีลิสต์เรื่องราวที่อยากถาม\nอยู่เพียบเลยละ"
16020-857-510-1 = "อ๊ะ พอจะมีเวลาสักครู่มั้ย?"
16020-857-520-1 = "ฉันมีเรื่องอยากขอให้ช่วย\n2-3 เรื่องน่ะ"
16020-857-530-1 = "หืม? ทำไมถึงจ้อง\nผมของฉันขนาดนั้นล่ะ?"
16020-857-540-1 = "มีอะไร\nให้ต้องใส่ใจงั้นเหรอ?"
16020-857-550-1 = "อ๋อ เวลาอยู่ในที่แคบๆ\nเส้นผมอาจจะไปเกี่ยวนู่นนี่ได้น่ะ"
16020-857-560-1 = "ฉันก็เลยถักผมเองทุกวัน"
16020-857-570-1 = "ถึงจะเคยคิดว่ามันน่ารำคาญ\nจนอยากตัดทิ้งเลยก็เถอะ..."
16020-857-580-1 = "แต่พอไว้ยาวถึงขนาดนี้แล้ว\nมันก็รู้สึกเสียดายน่ะ"
16020-857-590-1 = "ฮะ... เฮือก?!\nอย่ามาจิ้มกันได้มั้ย?"
16020-857-600-1 = "ฉันไม่ชอบที่จู่ๆ ก็ถูก\nซุ่มโจมตีจากข้างหลังน่ะ"
16020-857-610-1 = "โอ้... อย่างนี้นี่เอง"
16020-857-620-1 = "ที่เล่าลือกันให้แซ่ด\nก็มีเหตุผลจริงๆ สินะ"
16020-857-630-1 = "เสร็จแล้วเหรอ?\nว้าว... ไวจังเลย"
16020-857-640-1 = "ถ้าฝีมือขนาดนี้\nเรียกว่า 'ผู้บัญชาการ'\nน่าจะเหมาะกว่านะ?"
