[translation]
16020-863-200-1 = "ついに作戦開始かぁ……。"
16020-863-210-1 = "テンションあげてこ～！"
16020-863-220-1 = "待ってたよ。\n先生がいないと\n始まんないからね。"
16020-863-230-1 = "「ロア追跡作戦」\nねぇ……。"
16020-863-240-1 = "そもそも、ロアって\n目で追えるものなの？"
16020-863-250-1 = "ん？どうしたの？"
16020-863-260-1 = "ニコのおいなりさんは\n絶品だよねぇ。\nいつ食べても美味しい。"
16020-863-270-1 = "ユキノ、大丈夫かな……。"
16020-863-280-1 = "まだちょっと、\n前のこと引きずって\nそうなんだよね。"
16020-863-490-1 = "あ、先生。いいところに。"
16020-863-500-1 = "事件のことで\n聞きたいことがあってさ。"
16020-863-510-1 = "あ、ちょっといいかな……"
16020-863-520-1 = "いくつか\nお願いしたいことがあって。"
16020-863-530-1 = "ん？髪をじっと見つめて、\nどうしたの？"
16020-863-540-1 = "何か気になるとこでもあった？"
16020-863-550-1 = "ああ……狭い場所で、\n髪がひっかかったら困るからさ。"
16020-863-560-1 = "こうやって編んでるわけ。"
16020-863-570-1 = "切っちゃおうかな～とも\n思ったんだけど。"
16020-863-580-1 = "せっかくここまで伸ばしたのを\n切るのもなぁって。"
16020-863-590-1 = "うわっ！\nつっつかないで！？"
16020-863-600-1 = "……あんまり\n得意じゃないんだよね。\n後ろに立たれるの。"
16020-863-610-1 = "へぇ……なるほどね。"
16020-863-620-1 = "たしかに、\n噂になる理由はある、か。"
16020-863-630-1 = "もう終わったの？\n……早いね。すごいなぁ。"
16020-863-640-1 = "「指揮官」って呼んだほうが\nよかったりする？"
