[translation]
16020-857-200-1 = "드디어 작전 시작인가……"
16020-857-210-1 = "텐션 오르는걸~"
16020-857-220-1 = "기다리고 있었어.\n선생님이 없으면 작전을\n시작할 수 없으니까."
16020-857-230-1 = "<로어 추적 작전>\n이라니……"
16020-857-240-1 = "로어라는 게\n실제로 추적이\n가능한 존재이긴 한가?"
16020-857-250-1 = "응? 나, 불렀어?"
16020-857-260-1 = "니코가 만들어 준\n유부초밥은 언제\n먹어도 별미란 말이지."
16020-857-270-1 = "유키노가\n신경 쓰이는걸……"
16020-857-280-1 = "아직도 전의 일을\n신경 쓰고 있는 걸까."
16020-857-490-1 = "아, 선생님.\n마침 잘 왔어."
16020-857-500-1 = "안 그래도 물어보고 싶은\n사건 리스트가 있었거든."
16020-857-510-1 = "아, 잠깐 괜찮을까?"
16020-857-520-1 = "부탁하고 싶은 일이\n몇 가지 있어서."
16020-857-530-1 = "응? 머리카락을 왜\n빤히 쳐다보는 거야?"
16020-857-540-1 = "뭔가\n신경 쓰이는 거라도 있어?"
16020-857-550-1 = "아아, 협소한 장소에서는\n머리가 걸릴 수도 있으니까."
16020-857-560-1 = "매일 직접 땋고 있거든."
16020-857-570-1 = "귀찮아서 잘라버릴까\n생각도 했지만……"
16020-857-580-1 = "이만큼 기르고 나니\n어쩐지 아까워져서."
16020-857-590-1 = "우, 우왓?!\n찌르지 말아줄래?"
16020-857-600-1 = "……갑자기\n뒤에서 습격당하는 건\n별로 좋아하지 않거든."
16020-857-610-1 = "호오… 과연."
16020-857-620-1 = "역시 소문이 자자한 데에는\n이유가 있었네."
16020-857-630-1 = "벌써 끝난 거야?\n우와…… 빠르네."
16020-857-640-1 = "이런 실력이라면\n'지휘관'이라고 부르는 게\n더 어울리려나?"
