[translation]
16020-857-200-1 = "So the mission's finally starting..."
16020-857-210-1 = "I'm getting pumped!"
16020-857-220-1 = "I've been waiting for you. We can't start the mission without you, Sensei."
16020-857-230-1 = "Mission Lore Pursuit..."
16020-857-240-1 = "Can you really track down \"lore,\" though?"
16020-857-250-1 = "Hm? You called me?"
16020-857-260-1 = "Niko's inarizushi is always so good."
16020-857-270-1 = "I'm worried about Yukino..."
16020-857-280-1 = "I wonder if she's still hanging onto her regrets..."
16020-857-490-1 = "Ah, Sensei. Perfect timing."
16020-857-500-1 = "I have a list of occurrences I wanted to ask you about."
16020-857-510-1 = "Ah, do you have a minute?"
16020-857-520-1 = "I've got a few things I want to ask you about."
16020-857-530-1 = "Hm? Why are you staring at my hair?"
16020-857-540-1 = "What're you thinking?"
16020-857-550-1 = "Ahhh, my hair can get caught on things in tight spaces."
16020-857-560-1 = "So I braid it daily."
16020-857-570-1 = "It's a pain, so I've thought about cutting it..."
16020-857-580-1 = "But it felt like a shame after I've already grown it out this much."
16020-857-590-1 = "Wh-Whoa?! Could you NOT poke me?!"
16020-857-600-1 = "...I don't like unexpected ambushes."
16020-857-610-1 = "Hmm... I see."
16020-857-620-1 = "So there was an explanation for all those rumors."
16020-857-630-1 = "You're already done? Wow...That was fast."
16020-857-640-1 = "With those skills, maybe I should start calling you Commander."
