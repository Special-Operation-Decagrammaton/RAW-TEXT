[translation]
16020-200 = "ในที่สุดปฏิบัติการ\nก็เริ่มแล้วสินะ..."
16020-210 = "ความรู้สึกตื่นเต้น\nพุ่งพล่านขึ้นมาเลย~"
16020-220 = "ฉันกำลังรออยู่เลย\nถ้าไม่มีคุณครู ก็เริ่ม\nปฏิบัติการไม่ได้นี่นา"
16020-230 = "<ปฏิบัติการแกะรอยตำนาน>\nงั้นเหรอ..."
16020-240 = "ตำนานเป็นสิ่งที่\nเราไปตามแกะรอย\nได้จริงๆ เหรอ?"
16020-250 = "หืม? เรียกฉันเหรอ?"
16020-260 = "ซูชิเต้าหู้หวานฝีมือนิโกะ\nไม่ว่าจะกินตอนไหน\nก็รสเลิศตลอดเลย"
16020-270 = "เป็นห่วง\nยูกิโนะจัง..."
16020-280 = "จะยังกังวลเรื่องงาน\nที่ผ่านมาหรือเปล่านะ"
16020-400 = "อ๊ะ คุณครู\nมาได้จังหวะพอดีเลย"
16020-410 = "ฉันมีเหตุการณ์ที่อยาก\nถามอยู่เพียบเลยละ"
16020-420 = "อ๊ะ พอจะมีเวลาสักครู่มั้ย?"
16020-430 = "ฉันมีเรื่องอยากขอให้ช่วย\n2-3 เรื่องน่ะ"
16020-440 = "หืม? ทำไมถึงจ้อง\nผมของฉันขนาดนั้นล่ะ?"
16020-450 = "มีอะไร\nให้ต้องใส่ใจงั้นเหรอ?"
16020-460 = "อ๋อ เวลาอยู่ในที่แคบๆ\nเส้นผมอาจจะไปเกี่ยวนู่นนี่ได้น่ะ"
16020-470 = "ฉันก็เลยถักผมเองทุกวัน"
16020-480 = "ถึงจะเคยคิดว่ามันน่ารำคาญ\nจนอยากตัดทิ้งเลยก็เถอะ..."
16020-490 = "แต่พอไว้ยาวถึงขนาดนี้แล้ว\nมันก็รู้สึกเสียดายน่ะ"
16020-500 = "ฮะ... เฮือก?!\nอย่ามาจิ้มกันได้มั้ย?"
16020-510 = "ฉันไม่ชอบที่จู่ๆ ก็ถูก\nซุ่มโจมตีจากข้างหลังน่ะ"
16020-520 = "โอ้... อย่างนี้นี่เอง"
16020-530 = "ที่เล่าลือกันให้แซ่ด\nก็มีเหตุผลจริงๆ สินะ"
16020-540 = "เสร็จแล้วเหรอ?\nว้าว... ไวจังเลย"
16020-550 = "ถ้าฝีมือขนาดนี้\nเรียกว่า 'ผู้บัญชาการ'\nน่าจะเหมาะกว่านะ?"
16020-560 = "ฉันก็เลยถักผมเองทุกวัน"
16020-570 = "ถึงจะเคยคิดว่ามันน่ารำคาญ\nจนอยากตัดทิ้งเลยก็เถอะ..."
16020-580 = "แต่พอไว้ยาวถึงขนาดนี้แล้ว\nมันก็รู้สึกเสียดายน่ะ"
16020-590 = "ฮะ... เฮือก?!\nอย่ามาจิ้มกันได้มั้ย?"
16020-600 = "ฉันไม่ชอบที่จู่ๆ ก็ถูก\nซุ่มโจมตีจากข้างหลังน่ะ"
