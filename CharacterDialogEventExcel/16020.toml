[translation]
16020-200 = "作戰終於要開始了啊……"
16020-210 = "打起精神來吧～！"
16020-220 = "我等你很久了哦。\n畢竟老師不在的話\n就沒辦法開始嘛。"
16020-230 = "「怪談追蹤作戰」啊……"
16020-240 = "話說回來，\n怪談是能用眼睛\n追蹤的嗎？"
16020-250 = "嗯？怎麼了嗎？"
16020-260 = "仁子做的豆皮壽司\n真是極品呢。\n不管什麼時候吃都好吃。"
16020-270 = "雪乃他……\n還好嗎……"
16020-280 = "好像還有點放不下\n之前的事的樣子呢。"
16020-400 = "啊，老師。\n來得正好。"
16020-410 = "我想請教你一些\n跟事件有關的事。"
16020-420 = "啊，可以打擾一下嗎……"
16020-430 = "我有幾件事想拜託你。"
16020-440 = "嗯？一直盯著我的頭髮，\n怎麼了嗎？"
16020-450 = "有什麼在意的地方嗎？"
16020-460 = "啊啊……\n因為在狹窄的地方，\n頭髮要是被勾到\n就麻煩了嘛。"
16020-470 = "所以才會像這樣綁起來。"
16020-480 = "乾脆剪掉好了～\n是有這麼想過啦……"
16020-490 = "不過難得留這麼長了，\n要剪掉也有點捨不得。"
16020-500 = "唔哇！\n別戳我啦！？"
16020-510 = "……我不太習慣呢。\n像這樣有人站在身後。"
16020-520 = "嘿……\n原來如此啊。"
16020-530 = "確實，有成為\n傳聞的理由呢。"
16020-540 = "已經結束了嗎？\n……真快呢。\n好厲害啊。"
16020-550 = "叫你「指揮官」\n會不會比較好呢？"
16020-560 = "所以才會像這樣綁起來。"
16020-570 = "乾脆剪掉好了～\n是有這麼想過啦……"
16020-580 = "不過難得留這麼長了，\n要剪掉也有點捨不得。"
16020-590 = "唔哇！\n別戳我啦！？"
16020-600 = "……我不太習慣呢。\n像這樣有人站在身後。"
