[translation]
10033-811-10-1 = "このワカモ、こうして\nあなた様のことを\n捕まえに参りました♥"
10033-811-20-1 = "私から逃げようとしても\n無駄だということ……"
10033-811-30-1 = "そのお体に、たっぷりと\n教えて差し上げますね♥"
10033-811-40-1 = "ああ……感じます……\nどこからか、\n先生の気配が……！"
10033-811-50-1 = "ふふふっ、私のことを\n振り払えるとでも\nお思いですか？"
10033-811-60-1 = "ああ、\nお可愛いらしい……♥"
10033-811-70-1 = "ああ、先生…… 今は\nどこにいらっしゃるので\nしょうか？"
10033-811-80-1 = "例え、爆炎と火薬の煙が\n立ち込める中であっても……。"
10033-811-90-1 = "このワカモ……\n決してあなた様のことを\n見失ったりはしませんわ♥"
10033-811-100-1 = "成程、\nこれが巷で流行りの"
10033-811-110-1 = "「隠れん坊」という\n遊戯なのでしょうか？"
10033-811-120-1 = "うふふっ、このような\n余興は嫌いでは\nありません。"
10033-811-130-1 = "追いかけて、捕まえれば\nよろしいのですね？"
10033-811-140-1 = "楽しくなって\nまいりました。"
10033-811-150-1 = "もし捕まったら\nその時は……ふふ、\n覚悟してくださいね♥"
