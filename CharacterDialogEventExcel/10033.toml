[translation]
10033-811-10-1 = "I, Wakamo, am here to capture you."
10033-811-20-1 = "No matter how hard you try, you can't run from me."
10033-811-30-1 = "I'll make sure you learn that today."
10033-811-40-1 = "Ahhh... I can feel your presence...no matter where I am!"
10033-811-50-1 = "Heehee. Did you think you could get rid of me, just like that?"
10033-811-60-1 = "Ah, you're so cute. ♥"
10033-811-70-1 = "Oh, Sensei. Where are you?"
10033-811-80-1 = "You can't hide behind the smoke of explosions and gunpowder..."
10033-811-90-1 = "That's right. I, Wakamo, will never let you go. ♥"
10033-811-100-1 = "Is this what people call..."
10033-811-110-1 = "...hide-and-seek?"
10033-811-120-1 = "Heehee. I don't mind this kind of entertainment."
10033-811-130-1 = "I'm supposed to chase and catch you, right?"
10033-811-140-1 = "I'm looking forward to it."
10033-811-150-1 = "Ready or not, here I come. ♥"
