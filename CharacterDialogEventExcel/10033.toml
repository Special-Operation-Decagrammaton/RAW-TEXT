[translation]
10033-811-10-1 = "วาคาโมะผู้นี้ มาที่นี่\nเพื่ออยู่ใกล้ๆ คุณแล้วค่ะ"
10033-811-20-1 = "ถึงจะพยายามหนีไปจากฉัน\nก็ไม่มีประโยชน์หรอกค่ะ "
10033-811-30-1 = "ฉันจะสั่งสอน...\nให้คุณท่านได้ทราบเองค่ะ"
10033-811-40-1 = "อา... คุณท่าน...\nฉันรู้สึกได้ถึง...\nการที่คุณท่านอยู่ใกล้ๆ ค่ะ"
10033-811-50-1 = "ฮุฮุฮุ คงคิดว่า\nถ้าเป็นแบบนี้\nจะสลัดฉันหลุดงั้นเหรอคะ?"
10033-811-60-1 = "อา... น่ารักที่สุดเลย♥"
10033-811-70-1 = "อ๊ะ คุณครู\nจะไปไหนเหรอคะ?"
10033-811-80-1 = "ถึงกลิ่นดินปืนและระเบิด\nจะรุนแรงแค่ไหน..."
10033-811-90-1 = "ค่ะ วาคาโมะผู้นี้...\nจะไม่ปล่อยให้คุณท่าน\nหลุดมือไปเป็นอันขาด ♥"
10033-811-100-1 = "นี่ก็คือ...\nการเล่นซ่อนแอบ"
10033-811-110-1 = "ที่เคยได้ยินมา\nใช่หรือเปล่าคะ?"
10033-811-120-1 = "ฮุฮุ เรื่องสนุกแบบนี้\nฉันก็ไม่ได้เกลียดหรอกค่ะ"
10033-811-130-1 = "แค่ไล่ตาม\nแล้วจับให้ได้ก็พอใช่ไหมคะ?"
10033-811-140-1 = "น่าตื่นเต้นจังเลยค่ะ"
10033-811-150-1 = "ถ้าฉันจับได้ละก็...\nตอนนั้น... ฮุฮุ\nเตรียมตัวให้ดีนะคะ♥"
