[translation]
10033-811-10-1 = "我，若藻，\n為了逮補你\n而前來。"
10033-811-20-1 = "想從我身邊逃走\n也沒有用的，"
10033-811-30-1 = "我會好好地\n教會您的身體的♥"
10033-811-40-1 = "啊啊…我感覺到…\n從某處傳來的，\n老師的動靜……！"
10033-811-50-1 = "呵呵呵，你以為\n能把我\n甩掉吧？"
10033-811-60-1 = "啊啊，好可愛♥"
10033-811-70-1 = "啊啊，老師。\n你在哪裡？"
10033-811-80-1 = "即使，火焰與炸藥的煙霧\n瀰漫四周……"
10033-811-90-1 = "對，若藻我…\n絕對不會\n被甩掉的♥"
10033-811-100-1 = "果然，這就是\n傳說中的"
10033-811-110-1 = "「捉迷藏」\n遊戲嗎？"
10033-811-120-1 = "呵呵呵，這種餘興，\n我不討厭。"
10033-811-130-1 = "只要追上去，\n抓住就好了吧？"
10033-811-140-1 = "真是期待。"
10033-811-150-1 = "如果被我抓到\n到時…呵呵，\n要有所覺悟喔♥"
10033-10811-10-1 = "若藻我，\n前來抓住閣下了♥"
10033-10811-20-1 = "想算想逃離我\n也是白費力氣這點……"
10033-10811-30-1 = "我會好好地\n教會您的身體的♥"
10033-10811-40-1 = "啊啊……感覺到了……\n從某處傳來\n老師的氣息……！"
10033-10811-50-1 = "呵呵呵，難道\n您以為能把我甩掉嗎？"
10033-10811-60-1 = "啊啊，真可愛……♥"
10033-10811-70-1 = "啊啊，老師……\n您在何處呢？"
10033-10811-80-1 = "即使，是在火焰\n與炸藥的煙霧之中……"
10033-10811-90-1 = "若藻我……也絕對\n不會看丟閣下的♥"
10033-10811-100-1 = "原來如此，\n街上流行的"
10033-10811-110-1 = "「捉迷藏」\n這個遊戲嗎？"
10033-10811-120-1 = "唔呵呵，這種\n餘興我並不討厭。"
10033-10811-130-1 = "只要追上去，\n抓住就好了對吧？"
10033-10811-140-1 = "真是讓人期待。"
10033-10811-150-1 = "如果被我抓到的話，\n屆時……呵呵，\n請做好覺悟哦♥"
