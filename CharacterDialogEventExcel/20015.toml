[translation]
20015-813-10-1 = "百鬼夜行の映画村に\nようこそー！私が案内\nしてあげるね、先生！"
20015-813-20-1 = "あ、先生！\nなになに、これから\n映画村で遊ぶの？"
20015-813-30-1 = "じゃあ私も一緒に\n遊びたーい！"
20015-813-40-1 = "あ、でも\n今はダメなんだった……"
20015-813-50-1 = "先生、映画村の\nアトラクションはどう\nだった？面白かった？"
20015-813-60-1 = "いいなー、\n私もそっち側体験したーい"
20015-813-70-1 = "あ、もうこんな時間\nなんだね\nうー、遊び足りない……"
20015-813-80-1 = "終わったら一緒に\n行こうね、先生？"
20015-813-90-1 = "あれ、\nもしかしてもう終わり！？"
20015-813-100-1 = "えー、まだ全然先生と\n遊んでないのに……"
20015-813-110-1 = "まあいっか、また先生と\nくれば良いんだもんね！"
20015-813-120-1 = "今回修行部は、\nイベントを手伝う\n側なんだけど……"
20015-813-130-1 = "う～、私も遊びたい～！"
20015-813-140-1 = "ん、なに？\n相手を突っつく遊び？"
20015-813-150-1 = "ひひっ、\n私も負けないよーっ！\nそりゃ、とりゃぁっ！"
20015-813-160-1 = "こういうお手伝いも、\n修行の一環！……って\n分かってるんだけど、"
20015-813-170-1 = "退屈なものは\n退屈！"
20015-813-180-1 = "うーん、\n遊びに行きたい……"
20015-813-190-1 = "んーーーー……\n駄目、じっとしてるのは\nやっぱ退屈ー！"
20015-813-200-1 = "……あ、叫んだら\nちょっとスッキリした"
20015-813-720-1 = "ここではカードが\n引けるんだよ！\n早速どう、先生？"
20015-813-730-1 = "さあどうぞ！\n先生のターンだよ、\nドローして！"
20015-813-740-1 = "どうせだし、\nもう全部引いちゃえば？"
20015-813-750-1 = "こういう時ほど、\nレアカードが出そうだし！"
20015-813-760-1 = "わくわく、\n何が出るかな～？"
20015-813-770-1 = "せっかくなら\nレアカードが\n良いよね！"
20015-813-780-1 = "キラキラして綺麗だし、\nテンション上がる！"
20015-813-790-1 = "うぉー、これめっちゃ\nレアカードじゃん！"
20015-813-800-1 = "先生すごい、\nこれぞディスティニー！"
20015-813-810-1 = "あ、良いカードじゃん！\nなるほど、これが\n大人の力……"
20015-813-820-1 = "あ、良く見るやつだ。\nでも普通にレアカードだと\n思うよ！"
20015-813-830-1 = "えっと……\nが、ガッカリしないで、\n先生！"
20015-813-840-1 = "次はきっと、\n良いのが出るから！\n……多分"
