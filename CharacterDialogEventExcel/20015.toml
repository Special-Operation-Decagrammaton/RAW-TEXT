[translation]
20015-813-10-1 = "Welcome to the Hyakkiyako Movie Village! I'll be your guide, Sensei!"
20015-813-20-1 = "Oh, Sensei! What's going on? Are you gonna play in the Movie Village?"
20015-813-30-1 = "I wanna play with you too!"
20015-813-40-1 = "Oh, but, I can't do that now..."
20015-813-50-1 = "Sensei, how were the attractions at the Movie Village? Were they fun?"
20015-813-60-1 = "I'm jealous! I wanna try them too!"
20015-813-70-1 = "Oh, look at the time. Ugh, I wanna play more..."
20015-813-80-1 = "Can we go there together after this, Sensei?"
20015-813-90-1 = "Huh? Is it already over?"
20015-813-100-1 = "Ugh! But I didn't even get to have any real fun with you!"
20015-813-110-1 = "Well, okay. We should come again later!"
20015-813-120-1 = "The Inner Discipline Club has to help with the event this time..."
20015-813-130-1 = "Ugh... I just wanna play!"
20015-813-140-1 = "Huh? What? Is this like a poking game?"
20015-813-150-1 = "I'm not gonna lose! Hiii-yah! Hi-yah!"
20015-813-160-1 = "I know that helping like this is a part of my training, but..."
20015-813-170-1 = "...it's still so boring!"
20015-813-180-1 = "Hmm... I wanna go out and have fun..."
20015-813-190-1 = "Hmm... No. Being still is just so boring!"
20015-813-200-1 = "...Ah, I feel better after yelling."
20015-813-720-1 = "You can choose a card now! Why don't you go for it, Sensei?"
20015-813-730-1 = "All right, pick one! It's your turn. Draw!"
20015-813-740-1 = "Might as well pick all of them!"
20015-813-750-1 = "Maybe it'll be a rare card!"
20015-813-760-1 = "Ba-dump, ba-dump! What's it gonna be?"
20015-813-770-1 = "I hope it's a rare card!"
20015-813-780-1 = "It's sparkly and pretty. So exciting!"
20015-813-790-1 = "Whoa, this is an incredibly rare card!"
20015-813-800-1 = "Sensei! Amazing! This must be fate!"
20015-813-810-1 = "Oh, that's a good card! This must be...the power of an adult..."
20015-813-820-1 = "Oh, I see that one often. But I think it's still a pretty rare card!"
20015-813-830-1 = "So, um... D-Don't be disappointed, Sensei!"
20015-813-840-1 = "I'm sure you'll get something good next time! Maybe."
