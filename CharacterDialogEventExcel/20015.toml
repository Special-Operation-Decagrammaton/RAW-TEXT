[translation]
20015-813-10-1 = "歡迎來到百鬼夜行\n的電影村！我來帶你\n參觀吧，老師！"
20015-813-20-1 = "啊，老師！\n什麼什麼，接下來\n要在電影村玩嗎？"
20015-813-30-1 = "那我也想要\n一起玩～！"
20015-813-40-1 = "啊，可是\n現在不行……"
20015-813-50-1 = "老師，電影村的\n娛樂活動怎麼樣？\n有趣嗎？"
20015-813-60-1 = "好羨慕～\n我也想去\n體驗一下～"
20015-813-70-1 = "啊，已經到\n這個時間了啊？\n嗚～我還沒玩夠……"
20015-813-80-1 = "結束之後\n一起走吧，老師？"
20015-813-90-1 = "咦，難道\n已經結束了嗎！？"
20015-813-100-1 = "咦～我都還沒\n和老師一起玩的說……"
20015-813-110-1 = "算了，之後再跟\n老師一起來就好了！"
20015-813-120-1 = "雖然這次修行部是\n協助活動的一方……"
20015-813-130-1 = "嗚～我也想去玩～！"
20015-813-140-1 = "嗯？什麼？\n戳對方的遊戲？"
20015-813-150-1 = "我也不會輸的唷！\n喝啊！哈！"
20015-813-160-1 = "像這樣幫忙\n也是修行的一環！\n……雖然我也知道，"
20015-813-170-1 = "不過無聊的事情就是無聊！"
20015-813-180-1 = "唔嗯～好想去玩……"
20015-813-190-1 = "嗯……不行，\n一直待在這裡\n果然很無趣！"
20015-813-200-1 = "……啊，大喊過後，\n好像舒服了一點。"
20015-813-720-1 = "這裡可以抽卡唷！\n要不要馬上抽呀，老師？"
20015-813-730-1 = "來，請吧！\n輪到老師的回合囉，\n抽卡吧！"
20015-813-740-1 = "既然要抽的話，\n要不要全都抽完？"
20015-813-750-1 = "越是這種時候，\n越容易出現稀有卡片！"
20015-813-760-1 = "心動動，\n會抽到什麼呢～？"
20015-813-770-1 = "既然如此，\n如果是稀有卡片就好了！"
20015-813-780-1 = "閃閃發光又漂亮，\n心情都高興起來了！"
20015-813-790-1 = "唔哦，這不是\n超級稀有的卡片嗎！"
20015-813-800-1 = "老師好厲害，\n這就是命運！"
20015-813-810-1 = "啊，是張好卡呢！\n原來如此，這就是\n大人的力量……"
20015-813-820-1 = "啊，是很常見的卡。\n不過我覺得也是\n普通的稀有卡唷！"
20015-813-830-1 = "那個……\n別，別失望，老師！"
20015-813-840-1 = "下次一定會\n抽到好卡的！\n……大概。"
