[translation]
20015-813-10-1 = "ยินดีต้อนรับสู่เทศกาลฉายหนัง\nเฮียกคิยาโคค่ะ! ฉันจะนำทาง\nให้เองค่ะ คุณครู!"
20015-813-20-1 = "อ๊ะ คุณครู! อะไรกันๆ\nตอนนี้จะมาเที่ยว\nที่หมู่บ้านสตูดิโอ\nภาพยนตร์งั้นเหรอ?"
20015-813-30-1 = "ถ้างั้นฉันเอง...\nก็อยากไปเที่ยวเหมือนกัน!"
20015-813-40-1 = "อ๊ะ แต่ว่า...\nตอนนี้คงไม่ได้หรอก"
20015-813-50-1 = "คุณครู สถานที่ท่องเที่ยวของ\nหมู่บ้านสตูดิโอภาพยนตร์\nเป็นไงบ้าง? สนุกรึเปล่า?"
20015-813-60-1 = "ดีจังเลยน้า~\nฉันเองก็อยากไป\nลองเล่นดูบ้างจัง~"
20015-813-70-1 = "อ๊ะ เวลาผ่านมา\nขนาดนี้แล้วเหรอเนี่ย\nฮือ... อยากไปเที่ยวจัง..."
20015-813-80-1 = "พอเสร็จงานแล้วไปด้วยกันนะ\nคุณครู...?"
20015-813-90-1 = "เอ๋...?\nงานจบไปแล้วงั้นเหรอ?!"
20015-813-100-1 = "เอ๋...\nฉันยังไม่ได้ไปเดินเที่ยว\nกับคุณครูเลยนะ"
20015-813-110-1 = "ดีละ...\nค่อยมาเที่ยวที่นี่ใหม่\nพร้อมกับคุณครูก็ได้!"
20015-813-120-1 = "คราวนี้ชมรมฝึกฝน\nก็คอยมาช่วยงาน\nอยู่ด้วยนะ..."
20015-813-130-1 = "ฮือ~ ฉันเองก็อยากไปเที่ยวเหมือนกัน~!"
20015-813-140-1 = "หืม? อะไรน่ะ?\nอยากไปเล่นให้สนุกสุดๆ เลย?"
20015-813-150-1 = "ฉันเองก็จะแพ้ไม่ได้!\nย้า~! ย้ากกก~!"
20015-813-160-1 = "การมาช่วยงานแบบนี้\nก็เป็นการฝึกฝนอย่างหนึ่ง\nฉันคิดแบบนั้นนะแต่ว่า..."
20015-813-170-1 = "ก็มันน่าเบื่อจริงๆ นี่!"
20015-813-180-1 = "อืม... อยากไปเล่นจังเลย"
20015-813-190-1 = "อืม... ไม่ได้การ\nอยู่เฉยๆ แบบนี้\nน่าเบื่อจริงๆ ด้วย"
20015-813-200-1 = "อ๊ะ พอได้ตะโกนออกไป\nก็รู้สึกโล่งขึ้นมาหน่อย"
20015-813-720-1 = "ตรงนี้สามารถสุ่มการ์ดได้นะ!\nสนใจลองดูมั้ยล่ะคุณครู?"
20015-813-730-1 = "เอ้า เลือกเลย~!\nเทิร์นของคุณครูแล้วนะ\nจั่วการ์ดสิ!"
20015-813-740-1 = "ถ้าจั่วการ์ดออกมาทั้งหมดเลยดูล่ะ?"
20015-813-750-1 = "ยิ่งเวลาแบบนี้\nต้องได้การ์ดหายากแน่ๆ เลย!"
20015-813-760-1 = "ตื่นเต้นจังเลย~!\nจะได้การ์ดอะไรนะ~?"
20015-813-770-1 = "ถ้าเป็นไปได้\nขอให้เป็นการ์ดหายากด้วยเถอะ!"
20015-813-780-1 = "ก็เวลาเปิดได้การ์ดวิบวับๆ\nสวยๆ มันสนุกนี่นา!"
20015-813-790-1 = "ว้าววว นี่มัน...\nการ์ดหายาก...\nสุดๆ เลยนะ"
20015-813-800-1 = "คุณครู! สุดยอดเลย!\nนี่ต้องเป็นโชคชะตาแน่ๆ!"
20015-813-810-1 = "อ๊ะ ได้การ์ดดีเลยละ!\nหรือว่านี่คือ...\nพลังของผู้ใหญ่..."
20015-813-820-1 = "อ๊ะ การ์ดนี้ฉันเจอบ่อยนะ\nแต่คิดว่ามันเป็นการ์ด\nหายากเหมือนกันนะ!"
20015-813-830-1 = "โอ๊ะ คือว่า...\nมะ...ไม่ต้องผิดหวังไปหรอกนะ\nคุณครู!"
20015-813-840-1 = "คราวหน้าจะต้อง...\nสุ่มได้การ์ดดีๆ แน่!\nอาจจะนะ..."
20015-10813-10-1 = "ยินดีต้อนรับสู่เทศกาลฉายหนัง\nเฮียกคิยาโคค่ะ! ฉันจะนำทาง\nให้เองค่ะ คุณครู!"
