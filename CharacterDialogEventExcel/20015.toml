[translation]
20015-813-10-1 = "백귀야행 영화촌에\n어서 오세요! 내가\n안내해줄게. 선생님!"
20015-813-20-1 = "아, 선생님!\n뭐야뭐야, 지금부터\n영화촌에서 노는 거야?"
20015-813-30-1 = "그럼 나도 같이\n놀고 싶어!"
20015-813-40-1 = "아, 하지만\n지금은 안 되지…."
20015-813-50-1 = "선생님, 영화촌의\n어트랙션은 어땠어?\n재밌었어?"
20015-813-60-1 = "좋겠다~\n나도 그거\n체험해보고 싶은데~"
20015-813-70-1 = "아, 벌써\n이런 시간이네.\n으, 더 놀고 싶은데…."
20015-813-80-1 = "끝나고 같이 가자.\n선생님?"
20015-813-90-1 = "어라,\n설마 벌써 끝이야?!"
20015-813-100-1 = "에이-\n아직 선생님이랑 제대로\n놀지도 못했는데…."
20015-813-110-1 = "뭐, 좋아.\n또 선생님하고\n같이 오면 되니까!"
20015-813-120-1 = "이번에 수행부는\n이벤트를 돕는\n역할인데…."
20015-813-130-1 = "우~ 나도 놀고 싶어~!"
20015-813-140-1 = "응? 뭐야?\n찔러 보기 놀이야?"
20015-813-150-1 = "나도 질 수 없지!\n이야앗~! 이얍~!"
20015-813-160-1 = "이렇게 돕는 것도,\n수행의 일환!\n…이라고 알고는 있지만,"
20015-813-170-1 = "지루한 건 지루해!"
20015-813-180-1 = "으-음. 놀러 가고 싶어…."
20015-813-190-1 = "음---안 돼.\n가만히 있는 건\n역시 지루해!"
20015-813-200-1 = "…아, 소리치니까.\n조금 개운해졌다."
20015-813-720-1 = "여기서는 카드를 뽑을 수\n있어! 바로 어때, 선생님?"
20015-813-730-1 = "자, 골라~!\n선생님 턴이야,\n드로우 해!"
20015-813-740-1 = "내친김에 다\n뽑아버리면?"
20015-813-750-1 = "이럴 때일수록, 레어\n카드가 나올 거 같고!"
20015-813-760-1 = "두근두근두근~!\n뭐가 나올까~?"
20015-813-770-1 = "기왕이면\n레어카드가 좋지!"
20015-813-780-1 = "반짝반짝해서 예쁘고,\n뽑으면 신나니까!"
20015-813-790-1 = "우오- 이거\n엄청난 레어\n카드잖아!"
20015-813-800-1 = "선생님! 대단해!\n이거야말로 데스티니-!"
20015-813-810-1 = "아, 좋은 카드다!\n과연, 이것이\n어른의 힘…."
20015-813-820-1 = "아, 자주 보는 거다.\n그래도 레어카드라고\n생각해!"
20015-813-830-1 = "어, 그러니까….\n시, 실망하지 마,\n선생님!"
20015-813-840-1 = "다음엔 분명,\n좋은 게 나올 거야!\n아마도."
