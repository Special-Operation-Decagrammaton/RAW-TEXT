[translation]
23006-801-170-1 = "這裡是百夜堂的攤位！\n來吧主人，\n需要什麼東西呢？"
23006-801-180-1 = "啊，老師！\n歡迎光臨～"
23006-801-190-1 = "來來，\n請盡情參觀吧！"
23006-801-200-1 = "慶典雖然結束了，\n不過我們還沒打烊！"
23006-801-210-1 = "有句話說\n剩下的東西有福氣，\n來吧老師，請！"
23006-801-220-1 = "就算是慶典，\n不，正因為是慶典，\n百夜堂是不會停下腳步的！"
23006-801-230-1 = "……嘛，畢竟我們同時\n也是節慶營運管理部，\n這是理所當然的，耶嘿。"
23006-801-240-1 = "好，這種時候就……\n萌耶萌耶～啾♪"
23006-801-250-1 = "……咦？\n這個有點老套？\n是嗎！？"
23006-801-260-1 = "啊，那個……！沒，沒什麼沒什麼，\n請收下請收下。我也沒有\n想說要把剩下的都買下來…！"
23006-801-270-1 = "居然選了那個，\n不愧是老師！\n眼光果然厲害！"
23006-801-280-1 = "謝謝惠顧，主人♪"
23006-801-290-1 = "啊，果然會覺得那是\n好東西對吧？耶嘿嘿。"
23006-10801-170-1 = "是百夜堂的攤位！\n來，主人，\n你有需要什麼東西嗎？"
23006-10801-180-1 = "啊~老師，\n歡迎光臨~"
23006-10801-190-1 = "來來來，\n慢慢挑慢慢選！"
23006-10801-200-1 = "雖然慶典結束了，\n不過我們還沒打烊！"
23006-10801-210-1 = "聽說剩下的東西\n反而有很多好貨，\n來吧~老師！挑一下吧！"
23006-10801-220-1 = "就算慶典開幕了，\n百夜堂也不會停下腳步！"
23006-10801-230-1 = "什麼~我們可是\n節慶營運管理部，\n這是理所當然的。嘿嘿。"
23006-10801-240-1 = "很好。在這裡…\n萌耶萌耶…啾！"
23006-10801-250-1 = "…什麼，你說有點老套？\n哪會？！"
23006-10801-260-1 = "啊，這個…！啊，沒有沒有，好好好。\n我也沒有打算\n非把剩下的東西帶走不可…！"
23006-10801-270-1 = "居然選中了那個，\n不愧是老師！\n眼光果然不同凡響！"
23006-10801-280-1 = "謝謝惠顧~\n主人~！"
23006-10801-290-1 = "這東西還不錯吧？\n耶嘿嘿。"
