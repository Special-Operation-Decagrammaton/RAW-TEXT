[translation]
23006-801-170-1 = "百夜堂の出張販売です！\nさあご主人様、\n必要な物は何でしょうか？"
23006-801-180-1 = "あ、先生！\nいらっしゃいませ～！"
23006-801-190-1 = "さあさあ、お好きなだけ\n見ていってください！"
23006-801-200-1 = "お祭りは終わって\nしまいましたが、\nまだまだ営業中です。"
23006-801-210-1 = "残り物には福があるって\n言いますから、\nさあ先生、どうぞ！"
23006-801-220-1 = "お祭りでも、\nいえお祭りだからこそ、\n百夜堂は止まりませんよ！"
23006-801-230-1 = "……まぁ、私たちは同時に\nお祭り運営委員会でもあるので、\n当たり前なんですけどね、えへっ。"
23006-801-240-1 = "よし、ここは……\n萌え萌え～、キュン♪"
23006-801-250-1 = "……えっ、\nこれちょっと古いんですか？\nそうなんですか！？"
23006-801-260-1 = "あっ、それ…！い、いえいえ、\nどうぞどうぞ。別に余ったら\n貰おうとか思っていたわけではなく…！"
23006-801-270-1 = "それを選ぶとは、\nさすが先生！\nお目が高いです！"
23006-801-280-1 = "お買い上げ\nありがとうございます、\nご主人様♪"
23006-801-290-1 = "あ、それやっぱり良い品だと\n思いますよね？えへへっ。"
