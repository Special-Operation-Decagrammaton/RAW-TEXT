[translation]
23006-801-170-1 = "Welcome to the Momoyodou shop! Now, Master, what do you need today?"
23006-801-180-1 = "Oh, Sensei. Welcome."
23006-801-190-1 = "Now, choose to your liking!"
23006-801-200-1 = "The festival is over, but we're still open."
23006-801-210-1 = "I'll personally bless the remaining items. Look around, Sensei!"
23006-801-220-1 = "Momoyodou won't be stopped, even if there is a festival!"
23006-801-230-1 = "Well, we are the Festival Operations Department after all. Heehee."
23006-801-240-1 = "Great. Here it's... Moe moe...kyun!"
23006-801-250-1 = "Huh? This looks old? How so?!"
23006-801-260-1 = "Oh, that! No, no. It's not like I was thinking about taking the leftovers!"
23006-801-270-1 = "Your choice... I knew you had good taste, Sensei!"
23006-801-280-1 = "As always, thank you, Master!"
23006-801-290-1 = "That's a good item, right? Heehee."
