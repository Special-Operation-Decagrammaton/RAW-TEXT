[translation]
23006-801-170-1 = "นี่เป็นการออกสำรวจร้านค้าของ\nร้านเฮียกคิยาโคค่ะ! เอาละค่ะ\nนายท่านอยากจะรับอะไรดีคะ?"
23006-801-180-1 = "อา~ คุณครู\nเชิญเลยค่ะ~"
23006-801-190-1 = "นี่ค่ะ\nเลือกได้ตามสบายเลยนะคะ!"
23006-801-200-1 = "ถึงงานเทศกาลจะจบลงไปแล้ว\nแต่เรายังเปิดทำการอยู่นะคะ"
23006-801-210-1 = "ว่ากันว่าการที่ยังมีของเหลือ\nจะถือว่ามีโชคอยู่ เอาละ คุณครู!\nเชิญเลือกได้เลยค่ะ!"
23006-801-220-1 = "ถึงงานเทศกาลจะเริ่มแล้ว\nแต่ร้านเฮียกคิยาโคของเรา\nไม่หยุดหรอกนะคะ!"
23006-801-230-1 = "ก็~ เพราะว่าพวกเรา\nคือชมรมชมรมจัดงานเทศกาลนี่คะ\nจะหยุดได้ยังไงกันล่ะคะ ฮิฮิ..."
23006-801-240-1 = "ดีละ ถ้างั้น...\nฉันจะทำท่าคิวท์ๆ ให้ดูนะคะ ปิ้ว!"
23006-801-250-1 = "อ๊ะ จะบอกว่ามันดูเก่าเหรอคะ?\nทำไมล่ะคะ?!"
23006-801-260-1 = "อ๊ะ นั่นมัน...! อา ปะ...เปล่าค่ะๆ \nฉันไม่เคยคิดว่าจะให้เลือกจากของ\nที่เหลืออยู่แบบนั้นเลยนะคะ...!"
23006-801-270-1 = "ไม่คิดเลยว่าคุณครูจะเลือกชิ้นนั้น\nสมกับเป็นคุณครูจริงๆ!\nสายตาเฉียบแหลมมากค่ะ!"
23006-801-280-1 = "ขอบคุณที่มาอุดหนุนบ่อยๆ นะคะ~\nนายท่าน~!"
23006-801-290-1 = "ของชิ้นนั้นใช้ได้เลยใช่มั้ยล่ะคะ?\nฮิฮิฮิ!"
