[translation]
10147-220 = "唉……竟然會\n變成這樣……"
10147-230 = "沒事的，老師。\n總會有辦法的。"
10147-240 = "沒想到竟然會漂流……"
10147-250 = "就從做得到的事\n開始著手吧。"
10147-260 = "幽，幽靈船……\n是真的嗎？\n老師，你快想想\n辦法啊……！"
10147-270 = "真琴醬，完全\n入戲了呢……"
10147-280 = "算了，我相信會沒事的。"
10147-290 = "這樣就全都\n解決……了嗎？\n總算是圓滿落幕了呢。"
10147-300 = "嗯？什麼？"
10147-310 = "……要我不用太擔心？"
10147-320 = "呵呵，老師。\n你是在安慰我嗎？"
10147-330 = "雖然總覺得和想像中\n不太一樣……"
10147-340 = "不過，大海本來\n就是危險的地方嘛。\n這也沒辦法。"
10147-350 = "這件泳裝？"
10147-360 = "啊啊，沒問題的。\n我有好好擦防曬乳。"
10147-370 = "果然，還是得穿\n自己喜歡的才行呢。"
10147-380 = "……嗯。果然，\n老師的手很溫暖。"
10147-390 = "握著的時候，\n就會覺得安心。"
