[translation]
10147-860-220-1 = "はあ……\nこんなことに\nなるなんて……。"
10147-860-230-1 = "大丈夫よ、先生。\nなんとかなるわ。"
10147-860-240-1 = "まさか漂流するなんて……"
10147-860-250-1 = "できることから\nやっていきましょう。"
10147-860-260-1 = "ゆ、幽霊船って……\n本当かしら？\n先生、なんとか\nしなさい……！"
10147-860-270-1 = "マコトちゃん、\n完全に役に\n入っちゃってるわね……。"
10147-860-280-1 = "まあ、大丈夫だと\n信じているわ。"
10147-860-290-1 = "これで全て解決……\nしたのかしら？\n一件落着、ね。"
10147-860-300-1 = "うん？なに？"
10147-860-310-1 = "……あまり心配しないで\n大丈夫？"
10147-860-320-1 = "ふふっ、先生。\n私を慰めて\nくれているのかしら？"
10147-860-330-1 = "なんだか思っていたのとは\n違うけれど……。"
10147-860-340-1 = "まぁ、海は元々\n危険な場所だものね。\n仕方がないわ。"
10147-860-350-1 = "この水着？"
10147-860-360-1 = "ああ、大丈夫よ。\n日焼け止めをちゃんと\n塗っているもの。"
10147-860-370-1 = "やっぱり、\n自分が気に入っている\nものを着ないとね。"
10147-860-380-1 = "……うん。やっぱり、\n先生の手は温かい。"
10147-860-390-1 = "握っていると、\n安心するの。"
