[translation]
10147-220 = "はあ……\nこんなことに\nなるなんて……。"
10147-230 = "大丈夫よ、先生。\nなんとかなるわ。"
10147-240 = "まさか漂流するなんて……"
10147-250 = "できることから\nやっていきましょう。"
10147-260 = "ゆ、幽霊船って……\n本当かしら？\n先生、なんとか\nしなさい……！"
10147-270 = "マコトちゃん、\n完全に役に\n入っちゃってるわね……。"
10147-280 = "まあ、大丈夫だと\n信じているわ。"
10147-290 = "これで全て解決……\nしたのかしら？\n一件落着、ね。"
10147-300 = "うん？なに？"
10147-310 = "……あまり心配しないで\n大丈夫？"
10147-320 = "ふふっ、先生。\n私を慰めて\nくれているのかしら？"
10147-330 = "なんだか思っていたのとは\n違うけれど……。"
10147-340 = "まぁ、海は元々\n危険な場所だものね。\n仕方がないわ。"
10147-350 = "この水着？"
10147-360 = "ああ、大丈夫よ。\n日焼け止めをちゃんと\n塗っているもの。"
10147-370 = "やっぱり、\n自分が気に入っている\nものを着ないとね。"
10147-380 = "……うん。やっぱり、\n先生の手は温かい。"
10147-390 = "握っていると、\n安心するの。"
