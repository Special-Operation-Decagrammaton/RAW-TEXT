[translation]
10147-860-220-1 = "唉……竟然會\n變成這樣……"
10147-860-230-1 = "沒事的，老師。\n總會有辦法的。"
10147-860-240-1 = "沒想到竟然會漂流……"
10147-860-250-1 = "就從做得到的事\n開始著手吧。"
10147-860-260-1 = "幽，幽靈船……\n是真的嗎？\n老師，你快想想\n辦法啊……！"
10147-860-270-1 = "真琴醬，完全\n入戲了呢……"
10147-860-280-1 = "算了，我相信會沒事的。"
10147-860-290-1 = "這樣就全都\n解決……了嗎？\n總算是圓滿落幕了呢。"
10147-860-300-1 = "嗯？什麼？"
10147-860-310-1 = "……要我不用太擔心？"
10147-860-320-1 = "呵呵，老師。\n你是在安慰我嗎？"
10147-860-330-1 = "雖然總覺得和想像中\n不太一樣……"
10147-860-340-1 = "不過，大海本來\n就是危險的地方嘛。\n這也沒辦法。"
10147-860-350-1 = "這件泳裝？"
10147-860-360-1 = "啊啊，沒問題的。\n我有好好擦防曬乳。"
10147-860-370-1 = "果然，還是得穿\n自己喜歡的才行呢。"
10147-860-380-1 = "……嗯。果然，\n老師的手很溫暖。"
10147-860-390-1 = "握著的時候，\n就會覺得安心。"
