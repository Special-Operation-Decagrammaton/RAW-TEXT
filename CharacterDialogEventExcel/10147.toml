[translation]
10147-220 = "하아……\n이런 일이 생기다니……."
10147-230 = "그래도\n너무 당황하지 마, 선생.\n어떻게든 될 테니까."
10147-240 = "표류는 처음이지만……"
10147-250 = "일단 할 수 있는\n일들을 해봐야지."
10147-260 = "유, 유령선이라니……\n정말이야?\n선생, 어떻게\n좀 해줘……!"
10147-270 = "마코토 쨩,\n완전히 심취한\n모양이야……"
10147-280 = "뭐, 괜찮겠지."
10147-290 = "아무튼, 모든 게\n해결되었으니……\n이걸로 안심이랄까?"
10147-300 = "응? 왜?"
10147-310 = "……너무\n걱정하지 말라고?"
10147-320 = "후후, 선생.\n나를 위로해 주는 거야?"
10147-330 = "뭔가 생각했던 거랑은\n좀 다르긴 하지만……"
10147-340 = "바다는 원래\n위험한 곳이니까.\n납득할 수 있어."
10147-350 = "이 수영복? "
10147-360 = "아아. 노출 범위가 많아도\n선크림으로 방어할 수\n있으니까 괜찮아."
10147-370 = "어울리는 스타일은\n포기할 수 없으니까\n말이야."
10147-380 = "으응. 선생의 손은\n역시 따뜻하네."
10147-390 = "잡고 있으면 안심이 돼."
