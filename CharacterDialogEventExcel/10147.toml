[translation]
10147-220 = "เฮ้อ... ไม่คิดเลยว่า\nจะเกิดเรื่องแบบนี้..."
10147-230 = "แต่ก็ อย่าลนลานเกินไปนะ ครู\nเดี๋ยวก็หาทางได้เอง"
10147-240 = "นี่เป็นครั้งแรก\nที่ลอยเคว้งกลางทะเลก็จริง..."
10147-250 = "แต่ก่อนอื่น ต้องลองทำ\nสิ่งที่ทำได้ก่อน"
10147-260 = "ระ... เรือผีงั้นเหรอ...\nจริงเหรอ? ครู ช่วยทำ\nอะไรสักอย่างที...!"
10147-270 = "มาโคโตะจัง\nดูจะหลงใหลเข้าขั้น\nไปแล้วสินะ..."
10147-280 = "เอาเถอะ คงไม่เป็นไรหรอก"
10147-290 = "ยังไงทุกอย่างก็\nคลี่คลายแล้ว...\nแบบนี้ก็วางใจได้ละมั้ง?"
10147-300 = "หืม? ทำไมเหรอ?"
10147-310 = "อย่ากังวล\nมากเกินไปงั้นเหรอ...?"
10147-320 = "ฮุฮุ นี่ครู\nช่วยปลอบฉันอยู่เหรอ?"
10147-330 = "ถึงจะต่างจากที่คิดไว้\nนิดหน่อยก็เถอะ..."
10147-340 = "แต่ทะเลก็เป็น\nที่ที่อันตรายอยู่แล้วนี่เนอะ\nก็เข้าใจได้อยู่"
10147-350 = "ชุดว่ายน้ำนี่น่ะเหรอ?"
10147-360 = "อ่า ถึงจะเปิดเผยผิวเยอะ\nแต่ก็ป้องกันด้วยครีมกันแดดได้\nก็เลยไม่เป็นไรน่ะ"
10147-370 = "ก็สไตล์ที่เข้ากับตัวเองน่ะ\nจะให้ยอมแพ้ได้ยังไงกัน"
10147-380 = "อืม มือของครู\nอบอุ่นอย่างที่คิดจริงๆ นะ"
10147-390 = "พอได้จับไว้ก็รู้สึก\nสบายใจขึ้นมาเลย"
