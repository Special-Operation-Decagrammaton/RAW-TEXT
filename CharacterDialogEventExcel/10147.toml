[translation]
10147-860-220-1 = "เฮ้อ... ไม่คิดเลยว่า\nจะเกิดเรื่องแบบนี้..."
10147-860-230-1 = "แต่ก็ อย่าลนลานเกินไปนะ ครู\nเดี๋ยวก็หาทางได้เอง"
10147-860-240-1 = "นี่เป็นครั้งแรก\nที่ลอยเคว้งกลางทะเลก็จริง..."
10147-860-250-1 = "แต่ก่อนอื่น ต้องลองทำ\nสิ่งที่ทำได้ก่อน"
10147-860-260-1 = "ระ... เรือผีงั้นเหรอ...\nจริงเหรอ? ครู ช่วยทำ\nอะไรสักอย่างที...!"
10147-860-270-1 = "มาโคโตะจัง\nดูจะหลงใหลเข้าขั้น\nไปแล้วสินะ..."
10147-860-280-1 = "เอาเถอะ คงไม่เป็นไรหรอก"
10147-860-290-1 = "ยังไงทุกอย่างก็\nคลี่คลายแล้ว...\nแบบนี้ก็วางใจได้ละมั้ง?"
10147-860-300-1 = "หืม? ทำไมเหรอ?"
10147-860-310-1 = "อย่ากังวล\nมากเกินไปงั้นเหรอ...?"
10147-860-320-1 = "ฮุฮุ นี่ครู\nช่วยปลอบฉันอยู่เหรอ?"
10147-860-330-1 = "ถึงจะต่างจากที่คิดไว้\nนิดหน่อยก็เถอะ..."
10147-860-340-1 = "แต่ทะเลก็เป็น\nที่ที่อันตรายอยู่แล้วนี่เนอะ\nก็เข้าใจได้อยู่"
10147-860-350-1 = "ชุดว่ายน้ำนี่น่ะเหรอ?"
10147-860-360-1 = "อ่า ถึงจะเปิดเผยผิวเยอะ\nแต่ก็ป้องกันด้วยครีมกันแดดได้\nก็เลยไม่เป็นไรน่ะ"
10147-860-370-1 = "ก็สไตล์ที่เข้ากับตัวเองน่ะ\nจะให้ยอมแพ้ได้ยังไงกัน"
10147-860-380-1 = "อืม มือของครู\nอบอุ่นอย่างที่คิดจริงๆ นะ"
10147-860-390-1 = "พอได้จับไว้ก็รู้สึก\nสบายใจขึ้นมาเลย"
