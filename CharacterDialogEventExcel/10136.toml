[translation]
10136-854-3070-1 = "呀齁～老師，\n聽得到嗎？"
10136-854-3080-1 = "因為是緊急事態，\n所以用通訊連線。"
10136-854-3090-1 = "就算隔著線路，\n能看到臉還是很開心。"
10136-854-3100-1 = "雖然確保了透氣性……"
10136-854-3110-1 = "還是好熱。\n再脫一件──"
10136-854-3120-1 = "咦？停下來？這樣啊……"
10136-854-3130-1 = "好吧，既然老師\n這麼說了……"
10136-854-3140-1 = "現在的我比起狙擊手，\n更像是射手。"
10136-854-3150-1 = "移動的時候，\n會和隊伍一起。"
10136-854-3160-1 = "……能移動到涼快的地方，\n真是太好了。"
10136-854-3170-1 = "果然和老師聊天\n很開心。"
10136-854-3180-1 = "好的，辛苦了。"
