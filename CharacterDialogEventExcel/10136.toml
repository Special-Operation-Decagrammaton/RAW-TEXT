[translation]
10136-854-3070-1 = "ยะโฮ่ ได้ยินหรือเปล่า คุณครู?"
10136-854-3080-1 = "นี่เป็นสถานการณ์เร่งด่วน\nฉันก็เลยต้องโทรมาแทนน่ะ"
10136-854-3090-1 = "ดีจังเลยนะที่ได้เจอ\nผ่านการสื่อสารแบบนี้"
10136-854-3100-1 = "ชุดนี้ระบายอากาศได้แล้ว..."
10136-854-3110-1 = "แต่ก็ยังร้อนอยู่ดี\nต้องถอดมากกว่านี้หรือเปล่านะ...?"
10136-854-3120-1 = "หืม? ให้หยุดเหรอ?\nเอางั้นเหรอ..."
10136-854-3130-1 = "ก็นะ ถ้าคุณครู\nว่าอย่างนั้นละก็..."
10136-854-3140-1 = "ก็ตอนนี้ฉันเป็นพลแม่นปืน\nมากกว่าสไนเปอร์นี่เนอะ"
10136-854-3150-1 = "ตอนเคลื่อนไหว\nต้องไปพร้อมกับทีม"
10136-854-3160-1 = "พอมาในที่ที่เย็นสบาย\nก็ค่อยยังชั่วหน่อยนะ..."
10136-854-3170-1 = "การพูดคุยกับคุณครู\nเป็นเรื่องที่สนุกจริงๆ เลยนะ"
10136-854-3180-1 = "อื้อ ทำได้ดีมาก"
