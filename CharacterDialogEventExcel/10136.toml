[translation]
10136-854-3070-1 = "やっほー先生、聞こえる？"
10136-854-3080-1 = "緊急事態だからね、\n通信で繋げてるの。"
10136-854-3090-1 = "回線越しでも、\n顔が見れて嬉しいな。"
10136-854-3100-1 = "通気性は確保したけど……"
10136-854-3110-1 = "まだ暑い。\nもう一枚脱いでもーー"
10136-854-3120-1 = "え？やめて？そう……。"
10136-854-3130-1 = "まあ、先生が\nそう言うなら……。"
10136-854-3140-1 = "今の私はスナイパーというより\nマークスマンなんだ。"
10136-854-3150-1 = "移動するときは、\nチームと一緒。"
10136-854-3160-1 = "……涼しいところに\n移動してもらえて、助かったよ。"
10136-854-3170-1 = "やっぱり先生と話すの、\n楽しい。"
10136-854-3180-1 = "はい、お疲れ様。"
