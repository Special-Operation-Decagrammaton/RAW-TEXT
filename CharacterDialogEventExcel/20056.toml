[translation]
20056-842-790-1 = "누, 누구야?!"
20056-842-800-1 = "……아,\n선생님이셨군요!!"
20056-842-810-1 = "오셨군요, 선생님!"
20056-842-820-1 = "판 깔아놨으니,"
20056-842-830-1 = "일단 앉으시죠!"
20056-842-840-1 = "와버리셨군요!"
20056-842-850-1 = "역시 못 참겠죠?\n그렇죠?!"
20056-842-860-1 = "후후,\n저만 믿으시라고요."
20056-842-870-1 = "탈출은,\n이 쿠로사키 코유키의\n전문 영역이니까!"
20056-842-880-1 = "뭔가 많은 일이\n있었던 것 같은데……"
20056-842-890-1 = "뭐, 일단은"
20056-842-900-1 = "밤새 놀아보자……!"
20056-842-910-1 = "……고……요……"
20056-842-920-1 = "피휴우우……."
20056-842-930-1 = "촉감 좋죠?\n이 옷, 제법\n보들보들 하다고요!"
20056-842-940-1 = "구해주러 오셨군요,\n선생님!"
20056-842-950-1 = "에, 선생님도\n잡힌 거라고요?!"
20056-842-960-1 = "이 보드게임 이상해요!"
20056-842-970-1 = "제 차례만 되면\n터진다니까요!!"
20056-842-980-1 = "북적북적한\n반성실이라니……"
20056-842-990-1 = "뭐, 이것도\n나쁘진 않다랄까……요?"
