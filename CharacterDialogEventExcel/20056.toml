[translation]
20056-842-790-1 = "คะ... ใครน่ะ?!"
20056-842-800-1 = "อ๊ะ...\nคุณครูเองเหรอคะ!!"
20056-842-810-1 = "มาแล้วสินะคะ คุณครู!"
20056-842-820-1 = "ฉันปูพื้นไว้ให้แล้ว"
20056-842-830-1 = "มานั่งก่อนสิคะ!"
20056-842-840-1 = "มาแล้วสินะคะ!"
20056-842-850-1 = "คงทนไม่ไหวสินะคะ?\nใช่มั้ยล่ะคะ?!"
20056-842-860-1 = "ฮุฮุ\nเชื่อมือฉันสิคะ"
20056-842-870-1 = "คุโรซากิ โคยูกิคนนี้น่ะ\nเชี่ยวชาญเรื่อง\nการหลบหนีนะคะ!"
20056-842-880-1 = "เหมือนจะมีเรื่องอะไร\nเยอะเลยแฮะ..."
20056-842-890-1 = "แต่เอาเป็นว่า"
20056-842-900-1 = "มาสนุกกันทั้งคืนก่อนดีกว่า...!"
20056-842-910-1 = "นะ... คะ..."
20056-842-920-1 = "เฮือก..."
20056-842-930-1 = "สัมผัสดีใช่มั้ยล่ะคะ?\nชุดนี้น่ะ\nนุ่มมากเลยนะคะ!"
20056-842-940-1 = "มาช่วยฉันแล้วสินะคะ\nคุณครู!"
20056-842-950-1 = "เอ๋ คุณครูก็\nถูกจับงั้นเหรอคะ?!!"
20056-842-960-1 = "บอร์ดเกมอันนี้มันแปลกๆ นะคะ!"
20056-842-970-1 = "พอถึงตาฉันทีไร\nมันก็ระเบิดทุกทีเลยค่ะ!!"
20056-842-980-1 = "ห้องสำนึกผิด\nวุ่นวายขนาดนี้เลย..."
20056-842-990-1 = "เอาเถอะ แบบนี้ก็คง\nไม่แย่เท่าไร... สินะคะ?"
