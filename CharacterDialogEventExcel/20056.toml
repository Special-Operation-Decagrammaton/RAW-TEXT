[translation]
20056-842-790-1 = "Wh-Who's that?!"
20056-842-800-1 = "...Ah, it's Sensei!!"
20056-842-810-1 = "You're here, Sensei!!"
20056-842-820-1 = "I got the board ready,"
20056-842-830-1 = "so have a seat!"
20056-842-840-1 = "You're here!"
20056-842-850-1 = "You can't hold back, right? RIGHT?!"
20056-842-860-1 = "Fufu, just trust me."
20056-842-870-1 = "Escaping is Kurosaki Koyuki's expertise, after all!"
20056-842-880-1 = "It feels like so much happened..."
20056-842-890-1 = "Well, for now,"
20056-842-900-1 = "let's have fun all..."
20056-842-910-1 = "...ni...ght..."
20056-842-920-1 = "Zzz..."
20056-842-930-1 = "Isn't the texture nice? These jamjams are pretty soft!"
20056-842-940-1 = "Oh, you came here to save me, Sensei!"
20056-842-950-1 = "Wait, you got caught too?!"
20056-842-960-1 = "Something's weird about this board game!"
20056-842-970-1 = "It always explodes when it's my turn!!"
20056-842-980-1 = "A rowdy Self-Reflection Room..."
20056-842-990-1 = "Well, this isn't half bad... I guess?"
