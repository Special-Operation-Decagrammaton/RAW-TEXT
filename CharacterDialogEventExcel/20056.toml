[translation]
20056-842-790-1 = "だ、誰！？"
20056-842-800-1 = "……あっ、\n先生だったんですね！！"
20056-842-810-1 = "来てくれたんですね、\n先生！"
20056-842-820-1 = "セッティングは\n終わってるんで、"
20056-842-830-1 = "とりあえず\n座ってください！"
20056-842-840-1 = "来ちゃいましたね！"
20056-842-850-1 = "やっぱり\n我慢できませんでしたね？\nね！？"
20056-842-860-1 = "ふふっ、\n私に任せてください。"
20056-842-870-1 = "脱出は\n私の十八番ですから！"
20056-842-880-1 = "なんか色々あった\n気がするけど……。"
20056-842-890-1 = "ま、とりあえず今夜は"
20056-842-900-1 = "朝まで\n遊び\n倒しちゃいましょう……！"
20056-842-910-1 = "……って、言いたいところ\n……なんですけど"
20056-842-920-1 = "……にはっ"
20056-842-930-1 = "どうですか？\nこの触り心地……\nふわふわでしょ？"
20056-842-940-1 = "助けに\n来てくれたんですね、\n先生！"
20056-842-950-1 = "え、先生も\n捕まっちゃったん\nですか！？"
20056-842-960-1 = "このボードゲーム\nおかしいですよ！"
20056-842-970-1 = "毎回私の番で\n爆発するんですけど！！"
20056-842-980-1 = "うう……\nすし詰めの反省部屋……"
20056-842-990-1 = "ま、こういうのも悪く\nないかも……？"
