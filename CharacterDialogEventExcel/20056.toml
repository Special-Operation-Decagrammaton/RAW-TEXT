[translation]
20056-842-790-1 = "是，是誰！？"
20056-842-800-1 = "……啊，原來\n是老師啊！！"
20056-842-810-1 = "你來啦，老師！"
20056-842-820-1 = "準備都已經完成了，"
20056-842-830-1 = "總之請先坐下吧！"
20056-842-840-1 = "你來了呢！"
20056-842-850-1 = "果然還是忍不住了吧？\n對吧！？"
20056-842-860-1 = "呵呵，\n請交給我吧。"
20056-842-870-1 = "逃脫可是\n我的拿手好戲呢！"
20056-842-880-1 = "總覺得發生了很多事……"
20056-842-890-1 = "嗯，總之今晚就"
20056-842-900-1 = "玩到天亮吧……！"
20056-842-910-1 = "本來是想……\n這麼說的……"
20056-842-920-1 = "……尼哈。"
20056-842-930-1 = "怎麼樣啊？\n這個觸感……\n軟綿綿的對吧？"
20056-842-940-1 = "你來救我了啊，老師！"
20056-842-950-1 = "咦，老師也\n被抓住了嗎！？"
20056-842-960-1 = "這個桌遊很奇怪！"
20056-842-970-1 = "每次輪到我的時候\n就會爆炸！！"
20056-842-980-1 = "嗚嗚……\n人擠人的反省室……"
20056-842-990-1 = "算了，這樣好像\n也不差吧……？"
