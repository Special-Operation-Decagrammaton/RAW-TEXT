[translation]
20047-847-320-1 = "The Hyakkiyako Water Festival..."
20047-847-330-1 = "How did I get here?"
20047-847-340-1 = "Since I am participating, I will play without regrets."
20047-847-350-1 = "And so, the festival is coming to a close. I've experienced many new things."
20047-847-360-1 = "There is a twinge of bittersweetness at the end."
20047-847-370-1 = "I used to despise the sea."
20047-847-380-1 = "I have no regrets about this match. Thank you for watching, Sensei."
20047-847-390-1 = "Are you in need of my tactics?"
20047-847-400-1 = "No matter my efforts, my body simply sinks."
20047-847-410-1 = "Perhaps I am exerting too much force..."
20047-847-420-1 = "H-Hm? Since when have you been here, Sensei?"
20047-847-430-1 = "Worry not. Something like swimming is child's play to me."
20047-847-440-1 = "That tickles."
20047-847-450-1 = "...That didn't mean you should go away either."
20047-847-720-1 = "This is the mission list I personally organized. You're grateful, yes?"
20047-847-730-1 = "Now then, begin the operation."
20047-847-740-1 = "...What are you doing? You need to close the distance, so we can look together, yes?"
20047-847-750-1 = "When we're in private, I'll converse with you as much as you'd like."
20047-847-760-1 = "So please focus on the mission for now."
20047-847-770-1 = "Do you require the wisdom of an operations officer? Feel free to ask."
20047-847-780-1 = "I'd expect nothing less.\nAny ally of mine must be at least this competent."
20047-847-790-1 = "Seeing your work energizes me as well. Perhaps it's a natural consequence of being teammates?"
