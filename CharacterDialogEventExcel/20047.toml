[translation]
20047-847-320-1 = "เทศกาลสวนน้ำเฮียกคิยาโค..."
20047-847-330-1 = "ทำไมฉันถึง\nมาอยู่ที่นี่ได้นะ?"
20047-847-340-1 = "ในเมื่อได้มาเข้าร่วมแล้ว\nฉันก็จะตั้งใจแข่งขัน\nให้ไม่เสียดายในภายหลัง"
20047-847-350-1 = "งานเทศกาลใกล้จะจบแล้วสินะ\nฉันได้ประสบการณ์เยอะจริงๆ เลยละ"
20047-847-360-1 = "พอใกล้จะจบ\nในใจก็รู้สึกเสียดายอยู่นะ"
20047-847-370-1 = "ทั้งๆ ที่ฉันเกลียด\nทะเลเอามากๆ เลย"
20047-847-380-1 = "เป็นการแข่งขันที่\nฉันไม่เสียดายเลยละ ขอบคุณ\nที่คอยเฝ้าดูฉันนะ คุณครู"
20047-847-390-1 = "อยากได้กลยุทธ์จากฉันเหรอ?"
20047-847-400-1 = "ไม่ว่าจะพยายามยังไง\nตัวก็จมน้ำอยู่ดี..."
20047-847-410-1 = "หรือว่าฉันออกแรง\nมากเกินไปนะ"
20047-847-420-1 = "หะ... หืม?\nมาตั้งแต่ตอนไหนน่ะ คุณครู?"
20047-847-430-1 = "ไม่ต้องห่วงนะ เรื่องว่ายน้ำน่ะ\nไม่ใช่เรื่องใหญ่อะไรหรอก"
20047-847-440-1 = "จั๊กจี้นะ"
20047-847-450-1 = "ฉันไม่ได้บอก\nให้ไปตรงโน้นสักหน่อย..."
20047-847-720-1 = "นี่คือภารกิจทั้งหมด\nที่ฉันจัดมาให้ ฉันทำได้ดีใช่มั้ย?"
20047-847-730-1 = "เอาละ แจ้งเตือนภารกิจ"
20047-847-740-1 = "ทำอะไรน่ะ...? ต้องเข้ามาใกล้กว่านี้สิ\nจะได้ดูด้วยกันได้ไงล่ะ?"
20047-847-750-1 = "ถ้าจะคุยเล่น ไว้ฉันจะคุย\nในพื้นที่ส่วนตัวให้เยอะๆ เลย"
20047-847-760-1 = "เพราะงั้นตอนนี้ก็\nจดจ่อกับภารกิจก่อนนะ"
20047-847-770-1 = "อยากได้คำแนะนำจากที่ปรึกษา\nยุทธศาสตร์เหรอ? บอกมาเลยว่าเรื่องอะไร"
20047-847-780-1 = "ตามคาดเลยนะคุณครู ต้องอย่างนี้ละ\nถึงจะเป็นพันธมิตรกับฉันได้"
20047-847-790-1 = "พอคุณแสดงฝีมือ ฉันก็มีแรงใจขึ้นมาเลย\nก็เราอยู่ทีมเดียวกันแหละเนอะ?"
