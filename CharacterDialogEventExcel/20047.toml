[translation]
20047-847-320-1 = "百夜水上祭啊……"
20047-847-330-1 = "我……\n到底在做什麼呢……"
20047-847-340-1 = "既然要參加……就要\n打出不辱名號的比賽。"
20047-847-350-1 = "結束已近在眼前……\n算是段充實的時光吧。"
20047-847-360-1 = "真到結束的時候，\n還是有點寂寞呢。"
20047-847-370-1 = "大海什麼的，以前\n明明那麼討厭的說。"
20047-847-380-1 = "……我沒有遺憾。\n謝謝你，老師。\n一直守望到了最後。"
20047-847-390-1 = "我有個不錯的\n作戰計畫……\n想聽聽看嗎？"
20047-847-400-1 = "無論怎麼努力，身體\n還是會沉下去呢……"
20047-847-410-1 = "是因為太用力了嗎？"
20047-847-420-1 = "老，老師……！\n你從什麼時候\n開始看的……？"
20047-847-430-1 = "沒必要擔心。\n這種程度，\n根本不算什麼。"
20047-847-440-1 = "很癢耶。"
20047-847-450-1 = "……我可沒說要你離開。"
20047-847-720-1 = "這是這次的作戰列表。\n是我整理的……可別浪費了哦。"
20047-847-730-1 = "來，作戰列表。"
20047-847-740-1 = "……你在做什麼？\n不靠近一點不就\n沒辦法一起看了嗎？"
20047-847-750-1 = "要聊天的話，等到\n兩人獨處的時候再陪你。"
20047-847-760-1 = "現在先專心在作戰上。"
20047-847-770-1 = "需要作戰參謀的建言？\n儘管說吧。"
20047-847-780-1 = "不愧是老師。\n這種程度，理所當然吧。"
20047-847-790-1 = "既然你在努力，\n我也不能輸給你。\n這就是所謂的團隊吧？"
