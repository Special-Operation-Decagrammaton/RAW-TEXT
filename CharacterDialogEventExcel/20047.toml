[translation]
20047-847-320-1 = "百夜水上祭か……"
20047-847-330-1 = "私、\n何やってるんだろう…。"
20047-847-340-1 = "参加するからには……\n肩書に恥じない\n試合をするから。"
20047-847-350-1 = "終わりが見えてきた……\nだいぶ濃い\n時間だったかな。"
20047-847-360-1 = "いざ終わるとなると\n寂しいものだね。"
20047-847-370-1 = "海なんて、\n大嫌いだったのに。"
20047-847-380-1 = "……悔いはないよ。\nありがとう、先生。\n最後まで見守ってくれて。"
20047-847-390-1 = "良い作戦が\nあるんだけど……\n聞きたい？"
20047-847-400-1 = "どう頑張っても身体が\n沈んじゃうんだよね……"
20047-847-410-1 = "力入れすぎなのかな？"
20047-847-420-1 = "せっ、先生……！\nいつから見てたの……？"
20047-847-430-1 = "心配するほどじゃない。\nこの程度、\n大したことないから。"
20047-847-440-1 = "くすぐったいんだけど。"
20047-847-450-1 = "……離れてとは、\n言ってない。"
20047-847-720-1 = "これ、今回の作戦一覧。\n私がまとめたやつ……\n無駄にしないでね。"
20047-847-730-1 = "はい、作戦一覧。"
20047-847-740-1 = "……何してるの？\nもっと寄らなきゃ\n一緒に見れないでしょ？"
20047-847-750-1 = "雑談なら二人っきりの\n時に付き合ってあげる。"
20047-847-760-1 = "今は、作戦に集中して。"
20047-847-770-1 = "作戦参謀の助言が必要？\n何でも言って。"
20047-847-780-1 = "さすが先生。\nこれくらい、できて当然か。"
20047-847-790-1 = "あんたが頑張っているから、\n私も負けてはいられない。\nそれがチームってものでしょう？"
