[translation]
19009250-836-760-1 = "알 거 같기도 하고,\n아닌 거 같기도 하고……."
19009250-836-770-1 = "알 거 같기도 하고,\n아닌 거 같기도 하고……."
19009250-836-780-1 = "좋아!\n완벽하게 이해했어!!"
19009250-836-790-1 = "분위기 좋아!\n이대로만 가자!"
19009250-836-800-1 = "우리도 힘낼 테니까 말이야,\n마지막까지 부탁한다고.\n선생님!"
