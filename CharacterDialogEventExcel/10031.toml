[translation]
10031-809-10-1 = "Welcome, Sensei. I've been waiting for you."
10031-809-20-1 = "I already have something to take care of right at the start of the new year."
10031-809-30-1 = "Heehee, would you like to help, Sensei?"
10031-809-40-1 = "Your hands are really cold, Sensei!"
10031-809-50-1 = "...Even if there's a lot of work, you still have to get proper rest!"
10031-809-60-1 = "I didn't expect the commotion to get this boisterous. *sigh* It's unexpected..."
10031-809-70-1 = "...Coming this far actually makes me want to do it more."
10031-809-80-1 = "Since this is how it is, Problem Solver 68 will stay until the end!"
10031-809-90-1 = "Sensei, you'll be cooperating as well, right?"
10031-809-100-1 = "It ended up being KAITEN FX Mk.1! What the heck?!"
10031-809-110-1 = "It's so ridiculous. I don't even know what to say..."
10031-809-120-1 = "*sigh* Well, it's no use crying over spilled milk..."
10031-809-130-1 = "Sensei, I'm tired. Do you want to grab a meal next time?"
10031-809-140-1 = "I came to wish for the business development of Problem Solver 68 for the new year."
10031-809-150-1 = "Why did this happen...?"
10031-809-160-1 = "This year, Problem Solver 68 will be born anew."
10031-809-170-1 = "Come on, let's give it our all to make this the best year ever!"
10031-809-180-1 = "Don't worry, Sensei. As long as Problem Solver 68 is together..."
10031-809-190-1 = "...we can overcome any obstacle."
10031-809-200-1 = "Huh? Plans? N-No, I don't really h-have any..."
10031-809-210-1 = "*sigh* It's become a huge commotion."
10031-809-220-1 = "I hope our employees didn't get hurt."
10031-809-560-1 = "Welcome, Sensei. Work preparations are complete."
10031-809-570-1 = "Problem Solver 68 has prepared a lot for the new year."
10031-809-580-1 = "Take your time and choose."
10031-809-590-1 = "*sigh* The chaos has finally died down."
10031-809-600-1 = "Heehee. But we're still open for business."
10031-809-610-1 = "So take your time looking around, Sensei. ♪"
10031-809-620-1 = "Heehee, what do you think? Aren't they such catchy, cool items?"
10031-809-630-1 = "These are all the hidden powers of Problem Solver 68! ♪"
10031-809-640-1 = "Sensei, is there anything that catches your attention?"
10031-809-650-1 = "...A photo of everyone in Problem Solver 68 wearing kimonos?"
10031-809-660-1 = "W-We wouldn't have something like that!!"
10031-809-670-1 = "You have good taste, as expected. Well done, Sensei."
10031-809-680-1 = "Wow, good choice! I knew it."
10031-809-690-1 = "It's a really good item, so use it well."
10031-809-700-1 = "I can't believe you chose that. Not bad. You're fit to be my business partner, Sensei."
10031-809-710-1 = "Oh, that one's cool, right? I've been wanting to buy one for the office..."
10031-809-720-1 = "N-No! I'm not saying you have to buy me one!"
