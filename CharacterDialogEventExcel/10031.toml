[translation]
10031-809-10-1 = "โอ๊ะ คุณครู....\nกำลังรออยู่เลย"
10031-809-20-1 = "มีเรื่องให้จัดการ\nตั้งแต่ปีใหม่เลยนะ"
10031-809-30-1 = "ฮุฮุ คุณครู...\nจะช่วยฉันใช่ไหม?"
10031-809-40-1 = "มือของคุณครู...\nมันเย็นไปรึเปล่าน่ะ?"
10031-809-50-1 = "ถึงงานจะยุ่งขนาดไหน\nแต่ห้ามละเลย\nการพักผ่อนเด็ดขาดนะ"
10031-809-60-1 = "ไม่คิดเลยว่าเรื่องวุ่นวาย\nจะบานปลายใหญ่โตแบบนี้...\nเฮ้อ คิดไม่ถึงเลย..."
10031-809-70-1 = "มาถึงขนาดนี้แล้ว...\nชักอยากลุยให้จบแล้วสิ"
10031-809-80-1 = "ถ้าเป็นแบบนี้แล้ว\nหน่วยรับจ้างสารพัด 68\nก็จะลุยให้ถึงที่สุดเลย!"
10031-809-90-1 = "อ๊ะ แน่นอนว่าคุณครูเอง\nก็จะให้ความร่วมมือด้วยใช่มั้ย?"
10031-809-100-1 = "สุดท้ายก็กลายเป็น KAITEN\nFX Mk.1 แล้วงั้นเหรอ?\nมันคือตัวอะไรกันละเนี่ย?!"
10031-809-110-1 = "ไม่มีเหตุผลเอาซะเลย\nพูดไม่ออกเลย..."
10031-809-120-1 = "เฮ้อ... มาถึงตอนนี้แล้ว\nจะเอาเรื่องที่ผ่านไปแล้ว\nมาบ่นยืดยาวก็ไม่มีประโยชน์อะไร..."
10031-809-130-1 = "คุณครู ฉันเหนื่อยแล้วล่ะ\nตอนนี้เราไปหาอะไรกิน\nกันดีไหม?"
10031-809-140-1 = "ฉันแค่ขอพรให้กิจการ\nของหน่วยรับจ้างสารพัด 68\nรุ่งเรืองขึ้นในปีใหม่นี้เองนะ..."
10031-809-150-1 = "ทำไมถึงเป็นแบบนี้นะ..."
10031-809-160-1 = "ในปีใหม่นี้\nหน่วยรับจ้างสารพัด 68 ของเรา\nถือว่าได้เกิดใหม่แล้ว"
10031-809-170-1 = "เอาล่ะ มาฮึดสู้สักตั้ง\nแล้วทำให้ปีนี้เป็นปีที่สุดยอดกันเถอะ!"
10031-809-180-1 = "ไม่ต้องห่วงนะ คุณครู ถ้าอยู่กับพวกเรา\nหน่วยรับจ้างสารพัด 68 ละก็"
10031-809-190-1 = "ไม่ว่าจะเจออุปสรรคอะไร\nเราก็เอาชนะได้หมดแน่นอน"
10031-809-200-1 = "เอ๊ะ...? แผนการ? มะ... ไม่ใช่...\nระ...เรื่องนั้นฉัน\nยังไม่ได้คิดไว้เลย..."
10031-809-210-1 = "ฮู่ว... ดูเหมือนจะมี\nเรื่องวุ่นวายครั้งใหญ่เกิดขึ้นแล้ว"
10031-809-220-1 = "สมาชิกของพวกเรา\nไม่มีใครบาดเจ็บใช่ไหม?"
10031-809-560-1 = "เข้ามาสิคุณครู การเตรียมการ\nทำงานมันสมบูรณ์แบบมากเลยละ"
10031-809-570-1 = "หน่วยรับจ้างสารพัด 68 ของเราเตรียมของ\nสำหรับปีใหม่เอาไว้หลายอย่างเลยละ"
10031-809-580-1 = "ค่อยๆ เลือกดูก็ได้นะ"
10031-809-590-1 = "ฮู่ว... งานเทศกาลที่วุ่นวาย\nก็สิ้นสุดลงแล้วสินะ"
10031-809-600-1 = "ฮุฮุ แต่ว่า\nร้านแลกของยังเปิดอยู่นะ"
10031-809-610-1 = "เอาละ ค่อยๆ เลือกดูไปนะ\nคุณครู ♪"
10031-809-620-1 = "ฮุฮุ เป็นยังไงล่ะ? มีแต่ของที่สุดยอด\nจนต้องอ้าปากค้างเลยใช่ไหม?"
10031-809-630-1 = "นี่ก็คือศักยภาพทั้งหมดของ\nหน่วยรับจ้างสารพัด 68 เรายังไงล่ะ~♪"
10031-809-640-1 = "คุณครู มีของที่สนใจบ้างไหม?"
10031-809-650-1 = "รูปถ่ายตอนที่พวกเราทุกคน\nใส่ชุดกิโมโนเหรอ?"
10031-809-660-1 = "จะ... จะไปมีได้ยังไงกันเล่า\nของแบบนั้นน่ะ!?"
10031-809-670-1 = "ตาแหลมจริงๆ นะคุณครู\nเลือกได้ยอดเยี่ยมมากเลย"
10031-809-680-1 = "โอ๊ะ เลือกชิ้นนั้นเหรอ\nสมกับเป็นคุณครูจริงๆ เลยนะ"
10031-809-690-1 = "มันเป็นของที่ยอดเยี่ยมมากๆ\nใช้อย่างทะนุถนอมด้วยล่ะ"
10031-809-700-1 = "เลือกชิ้นนั้นเหรอ ยอดเยี่ยมจริงๆ\nคุณครู สมกับเป็นหุ้นส่วนของฉันเลย"
10031-809-710-1 = "ชิ้นนั้นก็สุดยอดเลยนะ ฉันซื้อสักชิ้น\nแล้วเอาไปไว้ที่สำนักงานดีไหมนะ..."
10031-809-720-1 = "ปะ...เปล่านะ! ไม่ได้หมายความว่า\nจะให้ซื้อให้สักหน่อย!"
10031-10809-10-1 = "โอ๊ะ คุณครู\nกำลังรออยู่เลย"
