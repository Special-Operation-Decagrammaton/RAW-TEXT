[translation]
20059-834-600-1 = "เอาละ จะมีเรื่องอะไร\nรอพวกเราอยู่บ้างนะ?"
20059-834-610-1 = "งานครั้งนี้ก็ต้อง\nสนุกมากแน่ๆ! ว่ามั้ย?"
20059-834-620-1 = "เล่นสนุกให้เหมือนปฏิบัติจริง!\nปฏิบัติจริงให้เหมือนเล่นสนุก♪"
20059-834-630-1 = "หืม~? เส้นทางการแฝงตัว\nคือทางโน้นหรือเปล่านะ?"
20059-834-640-1 = "ทำไม? อยากเล่นกับ\nมุสึกิจังเหรอ? ฮุฮุฮุ"
20059-834-650-1 = "ไว้จบงานนี้แล้ว\nไปดูโอเปร่าด้วยกันนะ!\nต้องสนุกแน่นอน♪"
20059-10834-600-1 = "เอาละ จะมีเรื่องอะไร\nรอพวกเราอยู่บ้างนะ?"
20059-10834-610-1 = "งานครั้งนี้ก็ต้อง\nสนุกมากแน่ๆ! ว่ามั้ย?"
20059-10834-620-1 = "เล่นสนุกให้เหมือนปฏิบัติจริง!\nปฏิบัติจริงให้เหมือนเล่นสนุก♪"
20059-10834-630-1 = "หืม~? เส้นทางการแฝงตัว\nคือทางโน้นหรือเปล่านะ?"
20059-10834-640-1 = "ทำไม? อยากเล่นกับ\nมุสึกิจังเหรอ? ฮุฮุฮุ"
20059-10834-650-1 = "ไว้จบงานนี้แล้ว\nไปดูโอเปร่าด้วยกันนะ!\nต้องสนุกแน่นอน♪"
20059-900834-240-1 = "เอาละ จะมีเรื่องอะไร\nรอพวกเราอยู่บ้างนะ?"
20059-900834-250-1 = "งานครั้งนี้\nก็ดูน่าสนุกดีนะ! ว่ามั้ย?"
20059-900834-260-1 = "เล่นให้เหมือนทำงานจริง!\nทำงานจริงให้เหมือนเล่นสนุก♪"
20059-900834-270-1 = "ฮืม~? เส้นทางการแฝงตัว\nเข้าไปคือทางนั้นเหรอ?"
20059-900834-280-1 = "ทำไมล่ะ? ไม่อยากเล่น\nกับมุสึกิจังเหรอ? ฮุฮุฮุ"
20059-900834-290-1 = "ถ้าจบงานนี้แล้วเราไปดูโอเปร่ากันเถอะ!\nต้องสนุกมากแน่ๆ เลย♪"
