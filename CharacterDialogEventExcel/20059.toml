[translation]
20059-240 = "เอาละ จะมีเรื่องอะไร\nรอพวกเราอยู่บ้างนะ?"
20059-250 = "งานครั้งนี้\nก็ดูน่าสนุกดีนะ! ว่ามั้ย?"
20059-260 = "เล่นให้เหมือนทำงานจริง!\nทำงานจริงให้เหมือนเล่นสนุก♪"
20059-270 = "ฮืม~? เส้นทางการแฝงตัว\nเข้าไปคือทางนั้นเหรอ?"
20059-280 = "ทำไมล่ะ? ไม่อยากเล่น\nกับมุสึกิจังเหรอ? ฮุฮุฮุ"
20059-290 = "ถ้าจบงานนี้แล้วเราไปดูโอเปร่ากันเถอะ!\nต้องสนุกมากแน่ๆ เลย♪"
20059-600 = "เอาละ จะมีเรื่องอะไร\nรอพวกเราอยู่บ้างนะ?"
20059-610 = "งานครั้งนี้ก็ต้อง\nสนุกมากแน่ๆ! ว่ามั้ย?"
20059-620 = "เล่นสนุกให้เหมือนปฏิบัติจริง!\nปฏิบัติจริงให้เหมือนเล่นสนุก♪"
20059-630 = "หืม~? เส้นทางการแฝงตัว\nคือทางโน้นหรือเปล่านะ?"
20059-640 = "ทำไม? อยากเล่นกับ\nมุสึกิจังเหรอ? ฮุฮุฮุ"
20059-650 = "ไว้จบงานนี้แล้ว\nไปดูโอเปร่าด้วยกันนะ!\nต้องสนุกแน่นอน♪"
