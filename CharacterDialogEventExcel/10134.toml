[translation]
10134-854-1550-1 = "선생님!\n미션입니다, 미션!"
10134-854-1560-1 = "오늘 할 일은\n무엇일까요?"
10134-854-1570-1 = "앗, 아리스가\n정리해야 하는 것이었죠……."
10134-854-1580-1 = "온라인으로 인사드립니다,\n선생님! 아리스입니다!"
10134-854-1590-1 = "엄청난 상황이\n되었습니다만……"
10134-854-1600-1 = "함께 이겨내는 겁니다!"
10134-854-1610-1 = "후. 후. 후……"
10134-854-1620-1 = "어떠신가요, 선생님.\n아리스의 새 갑옷은요!"
10134-854-1630-1 = "갑옷이 없어도……"
10134-854-1640-1 = "그리고 만일,\n빛의 검마저 없어져도……"
10134-854-1650-1 = "그래도,\n아리스는 아리스입니다."
10134-854-1660-1 = "모두와 함께라면, 그리고."
10134-854-1670-1 = "선생님이 계신다면요!"
10134-854-1680-1 = "말쿠트……"
10134-854-1690-1 = "그야말로\n최종 보스로군요!"
10134-854-1700-1 = "그런데 혹시……\n히든 보스가 등장하는 것은\n아니겠지요……?"
10134-854-1710-1 = "무사히 돌아가면……"
10134-854-1720-1 = "모두에게\n케이를 소개하고 싶습니다!"
10134-854-1730-1 = "뽜밤뽜밤-!"
10134-854-1740-1 = "선생님이\n보상을 획득했습니다!"
10134-854-1750-1 = "멋집니다, 선생님!"
10134-854-1760-1 = "하나하나\n해 나가는 겁니다!"
10134-854-1770-1 = "우우……\n아리스도 선생님 옆에서\n축하하고 싶습니다!"
10134-854-1780-1 = "네! 아리스는 언제나\n한결같은 선생님이,\n정말 좋습니다!"
