[translation]
10134-854-1550-1 = "Sensei! A mission! It is a mission!"
10134-854-1560-1 = "What do I need to do today?"
10134-854-1570-1 = "Ah, I was supposed to organize..."
10134-854-1580-1 = "I am greeting you remotely, Sensei! Aris, here!"
10134-854-1590-1 = "This has become a situation..."
10134-854-1600-1 = "But let us overcome it together!"
10134-854-1610-1 = "Hu. Hu. Hu..."
10134-854-1620-1 = "How is it, Sensei? This is my new armor!"
10134-854-1630-1 = "Even without armor..."
10134-854-1640-1 = "In fact, even if I lose the Sword of Light..."
10134-854-1650-1 = "No matter what, I am still Aris."
10134-854-1660-1 = "As long as I am with everyone!"
10134-854-1670-1 = "And as long as I am with Sensei!"
10134-854-1680-1 = "Malkuth..."
10134-854-1690-1 = "She must be the final boss!"
10134-854-1700-1 = "By the way... There will not be a hidden boss, right...?"
10134-854-1710-1 = "If we get return safely..."
10134-854-1720-1 = "I desire to introduce Kei to everyone!"
10134-854-1730-1 = "Bum bum bum!"
10134-854-1740-1 = "Sensei has earned a reward!"
10134-854-1750-1 = "You are very cool, Sensei!"
10134-854-1760-1 = "We shall do it one by one!"
10134-854-1770-1 = "Boo... I wish to celebrate by Sensei's side too!"
10134-854-1780-1 = "Yes! I really like Sensei, because you never change!"
