[translation]
10134-854-1550-1 = "先生！\nミッションです、ミッション！"
10134-854-1560-1 = "今日の任務は、\nなんでしょう？"
10134-854-1570-1 = "あっ、お片づけは、\nアリスの担当でしたね……。"
10134-854-1580-1 = "通信で失礼します！\n先生！アリスです！"
10134-854-1590-1 = "大変な状況に\nなりましたが……"
10134-854-1600-1 = "一緒に乗り越えて\nいきましょう！"
10134-854-1610-1 = "ふっ、ふっ、ふっ……"
10134-854-1620-1 = "どうですか、先生、\nアリスの新しいアーマーは！"
10134-854-1630-1 = "アーマーがなくても……。"
10134-854-1640-1 = "たとえ、\n光の剣を失っても……。"
10134-854-1650-1 = "それでも、\nアリスはアリスです。"
10134-854-1660-1 = "みんながいてくれるなら……\nそして。"
10134-854-1670-1 = "先生がいてくれるなら！"
10134-854-1680-1 = "マルクト……"
10134-854-1690-1 = "すごく\nラスボスって感じがします！"
10134-854-1700-1 = "倒したら……\n裏ボスが出てきたりとかは、\nしませんよね……？"
10134-854-1710-1 = "無事に帰れたら……"
10134-854-1720-1 = "みんなに、\nケイのことを紹介したいです！"
10134-854-1730-1 = "ぱんぱかぱーん！"
10134-854-1740-1 = "先生が報酬を獲得しました！"
10134-854-1750-1 = "すごいです、先生！"
10134-854-1760-1 = "この調子で一歩ずつ、\n進んでいきましょう！"
10134-854-1770-1 = "うぅ……アリスも先生のそばで、\nお祝いしたいです！"
10134-854-1780-1 = "はい！アリスは、\nいつも変わらない先生が、\n大好きです！"
