[translation]
10134-854-1550-1 = "老師！\n是任務，任務！"
10134-854-1560-1 = "今天的任務，\n是什麼呢？"
10134-854-1570-1 = "啊，整理是愛麗絲\n的工作呢……"
10134-854-1580-1 = "抱歉是透過通訊！\n老師！我是愛麗絲！"
10134-854-1590-1 = "雖然變成了\n艱難的狀況……"
10134-854-1600-1 = "一起克服它吧！"
10134-854-1610-1 = "哼，哼，哼……"
10134-854-1620-1 = "覺得怎麼樣呀，老師。\n愛麗絲的新裝甲！"
10134-854-1630-1 = "就算沒有裝甲……"
10134-854-1640-1 = "即使失去了\n光之劍……"
10134-854-1650-1 = "即便如此，\n愛麗絲還是愛麗絲。"
10134-854-1660-1 = "只要大家都在……\n然後。"
10134-854-1670-1 = "老師也在的話！"
10134-854-1680-1 = "馬爾庫特……"
10134-854-1690-1 = "非常有最終BOSS的感覺！"
10134-854-1700-1 = "打倒之後……\n不會出現隱藏BOSS\n之類的吧……？"
10134-854-1710-1 = "如果能平安回去的話……"
10134-854-1720-1 = "想向大家介紹Kei！"
10134-854-1730-1 = "乓啪喀乓──！"
10134-854-1740-1 = "老師獲得了報酬！"
10134-854-1750-1 = "真厲害，老師！"
10134-854-1760-1 = "就這樣一步步\n繼續前進吧！"
10134-854-1770-1 = "嗚嗚……愛麗絲也想\n在老師身邊一起慶祝！"
10134-854-1780-1 = "是！愛麗絲最喜歡\n始終如一的老師了！"
