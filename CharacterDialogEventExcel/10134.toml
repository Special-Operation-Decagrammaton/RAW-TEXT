[translation]
10134-854-1550-1 = "คุณครู!\nภารกิจมาแล้วค่ะ ภารกิจ!"
10134-854-1560-1 = "งานของวันนี้\nคืออะไรเหรอคะ?"
10134-854-1570-1 = "อ๊ะ อาริสึต้องเป็น\nคนจัดการให้นี่คะ..."
10134-854-1580-1 = "ขอทักทายทางออนไลน์ค่ะ\nคุณครู! อาริสึเองค่ะ!"
10134-854-1590-1 = "กลายเป็นเรื่องใหญ่\nเข้าให้แล้วนะคะ..."
10134-854-1600-1 = "แต่เราจะชนะไปด้วยกันค่ะ!"
10134-854-1610-1 = "ฮุ ฮุ ฮุ..."
10134-854-1620-1 = "ชุดเกราะใหม่ของอาริสึ\nเป็นยังไงบ้างคะ คุณครู?"
10134-854-1630-1 = "ถึงจะไม่มีชุดเกราะ..."
10134-854-1640-1 = "และต่อให้\nจะไม่มีดาบแห่งแสง..."
10134-854-1650-1 = "แต่ยังไง\nอาริสึก็ยังเป็นอาริสึค่ะ"
10134-854-1660-1 = "ตราบใดที่ได้อยู่กับทุกคน"
10134-854-1670-1 = "และมีคุณครูอยู่ด้วยน่ะค่ะ!"
10134-854-1680-1 = "มัลคูธ..."
10134-854-1690-1 = "เป็นเหมือนกับ\nบอสตัวสุดท้ายสินะคะ!"
10134-854-1700-1 = "ว่าแต่... คงไม่มีบอสลับตัวอื่น\nโผล่มาหรอกใช่มั้ยคะ...?"
10134-854-1710-1 = "ถ้าได้กลับไปอย่างปลอดภัย..."
10134-854-1720-1 = "อาริสึอยากแนะนำเคย์\nให้ทุกคนรู้จักค่ะ!"
10134-854-1730-1 = "ปาปัม ปาปัม ป๊าม!"
10134-854-1740-1 = "คุณครู\nได้รับรางวัลแล้วค่ะ!"
10134-854-1750-1 = "เยี่ยมมากเลยค่ะ คุณครู!"
10134-854-1760-1 = "ค่อยๆ ทำไป\nทีละอย่างนะคะ!"
10134-854-1770-1 = "งือ... อาริสึก็อยากไปยินดี\nกับคุณครูตรงนั้นนะคะ!"
10134-854-1780-1 = "ค่ะ! อาริสึชอบคุณครูที่เสมอต้น\nเสมอปลายมากๆ เลยละค่ะ!"
