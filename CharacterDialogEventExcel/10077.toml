[translation]
10077-830-130-1 = "ようこそ！こっちは\n準備万端っすよ！"
10077-830-140-1 = "さて、ぼちぼち\n始めるっす！"
10077-830-150-1 = "これであと半分、\nっすかね？"
10077-830-160-1 = "あと少しっすね。\n手伝えるものがあれば、\nなんでも\n言ってほしいっす！"
10077-830-170-1 = "じゃ、さーっと\n見てみるっす！"
10077-830-180-1 = "はい、私はここっすよ。"
10077-830-190-1 = "ん……？\nさっきから\nどうしたんすか？"
10077-830-200-1 = "そんなイタズラ、\nよくないっすよ～\nひひっ。"
10077-830-210-1 = "はは、先生、そんな\n何度も呼ばなくても。\n私はここで\n常時待機してるっすよ。"
10077-830-310-1 = "はっ！先生！\nちょうどいいところに！"
10077-830-320-1 = "リストのチェックっすね？\nこっちに用意してありますんで！"
10077-830-330-1 = "おっと！なんすか、先生。\n同じこと、やり返しちゃっても\nいいんすか？"
10077-830-340-1 = "……今度、\n覚悟しておくっすよ！"
10077-830-350-1 = "はい！確認完了っす～！"
10077-830-360-1 = "それっすか？\n押さえておくっす！"
10077-830-370-1 = "今日はこれで終わりっと！\nははっ！先生、この後は\n何するんすか？"
