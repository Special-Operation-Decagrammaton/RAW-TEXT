[translation]
10077-830-130-1 = "ยินดีต้อนรับค่า~!\nทางนี้เตรียมพร้อมไว้\nอย่างเต็มที่แล้วค่ะ!"
10077-830-140-1 = "เอาละ มาเริ่มกันเลยค่ะ!"
10077-830-150-1 = "เหลืออีกครึ่งหนึ่งใช่มั้ยคะ?"
10077-830-160-1 = "เราใกล้จะถึงแล้วค่ะ\nถ้ามีอะไรที่ฉันช่วยได้\nบอกฉันได้ทุกอย่างเลยนะคะ!"
10077-830-170-1 = "ถ้างั้นฉันจะไปดูรอบๆ นะคะ!"
10077-830-180-1 = "ค่ะ ฉันอยู่ตรงนี้ค่ะ"
10077-830-190-1 = "หืม...?\nเป็นอะไรไปตั้งแต่เมื่อกี้แล้วคะ?"
10077-830-200-1 = "แกล้งกันแบบนั้นไม่ดีนะคะ~\nฮิฮิ"
10077-830-210-1 = "ฮ่าฮ่า คุณครู\nไม่ต้องเรียกหลายๆ ครั้งแบบนั้น\nก็ได้นะคะ ยังไงฉัน\nก็อยู่ตรงนี้ตลอดเวลาอยู่แล้ว"
10077-830-310-1 = "เฮือก! คุณครู!\nมาได้จังหวะพอดีเลย!"
10077-830-320-1 = "จะตรวจสอบรายการของใช่มั้ยคะ?\nฉันเตรียมไว้ทางนี้แล้วค่ะ!"
10077-830-330-1 = "อ๊ะ! ทำอะไรน่ะคุณครู!\nคิดจะทำซ้ำๆ งั้นเหรอคะ?"
10077-830-340-1 = "...ต่อไปก็เตรียมตัวโดนได้เลยค่ะ!"
10077-830-350-1 = "ค่ะ! ตรวจสอบเสร็จแล้วค่า~!"
10077-830-360-1 = "อันนั้นเหรอคะ? ฉันจะไปจัดการไว้ให้ค่ะ!"
10077-830-370-1 = "เท่านี้งานของวันนี้ก็เสร็จแล้ว!\nฮิฮิ! คุณครู ทำอะไรต่อดีล่ะ?"
