[translation]
10077-830-130-1 = "어서 오십쇼~!\n이쪽은 준비만전임다!"
10077-830-140-1 = "자, 슬슬 시작함다!"
10077-830-150-1 = "앞으로 반, 남았을까요?"
10077-830-160-1 = "거의 다 왔슴다.\n도울 수 있는 것이 있다면\n뭐든지 말해주십쇼!"
10077-830-170-1 = "그럼, 쭉- 한번 둘러보겠슴다!"
10077-830-180-1 = "네. 저 여기 있슴다."
10077-830-190-1 = "음…?\n아까부터 왜 그러심까?"
10077-830-200-1 = "그런 장난은 좋지 않슴다~.\n히히."
10077-830-210-1 = "하하, 선생님.\n그렇게 몇 번이고 부르지\n않으셔도 저는 여기서 상시\n대기하고 있슴다."
10077-830-310-1 = "헉! 선생님!\n딱 좋은 타이밍에!"
10077-830-320-1 = "리스트 체크 하실거죠?\n이쪽에 준비해놨슴다!"
10077-830-330-1 = "앗! 뭐 하시는 검까, 선생님!\n똑같은 짓 해버리는 수가 있어요?"
10077-830-340-1 = "…다음엔, 각오해 두십쇼!"
10077-830-350-1 = "네! 확인 완료임다~!"
10077-830-360-1 = "그검까? 정리해 두겠슴다!"
10077-830-370-1 = "오늘은 이걸로 끝!\n하핫! 선생님. 이제는 뭐 하실 검까?"
