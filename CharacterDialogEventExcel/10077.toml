[translation]
10077-830-130-1 = "Welcome! I'm ready as I'll ever be!"
10077-830-140-1 = "Let's get started!"
10077-830-150-1 = "Wouldn't you say there's about half left?"
10077-830-160-1 = "We're almost there. If there's anything I can do to help, please let me know!"
10077-830-170-1 = "Very good. I'll take a look around!"
10077-830-180-1 = "Yes. I'm right here."
10077-830-190-1 = "Hm...? What's wrong?"
10077-830-200-1 = "I don't care for this kind of joke... Heehee."
10077-830-210-1 = "Oh, Sensei. You don't have to call me like that multiple times. I'm always on standby right here."
10077-830-310-1 = "Oh! Sensei! Perfect timing!"
10077-830-320-1 = "You're going to check the list, aren't you? I've prepared it for you!"
10077-830-330-1 = "Ah! What's this, Sensei? Are you going to do the same thing?"
10077-830-340-1 = "...Next time, come prepared!"
10077-830-350-1 = "Yes! Confirmation complete!"
10077-830-360-1 = "Is that it? Let's clean up!"
10077-830-370-1 = "That's it for today! Haha! What are you going to do now, Sensei?"
