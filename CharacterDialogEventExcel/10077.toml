[translation]
10077-830-130-1 = "歡迎！\n這邊已經準備就緒囉！"
10077-830-140-1 = "來，一步步開始吧！"
10077-830-150-1 = "這樣一來，\n只剩下一半了吧？"
10077-830-160-1 = "沒剩多久了呢。\n如果有我能幫忙的地方，\n希望你儘管說！"
10077-830-170-1 = "那麼，大致瀏覽一下吧！"
10077-830-180-1 = "是，我在這裡唷 。"
10077-830-190-1 = "嗯……？\n從剛才開始\n怎麼了嗎？"
10077-830-200-1 = "那種惡作劇，\n不太好唷～嘻嘻。"
10077-830-210-1 = "哈哈，老師，\n不用叫那麼多次。\n我會一直\n在這裡待命唷。"
10077-830-310-1 = "啊！老師！\n來得正好！"
10077-830-320-1 = "是來確認清單的吧？\n已經準備在這裡囉！"
10077-830-330-1 = "哎呀！怎麼這樣呢，老師。\n我也可以用同樣的方式回擊嗎？"
10077-830-340-1 = "……下次要做好覺悟唷！"
10077-830-350-1 = "好！確認完畢～！"
10077-830-360-1 = "是那個嗎？\n我會搞定的！"
10077-830-370-1 = "今天就到此為止！\n哈哈！老師，\n你之後打算做什麼呢？"
