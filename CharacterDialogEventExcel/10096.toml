[translation]
10096-837-10-1 = "先生。\nお待ちしておりました。\n準備運動はしましたか？"
10096-837-20-1 = "ウォーターパークで\n楽しい時間を\nお過ごしください。"
10096-837-30-1 = "プールは\n楽しんでいますか？"
10096-837-40-1 = "いつも伝えておりますが、\n安全第一ですよ。"
10096-837-50-1 = "……私がここまで\n来れたのも、すべて\n先生のおかげです。"
10096-837-60-1 = "最後まで頑張りましょう。"
10096-837-70-1 = "肩の荷が降りたような、\nでも、どこか寂しいような\n気分です。"
10096-837-80-1 = "先生はどうですか？"
10096-837-90-1 = "水着でなければなら\nないのは分かりますが……\nあまり慣れませんね。"
10096-837-100-1 = "ウォーターパークか……\n縁がないと\n思っていたけど……"
10096-837-110-1 = "何事も過信は\nよくありません。"
10096-837-120-1 = "要救助者を見つけたら\nすぐに知らせてください。"
10096-837-130-1 = "い、いらっしゃいませ！\nようこそ！"
10096-837-140-1 = "こほん……やはり、\nあまり慣れませんね。"
10096-837-380-1 = "こちらは特別ショップです。\n必要なものがあれば購入していってください。"
10096-837-390-1 = "おすすめ……ですか。\nよくわかりません。\n先生の審美眼を信じております。"
10096-837-400-1 = "営業は終了しましたが、\nパークはまだ運営しているようです。"
10096-837-410-1 = "最後までお楽しみください。"
10096-837-420-1 = "はい、何かお探しですか？"
10096-837-430-1 = "……先生、\n私ではなく商品を見てください。"
10096-837-440-1 = "ああ、それは私も気になっていた商品です。"
10096-837-450-1 = "ご購入ありがとうございます。\n先生のお役に\n立つといいですね。"
10096-837-460-1 = "それを選ぶとは、\n見る目がありますね。\nさすが先生です。"
10096-837-470-1 = "わ、私へのプレゼントはいりません。\nまだ業務中ですから……。"
