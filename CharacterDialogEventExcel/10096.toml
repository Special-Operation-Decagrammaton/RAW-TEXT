[translation]
10096-837-10-1 = "Sensei, I've been waiting for you. Have you done your warm-up exercises?"
10096-837-20-1 = "Enjoy yourself at the water park."
10096-837-30-1 = "Are you enjoying playing in the water?"
10096-837-40-1 = "As I always say, nothing is more important than safety."
10096-837-50-1 = "...I've made it this far thanks to you, Sensei."
10096-837-60-1 = "Let's make sure to finish strong."
10096-837-70-1 = "It's a bittersweet feeling."
10096-837-80-1 = "How do you feel, Sensei?"
10096-837-90-1 = "I know I have to wear a swimsuit, but...it's awkward."
10096-837-100-1 = "A water park... I didn't expect to feel any connection to it."
10096-837-110-1 = "No matter the situation, overconfidence is never a good thing."
10096-837-120-1 = "If you encounter anyone in need of rescue, please inform us immediately."
10096-837-130-1 = "P-Please come in! Welcome!"
10096-837-140-1 = "Ahem. As I expected, I still can't get used to this."
10096-837-380-1 = "This is a specialty shop. If you need anything, feel free to make a purchase."
10096-837-390-1 = "A recommendation...? I'm not sure, but I'll rely on your judgement, Sensei."
10096-837-400-1 = "The shops are closed, but it looks like the park will be open for a little longer."
10096-837-410-1 = "Make sure to enjoy it until the very end."
10096-837-420-1 = "Yes? Is there something you're looking for?"
10096-837-430-1 = "...Sensei, please view the products, not me."
10096-837-440-1 = "Ah, that's a product I was curious about as well."
10096-837-450-1 = "Thank you for your purchase. I hope you'll find it useful, Sensei."
10096-837-460-1 = "Choosing that one shows you have great taste. Very impressive."
10096-837-470-1 = "Th-There's no need to get me a gift. I'm still at work anyway..."
