[translation]
10096-837-10-1 = "คุณครู กำลังรออยู่เลยค่ะ\nวอร์มอัปมาแล้วหรือยังคะ?"
10096-837-20-1 = "ขอให้มีช่วงเวลา\nที่สนุกในสวนน้ำนะคะ"
10096-837-30-1 = "สนุกกับการเล่นน้ำ\nอยู่หรือเปล่าคะ?"
10096-837-40-1 = "ถึงฉันจะย้ำอยู่ตลอด แต่เรื่อง\nความปลอดภัยสำคัญที่สุดนะคะ"
10096-837-50-1 = "ที่ฉันมาถึงตรงนี้ได้\nทั้งหมดก็เพราะ\nได้คุณครูช่วยไว้ค่ะ"
10096-837-60-1 = "ฉันจะพยายาม\nจนถึงที่สุดเลยค่ะ"
10096-837-70-1 = "ฉันรู้สึกโล่งใจ\nแต่ก็เสียดายค่ะ"
10096-837-80-1 = "แล้วคุณครูล่ะคะ?"
10096-837-90-1 = "ฉันรู้ว่าต้องใส่\nชุดว่ายน้ำ...\nแต่มันเขินน่ะค่ะ"
10096-837-100-1 = "สวนน้ำ...\nคิดว่าฉันดวงไม่สมพงษ์\nกับที่แบบนี้ซะอีก..."
10096-837-110-1 = "ไม่ว่าเรื่องอะไร\nถ้าเชื่อมากไปก็ไม่ดีค่ะ"
10096-837-120-1 = "ถ้าเจอคนที่ต้อง\nให้ความช่วยเหลือ\nก็บอกทันทีเลยนะคะ"
10096-837-130-1 = "ชะ... เชิญค่ะ!\nยินดีต้อนรับค่ะ!"
10096-837-140-1 = "อะแฮ่ม... ยังไม่ชิน\nจริงๆ ด้วยนะคะ"
10096-837-380-1 = "ที่นี่คือร้านค้าพิเศษค่ะ\nถ้ามีของที่ต้องการก็ซื้อไปนะคะ"
10096-837-390-1 = "ให้แนะนำ... เหรอคะ? ไม่รู้สิคะ\nฉันเชื่อในสายตาของคุณครูค่ะ"
10096-837-400-1 = "ร้านค้าปิดแล้วค่ะ แต่เหมือนสวนน้ำ\nจะยังเปิดต่ออีกหน่อยนะคะ"
10096-837-410-1 = "หวังว่าจะสนุกกันไปจนถึง\nตอนปิดทำการเลยนะคะ"
10096-837-420-1 = "ค่ะ มีชิ้นไหนในใจหรือเปล่าคะ?"
10096-837-430-1 = "คุณครู... มองของสิคะ ไม่ใช่มองฉัน"
10096-837-440-1 = "อ่า ฉันก็สงสัยเกี่ยวกับชิ้นนั้น\nเหมือนกันค่ะ"
10096-837-450-1 = "ขอบคุณที่ซื้อค่ะ หวังว่าจะเป็น\nประโยชน์กับคุณครูนะคะ"
10096-837-460-1 = "เลือกชิ้นนั้นเหรอคะเนี่ย\nตาถึงนะคะ สมแล้วค่ะที่เป็นคุณครู"
10096-837-470-1 = "ฉะ... ฉันไม่เอาของขวัญหรอกค่ะ\nฉันอยู่ระหว่างการทำงานด้วย..."
10096-10837-10-1 = "คุณครู กำลังรออยู่เลยค่ะ\nวอร์มอัปมาแล้วหรือยังคะ?"
