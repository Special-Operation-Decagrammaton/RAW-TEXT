[translation]
20025-809-1250-1 = "老，老老老老，老師！？\n歡，歡迎回來！\n還有，對，對不起！"
20025-809-1260-1 = "……嘿嘿……\n竟然會在這裡\n見到老師……"
20025-809-1270-1 = "沒，沒有！\n我沒有什麼\n特別的意思……！"
20025-809-1280-1 = "雖然不是很清楚……\n好像變成非常\n嚴重的事情了呢……"
20025-809-1290-1 = "要，要全部破壞掉嗎？"
20025-809-1300-1 = "亞瑠大人他……\n好像很開心……"
20025-809-1310-1 = "太好了。\n嘿，嘿嘿……"
20025-809-1320-1 = "騷動似乎終於\n平息下來了…… "
20025-809-1330-1 = "那個，那部機器人……\n是怎麼回事呢……？"
20025-809-1340-1 = "是，是！？\n怎，怎怎怎怎，\n怎麼了嗎，老師！？"
20025-809-1350-1 = "咦……？只是……\n想叫叫看而已？"
20025-809-1360-1 = "是，是這樣啊。\n耶，嘿嘿……"
20025-809-1370-1 = "在新年……\n跟便利屋的各位…\n和老師像這樣……"
20025-809-1380-1 = "耶嘿嘿……\n是種，有點\n特別的感覺。"
20025-809-1390-1 = "老師。果然就算，跟，\n跟我這種人在一起……\n也不會多開心……"
20025-809-1400-1 = "沒那種事……是嗎？\n這，這樣啊……"
20025-809-1410-1 = "……謝，謝謝你，老師。"
