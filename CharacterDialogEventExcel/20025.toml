[translation]
20025-809-1250-1 = "คะคะคะคะ...คุณครู?!\nชะชะชะ... เชิญเลยค่ะ!\nละละ ละ... แล้วก็...ขอโทษด้วยค่ะ!"
20025-809-1260-1 = "แหะๆ...\nได้เจอคุณครู\nในที่แบบนี้ด้วย..."
20025-809-1270-1 = "ปะ...เปล่าค่ะ!\nมะ...ไม่ได้มีความหมาย\nพิเศษอะไรหรอกค่ะ...!"
20025-809-1280-1 = "ฉันเองก็ไม่ค่อยเข้าใจเท่าไร...\nแต่ดูเหมือนว่ามันจะกลายเป็น...\nเรื่องใหญ่ไปแล้วนะคะ"
20025-809-1290-1 = "...ทำลายทุกอย่าง\nทิ้งเลยดีมั้ยคะ?"
20025-809-1300-1 = "ดูเหมือนท่านอารุ...\nจะสนุกอยู่เลยนะคะ..."
20025-809-1310-1 = "ค่อยยังชั่วหน่อยนะคะ\nแหะๆๆ..."
20025-809-1320-1 = "ดูเหมือนเรื่องวุ่นวาย\nจะค่อยๆ สงบลงแล้วนะคะ... "
20025-809-1330-1 = "คือว่าหุ่นยนต์ตัวนั้น...\nมันอะไรกันคะนั่น...?"
20025-809-1340-1 = "คะ...คะ?!\nมะมะมะ... มีอะไร...\nเหรอคะคุณครู?!"
20025-809-1350-1 = "คะ...? ก็แค่...\nลองเรียกดูเฉยๆ เหรอคะ?"
20025-809-1360-1 = "งะ... งั้นเหรอคะ?\nแหะๆๆ..."
20025-809-1370-1 = "ฉลองวันปีใหม่...\nกับทุกคนในหน่วยรับจ้าง...\nพร้อมกับคุณครูแบบนี้..."
20025-809-1380-1 = "แหะๆๆ...\nรู้สึกว่ามันพิเศษ\nมากๆ เลยละค่ะ "
20025-809-1390-1 = "คิดแล้วเชียวว่าการที่คุณครู\nตะ... ต้องมาอยู่กับ...\nคนอย่างฉัน มันคงไม่สนุก..."
20025-809-1400-1 = "ไม่ใช่อย่างนั้นเลย...\nงะ...งั้นเหรอคะ..."
20025-809-1410-1 = "ขะ...ขอบคุณ...นะคะ\nคุณครู"
