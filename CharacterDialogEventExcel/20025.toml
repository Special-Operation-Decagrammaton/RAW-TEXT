[translation]
20025-809-1250-1 = "せ、せせせ、先生！？\nお、おかえりなさい！\nそして、す、すみません！"
20025-809-1260-1 = "……へへ……\nここで先生に\n会えるなんて……"
20025-809-1270-1 = "い、いいえ！なにか\n特別な意味が\nあるとかではなく……！"
20025-809-1280-1 = "よくわからないですが……\nとんでもないことになって\nしまったみたいです……"
20025-809-1290-1 = "ぜ、全部\n壊しちゃいましょうか？"
20025-809-1300-1 = "アル様は……\n楽しんでるみたいです……"
20025-809-1310-1 = "よかったです。\nへ、へへ……"
20025-809-1320-1 = "やっと騒動が\n落ち着いたみたいです……"
20025-809-1330-1 = "えっと、あの\nロボットは……何だったん\nでしょうか……？"
20025-809-1340-1 = "は、はいっ！？\nど、どどど、\nどうしましたか、先生！？"
20025-809-1350-1 = "へ……？ただ……\n呼んでみただけ？"
20025-809-1360-1 = "そ、そうなんですね。\nえ、へへ……。"
20025-809-1370-1 = "新年を迎えて……\n便利屋のみんなと……\n先生とこうして……"
20025-809-1380-1 = "えへへ……\n少し、特別な、\n気持ちです。"
20025-809-1390-1 = "先生。やはり、わ、\n私なんかといても……\nそんな楽しく……"
20025-809-1400-1 = "そんなことない\n……ですか？\nそう、ですか……。"
20025-809-1410-1 = "……あ、ありがとう、\nございます。先生。"
