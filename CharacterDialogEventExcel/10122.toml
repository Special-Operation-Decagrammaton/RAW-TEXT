[translation]
10122-848-10-1 = "やっほー先生。\n楽しんでる？"
10122-848-20-1 = "う～ん……こんな時、\n先生だったら\nどうするのかな……？"
10122-848-30-1 = "ちょっと予想外の\n展開なんだけど……。"
10122-848-40-1 = "ま、何とかなるよね。\n多分！"
10122-848-50-1 = "しっかりしないと。"
10122-848-60-1 = "また何が起こるか\n分からないわけだし！"
10122-848-70-1 = "ふぅ～\nなんとか終わって\nよかった。"
10122-848-80-1 = "先生がいなかったら\nどうなっちゃって\nたんだろ……"
10122-848-90-1 = "考えたくも\nないなぁ……。"
10122-848-100-1 = "先生と一緒でよかった～"
10122-848-110-1 = "知ってると思うけど、"
10122-848-120-1 = "私ってちょっと\nそそっかしいところが\nあるからさ……"
10122-848-130-1 = "なになに？"
10122-848-140-1 = "もしかして、私が必要？"
10122-848-150-1 = "あはは、\nく、くすぐったいよ、\n先生！"
10122-848-160-1 = "いいのかな～？\n私もやっちゃうよ～？"
10122-848-170-1 = "先生……？\nそろそろやめて\n欲しいかな……って。"
10122-848-180-1 = "あっ！\n嫌じゃないよ！\nぜんぜん！"
10122-848-190-1 = "でも……勘違い\nしちゃいそうだから。"
10122-848-1220-1 = "うわぁ、やること\nいっぱいだね……。"
10122-848-1230-1 = "せっかく海に来てるのに……\nまだお仕事するの……？"
10122-848-1240-1 = "めんどくさいよぉ……。"
10122-848-1250-1 = "ご褒美があったら、\nやる気出るかもなんだけどな～"
10122-848-1260-1 = "ね、先生。"
10122-848-1270-1 = "……一緒に、サボっちゃお♪"
10122-848-1280-1 = "わーお！\nさすが、先生だね☆"
10122-848-1290-1 = "おぉっ、\n良い波乗れてるじゃん！"
