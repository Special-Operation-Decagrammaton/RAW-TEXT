[translation]
10122-848-10-1 = "ยะฮู้ว คุณครู!\nกำลังสนุกอยู่หรือเปล่า?"
10122-848-20-1 = "อืม... ถ้าเป็นคุณครูจะจัดการ\nสถานการณ์แบบนี้\nยังไงกันนะ..."
10122-848-30-1 = "ดูแตกต่างจาก\nที่คิดไว้นิดหน่อย..."
10122-848-40-1 = "แต่ถึงยังไงก็\nคงเป็นไปได้ด้วยดีละนะ~!"
10122-848-50-1 = "คงต้องตื่นตัว\nอยู่เสมอแล้วละ"
10122-848-60-1 = "ก็เราไม่รู้นี่นาว่าจะ\nเกิดเรื่องอะไรขึ้นมาอีก"
10122-848-70-1 = "ฮื้ม~ ถึงยังไง\nก็ปิดงานจนได้สินะ"
10122-848-80-1 = "ถ้าไม่มีคุณครู\nจะเป็นยังไงนะ..."
10122-848-90-1 = "ไม่อยากแม้แต่จะคิดเลย..."
10122-848-100-1 = "โชคดีจังเลย\nที่มีคุณครูอยู่ด้วย~"
10122-848-110-1 = "ฉันก็รู้อยู่แล้วละ"
10122-848-120-1 = "ก็ฉันเป็นคนค่อนข้างจะ\nไม่ค่อยรอบคอบนี่นา..."
10122-848-130-1 = "หืม? มีเรื่องอะไรเหรอ?"
10122-848-140-1 = "หรือว่าต้องการมิกะ~?"
10122-848-150-1 = "อะฮ่าฮ่า\nจะ... จั๊กจี้นะ คุณครู!"
10122-848-160-1 = "จะไหวหรือเปล่า~?\nเดี๋ยวฉันเอาคืนนะ~?"
10122-848-170-1 = "คุณครู...?\nฉันอยากให้...\nหยุดได้แล้วละ"
10122-848-180-1 = "อ๊ะ ฉันไม่ได้ไม่ชอบนะ! ไม่เลย!"
10122-848-190-1 = "แต่ว่า... ฉันกลัวจะ\nเข้าใจผิดไปน่ะ"
10122-848-1220-1 = "ว้าว มีงานต้องทำเยอะจัง..."
10122-848-1230-1 = "อุตส่าห์ได้มาทะเลแท้ๆ...\nยังทำงานอยู่อีกเหรอ...?"
10122-848-1240-1 = "ขี้เกียจจัง..."
10122-848-1250-1 = "ถ้ามีรางวัลให้\nก็อาจจะอยากทำก็ได้นะ~"
10122-848-1260-1 = "ฮุฮุ คุณครู..."
10122-848-1270-1 = "มาโดดงานกันสักเดี๋ยวมั้ย?\nว่าไงล่ะ?"
10122-848-1280-1 = "ว้าว! สมกับที่เป็นคุณครูเลย☆"
10122-848-1290-1 = "อื้อ ดีเลย! ฉันมีพลังเต็มเปี่ยมเลยละ!"
