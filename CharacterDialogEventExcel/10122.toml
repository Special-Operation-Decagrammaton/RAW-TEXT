[translation]
10122-848-10-1 = "Yahoo! Are you having fun, Sensei?"
10122-848-20-1 = "Hmm. What would Sensei do...?"
10122-848-30-1 = "Things aren't going quite how I expected..."
10122-848-40-1 = "I'm sure it'll work out, one way or another!"
10122-848-50-1 = "I shouldn't let my guard down."
10122-848-60-1 = "There's no telling what'll happen next."
10122-848-70-1 = "Phew! Things wrapped up, somehow!"
10122-848-80-1 = "I wonder how it would've played out if you weren't here, Sensei."
10122-848-90-1 = "I don't even want to think about it..."
10122-848-100-1 = "I'm glad you were with me."
10122-848-110-1 = "I'm sure you already know this..."
10122-848-120-1 = "...but I can be a bit clumsy."
10122-848-130-1 = "Hm? Did something happen?"
10122-848-140-1 = "Something that may require my help?"
10122-848-150-1 = "Ahaha, th-that tickles, Sensei!"
10122-848-160-1 = "You sure about that? I might retaliate, you know!"
10122-848-170-1 = "Sensei...? I'm starting to wish...that you'd stop."
10122-848-180-1 = "Ah, I don't hate it! Not at all!"
10122-848-190-1 = "But...I might misunderstand."
10122-848-1220-1 = "Whoa, so much to do..."
10122-848-1230-1 = "You're working...at the beach...?"
10122-848-1240-1 = "What a bother..."
10122-848-1250-1 = "I could be convinced...with a reward!"
10122-848-1260-1 = "Fufu, Sensei..."
10122-848-1270-1 = "What do you think about playing hooky?"
10122-848-1280-1 = "Wow! I'd expect nothing less from you, Sensei!"
10122-848-1290-1 = "Okay, great! We're picking up the pace!"
