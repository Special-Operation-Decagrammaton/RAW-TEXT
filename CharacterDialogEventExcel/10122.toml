[translation]
10122-848-10-1 = "얏호- 선생님.\n즐기고 있어?"
10122-848-20-1 = "으음. 선생님은\n어떻게 대처하려나,\n이런 상황……"
10122-848-30-1 = "뭔가 생각과는\n조금 다른 전개지만……"
10122-848-40-1 = "그래도,\n어떻게든 되려나~!"
10122-848-50-1 = "긴장을 놓지\n말아야겠네."
10122-848-60-1 = "무슨 일이\n또 일어날지\n모르니까 말야."
10122-848-70-1 = "후아~ 어쨌든\n마무리가 됐네."
10122-848-80-1 = "선생님이 없었다면\n어떻게 되었을지……"
10122-848-90-1 = "생각하기도 싫어……"
10122-848-100-1 = "선생님과 함께라서\n다행이다~"
10122-848-110-1 = "알고 있겠지만,"
10122-848-120-1 = "나 좀 덤벙대는\n부분이 있으니까…."
10122-848-130-1 = "응? 무슨 일 있어?"
10122-848-140-1 = "미카가 필요하다거나~?"
10122-848-150-1 = "아하하,\n가, 간지러워 선생님!"
10122-848-160-1 = "괜찮겠어~?\n나도 한다~?"
10122-848-170-1 = "선생님……?\n슬슬 멈춰줬으면……\n하는데."
10122-848-180-1 = "아, 싫진 않아! 전혀!"
10122-848-190-1 = "하지만……\n착각해 버릴 것\n같아서."
10122-848-1220-1 = "우와, 할 일 많아……"
10122-848-1230-1 = "모처럼 바다에 왔는데……\n아직도 일해……?"
10122-848-1240-1 = "귀찮아……"
10122-848-1250-1 = "포상이 있다면,\n할 마음이 생길지도~"
10122-848-1260-1 = "후후, 선생님……"
10122-848-1270-1 = "잠깐만 땡땡이칠래? 어때?"
10122-848-1280-1 = "와-오! 역시 선생님이네☆"
10122-848-1290-1 = "응, 좋아! 기세를 타버렸다구!"
