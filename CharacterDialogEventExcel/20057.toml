[translation]
20057-843-980-1 = "お待ちしておりました、\n先生。"
20057-843-990-1 = "ミレニアムの案内は\nお任せください。"
20057-843-1000-1 = "行きたい場所があれば、\n遠慮なく\n仰ってくださいね。"
20057-843-1010-1 = "普段から賑やかですが、"
20057-843-1020-1 = "今日のミレニアムは\n一入ですね。"
20057-843-1030-1 = "活気があるのは、\n良いことですが。"
20057-843-1040-1 = "いよいよ大詰めですね。"
20057-843-1050-1 = "EXPOも、\n人騒がせな事件も。"
20057-843-1060-1 = "ミレニアムEXPO、\nお楽しみ\nいただけましたか？"
20057-843-1070-1 = "私は先生とご一緒できて\n光栄でした。"
20057-843-1080-1 = "……ええ、とても。"
20057-843-1090-1 = "こうして先生と\n時間を過ごせること……。"
20057-843-1100-1 = "私は、それが\n本当に嬉しいのです。"
20057-843-1110-1 = "お腹が空いたら\n仰ってくださいね。"
20057-843-1120-1 = "オススメの学食が\nあるんです。"
20057-843-1130-1 = "「メイド」の私であれば\n手料理をご用意する\nところですが……。"
20057-843-1140-1 = "今は、\n「生徒」ですから。"
20057-843-1150-1 = "お呼びでしょうか、先生？"
20057-843-1160-1 = "呼んだだけ、ですか……？"
20057-843-1170-1 = "うふふっ、\nあらあら。"
20057-843-1180-1 = "ふふっ。"
20057-843-1190-1 = "私、くすぐりには\n強い方でして。"
20057-843-1200-1 = "先生は……\nどうなのか\n教えていただけますか？"
