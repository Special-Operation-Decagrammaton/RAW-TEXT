[translation]
20057-980 = "恭候多時了，老師。"
20057-990 = "千年的導覽就交給我吧。"
20057-1000 = "如果有想去的地方，\n請隨時跟我說。"
20057-1010 = "雖然平時就很熱鬧……"
20057-1020 = "今天的千年\n又更是如此呢。"
20057-1030 = "雖然有活力\n是件好事……"
20057-1040 = "終於來到\n最後階段了呢。"
20057-1050 = "無論是EXPO，\n還是讓人恐慌的事件。"
20057-1060 = "千年EXPO，\n老師玩得開心嗎？"
20057-1070 = "我很榮幸能和\n老師一起度過。"
20057-1080 = "……嗯，是真的。"
20057-1090 = "能像這樣和老師\n度過時光……"
20057-1100 = "我真的感到很高興。"
20057-1110 = "如果肚子餓了\n請跟我說哦。"
20057-1120 = "我有推薦的學生餐廳。"
20057-1130 = "如果是「女僕」的我\n就親自準備了……"
20057-1140 = "但是，我現在\n是「學生」。"
20057-1150 = "您叫我嗎，老師？"
20057-1160 = "只是叫看看嗎……？"
20057-1170 = "唔呵呵，哎呀哎呀。"
20057-1180 = "呵呵。"
20057-1190 = "我不是會怕癢的人哦。"
20057-1200 = "至於老師是什麼類型……\n可以告訴我嗎？"
