[translation]
20057-843-980-1 = "기다리고 있었습니다,\n선생님."
20057-843-990-1 = "밀레니엄의 안내는\n맡겨주세요."
20057-843-1000-1 = "가고 싶은 곳이\n있으시다면 부담 없이\n말씀 주세요."
20057-843-1010-1 = "평소에도\n북적북적하지만……"
20057-843-1020-1 = "오늘 밀레니엄은\n한층 더하네요."
20057-843-1030-1 = "활기가 있는 건,\n좋은 일이지만요."
20057-843-1040-1 = "드디어 마무리네요."
20057-843-1050-1 = "EXPO도,\n떠들썩한 사건도."
20057-843-1060-1 = "밀레니엄 EXPO,\n즐겨주셨나요?"
20057-843-1070-1 = "저는 선생님과\n함께할 수 있어\n영광이었습니다."
20057-843-1080-1 = "……네, 정말로요."
20057-843-1090-1 = "이렇게 선생님과\n시간을 보내는 것이……"
20057-843-1100-1 = "저는,\n정말로 좋네요."
20057-843-1110-1 = "배가 고프면\n말씀해 주세요."
20057-843-1120-1 = "좋은 학생 식당을\n알고 있답니다."
20057-843-1130-1 = "메이드인 저라면\n당연히 직접\n요리해 드리겠지만……"
20057-843-1140-1 = "지금 저는,\n'학생'이니까요."
20057-843-1150-1 = "부르셨나요, 선생님?"
20057-843-1160-1 = "그냥 불러 보셨다고요?"
20057-843-1170-1 = "우후훗.\n어머나."
20057-843-1180-1 = "후후."
20057-843-1190-1 = "저는 그렇게까지\n간지러움을\n잘 타지 않는답니다."
20057-843-1200-1 = "선생님께서는……\n어떠신지\n알려주시겠어요?"
