[translation]
20057-843-980-1 = "恭候多時了，老師。"
20057-843-990-1 = "千年的導覽就交給我吧。"
20057-843-1000-1 = "如果有想去的地方，\n請隨時跟我說。"
20057-843-1010-1 = "雖然平時就很熱鬧……"
20057-843-1020-1 = "今天的千年\n又更是如此呢。"
20057-843-1030-1 = "雖然有活力\n是件好事……"
20057-843-1040-1 = "終於來到\n最後階段了呢。"
20057-843-1050-1 = "無論是EXPO，\n還是讓人恐慌的事件。"
20057-843-1060-1 = "千年EXPO，\n老師玩得開心嗎？"
20057-843-1070-1 = "我很榮幸能和\n老師一起度過。"
20057-843-1080-1 = "……嗯，是真的。"
20057-843-1090-1 = "能像這樣和老師\n度過時光……"
20057-843-1100-1 = "我真的感到很高興。"
20057-843-1110-1 = "如果肚子餓了\n請跟我說哦。"
20057-843-1120-1 = "我有推薦的學生餐廳。"
20057-843-1130-1 = "如果是「女僕」的我\n就親自準備了……"
20057-843-1140-1 = "但是，我現在\n是「學生」。"
20057-843-1150-1 = "您叫我嗎，老師？"
20057-843-1160-1 = "只是叫看看嗎……？"
20057-843-1170-1 = "唔呵呵，哎呀哎呀。"
20057-843-1180-1 = "呵呵。"
20057-843-1190-1 = "我不是會怕癢的人哦。"
20057-843-1200-1 = "老師的話……\n可以告訴我嗎？"
