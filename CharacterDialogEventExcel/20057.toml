[translation]
20057-843-980-1 = "I've been waiting, Sensei."
20057-843-990-1 = "Let me be your guide in Millennium."
20057-843-1000-1 = "If there's any place you wish to go, please ask me."
20057-843-1010-1 = "While it is always bustling in Millennium..."
20057-843-1020-1 = "...it's reached a new level entirely today."
20057-843-1030-1 = "Though, it is good that things are so lively."
20057-843-1040-1 = "It's finally over."
20057-843-1050-1 = "Both the Expo and the commotion."
20057-843-1060-1 = "Did you enjoy the Millennium EXPO?"
20057-843-1070-1 = "I was honored to be able to spend time with you, Sensei."
20057-843-1080-1 = "...Yes, truly."
20057-843-1090-1 = "Being able to spend time with you like this..."
20057-843-1100-1 = "I quite like it."
20057-843-1110-1 = "Please let me know if you begin feeling hungry."
20057-843-1120-1 = "I know of a good dining hall."
20057-843-1130-1 = "If I were a maid, of course, I would simply cook for you..."
20057-843-1140-1 = "However, I'm just a student right now."
20057-843-1150-1 = "Did you say my name, Sensei?"
20057-843-1160-1 = "You called for me without a particular reason?"
20057-843-1170-1 = "Fufu. Oh my."
20057-843-1180-1 = "Fufu."
20057-843-1190-1 = "I am not very ticklish."
20057-843-1200-1 = "Sensei... How about you?"
