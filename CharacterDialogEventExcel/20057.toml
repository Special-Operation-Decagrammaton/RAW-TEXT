[translation]
20057-980 = "กำลังรออยู่เลยค่ะ\nคุณครู"
20057-990 = "เรื่องพาเดินทัวร์มิลเลเนียม\nให้เป็นหน้าที่ของฉันได้เลยค่ะ"
20057-1000 = "ถ้ามีที่ที่อยากไป\nก็บอกฉันได้เลย\nไม่ต้องเกรงใจกันนะคะ"
20057-1010 = "ปกติก็วุ่นวาย\nพอตัวอยู่แล้ว..."
20057-1020 = "มิลเลเนียมในวันนี้\nวุ่นวายกว่าเดิมอีกขั้น\nเลยละค่ะ"
20057-1030 = "ถึงการมีชีวิตชีวา\nจะเป็นเรื่องที่ดีก็ตามเถอะค่ะ"
20057-1040 = "ในที่สุดก็จบสักทีนะคะ"
20057-1050 = "ทั้งงานเอ็กซ์โป\nทั้งเรื่องโกลาหลด้วย"
20057-1060 = "สนุกกับงาน\nมิลเลเนียมเอ็กซ์โปมั้ยคะ?"
20057-1070 = "ฉันรู้สึกเป็นเกียรติมาก\nที่ได้อยู่กับคุณครูค่ะ"
20057-1080 = "ค่ะ... จริงๆ นะคะ"
20057-1090 = "การได้ใช้เวลา\nกับคุณครูแบบนี้..."
20057-1100 = "ฉัน... ชอบมากเลยค่ะ"
20057-1110 = "ถ้าเกิดว่าหิวละก็\nบอกกันได้นะคะ"
20057-1120 = "ฉันรู้จักโรงอาหาร\nนักเรียนดีๆ อยู่ค่ะ"
20057-1130 = "ถ้าฉันเป็นเมดละก็\nแน่นอนว่าต้อง\nทำอาหารให้อยู่แล้ว..."
20057-1140 = "แต่ฉันในตอนนี้\nเป็น 'นักเรียน' นี่คะ"
20057-1150 = "เรียกฉันเหรอคะ คุณครู?"
20057-1160 = "แค่ลองเรียกดูงั้นเหรอคะ?"
20057-1170 = "ฮุฮุฮุ\nตายจริง"
20057-1180 = "ฮุฮุ"
20057-1190 = "ฉันไม่ได้บ้าจี้\nขนาดนั้นหรอกนะคะ"
20057-1200 = "ส่วนคุณครู\nรู้สึกยังไง...\nช่วยบอกหน่อยได้มั้ยคะ?"
