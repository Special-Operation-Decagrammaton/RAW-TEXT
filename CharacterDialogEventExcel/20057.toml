[translation]
20057-843-980-1 = "กำลังรออยู่เลยค่ะ\nคุณครู"
20057-843-990-1 = "เรื่องพาเดินทัวร์มิลเลเนียม\nให้เป็นหน้าที่ของฉันได้เลยค่ะ"
20057-843-1000-1 = "ถ้ามีที่ที่อยากไป\nก็บอกฉันได้เลย\nไม่ต้องเกรงใจกันนะคะ"
20057-843-1010-1 = "ปกติก็วุ่นวาย\nพอตัวอยู่แล้ว..."
20057-843-1020-1 = "มิลเลเนียมในวันนี้\nวุ่นวายกว่าเดิมอีกขั้น\nเลยละค่ะ"
20057-843-1030-1 = "ถึงการมีชีวิตชีวา\nจะเป็นเรื่องที่ดีก็ตามเถอะค่ะ"
20057-843-1040-1 = "ในที่สุดก็จบสักทีนะคะ"
20057-843-1050-1 = "ทั้งงานเอ็กซ์โป\nทั้งเรื่องโกลาหลด้วย"
20057-843-1060-1 = "สนุกกับงาน\nมิลเลเนียมเอ็กซ์โปมั้ยคะ?"
20057-843-1070-1 = "ฉันรู้สึกเป็นเกียรติมาก\nที่ได้อยู่กับคุณครูค่ะ"
20057-843-1080-1 = "ค่ะ... จริงๆ นะคะ"
20057-843-1090-1 = "การได้ใช้เวลา\nกับคุณครูแบบนี้..."
20057-843-1100-1 = "ฉัน... ชอบมากเลยค่ะ"
20057-843-1110-1 = "ถ้าเกิดว่าหิวละก็\nบอกกันได้นะคะ"
20057-843-1120-1 = "ฉันรู้จักโรงอาหาร\nนักเรียนดีๆ อยู่ค่ะ"
20057-843-1130-1 = "ถ้าฉันเป็นเมดละก็\nแน่นอนว่าต้อง\nทำอาหารให้อยู่แล้ว..."
20057-843-1140-1 = "แต่ฉันในตอนนี้\nเป็น 'นักเรียน' นี่คะ"
20057-843-1150-1 = "เรียกฉันเหรอคะ คุณครู?"
20057-843-1160-1 = "แค่ลองเรียกดูงั้นเหรอคะ?"
20057-843-1170-1 = "ฮุฮุฮุ\nตายจริง"
20057-843-1180-1 = "ฮุฮุ"
20057-843-1190-1 = "ฉันไม่ได้บ้าจี้\nขนาดนั้นหรอกนะคะ"
20057-843-1200-1 = "ส่วนคุณครู\nรู้สึกยังไง...\nช่วยบอกหน่อยได้มั้ยคะ?"
