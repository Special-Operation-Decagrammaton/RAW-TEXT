[translation]
10150-150 = "오디세이아 학원에—"
10150-160 = "아니,"
10150-170 = "다이빙부에 어서 와.\n선생님."
10150-180 = "기다리고 있었어,\n선생님."
10150-190 = "자, 이 근처는\n내가 안내해줄게."
10150-200 = "……아무래도\n우리 부원들이\n뭔가 실수를\n저지른 모양이네."
10150-210 = "(12 해리면)"
10150-220 = "(정확히 트라이던트의\n순찰 구역을 벗어나는\n지점인데……)"
10150-230 = "(……뭔가 수상해.)"
10150-240 = "따개비 청소는\n고되긴 하지만……"
10150-250 = "그래도 어쩔 수 없지."
10150-260 = "우리만 할 수 있는\n일이기도 하고……"
10150-270 = "이런 것부터 차근차근,\n해나가야지."
10150-280 = "선생님……\n어쩐지 조금\n시선이 노골적인데."
10150-290 = "안경 없이도\n느껴질 정도로."
10150-300 = "……아이스크림?\n싫어하진 않지만……"
10150-310 = "……칼로리가 높아서\n최근에는 조금"
10150-320 = "신경이 쓰이더라고."
10150-330 = "선생님.\n목소리 좋다는 이야기\n들은 적 없어?"
10150-340 = "뭔가 선생님이 읽어주는\n<해저 2만리>를\n한 번 들어보고 싶네."
10150-350 = "응.\n다이빙부 부원들은 모두\n2학년 동급생이야."
10150-360 = "갑자기 왜?"
10150-370 = "혹시……\n내가 나이들어 보인다는\n이야기는 아니겠지?"
10150-380 = "다이빙과 관련된\n물품 기부는"
10150-390 = "언제나 환영이야."
10150-400 = "수면 아래에서\n주워 온 것과 교환할래?"
10150-410 = "이제 곧 정리할 예정이니까."
10150-420 = "교환하고 싶은 물건이 있다면\n지금 보여줘."
10150-430 = "선생님 덕분에\n이번 달은 부비를\n조금은 아낄 수 있겠어."
10150-440 = "해양 쓰레기를 청소하다 보면\n가끔 진귀한 물건을\n찾을 때가 있어."
10150-450 = "미화 활동 중의 몇 안 되는\n즐거움 중 하나랄까."
10150-460 = "이건……\n아직 쓸 수 있겠어."
10150-470 = "도와줘서 고마워,\n선생님."
10150-480 = "그걸 택하려고?\n좋은 선택이라고 생각해."
10150-490 = "어……\n정말로 그게 필요한 거야?"
