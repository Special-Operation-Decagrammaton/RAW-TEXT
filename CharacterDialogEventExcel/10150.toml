[translation]
10150-150 = "オデュッセイア\n海洋高等学校――"
10150-160 = "違うな……"
10150-170 = "ダイビング部へようこそ、\n先生。"
10150-180 = "待ってたよ、先生。"
10150-190 = "ここは私が案内するね。"
10150-200 = "はぁ……\nあの子たちが\n何かやらかしたみたい。"
10150-210 = "（12海里……）"
10150-220 = "（ちょうどトライデントの\n巡回範囲から\n外れる場所……）"
10150-230 = "（……怪しいかも）"
10150-240 = "フジツボ掃除は\n大変だけど……"
10150-250 = "仕方ないね。"
10150-260 = "私たちにしか\nできないことだし……"
10150-270 = "こういうことから、\nコツコツと、ね。"
10150-280 = "先生……ちょっと\nジロジロ見すぎかも。"
10150-290 = "私でも気づくくらい。"
10150-300 = "アイス？\n嫌いじゃないけど……。"
10150-310 = "……カロリー、\nちょっと高いから。"
10150-320 = "一応、気にしてるの。"
10150-330 = "先生、\nいい声って言われない？"
10150-340 = "……先生の声で\n『海底二万里』の朗読、\n聞いてみたいな。"
10150-350 = "ダイビング部はみんな\n2年生だよ……"
10150-360 = "それがどうかしたの？"
10150-370 = "もしかして……\n私、3年生に見えた？"
10150-380 = "寄付はいつでも大歓迎。"
10150-390 = "ダイビング用品だと……\n嬉しいかも。"
10150-400 = "海の中で拾ったものと交換する？"
10150-410 = "もう片づけちゃうから、"
10150-420 = "交換したいものがあるなら\n今のうちにね。"
10150-430 = "今月は部費を少し節約できそう。\n先生のおかげ。"
10150-440 = "海の掃除をしてると、\nたまに珍しいものを\n見つけるんだ。"
10150-450 = "数少ない楽しみ、かも。"
10150-460 = "これは……\nまだ使えそうだね。"
10150-470 = "手伝ってくれてありがとう、\n先生。"
10150-480 = "それにするんだ？\nいいんじゃないかな。"
10150-490 = "え……\nそれ本当に必要なの？"
