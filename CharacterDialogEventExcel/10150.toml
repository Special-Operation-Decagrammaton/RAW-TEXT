[translation]
10150-861-150-1 = "ยินดีต้อนรับสู่\nโรงเรียนโอดิสซีย์..."
10150-861-160-1 = "ไม่สิ"
10150-861-170-1 = "ยินดีต้อนรับสู่ชมรมดำน้ำนะ\nคุณครู"
10150-861-180-1 = "ฉันกำลังรออยู่เลย\nคุณครู"
10150-861-190-1 = "เอาละ ฉันจะเป็นคน\nพาชมแถวนี้เอง"
10150-861-200-1 = "...ดูท่าแล้วสมาชิกชมรมของเรา\nไปก่อความผิดพลาด\nอะไรเข้าให้แล้วสินะ"
10150-861-210-1 = "(12 ไมล์ทะเลนี่)"
10150-861-220-1 = "(เป็นจุดที่พ้นเขตลาดตระเวน\nของไทรเดนต์พอดีเลยนะ...)"
10150-861-230-1 = "(ชักจะน่าสงสัยยังไงไม่รู้...)"
10150-861-240-1 = "งานขัดเพรียง\nมันก็เหนื่อยอยู่หรอก..."
10150-861-250-1 = "แต่ก็ช่วยไม่ได้ล่ะนะ"
10150-861-260-1 = "เพราะเป็นงาน\nที่มีแต่พวกเราที่ทำได้..."
10150-861-270-1 = "ต้องค่อยๆ เริ่มจากเรื่องแบบนี้\nไปทีละอย่างน่ะแหละ"
10150-861-280-1 = "คุณครู...\nรู้สึกว่าสายตาชักจะ\nโจ่งแจ้งไปหน่อยแล้วนะ"
10150-861-290-1 = "ขนาดไม่ใส่แว่น\nยังรู้สึกได้เลย"
10150-861-300-1 = "ไอศกรีมเหรอ...?\nก็ไม่ได้ไม่ชอบหรอก..."
10150-861-310-1 = "แต่มันแคลอรีสูง...\nช่วงนี้เลยแอบ"
10150-861-320-1 = "กังวลอยู่น่ะ"
10150-861-330-1 = "คุณครู\nเคยมีใครบอกมั้ยว่า\nเสียงเพราะ?"
10150-861-340-1 = "รู้สึกอยากลองฟัง\n<ใต้ทะเลสองหมื่นลี้>\nที่คุณครูอ่านให้ฟังสักครั้งจัง"
10150-861-350-1 = "อืม สมาชิกชมรมดำน้ำทุกคน\nเป็นนักเรียนปี 2 รุ่นเดียวกัน"
10150-861-360-1 = "จู่ๆ ทำไมเหรอ?"
10150-861-370-1 = "หรือว่า... ไม่ได้จะบอกว่า\nฉันดูแก่ใช่มั้ย?"
10150-861-380-1 = "ของบริจาค\nที่เกี่ยวกับการดำน้ำ"
10150-861-390-1 = "พวกเรายินดีรับเสมอ"
10150-861-400-1 = "อยากแลกกับของ\nที่เก็บมาจากใต้ผิวน้ำมั้ยล่ะ?"
10150-861-410-1 = "อีกไม่นานก็จะเก็บของแล้ว"
10150-861-420-1 = "ถ้ามีของที่อยากแลก\nก็เอามาให้ดูตอนนี้เลย"
10150-861-430-1 = "พอมีคุณครูมาช่วย เดือนนี้ก็\nน่าจะประหยัดเงินได้บ้างละนะ"
10150-861-440-1 = "เวลาเก็บขยะทางทะเล บางครั้งก็\nเจอของหายากอยู่เหมือนกันนะ"
10150-861-450-1 = "คงเป็นหนึ่งในความสนุกไม่กี่อย่าง\nระหว่างกิจกรรมดูแลสิ่งแวดล้อมละมั้ง"
10150-861-460-1 = "นี่มัน...\nน่าจะยังใช้ได้อยู่นะ"
10150-861-470-1 = "ขอบคุณที่ช่วยนะ\nคุณครู"
10150-861-480-1 = "จะเลือกอันนั้นเหรอ?\nฉันว่าเป็นตัวเลือกที่ดีนะ"
10150-861-490-1 = "เอ่อ... จำเป็นต้องใช้\nอันนั้นจริงๆ เหรอ?"
