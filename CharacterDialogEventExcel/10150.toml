[translation]
10150-861-150-1 = "オデュッセイア\n海洋高等学校――"
10150-861-160-1 = "違うな……"
10150-861-170-1 = "ダイビング部へようこそ、\n先生。"
10150-861-180-1 = "待ってたよ、先生。"
10150-861-190-1 = "ここは私が案内するね。"
10150-861-200-1 = "はぁ……\nあの子たちが\n何かやらかしたみたい。"
10150-861-210-1 = "（12海里……）"
10150-861-220-1 = "（ちょうどトライデントの\n巡回範囲から\n外れる場所……）"
10150-861-230-1 = "（……怪しいかも）"
10150-861-240-1 = "フジツボ掃除は\n大変だけど……"
10150-861-250-1 = "仕方ないね。"
10150-861-260-1 = "私たちにしか\nできないことだし……"
10150-861-270-1 = "こういうことから、\nコツコツと、ね。"
10150-861-280-1 = "先生……ちょっと\nジロジロ見すぎかも。"
10150-861-290-1 = "私でも気づくくらい。"
10150-861-300-1 = "アイス？\n嫌いじゃないけど……。"
10150-861-310-1 = "……カロリー、\nちょっと高いから。"
10150-861-320-1 = "一応、気にしてるの。"
10150-861-330-1 = "先生、\nいい声って言われない？"
10150-861-340-1 = "……先生の声で\n『海底二万里』の朗読、\n聞いてみたいな。"
10150-861-350-1 = "ダイビング部はみんな\n2年生だよ……"
10150-861-360-1 = "それがどうかしたの？"
10150-861-370-1 = "もしかして……\n私、3年生に見えた？"
10150-861-380-1 = "寄付はいつでも大歓迎。"
10150-861-390-1 = "ダイビング用品だと……\n嬉しいかも。"
10150-861-400-1 = "海の中で拾ったものと交換する？"
10150-861-410-1 = "もう片づけちゃうから、"
10150-861-420-1 = "交換したいものがあるなら\n今のうちにね。"
10150-861-430-1 = "今月は部費を少し節約できそう。\n先生のおかげ。"
10150-861-440-1 = "海の掃除をしてると、\nたまに珍しいものを\n見つけるんだ。"
10150-861-450-1 = "数少ない楽しみ、かも。"
10150-861-460-1 = "これは……\nまだ使えそうだね。"
10150-861-470-1 = "手伝ってくれてありがとう、\n先生。"
10150-861-480-1 = "それにするんだ？\nいいんじゃないかな。"
10150-861-490-1 = "え……\nそれ本当に必要なの？"
