[translation]
10150-861-150-1 = "Welcome to Odyssey..."
10150-861-160-1 = "No..."
10150-861-170-1 = "Welcome to the Diving Club, Sensei."
10150-861-180-1 = "I was waiting for you, Sensei."
10150-861-190-1 = "Now, let me show you around here."
10150-861-200-1 = "...It looks like our club members made a mistake."
10150-861-210-1 = "(12 nautical miles...)"
10150-861-220-1 = "(That's the exact distance to leave the Trident's patrol zone...)"
10150-861-230-1 = "(...Something's suspicious.)"
10150-861-240-1 = "Cleaning barnacles is rough work..."
10150-861-250-1 = "But it can't be helped."
10150-861-260-1 = "It's something that only we can do..."
10150-861-270-1 = "We should take one step at a time, starting with things like this."
10150-861-280-1 = "Sensei... I feel like you're looking at me too much."
10150-861-290-1 = "I can feel it even without my glasses."
10150-861-300-1 = "...Ice cream? It's not like I hate it..."
10150-861-310-1 = "But since it's high in calories, I've been"
10150-861-320-1 = "a bit concerned..."
10150-861-330-1 = "Sensei. Has anyone ever said that you have a nice voice?"
10150-861-340-1 = "I'd like to hear you read \"Twenty Thousand Leagues Under the Sea,\" Sensei."
10150-861-350-1 = "Right. Everyone in the Diving Club is a second-year."
10150-861-360-1 = "Why?"
10150-861-370-1 = "Could it be that...you're saying I look old?"
10150-861-380-1 = "Any donation of diving-related items"
10150-861-390-1 = "is welcome at anytime."
10150-861-400-1 = "Want to trade that for something I found underwater?"
10150-861-410-1 = "We're going to wrap up soon."
10150-861-420-1 = "So if there's anything else you want to exchange, show it to me now."
10150-861-430-1 = "Thanks to you, we'll be able to save a little on club expenses this month."
10150-861-440-1 = "I sometimes find rare items while cleaning up marine debris."
10150-861-450-1 = "It's one of the few nice things about cleanup work."
10150-861-460-1 = "This...should be usable."
10150-861-470-1 = "Thank you for your help, Sensei."
10150-861-480-1 = "Are you going with that? I think it's a good choice."
10150-861-490-1 = "Um... Do you really need that?"
