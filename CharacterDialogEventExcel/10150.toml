[translation]
10150-150 = "ยินดีต้อนรับสู่\nโรงเรียนโอดิสซีย์..."
10150-160 = "ไม่สิ"
10150-170 = "ยินดีต้อนรับสู่ชมรมดำน้ำนะ\nคุณครู"
10150-180 = "ฉันกำลังรออยู่เลย\nคุณครู"
10150-190 = "เอาละ ฉันจะเป็นคน\nพาชมแถวนี้เอง"
10150-200 = "...ดูท่าแล้วสมาชิกชมรมของเรา\nไปก่อความผิดพลาด\nอะไรเข้าให้แล้วสินะ"
10150-210 = "(12 ไมล์ทะเลนี่)"
10150-220 = "(เป็นจุดที่พ้นเขตลาดตระเวน\nของไทรเดนต์พอดีเลยนะ...)"
10150-230 = "(ชักจะน่าสงสัยยังไงไม่รู้...)"
10150-240 = "งานขัดเพรียง\nมันก็เหนื่อยอยู่หรอก..."
10150-250 = "แต่ก็ช่วยไม่ได้ล่ะนะ"
10150-260 = "เพราะเป็นงาน\nที่มีแต่พวกเราที่ทำได้..."
10150-270 = "ต้องค่อยๆ เริ่มจากเรื่องแบบนี้\nไปทีละอย่างน่ะแหละ"
10150-280 = "คุณครู...\nรู้สึกว่าสายตาชักจะ\nโจ่งแจ้งไปหน่อยแล้วนะ"
10150-290 = "ขนาดไม่ใส่แว่น\nยังรู้สึกได้เลย"
10150-300 = "ไอศกรีมเหรอ...?\nก็ไม่ได้ไม่ชอบหรอก..."
10150-310 = "แต่มันแคลอรีสูง...\nช่วงนี้เลยแอบ"
10150-320 = "กังวลอยู่น่ะ"
10150-330 = "คุณครู\nเคยมีใครบอกมั้ยว่า\nเสียงเพราะ?"
10150-340 = "รู้สึกอยากลองฟัง\n<ใต้ทะเลสองหมื่นลี้>\nที่คุณครูอ่านให้ฟังสักครั้งจัง"
10150-350 = "อืม สมาชิกชมรมดำน้ำทุกคน\nเป็นนักเรียนปี 2 รุ่นเดียวกัน"
10150-360 = "จู่ๆ ทำไมเหรอ?"
10150-370 = "หรือว่า... ไม่ได้จะบอกว่า\nฉันดูแก่ใช่มั้ย?"
10150-380 = "ของบริจาค\nที่เกี่ยวกับการดำน้ำ"
10150-390 = "พวกเรายินดีรับเสมอ"
10150-400 = "อยากแลกกับของ\nที่เก็บมาจากใต้ผิวน้ำมั้ยล่ะ?"
10150-410 = "อีกไม่นานก็จะเก็บของแล้ว"
10150-420 = "ถ้ามีของที่อยากแลก\nก็เอามาให้ดูตอนนี้เลย"
10150-430 = "พอมีคุณครูมาช่วย เดือนนี้ก็\nน่าจะประหยัดเงินได้บ้างละนะ"
10150-440 = "เวลาเก็บขยะทางทะเล บางครั้งก็\nเจอของหายากอยู่เหมือนกันนะ"
10150-450 = "คงเป็นหนึ่งในความสนุกไม่กี่อย่าง\nระหว่างกิจกรรมดูแลสิ่งแวดล้อมละมั้ง"
10150-460 = "นี่มัน...\nน่าจะยังใช้ได้อยู่นะ"
10150-470 = "ขอบคุณที่ช่วยนะ\nคุณครู"
10150-480 = "จะเลือกอันนั้นเหรอ?\nฉันว่าเป็นตัวเลือกที่ดีนะ"
10150-490 = "เอ่อ... จำเป็นต้องใช้\nอันนั้นจริงๆ เหรอ?"
