[translation]
10150-861-150-1 = "奧德賽\n海洋高等學校──"
10150-861-160-1 = "不對……"
10150-861-170-1 = "歡迎來到潛水部，\n老師。"
10150-861-180-1 = "我等你很久了，老師。"
10150-861-190-1 = "這一帶就由我來帶路吧。"
10150-861-200-1 = "唉……\n看來那些孩子\n又惹出什麼事了。"
10150-861-210-1 = "（12海里……）"
10150-861-220-1 = "（剛好是脫離三叉戟\n巡邏範圍的\n地點……）"
10150-861-230-1 = "（……有點可疑呢。）"
10150-861-240-1 = "清理藤壺雖然很辛苦……"
10150-861-250-1 = "不過也沒辦法呢。"
10150-861-260-1 = "畢竟這也是只有\n我們才做得到的事……"
10150-861-270-1 = "就從這種事開始，\n一點一滴地做起吧。"
10150-861-280-1 = "老師……你好像\n盯著看太久了喔。"
10150-861-290-1 = "連我都察覺到了呢。"
10150-861-300-1 = "冰淇淋？\n我是不討厭啦……"
10150-861-310-1 = "……只是熱量\n有點高。"
10150-861-320-1 = "我多少還是會在意的。"
10150-861-330-1 = "老師，\n沒人說過你聲音很好聽嗎？"
10150-861-340-1 = "……真想聽聽看老師的聲音\n朗讀《海底兩萬里》呢。"
10150-861-350-1 = "潛水部大家都是\n二年級喔……"
10150-861-360-1 = "怎麼突然問這個？"
10150-861-370-1 = "難道說……\n我看起來像三年級嗎？"
10150-861-380-1 = "我們隨時歡迎捐贈。"
10150-861-390-1 = "如果是潛水用品的話……\n我會更開心。"
10150-861-400-1 = "要用在海裡撿到的東西交換嗎？"
10150-861-410-1 = "我等一下就要收拾了，"
10150-861-420-1 = "如果有想交換的東西，\n就趁現在吧。"
10150-861-430-1 = "這個月的社費似乎能省下一些。\n多虧了老師。"
10150-861-440-1 = "在清理海洋的時候，\n偶爾會發現\n一些稀奇的東西。"
10150-861-450-1 = "算是為數不多的樂趣吧。"
10150-861-460-1 = "這個……\n看起來還能用呢。"
10150-861-470-1 = "謝謝你幫忙，\n老師。"
10150-861-480-1 = "你要選那個嗎？\n我覺得挺不錯的。"
10150-861-490-1 = "咦……\n那個你真的用得到嗎？"
