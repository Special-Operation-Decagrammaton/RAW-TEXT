[translation]
10150-861-150-1 = "오디세이아 학원에—"
10150-861-160-1 = "아니,"
10150-861-170-1 = "다이빙부에 어서 와.\n선생님."
10150-861-180-1 = "기다리고 있었어,\n선생님."
10150-861-190-1 = "자, 이 근처는\n내가 안내해줄게."
10150-861-200-1 = "……아무래도\n우리 부원들이\n뭔가 실수를\n저지른 모양이네."
10150-861-210-1 = "(12 해리면)"
10150-861-220-1 = "(정확히 트라이던트의\n순찰 구역을 벗어나는\n지점인데……)"
10150-861-230-1 = "(……뭔가 수상해.)"
10150-861-240-1 = "따개비 청소는\n고되긴 하지만……"
10150-861-250-1 = "그래도 어쩔 수 없지."
10150-861-260-1 = "우리만 할 수 있는\n일이기도 하고……"
10150-861-270-1 = "이런 것부터 차근차근,\n해나가야지."
10150-861-280-1 = "선생님……\n어쩐지 조금\n시선이 노골적인데."
10150-861-290-1 = "안경 없이도\n느껴질 정도로."
10150-861-300-1 = "……아이스크림?\n싫어하진 않지만……"
10150-861-310-1 = "……칼로리가 높아서\n최근에는 조금"
10150-861-320-1 = "신경이 쓰이더라고."
10150-861-330-1 = "선생님.\n목소리 좋다는 이야기\n들은 적 없어?"
10150-861-340-1 = "뭔가 선생님이 읽어주는\n<해저 2만리>를\n한 번 들어보고 싶네."
10150-861-350-1 = "응.\n다이빙부 부원들은 모두\n2학년 동급생이야."
10150-861-360-1 = "갑자기 왜?"
10150-861-370-1 = "혹시……\n내가 나이들어 보인다는\n이야기는 아니겠지?"
10150-861-380-1 = "다이빙과 관련된\n물품 기부는"
10150-861-390-1 = "언제나 환영이야."
10150-861-400-1 = "수면 아래에서\n주워 온 것과 교환할래?"
10150-861-410-1 = "이제 곧 정리할 예정이니까."
10150-861-420-1 = "교환하고 싶은 물건이 있다면\n지금 보여줘."
10150-861-430-1 = "선생님 덕분에\n이번 달은 부비를\n조금은 아낄 수 있겠어."
10150-861-440-1 = "해양 쓰레기를 청소하다 보면\n가끔 진귀한 물건을\n찾을 때가 있어."
10150-861-450-1 = "미화 활동 중의 몇 안 되는\n즐거움 중 하나랄까."
10150-861-460-1 = "이건……\n아직 쓸 수 있겠어."
10150-861-470-1 = "도와줘서 고마워,\n선생님."
10150-861-480-1 = "그걸 택하려고?\n좋은 선택이라고 생각해."
10150-861-490-1 = "어……\n정말로 그게 필요한 거야?"
