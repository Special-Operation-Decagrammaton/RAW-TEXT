[translation]
10150-150 = "Welcome to Odyssey..."
10150-160 = "No..."
10150-170 = "Welcome to the Diving Club, Sensei."
10150-180 = "I was waiting for you, Sensei."
10150-190 = "Now, let me show you around here."
10150-200 = "...It looks like our club members made a mistake."
10150-210 = "(12 nautical miles...)"
10150-220 = "(That's the exact distance to leave the Trident's patrol zone...)"
10150-230 = "(...Something's suspicious.)"
10150-240 = "Cleaning barnacles is rough work..."
10150-250 = "But it can't be helped."
10150-260 = "It's something that only we can do..."
10150-270 = "We should take one step at a time, starting with things like this."
10150-280 = "Sensei... I feel like you're looking at me too much."
10150-290 = "I can feel it even without my glasses."
10150-300 = "...Ice cream? It's not like I hate it..."
10150-310 = "But since it's high in calories, I've been"
10150-320 = "a bit concerned..."
10150-330 = "Sensei. Has anyone ever said that you have a nice voice?"
10150-340 = "I'd like to hear you read \"Twenty Thousand Leagues Under the Sea,\" Sensei."
10150-350 = "Right. Everyone in the Diving Club is a second-year."
10150-360 = "Why?"
10150-370 = "Could it be that...you're saying I look old?"
10150-380 = "Any donation of diving-related items"
10150-390 = "is welcome at anytime."
10150-400 = "Want to trade that for something I found underwater?"
10150-410 = "We're going to wrap up soon."
10150-420 = "So if there's anything else you want to exchange, show it to me now."
10150-430 = "Thanks to you, we'll be able to save a little on club expenses this month."
10150-440 = "I sometimes find rare items while cleaning up marine debris."
10150-450 = "It's one of the few nice things about cleanup work."
10150-460 = "This...should be usable."
10150-470 = "Thank you for your help, Sensei."
10150-480 = "Are you going with that? I think it's a good choice."
10150-490 = "Um... Do you really need that?"
