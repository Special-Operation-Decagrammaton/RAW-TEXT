[translation]
16006-803-280-1 = "อ๊ะ คุณครูนี่นา!\nเชิญเลย!\nยินดีต้อนรับสู่ร้านริมทะเล!"
16006-803-290-1 = "อ๊ะ คุณครู!\nกำลังรออยู่เลยล่ะ!"
16006-803-300-1 = "เราเปิดกิจการร้านริมทะเลผ่านมา\nได้ครึ่งทางแล้วละนะ!\nมาใช้เวลาที่เหลือสนุกให้เต็มที่เถอะ!"
16006-803-310-1 = "ใกล้จะหมดแล้วล่ะ!\nพยายามเข้านะ!"
16006-803-320-1 = "วันนี้เปิดร้านวันสุดท้ายแล้วนะคุณครู\nเลือกของที่อยากได้ไปครบหรือยัง?"
16006-803-330-1 = "ร้านปิดแล้วค่า~!\nขอบคุณที่มาอุดหนุนนะคะ!"
16006-803-340-1 = "...คิดอย่างนั้นเหรอ?\nฮุฮุ ไม่ต้องห่วงนะ\nยังมีเวลาเหลืออยู่นิดหน่อย!"
16006-803-350-1 = "ตรวจสอบให้ดีด้วยล่ะ\nว่าลืมอะไรหรือเปล่า?"
16006-803-360-1 = "อื้อ! เชิญมองได้ตามสบายเลย ดูสิ!\nมีของอร่อยเยอะแยะเลย!"
16006-803-370-1 = "คือว่าคุณครู... นี่มัน...?"
16006-803-380-1 = "จริงๆ เลย~ บอกว่าให้ดูไอเทม\nในร้านไง ไม่ได้ให้มามองฉันนะ~!"
16006-803-390-1 = "อื้อ!... ถึงจะอ้อนขนาดนั้น\nยังไงก็ให้ฟรีไม่ได้หรอกนะ"
16006-803-400-1 = "โอ้! \nสมกับเป็นคุณครูจริงๆ!"
16006-803-410-1 = "เลือกอันนั้นเหรอ?\nอื้อ! อาจจะใช้ได้ก็ได้นะ"
