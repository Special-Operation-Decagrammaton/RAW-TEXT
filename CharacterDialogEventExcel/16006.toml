[translation]
16006-803-280-1 = "あっ、先生だ！\nいらっしゃいませ！\n海の家にようこそー！"
16006-803-290-1 = "あっ、先生！\n待ってたよ！"
16006-803-300-1 = "この海の家の営業期間も、\nそろそろ折り返しなんだって！\n最後まで楽しまないとね！"
16006-803-310-1 = "そろそろラストスパートだね！\n頑張ろう！"
16006-803-320-1 = "今日が最終日だよ、先生！！\n欲しいものは全部手に入った？"
16006-803-330-1 = "営業終了っ、\nお疲れ様でした～～！"
16006-803-340-1 = "……って思った？\nふふっ、実はまだもう\nちょっとだけ大丈夫なんだって！"
16006-803-350-1 = "何か忘れてるものはないか、\n確認しておいてね？"
16006-803-360-1 = "思う存分見てってね！\n美味しそうなものも\nたっくさんあるから！"
16006-803-370-1 = "ねえ先生、これ……\nん？"
16006-803-380-1 = "もう、私じゃなくて\n商品の方を見てよー。"
16006-803-390-1 = "うう～……そ、そんなに\nつんつん触られても、\nタダではあげられないよ？"
16006-803-400-1 = "おおっ、\nさすが先生！"
16006-803-410-1 = "それにしたの？\nうん、良いと思う！"
