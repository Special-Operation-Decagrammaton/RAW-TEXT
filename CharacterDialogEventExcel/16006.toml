[translation]
16006-803-280-1 = "啊，是老師！\n歡迎光臨！\n歡迎來到海之家！"
16006-803-290-1 = "啊，老師！\n我一直在等你！"
16006-803-300-1 = "海之家的營業時間\n也漸漸過了一半！\n要享受到最後一刻！"
16006-803-310-1 = "就要進入尾聲了耶！\n加油！"
16006-803-320-1 = "老師，今天是最後一天！\n想要的東西都拿了嗎？"
16006-803-330-1 = "營業結束，辛苦了～～！"
16006-803-340-1 = "你以為是這樣嗎？\n嘿嘿，其實，\n還剩下一點時間！"
16006-803-350-1 = "務必好好確認\n是否有遺漏掉的東西！"
16006-803-360-1 = "嗯！盡情逛吧。逛一下吧！\n因為也有美味的食物！"
16006-803-370-1 = "那個…老師，這個… 嗯？"
16006-803-380-1 = "真是的～不是看我\n去看看商品！"
16006-803-390-1 = "唔唔…就算你那樣戳我…\n也沒辦法免費…！"
16006-803-400-1 = "噢噢！\n真不愧是老師！"
16006-803-410-1 = "要挑那個嗎？\n嗯！說不定很好！"
16006-10803-280-1 = "啊！是老師！\n歡迎光臨，\n你來海之家真的是來對了-！"
16006-10803-290-1 = "啊，老師！\n一直在等你呢！"
16006-10803-300-1 = "海之家的營業時間\n也不知不覺過了一半了！\n 要享受到最後一刻才行！"
16006-10803-310-1 = "馬上就結束了！\n加油！"
16006-10803-320-1 = "今天是最後一天了，老師！\n想要的東西都拿好了嗎？"
16006-10803-330-1 = "營業結束，辛苦了~~！"
16006-10803-340-1 = "…騙你的！\n呵呵，其實\n還剩下一點點時間！"
16006-10803-350-1 = "要不要確認一下\n有沒有忘記的東西？"
16006-10803-360-1 = "嗯！盡情參觀吧！參觀！\n 也有很多好吃的！"
16006-10803-370-1 = "那個…老師，那個… 嗯？"
16006-10803-380-1 = "真是的～不要看我，\n看商品啦～！"
16006-10803-390-1 = "嗚嗚…\n即使這樣戳戳，\n也不能免費提供嗎？"
16006-10803-400-1 = "喔喔-！\n果然是老師！"
16006-10803-410-1 = "選擇了那個嗎？\n嗯！說不定很棒呢！"
