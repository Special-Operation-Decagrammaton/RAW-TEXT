[translation]
16006-803-280-1 = "앗, 선생님이다!\n어서 오세요!\n바다의 집에 잘 왔어-!"
16006-803-290-1 = "앗, 선생님!\n기다리고 있었어!"
16006-803-300-1 = "이 바다의 집 영업 기간도,\n슬슬 절반이나 지났어!\n마지막까지 즐겨야지!"
16006-803-310-1 = "곧 마지막이네!\n힘내!"
16006-803-320-1 = "오늘이 마지막 날이야, 선생님!\n갖고 싶은 건 다 챙겼어?"
16006-803-330-1 = "영업 종료, 수고하셨습니다~~!"
16006-803-340-1 = "…라고 생각했어?\n후후, 실은 아직\n조금 시간이 남았대!"
16006-803-350-1 = "잊은 물건이 없는지,\n잘 확인해야 해?"
16006-803-360-1 = "응! 맘껏 둘러봐. 둘러봐!\n맛있는 것도 많으니까!"
16006-803-370-1 = "저기 선생님, 이거… 응?"
16006-803-380-1 = "진짜~ 나 말고\n상품을 보라구~!"
16006-803-390-1 = "우웅…\n그, 그렇게 콕콕 찔러도,\n공짜로 줄 순 없다구?"
16006-803-400-1 = "오오-!\n역시 선생님!"
16006-803-410-1 = "그걸로 고른 거야?\n응! 좋을지도!"
