[translation]
16006-803-280-1 = "Oh, it's Sensei! Well, welcome to the Beach Shack!"
16006-803-290-1 = "Welcome, Sensei! I've been waiting for you!"
16006-803-300-1 = "We're almost halfway to the end of the day! Enjoy while you can!"
16006-803-310-1 = "The end is close! Keep at it!"
16006-803-320-1 = "Sensei! Today's the store's last day. Did you get everything you want?"
16006-803-330-1 = "We're closed! Thank you everyone!"
16006-803-340-1 = "Thought that was it? Heehee. Don't worry. There's still some time left!"
16006-803-350-1 = "Remember to check one last time if you forgot anything!"
16006-803-360-1 = "Yes! Take a gander! Lots of tasty things!"
16006-803-370-1 = "Hey, Sensei! This one... Huh?"
16006-803-380-1 = "Come on, don't look at me! Look around the shop!"
16006-803-390-1 = "Um! N-Nothing for free, even if you keep poking me!"
16006-803-400-1 = "Wow! I knew it, Sensei!"
16006-803-410-1 = "You chose that? Hmm... Good choice!"
