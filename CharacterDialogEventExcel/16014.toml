[translation]
16014-833-710-1 = "いらっしゃいませ、先生～！\nえへへっ！"
16014-833-720-1 = "なんか探し物～？\nイブキも手伝ってあげる！"
16014-833-730-1 = "イブキ、先生とパーティーで\n踊るの、すっごく楽しかった！"
16014-833-740-1 = "また一緒に来ようね！\n約束だよ！"
16014-833-750-1 = "うん？\nイブキは売ってないよ～？"
16014-833-760-1 = "えっと、イブキはね！\nあれがいいと思う！"
16014-833-770-1 = "ご利用、\nありがとうございました～！"
16014-833-780-1 = "また来てね！先生！"
16014-833-790-1 = "プレゼント用……？\nもしかして……イブキに？"
16014-833-800-1 = "それ！イブキも好き！"
16014-833-810-1 = "わっ！イブキ、初めて見た！\nそんなのもあったんだね！"
