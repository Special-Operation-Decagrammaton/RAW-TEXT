[translation]
16014-833-710-1 = "เชิญเลยค่ะคุณครู~!\nฮิฮิฮิ!"
16014-833-720-1 = "หาอะไรอยู่รึเปล่า~?\nอิบูกิจะช่วยเอง!"
16014-833-730-1 = "อิบูกิสนุกมากเลยที่ได้\nเต้นกับคุณครูในงานปาร์ตี้!"
16014-833-740-1 = "ไว้ไปด้วยกันใหม่นะ! สัญญาเลย!"
16014-833-750-1 = "หืม? อิบูกิไม่ได้มีไว้ขายนะ~?"
16014-833-760-1 = "อืม อิบูกิน่ะ!\nคิดว่าอันนั้นน่าจะดีนะ!"
16014-833-770-1 = "ขอบคุณที่มาใช้บริการค่า~!"
16014-833-780-1 = "ไว้มาใหม่นะ! คุณครู!"
16014-833-790-1 = "เอาไปเป็นของขวัญเหรอ…?\nหรือว่า... ให้อิบูกิ?"
16014-833-800-1 = "อันนั้นอิบูกิก็ชอบ!"
16014-833-810-1 = "ว้าว! อิบูกิเพิ่งเคยเห็นครั้งแรกเลย!\nมีของแบบนี้ด้วยเหรอเนี่ย!"
