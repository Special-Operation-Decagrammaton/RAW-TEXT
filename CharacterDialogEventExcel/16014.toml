[translation]
16014-833-710-1 = "歡迎你來，老師～！\n耶嘿嘿！"
16014-833-720-1 = "在找什麼東西嗎～？\n伊吹也來幫你！"
16014-833-730-1 = "伊吹，能跟老師在派對\n跳舞，真的很開心！"
16014-833-740-1 = "再一起來吧！\n約好了喔！"
16014-833-750-1 = "嗯？\n伊吹沒有賣唷～？"
16014-833-760-1 = "那個，伊吹我呀！\n覺得那個很棒！"
16014-833-770-1 = "謝謝您的光臨！"
16014-833-780-1 = "還要再來哦！老師！"
16014-833-790-1 = "是要送人的……？\n難道……要送給伊吹？"
16014-833-800-1 = "那個！伊吹也很喜歡！"
16014-833-810-1 = "哇！伊吹第一次看到！\n原來有那種東西啊！"
