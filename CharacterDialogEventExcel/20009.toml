[translation]
20009-808-10-1 = "คนที่สงสัยในอำนาจของเรา\nต่อให้เป็นวันหยุดพักผ่อน\nก็ต้องโดนกวาดล้าง!"
20009-808-20-1 = "อะแฮ่ม บางครั้งการได้เพลิดเพลิน\nกับวันหยุดฤดูหนาวก็ไม่แย่เท่าไหร่นะ"
20009-808-30-1 = "พอกลับไปที่สำนักเลขาธิการแล้ว\nเราจะสร้างออนเซ็น\nที่ยิ่งใหญ่กว่านี้อีก"
20009-808-40-1 = "ฮุฮุฮุ..."
20009-808-50-1 = "ทำไมรู้สึกเหมือนว่า\nยิ่งสนุกกับวันหยุดเท่าไร\nก็ยิ่งรู้สึกเหนื่อยขึ้นกว่าเดิมอีก..."
20009-808-60-1 = "เราจะไม่แช่ออนเซ็น...\nไปอีกสักระยะเลย"
20009-808-70-1 = "สหาย พวกเรากลับไป\nพักที่สำนักเลขาธิการกันเถอะ"
20009-808-80-1 = "เปิดออนเซ็นขึ้นมา\nโดยไม่ได้รับอนุญาตจากเราเรอะ\nไร้มารยาทสิ้นดี!"
20009-808-90-1 = "กวาดล้างให้หมด กวาดล้าง!"
20009-808-100-1 = "มีปัญหาอะไรหรือเปล่า?\nสหาย?"
20009-808-110-1 = "ระ...เราไม่ได้กำลังสนุกซะหน่อย\nในฐานะเลขานุการพรรค เรากำลัง\nตรวจตราสหภาพอยู่ต่างหาก!"
20009-808-120-1 = "ชมรมพัฒนาออนเซ็นของเกเฮนน่า\nเจ้าพวกนั้นก็ดูมีความสามารถใช้ได้นะ..."
