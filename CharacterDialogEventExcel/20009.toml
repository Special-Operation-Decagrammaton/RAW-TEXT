[translation]
20009-808-10-1 = "おいらの権威を\n疑うやつらは、\nたとえ休暇中でも粛清だ！"
20009-808-20-1 = "ふむ！\nたまにはこういう\n休暇も悪くないな！"
20009-808-30-1 = "事務局に戻ったら、\nここよりもっと豪勢な\n温泉の計画を……"
20009-808-40-1 = "ふふっ……"
20009-808-50-1 = "なんだか休暇を\n楽しむはずだったのに、\nどっと疲れたな……"
20009-808-60-1 = "もうしばらく\n温泉はいいや……"
20009-808-70-1 = "カムラッド、\n事務局に戻って休もう……"
20009-808-80-1 = "おいらの許可も無しに\n温泉を開くだなんて……\nけしからん！"
20009-808-90-1 = "みんな粛清だ、\n粛清！"
20009-808-100-1 = "ん？\nどうかしたか、\nカムラッド？"
20009-808-110-1 = "ま、満喫なんてしてない！\nあくまで、書記長として、\n視察をしているんだ！"
20009-808-120-1 = "あのゲヘナの\n温泉開発部のやつら、\nすごかったな……"
