[translation]
20009-808-10-1 = "對咱的權威\n提出質疑的傢伙們，\n就算在休假中也要肅清！"
20009-808-20-1 = "呼呣！\n偶爾來點這種\n休假也不錯嘛！"
20009-808-30-1 = "等回到事務局，\n就來計畫一個比這裡\n更豪華的溫泉浴場……"
20009-808-40-1 = "呵呵……"
20009-808-50-1 = "總覺得明明應該\n要享受休假，\n卻突然有點累了……"
20009-808-60-1 = "暫時還是\n別泡溫泉了吧……"
20009-808-70-1 = "同志，我們\n回事務局休息吧……"
20009-808-80-1 = "居然未經咱的許可\n就開了溫泉浴場……\n豈有此理！"
20009-808-90-1 = "全部都肅清，肅清！"
20009-808-100-1 = "嗯？\n怎麼了嗎，同志？"
20009-808-110-1 = "才，才沒有在享受！\n只不過是以書記長的身分，\n在視察而已！"
20009-808-120-1 = "那個格黑娜的\n溫泉開發部的傢伙們，\n真厲害呢……"
