[translation]
20009-808-10-1 = "Those who doubt my authority, even on vacation, will be purged!"
20009-808-20-1 = "Ahem. It's not so bad enjoying a vacation once in a while."
20009-808-30-1 = "When I return to the Secretariat, I will build a bigger hot springs resort than this!"
20009-808-40-1 = "Heeheehee..."
20009-808-50-1 = "I don't know why, but the more I enjoy vacation, the sleepier I get..."
20009-808-60-1 = "I'm tired of the hot springs now, Comrade..."
20009-808-70-1 = "Comrade, I want to return to the Secretariat and rest..."
20009-808-80-1 = "How dare they open up a hot springs resort without my permission! I'm infuriated!"
20009-808-90-1 = "Purge them all!"
20009-808-100-1 = "Is there a problem, Comrade?"
20009-808-110-1 = "I-I'm not enjoying myself, understand? As the Great Leader, it is my duty to inspect the academy!"
20009-808-120-1 = "Those students from the Gehenna Hot Springs Department were pretty talented..."
