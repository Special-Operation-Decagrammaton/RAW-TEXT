[translation]
20009-808-10-1 = "이 몸의 권위를 의심하는\n녀석들은 휴가 중이라도\n숙청이야!"
20009-808-20-1 = "흠, 흠. 가끔씩 즐기는\n겨울 휴가도 나쁘지 않지."
20009-808-30-1 = "사무국으로 돌아가면\n이보다 더 성대한\n온천장을 지어야겠어."
20009-808-40-1 = "후후후…"
20009-808-50-1 = "어째서인지 휴가를\n즐기려고 했건만, 갑자기\n피곤해지네……"
20009-808-60-1 = "이제 당분간\n온천은 됐어……"
20009-808-70-1 = "콤라드,\n사무국으로 돌아가서\n쉬자……"
20009-808-80-1 = "이 몸의 허가 없이\n온천장을 열다니,\n괘씸하잖아!"
20009-808-90-1 = "모두 숙청이야, 숙청!"
20009-808-100-1 = "무슨 문제라도 있나,\n콤라드?"
20009-808-110-1 = "따, 딱히 즐기고 있는 건\n아니거든? 서기장으로서\n학원을 시찰하고 있을\n뿐이니까!"
20009-808-120-1 = "게헨나의 그 온천개발부\n녀석들은 꽤나 실력이\n괜찮았었지……"
