[translation]
20006-805-70-1 = "Sensei, welcome to Shanhaijing!"
20006-805-80-1 = "Heehee. You didn't forget about today's plans, right, Sensei?"
20006-805-90-1 = "Where did Shun wander off to this time?"
20006-805-100-1 = "Heehee. Won't be long until the elixir of immortality can be made!"
20006-805-110-1 = "That's strange. There shouldn't have been any other ingredients in the rejuvenation elixir..."
20006-805-120-1 = "Wait, while I was working..."
20006-805-130-1 = "Did this get mixed in with Nezusuke's fur?"
20006-805-140-1 = "Welcome, Sensei, to my new remote lab!"
20006-805-150-1 = "I'll purchase any good alchemy materials!"
20006-805-160-1 = "The remote lab won't be open for long."
20006-805-170-1 = "Remember to exchange any good materials you find!"
20006-805-180-1 = "The vibe around the promenade feels kinda off."
20006-805-190-1 = "We need to close the remote lab and fast."
20006-805-200-1 = "The remote lab is open until today."
20006-805-210-1 = "Get what you need while you can!"
20006-805-220-1 = "The remote lab is closed."
20006-805-230-1 = "But if there's anything left, please show it to me."
20006-805-240-1 = "Anything can be made with the power of superior alchemy!"
20006-805-250-1 = "Hmm. This blue stone you mentioned. I'm not familiar with it either..."
20006-805-260-1 = "Not a bad choice."
20006-805-270-1 = "Heehee. Thanks for collecting all the good stuff."
20006-805-280-1 = "Oh, an excellent choice!"
