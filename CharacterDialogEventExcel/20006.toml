[translation]
20006-805-70-1 = "ยินดีต้อนรับสู่โรงเรียน\nมัธยมซานไห่จิงนะ คุณครู!"
20006-805-80-1 = "ฮุฮุฮุ...คงไม่ได้ลืมสัญญา\nหรอกใช่มั้ย? คุณครู"
20006-805-90-1 = "ผู้ฝึกสอนชุน\nหายไปไหนนะ..."
20006-805-100-1 = "ฮุฮุฮุ... วันที่จะทำยาอายุวัฒนะสำเร็จ\nใกล้เข้ามาแล้วล่ะ!"
20006-805-110-1 = "แปลกจัง... ไม่ได้ใส่วัตถุดิบอื่น\nลงไปใน \"น้ำยาแห่งความอ่อนเยาว์\"\nเลยแท้ๆ...."
20006-805-120-1 = "หรือว่าระหว่างที่ปรุงยาอยู่"
20006-805-130-1 = "จะมีขนของเนสึซึเกะ\nหล่นลงไปในนั้นด้วย?!"
20006-805-140-1 = "ขอต้อนรับสู่ห้องทดลองเฉพาะกิจ\nของท่านซายะ คุณครู!"
20006-805-150-1 = "ถ้ามีวัตถุดิบดีๆ สำหรับการวิจัยละก็...\nแพงเท่าไรฉันก็จะซื้อ!"
20006-805-160-1 = "ห้องทดลองเฉพาะกิจนี้น่ะ\nไม่ได้จะเปิดนานๆ หรอกนะ"
20006-805-170-1 = "เพราะงั้นถ้ามีวัตถุดิบวิจัยดีๆ ละก็\nรีบๆ เอามาแลกไปสิ"
20006-805-180-1 = "ช่วงนี้ย่านการค้ารอบๆ นี้\nดูน่าสงสัยมากๆ เลย..."
20006-805-190-1 = "สงสัยจะต้องรีบปิด\nห้องทดลองเฉพาะกิจนี้แล้วล่ะ"
20006-805-200-1 = "ห้องทดลองเฉพาะกิจ\nจะเปิดถึงแค่วันนี้เท่านั้นนะ"
20006-805-210-1 = "เพราะงั้นถ้ามีวัตถุดิบที่ต้องการ\nก็รีบๆ เข้าล่ะ"
20006-805-220-1 = "ห้องทดลองเฉพาะกิจ\nปิดทำการแล้วล่ะ"
20006-805-230-1 = "แต่ถ้ามีวัตถุดิบเหลืออยู่ละก็\nส่งมาให้ท่านซายะดูสิ"
20006-805-240-1 = "ของทุกอย่างที่มีอยู่ในโลกนี้\nสามารถสร้างขึ้นได้ด้วยการวิจัย!\n"
20006-805-250-1 = "อืม... หินสีฟ้าที่คุณครูพูดถึง...\nท่านซายะเองก็ไม่รู้จักเหมือนกัน..."
20006-805-260-1 = "เลือกได้ดีเลยนี่"
20006-805-270-1 = "ฮุฮุ ขอบคุณนะ\nที่รวบรวมวัตถุดิบดีๆ มาให้"
20006-805-280-1 = "โอ้... เลือกได้ยอดเยี่ยมไปเลย!"
20006-10805-70-1 = "ขอต้อนรับสู่โรงเรียน\nมัธยมซานไห่จิงนะ ครู!"
20006-10805-80-1 = "ฮุฮุฮุ คงไม่ได้ลืมสัญญา\nวันนี้หรอกใช่มั้ย ครู?"
20006-10805-90-1 = "ผู้ฝึกสอนชุน\nหายไปไหนนะ..."
20006-10805-100-1 = "ฮุฮุฮุ วันที่ปรุงยาอายุวัฒนะสำเร็จ\nก็คงอีกไม่ไกลแล้ว!"
