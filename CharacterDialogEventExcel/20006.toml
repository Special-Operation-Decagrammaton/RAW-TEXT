[translation]
20006-805-70-1 = "山海経高級中学校へ\nようこそなのだ、先生！"
20006-805-80-1 = "ふっふっふ\n今日の約束はもちろん\n覚えてるよね、先生？"
20006-805-90-1 = "シュン教官は\nどこに行ったのだ……？"
20006-805-100-1 = "ふっふっふ\n不老不死の霊薬を\n生み出せる日は近いのだ！"
20006-805-110-1 = "おかしいのだ……\n「若返りの秘薬」に変な\nものは入れなかったはず……。"
20006-805-120-1 = "……もしかして\n沸騰させてる時に、"
20006-805-130-1 = "空中に舞っていた\nネズ助の毛が\n混ざったのだ！？"
20006-805-140-1 = "ぼく様の出張研究所へ\nようこそなのだ、先生！"
20006-805-150-1 = "良い錬丹術の素材があったら、\nぼく様が高く買い取るのだ！"
20006-805-160-1 = "この出張研究所は\nあくまで臨時のもの。"
20006-805-170-1 = "だからもし欲しい材料があったら、\n早めに手に入れておく\nことをおススメするのだ"
20006-805-180-1 = "最近何だか、\n商会の雰囲気が怪しいのだ……"
20006-805-190-1 = "この出張研究所も、\n早めに畳んだ方が\n良いかもしれないな"
20006-805-200-1 = "出張研究所は\n今日でおしまいなのだ"
20006-805-210-1 = "もし必要な材料があったら、\n早めに交換しておいた\n方が良いぞ？"
20006-805-220-1 = "出張研究所、営業終了なのだ！"
20006-805-230-1 = "あ、でも、もし残った\n材料とかがあれば、\n是非ぼく様に見せてほしい！"
20006-805-240-1 = "世の中に存在する\nほぼ全てのものは、\n錬丹術で生み出せるのだ！"
20006-805-250-1 = "うーん……先生が言ってる\nその「青色の石」については、\nぼく様もよく知らないのだ……"
20006-805-260-1 = "悪くない選択だ！"
20006-805-270-1 = "ふふ、良い素材を集めてくれて\nありがとうなのだ"
20006-805-280-1 = "おお、素晴らしい選択なのだ！"
