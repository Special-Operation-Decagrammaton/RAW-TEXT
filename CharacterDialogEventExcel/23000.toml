[translation]
23000-816-270-1 = "おいしいスイーツのため～\n今日も一緒に、\n頑張りましょう！"
23000-816-280-1 = "今日も頑張ります！"
23000-816-290-1 = "えへへっ、もっと私に\n頼ってもいいんですよ～。"
23000-816-300-1 = "えへへっ、少し\n照れちゃいますね、先生。"
23000-816-310-1 = "ありがとうございます、\n先生！"
23000-816-320-1 = "みんな、ファイトです！"
