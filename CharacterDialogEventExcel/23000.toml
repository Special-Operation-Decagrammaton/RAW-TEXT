[translation]
23000-816-270-1 = "為了美味的甜點～\n今天也一起加油吧！"
23000-816-280-1 = "今天也會努力的！"
23000-816-290-1 = "耶嘿嘿，再多\n依賴我也沒關係唷～"
23000-816-300-1 = "耶嘿嘿，\n有點害羞呢，老師。"
23000-816-310-1 = "非常謝謝你，\n老師！"
23000-816-320-1 = "大家，加油喔！"
