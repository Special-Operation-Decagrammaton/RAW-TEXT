[translation]
23000-816-270-1 = "เพื่อขนมหวานแสนอร่อย~\nวันนี้ก็มาพยายามไปด้วยกันนะคะ!"
23000-816-280-1 = "วันนี้ฉันจะพยายามค่ะ!"
23000-816-290-1 = "ฮิฮิ คุณครูจะพึ่งพาฉัน\nอีกสักหน่อยก็ได้นะคะ~"
23000-816-300-1 = "ฮิฮิ จู่ๆ...\nก็รู้สึกเขินจังเลยค่ะ คุณครู"
23000-816-310-1 = "ขอบคุณค่ะ คุณครู!"
23000-816-320-1 = "สู้ๆ นะคะ ทุกคน!"
