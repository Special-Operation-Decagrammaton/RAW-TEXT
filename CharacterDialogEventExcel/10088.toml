[translation]
10088-834-120-1 = "待ってたよ、先生。\n何をすればいい？"
10088-834-130-1 = "…あ、ちょうど\n探してたんだ、先生。"
10088-834-140-1 = "意外と忙しいね。\n早く取り掛かろうか。"
10088-834-150-1 = "時間ギリギリだね。\nでも大丈夫、手伝うよ。"
10088-834-160-1 = "後片付けを始めるよ。"
10088-834-170-1 = "…うん？呼んだ？"
10088-834-180-1 = "先生…からかってる\n場合じゃないから。"
10088-834-190-1 = "はあ…遊ぶのは仕事が\n終わってからにして。"
10088-834-200-1 = "からかう事自体は\n別にいいんだけど…"
10088-834-210-1 = "今はやめてほしいかな。"
10088-834-220-1 = "補給が必要なんでしょ？\nここにあるよ。"
10088-834-230-1 = "必要な物があるならいって。\n取ってくる。"
10088-834-240-1 = "仕事は終わったけど……\n忘れものは無い？"
10088-834-250-1 = "ちゃんと教えてくれたら\n探してくるよ。"
10088-834-260-1 = "先生……それ、\nちょっとくすぐったい。"
10088-834-270-1 = "それが必要だったんだね。"
10088-834-280-1 = "ここにあったんだ。\n役に立つよ、きっと。"
10088-834-290-1 = "ちょうどいいものがあって\n良かった。"
10088-834-300-1 = "いい選択だね。"
10088-834-410-1 = "進行してるタスクを整理したよ。\n一緒に見よう、先生。"
10088-834-420-1 = "進捗状況を確認しに来たの？"
10088-834-430-1 = "先生……ちょっと……。"
10088-834-440-1 = "……先生と一緒に\n働くのって、いいね。"
10088-834-450-1 = "うん、解決。"
10088-834-460-1 = "悪くないね。"
