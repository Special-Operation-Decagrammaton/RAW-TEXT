[translation]
10088-834-120-1 = "กำลังรออยู่เลย\nครู ให้ฉันทำอะไรดี?"
10088-834-130-1 = "อ่า... ฉันกำลัง\nตามหาอยู่พอดีเลย ครู"
10088-834-140-1 = "งานยุ่งกว่าที่คิดเลยนะ\nมารีบทำกันเถอะ ครู"
10088-834-150-1 = "เวลาแทบจะไม่พอแล้วนะ\nแต่ไม่ต้องกังวลหรอก ฉันจะช่วยเอง"
10088-834-160-1 = "จะเริ่มจัดการให้เรียบร้อยละนะ"
10088-834-170-1 = "หืม...? เรียกฉันเหรอ?"
10088-834-180-1 = "ครู... นี่ไม่ใช่เวลา\nมาแกล้งกันเล่นนะ"
10088-834-190-1 = "เฮ้อ... ถ้าจะเล่นน่ะ\nก็รอให้งานเสร็จก่อน"
10088-834-200-1 = "แต่ถ้าจะแกล้งกัน\nฉันก็ไม่ว่าอะไรหรอก..."
10088-834-210-1 = "ตอนนี้ฉันอยากให้\nหยุดได้แล้วละ"
10088-834-220-1 = "ต้องการเสบียงใช่มั้ย?\nนี่ไง"
10088-834-230-1 = "ถ้าอยากได้อะไรก็บอกนะ\nแล้วฉันจะเอามาให้"
10088-834-240-1 = "งานเสร็จแล้ว... ว่าแต่ ลืมอะไรรึเปล่า?"
10088-834-250-1 = "ถ้าบอกดีๆ แล้วฉันจะไปหามาให้"
10088-834-260-1 = "ครู ทำแบบนั้น... มันจั๊กจี้นิดหน่อยนะ"
10088-834-270-1 = "ต้องการอันนั้นสินะ"
10088-834-280-1 = "อยู่ตรงนี้นี่เอง\nฉันว่ามันจะช่วยได้แน่นอนเลย"
10088-834-290-1 = "โล่งอกไปทีนะที่มีอะไรดีๆ พอดี"
10088-834-300-1 = "เลือกได้ดีเลยละ"
10088-834-410-1 = "ฉันจัดการงานที่ทำอยู่ตอนนี้\nเรียบร้อยแล้ว มาดูด้วยกันสิครู"
10088-834-420-1 = "มาดูความคืบหน้าเหรอ?"
10088-834-430-1 = "ไม่รู้จักยอมแพ้เลยนะ ครูน่ะ"
10088-834-440-1 = "ได้ทำงานกับคุณครูนี่ดีจังเลย..."
10088-834-450-1 = "อืม คลี่คลายได้แล้ว"
10088-834-460-1 = "ไม่เลวเลยนะ"
