[translation]
10088-834-120-1 = "I've been waiting for you, Sensei. What should I do?"
10088-834-130-1 = "...Ah, I was just looking for you, Sensei."
10088-834-140-1 = "It's surprisingly busy, isn't it? Shall we get to work?"
10088-834-150-1 = "Time is short. But don't worry, I'll help."
10088-834-160-1 = "I'll start cleaning up."
10088-834-170-1 = "...Huh? Did you call me?"
10088-834-180-1 = "Sensei... Now's not a time to goof off."
10088-834-190-1 = "*sigh*...Playtime can wait until after work."
10088-834-200-1 = "I'm not bothered by your ribbing, but..."
10088-834-210-1 = "I'd appreciate it if you knocked it off."
10088-834-220-1 = "Do you need supplies? They're here."
10088-834-230-1 = "If there's anything else you want, just let me know. I'll grab it."
10088-834-240-1 = "Work's over, but...did you forget something?"
10088-834-250-1 = "If you did, just let me know. I'll find it."
10088-834-260-1 = "Hey, that tickles."
10088-834-270-1 = "That's what you needed."
10088-834-280-1 = "So that's where it was. It'll definitely be helpful."
10088-834-290-1 = "I'm glad we got this just in time."
10088-834-300-1 = "Good choice."
10088-834-410-1 = "I've organized our in-progress tasks. Let's review them together, Sensei."
10088-834-420-1 = "Here to check on our progress?"
10088-834-430-1 = "Sensei, please!"
10088-834-440-1 = "...It feels nice working with you, Sensei."
10088-834-450-1 = "Yeah. It all worked out."
10088-834-460-1 = "Not bad at all."
