[translation]
10088-834-120-1 = "기다리고 있었어,\n선생. 뭘 하면 될까?"
10088-834-130-1 = "…아. 마침\n찾고 있었어, 선생."
10088-834-140-1 = "의외로 바쁘네.\n빨리 시작해 볼까?"
10088-834-150-1 = "시간 아슬아슬하네.\n하지만 걱정 마. 도와줄게."
10088-834-160-1 = "뒷정리 시작할게."
10088-834-170-1 = "…응? 불렀어?"
10088-834-180-1 = "선생…. 장난칠\n때가 아니야."
10088-834-190-1 = "하아…. 노는 건\n일 끝나고 나서."
10088-834-200-1 = "놀리는 것 자체는\n상관없지만…"
10088-834-210-1 = "지금은 그만해 줬으면 해."
10088-834-220-1 = "보급이 필요한 거지?\n여기 있어."
10088-834-230-1 = "필요한 거 있으면 말해.\n가져올게."
10088-834-240-1 = "일은 끝났지만… 잊은 건 없어?"
10088-834-250-1 = "제대로 알려주면 찾아오도록 할게."
10088-834-260-1 = "선생. 그거…. 조금 간지러운데."
10088-834-270-1 = "그게 필요했구나."
10088-834-280-1 = "여기 있었구나.\n도움이 될 거야, 분명."
10088-834-290-1 = "마침 좋은 게 있어서 다행이다."
10088-834-300-1 = "좋은 선택이네."
10088-834-410-1 = "진행하고 있는 태스크를\n정리했어. 같이 보자, 선생."
10088-834-420-1 = "진행 상황 확인하러 온 거야?"
10088-834-430-1 = "선생님…… 좀……!"
10088-834-440-1 = "……선생님과 함께 일하는 거, 좋네."
10088-834-450-1 = "응. 해결됐네."
10088-834-460-1 = "나쁘지 않네."
