20028-828-120-1 = "Ah, I've been waiting for you, Sensei!"
20028-828-130-1 = "Th-The preparations are complete."
20028-828-140-1 = "Let me know if there's anything you need!"
20028-828-150-1 = "Just a little more! Stay strong!"
