[translation]
20028-828-120-1 = "お、お待ちして\nおりました、先生！"
20028-828-130-1 = "じゅ、準備は\nできております！"
20028-828-140-1 = "いつでも\nお声がけください！"
20028-828-150-1 = "あと少しです！\n頑張りましょう！"
20028-828-160-1 = "最後まで、\n気を引き締めて\nいきましょう……！"
20028-828-170-1 = "後片付けなら\nお任せください。\nふふ。"
20028-828-180-1 = "暑いですね……\n日差しも強くて……"
20028-828-190-1 = "その、よろしければ\n帽子、いかがですか？"
20028-828-200-1 = "あれっ、先生？\nどうされました？"
20028-828-210-1 = "え、えっと……先生？\nその……用件が\nありましたらお話を……。"
20028-828-220-1 = "ひゃっ！せ、先生！\nく、くすぐったいです！"
20028-828-230-1 = "ひゃっ、あははっ！"
20028-828-440-1 = "何かお探しですか？"
20028-828-450-1 = "どうぞ、お選びください！"
20028-828-460-1 = "まだ時間がありますから、\n一緒に見てまわりませんか？"
20028-828-470-1 = "せ、先生……ふふっ！\nわ、私の事はいいですから……\nふふ！"
20028-828-480-1 = "えっと……\n何かご用でしょうか……？"
20028-828-490-1 = "す、素敵ですね！\n私も良いと思います。"
20028-828-500-1 = "はい！こちらになります！"
20028-828-510-1 = "それは\nとても良いものですね……！\nさすがです、先生。"
20028-828-520-1 = "お探しのものが見つかって、\nよかったです！"
