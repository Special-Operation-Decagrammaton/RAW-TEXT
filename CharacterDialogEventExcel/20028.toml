[translation]
20028-828-120-1 = "อ๊ะ กำลังรอ\nอยู่เลยค่ะ คุณครู!"
20028-828-130-1 = "ฉะ... ฉันเตรียมตัว\nเสร็จแล้วค่ะ!"
20028-828-140-1 = "ไม่ว่าเมื่อไรก็บอกฉัน\nได้เสมอเลยนะคะ!"
20028-828-150-1 = "เหลืออีกนิดเดียวค่ะ! สู้ๆ นะคะ!"
20028-828-160-1 = "มาตั้งสติให้มั่น\nจนสุดทางเลยนะคะ...!"
20028-828-170-1 = "เรื่องเก็บกวาด\nไว้ใจฉันได้เลยค่ะ ฮุฮุ"
20028-828-180-1 = "ร้อนจังเลยนะคะ...\nแดดก็แรงด้วย..."
20028-828-190-1 = "ถะ... ถ้าไม่ว่าอะไร\nฉันให้ยืมหมวกไหมคะ?"
20028-828-200-1 = "หืม? คุณครูคะ?\nเป็นอะไรไปเหรอคะ?"
20028-828-210-1 = "อะ... เอ่อ... คุณครูคะ?\nถ้า... มีเรื่องอะไร\nก็บอกฉันได้นะ..."
20028-828-220-1 = "เฮือก! คะ... คุณครู!\nจะ... จั๊กจี้นะคะ!"
20028-828-230-1 = "อ๊าย!? อะฮ่าฮ่าฮ่า!!"
20028-828-440-1 = "มีของที่ต้องการหรือเปล่าคะ?"
20028-828-450-1 = "มาเลือกไปได้เลยค่ะ!"
20028-828-460-1 = "เรายังมีเวลาเหลืออยู่\nไปเดินดูด้วยกันไหมคะ?"
20028-828-470-1 = "คะ... คุณครู... พุ่บ ฮ่าฮ่า!\nฉะ... ฉันไม่เอาแล้ว... อุ๊ย! ฮ่าฮ่าฮ่า"
20028-828-480-1 = "หืม?\nมีอะไรจะบอกหรือเปล่า...?"
20028-828-490-1 = "ทะ... เท่สุดๆ ไปเลยค่ะ!\nฉันก็ว่าดีเหมือนกันค่ะ"
20028-828-500-1 = "ค่ะ! อยู่ตรงนี้ค่ะ!"
20028-828-510-1 = "นั่นมัน... น่าจะดีมากเลยละค่ะ!\nสมแล้วค่ะที่เป็นคุณครู!"
20028-828-520-1 = "โล่งอกไปทีนะคะ\nที่เจอของที่หาอยู่!"
