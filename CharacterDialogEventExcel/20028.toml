[translation]
20028-828-120-1 = "恭，恭候多時了，老師！"
20028-828-130-1 = "準，準備已經做好了！"
20028-828-140-1 = "請隨時吩咐！"
20028-828-150-1 = "就差一點了！加油吧！"
20028-828-160-1 = "直到最後，\n都要繃緊神經……！"
20028-828-170-1 = "收拾善後\n請交給我。\n呵呵。"
20028-828-180-1 = "真熱呢……\n陽光也很強……"
20028-828-190-1 = "那個，不介意的話，\n帽子，要不要借您呢？"
20028-828-200-1 = "咦？老師？\n怎麼了嗎？"
20028-828-210-1 = "那，那個……老師？\n就是……有事的話\n請告訴我……"
20028-828-220-1 = "呀！老，老師！\n很，很癢的！"
20028-828-230-1 = "呀，啊哈哈！"
20028-828-440-1 = "在找什麼嗎？"
20028-828-450-1 = "請您盡情挑選！"
20028-828-460-1 = "現在還有時間，\n要不要一起逛逛呢？"
20028-828-470-1 = "老，老師……呵呵！\n我，我的事不用在意……\n呵呵！"
20028-828-480-1 = "那個……\n有什麼事嗎……？"
20028-828-490-1 = "真，真棒呢！\n我也覺得很好。"
20028-828-500-1 = "好的！就是這些！"
20028-828-510-1 = "那真是棒極了呢……！\n不愧是您，老師。"
20028-828-520-1 = "能找到要找的東西，\n真是太好了！"
