[translation]
10105-841-10-1 = "您好，老師。"
10105-841-20-1 = "如果可以的話，\n我的舞台表演……\n希望您能來看！"
10105-841-30-1 = "準備好了嗎？"
10105-841-40-1 = "不久之後，\n演唱會即將開始！"
10105-841-50-1 = "演唱會\n還在繼續哦！"
10105-841-60-1 = "演唱會後半段，\n一起加油吧！"
10105-841-70-1 = "呼……\n全力以赴了！"
10105-841-80-1 = "老師玩得還開心嗎？"
10105-841-90-1 = "哎呀老師，\n您怎麼了嗎？"
10105-841-100-1 = "哇！\n請，請等一下！"
10105-841-110-1 = "現，現在，那個……\n因為流了點汗……"
10105-841-120-1 = "簽名……是嗎？"
10105-841-130-1 = "不，不好意思，\n我完全沒想到……！"
10105-841-140-1 = "我會帶來一場\n不留遺憾，\n最棒的表演！"
10105-841-440-1 = "在找什麼嗎？"
10105-841-450-1 = "請隨意挑選！\n我推薦的是……"
10105-841-460-1 = "請留意不要忘記東西哦！"
10105-841-470-1 = "老，老師……？"
10105-841-480-1 = "不，不是我……是那邊……"
10105-841-490-1 = "呵呵，啊哈哈……！"
10105-841-500-1 = "是那個對吧。\n我覺得很不錯！"
10105-841-510-1 = "我也對那個很感興趣。"
10105-841-520-1 = "要那個嗎？\n好的，請收下。"
10105-841-530-1 = "是這個吧。\n好的，請收下。"
