[translation]
10105-841-10-1 = "สวัสดีค่ะ คุณครู!"
10105-841-20-1 = "ถ้าคุณครูมีเวลาละก็\nมารับชมการแสดงของฉันก่อน\nแล้วค่อยกลับนะคะ!"
10105-841-30-1 = "เตรียมตัวพร้อมหรือยังคะ คุณครู?"
10105-841-40-1 = "ไลฟ์กำลังจะเริ่มแล้วนะคะ!"
10105-841-50-1 = "ไลฟ์จะยังคง\nดำเนินต่อไปค่ะ!"
10105-841-60-1 = "ไลฟ์ครึ่งหลังก็สู้ๆ นะคะ!"
10105-841-70-1 = "ฮู่ว! สดชื่นดีจริงๆ เลยค่ะ!"
10105-841-80-1 = "คุณครู... รู้สึกยังไงบ้างคะ?"
10105-841-90-1 = "ตายจริง คุณครู\nมีอะไรหรือเปล่าคะ?"
10105-841-100-1 = "ดะ... เดี๋ยวก่อนสิคะ!"
10105-841-110-1 = "ตะ... ตอนนี้\nฉันเหงื่อออก นะ... นิดหน่อย..."
10105-841-120-1 = "ลายเซ็น... เหรอคะ?"
10105-841-130-1 = "ฉะ... ฉันไม่ได้คิดถึง\nเรื่องนั้นมาก่อนเลย..."
10105-841-140-1 = "ฉันจะทำให้เป็นการแสดง\nที่ไม่รู้สึกเสียใจภายหลังเลยค่ะ!"
10105-841-440-1 = "กำลังหาอะไรอยู่เหรอคะ?"
10105-841-450-1 = "เลือกของที่ชอบได้เลยค่ะ!\nงั้นฉันขอแนะนำ..."
10105-841-460-1 = "ระวังอย่าลืม\nอะไรนะคะ!"
10105-841-470-1 = "คะ... คุณครู...?!"
10105-841-480-1 = "ทะ... ทางโน้นค่ะ... มะ... ไม่ใช่ฉัน..."
10105-841-490-1 = "ฮือออ~!"
10105-841-500-1 = "เลือกชิ้นนั้นสินะคะ\nเป็นความคิดที่ยอดเยี่ยมมากเลยค่ะ!"
10105-841-510-1 = "ฉันเองก็กำลังเล็ง\nของชิ้นนั้นไว้เหมือนกันค่ะ"
10105-841-520-1 = "จะเลือกชิ้นนั้นเหรอคะ?\nค่ะ เชิญเลยค่ะ"
10105-841-530-1 = "ชิ้นนี้ถูกมั้ยคะ?\nค่ะ นี่ค่ะ"
