[translation]
10105-841-10-1 = "Hello, Sensei."
10105-841-20-1 = "If you don't mind... Please watch me...on stage!"
10105-841-30-1 = "Are you ready, Sensei?"
10105-841-40-1 = "The concert will begin soon!"
10105-841-50-1 = "Let the concert continue!"
10105-841-60-1 = "Let's do our best for the second half of the concert!"
10105-841-70-1 = "Phew! That was refreshing!"
10105-841-80-1 = "How did you feel, Sensei?"
10105-841-90-1 = "Oh my, Sensei. What's happening?"
10105-841-100-1 = "W-Wait!"
10105-841-110-1 = "R-Right now, I'm, uh...sweaty..."
10105-841-120-1 = "Autograph...?"
10105-841-130-1 = "I-I never thought of something like that..."
10105-841-140-1 = "I'll put on a performance that I won't regret!"
10105-841-440-1 = "What are you looking for?"
10105-841-450-1 = "Please pick one to your liking! My recommendation is..."
10105-841-460-1 = "Please make sure that you didn't forget anything!"
10105-841-470-1 = "S-Sensei...?!"
10105-841-480-1 = "O-Over there... Not me..."
10105-841-490-1 = "Ahaha!"
10105-841-500-1 = "So that's what you chose. I think it's very cool!"
10105-841-510-1 = "Yes, I was looking at that one too."
10105-841-520-1 = "Would you like to go with that? Okay, here you go."
10105-841-530-1 = "This one. Okay, here you go."
