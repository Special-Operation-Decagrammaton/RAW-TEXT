[translation]
10105-841-10-1 = "こんにちは、先生。"
10105-841-20-1 = "よろしければ、\n私のステージ…\n見ていってください！"
10105-841-30-1 = "準備はよろしいですか？"
10105-841-40-1 = "間もなく、\nライブがはじまります！"
10105-841-50-1 = "まだまだライブは\n続きますよ！"
10105-841-60-1 = "ライブ後半戦、\n頑張りましょう！"
10105-841-70-1 = "ふぅ…\n目一杯出し切りました！"
10105-841-80-1 = "先生は\n楽しめたでしょうか？"
10105-841-90-1 = "あら先生、\nどうなさいました？"
10105-841-100-1 = "わっ！\nま、待ってください！"
10105-841-110-1 = "い、今は、そ、その……\n汗をかいてますから……"
10105-841-120-1 = "サイン……ですか？"
10105-841-130-1 = "す、すみません\n全然考えてなくて……！"
10105-841-140-1 = "悔いの残らない、\n最高のステージに\nしてみせます！"
10105-841-440-1 = "何をお探しでしょうか？"
10105-841-450-1 = "お好きなものをどうぞ！\n私のオススメは……"
10105-841-460-1 = "お忘れ物がないよう、\nお気をつけください！"
10105-841-470-1 = "せ、先生……？"
10105-841-480-1 = "わ、私ではなく…あちらを…"
10105-841-490-1 = "ふふ、あははっ…！"
10105-841-500-1 = "そちらですね。\nとても素敵だと思います！"
10105-841-510-1 = "私もそれ気に\nなっていました。"
10105-841-520-1 = "そちらになさいますか？\nはい、どうぞ。"
10105-841-530-1 = "こちらですね。\nはい、どうぞ。"
