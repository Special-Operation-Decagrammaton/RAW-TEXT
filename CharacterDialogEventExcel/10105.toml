[translation]
10105-841-10-1 = "안녕하세요 선생님."
10105-841-20-1 = "괜찮으시다면,\n저의 스테이지……\n보고 가 주세요!"
10105-841-30-1 = "준비 되셨나요, 선생님?"
10105-841-40-1 = "이제 라이브가 시작돼요!"
10105-841-50-1 = "아직 라이브는\n계속될 거예요!"
10105-841-60-1 = "라이브 후반전, 힘냅시다!"
10105-841-70-1 = "후우-! 개운했어요!"
10105-841-80-1 = "선생님은…… 어떠셨나요?"
10105-841-90-1 = "어머 선생님,\n무슨 일이세요?"
10105-841-100-1 = "자, 잠깐만요!"
10105-841-110-1 = "지, 지금은,\n조금, 그…… 땀이……."
10105-841-120-1 = "싸인……이요?"
10105-841-130-1 = "그, 그런 건\n생각해 본 적 없는데……."
10105-841-140-1 = "아쉬움이 남지 않는,\n그런 공연을 만들게요!"
10105-841-440-1 = "무엇을 찾으시나요?"
10105-841-450-1 = "마음에 드는 걸\n골라 보세요! 제 추천은……"
10105-841-460-1 = "잊으시는 게 없도록,\n주의해 주세요!"
10105-841-470-1 = "서, 선생님……?!"
10105-841-480-1 = "저, 저 말고…… 저쪽을……"
10105-841-490-1 = "흐으으~!"
10105-841-500-1 = "그걸 고르셨군요.\n너무 멋지다고 생각해요!"
10105-841-510-1 = "네, 저도 그걸\n보고 있었어요."
10105-841-520-1 = "그걸로 하시겠어요?\n네, 여기 있습니다."
10105-841-530-1 = "이거 맞으시죠.\n네, 여기 있습니다."
