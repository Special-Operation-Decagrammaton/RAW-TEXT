[translation]
20020-701-10010-1 = "では、\n特異現象捜査部としての\n活動を始めましょうか。"
20020-701-10020-1 = "ふふっ。お待ちして\nおりましたよ、先生。"
20020-701-10030-1 = "……ああ、只今データの\n分析中ですので\n少々お待ちを。"
20020-701-10040-1 = "なるほど、\n興味深いですね……"
20020-701-10050-1 = "これがこうなって、\nふむ……"
20020-701-10060-1 = "デカグラマトン……\n厄介な相手ですね。"
20020-701-10070-1 = "リスクは\nありそうですが……"
20020-701-10080-1 = "ふふっ、尚のこと\n興味深いですね。"
20020-701-10090-1 = "新たなデータが\n入手できたようですね。"
20020-701-10100-1 = "さて、今回はどんな\nデータなのでしょうか。"
20020-701-10110-1 = "次の目標が\n決まりましたね。"
20020-701-10120-1 = "では、次の段階に\n進みましょう。"
20020-70000-10510-1 = "新たな任務、\nそして新たな環境……"
20020-70000-10520-1 = "…さあ、\nはじめましょう。先生。"
20020-70000-10530-1 = "先生、手を\n貸していただけますか？"
20020-70000-10540-1 = "あら、超天才清楚系\n病弱美少女だって、"
20020-70000-10550-1 = "人の手が\n必要なんですよ？"
20020-70000-10560-1 = "こんにちは、先生。"
20020-70000-10570-1 = "ここが私たちの\n新しい基地です。"
20020-70000-10580-1 = "条件の増加を\n確認しました。"
20020-70000-10590-1 = "どこまで変数を\n抑えられるか…\n慎重にいきましょう。"
20020-70000-10600-1 = "情報は多いほど歓迎、\nではありますが……"
20020-70000-10610-1 = "あまり一気に渡されると、\nそれはそれで\n困ってしまいます。"
20020-70000-10620-1 = "少し疲れましたね……"
20020-70000-10630-1 = "こんな時に甘えさせて\nくれる先生がいたら\nとても嬉しいのですが。"
20020-70000-10640-1 = "最高のハッカーであり、\n最高の美少女である私に"
20020-70000-10650-1 = "最高のパートナーが\n不在だなんて、"
20020-70000-10660-1 = "由々しき事態です。\nですので先生には私の…"
20020-70000-10670-1 = "なんでもありません…\n今のは忘れてください。"
20020-70000-10680-1 = "新しい局面に入った…\nといった\nところでしょうか。"
20020-70000-11550-1 = "ここでは、\n先生に集めていただいた"
20020-70000-11560-1 = "「物質」の分析を\n行っております。"
20020-70000-11570-1 = "おかえりなさい、先生。\nはぁ……待ちくたびれましたよ。"
20020-70000-11580-1 = "サンプルの収集は進みましたか？\nこちらにお願いしますね。"
20020-70000-11590-1 = "いつもご協力\nありがとうございます、先生。"
20020-70000-11600-1 = "さて、\nどんな情報が出てくることやら。"
20020-70000-11610-1 = "おかげさまで調査は順調です。\nそれにしてもこの現象…\n実に興味深いですね。"
20020-70000-11620-1 = "はぁ、まさか分析が\n追いつかなくなるとは……"
20020-70000-11630-1 = "なんて贅沢な\n環境なのでしょう。"
20020-70000-11640-1 = "探求とは、\nいつも胸躍るもの。"
20020-70000-11650-1 = "そこに先生が\nご一緒してくださるのであれば…\nふふっ、言うまでもありません。"
20020-70000-11660-1 = "分析完了です。\nどうぞ持っていってください。"
20020-70000-11670-1 = "解釈結果はお気に召しましたか？\nふふ、またお越しください。"
20020-70000-11680-1 = "先生のために丹精\n込めて分析いたしました。\nはい、受け取ってください。"
20020-70000-11690-1 = "……こ、公私は分けている\nつもりですとも、ええ。"
20020-70000-11700-1 = "先生にサンプルを\n集めていただいて、"
20020-70000-11710-1 = "私たちはそれを分析し、\nお渡しする……"
20020-70000-11720-1 = "「物々交換」の成立ですね。"
20020-70000-11730-1 = "毎度ありがとうございます。\n……いかがでしたか？"
20020-70000-11740-1 = "超天才清楚系病弱美少女の\n一日店番サービスは。"
20020-70000-12200-1 = "分析の方向を\n少し変えてみました。"
20020-70000-12210-1 = "偶然と必然、\n絶対論と相対論…"
20020-70000-12220-1 = "魅力的な題材です。\nそうは思いませんか？\n先生。"
20020-70000-12230-1 = "先生も運試しを\nしてみては？"
20020-70000-12240-1 = "占星術によると今日の\nラッキーカラーは…"
20020-70000-12250-1 = "…え？それは大丈夫…？"
20020-70000-12260-1 = "確率や統計は、\n物事の大半を\n決定づけるものです。"
20020-70000-12270-1 = "占星術はもちろん、\n「くじ引き」とて……\n例外ではありません。"
20020-70000-12280-1 = "全ては統制されるべき…\nという言葉に、\n私は反対です。"
20020-70000-12290-1 = "まだ見ぬ世界との\n遭遇にこそ、"
20020-70000-12300-1 = "価値があると\n思っておりますので。"
20020-70000-12310-1 = "未知の領域……\n心惹かれるものです。"
20020-70000-12320-1 = "科学によって多くの\n謎が解き明か\nされたとしても、"
20020-70000-12330-1 = "未知の領域というのは\n依然として\n残り続けるものです。"
20020-70000-12340-1 = "……そうでないと、\n退屈して\nしまいますから。"
20020-70000-12350-1 = "いつしか私たちは、\n目標地点にたどり着き、"
20020-70000-12360-1 = "そして…更なる目標の\n誕生を目撃する\nことでしょう。"
20020-70000-12370-1 = "おめでとうございます、\n先生。結果を\n予想できたとはいえ、"
20020-70000-12380-1 = "成果を実感する瞬間は、\n喜んでも良いのでは\nないでしょうか？"
20020-70000-12390-1 = "あら、これは\nいわゆる「当たり」、\nなのですね？"
20020-70000-12400-1 = "統計学上、当たり前の\n結果だとしても"
20020-70000-12410-1 = "そこから喜びを\n感じるのは私たちの自由……。"
20020-70000-12420-1 = "素晴らしいです、先生。\n私も嬉しいです。"
20020-70000-12430-1 = "「特別」を\n感じられるのは、\n「普通」があるから。"
20020-70000-12440-1 = "ですので、「普通」を\n大切にしてくださいね。\n先生。"
20020-70000-12450-1 = "…ついでに、苦労してる\n超天才清楚系\n病弱美少女のことも。"
