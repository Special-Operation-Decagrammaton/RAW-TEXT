[translation]
20020-701-10010-1 = "มาเริ่มภารกิจของชมรม\nปรากฏการณ์ลี้ลับเลยดีไหมคะ"
20020-701-10020-1 = "ฮุฮุ กำลังรออยู่เลยค่ะ\nคุณครู"
20020-701-10030-1 = "อืม... ตอนนี้ฉันกำลัง\nวิเคราะห์ข้อมูลอยู่ค่ะ\nกรุณารอสักครู่นะคะ"
20020-701-10040-1 = "อืม...\nดูน่าสนใจดีนะคะ..."
20020-701-10050-1 = "ถ้าทำแบบนี้แล้ว...\nอืม..."
20020-701-10060-1 = "เดคาแกรมมาทอน...\nเป็นศัตรูที่เข้าใจยากจริงๆ ค่ะ"
20020-701-10070-1 = "ถึงจะดูเสี่ยงไปอยู่บ้าง..."
20020-701-10080-1 = "ฮุฮุ แต่เพราะอย่างนั้น\nมันถึงได้ดูน่าสนใจขึ้นไงล่ะคะ"
20020-701-10090-1 = "ฉันได้ข้อมูล\nชุดใหม่มาแล้วค่ะ"
20020-701-10100-1 = "งั้นไปดูกันเลยไหมคะ\nว่ารอบนี้เป็นข้อมูลอะไร"
20020-701-10110-1 = "เป้าหมายต่อไป\nถูกกำหนดไว้แล้วละค่ะ"
20020-701-10120-1 = "เอาละ ฉันจะไปต่อ\nที่สเต็ปถัดไปเลยนะคะ"
20020-70000-10510-1 = "ภารกิจใหม่\nและสภาพแวดล้อมใหม่ๆ..."
20020-70000-10520-1 = "เอาละ...\nมาเริ่มกันเลยดีกว่าค่ะ คุณครู"
20020-70000-10530-1 = "คุณครูจะมาช่วยฉันด้วยใช่มั้ยคะ?"
20020-70000-10540-1 = "ตายจริง ต้องการความช่วยเหลือ"
20020-70000-10550-1 = "จากสาวน้อยผู้มีรอยยิ้มสดใสฮีลใจ\nเหมือนยาวิเศษงั้นเหรอคะ?"
20020-70000-10560-1 = "มาแล้วเหรอคะ คุณครู"
20020-70000-10570-1 = "ที่นี่คือฐานแห่งใหม่ของ\nพวกเราค่ะ"
20020-70000-10580-1 = "ยืนยันเงื่อนไขที่เพิ่มขึ้นมาค่ะ"
20020-70000-10590-1 = "มาจับตาดูกันเถอะค่ะ\nว่าควบคุมตัวแปรไปได้อีก\nแค่ไหน..."
20020-70000-10600-1 = "ยิ่งข้อมูลมากเท่าไร\nก็ยิ่งดีเท่านั้น แต่ว่านี่มัน..."
20020-70000-10610-1 = "ถ้าให้มามากเกินไปในครั้งเดียว\nมันก็ลำบากนิดหน่อยนะคะ"
20020-70000-10620-1 = "รู้สึกเหนื่อยนิดหน่อยค่ะ..."
20020-70000-10630-1 = "เวลาแบบนี้ ถ้ามีคุณครู\nที่ยอมรับเวลาฉันงอแง\nก็คงจะดีไม่น้อยเลยนะคะ"
20020-70000-10640-1 = "สำหรับฉันที่เป็นสาวน้อย\nผู้มีรอยยิ้มพิมพ์ใจ\nและสุดยอดแฮ็กเกอร์"
20020-70000-10650-1 = "กลับขาดพาร์ทเนอร์\nที่ยอดเยี่ยมไปแบบนี้"
20020-70000-10660-1 = "นับเป็นเหตุการณ์ที่สำคัญ\nอย่างยิ่งค่ะ เพราะงั้นคุณครู\nจะช่วยมาเป็น..."
20020-70000-10670-1 = "ไม่มีอะไรหรอกค่ะ...\nช่วยลืมเรื่องที่พูดเมื่อสักครู่\nไปด้วยค่ะ"
20020-70000-10680-1 = "ตอนนี้เข้าสู่เฟสใหม่แล้ว...\nคิดแบบนั้นได้หรือเปล่านะคะ"
20020-70000-11550-1 = "กำลังวิเคราะห์ 「สาร」 ที่คุณครู"
20020-70000-11560-1 = "รวบรวมมาเก็บไว้อยู่ที่นี่ค่ะ"
20020-70000-11570-1 = "เชิญเลยค่ะ คุณครู\nฮู่ว... รอจนเหนื่อยเลยค่ะ"
20020-70000-11580-1 = "เก็บตัวอย่างมาหรือยังคะ?\nรบกวนทางนี้ด้วยค่ะ"
20020-70000-11590-1 = "ขอบคุณนะคะคุณครู\nที่คอยให้ความร่วมมือมาโดยตลอด"
20020-70000-11600-1 = "จะได้ข้อมูลอะไรกันนะ"
20020-70000-11610-1 = "ขอบคุณที่ทำให้การสำรวจราบรื่นค่ะ\nแต่ถึงอย่างนั้น... ปรากฏการณ์นี้...\nก็น่าสนใจไม่น้อยเลยนะคะ"
20020-70000-11620-1 = "ฮ่า หรือว่าการวิเคราะห์\nจะตามไม่ทันกันนะ..."
20020-70000-11630-1 = "นี่เป็นสถานการณ์\nที่เกินฝันมากเลยนะคะ"
20020-70000-11640-1 = "การสำรวจครั้งใหม่ ไม่ว่าเมื่อไร\nก็เป็นสิ่งที่สนุกเสมอเลยนะคะ"
20020-70000-11650-1 = "ถ้ามีคุณครูร่วมการสำรวจด้วยละก็...\nคงไม่มีอะไรสนุกกว่านี้แล้วละค่ะ"
20020-70000-11660-1 = "วิเคราะห์เสร็จเรียบร้อยแล้วค่ะ\nเชิญนำไปได้เลยค่ะ คุณครู"
20020-70000-11670-1 = "พึงพอใจกับ\nผลการวิเคราะห์หรือเปล่าคะ?\nฮุฮุ คราวหน้าไว้มาใหม่นะคะ"
20020-70000-11680-1 = "ฉันจะวิเคราะห์สุดฝีมือ\nเพื่อคุณครูเลยค่ะ\nค่ะ ช่วยรับไว้ด้วยนะคะ"
20020-70000-11690-1 = "ตะ... ต้องแยกแยะระหว่าง\nเรื่องงานกับเรื่องส่วนตัวค่ะ ใช่แล้วค่ะ"
20020-70000-11700-1 = "คุณครูรวบรวมตัวอย่างมาให้"
20020-70000-11710-1 = "พวกเราจะทำการวิเคราะห์\nและส่งผลให้..."
20020-70000-11720-1 = "นี่เป็นความสำเร็จของ\n'การแลกเปลี่ยนสินค้า' กันสินะคะ "
20020-70000-11730-1 = "ขอบคุณเสมอเลยนะคะ\nเป็นยังไงบ้างคะ...?"
20020-70000-11740-1 = "บริการหน้าร้านประจำวัน\nของสาวน้อยผู้มีรอยยิ้มพิมพ์ใจ"
20020-70000-12200-1 = "ฉันลองปรับทิศทางการ\nวิเคราะห์นิดหน่อยค่ะ"
20020-70000-12210-1 = "ความบังเอิญกับความแน่นอน\nทฤษฎีสัมบูรณ์และสัมพัทธภาพ..."
20020-70000-12220-1 = "เป็นข้อมูลที่มีเสน่ห์มากเลยค่ะ\nไม่คิดอย่างนั้นเหรอคะ? คุณครู"
20020-70000-12230-1 = "คุณครูเองก็ลองทดสอบดวง\nดูสักหน่อยมั้ยคะ?"
20020-70000-12240-1 = "ถ้าอิงตามโหราศาสตร์ละก็...\nสีนำโชคของวันนี้..."
20020-70000-12250-1 = "คะ...?\nเรื่องนั้นไม่เป็นไรเหรอคะ...?"
20020-70000-12260-1 = "ความน่าจะเป็นหรือสถิติ\nเป็นสิ่งที่ตัดสินสิ่งต่างๆ\nซะส่วนใหญ่นี่คะ"
20020-70000-12270-1 = "สำหรับเรื่องดวงน่ะ...\n「การสุ่ม」ก็ไม่มี\nข้อยกเว้นหรอกนะคะ"
20020-70000-12280-1 = "ฉันคัดค้านคำพูดที่บอกว่า\nทุกอย่างจะต้องถูกปิดกั้นค่ะ..."
20020-70000-12290-1 = "เพราะฉันคิดว่า\nการเผชิญหน้ากับโลก"
20020-70000-12300-1 = "ที่เรายังไม่เคยได้รู้จัก\nเป็นสิ่งที่มีคุณค่าค่ะ"
20020-70000-12310-1 = "พื้นที่ที่ยังไม่ถูกค้นพบ...\nเป็นสิ่งที่ดึงดูดใจมากนะคะ"
20020-70000-12320-1 = "ถึงแม้วิทยาศาสตร์\nจะไขปริศนาได้\nหลายอย่างแล้วก็ตาม"
20020-70000-12330-1 = "แต่ก็ยังมีพื้นที่ที่ไม่ถูกค้นพบ\nเหลืออยู่อีกค่ะ"
20020-70000-12340-1 = "ถ้าไม่อย่างนั้นละก็...\nมันคงจะน่าเบื่อน่าดูเลยนะคะ"
20020-70000-12350-1 = "สักวันหนึ่งเมื่อพวกเรา\nทำเป้าหมายที่คิดไว้ได้สำเร็จ"
20020-70000-12360-1 = "และ... ก็จะได้เห็นถึง\nการถือกำเนิดของเป้าหมาย\nที่สูงขึ้นในอีกระดับหนึ่งสินะคะ"
20020-70000-12370-1 = "ยินดีด้วยค่ะ คุณครู\nถึงจะบอกว่าสามารถ\nคาดการณ์ผลลัพธ์ไว้ได้ก่อนแล้ว"
20020-70000-12380-1 = "แต่ช่วงเวลาที่ได้สัมผัสกับความสำเร็จ\nก็น่าจะมีความสุขไม่ใช่เหรอคะ?"
20020-70000-12390-1 = "ตายจริง นี่มันคือ\nสิ่งที่เรียกว่า 'ถูกรางวัล' ใช่มั้ยคะ?"
20020-70000-12400-1 = "หากดูตามสถิติ\nถึงจะบอกว่าผล\nมันแน่นอนอยู่แล้วก็เถอะ"
20020-70000-12410-1 = "แต่การที่จะดีใจในเรื่องนั้น มันก็เป็นสิทธิของพวกเรา..."
20020-70000-12420-1 = "ยอดเยี่ยมมากค่ะ คุณครู\nฉันเองก็ดีใจเหมือนกันค่ะ"
20020-70000-12430-1 = "สิ่งที่ทำให้รู้สึกได้ถึง 'ความพิเศษ'\nก็เพราะมี 'ความธรรมดา' อยู่ยังไงล่ะคะ"
20020-70000-12440-1 = "เพราะงั้นช่วยรักษา 'ความธรรมดา'  ไว้อย่างดีด้วยนะคะคุณครู"
20020-70000-12450-1 = "แล้วก็... สาวน้อยผู้มีรอยยิ้มฮีลใจที่กำลังทำงานหนักคนนี้ด้วยนะคะ"
20020-900701-10010-1 = "มาเริ่มภารกิจของชมรม\nปรากฏการณ์ลี้ลับเลยดีไหมคะ"
