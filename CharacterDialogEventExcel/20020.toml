20020-900701-10070-1 = "雖然感覺\n會有風險……"
20020-900701-10080-1 = "呵呵，更讓人\n覺得有趣了呢。"
20020-900701-10090-1 = "似乎取得\n新情報了呢。"
20020-900701-10100-1 = "那麼，這次會是\n怎麼樣的情報呢。"
20020-900701-10110-1 = "下一個目標\n已經決定了呢。"
