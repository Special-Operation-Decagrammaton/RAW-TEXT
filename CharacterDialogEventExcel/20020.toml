[translation]
20020-701-10010-1 = "那麼，開始\n特異現象搜查部的\n活動吧。"
20020-701-10020-1 = "呵呵，我一直\n在等您哦，老師。"
20020-701-10030-1 = "……啊，現在正在\n分析數據，還請稍等。"
20020-701-10040-1 = "原來如此，\n真有趣……"
20020-701-10050-1 = "這個就像這樣，\n嗯……"
20020-701-10060-1 = "十字神名……\n是個麻煩的對手。"
20020-701-10070-1 = "雖然感覺\n會有風險……"
20020-701-10080-1 = "呵呵，更讓人\n覺得有趣了呢。"
20020-701-10090-1 = "似乎取得\n新情報了呢。"
20020-701-10100-1 = "那麼，這次會是\n怎麼樣的情報呢。"
20020-701-10110-1 = "下一個目標\n已經決定了呢。"
20020-701-10120-1 = "那麼，進入\n下一個階段吧。"
20020-70000-10510-1 = "新的任務，\n以及新的環境……"
20020-70000-10520-1 = "……來，開始吧。老師。"
20020-70000-10530-1 = "老師，能請您\n助我一臂之力嗎？"
20020-70000-10540-1 = "哎呀，即便是超天才\n清楚系病弱美少女，"
20020-70000-10550-1 = "也是需要別人\n幫助的唷？"
20020-70000-10560-1 = "您好，老師。"
20020-70000-10570-1 = "這裡就是\n我們的新基地。"
20020-70000-10580-1 = "條件的增加已經確認。"
20020-70000-10590-1 = "能將變數抑制到\n什麼程度……\n慎重地進行吧。"
20020-70000-10600-1 = "情報越多越好，\n但話雖如此……"
20020-70000-10610-1 = "要是一次收到太多，\n倒也有點傷腦筋。"
20020-70000-10620-1 = "有點累了呢……"
20020-70000-10630-1 = "如果這種時候有能\n讓我撒嬌的老師在，\n那就太令人高興了。"
20020-70000-10640-1 = "身為最強駭客，\n也是最強美少女的我，"
20020-70000-10650-1 = "居然會缺少\n最強的夥伴，"
20020-70000-10660-1 = "這是相當嚴重的事態。\n所以就由老師擔任我的……"
20020-70000-10670-1 = "我什麼都沒說……\n剛才的請您忘了吧。"
20020-70000-10680-1 = "進入了新的局面……\n該這麼說嗎？"
20020-70000-11550-1 = "這個地方，正在對\n對老師蒐集回來的"
20020-70000-11560-1 = "「物質」進行分析。"
20020-70000-11570-1 = "歡迎回來，老師。\n哈啊……我等到都累了。"
20020-70000-11580-1 = "樣本的收集有進展嗎？\n請您放在這邊。"
20020-70000-11590-1 = "感謝您一直以來\n的協助，老師。"
20020-70000-11600-1 = "那麼，究竟會\n得出什麼樣的情報呢？"
20020-70000-11610-1 = "託您的福，調查相當順利。\n不過這個現象……真是耐人尋味呢。"
20020-70000-11620-1 = "唉，沒想到分析\n竟然會落後……"
20020-70000-11630-1 = "多麼奢侈的環境啊。"
20020-70000-11640-1 = "探求，總是能\n讓人心胸澎湃。"
20020-70000-11650-1 = "如果還能跟老師一同參與……\n呵呵，那就更不用說了。"
20020-70000-11660-1 = "分析已經完成。\n請您儘管拿吧。"
20020-70000-11670-1 = "解釋結果還滿意嗎？\n呵呵，歡迎下次再來。"
20020-70000-11680-1 = "我為老師投注心血\n進行了分析。來，請收下。"
20020-70000-11690-1 = "……公，公私我可是\n有分清楚哦，嗯嗯。"
20020-70000-11700-1 = "老師負責收集樣本，"
20020-70000-11710-1 = "我們則對其加以分析，\n並進行交付……"
20020-70000-11720-1 = "「以物易物」成立了呢。"
20020-70000-11730-1 = "感謝您的惠顧。\n……怎麼樣呀？"
20020-70000-11740-1 = "超天才清楚系病弱美少女的\n一日店員服務。"
20020-70000-12200-1 = "我試著調整了\n分析的方向。"
20020-70000-12210-1 = "偶然與必然，\n絕對論與相對論……"
20020-70000-12220-1 = "真是充滿魅力的題材。\n您不這麼認為嗎？老師。"
20020-70000-12230-1 = "老師要不要也來\n試試運氣？"
20020-70000-12240-1 = "占星術顯示\n今天的幸運色是……"
20020-70000-12250-1 = "……咦？不用了……？"
20020-70000-12260-1 = "機率跟統計，\n是決定大多數\n事物的要素。"
20020-70000-12270-1 = "占星術自不用說，\n就連「抽籤」……\n也不例外。"
20020-70000-12280-1 = "一切都該被掌控……\n這樣的論點，\n我個人是反對的。"
20020-70000-12290-1 = "因為我認為\n與未知世界的遭遇……"
20020-70000-12300-1 = "才是真正有價值的事。"
20020-70000-12310-1 = "未知的領域……\n真是令人著迷。"
20020-70000-12320-1 = "即便依靠科學\n解開了許多謎團……"
20020-70000-12330-1 = "未知的領域依舊\n會持續存在。"
20020-70000-12340-1 = "……不然的話，\n實在太無趣了。"
20020-70000-12350-1 = "不知不覺間，\n我們將抵達目標……"
20020-70000-12360-1 = "並且……又會目擊\n嶄新目標的誕生吧。"
20020-70000-12370-1 = "恭喜您，老師。\n雖說結果是\n可以預期的……"
20020-70000-12380-1 = "但實際體會成果的瞬間，\n仍然是值得高興的吧？"
20020-70000-12390-1 = "哎呀，這就是\n所謂的「中獎」對吧？"
20020-70000-12400-1 = "即便在統計學上，\n這是理所當然的結果……"
20020-70000-12410-1 = "但從中感受到喜悅\n卻是我們的自由……"
20020-70000-12420-1 = "真是太棒了，老師。\n我也很高興。"
20020-70000-12430-1 = "之所以感到「特別」，\n是因為「普通」的存在。"
20020-70000-12440-1 = "所以，請您務必珍惜\n「普通」哦，老師。"
20020-70000-12450-1 = "……還有辛勞的\n超天才清楚系\n病弱美少女也順便。"
20020-900701-10010-1 = "那麼，開始\n特異現象搜查部的\n活動吧。"
20020-900701-10020-1 = "呵呵，我一直\n在等您哦，老師。"
