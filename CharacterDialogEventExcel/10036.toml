[translation]
10036-812-160-1 = "ทำได้ดีมากค่ะ คุณครู!\nฉันกำลังรออยู่เลยค่ะ!"
10036-812-170-1 = "ขอให้มีความสงบสุข \nตลอดไปนะคะ..."
10036-812-180-1 = "ว่าแล้วเชียว ถ้าฉันทำแบบนี้\nคงจะแปลกๆ สินะคะ...?"
10036-812-190-1 = "ถ้างั้นมาออกแรงเพิ่ม\nอีกหน่อยดีมั้ยคะ?!"
10036-812-200-1 = "ฉันคิดว่าพวกเรา...\nคงต้องรีบกันหน่อยแล้วค่ะ..."
10036-812-210-1 = "ฉะ...ฉันจะพยายามค่ะ!"
10036-812-220-1 = "ใกล้หมดเวลาแล้วนะคะ\nฉันจะช่วยคุณครูเองค่ะ!"
10036-812-230-1 = "คุณครูต้องการอะไรรึเปล่าคะ\nมีของที่ต้องการรึเปล่าคะ?"
10036-812-240-1 = "คะ...คือว่า...?\nคุณครูมีเรื่องอะไร...\nจะพูดรึเปล่าคะ?"
10036-812-250-1 = "คุณครูคะ...?\nมีอะไรติดอยู่ที่หน้าฉัน\nรึเปล่าคะ?"
10036-812-260-1 = "ที่จริงฉันเองก็รู้สึก\nสนุกมากที่ได้พุดคุย\nกับคุณครูแบบนี้แต่ว่า..."
10036-812-270-1 = "ระ...เราออกเดินทาง\nกันเลยดีมั้ยคะ...?"
10036-812-280-1 = "ฉะ...ฉันลองจัดของที่จำเป็นไว้แล้วค่ะ!\nคุณครูลองดูได้ตามสบายเลยนะคะ..."
10036-812-290-1 = "ถ้าเป็นเรื่องการจัดของ\nเชื่อมือฉันได้เลยค่ะ…!\nดูนะคะ!"
10036-812-300-1 = "ยังมีเวลาเหลืออยู่นิดหน่อย\nลองเลือกดูก่อนที่จะหมดเวลา\nดีมั้ยคะ?"
10036-812-310-1 = "คะ...คือว่าฉัน...\nคะ...ควรต้องทำยังไงดี...?"
10036-812-320-1 = "ยะ...อย่ามองฉันสิคะ\nชะ...ช่วยดูของด้านนี้หน่อยค่ะ…!"
10036-812-330-1 = "อ๊ะ ชิ้นนั้นก็ดีนะคะ!"
10036-812-340-1 = "ค่ะ ฉันเองก็คิดว่า\nดีเหมือนกันค่ะ"
10036-812-350-1 = "สมกับเป็นคุณครูที่สุดเลยค่ะ!"
10036-812-360-1 = "ฮิฮิ เลือกของได้ดีมากเลยค่ะ!"
