[translation]
10036-812-160-1 = "You're here, Sensei! I've been waiting for you!"
10036-812-170-1 = "Peace be with you. Always."
10036-812-180-1 = "...It's a bit awkward when I try to say it, huh?"
10036-812-190-1 = "Let's try a little harder!"
10036-812-200-1 = "I think we need to hurry up a bit..."
10036-812-210-1 = "I-I'll try my best!"
10036-812-220-1 = "Finishing things is important. I'll help you!"
10036-812-230-1 = "Is something wrong, Sensei? Do you need anything?"
10036-812-240-1 = "Um... Is there something on your mind?"
10036-812-250-1 = "Sensei? Is there something on my face?"
10036-812-260-1 = "I like talking about things like this with you, but..."
10036-812-270-1 = "Isn't it about time we start heading out?"
10036-812-280-1 = "I-I organized the things you need! Take a look when you can!"
10036-812-290-1 = "I'm good at organizing and managing! Please, take a look!"
10036-812-300-1 = "There's some work left to do. Could you check before I finish?"
10036-812-310-1 = "I-I-I... What am I supposed to do...?"
10036-812-320-1 = "P-Please look at the organized items, not at me..."
10036-812-330-1 = "Oh, that's good!"
10036-812-340-1 = "I agree. That would be best."
10036-812-350-1 = "I knew I could count on you!"
10036-812-360-1 = "Hmm... I think that's good!"
