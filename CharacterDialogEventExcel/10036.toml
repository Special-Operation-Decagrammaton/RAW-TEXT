[translation]
10036-812-160-1 = "お疲れ様です、先生！\nお待ちしておりました\n……！"
10036-812-170-1 = "どうか、安らぎが\n訪れますように……"
10036-812-180-1 = "えっと……やっぱり\n私にはこういうの、\n似合わないでしょうか\n……？"
10036-812-190-1 = "では、気合を入れ直して\n頑張りましょう！"
10036-812-200-1 = "あ、少し急いだほうが\n良いかもしれませんね\n……？"
10036-812-210-1 = "が、頑張ります！"
10036-812-220-1 = "お片付けの時間ですね、\n全力でお手伝いします！"
10036-812-230-1 = "……？先生、どうか\nされましたか？\n何か必要なものでも\nありました？"
10036-812-240-1 = "え、えっと……？\nどうかされましたか？"
10036-812-250-1 = "先生……？何か私に、\n変なものでも\nついてましたか？"
10036-812-260-1 = "こうして先生と\nお話しするのは\n楽しいのですが、その、"
10036-812-270-1 = "そろそろ出発\nした方が……？"
10036-812-280-1 = "じ、実は、必要になりそうなものを、\n事前にまとめておきました！\nご確認、よろしくお願いいたします……！"
10036-812-290-1 = "整理や管理でしたら、\nぜひ私に任せてください……！\nこちらをどうぞ！"
10036-812-300-1 = "まだもう少し時間がありそうです、\n確認されていきますか？"
10036-812-310-1 = "え、えっと、\n私は一体どうしたら……？"
10036-812-320-1 = "わ、私ではなくその、\nこちらを見ていただきたく……！"
10036-812-330-1 = "あっ、良いですね、それ！"
10036-812-340-1 = "はい、私もそれが\n良いと思います。"
10036-812-350-1 = "さすがは先生です！"
10036-812-360-1 = "ふふっ、良い\nお買い物でしたね！"
