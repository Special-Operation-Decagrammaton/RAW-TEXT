[translation]
10036-812-160-1 = "辛苦了，老師！\n恭候多時了……！"
10036-812-170-1 = "希望\n平安與您同在……"
10036-812-180-1 = "那個……果然\n這種工作\n不太適合我嗎……？"
10036-812-190-1 = "那麼，重新打起精神\n一起加油吧！"
10036-812-200-1 = "啊，稍微加緊腳步\n似乎會比較好呢……？"
10036-812-210-1 = "我，我會努力的！"
10036-812-220-1 = "到收尾時間了呢，\n我會全力幫忙的！"
10036-812-230-1 = "……？老師，\n發生什麼事了嗎？\n有什麼需要的東西嗎？"
10036-812-240-1 = "那，那個……？\n發生什麼事了嗎……？"
10036-812-250-1 = "老師……？我的臉上\n沾到什麼\n奇怪的東西了嗎……？"
10036-812-260-1 = "雖然像這樣\n和老師說話\n很開心，但是那個，"
10036-812-270-1 = "是不是差不多\n該出發了……？"
10036-812-280-1 = "其，其實，我事先把可能\n會需要的東西統整好了！\n再麻煩您確認了……！"
10036-812-290-1 = "如果需要整理或管理，\n請務必交給我……！\n這些請您過目！"
10036-812-300-1 = "似乎還剩下一點時間，\n要不要去確認一下呢？"
10036-812-310-1 = "那，那個，\n我究竟該怎麼做……？"
10036-812-320-1 = "不，不是看我，\n請您看這邊……！"
10036-812-330-1 = "啊，那個不錯呢！"
10036-812-340-1 = "是的，我也覺得\n那個東西不錯。"
10036-812-350-1 = "不愧是老師！"
10036-812-360-1 = "呵呵，真是\n不錯的一次購物呢！"
