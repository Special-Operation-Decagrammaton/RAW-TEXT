900900601-10 = "TV Special! Limited Campaign in Progress!"
900900601-20 = "This huge sale is just for you! Seriously! We're taking huge losses on this! So you better come ready to indulge!"
900900601-30 = "Low stock! Supplies are limited, so this is your last chance!"
900900601-40 = "Sold out! Please wait for the restock!"
900900601-50 = "Opening sale! A bargain from your dreams!"
900900601-60 = "Thank you for shopping with us!"
900900601-70 = "Thanks to you, it was a great success!"
900900601-80 = "It might be sold out, but the stream don't stop!"
900900601-90 = "That's the nature of contractual obligations!"
900900601-100 = "Things are wrapping up!"
900900601-110 = "Do you have any last-minute purchases?"
900900601-120 = "Welcome to the special live stream!"
