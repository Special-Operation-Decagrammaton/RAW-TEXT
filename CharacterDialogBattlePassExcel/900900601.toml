[translation]
900900601-10 = "TV 한정 특별 캠페인,\n개최 중입니다!"
900900601-20 = "적자 각오한\n대박 세일이에요~!\n보고 가세요!"
900900601-30 = "매진 임박!\n현재 재고 한정,\n이번 기회뿐이에요~!"
900900601-40 = "완판되었습니다!\n재입고를 기다려 주세요!"
900900601-50 = "오픈 세일이에요~!\n아주 저렴하다구요!"
900900601-60 = "항상 애용해 주셔서\n감사합니다!"
900900601-70 = "덕분에 대성황입니다!"
900900601-80 = "완판이 되어도\n방송은 계속됩니다."
900900601-90 = "계약서가 그래서요!"
900900601-100 = "드디어 엔딩 시간이\n다가왔습니다!"
900900601-110 = "구매 놓치신 것은\n없으신가요?"
900900601-120 = "스페셜 생방송에\n오신 것을 환영합니다!"
900900601-130 = "본 프로그램은\n보도부의 아이돌,\n카와루 시논이\n진행하고 있습니다!"
900900601-140 = "놓치지 않도록\n주의해 주세요!"
900900601-150 = "그거 맛있어요!"
900900601-160 = "…… 엥?\n대본이 왜 이러지?!"
900900601-170 = "이게 바로 어른의\n관록이라는 거네요!"
900900601-180 = "구매해 주셔서\n감사합니다!"
900900601-190 = "이 속도, 카메라에\n담지 못하겠는데요!"
900900601-200 = "이 역경, 선생님은\n돌파할 수 있을지!"
900900601-210 = "채널고정입니다!"
900900601-220 = "아직 안 가셨어요?"
900900601-230 = "바…… 방송\n끝났는데…… 요?"
900900601-240 = "도와드릴 수는\n없습니다,\n보도 중립이니까요!"
900900601-250 = "어허! '했다 치고'는\n반칙이에요!"
900900601-260 = "대활약이었어요!\n시청률 갱신은\n틀림없어요!!"
900900601-270 = "축하드립니다!\n한 말씀 부탁드립니다!"
900900601-280 = "TV 한정 특별 캠페인,\n개최 중입니다!"
