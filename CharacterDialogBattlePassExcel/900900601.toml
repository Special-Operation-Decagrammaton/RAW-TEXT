[translation]
900900601-10 = "แคมเปญพิเศษเฉพาะทางทีวี\nกำลังเริ่มขึ้นแล้วค่ะ!"
900900601-20 = "ลดราคาครั้งใหญ่\nแบบไม่กลัวขาดทุนเลยค่ะ~!\nแวะมาชมก่อนสิคะ!"
900900601-30 = "ขายเกือบหมดแล้วค่ะ!\nตอนนี้เหลือไม่เยอะแล้ว\nอย่าพลาดโอกาสนี้นะคะ~!"
900900601-40 = "ขายหมดเกลี้ยงแล้วค่ะ!\nรอเติมสต๊อกใหม่ก่อนนะคะ!"
900900601-50 = "ลดราคาฉลองเปิดร้านค่ะ~!\nมาดูสินค้าราคาย่อมเยาสิคะ!"
900900601-60 = "ขอบคุณที่มาใช้\nบริการตลอดเลยนะคะ!"
900900601-70 = "แบบนี้กิจการรุ่งเรืองเลยค่ะ!"
900900601-80 = "ต่อให้ขายหมดเกลี้ยงแล้ว\nแต่ก็ยังไม่ปิดรายการหรอกนะคะ"
900900601-90 = "ในสัญญาบอกไว้อย่างนั้นค่ะ!"
900900601-100 = "อีกไม่นานก็จะ\nหมดเวลาแล้วค่ะ!"
900900601-110 = "ลืมซื้ออะไรไป\nหรือเปล่าคะ?"
900900601-120 = "ยินดีต้อนรับสู่\nรายการสดสุดพิเศษวันนี้ค่ะ!"
900900601-130 = "รายการนี้จัดโดย\nไอดอลชมรมข่าว\nคาวารุ ชิน่อนค่ะ!"
900900601-140 = "อย่าพลาด\nเลยนะคะ!"
900900601-150 = "อันนั้นอร่อยเลยค่ะ!"
900900601-160 = "เอ๋...?\nทำไมสคริปต์เป็นงี้ล่ะ?!"
900900601-170 = "นี่สินะคะ\nศักดิ์ศรีของผู้ใหญ่!"
900900601-180 = "ขอบคุณที่อุดหนุนนะคะ!"
900900601-190 = "เร็วขนาดนี้ กล้องน่าจะ\nจับภาพไม่ทันนะคะ!"
900900601-200 = "คุณครูจะฝ่าเคราะห์ร้าย\nครั้งนี้ไปได้หรือเปล่า!"
900900601-210 = "ห้ามเปลี่ยนช่องนะคะ!"
900900601-220 = "ยังไม่ไปอีกเหรอคะ?"
900900601-230 = "ระ... รายการ\nจบแล้ว... นะคะ?"
900900601-240 = "ฉันช่วยคุณครู\nไม่ได้หรอกค่ะ\nสื่อต้องเป็นกลางสิคะ!"
900900601-250 = "เดี๋ยวเหอะ! เนียนๆ ก็ไม่ได้ค่ะ\nมันผิดกฎนะคะ!"
900900601-260 = "ฝีมือยอดเยี่ยมเลยค่ะ!\nเรทติ้งต้องเพิ่ม\nแน่นอนค่ะ!!"
900900601-270 = "ยินดีด้วยค่ะ!\nช่วยบอกความรู้สึกหน่อยค่ะ!"
900900601-280 = "แคมเปญพิเศษเฉพาะทางทีวี\nกำลังเริ่มขึ้นแล้วค่ะ!"
