[translation]
900900601-10 = "TV限定的特別活動\n正在舉辦中唷～！"
900900601-20 = "是做好虧本覺悟的\n大特賣唷～！\n請來看看吧！"
900900601-30 = "即將完售！\n只有現貨，\n賣完就沒囉～！"
900900601-40 = "感謝完售！\n請等待再次進貨！"
900900601-50 = "開幕特賣中～！\n相當划算哦！"
900900601-60 = "感謝您一直以來的\n支持與惠顧！"
900900601-70 = "託您的福，\n盛況空前！"
900900601-80 = "即使完售，\n節目還是會繼續呢！"
900900601-90 = "因為合約上\n就是這麼規定的！"
900900601-100 = "終於到結束的時間了！"
900900601-110 = "有沒有漏買的東西呢？"
900900601-120 = "歡迎來到\n特別直播節目！"
900900601-130 = "本節目由新聞部的偶像\n川流詩音為您主持！"
900900601-140 = "請注意別錯過囉！"
900900601-150 = "那個，很好吃對吧！"
900900601-160 = "……咦？\n腳本是不是\n有點奇怪！？"
900900601-170 = "這就是所謂\n大人的氣場呢！"
900900601-180 = "感謝您的購買！"
900900601-190 = "這個速度，\n連攝影機都\n追不上了！！"
900900601-200 = "這場試煉，\n老師究竟能否\n突破呢！？"
900900601-210 = "請不要轉台唷！"
900900601-220 = "奇怪，您怎麼會來這裡？"
900900601-230 = "咦……節目已經\n結束了唷……？"
900900601-240 = "非常遺憾，我幫不上忙！\n因為報導必須中立！"
900900601-250 = "啊～！\n「假裝完成」\n可是犯規唷！"
900900601-260 = "相當活躍呢！\n肯定會刷新\n收視率的！！"
900900601-270 = "恭喜您！\n請發表一下感言吧！"
