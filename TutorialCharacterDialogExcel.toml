[translation]
3590297102-Localize = "首先為您說明[c][007eff]技能卡系統[-][/c]。"
1187715485-Localize = "參加戰鬥的學生們各持有一張[c][007eff]EX技能卡[-][/c]。"
609033854-Localize = "其中3張技能卡會隨機被抽取。"
2217664535-Localize = "點擊喜歡的卡片即可使用技能。"
824910007-Localize = "使用技能時需要相應的[c][007eff]COST[-][/c]，"
2769762702-Localize = "COST會[c][007eff]自動補充[-][/c]，並且以量表的形式顯示。"
649132842-Localize = "如果學生發現[c][007eff]掩蔽物[-][/c]就會[c][007eff]自動進行掩蔽[-][/c]。"
2182256461-Localize = "在進行掩蔽的期間，可以大幅阻擋敵人的攻擊。"
974418249-Localize = "因此有效地活用掩蔽是戰鬥的要點。"
280669824-Localize = "但是，也有無法進行掩蔽的學生，並且掩蔽物可能會被敵人的攻擊破壞，請務必記得。"
3004656566-Localize = "能看到一群敵人聚集在前方呢。"
3083858370-Localize = "[c][007eff]鈴美[-][/c]同學的技能對[c][007eff]聚在一起的敵人[-][/c]使用特別有效，請使用看看吧。"
1772103690-Localize = "點擊技能卡後，請選擇聚在一起的敵人。"
1077379718-Localize = "那麼，來用用看優香同學的技能吧。"
2764250063-Localize = "[c][007eff]優香[-][/c]同學的技能屬於[c][007eff]強化自身[-][/c]的類型，因此點擊技能卡後請觸碰優香。"
2561015670-Localize = "必須對付十字軍戰車！"
3405530868-Localize = "十字軍戰車屬於[c][007eff]重裝甲防禦類型[-][/c]的敵人，因此[c][007eff]貫穿型技能[-][/c]可以造成追加傷害。"
4264091547-Localize = "[c][007eff]蓮實[-][/c]同學的技能屬於[c][007eff]貫穿型[-][/c]，供您作參考。"
2932089311-Localize = "從現在起，老師的工作即將開始！"
4110480774-Localize = "但是……因為社團才剛開始，\n學生的數量有點少呢……"
1780834401-Localize = "為了讓工作能順利執行，多招募一些願意加入夏萊的學生比較好！"
3835677731-Localize = "在確定招募結果前，先向大家介紹甄選招募！"
1788150924-Localize = "可依照畫面上顯示的剩餘次數進行額外的甄選招募。"
170576393-Localize = "若想保存現在招募的結果，請按下「保存結果」按鈕！"
3719488430-Localize = "可在此確認保存的招募結果。"
3306037473-Localize = "請注意，只能保存3個結果！之後保存結果時，會覆蓋原先的招募結果！"
3607142554-Localize = "可透過按下「重新進行」按鈕重新進行甄選招募。"
3382742326-Localize = "最後，可按下「選擇結果」按鈕來確定招募結果！"
1344548568-Localize = "說明結束了，馬上去見新學生吧。"
578285553-Localize = "新的學生加入了呢！"
3960988693-Localize = "那麼，開始執行聯邦學生會交辦的工作吧。"
3839857660-Localize = "接下來必須對付擾亂奇普托斯和平的壞蛋們！"
450219970-Localize = "這裡是戰略地圖。是將學生們以部隊為單位進行配置和命令，以更高的觀點進行作戰的地方。"
254506953-Localize = "請按下「Start」方格，投入我方部隊！"
2778323810-Localize = "將剛才加入的學生編入部隊吧。"
3651300884-Localize = "部隊由直接在戰場上\n戰鬥的前鋒部隊，"
1046045242-Localize = "以及在後方支援的\n特殊部隊所構成。"
2145924530-Localize = "編輯已完成，試著出擊吧。"
1639954094-Localize = "請按下「任務開始」按鈕開始執行任務！"
1455196932-Localize = "點擊想前往的鄰近方格後，部隊便會移動到該處。"
555619172-Localize = "接下來就移動到敵人所在的方格，開始戰鬥吧！"
2354882728-Localize = "移動過的我方部隊在\n這回合無法再進行移動。"
2763385595-Localize = "按下「PHASE結束」按鈕後，我們的回合就結束了。"
1379607331-Localize = "又輪到了我們的回合！"
743560781-Localize = "剩下的敵人只有此處的頭目了！"
3807954392-Localize = "執行任務時，在何種地形上戰鬥非常重要。"
1583841037-Localize = "可在此確認目前戰場的地形類型。"
4215813659-Localize = "學生之中有能夠在特定地形發揮更強大力量的類型，請納入參考！"
2904762616-Localize = "那麼，這樣一來基本的戰鬥方法已經全數說明完畢。"
3145620398-Localize = "接下來，想再次請老師解決奇普托斯的各種事件！"
461350018-Localize = "那麼先返回大廳吧。"
887370249-Localize = "編入的學生越多，使用技能所需的COST恢復得越快。"
949017678-Localize = "藉由在前鋒部隊和特殊部隊分別編入人員，"
3931485746-Localize = "COST恢復速度將會增加，請盡量編入學生吧！"
3793542894-Localize = "辛苦了，老師。再次向你介紹，這裡就是夏萊的大廳。"
4007141114-Localize = "是今後老師進行各種任務的據點。"
2309901145-Localize = "……咦？有人傳來聯絡了呢？"
2917098098-Localize = "「MomoTalk」是奇普托斯非常普及的通訊軟體。"
101075014-Localize = "以後老師可以透過MomoTalk和學生對話，"
1515157484-Localize = "以及確認與學生羈絆的相關情報。"
3329759055-Localize = "新收到的訊息將會顯示在左側。"
1934342385-Localize = "請點擊圖示確認訊息吧！"
3184011681-Localize = "啊，是優香同學傳來的呢！"
3151390730-Localize = "至於內容就請老師親自確認了……！"
3592854545-Localize = "說不定能得到意外的禮物……！？"
3601609341-Localize = "可以在這裡確認劇情。"
4002636445-Localize = "包含解決奇普托斯發生的各種事件的主線劇情，"
716536840-Localize = "以及能窺見學生們日常的支線劇情。"
3413301983-Localize = "此外還能在這裡看到各種故事章節，請記得確認喔！"
820665494-Localize = "這裡是老師可以決定課程表的地方！"
2449257908-Localize = "可以和各位學生們一起選擇並執行各種課程表。"
3765920401-Localize = "那麼，先移動到夏萊辦公室吧。"
2453785862-Localize = "只要選擇準備好的課程，參加此課程表的學生的羈絆點數就會增加！"
2032658864-Localize = "由於課程表的執行次數有限，請認真思考再做決定哦！"
2025867271-Localize = "困難任務開放了！"
2595248621-Localize = "這是重要的任務，我們一起去確認吧。"
1171714786-Localize = "由於困難任務難度更高，所以能獲得更好的獎勵。"
3746217977-Localize = "但是請記得一天能挑戰的次數有限。"
3737371301-Localize = "那麼請進入任務吧。"
3028231922-Localize = "困難任務基本上是難以確保視野的困難戰鬥。"
2754978882-Localize = "敵人可能會躲在看不到的地方，也可能擺放著重要的道具，在確認之前都是未知數。"
1129749482-Localize = "因此戰略性的判斷比平時更重要！"
401821793-Localize = "那麼就開始吧！"
74121895-Localize = "在特殊任務中，可以選擇老師想進行的任務來進行。"
3158632403-Localize = "由於每項任務都需要不同的戰略和組合，找出適合各項任務的攻略法是重點所在！"
3381627007-Localize = "這次選擇「據點防禦」任務吧。"
2788115913-Localize = "任務的資訊可以在這裡確認。"
684289571-Localize = "確認戰場的地形類型是很重要的。"
4056179630-Localize = "學生之中有能夠在特定地形發揮更強大力量的類型，配合這一點來編輯部隊將較為有利。"
1369787987-Localize = "那麼進入特殊任務吧。"
1014884379-Localize = "在「據點防禦」中會有大量的敵人蜂擁而上，因此範圍攻擊技能特別有效。"
357285376-Localize = "請將戰鬥概念和地形納入考量，編輯學生們吧！"
1028357534-Localize = "在總力戰中，能夠和非常強力的頭目進行戰鬥。"
763523812-Localize = "此外，由於一天能戰鬥的次數有限，必須謹慎應戰才行！"
4199825530-Localize = "總力戰分成各種難度，難度越高就能獲得越好的獎勵。"
3113174257-Localize = "那麼我的說明暫時到此為止！期待看到老師的活躍表現哦！"
2264355441-Localize = "戰術大賽是透過與其他學生戰鬥來爭奪名次的競賽。"
1903432612-Localize = "在這裡可以查看參加大賽的隊伍清單。"
3813556911-Localize = "首先為了進行防禦編制，請點擊這個按鈕。"
1973780739-Localize = "編制防禦隊伍時的要點在於考量「地形」！"
2051537576-Localize = "請將對學生們有利的地形和各自的技能納入考慮，編組防禦隊伍吧！"
629870668-Localize = "期待老師在戰術大賽的亮眼活躍！"
511291740-Localize = "這次將對讓學生成長的方法進行說明。"
511780315-Localize = "首先，選擇想使其成長的學生吧。"
4057041792-Localize = "可以在這裡確認學生們基本的能力值情報。"
3875242301-Localize = "首先，這裡備有可以確認學生們裝備的裝備欄位，"
4246100585-Localize = "以及「升級」、「神祕解放」、「技能成長」等等，能讓學生們成長的，"
1541978941-Localize = "各式各樣的方法。"
3689996900-Localize = "首先，試試看最基本的「升級」吧！"
1906243484-Localize = "可以在這裡確認學生們升級時上升的能力值情報。"
193785775-Localize = "升級時需要「活動報告」， "
1772603968-Localize = "而「活動報告」可以透過執行各式任務取得。"
744061275-Localize = "根據老師的等級，學生們的等級上限也能相應的提升。因此，當老師等級提升時，請別忘了讓學生成長喔！"
3217591070-Localize = "接著來看看學生的裝備吧。"
353010963-Localize = "首先請選擇學生。"
456917226-Localize = "學生的裝備可以在下方的裝備欄位進行確認。"
3593072419-Localize = "可依開放的欄位數穿戴裝備，"
1316787902-Localize = "仍被鎖定的欄位將隨著學生等級提升依次開放。"
1103502530-Localize = "裝備可以透過這個按鈕進行強化。"
1355502804-Localize = "穿上優秀裝備的話，不只是學生們的能力，就連幹勁也會提升吧！"
3316404687-Localize = "請用更好的裝備讓學生們成長吧！"
620724586-Localize = "歡迎光臨，老師。這裡是夏萊附設的咖啡廳。"
4019103967-Localize = "可以在這裡和來訪的學生打招呼，或者取得咖啡廳的收益。"
3822725085-Localize = "造訪咖啡廳的學生可以透過點擊進行交流。"
433034527-Localize = "接下來將說明在咖啡廳可以做哪些事。"
245595245-Localize = "首先可以用時髦的家具來裝飾咖啡廳，以及送禮物給來訪的學生。"
1587600446-Localize = "另外可以在此處確認咖啡廳現在的狀況。"
1786157394-Localize = "咖啡廳的舒適度會隨著咖啡廳配置的家具改變。"
3437837610-Localize = "此外依據舒適度的改變，咖啡廳的收益也將有所變動！"
3054877860-Localize = "可在此確認咖啡廳的收益。"
3284340457-Localize = "收益存在保存上限，到達上限後超過的收益將會消失，還請注意！"
1994262072-Localize = "接著來確認學生們的技能，以及使其成長的方法吧。"
1803491513-Localize = "首先請選擇學生。"
1094179818-Localize = "學生持有的技能可以在這裡確認。"
741479403-Localize = "再確認得詳細一點吧。"
589641019-Localize = "點擊各個技能即可查看該技能的詳細說明。"
3094897348-Localize = "那麼接下來，該如何讓技能成長……"
2908355837-Localize = "在這裡可以讓喜歡的技能成長。"
557192077-Localize = "下一等級的技能情報可以事前進行確認。"
508744016-Localize = "成長所需的材料則可以在此確認。"
207652462-Localize = "請收集材料讓學生的技能成長吧！"
1248907137-Localize = "獲得「紀念大廳」了呢！ "
2442091367-Localize = "在那之中保存著與學生們的特別回憶。"
3663083713-Localize = "機會難得，要不要再看一次呢？"
1508596516-Localize = "首先可在此決定協助老師執行任務的值日生學生。"
871957014-Localize = "被指定為值日生的學生會在夏萊大廳待命。"
2757969261-Localize = "接著，紀念大廳可以在此確認。"
2916516167-Localize = "像這樣把擁有與老師紀念大廳的學生設定為值日生之後……"
3173476555-Localize = "在這裡就會出現長這樣的「紀念大廳轉換按鈕」。"
3501629486-Localize = "系統設定中也有紀念大廳的相關選項能夠調整，稍後請去確認看看吧！"
599978747-Localize = "可以利用倍速按鈕調整戰鬥的速度。"
3771636337-Localize = "請用喜歡的速度指揮戰鬥吧！"
2670945578-Localize = "這裡是工藝室。"
1445224029-Localize = "可以在這裡投入各種材料獲得各式的道具。"
3669180206-Localize = "按下開始製造鈕後，工藝室就會啟動。"
1651435007-Localize = "按下開始製造鈕試試看吧。"
273809992-Localize = "要讓工藝室開始製造就需要啟動石。"
310020606-Localize = "投入啟動石之後，點擊開放按鈕即可製造。"
3580667340-Localize = "進行製造時，可透過選擇節點調整最終的結果。"
3001699844-Localize = "選擇節點之後，等待一段時間即可完成製造。"
1719413524-Localize = "請在工藝室試著製造各式道具吧！"
412092685-Localize = "在這裡，老師可以決定課程表。"
3012201997-Localize = "可以選擇各式各樣的課程，和學生們共度時間唷。"
3253439800-Localize = "首先前往夏萊辦公室吧。"
650565742-Localize = "執行課程表後，參加此課程表的學生的羈絆點數就會增加！"
1978568824-Localize = "由於課程表的執行次數有限，注意這點並做出決定吧！"
4233978537-Localize = "雖然最初課程表的執行次數相對有限，"
3104157166-Localize = "但是隨著地區等級的提升，就能進行更多次、更多種類的課程表！"
3285867077-Localize = "那麼，來確認現在可以執行的課程表吧。"
1616766153-Localize = "可以在這裡確認所有課程表！"
750997093-Localize = "順利執行課程表，獲得各式獎勵與羈絆點數吧！"
2633161018-Localize = "收集到尚未招募的學生的神名文字了呢。"
918540636-Localize = "這次就用這些神名文字來招募學生吧。"
523934675-Localize = "請選擇收集到神名文字的學生。"
3336876723-Localize = "將學生的神名文字收集到一定數量之後，即可點擊「神名文字兌換」按鈕，以神名文字作為交換來招募學生。"
2041698325-Localize = "或者不立刻使用，以「招募」獲得該學生後再將神名文字用於「神祕解放」也是一種作法。"
2005489556-Localize = "那麼我暫時告辭。今後也請加油哦，老師！"
4286351744-Localize = "可以在這裡觀看奇普托斯發生的各種故事。"
3080722401-Localize = "首先是主線劇情。"
1233131487-Localize = "在主線劇情中，可以觀看在奇普托斯各處發生的故事。"
1467350413-Localize = "接下來是支線劇情！"
3916142399-Localize = "在支線劇情中，可以觀看各個學園的社團和委員會的小故事。"
92328165-Localize = "最後，除了這兩者之外，在任務中看到的劇情等等故事可在「重播」裡重新觀看。"
1003072420-Localize = "那麼老師，請繼續加油喔！"
4018130920-Localize = "可以進行「特殊任務」了。"
3658363999-Localize = "要不要一起去詳細看看？"
3442643925-Localize = "首先是「據點防禦」。"
696631563-Localize = "「據點防禦」是抵擋大量來襲敵人的任務。"
231664771-Localize = "可獲得「活動報告」作為獎勵。"
3443893152-Localize = "接著是「信用貨幣回收」。"
3608110686-Localize = "「信用貨幣回收」是必須在限制時間內快速打倒敵人的任務。"
836006224-Localize = "可獲得「信用貨幣」作為獎勵。"
1266167538-Localize = "特殊任務沒有入場次數限制，可以盡情執行！"
3929649048-Localize = "可以進行「懸賞通緝」了。"
1434978791-Localize = "「懸賞通緝」是追擊逃跑壞蛋的任務。"
4283522224-Localize = "順利達成的話，可獲得「技能成長材料」作為獎勵。"
3727840512-Localize = "此外，進行懸賞通緝時需要入場票券。"
694573644-Localize = "票券會在每天固定的時間回復，請放心！"
