3028267677-DescriptionJp = "一度見たら忘れられない絶景を再現したプール。いつでも休暇を楽しめる。"
1440165341-NameJp = "趣のある橋と池"
1440165341-DescriptionJp = "古風な橋がポイントの人工池。たまに、小さな友達に出会えるかもしれない。"
1853999145-NameJp = "フォトカードコレクション"
1853999145-DescriptionJp = "写真を持っていくと、記念のフォトカードコレクションを作ってくれるようだ。1等からハズレまで、コンプリートしてみよう。"
1412138912-NameJp = "査察計画書"
