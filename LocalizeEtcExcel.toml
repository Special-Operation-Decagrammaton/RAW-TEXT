1774177817-DescriptionJp = "ヴァルキューレで使われている中型収納引き出し。なんとなく丁寧に使ってしまう。"
880699199-NameJp = "ヴァルキューレ中型引き出し"
880699199-DescriptionJp = "ヴァルキューレでよく見かける中型引き出し。意外と作りはしっかりしている。"
3957484169-NameJp = "ヴァルキューレオフィスチェア"
3957484169-DescriptionJp = "ヴァルキューレの内勤用の椅子。リクライニング機能が優秀。"
4123559801-NameJp = "ヴァルキューレスツール"
4123559801-DescriptionJp = "ヴァルキューレの事務室に置かれている簡易スツール。長く座るのには向かない。"
2879622347-NameJp = "ヴァルキューレ標準防爆窓"
2879622347-DescriptionJp = "ヴァルキューレ標準仕様の防爆窓。大抵の爆発には耐えられる。"
3164734205-NameJp = "ヴァルキューレ標準壁"
3164734205-DescriptionJp = "ヴァルキューレの事務室でよく見かける壁パネル。最安入札品だが意外と丈夫である。"
934528545-NameJp = "ヴァルキューレ旗章付き壁"
934528545-DescriptionJp = "ヴァルキューレの旗章が付いた壁パネル。暇だからといって触ってはいけない。"
2435109289-NameJp = "ヴァルキューレ矯正局鉄格子"
2435109289-DescriptionJp = "ヴァルキューレ矯正局でよく見かける鉄格子。頭を出すには微妙に狭い。"
2876225434-NameJp = "ヴァルキューレ矯正局防犯ドア"
2876225434-DescriptionJp = "ヴァルキューレ矯正局の標準防犯ドア。インターホンは付いていない。"
1483516418-NameJp = "ヴァルキューレ来客用ソファ（小）"
1483516418-DescriptionJp = "ヴァルキューレの受付に置かれているソファ。手入れしやすい素材でできている。"
3053259826-NameJp = "ヴァルキューレ来客用ソファ（大）"
3053259826-DescriptionJp = "ヴァルキューレの受付に置かれている大型ソファ。寝転ぶと怒られる。"
3327970754-NameJp = "ヴァルキューレ旗章"
3327970754-DescriptionJp = "額縁に飾られたヴァルキューレの旗章。記念品として配ることはできないらしい。"
766048128-NameJp = "ヴァルキューレ防犯窓"
766048128-DescriptionJp = "ヴァルキューレの施設でよく使われる防犯窓。汚さないよう注意書きがある。"
656349259-NameJp = "ヴァルキューレ排煙窓"
656349259-DescriptionJp = "ヴァルキューレでよく使われる換気用の細長い窓。体より少しだけ狭い。"
4119343592-NameJp = "ヴァルキューレ備品デスク"
4119343592-DescriptionJp = "ヴァルキューレの事務用のデスク。調書を書くときに使われる。"
257103482-NameJp = "ヴァルキューレホワイトボード"
