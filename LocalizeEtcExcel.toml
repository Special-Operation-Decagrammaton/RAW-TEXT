2079974644-DescriptionJp = "特産品のお菓子。みんなで一緒に食べると美味しい。"
394794167-NameJp = "ホド（屋内戦）撃破！2026"
394794167-DescriptionJp = "大決戦ホド（屋内戦）の全ての防御タイプを難易度Hard以上で倒す"
2652318107-NameJp = "ホド（屋内戦）撃破！2026"
2652318107-DescriptionJp = "大決戦ホド（屋内戦）の全ての防御タイプを難易度Hardcore以上で倒す"
536822983-NameJp = "ホド（屋内戦）撃破！2026"
