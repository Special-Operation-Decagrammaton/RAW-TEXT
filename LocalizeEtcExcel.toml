3651949768-DescriptionJp = "大決戦ホド（屋内戦）の全ての防御タイプを難易度Insane以上で倒す"
2224281602-NameJp = "LimitedDashポイント"
2224281602-DescriptionJp = "募集を行うごとに「LimitedDashポイント」を獲得できます。「LimitedDashポイント」を集めることで、ラインアップ内の生徒を直接呼び出して受け入れることができます。\n※ピックアップ期間が終了すると、LimitedDashポイントはキーストーンのカケラに変換されます。\n[c][ff2d2c]LimitedDashポイントは、既存の呼び出しポイント・アーカイブポイントとは異なり、他の募集で獲得したポイントは累積されません。[-][/c]"
626255310-NameJp = "黒い網タイツ"
626255310-DescriptionJp = "市販の網タイツ。\n\n思い出は意外な品に宿るものだ。"
1224763257-NameJp = "普通の文庫本"
1224763257-DescriptionJp = "いたって普通の文庫本。\n\n初版でも愛蔵版でもない、ごく一般的なもの。ある日からコーヒーのいい香りが漂うようになった。"
331933966-NameJp = "花型ヘアピン"
331933966-DescriptionJp = "アヤネがいつもつけている花形のヘアピン。\n\n素朴な部分が、特に気に入っているようだ。"
1336178018-NameJp = "リミテッドダッシュポイント"
1336178018-DescriptionJp = "募集を行うごとに「リミテッドダッシュポイント」を獲得できます。「リミテッドダッシュポイント」を集めることで、ラインアップ内の生徒を直接呼び出して受け入れることができます。\n※ピックアップ期間が終了すると、リミテッドダッシュポイントはキーストーンのカケラに変換されます。\n[c][ff2d2c]リミテッドダッシュポイントは、既存の呼び出しポイント・アーカイブポイントとは異なり、他の募集で獲得したポイントは累積されません。[-][/c]"
4285787252-NameJp = "嵐過天晴"
4285787252-DescriptionJp = "嵐過天晴イベントにて獲得可能"
3685108562-NameJp = "タイガーシャーク丸"
3685108562-DescriptionJp = "サメの魂を宿した生粋のファイター。常に戦う相手を求めるその姿は、マコトそのもの。強敵との激闘、終わりなき闘争、そして海藻への飽くなき執念を持つ。"
1124524675-NameJp = "赤ヤドカリ"
1124524675-DescriptionJp = "ただのヤドカリ。髪の色と同じ色という理由でイロハに世話されることになった。最初は情が移ると面倒だと言われていたが、結局なんだかんだ大切にされている。"
2027863597-NameJp = "カニカニさん"
2027863597-DescriptionJp = "イブキの大切なパートナー！ヤドカリたちの中では最年少。とても臆病なため戦いは得意ではない。だが、秘めた才能は誰にも負けない！"
1038647446-NameJp = "レヴィアタンZ"
1038647446-DescriptionJp = "サツキの生体工学プロジェクト――通称「レヴィアタン計画」から生まれた究極の生物兵器！その秘訣は、健康的な食生活・規則正しいお散歩・そして暖かな日差し！"
132637474-NameJp = "ブラックドリー"
132637474-DescriptionJp = "おしゃれなヤドカリさん。本人なりのこだわりに気づいてほしいらしいが、どこが違うのかはさっぱり分からない。なぜかチアキだけは、その違いを見抜くらしい。"
