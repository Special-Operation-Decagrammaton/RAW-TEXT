3713514774-DescriptionJp = "ヴァルキューレ矯正局で写真撮影の際に身長を測るためのボード。どれくらい背が伸びたか分かる。"
1974220893-NameJp = "ヴァルキューレ備品・マガジンラック"
1974220893-DescriptionJp = "ヴァルキューレの受付でよく見かける雑誌ラック。意外にも大衆雑誌が多い。"
