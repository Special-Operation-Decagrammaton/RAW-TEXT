[translation]
3609368965-NameJp = "文字の長さ制御用テキスト"
3609368965-DescriptionJp = ""
438518298-NameJp = "ヒフミ（レーシング）"
438518298-DescriptionJp = "こちらの生徒さんを受け入れることができます。"
1658492247-NameJp = "アズサ（レーシング）"
1658492247-DescriptionJp = "こちらの生徒さんを受け入れることができます。"
3324870300-NameJp = "ラナ"
3324870300-DescriptionJp = "こちらの生徒さんを受け入れることができます。"
2735950865-NameJp = "イベントチャレンジステージ1ヒント"
2735950865-DescriptionJp = "子犬号を目標地点まで護衛しましょう。\n敵は子犬号を優先して攻撃します。"
2459896970-NameJp = "イベントチャレンジステージ2ヒント"
2459896970-DescriptionJp = "敵の防御タイプに合わせた攻撃タイプの生徒を編成して、戦闘を進めましょう。"
248297985-NameJp = "イベントチャレンジステージ3ヒント"
248297985-DescriptionJp = "タクティカルサポートの搭乗物の攻撃力が大幅に増加し、敵の防御を無視します。\n搭乗物のEXスキル使用時、敵に強力な砲撃が降り注ぎます。\n\n搭乗物のEXスキルを積極的に使用し、戦闘を進めましょう。"
3789220072-NameJp = "イベントチャレンジステージ4ヒント"
3789220072-DescriptionJp = "チェリノ（温泉）を護衛しましょう。\nチェリノ（温泉）が軽装備の敵を倒せるように、弾力装甲の敵を倒しましょう。"
1191798271-NameJp = "ヒフミ（レーシング）のメモリアルロビー"
1191798271-DescriptionJp = "ヒフミ（レーシング）との思い出でロビーを飾ることができます。"
1876734219-NameJp = "アズサ（レーシング）のメモリアルロビー"
1876734219-DescriptionJp = "アズサ（レーシング）との思い出でロビーを飾ることができます。"
3348758440-NameJp = "ラナのメモリアルロビー"
3348758440-DescriptionJp = "ラナとの思い出でロビーを飾ることができます。"
1510400840-NameJp = "かかし回復時、敵の被特効ダメージ量増加"
1510400840-DescriptionJp = "かかしを回復時、一定時間の間にすべての敵の被特効ダメージ量が増加します。"
4080738873-NameJp = "味方からダメージまたは弱体状態を受けた時、味方全体の攻撃力上昇"
4080738873-DescriptionJp = "味方からダメージまたは弱体状態を受けた場合、一定時間の間、味方全体の攻撃力が上昇します。"
3800944945-NameJp = "オデュッセイアクルーズシリーズ"
3800944945-DescriptionJp = "カフェの家具（オデュッセイアクルーズシリーズ）を生成することができます。"
2643347554-NameJp = "オデュッセイアクルーズシリーズ抽選ボックス"
2643347554-DescriptionJp = "使用時、オデュッセイアクルーズシリーズの家具の中から、一つを同じ確率で獲得することができる抽選ボックス。"
2774825491-NameJp = "オデュッセイアクルーズシリーズ選択ボックス"
2774825491-DescriptionJp = "オデュッセイアクルーズシリーズの中から、任意の家具を選択して交換することができる選択ボックス。"
1143289879-NameJp = "敵が20回攻撃を受けると、リミットブレイクゲージ回復"
1143289879-DescriptionJp = "敵が攻撃を20回受ける度に敵の安定率が減少\n同じ敵が攻撃を20回受ける度に、リミットブレイクゲージが回復"
664136517-NameJp = "味方が回復を4回受けると、リミットブレイクゲージ回復"
664136517-DescriptionJp = "味方ストライカー生徒に感電持続ダメージ\n同じ味方ストライカー生徒が回復を4回受ける度に、リミットブレイクゲージが回復"
4222987326-NameJp = "敵のCC状態時間が累積すると、リミットブレイクゲージ回復"
4222987326-DescriptionJp = "難易度A/B/Cで、敵のCC状態の時間がそれぞれ1/2/3秒累積した時、リミットブレイクゲージが回復（最大1回）"
4214467446-NameJp = "味方が弱体状態を解除すると、リミットブレイクゲージ回復"
4214467446-DescriptionJp = "戦闘開始時、および敵を4体倒すたびに、最大HPが最も高いストライカーの生徒に被回復量減少効果を適用します（最大2スタック）\n味方が弱体状態を解除した時、リミットブレイクゲージが回復（敵のスキルで付与された弱体状態は解除されません）"
690886613-NameJp = "仮想適性試験シーズン0貨物駅ヒント"
690886613-DescriptionJp = "弾力装甲と重装甲の敵が交互に登場し、1つの部隊で同じ攻撃タイプの生徒が5人/6人/7人以上戦闘に参加している場合、与えるダメージ量が100%/300%/500%増加します。生徒が退却して人数が減少した場合は強化された与えるダメージ量は減少します。\n敵が攻撃を20回受けるとリミットブレイクゲージが回復します。\n敵の防御タイプと特殊ルールを踏まえて生徒を編成しましょう。"
1878667440-NameJp = "仮想適性試験シーズン0ビーチヒント"
1878667440-DescriptionJp = "軽装備と特殊装甲の敵が交互に登場し、1つの部隊で同じ攻撃タイプの生徒が5人/6人/7人以上戦闘に参加している場合、与えるダメージ量が100%/300%/500%増加します。生徒が退却して人数が減少した場合は強化された与えるダメージ量は減少します。\n味方が回復を4回受けるとリミットブレイクゲージが回復します。\n敵の防御タイプと特殊ルールを踏まえて生徒を編成しましょう。"
1302067208-NameJp = "仮想適性試験シーズン0クルーズ船ヒント"
1302067208-DescriptionJp = "重装甲と軽装備の敵が交互に登場し、1つの部隊で同じ攻撃タイプの生徒が5人/6人/7人以上戦闘に参加している場合、与えるダメージ量が100%/300%/500%増加します。生徒が退却して人数が減少した場合は強化された与えるダメージ量は減少します。\n敵に与えたCC状態の時間が累積するとリミットブレイクゲージが回復します。\n敵の防御タイプと特殊ルールを踏まえて生徒を編成しましょう。"
968453207-NameJp = "仮想適性試験シーズン0ワイルドハント通りヒント"
968453207-DescriptionJp = "特殊装甲と重装甲の敵が交互に登場し、1つの部隊で同じ攻撃タイプの生徒が5人/6人/7人以上戦闘に参加している場合、与えるダメージ量が100%/300%/500%増加します。生徒が退却して人数が減少した場合は強化された与えるダメージ量は減少します。\n味方が弱体状態を解除するとリミットブレイクゲージが回復します。\n敵の防御タイプと特殊ルールを踏まえて生徒を編成しましょう。"
3249156518-NameJp = "選手パス"
3249156518-DescriptionJp = "レーサーが身に着ける選手用パス。他人への貸与は禁止されている。"
425789147-NameJp = "ゲヘナカップチケット"
425789147-DescriptionJp = "戦車レース「ゲヘナカップ」の入場チケット。あちこちでバラ撒かれているため、簡単に入手できる。"
660970339-NameJp = "応援用フラッグ"
660970339-DescriptionJp = "応援しているチームのために振る小さな旗。あまり前の方で振ると、選手が合図と勘違いしてフライングしてしまうかもしれない。"
3647519975-NameJp = "戦車の破片"
3647519975-DescriptionJp = "壊れて観客席まで飛んできた戦車の破片。お土産として人気がある。"
3922632819-NameJp = "改造用パーツ"
3922632819-DescriptionJp = "ゲヘナカップ公認の改造用パーツ。何が禁止されているのかはさっぱり分からないが、一応承認は必要らしい。"
2586473675-NameJp = "コンピューター作業台"
2586473675-DescriptionJp = "マイペースなエンジニアの作業台。\nどうやらコンピューターが好きなようだ。"
3819214430-NameJp = "レーシングゲーム機"
3819214430-DescriptionJp = "屋内でもレースを楽しめるアーケードゲーム。\n実際の戦車レースの感覚と反動を見事に再現している。人気と負傷者の両方が絶えない。"
2196667415-NameJp = "グランサロンのカーペット"
2196667415-DescriptionJp = "オデュッセイアならではの模様があしらわれた、ふかふかで清潔感のあるカーペット。潮風がもろに当たるため、頻繁に洗われている。"
391160836-NameJp = "プロムナードデッキ"
391160836-DescriptionJp = "乗客が潮風を感じながら散歩できる木造のデッキ。綺麗な状態を維持するために、日々の手入れは欠かせない。"
2630067491-NameJp = "クルーズ運営部のサンベッド"
2630067491-DescriptionJp = "デッキで潮風と日差しを浴びるのに最適なサンベッド。いわゆる人をダメにするベッド。"
1991329827-NameJp = "錨が置かれた台座"
1991329827-DescriptionJp = "船員の闘志を象徴する、錨の置かれた台座。"
2839153854-NameJp = "舵輪が置かれた台座"
2839153854-DescriptionJp = "舵を取る舵輪の置かれた台座。"
3420080737-NameJp = "潜水ヘルメットが置かれた台座"
3420080737-DescriptionJp = "旧型の潜水ヘルメットが飾られた台座。被ってはいけない。"
2479617279-NameJp = "帆船が置かれた台座"
2479617279-DescriptionJp = "帆船の模型が飾られた台座。"
471918546-NameJp = "プロムナードの曲線手すり"
471918546-DescriptionJp = "デッキの角を囲む手すり。手が触れる上部のみ木製になっている。"
143677388-NameJp = "プロムナードの直線手すり"
143677388-DescriptionJp = "デッキに沿って長く続く手すり。ここに寄りかかって水平線を眺めるのが航海の醍醐味らしい。"
249386597-NameJp = "デッキ・クォイツセット"
249386597-DescriptionJp = "デッキに描いた円の中にロープの輪を投げる遊び。ルールは簡単だが、波で船が揺れると一気に難易度が跳ね上がる。"
2171916302-NameJp = "船舶構造用鋼製スタンション"
2171916302-DescriptionJp = "デッキを支える鉄柱。飾りのように見えるが、これがないと上の階が崩れ落ちる。"
2646148878-NameJp = "オデュッセイアの観葉植物"
2646148878-DescriptionJp = "葉が下まで垂れているタイプの観葉植物。潮風に強く、デッキに置いてもよく育つ。"
525549154-NameJp = "1等室のダイニングテーブル（2人用）"
525549154-DescriptionJp = "向かい合って座るのに丁度いいサイズの食卓。テーブルクロスは毎食ごとに新しいものと交換される。"
474480199-NameJp = "1等室のダイニングテーブル（4人用）"
474480199-DescriptionJp = "4人で囲める食卓。窓際の席をめぐって争いが起きることもある。"
3012134982-NameJp = "沿岸指標生物"
3012134982-DescriptionJp = "一般的にカモメと呼ばれる生き物。近くに陸地があることを教えてくれる。"
4161361000-NameJp = "サンゴの標本A型"
4161361000-DescriptionJp = "展示用に保存処理されたサンゴ。水がなくても色あせることはない。"
504183923-NameJp = "サンゴの標本B型"
504183923-DescriptionJp = "展示用に保存処理されたサンゴ。採集した海域によって形が全く違うらしい。"
1884323780-NameJp = "プロムナードの浮き輪付き手すり"
1884323780-DescriptionJp = "救命浮き輪が掛けられた手すり。規定により、一定間隔ごとに設置しなければならない。"
4239723236-NameJp = "シャッフルボードセット"
4239723236-DescriptionJp = "長い棒で円盤を押しだして、得点エリアに入れる遊び。船の傾きと得点の傾きは切っても切れない関係にある。"
2471047511-NameJp = "グランサロンのパーティション1型"
2471047511-DescriptionJp = "柱と柱の間に薄い布を垂らしたパーティション。隠すためというよりは、むしろ見せるための装飾に近い。"
1020329049-NameJp = "グランサロンのパーティション2型"
1020329049-DescriptionJp = "柱と柱の間に薄い布を垂らしたパーティション。風が吹き込むたび、布が揺らめく。"
3796567498-NameJp = "グランサロンの展望隔壁"
3796567498-DescriptionJp = "屋内とデッキを隔てる大きな窓。天気が悪い日でも海を眺めることができる。"
3100697710-NameJp = "グランサロンの通路隔壁"
3100697710-DescriptionJp = "扉のない出入口。常に開いているのは、緊急時にドアを開ける時間すら惜しいから、だとか。"
769620258-NameJp = "オデュッセイア標準の船鐘"
769620258-DescriptionJp = "入港や乗船を知らせる鐘。紐を引くと、船の隅々にまで鐘の音が鳴り響く。"
1700735363-NameJp = "オデュッセイアのシトラス鉢植え"
1700735363-DescriptionJp = "レモンの木が植えられた鉢植え。長旅での壊血病を防ぐために積んでいた名残らしい。"
1812683190-NameJp = "1等室のディナーテーブル（2人用）"
1812683190-DescriptionJp = "フォーマルな食事をする際の2人用食卓。フォークを数えるのに夢中になって、料理を食べ損ねないように。"
4294062051-NameJp = "水平線が見える空"
4294062051-DescriptionJp = "どこを見渡しても水平線ばかりの風景。オデュッセイアの生徒たちにとっては、単なる窓の外の風景に過ぎない。"
1179017087-NameJp = "航海者の揺りかご"
1179017087-DescriptionJp = "深く、安らかな海。船乗りを育むこともあれば、呑み込むこともある。"
2262849435-NameJp = "オデュッセイアの背景"
2262849435-DescriptionJp = "オデュッセイアの背景。"
286429242-NameJp = "グランサロンのバーカウンター"
286429242-DescriptionJp = "丸く並べられたボトルが印象的なカウンター。中身のほとんどはフルーツジュースらしい。"
3341971350-NameJp = "ダビット式救命ボート"
3341971350-DescriptionJp = "曲線状の支柱に吊るされた木製の救命ボート。普段は防水シートで保護されているが、点検が欠かされることはない。"
4292047238-NameJp = "ウォーターウォール噴水"
4292047238-DescriptionJp = "水が壁のように滑らかに流れ落ちる噴水。波の音を再現するために作られたらしい。"
4290415943-NameJp = "1等室のディナーテーブル（4人用）"
4290415943-DescriptionJp = "フォーマルな食事をする際の4人用食卓。運が良ければ船長と相席できるかもしれない。"
2119672140-NameJp = "クラゲのアクアリウム"
2119672140-DescriptionJp = "クラゲを飼育している水槽。ずっと眺めていると時間を忘れてしまう。"
2867144763-NameJp = "ディスプレイ付き出入口"
2867144763-DescriptionJp = "電光掲示板が設置されたサロンの出入口。本来は航海情報を流すためのものだが、今では食事の案内表示がメインになっている。"
1969861051-NameJp = "探照灯のある出入口A"
1969861051-DescriptionJp = "デッキから船内へと繋がる出入口。上の階の探照灯は、一晩中海を照らし出している。"
322964567-NameJp = "探照灯のある出入口B"
322964567-DescriptionJp = "デッキから船内へと繋がる出入口。探照灯の光のせいで、ここだけ真っ昼間のように明るい。"
1714961259-NameJp = "新しくできた友達"
1714961259-DescriptionJp = "好奇心旺盛な海の友達。意外とおしゃべり。"
3786379984-NameJp = "オデュッセイアクルーズシリーズ"
3786379984-DescriptionJp = "オデュッセイアのクルーズ運営部のクルーズセット。"
