164778935-NameJp = "味方のコスト回復速度増加、与えるEXスキルダメージ増加、敵の最大HP増加"
164778935-DescriptionJp = "アバンギャルド君のHPが80%以上の時、すべての味方のコスト回復速度とEXスキルの与えるダメージ量が増加します。\n敵の最大HPが増加します。"
