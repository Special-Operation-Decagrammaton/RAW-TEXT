1017860088-NameJp = "ヒーローショット"
1017860088-DescriptionJp = "ダメージ量が[c][007eff]150%[-][/c]増加するが、引き分けの場合も敗北する。"
743937787-NameJp = "しっかりと"
743937787-DescriptionJp = "今回のターンが引き分け/敗北でもダメージを受けない。"
3820641632-NameJp = "天上天下唯我独尊"
3820641632-DescriptionJp = "相手が直前のターンで選択した手を出す確率を0%にし、残りの2つの手を出す確率をそれぞれ均等に分配する。自分のダメージボーナスのダメージ倍率は変わらない。"
18352450-NameJp = "カニカニさんだよ！"
18352450-DescriptionJp = "攻撃力が[c][007eff]30%[-][/c]増加する。（最大[c][007eff]3回[-][/c]重複）今回のターンで勝利した場合、コストを[c][007eff]1[-][/c]分回復する。敗北した場合、重複した攻撃力はリセットされる。"
1089612741-NameJp = "作戦名NK"
1089612741-DescriptionJp = "相手がグー/チョキ/パーを出す確率をそれぞれ33%にする。自分のダメージボーナスの倍率は変わらない。"
1779390952-NameJp = "海藻でできた冠"
1779390952-DescriptionJp = "勝利の象徴。勝者に月桂冠を授与する伝統は、オデュッセイアに起源があると言われている。これもおそらく似たようなものだろう。"
537612354-NameJp = "もうひとりの私"
537612354-DescriptionJp = "いつも一番近くで応援してくれる、頼もしいパートナー！ただくっついているだけにも見えるけど……。"
2662707979-NameJp = "万魔殿ステッカー"
2662707979-DescriptionJp = "ゲヘナの最優秀生徒に授与される徽章。万魔殿に入るためには、能力を証明しなければならない。実力のみが基準になり得る。"
2083688323-NameJp = "コインネックレス"
2083688323-DescriptionJp = "ヤドカリにもコインネックレス。古くから伝わることわざで、価値が分からない者への嘲笑を含んだ比喩。それでも、身に着けたヤドカリは誇らしげである。"
73193444-NameJp = "モモフレンズの絆創膏"
73193444-DescriptionJp = "痛いの痛いの飛んでいけー！今回の旅行のために、救急医学部長が準備した医療品。非常に実用的かつ、子供受けもいい。"
3202966611-NameJp = "呼び出しチャージ"
3202966611-DescriptionJp = "※募集を行う度に呼び出しチャージを獲得します。呼び出しチャージが一定数に到達すると、スタック補正が適用されます。累積した呼び出しチャージは次の募集に繰り越されます。\nこの呼び出しチャージは、通常募集同士で共有されます。"
1649078898-NameJp = "限定・呼び出しチャージ"
1649078898-DescriptionJp = "※募集を行う度に呼び出しチャージを獲得します。呼び出しチャージが一定数に到達すると、スタック補正が適用されます。累積した呼び出しチャージは次の募集に繰り越されます。\nこの呼び出しチャージは限定ピックアップ募集とフェスピックアップ募集同士で共有されます。"
994412523-NameJp = "★3生徒確定！"
994412523-DescriptionJp = "このピックアップで獲得できる★3生徒のうち1名が確定で獲得できます。\nそのうち、ピックアップ生徒は50％の確率で獲得できます。"
3676923538-NameJp = "鉄砂掌の稽古台"
3676923538-DescriptionJp = "爪の先まで鍛え上げるための稽古台。ケガには気を付けよう。"
3121776939-NameJp = "稽古場の床"
3121776939-DescriptionJp = "柔らかい砂が敷かれた稽古場の床。転んでも安全。"
1355453598-NameJp = "内殿の床材"
1355453598-DescriptionJp = "内殿は休息と来客のための空間。使用後は必ず掃除をすること。"
1068905084-NameJp = "内殿の装飾絨毯"
1068905084-DescriptionJp = "ホコリがたまりやすいので、しっかりとお手入れしなければいけない。"
2092665293-NameJp = "回廊の茂み"
2092665293-DescriptionJp = "回廊とは建物や中庭などを取り囲む廊下のこと。草が枯れないようにお世話をしている。"
2976892609-NameJp = "竹垣"
2976892609-DescriptionJp = "竹で作った生垣。火気厳禁。"
2624585092-NameJp = "盆栽用の陶器"
2624585092-DescriptionJp = "盆栽用の陶器。水のあげすぎもよくない。"
2767845940-NameJp = "趣のあるガンラック"
2767845940-DescriptionJp = "銃器を安全に保管する場所。あって然るべき。"
1118818099-NameJp = "山海経風の石灯"
1118818099-DescriptionJp = "石で作った灯篭。実は中に電気灯が入っている。"
1342987293-NameJp = "山海経風の柱"
1342987293-DescriptionJp = "伝統的な造りの柱。瓦は消耗品。"
847063315-NameJp = "山海経風の軒先"
847063315-DescriptionJp = "いかにも格式高そうな伝統的な軒先。"
1942343381-NameJp = "内殿の座卓"
1942343381-DescriptionJp = "花瓶が置かれた座卓。花はむやみに触らないように。"
3685119818-NameJp = "稽古用の的紙"
3685119818-DescriptionJp = "稽古用の的紙。大事なのは弾着群。"
3730746751-NameJp = "梅花椿の稽古場"
3730746751-DescriptionJp = "梅花椿は丸太の上でバランスをとる訓練の一つ。しっかりと下半身を鍛えてから挑戦すること。"
576479166-NameJp = "筋斗雲"
576479166-DescriptionJp = "不思議な雲。神仙になる想像をしてみよう。"
3738752605-NameJp = "太湖石"
3738752605-DescriptionJp = "山海経風の庭園でよく使われる造景用石材。安定感がある。"
1688931063-NameJp = "山海経風の旗"
1688931063-DescriptionJp = "山海経の校章が描かれた旗。"
4060295958-NameJp = "山海経風の門"
4060295958-DescriptionJp = "伝統的な造りの門。"
1873937132-NameJp = "山海経風の飾り窓"
1873937132-DescriptionJp = "回廊に設置された飾り窓。派手ではないが美しい。"
852248101-NameJp = "演武場の門"
