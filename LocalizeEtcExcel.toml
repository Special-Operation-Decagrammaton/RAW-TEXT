1305140740-NameJp = "ネロの防御力大幅増加"
1305140740-DescriptionJp = "ネロの防御力が大幅に増加します。"
1121474547-NameJp = "EXスキルを使用する度に味方の攻撃力、治癒力増加"
1121474547-DescriptionJp = "味方生徒がEXスキルを使用する度に、一定時間の間、すべての味方生徒の攻撃力と治癒力が増加します。（最大10回重複）"
4008661080-NameJp = "味方生徒、かかしのHPが継続的に減少、与えるダメージ量増加"
4008661080-DescriptionJp = "味方生徒とかかしは1秒毎に現在のHPが減少します。\n味方生徒の現在のHPが高いほど、その生徒の与えるダメージ量が増加します。"
793231571-NameJp = "ゲヘナ、トリニティ神秘特効加算"
793231571-DescriptionJp = "ゲヘナ、トリニティ所属生徒の神秘特効が加算されます。"
164778935-NameJp = "味方のコスト回復速度増加、与えるEXスキルダメージ増加、敵の最大HP増加"
164778935-DescriptionJp = "アバンギャルド君のHPが80%以上の時、すべての味方のコスト回復速度とEXスキルの与えるダメージ量が増加します。\n敵の最大HPが増加します。"
530751023-NameJp = "ネロの最大HP増加、アタッカー2人以上編成時コスト回復速度増加"
530751023-DescriptionJp = "ネロの最大HPが増加します。\nアタッカーの生徒を2人以上編成すると、すべての味方のコスト回復速度が増加します。"
2301978585-NameJp = "ネロのHPによってEXスキルの被ダメージ量減少"
2301978585-DescriptionJp = "ネロはHPが60%以上の時、EXスキルの被ダメージ量が減少します。\nネロのHPが60％未満になると、EXスキルの被ダメージ量減少効果が解除されます。"
255116076-NameJp = "勇気ゲージ説明01"
