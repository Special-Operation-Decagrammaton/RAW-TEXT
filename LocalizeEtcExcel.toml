3220391421-DescriptionJp = "10回募集を行うチケットです。\n※2026年12月28日11時00分までに使用しない場合、このチケットは消失してしまいます"
1431563301-NameJp = "APパッケージ（7日）"
1431563301-DescriptionJp = "7日間、毎日APを入手できる商品。\n購入時に青輝石×128個（有償分）が手に入ります。\n※パッケージの詳細は下記の商品内容をご参照ください。"
1613498075-NameJp = "生徒成長パッケージ（ヒフミ（レーシング））"
1613498075-DescriptionJp = "ヒフミ（レーシング）の成長に役立つアイテムと青輝石がセットになったパッケージ。\n購入時に青輝石×1200個（おまけ無償分）が手に入ります。\n※パッケージの詳細は下記の商品内容をご参照ください。"
3545526662-NameJp = "生徒成長パッケージ（アズサ（レーシング））"
