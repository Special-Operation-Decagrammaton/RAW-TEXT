530751023-DescriptionJp = "ネロの最大HPが増加します。\nアタッカーの生徒を2人以上編成すると、すべての味方のコスト回復速度が増加します。"
2301978585-NameJp = "ネロのHPによってEXスキルの被ダメージ量減少"
2301978585-DescriptionJp = "ネロはHPが60%以上の時、EXスキルの被ダメージ量が減少します。\nネロのHPが60％未満になると、EXスキルの被ダメージ量減少効果が解除されます。"
