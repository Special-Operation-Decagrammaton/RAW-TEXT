4134076351-DescriptionJp = "掃除がしやすく、落ち着いた色合いの収容施設用床材。"
3551325264-NameJp = "ヴァルキューレ標準床材"
3551325264-DescriptionJp = "最安値の入札で導入されたものの、それなりに丈夫な標準床材。"
