1395122267-NameJp = "内殿の格子窓"
1395122267-DescriptionJp = "内殿に設置された飾り窓。日の光がよく入るらしい。"
2164308677-NameJp = "内殿の机"
2164308677-DescriptionJp = "灯篭と本が積まれた机。棚の中には何があるのだろうか。"
527417942-NameJp = "山海経風のゲームテーブル"
527417942-DescriptionJp = "山海経独自のゲームができるという4人用テーブル。没頭しすぎには注意。"
291123961-NameJp = "内殿の椅子"
291123961-DescriptionJp = "お茶をたしなむための椅子。香りで心を穏やかにしよう。"
3973575263-NameJp = "内殿の柱"
3973575263-DescriptionJp = "内殿に設置された柱。赤は繫栄と慶事の象徴。"
3553530711-NameJp = "石造りの池"
