2749501372-DescriptionJp = "10回募集を行うチケットです。※2026年12月31日23時59分までに使用しない場合、このチケットは消失してしまいます"
2277762394-NameJp = "10回募集チケット"
2277762394-DescriptionJp = "10回募集を行うチケットです。\n※2026年12月7日11時00分までに使用しない場合、このチケットは消失してしまいます"
1595224765-NameJp = "10回募集チケット"
1595224765-DescriptionJp = "10回募集を行うチケットです。\n※2026年12月21日11時00分までに使用しない場合、このチケットは消失してしまいます"
