26011-CharacterSSRNewKr = "柵川中学所属の陽気な女子中学生。\n\n同級生の初春飾利の親友で、彼女に常盤台中学の先輩である御坂美琴を紹介してもらった。レベル0の無能力者だが、勘が良く、決定的な手がかりを見つけることが多い。好きなものは都市伝説とスイーツ。休日になるとよくスイーツ調査に出かけているのだとか。"
