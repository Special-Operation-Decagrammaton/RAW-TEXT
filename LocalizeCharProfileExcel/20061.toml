20061-WeaponDescTw = "佳澄總是隨身攜帶的手槍。\n\n雖然總是被隨之而來的鑽頭聲與爆破聲蓋過，但只要溫泉開發部要動工，必定會先響起一聲響亮的槍聲。"
20061-ProfileIntroductionTw = "格黑娜所屬，溫泉開發部的部長。\n\n無論是夏天還是在海邊，他那獨樹一格的開發至上主義都始終如一。雖然被外界當成不正常的人，但他連自己的這種形象都能當成武器，硬是達成目的。"
20061-CharacterSSRNewTw = "世界就是這麼結束的。\n伴隨著一聲轟隆巨響。"
