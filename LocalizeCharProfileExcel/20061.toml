20061-WeaponDescKr = "카스미가 항상 휴대하고 다니는 권총.\n\n언제나 따라오는 드릴 소리와 폭파음에 묻히기 십상이지만, 온천개발부가 공사를 시작할 때면 언제나 우렁찬 총성이 한 번 울린다."
20061-ProfileIntroductionKr = "게헨나 온천개발부의 부장.\n\n여름에도, 바다에서도, 특유의 개발 지상주의에는 변함없다. 세간으로부터 제정신이 아닌 사람처럼 여겨지고 있지만, 그런 자신의 이미지마저 무기 삼아 목적을 달성하고야 만다."
20061-CharacterSSRNewKr = "세상은 이렇게 끝나는 법이라고.\n쾅! 소리와 함께."
