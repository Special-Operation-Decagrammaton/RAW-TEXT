20061-StatusMessageTh = "ออนเซ็นคือของขวัญที่มนุษยชาติมอบให้ตนเอง"
20061-FullNameTh = "คินุกาวะ คาสุมิ"
20061-FamilyNameTh = "คินุกาวะ"
20061-PersonalNameTh = "คาสุมิ"
20061-SchoolYearTh = "ชั้นปีที่ 2"
20061-CharacterAgeTh = "16 ปี"
20061-BirthdayTh = "24 พฤษภาคม"
20061-HobbyTh = "ใช้ระเบิดพังทลาย, พัฒนาออนเซ็น"
20061-WeaponNameTh = "Red Rector"
20061-WeaponDescTh = "ปืนพกที่คาสุมิพกติดตัวอยู่เสมอ\n\nมักถูกกลบด้วยเสียงสว่านและเสียงระเบิดที่ตามมา\nเป็นประจำ แต่เมื่อใดก็ตามที่ชมรมพัฒนาออนเซ็นเริ่ม\nงานก่อสร้าง จะมีเสียงปืนดังสนั่นขึ้นหนึ่งครั้งเสมอ"
20061-ProfileIntroductionTh = "หัวหน้าชมรมพัฒนาออนเซ็นแห่งเกเฮนน่า\n\nไม่ว่าจะฤดูร้อนหรืออยู่ริมทะเล แต่แนวคิดการพัฒนาต้องมาก่อนอันเป็น\nเอกลักษณ์ของคาสุมิก็ไม่เปลี่ยนแปลง ต่อให้ผู้คนจะมองว่าเธอเหมือนกับ\nคนเสียสติ แต่เธอกลับใช้แม้กระทั่งภาพลักษณ์นี้เป็นอาวุธ เพื่อบรรลุเป้าหมายให้ได้ในที่สุด"
20061-CharacterSSRNewTh = "โลกมันต้องจบลงแบบนี้แหละ\nพร้อมกับเสียงดังตู้ม!"
