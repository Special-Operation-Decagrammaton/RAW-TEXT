20040-CharacterSSRNewKr = "ゲヘナ学園所属、「万魔殿」の議員であり、情報部長。\n\nとある計画のために様々な催眠術を習得しているものの、成功に至ったケースは数えるほどしかない。失敗続きでも諦めることなく進んでいく、タフな女の子。ゆったりとしていてマイペースな性格。虫と怖いものが大の苦手。"
