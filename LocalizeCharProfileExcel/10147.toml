10147-WeaponDescTh = "ปืนพกคู่ใจของซัตสึกิ\n\nพกพาสะดวกยอดเยี่ยม จึงอุ่นใจได้แม้อยู่ริมทะเล\nจริงๆ แล้วแทบไม่ได้ใช้งาน แต่เธอก็ดูแลรักษาไว้อย่างสะอาดเรียบร้อย"
10147-ProfileIntroductionTh = "สมาชิกและหัวหน้าฝ่ายข่าวกรองของแพนเดโมเนียม โซไซตี้\n\nเมื่อได้ยินข่าวดีเรื่องการเดินทางด้วยเรือสำราญสุดหรู เธอก็เลือกชุดที่เข้ากับ\nโอกาสมาใส่ แต่ความจริงกลับเป็น... เอาเป็นว่า บนท้องทะเลอันตราย เธอจะได้แสดงความสามารถในฐานะหัวหน้าฝ่ายข่าวกรองอย่างเต็มที่"
10147-CharacterSSRNewTh = "เรียกฉันเหรอ ครู? เอาละ เอาละ\nสัญญาสิว่าจะร่วมมือกันไปอีกพันปี"
