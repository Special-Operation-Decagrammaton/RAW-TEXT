10033-WeaponNameJp = "와카모가 애용하는 소총.\n\n고풍스러운 외관과 달리 언제나 불꽃과 화약 냄새를 풍기는 무시무시한 총. 주로 선생님의 신변을 위협하는 방해물을 처리하는 데 쓰일 때가 많다."
