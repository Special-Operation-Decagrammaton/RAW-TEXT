10149-WeaponDescEn = "A specialized amphibious rifle that Kokoro has relied on ever since enrolling at Odyssey.\n\nThis rifle can fire both standard rifle rounds and underwater dart rounds, enabling versatile responses across varied combat situations. While the use of two different types of ammunition complicates maintenance and operation, this poses no issue for the meticulous Kokoro."
10149-ProfileIntroductionEn = "The president of Odyssey Maritime Academy's Diving Club.\n\nTrue to her title, she is an excellent swimmer and diver. Whenever an underwater problem arises, such as recovering lost items or repairing cables, Odyssey's students invariably turn to her. However, she is a worrier and hates taking risks, so she hesitates to jump into the water unless her equipment is fully prepared.\n\nShe loves singing, but because she is tone-deaf and cannot keep time or pitch, all her club members flee whenever she starts singing."
10149-CharacterSSRNewEn = "Leave the underwater...to me."
