10149-WeaponDescJp = "ココロが入学時から愛用している、特殊な形の水陸両用ライフル。\n\n1丁のライフルで通常のライフル弾と水中用フレシェット弾を扱うことができ、状況に応じた対応が可能。2種類の弾丸を使用するため、管理や運用が複雑になるものの、几帳面なココロにとっては大きな問題ではない。"
10149-ProfileIntroductionJp = "オデュッセイア海洋高等学校所属、ダイビング部の部長。\n\n部長という肩書きの通り、潜水の技術に長けている。そのため、遺失物の引き上げやケーブルの修理など、水中でトラブルが発生すると、オデュッセイアの生徒は必ずココロに助けを求める。ただし、超が付くほどの心配性な彼女は、万全の装備が整うまで水に飛び込もうとしない。\n\n歌うのが好きだが、めちゃくちゃな音痴。そんな彼女が歌い始めると、部員は全員逃げてしまう。"
10149-CharacterSSRNewJp = "水の中のことは、私にお任せください。"
