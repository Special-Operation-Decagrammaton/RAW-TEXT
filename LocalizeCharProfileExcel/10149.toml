10149-HobbyTw = "潛水、料理、（一個人）唱歌"
10149-WeaponNameTw = "91式水陸兩用步槍"
10149-WeaponDescTw = "心從進入奧德賽高中時就一直愛用的特殊造型水陸兩用步槍。\n\n一把步槍就能同時使用一般步槍彈與水中用鏢彈，可依狀況做出全天候的應對。雖然缺點是使用兩種彈藥使得管理與運用相當複雜，但對個性一絲不苟的心來說並不是什麼大問題。"
10149-ProfileIntroductionTw = "奧德賽海洋高中所屬，潛水部的部長。\n\n如同部長這個頭銜所示，游泳與潛水的技術相當出色，因此只要水中出了問題，像是打撈遺失物或修理纜線，奧德賽的學生總會來找他幫忙。不過他因為顧慮很多，裝備沒有準備得萬無一失就不肯下水。\n\n雖然喜歡唱歌，卻是個節拍與音準全都抓不準的嚴重音痴。只要他一開口唱歌，部員們就會全部逃走。"
10149-CharacterSSRNewTw = "水面下的事……就交給我吧。"
