10149-WeaponNameKr = "91식 수륙양용소총"
10149-WeaponDescKr = "코코로가 오디세이아 학원에 입학했을 때부터 애용해 온 특수한 형태의 수륙양용 소총.\n\n하나의 소총으로 일반 소총탄과 수중용 다트탄을 동시에 운용할 수 있어 상황에 따른 전천후 대응이 가능하다. 두 가지 탄환을 사용하는 만큼 관리와 운용이 복잡하다는 것이 흠이지만, 꼼꼼한 성격의 코코로에게는 큰 문제가 되지 않는다."
10149-ProfileIntroductionKr = "오디세이아 해양학원 다이빙부의 부장.\n\n부장이라는 직함에 걸맞게 수영과 잠수 실력이 뛰어나, 분실물 인양이나 케이블 수리 등 수중에서 문제가 발생하면 오디세이아 학생들은 으레 그녀를 찾는다. 다만 걱정이 많고 안전 염려증이 심해, 장비가 완전히 갖춰지지 않으면 물에 뛰어드는 것을 주저한다.\n\n노래 부르는 것을 좋아하지만 박자와 음정을 맞추지 못하는 지독한 음치인지라, 그녀가 노래를 시작하면 부원 모두가 달아난다."
10149-CharacterSSRNewKr = "수면 아래는…… 제게 맡겨주세요."
