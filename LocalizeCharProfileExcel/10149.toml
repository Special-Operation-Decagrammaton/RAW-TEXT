10149-WeaponNameTh = "Type 91 Amphibious Rifle"
10149-WeaponDescTh = "ปืนไรเฟิลสะเทินน้ำสะเทินบกรูปแบบพิเศษที่โคโคโระ\nใช้ตั้งแต่เข้าเรียนที่โรงเรียนโอดิสซีย์\n\nปืนไรเฟิลกระบอกนี้ใช้ได้ทั้งกระสุนไรเฟิลทั่วไป และกระสุนดาร์ตสำหรับใต้น้ำ จึงรับมือได้รอบด้าน\nตามสถานการณ์ ข้อเสียคือการดูแล และใช้งานซับซ้อน เพราะต้องใช้กระสุนสองชนิด แต่สำหรับโคโคโระผู้มี\nนิสัยละเอียดรอบคอบแล้ว นั่นไม่ใช่ปัญหาใหญ่"
10149-ProfileIntroductionTh = "หัวหน้าชมรมดำน้ำแห่งโรงเรียนการเดินเรือโอดิสซีย์\n\nโคโคโระมีทักษะว่ายน้ำและดำน้ำยอดเยี่ยมสมกับตำแหน่งหัวหน้าชมรม เมื่อเกิดปัญหาใต้น้ำ เช่น กู้ของที่หายหรือซ่อมสายเคเบิล เหล่านักเรียน\nโอดิสซีย์ก็มักจะมาหาเธอเป็นประจำ แต่เธอเป็นคนขี้กังวลและระแวงเรื่อง\nความปลอดภัยอย่างมาก จึงลังเลที่จะลงน้ำหากอุปกรณ์ยังไม่พร้อมสมบูรณ์\n\nโคโคโระชอบร้องเพลง แต่เป็นคนร้องเพี้ยนขั้นรุนแรงที่จับจังหวะกับคีย์เสียง\nไม่ได้เลย พอเธอเริ่มร้องเพลง สมาชิกชมรมทุกคนก็พากันหนีไปหมด"
10149-CharacterSSRNewTh = "เรื่องใต้ผิวน้ำ... ปล่อยให้เป็นหน้าที่ของฉันเองค่ะ"
