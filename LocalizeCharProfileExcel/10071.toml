10071-WeaponNameJp = "미야코가 SRT 특수학원에서 지급받은 제식 기관단총.\n\n높은 신뢰성을 지닌 기관단총으로 고온다습한 바닷가에서도 효과적으로 작전을 수행할 수 있다."
