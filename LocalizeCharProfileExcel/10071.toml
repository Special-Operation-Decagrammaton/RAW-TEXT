10071-ProfileIntroductionJp = "잠입 작전을 위해 외진 어촌 마을을 방문한 RABBIT 소대의 소대장.\n\n편의점에 납품되는 도시락의 이상을 조사하기 위해 관광객으로 위장한 채 바닷가를 찾아왔다. 주민들의 적대적인 반응부터, 마을 전체에서 풍기는 퀴퀴한 비린내까지…… 관광과는 어울리지 않는 수상한 공간이지만, 그래도 귀여운 수영복만큼은 포기할 수 없다."
