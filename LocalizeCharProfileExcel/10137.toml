10137-ProfileIntroductionEn = "A police student who works as the Deputy Director for Valkyrie's Public Peace Bureau.\n\nThough she is often mistaken for a suspect because of her blase demeanor, she's a surprisingly competent police officer who seems to perfectly model the psychology of a lifelong criminal without even realizing it. Despite, or perhaps because of this, she's actually one of the most competent officers in the Public Peace Bureau.\n\nKonoka is currently the record holder for both the most promotions and most demotions in the department."
