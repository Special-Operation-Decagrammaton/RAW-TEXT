10137-WeaponDescTh = "ปืนที่โคโนกะใช้เวลาทำงาน\n\nใช้ประโยชน์ได้หลายอย่าง เช่น ใช้เป็นหมอนเวลางีบหลับ"
10137-ProfileIntroductionTh = "นักเรียนตำรวจจากสถาบันฝึกตำรวจวัลคิรี่ ตำแหน่งรองหัวหน้ากรมความมั่นคงสาธารณะ\n\nแม้จะตกเป็นผู้ต้องสงสัยอยู่บ่อยครั้ง แต่ก็เป็นตำรวจที่มีความสามารถอย่างน่าทึ่ง โคโนกะเข้าถึงจิตวิทยาและพฤติกรรมของอาชญากรได้เก่งกว่าใครใน\nกรมความมั่นคงสาธารณะ แต่ดูเหมือนจะไม่ใช่การกระทำโดยตั้งใจ\n\nแม้จะเป็นนักเรียนที่ได้เลื่อนตำแหน่งบ่อยที่สุดในกรมความมั่นคงสาธารณะ แต่ในขณะเดียวกันก็ถูกลดตำแหน่งบ่อยที่สุดเช่นกัน"
10137-CharacterSSRNewTh = "อ่า... เรียกฉันเหรอคะ? จริงเหรอ?"
