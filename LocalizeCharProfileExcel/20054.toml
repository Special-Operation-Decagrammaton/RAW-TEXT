20054-CharacterSSRNewKr = "ミレニアムサイエンススクール所属、ハッカー集団「ヴェリタス」の元部長で、現特異現象捜査部の部長。\n\n未曾有の危機に対応すべく、特殊スーツを身に纏った。また、新たな「車椅子」のおかげで、縦横無尽に駆けることが可能となった模様。\n\n本人は車椅子であると主張しているが、どう見てもバイクだ。"
