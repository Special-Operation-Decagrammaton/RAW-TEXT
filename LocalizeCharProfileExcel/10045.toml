10045-ProfileIntroductionJp = "느긋한 여름을 찾아 무인도로 날아온 대책위원회의 부장.\n\n빈둥거리고 싶어 하는 말투와 달리 여름 채비도 확실하다. 본인은 자신이 평소보다 조금은 적극적인 모습이라는 걸 눈치채지 못하고 있다."
