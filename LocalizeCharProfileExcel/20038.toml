20038-ProfileIntroductionKr = "トモエが使用するスナイパーライフル。\n\n彼女曰く、交流会では使用したくないと主張するものの、それもまた時と場合による。"
20038-CharacterSSRNewKr = "山海経との交流会でチーパオに着替えたレッドウィンター連邦学園、秘書室長のトモエ。\n\nレッドウィンターとは異なる環境に戸惑いながらも交流会を楽しんでいる様子。新しい衣装も、とても興味深そうに袖を通している。\n今回の交流会において、彼女の巧みな話術と洞察力は健在のようだ。"
