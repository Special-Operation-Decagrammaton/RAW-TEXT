26017-ProfileIntroductionJp = "レッドウィンター連邦学園所属、ただし懲戒処分を受けて現在は旧校舎183号特別クラスで謹慎中の生徒。183号特別クラス内では副副委員長を務めている。\n\n入学試験のマークシートで点数を直接入力したため、183号特別クラス行きになった。電算管理業務を担当しており、好奇心のままに行動した結果、いろいろとやらかしてしまうことがある。友達や先生を何よりも大切に思っている。"
