10042-CharacterSSRNewKr = "アリウス分校所属、いつもガスマスクをつけており表情を窺うことができない、どこか神秘的なアリウススクワッドの少女。\n\n意図的に顔を隠そうとしているわけではないものの、食事や睡眠の時以外はほとんどガスマスクをつけて生活している。スクワッドのリーダーであるサオリからは「姫」と呼ばれているが、本人は多くを語ろうとしない謎多き人物である。"
