101350001-CharacterSSRNewKr = "自身を自身として定義したケイ。\n\n人工知能からAMASへ、欠陥がある生贄から今の身体へ。紆余曲折を経てここにいる。\n\nミレニアムサイエンススクールは部活動の掛け持ちが可能な学園のため、特異現象捜査部所属ではあるものの、ゲーム開発部にいることが多い。\n\n事実上、ゲーム開発部の新任プロデューサーをしているが……本人は否定している模様。"
