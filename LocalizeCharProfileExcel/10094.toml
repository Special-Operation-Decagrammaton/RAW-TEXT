10094-ProfileIntroductionJp = "\"밀레니엄 학원, 게임 개발부의 시나리오 라이터.\n\n어쩌다 보니 C&C로 오해를 받아, 메이드복까지 입게 되고 말았다. 오해를 풀 사이도 없이 사건에 휘말리고, 휘말리고, 또다시 휘말려 들어가지만…… 특유의 밝고 당당한 태도로, 다가오는 모든 역경에 맞서 나간다.\""
