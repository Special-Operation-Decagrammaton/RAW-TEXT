10142-WeaponDescTw = "即便多處都有因磨損而修補的痕跡，依舊散發著難以言喻的神祕氣息的老舊步槍。\n\n繼承自大預言者葛葉的資格證明，如今也將在蔚藍的大海延續下去。"
10142-ProfileIntroductionTw = "為了迎接夏天而換上泳裝的百鬼夜行聯合學園所屬，百花繚亂紛爭調停委員會的委員長。\n\n為了與部員們增進感情而參加了百夜水上祭。耀眼得如同盛開的花朵一般，在各場比賽中展現的出色領導力，宣示著百花繚亂的復活。"
10142-CharacterSSRNewTw = "解除封印的右手之力，就讓你見識見識吧"
