10142-WeaponDescTh = "ปืนไรเฟิลเก่าที่แม้จะสึกหรอและมีร่องรอยการ\nซ่อมแซมให้เห็นหลายจุด แต่ก็มีพลังงานลึกลับที่\nไม่อาจอธิบายได้\n\nหลักฐานแห่งคุณสมบัติที่สืบทอดจากผู้พยากรณ์ใหญ่\nคุซึโนฮะยังคงสืบเนื่องต่อไปแม้อยู่ในท้องทะเลสีคราม"
10142-ProfileIntroductionTh = "หัวหน้าคณะไกล่เกลี่ยข้อพิพาทเฮียกกะเรียวรันที่ใส่ชุดว่ายน้ำรับฤดูร้อน\n\nนางุสะมาเข้าร่วมเทศกาลสวนน้ำเฮียกกิยาโคเพื่อส่งเสริมความสามัคคีกับ\nสมาชิกชมรม เฉกเช่นดอกไม้ที่เบ่งบานอย่างงดงาม นางุสะได้แสดงภาวะผู้นำ\nที่โดดเด่นในทุกการแข่งขัน เพื่อประกาศถึงการฟื้นกลับมาของเฮียกกะเรียวรัน"
10142-CharacterSSRNewTh = "ฉันจะแสดงให้เห็นพลังของแขนขวาที่ถูกปลดปล่อยแล้วเอง!"
