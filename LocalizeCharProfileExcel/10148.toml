10148-WeaponDescTw = "伊呂波隨身攜帶的手槍。\n\n他抱怨說身為戰車長根本沒什麼開槍的機會，但射擊姿勢標準得足以登上教範當範本。"
10148-ProfileIntroductionTw = "格黑娜學園所屬，萬魔殿的議員兼戰車長。\n\n每次都被真琴闖的禍牽連的中階管理職。這次的避暑之旅也毫無意外地成了受害者。平常他只會嘆口氣就算了，但在這場沒完沒了的騷動中，他漸漸開始思考自己究竟為什麼還留在萬魔殿……"
10148-CharacterSSRNewTw = "彼此都不容易呢。"
