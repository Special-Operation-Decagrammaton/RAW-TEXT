10148-WeaponDescTh = "ปืนพกที่อิโรฮะพกติดตัว\n\nเธอบ่นว่าเป็นผู้บัญชาการรถถัง เลยแทบไม่มีโอกาส\nได้ยิงปืนเท่าไร แต่ท่าทางการยิงของเธอกลับเป็น\nแบบอย่างได้ ถึงขั้นลงในคู่มือเลยทีเดียว"
10148-ProfileIntroductionTh = "สมาชิกและผู้บัญชาการรถถังของแพนเดโมเนียม โซไซตี้\n\nอิโรฮะเป็นผู้จัดการระดับกลางที่ต้องคอยโดนลากเข้าไปพัวพันกับเรื่อง\nวุ่นวายที่มาโคโตะก่อขึ้นทุกครั้ง และในทริปพักร้อนครั้งนี้ เธอก็กลายเป็น\nผู้เคราะห์ร้ายอีกตามเคย หากเป็นปกติ เธอคงถอนหายใจแล้วปล่อยผ่านไป แต่เมื่อความวุ่นวายยืดเยื้อขึ้นเรื่อยๆ เธอก็เริ่มคิดว่า ทำไมตัวเองถึงยังอยู่ใน\nแพนเดโมเนียม โซไซตี้กันแน่..."
10148-CharacterSSRNewTh = "ต่างคนก็ต่างเหนื่อยเหมือนกันเลยนะ"
