10148-ProfileIntroductionJp = "판데모니움 소사이어티 소속의 의원이자 전차장.\n\n매번 마코토가 일으키는 사고에 휘말리는 중간관리자. 이번 피서에도 여지없이 피해자가 되고 말았다. 평소라면 한숨 쉬고 넘겼을 그녀지만, 길어지는 소동에 점점 어째서 만마전에 남아 있는지 고민하기 시작하는데……."
