10148-ProfileIntroductionJp = "ゲヘナ学園所属、「万魔殿」の議員のひとりで、戦車長。\n\nマコトの起こす騒動に毎度振り回される中間管理職。今回の旅行でも例にもれず被害者となってしまった。普段ならため息ひとつで受け流していた彼女だが、終わりの見えない騒動の中で、次第になぜ自分は万魔殿に残っているのかを考え始め……。"
