10148-ProfileIntroductionKr = "イロハが携行している拳銃。\n\n戦車長なので使う機会はあまりないとイロハは言っているが、射撃姿勢は教範に載っているお手本になれるくらい綺麗。"
10148-CharacterSSRNewKr = "ゲヘナ学園所属、「万魔殿」の議員のひとりで、戦車長。\n\nマコトの起こす騒動に毎度振り回される中間管理職。今回の旅行でも例にもれず被害者となってしまった。普段ならため息ひとつで受け流していた彼女だが、終わりの見えない騒動の中で、次第になぜ自分は万魔殿に残っているのかを考え始め……。"
