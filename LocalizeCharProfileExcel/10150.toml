10150-HobbyTh = "ดำน้ำ, อ่านหนังสือ, วิทยุสื่อสาร"
10150-WeaponNameTh = "Type 75 Special Underwater Automatic Rifle"
10150-WeaponDescTh = "ปืนไรเฟิลใต้น้ำที่โคโตเนะใช้มาตั้งแต่เข้าเรียนที่\nโรงเรียนการเดินเรือโอดิสซีย์\n\nเนื่องจากใช้กระสุนดาร์ตสำหรับใต้น้ำที่มีลักษณะ\nเหมือนลูกศร จึงยิงเข้าเป้าได้อย่างมั่นคงแม้อยู่ใต้น้ำ\nที่มีความหนาแน่นสูง ข้อเสียคือเมื่อใช้บนบก\nระยะยิงจะลดลงมากเมื่อเทียบกับปืนไรเฟิลอื่นๆ แต่ดูเหมือนโคโตเนะจะไม่ได้ใส่ใจมากนัก"
10150-ProfileIntroductionTh = "รองหัวหน้าชมรมดำน้ำแห่งโรงเรียนการเดินเรือโอดิสซีย์\n\nปกติโคโตเนะจะสวมแว่นสายตาหนาเพราะสายตาแย่มาก ในทางกลับกัน เธอก็มีประสาทการได้ยินและสัญชาตญาณที่เฉียบคมมาก เมื่อทัศนวิสัยใต้น้ำไม่ดี เธอมักรับหน้าที่นำทางสมาชิกชมรมโดยอาศัยการ\nได้ยิน\n\nงานอดิเรกคือการติดต่อกับบนบกผ่านวิทยุสมัครเล่น ด้วยเหตุนี้ เธอจึงสนิทสนมกับนักเรียนมากมายในคิโวทอส"
10150-CharacterSSRNewTh = "สายตาฉันไม่ค่อยดีเท่าไร...\nขอใช้เวลาค่อยๆ จำหน้าไปแล้วกันนะ"
