10150-WeaponDescKr = "코토네가 오디세이아 학원에 입학했을 때부터 애용해 온 수중 소총.\n\n화살 형태의 수중용 다트탄을 사용하기 때문에 밀도가 높은 수중에서도 안정적으로 표적을 맞출 수 있다. 육지에서는 다른 소총에 비해 사거리가 크게 저하된다는 단점이 있지만, 코토네는 크게 신경 쓰지 않는 듯하다."
10150-ProfileIntroductionKr = "오디세이아 해양학원 다이빙부의 부부장.\n\n시력이 무척 나쁘기 때문에 평소에는 도수 높은 안경을 쓰지만, 그 대신 청력과 육감이 굉장히 뛰어난 편이다. 물속의 시계가 나쁠 때에는 청력에 의지해 부원들을 이끄는 역할을 자주 맡는다.\n\n취미는 아마추어 무선으로 육지와 교신하는 것. 그 덕분에 키보토스 전역의 다양한 학생들과 친분을 갖고 있다."
10150-CharacterSSRNewKr = "내 눈이 좀 나쁜 편이라……\n얼굴은 천천히 익혀 나갈게."
