10150-WeaponDescJp = "コトネが入学時から愛用している、水中ライフル。\n\n水中用フレシェット弾を使用するため、抵抗が大きい水中でも安定して標的を狙える。陸上では他のライフルに比べて射程が大幅に短くなるという欠点があるが、コトネはあまり気にしていない様子。"
10150-ProfileIntroductionJp = "オデュッセイア海洋高等学校所属、ダイビング部の副部長。\n\n目が悪く、普段は度数の高い眼鏡をかけている。視力が非常に低い代わりに、聴力と直感がずば抜けている。水中で視界が悪いときは、聴覚を頼りに部員を先導する役割を担う。\n\n趣味はアマチュア無線で陸と通信すること。そのおかげで、陸地の生徒ともつながりがある。"
10150-CharacterSSRNewJp = "目、あんまり良くないから……\n顔を覚えるのに時間がかかるかも。"
