10150-HobbyEn = "Diving, reading books, radio"
10150-WeaponNameEn = "Type 75 Special Underwater Automatic Rifle"
10150-WeaponDescEn = "An underwater rifle that Kotone has relied on ever since enrolling at Odyssey.\n\nIt uses arrow-shaped underwater darts, allowing it to reliably hit targets even in high-density underwater environments. While it suffers from a significantly reduced range on land compared to regular rifles, Kotone does not seem particularly concerned."
10150-ProfileIntroductionEn = "The vice president of Odyssey Maritime Academy's Diving Club.\n\nShe has very poor eyesight, so she usually wears high-prescription glasses. However, her hearing and intuition are exceptionally keen. When underwater visibility is poor, she often guides her club members by relying on her hearing.\n\nHer hobby is communicating with the mainland via amateur radio, which has allowed her to build friendships with many students across Kivotos."
10150-CharacterSSRNewEn = "I have bad vision, so...\nI'll take my time getting to know your face."
