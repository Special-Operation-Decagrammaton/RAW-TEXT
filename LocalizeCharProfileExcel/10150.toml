10150-WeaponDescTw = "琴音從進入奧德賽高中時就一直愛用的水中步槍。\n\n由於使用箭矢造型的水中用鏢彈，即使在密度較高的水中也能穩定命中目標。缺點是在陸地上射程比其他步槍大幅縮短，但琴音似乎不太在意。"
10150-ProfileIntroductionTw = "奧德賽海洋高中所屬，潛水部的副部長。\n\n視力非常差，平常都戴著度數很高的眼鏡，但聽力與直覺則極為敏銳。水中視線不佳時，經常由他靠聽覺帶領部員前進。\n\n興趣是用業餘無線電與陸地通訊。也因此，他和奇普托斯各地形形色色的學生都有交情。"
10150-CharacterSSRNewTw = "我的視力不太好……\n之後會慢慢記住你的長相的。"
