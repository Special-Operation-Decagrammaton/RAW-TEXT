10139-ProfileIntroductionEn = "The deputy leader of SRT Academy's FOX Squad. Call sign is \"FOX 2.\"\n\nShe has a kind and unassuming personality, so she easily makes friends. Thanks to that, many juniors at SRT Academy rely on her regardless of their squad. Her personality has helped her achieve outstanding results in infiltration and undercover operations, and she also handles the squad's administrative and operational duties.\n\nHer specialty is making inarizushi, and she sometimes packs inarizushi bentos for her squad members. Her inarizushi is so good that it has earned the highest ratings at SRT Academy."
