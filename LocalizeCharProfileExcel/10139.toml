10139-WeaponDescTw = "仁子被SRT特殊學園配給的制式霰彈槍。\n\n是把可靠性極高的泵動式霰彈槍。不僅適用於近距離戰鬥，在破門攻堅時也能發揮出色的性能。"
10139-ProfileIntroductionTw = "SRT特殊學園所屬，FOX小隊的副小隊長。\n代號為「FOX2」。\n\n性格溫柔又隨和，能輕易和任何人打成一片。因此在SRT學園中，不分小隊都有許多後輩很依賴他。憑藉這樣的性格在潛入與偽裝任務都取得了優異的成果，同時還兼任小隊的行政與作戰管理工作。\n\n拿手絕活是製作豆皮壽司，經常為小隊成員準備豆皮壽司作為便當。而這些豆皮壽司因為味道極佳，在SRT學園內也廣受好評。"
