10139-WeaponDescTh = "ปืนลูกซองมาตรฐานที่นิโกะได้รับจากสถาบันพิเศษ SRT\n\nปืนลูกซองระบบปั๊มแอคชั่นที่มีความน่าเชื่อถือสูงนี้\nไม่เพียงแต่แสดงประสิทธิภาพอันยอดเยี่ยมในการต่อสู้\nในระยะประชิดเท่านั้น แต่โดดเด่นในด้านบุกทะลวง\nประตูด้วย"
10139-ProfileIntroductionTh = "รองหัวหน้ากองทหาร FOX จากสถาบันพิเศษ SRT รหัสประจำตัว <FOX 2>\n\nนิโกะมีบุคลิกที่ใจดีและเป็นกันเอง เข้ากับคนอื่นได้ดี ด้วยเหตุนี้จึงมีรุ่นน้อง\nหลายคนในสถาบัน SRT ที่พึ่งพาเธอ ไม่ว่าจะอยู่ในกองทหารใดก็ตาม\nบุคลิกเช่นนี้ทำให้นิโกะประสบความสำเร็จอย่างยอดเยี่ยมในภารกิจแฝงตัว\nหรือปลอมตัว นอกจากนี้เธอยังรับผิดชอบงานด้านการบริหารและปฏิบัติ\nการของกองทหาร FOX ควบคู่กันด้วย\n\nความสามารถพิเศษของนิโกะคือการทำซูชิเต้าหู้หวาน เธอมักจะทำข้าว\nกล่องซูชิเต้าหู้หวานให้สมาชิกกองทหารอยู่บ่อยๆ รสชาติอร่อยของซูชิเต้า\nหู้หวานทำให้เธอได้รับคำชมอย่างมาก แม้กระทั่งจากในสถาบัน SRT เอง"
10139-CharacterSSRNewTh = "FOX 2 เตรียมเสบียงเสร็จแล้วค่ะ"
