13007-ProfileIntroductionKr = "ジュンコが使用する2丁のアサルトライフル。\n\n強力な連射能力を持っており、ジュンコの場合さらにそれがお腹の空き具合にも比例するため、空腹時ほど制圧が早い。"
13007-CharacterSSRNewKr = "ゲヘナ学園所属、美食研究会のお澄ましさんな暴食家。\n\nゲテモノを食べたり暴食を繰り返す他の美食研究会のメンバー達と違い、ある程度常識的な美食を楽しむ方だが、美味しい食べ物を目の前にすると理性を失ってしまうこともある。"
