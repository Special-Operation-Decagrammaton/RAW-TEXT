26015-ProfileIntroductionJp = "바다에서도 여유로운 모습을 잃지 않으려고 노력 중인 정의실현부 부원.\n\n언제나 친절하고 여유로운 모습으로 알려진 이치카이지만, 인생 최악의 천적과의 재회로 인내심을 시험받는 중. 그 때문일까, 자각하고 있지 않지만, 평소보다 감정을 솔직히 드러내고 있는 듯하다."
