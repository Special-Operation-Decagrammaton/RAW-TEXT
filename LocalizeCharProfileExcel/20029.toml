20029-ProfileIntroductionJp = "여름이라는 시기, 바다라는 장소를 맞아 수영복으로 갈아입은 수행부의 부부장.\n\n언제나 부드러운 미소와 상냥한 태도로 모두의 인망을 사고 있는 소녀. 그렇게 평소에는 늘 차분한 모습을 보여주는 그녀지만, 특별히 수영복으로 갈아입은 지금만큼은 평소보다 조금 더 들떠 보이는 기색이다."
