[translation]
10082-StatusMessageJp = "今が青春真っ盛り！"
10082-FullNameJp = "不破レンゲ"
10082-FamilyNameJp = "不破"
10082-PersonalNameJp = "レンゲ"
10082-SchoolYearJp = "2학년"
10082-CharacterAgeJp = "16세"
10082-BirthdayJp = "7월 23일"
10082-HobbyJp = "라이트문예 소설 읽기, 단련 "
10082-WeaponNameJp = "렌게가 소중히 애용하고 있는 소총.\n\n백화요란의 제식 소총을 렌게가 나름의 취향대로 개조하고 꾸민 물건, 렌게가 말하길 자신이 돌격할 때라면 언제나 그 곁을 지켜주는 믿음직한 전우라고. 이 총을 활용해 렌게가 펼치는 백화요란의 사격술 앞에 적은 없다."
10082-WeaponDescJp = "百花繚乱制式ライフル-青春の火花"
10082-ProfileIntroductionJp = "백귀야행 학원 백화요란 분쟁조정위원회의 돌격대장.\n\n정의감과 책임감이 강한 성격. 후배들을 아끼지만 그만큼 교육할 때는 절대 봐주는 것이 없는 백화요란의 귀신 교관이기도 하다. 백화요란 활동에 보람을 느끼고 있기에, 입부한 것에 후회는 없지만, 그 대신 청춘을 즐기지 못한 것에 아쉬움을 가지고 있으며, 그 반동으로 만화나 소설에 나올 법한 극적인 청춘을 바라고 있다. 오늘도 운명적인 청춘을 꿈꾸며 훈련에 매진하는 꿈 많은 소녀."
10082-CharacterSSRNewJp = "나의 청춘 이야기는 스승님을 만난 지금부터 시작이야!\n응, 그런 걸로 해두자고!"
