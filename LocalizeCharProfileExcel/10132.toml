10132-CharacterSSRNewKr = "百鬼夜行連合学院所属、忍術研究部の部員。\n\nファッションショーの警備員として雇われたものの、モデルとしてデビューすることに。コンプレックスだった身長がモデル業界では大きな強みとなった。本人としてはモデルと部活の両立に悩んでいる模様。"
