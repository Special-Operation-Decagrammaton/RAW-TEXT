20007-ProfileIntroductionJp = "노래 부르기를 좋아하는 명랑한 성격의 버추얼 싱어.\n\n본래는 현실의 신체를 갖지 않은 가상의 존재였지만, 라이브 공연을 앞두고 키보토스의 기술력을 빌려 현실 세계로 나오게 되었다. 시간과 공간을 초월하여 노래를 전달할 수 있는 버추얼 싱어의 특성상 키보토스에도 그녀의 숨은 팬이 꽤 존재한다고 한다."
20007-CharacterSSRNewJp = "제 노래를 들어주세요!"
