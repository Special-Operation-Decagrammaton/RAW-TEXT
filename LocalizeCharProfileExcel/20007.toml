20007-WeaponNameJp = "미쿠가 공연에서 티셔츠와 같은 굿즈를 나누어 줄 때 사용하는 거대한 가스건.\n\n표면에는 다이오드 등이 박혀 있어 콘서트의 음악에 맞추어 아름다운 빛으로 반짝인다."
