20007-ProfileIntroductionKr = "初音ミクがライブを行う際に、Tシャツなどのグッズを配るために使う巨大な大砲。\n\n表面にはダイオードなどが施されており、ライブの音楽に合わせて美しい光を放つ。"
20007-CharacterSSRNewKr = "いつも明るくて、歌うことが大好きなバーチャル・シンガー。\n\n本来は現実の身体を持たない電子的な存在だったが、キヴォトスの技術を利用することで肉体を得てこの世界に降り立つことができた。時間と空間を超えて歌を届けることができるバーチャル・シンガーという特性上、やはりここキヴォトスにも彼女の隠れファンたちがたくさんいるようで、この世界で開催される予定のライブをとても楽しみにしている様子。"
