10090-ProfileIntroductionKr = "ウミカが愛用するアサルトライフル。\n\nお祭りの始まりを告げる時、お祭りで起こるちょっとしたトラブルを解決する時、どんな時でもぴったりなお祭り用品だと、彼女は主張している。"
10090-CharacterSSRNewKr = "百鬼夜行連合学院所属、お祭り運営委員会の1年生部員。\n\n田舎出身で、昔から都会で開催されるお祭りに興味津々だという。キヴォトス全域で行われるお祭りは全て覚えているほどの専門家。口を開けばマイナーなお祭りの話題で早口になりがちで、黙っていれば美人だとよく言われる。"
