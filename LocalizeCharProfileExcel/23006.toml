23006-WeaponNameJp = "시즈코가 사용하는 펌프 액션 산탄총.\n\n시즈코가 말하길 '백야당의 명물인 안미츠의 냄새가 은은하게 감도는, 이 세상에 단 하나뿐인 물건'이라는 모양이다."
