20035-WeaponNameJp = "츠바키의 기관단총\n\n본디 평소의 수행에 방해되지 않는 작고 아담한 물건이지만, 가이드 역할을 수행하는 데에도 충분히 도움이 된다는 모양이다."
20035-WeaponDescJp = "安眠のお供Ⅱ"
20035-ProfileIntroductionJp = "언제나 어디서나 잘 자는 수행을 멈추지 않는 수행부의 부장님.\n\n수학여행을 맞아 백귀야행을 안내하는 가이드로서의 역할을 시작했지만, 수면에 대한 수행 역시 놓치고 싶지 않은듯 하다. 때로는 졸면서, 때로는 날카롭게 핵심을 찌르면서, 그녀는 어떻게든 양쪽 모두를 충실하게 이행한다."
