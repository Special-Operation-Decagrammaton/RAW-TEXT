20012-ProfileIntroductionKr = "セナの使用するショートバレルのグレネードランチャー。\n\n救急出動時の障害物を素早く取り除くための道具。障害物の中には仕事の邪魔をする相手も含まれる。"
20012-CharacterSSRNewKr = "ゲヘナ学園所属、救急医学部の部長。\n\nゲヘナで日々起こり続ける事件・事故の中、どんな状況でも不平不満を漏らすことなく、いつも無愛想な顔で負傷者を運んでいる。数多くの負傷者を救ってきた経歴の持ち主だが、負傷者を「死体」と呼び間違える癖やその手荒な扱い方のせいで、一部の生徒からはやや遠巻きにされている。"
