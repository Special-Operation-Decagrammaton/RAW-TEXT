20058-WeaponDescTh = "ปืนลูกซองที่เอริกะพกติดตัวอยู่ตลอดเวลา\n\nได้รับการดูแลรักษาอย่างดี มีการตกแต่งด้วย\nลวดลายเสือดาวสะดุดตา ทำให้สังเกตเห็นได้ง่าย\nไม่ว่าจะอยู่ที่ใด"
20058-ProfileIntroductionTh = "เด็กสาวมัธยมปลายจิตใจดีจากสถาบันเกเฮนน่า\n\nถึงจะมีภาพลักษณ์ที่ดูฉลาดและสุขุม แต่จริงๆ แล้วเป็นคนที่มีอุปนิสัย\nเข้าสังคมเก่งและอ่อนโยน สามารถสนิทสนมกับทุกคนได้เป็นอย่างดี\nเอริกะมักจะออกไปหาอะไรสนุกๆ ทำกับคิราระผู้เป็นเพื่อนสนิทของเธอเสมอ"
20058-CharacterSSRNewTh = "รอนานเลยใช่มั้ย? ขอโทษๆ"
