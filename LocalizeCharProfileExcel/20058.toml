20058-ProfileIntroductionJp = "게헨나 학원에 다니는 친절한 성격의 여고생.\n\n이지적이고 쿨한 이미지를 풍기지만, 누구와도 친해질 수 있는 사교적이고 다정한 성격의 소유자이다. 둘도 없는 단짝인 키라라와 함께 즐거운 일을 찾아다니곤 한다."
