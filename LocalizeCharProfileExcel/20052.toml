20052-ProfileIntroductionKr = "ヤクモが常備している拳銃。\n\nヤクモは「銃には様々な使い道がある」と口癖のように言っている。その使い道の中には、怠けた作家に「締切を守らせる」こともあるのだとか。"
20052-CharacterSSRNewKr = "レッドウィンター連邦学園所属、出版部の部長。\n\n「レッドベア」の編集長も兼任している。一度決めると曲げない頑固な一面があり、出版部の利益のためなら手段を選ばず、無敵の行動力を発揮する。しかしそんな彼女にも、ひたむきな一面があるようで……？"
