10109-CharacterSSRNewKr = "ミレニアムサイエンススクール所属、穏やかな休息を楽しむため、パジャマに着替えたセミナーの書記。\n\nかわいい後輩とお人好しな同級生が誤解に誤解を重ねて事件を起こしていく様子を、ノアは黙々と見守っている。もちろん、微笑みと記録は欠かさずに。"
