10103-ProfileIntroductionJp = "산해경과의 교류회를 맞아 치파오로 갈아입은 마리나.\n\n판다에 열광하거나 산해경의 접대를 인정하는 등, 교류회 본연의 목적을 충실하게 즐기는 중.\n붉은겨울과는 완전히 다른 스타일의 옷차림에 본인은 당황하는 눈치이지만, 주위로부터의 평가는 사뭇 다른 듯하다."
