10039-CharacterSSRNewKr = "SRT特殊学園所属、RABBIT小隊のスナイパー。\n\n狙撃手としての才能を見入られてSRT特殊学園に入学したものの、突如として学園が閉鎖。現在は公園にて、同じ小隊の隊員たちと生活を送っている。存在感が希薄で、そのこと自体は狙撃任務に役立つものの、敵だけではなく味方にすら存在を忘れられることも多々。コールサインは「RABBIT4」。"
