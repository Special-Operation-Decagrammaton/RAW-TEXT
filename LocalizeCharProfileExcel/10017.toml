10017-ProfileIntroductionKr = "チェリノが誰かを粛清する時などに使用する拳銃。\n\n引き金を引くまでもなく、銃口を向けて「粛清だ！」と叫んだらレッドウィンターでは粛清対象となる。"
10017-CharacterSSRNewKr = "レッドウィンター連邦学園所属、横暴で子供っぽい生徒会長。\n\n権力への執着と欲求が非常に強く、毎週のように革命によって失脚させられるものの、その度どうにかして生徒会長の座に復帰することを繰り返す。その付けヒゲはチェリノ曰く「権威の象徴」であり、「権威というものはヒゲから出るものだ」とのこと。"
