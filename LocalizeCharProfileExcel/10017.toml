10017-ProfileIntroductionJp = "붉은겨울 학원의 학생회장.\n\n권력에 대한 집착과 욕심이 어마어마하며, 매주 혁명으로 실각해도 어떻게 해서든 학생회장의 자리에 복귀하곤 한다. 코에 달고 있는 가짜 콧수염은 권위의 상징으로, 체리노는 자신의 권위가 이 콧수염에서 나온다고 믿고 있다."
