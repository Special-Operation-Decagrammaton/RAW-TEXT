10140-WeaponDescEn = "A submachine gun Kurumi received from SRT Academy.\n\nIts light weight and high stability make it easy to use with a shield. It also makes less noise than other submachine guns, so it's useful for covert sentry removal."
10140-ProfileIntroductionEn = "The point person of SRT Academy's FOX Squad. Call sign is \"FOX 3.\"\n\nAs a student whose strength lies in exceptional physical abilities and quick thinking in crisis situations, she specializes in reactive combat. She has extreme emotional ups and downs and a simple personality, but is always able to quickly overcome dangerous situations.\n\nShe acts like she doesn't care, but her petite frame has given her a bit of an inferiority complex."
10140-CharacterSSRNewEn = "If you don't want to go blind,\ndon't look at my shield."
