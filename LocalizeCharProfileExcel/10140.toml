10140-WeaponNameTh = "FOX 45-Submachine Gun"
10140-WeaponDescTh = "ปืนกลมือ SMG มาตรฐานที่คุรุมิได้รับจากสถาบันพิเศษ SRT\n\nด้วยน้ำหนักที่เบาและความเสถียรสูง ทำให้ใช้งานร่วม\nกับโล่กำบังได้อย่างไร้อุปสรรค นอกจากนี้ยังมีเสียงที่\nเบากว่าปืนกลมือรุ่นอื่นๆ ทำให้สามารถลอบกำจัด\nทหารยามแนวหน้าได้อย่างเงียบเชียบ"
10140-ProfileIntroductionTh = "พ็อยนต์แมนของกองทหาร FOX จากสถาบันพิเศษ SRT รหัสประจำตัว <FOX 3>\n\nคุรุมิเป็นทั้งนักเรียนผู้มีจุดเด่นในเรื่องสมรรถภาพทางร่างกายที่เป็นเลิศ\nและมีไหวพริบในการแก้ไขสถานการณ์วิกฤต และเป็นพ็อยนต์แมนที่เชี่ยวชาญ\nการต่อสู้ด้วยสัญชาตญาณ แม้จะมีอารมณ์แปรปรวนรุนแรงและนิสัยที่เรียบง่าย แต่นั่นก็ทำให้เธอผ่านพ้นสถานการณ์อันตรายระหว่างปฏิบัติการของกองทหาร\nได้อย่างรวดเร็ว\n\nถึงเจ้าตัวจะแสร้งทำเป็นไม่สนใจ แต่ในใจลึกๆ แล้วคุรุมิรู้สึกไม่มั่นใจในรูปร่าง\nที่เล็กของตัวเอง"
10140-CharacterSSRNewTh = "ถ้าไม่อยากตาบอด\nก็ละสายตาจากโล่ของฉันจะดีกว่านะ"
