10140-WeaponDescTw = "胡桃被SRT特殊學園配給的制式衝鋒槍。\n\n重量輕巧且穩定性高，與盾牌搭配使用也毫無問題。噪音比起其他衝鋒槍相對較小，因此很適合用來在前線隱密處理哨兵。"
10140-ProfileIntroductionTw = "SRT特殊學園所屬，FOX小隊的尖兵。\n代號為「FOX3」。\n\n具備優異的體能和臨危不亂的應變能力，是名特化於本能戰鬥的尖兵。雖然情緒起伏劇烈且性格單純，卻也因此能在作戰中幫助小隊迅速脫離險境。\n\n雖然表面上裝作毫不在意，其實對自己嬌小的身材抱持著些許的自卑感。"
10140-CharacterSSRNewTw = "不想被閃瞎的話，\n最好把視線從我的盾牌上移開"
