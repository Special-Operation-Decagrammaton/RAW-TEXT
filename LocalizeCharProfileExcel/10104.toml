10104-WeaponNameJp = "레이죠가 사용하는 자동소총.\n\n총과 권의 조화를 위해, 그녀 나름의 개량이 더해져 있다. 사격 실력은…… 끊임없는 훈련을 통해, 개선되었다고 한다"
