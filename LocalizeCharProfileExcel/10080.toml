10080-CharacterSSRNewKr = "常盤台中学所属の気品溢れる女子中学生。\n\n名門校である常盤台中学の中でも最大派閥を率いる実力者で、学園都市に7人しか存在しない超能力者「レベル5」の一人。使用する超能力は他人の精神を操る「心理掌握（メンタルアウト）」。しかし、キヴォトスに転移してからは能力を思いのまま発揮できていない様子。同じく「レベル5」の超能力者で、自分の能力が通じない御坂美琴が実は少し苦手。"
