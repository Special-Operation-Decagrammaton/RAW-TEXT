10006-WeaponNameJp = "이오리가 규칙 위반자들을 선도할 때 사용하는 저격소총.\n\n스코프도 달려 있지 않은 단순한 형태의 저격소총이지만, 스페셜리스트는 도구를 가리지 않는다."
