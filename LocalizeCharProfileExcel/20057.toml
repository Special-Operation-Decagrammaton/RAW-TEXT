20057-WeaponDescTh = "ปืนพกเงียบของอาคาเนะ\n\nถ้าอยากให้เจ้าของปืน 'อยู่เงียบๆ' ทางที่ดีที่สุดคือ ให้หลีกเลี่ยงพฤติกรรมที่ไม่เหมาะสม"
20057-ProfileIntroductionTh = "สายลับ C&C ที่ปลอมตัว 'เป็นนักเรียน' เพื่อปฏิบัติการในงานมิลเลเนียม เอ็กซ์โป\n\nทางที่ดีคือไม่ควรถามว่าทำไมชุดนักเรียนถึงถูกใช้เป็นชุดสำหรับปลอมตัว เมื่อสามารถใช้ชีวิตเป็นนักเรียนธรรมดาที่ไม่ใช่ทั้งเมดและสายลับได้ อาคาเนะที่นิสัยอ่อนโยนอยู่แล้วจึงยิ่งดูสงบนิ่งไปอีกขั้น...\n\nแต่ถึงอย่างนั้น อาคาเนะก็ยังไม่ลืมวิธีแก้ปัญหาแบบ 'สะอาดหมดจด' เหมือนกับทุกวัน"
20057-CharacterSSRNewTh = "ไปเดินเล่นในมิลเลเนียมกับฉันมั้ยคะ?"
