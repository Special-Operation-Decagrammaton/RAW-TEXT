16020-WeaponDescTh = "ปืนไรเฟิลซุ่มยิงมาตรฐานที่โอโทกิได้รับจากสถาบันพิเศษ SRT\n\nมีพลังทำลายสูงจนจัดการเป้าหมายที่หลบหลังกำบังได้ นอกจากนี้ความเร็วสูงของกระสุนยังทำให้ลอบยิงในระยะ\nไกลเป็นพิเศษได้อย่างแม่นยำ แต่ข้อเสียคือมีน้ำหนักมาก โอโทกิจึงมีอาการปวดไหล่เรื้อรัง..."
16020-ProfileIntroductionTh = "สไนเปอร์ของกองทหาร FOX จากสถาบันพิเศษ SRT รหัสประจำตัว <FOX 4>\n\nแตกต่างจากพลซุ่มยิงส่วนใหญ่ที่เป็นหมาป่าเดียวดาย โอโทกิเป็นนักเรียนที่\nมีนิสัยชอบหยอกล้อและสนิทสนมกับคนที่เพิ่งเจอกันครั้งแรกได้ง่าย ด้วยเหตุนี้โอโทกิจึงมีบทบาทเป็นผู้สร้างบรรยากาศที่ดีในกองทหาร ส่วนเมื่ออยู่ในสนามรบ โอโทกิจะมีบทบาทในการบั่นทอนขวัญกำลังใจของ\nศัตรูด้วยความมั่นใจที่ติดตัวมาตั้งแต่เกิด\n\nนอกจากนี้ยังมีความชำนาญในการจัดการอุปกรณ์อิเล็กทรอนิกส์ จึงรับมือกับปัญหาเครื่องจักรกลขัดข้องได้แทบทุกประเภท"
