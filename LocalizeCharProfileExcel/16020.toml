16020-WeaponDescTw = "御伽被SRT特殊學園配給的制式狙擊槍。\n\n憑藉強大的火力，不僅能狙擊躲在掩體後方的對手，更因彈速極快而能進行超遠距離狙擊。不過缺點是重量非常沉重，也因此御伽長期飽受肩膀僵硬之苦……"
16020-ProfileIntroductionTw = "SRT特殊學園所屬，FOX小隊的狙擊手。\n代號為「FOX 4」。\n\n與大多數偏向獨行俠類型的狙擊手不同，是個就算面對初次見面的人也能輕鬆攀談、喜歡惡作劇的學生。在小隊中擔任著炒熱氣氛的開心果角色，在戰場上也憑藉與生俱來的存在感，肩負起打擊敵軍士氣的任務。\n\n擅長操作電子裝備，一般機械設備的故障大多都能應付。"
