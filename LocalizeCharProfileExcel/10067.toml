10067-WeaponNameJp = "토키 전용의 돌격소총.\n\n통상 임무뿐만이 아니라 비밀 작전에도 적합하다고 그녀는 주장한다. 그 주장에 대한 증명은, 보통 그녀 스스로의 손으로 이루어진다."
