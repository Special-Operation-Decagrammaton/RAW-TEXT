20056-WeaponDescTh = "ปืน MG ที่ผ่านพ้นความยากลำบากต่างๆ มากับโคยูกิ\n\nต่างจากเจ้าของที่มักจะก่อเรื่องวุ่นวายไม่เว้นแต่ละวัน ปืนนี้กลับดูน่าเชื่อถือและคอยทำหน้าที่สนับสนุน และอยู่เคียงข้างอย่างเงียบๆ หรือบางทีมันอาจจะ\nไม่ได้คิดอะไรมากก็เป็นได้... "
20056-ProfileIntroductionTh = "เด็กสาวอัจฉริยะตัวป่วนแห่งเซมิน่าจากโรงเรียนมิลเลเนียม\n\nครั้งนี้เธอเปลี่ยนชุดมาใส่เป็นชุดนอนที่ได้รับเป็นของขวัญมาจากยูกะ ทว่าถึงจะเปลี่ยนเป็นชุดนอนแล้วแต่โคยูกิก็ยังเป็นโคยูกิ เธอยังคงมีรักอิสระ และทำตามใจตัวเองอยู่ไม่เปลี่ยนแปลง"
20056-CharacterSSRNewTh = "ทำๆ ไปก่อน เรื่องอื่นไว้ทีหลัง!"
