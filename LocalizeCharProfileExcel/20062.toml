20062-ProfileIntroductionKr = "183호 특별반의 부반장.\n\n덜렁거리고 꼼꼼하지 못한 성격으로 연구중 사고를 치고 183호 특별반에 오게 되었다. 화학 주임을 맡고 있으며, 분명 유능하지만 공부를 너무 싫어하고 게으른 탓에 자주 사고를 치곤 한다. 오지의 183호에서 밖으로 자유롭게 나가지 못해 답답해하며 사면에 큰 기대를 걸고있다."
