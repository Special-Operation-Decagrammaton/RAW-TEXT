20062-ProfileIntroductionJp = "レッドウィンター連邦学園所属、ただし懲戒処分を受けて現在は旧校舎183号特別クラスで謹慎中の生徒。183号特別クラス内では副委員長を務めている。\n\nずぼらな性格で、研究中の事故が原因となり183号特別クラス行きになった。化学の主任を務めるほど有能な一方、勉強が大嫌いな面倒くさがり屋のトラブルメーカー。僻地にある183号からは自由に外出できず、もどかしい日々を送っている。そのため、謹慎が解除される日を今か今かと待ち望んでいる。"
20062-CharacterSSRNewJp = "勉強以外ならウェルカム～！"
