20060-WeaponDescTh = "ปืนที่อิบูกิหวงแหนมาก\n\nเป็นสมบัติล้ำค่าที่ได้รับจากรุ่นพี่ในแพนเดโมเนียม โซไซตี้ เธอจึงเตรียมมาตรการกันน้ำมาอย่างรัดกุม เพราะกลัวว่าหากเปียกน้ำแล้วอาจเสียได้ ว่ากันว่าเตรียมการมาดีขนาดที่จุ่มปืนลงในน้ำทะเล ก็ไม่เป็นอะไรเลย"
20060-ProfileIntroductionTh = "เด็กสาวอัจฉริยะที่แม้จะอยู่ชั้นประถม แต่ก็ได้เป็นสมาชิกแห่งแพนเดโมเนียม โซไซตี้ องค์กรสูงสุดของสถาบันเกเฮนน่า\n\nจริงๆ แล้วนี่เป็นครั้งแรกที่อิบูกิได้มาเห็นทะเล จึงตื่นเต้นเอามากๆ ทริปทะเลครั้งนี้เองก็เป็นของขวัญจากเหล่ารุ่นพี่เพื่ออิบูกิด้วยเช่นกัน แม้จะยังได้รับความรักจากรุ่นพี่อย่างเต็มเปี่ยมเช่นเคย แต่อิบูกิก็ไม่อ้อนเอาแต่ใจ เป็นนักเรียนดีเด่นที่ตั้งใจเรียนอยู่ทุกวัน เพื่อจะได้ทำหน้าที่ของตัวเองให้เต็มที่เท่าคนคนหนึ่ง"
20060-CharacterSSRNewTh = "ดูสิ~ ผืนน้ำยาวไปถึงตรงนู้นเลยละ~!"
