20060-WeaponNameJp = "이부키가 소중히 여기고 있는 총기.\n\n만마전 선배들에게 받은 소중한 보물이라, 혹시라도 물에 젖어 고장 날까 봐 철저히 방수 대책을 해서 갖고 왔다. 그 덕에 바닷물에 담가도 끄떡없다고."
20060-WeaponDescJp = "バンバーン！ちゃん"
20060-ProfileIntroductionJp = "초등부 소속이면서도 게헨나 학원의 톱, 판데모니움 소사이어티의 의원이 된 수재 소녀.\n\n사실은 바다가 처음이라 굉장히 두근두근하고 있다. 이번 바다 여행은 그런 이부키를 위한 선배들의 선물이기도 하다. 이렇듯이 여전히 선배들의 사랑을 듬뿍 받고 있지만, 어리광 부리지 않고 열심히 일인 분 몫을 하기 위해 오늘도 공부하는 모범생."
20060-CharacterSSRNewJp = "있잖아~ 저기 끝까지 다 물이다~?"
