20060-WeaponDescJp = "イブキが大切にしている銃。\n\n万魔殿の先輩からもらった大切な宝物。水に濡れて壊れてしまったら大変だと、念入りに防水対策をしている。そのため、海水に多少つかってもへっちゃらなのだとか。"
20060-ProfileIntroductionJp = "ゲヘナ学園の中枢組織「万魔殿」の議員を務める秀才少女。\n\n海に来るのは初めてで、期待で胸を躍らせている。今回の旅行は、イブキのために万魔殿のみんなが用意してくれた贈り物でもある。先輩からたくさん可愛がられているが、それに甘えることなく、自分の役目をしっかり果たそうと今日も勉学に励んでいる模様。"
