20060-WeaponDescTw = "伊吹十分珍惜的槍械。\n\n這是萬魔殿的前輩們送的重要寶物，他怕萬一泡到水壞掉，所以做足了防水措施才帶來。多虧如此，就算泡進海水裡也安然無恙。"
20060-ProfileIntroductionTw = "本來是國小部卻成為格黑娜學園高層「萬魔殿」議員的資優少女。\n\n其實是第一次來海邊，興奮得不得了。這次的海邊之旅，也是前輩們為這樣的伊吹準備的禮物。雖然一直受前輩們疼愛有加卻不會撒嬌，是個今天也為了能獨當一面而努力用功的模範生。"
20060-CharacterSSRNewTw = "老師你看～從這邊到那邊全都是水耶～！"
