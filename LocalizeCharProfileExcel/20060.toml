20060-WeaponDescEn = "A gun that Ibuki treasures.\n\nIt was a gift from her Pandemonium Society seniors, so she took extra care to waterproof it before bringing it along. Thanks to that, it can apparently handle a dip in seawater without a problem."
20060-ProfileIntroductionEn = "A gifted girl who, despite being in Gehenna Academy's elementary school, became a member of the Pandemonium Society, the academy's top organization.\n\nThis is actually Ibuki's first trip to the beach, and she can barely contain her excitement. This seaside trip is also a gift from her seniors, all specifically for her. Though they continually shower her with affection, Ibuki doesn't act spoiled and studies hard every day so she can do her part."
