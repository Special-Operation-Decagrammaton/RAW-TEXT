10034-ProfileIntroductionKr = "ミモリが普段持ち歩いている自動式拳銃。\n\n初めて素敵なレディーになりたいという夢を抱いた時に買ったもので、日々大切に手入れがされている。"
10034-CharacterSSRNewKr = "百鬼夜行連合学院所属、修行部の優しい副部長。\n\nいつも朗らかな笑顔と穏やかな物腰で、皆からの人望が非常に厚い。幼い頃に読んだ少女漫画の影響で「大和撫子」になりたいという夢を抱き、修行部へと入った。幼馴染であり部長でもあるツバキとともに、料理や掃除などの修行に日々邁進している。"
