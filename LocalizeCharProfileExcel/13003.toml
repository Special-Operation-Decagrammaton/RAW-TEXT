13003-ProfileIntroductionKr = "ハスミのお気に入りのスナイパーライフル。\n\nどこか古風な良さがあるすらりとした外観と、それに反してかなり激しい威力は、どちらとも持ち主にそっくりである。"
13003-CharacterSSRNewKr = "トリニティ総合学園所属、正義実現委員会のNo.2。\n\n狂乱の象徴である委員長、ツルギの代わりに、正義実現委員会の戦術指揮官の役割も担当している。そのため一見、落ち着いていて知的という「これぞトリニティの生徒」という模範的な生徒にも見えるが、れっきとした正義実現委員会の一員である。誰よりも冷静に、時には無茶な行動をしたりもする。"
