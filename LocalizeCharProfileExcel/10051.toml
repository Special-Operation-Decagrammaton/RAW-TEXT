10051-ProfileIntroductionJp = "대운동회를 맞이해 응원단장 차림을 한 엔지니어부의 부장.\n\n비록 갑작스럽게 맡게 된 응원 업무이지만, 의뢰를 맡으면 언제나 최선을 다하는 마이스터답게 그녀의 열정은 그 어떤 응원단장보다 뜨겁게 타오른다. 가끔은 그 열정이 지나쳐 본 목적을 잊어버리기도 하지만……"
10051-CharacterSSRNewJp = "불타는 열정을 담아서!"
