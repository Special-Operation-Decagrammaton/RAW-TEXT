10110-ProfileIntroductionJp = "트리니티 종합학원을 구성하고 있는 티파티의 일원이자 <상투스>의 수장.\n\n주변에서는 현학적이고 종잡기 어려운 사람으로 여겨지고, 조금은 제멋대로인 귀족과 같은 면모가 있다. 건강이 돌아온 이후로는 전보다 조금 더 고집스럽고 장난기 있는 어린아이 같은 모습도 종종 보인다."
