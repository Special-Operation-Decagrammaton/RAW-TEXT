10060-WeaponNameJp = "현장에선 메구와 한 몸이나 다름없는, 메구 전용의 화염방사기.\n\n엄청난 열기를 내뿜기 때문에 다른 사람들은 감당조차 하기 어렵다. 이름이 이상한 이유는, 누군가 던졌던 말장난을 마음에 들어해 그대로 이름 붙였기 때문이다."
