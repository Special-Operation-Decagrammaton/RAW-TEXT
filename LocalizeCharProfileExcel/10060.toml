10060-ProfileIntroductionJp = "온천개발부의 중추이자 개발현장의 작업반장.\n\n매사의 모든 문제를 '치워버리는 것'으로 해결할 수 있다고 믿는다. 호탕하고 시원한 성격, 발군의 철거 능력으로 온천개발부 모두에게서 두터운 신임을 얻고 있다."
