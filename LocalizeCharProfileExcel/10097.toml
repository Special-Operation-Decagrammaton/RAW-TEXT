10097-WeaponNameJp = "모에가 SRT 특수학원에서 지급받은 제식 권총.\n\n튼튼한 몰리브덴 합금으로 프레임이 제작되어, 고온다습한 바닷가에서도 빠른 연사를 가할 수 있다."
