10064-ProfileIntroductionKr = "カヨコが普段持ち歩いている拳銃。\n\n撃つたびにかなりの音を発するこの拳銃は、無礼な依頼主を追い払う時だけでなく、新年の厄払いにも有効だ。"
10064-CharacterSSRNewKr = "新年を迎えたゲヘナ学園所属、便利屋68の課長。\n\n新年を迎えて他のメンバーと同じく着飾ったはずなのに、まるで普段から袖を通しているかのように、その立ち居振る舞いには貫禄がある。騒動を面倒くさがってはいるものの、便利屋68のためなら知恵を貸してくれる。"
