10046-WeaponNameJp = "이즈나가 애용하는 기관단총.\n\n문자 그대로 최첨단 닌자 도구이기 때문에 방수 기능도 완비! 즉 바닷속에서 사용하는 것도 문제가 없다. 주군을 위한 이즈나의 어깨 마사지엔 빈틈이 없는 것이다."
