10145-ProfileIntroductionTw = "在老師及眾人的幫助下，得以前來享受夏日休養的山海經高級中學所屬，學生會「玄龍門」的門主。\n\n身體狀況比平時更好，也更添了幾分解放感。正因為這般自由的時光本就難得，於是在種種意義上，都滿懷著「盡情享樂」的心思。"
