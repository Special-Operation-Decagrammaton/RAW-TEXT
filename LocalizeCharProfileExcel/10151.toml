10151-ProfileIntroductionJp = "レッドウィンター連邦学園所属、ただし懲戒処分を受けて現在は旧校舎183号特別クラスで謹慎中の生徒。183号特別クラス内では学級委員長を務めている。\n\n将来有望なエリート研究者だったが、強引な研究により事故を起こし、183号特別クラス行きになった。専門は機械工学で、主任を任されている。他者から認められ、褒められることを好み、かつて授与された勲章を今も大切に身に着けている。内心では勲章の由来を尋ねられたいと思っている。"
