10136-CharacterSSRNewKr = "ミレニアムサイエンススクール所属、特異現象捜査部のスペシャリスト。\n\nマークスマンとして後方支援をすべく着替えている。できるだけ肌の露出を抑えた方が支援に適していると思ったものの……暑さに耐えられなかったのか、ケープを脱いで腰に巻いている。\n\nトキと同様メインの武器をエネルギーライフルに変更した。狙撃サポート用のバイザーを装着しているため、バックパックもトキのものより遥かに大型のものとなっているのだとか。"
