10146-WeaponNameTh = "The Honored One"
10146-WeaponDescTh = "ปืนไรเฟิลซุ่มยิงที่มาโคโตะใช้\n\nปกติใช้เพื่อแสดงบารมีเท่านั้น แต่ด้วยสถานการณ์ที่\nเป็นอยู่ จึงหยิบมาใช้งานจริงอย่างแข็งขันซึ่งหาได้ยาก บางทีนี่อาจเป็นช่วงที่เธอยิงปืนมากที่สุดในรอบปีก็ได้"
10146-ProfileIntroductionTh = "ประธานแห่งแพนเดโมเนียม โซไซตี้ สภานักเรียนของสถาบันเกเฮนน่า\n\nไม่ว่าจะทำอะไร มาโคโตะไม่เคยทำแบบครึ่งๆ กลางๆ ด้วยแรงผลักดันอัน\nมหาศาล เธอมีเพียงสองทางเลือก คือประสบความสำเร็จอย่างงดงาม\nหรือพังพินาศอย่างหมดจด และด้วยนิสัยสะเพร่า ส่วนใหญ่จึงมักจะลงเอย\nแบบหลัง วันหยุดฤดูร้อนครั้งนี้เองก็เป็นเช่นนั้น"
10146-CharacterSSRNewTh = "ดูท่าจะมีคนต้องการท่านมาโคโตะผู้นี้อยู่สินะ"
