10146-ProfileIntroductionJp = "게헨나 학원의 학생회, 판데모니움 소사이어티의 의장.\n\n무엇이든 어설프게 하지 않는다. 엄청난 추진력으로 확실하게 성공하거나, 확실하게 망하거나, 오직 두 가지 선택지만을 가지고 있다. 부주의한 성격 탓에, 대체로 후자의 경우가 많고, 이번 여름휴가도 그렇게 되고 말았다."
10146-CharacterSSRNewJp = "또 어디선가 이 몸을 필요로 하고 있군."
