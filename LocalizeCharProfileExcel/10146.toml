10146-WeaponDescKr = "마코토가 사용하는 저격소총.\n\n 보통은 위엄을 내세우는 용도로만 사용하지만, 상황이 상황이니만큼 드물게도 적극적으로 사용하고 있다. 어쩌면 한해 중 가장 많이 쐈을지도."
10146-ProfileIntroductionKr = "게헨나 학원의 학생회, 판데모니움 소사이어티의 의장.\n\n무엇이든 어설프게 하지 않는다. 엄청난 추진력으로 확실하게 성공하거나, 확실하게 망하거나, 오직 두 가지 선택지만을 가지고 있다. 부주의한 성격 탓에, 대체로 후자의 경우가 많고, 이번 여름휴가도 그렇게 되고 말았다."
10146-CharacterSSRNewKr = "또 어디선가 이 몸을 필요로 하고 있군."
