10146-ProfileIntroductionTw = "格黑娜學園所屬，學生會「萬魔殿」的議長。\n\n無論做什麼都不會半途而廢。憑著驚人的推進力，結果不是徹底成功，就是徹底搞砸，只有這兩種選擇。再加上生性粗心大意，大多時候都會落得後者的下場，這次的暑假似乎也不例外。"
