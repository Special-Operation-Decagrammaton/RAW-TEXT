10146-WeaponNameJp = "마코토가 사용하는 저격소총.\n\n 보통은 위엄을 내세우는 용도로만 사용하지만, 상황이 상황이니만큼 드물게도 적극적으로 사용하고 있다. 어쩌면 한해 중 가장 많이 쐈을지도."
