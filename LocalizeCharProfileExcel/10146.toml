10146-CharacterSSRNewKr = "ゲヘナ学園所属、「万魔殿」の議長。\n\n何事も中途半端では終わらせない。その圧倒的な推進力の行き着く先は、偉大なる成功か、盛大な失敗かのどちらか。生来のうっかり屋な部分も相まって、たいていは後者になりがち。この夏休みも例外ではないようだ。"
