10141-ProfileIntroductionTh = "พนักงานประจำของหน่วยรับจ้างสารพัด 68 ที่แฝงตัวเข้ามาในโรงละครโอเปร่า\n\nแม้จะใส่ชุดเดรสตามเดรสโค้ดแล้ว แต่ฮารุกะก็รู้สึกประหม่าเล็กน้อย\nเพราะคิดว่าชุดนี้ไม่เหมาะกับตัวเอง แน่นอนว่ามีแค่เจ้าตัวเท่านั้นที่ไม่รู้ว่าชุดนี้\nเหมาะกับตัวเองแค่ไหน"
10141-CharacterSSRNewTh = "ฉะ... ฉันเหมาะกับชุดนี้งั้นเหรอคะ...? จริงเหรอคะ...?"
