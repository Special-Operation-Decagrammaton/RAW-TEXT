[translation]
10154-101540010 = "선생님. 안녕하십니까?"
10154-101540020 = "샬레와 정식 교류라니."
10154-101540030 = "여러 가지 의미로 기대되네요."
10154-101540040 = "여러 가지 의미?"
10154-101540050 = "후후."
10154-101540060 = "정말로 기대가 된다는 뜻이랍니다."
10154-101540070 = "별다른 의미는 없어요."
10154-101540080 = "네."
10154-101540090 = "정. 말. 로. 요."
10154-101540100 = "혹시 제 말을 오해하신 걸까요?"
10154-101540110 = "아니야! 난 그냥 궁금해서!"
10154-101540120 = "네. 다행이네요."
10154-101540130 = "그럼 오늘 약속 장소에서 뵙겠습니다."
10154-101540140 = "즐겁게 감각의 예술을 논하죠."
10154-101540150 = "선생님. 잘 돌아가셨는지요?"
10154-101540160 = "오늘은 정말 즐거운 시간이었습니다."
10154-101540170 = "다음에 있을 교류도 기대되네요."
10154-101540180 = "긍정적인 의미로요."
10154-101540190 = "긍정적인 의미……?"
10154-101540200 = "후후, 다른 의미는 없답니다."
10154-101540210 = "정말 기대한다는 뜻이었어요."
10154-101540220 = "저는 절대로 수상한 소문이 가득한 선생님을"
10154-101540230 = "신용해도 될지 고민한 적은 없었으니까요."
10154-101540240 = "항상 기대에 부합하도록 하겠습니다!"
10154-101540250 = "네. 그럼 앞으로도 잘 부탁드리겠습니다."
10154-101540260 = "선생님. 좋은 하루입니다."
10154-101540270 = "조금 갑작스럽습니다만"
10154-101540280 = "예술품 전시 관련으로 상의드릴 게 있습니다."
10154-101540290 = "괜찮으신지요?"
10154-101540300 = "응. 뭐든 말해줘."
10154-101540310 = "뭐든?"
10154-101540320 = "뭐든 말입니까?"
10154-101540330 = "흠, 과연."
10154-101540340 = "이렇게 학생들의 호감을 샀던 거군요."
10154-101540350 = "무, 무슨 이야기야?"
10154-101540360 = "아무튼 괜찮다고 하시니"
10154-101540370 = "곧 일정을 잡아보도록 하겠습니다."
10154-101540380 = "자세한 건 그때 이야기하죠."
10154-101540390 = "선생님. 안녕하십니까?"
10154-101540400 = "오늘은 날씨가 매우 좋군요."
10154-101540410 = "선생님은 오늘 같은 날 피로가 쌓이면"
10154-101540420 = "어떤 식으로 해결하시나요?"
10154-101540430 = "가볍게 사무실 근처를 산책해."
10154-101540440 = "생각보다 건전한 방법이군요."
10154-101540450 = "선생님이라면 몰래 숨겨둔 학생들의……"
10154-101540460 = "아. 실례."
10154-101540470 = "이건 선생님의 비밀이었죠?"
10154-101540480 = "뭔진 몰라도 아냐!"
10154-101540490 = "후후, 정말로요?"
10154-101540500 = "아무튼 참고가 되었습니다."
10154-101540510 = "부디 평안한 하루 되시길."
10154-101540520 = "선생님. 기분 전환은 잘 되었는지요?"
10154-101540530 = "오늘은 정말 즐거운 시간이었습니다."
10154-101540540 = "선생님에게 그런 비밀이 있다니……."
10154-101540550 = "솔직히 조금 놀랐어요."
10154-101540560 = "하지만 안심하시길."
10154-101540570 = "절대로."
10154-101540580 = "절대로 절대로."
10154-101540590 = "그 누구에게도 발설하지 않겠어요."
10154-101540600 = "도대체 무슨 비밀을 말하는 건데?!"
10154-101540610 = "어머나."
10154-101540620 = "우연을 가장해 함께 외출한 뒤"
10154-101540630 = "그렇게나 특별한 말씀을 하셔 놓곤……"
10154-101540640 = "선생님도 참 음험한 사람이네요."
10154-101540650 = "자기소개 시간입니까?!"
10154-101540660 = "후후, 항상 반응이 재미있으시네요."
10154-101540670 = "그럼, 다음에도 또 즐겁게 이야기를 나누죠."
10154-101540680 = "남은 하루, 부디 잘 마무리하시길."
10154-101540690 = "선생님."
10154-101540700 = "이번에도 조금 갑작스럽습니다만."
10154-101540710 = "선생님의 협조가 필요합니다."
10154-101540720 = "어떤 일이야?"
10154-101540730 = "이번엔 우리 평의회의 공식 요청입니다."
10154-101540740 = "미제로 남았던 10년 전 도난 사건."
10154-101540750 = "그 사건의 단서를 잡았어요."
10154-101540760 = "바로 갈게!"
10154-101540770 = "감사합니다."
10154-101540780 = "그럼 현장에서 뵙죠."
10154-101540790 = "선생님."
10154-101540800 = "이걸로 선생님과 저는"
10154-101540810 = "함께 밤을 보낸 사이가 됐군요."
10154-101540820 = "무슨 소리야?!"
10154-101540830 = "모르는 척해도 소용없답니다."
10154-101540840 = "물증도 있으니까요."
10154-101540850 = "바로 선생님의 출입 기록이죠."
10154-101540860 = "단둘이 평의회실에서 만든 추억들……."
10154-101540870 = "설마 부정하진 않으시겠죠?"
10154-101540880 = "큿……!"
10154-101540890 = "후후, 이걸로 선생님의 약점을 잡았군요."
10154-101540900 = "너무하다고 말씀하진 마세요."
10154-101540910 = "모두 선생님이 원해서 했던 거잖아요?"
10154-101540920 = "저는 돌아가시라고 재촉했는데 말이에요."
10154-101540930 = "그, 그렇긴 한데……!"
10154-101540940 = "후후……."
10154-101540950 = "이 정도에서 넘어가도록 하죠."
10154-101540960 = "그럼 앞으로도 잘 부탁드립니다."
