[translation]
10149-101490010 = "선생님"
10149-101490020 = "아까 트라이던트 학생들이 이야기하는 걸 들었어요"
10149-101490030 = "배에 바나나를 들고 타셨다가 소란이 있었다고"
10149-101490040 = "응. 그렇게 무섭게 반응하는 학생들은 처음 봤어……"
10149-101490050 = "바나나를 악마의 열매처럼 노려보더라……"
10149-101490060 = "오래된 관습이긴 하지만, 바나나는 주변 식재료를 쉽게 썩게 만드는 성질이 있으니까요."
10149-101490070 = "식재료 수급이 한정된 배 위에서는 꺼려지는 게 당연한지라"
10149-101490080 = "안전을 위한 조치이니 다소 과장되게 느껴져도 이해해주세요"
10149-101490090 = "어쩔 수 없지"
10149-101490100 = "그나저나 다이빙을 할 때도 어기면 안 되는 수칙 같은 게 있어?"
10149-101490110 = "물론이에요"
10149-101490120 = "바로 생각나는 것만 해도 꽤 많지만, 하나만 꼽아보자면"
10149-101490130 = "물 속에 들어간 뒤에는"
10149-101490140 = "꼭 물 밖으로 나와야 해요"
10149-101490150 = "뭔가 의미심장한 수칙이구나……"
10149-101490160 = "지난 번에 당번일로 샬레에 갔을 때"
10149-101490170 = "집무실에 틀어 두셨던 노래, 좋았었는데……"
10149-101490180 = "혹시 제목을 알 수 있을까요?"
10149-101490190 = "아, 미안하지만 그 때 흘러나오던 곡은……\""
10149-101490200 = "라디오의 방송을 틀어 두었던 거라, 나도 잘 모르는 곡이었어.\""
10149-101490210 = "아 그렇군요"
10149-101490220 = "아쉽지만 어쩔 수 없네요"
10149-101490230 = "제목을 알게 된다면 제 플레이리스트에 추가해 둘까 했어서"
10149-101490240 = "코코로는 노래 듣는 걸 좋아하는 구나."
10149-101490250 = "아 넵"
10149-101490260 = "듣는 것도 좋아하지만"
10149-101490270 = "네"
10149-101490280 = "노래는 대부분 좋아하는 편이에요."
10149-101490290 = "곤란하네요……"
10149-101490300 = "무슨 문제라도 있어?"
10149-101490310 = "아, 다름이 아니라"
10149-101490320 = "내일은 바다의 상태가 된장국이라서"
10149-101490330 = "아무래도 다이빙이 쉽지 않을 것 같아서요."
10149-101490340 = "……된장국?"
10149-101490350 = "네"
10149-101490360 = "혹시 선생님은"
10149-101490370 = "어떻게 생각하시나요?"
10149-101490380 = "무슨 상황인지는 정확히 모르겠지만……"
10149-101490390 = "나는 된장국 좋아해."
10149-101490400 = "네? 정말이신가요?"
10149-101490410 = "물론 사람마다 취향은 다르겠지만"
10149-101490420 = "저는 정말 싫어하거든요……"
10149-101490430 = "뭐 사람마다 취향은 다른 법이니까"
10149-101490440 = "그래도 선생님과 같은 취향이었으면 좋았을 텐데"
10149-101490450 = "조금은 아쉽네요."
10149-101490460 = "선생님."
10149-101490470 = "내일 다이빙 참관 오실 때는 시간을 때울 만한 소일거리를 가져오시는 걸 추천드릴게요."
10149-101490480 = "책이라던가, 간단한 오락기라던가"
10149-101490490 = "혹은 미뤄둔 일감이라던가."
10149-101490500 = "아마 물에 들어가서 2시간 정도는 나오지 않을 예정이라서요."
10149-101490510 = "다이빙에 2시간이나 걸리는 거야?"
10149-101490520 = "얼마나 깊이 잠수하려고……?"
10149-101490530 = "물론 평소보다 조금 더 깊이 잠수하는 것도 있지만……"
10149-101490540 = "요 며칠 동안 연속으로 다이빙을 해서요."
10149-101490550 = "잠수병을 예방하기 위해 내일은 부상할 때 천천히 올라오려고요."
10149-101490560 = "오래 잠수하면 오히려 잠수병이 심해지진 않아?"
10149-101490570 = "아뇨. 잠수병은 갑작스러운 기압 차로 발생하는 병이기 때문에"
10149-101490580 = "시간을 오래 두고 천천히 부상하는 게 더 안전해요."
10149-101490590 = "물론 감압 챔버를 사용하는 방법도 있지만……"
10149-101490600 = "여하튼 내일도 잘 부탁드리겠습니다!"
10149-101490610 = "그"
10149-101490620 = "지난 번에는 죄송했습니다"
10149-101490630 = "잠수병 때문에 정신이 혼미해서"
10149-101490640 = "조금 이상한 소리를 했을지도"
10149-101490650 = "괜찮아, 신경 쓰지 마."
10149-101490660 = "내 실수 탓에 벌어진 일이기도 하고……"
10149-101490670 = "그나저나 이제는 괜찮은 거야?"
10149-101490680 = "네. 다행히 바로 감압을 해서 문제는 없었어요."
10149-101490690 = "다음 번에는 문제가 생기지 않도록"
10149-101490700 = "아니"
10149-101490710 = "다음 번에도 문제가 다시 생기면"
10149-101490720 = "선생님께서 도와주셔야 해요?"
10149-101490730 = "물론이지."
10149-101490740 = "후후"
10149-101490750 = "감사합니다!"
