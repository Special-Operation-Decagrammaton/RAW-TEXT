[translation]
10141-101410010 = "คุณครูคะ ฉันมีเรื่องอยากปรึกษาค่ะ..."
10141-101410020 = "จะว่ายังไงดีนะ..."
10141-101410030 = "คนอย่างฉันจะใส่ชุดเดรสกับเขาได้\nด้วยเหรอคะ...?"
10141-101410040 = "ไม่สิขอโทษค่ะไม่ต้องสนใจนะคะ"
10141-101410050 = "ฉันไม่มั่นใจที่จะใส่ชุดนี้น่ะค่ะ..."
10141-101410060 = "เราไม่ต้องมีคุณสมบัติใดๆ\nเพื่อจะใส่ชุดเดรสหรอกนะ"
10141-101410070 = "เอ่อ"
10141-101410080 = "ก็คงจะอย่างนั้นนะคะ...? "
10141-101410090 = "ขอบคุณค่ะ... คุณครู... "
10141-101410100 = "ที่บาดเจ็บไปเมื่อกี้ ไม่เป็นอะไรแน่\nใช่มั้ยคะ...?"
10141-101410110 = "หลังจากนั้นอาการไม่ได้แย่ลง\nหรือเป็นอะไรมากกว่านั้นใช่มั้ยคะ?"
10141-101410120 = "ไม่เป็นไร ไม่เป็นไร!"
10141-101410130 = "แค่แผลถลอกนิดหน่อยเอง!"
10141-101410140 = "ขอโทษค่ะ..."
10141-101410150 = "ในฐานะเจ้าหน้าที่รักษาความ\nปลอดภัย ฉันควรจะจับพวกนั้น\nให้ได้แท้ๆ..."
10141-101410160 = "ถ้าฉันได้ทำงานแบบนี้อีกละก็"
10141-101410170 = "ตอนนั้นฉันจะขวางไว้ให้ได้เลยค่ะ...!"
10141-101410180 = "สวัสดีค่ะ คุณครู"
10141-101410190 = "ฉันฮารุกะ นักเรียนเวรของชาเล่ต์\nวันนี้ค่ะ"
10141-101410200 = "เอ่อ"
10141-101410210 = "แต่ว่า..."
10141-101410220 = "ถ้าเกิดเห็นหน้าฉัน แล้วแผลจาก\nคราวก่อนมันเจ็บจี๊ดขึ้นมาละก็..."
10141-101410230 = "ฉันว่าฉันไม่ควรไปดีกว่า..."
10141-101410240 = "ไม่หรอก ไม่มีปัญหาอะไรเลย"
10141-101410250 = "ครูอยากเจอฮารุกะนะ"
10141-101410260 = "ตะ"
10141-101410270 = ";ตา...ย แล้ วว;#@"
10141-101410280 = "ฉัน"
10141-101410290 = "ฉันจะไปเดี๋ยวนี้เลยค่ะ!"
10141-101410300 = "ป "
10141-101410310 = "...?"
10141-101410320 = "อ๊ะ "
10141-101410330 = "ไม่นะ"
10141-101410340 = "เมื่อกี้ฉันกดส่งผิดค่ะ"
10141-101410350 = "ไม่ต้  "
10141-101410360 = "ไม่ต้องใส่ใจก็ได้นะคะ "
10141-101410370 = "ขอโทษค่ะขอโทษค่ะขอโทษค่ะ...!"
10141-101410380 = "อยู่ไหนน่ะ ฮารุกะ?"
10141-101410390 = "คะ?"
10141-101410400 = "ฉัน... เอ่อ... อยู่หน้าชาเล่ต์ค่ะ..."
10141-101410410 = "สวัสดีค่ะคุณครู ฉันฮารุกะค่ะ "
10141-101410420 = "ถึงฉันจะไม่ค่อยรู้รสนิยมทางศิลปะ\nของคุณครูเท่าไร"
10141-101410430 = "แต่ก็อยากจะลองถามดูน่ะค่ะว่า\nคุณครูชอบไปพิพิธภัณฑ์ศิลปะมั้ยคะ?"
10141-101410440 = "ไปกันเดี๋ยวนี้เลย"
10141-101410450 = "เอ๋"
10141-101410460 = "แบบว่า... ฉันชวนไปทั้งที่ยังไม่รู้เลย\nด้วยซ้ำ"
10141-101410470 = "ว่าคุณครูจะชอบแนวนี้หรือเปล่า..."
10141-101410480 = "แต่ก็เป็นการไปกับฮารุกะไม่ใช่เหรอ?"
10141-101410490 = "งั้นก็ต้องไปสิ"
10141-101410500 = "หะ"
10141-101410510 = "แหะๆๆๆ"
10141-101410520 = "ขะ..."
10141-101410530 = "ขอบคุณนะคะ"
10141-101410540 = "ขอบคุณค่ะขอบคุณค่ะขอบคุณค่ะ..."
10141-101410550 = "กลับไปถึงหรือยังคะ คุณครู?"
10141-101410560 = "ครูถึงแล้ว"
10141-101410570 = "ฮารุกะก็ถึงที่พักแล้วใช่มั้ย?"
10141-101410580 = "ค่ะ ฉันไปอาบน้ำและเตรียมตัวนอน\nแล้วค่ะ"
10141-101410590 = "วันนี้"
10141-101410600 = "ฉันสนุกมาก"
10141-101410610 = "จริงๆ"
10141-101410620 = "จริงๆ เลยค่ะ"
10141-101410630 = "เพราะงั้น "
10141-101410640 = "ถ้ามีโอกาสแบบนี้อีกในอนาคต "
10141-101410650 = "ฉันขอ..."
10141-101410660 = "ได้อยู่แล้ว"
10141-101410670 = "มาชวนครูได้ตลอดเลยนะ"
10141-101410680 = "...!"
10141-101410690 = "ค่ะ!"
