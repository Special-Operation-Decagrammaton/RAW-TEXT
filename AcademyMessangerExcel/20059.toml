[translation]
20059-200590010 = "咯呵呵～"
20059-200590020 = "啊哈哈～"
20059-200590030 = "今天也是開心的一天呢～"
20059-200590040 = "老師"
20059-200590050 = "老師你覺得我的笑聲怎麼樣？"
20059-200590060 = "可愛嗎？"
20059-200590070 = "有趣嗎？"
20059-200590080 = "很可愛！"
20059-200590090 = "很有趣！"
20059-200590100 = "哼嗯～？這樣啊？"
20059-200590110 = "如果我用不一樣的方式笑，你覺得怎麼樣？"
20059-200590120 = "像是「哦～呵呵呵！」"
20059-200590130 = "或是「呀～哈哈哈！」之類的"
20059-200590140 = "怎麼這麼突然？"
20059-200590150 = "咯呵呵，沒什麼啦"
20059-200590160 = "只是有件事想試試看"
20059-200590170 = "要不要當面聊聊？"
20059-200590180 = "老師！今天來好好玩一場吧！"
20059-200590190 = "練習有順利進行吧？"
20059-200590200 = "練習？"
20059-200590210 = "啊！"
20059-200590220 = "咯呵呵，當然囉！"
20059-200590230 = "總有一天一定能派上用場的"
20059-200590240 = "總有一天？你不是因為工作才練習的嗎？"
20059-200590250 = "啊哈哈哈！"
20059-200590260 = "你該不會當真了吧？"
20059-200590270 = "我只是想跟老師一起玩而已啦"
20059-200590280 = "老師果然很單純呢～"
20059-200590290 = "我，我早就知道了！"
20059-200590300 = "咯呵呵，是哦～"
20059-200590310 = "不過，彼此都玩得很開心不是嗎？"
20059-200590320 = "那就OK啦～"
20059-200590330 = "下次再見囉，老師！"
20059-200590340 = "老師今天要做什麼？"
20059-200590350 = "有空的話，傍晚一起去購物吧"
20059-200590360 = "這次的東西老師應該也會喜歡"
20059-200590370 = "是什麼？"
20059-200590380 = "咯呵呵，那是祕密"
20059-200590390 = "總之你有空對吧？"
20059-200590400 = "那就待會見啦！"
20059-200590410 = "老師，我接下來幾天打算消失一陣子"
20059-200590420 = "所以就算我不在便利屋，你也別嚇到哦"
20059-200590430 = "發生什麼事了嗎？"
20059-200590440 = "上次那群轉賣炸彈的傢伙，你還記得吧"
20059-200590450 = "後來又發生了一些和他們有關的事"
20059-200590460 = "不過也不是什麼大事啦"
20059-200590470 = "只要我消失個幾天就行了"
20059-200590480 = "我也跟大家說過了"
20059-200590490 = "要消失的話，你打算去哪裡？"
20059-200590500 = "嗯……我還沒決定耶"
20059-200590510 = "既然都這樣了"
20059-200590520 = "乾脆在飯店度假享受一下？"
20059-200590530 = "老師！好消息！"
20059-200590540 = "炸彈便利商店又開始賣炸彈了"
20059-200590550 = "終於完全回歸日常的感覺？"
20059-200590560 = "轉賣商消失了，真是太好了呢"
20059-200590570 = "嗯！轉賣商就該被根除！"
20059-200590580 = "啊，對了。你決定好那些錢要拿來做什麼了嗎？"
20059-200590590 = "果然還是要為了和我的未來存起來嗎？"
20059-200590600 = "我，我要拿去捐款！"
20059-200590610 = "啊哈哈！"
20059-200590620 = "嗯！捐款也很好！"
20059-200590630 = "雖然好像做了件不太符合我風格的善事"
20059-200590640 = "不過這樣也別有一番樂趣呢"
20059-200590650 = "希望下次也能發生有趣的事"
20059-200590660 = "對吧？"
20059-200590670 = "嗯，就是說啊"
20059-200590680 = "咯呵呵"
20059-200590690 = "那麼下次再聯絡你！"
20059-200590700 = "老師今天忙嗎？"
20059-200590710 = "沒什麼事的話，要不要跟我一起去玩？"
20059-200590720 = "我有個想去的地方！"
20059-200590730 = "那當然要去啊！"
20059-200590740 = "咯呵呵，我就知道你會這麼說"
20059-200590750 = "那就快點準備吧"
20059-200590760 = "我們現在……"
20059-200590770 = "要去歌劇院！"
