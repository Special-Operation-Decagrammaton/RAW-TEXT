[translation]
20059-200590010 = "ฮุฮุฮุ~"
20059-200590020 = "อะฮะฮ่า~"
20059-200590030 = "วันนี้ก็เป็นอีกวันที่สนุกสนานน้า~"
20059-200590040 = "คุณครู"
20059-200590050 = "คุณครูคิดยังไงกับเสียงหัวเราะของ\nเค้าเหรอ?"
20059-200590060 = "น่ารักมั้ย?"
20059-200590070 = "รื่นหูดีมั้ย?"
20059-200590080 = "น่ารักสิ!"
20059-200590090 = "ก็รื่นหูดีนะ!"
20059-200590100 = "หืม~? งั้นเหรอ?"
20059-200590110 = "แล้วถ้าเค้าหัวเราะแบบอื่น คิดว่าจะ\nเป็นยังไงเหรอ?"
20059-200590120 = "อย่างเช่น โอโฮะโฮะโฮะ~"
20059-200590130 = "หรือว่า ก๊ากฮ่าฮ่าฮ่า~"
20059-200590140 = "จู่ๆ ก็เป็นอะไรไปน่ะ?"
20059-200590150 = "หุหุหุ ไม่มีอะไรหรอก"
20059-200590160 = "เค้าแค่อยากลองทดสอบดูน่ะ"
20059-200590170 = "มาเจอกันมั้ย แล้วเค้าจะเล่าให้ฟัง"
20059-200590180 = "คุณครู! วันนี้สนุกมากเลย!"
20059-200590190 = "ฝึกซ้อมราบรื่นดีมั้ย?"
20059-200590200 = "ฝึกซ้อมเหรอ?"
20059-200590210 = "อ๊ะ!"
20059-200590220 = "ฮุฮุฮุ แน่นอนอยู่แล้ว"
20059-200590230 = "สักวันหนึ่งเค้าน่าจะเอาไปใช้\nประโยชน์ได้นะ"
20059-200590240 = "สักวัน? ไม่ได้ฝึกซ้อมเพราะจะ\nเอาไปทำงานหรอกเหรอ?"
20059-200590250 = "อะฮะฮะฮ่า!"
20059-200590260 = "เชื่อกันจริงๆ เหรอเนี่ย?"
20059-200590270 = "เค้าแค่อยากเล่นสนุกกับคุณครูเฉยๆ\nต่างหาก"
20059-200590280 = "คุณครูเนี่ย ใสซื่อจริงๆ เลยนะ~"
20059-200590290 = "ระ... รู้แล้วหรอกน่า!"
20059-200590300 = "ฮุฮุฮุ ก็ได้"
20059-200590310 = "แต่เราก็สนุกกันทั้งสองฝ่ายนี่นา"
20059-200590320 = "ถือว่า OK แล้วกัน~"
20059-200590330 = "งั้นไว้เจอกันใหม่นะ คุณครู!"
20059-200590340 = "คุณครู วันนี้จะทำอะไรเหรอ?"
20059-200590350 = "ถ้ามีเวลาละก็ ตอนเย็นไปซื้อของ\nด้วยกันมั้ย?"
20059-200590360 = "คุณครูต้องถูกใจของชิ้นนี้ด้วย\nอีกคนแน่ๆ"
20059-200590370 = "มันคืออะไรเหรอ?"
20059-200590380 = "ฮุฮุฮุ เป็นความลับ"
20059-200590390 = "เอาเป็นว่ามีเวลาเนอะ?"
20059-200590400 = "งั้นไว้เจอกันนะ!"
20059-200590410 = "คุณครู เค้าจะไปหลบซ่อนตัวสักพัก"
20059-200590420 = "ถ้าไม่เจอเค้าที่หน่วยรับจ้างสารพัด\nก็ไม่ต้องแปลกใจล่ะ"
20059-200590430 = "เกิดเรื่องอะไรขึ้นเหรอ?"
20059-200590440 = "จำเรื่องกักตุนระเบิดคราวก่อนได้มั้ย?"
20059-200590450 = "พอดีมีเหตุการณ์อื่นตามมานิดๆ\nหน่อยๆ น่ะ"
20059-200590460 = "แต่ก็ไม่ใช่เรื่องใหญ่อะไรหรอก"
20059-200590470 = "เค้าแค่ไปซ่อนตัวไม่กี่วันก็พอแล้ว"
20059-200590480 = "แล้วเค้าก็บอกเพื่อนๆ ในชมรมเอาไว้\nแล้วด้วย"
20059-200590490 = "แล้วจะไปซ่อนตัวที่ไหนเหรอ?"
20059-200590500 = "อืม... ยังไม่ได้คิดไว้เลย"
20059-200590510 = "ในเมื่อเป็นอย่างนี้แล้ว"
20059-200590520 = "ถือโอกาสไปนอนชิลที่โรงแรมดีมั้ย?"
20059-200590530 = "คุณครู! มีข่าวดีมาบอก!"
20059-200590540 = "ร้านระเบิดสะดวกซื้อเริ่มกลับมาขาย\nระเบิดอีกครั้งแล้วละ"
20059-200590550 = "รู้สึกเหมือนได้กลับมาใช้ชีวิตตาม\nปกติเสียทีนะ"
20059-200590560 = "โล่งอกไปทีนะที่ไม่มีผู้ค้ากำไรแล้ว"
20059-200590570 = "อื้อ! พวกที่มากักตุนของน่ะ ต้องกำจัด\nให้หมดเลย!"
20059-200590580 = "อ้อ จริงสิ ตัดสินใจแล้วหรือยังว่าจะ\nใช้เงินไปกับอะไร?"
20059-200590590 = "จะเก็บออมไว้เพื่ออนาคตของเค้า\nใช่ม้า?"
20059-200590600 = "ขะ... ขอเอาไปบริจาคดีกว่า!"
20059-200590610 = "อะฮะฮ่า!"
20059-200590620 = "อื้อ! บริจาคก็ดีเหมือนกัน!"
20059-200590630 = "ถึงจะดูผิดปกติที่เค้ามาทำเรื่องดีๆ"
20059-200590640 = "แต่แบบนี้มันก็สนุกดีไปอีกแบบ"
20059-200590650 = "ต่อไปก็หวังว่าจะมีเรื่องสนุกๆ อีกนะ"
20059-200590660 = "ว่ามั้ย?"
20059-200590670 = "อื้อ ถ้าเป็นแบบนั้นก็ดีเลย"
20059-200590680 = "หุหุหุ"
20059-200590690 = "งั้นไว้จะติดต่อไปใหม่นะ!"
20059-200590700 = "คุณครู วันนี้ยุ่งหรือเปล่า?"
20059-200590710 = "ถ้าไม่มีธุระอะไรละก็ มาเล่นสนุกกับ\nเค้ามั้ยล่ะ?"
20059-200590720 = "เค้ามีที่ที่อยากไปน่ะ!"
20059-200590730 = "งั้นก็ต้องไปด้วยอยู่แล้ว!"
20059-200590740 = "ฮุฮุฮุ กะไว้แล้วเชียวว่าต้องตอบแบบนี้"
20059-200590750 = "ถ้างั้นก็รีบเตรียมตัวเข้านะ"
20059-200590760 = "จากนี้ไป..."
20059-200590770 = "เราจะไปโรงละครโอเปร่ากัน!"
