[translation]
10125-101251000 = "マスター！今日学院に来るって本当ですか？"
10125-101251010 = "うん！何か持って行こうか？"
10125-101251020 = "にゅふふ、今は大丈夫ですぞ"
10125-101251030 = "逆に、私から授けたい品がありまして"
10125-101251040 = "最近、インスピレーションがどかどか湧いて"
10125-101251050 = "世界創造魔法が絶好調なんです！"
10125-101251060 = "まだまだ未熟ではありますが……"
10125-101251070 = "マスターには、ぜひ1枚お渡ししたいなと"
10125-101251080 = "今日はずっとアトリエにいる予定ですので"
10125-101251090 = "よければ会いに来てください！"
10125-101251100 = "楽しみにしてるね！"
10125-101251110 = "マスター、ごめんなさい……"
10125-101251120 = "正気じゃなかったです……"
10125-101251130 = "次にお会いする時は"
10125-101251140 = "いつも通りなので！"
10125-101251150 = "大丈夫だから気にしすぎないで！"
10125-101251160 = "絵、すごく良かったから執務室に飾るね！"
10125-101251170 = "……はい！"
10125-101251180 = "気に入っていただけてよかったです！"
10125-101251190 = "では、またお会いするその日まで！"
