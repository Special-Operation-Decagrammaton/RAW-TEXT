[translation]
10137-101370010 = "คุณครู สวัสดีค่ะ"
10137-101370020 = "ฉันมีชื่อว่าชิมะ โคโนกะค่ะ "
10137-101370030 = "โคโนกะ?!"
10137-101370040 = "ทำไมดูพูดต่างจากปกติล่ะ...?"
10137-101370050 = "คะ?"
10137-101370060 = "ฉันก็พูดแบบนี้อยู่ตลอดไม่ใช่เหรอคะ?"
10137-101370070 = "พอดีดวงประจำวันบอกว่าวันนี้ฉันต้อง\n'แนะนำตัวเองให้ดี'"
10137-101370080 = "ฉันก็เลยทักมาแนะนำตัวเองดูค่ะ"
10137-101370090 = "ไม่บอกไม่รู้เลยนะเนี่ย!"
10137-101370100 = "อะไรกันคะ ฉันอุตส่าห์ตั้งใจ\nอย่าแซวกันแบบนี้สิคะ"
10137-101370110 = "ไว้ถ้ามีเวลา แวะมาที่วัลคิรี่หน่อยนะคะ\nฉันมีงานบริหารที่อยากหารือด้วยค่ะ"
10137-101370120 = "จะเข้ามาตอนไหนก็ได้ เอาตอนที่\nสะดวกเลยค่ะ"
10137-101370130 = "โอย... เผ็ดร้อนลงคอเลยค่ะ"
10137-101370140 = "ตอนนี้เป็นยังไงบ้าง?"
10137-101370150 = "ไม่เป็นไรแล้วค่ะ เรื่องแค่นี้เอง"
10137-101370160 = "โชคดีที่ในตู้เย็นมีนมอยู่ค่ะ"
10137-101370170 = "แล้ว... ได้ดุเด็กคนนั้นไปหรือเปล่า?"
10137-101370180 = "อะไรกัน จะดุทำไมล่ะคะ"
10137-101370190 = "ถ้าฉันเป็นเด็กใหม่ ฉันก็คงทำแบบนั้น\nเหมือนกันค่ะ"
10137-101370200 = "องค์กรจะขับเคลื่อนได้ ก็ต้องมีคนที่มี\nความตั้งใจแบบนี้ละค่ะ"
10137-101370210 = "เยี่ยมเลยนะ สมแล้วที่เป็น\nรองหัวหน้ากรมฯ!"
10137-101370220 = "แล้วฉันก็มีส่วนผิดเหมือนกันค่ะ"
10137-101370230 = "ก็ดวงวันนี้บอกให้ฉันแนะนำตัวให้ดีๆ\nนี่คะ?"
10137-101370240 = "งั้นก็ช่วยไม่ได้หรอกค่ะ ฮ่าฮ่า"
10137-101370250 = "สวัสดีค่ะ คุณครู"
10137-101370260 = "ดวงประจำวันนี้ก็คือ 'การรักษาเวลา' ค่ะ"
10137-101370270 = "แต่เราก็ต้องทำแบบนี้ทุกวันอยู่แล้ว\nไม่ใช่เหรอคะ?"
10137-101370280 = "ก็จริงอยู่หรอก แต่มันก็แอบยากอยู่นะ!"
10137-101370290 = "สิ่งที่รายการดูดวงแนะนำให้ทำคือ\nเรื่องที่ทำในชีวิตประจำวันอยู่แล้วค่ะ"
10137-101370300 = "แต่ถ้าไม่ทำ วันนั้นจะเป็นวันที่ชีวิต\nวุ่นวายเป็นพิเศษเลยค่ะ"
10137-101370310 = "ฉันคิดว่ามันน่าสนุกดี ก็เลยลองส่ง\nMOMOTALK มาน่ะค่ะ"
10137-101370320 = "งั้นวันนี้ก็ขอให้เป็นวันที่ดีนะคะ!"
10137-101370330 = "คุณครู ตกใจใช่มั้ยคะ?"
10137-101370340 = "ดีนะเนี่ยที่ฉันทำตามที่ดวงประจำวัน\nแนะนำตั้งแต่เช้าเลย"
10137-101370350 = "การรักษาเวลา... คือดวงของ\nเมื่อวานไม่ใช่เหรอ?"
10137-101370360 = "หืม?"
10137-101370370 = "อ่า"
10137-101370380 = "ถ้างั้นดวงประจำวันนี้"
10137-101370390 = "\"อย่าให้เวลามาผูกมัดเรามากเกินไป\""
10137-101370400 = "..."
10137-101370410 = "อ่า..."
10137-101370420 = "คุณครู นี่คือเรื่องลับสุดยอดค่ะ"
10137-101370430 = "แต่ตอนนี้น่าจะบอกกับคุณครูได้แล้ว\nละค่ะ"
10137-101370440 = "ฉันจะส่งที่อยู่ไปให้ แล้วไว้เจอกัน\nที่นั่นนะคะ"
10137-101370450 = "สวัสดีค่ะ คุณครู"
10137-101370460 = "ดวงประจำวันนี้บอกว่า \"ต้องมีบัดดี้\" ค่ะ"
10137-101370470 = "งั้นวันนี้คุณครูช่วยมาเป็นบัดดี้ของฉัน\nหน่อยได้มั้ยคะ?"
10137-101370480 = "แล้วฉันจะตั้งตารอนะคะ"
10137-101370490 = "นี่"
10137-101370500 = "วันนี้พี่ไม่สบาย น่าจะไปไม่ไหว"
10137-101370510 = "อย่าสั่งงานนักเรียนเวรเยอะนักล่ะ\nให้เด็กได้พักผ่อนกันบ้าง"
10137-101370520 = "งั้นพี่ไปนอนพักละนะ"
10137-101370530 = "??"
10137-101370540 = "ตอบรองหัวหน้ากรมฯ ว่า ?? เหรอ"
10137-101370550 = "ฉันเปียกฝนมาจนเป็นหวัดทั้งทีนะ"
10137-101370560 = "งั้นไว้เจอกันนะ 55"
10137-101370570 = "ฉันดีขึ้นมากเลย!"
10137-101370580 = "คุณครู กลับไปถึงแล้วหรือยังคะ?"
10137-101370590 = "ไม่ได้ติดหวัดจากฉันไปใช่มั้ยคะ?"
10137-101370600 = "สบายมาก!"
10137-101370610 = "ครูแค่มีไข้ เจ็บคอ แล้วก็อ่อนเพลีย\nเท่านั้นเอง!"
10137-101370620 = "นั่นมันอาการหวัดนี่คะ ไหนบอกว่า\nสบายมากไง"
10137-101370630 = "555"
10137-101370640 = "ครั้งนี้ฉันจะเป็นฝ่ายไปเยี่ยมไข้เองค่ะ"
10137-101370650 = "จะหิ้วทงคตสึราเม็งไปฝากด้วยค่ะ!"
