[translation]
10137-101370010 = "老師，您好"
10137-101370020 = "我是志真木乃香"
10137-101370030 = "木乃香！？"
10137-101370040 = "和平常說話方式不一樣……？"
10137-101370050 = "什麼？"
10137-101370060 = "平常也是這個說話方式不是嗎？"
10137-101370070 = "總之，今天的運勢是「好好自我介紹」"
10137-101370080 = "所以就試著自我介紹了"
10137-101370090 = "不介紹的話差點認不出來！"
10137-101370100 = "哎唷，這樣我會很傷心耶"
10137-101370110 = "算了，如果稍後有空請來一趟女武神，我有行政相關的事務想跟您商量"
10137-101370120 = "隨時過來都沒問題，非常感謝"
10137-101370130 = "哇，這個超辣的"
10137-101370140 = "還好嗎？"
10137-101370150 = "沒事沒事，這不算什麼"
10137-101370160 = "冰箱裡有牛奶真是太好了"
10137-101370170 = "那孩子……不會受到懲處吧？"
10137-101370180 = "怎麼可能"
10137-101370190 = "我當新人的時候也差不多是那樣"
10137-101370200 = "就是要有那種充滿幹勁的人，組織才能運作不是嗎？"
10137-101370210 = "真不愧是副局長！"
10137-101370220 = "而且我也有錯"
10137-101370230 = "按照占卜，我應該要好好自我介紹的"
10137-101370240 = "也只能這樣了，哈哈"
10137-101370250 = "老師，您好"
10137-101370260 = "今天的運勢是「嚴格守時」"
10137-101370270 = "不過守時不是理所當然的嗎？"
10137-101370280 = "雖然是這樣沒錯，實際做起來卻挺難的呢"
10137-101370290 = "確實占卜說要做的事，如果平常也有在做的話會比較好"
10137-101370300 = "反而今天不照做的話，可能會特別不順"
10137-101370310 = "就只是想跟您分享今天的運勢！"
10137-101370320 = "祝老師今天一天順利！"
10137-101370330 = "老師，剛才是不是嚇到您了"
10137-101370340 = "從早上就好好遵循運勢，真讓人舒服呢"
10137-101370350 = "嚴格守時是……昨天的運勢吧？"
10137-101370360 = "咦？"
10137-101370370 = "啊"
10137-101370380 = "今天的運勢是……"
10137-101370390 = "「不要過於被時間束縛」"
10137-101370400 = "……"
10137-101370410 = "啊……"
10137-101370420 = "老師，有個機密情報"
10137-101370430 = "我覺得差不多可以告訴老師了"
10137-101370440 = "我會把地址發過去，就在那裡見吧"
10137-101370450 = "老師，哈囉～"
10137-101370460 = "今天的運勢是「和夥伴一起行動」"
10137-101370470 = "所以說，今天一整天當我的夥伴如何？"
10137-101370480 = "那就拜託囉！"
10137-101370490 = "啊……"
10137-101370500 = "我今天病假"
10137-101370510 = "告訴值班的人，隨便做一做就好"
10137-101370520 = "那我繼續睡了"
10137-101370530 = "？？"
10137-101370540 = "對副局長這樣說話？"
10137-101370550 = "之前出任務被雨淋濕感冒了啦"
10137-101370560 = "那就改天見啦"
10137-101370570 = "完全恢復！"
10137-101370580 = "老師，平安到家了嗎？"
10137-101370590 = "沒被我傳染感冒吧？"
10137-101370600 = "我沒事！"
10137-101370610 = "只是發燒喉嚨痛加上有點累而已！"
10137-101370620 = "那分明是感冒了，怎麼會沒事"
10137-101370630 = "哈哈哈"
10137-101370640 = "這次就換我去探病吧"
10137-101370650 = "我會帶豚骨拉麵過去的！"
