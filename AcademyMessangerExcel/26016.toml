[translation]
26016-260160010 = "★주간 만마전★☞애독자 특별 이벤트!"
26016-260160020 = "함께 기사를 써보자! 지금 당장 신청하세요!"
26016-260160030 = "치아키?"
26016-260160040 = "독자가 기사를 쓰는 게…… 이벤트?"
26016-260160050 = "역시, 의심하시는군요…...."
26016-260160060 = "아아~ 그래요! 인정할게요!"
26016-260160070 = "선생님하고 같이 놀고싶은 핑계에요!"
26016-260160080 = "혼자서 취재하는건 심심하기도 하구…..."
26016-260160090 = "솔직하네…..."
26016-260160100 = "후후, 만마전 정론지 주간 만마전은 진실 빼면 시체니까요!"
26016-260160110 = "그래서 가끔가끔 좀비라는 말을 듣곤 하지만, 중요한 건 아니구!"
26016-260160120 = "그러면, 현장에서 뵙겠습니다!"
26016-260160130 = "낙종해 버렸어요! 치이!"
26016-260160140 = "저번의 그 가게, '우리 주변의 양심가게' 특집기사로 썼는데요,"
26016-260160150 = "마지막 편집 중이었는데, 그 가게가 망해서 없어졌대요!"
26016-260160160 = "그때는 손님들이 그렇게 많았는데, 왤까요?"
26016-260160170 = "흑자도산……?"
26016-260160180 = "식당도 그런 게 있나요?!"
26016-260160190 = "흥미롭네요!"
26016-260160200 = "갑작스럽지만 선생님께서는, 바다라는 것을 아시나요?"
26016-260160210 = "듣기로는, 물이 꽤 많은 곳이라고 합니다!"
26016-260160220 = "바다라면 당연한 거 아니야?!"
26016-260160230 = "맞죠!"
26016-260160240 = "이런 당연한 사실을 띄우는 것만으로도"
26016-260160250 = "벌써 선생님께서 반응! 이게 기사의 흥미 유발이죠!"
26016-260160260 = "과연 물이 많은지, 확인해 보러 가시죠!"
26016-260160270 = "당연히 많겠지만 혹시 모르니까, 좋아!"
26016-260160280 = "귀중한 이야기, 감사했습니다!"
26016-260160290 = "아니였으면 이대로 펑크나는 줄 알았다구요!"
26016-260160300 = "덕분에 살았습니다!"
26016-260160310 = "아무래도, 서기가 단순 기억에 의존하는 것은"
26016-260160320 = "위험하니까요!"
26016-260160330 = "이번 주도 세이-프!"
26016-260160340 = "그런데, 기사가 너무 자극적…… 이던데……."
26016-260160350 = "내가 알려준 것과 다른 것 같은데……."
26016-260160360 = "그건 팩트에 기반해서 흥미롭게 편집한 거죠!"
26016-260160370 = "덕분에 화제가 되었습니다!"
26016-260160380 = "선생님 최고!"
26016-260160390 = "<주간 만마전>"
26016-260160400 = "지금 바로 구독하세요……."
26016-260160410 = "이미 구독은 하고 있는데?"
26016-260160420 = "평소보다 기운이 없는 홍보 문자?!"
26016-260160430 = "흐이잉잉……."
26016-260160440 = "기삿거리가 도저히 떠오르질 않아서요"
26016-260160450 = "재밌는 일도 없고"
26016-260160460 = "역시, 저 스스로를 기삿거리로 만드는 수밖에……."
26016-260160470 = "뭔지 몰라도 일단 스톱!"
26016-260160480 = "특종이 있을법한 곳에서 산책이라도 해보자!"
26016-260160490 = "오?"
26016-260160500 = "오오!"
26016-260160510 = "그걸 생각 못 했네요!"
26016-260160520 = "역시, 답은 현장에 있겠죠!"
26016-260160530 = "그러면 현장에서 뵙겠습니다아-!"
26016-260160540 = "당연히 나까지?!"
26016-260160550 = "선생님선생님선생님!"
26016-260160560 = "짜짜잔-!"
26016-260160580 = "이번 주 주간 만마전, 역대 최대 부수에요!"
26016-260160590 = "마코토 선배도 대단하다면서, 올해의 기자상 후보에 올리겠대요."
26016-260160600 = "저밖에 기자가 없긴 하지만, 중요한 건 아니고!"
26016-260160610 = "덕분에 특종을 잡았습니다!"
26016-260160620 = "잘됐네!"
26016-260160630 = "다음에도 잘 부탁드리겠습니다아-!"
26016-260160640 = "들고 간 다시마는 어떻게 했어?"
26016-260160650 = "주방에 갖다줘서 다시마 초절임으로 만들었어요."
26016-260160660 = "보관하기도 힘드니까요!"
26016-260160670 = "소중하게 보관하는 게 아니었네?!"
26016-260160680 = "여름 특집 기사도 마무리 교정 단계!"
26016-260160690 = "이번에는 데스크가 아니라 현장에서 마무리할까 합니다!"
26016-260160700 = "현장의 감흥을 그대로 녹여낸달까!"
26016-260160710 = "그렇게 됐으니, 바다의 집으로 와주실래요?"
26016-260160720 = "같이 일하시죠!"
26016-260160730 = "어……."
26016-260160740 = "그러니까요 선생님."
26016-260160750 = "아, 아니에요!!"
26016-260160760 = "할 말 까먹었어요!"
26016-260160770 = "그런걸로, 그런걸로!"
