[translation]
26016-260160010 = "★週刊萬魔殿★☞讀者限定特別活動！"
26016-260160020 = "一起來寫報導吧！現在立刻報名！"
26016-260160030 = "千秋？"
26016-260160040 = "讓讀者來寫報導……這算活動？"
26016-260160050 = "果然，你在懷疑吧……"
26016-260160060 = "啊啊～好啦！我承認！"
26016-260160070 = "這只是想跟老師一起玩的藉口！"
26016-260160080 = "而且一個人採訪也很無聊……"
26016-260160090 = "還真坦白……"
26016-260160100 = "呵呵，萬魔殿的正統刊物《週刊萬魔殿》，少了真相就什麼都不是！"
26016-260160110 = "雖然偶爾會被叫做殭屍，但那不重要！"
26016-260160120 = "那麼，現場見！"
26016-260160130 = "稿子泡湯了！嘖！"
26016-260160140 = "上次那家店，我寫成「我們身邊的良心店家」專題報導，"
26016-260160150 = "結果編輯到最後，聽說那家店倒閉了！"
26016-260160160 = "當時明明有那麼多客人，為什麼呢？"
26016-260160170 = "獲利倒閉……？"
26016-260160180 = "餐廳也會發生這種事嗎？！"
26016-260160190 = "真有意思！"
26016-260160200 = "雖然很突然，老師知道什麼是大海嗎？"
26016-260160210 = "聽說那是個水很多的地方！"
26016-260160220 = "那不是大海本來就該有的嗎？！"
26016-260160230 = "沒錯！"
26016-260160240 = "只要刻意拋出這種理所當然的事實，"
26016-260160250 = "老師馬上就有反應了！這就是報導吸引興趣的技巧！"
26016-260160260 = "水是不是真的很多，就去確認看看吧！"
26016-260160270 = "雖然一定很多，但說不定呢，好！"
26016-260160280 = "謝謝你提供寶貴的故事！"
26016-260160290 = "不然我還以為這次真的要開天窗了！"
26016-260160300 = "多虧你，救了我一命！"
26016-260160310 = "果然，書記只依賴記憶"
26016-260160320 = "還是很危險的！"
26016-260160330 = "這週也平安過關！"
26016-260160340 = "可是，那篇報導也太刺激了點……"
26016-260160350 = "感覺跟我告訴你的不太一樣……"
26016-260160360 = "那是以事實為基礎，再編輯得更有趣啊！"
26016-260160370 = "多虧如此，現在可是話題十足！"
26016-260160380 = "老師最棒了！"
26016-260160390 = "《週刊萬魔殿》"
26016-260160400 = "現在立刻訂閱吧……"
26016-260160410 = "我已經訂閱了啊？"
26016-260160420 = "比平常沒精神的宣傳訊息？！"
26016-260160430 = "嗚嗚……"
26016-260160440 = "我怎麼樣都想不到報導題材。"
26016-260160450 = "也沒有什麼有趣的事，"
26016-260160460 = "看來只好把我自己變成報導題材了……"
26016-260160470 = "雖然不知道你想做什麼，總之先住手！"
26016-260160480 = "要不要去可能有獨家新聞的地方散散步？"
26016-260160490 = "喔？"
26016-260160500 = "喔喔！"
26016-260160510 = "我居然沒想到這招！"
26016-260160520 = "果然答案就在現場！"
26016-260160530 = "那麼，現場見啦──！"
26016-260160540 = "連我也得去嗎？！"
26016-260160550 = "老師老師老師！"
26016-260160560 = "鏘鏘──！"
26016-260160580 = "本週《週刊萬魔殿》的發行量創下歷史新高！"
26016-260160590 = "真琴前輩也說很厲害，要提名我角逐今年的記者獎。"
26016-260160600 = "雖然記者只有我一個，但那不重要！"
26016-260160610 = "多虧老師，我抓到獨家新聞了！"
26016-260160620 = "太好了！"
26016-260160630 = "下次也請多多指教啦──！"
26016-260160640 = "你帶走的昆布後來怎麼了？"
26016-260160650 = "我拿去廚房做成醋昆布了。"
26016-260160660 = "畢竟也很難保存！"
26016-260160670 = "原來不是要珍藏起來嗎？！"
26016-260160680 = "夏季專題報導也進入最後校稿階段！"
26016-260160690 = "這次我打算不在編輯桌前，而是在現場完成！"
26016-260160700 = "應該說要把現場的感受原汁原味地融入其中！"
26016-260160710 = "所以，你能來海之家嗎？"
26016-260160720 = "一起工作吧！"
26016-260160730 = "那個……"
26016-260160740 = "我是說，老師。"
26016-260160750 = "啊、沒事！！"
26016-260160760 = "我忘記要說什麼了！"
26016-260160770 = "就這樣、就這樣！"
