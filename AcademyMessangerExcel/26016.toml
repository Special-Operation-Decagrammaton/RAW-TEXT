[translation]
26016-260160010 = "★ Weekly Pandemonium Society ★☞ Special Subscriber Event!"
26016-260160020 = "Let's write an article together! Sign up now!"
26016-260160030 = "Chiaki?"
26016-260160040 = "Having a reader write an article...is an event?"
26016-260160050 = "So it does indeed sound suspicious."
26016-260160060 = "Fine! I'll 'fess up!"
26016-260160070 = "I just wanted an excuse to play with you!"
26016-260160080 = "It's get boring, covering stories all by myself..."
26016-260160090 = "At least you're honest..."
26016-260160100 = "Fufu, as Pandemonium Society's reputable journal, Weekly Pandemonium Society thrives on TRUTH!"
26016-260160110 = "Which has led people to start calling it a zombie, but that's beside the point!"
26016-260160120 = "I'll be seeing you on site then!"
26016-260160130 = "I missed the deadline! Tch!"
26016-260160140 = "I used the store we visited for my \"Ethical Businesses in the Neighborhood\" special."
26016-260160150 = "And just when I was wrapping on the story, it went out of business!"
26016-260160160 = "They had so many customers when we went! What happened?"
26016-260160170 = "A surplus bankruptcy...?"
26016-260160180 = "That can happen to food places too??"
26016-260160190 = "I had no idea!"
26016-260160200 = "This is out of the blue, but do you know what the \"ocean\" is, Sensei?"
26016-260160210 = "I heard it's a place with a TON of water!"
26016-260160220 = "That's the literal definition!"
26016-260160230 = "You're right!"
26016-260160240 = "I got a reaction out of you, didn't I?"
26016-260160250 = "I hooked you by highlighting an obvious fact! Articles work the same way!"
26016-260160260 = "So let's go see whether or not it's true!"
26016-260160270 = "I hope it is! But let's check, just in case!"
26016-260160280 = "Thank you for your precious story!"
26016-260160290 = "Everything would've fallen apart without it!"
26016-260160300 = "You saved me!"
26016-260160310 = "As a secretary, relying on just memories"
26016-260160320 = "is just asking for trouble!"
26016-260160330 = "I'm safe for another week!"
26016-260160340 = "By the way, the article was...quite provocative..."
26016-260160350 = "I feel like some things were taken out of context..."
26016-260160360 = "I edited the facts to present them in a more engaging format!"
26016-260160370 = "That's how we ended up going viral!"
26016-260160380 = "Thanks so much, Sensei!"
26016-260160390 = "Weekly Pandemonium Society"
26016-260160400 = "Subscribe now..."
26016-260160410 = "But I'm already subscribed?!"
26016-260160420 = "What is this energy?!"
26016-260160430 = "Waah..."
26016-260160440 = "I have total and complete writer's block."
26016-260160450 = "There's not a single interesting thing to write about."
26016-260160460 = "When there is no news, I just have to make the news..."
26016-260160470 = "Whatever you're thinking, stop right there!"
26016-260160480 = "You should go for a walk somewhere with a lot of activity!"
26016-260160490 = "Oh?"
26016-260160500 = "Oh!"
26016-260160510 = "How have I never thought of that before?!"
26016-260160520 = "Of course! There are always answers out in the field!"
26016-260160530 = "I'll see you on site then, Sensei!"
26016-260160540 = "Me too?!"
26016-260160550 = "SenseiSenseiSensei!"
26016-260160560 = "Ta-da!"
26016-260160580 = "This week's Weekly Pandemonium Society had the largest print run ever!"
26016-260160590 = "Makoto said she was proud of me. She's going to nominate me for reporter of the year!"
26016-260160600 = "I'm the only reporter at Gehenna, but still!"
26016-260160610 = "This is all thanks to you helping me find a scoop!"
26016-260160620 = "Congratulations!"
26016-260160630 = "So I'll count on you next time too, okay?"
26016-260160640 = "What did you do with the kelp you took with you?"
26016-260160650 = "I took it to the school kitchen, and they pickled it!"
26016-260160660 = "There's not a lot of places to store kelp in my dorm room, after all!"
26016-260160670 = "You weren't planning on keeping the whole thing with you?!"
26016-260160680 = "The summer special article is finally in its polish stage!"
26016-260160690 = "I want to be on site when I wrap this one up!"
26016-260160700 = "The vibes are important for something like this."
26016-260160710 = "Sooo, would you come meet me at the beach shack?"
26016-260160720 = "We can work together!"
26016-260160730 = "Uh..."
26016-260160740 = "So, Sensei."
26016-260160750 = "N-Nevermind!"
26016-260160760 = "I forgot what I was going to say!"
26016-260160770 = "Yeah, let's just leave it as that!"
