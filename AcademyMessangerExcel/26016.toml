[translation]
26016-260160010 = "★แพนเดโมเนียม โซไซตี้รายสัปดาห์\n★☞อีเวนต์พิเศษสำหรับผู้อ่านตัวยง!"
26016-260160020 = "มาร่วมเขียนบทความกันเถอะ!\nสมัครเลยตอนนี้!"
26016-260160030 = "จิอากิ?"
26016-260160040 = "อีเวนต์ที่... ให้ผู้อ่านเป็นคนเขียน\nบทความเหรอ?"
26016-260160050 = "คุณครูสงสัยจริงๆ ด้วยสินะคะ..."
26016-260160060 = "อ่าา~ ใช่แล้วค่ะ! ฉันยอมรับก็ได้!"
26016-260160070 = "นี่เป็นข้ออ้างค่ะ ฉันอยากไปเที่ยวเล่น\nกับคุณครูต่างหาก!"
26016-260160080 = "ไปเก็บข้อมูลคนเดียวมันเหงานี่นา..."
26016-260160090 = "จริงใจดีนะ..."
26016-260160100 = "ฮุฮุ ก็แพนเดโมเนียม โซไซตี้\nรายสัปดาห์เป็นสิ่งพิมพ์สายจริงจังของเรา\nถ้าตัดความจริงออกไปก็เหลือแต่ซากค่ะ!"
26016-260160110 = "บางครั้งฉันก็เลยถูกเรียกว่าซอมบี้\nแต่เรื่องนั้นไม่สำคัญหรอก!"
26016-260160120 = "ถ้างั้น ไว้เจอกันที่นั่นเลยนะคะ!"
26016-260160130 = "อดได้เรื่องมาเขียนบทความเลยค่ะ!\nฮึ่ม!"
26016-260160140 = "ร้านนั้นเมื่อคราวก่อนน่ะ เขียนลงเป็น\nบทความพิเศษ 'ร้านซื่อสัตย์รอบตัวเรา'\nไปแล้วค่ะ"
26016-260160150 = "กำลังตรวจแก้รอบสุดท้ายอยู่แล้วแท้ๆ\nแต่ได้ยินว่าร้านนั้นเจ๊งจนปิดตัวไปแล้วค่ะ!"
26016-260160160 = "ตอนนั้นลูกค้าก็ออกจะเยอะ\nทำไมกันนะคะ?"
26016-260160170 = "ปิดกิจการทั้งที่ยังมีกำไรหรือเปล่า...?"
26016-260160180 = "ร้านอาหารก็มีแบบนั้นด้วยเหรอคะ?!"
26016-260160190 = "น่าสนใจนะคะ!"
26016-260160200 = "กะทันหันหน่อยนะคะ แต่... คุณครูรู้จัก\nสถานที่ที่เรียกว่าทะเลมั้ยคะ?"
26016-260160210 = "เท่าที่ฉันได้ยินมา เป็นที่ที่มีน้ำเยอะ\nมากค่ะ!"
26016-260160220 = "ทะเลก็ต้องเป็นแบบนั้นอยู่แล้ว\nไม่ใช่เหรอ?!"
26016-260160230 = "ใช่มั้ยคะ!"
26016-260160240 = "เพียงแค่ชูข้อเท็จจริงธรรมดาแบบนี้\nขึ้นมา"
26016-260160250 = "คุณครูก็สนใจแล้ว! นี่ละค่ะเทคนิค\nเรียกความสนใจของบทความ!"
26016-260160260 = "ไปตรวจสอบกันเถอะค่ะว่าน้ำเยอะจริง\nหรือเปล่า!"
26016-260160270 = "ก็คงเยอะอยู่แล้ว แต่เผื่อไว้ก่อน\nไปกันเถอะ!"
26016-260160280 = "ขอบคุณสำหรับเรื่องราวล้ำค่านะคะ!"
26016-260160290 = "นึกว่าจะงานล่มทั้งอย่างนี้เสียแล้วค่ะ!"
26016-260160300 = "ฉันรอดมาได้เพราะคุณครูเลยค่ะ!"
26016-260160310 = "จะว่าไปแล้ว การที่เลขาอาศัยแต่\nความจำอย่างเดียว"
26016-260160320 = "มันก็เสี่ยงเกินไปค่ะ!"
26016-260160330 = "สัปดาห์นี้ก็รอดมาได้!"
26016-260160340 = "แต่ว่า บทความมันเร้าอารมณ์เกินไป...\nหน่อยนะ..."
26016-260160350 = "รู้สึกว่ามันต่างจากที่ครูบอกไปเลย..."
26016-260160360 = "นั่นคือการเรียบเรียงให้น่าสนใจ\nโดยอิงจากข้อเท็จจริงค่ะ!"
26016-260160370 = "ถึงได้กลายเป็นกระแสไงคะ!"
26016-260160380 = "คุณครูสุดยอดเลย!"
26016-260160390 = "<แพนเดโมเนียม โซไซตี้รายสัปดาห์>"
26016-260160400 = "สมัครสมาชิกเลยตอนนี้..."
26016-260160410 = "ก็สมัครอยู่แล้วนะ?"
26016-260160420 = "ข้อความโฆษณาที่ฟังดูไร้เรี่ยวแรง?!"
26016-260160430 = "ฮือออ..."
26016-260160440 = "หาเรื่องมาเขียนบทความไม่ออก\nเลยค่ะ"
26016-260160450 = "เรื่องสนุกๆ ก็ไม่มี"
26016-260160460 = "คงเหลือทางเดียว คือเอาตัวเองไป\nเป็นข่าวเสียเอง..."
26016-260160470 = "ถึงจะไม่รู้ว่าอะไร แต่หยุดก่อน!"
26016-260160480 = "ไปเดินเล่นแถวๆ ที่ที่น่าจะหาสกู๊ป\nพิเศษได้ดูสิ!"
26016-260160490 = "โอ๊ะ?"
26016-260160500 = "โอ้วว!"
26016-260160510 = "คิดเรื่องนั้นไม่ถึงเลยค่ะ!"
26016-260160520 = "จริงด้วย คำตอบย่อมอยู่ที่หน้างาน\nนี่แหละ!"
26016-260160530 = "งั้นไว้เจอกันที่นั่นนะคะ!"
26016-260160540 = "ครูต้องไปด้วยเหรอ?!"
26016-260160550 = "คุณครู คุณครู คุณครู!"
26016-260160560 = "แต่นแต๊นน!"
26016-260160580 = "แพนเดโมเนียม โซไซตี้รายสัปดาห์\nฉบับนี้ ยอดพิมพ์สูงสุดเป็นประวัติการณ์\nเลยค่ะ!"
26016-260160590 = "รุ่นพี่มาโคโตะยังบอกว่ายอดเยี่ยม\nและจะเสนอชื่อเข้าชิงรางวัลนักข่าว\nแห่งปีด้วยค่ะ"
26016-260160600 = "ถึงจะมีนักข่าวแค่ฉันคนเดียวก็เถอะ\nแต่นั่นไม่สำคัญ!"
26016-260160610 = "คุณครูช่วยให้ฉันได้สกู๊ปพิเศษมาค่ะ!"
26016-260160620 = "ดีเลยนะ!"
26016-260160630 = "ครั้งหน้าก็ฝากด้วยนะคะ!"
26016-260160640 = "แล้วทำยังไงกับสาหร่ายคอมบุ\nที่เอากลับไปด้วยเหรอ?"
26016-260160650 = "เอาไปให้ห้องครัวทำเป็นสาหร่าย\nดองน้ำส้มแล้วค่ะ"
26016-260160660 = "ก็มันเก็บรักษายากนี่คะ!"
26016-260160670 = "ไม่ได้เก็บไว้อย่างทะนุถนอมสินะ?!"
26016-260160680 = "บทความพิเศษฤดูร้อนก็เข้าสู่ขั้น\nตรวจแก้สุดท้ายแล้วค่ะ!"
26016-260160690 = "คราวนี้ฉันว่าจะไม่จบที่โต๊ะทำงาน\nแต่ไปจบที่หน้างานค่ะ!"
26016-260160700 = "ประมาณว่าใส่ความรู้สึกจากหน้างาน\nลงไปทั้งอย่างนั้น!"
26016-260160710 = "เพราะงั้น ช่วยมาที่ร้านริมทะเล\nได้มั้ยคะ?"
26016-260160720 = "มาทำงานด้วยกันเถอะค่ะ!"
26016-260160730 = "เอ่อ..."
26016-260160740 = "ก็นั่นละค่ะ คุณครู"
26016-260160750 = "อ๊ะ ไม่ใช่ค่ะ!!"
26016-260160760 = "ฉันลืมไปแล้วว่าจะพูดอะไร!"
26016-260160770 = "เอาเป็นแบบนั้นแล้วกัน แบบนั้นแหละ"
