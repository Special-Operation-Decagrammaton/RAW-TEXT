[translation]
10146-101460010 = "先生に朗報だ"
10146-101460020 = "マコト様が特別な映像を用意した"
10146-101460030 = "どんな内容だと思う？"
10146-101460040 = "気になって、居ても立っても居られないだろう！？"
10146-101460050 = "えっと……何の話？"
10146-101460060 = "気になる！！！"
10146-101460070 = "キシシッ"
10146-101460080 = "万魔殿で待っているぞ"
10146-101460090 = "喜ぶがいい"
10146-101460100 = "マコト様の偉大なる第一歩を、その目に焼き付ける栄誉を得られることに！"
10146-101460110 = "マコト様に名案がある"
10146-101460120 = "あれから、じっくり考えてな……素晴らしい考えが浮かんだのだ"
10146-101460130 = "これは重大な案件だ。モモトークではなく、直接話したい"
10146-101460140 = "すぐに迎えを送ろう！"
10146-101460150 = "大丈夫、自分で行くよ"
10146-101460160 = "リムジンは必要ないよ……"
10146-101460170 = "ん？"
10146-101460180 = "キシシッ！先生は察しが良いな"
10146-101460190 = "たしかに、慎重に事を進めねばならないな……"
10146-101460200 = "私としたことが先生に一刻も早く伝えることしか考えていなかったようだ"
10146-101460210 = "では待っているぞ！"
10146-101460220 = "水着姿で！"
10146-101460230 = "なんで水着！？"
10146-101460240 = "風邪引いちゃうよ"
10146-101460250 = "やはり"
10146-101460260 = "マコト様だな"
10146-101460270 = "先生よ"
10146-101460280 = "やっと、己の感情の正体が分かったぞ"
10146-101460290 = "そして――完璧な言語化にも成功した"
10146-101460300 = "おお！それで？"
10146-101460310 = "その感情って何だったの？"
10146-101460320 = "…………"
10146-101460330 = "それは秘密だ！"
10146-101460340 = "シャーレの先生よ"
10146-101460350 = "を！？"
10146-101460360 = "どえしたの！？"
10146-101460370 = "……どうしたんだ？"
10146-101460380 = "ところで水着モデルの件だが"
10146-101460390 = "ああ、その話か"
10146-101460400 = "忘れてた……"
10146-101460410 = "詳細を改めて連絡する"
10146-101460420 = "ぜひ見にきてもらいたい"
