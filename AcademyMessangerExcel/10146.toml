[translation]
10146-101460010 = "선생이여."
10146-101460020 = "이 마코토 님께서 특별히 영상을 준비했다."
10146-101460030 = "그게 무엇인지……."
10146-101460040 = "아마 궁금해서 팔짝 뛸 지경이겠지?!"
10146-101460050 = "갑자기 또 무슨 소리를……?"
10146-101460060 = "궁금하다!!!"
10146-101460070 = "키시싯."
10146-101460080 = "만마전 부실에서 기다리고 있으마."
10146-101460090 = "각오하는 것이 좋아."
10146-101460100 = "아주 특별한 것을 보게 될 테니까 말이다!"
10146-101460110 = "샬레의 선생이여."
10146-101460120 = "저번 만남 이후로, 오랜 고민 끝에 마침내 명안을 떠올렸다."
10146-101460130 = "이렇게 중대한 깨달음을 모모톡으로 전하는 것은 볼품없는 일이겠지."
10146-101460140 = "지금 당장 의전을 보내 맞이하겠다!"
10146-101460150 = "괜찮아. 직접 갈게."
10146-101460160 = "리무진은 필요 없으니까……."
10146-101460170 = "음?"
10146-101460180 = "과연, 선생! 명철한 판단이다!"
10146-101460190 = "이번 일은 극비리에 진행되어야 한다, 그렇게 말하고 싶은 건가?"
10146-101460200 = "마코토 님답지 않게 서둘러 일을 그르칠 뻔했군!"
10146-101460210 = "그러면 이 몸은 선생이 방문하기를 기다리고 있으마!"
10146-101460220 = "수영복 차림으로!"
10146-101460230 = "평범하게 옷 입고 기다려……."
10146-101460240 = "감기 걸려도 모른다……."
10146-101460250 = "과연."
10146-101460260 = "역시나 이 몸이군."
10146-101460270 = "선생이여."
10146-101460280 = "저번 만남 이후, 이 몸은 스스로 감정의 정체를 깨달았다."
10146-101460290 = "그리고 완벽하게 언어화하는 데에도 성공했지!"
10146-101460300 = "오오! 그래서?"
10146-101460310 = "그 감정은 뭐야?"
10146-101460320 = "…................."
10146-101460330 = "그건 비밀이다!"
10146-101460340 = "샬레의 선생이여."
10146-101460350 = "ㄴ네?!"
10146-101460360 = "무스 ㄴ일?!"
10146-101460370 = "……뭐냐, 그 얼빠진 반응은?"
10146-101460380 = "저번에 말했던 모델 일 말이다."
10146-101460390 = "아, 아아, 그거구나."
10146-101460400 = "깜빡하고 있었다……."
10146-101460410 = "음, 일자와 장소가 확정되어서 말이다."
10146-101460420 = "부디 참관해 주길 바란다."
