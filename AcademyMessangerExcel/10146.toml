[translation]
10146-101460010 = "ครู"
10146-101460020 = "ท่านมาโคโตะผู้นี้เตรียมวิดีโอเอาไว้\nเป็นพิเศษเลย"
10146-101460030 = "วิดีโออะไร..."
10146-101460040 = "อยากรู้จนแทบทนไม่ไหวแล้วสินะ?!"
10146-101460050 = "จู่ๆ ก็มาพูดอะไรอีกแล้ว...?"
10146-101460060 = "อยากรู้สิ!!!"
10146-101460070 = "คิกคิกคิก"
10146-101460080 = "เราจะรออยู่ที่ห้องชมรม\nแพนเดโมเนียม โซไซตี้"
10146-101460090 = "เตรียมใจไว้ให้ดีล่ะ"
10146-101460100 = "เพราะครูจะได้เห็นของที่พิเศษสุดๆ\nไปเลย!"
10146-101460110 = "ครูจากชาเล่ต์"
10146-101460120 = "หลังจากเจอกันครั้งก่อน เราก็ไปคิด\nอยู่นาน จนในที่สุดก็คิดแผนการ\nอันยอดเยี่ยมออก"
10146-101460130 = "แต่การบอกเรื่องสำคัญเช่นนี้ผ่าน\nMOMOTALK คงดูไม่สง่างามนัก"
10146-101460140 = "เราจะส่งขบวนพิธีการไปรับเดี๋ยวนี้!"
10146-101460150 = "ไม่เป็นไร ครูไปเอง"
10146-101460160 = "ไม่ต้องส่งรถลีมูซีนมาหรอก..."
10146-101460170 = "หืม?"
10146-101460180 = "สมแล้วที่เป็นครู! ช่างเป็นการตัดสินใจ\nอันปราดเปรื่อง!"
10146-101460190 = "อยากให้ดำเนินการเรื่องนี้อย่าง\nลับสุดยอดสินะ?"
10146-101460200 = "ไม่สมกับเป็นท่านมาโคโตะเลย\nเกือบรีบจนทำเสียเรื่องแล้วสินะ!"
10146-101460210 = "ถ้างั้นเราจะรอให้ครูมาเยือน!"
10146-101460220 = "ในชุดว่ายน้ำ!"
10146-101460230 = "รอแบบใส่ชุดปกติเถอะ..."
10146-101460240 = "ถ้าเป็นหวัดขึ้นมา ครูไม่รู้ด้วยนะ..."
10146-101460250 = "อย่างนี้สินะ"
10146-101460260 = "สมแล้วที่เป็นเรา"
10146-101460270 = "ครู"
10146-101460280 = "หลังจากพบกันครั้งก่อน เราก็เข้าใจ\nแก่นแท้ของความรู้สึกนี้ได้ด้วยตัวเองแล้ว"
10146-101460290 = "และยังถ่ายทอดออกมาเป็นถ้อยคำได้\nอย่างสมบูรณ์แบบด้วย!"
10146-101460300 = "โอ้! แล้วไงต่อ?"
10146-101460310 = "ความรู้สึกนั้นคืออะไรเหรอ?"
10146-101460320 = "........."
10146-101460330 = "คือความลับ!"
10146-101460340 = "ครูจากชาเล่ต์"
10146-101460350 = "ว่ าไง?!"
10146-101460360 = "เกิ ดอะไรขึ้น?!"
10146-101460370 = "อะไรกัน ทำไมพิมพ์แปลกๆ แบบนั้น?"
10146-101460380 = "เรื่องงานนางแบบที่เราเคยพูดไว้\nคราวก่อนน่ะ"
10146-101460390 = "อ่า อ๋อ เรื่องนั้นเอง"
10146-101460400 = "ลืมไปแล้วนะเนี่ย..."
10146-101460410 = "อื้อ วันเวลาและสถานที่กำหนด\nเรียบร้อยแล้ว"
10146-101460420 = "หวังว่าครูจะมาดูด้วยนะ"
