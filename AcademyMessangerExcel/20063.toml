[translation]
20063-200630010 = "당소 펭귄"
20063-200630020 = "오리, 응답하라."
20063-200630030 = "만나고 싶다."
20063-200630040 = "당소 오리, 수신했다."
20063-200630050 = "좌표 요청한다."
20063-200630060 = "펭귄, 감도 양호."
20063-200630070 = "선수촌 야외 제2주차장이야."
20063-200630080 = "좌표가 아니네……?!"
20063-200630090 = "더 확실한 참고점이 있으면 좌표는 필요 없어."
20063-200630100 = "그럼 거기서 보자."
20063-200630110 = "펭귄 아웃, 통신 종료."
20063-200630120 = "당소 펭귄, 오리 응답하라."
20063-200630130 = "안녕 펭귄!"
20063-200630140 = "펭귄 안녕!"
20063-200630150 = "좋아, 연결 상태 이상 없네."
20063-200630160 = "오늘 도와줘서 고마워."
20063-200630170 = "그리고"
20063-200630180 = "고마워."
20063-200630190 = "평범한 하루를 알려줘서."
20063-200630200 = "펭귄 아웃."
20063-200630210 = "선생님, 오늘 시간 괜찮을까?"
20063-200630220 = "물건을 좀 사러 가야 하는데,"
20063-200630230 = "전문가의 도움이 필요해."
20063-200630240 = "물건 사는 건 내가 전문가지!"
20063-200630250 = "선생님이 도와줄게!"
20063-200630260 = "그러면 주차장에서 보자."
20063-200630270 = "야외 제1주차장 A113번 자리야."
20063-200630280 = "통신 종료."
20063-200630290 = "선생님은 항상 현명해."
20063-200630300 = "덕분에 스컬맨도 외롭지 않고, 향도 독하지 않게 됐어."
20063-200630310 = "나는 고작 치약을 바르는 것밖에 생각하지 못했어."
20063-200630320 = "아즈사도 외롭지 않겠지?"
20063-200630330 = "물론이지."
20063-200630340 = "……선생님 덕분이야."
20063-200630350 = "고마워, 펭귄 아웃."
20063-200630360 = "선생님은 델타 탱고가 뭔지 알아?"
20063-200630370 = "지금부터 갈 예정이야."
20063-200630380 = "델타 탱고……? 춤인가?"
20063-200630390 = "자세한 건 현지에서 확인하자."
20063-200630400 = "어려움이 예상돼."
20063-200630410 = "지원 부탁할게."
20063-200630420 = "오케이……?"
20063-200630430 = "어떻게 될지 예상하기가 힘들어."
20063-200630440 = "혹시 모르니 전차로 가자."
20063-200630450 = "합류지점으로 와."
20063-200630460 = "통신 종료."
20063-200630470 = "선생님, 어쩌지."
20063-200630480 = "또 델타 탱고에 가고 싶어졌어."
20063-200630490 = "함께 가기로 약속했던 것 같은데,"
20063-200630500 = "다음엔 언제 갈 수 있어?"
20063-200630510 = "언제든지 아즈사가 부른다면!"
20063-200630520 = "좋아, 바로 가자."
20063-200630530 = "이번에도 주문은 내가 할게."
20063-200630540 = "수신 종료."
20063-200630550 = "선생님, 나야."
20063-200630560 = "안녕, 다람쥐!"
20063-200630570 = "아. 음어."
20063-200630580 = "나는 다람쥐인가, 그러면 선생님은 도토리로 하자."
20063-200630590 = "도토리, 다른 게 아니라 도움이 필요해."
20063-200630600 = "이번에 SSE의 일환으로 PSR의 IMINT가 필요해."
20063-200630610 = "비정규 절차라서 익숙하지 않다 보니 선생님이 도와주었으면 좋겠어."
20063-200630620 = "PS…… 응?"
20063-200630630 = "자세한 건 현장에서. SV가 시급해. "
20063-200630640 = "다람쥐, 아웃."
20063-200630650 = "선생님,"
20063-200630660 = "이제 괜찮아졌어."
20063-200630670 = "곁에 있어 줘서 고마워."
20063-200630680 = "오늘만이 아니라, 지금까지 계속……."
20063-200630690 = "아즈사의 곁에 항상 있을게!"
20063-200630700 = "그런데, 음어는 사용하지 않아도 괜찮아?"
20063-200630710 = "음어, 말이지."
20063-200630720 = "평문에서는 음어를 사용하지 않아도 괜찮은 경우가 있어."
20063-200630730 = "그리고"
20063-200630740 = "'보통'은 쓰지 않을 테니까."
20063-200630750 = "그러니까 아즈사로 충분해."
20063-200630760 = "다음에 보자, 선생님."
