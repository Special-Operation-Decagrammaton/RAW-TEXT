[translation]
16020-160200010 = "您好，請問這是夏萊的老師的電話嗎？"
16020-160200020 = "是……？"
16020-160200030 = "我從以前就一直很希望能和老師單獨見一次面"
16020-160200040 = "不知道今天傍晚，您願不願意到失落之路的4號巷子來呢？"
16020-160200050 = "如果晚上8點以後也可以的話……"
16020-160200060 = "抽出一點時間應該不難"
16020-160200070 = "不對不對！"
16020-160200080 = "老師，你怎麼若無其事地就接受這種可疑的邀約啊？"
16020-160200090 = "陌生人突然搭話的時候，至少先懷疑一下會比較好哦"
16020-160200100 = "說不定是想接近老師，套取情報的可疑傢伙呢？"
16020-160200110 = "……咦？"
16020-160200120 = "你該不會誤以為……這是可愛女孩子的約會邀請了吧？"
16020-160200130 = "很遺憾……是御伽醬哦～"
16020-160200140 = "不，我並沒有誤會"
16020-160200150 = "畢竟發信人那邊本來就顯示著御伽"
16020-160200160 = "啊"
16020-160200170 = "原來這不是作戰用的臨時號碼啊"
16020-160200180 = "抱歉，因為個人整備時間太無聊，就想稍微惡作劇一下，結果準備得太草率了"
16020-160200190 = "別在意。只要是學生的聯絡，我隨時歡迎"
16020-160200200 = "不過老師，你不會排斥和不認識的人聯絡嗎？"
16020-160200210 = "大部分的人接到不認識的電話都會先無視"
16020-160200220 = "不認識的電話確實大多是廣告或打錯的電話啦……"
16020-160200230 = "但說不定是急需幫助的學生啊？"
16020-160200240 = "確實也會有那種情況呢"
16020-160200250 = "畢竟不能因為潛在危險就總是選擇迴避"
16020-160200260 = "不過老師你還是稍微小心一點比較好哦"
16020-160200270 = "在這奇普托斯裡，把你這種連子彈都擋不住的柔弱大人當成目標的學生，可不佔少數哦。"
16020-160200280 = "……我會牢記在心的"
16020-160200290 = "老師，BravoCharlie來了"
16020-160200300 = "如果有什麼讓你在意的東西，建議你先收好哦"
16020-160200310 = "BravoCharlie……？"
16020-160200320 = "……那是什麼意思？"
16020-160200330 = "啊"
16020-160200340 = "抱歉"
16020-160200350 = "不小心用了我們小隊成員之間的暗號了"
16020-160200360 = "BravoCharlie在語音字母裡是代表B和C的意思"
16020-160200370 = "我們之間通常不想把BeanCounter這個詞掛在嘴邊，就會用這個來代替"
16020-160200380 = "數豆子的人？"
16020-160200390 = "嗯，是用來揶揄財務專家的說法"
16020-160200400 = "那個"
16020-160200410 = "也就是說"
16020-160200420 = "行政委員會的財務室長好像來了"
16020-160200430 = "這種事你應該先說啊！"
16020-160200440 = "老師"
16020-160200450 = "不好意思這麼晚打擾你"
16020-160200460 = "你該不會已經睡了？"
16020-160200470 = "唔嗯……"
16020-160200480 = "果然睡著了吧，抱歉"
16020-160200490 = "沒什麼事，別在意，晚安！"
16020-160200500 = "抱歉，剛剛沒看到訊息"
16020-160200510 = "怎麼了嗎？"
16020-160200520 = "這麼晚了，是發生什麼事了嗎？"
16020-160200530 = "御伽……？"
16020-160200540 = "我立刻過去！"
16020-160200550 = "老師，這週末有空嗎？"
16020-160200560 = "嗯，有哦"
16020-160200570 = "有什麼需要我幫忙的嗎？"
16020-160200580 = "嗯，因為下次作戰要用的迷彩服沒了"
16020-160200590 = "所以我想去柯基町一趟，找件新的迷彩服"
16020-160200600 = "如果方便的話，要不要一起去看看？"
16020-160200610 = "好，我要去"
16020-160200620 = "話說回來，購物中心也能買到迷彩服嗎？"
16020-160200630 = "當然可以"
16020-160200640 = "只要有錢，在柯基町從今晚的配菜到駭客用的工具，全都買得到！"
16020-160200650 = "……那不是別家店的宣傳標語嗎？"
16020-160200660 = "看到空地上放著的水泥管，或是橋下的陰影時"
16020-160200670 = "你會不會莫名地很想把它當成只屬於自己的秘密基地呢？"
16020-160200680 = "小時候確實這麼想過"
16020-160200690 = "就連現在也想裹著棉被，躲進只屬於自己的空間裡"
16020-160200700 = "……那有點不妙吧？"
16020-160200710 = "總之"
16020-160200720 = "大家想的都差不多呢"
16020-160200730 = "我小時候也為了藏遊戲機或漫畫書，到處尋找只屬於自己的秘密基地"
16020-160200740 = "沒想到成了高中生之後，竟然還會到處找秘密基地"
16020-160200750 = "最近怎麼了？"
16020-160200760 = "個人空間不夠用嗎？"
16020-160200770 = "倒也不是那樣……"
16020-160200780 = "進行SRT的作戰時，常常需要在外面潛伏超過一天，或是徹夜不眠"
16020-160200790 = "那種時候，這些「秘密基地」意外地相當實用"
16020-160200800 = "有時還會在作戰前為這種狀況做準備，事先把彈藥或個人用品放到秘密基地裡"
16020-160200810 = "感覺像是實現了兒時的浪漫，真不錯"
16020-160200820 = "最近有什麼特別中意的秘密基地嗎？"
16020-160200830 = "嗯……例如老師的書桌底下？"
16020-160200840 = "咦……？"
16020-160200850 = "你那是什麼反應？"
16020-160200860 = "不是"
16020-160200870 = "別想歪了，重點是書桌啦！"
16020-160200880 = "在書桌上蓋一條毛毯鑽進底下，然後宣稱那裡是秘密基地，這種事小時候常有吧？"
16020-160200890 = "哦哦，原來是那個意思"
16020-160200900 = "如果是這樣的話，倒是可以偶爾借給你"
16020-160200910 = "嗯，謝謝老師的好意"
16020-160200920 = "不過覬覦那個秘密基地的學生很多，所以我早就放棄了"
16020-160200930 = "等一下"
16020-160200940 = "那是什麼意思！？"
