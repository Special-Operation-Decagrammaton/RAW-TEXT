[translation]
16020-160200010 = "Hello. Is this Sensei? Of Schale?"
16020-160200020 = "Yes? That's me?"
16020-160200030 = "I've always wanted to spend some one-on-one time with you, Sensei."
16020-160200040 = "Can you come meet me at 4 Lostway Alley tonight?"
16020-160200050 = "If you're fine with after 8..."
16020-160200060 = "I'll make the time!"
16020-160200070 = "No, no, no!"
16020-160200080 = "C'mon, Sensei. That was suspicious as heck."
16020-160200090 = "At least try to exercise a LITTLE caution if a stranger makes a weird request of you."
16020-160200100 = "What if it was someone who was trying to dig up intel on Schale's Sensei?"
16020-160200110 = " ...What now?"
16020-160200120 = "Ah. Did you think a cute girl was asking you out on a date?"
16020-160200130 = "Unfortunately, it was none other than me, Otogi!"
16020-160200140 = "No, I didn't think that at all."
16020-160200150 = "I have your contact info saved..."
16020-160200160 = "Ah."
16020-160200170 = "Oops. I thought this was our burner phone."
16020-160200180 = "Sorry. I was just kinda bored, and I wanted to mess with you. Execution was subpar, though."
16020-160200190 = "Don't be sorry! I'm happy to hear from one of my precious students!"
16020-160200200 = "You don't mind talking to strangers, though?"
16020-160200210 = "The normal thing to do is to ignore unknown numbers."
16020-160200220 = "It could be a telemarketer..."
16020-160200230 = "Or it could be a student in need of help."
16020-160200240 = "I see where you're coming from."
16020-160200250 = "Sometimes you just have to take the risk, no matter the consequences."
16020-160200260 = "Still. You really should be more careful."
16020-160200270 = "After all, there's more than one person gunning for the weak, frail adult who can't withstand even a single bullet."
16020-160200280 = "...I'll do my best."
16020-160200290 = "Sensei, Bravo Charlie is here."
16020-160200300 = "I recommend you hide anything that you don't want the authorities to find."
16020-160200310 = "Bravo Charlie...?"
16020-160200320 = "...What do you mean by that?"
16020-160200330 = "Ah."
16020-160200340 = "I'm sorry."
16020-160200350 = "I defaulted to code without thinking."
16020-160200360 = "\"Bravo\" and \"Charlie\" stand for B and C in the phonetic alphabet."
16020-160200370 = "And we use it to refer to the Bean Counter?"
16020-160200380 = "Bean Counter?"
16020-160200390 = "Yeah, it's a word for mocking financial officers."
16020-160200400 = "So..."
16020-160200410 = "Um"
16020-160200420 = "The Chief of Finance from the Board of Administration is here."
16020-160200430 = "PLEASE LEAD WITH THAT!"
16020-160200440 = "Sensei"
16020-160200450 = "Sorry for texting you so late"
16020-160200460 = "Are you asleep?"
16020-160200470 = "Um"
16020-160200480 = "I guess you're probably sleeping. Sorry about that."
16020-160200490 = "It was nothing, so don't worry about it. Good night!"
16020-160200500 = "Sorry, I didn't see your message."
16020-160200510 = "What's going on?"
16020-160200520 = "It's so late. Did something happen?"
16020-160200530 = "Otogi...?"
16020-160200540 = "I'm on my way!"
16020-160200550 = "Sensei, are you free this weekend?"
16020-160200560 = "Yes. 100%."
16020-160200570 = "Do you need help with something?"
16020-160200580 = "Um, I need to get some new camo for our next weapon."
16020-160200590 = "So I was thinking of doing some shopping in Corgi Town."
16020-160200600 = "Do you want to come with?"
16020-160200610 = "I'm on my way."
16020-160200620 = "But can you get a camouflage uniform...at the mall?"
16020-160200630 = "Uh, where else?"
16020-160200640 = "From tonight's dinner to hacking tools, you can find everything in Corgi Town. So long as you have the money!"
16020-160200650 = "...Isn't that a catchphrase from a different store?"
16020-160200660 = "You ever see a pipe in a park, or a shadow under a bridge,"
16020-160200670 = "and think, \"That'd be the perfect secret hideout!\"?"
16020-160200680 = "Mm. Yeah. A lot when I was younger."
16020-160200690 = "Sometimes, I want to just hide out under my blanket."
16020-160200700 = "...Isn't that a bit dangerous?"
16020-160200710 = "Anyways"
16020-160200720 = "People really do think a lot."
16020-160200730 = "I used to always find new hideouts for my consoles and manga."
16020-160200740 = "But I didn't think the habit would persist into high school."
16020-160200750 = "Why do you need one now?"
16020-160200760 = "Do you not have enough personal space?"
16020-160200770 = "No, it's not like that..."
16020-160200780 = "Sometimes stakeouts for SRT missions can last all day, or even all night."
16020-160200790 = "My secret bases tend to be pretty useful at times like those."
16020-160200800 = "I have ammunition or personal things I need stashed all over."
16020-160200810 = "It's cool to see your childhood dream coming true."
16020-160200820 = "Is there a new spot you've been eyeing as a base?"
16020-160200830 = "Hm. Under your desk?"
16020-160200840 = "Eh"
16020-160200850 = "What's with that reaction?"
16020-160200860 = "No"
16020-160200870 = "Don't get any funny ideas. What's important is that it's a desk!"
16020-160200880 = "You know how kids'll wrap themselves in a blanket, crawl under a desk, and call that their secret base?"
16020-160200890 = "Ah, so that's what you mean."
16020-160200900 = "I can lend it to you for those purposes."
16020-160200910 = "Um, I appreciate it"
16020-160200920 = "But I gave up on that a while ago. Too many other students were going after it."
16020-160200930 = "Hold on."
16020-160200940 = "What do you mean by that?!"
