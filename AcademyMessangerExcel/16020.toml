[translation]
16020-160200010 = "สวัสดีค่ะ ใช่คุณครูชาเล่ต์มั้ยคะ?"
16020-160200020 = "ก็ใช่นะ...?"
16020-160200030 = "ฉันอยากเจอคุณครูแบบสองต่อสอง\nมานานแล้วค่ะ"
16020-160200040 = "เย็นนี้ช่วยมาหาฉันที่ถนนร้างซอย 4\nได้มั้ยคะ?"
16020-160200050 = "ถ้าเป็นหลัง 2 ทุ่มไปแล้วก็ได้..."
16020-160200060 = "ครูหาเวลาออกไปหาได้อยู่แล้ว"
16020-160200070 = "ไม่สิ ต้องไม่ใช่แบบนี้!"
16020-160200080 = "คุณครู ทำไมถึงตอบรับคำขอแปลกๆ\nอย่างไม่คิดอะไรเลยล่ะ?"
16020-160200090 = "ถ้าจู่ๆ มีคนแปลกหน้าเข้ามาชวนคุย\nอย่างน้อยก็ควรระแวงไว้หน่อยสิ"
16020-160200100 = "คนนั้นอาจเป็นบุคคลต้องสงสัยที่\nพยายามเข้าหาคุณครูของชาเล่ต์\nเพื่อล้วงข้อมูลอะไรบางอย่างก็ได้นะ?"
16020-160200110 = "หืม...?"
16020-160200120 = "อย่าบอกนะว่าเข้าใจผิดว่าเด็กผู้หญิง\nน่ารักมาชวนไปเดตน่ะ?"
16020-160200130 = "เสียใจด้วยนะ แต่ฉันคือโอโทกิจังค่ะ~"
16020-160200140 = "เปล่านะ ครูไม่ได้เข้าใจผิด"
16020-160200150 = "คนส่งข้อความมาชื่อว่า 'โอโทกิ'\nตั้งแต่แรกอยู่แล้วต่างหาก"
16020-160200160 = "อ่า"
16020-160200170 = "คิดว่านี่เป็นเบอร์ชั่วคราวที่ใช้สำหรับ\nปฏิบัติการซะอีก"
16020-160200180 = "ขอโทษนะ ฉันรู้สึกเบื่อๆ ในเวลาซ่อม\nบำรุงส่วนตัว ก็เลยอยากแกล้งคนเล่น\nแต่ก็เตรียมตัวได้ไม่ดีสินะ"
16020-160200190 = "ไม่ต้องคิดมากหรอก ถ้านักเรียน\nติดต่อมา ครูก็ยินดีเสมอแหละ"
16020-160200200 = "แต่กับคนที่ไม่รู้จัก ก็ยินดีคุยด้วย\nงั้นเหรอ?"
16020-160200210 = "คนส่วนใหญ่ไม่ค่อยรับสายจาก\nเบอร์แปลกนี่นา"
16020-160200220 = "เบอร์แปลกส่วนใหญ่ชอบเป็น\nสแปมหรือไม่ก็โทรผิด..."
16020-160200230 = "แต่ก็อาจเป็นนักเรียนที่ต้องการ\nความช่วยเหลือเร่งด่วนก็ได้นี่นา?"
16020-160200240 = "มันก็จริงนะ"
16020-160200250 = "ในเมื่ออันตรายมีอยู่ทุกที่ จะให้เลี่ยง\nไปตลอดก็ไม่ได้"
16020-160200260 = "แต่ยังไงคุณครูก็ควรจะห่วงชีวิตตัวเอง\nให้มากกว่านี้หน่อยนะ"
16020-160200270 = "เพราะในคิโวทอสน่ะ คงไม่ได้มี\nนักเรียนแค่คนสองคนที่จ้องจะ\nเล่นงานผู้ใหญ่ที่อ่อนแอ ที่แค่กระสุนปืน\nก็ทนไม่ได้หรอก"
16020-160200280 = "ครูจะจำเอาไว้นะ..."
16020-160200290 = "คุณครู บราโว่ ชาร์ลี\nเข้าประจำการแล้ว"
16020-160200300 = "ถ้ามีของชิ้นไหนที่ทำให้รู้สึกกังวลใจ\nฉันแนะนำให้เอาไปไว้ที่อื่นก่อนนะ"
16020-160200310 = "บราโว่ ชาร์ลี...?"
16020-160200320 = "หมายถึงอะไรเหรอ...?"
16020-160200330 = "อ่า"
16020-160200340 = "ขอโทษที"
16020-160200350 = "เผลอเอาคำที่ใช้พูดกับสมาชิกใน\nกองมาพูดซะได้"
16020-160200360 = "บราโว่ ชาร์ลีคือรหัสเสียงตัว B\nกับ C น่ะ"
16020-160200370 = "ปกติแล้วพวกฉันไม่ค่อยชอบใช้คำว่า\nBean Counter ก็เลยเรียกด้วยคำอื่นแทน"
16020-160200380 = "แปลว่าคนนับถั่วเหรอ?"
16020-160200390 = "อื้อ มันเป็นคำเอาไว้ล้อเลียนพวก\nฝ่ายการเงินน่ะ"
16020-160200400 = "แบบว่า"
16020-160200410 = "อืม"
16020-160200420 = "เหมือนหัวหน้าฝ่ายการเงินของ\nคณะกรรมการบริหารจะมานะ"
16020-160200430 = "แล้วทำไมไม่บอกกันก่อนล่ะ!"
16020-160200440 = "คุณครู"
16020-160200450 = "ขอโทษที่ติดต่อมาตอนดึกนะ"
16020-160200460 = "กำลังหลับอยู่หรือเปล่า?"
16020-160200470 = "อืม"
16020-160200480 = "คงจะหลับไปแล้วสินะ ขอโทษนะ"
16020-160200490 = "ฉันไม่มีเรื่องอะไรทั้งนั้น\nไม่ต้องกังวลหรอก ฝันดีล่ะ!"
16020-160200500 = "ขอโทษนะ ครูไม่ได้เช็กข้อความน่ะ"
16020-160200510 = "มีเรื่องอะไรหรือเปล่า?"
16020-160200520 = "เกิดเรื่องอะไรขึ้นกลางดึก\nแบบนี้เหรอ?"
16020-160200530 = "โอโทกิ...?"
16020-160200540 = "ครูจะไปหาเดี๋ยวนี้เลย!"
16020-160200550 = "คุณครู สุดสัปดาห์นี้พอจะมีเวลาว่าง\nบ้างมั้ย?"
16020-160200560 = "อื้อ ครูมีเวลาให้อยู่แล้ว"
16020-160200570 = "ให้ครูช่วยอะไรหรือเปล่า?"
16020-160200580 = "อืม ฉันไม่มีชุดพรางตัวใส่สำหรับ\nปฏิบัติการครั้งหน้าน่ะ"
16020-160200590 = "ก็เลยว่าจะไปซื้อชุดพรางตัวที่\nคอร์กี้ทาวน์สักหน่อย"
16020-160200600 = "คุณครูช่วยไปด้วยกันได้มั้ย?"
16020-160200610 = "ได้สิ"
16020-160200620 = "ว่าแต่ชุดพรางตัวก็น่าจะมีขายใน\nห้างสรรพสินค้าไม่ใช่เหรอ?"
16020-160200630 = "ก็ต้องมีอยู่แล้ว"
16020-160200640 = "ในคอร์กี้ทาวน์น่ะ ขอแค่มีเงิน\nก็ซื้อได้ทุกอย่างตั้งแต่มื้อเย็นของวันนี้\nไปจนถึงเครื่องมือแฮ็กเลย!"
16020-160200650 = "นั่นมันสโลแกนของร้านอื่น\nไม่ใช่เหรอ...?"
16020-160200660 = "เวลาเห็นพวกท่อปูนที่วางทิ้งไว้ตาม\nลานโล่งๆ หรือเห็นร่มเงาใต้สะพาน"
16020-160200670 = "คุณครูเคยแอบคิดมั้ยว่า 'อยากทำที่นี่\nเป็นฐานลับของตัวเองจัง'?"
16020-160200680 = "ตอนเด็กๆ ก็เคยคิดแบบนั้นนะ"
16020-160200690 = "ตอนนี้ก็ยังอยากเอาผ้าห่มคลุมหัว\nแล้วเข้าไปในที่ส่วนตัวของตัวเองเลย"
16020-160200700 = "แบบนั้นมันไม่อันตรายไปหน่อย\nเหรอน่ะ...?"
16020-160200710 = "ยังไงก็เถอะ"
16020-160200720 = "คนเรามีความคิดคล้ายๆ กันสินะ"
16020-160200730 = "ตอนเด็กๆ ฉันก็ชอบออกไปหาฐานลับ\nของตัวเองเพื่อซ่อนเครื่องเล่นเกม\nหรือไม่ก็หนังสือการ์ตูนเหมือนกัน"
16020-160200740 = "ไม่นึกเลยนะว่าอยู่ม.ปลายแล้วฉันยัง\nมาเดินหาฐานลับอยู่อีก"
16020-160200750 = "หมู่นี้ทำไมเหรอ?"
16020-160200760 = "พื้นที่ส่วนตัวไม่พอหรือเปล่า?"
16020-160200770 = "อ่า ไม่ใช่อย่างนั้นหรอก..."
16020-160200780 = "พอทำปฏิบัติภารกิจของ SRT ก็มี\nบ่อยครั้งที่ต้องเฝ้าสังเกตการณ์กลางแจ้ง\nนานกว่าหนึ่งวัน บางทีต้องอยู่ตลอด\nทั้งคืนเลยด้วย"
16020-160200790 = "ในเวลาแบบนี้ <ฐานลับ> พวกนี้จะมี\nประโยชน์มากกว่าที่คิดอีกนะ"
16020-160200800 = "ก่อนจะทำปฏิบัติการอะไร บางครั้งฉัน\nก็จะเอากระสุนหรือของใช้ส่วนตัวมาไว้\nที่ฐานลับก่อนเพื่อเตรียมรับสถานการณ์\nแบบนั้น"
16020-160200810 = "เท่จังเลย เหมือนความฝันใน\nวัยเด็กเป็นจริงขึ้นมาเลยนะ"
16020-160200820 = "แล้วหมู่นี้มีที่ไหนที่อยากทำเป็น\nฐานลับพิเศษหรือเปล่า?"
16020-160200830 = "อืม ใต้โต๊ะทำงานของคุณครู?"
16020-160200840 = "เอ่อ"
16020-160200850 = "ทำไมปฏิกิริยาเป็นแบบนี้ล่ะ?"
16020-160200860 = "เดี๋ยวก่อน"
16020-160200870 = "อย่าคิดอะไรแปลกๆ นะ สิ่งสำคัญก็คือ\nมันคือโต๊ะทำงานต่างหาก!"
16020-160200880 = "การเอาผ้าปูรองนอนมาคลุมโต๊ะแล้ว\nมุดเข้าไปซ่อนข้างใต้แล้วทำเป็นฐานลับน่ะ\nตอนเด็กๆ ใครๆ ก็เคยทำกันไม่ใช่เหรอ?"
16020-160200890 = "อ้อ หมายถึงแบบนั้นสินะ"
16020-160200900 = "ถ้าแบบนั้น ครูก็น่าจะให้ยืมใช้ได้อยู่นะ"
16020-160200910 = "อืม ฉันก็ขอบคุณในน้ำใจของคุณครู\nหรอกนะ"
16020-160200920 = "แต่มีนักเรียนหลายคนที่หมายตา\nฐานลับนั่น จนฉันเลิกสนใจไปนานแล้วละ"
16020-160200930 = "เดี๋ยวนะ"
16020-160200940 = "หมายความว่ายังไงน่ะ?!"
