[translation]
20062-200620010 = "선생님 안녕하세용!"
20062-200620020 = "누굴까용-!"
20062-200620030 = "니키 에리나, 라고 알려져 있는 녀석이군."
20062-200620040 = "간파했단다 후후. "
20062-200620050 = "에이 뭐야! 일부러 말투도 바꿨는데!"
20062-200620060 = "그거 저장해두셨군요!"
20062-200620070 = "아 뭐더라"
20062-200620080 = "그거 있잖아요, 그거! "
20062-200620090 = "연락처?"
20062-200620100 = "맞아요 그거! 단어가 생각이 안 나서요!"
20062-200620110 = "연락처 저장하셔서 바로 아셨군요, 기쁘네요!"
20062-200620120 = "혹시, 연구하는 거 도와주실 수 있어요?"
20062-200620130 = "얼마든지 오케이!"
20062-200620140 = "진짜 최고!"
20062-200620150 = "183호로 와 주세요!"
20062-200620160 = "선생님 덕분에 연구 데이터를 많이 쌓았어요!"
20062-200620170 = "선생님 최고!"
20062-200620180 = "역시 요리는 화학이네요!"
20062-200620190 = "진짜 맛있었어!"
20062-200620200 = "재료를 대부분 즉석에서 만들 거라곤 생각 못 했지만! "
20062-200620210 = "이 정도는 껌이죠! 거의 풍선껌!"
20062-200620220 = "간장은 어제 미리 만들어두길 잘했어요!"
20062-200620230 = "다음에도 맛있는 거 해드릴게요! 꼭 오세요!"
20062-200620240 = "공부의 최대 단점."
20062-200620250 = "바로…… 끝이 없다는 것……."
20062-200620260 = "단점인지는 모르겠지만, 이해는 되네!"
20062-200620270 = "공부 싫어! 책도 싫어!"
20062-200620280 = "공부 안 하고 지식만 얻을 수 있음 진짜 좋을 텐데!"
20062-200620290 = "그쵸! 선생님!"
20062-200620300 = "선생님으로서 묵비권을 행사합니다."
20062-200620310 = "우-! 우-!"
20062-200620320 = "학생의 편을 들어달라!"
20062-200620330 = "요새, 지식이 부족하면 설득력이 떨어지는 걸 느꼈거든요."
20062-200620340 = "그래서 공부하다가 집중이 잘 안돼서 연락해봤어요, 에헷!"
20062-200620350 = "그럼 다시 공부하러-"
20062-200620360 = "선생님 괜찮으세요?!"
20062-200620370 = "다리 다치신 건 아니죠? 제대로 일어나지 못하셨는데……."
20062-200620380 = "괜찮아 살아있으면 오케이!"
20062-200620390 = "역시 한번 시작한 공부는 끝까지 해야 했어요!"
20062-200620400 = "영영 한 몸으로 살아갈 뻔했네요."
20062-200620410 = "시행착오라고 치자! 걱정 말라구!"
20062-200620420 = "감사합니다아……."
20062-200620430 = "외출권 땄다아아아앗!!"
20062-200620440 = "선생님, 특대 반응 부탁드립니다."
20062-200620450 = "우오오오오!! 외출권이라니!! 멋져!!!"
20062-200620460 = "멋지긴 한데! 외출은 어떻게 따낸 거야?"
20062-200620470 = "훗훗훗훗훗"
20062-200620480 = "연구 목적 출장이죠! 훗훗훗"
20062-200620490 = "선생님도 오세요! 같이 다니면 진짜 좋을 거예요!"
20062-200620500 = "바로 갈게!"
20062-200620510 = "끼얏호우!"
20062-200620520 = "연구 윤리 공부 중인데요,"
20062-200620530 = "선생님 생각나서 연락드려요."
20062-200620540 = "연구 윤리는 아주 중요하지! 기특해!"
20062-200620550 = "보고서는 잘 통과됐어?"
20062-200620560 = "아뇨"
20062-200620570 = "연필로 쓴 자국이 남아서 원래 연구 목표가 뭐였는지 들켰거든요."
20062-200620580 = "그래서 미끌미끌한 블라우스에 불개미 바지에 분해되는 코트 입고"
20062-200620590 = "연구 윤리 책 강제로 정독하고 있어요."
20062-200620600 = "침대에서 세 번 떨어졌고, 춥고, 따가워요."
20062-200620610 = "살려줘요"
20062-200620620 = "선생님 제발!!!"
20062-200620630 = "선생님~ 뭐 묻고 싶은 게 있는데요오~"
20062-200620640 = "아, 그거 뭐라고 하더라"
20062-200620650 = "친근함이나 감사를 담아 남에게 선사로 주는 물품……?"
20062-200620660 = "선물?"
20062-200620670 = "아 맞아요! 은근히 단어가 어렵다니깐."
20062-200620680 = "아무튼, 선생님 받고 싶은 선물 있어요?"
20062-200620690 = "갑자기?"
20062-200620700 = "갑자기는 아니고! 뭔가 드리고 싶다고 생각하긴 했거든요."
20062-200620710 = "근데 뭘 드려야 할지 몰라서"
20062-200620720 = "음"
20062-200620730 = "아! 그거 만들면 되겠다!"
20062-200620740 = "좋아! 지금 바로 만들어볼게요! 용광로 불 켜야지!"
20062-200620750 = "용광로?!"
