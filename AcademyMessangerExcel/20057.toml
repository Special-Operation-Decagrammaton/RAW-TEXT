[translation]
20057-200570010 = "What do you think of Millennium, Master?"
20057-200570020 = "Although, this question may be coming a little late."
20057-200570030 = "I don't think I'll ever FULLY get Millennium."
20057-200570040 = "I've been here a while, but every day feels new in Millennium."
20057-200570050 = "Oh, my."
20057-200570060 = "I'm sorry you see it that way."
20057-200570070 = "In that case, "
20057-200570080 = "wouldn't you like to see what our everyday lives are like?"
20057-200570090 = "Sensei."
20057-200570100 = "Okay. I'm ready."
20057-200570110 = "Perfect. Let's do this."
20057-200570120 = "Yes."
20057-200570130 = "We can even stay up all night to write it!"
20057-200570140 = "Commence the \"Become Friendlier\" script-writing operation!"
20057-200570150 = "Yes, Sensei."
20057-200570160 = "It's great that we stayed up almost all night"
20057-200570170 = "doing simulations"
20057-200570180 = "and writing this script"
20057-200570190 = "...But will it really work out?"
20057-200570200 = "Honestly, I don't know..."
20057-200570210 = "We have no choice but to try..."
20057-200570220 = "You're right."
20057-200570230 = "Hello, Sensei."
20057-200570240 = "Thanks to you,"
20057-200570250 = "I seem to be getting on better with my classmates."
20057-200570260 = "That's great!"
20057-200570270 = "I knew you could do it, Akane!"
20057-200570280 = "Yes."
20057-200570290 = "Which is why."
20057-200570300 = "If you don't mind,"
20057-200570310 = "I'd like to show you this new side of me as well."
20057-200570320 = "Just the two of us."
20057-200570330 = "Akane...?"
20057-200570340 = "Um, Sensei..."
20057-200570350 = "Thank you for being my classmate today."
20057-200570360 = "I can't believe you would leave your classmate behind..."
20057-200570370 = "I'm going to pout..."
20057-200570380 = "I'm sorry..."
20057-200570390 = "But..."
20057-200570400 = "It was more"
20057-200570410 = "embarrassing than I expected..."
20057-200570420 = "This has been on my mind..."
20057-200570430 = "But, when I'm cleaning,"
20057-200570440 = "perhaps I've grown too accustomed to my usual methods."
20057-200570450 = "That has been my concern lately."
20057-200570460 = "There aren't all that many different ways to clean, right?"
20057-200570470 = "No. Um, so..."
20057-200570480 = "I'm talking about the other \"cleaning\""
20057-200570490 = "not the \"cleaning a room\" type..."
20057-200570500 = "Oh, so..."
20057-200570510 = "...Bombs?"
20057-200570520 = "Yes."
20057-200570530 = "It's truly a problem..."
20057-200570540 = "Thank you so much for working so late..."
20057-200570550 = "Are you doing okay, Akane...?"
20057-200570560 = "Yes."
20057-200570570 = "Though it was a bit late, I finished my homework."
20057-200570580 = "And I'm ready for class tomorrow."
20057-200570590 = "It's all thanks to your guidance."
20057-200570600 = "These moments make me reflect on my educational policies..."
20057-200570610 = "Fufu."
20057-200570620 = "I believe there may be nothing more reliable"
20057-200570630 = "than the words of someone capable of self-reflection."
20057-200570640 = "I'll continue to be in your care,"
20057-200570650 = "Master."
