[translation]
20057-200570010 = "主人，千年感覺如何呢？"
20057-200570020 = "雖然您說不定已經習慣了"
20057-200570030 = "習慣是習慣了"
20057-200570040 = "不過千年每天都有新鮮事呢……"
20057-200570050 = "哎呀？"
20057-200570060 = "千年確實是個每天都日新月異的地方"
20057-200570070 = "我想想……要不要偶爾在工作時間以外"
20057-200570080 = "來參觀我們的日常呢？"
20057-200570090 = "老師"
20057-200570100 = "如您所說的，我準備好了"
20057-200570110 = "好，來試試吧"
20057-200570120 = "是的"
20057-200570130 = "從現在開始，即便必須熬夜……！"
20057-200570140 = "「友好相處吧」劇本撰寫作戰，開始！"
20057-200570150 = "好的，老師"
20057-200570160 = "雖然和老師幾乎整晚沒睡"
20057-200570170 = "做了模擬訓練"
20057-200570180 = "把「劇本」完成了是好事"
20057-200570190 = "……但是，真的沒問題嗎？"
20057-200570200 = "其實我也不知道……"
20057-200570210 = "但我們只能做了……"
20057-200570220 = "確實是這樣呢"
20057-200570230 = "您好，老師"
20057-200570240 = "多虧了老師"
20057-200570250 = "我似乎和班上的同學相處得更融洽了"
20057-200570260 = "那真是太好了！"
20057-200570270 = "我就知道朱音可以的！"
20057-200570280 = "是啊"
20057-200570290 = "所以說呢"
20057-200570300 = "如果老師願意的話"
20057-200570310 = "我想讓您看看改變後的我"
20057-200570320 = "就我們兩個人"
20057-200570330 = "朱音……？"
20057-200570340 = "那個，老師"
20057-200570350 = "今天謝謝您當我的同學"
20057-200570360 = "怎麼丟下同學先走了……"
20057-200570370 = "我好寂寞……"
20057-200570380 = "非常抱歉……"
20057-200570390 = "可，可是……"
20057-200570400 = "因為那比想像中……"
20057-200570410 = "更加令人害羞……"
20057-200570420 = "最近在思考"
20057-200570430 = "打掃的時候"
20057-200570440 = "是不是都用同一種方法處理"
20057-200570450 = "會比較好呢？"
20057-200570460 = "打掃原本不就只有一種方法嗎？"
20057-200570470 = "不，我指的……"
20057-200570480 = "不是那種打掃"
20057-200570490 = "是另一種打掃"
20057-200570500 = "咦？難道是……"
20057-200570510 = "……炸彈？"
20057-200570520 = "是的"
20057-200570530 = "實在很令人煩惱……"
20057-200570540 = "拖到這麼晚，真是辛苦您了……"
20057-200570550 = "朱音還好嗎……？"
20057-200570560 = "是的"
20057-200570570 = "雖然時間有點晚，不過作業也都做完了"
20057-200570580 = "還有明天的準備也是"
20057-200570590 = "這都多虧了老師的指導"
20057-200570600 = "每次遇到這種情況，我都會反省自己的教育方針……"
20057-200570610 = "呵呵"
20057-200570620 = "懂得自我反省的人說出來的話"
20057-200570630 = "是最可靠的"
20057-200570640 = "今後也請您多多關照"
20057-200570650 = "主人"
