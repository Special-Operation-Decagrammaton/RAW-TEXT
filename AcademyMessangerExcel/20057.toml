[translation]
20057-200570010 = "มิลเลเนียมเป็นยังไงบ้างคะนายท่าน"
20057-200570020 = "จริงๆ ก็อาจจะคุ้นเคยแล้วก็ได้นะคะ"
20057-200570030 = "ถ้าบอกว่าคุ้นเคยก็คุ้นเคยนะ"
20057-200570040 = "แต่ทำไมมิลเลเนียมถึงดูแปลกใหม่\nทุกวันเลย..."
20057-200570050 = "ตายจริง"
20057-200570060 = "ได้ยินแบบนั้นฉันก็รู้สึกผิดอยู่หน่อย\nนะคะ"
20057-200570070 = "แต่ยังไง ก็ใช้โอกาสนี้ "
20057-200570080 = "ลองมาสังเกตชีวิตประจำวันของฉัน\nดูมั้ยล่ะคะ?"
20057-200570090 = "คุณครู"
20057-200570100 = "ฉันเตรียมพร้อมตามที่บอกไว้แล้วค่ะ"
20057-200570110 = "ดีเลย งั้นก็ลองดูกัน"
20057-200570120 = "ค่ะ"
20057-200570130 = "ตอนนี้ครูไม่ต้องนอนทั้งคืนก็ยังได้...!"
20057-200570140 = "เริ่มปฏิบัติการเขียนบท\n'มาทำความสนิทสนมกัน' ได้!"
20057-200570150 = "ค่ะ คุณครู"
20057-200570160 = "การได้เขียน 'บท'"
20057-200570170 = "และจำลองสถานการณ์กับคุณครู"
20057-200570180 = "จนแทบไม่ได้นอนมันก็ดีอยู่หรอก"
20057-200570190 = "แต่มันจะใช้ได้จริงๆ เหรอคะ...?"
20057-200570200 = "ที่จริงครูก็ไม่แน่ใจเหมือนกัน..."
20057-200570210 = "แต่เราก็ไม่มีทางเลือกอื่นนะ..."
20057-200570220 = "ก็คงจะเป็นอย่างนั้นนะคะ"
20057-200570230 = "สวัสดีค่ะ คุณครู"
20057-200570240 = "ต้องขอบคุณคุณครูเลยค่ะ"
20057-200570250 = "ตอนนี้ฉันเข้ากับเพื่อนร่วมชั้นได้ดีขึ้น\nมาหน่อยแล้วค่ะ"
20057-200570260 = "ดีใจที่ได้ยินอย่างนั้นนะ!"
20057-200570270 = "ครูเชื่ออยู่แล้วว่าอาคาเนะต้องทำได้!"
20057-200570280 = "ค่ะ"
20057-200570290 = "ก็เพราะอย่างนั้นละค่ะ"
20057-200570300 = "ถ้าคุณครูไม่ว่าอะไรละก็"
20057-200570310 = "ฉันอยากแสดงด้านนั้นของตัวเอง\nให้คุณครูเห็นค่ะ"
20057-200570320 = "แค่เราสองคน... น่ะค่ะ"
20057-200570330 = "อาคาเนะ...?"
20057-200570340 = "เอ่อ คุณครู"
20057-200570350 = "วันนี้ขอบคุณที่ช่วยเป็นเพื่อนร่วมชั้น\nให้นะคะ"
20057-200570360 = "ทิ้งเพื่อนร่วมชั้นแล้วหายไปเฉยเลย..."
20057-200570370 = "จะงอนละนะ..."
20057-200570380 = "ขอโทษค่ะ..."
20057-200570390 = "แต่ว่า..."
20057-200570400 = "มันน่าอาย..."
20057-200570410 = "กว่าที่คิดไว้เยอะเลยค่ะ..."
20057-200570420 = "หมู่นี้ฉันคิดบ่อยๆ ว่า"
20057-200570430 = "ตอนทำความสะอาด"
20057-200570440 = "ฉันพยายามใช้แค่วิธีเดียวในการ\nจัดการทุกอย่างหรือเปล่า?"
20057-200570450 = "ฉันก็เลยค่อนข้างกังวลน่ะค่ะ"
20057-200570460 = "ปกติทำความสะอาดก็ใช้แค่วิธีเดียว\nไม่ใช่เหรอ?"
20057-200570470 = "ไม่ค่ะ อืม จะว่ายังไงดี"
20057-200570480 = "ฉันไม่ได้หมายถึงทำความสะอาด\nแบบนั้น"
20057-200570490 = "แต่เป็นการทำความสะอาดในอีก\nแง่หนึ่งค่ะ"
20057-200570500 = "อ่า หมายถึง"
20057-200570510 = "ระเบิดเหรอ...?"
20057-200570520 = "ค่ะ"
20057-200570530 = "ฉันกลุ้มใจจริงๆ นะคะ..."
20057-200570540 = "ต้องทำงานหนักจนถึงดึกดื่นเลยนะคะ..."
20057-200570550 = "อาคาเนะล่ะ ทุกอย่างโอเคมั้ย?"
20057-200570560 = "ค่ะ"
20057-200570570 = "ถึงจะดึกแล้ว แต่ฉันก็ทำการบ้าน\nจนเสร็จ"
20057-200570580 = "แล้วก็จัดตารางเรียนของพรุ่งนี้ไว้\nแล้วละค่ะ"
20057-200570590 = "ต้องขอบคุณที่ช่วยแนะนำนะคะ"
20057-200570600 = "พอเจอเรื่องแบบนี้ ครูต้องไปทบทวน\nวิธีสอนของตัวเองใหม่เลยละ"
20057-200570610 = "ฮุฮุ"
20057-200570620 = "คำพูดจากคนที่รู้จักทบทวนตัวเองน่ะ"
20057-200570630 = "ฟังแล้วน่าอุ่นใจที่สุดแล้วละค่ะ"
20057-200570640 = "ต่อไปฉันก็ขอฝากตัวด้วยนะคะ"
20057-200570650 = "นายท่าน"
