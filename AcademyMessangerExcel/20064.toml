[translation]
20064-200640010 = "안녕하세요, 선생님."
20064-200640020 = "혹시 시간 괜찮으실까요?"
20064-200640030 = "응! 괜찮아!"
20064-200640040 = "저, 그게……"
20064-200640050 = "마나미 님으로부터 권고안이 왔는데"
20064-200640060 = "평의회 임원들은 선생님과 교류회를 가질 것……"
20064-200640070 = "이라고 하셔서요."
20064-200640080 = "나도 전달받았어!"
20064-200640090 = "아, 미리 연락받으셨었군요."
20064-200640100 = "그렇다면……"
20064-200640110 = "폐가 안 된다면 저와 교류회를……"
20064-200640120 = "응! 좋아!"
20064-200640130 = "가, 감사합니다."
20064-200640140 = "그럼 곧 일정을 잡아서 연락드릴게요."
20064-200640150 = "선생님. 잘 돌아가셨나요?"
20064-200640160 = "오늘 정말 즐거웠어요."
20064-200640170 = "응! 또 같이 영화를 보면 좋겠네."
20064-200640180 = "또…… 또요?"
20064-200640190 = "음……."
20064-200640200 = "저는 선생님이 원하신다면……."
20064-200640210 = "거부하지 않을게요."
20064-200640220 = "가, 강제의 의미는 없으니까!"
20064-200640230 = "네. 알고 있어요."
20064-200640240 = "선생님에게서는……"
20064-200640250 = "친절한 향기가 나니까."
20064-200640260 = "그럼, 다음에 또 뵐게요."
20064-200640270 = "안녕하세요, 선생님."
20064-200640280 = "오늘 업무차 이쪽에 오신다 들었어요."
20064-200640290 = "혹시라도 필요한 일이 있다면"
20064-200640300 = "부담 없이 말씀해 주세요."
20064-200640310 = "응! 고마워!"
20064-200640320 = "별말씀을요."
20064-200640330 = "해야만 하는 일인데요."
20064-200640340 = "그럼 오늘도 평온한 향기가 가득한 하루가 되시길."
20064-200640350 = "선생님. 갑자기 죄송한데……."
20064-200640360 = "제 고민을 들어주실 수 있을까요?"
20064-200640370 = "오! 물론이지!"
20064-200640380 = "가, 감사해요."
20064-200640390 = "면목 없지만 이 고민을 들어줄 사람은"
20064-200640400 = "선생님 이외엔 떠오르지 않아서……."
20064-200640410 = "어떤 고민인데?"
20064-200640420 = "이거, 기록이 남으면 안 되거든요."
20064-200640430 = "그러니 다소 번거로우시겠지만……"
20064-200640440 = "직접 만나서 이야기했으면 하는데."
20064-200640450 = "괜찮을까요?"
20064-200640460 = "언제든 괜찮아!"
20064-200640470 = "아…… 정말 감사합니다."
20064-200640480 = "그럼 장소를 지정해 드릴 테니 그곳에서 봬요."
20064-200640490 = "선생님. 잘 돌아가셨나요?"
20064-200640500 = "응! 굿즈들도 무사해!"
20064-200640510 = "다행이네요……."
20064-200640520 = "부디 잘 보관해 주세요."
20064-200640530 = "저도 할 수 있는 걸 해볼 생각이에요."
20064-200640540 = "이대로 있다간……."
20064-200640550 = "예술의 다양성을 지키지 못할 테니."
20064-200640560 = "그럼 다음엔 좋은 소식으로 다시 뵐게요."
20064-200640570 = "오늘 정말 수고 많으셨습니다."
20064-200640580 = "편히 쉬세요."
20064-200640590 = "선생님. 기쁜 소식이 있어요."
20064-200640600 = "제가 좋아하는 그 연극이……."
20064-200640610 = "이번에 금지 항목에서 제외되었어요."
20064-200640620 = "오? 무슨 일이 있었던 거야?"
20064-200640630 = "후후……."
20064-200640640 = "말씀드렸잖아요."
20064-200640650 = "저도 할 수 있는 걸 해보겠다고."
20064-200640660 = "다행히 좋은 결과가 있었네요."
20064-200640670 = "금지됐던 물품들도 소지할 수 있게 됐으니……"
20064-200640680 = "괜찮으시다면 저번에 맡겨둔 물건들"
20064-200640690 = "돌려받을 수 있을까요?"
20064-200640700 = "응! 지금 그쪽으로 갈게!"
20064-200640710 = "네. 정말 감사합니다."
20064-200640720 = "그럼 자세한 이야기는 만나서 하도록 해요."
20064-200640730 = "선생님. 오늘 즐거우셨을까요?"
20064-200640740 = "응! 다음에 또 들러도 될까?"
20064-200640750 = "예전의 저라면 안 된다고 했겠지만……"
20064-200640760 = "지금은 조금 다를지도 모르겠네요."
20064-200640770 = "네. 얼마든지 찾아와 주세요."
20064-200640780 = "대신 다른 분들께는 비밀이에요."
20064-200640790 = "아시죠?"
20064-200640800 = "역시 우라라는 비밀이 많네~"
20064-200640810 = "후후……"
20064-200640820 = "선생님 정도는 아니에요."
20064-200640830 = "그럼……"
20064-200640840 = "다음 만남도, 아름다운 꽃처럼 피어나기를."
