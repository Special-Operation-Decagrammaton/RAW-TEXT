[translation]
10143-101430010 = "หุบเขาเป็นยังไงบ้างคะ คุณครู?"
10143-101430020 = "ธรรมชาตินี่ดีจริงๆ เลยนะ..."
10143-101430030 = "ค่อยยังชั่วหน่อยค่ะ"
10143-101430040 = "ว่าแต่..."
10143-101430050 = "วันนี้ฉันอยากชมทิวทัศน์ของหุบเขา\nกับคุณครู"
10143-101430060 = "จะได้มั้ยคะ?"
10143-101430070 = "ฤดูร้อนเป็นฤดูที่น่าอัศจรรย์เลยนะคะ"
10143-101430080 = "ในแง่ไหนเหรอ?"
10143-101430090 = "คงมีเหตุผลและความหมายอยู่\nหลายอย่าง"
10143-101430100 = "แต่ฉันคิดว่าคงเป็นเรื่องที่เราได้ "
10143-101430110 = "เข้าหาใครบางคนด้วยรูปลักษณ์ใหม่ๆ\nน่ะค่ะ"
10143-101430120 = "ไหนๆ ก็พูดถึงแล้ว"
10143-101430130 = "ฉันอยากให้คุณครูได้เห็นตัวตนใหม่ๆ\nของฉันสักหน่อย"
10143-101430140 = "จะได้มั้ยคะ?"
10143-101430150 = "เมื่อวาน"
10143-101430160 = "ฉันต้องขอโทษสำหรับหลายๆ\nเรื่องเลยค่ะ"
10143-101430170 = "ในที่สุดวันนี้ชุนก็ทักครูมาก่อนแฮะ..."
10143-101430180 = "คะ?"
10143-101430190 = "พอมาคิดดูแล้ว ก็จริงด้วยนะคะ..."
10143-101430200 = "แต่ว่าฉันเองก็..."
10143-101430210 = "ไม่ใช่นะ! ครูไม่เห็นอะไรทั้งนั้น!\nครูลืมไปหมดแล้ว!"
10143-101430220 = "..."
10143-101430230 = "แบบนั้นอาจจะ..."
10143-101430240 = "ทำให้ฉันน้อยใจอยู่บ้างนะคะ...?"
10143-101430250 = "แล้วครู... ควรทำยังไงดีล่ะ..."
10143-101430260 = "นั่น... สินะคะ?"
10143-101430270 = "..."
10143-101430280 = "ถ้าคุณครู"
10143-101430290 = "ยอมเข้าร่วมการแก้มือกับฉันละก็..."
10143-101430300 = "ฉันก็อาจจะ... รู้สึกดีขึ้นสักหน่อยค่ะ"
10143-101430310 = "สวัสดีค่ะ คุณครู"
10143-101430320 = "ต้องขออภัยจริงๆ แต่ว่า..."
10143-101430330 = "ฉันขอถามความสมัครใจของคุณครู\nสักเรื่องได้มั้ยคะ...?"
10143-101430340 = "ได้เสมอเลย!"
10143-101430350 = "วันนี้ฉันมีแผนจะไปสวนน้ำกับเด็กๆ\nสวนต้นบ๊วยค่ะ"
10143-101430360 = "ถ้าคุณครูสะดวก"
10143-101430370 = "ไม่ทราบว่า... จะมาช่วยดูแลเด็กๆ\nกับฉันได้มั้ยคะ?"
10143-101430380 = "ได้เลย ไม่มีปัญหา!"
10143-101430390 = "ฮุฮุ"
10143-101430400 = "ขอบคุณค่ะ คุณครู"
10143-101430410 = "กลับไปถึงหรือยังคะ คุณครู?"
10143-101430420 = "โอยย... ทั้งหมดแรง ทั้งปวดตัว\nไปหมดเลย..."
10143-101430430 = "ฮุฮุ"
10143-101430440 = "การเล่นน้ำต้องใช้แรงเยอะไม่ใช่เล่น\nเลยนะคะ"
10143-101430450 = "วันนี้ขอบคุณมากๆ เลยค่ะ"
10143-101430460 = "ถ้าคุณครูไม่ว่าอะไรละก็..."
10143-101430470 = "คราวหน้าฉันก็อยากให้เรามีเวลา\nแบบนี้ด้วยกันอีกค่ะ"
10143-101430480 = "บอกครูได้ตลอดเลยนะ"
10143-101430490 = "ฮุฮุ ฉันคิดอยู่แล้วว่าคุณครูต้องพูด\nแบบนั้น"
10143-101430500 = "ขอบคุณนะคะ"
10143-101430510 = "ถ้างั้น ไว้คราวหน้า..."
10143-101430520 = "ฉันจะลองหาโอกาสให้เป็นเวลาของ\nเราแค่สองคนดูนะคะ"
