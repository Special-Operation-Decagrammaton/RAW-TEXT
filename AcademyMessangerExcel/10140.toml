[translation]
10140-101400010 = "老師，聽說你在找我"
10140-101400020 = "有什麼事嗎？"
10140-101400030 = "難道你被捲入危險事件了嗎？"
10140-101400040 = "啊，胡桃，我正好在找你"
10140-101400050 = "我在附近的商店街收到了水果牛奶，拿去喝吧"
10140-101400060 = "胡桃喜歡甜甜的牛奶吧？"
10140-101400070 = "等一下"
10140-101400080 = "你怎麼會知道我的喜好"
10140-101400090 = "不對"
10140-101400100 = "你是把我當成只要有零食就會開開心心跑過去的小孩子嗎？"
10140-101400110 = "別為了這種小事把SRT的特殊隊員叫出來啦！"
10140-101400120 = "真的不要嗎？"
10140-101400130 = "這可是放了真正的水果，超級高級的水果牛奶呢"
10140-101400140 = "那個……"
10140-101400150 = "嗯……"
10140-101400160 = "有草莓牛奶嗎？"
10140-101400170 = "還有香蕉和哈密瓜，你想要哪個就拿去吧"
10140-101400180 = "那我等作戰結束提交報告的時候順便去拿"
10140-101400190 = "我再說一次"
10140-101400200 = "我絕對不是為了牛奶才去的哦！"
10140-101400210 = "好累……"
10140-101400220 = "昨晚是有什麼作戰嗎？"
10140-101400230 = "沒有"
10140-101400240 = "其實是睡前在SNS上看到有趣的短影音"
10140-101400250 = "不小心看了太久沒注意時間，結果就錯過了睡覺的時機"
10140-101400260 = "看短影音的時候，時間確實會過得很快呢"
10140-101400270 = "感覺比長影片還容易讓人上癮"
10140-101400280 = "沒錯"
10140-101400290 = "我最近常看一種叫Life Hack，\n能用在日常生活中的簡單小技巧影片"
10140-101400300 = "不過最近好像越來越多影片，明明只是簡單的作業卻硬要包裝成生活小技巧，還用上一些莫名其妙的工具"
10140-101400310 = "但是說實話，邊看短影音邊談論效率低落也挺好笑的"
10140-101400320 = "不過用平凡的物品來克服難關，確實很有意思呢"
10140-101400330 = "總覺得有點像馬○先……"
10140-101400340 = "馬○先？那是什麼？"
10140-101400350 = "嗯……這有點難說明"
10140-101400360 = "算是Life Hack的代名詞之類的"
10140-101400370 = "？"
10140-101400380 = "大人有時候真的會用一些奇怪的流行語呢"
10140-101400390 = "老師"
10140-101400400 = "這附近有沒有可以拍證件照的地方呢？"
10140-101400410 = "附近好像沒有照相館……"
10140-101400420 = "怎麼突然要拍證件照？"
10140-101400430 = "因為作戰需要重新申請一份證明文件"
10140-101400440 = "然後得附上最近的證件照才行"
10140-101400450 = "所以SRT學園時期用的證件照不能用了"
10140-101400460 = "用證件快照機怎麼樣？"
10140-101400470 = "證件快照機？"
10140-101400480 = "嗯，車站前有個可以拍證件照的證件快照機"
10140-101400490 = "那是24小時營業的，要不要試試看？"
10140-101400500 = "證件快照機有點……"
10140-101400510 = "嗯……"
10140-101400520 = "看來只能這樣了"
10140-101400530 = "我知道了，我之後試試看"
10140-101400540 = "我最近在玩一款剛上市的RPG手遊"
10140-101400550 = "這個遊戲，盾兵的能力值好像太差了"
10140-101400560 = "別的職業就算了，攻擊力比武僧還低也太過分了吧？"
10140-101400570 = "會不會是因為角色平衡的關係啊？"
10140-101400580 = "也有人認為盾牌是偏重防禦的裝備"
10140-101400590 = "不過"
10140-101400600 = "盾牌可不是單純的防具哦"
10140-101400610 = "根據使用者的不同，也能變得比一般武器還有威脅性呢"
10140-101400620 = "盾牌能變成武器……？"
10140-101400630 = "畢竟那基本上就是一塊巨大的鐵塊嘛"
10140-101400640 = "光是我用的盾牌就有幾十kg了呢"
10140-101400650 = "你都是單手拿著它走動的嗎！？"
10140-101400660 = "？"
10140-101400670 = "那當然啊，我另一隻手不是還拿著槍嗎？"
10140-101400680 = "盾兵果然很強呢……"
10140-101400690 = "老師，你聽說那個傳聞了嗎？"
10140-101400700 = "最近這附近的巷子裡，好像出現了以財物為目標的強盜"
10140-101400710 = "會在人煙稀少的昏暗巷弄裡偷偷跟在後面"
10140-101400720 = "再從背後突襲將人擊倒，然後把財物洗劫一空的樣子"
10140-101400730 = "真是令人不安的傳聞呢……"
10140-101400740 = "犯人還沒被抓到嗎？"
10140-101400750 = "女武神已經展開了集中搜查，應該很快就會抓到了……"
10140-101400760 = "不過老師你也要小心"
10140-101400770 = "而且你的身體本來就比我們脆弱，還常常一個人走夜路，對吧？"
10140-101400780 = "如果有需要的話"
10140-101400790 = "只要在夏萊附近喊我一聲，我就會去接你"
10140-101400800 = "胡桃要來接我啊？總覺得有點心動呢"
10140-101400810 = "可以穿著圍裙來接我嗎？"
10140-101400820 = "閉嘴啦！"
10140-101400830 = "我不是那個意思！"
