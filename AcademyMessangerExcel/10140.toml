[translation]
10140-101400010 = "Sensei, I heard you were looking for me."
10140-101400020 = "What's wrong?"
10140-101400030 = "Do you need my strength to bail you out of a dangerous situation?"
10140-101400040 = "Ah, Kurumi! There you are!"
10140-101400050 = "I wanted to share some fruit milk I got as a gift with you!"
10140-101400060 = "You like sweet milks, right?"
10140-101400070 = "Hold on."
10140-101400080 = "How did you know that?"
10140-101400090 = "Wait"
10140-101400100 = "Am I some kid who'll come running at the first sign of sweets to you?!"
10140-101400110 = "I'm an SRT special agent! Don't call me over something like that?"
10140-101400120 = "Are you suuuuuure?"
10140-101400130 = "It's super fancy fruit milk made with real fruits."
10140-101400140 = "Well"
10140-101400150 = "Mm"
10140-101400160 = "Do you have strawberry?"
10140-101400170 = "And banana and melon. All waiting for you."
10140-101400180 = "...I'll be there after I submit this report."
10140-101400190 = "Again"
10140-101400200 = "It's not just because I want sweets, OKAY?!"
10140-101400210 = "I'm tired..."
10140-101400220 = "Did you have a late-night operation?"
10140-101400230 = "No"
10140-101400240 = "I was watching some shorts on social media before I fell asleep."
10140-101400250 = "I lost track of time and ended up staying up too late."
10140-101400260 = "Those short-form videos will get you!"
10140-101400270 = "They're weirdly more addicting than long videos..."
10140-101400280 = "True."
10140-101400290 = "I've been watching these \"Life Hack\" videos, where they teach you little tips for everyday use."
10140-101400300 = "But so many of them call it an easy tip, but they're using obscure tools for the most simple tasks?"
10140-101400310 = "I guess I can't harp about inefficiency when I was doom scrolling all night."
10140-101400320 = "It's fun to see people create solutions out of ordinary objects!"
10140-101400330 = "Sounds like MacXver..."
10140-101400340 = "MacXver? What's that?"
10140-101400350 = "Um... It'd be a long story."
10140-101400360 = "To put it simply, it's like the definition of a life hack."
10140-101400370 = "?"
10140-101400380 = "You adults have the weirdest slang."
10140-101400390 = "Sensei"
10140-101400400 = "Do you know somewhere I could get my ID photo taken?"
10140-101400410 = "Not that I know of..."
10140-101400420 = "What do you need a ID photo for?"
10140-101400430 = "I need to get this certification for a mission"
10140-101400440 = "but I need a recent photo to attach to the application."
10140-101400450 = "The last one I took was when I was still in SRT."
10140-101400460 = "How about using one of those self-service photo booths?"
10140-101400470 = "Self-service photo booths?"
10140-101400480 = "They have them in most stations these days."
10140-101400490 = "They're 24/7, so you can go whenever you want!"
10140-101400500 = "Self-service photo booths are a bit.."
10140-101400510 = "Mm"
10140-101400520 = "I guess that's my only option."
10140-101400530 = "All right, thanks, Sensei."
10140-101400540 = "I've been playing this new mobile RPG game."
10140-101400550 = "And the stats balance for shield tanks is the worst."
10140-101400560 = "I can accept most of it, but why do we have less attack than a MONK?"
10140-101400570 = "Aren't they trying to balance for the high DEF?"
10140-101400580 = "I mean, people THINK that shields are just for defense."
10140-101400590 = "But"
10140-101400600 = "Shields aren't just part of your armor."
10140-101400610 = "Used correctly, they're more lethal than most weapons."
10140-101400620 = "Really...?"
10140-101400630 = "It's a giant chunk of metal!"
10140-101400640 = "My shield weights over tens of kilograms, I'll have you know."
10140-101400650 = "Wait! Don't you carry it with just one hand?!"
10140-101400660 = "?"
10140-101400670 = "Well, yes? My other hand is for my gun."
10140-101400680 = "Wow... Tanks are strong..."
10140-101400690 = "Sensei! Have you heard?"
10140-101400700 = "A robber in the area has been lurking in alleys and stealing valuables from people."
10140-101400710 = "They'll stalk you into a deserted area"
10140-101400720 = "and then ambush you and take you for everything you own!"
10140-101400730 = "How ominous..."
10140-101400740 = "Do they have a suspect?"
10140-101400750 = "The Valkyrie Security Bureau started an intensive investigation, so I'm sure it'll only be a matter of time until they catch them..."
10140-101400760 = "But you should still be careful, Sensei."
10140-101400770 = "You're weaker than us, but you're always wandering around at night."
10140-101400780 = "You know"
10140-101400790 = "I can be your escort if you call me out around Schale."
10140-101400800 = "Oooh, I do like the idea of you coming out to meet me."
10140-101400810 = "Maybe you could wear an apron?"
10140-101400820 = "Shut up!"
10140-101400830 = "You're missing the point entirely!"
