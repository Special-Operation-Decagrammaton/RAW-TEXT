[translation]
10140-101400010 = "คุณครู ได้ยินว่าเรียกหาฉันอยู่เหรอ?"
10140-101400020 = "มีเรื่องอะไรหรือเปล่า?"
10140-101400030 = "หรือว่ามีเรื่องอันตรายให้ฉันไปช่วย?"
10140-101400040 = "อ่า คุรุมิ ครูตามหาอยู่นานเลย"
10140-101400050 = "ครูได้นมรสผลไม้มาจากย่านการค้าน่ะ\nมาเอาไปกินสิ"
10140-101400060 = "คุรุมิชอบนมหวานๆ ไม่ใช่เหรอ?"
10140-101400070 = "เดี๋ยวนะ"
10140-101400080 = "รู้ได้ยังไง"
10140-101400090 = "ไม่สิ"
10140-101400100 = "คิดว่าฉันเป็นเด็กน้อยที่เที่ยววิ่งหา\nของว่างงั้นเหรอ?"
10140-101400110 = "อย่าเรียกหาเจ้าหน้าที่พิเศษของ SRT\nด้วยเรื่องเล็กน้อยแบบนั้นนะ!"
10140-101400120 = "จะไม่กินจริงๆ เหรอ?"
10140-101400130 = "เป็นนมรสผลไม้พรีเมียมที่มีผลไม้\nจริงๆ ใส่เข้าไปเลยนะ"
10140-101400140 = "คือว่า"
10140-101400150 = "อืม"
10140-101400160 = "มีนมสตรอว์เบอร์รี่ด้วยหรือเปล่า?"
10140-101400170 = "มีนมกล้วยกับเมล่อนด้วย\nมาเลือกรสที่อยากกินไปได้เลย"
10140-101400180 = "งั้นฉันจะแวะไปเอาตอนไปส่งรายงาน\nหลังเสร็จปฏิบัติการแล้วกัน"
10140-101400190 = "ขอบอกอีกครั้งนะ"
10140-101400200 = "ฉันไม่ได้ไปที่นั่นเพราะจะกินของว่าง\nหรอกนะ!"
10140-101400210 = "เหนื่อยจัง..."
10140-101400220 = "เมื่อคืนไปทำปฏิบัติการอะไรมา\nงั้นเหรอ?"
10140-101400230 = "เปล่าหรอก"
10140-101400240 = "ที่จริงก่อนนอนฉันไถฟีดเจอวิดีโอสั้น\nที่น่าสนใจ ก็เลยกดดู"
10140-101400250 = "ฉันก็ดูไปเรื่อยๆ แบบไม่คิดอะไร\nจนสุดท้ายก็เลยเวลานอนไปเลย"
10140-101400260 = "ตอนดูวิดีโอสั้นๆ เวลาจะผ่านไปเร็ว\nมากเลยละ"
10140-101400270 = "ดูแล้วติดหนึบมากกว่าวิดีโอยาวๆ อีก"
10140-101400280 = "ใช่เลย"
10140-101400290 = "ช่วงนี้ฉันชอบดูวิดีโอ Life Hack\nที่บอกเคล็ดลับง่ายๆ ที่เอาไปใช้ได้\nในชีวิตประจำวันน่ะ"
10140-101400300 = "ช่วงนี้มักจะมีวิดีโอที่เอาเครื่องมือ\nแปลกๆ มาใช้โดยอ้างว่าเป็น 'เคล็ดลับ'\nแม้แต่กับงานง่ายๆ ที่ไม่จำเป็นต้องมี\nเคล็ดลับด้วยซ้ำ"
10140-101400310 = "การเอาเรื่องประสิทธิภาพมาพูดทั้งๆ\nที่ตัวเองก็ดูวิดีโอสั้นมันก็ฟังดูย้อนแย้ง\nอยู่หรอก"
10140-101400320 = "แต่การเห็นคนเอาของธรรมดาๆ มาใช้\nฝ่าฟันอุปสรรค ก็น่าสนใจอยู่เสมอเลยนะ"
10140-101400330 = "ให้ความรู้สึกเหมือนXกายเวอร์เลย..."
10140-101400340 = "Xกายเวอร์? มันคืออะไรเหรอ?"
10140-101400350 = "อืม... ถ้าจะให้อธิบายก็น่าจะยาวน่ะ"
10140-101400360 = "เรียกว่าตัวพ่อแห่งวงการ\nLife Hack แล้วกัน"
10140-101400370 = "?"
10140-101400380 = "พวกผู้ใหญ่เนี่ย ชอบใช้คำแสลง\nแปลกๆ อยู่เรื่อย"
10140-101400390 = "คุณครู"
10140-101400400 = "แถวนี้มีที่ไหนที่ไปถ่ายรูปติดบัตรได้\nบ้างมั้ย?"
10140-101400410 = "แถวนี้น่าจะไม่มีสตูดิโอถ่ายรูปนะ..."
10140-101400420 = "ทำไมจู่ๆ ถึงจะถ่ายรูปติดบัตรเหรอ?"
10140-101400430 = "พอดีว่าฉันต้องไปขอออกใบรับรอง\nสำหรับปฏิบัติการใหม่"
10140-101400440 = "แต่ดันต้องแนบรูปติดบัตรที่เพิ่งถ่าย\nล่าสุดไปด้วยนี่สิ"
10140-101400450 = "ฉันก็เลยใช้รูปติดบัตรที่เคยใช้สมัย\nตอนอยู่สถาบัน SRT ไม่ได้"
10140-101400460 = "ลองไปใช้บริการตู้ถ่ายรูปอัตโนมัติ\nดูมั้ย?"
10140-101400470 = "ตู้ถ่ายรูปอัตโนมัติ?"
10140-101400480 = "อื้อ ข้างสถานีมีตู้ถ่ายรูปอัตโนมัติอยู่\nไปถ่ายรูปติดบัตรที่นั่นได้นะ"
10140-101400490 = "ไปถ่ายรูปที่นั่นได้ทุกเมื่อเลย\nลองดูมั้ยล่ะ?"
10140-101400500 = "ตู้ถ่ายรูปอัตโนมัติงั้นเหรอ มันน่าจะ..."
10140-101400510 = "อืม"
10140-101400520 = "ก็ช่วยไม่ได้สินะ"
10140-101400530 = "งั้นก็ได้ ไว้ฉันจะลองแวะไปแล้วกัน"
10140-101400540 = "หมู่นี้ฉันเล่นเกม RPG ใหม่ใน\nโทรศัพท์มือถืออยู่"
10140-101400550 = "แต่ค่าพลังของพลโล่ในเกมนี้มัน\nอ่อนมากเลย"
10140-101400560 = "เรื่องอื่นยังพอว่านะ แต่การที่ค่าพลัง\nของพลโล่ต่ำกว่าพระเนี่ย มันจะไม่\nเกินไปหน่อยเหรอ?"
10140-101400570 = "เป็นเรื่องของสมดุลตัวละคร\nหรือเปล่า?"
10140-101400580 = "เรามักมองว่าโล่เป็นอุปกรณ์ที่เน้น\nใช้เพื่อการป้องกันนี่เนอะ"
10140-101400590 = "แต่ว่า"
10140-101400600 = "โล่ไม่ใช่แค่เครื่องป้องกันธรรมดาๆ\nหรอกนะ"
10140-101400610 = "ถ้าอยู่ในมือคนที่ใช้เป็น มันจะกลาย\nเป็นอาวุธที่อันตรายกว่าอาวุธทั่วไป\nเลยด้วย"
10140-101400620 = "โล่กลายเป็นอาวุธงั้นเหรอ...?"
10140-101400630 = "ก็มันไม่ต่างอะไรกับก้อนเหล็ก\nขนาดยักษ์นี่นา"
10140-101400640 = "แม้แต่โล่ที่ฉันใช้ก็หนักหลายสิบกิโล\nเลยนะจะบอกให้"
10140-101400650 = "แบกโล่นั้นด้วยมือเดียวตลอด\nเลยเหรอ?"
10140-101400660 = "?"
10140-101400670 = "แน่นอนอยู่แล้ว ก็มืออีกข้างฉันต้อง\nถือปืนนี่นา?"
10140-101400680 = "พลโล่นี่แข็งแกร่งจริงๆ เลยนะ..."
10140-101400690 = "คุณครู ได้ยินข่าวลือนั้นมาหรือยัง?"
10140-101400700 = "เหมือนว่าช่วงนี้จะมีโจรดักปล้นชิง\nทรัพย์โผล่มาตามซอยแถวนี้น่ะ"
10140-101400710 = "ได้ยินว่าโจรจะชอบเดินตามหลัง\nเงียบๆ ในซอยที่เปลี่ยวและมืด"
10140-101400720 = "พอได้จังหวะก็พุ่งเข้าประชิดตัวจาก\nข้างหลัง แล้วก็ฉกกระเป๋าไปเลยละ"
10140-101400730 = "เป็นข่าวลือที่ฟังดูน่ากลัวเลยนะ..."
10140-101400740 = "ยังจับคนร้ายไม่ได้เหรอ?"
10140-101400750 = "สำนักความมั่นคงของวัลคิรี่เริ่มสืบสวน\nอย่างเข้มข้นแล้ว อีกไม่นานก็คงจับ\nตัวได้แล้วละ..."
10140-101400760 = "แต่ยังไงคุณครูก็ต้องระวังนะ"
10140-101400770 = "คุณครูน่ะอ่อนแอกว่าพวกเรา แต่ก็ยัง\nไปเดินคนเดียวตอนกลางคืนบ่อยๆ\nใช่มั้ยล่ะ?"
10140-101400780 = "เอาเป็นว่าถ้ามีอะไร"
10140-101400790 = "ก็เรียกฉันตอนใกล้จะถึงชาเล่ต์ได้\nเลยนะ ฉันจะออกไปรับเอง"
10140-101400800 = "คุรุมิจะออกมารับเหรอเนี่ย\nน่าตื่นเต้นจัง"
10140-101400810 = "ช่วยสวมผ้ากันเปื้อนออกมารับได้มั้ย?"
10140-101400820 = "เงียบไปเลย!"
10140-101400830 = "ฉันไม่ได้หมายความแบบนั้นสักหน่อย!"
