[translation]
10153-101530010 = "선생님, 선물 드리고 싶은 게 있어서요."
10153-101530020 = "바로- 게헨나컵 콜라보 페로로님이랍니다!"
10153-101530030 = "운 좋게 두 개를 동시에 얻어서,"
10153-101530040 = "하나는 선생님께 드리려고 해요. (≧∇≦)v"
10153-101530050 = "이런 좋은 걸 받아도 되려나!"
10153-101530060 = "물론이죠!"
10153-101530070 = "그러면 이따 뵙겠습니다!"
10153-101530080 = "선생님,"
10153-101530090 = "혹시…… 눈치채셨나요?"
10153-101530100 = "오늘 주변에서 왠지 시선이……."
10153-101530110 = "어…… 나도 조금 느끼긴 했는데"
10153-101530120 = "크게 신경…… 쓰지 말자!"
10153-101530130 = "신경이 조금 쓰이긴 해요……."
10153-101530140 = "역시……."
10153-101530150 = "머리 모양이 너무 평범해서 그런 걸까요?"
10153-101530160 = "기왕 이런 대회인데, 조금은 더 꾸며봤어야 했을까요?!"
10153-101530170 = "지금의 히후미가 좋아!"
10153-101530180 = "그리고 원인은 아마 그게 아닐 거야!"
10153-101530190 = "그런가요?!"
10153-101530200 = "그러면 뭐가 문제였을까요? ((º□º;))"
10153-101530210 = "선생님! 안녕하세요!"
10153-101530220 = "혹시 괜찮으시다면"
10153-101530230 = "이따가 같이 쇼핑하지 않으실래요?"
10153-101530240 = "바람 좀 쐬러 가보실까!"
10153-101530250 = "좋아요 선생님! (≧∇≦)"
10153-101530260 = "그러면 크루세이더 쨩으로 같이 가요!"
10153-101530270 = "픽업하러 갈게요! ヾ(•ω•`)o"
10153-101530280 = "선생님 괜찮으세요……?"
10153-101530290 = "그 정도로 운전을 할 생각은 없었는데"
10153-101530300 = "꼭 막아야 한다는 생각에 마음이 급해져서……."
10153-101530310 = "괜찮아! 오히려 멋있었어!"
10153-101530320 = "도로 위의 영웅 같다고 생각해!"
10153-101530330 = "그, 그 정도는 아니에요……!"
10153-101530340 = "다음부터는 꼭 꼭 안전하게 운전할게요!"
10153-101530350 = "약속이에요, 선생님!"
10153-101530360 = "선생님, 안녕하세요!"
10153-101530370 = "나중에 서명 하나 받을 수 있을까요?"
10153-101530380 = "물론! 그런데, 어떤 서명?"
10153-101530390 = "보충수업부의 과외활동 참가 확인증이에요!"
10153-101530400 = "고문의 서명이 필요하다고 해서요,"
10153-101530410 = "괜찮으시다면 나중에 부탁드리겠습니다!"
10153-101530420 = "우리 히후미가 해달라는데 당연히 가능하지!"
10153-101530430 = "감사합니다!"
10153-101530440 = "그러면 나중에 서명받으러 찾아뵐게요! (^~^)v"
10153-101530450 = "선생님, 잘 들어가셨나요?"
10153-101530460 = "서명해주셔서 감사합니다."
10153-101530470 = "항상, 여러 가지로 신세를 지네요……."
10153-101530480 = "신세는 무슨! 특별한 히후미의 부탁인걸!"
10153-101530490 = "특별하다니 에헤헤,"
10153-101530500 = "기운이 났어요, 고마워요 선생님!"
10153-101530510 = "선생님, 바쁘신가요?"
10153-101530520 = "여쭤보고 싶은 게 있어서요."
10153-101530530 = "괜찮으시다면 도움 부탁드리고 싶어요……."
10153-101530540 = "히후미를 돕는 게 최우선 업무야!"
10153-101530550 = "최선을 다해보겠습니닷!"
10153-101530560 = "감사합니다!"
10153-101530570 = "그러면 선수촌 뒤 숲에서 뵐게요! (≧∇≦)/"
10153-101530580 = "선생님!!"
10153-101530590 = "옷, 혹시 더러워지지 않으셨나요?!"
10153-101530600 = "괜찮은 것 같은데…… 왜?"
10153-101530610 = "휴, 다행이에요……."
10153-101530620 = "……혹시, 손에는 묻으셨나요?"
10153-101530630 = "손에 조금 묻었네?"
10153-101530640 = "으와앗!"
10153-101530650 = "죄송해요!!"
10153-101530660 = "바로 닦는 거 가지고 갈게요!!"
