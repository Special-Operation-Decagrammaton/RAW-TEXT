[translation]
10152-101520010 = "バーン"
10152-101520020 = "こんにちは、先生"
10152-101520030 = "バンド界の白雪姫"
10152-101520040 = "椎名ツムギです"
10152-101520050 = "し、白雪姫？"
10152-101520060 = "もちろん、鏡に世界一美しいと言われたわけではありませんが――"
10152-101520070 = "――「アピール」"
10152-101520080 = "……は大事ですから"
10152-101520090 = "ここで、先生に一つ質問です"
10152-101520100 = "今日は何の日か分かりますか？"
10152-101520110 = "ツムギの路上ライブの日！"
10152-101520120 = "ふふ"
10152-101520130 = "素晴らしい記憶力です"
10152-101520140 = "やはり先生は、私の期待を裏切りませんね"
10152-101520150 = "では、お時間がある時にお越しください"
10152-101520160 = "私はずっと、あの場所でお待ちしておりますので"
10152-101520170 = "楽しいステージでしたね"
10152-101520180 = "先生はどうでした？"
10152-101520190 = "楽しんでいただけましたか？"
10152-101520200 = "ストレスが吹き飛んだよ！"
10152-101520210 = "ふふっ、良かったです"
10152-101520220 = "今なら、毒リンゴを食べて深い眠りについても悔いはありません"
10152-101520230 = "もちろん、本当に毒リンゴを食べるわけでも"
10152-101520240 = "深い眠りにつくわけでもありませんが"
10152-101520250 = "ここではそのような――"
10152-101520260 = "「表現力」が、大事だから？"
10152-101520270 = "あら"
10152-101520280 = "以心伝心ですね"
10152-101520290 = "それでは、またお会いしましょう"
10152-101520300 = "その時も、願わくば――"
10152-101520310 = "平和なひとときとなりますように"
10152-101520320 = "先日小耳にはさんだのですが……"
10152-101520330 = "先生はよく夜勤をされているのだとか"
10152-101520340 = "作業中、睡魔に襲われた時は"
10152-101520350 = "どうなさっているのですか？"
10152-101520360 = "公園を散歩したりしてるかな"
10152-101520370 = "そうなのですね"
10152-101520380 = "「眠れる森の美女」である私としては"
10152-101520390 = "運命的なものを感じずにはいられません"
10152-101520400 = "そ、それはどういう……？"
10152-101520410 = "ふふっ、何でもありません"
10152-101520420 = "今日も良い一日をお過ごしください"
10152-101520430 = "先日はありがとうございました、先生"
10152-101520440 = "おかげで、誰にも気づかれることなく寮に戻れました"
10152-101520450 = "こっちもツムギのおかげで、仕事が片付いたよ"
10152-101520460 = "お互いにウィンウィンというわけですね"
10152-101520470 = "また夜に抜け出すようなことがあれば"
10152-101520480 = "先生のところへ伺いますね"
10152-101520490 = "デスメタルも良いですが"
10152-101520500 = "その時はもう少し……"
10152-101520510 = "甘美な曲も、聴いていただきたいです"
10152-101520520 = "先生、いかがお過ごしですか？"
10152-101520530 = "毎日、楽しんでいらっしゃいますか？"
10152-101520540 = "うん、毎日楽しいよ！"
10152-101520550 = "それはよかったです"
10152-101520560 = "私も、心躍る毎日を送っています"
10152-101520570 = "人生は楽しんでこそ、ですからね"
10152-101520580 = "もちろん、時には気が滅入る日もありますが"
10152-101520590 = "憂鬱な気分は、早々に手放してしまうのが一番です"
10152-101520600 = "私もそう思う！"
10152-101520610 = "ああ、皆が同じように考えることが出来たなら"
10152-101520620 = "世界はもっと平和になるでしょうに……"
10152-101520630 = "では今日も、人々の喜びと平和のため"
10152-101520640 = "ギターを奏でてきます"
10152-101520650 = "お時間がありましたら、あの公園でお会いしましょう"
10152-101520660 = "今日は"
10152-101520670 = "創作意欲の高まりを感じます"
10152-101520680 = "実は、先生と一緒に行きたい場所があるのですが"
10152-101520690 = "よろしいでしょうか？"
10152-101520700 = "もちろん付き合うよ！"
10152-101520710 = "ではこれから"
10152-101520720 = "ワイルドハントの美術館に行きませんか？"
10152-101520730 = "新しい展示会が始まったんです"
