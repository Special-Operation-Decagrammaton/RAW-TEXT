[translation]
10152-101520010 = "두둥"
10152-101520020 = "안녕하세요, 선생님."
10152-101520030 = "밴드계의 백설공주."
10152-101520040 = "시이나 츠무기의 등장입니다."
10152-101520050 = "배, 백설공주?"
10152-101520060 = "물론 거울이 저를 아름답다고 말하진 않습니다만……"
10152-101520070 = "어필"
10152-101520080 = "은 언제나 중요하니까요."
10152-101520090 = "그런 의미에서 질문."
10152-101520100 = "오늘은 무슨 날일까요?"
10152-101520110 = "츠무기가 공원에서 버스킹 하는 날!"
10152-101520120 = "후후."
10152-101520130 = "이 얼마나 놀라운 통찰력."
10152-101520140 = "역시 제 기대를 저버리지 않으시네요."
10152-101520150 = "그럼 시간이 날 때 찾아와 주세요."
10152-101520160 = "저는 항상 그곳에 있을 테니."
10152-101520170 = "아아, 오늘 연주는 평소보다 즐거웠네요."
10152-101520180 = "선생님은 어떠셨나요?"
10152-101520190 = "충분히 즐겨 주셨나요?"
10152-101520200 = "스트레스가 모두 날아갔어!"
10152-101520210 = "후후, 그렇다면 다행이네요."
10152-101520220 = "독 사과를 먹고 긴 잠에 빠져도 여한이 없어요."
10152-101520230 = "물론 진짜 독 사과를 먹는 것도"
10152-101520240 = "긴 잠에 빠지는 것도 아닙니다만,"
10152-101520250 = "여기서는 그런……."
10152-101520260 = "표현력이 중요하니까?"
10152-101520270 = "어머나."
10152-101520280 = "역시 저와 마음이 통하는 분."
10152-101520290 = "그럼 다음 만남도 기다리고 있겠습니다."
10152-101520300 = "그때도 부디"
10152-101520310 = "평화로운 한때가 되기를."
10152-101520320 = "그러고 보니 선생님."
10152-101520330 = "야근을 많이 하신다 들었습니다만."
10152-101520340 = "참을 수 없이 잠이 쏟아질 때는"
10152-101520350 = "어떻게 하시나요?"
10152-101520360 = "요즘엔 잠깐 공원을 산책해."
10152-101520370 = "아하. 그러셨군요."
10152-101520380 = "잠자는 숲속의 공주인 저로서는"
10152-101520390 = "센티멘탈리즘한 운명을 느끼게 되네요."
10152-101520400 = "어, 어느 부분에서?"
10152-101520410 = "후후, 아무것도 아니랍니다."
10152-101520420 = "그럼 오늘 하루도 힘내시길."
10152-101520430 = "감사합니다, 선생님."
10152-101520440 = "덕분에 들키지 않고 기숙사에 복귀했어요."
10152-101520450 = "나도 덕분에 일을 모두 마무리할 수 있었어."
10152-101520460 = "이걸로 서로 윈윈인 거네요."
10152-101520470 = "혹시 또 외박할 일이 생긴다면"
10152-101520480 = "선생님을 찾아갈게요."
10152-101520490 = "데스메탈도 좋지만"
10152-101520500 = "그때는 좀 더……"
10152-101520510 = "감미로운 곡을 연주했으면 좋겠네요."
10152-101520520 = "선생님. 요즘 어떠신가요?"
10152-101520530 = "즐거우신가요?"
10152-101520540 = "매일이 즐거워!"
10152-101520550 = "다행이네요."
10152-101520560 = "저도 매일이 즐겁답니다."
10152-101520570 = "역시 인생은 즐거워야죠."
10152-101520580 = "물론 즐겁지 않은 날도 있습니다만"
10152-101520590 = "안 좋은 생각은 빨리 털어버리는 게 좋죠."
10152-101520600 = "그렇지!"
10152-101520610 = "아아, 모두가 우리와 같다면"
10152-101520620 = "이 세계엔 평화가 가득할 텐데."
10152-101520630 = "그럼 오늘도 모두의 즐거움과 평화를 위해"
10152-101520640 = "기타를 들겠습니다."
10152-101520650 = "시간이 되신다면 그 공원에서 뵈어요."
10152-101520660 = "오늘은"
10152-101520670 = "영감이 샘솟는 하루네요."
10152-101520680 = "그런 의미에서 같이 가보고 싶은 장소가 있는데"
10152-101520690 = "어떠실까요?"
10152-101520700 = "언제든 불러만 줘."
10152-101520710 = "그럼 오늘은"
10152-101520720 = "우리 학원의 미술관에서 만날까요?"
10152-101520730 = "오늘부터 새로운 작품전이 개최된다고 해요."
