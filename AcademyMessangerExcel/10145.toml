[translation]
10145-101450010 = "ในเมื่อมาถึงหุบเขาทั้งที"
10145-101450020 = "เราก็ควรใช้เวลาให้ต่างจากยามปกติ\nมิใช่หรือ?"
10145-101450030 = "ก็คงต้องเป็นอย่างนั้นนะ"
10145-101450040 = "อืม"
10145-101450050 = "ในเมื่อครูก็เห็นด้วยเช่นนั้น"
10145-101450060 = "เราเลยอยากให้ครูมายังที่ที่เราจะบอก\nต่อจากนี้"
10145-101450070 = "พล็อตมันรุดหน้าเร็วเกินไป\nหรือเปล่า?!"
10145-101450080 = "อีกอย่างหนึ่ง"
10145-101450090 = "หากมาสาย เราจะไม่ให้อภัยนะ"
10145-101450100 = "จู่ๆ"
10145-101450110 = "เราก็นึกถึงเรื่องที่เกิดขึ้นเมื่อวาน\nขึ้นมา"
10145-101450120 = "เรื่องที่... ทำตัวเหมือนเด็กน่ะเหรอ?"
10145-101450130 = "ฮุฮุ"
10145-101450140 = "พอได้ยินคำนั้นจากครู"
10145-101450150 = "เราก็แอบรู้สึกผิดอยู่นิดหน่อยนะ"
10145-101450160 = "เช่นนั้นวันนี้เราก็ขอฝากตัวด้วย"
10145-101450170 = "ก็เพราะคุณครูน่ะ ยอดเยี่ยมเสมอเลย\nนี่คะ!"
10145-101450180 = "คิซากิ...?"
10145-101450190 = "ตื่นแล้วหรือ ครู?"
10145-101450200 = "เอ๋...?"
10145-101450210 = "นี่มันยังเช้าไปหน่อยหรือเปล่า...?"
10145-101450220 = "จะคิดเช่นนั้นก็ไม่แปลก"
10145-101450230 = "ทว่าฤดูร้อนมิได้คงอยู่ชั่วนิรันดร์"
10145-101450240 = "เราจึงต้องใช้ทุกชั่วขณะอย่างคุ้มค่า"
10145-101450250 = "ถึงจะกล่าวได้ว่า เราได้ใช้วันหยุด\nโดยไร้ซึ่งความเสียดาย"
10145-101450260 = "แม้เราจะกลับมาจากหุบเขาแล้ว"
10145-101450270 = "แต่ข้างนอกก็ยังคงเป็นฤดูร้อนอยู่สินะ"
10145-101450280 = "ด้วยเหตุนี้"
10145-101450290 = "เราก็เลยอยากตามหาสถานที่ "
10145-101450300 = "ที่เหมาะกับการใส่ชุดว่ายน้ำ\nยิ่งกว่านี้อีก"
10145-101450310 = "ว่าไงนะ...?"
10145-101450320 = "ขอบคุณที่ใช้เวลาช่วงฤดูร้อนนี้ร่วมกับ\nเรานะ ครู"
10145-101450330 = "มีแต่ความทรงจำที่เรามิอาจลืมเลือน\nทั้งนั้นเลย"
10145-101450340 = "ยังไม่จบแค่นี้หรอกน่า คิซากิ"
10145-101450350 = "นั่นหมายความว่าอย่างไร?"
10145-101450360 = "คิซากิเป็นคนพูดเองตั้งแต่แรก\nไม่ใช่เหรอ?"
10145-101450370 = "ว่าข้างนอกยังเป็นฤดูร้อนอยู่เลย"
10145-101450380 = "เรากล่าวเช่นนั้นไปก็จริง แต่ว่า..."
10145-101450390 = "เช่นนั้นหรือ"
10145-101450400 = "หมายความว่าครูจะใช้เวลาในฤดูร้อน\nร่วมกับเราต่อไปอีกหรือ?"
10145-101450410 = "ถ้าคิซากิต้องการ จะให้ครูอยู่ด้วย\nนานแค่ไหนก็ได้!"
10145-101450420 = "เช่นนั้นเองสินะ"
10145-101450430 = "ฮุฮุ"
10145-101450440 = "แน่นอนว่า เราไม่คิดว่าครูจะเป็น\nคนเช่นนั้น"
10145-101450450 = "แต่ครูไม่ควรเอ่ยคำนั้นอย่างง่ายดาย\nจนเกินไปนะ"
10145-101450460 = "เพราะว่าผีเสื้อบางตัวจะจดจำ\nคำสัญญาไปชั่วนิรันดร์"
