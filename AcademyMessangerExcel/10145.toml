[translation]
10145-101450010 = "難得來到溪谷"
10145-101450020 = "豈不是該共度一段異於平日的時光嗎？"
10145-101450030 = "那倒是沒錯呢"
10145-101450040 = "唔呣"
10145-101450050 = "既然老師贊同此議"
10145-101450060 = "希望汝接下來能動身前往妾身所說的地點"
10145-101450070 = "這進展得也太快了吧！？"
10145-101450080 = "順帶一提"
10145-101450090 = "不容許遲到"
10145-101450100 = "恍然間"
10145-101450110 = "憶起了昨日之事"
10145-101450120 = "是指……撒嬌的事嗎？"
10145-101450130 = "呵呵"
10145-101450140 = "自老師口中聽聞此言"
10145-101450150 = "令妾身多少有些心懷愧疚呢"
10145-101450160 = "那麼今日也有勞汝了"
10145-101450170 = "因為老師不管什麼時候都是最棒的呀！"
10145-101450180 = "妃姬……？"
10145-101450190 = "老師，汝醒了嗎？"
10145-101450200 = "嗯……？"
10145-101450210 = "現在還有點太早了吧……？"
10145-101450220 = "汝有此認知亦是無可厚非"
10145-101450230 = "然而夏日並非長存之物"
10145-101450240 = "唯有珍惜寸陰"
10145-101450250 = "方得稱作度過了毫無遺憾的假期"
10145-101450260 = "儘管已自溪谷歸來"
10145-101450270 = "外頭仍是夏日呢"
10145-101450280 = "故而"
10145-101450290 = "妾身便心生一念"
10145-101450300 = "是否須找尋更宜著泳裝之處"
10145-101450310 = "咦……？"
10145-101450320 = "老師，多謝汝與妾身共度此夏"
10145-101450330 = "盡是些難以忘懷的回憶呢"
10145-101450340 = "還沒結束哦，妃姬"
10145-101450350 = "此言何意？"
10145-101450360 = "妃姬一開始不是說了嗎？"
10145-101450370 = "外頭還是夏天"
10145-101450380 = "妾身確實曾有所言……"
10145-101450390 = "原來如此"
10145-101450400 = "那麼，汝仍願與妾身共度此夏嗎？"
10145-101450410 = "只要妃姬有所期望，不管多久都沒問題！"
10145-101450420 = "妾身明白了"
10145-101450430 = "呵呵"
10145-101450440 = "儘管老師之為人並非如此"
10145-101450450 = "仍需注意不得過於輕易道出這般言語才是"
10145-101450460 = "相傳有一蝶類，可是會終生不忘所許之約的啊"
