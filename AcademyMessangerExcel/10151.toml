[translation]
10151-101510010 = "선생님, 안녕하세요."
10151-101510020 = "183호 특별반 반장, 니키 안나입니다."
10151-101510030 = "아, 혹시 기억나지 않으신다면,"
10151-101510040 = "아카데미 수석 활동 회원, 연방 명예 발명가에……"
10151-101510050 = "안녕, 안나!"
10151-101510060 = "잊을 리가 없지!"
10151-101510070 = "기억해 주셨군요, 감사합니다!"
10151-101510080 = "다름이 아니라, 흥미로운 논문을 읽었어요."
10151-101510090 = "어린 강아지들은 서로 물고 놀잖아요?"
10151-101510100 = "그러면서 '아파!'라고 알게 되는 거래요."
10151-101510110 = "그렇지 않으면 공격적인 성향이 된다고 하더라고요!"
10151-101510120 = "사회화의 중요한 과정인 거예요."
10151-101510130 = "흥미로운 논문인걸!"
10151-101510140 = "강아지 사진도 많아서 재밌었어요."
10151-101510150 = "같이 읽어보실래요?"
10151-101510160 = "선생님, 감사합니다!"
10151-101510170 = "충분한 연구 데이터를 쌓았어요!"
10151-101510180 = "보다 설득력이 올라간 기분이네요!"
10151-101510190 = "곤란하셨을 텐데, 어울려주셔서 감사합니다."
10151-101510200 = "\"친구를 다치지 않게 하려는 안나, 기특해!\""
10151-101510210 = "\"당연히 선생님이 도와줘야지!\" "
10151-101510220 = "그, 그런 거 아니에요!"
10151-101510230 = "진짜 다치게 하면 룰 위반이니까 그런 것뿐이에요!"
10151-101510240 = "그래도,"
10151-101510250 = "항상 좋게 봐주셔서 감사합니다."
10151-101510260 = "다음에 뵙겠습니다!"
10151-101510270 = "안녕하세요 선생님, 니키 안나입니다."
10151-101510280 = "혹시 지금 핸드폰 혼자 보고 있으신가요?"
10151-101510290 = "안녕 안나! 혼자서 보는 중이야."
10151-101510300 = "그러면, 계속 혼자서 봐주세요. 다른 게 아니라"
10151-101510310 = "엄청난 대발명을 해버렸어요……."
10151-101510320 = "괜찮으시다면, 피어리뷰 부탁드려도 될까요?"
10151-101510330 = "도움이 될지는 모르겠지만, 물론이지!"
10151-101510340 = "감사합니다! 183호에서 뵐게요."
10151-101510350 = "절대로! 아무에게도 말하시면 안 돼요!"
10151-101510360 = "선생님……."
10151-101510370 = "괜찮아? 좀 진정했어!"
10151-101510380 = "네에…… 감사합니다."
10151-101510390 = "폐소공포증이 있는 건 아닌데,"
10151-101510400 = "선생님을 못 뵙게 되는 건 무서웠어요……."
10151-101510410 = "그래도 대발명을 했잖니!"
10151-101510420 = "그게, 테스트를 더 해봤는데요,"
10151-101510430 = "녹지는 않는데, 습도가 낮으면 승화해서 부서졌어요."
10151-101510440 = "그래서, 병원 건설에 도움은 주지 못하게 되었어요."
10151-101510450 = "아쉽지만 다른 발명을 생각해 보려고요."
10151-101510460 = "기운 내자! 선생님이 도와줄게!"
10151-101510470 = "포기하지 않고 남을 도우려는 거, 멋있어!"
10151-101510480 = "네! 고마워요, 선생님!"
10151-101510490 = "이걸로 임시 가건물 같은 건 만들 수 있을 테니까,"
10151-101510500 = "이 발명도, 어떤 식이건 세상에 도움이 될 거예요!"
10151-101510510 = "헤헤!"
10151-101510520 = "선생님, 니키 안나입니다."
10151-101510530 = "업무 관련된 일은 아닙니다만"
10151-101510540 = "혹시 바비큐 파티 가보신 적 있으신가요?"
10151-101510550 = "응!"
10151-101510560 = "아니, 안 가봤어!"
10151-101510570 = "그렇군요! 다름이 아니라, 이번에 해보고 싶어져서요."
10151-101510580 = "같이 바비큐 파티 어떠세요?"
10151-101510590 = "좋아!"
10151-101510600 = "좋아요! 그럼 183호에서 뵐게요!"
10151-101510610 = "선생님"
10151-101510620 = "이상하게 이해한 거 아니시죠?!"
10151-101510630 = "칭찬받으면 그러니까, 약간 저 기고만장하니까요!"
10151-101510640 = "그래서 버릇없어지고, 응석 부릴 수 있다는 그런 뜻이에요!"
10151-101510650 = "선생님께 기대하는 것도 많아질지도 모르고요!"
10151-101510660 = "그러면 안 되는 거니까요! 그렇죠!"
10151-101510670 = "딱 그 의미로 이해했는데?"
10151-101510680 = "응석 부려도 괜찮아. 학생은 그래도 돼."
10151-101510690 = "안나야? "
10151-101510700 = "선생님, 문의드릴 게 있어요."
10151-101510710 = "샬레와 공무상 협업을 요청드리고 싶은데요."
10151-101510720 = "그걸 요청드리는 걸 어디에 문의해야 할지"
10151-101510730 = "어, 그러니까 그걸 문의하는 게 가능한지는……."
10151-101510740 = "어디에 문의를 드려야"
10151-101510750 = "아……."
10151-101510760 = "안나?"
10151-101510770 = "죄송해요. 선생님. 공무상 연락하는 게 아직 어려워서……. "
10151-101510780 = "긴장했나 봐요"
10151-101510790 = "일단 협업을 요청드리고 싶은데요"
10151-101510800 = "그 협업 요청을 어디에 드려야 하는지를"
10151-101510810 = "선생님께 여쭤보아도 될까요"
10151-101510820 = "으아아아"
10151-101510830 = "발신자: 선생님, 도장: 꽝!"
10151-101510840 = "걱정 마! 선생님이 도와줄게!"
10151-101510850 = "감사합니다아……."
10151-101510860 = "선생님, 감사합니다!"
10151-101510870 = "덕분에 정리가 잘 되었어요."
10151-101510880 = "이것저것, 여러 가지 의미로요."
10151-101510890 = "너무 잘 정리되어서, 새로 뭘 더하는 게 아까울 정도!"
10151-101510900 = "새로운 것을 아깝다고 생각하지 말자!"
10151-101510910 = "그것들도 분명 즐거울 테니까! "
10151-101510920 = "앗,"
10151-101510930 = "네!"
10151-101510940 = "분명 그럴 거예요."
10151-101510950 = "잘 부탁드려요. 선생님."
