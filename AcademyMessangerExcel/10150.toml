[translation]
10150-101500010 = "一つ聞きたいことがあるんだけど"
10150-101500020 = "先生って普段メガネかけてる？"
10150-101500030 = "かけてるよ"
10150-101500040 = "かけてないよ"
10150-101500060 = "あ、私と一緒だ"
10150-101500070 = "私も目が悪いから、潜る時以外はずっとメガネをかけてるんだ"
10150-101500080 = "そっか"
10150-101500090 = "裸眼で生活できるなんて、ちょっと羨ましいな"
10150-101500100 = "私は目が悪くて、かなり前からメガネをかけてるから"
10150-101500140 = "どのくらい目が悪いの？"
10150-101500150 = "うーん……最近測ってないから分からないけど……"
10150-101500160 = "メガネを外したら、一歩も歩けないくらい……かな"
10150-101500170 = "それは大変そうだね……"
10150-101500180 = "でも、そこまで不便でもないよ"
10150-101500190 = "目に頼らなくても、危険を察知する方法はあるからね"
10150-101500200 = "先生、今って忙しい？"
10150-101500210 = "頼みたいことがあるんだけど"
10150-101500220 = "大丈夫、ちょうど休んでたところだよ"
10150-101500230 = "どうしたの、急に？"
10150-101500240 = "ごめん"
10150-101500250 = "何て書いてあるのか分からないや"
10150-101500260 = "？？？"
10150-101500270 = "変な文章になっちゃっても許してね"
10150-101500280 = "今、音声入力してるから"
10150-101500290 = "実は、先生に助けてほしくて"
10150-101500300 = "いつもの本屋さんの前にいるんだけど"
10150-101500310 = "迷子になっちゃったみたい"
10150-101500320 = "……迷子？"
10150-101500330 = "先生、さっきロードス号の前を通ってなかった？"
10150-101500340 = "オデュッセイアに用があったの？"
10150-101500350 = "うん。海上取締りのことでお願いがあって……"
10150-101500360 = "トライデントに行ってたんだ"
10150-101500370 = "シャーレの先生って、そんなことまでやるの？"
10150-101500380 = "いろいろと大変だね"
10150-101500390 = "コトネは、今日もダイビングの仕事？"
10150-101500400 = "ううん。今日は非番だよ"
10150-101500410 = "一日中、本でも読もうかなと思ってるんだ"
10150-101500420 = "ここは涼しくて気持ちいいから、本を読むにはちょうどいいんだよ"
10150-101500430 = "おすすめの休憩スペースってこと？"
10150-101500440 = "一度見てみたいな。仕事が終わったら寄ってもいい？"
10150-101500450 = "もちろん"
10150-101500460 = "私は本を読みながらのんびり待ってるから"
10150-101500470 = "近くに来たら教えて"
10150-101500480 = "先生、この豆知識知ってる？"
10150-101500490 = "シャチって社会性があるから、平均10頭くらい友達がいて"
10150-101500500 = "イルカや人と友達になることもあるんだって"
10150-101500510 = "へぇ、面白い話だね"
10150-101500520 = "でしょ？"
10150-101500530 = "でも私はそうじゃなくて……"
10150-101500540 = "部員以外だと、友達って呼べる人がほとんどいないんだよね"
10150-101500550 = "だから、時々思うんだ"
10150-101500560 = "私の交友関係って、シャチより狭いのかもって"
10150-101500570 = "うーん、あまり気にしなくていいと思うけど……"
10150-101500580 = "どうして？"
10150-101500590 = "友達は……数以上に、関係の深さが大事だから"
10150-101500600 = "ダイビング部のみんなは、お互いにとってかけがえのない親友でしょう？"
10150-101500610 = "そうだけど……"
10150-101500620 = "それでいいのかな"
10150-101500630 = "コトネがいいと思うなら、それでいいんだよ"
10150-101500640 = "それなら"
10150-101500650 = "私は、それでいいって思う"
10150-101500660 = "先生、いい知らせだよ"
10150-101500670 = "あの子から返事が来たんだ"
10150-101500680 = "それはよかった！"
10150-101500690 = "やっぱり何か事情があったの？"
10150-101500700 = "うん"
10150-101500710 = "普段はネットに張りついてる子なんだけど"
10150-101500720 = "オデュッセイアの船団がD.U.に戻ってきた時、たまたま通信機器が使えなくなってたんだって"
10150-101500730 = "たしか、副部長に没収されたとか言ってたな"
10150-101500740 = "機器を没収された？"
10150-101500750 = "なんだか厳しい雰囲気の部活だね……"
10150-101500760 = "どうだろう？そこまでは知らないけど"
10150-101500770 = "書いてあった話だと"
10150-101500780 = "シャーレに仕掛けた盗聴器が見つかって怒られたらしいよ"
10150-101500790 = "……ん？"
10150-101500800 = "盗聴器……？"
10150-101500810 = "うん。何か心当たりがあるの？"
10150-101500820 = "うーん……"
10150-101500830 = "ありすぎて、分からないかも……"
10150-101500840 = "ふーん？とにかく、先生がいなかったらずっと誤解したままだったと思う"
10150-101500850 = "本当にありがとう"
