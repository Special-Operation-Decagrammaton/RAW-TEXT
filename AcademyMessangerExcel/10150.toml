[translation]
10150-101500010 = "선생님"
10150-101500020 = "선생님은 평소에 안경 써?"
10150-101500030 = "응. 안경을 쓰는 편이야."
10150-101500040 = "눈이 나쁘지 않아서 안경은 안 써."
10150-101500060 = "나랑 같네."
10150-101500070 = "나도 눈이 나빠서 물 위에 있을 때는 계속 안경을 쓰고 다니거든."
10150-101500080 = "그렇구나."
10150-101500090 = "맨 눈으로 생활할 수 있다니 조금 부럽네."
10150-101500100 = "나는 눈이 나빠서 꽤 예전부터 안경을 썼었거든."
10150-101500140 = "\"얼마나 눈이 나쁘기에?\""
10150-101500150 = "글쎄. 오랫동안 측정해 보지 않아서 모르겠는데……"
10150-101500160 = "안경을 벗으면 한 발자국도 걸을 수 없는 수준이랄까."
10150-101500170 = "고생이 많겠네……"
10150-101500180 = "그래도 생각만큼 불편하진 않아."
10150-101500190 = "시력 말고도 위험을 감지하는 방법은 여럿 있으니까"
10150-101500200 = "선생님"
10150-101500210 = "혹시 지금 많이 바빠?"
10150-101500220 = "아니, 마침 쉬던 중이었어."
10150-101500230 = "갑자기 왜?"
10150-101500240 = "음"
10150-101500250 = "뭐라고 써 있는지 하나도 모르겠는데"
10150-101500260 = "???"
10150-101500270 = "멋대로 말하더라도 양해해 줘"
10150-101500280 = "지금 음성 인식 기능으로 모모톡을 쓰는 중이라"
10150-101500290 = "선생님의 도움이 필요해"
10150-101500300 = "평소에 자주 가던 책방 앞인데"
10150-101500310 = "미아가 되어버린 것 같아"
10150-101500320 = "……미아?"
10150-101500330 = "선생님, 아까 로도스 호의 현측 앞에서 지나가는 걸 본 것 같은데"
10150-101500340 = "혹시 오늘 오디세이아 학원에 왔었어?"
10150-101500350 = "응. 해양 단속 관련으로 부탁할 게 있어서……"
10150-101500360 = "트라이던트에 볼 일이 있었거든."
10150-101500370 = "샬레의 선생님은 그런 일까지 하는 거야?"
10150-101500380 = "여러모로 고생이 많네."
10150-101500390 = "코토네도 배 위에 있었다니, 오늘도 다이빙 일이 있는 거야?"
10150-101500400 = "아니. 나는 오늘 비번이거든."
10150-101500410 = "하루종일 책이나 읽으면서 보내려고."
10150-101500420 = "여기가 서늘하고 시원해서 책 읽기에는 좋아."
10150-101500430 = "코토네가 추천하는 휴식 장소라니 궁금해지는 걸."
10150-101500440 = "일 끝나고 한 번 들려도 돼?"
10150-101500450 = "물론이야"
10150-101500460 = "나는 느긋하게 책을 읽으며 기다리고 있을테니"
10150-101500470 = "근처에 오면 알려줘"
10150-101500480 = "선생님 그거 알아?"
10150-101500490 = "범고래는 사회적인 동물이라서 평균적으로 10명의 친구를 두고"
10150-101500500 = "가끔은 다른 돌고래나 사람과 친구 관계를 맺기도 한대."
10150-101500510 = "그것 참 신기한 사실이네."
10150-101500520 = "그렇지?"
10150-101500530 = "그런데 나는 친구가 많지 않은 편이라서"
10150-101500540 = "부원들 외에는 친구라 할 사람이 거의 없거든"
10150-101500550 = "그래서 가끔은 이런 생각을 하곤 해"
10150-101500560 = "내 인간 관계는 범고래 이하인게 아닐까, 하고."
10150-101500570 = "글쎄. 그건 그리 신경 쓸 필요는 없는 것 같은데."
10150-101500580 = "어째서?"
10150-101500590 = "친구 관계에서 중요한 건 숫자보다 사귐의 깊이니까."
10150-101500600 = "다이빙부의 부원들은 서로에게 있어 둘도 없는 절친이잖아?"
10150-101500610 = "그렇긴 하지만"
10150-101500620 = "그걸로 괜찮은걸까"
10150-101500630 = "스스로가 괜찮다면 괜찮은 거지"
10150-101500640 = "그럼"
10150-101500650 = "나는 괜찮다고 생각해."
10150-101500660 = "선생님, 좋은 소식이야."
10150-101500670 = "전에 말했던 그 친구에게 답장이 왔어"
10150-101500680 = "다행이네."
10150-101500690 = "역시 무슨 사정이 있었던 모양이지?"
10150-101500700 = "응."
10150-101500710 = "평소에는 인터넷을 늘 끼고 사는 친구였는데"
10150-101500720 = "우연찮게 오디세이아의 선단이 D.U.에 돌아왔을 때 통신 기기를 못쓰게 되었대"
10150-101500730 = "부장에게 압수당했다나 뭐라나"
10150-101500740 = "부장에게 기기를 압수당했다고?"
10150-101500750 = "뭔가 엄격한 분위기의 동아리인가 보네……"
10150-101500760 = "글쎄. 그것까진 듣지 못했는데"
10150-101500770 = "답장에 적힌 이야기로는"
10150-101500780 = "샬레에 설치한 도청기를 걸리는 바람에 크게 혼이 났다고"
10150-101500790 = "으응?"
10150-101500800 = "도청기……?"
10150-101500810 = "응. 뭔가 아는 거라도 있어?"
10150-101500820 = "글쎄……"
10150-101500830 = "짚이는 게 너무 많아서 오히려 모르겠는걸."
10150-101500840 = "여하튼 선생님이 아니었더라면 계속 오해를 할 뻔 했어."
10150-101500850 = "고마워, 선생님."
