10138-101380320 = "blurry photo of your arm"
10138-101380330 = "in one of them"
10138-101380340 = "What'd you tell them??"
10138-101380350 = "I couldn't say that it was you!!"
10138-101380360 = "So I just told them it was a ghost"
10138-101380370 = "UUUGGGHHHHHHH"
10138-101380380 = "I told them!!!"
10138-101380390 = "That ghosts exist!!!"
10138-101380400 = "WITH MY OWN LIPS!!!"
10138-101380410 = "And my seniors are"
10138-101380420 = "freaking out!!! saying this is the hidden seventh mystery!"
10138-101380430 = "Auuuuugh!!"
10138-101380440 = "I swear...!"
10138-101380450 = "Next time for sure...!"
10138-101380460 = "Let's...keep doing our best..."
10138-101380470 = "Sensei. Remember what happened last time?"
10138-101380480 = "When your arm was in a photo"
10138-101380490 = "and I told my upperclassmen"
10138-101380500 = "that it was a ghost?"
10138-101380510 = "Yeah. Sorry about that..."
10138-101380520 = "Why are you apologizing?"
10138-101380530 = "It's my fault for taking bad photos."
10138-101380540 = "Look, because of that"
10138-101380550 = "the girls said"
10138-101380560 = "I need to make myself an omamori."
10138-101380570 = "Which is why I'm gonna"
10138-101380580 = "make you one too, while I'm at it."
10138-101380590 = "...An omamori for me?? MADE BY YOU??"
10138-101380600 = "HEY!!!!"
10138-101380610 = "DON'T MAKE A BIG DEAL OUT OF IT!"
10138-101380620 = "I don't even know why I need to do this!"
10138-101380630 = "Ugh. Anyway! Drop by the school when you have time."
10138-101380640 = "I'm on my way! I'll be there this afternoon!"
10138-101380650 = "Sensei..."
10138-101380660 = "Nothing weird happened on the way home, right?"
10138-101380670 = "Like... I don't know, stepping on more gum?"
10138-101380680 = "All good! Thanks to your omamori!"
10138-101380690 = "Not that I'm superstitious or anything..."
10138-101380700 = "But keep it with you."
10138-101380710 = "Because I gave it to you."
10138-101380720 = "Got it?"
10138-101380730 = "Yeah. Since it's made with your feelings."
10138-101380740 = "YOU!! Stop saying weird stuff!"
10138-101380750 = "I'll see ya next time! Maybe!"
10138-101380760 = "Sensei. Are you coming to Wildhunt today?"
10138-101380770 = "Yeah. Do you want a chocolate-banana crepe or something?"
10138-101380780 = "I-I'm fine!"
10138-101380790 = "I actually need something else."
10138-101380800 = "I ran out of accessory materials again."
10138-101380810 = "Because there was a terrorist attack at the shop..."
10138-101380820 = "A WHAT? What kind?"
10138-101380830 = "Someone drew a bunch of weird drawings"
10138-101380840 = "all over the store wall."
10138-101380850 = "So it's closed until that's sorted out."
10138-101380860 = "sighhh"
10138-101380870 = "So, please do me this favor."
10138-101380880 = "I'll pick up a crepe too!"
10138-101380890 = "...Do whatever you want!"
