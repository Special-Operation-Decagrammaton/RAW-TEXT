[translation]
10138-101380010 = "Sensei. You're coming to our academy today, right?"
10138-101380020 = "Yeah. For some field work. Just an inspection."
10138-101380030 = "Ah, perfect."
10138-101380040 = "Can you bring me some materials then?"
10138-101380050 = "They don't sell what I need at the academy store."
10138-101380060 = "Is this...a SMUGGLING request?"
10138-101380070 = "Don't say it like that!"
10138-101380080 = "They're not contraband!"
10138-101380090 = "They won't even get flagged during inspection."
10138-101380100 = "I'll send you the list, okay?"
10138-101380110 = "So just... Please! Do me a favor!"
10138-101380120 = "Sensei? Did you get back okay?"
10138-101380130 = "They didn't rip again or anything, did they?"
10138-101380140 = "Yeah! Your repairs were very sturdy!"
10138-101380150 = "You owe me one for that."
10138-101380160 = "You better pay me back later!"
10138-101380170 = "I was so relieved it was you, Rena!"
10138-101380180 = "I wasn't relieved at all, you know?!"
10138-101380190 = "Whatever. I'm glad that you made it back okay."
10138-101380200 = "Talk to you later."
10138-101380210 = "Hey, remember how you still owe me one? From last time?"
10138-101380220 = "The time has come for you to pay me back."
10138-101380230 = "How...exactly?"
10138-101380240 = "It's too complicated to explain here."
10138-101380250 = "Just come meet me."
10138-101380260 = "I'll send you the place and time."
10138-101380270 = "Sensei... I'm doomed."
10138-101380280 = "Hm? Why?"
10138-101380290 = "I found my roommates"
10138-101380300 = "and showed them the photos..."
