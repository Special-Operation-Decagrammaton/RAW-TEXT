[translation]
10138-101380010 = "คุณครู วันนี้จะมาไวลด์ฮันต์ใช่มั้ย?"
10138-101380020 = "อื้อ วันนี้มีไปดูงานง่ายๆ น่ะ"
10138-101380030 = "อ๊ะ งั้นก็ดีเลย"
10138-101380040 = "งั้นฉันฝากซื้อวัสดุทำเครื่องประดับ\n2-3 อย่างได้มั้ย?"
10138-101380050 = "ฉันจำเป็นต้องใช้ แต่ร้านค้าที่นี่ไม่มี\nขายน่ะ"
10138-101380060 = "นี่คือ... การลักลอบขนส่งสินค้า\nหรือเปล่า?"
10138-101380070 = "ลักลอบอะไรกันล่ะ!"
10138-101380080 = "มันไม่ใช่ของแปลกๆ สักหน่อย!"
10138-101380090 = "ยังไงก็ต้องผ่านด่านตรวจอยู่แล้ว!"
10138-101380100 = "เอาเป็นว่าฉันจะส่งลิสต์ไปให้"
10138-101380110 = "ฝากซื้อมาให้ด้วยนะ!"
10138-101380120 = "คุณครู? ถึงห้องปลอดภัยดีมั้ย?"
10138-101380130 = "ไม่ได้มีตรงไหนขาดอีกใช่มั้ย?"
10138-101380140 = "อื้อ! ไม่มีปัญหาเลย!"
10138-101380150 = "ครั้งนี้คุณครูติดหนี้ฉันแล้วนะ"
10138-101380160 = "อย่าลืมมาตอบแทนกันด้วยล่ะ!"
10138-101380170 = "โชคดีนะเนี่ยที่บังเอิญเจอเรนะเข้า"
10138-101380180 = "แต่นั่นไม่ใช่โชคดีของฉันสักหน่อย!"
10138-101380190 = "พอรู้ว่ากลับไปถึงแล้วก็โล่งอกไปทีนะ"
10138-101380200 = "ไว้คราวหน้าจะติดต่อไปใหม่แล้วกัน"
10138-101380210 = "ยังไม่ลืมที่เคยติดหนี้ฉันไว้ใช่มั้ย?"
10138-101380220 = "ในที่สุดก็ถึงเวลาใช้หนี้แล้วละ"
10138-101380230 = "ให้ครูทำอะไรให้เหรอ?"
10138-101380240 = "เรื่องมันยาวจนฉันพิมพ์แชตไม่ไหว"
10138-101380250 = "เอาเป็นว่าออกมาก่อนแล้วกัน"
10138-101380260 = "ฉันจะส่งเวลากับสถานที่ไปให้"
10138-101380270 = "คุณครู... แย่แล้วละ"
10138-101380280 = "หืม? เกิดอะไรขึ้นเหรอ?"
10138-101380290 = "ฉันกลับมา"
10138-101380300 = "แล้วเอารูปให้รุ่นพี่ดู..."
10138-101380310 = "แต่มันมีรูปหนึ่ง"
10138-101380320 = "ที่ถ่ายติดแขนของคุณครู"
10138-101380330 = "รางๆ ด้วยน่ะ..."
10138-101380340 = "ละ... แล้วทำยังไงเหรอ?"
10138-101380350 = "ฉันบอกไม่ได้ว่าไปกับคุณครูมา"
10138-101380360 = "ก็เลยบอกว่าเป็นรูปถ่ายติดวิญญาณ..."
10138-101380370 = "ว้ากกก!!"
10138-101380380 = "ฉันเผลอพูดว่า!!"
10138-101380390 = "วิญญาณมีจริง!!"
10138-101380400 = "จากปากของตัวเองไปจนได้!!"
10138-101380410 = "พวกรุ่นพี่เลยบอกว่านี่คือ"
10138-101380420 = "เรื่องลึกลับสุดท้ายที่ซ่อนอยู่\nแล้วก็โวยวายกันใหญ่เลย!"
10138-101380430 = "ฮึ่ยยยยยยย...!!"
10138-101380440 = "คอยดูนะ...!"
10138-101380450 = "คราวหน้าฉันจะไม่พลาดเลย...!!"
10138-101380460 = "มะ... มาพยายามไปด้วยกันนะ..."
10138-101380470 = "คุณครู จำเรื่องคราวก่อนได้มั้ย?"
10138-101380480 = "ที่มีรูปถ่ายติดแขนคุณครู"
10138-101380490 = "แล้วฉันก็บอกพวกรุ่นพี่ว่า"
10138-101380500 = "เป็นรูปถ่ายติดวิญญาณน่ะ"
10138-101380510 = "อื้อ ครูขอโทษนะ..."
10138-101380520 = "ทำไมถึงขอโทษล่ะ?"
10138-101380530 = "มันเป็นความผิดของฉันที่ถ่ายรูปไม่ดี\nต่างหาก"
10138-101380540 = "แต่ก็เอาเถอะ พอเกิดเรื่องนั้น"
10138-101380550 = "พวกรุ่นพี่ก็เลยบอกว่า"
10138-101380560 = "ฉันต้องทำโอมาโมริขึ้นมาเองน่ะ"
10138-101380570 = "แล้วไหนๆ ฉันก็จะทำแล้ว"
10138-101380580 = "ก็เลยอยากทำให้คุณครูด้วยอันหนึ่ง"
10138-101380590 = "เรนะ... จะทำโอมาโมริเนี่ยนะ?"
10138-101380600 = "ฮึ่ยยย!"
10138-101380610 = "อย่าถามแซวกันสิ!"
10138-101380620 = "ฉันเองก็ไม่รู้เหมือนกันว่าทำไมถึง\nต้องทำด้วย!"
10138-101380630 = "เอาเป็นว่าถ้ามีเวลาก็แวะมาที่นี่นะ"
10138-101380640 = "งั้นครูจะไปหาบ่ายนี้เลย!"
10138-101380650 = "คุณครู คือว่า..."
10138-101380660 = "ไม่ได้เจอเรื่องแปลกๆ อีกใช่มั้ย?"
10138-101380670 = "อย่างเช่นเดินเหยียบหมากฝรั่ง..."
10138-101380680 = "อื้อ! ได้โอมาโมริจากเรนะ\nช่วยปกป้องไว้น่ะ!"
10138-101380690 = "ถึงฉันจะไม่เชื่อว่ามันจะได้ผลอะไร..."
10138-101380700 = "แต่ยังไงก็พกติดตัวไว้ล่ะ"
10138-101380710 = "ก็นั่นเป็นของที่ฉันให้ไว้นี่นา"
10138-101380720 = "เข้าใจมั้ย?"
10138-101380730 = "อื้อ นี่คือหัวใจของเรนะนี่เนอะ"
10138-101380740 = "พอเลย พูดอะไรเพ้อเจ้ออีกแล้ว!"
10138-101380750 = "ไว้เจอกันคราวหน้าแล้วกัน!"
10138-101380760 = "คุณครู วันนี้จะมาไวลด์ฮันต์ใช่มั้ย?"
10138-101380770 = "อื้อ ให้ซื้อเครปช็อกโกบานาน่า\nไปด้วยมั้ย?"
10138-101380780 = "มะ... ไม่เป็นไร!"
10138-101380790 = "ฉันอยากขอร้องเรื่องอื่นมากกว่าน่ะ"
10138-101380800 = "พอดีวัสดุทำเครื่องประดับของฉัน\nหมดอีกแล้ว"
10138-101380810 = "แล้วครั้งนี้ก็ยังมีคนมาก่อการร้ายที่\nร้านค้าอีก..."
10138-101380820 = "ก่อการร้าย? ก่อการร้ายอะไรเหรอ?"
10138-101380830 = "มีคนมาวาดภาพแปลกๆ"
10138-101380840 = "ไว้เต็มผนังร้านเลยน่ะสิ"
10138-101380850 = "ร้านก็เลยปิดไปก่อนชั่วคราวจนกว่าจะ\nฟื้นฟูเสร็จ"
10138-101380860 = "เฮ้อ..."
10138-101380870 = "งั้นฉันรบกวนด้วยนะ"
10138-101380880 = "เดี๋ยวครูซื้อเครปช็อกโกบานาน่า\nไปให้ด้วย!"
10138-101380890 = "กะ... ก็ได้ ตามใจแล้วกัน!"
