[translation]
10138-101380010 = "老師，你說過今天會來我們學院吧？"
10138-101380020 = "嗯，是簡單的現場調查工作"
10138-101380030 = "啊，太好了"
10138-101380040 = "那麻煩你幫我買一些飾品的材料吧"
10138-101380050 = "學院裡的商店沒有賣我需要的東西"
10138-101380060 = "這是……走私的委託？"
10138-101380070 = "什麼走私！"
10138-101380080 = "不是奇怪的材料！"
10138-101380090 = "檢查的時候也不會被攔住！"
10138-101380100 = "總之我會發清單給你"
10138-101380110 = "來的路上拜託了！"
10138-101380120 = "老師，平安到家了嗎？"
10138-101380130 = "沒有再破掉吧？"
10138-101380140 = "嗯！很結實！"
10138-101380150 = "這次你欠我一個人情哦"
10138-101380160 = "下次一定要還！"
10138-101380170 = "在路上遇到的是玲奈真是太好了"
10138-101380180 = "我才不覺得好呢！？"
10138-101380190 = "總之，你有平安回去我就放心了"
10138-101380200 = "下次再聯絡囉"
10138-101380210 = "上次欠我的沒忘吧？"
10138-101380220 = "到了該報恩的時候了"
10138-101380230 = "我要做什麼呢？"
10138-101380240 = "用文字說明太麻煩了"
10138-101380250 = "總之你先出來"
10138-101380260 = "在我指定的時間和地點見面吧"
10138-101380270 = "老師……完了"
10138-101380280 = "嗯？突然怎麼了？"
10138-101380290 = "回去給前輩們"
10138-101380300 = "看照片的時候……"
10138-101380310 = "有一張"
10138-101380320 = "隱約拍到"
10138-101380330 = "老師手臂的照片"
10138-101380340 = "然，然後呢？"
10138-101380350 = "因為沒辦法說是和老師一起去的"
10138-101380360 = "就說那是幽靈搪塞過去了……"
10138-101380370 = "嚇啊啊啊──！！"
10138-101380380 = "從我的嘴巴！！"
10138-101380390 = "說了有幽靈！！"
10138-101380400 = "我自己說了有幽靈！！"
10138-101380410 = "然後前輩們就在那邊瞎起鬨"
10138-101380420 = "說這是隱藏的第七個不可思議！"
10138-101380430 = "啊啊啊啊啊啊……！！"
10138-101380440 = "給我等著……！"
10138-101380450 = "下次我一定……！！"
10138-101380460 = "一，一起加油吧……"
10138-101380470 = "老師，還記得上次的事嗎？"
10138-101380480 = "照片裡拍到的老師的手臂"
10138-101380490 = "我跟前輩們說"
10138-101380500 = "那是幽靈而搪塞過去的事"
10138-101380510 = "嗯。抱歉……"
10138-101380520 = "為什麼要道歉？"
10138-101380530 = "是我沒拍好的錯"
10138-101380540 = "總之因為那件事"
10138-101380550 = "前輩們說要我親手"
10138-101380560 = "做御守"
10138-101380570 = "所以就想說"
10138-101380580 = "順便也幫老師做一個"
10138-101380590 = "玲奈……要做御守？"
10138-101380600 = "啊啊啊！"
10138-101380610 = "不要問！"
10138-101380620 = "我也不知道為什麼要做！"
10138-101380630 = "總之有空的時候來我們學院吧"
10138-101380640 = "那我今天下午就過去！"
10138-101380650 = "老師，那個……"
10138-101380660 = "沒有再發生什麼奇怪的事吧？"
10138-101380670 = "像是踩到口香糖之類的"
10138-101380680 = "嗯！多虧了玲奈的御守！"
10138-101380690 = "雖然我不怎麼相信……"
10138-101380700 = "但是老師要一直帶著哦"
10138-101380710 = "因為是我給的"
10138-101380720 = "知道了吧？"
10138-101380730 = "嗯！畢竟是玲奈的心意嘛"
10138-101380740 = "又，又說奇怪的話！"
10138-101380750 = "總之下次再見！"
10138-101380760 = "老師，今天會來我們學院吧？"
10138-101380770 = "嗯，需要幫你帶巧克力香蕉可麗餅嗎？"
10138-101380780 = "不，不用了！"
10138-101380790 = "我有別的事想拜託你"
10138-101380800 = "飾品材料又用完了"
10138-101380810 = "這次是有人恐攻商店……"
10138-101380820 = "恐攻？什麼恐攻？"
10138-101380830 = "有人在店家的牆上"
10138-101380840 = "畫了一堆奇怪的圖"
10138-101380850 = "所以在清理完之前得暫時關門"
10138-101380860 = "唉……"
10138-101380870 = "總之拜託你了"
10138-101380880 = "巧克力香蕉可麗餅我也會帶去的！"
10138-101380890 = "隨，隨便你！"
