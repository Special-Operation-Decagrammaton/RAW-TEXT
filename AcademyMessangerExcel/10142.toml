[translation]
10142-101420010 = "สวัสดี คุณครู"
10142-101420020 = "เห็นว่าติดต่อมา มีเรื่องอะไรหรือเปล่า?"
10142-101420030 = "ครูห่วงว่านางุสะจะเป็นยังไง\nในอากาศร้อนแบบนี้น่ะ"
10142-101420040 = "อ่า... อื้อ"
10142-101420050 = "ขอบคุณที่เป็นห่วงนะ"
10142-101420060 = "ฉันไม่เป็นไรหรอก ช่วงนี้ฉันก็คอยหา\nเวลาไปหลบร้อนอยู่น่ะ"
10142-101420070 = "ไปทะเลเหรอ?"
10142-101420080 = "หรือว่าไปเล่นที่สวนน้ำ?"
10142-101420090 = "เอ่อ..."
10142-101420100 = "ไปฝึกยิงปืนตามปกติต่างหาก"
10142-101420110 = "แต่พอใช้ปืนฉีดน้ำ มันก็ต่างออกไปนะ"
10142-101420120 = "งั้นมันก็เป็น... การเล่นปืนฉีดน้ำ?"
10142-101420130 = "ถ้าจะเรียกอย่างนั้น... ก็อาจจะใช่นะ"
10142-101420140 = "คุณครู คือว่า..."
10142-101420150 = "ที่ผ่านมาฉันคงกังวลไปเกินกว่าเหตุน่ะ"
10142-101420160 = "สมาชิกในชมรมพูดเหมือนกับที่คุณครู\nพูดไว้เป๊ะเลย"
10142-101420170 = "ทุกคนบอกว่าคนอื่นไม่ได้อึดอัดเวลา\nฉันใส่ชุดว่ายน้ำ"
10142-101420180 = "ถูกต้องเลย! อย่ากังวลไปเลยนะ"
10142-101420190 = "อื้อ"
10142-101420200 = "เพราะงั้น คราวหน้า..."
10142-101420210 = "ฉันว่าจะไปทะเลกับสมาชิกทุกคนดู"
10142-101420220 = "มันต้องเป็น... ช่วงเวลาที่สนุกแน่นอน\nเลยละ"
10142-101420230 = "เป็นความคิดที่ดีเลย! อย่าลืมทา\nครีมกันแดดด้วยล่ะ!"
10142-101420240 = "อื้อ ขอบคุณนะ คุณครู"
10142-101420250 = "พอได้ไปเที่ยวทะเลกับสมาชิกใน\nชมรมมา..."
10142-101420260 = "หมู่นี้พอมีเวลา ฉันก็แวะไปชายหาด\nตลอดเลย"
10142-101420270 = "ไปทะเลแล้วสนุกใช่มั้ยล่ะ?"
10142-101420280 = "อื้อ สนุกมากเลย"
10142-101420290 = "การว่ายน้ำช่วยเรื่องการฝึกฝนร่างกาย\nได้ด้วย"
10142-101420300 = "แถมยังช่วยขจัดความคิดฟุ้งซ่านได้ดี\nเลยละ"
10142-101420310 = "แล้วทะเลก็มีเสน่ห์เฉพาะตัวด้วย"
10142-101420320 = "ทำไมฉันเพิ่งจะมาเริ่มไปทะเลเอา\nตอนนี้นะ?"
10142-101420330 = "จากนี้ไปแค่ไปให้บ่อยขึ้นก็ได้นี่นา!"
10142-101420340 = "อื้อ... นั่นสินะ"
10142-101420350 = "ต้องไปทะเลให้บ่อยกว่านี้แล้วละ"
10142-101420360 = "อืม..."
10142-101420370 = "ข่าวลือที่ว่ามีสาวหิมะมาปรากฏตัว\nบนชายหาด เหมือนจะยังแพร่สะพัด\nอยู่เลย"
10142-101420380 = "ขืนเที่ยวตามแก้ข่าวกับทุกคน มีหวัง\nจะยิ่งทำให้เข้าใจผิดกันไปใหญ่"
10142-101420390 = "ฉันควรทำยังไงดีล่ะ?"
10142-101420400 = "ไปทะเลด้วยกันอีกเรื่อยๆ ไง!"
10142-101420410 = "ถ้าฉันแสดงตัวตนที่แท้จริงว่าไม่ใช่\nสาวหิมะ"
10142-101420420 = "ข่าวลือแปลกๆ ก็จะหายไปด้วย\nงั้นเหรอ?"
10142-101420430 = "อื้อ... เข้าใจแล้ว"
10142-101420440 = "ทั้งหมดนี้ก็เพื่อนางุสะนะ"
10142-101420450 = "..."
10142-101420460 = "คุณครูเนี่ย ใช่ย่อยเลยนะ"
10142-101420470 = "ทำไมล่ะ?!"
10142-101420480 = "วันนี้ฉันบังเอิญได้ยินเรื่องแบบนี้\nระหว่างทางกลับบ้านน่ะ"
10142-101420490 = "ว่ากันว่าข่าวลือที่บอกว่าสาวหิมะ\nมาปรากฏตัวที่ชายหาด..."
10142-101420500 = "มันเป็นข่าวโคมลอยทั้งนั้น"
10142-101420510 = "โอ้ แผนการสำเร็จแล้วสินะ!"
10142-101420520 = "อื้อ สำเร็จแล้ว"
10142-101420530 = "จากนี้ฉันก็ไปทะเลอย่างสบายใจได้\nแล้วละ"
10142-101420540 = "จะไปกับครูอีกใช่มั้ย?"
10142-101420550 = "..."
10142-101420560 = "อื้อ"
10142-101420570 = "ไว้ไปด้วยกันอีกนะ"
10142-101420580 = "คุณครู ได้ยินว่าอากาศสัปดาห์นี้\nเหมาะสำหรับกิจกรรมกลางแจ้ง"
10142-101420590 = "เพราะงั้น..."
10142-101420600 = "สุดสัปดาห์นี้พอจะมีเวลามั้ย?"
10142-101420610 = "ได้อยู่แล้ว!"
10142-101420620 = "ครูว่าจะถามอยู่พอดีเลย!"
10142-101420630 = "งั้นเราไปเที่ยวทะเลด้วยกันอีกนะ"
10142-101420640 = "ฉันรู้สึกว่าครั้งนี้ก็ต้องมีเรื่องสนุกๆ\nเกิดขึ้นแน่นอน"
