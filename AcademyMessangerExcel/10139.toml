[translation]
10139-101390010 = "您好，這裡是「FOX EATS」！"
10139-101390020 = "您訂購的餐點預計將於10分鐘後送達目的地"
10139-101390030 = "為了準確送達，請再次確認地址是否正確"
10139-101390040 = "FOX EATS？"
10139-101390050 = "我不記得有訂餐啊？"
10139-101390060 = "請放心，費用已經支付完畢了！"
10139-101390070 = "還請老師舒適地坐在位置上，\n好好享用FOX EATS準備的宵夜"
10139-101390080 = "你怎麼會知道我還沒吃晚餐？"
10139-101390090 = "呵呵，這個嘛……自然有辦法的"
10139-101390100 = "不過這是FOX EATS的商業機密哦"
10139-101390110 = "話說回來，之前好像也發生過類似的事……"
10139-101390120 = "餐點即將送達"
10139-101390130 = "為了安全起見，請盡量遠離大門，並做好應對突如其來衝擊的準備"
10139-101390140 = "好可怕！！"
10139-101390150 = "老師"
10139-101390160 = "昨天我放進冰箱裡的豆皮壽司，您都吃完了嗎？"
10139-101390170 = "嗯，吃完了"
10139-101390180 = "因為太好吃了，所以就一口氣全部吃光了……"
10139-101390190 = "那真是太好了"
10139-101390200 = "豆皮壽司果然還是稍微放涼一點更好吃呢"
10139-101390210 = "下次有機會的話，我會再做豆皮壽司給您的"
10139-101390220 = "不過，可別因為這樣就故意餓著肚子不吃飯哦"
10139-101390230 = "我會牢記在心的"
10139-101390240 = "老師，請問您今天下午有空嗎？"
10139-101390250 = "嗯，那時候剛好有空"
10139-101390260 = "怎麼突然這麼問？"
10139-101390270 = "那個……原本今天下午預定要進行「特殊補給作戰」的"
10139-101390280 = "但小隊成員都有其他事情在身，所以沒辦法過來……"
10139-101390290 = "老師是否能協助這次的作戰呢？"
10139-101390300 = "當然囉！"
10139-101390310 = "不過，有什麼是我能幫上忙的嗎？"
10139-101390320 = "我對特殊作戰一無所知耶"
10139-101390330 = "沒關係的，因為這並不是那麼危險的作戰"
10139-101390340 = "……應該吧"
10139-101390350 = "應該！？"
10139-101390360 = "老師"
10139-101390370 = "您是否聽過「可能出錯的問題就必定會出錯」……這句格言呢？"
10139-101390380 = "你說的是墨菲定律，對吧"
10139-101390390 = "工作的時候經常會聽到呢"
10139-101390400 = "是的，許多人都對這句話深有同感呢"
10139-101390410 = "我曾經也因為粗心大意，疏忽了每天都要執行的裝備檢查"
10139-101390420 = "偏偏那天就發生了安全事故，讓我吃了不少苦頭，至今記憶猶新"
10139-101390430 = "怎麼偏偏就在我出錯的那天發生了事故呢"
10139-101390440 = "我也有過不少這樣的經驗呢"
10139-101390450 = "巧合總是會在令人哭笑不得的時機發生啊"
10139-101390460 = "那時候，我讀了相關的書籍才知道"
10139-101390470 = "其實這種定律，只是因為人們對負面記憶比正面記憶的印象更深刻"
10139-101390480 = "就算出了錯，只要沒發生任何事，就會從記憶中被抹去"
10139-101390490 = "原來如此，原來是有科學根據的呢"
10139-101390500 = "不過還是有點可惜呢……"
10139-101390510 = "如果可以的話，要是正面的記憶能留得更久就好了"
10139-101390520 = "不過我覺得記住負面的記憶反而更好"
10139-101390530 = "因為這樣可以把失誤當作教訓，下次才能做得更好嘛"
10139-101390540 = "老師"
10139-101390550 = "夏萊的倉庫裡堆滿了雨傘"
10139-101390560 = "那些全部都是夏萊的物品嗎？"
10139-101390570 = "那些是值日的學生留下來的遺失物哦"
10139-101390580 = "不知不覺就堆了那麼多呢……"
10139-101390590 = "原來如此"
10139-101390600 = "在回去的時候要是沒下雨，就很容易忘記雨傘呢"
10139-101390610 = "不過大部分都沒有寫上名字"
10139-101390620 = "要找到失主可得費上一番功夫呢"
10139-101390630 = "之後寫個公告，請失主來認領吧"
10139-101390640 = "好的"
10139-101390650 = "老師也是，為了在東西弄丟時容易找回來，請記得在自己的物品上寫上名字"
10139-101390660 = "不對"
10139-101390670 = "這樣反而可能會有反效果呢"
10139-101390680 = "為什麼！？"
10139-101390690 = "老師，這次的假日有什麼特別的安排嗎？"
10139-101390700 = "應該就只是在辦公室休息吧……"
10139-101390710 = "仁子有什麼特別的安排嗎？"
10139-101390720 = "我這個週末也沒有什麼特別的安排，所以想嘗試一些新事物"
10139-101390730 = "老師，這個週末能不能把夏萊的調理室借給我使用呢？"
10139-101390740 = "我想在這個週末試著做一些作戰需要的野戰口糧"
10139-101390750 = "調理室你隨意使用沒關係……"
10139-101390760 = "不過……野戰口糧？"
10139-101390770 = "是的。是不易腐壞，味道也幾乎不變的野戰口糧"
10139-101390780 = "有點讓人感興趣呢"
10139-101390790 = "是用什麼材料做的呢？"
10139-101390800 = "呵呵，完成之後，我再直接拿給您看吧"
