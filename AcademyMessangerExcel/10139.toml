[translation]
10139-101390010 = "Hello, this is FOX EATS!"
10139-101390020 = "Your delivery will arrive in about 10 minutes!"
10139-101390030 = "Can you please confirm your address?"
10139-101390040 = "FOX EATS? You might have the wrong number..."
10139-101390050 = "I didn't order any food..."
10139-101390060 = "This one is complementary! On the house!"
10139-101390070 = "So just kick back for once, and enjoy this special, late-night dinner, courtesy of FOX EATS!"
10139-101390080 = "But how'd you know I haven't had dinner yet?"
10139-101390090 = "Fufu, we have our ways."
10139-101390100 = "It's FOX EATS' trade secret."
10139-101390110 = "I'm getting a feeling of deja vu..."
10139-101390120 = "Your food is almost there!"
10139-101390130 = "For your safety, please step back from the door and brace for impact!"
10139-101390140 = "What kind of food delivery...?!"
10139-101390150 = "Sensei"
10139-101390160 = "Did you finish the inarizushi I left in the fridge yesterday?"
10139-101390170 = "Yeah. I did."
10139-101390180 = "It was so delicious, I ate the whole thing in one go."
10139-101390190 = "I'm glad."
10139-101390200 = "Inarizushi tastes best once it's had a chance to sit a little."
10139-101390210 = "Next time I get the chance, I'll make you more!"
10139-101390220 = "But don't you start skipping meals because you'll think I'll come feed you!"
10139-101390230 = "Yes, ma'am."
10139-101390240 = "Sensei, do you have some spare time this afternoon?"
10139-101390250 = "I actually happen to be free today."
10139-101390260 = "Is there anything I can help with?"
10139-101390270 = "So, we have a special supply op scheduled in a few hours..."
10139-101390280 = "But none of the other squad members can make it anymore."
10139-101390290 = "Could you step in for them, please?"
10139-101390300 = "Whatever you need!"
10139-101390310 = "What will I need to do?"
10139-101390320 = "I don't know if I can keep up with your special operations!"
10139-101390330 = "Don't worry yourself. It won't be dangerous!"
10139-101390340 = "...Probably."
10139-101390350 = "Probably?!"
10139-101390360 = "Sensei"
10139-101390370 = "Have you heard the adage, \"Anything that can go wrong, will go wrong\"?"
10139-101390380 = "You mean Murphy's Law."
10139-101390390 = "I hear it at work a lot."
10139-101390400 = "Yes. I think most people regard it as true."
10139-101390410 = "Once, I forgot to do our daily equipment checks..."
10139-101390420 = "And on THAT day, an accident happened, and I got in trouble."
10139-101390430 = "I seriously couldn't believe a safety failure occurred on the ONE day I forgot."
10139-101390440 = "Don't worry, it happens to the best of us. Even me!"
10139-101390450 = "That's why they say there's no such thing as a coincidence!"
10139-101390460 = "But I read this recently in a book:"
10139-101390470 = "It seems this way, because we tend to remember bad memories over the good ones."
10139-101390480 = "So the times you make a mistake and nothing happens, you're less likely to remember it."
10139-101390490 = "Ah! So there's a scientific explanation."
10139-101390500 = "Still, it's a bit of a shame..."
10139-101390510 = "I wish good memories lasted longer."
10139-101390520 = "But I think there's good reason for us to remember the bad ones."
10139-101390530 = "You can learn from your mistakes and do better next time that way."
10139-101390540 = "Sensei."
10139-101390550 = "There were a bunch of umbrellas in Schale's storage room."
10139-101390560 = "Do they all belong to Schale?"
10139-101390570 = "Most of them are from Student Reps forgetting them."
10139-101390580 = "Our \"Lost & Found\" pile has really grown..."
10139-101390590 = "Aha"
10139-101390600 = "It's pretty easy to forget your umbrella when it's not raining."
10139-101390610 = "And most students don't label their things..."
10139-101390620 = "So I'm sure finding their owners would be difficult."
10139-101390630 = "We can leave a note to remind people to get their things."
10139-101390640 = "Yes."
10139-101390650 = "Oh, you should label your things too so that"
10139-101390660 = "Wait"
10139-101390670 = "Actually, I believe that may backfire..."
10139-101390680 = "Huh? How so?!"
10139-101390690 = "Sensei, are you doing anything special this weekend?"
10139-101390700 = "Mostly just resting and rotting..."
10139-101390710 = "What about you?"
10139-101390720 = "No plans! I was thinking of trying something new."
10139-101390730 = "Do you think I could borrow Schale's kitchen this weekend?"
10139-101390740 = "I wanted to make some combat rations for our future missions."
10139-101390750 = "Of course you can, whenever you need..."
10139-101390760 = "But what kind of combat rations?"
10139-101390770 = "I want to make some that retain their taste and freshness well!"
10139-101390780 = "I'm interested. Very interested."
10139-101390790 = "Oooh! What'll they be made of?"
10139-101390800 = "Fufu, I'll show you once I'm done making them."
