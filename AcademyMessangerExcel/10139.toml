[translation]
10139-101390010 = "สวัสดีค่ะ นี่คือ <FOX EATS> ค่ะ!"
10139-101390020 = "อาหารที่คุณลูกค้าสั่งจะถึงที่หมาย\nใน 10 นาทีค่ะ"
10139-101390030 = "โปรดตรวจสอบที่อยู่ให้ถูกต้องอีกครั้ง\nเพื่อการจัดส่งที่แม่นยำนะคะ"
10139-101390040 = "FOX EATS?"
10139-101390050 = "ไม่ได้สั่งอะไรเลยนะ?"
10139-101390060 = "ไม่เป็นไรค่ะ มีการชำระเงินไว้\nเรียบร้อยแล้วค่ะ!"
10139-101390070 = "เชิญคุณครูนั่งให้สบาย และรอรับ\nอาหารมื้อดึกที่จัดเตรียมโดย FOX EATS\nได้เลยค่ะ"
10139-101390080 = "รู้ได้ยังไงน่ะว่าครูยังไม่ได้กินมื้อเย็น?"
10139-101390090 = "ฮุฮุ ฉันหาทางรู้ได้ทุกอย่างละค่ะ"
10139-101390100 = "นี่คือความลับทางการค้าของ\nFOX EATS ค่ะ"
10139-101390110 = "จะว่าไปก็เคยมีเหตุการณ์คล้ายๆ\nกันนี้เกิดขึ้นเหมือนกัน..."
10139-101390120 = "อาหารใกล้จะมาถึงแล้วค่ะ"
10139-101390130 = "เพื่อความปลอดภัย กรุณาอยู่ห่างจาก\nประตูให้มากที่สุด และเตรียมพร้อมรับ\nแรงกระแทกที่อาจเกิดขึ้นด้วยค่ะ"
10139-101390140 = "น่ากลัวจัง!"
10139-101390150 = "คุณครู"
10139-101390160 = "กินซูชิเต้าหู้หวานที่ฉันใส่ตู้เย็นเอาไว้\nเมื่อวานหมดแล้วหรือยังคะ?"
10139-101390170 = "อื้อ กินไปแล้ว"
10139-101390180 = "อร่อยมากจนครูกินหมดใน\nรวดเดียวเลยละ..."
10139-101390190 = "ได้ยินแบบนั้นก็ดีใจนะคะ"
10139-101390200 = "ซูชิเต้าหู้หวานจะยิ่งอร่อยเมื่อกิน\nตอนเย็นนิดหน่อยน่ะค่ะ"
10139-101390210 = "ถ้ามีโอกาสอีกเมื่อไร ฉันจะทำซูชิ\nเต้าหู้หวานไปให้อีกค่ะ"
10139-101390220 = "แต่ก็อย่าอดข้าวเพราะจะรอกินอาหาร\nของฉันนะคะ"
10139-101390230 = "ครูจะจำเอาไว้นะ"
10139-101390240 = "คุณครู บ่ายนี้พอมีเวลาว่างมั้ยคะ?"
10139-101390250 = "อื้อ กำลังว่างอยู่พอดีเลย"
10139-101390260 = "มีเรื่องอะไรขึ้นมาเหรอ?"
10139-101390270 = "คือว่า บ่ายวันนี้ฉันมี\n<ปฏิบัติการเสบียงพิเศษ>"
10139-101390280 = "แต่สมาชิกในกองมาไม่ได้เพราะติด\nงานอื่นน่ะค่ะ..."
10139-101390290 = "คุณครูพอจะช่วยฉันหน่อยได้มั้ยคะ?"
10139-101390300 = "ได้อยู่แล้ว!"
10139-101390310 = "แต่จะมีอะไรที่ครูพอช่วยได้เหรอ?"
10139-101390320 = "ครูไม่รู้อะไรเกี่ยวกับปฏิบัติการ\nพิเศษเลย"
10139-101390330 = "ไม่เป็นไรค่ะ มันไม่ใช่ปฏิบัติการ\nอันตรายอะไรหรอกค่ะ"
10139-101390340 = "อาจจะนะ..."
10139-101390350 = "อาจจะเหรอ?!"
10139-101390360 = "คุณครู"
10139-101390370 = "เคยได้ยินคำว่า <ทุกสิ่งที่ผิดพลาดได้\nจะผิดพลาดเสมอ> หรือเปล่าคะ?"
10139-101390380 = "หมายถึงกฎของเมอร์ฟีสินะ"
10139-101390390 = "ตอนทำงานก็เคยได้ยินบ่อยๆ เลยละ"
10139-101390400 = "ค่ะ มีคนจำนวนมากที่เห็นด้วยกับ\nข้อความนั้นค่ะ"
10139-101390410 = "เมื่อก่อนฉันก็เคยเผลอลืมตรวจสอบ\nอุปกรณ์อย่างที่เคยทำทุกวันด้วย"
10139-101390420 = "แล้ววันนั้นก็เกิดอุบัติเหตุด้านความ\nปลอดภัยขึ้น ฉันยังจำได้อยู่เลยค่ะว่า\nต้องลำบากมากเลย"
10139-101390430 = "แล้วก็คิดว่า ทำไมต้องเกิดเรื่องในวัน\nที่ทำงานพลาดด้วยนะ~"
10139-101390440 = "ครูก็เคยมีประสบการณ์แบบนั้น\nเหมือนกัน"
10139-101390450 = "เรื่องบังเอิญมักเกิดขึ้นในจังหวะนรก\nแบบนี้ละ"
10139-101390460 = "ตอนนั้นฉันได้รู้ระหว่างอ่านหนังสือที่\nเกี่ยวข้องค่ะ"
10139-101390470 = "ว่ากันว่าเรื่องแบบนี้เกิดขึ้นเพราะเรา\nจดจำความทรงจำที่ไม่ดีได้ดีกว่า\nความทรงจำที่ดีค่ะ"
10139-101390480 = "หมายความว่าต่อให้เราทำผิดพลาด\nแต่ถ้าไม่มีอะไรเกิดขึ้น เราก็จะลืมมัน\nไปจากความทรงจำค่ะ"
10139-101390490 = "มีเหตุผลทางวิทยาศาสตร์อยู่\nเบื้องหลังสินะ"
10139-101390500 = "แต่ยังไงก็น่าเสียดายอยู่นะ..."
10139-101390510 = "ถ้าความทรงจำดีๆ อยู่ได้นานกว่านี้\nก็น่าจะดีน่ะสิ"
10139-101390520 = "แต่ฉันคิดว่าการจดจำสถานการณ์ที่\nเลวร้ายมันดีกว่านะคะ"
10139-101390530 = "เราจะได้เรียนรู้จากความผิดพลาด\nและทำให้ดีขึ้นในครั้งต่อไปยังไงล่ะคะ"
10139-101390540 = "คุณครู"
10139-101390550 = "ในโกดังของชาเล่ต์มีร่มกองอยู่\nเพียบเลย"
10139-101390560 = "ทั้งหมดนั่นเป็นของชาเล่ต์เหรอคะ?"
10139-101390570 = "เป็นของที่นักเรียนเวรลืมทิ้งไว้น่ะ"
10139-101390580 = "มีเป็นกองพะเนินโดยไม่รู้ตัวเลยแฮะ..."
10139-101390590 = "อ้อ"
10139-101390600 = "ถ้าฝนไม่ตก ตอนขากลับเราก็มักจะ\nลืมเอาร่มไปด้วยนี่คะ"
10139-101390610 = "แต่ส่วนใหญ่ก็ไม่มีชื่อเขียนไว้"
10139-101390620 = "งั้นการตามหาเจ้าของน่าจะเป็น\nงานยากเลยนะคะ"
10139-101390630 = "เขียนประกาศให้เจ้าของกลับมา\nเอาร่มดีกว่า"
10139-101390640 = "ค่ะ"
10139-101390650 = "คุณครูก็ควรติดป้ายชื่อกำกับของ\nของตัวเองไว้นะคะ ถ้าทำหายจะได้\nหาเจอง่ายๆ"
10139-101390660 = "ไม่สิ"
10139-101390670 = "แบบนั้นอาจจะส่งผลเสียมากกว่าค่ะ"
10139-101390680 = "ทำไมเหรอ?!"
10139-101390690 = "คุณครู วันหยุดนี้มีแพลนทำอะไร\nเป็นพิเศษมั้ยคะ?"
10139-101390700 = "ครูน่าจะแค่พักผ่อนนะ..."
10139-101390710 = "แล้วนิโกะมีแพลนทำอะไร\nเป็นพิเศษเหรอ?"
10139-101390720 = "ที่จริงสุดสัปดาห์นี้ฉันก็ไม่มีงานอะไร\nเป็นพิเศษ ก็เลยว่าจะหาอะไรใหม่ๆ\nทำดูค่ะ"
10139-101390730 = "คุณครูคะ ฉันขอใช้ห้องครัวของ\nชาเล่ต์ในช่วงสุดสัปดาห์นี้ได้มั้ยคะ?"
10139-101390740 = "สุดสัปดาห์นี้ฉันว่าจะเตรียมเสบียง\nอาหารสำหรับปฏิบัติการน่ะค่ะ"
10139-101390750 = "มาใช้ห้องครัวได้ตามสบายเลย..."
10139-101390760 = "ทำเสบียงสำหรับปฏิบัติการงั้นเหรอ?"
10139-101390770 = "ค่ะ เป็นเสบียงอาหารที่ไม่เน่าเสียง่าย\nและรสชาติไม่เปลี่ยนง่ายๆ ด้วยค่ะ"
10139-101390780 = "น่าสนใจดีแฮะ"
10139-101390790 = "ต้องใช้วัตถุดิบอะไรบ้างเหรอ?"
10139-101390800 = "ฮุฮุ ไว้ทำเสร็จแล้วฉันจะเอาให้ดูนะคะ"
