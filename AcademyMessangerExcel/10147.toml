[translation]
10147-101470010 = "先生、ちょっといいかしら"
10147-101470020 = "大丈夫だよ。どうしたの？"
10147-101470030 = "先生は……"
10147-101470040 = "海がどれだけ危険な場所か"
10147-101470050 = "ちゃんと理解してるかしら？"
10147-101470060 = "いや、あんまり……"
10147-101470070 = "……これは直接説明した方がよさそうね"
10147-101470080 = "今から行くから、待っていて頂戴"
10147-101470090 = "う、うん。待ってるね……"
10147-101470100 = "私が教えた海の安全対策……"
10147-101470110 = "ちゃんと覚えているかしら？"
10147-101470120 = "忘れたらダメよ？"
10147-101470130 = "大丈夫、覚えてるよ！"
10147-101470140 = "それを聞いて安心したわ"
10147-101470150 = "でもまだ少し心配だから……"
10147-101470160 = "これからもずっと、私がそばでケアしてあげる"
10147-101470170 = "それはうれしいな"
10147-101470180 = "ふふ、でしょう？"
10147-101470190 = "それじゃあ、またね"
10147-101470200 = "海は、とても恐ろしい場所よ。"
10147-101470210 = "い、いきなりだね。"
10147-101470220 = "何かあったの？"
10147-101470230 = "水の中だと息もできないし"
10147-101470240 = "自由に動けないわ"
10147-101470250 = "もし波にさらわれたりでもしたらと考えると――"
10147-101470260 = "たしかに、そう思うと怖いね……"
10147-101470270 = "危険なものからは距離を取る"
10147-101470280 = "それが一番よね"
10147-101470290 = "海って……"
10147-101470300 = "案外楽しい場所なのかもしれないわね"
10147-101470310 = "教えてくれて感謝するわ"
10147-101470320 = "そうでしょう？"
10147-101470330 = "でも油断は禁物よ"
10147-101470340 = "先生は慣れているみたいだけど"
10147-101470350 = "常に警戒を怠らないこと"
10147-101470360 = "うん、気をつけるよ"
10147-101470370 = "ふふ、いい返事ね"
10147-101470380 = "海ってとっても怖い場所よね"
10147-101470390 = "先生もそう思うでしょう？"
10147-101470400 = "デジャブだね"
10147-101470410 = "サツキはもう大丈夫じゃないの？"
10147-101470420 = "海のずぅっと深いところには――"
10147-101470430 = "恐ろしい何かが潜んでいる気がするの"
10147-101470440 = "そういうのもいるかもしれないね"
10147-101470450 = "浅いところなら平気かもしれないわ"
10147-101470460 = "だって、先生が守ってくれるもの"
10147-101470470 = "ねえ先生"
10147-101470480 = "知ってる？"
10147-101470490 = "多分しらないかも？"
10147-101470500 = "クラゲ同士って"
10147-101470510 = "お互いの毒が効かないらしいのよ"
10147-101470520 = "そうなんだ！すごいね！"
10147-101470530 = "つまり……"
10147-101470540 = "先生と私みたいな関係ってこと"
10147-101470550 = "よく分からないけど……"
10147-101470560 = "サツキが言うのなら、そうなのかもね"
10147-101470570 = "ふふっ、そうよ"
10147-101470580 = "ねぇ、先生に聞きたいことがあるの"
10147-101470590 = "いいよ。どうしたの？"
10147-101470600 = "紫外線対策はしてる？"
10147-101470610 = "もちろん！"
10147-101470620 = "クラゲ対策は？"
10147-101470630 = "大丈夫！"
10147-101470640 = "ふむ……いいでしょう"
10147-101470650 = "じゃあ、出発するわよ！"
10147-101470660 = "どこに？"
10147-101470670 = "ああ、そういえば"
10147-101470680 = "先生は知っているかしら？"
10147-101470690 = "たぶん……？"
10147-101470700 = "あら？私の気持ちが分かったの？"
10147-101470710 = "さすが先生ね"
10147-101470720 = "そ、そういう話だったの？"
10147-101470730 = "分かるような、分からないような……"
10147-101470740 = "実は、私もよく分かっていないの"
10147-101470750 = "この気持ちは……なんと言うのかしら"
10147-101470760 = "なんだか落ち着かないわ"
10147-101470770 = "私に手伝えることはあるかな？"
10147-101470780 = "う～ん"
10147-101470790 = "そうね……"
10147-101470800 = "……先生の顔を見せて頂戴"
10147-101470810 = "分かった、今どこにいるの？"
10147-101470820 = "先生、聞いて"
10147-101470830 = "人はね、見慣れたものを"
10147-101470840 = "いつの間にか「当たり前」だと思い込むらしいわ"
10147-101470850 = "なるほど、そうかもしれないね"
10147-101470860 = "だから先に言っておくわ"
10147-101470870 = "何を？"
10147-101470880 = "これからも"
10147-101470890 = "ずっと隣にいるって"
10147-101470900 = "慣れさせるってこと？"
10147-101470910 = "ええ"
10147-101470920 = "そうしていれば"
10147-101470930 = "いつか、それが当たり前になるでしょう？"
10147-101470940 = "うん、そうだね"
10147-101470950 = "そうよ。ふふっ"
