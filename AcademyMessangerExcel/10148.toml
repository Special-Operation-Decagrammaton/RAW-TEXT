[translation]
10148-101480010 = "คุณครู"
10148-101480020 = "ฉันได้วันลาพักร้อนค่ะ"
10148-101480030 = "โอ้ ดีใจด้วยนะ!"
10148-101480040 = "น่าอิจฉาจัง!"
10148-101480050 = "เพราะงั้นก็ฝากด้วยนะคะ"
10148-101480060 = "หืม?"
10148-101480070 = "คุณครู"
10148-101480080 = "ถึงจะรู้อยู่แล้วก็เถอะ แต่คุณครู\nคลั่งไคล้อะไรแบบนี้จริงๆ เลยนะคะ"
10148-101480090 = "ถึงกับให้ใส่ชุดว่ายน้ำในสำนักงาน\nเลยแบบนี้"
10148-101480100 = "ไม่ใช่นะ?!"
10148-101480110 = "ว่าแต่ ทำไมถึงเอาชุดว่ายน้ำมา\nด้วยล่ะ?"
10148-101480120 = "แล้วไปได้ชุดว่ายน้ำนั่นมาจากไหน?"
10148-101480130 = "หืม? คุณอิโรฮะ?"
10148-101480140 = "นี่...?"
10148-101480150 = "คุณครู"
10148-101480160 = "ตอนนี้อยู่ที่ชาเล่ต์หรือเปล่าคะ?"
10148-101480170 = "ก็อยู่นะ..."
10148-101480180 = "จะเอาอีกเหรอ?"
10148-101480190 = "คะ?"
10148-101480200 = "อ๋อ หมายถึงชุดว่ายน้ำสินะคะ\nงั้นจะเอาไปด้วยค่ะ"
10148-101480210 = "ไม่ใช่ เอ่อ คือ ช่างเถอะ..."
10148-101480220 = "ที่สำคัญกว่านั้น"
10148-101480230 = "ตอนมา ช่วยนั่งโทระมารุมาด้วยนะ"
10148-101480240 = "...?"
10148-101480250 = "ค่ะ ก็... ไม่ใช่เรื่องลำบากอะไร\nหรอกนะคะ"
10148-101480260 = "โอ้โห"
10148-101480270 = "วันนี้ถือว่าคุ้มค่าเลยนะคะ"
10148-101480280 = "เป็นวันหยุดที่น่าพอใจมากทีเดียวค่ะ"
10148-101480290 = "ถ้าพอใจก็ดีแล้ว..."
10148-101480300 = "แต่มันต่างจากที่คิดไว้นิดหน่อย..."
10148-101480310 = "พูดอะไรอย่างนั้นคะ"
10148-101480320 = "เดิมทีวันหยุดก็ควรนอนพักอยู่เฉยๆ\nถึงจะดีที่สุดค่ะ"
10148-101480330 = "พูดเหมือนพนักงานออฟฟิศที่\nหมดไฟเลย..."
10148-101480340 = "คุณครู"
10148-101480350 = "มาหนีไปด้วยกันมั้ยคะ?"
10148-101480360 = "คุณครู"
10148-101480370 = "ออกไปเดี๋ยวนี้ด้วยกันเลยมั้ยคะ?"
10148-101480380 = "ให้ตายสิ งานบ้าอะไรกันเนี่ย"
10148-101480390 = "ก็มันใกล้วันหยุดแล้วนี่นา...!"
10148-101480400 = "ยังมีฤดูร้อนหน้าอีกนี่นา!"
10148-101480410 = "คะ?"
10148-101480420 = "อยากเห็นฉันใส่ชุดว่ายน้ำอีก\nถึงขนาดนั้นเลยเหรอคะ?"
10148-101480430 = "ครูไม่ได้พูดเรื่องนั้นสักหน่อย?!"
10148-101480440 = "แต่ก็ไม่ใช่ว่าไม่ใช่หรอกนะ...!"
10148-101480450 = "อ่า..."
10148-101480460 = "เฮ้อ..."
10148-101480470 = "สู้หน่อยนะ...!"
10148-101480480 = "อ่า"
10148-101480490 = "ก็"
10148-101480500 = "ได้ค่ะ"
