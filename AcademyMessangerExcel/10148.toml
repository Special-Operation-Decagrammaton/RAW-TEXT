[translation]
10148-101480010 = "선생님."
10148-101480020 = "저 휴가 받았습니다."
10148-101480030 = "오오, 축하해!"
10148-101480040 = "부럽다!"
10148-101480050 = "그런 연유로, 잘 부탁드립니다."
10148-101480060 = "네?"
10148-101480070 = "선생님."
10148-101480080 = "알고는 있었지만, 참 매니악하시네요."
10148-101480090 = "굳이 사무실에서 수영복을 입으라니."
10148-101480100 = "아닌데요?!"
10148-101480110 = "그보다 수영복은 왜 갖고 온 거야? "
10148-101480120 = "애초에 수영복은 어디서 난 거야?"
10148-101480130 = "네? 이로하 씨?"
10148-101480140 = "저기요……?"
10148-101480150 = "선생님."
10148-101480160 = "지금 샬레에 계신가요?"
10148-101480170 = "그렇긴 한데……."
10148-101480180 = "설마 또?"
10148-101480190 = "네?"
10148-101480200 = "아, 수영복 말이네요. 챙겨 갈게요."
10148-101480210 = "아니, 그, 저, 뭐, 됐나……."
10148-101480220 = "그보다는"
10148-101480230 = "올때 꼭 토라마루를 타고 와줘."
10148-101480240 = "……?"
10148-101480250 = "네, 뭐, 어렵지는 않은데요."
10148-101480260 = "이야."
10148-101480270 = "오늘은 꽤 충실했네요."
10148-101480280 = "상당히 만족스러운 휴일이었어요."
10148-101480290 = "만족했다면 다행이지만……."
10148-101480300 = "생각한 거랑 좀 다른데……."
10148-101480310 = "무슨 말씀을."
10148-101480320 = "원래 휴일에는 누워서 쉬는 게 제일이에요."
10148-101480330 = "지친 직장인 같은 소리를……."
10148-101480340 = "선생님."
10148-101480350 = "함께 도망치지 않을래요?"
10148-101480360 = "선생님."
10148-101480370 = "진짜로 지금이라도, 떠나실래요?"
10148-101480380 = "아니, 뭔 놈의 일 처리를."
10148-101480390 = "곧 휴일이니까……!"
10148-101480400 = "다음 여름이 있으니까!"
10148-101480410 = "네?"
10148-101480420 = "그렇게까지 제 수영복 차림이 또 보고 싶으신 건가요?"
10148-101480430 = "그런 얘기 아닌데요?!"
10148-101480440 = "……아니지는 않지만!"
10148-101480450 = "아……."
10148-101480460 = "에휴……."
10148-101480470 = "힘내자……!"
10148-101480480 = "아"
10148-101480490 = "뭐"
10148-101480500 = "네."
