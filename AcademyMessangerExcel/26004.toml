[translation]
26004-260040220 = "先生、シミコです！"
26004-260040230 = "いきなりですが、ちゃんと休みを取れていますか？"
26004-260040240 = "おはよう！"
26004-260040250 = "もちろん元気だよ！"
26004-260040260 = "(・A・) "
