26004-260040290 = "ごめんなさい……嘘です……"
26004-260040300 = "本を読みながら休みたいです……"
26004-260040310 = "やはり……！"
26004-260040320 = "それでしたら図書館の休憩室へいらしてください！"
26004-260040330 = "疲れは取れましたか？"
26004-260040340 = "体調はいかがでしょうか"
