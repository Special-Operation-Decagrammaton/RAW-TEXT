36885371 = "これは、芸術に隠されしオカルトを研究する生徒たちの、魔法のような日常の物語。"
2341156566 = "オカルト研究会"
1443904036 = "これは、芸術に隠されしオカルトを研究する生徒たちの、魔法のような日常の物語。"
1437478686 = "183 vs 227"
2812637635 = "227号特別クラスと183号特別クラスが初めて出会った日。お互いに、相手は「一般生徒」だと思い込んでおり……？"
1390861604 = "183 vs 227"
3602552476 = "227号特別クラスと183号特別クラスが初めて出会った日。お互いに、相手は「一般生徒」だと思い込んでおり……？"
2632124491 = "183 vs 227"
275201071 = "メイドの象徴"
2631367848 = "カリンと一緒に、オフィスを隅々まで掃除する先生。掃除の後、ホコリで汚れたエプロンを見てカリンが思いを話し始める。曰く、エプロンは服を汚さないために着けるものであり、それは誰もやりたがらない仕事を率先してやる「メイド」の精神に近しいのだと言う。先生も共感し、メイドの象徴について語り合うのだった。"
3672584645 = "習慣と時間"
1123694273 = "激務の疲れを癒すべく、先生を図書館に招いたシミコ。しかし来客用のクッションが解れていたため、シミコは自分が愛用しているものを先生に渡す。お気に入りのものは直せなくなるまで使うと言うシミコに、愛着を感じて素敵だと返す先生。そのままシミコのクッションに身を預け、読み聞かせを聞きながら眠りにつくのだった。"
2743994296 = "魔法の起点"
2523020723 = "学科の友達とも話せるようになってきたというエリは、自信の源となっている「魔法の帽子」との出会いを先生に語る。そして、魔法の帽子があったから一歩踏み出す勇気を得られて、そのお陰で先生とも出会えたと、嬉しそうに話すエリ。その後、不思議な力のおすそ分けとして、先生はエリに帽子を被せてもらうのだった。"
1567631360 = "天才と実験を"
3716806598 = "プロレスの指南書を読んでいたアンナは「適度な力で」という記述が抽象的過ぎるため、力加減に悩んでいた。そこで身をもって学ぶために、自分に関節技をかけてほしいと先生に頼むアンナ。しかし生徒にプロレス技をかける訳にもいかず、逆に実験台をかって出る先生。技をかけられている間、先生は気が気じゃないのだった。"
827480703 = "天才と検証を"
1327457066 = "他言無用で183号に来てほしいとアンナに頼まれた先生。安価で丈夫な新素材「アンナクリート」を開発したという彼女は、検証のために子犬号で実験を始める。強度の実証は順調に進んだものの、出口を考えず蓋をしてしまったため、危うく子犬号に閉じ込められてしまいそうになるアンナ。どうにか床下に穴を空けて脱出するのだった。"
3728934035 = "天才とお出かけ"
121768975 = "183号の裏山で開催されたバーベキューパーティー。周囲の廃品を素材として、アンナは工具箱一つでバーベキュー道具をすべて作り出した。いよいよ始めようかという段になり、肉を持ってくるよう先生にお願いするのを忘れていたことに気づくアンナ。結果として、二人でジャーキーをかじることになるのだった。"
2030604885 = "天才とこれからも"
2160366373 = "学級委員長として183号の資料を整理していたアンナ。膨大な量の記録を整理していると、アンナが183号に来る前の資料を発見する。その中には、かつてアンナが自分で作った賞状が紛れていた。諸事情で授賞式が行われなかったことが悔しくて作ったものだと言うアンナに、先生は改めて授賞式を執り行うのだった。"
504111642 = "料理は化学！"
3853115975 = "研究を手伝ってほしいと言われて183号を訪れた先生を待っていたのは、シェフになったエリナだった。味見を頼まれた先生だったが、183号には食材はおろか調味料もほとんど無い。しかしエリナは足りないものは化学変化を駆使して調達し、絶品の肉じゃがを完成させるのだった。"
2712952066 = "説得も化学！"
1682621237 = "勉強したくない！とはぼやくものの、知識を蓄えることは好きなエリナ。その日、エリナがぶつくさ言いながら学んでいたのはプロレス技だった。エリナは先生を実験台として技をかけて練習するが、体が絡まったまま解けなくなってしまう。潤滑油でぬるぬるにして抜け出そうと提案するエリナを、先生は必死に止めるのだった。"
486933029 = "ファッションだって化学！"
884460563 = "自身が開発した化学繊維製品の市場調査という名目で外出許可を得たエリナ。先生と二人で販売店に向かうものの、お店は閑古鳥が鳴いていた。店員に聞くと、すべての商品が問題を抱えていて全く売れていないとのこと。しかしそれを聞いたエリナに落ち込む様子はなく、使い方次第だとして上機嫌なのだった。"
2326833892 = "私たちみんな化学！"
4230686105 = "日頃の感謝を伝えるべく、先生にプレゼントを贈ろうとするエリナ。しかし人工ダイヤモンドを作るのには失敗してしまい、代わりに何かを思いついたエリナは、すぐ戻ると言い残して出かけてしまう。日も落ちかけて吹雪き始めたころ、ようやくエリナが戻ってくる。その手には、溶けないように加工された雪の結晶が握られていた。"
3789706054 = "特別な演奏"
161799357 = "ツムギがライブの準備をしていると、スケバンたちに絡まれてしまった。しかしツムギは怯むことなくギターを取り出して「特別な演奏」を披露する。平和とは慈悲の心の顕現。暴力の意志が争いを生むのなら、先んじて意志を打ち砕く。今日もツムギはラブ・アンド・ピースを叫ぶのだった。"
1627731059 = "眠れる森の美女"
3039523692 = "夜の散歩中、先生は公園でツムギと出会う。聞けば、インスピレーションが湧くから公園で寝ていたというツムギ。寮に戻るよう先生が促すものの、無許可で抜け出しているためツムギは戻れない。そこで先生と一緒にシャーレにやってきたツムギは、先生の作業効率を上げるための演奏をしてくれるのだった。"
2433104691 = "カルペ・ディエム"
1538088413 = "ライブを見に行った帰り、ツムギと先生は二人でスイーツを食べに来ていた。「特別」に関する話をするなかでツムギは、大事にしている芸術の在り方――カルペ・ディエムについて語る。そしていつの日か、先生のためだけに創った曲を披露すると約束するのだった。"
1534388980 = "光と闇"
617387565 = "ツムギの誘いで「芸術に潜む闇」をテーマにした展示会を訪れた先生。意見を交わしながら作品を鑑賞して回り、ツムギは新しい曲のインスピレーションを得る。光は、闇の中でこそ美しく輝くもの――日を改めてツムギが先生に披露した曲は、普段のデスメタルとは異なり穏やかな調べを奏でるのだった。"
3840632710 = "よくあるユニフォーム？"
2958028279 = "大会の運営から受け取ったというユニフォームを着て現れたヒフミ。少なくとも「レーシングスーツ」とは異なるであろう装いは、周囲の視線を集めてしまう。しかしよくあるユニフォームだと信じているヒフミは、先生の疑問に対して機能性を一つひとつ説明するのだった。"
3275971778 = "妖精女王"
3473256340 = "先生との買い物を終えて帰る途中、安全運転をしていたヒフミだったが、煽り運転の車に当て逃げされてしまう。スイッチが入ったヒフミは、逃走する車を華麗な戦車さばきで追跡し始める。そして追走劇の末に、煽り運転をしていたドライバーを圧倒的なドラテクの差で分からせるのだった。"
354998620 = "特別"
2367636329 = "昼とは打って変わり静まり返った夜の競技場に、ヒフミと先生の姿があった。「平凡」を自称していたヒフミは、自分も誰かの「特別」であることを自覚し戸惑っていた。しかし先生への相談を通して、どちらも自分なのだと納得し、前を向くのだった。"
2019819975 = "平凡な秘密基地！"
2826655036 = "ヒフミに頼まれた先生は、クルセイダーちゃんの部分塗装の手伝いをしていた。一緒に塗り終わったあと、塗料が乾くのを待っていた2人だったが、暑さがその邪魔をする。ヒフミは暑さを避けるために戦車と旗で日陰を作り、二人だけの秘密基地を用意するのだった。"
120049956 = "パケットスリーピング"
1484507511 = "シャーレに届いた正体不明の大きな箱。先生が慎重に開けてみると、その中には「お土産」としてラナが入っていた。"
1693721023 = "少女のピックアップ"
3775521247 = "街乗りの練習に付き合ってほしいと先生にお願いするアズサ。しかし停めておいたはずの戦車が消えてしまい、2人は駐車場を探して歩く。結局、「車両点検のために移動させた」ということが判明し、アズサは安堵するのだった。"
1246140576 = "少女の欲張り"
2468872292 = "先生と一緒に戦車用品を買いに来たアズサ。モモフレンズのコラボ商品を見つけて欲しがるアズサだったが、何かを失うことへの恐れを打ち明ける。特に戦車用品ともなれば、いつ壊れてしまうかも分からないと話すアズサ。しかし、使い終わったら外して飾っておけるという理由で芳香剤を買うのだった。"
373714608 = "少女のおつかい"
1085670391 = "昼食のおつかいを任されたアズサは先生を連れてDTへ向かう。その正体はドライブスルーだったが、注文をブリーフィング、受け取り口を検問所と勘違いしてしまうアズサ。しかし先生のサポートもあり、幸いに注文は無事に通り、頼まれたものを手に入れて補給を完了するのだった。"
3335124235 = "少女をなでた風"
3619478159 = "落第科目の単位認定に必要となる「大会参加の証拠写真」の撮影を先生にお願いしたアズサ。しかし撮影の最中、強い日差しにやられてアズサが倒れてしまう。日陰に移動した後、「失望させた」と謝るアズサだったが、先生が優しく諭したことで、アズサは幸せそうな表情を浮かべるのだった。"
311885108 = "ラナとコロッサス"
3678365542 = "中途半端なメッセージが送られてきたきり連絡の途絶えたラナが心配になり、183号特別クラスを訪ねた先生。するとラナはなにやら巨大な機械を作っていた。先生も協力して完成させると、その正体はスマホの「充電器」だとラナは言う。こうしてラナのスマホの充電が復活するのだった。"
169014044 = "デバッグパッチ"
1361333594 = "バグとパッチでスペースが足りないと言うラナに、外付けHDDをプレゼントした先生。しかしラナは不思議そうな表情をする。聞けば、バグ退治とは「虫」を取り除くことであり、パッチを当てるとはパンチカードの穴を物理的に塞ぐという意味だった。そしてバグを捕まえたノートとパッチされたパンチカードでスペースが無いのだとラナは説明する。"
181324778 = "デッドロック"
568809012 = "心理テストで5回も再試になっていたラナ。先生が調べてみると、「回答の不誠実度」を測るための質問に「正しく」該当してしまい、ラナは真剣に答えているのにエラー扱いとなっていた。飛び級を重ねていることもあり、自分自身を「異常」だと言われることが怖いと話すラナ。しかし先生は、自分らしくいればいいと伝えるのだった。"
2955691743 = "プロトコルの明細"
1823091636 = "フードデリバリーの配達員と一緒にシャーレの玄関に現れたラナ。聞けば、ラナは自分のことを「食べ物」だと主張し、デリバリーを利用して先生のもとへやって来ていた。シャーレに来た理由を先生が尋ねると、「会いたかっただけ」と答えるラナ。先生はラナを連れて、ショッピングモールや遊園地に遊びに行くのだった。"
700568259 = "183 vs 227"
3093815708 = "おつかいの帰り道で迷子になっていたラナを、通りかかったシグレが227号特別クラスに連れて帰る。吹雪が止むのを待ってから、ノドカも一緒に183号特別クラスに向かう。アンナとエリナのもとへラナを送り届けるが、お互いに「特別クラス」であることを隠して自己紹介したせいで、認識にズレが生じるのだった。"
3156899463 = "懐かしき非日常"
1817493399 = "『真夜中はロアと共に』それはオーウェルのトークショー。今夜は「悪夢急行」を紹介する。"
2508914330 = "Start Your Engines!　～183号よ永遠に！～"
3251321361 = "歴戦の雄がゲヘナに集結する。白熱する戦車レースの果て、勝利の女神は誰に微笑むのか――"
