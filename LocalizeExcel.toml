571344706 = "仮想適性試験"
3664619223 = "「悪夢急行」は、人通りの少ない時間帯に現れる架空の列車です。往日に郷愁を抱く利用客を乗せたこの列車は、目的地に到着することなく、永遠に走り続ける車両に乗客を閉じ込めてしまいます。この車内では、他の乗客はもちろん、乗客がいた痕跡すら見つけられません。ただし、列車の乗車規則に違反した場合、乗務員が現れることがあります。目撃者によって、その姿は千差万別――もしかする各々の記憶に応じて姿を変えているのかもしれません。"
