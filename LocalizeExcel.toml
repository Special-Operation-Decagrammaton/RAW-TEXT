3936047 = "味方ストライカー生徒は、編成位置に応じて2つの空間に分かれて戦闘に参加します。\nサルの乗務員は2つの空間に分かれて登場し、同じ空間にいる生徒を優先的に攻撃します。\n\nそれぞれの空間に、サルの乗務員の強力な攻撃に耐えられるタンク生徒を編成しましょう。"
2687078399 = "サルの乗務員は、他の空間からのすべての攻撃をResistダメージとして受けます。\n\nそれぞれの空間に、サルの乗務員に強力なダメージを与えられるアタッカー生徒を編成しましょう。"
2470272508 = "一定時間毎に、サルの乗務員が味方生徒の魂を吸収して大ダメージを与え、気絶させます。\n\n別の空間にいる味方ストライカー生徒がスキル使用中のサルの乗務員を攻撃すると、\nスキルの使用が停止し、受けるダメージが増加します。"
1924453618 = "悪夢急行では、他の味方生徒から回復効果を受けられません。\nHPが半分以下になった味方生徒は、コスト回復量が大幅に減少します。\n\n駅弁ドローンを破壊して、味方ストライカー生徒のHPを回復させましょう。"
3902944093 = "サルのぬいぐるみ爆弾は、一定時間が経つと爆発し、味方生徒に致命的なダメージを与えます。\nサルのぬいぐるみ爆弾はEXスキルでのみ攻撃できます。\n\n範囲攻撃でサルのぬいぐるみ爆弾を倒しましょう。"
2221426305 = "列車が最高速度になると、悪夢コアは攻撃を受けません。\n\n列車が最高速度に達した時、ブレーキレバーを攻撃して列車を減速させると、\n悪夢コアがグロッキー状態になり、味方生徒のコスト回復力が大幅に上昇します。"
