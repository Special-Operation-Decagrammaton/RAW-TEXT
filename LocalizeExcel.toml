1988172165 = "どこが？昨日なんか家の前の飲食店が吹っ飛んで、別の店探すハメになったんだけど！？"
927130613 = "【お知らせ】鐘崎海岸への不法投棄に関して\n最近、鐘崎海岸周辺で、家庭ごみや廃棄物の不法投棄が増えています。\nごみの不法投棄は条例により固く禁じられており、発見された場合は罰金が科されることがあります。\n美しい海洋環境を守るため、皆さまのご理解とご協力をお願いいたします。"
1247745885 = "そういや最近、海岸にいろいろ流れ着いてるよね。宝探しついでに、掃除しに行ってみようかな。龍涎香とか落ちてるかもしれないし。"
1249306913 = "海から流れ着いた宝か……ロマンがあるね。ただ、たまに変な光を放ってる玉があるけど、あれは拾わないほうがいいよ。呪われるかもしれないから。"
