995708945 = "弱い者の話は聞かない"
1822158663 = "逃げれば3、参加すれば1"
3370986156 = "赤信号"
96448373 = "クーデター、じゃない？"
1617015174 = "全力を尽くす"
583205708 = "183号、解散します！"
