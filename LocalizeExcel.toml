245265694 = "戦士たちの楽園"
117918086 = "駆け抜けた所に楽園はある"
3167318731 = "プロローグ"
3290973226 = "マコトが高らかにゲヘナカップの開会を宣言する。しかしマイクのスイッチが入っていなかったことにより、それまでの30分にわたる演説は誰にも届いていないのだった。"
1819059770 = "お土産は優勝カップで"
2721489330 = "ゲヘナが用意した宿に到着し、設備やもてなしの内容に感激する183号特別クラス。他の参加チームと挨拶を交わし、楽しい時間を過ごすものの、夜になるとアンナとエリナは本戦に臨む緊張感でなかなか眠れないのだった。"
2314671506 = "今からお互いに……（１）"
1651151692 = "迎えたレース当日。大会の解説者として招かれていた先生と、183号の3人は記念写真を撮っていた。時を同じくして、万魔殿の面々は「特注の服」が盗まれたという話で盛り上がっている。そしていよいよ訪れる、スタートの時。サツキの合図でレースが始まると同時に、子犬号の隣の戦車が爆発するのだった。"
4118353135 = "今からお互いに……（２）"
614496572 = "戦車レースのはずが、なぜか砲撃戦に巻き込まれて困惑する183号の3人。ゲヘナカップのルールは「全ての的を砲撃して、最初にスタートラインまで戻ってくる」こと。裏を返せば、そのためには何をしてもいい、と183号は大混戦の中でイロハから教えてもらうのだった。"
1635998454 = "交戦規定？"
2166339801 = "ルール無用のゲヘナカップ。C&Cチームとゲーム開発部チームが激戦を繰り広げている――のを横目に見つつ、183号は隙を見て先へ進むのだった。"
2141410352 = "Time On Target"
2864090624 = "隠れながら進み、各所で起こる熾烈な争いを巧みに回避していた183号だったが、いよいよ敵戦車と鉢合わせてしまう。しかし運よく弾切れを起こしており、183号の初戦果はヴァルキューレチームとなるのだった。"
2161882777 = "弱い者の話は聞かない"
4285447579 = "強豪たちが一台、また一台と脱落していく。快進撃を続けていたC&Cチームも、トキが操る同型戦車とのミラーマッチで相打ちとなってしまう。そんな中、次の標的へと向かっていた183号の3人は思わぬ相手に遭遇する。"
2561254611 = "逃げれば3、参加すれば1"
3236480027 = "183号チームは、段ボールと人力で成り立っている戦車で本戦まで進出してしまった忍術研究部チームに手を差し伸べる。そこで忍術研究部の不屈の精神に触れ、気を引き締める183号チーム。しかし休む間もなく、子犬号が登り切った丘から見下ろすと、アビドスチームと補習授業部チームが火花を散らしていた。"
4067448400 = "赤信号"
2555980580 = "チェリノの姿を発見し、183号チームは逃げの一手で場を離れようとする。しかし回り込まれてしまい万事休すかと思われたその時、補習授業部チームが割り込んで183号チームに助け舟を出す。心が折れかけていたエリナだったが、アンナとラナの鼓舞で再起するのだった。"
2115253644 = "クーデター、じゃない？"
3470259662 = "補習授業部チームの支援を受けた183号チームは、辛くもレッドウィンター事務局チームの撃破を成し遂げる。憤慨するチェリノだったが、「クーデター」としてではなく「戦車レース」として戦っただけだというラナの弁明で誤解が解け、183号チームは粛清を免れるのだった。いよいよ、レースは終盤に差し掛かる。"
1490119510 = "全力を尽くす"
39249276 = "183号チームは火山地帯に到達し、絶対王者たるイロハの虎丸チームと相対する。しかし折悪しく火山活動が活発化しており、試合の運営が危ぶまれる状況だった。そこでイロハは、レースを中止すれば両者準優勝の扱いになると提案する。けれど183号の3人は、優勝は譲れないと勝負を仕掛けるのだった。"
1750496948 = "183号、解散します！"
1855274050 = "優勝の後に訪れる別れを心配するラナだったが、優勝してもずっと友達だと笑うアンナとエリナ。そして酷くなる火山灰の中で、最後の勝負が始まる。"
932528563 = "Off your Tank!"
2205257543 = "183号特別クラスは優勝を手にした。ラナはこれまでを振り返り、「いつか友達に慰めが必要な時、かけてあげられる言葉」を知るため、イロハに問いかける。イロハの答えを聞いて満足げな様子のラナはアンナとエリナに合流し、優勝の記念となる集合写真を撮るのだった。"
2571471402 = "そこに行ったらお便りします"
1197500779 = "183号の3人は、ゲヘナカップ優勝祝賀会でチェリノからの表彰を受ける。喜ぶ3人だったが、一転、予選に出場する過程で起こした騒動についての追及が始まる。結果として183号特別クラスへの無期限在留が言い渡され、脱出は叶わず環境は変わらなかった。しかし3人の間には、確かに変わったものもあるはずだ。"
3793283036 = "空冷0気筒"
1902928889 = "本戦を目前にして、補習授業部のクルセイダーちゃんはエアコンが故障してしまった。改善の策としてドライアイスを注文していたヒフミのもとに、万魔殿から荷物が届けられる。けれど予想とは裏腹に、箱の中に入っていたのは機能的で涼し気なレーシングスーツだった。"
3977589434 = "戦士たちの楽園"
4162184746 = "レースは終わり、閉幕の祝賀パーティーが催された。ともに優勝を競った選手たちが一堂に集まり懇親を深めるのだった。"
4166411545 = "駆け抜けた所に楽園はある"
2824330210 = "レースは終わり、片づけが進むなか、息も絶え絶えな戦車が姿を現した。最後まで諦めなかった忍術研究部は、スタッフに見守られながらゴールインするのだった。"
3958571189 = "本戦を目前にして、補習授業部のクルセイダーちゃんはエアコンが故障してしまった。その改善策とは――"
2682898429 = "レースは終わり、閉幕の祝賀パーティーが催される。"
2506146639 = "祝賀パーティーの裏では、レースの後片づけが進んでいた。そして、忘れられていることがもう一つ――"
1969245600 = "夢の中の列車"
67561232 = "戻りたい過去があるのなら、深夜のホームで静かに耳を傾けてみてください。過去へ向かう列車が、あなたを迎えにくるかもしれませんから。"
843776207 = "過去行きの列車"
2952232891 = "無賃乗車"
2977149122 = "存在しえない列車"
3578602917 = "抜き打ち検査"
566078205 = "末端と幹部"
435155634 = "思わぬ再会"
2396709331 = "狐と兎"
3984385139 = "友達を探しています"
593238005 = "私立ヒヤシンス学園行き急行列車"
3074763493 = "ブレット・トレイン"
58320216 = "駅弁"
3667920182 = "過去行きの列車"
714623568 = "廃校となり別の学園へと転校した、私立ヒヤシンス学園出身の生徒。駅で電車を待っている間に、ふと昔を思い返していると、すでに廃線となったはずの「私立ヒヤシンス学園行き」急行列車に遭遇する。"
4177125948 = "無賃乗車"
3792136270 = "先生はハイランダーの列車に乗って移動していた。しかし乗車券を紛失しており、車内検札の際に列車から投げ出されそうになる。もはやこれまでと思われた時、たまたま居合わせたFOX小隊のおかげで事なきを得る先生。聞けばFOX小隊は、存在するはずのない列車の調査で川西駅に向かっているところだという。"
1542490081 = "存在しえない列車"
2261865012 = "不可解な列車について目撃情報が寄せられていた。しかし交通室長であるモモカは、証言通りの運行は物理的に難しいと、否定的な意見を述べる。管轄の問題でヴァルキューレを動かすわけにもいかず、連邦生徒会長はユキノに調査を依頼するのだった。"
3217051810 = "抜き打ち検査"
1457234732 = "聞き込み調査のためにCCCの幹部に変装して川西駅を訪れたクルミとオトギ。しかし駅員は、普段のCCCに比べてやたらと親身な2人に違和感を覚え、疑いの目を向ける。機転を利かせたオトギの対応で、どうにかその場を乗り切るのだった。"
745546688 = "末端と幹部"
1096681363 = "利用者への聞き込みを終えて駅務室へ向かったクルミとオトギ。しかし川西駅の駅長も、普段のCCCに比べて親身な2人に違和感を覚え、疑いの目を向ける。またしても機転を利かせたオトギの対応で誤魔化すことに成功する2人。その後、「拝金のブローカー」が関与しているかもしれないと証言を得るのだった。"
1050046740 = "思わぬ再会"
3651589811 = "問題の列車を押さえるべく夜間張り込みをした結果、クルミとオトギが風邪をひいてしまう。ニコも動けない今、やむを得ずユキノが聞き込み調査に出ることとなる。普段とは違う様子で聞き込みを進めていたユキノは、偶然にも後輩のミヤコに出会う。"
2967418712 = "狐と兎"
3976802473 = "矯正局を出た後にユキノたちが連絡してこなかったことを、ミヤコは不満に思う。しかし作戦のために仕方なかったとユキノが回答し、ひとまず納得するミヤコ。一方、期せずしてミヤコも、友人からの依頼で同じ事件を調査していたことが判明する。ミヤコはユキノに情報を提供し、依頼主を紹介するのだった。"
3700706023 = "友達を探しています"
3997188198 = "ミヤコの紹介でFOX小隊のもとを訪ねたヒヤシンス学園出身の生徒。彼女は、来るはずのない列車がホームに入ってくるのを見たと言い、当時の状況をFOX小隊に話す。列車が姿を表すトリガーがヒヤシンス学園出身の生徒かもしれないと予想したFOX小隊。一行は夜に再び集まる約束をするのだった。"
350050892 = "私立ヒヤシンス学園行き急行列車"
9593635 = "ミヤコの友人が体験した状況を再現すると、ついに、来るはずのない列車がホームに入ってきた。中に乗客がいる様子は見えず、列車は異様な雰囲気を漂わせている。しかし気圧されることなく、FOX小隊は列車に乗り込むのだった。"
1050215819 = "ブレット・トレイン（１）"
2220200859 = "列車の内部は、車両を移動し続けても終わりが見えない無限構造をしていた。そこでFOX小隊は発想を変え、自分たちから探しに行くのではなく、敵を誘い出す方法を思いつく。非常停止スイッチを作動させ車内の異常事態を伝えると――猿の姿をしたアニマトロニクスの車掌が姿を現した。"
3332551061 = "ブレット・トレイン（２）"
1056026822 = "車掌らしきものを倒してブレーキを作動させるが、なぜか列車は止まらず、逆に速度が上がり続けてしまう。FOX小隊はやむを得ず機関装置を破壊して列車を強制的に停止させた。その衝撃で、他の乗客と共に列車の外へ投げ出された一行。線路近くに咲き乱れる彼岸花を見て、FOX小隊は生徒たちの記憶に思いを馳せるのだった。"
1604545363 = "駅弁"
2949529384 = "今度は「間違った乗車券」で列車に乗ってしまった先生。またしても車外に投げ出されそうになっていると、偶然居合わせたミヤコが助け舟を出してくれた。間一髪助かった先生は、その流れでミヤコと席が隣同士になる。他愛もない会話をする二人だったが、やがてSRTの話題になり、ミヤコの口からユキノの過去が語られる。"
