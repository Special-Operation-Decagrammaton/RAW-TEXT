3213371654 = "夕闇の高飛車トライアムヴィレイト（１）"
3267483309 = "夕闇の高飛車トライアムヴィレイト（２）"
3205956272 = "不凍の港の無敵徹甲（１）"
1759210737 = "不凍の港の無敵徹甲（２）"
3070106301 = "メスデク、泡となる白昼夢の投影"
599811565 = "キャスト・ガール・アウェイ"
574577555 = "先生のもとに万魔殿から動画メッセージが届く。その内容は、豪華クルーズ旅行への招待だった。せっかくのお誘いだからと参加を決める先生。優雅な旅行になるはずが……気づけば、一行が漂流してから7日が経とうとしていた。"
1186535370 = "ロマンティック・クルージング"
452291351 = "意気揚々と港にやって来た一行を待っていたのは豪華客船ではなく、古びた小舟。それはマコトが値段だけで判断して契約した結果だった。さらに、漁師から幽霊船の噂を聞かされるが、マコトは気にも留めず出航を決める。いざ海に出てみれば、なんだかんだと順調に思えたが、大海原のど真ん中でエンジンが故障し、船が動かなくなってしまう。"
1970933749 = "少女漂流記"
467099822 = "エンジンの故障をきっかけに、終わりの見えない漂流生活が始まる。通信装置も使えないが、1週間分の物資があるのなら、尽きる前に誰かしら助けに来るだろうと楽観的な態度のマコト。しかし無情にも時間は流れ、助けが来る気配もないままに日を重ねるなかで、イロハだけが危機感を募らせていく。"
3382519070 = "私のいる理由、そして船は発つべく"
3633066522 = "状況が改善しないまま迎えた漂流6日目。のんきな態度を崩さないマコトの一言で、ついにイロハが爆発してしまう。それを転機に、イロハの尽力で成り立っていた船の状況は一気に悪化していく。なぜ自分は万魔殿に所属しているのだろうとイロハが考え始めた時、状況に追い打ちをかけるようにして、幽霊船が姿を現すのだった。"
2635569648 = "ガイスターシップ"
736612902 = "いつになく勇敢なマコトは、制止も聞かずに謎のガレオン船への潜入を決行する。それを追いかける形で、結局全員でガレオン船に乗り込んだ一行は、デッキで海賊の幽霊に遭遇する。次々に出てくる海賊から逃走を試みるものの、床が崩れて分断されてしまう。"
1764056783 = "死せる悪魔の社会"
672366034 = "落下した先で手掛かりを探すサツキたち。怖がりながらも、されど着実に調査を進めるサツキの様子は、チアキも知らないような真剣さだった。集まった情報を整理して浮かび上がってきたのは、この船が数百年前のゲヘナに由来する可能性だった。"
2764933449 = "カリビアンの万魔殿"
3649124551 = "気づけば海賊をまとめ上げ、船長になっていたマコト。気合とカリスマで海賊たちを従えた彼女は、ガレオン船に「ビス丸」と名付け、高らかにキヴォトス征服を宣言する。一行の漂流は終わり、遥かな海原を進む旅が始まると思われたが、突如としてオデュッセイア海洋高等学校の風紀委員――トライデントが攻撃を仕掛けてきた。"
3055741969 = "Fools in August"
3735532875 = "ハルピュイア号に乗って警戒にあたっていた「トライデント」の見張りが、レーダーには映らない船が至近距離にあることを発見する。無線に応じず、ライトを使った警告も無視する幽霊船。功績を狙うスミカは、海賊討伐のために攻撃を命じる。方や、攻撃を受けたマコトたちは一致団結して反撃を開始するのだった。"
1933432205 = "ライフ・オブ・ビス丸（１）"
1351846767 = "装備が古く練度も低い万魔船のクルーたち。しかしイブキがその場で計算して作った弾道表のおかげで大砲の命中精度が大幅に向上する。そしてマコトの気合に応えるように、万魔船一行は迎撃に立ち上がる。思いがけぬ反撃にあったトライデントは取り乱し、船を使った体当たりを敢行するのだった。"
4046021370 = "ライフ・オブ・ビス丸（２）"
2928006900 = "体当たりをして乗り込んできたトライデントを退けていくマコトたち。勢いのまま、トライデントをハルピュイア号に押し戻すことに成功する。しかし喜んでいるのも束の間、トライデントの本隊が到着し、圧倒的で無慈悲な艦砲射撃の前に、なす術なくビス丸は水底へと沈んでいく。その刹那、海へ投げ出されそうになったマコトを助けたのは、喧嘩中だったはずのイロハだった。"
2222224926 = "塩水の夢"
724039273 = "トライデントに救助され、誤解が解けた万魔殿一行。しかし不思議なことに、海賊たちもビス丸も、煙のように消えてしまっていた。顛末を総括して、サツキはかつてのゲヘナ海洋学園沈没事故を語り、ビス丸が本物の幽霊船だった可能性を示唆する。一方、イロハとマコトは、イブキの計らいで和解するのだった。"
2984281256 = "ロマンティック・クルージング（本当）"
2837841855 = "海賊と勘違いして攻撃したお詫びとして、万魔殿一行はオデュッセイアの歓待を受ける。当初の予定とは異なるものの、今度こそ「本当」のクルーズ旅行が始まるのだった。"
1224711387 = "海賊、忍者、万魔殿"
2313542306 = "海賊にすっかり夢中になったイブキは「忍者海賊万魔殿」という新たなコンセプトを提案する。そうしてマコトとイブキがたわむれる裏で、イロハはチアキにこっそり謝るのだった。"
2162573193 = "夢の戦艦"
3920086545 = "すべてが終わった後、沈めてしまった小舟のお詫びとして、漁師へ最新鋭の船を贈るマコト。漁師から感謝されながら、マコトはビス丸に思いを馳せる。トライデントとの戦いを通して海戦に魅了されたマコトは、ビス丸2号建造という新たな野望を抱く。"
2035061192 = "海の賑やかな伝令者"
4007127749 = "オデュッセイアの謝罪使節としてゲヘナを訪れたスミカ。名前を聞いていなかったスミカは、「銀髪で強そうな人」という手掛かりを頼りにマコトの捜索を始める。案内されるまま、スミカがヒノム火山を登った先で出会ったのはヒナだった。"
2942384744 = "デイ・オブ・ザ・ロブスター"
3296040630 = "一行が漂流してからついに〇日目。万魔殿のメンバーと言えども限界が近づいていた。もはやこれまでかと思われた時、イブキが発見した無人島に上陸を果たす。その島で見つけたヤドカリにファイターとしての闘志を見出したマコトは「タイガーシャーク丸」と名付けるのだった。"
4068886041 = "砂浜をたどってやってきた貧乏キャラバン（１）"
4269663733 = "「タイガーシャーク丸」との出会いを喜ぶマコトの前に、突然アビドス対策委員会が現れる。売り言葉に買い言葉で、万魔殿一行はルールも分からぬままに「クラブファイト」で勝負することが決まる。ノノミの掛け声で、イロハvsアヤネの戦いの火ぶたが切って落とされる。"
1885748433 = "砂浜をたどってやってきた貧乏キャラバン（２）"
3994601186 = "イロハが勝利をおさめ、一行は、今まさにこの島で「最も早く星を5つ集めたチームが優勝」という天下一蟹・武術大会が開催されていることを知る。どんな願いでも叶えてくれるという「クイーンのなんでも券」が賞品であると聞き、マコトは優勝を目指すと高らかに宣言するのだった。"
3164504076 = "東奔西走、年中無休マッドドッグ（１）"
4067185913 = "島を探索していた一行は、公安局のカンナとコノカに声をかけられる。曰く、優勝候補だった対策委員会を倒したことで噂になっているとして、挑戦状を叩きつけられるのだった。"
3124498706 = "東奔西走、年中無休マッドドッグ（２）"
4289614980 = "チアキと相棒のブラックドリーは、激闘の末に勝利を収める。この連勝によって、さらに注目を集めるようになった、とカンナから忠告される一行。しかしマコトはものともせず、むしろ万魔殿の優秀さを知らしめる機会だと息巻くのだった。"
3614356968 = "光と影が交差するアクロバティック（１）"
1443103477 = "マコトが離れた隙を狙って、陰陽部のニヤがサツキに「[ruby=かいしょうせん]蟹承戦[/ruby]」を申し込む。クラブファイトに興味がないサツキは戦うことなく星を差し出そうとするが、星が無くなるとマコトが悲しむと言ってイブキに止められる。マコトがいない瞬間を的確に狙われたことに気づいたサツキは、情報戦に負けたままではいられないと勝負を受けるのだった。"
3292993986 = "光と影が交差するアクロバティック（２）"
2910015494 = "情報部長としてのプライドを懸けて応戦したサツキは、見事チセのカニを打ち破る。戻ってきたマコトが即座に状況を把握すると、ニヤはマコトへの認識を改めるのだった。"
2599035953 = "夕闇の高飛車トライアムヴィレイト（１）"
4190193347 = "順調に白星を重ねる万魔殿の前に、様子のおかしいティーパーティーが立ちはだかる。3対1は卑怯だと抗議するマコトに対し、ナギサは虎の子として1人の選手を紹介する。突然連れてこられて事情が分かっていない様子のヒフミとマコトの戦いが幕を開ける。"
3204464467 = "夕闇の高飛車トライアムヴィレイト（２）"
3284342036 = "ヒフミを相手に万魔殿は勝利を収める。これで優勝まで残すところ星1つとなったが、トリニティを下した今、最後の敵が誰なのか、想像がつかないのだった。"
1436369757 = "不凍の港の無敵徹甲（１）"
3168436421 = "最後の相手として立ちはだかるのは、レッドウィンター連邦学園のチェリノと巨大ガニ「粛清君2号」。その圧倒的な体躯に恐れをなしてしまうタイガーシャーク丸。万事休すかと思われたとき、イブキのクラブファイターとしての才能が開花し、カニカニさんと一緒に立ち向かうのだった。"
106858870 = "不凍の港の無敵徹甲（２）"
1951598584 = "星を5つ集め、ついに「クイーンのなんでも券」を手にしたマコト。世界征服を望み、願いが叶う――ことはなく、マコトの意識は現実に引き戻された。すべては儚い夢の後。現実は漂流の最中であった。それと同じころ、目を覚ましたホシノはセリカからお小言をもらうものの、どこか幸せそうな表情を浮かべるのだった。"
3470148017 = "メスデク、泡となる白昼夢の投影"
3280163468 = "白昼夢の中、先生の前に現れた元カイザーPMC理事。従えるは巨大な悪夢の集合体。ひとときの夢の中で何を見出すのかと先生に問いかけるのだった。"
1310881861 = "やっと始まった豪華クルーズ旅行。先生は船内を見回り、万魔殿の面々が楽しんでいる様子を見守る。"
878718668 = "海賊ごっこに夢中になっているイブキは、天才的な結論にたどり着く。"
3444594496 = "沈めてしまった船の補填をするべく港を訪れた万魔殿一行。水上艦のロマンに目覚めたマコトは超巨大戦艦に思いを馳せる。"
436985890 = "騒動の後始末のため、ゲヘナ学園に派遣されたスミカ。外交使節としての役割は簡単に終わるはずだったのに……？"
418745514 = "Dive into OCEAN！"
76319451 = "装備を維持するために慢性的な資金不足に苦しんでいたダイビング部。追い打ちをかけるようにして爆発事故を起こしてしまい、莫大な借金を抱えることに……ダイビング部は廃部の危機を回避できるのでしょうか？"
