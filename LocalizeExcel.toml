3866007255 = "ブリーチング（２）"
1150636869 = "たかがフジツボ、されどフジツボ"
3788559044 = "少女の磯笛"
3909686954 = "オデュッセイアを訪れた先生は、海面で涼やかな磯笛を響かせる少女を見つけるものの、声をかける間もなく逃げられてしまう。その生徒について先生に質問されたミナトとアミは、要注意部活であるダイビング部の生徒だろうと回答する。先生は、ダイビング部とコミュニケーションを取ることを決めるのだった。"
1976371281 = "イワシアイス"
3223223283 = "ダイビング部の居場所として教えられた、オデュッセイアの商業地区を訪れた先生は、サユリとマキナに出会う。最初こそ怪しまれたが、アイスクリームで懐柔することに成功する先生。しかし「ダイビング部」の話題を切り出すや否や、折悪しくトライデントの介入もあり、サユリとマキナは逃げ去ってしまう。"
1307571401 = "目が悪い少女"
1500223721 = "サユリとマキナを追っていた先生は、前方不注意で、ヘッドセットを着けた少女とぶつかってしまう。ダイビング部を探していると言う先生を不審がるコトネだったが、途中から会話に参加したココロが場を取りなしてくれる――かと思いきや、ココロは先生を見るなり「覗き魔」として警戒するのだった。"
2449328209 = "自慢の昆布茶"
2068229808 = "誤解が解けた後、昆布茶を振る舞ってもらう先生。お茶を飲みながら団らんする中で、ダイビング部の面々は財務状況について悩んでいると先生に相談を持ちかける。そこで先生は自分がダイビング部のスポンサーになると持ち出し、代わりに仕事を紹介するのだった。"
1603038281 = "危険なフジツボ"
3966383488 = "先生の仲介により、船底に付着したフジツボの除去を請け負うことになったダイビング部。作業効率を上げようとして、サユリとマキナは指定されたスクレーパーではなく、グラインダーを使い始める。その結果、船底での作業中に何かが爆発し、船体に穴を空ける事故を起こしてしまうのだった。"
2745376954 = "損害賠償"
75102599 = "財務状況を改善するどころか、事故の責任を問われて損害賠償が加わり莫大な借金を背負うことになったダイビング部。賠償は「部」に請求されるため、廃部にすれば事実上の帳消しになるとミナトが提案する。回答は保留し、途方に暮れるココロたちのもとへ、怪しげな生徒が近づいてくる。"
1198231585 = "密航者"
3344396155 = "廃部の危機を乗り越えるため、怪しげな生徒からの依頼を受けることにしたダイビング部。不安は抱えながらも地図に示されたブルーホールへと向かう一行だったが、途中で、意図しない乗船者がいると発覚する。勝手に船室で昼寝をしていた先生は、成り行きでこの冒険に同行することになる。その裏に、暗躍する影があることはまだ知らない……。"
1764096436 = "ブルーホール"
329886798 = "ブルーホールに到着し、潜水を開始するダイビング部。しかしクジラの群れが行く手を阻んでおり、サユリとマキナが早々に浮上してくる。次いでココロとコトネが潜水している間、先生の在り方について、マキナと会話する先生。しかし突如として、悪名高い「潮水の蛟龍」率いる船団が現れ、先生を人質に取る。"
415217445 = "潮水の蛟龍"
3259719005 = "ナナミは並外れた航海技術を持っており、アイランドの次期艦長とも目されるほどだった。しかしその思想ゆえに矯正局送りとなり、船団がバラバラになった過去があった。そんな「竜宮」再建の費用とするため、海底から龍涎香を引き上げるようダイビング部を脅迫するナナミ。装備がないことを理由にココロが渋ると、一行は縛られたまま放置されてしまうのだった。"
3599122265 = "そこでしか見えない価値"
3707980455 = "ダイバーとしての信念に反するものの、先生の安全には代えられないと、ナナミに屈服する道を選ぼうとするココロ。しかし先生の励ましによって、立ち向かう決意を固める。一行は対抗のための突破口を模索し始め、コトネが「友達」に協力を仰ぐ方法を思いつく。"
772854751 = "ブリーチング（１）"
691815538 = "ココロが不足を訴えた装備を用意して戻ってきたナナミは、海底に潜るよう、再びダイビング部を脅迫する。しかしココロはそれを拒み、クジラを誘導して船を大きく揺らす。生じた大波の衝撃によって先生とダイビング部は海へ投げ出された。海を漂いながら、ココロは先生に自分のオクトパスを渡すと、戦いの準備を整える。"
1265355110 = "ブリーチング（２）"
243643129 = "海中を自由自在に泳ぐダイビング部を相手に手も足も出ず、降伏を宣言するナナミ。もしもまた先生に危害を加えようとしたらただでは済まさないと、ココロはナナミに警告する。ナナミが撤退した後、戦闘の余波で船を失った一行は、助けが来るまで抱き合いながら海を漂うのだった。"
3903645147 = "たかがフジツボ、されどフジツボ"
3782928219 = "借金を返済するため、再び船底のフジツボ除去に励むダイビング部。作業現場を訪れたアミは、先生を守り抜いたことと「潮水の蛟龍」を撃退したことへの感謝をココロに伝える。その後、差し入れを買ってきた先生が合流し、みんなでアイスクリームを分け合って食べるのだった。"
640542078 = "フィールド用のローカライズ テーブルです。"
