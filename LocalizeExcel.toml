3843551598 = "@coaster_collector"
521646355 = "ねえ、このインスタンスに他の自治区へ転校したことある子っている？事情があって引っ越すことになったんだけど……転校先で上手く馴染めるか心配なんだよね。"
3301041165 = "まあ、どこに行ってもあんま変わんないし、そんな心配することないんじゃね？\n……トリニティからゲヘナに引っ越すとかなら話は別だけど。"
2524916188 = "でも、人間関係は一からだよね。私の友達の知り合いも、転校先で浮いちゃってて、ある日突然、下校中に失踪しちゃったんだって。"
260065013 = "なにそれ怖……そういえば最近、駅のホームから人がいなくなったって話をよく聞くかも。"
115731016 = "ヤバ……。知らない列車がD.U.を走ってるなんて噂もあるし、みんな乗る前にちゃんと列車番号を確認したほうがいいよ。"
3817449267 = "ハイランダーは全線、時刻表通りの運行を徹底しております。定刻発着となりますので、お乗り間違えのないようご注意ください。"
1108643620 = "嘘だね。この前黒ウナギ駅から乗った時、車輪の故障とか言って、連結器を切って先頭車両だけで走ってたじゃん？乗客は置き去りですかー？"
2923244495 = "でも、列車は定刻通りに着いたっしょ？"
2792993580 = "最近別の自治区の会社に転職したんだけどさ……福利厚生は悪くないんだけど、通勤距離が倍になってQOLが下がった気がするなぁ。会社に着く前にヘトヘトだよ。"
3826283237 = "昔よく使ってたホームの風景が恋しいな。その駅、変わった味のコーラが売られててさ。下校中に飲んで、一日を振り返るのが日課だったんだよね……。\nあのコーラ自体は他の場所でも買えるんだろうけど、日課が恋しい感じというか。"
569668290 = "え、なんか駅でケンカしてるんだけど。シャクハチを振り回しながら罵倒してる……。"
3121046672 = "あ、終わったみたい。ハイランダーの乗務員が処理してくれた。"
2949551040 = "ハイランダーの乗務員って、こういう時は頼りになるよね。普段はちょっと怖いんだけど。"
3382062091 = "そういえば、この前脱獄した「拝金のブローカー」が活動を再開したらしいんだけど……大丈夫なのかな。最近のキヴォトス、どんどん物騒になってくね。"
753672322 = "最新の流行が全然わかんない。「エモい」とか「メンブレ」みたいな略語でもついていくのがやっとだったのに、「わっぴ～」とかマジで意味わかんないんだけど。"
1880241926 = "わっぴ～？初耳なんだけど……。誰が使ってんの？"
4058788606 = "うちのトップ。"
1051276457 = "子ウサギ公園でデモをしてた件、今はもう解決したんだよね？この前近くに行く用事があったから覗いてみたら、まだテントがあったんだけど……。"
43854791 = "連邦生徒会から正式に許可もらったらしいよ。何か頼みたいことがあったら声をかけてみなよ。猫の捜索からスズメバチ退治まで、いろいろ手伝ってくれるから。"
3596670910 = "公立の学園しか通ったことないからよく分からないんだけど、私立の学園ってどんな感じ？校則が複雑だったり、生徒会長がどっかの企業の役員だったりするの？"
4083665102 = "学園によってまちまちだろうけど、運営費を企業が出してること以外はぶっちゃけ大差ないと思うよ？私がいたとこも製菓会社がバックにいる学園だったけど、公立と大して変わりなかったし。\nあ、でもおやつだけはマジで最高だった。"
2205564048 = "いつもハイランダー鉄道をご利用いただき、誠にありがとうございます。目的地到着後、ドアが開かない場合は、以下の手順に沿ってご対応くださいますようお願いいたします。\n\n1. 列車のドアはすべて、ドア下部にある非常開閉装置を使って手動で開けることが可能です。なお、非常開閉装置が見当たらない場合や赤く塗装されている場合は、別のドアをご利用ください。\n2. ドアを開ける前に、必ず窓の外の状況をご確認ください。外が暗い場合や駅名標が読み取れない場合は、まだ目的地に到着しておりません。座席にてそのままお待ちください。\n3. 操作方法につきましては、車内の非常通話装置から乗務員へお問い合わせいただけます。ただし、乗務員が直接確認のためこちらへ移動し始めた場合は、ただちに呼び出しをキャンセルし、隣の車両へ避難してください。\n4. 上記の手順を試してもドアが開かないケースがございますが、慌てず落ち着いて行動しましょう。ハイランダーの全列車は、必ず定刻通りに目的地へ到着いたします。\n\nハイランダー鉄道学園は、乗客の皆様の安全で快適な旅のため、常に最善を尽くしてまいります。\n\nまたのご利用を心よりお待ちしております。"
3448578073 = "これ、本当に公式アカウントの投稿？なんかIDも内容も変なんだけど……"
850879287 = "秋を代表する花といえば、赤が印象的な彼岸花は外せませんよね。\n茎に強力な毒があるため、あまり良い印象をお持ちでない方もいらっしゃるかもしれません。ですが、彼岸花の花言葉は再会を意味する「また会う日を楽しみに」なんです。\nもし再会をためらっている相手がいるなら、思い切って連絡してみてはいかがでしょうか？きっと相手も、あなたとまた会うのを楽しみに待っていると思いますよ。"
4010203972 = "「ユートピア」っていう、もう閉鎖されちゃった遊園地のこと知ってる人、いる？あそこさ、モモフレンズで有名なモモグループが運営してたらしいんだよね。\nでもモモグループってかなりの大企業じゃん？なんで急に廃業したんだろ。"
3270566292 = "「スランピア」のことね。一回行ったことあるけど、思ったより悪くはなかったよ。アニマトロニクスのクオリティも結構高かったし。"
3092491777 = "でも、連邦生徒会んとこの特殊部隊だっけ？あいつらが営業中にとんでもないミスをやらかしたんだよね。"
1421114832 = "連邦生徒会のところってことはSRT？何があったの？"
329296816 = "[この投稿は削除されました]"
