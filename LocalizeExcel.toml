3141468330 = "グレゴリオは付与されている弱体状態の数に応じて被ダメージ量が変わります。\n付与されている弱体状態の数はHPバーの右側のアイコンで確認でき、\nアイコンが緑色のときに攻撃すると、最も大きなダメージを与えることができます。"
3201704943 = "グレゴリオに弱体状態がかかると、同じ効果が聖歌隊に複製されます。\nまた、聖歌隊に与えるダメージはグレゴリオに転移されます。\nグレゴリオに弱体状態を付与し、敵に範囲攻撃をしてみましょう。"
2842532800 = "パイプオルガンは弱体状態を付与するスキルと弱体状態を解除するスキルを交互に発動します。\n弱体状態を付与するスキルが発動する時はグレゴリオに向け、\n弱体状態を解除するスキルが発動する時は味方に向けましょう。\n\nEXスキルでパイプオルガンを攻撃し、HPを0にすると向きが変わります。"
3073695909 = "味方のスキルで緑色の聖遺物を回復できます。\n緑色の聖遺物のHPをすべて回復すると、ヒエロニムスへのダメージを増加させてくれます。\n味方を回復させるスキルを持つ生徒を編成しましょう。"
920294052 = "呪いは一定時間が経つと爆発し、範囲内の味方に大きなダメージを与えます。\n呪い状態の味方のHPをすべて回復すると、呪いを解除できます。\nまたは弱体状態を解除するスキルで呪いを解除できます。"
1477654352 = "味方のスキルで赤色の聖遺物を回復できます。\n赤色の聖遺物のHPをすべて回復すると、ヒエロニムスのスキルの発動を妨害できます。\nスキル妨害に成功するとグロッキー状態になり、すべての味方ストライカー生徒のコスト回復力がアップします。\nヒエロニムスが強力なスキルを使用する際、赤色の聖遺物を使ってスキルを妨害しましょう。"
3649887449 = "ペロロミニオンに与えるダメージは、ペロロジラに転移します。\n広範囲攻撃で、できるだけ多くのペロロミニオンを攻撃しましょう。"
2904307815 = "大きなペロロミニオンは、HPが半分以下になると転倒します。\nペロロジラが大きなペロロミニオンを吸収する時、転倒した数に比例してグロッキーゲージの上昇が狙えます。\nペロロジラがグロッキー状態になると、小さなペロロミニオンを召喚します。"
3986141960 = "ペロロジラの「白熱眼光」スキルは、強力な持続ダメージを与え、防御力を大幅に減少させます。\n弱体状態を解除するスキルを使うと、この効果を解除できます。"
