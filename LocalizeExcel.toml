815986830 = "イブキ家出事件（３）"
3765673841 = "ゲヘナは今日も平和なり"
314611152 = "風紀委員会がいつものように問題児を取り締まっていると、通りがかったマコトが、こちらもいつものように横やりを入れる。往来でにらみ合う万魔殿と風紀委員会だったが、そこに割って入る謎の3人組が現れた。"
2404467793 = "ゲヘナ再興委員会"
280731846 = "ゲヘナ再興委員会を名乗る3人組。委員長のマユミは「今のゲヘナは偉大じゃない！」とマコトに向かって啖呵を切る。万魔殿と風紀委員会、それぞれの主張を聞いた後、マユミはゲヘナを再び強い学園にするべく、自分たちの手でゲヘナを一つにすると宣言する。"
1622727060 = "ゲヘナを偉大に！"
3973550309 = "草の根活動からコツコツと動き始めたゲヘナ再興委員会。しかし物事は思うように進まず、理想を実現する難しさを知る。ゲヘナ再興委員会のブレインであるショウコは、活動を権威づける「象徴」が必要だと提案する。すでにショウコの中には、具体的な相手が定まっているようだった。"
1641190660 = "ゲヘナを偉大に……！"
2210742662 = "先生へのコンタクトを取ったゲヘナ再興委員会は、自分たちが抱くゲヘナへの想いを熱く語り始める。厳格な規律があり、みんなが校則に従っていた、輝かしきゲヘナの時代を取り戻したい。その願いに応えて先生が協力を約束すると、マユミはすぐに行動を起こすのだった。"
4254754102 = "ゲヘナを偉大に……？"
2990294971 = "細かな内容の説明はショウコにバトンタッチしつつ、「偉大なゲヘナ」への理想を語るマユミ。その第一歩として、風紀委員会に取り締まられることなく好き放題暴れられる場所――トリガー・ハッピー・ゾーンの運営を始める。しかし実は無許可であったため、一行は万魔殿に事後承諾を取りに行くのだった。"
3499418034 = "交渉"
3711191844 = "活動許可を得るため万魔殿を訪れた再興委員会。ショウコの話術と先生の協力によって、どうにかマコトの説得に成功する。続けて風紀委員会のヒナにも面会し、事情説明をしたうえで不介入の約束を取り付ける。こうして、万魔殿と風紀委員会の双方から承諾を得たのだった。"
585418668 = "カレン"
3523112257 = "ゲヘナ学園の自治区外で、スケバンに脅されていたゲヘナ生を助けたカレン。その後、たまたま居合わせていた先生に気づいたカレンは、先生のボディガードを申し出る。おかげで無事に仕事を終えられた先生は、別れ際にカレンからゲヘナ再興委員会の活動に取り組む胸の内を聞くのだった。"
4058431972 = "トリガー・ハッピー・ゾーン"
705014674 = "「先着順」や「整列」といったルールを自発的に守り始めるようになったゲヘナの生徒たち。時間制限やマイレージ制度を通じて、ゲヘナに少しずつ秩序を浸透させようとするゲヘナ再興委員会の試みが、成果を見せ始めていた。その様子を見て先生は、ゲヘナ再興委員会を全力で応援しようと心に決めるのだった。"
3161366694 = "チャンス"
3695701956 = "ポイント制度の魅力を高めるために、貯めたポイントを使える提携店舗の営業に赴く一行。しかしいざ目的のお店の料理を食べてみると、噂ほど美味しくはなかった。偶然出会った美食研究会も同意見のようで、マユミの説得もむなしく、ハルナは容赦なく店を爆破してしまう。ショウコはそんな様子を前に思案を巡らせるのだった。"
3898526130 = "交渉……？"
4124917679 = "偉大なゲヘナを目指すうえで、美食研究会と温泉開発部が大きな不確定要素であると話すショウコ。カスミを意図的に避けてメグに接触することで、温泉開発部の行動を制御しようとするショウコだったが、カスミの反発を買ってしまう。差し当たっては事なきを得たものの、先生はそのやり方に小さな違和感を覚えるのだった。"
1319276458 = "見知らぬ平和"
200177053 = "ゲヘナ再興委員会の活動によって、ゲヘナは以前よりも静かになっていた。万魔殿以外の組織が影響力を拡大しているという事実に危機感を覚えるマコト。一方、風紀委員会は久しぶりの平穏を満喫して、のどやかな時間を過ごしていた。そんな中、イオリは以前にカレンと交わした「風紀委員会がいらなくなる未来」の会話を思い返す。"
1217784543 = "お悩み解決"
4186691531 = "ゲヘナには生徒が悩みを相談できる先が無いと気づいたマユミは、自分たちがその役割を担うことを決める。最初の相談となった「校内の幽霊騒動」を追ううちに、一行は放送室へとたどり着く。しかし鍵がかかっており中を確かめることは叶わない。ふと先生は、放送室にまつわる噂を思い出すのだった。"
35149090 = "森の中の木"
3348675679 = "かつて放送事故に遭遇したキララとエリカに話を聞くゲヘナ再興委員会。その証言を聞いたショウコは、何か心当たりがあるような様子で考え込む。お悩みを解決するためには、放送室に入って中を確かめる必要があると結論づけたゲヘナ再興委員会は、万魔殿に交渉しに行くのだった。"
38381485 = "揺れる炎の影"
3174880895 = "万魔殿を訪れたゲヘナ再興委員会は、これまでの活動実績を武器に交渉を進め、校内放送の権限を認めてもらう。合法的に入れるようになり、放送室の中を調査する一行。幽霊騒動の原因は、劣化していたケーブルの接続不良だと突き止める。さっそく依頼主に報告に行こうとするマユミとカレンの2人とは分かれて、ショウコは放送室に残り、静かに設備を見つめるのだった。"
3170845441 = "マユミ"
2615319093 = "トリガー・ハッピー・ゾーンを1人で掃除していたマユミ。先生に手伝ってもらいながら、ゲヘナへの深い愛情と、自分たちが変えていこうとしている学園の未来について語る。その裏では、ショウコが単独で万魔殿を訪れていた。放送機材の整備と放送網の拡張が終わったことを報告すると同時に、マコトの電撃演説を提案するのだった。"
3130877927 = "起こるべくして起こる"
1152577695 = "マコトが演説を始めようとしたその刹那、機材トラブルが発生し、謎の言葉が流れ始める。しばらくの後に復旧し、みんなが安堵したのも束の間、突如としてマコトがキヴォトスに宣戦布告する。即座に壇上にヒナが現れたため、マコトを止めるのかと思われたが、同調を示し握手を交わしたことによって現場は混迷を極めるのだった。"
2561484869 = "過去の遺産"
2431496816 = "状況を把握するためにゲヘナの部活を訪ねて回った先生は、マコトやヒナ、アコ、セナをはじめとする3年生だけに異変が発生していることに気づく。イロハやイオリなど、影響を受けていない2年生と対策を議論する先生のもとに、3年生であるサツキが訪れる。緊張が走るがサツキは影響を受けておらず、一連の騒動は「真のNKウルトラ計画」による洗脳が原因だと語るのだった。"
4211088235 = "一歩遅れた対処"
2745023164 = "唯一影響を受けなかった3年生、万魔殿情報部長のサツキ。彼女は雷帝のNKウルトラ計画の正体と、その危険性について語り始める。その内容を踏まえて、キヴォトスへの宣戦布告がゲヘナ内部だけの情報で留められているうちに、事態の収束を目指すことで意見が一致する。部活の垣根を越えて、ゲヘナの存亡をかけた作戦が動き出すのだった。"
3589255139 = "チナツ"
3107677907 = "救急医学部を訪れたチナツは、例に漏れずおかしくなってしまったセナと言葉を交わす。確かにセナであるはずなのに、ゲヘナによるキヴォトス全土への攻撃を正当化する姿を前にして、必ず元に戻してみせると決意を固めるのだった。"
792108159 = "ゲヘナ再興委員会の反応"
3808986636 = "ゲヘナを覆う狂気に、マユミとカレンは戸惑っていた。しかしショウコはこれこそが「偉大なゲヘナ」の到来だと歓迎する。ゲヘナ再興委員会の元を訪ねてきた万魔殿の3年生に連れられて、ショウコは万魔殿の作戦指令室へと向かうのだった。"
659494854 = "一つになったゲヘナ"
373240233 = "万魔殿と風紀委員会は手を取り合い、攻撃の準備を進めていた。自治区の資源が次々に徴用され、2年生たちも少しずつゲヘナを包む空気に染まっていく。その様子を見て、マユミとカレンは自分たちの目指す先を見失っていた。"
2329517258 = "辞めます"
3212628286 = "万魔殿を訪ねたマユミとカレンはマコトの説得を試みるが、強硬な態度を崩すことはできなかった。そんなマコトを見て、イロハは万魔殿を辞めると宣言する。離反したイロハの処遇を巡って、厳格に処理すべきと提案するショウコだったが、マコトはそれを拒否する。従うそぶりを見せつつ、ショウコは怪しく笑うのであった。"
1351431619 = "温泉開発部"
657902876 = "万魔殿から強引な命令を受けた温泉開発部。にべもなく断ろうとするカスミだったが、なぜか俄然やる気を出しているメグにおされて請け負ってしまう。メグの様子に強い違和感を覚えたカスミは、折り良く訪ねてきた先生に、胸の内を打ち明ける。その後、先生からゲヘナの現状を教えられたカスミは、全力で協力することを決めるのだった。"
2183499872 = "よく分からない"
2637879427 = "自分たちの活動が今回の事態を招いたのではないかと自責するマユミとカレン。先生は、その違和感こそが2人の努力が無駄ではなかった証だと伝える。先生の言葉に励まされたマユミとカレンは立ち直り、「本当に偉大なゲヘナ」を作るために戦うことを決めるのだった。"
276320167 = "チアキ"
2813606694 = "変わってしまった万魔殿を見て寂しさを感じていたチアキは、偶然鉢合わせたショウコに取材を行い、意見交換を試みる。平行線を辿る議論のなかで、チアキの記者としての勘はショウコが怪しいと強く訴えかけてくるのだった。"
3573775966 = "サツキ"
1320054402 = "万魔殿情報部のシークレット・チャンバーに先生を招いたサツキ。洗脳を解く方法を模索するかたわらで、サツキは雷帝時代のことを振り返る。過去、マコトと共に雷帝の遺産は全て処分したはずだと話すサツキは、当時の残党に思い至り、事態解決への糸口を見つけ出す。"
2574305810 = "レジスタンス結成"
1052683941 = "各組織の「後輩」が集結し、レジスタンスを結成する。とはいえ依然として洗脳を解く方法に頭を悩ませていたところに、サツキが朗報を持ち込む。曰く、洗脳に使われた周波数を打ち消す妨害周波数を使えば、洗脳を解除できる可能性があるらしい。そのためには使用された周波数を特定する必要があり、放送室に手掛かりがあると結論づける。"
2108264872 = "そばにいたい"
694612940 = "バラバラになってしまった万魔殿で、イブキは孤独に耐えていた。久々に戻ってきたイロハに、一緒に来ないかと誘われるものの、イブキはマコトの傍に残ることを選ぶ。洗脳され、慌ただしく攻撃準備に奔走するマコトだったが、イブキの言葉がマコトの無意識に眠る記憶を揺さぶっていく。"
3728999235 = "応援してくれる、先生？"
3966608263 = "放送室への潜入を試みるレジスタンス一同だったが、厳重な警備に行く手を阻まれてしまう。その動きを見越していたかのように、ヒナを連れたショウコが姿を現して警告を残す。去り際、ヒナに声をかけられて先生がついていくと、「保護」の名目で拘束されてしまうのだった。"
2512307957 = "監禁"
942929582 = "「保護」の名目で牢屋に閉じ込められてしまった先生。説得のためにマコトが訪れるものの、先生と意見の一致を見ることはない。続いてやってきてショウコも先生と対話を重ねるものの、逆にショウコ自身が、先生の言葉に動揺を見せるのだった。"
970775719 = "反逆者たち"
3347031609 = "戦闘糧食の準備をすべて任された給食部は、ハルナとアカリの監視下にありながら、可能な限りの引き延ばしをして抵抗していた。それが功を奏して補給計画にほころびが生じた結果、全体スケジュールの遅延を憂慮したマコトが雷帝の戦略兵器復元を決定し、事態は急速に動き始める。"
615477350 = "作戦立案"
2403023457 = "放送室の遠隔操作システムという障害を前に、キララとエリカが協力を申し出る。綿密な準備を進めようとしていたものの、雷帝の兵器が復元されそうになっている、とチアキが持ち込んだ情報により、作戦を直ちに開始することとなった。"
3540415323 = "ゲヘナ奪還作戦（１）"
1438541752 = "放送室へ潜入し、設定した妨害周波数を学園全体に向けて送信する。その最終目標に向けて、ゲヘナの命運をかけた作戦が開始される。温泉開発部が地下坑道を掘って先生を救出する一方、イオリとチナツは陽動として本館へ突入し、敵の注意を引きつける。"
3781429285 = "ゲヘナ奪還作戦（２）"
196335811 = "ゲヘナ本館を目指すイオリとチナツの前に、ヒナとマコトが立ちはだかる。それでも2人は、己の身も顧みず、届くと信じて呼びかけ続ける。あいにく状況は変わらず、じりじりと追い詰められていくものの、先生の到着までどうにか持ちこたえることに成功する。マユミやカレンも合流し、反撃開始と思われたその時、ショウコが姿を現した。"
3226876046 = "炎となる私たち"
3737355680 = "ショウコは勝利を確信し、自身が雷帝の追従者であると明らかにする。しかしサツキの執念によって辿り着いた妨害周波数がゲヘナに響き渡り、洗脳が揺らぎ始める。これですべてが終わると思われたものの、解除の寸前に[ruby=デス・トリガー]致命的装置[/ruby]が発動し、3年生たちの精神が破壊されそうになってしまう。打ちひしがれる2年生たちだったが、イロハの慟哭に応えてマコトがついに目を覚まし、ゲヘナを覆う雷帝の遺産を打ち払うのだった。"
2627851490 = "残したもの"
4261624041 = "全校生徒の前で謝罪しようとするヒナを制し、すべての責任は自分が負うと宣言するマコト。その演説を聞いて呼応し、一つにまとまっているゲヘナ生を見て、マユミとカレンは再出発を決める。ヒナは風紀委員会に、マコトは万魔殿に戻り、それぞれの形で後輩に謝罪する。その後、先生はマコトに、ただマコトでいてほしいという宿題を課すのだった。"
2393383984 = "残されたもの"
151641469 = "元に戻った先輩たちは、それぞれの後輩たちとの和解の時間を過ごす。一方カスミは今回の事件の背後に、自らがかつて所属していた「[ruby=Bodensatz]ボーデンザッツ[/ruby]」の影を感じ取る。"
2010497725 = "消えることのない"
4159819389 = "今回の事件で浮き彫りとなった、自らの暗い一面と向き合うヒナ。自責にかられるヒナだったが、先生は優しく支えて再び立ち上がる手助けをするのだった。これですべては一件落着……とはいかず、投獄されたショウコは黒幕の存在を先生に明かし、マコトとヒナは雷帝の遺したものについて静かに語り合う。"
3001593746 = "S.O.S."
746532052 = "海辺でアロナ、プラナと宝探しをしていた先生。ロープを編んで作られたボールをアロナが発見し、先生が拾い上げると「S.O.S.」の文字が書かれていた。これを遭難信号だと考えた先生は、連邦生徒会長のもとを訪ね、意見を求める。連邦生徒会長は、ボールがオデュッセイアから流れ着いたものだと見抜き、航海中の船団に帰還を命じるのだった。"
246641988 = "オリュンポス号の帰還"
1574683535 = "オデュッセイアの帰港を聞きつけ、多くの観衆が港へ詰めかける。先生と連邦生徒会長はスミカを始めとするオデュッセイアの生徒に迎えられ、旗艦たるオリュンポス号への乗船を果たす。盛大な歓迎のもと、生徒会である「アイランド」の長――海路ミナト艦長と対面するのだった。"
2840471655 = "海の禁忌"
4107757722 = "ミナトの案内で、オデュッセイアのさまざまな部活を見学する先生。行く先々で出会うオデュッセイア生は「船乗りの禁忌」を過敏に気にかけているようだった。一通り回った後、先生と連邦生徒会長は、会談に入る前に夕食会へ招待される。"
902993283 = "白い制服とカレー"
206447646 = "オデュッセイアの伝統に従い、カレーを振る舞われた先生と連邦生徒会長。食事の後に設けられた会談の場において、オデュッセイア生が「禁忌」を重視していることを語るミナト。続けて、S.O.S.と書かれたボールについて先生が尋ねると、ミナトは「サミーのおもちゃ」だと答えるのだった。"
1453439230 = "年老いた猫、サミー"
4054456941 = "遭難信号が誤解だったことに安堵する先生。しかしミナトは、こうして呼び戻されていなくともD.U.への帰港を検討していたと話す。曰く、体調が悪化したサミーの処遇をめぐって「禁忌」を理由に学園内で対立が生じているとのことだった。連邦生徒会長は1週間の猶予を設けて対策を探ることにする。"
989252645 = "好奇心は猫をも……"
3030870987 = "1週間の猶予期間が設けられたものの、船乗りの禁忌をなぞるかのように、サミーの行く先々で偶然にも不運が続く。オデュッセイアの生徒が禁忌への不安を募らせる中、先生は甲板で転んだスミカを助けようとして腰を痛めてしまう。"
83253996 = "落ち着かない待ち時間"
2355009320 = "オデュッセイアの医務室に運び込まれた先生は、医務室長であるサナエの治療を受ける。その途中、サナエはサミーの下船を巡る議論について、生徒の自己満足にすぎないと冷静に評する。そこに連邦生徒会長が現れ、先生を連れて「アイランド」を訪ねるのだった。"
1925103632 = "第三の選択肢"
2863133021 = "決断を先延ばしにしていたミナトは、自らの弱さを認め、苦悩していた。その姿を見かねた連邦生徒会長は、自身の「権威」でもってサミーを下船させる大義名分にすることをミナトに提案する。悲し気な面持ちながらも、ミナトはやむを得ず受け入れるのだった。"
3044534023 = "砂漠に咲く花"
4064366271 = "その日は書類地獄だったものの、当番に来たアヤネのおかげで予定より早く片づいた。先生と一緒にゆっくりとした休憩時間を過ごしながら、アヤネは大切にしているヘアピンへの思い入れと、将来の希望について語るのだった。"
4002954459 = "思わぬプレゼント"
3433269143 = "先生の手伝いをしていた最中に、網タイツを破いてしまったカリン。仕事中に破れてしまったのだから新しいタイツを贈らせてほしいと言って、先生はカリンを連れてファッションコーナーに向かう。替えも含めてたくさん買ってもらったカリンは、今日の思い出として1足は大切に取っておく、と話すのだった。"
3855969483 = "追憶するフロイライン"
3093547927 = "忙しいと言うイロハのもとを不意打ち気味に訪ねた先生。休憩スペースの大掃除を手伝う中で、先生は1冊の本を見つけていた。イロハは、読書にハマるきっかけとなった本だと説明する。この日を境に、その本に新たな思い出が追加されるのだった。"
3764553248 = "普通"
1131725880 = "「門主」の肩書を忘れ、今だけは普通の生徒として過ごしたいと先生にお願いするキサキ。とはいえ、やはりどこか肩に力が入ってしまう。その様子を見た先生は、もっと甘えていいと提案する。こうして、自分の心のままに振る舞うことを覚えるキサキだった。"
972685946 = "タガを外して"
3383869734 = "先生が待ち合わせ場所に行くと、そこで待っていたのはキキだった。普段のキサキとは打って変わって、開放的な様子ではしゃぐキキ。先生も一緒になって1日中遊んで過ごすものの、少し張り切りすぎてしまい、キサキの身体は疲労を訴えていた。"
3844124237 = "天界への旅"
2515631888 = "早朝にキサキからの誘いを受けて、渓谷名物だというボートを一緒に楽しむ先生。二人を乗せた小舟は、静かに水面を進む。悠然とそびえ立つ山々が形作る渓谷を、朝霧が包んでいく。天界にも見紛う景色のなか、キサキと先生はお互いの輪郭を確かめ合うのだった。"
103013825 = "青い蝶"
1653920718 = "渓谷から戻ってしばらくのこと。キサキは、せっかく用意した水着を活かせる場所に行きたいと先生にお願いする。海で遊び、ウォーターパークにも訪れた二人。1日を終えて満足げな様子のキサキは、遠回しな例え話をする。いまひとつ先生の理解は及ばなかったが、それでもキサキは満面の笑みを見せるのだった。"
2180840207 = "ウォーターベッド"
3638633883 = "シュンは先生と一緒に、渓谷での避暑を満喫していた。川の中で浮力に身を任せたり、川の水で冷やしたフルーツを食べたりして過ごす二人。リラックスしすぎた先生は、シュンに支えられて浮いたまま寝そうになってしまう。慌てたシュンは先生を連れて河原に上がり、冷えた体を温めるように包み込むのだった。"
2482562584 = "夏。いつもとは違う一面。"
3649906930 = "いつもとは違う一面を見せられるから夏が好きだ、と話すシュンは、シュエリンの姿で先生の前に現れた。見た目相応にはしゃぐシュエリンと一緒にラフティングをしたり、商店街で食べ歩きをしたりする二人。ひとしきり遊んで休憩していると、急に秘薬の効果が切れてシュンに戻ってしまうのだった。"
2138405107 = "思い出の上書き"
2996173795 = "前日の失敗を挽回するため、改めてシュンの姿で同じスケジュールをこなしていく二人。見た目相応に大人びた振る舞いを見せるシュンに対して、今度は先生が幼児退行して甘え始める。我に返った二人は、すべてを夏のせいにするのだった。"
1177889008 = "水遊びの引率"
3092431370 = "シュンにお願いされて、梅花園の園児たちの引率をすることになった先生。訪れた先のウォーターパークで元気いっぱいな園児の面倒を見ていると、時間は瞬く間に過ぎていく。園児たちを帰して、引率としての務めを果たした後、シュンと先生は二人きりの時間を過ごすのだった。"
4116035908 = "華麗なる議長の夏"
3200421019 = "ゲヘナの生徒が、万魔殿どころか自分のことまで忘れかけていると知ったマコト。畏敬の念を向けさせるためにイメージチェンジを図ろうとするマコトは、水着を用意していた。水着姿を自然に見せる方法について相談する中で、泳ぐのは苦手だと白状してしまうマコト。泳ぐのは無しで、自然に水着姿を認知させる方法を考えるべく、マコトは先生に相談するのだった。"
4205255274 = "慌てる議長の夏"
3624659385 = "水着モデルとしてデビューすることを決意したマコト。そんな中、万魔殿の部室に乗り込んできた風紀委員との揉め事を先生が仲裁するが、その姿を見たマコトは複雑な思いを抱く。"
1438650316 = "照れ屋な議長の夏"
3239871215 = "先生を避け続けていたマコト。だが学校のプールで再び先生と向き合うことになり、自分が気づいてしまった感情を素直に打ち明ける。"
2635540075 = "完璧なる議長の夏"
4287275201 = "水着グラビアの撮影現場で完璧な姿を披露するマコト。いつか先生も自分の完璧さに気づくはずだと言い、これからもずっと傍にいてほしいと願う。"
685871196 = "サツキの安全対策 "
487370655 = "浜辺でサツキと合流した先生は、日焼け止めを塗りたくられたり、水遊びの時間を管理されたり、サツキによる徹底した安全対策を受ける。サツキの説明がひとしきり終わったところで今度は先生がサツキに日焼け止めを塗って、パラソルの下で海を眺めて過ごすのだった。"
439246109 = "サツキの海対策 "
2404183346 = "危ないといって海に入るのを嫌がり、波を避ける訓練に励んでいたサツキ。先生に勧められ、初めて浅瀬へ足を踏み入れた彼女は、少しずつ海に慣れていく。その後、海の楽しさを知ったサツキだったが、安全意識は変わらず持ち続けているのだった。"
2187272134 = "サツキの痛み対策"
3738602266 = "最初は海を怖がっていたサツキだったが、ようやく、先生と水をかけあって遊べるくらいには慣れてきていた。しかし足に絡まるワカメを触手と勘違いして驚いたり、足に触れたビニール袋をクラゲと勘違いしてしまうサツキ。腰が抜けてしまったサツキは、しばらく先生に抱き着いているのだった。"
3323625327 = "サツキの視線対策"
3500781959 = "前の場所よりも賑わっている海岸へ移動したサツキと先生。砂浜で起こる問題に巻き込まれるが、次々に解決していく先生。しかし気づいた時には夕方になってしまっていた。問題を見過ごせないことには好感を抱きつつも、一緒にいるのだから自分を見てほしいという相反する感情に揺れるサツキ。周囲の安全は自分が確認するからと言って、先生には自分だけを見ていてほしいとお願いするのだった。"
4252501786 = "京極サツキ "
613672079 = "夜の海を先生と歩くサツキ。暗い場所は怖くて大嫌いなのに、なぜか今この瞬間はまったく気にならないことにサツキが気づく。暗闇が怖くない理由が、先生が隣にいるからだと気づく。"
3283459532 = "バカンスが始まると……"
316385823 = "一緒に記事を書こうとチアキに誘われて海へ向かう先生。ぼったくりとの情報提供を受けていた屋台に入る2人。しかしチアキを週刊万魔殿の記者だと見抜いた店主が採算度外視のサービスをする。感動したチアキはそれを大々的に記事にしたものの、無茶を続けた結果、遅からず店は潰れてしまった。"
4103963358 = "ある書記によると"
2044523053 = "チアキと共にスクープを追って海へ向かった先生。特ダネを掴んだものの、紙のメモを忘れてしまい、記録を取れない状況に陥ってしまうチアキ。あれこれと悩んだ結果、チアキは砂浜に書き残せばいいのだと気づく。しかしせっかく書き留めたメモを、大きな波がひと波で流し去ってしまった。"
1989992924 = "最近の調査によると"
1236249763 = "スクープ不足で元気のないチアキ。先生目線ではスクープに見えるようなことも、ゲヘナ基準では大したことがないとつまらなそうにしているチアキ。そんな彼女が海辺で遭遇したのは、とんでもない大スクープだった。"
2149469591 = "NC、ND。"
2069910016 = "先生と共に原稿の仕上げに取りかかるチアキ。先生の刺激的なネタを求めるチアキだったが、先生も先生でなかなか手ごわくスクープをつかませてくれない。もはや、なければ作ればいいという考えに辿り着いたチアキは、斬新なアイデアを思いつく。チアキは先生を机の中に閉じ込めるのだった。"
1281609261 = "アウスフルークレリンと優雅な夏休み"
1167915423 = "休みを勝ち取ったと言って、先生の執務室にやってきたイロハ。季節感もなく、いつも通り本を読んでだらけているイロハを見て、「もっと夏らしく過ごしたらどうか」とつい先生が言ってしまう。それを聞いたイロハは、なぜか持ってきていた水着に着替えて読書を再開するのだった。"
2444307689 = "アウスフルークレリンと特別な夏休み"
3234070202 = "先生にお願いされるまま虎丸を運転していたら、海に連れてこられていたイロハ。海辺でも読書ばかりで、お店も巡ったが最終的に、パラソルの下で先生と並んで本を読むことにした。"
4103184573 = "アウスフルークレリンと夏休みの終わり"
3787449724 = "先生を逃避行に誘い、海沿いの静かな田舎町へ連れ出したイロハ。気の向くままに市場やカフェ、海辺を歩いてまわる。いよいよ日も暮れようかという時間になり、茜色に染まる砂浜を歩く2人。今日が夏休み最後の日だと明かし、いつか一緒に、どこか遠くへ逃げてしまおうと誘うのだった。"
3091035621 = "アウスフルークレリンと夏の巡回？"
2147745274 = "虎丸で巡回中、イロハは先生に声をかけられる。迷うそぶりを見せつつ、戦車の中に入ってくるよう先生に伝えるイロハ。いざ先生が中に入ると、なぜかイロハは水着姿だった。エアコンが壊れて暑い。誰に見られるでもないから、水着で巡回していたと言い訳を重ねるイロハ。先生を乗せたまま、海へサボりに行こうとするのだった。"
159171374 = "イブキとお休み！"
3087532465 = "遊ぶ約束をして海を訪れた先生とイブキだったが、日ごろの疲れがたたってしまい、海辺に着くなり眠ってしまう。日差しを避けて何度もパラソルを動かす先生を見たイブキは、ヤシの木陰へ案内してゆっくり休ませてくれる。"
739228984 = "イブキと授業！"
1008969371 = "先生を生徒にして、海の生き物講座を開くイブキ。岩場に始まり、波打ち際、浅瀬など、場所に応じた生物をイブキが紹介してくれる。しかし触手に毒を持ったアオクラゲがイブキのほうに流されてきてしまう。怖がったイブキは先生にしがみついて、海から上がった後もしばらく離れないのだった。"
3506753372 = "イブキとごはん！"
4087976993 = "夏限定の浜辺の屋台で食べ歩きを楽しむ2人。途中、先生が食べていたものをカモメに奪われてしまうが、行く先々の屋台でオマケしてもらっていたイブキが先生にも分けてくれた。2人仲良く食べて、お腹も心も満たされたのだった。"
1004419525 = "イブキと、一緒に。"
501030319 = "絵を描くために、貝殻やガラス片を集めるイブキ。先生は熊手を買って来て、効率よく集められるように協力するが、いざ使ってみるとたくさんの漂流ゴミも引っかかってしまった。それを見たイブキが「これで海がきれいになるね！」と笑うのを見て、感動する先生。最後には5袋分のゴミも集められたのだった。"
3876238400 = "ダイバーと安全対策"
157835473 = "シャーレの当番に訪れたココロは、備品の片づけをするなかで、オフィスの至るところに危険が潜んでいると指摘する。そのまま、事故防止のための対策を講じることに夢中になるのだった。"
1723241164 = "ダイバーと船歌"
3165996038 = "作業中、ついつい鼻歌を歌っているところを先生に聞かれてしまったココロ。恥ずかしがるココロに曰く、自分の歌を聞いた人はみんな海に飛び込んでしまうのだそう。先生がお願いすると、体を縛って万全の準備を整えたうえで歌を聞かせてもらえることになる。圧倒的音痴な歌声に、どうにか意識を保つ先生だった。"
4007337301 = "ダイバーと味噌汁"
734483639 = "味噌汁が苦手だと言うココロ。先生が不思議に思っていると、荒天で海が荒れ、視界の悪い状態を「味噌汁」と表現することがあるとココロが教えてくれる。むしろ、ダイビング終わりに食べる温かいお味噌汁は好きだと話すココロ。今日は作りすぎたということで、先生もお味噌汁を分けてもらって一緒に食べるのだった。"
1015913429 = "ダイバーと減圧症"
1328713023 = "先生がダイビング部の活動見学に来ていたある日のこと。先生のミスによって緊急浮上を余儀なくされ、減圧症になってしまったココロ。意識が朦朧とする中で、ココロは大胆に先生を頼るのだった。"
990427823 = "好奇心旺盛なシャチ"
2551132856 = "目が悪く、近づかなければ相手を見分けられないコトネ。そんな彼女を心配する先生に、コトネは音で相手を判別する方法があると話し、水中でよく聞こえる音について教えてくれる。"
798055919 = "迷子のシャチ"
2080254678 = "眼鏡が壊れ、ほとんど前が見えなくなってしまったコトネは、新しい眼鏡を作るために先生と一緒に眼鏡店へと向かう。道中、普段の格好のコトネを連れ歩いている先生は針のむしろだったが、コトネに気にする様子はない。しかし眼鏡を作り終え周りが見えるようになったことで、ようやくコトネも恥ずかしがるのだった。"
3352714660 = "漂流するシャチ"
2890681896 = "会う約束をしていた場所にコトネが見当たらず、心配する先生。辺りを探し回っていると、海面に浮かんでいるコトネを発見する。曰く、日向ぼっこしながら水に寝転がるのは快適であるとのこと。誘われて先生も試してみるものの、上手くバランスをつかめず、リラックスできないのだった。"
1149286592 = "伝えたいシャチ"
3091744008 = "航海中に短波通信で仲良くなった相手がいるというコトネ。しかし最近になって連絡が途絶えてしまったため、事前に聞いていた住所に手紙を送ろうとしていた。ポストの前まで来たはいいものの、迷惑じゃないだろうかと考えて、コトネは手紙を出すべきかためらってしまう。先生はそんなコトネを励まし、背中を押すのだった。"
4176315336 = "一種のマンネリズム"
508250077 = "温泉開発部の海辺での合宿に向けて準備を進めるカスミ。先生と一緒に買い出しに赴くが、その途中でブラックマーケットのスケバンに絡まれてしまう。しかしカスミは普段とは違い、驚くほど穏便にその場を収めるのだった。"
4115258558 = "薬屋の彷徨い（１）"
2861337959 = "ブラックマーケットを訪れていた先生はギャングに攫われてしまう。そんな先生を助け出したのは、偶然にも通りがかったカイだった。山海経における一件以来の身の上をかいつまんで説明したカイは、その足で居候先まで先生を連れていく。案内された先で、家主の老人は大病を患っていた。"
2018946506 = "薬屋の彷徨い（２）"
1752426576 = "老人を治そうと思えば治せるが、あえてやっていないというカイの言葉を受けて、治療をお願いする先生。代わりにカイのお願いを1つ聞く、という約束で取引が成立する。カイが調合した薬を飲むと、瞬く間に老人は元気を取り戻した。"
2538956798 = "薬屋の彷徨い（３）"
792075492 = "ブラックマーケットに来た目的を先生に尋ねたカイは、その回答に呆然とする。しかしそれが結果としてカイの興味を引くに至り、先生はカイと一緒にブラックマーケットを見て回ることになった。ブラックマーケットを視察していたところ、二人は家主の老人がギャングに囲まれている現場に出くわすのだった。"
257972076 = "薬屋の彷徨い（４）"
3746302841 = "ギャングと老人の言い争いがエスカレートするのを見かねて、カイが事態に介入する。カイは難なく場をおさめるが、「老人を救った」という自分の行動に強い違和感を覚えるのだった。"
3789536442 = "薬屋の彷徨い（５）"
4060686472 = "山海経での一件以来、カイは混乱の中にあった。その契機となったのは、先生にかけられた言葉だとカイは言う。「普通」が理解できないことに自覚的であるからこそ、カイは分からない何かが自分の内に芽生えたことに戸惑っているのだった。"
3249063630 = "薬屋の彷徨い（６）"
123379259 = "悩むカイに対して、「普通」を勉強してみようと提案する先生。しかし、誰しもにとって自然なことが、自分にとっては不自然なのだとカイは答える。それでも練習してみてほしいという先生の言葉を胸に、カイは普通と向き合う1歩を踏み出すのだった。"
208885278 = "イブキ家出事件（１）"
3468041821 = "マコトがプリンを勝手に食べてしまい、腹を立てたイブキは万魔殿を飛び出して家出する。全力で探し回るマコトの努力もむなしく、イブキは見つからない。その頃、便利屋68は偶然イブキと出会っていた。イブキが万魔殿であることに気づき一度は怯むものの、見るに見かねて行動を共にすることを決める。"
2954703779 = "イブキ家出事件（２）"
10866310 = "イロハの依頼でイブキの捜索を始める風紀委員会。便利屋68と楽しく過ごしていたイブキはアコに発見されるが、帰ることを拒んでしまう。ハルカまでもがイブキと一緒にいたいと言い始め、アルはイブキとアコを便利屋68の事務所に連れ帰るのだった。"
1790224862 = "イブキ家出事件（３）"
1674270680 = "便利屋68の事務所へと集まった一同と、遅れてやってきた万魔殿の面々。マコトはイブキへ謝罪し、それぞれが胸の内を語り合う。しかし和やかな空気とは裏腹に、カヨコとマコトが意味ありげな会話を交わす。そして去り際、アコはカヨコに「嵐」にまつわる情報を伝えるのだった。"
3355347890 = "嵐過天晴"
2518541355 = "玄武商会が山海経の外に投資を行っていると聞きつけた玄龍門。山海経の在り方を巡って一触即発になるが、先生は投資先である渓流の観光地へ査察に行こうと提案する。"
3134481129 = "ある夏の日"
4109295345 = "広報部長"
2034772764 = "査察"
1740108994 = "水遊びと査察、総合的に休暇（１）"
