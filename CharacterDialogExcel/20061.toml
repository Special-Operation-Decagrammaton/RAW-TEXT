[translation]
20061-10-1 = "うむっ！ブルーアカイブッ！"
20061-20-1 = "……聞こえるかな、火薬が炸裂する音が。\n火がついた爆弾を止めることはできない――\nそれこそがロマンというものだ。"
20061-30-1 = "様式美こそ、\n大切にするものだね。"
20061-40-1 = "素晴らしい！\nこれほどの\n蔵書があるとは……。"
20061-50-1 = "何やら視線を\n感じたような……\n気のせいか。"
20061-60-1 = "温泉の装飾に……は\n難しいな。"
20061-70-1 = "ふむ、\nこのデザイン……\n参考になるな。"
20061-80-1 = "おや先生。\n先に失礼していたよ。"
20061-90-1 = "ちょっと追われていてね……"
20061-100-1 = "しばし匿っては\nくれないだろうか？"
20061-110-1 = "まさかこんな時に当番とは……\nいやはや。"
20061-120-1 = "まぁ、構わないさ。\nここにいる限りは追われる\nことはないだろうからな。\nハーハッハッハッ！"
20061-130-1 = "シャーレ当番は最高だ！"
20061-140-1 = "追いかけてくる\n連中がいないからな！"
20061-150-1 = "まぁ、しかし……\n道中が不安だがね。"
20061-160-1 = "シャーレは\n良い立地をしている……\nしかし……"
20061-170-1 = "温泉がないのだけが残念だ……"
20061-180-1 = "おや、そんな\n目をしないでくれよ。"
20061-190-1 = "少しずつ燃えていく芯……"
20061-200-1 = "あれを眺めていると、\n血が騒ぐんだ。"
20061-210-1 = "……花火の話だとも。\nハーハッハッハッハ！"
20061-220-1 = "ん？\n水着を着ているからって\n泳ぐわけないだろう。"
20061-230-1 = "……湯船で泳ぐのは\nマナー違反だからな。\n披露できなくて残念だ。"
20061-240-1 = "読書？\nああ、暇つぶしの一環だ。"
20061-250-1 = "まあ、趣味と言えない\nこともないがね。"
20061-260-1 = "時は金なり、というだろう？\n時間は有限だからな。\n遊んでいてはもったいない。"
20061-270-1 = "うむ！実にめでたい日だ！\n遠慮することはない、先生。"
20061-280-1 = "パーティーを\nはじめようじゃあないか！"
20061-290-1 = "ああ、今日は\n私の誕生日だとも！\n祝ってもらいに来たぞ！"
20061-300-1 = "いやぁ～なかなか\n誕生日だというのに\n落ち着かなくてな！"
20061-310-1 = "あけましておめでとう、\n先生！"
20061-320-1 = "なんだ急に。\n時節の挨拶は大切だろう？"
20061-330-1 = "こっちの界隈では特にな。"
20061-340-1 = "クリスマスの時期は\n寒いからな！\n温まるものが必要だろう！"
20061-350-1 = "我ら温泉開発部の出番、\nというわけだ！"
20061-360-1 = "そんな顔をするな、先生。"
20061-370-1 = "我々ほどキヴォトスに\n貢献している部活は\n他にないのだぞ？"
20061-380-1 = "ふんふふんふん～"
20061-390-1 = "今日は愉快な日だな先生！\nうむ！"
20061-400-1 = "ああ……\nそういう日に、するのだがな。"
20061-420-1 = "知っているだろう？\nこの辺りは\n治安が悪いんだ。"
20061-430-1 = "ひと一人消えた程度じゃ、\n誰も気づかない。"
20061-440-1 = "詰めが甘いよ、先生。"
20061-450-1 = "一を識って、\n二を知らず、だ。"
20061-460-1 = "先生が私を\n助けようとすればするほど……"
20061-470-1 = "私にとって、\n良い手駒となる。"
20061-480-1 = "そして――\nそういうものであればあるほど、"
20061-490-1 = "手に入れたくなるというのが\n人の性だ。"
20061-500-1 = "私の本性が知りたいと\n言っていただろう……？\n感想はいかがかな？"
20061-510-1 = "引き返したいと言っても――\nもう遅いがね。"
20061-520-1 = "……サプラーイズ！"
20061-530-1 = "それっぽかっただろう？\nそう怖い顔をしないでくれ。\n冗談だよ。"
20061-2600-1 = "リスクは覚悟の上で共にいる、\nと考えても良いのだな？\nそれなら重畳――地獄行きの片道切符に、\n最後まで付き合ってもらおうじゃあないか。\nハーハッハッハッハ！"
