[translation]
10148-10-1 = "Blue, Archive."
10148-20-1 = "I'm still being bothered on my summer vacation... Well, it is what it is, so we'll get through it. Take care of me, okay?"
10148-30-1 = "I hate inconspicuous outfits..."
10148-40-1 = "Somewhere with as few Gehenna students as possible..."
10148-50-1 = "I wish our members would learn a thing or two from here."
10148-60-1 = "Huh, looks comfy."
10148-70-1 = "Did Sensei do all this?"
10148-80-1 = "You know."
10148-90-1 = "I've been wondering this, but why do you work so hard?"
10148-100-1 = "Can't you at least take a break for today?"
10148-110-1 = "Eh?"
10148-120-1 = "Oh, Sensei. Welcome."
10148-130-1 = "Am I \"getting ready\" for work? ...Is that necessary?"
10148-140-1 = "...Just kidding. I already prepped everything. The faster we finish, the faster we can rest."
10148-150-1 = "Working, even out at sea? Are you serious?"
10148-160-1 = "Ugh, well..."
10148-170-1 = "I guess if I have to. I'll help you."
10148-180-1 = "My vacation plans this year? Hm... About that."
10148-190-1 = "Is there really a point to taking an expensive, tiring trip for the sake of \"travelling\"?"
10148-200-1 = "Heh."
10148-210-1 = "Nothing."
10148-220-1 = "You like my swimsuit, don't you?"
10148-230-1 = "Might kind of make it worth it for me..."
10148-240-1 = "Ah, this suitcase?"
10148-250-1 = "I was just going to use it as-is."
10148-260-1 = "But Ibuki was so excited about decorating it."
10148-270-1 = "...And I like it better now, anyway."
10148-280-1 = "Ugh, seriously..."
10148-290-1 = "Oh, sorry."
10148-300-1 = "Not you, Sensei. The Pandemonium Society messaged me. "
10148-310-1 = "They need help, as usual."
10148-320-1 = "Can I just...ignore them for a day?"
10148-330-1 = "Ah, Sensei. Happy birthday."
10148-340-1 = "Wooow. That's one disappointed look."
10148-350-1 = "I get it. You wanted more, didn't you?"
10148-360-1 = "Hm, should we do this? I'll grant one of your wishes, Sensei. Just for today. No matter what it is."
10148-370-1 = "...I'd rather people not find out about my birthday."
10148-380-1 = "I hate it when people make a big deal out of it."
10148-390-1 = "And if they get ME something, I have to get THEM something on their birthday."
10148-400-1 = "Eh, I mean, since it's you, though..."
10148-410-1 = "...I'm okay with you knowing."
10148-420-1 = "Ah. Happy New Year."
10148-430-1 = "What's so special about the new year anyway... And everyone's all excited and stuff for the Pandemonium Society event."
10148-440-1 = "Eh, I managed to sneak this out of the chaos. I'll just hang around down here until things simmer down."
10148-450-1 = "Do you have some snacks? I'm in the mood for something spicy today."
10148-460-1 = "Welcome."
10148-470-1 = "...Oh, were you expecting a \"Merry Christmas\"?"
10148-480-1 = "Well, it's not like I hate the holidays..."
10148-490-1 = "But putting in extra effort to just to celebrate is a pain too..."
10148-500-1 = "So I'd rather just go somewhere comfy and relax on days like today."
10148-510-1 = "Now, Sensei. Choose."
10148-520-1 = "Trick or treat!"
10148-530-1 = "You can pick both, if you want."
10148-550-1 = "Fufu, you're making a funny face."
10148-560-1 = "Don't be mad at me. It was just a joke."
10148-570-1 = "The sand is so warm."
10148-580-1 = "I can feel the leftover heat from the sun..."
10148-590-1 = "Today was really fun."
10148-600-1 = "What about you? ...Did you have fun too?"
10148-610-1 = "Should we just...not go back?"
10148-620-1 = "Should we run away together? That sounds nice... Somewhere far, far away."
10148-2600-1 = "Usually, people are nice because they expect something in return. Like more effort or better work. I hate those stipulations. But if it's you... I don't mind if you have expectations."
