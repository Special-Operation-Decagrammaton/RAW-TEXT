[translation]
10148-10-1 = "Blue Archive"
10148-20-1 = "มาพักร้อนแล้วต้องลำบากอะไรแบบนี้...\nแต่ในเมื่อเป็นแบบนี้แล้ว ก็มาช่วยกันหาทางรอด\nกันเถอะค่ะ ฝากตัวด้วยนะคะ"
10148-30-1 = "เพราะแบบนี้แหละ\nฉันถึงไม่ชอบชุดที่\nเด่นสะดุดตา..."
10148-40-1 = "ขอไปที่ที่\nมีนักเรียนเกเฮนน่า\nน้อยที่สุด..."
10148-50-1 = "คนของแพนเดโมเนียม\nโซไซตี้ น่าจะเรียนรู้\nเรื่องแบบนี้ไว้บ้างนะคะ"
10148-60-1 = "โอ้ เป็นที่ที่น่าอยู่\nไม่ใช่เล่นเลยนะ"
10148-70-1 = "ทั้งหมดนี่\nคุณครูตกแต่ง\nเองเลยเหรอคะ?"
10148-80-1 = "คือว่า"
10148-90-1 = "ฉันลองคิดดูแล้ว\nเราต้องใช้ชีวิตอย่างขยันขันแข็ง\nขนาดนั้นด้วยเหรอคะ?"
10148-100-1 = "อย่างน้อยในวันแบบนี้\nก็ควรพักผ่อน\nไม่ใช่เหรอคะ?"
10148-110-1 = "หืม?"
10148-120-1 = "อ้อ คุณครู เชิญค่ะ"
10148-130-1 = "เตรียมงานเหรอคะ?\nจำเป็นด้วยเหรอคะ...?"
10148-140-1 = "ล้อเล่นค่ะ... ฉันจัดการ\nไว้เรียบร้อยแล้วค่ะ\nรีบทำให้เสร็จแล้วไปพักเถอะค่ะ"
10148-150-1 = "ทำงานแม้กระทั่ง\nอยู่กลางทะเลเหรอคะ?\nพูดจริงเหรอคะ?"
10148-160-1 = "เปล่าหรอก ก็..."
10148-170-1 = "ช่วยไม่ได้จริงๆ สินะคะ\nถ้างั้นฉันจะช่วยเองค่ะ"
10148-180-1 = "แผนเที่ยวปีนี้เหรอคะ?\nอืม... นั่นสินะคะ"
10148-190-1 = "ทำไมต้องเสียเงินแพงๆ\nแล้วลำบากไปไกลๆ ด้วยล่ะคะ?"
10148-200-1 = "หืมม~"
10148-210-1 = "ไม่มีอะไรค่ะ"
10148-220-1 = "แค่เห็นว่าคุณครูใส่ใจ\nชุดว่ายน้ำมากพอตัวเลย"
10148-230-1 = "ไม่เสียแรงที่ฉันเลือกมาเลยนะคะ?"
10148-240-1 = "อ่า กระเป๋าเดินทางใบนี้เหรอคะ?"
10148-250-1 = "ฉันก็ตั้งใจว่าจะใช้เฉยๆ"
10148-260-1 = "แต่ดูเหมือนอิบูกิ\nจะอยากตกแต่งให้น่ะค่ะ"
10148-270-1 = "สุดท้ายแล้ว...\nฉันค่อนข้างชอบเลยค่ะ"
10148-280-1 = "อ่า ให้ตายสิ..."
10148-290-1 = "อ๊ะ ขอโทษค่ะ"
10148-300-1 = "ฉันไม่ได้พูดกับคุณครูนะคะ\nแค่เมื่อกี้แพนเดโมเนียม โซไซตี้\nติดต่อมา..."
10148-310-1 = "ดูเหมือนจะเกิดเรื่องอีกแล้ว"
10148-320-1 = "วันนี้ฉัน...\nขอไม่กลับไปได้มั้ยคะ?"
10148-330-1 = "อ๊ะ คุณครู\nสุขสันต์วันเกิดค่ะ"
10148-340-1 = "โห ทำหน้าผิดหวังสุดๆ เลยนะ"
10148-350-1 = "เข้าใจแล้วค่ะ\nฉันต้องใส่ใจมากกว่านี้สินะคะ?"
10148-360-1 = "ถ้างั้น แบบนี้เป็นยังไงคะ?\nวันนี้ฉันจะทำตามคำขออะไรก็ได้\nของคุณครูหนึ่งอย่างค่ะ"
10148-370-1 = "ฉันไม่ค่อย...\nอยากให้ใครรู้วันเกิดค่ะ"
10148-380-1 = "ฉันไม่ชอบให้คนรอบข้าง\nเอะอะโวยวายและฉลองให้"
10148-390-1 = "ถ้าได้รับของขวัญ\nก็ต้องตอบแทนอีก มันยุ่งยากน่ะค่ะ"
10148-400-1 = "แต่ก็นะ คุณครูรู้วันเกิด\nของฉันอยู่แล้วนี่คะ"
10148-410-1 = "งั้นฉันจะ...\nคาดหวังนิดหน่อยค่ะ"
10148-420-1 = "อ๊ะ สวัสดีปีใหม่ค่ะ"
10148-430-1 = "ก็แค่ปีใหม่แท้ๆ แต่ทุกคนใน\nแพนเดโมเนียม โซไซตี้กลับตื่นเต้น\nกับงานนู่นงานนี่กันใหญ่..."
10148-440-1 = "แต่นั่นก็ทำให้ฉัน\nแอบหนีออกมาได้ค่ะ\nอ่า ขออยู่จนกว่าจะสงบลงหน่อย\nแล้วค่อยกลับได้มั้ยคะ?"
10148-450-1 = "พอจะมีของว่างบ้างมั้ยคะ?\nวันนี้ฉันอยากกินอะไร\nเผ็ดๆ หน่อยค่ะ"
10148-460-1 = "เชิญค่ะ"
10148-470-1 = "อ่า... อยากฟังคำว่าเมอร์รีคริสต์มาส\nอะไรแบบนั้นเหรอคะ?"
10148-480-1 = "คือ ฉันเองก็ไม่ได้\nเกลียดบรรยากาศ\nแบบนี้หรอกนะคะ"
10148-490-1 = "แต่ถ้าต้องอุตส่าห์จัดฉลอง\nก็ออกจะยุ่งยากนิดหน่อย..."
10148-500-1 = "ในวันแบบนี้ ถ้าเป็นไปได้\nฉันก็อยากอยู่ในที่ที่สบายใจ\nแล้วใช้เวลาอย่างช้าๆ ค่ะ"
10148-510-1 = "เอาละ คุณครู ตัดสินใจสิคะ"
10148-520-1 = "จะยอมส่งขนมมาโดยดี\nหรือว่าจะโดนแกล้ง"
10148-530-1 = "แต่ก็มีตัวเลือกที่\nขอทั้งสองอย่างด้วยนะคะ"
10148-550-1 = "ฮุฮุ ทำหน้าตลกจัง"
10148-560-1 = "อย่าโกรธสิคะ\nฉันแค่แกล้งเล่นเอง"
10148-570-1 = "ทรายอุ่นๆ เลยนะคะ"
10148-580-1 = "เพราะยังมีไออุ่นของแดด\nหลงเหลืออยู่..."
10148-590-1 = "วันนี้ทั้งวัน...\nสนุกไม่ใช่เล่นเลยนะคะ"
10148-600-1 = "คุณครูก็?\nรู้สึกเหมือนกันมั้ยคะ..."
10148-610-1 = "ถ้างั้นเรา...\nไม่กลับกันดีมั้ยคะ?"
10148-620-1 = "ออกเดินทางกันมั้ยคะ?\nอยากให้เป็นแบบนั้นจัง...\nได้ไปที่ไกลๆ"
10148-2600-1 = "เวลามีใครทำดีกับเรา ปกติมักมีอะไร\nแอบแฝงใช่มั้ยคะ? เช่นให้ทำให้ดีกว่านี้\nหรือให้พยายามให้มากกว่านี้ เรื่องแบบนั้น\nฉันรำคาญน่ะค่ะ แต่ว่า... ถ้าเป็นความ\nคาดหวังของคุณครู ฉันก็ไม่ได้ไม่ชอบขนาดนั้นค่ะ"
