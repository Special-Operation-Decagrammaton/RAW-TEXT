[translation]
10148-10-1 = "蔚藍，檔案。"
10148-20-1 = "為什麼都來渡假了還得做這種事……\n既然都變成這樣了，就一起加油吧。"
10148-30-1 = "就是因為這樣，我才\n討厭引人注目的打扮……"
10148-40-1 = "盡可能找個格黑娜學生\n少一點的地方……"
10148-50-1 = "要是真琴前輩他們\n也能學著點就好了。"
10148-60-1 = "感覺還挺舒服的呢。"
10148-70-1 = "這些全都是\n老師準備的嗎？"
10148-80-1 = "老師。"
10148-90-1 = "你是不是……\n有點太努力了？"
10148-100-1 = "不是常說休息也是\n工作的一部分嗎？"
10148-110-1 = "對吧？"
10148-120-1 = "啊啊，歡迎回來。"
10148-130-1 = "工作的準備……？\n咦……非做不可嗎？"
10148-140-1 = "開玩笑的。\n我已經整理好了，\n快點處理完去休息吧。"
10148-150-1 = "這些……全都是今天以前要\n完成的工作嗎？你是認真的？"
10148-160-1 = "不，那個……"
10148-170-1 = "真拿你沒辦法。\n我來幫忙吧。"
10148-180-1 = "旅行計畫？\n沒有耶……"
10148-190-1 = "因為出遠門不是很麻煩嗎？\n而且還要花錢。"
10148-200-1 = "哼嗯～？"
10148-210-1 = "不，沒什麼。"
10148-220-1 = "是啊……我才沒有注意到\n老師正在看著這邊呢。\n真的沒有。"
10148-230-1 = "……泳裝。\n看來我認真挑選\n還是值得的。"
10148-240-1 = "啊啊，\n是說行李箱上\n的貼紙嗎？"
10148-250-1 = "不是，我本來打算\n就這樣直接用的……"
10148-260-1 = "但是伊吹想貼，\n我就成全他了。"
10148-270-1 = "多虧如此，\n我也開始對它有感情了。"
10148-280-1 = "唉，好麻煩……"
10148-290-1 = "啊，不，抱歉。"
10148-300-1 = "剛才不是在說老師。\n是萬魔殿傳來的聯絡……"
10148-310-1 = "看來又有麻煩事了。"
10148-320-1 = "今天真不想回去呢……"
10148-330-1 = "啊，老師。\n今天是你的生日吧？\n祝你生日快樂。"
10148-340-1 = "咦，就算你露出\n這麼落寞的表情……"
10148-350-1 = "唉……只用嘴巴說\n還不夠滿意嗎？"
10148-360-1 = "那麼……我就答應\n你的一個請求吧。\n……任何事都可以。"
10148-370-1 = "生日還是保密比較好。"
10148-380-1 = "如果收了禮物的話，\n要回禮也很麻煩。"
10148-390-1 = "我最討厭別人大肆\n嚷嚷著要幫我慶祝了。"
10148-400-1 = "不過……老師\n應該知道吧？"
10148-410-1 = "所以……\n嗯，我很期待哦。"
10148-420-1 = "啊，新年快樂。"
10148-430-1 = "因為新年的關係，\n整個萬魔殿都很興奮……"
10148-440-1 = "不過，我也是因為\n這樣才能偷偷溜出來。"
10148-450-1 = "在冷靜下來之前，\n請讓我躲在這裡。"
10148-460-1 = "歡迎回來。"
10148-470-1 = "……難道你希望我說\n「聖誕快樂！」之類的嗎？"
10148-480-1 = "雖然我也不討厭\n這種氣氛……"
10148-490-1 = "只是特地準備很麻煩。"
10148-500-1 = "這種日子，不是會\n想在能放鬆的地方\n悠閒度過嗎？"
10148-510-1 = "來吧，老師。\n請做出決定。"
10148-520-1 = "要交出點心，\n還是接受惡作劇。"
10148-530-1 = "……也有「都要」的選項哦？"
10148-550-1 = "呵呵。\n真是個好表情。"
10148-560-1 = "請不要生氣。\n這只是個可愛的\n惡作劇嘛。"
10148-570-1 = "沙子，暖呼呼的呢。"
10148-580-1 = "還殘留著白天的熱度……"
10148-590-1 = "……今天一整天，\n我過得很開心。"
10148-600-1 = "老師也是？\n……這樣啊。"
10148-610-1 = "既然如此……\n乾脆別回去了？"
10148-620-1 = "就這樣，到某個\n遠方……之類的。"
10148-2600-1 = "「再加油一點」、「要努力」之類的。\n這些事情，基本上都很麻煩對吧。\n不過，如果那是老師對我的期待……\n感覺也不壞呢。"
