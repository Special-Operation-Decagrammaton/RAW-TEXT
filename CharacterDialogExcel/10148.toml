[translation]
10148-10 = "블루, 아카이브."
10148-20 = "피서까지 와서 무슨 고생을…….\n뭐, 이렇게 된 이상, 서로 살길을 찾아보죠.\n잘 부탁드려요."
10148-30 = "이래서 눈에\n띄는 차림은\n싫었는데……."
10148-40 = "가급적\n게헨나 학생이\n적은 곳으로……."
10148-50 = "만마전 사람들도\n이런 건 좀 배웠으면\n좋겠는데요."
10148-60 = "오, 제법 아늑해\n보이는 장소."
10148-70 = "여기 전부,\n선생님이\n꾸민 건가요?"
10148-80 = "있잖아요."
10148-90 = "생각해 봤는데,\n그렇게 열심히 살 필요가\n있을까요?"
10148-100 = "적어도 이런 날에는\n휴식을 취하는 게\n맞지 않을까요?"
10148-110 = "네?"
10148-120 = "아, 선생님. 어서 오세요."
10148-130 = "업무 준비요?\n……그게 필요한가요?"
10148-140 = "……농담이에요.\n제대로 정리해 뒀어요.\n빨리 끝내고 쉬러 가죠."
10148-150 = "바다에서까지 일이요?\n진심인가요?"
10148-160 = "아니, 뭐어……."
10148-170 = "진짜 어쩔 수 없네요.\n도와드릴게요."
10148-180 = "올해 여행 계획이요?\n으음…… 그렇네요."
10148-190 = "왜 비싼 돈을 써서,\n귀찮게 멀리 가야 하나요?"
10148-200 = "흐응~"
10148-210 = "아무것도 아니에요."
10148-220 = "수영복,\n꽤 신경 쓰시는구나, 해서."
10148-230 = "저도, 고른 보람이 있네요?"
10148-240 = "아, 이 캐리어요?"
10148-250 = "저는 그냥 쓰려고 했는데."
10148-260 = "아무래도 이부키가\n꾸며주고 싶었던 모양이라서요."
10148-270 = "……결과적으로는,\n꽤 마음에 들었어요."
10148-280 = "아, 진짜……."
10148-290 = "아, 죄송해요."
10148-300 = "선생님한테 한 거는 아니고요,\n잠깐 만마전에서\n연락이 와서……. "
10148-310 = "또 사고가 난 모양이라."
10148-320 = "……저, 오늘\n안 돌아가도 될까요?"
10148-330 = "아, 선생님.\n생일 축하드려요."
10148-340 = "우와, 되게 섭섭한 표정."
10148-350 = "알았어요.\n좀 더 성의가 필요한 거죠?"
10148-360 = "그럼, 이러면 어때요?\n오늘 하루, 선생님 부탁.\n뭐든지 하나 들어드리는 걸로."
10148-370 = "……생일은 별로\n알리고 싶지 않아요."
10148-380 = "주변에서 호들갑 떨면서\n축하하는 것도 싫고,"
10148-390 = "어쩌다 선물이라도 받으면\n나중에 갚아야 하니까 귀찮고."
10148-400 = "뭐, 그래도,\n선생님은 제 생일을 아시지만요."
10148-410 = "……조금은,\n기대할게요."
10148-420 = "아, 새해 복 많이 받으세요."
10148-430 = "새해가 뭐라고,\n만마전 모두 행사니 뭐니로\n들떠 있어서……"
10148-440 = "뭐, 덕분에 이렇\n 몰래 빠져나왔지만요.\n아, 좀 조용해질 때까지\n있다 갈게요?"
10148-450 = "혹시 간식 있나요?\n오늘은 살짝\n매콤한 게 땡기는데."
10148-460 = "어서 오세요."
10148-470 = "……아, 혹시 메리 크리스마스,\n같은 걸 원하시는 걸까요?"
10148-480 = "뭐, 저도 딱히\n이런 분위기를\n싫어하지는 않는데요."
10148-490 = "굳이 챙기는 것은\n좀 귀찮다고 할까……."
10148-500 = "이런 날 정도는,\n기왕이면 마음 편한 장소에서,\n느긋하게 보내고 싶네요."
10148-510 = "자, 선생님. 결정하시죠."
10148-520 = "순순히 과자를 내놓을지,\n장난을 당할지."
10148-530 = "일단, 둘 다 가능한\n옵션도 있긴 한데요."
10148-550 = "후훗, 우스운 표정."
10148-560 = "화내지 마세요.\n그냥 장난이니까."
10148-570 = "모래, 따끈따끈하네요."
10148-580 = "아직 햇살의 온기가\n남아 있어서……."
10148-590 = "……오늘 하루,\n제법 즐거웠지요."
10148-600 = "선생님도?\n……같으신가요."
10148-610 = "차라리 이대로……\n돌아가지 말까요?"
10148-620 = "떠날까요?\n그러면 좋을 텐데…… 저 멀리."
10148-2600 = "누군가 잘해줄 때는, 보통은 꿍꿍이가 있잖아요?\n조금 더 잘하라든지, 노력하라든지.\n그런 거, 저는 귀찮거든요.\n그래도…… 선생님의 기대는,\n그렇게 싫지는 않아요."
