[translation]
10148-10 = "ブルー、アーカイブ。"
10148-20 = "どうしてバカンスに来てまでこんなことを……。\nまぁこうなった以上、お互い頑張りましょう。"
10148-30 = "これだから\n目立つ格好は\n嫌なんですよ……。"
10148-40 = "できるだけ、\nゲヘナ生が\n少ない所に……。"
10148-50 = "マコト先輩たちも\n見習ってくれたら\nいいんですけど。"
10148-60 = "なかなか居心地が\n良いですね。"
10148-70 = "これ全部、\n先生が揃えたの\nでしょうか？"
10148-80 = "先生。"
10148-90 = "少し、\n頑張りすぎなんじゃ\nないですか？"
10148-100 = "休むのも仕事のうち\nと言うでしょう？"
10148-110 = "ね？"
10148-120 = "ああ、\nおかえりなさい。"
10148-130 = "仕事の準備……？\nえ……\nやらなきゃダメですか？"
10148-140 = "冗談です。\nまとめておいたので、\n早く片づけて休みましょう。"
10148-150 = "これ……\n全部今日までの仕事ですか？\n本気で言ってます？"
10148-160 = "いや、その……。"
10148-170 = "仕方ありませんね。\n手伝いますよ。"
10148-180 = "旅行の計画？\nありませんけど……。"
10148-190 = "だって遠出をするのって\n面倒じゃないですか。\nお金もかかりますし。"
10148-200 = "ふ～ん？"
10148-210 = "いえ、\n何でもありません。"
10148-220 = "ええ……\n先生がこちらを見ていることに\n気づいている、なんて。\nそんなことはありません。"
10148-230 = "……水着。\n真剣に選んだ甲斐は\nありましたかね。"
10148-240 = "ああ、\nスーツケースの\nシールですか？"
10148-250 = "いえ、私はそのまま使おう\nと思っていたんですが……。"
10148-260 = "イブキが貼りたがっていたので、\n好きにさせました。"
10148-270 = "おかげで、\n愛着が湧いてきたところです。"
10148-280 = "はぁ、めんどくさい……。"
10148-290 = "あ、いえ、すみません。"
10148-300 = "今のは先生に\n言ったのではなくて。\n万魔殿からの連絡で……"
10148-310 = "また面倒事みたいです。"
10148-320 = "今日は\n帰りたくないですね……。"
10148-330 = "あぁ、先生。\n今日、お誕生日でしたよね？\nおめでとうございます。"
10148-340 = "え、そんな寂しそうな\n顔をされましても……。"
10148-350 = "はぁ……\n言葉だけではご不満ですか。"
10148-360 = "じゃあ……1つだけ、\nお願いを聞いてあげます。\n……何でも。"
10148-370 = "誕生日は秘密にして\nおくに越したことはありません。"
10148-380 = "プレゼントを\nもらってしまったら、\nお返しが面倒ですし。"
10148-390 = "お祝いだ、と騒がれるのと\nかまっぴらです。"
10148-400 = "でも……先生は\n知ってますよね？"
10148-410 = "だから……\nまあ、楽しみにしてますよ。"
10148-420 = "あぁ、あけまして\nおめでとうございます。"
10148-430 = "新年だからと\n万魔殿全体が\n浮かれていて……。"
10148-440 = "まぁ、おかげで\nこっそり抜け出して\nこれたんですけどね。"
10148-450 = "ほとぼりが冷めるまで\n匿ってください。"
10148-460 = "おかえりなさい。"
10148-470 = "……もしかして\n「メリークリスマス！」とか、\nお望みですか？"
10148-480 = "私も雰囲気は\n嫌いじゃないんですけどね……"
10148-490 = "わざわざ準備するのが面倒で。"
10148-500 = "こんな日くらい、\nくつろげる場所でゆっくり\n過ごしたいじゃないですか。"
10148-510 = "さあ、先生。決めてください。"
10148-520 = "お菓子を出すか、\n悪戯されるか。"
10148-530 = "……オプションで\n「両方」もありますよ？"
10148-550 = "ふふっ。\nいい顔をしますね。"
10148-560 = "怒らないでください。\nかわいいイタズラじゃ\nないですか。"
10148-570 = "砂、温かいですよね。"
10148-580 = "まだ昼の熱が\n残っていて……。"
10148-590 = "……今日1日、\n楽しかったです。"
10148-600 = "先生も？\n……そうですか。"
10148-610 = "それならいっそ……\n帰るの、やめません？"
10148-620 = "このまま、\nどこか遠くへ……なんて。"
10148-2600 = "「もっと頑張れ」とか、「努力しろ」とか。\nそういうのって、\n基本はめんどくさいじゃないですか。\nでも、それが先生からの期待だったら……\n悪くはありませんね。"
