[translation]
10148-10 = "Blue, Archive."
10148-20 = "I'm still being bothered on my summer vacation... Well, it is what it is, so we'll get through it. Take care of me, okay?"
10148-30 = "I hate inconspicuous outfits..."
10148-40 = "Somewhere with as few Gehenna students as possible..."
10148-50 = "I wish our members would learn a thing or two from here."
10148-60 = "Huh, looks comfy."
10148-70 = "Did Sensei do all this?"
10148-80 = "You know."
10148-90 = "I've been wondering this, but why do you work so hard?"
10148-100 = "Can't you at least take a break for today?"
10148-110 = "Eh?"
10148-120 = "Oh, Sensei. Welcome."
10148-130 = "Am I \"getting ready\" for work? ...Is that necessary?"
10148-140 = "...Just kidding. I already prepped everything. The faster we finish, the faster we can rest."
10148-150 = "Working, even out at sea? Are you serious?"
10148-160 = "Ugh, well..."
10148-170 = "I guess if I have to. I'll help you."
10148-180 = "My vacation plans this year? Hm... About that."
10148-190 = "Is there really a point to taking an expensive, tiring trip for the sake of \"travelling\"?"
10148-200 = "Heh."
10148-210 = "Nothing."
10148-220 = "You like my swimsuit, don't you?"
10148-230 = "Might kind of make it worth it for me..."
10148-240 = "Ah, this suitcase?"
10148-250 = "I was just going to use it as-is."
10148-260 = "But Ibuki was so excited about decorating it."
10148-270 = "...And I like it better now, anyway."
10148-280 = "Ugh, seriously..."
10148-290 = "Oh, sorry."
10148-300 = "Not you, Sensei. The Pandemonium Society messaged me. "
10148-310 = "They need help, as usual."
10148-320 = "Can I just...ignore them for a day?"
10148-330 = "Ah, Sensei. Happy birthday."
10148-340 = "Wooow. That's one disappointed look."
10148-350 = "I get it. You wanted more, didn't you?"
10148-360 = "Hm, should we do this? I'll grant one of your wishes, Sensei. Just for today. No matter what it is."
10148-370 = "...I'd rather people not find out about my birthday."
10148-380 = "I hate it when people make a big deal out of it."
10148-390 = "And if they get ME something, I have to get THEM something on their birthday."
10148-400 = "Eh, I mean, since it's you, though..."
10148-410 = "...I'm okay with you knowing."
10148-420 = "Ah. Happy New Year."
10148-430 = "What's so special about the new year anyway... And everyone's all excited and stuff for the Pandemonium Society event."
10148-440 = "Eh, I managed to sneak this out of the chaos. I'll just hang around down here until things simmer down."
10148-450 = "Do you have some snacks? I'm in the mood for something spicy today."
10148-460 = "Welcome."
10148-470 = "...Oh, were you expecting a \"Merry Christmas\"?"
10148-480 = "Well, it's not like I hate the holidays..."
10148-490 = "But putting in extra effort to just to celebrate is a pain too..."
10148-500 = "So I'd rather just go somewhere comfy and relax on days like today."
10148-510 = "Now, Sensei. Choose."
10148-520 = "Trick or treat!"
10148-530 = "You can pick both, if you want."
10148-550 = "Fufu, you're making a funny face."
10148-560 = "Don't be mad at me. It was just a joke."
10148-570 = "The sand is so warm."
10148-580 = "I can feel the leftover heat from the sun..."
10148-590 = "Today was really fun."
10148-600 = "What about you? ...Did you have fun too?"
10148-610 = "Should we just...not go back?"
10148-620 = "Should we run away together? That sounds nice... Somewhere far, far away."
10148-2600 = "Usually, people are nice because they expect something in return. Like more effort or better work. I hate those stipulations. But if it's you... I don't mind if you have expectations."
