[translation]
16019-10-1 = "ブルー、アーカイブ。"
16019-20-1 = "パーフェクトメイド、パーフェクトリコン。\n飛鳥馬トキです。\n大船に乗ったつもりでお任せください。"
16019-30-1 = "休息は重要です。\n週休4日くらいが\n適切かと。"
16019-40-1 = "身体を\n休められるところは\nないでしょうか。"
16019-50-1 = "カフェインと糖分は\n欠かせません。"
16019-60-1 = "このカフェの\nレシピは……\n及第点です。"
16019-70-1 = "次回の任務のために\n休憩して\nおきましょう。"
16019-80-1 = "うぅん……"
16019-90-1 = "んん……"
16019-100-1 = "はっ！？"
16019-110-1 = "先生、いらしたのですね。"
16019-120-1 = "……違います。\n退屈のあまり居眠りを\nしていたわけではありません。"
16019-130-1 = "私を起こそうと、\n先生が近くに\n来てくださるかも……。"
16019-140-1 = "なんて下心など、\nありませんので。"
16019-150-1 = "先生、\nお待ちしておりました。"
16019-160-1 = "それでは、\n今日の仕事を始めましょう。"
16019-170-1 = "片づけよし、\nタスクリストよし、\nコーヒーよし、お菓子よし。"
16019-180-1 = "すべて整えてあります。"
16019-190-1 = "はい、迅速に\n褒めてください。"
16019-200-1 = "趣味について\n真剣に考えたところ――"
16019-210-1 = "楽しいと思うことをすれば良い、\nという結論に至りました。"
16019-220-1 = "ですので、先生。"
16019-230-1 = "一緒にマンガを読みませんか？\nそれともゲーム？"
16019-240-1 = "配信を観るのでもいいですね。"
16019-250-1 = "装備を一新し、\n軽量化と高速化を実現しました。"
16019-260-1 = "ですが……\n以前の重量感や火力が\n恋しくなることもあります。"
16019-270-1 = "なぜ人は、\n重ね合わせの状態に\nなれないのでしょう。"
16019-280-1 = "……とても残念です。"
16019-290-1 = "先日見かけた\n配信者のライブで、"
16019-300-1 = "無限弾倉と二丁拳銃について\nコメントを投稿したところ――"
16019-310-1 = "山海経高級中学校の玄龍門から\n「いいね」を押されました。"
16019-320-1 = "何故なのでしょうか……？"
16019-330-1 = "ふと、世界の終わりについて\n考えることがあります。"
16019-340-1 = "特に意味はありません。"
16019-350-1 = "ただ、もしもその日が訪れたら、\n何をするだろうか、と。"
16019-360-1 = "先生ならどうされますか？"
16019-370-1 = "私は……何をするか、\n決めています。"
16019-380-1 = "……でも、教えません。"
16019-390-1 = "秘密の一つや二つ、\nあったほうが良いと\n思いますから。"
16019-400-1 = "偵察において重要なことは\nいろいろありますが……。"
16019-410-1 = "敵を知り、\n己を知ってこそ、"
16019-420-1 = "作戦の成功は保証されます。"
16019-430-1 = "つまり私たちは、\n互いのことを深く\n理解しあう必要があるのです。"
16019-440-1 = "……意味が分からない？"
16019-450-1 = "私が分かっていますから、\n問題ありません。"
16019-460-1 = "知っています。"
16019-470-1 = "今日は、先生が初めて\nこの世の偵察に成功した、\n記念すべき日。"
16019-480-1 = "偵察記録が\n残っているようでしたら、\n私にもぜひ見せてください。"
16019-490-1 = "本日の主役として――"
16019-500-1 = "この日に相応しい\nプレゼントを要求します。"
16019-510-1 = "それは……。"
16019-520-1 = "愛とご褒美です。"
16019-530-1 = "新年、明けまして\nおめでとうございます。"
16019-540-1 = "私の人生の新たな1年が、\nここからスタートします。"
16019-550-1 = "それでは先生。"
16019-560-1 = "一緒に人生設計を\nしていきましょう。"
16019-570-1 = "先生が生徒に\nクリスマスプレゼントを\n贈る……。"
16019-580-1 = "ですので、\n私からもプレゼントを\nご用意しました。"
16019-590-1 = "はい。プレゼントは私です。"
16019-600-1 = "……冗談ではありませんよ。\nはい。"
16019-610-1 = "キャンディーやお菓子は、\n優れた戦闘糧食に\nなると聞きました。"
16019-620-1 = "つまり、ハロウィーンでは\n最も理にかなった食品と\n言えます。"
16019-630-1 = "ハロウィーンはその状況に\n該当するのか、ですか？"
16019-640-1 = "それは……。"
16019-650-1 = "私がそう思ったから、です。"
16019-670-1 = "綺麗な朝焼けですね。"
16019-680-1 = "ここでは毎日、\nこの景色が観測できます。"
16019-690-1 = "といっても、\nここに来てからの数日分しか\n記録はないので……。"
16019-700-1 = "毎日ではないのかも\nしれませんが。"
16019-710-1 = "はい。"
16019-720-1 = "でも、ここからだと全く\n違った色に感じられるんです。"
16019-730-1 = "空も……\n橙色に輝く大地も……。"
16019-740-1 = "私は、先生とこうして\n景色を共有する時間が\n好きです。"
16019-750-1 = "心が動いたものを\nこうして伝えられる\nこのひと時が……。"
16019-760-1 = "この一瞬は、\nいまこの時間しか\n存在しません。"
16019-770-1 = "そして、\n二度と戻ってこない。"
16019-780-1 = "先生。"
16019-790-1 = "もしも今、「最後」の時が\n訪れたら――"
16019-800-1 = "私は、先生のそばで\nその瞬間を共にする……。"
16019-810-1 = "「最後」の一人に\nなれますか？"
16019-2600-1 = "武器の変更には、思い切った決断が\n求められます。朝食のメニューを、\nトーストからパンケーキに変えるほどの\n一大事です。ですが、先生からいただいた\nものなら……話は変わってきます。"
