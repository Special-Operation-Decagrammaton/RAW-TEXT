[translation]
13014-10-1 = "ブルーアーカイブ！ははっ！"
13014-20-1 = "夏の青春活動っていえば、海しかないよな！\n皆、準備はいい？"
13014-30-1 = "先生は\nこういう部屋を\n作るんだなぁ……。"
13014-40-1 = "へぇ、こんなのも\nあるんだ。"
13014-50-1 = "キキョウのやつ……\n今度は何を\n企んでるんだか。"
13014-60-1 = "アタシらの調停室……\nここに引っ越せ\nないかな……。"
13014-70-1 = "やっぱ海って\n最高だよな！"
13014-80-1 = "師匠！お帰り！\n待ってたんだ！"
13014-90-1 = "ほら、海に行くよ！"
13014-100-1 = "海と青春がアタシたちを\n呼んでる。"
13014-110-1 = "仕事はさっさと\n終わらせちゃおう！"
13014-120-1 = "制服？\n思ったより暑かったから、\n脱いできたよ。"
13014-130-1 = "……み、水着と下着は\n違うんだけど！？"
13014-140-1 = "師匠はさ、\n制服の下に水着を\n着たことってある？"
13014-150-1 = "外で着替える手間が\nなくて楽なんだ。"
13014-160-1 = "……え？帰りの下着？"
13014-170-1 = "この水着、\n百花繚乱の皆と\n一緒に選んだんだ。"
13014-180-1 = "思ったより動きやすくて\nいい感じ。"
13014-190-1 = "先生はどんな水着が好き？"
13014-200-1 = "……あっ。いやっ違くて、\nじ、自分で着るなら、の話！"
13014-210-1 = "今年の夏も、みんなと\n楽しく過ごしたいな。"
13014-220-1 = "もちろん、師匠も\n一緒だよ、へへっ。"
13014-230-1 = "今日は師匠の誕生日……"
13014-240-1 = "ってことは青春活動に\nピッタリの日、だね！"
13014-250-1 = "ほらほら、\nボケっとしてないで！"
13014-260-1 = "忘れられない想い出を\n作らなきゃ！"
13014-270-1 = "……ふぇっ！？\nあ、アタシの誕生日、\n覚えてくれてたのか。"
13014-280-1 = "いや……あはは……\nすっごい嬉しい。"
13014-290-1 = "ありがとう……\n今日、一緒にいてくれて。"
13014-300-1 = "あけまして\nおめでとう、師匠！"
13014-310-1 = "え、寒くないのかって？"
13014-320-1 = "アタシは\n鍛えてるから……"
13014-330-1 = "っくしゅん！"
13014-340-1 = "メリークリスマス、師匠！"
13014-350-1 = "寒い時こそ\n修行のチャンス！"
13014-360-1 = "ほら！\n乾布摩擦しにいこう！"
13014-370-1 = "トリック・オア・トリート！\n水着でハロウィーン！"
13014-380-1 = "……どう？驚いた？"
13014-390-1 = "その……黙って\n見つめられると、\nちょっと……"
13014-400-1 = "こう見えても、勇気を\n出してるんだけど……。"
13014-420-1 = "青春って、あっという\n間なんだよな。"
13014-430-1 = "激しく燃え上がって、\nすぐに消えちゃう……"
13014-440-1 = "この炎みたいに。"
13014-450-1 = "アタシも、\nずっとそう思ってた。"
13014-460-1 = "……鍛錬だけで、青春が\n終わっちゃうんだろう\nなって。"
13014-470-1 = "でも、今は違う。"
13014-480-1 = "師匠と出会って\n変わったんだ。"
13014-490-1 = "毎日が楽しくて、\n充実してる。"
13014-500-1 = "もちろん、時間は\n戻らないけど……。"
13014-510-1 = "これからだって、\nまだまだ青春できる。"
13014-520-1 = "炎が消えそうなら、\n新しい薪をくべてやれば\nいいんだ。"
13014-530-1 = "だから師匠……"
13014-540-1 = "ずっと一緒に\n青春してくれる……\nよな？"
13014-2600-1 = "おっ、おぉ……！\n師匠との青春が形になってる！\nありがとう！\n一生の宝物にするよ！"
