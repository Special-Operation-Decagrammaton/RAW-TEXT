[translation]
13014-10-1 = "Blue... Archive! ฮ่าฮ่า!"
13014-20-1 = "กิจกรรมวัยรุ่นในฤดูร้อน ก็ต้องในทะเลสิ!\nทุกคนพร้อมไปสนุกหรือยัง?"
13014-30-1 = "โอ้ว ที่นี่คือ\nพื้นที่ที่คุณครู\nเตรียมไว้งั้นเหรอ..."
13014-40-1 = "เอ๋?\nมีอะไรแบบนี้ด้วยสินะ"
13014-50-1 = "ยัยคิเคียว\nซ่อนอะไร\nเอาไว้อีกล่ะนั่นน่ะ"
13014-60-1 = "ย้ายห้องไกล่เกลี่ย\nของเรามาไว้ที่นี่\nได้มั้ยนะ..."
13014-70-1 = "ทะเล\nมันสนุกจริงๆ ด้วย!"
13014-80-1 = "โอ๊ะ ท่านอาจารย์! เข้ามาสิ!\nฉันกำลังรออยู่เลย!"
13014-90-1 = "เราจะไปทะเลด้วยกัน!"
13014-100-1 = "อืม! ทะเลกับวัยรุ่น\nกำลังเรียกฉันอยู่"
13014-110-1 = "เสร็จงานแล้วไปทันทีเลยนะ!"
13014-120-1 = "ชุดนักเรียนเหรอ?\nมันร้อนกว่าที่คิด\nก็เลยไม่ได้ใส่มาน่ะ"
13014-130-1 = "ชะ... ชุดว่ายน้ำกับชุดชั้นใน\nมันไม่เหมือนกันนะ!"
13014-140-1 = "ท่านอาจารย์เคยใส่\nชุดว่ายน้ำในชุดนักเรียนมั้ย?"
13014-150-1 = "มันสะดวกเพราะไม่ต้อง\nมาเปลี่ยนชุดข้างนอกน่ะ"
13014-160-1 = "หืม...? ชุดชั้นในที่จะใส่\nตอนกลับน่ะเหรอ?"
13014-170-1 = "ชุดว่ายน้ำตัวนี้\nทุกคนในเฮียกกะเรียวรัน\nช่วยกันเลือกให้น่ะ"
13014-180-1 = "ใส่แล้วขยับตัว\nสะดวกกว่าที่คิด\nก็เลยถูกใจฉันดี"
13014-190-1 = "แล้วคุณครูชอบ\nชุดว่ายน้ำแบบไหนเหรอ?"
13014-200-1 = "อ่า... ไม่ใช่ชอบดูสิ\nหมายถึงชอบใส่แบบไหนน่ะ!"
13014-210-1 = "ฤดูร้อนนี้ก็หวังว่า\nจะได้สนุกสนาน\nกับทุกคนนะ"
13014-220-1 = "แล้วก็รวม\nท่านอาจารย์ด้วย\nฮิฮิ"
13014-230-1 = "วันนี้วันเกิดท่านอาจารย์"
13014-240-1 = "เป็นวันที่เหมาะกับการ\nทำกิจกรรมวัยรุ่นที่สุดเลย"
13014-250-1 = "เอาละๆ อย่ามัวเหม่ออยู่!"
13014-260-1 = "ไปสร้างความทรงจำ\nที่ลืมไม่ลงกันเถอะ!"
13014-270-1 = "หวา...!?\nอ๊ะ จำวันเกิดฉันได้สินะ"
13014-280-1 = "เปล่าหรอก... แหะๆๆ...\nฉันดีใจจริงๆ นะ"
13014-290-1 = "ขอบคุณนะ...\nที่วันนี้มาอยู่ด้วยกัน"
13014-300-1 = "สวัสดีปีใหม่นะ ท่านอาจารย์"
13014-310-1 = "อ้อ ฉันหนาวหรือเปล่าน่ะเหรอ?"
13014-320-1 = "ฉันกำลังฝึกฝนอยู่น่ะ..."
13014-330-1 = "ฮัดชิ้ว!"
13014-340-1 = "เมอร์รีคริสต์มาสนะ ท่านอาจารย์!"
13014-350-1 = "ถ้าเอาแต่ตัวงอเพราะความหนาว\nมันจะยิ่งไม่ดีนะ!"
13014-360-1 = "เอาละ! ไปปะทะน้ำเย็นกันเถอะ!"
13014-370-1 = "ทริกออร์ทรีต!\nใส่ชุดว่ายน้ำรับฮาโลวีน!"
13014-380-1 = "เป็นยังไงบ้าง...? ตกใจใช่มั้ยล่ะ?"
13014-390-1 = "เอ่อ...\nถ้าจ้องโดยไม่พูด\nอะไรเลยแบบนั้น..."
13014-400-1 = "เห็นอย่างนี้ฉันก็\nรวบรวมความกล้ามาเลยนะ..."
13014-420-1 = "วัยรุ่นเหมือนจะ\nผ่านไปเร็วเลยละ"
13014-430-1 = "ได้ลุกโชนอย่างรุนแรง\nแต่เดี๋ยวเดียวก็ดับลง..."
13014-440-1 = "เหมือนประกายไฟนี่เลย"
13014-450-1 = "ตอนแรกฉันก็\nคิดแบบนั้นนะ"
13014-460-1 = "คิดว่าถ้าเอาแต่ฝึกฝน\nไปเรื่อยๆ วัยรุ่นก็คงจบลง..."
13014-470-1 = "แต่ว่าตอนนี้ไม่ใช่อย่างนั้นแล้วละ"
13014-480-1 = "เพราะพอได้เจอท่านอาจารย์\nก็มีหลายอย่างที่เปลี่ยนไป"
13014-490-1 = "ฉันรู้สึกสนุก\nและจริงใจกับทุกวัน"
13014-500-1 = "แน่นอนว่ากาลเวลา\nไม่อาจย้อนคืนได้..."
13014-510-1 = "แต่ต่อไป\nฉันก็คิดว่าจะสนุก\nกับวัยรุ่นได้เต็มที่นะ"
13014-520-1 = "ถ้าประกายไฟใกล้จะดับ\nก็แค่เอาฟืนชิ้นใหม่\nมาเติมไฟก็พอ"
13014-530-1 = "เพราะงั้น ท่านอาจารย์..."
13014-540-1 = "จะช่วยเป็นวัยรุ่น\nไปด้วยกัน... ใช่มั้ย?"
13014-2600-1 = "โอ้ว สิ่งนี้ละที่แสดงถึง\nวัยรุ่นกับท่านอาจารย์!\nขอบคุณนะ! ฉันจะรักษาไว้ชั่วชีวิตเลย!"
