[translation]
13014-10-1 = "Blue Archive! Haha!"
13014-20-1 = "It's not summer youth activities if you're not at the sea! Are we ready to enjoy our hearts out?"
13014-30-1 = "Ooh, so this is the place you prepared..."
13014-40-1 = "Heh, so there are things like this too."
13014-50-1 = "That Kikyou... I wonder what she's hiding this time."
13014-60-1 = "Our regulatory office... I wonder if we could move it here..."
13014-70-1 = "The beach is always a fun place!"
13014-80-1 = "Oh, Mentor! Welcome! I was waiting for you!"
13014-90-1 = "Let's go to the beach together!"
13014-100-1 = "Mmm! The beach and my youth call for me!"
13014-110-1 = "Once you're done working, we move out!"
13014-120-1 = "My uniform? I took it off because it was way too hot."
13014-130-1 = "A-A swimsuit is completely different from underwear!"
13014-140-1 = "Mentor, have you ever tried wearing a swimsuit under your uniform?"
13014-150-1 = "That way, you don't have to change when you're outside! It's super convenient!"
13014-160-1 = "...Huh? Underwear for when I go back?"
13014-170-1 = "I picked this swimsuit with the other Hyakkaryouran members."
13014-180-1 = "I wasn't expecting it to be so easy to move around in!"
13014-190-1 = "What kind of swimsuit do you like, Sensei?"
13014-200-1 = "Ah... I mean what kind would you like to wear, not look at!"
13014-210-1 = "I hope everyone else has a good summer too!"
13014-220-1 = "Including you, Mentor. Heh."
13014-230-1 = "Today's your birthday, mentor!"
13014-240-1 = "The perfect day for some youth activities!"
13014-250-1 = "Now, now, don't just stand there."
13014-260-1 = "Let's go make some unforgettable memories!"
13014-270-1 = "...Whoa?! You remembered my birthday."
13014-280-1 = "I mean... Ahaha... I'm really happy."
13014-290-1 = "Thank you...for spending the day with me."
13014-300-1 = "Happy New Year, Mentor!"
13014-310-1 = "Huh? ...Am I not cold?"
13014-320-1 = "I'm training, so..."
13014-330-1 = "Achoo!"
13014-340-1 = "Merry Christmas, Mentor!"
13014-350-1 = "Having to bundle up for the cold is the worst!"
13014-360-1 = "Now! Let's go take a cold shower!"
13014-370-1 = "Trick or treat! Halloween: swimsuit version!"
13014-380-1 = "...How was it? I caught you by surprise, right?"
13014-390-1 = "Um... If you just stare wordlessly at me like that, it's a bit..."
13014-400-1 = "This took a lot of courage, you know..."
13014-420-1 = "My youth sure is flying by."
13014-430-1 = "Just like this flame."
13014-440-1 = "It burns so fiercely, then sputters out in a flash..."
13014-450-1 = "That's how I used to feel."
13014-460-1 = "...Like my youth would sputter out with endless training."
13014-470-1 = "But I don't feel that way anymore."
13014-480-1 = "So much has changed since I met you, Mentor."
13014-490-1 = "Every day feels fun and fulfilling."
13014-500-1 = "I know I can't turn back time..."
13014-510-1 = "But I think that I can still enjoy what's left of my youth."
13014-520-1 = "We can always add more firewood to a dying flame."
13014-530-1 = "So, Mentor..."
13014-540-1 = "Will you keep doing youth activities...with me?"
13014-2600-1 = "Ooh, so this is experiencing youth with my mentor! Thank you! I'll treasure it for life!"
