[translation]
10036-10-1 = "B-Blue Archive!"
10036-20-1 = "I-I'm Wakaba Hinata. Nice to meet you."
10036-30-1 = "I-I can't sit still for some reason."
10036-40-1 = "There are so many different things here..."
10036-50-1 = "I-It's probably not a bad idea to rest somewhere like this every once in a while, right?"
10036-60-1 = "Hmm... I'm tired."
10036-70-1 = "Is it really okay for me to relax like this?"
10036-80-1 = "Y-You're here, Sensei! Peace be with you today!"
10036-90-1 = "Oh, you're here, Sensei! Just in time! I'm done organizing."
10036-100-1 = "T-Truth is...I love being able to help others!"
10036-110-1 = "I-I just wonder...if I'm helpful to you in any way."
10036-120-1 = "Even though I'm supposed to be a manager..."
10036-130-1 = "...I'm always making mistakes... Is that really okay?"
10036-140-1 = "J-Just tell me what to do! I'll do my best no matter what!"
10036-150-1 = "I heard there are a lot of rumors going around about me. I wonder what they're about."
10036-160-1 = "No one in the Sisterhood will tell me..."
10036-170-1 = "If you need to move stuff or tidy things up, please leave it to me."
10036-180-1 = "I'm a manager, after all!"
10036-190-1 = "Happy birthday, Sensei!"
10036-200-1 = "Your birthday is a very special day for me too!"
10036-210-1 = "S-Sensei... So, um, today..."
10036-220-1 = "T-Today is my birthday! S-So would you..."
10036-230-1 = "...mind spending it with me?"
10036-240-1 = "A new year..."
10036-250-1 = "This year, I want to show you an even better version of myself, Sensei."
10036-260-1 = "It's Christmas Day!"
10036-270-1 = "I may be lacking, but I'm still part of the Sisterhood, so..."
10036-280-1 = "...I'll pray for you, Sensei."
10036-290-1 = "Oh, is today Halloween?"
10036-300-1 = "Th-That's why people are wearing those outfits..."
10036-310-1 = "Oh. I just want to make it clear. This is no costume. It's my normal attire!"
10036-330-1 = "U-Um, I'm so sorry...Sensei."
10036-340-1 = "I never wanted to be a burden to you."
10036-350-1 = "I can push through this...or so I thought."
10036-360-1 = "I'm useless if I'm not healthy. It's so embarrassing..."
10036-370-1 = "But you're right. I should be resting."
10036-380-1 = "So, if...it's not too much to ask, would you mind staying with me for a bit?"
10036-390-1 = "I'd feel a lot better with you here..."
10036-400-1 = "You will? Thank you."
10036-410-1 = "You're so sweet, Sensei."
10036-2600-1 = "I didn't expect to get so much attention. But...I'm glad! I'll try to live up to everyone's expectations!"
