[translation]
9009004-10-1 = "その、ぜひこちらを先生に、\n解決していただければと……。"
9009004-20-1 = "こちらの件、お願いしても\nよろしいでしょうか？"
9009004-30-1 = "もっと先生みたいに、\nお仕事ができるように\nなりたいです……"
9009004-40-1 = "はぁ……\n私で大丈夫なのでしょうか……？"
9009004-50-1 = "も、もしかして何か、\n情報の不備など\nありましたか……？"
9009004-60-1 = "私には、荷が重いような\n気がします……"
9009004-70-1 = "リン先輩はすごいです。\n私と違って弱気になることなく、\nいつもテキパキとされて……"
9009004-80-1 = "す、すごい……\nもう解決されたんですか？"
9009004-90-1 = "さ、流石ですね……！\nこんなにあっさりと……"
9009004-100-1 = "も、もう終わったのですか！？\nす、すごいです……！"
9009004-110-1 = "あ、あっさりと終えられ\nましたね……！？\nさ、さすがです。"
9009004-120-1 = "今日のお仕事は\nこれでお終いですね、\nお疲れ様でした！"
9009004-130-1 = "これで急ぎの案件は\n一区切りですね、\nありがとうございます！"
9009004-140-1 = "また明日、\nよろしくお願いいたします……！"
