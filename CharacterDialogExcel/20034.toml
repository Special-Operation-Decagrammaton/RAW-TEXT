[translation]
20034-10-1 = "ブルーアーカイブ、フフッ。"
20034-20-1 = "年の暮れ……そして新年。\n言葉の響きに胸が躍りますね。\nそこに美味しいお料理があれば、言うことなしです★"
20034-30-1 = "今日の日替わり\nメニューは\nなんでしょう～？"
20034-40-1 = "特別な料理を食べて、\n素晴らしい時間を過ごす…\nなんて素敵なんでしょう★"
20034-50-1 = "口コミの力は\n凄まじいです。読んで\nいるだけでお腹が空いて\nきちゃいますから。"
20034-60-1 = "評価の点数より、\nレビュー数のほうが\n大事ですよ？"
20034-70-1 = "私だって、いつも\n食べ物のことばかり\n考えてるわけじゃ、\nないですよ～？"
20034-80-1 = "あら★いらしたんですね、先生。"
20034-90-1 = "それでは、\n今から食べたい\n物をお伝えします～"
20034-100-1 = "おかえりなさい、先生★"
20034-110-1 = "ずーっと、先生のこと\n待ってました。"
20034-120-1 = "いつから、ですか？"
20034-130-1 = "それは秘密です★"
20034-140-1 = "どうでしょう～？私の着物姿。"
20034-150-1 = "可愛いって言いたくなったり……\nしませんか～？"
20034-160-1 = "今なら！私とのデートが！\nなんと0円！お買い得ですよ～！"
20034-170-1 = "……あ、サボろうとしてるんじゃ\nないかって疑ってますね？"
20034-180-1 = "私をなんだと思ってるんですか？\n……正解です★"
20034-190-1 = "フフッ、先生のそばにいると、\nついはしゃいでしまいます。\nどうしてでしょうね～？"
20034-200-1 = "私、先生に期待しても、\nいいですか～？"
20034-210-1 = "……あらま、二つ返事だなんて。"
20034-220-1 = "とんでもないことを、期待しちゃ\nうかもしれないのに…？フフッ★"
20034-230-1 = "え？何をしてるの、って？"
20034-240-1 = "ご覧の通り、先生に\n寄りかかってるんですよ～？"
20034-250-1 = "フフッ、嫌です、離れません、\nこのままがいいです★"
20034-260-1 = "誕生日ですね、先生！\n自分のことのように嬉しいです！"
20034-270-1 = "あら？違いますよ、\n決してバースデーケーキが\n楽しみだからでは……"
20034-280-1 = "……あります★"
20034-290-1 = "誕生日お祝い、ありがとう\nございます、先生。"
20034-300-1 = "では祝ってくださったついでに～\nホールケーキをもう3個、\nいただいてもいいですか～？"
20034-310-1 = "新年明けまして\nおめでとうございます～★"
20034-320-1 = "さあ、お節を食べに\n行きましょう！"
20034-330-1 = "運転は私がしますから。\n先生、急いでください！"
20034-340-1 = "クリスマス……\n大晦日……年明け……"
20034-350-1 = "フフッ、私の大好きな\nシーズンです。"
20034-360-1 = "だって、美味しいものが\nいっぱいなんですもの！"
20034-370-1 = "お菓子をもらったら、\nイタズラしちゃ\nいけないんですか？"
20034-380-1 = "……別にそんな決まりはない？"
20034-390-1 = "今の話……\n本気にしちゃいますよ……？"
20034-400-1 = "ふふふ……★"
20034-420-1 = "ふぅ……思ったより、\n力が要りますね。"
20034-430-1 = "大丈夫ですよ、先生。\nまだいけます。"
20034-440-1 = "気遣ってくださって\n嬉しいです……でもやっぱり、\n楽しみで仕方がないんです。"
20034-450-1 = "どんなお餅ができるのか。"
20034-460-1 = "それでどんな\n料理が作れるのか……"
20034-470-1 = "……それを、先生と\n一緒に食べられると思うと……"
20034-480-1 = "……ねえ、先生。"
20034-490-1 = "お餅ができたら、\n一番に食べてほしいです。\nいいですよね？"
20034-2600-1 = "わあ～！ありがとうございます★\nこれでぜ～んぶ、吹き飛ばせちゃいます！\nフフッ……大丈夫ですよ、先生。\nちゃんと手加減しますから★"
