[translation]
10139-10 = "蔚藍檔案。"
10139-20 = "我是SRT特殊學園，FOX小隊的吉野仁子。\n雖然仍有許多不成熟之處，還請您多多指教。"
10139-30 = "（是炸豆皮的……\n味道真香……）"
10139-40 = "方便的話，\n要不要嚐嚐剛做好的\n豆皮壽司呢？"
10139-50 = "今天是適合\n洗衣服的好天氣呢。\n毛毯應該很快就能曬乾。"
10139-60 = "最近很流行\n這種東西嗎……？"
10139-70 = "這種度過假日的方式，\n好像也不錯……"
10139-80 = "您找我嗎？"
10139-90 = "如果有什麼事，\n請別客氣儘管說哦。"
10139-100 = "歡迎回來，老師。\n作戰準備已經完成了。"
10139-110 = "哎呀，老師……\n今天是想撒嬌的日子呢？"
10139-120 = "……可以哦，\n請到這邊來。"
10139-130 = "是的，\n仁子就在這裡哦。"
10139-140 = "為了做便當，\n作戰當天\n我會稍微早起一點。"
10139-150 = "畢竟人們常說\n餓著肚子\n什麼都做不好嘛。"
10139-160 = "便當……"
10139-170 = "從下次開始，\n要不要也幫老師\n準備一份呢？"
10139-180 = "為了洗刷污名也好……"
10139-190 = "從今以後，\n我想成為老師的助力。"
10139-200 = "祝您生日快樂，老師！"
10139-210 = "我滿懷真心，\n做了紅豆飯豆皮壽司過來！"
10139-220 = "請您享用！"
10139-230 = "謝謝您為我慶生……\n真的很感謝您，老師。"
10139-240 = "每年，小隊的大家\n都會幫我慶祝。\n那場面還挺熱鬧的哦？"
10139-250 = "不過今年又多了一個人，\n願意幫我慶生呢。"
10139-260 = "祝您新年快樂，老師。"
10139-270 = "您已經去參拜過了嗎？"
10139-280 = "我為大家的健康\n獻上了祈福。"
10139-290 = "當然不只小隊的大家，\n也有為老師祈福哦。"
10139-300 = "SRT特殊學園的聖誕節，\n一直都是由FOX小隊\n擔任聖誕老人的角色。"
10139-310 = "不過，\n每次都會在途中\n變成像模擬戰一樣……"
10139-320 = "等回過神來，\n大家都已經\n精疲力盡地睡著了。\n呵呵。"
10139-330 = "我好恨哦～"
10139-340 = "呵呵，嚇到了嗎？\n原來老師也有\n害怕的東西呢。\n真是學到了一課。"
10139-350 = "咦？最可怕的是\n兔女郎的打扮……？"
10139-360 = "那是，那個……\n「饅頭好可怕」\n之類的嗎……？"
10139-380 = "呵呵，炸得很漂亮呢。"
10139-390 = "圓圓鼓鼓的……\n真期待成品。"
10139-400 = "啊，現在還不行哦。"
10139-410 = "因為等一下\n還要再炸一次呢。"
10139-420 = "先用低溫炸過。\n接著再用高溫油炸……"
10139-430 = "水分就會散去\n變成美味的炸豆皮。"
10139-440 = "炸豆皮其實是一道\n非常費時又費工的\n料理哦。"
10139-450 = "因此據說在以前，\n還是祈求一年豐收\n與安寧的供品呢。"
10139-460 = "我的願望是，\n希望身邊的大家都能幸福，\n平平安安地度過每一天。"
10139-470 = "如果我傾注在炸豆皮裡的\n心意能傳達出去的話……\n那就太好了。"
10139-2600 = "FOX-870式霰彈槍，\n我確實收到了。\n近距離支援就請交給我吧。"
