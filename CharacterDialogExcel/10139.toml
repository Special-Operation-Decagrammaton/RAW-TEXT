[translation]
10139-10 = "Blue Archive."
10139-20 = "Yoshino Niko from SRT Academy's FOX Squad. I still have a lot to learn, but I'm looking forward to working with you."
10139-30 = "(Fried tofu slices... Smells delicious...)"
10139-40 = "If you don't mind, would you try a piece of the inarizushi I just made?"
10139-50 = "Today is a good day for laundry. The blankets will dry quickly."
10139-60 = "...Are these things trending nowadays?"
10139-70 = "Spending a day off like this...might not be half bad."
10139-80 = "Did you call me?"
10139-90 = "If there's anything you're curious about, please feel free to ask."
10139-100 = "Welcome, Sensei. I have already completed the mission preparations."
10139-110 = "Oh dear, are you in the mood to be pampered today?"
10139-120 = "It's fine. Please come here."
10139-130 = "Yes, it's Niko."
10139-140 = "I try to wake up a little earlier on mission days to pack lunch for everyone."
10139-150 = "You can't get anything done on an empty stomach, after all."
10139-160 = "A bento..."
10139-170 = "Should I prepare one for you too next time?"
10139-180 = "To atone for our mistakes..."
10139-190 = "I hope I can be your strength from here on out."
10139-200 = "Happy birthday, Sensei!"
10139-210 = "To celebrate your birthday, I made some inarizushi with red bean rice."
10139-220 = "Please enjoy!"
10139-230 = "My birthday... Thank you for your birthday wishes, Sensei."
10139-240 = "My squad members have always made my birthday lively and festive."
10139-250 = "And now I have you too."
10139-260 = "Happy New Year, Sensei."
10139-270 = "What was your new year's wish?"
10139-280 = "I wished for everyone's health."
10139-290 = "Not only for my squad members...but also for you, Sensei."
10139-300 = "Back at SRT, the FOX members would take turns playing Santa, but..."
10139-310 = "Somehow, it always turned into a siege battle halfway through."
10139-320 = "Now my memories are just full of everyone falling asleep exhausted. Fufu."
10139-330 = "How resentful!"
10139-340 = "Fufu, did I scare you? So even you can be taken off guard by some things. Looks like I've learned something new today."
10139-350 = "...What? What you're most afraid of is someone dressed in a bunny girl outfit...?"
10139-360 = "What the... Are you trying to say you're scared of manju?"
10139-380 = "Fufu. Cooked to perfection."
10139-390 = "The perfect puff. For the perfect slice of fried tofu!"
10139-400 = "Ah, it's not ready yet."
10139-410 = "I'll need to fry it again a little more later."
10139-420 = "It needs to be fried at a lower temperature, and then again at a higher one."
10139-430 = "That'll ensure all the moisture is removed, creating the perfect deep-fried tofu!"
10139-440 = "Yes. Deep-fried tofu slices take a lot of time and effort."
10139-450 = "That's why they were offered when praying for good health and a rich harvest."
10139-460 = "All I wish for is the happiness and well-being of those around me."
10139-470 = "And if that feeling, packed into this dish, reaches them... I'd be very happy."
10139-2600 = "Confirming receipt of the FOX 870-Shotgun. You can count on me for support in the thick of combat."
