[translation]
10139-10-1 = "Blue Archive"
10139-20-1 = "โยชิโนะ นิโกะแห่งกองทหาร FOX\nจากสถาบันพิเศษ SRT ค่ะ ถึงจะยังอ่อนประสบการณ์\nแต่ต่อไปก็ฝากเนื้อฝากตัวด้วยนะคะ"
10139-30-1 = "(กลิ่นหอม...\nของเต้าหู้...)"
10139-40-1 = "ถ้าไม่ว่าอะไร ลองทาน\nซูชิเต้าหู้หวานที่เพิ่งทำ\nเสร็จใหม่ๆ สักชิ้นมั้ยคะ?"
10139-50-1 = "วันนี้เหมาะกับ\nการซักผ้าเลยนะ\nผ้าปูรองนอนต้องแห้งดีแน่ๆ"
10139-60-1 = "ช่วงนี้ฮิตอะไรแบบนี้\nกันงั้นเหรอ...?"
10139-70-1 = "ได้ใช้เวลาใน\nวันหยุดแบบนี้ก็...\nอาจจะไม่แย่เท่าไรนะ"
10139-80-1 = "เรียกฉันเหรอคะ?"
10139-90-1 = "ถ้ามีเรื่องอะไรให้ฉันช่วย\nก็บอกได้ ไม่ต้องเกรงใจนะคะ"
10139-100-1 = "เชิญค่ะ คุณครู\nถ้าเป็นการเตรียมปฏิบัติการละก็\nฉันทำเสร็จเรียบร้อยแล้วค่ะ!"
10139-110-1 = "ตายจริง วันนี้รู้สึกอยาก\nทำตัวเหมือนเด็กขึ้นมาเหรอคะ?"
10139-120-1 = "ไม่เป็นไรค่ะ มานี่สิคะ"
10139-130-1 = "ค่ะ ฉันก็นิโกะไงคะ?"
10139-140-1 = "วันที่มีปฏิบัติการ\nฉันจะตื่นเช้ากว่าปกติเล็กน้อย\nมาเตรียมข้าวกล่องน่ะค่ะ"
10139-150-1 = "ถ้าท้องหิว ไม่ว่างานอะไร\nเราก็จะทำได้ไม่เต็มที่นี่คะ"
10139-160-1 = "ข้าวกล่อง..."
10139-170-1 = "ไว้คราวหน้า ให้ฉันเตรียม\nของคุณครูให้ด้วยมั้ยคะ?"
10139-180-1 = "อย่างน้อยก็เพื่อ\nล้างมลทินของพวกฉัน..."
10139-190-1 = "ต่อไปฉันอยากเป็นคนที่\nเป็นกำลังใจให้คุณครูค่ะ"
10139-200-1 = "สุขสันต์วันเกิดค่ะ คุณครู!"
10139-210-1 = "ฉันทำซูชิเต้าหู้หวานไส้ถั่วแดง\nมาให้ในวันเกิดค่ะ"
10139-220-1 = "ทานให้อร่อยนะคะ!"
10139-230-1 = "วันเกิด...\nขอบคุณที่ช่วยอวยพรให้นะคะ\nคุณครู"
10139-240-1 = "ทุกปีในวันเกิดของฉัน\nสมาชิกในกองจะช่วยจัดวันเกิดให้\nก็เลยคึกคักกันตลอดเลย..."
10139-250-1 = "แต่ปีนี้มีมาเพิ่ม\nคนหนึ่งนะคะเนี่ย"
10139-260-1 = "สวัสดีปีใหม่นะคะ คุณครู"
10139-270-1 = "ขอพรอะไรในวันปีใหม่ไปคะ?"
10139-280-1 = "ส่วนฉันขอให้ทุกคน\nมีสุขภาพแข็งแรงค่ะ"
10139-290-1 = "ทั้งสมาชิกทุกคนในกองทหาร...\nแล้วก็คุณครูด้วยค่ะ"
10139-300-1 = "ที่สถาบัน SRT\nกองทหาร FOX จะผลัดกัน\nรับบทเป็นซานตาคลอสทุกปี..."
10139-310-1 = "แต่ยังไม่จบวันดี ก็ยุ่งจน\nเป็นสงครามจำลองไปทุกปี..."
10139-320-1 = "ทุกคนเลยได้แต่หลับไป\nเพราะความเหนื่อยล้าน่ะค่ะ ฮุฮุ"
10139-330-1 = "คิดแล้วยังเคืองไม่หายเลย~"
10139-340-1 = "ฮุฮุ ตกใจเลยเหรอคะ?\nแม้แต่คุณครูก็ยังมี\nสิ่งที่กลัวสินะคะ\nเป็นเรื่องใหม่ที่ได้เรียนรู้เลยค่ะ"
10139-350-1 = "คะ...? สิ่งที่น่ากลัวที่สุด\nก็คือชุดบันนี่เกิร์ลงั้นเหรอคะ...?"
10139-360-1 = "หมายความว่า... คุณครู\nกลัวมันจูเหรอคะ?"
10139-380-1 = "ฮุฮุ สุกกำลังดีเลยนะคะ"
10139-390-1 = "อันที่อ้วนพองขึ้นมา\nน่าจะเป็นเต้าหู้ทอดที่ดีเลยค่ะ"
10139-400-1 = "อ๊ะ ยังไม่ได้ค่ะ"
10139-410-1 = "ยังต้องเอาไปทอด\nอีกครั้งหนึ่งค่ะ"
10139-420-1 = "ตอนแรกต้องใช้ไฟต่ำ\nแล้วค่อยมาทอดใน\nไฟสูงอีกครั้ง"
10139-430-1 = "ความชื้นจะได้หายไปหมด\nจนเป็นเต้าหู้ทอดที่อร่อยค่ะ"
10139-440-1 = "ค่ะ เต้าหู้ทอดเป็นอาหารที่ต้องใช้\nเวลาและความพยายามมากค่ะ"
10139-450-1 = "ได้ยินว่าสมัยก่อนก็เลยทำเต้าหู้ทอด\nเพื่ออธิษฐานขอความอุดมสมบูรณ์\nและความสุขสวัสดีกันค่ะ"
10139-460-1 = "ถึงฉันจะหวังเพียงความสุข\nและความสงบของผู้คนรอบตัวก็ตาม"
10139-470-1 = "ถ้าความรู้สึกของฉัน\nส่งผ่านทางเต้าหู้ทอดนี้ได้...\nก็คงน่าดีใจนะคะ"
10139-2600-1 = "ได้รับปืนลูกซอง FOX\nรุ่น 870 มาแล้วค่ะ\nถ้าอยากให้ช่วยเหลือระยะประชิด\nก็วางใจฉันได้เลยค่ะ"
