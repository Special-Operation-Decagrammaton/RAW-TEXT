[translation]
20046-10-1 = "にゃはっ？ブルーアーカイブ～"
20046-20-1 = "さぁ～さぁ～皆の衆！刮目してご覧あれ♪百鬼夜行連合学院、陰陽部部長、天地ニヤのおなーりー！\n……なんちゃって。にゃははっ！"
20046-30-1 = "にゃは～\n……ちょっと一息。\nんふ、\nサボってないですよぉ？"
20046-40-1 = "先生には\nこのような趣味が……\nふむふむ。"
20046-50-1 = "惚れ惚れする\n光景ですねぇ♪\nにゃははっ！"
20046-60-1 = "カホは心配性だなぁ♪\nちゃ～んと頑張って\n働いてるのに……。\nま、嘘なんですが♪\nにゃははっ！"
20046-70-1 = "これはカホが……\nあっちはチセちゃんが\n喜びそうですねぇ……。"
20046-80-1 = "おやおや、随分と\nのんびり屋さんなんですねぇ？\n私を待たせる人なんて、\n先生くらいなものです♪"
20046-90-1 = "んふふ、なんだか新鮮な\n気持ちですよぉ？"
20046-100-1 = "にゃはっ！\nおかえりなさいませ、\nなんちゃって♪"
20046-110-1 = "あら、\nいらっしゃったんですね先生。"
20046-120-1 = "さてさて、\n挨拶はこの辺にして…"
20046-130-1 = "お茶にでもしましょうか♪"
20046-140-1 = "…ダメですかぁ？ちょ～っと、\n早かったかもですね、\nにゃははっ！"
20046-150-1 = "にゃ～働きたくないですよぉ～"
20046-160-1 = "どうしてシャーレまで\nきて仕事しないと\nいけないんですかぁ～"
20046-170-1 = "陰陽部でもしてないのに……\nえ～？した方がいいですかぁ？"
20046-180-1 = "まぁ、ですよねぇ～"
20046-190-1 = "にゃはっ、さすが先生♪"
20046-200-1 = "んふ、先生が\nこちら側の人間だって、\n知ってるんですよぉ？"
20046-210-1 = "またまた〜、\nとぼけても無駄ですよぉ？"
20046-220-1 = "ほら、\n一緒にゴロゴロしましょ♪"
20046-230-1 = "はいはい、\nちゃんと頑張ってますよっと。"
20046-240-1 = "ほ、ほんとですよ！"
20046-250-1 = "ん〜、\nいいお散歩日和ですねぇ。"
20046-260-1 = "こんな日はお外を\n楽しみませんか～？"
20046-270-1 = "んふふっ……\n良いアイデアが浮かびました。"
20046-280-1 = "んん～？気になります？"
20046-290-1 = "聞いちゃったら\nつまらないですよぉ？\nにゃはっ♪"
20046-300-1 = "ふむ。今日は先生が\n生まれた日――ですよね♪"
20046-310-1 = "お誕生日おめでとう\nございますぅ。"
20046-320-1 = "こうして直接お祝いを\n伝えられるなんて……\n良い日ですねぇ？"
20046-330-1 = "んん～？\nそんなに警戒しなくても\nいいじゃないですかぁ……"
20046-340-1 = "純粋に\nお祝いしてるだけなのに……"
20046-350-1 = "悲しいなぁ。ぐすんぐすん。"
20046-360-1 = "んふふっ♪"
20046-370-1 = "さてさて、\n今日は何の日でしょう～？"
20046-380-1 = "……どうやら、\n言うまでもないようですねぇ。"
20046-390-1 = "先生と私の仲ですから。\nこれ以上の詮索は\n無粋というもの。"
20046-400-1 = "んふふ、準備してますよね？\n誕生日プレゼント！"
20046-410-1 = "謹んで――新年の\nお祝いを申し上げます。"
20046-420-1 = "本年もどうぞよろしく\nお願い致します……にゃはっ♪"
20046-430-1 = "私だってこういう\n時ぐらいはちゃんと\n弁えてるんですよぉ？"
20046-440-1 = "にゃは～今日は楽しい～\nメリークリスマス～"
20046-450-1 = "可愛い後輩にプレゼントを\n買って帰ろう～っと♪"
20046-460-1 = "…え？私にプレゼントですか？"
20046-470-1 = "…あ、ありがとうございます。"
20046-480-1 = "にゃはは～百鬼夜行の\n外にはこんな面白い\n文化があるんですねぇ♪"
20046-490-1 = "ん～？お菓子が\nなければ悪戯する……？"
20046-500-1 = "んん～？立場、\n逆になってません～？"
20046-510-1 = "というかお菓子なんて\n持っておりませんが……。"
20046-520-1 = "な、何をする気ですか、\n先生！？"
20046-540-1 = "にゃ、にゃはは……\nもしも～し、先生～？"
20046-550-1 = "あらあら、怖い顔……。\n先生には似合いませんよぉ？"
20046-560-1 = "もしかして……\n本当に怒ってます？"
20046-570-1 = "いや、まぁ……\n分かっていますけど……\nにゃは……。"
20046-580-1 = "ええと……はい……\n申し訳ありません。"
20046-590-1 = "でもほら、\nなんといいますかぁ〜\nこちらにも事情という\nものがありましてねぇ～？"
20046-600-1 = "にゃはっ！？いえいえ！"
20046-610-1 = "滅相もない！\n反省していますとも！ええ！"
20046-620-1 = "ええ……心から\n反省しておりますので……"
20046-630-1 = "どうか、\n許してもらえませんか？"
20046-2600-1 = "……お気持ちはありがたいのですが。\nいやはや、私に何を求めていらっしゃるのやら。んふふ……ですが、先生のご期待を\n裏切るわけにもいきませんし？\n困ってしまいますねぇ……本当に♪"
