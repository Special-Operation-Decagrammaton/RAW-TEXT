[translation]
10143-10-1 = "Blue... Archive"
10143-20-1 = "Blue Archive! แหะๆๆ"
10143-30-1 = "วอร์มอัปมาแล้วหรือยังคะ?\nถ้าไม่ทำให้เรียบร้อย จะถูกฉันดุนะคะ"
10143-40-1 = "ว้าว เป็นสถานที่\nที่ยอดเยี่ยมจังเลยค่ะ"
10143-50-1 = "ไม่ทราบว่าชานั่น...\nดีต่อผิวพรรณหรือเปล่าคะ?"
10143-60-1 = "(ใส่ชุดว่ายน้ำ\nในสถานที่แบบนี้\nจะไม่เป็นไรเหรอคะ...?)"
10143-70-1 = "อึก...\nไหล่กลับมาตึงอีกแล้วค่ะ..."
10143-80-1 = "ที่นี่เย็นสบายมาก\nจนไม่อยากออกไปเลยค่ะ..."
10143-90-1 = "เชิญค่ะ คุณครู\nจะเล่นน้ำก่อน?\nหรือจะทานข้าวก่อนดีคะ? "
10143-100-1 = "หรือถ้าไม่อย่างนั้น..."
10143-110-1 = "แค่บอกฉันมาก็พอค่ะ"
10143-120-1 = "สวัสดีค่ะ คุณครู!"
10143-130-1 = "ชุนหลิง\nอยากเล่นซนกับคุณครูค่ะ!"
10143-140-1 = "สวัสดีค่ะ คุณครู"
10143-150-1 = "ฮุฮุ ค่ะ\nวันนี้ฉันมาในชุดว่ายน้ำค่ะ"
10143-160-1 = "ค่ะ! ฉันชุนหลิงเองค่ะ!\nฉันเปลี่ยนเป็นชุดว่ายน้ำ\nมาแล้วค่ะ!"
10143-170-1 = "เป็นยังไงบ้างคะ คุณครู?\nน่ารักมั้ยคะ?"
10143-180-1 = "ถ้าอากาศร้อนมากๆ\nมันก็ลำบากนี่คะ"
10143-190-1 = "กำลังคิดเรื่อง...\nวันหยุดฤดูร้อนอยู่เหรอคะ?"
10143-200-1 = "ถ้าคุณครูไม่ว่าอะไรละก็...\nฉันอยากให้แอบบอกฉัน\nสักนิดจัง..."
10143-210-1 = "ก็ตอนนี้ฉันไม่ได้เป็น\nผู้ฝึกสอนนี่คะ!"
10143-220-1 = "เพราะงั้น...\nฉันจะทำสิ่งที่ปกติไม่เคยได้ทำ\nให้สนุกเต็มที่เลยค่ะ!"
10143-230-1 = "พอมาคิดดูอีกครั้ง\nตอนนี้ฉันไม่ได้อยู่\nในฐานะผู้ฝึกสอนสินะคะ"
10143-240-1 = "แถมยัง...\nอยู่ในชุดว่ายน้ำด้วยค่ะ"
10143-250-1 = "คะ? หมายความว่ายังไงน่ะเหรอคะ?\nคือว่า เรื่องนั้น..."
10143-260-1 = "ในตอนนี้ "
10143-270-1 = "ฉันกำลังคิดว่าเรา\nอาจมีความสัมพันธ์ที่\nใกล้ชิดกันมากกว่าปกติ"
10143-280-1 = "น่ะค่ะ...?"
10143-290-1 = "ได้ยินมาว่า เมื่อเติบโตขึ้น\nเราจะรู้สึกว่าเวลาผ่านไปเร็วขึ้นค่ะ"
10143-300-1 = "เพราะตอนยังเด็ก ทุกอย่าง\nล้วนเป็นประสบการณ์ใหม่..."
10143-305-1 = "ก็เลยรู้สึกเหมือนเวลา\nผ่านไปอย่างเชื่องช้าค่ะ"
10143-310-1 = "แม้ตอนนี้ร่างกายของฉัน...\nจะเป็นเด็กเล็ก\nแต่ฉันก็รู้เรื่องต่างๆ มากมาย..."
10143-320-1 = "บางทีฉันอาจรู้สึกว่า\nเวลาผ่านไปเร็วกว่าพวกเด็กๆ\nวัยเดียวกันก็ได้นะคะ"
10143-330-1 = "ช่วงเวลาดีๆ มักจะ\nผ่านไปในพริบตาเลยนะคะ"
10143-340-1 = "เพราะงั้นเราถึงต้อง\nให้ความสำคัญกับทุกช่วงเวลาค่ะ"
10143-350-1 = "และนั่นก็หมายความว่า\nช่วงเวลาที่สำคัญสำหรับฉัน..."
10143-360-1 = "ก็คือตอนนี้ค่ะ"
10143-370-1 = "คุณครูคะ คุณครู!"
10143-380-1 = "มีที่ที่คุณครูอยากไป\nกับชุนหลิงในชุดว่ายน้ำมั้ยคะ?"
10143-390-1 = "ถ้าได้ไปกับคุณครู\nไม่ว่าที่ไหนฉันก็ชอบค่ะ!"
10143-400-1 = "ไม่รู้ทำไม\nฉันถึงคิดแบบนั้นขึ้นมาค่ะ"
10143-410-1 = "ถ้าเป็นที่ที่ฉันสามารถ\nใส่ชุดว่ายน้ำไปกับคุณครูได้\nไม่ว่าที่ไหนฉันก็อยากไปค่ะ"
10143-420-1 = "ไม่ว่าจะเป็นสระว่ายน้ำ หุบเขา\nหรือทะเล..."
10143-430-1 = "แล้วคุณครูคิดว่ายังไงคะ?"
10143-440-1 = "ฉันชอบเล่นน้ำค่ะ!"
10143-450-1 = "แต่ที่จริงแล้ว\nถ้าได้เล่นกับคุณครู\nไม่ว่าอะไรก็สนุกทั้งนั้นค่ะ!"
10143-460-1 = "การเล่นน้ำต้องใช้แรง\nพอสมควรเลยนะคะ..."
10143-470-1 = "ถึงอย่างนั้น ฉันก็ชอบ\nการลงไปในน้ำค่ะ"
10143-480-1 = "เพราะมันรู้สึกเหมือน\nร่างกายเบาขึ้นน่ะค่ะ"
10143-490-1 = "ไว้วันไหน คุณครูก็...\nมาด้วยกันมั้ยคะ?"
10143-500-1 = "สมมติว่าฉันตกน้ำ..."
10143-510-1 = "แต่เป็นการ 'แกล้งทำ' ว่าตกน้ำ\nถึงอย่างนั้นคุณครูก็จะ\nมาช่วยฉันมั้ยคะ?"
10143-520-1 = "ฉันแอบใฝ่ฝันถึง...\nเรื่องแบบนั้นอยู่นิดหน่อยค่ะ\nแค่คิดเฉยๆ เท่านั้น\nไม่ได้จะทำจริงๆ หรอกนะคะ"
10143-530-1 = "สุขสันต์วันเกิดค่ะ\nคุณครู ฮุฮุฮุ"
10143-540-1 = "ฉันจะชมคุณครู\nที่พยายามเต็มที่ในวันนี้\nว่าเป็นเด็กดีนะคะ"
10143-550-1 = "ค่ะ เข้ามาสิคะ "
10143-550-2 = "เอ๊ะ... เอ๋?!"
10143-560-1 = "มาทางนี้ค่ะ"
10143-560-2 = "คะ... คุณครู!?"
10143-570-1 = "นี่มัน คือว่า...!"
10143-570-2 = "สุขสันต์วันเกิดค่ะ คุณครู!"
10143-580-1 = "ระ... ระระระ... หรือว่า"
10143-580-2 = "คราวหน้าคุณครูต้อง\nอวยพรวันเกิดให้ฉันด้วยนะคะ"
10143-590-1 = "ขอบคุณที่อวยพร...\nวันเกิดให้ฉันนะคะ\nคุณครู"
10143-590-2 = "ที่คุณซายะบอกว่า\nอาจไม่เสถียรนิดหน่อยก็ได้\nหรือว่าจะเป็น...?"
10143-600-1 = "เอ่อ... ถ้าคุณครูไม่ว่าอะไร"
10143-600-2 = "อ๊ายยย...?!\nทำไมคุณครู\nถึงเป็นฝ่ายขอโทษล่ะคะ?!"
10143-610-1 = "วันนี้ทั้งวัน... ช่วยชมฉัน"
10143-610-2 = "ที่สำคัญกว่านั้น...!"
10143-620-1 = "ว่าเป็นเด็กดี\nจะได้มั้ยคะ...?"
10143-620-2 = "ฉะ... ฉันควรทำยังไงดี...!"
10143-630-1 = "ไม่ได้นะคะ!"
10143-630-2 = "วันนี้เป็นวันเกิดของฉันค่ะ!"
10143-640-1 = "คะ... คือว่า...!"
10143-640-2 = "ของขวัญวันเกิดจากคุณครู\nคืออะไรเหรอคะ?"
10143-645-1 = "ฮุฮุ...\nก็เด็กๆ น่ะ ย่อมเชื่อว่า\nจะต้องมีของขวัญนี่คะ?"
10143-650-1 = "ช่วยอยู่ตรงนั้นได้มั้ยคะ?"
10143-650-2 = "เพราะงั้นวันนี้...\nขอให้ฉันอ้อนคุณครูเยอะๆ นะคะ"
10143-660-1 = "ผ่านไปอีกหนึ่งปีแล้วสินะคะ"
10143-660-2 = "ฉันจะไปซ่อนตัวค่ะ..."
10143-670-1 = "สวัสดีปีใหม่ค่ะ คุณครู"
10143-670-2 = "ฉัน... ไม่เป็นไรค่ะ"
10143-680-1 = "เวลา...\nผ่านไปเร็วจริงๆ นะคะ"
10143-680-2 = "ถ้าเป็นคุณครูละก็... "
10143-690-1 = "จะอยู่แบบนั้น\nต่ออีกสักหน่อยก็ได้..."
10143-690-2 = "เข้าสู่ปีใหม่แล้วค่ะ คุณครู"
10143-700-1 = "ชุนหลิงโตเป็นพี่\nขึ้นอีกปีแล้วค่ะ!"
10143-705-1 = "พอพูดในรูปลักษณ์นี้...\nก็รู้สึกแปลกนิดหน่อยนะคะ"
10143-710-1 = "คริสต์มาสแล้วสินะคะ..."
10143-720-1 = "พอถึงช่วงเวลานี้\nที่สวนต้นบ๊วย..."
10143-730-1 = "ทุกคนจะพากันอวดกันว่า\nตัวเองเป็นเด็กดีค่ะ"
10143-740-1 = "ทั้งที่ต่างก็เป็นเด็กดีกัน\nอยู่แล้วแท้ๆ ค่ะ"
10143-750-1 = "ถึงวันคริสต์มาสแล้วค่ะ!"
10143-760-1 = "ปีนี้ฉันเป็น\n'เด็กดี' หรือเปล่าคะ?"
10143-765-1 = "ถ้าคุณครู\nยอมเป็นซานต้าให้ฉัน...\nฉันคงดีใจมากเลยค่ะ♪"
10143-770-1 = "ที่ซานไห่จิงและสวนต้นบ๊วย\nทุกคนเริ่มเรียนรู้แล้วว่า\nวันนี้เป็นวันอะไรค่ะ"
10143-780-1 = "ทุกคนก็เลยแต่งตัว\nแล้วออกไปขอลูกกวาดกันค่ะ"
10143-790-1 = "เอาละ งั้นกับคุณครูก็ด้วย"
10143-800-1 = "ทริก ออร์ ทรีตค่ะ"
10143-810-1 = "ขอลูกกวาดหน่อยค่ะ คุณครู!\nลูกกวาดค่ะ!"
10143-820-1 = "ฉันอยากรีบกินให้หมด\nก่อนโดนทริก ออร์ ทรีต\nแล้วถูกแย่งไปหมดค่ะ!"
10143-2600-1 = "ช่วงพักร้อน... เป็นช่วงที่เราเผลอผ่อนคลายจนประมาทได้ง่ายนะคะ ฉันเองก็จะระวัง\nเพราะงั้นคุณครูก็ระวังด้วยนะคะ\nถ้าไม่ทำตามกฎความปลอดภัย\nจะต้องถูก 'อบรม' นะคะ"
