[translation]
10143-10-1 = "蔚藍，檔案。"
10143-20-1 = "蔚藍檔案！耶嘿嘿。"
10143-30-1 = "您做暖身操了嗎？\n不做確實的話可是不行的哦？"
10143-40-1 = "哎呀……\n真是個好地方呢。"
10143-50-1 = "這杯茶……\n感覺對皮膚很好呢。"
10143-60-1 = "（穿著泳裝來這裡，\n真的沒問題嗎……）"
10143-70-1 = "唔唔……\n肩膀好像要僵掉了……"
10143-80-1 = "實在是太舒適了……\n好想一直待在這裡……"
10143-90-1 = "歡迎回來，老師。\n要玩水呢？\n還是要吃飯呢？"
10143-100-1 = "又或者……"
10143-110-1 = "請儘管告訴我。\n一起開心地享受吧？"
10143-120-1 = "您好！老師！"
10143-130-1 = "「小旬」，\n想和老師一起玩！"
10143-140-1 = "您好，老師。"
10143-150-1 = "呵呵，是的。\n今天我穿泳裝來了。"
10143-160-1 = "是的！我是「小旬」哦！\n我換上泳裝來了♪"
10143-170-1 = "怎麼樣呢，老師？\n可愛嗎？"
10143-180-1 = "太熱的話就會變得\n什麼都無法思考呢……"
10143-190-1 = "暑假的計畫……\n已經決定好了嗎？"
10143-200-1 = "如果可以的話……\n請偷偷地，告訴我。"
10143-210-1 = "現在的我，不是教官！"
10143-220-1 = "所以……\n平常做不了的事，\n我要盡～情地做！"
10143-230-1 = "我現在，並不是教官。"
10143-240-1 = "而且，還穿著泳裝\n待在夏萊。"
10143-250-1 = "那個……也就是說……"
10143-260-1 = "作為單純的老師與學生，"
10143-270-1 = "或許能有與平時\n不一樣的相處方式，"
10143-280-1 = "之類的……"
10143-290-1 = "聽說隨著長大，\n體感時間會變得\n越來越短。"
10143-300-1 = "小時候，\n映入眼簾的一切\n都很新鮮又耀眼……"
10143-305-1 = "所以時間才會\n過得那麼緩慢。"
10143-310-1 = "現在的我雖然身材嬌小，\n但是知道許多事情──"
10143-320-1 = "所以說不定，\n相比同年齡的其他孩子，\n體感時間來得更短呢。"
10143-330-1 = "快樂的時光總是稍縱即逝。"
10143-340-1 = "所以，每一個瞬間\n都必須好好珍惜。"
10143-350-1 = "對我來說……"
10143-360-1 = "現在這一瞬間，正是如此。"
10143-370-1 = "老師，老師！"
10143-380-1 = "您和換好裝的「小旬」\n有想一起去的地方嗎？"
10143-390-1 = "我只要是和老師一起，\n去哪裡都可以哦！"
10143-400-1 = "如果說，\n願望能夠實現的話……"
10143-410-1 = "我一直想著，要和老師\n去各式各樣的地方看看。"
10143-420-1 = "游泳池、溪谷、大海……"
10143-430-1 = "老師，您想去哪裡呢？"
10143-440-1 = "玩水，真開心呢♪"
10143-450-1 = "不過……其實，\n只要能和老師一起玩，做什麼我都很開心！"
10143-460-1 = "玩水這件事，\n其實還挺\n消耗體力的呢？"
10143-470-1 = "不過，\n我很喜歡下水。"
10143-480-1 = "總覺得，\n身體會變得\n輕盈起來……"
10143-490-1 = "老師哪天也一起……\n來玩水嗎？"
10143-500-1 = "如果我溺水了……"
10143-510-1 = "就算那是「裝的」，\n老師也會來救我嗎？"
10143-520-1 = "只是覺得……\n有點憧憬那種情境而已。\n我不會真的那麼做啦？"
10143-530-1 = "生日快樂，老師。呵呵呵。"
10143-540-1 = "在今天這樣的日子\n也如此努力的老師，\n我要給您摸摸頭獎勵一下。"
10143-550-1 = "好，來吧。"
10143-550-2 = "咦，呀啊啊！？"
10143-560-1 = "請到這邊來。"
10143-560-2 = "老，老師！？"
10143-570-1 = "這是，那個……！"
10143-570-2 = "祝您生日快樂，老師！"
10143-580-1 = "話，話說回來……"
10143-580-2 = "……下次，我的生日，\n也要幫我慶祝哦？"
10143-590-1 = "謝謝您的祝福……老師。"
10143-590-2 = "沙耶同學說過可能會\n變得有些不穩定……\n難道說……？"
10143-600-1 = "那個……\n如果，您願意的話。"
10143-600-2 = "老，老師沒有\n必要道歉……！"
10143-610-1 = "今天一整天……給我。"
10143-610-2 = "不，不如說……\n那個……這個。"
10143-620-1 = "「摸摸頭」可以嗎……？"
10143-620-2 = "我，我到底該怎麼辦……！"
10143-630-1 = "不可以！"
10143-630-2 = "今天，是我的生日哦！"
10143-640-1 = "那，那個……！"
10143-640-2 = "老師，生日禮物是什麼呢？"
10143-645-1 = "……呵呵，\n小孩子都會覺得\n一定有禮物的哦？"
10143-650-1 = "可以請您站在那裡嗎？"
10143-650-2 = "所以說──\n今天，要多多寵著我哦？"
10143-660-1 = "哎呀，新年了呢。"
10143-660-2 = "因為我要躲起來……"
10143-670-1 = "祝您新年快樂，老師。"
10143-670-2 = "我……不要緊的。"
10143-680-1 = "真的……\n時間過得好快呢。"
10143-680-2 = "如果是老師的話……"
10143-690-1 = "再稍微維持這樣，\n也是……"
10143-690-2 = "新年到了呢。\n祝您新年快樂，老師！"
10143-700-1 = "小旬又長大了一歲，\n變成大姐姐了！"
10143-705-1 = "……用這副模樣說出來，\n總覺得有種神奇的感覺呢。"
10143-710-1 = "是聖誕節呢……"
10143-720-1 = "一到這個時期，\n在梅花園──"
10143-730-1 = "大家就會開始主張\n自己是好孩子。"
10143-740-1 = "是的，雖然大家\n原本就是好孩子。"
10143-750-1 = "是聖誕節哦，老師！"
10143-760-1 = "這一年，我是個\n「好孩子」嗎？"
10143-765-1 = "如果聖誕老師願意來的話……\n我會很開心的♪"
10143-770-1 = "無論在山海經還是梅花園，\n萬聖節是個什麼樣的日子，\n最近都漸漸傳開了。"
10143-780-1 = "所以，大家都會\n變裝去討糖果呢。"
10143-790-1 = "來，老師也一起。"
10143-800-1 = "不給糖就搗蛋哦。"
10143-810-1 = "老師！請問有沒有糖果呢？"
10143-820-1 = "被不給糖就搗蛋拿走之前，\n我想先吃掉幾顆……！"
10143-2600-1 = "像這樣外出度假的時候，\n總是會不知不覺鬆懈下來。\n但是，正是這種時候才更要繃緊神經才行哦？\n不遵守規矩的話，可是不行的哦。"
