[translation]
10143-10 = "Blue... Archive"
10143-20 = "Blue Archive! แหะๆๆ"
10143-30 = "วอร์มอัปมาแล้วหรือยังคะ?\nถ้าไม่ทำให้เรียบร้อย จะถูกฉันดุนะคะ"
10143-40 = "ว้าว เป็นสถานที่\nที่ยอดเยี่ยมจังเลยค่ะ"
10143-50 = "ไม่ทราบว่าชานั่น...\nดีต่อผิวพรรณหรือเปล่าคะ?"
10143-60 = "(ใส่ชุดว่ายน้ำ\nในสถานที่แบบนี้\nจะไม่เป็นไรเหรอคะ...?)"
10143-70 = "อึก...\nไหล่กลับมาตึงอีกแล้วค่ะ..."
10143-80 = "ที่นี่เย็นสบายมาก\nจนไม่อยากออกไปเลยค่ะ..."
10143-90 = "เชิญค่ะ คุณครู\nจะเล่นน้ำก่อน?\nหรือจะทานข้าวก่อนดีคะ? "
10143-100 = "หรือถ้าไม่อย่างนั้น..."
10143-110 = "แค่บอกฉันมาก็พอค่ะ"
10143-120 = "สวัสดีค่ะ คุณครู!"
10143-130 = "ชุนหลิง\nอยากเล่นซนกับคุณครูค่ะ!"
10143-140 = "สวัสดีค่ะ คุณครู"
10143-150 = "ฮุฮุ ค่ะ\nวันนี้ฉันมาในชุดว่ายน้ำค่ะ"
10143-160 = "ค่ะ! ฉันชุนหลิงเองค่ะ!\nฉันเปลี่ยนเป็นชุดว่ายน้ำ\nมาแล้วค่ะ!"
10143-170 = "เป็นยังไงบ้างคะ คุณครู?\nน่ารักมั้ยคะ?"
10143-180 = "ถ้าอากาศร้อนมากๆ\nมันก็ลำบากนี่คะ"
10143-190 = "กำลังคิดเรื่อง...\nวันหยุดฤดูร้อนอยู่เหรอคะ?"
10143-200 = "ถ้าคุณครูไม่ว่าอะไรละก็...\nฉันอยากให้แอบบอกฉัน\nสักนิดจัง..."
10143-210 = "ก็ตอนนี้ฉันไม่ได้เป็น\nผู้ฝึกสอนนี่คะ!"
10143-220 = "เพราะงั้น...\nฉันจะทำสิ่งที่ปกติไม่เคยได้ทำ\nให้สนุกเต็มที่เลยค่ะ!"
10143-230 = "พอมาคิดดูอีกครั้ง\nตอนนี้ฉันไม่ได้อยู่\nในฐานะผู้ฝึกสอนสินะคะ"
10143-240 = "แถมยัง...\nอยู่ในชุดว่ายน้ำด้วยค่ะ"
10143-250 = "คะ? หมายความว่ายังไงน่ะเหรอคะ?\nคือว่า เรื่องนั้น..."
10143-260 = "ในตอนนี้ "
10143-270 = "ฉันกำลังคิดว่าเรา\nอาจมีความสัมพันธ์ที่\nใกล้ชิดกันมากกว่าปกติ"
10143-280 = "น่ะค่ะ...?"
10143-290 = "ได้ยินมาว่า เมื่อเติบโตขึ้น\nเราจะรู้สึกว่าเวลาผ่านไปเร็วขึ้นค่ะ"
10143-300 = "เพราะตอนยังเด็ก ทุกอย่าง\nล้วนเป็นประสบการณ์ใหม่..."
10143-305 = "ก็เลยรู้สึกเหมือนเวลา\nผ่านไปอย่างเชื่องช้าค่ะ"
10143-310 = "แม้ตอนนี้ร่างกายของฉัน...\nจะเป็นเด็กเล็ก\nแต่ฉันก็รู้เรื่องต่างๆ มากมาย..."
10143-320 = "บางทีฉันอาจรู้สึกว่า\nเวลาผ่านไปเร็วกว่าพวกเด็กๆ\nวัยเดียวกันก็ได้นะคะ"
10143-330 = "ช่วงเวลาดีๆ มักจะ\nผ่านไปในพริบตาเลยนะคะ"
10143-340 = "เพราะงั้นเราถึงต้อง\nให้ความสำคัญกับทุกช่วงเวลาค่ะ"
10143-350 = "และนั่นก็หมายความว่า\nช่วงเวลาที่สำคัญสำหรับฉัน..."
10143-360 = "ก็คือตอนนี้ค่ะ"
10143-370 = "คุณครูคะ คุณครู!"
10143-380 = "มีที่ที่คุณครูอยากไป\nกับชุนหลิงในชุดว่ายน้ำมั้ยคะ?"
10143-390 = "ถ้าได้ไปกับคุณครู\nไม่ว่าที่ไหนฉันก็ชอบค่ะ!"
10143-400 = "ไม่รู้ทำไม\nฉันถึงคิดแบบนั้นขึ้นมาค่ะ"
10143-410 = "ถ้าเป็นที่ที่ฉันสามารถ\nใส่ชุดว่ายน้ำไปกับคุณครูได้\nไม่ว่าที่ไหนฉันก็อยากไปค่ะ"
10143-420 = "ไม่ว่าจะเป็นสระว่ายน้ำ หุบเขา\nหรือทะเล..."
10143-430 = "แล้วคุณครูคิดว่ายังไงคะ?"
10143-440 = "ฉันชอบเล่นน้ำค่ะ!"
10143-450 = "แต่ที่จริงแล้ว\nถ้าได้เล่นกับคุณครู\nไม่ว่าอะไรก็สนุกทั้งนั้นค่ะ!"
10143-460 = "การเล่นน้ำต้องใช้แรง\nพอสมควรเลยนะคะ..."
10143-470 = "ถึงอย่างนั้น ฉันก็ชอบ\nการลงไปในน้ำค่ะ"
10143-480 = "เพราะมันรู้สึกเหมือน\nร่างกายเบาขึ้นน่ะค่ะ"
10143-490 = "ไว้วันไหน คุณครูก็...\nมาด้วยกันมั้ยคะ?"
10143-500 = "สมมติว่าฉันตกน้ำ..."
10143-510 = "แต่เป็นการ 'แกล้งทำ' ว่าตกน้ำ\nถึงอย่างนั้นคุณครูก็จะ\nมาช่วยฉันมั้ยคะ?"
10143-520 = "ฉันแอบใฝ่ฝันถึง...\nเรื่องแบบนั้นอยู่นิดหน่อยค่ะ\nแค่คิดเฉยๆ เท่านั้น\nไม่ได้จะทำจริงๆ หรอกนะคะ"
10143-530 = "สุขสันต์วันเกิดค่ะ\nคุณครู ฮุฮุฮุ"
10143-540 = "ฉันจะชมคุณครู\nที่พยายามเต็มที่ในวันนี้\nว่าเป็นเด็กดีนะคะ"
10143-550 = "เอ๊ะ... เอ๋?!"
10143-560 = "คะ... คุณครู!?"
10143-570 = "สุขสันต์วันเกิดค่ะ คุณครู!"
10143-580 = "คราวหน้าคุณครูต้อง\nอวยพรวันเกิดให้ฉันด้วยนะคะ"
10143-590 = "ที่คุณซายะบอกว่า\nอาจไม่เสถียรนิดหน่อยก็ได้\nหรือว่าจะเป็น...?"
10143-600 = "อ๊ายยย...?!\nทำไมคุณครู\nถึงเป็นฝ่ายขอโทษล่ะคะ?!"
10143-610 = "ที่สำคัญกว่านั้น...!"
10143-620 = "ฉะ... ฉันควรทำยังไงดี...!"
10143-630 = "วันนี้เป็นวันเกิดของฉันค่ะ!"
10143-640 = "ของขวัญวันเกิดจากคุณครู\nคืออะไรเหรอคะ?"
10143-645 = "ฮุฮุ...\nก็เด็กๆ น่ะ ย่อมเชื่อว่า\nจะต้องมีของขวัญนี่คะ?"
10143-650 = "เพราะงั้นวันนี้...\nขอให้ฉันอ้อนคุณครูเยอะๆ นะคะ"
10143-660 = "ฉันจะไปซ่อนตัวค่ะ..."
10143-670 = "ฉัน... ไม่เป็นไรค่ะ"
10143-680 = "ถ้าเป็นคุณครูละก็... "
10143-690 = "เข้าสู่ปีใหม่แล้วค่ะ คุณครู"
10143-700 = "ชุนหลิงโตเป็นพี่\nขึ้นอีกปีแล้วค่ะ!"
10143-705 = "พอพูดในรูปลักษณ์นี้...\nก็รู้สึกแปลกนิดหน่อยนะคะ"
10143-710 = "คริสต์มาสแล้วสินะคะ..."
10143-720 = "พอถึงช่วงเวลานี้\nที่สวนต้นบ๊วย..."
10143-730 = "ทุกคนจะพากันอวดกันว่า\nตัวเองเป็นเด็กดีค่ะ"
10143-740 = "ทั้งที่ต่างก็เป็นเด็กดีกัน\nอยู่แล้วแท้ๆ ค่ะ"
10143-750 = "ถึงวันคริสต์มาสแล้วค่ะ!"
10143-760 = "ปีนี้ฉันเป็น\n'เด็กดี' หรือเปล่าคะ?"
10143-765 = "ถ้าคุณครู\nยอมเป็นซานต้าให้ฉัน...\nฉันคงดีใจมากเลยค่ะ♪"
10143-770 = "ที่ซานไห่จิงและสวนต้นบ๊วย\nทุกคนเริ่มเรียนรู้แล้วว่า\nวันนี้เป็นวันอะไรค่ะ"
10143-780 = "ทุกคนก็เลยแต่งตัว\nแล้วออกไปขอลูกกวาดกันค่ะ"
10143-790 = "เอาละ งั้นกับคุณครูก็ด้วย"
10143-800 = "ทริก ออร์ ทรีตค่ะ"
10143-810 = "ขอลูกกวาดหน่อยค่ะ คุณครู!\nลูกกวาดค่ะ!"
10143-820 = "ฉันอยากรีบกินให้หมด\nก่อนโดนทริก ออร์ ทรีต\nแล้วถูกแย่งไปหมดค่ะ!"
10143-2600 = "ช่วงพักร้อน... เป็นช่วงที่เราเผลอผ่อนคลายจนประมาทได้ง่ายนะคะ ฉันเองก็จะระวัง\nเพราะงั้นคุณครูก็ระวังด้วยนะคะ\nถ้าไม่ทำตามกฎความปลอดภัย\nจะต้องถูก 'อบรม' นะคะ"
