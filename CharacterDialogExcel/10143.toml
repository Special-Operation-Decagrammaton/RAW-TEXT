[translation]
10143-10-1 = "Blue, Archive."
10143-20-1 = "Blue Archive! Heehee."
10143-30-1 = "Did you stretch properly? It's a big no-no if you haven't!"
10143-40-1 = "Wow, it's amazing here."
10143-50-1 = "By any chance, is that tea good for your skin?"
10143-60-1 = "(Is it okay to be wearing a swimsuit here...?)"
10143-70-1 = "Ugh... My shoulders are sore again..."
10143-80-1 = "It's nice and cool here. I don't want to go outside..."
10143-90-1 = "Welcome, Sensei.\nWould you like to play in the water? Or eat first? "
10143-100-1 = "Or..."
10143-110-1 = "Your wish is my command."
10143-120-1 = "Hello, Sensei!"
10143-130-1 = "Shunling really wants to play with Sensei!"
10143-140-1 = "Hello, Sensei."
10143-150-1 = "Fufu. Yes. I'm wearing a swimsuit today."
10143-160-1 = "Yes! It's Shunling! Shunling in a swimsuit!"
10143-170-1 = "What do you think, Sensei? Am I cute?"
10143-180-1 = "The heat is so exhausting."
10143-190-1 = "Are you thinking about...summer vacation?"
10143-200-1 = "If you're okay with it... Please give me just a small hint..."
10143-210-1 = "Because I'm not an instructor right now!"
10143-220-1 = "I'm going to do lots of things I usually can't!"
10143-230-1 = "I just realized, I'm not an instructor right now."
10143-240-1 = "Also... I'm in a swimsuit."
10143-250-1 = "Hm? What do I mean? Well, you see..."
10143-260-1 = "At this moment... "
10143-270-1 = "Perhaps I feel even closer to you..."
10143-280-1 = " ...than usual?"
10143-290-1 = "I've heard that time passes more quickly as you get older."
10143-300-1 = "When you're young, every experience is a new one."
10143-305-1 = "So time naturally goes slower."
10143-310-1 = "I may be in the body of a child, but I know a lot of things."
10143-320-1 = "That's why time might still pass more quickly for me than my peers."
10143-330-1 = "Good times really do fly by."
10143-340-1 = "So we need to treasure every moment we have."
10143-350-1 = "That said, our precious time..."
10143-360-1 = "...is happening right now, isn't it?"
10143-370-1 = "Sensei, Sensei!"
10143-380-1 = "Is there anywhere you want to go with Shunling in a swimsuit?"
10143-390-1 = "Shunling would go anywhere with you!"
10143-400-1 = "I had a thought."
10143-410-1 = "I want to go somewhere I can wear a swimsuit with you."
10143-420-1 = "Like a swimming pool, a creek, or the beach..."
10143-430-1 = "What about you, Sensei?"
10143-440-1 = "Playing in water is fun!"
10143-450-1 = "The truth is, anything is fun as long as it's with you!"
10143-460-1 = "Playing in water takes up a lot of stamina..."
10143-470-1 = "But I do still enjoy being in the water."
10143-480-1 = "It makes my body feel lighter."
10143-490-1 = "Would you...like to join me sometime, Sensei?"
10143-500-1 = "If I fell into the water..."
10143-510-1 = "...even if I was only pretending, would you come save me, Sensei?"
10143-520-1 = "I sort of...fantasize about something like that. But it's just a thought! Not something I would really do!"
10143-530-1 = "Happy birthday, Sensei. Fufufu."
10143-540-1 = "I'll give you \"good job, good job\" praises for working hard."
10143-550-1 = "Yes, here you go. "
10143-550-2 = "H-Huuh?!"
10143-560-1 = "Come this way."
10143-560-2 = "S-Sensei?!"
10143-570-1 = "This is, well...!"
10143-570-2 = "Happy birthday, Sensei!"
10143-580-1 = "N-N-Now that I think about it..."
10143-580-2 = "You have to celebrate my birthday later too, okay?"
10143-590-1 = "My birthday... Thank you for celebrating my birthday, Sensei."
10143-590-2 = "When Saya said it could get slightly unstable, did she mean...?"
10143-600-1 = "Um... If you don't mind..."
10143-600-2 = "Wow...?! Why are you apologizing, Sensei?!"
10143-610-1 = "...could you..."
10143-610-2 = "More importantly...!"
10143-620-1 = "...praise me for doing a good job?"
10143-620-2 = "Wh-What should I do...?!"
10143-630-1 = "No, don't do that!"
10143-630-2 = "It's my birthday!"
10143-640-1 = "W-Well...!"
10143-640-2 = "Did you get me a present?"
10143-645-1 = "Fufufu. Of course a kid would think she's getting a birthday present!"
10143-650-1 = "Could you stay there?"
10143-650-2 = "That's why... You have to spoil me lots today!"
10143-660-1 = "A year has passed."
10143-660-2 = "I'll hide..."
10143-670-1 = "Happy New Year, Sensei."
10143-670-2 = "I'm...f-fine."
10143-680-1 = "Wow... Time really does fly by."
10143-680-2 = "If it's you, Sensei... "
10143-690-1 = "You can stay there a little longer..."
10143-690-2 = "It's the new year, Sensei."
10143-700-1 = "Shunling also got a year older!"
10143-705-1 = "...It can feel a little weird speaking like this."
10143-710-1 = "It's Christmas..."
10143-720-1 = "Around this time of the year, the Plum Blossom Garden students..."
10143-730-1 = "...all declare how good they've been this year."
10143-740-1 = "They really are good children, though."
10143-750-1 = "It's Christmas!"
10143-760-1 = "Was I a \"good girl\" this year?"
10143-765-1 = "I would be very happy...if you could be my Santa! ♪"
10143-770-1 = "Shanhaijing and the Plum Blossom Garden have learned about \"Halloween.\""
10143-780-1 = "Everyone is wearing costumes and asking for candy."
10143-790-1 = "Your turn, Sensei."
10143-800-1 = "Trick or treat!"
10143-810-1 = "Give me candy, Sensei! Candy!"
10143-820-1 = "I wanna eat lots of candy, before I have to give them to trick-or-treaters!"
10143-2600-1 = "Summer... Vacation... It's a time where people tend to become more lax. I'll take caution, so you should as well, Sensei. If you don't follow the safety rules, I'll have to discipline you, okay?"
