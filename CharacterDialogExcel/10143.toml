[translation]
10143-10-1 = "ブルー、アーカイブ。"
10143-20-1 = "ブルーアーカイブ！えへへ。"
10143-30-1 = "準備体操はしましたか？\nちゃんとしないとメッですよ？"
10143-40-1 = "あら……\n素敵な場所ですね。"
10143-50-1 = "このお茶……\nお肌に良さそうです。"
10143-60-1 = "（ここって水着姿で\n来ても、大丈夫\nだったの\nでしょうか……）"
10143-70-1 = "うう……\n肩が凝って\nしまいそう……。"
10143-80-1 = "とても\n快適すぎて……\nずっとここに\nいたいです……。"
10143-90-1 = "おかえりなさい、先生。\n水遊びにします？ご飯にします？"
10143-100-1 = "それとも……。"
10143-110-1 = "なんでもお伝え下さい。\n一緒に楽しみましょう？"
10143-120-1 = "こんにちは！先生！"
10143-130-1 = "「シュエリン」は、\n先生と遊びたいです！"
10143-140-1 = "こんにちは、先生。"
10143-150-1 = "ふふっ。ええ、\n今日は水着で来てみました。"
10143-160-1 = "はい！「シュエリン」ですよ！\n水着に着替えてきちゃいました♪"
10143-170-1 = "どうでしょう、先生？\n可愛いですか？"
10143-180-1 = "暑いと何も考えられ\nなくなってしまいますよね……。"
10143-190-1 = "夏休みの計画……\n既に決まっていますか？"
10143-200-1 = "もしよろしければ……\nこっそり、教えてください。"
10143-210-1 = "今の私は、\n教官ではありません！"
10143-220-1 = "なので…\n普段できないことを、\nい～っぱいしちゃいます！"
10143-230-1 = "私は今、教官ではありません。"
10143-240-1 = "そして、水着を着て、\nシャーレにいます。"
10143-250-1 = "その……つまり……。"
10143-260-1 = "ただの先生と生徒として、"
10143-270-1 = "普段とは違う接し方ができる\nのではないかな、"
10143-280-1 = "なんて……。"
10143-290-1 = "大きくなるにつれて、\n体感時間が短くなっていくと\n聞きました。"
10143-300-1 = "子供の時は、\n目に映るものがすべて\n新鮮で輝いていて…"
10143-305-1 = "だから時間が\nゆっくりだったんです。"
10143-310-1 = "今の私は身体は小さいですが、\n色々なことを知っているので――"
10143-320-1 = "もしかしたら、\n同年代の他の子よりも、\n体感時間が\n短くなってるかもしれませんね。"
10143-330-1 = "楽しい時間はあっという間。"
10143-340-1 = "ですから、どの瞬間も\n大切にしないといけません。"
10143-350-1 = "私にとっては……"
10143-360-1 = "今この瞬間が、そうなんです。"
10143-370-1 = "先生、先生！"
10143-380-1 = "着替えてきた\n「シュエリン」と\n一緒に行きたい場所、\nありますか？"
10143-390-1 = "私は先生と一緒なら、\nどこでも良いですよ！"
10143-400-1 = "もしも、願いが叶うのなら……。"
10143-410-1 = "先生と色々なところに、\n行ってみたいと思っていまして。"
10143-420-1 = "プール、渓谷、海……。"
10143-430-1 = "先生は、どこに行きたいですか？"
10143-440-1 = "水遊び、楽しいですね♪"
10143-450-1 = "でも…本当は、\n先生と遊べるならなんでも\n嬉しいです！"
10143-460-1 = "水遊びって、結構体力を\n使ってしまいますよね？"
10143-470-1 = "でも、\n水に入るのは好きなんです。"
10143-480-1 = "なんだか、\n身体が軽くなる感じがして……。"
10143-490-1 = "先生もいつか一緒に……\n遊びませんか？"
10143-500-1 = "もしも私が\n溺れちゃったら…"
10143-510-1 = "それが「ふり」だとしても、\n先生は助けに来てくれますか？"
10143-520-1 = "なんとなく…\nそういうのに\n憧れちゃうだけです。\n本当にやったりはしませんよ？"
10143-530-1 = "お誕生日おめでとうございます、\n先生。うふふ。"
10143-540-1 = "今日という日を\n頑張っている先生を\nいいこいいこ、してあげます。"
10143-550-1 = "はい、どうぞ。"
10143-550-2 = "えっ、ひゃああ！？"
10143-560-1 = "こちらへ\nいらっしゃってください。"
10143-560-2 = "せ、先生！？"
10143-570-1 = "これは、その……！"
10143-570-2 = "お誕生日\nおめでとうございます、\n先生！"
10143-580-1 = "そ、そういえば……。"
10143-580-2 = "…今度、私の誕生日も、\nお祝いしてくださいね？"
10143-590-1 = "お祝いの言葉……\nありがとうございます、先生。"
10143-590-2 = "サヤさんが、少し不安定になる\nかもと仰っていましたが……\nっまさか……？"
10143-600-1 = "その……もし、よろしければ。"
10143-600-2 = "せ、先生が\n謝る必要はありません……！"
10143-610-1 = "今日一日……私を。"
10143-610-2 = "と、というか……\nあの……えっと。"
10143-620-1 = "「いいこいいこ」\nしてくださりませんか……？"
10143-620-2 = "わ、私はどうしたら……！"
10143-630-1 = "ダメです！"
10143-630-2 = "今日、私の\n誕生日なんです！"
10143-640-1 = "そ、その……！"
10143-640-2 = "先生、\n誕生日プレゼントは\nなんですか？"
10143-645-1 = "…ふふっ、\n子供はプレゼントがあるものだと\n思っているんですよ？"
10143-650-1 = "そこに立って\nいただいてもいいですか？"
10143-650-2 = "なので――\n今日は、いっぱい\n甘やかしてくださいね？"
10143-660-1 = "あら、年が明けましたね。"
10143-660-2 = "隠れるので……。"
10143-670-1 = "あけまして\nおめでとうございます。先生。"
10143-670-2 = "私……大丈夫、ですから。"
10143-680-1 = "本当に……時間が過ぎるのは、\n早いのですね。"
10143-680-2 = "先生、でしたら……"
10143-690-1 = "もう少しこのまま、でも……。"
10143-690-2 = "年が明けましたね。\nあけましておめで\nとうございます、先生！"
10143-700-1 = "シュエリンはまた一つ、\nお姉さんになりました！"
10143-705-1 = "…この姿で言うのは、\nなんだか不思議な気分ですね。"
10143-710-1 = "クリスマスですね……。"
10143-720-1 = "この時期になると梅花園では――"
10143-730-1 = "みんな自分がいい子だ、\nと主張し始めるんです。"
10143-740-1 = "ええ、みんな\nいい子なんですけどね。"
10143-750-1 = "クリスマスですよ、\n先生！"
10143-760-1 = "この一年、私は\n「良い子」だったでしょうか？"
10143-765-1 = "先生サンタが来てくれたら…\n嬉しいです♪"
10143-770-1 = "山海経でも梅花園でも、\n最近ハロウィーンが\nどんな日なのか\n広まってきたんです。"
10143-780-1 = "なので、みんな仮装して\n飴をねだるんですよ。"
10143-790-1 = "ほら、先生も。"
10143-800-1 = "トリック・オア・トリート、\nです。"
10143-810-1 = "先生！お菓子ってありますか？"
10143-820-1 = "トリックオアトリートで\n持っていかれちゃう前に、\nいくつか食べておきたくて…！"
10143-2600-1 = "こんな風にバカンスに出かけていると、\nついつい気が緩んでしまうもの。\nですが、そういう時こそ気を引き締めないと\nいけませんよ？\n規則を守らないと、メッですからね。"
