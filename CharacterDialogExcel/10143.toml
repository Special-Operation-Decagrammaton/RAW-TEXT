[translation]
10143-10 = "Blue, Archive."
10143-20 = "Blue Archive! Heehee."
10143-30 = "Did you stretch properly? It's a big no-no if you haven't!"
10143-40 = "Wow, it's amazing here."
10143-50 = "By any chance, is that tea good for your skin?"
10143-60 = "(Is it okay to be wearing a swimsuit here...?)"
10143-70 = "Ugh... My shoulders are sore again..."
10143-80 = "It's nice and cool here. I don't want to go outside..."
10143-90 = "Welcome, Sensei.\nWould you like to play in the water? Or eat first? "
10143-100 = "Or..."
10143-110 = "Your wish is my command."
10143-120 = "Hello, Sensei!"
10143-130 = "Shunling really wants to play with Sensei!"
10143-140 = "Hello, Sensei."
10143-150 = "Fufu. Yes. I'm wearing a swimsuit today."
10143-160 = "Yes! It's Shunling! Shunling in a swimsuit!"
10143-170 = "What do you think, Sensei? Am I cute?"
10143-180 = "The heat is so exhausting."
10143-190 = "Are you thinking about...summer vacation?"
10143-200 = "If you're okay with it... Please give me just a small hint..."
10143-210 = "Because I'm not an instructor right now!"
10143-220 = "I'm going to do lots of things I usually can't!"
10143-230 = "I just realized, I'm not an instructor right now."
10143-240 = "Also... I'm in a swimsuit."
10143-250 = "Hm? What do I mean? Well, you see..."
10143-260 = "At this moment... "
10143-270 = "Perhaps I feel even closer to you..."
10143-280 = " ...than usual?"
10143-290 = "I've heard that time passes more quickly as you get older."
10143-300 = "When you're young, every experience is a new one."
10143-305 = "So time naturally goes slower."
10143-310 = "I may be in the body of a child, but I know a lot of things."
10143-320 = "That's why time might still pass more quickly for me than my peers."
10143-330 = "Good times really do fly by."
10143-340 = "So we need to treasure every moment we have."
10143-350 = "That said, our precious time..."
10143-360 = "...is happening right now, isn't it?"
10143-370 = "Sensei, Sensei!"
10143-380 = "Is there anywhere you want to go with Shunling in a swimsuit?"
10143-390 = "Shunling would go anywhere with you!"
10143-400 = "I had a thought."
10143-410 = "I want to go somewhere I can wear a swimsuit with you."
10143-420 = "Like a swimming pool, a creek, or the beach..."
10143-430 = "What about you, Sensei?"
10143-440 = "Playing in water is fun!"
10143-450 = "The truth is, anything is fun as long as it's with you!"
10143-460 = "Playing in water takes up a lot of stamina..."
10143-470 = "But I do still enjoy being in the water."
10143-480 = "It makes my body feel lighter."
10143-490 = "Would you...like to join me sometime, Sensei?"
10143-500 = "If I fell into the water..."
10143-510 = "...even if I was only pretending, would you come save me, Sensei?"
10143-520 = "I sort of...fantasize about something like that. But it's just a thought! Not something I would really do!"
10143-530 = "Happy birthday, Sensei. Fufufu."
10143-540 = "I'll give you \"good job, good job\" praises for working hard."
10143-550 = "H-Huuh?!"
10143-560 = "S-Sensei?!"
10143-570 = "Happy birthday, Sensei!"
10143-580 = "You have to celebrate my birthday later too, okay?"
10143-590 = "When Saya said it could get slightly unstable, did she mean...?"
10143-600 = "Wow...?! Why are you apologizing, Sensei?!"
10143-610 = "More importantly...!"
10143-620 = "Wh-What should I do...?!"
10143-630 = "It's my birthday!"
10143-640 = "Did you get me a present?"
10143-645 = "Fufufu. Of course a kid would think she's getting a birthday present!"
10143-650 = "That's why... You have to spoil me lots today!"
10143-660 = "I'll hide..."
10143-670 = "I'm...f-fine."
10143-680 = "If it's you, Sensei... "
10143-690 = "It's the new year, Sensei."
10143-700 = "Shunling also got a year older!"
10143-705 = "...It can feel a little weird speaking like this."
10143-710 = "It's Christmas..."
10143-720 = "Around this time of the year, the Plum Blossom Garden students..."
10143-730 = "...all declare how good they've been this year."
10143-740 = "They really are good children, though."
10143-750 = "It's Christmas!"
10143-760 = "Was I a \"good girl\" this year?"
10143-765 = "I would be very happy...if you could be my Santa! ♪"
10143-770 = "Shanhaijing and the Plum Blossom Garden have learned about \"Halloween.\""
10143-780 = "Everyone is wearing costumes and asking for candy."
10143-790 = "Your turn, Sensei."
10143-800 = "Trick or treat!"
10143-810 = "Give me candy, Sensei! Candy!"
10143-820 = "I wanna eat lots of candy, before I have to give them to trick-or-treaters!"
10143-2600 = "Summer... Vacation... It's a time where people tend to become more lax. I'll take caution, so you should as well, Sensei. If you don't follow the safety rules, I'll have to discipline you, okay?"
