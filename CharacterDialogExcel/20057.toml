[translation]
20057-10-1 = "Blue Archive. Fufu."
20057-20-1 = "Millennium Science School, Call Sign 03, Murokasa Akane. Greeting you as a student today. Fufu. Though I was always a student, you know?"
20057-30-1 = "To start, I would like to prepare a cake."
20057-40-1 = "This place has a soothing air to it."
20057-50-1 = "I'd like to have that piece of furniture in our club room."
20057-60-1 = "(The cleaning was carried out well...but it could have been tidied up more neatly.)"
20057-70-1 = "(For this width... The amount of explosives I'd need is...)"
20057-80-1 = "Welcome. Preparations for \"class\" are complete."
20057-90-1 = "What will we be covering in \"class\" today?"
20057-100-1 = "I'm looking forward to hearing more of your interesting stories."
20057-110-1 = "\"Sensei\" or \"Master,\" which do you prefer?"
20057-120-1 = "I see... You like \"Sensei.\""
20057-130-1 = "Understood, Sensei."
20057-140-1 = "Being with you as a regular student... It's a rather interesting feeling."
20057-150-1 = "Although, I technically have always been your student, Sensei."
20057-160-1 = "There are many different methods to cleaning... "
20057-170-1 = "...but I have my own preferences."
20057-180-1 = "Fufu. In both types of cleaning, I should say. I'm a bit particular, after all."
20057-190-1 = "Sensei, what do you think about becoming a teacher at Millennium?"
20057-200-1 = "I would be able to take Sensei's class every day then..."
20057-210-1 = "\"Millennium's Sensei.\" I believe it has a nice ring to it..."
20057-220-1 = "Everyone says I seem to be a model student..."
20057-230-1 = "But I can't claim to be one on the inside too."
20057-240-1 = "After all, everyone has skeletons in their closets."
20057-250-1 = "So..."
20057-260-1 = "What do you say to a short student-teacher getaway?"
20057-270-1 = "I'm joking."
20057-280-1 = "Today is your birthday, yes? I remembered, of course."
20057-290-1 = "Well then, who do you wish to be congratulated by?"
20057-300-1 = "Your student? Or your maid?"
20057-310-1 = "Sensei. Do you know what day today is?"
20057-320-1 = "Yes. It's my birthday."
20057-330-1 = "To be upfront, I am asking this as your student."
20057-340-1 = "A maid couldn't do this, but I thought a student could be a little more audacious."
20057-350-1 = "So for my gift... I would like to have some of your time."
20057-360-1 = "Happy New Year, Sensei. I look forward to working with you this year as well."
20057-370-1 = "Since I'm not a maid today..."
20057-380-1 = "Why don't we avoid the stiff formalities...and go out for a walk together?"
20057-390-1 = "It's Christmas. By any chance... Should I look forward to receiving a present?"
20057-400-1 = "Fufu. If not, that's perfectly fine. "
20057-410-1 = "I just need you, Sensei."
20057-420-1 = "Halloween... A day filled with tricks and treats..."
20057-430-1 = "I've opted for another route and baked cookies."
20057-440-1 = "Have some with me, won't you?"
20057-460-1 = "Fufu."
20057-470-1 = "This situation is a bit more embarrassing than I thought it'd be."
20057-480-1 = "Being honest with oneself..."
20057-490-1 = "I simply can't seem to get used to it."
20057-500-1 = "Yes. Exactly as you say."
20057-510-1 = "But to me... It'd seem it was something I really needed."
20057-520-1 = "In more ways than one, I'm in your debt, Sensei."
20057-530-1 = "Despite everything, I think meeting you was..."
20057-540-1 = "It was truly a great stroke of luck."
20057-550-1 = "Life continues moving ever forward, and some things will be forgotten along the way."
20057-560-1 = "What happened right now will also, perhaps..."
20057-570-1 = "But I will remember."
20057-580-1 = "Even if you forget, Sensei."
20057-590-1 = "The really precious memories... They never truly disappear."
20057-2600-1 = "Owning a gun is essential in Kivotos, regardless of whether you're a maid or a student. I'll continue to work hard with this \"cleaning\" tool you've given me, Sensei."
