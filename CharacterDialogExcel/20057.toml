[translation]
20057-10 = "蔚藍檔案。呵呵。"
20057-20 = "千年科學學園，代號03室笠朱音。\n以學生身份向您問候。\n呵呵，不過我本來就是學生呢。"
20057-30 = "首先想準備蛋糕呢。"
20057-40 = "這裡總感覺\n很讓人放鬆呢。"
20057-50 = "那個家具，\n想在部室也放一個呢。"
20057-60 = "（打掃得很好……\n但有點可惜呢）"
20057-70 = "（這個面積……\n需要的炸藥量是……）"
20057-80 = "歡迎回來，老師。\n「課程準備」已經完成了。"
20057-90 = "今天的「課程」\n是哪個單元呢？"
20057-100 = "張弛有度的指導，\n就拜託您囉。"
20057-110 = "老師和主人，\n您喜歡哪個稱呼呢？"
20057-120 = "原來如此……\n喜歡老師啊。"
20057-130 = "我知道了，「老師」。"
20057-140 = "作為「學生」面對老師……\n有種奇妙的感覺呢。"
20057-150 = "當然，我平常也是\n老師的學生沒錯。"
20057-160 = "打掃也有分流派。"
20057-170 = "我喜好的流派\n雖然有點偏差……"
20057-180 = "呵呵。無論哪種「打掃」都是。\n我還挺執著的呢。"
20057-190 = "老師可以成為千年的\n專屬教師嗎？"
20057-200 = "那樣的話就能每天\n聽到老師的課……"
20057-210 = "「千年的老師」。\n我覺得聽起來很棒。"
20057-220 = "雖然我常常被\n評價為模範生……"
20057-230 = "但內在未必如此。"
20057-240 = "不管是誰都會有\n深藏在內心的一面。"
20057-250 = "所以……"
20057-260 = "來點師生之間\n刺激的遊戲，\n您覺得如何呢？"
20057-270 = "開玩笑的。"
20057-280 = "今天是老師的生日吧？\n我當然記得。"
20057-290 = "那麼……\n想要從哪個我\n獲得祝福呢？"
20057-300 = "學生？還是女僕？"
20057-310 = "老師，您知道今天\n是什麼日子嗎？"
20057-320 = "是的，是我的生日。"
20057-330 = "所以今天是作為\n「學生」前來的。"
20057-340 = "「女僕」不被允許的事，\n如果是學生也許可以受到寬容。"
20057-350 = "所以，作為禮物……\n我想要老師的時間。"
20057-360 = "新年快樂，老師。\n今年也請多多指教。"
20057-370 = "今天的我不是「女僕」。"
20057-380 = "生硬的問候就擺一旁……\n要不要一起去參拜呢？"
20057-390 = "是聖誕節呢。\n難道說……\n我可以期待禮物嗎？"
20057-400 = "呵呵。就算沒準備也沒關係。"
20057-410 = "只要有老師在身邊，\n對我來說就足夠了。"
20057-420 = "萬聖節……\n糖果和惡作劇\n滿滿的日子……"
20057-430 = "所以我今天烤了點心。"
20057-440 = "老師會一起吃的吧？"
20057-460 = "呵呵。"
20057-470 = "比想像中……\n還要害羞呢。"
20057-480 = "對自己坦誠……"
20057-490 = "實在是種難以習慣的感覺。"
20057-500 = "是的，就像您說的一樣。"
20057-510 = "我想這對我來說，\n是必須經歷的過程。"
20057-520 = "一直以來給老師\n添了許多麻煩。"
20057-530 = "即便如此，\n與老師相遇的我，\n果然還是──"
20057-540 = "嗯，真的很幸運。"
20057-550 = "一切都會流逝，\n總有一天都會被遺忘吧。"
20057-560 = "就連現在這個瞬間，\n總有一天也會……"
20057-570 = "不過，我會記得。"
20057-580 = "就算老師忘記了也一樣。"
20057-590 = "因為真正重要的事物，\n是絕對不會消失的。"
20057-2600 = "在奇普托斯，槍是必需品。\n不管女僕還是學生都一樣。\n在眾多的槍枝中……\n我會和老師給我的這個「打掃工具」一起，\n繼續精益求精的。"
