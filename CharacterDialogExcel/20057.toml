[translation]
20057-10 = "Blue... Archive ฮุฮุฮุ"
20057-20 = "มุโรคาสะ อาคาเนะ รหัสประจำตัวซีโร่ทรี\nจากโรงเรียนวิทย์มิลเลเนียม ขอทักทายในฐานะนักเรียนค่ะ\nฮุฮุ ถึงปกติจะเป็นนักเรียนอยู่แล้วก็เถอะค่ะ"
20057-30 = "อย่างแรกฉันอยาก\nเตรียมเค้กให้จังเลยค่ะ"
20057-40 = "เป็นสถานที่ที่\nน่าอบอุ่นใจ\nจังเลยนะคะ"
20057-50 = "อยากมีเฟอร์นิเจอร์นี้\nในห้องชมรมบ้างจังเลยค่ะ"
20057-60 = "(การทำความสะอาด\nกำลังดำเนินไปได้ด้วยดี...\nแต่น่าเสียดายที่จะจบลงนะคะ)"
20057-70 = "(ความกว้างขนาดนี้...\nต้องใช้ระเบิดมาก\nแค่ไหนนะ...)"
20057-80 = "เชิญค่ะ ฉัน 'เตรียมคลาส'\nไว้ให้เรียบร้อยแล้วค่ะ"
20057-90 = "คลาสของวันนี้\nจะสอนถึงไหนเหรอคะ?"
20057-100 = "ช่วยเล่าเรื่องสนุกๆ\nให้ฟังด้วยนะคะ"
20057-110 = "ระหว่างคุณครูกับนายท่าน\nให้ฉันเรียกว่าอะไรดีคะ?"
20057-120 = "อย่างนี้สินะคะ...\nให้เรียกว่าคุณครูสินะ"
20057-130 = "เข้าใจแล้วค่ะ 'คุณครู'"
20057-140 = "ฉันได้ปฏิบัติต่อคุณครู\nในฐานะ 'นักเรียน' สินะ...\nน่าทึ่งจังเลยนะคะ"
20057-150 = "ถึงปกติฉันก็เป็นนักเรียน\nของคุณครูอยู่แล้วก็เถอะค่ะ"
20057-160 = "การทำความสะอาด\nมีอยู่หลายวิธี"
20057-170 = "แต่ฉันมีวิธีโปรด\nของตัวเองอยู่ค่ะ"
20057-180 = "ฮุฮุ ไม่ว่าจะเป็นการทำ\nความสะอาดแง่ไหนก็ตามค่ะ\nพอดีฉันมีมุมที่ดื้ออยู่บ้างน่ะค่ะ"
20057-190 = "คุณครูมาเป็นครูประจำ\nที่มิลเลเนียม\nไม่ได้เหรอคะ?"
20057-200 = "ถ้าเป็นอย่างนั้น\nฉันน่าจะได้เข้าคลาส\nของคุณครูทุกวันเลย..."
20057-210 = "คุณครูของมิลเลเนียม\nฉันว่ามันเป็นคำที่\nเท่ดีนะคะ"
20057-220 = "ทุกคนบอกว่าฉัน\nดูเหมือนนักเรียนดีเด่น..."
20057-230 = "แต่ภายในแล้วอาจจะ\nไม่เป็นอย่างนั้นก็ได้นะคะ"
20057-240 = "ก็เราทุกคนต่างมี\nสิ่งที่ซ่อนอยู่ภายใน\nจิตใจกันทั้งนั้นนี่คะ"
20057-250 = "เพราะงั้น..."
20057-260 = "พวกเราครูกับศิษย์\nมาออกนอกลู่นอกทางกันมั้ยคะ?"
20057-270 = "ฉันล้อเล่นค่ะ"
20057-280 = "วันนี้วันเกิดคุณครูใช่มั้ยคะ?\nฉันจำได้อยู่แล้วค่ะ"
20057-290 = "ว่าแต่อยากให้ฉันอวยพร\nแบบไหนดีคะ?"
20057-300 = "ในฐานะลูกศิษย์?\nหรือเมดดีคะ?"
20057-310 = "คุณครู รู้หรือเปล่าคะ\nว่าวันนี้คือวันอะไร?"
20057-320 = "ค่ะ วันเกิดของฉันเองค่ะ"
20057-330 = "ฉันก็เลยลองถาม\nในฐานะของ 'นักเรียน' ดูน่ะค่ะ"
20057-340 = "ถ้าเป็น 'เมด' จะทำแบบนี้คงไม่เหมาะ\nแต่ถ้าเป็นนักเรียน ฉันคิดว่า\nก็น่าจะกล้าพูด... ได้นิดหน่อย..."
20057-350 = "เพราะงั้นฉันอยากได้ของขวัญ...\nเป็นเวลาจากคุณครูค่ะ"
20057-360 = "สวัสดีปีใหม่ค่ะ\nคุณครู ปีนี้ฉันก็\nขอฝากตัวด้วยนะคะ"
20057-370 = "วันนี้ฉันไม่ได้มา\nในฐานะ 'เมด'"
20057-380 = "งั้นก็ไม่ต้องทักทายให้มีพิธีรีตอง\nแล้วออกไปเดินเล่น\nด้วยกันดีกว่ามั้ยคะ?"
20057-390 = "คริสต์มาสแล้วสินะคะ ฉัน...\nตั้งตารอของขวัญได้มั้ยคะ?"
20057-400 = "ฮุฮุ ถึงจะบอกว่า\nไม่ได้เตรียมอะไรไว้\nก็ไม่เป็นไรค่ะ "
20057-410 = "แค่มีคุณครูอยู่ด้วย\nฉันก็สุขใจแล้วค่ะ"
20057-420 = "ฮาโลวีน...\nวันแห่งลูกกวาด\nกับการหลอกผีกัน..."
20057-430 = "แทนที่จะขอขนม\nวันนี้ฉันอบขนมมาให้แทนค่ะ"
20057-440 = "มาทานด้วยกันมั้ยคะ?"
20057-460 = "ฮุฮุ"
20057-470 = "เป็นเรื่องที่น่าอาย\nกว่าที่คิดอีกนะคะ"
20057-480 = "การซื่อสัตย์กับ\nความรู้สึกของตัวเอง"
20057-490 = "ทำให้เราเอง\nก็ยังต้องแปลกใจ\nอยู่เสมอเลยนะคะ"
20057-500 = "ค่ะ เป็นอย่างที่\nคุณครูว่าเลยค่ะ"
20057-510 = "แต่สำหรับฉันแล้ว\nนั่นคือสิ่งที่จำเป็นต้องทำค่ะ"
20057-520 = "ขออภัยที่รบกวน\nในหลายๆ เรื่องเลยนะคะ คุณครู"
20057-530 = "แต่ฉันก็คิดว่า\nการได้เจอคุณครู"
20057-540 = "คือโชคดีของฉัน\nจริงๆ เลยค่ะ"
20057-550 = "ทุกอย่างจะผ่านไป\nและบางอย่างจะถูกลืมค่ะ"
20057-560 = "เรื่องที่เคยเกิดขึ้นที่นี่\nก็อาจจะเป็นอย่างนั้นด้วย..."
20057-570 = "แต่ฉันจะจดจำไว้ค่ะ"
20057-580 = "ต่อให้คุณครูจะ\nบอกว่าลืมไปแล้ว"
20057-590 = "สิ่งที่ล้ำค่าจะไม่มีวัน\nเลือนหายไปแน่นอนค่ะ"
20057-2600 = "ปืนเป็นสิ่งจำเป็นในคิโวทอส\nไม่ว่าจะกับเมดหรือนักเรียนก็ตามค่ะ\nฉันจะตั้งใจทำงานไปกับ 'อุปกรณ์\nทำความสะอาด' ที่ได้จากคุณครูค่ะ"
