[translation]
10067-10-1 = "ブルーアーカイブ。"
10067-20-1 = "こんにちは、先生。トキです。\n潜入用衣装に身を包んだエージェントとしての真髄、\nお見せしましょう。"
10067-30-1 = "穏やかな\nティータイム……。\nなかなか新鮮な\n経験です。"
10067-40-1 = "ここは、心を豊かに\nしてくれますね。"
10067-50-1 = "十分な時間と\n予算があったら……\n私もこういう空間を\n作りたいです。"
10067-60-1 = "エージェントたる者、油断は\n禁物なのですが……\nここに来ると、つい気が\n緩んでしまうのです。"
10067-70-1 = "訪れるたびに、\nいろいろな事を\n考えさせてくれる場所です。\n良い意味で。"
10067-80-1 = "こんにちは、先生。"
10067-90-1 = "本日の当番は\nバニーの私です。"
10067-100-1 = "どうぞよろしくお願いします。\nぴょんぴょん。"
10067-110-1 = "おかえりなさい、先生。\nお待ちしておりました。"
10067-120-1 = "大事なことなので\nもう一度言います。"
10067-130-1 = "お待ちしておりました。\nぴょんぴょん。"
10067-140-1 = "私はウサギなので\n犬ではありませんが……"
10067-150-1 = "ここまで待てを\nされてしまいますと……。"
10067-160-1 = "いたずらをしてしまいますよ？"
10067-170-1 = "お呼びでしょうか？\nさて、何を致しましょう。"
10067-180-1 = "護衛ですか？戦闘？破壊？\n工作？それとも正義の味方？"
10067-190-1 = "ん？……\n呼んでみただけ……？"
10067-200-1 = "シャーレの業務は\n不思議ですね。"
10067-210-1 = "忙しいようで、\n忙しくないような……。"
10067-220-1 = "別に、積極的に仕事が\nしたいわけではありません。"
10067-230-1 = "私だってサボりたい\n気持ちもあります。"
10067-240-1 = "ですが……その、\n先生のお力になりたいのです。"
10067-250-1 = "先生、助けてください。\n事件が起こりました。"
10067-260-1 = "私が暇をしているという\n大事件です。"
10067-270-1 = "お誕生日\nおめでとうございます、先生。"
10067-280-1 = "ん？ええ、\n当然覚えております。 "
10067-290-1 = "優れた記憶力は\n最高のエージェントの\n条件でもありますから。"
10067-300-1 = "では、今からお祝いに\n出かけるとしましょう。"
10067-310-1 = "誕生日……\n覚えていてくださり\nありがとうございます。"
10067-320-1 = "ですが、\n今の私はエージェント。"
10067-330-1 = "お祝いもまた内密に、\n二人きりの場所で\nお願い致します。"
10067-340-1 = "年が明けましたね。\n光陰矢の如しです。"
10067-350-1 = "新年の目標は立てましたか？"
10067-360-1 = "三日坊主にならないよう\nお手伝いしましょう。"
10067-370-1 = "クリスマスですね。"
10067-380-1 = "ん？いいえ、平気です。"
10067-390-1 = "別に寒くなんか\nありません。はくしょ！"
10067-400-1 = "……見なかったことに\nしてください。ぐすん。"
10067-410-1 = "ハロウィーンですね。"
10067-420-1 = "街で私のような仮装をした\n人をよく見かける日です。"
10067-430-1 = "……みな、エージェント\n志望なのでしょうか？"
10067-450-1 = "ん……先生……？"
10067-460-1 = "どうされました……？\nそんな、おかしな\n顔をして……？"
10067-470-1 = "差し支えなければ、\nもう少し寝ても\n良いでしょうか……？"
10067-480-1 = "んん……？\nとりあえず起きてって……？"
10067-490-1 = "……嫌です。\n私はもっと寝たいです。"
10067-500-1 = "それにこのベッド……\nあったかくて、ふかふかで、\n気に入っているのです。"
10067-510-1 = "先生がなんと言おうと、\n私は寝ます……。"
10067-520-1 = "んん……眠い……。"
10067-2600-1 = "時には素直に、\nありのままの気持ちを\n伝えることも大事と聞きました。\nありがとうございます、先生。\n心から、感謝しております。"
