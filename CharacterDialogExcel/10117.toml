[translation]
10117-10-1 = "Blue Archive"
10117-20-1 = "ทาจิบานะ ฮิคาริ\nจากสถาบันการรถไฟไฮแลนเดอร์ มา แล้ว"
10117-30-1 = "ว้าว ที่นี่น่าเล่นสนุกจัง..."
10117-40-1 = "คุณครู อยู่ไหนน่ะ?"
10117-50-1 = "วันนี้ฉันจะเข้า\nโหมด โดด งาน"
10117-60-1 = "มีขนมกินมั้ย?\nน้ำผลไม้ล่ะ?"
10117-70-1 = "ไม่มีอะไรสนุกๆ\nให้ทำเลยเหรอ...?"
10117-80-1 = "คุณครู เข้ามาสิ"
10117-90-1 = "ฮิคาริกำลังรออยู่เลย"
10117-100-1 = "อ่า...\nกินขนมในห้องครัว หมด แล้ว"
10117-110-1 = "หืม? ไม่เป็นไรงั้นเหรอ?"
10117-120-1 = "คุณครู ฮิคาริเบื่อมาก\nอยากได้อะไรกระตุ้นหน่อย"
10117-130-1 = "หืม? ทำงานเอกสารอยู่...?"
10117-140-1 = "ง่า... น่า เบื่อ ที่ สุด"
10117-150-1 = "คุณครู กินขนมมั้ย?"
10117-160-1 = "อันนี้เผ็ดมากเลย..."
10117-170-1 = "ฮิคาริกินไม่ไหว\nให้คุณครูแล้วกัน"
10117-180-1 = "คุณครู เอกสารนี้\nเดี๋ยวฮิคาริจัดการให้นะ"
10117-190-1 = "ทำได้อยู่แล้ว ก็เวรฮิคารินี่"
10117-200-1 = "......\n...... (สัปหงก)\nอ๊ะ เผลอหลับไปเลย"
10117-210-1 = "คุณครู ขอไปนอน\nบนตักได้มั้ย?"
10117-220-1 = "จะไปก่อนได้รับอนุญาตละนะ\nนี่ละทาจิบานะ ฮิคาริ"
10117-230-1 = "ดูนี่สิ คุณครู\nวิธีทำเงามือให้เป็นลูกสุนัข"
10117-240-1 = "โอ้ว...? นั่นนกอินทรีเหรอ?\nอย่างอื่นก็ทำได้เหรอ?"
10117-250-1 = "พนักงานรถไฟชาเล่ต์\nทราบแล้วเปลี่ยน\nท้าดา!"
10117-260-1 = "วันนี้วันเกิดคุณครู\nสุขสันต์วันเกิดนะ\nมากินเค้กกันเถอะ"
10117-270-1 = "คำถาม วันนี้วันอะไร?"
10117-280-1 = "ขอตอบ วันเกิดฮิคาริกับโนโซมิ"
10117-290-1 = "ขอของขวัญด้วยค่ะ จะให้อะไรก็ได้"
10117-300-1 = "ปณิธานของปีนี้\nต้องกินขนม ให้ น้อย ลง...!"
10117-310-1 = "อืม... ค่อยเริ่มทำปีหน้าดีกว่า..."
10117-320-1 = "คุณครู ปีนี้ร้องบ้างหรือเปล่า?\nฮิคาริไม่ร้องเลย\nฮึบไว้น่ะ"
10117-330-1 = "เป็นเด็กดีจะได้ของขวัญใช่มั้ย?"
10117-340-1 = "ทริก ออร์ ทรีต?"
10117-350-1 = "อืม แค่พูดตามใจไปงั้นน่ะ\nขอลูกอมหน่อยค่ะ"
10117-370-1 = "ตรงนี้ ตรงนี้"
10117-380-1 = "อื้อ~... ปวดฟัน\nซี่ข้างใน\nคุณครู เห็นหรือเปล่า?"
10117-390-1 = "ฟันกรามทางขวาน่ะ"
10117-400-1 = "ฮือ ตรงนั้นมัน...\nปวดจี๊ดๆ"
10117-410-1 = "แง ทำยังไงดี\nฮิคาริต้องยกธงขาวเหรอ?\nช่วยด้วย คุณครู"
10117-2600-1 = "อันนี้ให้ฮิคาริเหรอ?\nขอบคุณนะ ไว้โตแล้ว\nฉันจะมาปกป้องคุณครูนะ"
