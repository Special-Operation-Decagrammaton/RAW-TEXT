[translation]
10117-10-1 = "ブルーアーカイブー。"
10117-20-1 = "ハイランダー鉄道がくえーん\n橘ヒカリ……さんじょー。"
10117-30-1 = "うぉー、いっぱい\n遊べそう……"
10117-40-1 = "せんせーどこー。"
10117-50-1 = "今日はおサボリデーに決定ー。"
10117-60-1 = "お菓子ないのー？\nジュースは？"
10117-70-1 = "面白いことなーいー？"
10117-80-1 = "先生ーいらっしゃーい。"
10117-90-1 = "待ってたよー"
10117-100-1 = "あー……\n給湯室のお菓子、\nなくなっちゃったー"
10117-110-1 = "ん？いいのー？"
10117-120-1 = "こちらヒカリー\n暇をもてあましていますー\nどうぞー"
10117-130-1 = "えー事務作業ー？"
10117-140-1 = "ぶーつまんなーい。"
10117-150-1 = "せんせーお菓子いるー？"
10117-160-1 = "はい、激辛ー"
10117-170-1 = "ヒカリには\n無理だったからあげるー"
10117-180-1 = "これはヒカリがやっとくねー"
10117-190-1 = "できるよー？当番だし？"
10117-200-1 = "……\n……（コクン）\nんんっ、ねてたー。"
10117-210-1 = "せんせー、膝の上いいー？"
10117-220-1 = "返事は待たずに動くー\nそれが橘ヒカリー。"
10117-230-1 = "見て見てせんせー。\nかげえのわんちゃんー"
10117-240-1 = "……おー？それ、わし？\nほかはー？"
10117-250-1 = "シャーレ乗務員、応答ねがうー\nじゃーん！"
10117-260-1 = "今日は先生のお誕生日ー。\nおめでとー。\nケーキ一緒に食べよー。"
10117-270-1 = "クイズー、\n今日は何の日でしょー？"
10117-280-1 = "正解ー、ヒカリと\nノゾミの誕生日ー。"
10117-290-1 = "プレゼント求むー何でも歓迎ー。"
10117-300-1 = "今年の抱負がきまったのだー。\nお菓子の量を……へらす……！"
10117-310-1 = "……んーやっぱり来年頑張るー。"
10117-320-1 = "先生は今年泣いたー？\nヒカリは泣いてないよー\n我慢したー。"
10117-330-1 = "だからプレゼント\nもらえるかなー？\nいいこにしてたのだ。"
10117-340-1 = "トリックーオアートレーイン。"
10117-350-1 = "うんーテキトーに言っただけー。\nお菓子ちょうだいー"
10117-370-1 = "ここ、ここー……"
10117-380-1 = "そ～……おくのほ～\nはがーいたいー\nせんせー、みえるー？"
10117-390-1 = "みぎのおくばがねーいたいのー"
10117-400-1 = "うう、そこ……\nズキズキー。"
10117-410-1 = "えーどうすればいいのー\nヒカリ死亡フラグー？\nたすけてーせんせー……。"
10117-2600-1 = "くれるのー？\nありがとー。代わりに、\n先生の事まもってあげるー"
