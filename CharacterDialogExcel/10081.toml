[translation]
10081-10-1 = "Bluuuue Archive!"
10081-20-1 = "I'm Kadenokouji Yukari! As a proud member of the Hyakkaryouran, I'll do my utmost to live up to my duty, Sensei!"
10081-30-1 = "Ahem. So, this is Schale? It's very charming!"
10081-40-1 = "I had to wake up really early to catch the train this morning. So sleepy... *yawn*"
10081-50-1 = "(There's an ominous presence here... Could Schale be a sanctuary for evil demons?!)"
10081-60-1 = "Hup! As a member of Hyakkaryouran, I want to set a good example for the other students."
10081-70-1 = "Hm, hmm. Here I come! ♪"
10081-80-1 = "Heehee. Welcome, Sensei! Time to work!"
10081-90-1 = "Here, this way! Please sit down!"
10081-100-1 = "Yes! I've been waiting for this moment!"
10081-110-1 = "Welcome, Sensei. Let's do our best today!"
10081-120-1 = "Hm, hmm. I see. This is a typical work day at Schale. I'm learning so much!"
10081-130-1 = "It's not easy to work at the Hyakkaryouran. I mean, it's hard here too, but..."
10081-140-1 = "It's all going to work out perfectly! Yes! Because I'm an elite member of the Hyakkaryouran!"
10081-150-1 = "Hm, hmm. The invincible Hyakkaryouran! This is only the beginning of the legend of Yukari! ♪"
10081-160-1 = "Yes, Sensei! Please don't hesitate to ask me for anything you need!"
10081-170-1 = "So, what should we do after work today?"
10081-180-1 = "Should we go get some junk food? Or break someone's high score at the arcade?"
10081-190-1 = "Hm, so many options... How do we choose?"
10081-200-1 = "Happy birthday! You must be so excited, Sensei"
10081-210-1 = "I'm so excited to celebrate your special day together! I, Kadenokouji Yukari, will make sure you have the best birthday ever!"
10081-220-1 = "All right! Let's start with working on your wish list!"
10081-230-1 = "...Huh? You just want to...make memories...with me...?"
10081-240-1 = "Ugh... That's a much more difficult request..."
10081-250-1 = "I-I do like the idea of that though..."
10081-260-1 = "Oh! Um... Y-You remembered my birthday? Wow... Hearing your birthday wishes..."
10081-270-1 = "Oh, geez... Um. I can't stop smiling."
10081-280-1 = "Happiness isn't always a far-off dream, I guess..."
10081-290-1 = "Happy New Year! I wish you all the best in the new year, Sensei!"
10081-300-1 = "I'm sure I'm not the only one who's super excited about the new year!"
10081-310-1 = "Um, to make sure nothing bad happens... Let's go on a patrol again tonight!"
10081-320-1 = "Merry Christmas, Sensei!"
10081-330-1 = "I've already invited Renge, Kikyou, and Nagusa!"
10081-340-1 = "I hope you'll come and enjoy some red bean jelly at the Hyakkaryouran!"
10081-350-1 = "Heehee! It'll be lots of fun! I promise!"
10081-360-1 = "Ack! I went outside, and it was shocking!"
10081-370-1 = "The streets are filled with goblins! What in the world is happening?!"
10081-380-1 = "...Huh? It's Halloween? People just dress up as monsters today?"
10081-390-1 = "You're joking! It's not Setsubun yet! You tried to trick me. How cute!"
10081-410-1 = "Heehee, here! I'm here, Sensei."
10081-420-1 = "It's okay. I didn't wait long at all."
10081-430-1 = "It's my fault for getting here an hour early."
10081-440-1 = "Ah, there's no special reason. It's just..."
10081-450-1 = "Where will we go today? What are we going to do? What new thing will I learn from you?"
10081-460-1 = "I had all of those thoughts running through my head, and I couldn't wait for another moment."
10081-470-1 = "You don't need to worry. I actually enjoy waiting."
10081-480-1 = "In fact, it makes finally being with you even better."
10081-490-1 = "All right then, there's no time for us to waste!"
10081-500-1 = "Heehee. Please, show me more of this beautiful world, Sensei!"
10081-2600-1 = "Huh? Is this for me...? A symbol of trust?! I have to work hard to be legendary enough to meet your expectations!"
