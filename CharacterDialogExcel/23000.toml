[translation]
23000-20-1 = "お会いできて嬉しいです、先生～\n先生はどんなアイスが好きですか？"
23000-30-1 = "んー、\n何を食べようかな…。"
23000-40-1 = "今日もやっぱり\nいちご＆ミント～"
23000-50-1 = "アイス、アイス～\nアイスクリーム～"
23000-60-1 = "放課後には\nやっぱりスイーツ！"
23000-70-1 = "いちごとミントは最高！"
23000-80-1 = "先生～、お帰りなさい。\n今日も一緒にスイーツ\n食べに行きますよね？"
23000-90-1 = "先生、遅いですよ～"
23000-100-1 = "一緒にアイス買いに\n行きましょう！"
23000-110-1 = "ルンルン～\n甘いの大好き～"
23000-120-1 = "先生もアイスクリーム\n好きですよね？ね？"
23000-130-1 = "放課後は\nスイーツタイム～"
23000-140-1 = "おいしいスイーツのため～\n今日も一緒に、\n頑張りましょう！"
23000-150-1 = "ん？\n先生。何か悩みが\nありそうな顔ですね。"
23000-160-1 = "そういう時は、さあさあ！\n美味しいスイーツを食べに！\n一緒に行きましょう！"
23000-170-1 = "先生！お誕生日\nおめでとうございます！"
23000-180-1 = "私が特別に！おいしい\nスイーツ屋さんを\n予約しておきましたよ！"
23000-190-1 = "さあさあ、急いで！先生！"
23000-200-1 = "先生～ 今日は\n私の誕生日です！\n一緒にアイス食べに\n行きましょう！"
23000-210-1 = "ん？\nプレゼントですか？"
23000-220-1 = "大丈夫ですよ～\n先生が私の\nプレゼントですから！"
23000-230-1 = "先生～明けまして\nおめでとうございます～"
23000-240-1 = "今年も美味しい\nスイーツのため！\n一緒に頑張りましょう！"
23000-250-1 = "わーい、先生～！\nクリスマスですよ！"
23000-260-1 = "こういう日にはやっぱり\nアイスが似合いますよね！\n一緒に買いに行きましょうか？"
23000-270-1 = "えへへっ、今日は\nハロウィーンですね。"
23000-280-1 = "一緒にお化けの\nコスプレして\n甘いものを貰いに\n行ってみましょうか？"
23000-290-1 = "Trick or Treat～"
23000-310-1 = "私の分も買っていただいて\nありがとうございます、先生。"
23000-320-1 = "あ、甘くて美味しいです！"
23000-330-1 = "カフェではなく、外で食べる\nアイスクリームって\nすごく久しぶりな気がします。"
23000-340-1 = "それに、先生と一緒ですし。\nえへへっ。"
23000-350-1 = "い、いえ、\n全然そんなことは。"
23000-360-1 = "むしろ懐かしくて、\n嬉しいです。"
23000-370-1 = "嬉しいですし、その…。"
23000-380-1 = "何と言えばいいんでしょう、\n周りに人も少ないですし…。"
23000-390-1 = "すごく、\nドキドキすると\n言いますか…。"
23000-400-1 = "…な、なっ、\nなんでもありません！"
23000-410-1 = "今のは忘れてください！"
23000-420-1 = "はは、あはは…。"
23000-430-1 = "…ありがとう\nございます、先生。"
23000-440-1 = "今日も先生のおかげで、\nもうすでに幸せな\n一日になりました。"
23000-2600-1 = "……この武器は……。\nありがとうございます。先生。\n強くなるのは、少し怖いことですが……。\n先生と一緒なら、大丈夫です！"
