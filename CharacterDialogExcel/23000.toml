[translation]
23000-20-1 = "ยินดีต้อนรับค่ะ คุณครู\nคุณครูชอบไอศกรีมแบบไหนเหรอคะ?"
23000-30-1 = "อืม... กินอะไรดีน้า..."
23000-40-1 = "วันนี้ฉันก็...\nรสมินต์กับสตรอว์เบอร์รี่\nแล้วกัน~"
23000-50-1 = "ไอศกรีม~\nไอศกรีม~"
23000-60-1 = "หลังเลิกเรียน\nก็ต้องเป็นของหวานสิคะ!"
23000-70-1 = "มินต์กับสตรอว์เบอร์รี่น่ะ\nสุดยอดไปเลย!"
23000-80-1 = "คุณครู~ มาแล้วเหรอคะ?\nวันนี้ก็จะไปกินของหวาน\nด้วยกันอีกใช่มั้ยคะ?"
23000-90-1 = "คุณครู มาช้านะคะ~"
23000-100-1 = "ไปซื้อไอศกรีม\nด้วยกันเถอะค่ะ!"
23000-110-1 = "อื้มมม~\nฉันชอบของหวานๆ ที่สุดเลย~"
23000-120-1 = "คุณครูก็ชอบทานไอศกรีมเหมือนกัน\nใช่มั้ยคะ? ใช่หรือเปล่าคะ?"
23000-130-1 = "หลังเลิกเรียน\nก็ได้เวลาของหวานแล้ว~"
23000-140-1 = "เพื่อขนมหวานแสนอร่อย~\nวันนี้ก็มาพยายามไปด้วยกันนะคะ!"
23000-150-1 = "หือ? คุณครูคะ\nสีหน้าคุณครู... ดูเหมือน\nกังวลอะไรบางอย่างเลยนะคะ"
23000-160-1 = "เวลาแบบนี้ ดีล่ะ!\nไปกินขนมหวาน\nด้วยกันนะคะ!"
23000-170-1 = "คุณครู!\nสุขสันต์วันเกิดค่ะ!"
23000-180-1 = "วันนี้ฉันจองร้านขนมหวาน...\nร้านพิเศษเอาไว้แล้วนะคะ!"
23000-190-1 = "รีบไปกันเถอะค่ะ! คุณครู!"
23000-200-1 = "คุณครูขา~\nวันนี้เป็นวันเกิดของฉันค่ะ!\nไปกินไอศกรีมด้วยกันเถอะนะคะ!"
23000-210-1 = "หืม? ทำไมน่ะเหรอคะ?"
23000-220-1 = "ไม่เป็นไรหรอกค่ะ~\nคุณครูคือของขวัญของฉันยังไงล่ะคะ!"
23000-230-1 = "คุณครู~\nขอให้มีความสุขมากๆ ในวันปีใหม่นะคะ"
23000-240-1 = "วันนี้เราก็มาพยายาม~\nสู้ๆ ไปด้วยกันนะคะ~"
23000-250-1 = "ว้าว คุณครูคะ~!\nวันคริสต์มาสค่ะ!"
23000-260-1 = "ในวันแบบนี้...\nไอศกรีมเหมาะที่สุดแล้วค่ะ!\nไปด้วยกันมั้ยคะ?"
23000-270-1 = "ฮิฮิ\nวันนี้คือวันฮาโลวีนค่ะ"
23000-280-1 = "เรามาแต่งตัวเป็นผีแล้วออกไป\nรับขนมหวานด้วยกันมั้ยคะ?"
23000-290-1 = "ทริก ออร์ ทรีต~"
23000-310-1 = "ขอบคุณที่เลี้ยงไอศกรีมฉันนะคะ\nคุณครู"
23000-320-1 = "มัน... หวานอร่อยดีจังเลยค่ะ!"
23000-330-1 = "ฉันไม่ได้กินไอศกรีม\nที่ขายข้างนอกคาเฟ่แบบนี้\nมานานมากๆ แล้วค่ะ"
23000-340-1 = "แถมยังได้นั่งกินไอศกรีม\nกับคุณครูแบบนี้ด้วย ฮิฮิ..."
23000-350-1 = "มะ...ไม่เลยค่ะ\nไม่เป็นไรจริงๆ ค่ะ"
23000-360-1 = "ฉันกลับ...รู้สึกคิดถึงบรรยากาศ\nและความสุขแบบนี้ซะอีกค่ะ"
23000-370-1 = "มันทั้งสนุก...แล้วก็..."
23000-380-1 = "จะว่ายังไงดีนะ...\nคนที่อยู่แถวๆ นี้ก็ไม่เยอะด้วย..."
23000-390-1 = "จะบอกว่า...\nตื่นเต้นได้มั้ยนะ"
23000-400-1 = "มะ... มะ... ไม่มีอะไรค่ะ!"
23000-410-1 = "ช่วยลืมที่ฉันพูดไปเมื่อกี้ทีนะคะ!"
23000-420-1 = "แหะๆ ฮ่าๆๆๆ..."
23000-430-1 = "ขอบคุณนะคะ คุณครู"
23000-440-1 = "วันนี้คุณครูทำให้ฉัน\nมีความสุขมากเลยละค่ะ"
23000-2600-1 = "...อะ...อาวุธนี่...\nขอบคุณนะคะคุณครู\nถึงฉันจะกลัวการแข็งแกร่งขึ้น...\nแต่ถ้าอยู่กับคุณครูละก็\nฉันก็ไม่กลัวค่ะ!"
