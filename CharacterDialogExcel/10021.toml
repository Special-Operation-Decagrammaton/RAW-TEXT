[translation]
10021-10-1 = "Blue Archive"
10021-20-1 = "ชิราสึ อาซึสะ มาถึงพื้นที่เป้าหมายแล้ว\nและตรงไปยังเป้าหมายต่อไปทันที\n...ฉันไม่ได้ตื่นเต้นอะไรสักหน่อย"
10021-30-1 = "ที่นี่ก็สะดวกสบายอยู่\nไม่แย่เท่าไร"
10021-40-1 = "ไม่รู้ทำไม...\nเหมือนรู้สึกว่ามีใครจ้องอยู่เลย..."
10021-50-1 = "ฮุฮุ..."
10021-60-1 = "นี่ก็น่ารักไม่ใช่เล่น..."
10021-70-1 = "ฉันอาจจะ\nแค่เหนื่อยนิดหน่อยน่ะ..."
10021-80-1 = "กำลังรออยู่เลยละคุณครู\nรีบไปกันเถอะ\nภารกิจต่อไปคืออะไรเหรอ?"
10021-90-1 = "แบบนี้...\nถ้าเป็นแบบนี้ต่อไป..."
10021-100-1 = "...อืม?\nมะ... มาตั้งแต่เมื่อไรน่ะ?"
10021-110-1 = "ทำไมคุณครู...\nถึงจ้องตาเป็นมันแบบนั้นล่ะ?"
10021-120-1 = "วะ...ว่าแล้วเชียว\nเสื้อตัวนี้...\nมันเด่นไปหรือเปล่า?"
10021-130-1 = "ที่จริงแล้วตัวฉันเอง\nไม่มีความสามารถ\nในการตัดสินใจหรอก"
10021-140-1 = "ตัวฉันในตอนนี้...\nเป็นยังไงนะ..."
10021-150-1 = "คือ...\nถ้าคุณครูบอกว่าดีละก็\nฉันจะเชื่อคุณครูก็แล้วกัน"
10021-160-1 = "หืม?\nฉันทำอะไรอยู่งั้นเหรอ?"
10021-170-1 = "ฉันไม่ได้ทำอะไร\nเป็นพิเศษหรอก"
10021-180-1 = "แล้วก็...\nฉันชอบมากเลยละ"
10021-190-1 = "ถ้าได้อยู่กับคุณครู\nก็จะได้มีประสบการณ์เรื่องใหม่ๆ\nหลายๆ อย่างเลยสินะ"
10021-200-1 = "ของพวกนี้น่ะ ถ้าเป็นเมื่อก่อน...\nฉันคงไม่เคยคิดถึงเรื่องพวกนี้แน่ๆ"
10021-210-1 = "ชุดนี่ไม่ได้ช่วยในการพรางตัว\nหรือการป้องกันตัวเลยสักนิดเดียวนะ"
10021-220-1 = "หืม...?\nทำให้ฉันแข็งแรงขึ้นงั้นเหรอ?\n...หมายความว่ายังไงน่ะ? "
10021-230-1 = "สุขสันต์วันเกิดนะ คุณครู"
10021-240-1 = "ไม่อยากเชื่อเลยว่าฉันจะ\nพูดคำคำนี้ออกไปได้แบบสบายๆ"
10021-250-1 = "ดีใจจังเลย..."
10021-260-1 = "อืม...?\nสุขสันต์วันเกิด...?"
10021-270-1 = "อืม... \nขอบคุณนะคุณครู"
10021-280-1 = "ผ่านไปด้วยดีอีกหนึ่งปีแล้วสินะ\nฤดูร้อนครั้งนี้..."
10021-290-1 = "ปะ...เปล่านะ ฉันไม่ได้\nตั้งตารออะไรสักหน่อย"
10021-300-1 = "ฉันคิดว่าชุดนี้\nไม่เหมาะกับฉันเลย..."
10021-310-1 = "...แบบนี้ดีกว่างั้นเหรอ?"
10021-320-1 = "ฉันไม่เข้าใจความหมายหรอก..."
10021-330-1 = "ก็นะ... มันเป็นวันที่ทุกคน\nจะใส่เสื้อผ้าที่ดูสวยๆ นี่นา"
10021-340-1 = "ฉันเอง... แค่เท่านี้...\nก็คิดว่าโอเคแล้วละ"
10021-360-1 = "ว้าว..."
10021-370-1 = "ฉันเพิ่งเคยเห็นเลย\nที่ที่เป็นประกาย\nและสวยแบบนี้ วิเศษไปเลย"
10021-380-1 = "ฉันมองเห็นทุกอย่างได้...\nโดยไม่มีอะไรมาขวางเลย..."
10021-390-1 = "มันรู้สึก...\nน่าแปลกใจจริงๆ นะ.."
10021-400-1 = "ที่จริง...\nฉันไม่ค่อยชอบ\nพื้นที่เปิดโล่งแบบนี้เท่าไร"
10021-410-1 = "ไม่มีสถานที่ให้ซ่อนตัว...\nแถมเฝ้าระวังบริเวณรอบๆ ก็ยาก"
10021-420-1 = "แต่ว่าตอนนี้...\nฉันไม่ได้กังวลเรื่องพวกนั้นเลย"
10021-430-1 = "คงเป็นเพราะ...\nแบบนี้... อืม..."
10021-440-1 = "เพราะตอนนี้ฉันมองเห็น\nทุกอย่างได้เต็มสองตาไงล่ะ"
10021-450-1 = "แล้วก็เพราะมีคุณครู\nอยู่ด้วย..."
10021-2600-1 = "นี่ละที่ฉันต้องการ\nขอบคุณนะ ฉันจะไม่ทำให้ผิดหวังแน่นอน"
