10120-80-1 = "Welcome to the stage!"
10120-90-1 = "Heehee... That was a joke. Unless you'd like to hear me play?"
10120-91-1 = "So, my fans have arrived."
10120-92-1 = "The entry fee? Oh, uh... Maybe a banana chocolate tart? "
10120-100-1 = "You're here, Sensei! Would you like some candy?"
