10120-160-1 = "Would you like some sweets?"
10120-170-1 = "Today is my big debut!"
10120-180-1 = "You cleared your schedule, right, Sensei?"
10120-190-1 = "Happy New Year, Sensei."
10120-200-1 = "I plan on hitting the drum instead of the bell this year. What do you think?"
