[translation]
10120-10-1 = "ブルー……アーカイブ！"
10120-20-1 = "やあやあ、先生。\n私のステージへようこそ。\n……このリズムについて来れるかな？"
10120-30-1 = "美しい響きが\n奏でられそうな\n場所だ。"
10120-40-1 = "私の演奏を\n披露するときが……\nついに！"
10120-50-1 = "どこにドラムを\n置こう……。"
10120-60-1 = "甘いもの……\nどこだ……！"
10120-70-1 = "先生も\n来るのだろうか……。"
10120-80-1 = "我がステージへようこそ！"
10120-90-1 = "にひ、なーんてね。\nせっかくだし、\nセッションでもしてみる？"
10120-91-1 = "来たか、オーディエンスよ！"
10120-92-1 = "さあ、\n此度のチケット代を……えっと、\nチョコバナナタルトでどう？"
10120-100-1 = "おかえり、先生。\nキャンディー食べる？"
10120-110-1 = "キャンディは素敵だよねぇ。\nこのまま練習できるし。"
10120-120-1 = "ここで練習したら、\n先生の眠気覚ましに\n貢献できたり……する？"
10120-130-1 = "何故だろう……\n旋律が甘く感じられるのは。"
10120-140-1 = "もっとロックな飾り付けを\nしたいんだけど\n手伝ってくれる～？"
10120-150-1 = "ハッピーバースデー、\nだね。先生。"
10120-160-1 = "食べたいスイーツとかある？"
10120-170-1 = "今日は、この私が\n世にデビューした日……！"
10120-180-1 = "ところで、予定は\n空いてるのだよね、先生？"
10120-190-1 = "あけましておめでとう、先生。"
10120-200-1 = "ドラムで煩悩を\nかき消してみようかなって\n思うんだけど、一緒にどう？"
10120-210-1 = "煙突の上にキャンディーを\n置いておかないと……"
10120-220-1 = "そうすれば、サンタさんも\nきっと見つけてくれる！"
10120-230-1 = "タダでスイーツを\nもらえるだなんて。"
10120-240-1 = "ほっんとう、\n素敵な日だよね、先生。"
10120-260-1 = "こ、こっち……\nこっちだ……せんせ……。"
10120-270-1 = "うう……\nドラムセットの中に……\nいるんだ……"
10120-280-1 = "黒くてカサカサ動く……\nあいつが。"
10120-290-1 = "いくら探しても\n見つからなくてぇ……。"
10120-300-1 = "な、何を言ってるのだ、\n先生！？"
10120-310-1 = "キヴォトスで\nアレを怖がらない\n女子高生なんて\nいないんだよ！？"
10120-320-1 = "銃弾なんかより\nよっぽど怖いんだよぉ！？"
10120-330-1 = "うぅ、このままでは……"
10120-340-1 = "せっかく手に入れた\n限定マカダミアクッキーが、"
10120-350-1 = "餌食になってしまう……"
10120-360-1 = "だからお願い、先生……"
10120-370-1 = "助けてぇ……。"
10120-2600-1 = "おぉー……まるで指先と\n一心同体のスティックを手に\n入れたような気持ち……。\n先生のセンスに\n惚れ惚れしてしまうな。"
