[translation]
26008-10-1 = "Blue Archive!"
26008-20-1 = "The Beach Shack represents summer! The Festival Operations Department never stops working, even overseas! Kawawa Shizuko is on it!"
26008-30-1 = "What would be good as a main summer product...?"
26008-40-1 = "Operating a franchise is so hard. It's just meeting after meeting..."
26008-50-1 = "I have a feeling it could be used for the next festival..."
26008-60-1 = "I want to make Momoyodou home to the best tea house in Kivotos!"
26008-70-1 = "I have a great idea! Yeah!"
26008-80-1 = "Oh, Sensei. Welcome! It's hot today."
26008-90-1 = "Here, have a drink!"
26008-100-1 = "...Yeah, it was flowing well."
26008-110-1 = "*sigh* It's so hot..."
26008-120-1 = "You're here, Sensei! I've been waiting for you!"
26008-130-1 = "When I'm at the Beach Shack, can you please come see me there?"
26008-140-1 = "Momoyodou will always be with you!"
26008-150-1 = "That's a good phrase, right?"
26008-160-1 = "Huh? You think this swimsuit is cute? It looks good on me?"
26008-170-1 = "Again... You're paying lip service because I'm the owner of Momoyodou..."
26008-180-1 = "What? Really? You're being serious?"
26008-190-1 = "S-Seriously, don't act like you mean that at a time like this!"
26008-200-1 = "Is it hard to manage multiple shops?"
26008-210-1 = "Umm, well, yeah. I guess."
26008-220-1 = "...If I said it was hard, would you help me?"
26008-230-1 = "When I'm with you, I feel like I'm at a summer festival."
26008-240-1 = "...Heehee, if you're not sure, you don't need to know yet."
26008-250-1 = "Happy birthday, Sensei!"
26008-260-1 = "Just in time, the Momoyodou summer house released a special limited birthday menu. What do you think?"
26008-270-1 = "So...it's exclusively for you, Sensei?"
26008-280-1 = "My birthday...? Ugh... You got me. I lowered my guard..."
26008-290-1 = "Huh? Oh, don't worry. It's not that I don't like it!"
26008-300-1 = "...Heehee, heehee."
26008-310-1 = "Happy New Year! Time flies. I feel like summer was just yesterday..."
26008-320-1 = "Great! Anyway, let's keep moving forward this new year!"
26008-330-1 = "Momoyodou for summer! Momoyodou for Christmas! The festival must go on all year around!"
26008-340-1 = "So, let's go! Sensei!"
26008-350-1 = "Trick or treat!"
26008-360-1 = "...I-I'm just kidding! You don't have to get me anything!"
26008-370-1 = "W-Well, either way, I'll be grateful..."
26008-390-1 = "Sensei. I...know what I have to do now."
26008-400-1 = "Come to think of it, it's pretty obvious. I can't believe I just realized...it was due to my negligence!"
26008-410-1 = "You may already know, but I'm really ambitious!"
26008-420-1 = "There are a lot of things I want to do and have. I can't give up any of them."
26008-430-1 = "I want to make everyone happy and become a successful businesswoman!"
26008-440-1 = "I want to make Momoyodou home to the best tea house in Kivotos!"
26008-450-1 = "I don't want to miss out on anything!"
26008-460-1 = "Of course...that includes you!"
26008-2600-1 = "You're always so considerate of me... Thank you, Sensei. As long as you're here, Momoyodou will keep evolving! Did that sound cool?"
