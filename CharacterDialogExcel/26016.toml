[translation]
26016-10 = "블루~! 아카이, 브!"
26016-20 = "푸른 하늘, 드넓은 바다, 반짝이는 여름의 태양……\n한여름의 꿈이 여기에!\n특종이 있는곳에 제가 있다, 입니다!"
26016-30 = "치아키 레이더, 온!\n자아, 무슨 이야기를\n하고 있으려나~!"
26016-40 = "오오-!\n이건 게헨나에서도\n보기 힘드네요……!"
26016-50 = "모토미야입니다!\n황송합니다!\n인터뷰\n실례하겠습니다!"
26016-60 = "저 동아리,\n신경쓰이네요……\n체험 입부\n가능할까요?"
26016-70 = "(대체, 무슨\n사이일까……?)"
26016-80 = "어서오세요, 선생님!"
26016-90 = "뭔가 재미있는 일, 있으셨나요?"
26016-100 = "일간 치아키가 왔습니다아-!"
26016-110 = "자, 여기요!"
26016-120 = "자리, 뎁혀뒀어요!"
26016-130 = "자자, 앉아요 앉아!"
26016-140 = "쓰레기통, 비워드릴게요."
26016-150 = "신경쓰지 마세요!\n이것도 취재의 일환이니까요!"
26016-160 = "뭔-가 의욕이 안 생기네요……."
26016-170 = "뭔가 재미있는 소재,\n뚝 떨어지지 않으려나-?"
26016-180 = "비장의 소재,\n교환하지 않으실래요?"
26016-190 = "비밀을 서로 교환한다던지……\n어때요?"
26016-200 = "선생님의 책상,\n수색 개시!"
26016-210 = "오늘은 선생님의 생일!"
26016-220 = "축하합니다!\n짝짝짝-!"
26016-230 = "어때요?\n저와 함께 보내는 생일은?\n즐거우신가요?"
26016-240 = "네에, 웃어요! 에헤헷-!"
26016-250 = "오늘이 무슨날 이냐구요?"
26016-260 = "으음- 뭐 있었던가-?"
26016-270 = "아앗!!\n설마, 기사 마감일?!"
26016-280 = "아아, 제 생일이라구요.\n다행이다……."
26016-290 = "물론 그건 알고 있어요!"
26016-300 = "그래서 여기 온거라구요?\n힛히-"
26016-310 = "새해 복 많이 받으세요!"
26016-320 = "올 해도 여러 소재,\n기대하고 있을게요!"
26016-330 = "착한 아이로 있었는지,\n밀착취재입니다!"
26016-340 = "해피 할로윈!"
26016-350 = "오늘은 어떤 소재가\n생길까요~!"
26016-360 = "그럼, 할로윈 현장으로~!"
26016-380 = "후훗! 빈틈 발견!\n셔터찬스!"
26016-390 = "아핫! 선생님,\n작게 웅크려선……."
26016-400 = "이건 표지에\n딱 막는 구도네요!"
26016-410 = "훗후웅!\n특종감이 없으면\n만들면 되는 법!"
26016-420 = "칫칫칫칫치-!\n순진하시군요!"
26016-430 = "떨어뜨린건\n이 병뚜껑 이랍니다!"
26016-440 = "말 그대로,\n동전 한 닢 안 쓰고\n귀한 장면을 연출했네요!"
26016-450 = "재미없는 선생님은 \n'테이블 밑에 가두기형'에\n처합니다!"
26016-460 = "좀 더 재미있는 비밀을\n알려주시면 풀어드릴지도오-?"
26016-470 = "응? 괜찮으세요?\n눈도 피하시고……."
26016-480 = "아직 인터뷰 중이에요!\n제대로 여기 봐 주셔야죠!"
26016-490 = "왜 여기 봐주지\n않으시는 거에요오?"
26016-500 = "앗, 이거……!"
26016-510 = "꺄아아앗!"
26016-520 = "보! 보면 안돼요!"
26016-530 = "나오면 안 돼!\n가만히 있어요!"
26016-2600 = "펜은 총보다 강해요!\n……뭐, 이건 펜보다 강하지만요!"
