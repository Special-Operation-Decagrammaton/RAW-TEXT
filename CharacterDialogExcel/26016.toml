[translation]
26016-10 = "ブル～！アーカイ、ブ！"
26016-20 = "青い空、広い海、眩しい常夏の太陽……\nひと夏の夢がここにある！\n特ダネのあるところに私あり、です！"
26016-30 = "チアキレーダー、オン！\nさ～て、何を話して\nいるのかな～！"
26016-40 = "おお～！\nこれはゲヘナでも\n中々見ない光景……！"
26016-50 = "元宮です！恐縮です！\nインタビュー\n失礼します！"
26016-60 = "あの部活、\n気になる……\n体験入部\nできますかね？"
26016-70 = "（いったい、どういう\n関係なんだろ……？）"
26016-80 = "おかえりなさい、先生！"
26016-90 = "何か面白いことありました？"
26016-100 = "日刊チアキのお届けでーす！"
26016-110 = "はい、どうぞ！"
26016-120 = "お席、温めておきましたよ！"
26016-130 = "さあさあ、座って座って！"
26016-140 = "ゴミ箱、袋替えておきますね。"
26016-150 = "お気になさらず！\nこれも取材の一環ですので！"
26016-160 = "なーんかやる気がでません……"
26016-170 = "どこかに面白いネタ、\n落ちてませんかね～？"
26016-180 = "とっておきのネタ、\n交換しませんか？"
26016-190 = "秘密を言い合うんです……\nどうでしょう？"
26016-200 = "先生の机、\n拝見しちゃいます！"
26016-210 = "今日は先生のお誕生日！"
26016-220 = "おめでとうございます！\nパチパチパチー！"
26016-230 = "どうです？\n私と過ごす誕生日は？\n楽しいですか？"
26016-240 = "はい、笑って！えへへっ！"
26016-250 = "今日は何の日って……。"
26016-260 = "う～ん、\n何かありましたっけ～？"
26016-270 = "はっ！\nまさか、原稿の締切！？"
26016-280 = "ああ、私の誕生日でしたか。\nよかった……。"
26016-290 = "もちろん覚えてますよ！"
26016-300 = "だからここに\n来ているんですし？\nにひ。"
26016-310 = "あけまして\nおめでとうございます！"
26016-320 = "今年も色んなネタ、\n期待してますよ！"
26016-330 = "ちゃんと良い子にしてたか、\n密着取材です！"
26016-340 = "ハッピーハロウィン！"
26016-350 = "今日はどんなネタが\n生まれるんでしょうね～！"
26016-360 = "いざ、ハロウィンの現場へ～！"
26016-380 = "ふふっ！スキあり！\nシャッターチャンス！"
26016-390 = "あはっ！\n先生、小さく丸まちゃって……"
26016-400 = "これは表紙に\nピッタリの構図ですね！"
26016-410 = "ふっふ～ん！\nスクープがなければ\n作ればいいんです！"
26016-420 = "チッチッチッチッチッ～！\n甘いですね！"
26016-430 = "落としたのは\nこれのキャップです！"
26016-440 = "文字通り\n一銭もかけずに\nおいしい場面になりましたね！"
26016-450 = "面白くない先生は\n「テーブルの下閉じ込めの刑」に\n処します！"
26016-460 = "もっと面白いネタを\n教えてくれたら\n解放してあげないことも、\nないですよ？"
26016-470 = "あれ、どうしました？\n目をそらして……。"
26016-480 = "まだインタビュー中ですよ！\nちゃんとこっちを見てください！"
26016-490 = "なんでこっち\n見てくれないんですかぁ？"
26016-500 = "って、これ……！"
26016-510 = "ひゃあああっ！"
26016-520 = "ちょっ！\n見ちゃダメですっ！"
26016-530 = "出るのもダメ！\nじっとしててください！"
26016-2600 = "ペンは銃よりも強し！\n……まぁ、これは例外ですけどね！"
