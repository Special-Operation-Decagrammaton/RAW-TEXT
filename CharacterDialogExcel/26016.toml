[translation]
26016-10-1 = "Blue~! Archive!"
26016-20-1 = "ท้องฟ้าสีคราม ทะเลกว้างใหญ่ ดวงอาทิตย์ฤดูร้อน\nที่ส่องประกาย... ความฝันกลางฤดูร้อนอยู่ที่นี่แล้ว!\nที่ไหนมีสกู๊ปพิเศษ ที่นั่นมีฉันค่ะ!"
26016-30-1 = "เรดาร์จิอากิ เปิดทำงาน!\nเอาละ ผู้คนกำลังคุย\nเรื่องอะไรกันอยู่นะ~!"
26016-40-1 = "โอ้โห!\nของแบบนี้แม้แต่ใน\nเกเฮนน่าก็หายากนะคะ...!"
26016-50-1 = "ฉันโมโตมิยะค่ะ!\nเป็นเกียรติอย่างยิ่งค่ะ!\nขออนุญาตสัมภาษณ์นะคะ!"
26016-60-1 = "ชมรมนั้นสะดุดตาจังค่ะ...\nขอลองทำกิจกรรมชมรม\nจะได้มั้ยคะ?"
26016-70-1 = "(ตกลงนี่เป็นความสัมพันธ์\nแบบไหนกันแน่นะ...?)"
26016-80-1 = "เชิญค่ะ คุณครู!"
26016-90-1 = "มีเรื่องสนุกๆ เกิดขึ้นหรือเปล่าคะ?"
26016-100-1 = "จิอากิรายวันมาแล้วค่ะ!"
26016-110-1 = "เอ้า นี่ค่ะ!"
26016-120-1 = "ฉันทำที่นั่งให้อุ่นๆ ไว้แล้วค่ะ!"
26016-130-1 = "เอาละๆ นั่งสิคะ นั่งเลย!"
26016-140-1 = "เดี๋ยวฉันเอาขยะไปทิ้งให้นะคะ"
26016-150-1 = "ไม่ต้องเกรงใจค่ะ!\nนี่ก็เป็นส่วนหนึ่งของการเก็บข้อมูลค่ะ!"
26016-160-1 = "รู้สึกไม่ค่อยมีแรงจูงใจเลยค่ะ..."
26016-170-1 = "ไม่มีประเด็นข่าวสนุกๆ\nหล่นตุ้บลงมาบ้างเหรอ?"
26016-180-1 = "มาแลกเปลี่ยนประเด็นข่าวเด็ด\nที่เก็บไว้กันมั้ยคะ?"
26016-190-1 = "อย่างเช่นแลกเปลี่ยนความลับกัน...\nว่าไงล่ะคะ?"
26016-200-1 = "เริ่มค้นหา!\nที่โต๊ะของคุณครู"
26016-210-1 = "วันนี้วันเกิดของคุณครู!"
26016-220-1 = "สุขสันต์วันเกิดนะคะ!\nปรบมือ แปะแปะแปะ!"
26016-230-1 = "เป็นยังไงคะ?\nวันเกิดที่ใช้ร่วมกับฉัน?\nสนุกดีมั้ยคะ?"
26016-240-1 = "ค่ะ ยิ้มหน่อยค่ะ! อิฮิฮิ!"
26016-250-1 = "ถามว่าวันนี้เป็นวันอะไรเหรอคะ?"
26016-260-1 = "อืม มีเรื่องอะไรหรือเปล่านะ?"
26016-270-1 = "อ๊ะ!!\nหรือว่าวันเดดไลน์ส่งบทความ?!"
26016-280-1 = "อ๋อ วันเกิดของฉันเองเหรอคะ\nโล่งอกไปที..."
26016-290-1 = "แน่นอนว่าฉันรู้อยู่แล้วค่ะ!"
26016-300-1 = "ฉันถึงได้มาที่นี่ไงคะ? ฮิฮิ"
26016-310-1 = "สวัสดีปีใหม่ค่ะ!"
26016-320-1 = "ปีนี้ฉันก็จะรอประเด็นข่าวต่างๆ\nจากคุณครูนะคะ!"
26016-330-1 = "นี่คือการเกาะติดทำข่าว\nว่าเป็นเด็กดีหรือเปล่าค่ะ!"
26016-340-1 = "แฮปปี้ฮาโลวีน!"
26016-350-1 = "วันนี้จะมีประเด็นข่าวแบบไหน\nเกิดขึ้นบ้างนะ~!"
26016-360-1 = "งั้นก็ไปหน้างานฮาโลวีนกันเลย~!"
26016-380-1 = "ฮุฮุ! ได้โอกาสแล้ว!\nกดชัตเตอร์!"
26016-390-1 = "อ๊ะ! คุณครู\nขดตัวเล็กเชียว..."
26016-400-1 = "อันนี้เป็นองค์ประกอบภาพ\nที่เหมาะกับหน้าปกสุดๆ เลยค่ะ!"
26016-410-1 = "ฮุฮุฮุ! ถ้าไม่มีสกู๊ปพิเศษ\nก็สร้างขึ้นมาเองได้ค่ะ!"
26016-420-1 = "แหมๆๆๆๆ!\nใสซื่อจริงๆ นะคะ!"
26016-430-1 = "ของที่ทำตก\nคือฝาขวดนี้ต่างหากค่ะ!"
26016-440-1 = "อย่างที่ว่าเลยค่ะ\nไม่ได้ใช้เงินสักเหรียญ\nก็สร้างภาพล้ำค่าออกมาได้เลยนะคะ!"
26016-450-1 = "คุณครูที่ทำตัวไม่สนุก\nต้องรับโทษ 'ขังใต้โต๊ะ' ค่ะ!"
26016-460-1 = "ถ้าบอกความลับที่สนุกกว่านี้\nฉันอาจยอมปล่อยให้ก็ได้นะคะ?"
26016-470-1 = "หืม? เป็นอะไรหรือเปล่าคะ?\nหลบสายตาด้วย..."
26016-480-1 = "ยังอยู่ระหว่างสัมภาษณ์ค่ะ!\nต้องมองตรงมาทางนี้สิคะ!"
26016-490-1 = "ทำไมถึงไม่มอง\nมาทางนี้ล่ะคะ?"
26016-500-1 = "อ๊ะ นี่มัน...!"
26016-510-1 = "ว้ายยย!"
26016-520-1 = "หะ! ห้ามมองนะคะ!"
26016-530-1 = "ห้ามออกมาด้วย!\nอยู่นิ่งๆ เลยค่ะ!"
26016-2600-1 = "ปากกาแข็งแกร่งกว่าปืนค่ะ!\nแต่... เจ้านี่ก็แข็งแกร่งกว่าปากกานะคะ!"
