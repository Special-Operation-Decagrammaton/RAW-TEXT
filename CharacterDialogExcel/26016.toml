[translation]
26016-10 = "Blue! Archive!"
26016-20 = "A blue sky, the vast ocean, and the sparkling summer sun... A midsummer dream awaits right here! Where there's a scoop, there's me!"
26016-30 = "Chiaki radar, on! Now, what could they be talking about?"
26016-40 = "Oh! This would be hard to find in Gehenna too...!"
26016-50 = "Motomiya here! Thank you! May I ask for an interview?"
26016-60 = "That club looks interesting... Do they allow trial runs?"
26016-70 = "(What is the nature of their relationship...?)"
26016-80 = "Welcome, Sensei!"
26016-90 = "Did anything interesting happen?"
26016-100 = "Daily Chiaki has arrived!"
26016-110 = "Here, this way!"
26016-120 = "I warmed up the seat for you!"
26016-130 = "Now, now, take a seat!"
26016-140 = "I'll empty out the trash for you."
26016-150 = "Don't worry about it! This is also part of the interview!"
26016-160 = "I have writer's block..."
26016-170 = "Maybe a lead will pop up out of nowhere?"
26016-180 = "Want to trade our best story headlines?"
26016-190 = "Kind of like trading secrets... Yeah?"
26016-200 = "Commence search on Sensei's desk!"
26016-210 = "Today is Sensei's birthday!"
26016-220 = "Congratulations! Clap clap clap!"
26016-230 = "How do you feel? About spending your birthday with me? Are you having fun?"
26016-240 = "Yes, smile! Heehee!"
26016-250 = "What day is it today?"
26016-260 = "Hmm, was there something?"
26016-270 = "Aah! Could it be a DEADLINE?!"
26016-280 = "Ah, my birthday. What a relief..."
26016-290 = "Of course I knew that!"
26016-300 = "That's what you're here for? Heehee."
26016-310 = "Happy New Year!"
26016-320 = "Here's to another year of great stories and even better reporting!"
26016-330 = "Let's see if I've been a good kid!"
26016-340 = "Happy Halloween!"
26016-350 = "I wonder what kind of stories I'll find today!"
26016-360 = "Now then, to the Halloween scene!"
26016-380 = "Fufu! An opening! The perfect shot!"
26016-390 = "Ahaha! Sensei, curled up so small like that..."
26016-400 = "This is a perfect shot for the cover!"
26016-410 = "Heehee! If there's no scoop, I'll just make one!"
26016-420 = "Tsk, tsk, tsk, tsk, tsk! You're too naive!"
26016-430 = "What I dropped was this bottle cap!"
26016-440 = "I quite literally staged a rare scene without spending a single dime!"
26016-450 = "Boring Sensei is now sentenced to confinement under the table!"
26016-460 = "Maybe I'll let you out if you tell me an interesting secret."
26016-470 = "Hm? Are you okay? Why won't you look at me...?"
26016-480 = "We're in an interview! You need to look at me!"
26016-490 = "Why don't you want to look?"
26016-500 = "Ah! This...!"
26016-510 = "Kyaaah!"
26016-520 = "Don't look!"
26016-530 = "Don't come out! Stay right there!"
26016-2600 = "Pens are stronger than guns! ...Well, this one's stronger than any pen, though!"
