[translation]
26016-10-1 = "블루~! 아카이, 브!"
26016-20-1 = "푸른 하늘, 드넓은 바다, 반짝이는 여름의 태양……\n한여름의 꿈이 여기에!\n특종이 있는 곳에 제가 있다, 입니다!"
26016-30-1 = "치아키 레이더, 온!\n자아, 무슨 이야기를\n하고 있으려나~!"
26016-40-1 = "오오-!\n이건 게헨나에서도\n보기 힘드네요……!"
26016-50-1 = "모토미야입니다!\n황송합니다!\n인터뷰\n실례하겠습니다!"
26016-60-1 = "저 동아리,\n신경쓰이네요……\n체험 입부\n가능할까요?"
26016-70-1 = "(대체, 무슨\n사이일까……?)"
26016-80-1 = "어서오세요, 선생님!"
26016-90-1 = "뭔가 재미있는 일, 있으셨나요?"
26016-100-1 = "일간 치아키가 왔습니다아-!"
26016-110-1 = "자, 여기요!"
26016-120-1 = "자리, 데워뒀어요!"
26016-130-1 = "자자, 앉아요 앉아!"
26016-140-1 = "쓰레기통, 비워드릴게요."
26016-150-1 = "신경쓰지 마세요!\n이것도 취재의 일환이니까요!"
26016-160-1 = "뭔-가 의욕이 안 생기네요……."
26016-170-1 = "뭔가 재미있는 소재,\n뚝 떨어지지 않으려나-?"
26016-180-1 = "비장의 소재,\n교환하지 않으실래요?"
26016-190-1 = "비밀을 서로 교환한다든지……\n어때요?"
26016-200-1 = "선생님의 책상,\n수색 개시!"
26016-210-1 = "오늘은 선생님의 생일!"
26016-220-1 = "축하합니다!\n짝짝짝-!"
26016-230-1 = "어때요?\n저와 함께 보내는 생일은?\n즐거우신가요?"
26016-240-1 = "네에, 웃어요! 에헤헷-!"
26016-250-1 = "오늘이 무슨 날이냐구요?"
26016-260-1 = "으음- 뭐 있었던가-?"
26016-270-1 = "아앗!!\n설마, 기사 마감일?!"
26016-280-1 = "아아, 제 생일이라구요.\n다행이다……."
26016-290-1 = "물론 그건 알고 있어요!"
26016-300-1 = "그래서 여기 온 거라구요?\n힛히-"
26016-310-1 = "새해 복 많이 받으세요!"
26016-320-1 = "올 해도 여러 소재,\n기대하고 있을게요!"
26016-330-1 = "착한 아이로 있었는지,\n밀착 취재입니다!"
26016-340-1 = "해피 할로윈!"
26016-350-1 = "오늘은 어떤 소재가\n생길까요~!"
26016-360-1 = "그럼, 할로윈 현장으로~!"
26016-380-1 = "후훗! 빈틈 발견!\n셔터찬스!"
26016-390-1 = "아핫! 선생님,\n작게 웅크려선……."
26016-400-1 = "이건 표지에\n딱 맞는 구도네요!"
26016-410-1 = "훗후웅!\n특종감이 없으면\n만들면 되는 법!"
26016-420-1 = "칫칫칫칫치-!\n순진하시군요!"
26016-430-1 = "떨어뜨린건\n이 병뚜껑 이랍니다!"
26016-440-1 = "말 그대로,\n동전 한 닢 안 쓰고\n귀한 장면을 연출했네요!"
26016-450-1 = "재미없는 선생님은 \n'테이블 밑에 가두기형'에\n처합니다!"
26016-460-1 = "좀 더 재미있는 비밀을\n알려주시면 풀어드릴지도오-?"
26016-470-1 = "응? 괜찮으세요?\n눈도 피하시고……."
26016-480-1 = "아직 인터뷰 중이에요!\n제대로 여기 봐 주셔야죠!"
26016-490-1 = "왜 여기 봐주지\n않으시는 거예요오?"
26016-500-1 = "앗, 이거……!"
26016-510-1 = "꺄아아앗!"
26016-520-1 = "보! 보면 안돼요!"
26016-530-1 = "나오면 안 돼!\n가만히 있어요!"
26016-2600-1 = "펜은 총보다 강해요!\n……뭐, 이건 펜보다 강하지만요!"
