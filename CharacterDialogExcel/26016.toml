[translation]
26016-10 = "蔚藍～！檔案！"
26016-20 = "蔚藍的天空、遼闊的大海、耀眼的常夏太陽……\n一場夏日之夢就在這裡！\n哪裡有獨家新聞，哪裡就有我！"
26016-30 = "千秋雷達，啟動！\n來～在聊些什麼呢～！"
26016-40 = "哦哦～！這是在格黑娜\n也很少見的景象……！"
26016-50 = "我是元宮！說來冒昧！\n請允許我進行採訪！"
26016-60 = "那個社團，\n讓人很在意……\n可以體驗入部嗎？"
26016-70 = "（到底是什麼\n關係呢……？）"
26016-80 = "歡迎回來，老師！"
26016-90 = "有發生什麼有趣的事嗎？"
26016-100 = "《日報千秋》送來囉～！"
26016-110 = "來，請收下！"
26016-120 = "座位已經暖好了唷！"
26016-130 = "來來來，請坐請坐！"
26016-140 = "垃圾桶的袋子，\n我去幫你換哦。"
26016-150 = "不用客氣！\n這也是採訪的一環！"
26016-160 = "總覺得提不起勁呢……"
26016-170 = "不知道有趣的題材\n會不會從天而降呢～？"
26016-180 = "要不要交換\n珍藏的題材？"
26016-190 = "就是互相交換祕密……\n怎麼樣？"
26016-200 = "老師的桌子，\n讓我看看吧！"
26016-210 = "今天是老師的生日！"
26016-220 = "恭喜你！\n啪啪啪～！"
26016-230 = "怎麼樣？跟我一起\n度過的生日如何呀？\n開心嗎？"
26016-240 = "來，笑一個！耶嘿嘿！"
26016-250 = "問我今天是什麼日子……"
26016-260 = "唔嗯～是什麼日子呢～？"
26016-270 = "啊！難不成是原稿的截稿日！？"
26016-280 = "啊啊，原來是我的生日啊。\n太好了……"
26016-290 = "我當然記得囉！"
26016-300 = "所以才會來這裡嘛？\n嘻嘻。"
26016-310 = "新年快樂！"
26016-320 = "今年也期待你提供\n各種題材哦！"
26016-330 = "這是看你有沒有當\n乖孩子的貼身採訪！"
26016-340 = "萬聖節快樂！"
26016-350 = "今天會誕生\n什麼樣的題材呢～！"
26016-360 = "立刻前往萬聖節現場～！"
26016-380 = "呵呵！有破綻！\n快門時機！"
26016-390 = "啊哈！老師，\n縮成小小一團……"
26016-400 = "這是適合拿來當\n封面的構圖呢！"
26016-410 = "哼哼～！\n沒有獨家新聞的話，\n只要做一個就行了！"
26016-420 = "嘖嘖嘖嘖嘖～！\n太天真了！"
26016-430 = "掉下去的是\n這個的瓶蓋！"
26016-440 = "名副其實沒花半毛錢\n就換來了精彩的場面呢！"
26016-450 = "不有趣的老師要被處以\n「關在桌子底下之刑」！"
26016-460 = "要是你告訴我\n更有趣的題材，\n我也不是不能\n放你出來哦？"
26016-470 = "咦，怎麼了嗎？\n為什麼移開視線……"
26016-480 = "還在訪問中哦！\n請好好看著這邊！"
26016-490 = "為什麼不看我這邊呢～？"
26016-500 = "啊，這個……！"
26016-510 = "呀啊啊啊！"
26016-520 = "等一下！\n不可以看！"
26016-530 = "也不准出來！\n請乖乖待著別動！"
26016-2600 = "筆比槍更有力！\n……不過，這個算是例外啦！"
