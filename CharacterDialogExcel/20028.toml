[translation]
20028-10-1 = "Blue Archive!"
20028-20-1 = "วะ...วาคาบะ ฮินาตะค่ะ\nฉะ...ฉันจะตั้งใจทำให้ดีที่สุด\nพะ...เพราะงั้นบอกมาได้ทุกเรื่องเลยนะคะ!"
20028-30-1 = "สไตล์การตกแต่งที่นี่\nน่ารักมากๆ เลยค่ะ...!"
20028-40-1 = "คือว่า... ถ้าเป็นเรื่อง\nขนย้ายสัมภาระละก็\nบอกฉันได้ตลอดเลยนะคะ!"
20028-50-1 = "เอ๋? รู้สึกเหมือนมีคน\nกำลังเรียกฉันอยู่เลย..."
20028-60-1 = "ที่นี่ดูดีแล้วก็\nสบายมากเลยค่ะ"
20028-70-1 = "คุณครู...\nอยู่ที่ไหนคะ...?"
20028-80-1 = "ขะ...ขอบคุณที่\nทำงานหนักนะคะ คุณครู"
20028-90-1 = "อะ...ออกไปเดินเล่น\nริมหาดด้วยกันดีมั้ยคะ?"
20028-100-1 = "เชิญเลยค่ะ คุณครู"
20028-110-1 = "วะ...วันนี้\nก็ขอให้เป็นวันที่เต็มไปด้วย\nความรักและความสุขนะคะ"
20028-120-1 = "ขอให้ฉันได้ช่วยงาน\nคุณครูด้วยเถอะค่ะ!"
20028-130-1 = "ชอบฤดูร้อน...หรือเปล่า\nงั้นเหรอคะ?"
20028-140-1 = "ค่ะ ต้องชอบสิคะ!\nแล้วก็ชอบฤดูใบไม้ผลิ\nฤดูใบไม้ร่วง แล้วก็ฤดูหนาวด้วยค่ะ!"
20028-150-1 = "ความเพลิดเพลินที่มีแค่ในฤดูร้อน\nความสนุกที่สัมผัสได้แค่ในทะเล\nฉันอยากเก็บรักษามันไว้ให้ดีที่สุดค่ะ"
20028-160-1 = "อืม... ถ้าให้พูดตามตรงละก็\nฉันรู้สึกอายนิดหน่อย...\nที่ต้องใส่ชุดว่ายน้ำค่ะ"
20028-170-1 = "ตะ...แต่ถึงจะใส่ชุดว่ายน้ำ\nก็ไม่ได้มีปัญหาหรือรบกวน\nการสวดอธิษฐานหรอกนะคะ"
20028-180-1 = "สุขสันต์วันเกิดค่ะ คุณครู!"
20028-190-1 = "หวังว่าวันนี้ในปีหน้า...\nฉันจะมีโอกาสได้อวยพร\nคุณครูอีกนะคะ"
20028-200-1 = "อ๊ะ คุณครู...\nจำวันเกิดฉันได้ด้วยเหรอคะ!"
20028-210-1 = "ขอบคุณนะคะ...\nฉันดีใจมากเลยค่ะ"
20028-220-1 = "ขอให้มีความสุขในวันปีใหม่นะคะ คุณครู"
20028-230-1 = "ขอให้ปีนี้คุณครู\nมีสุขภาพที่แข็งแรงตลอดปีนะคะ"
20028-240-1 = "วันคริสต์มาสแล้วนะคะ!"
20028-250-1 = "วันนี้ก็เป็นวันพิเศษ\nสำหรับชมรมซิสเตอร์ของเรา\nเหมือนกันค่ะ"
20028-260-1 = "ชะ...ชุดนี้ มันไม่ได้เกี่ยวกันเลยนะคะ!"
20028-270-1 = "วันฮาโลวีนแล้วค่ะ!\nทุกคนดูสนุกสนานกันแบบนี้\nฉันดีใจจังเลยค่ะ!"
20028-290-1 = "อืม... หืม...?\nเอ๋...?"
20028-300-1 = "ตรงนี้มันสบาย\nกว่าที่คิดอีกนะคะ..."
20028-310-1 = "ลมพัดเย็นสบาย ไม่เย็น\nจนเกินไป... และมีร่มเงาบังแดด\nไม่ให้ส่องโดนหน้าด้วย..."
20028-320-1 = "อุ่นสบายดีจัง...\nถ้านอนอยู่ตรงนี้ละก็\nคงจะเผลอหลับแน่ๆ เลยค่ะ"
20028-330-1 = "แต่ว่า... เอ่อ...\nถ้ามีแต่ฉันคนเดียวที่ได้นอนพัก\nทั้งที่อยู่กับคุณครูแบบนี้..."
20028-340-1 = "มะ...มันรู้สึกผิด...\nยังไงก็ไม่รู้ค่ะ"
20028-350-1 = "ขะ... เข้าใจแล้วค่ะ\nถ้างั้นฉันจะทำตาม\nที่คุณครูบอก..."
20028-360-1 = "ปล่อยใจให้สบายๆ..."
20028-370-1 = "...อืม...\nงืมๆๆ ฮิฮิ..."
20028-380-1 = "...ฮึก!?\nมะ...เมื่อกี้ฉันทำอะไรไป...!?"
20028-390-1 = "ชะ...ช่วยลืมไปด้วยนะคะ\nช่วยลืมเรื่องเมื่อกี้ไปให้หมด\nด้วยนะคะ คุณครู!!"
20028-2600-1 = "ฉัน...ไม่รู้ว่าจะขอบคุณคุณครูยังไงดี...\nไม่สิ ถ้าให้บอกเป็นคำพูด\nคงไม่มีทางพูดออกไปหมดได้แน่ๆ ค่ะ\nความกรุณาที่ได้รับมาในครั้งนี้...\nฉันจะตอบแทนด้วยการกระทำค่ะ คุณครู"
