[translation]
10138-10 = "哼，蔚藍檔案！"
10138-20 = "狂獵藝術學園的衣斐玲奈。\n給我等著，神秘學什麼的，\n我會證明全都是騙人的！"
10138-30 = "那個人\n適合什麼衣服呢？"
10138-40 = "這裡的話不會\n發生奇怪的事吧……？\n應該不至於吧……"
10138-50 = "這個擺設……\n老師也有點品味呢。"
10138-60 = "那個設計\n是神秘學吧……？\n老師也受影響了嗎。"
10138-70 = "那，那邊\n好像有奇怪的\n聲音傳來……"
10138-80 = "太慢了！！ \n我一直在等你耶！？"
10138-90 = "歡迎回來，老師。\n所以，我該做什麼？"
10138-100 = "這裡整理得\n很整齊呢。"
10138-110 = "我們宿舍……\n怎麼整理都整理不完。"
10138-120 = "唉，都是前輩們\n帶奇怪的東西回來……"
10138-130 = "分配宿舍的那天\n我到現在都忘不了……"
10138-140 = "第4棟404號房耶？\n就算不信神秘學\n也不想要吧？"
10138-150 = "為什麼大家都這麼\n輕易相信神秘學呢。"
10138-160 = "那些明明都可以用科學\n證明的……\n老師也這麼想吧？"
10138-170 = "老師有空的\n時候都做什麼？"
10138-180 = "我？ 我大概是\n嘗試做各種東西吧。"
10138-190 = "不嫌棄的話\n要不要一起試試看？"
10138-200 = "並，並不是要你\n為我做什麼！"
10138-210 = "最近總是\n發生奇怪的事呢。"
10138-220 = "就像前輩們說的，\n去給占卜師算個命\n是不是比較好……？"
10138-230 = "唔……我明明決定\n不相信那種東西的！"
10138-240 = "咦？ 老師，\n今天是你生日啊？\n 我完全不知道呢。"
10138-250 = "藏在背後的東西……？"
10138-260 = "不，不是禮物哦？！\n只是剛好去買東西\n就順便買的而已！"
10138-270 = "今天，前輩們說\n要幫我辦生日派對。"
10138-280 = "老師也來吧。\n有很多好吃的哦，應該吧。"
10138-290 = "老師新年快樂。\n畢竟是新年，\n一起許個願吧？"
10138-300 = "許，許願並不算\n神秘學吧！"
10138-310 = "我從小就不相信\n什麼聖誕老人呢。"
10138-320 = "會在睡覺的時候\n偷偷來到枕邊耶？"
10138-330 = "那樣不是太可怕了嗎？！"
10138-340 = "嗯…… 這個房間，\n要是更有萬聖節氣氛\n就好了。"
10138-350 = "啊……不是在說神秘學！\n是設計方面的問題！"
10138-370 = "我呢，\n從小時候開始\n手就很靈活。"
10138-380 = "我會做蝴蝶結之類的，\n送給朋友。"
10138-390 = "大家都很喜歡，\n我也很開心。"
10138-400 = "……那時候我明白了。"
10138-410 = "就算是\n這麼小的東西，"
10138-420 = "也能讓人\n感到開心。"
10138-430 = "所以我開始夢想成為\n時裝設計師。"
10138-440 = "如果我設計的\n衣服或飾品，"
10138-450 = "能讓大家都喜歡的話\n我也會很開心。"
10138-460 = "那種感覺，\n老師也大概理解吧？"
10138-470 = "也是因為這樣，\n才這麼關心我的吧。"
10138-480 = "咦……？\n今天怎麼樣……？"
10138-490 = "嚇啊──！！\n 別，別讓我說啊！\n笨蛋老師！"
10138-2600 = "如果因為我很小隻就小看我可是會後悔的哦。\n雖然看起來這樣，但我的槍法可是一流的！\n用彈痕畫畫的程度──\n呃，我是說真的哦？！"
