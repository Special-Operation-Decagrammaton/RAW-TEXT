[translation]
10138-10-1 = "Hmph, Blue Archive!"
10138-20-1 = "I'm Kinui Rena from Wildhunt Art Academy. Just you watch; I'll prove that the occult is nothing but a total sham!"
10138-30-1 = "What kind of clothes would look best on them...?"
10138-40-1 = "Nothing weird is gonna happen here, right...? Probably..."
10138-50-1 = "This arrangement... Sensei has decent taste."
10138-60-1 = "Isn't that design from the occult...? Maybe Sensei got influenced too."
10138-70-1 = "I-I heard a weird noise coming from over there..."
10138-80-1 = "You're late!! Do you know how long I've been waiting?!"
10138-90-1 = "Welcome, Sensei. How can I help?"
10138-100-1 = "Everything's in place."
10138-110-1 = "In our dorm rooms... There's no end to the cleaning."
10138-120-1 = "*sigh* It's because my seniors are always bringing weird stuff back..."
10138-130-1 = "I still can't forget the day I was assigned my dorm room."
10138-140-1 = "Dormitory 4, Unit 404... Isn't that pretty ominous, even if you don't believe in the occult?"
10138-150-1 = "I wonder why people believe in things like the occult so readily."
10138-160-1 = "Everything can be explained with science. ...Don't you think so too, Sensei?"
10138-170-1 = "So, what do you do in your free time, Sensei?"
10138-180-1 = "Me? I guess I make all sorts of things."
10138-190-1 = "Would you ever want to join me?"
10138-200-1 = "I-It's not like I'm asking you to make something for me!"
10138-210-1 = "Why does weird stuff keep happening to me lately?"
10138-220-1 = "Maybe I really should listen to my seniors...and go see a fortune teller?"
10138-230-1 = "Wahhh, I promised myself I'd never give in!"
10138-240-1 = "Huh? It's your birthday today? I definitely didn't know that."
10138-250-1 = "What am I hiding behind my back...?"
10138-260-1 = "I-It's not a gift! I just so happened to be shopping before I came here!"
10138-270-1 = "My seniors said they'll throw me a birthday party today."
10138-280-1 = "You should come too, Sensei. There will be lots of good food. Probably."
10138-290-1 = "Happy New Year, Sensei. Since it's the new year, should we make a wish together?"
10138-300-1 = "Making wishes isn't considered occult!"
10138-310-1 = "I never believed in Santa, ever since I was young."
10138-320-1 = "Like, he's gonna secretly come to my bedside while I'm asleep?"
10138-330-1 = "Isn't that really scary?"
10138-340-1 = "Hmm... I wish this room had more \"Halloween\" to it."
10138-350-1 = "Ah... I'm not talking about occult stuff! I was talking about the design!"
10138-370-1 = "You know, I've always been good with my hands, ever since I was a kid."
10138-380-1 = "I would make things like ribbons and give them to my friends."
10138-390-1 = "I was happy to see that everyone liked them."
10138-400-1 = "...And that's how I learned..."
10138-410-1 = "...that even something small..."
10138-420-1 = "...can make someone feel happy."
10138-430-1 = "That's why I started dreaming of becoming a fashion designer."
10138-440-1 = "Because it makes me happy to see others enjoy..."
10138-450-1 = "...the clothes and accessories I design."
10138-460-1 = "Sensei, you know how that feels, right?"
10138-470-1 = "I think that's also why you keep looking out for me."
10138-480-1 = "Huh...? How was today...?"
10138-490-1 = "Shyaah! D-Don't make me say it! Idiot Sensei!"
10138-2600-1 = "You shouldn't underestimate me because I'm small. Despite how I look, I'm good with guns! I can even make a drawing out of bullet marks... I'm being serious!"
