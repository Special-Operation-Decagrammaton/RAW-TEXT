[translation]
10138-10 = "哼……蔚藍檔案！"
10138-20 = "狂獵藝術學院的衣斐玲奈。\n等著看吧。我會證明\n神秘學什麼的全都是詐騙的！"
10138-30 = "那個人適合\n什麼樣的衣服呢？"
10138-40 = "這裡不會發生\n奇怪的事吧……？\n應該不至於吧……"
10138-50 = "這個擺設……老師也\n還算有點品味嘛。"
10138-60 = "那個設計是\n神秘學吧……？\n老師也被影響了嗎。"
10138-70 = "那，那邊好像\n有奇怪的聲音……"
10138-80 = "太慢了！！ \n我一直在等你耶！？"
10138-90 = "歡迎回來，老師。\n所以，我該做什麼呢？"
10138-100 = "整理得很整齊呢。"
10138-110 = "我們的宿舍……\n怎麼整理都整理不完。"
10138-120 = "唉，都怪前輩們帶了\n奇怪的東西回來……"
10138-130 = "確認房間分配那天的事，\n我到現在都忘不了……"
10138-140 = "那可是第4宿404號室哦？\n就算對神秘學沒興趣\n也不會喜歡吧？"
10138-150 = "為什麼會相信\n神秘學這種東西呢。"
10138-160 = "那些明明全都能有\n科學上的證明……\n老師也這麼想吧？"
10138-170 = "老師有空的時候\n會做什麼呢？"
10138-180 = "我？我大概是\n嘗試做各種東西吧。"
10138-190 = "不嫌棄的話，\n要不要一起試試看？"
10138-200 = "並，並不是要你\n為我做什麼的意思！"
10138-210 = "最近總是發生奇怪的事呢。"
10138-220 = "按照前輩們說的，\n去給占卜師算個命\n會比較好嗎……？"
10138-230 = "唔唔……我明明決定\n不相信那種東西的！"
10138-240 = "咦？老師，\n今天是你生日啊？\n我完全不知道呢。"
10138-250 = "藏在背後的東西……？"
10138-260 = "不，不是禮物哦！？\n只是剛好在買東西\n的時候順便買的！"
10138-270 = "今天，前輩們說\n要幫我辦生日派對。"
10138-280 = "老師也來吧。\n應該有很多好吃的哦。"
10138-290 = "新年快樂，老師。\n畢竟是新年，\n要不要一起許願？"
10138-300 = "許，許願不算是神秘學吧！"
10138-310 = "我，從小時候開始\n就不相信什麼聖誕老人呢。"
10138-320 = "會在睡覺的時候\n偷偷來到枕邊耶？"
10138-330 = "不覺得那樣很恐怖嗎！？"
10138-340 = "唔嗯……這個房間，\n真希望能再增加一點\n萬聖節的氣氛。"
10138-350 = "啊……不是在說神秘學！\n是在說設計層面的事！"
10138-370 = "我呢，\n從小時候開始\n手就很靈活。"
10138-380 = "我會做蝴蝶結之類的，\n送給朋友。"
10138-390 = "大家都很喜歡，\n我也很開心。"
10138-400 = "……那時候我明白了。"
10138-410 = "就算是這麼小的東西，"
10138-420 = "也能讓人感到開心。"
10138-430 = "所以，我才會開始以\n時裝設計師為目標。"
10138-440 = "如果我設計的\n衣服或飾品，"
10138-450 = "能讓大家高興的話，\n我也會很開心。"
10138-460 = "那種感覺，老師應該\n多少能夠理解吧？"
10138-470 = "也是因為這樣，\n你才會這麼關心我。"
10138-480 = "咦……？\n問我今天怎麼樣……？"
10138-490 = "嚇啊──！！\n別，別讓我說出口啊！\n笨蛋老師！"
10138-2600 = "要是看我嬌小就瞧不起我，\n可是會嘗到苦頭的哦。\n別看我這樣，也是很擅長用槍的！\n就連用彈痕畫畫這種事都……\n等一下，我是說真的哦！？"
