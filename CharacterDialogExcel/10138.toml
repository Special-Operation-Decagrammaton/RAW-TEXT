[translation]
10138-10 = "ฮึ่ม Blue Archive!"
10138-20 = "ฉันคินุอิ เรนะ จากสถาบันศิลปะไวลด์ฮันต์\nคอยดูเลยนะ ฉันจะพิสูจน์ให้เห็นว่ารหัสยศาสตร์\nเป็นเรื่องงมงายทั้งหมดเลย!"
10138-30 = "คนนั้นจะเหมาะ\nกับเสื้อผ้าแบบไหนนะ?"
10138-40 = "ที่นี่น่าจะไม่เกิด\nเรื่องแปลกๆ หรอกเนอะ...?\nน่าจะนะ..."
10138-50 = "การจัดวางแบบนี้...\nคุณครูนี่ก็\nมีเซนส์ใช้ได้เลยนะ"
10138-60 = "ดีไซน์อันนั้นมัน\nเป็นรหัสยศาสตร์ใช่มั้ย...?\nคุณครูก็ได้รับ\nอิทธิพลมาด้วยเหรอ?"
10138-70 = "ดะ... ได้ยินเสียงอะไร\nแปลกๆ ออกมาจาก\nทางนั้น..."
10138-80 = "มาช้านะ!! ฉันรออยู่ตั้งนานเลย!"
10138-90 = "เข้ามาสิ คุณครู\nให้ฉันช่วยอะไรดีล่ะ?"
10138-100 = "ที่นี่จัดระเบียบ\nไว้อย่างดีเลยนะ"
10138-110 = "หอพักของฉันน่ะ...\nเก็บกวาดแค่ไหนก็ไม่หายรกสักที"
10138-120 = "เฮ้อ ก็พวกรุ่นพี่\nชอบเอาอะไรแปลกๆ มา..."
10138-130 = "วันที่ถูกจัดเข้าหอพัก\nฉันยังลืมไม่ลงเลยละ..."
10138-140 = "หอ 4 ห้อง 404?\nต่อให้ไม่เชื่อเรื่องรหัสยศาสตร์\nแต่มันก็ดูเป็นลางร้ายไม่ใช่เหรอ?"
10138-150 = "ทำไมทุกคนถึงได้\nเชื่อเรื่องงมงายกันไปหมดนะ"
10138-160 = "เรื่องแบบนั้นวิทยาศาสตร์\nก็พิสูจน์ได้ทั้งหมดแท้ๆ\nคุณครูก็คิดเหมือนกันใช่มั้ย...?"
10138-170 = "จะว่าไป คุณครูทำอะไร\nตอนมีเวลาว่างเหรอ?"
10138-180 = "ฉันเหรอ? ฉันก็\nประดิษฐ์นู่นนี่ไปเรื่อยน่ะ"
10138-190 = "อยากลองทำด้วยกันมั้ยล่ะ?"
10138-200 = "ฉะ... ฉันไม่ได้ขอให้\nทำอะไรให้หรอกนะ!"
10138-210 = "ทำไมหมู่นี้ถึง\nชอบเกิดเรื่องแปลกๆ นะ?"
10138-220 = "หรือว่าต้องไปดูดวง...\nตามที่พวกรุ่นพี่บอก?"
10138-230 = "ฮึ่ย ตั้งใจว่าจะไม่เชื่อ\nเรื่องพรรค์นั้นแล้วแท้ๆ!"
10138-240 = "หืม? คุณครู\nวันนี้วันเกิดเหรอ? ฉันไม่รู้เลยแฮะ"
10138-250 = "สิ่งที่ซ่อนไว้ข้างหลังเหรอ...?"
10138-260 = "มะ... ไม่ใช่ของขวัญหรอก!\nฉันแค่บังเอิญเดินเจอ\nก็เลยซื้อมาต่างหาก!"
10138-270 = "วันนี้พวกรุ่นพี่บอกว่า\nจะจัดปาร์ตี้วันเกิดให้น่ะ"
10138-280 = "คุณครูก็มาด้วยสิ\nมีของอร่อยเพียบเลยละ น่าจะนะ..."
10138-290 = "สวัสดีปีใหม่นะ คุณครู\nปีใหม่ทั้งที เรามา\nอธิษฐานขอพรด้วยกันมั้ย?"
10138-300 = "คะ... แค่การขอพร\nไม่ถือว่าเป็นเรื่องงมงายหรอก!"
10138-310 = "ฉันไม่เชื่อเรื่องซานต้า\nมาตั้งแต่เด็กๆ แล้ว"
10138-320 = "ย่องเข้ามาที่หัวนอน\nตอนหลับงั้นเหรอ?"
10138-330 = "แบบนั้นมัน\nน่ากลัวเกินไปหรือเปล่า?!"
10138-340 = "อืม... ห้องนี้\nอยากให้มีความเป็น\nฮาโลวีนมากกว่านี้จัง"
10138-350 = "อ๊ะ... นี่ไม่ใช่เรื่องรหัสยศาสตร์นะ!\nเป็นเรื่องการดีไซน์ต่างหาก!"
10138-370 = "ฉันน่ะ เก่งงานฝีมือ\nมาตั้งแต่เด็กๆ แล้ว"
10138-380 = "ฉันทำพวกโบว์ติดผม\nแจกเพื่อนบ่อยๆ เลย"
10138-390 = "พอทุกคนชอบฉันก็ดีใจ"
10138-400 = "ฉันก็เลยได้รู้ว่า..."
10138-410 = "ถึงจะเป็นของชิ้นเล็กๆ แบบนี้"
10138-420 = "ก็ทำให้ใครบางคน\nมีความสุขได้ด้วยสินะ"
10138-430 = "ฉันก็เลยฝันอยากเป็น\nแฟชั่นดีไซเนอร์มาตลอดเลย"
10138-440 = "เพราะถ้าทุกคนชอบเสื้อผ้าหรือ\nเครื่องประดับที่ฉันออกแบบ"
10138-450 = "ฉันก็จะมีความสุขไปด้วย"
10138-460 = "เรื่องแบบนี้น่ะ\nคุณครูพอเข้าใจใช่มั้ย?"
10138-470 = "พอมีเรื่องแบบนั้น\nฉันก็เลยคิดว่าตัวเอง\nใส่ใจในงานนี้มากเลยละ"
10138-480 = "หืม...?\nวันนี้เป็นยังไงบ้างน่ะเหรอ...?"
10138-490 = "ว้ากก! ยะ... อย่าให้ฉันต้องพูดสิ!\nคุณครูคนบื้อ!"
10138-2600 = "ถ้าดูถูกว่าฉันตัวเล็ก ระวังจะเจ็บตัวไม่ใช่น้อย\nเห็นอย่างนี้ฉันก็เก่งเรื่องปืนนะ!\nฉันวาดภาพจากรอยกระสุนได้เลยด้วย...\nจริงๆ นะ?!"
