[translation]
10132-10-1 = "ブルー、アーカイブ。"
10132-20-1 = "大野ツクヨ、です！ドレスを着てはいますが……\n正真正銘、忍術研究部の一員、です……！"
10132-30-1 = "ううぅ……私、\nすごく見られて\nませんか……？"
10132-40-1 = "服に染みがついたら、\n大変、ですから……\n慎重に……。"
10132-50-1 = "うぅ……いっそ、\nあそこの家具に、\n紛れて……。"
10132-60-1 = "ドレスを\n着ているときは、\n歩き方も……\n気にしないと……。"
10132-70-1 = "（みなさん……\n個性的な格好を、\nされていますね）"
10132-80-1 = "こんにちは……。"
10132-90-1 = "今日の私は、先生だけの\nモデル、です……。"
10132-100-1 = "お待ちしてました、先生。"
10132-110-1 = "えっと……ドレス姿、\n驚かせてしまったら、\nごめん、なさい……。"
10132-120-1 = "一人前のモデル、よりも……\n一人前の忍者を、\n目指したい、です。"
10132-130-1 = "この服、もう少し近くで、\nご覧になりますか……？"
10132-140-1 = "よく見ると、\n作りがとても細かくて……\n不思議、なんです！"
10132-150-1 = "こ、これは……\n私のグラビアが、\nどうしてシャーレに……！"
10132-160-1 = "食事、ですか？"
10132-170-1 = "私は……\nサラダ以外、でしたら、\nなんでも……。"
10132-180-1 = "ファッションショーの\n会場にあったソファより……"
10132-190-1 = "ここの事務椅子のほうが、\n落ち着き、ます。"
10132-200-1 = "お誕生日、おめでとう\nございます、先生。"
10132-210-1 = "先生に、お見せしたくて……\n忍者ウォーキング、\n練習したんです……！\n見て、いただけますか……？"
10132-220-1 = "私の誕生日……ですか？"
10132-230-1 = "最近、忙しくて……\nすっかり、\n忘れてました……。"
10132-240-1 = "ありがとうございます！"
10132-250-1 = "あけまして、\nおめでとうございます！"
10132-260-1 = "新年の、お願い……"
10132-270-1 = "私の、好きな人たちが……\n笑っていてくれること、\nです。えへへ……。"
10132-280-1 = "先生……！\nもし、よろしければ……\nクリスマスの街を……\n一緒に、歩きませんか？"
10132-290-1 = "ウォーキングには、\n自信がついてきたん、\nです……！"
10132-300-1 = "ハロウィーンの仮装、\nにしても……"
10132-310-1 = "派手すぎ、ますよね？"
10132-320-1 = "え……もっとすごい\n格好の人がいるから、\n大丈夫……？"
10132-340-1 = "うぅっ……。"
10132-350-1 = "なんとか、フェンスは\n越えられました、けど……。"
10132-360-1 = "服が引っかかって……。"
10132-370-1 = "動けない、です……。"
10132-380-1 = "うぅ……ごめんなさい……。"
10132-390-1 = "私が、近道を\nしようとしたから……。"
10132-400-1 = "……あれ？\n先生は、どうやって\n向こう側に……？"
10132-410-1 = "えっ？\nフェンスの横に、\nくぐり戸……！？"
10132-420-1 = "ううぅ……\nそうとも知らず、\n私は……。"
10132-430-1 = "……先生……私の服、\n少し引っ張っていただいても、\n良いでしょうか？"
10132-2600-1 = "私……これからも精一杯、\n頑張り、ます。\nみなさんと、\n立派な忍者になる、ために……！"
