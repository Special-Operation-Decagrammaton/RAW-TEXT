10041-400-1 = "โชคดี...\nที่คุณครูอยู่ที่นั่นนะ"
10041-410-1 = "ตอนนี้ก็ยังไม่ค่อยเข้าใจเหตุผล\nที่แสดงความยินดีในวันเกิดเท่าไร"
10041-420-1 = "ถ้าไม่เกิดมาตั้งแต่แรก\nก็คงไม่ต้องมานั่งเสียใจ\nกับการลาจากหรอก..."
