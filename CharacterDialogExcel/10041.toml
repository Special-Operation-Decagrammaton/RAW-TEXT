10041-450-1 = "คือว่า... ขอบคุณนะ"
10041-460-1 = "ผ่านไปอีกหนึ่งปีแล้วสินะ\nในปีนี้จะเกิดอะไรขึ้นบ้าง\nก็ไม่รู้นะ..."
