10041-480-1 = "ฉันไม่ได้คิดจะทำ\nให้เสียบรรยากาศเลย...\nฉันจะนั่งเงียบๆ แล้วกัน"
10041-490-1 = "ขอโทษนะแต่ว่า...\nฉันไม่สนใจทริกออร์ทรีตหรอก"
10041-500-1 = "อะไรนะ...?\nฉันต้องเลือกเหรอ?\nว่าจะหลอกหรือเอาลูกกวาด?"
10041-510-1 = "นั่นเป็น... คำสั่งเหรอ?"
10041-530-1 = "คุณครู...?\nกลับมาแล้วเหรอ?"
10041-540-1 = "ลืมของสำคัญไว้รึไง?"
10041-550-1 = "ฉันเหรอ...?"
10041-560-1 = "เป็นห่วงฉันงั้นเหรอ?"
10041-570-1 = "คุณครูเนี่ยมีเวลาใส่ใจ\nเรื่องไม่เป็นเรื่องแบบนี้ด้วยเหรอ"
10041-580-1 = "คงจะว่างมากล่ะสิ\nทั้งที่เป็นผู้ใหญ่แท้ๆ..."
10041-590-1 = "ทั้งโลกที่เย็นชา น่าหนวกหู\nแล้วก็ตัวฉันเอง..."
10041-600-1 = "ต่อให้ฝนตกลงมาชำระล้าง\nก็ไม่มีทางใสสะอาดขึ้น"
10041-610-1 = "แต่ถ้าฉันหลอกตัวเอง...\nให้เชื่อว่าไม่ใช่แบบนั้นได้ละก็..."
10041-2600-1 = "ฉันจะไม่ถามหาเหตุผลอีกหรอก...\nแต่ฉันไม่เคยได้ของแบบนี้มาก่อนเลย\nในโลกของฉันน่ะ ไม่มีคนอย่างคุณหรอก\nเป็นคนแปลกจริงๆ เลยนะ แต่ว่าตอนนี้\nฉันจะเชื่อใจคุณครูก็แล้วกัน"
