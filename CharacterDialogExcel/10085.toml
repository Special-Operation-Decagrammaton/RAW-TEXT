[translation]
10085-10-1 = "ブルー、アーカイブ。"
10085-20-1 = "電波が届かない状況…\nハッカーにとっては過酷な環境だけど、ヴェリタスの\nメンバーだもの、この程度で諦めたりしないよ。"
10085-30-1 = "ここ、\n暖かくていいな…。"
10085-40-1 = "（あの格好…\n寒くないのかな…）"
10085-50-1 = "「妖怪MAX」を一杯。\n割らずに…\nストレートで。"
10085-60-1 = "（快適過ぎる…\nここから永遠に\n出たくないなぁ…）"
10085-70-1 = "（変な名前の\nWi-Fiが\nいっぱい…）"
10085-80-1 = "ううっ…出かけるの？\n今から？"
10085-90-1 = "もうちょっとここに\n居たいんだけど…。"
10085-100-1 = "待ってたよ、先生。"
10085-110-1 = "…寒くない？\nコーヒー淹れようか？"
10085-120-1 = "最近のキャンプ用ベッドって、\n結構良さげなのが多いんだ…"
10085-130-1 = "一個買って部室に\n置こうかな…"
10085-140-1 = "キャンプ装備のほとんどは\n組み立てが簡単だから、"
10085-150-1 = "インドア派の生徒にも\n需要があると思う。"
10085-160-1 = "…もちろん、\n片付けはその何倍も\n面倒くさいんだけど。"
10085-170-1 = "キャンプ場で食べる\nレトルト食品って、なんで\nあんなに美味しいのかな？"
10085-180-1 = "次の機会があったら、\n「妖怪MAX」を全種類持って\n行って飲み比べてみたいかも。"
10085-190-1 = "にぎやかな場所で\nコーディングを\nしていると、"
10085-200-1 = "キャンプ場の静寂が\n少しだけ、恋しくなる。"
10085-210-1 = "ネットのない時代は\nどうやって暇つぶしを\nしてたんだろ…？"
10085-220-1 = "先生、今日誕生日でしょ？"
10085-230-1 = "プレゼントというには\n違うかもだけど、欲しい\n情報があったら言って。"
10085-240-1 = "なんでも調べるよ。"
10085-250-1 = "私に関する情報でも…\n別にいいよ。"
10085-260-1 = "誕生日プレゼント…？\nわざわざ、いいのに…"
10085-270-1 = "…じゃあ、カフェラテを一杯、\n淹れてくれる？\n練乳入りの、濃いめで。"
10085-280-1 = "明けましておめでとう、先生。"
10085-290-1 = "さっき、ミレニアムタワーの\n前で甘酒を配ってたよ。"
10085-300-1 = "結構甘くて美味しかった…"
10085-310-1 = "甘酒味の\n「妖怪MAX」とか、\nいいかも。"
10085-320-1 = "人がたくさん…\nみんな、こんな寒いのに\nよく外に出られるね。"
10085-330-1 = "クリスマスイブを最も快適に\n過ごせる場所は、ふかふかで\n温かいお布団の中なのに。"
10085-340-1 = "……変な意味じゃないよ！？"
10085-350-1 = "ハロウィーンの予定？"
10085-360-1 = "お菓子をたくさん買って、\nみんなとゲームするつもり。"
10085-370-1 = "毎年この時期は、\n好きなホラーゲームの\n新作が出るからね。"
10085-390-1 = "空が、光でいっぱい…。"
10085-400-1 = "こんなに\nきらきらした夜空は、\nはじめてかも。"
10085-410-1 = "あの光一つ一つが、\n膨大な情報を持つ\nノードだと思うと"
10085-420-1 = "なんか、畏敬の念すら\n覚えるかも。"
10085-430-1 = "私の知っている\n情報をすべて重ねても"
10085-440-1 = "あの光には、\n届かないんだろうな…"
10085-450-1 = "…それでも私は、諦めない。"
10085-460-1 = "真理は必ず、\n光を向くものだから。"
10085-470-1 = "空の上にある遠くの星へ、\n敬意を込めた挨拶を。"
10085-480-1 = "こんにちは、お元気ですか？"
10085-2600-1 = "山登りで改めて銃の重さを\n思い知った…今度、\n軽量モデルに改造してみようかな。"
