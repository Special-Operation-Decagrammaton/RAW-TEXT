[translation]
10147-10 = "블루~ 아카이브~"
10147-20 = "불렀어, 선생? 자아, 자아.\n천 년의 협력을 약속해달라고."
10147-30 = "여기는 선크림,\n필요 없으려나……."
10147-40 = "빙글빙글,\n빙글빙글……\n좋아, 이 정도로\n연습해 둘까."
10147-50 = "이용객의\n밀집도가 높네.\n위험 요소가\n늘어나고 있어……."
10147-60 = "선생은\n어디 있을까.\n서로 보호해 주기로\n했는데."
10147-70 = "저건 좀 위험해\n보이는데……."
10147-80 = "선생~ 기다리고 있었다구."
10147-90 = "안전 대책은 완벽하니까,\n안심해."
10147-100 = "후후, 이제야 오다니."
10147-110 = "오늘 할 일\n정리는 해뒀어."
10147-120 = "응? 왜?\n집중력이 좀 흐트러진 거야?"
10147-130 = "후후, 별수 없네."
10147-140 = "집중하기 좋은\n최면이라도 걸어줄까."
10147-150 = "꺅! 방금 발목에\n닿은 건 뭐야?!\n미지의 위협이……!"
10147-160 = "아, 선생의 발이었구나.\n깜짝 놀랐어……."
10147-170 = "정말, 방심할 수가 없네~"
10147-180 = "업무 시간 50분에,\n휴식 10분."
10147-190 = "이렇게 하는 편이 능률을\n훨씬 올릴 수 있다구."
10147-200 = "컨디션 챙겨야지, 선생.\n선생의 건강이\n무엇보다도 중요하니까."
10147-210 = "선생과 함께 있으면,\n왠지 안심이 된단 말이야."
10147-220 = "어디 가서 뭘 하고 있는지\n걱정하지 않아도 되니까,\n그래서일까……?"
10147-230 = "할 일 끝났어?"
10147-240 = "그럼, 내 앞에 앉도록 해."
10147-250 = "그래. 그렇게……"
10147-260 = "남은 시간 동안\n나만 바라보고 있어."
10147-270 = "후후,\n오늘은 선생의 생일이지?"
10147-280 = "이 정도 정보는\n파악하고 있었어."
10147-290 = "자아, 원하는 선물을\n말해보도록 해.\n뭐든 괜찮다구?"
10147-300 = "오늘은 특별한 날이야.\n알고 있어?"
10147-310 = "후후, 선물은……"
10147-320 = "굳이 필요 없지."
10147-330 = "선생이 내 앞에 있는걸."
10147-340 = "새해 복 많이 받아, 선생."
10147-350 = "올해도 내 옆에서\n생존 확률을 높여보자구."
10147-360 = "크리스마스에는\n다들 들뜬 분위기가 되지."
10147-370 = "나?"
10147-380 = "……그렇네.\n조금은 들떠있을지도."
10147-390 = "그야,\n당신과 함께 있는걸."
10147-400 = "Trick or\ntreat~!"
10147-410 = "최면이랑 장난,\n둘 중에 뭐가 더 좋아?"
10147-420 = "원하는 걸 해줄 테니……\n자아."
10147-440 = "생각해 보니,\n늘 그랬던 것 같아."
10147-450 = "선생은 항상 내 옆에서\n함께 걸어줬어."
10147-460 = "내가 매번\n제멋대로 굴어도,"
10147-470 = "당신을 고문하거나,\n최면을 걸어도,"
10147-480 = "무슨 일이든,\n불평하지 않고\n함께 해주었어."
10147-490 = "……나를 지켜준다고\n말해줘서, 고마워."
10147-500 = "무서워할 때\n손을 잡아줘서 고마워."
10147-510 = "언제든 달려와줘서\n고마워."
10147-520 = "그러니까,"
10147-530 = "앞으로도……\n부탁할게, 선생."
10147-2600 = "어머, 나를 위해 준비한 거야?\n어쩐다.\n지금 답례할 만한 게 없는데.\n뭐, 아쉽다면…… 나라도?"
