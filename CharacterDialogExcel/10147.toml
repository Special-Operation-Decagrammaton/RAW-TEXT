[translation]
10147-10-1 = "ブル～アーカイブ～"
10147-20-1 = "あら、呼んだかしら、先生？\nこれから幾千年の協力を約束して頂戴？"
10147-30-1 = "ここでは\n日焼け止めは……\nいらないのかしら。"
10147-40-1 = "ぐ～るぐ～る……\nぐ～るぐ～る……。\n練習はこのくらいで\n良いかしら。"
10147-50-1 = "人口密度が\n上がっている……。\n危険度が\n上がってきたわね。"
10147-60-1 = "先生は\nどこにいるのかしら。\n背中を\n預け合いたいのに。"
10147-70-1 = "あれは……\nなんだか危険な\n香りがするわ。"
10147-80-1 = "待っていたのよ、先生。"
10147-90-1 = "ここは万全の\n安全対策をしているわ。\n安心して頂戴。"
10147-100-1 = "ふふっ、待ちくたびれたわよ？"
10147-110-1 = "今日の仕事は\nそこにまとめてあるわ。"
10147-120-1 = "あら、どうかしたのかしら？\n集中力が切れたの？"
10147-130-1 = "ふふっ、仕方ないわね。"
10147-140-1 = "集中力をあげる催眠を\nかけてあげる。"
10147-150-1 = "きゃっ！\n足に何かが当たって……\nみ、未知の脅威！？"
10147-160-1 = "あ、先生の足だったのね。\nびっくりした……。"
10147-170-1 = "はぁ……気を緩められないわね。"
10147-180-1 = "業務時間50分に、\n休憩10分。"
10147-190-1 = "これがより効率的な\n作業の進め方よ。"
10147-200-1 = "体調には気をつけるのよ、先生。\nあなたの健康が\n何よりも大事なのだから。"
10147-210-1 = "先生と一緒にいると、\nなんだか落ち着くわ。"
10147-220-1 = "あなたが何をしているのか\n気を揉まなくて済むからかも\nしれないわね。"
10147-230-1 = "仕事は終わったかしら？"
10147-240-1 = "なら、私の前に座りなさい。"
10147-250-1 = "ええ、そうよ……。"
10147-260-1 = "後の時間は、\n私だけを見ていて頂戴。"
10147-270-1 = "ふふっ、\n今日は先生の誕生日ね？"
10147-280-1 = "もちろん、\nそれくらい把握しているわよ。"
10147-290-1 = "さあ、ほしいものを\n言ってみなさい。\nなんでもいいのよ？"
10147-300-1 = "今日は特別な日――\nあなたなら、知っているわよね？"
10147-310-1 = "ふふっ、プレゼントは……。"
10147-320-1 = "要らないわ。だって先生が――"
10147-330-1 = "あなたが、\n目の前にいるんだもの。"
10147-340-1 = "あけましておめでとう、先生。"
10147-350-1 = "今年も私のそばで\n生存率を上げていきましょうね？"
10147-360-1 = "クリスマスって、\nみんなが浮かれるのよね。"
10147-370-1 = "私？"
10147-380-1 = "……そうね。\nちょっとだけ浮かれているわ。"
10147-390-1 = "だって、\nあなたと一緒にいるのだもの。"
10147-400-1 = "Trick or\ntreat～！"
10147-410-1 = "催眠とイタズラ、\n先生はどっちが好きかしら？"
10147-420-1 = "ほら……\n選んで頂戴。"
10147-440-1 = "思い返せば、\nいつもそうだったわね。"
10147-450-1 = "先生は私の隣を\n歩いてくれた。"
10147-460-1 = "どんなわがままを\n言っても――"
10147-470-1 = "あなたを拷問したり、\n催眠をかけてみたりしても。"
10147-480-1 = "どんなことだって、\n文句も言わずに\n付き合ってくれた。"
10147-490-1 = "……私を守るって\n言ってくれて、ありがとう。"
10147-500-1 = "怖がっているとき、\n手を握ってくれてありがとう。"
10147-510-1 = "いつでも駆けつけてきてくれて、\nありがとう。"
10147-520-1 = "だから――"
10147-530-1 = "これからも……\nよろしくね、先生。"
10147-2600-1 = "あら、私のために用意してくれたの？\nありがとう、先生。\nでもお礼がないわね……\n私を好きにする権利、とかどうかしら？"
