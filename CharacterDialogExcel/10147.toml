[translation]
10147-10 = "Blue~ Archive~"
10147-20 = "เรียกฉันเหรอ ครู? เอาละ เอาละ\nสัญญาสิว่าจะร่วมมือกันไปอีกพันปี"
10147-30 = "ตรงนี้ครีมกันแดด\nคงไม่จำเป็นมั้ง..."
10147-40 = "หมุนๆ วนๆ\nหมุนๆ วนๆ...\nดีละ ซ้อมไว้เท่านี้\nก่อนแล้วกัน"
10147-50 = "ผู้มาใช้บริการหนาแน่น\nเลยนะ\nปัจจัยเสี่ยงกำลังเพิ่มขึ้น..."
10147-60 = "แล้วครูอยู่ที่ไหนกันนะ\nตกลงกันแล้วว่าจะช่วย\nปกป้องซึ่งกันและกันนี่นา"
10147-70 = "นั่นมันดู\nอันตรายนิดหน่อยนะ..."
10147-80 = "ครู~ ฉันกำลังรออยู่เลย"
10147-90 = "มาตรการความปลอดภัย\nสมบูรณ์แบบแล้ว วางใจเถอะ"
10147-100 = "ฮุฮุ เพิ่งจะมาเอาตอนนี้เหรอ"
10147-110 = "ฉันจัดเตรียมงานที่\nต้องทำวันนี้ไว้แล้ว"
10147-120 = "หืม? ทำไมเหรอ?\nสมาธิเริ่มหลุดแล้วหรือไง?"
10147-130 = "ฮุฮุ ก็ช่วยไม่ได้สินะ"
10147-140 = "ให้ฉันช่วยสะกดจิต\nให้มีสมาธิดีๆ ให้มั้ย?"
10147-150 = "ว้าย! เมื่อกี้อะไร\nมาแตะข้อเท้าฉันน่ะ?!\nภัยคุกคามที่ไม่รู้จัก...!"
10147-160 = "อ่า เท้าของครูนี่เอง\nตกใจหมดเลย..."
10147-170 = "ให้ตายสิ ประมาทไม่ได้เลยนะ~"
10147-180 = "ทำงาน 50 นาที\nพัก 10 นาที"
10147-190 = "ทำแบบนี้จะช่วยเพิ่ม\nประสิทธิภาพได้มากกว่านะ"
10147-200 = "ดูแลสภาพร่างกายด้วยสิ ครู\nสุขภาพของครูสำคัญกว่า\nทุกอย่างเลยนะ"
10147-210 = "เวลาอยู่กับครู ทำไมถึง\nรู้สึกสบายใจก็ไม่รู้นะ"
10147-220 = "เพราะไม่ต้องกังวลว่าไปไหน\nและไปทำอะไรอยู่\nหรือเปล่านะ...?"
10147-230 = "งานเสร็จแล้วเหรอ?"
10147-240 = "ถ้างั้นก็มานั่งตรงหน้าฉันสิ"
10147-250 = "ใช่ แบบนั้นแหละ..."
10147-260 = "ช่วงเวลาที่เหลือ\nมองแค่ฉันก็พอ"
10147-270 = "ฮุฮุ วันนี้คือ\nวันเกิดของครูใช่มั้ย?"
10147-280 = "ข้อมูลแค่นี้\nฉันสืบไว้แล้วละ"
10147-290 = "เอาละ บอกมาสิว่า\nอยากได้ของขวัญอะไร\nบอกได้ทุกอย่างเลยนะ"
10147-300 = "วันนี้เป็นวันพิเศษนะ\nรู้หรือเปล่า?"
10147-310 = "ฮุฮุ ของขวัญน่ะ..."
10147-320 = "ไม่จำเป็นหรอก"
10147-330 = "ก็ครูอยู่ตรงหน้าฉันแล้วนี่นา"
10147-340 = "สวัสดีปีใหม่นะ ครู"
10147-350 = "ปีนี้ก็มาเพิ่มโอกาสรอดชีวิต\nข้างๆ ฉันต่อไปนะ"
10147-360 = "คริสต์มาสเป็นวันที่\nทุกคนต่างก็ตื่นเต้นกัน"
10147-370 = "ฉันเหรอ?"
10147-380 = "นั่นสินะ... อาจจะ\nตื่นเต้นอยู่นิดหน่อยก็ได้"
10147-390 = "ก็เพราะว่า\nได้อยู่กับคุณไง"
10147-400 = "Trick or\nTreat~!"
10147-410 = "ระหว่างสะกดจิตกับแกล้งเล่น\nชอบแบบไหนมากกว่ากัน?"
10147-420 = "ฉันจะทำสิ่งที่ครูต้องการให้...\nเอาละ"
10147-440 = "พอลองคิดดูแล้ว\nเหมือนจะเป็นแบบนั้นมาตลอดเลย"
10147-450 = "ครูคอยเดินเคียงข้าง\nฉันอยู่เสมอ"
10147-460 = "ต่อให้ฉันจะ\nเอาแต่ใจอยู่ทุกครั้ง"
10147-470 = "จะทรมานคุณ\nหรือสะกดจิตใส่คุณ"
10147-480 = "ไม่ว่าจะเรื่องอะไร\nคุณก็ไม่บ่น\nและอยู่ด้วยกันเสมอ"
10147-490 = "ขอบคุณที่บอกว่า\nจะปกป้องฉันนะ..."
10147-500 = "ขอบคุณที่จับมือฉัน\nตอนที่ฉันกลัว"
10147-510 = "ขอบคุณที่รีบมาหา\nไม่ว่าเมื่อไร"
10147-520 = "เพราะงั้น"
10147-530 = "ต่อจากนี้ก็...\nฝากด้วยนะ ครู"
10147-2600 = "ตายจริง เตรียมไว้ให้ฉันเหรอ?\nทำยังไงดีล่ะ ตอนนี้ฉันไม่มี\nของอะไรตอบแทนเลยน่ะสิ\nถ้าเสียดายละก็... เอาฉันไปแทนมั้ย?"
