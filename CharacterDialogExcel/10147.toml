[translation]
10147-10 = "Blue Archive!"
10147-20 = "Did you call me, Sensei? Now, now. Pledge your cooperation for the next thousand years."
10147-30 = "I wonder if I need sunscreen here..."
10147-40 = "Round and round, round and round... Okay, that's enough practice for now."
10147-50 = "This place is crowded with people. The risk factors are increasing..."
10147-60 = "I wonder where Sensei is at. We promised to protect each other."
10147-70 = "That looks a bit dangerous..."
10147-80 = "Seeensei, I've been waiting for you."
10147-90 = "My safety practices are perfect, so be at ease."
10147-100 = "Fufu, you're finally here."
10147-110 = "I've already organized today's tasks."
10147-120 = "Hm? Why? Are you having trouble focusing?"
10147-130 = "Fufu, there's no way around it."
10147-140 = "I can put you under hypnosis to increase your focus."
10147-150 = "Kyah?! What just touched my ankle?! I'm sensing unknown danger...!"
10147-160 = "Ah, it was just your foot. You scared me..."
10147-170 = "Geez, I can't let my guard down for a second!"
10147-180 = "Work for 50 minutes, then take a 5 minute break."
10147-190 = "This method can help boost your efficiency."
10147-200 = "You should take care of yourself, Sensei. Nothing is more important than your health."
10147-210 = "For some reason, being next to you helps me relax."
10147-220 = "Maybe because I don't have to worry about what you're doing or where you are?"
10147-230 = "Are you done with work?"
10147-240 = "Then, come sit in front of me."
10147-250 = "Yes. Just like that..."
10147-260 = "Look at nothing but me for the rest of our time."
10147-270 = "Fufu, isn't today your birthday?"
10147-280 = "I already knew that much."
10147-290 = "Now, tell me the gift you want. Whatever you want."
10147-300 = "Today is a special day. Did you know that?"
10147-310 = "Fufu, as for my gift..."
10147-320 = "I don't need one."
10147-330 = "Since I already have you."
10147-340 = "Happy New Year, Sensei."
10147-350 = "You should stay by my side if you want to increase your odds of survival this next year."
10147-360 = "Everyone gets excited around Christmas."
10147-370 = "Me?"
10147-380 = "...You're right. I might be a little bit excited."
10147-390 = "Because I'm with you, after all."
10147-400 = "Trick or treat!"
10147-410 = "Hypnosis or a trick, which do you prefer?"
10147-420 = "I'll do...whatever you want."
10147-440 = "Come to think of it, it's always been that way."
10147-450 = "You've always stayed by my side."
10147-460 = "Even when I acted as I pleased."
10147-470 = "Even when I tortured you and hypnotized you."
10147-480 = "Thank you... For always staying with me."
10147-490 = "Thank you for saying you'll protect me."
10147-500 = "Thank you for holding my hand when I was scared."
10147-510 = "Thank you for being there whenever I needed you."
10147-520 = "So..."
10147-530 = "I will continue...to be in your care."
10147-2600 = "Huh, you prepared this for me? What should I do? I have nothing to repay you with. I suppose, in that case... I could be your payment?"
