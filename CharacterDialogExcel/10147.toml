[translation]
10147-10 = "蔚藍～檔案～"
10147-20 = "哎呀，你叫我嗎，老師？\n答應我今後數千年的合作吧？"
10147-30 = "在這裡……\n應該不需要\n防曬乳吧。"
10147-40 = "轉～啊轉……\n轉～啊轉……\n練習到這種程度\n應該夠了吧。"
10147-50 = "人口密度正在提高……\n危險程度也上升了呢。"
10147-60 = "老師在哪裡呢。明明\n想和他互相依靠的說。"
10147-70 = "那個……\n總覺得散發著\n危險的氣息。"
10147-80 = "我一直在等你哦，老師。"
10147-90 = "這裡已經做好\n萬全的安全措施。\n放心吧。"
10147-100 = "呵呵，我等到都累了哦？"
10147-110 = "今天的工作都\n整理在那裡了。"
10147-120 = "哎呀，怎麼了嗎？\n注意力無法集中了？"
10147-130 = "呵呵，真拿你沒辦法。"
10147-140 = "我來對你施加能提升\n注意力的催眠吧。"
10147-150 = "呀啊！有東西碰到我的腳……\n未，未知的威脅！？"
10147-160 = "啊，原來是老師的腳啊。\n嚇了我一跳……"
10147-170 = "唉……真是一刻\n都不能鬆懈呢。"
10147-180 = "工作五十分鐘，\n休息十分鐘。"
10147-190 = "這樣才是更有效率\n的工作方式。"
10147-200 = "要注意身體狀況哦，老師。\n你的健康比什麼都重要。"
10147-210 = "和老師在一起，\n總覺得很安心。"
10147-220 = "或許是因為不用擔心\n你在做什麼吧。"
10147-230 = "工作結束了嗎？"
10147-240 = "那麼，坐到我面前吧。"
10147-250 = "沒錯，就是這樣……"
10147-260 = "剩下的時間，\n只允許你看著我。"
10147-270 = "呵呵，今天是\n老師的生日吧？"
10147-280 = "當然，這點情報\n我早就掌握了。"
10147-290 = "來，說說你想要\n什麼禮物吧。\n什麼都可以哦？"
10147-300 = "今天是特別的日子──\n是你的話，應該知道吧？"
10147-310 = "呵呵，至於禮物……"
10147-320 = "不需要。因為老師──"
10147-330 = "你就在我的眼前。"
10147-340 = "新年快樂，老師。"
10147-350 = "今年也待在我身邊，\n一起提高生存率吧？"
10147-360 = "聖誕節，總是會讓\n大家興奮起來呢。"
10147-370 = "我？"
10147-380 = "……是啊。\n或許也有點興奮吧。"
10147-390 = "因為，我正和你在一起。"
10147-400 = "Trick or treat～！"
10147-410 = "催眠和惡作劇，\n老師喜歡哪一個？"
10147-420 = "來……選一個吧。"
10147-440 = "回想起來，好像\n一直都是這樣呢。"
10147-450 = "老師總是走在\n我的身旁。"
10147-460 = "不管提出多麼\n任性的要求──"
10147-470 = "無論是拷問你，\n或是試著對你催眠。"
10147-480 = "無論什麼事，\n你都毫無怨言地陪著我。"
10147-490 = "……謝謝你說會保護我。"
10147-500 = "謝謝你在我害怕的時候，\n握住我的手。"
10147-510 = "謝謝你無論何時，\n都會趕來我身邊。"
10147-520 = "所以──"
10147-530 = "今後也請你……\n多多指教囉，老師。"
10147-2600 = "哎呀，是為我準備的嗎？\n謝謝你，老師。\n但我沒有回禮呢……\n給你隨意對待我的權利，怎麼樣？"
