[translation]
10147-10 = "ブル～アーカイブ～"
10147-20 = "あら、呼んだかしら、先生？\nこれから幾千年の協力を約束して頂戴？"
10147-30 = "ここでは\n日焼け止めは……\nいらないのかしら。"
10147-40 = "ぐ～るぐ～る……\nぐ～るぐ～る……。\n練習はこのくらいで\n良いかしら。"
10147-50 = "人口密度が\n上がっている……。\n危険度が\n上がってきたわね。"
10147-60 = "先生は\nどこにいるのかしら。\n背中を\n預け合いたいのに。"
10147-70 = "あれは……\nなんだか危険な\n香りがするわ。"
10147-80 = "待っていたのよ、先生。"
10147-90 = "ここは万全の\n安全対策をしているわ。\n安心して頂戴。"
10147-100 = "ふふっ、待ちくたびれたわよ？"
10147-110 = "今日の仕事は\nそこにまとめてあるわ。"
10147-120 = "あら、どうかしたのかしら？\n集中力が切れたの？"
10147-130 = "ふふっ、仕方ないわね。"
10147-140 = "集中力をあげる催眠を\nかけてあげる。"
10147-150 = "きゃっ！\n足に何かが当たって……\nみ、未知の脅威！？"
10147-160 = "あ、先生の足だったのね。\nびっくりした……。"
10147-170 = "はぁ……気を緩められないわね。"
10147-180 = "業務時間50分に、\n休憩10分。"
10147-190 = "これがより効率的な\n作業の進め方よ。"
10147-200 = "体調には気をつけるのよ、先生。\nあなたの健康が\n何よりも大事なのだから。"
10147-210 = "先生と一緒にいると、\nなんだか落ち着くわ。"
10147-220 = "あなたが何をしているのか\n気を揉まなくて済むからかも\nしれないわね。"
10147-230 = "仕事は終わったかしら？"
10147-240 = "なら、私の前に座りなさい。"
10147-250 = "ええ、そうよ……。"
10147-260 = "後の時間は、\n私だけを見ていて頂戴。"
10147-270 = "ふふっ、\n今日は先生の誕生日ね？"
10147-280 = "もちろん、\nそれくらい把握しているわよ。"
10147-290 = "さあ、ほしいものを\n言ってみなさい。\nなんでもいいのよ？"
10147-300 = "今日は特別な日――\nあなたなら、知っているわよね？"
10147-310 = "ふふっ、プレゼントは……。"
10147-320 = "要らないわ。だって先生が――"
10147-330 = "あなたが、\n目の前にいるんだもの。"
10147-340 = "あけましておめでとう、先生。"
10147-350 = "今年も私のそばで\n生存率を上げていきましょうね？"
10147-360 = "クリスマスって、\nみんなが浮かれるのよね。"
10147-370 = "私？"
10147-380 = "……そうね。\nちょっとだけ浮かれているわ。"
10147-390 = "だって、\nあなたと一緒にいるのだもの。"
10147-400 = "Trick or\ntreat～！"
10147-410 = "催眠とイタズラ、\n先生はどっちが好きかしら？"
10147-420 = "ほら……\n選んで頂戴。"
10147-440 = "思い返せば、\nいつもそうだったわね。"
10147-450 = "先生は私の隣を\n歩いてくれた。"
10147-460 = "どんなわがままを\n言っても――"
10147-470 = "あなたを拷問したり、\n催眠をかけてみたりしても。"
10147-480 = "どんなことだって、\n文句も言わずに\n付き合ってくれた。"
10147-490 = "……私を守るって\n言ってくれて、ありがとう。"
10147-500 = "怖がっているとき、\n手を握ってくれてありがとう。"
10147-510 = "いつでも駆けつけてきてくれて、\nありがとう。"
10147-520 = "だから――"
10147-530 = "これからも……\nよろしくね、先生。"
10147-2600 = "あら、私のために用意してくれたの？\nありがとう、先生。\nでもお礼がないわね……\n私を好きにする権利、とかどうかしら？"
