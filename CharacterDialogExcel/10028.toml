[translation]
10028-10-1 = "Blue Archive."
10028-20-1 = "Ta-da! Look, Master! I'm Bunny Asuna!"
10028-30-1 = "Hop hop! I'm Bunny Asuna!"
10028-40-1 = "This place looks very interesting!"
10028-50-1 = "Hahahahahaha! What's this? Fun!"
10028-60-1 = "Hmm, I wonder where Master is? Shall I start looking?"
10028-70-1 = "It's not uncommon to see a bunny like me at a theme park, right?"
10028-80-1 = "There you are, Master! Me and my cute bunny outfit have been waiting!"
10028-90-1 = "What's your favorite part of it, Master? The ears? The tail? Or...?"
10028-100-1 = "Hmm? What's wrong? I thought you liked it. Do you want to try it on for yourself?"
10028-110-1 = "It's natural for bunnies to seek attention."
10028-120-1 = "That's why you have to pet them, Master!"
10028-130-1 = "Hahahahaha! It tickles, Master!"
10028-140-1 = "Hmm. I'm kinda bored."
10028-150-1 = "But you know, I'm happy as long as you're here, Master!"
10028-160-1 = "Can a pet bunny be taken for a walk?"
10028-170-1 = "Wanna try it, Master?"
10028-180-1 = "Happy birthday, Master! It's your birthday, so here's your gift: a cute bunny girl Asuna!"
10028-190-1 = "Do you know what day it is, Master?"
10028-200-1 = "Haha. That means you have to play with me even more today than you usually do!"
10028-210-1 = "A new year has begun, Master! I'll be staying by your side yet again."
10028-220-1 = "Merry Christmas, Master!"
10028-230-1 = "Huh? Why am I dressed up as a bunny on Christmas?"
10028-240-1 = "I'm Bunny Santa!"
10028-250-1 = "Everyone is wearing something fun. I think my outfit counts too, though."
10028-260-1 = "Come on, Master! Here we go!"
10028-280-1 = "Huh? What are you doing at this hour, Master?"
10028-290-1 = "Me? Isn't it obvious? I'm here to do laundry!"
10028-300-1 = "...Why am I dressed like this to do laundry?"
10028-310-1 = "It's because everything else is being washed."
10028-320-1 = "I'm washing all of my underwear right now, so I have nothing else."
10028-330-1 = "What? I'm not lying! Want to see for yourself?"
10028-340-1 = "Hahaha. Your face is red! But why are you here, Master?"
10028-350-1 = "Huh? You're here to see me? At this hour?"
10028-360-1 = "Awesome! I was getting bored by myself!"
10028-370-1 = "Thank you, Master! So, what should we play?"
10028-2600-1 = "Ta-da! It's done! Bunny Asuna is complete!"
