[translation]
10141-10-1 = "蔚藍……檔……案。"
10141-20-1 = "這，這身打扮可能不太得體……\n不，不過還請多多指教……"
10141-30-1 = "（這身打扮……\n不會被覺得\n太得意忘形吧……？）"
10141-40-1 = "我看看，\n最不起眼的地方在……"
10141-50-1 = "咖啡……\n好香的味道……\n耶嘿嘿。"
10141-60-1 = "應該不會\n一路追到……\n這裡來吧？"
10141-70-1 = "當作伴手禮的話……\n一，一定會很開心吧？"
10141-80-1 = "您，您好，老師！"
10141-90-1 = "啊……我，我穿禮服的樣子……"
10141-100-1 = "果，果然很奇怪，\n是嗎……？"
10141-110-1 = "歡，歡迎回來，老師！"
10141-120-1 = "那個……我想打起精神，\n所以換上了這身打扮……"
10141-130-1 = "請隨時下達命令……！\n我有準備很多炸彈！"
10141-140-1 = "那，那個……\n請問有什麼需要\n幫忙的嗎？"
10141-150-1 = "……咦？可以休息嗎？"
10141-160-1 = "可，可是，\n現在是工作時間，\n沒錯吧……"
10141-170-1 = "被，被這樣盯著看……"
10141-180-1 = "好，好害羞……"
10141-190-1 = "竭盡人事……\n傾盡全力……\n不擇手段……"
10141-200-1 = "祝您生日快樂，老師。"
10141-210-1 = "如，如果我這樣的人\n送的祝福也可以的話……\n還，還請收下！"
10141-220-1 = "生，生日……\n我的嗎！？\n咦，咦咦！？"
10141-230-1 = "您要替我慶生嗎！？"
10141-240-1 = "怎，怎麼辦……\n我還沒做好派對的準備……"
10141-250-1 = "祝您新年快樂……"
10141-260-1 = "那個……\n這可是一年的開始哦……？"
10141-270-1 = "和我這種人一起度過，\n真的好嗎……？"
10141-280-1 = "聖誕快樂……！"
10141-290-1 = "如果老師希望的話……\n我可以把聖誕老人抓來！"
10141-300-1 = "不給糖就搗蛋！"
10141-310-1 = "啊，糖果……\n沒有的話子彈也可以……！"
10141-320-1 = "……這，這樣對嗎？"
10141-340-1 = "……我喜歡雜草，\n並不是因為，它很美麗。"
10141-350-1 = "我喜歡雜草那堅強的一面。"
10141-360-1 = "無論在多麼貧瘠的地方\n都能堅強地紮根，\n頑強地生存──"
10141-370-1 = "那正是，我的理想。"
10141-380-1 = "沒有必要保持美麗。"
10141-390-1 = "就算不耀眼也沒關係。"
10141-400-1 = "只要能和重要的人\n一起度過……"
10141-410-1 = "只，只要能和老師\n在一起的話……"
10141-420-1 = "我就是因為這樣……"
10141-430-1 = "……才會喜歡的。"
10141-2600-1 = "我這種人哪有資格收下這個……\n沒，沒事……這是老師決定的事。\n謝謝您！"
