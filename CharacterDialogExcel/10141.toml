[translation]
10141-10-1 = "Blue... Ar... chive..."
10141-20-1 = "ชุดนี้อาจจะดูน่าอายสักหน่อย...\nตะ... แต่ก็ขอฝากตัวด้วยนะคะ... "
10141-30-1 = "(พอใส่ชุดนี้... ทุกคน\nจะคิดว่าฉันทำตัวเด่น\nหรือเปล่าคะ...?)"
10141-40-1 = "มีที่นั่งตรงไหน\nในมุมที่ลับตาคน\nบ้างมั้ยนะ... "
10141-50-1 = "กาแฟกลิ่นหอมจังเลย\nนะคะ... แหะๆ"
10141-60-1 = "พวกศัตรู...\nคงไม่ไล่ตามมา\nถึงที่แบบนี้หรอกใช่มั้ยคะ?"
10141-70-1 = "ถ้าซื้อเป็นของที่ระลึกละก็...\nทะ... ทุกคนต้อง\nถูกใจแน่นอนใช่มั้ยคะ?"
10141-80-1 = "สะ... สวัสดีค่ะ คุณครู!"
10141-90-1 = "ชุดนี้ "
10141-100-1 = "มะ... มันแปลกใช่มั้ยคะ...?"
10141-110-1 = "ชะ... เชิญค่ะ คุณครู! "
10141-120-1 = "คือว่า ชุดนี้น่ะ\nใส่มาเพื่อเสริมความมุ่งมั่น\nแบบจริงจังขึ้นอีกขั้น...!"
10141-130-1 = "ช่วยออกคำสั่งด้วยค่ะ...!\nฉันมีระเบิดเหลือเฟือเลยค่ะ!"
10141-140-1 = "มะ... มีอะไรจะสั่งให้ฉันทำมั้ยคะ?"
10141-150-1 = "ให้ฉันพักผ่อนได้เลยงั้นเหรอคะ?"
10141-160-1 = "ตะ... แต่ว่า นี่ก็เป็น\nภารกิจที่ปฏิเสธไม่ได้ด้วย... "
10141-170-1 = "ถะ... ถ้ายังจ้องฉันแบบนั้น"
10141-180-1 = "ฉันก็เขินนิดหน่อยนะคะ..."
10141-190-1 = "ฉันจะพยายามเต็มที่...\nด้วยกำลังทั้งหมดที่มี...\nโดยไม่เกี่ยงวิธีการเลย... "
10141-200-1 = "สุขสันต์วันเกิดค่ะ คุณครู "
10141-210-1 = "ถะ... ถ้าคุณครูไม่ว่าอะไร\nกับการที่คนอย่างฉันจะอวยพรให้\nกะ... ก็ช่วยรับไว้ด้วยนะคะ"
10141-220-1 = "วันเกิดฉันเหรอคะ?!"
10141-230-1 = "ทะ... ทำยังไงดีล่ะคะ?! "
10141-240-1 = "ฉันไม่ได้เตรียมปาร์ตี้วันเกิด\nหรืออะไรแบบนั้นไว้เลย...\nอึก..."
10141-250-1 = "สวัสดีปีใหม่ค่ะ..."
10141-260-1 = "เอ่อ... นี่เป็น\nวันแรกของปีใหม่เลยนะคะ...?"
10141-270-1 = "มาอยู่กับคนอย่างฉัน\nจะไม่เป็นไรเหรอคะ...?"
10141-280-1 = "เมอร์รีคริสต์มาสค่ะ\nคุณครู...!"
10141-290-1 = "ถ้าต้องการละก็\nฉันจะไปเอาตัวซานต้ามาให้ค่ะ...!"
10141-300-1 = "ทริก ออร์ ทรีต!"
10141-310-1 = "อ่า... จะเลือกลูกกวาด...\nหรือว่าลูกกระสุน...!"
10141-320-1 = "บะ... แบบนี้ก็ได้เหรอคะ? "
10141-340-1 = "ที่ฉันชอบพวกวัชพืช...\nไม่ใช่เพราะมันสวยงามหรอกค่ะ"
10141-350-1 = "ฉันชอบความทรหดของวัชพืชค่ะ"
10141-360-1 = "ถึงจะอยู่ในพื้นที่แห้งแล้ง\nก็ยังหยั่งรากลึกอย่างแข็งแกร่ง\nความอุตสาหะนั่นน่ะ..."
10141-370-1 = "คืออุดมคติของฉัน..."
10141-380-1 = "ไม่จำเป็นต้องมีรูปลักษณ์\nที่สวยงามหรอกค่ะ"
10141-390-1 = "ต่อให้ไม่เปล่งประกาย\nก็ไม่เป็นไรค่ะ"
10141-400-1 = "ขอแค่ได้อยู่ร่วมกับ\nคนที่สำคัญ..."
10141-410-1 = "ถะ... ถ้าได้\nอยู่กับคุณครู..."
10141-420-1 = "แค่นั้นฉันก็..."
10141-430-1 = "ดีใจ... แล้วค่ะ "
10141-2600-1 = "ฉันรับของแบบนี้ไว้ได้ด้วยเหรอ...\nมะ... ไม่ค่ะ... คุณครูตั้งใจ\nเอามาให้แล้วนี่คะ ขอบคุณค่ะ!"
