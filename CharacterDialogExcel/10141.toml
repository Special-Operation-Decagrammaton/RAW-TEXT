[translation]
10141-10-1 = "ブルー……アーカイ……ブ。"
10141-20-1 = "お、お見苦しい格好かもしれませんが……\nよ、よろしくお願いします……。"
10141-30-1 = "（この格好……\n調子に乗っていると\n思われない\nでしょうか……？）"
10141-40-1 = "えっと、\n一番目立たない\n場所は……。"
10141-50-1 = "コーヒー、\nいい匂い……えへへ。"
10141-60-1 = "ここにまで\n追ってきたりは\n……ないですよね？"
10141-70-1 = "お土産にしたら……\nき、きっと\n喜んでくれますよね？"
10141-80-1 = "こ、こんにちは、先生！"
10141-90-1 = "あ……ど、ドレス姿、"
10141-100-1 = "や、やっぱり変、\nでしょうか……？"
10141-110-1 = "お、おかえりなさい、先生！"
10141-120-1 = "ええと……\n気を引き締めようと思って、\nこの格好にしたのですが……。"
10141-130-1 = "いつでも命令してください……！\n爆弾はたくさんありますので！"
10141-140-1 = "あ、あの……\n何か御用はありませんか？"
10141-150-1 = "……え？休んでていい？"
10141-160-1 = "で、ですが、\n今は仕事中、ですよね……。"
10141-170-1 = "そ、そんなに\n見つめられると……"
10141-180-1 = "は、恥ずかしいです……。"
10141-190-1 = "人事を尽くして……\n全力で……\n手段は問わずに……。"
10141-200-1 = "お誕生日おめでとうございます、\n先生。"
10141-210-1 = "わ、私からの\nお祝いなんかでよければ……\nどうぞ、受け取ってください！"
10141-220-1 = "た、誕生日……私の！？\nえっ、ええっ！？"
10141-230-1 = "祝ってくださるんですか！？"
10141-240-1 = "ど、どうしましょう……\nパーティーの\n準備なんてできてなくて……。"
10141-250-1 = "明けましておめでとう\nございます……。"
10141-260-1 = "あの……\n一年の始まりですよ……？"
10141-270-1 = "私なんかと過ごしていて\n本当にいいんですか……？"
10141-280-1 = "メリークリスマス、です……！"
10141-290-1 = "先生がご希望でしたら……\nサンタを捕獲してきます！"
10141-300-1 = "トリックオアトリート！"
10141-310-1 = "あ、飴――\nがなければ弾丸を……！"
10141-320-1 = "……こ、これで合ってますか？"
10141-340-1 = "……雑草が好きなのは、\n美しいからじゃ、ないです。"
10141-350-1 = "私は、雑草の硬いところが\n好きなんです。"
10141-360-1 = "どんな荒地でも\n強く根を張る、粘り強さ――"
10141-370-1 = "それこそが、私の理想。"
10141-380-1 = "美しくある必要はありません。"
10141-390-1 = "輝かなくてもいいんです。"
10141-400-1 = "大切な人と、\nただ過ごせるなら……。"
10141-410-1 = "せ、先生と\n一緒にいられるのなら……。"
10141-420-1 = "私は、それで……。"
10141-430-1 = "……好き、なんです。"
10141-2600-1 = "私なんかがこれをいただく資格なんて……\nい、いえ……先生が決めたことです。\nありがとうございます！"
