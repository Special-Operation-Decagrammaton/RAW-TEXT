[translation]
10141-10 = "Blue... Ar... chive..."
10141-20 = "ชุดนี้อาจจะดูน่าอายสักหน่อย...\nตะ... แต่ก็ขอฝากตัวด้วยนะคะ... "
10141-30 = "(พอใส่ชุดนี้... ทุกคน\nจะคิดว่าฉันทำตัวเด่น\nหรือเปล่าคะ...?)"
10141-40 = "มีที่นั่งตรงไหน\nในมุมที่ลับตาคน\nบ้างมั้ยนะ... "
10141-50 = "กาแฟกลิ่นหอมจังเลย\nนะคะ... แหะๆ"
10141-60 = "พวกศัตรู...\nคงไม่ไล่ตามมา\nถึงที่แบบนี้หรอกใช่มั้ยคะ?"
10141-70 = "ถ้าซื้อเป็นของที่ระลึกละก็...\nทะ... ทุกคนต้อง\nถูกใจแน่นอนใช่มั้ยคะ?"
10141-80 = "สะ... สวัสดีค่ะ คุณครู!"
10141-90 = "ชุดนี้ "
10141-100 = "มะ... มันแปลกใช่มั้ยคะ...?"
10141-110 = "ชะ... เชิญค่ะ คุณครู! "
10141-120 = "คือว่า ชุดนี้น่ะ\nใส่มาเพื่อเสริมความมุ่งมั่น\nแบบจริงจังขึ้นอีกขั้น...!"
10141-130 = "ช่วยออกคำสั่งด้วยค่ะ...!\nฉันมีระเบิดเหลือเฟือเลยค่ะ!"
10141-140 = "มะ... มีอะไรจะสั่งให้ฉันทำมั้ยคะ?"
10141-150 = "ให้ฉันพักผ่อนได้เลยงั้นเหรอคะ?"
10141-160 = "ตะ... แต่ว่า นี่ก็เป็น\nภารกิจที่ปฏิเสธไม่ได้ด้วย... "
10141-170 = "ถะ... ถ้ายังจ้องฉันแบบนั้น"
10141-180 = "ฉันก็เขินนิดหน่อยนะคะ..."
10141-190 = "ฉันจะพยายามเต็มที่...\nด้วยกำลังทั้งหมดที่มี...\nโดยไม่เกี่ยงวิธีการเลย... "
10141-200 = "สุขสันต์วันเกิดค่ะ คุณครู "
10141-210 = "ถะ... ถ้าคุณครูไม่ว่าอะไร\nกับการที่คนอย่างฉันจะอวยพรให้\nกะ... ก็ช่วยรับไว้ด้วยนะคะ"
10141-220 = "วันเกิดฉันเหรอคะ?!"
10141-230 = "ทะ... ทำยังไงดีล่ะคะ?! "
10141-240 = "ฉันไม่ได้เตรียมปาร์ตี้วันเกิด\nหรืออะไรแบบนั้นไว้เลย...\nอึก..."
10141-250 = "สวัสดีปีใหม่ค่ะ..."
10141-260 = "เอ่อ... นี่เป็น\nวันแรกของปีใหม่เลยนะคะ...?"
10141-270 = "มาอยู่กับคนอย่างฉัน\nจะไม่เป็นไรเหรอคะ...?"
10141-280 = "เมอร์รีคริสต์มาสค่ะ\nคุณครู...!"
10141-290 = "ถ้าต้องการละก็\nฉันจะไปเอาตัวซานต้ามาให้ค่ะ...!"
10141-300 = "ทริก ออร์ ทรีต!"
10141-310 = "อ่า... จะเลือกลูกกวาด...\nหรือว่าลูกกระสุน...!"
10141-320 = "บะ... แบบนี้ก็ได้เหรอคะ? "
10141-340 = "ที่ฉันชอบพวกวัชพืช...\nไม่ใช่เพราะมันสวยงามหรอกค่ะ"
10141-350 = "ฉันชอบความทรหดของวัชพืชค่ะ"
10141-360 = "ถึงจะอยู่ในพื้นที่แห้งแล้ง\nก็ยังหยั่งรากลึกอย่างแข็งแกร่ง\nความอุตสาหะนั่นน่ะ..."
10141-370 = "คืออุดมคติของฉัน..."
10141-380 = "ไม่จำเป็นต้องมีรูปลักษณ์\nที่สวยงามหรอกค่ะ"
10141-390 = "ต่อให้ไม่เปล่งประกาย\nก็ไม่เป็นไรค่ะ"
10141-400 = "ขอแค่ได้อยู่ร่วมกับ\nคนที่สำคัญ..."
10141-410 = "ถะ... ถ้าได้\nอยู่กับคุณครู..."
10141-420 = "แค่นั้นฉันก็..."
10141-430 = "ดีใจ... แล้วค่ะ "
10141-2600 = "ฉันรับของแบบนี้ไว้ได้ด้วยเหรอ...\nมะ... ไม่ค่ะ... คุณครูตั้งใจ\nเอามาให้แล้วนี่คะ ขอบคุณค่ะ!"
