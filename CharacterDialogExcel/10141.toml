[translation]
10141-10 = "蔚藍……檔……案。"
10141-20 = "這，這身打扮可能不太得體……\n不，不過還請多多指教……"
10141-30 = "（這身打扮……\n不會被覺得\n太得意忘形吧……？）"
10141-40 = "我看看，\n最不起眼的地方在……"
10141-50 = "咖啡……\n好香的味道……\n耶嘿嘿。"
10141-60 = "應該不會\n一路追到……\n這裡來吧？"
10141-70 = "當作伴手禮的話……\n一，一定會很開心吧？"
10141-80 = "您，您好，老師！"
10141-90 = "啊……我，我穿禮服的樣子……"
10141-100 = "果，果然很奇怪，\n是嗎……？"
10141-110 = "歡，歡迎回來，老師！"
10141-120 = "那個……我想打起精神，\n所以換上了這身打扮……"
10141-130 = "請隨時下達命令……！\n我有準備很多炸彈！"
10141-140 = "那，那個……\n請問有什麼需要\n幫忙的嗎？"
10141-150 = "……咦？可以休息嗎？"
10141-160 = "可，可是，\n現在是工作時間，\n沒錯吧……"
10141-170 = "被，被這樣盯著看……"
10141-180 = "好，好害羞……"
10141-190 = "竭盡人事……\n傾盡全力……\n不擇手段……"
10141-200 = "祝您生日快樂，老師。"
10141-210 = "如，如果我這樣的人\n送的祝福也可以的話……\n還，還請收下！"
10141-220 = "生，生日……\n我的嗎！？\n咦，咦咦！？"
10141-230 = "您要替我慶生嗎！？"
10141-240 = "怎，怎麼辦……\n我還沒做好派對的準備……"
10141-250 = "祝您新年快樂……"
10141-260 = "那個……\n這可是一年的開始哦……？"
10141-270 = "和我這種人一起度過，\n真的好嗎……？"
10141-280 = "聖誕快樂……！"
10141-290 = "如果老師希望的話……\n我可以把聖誕老人抓來！"
10141-300 = "不給糖就搗蛋！"
10141-310 = "啊，糖果……\n沒有的話子彈也可以……！"
10141-320 = "……這，這樣對嗎？"
10141-340 = "……我喜歡雜草，\n並不是因為，它很美麗。"
10141-350 = "我喜歡雜草那堅強的一面。"
10141-360 = "無論在多麼貧瘠的地方\n都能堅強地紮根，\n頑強地生存──"
10141-370 = "那正是，我的理想。"
10141-380 = "沒有必要保持美麗。"
10141-390 = "就算不耀眼也沒關係。"
10141-400 = "只要能和重要的人\n一起度過……"
10141-410 = "只，只要能和老師\n在一起的話……"
10141-420 = "我就是因為這樣……"
10141-430 = "……才會喜歡的。"
10141-2600 = "我這種人哪有資格收下這個……\n沒，沒事……這是老師決定的事。\n謝謝您！"
