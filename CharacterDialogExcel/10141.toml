[translation]
10141-10-1 = "Blue... Archive..."
10141-20-1 = "Th-This outfit is a little embarrassing...but I look forward to working together... "
10141-30-1 = "(This outfit... Won't people think I'm over-dressed...?) "
10141-40-1 = "Wh-Where is the most secluded corner here...?"
10141-50-1 = "The smell of coffee is so nice... Heehee..."
10141-60-1 = "Our enemies...won't chase me all the way out here, right?"
10141-70-1 = "If I buy this as a souvenir... S-Surely, everyone will like it, right?"
10141-80-1 = "H-Hello, Sensei!"
10141-90-1 = "This outfit... "
10141-100-1 = "I-Is it weird...?"
10141-110-1 = "W-Welcome, Sensei! "
10141-120-1 = "I-I'm just dressed this way...to put myself in the right mindset!"
10141-130-1 = "Just give me your orders...! I have plenty of bombs!"
10141-140-1 = "I-Is there anything you'd like to ask me?"
10141-150-1 = "I can take it easy?"
10141-160-1 = "B-But this is also part of a mission... "
10141-170-1 = "I-If you keep staring at me like that..."
10141-180-1 = "I'm going to get embarrassed..."
10141-190-1 = "I'll do my very best... I'll use all my strength... No matter what it takes... "
10141-200-1 = "Happy birthday, Sensei. "
10141-210-1 = "I-If you're okay with celebrating your birthday with someone like me... P-Please accept this..."
10141-220-1 = "My birthday?!"
10141-230-1 = "Wh-What should I do?! "
10141-240-1 = "I never done something like a birthday party before... Auuugh..."
10141-250-1 = "Happy New Year..."
10141-260-1 = "Um... It's the first day of the new year, you know...?"
10141-270-1 = "Are you really okay with spending it...with me...?"
10141-280-1 = "Merry Christmas, Sensei...!"
10141-290-1 = "If you need me to, I'll go capture Santa or whatever else...!"
10141-300-1 = "Trick or treat!"
10141-310-1 = "Ah, candy...or bullet...!"
10141-320-1 = "...D-Did I do that right? "
10141-340-1 = "...I don't like weeds for their looks."
10141-350-1 = "I like how resilient they are."
10141-360-1 = "The tenacity with which they take root, even in the most barren of places..."
10141-370-1 = "I think that's the ideal, for me."
10141-380-1 = "It doesn't have to be pretty."
10141-390-1 = "Nor does it have to shine."
10141-400-1 = "As long as I can be with those who are precious to me..."
10141-410-1 = "A-As long as I can be with Sensei..."
10141-420-1 = "For me..."
10141-430-1 = "...that's what I like. "
10141-2600-1 = "Do I really deserve something like—n-no... You've decided that I do. Thank you very much!"
