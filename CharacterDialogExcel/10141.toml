[translation]
10141-10 = "Blue... Archive..."
10141-20 = "Th-This outfit is a little embarrassing...but I look forward to working together... "
10141-30 = "(This outfit... Won't people think I'm over-dressed...?) "
10141-40 = "Wh-Where is the most secluded corner here...?"
10141-50 = "The smell of coffee is so nice... Heehee..."
10141-60 = "Our enemies...won't chase me all the way out here, right?"
10141-70 = "If I buy this as a souvenir... S-Surely, everyone will like it, right?"
10141-80 = "H-Hello, Sensei!"
10141-90 = "This outfit... "
10141-100 = "I-Is it weird...?"
10141-110 = "W-Welcome, Sensei! "
10141-120 = "I-I'm just dressed this way...to put myself in the right mindset!"
10141-130 = "Just give me your orders...! I have plenty of bombs!"
10141-140 = "I-Is there anything you'd like to ask me?"
10141-150 = "I can take it easy?"
10141-160 = "B-But this is also part of a mission... "
10141-170 = "I-If you keep staring at me like that..."
10141-180 = "I'm going to get embarrassed..."
10141-190 = "I'll do my very best... I'll use all my strength... No matter what it takes... "
10141-200 = "Happy birthday, Sensei. "
10141-210 = "I-If you're okay with celebrating your birthday with someone like me... P-Please accept this..."
10141-220 = "My birthday?!"
10141-230 = "Wh-What should I do?! "
10141-240 = "I never done something like a birthday party before... Auuugh..."
10141-250 = "Happy New Year..."
10141-260 = "Um... It's the first day of the new year, you know...?"
10141-270 = "Are you really okay with spending it...with me...?"
10141-280 = "Merry Christmas, Sensei...!"
10141-290 = "If you need me to, I'll go capture Santa or whatever else...!"
10141-300 = "Trick or treat!"
10141-310 = "Ah, candy...or bullet...!"
10141-320 = "...D-Did I do that right? "
10141-340 = "...I don't like weeds for their looks."
10141-350 = "I like how resilient they are."
10141-360 = "The tenacity with which they take root, even in the most barren of places..."
10141-370 = "I think that's the ideal, for me."
10141-380 = "It doesn't have to be pretty."
10141-390 = "Nor does it have to shine."
10141-400 = "As long as I can be with those who are precious to me..."
10141-410 = "A-As long as I can be with Sensei..."
10141-420 = "For me..."
10141-430 = "...that's what I like. "
10141-2600 = "Do I really deserve something like—n-no... You've decided that I do. Thank you very much!"
