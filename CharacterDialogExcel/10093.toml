[translation]
10093-10-1 = "ブルーアーカイブ～"
10093-20-1 = "あっ！先生だ！ヤッホー！キララだよ！\nあたしのこと待ってたの？あははっ！嬉しいな！"
10093-30-1 = "どっかに友達に\nなれそうな子、\n居ないかな～"
10093-40-1 = "結構広い場所だね！\n超気に入ったかも！"
10093-50-1 = "あっ？先生！\n先生！こっち！"
10093-60-1 = "角度をこうしたら……\nうん！自撮りに\nぴったりかも！"
10093-70-1 = "ここのカフェ、パフェも\n売ってるのかな？甘い\nもの食べたいんだけど～"
10093-80-1 = "おっはよ～先生！\n今日も忙しい？"
10093-90-1 = "今日のお当番は\nキララちゃんです～"
10093-100-1 = "超ドキドキしない？\n先生もそう思う？"
10093-110-1 = "昨日友達と行ったカフェがね、\nホントすごかったの！\n今度一緒行こ！"
10093-120-1 = "先生、ちょっと疲れてない？\nあっちで一休みしよっか？"
10093-130-1 = "うわぁ……この仕事量、\nあたしだったら諦めてたかも！\n先生、有能なんだね～"
10093-140-1 = "先生、昨日の自撮り見る？\nどう？可愛いでしょ～"
10093-150-1 = "え？スマホの壁紙に……？"
10093-160-1 = "そ、それはちょっと\n恥ずかしいかもぉ！？"
10093-170-1 = "仕事なんてササッと終わらせて、\n遊びに行こうよ！"
10093-180-1 = "お誕生日おめでとう、先生！"
10093-190-1 = "プレゼントは……あたしだよ！"
10093-200-1 = "今日一日、先生とずっと\n一緒だから、よろしくね！"
10093-210-1 = "あははっ！\nやっぱ覚えててくれたんだ！"
10093-220-1 = "ありがと！\nおかげで元気100%回復だよ！"
10093-230-1 = "今年は去年より、\n超キラキラで、\nもっとワイワイしてほしいなあ！"
10093-240-1 = "あ、先生！\nメリークリスマス！"
10093-250-1 = "この飴？先生にあげるね！\nはい、あ～んして！"
10093-270-1 = "どうしたの？先生。\nもじもじして。"
10093-280-1 = "そんなんじゃ、\n休み時間終わっちゃうよ？"
10093-290-1 = "あ～もしかして、\nペディキュアの\n塗り方わからないとか？"
10093-300-1 = "やり方は簡単だよ！\nまず塗るところをよ～く見て……"
10093-310-1 = "ひゃっ……う、うん！\nそうやって！"
10093-320-1 = "そ、その……\n顔、近すぎじゃないかなあ……\nあははっ！"
10093-330-1 = "先生、鼻息めっちゃ\n当たるんだけど……？"
10093-340-1 = "せ、先生に任せるのは、\nやっぱちょっと\n恥ずかしいかも……。"
10093-350-1 = "あははっ！ううん！\nな、なんでもないよ！"
10093-360-1 = "早く塗って、勉強に戻ろ！"
10093-2600-1 = "先生…これ、あたしにくれるの？\nさ、サンキュー！\nううん、こういう時は\n真面目に言うべきだね。\nありがとう、先生。"
