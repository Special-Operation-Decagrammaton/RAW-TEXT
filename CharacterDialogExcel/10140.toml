[translation]
10140-10-1 = "Blue Archive."
10140-20-1 = "I'm Takakura Kurumi, the point woman for SRT Academy's FOX Squad. Leave the leading to me, Sensei. I'll protect you to the best of my abilities. That said... I look forward to working with you!"
10140-30-1 = "(That gun accessory is cute... I wonder where she bought it.)"
10140-40-1 = "(I just might...might be the most mature one here!)"
10140-50-1 = "That clean window is shining...just like my shield."
10140-60-1 = "Ugh, my muscles are sore... Did I push myself too hard in training yesterday?"
10140-70-1 = "Be proud... Stand up straight... Because I'm a veteran!"
10140-80-1 = "Huh? Welcome, Sensei. You seem happy today. Did something happen?"
10140-90-1 = "You're here, Sensei."
10140-100-1 = "What kind of mission am I taking today?"
10140-110-1 = "Fufu, you can rely on me more."
10140-120-1 = "I'm an elite member of SRT, so I can do anything!"
10140-130-1 = "Hmm..."
10140-140-1 = "Hm?! I-It's nothing!"
10140-150-1 = "No, there's really nothing wrong..."
10140-160-1 = "It's just... I was just thinking hardworking adults are cool."
10140-170-1 = "...Don't laugh! It's embarrassing!"
10140-180-1 = "The weather is nice today..."
10140-190-1 = "Maybe I'll go see my juniors at the park after I'm done."
10140-200-1 = "When FOX 4 Otogi gets engrossed in something, she completely tunnel visions."
10140-210-1 = "She might not even notice if a bomb went off in the area."
10140-220-1 = "...Well, if something did happen, I'd be the first one by her side."
10140-230-1 = "Um... Do board members of the General Student Council come to Schale too?"
10140-240-1 = "W-Well... No, it's nothing important."
10140-250-1 = "But it'd be a little awkward if I ran into someone I fought with during the ambush..."
10140-260-1 = "Happy birthday, Sensei."
10140-270-1 = "Um, I didn't have a chance to get you a gift, so..."
10140-280-1 = "...Do you want to touch my ears instead?"
10140-290-1 = "My birthday...? "
10140-300-1 = "H-How'd you know, Sensei?"
10140-310-1 = "You heard it from someone else? I see..."
10140-320-1 = "N-Not half bad, I guess. Th-Thank you!"
10140-330-1 = "Happy New Year, Sensei."
10140-340-1 = "I'm going to make some bets over Hanetsuki with other squad members soon. Do you want in?"
10140-350-1 = "I love Christmas season... The whole town glistens and sparkles."
10140-360-1 = "...I'd love it even more if I didn't have training, though."
10140-370-1 = "Isn't everyone getting a bit too excited about the festival?"
10140-380-1 = "You should take extra precautions on days like this, as crime rates tend to rise."
10140-390-1 = "...Hm? There's something on my mouth?"
10140-400-1 = "I-I just test-tasted some pumpkin soup, okay?"
10140-420-1 = "Wh-What? When did you get here, Sensei?"
10140-430-1 = "I-I'm not! I'm not nervous at all!"
10140-440-1 = "It's just... I'm having a bit of a tough time getting the timing right..."
10140-450-1 = "\"Look over here\""
10140-460-1 = "\"One. Two. Three.\""
10140-470-1 = "H-Haha."
10140-480-1 = "Ugh... I closed my eyes again."
10140-490-1 = "For some reason, the counting makes me nervous."
10140-500-1 = "N-No, wait. I never get nervous! I just closed my eyes without thinking..."
10140-510-1 = "\"Look over here\""
10140-520-1 = "Here I go...!"
10140-530-1 = "\"One. Two. Three.\""
10140-540-1 = "Haha."
10140-550-1 = "Why?! Why do I keep closing my eyes?!"
10140-2600-1 = "Confirming receipt of FOX 45-Submachine Gun. I wish it had a bit more firepower... Oh well, my role is to protect the squad, not to crush the enemy, after all."
