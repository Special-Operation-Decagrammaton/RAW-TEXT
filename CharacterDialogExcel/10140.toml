[translation]
10140-10-1 = "Blue Archive"
10140-20-1 = "ทาคาคุระ คุรุมิ พ็อยนต์แมนของกองทหาร FOX\nจากสถาบันพิเศษ SRT ให้การคุ้มกันคุณครูเป็นหน้าที่ของฉันเอง\nฉันจะปกป้องอย่างสุดกำลังเลยละ ถ้างั้นก็... ฝากตัวด้วยนะ!"
10140-30-1 = "(ของประดับของปืนอันนั้น\nน่ารักจัง...\nไปซื้อมาจากไหนนะ?)"
10140-40-1 = "(บางที... ฉันอาจจะ\nอายุมากที่สุดในนี้ก็ได้!)"
10140-50-1 = "หน้าต่างขัดขึ้นเงา\nจนระยิบระยับ...\nเหมือนกับโล่ของฉันเลยนะ"
10140-60-1 = "อึก... ปวดกล้ามเนื้อจัง...\nหรือว่าเมื่อวาน\nฝึกหนักมากเกินไป?"
10140-70-1 = "ยืดอก...\nอย่างมั่นใจ...\nก็ฉันเป็นผู้เชี่ยวชาญนี่นา!"
10140-80-1 = "เอ๋? เข้ามาสิ คุณครู\nวันนี้ดูอารมณ์ดีจังเลยนะ\nมีเรื่องอะไรงั้นเหรอ?"
10140-90-1 = "กำลังรออยู่เลย คุณครู"
10140-100-1 = "วันนี้ให้ฉันทำ\nปฏิบัติการอะไรล่ะ?"
10140-110-1 = "ฮุฮุ จะพึ่งพาฉัน\nมากกว่านี้อีกหน่อยก็ได้นะ"
10140-120-1 = "นักเรียนหัวกะทิของ SRT\nทำได้ทุกอย่างอยู่แล้ว!"
10140-130-1 = "อืม..."
10140-140-1 = "หืม?! มะ... ไม่มีอะไรทั้งนั้น!"
10140-150-1 = "เปล่าหรอก\nไม่ได้มีปัญหาอะไร..."
10140-160-1 = "ฉันแค่... คิดว่าผู้ใหญ่ที่\nตั้งใจทำงานน่ะเท่ดีจัง"
10140-170-1 = "อย่ามาขำกันสิ...! ฉันอายนะ!"
10140-180-1 = "วันนี้อากาศดีจัง..."
10140-190-1 = "เสร็จงานแล้วไปหารุ่นน้อง\nที่สวนสาธารณะดีมั้ยนะ?"
10140-200-1 = "FOX 4... โอโทกิน่ะ\nเวลาจดจ่อกับอะไร\nก็เหมือนจะไม่สนใจรอบข้างเลย"
10140-210-1 = "ต่อให้เกิดเหตุระเบิดใกล้ๆ\nก็แทบจะไม่รับรู้เลยละ"
10140-220-1 = "แต่ก็นะ ถ้าเกิดเรื่องอะไรขึ้นมา\nฉันก็คงวิ่งไปหาก่อนอยู่ดี"
10140-230-1 = "เอ่อ... กรรมการองค์การนักเรียน\nก็แวะมาที่ชาเล่ต์ด้วยเหรอ?"
10140-240-1 = "คะ... คือว่า...\nเปล่า ไม่มีอะไรมากหรอก"
10140-250-1 = "ก็ถ้าเจอคนที่เคยสู้กัน\nในการจู่โจมครั้งก่อน\nฉันน่าจะทำตัวไม่ถูก..."
10140-260-1 = "สุขสันต์วันเกิดนะ คุณครู"
10140-270-1 = "เอ่อ วันนี้ฉัน\nไม่ได้เตรียมของขวัญมา..."
10140-280-1 = "ถ้างั้น... มาจับหูฉันมั้ยล่ะ?"
10140-290-1 = "วันเกิดฉันเหรอ...? "
10140-300-1 = "คะ... คุณครูรู้\nได้ยังไงน่ะ?"
10140-310-1 = "เคยได้ยินมาจากคนอื่นงั้นเหรอ?\nอย่างนี้เองสินะ..."
10140-320-1 = "ชะ... ใช้ได้เลยนี่นา\nขะ... ขอบคุณนะ!"
10140-330-1 = "สวัสดีปีใหม่นะ คุณครู"
10140-340-1 = "เดี๋ยวฉันจะไปแข่งเล่นฮาเนะสึกิ\nกับสมาชิกกองทหารคนอื่น\nคุณครูก็ไปเล่นด้วยกันมั้ย?"
10140-350-1 = "ช่วงคริสต์มาสนี่ดีจริงๆ เลยนะ~\nสว่างไสววิบวับไปทั่วเลย~"
10140-360-1 = "ถ้าไม่มีการฝึกซ้อม\nก็น่าจะดีกว่านี้น่ะนะ..."
10140-370-1 = "ทุกคนทำตัวตื่นเต้นร่าเริง\nกับเทศกาลมากไปหรือเปล่า?"
10140-380-1 = "วันแบบนี้น่ะเกิดอาชญากรรม\nได้ง่าย ต้องระวังให้มากกว่านี้สิ"
10140-390-1 = "หืม...? ตรงมุมปากเหรอ?"
10140-400-1 = "มะ... มีซุปฟักทองให้ชิมฟรี\nฉันก็แค่ไปชิมมาเท่านั้นเองนะ?"
10140-420-1 = "อะ... อะไรน่ะ? คุณครู\nมาตั้งแต่ตอนไหน?"
10140-430-1 = "ฉะ... ฉันไม่ได้ประหม่า\nอะไรสักหน่อย!"
10140-440-1 = "ฉันก็แค่...\nรู้สึกว่าการกะจังหวะ\nมันค่อนข้างยากน่ะ..."
10140-450-1 = "<มองตรงนี้นะคะ>"
10140-460-1 = "<หนึ่ง สอง สาม>"
10140-470-1 = "อะ... อ๊ะ"
10140-480-1 = "อึก... เผลอหลับตาอีกจนได้"
10140-490-1 = "พอได้ยินใครนับเลข\nฉันก็จะประหม่าขึ้นมาแปลกๆ น่ะ"
10140-500-1 = "มะ... ไม่สิ ไม่ได้ประหม่า!\nแค่มันชอบหลับตาอัตโนมัติ\nไปเองต่างหาก"
10140-510-1 = "<มองตรงนี้นะคะ>"
10140-520-1 = "มาแล้ว...!"
10140-530-1 = "<หนึ่ง สอง สาม>"
10140-540-1 = "อ๊ะ"
10140-550-1 = "เอาอีกแล้ว! ทำไมฉันถึง\nเอาแต่หลับตาล่ะเนี่ย!"
10140-2600-1 = "ได้รับปืนกลมือ FOX รุ่น 45 มาแล้ว\nถึงจะอยากให้ยิงแรงกว่านี้ก็เถอะ...\nก็นะ หน้าที่ของฉันคือการคุ้มครอง\nกองทหาร ไม่ใช่จัดการศัตรูนี่เนอะ"
