[translation]
10140-10 = "Blue Archive."
10140-20 = "I'm Takakura Kurumi, the point woman for SRT Academy's FOX Squad. Leave the leading to me, Sensei. I'll protect you to the best of my abilities. That said... I look forward to working with you!"
10140-30 = "(That gun accessory is cute... I wonder where she bought it.)"
10140-40 = "(I just might...might be the most mature one here!)"
10140-50 = "That clean window is shining...just like my shield."
10140-60 = "Ugh, my muscles are sore... Did I push myself too hard in training yesterday?"
10140-70 = "Be proud... Stand up straight... Because I'm a veteran!"
10140-80 = "Huh? Welcome, Sensei. You seem happy today. Did something happen?"
10140-90 = "You're here, Sensei."
10140-100 = "What kind of mission am I taking today?"
10140-110 = "Fufu, you can rely on me more."
10140-120 = "I'm an elite member of SRT, so I can do anything!"
10140-130 = "Hmm..."
10140-140 = "Hm?! I-It's nothing!"
10140-150 = "No, there's really nothing wrong..."
10140-160 = "It's just... I was just thinking hardworking adults are cool."
10140-170 = "...Don't laugh! It's embarrassing!"
10140-180 = "The weather is nice today..."
10140-190 = "Maybe I'll go see my juniors at the park after I'm done."
10140-200 = "When FOX 4 Otogi gets engrossed in something, she completely tunnel visions."
10140-210 = "She might not even notice if a bomb went off in the area."
10140-220 = "...Well, if something did happen, I'd be the first one by her side."
10140-230 = "Um... Do board members of the General Student Council come to Schale too?"
10140-240 = "W-Well... No, it's nothing important."
10140-250 = "But it'd be a little awkward if I ran into someone I fought with during the ambush..."
10140-260 = "Happy birthday, Sensei."
10140-270 = "Um, I didn't have a chance to get you a gift, so..."
10140-280 = "...Do you want to touch my ears instead?"
10140-290 = "My birthday...? "
10140-300 = "H-How'd you know, Sensei?"
10140-310 = "You heard it from someone else? I see..."
10140-320 = "N-Not half bad, I guess. Th-Thank you!"
10140-330 = "Happy New Year, Sensei."
10140-340 = "I'm going to make some bets over Hanetsuki with other squad members soon. Do you want in?"
10140-350 = "I love Christmas season... The whole town glistens and sparkles."
10140-360 = "...I'd love it even more if I didn't have training, though."
10140-370 = "Isn't everyone getting a bit too excited about the festival?"
10140-380 = "You should take extra precautions on days like this, as crime rates tend to rise."
10140-390 = "...Hm? There's something on my mouth?"
10140-400 = "I-I just test-tasted some pumpkin soup, okay?"
10140-420 = "Wh-What? When did you get here, Sensei?"
10140-430 = "I-I'm not! I'm not nervous at all!"
10140-440 = "It's just... I'm having a bit of a tough time getting the timing right..."
10140-450 = "\"Look over here\""
10140-460 = "\"One. Two. Three.\""
10140-470 = "H-Haha."
10140-480 = "Ugh... I closed my eyes again."
10140-490 = "For some reason, the counting makes me nervous."
10140-500 = "N-No, wait. I never get nervous! I just closed my eyes without thinking..."
10140-510 = "\"Look over here\""
10140-520 = "Here I go...!"
10140-530 = "\"One. Two. Three.\""
10140-540 = "Haha."
10140-550 = "Why?! Why do I keep closing my eyes?!"
10140-2600 = "Confirming receipt of FOX 45-Submachine Gun. I wish it had a bit more firepower... Oh well, my role is to protect the squad, not to crush the enemy, after all."
