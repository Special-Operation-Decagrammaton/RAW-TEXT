[translation]
10140-10 = "Blue Archive"
10140-20 = "ทาคาคุระ คุรุมิ พ็อยนต์แมนของกองทหาร FOX\nจากสถาบันพิเศษ SRT ให้การคุ้มกันคุณครูเป็นหน้าที่ของฉันเอง\nฉันจะปกป้องอย่างสุดกำลังเลยละ ถ้างั้นก็... ฝากตัวด้วยนะ!"
10140-30 = "(ของประดับของปืนอันนั้น\nน่ารักจัง...\nไปซื้อมาจากไหนนะ?)"
10140-40 = "(บางที... ฉันอาจจะ\nอายุมากที่สุดในนี้ก็ได้!)"
10140-50 = "หน้าต่างขัดขึ้นเงา\nจนระยิบระยับ...\nเหมือนกับโล่ของฉันเลยนะ"
10140-60 = "อึก... ปวดกล้ามเนื้อจัง...\nหรือว่าเมื่อวาน\nฝึกหนักมากเกินไป?"
10140-70 = "ยืดอก...\nอย่างมั่นใจ...\nก็ฉันเป็นผู้เชี่ยวชาญนี่นา!"
10140-80 = "เอ๋? เข้ามาสิ คุณครู\nวันนี้ดูอารมณ์ดีจังเลยนะ\nมีเรื่องอะไรงั้นเหรอ?"
10140-90 = "กำลังรออยู่เลย คุณครู"
10140-100 = "วันนี้ให้ฉันทำ\nปฏิบัติการอะไรล่ะ?"
10140-110 = "ฮุฮุ จะพึ่งพาฉัน\nมากกว่านี้อีกหน่อยก็ได้นะ"
10140-120 = "นักเรียนหัวกะทิของ SRT\nทำได้ทุกอย่างอยู่แล้ว!"
10140-130 = "อืม..."
10140-140 = "หืม?! มะ... ไม่มีอะไรทั้งนั้น!"
10140-150 = "เปล่าหรอก\nไม่ได้มีปัญหาอะไร..."
10140-160 = "ฉันแค่... คิดว่าผู้ใหญ่ที่\nตั้งใจทำงานน่ะเท่ดีจัง"
10140-170 = "อย่ามาขำกันสิ...! ฉันอายนะ!"
10140-180 = "วันนี้อากาศดีจัง..."
10140-190 = "เสร็จงานแล้วไปหารุ่นน้อง\nที่สวนสาธารณะดีมั้ยนะ?"
10140-200 = "FOX 4... โอโทกิน่ะ\nเวลาจดจ่อกับอะไร\nก็เหมือนจะไม่สนใจรอบข้างเลย"
10140-210 = "ต่อให้เกิดเหตุระเบิดใกล้ๆ\nก็แทบจะไม่รับรู้เลยละ"
10140-220 = "แต่ก็นะ ถ้าเกิดเรื่องอะไรขึ้นมา\nฉันก็คงวิ่งไปหาก่อนอยู่ดี"
10140-230 = "เอ่อ... กรรมการองค์การนักเรียน\nก็แวะมาที่ชาเล่ต์ด้วยเหรอ?"
10140-240 = "คะ... คือว่า...\nเปล่า ไม่มีอะไรมากหรอก"
10140-250 = "ก็ถ้าเจอคนที่เคยสู้กัน\nในการจู่โจมครั้งก่อน\nฉันน่าจะทำตัวไม่ถูก..."
10140-260 = "สุขสันต์วันเกิดนะ คุณครู"
10140-270 = "เอ่อ วันนี้ฉัน\nไม่ได้เตรียมของขวัญมา..."
10140-280 = "ถ้างั้น... มาจับหูฉันมั้ยล่ะ?"
10140-290 = "วันเกิดฉันเหรอ...? "
10140-300 = "คะ... คุณครูรู้\nได้ยังไงน่ะ?"
10140-310 = "เคยได้ยินมาจากคนอื่นงั้นเหรอ?\nอย่างนี้เองสินะ..."
10140-320 = "ชะ... ใช้ได้เลยนี่นา\nขะ... ขอบคุณนะ!"
10140-330 = "สวัสดีปีใหม่นะ คุณครู"
10140-340 = "เดี๋ยวฉันจะไปแข่งเล่นฮาเนะสึกิ\nกับสมาชิกกองทหารคนอื่น\nคุณครูก็ไปเล่นด้วยกันมั้ย?"
10140-350 = "ช่วงคริสต์มาสนี่ดีจริงๆ เลยนะ~\nสว่างไสววิบวับไปทั่วเลย~"
10140-360 = "ถ้าไม่มีการฝึกซ้อม\nก็น่าจะดีกว่านี้น่ะนะ..."
10140-370 = "ทุกคนทำตัวตื่นเต้นร่าเริง\nกับเทศกาลมากไปหรือเปล่า?"
10140-380 = "วันแบบนี้น่ะเกิดอาชญากรรม\nได้ง่าย ต้องระวังให้มากกว่านี้สิ"
10140-390 = "หืม...? ตรงมุมปากเหรอ?"
10140-400 = "มะ... มีซุปฟักทองให้ชิมฟรี\nฉันก็แค่ไปชิมมาเท่านั้นเองนะ?"
10140-420 = "อะ... อะไรน่ะ? คุณครู\nมาตั้งแต่ตอนไหน?"
10140-430 = "ฉะ... ฉันไม่ได้ประหม่า\nอะไรสักหน่อย!"
10140-440 = "ฉันก็แค่...\nรู้สึกว่าการกะจังหวะ\nมันค่อนข้างยากน่ะ..."
10140-450 = "<มองตรงนี้นะคะ>"
10140-460 = "<หนึ่ง สอง สาม>"
10140-470 = "อะ... อ๊ะ"
10140-480 = "อึก... เผลอหลับตาอีกจนได้"
10140-490 = "พอได้ยินใครนับเลข\nฉันก็จะประหม่าขึ้นมาแปลกๆ น่ะ"
10140-500 = "มะ... ไม่สิ ไม่ได้ประหม่า!\nแค่มันชอบหลับตาอัตโนมัติ\nไปเองต่างหาก"
10140-510 = "<มองตรงนี้นะคะ>"
10140-520 = "มาแล้ว...!"
10140-530 = "<หนึ่ง สอง สาม>"
10140-540 = "อ๊ะ"
10140-550 = "เอาอีกแล้ว! ทำไมฉันถึง\nเอาแต่หลับตาล่ะเนี่ย!"
10140-2600 = "ได้รับปืนกลมือ FOX รุ่น 45 มาแล้ว\nถึงจะอยากให้ยิงแรงกว่านี้ก็เถอะ...\nก็นะ หน้าที่ของฉันคือการคุ้มครอง\nกองหทาร ไม่ใช่จัดการศัตรูนี่เนอะ"
