[translation]
10140-10 = "蔚藍檔案。"
10140-20 = "我是SRT特殊學園，FOX小隊的尖兵，高倉胡桃哦。\n老師的護衛就交給我吧，我會全力守護你的。\n就是這樣，請多指教囉。"
10140-30 = "（啊，那把槍上的\n裝飾好可愛……\n是在哪裡買的呢？）"
10140-40 = "（總覺得……\n我看起來最像\n大人……？）"
10140-50 = "這裡的窗戶\n好乾淨啊……\n簡直就像我的盾牌一樣。"
10140-60 = "嗚嗚，肌肉痠痛……\n是不是訓練過頭了呢……"
10140-70 = "堂堂正正地……\n抬頭挺胸……\n我是老手！"
10140-80 = "哎呀，歡迎回來，老師。\n你看起來心情不錯呢。\n有什麼好事嗎？"
10140-90 = "我正在等你呢，老師。"
10140-100 = "那麼，今天要執行\n哪個作戰呢？"
10140-110 = "呵呵。\n你可以更依賴我哦？"
10140-120 = "我可是SRT的精英，\n無論什麼事都能完成給你看！"
10140-130 = "唔嗯……"
10140-140 = "咦！？\n沒，沒什麼啦！"
10140-150 = "不，也不是\n有什麼特別的事……"
10140-160 = "那個……\n我只是覺得，\n專注在工作上的大人\n還不錯。"
10140-170 = "……喂！\n這是該笑的地方嗎！？"
10140-180 = "……天氣真好。"
10140-190 = "待會去看看\n後輩們過得如何吧。"
10140-200 = "FOX4……御伽他啊，\n一旦專注起來就會\n看不見周遭呢。"
10140-210 = "就算附近發生爆炸\n也不會察覺的程度。"
10140-220 = "……不過，\n情況危急的時候\n我會去支援，\n所以沒什麼問題。"
10140-230 = "夏萊這邊……\n聯邦學生會\n也會過來嗎……？"
10140-240 = "這，這樣啊……\n不，沒什麼。"
10140-250 = "只是之前\n襲擊的時候交過手，\n所以有點尷尬而已啦。"
10140-260 = "生日快樂，老師。"
10140-270 = "那個……今天，\n禮物，\n我沒準備……。"
10140-280 = "……我的耳朵\n……要摸摸看嗎？"
10140-290 = "我的生日……？"
10140-300 = "咦！\n你，你怎麼會知道？"
10140-310 = "之前聽我說過……？\n這，這樣啊……"
10140-320 = "你記性真好呢！\n謝，謝謝你！"
10140-330 = "新年快樂。"
10140-340 = "等一下，我要和小隊的大家\n比賽羽子板……\n如果方便的話，\n老師也要來嗎？"
10140-350 = "聖誕節這個季節，\n我很喜歡呢。\n整座城市都閃閃發亮的……"
10140-360 = "要是沒有訓練就更好了。"
10140-370 = "大家是不是太興奮了？"
10140-380 = "明明在這種節慶的日子，\n犯罪率反而會增加，\n更應該小心的才對。"
10140-390 = "咦？嘴角……？"
10140-400 = "真是的！我只是\n試喝了一下南瓜湯啦！"
10140-420 = "什──！\n什，什麼啊老師，\n你什麼時候來的？"
10140-430 = "我，我才沒有緊張呢！"
10140-440 = "只是……\n有點難掌握時機……"
10140-450 = "「開始拍攝──」"
10140-460 = "「三，二，一。」"
10140-470 = "嘻，嘻！"
10140-480 = "嗚……\n又閉眼睛了……"
10140-490 = "如果倒數的話，\n會莫名地有點緊張呢……"
10140-500 = "啊，不是！\n我才沒有緊張哦！\n只是會不小心\n閉上眼睛──"
10140-510 = "「開始拍攝──」"
10140-520 = "來了……！"
10140-530 = "「三，二，一。」"
10140-540 = "嘻，嘻！"
10140-550 = "真是的！又閉眼了……\n為什麼會這樣啦──！　"
10140-2600 = "FOX-45式衝鋒槍，我收下了。\n雖然火力再高一點的話我會更開心……\n算了，沒差。我的職責是小隊的尖兵。\n負責的是防守，而不是擊破。"
