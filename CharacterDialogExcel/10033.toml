[translation]
10033-10-1 = "蔚藍檔案，呼呼呼。"
10033-20-1 = "唔呵呵……終於找到了。\n不會再讓您逃走了，閣下♥\n請不要再從我身邊，離開了哦……？"
10033-30-1 = "假如是平常的話，\n是沒辦法這麼悠閒的呢……"
10033-40-1 = "唔呵呵呵呵♡"
10033-50-1 = "啊啊，閣下，\n您在哪裡呢？"
10033-60-1 = "哎呀哎呀。"
10033-70-1 = "呵呵呵，\n真令人困擾呢。"
10033-80-1 = "您回來了嗎，老師？"
10033-90-1 = "若藻我，一直於此"
10033-100-1 = "恭候著閣下的歸來。"
10033-110-1 = "恭候多時了，老師。\n呵呵呵呵呵♥"
10033-120-1 = "您期望的是什麼呢？"
10033-130-1 = "無論是任何事物，\n都已經做好準備了。"
10033-140-1 = "來吧，請對我，\n下達任何命令吧。"
10033-150-1 = "全都是閣下的所有物。\n這身體、心靈、全部。"
10033-160-1 = "您期望的事，\n請儘管說。"
10033-170-1 = "沒錯，任何事♡"
10033-180-1 = "啊啊，明明現在就想\n讓閣下緊抱著我……"
10033-190-1 = "竟然必須忍耐，\n這是多麼刻苦的試煉啊……"
10033-200-1 = "這副面具，\n您還喜歡嗎？"
10033-210-1 = "呵呵，我也非常中意。"
10033-220-1 = "如果您希望的話，\n隨時都可以摘下來唷……？"
10033-230-1 = "……面具的裡面，\n您不在意嗎？"
10033-240-1 = "閣下出生的日子……"
10033-250-1 = "這麼值得喜悅的日子\n竟然可以與閣下在一起，\n真是有如美夢。"
10033-260-1 = "哎呀，我的生日，\n您記住了嗎？"
10033-270-1 = "啊啊，好開心……\n我，已經沒有\n任何留念了……"
10033-280-1 = "祝您新年快樂。"
10033-290-1 = "希望今年也能與閣下一起，\n製造快樂的回憶。"
10033-300-1 = "聖誕節，情侶們\n究竟會做什麼事呢？"
10033-310-1 = "唔呵呵呵，我，\n對這種事情不太了解♡"
10033-320-1 = "是否可以，請您\n一步一步教導我呢？\n老．師？"
10033-330-1 = "明明這副面具\n並不是萬聖節用的。"
10033-340-1 = "剛才被路過的人詢問，\n令我的心情變得有些難過。"
10033-350-1 = "您回來了嗎，老師？"
10033-360-1 = "若藻我，一直於此"
10033-370-1 = "恭候著閣下的歸來。"
10033-380-1 = "恭候多時了，老師。\n呵呵呵呵呵♥"
10033-390-1 = "您期望的是什麼呢？"
10033-400-1 = "無論是任何事物，\n都已經做好準備了。"
10033-410-1 = "來吧，請對我，\n下達任何命令吧。"
10033-420-1 = "全都是閣下的所有物。\n這身體、心靈、全部。"
10033-430-1 = "您期望的事，\n請儘管說。"
10033-440-1 = "沒錯，任何事♡"
10033-450-1 = "啊啊，明明現在就想\n讓閣下緊抱著我……"
10033-460-1 = "竟然必須忍耐，\n這是多麼刻苦的試煉啊……"
10033-470-1 = "就算您那樣一直盯著，\n我的臉龐……"
10033-480-1 = "見過我的素顏的，\n僅僅只有閣下……"
10033-490-1 = "……不過，被那樣盯著\n看的話……很害羞的。"
10033-500-1 = "閣下出生的日子……"
10033-510-1 = "這麼值得喜悅的日子\n竟然可以與閣下在一起，\n有如美夢。"
10033-520-1 = "哎呀，我的生日，\n您記住了嗎？"
10033-530-1 = "啊啊，好開心……\n我，已經沒有\n任何留念了……"
10033-540-1 = "祝您新年快樂。"
10033-550-1 = "希望今年也能和閣下一起，\n製造快樂的回憶。"
10033-560-1 = "聖誕節，情侶們\n究竟會做什麼事呢？"
10033-570-1 = "唔呵呵呵，我，\n對這種事情不太了解♡"
10033-580-1 = "是否可以，請您\n一步一步教導我呢？\n老．師？"
10033-600-1 = "好開心……！\n若藻我，一心只想\n像這樣與閣下相見……！"
10033-610-1 = "以求直接，將這份心情……\n這份思念，傳達給您……"
10033-620-1 = "能如這般與您相會，\n肯定也是……受紅線\n連繫的命運所引導……"
10033-630-1 = "啊，啊……那，那樣\n盯著我看的話……！"
10033-640-1 = "就算是我，\n也是會害羞的……"
10033-650-1 = "僅僅因為閣下的視線，\n就從身體各處，溢出了\n心癢難耐的感覺……"
10033-660-1 = "不過……假如閣下\n如此希望的話……\n好的♡"
10033-670-1 = "來，請來這邊。\n再更加，靠近我身邊……\n唔呵呵呵呵♡"
10033-2600-1 = "好了，若藻我，\n已經做好準備了。\n使用這個，將閣下的敵人\n一個不剩地排除。\n哼哼哼哼哼哼哼……"
