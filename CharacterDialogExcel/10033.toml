[translation]
10033-10-1 = "블루 아카이브. 후후후."
10033-20-1 = "우후후 드디어 찾.았.다.\n이제 놓치지 않아요. 당신♥\n제 눈에서 벗어나지 말아 주세요."
10033-30-1 = "평상시라면 이렇게\n여유를 부릴 수\n없을 텐데 말이죠…"
10033-40-1 = "우후후후후♡"
10033-50-1 = "하아~\n당신은 어디 계시려나."
10033-60-1 = "이런이런."
10033-70-1 = "후후후. 곤란하네요."
10033-80-1 = "다녀오셨어요, 선생님?"
10033-90-1 = "이 와카모, 여기서\n당신이 돌아오시기를"
10033-100-1 = "오매불망 기다리고 있었답니다."
10033-110-1 = "기다리고 있었답니다, 선생님.\n후후후후후♥"
10033-120-1 = "무엇을 원하시나요?"
10033-130-1 = "설령 어떤 일이라도\n할 준비가 되어 있답니다."
10033-140-1 = "자아. 무엇이든\n저에게 시켜주세요."
10033-150-1 = "전부 당신 것이랍니다.\n이 몸도, 마음도 전부."
10033-160-1 = "원하시는 것은, 뭐든지\n말씀해 주세요."
10033-170-1 = "네, 뭐든지♡"
10033-180-1 = "아아, 당장에라도\n당신께 안기고 싶지만…"
10033-190-1 = "참아야만 한다니\n이 무슨 가혹한 시험인지…"
10033-200-1 = "이 가면이 마음에 드시나요?"
10033-210-1 = "후훗. 저도\n좋아하는 가면이랍니다."
10033-220-1 = "원하신다면, 언제든\n벗기셔도 괜찮답니다……?"
10033-230-1 = "……가면 안쪽, 신경 쓰이지\n않으시나요?"
10033-240-1 = "당신이 태어난 날..."
10033-250-1 = "이런 기쁜 날\n함께 있을 수 있다니\n꿈만 같아요."
10033-260-1 = "어머나. 제 생일을\n기억해 주신 건가요?"
10033-270-1 = "아아, 기뻐요-\n저는 더 이상\n여한이 없습니다-"
10033-280-1 = "새해 복, 많이 받으시길."
10033-290-1 = "올해도 당신과 함께\n즐거운 추억을 남기고 싶네요."
10033-300-1 = "크리스마스에는 연인들은\n무슨 일을 하나요?"
10033-310-1 = "우후후후.\n저는 잘 모르는데♡"
10033-320-1 = "몸소 가르쳐주실 수 있나요?\n선.생.님.?"
10033-330-1 = "이 가면은 할로윈 용이 아니랍니다."
10033-340-1 = "아까 누가 물어봐서\n조금 서글퍼졌어요."
10033-350-1 = "다녀오셨어요, 선생님?"
10033-360-1 = "이 와카모, 여기서\n당신이 돌아오시기를"
10033-370-1 = "오매불망 기다리고 있었답니다."
10033-380-1 = "기다리고 있었답니다, 선생님.\n후후후후후♥"
10033-390-1 = "무엇을 원하시나요?"
10033-400-1 = "설령 어떤 일이라도\n할 준비가 되어 있답니다."
10033-410-1 = "자아. 무엇이든\n저에게 시켜주세요."
10033-420-1 = "전부 당신 것이랍니다.\n이 몸도, 마음도 전부."
10033-430-1 = "원하시는 것은, 뭐든지\n말씀해 주세요."
10033-440-1 = "네, 뭐든지♡"
10033-450-1 = "아아, 당장에라도\n당신께 안기고 싶지만…"
10033-460-1 = "참아야만 한다니\n이 무슨 가혹한 시험인지…"
10033-470-1 = "제 얼굴을 그렇게\n뚫어져라 보셔도......"
10033-480-1 = "맨얼굴을 보여 드리는 건\n오직 당신뿐이라......"
10033-490-1 = "......그렇게 쳐다보시면\n부끄러워요."
10033-500-1 = "당신이 태어난 날..."
10033-510-1 = "이런 기쁜 날\n함께 있을 수 있다니\n꿈만 같아요."
10033-520-1 = "어머나. 제 생일을\n기억해 주신 건가요?"
10033-530-1 = "아아, 기뻐요-\n저는 더 이상\n여한이 없습니다-"
10033-540-1 = "새해 복, 많이 받으시길."
10033-550-1 = "올해도 당신과 함께\n즐거운 추억을 남기고 싶네요."
10033-560-1 = "크리스마스에는 연인들은\n무슨 일을 하나요?"
10033-570-1 = "우후후후.\n저는 잘 모르는데♡"
10033-580-1 = "몸소 가르쳐주실 수 있나요?\n선.생.님.?"
10033-600-1 = "기뻐요…… 이 와카모,\n모든 것은 이렇게\n당신과 만나기 위해서……!"
10033-610-1 = "어떻게든 직접,\n제 기분을, 이 감정을,\n전해드리고 싶어서……"
10033-620-1 = "이렇게 만나게 된 것 또한 분명,\n붉은 실로 맺어진 운명의 인도겠죠……"
10033-630-1 = "아아…… 그, 그렇게\n뚫어져라 쳐다보시면……"
10033-640-1 = "아무리 저라고 해도,\n부끄러워져 버리고 말아요……"
10033-650-1 = "당신의 그런 시선만으로도,\n몸 이곳저곳에서,\n안타까움이 흘러 넘쳐서……"
10033-660-1 = "하지만…… 당신이\n그렇게나 원하신다면……\n네♡"
10033-670-1 = "자아, 부디 이쪽으로,\n좀 더 좀 더 저의 곁으로……\n우후후♡"
10033-2600-1 = "자아, 이 와카모. 이미 준비는 되어 있습니다.\n\r이것으로, 당신의 적을 남김없이 제거하겠습니다.\n\r후후후후후후후……"
