[translation]
13011-10-1 = "ブルーアーカイブ！"
13011-20-1 = "これから、すっごく面白い物語が始まるよ！"
13011-30-1 = "ゲーム～ゲーム～\nゲームがやりたい～"
13011-40-1 = "あれ？これちっちゃ\nい時にやったあの\nシリーズじゃん！？"
13011-50-1 = "うーん、これじゃ部員たちの\nおやつ代が足りない。\nアルバイトでもしようかな。"
13011-60-1 = "あっ！\n唐突に良いシナリオの\nアイデアが浮かんだ！"
13011-70-1 = "やった！\nクリア！！"
13011-80-1 = "おかえり、先生！\n早く任務を始めよう！"
13011-90-1 = "準備完了！行こう、先生！\n次のクエストをクリアしに！"
13011-100-1 = "ゲームを楽しめる人とゲームが\n上手い人は別なことも多いよ。"
13011-110-1 = "先生はどっち？"
13011-120-1 = "あっ！今日新作の\nゲームの発売日だった！"
13011-130-1 = "元々今日はレイドに\n行こうと思ってたのに！\n当番になっちゃうなんて……！"
13011-140-1 = "……まあ、\nこっちも好きだからいいけど。"
13011-150-1 = "先生！任務とかは後でいいから\nとりあえずゲームしに行こう！"
13011-160-1 = "先生はいいな……。\n欲しいゲームがあったら\nいつでも買えるんでしょ？"
13011-170-1 = "先生！お誕生日おめでとう！\n今日はゲーム開発部の\nみんなと一緒に美味しい\nもの食べに行こう！"
13011-180-1 = "先生！今日は私と\nミドリの誕生日なの！"
13011-190-1 = "一緒にできる2人用\nゲーム買って～。"
13011-200-1 = "ハッピーニューイヤー！\n今年も楽しくゲームやろ！"
13011-210-1 = "クリスマスか……\nうーん、"
13011-220-1 = "先生が赤い服を\n着て、ゲーム機を\nプレゼントしてくれたら\n最高のクリスマスなのに！"
13011-230-1 = "わあ！ハロウィンだ！\nなんだかワクワクする！\n先生！早く飴ちょうだい！"
13011-250-1 = "見て、先生！\nこっち側のスタンプ、\n全部集められたよ！"
13011-260-1 = "これでクエストクリア、だね！\nやった！"
13011-270-1 = "最初はどうなるか\nと思ったけど……。"
13011-280-1 = "やっぱり先生と私、\n相性バッチリだね！"
13011-290-1 = "って、うわぁっ！？\n先生！？"
13011-300-1 = "汗まみれじゃん！\n大丈夫！？"
13011-310-1 = "あはっ、大丈夫なら良かった。\n今日も先生のおかげで、\nすっごく楽しかったよ！"
13011-320-1 = "もしまたこういう\nイベントがあったら、"
13011-330-1 = "その時もまた、\n一緒に参加しようね！\n先生！"
13011-2600-1 = "こ……これが……私の専用装備！\nこれで私も、超強化型JK！"
