[translation]
20052-10-1 = "Blue Archive. Heh, heh, heh."
20052-20-1 = "Publish, print, distribute. That's the Publishing Department's motto. Hello, Sensei. I'm Aramaki Yakumo."
20052-30-1 = "Let's see... How best to optimize our revenue streams..."
20052-40-1 = "It's warm and cozy here..."
20052-50-1 = "What if I set up a sales booth there...? Heh, heh, heh."
20052-60-1 = "Nowadays, textual content is more of a business platform."
20052-70-1 = "I wonder how much this place makes daily...?"
20052-80-1 = "Wow, you're here, Sensei!"
20052-90-1 = "I was waiting so anxiously."
20052-100-1 = "Now then, shall we start a discussion about..."
20052-110-1 = "...our new business venture between the Publishing Department and Schale? Heh, heh, heh."
20052-120-1 = "I was waiting!"
20052-130-1 = "As I was standing here..."
20052-140-1 = "...I came up with a list of books that Schale might need."
20052-150-1 = "..If you want, I'll bring them right away. Heh, heh, heh."
20052-160-1 = "My hobby is writing business proposals, yeah."
20052-170-1 = "That's odd? Well, you could look at it that way..."
20052-180-1 = "But I like imagining the possibilities."
20052-190-1 = "Writing down your ideas is surprisingly fun, you know?"
20052-200-1 = "...That's not a collection of business proposals, but a scratchpad?"
20052-210-1 = "What do you mean?! This isn't some scratchpad!"
20052-220-1 = "It's different because... Well, um..."
20052-230-1 = "Negotiating the budget with the Office is always tough..."
20052-240-1 = "But...ultimately, all that matters is getting paid, right?"
20052-250-1 = "We overcome any deficits with the Publishing Department's business capability!"
20052-260-1 = "...And charge the Office again to earn twice as much. Heh, heh, heh."
20052-270-1 = "I rode multiple types of transportation to get to Schale."
20052-280-1 = "And I'm quite envious of your railroad system..."
20052-290-1 = "Well, that's not the only thing that I'm envious of..."
20052-300-1 = "The publishing industry is in a biiit of a squeeze nowadays."
20052-310-1 = "Especially with text being overrun by video platforms."
20052-320-1 = "Which is why I came to the following conclusion."
20052-330-1 = "The Publishing Department should also absorb various video platforms!"
20052-340-1 = "Ah. I'm serious about this."
20052-350-1 = "I want to become a transfer student at Schale."
20052-360-1 = "It's warm, the facilities are maintained, and there are plenty of business opportunities. You're here as well."
20052-370-1 = "I can't, since Schale is not a school?"
20052-380-1 = "Right... Reality is frequently bitingly cold..."
20052-390-1 = "Would you look at that, our star of the day is here."
20052-400-1 = "Happy birthday, Sensei. Here's a small gift from me."
20052-410-1 = "Here, it's a library card. I look forward to seeing you use it. Heh, heh, heh."
20052-420-1 = "Today is May 18th, you know?"
20052-430-1 = "Isn't there something you're forgetting? Don't you have something you should say to me?"
20052-440-1 = "As expected of you! I knew you'd remember my birthday!"
20052-450-1 = "It's the new year. Mmm..."
20052-460-1 = "Most businesses plan an event for every new year."
20052-470-1 = "It's a bit of a dilemma..."
20052-480-1 = "It doesn't make a big impact because everyone does it..."
20052-490-1 = "...but you'll fall behind if you don't bother..."
20052-500-1 = "They say Christmas season is the peak business season!"
20052-510-1 = "So many owners plan for the season, complacent and uninspired..."
20052-520-1 = "...thinking anything will sell this time of year."
20052-530-1 = "Today is Halloween."
20052-540-1 = "Oh, right. I've had this question ever since I met you."
20052-550-1 = "Getting a treat from you, or getting the freedom to trick you..."
20052-560-1 = "I wonder which one's better."
20052-580-1 = "Oh... It feels soft."
20052-590-1 = "This might be nice..."
20052-600-1 = "Why did saying that give me chills?"
20052-610-1 = "Achoo!"
20052-620-1 = "Did you get it? Now then, your turn."
20052-630-1 = "Huh? Did you really mean to make me do this by myself?"
20052-640-1 = "Dear, oh dear. I don't think that's very responsible of you, Sensei."
20052-650-1 = "Red Winter's cold is the same for everyone, you know? Heh, heh, heh."
20052-2600-1 = "They say it depends on how you use the tool, right? With this, I can \"guarantee\" that my contracts are upheld. Heh, heh, heh."
