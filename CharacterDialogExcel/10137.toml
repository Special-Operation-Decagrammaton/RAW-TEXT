[translation]
10137-10 = "Bluuue Archiive!"
10137-20 = "Hello there, I'm Shima Konoka, from Valkyrie Police School's Public Peace Bureau. Would you like to read today's horoscope together?"
10137-30 = "There are loooots of people hereee."
10137-40 = "(Now, let's see if there's a criminal... Eh, I guess there's none here.)"
10137-50 = "Eh? Where did I...put my badge...?"
10137-60 = "How peaceful. Ugh... Boring."
10137-70 = "Is this...legally acceptable?"
10137-80 = "Hello. Did you get food yet?"
10137-90 = "Did you get yourself a criminal record while I was gone...?"
10137-100 = "Just kidding!"
10137-110 = "Valkyrie's perfectly fine without me."
10137-120 = "In fact, crime rates skyrocket when I'm there."
10137-130 = "Let's just say that the public keeps picking fights."
10137-140 = "So maybe I should just stay right here! Kidding!"
10137-150 = "You're great at writing, Sensei! I'm so envious."
10137-160 = "But I'm still the best when it comes to apologies!"
10137-170 = "I'll help you if you need to write one later!"
10137-180 = "Hmm, HMMMMMM..."
10137-190 = "...I should replace the tea bag."
10137-200 = "It starts to taste like plain water after thirty uses..."
10137-210 = "SHAME! SHAME! SHAME!"
10137-220 = "It's kind of funny when you hear it over and over again, right?"
10137-230 = "I wish I could stop hearing it..."
10137-240 = "Sensei, how's your horoscope looking today?"
10137-250 = "Happy birthday, Sensei!"
10137-260 = "I don't know what you like..."
10137-270 = "...so let's go shopping together!"
10137-280 = "Happy birthday to me, happy birthday to me!"
10137-290 = "Happy birthday, dear Konoka!"
10137-300 = "Happy New Year, Sensei!"
10137-310 = "Let's go out for the first delinquent crackdown of the year together!"
10137-320 = "About Christmas... They say it's nice and all..."
10137-330 = "But isn't Santa a habitual trespasser?"
10137-340 = "On my way here, someone said they'd pull a trick on me if I didn't hand over some treats."
10137-350 = "They should've told me it was Halloween first..."
10137-360 = "I thought it was a robbery and put them in handcuffs."
10137-380 = "Ah, ah, I'm soaked."
10137-390 = "Ugh... I'm cold."
10137-400 = "It's really coming down."
10137-410 = "Apparently, it's not going to stop until later tonight. *sigh*"
10137-420 = "Well, I guess it's nice to take a beat and regroup."
10137-430 = "Hm? Ah, well..."
10137-440 = "I'd be lying if I said I wasn't disappointed."
10137-450 = "I wasted my time, and I'm drenched..."
10137-460 = "But still, today went just like my horoscope said it would."
10137-470 = "It ended up being a nice day with a buddy by my side."
10137-480 = "...It's all thanks to you."
10137-490 = "So, if I had to say..."
10137-500 = "I'm happy."
10137-510 = "...Ah, wait, I mean!"
10137-520 = "It was really lucky that we found shelter from the rain so quickly! That's why I'm happy!"
10137-530 = "Th-That was the...gist of it..."
10137-2600 = "Ah, this is it! I don't need to talk a lot when I have this!"
