[translation]
10137-10 = "蔚藍～檔案～"
10137-20 = "啊～你好你好～\n我是女武神警察學園\n公安局的志真木乃香。\n要一起看今天的占卜嗎？"
10137-30 = "人～還真多啊～"
10137-40 = "（那麼，犯罪者在……\n算了，這裡不會有吧）"
10137-50 = "咦？我的徽章……\n放到哪裡去了……"
10137-60 = "真和平啊～\n唉……好無聊。"
10137-70 = "這個是合法的嗎？"
10137-80 = "哈囉～\n最近怎麼樣呀？"
10137-90 = "在沒見面的期間\n有了前科……"
10137-100 = "哎呀，我是開玩笑的啦！"
10137-110 = "就算我不在，\n女武神也沒問題的。"
10137-120 = "或者說，我在的話\n逮捕率反而會提高呢……"
10137-130 = "怎麼說呢～感覺\n經常會被人找碴。"
10137-140 = "所以，還是\n待在這裡比較好。\n開玩笑的～"
10137-150 = "老師，你的文筆很好呢～\n真羨慕～"
10137-160 = "啊，不過寫檢討書或\n反省文的話我很拿手。"
10137-170 = "需要的時候請跟我說！"
10137-180 = "喝茶～喝茶～"
10137-190 = "……這個茶包，\n差不多該換了吧。"
10137-200 = "畢竟泡了30次，\n味道都沒了……"
10137-210 = "懲戒！懲戒！懲戒！"
10137-220 = "這樣重複說的話，\n不覺得很好笑嗎？"
10137-230 = "不過，要是再說下去，\n感覺就有點不妙了……"
10137-240 = "老師，今天的\n運勢怎麼樣啊？"
10137-250 = "老師，生日快樂！"
10137-260 = "因為不知道你喜歡什麼，"
10137-270 = "我們現在就去商場吧！"
10137-280 = "Happy~Birthday~To~Me~\nHappy~Birthday~To~Me~"
10137-290 = "Happy~Birthday~\nDear木乃香~"
10137-300 = "老師，新年快樂！"
10137-310 = "一起去取締那些\n嗨過頭的混混吧！"
10137-320 = "聖誕節啊……\n雖然大家都說很感謝……"
10137-330 = "但聖誕老人不就是\n非法侵入的慣犯嗎。"
10137-340 = "剛才，有人對我說\n「不把糖果交出來\n就對你惡作劇！」。"
10137-350 = "我以為是強盜\n就把他銬起來了……"
10137-360 = "如果是萬聖節的話，\n希望可以早點說一聲呢……"
10137-380 = "啊～啊，全都濕了……"
10137-390 = "嗚嗚……好冷。"
10137-400 = "開始下雨了呢。"
10137-410 = "聽說到晚上\n都不會停……\n唉……"
10137-420 = "算了，正好可以\n讓腦袋冷靜一下。"
10137-430 = "咦？啊啊，唔嗯……"
10137-440 = "要說沒有不甘心的話，\n那是騙人的。"
10137-450 = "不只白費很多功夫，\n還被淋成落湯雞……"
10137-460 = "但是，就和占卜說的一樣。"
10137-470 = "因為有夥伴在身邊，\n所以是個美好的一天。"
10137-480 = "……這都是多虧了老師哦。"
10137-490 = "所以，如果真要說的話──"
10137-500 = "我很幸福。"
10137-510 = "……啊，不是，那個！"
10137-520 = "我的意思是\n能像這樣有地方躲雨\n真是既幸運又幸福！"
10137-530 = "就，就只是這樣……而已……"
10137-2600 = "啊，我正想要這個呢！\n有了這個的話，事情就能輕易搞定了！"
