[translation]
10137-10-1 = "ぶる～あ～かいぶ～"
10137-20-1 = "あー、どもども。\nヴァルキューレ警察学校、\n公安局の志真コノカっす。\n今日の占い、一緒に見てみません？"
10137-30-1 = "人が～おおいなぁ～"
10137-40-1 = "（さぁて犯罪者は……\nまぁ、\nここにはいないか）"
10137-50-1 = "あれっ？\nあたしのバッジ……\nどこやったっけ……。"
10137-60-1 = "平和だなー。\nはぁ……暇だ。"
10137-70-1 = "これって\n合法なんすか？"
10137-80-1 = "ちわーっす。調子どっすか？"
10137-90-1 = "見ない間に前科持ちに\nなってたり……"
10137-100-1 = "なーんて、冗談ですって！"
10137-110-1 = "あたしが居なくても\nヴァルキューレは大丈夫っすよ。"
10137-120-1 = "というか、いるほうが逮捕率\nあがるんすよね……"
10137-130-1 = "なーんか、ちょっかい\nかけてくるっていうか。"
10137-140-1 = "だから、こっちいる方が\nいい気がする、なんちゃって。"
10137-150-1 = "先生、文章うまいっすねぇ～\nいいなぁ。"
10137-160-1 = "あ、でも始末書と反省文\nなら得意なんで、"
10137-170-1 = "必要な時は言ってください！"
10137-180-1 = "お茶～お茶～っと。"
10137-190-1 = "……このティーバッグ、\nそろそろ替え時かな。"
10137-200-1 = "30番煎じはさすがに\n味しなくなってきた……。"
10137-210-1 = "懲戒！懲戒！懲戒！"
10137-220-1 = "……って、繰り返し言われると\n面白く感じてきません？"
10137-230-1 = "まぁ、\nこれ以上はマズいっすけど……。"
10137-240-1 = "先生、今日の運勢どうでした？"
10137-250-1 = "先生、お誕生日おめでとうっす！"
10137-260-1 = "何が好きかちょっと\nわからないんで、"
10137-270-1 = "今からショッピングモール\n行くっすよ！"
10137-280-1 = "はっぴば～すで～とぅ～みぃ～\nはっぴば～すで～とぅ～みぃ～"
10137-290-1 = "はっぴば～すでぇ～\nでぃあ、このかぁ～"
10137-300-1 = "先生、明けまして\nおめでとうございます！"
10137-310-1 = "浮かれてる不良を\n取り締まりに行くっすよ～！"
10137-320-1 = "クリスマスっすねぇ……\nなんかみんな\nありがたがってますけど……"
10137-330-1 = "サンタって不法侵入の\n常習犯っすよね、あれ。"
10137-340-1 = "さっき、\nキャンディーくれなきゃ\nいたずらするぞ！\nって言われたんすけど。"
10137-350-1 = "強盗かと思ってつい\n手錠掛けちゃって……"
10137-360-1 = "ハロウィンなら早く\n言ってほしかったっすね……。"
10137-380-1 = "あーあ、びしょ濡れ……。"
10137-390-1 = "うぅ……さっむ。"
10137-400-1 = "降り始めちゃいましたね。"
10137-410-1 = "夜までは止まないらしいのに……\nはぁ……。"
10137-420-1 = "まぁ、頭を冷やすには\nちょうどよかったっすかね。"
10137-430-1 = "はぇ？ああ、うーん。"
10137-440-1 = "悔しくないって言ったら\n嘘になるっすよ。"
10137-450-1 = "いろいろ無駄骨になるわ、\n濡れ鼠になるわ……。"
10137-460-1 = "でも、占いの通りっす。"
10137-470-1 = "バディが隣にいたから、\n良い1日になりました。"
10137-480-1 = "……先生のおかげっすよ。"
10137-490-1 = "だから、どちらかというと――"
10137-500-1 = "幸せです。"
10137-510-1 = "……あっ、いや、その！"
10137-520-1 = "こうやって雨宿りもできて、\nラッキーで幸せだなって意味で！"
10137-530-1 = "そ、それだけ……っすから……。"
10137-2600-1 = "あ、これ欲しかったんすよ！\nこれがあれば話が簡単に済むっすからね！"
