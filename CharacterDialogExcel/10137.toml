[translation]
10137-10 = "蔚藍～檔案～"
10137-20 = "啊～辛苦了～我是女武神警察學園\n公安局的志真木乃香。\n要一起看今天的占卜嗎？"
10137-30 = "好多人啊～"
10137-40 = "（犯罪者……\n嗯，這裡不會有吧）"
10137-50 = "咦？ 我的徽章……\n放去哪了……"
10137-60 = "真和平啊～\n唉……好無聊。"
10137-70 = "這個，\n法律上沒問題嗎？"
10137-80 = "哈囉～\n吃飯了嗎？"
10137-90 = "一段時間沒見\n不會是有了前科……"
10137-100 = "開玩笑的啦！"
10137-110 = "就算我不在\n女武神也沒問題的。"
10137-120 = "我在那裡的話\n犯罪率反而會暴增。"
10137-130 = "怎麼說呢～\n老是被找碴呢。"
10137-140 = "所以待在這裡比較好\n我是這樣覺得啦。"
10137-150 = "老師，文筆很好呢～\n真好～"
10137-160 = "啊，寫檢討書\n或反省文的話\n我很拿手。"
10137-170 = "如果有需要的話\n請跟我說！"
10137-180 = "喝茶～喝茶～"
10137-190 = "……這個茶包，\n差不多該換了吧。"
10137-200 = "畢竟泡了30次，\n味道都沒了……"
10137-210 = "懲戒！ 懲戒！ 懲戒！"
10137-220 = "這樣重複說的話\n不覺得很好笑嗎？"
10137-230 = "不過，\n再說下去的話有點不妙……"
10137-240 = "老師，今天的運勢\n怎麼樣？"
10137-250 = "老師！\n生日快樂！"
10137-260 = "因為不知道你喜歡什麼，"
10137-270 = "所以我們現在去商場吧！"
10137-280 = "Happy~Birthday~To~Me~\nHappy~Birthday~To~Me~"
10137-290 = "Happy~Birthday~\nDear 木乃香~"
10137-300 = "老師，\n新年快樂！"
10137-310 = "一起去整頓那些\n嗨過頭的小混混吧！"
10137-320 = "聖誕節啊……\n雖然大家都說很感謝……"
10137-330 = "但聖誕老人不就是\n非法侵入的慣犯嗎。"
10137-340 = "剛才來的路上\n有人說不給糖\n就搗蛋。"
10137-350 = "我以為是強盜\n就把他銬起來了……"
10137-360 = "只是萬聖節的話\n希望可以早點說啊……"
10137-380 = "啊～啊，全濕了。"
10137-390 = "嗚嗚……好冷。"
10137-400 = "開始下雨了呢。"
10137-410 = "聽說到晚上\n都不會停……\n唉……"
10137-420 = "算了，正好可以\n讓腦袋冷靜一下。"
10137-430 = "咦？ 啊啊，\n嗯……"
10137-440 = "要說不甘心的話，\n那是騙人的。"
10137-450 = "不但到處跑，\n白忙了一場，\n還淋成落湯雞……"
10137-460 = "不過，和占卜說的一樣。"
10137-470 = "因為有夥伴在身邊，\n所以算是美好的一天了。"
10137-480 = "……這都是多虧了老師哦。"
10137-490 = "所以，真要的話……"
10137-500 = "我很幸福。"
10137-510 = "……啊，不是，那個！"
10137-520 = "能有這樣可以避雨的地方\n我覺得很幸運！很幸福！\n我是這個意思！"
10137-530 = "就，就只是那這樣……\n而已……"
10137-2600 = "啊，就是這個！\n有了這個就簡單多了！"
