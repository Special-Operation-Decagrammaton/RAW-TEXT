[translation]
10137-10 = "B~ lue~ Ar~ chive~!"
10137-20 = "ขอบคุณที่ทำงานหนัก ฉันชิมะ โคโนกะ\nจากกรมความมั่นคงสาธารณะ สถาบันฝึกตำรวจวัลคิรี่ค่ะ\nมาดูดวงประจำวันด้วยกันมั้ยคะ?"
10137-30 = "ผู้คน\nเยอะจังเลยน้า"
10137-40 = "(ไหนดูซิ\nคนร้าย...\nจะอยู่ที่นี่มั้ยนะ)"
10137-50 = "เอ๋? เข็มของฉัน...\nเอาไปวางไว้ไหนนะ..."
10137-60 = "เงียบจังเลย\nเฮ้อ... ไม่สนุกเลยแฮะ"
10137-70 = "นี่มัน\nถูกกฎหมายหรือเปล่าคะ?"
10137-80 = "สวัสดีค่ะ\nทานข้าวหรือยังคะ?"
10137-90 = "ระหว่างที่ไม่เจอกัน\nไปก่ออาชญากรรมอะไร\nมาไว้เปล่าคะ..."
10137-100 = "ฉันล้อเล่นค่ะ!"
10137-110 = "ต่อให้ฉันไม่อยู่\nวัลคิรี่ก็อยู่ได้ค่ะ"
10137-120 = "ถ้าฉันอยู่ที่นั่น อัตราการก่อ\nอาชญากรรมจะยิ่งมากขึ้นด้วยซ้ำค่ะ"
10137-130 = "พออยู่แล้วชอบมีเรื่องให้ทะเลาะน่ะ"
10137-140 = "งั้นอยู่ที่นี่น่าจะดีกว่านะ?\nมันก็เป็นแบบนี้ละค่ะ"
10137-150 = "คุณครู ฝีมือการเขียนสุดยอดไปเลยนะคะ~\nน่าอิจฉาจังเลย"
10137-160 = "แต่ถึงยังไง ฉันก็\nเขียนหนังสือขอโทษและสำนึกผิด\nเก่งมากเลยนะคะ"
10137-170 = "ต่อไปถ้าอยากให้ช่วย\nฉันจะมาช่วยเขียนค่ะ!"
10137-180 = "ฮืม~ ฮืม ฮืมม~"
10137-190 = "ต้องเปลี่ยนถุงชาแล้วละ..."
10137-200 = "พอใช้ไป 30 รอบแล้ว\nก็เหมือนน้ำเปล่าเลยนะเนี่ย..."
10137-210 = "ลงโทษ! ลงโทษ! ลงโทษ!"
10137-220 = "พอได้ยินคำนี้บ่อยๆ เข้า\nมันก็ตลกดีนะคะ?"
10137-230 = "ควรหยุดฟังคำนี้ได้แล้วด้วย..."
10137-240 = "คุณครู ดวงประจำวันนี้\nเป็นยังไงบ้างคะ?"
10137-250 = "คุณครู สุขสันต์วันเกิดค่ะ!"
10137-260 = "ฉันไม่รู้ว่าคุณครูชอบอะไร"
10137-270 = "งั้นเราไปซื้อของด้วยกันมั้ยคะ!"
10137-280 = "แฮปปี้~ เบิร์ธเดย์~ ทู~ มี~\nแฮปปี้~ เบิร์ธเดย์~ ทู~ มี~"
10137-290 = "แฮปปี้~ เบิร์ธเดย์~\nทู~ โคโนกะ~"
10137-300 = "คุณครู\nสวัสดีปีใหม่ค่ะ!"
10137-310 = "ไปปราบอันธพาลครั้งแรกของปี\nด้วยกันเถอะค่ะ~!"
10137-320 = "คริสต์มาสแล้วค่ะ...\nใครๆ ก็บอกว่าเป็นเรื่องที่ดี..."
10137-330 = "แต่ซานต้าทำผิด\nฐานบุกรุกบ้านไม่ใช่เหรอคะ?"
10137-340 = "ระหว่างมาที่นี่ มีคน\nบอกว่าถ้าไม่ให้ลูกกวาด\nก็จะแกล้งกันค่ะ"
10137-350 = "ก็บอกแต่แรกสิว่าวันฮาโลวีน..."
10137-360 = "ฉันคิดว่าตัวเองโดนปล้น\nก็เลยจับใส่กุญแจมือเลยค่ะ"
10137-380 = "อ่า เปียกโชกเลย"
10137-390 = "อึก... หนาวจัง"
10137-400 = "ฝนตกลงมาจนได้นะคะ"
10137-410 = "เห็นว่าจะตกถึงกลางคืนเลยด้วย...\nเฮ้อ..."
10137-420 = "แต่มันก็ทำให้สมองให้โล่งดีนะคะ"
10137-430 = "คะ? อ่า อืม"
10137-440 = "ถ้าบอกว่าไม่ผิดหวัง\nก็คงเป็นเรื่องโกหกค่ะ"
10137-450 = "ทุกอย่างเปล่าประโยชน์\nแล้วฉันก็เปียกโชกไปหมดด้วย..."
10137-460 = "แต่มันก็เป็นไปตามดวงนะคะ"
10137-470 = "พอมีบัดดี้อยู่ข้างๆ\nก็เลยเป็นวันที่ดีค่ะ"
10137-480 = "ต้องขอบคุณคุณครูนะคะ..."
10137-490 = "เพราะงั้นถ้าถามว่ารู้สึกยังไงละก็..."
10137-500 = "ฉันมีความสุขค่ะ"
10137-510 = "อ๊ะ... ไม่สิคะ คือว่า!"
10137-520 = "มีที่ให้มาหลบฝนแบบนี้ด้วย\nลักกี้! ฉันก็เลยมีความสุข\nฉันจะสื่อแบบนี้น่ะ!"
10137-530 = "กะ... ก็ประมาณนี้...น่ะค่ะ..."
10137-2600 = "อ๊ะ อันนี้เลยค่ะ!\nถ้ามีอันนี้ ก็ไม่ต้องพูดให้มากความค่ะ!"
