[translation]
10134-10-1 = "Blue, Archive!"
10134-20-1 = "Aris, on my way!"
10134-30-1 = "This! It looks very much like Kei!"
10134-40-1 = "I am a bit sleepy..."
10134-50-1 = "This is a no-PK zone!"
10134-60-1 = "(Scan complete. Hostile signatures... None.)"
10134-70-1 = "Where is the charger?"
10134-80-1 = "Fufu, I knew you would arrive at this very moment!"
10134-90-1 = "My auto-detection system told me!"
10134-100-1 = "Sensei, I was waiting for you!"
10134-110-1 = "It is okay!"
10134-120-1 = "I would wait for you forever!"
10134-130-1 = "This suit's flight mechanics are very similar to a game I played before."
10134-140-1 = "However, unlike in that game, it is first-person in real life!"
10134-150-1 = "I wish to see from a third-person perspective!"
10134-160-1 = "Sensei? What is wrong?"
10134-170-1 = "Ah! So you saw!"
10134-180-1 = "Yes! I DID come in from the window!"
10134-190-1 = "In this mode, I have both light and flying attributes!"
10134-200-1 = "...Eh? It is dangerous, and I should still use the door like normal?"
10134-210-1 = "This equipment is still unstable, so it requires regular maintenance!"
10134-220-1 = "However, there is no cause for concern!"
10134-230-1 = "Himari, Rio, and even Utaha..."
10134-240-1 = "They all said I could bring it to them anytime!"
10134-250-1 = "However... If I ask one person, the other two will be upset..."
10134-260-1 = "What should I do...?"
10134-270-1 = "Eek...!"
10134-280-1 = "Uwaaah... These wings are so big that they bump into everything."
10134-290-1 = "How does one with wings usually move?"
10134-300-1 = "The person I know with biggest wingspan..."
10134-310-1 = "Ah! I will ask the head prefect later!"
10134-320-1 = "Kei said I will turn out like Momoi if I keep playing video games..."
10134-330-1 = "What does she mean by that?"
10134-340-1 = "I like Momoi, so I wish to be like Momoi!"
10134-350-1 = "...What is wrong, Sensei? Your reaction was identical to Kei's!"
10134-360-1 = "Happy birthday, Sensei!"
10134-370-1 = "Since it is your birthday, that means that you were born today!"
10134-380-1 = "It is a bit interesting to think of a time when Sensei did not exist."
10134-390-1 = "Fufu. Sensei, do you remember?"
10134-400-1 = "Today is the day when Sensei and I—the day when everyone and I, met!"
10134-410-1 = "Although I do not remember when I was born..."
10134-420-1 = "...there is no doubt that today is my birthday!"
10134-430-1 = "Happy New Year, Sensei!"
10134-440-1 = "It is unfortunate...but I cannot join you in this next journey."
10134-450-1 = "For I have a pact with my online friends to see the sunrise in-game together this year."
10134-460-1 = "Therefore, I must stay up all night playing..."
10134-470-1 = "Eh...? We are going to go outside RIGHT NOW??"
10134-480-1 = "Waah! How could this happen to me...?"
10134-490-1 = "Bum bum bum!"
10134-500-1 = "I will be operating as Santa for the day!"
10134-510-1 = "I will be flying in the sky and giving people gifts in place of Santa, who is too busy today!"
10134-520-1 = "Ah, I forgot to give Sensei a role. Um..."
10134-530-1 = "...Ah! Sensei, you are Rudolph!"
10134-540-1 = "Wah! Sensei, help me!"
10134-550-1 = "There are people chasing me asking for photos!"
10134-560-1 = "But this is not a costume!"
10134-580-1 = "Eheehee. Sensei, were you surprised?"
10134-590-1 = "I called to you because I wanted you to see the night sky with me."
10134-600-1 = "Is it not beautiful?"
10134-610-1 = "I am sure that in this world, and even in all the worlds I have yet to visit..."
10134-620-1 = "...there must be plenty of beautiful things, just like this."
10134-630-1 = "That is why it is so strange."
10134-640-1 = "When there is so much beauty in this world... Why do people choose to fight?"
10134-650-1 = "Just like the stars that speckle the night, I am sure the world is full of more than enough beautiful things for everyone to share."
10134-660-1 = "...It really is difficult for me to understand."
10134-2600-1 = "Sword of Light has always illuminated the path for me. Just like... Sensei!"
