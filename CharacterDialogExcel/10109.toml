[translation]
10109-10-1 = "Blue Archive"
10109-20-1 = "เลขานุการที่จะมาบันทึกเรื่องวันนี้ของคุณครู\nอุชิโอะ โนอาค่ะ\nคืนนี้ก็ฝากตัวด้วยนะคะคุณครู ฮุฮุ"
10109-30-1 = "(คาเฟ่นี้เหมือนโลกลึกลับ\nที่ลืมตาขึ้นมาจากความเหงา\nและความเงียบเลยค่ะ)"
10109-40-1 = "(มาฟังความเงียบสงัด\nของค่ำคืนกันสักพักมั้ยคะ...)"
10109-50-1 = "ฮ้าว...\nเหนื่อยนิดหน่อยนะคะ"
10109-60-1 = "เราไปพักผ่อนแถวนี้\nแล้วค่อยไปต่อมั้ยคะ?"
10109-70-1 = "(เมื่อกี้เหมือนได้ยิน\nเสียงหัวเราะของโคยูกิจัง\nเลยแฮะ...)"
10109-80-1 = "เชิญค่ะ คุณครู"
10109-90-1 = "ดื่มนมร้อนสักถ้วยมั้ยคะ?"
10109-100-1 = "อ๊ะ... มาแล้วสินะคะ คุณครู"
10109-110-1 = "วันนี้อากาศดีจนฉันเอาแต่มอง\nทิวทัศน์นอกหน้าต่าง\nจนไม่รู้เลยค่ะว่าคุณครูมา"
10109-120-1 = "คุณครูไปเปลี่ยนเป็นชุด\nที่สบายตัวกว่านี้มาดีมั้ยคะ?"
10109-130-1 = "ถ้าทำงานในชุดที่สบายตัว\nอาจจะทำได้อย่างมีประสิทธิภาพ\nกว่าเดิมก็ได้นะคะ"
10109-140-1 = "ฉันเขียนไดอารีทุกวันเลยค่ะ"
10109-150-1 = "ก็มันเป็นบันทึกสำคัญ\nที่ทำให้ได้ทบทวนวันนั้นๆ นี่คะ"
10109-160-1 = "ไม่ได้ค่ะ ต่อให้เป็นคุณครู\nฉันก็ให้อ่านไดอารีไม่ได้ค่ะ"
10109-170-1 = "มันเป็นความลับของเด็กสาวค่ะ"
10109-180-1 = "รู้สึกเหมือนโคยูกิจัง\nจะตั้งใจหลบหน้าฉันเลย..."
10109-190-1 = "หรือว่าท่าทีของฉัน\nไปกดดันโคยูกิจังเหรอคะ...?"
10109-200-1 = "ว่ากันว่าเส้นด้ายแห่งกาลเวลา\nจะคลายออกอย่างช้าๆ..."
10109-210-1 = "แต่ทำไมวันหยุด\nถึงได้ผ่านไปเร็วอย่างนี้ล่ะคะ?"
10109-220-1 = "สุขสันต์วันเกิดค่ะ คุณครู"
10109-230-1 = "แค่วันนี้เป็นวันที่\nคุณครูได้เกิดมา "
10109-240-1 = "ฉันก็รู้สึกเหมือน\nปลายปากกาเบาลงเลยค่ะ"
10109-250-1 = "ช่วยบันทึกทุกอย่างให้ฉัน\nอย่างไม่มีอะไรตกหล่นได้มั้ยคะ?"
10109-260-1 = "จำวันเกิดฉันได้ด้วยสินะคะ...?"
10109-270-1 = "จริงๆ แค่มาอวยพรกัน\nก็เพียงพอแล้วละค่ะ..."
10109-280-1 = "ถ้างั้นคืนนี้ฉันขอ\nให้คุณครูอ่านหนังสือ\nให้ฟังได้มั้ยคะ?"
10109-290-1 = "สวัสดีปีใหม่ค่ะ"
10109-300-1 = "ปีนี้ก็พักผ่อนเยอะๆ\nให้สมกับที่ทำงานเยอะๆ นะคะ"
10109-310-1 = "การชมค่ำคืนวันคริสต์มาส\nที่งดงามแล้วอ่านหนังสือไปด้วย\nก็เป็นรสนิยมที่ดีเลยนะคะ"
10109-320-1 = "ถ้าสนใจละก็\nมาอ่านด้วยกันมั้ยล่ะคะ?"
10109-330-1 = "ต่อให้เป็นหนังสือที่เข้าใจยาก\nฉันก็จะอ่านให้ฟังข้างๆ ค่ะ"
10109-340-1 = "จะว่าไปก็มีนักเรียนหลายคน\nที่ใส่เสื้อผ้าที่สั้นและพลิ้วไหว\nเหมือนกับชุดนอน\nในช่วงวันฮาโลวีนนะคะ"
10109-350-1 = "ฮุฮุ คุณครูก็ชอบชุดนอน\nที่สั้นและพลิ้วไหว\nเหมือนกันมั้ยคะ?"
10109-370-1 = "<ดวงดาวน้อยใหญ่ที่แพรวพราว\nกำลังค่อยๆ เคลื่อนที่ไปเงียบๆ\nราวกับฝูงแกะเหลือคณานับ...>"
10109-380-1 = "คุณครูนี่ก็เป็นคนนิสัยแปลกจริงๆ นะคะ"
10109-390-1 = "ไม่อยากเชื่อเลยว่าอยากนอนฟัง\nฉันอ่านหนังสือที่ไม่ได้พิเศษ\nและมีเสน่ห์อะไรเลย"
10109-400-1 = "...เป็นเพราะอะไรกันเหรอคะ"
10109-410-1 = "เพราะน้ำเสียงที่จืดชืดของฉัน\nทำให้ความหมายของเรื่อง\nถูกส่งต่ออย่างแจ่มชัดหรือเปล่าคะ...?"
10109-420-1 = "ขอบคุณนะคะ คุณครู"
10109-430-1 = "คุณครูทำให้ฉันเผชิญหน้า\nกับตัวเองได้มากขึ้นค่ะ"
10109-440-1 = "คุณครูคะ...? หลับแล้วเหรอคะ?"
10109-450-1 = "ในบรรดาดวงดาราเหล่านั้น\nมีดาวดวงหนึ่งที่ดวงเล็ก\nและเปล่งประกายที่สุด"
10109-460-1 = "มันหลงทาง\nและหลับใหลอยู่ใกล้ๆ ฉันค่ะ"
10109-2600-1 = "ชุดคอนเวอร์ชันนี้เปลี่ยนรูปแบบได้\nตามความต้องการของผู้ใช้งานค่ะ\nเหมือนกับฉันเลยละค่ะ... ฮุฮุ"
