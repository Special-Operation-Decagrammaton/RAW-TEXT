[translation]
16016-10-1 = "ブルーアーカイブ！"
16016-20-1 = "救護騎士団…いえ、アンティーク・セラフィムのメンバー。蒼森ミネと申します。どうぞよろしくお願いいたします。"
16016-30-1 = "ここは…"
16016-40-1 = "大変気に\n入りました。"
16016-50-1 = "振り付けの練習を\nしたいのですが…"
16016-60-1 = "ふふ、\nオーディエンスが\nたくさんいますね…"
16016-70-1 = "ご期待に\n応えられるよう、\n練習しなければ…！"
16016-80-1 = "おかえりなさい、先生。"
16016-90-1 = "ご相談したいことが\nあるのですが、少しお時間、\nよろしいでしょうか？"
16016-100-1 = "ちょうど良いところに\nいらっしゃいましたね。\nさきほど、リハーサルが\n終了いたしました。"
16016-110-1 = "なんだかこの格好で\n当番をするのは\n不思議な気分ですね…"
16016-120-1 = "お疲れのご様子ですね…\n疲労回復の歌など、\nいかがでしょうか？"
16016-130-1 = "いつも先生から教えて\nいただいてばかりの\n私ですが…"
16016-140-1 = "ダンスと歌でしたら、\nお教えできるかもしれません。"
16016-150-1 = "何かご要望がありましたら、\n何なりとお申し付けください。"
16016-160-1 = "これもファンサービスの\n一環、です。"
16016-170-1 = "お誕生日、おめでとう\nございます、先生。"
16016-180-1 = "お祝いに一曲、歌っても\nよろしいでしょうか。"
16016-190-1 = "…覚えていて\nくださったのですね。"
16016-200-1 = "その…誕生日\nプレゼントとして…"
16016-210-1 = "一緒にお出かけしませんか？"
16016-220-1 = "明けましておめでとう\nございます、先生。"
16016-230-1 = "今年は救護の場ではなく、\nステージでお会いする日が\n多くなるよう祈っております。"
16016-240-1 = "聖なる日…\nキャロルを歌う日、で\n間違いないでしょうか？"
16016-250-1 = "こ、この格好は、\nそういうつもりでは…"
16016-260-1 = "…ですが、仮装と\n言われたら\nそうかもしれません。"
16016-270-1 = "この関係…まるで、アイドルと\nマネージャーのようですね。\n先生が支援し、私が表舞台に立つ。\n本当にそうなら、\nよかったのですが…残念です。"
16016-280-1 = "こ、これは…その…"
16016-290-1 = "想定していたものと…\n違う気がするのですが…！"
16016-300-1 = "い、いえ！\n嫌というわけでは…\nないのですが…"
16016-310-1 = "で、ですが！\n好きというわけでも\nないです…！"
16016-320-1 = "たしかに、私自身は\nかわいいものが\n好きですが…"
16016-330-1 = "「かわいい」の対象が\n自分というのは…"
16016-340-1 = "そ、その…\nそういう状況を…"
16016-350-1 = "想定していたわけでは…！"
16016-360-1 = "か、からかっていますよね、\n先生？"
16016-370-1 = "そ、そんな言葉を\n言わないでください…！"
16016-380-1 = "わ、私……\nどうすれば……！"
