[translation]
16016-10-1 = "Blue Archive!"
16016-20-1 = "Aomori Mine from the Remedial Knights...no, Antique Seraphim. I look forward to working with you."
16016-30-1 = "This place..."
16016-40-1 = "I heartily approve."
16016-50-1 = "I must practice my dancing."
16016-60-1 = "Fufu. There are many members in the audience."
16016-70-1 = "I must practice vigorously to live up to their expectations!"
16016-80-1 = "Welcome, Sensei."
16016-90-1 = "I wish to consult with you about something. Do you happen to have a moment?"
16016-100-1 = "Excellent timing. We've just finished rehearsal."
16016-110-1 = "This place, in a costume like this... It feels odd."
16016-120-1 = "You seem tired... Would a song relieve that fatigue?"
16016-130-1 = "I am always learning one lesson or another from you."
16016-140-1 = "However, in the realm of song and dance, I am the one qualified to teach you."
16016-150-1 = "If you have any request, please feel free to let me know."
16016-160-1 = "This is also part of fan service."
16016-170-1 = "Happy birthday, Sensei."
16016-180-1 = "May I sing you a song to celebrate?"
16016-190-1 = "...You remembered."
16016-200-1 = "Um... As a birthday gift..."
16016-210-1 = "Would you participate in an excursion, with me?"
16016-220-1 = "Happy New Year, Sensei."
16016-230-1 = "I hope to see more days on the stage than at a medical site, this year."
16016-240-1 = "A holy day.. A day to sing carols, is that right?"
16016-250-1 = "Th-The intention of this costume isn't that..."
16016-260-1 = "...but, if you were to categorize it as a costume, that could be correct."
16016-270-1 = "Our relationship...is similar to that of an idol and her manager. I stand on the main stage, while you support me. Such a situation would have been excellent. What a shame."
16016-280-1 = "Th-This is... It's..."
16016-290-1 = "This is not...quite what I expected...!"
16016-300-1 = "N-No! I-I'm not averse to it or anything of the sort..."
16016-310-1 = "H-However! I am not implying that I enjoy it either...!"
16016-320-1 = "I mean, it is a fact that I appreciate cute things..."
16016-330-1 = "But for me to be the one who is \"cute\"..."
16016-340-1 = "I... What I am saying is...! I wasn't..."
16016-350-1 = "...presuming that to be the situation...!"
16016-360-1 = "A-Are you making fun of me, Sensei?"
16016-370-1 = "D-Do not say such things...!"
16016-380-1 = "Wh-What...should I do...?!"
