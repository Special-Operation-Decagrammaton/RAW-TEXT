[translation]
10096-10-1 = "Blue Archive."
10096-20-1 = "Public Peace Bureau Director Ogata Kanna from Valkyrie Police School. Forgive my rudeness in greeting you like this, but it's the nature of my duties."
10096-30-1 = "Anyone in danger...? Nope."
10096-40-1 = "I'll take a short break."
10096-50-1 = "I never slack off on warm-ups, so I'm ready to move out at a moment's notice."
10096-60-1 = "Mmm... There are a few items of concern."
10096-70-1 = "I'll need to get started on patrol as soon as break's over."
10096-80-1 = "I've been waiting, Sensei. If you need my help, let me know anytime."
10096-90-1 = "Welcome, Sensei."
10096-100-1 = "From here on out, consider me responsible for Schale's surface water safety."
10096-110-1 = "Huh? There's no...swimming pool here?"
10096-120-1 = "I'm not used to wearing swimsuits... Apologies if it's any sort of bother."
10096-130-1 = "Incidents happen when you're unprepared."
10096-140-1 = "I'm always on alert, so I can respond right away."
10096-150-1 = "Coffee? It gets in my way, so I only had one cup."
10096-160-1 = "Sure I can rescue people, but I don't know about welcoming or helping guests."
10096-170-1 = "When you're feeling tired, you should move your body."
10096-180-1 = "Then, let's get up. I'll show you a lifeguard's warm-up."
10096-190-1 = "Happy birthday, Sensei."
10096-200-1 = "I hope your day is a safe one."
10096-210-1 = "I'll secure Sensei's safety."
10096-220-1 = "Ah, it's my birthday again."
10096-230-1 = "It's no different from any other day..."
10096-240-1 = "Another new year. Let's hope there aren't any safety accidents this year."
10096-250-1 = "On exciting days like these, lifeguards have to be even more alert than usual."
10096-260-1 = "...But, well, I guess a cup of coffee with you would be okay, Sensei."
10096-270-1 = "I'm not a huge fan of candy..."
10096-280-1 = "Huh? The trick then? That's okay, as long as it's not dangerous..."
10096-290-1 = "But the only target...can be m-me."
10096-310-1 = "Ahh, I can feel all my fatigue...melting away."
10096-320-1 = "This is fine... We can call it...a maintenance check."
10096-330-1 = "Besides... People who work hard deserve a reward."
10096-340-1 = "And, besides that... I'm always...in your debt, Sensei."
10096-350-1 = "So this...is just a small token of my thanks."
10096-360-1 = "Wh-What?! I mean, of course not!"
10096-370-1 = "The reason I'm here is because..."
10096-380-1 = "It's for your safety! I'm a lifeguard!"
10096-2600-1 = "Sensei's symbol of trust... I see. A lifeguard shoulders heavy responsibilities. I'll do my best to live up to your expectations."
