[translation]
10153-10 = "블루 아카이브!"
10153-20 = "네? 이 옷 말인가요?\n지급받은 유니폼인데요?\n에헤헤…… 잘 부탁드려요!"
10153-30 = "후우……\n여기, 정말 쾌적해요.\n크루세이더쨩의 에어컨,\n빨리 고쳐야하는데……"
10153-40 = "다들 개성이 많아서,\n조금 부러워요……."
10153-50 = "아앗, 너무 귀여워요!"
10153-60 = "(엄청, 대담한\n차림새에요!)"
10153-70 = "(역시, 저는 너무\n평범한 걸까요……)"
10153-80 = "오늘도 파이팅이에요, 선생님!\n제가 힘껏 도와드릴게요!"
10153-90 = "다녀오셨나요, 선생님!\n준비됐어요!"
10153-100 = "드라이브 하기 좋은 날이에요,\n선생님!"
10153-110 = "네? 날씨는 상관 없어요."
10153-120 = "언제든지 좋다구요!"
10153-130 = "저, 전차 문을\n닫았었던가요……?!"
10153-140 = "아, 아우우! \n잠깐 확인하고 올게요!"
10153-150 = "네? 이 옷, 잘 어울린다구요?"
10153-160 = "에, 에헤헤…… \n차암, 갑자기 뭐예요……."
10153-170 = "피곤하세요, 선생님?\n무릎베개…… 해드릴까요?"
10153-180 = "어디 가실 일 있으신가요?\n제가 태워다 드릴게요!"
10153-190 = "생일 축하드려요, 선생님!"
10153-200 = "특별한 하루를 \n같이 보낼 수 있어서……\n에헤헤, 기뻐요!"
10153-210 = "제 생일을 축하해주셔서,\n감사해요!"
10153-220 = "생일에 바라는거요? 으음-"
10153-230 = "특별히 없어요…… \n원하는건, \n전부 가지고 있으니까요.\n친구도, 선생님도요!"
10153-240 = "새해 복 많이 받으세요, 선생님!"
10153-250 = "이 의상, 춥지 않냐고요?"
10153-260 = "네! 괜찮아요!\n크루세이더 쨩의 히터,\n아주 따듯해요!"
10153-270 = "오늘은 크리스마스!\n산타님이 \n바쁘신 날이네요!"
10153-280 = "산타님의 순록은,\n몇 마력일까요?\n말보다 빠를까요?"
10153-290 = "할로윈은 무서-운 \n존재들이 나오는 날이죠."
10153-300 = "오늘, 크루세이더 쨩에게\n주유를 했는데 영수증이……\n정말 무서웠어요……."
10153-320 = "하아~ 전차,\n차가워서 기분 좋네요……."
10153-330 = "역시 그늘은 시원하네요……."
10153-340 = "전차로 만든 비밀기지,\n어떠신가요 선생님?"
10153-350 = "……아주 조용하네요."
10153-360 = "엔진을 끈 전차는,\n언제 그랬냐는 듯이 조용해져요."
10153-370 = "숨소리나 맥박까지 \n들릴 정도로 조용해서……."
10153-380 = "저는 이 공간을 정말 좋아해요."
10153-390 = "세상에 저희만 있는\n기분이라고 할지……."
10153-400 = "아, 아하하! 저 같은 평범한 \n아이와 단둘이 있으셔도,\n딱히 재미없으실 텐데……."
10153-410 = "네? 앗, 아앗! \n그, 그……! 어……!"
10153-420 = "아, 아하하…… 선생님께는 \n매번 응원받게 되네요."
10153-430 = "아, 아아- 왠지 더워졌네요!\n페, 페인트,\n어서 마르면 좋을 텐데-"
10153-440 = "(어떡하죠 아우우- 심장 소리,\n들려버릴 거예요!)"
10153-450 = "(음악이라도 틀어둘걸!\n시동이라도 걸어둘거얼-!)"
10153-460 = "(아우우, 부끄러워-!)"
10153-2600 = "감사합니다!\n이 총,\n짧아서 차 안에서 쓰기 편해요."
