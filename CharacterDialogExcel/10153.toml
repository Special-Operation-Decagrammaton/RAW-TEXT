[translation]
10153-10 = "ブルーアーカイブ！"
10153-20 = "え？この衣装ですか？\n支給品のユニフォームですよ？\nえへへっ……よろしくお願いします！"
10153-30 = "ふぅ…ここはとても過ごしやすいです。クルセイダーちゃんのクーラー、早く直さないと…。"
10153-40 = "みなさん個性的で、\nちょっと\n羨ましいです…。"
10153-50 = "わあ、\nすごく可愛いです！"
10153-60 = "（だ、大胆な\n格好です…）"
10153-70 = "（やっぱり、私は\n普通な方、ですね…）"
10153-80 = "今日も頑張りましょう、先生！\n私も隣でお手伝いします！"
10153-90 = "おかえりなさい、先生！\n準備はばっちりです！"
10153-100 = "ドライブ日和ですね、先生！"
10153-110 = "ん？天気は関係ありませんよ。"
10153-120 = "いつでもドライブ日和です！"
10153-130 = "私、戦車の扉、閉めたっけ…？"
10153-140 = "あうぅ！\nちょっと確認してきます！"
10153-150 = "はい？その衣装、似合ってる？"
10153-160 = "え、えへへ…\nもー、なんですか急に…。"
10153-170 = "先生、疲れていませんか？\n膝枕…しましょうか？"
10153-180 = "外出の予定はありますか？\n戦車で送っていきますよ！"
10153-190 = "お誕生日おめでとうございます、\n先生！"
10153-200 = "「特別」な日を\n一緒に過ごせて…\nえへへ、嬉しいです！"
10153-210 = "私の誕生日を祝ってくださって、\nありがとうございます！"
10153-220 = "欲しいもの、ですか？\nうーん…。"
10153-230 = "特に思いつきません…\n欲しいものは、\n全部持っているので。\n友達も、先生も！"
10153-240 = "あけまして\nおめでとうございます、\n先生！"
10153-250 = "え、寒くないかって？"
10153-260 = "はい、大丈夫です。\nクルセイダーちゃんのヒーターは\nすごく温かいんですよ！"
10153-270 = "今日はクリスマス！\nサンタさんが\n忙しくなる日ですね！"
10153-280 = "サンタさんのトナカイって\n何馬力なんでしょう？\n馬より速いのでしょうか…？"
10153-290 = "ハロウィンは、\nこわ～いものが現れる日。"
10153-300 = "今日、クルセイダーちゃんに\n給油した時のレシートが…\n本当に怖かったです…。"
10153-320 = "はあ～戦車\n冷たくて気持ちいい……。"
10153-330 = "やっぱり日陰は\n涼しいですね……。"
10153-340 = "戦車を使った秘密基地、\n先生はいかがですか？"
10153-350 = "……とても静かですよね。"
10153-360 = "エンジンを切っていると、\n装甲が周りの音を\n吸収してくれるんです。"
10153-370 = "呼吸や心臓の鼓動まで\n聞こえちゃうくらい静かで……。"
10153-380 = "私はこの空間が大好きです。"
10153-390 = "まるで、世界に二人きりに\nなったみたいで――"
10153-400 = "あ、あはは！私みたいな\n普通の生徒と一緒にいても、\n面白くないかもしれませんが……。"
10153-410 = "えっ？あっ、やっ、\nえっと、その……！"
10153-420 = "あはは……先生にはいつも、\n元気をもらってばかり、ですね。"
10153-430 = "あ、あれ？\nなんだか暑くなってきましたね！\nペ、ペンキ、\n早く乾くといいな……！"
10153-440 = "（し、心臓の音が……\n先生に聞こえちゃったら\nどうしよう）"
10153-450 = "（音楽を流すか、\nエンジンをかければ\nよかった……！）"
10153-460 = "（あうぅ……恥ずかしい……）"
10153-2600 = "ありがとうございます！\nこの銃、取り回しがいいので\n戦車の中でも扱いやすいんです。"
