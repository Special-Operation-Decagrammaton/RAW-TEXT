[translation]
10142-10-1 = "Blue... Archive"
10142-20-1 = "ในทะเลที่แสนสดชื่นแห่งนี้ ฉันอยากสร้างความทรงจำ\nที่ลืมไม่ลงกับทุกคน แน่นอนว่ากับคุณครูด้วยนะ\nจะมาด้วยกันใช่มั้ย?"
10142-30-1 = "ตรงไหนจะ\nเย็นสบายที่สุดนะ?"
10142-40-1 = "การแข่งขันกระชับมิตร...\nตื่นเต้นแล้วสินะ"
10142-50-1 = "ฉันอยากแสดง...\nความเป็นหัวหน้าให้ดูแล้ว"
10142-60-1 = "ไม่อยากให้\nสะดุดตาคนอื่นเลย..."
10142-70-1 = "ความทรงจำของวันนี้\nห้ามลืมเลยนะ"
10142-80-1 = "เข้ามาสิ คุณครู\nหวังว่าวันนี้ฉันก็จะ\nพอช่วยอะไรได้นะ"
10142-90-1 = "อ่า... ฉันรออยู่นะ\nจะไปทะเลกันใช่มั้ย?\nฉันเปลี่ยนชุดรอไว้แล้วละ"
10142-100-1 = "ชุดนี้... เป็นยังไงบ้าง?"
10142-110-1 = "ฉันไม่มีชุดว่ายน้ำ\nที่เหมาะกับตัวเองเท่าไรน่ะ..."
10142-120-1 = "เหตุผลที่เลือกสีขาวน่ะเหรอ...?"
10142-130-1 = "ก็ทุกคน\nบอกกันว่าสีนี้ดีกว่า..."
10142-140-1 = "เคล็ดลับในการดูแลผิวเหรอ?"
10142-150-1 = "อืม... ไม่รู้สิ?\nฉันก็ไม่ได้ทำอะไร\nเป็นพิเศษนะ"
10142-160-1 = "อ๊ะ! หรือจะเป็นพลังแฝง\nของยากิโทริ?"
10142-170-1 = "มีคำที่ว่า เราจะตระหนักได้\nก็เมื่อสูญเสียสิ่งสำคัญไป"
10142-180-1 = "ฉันก็เคยเป็นแบบนั้น\nเพราะงั้น..."
10142-190-1 = "จากนี้ฉันจะไม่เสียอะไรไปอีกแล้ว\nไม่เด็ดขาดเลย"
10142-200-1 = "หลังจากมือขวาโดน\nห้วงอัสดงกลืนกิน ฉันก็ลืม\nวิธีที่จะยื่นมือออกไปหาคนอื่น"
10142-210-1 = "ไม่ว่าเรื่องอะไร ฉันก็คิดกังวล\nและพยายามแก้ไขเองอยู่คนเดียว"
10142-220-1 = "แต่จากนี้จะไม่เป็นแบบนั้นอีกแล้วละ\nเพราะฉันมีคุณครูกับทุกคนยังไงล่ะ"
10142-230-1 = "ต่อไปก็ ขอฝากตัว\nอย่างตอนนี้ด้วยนะ"
10142-240-1 = "ฉันมีคนที่แค่อยู่ข้างกัน\nก็ทำให้ฉันสบายใจขึ้นได้"
10142-250-1 = "เห็นว่าวันนี้เป็น\nวันเกิดของคนนั้นน่ะ"
10142-260-1 = "ฉันเลยอยากมาอวยพร\nในชุดที่น่าจดจำ"
10142-270-1 = "เพราะงั้นก็...\nสุขสันต์วันเกิดนะ คุณครู"
10142-280-1 = "การที่ฉันเกิดมาในฤดูหนาว\nฉันคิดว่ามันมีความหมายนะ"
10142-290-1 = "เหมือนดอกไม้ที่เอาชนะ\nความโหดร้ายของฤดูหนาว\nและเบ่งบานออกมาได้..."
10142-300-1 = "สักวันหนึ่ง ฉันก็อยากให้\nดอกไม้สวยๆ บานสะพรั่งเหมือนกัน"
10142-310-1 = "สวัสดีปีใหม่นะ คุณครู"
10142-320-1 = "ปีใหม่ทั้งที\nก็ควรคุยเรื่องร่าเริงสิเนอะ"
10142-330-1 = "เพราะงั้นฉันก็เลย\nถึงจะแค่เลียนแบบไปตามพิธี..."
10142-340-1 = "แต่ฉันก็ลองแต่งตัว\nให้ดูสดใสขึ้นมาหน่อยแล้ว"
10142-350-1 = "เป็นไงบ้าง?"
10142-360-1 = "ฉันทนความหนาวได้เก่งน่ะ\nดูสิ ตอนนี้ก็ยังใส่ชุดว่ายน้ำได้อยู่เลย\nไม่เห็นเป็นไรเลยด้วย?"
10142-370-1 = "อ่า... หรือว่าวันนี้\nฉันควรใส่สีแดง... มานะ...?"
10142-380-1 = "ในวันแบบนี้\nถ้าใส่ชุดว่ายน้ำมา..."
10142-390-1 = "จะเหมือนว่าฉันแค่\nใส่ชุดว่ายน้ำหรือเปล่า?"
10142-400-1 = "ไม่เหมือนฉันแต่งคอสเพลย์\nหรอกเหรอ?"
10142-410-1 = "มะ... ไม่งั้นเหรอ?"
10142-420-1 = "โลกของคอสเพลย์นี่ล้ำลึกจัง..."
10142-440-1 = "ช่วงแรกเราใช้กลยุทธ์นี้แล้วกัน"
10142-450-1 = "ทีมตรงข้ามน่าจะใส่สุดพลัง\nกันตั้งแต่ช่วงแรกเลย"
10142-460-1 = "คุณครู...? "
10142-470-1 = "ตั้งใจมองสัญญาณจากฉัน\nอยู่หรือเปล่า?"
10142-480-1 = "วอกแวกตั้งแต่เริ่มเลยนะ\nไม่สมกับเป็นคุณครูเลย"
10142-490-1 = "มัวแต่ไปมองอะไรอยู่น่ะ..."
10142-500-1 = "อ่า... อย่างนี้เองสินะ"
10142-510-1 = "ขอโทษที"
10142-520-1 = "คงจะตั้งสมาธิไม่ได้สินะ"
10142-530-1 = "ก็ฉันเป็น...\nสาวสวยที่น่าค้นหานี่เนอะ"
10142-540-1 = "ปกติวอลเลย์บอลชายหาด\nจะส่งสัญญาณกันแบบนี้..."
10142-550-1 = "หรือว่าตอนนี้\nควรเปลี่ยนวิธีการดู?"
10142-560-1 = "ไม่สิ...\nจะเปลี่ยนตอนนี้ก็ไม่ทันแล้ว"
10142-570-1 = "ทำแบบนี้ต่อไปเรื่อยๆ เลย คุณครู"
10142-580-1 = "พวกเรา... ไหวอยู่แล้ว"
10142-2600-1 = "ฉันยังไม่ได้เรื่องอยู่เลย ถึงยังไง\nฉันก็จะคว้าเฮียกกุเร็นนี้ไว้ นั่นมัน...\nไม่ใช่การพยายามสวมบทเป็นหัวหน้า\nเฮียกกะเรียวรันหรอกนะ ฉันทำเพื่อ\nเผชิญหน้ากับหัวใจของตัวเองต่างหาก"
