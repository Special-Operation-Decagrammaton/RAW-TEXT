[translation]
10142-10 = "蔚藍……檔案……"
10142-20 = "難得像這樣來到海邊了……\n我想和大家一起製造難忘的回憶。\n老師也能……陪我一起嗎？"
10142-30 = "最涼快的地方\n在哪裡呢……"
10142-40 = "交流會……好期待。"
10142-50 = "想展現出符合\n委員長身分的\n……一面呢。"
10142-60 = "我不太想\n引人注目呢……"
10142-70 = "今天的回憶，\n我想好好珍惜。"
10142-80 = "歡迎回來，老師。\n希望今天也能幫上你的忙。"
10142-90 = "啊……我在等你哦。\n要去海邊對吧？\n我已經換好衣服囉。"
10142-100 = "這個……怎麼樣呢？"
10142-110 = "因為一直找不到\n比想像中還適合的泳裝……"
10142-120 = "選白色的理由……？"
10142-130 = "因為大家都說\n這件比較好……"
10142-140 = "護膚的祕訣？"
10142-150 = "其實也沒有做什麼\n特別的事……"
10142-160 = "啊。說不定是\n烤雞肉串的功勞？"
10142-170 = "常說重要的東西總是在\n失去之後才會發現，對吧。"
10142-180 = "我也曾是如此。\n所以……"
10142-190 = "我不會再放手了。\n絕對不會。"
10142-200 = "自從右臂被\n黃昏吞噬之後，\n我便忘了該如何\n去依靠他人的手。"
10142-210 = "所以總是一個人思考，\n想憑自己解決一切。"
10142-220 = "……但是，現在不一樣了。\n因為有老師和大家在身邊。"
10142-230 = "今後也……請多指教囉。"
10142-240 = "我有一個光是待在身邊\n就能感到安心的人。"
10142-250 = "聽說今天是那個人的生日。"
10142-260 = "所以為了留下回憶，\n我要用這身打扮來為他慶祝。"
10142-270 = "祝你生日快樂，老師。"
10142-280 = "我認為自己在冬天\n出生是有意義的。"
10142-290 = "就像越過冬天的嚴酷，\n在和煦陽光下綻放的\n花朵一樣……"
10142-300 = "我也想在某一天，\n 盡情地綻放。"
10142-310 = "祝你新年快樂，老師。"
10142-320 = "在新年的時候還是聊點\n開朗的話題比較好呢。"
10142-330 = "所以雖然是從外在\n開始著手……"
10142-340 = "我換上了能讓心情\n變得開朗的服裝……"
10142-350 = "你覺得怎麼樣？"
10142-360 = "我算是比較耐寒的哦。\n你看，現在穿著泳裝也沒事。"
10142-370 = "啊……\n今天穿紅色的衣服……\n會比較好嗎……？"
10142-380 = "在今天這種日子穿泳裝……"
10142-390 = "我真的只是……\n穿了泳裝而已嗎？"
10142-400 = "還是變成Cosplay了？"
10142-410 = "咦，不是嗎？"
10142-420 = "Cosplay的世界\n還真是深奧呢……"
10142-440 = "一開始就先用\n這個作戰吧。"
10142-450 = "我想對方一開場\n就會全力進攻。"
10142-460 = "……老師？"
10142-470 = "我的暗號，\n你有看清楚嗎？"
10142-480 = "一開始就東張西望，\n真不像你呢。"
10142-490 = "你究竟在看什麼……"
10142-500 = "啊……\n原來如此。"
10142-510 = "對不起。"
10142-520 = "這樣反而沒辦法\n集中精神吧。"
10142-530 = "畢竟我……是個充滿\n神祕感的美少女。"
10142-540 = "雖然沙灘排球是\n這樣打暗號的……"
10142-550 = "不過從現在開始，\n改變方式會比較好嗎？"
10142-560 = "……不行，果然\n還是太遲了呢。"
10142-570 = "就這樣上吧，老師。"
10142-580 = "如果是我們的話……\n一定沒問題的。"
10142-2600 = "我還有很多不成熟的地方。\n即便如此，我仍想繼續背負這支百蓮。\n那並不是……\n為了扮演百花繚亂的委員長。\n――而是為了直面自己的內心。"
