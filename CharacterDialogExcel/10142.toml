[translation]
10142-10-1 = "蔚藍……檔案……"
10142-20-1 = "難得像這樣來到海邊了……\n我想和大家一起製造難忘的回憶。\n老師也能……陪我一起嗎？"
10142-30-1 = "最涼快的地方\n在哪裡呢……"
10142-40-1 = "交流會……好期待。"
10142-50-1 = "想展現出符合\n委員長身分的\n……一面呢。"
10142-60-1 = "我不太想\n引人注目呢……"
10142-70-1 = "今天的回憶，\n我想好好珍惜。"
10142-80-1 = "歡迎回來，老師。\n希望今天也能幫上你的忙。"
10142-90-1 = "啊……我在等你哦。\n要去海邊對吧？\n我已經換好衣服囉。"
10142-100-1 = "這個……怎麼樣呢？"
10142-110-1 = "因為一直找不到\n比想像中還適合的泳裝……"
10142-120-1 = "選白色的理由……？"
10142-130-1 = "因為大家都說\n這件比較好……"
10142-140-1 = "護膚的祕訣？"
10142-150-1 = "其實也沒有做什麼\n特別的事……"
10142-160-1 = "啊。說不定是\n烤雞肉串的功勞？"
10142-170-1 = "常說重要的東西總是在\n失去之後才會發現，對吧。"
10142-180-1 = "我也曾是如此。\n所以……"
10142-190-1 = "我不會再放手了。\n絕對不會。"
10142-200-1 = "自從右臂被\n黃昏吞噬之後，\n我便忘了該如何\n去依靠他人的手。"
10142-210-1 = "所以總是一個人思考，\n想憑自己解決一切。"
10142-220-1 = "……但是，現在不一樣了。\n因為有老師和大家在身邊。"
10142-230-1 = "今後也……請多指教囉。"
10142-240-1 = "我有一個光是待在身邊\n就能感到安心的人。"
10142-250-1 = "聽說今天是那個人的生日。"
10142-260-1 = "所以為了留下回憶，\n我要用這身打扮來為他慶祝。"
10142-270-1 = "祝你生日快樂，老師。"
10142-280-1 = "我認為自己在冬天\n出生是有意義的。"
10142-290-1 = "就像越過冬天的嚴酷，\n在和煦陽光下綻放的\n花朵一樣……"
10142-300-1 = "我也想在某一天，\n 盡情地綻放。"
10142-310-1 = "祝你新年快樂，老師。"
10142-320-1 = "在新年的時候還是聊點\n開朗的話題比較好呢。"
10142-330-1 = "所以雖然是從外在\n開始著手……"
10142-340-1 = "我換上了能讓心情\n變得開朗的服裝……"
10142-350-1 = "你覺得怎麼樣？"
10142-360-1 = "我算是比較耐寒的哦。\n你看，現在穿著泳裝也沒事。"
10142-370-1 = "啊……\n今天穿紅色的衣服……\n會比較好嗎……？"
10142-380-1 = "在今天這種日子穿泳裝……"
10142-390-1 = "我真的只是……\n穿了泳裝而已嗎？"
10142-400-1 = "還是變成Cosplay了？"
10142-410-1 = "咦，不是嗎？"
10142-420-1 = "Cosplay的世界\n還真是深奧呢……"
10142-440-1 = "一開始就先用\n這個作戰吧。"
10142-450-1 = "我想對方一開場\n就會全力進攻。"
10142-460-1 = "……老師？"
10142-470-1 = "我的暗號，\n你有看清楚嗎？"
10142-480-1 = "一開始就東張西望，\n真不像你呢。"
10142-490-1 = "你究竟在看什麼……"
10142-500-1 = "啊……\n原來如此。"
10142-510-1 = "對不起。"
10142-520-1 = "這樣反而沒辦法\n集中精神吧。"
10142-530-1 = "畢竟我……是個充滿\n神祕感的美少女。"
10142-540-1 = "雖然沙灘排球是\n這樣打暗號的……"
10142-550-1 = "不過從現在開始，\n改變方式會比較好嗎？"
10142-560-1 = "……不行，果然\n還是太遲了呢。"
10142-570-1 = "就這樣上吧，老師。"
10142-580-1 = "如果是我們的話……\n一定沒問題的。"
10142-2600-1 = "我還有很多不成熟的地方。\n即便如此，我仍想繼續背負這支百蓮。\n那並不是……\n為了扮演百花繚亂的委員長。\n――而是為了直面自己的內心。"
