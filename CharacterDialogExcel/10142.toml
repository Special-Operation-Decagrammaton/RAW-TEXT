[translation]
10142-10 = "Blue...Archive."
10142-20 = "I wish to forge unforgettable memories with the others at a refreshing beach. Naturally, you are included in this. Would you come with us?"
10142-30 = "Where would be most refreshing?"
10142-40 = "A social outing... I am waiting with great anticipation."
10142-50 = "I wish to present myself...in a way befitting of a president."
10142-60 = "I wish not to draw all the attention upon myself."
10142-70 = "Let us treasure the memories made today."
10142-80 = "Welcome, Sensei. I hope that, just like any other day, I can be of assistance to you."
10142-90 = "Ah... I've been waiting for you. It is time to venture to the beach, yes? I'm already dressed."
10142-100 = "How...do I look?"
10142-110 = "I failed to find a swimsuit that fit me quite as I hoped..."
10142-120 = "The reason why I chose white...?"
10142-130 = "The others insisted this was the best option..."
10142-140 = "My skincare secret?"
10142-150 = "Hm, is there one? I don't do much in particular."
10142-160 = "Ah! Perhaps it could be a hidden benefit of eating chicken skewers?"
10142-170 = "There's a saying that you only realize what you've lost until it's gone."
10142-180 = "I was this way. That's why..."
10142-190 = "I will not make that mistake again. Never."
10142-200 = "After my right hand was taken by the spirit realm, I forgot how to reach out."
10142-210 = "My automatic reaction to problems was to worry and attempt to solve them myself."
10142-220 = "However, now I have Sensei and my friends."
10142-230 = "I'll be in your care, as I always have been."
10142-240 = "There is a person who brings me calm with merely their presence."
10142-250 = "And today is that person's birthday."
10142-260 = "I hoped to celebrate it with a memorable outfit."
10142-270 = "So... Happy birthday, Sensei."
10142-280 = "I believe I was born during the winter for a reason."
10142-290 = "Like the flower that blooms after the arduous trials of winter..."
10142-300 = "I, too, hope to bloom into a beautiful flower."
10142-310 = "Happy New Year, Sensei."
10142-320 = "Perhaps our conversation should be that of a positive one in this new year."
10142-330 = "So in hopes of keeping that intention..."
10142-340 = "I donned this outfit to brighten the atmosphere."
10142-350 = "What do you think?"
10142-360 = "Cold weather never bothered me much. Observe. Even in this swimsuit, I am not shivering, correct?"
10142-370 = "Ah... Should I have worn a red one today...after all...?"
10142-380 = "If I wear swimsuit on a day like this..."
10142-390 = "Am I simply wearing a swimsuit?"
10142-400 = "Or could I consider this a cosplay?"
10142-410 = "No, I cannot?"
10142-420 = "The world of cosplay is truly very profound..."
10142-440 = "We will proceed with this plan first."
10142-450 = "I expect they intend to begin with their full force."
10142-460 = "...Sensei? "
10142-470 = "Are you not paying attention to my signals?"
10142-480 = "It's unlike you to get distracted so easily."
10142-490 = "What is it that caught your eye...?"
10142-500 = "Ah... I see. "
10142-510 = "...I apologize."
10142-520 = "I see how that would mar your focus. "
10142-530 = " It is all because... I am a mysterious beauty."
10142-540 = "These are standard signs in beach volleyball..."
10142-550 = "Would it be wise to attempt a different approach?"
10142-560 = "...No. The hour is upon us."
10142-570 = "We must persevere, Sensei."
10142-580 = "If it is us two... It will be okay."
10142-2600 = "Despite my plethora of shortcomings, I will continue wielding the Hundred Lotus. Not...for a false claim to the Hyakkaryouran presidency, but rather in an endeavor to confront my own heart."
