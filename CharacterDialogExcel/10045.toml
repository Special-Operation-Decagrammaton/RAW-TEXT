[translation]
10045-10-1 = "ブル～アーカイブ～。"
10045-20-1 = "ふぁあ～…あ、先生～。\nせっかくなんだし、のんびり行こうよ～"
10045-30-1 = "ほほえましい\n光景だねぇ…まあ、\n余裕があるのは\n良いことだ。"
10045-40-1 = "さーて、どこか横に\nなれるところは…"
10045-50-1 = "どこか\n寛げそうな場所は…"
10045-60-1 = "…お、\n良さそうだねぇ？"
10045-70-1 = "何これ…？"
10045-80-1 = "やぁやぁ先生、お疲れ様ー\n今日くらいは\nのんびりしない？"
10045-90-1 = "先生おかえり～。"
10045-100-1 = "…ん、私？\nずーっとここで\n休憩してたよー？"
10045-110-1 = "まさかこの格好で、\n働かせるつもりかー？\nなんて？"
10045-120-1 = "相変わらず\n先生は忙しそうだねぇ。"
10045-130-1 = "…これを手伝えば良い？"
10045-140-1 = "んー？まあ、確かに\n休みたい気持ちは\nやまやまだけど…"
10045-150-1 = "先生が働いてるのに、\nその横で休むのもねぇ？"
10045-160-1 = "疲れたら\nいつでも言ってね、先生。"
10045-170-1 = "枕代わりに、\nこの浮き輪とかどう？"
10045-180-1 = "今日はどんなことが\n起きるのかな～？"
10045-190-1 = "お誕生日おめでとう、先生。\n何か欲しいものでもある？"
10045-200-1 = "…私にできる範囲なら、\n何でも良いけど？"
10045-210-1 = "…あ、そっか。\n私の誕生日か。"
10045-220-1 = "ありがとう、先生…\n覚えててもらえるのは、\n嬉しいことだね。"
10045-230-1 = "うへへ。"
10045-240-1 = "あけましておめでとう、\n先生～"
10045-250-1 = "…今年もたくさん、\n楽しいことがあると良いね"
10045-260-1 = "何か騒がしいと思ったら、\nクリスマスか～"
10045-270-1 = "ま、おじさんも別に、\nこの空気は\n嫌いじゃないけどね。"
10045-280-1 = "ただ、ちょっとこの格好じゃ\n外には出られないかなー？"
10045-290-1 = "色んな仮装の\n人がたくさんだぁ。"
10045-300-1 = "…え、何その視線。"
10045-310-1 = "これは仮装じゃ\nないってば～"
10045-330-1 = "いやぁ、たまんないねぇ…\nこれぞまさに楽園…"
10045-340-1 = "涼しい日陰…\n心地良い海風…\n穏やかな波の音…"
10045-350-1 = "いやぁ、\nここに来られて良かった～\n最高だねぇ、\nまるで夢みたいな場所だー…"
10045-360-1 = "…先生もそんな\nとこにずっと立ってないで、\n横になってみたら？"
10045-370-1 = "あんまり広くはないけど、\nどう？良い感じだよ～？"
10045-380-1 = "うへー、\nなるほどそう来たか…。"
10045-390-1 = "まあ、何となく\n予想はしてたけどね。"
10045-400-1 = "別にいいのに…"
10045-410-1 = "まあ、そういうところ\n嫌いじゃないけど。"
10045-420-1 = "…えへへ。"
10045-2600-1 = "ここまでしてくれるとか…\nほんと、変わってるねえ先生も。\nまぁ良いけど…じゃあ私も、\n今まで以上に頑張らないとね？"
