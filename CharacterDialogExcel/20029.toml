[translation]
20029-10-1 = "Blue Archive!"
20029-20-1 = "The summer... The beach... It's all so blissful, Sensei. Of course, I haven't forgotten about my training."
20029-30-1 = "I want to create a place where everyone can lay down their burdens."
20029-40-1 = "A refreshing place. A place to rest."
20029-50-1 = "It seems that everyone is enjoying themselves. I'm glad."
20029-60-1 = "I wonder what Tsubaki and Kaede are doing..."
20029-70-1 = "I feel so sluggish and lazy... Is this the frightful power of summer...?"
20029-80-1 = "Hello, Sensei. I'm ready for whatever you have in store for me today."
20029-90-1 = "Oh, Sensei! It's fine. I'm used to waiting."
20029-100-1 = "\"Summer.\" \"Beach.\" They're such magical words."
20029-110-1 = "So magical they almost made me forget to train..."
20029-120-1 = "Shall I attempt to read your mind, Sensei?"
20029-130-1 = "You...just want to spend some time with me, right?"
20029-140-1 = "Well? Am I right?"
20029-150-1 = "I came here today to help you work, Sensei..."
20029-160-1 = "But, I keep thinking of...other things... I need more training..."
20029-170-1 = "Would you like some lemonade? And perhaps a sandwich for a light snack..."
20029-180-1 = "I made plenty, so please, enjoy."
20029-190-1 = "If you're hot...come sit under my parasol."
20029-200-1 = "And...I could also offer you a lap pillow. How does that sound?"
20029-210-1 = "Sensei's birthday... What a fabulous day."
20029-220-1 = "Heehee, happy birthday, Sensei!"
20029-230-1 = "You're wishing me...a happy birthday?"
20029-240-1 = "I'm so happy, really... So much so that I can't express it with words."
20029-250-1 = "Heehee. I guess I already got my gift."
20029-260-1 = "Happy New Year, Sensei."
20029-270-1 = "It's the New Year already. Shall we make a wish together?"
20029-280-1 = "My wish? Heehee. It's a secret."
20029-290-1 = "It's Christmas, Sensei. The day when good children get gifts..."
20029-300-1 = "So...what do you think, Sensei? Was I a good child?"
20029-310-1 = "Wow, it's Halloween. I've prepared all of my tricks and treats..."
20029-320-1 = "Oh? I don't have to prepare both? Come to think of it..."
20029-340-1 = "If only our time here could last forever."
20029-350-1 = "If only we could preserve it, like with a photo or a drawing. If only that were possible..."
20029-360-1 = "So you feel the same way, Sensei?"
20029-370-1 = "That's... Somehow, that’s... I'm a bit embarrassed."
20029-380-1 = "Today... I nearly forgot to be a proper lady, because I... I was so happy."
20029-390-1 = "Um, Sensei."
20029-400-1 = "Maybe one day... Could we spend time together again? Just the two of us?"
20029-2600-1 = "What a wonderful gift... I wish I could express in words how much appreciation I feel inside, but...it's hard to organize my thoughts... Th-Thank you, Sensei."
