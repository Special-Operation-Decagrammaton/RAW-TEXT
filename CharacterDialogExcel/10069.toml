[translation]
10069-10-1 = "Blue Archive"
10069-20-1 = "ฉันชื่ออาเคชิโระ รูมิ ประธานย่านการค้าเทพเต่าดำ\nโรงเรียมัธยมซานไห่จิง เรียกเป็นกันเองว่ารูมิก็พอ"
10069-30-1 = "การตกแต่งภายในของที่นี่...\nเราลองปรับใช้กับ\nย่านการค้าของเราดีมั้ย?"
10069-40-1 = "ของว่างตรงนี้\nก็เอาไว้ศึกษา\nเป็นแนวทางได้เยอะเลย"
10069-50-1 = "นานแล้วนะที่ไม่ได้\nใช้เวลาว่าง\nอย่างสบายๆ แบบนี้..."
10069-60-1 = "หวังว่าพวกมังกรดำ\nจะไม่มาหาเรื่องทะเลาะ\nกับฉันที่นี่นะ..."
10069-70-1 = "สงบดีจัง...\nอืม ช่างเป็นเรื่องราวดีๆ"
10069-80-1 = "อะไรกัน คุณครูเองเหรอ"
10069-90-1 = "นึกว่าลืมมาหากันแล้วซะอีก ฮ่าฮ่า"
10069-100-1 = "เชิญเลยคุณครู"
10069-110-1 = "ทำให้ประธานย่านการค้า\nเทพเต่าดำรอได้นี่\nใจกล้าไม่เบาเลยนะ?"
10069-120-1 = "ที่นี่คือชาเล่ต์... อ้าว โทษที "
10069-130-1 = "ไม่ได้ออกมาจากห้องครัวมานานน่ะ\nก็เลยตกใจนิดหน่อย"
10069-140-1 = "ห้องครัวก็คือ\nสนามรบสำหรับเชฟ..."
10069-150-1 = "แล้วที่นี่เป็นสนามรบ\nของคุณครูหรือเปล่านะ"
10069-160-1 = "ที่นี่น่าจะมีอุปกรณ์\nเครื่องครัวง่ายๆ ที่ใช้\nทำอาหารอยู่ได้ใช่มั้ยนะ...?"
10069-170-1 = "เปล่า แค่คิดว่าจะ\nทำอะไรสักหน่อยน่ะ"
10069-180-1 = "เรื่องอาหารการกิน\nเป็นเรื่องสำคัญนะ คุณครู"
10069-190-1 = "อย่าอดอาหาร อย่ากินแค่แบบผ่านๆ ล่ะ\nเข้าใจหรือเปล่า?"
10069-200-1 = "เหตุผลที่ชอบทำอาหารเหรอ?\nอืม… คงเพราะการทำอาหาร\nมันตรงไปตรงมาน่ะ"
10069-210-1 = "ยิ่งเอาใจใส่ก็ยิ่งอร่อยมากขึ้น\nยิ่งศึกษาหาข้อมูล\nมันก็ยิ่งมีความเป็นไปได้"
10069-220-1 = "มันก็ค่อนข้างจะ...\nแอบๆ คล้ายคุณครูอยู่นะ"
10069-230-1 = "ฮ่าฮ่า จำได้สิ\nวันนี้วันเกิดครูใช่มั้ยล่ะ?"
10069-240-1 = "ฉันถึงได้ทำบะหมี่อายุยืนนี่ไง\nมีลูกพีชเป็นของหวานด้วยนะ\nต้องกินให้หมดเลยนะ"
10069-250-1 = "วันเกิดฉันเหรอ...?\nขอบใจนะคุณครู"
10069-260-1 = "ไม่ได้รับคำอวยพรจากคนอื่น\nมานานเลยแฮะ"
10069-270-1 = "พอทำงานเป็นประธานกลุ่มการค้าแล้ว\nฉันมักจะลืมวันเวลาอยู่บ่อยๆ น่ะ"
10069-280-1 = "สวัสดีปีใหม่!\nปีนี้ก็ฝากตัวด้วยนะ!"
10069-290-1 = "ปีใหม่ทั้งทีก็ต้องมีเกี๊ยวซ่า!\nแล้วก็คางามิโมจิและปลาผัดเผ็ด\nมีซุปโมจิเตรียมไว้ด้วยนะ\nและก็…"
10069-300-1 = "หืม? ถ้ากินหมดนี่\nมีหวังท้องแตกแน่เลยงั้นเหรอ…?"
10069-310-1 = "คริสต์มาสเหรอ...\nถึงจะไม่ใช่วันที่คุ้นเคยขนาดนั้น\nแต่ก็เป็นวันที่บรรยากาศดี"
10069-320-1 = "วันนี้ว่าจะทำถังหูลู่ละ\nว่าไง?"
10069-330-1 = "ฮาโลวีนเหรอ...\nถึงจะไม่คุ้นเคย\nแต่ก็รู้หรอกว่าเป็นวันอะไร"
10069-340-1 = "เอาละ ทำขนมไหว้พระจันทร์\nไส้ฟักทองดีมั้ย?"
10069-360-1 = "อ่า... ดูสิ ดูเหมือน...\nจะมองทะลุได้เลย"
10069-370-1 = "เอาเถอะ ไม่ต้องใส่ใจหรอก\nมันไม่ได้สึกหรออะไรนี่นะ"
10069-380-1 = "ถ้ารู้ว่าจะเป็นแบบนี้\nฉันคงใส่ชุดชั้นในน่ารักๆ\nมาแล้วละ"
10069-390-1 = "คิดแล้ว...\nมันน่าเสียดายมากเลยว่ามั้ย?"
10069-400-1 = "ฮ่ะฮ่า ทำไมเบือนหน้าหนีแบบนั้นล่ะ\nฉันไม่ได้คิดอะไรมากสักหน่อย?"
10069-410-1 = "คุณครูมีมุมแบบนั้นด้วย\nต่างจากที่ฉันคิดไว้เลยแฮะ...\nฮุฮุ โดนใจดีจัง"
10069-420-1 = "ไม่ใช่เรื่องที่เกิดขึ้นบ่อยๆ นี่นา...\nฉันทำให้คุณครู\nว้าวุ่นใจขึ้นอีกหน่อยดีมั้ยนะ…?"
10069-2600-1 = "อุปกรณ์ที่เหมาะมือเป็นสิ่งสำคัญเลยนะ\nไม่ว่าจะเป็นอุปกรณ์ เครื่องครัวหรือว่าปืน"
