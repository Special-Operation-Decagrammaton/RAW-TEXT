[translation]
10020-10-1 = "ブルーアーカイブ。"
10020-20-1 = "下江コハル…。\nい、言っとくけど、\nここに長くいるつもりはないから…！"
10020-30-1 = "うう……\nリア充め……。"
10020-40-1 = "あううう……。"
10020-50-1 = "な、馴れ合うつもりは\nないから。"
10020-60-1 = "エッチなものと\nかがあったら、\n全部没収するからね。"
10020-70-1 = "皆、楽しそうだね…。"
10020-80-1 = "あ、先生、おかえり。"
10020-90-1 = "待ってたよ、先生。"
10020-100-1 = "わ、私の前で、\n素行不良とか許さないから！"
10020-110-1 = "成績のことは言わないで！\nど、努力はしてるもん……。"
10020-120-1 = "頑張って、\n早く補習授業部を\n卒業してやるんだから。"
10020-130-1 = "え、エッチなもの……？"
10020-140-1 = "そ、そういうのはダメ！\n見つけたら全部没収！焼却！"
10020-150-1 = "が、学生の身分で\n交際とかダメだから！\nそんなの不健全よ！"
10020-160-1 = "キヴォトスでは\nいけないことなの！"
10020-170-1 = "先生の誕生日なんでしょう。\n今日くらい、\n少しゆっくりしても……。"
10020-180-1 = "や、やっぱり今の無し、\nちゃんと真面目に仕事して！"
10020-190-1 = "わ、私の誕生日、覚えてたの？"
10020-200-1 = "あ、ありがとう……。\nまさか覚えてると\n思わなかった……"
10020-210-1 = "ちょ、ちょっと嬉しいかも……？"
10020-220-1 = "お正月なのに、\n私と居ていいの？"
10020-230-1 = "わ、私は別に構わないけど……？"
10020-240-1 = "せ、聖なる夜を汚すような、\n不埒な行為は全部禁止よ！\n先生、聞いてる！？"
10020-250-1 = "飴？\nそんなのとっくに卒業したけど？\nわ、私はもっと大人の……"
10020-260-1 = "な、なんでもない。"
10020-280-1 = "な、何……！？"
10020-290-1 = "（あ、あれっ……これって、\nまさか……！？）"
10020-300-1 = "べ、別に私、\n何も間違ったことは\n言ってないでしょ！？"
10020-310-1 = "（待って、もしかしてこの\nままだと私、先生と……！？）"
10020-320-1 = "（こ、こういう展開、\n本で何度も見たことある……！\n本当に、本当にあの\n流れに入っちゃうの！？）"
10020-330-1 = "（あ、あんなこととか、\nこんなこと、とか……）"
10020-340-1 = "（っ！？ま、まさか、\nそんなことまで……！？）"
10020-350-1 = "つ、ついに本性を\n表したわね、先生……！？"
10020-360-1 = "（やばいやばいやばい……！\nま、まだ覚悟とか\n全然できてないんだけど！？）"
10020-2600-1 = "私もここまで来られた……。\n先生、見てる？ここからがスタートだから。\nこれからも、見守っててよね。"
