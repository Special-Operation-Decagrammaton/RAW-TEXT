[translation]
10020-10-1 = "Blue Archive."
10020-20-1 = "Shimoe Koharu... Mark my words. I won't be here for long!"
10020-30-1 = "Ugh. Normies..."
10020-40-1 = "Ugh..."
10020-50-1 = "I have no plans of getting to know you better."
10020-60-1 = "If I come across anything unseemly, I'll get rid of every bit of it."
10020-70-1 = "Everyone looks so excited."
10020-80-1 = "Oh, Sensei. Welcome."
10020-90-1 = "I've been waiting, Sensei."
10020-100-1 = "I-I won't forgive anyone being naughty where I can see!"
10020-110-1 = "Quiet about my grades...! I'm trying my best."
10020-120-1 = "I'm gonna do my best to quickly graduate from the Make-Up Work Club."
10020-130-1 = "N-Naughty things...?"
10020-140-1 = "No such thing allowed! I'm gonna confiscate everything and burn it into ashes!"
10020-150-1 = "Teacher-student relationships are completely inappropriate!"
10020-160-1 = "That can't happen in Kivotos!"
10020-170-1 = "It's your birthday, Sensei. You can relax today."
10020-180-1 = "No, wait! You can't slack off just because it's your birthday!"
10020-190-1 = "Y-You knew today is my birthday?"
10020-200-1 = "Th-Thank you. I didn't think you'd remember."
10020-210-1 = "That makes me weirdly happy..."
10020-220-1 = "Are you sure you want to spend your New Year's with me?"
10020-230-1 = "N-Not that I'd care, mind you."
10020-240-1 = "Nothing illicit will taint this holy night! You got that, Sensei?!"
10020-250-1 = "Candy? I'm too grown up for candy! I-I want something more adult-ish..."
10020-260-1 = "N-Never mind."
10020-280-1 = "Wh-What are you...?!"
10020-290-1 = "(O-Oh, no. This can't be happening!)"
10020-300-1 = "I d-didn't say something wrong, did I?"
10020-310-1 = "(W-Wait. At this rate, Sensei and I will be...)"
10020-320-1 = "(Is this what I think it is? I've read about it in books so many times. Is this really happening?!)"
10020-330-1 = "(What am I supposed to do? Do I close my eyes?)"
10020-340-1 = "(N-No way! How far will things go?!)"
10020-350-1 = "Sensei... I know what you're after."
10020-360-1 = "(This is BAD! Not good. I-I'm not ready for something like this...)"
10020-2600-1 = "I made it this far. Sensei, you saw it, right? This is just the beginning. Please continue to watch over me."
