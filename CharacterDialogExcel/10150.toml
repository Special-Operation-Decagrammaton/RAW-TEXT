10150-520 = "거리가 일루미네이션으로\n반짝반짝 빛나네.\n마치 밤바다에서 올려다\n본 하늘 같아."
10150-530 = "트릭 오어 트릿— 이야, 선생님."
10150-540 = "참고로 책상 위에 남아있던\n사탕은 아까 내가 아까 먹었어."
10150-550 = "……선생님,\n지금 갖고 있는 과자 없지?"
10150-560 = "자, 그럼……\n어떤 장난을 쳐볼까?"
10150-2600 = "다트에 재능이 있는 편은 아니지만……\n이걸 사용하면 물 속에서도 확실하게\n불스아이를 노릴 수 있지.\n고마워, 선생님."
