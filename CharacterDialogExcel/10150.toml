[translation]
10150-10 = "블루 아카이브~"
10150-20 = "오디세이아 해양학원 다이빙부의 부부장, 후치가미 코토네야.\n샬레의 선생님…… 맞지?\n내 눈이 조금 나빠서."
10150-30 = "(뭔가 이상한 게\n보이네……\n눈이 더 나빠졌나?)"
10150-40 = "요즘 육지에서는 이런 게\n유행하는구나……"
10150-50 = "날씨가 좋네.\n오후에는 슈트를\n꺼내 말려야겠어."
10150-60 = "아, 이 작가의 신간……\n나왔었구나!"
10150-70 = "(내가 앉을 수\n있을만한 곳이……\n어디 없으려나?)"
10150-80 = "어서 와, 선생님.\n선생님이 오는 발소리를\n듣고 있었어."
10150-90 = "선생님, <사랑은 잉어>\n작가의 신작 읽어봤어?"
10150-100 = "스토리는 좋았는데……\n해양 고증이 영 엉망이야."
10150-110 = "아무래도 오디세이아 학원\n출신은 아닌가 봐."
10150-120 = "요새 D.U.에도 포케 전문점이\n꽤 생긴 것 같은데……\n생선이 없는 포케도\n팔고 있더라고."
10150-130 = "솔직히 그건 그냥\n샐러드 아니야?"
10150-140 = "(이 집무실에는 왜 이렇게\n도청기가 많지……?)"
10150-150 = "선생님. 코코로를 절대\n화나게 해선 안 돼."
10150-160 = "화나면 엄청 무섭거든……\n농담이 아니라, 정말로."
10150-170 = "내겐 세상의 어느 장소보다도,\n바다가 편하게 느껴지지만……\n우리도 언젠간 바다가 아닌\n 곳으로 돌아가게 될 거야."
10150-180 = "생일 축하해, 선생님."
10150-190 = "오디세이아 학원에서는\n돌고래와 마주치면 좋은 일이\n생긴다는 이야기가 있는데……"
10150-200 = "그러니까, 오늘 하루는\n내가 선생님과 함께 있어줄게."
10150-210 = "내 생일 선물? 글쎄……"
10150-220 = "선생님을 받고 싶다고 하면,\n너무 과한 요구려나? 후후."
10150-230 = "새해 복 많이 받아, 선생님."
10150-240 = "응? 춥지 않냐고?\n조금 춥긴 한데…… 괜찮아."
10150-250 = "이따가 부원들과 온수 풀에\n갈 예정이었거든."
10150-260 = "괜찮다면 선생님도 같이 갈래?"
10150-270 = "거리가 일루미네이션으로\n반짝반짝 빛나네.\n마치 밤바다에서 올려다\n본 하늘 같아."
10150-280 = "트릭 오어 트릿— 이야, 선생님."
10150-290 = "참고로 책상 위에 남아있던\n사탕은 아까 내가 아까 먹었어."
10150-300 = "……선생님,\n지금 갖고 있는 과자 없지?"
10150-310 = "자, 그럼……\n어떤 장난을 쳐볼까?"
10150-320 = "……선생님, 맞지?"
10150-330 = "아, 선생님. 와 주었구나."
10150-340 = "미안. 귀가 물 속에 잠겨 있어서\n부르는 걸 미처\n알아차리지 못했어."
10150-350 = "응? 이 책 말하는 거야?"
10150-360 = "괜찮아. 물에 젖지 않도록\n방수 처리된 책이거든."
10150-370 = "그게 아니라고……?\n물 위에서 자면 위험하니까……?"
10150-380 = "괜찮아, 자주 해봤으니까.\n게다가 여기 누워 있는 거,\n꽤 기분 좋거든."
10150-390 = "따사로운 햇볕을 마주하며, \n수면 아래의 소리에\n귀를 기울일 수 있으니……"
10150-400 = "침잠하는 것들의\n목소리를 듣는다는 점에서,"
10150-410 = "독서와 다이빙은\n닮은 구석이 많은 것 같아."
10150-420 = "선생님. 선생님도 나와 함께\n이 위에 누워 보지 않을래?"
10150-430 = "내가…… 수면 아래의 이야기를\n잔뜩 들려 줄게."
10150-440 = "오디세이아 학원에서는\n돌고래와 마주치면 좋은 일이\n생긴다는 이야기가 있는데……"
10150-450 = "그러니까, 오늘 하루는\n내가 선생님과 함께 있어줄게."
10150-460 = "내 생일 선물? 글쎄……"
