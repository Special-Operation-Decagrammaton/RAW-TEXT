[translation]
10150-10 = "ブルーアーカイブ〜"
10150-20 = "オデュッセイア海洋高等学校ダイビング部副部長、\n淵上コトネ。\nえっと……シャーレの先生、で合ってる？\n目が悪いから、あまり見えなくて。"
10150-30 = "（なんか、変なものが\nいるような……\n……また、視力落\nちたかな）"
10150-40 = "これ、陸で\n流行ってるの……？"
10150-50 = "いい天気……\n午後はマリンスーツを\n干さないと。"
10150-60 = "この作家さんの\n新刊……出てたんだ。"
10150-70 = "（ゆっくり座れる\nところ……どこかに\nあるかな）"
10150-80 = "いらっしゃい、先生。\nふふっ、足音で分かってたよ。"
10150-90 = "先生、「恋よ鯉」先生の新作、\n読んだ？"
10150-100 = "お話はすごく良かったけど……\n海の描写がちょっと\n気になっちゃって。"
10150-110 = "オデュッセイア\n出身ではなさそう。"
10150-120 = "最近、D.U.にポキサラダの\n専門店が増えてるんだけど……\n魚が入ってないんだよね。"
10150-130 = "やっぱそれって\nただのサラダだよね……？"
10150-140 = "（ここ、やけに盗聴器が\n多いような……？）"
10150-150 = "先生、ココロを\n怒らせないようにね。"
10150-160 = "怒るとすごく怖いんだ……\n本当だよ。"
10150-170 = "陸のどこにいるよりも、\n海の方が落ち着くけど……\nいつかは陸に戻る日も\n来るんだよね。"
10150-180 = "誕生日おめでとう、先生。"
10150-190 = "オデュッセイアでは\nイルカを見つけると\nいいことがあるって\n言われてるんだ。"
10150-200 = "だから……今日は一日、\n先生と一緒にいてあげる。"
10150-210 = "誕生日に欲しいもの？\nそうだね――"
10150-220 = "先生が欲しい、って言ったら……\n困らせちゃう、かな？ふふ"
10150-230 = "あけましておめでとう、先生。"
10150-240 = "ん？寒くないのかって？\nちょっと寒いけど……\n大丈夫。"
10150-250 = "この後、みんなと\n温水プールに行くから。"
10150-260 = "よかったら、先生も来る？"
10150-270 = "イルミネーション、綺麗だね。\nまるで夜の海から\n見上げた空みたい。"
10150-280 = "トリック・オア・トリート、\nだよ先生。"
10150-290 = "でも、机の上の飴は既に持って\n行っちゃったから……"
10150-300 = "先生はいま、\nお菓子を持っていない。"
10150-310 = "さて……\nどんな悪戯をしよっかな。"
10150-320 = "たぶん……先生、だよね？"
10150-330 = "あ、先生。来てくれてたんだね。"
10150-340 = "ごめん。水の中にいたから\n気づいてなくて……。"
10150-350 = "ん？ああ……この本？"
10150-360 = "防水加工のものだから\n大丈夫だよ。"
10150-370 = "そうじゃない……？\n水の上で寝るのは危険？"
10150-380 = "心配しないで、慣れてるから。\nそれに……ここ、\nすごく気持ちいいんだ。"
10150-390 = "日向ぼっこしながら、\n水中の音を\n聞いていられるの……。"
10150-400 = "そういう意味では、\n読書とダイビングって\nちょっと似てるかも。"
10150-410 = "どちらも沈みゆくものの\n声を聴くから。"
10150-420 = "ほら、先生も一緒に\nやってみない？"
10150-430 = "私が……水底の世界のお話を、\nたくさん聞かせてあげるから。"
10150-440 = "オデュッセイアでは\nイルカを見つけると\nいいことがあるって\n言われてるんだ。"
10150-450 = "だから……今日は一日、\n先生と一緒にいてあげる。"
10150-460 = "誕生日に欲しいもの？\nそうだね――"
10150-470 = "先生が欲しい、って言ったら……\n困らせちゃう、かな？ふふ"
10150-480 = "あけましておめでとう、先生。"
10150-490 = "ん？寒くないのかって？\nちょっと寒いけど……\n大丈夫。"
10150-500 = "この後、みんなと\n温水プールに行くから。"
10150-510 = "よかったら、先生も来る？"
10150-520 = "イルミネーション、綺麗だね。\nまるで夜の海から\n見上げた空みたい。"
10150-530 = "トリック・オア・トリート、\nだよ先生。"
10150-540 = "でも、机の上の飴は既に持って\n行っちゃったから……"
10150-550 = "先生はいま、\nお菓子を持っていない。"
10150-560 = "さて……\nどんな悪戯をしよっかな。"
10150-2600 = "ダーツはあまり得意じゃないけど……\nこれを使ったら、水中でもブルズアイを\n狙えそう。ありがとう、先生。"
