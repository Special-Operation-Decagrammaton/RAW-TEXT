[translation]
20014-10-1 = "블루 아카이브!"
20014-20-1 = "SRT 특수학원,\nRABBIT 소대의 소라이 사키다.\n그래서, 샬레의 작전 교범은 어디에 있지?"
20014-30-1 = "다들 기강이\n잔뜩 빠져서…\n한심한 모양새야."
20014-40-1 = "어딜 가나 바보들 뿐이군."
20014-50-1 = "아무리 휴식 중이라도\n최소한의 군기는\n유지해야……"
20014-60-1 = "(이 물건의 사용법이\n적힌 매뉴얼은\n어디에…?)"
20014-70-1 = "(뭐야, 저거. 교범에서도\n본 적 없는데……)"
20014-80-1 = "……아, 선생님이었나."
20014-90-1 = "웬 수상한 사람이 얼굴을\n내밀기에 하마터면 쏠 뻔했네."
20014-100-1 = "……늦었잖아.\n작전 중의 1분 1초는\n생명과도 직결된다는 사실을\n벌써 잊어버린 거야?"
20014-110-1 = "…장난을 칠 시간이 있으면\n업무에 집중해."
20014-120-1 = "옛말에도 있지만,\n총기는 좋은 친구와 같아서."
20014-130-1 = "제대로 관리하면,\n배신하는 법이 없다고 하지."
20014-140-1 = "기능 고장은 게으름뱅이에게나\n일어나는 일이라고."
20014-150-1 = "역시 교범은 종이로\n된 게 제일이야."
20014-160-1 = "배터리를 충전할 필요도 없고,\n해킹의 염려도 없으니까."
20014-170-1 = "…안되는 건 안 돼.\n작전 중에 철모를\n벗을 수 있을 리가 없잖아."
20014-180-1 = "선배들이라면 이런\n단순한 당번 업무는 벌써\n끝내고도 남았을 텐데…"
20014-190-1 = "가끔은 내 미숙함이\n너무나도 분해…"
20014-200-1 = "생일 축하해, 선생님.\n뭔가 선물로 받고\n싶은 건 없어?"
20014-210-1 = "…내 철모?!\n지금 쓰고 있는 이거?"
20014-220-1 = "그, 그건 아무리…\n선생님의 명령이라도…!"
20014-230-1 = "……아, 생일.\n기억해 주고 있었구나."
20014-240-1 = "고마워, 선생님."
20014-250-1 = "나도 수첩을 자주 확인하지\n않으면, 종종 잊어버리곤\n한단 말이지…"
20014-260-1 = "올해는 SRT 특수학원으로\n돌아갈 수 있었으면…"
20014-270-1 = "크리스마스… 이렇게 대부분의\n사람들이 방심하는 때일수록,\n더 철저히 경계를 해야지."
20014-280-1 = "선생님, 그 끔찍한 안면\n위장은 누구에게 받은 거야?"
20014-290-1 = "…할로윈 코스프레?\n그게 뭔데?"
20014-300-1 = "……아, 선생님이었나."
20014-310-1 = "웬 수상한 사람이 얼굴을\n내밀기에 하마터면 쏠 뻔했네."
20014-320-1 = "……늦었잖아.\n작전 중의 1분 1초는\n생명과도 직결된다는 사실을\n벌써 잊어버린 거야?"
20014-330-1 = "…장난을 칠 시간이 있으면\n업무에 집중해."
20014-340-1 = "옛말에도 있지만,\n총기는 좋은 친구와 같아서."
20014-350-1 = "제대로 관리하면,\n배신하는 법이 없다고 하지."
20014-360-1 = "기능 고장은 게으름뱅이에게나\n일어나는 일이라고."
20014-370-1 = "역시 교범은 종이로\n된 게 제일이야."
20014-380-1 = "배터리를 충전할 필요도 없고,\n해킹의 염려도 없으니까."
20014-390-1 = "선배들이라면 이런\n단순한 당번 업무는 벌써\n끝내고도 남았을 텐데…"
20014-400-1 = "가끔은 내 미숙함이\n너무나도 분해…"
20014-410-1 = "아, 아니야! 이건 작전상의\n문제로… 아주 잠깐\n벗고 있는 것 뿐이니까…!"
20014-420-1 = "생일 축하해, 선생님.\n뭔가 선물로 받고\n싶은 건 없어?"
20014-430-1 = "……아, 생일.\n기억해 주고 있었구나."
20014-440-1 = "고마워, 선생님."
20014-450-1 = "나도 수첩을 자주 확인하지\n않으면, 종종 잊어버리곤\n한단 말이지…"
20014-460-1 = "올해는 SRT 특수학원으로\n돌아갈 수 있었으면…"
20014-470-1 = "크리스마스… 이렇게 대부분의\n사람들이 방심하는 때일수록,\n더 철저히 경계를 해야지."
20014-480-1 = "선생님, 그 끔찍한 안면\n위장은 누구에게 받은 거야?"
20014-490-1 = "…할로윈 코스프레?\n그게 뭔데?"
20014-510-1 = "…으읏, 으으읏…"
20014-520-1 = "…쳇. 내부가\n뻑뻑해서 그런지,\n조금도 움직이질 않아."
20014-530-1 = "좀 더,\n미끄럽게 만들지 않으면…"
20014-540-1 = "선생님,\n그쪽에 있는 윤활유 좀\n여기로 가져다줄래?"
20014-550-1 = "오, 이제야 좀 괜찮네."
20014-560-1 = "하아아… 이렇게\n녹을 벗겨내고 있을 때가\n제일 기분 좋아…"
20014-570-1 = "…뭔가 손동작이 신경 쓰여서,\n똑바로 쳐다볼 수 없다고?"
20014-580-1 = "하, 하아아?! 이건 신성한\n포구 수입 작업이라고! 무슨\n헛소리야, 이 바보가!"
20014-2600-1 = "RABBIT 26식 기관총, 수령 완료.\n…음, 역시 이 무게가 느껴져야 안심이 돼."
