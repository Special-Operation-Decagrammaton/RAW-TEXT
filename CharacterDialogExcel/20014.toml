[translation]
20014-10-1 = "Blue Archive!"
20014-20-1 = "SRT Academy, RABBIT Squad's Sorai Saki. So, where's the Schale operation manual?"
20014-30-1 = "Everyone lacks discipline... It's a pity."
20014-40-1 = "There are stupidheads everywhere I go."
20014-50-1 = "Even if you're on a break, you should always be vigilant."
20014-60-1 = "(Where's the manual for using this thing?)"
20014-70-1 = "(What is that? It wasn't in the manual...)"
20014-80-1 = "Oh, it's you, Sensei."
20014-90-1 = "I thought it was an intruder. I almost shot you."
20014-100-1 = "...You're late. Don't you know that even a split second can determine life and death?"
20014-110-1 = "...If you have time to joke around, you should focus on our mission."
20014-120-1 = "Guns are like good friends."
20014-130-1 = "As long as you manage them well, they won't betray you."
20014-140-1 = "Malfunctions only happen to lazy people."
20014-150-1 = "Paper manuals are the best."
20014-160-1 = "No need to charge a battery, and there's no fear of hacking."
20014-170-1 = "...No means no. Why would I take my helmet off during a mission?"
20014-180-1 = "The upperclassmen would have already finished such a simple task by now."
20014-190-1 = "Sometimes, I get so frustrated with my immaturity..."
20014-200-1 = "Happy birthday, Sensei. Is there anything you want?"
20014-210-1 = "...My helmet?! The one on top of my head?"
20014-220-1 = "Th-That's... Even for your birthday..."
20014-230-1 = "...Oh, my birthday? You remembered."
20014-240-1 = "Thank you, Sensei."
20014-250-1 = "I refer to my notes a lot. Otherwise, I'd forget everything."
20014-260-1 = "I hope we can return to the SRT this year..."
