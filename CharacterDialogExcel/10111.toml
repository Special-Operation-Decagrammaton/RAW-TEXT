[translation]
10111-10-1 = "ブルーアーカイブ！"
10111-20-1 = "ミレニアムサイエンススクールの美甘ネル、\nただいま参上したぜ、っと……。\nあぁ？この服？なにかおかしいっていうのか？"
10111-30-1 = "（なんだあれ？\nカッケェ！）"
10111-40-1 = "まあ、悪くねぇな。\nちっと一休みするか。"
10111-50-1 = "なんか落ち着か\nねえんだよな……\n上着がないからか？"
10111-60-1 = "先生は\nいつ来るんだ……？"
10111-70-1 = "お、これいいな！\n部室に飾りたい\nくらいだ。"
10111-80-1 = "よ、先生！"
10111-90-1 = "あぁ？べ、別に待ってた\nわけじゃねぇぞ！？"
10111-100-1 = "何しょぼくれてんだよ。"
10111-110-1 = "あたしがそばに居るだろ！"
10111-120-1 = "なーんか、\nムズムズするんだよな……"
10111-130-1 = "普段と違うからだろうけどさ。"
10111-140-1 = "はぁ……上着が恋しいぜ。"
10111-150-1 = "あぁ？制服を着て\n大人しくなった？"
10111-160-1 = "んなわけあるか！\n今日はちょっと\n元気がないだけだ。"
10111-170-1 = "なっ……制服、\nよく似合ってるね……！？"
10111-180-1 = "ほ、褒めても何も出ねぇぞ！"
10111-190-1 = "先生、得意な教科はあるか？"
10111-200-1 = "いや……なんだ？\nせっかく制服着てることだし、\n勉強でもしようかと。"
10111-210-1 = "今一番落ち着ける場所……"
10111-220-1 = "ここじゃねぇか？"
10111-230-1 = "今日は先生の誕生日だろ？\n誕生日おめでとさん！"
10111-240-1 = "せっかくだし、\n遊びに行かねぇか？"
10111-250-1 = "ははっ！やっぱ覚えてて\nくれたのか！"
10111-260-1 = "ありがとな！"
10111-270-1 = "明けましておめでとう、先生。\n今年もよろしくな。"
10111-280-1 = "ん？なんで制服なのかって？"
10111-290-1 = "そりゃあ……\n先生が似合うって\n言ってくれたし……"
10111-300-1 = "今日くらいは\n着てもいいかなって。"
10111-310-1 = "クリスマスか……"
10111-320-1 = "あ、そうだ。\nプレゼントに\nあたしの上着はどうだ？"
10111-330-1 = "今着てないし、\n羽織ってみろよ！"
10111-340-1 = "他の連中は毎日制服きてるけど\nあたしにとっては\n仮装みたいなもんなんだよな。"
10111-360-1 = "お！見ろよ先生！\n色んなもんがあるぞ！"
10111-370-1 = "ん？どうかしたのか？"
10111-380-1 = "あ～、まぁ……\nそりゃあな。"
10111-390-1 = "今はC＆Cでもないし、\n先生とは先輩後輩の\n関係でもないだろ。"
10111-400-1 = "ここに知り合いなんて\nいねぇしさ。"
10111-410-1 = "今くらい、許してくれよ。"
10111-420-1 = "というか、やっぱ……"
10111-430-1 = "普段みたいな方がいいか？"
10111-440-1 = "ははっ！\nそう言うと思った！"
10111-450-1 = "まあ、そんなに時間に\n余裕があるわけじゃねえし……"
10111-460-1 = "そろそろ行こうぜ！\n次はあっちだ！"
10111-2600-1 = "考えてみたら全然普段と\n変わんねぇんだけど……\nなーんか、特別に感じるんだよな。\n……ま、あたしと先生の仲だし、\n気にしてもしょうがないか！"
