[translation]
20022-10-1 = "Blue Archive."
20022-20-1 = "Did you have any New Year's Eve noodles? I hope everything goes well for us this year!"
20022-30-1 = "Precise measurements are important when cooking."
20022-40-1 = "This kimono...is pretty."
20022-50-1 = "What was my first dream of the New Year?"
20022-60-1 = "I hope we have a peaceful year..."
20022-70-1 = "Maybe I can take a little break here..."
20022-80-1 = "Oh, Sensei! Welcome."
20022-90-1 = "Are you hungry? Can I make you something?"
20022-100-1 = "Please come in! I'll warm up some food."
20022-110-1 = "I made it with love."
20022-120-1 = "Wh-What do you think of my kimono?"
20022-130-1 = "I hope you like it..."
20022-140-1 = "I was nervous about wearing a kimono in front of you, but..."
20022-150-1 = "Now I'm glad I did."
20022-160-1 = "Did you know your hard work is very inspiring to the students?"
20022-170-1 = "To me as well, of course. Heeheehee."
20022-180-1 = "Osechi is a lot of work to make."
20022-190-1 = "But that's what makes it worth it in the end."
20022-200-1 = "I feel so relaxed with I'm with you."
20022-210-1 = "I should get going, but..."
20022-220-1 = "Huh? You want to stay with me a little longer?"
20022-230-1 = "Today's your birthday, Sensei! Happy birthday!"
20022-240-1 = "I'm glad I got to celebrate with you!"
20022-250-1 = "What dish would you like today?"
20022-260-1 = "Wow... My birthday... You remembered."
20022-270-1 = "Thank you...!"
20022-280-1 = "Just hearing that from you makes me so excited!"
20022-290-1 = "Happy New Year, Sensei."
20022-300-1 = "It's New Year's Day, so I put on my kimono."
20022-310-1 = "I made osechi. Will you join me?"
20022-320-1 = "It's Christmas... The year is almost over already."
20022-330-1 = "I was thinking of hosting a small party... What do you think?"
20022-340-1 = "The Halloween season is so fun and energetic."
20022-350-1 = "I wish we could eat the jack-o-lantern later..."
20022-370-1 = "I'm just...so happy."
20022-380-1 = "Thank you, once again, Sensei."
20022-390-1 = "You always give me so much, Sensei."
20022-400-1 = "You always enjoy my food..."
20022-410-1 = "And that's the biggest gift anyone could give me."
20022-420-1 = "Therefore, Sensei..."
20022-430-1 = "I'll look forward to the next time we talk."
20022-2600-1 = "It's so strange. When I'm with you, I feel like I can do anything. I'll try my best again this year. Please watch over me."
