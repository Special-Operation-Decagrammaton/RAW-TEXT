[translation]
13004-20-1 = "うんうん、やっと到着！\nよろしくお願いします、先生！"
13004-30-1 = "楽しい～☆"
13004-40-1 = "うん？あれは何でしょう？"
13004-50-1 = "キレイな物ですね。\nみんなにプレゼント\nしようかな…。"
13004-60-1 = "やっぱりアビドス\nアイドルプロジェクトは\n復活させましょう～☆"
13004-70-1 = "うちの子たちは\nみ～んな可愛いから。"
13004-80-1 = "うんうん～！ようこそ先生。\nいらっしゃるのを\n待ってました。"
13004-90-1 = "今日も良い一日を～\n先生！何でも\n私にお任せください。"
13004-100-1 = "今日もお疲れ様でした～☆"
13004-110-1 = "うん？\n膝枕ですか？"
13004-120-1 = "それはもうちょっと\n暗くなってから。"
13004-130-1 = "ダメです、甘えるのは\n仕事が終わってからですよ～"
13004-140-1 = "えぇとぉ…。\n先生、代わりにマッサージ\nしてあげましょうか？"
13004-150-1 = "先生がそばにいると、\nなんだか安心します。"
13004-160-1 = "お誕生日\nおめでとうございます！"
13004-170-1 = "先生がアビドスに\n来てなかったら…。"
13004-180-1 = "なんて想像もつきません！\n先生！来てくださって、\n本当にありがとうございます！"
13004-190-1 = "今日は私の誕生日なんです。\n先生、私へのプレゼントは\n用意してくれました？"
13004-200-1 = "えぇ、何でも大丈夫です。\n先生が選んだ物なら。"
13004-210-1 = "明けまして\nおめでとうございます。\n今年は…先生と…ふふっ☆"
13004-220-1 = "先生、新年のために\nショッピングにでも\n行きましょう？"
13004-230-1 = "私がサンタクロースに\nなってあげますから～☆"
13004-240-1 = "うわっ！\nびっくりした！"
13004-250-1 = "先生～あまり\n驚かさないでくださいよ～"
13004-270-1 = "さあ、耳掃除の時間ですよ。\n大人しくしてくださいね、\n先生？"
13004-280-1 = "もぞもぞしちゃダメです。\n今からこれが\n入るんですからね？"
13004-290-1 = "くすぐったかったら\n言ってくださいね？うんうん。\nいい子ね、よしよし。"
13004-300-1 = "えっと…考えてみるとこれ\nちょっと…恥ずかしいんですけど？\nなんか先生の顔が近過ぎて…えっと…。"
13004-310-1 = "これは先生だけへの\nサービスですから、\n二人だけのひ・み・つですよ？"
13004-320-1 = "うん？そうやって横になったら\n先生の背中しか見えないので…\nえっと…そうしちゃうと…鼻息が…。"
13004-330-1 = "ダメです、先生！\nちゃんと横に\nなっててください！"
13004-2600-1 = "うんうん。\n力というのはもろ刃の剣だと思いますけど、\n先生とみんなの為なら必要だと思います。\n大切に使うから、見守ってくださいね。先生。"
