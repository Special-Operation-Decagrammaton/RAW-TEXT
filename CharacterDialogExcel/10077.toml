[translation]
10077-10-1 = "Blue Archive."
10077-20-1 = "Oh, have you come to pick me up? I would have gone myself if you'd asked. Once again, I am Ichika of the Trinity General School Justice Task Force. Please look after me!"
10077-30-1 = "Ah, so this is it? Sensei's Cafe!"
10077-40-1 = "I see. So this is how you like it..."
10077-50-1 = "I like how peaceful it is here!"
10077-60-1 = "I'm relaxing..."
10077-70-1 = "Should I at least help clean...?"
10077-80-1 = "Welcome, Sensei! I'll do my best today too!"
10077-90-1 = "Ta-da! Ichika is here!"
10077-100-1 = "Or rather, it's Sensei that's here!"
10077-110-1 = "My, working here is quite comfortable!"
10077-120-1 = "Ah. I'm not saying that it's easy, of course. It's just very pleasant."
10077-130-1 = "My most difficult work... I'd say it's breaking up fights."
10077-140-1 = "Oh, you too, Sensei? We're the same."
10077-150-1 = "I wish that everyone would simply relax and not get so worked up..."
10077-160-1 = "If I'm given a great responsibility, like Sensei has been... Will I be able to immerse myself in it completely?"
10077-170-1 = "Do you have a task for me? I'll do whatever you need!"
10077-180-1 = "I'm confident that I can complete any job you give me!"
10077-190-1 = "Happy birthday, Sensei!"
10077-200-1 = "Has anything good happened to you today? If not, let's make sure something good happens right now!"
10077-210-1 = "Hm... You want to know why I came all the way here on my birthday?"
10077-220-1 = "Right... Maybe I came...BECAUSE it's my birthday. Heehee!"
10077-230-1 = "Happy New Year, Sensei!"
10077-240-1 = "I pray that this year, I might enjoy some leisure!"
10077-250-1 = "I'm sorry it's been so hectic since this morning!"
10077-260-1 = "The Justice Task Force has been called on to take care of all kinds of things."
10077-270-1 = "My head is spinning!"
10077-280-1 = "Somehow, I've got a bad feeling..."
10077-290-1 = "Well, I'm sure it'll turn out all right, no? Haha!"
10077-310-1 = "Haha! Sensei! Over here! Here! Can you see me?"
10077-320-1 = "Ah! This is just a balloon..."
10077-330-1 = "But, when I'm holding it... I look like a kid having fun at an amusement parks... Haha."
10077-340-1 = "Oh! This isn't mine though! It's just... One thing led to another, and..."
10077-350-1 = "Well, uh... Yes, that's it... How did you know?"
10077-360-1 = "Huh...? Am I really that easy to read?"
10077-370-1 = "Ah. Well, whatever... You know, I've never seen you from this angle before."
10077-380-1 = "It's a whole new perspective. Everything looks...different."
10077-390-1 = "It's kinda fun."
10077-400-1 = "I think I like it! Haha!"
10077-2600-1 = "What should I say...? I'm thankful that you're treating me so kindly, but I don't know if I deserve it... Still... I'm happy. Really."
