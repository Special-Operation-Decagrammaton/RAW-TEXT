9009000-460-1 = "คุณครู [USERNAME] คะ!\nตอนนี้มีคลาสและกิจกรรมต่างๆ เตรียมไว้แล้ว\nกรุณาเลือกคลาสที่ต้องการเข้าได้เลยค่ะ!"
