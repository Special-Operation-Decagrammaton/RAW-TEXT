9009000-1420-1 = "先生！もう5.5周年です！\n5.5周年を記念して\n特別なプレゼントを\n用意しました！こちらをどうぞ！"
9009000-1430-1 = "アロナはこれからも\n先生のおそばにいますからね！\nいつまでもずっと！"
