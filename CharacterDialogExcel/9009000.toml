9009000-1250-1 = "1、2、3、4！\nもう4周年ですよ、先生！"
9009000-1260-1 = "4thアニバーサリーのお祝いに、\n特別なプレゼントを用意しました！\nこちらを受け取って下さい！\nこれからも一緒にいましょうね、先生！"
9009000-1270-1 = "4.5周年になりました！\nこれからも生徒さんと\n共に歩んでいきましょう！"
9009000-1280-1 = "特別な日のプレゼントを\n用意しました！\nどうぞ受け取ってください！"
9009000-1290-1 = "5thアニバーサリーです！\n先生、いつも\nありがとうございます！"
9009000-1300-1 = "これからもずっと一緒ですよ！"
9009000-1310-1 = "おかえりなさい、先生！\n出張お疲れ様でした！"
9009000-1320-1 = "久々のシャーレでの業務ですね。\nアロナがサポートします！"
