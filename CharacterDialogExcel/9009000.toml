[translation]
9009000-10-1 = "[USERNAME]先生！\nお待ちしておりました！"
9009000-20-1 = "さあ、\nお仕事を始める時間です！"
9009000-30-1 = "どのお仕事から始めますか、\n先生？"
9009000-40-1 = "私が先生のお仕事を\n手伝います！"
9009000-50-1 = "ここで先生の、様々なお仕事を\n始めることができます！"
9009000-60-1 = "[USERNAME] 先生！\nご希望のお仕事を選んでください。\n私が隣で手伝います！"
9009000-70-1 = "解決していただかねば\nならないお仕事がたくさんです。\n大人って大変ですね。"
9009000-80-1 = "解決するべきことがいっぱいですね！\n頑張りましょう！"
9009000-90-1 = "たまには身体のことも考えないと、\n先生の健康が心配です！"
9009000-100-1 = "うわぁ…。\nものすごい量の仕事ですね。"
9009000-110-1 = "さあ、頑張りましょう！\n先生！"
9009000-120-1 = "ルンルン～♬"
9009000-130-1 = "ランララン、ララ～ン♪"
9009000-140-1 = "ふんふんふん～♩"
9009000-150-1 = "今日はまたっ、どんなことがっ♬\n待ってるのかな～♪"
9009000-160-1 = "あっ？"
9009000-170-1 = "あれ？"
9009000-180-1 = "あっ！"
9009000-190-1 = "むにゃ、\nイチゴミルクは…うひひ。"
9009000-200-1 = "そんなに\n食べられません……。"
9009000-210-1 = "先生ったら…。"
9009000-220-1 = "…うひひひひ。"
9009000-230-1 = "むにゃ。"
9009000-240-1 = "居眠りしているわけでは\nないですよぉ…むにゃ。"
9009000-250-1 = "うひっ、にゃあ…。"
9009000-260-1 = "先生、\nちゃんとしてください…。"
9009000-270-1 = "んっ、うひゃっ？"
9009000-280-1 = "あひゃっ！？"
9009000-290-1 = "…んぃ？"
9009000-300-1 = "うん、よし！\n今日も良い天気ですね。"
9009000-310-1 = "うーん…雨、降るのかな。"
9009000-320-1 = "遥か空の向こうには、\n何があるんだろう…。"
9009000-330-1 = "……。"
9009000-340-1 = "…うーん。"
9009000-350-1 = "あっ！"
9009000-360-1 = "あれ。"
9009000-370-1 = "[USERNAME]先生、おかえりなさい。\nお待ちしておりました！"
9009000-380-1 = "[USERNAME]先生、\n今日もよろしくお願いしますね！"
9009000-390-1 = "[USERNAME]先生！\nおかえりなさい！"
9009000-400-1 = "[USERNAME]先生、\n今日もお疲れさまです♪"
9009000-410-1 = "あ、こういうのも用意してありますよ。"
9009000-420-1 = "あ、今はこんなのもありますよ！"
9009000-430-1 = "補習授業部の発足に伴って\n特別ボーナスを実施中です！"
9009000-440-1 = "補習授業部の発足に際して、こちらをプレゼントします！"
9009000-450-1 = "ここでは先生がスケジュールを\n決められます！"
9009000-460-1 = "[USERNAME]先生！\n様々な授業やイベントが準備されているので、\nご希望のスケジュールを選んでください！"
9009000-470-1 = "今日は何の授業を始めますか？"
9009000-480-1 = "[USERNAME]先生、\nスケジュールを選んでください！"
9009000-490-1 = "通常授業！課外授業！自由時間！\nどれを選びますか？"
9009000-500-1 = "[USERNAME]先生！\n頑張ってください！"
9009000-510-1 = "先生のお仕事はこんなにハードな\nものなんですね…。"
9009000-590-1 = "本格的な夏がやってきました！\n夏季合宿トレーニングで\nお疲れの先生への、特別ボーナスです！"
9009000-600-1 = "風紀委員会の夏季合宿\nトレーニングへの差し入れとして\n特別ボーナスを支給中です！"
9009000-610-1 = "ハッピー・ハロウィーン！\nお、お菓子は無いのですが……\n先生のために、特別なプレゼントをご用意しましたよ！"
9009000-620-1 = "トリック・オア・トリート！\nいたずらしちゃいますよ〜！\nあ、その前にこちら、先生へのプレゼントです！"
9009000-630-1 = "メリークリスマス！\nプレゼントもちゃーんと\n用意しましたよ！"
9009000-640-1 = "クリスマスですね、先生！\nこれはアロナからの特別な\nプレゼントです！"
9009000-650-1 = "1周年を記念して\nプレゼントを用意しちゃいました！"
9009000-660-1 = "先生、もう1周年ですよ！\nこちらはその記念のプレゼントです！"
9009000-670-1 = "あ、それからこちら！\n先生をサポートするために\nこんな支給品も用意してみました！"
9009000-680-1 = "あ、実はもう一つあるんです！\nはい、こちら先生のために用意した\n支給品ですよ！"
9009000-690-1 = "学園交流会では、様々な\n成長材料などを貰うことができます。"
