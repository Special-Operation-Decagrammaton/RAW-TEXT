9009000-1150-1 = "素敵なピクニックになるよう\n先生のために準備しました!"
9009000-1160-1 = "春を迎えてピクニック用にアロナが\n用意した特別プレゼントです！"
9009000-1170-1 = "2.5周年おめでとうございます！！\nプレゼントを用意しました！"
