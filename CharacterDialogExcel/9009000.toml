9009000-1090-1 = "…히익?"
9009000-1150-1 = "멋진 봄나들이가 될 수 있도록\n선생님을 위해 준비했어요!"
9009000-1160-1 = "봄나들이를 맞이해 특별히\n아로나가 준비한 선물이에요!"
9009000-1170-1 = "2.5 주년이네요!\n여기, 선생님을 위한 선물이에요!"
9009000-1180-1 = "2.5주년을 맞이해,\n아로나가 특별한 선물을 준비했습니다!"
9009000-1190-1 = "특별한 날을 기념하여\n아로나가 깜짝 선물을 준비했어요!"
9009000-1200-1 = "마음에 드셨으면 좋겠네요!"
9009000-1210-1 = "3rd 애니버서리를 기념하여\n특별한 선물을 준비했어요!"
9009000-1220-1 = "이쪽이에요!\n앞으로도 쭉 함께해요, 선생님!"
9009000-1230-1 = "3.5주년이에요!\n특별한 날을 위해\n특별한 선물을 준비했어요!"
9009000-1240-1 = "여기 있습니다, 선생님,\n앞으로도 쭉 함께 해주세요!"
9009000-1250-1 = "1, 2, 3, 4!\n벌써 케이크에 초가 네 개나!"
9009000-1260-1 = "4th 애니버서리를 기념하여\n특별한 선물도 준비했어요!\n여기 받아주세요!\n앞으로도 잘 부탁드립니다! 선생님!"
9009000-1270-1 = "4.5주년이에요! 앞으로도\n빛나는 순간들을 함께 만들어가요!"
9009000-1280-1 = "특별한 날, 특별한 선물!\n받아주세요, 선생님!"
9009000-1290-1 = "5주년이에요!\n지금까지의 추억보다 더 많은\n추억을 쌓을 때까지!"
9009000-1300-1 = "앞으로도 모두 함께예요!"
9009000-1310-1 = "어서 오세요, 선생님!\n출장 수고하셨습니다!"
9009000-1320-1 = "오랜만에\n샬레에서의 업무네요.\n아로나가 서포트 할게요!"
9009000-1330-1 = "선생님! 이벤트 개최 중이에요!\n가보죠!"
9009000-1340-1 = "어떤 이벤트이려나요~?"
9009000-1350-1 = "두근두근하네요……!"
9009000-1360-1 = "어떤 일이든 괜찮아요!\n전력으로 돕겠습니다!"
9009000-1370-1 = "이벤트가 끝나면……\n딸기 우유가 마시고 싶어요!"
9009000-1380-1 = "무럭무럭 자라라~"
9009000-1390-1 = "촉촉해져라~"
9009000-1400-1 = "어떤 꽃이 피어날까요?"
9009000-1410-1 = "앗!"
9009000-1420-1 = "5.5주년이에요! \n언제나 감사합니다, 선생님."
9009000-1430-1 = "아로나는 언제든, 어디까지든\n선생님과 함께하고 싶어요!"
