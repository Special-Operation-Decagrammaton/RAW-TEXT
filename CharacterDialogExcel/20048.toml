20048-690-1 = "はい？\nトリックオアトリート……？"
20048-700-1 = "ふふっ、ではトリートを。\n紅茶の茶葉を使った\nお菓子です。どうぞ。"
20048-710-1 = "準備しておいて正解でしたね。\n先生のその表情を\n見られただけで満足です。"
20048-730-1 = "……こんなところで\nどうなさったんですか？"
20048-740-1 = "そんなに\nぐったりとされて……。"
20048-750-1 = "……？もう少し具体的に\n伺っても？"
20048-760-1 = "海は、一歩間違えば危険な\n事故につながりかねない\n場所ですから。"
20048-770-1 = "要領を得ませんね……。"
20048-780-1 = "状況に応じて、求められる\n対応は異なりますので――"
20048-790-1 = "なるほど、\nそういうことでしたか。"
20048-800-1 = "危険な状態ではなかったようで、\n一安心です。"
20048-810-1 = "バランス感覚を掴むまでが、\nサーフィンの最初の\n山場とも申します。"
20048-820-1 = "最初のうちは、\n誰もが経験することですよ。"
20048-830-1 = "とはいえ……\n休憩されるにしても、"
20048-840-1 = "それではお身体が\n冷えてしまいますね。"
20048-850-1 = "こちらへどうぞ。"
20048-860-1 = "温かい飲み物も\nご用意しておりますので。"
20048-2600-1 = "小型の銃ではありますが……\nこれが担う責任は、決して軽くありません。\nその重さに押しつぶされてしまわぬように。\n私を、どうか見守っていてください。"
