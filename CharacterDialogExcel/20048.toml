20048-700-1 = "ฮุฮุ งั้นเอาทรีต\nนี่คือขนมที่ทำจาก\nใบชาแดงค่ะ ลองทานดูสิคะ"
20048-710-1 = "ดีนะคะที่ฉันพกติดตัวมาด้วย\nพอได้เห็นสีหน้านั้นของคุณครู\nฉันก็พอใจแล้วค่ะ"
20048-730-1 = "มาทำอะไรอยู่ในที่แบบนี้คะ?"
20048-740-1 = "อ่อนระโหยโรยแรงอยู่บนกระดานเลย..."
20048-750-1 = "...? ขอถามเจาะจง\nมากกว่านี้หน่อยได้มั้ยคะ?"
20048-760-1 = "ก็ทะเลเป็นที่ที่ทำอะไรผิดพลาด\nนิดหน่อย ก็นำไปสู่อุบัติเหตุ\nอันตรายๆ ได้เลยนี่คะ"
20048-770-1 = "เข้าใจได้ยากจังเลยนะคะ... "
20048-780-1 = "เราต้องรับมือต่างกันตามสถานการณ์\nเพราะงั้นช่วยอธิบายอีกหน่อย... "
20048-790-1 = "อ้อ เป็นอย่างนี้เองสินะคะ "
20048-800-1 = "ฟังดูไม่ใช่สถานการณ์อันตราย\nถ้างั้นฉันก็วางใจค่ะ"
20048-810-1 = "จนกว่าจะเรียนรู้การทรงตัวได้\nก็ยังเรียกว่าอยู่ในความยากลำบากแรก\nของการเล่นเซิร์ฟอยู่ค่ะ "
20048-820-1 = "ในครั้งแรก ไม่ว่าใครก็\nต้องเจอแบบนี้ทั้งนั้นค่ะ"
20048-830-1 = "แต่ว่า... ต่อให้หยุดพักบ้าง"
20048-840-1 = "แต่ถ้าอยู่แบบนั้น\nตัวจะยิ่งเย็นลงนะคะ"
20048-850-1 = "มาทางนี้สิคะ"
20048-860-1 = "ฉันเตรียมเครื่องดื่ม\nอุ่นๆ มาด้วยค่ะ"
20048-2600-1 = "ถึงจะเป็นปืนขนาดเล็กและเบา\nแต่น้ำหนักความรับผิดชอบที่เป็นสัญลักษณ์\nของปืนนี้ไม่เคยเบาเลย เรื่องนั้นฉัน\nเข้าใจได้อย่างถ่องแท้ค่ะ\nเพราะงั้นก็เฝ้าดูฉันด้วยนะคะ คุณครู"
