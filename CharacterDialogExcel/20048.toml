20048-650-1 = "一緒に暖炉を囲って\nお茶菓子を楽しむ、\nというのはいかがでしょうか。"
20048-660-1 = "はしゃいで騒ぐばかりが、\nお祭りの過ごし方という\nわけでもないですから。"
20048-670-1 = "いくらハロウィーンといえど、\nこの格好で街を出歩く\nことはためらわれますね。"
