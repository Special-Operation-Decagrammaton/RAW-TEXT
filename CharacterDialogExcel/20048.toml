20048-660-1 = "떠들썩하게 노는 것만이\n축제를 보내는 방법은 아니니까요."
20048-670-1 = "아무리 할로윈이라고 해도,\n이 차림으로 거리를\n돌아다니는 것은 망설여지네요."
