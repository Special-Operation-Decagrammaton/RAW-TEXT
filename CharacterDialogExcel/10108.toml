[translation]
10108-10-1 = "Blue Archive"
10108-20-1 = "Calling me so late in the night... O-Of course, regardless of what I'm wearing, I'm always ready to go. Just know that I'll collect my dues later."
10108-30-1 = "I think I'm a little sleepy."
10108-40-1 = "Is there anywhere I can rest...?"
10108-50-1 = "Somewhere neither too warm nor too cool..."
10108-60-1 = "(Maybe lying next to Sensei, or something like that...)"
10108-70-1 = "What kind of tea helps promote a good night's sleep?"
10108-80-1 = "...Ah. You're here, Sensei."
10108-90-1 = "Was I waiting for long? N-No, not really."
10108-100-1 = "Hello, Sensei."
10108-110-1 = "I look really comfy today?"
10108-120-1 = "Well, you called me so suddenly, I had no choice...!"
10108-130-1 = "...I did want to pick out a prettier outfit."
10108-140-1 = "By the way, what kind of pajamas do you wear to sleep, Sensei?"
10108-150-1 = "Ah, no! I'm not thinking of anything else!"
10108-160-1 = "I was just curious..."
10108-170-1 = "A proper schedule, nutritional intake, sleep. They're all important."
10108-180-1 = "I can be by your side and take care of you, you know?"
10108-190-1 = "I-If that's okay with you, Sensei..."
10108-200-1 = "Lack of sleep disrupts logic and causes you to make frequent errors."
10108-210-1 = "No person is a perfect computer after all."
10108-220-1 = "Are you resting well when you take breaks?"
10108-230-1 = "Looking at your face and skin, it seems like you may not be getting enough rest..."
10108-240-1 = "Sometimes, I think it would be nice to greet the morning next to someone I want to wake up with."
10108-250-1 = "I-I don't mean anything by that!"
10108-260-1 = "Happy birthday, Sensei."
10108-270-1 = "As a gift...I'll lend you my pillow for a day!"
10108-280-1 = "..."
10108-290-1 = "I'm just kidding. Please don't take that seriously!"
10108-300-1 = "You remembered my birthday. Thank you, Sensei."
10108-310-1 = "For a gift... I'd be happy with anything from you."
10108-320-1 = "What? ...I can have whatever I want of yours, so I should choose?"
10108-330-1 = "Then, perhaps..."
10108-340-1 = "Are you sure about this, Sensei...?"
10108-350-1 = "It's the new year, Sensei. I can't believe I'm spending the first day of the year with you..."
10108-360-1 = "Back in the day, I really wouldn't have imagined this happening."
10108-370-1 = "Until now, I've only ever thought of Christmas as another busy day."
10108-380-1 = "...You're asking how this year is so far?"
10108-390-1 = "Heehee... Can you take a guess?"
10108-400-1 = "It's Halloween... Someone told me I could just go out wearing this outfit..."
10108-410-1 = "Should I be happy about that...?"
10108-430-1 = "S-Sensei? What are you doing here, at this time?"
10108-440-1 = "S-So... Well... Um..."
10108-450-1 = "I couldn't fall asleep, so I took a walk..."
10108-460-1 = "...and the angel chicken shown in the convenience store flyer caught my eye..."
10108-470-1 = "I couldn't help it!"
10108-480-1 = "The angel chicken is freshly fried around this time."
10108-490-1 = "It's so warm and juicy! It's more of a loss to NOT buy it!"
10108-500-1 = "And...it's not like I come here..."
10108-510-1 = "...for a late night snack every day... "
10108-520-1 = "I-If you want..."
10108-530-1 = "Do you want to try a bite, Sensei?"
10108-2600-1 = "Thank you, Sensei. With this weapon, maybe I can reasonably get rid of anything that disturbs my sleep?"
