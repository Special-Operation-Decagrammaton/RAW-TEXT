[translation]
13000-10-1 = "ブルーアーカイブ。"
13000-20-1 = "最高のご奉仕をお約束し、\nご主人様へのご挨拶と\n致します。"
13000-30-1 = "この場所はきれいに\n掃除されてますね。\n有能なメイドが待機\nしているに違いないです。"
13000-40-1 = "ダイエットですか…。\n一時、そういうことで\n悩んでいた時期も\nありましたね。ふふっ。"
13000-50-1 = "ようこそいらっしゃいました。\n温かい紅茶を一杯、\nご用意いたしましょうか？"
13000-60-1 = "ご主人様、先生、もしくは…ダーリン？\nふふっ。\nどのようにお呼びするのが\nお好きでしょうか。"
13000-70-1 = "あら。これは…私がやる\nべきことでしたのに…。\nさらにやる気になってしまいましたよ。\nご・主・人・様。"
13000-80-1 = "おかえりなさいませ、ご主人様。\n今日もお疲れ様でした。"
13000-90-1 = "お茶でもいかがでしょうか？\nちょうど最高級の茶葉が\n入りましたよ。"
13000-100-1 = "はい。書類は私が\n片づけておきました。\nお任せください。"
13000-110-1 = "何かお望みでしょうか。\n最高のご奉仕で、\nお応えします。"
13000-120-1 = "手紙が届きました。"
13000-130-1 = "あら、可愛い字ですね。"
13000-140-1 = "お・読・み・い・た・し・\nま・しょ・う・か？"
13000-150-1 = "優雅な願いでは\nないかもしれません。\nでも、ご主人様。"
13000-160-1 = "これからもアカネを\nお呼びください。"
13000-170-1 = "お誕生日おめでとう\nございます。ご主人様。"
13000-180-1 = "ご主人様がここに\n来てくださって…"
13000-190-1 = "…嬉しいです。"
13000-200-1 = "生誕は、祝福です。"
13000-210-1 = "ご主人様に出会った\nその瞬間から、\n私はその事にいつも\n感謝していました。"
13000-220-1 = "明けましておめでとう\nございま～～っす。"
13000-230-1 = "今年一年も、よろしく\nお願いします。ご主人様！"
13000-240-1 = "メリークリスマス～。"
13000-250-1 = "私からの\nプレゼントは、\n最高のご奉仕と\n笑顔です。"
13000-260-1 = "先生からの\nプレゼントは何ですか？"
13000-270-1 = "さあ。飴をくれないと、\nいたずらしますよ～？"
13000-280-1 = "私は、いたずらの方が\n好きですけどね。"
13000-300-1 = "あら。おかえりなさいませ。"
13000-310-1 = "今日一日、いかがでしたか？"
13000-320-1 = "あ、ご主人様。ちょうど\n最高級の茶葉が入りましたよ。"
13000-330-1 = "私の方で一杯、\nご用意いたしましょうか？"
13000-340-1 = "はい？ここは、私たちの\nお家ではないですって？"
13000-350-1 = "ふふっ。\n気にしません。"
13000-360-1 = "私たちのお家ではなくても、\n私たちは今一緒に\nいるのですから。"
13000-2600-1 = "期待されるとは、\nこんなにもときめくことだったのですね。\nアカネは、ご主人様に\n最高のご奉仕で応えます。"
