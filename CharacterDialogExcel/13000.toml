[translation]
13000-10-1 = "Blue Archive."
13000-20-1 = "My fondest greetings to you, Master. I pledge to give you only the best service."
13000-30-1 = "This room has been kept in perfect order. A very competent maid must work here."
13000-40-1 = "Dieting... I do recall a time when I was concerned with such things. Haha."
13000-50-1 = "Welcome. Could I interest you in a cup of black tea?"
13000-60-1 = "Master, Sensei, or...Darling? Haha. I wonder how you would prefer to be addressed."
13000-70-1 = "My. I should be the one...doing this for you. Instead, you're the one who cheered me up, Master."
13000-80-1 = "Welcome, Master. You did well today."
13000-90-1 = "Would you be interested in a cup of tea? I happen to have a few leaves of the highest quality on hand."
13000-100-1 = "Yes. I've already sorted the documents. You can entrust this to me."
13000-110-1 = "You can tell me any wish you may have. I will serve you to the best of my ability."
13000-120-1 = "There's a letter for you."
13000-130-1 = "Oh, my. What lovely handwriting."
13000-140-1 = "Should. I. Read. It. For. You?"
13000-150-1 = "This may be an inelegant request. But, Master..."
13000-160-1 = "...please call me Akane from now on."
13000-170-1 = "Happy birthday, Master."
13000-180-1 = "I'm glad..."
13000-190-1 = "...that you came into this world, Master."
13000-200-1 = "It is a blessing to have been given life."
13000-210-1 = "I have been grateful for that since the moment I met you, Master."
13000-220-1 = "Happy New Year to you."
13000-230-1 = "I hope you'll need me again this year, Master!"
13000-240-1 = "Merry Christmas!"
13000-250-1 = "I come bearing the gifts of top-class service and a professional smile."
13000-260-1 = "What gifts have you brought me, Sensei?"
13000-270-1 = "I think the rule is that if I don't get a treat, then I get to trick you!"
13000-280-1 = "...Which sounds preferable to me."
13000-300-1 = "Oh, you're home."
13000-310-1 = "How was your day?"
13000-320-1 = "Oh, Master. We just received some of the highest quality tea leaves."
13000-330-1 = "Shall I pour you a cup?"
13000-340-1 = "What's that? This isn't our home?"
13000-350-1 = "Haha. Don't be silly."
13000-360-1 = "Where our home is doesn't matter...so long as we're together now."
13000-2600-1 = "To be someone others look forward to seeing is so exciting. I, Akane, will pay this back with my best service, Master."
