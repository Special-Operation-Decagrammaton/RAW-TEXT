[translation]
20035-10-1 = "ブルーアーカイブ～ふぁ～……"
20035-20-1 = "今回はガイドだよ……\n修行も案内も、頑張るね～\nふぁー……"
20035-30-1 = "みんな……\nこっちだよ……\nあれ…… 私一人？"
20035-40-1 = "人を案内する夢……\n夢じゃなかったの\nかな……？"
20035-50-1 = "人は……人生の3分の1を\n寝て過ごすんだって……"
20035-60-1 = "よく寝るのは\n大事だよ……\n思ってる以上にね……"
20035-70-1 = "百鬼夜行の\nことなら……\n任せて……"
20035-80-1 = "こんにちは、先生……\nおかえりなさい……"
20035-90-1 = "ところで今何時……？"
20035-100-1 = "おやすみなさい……"
20035-110-1 = "挨拶もしたし、\n先生も一緒に寝よう。うん……？"
20035-120-1 = "ふあ……\nいや。 寝てないよ……"
20035-130-1 = "シャーレが寝やすいとこなのか、\n試してみただけだよ……"
20035-140-1 = "熟睡枕と布団、\nアイマスクと耳栓……\n全部用意されてるよ。"
20035-150-1 = "あとは先生が来るだけ……"
20035-160-1 = "ふふっ。いつか二人だけで、\nどこか旅立つのもいいかもね。"
20035-170-1 = "夢の国とか……"
20035-180-1 = "ガイドに必要なのは…… \n説明する力だと思う……"
20035-190-1 = "自分が知っていることを、\n上手く教えてあげないと\nいけないから……"
20035-200-1 = "私だっていつも寝る\nことばっか考えてる\nわけじゃないんだよ……？"
20035-210-1 = "うーん…… \n先生と会う時とか……"
20035-220-1 = "誕生日だね、先生……"
20035-230-1 = "ふふっ。\nおめでとう、おめでとう。"
20035-240-1 = "プレゼントとして今日は、\n眠るまで私が一緒に\nいてあげる……"
20035-250-1 = "そうだ……\n今日私の誕生日だったね……"
20035-260-1 = "誕生日プレゼントはやっぱり……\n先生の膝枕がいいな……\nぐぅ……"
20035-270-1 = "新年になったね。\n一年の始まり……\nある意味一年の\n一番最初の朝……"
20035-280-1 = "朝は弱いけど、新年は好き……"
20035-290-1 = "メリ～クリスマス～"
20035-300-1 = "百鬼夜行の外では、\nこう挨拶するんだって？"
20035-310-1 = "ハロウィーン……"
20035-320-1 = "夢の中のような風景が\n見られる日だね……"
20035-330-1 = "ふふ。こういう日は何を、\nどうガイドしたらいいのかな？"
20035-350-1 = "ふぅ……ちょっと足が痛いかも。"
20035-360-1 = "この靴はまだ\n慣れていなくて。 うん。"
20035-370-1 = "どうしたの、先生？\nこっちをじっと見て……"
20035-380-1 = "え？私が何か……\nいつもと違う感じに見える……？"
20035-390-1 = "……変なの。"
20035-400-1 = "ふふっ。\nでも先生がそういう風に私を\n見てくれるんだったら…… \nそれも悪くないかも？"
20035-410-1 = "ねえ、先生。"
20035-420-1 = "今日は私たち二人とも…… \nいい夢が見られたら、いいね。"
20035-2600-1 = "ありがとう、先生……\n先生の睡眠を遮る敵は……\n私が倒してあげる……"
