[translation]
20045-10-1 = "ブルーアーカイブ～！"
20045-20-1 = "百鬼夜行連合学院、\nお祭り運営委員会の朝比奈フィーナ！\n皆さんをご案内しマス！"
20045-30-1 = "Wow〜、任侠映画の\nセットみたいで\nカッコイイデス！"
20045-40-1 = "（このテレビ……\n映画が観られマス！）"
20045-50-1 = "なんだかどこかで\n見たことある\n気がしマス！"
20045-60-1 = "素敵な方が多いデス……\nフィーナも負けて\nいられマセン！"
20045-70-1 = "なんだか眠く\nなってきマシタ……。"
20045-80-1 = "全員集まりマシタぜ、お頭！\n……いえ、センセイ！"
20045-90-1 = "センセイ！今日はフィーナが\n当番のガイドを務めマス！"
20045-100-1 = "制服を身に纏い、\n先頭に立って道を示す……。"
20045-110-1 = "なんだか任侠みたいデスね！"
20045-120-1 = "百鬼夜行は私の\n庭のようなものです！"
20045-130-1 = "案内なら\n任せてクダサイ！"
20045-140-1 = "ワタシたちのやり方で\nお出迎えしマス！"
20045-150-1 = "覚悟してクダサイ！"
20045-160-1 = "センセイと一緒なら\n無敵デス！"
20045-170-1 = "センセイ、\n今日はBirthdayデスね？"
20045-180-1 = "宴の準備は\nバッチリデス！"
20045-190-1 = "今日はフィーナの\nBirthdayデス！"
20045-200-1 = "Happy birthday\nto me～！"
20045-210-1 = "Happy New Year！"
20045-220-1 = "新年おめでとう\nございマス、お頭！"
20045-230-1 = "……いや、センセイ！"
20045-240-1 = "ホッホッホー、\nメリークリスマス！\nデス、センセイ！"
20045-250-1 = "Trick or Treat!\nHalloween、デス！"
20045-270-1 = "うーん、ハッ！"
20045-280-1 = "……なんだか、緊張していた\nみたいデス。"
20045-290-1 = "お客さんと一緒の間は\n夢中だったから、\n気づかなったのデスが……"
20045-300-1 = "こうして先生と一緒にいると、\nなんだか心が落ち着きマス。"
20045-310-1 = "軽やかに動くためには\nストレッチは必須デス！\nもう一度！"
20045-320-1 = "ん、んん、うーん！"
20045-330-1 = "え？肩の力を抜いた方が\nイイ……デスか？"
20045-340-1 = "そ、その……これは\nガイドとして気合いを\n入れているといいマスか……。"
20045-350-1 = "二人っきりだと……\nその……。"
20045-360-1 = "つい、リラックスして\nしまうから……。"
20045-2600-1 = "1段階、イヤ、\n500段階は成長できた気がしマス！"
