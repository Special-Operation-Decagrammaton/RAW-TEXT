[translation]
10060-10-1 = "Bluuue! Archiiive! ♪"
10060-20-1 = "Yay! What do you want me to work on? Where should I dig? I can excavate whatever you want!"
10060-30-1 = "Wow! So this is your...?"
10060-40-1 = "Not...these hot springs, right?"
10060-50-1 = "Well, since this place is yours, I'll make it an exception."
10060-60-1 = "Huh? Is that...? *gasp*"
