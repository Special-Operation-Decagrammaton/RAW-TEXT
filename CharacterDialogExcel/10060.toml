10060-320-1 = "Were you busy? Sorry! It's kinda urgent!"
10060-330-1 = "Oh, yeah! Yeah, I made it, but... The thing is that this hot spring won't last for very long."
10060-340-1 = "There's only a few hours left! That's why I really wanted you to come out here before it dries up!"
10060-350-1 = "...Huh? Yeah... I made it on my own. Why?"
