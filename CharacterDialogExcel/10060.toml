10060-80-1 = "Hi Sensei! Welcome! What should we do today? Do you want to build a hot spring?"
10060-90-1 = "I've been waiting for this moment! Say the word and I'll get started!"
10060-100-1 = "Hmm... What should I do here?"
10060-110-1 = "Do you need to be warmed up? Or..."
10060-120-1 = "What do I do in my free time? Uh... I dunno..."
10060-130-1 = "Oh! You were looking for work!"
10060-140-1 = "I hate when things get complicated. You can't just ignore the problem, either..."
10060-150-1 = "That's why I like to get rid of things and start all over!"
10060-160-1 = "Are you hungry? Do you want me to make you some ramen?"
10060-170-1 = "Huh? Tools?"
10060-180-1 = "I'll use this! ♪"
10060-190-1 = "Adjusting the output? Hm... I dunno..."
10060-200-1 = "It'll work. Probably...I think! I've never tried!"
10060-210-1 = "Happy birthday, Sensei! It's so hot out today!"
10060-220-1 = "Oh yeah! Today's my birthday! Hm... What do I want as a present...?"
10060-230-1 = "How about an excavator?"
10060-240-1 = "Happy New Year!"
10060-250-1 = "My wish for the year...is more hot springs to build and more land to dig!"
10060-260-1 = "Isn't today the day nice kids get gifts?"
10060-270-1 = "Oh! That's so exciting! I wonder what I'll get."
10060-280-1 = "There's a bunch of people outside...and they look like weirdos."
10060-290-1 = "Maybe it'll make it easy to escape from the Prefect Team today!"
