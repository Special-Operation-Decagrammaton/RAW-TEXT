10060-370-1 = "And, um... I want to help you out especially! Heehee!"
10060-380-1 = "All right! Don't be shy! Hop on in. The water's fine!"
10060-390-1 = "It's a super-special hot spring I made just for you!"
10060-2600-1 = "What? You're giving me this? Why? Um, I don't understand... But I guess I'll just keep working hard! Hahaha!"
