[translation]
10062-10-1 = "Blue Archive"
10062-20-1 = "Millennium Science School, C&C call sign Zero-Four. Asuma Toki. I promise perfect assistance."
10062-30-1 = "What's this space for?"
10062-40-1 = "A cafe... I've heard of it."
10062-50-1 = "Beverages containing sugar can be very effective for recovering from fatigue."
10062-60-1 = "At the very least, I can make tea. I'm familiar with that."
10062-70-1 = "I'll make note of the interior here."
10062-80-1 = "You're here, Sensei."
10062-90-1 = "I've been waiting. I'll be assisting you today."
10062-100-1 = "Thank you for coming, Sensei."
10062-110-1 = "What can I do for you?"
10062-120-1 = "Report for duty? At your command."
10062-130-1 = "...Please give me a reward when I'm done."
10062-140-1 = "You rarely give orders, Sensei."
10062-150-1 = "Does that mean I can do as I please?"
10062-160-1 = "Do I need a break?"
10062-170-1 = "I've been taking enough breaks, thanks to you."
10062-180-1 = "I have a little bunny rabbit impression I can do."
10062-190-1 = "Boing."
10062-200-1 = "...Please hurry and compliment me."
10062-210-1 = "Give me an order."
10062-220-1 = "I'll do my best to honor the name of C&C."
10062-230-1 = "Happy birthday, Sensei. A round of applause for you."
10062-240-1 = "It's my job as your assistant to celebrate your birthday."
10062-250-1 = "Huh? My birthday...?"
10062-260-1 = "Oh... Thank you for celebrating that."
10062-270-1 = "You know actions speak louder than words, right?"
10062-280-1 = "Let's go out. I'll assist you."
10062-290-1 = "It's the New Year."
10062-300-1 = "I'm turning over a new leaf. I've upgraded to an updated maid version."
10062-310-1 = "I'll be able to assist you even more efficiently now."
10062-320-1 = "Please don't keep quiet. Hurry, respond."
10062-330-1 = "I know what I'm supposed to say in this situation."
10062-340-1 = "It's \"Merry Christmas.\""
10062-350-1 = "Then I shall shoot down the formidable flying enemy..."
10062-360-1 = "...known as Santa Claus that is threatening your safety."
10062-370-1 = "To celebrate Halloween, I've activated my most powerful maid mode."
10062-380-1 = "This is where you say, \"You don't look any different than usual!\""
10062-400-1 = "There's not much to see, but welcome, Sensei."
10062-410-1 = "I was checking my equipment, as usual."
10062-420-1 = "I'm sorry to cause you concern."
10062-430-1 = "Yes. I always try to maintain peak condition."
10062-440-1 = "To honor the name of C&C,"
10062-450-1 = "I want to be a great maid."
10062-460-1 = "Do you...really think so? It doesn't seem that special to me."
10062-470-1 = "But hearing you say that makes me think..."
10062-480-1 = "I'm determined."
10062-490-1 = "Today's maintenance will be performed even more effectively than usual."
10062-500-1 = "The goal is to become the best maid in Kivotos. The maid of all maids."
10062-510-1 = "Well, Sensei..."
10062-520-1 = "Please watch carefully, all right?"
10062-2600-1 = "Thanks for caring... I've decided to provide complete personal protection for you from now on. Please leave everything to me."
