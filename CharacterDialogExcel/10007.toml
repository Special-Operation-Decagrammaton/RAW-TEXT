[translation]
10007-20-1 = "หวัดดีคุณครู! ไปทำกราฟิตี้กำแพงด้วยกันมั้ย?"
10007-30-1 = "ถ้ามีชื่อของฉันบนกำแพงนี้\nต้องเจ๋งมากแน่ๆ!"
10007-40-1 = "ต้องทำยังไงนะ\nถึงจะสื่ออารมณ์มุ้งมิ้ง\nผ่านสเปรย์ได้"
10007-50-1 = "อย่างนั้นแหละ!\nต้องระวังให้ดีๆ\nอย่าให้สีเลอะ!"
10007-60-1 = "เพิ่มสีแดงเข้าไปตรงนี้อีก\nหน่อยดีมั้ย?"
10007-70-1 = "สีออกมาสวยมากเลย..."
10007-80-1 = "ยินดีต้อนรับนะคุณครู \nแฟชั่นวันนี้น่าประทับใจจังเลย"
10007-90-1 = "นี่มันสายแล้วนะคุณครู!\nถ้าปล่อยให้รออีกหน่อยล่ะก็..."
10007-100-1 = "ฉันระเบิดมือถือของคุณครูแน่"
10007-110-1 = "มีอะไรเปื้อนหน้าฉันเหรอ?"
10007-120-1 = "หืม? สีเหรอ?"
10007-130-1 = "ลายกราฟิตี้นี้สวยใช่มั้ยล่ะ?\nฉันออกแบบเองเลยนะ!"
10007-140-1 = "การแฮ็กคงไม่มีความหมายอะไร"
10007-150-1 = "ถ้าเราเจาะระบบความปลอดภัยได้\nแต่ไม่ทิ้งร่องรอยอะไรไว้เลย หึหึ"
10007-160-1 = "TANGO DOWN!"
10007-170-1 = "ถ้าผนังของอาคารส่วนกลาง"
10007-180-1 = "ของคิโวทอสเป็นกราฟิตี้ทั้งหมด\nมันต้องสวยมากแน่ๆ"
10007-190-1 = "คุณครู! สุขสันต์วันเกิด!"
10007-200-1 = "หืม?\nฉันรู้วันเกิดได้ยังไงน่ะเหรอ?"
10007-210-1 = "เอ๊ะ? หรือว่าข้อมูลยังไม่ถูกเปิดเผย?"
10007-220-1 = "อยากได้อะไรเป็นของขวัญ\nวันเกิดงั้นเหรอ? อืม..."
10007-230-1 = "ขอฉันทาสี\nเสื้อผ้าของคุณครู\nเป็นสีที่ฉันชอบได้มั้ย?"
10007-240-1 = "คุณครู! แฮปปี้นิวเยียร์!"
10007-250-1 = "ปีนี้ก็มาเติมสีสัน\nให้กำแพงมีชีวิตชีวากันเถอะ!"
10007-260-1 = "ทั่วทุกพื้นที่\nส่องสว่างไปหมดเลย..."
10007-270-1 = "เราเอาความสวยงามนี้\nไปไว้บนกำแพงด้วยได้มั้ยนะ?"
10007-280-1 = "ฉันเตรียมชุดคอสตูมฮาโลวีน\nไว้ตั้งแต่เดือนที่แล้วเลยล่ะ"
10007-290-1 = "ฮุฮุ ตั้งตารอได้เลย!"
10007-310-1 = "เอาล่ะ คุณครูคิดว่าแบบนี้ดีมั้ย?\nคุณครูคิดว่ายังไงบ้าง?"
10007-320-1 = "ชิ... ทำไมถึง\nทำหน้าแบบนั้นล่ะ?"
10007-330-1 = "ลองสวมจิตวิญญาณศิลปิน\nแล้วลองประเมินดูหน่อยสิ!"
10007-340-1 = "คุณครูวาดอะไรเหรอ?\nอืม..."
10007-350-1 = "ฮ่าๆๆ! อะไรกันเนี่ย\nน่าขำสุดๆ ไปเลย!"
10007-360-1 = "สูงขนาดนี้ไม่กลัวเลยงั้นเหรอ?\nไม่เป็นไรหรอก\nเพราะมีคุณครูอยู่ด้วยนี่นา"
10007-370-1 = "ถ้าต้องการอะไรก็เรียกฉันได้เลยนะ\nทั้งกำแพงแล้วก็คุณครู...\nฉันจะวาดให้สุดฝีมือเลยละ!"
10007-2600-1 = "ฉันจะใช้ปืนนี้\nแต่งแต้มโลกให้มีสีสันขึ้นอีก!"
