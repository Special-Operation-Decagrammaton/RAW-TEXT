[translation]
10122-10-1 = "ブルーアーカイブ～あはは☆"
10122-20-1 = "聖園ミカ、水着姿で再登場～☆って感じかな？\nこれからもよろしくね、先生！"
10122-30-1 = "あははっ、変なの～"
10122-40-1 = "ふーん、\nみんなこんな風に\nシャーレに来てるんだ。"
10122-50-1 = "（きっとみんなにも、\n悩みはあるんだよね。\n私みたいに……）"
10122-60-1 = "先生、\nいつ来るのかな～"
10122-70-1 = "これ、触っても\n大丈夫かな……？"
10122-80-1 = "あっ！先生！"
10122-90-1 = "私は準備できてるよ！"
10122-100-1 = "何からお手伝い\nしたらいいかな？"
10122-110-1 = "おかえりなさい、\nあ・な・た！"
10122-120-1 = "お風呂にする？\nご飯にする？"
10122-130-1 = "それとも――"
10122-140-1 = "なんちゃって。\n冗談冗談☆"
10122-150-1 = "何でも任せてよ♪"
10122-160-1 = "ま、上手くできるかは\n分かんないけどね☆"
10122-170-1 = "先生って、\nやっぱり\nすごいよね……。"
10122-180-1 = "お仕事、\n全然面白くないのに\n頑張ってて……。"
10122-190-1 = "……何で\n水着姿なのかって？"
10122-200-1 = "え……やっ改まって\n聞かれると\n恥ずかしいね……。"
10122-210-1 = "今日、\nなんもないね～"
10122-220-1 = "え、全然\n退屈じゃないよ？"
10122-230-1 = "だって先生と\n一緒だもん♪"
10122-240-1 = "平和が一番かぁ……。"
10122-250-1 = "そうだよね！"
10122-260-1 = "先生！今日って\nお誕生日だよね？"
10122-270-1 = "直接顔を見て\n言いたかったから、\nこうして会えて……よかった。"
10122-280-1 = "お誕生日おめでとう！"
10122-290-1 = "今日がとっても\n素敵な一日に\nなりますように……！"
10122-300-1 = "いや～あはは……"
10122-310-1 = "今日、当番だって\n連絡もらってさ。"
10122-320-1 = "もしかして……って\n思ってたんだ。"
10122-330-1 = "今日のこと、\nずっと忘れないよ。"
10122-340-1 = "あけまして\nおめでとーう！\n先生！"
10122-350-1 = "今年は、先生の頑張りに\n負けないくらい、\n私も頑張るからね！"
10122-360-1 = "先生……今日が\n何の日か分かってる……？"
10122-370-1 = "今日の当番、\n私でいいの？"
10122-380-1 = "……え？"
10122-390-1 = "それ、本当に……？"
10122-400-1 = "……ふふっ。\nよーっし！"
10122-410-1 = "今日も頑張ろうね！\n先生♪"
10122-420-1 = "今日はハロウィーンだよ！\n先生！"
10122-430-1 = "お菓子くれないと～、\nいたずらしちゃうぞ～？"
10122-440-1 = "……って！そんなに\n警戒しなくてもよくない？"
10122-450-1 = "種も仕掛けもないからさ！"
10122-470-1 = "ねぇ、先生。"
10122-480-1 = "私……この景色を\n先生と見られて\nよかった。"
10122-490-1 = "心配事も――"
10122-500-1 = "将来の悩みも――"
10122-510-1 = "不安も――\nまだ、残ってる。"
10122-520-1 = "でも……。"
10122-530-1 = "こんな星空を\n見ちゃったらさ。"
10122-540-1 = "……全部、ちっぽけな\nことなんじゃないかなって。"
10122-550-1 = "そんな気がするんだ。"
10122-560-1 = "先生、言って\nくれたよね。"
10122-570-1 = "今、この瞬間が、\nこれからもずっと……。"
10122-580-1 = "私を支えてくれる、\nって。"
10122-590-1 = "だから……。"
10122-600-1 = "私も、幸せになるよ。"
10122-2600-1 = "これを……私に？うっそだ～！\n……え、本当に？もう……先生、\n本当にずるいよね。いつも何食わぬ顔で\nこんなことしちゃってさ。反則だよ……。\n私もお返しできたらよかったのに……。"
