[translation]
20027-10-1 = "Blue Archive."
20027-20-1 = "It's fishing time. Sensei."
20027-30-1 = "I don't think I can catch...anything here..."
20027-40-1 = "Is that...?"
20027-50-1 = "If only there were a fishing hole..."
20027-60-1 = "...Hm... Could we catch anything here?"
20027-70-1 = "...Huh? That sound..."
20027-80-1 = "Welcome, Sensei."
20027-90-1 = "You just got here...so maybe I shouldn't say this, but..."
20027-100-1 = "Let's go outside..."
20027-110-1 = "I've been waiting, Sensei."
20027-120-1 = "We don't get this kind of opportunity often."
20027-130-1 = "Let's make the most of it."
20027-140-1 = "Sensei, is there anything you want to do?"
20027-150-1 = "Should we go out and do something? Or are you hungry?"
20027-160-1 = "I wore this for you, Sensei."
20027-170-1 = "I'm going to catch a big one. Just wait."
20027-180-1 = "Air conditioners and fans are great, but..."
20027-190-1 = "...cooling off in the water is better."
20027-200-1 = "Sensei, do you know how to swim? Should I teach you?"
20027-210-1 = "Happy birthday, Sensei."
20027-220-1 = "A birthday meal... How does sashimi sound?"
20027-230-1 = "Ah! My birthday..."
20027-240-1 = "You remembered. Thank you, Sensei."
20027-250-1 = "It's the...new year. Happy New Year, Sensei."
20027-260-1 = "Yeah. Let's continue traveling together in the new year too."
20027-270-1 = "Christmas..."
20027-280-1 = "I thought the water would be warm...but it's very cold."
20027-290-1 = "...A little too cold."
20027-300-1 = "Halloween... I saw some people wearing pumpkins on their heads."
20027-310-1 = "...Should I try wearing one too?"
20027-330-1 = "I'm back, Sensei."
20027-340-1 = "Yes. I got it. Now, I can make the dish..."
20027-350-1 = "The dish I saw in the pamphlet, I mean."
20027-360-1 = "I've got my cookware ready. Everything's set."
20027-370-1 = "...I'm glad you came here with me."
20027-380-1 = "I might have given up if I was alone."
20027-390-1 = "Hmm... Not true. I was able to do this...and I was able to think like this..."
20027-400-1 = "Only...because you were watching over me."
20027-410-1 = "Thank you...Sensei."
20027-2600-1 = "Even at a place like this... Sensei is always the same. Thank you for always supporting...I mean, helping me."
