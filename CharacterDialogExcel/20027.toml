[translation]
20027-10-1 = "ブルーアーカイブ。"
20027-20-1 = "釣りの時間だよ、先生。行こう。"
20027-30-1 = "ここでは…\n獲れそうにない。"
20027-40-1 = "あれは…？"
20027-50-1 = "釣り堀があれば…。"
20027-60-1 = "…あれ、獲れるかな？"
20027-70-1 = "…ん？今の音は…。"
20027-80-1 = "おかえり、先生。"
20027-90-1 = "今来たばっかの人に\nかける言葉じゃ\nないかもしれないけど…"
20027-100-1 = "…外、出よっか。"
20027-110-1 = "待ってたよ、先生。"
20027-120-1 = "そう何度もある\nチャンスじゃないから。"
20027-130-1 = "できることは\n最大限やってみる。"
20027-140-1 = "先生、なにかしたいことある？"
20027-150-1 = "どこに行って、何したい？\nそれともお腹空いた？"
20027-160-1 = "これ、先生のために着てる。"
20027-170-1 = "ん、大物を獲ってくるから\n期待してて。"
20027-180-1 = "エアコンや\n扇風機もいいけど…"
20027-190-1 = "水中の方が好きかも。"
20027-200-1 = "そういえば…\n先生は、泳げる？教えようか？"
20027-210-1 = "お誕生日\nおめでとう、先生。"
20027-220-1 = "誕生日のご馳走…\nお刺身でいい？"
20027-230-1 = "あ、誕生日…。"
20027-240-1 = "覚えてくれてたんだ、\nありがとう。先生。"
20027-250-1 = "新年…だね。\nあけましておめでとう、先生。"
20027-260-1 = "ん。新年も一緒に、\n色んなとこ行こう。"
20027-270-1 = "クリスマス…か。"
20027-280-1 = "水中の方が温か…くはない。"
20027-290-1 = "…やっぱり無理か。"
20027-300-1 = "ハロウィン…\nカボチャを被った人を見たよ。"
20027-310-1 = "…私も被ってみようかな。"
20027-330-1 = "…ただいま、先生。"
20027-340-1 = "…ん、成功した。\n…これで、作れるよ。"
20027-350-1 = "パンフレットで見た、\nあの料理。"
20027-360-1 = "料理道具も準備したから、\n問題ない。"
20027-370-1 = "…先生が一緒に\n来てくれてよかった。"
20027-380-1 = "一人だったら、途中で\nやめてたかもしれない。"
20027-390-1 = "ううん…そんなことない。\n今も、これを考えるように\nなったきっかけも。"
20027-400-1 = "すべて…先生が\nいてくれたから。"
20027-410-1 = "…先生。…ありがとう。"
20027-2600-1 = "こういうところに来ても…\n先生は変わらないね。\nいつも支援…いや。\n…助けてくれて、ありがとう。"
