[translation]
10011-20-1 = "訓育支援部梅花園の教官、シュンです。\nうちの子たちをよろしくお願いいたしますね、\nせ・ん・せ・い？"
10011-30-1 = "ふふ、次はここへみんなを\n一緒に連れてきての\n授業にしましょうか？"
10011-40-1 = "お昼寝の時間はまだなのに…\nなんだか眠くなってきました…"
10011-50-1 = "リンカはきちんと、\n子供たちの面倒を見ら\nれているでしょうか…"
10011-60-1 = "あらまあ、カワイイ…"
10011-70-1 = "ふふ、愛くるしいですね～"
10011-80-1 = "ようこそ、先生。\nお食事になさいますか、\nお風呂に入られますか？"
10011-90-1 = "それとも…授業？"
10011-100-1 = "前回、途中で終わってしまった\n授業を再開しましょう、ふふ。"
10011-110-1 = "もう～、先生は私に\n甘えちゃダメですよ。"
10011-120-1 = "でもたまにでしたら…\n大目に見てあげますよ？"
10011-130-1 = "ふふっ、今日もよろしくお\n願いいたしますね？"
10011-140-1 = "は～い、シュンですよ～"
10011-150-1 = "いい子、いい子～"
10011-160-1 = "また触ると…"
10011-170-1 = "こらっ、\nって叱っちゃいますよ？"
10011-180-1 = "ハッピーバースデー\nトゥーユー♪\nハッピーバースデー\nトゥーユー♬"
10011-190-1 = "ハッピーバースデー\nディア先生～♪\nハッピーバースデー\nトゥーユー♬"
10011-200-1 = "ふう…また一つ、\n年を取ってしまいましたね…"
10011-210-1 = "私の年ですか？\nふふ、秘密ですよ。"
10011-220-1 = "ふふ、今年も一年、\nよろしくお願いしますね～。"
10011-230-1 = "しっ、先生。\nサンタの変装がバレないように\n気を付けてくださいね。"
10011-240-1 = "子供たちの純粋な心は、\n何よりも大切なもの\nなんですから。"
10011-250-1 = "あら、子供たちがどこかで\n飴をたくさん貰って\nきたようですね。"
10011-260-1 = "トリック…"
10011-270-1 = "なんでしたっけ？"
10011-290-1 = "あら、\nお目覚めになりましたか。"
10011-300-1 = "今日は…\n本当に楽しかったです。\nふふ。"
10011-310-1 = "あら、もう子供たちが\n帰ってくる時間ですね。"
10011-320-1 = "そろそろお仕事にお\n戻りになった方が\n良いのでは…。"
10011-330-1 = "いえ、やはり…ふふ、\nもう少しゆっくりしていて\nください、先生。"
10011-340-1 = "今日の授業は\n私が代わりますので。"
10011-350-1 = "ああ…可愛い…\nふふっ。"
10011-2600-1 = "これを使いたくはなかったのですけど……\nびしっとした愛のムチも、\n時には必要なのです。"
