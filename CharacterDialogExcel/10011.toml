[translation]
10011-20-1 = "ฉันชื่อชุน ผู้ฝึกสอนของชมรมดูแลวินัยแห่งสวนต้นบ๊วยค่ะ\nขอฝากเด็กๆ ของฉันด้วนะคะ คุณครู~"
10011-30-1 = "ฮุฮุ คราวหน้าพวกเรา\nมานั่งเรียนกันที่นี่ดีไหมคะ?"
10011-40-1 = "ยังไม่ถึงเวลานอนกลางวันเลย...\nทำไมถึงได้ง่วงแบบนี้นะ..."
10011-50-1 = "รินกะจะดูแลเด็กๆ ดีรึเปล่านะ..."
10011-60-1 = "อุ๊ย สวยจังเลย... "
10011-70-1 = "ฮุฮุ น่ารักจังเลยค่ะ~"
10011-80-1 = "เชิญค่ะ คุณครู\nจะทานอาหารก่อนไหมคะ?\nหรือว่าจะอาบน้ำก่อนดีคะ?"
10011-90-1 = "หรือว่า... จะเริ่ม \"เรียน\" ก่อนดีคะ?"
10011-100-1 = "เรามาเรียนกันต่อ....\nจากบทเรียนครั้งก่อนเถอะค่ะ ฮิฮิ"
10011-110-1 = "โธ่~ คุณครูอย่างอแงใส่ฉันสิคะ"
10011-120-1 = "แต่ว่าถ้านานๆ ทีละก็...\nฉันจะยอมให้แล้วกันนะคะ"
10011-130-1 = "ฮุฮุ วันนี้ก็ขอฝากตัวด้วยนะคะ"
10011-140-1 = "ค่า~ ชุนเองค่ะ~"
10011-150-1 = "เก่งจัง~ เก่งมากเลยค่ะ~!"
10011-160-1 = "ถ้ามาแตะบ่อยๆ แบบนี้..."
10011-170-1 = "ฉันจะดุแล้วนะคะ"
10011-180-1 = "แฮปปี้ เบิร์ธเดย์ ทูยู~ ♪\nแฮปปี้ เบิร์ธเดย์ ทูยู~ ♪"
10011-190-1 = "แฮปปี้ เบิร์ธเดย์ เดียร์ มาย เซ็นเซ~ ♪\nแฮปปี้ เบิร์ธเดย์ ทูยู~ ♪"
10011-200-1 = "เฮ้อ... อายุเพิ่มขึ้น\nอีกหนึ่งปีแล้วนะคะ..."
10011-210-1 = "ฉันอายุเท่าไหร่น่ะเหรอคะ?\nฮุฮุ ความลับค่ะ"
10011-220-1 = "ฮุฮุ ปีนี้ก็ขอฝากเนื้อฝากตัวด้วยนะคะ"
10011-230-1 = "ชู่ว คุณครูคะ\nต้องระวังไม่ให้จับได้\nว่าแต่งตัวเป็นซานต้านะคะ"
10011-240-1 = "ความเชื่อของพวกเด็กๆ\nเป็นเรื่องสำคัญมากนะคะ"
10011-250-1 = "ตายจริง พวกเด็กๆ\nได้ลูกกวาดมาเยอะเลยนะคะ"
10011-260-1 = "ทริก..."
10011-270-1 = "ต้องพูดว่ายังไงน้า?"
10011-290-1 = "อุ๊ย ตื่นแล้วเหรอคะ"
10011-300-1 = "วันนี้ฉันสนุกมากเลยค่ะ ฮุฮุ"
10011-310-1 = "ตายจริง ถึงเวลาที่\nพวกเด็กๆ จะกลับมาแล้วค่ะ"
10011-320-1 = "คุณครูเองก็จะต้อง\nกลับแล้วรึเปล่าคะ?"
10011-330-1 = "เปล่าหรอกค่ะ... ฮุฮุ\nพักต่ออีกหน่อยเถอะค่ะ คุณครู"
10011-340-1 = "เดี๋ยววันนี้ฉันจะเข้าคลาสแทนเองค่ะ"
10011-350-1 = "อา... น่ารักจัง ฮุฮุ"
10011-2600-1 = "ถึงไม่ค่อยอยากใช้สักเท่าไร...\nแต่บางครั้งการหวดแส้แห่งความรัก\nให้แสบๆ คันๆ ก็คงจำเป็นเหมือนกันค่ะ"
