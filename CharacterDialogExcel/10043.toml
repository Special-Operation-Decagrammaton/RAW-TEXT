10043-720-1 = "ฮุฮุฮุ...!\nสวัสดีปีใหม่ค่ะ\nคุณครู"
10043-730-1 = "ปีนี้ฉันก็จะได้ใช้เวลา\nสร้างความทรงจำ\nร่วมกับคุณท่านอีกสินะคะ"
10043-740-1 = "เมอร์รี คริสต์มาสค่ะ...\nคุณท่าน♥"
10043-750-1 = "วันพิเศษแบบนี้\nด้วยชุดพิเศษแบบนี้...\nเพียงแค่สองคน..."
10043-760-1 = "ฉันรอคอยวันนี้...\nมาโดยตลอดเลยค่ะ\nฮุฮุฮุฮุ"
10043-770-1 = "ทริก ออร์ ทรีตค่ะ คุณครู"
10043-780-1 = "คะ? หน้ากากวันฮาโลวีน\nน่ะเหรอคะ?"
10043-790-1 = "ถะ...ถ้าถามว่า\nมีหน้ากากแบบนั้นรึเปล่า\nอันที่จริงก็มีอยู่ค่ะ"
10043-810-1 = "ฮุฮุ อุ่นจังเลยค่ะ..."
10043-820-1 = "แน่นอนว่าอาจจะเป็นเพราะ\nมีกองไฟอยู่ก็จริง..."
10043-830-1 = "แต่คำพูดของคุณท่าน\nทุกๆ คำพูด..."
10043-840-1 = "ตอนนี้พอคิดว่าคุณท่าน\nพูดคำเหล่านั้นเพื่อวาคาโมะแล้ว..."
10043-850-1 = "ตัวฉันในตอนนี้...\nยังบกพร่องในหลายๆ เรื่อง"
10043-860-1 = "เวลาที่อยู่เคียงข้างคุณท่าน\nก็มักสร้างปัญหาให้คุณท่านบ่อยๆ..."
10043-870-1 = "แล้วก็อาจจะทำอะไร\nผิดพลาดไปอีกก็ได้ค่ะ"
10043-880-1 = "แต่ถึงอย่างนั้นฉันก็ยังอยาก\nที่จะขออยู่เคียงข้างคุณท่าน"
10043-890-1 = "แบบนี้ต่อไปได้หรือเปล่าคะ...?"
10043-900-1 = "ขอบคุณมากค่ะ..."
10043-910-1 = "เพราะคุณท่านเป็นแบบนี้ ตัวฉัน..."
10043-2600-1 = "ของแบบนี้... เพื่อคนอย่างฉัน...?\nวาคาโมะผู้นี้ขอให้คำสัตย์ค่ะ...\nหากมีสิ่งใดมาขัดขวางระหว่างฉันกับคุณท่าน\nฉันจะใช้พลังทั้งหมดที่มีทำลายให้หมด\nฮุฮุฮุฮุ ฮุฮุฮุฮุ...♥"
