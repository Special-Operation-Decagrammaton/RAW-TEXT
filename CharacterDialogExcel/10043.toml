10043-630-1 = "คือว่าฉัน...\nก็... เขินเป็นนะคะ..."
10043-640-1 = "ฤดูร้อนที่รอคอยมาถึงแล้ว...\nถ้าอย่างนั้น คุณท่านคะ...\nวาคาโมะเตรียมใจพร้อมแล้วค่ะ"
10043-650-1 = "วาคาโมะผู้นี้ ถ้าเป็นคุณท่านละก็\nคงจะเผยทุกอย่างให้เห็นได้...!"
10043-660-1 = "เพราะมีวันนี้ที่เป็นวันเกิดของคุณท่าน\nเลยทำให้ฉันได้พบ\nกับคุณท่านได้ค่ะ"
10043-670-1 = "พอคิดแบบนั้นแล้ว\nวันนี้ก็ดูเป็นวันที่...\nยิ่งใหญ่มากเลยค่ะ..."
10043-680-1 = "สุขสันต์วันเกิดนะคะ\nคุณท่าน-"
10043-690-1 = "วันเกิดของฉันงั้นเหรอคะ...?"
10043-700-1 = "อา... ฉันรู้สึกเหมือนว่า\nจะเป็นลมเลยค่ะ\nไม่ใช่เพราะแดดร้อนหรอกค่ะ\nแต่เพราะดีใจมากเกินไปค่ะ..."
