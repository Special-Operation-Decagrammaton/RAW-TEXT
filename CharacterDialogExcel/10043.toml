[translation]
10043-10-1 = "Heehee. Blue Archive!"
10043-20-1 = "Even under the scorching sun, or in ice-cold water...I'll follow you anywhere. So this summer, please don't leave me, my darling ♥"
10043-30-1 = "This place is cool. Heeheehee... ♥"
10043-40-1 = "This outfit... I can't wait to show you..."
10043-50-1 = "*sigh* ...Where are you now...?"
10043-60-1 = "It's kind of noisy here..."
10043-70-1 = "I feel a gaze... Could it be from Sensei? Heeheehee..."
10043-80-1 = "Oh, Sensei. Welcome."
10043-90-1 = "I, Wakamo, have been waiting for you. A day feels like a thousand years! ♥"
10043-100-1 = "Welcome, Sensei. Preparations are complete."
10043-110-1 = "Now, please tell me anything."
10043-120-1 = "Heehee, heeheehee..."
