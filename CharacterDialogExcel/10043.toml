10043-150-1 = "During summer, everyone lets their guard down and gets excited..."
10043-160-1 = "So, it's not an exaggeration to say that anything can happen!"
10043-170-1 = "Heehee..."
10043-180-1 = "Can I move just a little closer to you? ...Huh? That close?"
10043-190-1 = "O-Oh...?!"
10043-200-1 = "Oh, um, that's..."
10043-210-1 = "Oh, o-okay... E-Excuse me..."
10043-220-1 = "I've been wanting to take a walk with you, but..."
10043-230-1 = "It's too hot today, so it'd be best to wait until the sun goes down."
10043-240-1 = "The days are longer in the summer, which doesn't help."
10043-250-1 = "When will I be able to take a walk with you...?"
10043-260-1 = "You're asking if wearing a mask during summer feels stuffy?"
