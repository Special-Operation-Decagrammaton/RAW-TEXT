[translation]
16010-10-1 = "ブ、ブルーアーカイブ…！"
16010-20-1 = "先生…ど、どう…？\nチアリーダーの衣装を作ったのは、\n初めてだけど…そんなに悪くは…ない？"
16010-30-1 = "応援が必要な人\n…いる？"
16010-40-1 = "この賑やかな\n雰囲気…\n悪くない。"
16010-50-1 = "疲れた…少し\n喉乾いてきたかも。"
16010-60-1 = "あれは…ちょっと\n改造してみようかな。"
16010-70-1 = "ここら辺でいいかな？\nそれとも…この辺？"
16010-80-1 = "おかえりなさい、先生。\n応援する？改造する？\nそれとも…"
16010-90-1 = "頑張って働こう、先生。\nもしやる気がなくなったら…\nいつでも言って。"
16010-100-1 = "先生…なんだか元気ない？\n応援が必要？…必要だよね？"
16010-110-1 = "先生の役に立ちたいから。\n技術だけじゃなくて…\nいろんな面で。"
16010-120-1 = "ここは運動場じゃないから…\nこの格好はちょっと、その…"
16010-130-1 = "何だか変な感じ。"
16010-140-1 = "普段は、これより\n露出度が高い格好でも\n気にならなかったのに…"
16010-150-1 = "（もしかして私…\n先生のこと、\n意識してるのかな）"
16010-160-1 = "フレー、フレー！先生！\nいつも、ありがと！\n先生！感謝！"
16010-170-1 = "…今日は特別な日だから。\nちょっと頑張ってみた。"
16010-180-1 = "うん、誕生日おめでとう。\n先生。"
16010-190-1 = "今日は私の誕生日だよ、先生。"
16010-200-1 = "だから今日は…先生に応援、\nしてもらいたいな。"
16010-210-1 = "あけましておめでとう、先生。\n今年も、先生のために\n一生懸命応援する。"
16010-220-1 = "もうクリスマスだね。\n新しいデザインのチア衣装を\n用意すればよかったね。"
16010-230-1 = "ああ…今日は\nハロウィーンだったんだ。\nどうりで…\n外が騒がしいと思った。"
16010-240-1 = "ん…？私？\n…こ、この服は、\nそういうのじゃない…"
16010-260-1 = "フレー、フレー…先生！"
16010-270-1 = "行け行け、勝て勝て、\n先生…"
16010-280-1 = "ん？\n何に勝つための\n応援かって？"
16010-290-1 = "何だろう…？\n先生を苦しめる業務、とか。\n先生としての責任とか…？"
16010-300-1 = "気がかりなら、\n応援のフレーズを\nちょっと変えようか…？"
16010-310-1 = "頑張れ、頑張れ…先生！"
16010-320-1 = "（…なんだかおかしい。\n先生、元気になるどころか、\nあんまり集中できて\nなさそうに見える）"
16010-330-1 = "（…もしかして今の私、\n結構とんでもないことを\nしちゃってるのかも…？）"
16010-2600-1 = "ありがとう、先生…\nこれからも見せ続けてあげる。\n…今まで見られなかったような、\n新しい景色を。"
