[translation]
10055-10-1 = "ブルーアーカイブ"
10055-20-1 = "あ、先生。仕事前に\n一杯どうかな？ふふっ……\nお酒じゃないから安心して。"
10055-30-1 = "かわいいものが\nいっぱいだね。"
10055-40-1 = "あれは……？"
10055-50-1 = "発酵に最適な\n温度だね。"
10055-60-1 = "ここは温かいね。\n……もう少しだけ\nここにいたいな。"
10055-70-1 = "これにアレを\n少し混ぜて……。"
10055-80-1 = "いらっしゃい、先生。\nちょうど暇だったし"
10055-90-1 = "おしゃべりでもしない？"
10055-100-1 = "おかえり、先生。\n疲れてるみたいだね……"
10055-110-1 = "これでも飲む？"
10055-120-1 = "シャーレは\n日当たりがよくて、\n温かいね。"
10055-130-1 = "ボーっとしてたら\n寝ちゃいそう……。"
10055-140-1 = "ん？何か手伝おうか？"
10055-150-1 = "今度は私が\n先生を招待しようかな。"
10055-160-1 = "ふんふふ～ん♪"
10055-170-1 = "なんで前に配給用カンポットに\nお酒を混ぜたのか、って？"
10055-180-1 = "そうだなぁ……。"
10055-190-1 = "昔のことだから思い\n出せないや……ふふ。"
10055-200-1 = "お誕生日おめでとう、先生。"
10055-210-1 = "お祝いのカンポットでもどう？"
10055-220-1 = "そういえば今日私の\n誕生日だったね。"
10055-230-1 = "無茶なお願いは\nしないから安心して\n……ふふっ。"
10055-240-1 = "あけましておめでとう、先生。"
10055-250-1 = "新年だし甘酒くらい、\nいいよね？"
10055-260-1 = "……ん？ダメなの？"
10055-270-1 = "メリークリスマス、先生。\n何か欲しいものはある？"
10055-280-1 = "私？"
10055-290-1 = "……私は\n今のままで十分かな。"
10055-300-1 = "かぼちゃジュースが\n飲みたい気分。"
10055-310-1 = "もちろん\n発酵していないヤツね。"
10055-330-1 = "綺麗な夜景だね……。"
10055-340-1 = "こんな素敵な景色を\n見せてくれてありがとう、\n先生。"
10055-350-1 = "……そう言ってくれるのは\n嬉しいけど。"
10055-360-1 = "私、やっぱり今の場所が\n好きなんだ。"
10055-370-1 = "……こういう都会だと、\nあまり星が見えないでしょ。"
10055-380-1 = "明るすぎる光の中だと、\n星ってうまく見つけられ\nなくなっちゃうから……"
10055-390-1 = "だから、私は暗闇から\n眺めるだけで十分。"
10055-400-1 = "大切な人と、美味しい\n飲み物さえあれば……"
10055-410-1 = "場所はどこだって\n構わないからね。"
10055-2600-1 = "このグレネードランチャー、\n火を起こす時はいいんだけど\n狩りでは微妙なんだよね。\n……でもまぁ、\n熊を追い返すには十分なのかな。"
