[translation]
10080-10-1 = "ブルーアーカイブ。"
10080-20-1 = "あら、自己紹介はしたはずだけど……\nもしかして覚えてないのかしら？うふふっ。"
10080-30-1 = "あら、なかなか可愛い\nインテリアじゃない？"
10080-40-1 = "センスあるじゃない。"
10080-50-1 = "面白そうな\n子が多いわねぇ。"
10080-60-1 = "なんだか……\n落ち着くかも。"
10080-70-1 = "気を使わなくていい\n場所だからかしら……\n悪くないわね。"
10080-80-1 = "いらっしゃい、先生。\n……こう見えて、\n結構待ったんだゾ☆"
10080-90-1 = "ん？……なんとなく、\nここにいただけよぉ。\nガイドもいないし、\nあんまり出かけたくなくって。"
10080-100-1 = "先生のお仕事って、\n私が知ってるものと\n同じようで違うのねぇ。"
10080-110-1 = "お仕事、大変そうねぇ……\n手伝いましょうか？\n……もちろん、\n普通のやり方よぉ。"
10080-120-1 = "実はまだ、\n今も頭がちょっと\n痛むのよぉ。"
10080-130-1 = "リモコン……？\nたしかに大事だけどぉ……\n別にアレ自体に\n何かあるわけじゃないのよ？"
10080-140-1 = "そういえばココって\n何が美味しいのかしらぁ？\nおすすめのお店、\n連れてってくれない？"
10080-150-1 = "先生のお誕生日よね？\nどう祝ってあげましょう。"
10080-160-1 = "……ちなみに、\n一緒に過ごしたい子とか、\nいるかしら？"
10080-170-1 = "あけましておめでと、先生。\n……ココでもこの\n挨拶で合ってるのかしらぁ？"
10080-180-1 = "クリスマス、ねぇ……。\n先生は、何回サンタに\nなったのかしら？"
10080-190-1 = "外が騒がしいわね。\nまあ……ココなら\n構わないけどぉ。"
10080-210-1 = "……なぁに？\nどうかしたのかしらぁ。"
10080-220-1 = "いずれにせよ、\nいつかこうなる事だったと\n思うのだけど？"
10080-230-1 = "そうでしょう？"
10080-240-1 = "……リモコン？\n……それ、聞いちゃう？"
10080-250-1 = "ちょっと気配りが\n足りないかもぉ？"
10080-260-1 = "女の子が\n話そうとしていないならぁ……"
10080-270-1 = "無理に聞こうとしちゃ\nダメだゾ☆"
10080-280-1 = "いい？あなたは\n何も見ていないし、\nそもそも何も起きてなかった。"
10080-290-1 = "……そうよねぇ、先生？"
10080-2600-1 = "あなたも変わってるわねぇ。\nああ、悪い意味では無いのよぉ。……普通は\n頭の中を読んでない相手のことなんて、\n信じないんだけど……疑ってない程度、\nって事にしておこうかしら？"
