[translation]
10100-10-1 = "ブルーアーカイブ。"
10100-20-1 = "アビドスの砂狼シロコ…。\nん、またよろしくね、先生。"
10100-30-1 = "ここは…\n悪くない…。"
10100-40-1 = "平和だね、ここは。"
10100-50-1 = "ん、休憩しようかな。"
10100-60-1 = "これは…なに？\n開けてみていいの…？"
10100-70-1 = "（この家具…先生の\n好みなのかな…）"
10100-80-1 = "忙しそうだけど…\n手伝おうか？"
10100-90-1 = "ん、待ってたよ、先生。\n仕事が終わるまで、\n帰さないから。"
10100-100-1 = "先生、書類仕事、\n少し終わらせたよ。"
10100-110-1 = "ん？教わってないのに、\nどうやったのかって？"
10100-120-1 = "…前、やったことあるから。"
10100-130-1 = "休憩室にある\nお菓子、なんだけど…"
10100-140-1 = "ごめん、ちょっと\n食べちゃった。"
10100-150-1 = "もっと食べていいの？"
10100-160-1 = "…ありがとう。"
10100-170-1 = "先生、遅くまで仕事？"
10100-180-1 = "私も、一緒に居てあげる。"
10100-190-1 = "何でそんなにじーっと\n見てるの…？"
10100-200-1 = "ん、睨めっこ対決、\n受けて立つ。"
10100-210-1 = "あれもこれも全部、\n懐かしいものばかり。"
10100-220-1 = "誕生日、おめでとう。"
10100-230-1 = "その、よかったら\n一緒にライディング…"
10100-240-1 = "ん？その提案は\n今日で2回目？"
10100-250-1 = "私の誕生日だね、\nありがとう。"
10100-260-1 = "…先生、こっちの私も、\nお祝いしてあげて。"
10100-270-1 = "あけましておめでとう、先生。"
10100-280-1 = "また新しい一年が始まるね。\n先生の今年の目標は？"
10100-290-1 = "クリスマスだね…\n私へのプレゼントは？"
10100-300-1 = "ふふ、冗談だよ。\nメリークリスマス、先生。"
10100-310-1 = "トリック・オア・トリート。"
10100-320-1 = "ん、先に言ったのは私。\nお菓子、もらうね。"
10100-340-1 = "…いつも通りだね、\nここは。"
10100-350-1 = "変わったのは、\n私だけか。"
10100-360-1 = "ん…でも、変わって\nないものもあって、\n少し安心した。"
10100-370-1 = "先生、私、\nまた自転車に\n乗ってみたいと思う。"
10100-380-1 = "色々と壁はあるかも\nしれないけど…"
10100-390-1 = "でも、先生が\n居てくれたら…\nできる気がするの。"
10100-400-1 = "ん、ありがとう。先生。"
10100-2600-1 = "私に、ここまで\nしてくれるんだ。う、ううん。\n不満とかじゃなくて。\nただ、ちょっと驚いただけ…。"
