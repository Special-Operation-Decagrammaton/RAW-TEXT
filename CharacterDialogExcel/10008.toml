[translation]
10008-10-1 = "Blue Archive"
10008-20-1 = "เอ๋???\nเจอกันจนได้สินะ\nงั้นก็คงต้องเข้าไปช่วยแล้ว"
10008-30-1 = "อืม...\nที่นี่ไม่เลวเลยนะ"
10008-40-1 = "อะไรน่ะ มาให้กำลังใจฉันเหรอ?\nเฮอะ! บันเทิงชะมัด"
10008-50-1 = "สิ่งที่สนุกที่สุดเหรอ?\nอืม... การได้เอาชนะไง"
10008-60-1 = "เอ่อ... ก็แบบ...\nครูเนี่ยไม่รู้อะไรเลย!"
10008-70-1 = "อืม... ขอบคุณนะ\nแอบเขินอยู่นะเนี่ย..."
10008-80-1 = "เอ่อ... คือว่า...\nออกไปข้างนอกด้วยกันเถอะ!"
10008-90-1 = "นี่ครู... มาสายนะ"
10008-100-1 = "เอาล่ะ! \nวันนี้ก็สู้เค้านะครู"
10008-110-1 = "เหอะ... ปล่อยให้ฉันรอเหรอ?\nไม่อยากจะเชื่อเลย"
10008-120-1 = "ดีละ~ ไปทำความสะอาดกัน!"
10008-130-1 = "ทีนี้รู้แล้วใช่มั้ยว่าการทำงาน\nกับคนเก่งมันเป็นยังไง?"
10008-140-1 = "ทำงานให้มันดีๆ เหอะ"
10008-150-1 = "ถ้าอยากให้ช่วยก็บอก\nแล้วฉันจะทำให้เอง"
10008-160-1 = "นี่ ครู! แฮปปี้เบิร์ธเดย์!\nเอ่อ... เค้กนี่...\nฉันบังเอิญได้รับมา..."
10008-170-1 = "จะ... จะกินมั้ยล่ะ?"
10008-180-1 = "นี่ครู!\nรู้มั้ยว่าวันนี้วันอะไร?\nไม่รู้ก็ไม่เป็นไรหรอกนะ"
10008-190-1 = "แต่ฉันต้องได้ของขวัญนะ!\nส่ง มา เดี๋ยว นี้ เลย!"
10008-200-1 = "นี่ครู! แฮปปี้นิวเยียร์!\nปีนี้ก็... เอ่อ..."
10008-210-1 = "แบบว่า... ฝากตัวด้วยนะ!!"
10008-220-1 = "นี่ครู! เมอร์รีคริสต์มาส"
10008-230-1 = "ไหนล่ะ...?\nไหนของขวัญ!"
10008-240-1 = "นี่ครู\nทริก ออร์ ทรีต?"
10008-250-1 = "หา...?\nไม่รู้ว่านั่นแปลว่าอะไรเหรอ?!"
10008-270-1 = "เข้ามาสิครู\nขอต้อนรับสู่ที่นั่งพิเศษของฉัน!"
10008-280-1 = "ฉันชอบโรงเรียนนี้\nแล้วก็... ชอบเวลานี้ด้วย"
10008-290-1 = "ฉันน่ะเหรอ? ไม่กลัวหรอก\nก็แค่ตื่นเต้นนิดหน่อย"
10008-300-1 = "ก็นะ บางครั้งการได้โดดเรียน\nมันก็สนุกดีนี่ ฮ่าฮ่าฮ่า!"
10008-2600-1 = "มอบกระบองให้ยักษ์ ติดปีกให้มังกร\nเพราะงั้นสำหรับฉันก็คือปืนกลมือคู่ยังไงล่ะ!"
