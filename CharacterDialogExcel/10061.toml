[translation]
10061-10-1 = "Blue Archive."
10061-20-1 = "I'm Utazumi Sakurako of the Sisterhood of Trinity General School. May you have a blessed day today."
10061-30-1 = "So, Sensei, this is the place you worked to create?"
10061-40-1 = "It seems to have welcomed many different sorts of people."
10061-50-1 = "It's quite different from the cathedral."
10061-60-1 = "Although...I certainly wouldn't mind visiting once in a while."
10061-70-1 = "It may be different, yet I feel at peace here."
10061-80-1 = "I've been waiting for you, Sensei. May you be blessed, today and all days."
10061-90-1 = "Oh, Sensei... I was praying for you just now."
10061-100-1 = "I'm supposed to assist you at Schale..."
10061-110-1 = "It's different from my usual work, so I'm a bit nervous."
10061-120-1 = "Work at the cathedral?"
10061-130-1 = "It's okay. I've been organizing my schedule."
10061-140-1 = "Yes, Sensei. If there's anything I might be able to do..."
10061-150-1 = "Anything regarding the cathedral, or any other work...please let me know."
10061-160-1 = "You seem tired. Is there anything I can do for you?"
10061-170-1 = "Today is a special day. I am full of gratitude."
10061-180-1 = "That's how I feel too."
10061-190-1 = "Thank you, Sensei."
10061-200-1 = "It's nice that someone's celebrating my birthday."
10061-210-1 = "A year has already passed. It's time to welcome the New Year."
10061-220-1 = "I wish great happiness for you in the New Year, Sensei."
10061-230-1 = "Yes. Today is special, without question."
10061-240-1 = "I hope you can feel it, too."
10061-250-1 = "The day before a festival... Those are the busiest days."
10061-260-1 = "No, I'm not saying I don't like it. The more the merrier."
10061-280-1 = "I don't want to hide anything... Not from you, of all people."
10061-290-1 = "But, in my position, it's hard for me to reveal everything..."
10061-300-1 = "Still, it is a relief just to be able to tell you"
10061-310-1 = "that I have a secret to keep."
10061-320-1 = "I know you may not understand."
10061-330-1 = "I don't expect that..."
10061-340-1 = "Nonetheless, I...I want you to accept me for who I am."
10061-350-1 = "Um... I was nervous. I thought you might not trust me once you knew..."
10061-360-1 = "I never dreamed I would get that answer, and so soon."
10061-370-1 = "I sincerely thank you, Sensei."
10061-2600-1 = "You're so generous. Thank you. I hope I can repay your kindness one day."
