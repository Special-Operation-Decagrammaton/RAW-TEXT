[translation]
10061-10-1 = "蔚藍檔案。"
10061-20-1 = "我是三一綜合學園，\n修女會所屬的歌住櫻子。\n願安寧日日與您同在。"
10061-30-1 = "這裡是\n老師加以裝飾的…"
10061-40-1 = "各式各樣的人\n都來了呢。"
10061-50-1 = "和教堂的氣氛\n相當不同呢。"
10061-60-1 = "偶爾……\n來這種地方也不錯。"
10061-70-1 = "雖然形態不同，\n依然能讓人心情平靜。"
10061-80-1 = "恭候多時了，老師。\n願祝福今天也與您同在。"
10061-90-1 = "啊，老師……\n我正在為老師\n獻上祈禱。"
10061-100-1 = "在夏萊輔佐老師……"
10061-110-1 = "因為和平常的工作不同，\n讓人有點緊張。"
10061-120-1 = "教堂的工作……是嗎？"
10061-130-1 = "沒問題的。\n我已經調整好日程了。"
10061-140-1 = "是，老師。\n如果有我能做的事，\n請儘管說……"
10061-150-1 = "無論是和教堂相關的工作，\n還是一般的業務，\n或是除此之外的事……\n請您儘管吩咐。"
10061-160-1 = "你似乎很疲倦呢。\n有沒有什麼\n我能幫忙的呢？"
10061-170-1 = "是個充滿感謝的\n特別日子呢。"
10061-180-1 = "對我來說……也是如此。"
10061-190-1 = "謝謝您，老師。"
10061-200-1 = "生日獲得祝福……\n果然是件幸福的事呢。"
10061-210-1 = "一年過去，\n迎來了新的一年。"
10061-220-1 = "希望今年對老師來說\n也會是幸福的一年。"
10061-230-1 = "是的。\n今天毫無疑問\n是個特別的日子。"
10061-240-1 = "希望也能傳達給老師。"
10061-250-1 = "慶典之日的前夕……\n是最嘈雜的一天呢。"
10061-260-1 = "不，我並不討厭。因為\n喜悅是越分享就越龐大的。"
10061-280-1 = "雖然想盡可能\n不要對老師有所隱瞞……"
10061-290-1 = "但以我的立場來說，\n要向您揭示一切有些困難──"
10061-300-1 = "不過，我認為即便只是\n「存在著祕密這個事實」……"
10061-310-1 = "能夠傳達給您，\n真是太好了。"
10061-320-1 = "我不認為能夠\n獲得您的諒解。"
10061-330-1 = "也不會有所盼望……"
10061-340-1 = "儘管如此，想把我真實的一面\n展現給您的心情……還是有的。"
10061-350-1 = "那個……這樣的我真的可以嗎，\n我也曾對此感到不安。"
10061-360-1 = "比想像中更快\n獲得答案了呢。"
10061-370-1 = "真的……\n非常謝謝您，老師。"
10061-2600-1 = "您將慈悲賜給了我呢。\n我會感激地收下的。\n希望有朝一日，\n能報答這份恩惠的那天能夠到來。"
