[translation]
20003-20-1 = "I'm Mashiro, first-year from the Justice Task Force. I may be inexperienced, but I'm here to help however I can."
20003-30-1 = "I doubt Tsurugi would like these kinds of decorations..."
20003-40-1 = "This furniture is fluffy like Hasumi's wings..."
20003-50-1 = "Tranquil like water..."
20003-60-1 = "Is Tsurugi's neck okay...?"
20003-70-1 = "I don't mind coming here every once in a while."
20003-80-1 = "How pretty... Heehee."
20003-90-1 = "Welcome, Sensei. Let's strive for justice again today."
20003-100-1 = "I've been awaiting your orders."
20003-110-1 = "Oh, are we mobilizing?"
20003-120-1 = "You called for me, Sensei?"
20003-130-1 = "The goal of the Justice Task Force..."
20003-140-1 = "...is to vanquish evil and establish justice."
20003-150-1 = "Justice—in this academy."
20003-160-1 = "I gave my word."
20003-170-1 = "I would endure brutal training and mind-numbing trials..."
20003-180-1 = "...so that I could protect justice."
20003-190-1 = "But the time I spent with my upperclassmen was so enjoyable..."
20003-200-1 = "Forgive me in advance. Everyone strays from justice from time to time."
20003-210-1 = "But I'm only saying this just in case..."
20003-220-1 = "What you're touching right now is not the operational console."
20003-230-1 = "Happy birthday, Sensei."
20003-240-1 = "I hope you feel righteous justice on your birthday."
20003-250-1 = "I see. So today is my birthday."
20003-260-1 = "It must have slipped my mind."
20003-270-1 = "Thank you for telling me."
20003-280-1 = "It's a new year. This year..."
20003-290-1 = "I will see injustice stopped once and for all."
20003-300-1 = "This is a holy day for Trinity."
20003-310-1 = "I wonder what sordid activities those Gehenna scum are up to on a day like this..."
20003-320-1 = "The festive day to celebrate all of Trinity's saints has come."
20003-330-1 = "Pumpkin ghost...? Did you have a nightmare?"
20003-350-1 = "Whew... It's unseasonably hot today."
20003-360-1 = "I can handle heat like this if that's what it takes to get the perfect shot."
20003-370-1 = "But I do hope...that I don't get too sweaty."
20003-380-1 = "I envy the other students' white uniforms on hot summer days like this."
20003-390-1 = "Sensei. You're staring at me."
20003-400-1 = "Shouldn't you keep your eyes out for the target?"
20003-2600-1 = "This is what you call true justice."
