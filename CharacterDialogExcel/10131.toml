[translation]
10131-10-1 = "ブルーアーカイブ、ですわ。"
10131-20-1 = "ごきげんよう、先生。レッドウィンター連邦学園、\n出版部所属の三善タカネと申します。\nよろしくお願い致しますわね。"
10131-30-1 = "ふむ……\nここは、雰囲気が\n良いですわね。"
10131-40-1 = "Wi-Fi、ちゃんと\n繋がりますかしら？\n早く批評をアップロー\nドしなくては……。"
10131-50-1 = "お茶をしながら物語を\n語らえる時間……素敵\nですわね。本当に。"
10131-60-1 = "（この空間……\nどのように評を書けば\n良いのでしょう……）"
10131-70-1 = "写真を\n撮っても良いの\nでしょうか……？"
10131-80-1 = "ごきげんよう、先生。\nふふっ……今日は良い日ですわ。"
10131-90-1 = "こうして先生と\nお会いできましたもの。"
10131-100-1 = "お会いできてとても\n嬉しく思っておりますわ。"
10131-110-1 = "あら、\n少々堅苦しかったでしょうか。"
10131-120-1 = "ええと……それでは……。"
10131-130-1 = "こんにちは、先生！"
10131-140-1 = "雪合戦はルール無用のもの。\nレッドウィンターでは\nよくするのですが……。"
10131-150-1 = "ただ一つだけ、\n石を入れることだけは\n禁じられているのです。"
10131-160-1 = "だって、\n当たったら痛いでしょう……？"
10131-170-1 = "え？「例の笑い方」を\n聞いてみたい……？\nえ、ええと……それは……。"
10131-180-1 = "う、うぅ……\nわ、わかりましたわ。\nそこまで仰るのなら……"
10131-190-1 = "オーホホホホ！"
10131-200-1 = "……もう\n二度といたしませんわ！"
10131-210-1 = "先生、アイスホッケーは\nお好きですか？\n私は大好きですわ！"
10131-220-1 = "連携の取れたスケーティング、\nスティックの動き……。"
10131-230-1 = "ボディチェックに\nショルダータックル、\nそして乱闘……！"
10131-240-1 = "結果に納得のいかない\nオーディエンスによる\nクーデター……！"
10131-250-1 = "あっ……\n最後のは\n聞かなかったことに……。"
10131-260-1 = "批評とは……物語を切り取り、\nその感情を自身の言葉で\n残す行為ですわ。"
10131-270-1 = "そういう意味では、写真と\n似ているかもしれませんわね。"
10131-280-1 = "ふふ、\nですから……その。"
10131-290-1 = "先生のお写真を、\n撮らせていただいても\nよろしいでしょうか？"
10131-300-1 = "時折、私を良家のお嬢様だと\n仰られる方もいますが……。"
10131-310-1 = "勘違いも甚だしいものです。"
10131-320-1 = "私は三善タカネ。\nそれ以上でも以下でも\nありませんわ！"
10131-330-1 = "え……？\n「承知いたしました。\n雪の国の姫君」……？"
10131-340-1 = "もう、先生……！"
10131-350-1 = "……？本日、ですか。\n何かありましたか？"
10131-360-1 = "何の変哲もない、\n365日のうちの1日かと。"
10131-370-1 = "ふふ。冗談ですわ、先生。"
10131-380-1 = "お誕生日、\nおめでとうございます。"
10131-390-1 = "それでは、これより……\n先生と先生が\n生まれた日についての――"
10131-400-1 = "私なりの評を\n述べさせていただきますわね。"
10131-410-1 = "本日、ですか？"
10131-420-1 = "何の変哲もない、\n365日のうちの1日かと。"
10131-430-1 = "ええ……\nそう……ですわね……。"
10131-440-1 = "うぅぅぅぅぅ……。"
10131-450-1 = "も、もうっ！\n先生もお人が悪いですわ！"
10131-460-1 = "私の誕生日……\n本気で忘れられたのかと\n思いましたわよ！？"
10131-470-1 = "誤解させた責任は、\nきっちりと\n取っていただけるのでしょうね？"
10131-480-1 = "明けましておめでとう\nございます、先生。"
10131-490-1 = "本年も\nよろしくお願いいたしますわ。"
10131-500-1 = "物語の冒頭が肝心なように、\nお正月の過ごし方ひとつで――"
10131-510-1 = "その一年が\n決まってしまうものですわ。"
10131-520-1 = "ですから……\nおみかんを一つ、\nいかがでしょう？"
10131-530-1 = "レッドウィンターのお正月では、\nこたつにみかんと\n相場が決まっておりますから。"
10131-540-1 = "クリスマス……"
10131-550-1 = "サンタクロースの\n物語は様々な場所で\n語り継がれておりますわね。"
10131-560-1 = "レッドウィンターでは\n「雪のお嬢さん」という、\nサンタクロースの\nパートナーがいるのですわ。"
10131-570-1 = "ええ、トナカイとは\n別のパートナー……。"
10131-580-1 = "ですから今日は、\n私が先生の「雪のお嬢さん」に\nなって差し上げますわ。"
10131-590-1 = "ハロウィンの\n由来を考えれば……。"
10131-600-1 = "ある意味、\nハロウィンこそ。"
10131-610-1 = "創作者にとって最大の\nインスピレーションを得られる\n日かもしれませんわね。"
10131-620-1 = "もっとも、\nそんなことはさておき。"
10131-630-1 = "私はお菓子をいただいても\n悪戯いたしますけれど？"
10131-640-1 = "えいっ！"
10131-660-1 = "先生、ご覧ください……\nオーロラですわ。"
10131-670-1 = "物語では、\n空の守護者の方々が――"
10131-680-1 = "宴を楽しむ様子が\nそう見えているのだと\n言われております。"
10131-690-1 = "いつも一緒にいられると\n思っていた方々とは"
10131-700-1 = "もう……\n二度と会えませんけれど。"
10131-710-1 = "世界はこれまで通り、\nどこまでも冷たく、\n遠いだけでしょう。"
10131-720-1 = "それでも私が\nオーロラを見上げ、\n希望を抱くのは――"
10131-730-1 = "この場所で、\n最後まで私と共にいてくださる"
10131-740-1 = "「パートナー」が\nいるからなのでしょうね。"
10131-750-1 = "ふふっ。ええ、\n今はそういう\n設定ですわ、「先生」。"
10131-760-1 = "お写真、\nよろしくお願いいたしますわね？"
10131-2600-1 = "ペンは銃よりも強し、という格言を\nご存じですか？ええ、その通りです。\nふふっ……私の批評に心ない言葉を\n寄せた方々へ――思慮深い……\n「対話」をするといたしましょう。"
