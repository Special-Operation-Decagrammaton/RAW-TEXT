[translation]
20008-10-1 = "Blue Archive"
20008-20-1 = "เจ้าหน้าที่อาวุโส สังกัดคณะกรรมการวินัยเกเฮนน่า อาโกะค่ะ\nจากนี้ไปก็ขอความร่วมมือด้วยนะคะ"
20008-30-1 = "อืม สิ่งอำนวยความสะดวกที่นี่\nก็ไม่แย่เท่าไรนะคะ"
20008-40-1 = "กำหนดการร่วมงาน\nกับทางชาเล่ต์ครั้งถัดไป..."
20008-50-1 = "ท่านประธาน\nจะได้ทานข้าวรึยังนะ?"
20008-60-1 = "ทุกอย่างดูสงบสุขมากเลยค่ะ\nถือว่าเป็นเรื่องดีนะคะ... "
20008-70-1 = "ยึดที่นี่เลยดีมั้ยนะ\nแต่ถ้าทำแบบนั้น\nท่านประธานจะลำบากสินะ\nงั้นก็ยกเลิกดีกว่าค่ะ"
20008-80-1 = "อ๊ะ คุณครูมาแล้วเหรอคะ\nถ้างั้นมาเริ่มงานกันเลยมั้ยคะ?"
20008-90-1 = "วันนี้ห้ามกลับบ้าน\nจนกว่าจะทำเสร็จนะคะ"
20008-100-1 = "อ๊ะ คุณครู...\nทำเสร็จเร็วกว่าที่คิดก็ได้นี่คะ\nถือว่าเป็นคำชมแล้วกันนะคะ"
20008-110-1 = "คุณครู... อู้งานอยู่เหรอคะ?"
20008-120-1 = "เฮ้อ ถ้าคุณครูอยู่ดึก ฉันก็จะ\nเลิกงานช้าไปด้วยนะคะ"
20008-130-1 = "งานดูไม่ค่อยคืบหน้าเลยนะคะ..."
20008-140-1 = "เฮ้อ... ช่วยไม่ได้นะคะ"
20008-150-1 = "ถ้างั้นฉันจะช่วยเองค่ะ"
20008-160-1 = "ตั้งแต่นี้ไปเวลาพักทานข้าว\nเวลาพักเบรก และพักเข้าห้องน้ำ\nฉันจะจัดตารางให้เองค่ะ"
20008-170-1 = "ไม่มีปัญหาใช่มั้ยคะ?"
20008-180-1 = "เอ๊ะ? พอจะทำก็ทำได้นี่คะ"
20008-190-1 = "เดี๋ยวนะคะคุณครู?\nหรือที่ผ่านมา...."
20008-200-1 = "ที่ผ่านมาแค่ทำตัว\nเอื่อยเฉื่อยเท่านั้นเหรอคะ...!?"
20008-210-1 = "ถ้ารู้สึกเหนื่อยก็บอกฉันได้นะคะ\nการดูแลเรื่องคุณครูเป็นหน้าที่ของฉันค่ะ"
20008-220-1 = "สุขสันต์วันเกิดค่ะ คุณครู\nฮุฮุ ฉันจัดตารางไว้ตั้งแต่อาทิตย์ก่อน\nเพื่อวันเกิดของคุณครูแล้วค่ะ"
20008-230-1 = "ฉันสัญญาว่าจะเป็นหนึ่งวัน\nที่สมบูรณ์แบบไม่เสียเปล่า\nแม้สักนาทีเลยค่ะ"
20008-240-1 = "วันเกิดฉันเหรอคะ?"
20008-250-1 = "เฮ้อ คุณครูมีตารางงาน\nที่สำคัญกว่าอยู่..."
20008-260-1 = "คะ? ไม่มีอะไรสำคัญ\nไปกว่าวันเกิดงั้นเหรอคะ?"
20008-270-1 = "ทำแบบนี้อีกแล้วนะคะ\nแต่ก็... ขอบคุณนะคะ"
20008-280-1 = "สวัสดีปีใหม่ค่ะ คุณครู"
20008-290-1 = "ถึงจะเป็นปีใหม่แต่ก็ยัง\nต้องทำงานเหมือนเดิมค่ะ\nฮุฮุ ฉันจะคอยอยู่ช่วยเองค่ะ"
20008-300-1 = "คุณครูอยากใช้เวลาใน\nคืนวันคริสต์มาสกับฉันมั้ยคะ?"
20008-310-1 = "หมายความว่าจนกว่า\nงานที่ค้างอยู่จะเสร็จ\nห้ามเลิกงานเด็ดขาดค่ะ"
20008-320-1 = "วันฮาโลวีนเป็น\nวันที่มอบขนมให้กันค่ะ"
20008-330-1 = "ในการทำงาน...\nการบริโภคน้ำตาลเป็นสิ่งจำเป็น\nคุณครูว่ายังไงคะ?"
20008-350-1 = "ฮือ.... ไม่อยากเชื่อเลย\nว่าจะเป็นแบบนี้..."
20008-360-1 = "ความอัปยศในตอนนี้\nฉันจะไม่มีวันลืมเลยค่ะ...!"
20008-370-1 = "อ๊ะ เดี๋ยวก่อนสิคะ?! แบบนี้มัน\nไม่เหมือนกับที่คุยกันไว้เลยนี่คะ!?"
20008-380-1 = "ปะ... ไปเดินเล่นเหรอคะ?\nตอนนี้เนี่ยนะ จะไปแบบนี้\nเลยเหรอคะ?"
20008-390-1 = "มันก็แน่อยู่แล้ว..."
20008-400-1 = "ขอโทษค่ะ...\nฉันดันเผลอเล่นสนุก\nตามอารมณ์เยอะไปหน่อยค่ะ"
20008-410-1 = "คะ... คือว่า... จะให้ฉันอยู่ท่านี้\nไปอีกนาน... แค่ไหนกันคะ?"
20008-2600-1 = "วิธีการพูดที่กล้าหาญแบบนี้...\nฮุฮุ ดีล่ะ ฉันก็จะแสดงให้ดูว่า\nนักเรียนตรงหน้าคุณครู\nมีความสามารถมากแค่ไหน"
