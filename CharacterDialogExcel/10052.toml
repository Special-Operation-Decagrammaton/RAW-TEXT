[translation]
10052-10-1 = "Blue Archive!"
10052-20-1 = "I am Ushio Noa, Seminar's secretary. I look forward to your support, Sensei."
10052-30-1 = "(This cafe feels like a fantasy...)"
10052-40-1 = "(It makes me want to let my worries fade away as I lose myself in the dream.)"
10052-50-1 = "I would love to have furniture like this in the Seminar lounge. Heehee."
10052-60-1 = "The way this space is structured and put together is very impressive."
10052-70-1 = "Heehee. Yuuka would love it here."
10052-80-1 = "Welcome, Sensei."
10052-90-1 = "Would you like to check today's schedule?"
10052-100-1 = "Heehee, aren't you a bit late, Sensei?"
10052-110-1 = "Look at me that way all you want, it won't make you any less tardy."
10052-120-1 = "You can, however, be less late in the future. I would appreciate it."
10052-130-1 = "(staaare)"
10052-140-1 = "Oh, don't mind me. I'm just...observing."
10052-150-1 = "Anything interesting on your mind?"
10052-160-1 = "Please let me know so I can record it immediately."
10052-170-1 = "The poetry I wrote...?"
10052-180-1 = "I submitted it to The Millennium Prize."
10052-190-1 = "Everyone read it,"
10052-200-1 = "but no one gave me their feedback."
10052-210-1 = "Strange, isn't it?"
10052-220-1 = "Yuuka is so expressive. It's never boring when she's around."
10052-230-1 = "But it means I can't help but tease her, heehee."
10052-240-1 = "Curiosity is the driving force behind scientific development, but it can also be the driving force behind distress."
10052-250-1 = "It's a bizarre sensation. Fear being dragged forward by desire..."
10052-260-1 = "Happy birthday, Sensei."
10052-270-1 = "On a calendar, it looks like just another day..."
10052-280-1 = "But for you, at least, I hope it feels even a little more special."
10052-290-1 = "I don't see much meaning into keeping track of the day of one's birth, but..."
10052-300-1 = "It's nice to be congratulated by others."
10052-310-1 = "Thank you for thinking of me."
10052-320-1 = "Happy New Year."
10052-330-1 = "I look forward to working with you this year, Sensei."
10052-340-1 = "Christmas..."
10052-350-1 = "It's not a special holiday at Millennium School,"
10052-360-1 = "but it certainly feels special today."
10052-370-1 = "If you have some time after work,"
10052-380-1 = "why don't we add dinner to tonight's schedule? Heehee."
10052-390-1 = "A special day to remember the oft forgotten dead..."
10052-400-1 = "I will need to work more diligently, so no one else is left unrecorded and forgotten."
10052-420-1 = "How strange..."
10052-430-1 = "It's different than writing on paper. It's more...exuberant."
10052-440-1 = "Records carry meaning into the future."
10052-450-1 = "But when the rain stops and the sun rises, these words will fade, just as temporary as the moment that created them."
10052-460-1 = "This glass pane is too frail to bear the weight of truth or reason."
10052-470-1 = "But...that's precisely why I like this large glass page."
10052-2600-1 = "This conversion kit is so interesting. It makes me want tinker around... Whoops."
