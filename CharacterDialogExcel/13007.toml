[translation]
13007-10-1 = "Blue Archive!"
13007-20-1 = "Nope, not gonna help... Wait. You'll feed me? What kind of food though?"
13007-30-1 = "Is there nothing...? Nothing at all to eat?"
13007-40-1 = "That reminds me, the cafe we went to was pretty good... Heh heh."
13007-50-1 = "I hear the dumplings from Hyakkiyako are, like, super good..."
13007-60-1 = "*sniff* *sniff* Hmm? That smell... Something smells amazing!"
13007-70-1 = "I've followed that sweet scent all this way. Time to find out what it is...!"
13007-80-1 = "Greetings, Sensei."
13007-90-1 = "Let's give it our all today and then cap it off with some great food!"
13007-100-1 = "Oh, there you are, Sensei! What kind of mission are we going on today?"
13007-110-1 = "You want to know what my hobby is? Reading books, of course."
13007-120-1 = "...Hey, why are you making that face?!"
13007-130-1 = "Don't tell me you see me as a little kid who only wants to fill her belly."
13007-140-1 = "You should learn to rely on me a little more."
13007-150-1 = "Do I like dango?"
13007-160-1 = "N-No! I mean, not that much. I'm just eating it because it's cheap!"
13007-170-1 = "(It's just me and Sensei? Oh...)"
13007-180-1 = "Wh-What did you just say?! There's a place with all-you-can-eat cake and pie?!"
13007-190-1 = "Let's get moving, Sensei! We need to head out ASAP!"
13007-200-1 = "Happy birthday, Sensei!"
13007-210-1 = "Today's all about you! You have my full attention!"
13007-220-1 = "So? What would you like to eat today? Beef? Fish? Chicken?!"
13007-230-1 = "Today's my birthday! You knew that, right?"
13007-240-1 = "It's not a birthday without meat!"
13007-250-1 = "A buffet would work! Anything's good, so let's get some grub!"
13007-260-1 = "Happy New Year, Sensei! Let's hurry to the shrine!"
13007-270-1 = "The gamju and rice cakes await!"
13007-280-1 = "Merry Christmas! Let's hit the streets, Sensei! The lights are all sparkling!"
13007-290-1 = "Huh? Th-This candy is mine."
13007-300-1 = "...B-But I don't mind sharing some if it's with you."
13007-320-1 = "Huh? Wh-What? Why are you looking at me like that?"
13007-330-1 = "(Seriously...)"
13007-340-1 = "We're going to the spots after we're done taking a break, right? What should we eat next?"
13007-350-1 = "Delicious! ♪"
13007-360-1 = "What?! Drink it together? Don't be silly! Do you have a death wish?"
13007-370-1 = "(Sensei must be teasing me, right? Right? There's only one straw...)"
13007-380-1 = "(But if it's with Sensei...maybe I wouldn't mind...)"
13007-390-1 = "Forget it! No juice for you!"
13007-2600-1 = "Th-Thank you, Sensei! I will cherish it... Truly!"
