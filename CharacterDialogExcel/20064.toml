[translation]
20064-10-1 = "블루 아카이브, 랍니다."
20064-20-1 = "평안하신지요, 선생님.와일드헌트 예술학원\n예술 평의회의 부회장, 운린인 우라라 입니다.\n이 만남이, 향기롭게 피어난 꽃처럼……\n아름답게 기억되길 바랍니다."
20064-30-1 = "꽃을 장식해도\n좋겠네요."
20064-40-1 = "이곳은 무척\n즐거운 향기가 나네요."
20064-50-1 = "이곳에도 뭔가……\n비밀이 있는 걸까요?"
20064-60-1 = "으음, 사색에\n잠길만한 곳은……."
20064-70-1 = "저분은……\n조금 신경을 써 두는 편이\n좋을 것 같네요."
20064-80-1 = "어서 오세요, 선생님."
20064-90-1 = "어떤 업무를\n도와드리면 될까요?"
20064-100-1 = "아, 오셨군요."
20064-110-1 = "모든 업무 준비를\n마쳐두었답니다."
20064-120-1 = "저는 누군가를\n돕는 걸 좋아해요."
20064-130-1 = "하지만 이건\n선행과는 조금 달라서……."
20064-140-1 = "그렇네요."
20064-150-1 = "자기만족이라 부르는 게\n좋을지도요."
20064-160-1 = "후후……\n부디 이 이상은\n묻지 말아 주세요."
20064-170-1 = "저는……\n누군가와 싸우는 걸\n정말로 싫어해요."
20064-180-1 = "그래서 웬만하면\n화를 내지 않으려고 한답니다."
20064-190-1 = "하지만 화가 없는 건 아니에요."
20064-200-1 = "겉으로 드러내지\n않으려 할 뿐이죠."
20064-210-1 = "되도록 그 화는\n선생님의 앞에서는\n보여드리고 싶지 않네요."
20064-220-1 = "사람은 모두, 각자의 가면……"
20064-230-1 = "페르소나를 쓰고 살아가죠."
20064-240-1 = "저처럼 연기를 하는 사람에게도,"
20064-250-1 = "페르소나란 중요한 것."
20064-260-1 = "…… 과연,\n저는 몇 개의 페르소나를\n가지고 있을까요?"
20064-270-1 = "후후…… 그냥 농담이에요."
20064-280-1 = "부디 오해 없으시길."
20064-290-1 = "연기란, 타인이 되는 것."
20064-300-1 = "그래서 눈치채지 못한 사이에,"
20064-310-1 = "배역에 잡아먹히는\n순간이 있어요."
20064-320-1 = "그렇게 되지 않도록,\n배우는 늘 배역과\n거리를 유지해야만 해요."
20064-330-1 = "저도, 매일 조심하고 있답니다?"
20064-340-1 = "지금의……\n‘운린인 우라라’라는\n위치에 휘말리지 않도록."
20064-350-1 = "선생님. 저기……"
20064-360-1 = "저에게서 장미 향기가\n느껴지나요?"
20064-370-1 = "그런가요…… 역시."
20064-380-1 = "왠지,\n여러 사람에게 듣는답니다."
20064-390-1 = "저에게서 장미 향기가 난다고."
20064-400-1 = "그다지 눈에 띄고 싶지 않은데,"
20064-410-1 = "늘 그 탓에 들켜 버려서……."
20064-420-1 = "……\n진지하게 고민하고 있다고요,\n정말."
20064-430-1 = "생신 축하합니다, 선생님."
20064-440-1 = "선물로 꽃바구니를 가져왔는데,"
20064-450-1 = "마음에 드셨으면 좋겠네요."
20064-460-1 = "후훗, 축하해 주셔서\n감사합니다, 선생님."
20064-470-1 = "…… 추억이란,\n마음속에 피는 꽃."
20064-480-1 = "그렇기에, 나중에 꽃피는 것."
20064-490-1 = "선생님께 받은 이 축복이,\n어떻게 싹트고 꽃을 피울지……"
20064-500-1 = "지금부터 기대돼요."
20064-510-1 = "선생님. 새해 복 많이 받으세요."
20064-520-1 = "앞으로 몇 달 뒤면,\n긴 겨울이 끝나고"
20064-530-1 = "꽃이 피는 계절이 오겠네요.\n벌써 무척 기대돼요."
20064-540-1 = "이 시기가 되면,\n거리에는 종소리가 울린답니다."
20064-550-1 = "모처럼이니, 함께 거리로 나가\n봉사활동에\n참가하지 않으실래요?"
20064-560-1 = "오늘은,\n장난을 치더라도\n용서받는 날…… 이죠?"
20064-570-1 = "그럼, 하루쯤은……"
20064-580-1 = "나쁜 아이를 연기해도 될까요?"
20064-600-1 = "신기하네요. 외부인의 출입을\n금지하고 있던 화원에서……"
20064-610-1 = "얼마 전까지 금지돼 있던 연극의\n대본을 이렇게 바라보고 있다니."
20064-620-1 = "교칙을 위반하는 건 아니랍니다."
20064-630-1 = "하지만 뭔가…… 나쁜 짓을\n하는 듯한 기분이 들어요."
20064-640-1 = "이 가슴의 두근거림은……\n배덕감, 인 걸까요?"
20064-650-1 = "후후……\n저, 나쁜 아이가\n되어 버린 걸지도 모르겠네요."
20064-660-1 = "…… 네. 애초에,\n저는 착한 아이가 아니에요."
20064-670-1 = "아름다운 장미에는\n가시가 있듯이……."
20064-680-1 = "저 역시, 가시를 품고 있답니다."
20064-690-1 = "아 그게……\n지금 들으신 건……."
20064-700-1 = "저와 선생님만의\n비밀…… 이에요?"
20064-710-1 = "비밀의 화원에서 나눈\n이야기, 이니까요?"
20064-2600-1 = "누군가를 다치게 할 생각은 없습니다만……\n해야만 할 때도 있는 법이죠.\n힘이 없는 정의는 그저\n환상에 불과할 뿐이니까요.\n감사합니다. 선생님."
