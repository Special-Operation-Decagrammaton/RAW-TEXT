[translation]
20064-10-1 = "ブルーアーカイブ、でございます。"
20064-20-1 = "ごきげんよう、先生。ワイルドハント芸術学院、\n芸術評議会の副会長、雲林院ウララと申します。\nこの逢瀬が、芳しく咲く花のように……\n美しく記憶に残ることを願っています。"
20064-30-1 = "花を飾っても\n良いですね。"
20064-40-1 = "ここはとても\n楽しげな\n香りがしますね。"
20064-50-1 = "ここにもなにか……\n秘密が\nあるのでしょうか？"
20064-60-1 = "ふむ、\nどこかゆっくりできる\n場所は……。"
20064-70-1 = "あの方には……\n少し気を配っておいた\nほうが良さそうです。"
20064-80-1 = "ごきげんよう、先生。"
20064-90-1 = "今日はどの業務を\nお手伝いいたしましょう？"
20064-100-1 = "あら、\nいらっしゃっていたんですね。"
20064-110-1 = "全ての準備は整っておりますよ。"
20064-120-1 = "わたくしは、\n人の手助けをするのが\n好きなんです。"
20064-130-1 = "ですが、\nそれは善行とは\nまた違っていて……。"
20064-140-1 = "そうですね、"
20064-150-1 = "自己満足とも\n言えるかもしれません。"
20064-160-1 = "ふふっ……どうか\nこれ以上は聞かないでください。"
20064-170-1 = "わたくしは……\n誰かと争うという行為が、\n本当に苦手なのです。"
20064-180-1 = "ですから、\nよほどのことがない限り、\n怒らないよう努めています。"
20064-190-1 = "といっても、怒りの感情を\n抱かないわけではありません。"
20064-200-1 = "ただ、表に\n出さないようにしているだけで。"
20064-210-1 = "できることなら、先生の前では\nお見せしないように\nしたいですね。"
20064-220-1 = "人はみな、それぞれの仮面……"
20064-230-1 = "ペルソナをかぶって\n過ごしています。"
20064-240-1 = "わたくしのように\n演技に身を投じる者にとって、"
20064-250-1 = "ペルソナは\nなくてはならないもの。"
20064-260-1 = "……果たして、\nわたくしはどれだけのペルソナを\n持っているのでしょうね？"
20064-270-1 = "ふふ……ただの戯れ言です。"
20064-280-1 = "どうか、誤解なきように。"
20064-290-1 = "演技とは、他人になりきること。"
20064-300-1 = "故に、自分を見失い、"
20064-310-1 = "役に飲み込まれる瞬間が\nあるのです。"
20064-320-1 = "そうならないよう、\n役者は常に役柄とは\n距離を保たなければなりません。"
20064-330-1 = "わたくしも、\n日々気をつけているのですよ？"
20064-340-1 = "今の……\n『雲林院ウララ』という役に、\n呑み込まれてしまわないように。"
20064-350-1 = "先生。あの……"
20064-360-1 = "わたくしから、\nバラの香りを感じますか？"
20064-370-1 = "そうですか……やはり。"
20064-380-1 = "何故か、\n色々な方から言われるのです。"
20064-390-1 = "わたくしから\nバラの香りがする、と。"
20064-400-1 = "あまり目立ちたくないのに、"
20064-410-1 = "いつもそのせいで\n気づかれてしまって……。"
20064-420-1 = "……真剣に悩んでいるんですよ、\nもう。"
20064-430-1 = "お誕生日おめでとうございます、\n先生。"
20064-440-1 = "贈り物にこちらの\nバスケットを用意しました。"
20064-450-1 = "気に入っていただけると\n嬉しいです。"
20064-460-1 = "ふふっ、祝ってくださり\nありがとうございます、先生。"
20064-470-1 = "……思い出とは、\n心の中に咲く花。"
20064-480-1 = "故に、後から花開くもの。"
20064-490-1 = "先生からいただいたこの祝福が、\nどのように\n芽吹き花を咲かせるのか……"
20064-500-1 = "今から楽しみです。"
20064-510-1 = "先生。新年、\n明けまして\nおめでとうございます。"
20064-520-1 = "あと数ヶ月もすれば、\n長い冬が終わり、"
20064-530-1 = "蕾がほころぶ季節が訪れますね。\n今からとても楽しみです。"
20064-540-1 = "この時期になると、\n街では鐘の音が響くんです。"
20064-550-1 = "せっかくですから、\n共に街へ出てボランティアに\n参加しませんか？"
20064-560-1 = "今日は、\n悪戯をしても許される日……\nなのですよね？"
20064-570-1 = "それでは、一日くらいは……"
20064-580-1 = "悪い子を演じても\n良いでしょうか？"
20064-600-1 = "不思議なものですね。\n外部の立ち入りを\n禁じている花園で――"
20064-610-1 = "つい先日まで禁じられていた、\n演劇の台本を\nこうして眺めているだなんて。"
20064-620-1 = "校則に違反している\nわけではありません。"
20064-630-1 = "ですが、なんだか……\n悪いことをしているような\n気持ちになります。"
20064-640-1 = "この胸の高鳴りは……\n背徳感、なのでしょうか？"
20064-650-1 = "ふふ……わたくし――悪い子に\nなってしまったのかも\nしれません。"
20064-660-1 = "……ええ。元より、\nわたくしは\n良い子ではありません。"
20064-670-1 = "美しいバラには\n棘があるように……。"
20064-680-1 = "わたくしだって、\n棘を持っているのです。"
20064-690-1 = "ええと……今聞いたことは――"
20064-700-1 = "わたくしと先生だけの秘密……\nですよ？"
20064-710-1 = "秘密の花園で交わした言葉、\nですからね？"
20064-2600-1 = "誰かを傷つけるのは\n本意ではありませんが……\n必要な時もあるのでしょう。力なき正義は、\nただの幻想に過ぎませんから。\nありがとうございます、先生。"
