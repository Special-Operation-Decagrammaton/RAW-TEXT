[translation]
10089-10-1 = "ブルーアーカイブ。"
10089-20-1 = "あら、今回はどんな依頼？\nそれともビジネスの提案かしら？\nまあどちらにしても……来てくれて嬉しいわ、先生。"
10089-30-1 = "あ、あの人はっ……！？\nでもここなら……\n大丈夫よね……？"
10089-40-1 = "ここの雰囲気……\n嫌いじゃないわ。"
10089-50-1 = "そろそろ大きめの\n仕事を一つ、キメたい\nところだけど……。"
10089-60-1 = "どこかにいい取引先、\nないかしら……。"
10089-70-1 = "うーん……\n今月の運営費、\nどうしよう……。"
10089-80-1 = "おかえりなさい、先生。"
10089-90-1 = "早速、仕事の話をしましょう？"
10089-100-1 = "待ってたわ。\n今日の依頼はなにかしら？"
10089-110-1 = "もちろん\nエスコートしてくれるのでしょう？"
10089-120-1 = "どんな依頼でも\n言ってちょうだい。"
10089-130-1 = "今日の私たちは……特別だもの。"
10089-140-1 = "せっかくの正装ですもの……"
10089-150-1 = "ねえ、先生、\n一緒にお出かけしましょう？"
10089-160-1 = "ど、ドレスが似合ってる……！？"
10089-170-1 = "あ、当たり前よ！\n私は社長なんだから！"
10089-180-1 = "……ふふ。"
10089-190-1 = "うぅ……このドレス、\nクリーニング代高そう……"
10089-200-1 = "う、うん！？\nべ、別に、何も言ってないわ！"
10089-210-1 = "ねえ、たまには仕事以外の\n話もしていいのよ？"
10089-220-1 = "ふふふ、\n今日はとびっきり特別な日ね……"
10089-230-1 = "覚えているに\n決まってるじゃない。"
10089-240-1 = "お誕生日、おめでとう、先生。"
10089-250-1 = "え、えっ……！？\n私の誕生日……だけど……\n覚えててくれたの！？"
10089-260-1 = "あ、あ、ありがとう……。"
10089-270-1 = "明けましておめでとう、先生。"
10089-280-1 = "言うまでもないけど、\n私たちの協力関係は続くから。\n今年もしっかり、頼むわよ。"
10089-290-1 = "私たち便利屋にとっては、\nいつもと変わらない\n日だけど……。"
10089-300-1 = "そうね、先生と一緒なら、\n意味のある日になりそうだわ。"
10089-310-1 = "街中が浮かれているわね……。"
10089-320-1 = "先生は、どう？\nパーティでも開く？"
10089-340-1 = "はぁ……\nこんなことになるなんて、\n思いもしなかったわ。"
10089-350-1 = "でも……先生の言った通り、\nこういうのも悪くはないわね。"
10089-360-1 = "正直、不思議だったのよ……"
10089-370-1 = "ちゃんとした格好の大人が、\nどうしてこんな所でわざわざ\nご飯を食べるのか……。"
10089-380-1 = "でも……\n今なら、少しわかる気がするわ。"
10089-390-1 = "それぞれ理由は違っても……"
10089-400-1 = "きっと、\nみんなこういう\n気持ちだったのかな、って。"
10089-410-1 = "……先生も、\nきっとそうなのよね。"
10089-420-1 = "ふふ……私も少しは……\n先生に近づけたのかしら？"
10089-2600-1 = "長い付き合いだもの。\n信頼してる、なんて言葉……今更よね。\nそうね……これからもよろしく、先生。\n……ええ、これだけで十分よ。"
