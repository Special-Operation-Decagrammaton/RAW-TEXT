[translation]
23005-20-1 = "奥空アヤネです。\nただ今より、先生の支援を担当します。"
23005-30-1 = "あはは…"
23005-40-1 = "これ、高そう…"
23005-50-1 = "ここにお菓子とか\n隠しておこうかな…"
23005-60-1 = "どういう原理で\n動いてるんだろう…？"
23005-70-1 = "これって大丈夫なのかな…？"
23005-80-1 = "お疲れさまです、先生。\n本日のスケジュールを\nお伝えしますね。"
23005-90-1 = "お待ちしておりました。\n先生。"
23005-100-1 = "今日はどんなお仕事を\nされますか？"
23005-110-1 = "スケジュールについては、\n私もチェックしておきますね。"
23005-120-1 = "えっ、今夜、二人っきりで\n徹夜なんですか！？"
23005-130-1 = "わ、私はその、問題ない、\nですが…。\nその、周りからの目が…。"
23005-140-1 = "…え、あっ、\nご冗談、でしたか…"
23005-150-1 = "はい。"
23005-160-1 = "お誕生日おめでとう\nございます、先生。"
23005-170-1 = "今日は誕生日パーティーに\n行かれる、ということで\nよろしいでしょうか？"
23005-180-1 = "えっ、\n私も一緒に、ですか？"
23005-190-1 = "え、あ…！\n私の誕生日、\nご存知だったんですか！？"
23005-200-1 = "あ、あぅ…\nありがとうございます…。"
23005-210-1 = "全然、\n予想していませんでした…。"
23005-220-1 = "今年もよろしく\nお願いいたします、先生。"
23005-230-1 = "先生と一緒にまた新たな\n1年を過ごせるなんて、\n嬉しいです。"
23005-240-1 = "クリスマス…。\nたまにはこういうにぎやかな\n季節も良いですね…。"
23005-250-1 = "え？一緒に、外へ？\nわ、私とですか！？"
23005-260-1 = "ハッピーハロウィーン！\nにぎやかな一日ですね、\n先生。"
23005-280-1 = "…？…先生？\nそこにいらっしゃいます、よね？"
23005-290-1 = "メガネが無いと…\nちょっとよく見えなくて。"
23005-300-1 = "え？あ、はい。確かに私、\nほとんどずっと付けて\nますもんね。"
23005-310-1 = "あ、あはは…流石に、\n顔を洗う時は外しますから。"
23005-320-1 = "な、なんだか顔が\n熱いです…。"
23005-330-1 = "先生に、恥ずかしいところを\n見られてしまって…。"
23005-340-1 = "はいっ？！か、可愛いって…\nそんな…"
23005-350-1 = "あ、あぅぅ…。"
23005-360-1 = "そ、そんなに\n見つめられますと…。"
23005-370-1 = "は…恥ずかしいです…。"
23005-2600-1 = "あはは……こんなすごいものを\n私に扱えるのかどうか分かりませんが、\nマニュアルや関連書籍を漁れば、\nどうにかなりますかね……。\nありがとうございます、先生……！"
