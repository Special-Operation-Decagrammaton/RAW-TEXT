[translation]
23005-20-1 = "I'm Okusora Ayane. You can count on my support."
23005-30-1 = "Ahaha!"
23005-40-1 = "It looks expensive..."
23005-50-1 = "Should I hide some snacks here...?"
23005-60-1 = "How does it work?"
23005-70-1 = "Is this okay...?"
23005-80-1 = "Welcome, Sensei. Allow me to go over your schedule."
23005-90-1 = "I-I've been waiting, Sensei."
23005-100-1 = "What kind of tasks are on your itinerary today?"
23005-110-1 = "I'll check the schedule too."
23005-120-1 = "Huh? We have to work all night? J-Just the two of us?"
23005-130-1 = "N-Not that I mind, but...what will the others think?"
23005-140-1 = "Oh, I see. You were just joking."
23005-150-1 = "Yeah."
23005-160-1 = "Happy birthday, Sensei."
23005-170-1 = "Shall I add a birthday party to today's schedule?"
23005-180-1 = "What? With me?"
23005-190-1 = "You knew it was my birthday?"
23005-200-1 = "Oh, wow... Thank you."
23005-210-1 = "To be honest, I wasn't expecting that..."
23005-220-1 = "I look forward to working with you this year, Sensei."
23005-230-1 = "I'm glad I get to spend another year with you."
23005-240-1 = "Christmas, huh? I suppose a festive holiday like this is okay from time to time..."
23005-250-1 = "Huh? Go out together? M-Me and you?"
23005-260-1 = "Happy Halloween! It's been so loud around here, Sensei."
23005-280-1 = "Huh? Sensei? Are you there?"
23005-290-1 = "I can hardly see... Everything is so blurry."
23005-300-1 = "Huh? Oh. Well, yeah. I normally don't have a reason to take them off."
23005-310-1 = "A-Ahaha... I pretty much only take them off in the shower."
23005-320-1 = "Great. I can tell I'm blushing..."
23005-330-1 = "I just keep embarrassing myself in front of you..."
23005-340-1 = "Huh?! Y-You think it's cute? I don't know what you're talking about..."
23005-350-1 = "U-Ugh..."
23005-360-1 = "P-Please, don't look at me like that..."
23005-370-1 = "Y-You're embarrassing me..."
23005-2600-1 = "Hahaha... I don't know if I can handle something like this very well, but...I'm sure it'll work out somehow if I look at manuals and stuff, right? Thank you!"
