[translation]
26003-20-1 = "Is anyone in need of first aid? I would be happy to help."
26003-30-1 = "Does anyone need first aid?"
26003-40-1 = "It warms my heart just looking at this place."
26003-50-1 = "A patient would be able to make a speedy recovery in a place like this."
26003-60-1 = "I don't think it's a bad thing to relax like this every now and then."
26003-70-1 = "Oh... What a beautiful shade of pink."
26003-80-1 = "Welcome, Sensei. How are you feeling today?"
26003-90-1 = "I've been waiting for you, Sensei. As always, let's work toward creating a peaceful world together!"
26003-100-1 = "Oh, a new patient?"
26003-110-1 = "You look tired. Would you like me to massage your shoulders?"
26003-120-1 = "Fatigue is the root of many illnesses, so don't push yourself too hard."
26003-130-1 = "It always breaks my heart to think about the patients who are suffering."
26003-140-1 = "I can't forgive those who would trample on the peace we have!"
26003-150-1 = "Happy birthday, Sensei! I hope your day is filled with warmth and joy!"
26003-160-1 = "Thank you for remembering my birthday. Oh? A birthday gift?"
26003-170-1 = "Your smiling face is enough for me!"
26003-180-1 = "Happy New Year! Be sure to bundle up so you don't ring in the new year with a cold!"
26003-190-1 = "Merry Christmas, Sensei. Even if just for one day, I hope people can stop fighting and enjoy a wonderful peace."
26003-200-1 = "I got some Halloween candy!"
26003-210-1 = "I love sweets, but if I eat too many, I'll earn myself a trip to the dentist..."
26003-230-1 = "Honestly, Sensei..."
26003-240-1 = "I was just really surprised."
26003-250-1 = "I'm not sure how to react..."
26003-260-1 = "I've never received something like this... I feel a bit bashful about it. Is that normal?"
26003-270-1 = "Really..."
26003-280-1 = "I've never met anyone quite like you before."
26003-290-1 = "I'm sorry. To be honest, I'm at a loss for words..."
26003-300-1 = "All I can say is... Thank you! I'm so happy!"
26003-310-1 = "...I am truly grateful, Sensei."
26003-320-1 = "This feeling... It's all thanks to you."
26003-2600-1 = "Don't run away just because the shot hurts!"
