10098-140-1 = "I always carry candy around with me. Sugar levels matter! Sensei, do you need one too?"
10098-150-1 = "Ugh... Argh."
10098-160-1 = "Excuse me, Sensei. Could you massage my shoulders?"
10098-170-1 = "Wearing this is making me feel stiff."
10098-180-1 = "Standing with your back to the wall is fundamental in indoor warfare!"
10098-190-1 = "Right there, just like that. It's quite useful, so keep it in mind!"
