10098-10-1 = "Blue Archive."
10098-20-1 = "Oh my... Things have snowballed! This... I'm going to have to help."
10098-30-1 = "(Cover...check. Exit...check.)"
10098-40-1 = "Should I check the ammo first?"
10098-50-1 = "Eh... I don't feel comfortable... I might miss Sensei at times like these..."
