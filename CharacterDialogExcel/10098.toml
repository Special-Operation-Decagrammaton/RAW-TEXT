10098-70-1 = "I...don't feel like taking a nap today."
10098-80-1 = "Ooh, Sensei! Good work!"
10098-90-1 = "How was the trip here? Did anyone follow you?"
10098-100-1 = "Good luck with your work day, Sensei."
10098-110-1 = "This old-timer will be watching."
