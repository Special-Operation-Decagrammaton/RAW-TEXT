[translation]
10054-10-1 = "Blue Archive!"
10054-20-1 = "ฝึกฝนร่างกายให้สดใส\nเพื่อฝึกฝนจิตใจให้บริสุทธิ์...\nขอให้พรคุ้มครองคุณค่ะ..."
10054-30-1 = "ว้าว... ที่นี่\nสวยจังเลยค่ะ"
10054-40-1 = "มีใครที่ต้องการ...\nความช่วยเหลือมั้ยคะ?"
10054-50-1 = "มาพักกันสักหน่อย\nแล้วค่อยไปกันดีมั้ยคะ?"
10054-60-1 = "รู้สึกเหมือนร่างกาย\nเบากว่าปกติเลยค่ะ\n..."
10054-70-1 = "ฮิฮิ..."
10054-80-1 = "มาแล้วเหรอคะคุณครู!"
10054-90-1 = "ฉันจะสวดภาวนา\nให้วันนี้เป็นวันที่ดีของคุณครูค่ะ"
10054-100-1 = "เชิญเลยค่ะคุณครู"
10054-110-1 = "ฉันเตรียมน้ำดื่มเย็นๆ ไว้ให้แล้วค่ะ"
10054-120-1 = "ถ้าคุณครูสะดวก\nสนใจดื่มสักหน่อยมั้ยคะ?"
10054-130-1 = "วันนี้ฉันมาทำหน้าที่นี้"
10054-140-1 = "ไม่ใช่ในฐานะซิสเตอร์\nแต่ในฐานะนักกีฬาคนหนึ่งค่ะ"
10054-150-1 = "หรือเป็นเพราะไม่ได้\nใส่ชุดซิสเตอร์กันนะ..."
10054-160-1 = "เลยรู้สึกกระวนกระวายใจนิดหน่อยค่ะ"
10054-170-1 = "คุณครู..."
10054-180-1 = "ถ้าคุณครูสะดวกละก็...\nช่วยอยู่ข้างๆ ฉันหน่อยได้มั้ยคะ?"
10054-190-1 = "ขอให้พรคุ้มครอง...\nคุณครูด้วยเถอะ"
10054-200-1 = "การสวดอธิษฐาน\nไม่เกี่ยวกับชุดที่ใส่หรอกค่ะ"
10054-210-1 = "ชุดนี้มันเผยสัดส่วน\nมากกว่าชุดที่ใส่ปกติ..."
10054-220-1 = "ก็เลยค่อนข้าง\nเขินๆ นิดหน่อยน่ะค่ะ..."
10054-230-1 = "สุขสันต์วันเกิดค่ะคุณครู!"
10054-240-1 = "คุณครูมีของขวัญที่อยากได้\nอยู่รึเปล่าคะ?"
10054-250-1 = "ฮะ... แฮปปี้เบิร์ธเดย์...?\nวันเกิดฉัน... งั้นเหรอคะ?"
10054-260-1 = "ว้าว...\nขะ... ขอบคุณมากค่ะ...!"
10054-270-1 = "ขอให้มีความสุขในวันปีใหม่ค่ะ\nคุณครู!"
10054-280-1 = "ปีนี้เราก็มาออกกำลังกาย\nด้วยกันดีมั้ยคะ?"
10054-290-1 = "คืนนี้เป็นคืนศักดิ์สิทธิ์ค่ะ"
10054-300-1 = "ถ้าคุณครูสะดวกละก็\nมาสวดอธิษฐานด้วยกันมั้ยคะ?"
10054-310-1 = "วันแห่งความวุ่นวายสินะคะ"
10054-320-1 = "แต่ไม่รู้ทำไมฉันถึง\nรู้สึกสนุกไปด้วยค่ะ"
10054-340-1 = "แฮ่ก... แฮ่ก...\nขอโทษค่ะคุณครู..."
10054-350-1 = "ฉันไม่ได้... ฮู่ว..."
10054-360-1 = "อยากให้คุณครูเห็นสภาพแบบนี้เลย..."
10054-370-1 = "ขอโทษนะคะ...\nก่อนอื่นต้องทำให้ใจเย็นๆ ก่อน..."
10054-380-1 = "ฮู่ว... ฮู่ว..."
10054-390-1 = "คะ...!? คือว่าที่จริง\nฉันไม่ได้หมายถึงแบบนั้น...!"
10054-400-1 = "คะ... แค่คุณครูอยากช่วย\nฉันก็รู้สึกขอบคุณมากแล้วค่ะ..."
10054-410-1 = "ค่ะ..."
10054-420-1 = "(คุณครู...\nเป็นห่วงฉันงั้นเหรอ...)"
10054-430-1 = "(ฉันไม่เคยคิด\nเรื่องแบบนี้มาก่อนเลย)"
10054-440-1 = "คือ..."
10054-450-1 = "เรื่องพวกนี้ ฉันไม่รู้\nว่าควรบอกคุณครูดีรึเปล่า.."
10054-460-1 = "มันเหมือน...\nฉันยึดคุณครูเอาไว้คนเดียว..."
10054-470-1 = "แบบนี้อาจถูกพระเจ้าลงโทษ\nก็ได้นะคะ แต่ว่า..."
10054-480-1 = "ตอนนี้ ฉันน่ะ...\nมีความสุขมากๆ เลยค่ะ!"
10054-2600-1 = "ขอให้อาวุธเล็กๆ อันนี้\nนำมาซึ่งความสงบสุข\nเหมือนกับปืนที่ให้สัญญาณออกวิ่ง..."
