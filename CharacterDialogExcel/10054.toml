[translation]
10054-10-1 = "ブルーアーカイブ！"
10054-20-1 = "健全な精神を育成するべく\n肉体を育む……\nその行く道にご加護があらんことを。"
10054-30-1 = "わぁ……\n素敵な場所ですね。"
10054-40-1 = "手助けが必要な方は……\nいらっしゃる\nでしょうか？"
10054-50-1 = "ひと休み\nしていきましょうか？"
10054-60-1 = "いつもより身体が\n軽い気がします……。"
10054-70-1 = "……ふふっ。"
10054-80-1 = "おかえりなさいませ、先生！"
10054-90-1 = "本日も素敵な一日と\nなりますよう、祈っております。"
10054-100-1 = "おかえりなさい、先生。"
10054-110-1 = "冷たいお水をご用意しました。"
10054-120-1 = "よろしければいかがでしょう？"
10054-130-1 = "今日はシスターではなく、"
10054-140-1 = "一人の選手としてこの業務を\n務めさせていただきます。"
10054-150-1 = "普段の格好と\n違うからか……"
10054-160-1 = "なんだか\n落ち着かないですね。"
10054-170-1 = "先生……"
10054-180-1 = "その、もしよろしければ、\nおそばにいてもいいですか？"
10054-190-1 = "先生にどうか\nご加護があらんことを。"
10054-200-1 = "……お祈りに\n服装は関係ありませんよ？"
10054-210-1 = "普段より\n色々見える格好なので……"
10054-220-1 = "少し恥ずかしい気も、\nします……。"
10054-230-1 = "お誕生日\nおめでとうございます、先生。"
10054-240-1 = "何か欲しいものはありますか？"
10054-250-1 = "た、誕生日祝い、\nですか……？私の……？"
10054-260-1 = "わぁ……\nありがとうございます……！"
10054-270-1 = "明けまして\nおめでとうございます、先生。"
10054-280-1 = "今年も……一緒に\n運動なんていかがでしょうか？"
10054-290-1 = "聖なる夜ですね。"
10054-300-1 = "よろしければ、\n一緒にお祈りを捧げませんか？"
10054-310-1 = "賑やかな日ですね。"
10054-320-1 = "なんだか\n私まで楽しくなってきます。"
10054-340-1 = "はぁ、はぁ……\nすみません、先生……。"
10054-350-1 = "こんな姿を……はぁ……"
10054-360-1 = "お見せするつもりでは\nなかったのですが……。"
10054-370-1 = "すみません、まずは……\n落ち着いてから、続きを……。"
10054-380-1 = "はぁ……ふぅ……。"
10054-390-1 = "えっ……！？\nあっ、その、\n別にそういう意味では……！"
10054-400-1 = "お、お言葉だけでも\nとてもありがたいです……"
10054-410-1 = "ええ……。"
10054-420-1 = "（先生が……私のことを気に\nかけてくださるなんて……）"
10054-430-1 = "（そんな事、思いも\nしておりませんでした……）"
10054-440-1 = "あの……"
10054-450-1 = "こんな事を、口にして良いのか\n分かりませんが……。"
10054-460-1 = "先生を\n独り占めしているみたいで……"
10054-470-1 = "こんな事、\n罰があたってしまうかも\nしれません……でも、"
10054-480-1 = "私……この時間が、\nとても幸せ……なんです……。"
10054-2600-1 = "試合の始まりを知らせる銃声のように、\nどうかこの小さな武器も、\n平和のためのものでありますよう……。"
