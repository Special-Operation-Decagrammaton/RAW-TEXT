[translation]
20058-10-1 = "Blue Archive!"
20058-20-1 = "ยะฮู้ว~ ฉัน ฮาทามิ เอริกะ\nชั้นปีที่ 2 จากสถาบันเกเฮนน่า ขอฝากตัวด้วยนะ"
20058-30-1 = "ว้าย? มีคนอยู่เยอะเลยนี่นา\nหรือว่าเป็นแบบนี้อยู่แล้วนะ?"
20058-40-1 = "ถ้าได้อยู่กับคุณครู\nต้องสนุกแน่เลย"
20058-50-1 = "นี่คือรสนิยมของคุณครูเหรอ?"
20058-60-1 = "(ของชิ้นนี้ของใครน่ะ?)"
20058-70-1 = "หืม? มีใคร...\nมาเฝ้าดูอยู่งั้นเหรอ?"
20058-80-1 = "ยะฮู้ว คุณครู♪\nฉันกำลังรออยู่เลย"
20058-90-1 = "เข้ามาสิ! คิดถึงจังเลย"
20058-100-1 = "(เมื่อกี้ฉันพูดอะไรออกไปเนี่ย...?)"
20058-110-1 = "วันนี้เป็นเวรของฉัน\nถ้ามีอะไรให้ช่วยก็บอกเลยนะ!"
20058-120-1 = "คุณครู ขยันทำงานเลยนะเนี่ย\nทั้งๆ ที่ดูไม่เป็นอย่างนั้นแท้ๆ"
20058-130-1 = "ฮุฮุ... ผู้ใหญ่ที่โฟกัสกับงานนี่\nเท่จังเลยนะ~"
20058-140-1 = "ฉันก็แค่คิดแบบนั้นน่ะ"
20058-150-1 = "ทำไมคุณครูถึง\nมาเป็น 'คุณครู' เหรอ?"
20058-160-1 = "ฉันแค่สงสัยน่ะ..."
20058-170-1 = "เพราะมีสิ่งที่ต้องปกป้อง..."
20058-180-1 = "อย่างนั้นเหรอ"
20058-190-1 = "ถ้างั้นก็...\nจะปกป้องฉันด้วยมั้ย?"
20058-200-1 = "อ่า เอกสารตรงนี้\nเคลียร์เสร็จหมดแล้ว"
20058-210-1 = "เอาเรื่องอยู่เหมือนกันนะเนี่ย"
20058-220-1 = "แต่ถ้าฉันช่วยคุณครูได้\nยังไงก็ไหวอยู่แล้ว"
20058-230-1 = "หืม? ลายเสือดาวเหรอ?\nก็ต้องชอบอยู่แล้วละ"
20058-240-1 = "นอกจากปืนแล้ว\nฉันก็มีอย่างอื่น\nที่เป็นลายเสือดาวเหมือนกัน♪"
20058-250-1 = "ของลายเสือดาวชิ้นอื่น\nที่อยากได้งั้นเหรอ?"
20058-260-1 = "ฮุฮุ... ไม่บอกหรอก♪"
20058-270-1 = "คุณครู สุขสันต์วันเกิด!"
20058-280-1 = "ขอให้วันนี้มีความสุข\nมากกว่าใครในโลกเลย!"
20058-290-1 = "เอ๋... จำวันเกิด\nฉันได้ด้วยเหรอ?"
20058-300-1 = "คุณครูนี่นะ\nบาปหนาจริงๆ เลย"
20058-310-1 = "มาทำให้ตั้งตารอแบบนี้...\nจะเอายังไงกันแน่?"
20058-320-1 = "สวัสดีปีใหม่นะ คุณครู!\nหวังว่าปีนี้\nจะสร้างความทรงจำ\nได้มากกว่าปีก่อนนะ!"
20058-330-1 = "คริสต์มาสเป็นวันที่ดีนะ"
20058-340-1 = "มันแบบ รู้สึกใจมันฟูๆ~\nยังไงบอกไม่ถูก\nแอบใจเต้นตึกตักด้วย"
20058-350-1 = "เป็นความรู้สึกว่า\nวันนี้เป็นวันพิเศษ...\nถึงจะแค่ได้อยู่ด้วยกันก็ตาม"
20058-360-1 = "แง่ง~! ถ้าไม่ยอมให้ขนม\nฉันจะจับกินซะเลย!"
20058-370-1 = "เอาละ สู้เขานะ\nจะได้ไม่โดนจับกิน"
20058-390-1 = "เข้ามาสิ คุณครู"
20058-400-1 = "ที่นี่คือฐานลับประจำของฉัน"
20058-410-1 = "เป็นที่ที่ฉันจะแวะมา\nตอนต้องการเวลาส่วนตัวน่ะ"
20058-420-1 = "ฮุฮุ แต่มันอาจจะกว้างขวาง\nเกินกว่าจะเรียกว่าฐานลับก็ได้"
20058-430-1 = "ฉันแค่...\nอยากแบ่งปันกับคุณครูน่ะ"
20058-440-1 = "ทั้งทิวทัศน์ที่ฉันได้เห็น...\nบรรยากาศที่ฉันได้สัมผัส"
20058-450-1 = "ถ้าถามหาเหตุผลละก็\nฉันคงตอบไม่ได้..."
20058-460-1 = "แต่ก็นั่นสินะ...\nก็การบอกสถานที่ลับให้รู้"
20058-470-1 = "คือหลักฐาน\nที่แสดงว่าพิเศษนี่นา"
20058-480-1 = "ก็เพราะคุณครู\nเป็นคนพิเศษของฉัน"
20058-490-1 = "ฮุฮุ..."
20058-500-1 = "ที่นี่เงียบดีใช่มั้ยล่ะ?"
20058-510-1 = "แต่ว่า... หัวใจของฉัน\nมันอาจจะส่งเสียงดังนิดหน่อยก็ได้"
20058-2600-1 = "เอ๋ จำได้ด้วยเหรอว่าฉันชอบอะไร?\nฮะฮ่า ขอบคุณอยู่เสมอเลยนะ\nงั้นฉันต้อง... ตอบแทนด้วยสิเนอะ?"
