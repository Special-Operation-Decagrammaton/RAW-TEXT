[translation]
10152-10-1 = "ブルーアーカイブ、アンド・ピース。"
10152-20-1 = "ワイルドハント芸術学院、オカルト研究会の\n椎名ツムギです。ええ、ギターは持っていますよ――\n「ラブ・アンド・ピース」。……は大事ですから。"
10152-30-1 = "ふふっ、ここで\nライブを\nしてみたいですね。"
10152-40-1 = "あの飾り……\n打楽器に\n使えそうですね。"
10152-50-1 = "この辺りなら\n「お菓子の家」を\n作れそうです。"
10152-60-1 = "BGMを流すなら……\nデスメタルが\nぴったりですね"
10152-70-1 = "ここは、みなさんの\n思い出が宿る場所……\n私にとっても、\nそうかもしれません。"
10152-80-1 = "こんにちは、先生。\n今日も私の芸術に――\nお付き合いください。"
10152-90-1 = "ふふっ、心弾む一日に\nなりそうです。"
10152-100-1 = "……先生も、\nそう思いませんか？"
10152-110-1 = "音楽は魂の共通言語……\nそう言われています。"
10152-120-1 = "言葉を交わさずとも、\n互いの心に触れ合うことが\nできますから。"
10152-130-1 = "では、一曲――\n聞いていただけますか？"
10152-140-1 = "人魚姫は、\n愛する人のために自らの\n声を差し出しました。"
10152-150-1 = "ええ、\nそれはあまりに気高く\n――美しい決断です。"
10152-160-1 = "ふふっ……私にもいつか、\nそれほどの感情を\n抱ける方が現れるのでしょうか？"
10152-170-1 = "意外と、童話の\nオリジナルは残酷な\n物語が多いんです。"
10152-180-1 = "当時、子どものために\n紡がれたものでは\nなかったからなのでしょう。"
10152-190-1 = "芸術とはそういうもの……\n時代の潮流によって\nいかようにでも\n形を変えるのです。"
10152-200-1 = "先生にとってのデスメタルとは、\nどのようなものですか？"
10152-210-1 = "私にとっては――"
10152-220-1 = "――「人生」。\n……でしょうか。"
10152-230-1 = "デスメタルに触れてから、\n私の物語に色が\n増えたのですから。"
10152-240-1 = "もちろん、\n良い意味ですよ？ふふっ。"
10152-250-1 = "デスメタルをはじめた\nきっかけ……ですか？"
10152-260-1 = "ふふっ、内緒です。"
10152-270-1 = "誰にだって、\n一つや二つくらいあるでしょう？"
10152-280-1 = "――「聖域」に\n隠した謎、が。"
10152-290-1 = "お誕生日おめでとう\nございます、先生。"
10152-300-1 = "先生のためのバースデーソング"
10152-310-1 = "――ええ、ありきたりな\nものであってはいけません。"
10152-320-1 = "私の方でアレンジ\nしてみたのですが……\n聞いていきますか？"
10152-330-1 = "よく、友人の誕生日に\n歌を歌っているのですが……。"
10152-340-1 = "先生は、どのようにお祝いを\nなさるのですか？"
10152-350-1 = "よければ……私のために、\n歌っていただけませんか？"
10152-360-1 = "まるで何も書き込まれていない\nスコアのような日、ですね。"
10152-370-1 = "あけまして\nおめでとうございます、先生。"
10152-380-1 = "私とこの楽譜に――新たな音を\n刻んでいきましょう。"
10152-390-1 = "今年の楽章も、そろそろ終わりが\n近づいてきましたね。"
10152-400-1 = "先生の一年は、\nどんな旋律でしたか？"
10152-410-1 = "明るいものであったなら……\n私も嬉しいです。"
10152-420-1 = "今日ほど、デスメタルが\n似合う日もないと思います。"
10152-430-1 = "では、始めましょうか。\n戻ってきた魂に捧げる、\n鎮魂歌を。"
10152-450-1 = "誰の心にだって、\n闇は存在するもの。"
10152-460-1 = "それぞれ悩みを抱え、\n迷い――道を歩んでいる。"
10152-470-1 = "――私も、そうです。"
10152-480-1 = "この道で良いのか、と。\n悩む時もあります。"
10152-490-1 = "そんな私に、\n先生は言ってくれましたよね。"
10152-500-1 = "私が自由に――後悔のない日々を\n過ごせるよう、支える、と。"
10152-510-1 = "ですから、先生は……。"
10152-520-1 = "――「私の闇を照らす光」\nだったのです。"
10152-530-1 = "私の光であるあなたへ、\nこの曲を捧げましょう。"
10152-540-1 = "感謝を込めた、旋律を……\n聞いてください。"
10152-2600-1 = "ありがとうございます、先生。\nこの子がいれば、\nどこでも演奏会が開けそうです。\n平和へと導く――煉獄の旋律を。"
