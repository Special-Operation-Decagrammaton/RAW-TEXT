[translation]
10152-10 = "블루 아카이브, 앤 피스."
10152-20 = "와일드헌트 예술학원, 오컬트 연구회의\n 시이나 츠무기예요. 네, 기타는 가지고 있어요.\n '러브 앤 피스'.……는 중요하니까요."
10152-30 = "후후, 다음엔 여기서\n라이브를 해볼까요?"
10152-40 = "저 장식…… 타악기로\n쓸 수 있겠네요."
10152-50 = "과자의 집을 만든다면\n이쪽이 좋겠네요."
10152-60 = "이곳과 어울리는\n배경음악은…… 일단\n데스메탈?"
10152-70 = "많은 분의 추억이\n깃든 장소네요.\n물론, 저의 추억도."
10152-80 = "안녕하세요, 선생님.\n오늘도 저의 음악과 \n함께 하실래요?"
10152-90 = "후후, 오늘도 즐거운\n하루네요."
10152-100 = "그렇죠?"
10152-110 = "음악은 영혼의\n공통 언어…… 라는\n 말이 있어요."
10152-120 = "대화를 나누지 않아도,\n충분히 서로를\n느낄 수 있으니까요."
10152-130 = "그런 의미에서,\n한 곡 시작해 볼까요?"
10152-140 = "인어공주는, 사랑하는\n사람을 위해 자신의\n목소리를 바쳤어요."
10152-150 = "네, 그것은 너무나도\n숭고하고…… 아름다운\n결단이에요."
10152-160 = "후후…… 저에게도 언젠가,\n 그런 감정을 품을 수 있는 분이\n나타날까요?"
10152-170 = "옛 동화는, 생각보다\n잔혹한 내용이\n많았어요."
10152-180 = "당시엔 이야기의\n대상이 어린아이가\n아니었거든요."
10152-190 = "예술이란 그런 거랍니다.\n시대에 따라\n유연하게 변해가죠."
10152-200 = "선생님에게 데스메탈이란,\n어떤 것인가요?"
10152-210 = "저에게는—"
10152-220 = "—'인생'.\n……이려나요."
10152-230 = "데스메탈을 접하고 나서,\n저의 이야기에\n색이 더해졌으니까요."
10152-240 = "후후, 물론 긍정적인\n방향으로요."
10152-250 = "제가 데스메탈을\n시작한 이유라……."
10152-260 = "그건 비밀로 해두고 싶네요."
10152-270 = "누구에게나 하나쯤은\n있는 법이잖아요?"
10152-280 = "……'성역'에\n숨겨둔 비밀이."
10152-290 = "생일 축하해요, 선생님."
10152-300 = "선생님을 위한\n생일 노래는……"
10152-310 = "네, 평범한 것이어서는\n안 되죠."
10152-320 = "제가 편곡해 봤는데,\n들어볼래요?"
10152-330 = "저는 가까운 분들의\n생일엔 항상 축하 노래를\n불러 준답니다."
10152-340 = "선생님은 어떠신가요?"
10152-350 = "저를 위한 노래,\n불러 주실 수 있나요?"
10152-360 = "마치 아무것도 적혀있지 않은\n악보 같은 날이네요."
10152-370 = "새해 복 많이 받으세요,\n선생님."
10152-380 = "저와 함께 이 악보에\n새로운 소리를 새겨 나가요."
10152-390 = "올해의 악보도 슬슬\n끝을 맺어가네요."
10152-400 = "선생님의 일 년은,\n어떤 선율이었나요?"
10152-410 = "밝은 쪽이었다면……\n저도 기쁠 거예요."
10152-420 = "저는 오늘만큼\n데스메탈이 어울리는\n날도 없다고 생각해요."
10152-430 = "그럼, 시작해 볼까요.\n돌아온 영혼에게\n바치는, 진혼가를."
10152-450 = "누구나 마음 어딘가엔,\n어둠이 존재하는 법."
10152-460 = "저마다 고민을 껴안고,\n방황하며……\n길을 걸어가고 있죠."
10152-470 = "……저도, 그래요."
10152-480 = "이 길이 맞을까 하고,\n고민할 때도 있답니다."
10152-490 = "그런 저에게, 선생님께서\n말씀해 주셨어요."
10152-500 = "제가 자유로이,\n후회 없는 나날을\n보낼 수 있게 돕겠다고."
10152-510 = "그러니까, 선생님은……."
10152-520 = "'저의 어둠을 밝히는 빛'\n이었던 거예요."
10152-530 = "저의 빛이 되어준 당신에게,\n이 곡을 바칩니다."
10152-540 = "감사를 담은 선율을……\n들어주세요."
10152-2600 = "감사합니다, 선생님.이 아이가 있으면,\n어디서든 연주회를 열 수 있을 것 같아요.\n평화로 이끄는…… 연옥의 선율을."
