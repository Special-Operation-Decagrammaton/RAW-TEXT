[translation]
10152-10 = "ブルーアーカイブ、アンド・ピース。"
10152-20 = "ワイルドハント芸術学院、オカルト研究会の\n椎名ツムギです。ええ、ギターは持っていますよ――\n「ラブ・アンド・ピース」。……は大事ですから。"
10152-30 = "ふふっ、ここで\nライブを\nしてみたいですね。"
10152-40 = "あの飾り……\n打楽器に\n使えそうですね。"
10152-50 = "この辺りなら\n「お菓子の家」を\n作れそうです。"
10152-60 = "BGMを流すなら……\nデスメタルが\nぴったりですね"
10152-70 = "ここは、みなさんの\n思い出が宿る場所……\n私にとっても、\nそうかもしれません。"
10152-80 = "こんにちは、先生。\n今日も私の芸術に――\nお付き合いください。"
10152-90 = "ふふっ、心弾む一日に\nなりそうです。"
10152-100 = "……先生も、\nそう思いませんか？"
10152-110 = "音楽は魂の共通言語……\nそう言われています。"
10152-120 = "言葉を交わさずとも、\n互いの心に触れ合うことが\nできますから。"
10152-130 = "では、一曲――\n聞いていただけますか？"
10152-140 = "人魚姫は、\n愛する人のために自らの\n声を差し出しました。"
10152-150 = "ええ、\nそれはあまりに気高く\n――美しい決断です。"
10152-160 = "ふふっ……私にもいつか、\nそれほどの感情を\n抱ける方が現れるのでしょうか？"
10152-170 = "意外と、童話の\nオリジナルは残酷な\n物語が多いんです。"
10152-180 = "当時、子どものために\n紡がれたものでは\nなかったからなのでしょう。"
10152-190 = "芸術とはそういうもの……\n時代の潮流によって\nいかようにでも\n形を変えるのです。"
10152-200 = "先生にとってのデスメタルとは、\nどのようなものですか？"
10152-210 = "私にとっては――"
10152-220 = "――「人生」。\n……でしょうか。"
10152-230 = "デスメタルに触れてから、\n私の物語に色が\n増えたのですから。"
10152-240 = "もちろん、\n良い意味ですよ？ふふっ。"
10152-250 = "デスメタルをはじめた\nきっかけ……ですか？"
10152-260 = "ふふっ、内緒です。"
10152-270 = "誰にだって、\n一つや二つくらいあるでしょう？"
10152-280 = "――「聖域」に\n隠した謎、が。"
10152-290 = "お誕生日おめでとう\nございます、先生。"
10152-300 = "先生のためのバースデーソング"
10152-310 = "――ええ、ありきたりな\nものであってはいけません。"
10152-320 = "私の方でアレンジ\nしてみたのですが……\n聞いていきますか？"
10152-330 = "よく、友人の誕生日に\n歌を歌っているのですが……。"
10152-340 = "先生は、どのようにお祝いを\nなさるのですか？"
10152-350 = "よければ……私のために、\n歌っていただけませんか？"
10152-360 = "まるで何も書き込まれていない\nスコアのような日、ですね。"
10152-370 = "あけまして\nおめでとうございます、先生。"
10152-380 = "私とこの楽譜に――新たな音を\n刻んでいきましょう。"
10152-390 = "今年の楽章も、そろそろ終わりが\n近づいてきましたね。"
10152-400 = "先生の一年は、\nどんな旋律でしたか？"
10152-410 = "明るいものであったなら……\n私も嬉しいです。"
10152-420 = "今日ほど、デスメタルが\n似合う日もないと思います。"
10152-430 = "では、始めましょうか。\n戻ってきた魂に捧げる、\n鎮魂歌を。"
10152-450 = "誰の心にだって、\n闇は存在するもの。"
10152-460 = "それぞれ悩みを抱え、\n迷い――道を歩んでいる。"
10152-470 = "――私も、そうです。"
10152-480 = "この道で良いのか、と。\n悩む時もあります。"
10152-490 = "そんな私に、\n先生は言ってくれましたよね。"
10152-500 = "私が自由に――後悔のない日々を\n過ごせるよう、支える、と。"
10152-510 = "ですから、先生は……。"
10152-520 = "――「私の闇を照らす光」\nだったのです。"
10152-530 = "私の光であるあなたへ、\nこの曲を捧げましょう。"
10152-540 = "感謝を込めた、旋律を……\n聞いてください。"
10152-2600 = "ありがとうございます、先生。\nこの子がいれば、\nどこでも演奏会が開けそうです。\n平和へと導く――煉獄の旋律を。"
