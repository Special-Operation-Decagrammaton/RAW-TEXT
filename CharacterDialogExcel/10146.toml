[translation]
10146-10 = "嘻嘻嘻……蔚藍檔案。"
10146-20 = "唉……太過優秀的人，\n連片刻的休息都不被允許啊。\n就讓我真琴大人助你一臂之力吧，老師。"
10146-30 = "在萬魔殿也放個\n一樣的吧。"
10146-40 = "呵。看來是被真琴大人的\n氣場震懾住了呢。"
10146-50 = "這也是與生俱來的\n天賦嗎？"
10146-60 = "老師他，為什麼偏愛\n這種狹窄的地方……？"
10146-70 = "在海邊蓋座\n萬魔殿的分館也不錯。"
10146-80 = "啊啊，我一直在等你。"
10146-90 = "能讓我真琴大人等待的人，\n大概也只有老師了吧。"
10146-100 = "……請對自己擁有\n多大的權力抱有自覺。"
10146-110 = "嘻嘻！你來啦，老師！"
10146-120 = "嚇了一跳吧？\n嗯──因為今天並非\n真琴大人值班的日子。"
10146-130 = "問我為什麼來？那是──"
10146-140 = "何必在意那種小事？\n來，開始今天的工作吧！"
10146-150 = "老師肯定連想都想不到吧。"
10146-160 = "為了頂替夏萊的值日生，\n我究竟付出了多少。"
10146-170 = "嗯？問我為什麼\n要做到這種地步？"
10146-180 = "那是，因為……"
10146-190 = "怎麼說呢……\n就是那麼回事。"
10146-200 = "所謂優秀的領導者，\n無論身在何處都會\n思考組織的安定。"
10146-210 = "不會因為是夏天，\n就有空得意忘形！"
10146-220 = "我總是不斷思考著\n下一步的計畫！"
10146-230 = "和光是眼前的事就\n忙不過來的空崎陽奈相比，\n格局完全不同！嘻嘻嘻！"
10146-240 = "嗯？希望我也關心一下\n眼前的夏萊值班？"
10146-250 = "……這麼一說，好像也是。"
10146-260 = "網紅的泳裝\n總能引發話題。"
10146-270 = "光是換套衣服\n就能受到矚目。"
10146-280 = "沒有比這更划算的\n宣傳方式了吧？嘻嘻！"
10146-290 = "這是盲點……為何以前\n都沒注意到大海呢？"
10146-300 = "廣闊的領土、無窮的資源……\n這不正是為格黑娜準備的\n「寶藏之海」嗎！"
10146-310 = "我真琴大人居然連這種\n點子都沒想到……！"
10146-320 = "嗯？我不是會暈船？"
10146-330 = "……看來偉大計畫的執行，\n還需要再檢討一陣子啊。"
10146-340 = "哦？很在意這件泳裝嗎？"
10146-350 = "很棒對吧？"
10146-360 = "這可是我說服那些難搞的\n設計師後訂製的。"
10146-370 = "不過，也算沒白費功夫。\n你就盡情欣賞吧！嘻嘻嘻！"
10146-380 = "……請別一直盯著看。"
10146-390 = "嘻嘻嘻……老師啊。\n是不是有源源不絕\n的聯絡湧進來？"
10146-400 = "啊啊，沒錯！真琴大人\n已經確實下達指示了！"
10146-410 = "現在格黑娜全境應該都在播放\n慶祝老師生日的廣播吧！"
10146-420 = "嗯，畢竟是我和老師的交情。\n不必特地向我道謝哦。嘻嘻！"
10146-430 = "啊啊，對了。這麼說來，\n我好像還沒單獨對你說過……"
10146-440 = "那個……\n生日快樂，老師。"
10146-450 = "啊啊，是老師啊。\n我剛宣布完今天停課呢。"
10146-460 = "在格黑娜，沒有\n比我真琴大人的生日\n更重要的節日了。"
10146-470 = "也就是說，\n今天難得很清閒。"
10146-480 = "……終於能不被任何人打擾，\n兩個人悠閒地共度時光了。"
10146-490 = "沒事，別在意！\n那麼，要做什麼？"
10146-500 = "嘻嘻嘻……新年到了。\n來，要出發囉。"
10146-510 = "嗯？要去看日出。\n一切都已安排妥當。"
10146-520 = "老師只要跟著來就行了。"
10146-530 = "雖然只是個形式，\n不過到了我們這種層級，\n這類活動也必須重視。"
10146-540 = "嘻嘻！看來老師也明白了啊。"
10146-550 = "沒錯──\n聖誕老人並不存在。"
10146-560 = "……不過，那種無聊的\n事實根本不重要。"
10146-570 = "我打算立刻去\n格黑娜廣場發送禮物！"
10146-580 = "這樣一來，大家就不會\n歌頌不存在的聖誕老人，\n而是歌頌我真琴大人了！"
10146-590 = "……當然，會先換衣服哦？"
10146-600 = "嘻嘻嘻。玩得開心嗎？"
10146-610 = "老師究竟會用什麼\n惡作劇嚇本大人一跳，\n真令人期待呢。"
10146-620 = "嗯？老師在等待\n我的惡作劇嗎？"
10146-640 = "我──一直以來，\n都扮演著萬魔殿與\n格黑娜代表的身分。"
10146-650 = "或許正是因為這樣，\n我才始終沒有面對\n自己的慾望與感情吧。"
10146-660 = "但是，夏萊的老師啊。\n這個提案並非以萬魔殿議長，\n而是以我個人的身份提出的。"
10146-670 = "我承認。老師對我而言……\n或許已經成為有點特別的存在。"
10146-680 = "成為了即使得付出代價──\n也必須獲得的對象。"
10146-690 = "不，是確保……？\n還是捕獲……？"
10146-700 = "……這份感情\n該如何表達，\n我並不清楚。"
10146-710 = "對了。硬要說的話──"
10146-720 = "──成為我的人吧。"
10146-2600 = "老師啊……我呢，\n已經把想要的東西全都拿到手了。\n真琴大人的字典裡，\n沒有失敗和不可能這幾個字。\n現在就先滿足於此……\n但總有一天，我一定會……"
