[translation]
10146-10-1 = "คิกคิกคิก... Blue~ Archive ยังไงล่ะ"
10146-20-1 = "คนมีความสามารถนี่ไม่มีเวลาพักผ่อนตามสบายเลยสินะ\nต้องการความช่วยเหลือจากท่านมาโคโตะผู้นี้ล่ะสิ?"
10146-30-1 = "ต้องเอานี่ไปไว้ที่\nแพนเดโมเนียม โซไซตี้\nสักอันแล้ว"
10146-40-1 = "ฮุฮุ รู้สึกได้ถึงสายตาที่\nมองมาด้วยความชื่นชม\nเลยนะ"
10146-50-1 = "ที่ชาเล่ต์ก็ด้วยเหรอ...?\nอ่า เป็นคนดังนี่ลำบากจริงๆ"
10146-60-1 = "ครูยืนกรานจะใช้\nสถานที่คับแคบ\nแบบนี้ไปทำไมกัน..."
10146-70-1 = "ตั้งที่ทำการย่อยของ\nแพนเดโมเนียม โซไซตี้\nที่ชายหาดก็ดูไม่เลวนะ"
10146-80-1 = "อ่า ครู เรารออยู่พอดี"
10146-90-1 = "คนที่ทำให้ท่านมาโคโตะผู้นี้\nต้องรอ ก็มีแต่ครูนี่แหละ"
10146-100-1 = "อย่าใช้อำนาจนั้น\nพร่ำเพรื่อเกินไปนักล่ะ..."
10146-110-1 = "คิกคิก! มาก็ดีแล้ว ครู!"
10146-120-1 = "ทำหน้าตกใจพอดูเลยนะ\nไม่แปลกหรอก ก็วันนี้นักเรียนเวร\nไม่ใช่เรานี่นา"
10146-130-1 = "ถ้าถามว่าเกิดอะไรขึ้นละก็..."
10146-140-1 = "อย่าใส่ใจเลย! เรื่องเล็กน้อยน่ะ!\nไปเริ่มงานของวันนี้กันเถอะ\nคิกคิกคิก!"
10146-150-1 = "ครูคงคาดไม่ถึงหรอก"
10146-160-1 = "ว่าเราต้องลงทุนทรัพยากร\nไปมากเท่าไร เพื่อจะสลับเวร\nกับนักเรียนเวรที่ชาเล่ต์"
10146-170-1 = "หืม? ทำไมเราถึงต้อง\nทำขนาดนั้นน่ะเหรอ?"
10146-180-1 = "ก็ เอ่อ..."
10146-190-1 = "หลายๆ อย่างน่ะ"
10146-200-1 = "ผู้นำที่มีความสามารถ ย่อมต้อง\nมุ่งหาความผาสุกขององค์กร\nไม่ว่าที่ไหนและเมื่อไร"
10146-210-1 = "เราไม่มีความคิดจะ\nปล่อยใจไปกับฤดูร้อนหรอก!"
10146-220-1 = "เราน่ะเตรียมแผนการ\nถัดไปไว้เสมอ!"
10146-230-1 = "ต่างจากโซระซากิ ฮินะที่มัวแต่\nวุ่นกับเรื่องที่อยู่ตรงหน้า\nเรามันคนละชั้นกันอยู่แล้ว! คิกคิกคิก!"
10146-240-1 = "หืม? อยากให้สนใจช่วยงานชาเล่ต์\nที่อยู่ตรงหน้าบ้าง...?"
10146-250-1 = "ลืมไปเสียสนิทเลย..."
10146-260-1 = "ภาพชุดว่ายน้ำของอินฟลูเอนเซอร์\nย่อมเป็นประเด็นอยู่แล้ว"
10146-270-1 = "แค่สวมใส่เสื้อผ้า\nก็เป็นกระแส\nให้ผู้คนพูดถึงแล้ว"
10146-280-1 = "เป็นวิธีโฆษณาที่มีประสิทธิภาพ\nอะไรเช่นนี้! คิกคิกคิก!"
10146-290-1 = "ทำไมที่ผ่านมาเราถึงไม่คิด\nจะพิชิตทะเลเลยนะ?"
10146-300-1 = "ดินแดนอันกว้างใหญ่\nทรัพยากรอันไร้ขีดจำกัด...\nนี่มันขุมทรัพย์ที่เตรียมไว้\nเพื่อเกเฮนน่าชัดๆ เลยไม่ใช่เหรอ!"
10146-310-1 = "คนระดับท่านมาโคโตะผู้นี้\nกลับคิดเรื่องแค่นั้นไม่ออก...!"
10146-320-1 = "หืม? เราเป็นคนเมาเรือ\nหรือเปล่าน่ะเหรอ?"
10146-330-1 = "งั้นเลื่อนแผนพิชิตทะเล...\nออกไปก่อนแล้วกัน"
10146-340-1 = "โอ้? ดูเหมือนจะสนใจ\nชุดว่ายน้ำชุดนี้สินะ"
10146-350-1 = "ที่จริงแล้วชุดนี้\nต้องใช้ความพยายามไม่น้อยเลย"
10146-360-1 = "ทั้งค่าใช้จ่าย ไหนจะยังต้อง\nเกลี้ยกล่อมดีไซเนอร์จู้จี้พวกนั้นอีก\nเป็นงานหนักทีเดียวละ"
10146-370-1 = "มันก็เลยออกมาเป็น\nชุดที่ยอดเยี่ยมเช่นนี้ไง!\nมองให้เต็มตาเลยนะ! คิกคิกคิก!"
10146-380-1 = "อ่า... แต่อย่าจ้องเขม็ง\nเกินไปนักจะดีกว่า..."
10146-390-1 = "คิกคิกคิก... ครู ได้รับการติดต่อ\nจากหลายคนเลยใช่มั้ยล่ะ?"
10146-400-1 = "จะปิดบังไปทำไมกัน!\nก็ตอนนี้ทั่วทั้งเกเฮนน่า"
10146-410-1 = "กำลังออกอากาศ\nประกาศฉลองวันเกิดของครู\nตามคำสั่งของเราอยู่น่ะสิ!"
10146-420-1 = "อะไรกัน พวกเราคนกันเอง\nไม่ต้องขอบคุณหรอก คิกคิกคิก!"
10146-430-1 = "อ้อ! แล้วก็! ในเมื่อนึกขึ้นได้พอดี\nคือว่า รู้สึกเหมือนจะยังไม่ได้บอก\nเป็นการส่วนตัวต่างหากเลย..."
10146-440-1 = "เอ่อ สุขสันต์วันเกิดนะ ครู"
10146-450-1 = "อ่า ครู เราเพิ่งประกาศวันหยุด\nให้ทั้งโรงเรียนมาเมื่อกี้นี้เอง"
10146-460-1 = "สำหรับเกเฮนน่า ไม่มีวันฉลองใด\nสำคัญเท่าวันประสูติของ\nท่านมาโคโตะผู้นี้อีกแล้ว"
10146-470-1 = "พูดอีกอย่างก็คือ\nวันนี้แม้แต่เรา ก็นับว่าเป็น\nวันว่างที่นานๆ จะมีสักครั้ง"
10146-480-1 = "ในที่สุดก็จะได้ใช้เวลา\nสองต่อสอง โดยไม่มีใคร\nมาขัดแล้วสินะ..."
10146-490-1 = "ไม่สิ อย่าใส่ใจเลย!\nถ้างั้นจะเริ่มจากอะไรก่อนดีล่ะ?"
10146-500-1 = "คิกคิกคิก... สวัสดีปีใหม่นะ\nแล้วก็รีบไปกันเถอะ"
10146-510-1 = "หืม? ก็หมายถึงไป\nดูพระอาทิตย์ขึ้นน่ะสิ?\nเราเตรียมงานไว้เรียบร้อยแล้ว"
10146-520-1 = "ครูแค่ไปเข้าร่วมก็พอ"
10146-530-1 = "สำหรับคนใหญ่คนโตระดับพวกเรา\nพิธีการแบบนี้สำคัญนะ"
10146-540-1 = "ใช่แล้ว ในที่สุดก็ดูเหมือน\nจะเข้าใจแล้วสินะ ครู"
10146-550-1 = "ซานต้าไม่มีอยู่จริง"
10146-560-1 = "คิกคิกคิก...! แต่จะปล่อยให้\nความจริงที่น่าเบื่อแบบนั้น\nครอบงำโลกไม่ได้หรอก!"
10146-570-1 = "จากนี้ไปจะเริ่มแจกของขวัญ\nที่จัตุรัสเกเฮนน่า!"
10146-580-1 = "ทุกคนคงสรรเสริญ\nท่านมาโคโตะผู้นี้\nมากกว่าซานต้าที่ไม่มีอยู่จริง"
10146-590-1 = "อ่า... แน่นอนว่าต้องเปลี่ยน\nเป็นชุดที่อบอุ่นกว่านี้ก่อน"
10146-600-1 = "คิกคิกคิก กำลังมีช่วงเวลา\nสนุกๆ อยู่หรือเปล่า?"
10146-610-1 = "อยากรู้จริงๆ ว่าครูจะ\nแกล้งอะไรให้เราตกใจ"
10146-620-1 = "หืม? หรือว่ากำลังรอ\nให้เราแกล้งอยู่กันแน่?"
10146-640-1 = "เราน่ะเป็นตัวแทนผลประโยชน์\nส่วนรวมของแพนเดโมเนียม โซไซตี้\nและเกเฮนน่าอยู่เสมอ"
10146-650-1 = "เมื่ออยู่ในจุดนั้น เราอาจไม่ถนัด\nเรื่องการมองย้อนดูความต้องการ\nหรือความรู้สึกของตัวเอง"
10146-660-1 = "ทว่า ครูจากชาเล่ต์ ข้อเสนอนี้ไม่ใช่\nในฐานะประธานแพนเดโมเนียม โซไซตี้\nแต่เป็นเรื่องส่วนตัวมากกว่า"
10146-670-1 = "เรายอมรับนะ ครูอาจกลายเป็น\nตัวตนที่... พิเศษ\nขึ้นมานิดหน่อยสำหรับเราแล้วก็ได้"
10146-680-1 = "จนกลายเป็นคนที่ต่อให้ต้อง\nละทิ้งคุณค่าบางอย่าง ก็ต้องไขว่คว้า\nมาให้ได้อย่างแน่นอน"
10146-690-1 = "ไม่สิ ต้องเรียกว่า\nแย่งชิง...? พิชิต...?"
10146-700-1 = "ไม่รู้เลยว่า...\nควรเรียกความรู้สึกนี้ว่าอะไร"
10146-710-1 = "อย่างนี้สินะ\nถ้าจะให้พูดก็ต้องบอกว่า"
10146-720-1 = "เราอยากได้คุณมาครอบครอง"
10146-2600-1 = "ครู เราไขว่คว้าทุกสิ่งที่ปรารถนามาได้แล้ว\nเพราะงั้น ความคิดของพวกยอมแพ้\nที่ว่า 'คราวนี้ไม่ไหวแน่' เราไม่คิดจะมี\nติดตัวแม้แต่นิดเดียว ตอนนี้ขอพอใจเท่านี้\nแต่ว่านะ สักวันหนึ่งจะต้อง..."
