[translation]
10146-10 = "키키킷…… 블루~ 아카이브다."
10146-20 = "유능한 사람은 느긋히 쉴 시간도 없군.\n이 마코토 님의 도움이 필요한 거겠지?"
10146-30 = "이건 만마전에도\n하나 비치해야겠군."
10146-40 = "훗. 우러러 보는\n시선이 느껴지는군."
10146-50 = "샬레에서까지……?\n아아, 유명인은 괴롭군."
10146-60 = "선생은 대체 왜\n이런 비좁은\n장소를 고집하는지……."
10146-70 = "해변에 만마전 분관을\n세우는 것도\n나쁘지 않겠군."
10146-80 = "아아, 선생, 기다리고 있었다."
10146-90 = "이 마코토 님을 기다리게 하는\n사람은 선생 정도다만."
10146-100 = "……그 권력을 너무\n남용하지는 말도록."
10146-110 = "후후후! 잘 왔다, 선생!"
10146-120 = "꽤 놀란 표정이로군.\n그도 그렇겠지. 오늘 당번은\n이 몸이 아니었으니까."
10146-130 = "어떻게 된 일인지 하면……."
10146-140 = "신경쓰지 마라! 사소한 문제다!\n그보다 오늘 업무를\n시작하지, 키키킷!"
10146-150 = "선생은 짐작도 못 할 거다."
10146-160 = "이 몸이 샬레 당번과\n교대하기 위해,\n얼마나 많은 자원을 투자했는지."
10146-170 = "응? 어째서\n그렇게까지 했느냐고?"
10146-180 = "그, 뭐어……."
10146-190 = "이것저것이다."
10146-200 = "유능한 리더는 언제 어디서든\n조직의 안녕을\n추구해야 하는 법."
10146-210 = "여름이라고 기분을\n낼 생각은 없다!"
10146-220 = "이 몸은 언제나\n다음 계획을 준비하고 있지!"
10146-230 = "고작 눈앞에 닥친 일에 급급한\n소라사키 히나와는\n그릇부터 다른 것이다! 키히힛!"
10146-240 = "응? 눈앞의 샬레 업무 보조에도\n조금은 신경 써 달라……?"
10146-250 = "……완전히 깜빡하고 있었다."
10146-260 = "인플루언서의 수영복 차림은\n화제가 되지."
10146-270 = "그저 옷을 입었다는\n것만으로 사람들 입가에\n오르내리는 것이다."
10146-280 = "얼마나 효율적인\n선전 방식인가! 키키킷!"
10146-290 = "왜 지금껏 바다를 정복하겠다는\n발상을 하지 못했지?"
10146-300 = "광활한 영토, 무궁무진한 자원…\n그야말로 게헨나를 위해\n준비된 노다지 아닌가!"
10146-310 = "이 마코토 님 정도 되는\n사람이 그 정도 발상을\n떠올리지 못했다니……!"
10146-320 = "응? 뱃멀미를 하지 않느냐고?"
10146-330 = "……바다 정복 계획은,\n나중으로 미루도록 하지."
10146-340 = "호오? 이 수영복에\n관심이 있나 보군."
10146-350 = "실제로 이 물건은\n꽤 품이 들었지."
10146-360 = "비용은 물론이고,\n그 까다로운 디자이너들을\n설득하는 것도 꽤나 일이었지."
10146-370 = "그 덕에 이렇게 훌륭한 물건이\n완성되었지! 마음껏 구경하도록!\n키히힛!"
10146-380 = "……아, 그렇지만, 너무 빤히\n보지는 말아줬으면 한다만……."
10146-390 = "키키킷…… 선생, 여기저기서\n꽤 연락이 오지 않았나?"
10146-400 = "숨겨서 무엇하리!\n이 몸의 지시로,"
10146-410 = "지금 게헨나 전역에\n선생의 탄신일을 알리는\n축하 방송이 송출되고 있다!"
10146-420 = "뭐얼, 우리 정도의 사이에,\n감사는 필요 없다. 키키킥!"
10146-430 = "아! 그리고! 이거는, 마침\n생각난 김에! 따로, 개인적으로\n말한 적 없는 것 같아서다만…."
10146-440 = "저기, 생일, 축하한다. 선생."
10146-450 = "아아, 선생. 마침 전교 휴일을\n선포하고 온 참이다."
10146-460 = "게헨나에 있어, 이 마코토 님의\n탄신일만큼 중요한 축일은\n없으니까 말이다."
10146-470 = "즉, 오늘은 이 몸께서도\n드물게 한가한 날인 셈이지."
10146-480 = "……드디어 방해받지 않고,\n둘이서 보낼 수 있겠군."
10146-490 = "아니, 신경쓰지 마라!\n그러면 무엇부터 할 텐가?"
10146-500 = "키키킷… 새해 복 많이 받도록.\n그리고 어서 가지."
10146-510 = "응? 당연히 해돋이 이야기다만?\n행사 준비는 이쪽에서 마쳤으니,"
10146-520 = "선생은 참석하기만 하면 된다."
10146-530 = "우리 정도의 거물에게,\n이런 형식은 중요하니 말이다."
10146-540 = "그래,\n마침내 깨달았나 보군, 선생."
10146-550 = "산타는 실존하지 않는다."
10146-560 = "……키히힛! 하지만,\n그런 지루한 사실이\n세상을 지배하게 둘 수는 없지!"
10146-570 = "지금부터 게헨나 광장에서\n선물을 배포할 예정이다!"
10146-580 = "다들 실존하지 않는\n산타 따위보다\n이 마코토 님을 찬양하겠지."
10146-590 = "……아, 물론, 좀 더\n따뜻한 차림으로 갈아입고."
10146-600 = "키키킷.\n유쾌한 시간을 보내고 있나?"
10146-610 = "선생이 과연 무슨 장난으로\n날 놀라게 할 셈인지 궁금하군."
10146-620 = "응? 아니면 내 장난을\n기다리고 있는 건가?"
10146-640 = "나는 언제나 만마전과\n게헨나의 공익을 대표하고 있지."
10146-650 = "그런 입장인 만큼, 나 자신의\n욕심이나 감정을 둘러보는 것에\n서툴렀는지 모른다."
10146-660 = "그러나, 샬레의 선생이여.\n이 제안은 만마전 의장으로서가\n아닌, 좀 더 사적인 것이다."
10146-670 = "인정하지. 선생은 나에게\n있어…… 조금 특별한 존재가\n되었는지 모른다."
10146-680 = "몇몇 가치를 포기해서라도,\n반드시 쟁취해 내야만 하는\n대상이 되고 말았다는 것을."
10146-690 = "아니, 쟁탈……? 제패……?"
10146-700 = "……이런 마음을\n뭐라 표현해야 할지 모르겠군."
10146-710 = "그렇군. 굳이 말하자면."
10146-720 = "당신을 갖고 싶다."
10146-2600 = "선생이여, 이 몸은 원하는 것은 뭐든\n쟁취했다. 그러니, 이번에는 안 된다,\n같은 패배주의적 사고는 추호도 가질\n생각이 없다. 지금은, 이것으로 만족하지.\n하지만, 언젠가 반드시……."
