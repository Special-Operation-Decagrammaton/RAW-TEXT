[translation]
10146-10-1 = "Kihehe... Blue Archive."
10146-20-1 = "*sigh* Seems like competent people don't get time to kick back and relax. You need help from me, the Great Makoto, right?"
10146-30-1 = "I should put one of these in the Pandemonium Society too."
10146-40-1 = "Oho. I can feel the gaze of someone looking up at me."
10146-50-1 = "Even at Schale...? Being famous is such a hassle."
10146-60-1 = "Why would Sensei insist on such cramped quarters?"
10146-70-1 = "It wouldn't be a bad idea to set up Pandemonium Society's branch office on the beach."
10146-80-1 = "Ah, Sensei. I've been waiting for you."
10146-90-1 = "Sensei, only someone at your level could make I, the Great Makoto, wait."
10146-100-1 = "...You'd better not try to abuse that power."
10146-110-1 = "Kiheh! Welcome, Sensei!"
10146-120-1 = "You seem quite surprised. I understand. Because I was not scheduled to be on student rep duty today."
10146-130-1 = "To explain what happened..."
10146-140-1 = "Don't think too hard on it! It's a trivial matter! More importantly, let's begin today's work! Kihehe!"
10146-150-1 = "You couldn't possibly imagine..."
10146-160-1 = "...just how many resources I expended to secure the Schale Student Rep shift for today."
10146-170-1 = "Hm? Why did I go so far?"
10146-180-1 = "Um, well..."
10146-190-1 = "For various reasons."
10146-200-1 = "A competent leader must always advocate for the well-being of the organization, regardless of time and place."
10146-210-1 = "I have no intentions of getting carried away just because it's summer!"
10146-220-1 = "I'm always one step ahead!"
10146-230-1 = "Unlike Sorasaki Hina, who only fights the crisis in front of her! That's what differentiates me from her!"
10146-240-1 = "Hm? You'd like me to give at least some of my attention to the Schale work in front of me?"
10146-250-1 = "...I forgot we were doing that."
10146-260-1 = "An influencer's swimsuit is always a hot topic."
10146-270-1 = "Just wearing an outfit can turn into a topic of conversation among the people."
10146-280-1 = "What an efficient method of propaganda! Kihehe!"
10146-290-1 = "How have I never thought of conquering the sea before?"
10146-300-1 = "Vast territories, boundless resources... It'd be a gold mine for Gehenna, no?!"
10146-310-1 = "How could someone like me, the Great Makoto, not thought of this until now...?!"
10146-320-1 = "Hm? What about my seasickness?"
10146-330-1 = "...Let's put the plan to conquer the seas on hold for now."
10146-340-1 = "Hm? I see that you're interested in this swimsuit."
10146-350-1 = "A LOT went into it."
10146-360-1 = "Not only was it expensive, but the designers were also very picky! It took a lot of convincing!"
10146-370-1 = "But that's how this masterpiece came to be! Feast your eyes upon it! Kihehehe!"
10146-380-1 = "...Ah. However, don't stare at me too much."
10146-390-1 = "Kihehe... Sensei, did you receive a number of messages from various locations?"
10146-400-1 = "I already knew! For I commanded it so!"
10146-410-1 = "A celebratory message announcing your birthday is being broadcast all over Gehenna as we speak!"
10146-420-1 = "No need to thank me! Kihehehe!"
10146-430-1 = "But also...! I just happened to realize...! I never said it to you directly..."
10146-440-1 = "So, um, happy birthday, Sensei."
10146-450-1 = "Ah, Sensei. I announced a school-wide holiday and came here."
10146-460-1 = "Because there is no more meaningful day to Gehenna than the Great Makoto's birthday!"
10146-470-1 = "Meaning, this is also a rare instance where I am free."
10146-480-1 = "...Therefore, the two of us can finally spend uninterrupted time together."
10146-490-1 = "Don't stress about it too much! Now, what shall we do?"
10146-500-1 = "Kihehe. Happy New Year. Let us get going."
10146-510-1 = "Hm? I'm talking about the sunrise. I've already prepared everything."
10146-520-1 = "All you have to do is come, Sensei."
10146-530-1 = "After all, formalities like this matter for people like us."
10146-540-1 = "So, you've finally realized, Sensei."
10146-550-1 = "Santa is not real."
10146-560-1 = "...Kihehe! But I refuse to let our world be that boring!"
10146-570-1 = "Which is why I'm giving out free gifts to people at Gehenna Plaza!"
10146-580-1 = "Surely people will praise ME, the Great Makoto, over this made-up Santa!"
10146-590-1 = "...Ah. Obviously, I plan on changing into something warmer first."
10146-600-1 = "Kihehe. Are you having a good time?"
10146-610-1 = "I'm curious what \"trick\" you'll surprise me with."
10146-620-1 = "Eh? Or were you expecting me to do a trick?"
10146-640-1 = "I always represent the public interests of Gehenna and the Pandemonium Society."
10146-650-1 = "Given that position, I have been clumsy in dealing with my own desires or emotions at times."
10146-660-1 = "However, Schale's Sensei. This proposal is not coming from the Chair of the Pandemonium Society. It is something more personal."
10146-670-1 = "I will admit it. For me, Sensei...may have become a bit of a special person."
10146-680-1 = "Someone who I must win over, no matter the cost."
10146-690-1 = "Hm, win over...? Conquer...?"
10146-700-1 = "...I'm not sure how to put this feeling into words."
10146-710-1 = "Right... If I had to put it in words..."
10146-720-1 = "I want you."
10146-2600-1 = "I've achieved everything I've ever desired, Sensei. Therefore, I will never give up or let myself think that I'm at the end of the line. I'll settle for this for now, but one day..."
