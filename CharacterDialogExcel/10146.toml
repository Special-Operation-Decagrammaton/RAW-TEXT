[translation]
10146-10-1 = "キキキッ……ブルーアーカイブ、だ。"
10146-20-1 = "はぁ……優秀過ぎる者は、\n一時の休息も許されないのだな。\nこのマコト様が手を貸してやろう、先生。"
10146-30-1 = "万魔殿にも\n同じものを\n置くしよう。"
10146-40-1 = "ふっ。マコト様の\nオーラに圧倒されている\nようだな。"
10146-50-1 = "これも持って\n生まれたもの、\nということか。"
10146-60-1 = "先生は、\nなぜこのような\n狭苦しい場所を\n好むんだ……？"
10146-70-1 = "海辺に万魔殿の\n分館を建てても\n良いな。"
10146-80-1 = "ああ、待っていたぞ。"
10146-90-1 = "このマコト様を待たせることが\nできるのは先生くらいなものだ。"
10146-100-1 = "……それだけの権力がある\n自覚を持ってくれ。"
10146-110-1 = "キキッ！よく来たな、先生！"
10146-120-1 = "驚いただろう？\nうむ――今日はマコト様の\n当番の日ではないからな。"
10146-130-1 = "何故来たのか？それは――"
10146-140-1 = "些細なことを気にしてどうする？\nさあ、今日の業務を\n始めようじゃないか！"
10146-150-1 = "先生には想像すら\nできないだろう。"
10146-160-1 = "シャーレの当番を代わってもらう\nために、どれほど費やしたのか。"
10146-170-1 = "うん？なぜ、\nそこまでするのか、だと？"
10146-180-1 = "それは、その……。"
10146-190-1 = "まあなんだ……そういうことだ。"
10146-200-1 = "優秀なリーダーとは、\nどこにいても組織の\n安定を考えているもの。"
10146-210-1 = "夏だからと、\n浮かれている暇などない！"
10146-220-1 = "常に次の計画の一手を\n考え続けているのだ！"
10146-230-1 = "目の前のことに手一杯の\n空崎ヒナとは、器が違うと\nいうわけだな！キキキッ！"
10146-240-1 = "ん？目の前のシャーレ当番も\n気にしてほしい？"
10146-250-1 = "……そういえば、そうだったな。"
10146-260-1 = "インフルエンサーの\n水着姿は話題を呼ぶ。"
10146-270-1 = "服を着替えただけで\n注目されるのだ。"
10146-280-1 = "これほどコスパの良い\nものはないだろう？キキッ！"
10146-290-1 = "盲点だった……なぜ今まで海に\n注目していなかったのだろう？"
10146-300-1 = "広大な領土に、無限の資源……\nまさにゲヘナのための\n「宝の海」ではないか！"
10146-310-1 = "このマコト様がその程度の\n発想も浮かばなかったとは……！"
10146-320-1 = "ん？船酔いするんじゃないか？"
10146-330-1 = "……偉大なる計画の実行は、\nもうしばらく検討が必要だな。"
10146-340-1 = "ほう？この水着が気になるのか？"
10146-350-1 = "素晴らしいだろう？"
10146-360-1 = "気難しいデザイナー連中を\n説得してオーダーしたものだ。"
10146-370-1 = "だが、その甲斐もあったと\nいうもの。思う存分堪能するが\n良い！キキキッ！"
10146-380-1 = "……あまり、\nジロジロ見ないでくれ。"
10146-390-1 = "キキキッ……先生よ。\n連絡が絶え間なく\n来ているのではないか？"
10146-400-1 = "ああ、そうだとも！マコト様が\nしっかり指示をしておいたぞ！"
10146-410-1 = "今ごろゲヘナ全域で先生の\n誕生日を祝う放送が\n流れていることだろう！"
10146-420-1 = "まあ、私と先生の間柄だ。\nわざわざ感謝する必要は無いぞ。\nキキッ！"
10146-430-1 = "ああ、そうだ。\nそういえば個人的に\n伝えたことはなかったな……。"
10146-440-1 = "その……誕生日、\nおめでとう。先生。"
10146-450-1 = "ああ、先生か。\nちょうど休校日であると\n宣言してきたところだ。"
10146-460-1 = "ゲヘナにおいて、\nこのマコト様の誕生日ほど\n重要な祝日はないからな。"
10146-470-1 = "つまり、\n今日は珍しく暇だということだ。"
10146-480-1 = "……ついに誰にも\n邪魔されず、二人で\nゆっくりと過ごせるのだぞ。"
10146-490-1 = "いや、気にするな！\nでは、何をする？"
10146-500-1 = "キキキッ……新年だな。\nさあ、行くぞ。"
10146-510-1 = "ん？日の出を見に行くのだ。\n手筈は整えている。"
10146-520-1 = "先生はついてきてくれれば\nそれで良い。"
10146-530-1 = "形式的なものだがな。\n我々レベルになると、こういった\n行事も大切にする必要がる。"
10146-540-1 = "キキッ！\n先生も理解したようだな。"
10146-550-1 = "そう――サンタクロースは\n実在しないのだ。"
10146-560-1 = "……だが、そんなつまらない\n事実など関係ない。"
10146-570-1 = "今からゲヘナ広場で\nプレゼントを配る予定だ！"
10146-580-1 = "そうすれば、実在しない\nサンタクロースではなく、マコト\n様を称えるようになるだろう！"
10146-590-1 = "……もちろん、着替えるぞ？"
10146-600-1 = "キキキッ。楽しんでいるか？"
10146-610-1 = "先生が一体どんな悪戯でこの\n私を驚かせようとしているのか、\n楽しみだな。"
10146-620-1 = "ん？先生は私の悪戯を\n待っているのか？"
10146-640-1 = "私は――いつも、万魔殿と\nゲヘナの代表として立っている。"
10146-650-1 = "だからこそ、自身の欲望や感情と\n向き合えていなかったのだろう。"
10146-660-1 = "だが、シャーレの先生よ。\nこの提案は、万魔殿の議長と\nしてではなく、個人的なものだ。"
10146-670-1 = "認めよう。先生は私にとって……\n少し特別な存在に\nなったのかもしれない。"
10146-680-1 = "例え代償を支払ったとしても――\n必ず獲得しなければ\nならない対象となっている。"
10146-690-1 = "いや、確保……？捕獲か……？"
10146-700-1 = "……この感情をどう\n表現すべきなのかは、\n分からない。"
10146-710-1 = "そうだな。強いていうのなら――"
10146-720-1 = "――私のモノになってくれ。"
10146-2600-1 = "先生よ……私は、欲しいと願ったものは\n全て手に入れてきた。マコト様の辞書に、\n敗北も不可能の文字も無いのだ。今はこれで\n満足してやるが……いつか、必ず……。"
