[translation]
10110-10-1 = "ブルーアーカイブ。"
10110-20-1 = "久方ぶりの邂逅……\nきっと、こう言うべきなのだろうね。\n待ちわびたよ、先生。"
10110-30-1 = "ふむ、有るべき\n姿に調っているね。"
10110-40-1 = "こういった装飾も\nどこか気持ちが\n華やぐね。"
10110-50-1 = "成程、これが…\nふむ、私の部屋とは\n趣が異なるな。"
10110-60-1 = "ここにいる\n誰もが、君の声に\n応じたのだね。"
10110-70-1 = "構成の妙、\n興味は尽きないね。"
10110-80-1 = "やぁ、先生。"
10110-90-1 = "いや何、此処には\n物珍しい品が多くてね。"
10110-100-1 = "これが先生の居場所…。"
10110-110-1 = "ふむ、慣れとは\n斯くも緩慢なものか。"
10110-120-1 = "不思議な感覚だね。"
10110-130-1 = "あまり自室から出ることは\n無いから、余計に。"
10110-140-1 = "君次第ではあるものの、\nいつかここが、\n慣れ親しんだ光景に\n変わるのだろうか。"
10110-150-1 = "ああ、逆に私の部屋でも\n構わないがね。"
10110-160-1 = "何、言ってみただけだよ。"
10110-170-1 = "…好きに解釈すると良い。"
10110-180-1 = "想像は個人の\n自由なのだから。"
10110-190-1 = "君の生誕、そして確かな存在。"
10110-200-1 = "今はただ、\nそれを言祝ぐとしようか。"
10110-210-1 = "私が生を受けた日…。"
10110-220-1 = "成程。先生という存在は、\nそこにも興味があると？"
10110-230-1 = "済まない、ちょっとした戯言だ。\n感謝するよ、先生。"
10110-240-1 = "あけましておめでとう、先生。"
10110-250-1 = "今年はどうか、新たな\n自分に手が届かんことを。"
10110-260-1 = "クリスマス…。"
10110-270-1 = "箱から飛び出る趣向の方が、\nお望みだったかな？"
10110-280-1 = "ハロウィーン…"
10110-290-1 = "あまり馴染みの\n無いことではあるが、\n悪戯を仕掛けるのが\n礼儀だろうか。"
10110-310-1 = "…ああ、君か。"
10110-320-1 = "これでも一応、\n驚嘆を感じているよ。"
10110-330-1 = "謝ることではないさ、\n驚きとは好意的な世界の拡大だ。"
10110-340-1 = "私もまた、\nそれに焦がれていたとも言える。"
10110-350-1 = "しかし、ゆくりなきは…"
10110-360-1 = "この様に君と、\n目を交わしていることだとも。"
10110-370-1 = "しかし何故…\nいや、成程。"
10110-380-1 = "私から便りを\n出したのだったか、失礼。"
10110-390-1 = "いや何、用事があって\n呼んだわけではないのだ。"
10110-400-1 = "唯…"
10110-410-1 = "君と交わす言葉に、\n私はどこか惹かれているようで。"
10110-2600-1 = "これを私に…君から？\nいや、単に思いもしなかったものだから。\n参ったね、継ぐべき言葉が見当たらないよ。\nしかし…それも好意的に思えるな、今なら。"
