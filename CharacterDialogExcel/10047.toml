[translation]
10047-10-1 = "ブル～…アーカイブ？"
10047-20-1 = "さっき…海辺でしゃかしゃか歩く、\nワタリガニさんを見つけたの。\n先生、一緒に見にいこ？"
10047-30-1 = "涼しい～"
10047-40-1 = "わあ、これって…\nアイスクリーム？"
10047-50-1 = "この辺に、\nワタリガニさんの\nお家を作ろう。"
10047-60-1 = "ハンカチOK、\nスコップOK…\nうん、これで砂のお城、\n作れそうだね。"
10047-70-1 = "陰陽部の\nみんなと砂山で\n棒倒しとかしたいな。"
10047-80-1 = "おかえり、先生\n今日はどうしたの～？"
10047-90-1 = "先生、久しぶり…"
10047-100-1 = "あれ、久しぶりって\nほどじゃない？\nどこからが久しぶり？"
10047-110-1 = "この夏は、\nもっと良い俳句をー…"
10047-120-1 = "最近、\n新しい俳句を作ったの\n聞きたい？"
10047-130-1 = "うん、分かった"
10047-140-1 = "夏が来て\n熱くて冷えて\n美味しいね。"
10047-150-1 = "せっかくの夏だし、\nもっとキラキラしたものを…"
10047-160-1 = "え、何を探してるのって？"
10047-170-1 = "…何だろうね？"
10047-180-1 = "人は頑張ると、輝く\nことができるって聞いたの。"
10047-190-1 = "一体、どこが\n光るんだろうね？"
10047-200-1 = "…おでこ？"
10047-210-1 = "今日って、先生の誕生日？"
10047-220-1 = "じゃあ早速お誕生日おめでとう、\n先生～この日があるから、\n私は先生に会えた…"
10047-230-1 = "うん、奇跡みたいだね。"
10047-240-1 = "私の、誕生日…?\nありがとう、先生"
10047-250-1 = "あ、そういえば、ニヤ部長が\n先生を呼んできてって言ってたよ\n何か、お祝いパーティーを\nするんだって。"
10047-260-1 = "…え、私の\n誕生日パーティー？\nそうなの？"
10047-270-1 = "あけましておめでとう～\n今年もよろしくね、先生。"
10047-280-1 = "先生、メリークリスマ～ス。"
10047-290-1 = "私は今年、良い子だったかな？\nそれなら、なまはげは来ないね。"
10047-300-1 = "え、ちょっと違う？"
10047-310-1 = "トリック·オア·トリート～"
10047-320-1 = "先生はどっち？トリック？\nじゃあ私、オアをやるね。"
10047-330-1 = "…トリートは誰がやるのかな？"
10047-350-1 = "先生、どうしたの？"
10047-360-1 = "顔が赤いよ？"
10047-370-1 = "大丈夫なら、良いけど。"
10047-380-1 = "それより先生、\nこっち見て、こっち。"
10047-390-1 = "亀さんの甲羅はね、\nすごく硬いんだけど～"
10047-400-1 = "実は尻尾のところは、\nふわふわしてるの。\nふわふわ～って"
10047-410-1 = "どう？\n先生も触ってみない？\nふわふわだよ。"
10047-420-1 = "先生？\nこっちだよ、こっち？"
10047-430-1 = "今はちょっと\n困る…？"
10047-440-1 = "…なんで？どうして？\n先生～？"
10047-2600-1 = "これ、くれるの？\nわぁ、ありがと～。\nじゃあ次は、私の番かな～？\nお返し、楽しみにしててね～"
