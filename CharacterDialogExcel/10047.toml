[translation]
10047-10-1 = "Blue~~ Archive!"
10047-20-1 = "เมื่อกี้... ฉันเห็นคุณปูม้ากำลังเดินเนิบนาบ\nอยู่ที่ชายทะเล คุณครูไปดูด้วยกันมั้ย?"
10047-30-1 = "สด~ชื่น~จัง~"
10047-40-1 = "ว้าวว นี่มันไอศกรีมเหรอ...?"
10047-50-1 = "พวกเรามาสร้างบ้าน\nให้คุณปูม้าตรงนี้กันเถอะ~"
10047-60-1 = "ผ้าเช็ดหน้า พร้อม\nพลั่วขุดดิน พร้อม\nเท่านี้เราก็มาก่อปราสาท\nทรายกันได้แล้วล่ะ"
10047-70-1 = "ฉันอยากจะแข่งเล่นเกม\nตักทรายกับสมาชิกชมรม\nหยินหยางทุกคนเลย"
10047-80-1 = "เชิญเลย คุณครู~\nวันนี้มาทำอะไรที่นี่เหรอ?"
10047-90-1 = "ไม่ได้เจอกันนานเลยนะ คุณครู..."
10047-100-1 = "หืม? คุณครูคิดว่าไม่ได้นาน\nขนาดนั้นงั้นเหรอ? แล้วแค่ไหน\nถึงเรียกว่านานล่ะ?"
10047-110-1 = "ฤดูร้อนคราวนี้\nอยากจะแต่งกลอนไฮกุดีๆ..."
10047-120-1 = "ไม่นานมานี้ ฉันเพิ่งแต่ง\nกลอนไฮกุใหม่มา อยากฟังมั้ย?"
10047-130-1 = "อืม เข้าใจแล้ว"
10047-140-1 = "ฤดูร้อนมาเยือน\nทั้งอบอ้าวและเย็นชื่น\nกลมกล่อมกว่าเดิม"
10047-150-1 = "คิมหันตฤดูวนมาอีกครั้ง\nระยิบระยับกว่าครั้งไหน\nเป็นประกายแวววาว..."
10047-160-1 = "หืม ฉันหาอะไรอยู่งั้นเหรอ?"
10047-170-1 = "หาอะไรนะ...?"
10047-180-1 = "ได้ยินว่าเพียงเรามีความเพียรพยายาม\nก็จะสามารถเปล่งประกายได้..."
10047-190-1 = "สงสัยจังว่ามันจะเปล่งประกาย\nที่ตรงไหนกันนะ?"
10047-200-1 = "หน้าผากเหรอ...?"
10047-210-1 = "วันนี้ วันเกิดคุณครูเหรอ?"
10047-220-1 = "สุขสันต์วันเกิดนะ คุณครู~\nเพราะมีวันนี้ ฉันถึงได้มาพบ\nกับคุณครู..."
10047-230-1 = "อืม เหมือนปาฏิหาริย์เลยนะ~"
10047-240-1 = "วันเกิดของฉัน...?\nขอบคุณนะคุณครู"
10047-250-1 = "จริงสิ หัวหน้านิยะบอกให้ฉัน\nเรียกคุณครูไปหาน่ะ เห็นว่าจะ\nจัดปาร์ตี้ฉลองอะไรสักอย่างน่ะ"
10047-260-1 = "งานวันเกิดของฉันเหรอ?\nจริงเหรอ?"
10047-270-1 = "สวัสดีปีใหม่นะ~\nปีนี้ก็ขอฝากตัวด้วย คุณครู~"
10047-280-1 = "คุณครู เมอร์รีคริสต์มาส~"
10047-290-1 = "ปีนี้ฉันเป็นเด็กดีรึเปล่านะ?\nถ้าฉันเป็นเด็กดีละก็\nภูตนามาฮาเกะก็คงไม่มาสินะ~"
10047-300-1 = "หืม? แตกต่างนิดหน่อยเหรอ?"
10047-310-1 = "ทริก ออร์ ทรีต~"
10047-320-1 = "คุณครูจะเลือกอะไร?\nทริกเหรอ? ถ้างั้นฉันเลือก \"ออร์\""
10047-330-1 = "แล้วใครจะเลือกทรีตล่ะ...?"
10047-350-1 = "คุณครู เป็นอะไรเหรอ?"
10047-360-1 = "ทำไมถึงหน้าแดงเชียว?"
10047-370-1 = "ถ้าคุณครูบอกว่าไม่เป็นอะไร\nก็คงไม่เป็นอะไรจริงๆ"
10047-380-1 = "แต่ว่านะคุณครู\nดูนี่สิ นี่น่ะ"
10047-390-1 = "กระดองของคุณเต่า~\nมันแข็งมากๆ เลย"
10047-400-1 = "แต่ที่จริงตรงส่วนหางน่ะ\nมันนุ่มนิ่มๆ นะ นู่มมม~ นิ่ม"
10047-410-1 = "คุณครูคิดว่ายังไงล่ะ?\nคุณครูก็ลองจับดูหน่อยมั้ย?\nบอกแล้วว่ามันนุ่มนิ่มมากๆ"
10047-420-1 = "คุณครู ทางนี้ ตรงนี้ล่ะ"
10047-430-1 = "ตอนนี้คงไม่เหมาะงั้นเหรอ?"
10047-440-1 = "ทำไมล่ะ...?\nมีอะไรเหรอ? คุณครู~?"
10047-2600-1 = "อันนี้ให้ฉันเหรอ? ว้าว~\nขอบคุณนะ~ งั้นคราวหน้า\nฉันจะเอามาให้คุณครูบ้างนะ\nตั้งตารอได้เลย~"
