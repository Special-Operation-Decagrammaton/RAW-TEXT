[translation]
16007-10-1 = "ブルーアーカイブ。"
16007-20-1 = "こうしてお会いできて光栄です、先生。\nよろしければご挨拶代わりに、チェリノ会長の\nこれまでの偉業についてお聞きになられますか？"
16007-30-1 = "扇動は、\n小さなことから\nゆっくりと……。"
16007-40-1 = "ふふ、チェリノ会長に\nよく似合いそうな、\n可愛いらしい\n小物ですね。"
16007-50-1 = "この空間は、\n暖かくていいですね。"
16007-60-1 = "次は必ず、ここに\nチェリノ会長と……！"
16007-70-1 = "あれ？どこからか\n会長の気配が……。"
16007-80-1 = "お帰りなさいませ、先生。\nお戻りの際に、どこかで\nチェリノ会長を\n見ませんでしたか？"
16007-90-1 = "ふふ、お待ちしておりました、\n先生。今日もキヴォトスの\n革命のため、一緒に\n頑張りましょう！"
16007-100-1 = "チェリノ会長の一挙手一投足を\n全て、このノートに\n記録しております。"
16007-110-1 = "もしかして……\n先生もお読みになりたいですか？"
16007-120-1 = "ダメです、\n女の子の秘密ですよ。"
16007-130-1 = "レッドウィンター連邦学園が\nキヴォトスを掌握する、\nその日に備えて、"
16007-140-1 = "今から話術を\n磨いておかないと……。"
16007-150-1 = "ふふ、チェリノ会長のおひげ、\n可愛いと思いませんか？"
16007-160-1 = "お誕生日おめでとうございます、\n先生。プレゼントに、\n私のとっておきの宝物……"
16007-170-1 = "チェリノ会長が使っていた\n歯ブラシを差し上げます！"
16007-180-1 = "私の誕生日、ですか？"
16007-190-1 = "ふふっ。ぜひ、\nチェリノ会長のお誕生日も\nお祝いしてあげてくださいね。"
16007-200-1 = "あぁ、もちろんこうして\n祝っていただけて、\n私も嬉しいです。"
16007-210-1 = "今年こそ……。\nレッドウィンター連邦学園が、\nキヴォトスで一番の\n学園になりますように……。"
16007-220-1 = "近頃チェリノ会長の勘が\n鋭くなってきていて\n大変です……。"
16007-230-1 = "実はサンタクロースは\nいないなんてこと、\n気づいてはいけませんのに……。"
16007-240-1 = "あらあら、私のところに来ても、\n何も差し上げられませんよ。"
16007-250-1 = "私の飴はすべて、\nチェリノ会長のものですから。"
16007-270-1 = "ふぅ、何も見えなく\nなるほどすごい\n吹雪でしたね……。"
16007-280-1 = "先生も、上着を\n脱いではいかがですか？"
16007-290-1 = "そのまま濡れた服を着ていると、\n風邪を引いてしまいますよ？"
16007-300-1 = "……先生？\nどうかされましたか、\n何か気になることでも？"
16007-310-1 = "その表情、もしかして……"
16007-320-1 = "先ほどの演説では足りず、\nもっとチェリノ会長の\nお話が聞きたいのですか？"
16007-330-1 = "こんなタイミングですし、\nちょうど良いですね。"
16007-340-1 = "では雪が止むまで、\n一緒にチェリノ会長の\n偉大さについて\n語り合うとしましょう♪"
16007-2600-1 = "私のためにこの銃を……？\nふふ、ありがとうございます。先生。"
