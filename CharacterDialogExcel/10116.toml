[translation]
10116-10-1 = "B... Blue... Archive"
10116-20-1 = "ฉันซาโอริ สควอดของอาเรียส...\nฉันใส่ชุดนี้เพราะงานหรอกนะ...\nจริงๆ นะ"
10116-30-1 = "ฮืม เป็นที่ที่เหมาะกับ\nการเรียนรู้ภารกิจปลอมตัวเลย"
10116-40-1 = "สักวันหนึ่ง\nเด็กๆ พวกนั้น...\nคงได้ใส่ชุดเดรสบ้าง"
10116-50-1 = "จะมีวันที่ได้ใส่\nชุดเดรสแบบนี้...\nแต่ไม่ใช่เพราะงานมั้ยนะ?"
10116-60-1 = "ฉันเตะตามากเลยเหรอ?\nรู้สึกถึงสายตาที่มองมาเลย"
10116-70-1 = "หน่วยรับจ้างสารพัด 68...\nเป็นพวกคนที่น่าทึ่งเลยละ"
10116-80-1 = "พอมารอครูในชุดนี้\nมันก็น่าเขินอยู่นะ"
10116-90-1 = "เอาเถอะ รีบเข้ามาสิ"
10116-100-1 = "มาแล้วเหรอ ฉันในวันนี้\nใจกล้ามากกว่าปกตินะ"
10116-110-1 = "ไม่ว่างานอะไรก็สั่งมาได้เลย"
10116-120-1 = "พอฟังจากที่คนอื่นพูด\nได้ยินว่าชุดแบบนี้\nใส่กันแต่ในวันพิเศษ"
10116-130-1 = "แต่ฉันไม่รู้\nก็เลยใส่ชุดนี้มาเจอครูน่ะ"
10116-140-1 = "มันไม่ได้มีความหมายอื่นหรอก\nฉันแค่... อยากให้ครูได้เห็น\nภาพลักษณ์ดีๆ ของฉันน่ะ"
10116-150-1 = "วันที่ฉันได้ใส่ชุดนี้...\nฉันขอไปเจออีกได้มั้ย?"
10116-160-1 = "เพียงแค่นั้น...\nก็คงเป็นวันพิเศษแล้วละ"
10116-170-1 = "ฉันฝึกเต้นมาเพื่อวันนี้เลย\nมาเต้นด้วยกันมั้ยล่ะ?"
10116-180-1 = "วันเกิดฉันไม่มีความหมายอะไรมากหรอก\nฉันคิดแบบนั้น...\nจนกระทั่งเมื่อไม่นานมานี้น่ะ"
10116-190-1 = "แต่ตอนนี้ไม่ใช่อย่างนั้นแล้ว\nต้องขอบคุณครูเลยนะ"
10116-200-1 = "ครู ขอพรปีใหม่แล้วหรือยัง?\nฉันขอพรแล้ว"
10116-210-1 = "ขอเรื่องอะไร... เป็นความลับ"
10116-220-1 = "ได้ยินว่าคืนที่ศักดิ์สิทธิ์\nต้องใช้เวลาอยู่กับคนสำคัญ"
10116-230-1 = "ฉันแค่... บอกให้รู้เฉยๆ น่ะ\nไม่มีความหมายอะไรอื่นหรอก"
10116-240-1 = "ชุดนี้ไม่เหมาะ\nกับฮาโลวีนเลย\nฉันไปแต่งคอสเพลย์หน่อยดีมั้ย?"
10116-250-1 = "พอมารอครูในชุดนี้\nมันก็น่าเขินอยู่นะ"
10116-260-1 = "เอาเถอะ รีบเข้ามาสิ"
10116-270-1 = "มาแล้วเหรอ ฉันในวันนี้\nใจกล้ามากกว่าปกตินะ"
10116-280-1 = "ไม่ว่างานอะไรก็สั่งมาได้เลย"
10116-290-1 = "พอฟังจากที่คนอื่นพูด\nได้ยินว่าชุดแบบนี้\nใส่กันแต่ในวันพิเศษ"
10116-300-1 = "แต่ฉันไม่รู้\nก็เลยใส่ชุดนี้มาเจอครูน่ะ"
10116-310-1 = "ไม่มีความหมายอื่นหรอกนะ\nฉันแค่... อยากให้ครูได้เห็น\nภาพลักษณ์ดีๆ ของฉันน่ะ"
10116-320-1 = "วันที่ฉันได้ใส่ชุดนี้...\nฉันขอไปเจออีกได้มั้ย?"
10116-330-1 = "เพียงแค่นั้น...\nก็คงเป็นวันพิเศษแล้วละ"
10116-340-1 = "ฉันฝึกเต้นมาเพื่อวันนี้เลย\nมาเต้นด้วยกันมั้ยล่ะ?"
10116-350-1 = "วันเกิดฉันไม่มีความหมายอะไรมากหรอก\nฉันคิดแบบนั้น...\nจนกระทั่งเมื่อไม่นานมานี้น่ะ"
10116-360-1 = "แต่ตอนนี้ไม่ใช่อย่างนั้นแล้ว\nต้องขอบคุณครูเลยนะ"
10116-370-1 = "ครู ขอพรปีใหม่แล้วหรือยัง?\nฉันขอพรแล้ว"
10116-380-1 = "ขอเรื่องอะไร... เป็นความลับ"
10116-390-1 = "ได้ยินว่าคืนที่ศักดิ์สิทธิ์\nต้องใช้เวลาอยู่กับคนสำคัญ"
10116-400-1 = "ฉันแค่... บอกให้รู้เฉยๆ น่ะ\nไม่มีความหมายอะไรอื่นหรอก"
10116-410-1 = "ชุดนี้ไม่เหมาะ\nกับฮาโลวีนเลย\nฉันไปแต่งคอสเพลย์หน่อยดีมั้ย?"
10116-430-1 = "ทะ... ทำแบบนี้ได้อยู่มั้ย...?"
10116-440-1 = "ถ้าครูว่าอย่างนั้นละก็...\nแต่ว่า... นี่มันค่อนข้างจะ..."
10116-450-1 = "ถ้าเป็นปกติ ฉันไม่ทำ\nท่าทางแบบนี้เด็ดขาด"
10116-460-1 = "พอมือทั้งสองข้างไม่เป็นอิสระ\nมันก็อึดอัดนิดหน่อยนะ"
10116-470-1 = "ถ้าไม่เชื่อใจคู่เต้น\nก็คงยากละนะ"
10116-480-1 = "หรือว่านี่จะเป็น...\nการทักทายเพื่อพิสูจน์สิ่งนั้นน่ะ?"
10116-490-1 = "ถ้างั้น... ฉันจะอยู่ในท่านี้\nจนกว่าครูจะพอใจเลย"
10116-500-1 = "นี่คือ... หลักฐานของความเชื่อใจของฉันน่ะ"
10116-2600-1 = "ฉันน่าจะทำงานที่หลากหลายขึ้นได้แล้ว\nต้องการอะไรก็บอกมาได้เลย"
