[translation]
10116-10-1 = "브, 블루 아카이브."
10116-20-1 = "아리우스 스쿼드의 사오리다…\n이건, 임무를 위해 입은 것이다…\n정말이다."
10116-30-1 = "흠, 위장 업무를\n배우기 좋은 장소군."
10116-40-1 = "언젠가,\n그 아이들에게도…\n드레스를."
10116-50-1 = "일 외에도 이런 드레스를\n입는 날이……\n나에게도 올까?"
10116-60-1 = "내가 눈에 띄는 건가?\n주변의 시선이\n느껴지는군."
10116-70-1 = "흥신소 68……\n역시 대단한 자들이다."
10116-80-1 = "이 복장으로 선생을 기다리니\n왠지 부끄럽군."
10116-90-1 = "아무튼 어서 와라."
10116-100-1 = "왔군. 오늘의 나는\n평소보다 대담하다."
10116-110-1 = "무슨 일이든 맡겨라."
10116-120-1 = "사람들의 말을 들어보니,\n이런 드레스는\n특별한 날에만 입는다고 한다."
10116-130-1 = "나는 그런 줄도 모르고\n선생과 만나며 이 옷을 입었지."
10116-140-1 = "다른 뜻은 없었다.\n그저…… 선생에게 좋은 모습을\n보이고 싶었을 뿐이야."
10116-150-1 = "…이 옷을 입게 되는 날에,\n또 만나러 가도 괜찮을까?"
10116-160-1 = "…그것만으로\n특별한 날이 될 테니까."
10116-170-1 = "오늘을 위해, 스텝을 연습했다.\n함께, 춰 주지 않겠나?"
10116-180-1 = "내 생일에 큰 의미는 없어.\n……라고\n얼마 전까지 생각했었다."
10116-190-1 = "하지만 지금은 아니야.\n모두 선생 덕분이다."
10116-200-1 = "선생. 새해 소원은 빌었나?\n나도 빌었다."
10116-210-1 = "내용은…… 비밀이다."
10116-220-1 = "성야엔 소중한 사람과\n시간을 보낸다더군."
10116-230-1 = "그냥…… 그렇다는 뜻이다.\n다른 의미는 없어."
10116-240-1 = "이 의상은 할로윈과\n어울리지 않는군.\n조금 분장이라도 해볼까?"
10116-250-1 = "이 복장으로 선생을 기다리니\n왠지 부끄럽군."
10116-260-1 = "아무튼 어서 와라."
10116-270-1 = "왔군. 오늘의 나는\n평소보다 대담하다."
10116-280-1 = "무슨 일이든 맡겨라."
10116-290-1 = "사람들의 말을 들어보니,\n이런 드레스는\n특별한 날에만 입는다고 한다."
10116-300-1 = "나는 그런 줄도 모르고\n선생과 만나며 이 옷을 입었지."
10116-310-1 = "다른 뜻은 없었다.\n그저…… 선생에게 좋은 모습을\n보이고 싶었을 뿐이야."
10116-320-1 = "…이 옷을 입게 되는 날에,\n또 만나러 가도 괜찮을까?"
10116-330-1 = "…그것만으로\n특별한 날이 될 테니까."
10116-340-1 = "오늘을 위해, 스텝을 연습했다.\n함께, 춰 주지 않겠나?"
10116-350-1 = "내 생일에 큰 의미는 없어.\n……라고\n얼마 전까지 생각했었다."
10116-360-1 = "하지만 지금은 아니야.\n모두 선생 덕분이다."
10116-370-1 = "선생. 새해 소원은 빌었나?\n나도 빌었다."
10116-380-1 = "내용은…… 비밀이다."
10116-390-1 = "성야엔 소중한 사람과\n시간을 보낸다더군."
10116-400-1 = "그냥…… 그렇다는 뜻이다.\n다른 의미는 없어."
10116-410-1 = "이 의상은 할로윈과\n어울리지 않는군.\n조금 분장이라도 해볼까?"
10116-430-1 = "이, 이렇게 하면 될까…?"
10116-440-1 = "선생이 그렇게 말한다면…\n하지만, 이건 조금…"
10116-450-1 = "평소라면, 절대 하지 않았을 자세야."
10116-460-1 = "양손이 자유롭지 못하니,\n조금 불안하군."
10116-470-1 = "파트너를 신뢰하지\n않는다면 어렵겠어."
10116-480-1 = "설마 이건……\n그걸 증명하는 인사였던 건가?"
10116-490-1 = "그렇다면……\n선생이 만족할 때까지\n이 자세로 있어 주지."
10116-500-1 = "이것이…… 내 신뢰의 증거다."
10116-2600-1 = "좀 더 다양한 업무를 할 수 있겠군.\n필요한 건 뭐든 말해라."
