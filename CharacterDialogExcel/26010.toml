[translation]
26010-10-1 = "ブルー……ア、アーカイブ……"
26010-20-1 = "R……RABBIT4、準備完了しました。\n本当に……こんな格好でいいのですか……？"
26010-30-1 = "素敵な格好の人が\nいっぱい……"
26010-40-1 = "う、うううぅ……。"
26010-50-1 = "水着なのに……\n誰にも気づかれ\nないんです……"
26010-60-1 = "（一体どんな\nお話をしているの\nでしょうか……？）"
26010-70-1 = "みんな……\nどこに行ったの……？"
26010-80-1 = "あ、せ、先生……！\n待って、ました……。"
26010-90-1 = "あの……\n実はさっきからここに\nいたのですが……"
26010-100-1 = "わ、私のこと、\n忘れてませんか……？"
26010-110-1 = "海の思い出……"
26010-120-1 = "あ、あまり良いものは\nないです……"
26010-130-1 = "……何か、\nお手伝いできることは\nないでしょうか？"
26010-140-1 = "飲み物を\n買ってくるとか……。"
26010-150-1 = "……えっ？\nこの格好で外に行くのは\n問題が……？"
26010-160-1 = "ど、どうして……。"
26010-170-1 = "か、可愛いですか……？\nあ、ありがとうございます。"
26010-180-1 = "私のようなイモ娘には\n身に余るお言葉です……。"
26010-190-1 = "釣りは、狙撃手に\nぴったりの趣味かもしれません。"
26010-200-1 = "準備をして、\n待ち続ける所とか……"
26010-210-1 = "仕組みも、\nだいたい同じですし。"
26010-220-1 = "水泳は少しだけ\n……できます。"
26010-230-1 = "バタフライはまだ、\n苦手ですが……"
26010-240-1 = "お、お誕生日\nおめでとうございます……\n先生……。"
26010-250-1 = "今日、もし良いものが\n釣れたら……"
26010-260-1 = "必ず先生に\nプレゼントしますね！"
26010-270-1 = "私の誕生日……\n覚えていて\nくださったのですね！"
26010-280-1 = "……本当に、\nありがとうございます！"
26010-290-1 = "あけまして\nおめでとうございます、\n先生。"
26010-300-1 = "その……おせち料理も……\n廃棄分があったり\nするのでしょうか……？"
26010-310-1 = "今年のクリスマスは\nモエちゃんが大きな七面鳥を\n焼いてくれるみたいで、"
26010-320-1 = "少し、楽しみです……"
26010-330-1 = "よ、よかったら先生も……\n一緒にいかがですか？"
26010-340-1 = "少し肌寒くなって\nきましたね……"
26010-350-1 = "温かいカボチャのお茶でも\n飲みたい気分です……"
26010-370-1 = "ふふっ、先生もすぐに\n気づかないなんて、\n今回も完璧みたいです。"
26010-380-1 = "木を隠すには\n森の中と言うように……"
26010-390-1 = "釣り人の中に溶け込むには、\n釣りをするのが自然ですから。"
26010-400-1 = "……カモメや海鳥が\nずっと頭に乗ろうとするのは、"
26010-410-1 = "ちょっと困りますが……"
26010-420-1 = "こういうの……。\n慣れてますから……。"
26010-430-1 = "ふふ、ふふふ……"
26010-440-1 = "ちょうど釣り道具があったから\nここにしましたが、"
26010-450-1 = "潜伏するには\nぴったりな場所ですね。"
26010-460-1 = "見晴らしも良いですし、\n周辺を監視するのにも最適。"
26010-470-1 = "風が涼しいから暑くもなくて、\n日よけの麦わら帽子も\nありますし……"
26010-480-1 = "そ、そして……\n今日は……"
26010-490-1 = "せ、せ、先生も……"
26010-500-1 = "……そばにいますから。"
26010-2600-1 = "RABBIT39式小銃……う、受け取りました。\n海辺での狙撃は風も、湿気も強くて……\n色々と、難しいのですが……\nそれでも、1kmまででしたら……\nなんとかなりそうです……"
