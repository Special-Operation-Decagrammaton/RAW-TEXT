[translation]
10023-10-1 = "ブルーアーカイブ。"
10023-20-1 = "……べっ、別に遊んでるわけじゃない。\n偵察任務の途中だから、誤解しないで。"
10023-30-1 = "リゾート地だからって、\n規則違反は\n許さないからな。"
10023-40-1 = "規則違反を\nしてるやつは……\n今のところ\nいなさそうだな。"
10023-50-1 = "（紫外線対策、\nしっかり\nしないと……）"
10023-60-1 = "（どこか、\nビーチベッドを\n広げられそうな\nところは……）"
10023-70-1 = "（なっ、なんだか今、\n気持ち悪い視線を\n感じた気が……）"
10023-80-1 = "おかえり、先生。\n今日は良い天気だし、\n日光浴にはピッタリの日だね。"
10023-90-1 = "先生、遅い！\n危うく私だけ、\n極端に焼けちゃうところ\nだったじゃんか……！"
10023-100-1 = "歩きながら飲食をしない！\nリゾート地だからって\n例外は無いからな！"
10023-110-1 = "なに、\nそんなニコニコして……\nいくら海だからって、\n浮かれすぎ。"
10023-120-1 = "……え？\n私の水着姿を見てたら、\n自然に……？"
10023-130-1 = "……っ！\n死ね、このヘンタイ！"
10023-140-1 = "ふう、海辺で\n飲むレモネードは\nやっぱり格別だ。"
10023-150-1 = "べ、別に、海だからって\n浮かれてるわけじゃない！"
10023-160-1 = "お誕生日おめでとう、先生。\n何か欲しい物とかないのか？"
10023-170-1 = "……この状況だけでもう十分？\n何それ、どういう意味？"
10023-180-1 = "海で迎える誕生日なんて……\nちょっとロマンチック\nすぎるけど、悪くないな。"
10023-190-1 = "海といったらバカばっかりだし、\nトラブルだらけで\nあんまり好きじゃ\nなかったけど……。"
10023-200-1 = "でも、これは最高の誕生日だ。\nありがとう、先生。"
10023-210-1 = "もうお正月か……。\nちょっと前まで夏だったのに、\n時間が経つのは早いな。"
10023-220-1 = "はぁ、ビキニのサンタ服！？\nだ、誰が着るか\nそんなハレンチなの！\n死ね！ヘンタイ！"
10023-230-1 = "なんだかちょっと\n涼しい気が……。"
10023-240-1 = "は？後ろで何かが\n通り過ぎた気がする？"
10023-250-1 = "ばっ、夏でもないのに、\n急に怖い話をするな！"
10023-270-1 = "い、いつの間にそこに！？"
10023-280-1 = "え、さっきから\nずっと見てた……？"
10023-290-1 = "このっ……\nヘンタイ！\n死ねっ！！"
10023-300-1 = "……言っておくけど、\n別に遊んでるわけじゃ\nないからな？"
10023-310-1 = "これもれっきとした、\n風紀を守る活動の\n一環で……！"
10023-320-1 = "……っていうか、\nいつまでジッと見てるんだ！\n早くどっか行って！"
10023-2600-1 = "これは……\nちゃんとした武器なのか？\n本当に？"
