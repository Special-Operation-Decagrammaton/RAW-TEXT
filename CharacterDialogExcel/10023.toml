[translation]
10023-10-1 = "Blue Archive."
10023-20-1 = "I'm not joking! This is all part of the recon mission."
10023-30-1 = "Surely there won't be students, drunk off the resort atmosphere, causing mischief here, right?"
10023-40-1 = "Looks like there isn't anyone...out of line."
10023-50-1 = "(Would this be enough to protect from UV rays?)"
10023-60-1 = "(Is there an ideal place to open up the sun bed...?)"
10023-70-1 = "(Aaah! No wonder I felt like someone was staring.)"
10023-80-1 = "Welcome, Sensei. It's sunny today and great for sunbathing."
10023-90-1 = "You're late! I thought I was going to get sunburn waiting for you!"
10023-100-1 = "No eating while walking! No exceptions just because it's a resort."
10023-110-1 = "What's that smile on your face? Surely you're not excited about the ocean, right?"
10023-120-1 = "What? You can't stop smiling after seeing my swimsuit?"
10023-130-1 = "Die, you pervert!"
10023-140-1 = "Heehee. Lemonade tastes so much better at the beach."
10023-150-1 = "N-No, I'm not excited because of the ocean!"
10023-160-1 = "Happy birthday, Sensei. Is there any gift you want?"
10023-170-1 = "This is already enough? What do you mean?"
10023-180-1 = "A birthday at the beach seems a little romantic, but I guess I don't hate it."
10023-190-1 = "There are only fools in the water and trouble on the beach, but..."
10023-200-1 = "It's still the best birthday I've ever had. Thanks."
10023-210-1 = "Is it already New Year's Day? It felt like summer was just yesterday. Time sure flies."
10023-220-1 = "A Santa bikini outfit? No one would ever wear anything so stupid! Pervert! Die!"
10023-230-1 = "I feel uneasy for some reason..."
10023-240-1 = "Y-You say something just went by behind me?"
10023-250-1 = "It's not even summer. Stop it with the sudden scary story!"
10023-270-1 = "Wh-When did you get here?"
10023-280-1 = "Have you been watching me this whole time?"
10023-290-1 = "Y-You...! Pervert! Die!"
10023-300-1 = "Just so you know, I'm not fooling around!"
10023-310-1 = "It's all to protect morality on the beach!"
10023-320-1 = "Anyway, just how long are you going to keep staring like that?! Go away!"
10023-2600-1 = "This is...a proper weapon? Really?"
