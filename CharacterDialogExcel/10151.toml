[translation]
10151-10 = "블루 아카이브!"
10151-20 = "183호 특별반의 반장, 니키 안나입니다.\n미안해요, 사인은 나중에."
10151-30 = "(사인용 펜,\n준비 오케이!)"
10151-40 = "이거, 아주 멋진 의자네요!\n앉을수도 있고,\n무기로도 쓸 수 있죠!"
10151-50 = "멋진 디자인……\n감명깊군요."
10151-60 = "아아…… 눈치채셨군요.\n네에, 그렇답니다.\n제가 니키 안나에요."
10151-70 = "(이 방에서, 레슬링의\n재능이 느껴지네요……)"
10151-80 = "안녕하세요, 선생님.\n오늘은 어떤 일을 도와드릴까요?"
10151-90 = "좋은 날씨네요……"
10151-100 = "훈장 받기 딱 좋죠.\n그렇지 않나요?"
10151-110 = "아 이거요?\n제일 아끼는 훈장이에요."
10151-120 = "만져보실래요?\n도금이라 튼튼해요."
10151-130 = "샬레는 따듯하네요.\n183호 특별반보다도 훨씬……"
10151-140 = "조금 더울정도라서, 좋네요."
10151-150 = "서류가 잔뜩……\n선생님도 저와 같은\n관리직이시군요……!"
10151-160 = "샬레도 연대책임제인가요?\n선생님도 수고가 많으시네요……."
10151-170 = "공학은 아주 간단한\n원리만 지키면 돼요."
10151-180 = "움직여야 하는게 움직이고,\n그 외에는 안 움직인다.\n그거면 충분하죠."
10151-190 = "여기, 공구가 너무 적네요……."
10151-200 = "이 공구로는\n헬리콥터 정도밖에 못 만들어요."
10151-210 = "예비 부품,\n만들어둬도 될까요?"
10151-220 = "선생님, 생일 축하드립니다."
10151-230 = "네에…… 그야말로,\n역사적인 순간이에요."
10151-240 = "아주 사소한 일인데요……"
10151-250 = "오늘이 몇월 며칠인지\n아시나요?"
10151-260 = "아, 아뇨……\n그냥 궁금해서요."
10151-270 = "새해 복 많이 받으세요, 선생님."
10151-280 = "올 해도 아이디어 가득한\n멋진 한 해가 되기를."
10151-290 = "산타 동지가\n올해도 찾아올까요?"
10151-300 = "굴뚝으로 오기 편하게,\n여러 준비를 해뒀거든요……."
10151-310 = "할로윈은, 놀라면 과자를\n받을 수 있지 않던가요……."
10151-320 = "아까, 가동중인 CNC기계에서\n비트가 빠개지는\n소리가 났어요……."
10151-330 = "엄청 놀랐는데……\n이러면 과자 받을 수 있나요?"
10151-350 = "정말로, 걸어, 버렸어요……."
10151-360 = "……그런 용기,\n저는 낼 수 없다고\n생각했는데."
10151-370 = "선생님께서, 제게……."
10151-380 = "……후훗, 그런 수여문,\n처음 들어봐요."
10151-390 = "감사합니다,\n이런 상을 받을 수 있어서,\n정말로 영광이에요."
10151-400 = "……좀 더, 자랑거리나\n고생한 일화가\n나올 줄 알았는데요……."
10151-410 = "지금은 그저,\n감격해버려서……\n뭐가 뭔지."
10151-420 = "고맙습니다, 선생님."
10151-430 = "이런 날이 올거라고는,\n정말 상상도 못 했는데……."
10151-440 = "꿈이 한번에, 전부\n이뤄진 것 같은……\n그런 기분이에요."
10151-450 = "앞으로도, 계속……."
10151-460 = "네! 계속……."
10151-470 = "후훗……!"
10151-2600 = "감사합니다, 선생님.\n이거, 전동 공구처럼 쓰임새가 많거든요.\n……정말 감사합니다."
