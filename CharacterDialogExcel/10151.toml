[translation]
10151-10-1 = "ブルーアーカイブ！"
10151-20-1 = "183号特別クラスの学級委員長、仁木アンナです。\nごめんなさいね、サインはまた今度。"
10151-30-1 = "（サインペンの準備、\nよし）"
10151-40-1 = "この椅子、\n素晴らしいですね。\n座れるし、軽いから\n振り回しやすい……。"
10151-50-1 = "素敵なデザイン……\n感銘を受けました。"
10151-60-1 = "ああ……気づいて\nしまったのですね。\nええ、そうです。\n私が仁木アンナです。"
10151-70-1 = "（この部屋から\nレスリングの才能の\n波動を感じます……）"
10151-80-1 = "こんにちは、先生。\n今日は何を\nお手伝いしましょう？"
10151-90-1 = "良い天気……"
10151-100-1 = "勲章授与にふさわしい日です。\nそうは思いませんか？"
10151-110-1 = "ああ、こちらは\n私のイチオシの勲章です。"
10151-120-1 = "触ってみますか？\n金メッキなので\nとてもしっかりしているんです。"
10151-130-1 = "シャーレは暖かいですね。\n183号特別クラスよりも、\nずっと……"
10151-140-1 = "少し、暑いくらい。\nいいですね。"
10151-150-1 = "書類がたくさん……\n先生も、私と同じ\n管理職だったなんて……！"
10151-160-1 = "シャーレも\n連帯責任制なんですか？\nお互い大変ですね……。"
10151-170-1 = "工学で守るべきものは\nただ一つ。"
10151-180-1 = "動くべきものが動き、\nそれ以外は静止する。\nそれだけです。"
10151-190-1 = "ここ、工具が\n少なすぎる気がします……。"
10151-200-1 = "これでは\nヘリくらいしか作れません。"
10151-210-1 = "予備の部品、\n作っておいてもいいですか？"
10151-220-1 = "先生、お誕生日\nおめでとうございます。"
10151-230-1 = "ええ……まさに、\n歴史的な瞬間と言えるでしょう。"
10151-240-1 = "とても些細な\nことなのですが……"
10151-250-1 = "今日は何月何日か、\n分かりますか？"
10151-260-1 = "あ、いえ……\nふと気になって。"
10151-270-1 = "あけまして\nおめでとうございます、先生。"
10151-280-1 = "本年も\n閃きの絶えない素晴らしい\n一年となりますよう。"
10151-290-1 = "同士サンタ、今年も\n来てくださるのでしょうか？"
10151-300-1 = "煙突が楽に通れるよう、\n色々と準備して\nおいたのですが……。"
10151-310-1 = "ハロウィーンって、\n驚いたらお菓子がもらえる\n日だと思っているのですが……。"
10151-320-1 = "ええ……先程、稼働中の\nCNC加工機からビットが\nブッ壊れた音がして……。"
10151-330-1 = "すっごく驚いたので……\nお菓子、もらえたりしますか？"
10151-350-1 = "本当に、飾って、\nしまいました……。"
10151-360-1 = "……そんな勇気、私には\nないと思っていたのに。"
10151-370-1 = "先生が、私に……。"
10151-380-1 = "……ふふっ、\nそんな表彰コメント、\n初めて聞きました。"
10151-390-1 = "ありがとうございます、\nこのような賞を\nいただくことができて、\n本当に光栄です。"
10151-400-1 = "……もっと、\n自慢話や苦労話が\n出てくるかと\n思ったのですが。"
10151-410-1 = "今はもう、\n感極まってしまって……\n何がなんだか。"
10151-420-1 = "ありがとうございます、\n先生。"
10151-430-1 = "こんな日が来るだなんて、\n本当に思っていなくて……。"
10151-440-1 = "夢が一気に、全て\n叶ってしまったような……\nそんな気持ちです。"
10151-450-1 = "これからも、ずっと……"
10151-460-1 = "ええ！ずっと……。"
10151-470-1 = "ふふっ……！"
10151-2600-1 = "ありがとうございます、先生。\nいただいたこちら、電動工具と\n同じくらい多用な使い道があって……\n本当に助かります。"
