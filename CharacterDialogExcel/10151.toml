[translation]
10151-10 = "ブルーアーカイブ！"
10151-20 = "183号特別クラスの学級委員長、仁木アンナです。\nごめんなさいね、サインはまた今度。"
10151-30 = "（サインペンの準備、\nよし）"
10151-40 = "この椅子、\n素晴らしいですね。\n座れるし、軽いから\n振り回しやすい……。"
10151-50 = "素敵なデザイン……\n感銘を受けました。"
10151-60 = "ああ……気づいて\nしまったのですね。\nええ、そうです。\n私が仁木アンナです。"
10151-70 = "（この部屋から\nレスリングの才能の\n波動を感じます……）"
10151-80 = "こんにちは、先生。\n今日は何を\nお手伝いしましょう？"
10151-90 = "良い天気……"
10151-100 = "勲章授与にふさわしい日です。\nそうは思いませんか？"
10151-110 = "ああ、こちらは\n私のイチオシの勲章です。"
10151-120 = "触ってみますか？\n金メッキなので\nとてもしっかりしているんです。"
10151-130 = "シャーレは暖かいですね。\n183号特別クラスよりも、\nずっと……"
10151-140 = "少し、暑いくらい。\nいいですね。"
10151-150 = "書類がたくさん……\n先生も、私と同じ\n管理職だったなんて……！"
10151-160 = "シャーレも\n連帯責任制なんですか？\nお互い大変ですね……。"
10151-170 = "工学で守るべきものは\nただ一つ。"
10151-180 = "動くべきものが動き、\nそれ以外は静止する。\nそれだけです。"
10151-190 = "ここ、工具が\n少なすぎる気がします……。"
10151-200 = "これでは\nヘリくらいしか作れません。"
10151-210 = "予備の部品、\n作っておいてもいいですか？"
10151-220 = "先生、お誕生日\nおめでとうございます。"
10151-230 = "ええ……まさに、\n歴史的な瞬間と言えるでしょう。"
10151-240 = "とても些細な\nことなのですが……"
10151-250 = "今日は何月何日か、\n分かりますか？"
10151-260 = "あ、いえ……\nふと気になって。"
10151-270 = "あけまして\nおめでとうございます、先生。"
10151-280 = "本年も\n閃きの絶えない素晴らしい\n一年となりますよう。"
10151-290 = "同士サンタ、今年も\n来てくださるのでしょうか？"
10151-300 = "煙突が楽に通れるよう、\n色々と準備して\nおいたのですが……。"
10151-310 = "ハロウィーンって、\n驚いたらお菓子がもらえる\n日だと思っているのですが……。"
10151-320 = "ええ……先程、稼働中の\nCNC加工機からビットが\nブッ壊れた音がして……。"
10151-330 = "すっごく驚いたので……\nお菓子、もらえたりしますか？"
10151-350 = "本当に、飾って、\nしまいました……。"
10151-360 = "……そんな勇気、私には\nないと思っていたのに。"
10151-370 = "先生が、私に……。"
10151-380 = "……ふふっ、\nそんな表彰コメント、\n初めて聞きました。"
10151-390 = "ありがとうございます、\nこのような賞を\nいただくことができて、\n本当に光栄です。"
10151-400 = "……もっと、\n自慢話や苦労話が\n出てくるかと\n思ったのですが。"
10151-410 = "今はもう、\n感極まってしまって……\n何がなんだか。"
10151-420 = "ありがとうございます、\n先生。"
10151-430 = "こんな日が来るだなんて、\n本当に思っていなくて……。"
10151-440 = "夢が一気に、全て\n叶ってしまったような……\nそんな気持ちです。"
10151-450 = "これからも、ずっと……"
10151-460 = "ええ！ずっと……。"
10151-470 = "ふふっ……！"
10151-2600 = "ありがとうございます、先生。\nいただいたこちら、電動工具と\n同じくらい多用な使い道があって……\n本当に助かります。"
