[translation]
10149-10 = "ブルー！アーカイブッ！"
10149-20 = "オデュッセイア海洋高等学校、ダイビング部の部長……\n渡海、ココロです……。\n海に何か落とした時は、言ってくださいね。"
10149-30 = "いいダイビング日和。\n今日はいつもより\n深く潜れそう。"
10149-40 = "シャーレに、\nこんな場所が……。"
10149-50 = "あの人は\nもしかして……\nううん、\n見間違いだよね。"
10149-60 = "すごい……\nこんなきれいな\nカケラ、\nどこに\nあったんだろう？"
10149-70 = "うう、寒い……\nあったかい\nお味噌汁……\n飲みたいなぁ……。"
10149-80 = "おかえりなさい、先生。\n……お待ち、しておりました。"
10149-90 = "あっ……お呼びでしょうか？"
10149-100 = "あの、先生……\nお仕事が終わったら、\n近くの浜辺を散歩しませんか？"
10149-110 = "え……その頃には\n日が暮れちゃう……？"
10149-120 = "大丈夫です……！\n夜の浜辺も、\nその……綺麗、ですし。"
10149-130 = "ダイビングだと、\n水に入る前の\n健康チェックが\n一番大事なんです。"
10149-140 = "先生、健康管理、\nちゃんとされてますか……？"
10149-150 = "ダイビングコンピューター、\n欲しいなぁ……\nでも予算が……うぅ。"
10149-160 = "ダイビングの時は、\nコトネがバディに\nなってくれるんです。"
10149-170 = "コトネ、\n目はあまり良くないけど\nセンスが抜群で……\nちょっとだけ、羨ましいです。"
10149-180 = "先輩からの連絡……\nいつ来るんだろう。"
10149-190 = "せ、先生！\nあの、お誕生日、\nおめでとうございます……！"
10149-200 = "お祝い……\nというほどではないんですが……"
10149-210 = "今日のお味噌汁、\n先生の好きな具を\nいっぱい入れました。"
10149-220 = "どうぞ\n召し上がってください……！"
10149-230 = "最近知ったんですが……\n今日は伝説の\nダイバーの誕生日、\nなのだとか。"
10149-240 = "私と同じ誕生日の人が\n伝説のダイバーって、\nなんだか運命を感じます。"
10149-250 = "大袈裟……かもしれませんが。"
10149-260 = "あけまして\nおめでとうございます、先生。"
10149-270 = "ちょっと寒いですけど‥‥…\n一緒に潜初めに、行きませんか？"
10149-280 = "海上では卵が貴重なので、\nずっとケーキなしで\n過ごしてきました。"
10149-290 = "でも、今日はホールケーキを\n頼んじゃいました。\nようやくみんなでケーキを\n食べられるので。"
10149-300 = "その……よかったら、\n先生も一緒にいかがですか？"
10149-310 = "深海では白く光る――\n神秘的なクラゲが\nいるらしいんです……。"
10149-320 = "次のハロウィーンは、\n探しに行ってみようかなと\n思うんですが……\n先生も一緒に行きませんか？"
10149-340 = "はぁ……あったまる……。"
10149-350 = "水上に上がってからの一杯は……\n格別です。"
10149-360 = "あ……先生のお口に\nあいましたか？"
10149-370 = "味が濃すぎたり、\n薄すぎたり、\nしていませんか……？"
10149-380 = "よかった……。\n……隠し味、ですか？"
10149-390 = "特別なことは何も……\nネットで見たレシピ\n通りに作っています。"
10149-400 = "あさりの砂抜きをして……\nアクをとって……。"
10149-410 = "あ、でも……そうですね。"
10149-420 = "飲んでくれる人のことを想って、\nいつもより丁寧に\n作ったところは――"
10149-430 = "あっ……な、なんちゃって。"
10149-440 = "え？私の作ったお味噌汁を、\n毎朝飲みたい……？"
10149-450 = "せ、先生……それって……。"
10149-460 = "あ、いえ……こ、\n困ってるとかでは……。"
10149-470 = "……はい。\n先生が、お望みでしたら……\n私は、構いませんよ。"
10149-2600 = "ありがとうございます、先生。\nこの装備なら、\n水中でも安定した作業ができそうです。\n……ふふっ、可愛い。"
