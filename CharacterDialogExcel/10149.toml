[translation]
10149-10 = "블루! 아카이븟!"
10149-20 = "오디세이아 해양학원 다이빙부 부장…… \n토미, 코코로입니다……\n혹시 물에 무언가를 빠뜨렸을 때에는,\n꼭 저를 불러주세요."
10149-30 = "오늘은 날이 좋네.\n평소보다 좀 더 깊이\n내려가도 괜찮겠어."
10149-40 = "샬레에 이런 장소가\n있었을 줄이야……"
10149-50 = "저 학생은 혹시……\n아니겠지?"
10149-60 = "예뻐라…… 이 조각은\n어디서 채집한 걸까?"
10149-70 = "춥다……\n따듯한 된장국\n한 그릇 마셨으면."
10149-80 = "어, 어서 오세요. 선생님.\n기, 기다리고 있었습니다."
10149-90 = "아…… 저, 저 찾으셨나요?"
10149-100 = "저…… 일 다 끝나시면,\n이 앞의 바닷가에 함께\n산책이라도 가지 않으시겠어요?"
10149-110 = "일이 다 끝나고 나면\n해가 질 것 같다고요……?"
10149-120 = "괘, 괜찮아요……!\n밤바다도, 제법……\n운치가 있으니까요."
10149-130 = "다이빙 준비에서 가장 중요한\n체크 포인트는 무엇보다\n건강 상태니까요."
10149-140 = "선생님, 건강 관리는\n제대로 하고 계시겠지요……?"
10149-150 = "으으……\n다이브 컴퓨터를\n새로 사고 싶지만, 예산이……"
10149-160 = "대체로 다이빙을 할 때는\n코토네가 제 버디를\n해주고 있어요."
10149-170 = "코토네는, 시력이 나쁘지만,\n타고난 감이 좋아서……\n조금 부러울 때가 많아요."
10149-180 = "선배들은……\n언제쯤 연락을 해주려나……"
10149-190 = "서, 선생님.\n생신 축하드려요……!"
10149-200 = "기념,\n이라고 하긴 좀 그렇지만……"
10149-210 = "오늘 끓인 된장국에는\n선생님이 좋아하시는 조개를\n잔뜩 넣었답니다."
10149-220 = "부디 맛있게 드셔주세요……!"
10149-230 = "최근에 알게 된 사실이지만……\n오늘은 어느 전설적인 다이버의\n생일이었다고 하네요."
10149-240 = "상관없을지도 모르지만,\n같은 날 태어난 제가\n다이버가 된 걸 보면……"
10149-250 = "세상에는 정말로 운명이라는\n게 있을지도 모르겠어요."
10149-260 = "새해 복 많이 받으세요, 선생님."
10149-270 = "조금 날이 춥긴 하지만……\n새해 기념 다이빙,\n하러 가지 않으시겠어요?"
10149-280 = "바다 위에서는 계란이 귀해서, \n그동안은 줄곧 케이크를\n먹지 못했었지만……"
10149-290 = "올해 크리스마스에는\n홀케이크를 주문했어요.\n부원들과 함께 케이크를 먹을\n생각을 하니 기대가 되네요."
10149-300 = "혹시 괜찮으시다면……\n선생님도 함께 드시겠어요?"
10149-310 = "심해에서는\n하얀 빛으로 반짝이는 \n신비한 해파리를\n볼 수 있다고 하던데……"
10149-320 = "다음 할로윈은 바닷속에서\n보내는 것도 나쁘지 않겠네요."
10149-340 = "아아…… 따듯해……."
10149-350 = "다이빙을 마치고 먹는\n이 따듯한 한 그릇의 맛은……\n각별하네요."
10149-360 = "아, 선생님은 어떠신가요……?"
10149-370 = "혹시 너무 짜거나\n싱겁지는 않으신가요……?"
10149-380 = "다행이다……\n……조미료, 말씀신가요?"
10149-390 = "딱히 특별한 것은……\n인터넷에서 본 레시피대로\n만들었는걸요?"
10149-400 = "조개를 해감하고……\n거품을 걷어내고…… "
10149-410 = "아, 그래도…… 그렇긴 하네요."
10149-420 = "이 국을 먹어 줄\n사람을 생각하며, \n평소보다 더 정성을\n들여 끓였으니까―"
10149-430 = "그게…… 노, 농담이에요!"
10149-440 = "네? 제 된장국을 매일 아침마다\n드시고 싶으시다고요?"
10149-450 = "그 말씀은…… 설마……"
10149-460 = "아뇨. 곤란하진 않지만……"
10149-470 = "……네.\n선생님께서 원하신다면,\n저는 괜찮아요."
10149-2600 = "감사합니다, 선생님.\n이 장비라면, 수중에서의 안정성을\n높일 수 있겠네요.\n후후, 귀여워라……."
