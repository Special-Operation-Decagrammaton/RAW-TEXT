[translation]
10029-10-1 = "ブル～……アーカイブー！"
10029-20-1 = "やあやあ、会えて嬉しいよ先生。\n今日もキャンディーみたいな、甘ーい1日になりそうだぁ。"
10029-30-1 = "何か、おやつは……"
10029-40-1 = "うん、\n良い雰囲気だね～"
10029-50-1 = "ひーまーだー"
10029-60-1 = "あれ、先生は……？"
10029-70-1 = "おお……！\nこれは……！"
10029-80-1 = "おかえり、先生。\nとりあえず何か食べる？"
10029-90-1 = "にひ、待ってたよ～。"
10029-100-1 = "どうしたの、先生？\n……口寂しい？\n飴ちゃんでもあげようか？"
10029-110-1 = "ところで先生、\nお口直しには何が好き？"
10029-120-1 = "別に私だって、\nいっつもお菓子の話ばっかり\nしてるわけじゃないよ～？"
10029-130-1 = "先生……\n別腹、って知ってる？"
10029-140-1 = "これもまた、\nスイーツに込められた哲学……"
10029-150-1 = "どう、感動した？"
10029-160-1 = "先生のお誕生日……"
10029-170-1 = "仕方ない、\n今日は私が奢ってあげよう！"
10029-180-1 = "先生、先生。\n今日が何の日か、\nもちろん知ってるよね？"
10029-190-1 = "すっっっごいの期待してるよ？"
10029-200-1 = "さあ今年の新作は\nどんな感じかなー？"
10029-210-1 = "一緒に買いに行こう、先生！"
10029-220-1 = "果たして今年もサンタさんは、\n私のことを見捨ててしまうのか！"
10029-230-1 = "それとも今年の\nサンタさんは先生！？"
10029-240-1 = "今日はキャンディーが\nたくさん貰える日……！"
10029-250-1 = "行くよ、先生！あ、\nそこのスペースは空けといて！\n今日からしばらく\nキャンディー置き場になるから！"
10029-270-1 = "見て見て先生！すごい……！\nこんなにたくさん！！"
10029-280-1 = "それに、どれもこれも\n見たことない！！"
10029-290-1 = "初めて見た\nお菓子ばっかり……！！"
10029-300-1 = "……あはっ。ごめんごめん、\n何だか急に気が抜けちゃって。"
10029-310-1 = "ありがとね、先生。"
10029-320-1 = "こうして付き合ってくれて。"
10029-330-1 = "ほんと、感謝してるんだ―。"
10029-340-1 = "先生とこうしていられて、\n嬉しいし、楽しいの。"
10029-2600-1 = "うお、すごいねこれ……。\n私で良いの？\n返品とかナシだからね～？"
