[translation]
10010-20-1 = "Second-year of Abydos' Foreclosure Task Force, Sunaookami Shiroko. Hello."
10010-30-1 = "Hmm... This place is spacious. I could get a decent workout in here."
10010-40-1 = "Hmm."
10010-50-1 = "What ride should I go on next?"
10010-60-1 = "I've always wondered what you do here, Sensei."
10010-70-1 = "That reminds me: my gun could use a cleaning."
10010-80-1 = "If there's something you need done, you can always let me know."
10010-90-1 = "Welcome, Sensei. It's good to see you again."
10010-100-1 = "I'm here to help, Sensei."
10010-110-1 = "(Why is Sensei staring at me like that?)"
10010-120-1 = "...Hey, is there something on my face?"
10010-130-1 = "You just felt like staring...? I-I see."
10010-140-1 = "Being together like this isn't so bad."
10010-150-1 = "Happy birthday, Sensei. Why not celebrate by going on a jog together?"
10010-160-1 = "...Is that a no?"
10010-170-1 = "I didn't think you'd remember my birthday."
10010-180-1 = "No, of course I'm glad. I mean it."
10010-190-1 = "Happy New Year, Sensei. I'll be counting on you this year too."
10010-200-1 = "Merry Christmas. I've heard that today is a special day."
10010-210-1 = "Though, I don't know why it's special..."
10010-220-1 = "Will you teach me, Sensei?"
10010-230-1 = "Halloween. I've never experienced it due to how desolate our district is."
10010-240-1 = "Yeah. I don't mind being in a vibrant city for a change."
10010-260-1 = "Is there something you want to talk to me about?"
10010-270-1 = "(What could Sensei be thinking? I wish I knew.)"
10010-280-1 = "(What could they be up to?)"
10010-290-1 = "I just want to be clear that I'm your ally, Sensei."
10010-300-1 = "When you...pat me on the head like that... No, it doesn't bother me or anything."
10010-2600-1 = "I'm a little stronger now, right? Well, as long as it becomes a source of strength for everyone."
