[translation]
20063-10-1 = "ブルーアーカイブ。"
20063-20-1 = "白洲アズサ、\n補習授業部チームに合流した。\nターゲットを見つけたら教えてほしい。"
20063-30-1 = "不思議なものが\nたくさんあるな……\n来るたびに新鮮な\n気持ちになる。"
20063-40-1 = "ここはいろんな人が\n集まっていて楽しい。"
20063-50-1 = "なんだかじっと\n見られている\nような……。"
20063-60-1 = "パラソル、\nどこかに置きたいな。"
20063-70-1 = "どこか休憩\nできる場所は……。"
20063-80-1 = "おかえり、先生。\n私の方は準備万端だ。"
20063-90-1 = "水分補給はしているか？\n体調管理は大事だ。\nちょっと待ってて。"
20063-100-1 = "どう？かっこいい？\n選手のユニフォームらしい。"
20063-110-1 = "スカートが少し短いけど、\nそのぶん動きやすいんだ。"
20063-120-1 = "先生の力になりたい。\n何か私に手伝えることはある？"
20063-130-1 = "パラソル……\nこれはとても良い装備だ。"
20063-140-1 = "上空の赤外線カメラから\n隠れられる。"
20063-150-1 = "補習授業部のみんなと、\n先生が好き。\nだから毎日が楽しみなんだ。"
20063-160-1 = "二人きりの時は、\nコードネームを使わないでいい。"
20063-170-1 = "先生、お誕生日おめでとう。\n私に祝わせてくれて、嬉しい。"
20063-180-1 = "別に、それほど特別な\n日だとは思ってない。"
20063-190-1 = "……幸せな日は、\n誕生日だけじゃないから。"
20063-200-1 = "あけましておめでとう。\nこれからもずっと……\nずっと、よろしく。"
20063-210-1 = "プレゼントをもらったんだ。\nまさか、もらえるとは\n思ってなかった……"
20063-220-1 = "すごく、嬉しい。"
20063-230-1 = "先生、シャーレは危険だ！\n変な格好の不審者が\n大量に入り込んでる！"
20063-240-1 = "ひとまず全員気絶させた。\n今のうちに早く逃げよう！\n私の後についてきて！"
20063-260-1 = "あぁ……先生。\nごめん。"
20063-270-1 = "想定以上に日差しが強くて……\n油断していた。"
20063-280-1 = "ちょっと……\n休憩……。"
20063-290-1 = "……うん、大丈夫。\nすぐに回復する。"
20063-300-1 = "最近はずいぶんと\n弛んでいたみたいだ。\n訓練不足を痛感する。"
20063-310-1 = "今後は先生を\n失望させないようにするから。\n……本当に、ごめん。"
20063-320-1 = "……あっ。"
20063-330-1 = "謝ることじゃない、のか……\nそうか。"
20063-340-1 = "昔だったら……\nひどく怒られていただろうから。\n癖で、つい。"
20063-350-1 = "……風が\n吹いている。"
20063-360-1 = "昔は、風向きを見て、\n弾道への影響や……\n色んなことを気にしてた。"
20063-370-1 = "でも、今は違う。"
20063-380-1 = "ただ涼しくて……\n心地よくて――"
20063-390-1 = "それを先生と\n一緒に感じることができて……\n幸せだ。"
20063-2600-1 = "いつもありがとう、先生。\n私は、先生の力になりたい。\nいつか……先生の決意を、\n私にも背負わせてほしい。"
