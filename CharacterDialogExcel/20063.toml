[translation]
20063-10 = "블루 아카이브."
20063-20 = "시라스 아즈사야.\n보충수업부 팀에 합류했어.\n표적, 찾으면 말 해줘."
20063-30 = "신기한 게 잔뜩 있어,\n매번 새로운 걸\n마주하게 돼."
20063-40 = "여기는 다양한\n사람들이 모여서\n즐거워."
20063-50 = "왠지, 계속\n시선을 받는\n기분인데……."
20063-60 = "우산, 어디에\n기대두고 싶은데."
20063-70 = "잠시, 휴식을\n취할 수\n있는 곳이……."
20063-80 = "어서와, 선생님.\n미리 준비하고 있었어."
20063-90 = "수분 보충은 잘 하고 있어?\n건강 관리는 중요해.\n잠깐 기다려줘."
20063-100 = "어때? 멋있어?\n선수의 유니폼이라는 것 같아."
20063-110 = "치마가 조금 짧긴 한데,\n그만큼 움직이기 편해."
20063-120 = "선생님에게 도움이 되고싶어.\n내가 할 수 있는 일을 알려줘."
20063-130 = "우산,\n아주 좋은 장비야."
20063-140 = "상공의 열화상 카메라로부터\n은폐할 수 있거든."
20063-150 = "보충수업부의 모두들,\n그리고 선생님이 좋아.\n그래서 매일매일이 기대돼."
20063-160 = "단 둘이 있을때는,\n음어로 부르지 않아도 괜찮아."
20063-170 = "선생님, 생일축하해.\n내가 축하해줄 수 있게\n해줘서, 기뻐."
20063-180 = "내가 태어난 날,\n아직도 큰 의미는 안 두고 있어."
20063-190 = "……행복한 날은 많으니까."
20063-200 = "한 해가 지나갔네.\n앞으로도 계속, 계속 잘 부탁해."
20063-210 = "선물, 받았어.\n받을 수 없을거라\n생각했는데……"
20063-220 = "엄청, 기뻐."
20063-230 = "선생님, 샬레가 위험해!\n이상한 옷을 입은 거수자들이\n대거 진입했어!"
20063-240 = "일단 전부 기절시켰어.\n내가 엄호할테니\n어서 도망치자!"
20063-260 = "아아…… 선생님.\n미안."
20063-270 = "햇볕이 예상보다 강해서,\n핑 돌아버렸어."
20063-280 = "조금만……\n쉴게……."
20063-290 = "……으응, 괜찮아.\n쉬면 나아질 거야."
20063-300 = "최근에 너무\n편하게 지냈던 모양이야.\n훈련 부족이 심하네."
20063-310 = "앞으로는 선생님을\n실망시키지 않을테니까.\n……정말, 미안해."
20063-320 = "아……."
20063-330 = "사과할 일이 아닌거구나……\n그런가."
20063-340 = "예전이라면……\n호되게 혼났을 테니까.\n무심코 그랬어."
20063-350 = "바람……\n불어오는구나."
20063-360 = "예전엔, 바람을 맞으면\n탄도에 영향이라던지……\n이런저런걸 신경썼어."
20063-370 = "하지만, 지금은 달라."
20063-380 = "그냥, 시원하고\n행복하고……."
20063-390 = "그런 것들을 선생님과\n함께 느낄 수 있어서……\n행복해."
20063-2600 = "항상 고마워 선생님.\n나는, 선생님의 힘이 되고싶어.\n언젠가…… 선생님의 결의를,\n나도 짊어질 수 있게 해줘."
