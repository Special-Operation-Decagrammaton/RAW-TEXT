[translation]
10102-10-1 = "B-Blue Archive...!"
10102-20-1 = "Hee, heehee. I'm finally here...! Summer, the beach... This is so amazing!"
10102-30-1 = "What do they...do here?"
10102-40-1 = "Heehee... It's nice and cool...although I'll be hot again as soon as I go out..."
10102-50-1 = "Saori must be..."
10102-60-1 = "A magazine sweepstakes postcard. Can I fill it out here?"
10102-70-1 = "The swimsuit seems...tighter than I'd like. I hope nothing's wrong with me..."
10102-80-1 = "Oh, S-Sensei! Are you not going to play in the water today...?"
10102-90-1 = "Heehee... I'm on duty today... Excuse me...!"
10102-100-1 = "Hee... Heehee. If it's all right, can I have an ice cream...?"
10102-110-1 = "What?! You already got one for me...?"
10102-120-1 = "Thank you! I knew it, Sensei...!"
10102-130-1 = "The magazines at Schale are two months old!"
10102-140-1 = "I knew it. Life is hard..."
10102-150-1 = "Hee... Heehee. I know something that'll make you despair..."
10102-160-1 = "The lounge refrigerator is out of ice cubes."
10102-170-1 = "I knew life was a pain... Even more so in summer."
10102-180-1 = "Heehee... Wh-What? This? Um, it's a picture I took at the beach..."
10102-190-1 = "Would you like to see it, Sensei?"
10102-200-1 = "Heehee. It's full of cold desserts. Can I bring everyone from the Squad next time?"
10102-210-1 = "Happy birthday...!"
10102-220-1 = "Weird to celebrate the day your pain began, but I guess it's okay to enjoy it if you want to..."
10102-230-1 = "My birthday? I'm usually not all that interested..."
10102-240-1 = "But thanks to what you said, it's starting to feel kind of special."
10102-250-1 = "Happy New Year... Another year of pain, but we have to live through it..."
10102-260-1 = "Heehee. I hope we get along well this year too."
10102-270-1 = "I-It's a Christmas gift...! It's nothing, really. I bought it at the convenience store."
10102-280-1 = "I-I'd appreciate it if...you accept it. Heehee."
10102-290-1 = "I-I have no candy... Y-You can play tricks on me instead..."
10102-300-1 = "What? Sensei, you're giving it to me?"
10102-310-1 = "Heeheehee. Thank you very much."
10102-330-1 = "Ouchie... It hurts..."
10102-340-1 = "Eek! My popsicle..."
10102-350-1 = "It's ruined! Totally ruined! I only took one bite, and now it's covered in sand!"
10102-360-1 = "I guess even a popsicle is a luxury I don't deserve! Life has forsaken me!!"
10102-370-1 = "Why is my life filled with such hardships?"
10102-380-1 = "Everyone else gets to enjoy their summer..."
10102-390-1 = "No matter how hard I try, it's a dream I'll never get to reach..."
10102-400-1 = "...What? You'll buy me another one?"
10102-410-1 = "You mean to say, if I didn't drop the first popsicle, I would've had two popsicles instead?!"
10102-420-1 = "UWAAAH! Everything really is terrible!"
10102-2600-1 = "Hee... Heehee. What a precious gift... I-I won't give it back, even if you ask for it later...!"
