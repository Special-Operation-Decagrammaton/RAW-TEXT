[translation]
26005-20-1 = "อย่าดูถูกว่าฉันตัวเล็กนะ!\nถึงจะเล็กก็เล็กพริกขี้หนูแล้วกัน!"
26005-30-1 = "ฉันยังโตได้กว่านี้อีก...\nเชื่อกันบ้างสิ! ฮึ่ม!"
26005-40-1 = "ฮิฮิ นอนสักงีบ\nแล้วค่อยไปต่อดีมั้ย?"
26005-50-1 = "(เฮ้อ... ทำไมคุณครูถึง\nไม่มีเซนส์เอาซะเลย)"
26005-60-1 = "อยากกินของหวานอร่อยๆ!\nอ๊ะ! นั่นคุณครูนี่นา!"
26005-70-1 = "ฮือ ฉันไม่ชอบนมจืด\nยิ่งรู้ว่าต้องกินนมให้มากๆ\nก็ยิ่งไม่ชอบ!\nหืม? นะ.. นมสตรอว์เบอร์รี่เหรอ?"
26005-80-1 = "อย่ามาลูบหัวฉันนะ!\nชิ... ฉันไม่ชอบถูกมองว่าเป็นเด็ก"
26005-90-1 = "อีกไม่กี่ปีฉันก็จะคงถูกมองว่า...\nเป็นคนรักมากกว่าเป็นน้องสาว\nใช่มั้ย?"
26005-100-1 = "ฉันดื่มนมครั้งละ 1 ลิตรเลยละ\nแล้วก็ดื่มทุกวันเลยด้วย!"
26005-110-1 = "ถ้าต้องอยู่เวร ก็แสดงว่าฉันจะ\nได้มีเวลากินขนมอร่อยๆ\nกับคุณครูใช่มั้ย?"
26005-120-1 = "วันนี้ก็ตั้งใจเข้าล่ะ!\nแล้วฉันจะช่วยอีกแรง!"
26005-130-1 = "เอ๋?\nทำไมสีหน้าคุณครูดูไม่ดีเลย?"
26005-140-1 = "ปะ.. ไปกินของหวานอร่อยๆ กันมั้ย?"
26005-150-1 = "ฮึ่ม! ตราบใดที่ฉันอยู่ตรงนี้\nก็อย่าหวังว่าจะอู้งานได้เลย!\nตั้งสติ! นี่มันเวลาทำงานนะ!\nเริ่มทำงานกันเถอะ!"
26005-160-1 = "คุณครู สุขสันต์วันเกิดนะ!\nแถวนี้มีร้านของหวานอร่อยๆ ด้วยละ\nไปกันเถอะ!"
26005-170-1 = "ขะ... ขอบคุณนะ"
26005-180-1 = "(จะต้องผ่านวันเกิดอีกกี่ปี\nฉันถึงจะโตเป็นสาว\nและอยู่ข้างๆ คุณครูได้นะ?)"
26005-190-1 = "มะ.. ไม่ได้คิดอะไรอยู่สักหน่อย\nจะจ้องจนลูกตาทะลุออกมา\nเลยหรือไง?!"
26005-200-1 = "สวัสดีปีใหม่! เป้าหมายของปีนี้เหรอ?\nก็เห็นกันอยู่ชัดๆ อยู่แล้วนี่!\nฉันจะต้องหุ่นดีให้ได้!!"
26005-210-1 = "เมอร์รีคริสต์มาส\nฉันชอบวันคริสต์มาส!\nเพราะถนนทุกเส้น\nเต็มไปด้วยสีที่ฉันชอบไง!"
26005-220-1 = "Trick or Treat~\nนี่คือฮาโลวีนพิเศษของ\nชมรมของหวานหลังเลิกเรียน!\nไปกันเถอะ!"
26005-230-1 = "ถึงฉันจะไม่ค่อยสนใจเรื่องผีเท่าไร\nแต่วันนี้เราจะได้กินขนม\nกันไม่อั้นเลยนะ!"
26005-250-1 = "จริงๆ เลย จะบอกว่าคุณครู\nทำฉันตกใจทุกครั้งเลยได้มั้ยนะ..."
26005-260-1 = "หรือจะบอกว่า\nเดาทางไม่ออกดีนะ..."
26005-270-1 = "...หืม? ทำไมถึงจ้องเขม็งแบบนั้นล่ะ?"
26005-280-1 = "นี่... คงไม่ได้คิดอะไรแปลกๆ\nอยู่หรอกใช่มั้ย?"
26005-290-1 = "ฉันไม่ใช่ของเล่นของคุณครูนะ"
26005-300-1 = "ถ้าไม่ล้อเล่นกันแค่พอดีๆ\nฉันจะโกรธจริงๆ แล้วนะ"
26005-310-1 = "...เปล่าหรอก ที่จริงฉันก็\nไม่ได้เกลียดอะไรขนาดนั้นหรอก..."
26005-320-1 = "ฮุฮุ..."
26005-330-1 = "(สักวันหนึ่ง...)"
26005-340-1 = "(วันที่จะได้...\nเดินเคียงข้างกันไปแบบนี้\nคงจะมาถึงใช่มั้ย...?)"
26005-2600-1 = "ถ้ารับของแบบนี้มาละก็ คงจะต้อง...\nพยายามอย่างสุดขั้วไปเลยสินะ!"
