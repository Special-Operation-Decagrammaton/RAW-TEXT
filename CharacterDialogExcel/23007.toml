[translation]
23007-10-1 = "Blue Archive"
23007-20-1 = "ฉันอุราวะ ฮานาโกะค่ะ\nจากนี้ก็ขอฝากตัวในหลายๆ เรื่องด้วยนะคะ\nใช่แล้วค่ะ \"หลายๆ เรื่อง\" เลยค่ะ"
23007-30-1 = "ตายจริง\nที่นี่ดูน่ารักดีนะคะ~"
23007-40-1 = "คุณครู\nตกแต่งที่นี่เองเหรอ?\nสุดยอดเลยนะคะ"
23007-50-1 = "ถ้าหนีไปจากที่นี่ตอนนี้เลย\nจะทำให้ใครตกใจมั้ยนะ...?"
23007-60-1 = "ฮุฮุ แกล้งหยอกเล่น\nสักหน่อยดีมั้ยคะ?"
23007-70-1 = "แค่ได้มองดูที่นี่\nก็สนุกแล้วละค่ะ"
23007-80-1 = "มาแล้วเหรอคะคุณครู?\nวันนี้ก็ฝากตัวด้วยนะคะ"
23007-90-1 = "ฮิฮิ ฉันกำลังรออยู่เลยค่ะ"
23007-100-1 = "ฮุฮุ การมา 'เข้าเวร' แบบนี้\nฉันว่ามันก็สนุกดีนะคะ"
23007-110-1 = "ตอนนี้ที่นี่...\nมีแค่เราเพียงสองคนเท่านั้น"
23007-120-1 = "แบบนี้ฉันแอบคาดหวังได้หรือเปล่าคะ?"
23007-130-1 = "หมายความว่า... ยังไงน่ะเหรอคะ?"
23007-140-1 = "เรื่องนั้นคราวนี้...\nอาจเหมือนกับที่คุณครูคิด..."
23007-150-1 = "คุณครูคะ มีอะไรให้ฉันช่วยหรือเปล่าคะ"
23007-160-1 = "ฮิฮิ ฉันอยากเห็นสีหน้าแบบนั้น\nของคุณครูอีกครั้งน่ะค่ะ"
23007-170-1 = "สุขสันต์วันเกิดค่ะคุณครู"
23007-180-1 = "มีของขวัญที่อยากได้รึเปล่าคะ?\nถ้าไม่มีละก็..."
23007-190-1 = "เอาเป็น \"อันนั้น\" มั้ยคะ?"
23007-200-1 = "ของขวัญวันเกิด..."
23007-210-1 = "คุณครูคือของขวัญของฉันเหรอคะ?\nสุดยอดเลยค่ะ"
23007-220-1 = "ฉันขอแกะของขวัญได้มั้ยคะ?"
23007-230-1 = "ในปีนี้ ฉันก็ขอ...\nฝากตัวด้วยนะคะ คุณครู"
23007-240-1 = "ถึงฉันจะทำให้คุณครู\nลำบากหลายๆ เรื่อง\nแต่ก็ห้ามทิ้งฉันเด็ดขาดนะคะ"
23007-250-1 = "คืนวันคริสต์มาส...\nอา... ฉันตั้งตารอแล้วค่ะ"
23007-260-1 = "อา...\nฉันพูดคนเดียวน่ะ\nไม่ต้องใส่ใจหรอกค่ะ"
23007-270-1 = "ถ้าเป็นวันฮาโลวีนล่ะก็\nเป็นวันที่ฉันจะได้...\nใส่ชุดที่ดูล่อแหลมนิดๆ ได้..."
23007-280-1 = "คะ...?\nเข้าใจผิดเหรอคะ?"
23007-300-1 = "สวัสดีค่ะ คุณครู"
23007-310-1 = "ขอบคุณที่มานะคะ"
23007-320-1 = "ที่นี่อากาศเย็นสบาย\nฉันก็เลยชอบมากเลยค่ะ"
23007-330-1 = "ที่นี่เป็นที่พิเศษ\nของฉันคนเดียวค่ะ ฮิฮิ"
23007-340-1 = "ที่นี่ยอดเยี่ยมมาก\nคุณครูคิดว่าเป็นยังไงคะ?"
23007-350-1 = "มาลองถอดด้วยกันมั้ยคะ?"
23007-360-1 = "ฮิฮิฮิ ถ้าให้ถอดของพวกนี้ออก\nตอนกลางวันแสกๆ แบบนี้ละก็..."
23007-370-1 = "มันก็ดูน่าตื่นเต้นดีไม่ใช่เหรอคะ?"
23007-380-1 = "รู้สึกเหมือนกำลัง...\nทำเรื่องต้องห้ามอยู่เลย"
23007-2600-1 = "คุณครูนี่รับมือยากจริงๆ นะคะ...\nอยากเห็น \"ทุกๆ อย่าง\" ของฉันเหรอคะ?\nฮิฮิ.. พูดถึงทักษะของฉันต่างหากค่ะ\nคิดอะไรเหรอคะ"
