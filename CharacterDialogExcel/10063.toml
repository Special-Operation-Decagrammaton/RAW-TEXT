[translation]
10063-10-1 = "ブルー！アーカイブ！"
10063-20-1 = "なんか面白いことないですか～？\n黒崎コユキ、来ちゃいました！！\nに・は・は・は！！"
10063-30-1 = "うわぁ！なんだか\n不思議なものが\nいっぱいですね！"
10063-40-1 = "こ、ここって安全\n地帯ですよね！？\n誰かに連れていかれたり\nとかしませんよね！？"
10063-50-1 = "へぇ、ここが\n噂の……。"
10063-60-1 = "もしかしてここって……\n騒がしい人は追い出される\nシステムだったりします\n！？"
10063-70-1 = "はっ……！！\n……お腹空いたぁ。"
10063-80-1 = "お帰りなさい、先生！"
10063-90-1 = "待ちくたびれましたよ～！"
10063-100-1 = "にはは、先生！"
10063-110-1 = "……え？いえ？\n何も触ってませんよ？"
10063-120-1 = "多分……？"
10063-130-1 = "なにかお役に立ちたいです～"
10063-140-1 = "もしかして……\nじっとしているほうが\n役に立ったり？"
10063-150-1 = "計算……ですか？"
10063-160-1 = "楽勝ですよ！\n好きじゃないだけで。"
10063-170-1 = "もしかして、パスワードを\n確認するために呼びました？"
10063-180-1 = "私はメモ帳じゃないですよ～？"
10063-190-1 = "あ、私がここにいるって\n先輩たちに言ってくれました？"
10063-200-1 = "ちゃんと連絡してないと、\nあとで怒られちゃうから……。"
10063-210-1 = "え？退屈じゃないですよ～？"
10063-220-1 = "……うん？……さあ？\nなんででしょう？"
10063-230-1 = "ハッピーバースデー！\nせ・ん・せ・い！"
10063-240-1 = "今日は先生のお願い、\nなんでも聞いて\nあげちゃいますよ！"
10063-250-1 = "はいっ！今日は私の\n誕生日です！"
10063-260-1 = "にははっ！今日は\n運がいい日だといいなぁ～\nそうじゃないと困ります！"
10063-270-1 = "あけまして\nおめでとうございます～！"
10063-280-1 = "うあ～もう1年が\n過ぎちゃった……！"
10063-290-1 = "……あれ？年って過ぎるもの？\nそれとも来るもの？\nどっちだと思います？"
10063-300-1 = "メリークリスマース！\n今日はたくさん遊んで良い日！"
10063-310-1 = "そうですよね？"
10063-320-1 = "今日はなんだか、\n変な恰好をした人が\n多いですね～。"
10063-330-1 = "……私ですか？\nわ、私～は～そんなこと～"
10063-340-1 = "ないような～そうでもない\n……ような？にはは……？"
10063-360-1 = "先生！見てください！！\n四葉のクローバーですよ！！"
10063-370-1 = "どういうこと！？\nさっきまでなかったのに！"
10063-380-1 = "もしかして……\nいきなり生えたとか？"
10063-390-1 = "や、そんなの\nありえないか……。"
10063-400-1 = "見落としてたのかな\n……？"
10063-410-1 = "先生はいつ\n気づいたんですか？"
10063-420-1 = "それに、どうやって、\nこんな……"
10063-430-1 = "タイミングよく…\n見つかる、なんて……？"
10063-440-1 = "……！！！"
10063-450-1 = "……なるほど……！\nそうですね……！！"
10063-460-1 = "……はい！"
10063-470-1 = "そう考えたほうが、\nきっと……。"
10063-480-1 = "……楽しいですもんね！！"
10063-2600-1 = "えっ……んん？？\nいいんですか？\nこれ、本当に大丈夫ですか！？\n先生、もしかして私のこと……\n本当に、信じてくれるんですか……？"
