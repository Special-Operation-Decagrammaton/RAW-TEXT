[translation]
10105-10-1 = "ブルーアーカイブ！"
10105-20-1 = "アイドルはあまりやったことがありませんが……\n精いっぱい努めて参りますね。\nよろしくお願いいたします、先生！"
10105-30-1 = "とても心地よい\n空間ですね。"
10105-40-1 = "何か視線を\n感じるような……？"
10105-50-1 = "次はなにを\nしましょう……？"
10105-60-1 = "何かお手伝い\nできることは\nありませんか？"
10105-70-1 = "握手会……？\nチェキ……？"
10105-80-1 = "お待ちしておりました、先生。\n準備は万全ですよ。"
10105-90-1 = "それでは聞いて下さい。\n一曲目は、この曲です。"
10105-100-1 = "先生がお望みでしたら……\nステージでも、\nそれ以外でも……\n歌を届けます。"
10105-110-1 = "私の歌で先生が幸せに\nなってくださるのなら……\nそれ以上望むことは\nありません。"
10105-120-1 = "あ、握手ですか？\nはい、どうぞ。"
10105-130-1 = "あ、あはっ、あはは……！\nせ、先生、\nく、くすぐったいです……！"
10105-140-1 = "もう……そんなことを\nするのでしたら私も……！\nえい！"
10105-150-1 = "お誕生日\nおめでとうございます、先生。\nこの歌を先生に捧げますね。"
10105-160-1 = "私の誕生日……"
10105-170-1 = "自分が主役の日というのは、\nいつまで経っても\n慣れませんね。"
10105-180-1 = "でも、そんな風に\n言っていただけて、\nとても嬉しいです。\nありがとうございます、先生。"
10105-190-1 = "明けまして\nおめでとうございます、先生。"
10105-200-1 = "今年もより多くの方に\n歌を届けられる……"
10105-210-1 = "そんな幸せに満ちた\n一年であることを、\n祈っております。"
10105-220-1 = "聖なる夜……\n賛美歌を皆さんに\n届ける日です。"
10105-230-1 = "ええ、歌うのに\nぴったりの格好ですから。"
10105-240-1 = "こ、これは仮装では\nないのですが……"
10105-250-1 = "でも……先生が\n気に入っているのでしたら……\nこのままでいますね。"
10105-270-1 = "先生、待っていて\nくださったのですね！"
10105-280-1 = "まさかずっとここで\n待っていて\nくださったなんて……"
10105-290-1 = "その……ステージ、\nどうでしたか？"
10105-300-1 = "舞台袖からだと\nあんまり良く見えなかったとは\n思うのですが……"
10105-310-1 = "でも、先生はずっと\n見守ってくださって\nいたから……"
10105-320-1 = "舞台袖からでも\n大丈夫かな……"
10105-330-1 = "その……\nパフォーマンス、どうでした？"
10105-340-1 = "ちゃんと……\n「アイドル」に\nなれていました？"
10105-350-1 = "……！！"
10105-360-1 = "……ありがとうございます、\n先生……！"
10105-370-1 = "……えへへ。"
10105-2600-1 = "今なら、なんでも先生に\n言えるような気がするんです。\nその…なので、聞いても忘れてくださいね。\n…これからも、ずっと私の\nそばにいてください。約束ですよ。"
