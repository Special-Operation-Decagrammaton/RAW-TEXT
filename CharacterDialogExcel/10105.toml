[translation]
10105-10-1 = "Blue Archive!"
10105-20-1 = "ฉันไม่เคยทำอะไรอย่างไอดอลเท่าไร...\nแต่ฉันจะตั้งใจทำให้เต็มที่ค่ะ\nรบกวนด้วยนะคะคุณครู!"
10105-30-1 = "บรรยากาศอบอุ่นจังเลยนะคะ"
10105-40-1 = "ที่มองแบบนั้น...\nเป็นเพราะชุดเหรอคะ?"
10105-50-1 = "ครั้งหน้า\nทำอะไรดีคะ...?"
10105-60-1 = "มีงานอะไร\nให้ฉันช่วยมั้ยคะ?"
10105-70-1 = "งานจับมือ...?\nถ่ายรูปเชกิ...?"
10105-80-1 = "กำลังรออยู่เลยค่ะ คุณครู\nฉันเตรียมพร้อมอย่างเต็มที่เลยค่ะ"
10105-90-1 = "งั้นก็ช่วยฟังด้วยนะคะ\nเพลงแรกคือเพลงนี้ค่ะ"
10105-100-1 = "ถ้าคุณครูต้องการละก็...\nไม่ว่าจะบนเวที หรือที่ไหนๆ...\nฉันก็จะร้องเพลงให้ค่ะ"
10105-110-1 = "ถ้าเพลงของฉัน\nทำให้คุณครูมีความสุขได้...\nฉันก็ไม่ปรารถนาอะไรอื่นแล้วค่ะ"
10105-120-1 = "หืม? ขอจับมือเหรอคะ?\nได้เสมอเลยค่ะ!"
10105-130-1 = "อ่า... ฮ่าฮ่า ฮ่าฮ่าฮ่า...!\nคะ... คุณครู\nจะ... จั๊กจี้นะคะ...!"
10105-140-1 = "จริงๆ เลย... ถ้างั้น\nฉันจะทำบ้างนะคะ...! นี่แน่ะ!"
10105-150-1 = "สุขสันต์วันเกิดค่ะ คุณครู\nฉันขอมอบเพลงนี้ให้คุณครูค่ะ"
10105-160-1 = "วันของฉัน..."
10105-170-1 = "ความรู้สึกนี้\nฉันยังไม่ชินเลยค่ะ"
10105-180-1 = "แต่ก็ดีใจนะคะ\nขอบคุณค่ะ คุณครู"
10105-190-1 = "สวัสดีปีใหม่ค่ะคุณครู"
10105-200-1 = "ขอให้ปีนี้\nเป็นปีที่มีความสุข..."
10105-210-1 = "และมอบเพลงเป็นของขวัญ\nให้กับหลายๆ คนได้นะคะ"
10105-220-1 = "คืนศักดิ์สิทธิ์... วันนี้เป็นวันที่\nร้องเพลงสรรเสริญพระเจ้า\nให้หลายๆ คนฟังค่ะ"
10105-230-1 = "ค่ะ ก็ชุดนี้เหมาะกับ\nการร้องเพลงนี่คะ"
10105-240-1 = "นะ... นี่ไม่ใช่\nการปลอมตัวนะคะ..."
10105-250-1 = "แต่ถ้า... ถูกใจคุณครูละก็...\nฉันจะอยู่อย่างนี้ให้คะ"
10105-270-1 = "คุณครู\nรอฉันเหรอคะเนี่ย!"
10105-280-1 = "รอฉันอยู่ที่นี่ตลอด\nจริงๆ อย่างนั้นเหรอ..."
10105-290-1 = "คือว่าฉัน...\nร้องเพลงเป็นยังไงบ้างคะ?"
10105-300-1 = "ฉันคิดว่าอยู่หลังเวที\nไม่น่าจะเห็นชัดนะคะ..."
10105-310-1 = "แต่ว่า... คุณครูคอยดูฉัน\nอยู่ตลอดเลยนี่นา"
10105-320-1 = "ถึงอยู่ด้านหลังเวที...\nก็คงไม่เป็นไรสินะคะ..."
10105-330-1 = "สะ... แสดงใช้ได้รึเปล่าคะ...?\nฉันน่ะ..."
10105-340-1 = "เหมือน 'ไอดอล'\nตัวจริงหรือยังคะ?"
10105-350-1 = "...!!"
10105-360-1 = "ขอบคุณค่ะ...\nคุณครู...!!"
10105-370-1 = "ฮิฮิๆ..."
10105-2600-1 = "ฉันในตอนนี้สามารถพูดสิ่งที่ปกติแล้ว\nฉันไม่กล้าพูดค่ะ ฟังคำที่ฉันจะบอก\nแค่ตอนนี้แล้วปล่อยผ่านไปนะคะ\nคุณครู... ไว้ในอนาคตก็... ต้องอยู่กับฉันนะคะ"
