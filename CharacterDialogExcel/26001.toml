[translation]
26001-20-1 = "Otose Kotama from Millennium Science School. I find you very intriguing."
26001-30-1 = "There's a wiretapping device in this cafe... Hmm, I see..."
26001-40-1 = "The signal is unstable."
26001-50-1 = "How odd. Sensei's GPS signal was detected nearby..."
26001-60-1 = "Look at the cafe's new dessert. Uploading to my blog now..."
26001-70-1 = "New Momo Friends merchandise. The time of reckoning...has arrived."
26001-80-1 = "There you are. I could hear you approaching by the sound of your footsteps."
26001-90-1 = "That was a surprise. I nearly screamed, with you showing up out of nowhere like that."
26001-100-1 = "I see your call history is exclusively female students."
26001-110-1 = "I would like an explanation."
26001-120-1 = "...Crime? What do you mean? Wiretapping is not a crime."
26001-130-1 = "Would you care to explain the post that just went up on your private account?"
26001-140-1 = "Sensei, could I ask you to sing a song for me?"
26001-150-1 = "Please sing into this voice recorder."
26001-160-1 = "I can hear the voice of other girls looking for you, Sensei."
26001-170-1 = "...Let's ignore them."
26001-180-1 = "Happy birthday, Sensei. Though you've probably heard that many times today already..."
26001-190-1 = "Then again, it is a sentiment that never loses value or meaning, even over time."
26001-200-1 = "Thank you...for wishing me a happy birthday."
26001-210-1 = "Hearing it from you means more to me than all the other well wishes today."
26001-220-1 = "I look forward to hearing your voice in the coming year more than anything else."
26001-230-1 = "Christmas is an excellent time to listen to wiretaps. You hear all kinds of interesting stories and talks."
26001-240-1 = "Same as...lovers whispering sweet nothings."
26001-250-1 = "I wonder what a rapping Halloween ghost is supposed to sound like."
26001-260-1 = "I could always bug it if I get the chance... I mean, record it. With consent."
26001-280-1 = "Oh, Sensei."
26001-290-1 = "Sorry... I was caught up in the music."
26001-300-1 = "This music?"
26001-310-1 = "Heh heh. Sensei, are you really that curious?"
26001-320-1 = "It's not really music. It's just...people talking, and the noise that comes with that."
26001-330-1 = "It's called \"Urban Ambiance.\""
26001-340-1 = "There's no rhythm or melody..."
26001-350-1 = "But there's plenty to listen to. The beats of everyday conversation, the chorus of a crowd..."
26001-360-1 = "These sounds don't come from instruments or vocalists. They come from people, real people. For some reason, that's better than any music to me."
26001-370-1 = "And I wish I could listen to it forever."
26001-2600-1 = "Adjusting the hertz... Can you hear me?"
