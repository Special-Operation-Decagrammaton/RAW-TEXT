[translation]
16005-10-1 = "ブルーアーカイブぅー！"
16005-20-1 = "きひひっ……あっ、せ、先生……！？"
16005-30-1 = "こ、ここにいても、\n本当に良いのか……"
16005-40-1 = "うぅ、はっ！？\nせ、先生……！？"
16005-50-1 = "え、えっと……\nあのぅ……うう……\nうああぁぁぁあ！"
16005-60-1 = "戦場より、\n落ち着かない……"
16005-70-1 = "わ、私にはその、\nこういうところは\nあまり……！"
16005-80-1 = "お、おかえりなさい先生！"
16005-90-1 = "きょ、今日もよろしく、\nお願いします……っ。"
16005-100-1 = "お、お待ちして\nおりました！\n先生！"
16005-110-1 = "くひ……くひひ……\nくひひひひ！！"
16005-120-1 = "きゃぁぁっ"
16005-130-1 = "ははははははははは！！！\nきゃひゃひゃひゃひゃ！！"
16005-140-1 = "……あっ。\nせ、先生……？"
16005-150-1 = "い、いつからそこに……"
16005-160-1 = "え……？\nさっきからずっと……！？\nそ、そんな……！！"
16005-170-1 = "こ、これは……その……"
16005-180-1 = "何と説明をすれば……"
16005-190-1 = "せ、先生のお誕生日……！\nわ、私にできることなら、\n何でも言ってください、\n先生……！"
16005-200-1 = "……え？誕生日……？\nわ、私の誕生日をお祝い……！？"
16005-210-1 = "……あ、ありがとう\nございます、先生……！"
16005-220-1 = "こ、今年もよろしく\nお願いします、先生……！"
16005-230-1 = "こ、こういう日には\nあまり相応し\nくない身なりかもしれません……"
16005-240-1 = "……え？\n逆に悪くない、ですか……？"
16005-250-1 = "街全体が怪しく光ってて、\n賑やかで……"
16005-260-1 = "これが、\nハロウィン……。"
16005-280-1 = "きひっ、\nきゃははははははっ！"
16005-290-1 = "あ、すみません……\nありがとうございます、先生。"
16005-300-1 = "こうして海で遊んだのは、\n初めてでして。\n楽しいですが、"
16005-310-1 = "同時に思ったより体力が\n要るものなのですね……。"
16005-320-1 = "ちょっとだけ、\n疲れました。"
16005-330-1 = "……そういえば先生。\nふと思い出したのですが、"
16005-340-1 = "この水着ずっと、\n少し窮屈で…。"
16005-350-1 = "もしかして、\nサイズが合って\nないのでしょうか……。"
16005-360-1 = "あ、あれ……\nど、どうかしましたか！？"
16005-370-1 = "わ、わ、私また、\n何か変なことを……！？"
16005-2600-1 = "うふふふ……これで、確実に……\nうひひひひひっ！！！"
