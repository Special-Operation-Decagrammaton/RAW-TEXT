[translation]
20023-10-1 = "蔚藍檔案。"
20023-20-1 = "我是女武神警察學園公安局的局長尾刃環奈。\n要審問犯罪者的話，請交給我。"
20023-30-1 = "這裡的咖啡…\n味道真不錯。"
20023-40-1 = "好累…"
20023-50-1 = "這種地方居然有\n兔子偵探系列的\n新作…？"
20023-60-1 = "唔，防衛室\n傳來了聯絡……"
20023-70-1 = "希望今天奇普托斯\n也能很和平。"
20023-80-1 = "恭候多時了，老師。"
20023-90-1 = "如果需要公安局\n的力量，請隨時告知。"
20023-100-1 = "…有事件嗎？"
20023-110-1 = "請稍等。\n我這就去發行搜查令。"
20023-120-1 = "要讓公安局出動\n需要很多文件……"
20023-130-1 = "我偶爾會羨慕夏萊\n能夠迅速地進行應對。"
20023-140-1 = "當然，我並沒有\n能夠背負這些的\n能力與權限……"
20023-150-1 = "我想去泡點咖啡…\n老師也要喝嗎？"
20023-160-1 = "生活安全局的孩子們\n是很優秀的警察…"
20023-170-1 = "但要擔任重大案件\n的負責人還太早了。"
20023-180-1 = "我並不喜歡甜甜圈。\n因為手會弄髒。"
20023-190-1 = "狂犬這個綽號…"
20023-200-1 = "那個…因為很羞恥，\n請盡量別在別人面前\n這樣叫我。"
20023-210-1 = "今天是您的生日呀。\n恭喜您。"
20023-220-1 = "身為女武神警察學園的\n在籍人員，"
20023-230-1 = "我沒辦法直接\n送禮物給您……"
20023-240-1 = "不介意的話，\n我請您去我常去的店裡吃飯吧。"
20023-250-1 = "啊…今天是我的生日啊。"
20023-260-1 = "雖然一早就被\n局裡的人們恭喜…"
20023-270-1 = "我誤以為是在祝賀\n昨天順利逮捕\n犯人的事情了。"
20023-280-1 = "祝您新年快樂。"
20023-290-1 = "今年要是能\n少在搜查中碰面\n就好了呢。"
20023-300-1 = "……難道，您今天也要加班？"
20023-310-1 = "很遺憾，\n我今天也得值班。"
20023-320-1 = "……難得的聖誕節。"
20023-330-1 = "別喝黑咖啡，改喝\n香甜的拿鐵怎麼樣呢？"
20023-340-1 = "我這就去拿。"
20023-350-1 = "萬聖節……"
20023-360-1 = "又回到會拖慢搜查\n的麻煩時期了呢。"
20023-370-1 = "如果變裝隊伍中\n混入了犯人，"
20023-380-1 = "比對照片的難度\n就會大大提升…"
20023-390-1 = "真傷腦筋。"
20023-410-1 = "沒想到老師會來\n這種路邊攤……"
20023-420-1 = "真是出乎我的意料…"
20023-430-1 = "是嗎？"
20023-440-1 = "我在這裡\n最能放鬆。"
20023-450-1 = "就算是大家害怕的\n不眠不休的公安局的局長…"
20023-460-1 = "…也是需要，\n能夠卸下鎧甲的地方。"
20023-470-1 = "所以今天，"
20023-480-1 = "如果您能當作\n沒看見的話，我會很感激的。"
20023-2600-1 = "這麼說來，我曾經因為\n無法操縱這把槍而費了一番功夫。\n到了熟悉這把槍的現在，\n卻幾乎沒有機會使用，真是遺憾……"
