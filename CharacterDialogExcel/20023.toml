[translation]
20023-10-1 = "Blue Archive."
20023-20-1 = "I'm Ogata Kanna of the Valkyrie Police School Public Peace Bureau. Leave criminal interrogations to me."
20023-30-1 = "The coffee here...smells pretty nice."
20023-40-1 = "I'm tired..."
20023-50-1 = "The new Cottontail Detective series is at a place like this...?"
20023-60-1 = "Ugh, I got a message from the Defense Office."
20023-70-1 = "I'm hoping for a peaceful day in Kivotos!"
20023-80-1 = "I've been waiting, Sensei."
20023-90-1 = "Let me know if you ever need the power of the Public Peace Bureau."
20023-100-1 = "...Was there an incident?"
20023-110-1 = "Please wait a moment. I'll request a warrant."
20023-120-1 = "A lot of documentation is needed for a Public Peace Bureau dispatch."
20023-130-1 = "I sometimes envy Schale's ability to execute quick responses."
20023-140-1 = "I don't have the ability or authority to take care of this, but..."
20023-150-1 = "I'm going to make some coffee. Would you like a cup?"
20023-160-1 = "The students at the Public Safety Bureau make for good police, but..."
20023-170-1 = "They're too inexperienced to deal with the heavier crimes..."
20023-180-1 = "I don't like donuts very much. They make my hands too messy."
20023-190-1 = "About the Feral Hound nickname..."
20023-200-1 = "Umm... I'd prefer it if you didn't call me that in front of others... It's embarrassing."
20023-210-1 = "Today's your birthday. Happy birthday."
20023-220-1 = "As a public official of Valkyrie Police School,"
20023-230-1 = "I'm not in a position to give you gifts. However..."
20023-240-1 = "If it's okay with you, I'd like to take you to lunch at my favorite restaurant."
20023-250-1 = "Oh... Today's my birthday."
20023-260-1 = "The staff's been talking about it since this morning."
20023-270-1 = "I thought they were discussing the criminal we arrested yesterday."
20023-280-1 = "I hope you have a happy New Year."
20023-290-1 = "I hope we get to meet for occasions other than investigations this year."
20023-300-1 = "...Are you working overtime again?"
20023-310-1 = "As it happens, I'm on duty today as well."
20023-320-1 = "...It's Christmas, so..."
20023-330-1 = "How about a sweet latte, instead of just black coffee?"
20023-340-1 = "I'll bring it right away."
20023-350-1 = "Halloween..."
20023-360-1 = "It's a troublesome time that can hamper our investigations."
20023-370-1 = "If a criminal hides in a group of people wearing costumes,"
20023-380-1 = "it becomes difficult to locate them. Masks ruin facial sketches."
20023-390-1 = "It is troublesome."
20023-410-1 = "I didn't expect to run into you here..."
20023-420-1 = "I lost my composure. Sorry."
20023-430-1 = "Is that so?"
20023-440-1 = "I feel most at ease here."
20023-450-1 = "I can't ever take a day off from being the intimidating Public Peace Bureau Director, but..."
20023-460-1 = "...I need a place where I can lower my guard for a moment."
20023-470-1 = "So, today..."
20023-480-1 = "Please pretend that you never saw me here."
20023-2600-1 = "Come to think of it, there was a time I couldn't handle this gun very well. Now that I'm used to it, it's a shame there's not much of a chance to use it these days..."
