[translation]
13001-20-1 = "えーっと…\nそれで、今から何をすればいいの？"
13001-30-1 = "さっきのあれ…夢、\nだったのかな？"
13001-40-1 = "だるい…。"
13001-50-1 = "象さんをカフェで飼うためには…。"
13001-60-1 = "ん、んん？"
13001-70-1 = "ふぁーあ…。"
13001-80-1 = "先生、来たんだ？\nうん…てきとうに座って。"
13001-90-1 = "…私のことは\n気にしないで、\n仕事してて。"
13001-100-1 = "…空が青いね。"
13001-110-1 = "悪霊退散、悪霊退散。"
13001-120-1 = "先生は…\n家に帰らないの？"
13001-130-1 = "先生、私、俳句を\n詠んでみたんだけど\n…聞く？"
13001-140-1 = "お昼には\nとり天食べた\n名古屋めし"
13001-150-1 = "お誕生日\nおめでとう、先生。"
13001-160-1 = "今日が誕生日って\nいうことは…"
13001-170-1 = "先生が生まれた日は、\n今日ってこと？"
13001-180-1 = "今日が私の誕生日…？\n本当に…？"
13001-190-1 = "初夢にトマトが\n出て来たけど…"
13001-200-1 = "これは、縁起良いのかな？"
13001-210-1 = "サンタクロースは、\n誰が悪い子なのか\n知ってるの？"
13001-220-1 = "それ…\nなまはげじゃない？"
13001-230-1 = "カボチャスープ\n飲みたいな…。"
13001-250-1 = "ようこそ、先生。\nここは静かだから…\n俳句を作るのに\nちょうど良くて。"
13001-260-1 = "今日は先生と一緒で…\nすごく楽しかった。"
13001-270-1 = "それで私、\n気づいたの。"
13001-280-1 = "私が作りたかった俳句、\nそれは…。"
13001-290-1 = "今日ずっと感じていた\nこの気持ちを、\n込めたものだったんだって。"
13001-300-1 = "日は暮れど"
13001-310-1 = "今なお続く"
13001-320-1 = "音ふたつ"
13001-330-1 = "…先生と一緒なら、\nまだまだいくつでも、"
13001-340-1 = "詠めそうな気がする。"
13001-350-1 = "次もまた、\n付き合ってくれる？"
13001-360-1 = "あ…先生、見て。"
13001-370-1 = "月、綺麗だね。"
13001-380-1 = "本当に、綺麗…。"
13001-2600-1 = "これ……私の？"
