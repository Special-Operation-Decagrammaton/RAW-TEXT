[translation]
13001-20-1 = "Um... So, what should we do now?"
13001-30-1 = "Was that...a dream?"
13001-40-1 = "I'm so tired..."
13001-50-1 = "Gotta get the elephant into the cafe..."
13001-60-1 = "Um..."
13001-70-1 = "*yawn*"
13001-80-1 = "Sensei, you're here. Mm... Sit anywhere you like."
13001-90-1 = "Don't worry about me. Just do your thing."
13001-100-1 = "The sky is so blue."
13001-110-1 = "Evil spirits, begone, evil spirits, begone..."
13001-120-1 = "Sensei...aren't you going home?"
13001-130-1 = "Sensei, I tried writing a haiku. Would you care to hear it?"
13001-140-1 = "For my lunch today\nI ate some good fried chicken\nmade in Nagoya."
13001-150-1 = "Happy birthday, Sensei."
13001-160-1 = "If today's your birthday..."
13001-170-1 = "Does that mean you're a year older now?"
13001-180-1 = "Today is my birthday? Really...?"
13001-190-1 = "I saw a tomato in my first dream of the new year..."
13001-200-1 = "Could that mean some luck is coming my way soon?"
13001-210-1 = "How does Santa Claus know which kids have been bad?"
13001-220-1 = "Is that...a namahage?"
13001-230-1 = "I wanna eat some pumpkin soup..."
13001-250-1 = "Welcome, Sensei. It's quiet here... Perfect for writing a haiku."
13001-260-1 = "Sensei, spending time with you was a lot of fun."
13001-270-1 = "And that made me realize something."
13001-280-1 = "The haiku I wanted to write..."
13001-290-1 = "It'll be about what I felt today."
13001-300-1 = "As the sun goes down,"
13001-310-1 = "the quiet footsteps of two"
13001-320-1 = "continue to move"
13001-330-1 = "I think I can keep writing meaningful haiku like this"
13001-340-1 = "as long as I'm with you, Sensei."
13001-350-1 = "Let's hang out again, okay?"
13001-360-1 = "Oh... Sensei, look over there."
13001-370-1 = "Isn't the moon beautiful?"
13001-380-1 = "It really is beautiful..."
13001-2600-1 = "This is...mine?"
