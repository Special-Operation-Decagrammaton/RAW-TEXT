[translation]
13001-20-1 = "อืม… แล้วตอนนี้\nจะต้องทำอะไรงั้นเหรอ?"
13001-30-1 = "เมื่อกี้นี้... ฝันรึเปล่านะ?"
13001-40-1 = "เหนื่อยจัง..."
13001-50-1 = "ถ้าพาคุณช้างเข้ามาในคาเฟ่..."
13001-60-1 = "หือ?"
13001-70-1 = "ฮ้าว..."
13001-80-1 = "มาแล้วเหรอคุณครู?\nอืม... นั่งได้ตามสบายเลย"
13001-90-1 = "ไม่ต้องสนใจฉันหรอก...\nทำงานต่อเถอะ"
13001-100-1 = "ท้องฟ้าสีสวยจัง"
13001-110-1 = "วิญญาณร้ายจงหายไป"
13001-120-1 = "คุณครู... ไม่กลับบ้านเหรอ?"
13001-130-1 = "ฉันลองแต่งกลอนไฮกุดูล่ะ\nคุณครูลองฟังหน่อยไหม?"
13001-140-1 = "มื้อกลางวันนี้ฉันกินไก่ทอดไป\nไก่ทอดนาโกย่าน่ะอร่อยที่สุด"
13001-150-1 = "สุขสันต์วันเกิดค่ะ คุณครู"
13001-160-1 = "ถ้าวันนี้เป็นวันเกิด..."
13001-170-1 = "หมายความว่าวันนี้\nเป็นวันที่คุณครูเกิดมาเหรอ?"
13001-180-1 = "วันนี้คือวันเกิดฉัน...?\nจริงเหรอ?"
13001-190-1 = "ฝันแรกในปีใหม่นี้...\nฉันฝันเห็นมะเขือเทศล่ะ..."
13001-200-1 = "ถือว่าเป็นฝันดีหรือเปล่านะ?"
13001-210-1 = "ลุงซานตาคลอสรู้ด้วยเหรอ\nว่าใครเป็นเด็กไม่ดี?"
13001-220-1 = "นั่นมัน... ภูตนามาฮาเกะไม่ใช่เหรอ?"
13001-230-1 = "อยากกินซุปฟักทองจัง..."
13001-250-1 = "เข้ามาสิ คุณครู ที่นี่\nเงียบสงบดี เหมาะจะ\nเป็นที่แต่งกลอนไฮกุ"
13001-260-1 = "วันนี้ได้อยู่กับคุณครูแบบนี้...\nฉันมีความสุขมากเลย"
13001-270-1 = "เพราะงั้นฉัน... รู้แล้วละ"
13001-280-1 = "กลอนไฮกุที่ฉันอยากจะแต่ง..."
13001-290-1 = "คงเป็นสิ่งที่อยู่ภายในใจ\nเหมือนกับที่รู้สึกในวันนี้"
13001-300-1 = "ถึงจะมืดแล้ว..."
13001-310-1 = "แต่ก็ยังรู้สึกอยู่ถึงตอนนี้เลย"
13001-320-1 = "เสียงฝีเท้าของเราสองคน"
13001-330-1 = "ถ้าอยู่กับคุณครูละก็...\nต่อจากนี้ไปไม่ว่าเมื่อไร"
13001-340-1 = "ก็คงจะแต่งกลอนไฮกุ\nได้แน่นอน"
13001-350-1 = "คราวหน้าก็มาเล่นด้วยกันใหม่นะ"
13001-360-1 = "อ๊ะ... คุณครูดูนั่นสิ"
13001-370-1 = "พระจันทร์สวยจริงๆ เลยนะ"
13001-380-1 = "สวยมากๆ เลย..."
13001-2600-1 = "นี่... ของฉันเหรอ?"
