[translation]
10042-10-1 = "ブルーアーカイブ。"
10042-20-1 = "……私の名前は秤アツコ。\n先生は、私に何を望むの？\nそれが私にできることなら良いけど。"
10042-30-1 = "（ススッ、スッ……）"
10042-40-1 = "ふーん？"
10042-50-1 = "少し落ち着かないけど\n……うん、嫌じゃない。"
10042-60-1 = "これが、\n普通の会話……？"
10042-70-1 = "ここ……花を\n置いたら良さそう。"
10042-80-1 = "先生、お疲れ様。"
10042-90-1 = "おかえり、先生。"
10042-100-1 = "何か、\n頼みたいことが\nあったら言って。"
10042-110-1 = "ここにも、\n花を飾って良い？"
10042-120-1 = "望みがあったら、\n何でも言って。"
10042-130-1 = "これが当番……\nちょっとやってみたかった。"
10042-140-1 = "ハッピーバースデー\nトゥーユー……"
10042-150-1 = "習った通りにやったんだけど、\nその表情……\nもしかして間違ってた？"
10042-160-1 = "誕生日……？\n……うん。どんな意味かは\n知ってる。最近習ったから。"
10042-170-1 = "お祝いをしてもらったら、\nお礼を言うってことも。\nえっと、ありがとうございます。"
10042-180-1 = "新年……こうしてまた、\n一年間が過ぎていくんだね。"
10042-190-1 = "普段とは違う日々\nばっかりで……今度の\n新しい年は、どうなるのかな。"
10042-200-1 = "聖夜……\n習った。うん。"
10042-210-1 = "こういう日に相応しい花が\nあれば良かったんだけど……\n後で調べて来るね。"
10042-220-1 = "飴？私にくれるの？\nありがとう……\nところで、どうして？"
10042-230-1 = "先生、お疲れ様。"
10042-240-1 = "おかえり、先生。"
10042-250-1 = "何か、\n頼みたいことが\nあったら言って。"
10042-260-1 = "ここにも、\n花を飾って良い？"
10042-270-1 = "望みがあったら、\n何でも言って。"
10042-280-1 = "……？\n私の顔に、何かついてる？"
10042-290-1 = "これが当番……\nちょっとやってみたかった。"
10042-300-1 = "ハッピーバースデー\nトゥーユー……"
10042-310-1 = "習った通りにやったんだけど、\nその表情……\nもしかして間違ってた？"
10042-320-1 = "誕生日……？\n……うん。どんな意味かは\n知ってる。最近習ったから。"
10042-330-1 = "お祝いをしてもらったら、\nお礼を言うってことも。\nえっと、ありがとうございます。"
10042-340-1 = "新年……こうしてまた、\n一年間が過ぎていくんだね。"
10042-350-1 = "普段とは違う日々\nばっかりで……今度の\n新しい年は、どうなるのかな。"
10042-360-1 = "聖夜……\n習った。うん。"
10042-370-1 = "こういう日に相応しい花が\nあれば良かったんだけど……\n後で調べて来るね。"
10042-380-1 = "飴？私にくれるの？\nありがとう……\nところで、どうして？"
10042-400-1 = "この花、\nもしかして……。"
10042-410-1 = "……持ってきて、\nくれたんだ。"
10042-420-1 = "私のために……？"
10042-430-1 = "……そっか。"
10042-440-1 = "……大切にするね、\nずっと。"
10042-450-1 = "……すごく嬉しい。\nありがとう。"
10042-2600-1 = "考えることを諦めて、\n決めることを諦めて……\nただ、決まった運命をなぞって生きてきた。\nでも、これからは……\nうん。ありがとう、先生。"
