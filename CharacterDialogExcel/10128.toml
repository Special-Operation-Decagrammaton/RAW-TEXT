[translation]
10128-10-1 = "This is! Blue Archive!"
10128-20-1 = "Another great choice from our— No, I mean Sensei! ...Pardon my late introduction. I'm Wakasa Fuyu, a second-year at Wildhunt Art Academy. Make sure to remember me!"
10128-30-1 = "Huh, isn't this a really good spot for a business meeting?"
10128-40-1 = "If I were to install a screen, where would be best...?"
10128-50-1 = "(Aren't these beans decent? Should I try importing these too?)"
10128-60-1 = "But...I wonder if Sensei's going to come."
10128-70-1 = "(I-Is that the Prefectural Council? What should I do? Run away?!)"
10128-80-1 = "I've been waiting for you, Sensei!"
10128-90-1 = "Come take a seat, Sensei. Let's talk business."
10128-100-1 = "Hmm, so this is what office work is like..."
10128-110-1 = "Oh? Have you finally decided to become the Free Trade Cartel's advisor?"
10128-120-1 = "What a nice office."
10128-130-1 = "We can't...use it as the Free Trade Cartel's base, can we?"
10128-140-1 = "How comfortable..."
10128-150-1 = "Maybe I can relax here..."
10128-160-1 = "*yawn* "
10128-170-1 = "Um, if you keep poking me like that..."
10128-180-1 = "...I'll stick right next to you, okay?"
10128-190-1 = "Happy birthday, Sensei!"
10128-200-1 = "Um, I recorded a birthday video for you."
10128-210-1 = "W-Would you like to watch it...?"
10128-220-1 = "Birthday present... Something I want..."
10128-230-1 = "I don't think there is anything, but..."
10128-240-1 = "...could I ask for your time today instead?"
10128-250-1 = "Happy New Year, Sensei."
10128-260-1 = "This? It's a recording of a bell ringing on New Year's."
10128-270-1 = "What do you think? Can something like this also be \"art\"?"
10128-280-1 = "...Shall we take our time and talk about things?"
10128-290-1 = "I happened to rent a Santa outfit..."
10128-300-1 = "I-Is your curiosity piqued?"
10128-310-1 = "Please give me just a moment, Sensei. "
10128-320-1 = "I managed to get my hands on a delicious pumpkin!"
10128-340-1 = "We are behind the screens."
10128-350-1 = "Thus, behind the artwork..."
10128-360-1 = "A place where only the artist may enter."
10128-370-1 = "The only way to enter this place...is to get permission from me, the artist. "
10128-380-1 = "So, right now, in this place..."
10128-390-1 = "There's only you and...me..."
10128-400-1 = "Uh no no no no! Th-That's not what I meant...!"
10128-410-1 = "Anyway! I packed lunch..."
10128-420-1 = "Um, if you're fine with it..."
10128-430-1 = "...Would you like to have some?"
10128-2600-1 = "I'll absolutely repay you for this...! Because that's business! So... Until then, please stay by my side."
