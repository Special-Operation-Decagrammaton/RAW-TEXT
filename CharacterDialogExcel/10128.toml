[translation]
10128-10-1 = "ブルーアーカイブ！ですよ～！"
10128-20-1 = "おや…お目が高いですね、お客様……いえ、先生！\n……申し遅れました。ワイルドハント芸術学院2年、\n若狭フユです。以後、お見知りおきを！"
10128-30-1 = "へぇ、\n打ち合わせ場所に\n良さそうだね。"
10128-40-1 = "スクリーンを\n設置するなら\nどこがいいかな……。"
10128-50-1 = "（ここのコーヒー、\n中々いい豆を\n使ってるね……これも\n仕入れてみようかな？）"
10128-60-1 = "ところで……\n先生は来ないのかな。"
10128-70-1 = "（あれは……寮監隊！？\nどうしよう……\n逃げる！？）"
10128-80-1 = "お待ちしてましたよ、先生！"
10128-90-1 = "さあ、おかけください。\nビジネスの話と参りましょう。"
10128-100-1 = "ふむ、\nこれが内勤の仕事ですか……。"
10128-110-1 = "どうです？\n特殊交易部顧問の椅子は、\nいつでも空けてありますよ？"
10128-120-1 = "ここは快適で……ええ。\nいいオフィスです。"
10128-130-1 = "……私たちの拠点にしたら\n……ダメですよねぇ？"
10128-140-1 = "落ち着きますねぇ……"
10128-150-1 = "ちょっとくらい肩の\n力を抜いても……"
10128-160-1 = "ふわぁ。"
10128-170-1 = "もう……\nそんなにつっつくなら……\n隙間を埋めちゃいますよ？"
10128-180-1 = "ぴったりくっついたら、\nイタズラできませんよね？"
10128-190-1 = "ハッピーバースデー！先生！"
10128-200-1 = "お祝いの動画を\n作ってきたのですが……"
10128-210-1 = "い、一緒に観ませんか……？"
10128-220-1 = "誕生日プレゼント……\n私の欲しいモノ、ですか……。"
10128-230-1 = "モノはいらないので……一日、"
10128-240-1 = "先生のお時間を\nいただけませんか？"
10128-250-1 = "明けまして\nおめでとうございます、先生。"
10128-260-1 = "……はい？ああ、これですか？\n昨日の録画データです。"
10128-270-1 = "テレビでやってた、除夜の鐘の。\n締めて108回分。"
10128-280-1 = "さて……これをどう\n芸術にしましょうかね。"
10128-290-1 = "ちょうど、仕入れてきた\nサンタ服があるんですけど……。"
10128-300-1 = "き、気になりますか……？"
10128-310-1 = "少々お待ちください、先生。"
10128-320-1 = "ちょうど、新鮮なカボチャを\n手に入れましたので！"
10128-340-1 = "ここは、\nスクリーンの裏側です。"
10128-350-1 = "つまり、舞台裏……。"
10128-360-1 = "作家だけが\n出入りできる空間です。"
10128-370-1 = "ここに入る唯一の方法は……\n作家である私に許可を取ること。"
10128-380-1 = "だから、ここは今――"
10128-390-1 = "先生と私、二人……きりの……。"
10128-400-1 = "って！いやいやいや！\nそ、そうじゃなくてですね！"
10128-410-1 = "とにかく！お弁当を\n作ってきたんですけど……。"
10128-420-1 = "えっと、もし、\nよろしければ……。"
10128-430-1 = "……一緒に、食べませんか？"
10128-2600-1 = "受けた投資にはそれ以上のリターンを。\nそれがビジネスですからね！なので……\nいつか恩返しできるその時まで、\nそばにいてください、先生。"
