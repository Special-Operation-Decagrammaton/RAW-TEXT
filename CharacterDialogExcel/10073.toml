[translation]
10073-10-1 = "B-Blue...Archive..."
10073-20-1 = "Ugh... I hate the outdoors... Too hot, too humid... Why must summer be like this...?"
10073-30-1 = "Ah... There are too many people here..."
10073-40-1 = "Where oh where can I find some peace and quiet...?"
10073-50-1 = "I may be mistaken, but things seem busier here than usual..."
10073-60-1 = "*sigh* ...Geez."
10073-70-1 = "Well... I suppose the atmosphere here isn't so bad."
10073-80-1 = "Oh, Sensei! I've been waiting for you."
10073-90-1 = "I've made you an americano."
10073-100-1 = "Welcome, Sensei. Allow me to...help..."
10073-110-1 = "Just as long as I don't have to go outside."
10073-120-1 = "Indoors is better. I feel so much calmer indoors..."
10073-130-1 = "When it's just the two of us, it's so quiet and peaceful..."
10073-140-1 = "Oh, never mind. Forget I said anything."
10073-150-1 = "I can help you organize files,"
10073-160-1 = "but I'm not so good with computers..."
10073-170-1 = "Maybe next time...we can try working in the old library?"
10073-180-1 = "If it's for you, I'll do anything."
10073-190-1 = "It's not often, so...it's okay if it's a little weird."
10073-200-1 = "Happy birthday, Sensei!"
10073-210-1 = "Oh, this outfit... There's no meaning behind it."
10073-220-1 = "My birthday... I had forgotten."
10073-230-1 = "Sensei, when I'm with you, I forget about everything else..."
10073-240-1 = "Happy New Year, Sensei."
10073-250-1 = "This year...I'd like to stay indoors with you instead of going near the water."
10073-260-1 = "Christmas...?"
10073-270-1 = "It was never a special day for me."
10073-280-1 = "...At least not until I met you, Sensei."
10073-290-1 = "It's noisy outside... Already..."
10073-300-1 = "Going to a quiet beach... I think that would be nicer."
10073-320-1 = "Wh-What do you think...? My little hideaway..."
10073-330-1 = "It's pretty nice, right? Heehee..."
10073-340-1 = "Would you like to come in, Sensei? It's comfier than you'd think."
10073-350-1 = "Oh... I guess it might be too small for two people..."
10073-360-1 = "...What? You're happy just watching...?"
10073-370-1 = "...But that defeats the whole purpose of bringing you here..."
10073-380-1 = "...Still, this feels nice."
10073-390-1 = "Maybe... Not everything about the outdoors sucks."
10073-400-1 = "...Um, Sensei...? If you'd like..."
10073-410-1 = "Would you care...for a drink?"
10073-2600-1 = "Perhaps this is out of the blue, but I'm not sure if I'm worthy of all the things you do for me... I'm sorry. I said I wouldn't say things like that. I'll try my best if that's what you want, Sensei."
