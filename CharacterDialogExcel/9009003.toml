[translation]
9009003-10-1 = "กำลังรออยู่เลยค่ะ คุณครู"
9009003-20-1 = "เหตุการณ์ต่างๆ ที่เกิดขึ้นในคิโวทอส\nจะมอบหมายให้ <ชาเล่ต์> เป็นผู้จัดการ"
9009003-30-1 = "มาเริ่มกันเลยเถอะค่ะ"
9009003-40-1 = "เราจะปล่อยให้เหตุการณ์พวกนี้\nเกิดขึ้นไม่ได้ค่ะ"
9009003-50-1 = "ช่วยไม่ได้นะคะ\nตอนที่มีเพียง <ชาเล่ต์> ที่จะจัดการได้"
9009003-60-1 = "ฉันทราบดีค่ะ\nว่ากำลังขอให้คุณครูทำงานที่ยากลำบาก"
9009003-70-1 = "....\nขอบคุณที่ตั้งใจทำงานนะคะ"
9009003-80-1 = "ความมุ่งมั่นของคุณครู\nคงทำให้เก็บข้อมูลดีๆ ได้แน่ค่ะ"
9009003-90-1 = "ฉันกำลังรออยู่เลยค่ะ\nคุณครูคะ"
9009003-100-1 = "เหตุการณ์ต่างๆ ที่เกิดขึ้นในคิโวทอส\nจะมอบหมายให้ <ชาเล่ต์> เป็นผู้จัดการ"
9009003-110-1 = "มาเริ่มกันเลยเถอะค่ะ"
9009003-120-1 = "เราจะปล่อยให้เหตุการณ์พวกนี้\nเกิดขึ้นไม่ได้ค่ะ"
9009003-130-1 = "ช่วยไม่ได้นะคะ\nตอนที่มีเพียง <ชาเล่ต์> ที่จะจัดการได้"
9009003-140-1 = "ฉันทราบดีค่ะ\nว่ากำลังขอให้คุณครูทำงานที่ยากลำบาก"
9009003-150-1 = "...\nขอบคุณที่ตั้งใจทำงานนะคะ"
9009003-160-1 = "ความมุ่งมั่นของคุณครู\nคงทำให้เก็บข้อมูลดีๆ ได้แน่ค่ะ"
