[translation]
10034-10-1 = "Blue Archive!"
10034-20-1 = "Heehee. Hello, Sensei. I'm Mimori from the Inner Discipline Club. I look forward to working with you."
10034-30-1 = "I'm glad that everyone seems to be smiling."
10034-40-1 = "I hope I can give Sensei this black tea I prepared before it gets cold..."
10034-50-1 = "Maybe making a meal for Sensei could be part of our training..."
10034-60-1 = "Kaede, you aren't bothering Sensei, are you?"
10034-70-1 = "It's a bit messy. Should we clean before Sensei returns?"
10034-80-1 = "You're back, Sensei."
10034-90-1 = "Heehee. I will be by your side to help you."
10034-100-1 = "W-Welcome, Sensei!"
10034-110-1 = "Please, come take your seat. If we don't get started on our tasks soon, we won't be able to finish in time, you know?"
10034-120-1 = "Did you wash your face this morning? You didn't skip breakfast, did you?"
10034-130-1 = "Heehee. Yes. Good Job. Then how about a nice cup of black tea?"
10034-140-1 = "If there is anything you need, whatever it may be..."
10034-150-1 = "Yes, you can ask me anything."
10034-160-1 = "You're always so busy, Sensei."
10034-170-1 = "The time I spend alone with you like this is precious."
10034-180-1 = "O-Oh. I-I just let that slip out, didn't I?"
10034-190-1 = "I've dreamed of becoming a proper bride ever since I was young."
10034-200-1 = "Like the ones I read about in mangas and novels."
10034-210-1 = "I'm training with the Inner Discipline Club and Schale to become a proper lady and make that dream come true."
10034-220-1 = "Happy birthday, Sensei."
10034-230-1 = "I suppose today's a free pass to act however you want, isn't it?"
10034-240-1 = "Oh. Are you wishing me a happy birthday?"
10034-250-1 = "Heehee. Yes, thank you, Sensei."
10034-260-1 = "Today is already wonderful."
10034-270-1 = "Heehee. Happy New Year, Sensei."
10034-280-1 = "How about some gamju to warm yourself up?"
10034-290-1 = "Hmm hmm hmmm. Hmmm hmmm. ♪"
10034-300-1 = "It's Christmas, Sensei."
10034-310-1 = "Would you like to go on a walk with me tonight?"
10034-320-1 = "Trick or treat...? Ah! Today is Halloween."
10034-330-1 = "I-If it's you, it's okay for you to play pranks on me, Sensei!"
10034-350-1 = "Heehee. Sensei. You can sit a little closer, you know."
10034-360-1 = "Whether it's my bridal training...or my dream to become a proper young lady."
10034-370-1 = "You're always there to support and encourage me."
10034-380-1 = "Thank you so much. That's why...I hope you and I will always be..."
10034-390-1 = "N-Never mind! It's nothing!"
10034-400-1 = "A-Anyway! All done now."
10034-410-1 = "I did the best I could. Do you...like it?"
10034-2600-1 = "Did you prepare this for me? Thank you, Sensei. I want to support you for the rest of my life."
