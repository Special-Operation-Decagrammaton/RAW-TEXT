[translation]
10064-10-1 = "Blue Archive."
10064-20-1 = "It's New Year's. I just thought I should wear the right outfit to celebrate... Please keep looking after me this year too, Sensei."
10064-30-1 = "I hope next year will be a good one...in a lot of different ways."
10064-40-1 = "Hah. There's a lot to think about..."
10064-50-1 = "But I guess what I really want is peace and good health. Really, that's all..."
10064-60-1 = "I hope that everything that happens is stuff we can handle."
10064-70-1 = "I actually...kinda like this outfit. It's not bad, right?"
10064-80-1 = "Hey, Sensei. Happy New Year."
10064-90-1 = "Wow, you sure have it rough. Trouble right from the start of the year?"
10064-100-1 = "Um...it just doesn't seem like anyone else's business."
10064-110-1 = "You think I'm...even cuter in a kimono?"
10064-120-1 = "Hmph. Don't say stuff you don't mean."
10064-130-1 = "Hah. That's more than enough teasing out of you, Sensei."
10064-140-1 = "Wait, you...you mean it? E-Even so, that's enough!"
10064-150-1 = "About Problem Solver... Don't worry. It's nothing big."
10064-160-1 = "I hope there aren't any...incidents...this year."
10064-170-1 = "What's wrong, Sensei? I can help you with whatever."
10064-180-1 = "Even if it's not official business, if it's something you need, I'd try..."
10064-190-1 = "Um, never mind. Forget about it. I didn't say anything."
10064-200-1 = "Happy birthday, Sensei. What do you want as a gift?"
10064-210-1 = "Do you want any music? I've got a whole bunch."
10064-220-1 = "My...birthday?"
10064-230-1 = "So you remembered. Hearing you wish me a happy birthday doesn't feel half bad."
10064-240-1 = "It makes me happy. Thank you."
10064-250-1 = "It's a new year. Happy New Year, Sensei. I hope you have another great one."
10064-260-1 = "...Pocket money? Really?"
10064-270-1 = "It's Christmas. New Year's is coming up soon, isn't it?"
10064-280-1 = "All in all...how was the year for you?"
10064-290-1 = "Halloween always gets a little rowdy."
10064-300-1 = "Not that I dislike that kind of vibe."
10064-320-1 = "It's almost time for the first train."
10064-330-1 = "It wasn't the sound we hoped for, but...this isn't bad either."
10064-340-1 = "Unlike the annual end-of-year bells,"
10064-350-1 = "Meanwhile, the first train's bell is a sound you can hear every morning."
10064-360-1 = "But even the first day of the New Year is just another day."
10064-370-1 = "So what we just heard might be the best sound for a day like today."
10064-380-1 = "Here's to another great year."
10064-390-1 = "Happy New Year, Sensei."
10064-2600-1 = "Sensei, am I really gonna be able to... No, wait. Nevermind. I'll make sure I live up to your expectations."
