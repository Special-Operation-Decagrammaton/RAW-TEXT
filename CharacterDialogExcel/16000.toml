[translation]
16000-20-1 = "あの、私が来てもよかったんでしょうか？\n邪魔だと思いましたら、\nい、いつでも仰ってください…。"
16000-30-1 = "隠れる場所は\nどこに…。"
16000-40-1 = "ここにいても\nいいんでしょうか。"
16000-50-1 = "人が多い所は\n苦手…。\n隠れたい…。"
16000-60-1 = "あ、あの…。\nえへへ…わ、私が\n手伝うことありますか？"
16000-70-1 = "せ、先生。\nあ、りが…とうござい…\nい、いえ！すみません！"
16000-80-1 = "あ、あの…。\n私のこと呼びましたか？\n何かの勘違いではないですか？"
16000-90-1 = "私なんかがここにいても\nいいんでしょうか…。"
16000-100-1 = "はい？私が必要ですか？"
16000-110-1 = "え、うう、そ、そんな…。"
16000-120-1 = "先生の役に立てるように\n全力を尽くしますから…。"
16000-130-1 = "…ありがとうございます。\n先生。"
16000-140-1 = "はい？そんなに\n緊張しないで、ですか？\nバ、バレてましたか？！"
16000-150-1 = "（死にたい死にたい死にたい\n死にたい死にたい死にたい）"
16000-160-1 = "お、お誕生日\nおめでとう\nございます！"
16000-170-1 = "も、もちろん、私なんかが\nお祝いしたところで気持ち悪い\nだけだと思いますが…！"
16000-180-1 = "い、生きててすみません！"
16000-190-1 = "はい？\nお、おめでとう、ですか？"
16000-200-1 = "あ、明けまして\nおめでとうございます！"
16000-210-1 = "今年も、先生と一緒に…\nぜ、全部消し\nちゃいましょうねっ。"
16000-220-1 = "今年のクリスマスも、\n先生と一緒で…。\n嬉しいです。"
16000-230-1 = "も、もちろん、私に\nそんな資格があるかどうか\nわかりませんが…！"
16000-240-1 = "ああ。\n今日ってハロウィーン\nでしたか。"
16000-250-1 = "急にお化けコスプレの人達が\n群がって来たから\n撃っちゃったんですけど…。"
16000-260-1 = "…すみません。"
16000-280-1 = "あ、えっ？えっ…！？\nな、なななんで、えっ！？"
16000-290-1 = "ど、どうして…！？\nどうして先生が、こ、ここに\nいらっしゃるのですか…！？"
16000-300-1 = "わ、私また何か\nとんでもないミスを…！？"
16000-310-1 = "あ、も、もしかして\n伝える場所を間違えて…！？"
16000-320-1 = "あ、え、えっとですね、\nここはその…\n何と言いますか…。"
16000-330-1 = "その、私が雑草とか…\nそういうのを\n育てている場所、でして…。"
16000-340-1 = "す、すみません先生、\nまた私のミスで…\n大切な方を、\nこんなところに…。"
16000-350-1 = "え、あ…\nわ、私もしかして今、\nな、ななな何か、\n凄いことを口に…っ！？"
16000-360-1 = "（しっ、\n死にたい死にたい死にたい\n死にたい死にたい死にたい\n死にたい死なないと…！）"
16000-2600-1 = "先生が嫌いなものは、\n私が……全部消しちゃいます！"
