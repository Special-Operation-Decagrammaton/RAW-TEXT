[translation]
20041-10-1 = "蔚藍，檔案。"
20041-20-1 = "我是千年科學學園，\n研討會的調月莉央。\n最合理的答案，就由我來向你提示。"
20041-30-1 = "要追求合理的\n配置的話……"
20041-40-1 = "那個東西，感覺\n欠缺實用性……"
20041-50-1 = "咖啡因不是只要藉由\n膠囊攝取就好了嗎？"
20041-60-1 = "最大多數的\n最大幸福……\n在這裡也能適用嗎……"
20041-70-1 = "……避開\n人多的地方吧。"
20041-80-1 = "歡迎回來，老師。\n我也是剛剛才到。"
20041-90-1 = "我計算了老師抵達的時機……"
20041-100-1 = "看來結果並沒有錯呢。"
20041-110-1 = "相當準時呢，老師。"
20041-120-1 = "這是今天的行程表。\n麻煩你過目一下吧。"
20041-130-1 = "我認為追求合理\n就能帶來最大效率。"
20041-140-1 = "但絕對沒有那麼簡單吧。"
20041-150-1 = "是你讓我產生了這種想法。"
20041-160-1 = "老師，你有\n仰望過夜空嗎？"
20041-170-1 = "星星的光，\n全都來自於過去。"
20041-180-1 = "換言之──\n當我們觀察星星的時候，"
20041-190-1 = "可以說是同時捕捉了\n「過去」與「現在」呢。"
20041-200-1 = "……但即使如此，"
20041-210-1 = "「未來」依舊\n是無法觀測的。"
20041-220-1 = "所謂的「未來」就是\n不確定因素的集合體。"
20041-230-1 = "是該為其感到擔憂，"
20041-240-1 = "還是抱著希望\n將其視為可能性……"
20041-250-1 = "我始終沒能給出答案。"
20041-260-1 = "不過……"
20041-270-1 = "如果那個未來有你在……"
20041-280-1 = "也許能建立\n不同的假設也說不定呢。"
20041-290-1 = "當千年的學生\n造訪夏萊的時候，"
20041-300-1 = "麻煩將日程分享給我。"
20041-310-1 = "拜託你了。"
20041-320-1 = "現在去散步……？"
20041-330-1 = "恕我拒絕。\n這是不合理的行動。"
20041-340-1 = "而且會有危險。"
20041-350-1 = "不要離開我。\n今後也一直待在我身邊吧。"
20041-360-1 = "我，我……是不是\n說了什麼不適當的話……？"
20041-370-1 = "是像你這樣的可能性\n降生於世界的紀念日呢。\n……祝你生日快樂，老師。"
20041-380-1 = "生日……其實我\n至今都不太能習慣。"
20041-390-1 = "不過……原來\n會產生這種感受啊。"
20041-400-1 = "……謝謝你，老師。"
20041-410-1 = "「一年開始了」這個\n概念本身是不合理的。"
20041-420-1 = "不過是季節輪轉一次而已。"
20041-430-1 = "……不過，我也理解\n不能無視社會的規範意識。"
20041-440-1 = "新年快樂，老師。"
20041-450-1 = "……真是無法理解。聖誕節？\n所謂的紀念日，究竟……"
20041-460-1 = "禮物……？要給我……？"
20041-470-1 = "那個，謝謝你，老師。"
20041-480-1 = "……雖然這完全不合邏輯。\n但我就接受你的好意吧。"
20041-490-1 = "變裝後要求別人給糖什麼的……"
20041-500-1 = "雖然我還是無法理解……"
20041-510-1 = "但對象是老師的話……\n好吧……？"
20041-520-1 = "Trick or Treat。"
20041-530-1 = "……呵呵。"
20041-550-1 = "我並不是為了\n讓你做這種事，\n才請你過來的……"
20041-560-1 = "我自己來就行了。\n老師你請坐吧。"
20041-570-1 = "你，你應該更有\n身為老師的自覺才對。"
20041-580-1 = "為了這種事浪費時間\n是不合理的。"
20041-590-1 = "你還有其他更重要的工作吧？"
20041-600-1 = "……！\n你，你在說什麼……"
20041-610-1 = "「照顧」我……！？"
20041-620-1 = "我……我不太能理解……\n不過……"
20041-630-1 = "……你，就是這樣的人呢。"
20041-640-1 = "……知道了。"
20041-650-1 = "我就接受到最後吧。"
20041-660-1 = "接受你……\n所謂的「照顧」。"
20041-2600-1 = "雖然我不擅長射擊……\n但我會保護好自己的。\n還有……老師你也是。"
