[translation]
20041-10-1 = "Blue Archive"
20041-20-1 = "สึคัตสึกิ ริโอะ สังกัดเซมิน่าแห่งโรงเรียนวิทย์มิลเลเนียม\nฉันจะหาคำตอบที่สมเหตุสมผลที่สุดให้เอง"
20041-30-1 = "ถ้าจะจัดระเบียบที่แห่งนี้\nให้สมเหตุสมผลขึ้น..."
20041-40-1 = "ของอันนั้น\nมันจำเป็นจริงๆ เหรอ..."
20041-50-1 = "ถ้าต้องการคาเฟอีน\nก็กินแบบแคปซูลก็ได้"
20041-60-1 = "ความสุขที่มากที่สุด\nของคนจำนวนมากที่สุด...\nใช้ได้กับที่นี่ด้วยมั้ยนะ..."
20041-70-1 = "หลีกเลี่ยงสถานที่\nที่แออัดกันเถอะ..."
20041-80-1 = "มาแล้วเหรอ ครู"
20041-90-1 = "ฉันก็เพิ่งมาถึงเหมือนกัน"
20041-100-1 = "ฮุฮุ เป็นผลลัพธ์จากการ\nเลือกเส้นทางที่สมเหตุสมผลน่ะ"
20041-110-1 = "มาพอดีเลยนะ ครู"
20041-120-1 = "นี่คือตารางของวันนี้\nช่วยดูให้ทีสิ"
20041-130-1 = "ฉันเคยคิดว่าความสมเหตุสมผล"
20041-140-1 = "คือสิ่งที่มีประสิทธิภาพที่สุด..."
20041-150-1 = "แต่ว่าตอนนี้ ดูจะไม่ต้อง\nเป็นอย่างนั้นตลอดก็ได้"
20041-160-1 = "ครูเคยเงยหน้ามอง\nท้องฟ้ายามค่ำคืนหรือเปล่า?"
20041-170-1 = "แสงดาวทั้งหมดมาจากอดีต\nอันไกลโพ้นเกินคาดเลยละ"
20041-180-1 = "เพราะงั้นพวกเราที่มอง\nท้องฟ้ายามค่ำคืน "
20041-190-1 = "ก็กำลังอยู่กับอดีต\nและปัจจุบันไปพร้อมๆ กัน"
20041-200-1 = "ถึงแม้ว่าที่นั่น..."
20041-210-1 = "จะไม่เห็นอนาคตก็เถอะ"
20041-220-1 = "แต่อนาคตก็เรียกได้ว่าเป็น\nกลุ่มก้อนของปัจจัยที่ไม่แน่นอน"
20041-230-1 = "เราควรเอามาเป็นความกังวล"
20041-240-1 = "หรือว่าเอามาเป็นความหวัง\nตามความเป็นไปได้..."
20041-250-1 = "ตอนนี้ฉันยัง\nหาคำตอบไม่ได้เลย"
20041-260-1 = "แต่ว่า..."
20041-270-1 = "ถ้าในอนาคตนั้นมีคุณอยู่ด้วย "
20041-280-1 = "ฉันว่าก็อาจจะตั้ง\nสมมติฐานอื่นได้ก็เป็นได้"
20041-290-1 = "ถ้ามีนักเรียนมิลเลเนียม\nคนไหนมาที่ชาเล่ต์ละก็"
20041-300-1 = "ฉันอยากให้ครูบอกตารางหน่อย"
20041-310-1 = "สัญญา... กันได้ใช่มั้ย...?"
20041-320-1 = "จะชวนไปเดินเล่นงั้นเหรอ?"
20041-330-1 = "ไม่ได้หรอก นั่นเป็นการกระทำ\nที่ไม่สมเหตุสมผลน่ะ "
20041-340-1 = "ที่สำคัญคือมันอันตราย"
20041-350-1 = "เพราะงั้นเราอยู่ที่นี่\nด้วยกันไปเรื่อยๆ เถอะ"
20041-360-1 = "ทำไมจู่ๆ ถึง\nรู้สึกเขินขึ้นมาล่ะ...? หรือว่า\nฉันพูดอะไรแปลกๆ ออกไป...?"
20041-370-1 = "สุขสันต์วันเกิดนะ ครู\nเป็นวันที่ความเป็นไปได้\nที่เรียกว่าคุณได้เกิดขึ้นบนโลกสินะ"
20041-380-1 = "อวยพรวันเกิดเหรอ... ที่จริงแล้ว\nฉันไม่เคยได้รับมาก่อนเลย"
20041-390-1 = "มันเป็น... ความรู้สึกแบบนี้สินะ"
20041-400-1 = "ขอบคุณจริงๆ นะ ครู "
20041-410-1 = "แนวคิดที่ว่า 'เริ่มอีกปีแล้ว'\nมันไม่สมเหตุสมผลเลย"
20041-420-1 = "มันก็แค่เปลี่ยนฤดูกาลอีกรอบเอง"
20041-430-1 = "แต่ก็นะ คงต้องยึดตาม\nบรรทัดฐานทางสังคม..."
20041-440-1 = "สวัสดีปีใหม่นะ ครู"
20041-450-1 = "คริสต์มาส...\nฉันไม่รู้จักเทศกาลนี้เลย\nวันเทศกาลคืออะไรกันนะ..."
20041-460-1 = "หืม? ของขวัญ? ให้ฉันเหรอ?"
20041-470-1 = "ขะ... ขอบคุณนะครู"
20041-480-1 = "ถึงจะไม่เข้าใจตรรกะเลย...\nแต่ฉันจะรับความปรารถนาดีไว้แล้วกัน"
20041-490-1 = "วันที่แต่งคอสเพลย์\nแล้วขอลูกกวาดกินเนี่ยนะ"
20041-500-1 = "ไม่เห็นเข้าใจความหมายเลย "
20041-510-1 = "แต่ถ้าเป็นครูแล้ว..."
20041-520-1 = "จะทริกออร์ทรีตล่ะ?"
20041-530-1 = "เป็นยังไงล่ะ? ฮุฮุ"
20041-550-1 = "ฉันไม่ได้เรียกครูมา...\nด้วยจุดประสงค์แบบนี้สักหน่อย..."
20041-560-1 = "ฉันทำเองดีกว่า\nครูนั่งพักเถอะนะ"
20041-570-1 = "คะ... ครูต้องตระหนักถึง\nตำแหน่งของตัวเองบ้างสิ"
20041-580-1 = "คุณน่ะ มีงานที่\nสำคัญกว่านี้ตั้งเยอะ"
20041-590-1 = "มาเสียเวลากับเรื่องแบบนี้\nมันไม่สมเหตุสมผลเลยนะ"
20041-600-1 = "พะ... พูดอะไรแบบนั้น..."
20041-610-1 = "บอกว่า... ดูแลฉันงั้นเหรอ?!"
20041-620-1 = "มะ... ไม่เห็นจะเข้าใจเลย\nแต่ถึงจะไม่เข้าใจก็เถอะ..."
20041-630-1 = "แต่ก็นะ... ก็คุณเป็น\nคนแบบนี้อยู่ตลอดนี่นา"
20041-640-1 = "งั้นก็ได้..."
20041-650-1 = "งั้นฉันจะขอรับไว้ละนะ"
20041-660-1 = "การดูแล... จากคุณน่ะ"
20041-2600-1 = "ถึงฉันจะไม่ถนัดยิงปืน...\nแต่การไม่พกปืนในคิโวทอส\nคือเรื่องไม่สมเหตุสมผล\nฉันจะลองปกป้องตัวเองดู\nแล้วก็ครูด้วย"
