[translation]
10154-10-1 = "블루 아카이브."
10154-20-1 = "와일드헌트 예술학원, 예술 평의회의 회장\n우루와시 마나미입니다.\n수집이란 시간과 공간을 뛰어넘는 예술.\n이 순간도, 기념할 만한 작품이 되기를."
10154-30-1 = "선생님도…… 고상한\n취미를 가졌군요."
10154-40-1 = "이런 분위기,\n싫지 않네요."
10154-50-1 = "……그렇군요. 이것도\n예술이라고 해두죠."
10154-60-1 = "여기가 선생님의\n박물관, 이군요."
10154-70-1 = "그렇군요……. 지금은\n말을 아끼도록 하죠."
10154-80-1 = "우리에게 시간은 유한한 것."
10154-90-1 = "그 시간을\n가치 있게 사용해 보죠."
10154-100-1 = "기다림에도 미학이 있답니다."
10154-110-1 = "저는 지금이 그랬으면 좋겠네요."
10154-120-1 = "예술에는 여러 관점이 있습니다."
10154-130-1 = "그렇기에, 가치를 하나로\n정의할 수는 없습니다."
10154-140-1 = "하지만 학원의 운영을 위해서는,\n명확한 하나의 기준이 필요하죠."
10154-150-1 = "그 기준을 제시하는 것이\n바로 저랍니다."
10154-160-1 = "즉, 저 자신이\n와일드헌트 예술학원의 규범\n그 자체인 것입니다."
10154-170-1 = "수집은 단순히 물건을\n모으는 것이 아니랍니다."
10154-180-1 = "그 안에 깃든 역사와 감성도\n함께 모으는 것이죠."
10154-190-1 = "수집품을 보며 향수에 빠지고,\n과거의 열정을\n상상할 수 있으니까요."
10154-200-1 = "수집이란 감각의 예술이라\n바꿔 말할 수 있는 거랍니다."
10154-210-1 = "위대한 예술가의 말 중에\n'예술은 결코\n완성되지 않는다'는\n이야기가 있습니다."
10154-220-1 = "예술가의 눈에는,\n작품의 결점이\n계속 비치는 법이니까요."
10154-230-1 = "완벽하지 않은 우리가,\n완벽한 작품을 만드는 건\n불가능한 일."
10154-240-1 = "하지만, 그것을 알면서도,"
10154-250-1 = "도전하는 것이\n바로 예술가입니다."
10154-260-1 = "후후……\n그저 그렇다는 이야기입니다.\n경험담은 아니에요."
10154-270-1 = "악마의 딸인 흑조가\n왕자를 유혹해,"
10154-280-1 = "백조로 변한 공주를\n불행에 빠뜨리는\n이야기를 아시나요?"
10154-290-1 = "그렇다면 저는 흑조와 백조,\n어느 쪽에 더 가까울까요?"
10154-300-1 = "사악한 흑조?\n아니면 청순하고 가련한 백조?"
10154-310-1 = "이 질문에 정답은 없답니다.\n마음껏 상상의 나래를\n펼쳐 주시길."
10154-320-1 = "수집이라는 건,\n꼭 물질적일 필요는 없답니다."
10154-330-1 = "마음속에 간직할\n수도 있으니까요."
10154-340-1 = "오히려 그쪽이\n더 낭만적인 것 같기도 하고요."
10154-350-1 = "그러니, 선생님.\n지금 이 순간을\n마음속에 수집해 보지 않겠나요?"
10154-360-1 = "생일 축하합니다, 선생님."
10154-370-1 = "생일 선물로 제가 좋아하는\n빅 브라더 쿠션을 드리죠."
10154-380-1 = "딱히, 항상 감시하겠다는\n의미는 없어요."
10154-390-1 = "오늘은 저의 생일이군요."
10154-400-1 = "많은 학생에게\n축하를 받았습니다만……."
10154-410-1 = "후훗, 선생님은\n어떻게 축하해 주실까요?\n매우 기대되네요."
10154-420-1 = "신년이 밝았습니다."
10154-430-1 = "저도,\n우리 와일드헌트 예술학원도."
10154-440-1 = "계속해서 잘 부탁드리겠습니다."
10154-450-1 = "크리스마스에 부르시다니.\n그 의미는 잘 알고 계시겠죠?"
10154-460-1 = "네, 그에 걸맞은\n결과를 얻을 때까지……\n돌아갈 생각은 없으니까요.\n후후, 기대되네요."
10154-470-1 = "할로윈에는,\n우리 학원에서\n대규모 축제가 개최됩니다."
10154-480-1 = "오늘은 제가\n에스코트하도록 하죠.\n자, 손을."
10154-500-1 = "우리 와일드헌트 예술학원은,\n역사가 깊은 학원입니다."
10154-510-1 = "역대 뛰어난 평의회장의 위업이\n지금도 전해 내려오고 있죠."
10154-520-1 = "하지만, 저는 그곳에\n이름을 올리진 못할 겁니다."
10154-530-1 = "사정이 있다고는 하나,\n전공 활동도 하지 못하고……"
10154-540-1 = "학원 운영도 독재적이라는\n평을 받고 있죠."
10154-550-1 = "그것이 부당하다\n생각하진 않습니다."
10154-560-1 = "예술이란, 시간을 뛰어넘는 법."
10154-570-1 = "제가 지켜낸 예술은,\n후세에도 계속해서 전해지겠죠."
10154-580-1 = "이 학원과,\n학원의 예술을 지키는 것……."
10154-590-1 = "그것이야말로,\n제가 평의회장을\n계속하고 있는 이유입니다."
10154-600-1 = "그러니까 선생님. 앞으로도……."
10154-610-1 = "이런 저를, 지켜봐 주실 거죠?"
10154-2600-1 = "저의 적은 곧 와일드헌트의 적.\n우매한 자들에게,\n우리 학원의 지고를 가르치도록 하죠."
