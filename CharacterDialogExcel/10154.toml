[translation]
10154-10-1 = "ブルーアーカイブ。"
10154-20-1 = "ワイルドハント芸術学院、\n芸術評議会会長の雲類鷲マナミと申します。\n「コレクション」――それは時空を越える芸術。\nこの瞬間が、記念すべき作品となりますよう。"
10154-30-1 = "先生も……\n高尚な趣味を\nお持ちなんですね。"
10154-40-1 = "こういった雰囲気も\n悪くありません。"
10154-50-1 = "……なるほど。これも\n芸術ということに\nしておきましょう。"
10154-60-1 = "ここが先生の博物館、\nなのですね。"
10154-70-1 = "そうですね……\nコメントは\n控えておきます。"
10154-80-1 = "私たちの時間は有限。"
10154-90-1 = "だからこそ\n有意義に使いましょう。"
10154-100-1 = "待機する時間、\nそれそのものにも美学と\nいうものが存在します。"
10154-110-1 = "この瞬間も、そうであるように。"
10154-120-1 = "芸術には様々な\n観点が存在します。"
10154-130-1 = "それゆえに、価値を一意に\n定義することはできません。"
10154-140-1 = "ですが、学院を運営する\n上で「基準」は必要不可欠。"
10154-150-1 = "その「基準」を示すのが、\nこの私。"
10154-160-1 = "つまり、私自身が\nワイルドハント芸術学院の\n規範そのものなのです。"
10154-170-1 = "コレクションの基準は、\n単一の作品の\n完成度だけではありません。"
10154-180-1 = "そこに宿る歴史や価値観を\n含めて評価し、収集しています。"
10154-190-1 = "コレクションを鑑賞することで、\n過ぎ去った時間を追体験する\nことができるのです。"
10154-200-1 = "収集とは感覚の芸術と言い換える\nこともできるでしょう。"
10154-210-1 = "偉大なる芸術家の言葉に\n「芸術は決して完成しない」と\nいうものがあります。"
10154-220-1 = "彼の者の目には、作品の\n欠点が映り続けるものですから。"
10154-230-1 = "完璧ではない私たちが、\n完璧なものを作るというのは\n不可能に等しいのでしょう。"
10154-240-1 = "ですが――\nそれを知っていてなお、"
10154-250-1 = "挑戦するのが\n芸術家というもの。"
10154-260-1 = "ふふ……ただの一般論です。\n私の話ではありませんよ。"
10154-270-1 = "悪魔の娘である\n黒鳥が王子を誘惑し、"
10154-280-1 = "白鳥に変えられた姫を不幸に\n陥れる話をご存じでしょうか？"
10154-290-1 = "先生から見て、\n私はどちらに似ていますか？"
10154-300-1 = "邪悪な黒鳥？\nそれとも純粋で哀れな白鳥？"
10154-310-1 = "この問いに正解はありません。\n思う存分、想像の羽を\n広げてみてください。"
10154-320-1 = "コレクションとは、\n必ずしも形を伴う\n必要はありません。"
10154-330-1 = "心の中に秘めておく\nこともできますから。"
10154-340-1 = "ふふ、そう言い換えた方が\nロマンチックかもしれませんね。"
10154-350-1 = "ですので、\n先生――今この瞬間を、\nあなたの心に\n保管してみませんか？"
10154-360-1 = "お誕生日おめでとうございます、\n先生。"
10154-370-1 = "誕生日プレゼントは、\n私の好きなビッグブラザーの\nクッションです。"
10154-380-1 = "別に、常時監視したいなんて\n思っていませんよ。"
10154-390-1 = "今日は私の誕生日です。"
10154-400-1 = "多くの生徒から祝福を\nいただきましたが――"
10154-410-1 = "ふふっ、先生はどのように\nお祝いしてくださる\nのでしょうか？\nとても楽しみです。"
10154-420-1 = "あけまして\nおめでとうございます。"
10154-430-1 = "私のこと、そして\nワイルドハント\n芸術学院のことを……"
10154-440-1 = "今年もよろしく\nお願いいたしますね。"
10154-450-1 = "クリスマスにこうして\n呼び出すというその意味――\nご存じないとは言わせませんよ。"
10154-460-1 = "ええ、相応の結果が\n得られるまで――帰る\nつもりはありませんので。\nふふっ、楽しみですね。"
10154-470-1 = "ハロウィンには、わが学院で\n大規模なお祭りが開催されます。"
10154-480-1 = "今日は私が\nエスコートいたしましょう。\nさあ、手を。"
10154-500-1 = "我がワイルドハント芸術学院は、\n歴史のある学園です。"
10154-510-1 = "歴代の優秀な評議会長の偉業は、\n今もなお語り継がれています。"
10154-520-1 = "ですが、私はそこに名を\n連ねることはないでしょう。"
10154-530-1 = "事情があるとはいえ、\n専攻の活動もできておらず――"
10154-540-1 = "学院の運営も、\n独裁的だと評されています。"
10154-550-1 = "それを不当だとは\n思っていません。"
10154-560-1 = "芸術とは、時を超えるもの。"
10154-570-1 = "私が守り抜いた芸術は、\n後世へと受け継がれていく\nことでしょう。"
10154-580-1 = "この学院と、\n学院の芸術を守ること――"
10154-590-1 = "それこそが、私が評議会長を\n続けている理由です。"
10154-600-1 = "ですから、\n先生――これからも……。"
10154-610-1 = "こんな私を、\n見守っていてくれますよね？"
10154-2600-1 = "私の敵はワイルドハントの敵。\n愚か者には、わが学院の流儀を\n身をもって味わっていただきます。"
