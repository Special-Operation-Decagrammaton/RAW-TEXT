[translation]
20059-10 = "蔚藍檔案！咯呵呵！"
20059-20 = "咯呵呵，無月醬大變身～！\n來，想要我做什麼？儘管說說看？"
20059-30 = "好想在這裡和大家\n開禮服派對啊～"
20059-40 = "咯呵呵，\n老師原來喜歡\n這種的啊？"
20059-50 = "有沒有人\n願意陪我玩呢～？"
20059-60 = "那個，玩弄一下的話\n感覺會很有趣♪"
20059-70 = "咯呵呵！\n好開心啊～\n總覺得\n我還挺喜歡這裡的。"
20059-80 = "歡迎你，老師！"
20059-90 = "居然敢讓穿著禮服的\n可愛無月醬等這麼久……"
20059-100 = "你還真是悠哉呢～？"
20059-110 = "這邊這邊！\n今天要玩什麼呢？"
20059-120 = "怎麼樣？無月醬，\n是不是很有大人味？"
20059-130 = "咯呵。\n你老實說也沒關係哦？"
20059-140 = "因為今天的我比平常\n更有「大人味」呀。"
20059-150 = "問題來囉～！\n為什麼無月醬要穿禮服呢！"
20059-160 = "猜中的話就把特別的禮物\n送・給・你♪"
20059-170 = "猜錯的話當作懲罰～"
20059-180 = "……就讓你當我的椅子吧♪"
20059-190 = "今天來玩點比平常\n更有大人味的遊戲吧。"
20059-200 = "至於要做什麼……\n可以交給老師決定哦？"
20059-210 = "剛才被人叫了\n一聲「大姐姐」。\n是因為穿了禮服嗎？"
20059-220 = "咯呵呵。\n我也好想被老師\n叫一次看看呢～？"
20059-230 = "這件禮服，\n是和便利屋的大家一起選的。"
20059-240 = "因為是充滿特別回憶的衣服，\n所以我想好好珍惜地穿著。"
20059-250 = "老師，\n今天是你的生日對吧？"
20059-260 = "那就來開派對吧！\n派對♪"
20059-270 = "啊哈哈！\n謝謝你幫我慶祝，\n老師♪"
20059-280 = "我想說老師應該會很開心，\n所以試著穿上了禮服……\n怎麼樣？開心嗎？"
20059-290 = "老師，新年快樂～\n希望今年也能是\n開心的一年呢♪"
20059-300 = "老師也這麼覺得吧？"
20059-310 = "在聖誕節穿禮服，\n是不是有什麼\n特別的意義呢？"
20059-320 = "要不要一起來\n調查看看？\n咯呵呵。"
20059-330 = "我的禮服是紅色的理由\n……你知道是為什麼嗎？"
20059-340 = "因為就算沾到血\n也不明顯――"
20059-350 = "騙你的啦！\n啊哈哈！\n被騙了吧～？"
20059-370 = "你知道嗎？\n別看我這樣……"
20059-380 = "其實還挺信任\n老師的哦？"
20059-390 = "咦，很意外？"
20059-400 = "……因為我\n總是在惡作劇嗎？"
20059-410 = "咯呵呵。\n我也不是對誰\n都會這樣的哦。"
20059-420 = "嗯，總之……\n那筆錢要怎麼處理，\n就交給你決定了。"
20059-430 = "如果是老師，\n一定會用在\n有意義的地方吧？"
20059-440 = "捐去某個地方也行……"
20059-450 = "拿來當作老師的\n活動資金也可以……"
20059-460 = "如果都不喜歡的話，\n就當作是交給老師保管……"
20059-470 = "為了我們的未來先存起來，\n或許也不錯？"
20059-480 = "咦？問我在說什麼？"
20059-490 = "咯呵呵！不知道耶？"
20059-500 = "是什麼意思呢♪"
20059-2600 = "咯呵呵♪沒錯沒錯～\n我最喜歡這種感覺了呢～"
