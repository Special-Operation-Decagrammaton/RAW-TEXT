[translation]
20059-10 = "Blue Archive! Kufufu!"
20059-20 = "Kufufu, Mutsuki here, all made up! Now then, what do you need? Whatever it be, let me know!"
20059-30 = "I want to throw a fancy party with everyone here."
20059-40 = "Kufufu, so this is the kind of stuff Sensei likes?"
20059-50 = "Is anyone going to play with me?"
20059-60 = "I think it'll be fun if I played with this a little! ♪"
20059-70 = "I knew this place would be fun! Can't say why, though!"
20059-80 = "Welcome, Sensei!"
20059-90 = "To make me, the adorable Mutsuki, wait here in a dress..."
20059-100 = "You're quite bold, aren't you?"
20059-110 = "This way, this way! What should we have fun with today?"
20059-120 = "How do I look? Do I look more mature in this?"
20059-130 = "Kufufu, you can be honest."
20059-140 = "Because I AM more mature today."
20059-150 = "Quiz! Why is Mutsuki wearing a dress today?"
20059-160 = "If you get it right, I'll give you a special gift! ♪"
20059-170 = "If you're wrong..."
20059-180 = "Your punishment will be to be my chair today! ♪"
20059-190 = "Should we play even more like adults today?"
20059-200 = "I'll leave which game up to you, Sensei."
20059-210 = "Someone called me a lady when I wore this outside."
20059-220 = "Kufufu, Sensei, you should call me a lady too. I want to hear it."
20059-230 = "Everyone in Problem Solver picked out this dress with me."
20059-240 = "I should take good care of it, since it has that special memory."
20059-250 = "Sensei, it's your birthday today, right?"
20059-260 = "Then let's throw a party! A party! ♪"
20059-270 = "Ahaha! Thanks for celebrating my birthday, Sensei! ♪"
20059-280 = "Wearing this dress is a sign of my appreciation! What'cha think? You like it?"
20059-290 = "Sensei, Happy New Year! I hope this year is a fun one! ♪"
20059-300 = "Don't you agree, Sensei? Right?"
20059-310 = "What does it mean to wear a dress on Christmas?"
20059-320 = "Would you like to find out together? Kufufu."
20059-330 = "Sensei. Do you know...why this dress is red?"
20059-340 = "Because it's easier to hide the bloodstains!"
20059-350 = "...Just kidding! Ahaha! Did I get ya?"
20059-370 = "You know? Despite everything..."
20059-380 = "...I trust you a lot, Sensei."
20059-390 = "Eh? That was surprising?"
20059-400 = "Because I'm pulling pranks all the time?"
20059-410 = "Kufufu. I don't say this to just anyone."
20059-420 = "That's why... I'll leave it up to you, what to do with the money."
20059-430 = "You of all people will put it to good use."
20059-440 = "You can donate it..."
20059-450 = "...or even use it to fund your hobbies."
20059-460 = "If none of that appeals to you, just keep it."
20059-470 = "It's never too early to start saving for our future, right?"
20059-480 = "Hm? What does that mean?"
20059-490 = "Kufufu! I wonder."
20059-500 = "What could it mean? ♪"
20059-2600 = "Yup! I was waiting for that! I love how this feels! ♪"
