[translation]
20059-10 = "Blue Archive! ฮุฮุฮุ!"
20059-20 = "ฮุฮุฮุ มุสึกิจังแปลงโฉม~ ครั้งใหญ่!\nเอาละ ต้องการอะไรเหรอ? บอกมาได้ทุกอย่างเลย!"
20059-30 = "อยากมาจัดปาร์ตี้\nชุดเดรสกับทุกคน\nที่นี่จังเลย~"
20059-40 = "ฮุฮุฮุ นี่คือรสนิยม\nของคุณครูใช่มั้ย?"
20059-50 = "จะมีใครมาเล่น\nด้วยบ้างมั้ยน้า~?"
20059-60 = "เอ๋ ถ้าลองลูบเบาๆ\nก็น่าจะสนุกนะ♪"
20059-70 = "สนุกจริงๆ ด้วย!\nถึงจะไม่รู้เหตุผลก็เถอะ!"
20059-80 = "เข้ามาสิ คุณครู!"
20059-90 = "ทำให้มุสึกิจังคนน่ารัก\nในชุดเดรสต้องรองั้นเหรอ"
20059-100 = "แหม ชิลจังเลยนะคะ?"
20059-110 = "ทางนี้ ทางนี้!\nวันนี้ไปเล่นอะไรกันดี?"
20059-120 = "เป็นไงบ้าง? พอใส่ชุดแบบนี้\nเค้าดูโตขึ้นหรือเปล่า?"
20059-130 = "ฮุฮุฮุ บอกมาตามตรงได้เลย"
20059-140 = "ก็วันนี้เค้าเป็นผู้ใหญ่\nมากกว่าทุกวันนี่นา"
20059-150 = "มีคำถามค่ะ~!\nทำไมมุสึกิจัง\nถึงใส่ชุดเดรสอยู่คะ!"
20059-160 = "ถ้าตอบถูก\nเค้าจะให้ของขวัญพิเศษเลย♪"
20059-170 = "แต่ถ้าผิดละก็"
20059-180 = "ต้องโดนลงโทษ\nโดยการมาเป็นเก้าอี้ของเค้า♪"
20059-190 = "วันนี้มาเล่นให้สมกับเป็นผู้ใหญ่\nมากกว่าทุกวันดีมั้ย?"
20059-200 = "เค้าให้ครูเลือกเลยว่าจะเล่นอะไร"
20059-210 = "พอใส่ชุดแบบนี้ ก็มี\nคนเรียกเค้าว่าคุณหนูด้วย"
20059-220 = "ฮุฮุฮุ คุณครูก็เรียกเค้า\nว่าคุณหนูดูสิ เค้าอยากฟังนะ"
20059-230 = "ชุดนี้น่ะ ทุกคนในหน่วย\nรับจ้างสารพัดช่วยเลือกให้"
20059-240 = "ต้องใส่อย่างทะนุถนอมเลยละ\nก็มันเต็มไปด้วยความทรงจำ\nแสนพิเศษนี่นา"
20059-250 = "คุณครู วันนี้วันเกิดใช่มั้ย?"
20059-260 = "งั้นมาจัดปาร์ตี้กัน! ปาร์ตี้♪"
20059-270 = "อะฮะฮ่า!\nขอบคุณที่ช่วยอวยพรวันเกิดนะ คุณครู♪"
20059-280 = "เค้าใส่ชุดเดรสมาเป็นการตอบแทนแล้ว\nเป็นไงบ้าง? ชอบมั้ย?"
20059-290 = "คุณครู สวัสดีปีใหม่~\nหวังว่าปีนี้\nจะเป็นปีที่สนุกสนานนะ♪"
20059-300 = "คุณครูก็คิดเหมือนกันใช่มั้ย?\nใช่มั้ยล่ะ?"
20059-310 = "ชุดเดรสที่ใส่ในวันคริสต์มาส\nมันมีความหมายยังไงนะ?"
20059-320 = "ถ้าสงสัยก็ไปหาคำตอบด้วยกันมั้ย?\nหุหุหุ"
20059-330 = "คุณครู\nรู้หรือเปล่าว่า...\nทำไมชุดเดรสนี้เป็นสีแดง?"
20059-340 = "นั่นก็เพราะ\nต่อให้เลือดกระเซ็นใส่\nก็จะดูไม่ออกยังไงล่ะ..."
20059-350 = "ล้อเล่นน่า...!\nอะฮะฮ่า! เผลอเชื่อแล้วใช่มั้ย?"
20059-370 = "รู้หรือเปล่า? เห็นเค้าอย่างนี้"
20059-380 = "เค้าก็เชื่อใจมากเลยนะ\nเชื่อใจคุณครูน่ะ"
20059-390 = "เอ๋ คาดไม่ถึงเหรอ?"
20059-400 = "เพราะเค้าเอาแต่\nแกล้งเล่นอยู่ตลอดงั้นเหรอ?"
20059-410 = "ฮุฮุฮุ\nเค้าก็ไม่ได้เป็นแบบนี้\nกับทุกคนหรอกนะ"
20059-420 = "ก็ เอาเป็นว่า...\nเค้าจะให้ตัดสินใจเองแล้วกัน\nว่าจะเอาเงินนั้นไปทำอะไร"
20059-430 = "ถ้าเป็นคุณครูละก็\nต้องเอาไปใช้\nในทางที่ดีอยู่แล้ว"
20059-440 = "จะเอาไปบริจาคให้ที่ไหนก็ได้"
20059-450 = "หรือใช้เป็นทุนทำกิจกรรม\nของคุณครูก็ได้เหมือนกัน"
20059-460 = "ถ้ายังไม่ชอบ\nคุณครูก็เก็บติดตัว\nไว้ตลอดแล้วกัน"
20059-470 = "เก็บออมไว้\nเพื่ออนาคตของเรา\nก็ดีเลยไม่ใช่เหรอ?"
20059-480 = "หืม? หมายความว่ายังไงน่ะเหรอ?"
20059-490 = "ฮุฮุฮุ! ก็ไม่รู้สิ?"
20059-500 = "จะหมายความว่ายังไงน้า♪"
20059-2600 = "อื้อ♪ กำลังรออยู่เลย!\nเค้าชอบการสัมผัสแบบนี้น่ะ!"
