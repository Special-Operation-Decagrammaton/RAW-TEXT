[translation]
20047-10-1 = "ブルー……アーカイブ。"
20047-20-1 = "百花繚乱の作戦参謀だもの……\n水泳なんて児戯に等しい。……教本は熟読しているよ。\nさあ、行くよ。"
20047-30-1 = "ふ～ん……先生は\nこういうのが\n趣味なんだ。"
20047-40-1 = "力を抜いて……\n深呼吸……\n水に浮くのって……\n難しい……。"
20047-50-1 = "日差しがちょうど\n良いところ……\nどこだろう"
20047-60-1 = "水着……少し\n小さかったかな。"
20047-70-1 = "レンゲって、\n泳ぐの上手……。"
20047-80-1 = "おかえり、先生。"
20047-90-1 = "約束、忘れてないよね？\n……水泳の授業、\nしてくれるんでしょう？"
20047-100-1 = "いい天気だね。"
20047-110-1 = "じゃ、海に行くから。\nさっさと支度して。"
20047-120-1 = "あんたも知っての通り、\n私は水が苦手。"
20047-130-1 = "海なんてもってのほか。\nでも……。"
20047-140-1 = "みんなとなら……\n悪くない。"
20047-150-1 = "……分かってる？\n「みんな」にはあんたも\n入ってるんだけど。"
20047-160-1 = "ああ、これ？\n百花繚乱のみんなに\n勧められたの。"
20047-170-1 = "すごく似合ってる、\nって言われて。"
20047-180-1 = "……あんたもそう思うんだ。"
20047-190-1 = "そう……\nそれは、よかった。"
20047-200-1 = "今度、水着を\n買いに行こうか。"
20047-210-1 = "私のじゃない、あんたの。\n選んであげるから。"
20047-220-1 = "もちろん、私の好みで。\n反論は受けつけない。"
20047-230-1 = "一番覚えやすくて\n簡単な泳ぎ方ってどれ？"
20047-240-1 = "犬かき？\n……ぶつよ。"
20047-250-1 = "泳げないって弱点を、\nあんたは知っている。"
20047-260-1 = "だから私にも教えて？\nあんたの弱点。"
20047-270-1 = "同盟を組むなら、\n弱点をさらけ出し合わないと。"
20047-280-1 = "だって、運命共同体\n……でしょう？"
20047-290-1 = "今日は特別。\nだって、あんたが\n生まれた日だもの。"
20047-300-1 = "……こんな格好で誰かの\n誕生日を祝う日が来るとは\n思わなかったけど。"
20047-310-1 = "先生は……\nどんな想い出が欲しい？"
20047-320-1 = "今日、私の誕生日。\n覚えてるよね？"
20047-330-1 = "この後の予定は、\n全部キャンセルして。"
20047-340-1 = "あんたと過ごすための\n作戦は、全部練ってあるから。"
20047-350-1 = "……元から予定を\n空けてあるの？"
20047-360-1 = "そう。\n良い判断だと思うよ。"
20047-370-1 = "今日はお正月だから、\n場違いで……"
20047-380-1 = "強い印象を残せる服装に\nしてみたんだけど……\nどうかな。"
20047-390-1 = "ふふっ、作戦参謀らしい\n奇策だと思わない？"
20047-400-1 = "この格好？\nここから動く気は\nないって意思表示。"
20047-410-1 = "私は今日をここで\n過ごしたい。"
20047-420-1 = "あんたは、隣に\nいてくれるでしょう？"
20047-430-1 = "ハロウィーンだから\n仮装をして\nみたんだけど……。"
20047-440-1 = "水着を選んだ\n理由……？"
20047-450-1 = "その驚いた顔が\n見たかったから。"
20047-460-1 = "ふふ、\nいたずら成功。"
20047-480-1 = "どう？\nなかなかじゃない？"
20047-490-1 = "今日のために\n作ったの。"
20047-500-1 = "ほら、\n存分に楽しんで。"
20047-510-1 = "実は……全部、\n初めてなんだ。"
20047-520-1 = "何かを作っているとき、\n誰かの顔が\nずっと浮かぶのも。"
20047-530-1 = "無防備な姿を、\n誰かに見せるのも。"
20047-540-1 = "別に……誰とまでは\n言わないけど。"
20047-550-1 = "……これからも\n私のそばにいて。"
20047-560-1 = "あんたの隣は、\n私が守るから。"
20047-570-1 = "……この同盟は、\n永遠だからね。"
20047-2600-1 = "ふぅん……これが、先生なりの信頼、なんだ。\nじゃあ、これからはもっと……\nとことん頼って。\n私があんたのこと信じてるみたいに。\n……できるでしょう？"
