[translation]
20047-10-1 = "Blue... Archive"
20047-20-1 = "ฉันคือที่ปรึกษายุทธศาสตร์ของเฮียกกะเรียวรัน\nการว่ายน้ำน่ะไม่ใช่ปัญหาหรอก\nฉันอ่านหนังสือว่ายน้ำมาหลายเล่มเพื่อวันนี้เลย"
20047-30-1 = "ฮืม คุณครูมีรสนิยม\nแบบนี้เองสินะ"
20047-40-1 = "ผ่อนคลาย... หายใจเข้าลึกๆ\nทำไมการลอยตัวในน้ำ...\nมันถึงยากจัง..."
20047-50-1 = "ตรงไหนบ้างนะ\nที่แสงแดดส่องถึง?"
20047-60-1 = "ชุดว่ายน้ำตัวนี้มัน...\nรัดไปนิดหน่อยนะ"
20047-70-1 = "ทำไมเรนเกะถึง\nว่ายน้ำเก่งแบบนั้นนะ?"
20047-80-1 = "เข้ามาสิ คุณครู"
20047-90-1 = "ไม่ลืมใช่มั้ยว่าวันนี้ก็\nจะมาสอนฉันว่ายน้ำน่ะ?"
20047-100-1 = "อากาศดีจังเลยนะ"
20047-110-1 = "แน่นอนสิ ก็เราจะไปทะเล\nกันนี่นา รีบเตรียมตัวเร็วเข้า"
20047-120-1 = "คุณก็น่าจะรู้ว่า\nฉันไม่ค่อยชอบ\nลงน้ำสักเท่าไร"
20047-130-1 = "ฉันก็เลยไม่ชอบทะเลด้วย\nแต่ว่า..."
20047-140-1 = "ถ้าได้อยู่กับทุกคน...\nมันก็ไม่แย่นะ"
20047-150-1 = "ถือว่าเป็นเกียรติเลยนะ\nเพราะทุกคนที่ฉันพูดถึง\nก็มีคุณอยู่ด้วย"
20047-160-1 = "ชุดว่ายน้ำชุดนี้\nทุกคนในเฮียกกะเรียวรัน\nช่วยกันเลือกให้น่ะ"
20047-170-1 = "พอเห็นชุด ทุกคนก็\nบอกว่าเหมาะกับฉันเลย"
20047-180-1 = "คุณก็คิดเหมือนกันงั้นเหรอ...?"
20047-190-1 = "ขอบใจนะ"
20047-200-1 = "ไว้เราไปเลือก\nชุดว่ายน้ำด้วยกันนะ"
20047-210-1 = "ไม่ใช่ของฉัน ของคุณต่างหาก\nเดี๋ยวฉันเลือกให้เอง"
20047-220-1 = "แต่ฉันจะเลือกตามรสนิยมของฉันนะ\nขอไม่ฟังความเห็นต่างด้วย"
20047-230-1 = "คุณครู ท่าว่ายน้ำอะไร\nที่ฝึกง่ายที่สุดเหรอ?"
20047-240-1 = "ท่าลูกหมาตกน้ำ... งั้นเหรอ?\nฮุฮุ อยากโดนดุสินะ"
20047-250-1 = "คุณรู้จุดอ่อนของฉัน\nว่าฉันว่ายน้ำไม่เป็น"
20047-260-1 = "เพราะงั้นก็บอกจุดอ่อน\nของคุณมาบ้างสิ"
20047-270-1 = "ถ้าจะเป็นพันธมิตรกัน\nก็ต้องบอกจุดอ่อนกันสิ"
20047-280-1 = "ก็เพราะว่าเรา\nลงเรือลำเดียวกัน... แล้วนี่นา?"
20047-290-1 = "วันนี้เป็นวันพิเศษ\nเพราะว่าเป็นวันเกิดของคุณ"
20047-300-1 = "ไม่คิดเลยนะว่าฉันจะได้\nอวยพรวันเกิดใคร\nในชุดแบบนี้น่ะ..."
20047-310-1 = "คุณครู... อยากสร้าง\nความทรงจำแบบไหนเหรอ?"
20047-320-1 = "คุณครู วันนี้วันเกิดฉันละ"
20047-330-1 = "เพราะงั้นวันนี้ก็\nทำตัวให้ว่างทั้งวันเลยนะ"
20047-340-1 = "ก็ฉันวางแผนที่จะ\nใช้เวลาทั้งวันกับคุณ\nไว้หมดแล้วน่ะสิ"
20047-350-1 = "หืม...? ตั้งใจทำตัวให้ว่าง\nอยู่แล้วงั้นเหรอ?"
20047-360-1 = "ใช้ได้เลยนะ"
20047-370-1 = "วันนี้วันปีใหม่\nฉันก็เลยใส่ชุดพิเศษๆ ดู"
20047-380-1 = "จะได้เป็นที่จดจำ\nมากกว่าเวลาอื่นไงล่ะ"
20047-390-1 = "ฮุฮุ เป็นอุบายที่สมกับ\nปรึกษายุทธศาสตร์เลยว่ามั้ย?"
20047-400-1 = "การใส่ชุดแบบนี้\nกระทั่งในวันคริสต์มาส\nคือการแสดงความตั้งใจว่า\nฉันไม่อยากออกไปข้างนอกน่ะ"
20047-410-1 = "วันนี้ฉันอยากอยู่ที่นี่"
20047-420-1 = "คุณก็จะอยู่ข้างๆ กันใช่มั้ย?"
20047-430-1 = "ฉันใส่ชุดฮาโลวีน\nสุดพิเศษมา\nเพื่อคุณครูเลย"
20047-440-1 = "เหตุผลที่เลือก\nชุดว่ายน้ำน่ะเหรอ...?"
20047-450-1 = "ฉันอยากเห็นใบหน้าที่\nประหลาดใจแบบนั้นไง"
20047-460-1 = "ฮุฮุ\nแกล้งสำเร็จแล้ว"
20047-480-1 = "เป็นยังไงล่ะ?\nใช้ได้เลยใช่มั้ย?"
20047-490-1 = "ฉันถักมันไว้\nเพื่อวันนี้เลย"
20047-500-1 = "หวังว่า\nคุณจะสนุกให้เต็มที่เลยนะ"
20047-510-1 = "ที่จริง...\nนี่เป็นครั้งแรกเลยละ"
20047-520-1 = "ที่ฉันทำอะไร\nแล้วนึกถึงหน้าของ\nใครบางคนตลอดเลย"
20047-530-1 = "รวมถึงการให้ใครได้เห็น\nฉันที่ผ่อนคลายแบบนี้ด้วย"
20047-540-1 = "ฉันจะ... ไม่บอกหรอกนะ\nว่าคนคนนั้นคือใคร"
20047-550-1 = "แต่ต่อไปก็ช่วยอยู่ข้างๆ ฉันด้วยนะ..."
20047-560-1 = "ฉันเองก็จะคอยปกป้องคุณ\nอยู่ข้างๆ เหมือนกัน"
20047-570-1 = "พันธมิตรของเรา\nจะไม่มีวันเสื่อมคลายนะ..."
20047-2600-1 = "ฮืม... นี่คือความน่าเชื่อถือในแบบ\nคุณครูสินะ งั้นต่อไปก็...\nมาพึ่งพิงฉันให้มากขึ้นนะ\nเหมือนที่ฉันพึ่งพิงคุณไง\nทำได้ใช่มั้ย...?"
