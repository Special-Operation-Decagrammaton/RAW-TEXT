[translation]
20039-10-1 = "Blue Archive... สินะ"
20039-20-1 = "เราคือประมุขแห่งมังกรดำ โรงเรียนมัธยมซานไห่จิง\nริวเกะ คิซากิ\nฮุฮุ ต้องการพลังจากเราหรือ?"
20039-30-1 = "ฮืม... มีที่ให้วาง\nธูปหอมมั้ยนะ?"
20039-40-1 = "(ภายนอกซานไห่จิง\nช่างมีอะไร...\nหลากหลายเหลือเกิน)"
20039-50-1 = "เป็นที่ที่เหมาะกับ\nการดื่มชาเลยนะ..."
20039-60-1 = "(นั่นมัน...\nอะไรกันน่ะ...?)"
20039-70-1 = "พออยู่ที่นี่ก็\nสบายตัวขึ้นมาเลยนะ"
20039-80-1 = "มาแล้วหรือครู? ฮุฮุ ทำให้ประมุขแห่ง\nมังกรดำต้องรอเชียวหรือ\nอาจหาญจังเลยนะ"
20039-90-1 = "เรารออยู่นานแล้วนะ ครู"
20039-100-1 = "นี่เป็นเรื่องสำคัญมาก\nตั้งใจฟังเราให้ดีเล่า"
20039-100-2 = "เรารออยู่นานเลยนะ ครู"
20039-100-3 = "เราไม่อาจปกครองผู้คน\nด้วยพละกำลังได้หรอก หากทำเช่นนั้น\nก็จะสูญเสียจิตใจไปน่ะ"
20039-110-1 = "แต่ครูก็คงรู้ดีอยู่แล้วละ"
20039-110-2 = "เรียกเราหรือครู? หืม?\nแค่อยากลองเรียกดูอย่างนั้นหรือ?"
20039-120-1 = "ฮุฮุ เป็นคนที่ชอบแกล้งกันเล่นสินะ\nไม่เป็นไรหรอก เพราะเราก็\nเป็นเช่นนั้นเหมือนกัน"
20039-130-1 = "นานแล้วนะที่ไม่ได้\nออกมานอกซานไห่จิง"
20039-140-1 = "แล้วยังได้มาอยู่ที่ชาเล่ต์อีก\nช่วงเวลานี้ช่างพิเศษจริงๆ"
20039-140-2 = "เหนือสิ่งอื่นใดแล้ว\nที่นี่มีครูอยู่อย่างไรเล่า"
20039-150-1 = "เคยคิดว่าอยากหยุดเวลา\nไว้อย่างนี้หรือไม่เล่า ครู?"
20039-160-1 = "เราเคยนะ วินาทีนี้\nเรากำลังคิดเช่นนั้นอยู่เลย"
20039-170-1 = "เราวางธูปหอมเอาไว้ให้\nกลิ่นหอมใช่มั้ยเล่า?"
20039-180-1 = "ไว้เรามาชงชา\nด้วยกันดีมั้ยเล่า?"
20039-190-1 = "ถ้าเหนื่อยก็มางีบด้วยกัน\nได้นะ... คิดเหมือนกันมั้ยเล่า?"
20039-200-1 = "เราจำได้ดี ไม่มีทางลืมเลยละ"
20039-210-1 = "เพราะนี่เป็นวันที่ครู\nได้พบกับโลกใบนี้\nเป็นครั้งแรกอย่างไรเล่า"
20039-210-2 = "เอาละ จงรีบเตรียมตัว\nเราจะทำให้เห็นการต้อนรับ\nที่ดีที่สุดของซานไห่จิง"
20039-220-1 = "เช่นนั้นหรือ... จำได้อย่างนั้นหรือ"
20039-230-1 = "ขอบคุณนะครู\nเราได้รับการอวยพร\nจากผู้คนมากมาย..."
20039-240-1 = "แต่การอวยพรจากครู\nทำให้เราดีใจมากกว่าของใครเลย"
20039-250-1 = "ฮุฮุ ต้องบอกว่า\nสวัสดีปีใหม่สินะ"
20039-260-1 = "รับถุงนี่ไปสิ\nอ้อ แล้วก็เกี๊ยวปลา\nและก็ดอกไม้ไฟด้วย..."
20039-260-2 = "หืม? นี่คือสิ่งที่\nครูต้องให้อย่างนั้นหรือ....?"
20039-270-1 = "......"
20039-280-1 = "เป็นเช่นนั้นเลย!"
20039-290-1 = "คริสต์มาส... ใช่หรือไม่นะ?\nขอให้เป็นวันที่สงบสุขนะ"
20039-300-1 = "เราเอาแอปเปิลมาให้\nมาช่วยถือหน่อยสิ"
20039-300-2 = "ฮาโลวีน... ใช่หรือไม่นะ?\nเราไม่แน่ใจเท่าไหร่หรอก..."
20039-310-1 = "แต่ก็พอรู้ว่าเป็นวันที่\nกินฟักทองกันน่ะ"
20039-310-2 = "รับไปสิ อาหารที่ทำจาก\nฟักทองและพุทราน่ะ\nเราคิดว่าอยากกินกับครูน่ะ"
20039-330-1 = "ฮุฮุ... ในที่สุดก็\nมองมาทางนี้สินะ"
20039-340-1 = "แต่ว่า ครู\nลองคิดดูสักครั้งสิ"
20039-350-1 = "เราในตอนนี้\nอาจจะอ่อนแอลงไปจริงๆ..."
20039-360-1 = "หรือที่จริง เราอาจแกล้ง\nทำเป็นอ่อนแออยู่ก็ได้นะ?"
20039-370-1 = "หรือไม่ก็... เราอาจทำไปเพื่อ\nดูปฏิกิริยาจากครู"
20039-380-1 = "หรืออาจจะแค่เชื่อใจครู\nอยู่อย่างหมดใจก็ได้"
20039-390-1 = "ทว่า... ใช่แล้วละ\nเรื่องนี้เราให้สัญญาได้"
20039-400-1 = "ไม่ว่าจะเกิด\nเรื่องอะไรขึ้นที่นี่..."
20039-410-1 = "เราก็จะไม่ตำหนิ\nครูหรอกนะ\nตลอดไปเลยละ..."
20039-2600-1 = "เหนื่อยแย่เลยนะ ครู ฮุฮุ นี่อาจจะ\nไม่ใช่เรื่องที่เราจะพูดได้...\nแต่ก็ขอบคุณจากใจจริงเลยนะ\nเราจะเดิมพันด้วยทุกอย่าง\nแล้วรักษาไว้อย่างดีเลย"
