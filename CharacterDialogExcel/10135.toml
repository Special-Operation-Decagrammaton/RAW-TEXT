[translation]
10135-10-1 = "言わなきゃいけないんですよね……？\nブルー、アーカイブ。"
10135-20-1 = "こんにちは、ケイです。\n何をそんなに慌てているんですか……？\nはぁ……これから、先生のことを\n見守らせていただきますね。"
10135-30-1 = "（私だって\n「生徒」ですから……\nカフェくらい……！）"
10135-40-1 = "あれは……\nどんな味\nなんでしょう？"
10135-50-1 = "なるほど……これが、\nまったりすると\nいうこと……。"
10135-60-1 = "自分の身体を\n持つのは……。\n不便なことでも\nあるんですね……。"
10135-70-1 = "ふふ……\nこうして立っている\nだけでも、\nなんだか楽しいです……。"
10135-80-1 = "もう、何してたんですか？\n遅いですよ！"
10135-90-1 = "準備は済ませておいたので……\nはい、座ってください。"
10135-100-1 = "あっ、いらしたのですね。\nでは始めましょうか。"
10135-110-1 = "……何を\nニヤニヤしてるんですか！"
10135-120-1 = "可愛いって\n言うのやめてください！"
10135-130-1 = "い、嫌なのかって……？\nと、というより……！"
10135-140-1 = "……。"
10135-150-1 = "可愛い以外も言ってください、\nという意味です……。"
10135-160-1 = "どうしていつも\n怒ってばっかりなのか……？"
10135-170-1 = "……失礼ですね。別に\n怒っているわけじゃないです。"
10135-180-1 = "でもまあ……\n世の理を知ってしまえば。"
10135-190-1 = "怒らないでいるのは難しい、\nと思っているのですが。"
10135-200-1 = "これを機に\n言わせてもらいますが。"
10135-210-1 = "食事はちゃんと取っていますか？\n適度な運動も必要です。"
10135-220-1 = "早寝早起きが良いのは、\n大人にも当てはまる\nことなんですよ。"
10135-230-1 = "仕事はほどほどに。\nとはいえ怠けるのもほどほどに。"
10135-240-1 = "……本当にもう、\n手が焼けるんですから。"
10135-250-1 = "ああ、もう！\nだからそんな風に子ども\n扱いしないでください！"
10135-260-1 = "……私、そこまで\n幼くないですから。"
10135-270-1 = "笑いました！？\n今笑いましたね！？\n私ちゃんと見たんですから！"
10135-280-1 = "覚えててくださいよ！？\nいつかその身にしかと\n分からせてやるんですから！！"
10135-290-1 = "何ですか？\n用がないなら\n呼ばないでください。"
10135-300-1 = "えっ？\n私がちゃんといるのか\n確認するのが仕事？"
10135-310-1 = "本当にこの人は！\nいっつも\n適当なことばっかり言って！"
10135-320-1 = "でもまあ……\nこういうやりとりも、\n嫌いではありません。"
10135-330-1 = "こんにちは、先生。"
10135-340-1 = "えっ？\n何か言いたいことはないか？"
10135-350-1 = "……。"
10135-360-1 = "ないです。"
10135-370-1 = "ないったらないと\n言っているでしょう！"
10135-380-1 = "……。"
10135-390-1 = "お誕生日おめでとうございます、\n先生。"
10135-400-1 = "えっ！？\n私の誕生日ですか？\nそ、それよりアリスの\n誕生日を……！"
10135-410-1 = "えっ、同じ日だから\nいいじゃないかって……。\nそ、それはそうですが……！"
10135-420-1 = "……ありがとうございます。"
10135-430-1 = "あけまして\nおめでとうございます。\nお正月……\n新年の初日ですが……。"
10135-440-1 = "いえ、私もそろそろ\n慣れないといけませんね。"
10135-450-1 = "もう立派な\n「生徒」なのですから。"
10135-460-1 = "別にプレゼントとか\n求めていません。"
10135-470-1 = "もちろん、\n頂けるならちゃんと\n頂きますが。"
10135-480-1 = "……。"
10135-490-1 = "ほ、本当に\n何もないんですか……？"
10135-500-1 = "……！！\nあ、ありがとうございます……！"
10135-510-1 = "霊が帰ってくる日……だなんて、\n迷信深い祝祭ですね……。"
10135-520-1 = "……。"
10135-530-1 = "私に、飴はないんですか？"
10135-550-1 = "心配しないでください。"
10135-560-1 = "私が消えることはありません。"
10135-570-1 = "むしろ、その逆ですね。"
10135-580-1 = "私は、どんな手を使ってでも\n生き残ってやるつもりですから。"
10135-590-1 = "先生がこの世界を\n見捨てないというのなら。"
10135-600-1 = "私だって最後まで、\n絶対に諦めたりしません。"
10135-610-1 = "だから大丈夫……\n絶対、大丈夫です。"
10135-620-1 = "私はずっとここにいます。"
10135-630-1 = "ここだけの話ですけど……\n私は――"
10135-640-1 = "先生のこと、\n嫌いじゃありませんから。"
10135-2600-1 = "遠き地の星明かり……という意味です。\nそれだけ昔のことを言っているのだと\n思います。座標によると、過去と未来は\n同時に存在するとも言いますから。"
