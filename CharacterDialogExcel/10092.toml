[translation]
10092-10-1 = "蔚藍檔案～！！"
10092-20-1 = "你可以期待……\n不，好好期待吧！我的演奏！！"
10092-30-1 = "挺寬敞的呢……\n好像很適合演奏。"
10092-40-1 = "本來想\n練習一下的，\n人好多……"
10092-50-1 = "肚子餓了，\n有沒有甜食？"
10092-60-1 = "要不要休息\n一下呢……"
10092-70-1 = "奇怪。不是說\n在這裡集合嗎？"
10092-80-1 = "老，老師！？\n你什麼時候來的……！？"
10092-90-1 = "我，我？\n只是稍微把練習……"
10092-100-1 = "歡迎你，老師！"
10092-110-1 = "如，如果那個……\n那個……"
10092-120-1 = "BGM……需要嗎？\n我幫你演奏吧？"
10092-130-1 = "總覺得，這樣\n會比平常更有自信。"
10092-140-1 = "怎，怎樣！？為什麼\n要那樣盯著我看啊……？"
10092-150-1 = "想要什麼東西的話\n就用嘴巴說嘛！"
10092-160-1 = "要是有帶一些\n食物來就好了……"
10092-170-1 = "老師，有想吃的東西嗎？"
10092-180-1 = "本來以為練習\n一定會比上課有趣，"
10092-190-1 = "結果認真做起來\n也是挺累的。"
10092-200-1 = "嗯？問我是不是\n忙著練習？"
10092-210-1 = "是，是沒錯啦……"
10092-220-1 = "話說為什麼突然這麼問啊！？\n你是故意的吧！？\n為了說噁心的話！！"
10092-230-1 = "祝你生日快樂♪\n祝你生日快樂♪"
10092-240-1 = "……為什麼要唱！？"
10092-250-1 = "別說廢話！"
10092-260-1 = "嗯，嗯？我的生日……？"
10092-270-1 = "你果然記得啊？"
10092-280-1 = "新年快樂，老師！"
10092-290-1 = "有想聽的曲子嗎？"
10092-300-1 = "是聖誕節！"
10092-310-1 = "怎，怎樣！？\n我現在也不是還相信\n聖誕老人的年紀好嗎！？"
10092-320-1 = "是熱鬧的日子！\n我不討厭。\n反而想做點什麼呢？"
10092-340-1 = "呼……呼……\n……成，成功了……\n我辦到了……"
10092-350-1 = "是，是嗎……？\n老師聽完也\n這麼認為嗎……？"
10092-360-1 = "不是跟我開玩笑的吧？\n這……是真實的感想嗎？"
10092-370-1 = "總覺得……心跳得很快……"
10092-380-1 = "這種事，還是第一次……"
10092-390-1 = "……老師……\n回頭想想，\n這是不是第一次\n讓老師看見呢……"
10092-400-1 = "怎麼說才好……那個……"
10092-410-1 = "……我「帥氣」的模樣……\n之類的……"
10092-2600-1 = "不管情況如何，老師就是老師呢……\n原來如此，我也是一樣的吧？\n無論是什麼情況……\n有需要的話就叫我吧！我會過去的！"
