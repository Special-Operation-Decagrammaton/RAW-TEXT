[translation]
10092-10-1 = "ブルーアーカイブ～！！"
10092-20-1 = "期待していいから…いや期待して！\n私の演奏！！"
10092-30-1 = "結構広いわね…\n演奏するのに\nちょうど良いかも。"
10092-40-1 = "練習しようと\n思ったのに、\n人が多い…。"
10092-50-1 = "お腹空いた、どこかに\n甘い物無いかな？"
10092-60-1 = "ちょっと\n休もうかな…。"
10092-70-1 = "あれ。\nここに集まるって\n言ってなかった？"
10092-80-1 = "せ、先生！？\nいつ来たの…！？"
10092-90-1 = "わ、私？\nれ、練習をちょっと…。"
10092-100-1 = "ようこそ、先生！"
10092-110-1 = "も、もしその…その…。"
10092-120-1 = "BGM…いる？\n演奏、しようか？"
10092-130-1 = "なんか、こうしてると\nいつもより自信が\n溢れてくるんだよね。"
10092-140-1 = "な、なに！？\n何でそんなにじっと\n見てくるのよ…？"
10092-150-1 = "欲しいものがあるなら\n口で言ってよ！"
10092-160-1 = "何か食べ物でも\n持ってくればよかった…。"
10092-170-1 = "先生、食べたい物ある？"
10092-180-1 = "練習の方が授業より絶対\n楽しいと思ってたんだけど、"
10092-190-1 = "真面目にやると\nこっちも大変なのよね。"
10092-200-1 = "うん？練習で\n忙しいんじゃないかって？"
10092-210-1 = "そ、それはそうだけど…。"
10092-220-1 = "というか、何で急に聞くのよ！？\nわざとでしょ！？\nクサいこと言おうとして！！"
10092-230-1 = "ハッピーバースデートゥーユー♪ハッピーバースデートゥーユー♪"
10092-240-1 = "…何で歌うのって！？"
10092-250-1 = "余計なこといわない！"
10092-260-1 = "う、ううん？私の誕生日…？"
10092-270-1 = "やっぱり、覚えてたんだ？"
10092-280-1 = "あけましておめでとう、先生！"
10092-290-1 = "聞きたい曲とかある？"
10092-300-1 = "クリスマスかー！"
10092-310-1 = "な、何！？別にもう\nサンタを信じるような\n歳じゃないから！？"
10092-320-1 = "わちゃわちゃな日だね！\n嫌いじゃない。\nむしろ何かしたいわね？"
10092-340-1 = "ふぅ……ふう…。\n…や、やった…。\nやり遂げたわ…。"
10092-350-1 = "そ、そう…？\n先生が聴いてた\n感じもそうだった…？"
10092-360-1 = "ふざけてるんじゃないわよね？\nこれは…本当にそう思ってる？"
10092-370-1 = "なんか…ドキドキして…。"
10092-380-1 = "こんなの、初めて…。"
10092-390-1 = "…先生…。\n思い返して見たら、先生に\n初めて見せたんじゃないかな。"
10092-400-1 = "なんというか…\nその…。"
10092-410-1 = "…私の\n「格好いい」姿…\nってやつ…。"
10092-2600-1 = "どんな状況でも先生は先生なんだね…。\nそっか。私も同じなんだよね？\nどんな状況でも…\n必要なら呼んでよね！私、行くから！"
