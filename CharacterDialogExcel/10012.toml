[translation]
10012-20-1 = "ウェイトトレーニングは科学です。\nミレニアムの最先端の理論が、輝きを放つ領域なんです。"
10012-30-1 = "へぇ…。"
10012-40-1 = "トレーニングできる\nところはあるのかな…。"
10012-50-1 = "フリーウェイトをするのに\n良さそうなところです。"
10012-60-1 = "え？\n一緒にストレッチを、ですか？"
10012-70-1 = "はい、次は一緒にロードワークを？"
10012-80-1 = "おかえりなさい、トレーナー。\n今日も一緒に頑張りましょう。"
10012-90-1 = "お待ちしておりました。\nそれではトレーニングを\n始めましょう。"
10012-100-1 = "視点が変わると、\n世界が変わって見えます。"
10012-110-1 = "階段だって立派な\n運動器具です。"
10012-120-1 = "それではまず、\nロードワークから\n始めましょう。"
10012-130-1 = "はい？なぜ制服では\nないのか、ですか？"
10012-140-1 = "トレーニングするのに\n不便だからです。"
10012-150-1 = "最近生徒の間では筋トレが\n流行っているんですよ。"
10012-160-1 = "…はい、すみません。\n私の妄想です。"
10012-170-1 = "太ももは第2の心臓と\n呼ばれています。\nしっかり鍛錬し\nないといけません。"
10012-180-1 = "トレーナー、お誕生日\nおめでとうございます。\nプレゼントを\n用意したんですが…"
10012-190-1 = "え？もしかして\nダンベルかな、ですか？"
10012-200-1 = "祝ってくださって\nありがとうございます。"
10012-210-1 = "欲しい物ですか？"
10012-220-1 = "えーっと…\n最高級のプロテイン…\nではなく！"
10012-230-1 = "か、可愛い猫の人形が、\n欲しいです！"
10012-240-1 = "願い事があるとすれば、\n今年一年もまたみんな、\n健康で過ごしてほしいですね。"
10012-250-1 = "クリスマスとは、"
10012-260-1 = "かつて救世主が\n生まれた日だ\nそうですね。"
10012-270-1 = "よく知りませんが、\n救世主はきっと\n筋肉質に違いないです。"
10012-280-1 = "トレーナー、\nプロテインキャンディ\n食べますか？"
10012-290-1 = "え？\n味ですか？"
10012-300-1 = "…私にも、\nそういうのが大事だと\n思っていた時期がありました。"
10012-320-1 = "どうですかトレーナー、\n運動は、楽しいでしょう？"
10012-330-1 = "健康になる感じが、\nしませんか？"
10012-340-1 = "あ、えっと…\nあ、あまり見つめないで\nください。"
10012-350-1 = "(トレーニング中は\nひどい見た目だし…)"
10012-360-1 = "ど、どこを\n見てるんですか…？"
10012-370-1 = "…トレーナー、\nお願いがあります。"
10012-380-1 = "これからも、\nずっと一緒に\n運動をしましょう。"
10012-390-1 = "私はトレーナーが\n健康でいてほしいです。"
10012-400-1 = "り、理由ですか？\nそ、それは…。"
10012-410-1 = "ふふっ。\n当ててみてください。"
10012-2600-1 = "こんなものを扱えるようになったのも、\nトレーニングの成果ですね。\nですが、現状に満足せず、\n引き続き努力します。トレーナー。"
