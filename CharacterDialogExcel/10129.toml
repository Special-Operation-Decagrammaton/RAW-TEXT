[translation]
10129-10-1 = "Blue... Ar... chive..."
10129-20-1 = "นะ... นี่เป็นส่วนหนึ่งของงานกลุ่มรักษาความสงบค่ะ\nฉันจะพยายามเพื่อความปลอดภัยของทรีนิตี้กับคุณครูค่ะ"
10129-30-1 = "ที่นี่เงียบสงบจังเลยนะคะ...\nเป็นเรื่องที่ดีจริงๆ ค่ะ"
10129-40-1 = "(คนคนนั้น...\nพยายามคุยกับฉันงั้นเหรอ?)"
10129-50-1 = "(หะ... หัวข้อสนทนา...\nเมื่อคืนก็เตรียมมา\nแล้วนี่นา...!)"
10129-60-1 = "(ฉันควรเปลี่ยนชุด\nแล้วค่อยมาใช่มั้ยคะ...?)"
10129-70-1 = "หาทางออก\nเรียบร้อยค่ะ"
10129-80-1 = "คุณครู เชิญค่ะ\nฉันกำลังรออยู่เลยค่ะ"
10129-90-1 = "ฉันพร้อมแล้วค่ะ\nขอบคุณที่เรียกหานะคะ"
10129-100-1 = "กำลังยุ่งอยู่แท้ๆ\nขอบคุณที่มาหานะคะ"
10129-110-1 = "ฉันออกไปทำงานของ\nกลุ่มรักษาความสงบได้ทุกเมื่อค่ะ"
10129-120-1 = "ปะ... เป็นยังไงบ้างคะ?"
10129-130-1 = "ชุดนี้...\nดูแปลกหรือเปล่าคะ?"
10129-140-1 = "ปะ... เปล่านะ ฉันไม่ได้ขอให้\nชมกันนะคะ!"
10129-150-1 = "สถานการณ์ของ\nกลุ่มรักษาความสงบ\nน่ะเหรอคะ?"
10129-160-1 = "โชคดีที่ทุกอย่างราบรื่นดีค่ะ"
10129-170-1 = "นะ... แน่นอนว่าชุดนี้\nไม่ใช่ยูนิฟอร์มของ\nกลุ่มรักษาความสงบหรอกค่ะ!"
10129-180-1 = "โบลต์ แคตช์!\nเทอร์ไมต์ ไวต์!"
10129-190-1 = "คะ... คุณครู?!\nมาอยู่ตั้งแต่เมื่อไรคะ?!"
10129-200-1 = "ฉันกำลังศึกษาคอนเทนต์\nสาวน้อยเวทมนตร์อยู่ค่ะ..."
10129-210-1 = "ที่บอกว่า 'พลังเพลิงที่เพียงพอ\nคือเวทมนตร์!'\nมันน่าสนใจดีค่ะ"
10129-220-1 = "ผนังนั้นในห้องทำงาน...\nเป็นผนังปลอมสินะคะ"
10129-230-1 = "มันดูน่าจะ\nยิงทะลุได้ง่ายเลยค่ะ"
10129-240-1 = "สุขสันต์วันเกิดค่ะ\nไปเดินเล่นด้วยกันมั้ยคะ?"
10129-250-1 = "ของขวัญวันเกิด ขอเป็น...\nบะ... บทพูดของสาวน้อยเวทมนตร์\nเหรอคะ?!"
10129-260-1 = "ตะ... แต่ว่าแบบนั้นมัน...!"
10129-270-1 = "อะ... เอ่อ..."
10129-280-1 = "เมจิคัล ลีริคัล...\nเทอร์ไมต์ ไวต์!"
10129-290-1 = "แบบนี้ใช้ได้มั้ยคะ...?"
10129-300-1 = "วันเกิดงั้นเหรอคะ?"
10129-310-1 = "อย่างนี้สินะคะ ถึงแล้วสินะ..."
10129-320-1 = "ฉันงานยุ่งจนลืมไปเลยค่ะ\nขอบคุณที่อวยพรให้นะคะ"
10129-330-1 = "ของขวัญที่ฉัน\nอยากได้น่ะเหรอคะ? อืม..."
10129-340-1 = "ไม่มีอะไรเป็นพิเศษค่ะ\nฉันได้มาเพียงพอ\nแล้วละค่ะ"
10129-350-1 = "ขึ้นปีใหม่แล้วค่ะ\nปีนี้ก็ขอฝากตัวด้วยนะคะ"
10129-360-1 = "คำอธิษฐานวันปีใหม่..."
10129-370-1 = "ฉันหวังว่าปีหน้า\nก็จะมาทักทาย\nได้แบบนี้อีกนะคะ"
10129-380-1 = "เป็นช่วงที่มีผู้คนออกมา\nตามท้องถนนเยอะเลยนะคะ\nฉันเข้าใจที่ตื่นเต้นกันค่ะ"
10129-390-1 = "ฉันดีใจที่รักษา\nความสงบสุขนั้นไว้ได้ค่ะ"
10129-400-1 = "ระหว่างมาที่นี่\nมีหลายคนให้ของว่างฉัน..."
10129-410-1 = "แล้วก็บอกฉันว่า\nอย่าแกล้งกันด้วยค่ะ..."
10129-420-1 = "คุณครู ฉันดูเป็นคน\nชอบแกล้งคนอื่นเหรอคะ?"
10129-440-1 = "คะ... คุณครู!!"
10129-450-1 = "มาทำอะไรที่นี่?!"
10129-460-1 = "ไม่สิ\nเข้ามาตั้งแต่เมื่อไรคะ!"
10129-470-1 = "ฉันมัวแต่ฟังเพลง\nก็เลยไม่ทันได้สังเกตเลยค่ะ..."
10129-480-1 = "แต่พอเป็นคุณครูที่มา\nก็โล่งอกไปทีนะคะ"
10129-490-1 = "อ๊ะ ชะ... ชุดนี้\nคือว่า...!"
10129-500-1 = "เป็นชุดที่ฉันเตรียมมา\nเพื่องานสืบสวนลับ\nของกลุ่มรักษาความสงบค่ะ..."
10129-510-1 = "มะ.. ไม่ใช่งานอดิเรก...!\nของฉันนะคะ! จริงๆ นะคะ!"
10129-520-1 = "ฉันแค่จะเช็กล่วงหน้า\nว่าไซซ์ถูกหรือเปล่า\nเท่านั้นเองค่ะ...!"
10129-530-1 = "(คะ... คุณครูบอกว่า\nน่ารักด้วยค่ะ...)"
10129-540-1 = "(ถ้าจู่ๆ จะชมกันแบบนี้...\nฟู่ว...!)"
10129-550-1 = "(ฉันยังไม่ชินกับ\nการถูกชมจริงๆ ด้วยค่ะ)"
10129-560-1 = "(ก็ดีใจอยู่หรอก...!\nแต่ก็...!)"
10129-570-1 = "ที่เห็นวันนี้\nให้เป็นความลับ\nกับคนอื่นนะคะ!"
10129-580-1 = "ก็นี่เป็นข้อมูลลับ...\nนี่คะ!"
10129-2600-1 = "คือว่า... ฉันคิดว่าของตกแต่งน่ารักๆ...\nมันจะเข้ากับฉันหรือเปล่าน่ะค่ะ"
