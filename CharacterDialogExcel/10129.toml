[translation]
10129-10-1 = "Blue A-Archive..."
10129-20-1 = "Th-This is also an extension of the Vigilante Crew's duties. I'll do my best for both your safety and Trinity's."
10129-30-1 = "It seems peaceful here... That's great."
10129-40-1 = "(Is that person trying to talk to me?)"
10129-50-1 = "(S-Small talk... I studied this last night, really!)"
10129-60-1 = "(M-Maybe I should've changed before coming here...)"
10129-70-1 = "I've located the exit."
10129-80-1 = "Sensei, welcome. I've been waiting for you."
10129-90-1 = "I've thoroughly prepared. Thank you for calling me."
10129-100-1 = "Thank you for visiting even when you're so busy."
10129-110-1 = "I'm always ready for Vigilante Crew missions."
10129-120-1 = "H-How is it?"
10129-130-1 = "My outfit... It doesn't look weird, right?"
10129-140-1 = "N-No. I wasn't fishing for compliments!"
10129-150-1 = "You're wondering how the Vigilante Crew has been lately?"
10129-160-1 = "Fortunately, pretty well."
10129-170-1 = "Of course, this isn't going to be the official Vigilante Crew uniform!"
10129-180-1 = "Bolt catch! Thermite White!"
10129-190-1 = "S-Sensei?! Since when were you there?!"
10129-200-1 = "I've been watching magical girl shows for research purposes..."
10129-210-1 = "And it's interesting to me when they say \"sufficient firepower is magic.\""
10129-220-1 = "That wall in the office... The partition wall."
10129-230-1 = "It would be good for stopping bullets."
10129-240-1 = "Happy birthday. Would you like to go on a walk together?"
10129-250-1 = "For your birthday present... You want to hear me say a magical girl phrase?!"
10129-260-1 = "B-But that's...!"
10129-270-1 = "U-Ugh..."
10129-280-1 = "Magical, lyrical...Thermite White!"
10129-290-1 = "...Was that good enough?"
10129-300-1 = "It's my birthday?"
10129-310-1 = "Oh. Already?"
10129-320-1 = "I forgot about it because I was so busy. Thank you."
10129-330-1 = "What do I want? Hm..."
10129-340-1 = "Nothing really. I already have everything I need."
10129-350-1 = "It's the new year. I look forward to working with you again."
10129-360-1 = "My new year's wish?"
10129-370-1 = "I hope that, next year, we'll get to exchange well wishes like this again."
10129-380-1 = "It's that time of the year when the streets get crowded. I can understand why they're excited."
10129-390-1 = "Being able to protect that peace makes me happy."
10129-400-1 = "Many people gave me treats on my way here..."
10129-410-1 = "But they also warned me not to pull any tricks."
10129-420-1 = "Sensei, do I pull a lot of tricks?"
10129-440-1 = "S-Sensei!"
10129-450-1 = "Wh-What brings you here?!"
10129-460-1 = "No, how long have you been there?!"
10129-470-1 = "I was so focused on my music that I didn't notice you at all..."
10129-480-1 = "But still, I'm glad it was you, Sensei."
10129-490-1 = "Ah, th-this outfit is, it's, um...!"
10129-500-1 = "It's an outfit I prepared for the Vigilante Crew's infiltration investigation..."
10129-510-1 = "I-It has nothing to do with my...preferences! Really!"
10129-520-1 = "I was just checking to see if it's the right size...!"
10129-530-1 = "(S-Sensei said it's cute...)"
10129-540-1 = "(If you suddenly compliment me, then... Uhh...!)"
10129-550-1 = "(I'm still not used to hearing compliments.)"
10129-560-1 = "(It makes me happy...! But...!)"
10129-570-1 = "What you saw today has to stay a secret!"
10129-580-1 = "This is...top secret!"
10129-2600-1 = "Um... This is really cute, but does it fit me?"
