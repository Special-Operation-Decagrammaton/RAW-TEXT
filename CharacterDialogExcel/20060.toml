[translation]
20060-10 = "블루~ 아카이브입니다!"
20060-20 = "이번에는 바다로!\n이부키와 출항이야, 선생님!"
20060-30 = "들어오기 전에\n모래도 털었고…\n물기도 닦았고…. "
20060-40 = "커피를 마시면,\n더 오래 놀 수\n있을까?"
20060-50 = "조금만 기다리면,\n선생님도 오겠지?"
20060-60 = "여기, 푸딩도\n팔고 있을까?"
20060-70 = "커피는 향긋한데,\n왜 맛은 씁쓸할까?"
20060-80 = "기다리고 있었어, 선생님!\n빨리 일 끝내고 바다로 가자!"
20060-90 = "있잖아 이부키, \n업무 준비 끝내 놨어!"
20060-100 = "칭찬해 줘!"
20060-110 = "선생님도 수영복 입어 봐!\n엄청 시원하고 편해!"
20060-120 = "이렇게 입고 의자에 앉으니까, \n의자가 엄청 차가워!"
20060-130 = "평소와 다른 복장이지만…"
20060-140 = "이부키, 당번 일은\n확실히 할 거야!"
20060-150 = "에어컨,\n시원하다아아아…."
20060-160 = "더 열심히 해서,\n선배들처럼 실력 있는\n학생이 될 거야!"
20060-170 = "생일 축하해, 선생님!"
20060-180 = "자, 이번에는 이부키가 선물! "
20060-190 = "이부키가 모은\n예쁜 조가비들이야!"
20060-200 = "오늘은…\n이부키의 생일!"
20060-210 = "선물은…\n나랑 많이 많이 놀아주는 거!!"
20060-220 = "새해 복 많이 받아, 선생님!"
20060-230 = "우리, 바다로 새해\n해돋이 보러 나가자,\n선생님!"
20060-240 = "양말을 여러 개 걸어두면…"
20060-250 = "선생님이랑 선배들한테 줄\n선물도 받을 수 있지 않을까?!"
20060-260 = "이 옷, 할로윈 때\n입어도 문제없겠지?"
20060-270 = "응? 조금만 더\n걸치는 게 어떻겠느냐고?"
20060-290 = "선생님! 이쪽이야!"
20060-300 = "이 숲, 엄~청 시원해!"
20060-310 = "아무리 해님이\n쨍쨍 내리쬐어도…"
20060-320 = "여기라면…\n봐봐, 나무들이\n전부 가려줘서~!"
20060-330 = "그러니까! 여기서는…."
20060-340 = "이제 파라솔 안 옮겨도\n괜찮아, 선생님!"
20060-350 = "…응, 사실은 있지.\n이부키, 전부 봤어."
20060-360 = "선생님이 영차영차 하고, \n파라솔 옮기는 거…."
20060-370 = "하지만 여기선 안 그래도 돼!"
20060-380 = "이부키랑 푹!\n쉬기만 하면 되는 거야!"
20060-2600 = "꼬~옥 껴안고, 정말로 소중하게 보관할게! \n감사합니다, 선생님!"
