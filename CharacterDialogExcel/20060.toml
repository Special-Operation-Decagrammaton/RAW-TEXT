[translation]
20060-10 = "蔚藍～檔案唷！"
20060-20 = "伊吹也要和大家去海邊！\n老師也一起出航～！"
20060-30 = "從海裡上來後，\n把沙子拍掉，\n再擦乾身體～"
20060-40 = "如果喝了咖啡，\n伊吹也能玩得更久嗎？"
20060-50 = "老師～\n還沒來嗎～\n耶嘿嘿……"
20060-60 = "這裡，有賣布丁嗎？"
20060-70 = "咖啡明明聞起來很香\n卻非常苦，為什麼呢～？"
20060-80 = "老師！快點快點！\n把工作做完，\n和伊吹一起去海邊吧～！"
20060-90 = "老師！工作的準備\n都完成了唷～！"
20060-100 = "是伊吹準備好的！\n耶嘿嘿，伊吹棒不棒？"
20060-110 = "老師也穿泳裝吧～！\n非常涼快，非常舒服唷！\n耶嘿嘿！"
20060-120 = "哇！椅子好冰～！\n真神奇！是因為\n穿著泳裝坐嗎？"
20060-130 = "伊吹，會努力做好\n值日生的工作！"
20060-140 = "穿泳裝感覺\n特別開心～！"
20060-150 = "好涼快～耶嘿嘿！"
20060-160 = "只要努力，伊吹也能\n像前輩們一樣帥氣嗎？"
20060-170 = "今天伊吹要\n送老師禮物～！"
20060-180 = "來！這是珍藏的貝殼唷！\n很可愛吧～？"
20060-190 = "耶嘿嘿，\n祝你生日快樂！\n老師！"
20060-200 = "今天呢，\n是伊吹的生日！"
20060-210 = "所以……\n想和老師一起\n玩個痛快～！"
20060-220 = "大大的太陽公公\n從海面升起來，\n真漂亮呢～"
20060-230 = "新年快樂！\n老師！耶嘿嘿！"
20060-240 = "我掛了好多襪子！"
20060-250 = "這樣就能從聖誕老人那裡，\n連老師和前輩們的份\n一起收到禮物了吧！"
20060-260 = "今天是萬聖節，\n就這樣出去玩也──"
20060-270 = "咦？最好再多穿一件？\n為什麼～？"
20060-290 = "老師！\n這邊這邊～！"
20060-300 = "這裡，超～涼快的！"
20060-310 = "不管太陽公公的\n光有多強──"
20060-320 = "只要在這裡……\n你看，一點都不熱唷～！"
20060-330 = "所以呢！\n在這裡的話──"
20060-340 = "就不用再搬陽傘了哦，老師。"
20060-350 = "……嗯。其實呢，\n伊吹都看到了。"
20060-360 = "老師嘿咻、嘿咻地\n搬著陽傘……"
20060-370 = "不過在這裡\n就沒問題了！"
20060-380 = "和伊吹一起，\n好好休息吧！"
20060-2600 = "伊吹，會一直一～直珍惜它的！\n一定會！謝謝你，老師！"
