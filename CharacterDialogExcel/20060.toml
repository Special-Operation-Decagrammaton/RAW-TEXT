[translation]
20060-10-1 = "Blue~ Archive ค่ะ!"
20060-20-1 = "คราวนี้ไปทะเล!\nออกเรือไปกับอิบูกินะ คุณครู!"
20060-30-1 = "ก่อนเข้ามา\nก็ปัดทราย...\nแล้วก็เช็ดน้ำแล้วด้วย..."
20060-40-1 = "ถ้าดื่มกาแฟ\nจะเล่นสนุกได้นานขึ้น\nหรือเปล่านะ?"
20060-50-1 = "ถ้ารออีกนิด\nคุณครูก็คงมาละเนอะ?"
20060-60-1 = "ที่นี่มีพุดดิ้งขาย\nด้วยหรือเปล่านะ?"
20060-70-1 = "กาแฟมีกลิ่นหอม\nแต่ทำไมรสชาติถึงขมกันนะ?"
20060-80-1 = "กำลังรออยู่เลย คุณครู!\nรีบทำงานให้เสร็จ\nแล้วไปทะเลกันเถอะ!"
20060-90-1 = "จะบอกให้นะ อิบูกิน่ะ\nเตรียมงานเรียบร้อยแล้ว!"
20060-100-1 = "ชมกันหน่อยสิ!"
20060-110-1 = "คุณครูก็ลองใส่ชุดว่ายน้ำดูสิ!\nทั้งเย็น ทั้งสบายตัวมากเลยนะ!"
20060-120-1 = "พอใส่ชุดว่ายน้ำแล้วนั่งเก้าอี้\nเก้าอี้ก็เย็นมากเลย!"
20060-130-1 = "ถึงจะอยู่ในชุดที่ต่างจากปกติ..."
20060-140-1 = "แต่อิบูกิจะทำงานเวร\nให้เรียบร้อยแน่นอน!"
20060-150-1 = "แอร์เย็น\nจังเลยยยย..."
20060-160-1 = "อิบูกิจะพยายามให้มากขึ้น\nแล้วเป็นนักเรียนที่มีฝีมือ\nเหมือนรุ่นพี่ให้ได้!"
20060-170-1 = "สุขสันต์วันเกิดค่ะ คุณครู!"
20060-180-1 = "เอาละ คราวนี้อิบูกิ\nเป็นคนให้ของขวัญ!"
20060-190-1 = "เป็นเปลือกหอยสวยๆ\nที่อิบูกิเก็บไว้น่ะ!"
20060-200-1 = "วันนี้คือ...\nวันเกิดของอิบูกิ!"
20060-210-1 = "ของขวัญก็คือ...\nเล่นกับอิบูกิเยอะๆ เลย!!"
20060-220-1 = "สวัสดีปีใหม่นะ คุณครู!"
20060-230-1 = "เราออกไปดูพระอาทิตย์\nขึ้นตอนปีใหม่ ที่ทะเล\nกันเถอะ คุณครู!"
20060-240-1 = "ถ้าแขวนถุงเท้าไว้หลายๆ คู่..."
20060-250-1 = "จะได้ของขวัญที่จะเอามาแบ่งให้\nคุณครูกับรุ่นพี่ด้วยหรือเปล่านะ?!"
20060-260-1 = "ใส่ชุดนี้ตอนฮาโลวีน\nก็คงไม่มีปัญหาหรอกเนอะ?"
20060-270-1 = "หืม? ควรหาอะไรมาคลุมตัว\nเพิ่มอีกหน่อยงั้นเหรอ?"
20060-290-1 = "คุณครู! ทางนี้!"
20060-300-1 = "ป่านี้เย็นมากๆ เลย~!"
20060-310-1 = "ต่อให้แดดส่องแรงแค่ไหน..."
20060-320-1 = "แต่ถ้าเป็นที่นี่ละก็...\nดูสิ พวกต้นไม้\nช่วยบังให้หมดเลย~!"
20060-330-1 = "เพราะงั้น! เมื่ออยู่ที่นี่..."
20060-340-1 = "ก็ไม่ต้องย้ายร่มชายหาด\nแล้วก็ได้ คุณครู!"
20060-350-1 = "อืม... จริงๆ แล้ว\nอิบูกิเห็นหมดเลย"
20060-360-1 = "ตอนที่คุณครูออกแรงฮึบๆ\nแล้วย้ายร่มชายหาดน่ะ..."
20060-370-1 = "แต่ที่นี่ไม่ต้องทำแบบนั้นแล้ว!"
20060-380-1 = "แค่พักผ่อนกับอิบูกิ\nให้เต็มที่ก็พอ!"
20060-2600-1 = "จะกอดแน่นๆ~\nแล้วเก็บไว้อย่างดีเลยละ!\nขอบคุณนะคะ คุณครู!"
