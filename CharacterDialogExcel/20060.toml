[translation]
20060-10 = "ブル～アーカイブ、だよ！"
20060-20 = "イブキもみんなと海行く！\n先生も一緒にしゅっこ～！"
20060-30 = "海から出たら、\n砂を落として、\n身体を拭いて～…。"
20060-40 = "コーヒーを飲んだら、\nイブキももっと\n長く遊べるかなぁ？"
20060-50 = "先生～\nまだかなあ～\nえへへ…。"
20060-60 = "ここ、プリン\n売ってるかなぁ？"
20060-70 = "コーヒーって、\nいい匂いがするのに\nすっごく苦いの、\nなんでだろ～？"
20060-80 = "先生！早く早く！\nお仕事終わらせて、\nイブキと一緒に海にいこ～！"
20060-90 = "先生！\nお仕事の準備\n終わったよー！"
20060-100 = "イブキがやっておいたの！\nえへへ、イブキ、偉い？"
20060-110 = "先生も水着、きよ～！\nすごく涼しくて、\nすごく楽なんだよ！えへへっ！"
20060-120 = "わっ！椅子つめたい～！\n不思議っ！\n水着で座ったからかなぁ？"
20060-130 = "イブキ、当番のお仕事頑張るね！"
20060-140 = "水着だとなんだか\n楽しいんだよ～！"
20060-150 = "すずしー…\nえへへっ！"
20060-160 = "頑張ったら\nイブキも先輩たちみたいに\nカッコよくなれるかな？"
20060-170 = "今日はイブキから、\n先生にプレゼントがありまーす！"
20060-180 = "はい！とっておきの\n貝殻だよ！かわいいでしょ～？"
20060-190 = "えへへっ、\nお誕生日おめでとう！\n先生！"
20060-200 = "今日はね、\nイブキのお誕生日なの！"
20060-210 = "だからね…\n先生といっぱい\n遊びたいなぁ～！"
20060-220 = "おっきなお日様が\n海から出てきて、\nきれいだったね～"
20060-230 = "あけましておめでとう！\n先生！えへへ！"
20060-240 = "いっぱい靴下かけたんだ！"
20060-250 = "これでサンタさんから、\n先生と先輩たちの分も\nプレゼントもらえるよね！"
20060-260 = "今日はハロウィンだから、\nこのままお外で遊んでも――"
20060-270 = "え？何か上に\n着た方がいいの？\nどうして～？"
20060-290 = "先生！\nこっちこっち～！"
20060-300 = "ここ、\nすっごく涼しいの！"
20060-310 = "どんなにお日様の\n光が強くても――"
20060-320 = "ここなら…ほら、\n全然暑くないんだよ～！"
20060-330 = "だからね！\nここなら――"
20060-340 = "もう、パラソル移動しなくても\nいいんだよ、先生。"
20060-350 = "…うん。ほんとはね、\nイブキ、見てたの。"
20060-360 = "先生がよいしょ、\nよいしょって、\nパラソル運んでるとこ…。"
20060-370 = "でもここなら\n大丈夫だよ！"
20060-380 = "イブキと一緒に、\nゆっくり休もうね！"
20060-2600 = "イブキ、これずっとずーっと大事にするね！\n絶対！ありがとう、先生！"
