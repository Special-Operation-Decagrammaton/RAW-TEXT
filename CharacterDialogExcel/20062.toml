[translation]
20062-10 = "ブルー……ん～……あっ！アーカイブ！"
20062-20 = "どもども～！183号特別クラス、二木エリナで～す。\nえー、本日はお日柄もよく――……\nあれ、なんて言うんだっけ？"
20062-30 = "わ～！\n風が入ってこなくて\n最高！"
20062-40 = "服かわいい～！\nそれどこで\n買ったんですか！？"
20062-50 = "あぁ……\nレッドウィンターの\n繫華街より\n良いかも……。"
20062-60 = "あったかーい……\n風邪引かなくて\nすみそうです！"
20062-70 = "あの人、化学者の\n素質があるかも！？"
20062-80 = "ぐぅ……\nむにゃむにゃ……。"
20062-90 = "ハッ！？\nね、寝てないです！"
20062-100 = "温かいからつい\n瞑想していたら……\nその……。"
20062-110 = "どーも、先生～！\n風邪には気をつけてくださいね！"
20062-120 = "先生って、レスリング好きです？\nなんか才能ありそうですよね～"
20062-130 = "一緒に動画見てたら\n興味湧いたりして！？"
20062-140 = "うわ……\nすっごい仕事の量……\n大丈夫です？"
20062-150 = "連邦生徒会の懲戒って\nすごいんですね。\nまさかこんなになんて……。"
20062-160 = "そ、そこに居てください！\nうっ……ううぅっ……！"
20062-170 = "ぶえっくしょぉおおんっっ！！！"
20062-180 = "ほえ……うわあっ！！？\nす、すぐハンカチ\n持ってきますから！！"
20062-190 = "勉強って何でこんなに\nやりたくないんでしょ。\nもっと面白かったら良いのに。"
20062-200 = "踊りながらしたら……\nもしかして面白かったり？"
20062-210 = "なんでレスリングのマスクを\n被らないのか、って……？\nし、しーっ！！！"
20062-220 = "それ、被らない派に言っちゃ\nダメなやつですから！？"
20062-230 = "相手が私で\nよかったですよほんと！？"
20062-240 = "お誕生日おめでとう\nございます、先生！"
20062-250 = "誕生日で思い出したんですけど、\n化学の力で誕生日を当てる\n方法があるんです。"
20062-260 = "特定の物質が\nRNAの弱化で濃度が\n変わるらしいんですけど……"
20062-270 = "一度試してみて、\nいいですか？"
20062-280 = "ご、ゴホンゴホン！\nカフェで誕生日ケーキ！\nゴホンゴホン！"
20062-290 = "せ、先生も風邪には\n気をつけてください～\nはあ、まさか「誕生日」に\n風邪を引いちゃうなんて……"
20062-300 = "ごっ、ゴホンゴホン！！"
20062-310 = "あけまして\nおめでとうございます！"
20062-320 = "今年は新しい服や美味しいものが\nたくさんもらえますよ～に！\nえへへっ！"
20062-330 = "サンタ、ですか？\nトナカイが引くソリで\n世界中を周るなんて\nありえないと思いますよ！"
20062-340 = "同志ジェド・マロースなら\n分かります。\n馬は速いですし！"
20062-350 = "「家を訪ね、お菓子を\n貰えなければイタズラする」\n……。"
20062-360 = "それなら、183号は\n毎日がハロウィンですね。\n熊が来ますし……。"
20062-380 = "へへっ、綺麗ですよね？\nゲホゲホ。"
20062-390 = "雪の結晶を\nポリビニルアセタールで\n固めたものです。"
20062-400 = "時間が経ったとしても、\n温かい場所でも溶けません。"
20062-410 = "せっかくなので一番大きくて\n綺麗なものを探そうとしたら……\nこんな時間になってしまって。"
20062-420 = "ズビズビ……\nせっかくなので、\n永久に光る\n雪結晶にしてみました。"
20062-430 = "どうでしょう？\nこれを見るたびに、\n私のことを\n思い出してくれますか？"
20062-440 = "ふふっ！やったぁ！\n喜んでもらえてよかったです。"
20062-450 = "すごいですよね……\nこれも、あれも、\nぜーんぶ化学なんです。"
20062-460 = "先生と、私も……\n化学で説明できるわけです。"
20062-470 = "見えているものも、情報処理も、\n電気信号でしかありません。\nなのに反応しあうんです。"
20062-480 = "どれもただの\n電気信号でしかないのに、\n感情なんて名前が\n付いてしまいました。"
20062-490 = "いえ、それが\n嫌というわけではなく……。"
20062-500 = "こんな風に反応が起こるなら、\n同じがいいな、と思って。"
20062-510 = "なーんて！ゲホゲホ！\n私、風邪でおかしく\nなっちゃったのかもしれません！"
20062-520 = "あははっ……！\nははっ……。"
20062-2600 = "これで熊相手でも\nバッチリです！\nもちろん弁論も！"
