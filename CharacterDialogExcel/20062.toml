[translation]
20062-10 = "블루…… 음~ ……아! 아카이브!"
20062-20 = "안녕안녕~! 183호 특별반, 니키 에리나에요~.\n어- 오늘은 날도 좋고-\n……어라, 뭐라고 하더라?"
20062-30 = "와~! 외풍이\n안들어오잖아! 최고!"
20062-40 = "옷 예쁘다!\n그거 어디서 샀어요?!"
20062-50 = "아아……\n붉은겨울 번화가보다\n더 좋을지도……."
20062-60 = "따듯해……\n감기 걱정은\n없겠네요!"
20062-70 = "저 분, 화학자에\n소질이 있을지도?!"
20062-80 = "쿠울……\n웅냐음냐…….."
20062-90 = "핫?!\n아, 안잤어요!"
20062-100 = "따듯해서 명상 하다보니……\n그게……."
20062-110 = "안녀엉, 선생님~!\n감기 조심하세요!"
20062-120 = "선생님은 레슬링 좋아하세요?\n왠지 소질 있어보이는데~"
20062-130 = "같이 영상 보다보면\n흥미가 생길지도?!"
20062-140 = "우와……\n일 엄청 많네요……\n괜찮아요?"
20062-150 = "총학생회의 징계는 엄청나네요.\n이 정도일 줄이야……."
20062-160 = "다, 다가오시면 안돼요.\n에엣, 에-에엣-"
20062-170 = "푸핫촤하아앗-!!!"
20062-180 = "후엑……. 으, 으앗?!!\n손수건 가져다 드릴게요!!"
20062-190 = "공부는 왜 이렇게\n하기 싫은걸까요?\n좀 재밌으면 좋을텐데."
20062-200 = "춤추면서 하면…….\n좀 재밌으려나…….?"
20062-210 = "레슬링 마스크는\n왜 안쓰냐고요……?\n쉬, 쉬이잇!!!"
20062-220 = "그거, 쓰지 않는 사람한테\n함부로 말하면 절대 안돼요?!"
20062-230 = "제가 들어서 망정이지, 진짜!"
20062-240 = "생일 축하드려요 선생님!"
20062-250 = "생일하니까 떠오르는데,\n화학으로 생일을 맞추는\n방법이 있어요."
20062-260 = "특정 물질이 RNA 약화로\n농도가 바뀐다고 하는데……"
20062-270 = "한 번 해봐도 될까요?"
20062-280 = "코, 콜록콜록!\n카페 생일 케이크!\n콜록콜록!"
20062-290 = "서, 선생님도 감기조심하세요~\n나 참, 제 '생일'에\n감기에 걸리다니……."
20062-300 = "정말이지 콜, 콜록!!"
20062-310 = "새해 복 많이 받아요!"
20062-320 = "올 해는 새 옷도, 맛있는 것도\n많이 받을 수 있기를!\n에헤헷!"
20062-330 = "산타, 말이에요?\n순록이 끄는 썰매로\n전세계를 돈다니,\n말도 안돼요!"
20062-340 = "데드 모로스 동지라면\n말이 되죠,\n말은 빠르잖아요!"
20062-350 = "'문앞에 찾아와서 달콤한걸\n먹지못하면 장난을 친다.'……."
20062-360 = "그러면, 183호는\n매일이 할로윈이네요.\n곰이 찾아오니까…….."
20062-380 = "히힛, 예쁘죠? \n콜록콜록."
20062-390 = "눈송이를\n폴리비닐아세탈수지용액으로\n보존한 거예요."
20062-400 = "시간이 지나도, \n따듯한 곳에서도\n영원히 녹지 않아요."
20062-410 = "제일 크고 예쁜 눈송이를\n고르다 보니……\n시간 가는 줄 몰랐어요."
20062-420 = "훌-쩍……\n기왕 만드는 거,\n영구 야광 눈송이로\n만들어봤어요."
20062-430 = "어때요? 이걸 볼 때마다,\n저를 떠올려 주시겠어요?"
20062-440 = "후훗! 아싸아!\n좋아해주셔서 다행이에요."
20062-450 = "대단하죠……\n이것도, 저것도,\n모든 게 다 화학이에요."
20062-460 = "선생님도, 저도……\n화학으로 설명할 수 있어요."
20062-470 = "보이는 것도, 정보의 처리도,\n전기신호일 뿐이에요.\n그런데도 서로 반응하는거에요."
20062-480 = "다 그저 전기신호, 반응인데,\n감정이란 이름을 붙여버렸어요."
20062-490 = "아뇨, 그게 싫다는건\n아니에요. 그냥……"
20062-500 = "일어나는 반응이,\n서로 같으면 좋겠다,\n라고 생각해서요."
20062-510 = "콜록, 내가 뭐래!\n저, 감기 걸려서\n제정신이 아니네요!"
20062-520 = "아하하……!\n하하……."
20062-2600 = "이거면 곰도 논쟁도\n완벽하게 준비 완료!"
