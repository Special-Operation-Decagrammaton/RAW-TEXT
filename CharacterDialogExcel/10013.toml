[translation]
10013-20-1 = "きひひひひひひいっ～～\nきゃははははは！"
10013-30-1 = "あ…。うあああ…。\nどうしよう、どうしよう。"
10013-40-1 = "話かけないで\nください…。"
10013-50-1 = "私は端っこに\nいます…。"
10013-60-1 = "こ、こんにちは…。"
10013-70-1 = "う、うあああ…。"
10013-80-1 = "こ…こんにちは。先生。\n私がここで見張ってました。"
10013-90-1 = "ツルギ、待機中！\nよ、よろしくお願いします！！"
10013-100-1 = "きょ、今日も\n良い一日ですねええっ！！"
10013-110-1 = "…ち、違う！これじゃない！\n何をしゃべればいいの！"
10013-120-1 = "きひひ。いひひひひっ～"
10013-130-1 = "…あ、あれ？\nみ、見てたんですか？\nはぅわわわわわ！？！？"
10013-140-1 = "あ…。\nな…。\nなんでも話してください。"
10013-150-1 = "わ、私は\nお、大人の仕事とか\nよく分からないので…！"
10013-160-1 = "で、でも！\nぜひやらせてください！"
10013-170-1 = "（家に帰りたい…。\n一緒にいて嬉しいけど\n何を話せばいいのか…）"
10013-180-1 = "た、誕生日？！\nわ、私は\n何をすればいいですか？"
10013-190-1 = "何をしなきゃいけないですか？"
10013-200-1 = "た、誕生日？\n私の誕生日ですか？"
10013-210-1 = "はい？\nで、で、で、デートですか？"
10013-220-1 = "デート？"
10013-230-1 = "こ、今年も\nよろしくお願いします～！"
10013-240-1 = "クリスマス…。\n大人のデート…。"
10013-250-1 = "うああああ！\nな、なんでもありません！！"
10013-260-1 = "ハロウィン…。\nフェスティバル…。\nパーティー…。"
10013-270-1 = "はい？\nべ、べつに何も！"
10013-290-1 = "（逃げる？\n今すぐにでも窓から\n飛び降りる？）"
10013-300-1 = "（死ぬかな？死ぬよな？\n死にたい…。殺す？\nいや、違う違う！）"
10013-310-1 = "な、な、な、な、なにを、\nは…話そうと…。"
10013-320-1 = "こ、こんなところは…。\n私には似合わないのに…。"
10013-330-1 = "あ、うう…。\nまだ私は準備が…。"
10013-340-1 = "（ぎゃあああああ～～！\nなんでこんなところに\n来ちゃったのおー！！）"
10013-2600-1 = "ふふふふふー\nうふふふふふふふふふー\nくははははははははははははっ～！！"
