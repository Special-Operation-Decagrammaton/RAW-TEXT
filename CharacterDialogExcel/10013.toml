[translation]
10013-20-1 = "หึหึหึหึหึหึ...\nวะฮ่าฮ่าฮ่าฮ่าฮ่าๆๆ!"
10013-30-1 = "อ่า... อ่าาาา...\nทำยังไงดี ทำยังไงดี..."
10013-40-1 = "อย่ามาคุยกับฉันเลยค่ะ..."
10013-50-1 = "ฉันขอไปอยู่\nตรงมุมนั้นดีกว่าค่ะ"
10013-60-1 = "สะ...สวัสดีค่ะ"
10013-70-1 = "อ๊าาาาา!"
10013-80-1 = "สวัสดีค่ะ คุณครู\nฉันคอยเฝ้าดูตรงนี้อยู่นะคะ"
10013-90-1 = "ซึรุกิ! สแตนด์บาย!\nฝะ... ฝากตัวด้วยนะคะ!!"
10013-100-1 = "ขะ... ขอให้เป็นวันที่ดีนะคะ!"
10013-110-1 = "ไม่สิ! ต้องไม่ใช่แบบนี้!\nงั้นพูดอะไรดีล่ะ!?"
10013-120-1 = "คิคิคิ... ฮี่ฮี่ฮี่"
10013-130-1 = "เอ๋? คะ... คุณครูดูอยู่เหรอคะ?"
10013-140-1 = "เอ่อ... ตะ... ต้องการอะไรเหรอคะ?"
10013-150-1 = "ฉะ... ฉันไม่ค่อยรู้เรื่อง...\nงานของผู้ใหญ่หรอกค่ะ"
10013-160-1 = "ออกคำสั่งมาเถอะค่ะ!"
10013-170-1 = "(อยากกลับบ้านจัง...\nถึงจะรู้สึกดีที่ได้อยู่ด้วยกัน\nแต่ก็ไม่รู้ว่าจะพูดอะไรดี...)"
10013-180-1 = "วันเกิดเหรอคะ?!\nฉะ... ฉันต้องทำอะไรเหรอคะ?"
10013-190-1 = "จะให้ทำอะไรเหรอคะ?"
10013-200-1 = "วะ... วันเกิด?\nวันนี้วันเกิดของฉันเหรอคะ?"
10013-210-1 = "คะ? ดะ... ดะ... เดตเหรอคะ?"
10013-220-1 = "เดตเหรอ?"
10013-230-1 = "ปะ... ปีนี้ก็ขอฝากตัวด้วยนะคะ!"
10013-240-1 = "วันคริสต์มาส...\nวันแห่งการเดตกันแบบผู้ใหญ่..."
10013-250-1 = "อ๊ะ! มะ...ไม่มีอะไรหรอกค่ะ!"
10013-260-1 = "ฮาโลวีน... เทศกาล... ปาร์ตี้..."
10013-270-1 = "คะ? มะ... ไม่มีอะไรค่ะ!"
10013-290-1 = "(หนีกลับเลยดีมั้ย?\nหรือว่ากระโดดออกทางหน้าต่างดี?)"
10013-300-1 = "(จะตายรึเปล่านะ? อาจจะตายก็ได้นะ\nอยากตายจัง... ตายเลยดีมั้ย?\nไม่สิ... ไม่ใช่แบบนั้นสิ...)"
10013-310-1 = "มะ... มะ... มะ.. มี... มีอะไร...\nจะ...จะพูดเหรอคะ...?"
10013-320-1 = "ทะ... ที่แบบนี้มัน...\nไม่เหมาะกับฉันสักเท่าไรเลย..."
10013-330-1 = "เอ่อ... อืม...\nฉันยังไม่ได้เตรียมใจเลย..."
10013-340-1 = "(กรี๊ดดดดด!\nทำไมฉันถึงได้มาอยู่ในที่แบบนี้เนี่ย!!)"
10013-2600-1 = "หึหึหึหึ...\nฮุฮุฮุฮุฮุฮุ...\nวะฮ่ะฮ่ะฮ่าฮ่าฮ่าฮ่า...!!"
