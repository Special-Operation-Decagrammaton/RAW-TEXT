[translation]
26002-20-1 = "I'm Juri from Gehenna's School Lunch Club. Let me know if you're hungry."
26002-30-1 = "Mmm... What a sweet scent."
26002-40-1 = "Do you think this is edible?"
26002-50-1 = "Maybe I should try frying it to see what happens."
26002-60-1 = "Oh, wow. This place is nice."
26002-70-1 = "I think I can cook something really tasty here."
26002-80-1 = "Welcome, Sensei. Aren't you feeling hungry?"
26002-90-1 = "Welcome, Sensei. Would you like to eat before we begin?"
26002-100-1 = "What about...just a snack?"
26002-110-1 = "Ugh..."
26002-120-1 = "Why does everything I cook end in failure?"
26002-130-1 = "If the ingredients are still moving, that means it's fresh, right?"
26002-140-1 = "Do you smell something burning...?"
26002-150-1 = "Oh, silly me! I forgot about the pie in the oven!"
26002-160-1 = "Which do you think will add more flavor? Sulfuric or hydrochloric acid?"
26002-170-1 = "Happy birthday, Sensei!"
26002-180-1 = "I baked a cake for you..."
26002-190-1 = "...but it, uh, ran away. Yeah..."
26002-200-1 = "You want to get me something for my birthday?"
26002-210-1 = "Heehee. Hearing you say that is all I could ever want."
26002-220-1 = "I made osechi to celebrate New Year's."
26002-230-1 = "Would you mind giving it a taste?"
26002-240-1 = "Um, so I roasted a turkey for Christmas..."
26002-250-1 = "It shouldn't still be moving...right?"
26002-260-1 = "I'm surprised at how popular my usual snacks are for Halloween."
26002-270-1 = "Apparently, they make for good for pranks."
26002-290-1 = "Ah. Look, Sensei."
26002-300-1 = "That ripe tomato looks so delicious, doesn't it?"
26002-310-1 = "Heehee. This is all the result of everyone's hard work at the School Lunch Club."
26002-320-1 = "Growing this garden was really worth it!"
26002-330-1 = "Oh, the tomatoes over there look really good too..."
26002-340-1 = "Um, uh, it's over there, b-but..."
26002-350-1 = "Aren't we really close right now...?"
26002-360-1 = "(Ah! Sensei's so close I can smell them...)"
26002-370-1 = "(M-My heart is beating faster for some strange reason...! )"
26002-380-1 = "I-I'm okay! P-Please don't worry...!"
26002-390-1 = "But, it's just that, you see... Um..."
26002-400-1 = "My face feels so hot... Eek...!"
26002-2600-1 = "Heehee, if you use this gun for cooking, the meat becomes significantly more tender!"
