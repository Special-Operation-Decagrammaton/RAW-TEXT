[translation]
26002-20-1 = "ゲヘナ学園、給食部のジュリといいます。\nお腹が空いたら、いつでも私に言ってくださいね？"
26002-30-1 = "う～ん、甘い香り…。"
26002-40-1 = "これも食べられますかね？"
26002-50-1 = "とりあえず一回、\n揚げてみようかな…。"
26002-60-1 = "あら。\nとても良いところですね。"
26002-70-1 = "ここなら\n美味しいお料理が\n作れそうです。"
26002-80-1 = "おかえりなさい、先生。\nお腹空いてないですか？"
26002-90-1 = "おかえりなさい、先生。\nご飯にしますか？"
26002-100-1 = "それとも…お・や・つ？"
26002-110-1 = "うう…。"
26002-120-1 = "なんで私は料理をするたびに、\n失敗ばかりするのでしょう…。"
26002-130-1 = "食材が生きていると\nいうのはそれだけ新鮮と\nいうことですから\n良いことですよね？"
26002-140-1 = "なんか、焦げ臭いです…？"
26002-150-1 = "…あら、私ったら！\nパイをオーブンに入れっぱなし\nだったことを忘れてました！"
26002-160-1 = "料理に酸味を出すためには、\n香辛料を入れるのと、\n塩酸を入れるのと、\nどちらがいいのでしょうか…？"
26002-170-1 = "お誕生日おめでとう\nございます、先生！"
26002-180-1 = "先生に差し上げようと\nケーキを焼いたのですが、"
26002-190-1 = "それがその…。\n逃げちゃいました…。"
26002-200-1 = "私の誕生日\nプレゼントですか？"
26002-210-1 = "ふふ…。\nその言葉だけでも\n十分嬉しいですよ。"
26002-220-1 = "お正月を迎えたので\nおせち料理を作ってみました。"
26002-230-1 = "よろしければ味見して\nいただいてもいいでしょうか？"
26002-240-1 = "えー、その、\nクリスマスだから七面鳥を\n焼いたのですけれど…"
26002-250-1 = "生きてて動く\nローストターキーは\nだめですよね…？"
26002-260-1 = "ハロウィーンになると\nなぜか私の作った\nお菓子が人気なんです。"
26002-270-1 = "いたずらにぴったり…？だとか。"
26002-290-1 = "あっ、見てください先生！"
26002-300-1 = "この真っ赤に実ったトマト、\nすっごく美味しそうだと\n思いませんか？"
26002-310-1 = "えへん、これも\n給食部としての成果です。"
26002-320-1 = "丹精込めて作った\n甲斐がありました！"
26002-330-1 = "あ、あっちのトマトも\nすごく良い感じに……"
26002-340-1 = "えっと、あ、あれ、\nなのですが、その……\n何だかちょっと距離が……？"
26002-350-1 = "この近さですと、\nあの、私……。"
26002-360-1 = "（あ、先生の香りが……）"
26002-370-1 = "（な、何だか急に、胸がド\nキドキしてきました……！？）"
26002-380-1 = "だっ、大丈夫です、はい！\nご心配なく……！"
26002-390-1 = "ただその何と言いますか、\nえっと……。"
26002-400-1 = "何だか顔が熱くなってきて、\nその……！うぅ……！"
26002-2600-1 = "ふふ、この銃をお料理に使うと、\nお肉の食感がぐんと柔らかくなりますね！"
