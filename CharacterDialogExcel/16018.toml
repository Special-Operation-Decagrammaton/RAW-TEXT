[translation]
16018-10-1 = "蔚藍檔案！"
16018-20-1 = "我是嘩啦嘩啦頭盔團的隊長，\n河駒風良舞。等等，老師！！\n太近了啦！離遠一點！！"
16018-30-1 = "有可以掛頭盔\n的地方嗎？"
16018-40-1 = "總覺得……\n好像在哪裡\n見過……？"
16018-50-1 = "（可以上前\n搭話嗎……？）"
16018-60-1 = "這裡，還挺不錯的嘛。\n又可以遮雨。"
16018-70-1 = "要是有把頭盔團的\n大家一起帶來\n就好了……"
16018-80-1 = "哎呀，老師。\n呀齁～"
16018-90-1 = "今天要做什麼呢？\n打棒球？"
16018-100-1 = "歡迎，老師。"
16018-110-1 = "有沒有什麼\n有趣的話題呀？"
16018-120-1 = "對頭盔有興趣嗎？"
16018-130-1 = "老師的話，感覺\n一定很適合的哦？"
16018-140-1 = "頭盔除了帥氣之外，\n還很實用哦？"
16018-150-1 = "能保護頭部又很好看。\n棒極了對吧？"
16018-160-1 = "（……來夏萊的人，\n　幾乎都沒戴頭盔呢）"
16018-170-1 = "（連我看了都開始\n　坐立難安了……\n　總覺得靜不下來！）"
16018-180-1 = "老師你……\n原來那麼忙碌嗎？"
16018-190-1 = "因為總是在各個地方\n跑來跑去的，\n還以為是個閒人呢。"
16018-200-1 = "哼哼，哼哼，\n嗯哼哼～哼……"
16018-210-1 = "嗯哼～頭盔讚啦！！"
16018-220-1 = "哎呀，今天不是\n老師的生日嗎？"
16018-230-1 = "祝你生日快樂！\n要吃很多\n好吃的東西哦！"
16018-240-1 = "總覺得……從昨天\n開始，我家的孩子們\n就一直在竊竊私語。"
16018-250-1 = "說是有正經事要談\n所以要我過去……\n到底打算做什麼呢。"
16018-260-1 = "新的一年到了呢！\n希望今年大家也能\n健健康康賺大錢！"
16018-270-1 = "Merry Christmas，老師！"
16018-280-1 = "嗯，雖然壞孩子不會被\n聖誕老人找上門……"
16018-290-1 = "至少能在心情上\n享受一下吧？"
16018-300-1 = "哈啊，哈啊……"
16018-310-1 = "累，累死我了……"
16018-320-1 = "一邊說不給糖果\n就要惡作劇一邊\n跑過來，那些傢伙……"
16018-330-1 = "但是我又沒有\n帶著糖果……"
16018-340-1 = "結果他們就一直搗蛋！\n真是的！！"
16018-360-1 = "一、二、三、\n四、五、六。\n很好！"
16018-370-1 = "六隻全都到齊了呢！"
16018-380-1 = "要乖乖聽媽媽的話哦，你們。"
16018-390-1 = "母鴨看起來也沒問題了呢。"
16018-400-1 = "這樣就圓滿落幕了！"
16018-410-1 = "你，你你你……\n你在說什麼啊！！"
16018-420-1 = "老師，那句話不會有點失禮嗎？"
16018-430-1 = "咦？\n……啊！？\n那個……"
16018-440-1 = "啊，啊啊！\n原，原來是那個意思啊！？"
16018-450-1 = "當，當然！我可是隊長呢！\n這種程度做不到怎麼行呢！"
16018-460-1 = "（老師也真是的，\n　真的只是說錯話嗎？\n　還是是故意的……？）"
16018-470-1 = "（不管哪種都讓人火大！\n　如果是故意的就更氣了！！）"
16018-480-1 = "（該不會，真的是故意……\n　那麼說的吧……？）"
16018-2600-1 = "哎呀！這個我一直想要呢！\n謝謝啦，老師♪"
