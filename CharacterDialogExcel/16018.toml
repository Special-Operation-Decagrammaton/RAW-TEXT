[translation]
16018-10-1 = "Blue Archive!"
16018-20-1 = "ฉันโคะมาคาเสะ ราบุ หัวหน้าแก๊งหมวกกันน็อกป๋อมแป๋ม\nดะ... เดี๋ยวสิ ครู!! ใกล้ไปแล้ว อย่าวิ่งเข้ามาสิ!!"
16018-30-1 = "มีที่แขวนหมวก...\nบ้างมั้ยนะ?"
16018-40-1 = "เหมือนเคยเห็นบ่อยๆ\nจากที่ไหนเลย..."
16018-50-1 = "(ชวนคุย...ได้มั้ยนะ?)"
16018-60-1 = "ที่นี่ถือว่าใช้ได้เลยนะ\nน้ำฝนไม่หยดด้วย"
16018-70-1 = "อยากพาเด็กๆ ในแก๊ง\nมาด้วยจัง..."
16018-80-1 = "นี่ ครู ยะฮู้ว!"
16018-90-1 = "วันนี้ทำอะไรกันดี?\nเล่นเบสบอลมั้ย?"
16018-100-1 = "เข้ามาสิ ครู"
16018-110-1 = "ไม่มีเรื่องสนุกๆ\nจะเล่าบ้างเหรอ?"
16018-120-1 = "ครูไม่อยากลองใส่\nหมวกกันน็อกบ้างเหรอ?"
16018-130-1 = "มันน่าจะเหมาะ\nกับครูเลยนะ!"
16018-140-1 = "ก็หมวกกันน็อกมันเท่\nแล้วก็ใช้งานได้จริงนี่นา?"
16018-150-1 = "ทั้งช่วยปกป้องหัว\nภายนอกก็ดูสวยด้วย สุดยอดไปเลยว่ามั้ย?"
16018-160-1 = "(คนที่มาชาเล่ต์ส่วนใหญ่\nไม่ใส่หมวกกันน็อกกันแฮะ)"
16018-170-1 = "(ฉันก็พลอยว้าวุ่นใจ\nและโล่งหัวไปด้วยเลย!)"
16018-180-1 = "ครู มีงานอะไรเยอะขนาดนั้นน่ะ?"
16018-190-1 = "เห็นชอบวิ่งไปนู่นมานี่ทุกวัน\nก็นึกว่าไม่ค่อยมีงานเสียอีก"
16018-200-1 = "ฮืม ฮืมม\nฮื้มมม ฮืม"
16018-210-1 = "ฮื้มมม\nหมวกกันน็อก เท่ระเบิด"
16018-220-1 = "เอ๋ วันนี้\nวันเกิดครูไม่ใช่เหรอ?"
16018-230-1 = "สุขสันต์วันเกิดนะ!\nกินของอร่อยๆ\nเยอะๆ เลยนะ!"
16018-240-1 = "ตั้งแต่เมื่อวานละ เด็กๆ ในแก๊ง\nเหมือนจะซ่อนอะไรฉันอยู่เลย"
16018-250-1 = "ไหนบอกว่าให้มาเพราะมี\nเรื่องสำคัญจะพูดไง มีอะไรเหรอ?"
16018-260-1 = "ขึ้นปีใหม่แล้วสินะ\nมาแข็งแรงและหาเงินให้ได้เยอะๆ กันเถอะ!"
16018-270-1 = "เมอร์รีคริสต์มาสนะ ครู!"
16018-280-1 = "ถึงซานต้าจะไม่มาหา\nเด็กไม่ดี..."
16018-290-1 = "แต่สนุกไว้ก่อนก็ได้นี่เนอะ!"
16018-300-1 = "แฮ่ก... แฮ่ก..."
16018-310-1 = "เหนื่อยจัง..."
16018-320-1 = "ไหนบอกว่าทริกออร์ทรีต\nแล้วให้มาหาไง..."
16018-330-1 = "แต่มาแล้วไม่ได้ขนม"
16018-340-1 = "แล้วก็โดนแกล้งอย่างเดียวเลย!\nชิ!"
16018-360-1 = "หนึ่ง สอง สาม สี่\nห้า หก ดีละ!"
16018-370-1 = "หาเจอครบ\nหกตัวแล้ว!"
16018-380-1 = "ต้องเชื่อฟังแม่กันสิ\nเข้าใจมั้ย?"
16018-390-1 = "แม่เป็ดก็\nเหมือนจะไม่เป็นไรแล้ว"
16018-400-1 = "งั้นก็ถือว่าคลี่คลาย\nเรื่องนี้ได้แล้วเนอะ!"
16018-410-1 = "อะไรๆๆๆ\nพูดอะไรเนี่ย!!!"
16018-420-1 = "ครู\nแบบนั้นมันเสียมารยาทนะ?"
16018-430-1 = "หืม? อ๊ะ...!?\nคะ...คือว่า..."
16018-440-1 = "อ่า อ๊ะ!\nหมายความอย่างนั้นละ!"
16018-450-1 = "คนเป็นหัวหน้า\nก็ต้องมีมุมที่\nใจกว้างแบบนั้นละ!"
16018-460-1 = "(ครูนี่ละก็ พลั้งปากไป\nหรือว่าตั้งใจกันแน่...?)"
16018-470-1 = "(ไม่ว่าจะแบบไหนก็น่าโมโห!\nถ้าจงใจจะยิ่งโมโหกว่าเดิมอีก!)"
16018-480-1 = "(คงไม่ได้ตั้งใจ\nจริงๆ... หรอกเนอะ...?)"
16018-2600-1 = "โอ้ นี่ละ แบบนี้ละ\nขอบคุณนะ ครู!"
