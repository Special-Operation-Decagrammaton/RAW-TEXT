[translation]
16018-10-1 = "Blue Archive!"
16018-20-1 = "I'm Komakaze Rabu, captain of the Splash Helmet Gang. H-Hold on, Sensei!! Personal space! Don't run at me like that!"
16018-30-1 = "Is there no...hat hanger?"
16018-40-1 = "That face looks really familiar..."
16018-50-1 = "(Should I...talk to them?)"
16018-60-1 = "This place isn't half bad. The roof doesn't even leak."
16018-70-1 = "The kids would've really liked to come visit..."
16018-80-1 = "Oh, Sensei. Yahoo."
16018-90-1 = "What should we do today? Play baseball?"
16018-100-1 = "Hey, Sensei."
16018-110-1 = "Got any cool stories?"
16018-120-1 = "Sensei, you ever think about wearing a helmet?"
16018-130-1 = "You'd look good in one!"
16018-140-1 = "Helmets are cool and practical, you know?"
16018-150-1 = "It protects your skull, AND it looks cool. Isn't that the best?"
16018-160-1 = "(Looks like most people here at Schale don't wear helmets...)"
16018-170-1 = "(I feel so anxious all of a sudden!)"
16018-180-1 = "Sensei, why do you have so much work?"
16018-190-1 = "You always come running, anytime, anywhere, so I thought you didn't do much."
16018-200-1 = "Hmm, mmm, mhmm..."
16018-210-1 = "Mhm! Helmets are the best!"
16018-220-1 = "Huh, isn't today your birthday, Sensei?"
16018-230-1 = "Happy birthday! You should eat lots of yummy food!"
16018-240-1 = "You know, it feels like the gang is hiding something from me."
16018-250-1 = "They said they have something serious to tell me. What could they be up to?"
16018-260-1 = "It's the new year. Let's stay healthy and make lots of money!"
16018-270-1 = "Merry Christmas, Sensei!"
16018-280-1 = "Well, Santa didn't visit this bad kid..."
16018-290-1 = "...but I think it's still okay for me to have fun!"
16018-300-1 = "*huff* *huff*"
16018-310-1 = "It was rough..."
16018-320-1 = "People kept going, \"Trick or treat...?\""
16018-330-1 = "I didn't have any treats to give!"
16018-340-1 = "So they all pulled tricks on me! Ugh!"
16018-360-1 = "One, two, three, four, five, six. Perfect!"
16018-370-1 = "Rescued all six of them!"
16018-380-1 = "You should listen to your mommy, okay?"
16018-390-1 = "Momma Duck also seems to be doing fine now..."
16018-400-1 = "...so that's another problem solved!"
16018-410-1 = "Wh-Wh-Wh-What are you talking about?!"
16018-420-1 = "Sensei, isn't that a bit rude?"
16018-430-1 = "Huh?...Ah?! That's..."
16018-440-1 = "Ah, ah! So that's what you meant!"
16018-450-1 = "Of course, a leader should have a compassionate side too!"
16018-460-1 = "(Is Sensei doing this on purpose? Maybe they're just clumsy?)"
16018-470-1 = "(Even if they are, it pisses me off. But it's worse if it was on purpose!)"
16018-480-1 = "(...There's no way that was on purpose... Right...?)"
16018-2600-1 = "Yeah! This is it! This is it! Thank you, Sensei!"
