[translation]
16002-20-1 = "If you need an explanation or commentary, just leave it to me!"
16002-30-1 = "The facts are never far from the question. But neither are the lies."
16002-40-1 = "Oh? I sense there's someone in need of my expertise!"
16002-50-1 = "Ugh. I want to explain things! I have to do it!"
16002-60-1 = "The riddle has been solved!"
16002-70-1 = "My explanations are always perfect. I never skimp on the details!"
16002-80-1 = "Welcome, Sensei! Let me explain today's schedule!"
16002-90-1 = "It's a great day, Sensei! Please come to the briefing room!"
16002-100-1 = "If you have any questions, give a shout!"
16002-110-1 = "Yell my name, and I'll come running! Okay?"
16002-120-1 = "Great question, Sensei! Let me give you the answer!"
16002-130-1 = "Aren't these glasses cool?! Would you like to try them on?"
16002-140-1 = "Facts are the light that dispels the darkness of ignorance."
16002-150-1 = "...But I agree that no one likes explanations that are too flashy."
16002-160-1 = "Oh, there's someone who has a question."
16002-170-1 = "Sensei! Let's go!"
16002-180-1 = "Happy birthday, Sensei! A birthday is a special day to celebrate the day you were born..."
16002-190-1 = "Wait! Where are you going?"
16002-200-1 = "Since it's my birthday, let me tell you my life's story..."
16002-210-1 = "Please, come back! I haven't finished my explanation yet!"
16002-220-1 = "I'm only getting started!"
16002-230-1 = "Happy New Year!"
16002-240-1 = "I'd like to listen to more of your lectures this year."
16002-250-1 = "Merry Christmas! Today marks the birthday of a historical messiah. How did it become a holiday for couples...?"
16002-260-1 = "Huh? Lovers...?"
16002-270-1 = "Trick or treat! If you don't give me candy, I'll start explaining..."
16002-280-1 = "Oh! I don't need that much!"
16002-300-1 = "Wh-What...?! That's not the kind of question I was expecting!"
16002-310-1 = "I'm sorry, but I don't quite understand. Could you ask me that just one more time?"
16002-320-1 = "...So I DID hear you correctly. Um... Okay, so... Something about me..."
16002-330-1 = "What am I supposed to say here...?"
16002-340-1 = "A-And what is the reasoning behind your line of questioning? I can't fathom the logic!"
16002-350-1 = "Oh, uh, not that you need a specific reason or anything!"
16002-360-1 = "...Huh? O-Of course I can answer your question! Talking about myself should be easy..."
16002-370-1 = "S-So, something, something about me?! In my free time, I like to... Um..."
16002-380-1 = "Well...! I like researching! And learning new things! And thinking about you, and...!"
16002-390-1 = "...? Wait. Wh-What did I just say...?"
16002-400-1 = "That I like learning new things, and thinking about you...?"
16002-410-1 = "Aha. Ah, hahaha..."
16002-420-1 = "Well, what I meant was...! I was trying to say, umm...!"
16002-2600-1 = "The name of this weapon is Professor K!"
