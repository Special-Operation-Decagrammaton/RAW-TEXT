[translation]
20021-10-1 = "ブルーアーカイブ！"
20021-20-1 = "メリークリスマ～ス！\nサンタさんの代わりに、\nハナエが来ましたよ！"
20021-30-1 = "こんにちは！\nサンタ服だけど\nハナエですよ～！"
20021-40-1 = "手術とプレゼントが\n必要な人～、\nいませんか～？"
20021-50-1 = "クリスマスでも\n救護騎士団の\n準備はバッチリです！"
20021-60-1 = "煙突は……どこに\nあるのでしょう？"
20021-70-1 = "クリスマスにチャリティー\nイベントがあるんです。\n私もそこでみんなと\n一緒に歌いますよ～"
20021-80-1 = "先生、先生！欲しい\nものはありませんか？"
20021-90-1 = "サンタの私がプレゼント\nしちゃいますよ～！"
20021-100-1 = "先生、最近忙しそう\nですね……今日も\n帰りが遅かったですし、"
20021-110-1 = "疲労がとれる簡単な\n手術をしましょうか？"
20021-120-1 = "私は今日も元気です！\n先生はお変わりありませんか？"
20021-130-1 = "具合が悪いときは、\nハナエを呼んでください！"
20021-140-1 = "注射も手術も\nプレゼントしちゃいます！"
20021-150-1 = "冬は凍傷に気を\n付けてくださいね！"
20021-160-1 = "一歩でも間違えたら、\n患部を切断する\nことになっちゃいますから！"
20021-170-1 = "クリスマスが待ち遠しいですね！\n胸がワクワクしちゃいます！"
20021-180-1 = "先生も楽しみだと\n嬉しいです！"
20021-190-1 = "先生、先生！\nクリスマスプレゼントに\nおっきなウサギのぬいぐるみ\nなんてどうですか？"
20021-200-1 = "わあ、お誕生日\nおめでとうございます！"
20021-210-1 = "はい、こちら！プレゼントの中に\nプレゼントを入れてみました！\nどうでしょう！"
20021-220-1 = "えっ……\nマトリョーシカみたい\n……ですか？"
20021-230-1 = "今日は私の誕生日です！\nプレゼントは……"
20021-240-1 = "先生が欲しいです！えへへ。"
20021-250-1 = "先生、もう新年ですよ！\nあけましておめでとう\nございます！"
20021-260-1 = "クリスマスは過ぎちゃったけど、\nまだサンタ服でも\n大丈夫でしょうか？"
20021-270-1 = "先生、クリスマスですよ！"
20021-280-1 = "今年もサンタさん、\n来てくれるかなぁ。"
20021-290-1 = "ハロウィンも大好きな\nお祭りの一つです！"
20021-300-1 = "でも……なんだか\n治療や手術が必要な\n人が多そうですね？"
20021-320-1 = "これは……私なりの\nサンタさんを\nお迎えする準備です。"
20021-330-1 = "サンタさんが寒くないよう、\n暖炉に火を入れて……"
20021-340-1 = "クリスマスツリーを可愛く\n飾り付けるんです。"
20021-350-1 = "サンタさん、\n待ってますよ～って。"
20021-360-1 = "そうすると、必ず靴下に\nプレゼントを入れて\nくれるんです！"
20021-370-1 = "そして今年はですね……"
20021-380-1 = "サンタさんにお礼を\nしようと思っています！"
20021-390-1 = "えへへ、どうでしょう？\n手作りクッキーと\n新鮮なミルクです！"
20021-2600-1 = "よし、準備オッケーです！"
