[translation]
10048-10-1 = "蔚藍檔案"
10048-20-1 = "我是奧利斯小隊的沙織。\n…受到了老師，很多關照。\n至少會做與其等價的工作。請多指教。"
10048-30-1 = "呼呣…"
10048-40-1 = "這種地方\n沒辦法習慣呢…"
10048-50-1 = "這是，什麼…？"
10048-60-1 = "無法理解…"
10048-70-1 = "原來如此，\n這是那種東西啊…"
10048-80-1 = "準備已經完成。\n有什麼事就說吧，\n老師。"
10048-90-1 = "我正在等你，老師。"
10048-100-1 = "……那是什麼反應。"
10048-110-1 = "我，有幫上忙嗎？"
10048-120-1 = "……那就好。光是那樣，\n我就能繼續待在這裡。"
10048-130-1 = "明明一切都是徒勞，\n為什麼我們還活著呢……"
10048-140-1 = "我還未知曉那個答案。"
10048-150-1 = "我……今後也\n必須繼續掙扎。"
10048-160-1 = "對我下令吧，老師。\n我就是為了這個，\n才會在這裡的。"
10048-170-1 = "我還能，繼續活下去嗎……"
10048-180-1 = "……聽說今天，\n是老師的生日。"
10048-190-1 = "抱歉，\n我不知道這種時候\n該做些什麼。"
10048-200-1 = "只不過……要是沒有你，\n我現在也不會在這裡了。"
10048-210-1 = "所以，老師。\n再次感謝你。"
10048-220-1 = "……我至今為止，\n幾乎沒有慶祝過生日。"
10048-230-1 = "所以還不清楚\n該怎麼接受那句話。"
10048-240-1 = "以及是否有那個資格。"
10048-250-1 = "我總有一天，\n也能發自內心地\n慶祝這一天嗎……"
10048-260-1 = "一年的結束嗎……嗯。\n雖然這世界的每一天\n依然冰冷痛苦……"
10048-270-1 = "即便如此，\n時間也會流逝啊。"
10048-280-1 = "平安夜嗎……沒事，\n我沒有任何感想。"
10048-290-1 = "我不認為，\n這世界的痛苦\n會因此減少。"
10048-300-1 = "……全都只是徒勞而已。"
10048-310-1 = "看來似乎是慶典……\n沒什麼興趣呢。"
10048-320-1 = "只不過是徒勞而已。"
