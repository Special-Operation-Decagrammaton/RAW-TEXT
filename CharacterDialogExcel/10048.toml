10048-600-1 = "ぐっ…はぁ…"
10048-610-1 = "…気にするな、\nよくあることだ。"
10048-620-1 = "ただ私の詰めが、\n甘かっただけで…"
10048-630-1 = "何も変わってないというのに…\n勘違いをしてしまった。"
10048-640-1 = "げほっ、げほっ…！"
10048-650-1 = "そんな顔をするな、\n痛みには慣れている。"
10048-660-1 = "今までと何も変わらない。\n今さらの話だ。"
10048-670-1 = "今はこれで良い…"
10048-680-1 = "もう少し、このままで…"
10048-2600-1 = "お前は…どうして私のことを信頼できる？\nあんなことがあったというのに…\n裏切られても、構わないというのか？\nまだ私には分からないことだらけだが、\nそれでも…私は、最善を尽くそう。"
