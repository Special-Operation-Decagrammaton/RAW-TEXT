[translation]
10048-10-1 = "ブルーアーカイブ"
10048-20-1 = "アリウススクワッドのサオリだ。\n…先生には色々と、世話になった。\nせめてその分の働きはしよう。よろしく頼む。"
10048-30-1 = "ふむ…"
10048-40-1 = "こういう場所は\n慣れないな…"
10048-50-1 = "これは、なんだ…？"
10048-60-1 = "理解ができない…"
10048-70-1 = "なるほど、これは\nそういう物なのか…"
10048-80-1 = "準備ならできている。\n何かあれば\n言うが良い、先生。"
10048-90-1 = "待っていたぞ、先生。"
10048-100-1 = "…なんだ、その反応は。"
10048-110-1 = "私は、役に立てているか？"
10048-120-1 = "…なら良い。それだけで、\n私はここにいられる。"
10048-130-1 = "全ては虚しいのに、\nどうして私たちは\n生きているのか…"
10048-140-1 = "私はまだ、\nその答えを知らない。"
10048-150-1 = "私は…これからも、\n足掻くしかない。"
10048-160-1 = "命令してくれ、先生\n私はそのために、\nここにいるのだから。"
10048-170-1 = "私はまだ、生きていても\nいいのだろうか…"
10048-180-1 = "…先生の誕生日、\nだと聞いた。"
10048-190-1 = "すまないが、\nこういう時に何を\nすべきかを私は知らない。"
10048-200-1 = "ただ…お前がいなければ、\n私も今ここにはいなかった。"
10048-210-1 = "だから、先生。\nあらためて感謝しよう。"
10048-220-1 = "…私はこれまで誕生日など、\nほとんど祝ったことがなかった"
10048-230-1 = "だから、その言葉の\n受け取り方も\nまだ分からない。"
10048-240-1 = "その資格があるのかも。"
10048-250-1 = "いつかこの日を、\n心から祝うことが\nできるだろうか…。"
10048-260-1 = "1年の終わりか…そうだな。\nこの世界の日々は、\n相変わらず冷たくて苦痛だが…"
10048-270-1 = "それでも、\n時は流れていくのか。"
10048-280-1 = "聖夜か…別に、\n何の感想も無い。"
10048-290-1 = "この世界の苦痛が、\nそれによって\n減るとは思えない。"
10048-300-1 = "…全ては、虚しいだけだ。"
10048-310-1 = "どうやらお祭りらしいが…\n特に興味は無いな。"
10048-320-1 = "ただ虚しいだけだ。"
