10048-570-1 = "มันก็แค่เรื่องไร้สาระเท่านั้น"
10048-590-1 = "คุณครู... ทำไมถึงมาอยู่ที่นี่ได้?"
10048-600-1 = "อึก... เฮ้อ..."
10048-610-1 = "ไม่ต้องห่วงหรอก\nเรื่องแบบนี้เกิดขึ้นบ่อยแล้ว"
10048-620-1 = "ฉันก็แค่ไม่ระวังตัวเอง..."
10048-630-1 = "ไม่มีอะไรเปลี่ยนไปเลยแท้ๆ...\nฉันเข้าใจผิดไปเอง"
10048-640-1 = "แค่กๆ แค่กๆ..."
10048-650-1 = "อย่าทำหน้าแบบนั้นสิ\nฉันชินกับความเจ็บปวดแล้วละ"
10048-660-1 = "มันก็เป็นแบบนี้มาตลอด\nไม่มีอะไรเปลี่ยน ไม่ใช่เรื่อง\nที่ต้องตกใจเลย"
10048-670-1 = "แค่นี้ฉันไม่เป็นไรหรอก"
10048-680-1 = "ฉันขออยู่แบบนี้...\nอีกสักหน่อยนะ"
10048-2600-1 = "นี่คุณ... เชื่อใจฉันได้ยังไงกันนะ?\nหลังจากเกิดเรื่องแบบนั้น...\nไม่กลัวว่าฉันจะหักหลังเลยเหรอ?\nมีอีกหลายอย่างที่ฉันยังไม่รู้\nแต่ฉันจะพยายามให้ดีที่สุดแล้วกัน"
