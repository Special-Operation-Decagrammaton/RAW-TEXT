[translation]
9009002-10-1 = "いらっしゃい、先生。"
9009002-20-1 = "ふふ、待ってたよ。"
9009002-30-1 = "ん？どうしたの？"
9009002-40-1 = "そんな目で見つめても、\nこの明太子味のお菓子は\nあげないんだから。"
9009002-50-1 = "つ、角は触らないで…！\n敏感なところなんだから！"
9009002-60-1 = "リン先輩とあなたは…\nとても忙しそうね。"
9009002-70-1 = "何よ、今チビのくせに…\nとか思ったでしょ？"
9009002-80-1 = "あなたは理解が早くて助かる。\n今回の任務もよろしくね。"
9009002-90-1 = "あははは！\n生徒のためなら何でもするなんて、\nあなたも相当バカみたいね。"
