[translation]
9009002-10-1 = "Welcome, Sensei."
9009002-20-1 = "Haha. I've been waiting for you."
9009002-30-1 = "Huh? What's going on?"
9009002-40-1 = "No pollock roe cracker for you.\nDon't even try begging me!"
9009002-50-1 = "Don't touch my horns!\nThey're sensitive!"
9009002-60-1 = "You and Rin sure do\nknow how to keep busy."
9009002-70-1 = "What? You thought I was\njust a kid... Didn't you?"
9009002-80-1 = "Thanks for taking care of these.\nHere's some more work for you."
9009002-90-1 = "Hahaha! You must be a fool\nto go so far for your students."
