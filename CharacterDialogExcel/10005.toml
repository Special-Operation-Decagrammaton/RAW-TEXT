10005-180-1 = "Wh-What? There's no point in celebrating the birthday of an old-timer like me."
10005-190-1 = "...Well, thanks anyway. It was still nice to hear. Ahahaha."
10005-200-1 = "It's the start of another year. Let's make it a good one, Sensei."
10005-210-1 = "Ugh. Days like this are a pain when you're my age. Everyone's so lively..."
10005-220-1 = "Well, I guess it doesn't hurt to enjoy a holiday every once in a while."
10005-230-1 = "Halloween, huh? It's never really meant anything to me before."
10005-240-1 = "That said, you like to celebrate Halloween yourself, right Sensei?"
10005-250-1 = "Huh? You want me to join you? Heh, I'd love to."
10005-270-1 = "Wow... Amazing. I've never been to a place like this before."
