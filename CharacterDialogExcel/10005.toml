[translation]
10005-20-1 = "*yawn* Let's take it slow and steady. No point in wearing ourselves out."
10005-30-1 = "This seems like a nice place. I like it."
10005-40-1 = "Where's a good place to take a nap?"
10005-50-1 = "Easy does it."
10005-60-1 = "Hmm. This might work."
10005-70-1 = "Heh... It'll be okay, I think."
10005-80-1 = "Welcome, Sensei. I see that you're still working as hard as ever."
10005-90-1 = "Yo! Welcome. You've got a lot of work waiting for you."
10005-100-1 = "This place is cool. I like it."
10005-110-1 = "I imagine you have it rough, Sensei."
10005-120-1 = "You need me? Heh, thanks for the empty compliment."
10005-130-1 = "Huh? You actually mean it? Oh, o-okay... Th-Thanks."
10005-140-1 = "There's no shame in pacing yourself. It's important to take your time."
10005-150-1 = "Heh... Birthday? I've never thought about your birthday before."
