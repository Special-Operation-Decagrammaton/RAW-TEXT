[translation]
20053-10-1 = "Blue, ahem, Archive?"
20053-20-1 = "Hello, Honorable Sensei! This mission's an infiltration! Please take care of me!"
20053-30-1 = "Fufu... What should I do if someone recognizes me...?"
20053-40-1 = "Is this dress...too much to be wearing here?"
20053-50-1 = "(A dress... Coffee... I'm getting an idea! For new content!)"
20053-60-1 = "Next time for sure...! I'll hold a fan meeting with my subscribers here...!"
20053-70-1 = "(Perfect, for now! ...Where's the most secluded spot here?)"
20053-80-1 = "You're here, Honorable Sensei!"
20053-90-1 = "Tsukuyo lent me her curling iron. Do you know how to use one?"
20053-100-1 = "I've been waiting, Sensei."
20053-110-1 = "...No, even in a dress, speaking like that doesn't suit me."
20053-120-1 = "Why is it that as clothes get prettier, they get more uncomfortable...?"
20053-130-1 = "It's uncomfortable, but there's lots of different places to hide my ninja gear!"
20053-140-1 = "Mindset makes a ninja, not the outfit!"
20053-150-1 = "So even if I'm wearing a dress, I'm still a ninja!"
20053-160-1 = "I want ramen...but I probably shouldn't while I'm wearing this..."
20053-170-1 = "This is the Michiru-style dress code, you know? Nyahaha!"
20053-180-1 = "I wore this especially for your birthday, Honorable Sensei!"
20053-190-1 = "...Hm? Does that mean I'm the gift? "
20053-200-1 = "N-No! Well, I mean, I wouldn't mind. I'd actually like it."
20053-210-1 = "Wait, no! NYOOO!"
20053-220-1 = "My birthday live stream is scheduled for today."
20053-230-1 = "The special guest, and my gift...is none other than Honorable Sensei!"
20053-240-1 = "Here, come sit next to me and look at the camera!"
20053-250-1 = "Happy New Year, Honorable Sensei!"
20053-260-1 = "You've got to start the new year with period dramas!"
20053-270-1 = "That said... Would you like to binge some with me?"
20053-280-1 = "Did you know, Honorable Sensei?"
20053-290-1 = "That \"Santa\" is just a ninja, disguised in different clothes...!"
20053-300-1 = "These caltrops?"
20053-310-1 = "Of course, it's a trap for those after our candies!"
20053-320-1 = "...Just kidding. They're just caltrop-shaped candies."
20053-340-1 = "Inside, there's...a ring! What?!"
20053-350-1 = "I-Isn't it amazing with the shuriken decoration?! Whoa!"
20053-360-1 = "...Hm? Eh? Honorable Sensei? Are you putting it on...?"
20053-370-1 = "N-No, it's not like it matters...! "
20053-380-1 = "(Huh? Giving a ring to someone...?) "
20053-390-1 = "(Isn't this...like a confession?!) "
20053-400-1 = "H-Hold on, Honorable Sensei!"
20053-410-1 = "This was definitely not intentional... I mean, well...! "
20053-420-1 = "Ugh, aaaah...!"
20053-2600-1 = "This... This for me...! But if it's Honorable Sensei's decision! Yes! Thank you!"
