[translation]
10126-10-1 = "ブルー……アーカイブ……イヒッ。"
10126-20-1 = "ワイルドハント芸術学院の板垣カノエ……。\n今日、会えることも……知ってたよ。\n私たち、赤い糸で結ばれてるからね……イヒッ。"
10126-30-1 = "前世で……\nこんなとこには\n来てない……。"
10126-40-1 = "オカルトグッズも……\n置いとかなきゃ。"
10126-50-1 = "あそこ……\n”何か”いるねぇ。"
10126-60-1 = "狭くて暗い場所……\nないかな……。"
10126-70-1 = "召喚の儀……ここで\nやってもいいかな？"
10126-80-1 = "先生、待ってたよ。"
10126-90-1 = "前世から、ずっと。"
10126-100-1 = "おかえり、先生……。"
10126-110-1 = "私……体温が低いんだ。"
10126-120-1 = "だから、そばで\nあっためてもらわないと……\nダメなの……イヒッ。"
10126-130-1 = "このヘアゴムのお陰で……"
10126-140-1 = "私、\n\"見える”んだよねぇ。"
10126-150-1 = "イヒッ……"
10126-160-1 = "冗談だよぉ……。"
10126-170-1 = "私の特製ポーション……"
10126-180-1 = "いるぅ？"
10126-190-1 = "先生のために……\n「いろいろ」入れたんだぁ。"
10126-200-1 = "運命は……”在る”んだよ……。"
10126-210-1 = "私たちの出会いが……\nそれを証明してる。"
10126-220-1 = "私は\nどんな声でも出せるよぉ……。"
10126-230-1 = "聞いてみたい声質があったら、\nなんでも言ってねぇ……。"
10126-240-1 = "お誕生日おめでとう……先生。"
10126-250-1 = "前世でも……\nお祝いしたねぇ。\nイヒヒッ……。"
10126-260-1 = "今日は死者の日で……"
10126-270-1 = "私の誕生日。"
10126-280-1 = "眠れる魂たちを想って……"
10126-290-1 = "一緒に祈ろう。"
10126-300-1 = "明けましておめでとう、先生。"
10126-310-1 = "本年もどうぞ\nよろしくお願いいたします。"
10126-320-1 = "いまの、大人っぽかった？\nイヒッ……。"
10126-330-1 = "クリスマスを\n先生と過ごせるなんて、\nカノエ、うれしいっ♡"
10126-340-1 = "今日はもう、\n離さないんだからっ♡"
10126-350-1 = "ハロウィン……"
10126-360-1 = "オカ研が暗闇の中で輝く日。"
10126-370-1 = "さぁ、かぼちゃの\nランタンを作ろうかぁ……\nイヒッ。"
10126-390-1 = "せ、先生……\nその、収録の前に……\n聞いてほしいことがあるの。"
10126-400-1 = "じ、実は……\n私、ずっと\n隠してたことがあって……。"
10126-410-1 = "わ、私……\n恥ずかしがり屋で、\nうまく話せなくて。"
10126-420-1 = "それを隠すために、\n陰気なキャラを演じてた……。"
10126-430-1 = "オカルトに手を出したのも、\n自分を変えたかったから。"
10126-440-1 = "これを知っているのは……\n先生だけ。"
10126-450-1 = "だから……\n内緒にしてね？"
10126-460-1 = "せ、先生のこと、\n信じてる、よ……。"
10126-470-1 = "……イヒッ、イヒヒ。\nねえ、信じたぁ？"
10126-480-1 = "先生は、\n可愛いものが好きなんでしょ？"
10126-490-1 = "じゃあ、\n私のことも……\n好き、だよねぇ？"
10126-500-1 = "イヒッ……！"
10126-2600-1 = "さすが先生……\nわかってる、ねぇ。イヒヒッ。"
