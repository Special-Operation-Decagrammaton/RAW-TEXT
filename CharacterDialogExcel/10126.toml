[translation]
10126-10-1 = "Blue... Archive... Heehee."
10126-20-1 = "Itagaki Kanoe from Wildhunt Art Academy... I knew...we'd meet today. Red thread connects us, after all... Heehee."
10126-30-1 = "I've never been somewhere like this... Not even in my previous life."
10126-40-1 = "I'll also bring...occult merch."
10126-50-1 = "There's \"something\"...over there."
10126-60-1 = "Is there...somewhere small and dark?"
10126-70-1 = "Should I try a summoning ritual here?"
10126-80-1 = "Sensei, I've been waiting for you."
10126-90-1 = "For longer than you know. Since my previous life."
10126-100-1 = "Welcome, Sensei..."
10126-110-1 = "I...tend to have low body temperature..."
10126-120-1 = "I need someone to help me warm up... Heehee..."
10126-130-1 = "Thanks to this hair tie..."
10126-140-1 = "I can see \"them.\""
10126-150-1 = "Heehee..."
10126-160-1 = "Just kidding..."
10126-170-1 = "This potion I made..."
10126-180-1 = "Would you like to try it?"
10126-190-1 = "I put in...a \"few things\" for you, Sensei."
10126-200-1 = "Fate...is real..."
10126-210-1 = "Our meeting...is proof of that."
10126-220-1 = "I...can mimic any voice."
10126-230-1 = "Let me know if there's a voice you want to hear. I'll make it happen..."
10126-240-1 = "Happy birthday, Sensei..."
10126-250-1 = "Your birthday...is on the same date as your previous life. Heehee."
10126-260-1 = "Today is the All Souls' Day..."
10126-270-1 = "And my birthday."
10126-280-1 = "All the sleeping souls..."
10126-290-1 = "Let's pray for them together."
10126-300-1 = "Hello, Sensei."
10126-310-1 = "Happy New Year."
10126-320-1 = "Didn't I sound like an adult? Heehee..."
10126-330-1 = "Spending Christmas with you makes Kanoe happy, Sensei! ♡"
10126-340-1 = "I'll stay right by your side all day! ♡"
10126-350-1 = "Halloween..."
10126-360-1 = "The day when Occult Society shines the brightest from the darkness."
10126-370-1 = "Now, let's make jack-o'-lanterns... Heehee."
10126-390-1 = "Sensei. Um, before we start recording...there's something I want you to know."
10126-400-1 = "Th-The thing is... There's something I've been hiding from you..."
10126-410-1 = "I'm...very shy, and I'm not a good talker either."
10126-420-1 = "And in order to hide that, I've been faking that gloomy personality..."
10126-430-1 = "The reason I got into the occult...was because I wanted to change myself."
10126-440-1 = "The only person who knows the real me...is you, Sensei."
10126-450-1 = "So...would you please keep it a secret?"
10126-460-1 = "I-I trust you, Sensei, so..."
10126-470-1 = "...Heehee, eheehee. Did you really fall for that, Sensei?"
10126-480-1 = "...Sensei, you like cute things, right?"
10126-490-1 = "That means, you...also like me, right?"
10126-500-1 = "Ehee...!"
10126-2600-1 = "As expected of Sensei... You know well. Eheehee."
