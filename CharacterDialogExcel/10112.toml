[translation]
10112-10-1 = "ブル～アーカイブ！"
10112-20-1 = "ご主人さ――あ、今は先生って呼んだ方がいいかな？\n楽しいこと、い～っぱいしようね！"
10112-30-1 = "ここ広いねー！\n私が案内して\nあげようか？"
10112-40-1 = "えへへっ、せっかく\n制服に着替えたし…\n遊んじゃおっかな♪"
10112-50-1 = "お腹空いて\nきちゃった…\nお菓子食べちゃお♪"
10112-60-1 = "みんな可愛い～！\n一緒に\n写真撮りた～い！"
10112-70-1 = "先生どこ～？視線は\n感じるんだけどなあ…\nちょっと\n探してみよっかな。"
10112-80-1 = "先生、お手伝い\nできることある？\nなんでも言ってね！"
10112-90-1 = "今日はなにしよっか？\n先生は何して遊びたい？"
10112-100-1 = "制服、どうかな？\nごしゅ…"
10112-110-1 = "ううん、先生の\n感想聞きたいな！"
10112-120-1 = "任務は楽しいけど、"
10112-130-1 = "こうして先生と\nいるのも好き～"
10112-140-1 = "先生、お散歩いかない？\n私がワンちゃんになるから！"
10112-150-1 = "え？ダメ？なんで～？"
10112-160-1 = "先生はいつも\nどんなお仕事してるの？"
10112-170-1 = "それって私も\n手伝えるやつ？\nお掃除なら得意だよ～！"
10112-180-1 = "わっ！\nマンガはっけーん！\nこれ先生の？"
10112-190-1 = "…え、違う？\n先生の匂いがするのに？"
10112-200-1 = "問題っ！今日は\n何の日でしょ～？\n…正解は～"
10112-210-1 = "私の大好きな、\n先生のお誕生日～！\nぱちぱちぱち！"
10112-220-1 = "あははっ、\nハッピーバースデー！\n先生！"
10112-230-1 = "わっ！私の誕生日、\n覚えてたんだ！"
10112-240-1 = "すごい！嬉しい！\n先生大好き～！"
10112-250-1 = "明けましておめでとう～！\n先生！"
10112-260-1 = "今年も私とた～くさん、\n遊んでくれるんでしょ？\n楽しみにしてるね、あはっ！"
10112-270-1 = "メリークリスマ～ス！\n先生！サンタさんから\nプレゼントはもらった？"
10112-280-1 = "え…大人はもらえない？"
10112-290-1 = "じゃあ、私があげよっか？\n何でも言って！"
10112-300-1 = "街中が面白い仮装の\n人で賑わってるね！"
10112-310-1 = "こんな楽しい日に\n出かけないなんて、\nもったいないよ～！"
10112-320-1 = "さあ先生！\n一緒にいこ～！"
10112-340-1 = "じゃーん！\n先生とアスナが、\n繋がっちゃいました！"
10112-350-1 = "どう？\nこれならどこにいるのか、\n分かるんじゃない？"
10112-360-1 = "…どうしたの？\nそんな顔して。"
10112-370-1 = "ん？逆、だっけ？\n私に巻いた\nほうがよかった？"
10112-380-1 = "…あれ？…あ、ああ！\nたしかに！"
10112-390-1 = "…あはっ、あははは！\nヘンなの！"
10112-400-1 = "これ、ほんとに…"
10112-410-1 = "ワンちゃんと\n散歩してるみたい！"
10112-420-1 = "じゃあ…今の先生は、\nアスナのワンちゃんだね？"
10112-430-1 = "アスナのワンちゃんは、\nワンワンって言えるかな？"
10112-440-1 = "ふふっ！\nちゃんと言えたら\nご褒美あげるから、ね？"
10112-2600-1 = "やったぁ！\nこれでもっ～と\n楽しく遊べるね！\nありがとう、先生！"
