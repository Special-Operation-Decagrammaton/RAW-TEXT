[translation]
10050-10-1 = "ブルーアーカイブ！"
10050-20-1 = "訓育支援部「梅花園」のココナです！\nち、違います！これでもれっきとした教官なんですよ！？"
10050-30-1 = "これは、\n一体……？"
10050-40-1 = "何だか変なものが\nたくさんですね"
10050-50-1 = "これ、梅花園にも\n欲しい……"
10050-60-1 = "シュン姉さん、\nどこに行っちゃっ\nたのかな……？"
10050-70-1 = "これは教育に\n役立ちそうですね"
10050-80-1 = "おかえりなさい、先生！\nあ、いえ、待ちわびてた\nとかでは……"
10050-90-1 = "その、まあ少しは。"
10050-100-1 = "一人前のレディーを\n待たせるなんて、減点です！"
10050-110-1 = "それでは、\n今日もよろしく\nお願いしますね。"
10050-120-1 = "私だって、いつもちゃんと\n授業してるんですよ\n……先生も、受けてみますか？"
10050-130-1 = "こ、ココナちゃんって\n呼ばないでください！\n小さい子みたいじゃないですか！"
10050-140-1 = "どうかしましたか？"
10050-150-1 = "……え、呼んだだけ？\nどういうことですか……"
10050-160-1 = "ああもう、突っつか\nないでください！\n子どもじゃないんですから！"
10050-170-1 = "お誕生日おめでとうございます、\n先生。どうですか、ちゃんと\n覚えていましたよ。"
10050-180-1 = "……私の誕生日も、覚えてますか？"
10050-190-1 = "あ、私の誕生日……\n覚えててくれたんですね。"
10050-200-1 = "えへへ、ありがとうございます！"
10050-210-1 = "あけましておめでとう\nございます、先生！"
10050-220-1 = "私は今年も教官として\n立派に頑張りますので、\n応援してくれると嬉しいです。"
10050-230-1 = "今年もよろしく\nお願いします！"
10050-240-1 = "クリスマス…\n今年もサンタさんは\n来るのでしょうか？"
10050-250-1 = "あ、いえ！私は教官なので、楽しみにしてるとかそういうのではなく……！"
10050-260-1 = "ハロウィーンの飴、ですか？"
10050-270-1 = "わ、私はもちろん\nあげる側です！\n教官なので！"
10050-280-1 = "ですがその、一応飴は\n嫌いではないので……"
10050-300-1 = "その……別に、ニンジンを\n好きになったわけでは\nありませんからね。"
10050-310-1 = "せっかく先生と一緒に来た\nわけですし、一人前の教官として\n仕方なく食べているだけです。"
10050-320-1 = "分かりましたか？\n全く、先生はいつも\n無理やり……。"
10050-330-1 = "もしどうしてもニンジンを\n食べないといけない場合は……\n今度からは、ここに来ます。"
10050-340-1 = "先生と一緒に来たお店、\nということもありますし……"
10050-350-1 = "良いですか？\n好きになってはないですよ？\n分かってます？"
10050-360-1 = "ただまあ……\nニンジンも、そこまで悪くは\nないかもしれません。"
10050-2600-1 = "時には厳しく、時には優しく……\nやるべき時にきちんとやれるのが、\n良い教官だと思います。\n私も、やりますよ！"
