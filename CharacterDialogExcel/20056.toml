[translation]
20056-10-1 = "Blue~~ Archive!"
20056-20-1 = "วะฮ่าฮ่าฮ่า!\nในที่สุดก็มาหาโคยูกิแล้วสินะคะ! คุณครู!"
20056-30-1 = "(ไหนดูซิ\nมีตรงไหนที่ซ่อนได้บ้าง...)"
20056-40-1 = "(ที่นี่...\nใช้บัตรของเซมิน่า\nจ่ายเงินได้มั้ยนะ?)"
20056-50-1 = "คงจะไม่\nไล่ตามมาถึงที่นี่\nหรอกใช่มั้ย...?"
20056-60-1 = "คุณครู คุณครู!\nอยู่ไหนเหรอคะ?"
20056-70-1 = "กาแฟวันนี้...\nสุ่มเมล็ดงั้นเหรอ?!\nฮือ ฉันไม่ชอบการสุ่มเลย..."
20056-80-1 = "อ๊ะ! มาแล้วเหรอคะ คุณครู!"
20056-90-1 = "ฉันกำลังจะเปิด\nซองการ์ดพอดีเลยค่ะ!"
20056-100-1 = "สวัสดีค่ะ คุณครู!"
20056-110-1 = "ฉันกินขนมที่อยู่ตรงนี้ได้มั้ยคะ?"
20056-120-1 = "ถึงฉันกำลังกินอยู่ก็เถอะค่ะ!\nวะฮ่าฮ่าฮ่า!"
20056-130-1 = "งานเข้าเวรตัวแทนเหรอคะ?"
20056-140-1 = "เดี๋ยวนะคะ\nขอฉันปูพื้นก่อนนะคะ!"
20056-150-1 = "เอาละๆ ไปที่ห้องสันทนาการ\nกันก่อนเถอะค่ะ คุณครู"
20056-160-1 = "รีบๆ มาเร็วเข้าสิคะ\nคุณครู!"
20056-170-1 = "ช่วยปิดไฟให้ด้วยค่ะ...!"
20056-180-1 = "ชาเล่ต์นี่ดีจังเลยนะคะ!"
20056-190-1 = "ไม่มีทั้งโดรนติดตาม\nฉากกั้นป้องกันการลอบเข้าก็ไม่มี..."
20056-200-1 = "ใช้ชาเล่ต์เป็น\nห้องสำนึกผิด..."
20056-210-1 = "ของฉันได้มั้ยคะ?\nอนุญาตด้วยเถอะค่ะ!"
20056-220-1 = "แฮปปี้ เบิร์ธเดย์ค่ะ\nคุณครู!"
20056-230-1 = "มาเล่นด้วยกัน\nตลอดทั้งคืนเถอะค่ะ!!"
20056-240-1 = "หมายถึงของขวัญ\nที่ฉันอยากได้เหรอคะ?"
20056-250-1 = "อืมมมม~?"
20056-260-1 = "จะไม่เสียใจทีหลัง\nที่มาถามใช่มั้ยคะ?"
20056-270-1 = "วันนี้เป็นวันสุดท้าย\nของปีแล้วนะคะ!"
20056-280-1 = "เพราะงั้นวันนี้\nไม่ว่าจะก่อเรื่องอะไร\nก็ไปแก้ไขในปีหน้าได้ค่ะ!\nวะฮ่าฮ่าฮ่า!"
20056-290-1 = "คะ...?\nไม่ใช่วันสุดท้ายเหรอคะ?"
20056-300-1 = "ตอนนี้เป็นปีใหม่แล้วเหรอคะ?\nได้ยังไงล่ะคะ?!"
20056-310-1 = "เพื่อให้ซานตาคลอส\nเอาของขวัญมาวางได้สะดวก"
20056-320-1 = "ฉันเลยปิดระบบความปลอดภัย\nไว้ทั้งหมดแล้วค่ะ!\nทำได้ดีเลยใช่มั้ยคะ?"
20056-330-1 = "ถึงจะใส่เสื้อผ้าแบบนี้\nคิดไม่ถึงเลยว่าจะ\nซ่อนตัวอยู่ในฝูงชนได้ด้วย...!"
20056-340-1 = "วันนี้เป็นวันที่ดีจังเลยนะคะ!"
20056-360-1 = "โอ๊ย! ทำไมถึงใช้\nตอนนี้กันล่ะคะ!!"
20056-370-1 = "บอกแล้วไงว่าให้ฉันใช้ก่อน!\nคุณครูค่อยใช้น่ะค่ะ!"
20056-380-1 = "คิดจะปฎิเสธแผนการ\nอันสมบูรณ์แบบของฉันเหรอคะ?!"
20056-390-1 = "ฉันอุตส่าห์ตื่นตั้งแต่เช้า\nเพื่อมาจองที่ให้คุณครูเลยนะคะ!!"
20056-400-1 = "คะ...?\nเรื่องนั้นกับเรื่องนี้\nมันคนละเรื่องกันเหรอ?"
20056-410-1 = "ถ้าพูดแบบนั้น\nทางคุณครูเป็นฝ่าย\nออกเหรียญมากกว่างั้นเหรอคะ?"
20056-420-1 = "อืม...\nแต่ถึงอย่างนั้นก็เถอะ..."
20056-430-1 = "งั้นถือว่าเสมอกันแล้วกันนะคะ!\nสงบศึกก่อนแล้วกัน!"
20056-440-1 = "ใช่แล้วค่ะ!\nคราวหน้าจะต้อง\nไปได้สวยแน่นอนค่ะ!"
20056-450-1 = "วะฮ่าฮ่า...!"
20056-460-1 = "วะฮ่าฮ่าฮ่า...!"
20056-2600-1 = "แน่นอนว่าโชคดีที่สุดของฉัน\nก็คือคุณครูยังไงล่ะคะ!\nเพราะงั้น ฉันจะทำให้ดีที่สุดค่ะ!\nขอบคุณค่ะ!"
