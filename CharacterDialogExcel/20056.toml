[translation]
20056-10 = "蔚藍檔案！"
20056-20 = "尼・哈・哈・哈～！\n終於來到這裡了呢，老師！\n來到我黑崎小雪的身邊！"
20056-30 = "（能躲藏的地方\n是……這裡！）"
20056-40 = "（這裡……研討會的\n卡能用嗎？）"
20056-50 = "總不會追到\n這裡來……對吧？"
20056-60 = "老師在哪裡呀～？"
20056-70 = "今天的咖啡是……\n隨機混合！？\n嗚咿……我不太\n擅長這種的說。"
20056-80 = "啊！老師來得正好～！"
20056-90 = "我正好要開卡包呢！"
20056-100 = "你好，老師！"
20056-110 = "可以吃點心嗎？\n可以吧？"
20056-120 = "雖然我其實已經在吃了啦！\n呢哈哈！"
20056-130 = "值日生是嗎？"
20056-140 = "請稍等一下，\n我去拿野餐墊！"
20056-150 = "來來來，\n去遊戲中心吧！\n老師！"
20056-160 = "老師，請快點過來這邊！"
20056-170 = "……能順便幫我關個燈嗎？"
20056-180 = "夏萊真是好地方呢～！"
20056-190 = "沒有追蹤用無人機，\n也沒有防止入侵的\n閘門……"
20056-200 = "作為反省室的代替，\n改在夏萊反省怎麼樣呢？"
20056-210 = "可以吧？\n拜託說可以！"
20056-220 = "Happy Birthday！\n老師！"
20056-230 = "今晚來熬夜\n玩個痛快吧！！"
20056-240 = "想要的東西……？"
20056-250 = "哼嗯～？"
20056-260 = "你真的要問？\n不會後悔嗎？"
20056-270 = "今天是一年的\n最後一天！"
20056-280 = "所以今天不管做什麼，\n都只要明年再收拾就好了！\n尼哈哈！"
20056-290 = "……咦？\n不是最後一天？"
20056-300 = "已經新年了？\n怎麼回事！？"
20056-310 = "為了讓聖誕老人\n順利來訪，"
20056-320 = "我把安全措施\n全部解除了！\n尼哈哈！"
20056-330 = "穿成這樣到處走動\n居然也沒問題……！"
20056-340 = "多麼美好的一天啊！"
20056-360 = "啊啊！\n為什麼現在\n放那招啊！！"
20056-370 = "明明說過要在\n我之後再放的啊！"
20056-380 = "你打算毀掉\n完美的作戰嗎！？"
20056-390 = "我都為了老師\n早起占位子了耶！！"
20056-400 = "……咦？\n那個和這個\n是兩回事？"
20056-410 = "真要說的話，\n老師出的代幣更多……？"
20056-420 = "唔嗯……\n那倒是沒錯啦……"
20056-430 = "唔……休戰吧！\n暫時休戰！"
20056-440 = "說的也是！\n我下次絕對會\n發揮得更好的！"
20056-450 = "……尼哈哈！"
20056-460 = "……尼哈哈。"
20056-2600 = "我想，最大的幸運\n肯定是能遇見老師吧！\n所以，那個……我會全力以赴的！\n請多指教囉！"
