[translation]
20056-10 = "Blue~~ Archive!"
20056-20 = "อุวะฮะฮ่า!\nในที่สุดก็มาหาโคยูกิแล้วสินะคะ! คุณครู!"
20056-30 = "(ไหนดูซิ\nมีตรงไหนที่\nซ่อนได้บ้าง...)"
20056-40 = "(ที่นี่...\nใช้บัตรของเซมิน่า\nจ่ายเงินได้มั้ยนะ?)"
20056-50 = "คงจะไม่\nไล่ตามมาถึงที่นี่\nหรอกใช่มั้ย...?"
20056-60 = "คุณครู คุณครู!\nอยู่ไหนเหรอคะ?"
20056-70 = "กาแฟวันนี้...\nสุ่มเมล็ดงั้นเหรอ?!\nฮือ... ฉันไม่ชอบ\nการสุ่มเลย..."
20056-80 = "อ๊ะ! มาแล้วเหรอคะ คุณครู!"
20056-90 = "ฉันกำลังจะเปิด\nซองการ์ดพอดีเลยค่ะ!"
20056-100 = "สวัสดีค่ะ คุณครู!"
20056-110 = "ฉันกินขนมที่อยู่ตรงนี้ได้มั้ยคะ?"
20056-120 = "ถึงฉันกำลังกินอยู่ก็เถอะค่ะ!\nอุวะฮะฮ่า!"
20056-130 = "งานเข้าเวรตัวแทนเหรอคะ?"
20056-140 = "เดี๋ยวนะคะ\nก่อนอื่นฉันจะ\nปูพื้นก่อนนะคะ!"
20056-150 = "เอาละๆ ไปที่ห้องสันทนาการ\nกันก่อนเถอะค่ะ คุณครู"
20056-160 = "รีบๆ มาเร็วเข้าสิคะ\nคุณครู!"
20056-170 = "ช่วยปิดไฟให้ด้วยค่ะ...!"
20056-180 = "ชาเล่ต์นี่ดีจังเลยนะคะ!"
20056-190 = "ไม่มีทั้งโดรนติดตาม\nฉากกั้นป้องกันการลอบเข้าก็ไม่มี..."
20056-200 = "ใช้ชาเล่ต์เป็น\nห้องสำนึกผิด..."
20056-210 = "ของฉันได้มั้ยคะ?\nอนุญาตด้วยเถอะค่ะ!"
20056-220 = "แฮปปี้ เบิร์ธเดย์ค่ะ\nคุณครู!"
20056-230 = "มาเล่นด้วยกัน\nตลอดทั้งคืนเถอะค่ะ!!"
20056-240 = "หมายถึงของขวัญ\nที่ฉันอยากได้เหรอคะ?"
20056-250 = "อืมมมม~?"
20056-260 = "จะไม่เสียใจทีหลัง\nที่มาถามใช่มั้ยคะ?"
20056-270 = "วันนี้เป็นวันสุดท้าย\nของปีแล้วนะคะ!"
20056-280 = "เพราะงั้นวันนี้\nไม่ว่าจะก่อเรื่องอะไร\nก็ไปแก้ไขในปีหน้าได้ค่ะ!\nอุวะฮะฮ่า!"
20056-290 = "คะ...?\nไม่ใช่วันสุดท้ายเหรอคะ?"
20056-300 = "ตอนนี้เป็นปีใหม่แล้วเหรอคะ?\nได้ยังไงล่ะคะ?!"
20056-310 = "เพื่อให้ซานตาคลอส\nเอาของขวัญมาวางได้สะดวก"
20056-320 = "ฉันเลยปิดระบบความปลอดภัย\nไว้ทั้งหมดแล้วค่ะ!\nทำได้ดีเลยใช่มั้ยคะ?"
20056-330 = "ถึงจะใส่เสื้อผ้าแบบนี้\nคิดไม่ถึงเลยว่าจะ\nซ่อนตัวอยู่ในฝูงชนได้ด้วย...!"
20056-340 = "วันนี้เป็นวันที่ดีจังเลยนะคะ!"
20056-360 = "อ่า! ทำไมถึงเอาออกมา\nตอนนี้กันล่ะคะ!!"
20056-370 = "บอกแล้วไงว่า\nให้ฉันเอาออกมาก่อน\nคุณครูค่อยเอาออกมาน่ะค่ะ!"
20056-380 = "คิดจะปฎิเสธแผนการ\nอันสมบูรณ์แบบของฉันเหรอคะ?!"
20056-390 = "ฉันอุตส่าห์ตื่นตั้งแต่เช้า\nเพื่อมาจองที่ให้คุณครูเลยนะคะ!!"
20056-400 = "คะ...?\nเรื่องนั้นกับเรื่องนี้\nมันคนละเรื่องกันเหรอ?"
20056-410 = "ถ้าพูดแบบนั้น\nทางคุณครูเป็นฝ่าย\nออกเหรียญมากกว่านะคะ?"
20056-420 = "อืม...\nแต่ถึงอย่างนั้นก็เถอะ..."
20056-430 = "งั้นถือว่าเสมอกันแล้วกันนะคะ!\nสงบศึกก่อนแล้วกัน!"
20056-440 = "ใช่แล้วค่ะ!\nคราวหน้าจะต้อง\nไปได้สวยแน่นอนค่ะ!"
20056-450 = "วะฮ่าฮ่า...!"
20056-460 = "วะฮ่าฮ่า...!"
20056-2600 = "แน่นอนว่าโชคดีที่สุดของฉัน\nก็คือคุณครูยังไงล่ะคะ!\nเพราะงั้น ฉันจะทำให้ดีที่สุดค่ะ!\nขอบคุณค่ะ!"
