[translation]
20056-10-1 = "Blue Archive!"
20056-20-1 = "Nihahaha! So you came to Koyuki! Sensei!"
20056-30-1 = "(Let's see, a place to hide...)"
20056-40-1 = "(I wonder...if I can pay with Seminar's card here?)"
20056-50-1 = "Surely they wouldn't chase me all the way here, right...?"
20056-60-1 = "Sensei? Sensei! Where are you?"
20056-70-1 = "Today's coffee is...random beans?! Ugh, I hate randomness..."
20056-80-1 = "Ah! You're here, Sensei!"
20056-90-1 = "I was just about to open a pack of cards!"
20056-100-1 = "Hello, Sensei!"
20056-110-1 = "Can I eat snacks here?"
20056-120-1 = "Though I was already helping myself! Nihahaha!"
20056-130-1 = "Student Rep duties?"
20056-140-1 = "Hold on, let me lay out a mat first!"
20056-150-1 = "Now, now, let's go for an arcade trip first, Sensei."
20056-160-1 = "Hurry, hurry up and come here, Sensei!"
20056-170-1 = "...Please turn the lights off!"
20056-180-1 = "Schale feels nice!"
20056-190-1 = "No tracking drones, no anti-entry shutters..."
20056-200-1 = "Using Schale as my self-reflection room..."
20056-210-1 = "I can, right? Please tell me I can!"
20056-220-1 = "Happy birthday, Sensei!"
20056-230-1 = "Let's have fun all night!"
20056-240-1 = "You're asking about gifts I'd like?"
20056-250-1 = "Hmmm?"
20056-260-1 = "You really don't regret asking, right?"
20056-270-1 = "Today is the last day of the year!"
20056-280-1 = "Which means whatever we mess up today, we can deal with it next year! Nihahaha!"
20056-290-1 = "...What? It's not the last day of the year?"
20056-300-1 = "It's already the new year? Why?!"
20056-310-1 = "To make it easy for Santa to drop off gifts and get out,"
20056-320-1 = "I disabled all the security! Did I do a good job?"
20056-330-1 = "I can't believe I can still blend in with the crowd while dressed like this!"
20056-340-1 = "What a great day!"
20056-360-1 = "Ahh! Why would you use that then?!"
20056-370-1 = "I told you to do it AFTER I went!"
20056-380-1 = "Are you trying to undermine my flawless plan?!"
20056-390-1 = "When I even got up early and saved a spot just for you, Sensei!!"
20056-400-1 = "...Huh? That's a different issue entirely?"
20056-410-1 = "If I really want to go there... Sensei's the one who spent more coins...?"
20056-420-1 = "Hmm... Well, that IS true, but..."
20056-430-1 = "All righty, let's call it even! Temporary truce!"
20056-440-1 = "Right! This next run is going to be the one! I just feel it!!"
20056-450-1 = "...Nihaha!"
20056-460-1 = "...Nihahaha..."
20056-2600-1 = "...I'm sure my best lucky charm is Sensei! Which is why! I'll do my best! Thank you!"
