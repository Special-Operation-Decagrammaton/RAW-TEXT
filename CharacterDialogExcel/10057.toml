[translation]
10057-10-1 = "Blue Archive."
10057-20-1 = "Heh heh, Happy New Year. I'm prepared with a floral furisode and an open mind. Let's find some intriguing new food to try!"
10057-30-1 = "True epicurianism involves all aspects of life."
10057-40-1 = "Location and appropriate dress are essential elements of fine dining."
10057-50-1 = "This is the time of year for special dishes. Heehee, I'm quite excited."
10057-60-1 = "I've worn furisodes quite frequently, actually."
10057-70-1 = "I hope we find food that's truly worthy of savoring."
10057-80-1 = "Heh heh heh, welcome, Sensei. Have you enjoyed any epicurean experiences today?"
10057-90-1 = "How are you, Sensei? Why don't we look for a fine dining experience for the New Year?"
10057-100-1 = "Sensei, do you like furisodes? ...Huh? You think I look good in one? Heh... O-Of course I do!"
10057-110-1 = "Hm... Suddenly, I'm craving something warm and soft to eat. Could it be because I'm talking to you?"
10057-120-1 = "Osechi are typically all boiled foods."
10057-130-1 = "However, it seems these days that's not always the case."
10057-140-1 = "My opinion? I think either way is delicious."
10057-150-1 = "What's more appetizing than seasonal food? For the New Year, we could have osechi, ozoni, oshiruko..."
10057-160-1 = "Oh... Now I'm hungry!"
10057-170-1 = "The value of gourmet food is universal."
10057-180-1 = "...You agree, right Sensei?"
10057-190-1 = "Sensei! It's your birthday today. What would you like to eat?"
10057-200-1 = "I'll make us reservations at a restaurant that I'm sure you'll enjoy."
10057-210-1 = "Oh! You're celebrating my birthday...? I'm so happy."
10057-220-1 = "Heh heh heh, please go out to eat with me today."
10057-230-1 = "As long as I'm with you...every meal will be gourmet."
10057-240-1 = "Happy New Year, Sensei!"
10057-250-1 = "It's New Year's Day! I've changed into my furisode to celebrate."
10057-260-1 = "It's very important to wear the proper outfit to enjoy a celebratory meal."
10057-270-1 = "Sensei, how's your Christmas going? Everything I eat today tastes especially sweet and warm."
10057-280-1 = "Heehee. I think...that's all thanks to you, Sensei."
10057-290-1 = "Happy Halloween! I brought a delicious pumpkin pie with me today."
10057-300-1 = "Would you like a bite, Sensei?"
10057-320-1 = "Many things are important for a true gourmet experience: the food itself, the person you eat with, the timing..."
10057-330-1 = "And, of course, the way in which you eat is just as crucial."
10057-340-1 = "Heh heh heh. So, I was thinking...why don't we feed each other today?"
10057-350-1 = "I'll feed you first, Sensei. Now then, open your mouth and say ahhh..."
10057-360-1 = "H-Hurry up already. I'm embarrassed too..."
10057-370-1 = "Until you take a bite from my hand, I'm not moving an inch!"
10057-380-1 = "Now then... Ahhh..."
10057-2600-1 = "Special foods that you only eat once a year make a holiday seem magical. With this experience, I'm getting closer to true epicurianism, and...closer to you, too, Sensei. I truly always appreciate you."
