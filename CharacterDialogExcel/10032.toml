[translation]
10032-10-1 = "ブルーアーカイブ~！"
10032-20-1 = "あははっ！お待たせ、先生！\n今年もたーっくさん、私と遊んでくれるよねっ？"
10032-30-1 = "みんなで\n羽根つきとか\nしたいな～"
10032-40-1 = "先生とは何して\n遊ぼっかな～♪"
10032-50-1 = "笑う門には福来る～♪"
10032-60-1 = "オモチャはっけ～ん♪"
10032-70-1 = "先生に甘えたら、\nお年玉もらえるかな？"
10032-80-1 = "新年から頑張ってる\n先生のために、\nムツキちゃんが来てあげたよ～！"
10032-90-1 = "おかえり先生～♪\nず～っと待ってたよっ♡"
10032-100-1 = "先生先生、\n今日は何して遊ぶ？"
10032-110-1 = "じゃんけん？缶蹴り？\nそれとも……"
10032-120-1 = "か・く・れ・ん・ぼ？"
10032-130-1 = "あっ、でも分かってるよ。\n遊んでばっかりじゃ\nダメなんだよね？\n大人だから、仕事もしないと？"
10032-140-1 = "そこでナイスな\n提案なんだけど～……"
10032-150-1 = "私が手伝ってあげよっか！"
10032-160-1 = "うーん、こういう\n格好だからかな～？\nなんかちょっとだけ、\n気合が入るかも？"
10032-170-1 = "ほらほら先生、頑張って！\n早く仕事終わらせて、\nそしたらたっくさん遊ぼう！"
10032-180-1 = "先生とこーんなに\n長い付き合いになるなんて……"
10032-190-1 = "これってもう、運命かも！？"
10032-200-1 = "お誕生日おめでとー、先生！\nちゃーんと覚えてたよ！"
10032-210-1 = "先生のお誕生日も、\n私とずーっと遊んでくれるって\nいう約束も、忘れてなんて\nあげないんだから！くふふっ♪"
10032-220-1 = "私の誕生日、\nお祝いしてくれるの？"
10032-230-1 = "くふふっ！じゃあ、\n何してもらおっかな～……？"
10032-240-1 = "うーん、そしたら二人で、\n何かいたずらしに行こう！\n一緒だったら絶対楽しいよっ！"
10032-250-1 = "あけましておめでと、先生！\nハッピーニューイヤ～！\nボナネ～！グーテン・タ～ク！！"
10032-260-1 = "ん？最後のは間違ってるって？\nあはっ、大正解～！"
10032-270-1 = "新年の前に、今日は\nメリークリスマスだよ先生！"
10032-280-1 = "くふふっ、今日も先生と\nたっくさん遊びたいなっ！"
10032-290-1 = "トリック・オア・トリートー！\nというわけで、先生のことを\n食べちゃうぞ～♪"
10032-300-1 = "え～？ダメなのー？"
10032-320-1 = "あはっ、ざ～んねん！\n私の勝ちだよ、先生！"
10032-330-1 = "くふふっ、\nここまでの健闘は\n認めてあげるけど～……"
10032-340-1 = "勝負の世界は厳しいものだから、\n仕方ないよね？くふっ♪"
10032-350-1 = "さーて、\n何を描いちゃおっかなぁ？\nマル？バツ？\nそれとも他のが良い？"
10032-360-1 = "今なら先生の言うこと、\n何でも聞いてあげるよ？"
10032-370-1 = "あっ、でも気が変わっちゃった。\n普通の記号だと\nちょっと寂しいし……"
10032-380-1 = "お顔全体に、\nくまなく塗ってあげるねっ！"
10032-2600-1 = "あははっ、良いね良いね！\nこれならもっと楽しく遊べちゃうかもっ！"
