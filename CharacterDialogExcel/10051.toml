[translation]
10051-10-1 = "ブルーアーカイブ。"
10051-20-1 = "ミレニアムの応援団長、白石ウタハ。\n冷たい理性と熱い情熱で、\n皆を応援するとしよう。"
10051-30-1 = "情熱でいっぱいの\n空間だね。"
10051-40-1 = "ここで応援を始めたら、\nどこまで声が届くかな。"
10051-50-1 = "ここで皆と一緒に、\nマスゲームを\nしてみたい…"
10051-60-1 = "（ふふ、面白い\n応援計画を\n思いついたよ）"
10051-70-1 = "なんだろう…\n気合いが\n足りないような。"
10051-80-1 = "やあ、先生。\n応援が必要なら、\nいつでも声をかけてくれ。"
10051-90-1 = "さあ、先生。\n今日も気合いを入れて、\n元気に一日をはじめよう！"
10051-100-1 = "人を元気づけるのは\n大事なことだ。"
10051-110-1 = "クリエイティブな結果を\n得るためにもね。"
10051-120-1 = "辛いことがあったのかい？\n大丈夫、まずは\nもう一度やってみよう。"
10051-130-1 = "こうして先生と\n一緒にいると…"
10051-140-1 = "何でもできそうな気がするよ。"
10051-150-1 = "マイスターとはいわば、\n機械たちの応援団長のような\n存在なのかもしれないね…"
10051-160-1 = "先生にこんな姿を\n見せるのも悪くないね。"
10051-170-1 = "どうだい？\n少しは…新鮮かな？"
10051-180-1 = "ああ、今日は\n先生の誕生日か。"
10051-190-1 = "今日一日は、先生だけの\n応援団長になるとしよう。"
10051-200-1 = "私の誕生日…？\nもうそんな時期なんだね。"
10051-210-1 = "ああ、でもあんまり\n特別な感じはしないな。"
10051-220-1 = "先生が私を\n応援してくれてるから、"
10051-230-1 = "年中ずっと\n誕生日みたいな\n気持ちなんだ。"
10051-240-1 = "ありがとう、先生。"
10051-250-1 = "年が明けたね。\n新年初日から皆が元気に\nなれるよう、応援合戦を\nはじめるとしようか。"
10051-260-1 = "サンタは情熱的だね。\n誰かに応援でも\nされてるのだろうか。"
10051-270-1 = "ああ…子供たちの夢と希望、が\n情熱の源なのかもしれないね。"
10051-280-1 = "その…休憩室にあった\nカボチャのランプを\n全部爆破させたのは、\nわざとじゃあないんだ…"
10051-290-1 = "私はただ…カボチャが\n60フレームで\n光っていたほうが\n綺麗だと思って…"
10051-310-1 = "フレー！フレー！\nミレニアム！"
10051-320-1 = "行け！行け！勝て！勝て！\nミレニアム！"
10051-330-1 = "ふふ… どうだい、先生？\nすごい光景だと思わないか？"
10051-340-1 = "このマスゲームには、\n新型ブルートゥース装置を\n搭載したロボットを\n使用しているから、"
10051-350-1 = "どんなに複雑な振付でも\n完璧に演出する\nことができるんだ。"
10051-360-1 = "…うん？演出に機械を\n使用するぐらいなら、\nスクリーンを設置したほうが\n効率的なのではないのかって？"
10051-370-1 = "先生、\nロマンのない話は\n辞めたまえ。"
10051-380-1 = "アナログのパネルが一斉に\n動いて完成される光景には、"
10051-390-1 = "スクリーンとは比べ物に\nならないほどの迫力と\n感動があるんだよ。"
10051-400-1 = "元来、胸高鳴る瞬間を\n与えるロマンは、「効率」とは\n程遠いものだからね。"
10051-2600-1 = "情熱の香りこそ、\nマイスターのインスピレーションを\n研ぎ澄ませる動力さ。"
