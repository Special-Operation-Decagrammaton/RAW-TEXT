[translation]
10022-10-1 = "……ブルーアーカイブ。"
10022-20-1 = "ゲヘナの風紀委員長、ヒナ。\n……これはあくまで、夏のトレーニング合宿のための格好だから。"
10022-30-1 = "この水着、\n変じゃないかな……？"
10022-40-1 = "トレーニングの\nせいか……\n少し体がだるい。"
10022-50-1 = "可愛い水着なんて、\n私には似合わない……"
10022-60-1 = "ここは涼しいね……\nトレーニングに\nぴったり。"
10022-70-1 = "次のトレーニングの\n内容を考えないと……"
10022-80-1 = "ああ、おかえり。先生。\nトレーニングの\n準備ならもうできてるよ。"
10022-90-1 = "今年の夏も、\nよろしく。"
10022-100-1 = "……えっと、そうやって\nあんまり見られると、その……。"
10022-110-1 = "この水着？\n合宿のトレーニングには\nちょうど良いかなって。"
10022-120-1 = "別に期待とか、\n楽しみにしてたわけじゃ……。"
10022-130-1 = "その、ほんの\n少しくらいしか……。"
10022-140-1 = "トレーニングもいいけど、\n休息も大事？"
10022-150-1 = "……確かにそれも正論。\nでも、私がサボる\nわけにはいかないから。"
10022-160-1 = "何かできること……？"
10022-170-1 = "ありがとう、先生。\nそう言ってくれるだけで、\n私は嬉しい。"
10022-180-1 = "この夏が終わる、\n最後の瞬間まで……。"
10022-190-1 = "私がすぐそばで、\n先生のことを助けるから。"
10022-200-1 = "今日、先生のお誕生日？"
10022-210-1 = "えっと、どうしよう……\n私に何かできることある？"
10022-220-1 = "一緒に、海辺を散歩……？\nふふっ。そんなことで\n良いなら、喜んで。"
10022-230-1 = "私の誕生日……？\nああ、そういえばそうだった。"
10022-240-1 = "何か欲しいもの……？\nいや、別に何も……。"
10022-250-1 = "えっ、取り合えず\n一緒に海に飛び込もう？"
10022-260-1 = "ちょ、ちょっと待って先生！\nこ、心の準備が……！"
10022-270-1 = "明けましておめでとう。先生。"
10022-280-1 = "今年の夏もよろしくね。\nできれば今年も、\nまたその次の夏も……。"
10022-290-1 = "メリークリスマス、先生。"
10022-300-1 = "今日がどれだけ\n特別な日なのか、\n私はよく分かってないけど。"
10022-310-1 = "先生と一緒に\n迎えられたことは、\n嬉しいって思える。"
10022-320-1 = "ハロウィンか……。\nちょっと慣れないけど……"
10022-330-1 = "夏の海みたいに賑やかで、\nみんな楽しそうね。"
10022-350-1 = "何でみんな、そんなに\n海が好きなんだろう……って、\nずっとそう思ってた。"
10022-360-1 = "みんなは楽しそうだけど、\n私はどうしても\n好きになれなくて……"
10022-370-1 = "水の中はよく見えないし、\n足がつかないと不安だし……"
10022-380-1 = "先生も、そう思ったことない？"
10022-390-1 = "特に夜の海は、\nまるで暗闇みたいに\n不気味で……"
10022-400-1 = "見てるだけで\n吸い込まれそうで、\n好きになれなかったけど……"
10022-410-1 = "でも……今は、\nみんなの気持ちが\n少しだけ分かった気がする。"
10022-420-1 = "海って、\nこんなに綺麗だったのね。"
10022-430-1 = "不思議……今まで、\nこんな風に思った\nことなかったのに。"
10022-440-1 = "ありがとう、先生。\n一緒にいてくれて……"
10022-450-1 = "色んなことを、\n教えてくれて。"
10022-2600-1 = "これを、私に……？\n分かった、ありがたく受け取る。\n最後の瞬間、その時まで……\n先生の期待に応えてみせるから。"
