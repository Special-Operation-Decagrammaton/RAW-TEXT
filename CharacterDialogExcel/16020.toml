[translation]
16020-10-1 = "Blue Archive!"
16020-20-1 = "โอ้ สบายดีมั้ย? เป็นครั้งแรกเลยมั้ยนะ\nที่ฉันทักทายจริงจังแบบนี้ เท็นจินยามะ โอโทกิ\nสไนเปอร์จากกองทหาร FOX ต่อไปก็ขอฝากตัวด้วยนะ คุณครู"
16020-30-1 = "(ง่วงจัง... อยากดื่ม\nกาแฟสักแก้ว...)"
16020-40-1 = "ดีเลย...!\nใช้ช่วงหยุดพัก\nไปเวทเทรนนิ่งดีมั้ยนะ?"
16020-50-1 = "โอ้ ทุกคนดูมี\nพลังเหลือล้นเลยนะ?"
16020-60-1 = "(เหมือนเห็นคนที่เคยเจอ\nที่สำนักควบคุมเลยแฮะ...)"
16020-70-1 = "โอ้ สินค้าใหม่\nของฟรุตเจลลี่\nถ่ายรูปไว้ก่อนดีกว่า"
16020-80-1 = "โอ้ เข้ามาสิ คุณครู\nวันนี้ให้ฉัน\nทำงานอะไรดีล่ะ?"
16020-90-1 = "ชู่ว คุณครู เข้ามาเงียบๆ นะ\nตรงโน้นมีผีเสื้อเกาะอยู่"
16020-100-1 = "ขึ้นชื่อว่าเป็นสไนเปอร์\nทักษะการสังเกตของฉัน\nไม่แพ้ใครอยู่แล้ว"
16020-110-1 = "อื้อ ถ้าจะให้ยกตัวอย่างละก็..."
16020-120-1 = "เอ่อ คุณครู...\nให้พูดออกมาก็ยังไงๆ อยู่..."
16020-130-1 = "แต่เหมือนจะไม่ได้\nรูดซิปตรงข้างล่างนั่น"
16020-140-1 = "อึก ปวดไหล่จัง... คุณครู\nช่วยนวดไหล่ให้หน่อยได้มั้ย?"
16020-150-1 = "ที่ขอให้ช่วย\nเพราะฉันปวดจริงๆ นะ~"
16020-160-1 = "ขอร้องละ!"
16020-170-1 = "ก่อนเข้ามาอยู่ SRT\nฉันเคยคิดว่าจะย้ายไปโรงเรียน\nในเขตปกครองตนเองที่เคยอยู่\nแล้วไปเป็นคณะกรรมการวินัยด้วย..."
16020-180-1 = "เป็นโรงเรียนที่มีเอกลักษณ์เลยละ..."
16020-190-1 = "เหมือนที่นั่นจะมีกฎแปลกๆ\nอย่างการดวลตัดสิน\nเพื่อเลือกหัวหน้าชมรมด้วย"
16020-200-1 = "FOX 3...\nคุรุมิเป็นพ็อยนต์แมนแท้ๆ\nแต่ก็ชอบกังวลอะไรมากมาย"
16020-210-1 = "ทั้งที่ฉันคอยระวังหลังให้\nคุรุมิอยู่ตลอดแท้ๆ..."
16020-220-1 = "บางที... ฉันก็คิดถึง\nคอปเปะปังจืดๆ\nที่สำนักควบคุมเคยแจกให้"
16020-230-1 = "จะสั่งมากินเองต่างหากได้มั้ยนะ?"
16020-240-1 = "สุขสันต์วันเกิดนะ คุณครู"
16020-250-1 = "ฉันจะพยายามทำให้วันนี้\nของคุณครูเป็นวันที่สงบสุข\nเชื่อใจพวกเราได้เลย"
16020-260-1 = "วันเกิดเหรอ? ไม่ต้องจัดแจง\nให้กันถึงขนาดนี้ก็ได้นี่นา..."
16020-270-1 = "แต่ยังไงก็... ขอบคุณที่ช่วยอวยพรนะ"
16020-280-1 = "สวัสดีปีใหม่นะ คุณครู"
16020-290-1 = "ปีนี้... จะได้กลับไป\nสถาบัน SRT หรือเปล่านะ?"
16020-300-1 = "ฉันไม่มีความทรงจำดีๆ\nในวันคริสต์มาสหรอก..."
16020-310-1 = "คริสต์มาสอีฟปีที่แล้ว\nมีคนเอาคุกกี้ผสมยานอนหลับ\nวางไว้บนโต๊ะกินข้าว... "
16020-320-1 = "ฉันง่วงตลอดช่วงวันหยุดยาว\nก็เลยจำอะไรแทบไม่ได้เลย"
16020-330-1 = "ไม่อยากได้วันหยุดยาว\nแบบนั้นแล้ว~"
16020-340-1 = "วันฮาโลวีนงั้นเหรอ...\nมีคนแต่งคอสเพลย์\nเพียบเลยนะ"
16020-350-1 = "ถึงปกติฉันก็เปลี่ยนชุดบ่อยๆ\nเพราะภารกิจแฝงตัว\nอยู่แล้วก็เถอะ"
16020-360-1 = "แต่ถ้าคุณครูขอ\nฉันก็เปลี่ยนชุดให้ได้นะ"
16020-370-1 = "อยากได้แบบไหนหรือเปล่า?"
16020-390-1 = "อึก... ทั้งขมทั้งฝาดคอ..."
16020-400-1 = "คงเพราะปล่อย\nเมล็ดกาแฟทิ้งไว้นาน\nรสชาติเลยไม่ได้เรื่องเลย"
16020-410-1 = "ความเพ้อฝันงั้นเหรอ... นั่นสินะ"
16020-420-1 = "ถ้าไม่ใช่เพราะความเพ้อฝันนั่นแล้วละก็\nฉันคงมาไม่ถึงจุดนี้หรอก"
16020-430-1 = "ตอนเด็กๆ ไม่เคยอยากมี\nฐานลับบ้างเหรอ?"
16020-440-1 = "แต่พอได้มีเข้าจริงๆ มันก็\nต่างจากที่คิดไว้เยอะเลยละ"
16020-450-1 = "ทั้งแคบ ไม่สะดวก\nแล้วก็ทำอะไรไม่ได้มาก..."
16020-460-1 = "ชีวิตจริงที่ฉันเคยเฝ้าฝัน\nคงเป็นแบบนั้นมาตลอดสินะ"
16020-470-1 = "ทั้งภาพลักษณ์ของผู้ใหญ่\nในอุดมคติ และชีวิตใน SRT"
16020-480-1 = "แต่ก็คงเป็นเพราะ\nความเพ้อฝันนั่นละมั้ง"
16020-490-1 = "ความไม่สะดวกสบายใน\nชีวิตจริงตอนนี้เลยกลายเป็น\nรสชาติที่แปลกของฉันไปแล้ว"
16020-500-1 = "คุณครู กาแฟราคาถูกๆ\nที่ชงมาด้วยความเพ้อฝัน\nรสชาติเป็นยังไงบ้าง?"
16020-510-1 = "ฮุฮุ\nยินดีต้อนรับสู่โลกของฉันอีกครั้งนะ"
16020-2600-1 = "ได้รับปืนไรเฟิล FOX รุ่น 82 มาแล้ว\nสำหรับการซุ่มยิงระยะไกล\nหรือทำลายสิ่งกีดขวาง คงไม่มี\nอาวุธใดดีไปกว่านี้แล้ว... แต่พอยิง\nไปเรื่อยๆ ไหล่ของฉันก็จะตึงนี่น่ะสิ"
