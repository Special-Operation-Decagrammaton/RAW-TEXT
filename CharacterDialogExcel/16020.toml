[translation]
16020-10 = "蔚藍檔案！"
16020-20 = "呀啊！過得好嗎？\n像這樣正式打招呼還是第一次呢。\nFOX小隊的狙擊手，天神山御伽。\n今後請多指教囉，老師。"
16020-30 = "（好睏……有沒有\n咖啡啊……）"
16020-40 = "好！趁現在來做點\n肌力訓練吧。"
16020-50 = "哦哦……\n幹勁滿滿呢……"
16020-60 = "（好像在矯正局\n看過的樣子……？）"
16020-70 = "啊，這個是\n《Full Jelly》的\n新周邊嗎。\n拍下來吧～"
16020-80 = "呀啊。\n歡迎回來，老師。\n那麼……\n今天要我做什麼呢？"
16020-90 = "噓，老師，安靜。\n那裡有隻蝴蝶。"
16020-100 = "畢竟我是狙擊手嘛。\n會特別注意到\n細微的地方。"
16020-110 = "我想想……\n例如說──"
16020-120 = "啊……老師。\n雖然有點難開口……"
16020-130 = "你的社會之窗，\n全開了哦。"
16020-140 = "嗚～肩膀好痠……\n老師～可以幫我\n捶一下肩膀嗎？"
16020-150 = "真的很痛啦～"
16020-160 = "拜託你了！"
16020-170 = "進入SRT之前，\n我原本打算直接升上\n本來在自治區就讀的學園，\n然後加入風紀委員之類的呢。"
16020-180 = "那是一間\n很不可思議的學園～"
16020-190 = "在那裡，\n有個奇怪的在地規則，\n就是靠決鬥來決定部長。\n"
16020-200 = "FOX3……胡桃\n明明是尖兵，\n卻擔心太多有的沒的。"
16020-210 = "……明明胡桃的背後，\n一直都有我在守護的說。"
16020-220 = "偶爾～會懷念起在矯正局\n吃過的熱狗麵包呢。"
16020-230 = "不知道那個\n能不能買得到呢。"
16020-240 = "生日快樂，老師。"
16020-250 = "為了讓今天這美好的一天\n能平安無事地度過，\n我們也會努力的。\n交給我們吧。"
16020-260 = "生日？\n其實不用特地慶祝\n也沒關係的……"
16020-270 = "嗯……\n不過我還是很開心啦。\n謝謝你啦。"
16020-280 = "新年快樂，老師。"
16020-290 = "希望今年\n學園能夠復活就好了。"
16020-300 = "說到聖誕節，\n其實沒什麼\n好回憶呢……"
16020-310 = "以前吃了桌上的餅乾，\n結果裡面摻了安眠藥……"
16020-320 = "唉，整個連假\n都睏得不得了呢。"
16020-330 = "那種事已經受夠了～"
16020-340 = "萬聖節啊……\n變裝的人，\n感覺會變多呢。"
16020-350 = "我因為潛入任務\n穿過各式各樣的服裝……"
16020-360 = "不過呢，如果老師\n無論如何都想看的話，\n穿給你看也是可以的哦？"
16020-370 = "你喜歡什麼樣的？"
16020-390 = "嗚……好苦……"
16020-400 = "陳年的豆子為什麼\n總是這麼不好喝呢。"
16020-410 = "浪漫……是嗎。\n……說的也是。"
16020-420 = "要是沒有那份浪漫，\n我大概也走不到\n今天這一步吧。"
16020-430 = "小時候，你有沒有\n對秘密基地有過憧憬？"
16020-440 = "可是，實際做出來之後\n卻跟想像中完全不一樣……"
16020-450 = "不只空間狹窄，\n能做的事也不多。"
16020-460 = "總覺得……\n像是被迫面對了\n夢想與現實呢。"
16020-470 = "無論是理想的大人，\n還是SRT的生活。"
16020-480 = "不過……\n或許正因為如此吧。"
16020-490 = "無論現實是什麼模樣，\n我都開始覺得別有一番風味。"
16020-500 = "老師你……\n對乘載著浪漫的\n陳年咖啡，\n是怎麼想的呢？"
16020-510 = "呵呵……\n重新向你介紹一次，\n歡迎來到我的世界。"
16020-2600 = "FOX-82式狙擊步槍，我收下了哦。\n用來超遠距離狙擊或擊破障礙物\n再適合不過了……\n不過連發的話肩膀會痠呢。"
