[translation]
16020-10 = "Blue Archive!"
16020-20 = "Oh, how've you been? I guess this is the first time we're formally meeting. I'm Tenjinyama Otogi, sniper of the FOX Squad. Look forward to working with you."
16020-30 = "(Sleepy... Need some coffee...)"
16020-40 = "...Nice! Maybe I'll get a little strength training in."
16020-50 = "Whoa, now isn't everyone full of spirit?"
16020-60 = "(I think I recognize that person from the Corrections Bureau...)"
16020-70 = "Oh, new Fruitjellies merch. I'll just snap a pic for now."
16020-80 = "Oh, welcome, Sensei. So, what do I need to do today?"
16020-90 = "Shh, Sensei. Come in quietly. There's a butterfly sitting over there."
16020-100 = "Since I'm a sniper, I pride myself on my sharp observation skills."
16020-110 = "Yeah, for example..."
16020-120 = "Um, Sensei... This is a bit awkward to say, but..."
16020-130 = "Your fly is down."
16020-140 = "Ugh, my shoulders... Sensei, can you rub my shoulders?"
16020-150 = "Seriously, they reaaally hurt!"
16020-160 = "Pretty please!"
16020-170 = "Before I joined SRT, I was thinking of enrolling in the academy from the district I lived in and joining their student council..."
16020-180 = "It sure was an interesting academy..."
16020-190 = "They had a weird tradition of deciding the president through a duel."
16020-200 = "FOX 3... Kurumi's our point woman, but she's always worrying."
16020-210 = "...Even though I always have her back."
16020-220 = "Sometimes... I miss the bland koppe bread they used to give us at the Corrections Bureau."
16020-230 = "Can I get them from somewhere?"
16020-240 = "Happy birthday, Sensei."
16020-250 = "I'll do what I can to make sure your day's peaceful, Sensei. You just gotta trust me."
16020-260 = "My birthday? You didn't have to do all this..."
16020-270 = "But still... Thanks for the birthday wishes."
16020-280 = "Happy New Year, Sensei."
16020-290 = "Is this...the year we can go back to SRT?"
16020-300 = "Christmas doesn't bring up the best memories."
16020-310 = "Last Christmas Eve, someone laced cookies with sleeping pills... "
16020-320 = "I ended up sleeping through the holiday and not experiencing anything."
16020-330 = "I don't want another holiday like that."
16020-340 = "It's Halloween... There are a lot of people cosplaying."
16020-350 = "I do have to dress up for infiltration missions, but..."
16020-360 = "Well, if you're the one asking, I don't mind changing."
16020-370 = "Do you want me to?"
16020-390 = "Ugh... It's bitter and dry..."
16020-400 = "It's seriously awful. Maybe the beans have gone bad."
16020-410 = "My dream... Yeah."
16020-420 = "Without that dream, I would never have made it as far as I did."
16020-430 = "Did you ever want to make a secret base when you were young?"
16020-440 = "The reality of it ended up being pretty different from my imagination when I did finally make one."
16020-450 = "They're cramped, uncomfortable, and pretty boring."
16020-460 = "I guess that's how it always is with dreams. Reality never lives up to them."
16020-470 = "Things like an ideal adult, life in SRT..."
16020-480 = "But at the same time, because of that dream..."
16020-490 = "The disappointments of reality have become an acquired taste for me."
16020-500 = "Sensei. What does cheap coffee steeped in my dreams taste like?"
16020-510 = "Fufu. Once again, welcome to my world."
16020-2600 = "Confirming receipt for FOX 82-Sniper Rifle. With this baby, my range and accuracy is unbeatable... But it sure does do a number on my shoulder after a while."
