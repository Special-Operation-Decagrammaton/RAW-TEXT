[translation]
16020-10-1 = "Blue Archive!"
16020-20-1 = "Oh, how've you been? I guess this is the first time we're formally meeting. I'm Tenjinyama Otogi, sniper of the FOX Squad. Look forward to working with you."
16020-30-1 = "(Sleepy... Need some coffee...)"
16020-40-1 = "...Nice! Maybe I'll get a little strength training in."
16020-50-1 = "Whoa, now isn't everyone full of spirit?"
16020-60-1 = "(I think I recognize that person from the Corrections Bureau...)"
16020-70-1 = "Oh, new Fruitjellies merch. I'll just snap a pic for now."
16020-80-1 = "Oh, welcome, Sensei. So, what do I need to do today?"
16020-90-1 = "Shh, Sensei. Come in quietly. There's a butterfly sitting over there."
16020-100-1 = "Since I'm a sniper, I pride myself on my sharp observation skills."
16020-110-1 = "Yeah, for example..."
16020-120-1 = "Um, Sensei... This is a bit awkward to say, but..."
16020-130-1 = "Your fly is down."
16020-140-1 = "Ugh, my shoulders... Sensei, can you rub my shoulders?"
16020-150-1 = "Seriously, they reaaally hurt!"
16020-160-1 = "Pretty please!"
16020-170-1 = "Before I joined SRT, I was thinking of enrolling in the academy from the district I lived in and joining its disciplinary committee..."
16020-180-1 = "It sure was an interesting academy..."
16020-190-1 = "They had a weird tradition of deciding the president through a duel."
16020-200-1 = "FOX 3... Kurumi's our point woman, but she's always worrying."
16020-210-1 = "...Even though I always have her back."
16020-220-1 = "Sometimes... I miss the bland koppe bread they used to give us at the Corrections Bureau."
16020-230-1 = "Can I get them from somewhere?"
16020-240-1 = "Happy birthday, Sensei."
16020-250-1 = "I'll do what I can to make sure your day's peaceful, Sensei. You just gotta trust me."
16020-260-1 = "My birthday? You didn't have to do all this..."
16020-270-1 = "But still... Thanks for the birthday wishes."
16020-280-1 = "Happy New Year, Sensei."
16020-290-1 = "Is this...the year we can go back to SRT?"
16020-300-1 = "Christmas doesn't bring up the best memories."
16020-310-1 = "Last Christmas Eve, someone laced cookies with sleeping pills... "
16020-320-1 = "I ended up sleeping through the holiday and not experiencing anything."
16020-330-1 = "I don't want another holiday like that."
16020-340-1 = "It's Halloween... There are a lot of people cosplaying."
16020-350-1 = "I do have to dress up for infiltration missions, but..."
16020-360-1 = "Well, if you're the one asking, I don't mind changing."
16020-370-1 = "Do you want me to?"
16020-390-1 = "Ugh... It's bitter and dry..."
16020-400-1 = "It's seriously awful. Maybe the beans have gone bad."
16020-410-1 = "My dream... Yeah."
16020-420-1 = "Without that dream, I would never have made it as far as I did."
16020-430-1 = "Did you ever want to make a secret base when you were young?"
16020-440-1 = "The reality of it ended up being pretty different from my imagination when I did finally make one."
16020-450-1 = "They're cramped, uncomfortable, and pretty boring."
16020-460-1 = "I guess that's how it always is with dreams. Reality never lives up to them."
16020-470-1 = "Things like an ideal adult, life in SRT..."
16020-480-1 = "But at the same time, because of that dream..."
16020-490-1 = "The disappointments of reality have become an acquired taste for me."
16020-500-1 = "Sensei. What does cheap coffee steeped in my dreams taste like?"
16020-510-1 = "Fufu. Once again, welcome to my world."
16020-2600-1 = "Confirming receipt for FOX 82-Sniper Rifle. With this baby, my range and accuracy is unbeatable... But it sure does do a number on my shoulder after a while."
