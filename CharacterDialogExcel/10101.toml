[translation]
10101-10-1 = "ブルー、アーカイブ。"
10101-20-1 = "ここが今回のアルバイト先か…\n海は初めてだが、任せてくれ。"
10101-30-1 = "ここで\n練習してもいいか？"
10101-40-1 = "あの装飾…アツコに\n似合いそうだ。"
10101-50-1 = "この辺りは騒々しいな。\nミサキには\n不向きかもしれない。"
10101-60-1 = "カフェか…ヒヨリの\nお気に入りの雑誌が、\n見つかるといいのだが。"
10101-70-1 = "たしかここに、\n家計簿が…"
10101-80-1 = "先生、待っていた。\n今日の業務はなんだ？"
10101-90-1 = "ん～ん～ん～"
10101-100-1 = "せ、先生！？い、今の、\n聞こえていたか…？"
10101-110-1 = "アルバイトだからと、\n手を抜くなどあっては\nならない。"
10101-120-1 = "与えられた業務は、\nすべて全力で挑んでいる。"
10101-130-1 = "次の給料でミサキに\n贈り物をしよう…"
10101-140-1 = "この服装は、アルバイトで\n必要だから着ているだけだが…"
10101-150-1 = "先生が気に入ったと\nいうのなら、これからも\n着るとしよう。"
10101-160-1 = "海、お祭り…"
10101-170-1 = "いつか、\nアズサとも一緒に\n訪れたいものだ。"
10101-180-1 = "海もアルバイトも、\n知らないことだらけだ。"
10101-190-1 = "しかしいつまでも\n「不慣れ」を言い訳には\nできない。尽力する。"
10101-200-1 = "誕生日だな、先生。"
10101-210-1 = "めでたい日に\n最適な曲を用意した。\nそこに座ってくれ、\n今から演奏する。"
10101-220-1 = "私の誕生日…"
10101-230-1 = "ああ…仕事に\n没頭していて\n忘れていた。"
10101-240-1 = "慣れなくても、\nお礼はきちんと\n言わなければ。"
10101-250-1 = "感謝する、先生。"
10101-260-1 = "明けましておめでとう、\n先生。"
10101-270-1 = "笑顔の一年であるよう、\n祈ろう。"
10101-280-1 = "クリスマスだな。\nキャロルを数曲、\nサンプリングしてきた。"
10101-290-1 = "聞いてくれるか？先生。"
10101-300-1 = "お菓子…いたずら…む…"
10101-310-1 = "まだよく分からないな…\n片方を選べば、いいのか？"
10101-320-1 = "先生、待っていた。\n今日の業務はなんだ？"
10101-330-1 = "ん～ん～ん～"
10101-340-1 = "せ、先生！？い、今の、\n聞こえていたか…？"
10101-350-1 = "アルバイトだからと、\n手を抜くなどあっては\nならない。"
10101-360-1 = "与えられた業務は、\nすべて全力で挑んでいる。"
10101-370-1 = "次の給料でミサキに\n贈り物をしよう…"
10101-380-1 = "この服装は、アルバイトで\n必要だから着ているだけだが…"
10101-390-1 = "先生が気に入ったと\nいうのなら、これからも\n着るとしよう。"
10101-400-1 = "海、お祭り…"
10101-410-1 = "いつか、\nアズサとも一緒に\n訪れたいものだ。"
10101-420-1 = "海もアルバイトも、\n知らないことだらけだ。"
10101-430-1 = "しかしいつまでも\n「不慣れ」を言い訳には\nできない。尽力する。"
10101-440-1 = "誕生日だな、先生。"
10101-450-1 = "めでたい日に\n最適な曲を用意した。\nそこに座ってくれ、\n今から演奏する。"
10101-460-1 = "私の誕生日…"
10101-470-1 = "ああ…仕事に\n没頭していて\n忘れていた。"
10101-480-1 = "慣れなくても、\nお礼はきちんと\n言わなければ。"
10101-490-1 = "感謝する、先生。"
10101-500-1 = "明けましておめでとう、\n先生。"
10101-510-1 = "笑顔の一年であるよう、\n祈ろう。"
10101-520-1 = "クリスマスだな。\nキャロルを数曲、\nサンプリングしてきた。"
10101-530-1 = "聞いてくれるか？先生。"
10101-540-1 = "お菓子…いたずら…む…"
10101-550-1 = "まだよく分からないな…\n片方を選べば、いいのか？"
10101-570-1 = "終演後の\n客席というのは、\n寂しいものだな。"
10101-580-1 = "大勢いた観客がはけ、\n照明はすべて消えて…"
10101-590-1 = "華やかなステージは\n跡形もなく、静寂に\n沈んでいる。"
10101-600-1 = "熱気と歓声に\n満ちていた空間が\n突如静まると…どこか、\n切なさを覚えるほどだ。"
10101-610-1 = "…でも、今はもう、\n大丈夫だ。"
10101-620-1 = "変わったことは\n何もないが、\n穏やかでいられる。"
10101-630-1 = "…先生が隣にいるから、\nかもしれないな。"
10101-2600-1 = "将来は不確かだが、\n一つだけ断言できる。\n先生からもらった\nこの信頼の証は…\n最後まで、大切にする。"
