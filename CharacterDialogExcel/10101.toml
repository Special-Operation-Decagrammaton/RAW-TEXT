[translation]
10101-10-1 = "블루 아카이브."
10101-20-1 = "여기가 이번 아르바이트 장소군….\n바다는 처음이지만, 맡겨 줘."
10101-30-1 = "여기서\n연습해도 되나?"
10101-40-1 = "저 장식…\n아츠코에게\n어울릴 것 같군."
10101-50-1 = "이 주변은 소란스럽군.\n미사키는 그다지\n좋아하지 않겠어."
10101-60-1 = "카페라…. 히요리가\n좋아하는 잡지가\n있으면 좋겠는데."
10101-70-1 = "분명 여기에,\n가계부가…."
10101-80-1 = "아, 선생. 기다리고 있었다.\n오늘 업무는 뭐지?"
10101-90-1 = "음~ 음~ 음~"
10101-100-1 = "서, 선생?!\n바, 방금 거, 들었나…?"
10101-110-1 = "아르바이트라고 해서\n대충 하는 일은 있을 수 없어."
10101-120-1 = "맡은 일에는 언제나\n최선을 다하고 있다."
10101-130-1 = "다음 급료로 미사키에게\n선물을 해야겠어…."
10101-140-1 = "이 복장은,\n아르바이트할 때 필요하니까\n입고 있는 것뿐이지만…."
10101-150-1 = "선생이 마음에 들어 한다면,\n앞으로도 입도록 하지."
10101-160-1 = "바다, 축제…."
10101-170-1 = "언젠가, 아즈사와도\n함께 가보고 싶군."
10101-180-1 = "바다도, 아르바이트도\n모르는 일투성이다."
10101-190-1 = "하지만 언제까지나 '낯설다'고\n핑계 댈 수는 없지.\n전력을 다하겠어."
10101-200-1 = "생일이군, 선생."
10101-210-1 = "기쁜 날에\n최적의 곡을 준비했다.\n거기 앉아주겠나.\n지금부터 연주하지."
10101-220-1 = "내 생일…."
10101-230-1 = "아아… 일에\n몰두하고 있어서\n잊고 있었다."
10101-240-1 = "익숙하지 않아도,\n감사의 말은\n제대로 해야지."
10101-250-1 = "고맙다, 선생."
10101-260-1 = "새해 복 많이 받아라, 선생."
10101-270-1 = "웃음 가득한\n한 해가 되기를 빌겠다."
10101-280-1 = "크리스마스군. 캐럴을\n몇 곡 샘플링해 왔다."
10101-290-1 = "들어주겠나? 선생."
10101-300-1 = "으음, 과자, 장난…."
10101-310-1 = "아직 잘 모르겠다만,\n둘 중에 선택하면 되는 건가?"
10101-320-1 = "아, 선생. 기다리고 있었다.\n오늘 업무는 뭐지?"
10101-330-1 = "음~ 음~ 음~"
10101-340-1 = "서, 선생?!\n바, 방금 거, 들었나…?"
10101-350-1 = "아르바이트라고 해서\n대충 하는 일은 있을 수 없어."
10101-360-1 = "맡은 일에는 언제나\n최선을 다하고 있다."
10101-370-1 = "다음 급료로 미사키에게\n선물을 해야겠어…."
10101-380-1 = "이 복장은,\n아르바이트할 때 필요하니까\n입고 있는 것뿐이지만…."
10101-390-1 = "선생이 마음에 들어 한다면,\n앞으로도 입도록 하지."
10101-400-1 = "바다, 축제…."
10101-410-1 = "언젠가, 아즈사와도\n함께 가보고 싶군."
10101-420-1 = "바다도, 아르바이트도\n모르는 일투성이다."
10101-430-1 = "하지만 언제까지나 '낯설다'고\n핑계 댈 수는 없지.\n전력을 다하겠어."
10101-440-1 = "생일이군, 선생."
10101-450-1 = "기쁜 날에\n최적의 곡을 준비했다.\n거기 앉아주겠나.\n지금부터 연주하지."
10101-460-1 = "내 생일…."
10101-470-1 = "아아… 일에\n몰두하고 있어서\n잊고 있었다."
10101-480-1 = "익숙하지 않아도,\n감사의 말은\n제대로 해야지."
10101-490-1 = "고맙다, 선생."
10101-500-1 = "새해 복 많이 받아라, 선생."
10101-510-1 = "웃음 가득한\n한 해가 되기를 빌겠다."
10101-520-1 = "크리스마스군. 캐럴을\n몇 곡 샘플링해 왔다."
10101-530-1 = "들어주겠나? 선생."
10101-540-1 = "으음, 과자, 장난…."
10101-550-1 = "아직 잘 모르겠다만,\n둘 중에 선택하면 되는 건가?"
10101-570-1 = "종연 후의 객석은,\n쓸쓸한 것이군."
10101-580-1 = "그 많던 관객은 빠지고,\n조명은 모두 꺼지고…."
10101-590-1 = "화려한 무대는\n흔적도 없이,\n정적에 잠겨 있다."
10101-600-1 = "열기와 함성으로 가득했던 공간이\n갑자기 조용해지니…. 어딘가,\n애틋한 느낌마저 든다."
10101-610-1 = "…그래도 지금은 괜찮다."
10101-620-1 = "변한 것은 아무것도 없지만,\n평온하게 있을 수 있다."
10101-630-1 = "…선생님이\n옆에 있으니까,\n일지도 모르겠군."
10101-2600-1 = "장래는 불확실하지만,\n한 가지만은 장담할 수 있어.\n선생으로부터 받은\n이 신뢰의 증거는…\n끝까지, 소중히 하겠다."
