[translation]
20042-10-1 = "Blue Archive..."
20042-20-1 = "Ugh, camping... I have to go outside again on my day off...?"
20042-30-1 = "I don't want to go outside today..."
20042-40-1 = "Ah, I just got a great idea!"
20042-50-1 = "Should I try installing the one-time bed I borrowed from Chihiro around here?"
20042-60-1 = "Huh? What is this wi-fi with a weird name...?"
20042-70-1 = "(Can I install BOOM on this too? ...Let's give it a shot!)"
20042-80-1 = "Ah, Sensei. You're here?"
20042-90-1 = "You're not planning on going back outside right now, are you...?"
20042-100-1 = "Isn't it really cold today, Sensei?"
20042-110-1 = "I predicted this, which is why I overloaded a bunch of electronic devices in the office!"
20042-120-1 = "I go up on tall buildings a lot when I'm graffiting..."
20042-130-1 = "...but climbing a mountain feels a little different."
20042-140-1 = "It definitely feels like my energy levels drop without Wi-Fi access..."
20042-150-1 = "The mountain's scenery would feel more colorful if the fall foliage stayed throughout spring, summer, and winter..."
20042-160-1 = "But I guess fall foliage is more valuable because it doesn't stay long, right?"
20042-170-1 = "These braids?"
20042-180-1 = "Yeah, I did them myself."
20042-190-1 = "My usual dango hair takes a long time to do, so I'm too lazy to do it on my days off..."
20042-200-1 = "How does Chihiro wake up and get to club room so early everyday?"
20042-210-1 = "Could it be...that she goes to bed before midnight?!"
20042-220-1 = "You can use a lot of things besides paint to graffiti."
20042-230-1 = "Like how I drew the cave mural last time!"
20042-240-1 = "Since it's hard to get paint off..."
20042-250-1 = "...I should look for natural, recyclable materials more often."
20042-260-1 = "Yay, Sensei! Happy birthday!"
20042-270-1 = "I drew a giant portrait of you on the outer walls of the Schale building for your birthday gift..."
20042-280-1 = "Ahaha, I was kidding. You don't need to be so shocked."
20042-290-1 = "But if there IS any gift you want, let me know!"
20042-300-1 = "Whoa... It's already my birthday again."
20042-310-1 = "Heehee, I don't need any presents."
20042-320-1 = "Because I'm always getting lots of help from you, Sensei."
20042-330-1 = "Happy New Year, Sensei."
20042-340-1 = "Catch me on Coast of Light when you have time this afternoon!"
20042-350-1 = "Where is that...? Ah, I forgot to mention that it's from a game."
20042-360-1 = "Merry Christmas, Sensei!"
20042-370-1 = "Since it's cold outside, let's stay in and make lots of Christmas wreaths today."
20042-380-1 = "Let's make enough to fully cover the Schale building!"
20042-390-1 = "Yahoo! It's Halloween, Sensei."
20042-400-1 = "It's the day I can freely set my imagination and artistic soul ablaze."
20042-410-1 = "What do you say? Would you like to set your soul ablaze with me?"
20042-430-1 = "U-Ughhh..."
20042-440-1 = "I died at the same spot again..."
20042-450-1 = "Mhm. Using this controller is harder than I expected..."
20042-460-1 = "I'm on the final boss..."
20042-470-1 = "...but I keep making the same mistakes over and over again."
20042-480-1 = "Yeah, but these controls are making it super hard..."
20042-490-1 = "And now my competitive spirit has risen to the challenge."
20042-500-1 = "And because there's no distractions here..."
20042-510-1 = "...I feel like I can really focus on just the game."
20042-520-1 = "Could this be the \"joy\" in camping that everyone always talks about?"
20042-530-1 = "Ah, it's already that late? What do I do...?"
20042-540-1 = "Sensei, this really, truly is"
20042-550-1 = " my last try..."
20042-560-1 = "So please wait just a little longer!"
20042-2600-1 = "I modded this machine gun to make it look cool, but it's too heavy to bring hiking... Maybe I'll have to shave off some weight."
