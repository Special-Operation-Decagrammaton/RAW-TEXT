[translation]
10079-10-1 = "Blue Archive!"
10079-20-1 = "I'm Tokiwadai Middle School second-year Misaka Mikoto. Let me know if you need my help."
10079-30-1 = "So this is Schale's Cafe..."
10079-40-1 = "Wh-What...is this...?!"
10079-50-1 = "There's so much to take in."
10079-60-1 = "Th-This is...kind of cute..."
10079-70-1 = "Oh? Do you need something?"
10079-80-1 = "Sensei, over here. You're pretty late! I've been waiting."
10079-90-1 = "Great work, Sensei. Oh, me? I've been here all along."
10079-100-1 = "Going outside by myself is still a tall order..."
10079-110-1 = "You want me to help out during power outages...? You're kidding, right?"
10079-120-1 = "...I guess I could help if you really need me to."
10079-130-1 = "Sometimes I think this place is just like my Academy City."
10079-140-1 = "Sensei, do you want to get some fresh air?"
10079-150-1 = "So, um... What's with all the talking cats?"
10079-160-1 = "N-No! It's nothing!"
10079-170-1 = "Oh! Sensei, isn't it your birthday today? Happy Birthday! Is there anything special you want?"
10079-180-1 = "Th-Thank you. I didn't think I'd spend my birthday here..."
10079-190-1 = "Ahaha... It's a weird feeling."
10079-200-1 = "Happy New Year, Sensei!"
10079-210-1 = "Say, what do people do for New Year's around here, anyway?"
10079-220-1 = "So, you've got Christmas here too... Do you have any plans today, Sensei?"
10079-230-1 = "It's pretty lively outside. So holidays like this are the same wherever you go..."
10079-250-1 = "Mmmm..."
10079-260-1 = "When I look at it closely, I guess it does look a bit cute..."
10079-270-1 = "So, this is a pig...? Or maybe a hippo?"
10079-280-1 = "...What?! A bird?! You're kidding!"
10079-290-1 = "I-I suppose, but..."
10079-300-1 = "Haha... Well, I guess it's all right."
10079-310-1 = "You know, if I think about it..."
10079-320-1 = "This is a gift from Sensei."
10079-330-1 = "...I'll be sure to treasure it."
10079-340-1 = "Thank you, Sensei."
10079-2600-1 = "To be honest, I guess it's a bit interesting... People don't usually carry something like this around. Thank you for preparing it... I'll make sure to live up to your expectations."
