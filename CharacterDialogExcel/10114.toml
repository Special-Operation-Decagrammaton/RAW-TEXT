[translation]
10114-10-1 = "ブル～ア～カイブ！"
10114-20-1 = "いらっしゃいませ！先生！\nお決まりになりましたらお呼びください！\n愛情を込めて、おもてなしいたします！"
10114-30-1 = "わぁ！素敵な\nカフェですね！\n是非見学させて\nください！"
10114-40-1 = "わあ……\nこの内装素敵……"
10114-50-1 = "（あっ、この\nレシピは……！）"
10114-60-1 = "導線はこう……\nでしょうか。\n勉強になります。"
10114-70-1 = "ウェイトレスなのに、\nカフェで一休み……\nなんだか変な\n感じですね……"
10114-80-1 = "おかえりなさいませ、先生！"
10114-90-1 = "ふふ、気にしないでください。\n先生を待つ時間も、\nすっごく、幸せでしたから。"
10114-100-1 = "いらっしゃいませ！\n「カフェ・シャーレ」\nオープンしました！"
10114-110-1 = "い、今の……どうでしょう？\nちゃんとウェイトレスに\n見えました？"
10114-120-1 = "私、少しだけ……お料理が\nできるようになったんです！"
10114-130-1 = "練習の成果が\n出ているのかもしれません。"
10114-140-1 = "もしかしたら先生の\nおかげもあるのかも……？"
10114-150-1 = "あはは……失敗で終わる\nことのほうが、多いですが。"
10114-160-1 = "誰かに美味しいものを\n食べてもらうことができたら…"
10114-170-1 = "その誰かが、私のお料理を\n好きになってくれたら…"
10114-180-1 = "……そう思うだけで、\n胸がいっぱいになります。"
10114-190-1 = "一番の得意料理は、\nパフェです！"
10114-200-1 = "……唯一の料理、\nとも言えますが"
10114-210-1 = "具材を乗せるだけ、なので……"
10114-220-1 = "アルバイトですか？\nそんなに大変ではないですよ。"
10114-230-1 = "給食部のお仕事に比べたら、\n全然です！"
10114-240-1 = "……これからも、\n努力をし続けていきたいです。"
10114-250-1 = "後悔を残したくは\nありませんから。"
10114-260-1 = "もしも、\nうまくいかなかったときは……"
10114-270-1 = "手を……握ってくださいね、\n先生。"
10114-280-1 = "お誕生日、\nおめでとうございます！"
10114-290-1 = "バースデーパフェを\n作ってみました！"
10114-300-1 = "……たっぷり、\n愛情を込めて作ったんですよ。"
10114-310-1 = "よかったら\n召し上がって下さい！"
10114-320-1 = "誕生日に……\nほしいもの、ですか？\nそうですね……"
10114-330-1 = "先生の一日を、\nいただいても良いですか？"
10114-340-1 = "明けまして\nおめでとうございます、先生！"
10114-350-1 = "今から私と新年のカフェ巡り…\nなんていかがでしょう？"
10114-360-1 = "クリスマスといえば、\n七面鳥ですよね！"
10114-370-1 = "その……ごめんなさい……"
10114-380-1 = "ローストチキンが……\n走って逃げちゃいました……"
10114-390-1 = "かぼちゃと飴と、\n仮装とイタズラの日ですね！"
10114-400-1 = "あの……先生、"
10114-410-1 = "その……今日は"
10114-420-1 = "イタズラしても、\nいいですよ……？"
10114-440-1 = "「カフェ・シャーレ」に\nご来店くださり\nありがとうございます！"
10114-450-1 = "はい、\nご注文のスペシャルパフェです！"
10114-460-1 = "ふふっ……不思議な気分です。"
10114-470-1 = "ここは先生の\nためのカフェで――"
10114-480-1 = "私はそのカフェの……\nたった一人のウェイトレス……。"
10114-490-1 = "先生、ご存知ですか？"
10114-500-1 = "パフェって……「完璧」という\n意味なんだそうです。"
10114-510-1 = "お料理の腕は\nまだ完璧どころか……\nまだまだですけど……"
10114-520-1 = "いつかは……\n私も作れたらなと思います。"
10114-530-1 = "「パフェ」……完璧なお料理を。"
10114-2600-1 = "キヴォトスでは当たり前ですがウェイトレスも、銃を携帯すべきだと思うんです！無茶なオーダーをするお客様の対応や、\n暴れ始めた食材を鎮めるための――\nえ、違うんですか？"
