[translation]
10114-10-1 = "Blue Archive!"
10114-20-1 = "Welcome, Sensei! Please call me when you've picked out something from the menu! I'll do my best to prepare whatever you choose!"
10114-30-1 = "Whoa! What a cool cafe! There are always new things to learn as a waitress..."
10114-40-1 = "The interior is incredible..."
10114-50-1 = "(This recipe, it must be...!)"
10114-60-1 = "Hmm, so it goes like this, and then like that... This is a good reference."
10114-70-1 = "A waitress resting at a cafe, how ironic..."
10114-80-1 = "Whoa! Sensei, Sensei!"
10114-90-1 = "Did I wait long? Not at all! And I enjoyed the wait, even!"
10114-100-1 = "Welcome to Cafe Schale."
10114-110-1 = "H-How was that, Sensei? Did it sound okay?"
10114-120-1 = "Lately, I've, um... I've been learning to cook a little!"
10114-130-1 = "Is it all my hard work and experimentation paying off?"
10114-140-1 = "Or is it thanks to Sensei?"
10114-150-1 = "I still fail more than I succeed, though..."
10114-160-1 = "...but if I can get someone to taste something delicious..."
10114-170-1 = "...if they enjoy my dish..."
10114-180-1 = "Just thinking about that makes my heart skip a beat."
10114-190-1 = "My signature dish, for now, is parfait!"
10114-200-1 = "...Technically, it's my only dish, but still."
10114-210-1 = "Since it's a dessert, the important thing is to stack the ingredients nicely..."
10114-220-1 = "A lot of people ask me if working part time is hard..."
10114-230-1 = "It's fine compared to School Lunch Club!"
10114-240-1 = "I always try to give it my best effort, without giving up."
10114-250-1 = "That way...I won't have any regrets."
10114-260-1 = "But if things don't work out..."
10114-270-1 = "...if that happens, please hold my hand. Sensei."
10114-280-1 = "Oh, my goodness! It's your birthday, Sensei!"
10114-290-1 = "I tried making your birthday parfait!"
10114-300-1 = "...I did my best with it."
10114-310-1 = "Please try it, if you don't mind!"
10114-320-1 = "What do I want for my birthday? Well, since you ask..."
10114-330-1 = "Would you stay with me? Even if it's just for today...?"
10114-340-1 = "Happy New Year, Sensei!"
10114-350-1 = "How about a New Year's cafe tour with Waitress Juri?"
10114-360-1 = "For Christmas, you've got to have chicken or turkey!"
10114-370-1 = "...I'm sorry, Sensei."
10114-380-1 = "The chicken ran away..."
10114-390-1 = "It's a day for pumpkins, costumes, and candy!"
10114-400-1 = "Um... Sensei?"
10114-410-1 = "Just for today..."
10114-420-1 = "You can pull tricks, you know..."
10114-440-1 = "Welcome to Cafe \"Schale\"!"
10114-450-1 = "Yes, here's the special parfait you ordered!"
10114-460-1 = "Fufu... This is an interesting feeling..."
10114-470-1 = "This is a cafe just for you, Sensei."
10114-480-1 = "And I'm the only waitress here..."
10114-490-1 = "Sensei, did you know?"
10114-500-1 = "Parfait...means \"perfect\"."
10114-510-1 = "I'm not perfect. I'm not even proficient."
10114-520-1 = "But one day...I want to make..."
10114-530-1 = "...the perfect parfait."
10114-2600-1 = "If you think about it, a waitress does need a gun. I mean, it's only natural in Kivotos. Besides that, you sometimes get unreasonable customers, or the ingredients start acting up..."
