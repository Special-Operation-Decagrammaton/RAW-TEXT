[translation]
10035-10-1 = "Blue...Archive."
10035-20-1 = "Wh-What?! Oh... It's you, Sensei. I thought you were an outsider."
10035-30-1 = "Wh-What is this place?"
10035-40-1 = "I-I can feel someone looking at me... Ugh..."
10035-50-1 = "It's better than being outside, though."
10035-60-1 = "Huh? What's that...?"
10035-70-1 = "P-Please don't talk to me...unless you're Sensei."
10035-80-1 = "Th-Thank you for your hard work, Sensei... Well, frankly, there are some children I'd like to recommend to you..."
10035-90-1 = "Oh, S-Sensei? When did you get here?"
10035-100-1 = "N-No, I wasn't up to anything in particular."
10035-110-1 = "I was just reading a book!"
10035-120-1 = "I usually feel anxious unless I'm in the old library."
10035-130-1 = "This place is somehow different. Maybe it's your presence."
10035-140-1 = "Oh, um... No. It's nothing..."
10035-150-1 = "You always seem busy, Sensei."
10035-160-1 = "I-Is there anything I can do to help?"
10035-170-1 = "I-If there's something I can do, please let me know!"
10035-180-1 = "There are lots of books here too..."
10035-190-1 = "Ah, some of them are forbidden? I-I'm sorry."
10035-200-1 = "H-Happy birthday, Sensei!"
10035-210-1 = "How about taking a day off? Maybe we can read together. If you'd like..."
10035-220-1 = "T-Today is my birthday, Sensei."
10035-230-1 = "If it's okay..."
10035-240-1 = "...could I...sit next to you?"
10035-250-1 = "Do you think I can change for the better this year?"
10035-260-1 = "Maybe I could...with your help."
10035-270-1 = "Ugh. What a noisy day."
10035-280-1 = "I don't like loud noises..."
10035-290-1 = "I like to read in front of a heater on a day like this."
10035-300-1 = "The security system must be enhanced!"
10035-310-1 = "Today, a lot of rude people from the outside will show up!"
10035-320-1 = "They'll barge in making a fuss about candy or whatever..."
10035-330-1 = "Seriously!"
10035-350-1 = "Th-Thank you, Sensei. I, um...appreciate it."
10035-360-1 = "Oh, this? I was in the middle of deciphering these texts."
10035-370-1 = "This old library... It's home to several books written in ancient languages."
10035-380-1 = "Each of these precious children has stories to tell. They've been waiting to share them with the world."
10035-390-1 = "So I want to help them tell their stories."
10035-400-1 = "Sorry. You must find this to be droll, right?"
10035-410-1 = "...! U-Um, I...guess. I-I'm not used to compliments..."
10035-420-1 = "I don't know what to say... The words completely escape me... Heh."
10035-2600-1 = "I-I honestly don't get why you would care about someone like me. But I-I'll...try my best. I swear it."
