[translation]
10123-10-1 = "蔚藍檔案！"
10123-20-1 = "老師，讓你久等了嗎？\n呵呵，不對。真正在等待的人，是我才對。"
10123-30-1 = "是個比想像中\n更加雅致的場所呢。"
10123-40-1 = "原來如此……\n這裡，是這種氛圍嗎。"
10123-50-1 = "哎呀，那位是……"
10123-60-1 = "呵呵，試著搭話看看吧？"
10123-70-1 = "感覺到了視線……\n是服裝造成的嗎？"
10123-80-1 = "我正在等你，老師。"
10123-90-1 = "……沒錯，就是用這副打扮。"
10123-100-1 = "歡迎你來，老師。"
10123-110-1 = "期待今天也是\n「愉快」的一天哦。"
10123-120-1 = "那麼熱切地盯著我看……"
10123-130-1 = "有什麼地方讓你在意的嗎？"
10123-140-1 = "啊啊，太陽眼鏡是嗎？\n呵呵……"
10123-150-1 = "這是不會拿下來的哦。"
10123-160-1 = "因為它已經是時尚的一部分了。"
10123-170-1 = "看來，老師似乎也對\n太陽眼鏡很感興趣呢。"
10123-180-1 = "有在販售的商店，\n要為你介紹一下嗎？"
10123-190-1 = "明明是這種天氣，\n還要窩在房裡嗎？"
10123-200-1 = "涼鞋？沒錯，\n不覺得很可愛嗎？"
10123-210-1 = "要靠近點看嗎？"
10123-220-1 = "我認為這種日子，"
10123-230-1 = "應該有更適合的\n打扮才對……"
10123-240-1 = "問我有什麼關係？"
10123-250-1 = "這個嘛……呵呵。"
10123-260-1 = "明明是我的生日，"
10123-270-1 = "為何是我要過來呢？"
10123-280-1 = "工作結束之後……"
10123-290-1 = "要請你過來我的房間唷？"
10123-300-1 = "新年快樂，老師。"
10123-310-1 = "……"
10123-320-1 = "普通的問候"
10123-330-1 = "讓你嚇到了嗎？"
10123-340-1 = "這並不是適合聖誕節"
10123-350-1 = "的服裝呢。"
10123-360-1 = "下次……"
10123-370-1 = "好好準備一下吧。"
10123-380-1 = "今天是熱鬧的一天呢。\n我還挺喜歡的。"
10123-400-1 = "來到這裡之後，\n連風也變舒適了呢。"
10123-410-1 = "又沒有其他車子……\n感覺真好。"
10123-420-1 = "覺得這趟兜風怎麼樣？\n嚇到你了嗎？"
10123-430-1 = "畢竟是個突然的邀請，"
10123-440-1 = "你想必也沒預料到吧？"
10123-450-1 = "看見那個表情……"
10123-460-1 = "我覺得有邀請你\n真是太好了。"
10123-470-1 = "其實並沒有\n什麼特別的理由。"
10123-480-1 = "只是想嘗試一次而已。"
10123-490-1 = "這種行為，\n該怎麼形容來著……？"
10123-500-1 = "……綁架？"
10123-510-1 = "呵呵……開玩笑的。"
10123-520-1 = "不過至少現在……我想想。"
10123-530-1 = "在把老師送回家之前，\n就當作不是玩笑吧。"
10123-2600-1 = "本來一度好奇是否會被阻止，\n結果你居然選擇這麼做啊。\n好吧。如果老師如此期望的話……\n就讓我陪伴你到最後一刻吧。"
