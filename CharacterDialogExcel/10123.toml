[translation]
10123-10-1 = "Blue Archive!"
10123-20-1 = "รอฉันอยู่เหรอคะ คุณครู?\nฮุฮุ ไม่หรอกค่ะ ฉันต่างหากล่ะคะที่เป็นฝ่ายรอ"
10123-30-1 = "เป็นที่ที่เล็กกว่าที่คิดนะคะ"
10123-40-1 = "อืม... ที่นี่\nเป็นแบบนี้เองสินะคะ?"
10123-50-1 = "เอ๋? คนนั้นคือ..."
10123-60-1 = "ฮุฮุ เข้าไปหา\nแล้วชวนคุยดีมั้ยคะ?"
10123-70-1 = "เหมือนมีใครมองมาเลย...\nเป็นเพราะชุดหรือเปล่าคะ?"
10123-80-1 = "ฉันกำลังรออยู่เลยค่ะ คุณครู"
10123-90-1 = "ค่ะ... รอในชุดนี้ค่ะ"
10123-100-1 = "เชิญค่ะ คุณครู"
10123-110-1 = "ฉันหวังว่าวันนี้ก็\nจะเป็นวันที่ 'สนุก' ค่ะ"
10123-120-1 = "จ้องอะไรกัน"
10123-130-1 = "ขนาดนั้นเลยคะ?"
10123-140-1 = "อ๊ะ แว่นกันแดดเหรอคะ? ฮุฮุ..."
10123-150-1 = "ขาดไม่ได้หรอกค่ะ"
10123-160-1 = "ตอนนี้มันเป็นส่วนหนึ่งของแฟชั่นค่ะ"
10123-170-1 = "ดูจะถูกใจนะคะ"
10123-180-1 = "ฉันแนะนำร้านให้มั้ยคะ?"
10123-190-1 = "ในวันแบบนี้\nจะทำแต่งานเหรอคะ?"
10123-200-1 = "รองเท้าแตะ?\nอ้อ น่ารักใช่มั้ยคะ?"
10123-210-1 = "อยากดูใกล้ๆ\nกว่านี้อีกหน่อย\nมั้ยล่ะคะ?"
10123-220-1 = "ในวันแบบนี้น่ะ "
10123-230-1 = "ฉันก็ต้องใส่ชุด\nที่เข้ากับวันแบบนี้สิคะ"
10123-240-1 = "เกี่ยวอะไรกันน่ะเหรอคะ?"
10123-250-1 = "ก็มัน... ฮุฮุฮุ"
10123-260-1 = "วันเกิดฉันแท้ๆ"
10123-270-1 = "แต่ทำไมฉันต้อง\nเป็นฝ่ายมาหาก็ไม่รู้นะคะ"
10123-280-1 = "ถ้าเสร็จงานแล้ว... "
10123-290-1 = "ไปห้องฉันกันมั้ยคะ?"
10123-300-1 = "สวัสดีปีใหม่ค่ะ\nคุณครู"
10123-310-1 = "..."
10123-320-1 = "ฉันทักทายแบบธรรมดาทั่วไป"
10123-330-1 = "ก็เลยตกใจเลยเหรอคะ?"
10123-340-1 = "นี่มันไม่ใช่ชุดที่\nเหมาะกับคริสต์มาส"
10123-350-1 = "เลยนะคะ"
10123-360-1 = "ไว้คราวหน้า... "
10123-370-1 = "ต้องเตรียมตัวใหม่แล้วค่ะ"
10123-380-1 = "เป็นวันแห่งความวุ่นวายเลยนะคะ\nฉันชอบค่ะ"
10123-400-1 = "พอมาถึงที่นี่\nลมก็พัดเย็นขึ้นนะคะ"
10123-410-1 = "รถคันอื่นก็ไม่มี...\nดีจังเลยค่ะ"
10123-420-1 = "นั่งรถเล่นเป็นยังไงบ้างคะ?\nตกใจมากหรือเปล่าคะ?"
10123-430-1 = "คงรู้สึกทั้งกะทันหัน"
10123-440-1 = "และเกินคาดด้วยสินะคะ"
10123-450-1 = "ดูจากสีหน้าแล้ว..."
10123-460-1 = "ฉันว่าฉันทำได้ดีเลยค่ะ\nที่มาที่นี่"
10123-470-1 = "ที่จริงฉันไม่มีเหตุผล\nอะไรพิเศษหรอกค่ะ"
10123-480-1 = "ก็แค่อยากลองทำ\nดูสักครั้งน่ะค่ะ"
10123-490-1 = "การทำแบบนี้\nเรียกว่าอะไรเหรอคะ...?"
10123-500-1 = "ลักพาตัวหรือเปล่านะ...?"
10123-510-1 = "ฮุฮุ...\nล้อเล่นค่ะ"
10123-520-1 = "แต่ถึงยังไงตอนนี้...\nใช่ค่ะ"
10123-530-1 = "จนกว่าฉันจะยอม\nปล่อยคุณครูกลับบ้าน\nคิดว่ามันไม่ใช่เรื่องล้อเล่นแล้วกันค่ะ"
10123-2600-1 = "คิดว่าจะห้ามกันเสียอีก\nสุดท้ายก็เอาอย่างนี้สินะคะ\nก็ดีค่ะ ถ้าคุณครูต้องการ\nก็ไปด้วยกันให้สุดเลยค่ะ"
