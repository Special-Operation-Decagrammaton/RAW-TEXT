[translation]
20019-10-1 = "Blue Archive"
20019-20-1 = "I'm Akane, Master's maid... Or, I suppose I'm Master's pet bunny now!"
20019-30-1 = "Everything is neatly organized. Cleaning...is important."
20019-40-1 = "Welcome. I assume your order is...black tea? Heehee."
20019-50-1 = "Master, you need to know... You are a special person."
20019-60-1 = "Is there anything else that needs taking care of?"
20019-70-1 = "Can I commit to the way of the bunny as I hop alongside Master...?"
20019-80-1 = "I've been waiting for you, Master."
20019-90-1 = "Akane is a loyal bunny to Master and Master alone."
20019-100-1 = "Boing, boing!"
20019-110-1 = "Are you back, Master? Everything is set and ready."
20019-120-1 = "I am nothing if not an industrious little rabbit."
20019-130-1 = "Is it fun being...a rabbit? Heehee. I guess..."
20019-140-1 = "Does it look fun?"
20019-150-1 = "If there's anything you need, never hesitate to ask. Don't leave me waiting."
20019-160-1 = "The time I've spent with you is irreplaceable."
20019-170-1 = "There is no better cleaning equipment than a bomb."
20019-180-1 = "Kidding, kidding... Please don't stare at me like that, Master."
20019-190-1 = "I believe that a bunny is the perfect form for an operative."
20019-200-1 = "And an even more perfect form for a maid."
20019-210-1 = "Happy birthday, Master!"
20019-220-1 = "Starting today, you can expect special bunny bonuses!"
20019-230-1 = "What is a special bunny bonus?"
20019-240-1 = "Hahaha, I wonder..."
20019-250-1 = "Don't worry. Bunnies are too cute to be scary. Especially this one..."
20019-260-1 = "My birthday? You remembered?"
20019-270-1 = "Thank you, Master. I'm jumping with joy!"
20019-280-1 = "Happy New Year, Master!"
20019-290-1 = "It's already a new year! I wish only the best for you, Master."
20019-300-1 = "It's Christmas, Master!"
20019-310-1 = "Every day is special with you, Master, but today feels particularly special."
20019-320-1 = "Could you stay and comfort a cold bunny?"
20019-330-1 = "Oh, it's Halloween. I guess my outfit will blend right in."
20019-340-1 = "Trick-or-treat? I'm more of a trick-and-treat person."
20019-360-1 = "I'm sorry. My thoughts aren't very maid-like."
20019-370-1 = "I was losing confidence in myself."
20019-380-1 = "Master, you have so much riding on you...but you're always smiling."
20019-390-1 = "But me... I couldn't even... I couldn't take that weight off your shoulders..."
20019-400-1 = "But what you said... I think that's enough to make me feel confident again."
20019-410-1 = "I'll always do my best in serving you, even if I stumble along the way. Master."
20019-2600-1 = "This will help me to become an even better bunny."
