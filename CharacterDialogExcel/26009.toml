[translation]
26009-10-1 = "ブルー……アーカイブ……"
26009-20-1 = "花岡ユズ……です。\n色々あって……今はこの格好をしています。\nよろしく、お願いします……"
26009-30-1 = "今のわたしは\nメイドだし……掃除でも\nしてみようかな……。"
26009-40-1 = "ゲームを\n作るメイド……\n新しいかも？"
26009-50-1 = "うう……どこかに\n隠れたい……。"
26009-60-1 = "段ボールは、 潜入の\n必須アイテムだけど\n……。"
26009-70-1 = "おかえりなさい、\nご主人様。\nうう、やっぱり\n恥ずかしい……。"
26009-80-1 = "ひゃっ！？だ、誰！？"
26009-90-1 = "あ、先生でしたか、\nよかった……おかえりなさい。"
26009-100-1 = "先生、お待ちしてました……"
26009-110-1 = "いらっしゃってくれて\n嬉しいです。"
26009-120-1 = "掃除はあまり\n得意ではないですが……"
26009-130-1 = "先生の、お願いなら……"
26009-140-1 = "え、似合ってる？"
26009-150-1 = "もう……\nからかわないでください！"
26009-160-1 = "……ほ、本音と言われたら、\nそれはそれで……。"
26009-170-1 = "どうして猫耳は\nこんなにメイド服に合うのかな？"
26009-180-1 = "猫ってメイドっていうより\nご主人様側な気がするのに……"
26009-190-1 = "これは……\nゲームの参考になるかも。"
26009-200-1 = "この服、フリルが多くて……\n恥ずかしい……"
26009-210-1 = "お、お誕生日\nおめでとうございます、\nご主人様。"
26009-220-1 = "な、なんちゃって……\nメイドなので。"
26009-230-1 = "誕生日、\n覚えててくださったんですか？\nありがとうございます。"
26009-240-1 = "その……\n特に何もしなくて、大丈夫です。"
26009-250-1 = "先生……いえ、\nご主人様と一緒にいるのが\n一番の幸せですから。"
26009-260-1 = "と、とりあえず\nそんな設定です！"
26009-270-1 = "明けまして\nおめでとうございます、\nご主人様。"
26009-280-1 = "……や、やっぱり先生と\nお呼びした方がいいでしょうか？"
26009-290-1 = "サンタさんは煙突を\n通って来るらしいです……"
26009-300-1 = "ゲーム開発部に\n煙突はありませんが……"
26009-310-1 = "機会があれば\n一度入ってみたいです。"
26009-320-1 = "こじんまりしてて、\n居心地よさそう……"
26009-330-1 = "ハロウィーン……"
26009-340-1 = "仮装した人が\n街に溢れるお祭りですね。"
26009-350-1 = "わたしには、\nやっぱり無縁といいますか……"
26009-360-1 = "ゲームのイベントなら……\nよくやりますけど。"
26009-380-1 = "えっと、これは……"
26009-390-1 = "寝ている間に、\n入ってきちゃったみたいで……"
26009-400-1 = "その……休憩室には\n他の方もいますから……"
26009-410-1 = "座っていると、\n話しかけられちゃって……。"
26009-420-1 = "「リボンはどこで買ったの？」\nとか、"
26009-430-1 = "「お休みの日には何してるの？」\nとか……"
26009-440-1 = "いろいろ質問されるので、\n思わず逃げてしまって……"
26009-450-1 = "見つけたのが、\nここだったんです……。"
26009-460-1 = "まさか……\n猫の休憩所だったなんて。"
26009-470-1 = "ひゃっ！？\nちょ、ちょっと待ってください！"
26009-480-1 = "出ます！\nい、今出ますから……\nくすぐったい！"
26009-2600-1 = "こ、ここまでして\nもらえるなんて……そんな……\nすごく、嬉しいです。\n……わたし、もっと頑張りますね。\n……見ていてください、先生！"
