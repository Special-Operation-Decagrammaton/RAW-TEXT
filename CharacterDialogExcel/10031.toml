[translation]
10031-10-1 = "Bluuue Archive"
10031-20-1 = "Heehee. Can I still prove useful to you this year? There's no other choice. Stay by my side and watch what I accomplish this year."
10031-30-1 = "Whew. Business is really going to pick up in the new year."
10031-40-1 = "It's important I keep my composure as a leader."
10031-50-1 = "Are bosses usually expected to give their employees cash gifts for New Year's?!"
10031-60-1 = "I'm nervous because it's an expensive kimono... If I'm not careful..."
10031-70-1 = "So tired... Hmm? Where did my employees go?"
10031-80-1 = "Welcome back, Sensei. Let's get started on today's schedule."
10031-90-1 = "I've been waiting. Now, I'll be escorting you, Sensei."
10031-100-1 = "Sensei, you've made an excellent choice continuing your contract with us this year. ♪"
10031-110-1 = "Are you asking if it's hard to tie my hair back this high?"
10031-120-1 = "Not really. To be honest, my wallet's the one having a hard time..."
10031-130-1 = "Huh? I-It's nothing...!"
10031-140-1 = "This kimono is pretty, don't you think? Isn't it beautiful?"
10031-150-1 = "I'm prettier...?"
10031-160-1 = "S-Stop your lip service!"
10031-170-1 = "Heeheehee. Don't underestimate the preparedness of Problem Solver."
10031-180-1 = "Huh? Wh-What do I mean?"
10031-190-1 = "Uh, I mean...h-happy birthday!"
10031-200-1 = "Heehee. Today is a special day, Sensei."
10031-210-1 = "Huh? You already knew?"
10031-220-1 = "Oh. Th-Thank you..."
10031-230-1 = "Happy New Year, Sensei."
10031-240-1 = "This year will be even more special than last year. Heehee."
10031-250-1 = "Merry Christmas! Why am I so excited?"
10031-260-1 = "Well, it's almost a new year!"
10031-270-1 = "...Trick or treat?"
10031-280-1 = "Sit down, Sensei."
10031-290-1 = "Let me tell you why New Year's Day is better than Halloween."
10031-310-1 = "Heehee. You're so slow, Sensei. Huh? I walk too fast? Don't be silly."
10031-320-1 = "Well, it's just that I always try to be punctual. I am a boss after all."
10031-330-1 = "The early bird catches the worm."
10031-340-1 = "As for this year, Problem Solver is going to work harder than ever."
10031-350-1 = "Of course, that includes you as well, Sensei."
10031-360-1 = "You're our business partner, after all. We wouldn't leave you out of our business plans."
10031-370-1 = "Here's to our relationship. I hope we'll be together for a long time."
10031-380-1 = "O-Our business relationship, I mean! Strictly professional!"
10031-390-1 = "(Wh-What am I saying right now?! Me and my big mouth!)"
10031-2600-1 = "This is what you call turning it up to 11...right?"
