[translation]
10119-10-1 = "ブルーアーカイブ。"
10119-20-1 = "百鬼夜行連合学院、\n百花繚乱紛争調停委員会――御稜ナグサ。\nこの力は、みんなを守るためにある。"
10119-30-1 = "アヤメだったら……\nどう過ごしてたかな。"
10119-40-1 = "ここにいても\nいいのかな……。"
10119-50-1 = "（これは……\n焼鳥……？）"
10119-60-1 = "ちょっと暑いけど……\nきっとみんなに\nとっては過ごし\nやすいんだろうな。"
10119-70-1 = "少しくらくらする……\n休もうかな。"
10119-80-1 = "ああ、おかえりなさい先生。"
10119-90-1 = "今日は、\n何をすればいいのか教えて。"
10119-100-1 = "あっ、先生……\nおかえりなさい。"
10119-110-1 = "帰ってきてくれて、よかった。"
10119-120-1 = "その……不安で。"
10119-130-1 = "みんな、\n離れてしまうんじゃって。"
10119-140-1 = "消えてしまうんじゃ\nないかって……。"
10119-150-1 = "あまり……一人にしないで。"
10119-160-1 = "ごめんなさい。"
10119-170-1 = "シャーレの仕事は……\n少し新鮮。"
10119-180-1 = "百花繚乱でも\n事務仕事はしてたけど……"
10119-190-1 = "シャーレほど本格的な\nものじゃなかったから。"
10119-200-1 = "あの……シャーレ当番の日に"
10119-210-1 = "よく焼鳥を焼いてる\n気がするのは……気のせい？"
10119-220-1 = "好き……だけど"
10119-230-1 = "ここで焼くのは\nやめた方がいいと思う。"
10119-240-1 = "……どうかしたの？"
10119-250-1 = "白い肌に見惚れてた……？"
10119-260-1 = "そう……よく飽きないね。"
10119-270-1 = "固い氷って……"
10119-280-1 = "ゆっくり時間をかけて\n凍らせるんだって。"
10119-290-1 = "なんだか……鉄を焼くのと\n似ている気がする。"
10119-300-1 = "……孤独が募ると、\n頑なになっていく\nものなのかもしれないね。"
10119-310-1 = "「百花繚乱\n紛争調停委員会」は、"
10119-320-1 = "その名の通り紛争を調停する\nために存在しているの。"
10119-330-1 = "本当は……"
10119-340-1 = "この銃を抜く前に\n終わるといいんだけど。"
10119-350-1 = "変なの。"
10119-360-1 = "そばにいるだけで、こんなにも\n幸せな気持ちになる。"
10119-370-1 = "私にとっても、\n自分の事のように\n特別に思うんだ。"
10119-380-1 = "……お誕生日、おめでとう。"
10119-390-1 = "……覚えていてくれたんだ。\nありがとう。"
10119-400-1 = "今まで、あまり気にした\nことはなかったけど……。"
10119-410-1 = "これからは……特別な日だと、\n思えるかも。"
10119-420-1 = "明けましておめでとう。"
10119-430-1 = "今年は……もう少しだけ、\n頼ろうと思う。いいかな……？"
10119-440-1 = "私は冬が好き。"
10119-450-1 = "全部が白にとけて、\n気にならなくなるから。"
10119-460-1 = "だから、この季節の――"
10119-470-1 = "真冬のお祭りが大好きなんだ。"
10119-480-1 = "……ハロウィーンのことを、\n考えていたの。"
10119-490-1 = "私、いつもなりたい自分を\n演じているから……"
10119-500-1 = "ずっとコスプレをしている\nことになるのかな。"
10119-510-1 = "ふふ。"
10119-520-1 = "今日という日は私のために\nあるのかもしれない。"
10119-540-1 = "夜が明けるこの瞬間が――\nもっとも闇が深くなる。"
10119-550-1 = "私は……\nこの漆黒が恐ろしかった。"
10119-560-1 = "闇夜を照らすほど\n眩しく輝くことも――"
10119-570-1 = "夜が明けるまで\n耐え忍ぶことも、\n私にはできなかったから。"
10119-580-1 = "他人を演じることで――\n影に紛れて平静を\n装うことしか、\nできなかったの。"
10119-590-1 = "でも――今は違う。"
10119-600-1 = "明けない夜はないと――\n私の影が落ちると、\n知ったから。"
10119-610-1 = "だから――"
10119-620-1 = "黄昏に名乗りをあげよう――"
10119-630-1 = "――私は百花繚乱\n紛争調停委員会の委員長、"
10119-640-1 = "御稜ナグサ！"
10119-2600-1 = "…この銃は、資格がなければ持つことができないもの。そう――これを御稜ナグサが持つ、意味。先生なら、分かっていると思う。それでも……任せてくれるのなら……信じてくれるのなら。私も、全力で足掻いてみるよ。"
