[translation]
16017-10-1 = "B-Blue Archive... W-Was that right...?"
16017-20-1 = "H-Highlander Railroad Academy... U-Utsumi Aoba..."
16017-30-1 = "E-Everyone seems happy... I wonder why..."
16017-40-1 = "It's spacious and nice... I wish our night duty room was like this..."
16017-50-1 = "I-Is it okay for someone as unworthy as me to be here...?"
16017-60-1 = "(I feel like I reek of oil... It's bothering me...)"
16017-70-1 = "Calm down, and take a deep breath... *inhale* *exhale*"
16017-80-1 = "W-Welcome...Sensei..."
16017-90-1 = "I-I was looking around to see if there was anything I could do..."
16017-100-1 = "The Schale Office...smells nice..."
16017-110-1 = "Ah, huh... I-I was speaking too loudly, wasn't I?"
16017-120-1 = "Please call me if there's anything you need at all..."
16017-130-1 = "I-Is there anything I can repair...?"
16017-140-1 = "That's the only thing I'm confident about..."
16017-150-1 = "Um... The snacks in the lounge..."
16017-160-1 = "...can I eat them? I saw r-rice crackers..."
16017-170-1 = "W-We don't have those at Highlander..."
16017-180-1 = "Heehee... Thank you for the snack."
16017-190-1 = "I...don't know much about important p-paperwork..."
16017-200-1 = "...but at the very least, I can do basic calculations..."
16017-210-1 = "I..."
16017-220-1 = "...brought some cup ramen from the night duty room..."
16017-230-1 = "W-Would you like to have some with me, Sensei...?"
16017-240-1 = "Um... I heard that today's your birthday..."
16017-250-1 = "I wanted to get you something, so..."
16017-260-1 = "...a m-monkey spanner! For you..."
16017-270-1 = "I wish you a truly happy birthday...!"
16017-280-1 = "What?! M-Me?"
16017-290-1 = "It is...my birthday, but...!"
16017-300-1 = "U-Uhh..."
16017-310-1 = "Honestly... I'd be lying if I said I hadn't been looking forward to it..."
16017-320-1 = "...Thank you... I'm truly...happy."
16017-330-1 = "Here's to another good year..."
16017-340-1 = "Maybe I can look forward to this one..."
16017-350-1 = "A Christmas...gift..."
16017-360-1 = "N-No... That doesn't suit me..."
16017-370-1 = "I don't want to feel disappointed..."
16017-380-1 = "...so let's not think about it..."
16017-390-1 = "Wh-When it comes to costumes, I think..."
16017-400-1 = "...they're more fitting for other people..."
16017-420-1 = "D-Don't come in here... Ugh...!"
16017-430-1 = "M-My...clothes..."
16017-440-1 = "...they reek of o-oil... Not... Not good at all..."
16017-450-1 = "I-I'm just going to take these off... So, please...wait right there...!"
16017-460-1 = "Huh? What...do you mean...?"
16017-470-1 = "...Uh... So..."
16017-480-1 = "...Aah?! W-Well!!!"
16017-490-1 = "W-Waahh!!!"
16017-2600-1 = "I-If there are people bothering me...I can sh-shoot them with this, right...?"
