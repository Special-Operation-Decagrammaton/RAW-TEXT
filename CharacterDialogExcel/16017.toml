[translation]
16017-10-1 = "蔚，蔚藍檔案……這樣就行了嗎……？"
16017-20-1 = "我，我是高地人鐵道學園……\n內，內海青葉……\n不多指教，也沒關係的……"
16017-30-1 = "大，大家都帶著笑容……\n人生，快快樂樂的\n真不錯呢……"
16017-40-1 = "這裡……真寬廣呢……\n要是我們的值班室\n也能有這樣的空間……"
16017-50-1 = "我，我可以\n待在這裡嗎……？"
16017-60-1 = "（總覺得好像染上了\n油臭味……真是糟透了）"
16017-70-1 = "冷靜下來深呼吸……\n嘶，呼……"
16017-80-1 = "歡，歡迎回來，的說。\n老師。"
16017-90-1 = "有，有什麼工作嗎？"
16017-100-1 = "這間辦公室……\n感覺有股能讓人\n放鬆的味道……"
16017-110-1 = "啊，哈……！\n我，我只是在自言\n自語而已……！？"
16017-120-1 = "如果有能幫忙的事，\n請一定要跟我說……"
16017-130-1 = "有，有什麼希望\n我維修的東西嗎……？"
16017-140-1 = "修理的話，\n我是可以幫忙……"
16017-150-1 = "那個……\n請問放在茶水間的點心……"
16017-160-1 = "我，我可以吃嗎……？"
16017-170-1 = "在高地人是吃不到\n這，這種點心的……"
16017-180-1 = "嘿嘿……我要開動了！"
16017-190-1 = "那個……雖然文書之類的，\n我有點……但是……"
16017-200-1 = "只是簡單計算的話，\n應該……還能應付……"
16017-210-1 = "那，那個……"
16017-220-1 = "我從值班室帶了\n泡麵過來……"
16017-230-1 = "老，老師要一起……\n吃嗎……？"
16017-240-1 = "那個……今天，\n聽說是您的生日……"
16017-250-1 = "能，能送給您的\n就只有這個了……\n那個……"
16017-260-1 = "板手，請您收下！"
16017-270-1 = "祝您生日快樂……！"
16017-280-1 = "什麼！？\n咦！那個！"
16017-290-1 = "雖然是我的生日……\n沒錯……！"
16017-300-1 = "唔，唔唔……"
16017-310-1 = "要，要說沒有期待\n是騙人的，可是！"
16017-320-1 = "謝謝您……\n我真的……非常開心。"
16017-330-1 = "希望今年會是美好的一年……"
16017-340-1 = "只有一點點的話，\n期待一下也沒關係吧。"
16017-350-1 = "聖誕節……禮物……"
16017-360-1 = "不……那實在\n奢望過頭了……"
16017-370-1 = "抱有期待的話，\n之後只會失望而已……"
16017-380-1 = "還是別多想了吧……"
16017-390-1 = "變，變裝有點……\n不太……"
16017-400-1 = "那種事情，\n我覺得讓適合的人\n去做才對……"
16017-420-1 = "請，請不要過來這邊……\n的說……！"
16017-430-1 = "衣，衣服上……！"
16017-440-1 = "沾到了油的味道……\n不，不太好聞……"
16017-450-1 = "我，我馬上脫掉……\n請，請在那邊……\n稍等一下……！"
16017-460-1 = "咦？那是……\n什麼意思……？"
16017-470-1 = "啊……唔……"
16017-480-1 = "……啊啊啊！？\n那，那個！！"
16017-490-1 = "嗚，嗚哇啊啊啊啊！！"
16017-2600-1 = "如，如果有礙眼的人……\n只，只要用這個\n射穿他就行了吧……？"
