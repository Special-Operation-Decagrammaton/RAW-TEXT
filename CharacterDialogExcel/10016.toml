[translation]
10016-10-1 = "Blue Archive."
10016-20-1 = "I'm the best player around! I'll help you out."
10016-30-1 = "Hmm... This game is actually kinda fun."
10016-40-1 = "I hear this game's getting a sequel. That's it, I'm getting a part-time job."
10016-50-1 = "When I'm all grown up...I might grow out my hair."
10016-60-1 = "C'mon... C'mon... The claw picked it up!"
10016-70-1 = "All right, now I just need to... Clear!"
10016-80-1 = "Welcome, Sensei. Let's be sure to work hard today as well."
10016-90-1 = "I'm going to work hard so today is special for both of us."
10016-100-1 = "I'm worried about the Game Development Department."
10016-110-1 = "I know I'll be okay as long as I'm with you..."
10016-120-1 = "You played our game too, right? Which part was your favorite?"
10016-130-1 = "I want to draw even more beautiful things... But I need to practice."
10016-140-1 = "Can you help me?"
10016-150-1 = "I don't want my art to just be about moe, I want it to convey \"love\" too."
10016-160-1 = "Hmm... It's a tight budget again this month."
10016-170-1 = "Do we get paid if we're on the roster?"
10016-180-1 = "I want to wish you a happy birthday, Sensei!"
10016-190-1 = "I don't know what you like, so..."
10016-200-1 = "Do you wanna come pick something out with me?"
10016-210-1 = "I think birthdays should always be spent with family."
10016-220-1 = "So I've got to hang out with Momoi today. Wanna come with, Sensei?"
10016-230-1 = "Happy New Year! I'll be counting on you this year as well."
10016-240-1 = "Merry Christmas! Today's a day made for couples."
10016-250-1 = "...I-Is something I heard once!"
10016-260-1 = "I'm not usually a big Halloween fan, but maybe with you, and everyone else, this year..."
10016-270-1 = "I think it'll be fun. I'm excited!"
10016-290-1 = "I've never taken an interest in anything other than retro games before..."
10016-300-1 = "I guess the arcade has lots of different kinds of games."
10016-310-1 = "I feel like I'm broadening my horizons. This was a good learning opportunity."
10016-320-1 = "Thank you, Sensei. For bringing me here..."
10016-330-1 = "I'm having so much fun thanks to you."
10016-340-1 = "Oh, right..."
10016-350-1 = "Can you keep what happened today a secret from my sister?"
10016-360-1 = "Seriously, you can't tell her!"
10016-2600-1 = "I don't know if this is the right way to describe a weapon, but it's beautiful. I'm happy."
