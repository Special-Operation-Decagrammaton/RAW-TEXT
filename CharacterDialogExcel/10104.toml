[translation]
10104-10-1 = "ブルーアーカイブ、ですね。"
10104-20-1 = "山海経高級中学校、玄武商会本店のマネージャー兼、\n護衛の鹿山レイジョです。\n改めまして、よろしくお願いします。先生。"
10104-30-1 = "ここの物流管理は、\nどうなっている\nのでしょう?"
10104-40-1 = "玄武商会との相違点\n勉強になります。"
10104-50-1 = "市場調査と\nいきましょう。"
10104-60-1 = "（ここで玄武商会の\n販路を広げるには…）"
10104-70-1 = "ストレッチできる\n場所を、確保\nしたいのですが…"
10104-80-1 = "ご要望がありましたら、\nなんなりと。\n…む、難しいこと以外で、\nお願いします。"
10104-90-1 = "お待ちしておりました、先生。\nいえ、心配無用です。\nそれほど待っていませんので。\n……おそらく。"
10104-100-1 = "商流や取引の管理でしたら\n慣れております。護衛や\n警備の任務も、それなりに\nこなせます。"
10104-110-1 = "……一番自信があるもの？\nもちろん、カンフーです！"
10104-120-1 = "少し、身体を動かしたい\n気分です。私はこれから\nカンフーの修練に……"
10104-130-1 = "……散歩？……ですが、\n散歩程度では……"
10104-140-1 = "あ！いえ！行きます！\n先生と一緒でしたら！"
10104-150-1 = "実は、射撃は\n少々苦手です。"
10104-160-1 = "拳で戦ったほうが\n良いのでは、\nと言われたことが\nある程度には……"
10104-170-1 = "ですが、しっかり訓練は\nしておりますので…！"
10104-180-1 = "…人並みには、撃てるように\nなったと、思います…"
10104-190-1 = "たまにはサボっても\n大丈夫、ですか……？"
10104-200-1 = "いけません、先生！\n時間は有限です！\n刻一刻と\n減っていくのですよ！？"
10104-210-1 = "……時間を有効に\n使うためにも、\n休息は必要……？"
10104-220-1 = "たしかにそれは……\nおっしゃる通りですが……"
10104-230-1 = "二人きりの時間……\nそれも先生と、というのは\n……妙な感じがします。"
10104-240-1 = "あの、先生……お隣……\nよろしいでしょうか……？"
10104-250-1 = "お誕生日おめでとう\nございます、先生！"
10104-260-1 = "実は今朝、少し\n変わった夢をみました。"
10104-270-1 = "先生が生まれる瞬間の\n護衛をするという、\n内容だったのですが……"
10104-280-1 = "……そのとき先生は\nキヴォトスに\nいらっしゃらなかったのに。\nなんだか不思議ですね。"
10104-290-1 = "は、はい！？私の誕生日……？\nお、覚えてて\nくださったんですか……？"
10104-300-1 = "その……\n覚えてくださっていたら\n嬉しいな、とは\n思っていましたが……"
10104-310-1 = "……ありがとうございます、\n先生。私は果報者です……"
10104-320-1 = "明けましておめでとう\nございます、先生。\n玄武商会からお節を\n持ってまいりました。"
10104-330-1 = "私も作るのを\n手伝ったのですよ。\nふふ……どれだか\n分かりますか？"
10104-340-1 = "クリスマスの詳細なら\n熟知しています。\n先日、勉強しましたので。"
10104-350-1 = "…では、無償の\nプレゼントを\n配り物価を乱す、"
10104-360-1 = "サンタクロースという\n経済犯を倒してきます！"
10104-370-1 = "今日が何の日なのか、\n把握していますとも。"
10104-380-1 = "商売人たるもの、\n幅広い知識を身に\nつけなければなりませんので。"
10104-390-1 = "ハロウィーン……つまりは\nカボチャの稼ぎ時、ですよね？"
10104-410-1 = "あ、来てくださったのですね。"
10104-420-1 = "あと少しで朝練が\n終わりますので、\n少々お待ちいただけますか？"
10104-430-1 = "実はこれも、連続した\n動作の一部なんですよ。"
10104-440-1 = "流れを止め、姿勢を\n維持することも"
10104-450-1 = "精神を鍛えるのに\n役立つのでは、と思い……"
10104-460-1 = "……って、先生はどうして\nそんなところに……？"
10104-470-1 = "え？修行中なら――"
10104-480-1 = "周りの視線に動じず、\n平常心を保つべき……？"
10104-490-1 = "それは、そう……\nなのですが……"
10104-500-1 = "……うっ、や、やはり\nこれは、無理です……！"
10104-2600-1 = "大半は銃と火薬で解決できる、と\nいいますが……背中を押してくださった\n先生のためにも！銃と拳の融合を……\nいつか成し遂げてみせます！"
