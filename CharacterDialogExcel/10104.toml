[translation]
10104-10-1 = "It's Blue Archive."
10104-20-1 = "I'm Kayama Reijo, the manager and head security of the main store of Shanhaijing Academy's Black Tortoise Promenade. I look forward to working with you again, Sensei."
10104-30-1 = "I wonder how matters here are being managed..."
10104-40-1 = "This is teaching me about the ways that the Black Tortoise is different."
10104-50-1 = "Maybe we should do some market research."
10104-60-1 = "(If we're going to expand the Black Tortoise Promenade here...)"
10104-70-1 = "I wonder if there's any place to stretch..."
10104-80-1 = "Please let me know if you have any requests. But, um...please don't give me the difficult tasks."
10104-90-1 = "I've been waiting for you, Sensei. No, don't worry. It hasn't been that long...I think."
10104-100-1 = "I'm used to managing elite customers and high-value transactions. I can handle escort and security, too."
10104-110-1 = "...What area am I most confident in? Definitely kung fu!"
10104-120-1 = "I feel like being active for a while. So I'll be going to kung fu training now..."
10104-130-1 = "...You mean a walk? A walk isn't enough..."
10104-140-1 = "No, okay! I'll go! As long as it's with you, Sensei!"
10104-150-1 = "Honestly, I'm not a very good shot."
10104-160-1 = "People have even told me I might be better off fighting with my fists..."
10104-170-1 = "But I'm training diligently!"
10104-180-1 = "I think I can shoot as well as others now..."
10104-190-1 = "It's okay to ditch sometimes?"
10104-200-1 = "No, Sensei! Time is short! We're always losing time!"
10104-210-1 = "...We need rest to use our time productively...?"
10104-220-1 = "Actually, that does make sense..."
10104-230-1 = "Time for the two of us... Time with you, Sensei... It feels odd."
10104-240-1 = "Um, Sensei... Can I sit...next to you...?"
10104-250-1 = "Happy birthday, Sensei!"
10104-260-1 = "This morning, I had a strange dream."
10104-270-1 = "It was about guarding you in the moment you were born, Sensei..."
10104-280-1 = "...You weren't in Kivotos then. It's interesting."
10104-290-1 = "Huh? What?! My birthday? Y-You...remembered?"
10104-300-1 = "I...was hoping you would, but..."
10104-310-1 = "...Thank you, Sensei. I'm so lucky..."
10104-320-1 = "Happy New Year, Sensei. I brought New Year's food from the Black Tortoise Promenade."
10104-330-1 = "I helped make it! Heehee... Can you guess what it is?"
10104-340-1 = "I'm well-informed about Christmas. I studied the subject not long ago."
10104-350-1 = "...Well, then. I'm going to go defeat Santa Claus, the economic criminal..."
10104-360-1 = "...for passing out free gifts and disrupting the cost of living!"
10104-370-1 = "I'm aware of what day it is today."
10104-380-1 = "As a member of the Promenade, I need to have a wide range of knowledge."
10104-390-1 = "Halloween... It's the peak season for pumpkins, right?"
10104-410-1 = "Ah. You're here."
10104-420-1 = "I'm almost done with my morning training, so please wait."
10104-430-1 = "You see, this is an aspect of continuous movement as well."
10104-440-1 = "Stopping the flow, maintaining poses..."
10104-450-1 = "It also helps with training the mind."
10104-460-1 = "...But why are you just standing there, Sensei?"
10104-470-1 = "Huh? If I'm training..."
10104-480-1 = "...I shouldn't be getting distracted? I need to maintain my composure?"
10104-490-1 = "Yes, that's true, but..."
10104-500-1 = "...B-But this is way too much!"
10104-2600-1 = "They say most problems can be solved with guns and gunpowder... But for you, who always has my back, I'll make sure I achieve a harmony of guns and fists...someday!"
