10017-190-1 = "Very well. I shall create a new annual celebration to mark this day!"
10017-200-1 = "Um... I admit, I'm a little embarrassed..."
10017-210-1 = "My grand superiority feels somewhat lessened when you tell me happy birthday..."
10017-220-1 = "But thank you anyway, Comrade!"
10017-230-1 = "Happy New Year, Comrade! Are your resolutions for the new year in order?"
10017-240-1 = "If not, then I'd be happy to advise you!"
10017-250-1 = "Today's date is... Right, Christmas! That day when a fat, old man gives gifts to kids."
