[translation]
10017-20-1 = "The Great Leader of Red Winter Academy is here! Feel honored, Comrade!"
10017-30-1 = "Hmm... I like it. The Great Leader is quite pleased."
10017-40-1 = "Hmm... I see everything is in order."
10017-50-1 = "Ahem. Her honorable-ness has arrived."
10017-60-1 = "What a peaceful day. And it's all thanks to me! Hahaha!"
10017-70-1 = "(Is my mustache on right...?)"
10017-80-1 = "There you are, Comrade! We have much to do and so little time!"
10017-90-1 = "You're here, Comrade! We've got a big day ahead! You'd best be ready!"
10017-100-1 = "Did you call me, Comrade?"
10017-110-1 = "You're with me today. It's time to partake in revolution, Comrade!"
10017-120-1 = "Can't you feel my authority?"
10017-130-1 = "Worry not, Comrade. You have nothing to fear. I am quite merciful."
10017-140-1 = "Huh? My mustache fell off?"
10017-150-1 = "Huh...? Nooooo! My authority..."
10017-160-1 = "What the heck? It's right where it's supposed to be! Is this a joke to you?!"
10017-170-1 = "Heehee... I'm glad we're together again, Comrade."
