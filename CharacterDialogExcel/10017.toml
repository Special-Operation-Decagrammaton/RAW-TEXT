[translation]
10017-20-1 = "赤冬聯邦學園書記長大駕光臨！\n這是你的榮幸，同志！"
10017-30-1 = "唔呣，很好很好。\n書記長很滿意。"
10017-40-1 = "唔呣，沒有異常。"
10017-50-1 = "耶嘿，書記長\n大駕光臨哦。"
10017-60-1 = "今天也很和平，非常好！\n這都是多虧了咱啊！"
10017-70-1 = "（鬍子……\n沒有掉下來吧？）"
10017-80-1 = "等你很久囉，同志！\n要做的事情堆積如山！\n絕不允許偷懶！"
10017-90-1 = "你來啦，同志！\n必須一起處理的任務有很多，\n做好心理準備吧！"
10017-100-1 = "你叫咱嗎，同志？"
10017-110-1 = "今天也和咱一起，\n發起革命吧！"
10017-120-1 = "終於理解咱的權威了嗎？"
10017-130-1 = "放心，沒什麼好怕的。\n咱可是很寬容的！"
10017-140-1 = "嗯？\n鬍子掉下來了……？"
10017-150-1 = "噫啊啊！？不，不行！\n咱的權威啊……！？"
10017-160-1 = "……什麼嘛，黏得好好的不是嗎！\n再這樣一直開玩笑的話，\n咱要肅清了喔！？"
10017-170-1 = "呵呵呵，呵呵呵呵……\n沒想到今天也能一整天\n都和同志待在一起呢。"
10017-180-1 = "生日？\n是今天嗎？"
10017-190-1 = "好，那麼就把同志出生的\n這一天訂為赤冬的紀念日！"
10017-200-1 = "啊，唔……\n總覺得有點害羞呢……"
10017-210-1 = "如果被祝福的話，\n權威就……"
10017-220-1 = "不，不是，當然很開心！\n謝謝你啦，同志！"
10017-230-1 = "新年快樂，同志。\n今年的計畫訂好了嗎？"
10017-240-1 = "如果還沒的話，\n就和咱一起決定吧！"
10017-250-1 = "今天是聖誕節！\n聽說留著大鬍子的紅色老人\n會分送禮物……"
10017-260-1 = "真不錯！\n咱也想要禮物！"
10017-270-1 = "大家都穿著華麗的裝扮……\n原來如此，是萬聖節啊。"
10017-280-1 = "嗯？不對，這個鬍子\n可不是萬聖節的裝扮！"
10017-290-1 = "再，再捉弄咱的話，\n要肅清了喔！？"
10017-300-1 = "等你很久囉，同志！\n要做的事情堆積如山！\n絕不允許偷懶！"
10017-310-1 = "你來啦，同志！\n必須一起處理的任務有很多，\n做好心理準備吧！"
10017-320-1 = "你叫咱嗎，同志？"
10017-330-1 = "今天也和咱一起，\n發起革命吧！"
10017-340-1 = "終於理解咱的權威了嗎？"
10017-350-1 = "放心，沒什麼好怕的。\n咱可是很寬容的！"
10017-360-1 = "呵呵呵，呵呵呵呵……\n沒想到今天也能一整天\n都和同志待在一起呢。"
10017-370-1 = "這，這種放鬆的狀態，\n只會出現在同志面前喔！"
10017-380-1 = "別，別捉弄咱！\n要肅清了哦！？"
10017-390-1 = "差，差不多該\n讓咱戴上鬍子了……"
10017-400-1 = "維持這樣總覺得\n有點害羞……"
10017-410-1 = "生日？\n是今天嗎？"
10017-420-1 = "好，那麼就把同志出生的\n這一天訂為赤冬的紀念日！"
10017-430-1 = "啊，唔……\n總覺得有點害羞呢……"
10017-440-1 = "如果被祝福的話，\n權威就……"
10017-450-1 = "不，不是，當然很開心！\n謝謝你啦，同志！"
10017-460-1 = "新年快樂，同志。\n今年的計畫訂好了嗎？"
10017-470-1 = "如果還沒的話，\n就和咱一起決定吧！"
10017-480-1 = "今天是聖誕節！\n聽說留著大鬍子的紅色老人\n會分送禮物……"
10017-490-1 = "真不錯！\n咱也想要禮物！"
10017-510-1 = "啊哈哈哈哈！\n……嗯，還不夠呢！\n再堆得更大更大吧！"
10017-520-1 = "哈，哈……哈啾！\n……嗚。"
10017-530-1 = "哎咿，別在意！\n咱現在正在集中精神！"
10017-540-1 = "你說……會不會冷？\n你還真弱呢，同志！\n對咱來說這種程度不算什麼！"
10017-550-1 = "咱還可以\n再玩3小時呢！"
10017-560-1 = "咱想到一個好主意，\n同志你在那裡堆個雪人吧！"
10017-570-1 = "然後把咱在這裡做的\n放在它的旁邊！"
10017-580-1 = "嗯？你說為什麼？\n你不覺得很好嗎？"
10017-590-1 = "……然後在兩個雪人中間\n再做個小的雪人吧……"
10017-600-1 = "啊，當，當然也要\n同志你也覺得好才行哦！？"
10017-2600-1 = "咱很喜歡哦……這正是\n咱的權威！咱的力量！咱的鬍子！\n漸漸變得令人畏懼了呢……\n不過不用擔心，同志。\n咱永遠都是，你的同伴！"
