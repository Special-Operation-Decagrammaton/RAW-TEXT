[translation]
26017-10 = "블루, 아카이브."
26017-20 = "183호 특별반, 후루하타 라나입니다.\n음……. 재부팅은 해보셨습니까?"
26017-30 = "선생님. 아보카도,\n보셨습니까.\n만약에 아보카도가 있다면\n우유를 6개 사야합니다."
26017-40 = "북적이는군요.\n다함께 놀 수 있다면\n좋겠습니다."
26017-50 = "의젓하게\n잘 놀고 있었습니다.\n걱정마시길."
26017-60 = "세상은 넓군요.\n다양한 사람들은\n흥미롭습니다."
26017-70 = "183호와는\n다른 분위기가\n흥미롭습니다."
26017-80 = "신세지고 있습니다.\n후루하타 라나입니다."
26017-90 = "오늘도, 뵙고 싶었습니다."
26017-100 = "네, 후루하타 라나입니다."
26017-110 = "줄여서 '라나'라고 불러주세요."
26017-120 = "샬레는 따듯해서 좋습니다."
26017-130 = "선생님이 계신다는 점이\n가장 좋고요."
26017-140 = "무선 인터넷의\n새 비밀번호 말씀이신가요.\n쓰다듬어주세요."
26017-150 = "아……\n쓰다듬어주셔서 감사합니다."
26017-160 = "비밀번호는\n'쓰다듬어주세요' 입니다."
26017-170 = "알고 계셨나요? 샬레의 당번표,\ndrop table이\n입력됩니다."
26017-180 = "실행하지는 않았습니다.\n선생님께 폐가 되니까요."
26017-190 = "실행이 가능하지만 실행하면\n안되는 일이 세상에 있습니다."
26017-200 = "……아주 어려운 문제입니다."
26017-210 = "네…… 현명하고 상냥한\n선생님께서 막아주셔서,\n감사합니다."
26017-220 = "선생님, 생일 축하드립니다."
26017-230 = "단일 하드웨어\n연속 가동 기록 갱신이군요."
26017-240 = "오늘은 제 생일입니다.\n생일선물이 되어주셔서,\n감사합니다."
26017-250 = "다행히, 금년에도 연도 문제는\n발생하지 않았습니다."
26017-260 = "새해 복 많이 받으세요."
26017-270 = "메리 크리스마스 입니다."
26017-280 = "연도 문제를 대응중입니다만,\n함께 보시겠습니까."
26017-290 = "선생님, 갑작스럽지만\n혹시 간식이나 사탕 있으신지요."
26017-300 = "아까, 독특한 옷의 행인이\n'사탕 아니면 장난!'\n이라고 했습니다."
26017-310 = "제가 사탕이 없어서\n장난을 쳐드렸습니다만,"
26017-320 = "별로 기뻐하시질 않았습니다."
26017-340 = "……신세지고 있습니다. 선생님."
26017-350 = "익숙한 천장, 이군요."
26017-360 = "어떻게든 만나서, 다행입니다."
26017-370 = "네? '어째서 택배\n상자에 있느냐'……?\n'들어갔기 때문' 입니다."
26017-380 = "기차표를 샀더니,\n선물을 살 여유가 없어서……"
26017-390 = "도착하고 보니, 샬레에 마침\n선생님께 온\n상자가 있었지 뭡니까."
26017-400 = "그래서,\n직접 선물이 되었습니다."
26017-410 = "문제 없습니다.\n시간때우기는\n제 전문이기도 하고-"
26017-420 = "완충재도 푹신했고,\n선생님께서 개봉할 때\n주의해 주셔서 무사합니다."
26017-430 = "……후훗……."
26017-440 = "역시, 직접 뵙게 되니 좋습니다."
26017-450 = "많이, 보고 싶었습니다. 선생님."
26017-460 = "으음……. "
26017-470 = "하-암……."
26017-480 = "그럼, 안녕히 주무세요."
26017-490 = "쿠울……."
26017-2600 = "음. 천공카드를 많이 만들 수 있겠군요.\n심판 보기도 편할듯 합니다."
