[translation]
26017-10 = "ブルー、アーカイブ。"
26017-20 = "183号特別クラス、古畑ラナです。 \nふむ……再起動は試しましたか？"
26017-30 = "先生、\nアボカドはありましたか？\nアボカドがあったなら、\n牛乳を6本買わないと\nいけませんので。"
26017-40 = "賑やかです。\nみんなと仲良く\nできると良いですね。"
26017-50 = "ちゃんと、\n大人しくしていました。\nご心配には及びません。"
26017-60 = "世界は広いですね。\n色んな人がいて、\n考察のし甲斐が\nあります。"
26017-70 = "なんだか183号と\n雰囲気が違って。\n興味深いです。"
26017-80 = "お世話になっております。\n古畑ラナです。 "
26017-90 = "今日も、お会いしたかったです。"
26017-100 = "はい、古畑ラナです。"
26017-110 = "略して「ラナ」と\n呼んでください。"
26017-120 = "暖かいですね。\nシャーレのいいところです。"
26017-130 = "一番の利点は、\n先生がいらっしゃることですが。"
26017-140 = "無線LANの新しい\nパスワードですね……\n「なでてください」。"
26017-150 = "あ……なでてくださり\nありがとうございます。"
26017-160 = "パスワードは\n「なでてください」です。"
26017-170 = "ご存じでしたか？\nシャーレの当番表には、\ndrop tableの\n入力が可能です。"
26017-180 = "実行はしていません。\n先生に迷惑が\nかかってしまいますので。"
26017-190 = "実行できるのに、\n実行してはいけないことが、\n世にはある……。"
26017-200 = "……なんという\n難題なのでしょう。"
26017-210 = "ええ……聡明で優しい\n先生に止めていただいて、\n助かっております。"
26017-220 = "お誕生日おめでとうございます、\n先生。"
26017-230 = "単一ハードウェア\n連続稼働記録を、\n更新されましたね。"
26017-240 = "今日は私の誕生日です。\nプレゼントになってくださり、\nありがとうございます。"
26017-250 = "幸い、今年も年問題は\n発生しませんでした。"
26017-260 = "明けまして\nおめでとうございます。"
26017-270 = "メリークリスマスです。"
26017-280 = "年問題に対応していました。\n進捗、先生もご覧になりますか。"
26017-290 = "先生、突然ですが\nおやつまたは飴を、\nお持ちでしょうか。"
26017-300 = "先ほど、変わった服装の通行人に\n「トリック・オア・トリート」\nと言われました。"
26017-310 = "飴の持ち合わせが\nなかったためイタズラを\nしてあげたのですが……"
26017-320 = "あまり喜んで\nもらえませんでした。"
26017-340 = "……お世話になっております、\n先生。"
26017-350 = "見慣れた天井……ですね。"
26017-360 = "なんとかお会いできて\nよかったです。"
26017-370 = "うん？宅配の荷物に\n入っている理由……？\n「入ったから」です。"
26017-380 = "列車の乗車券を買ったら、\nお土産を買えなく\nなってしまって……。"
26017-390 = "そうしたら、シャーレに\nちょうど先生宛の段ボールが\nあるではないですか。"
26017-400 = "なので、\nお土産になってみました。"
26017-410 = "問題ありません。\n暇つぶしは得意です――"
26017-420 = "緩衝材はふかふかでしたし、\n先生が開封の際に気をつけて\nくださったので、無事です。"
26017-430 = "ふふっ……。"
26017-440 = "こうして顔が見れて、\n嬉しいです。"
26017-450 = "すごく、\n会いたかったです。先生。"
26017-460 = "うぅん……。"
26017-470 = "ふぁ……。"
26017-480 = "それでは、おやすみなさい。"
26017-490 = "すやぁ……。"
26017-2600 = "ふむ、パンチカードが\nいっぱい作れそうで良いですね。\nこれで判定も捗りそうです。"
