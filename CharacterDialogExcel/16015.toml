[translation]
16015-10-1 = "蔚藍，檔案！"
16015-20-1 = "老師……請看著吧。\n我改變後的面貌！"
16015-30-1 = "漂亮的地方……！"
16015-40-1 = "大家都打扮得很漂亮。"
16015-50-1 = "在這裡練習\n會造成困擾嗎……？"
16015-60-1 = "有點餓了……"
16015-70-1 = "大家喜歡\n什麼曲子呢？"
16015-80-1 = "歡迎回來，老師！\n有想聽的曲子嗎？"
16015-90-1 = "啊，老師！\n我一直在等你哦！"
16015-100-1 = "老師你，平常\n都聽什麼曲子呢？"
16015-110-1 = "雖然實在不到職業水準，"
16015-120-1 = "但已經多少能夠演奏了！"
16015-130-1 = "嗯？形象看起來\n好像變了很多，是嗎？"
16015-140-1 = "哪……哪種\n比較好呢……？"
16015-150-1 = "這麼說來，\n我有新買的薄荷糖……"
16015-160-1 = "呵呵，要吃吃看嗎？"
16015-170-1 = "呵呵，唔呵呵……"
16015-180-1 = "嗯？\n……呵呵。\n什麼都沒有。"
16015-190-1 = "老實說，一開始我很擔心。\n是不是做了多餘的事……"
16015-200-1 = "不過……幸好當時有做！\n謝謝你，老師！"
16015-210-1 = "祝你生日快樂，老師！"
16015-220-1 = "我為老師準備了一曲！"
16015-230-1 = "要聽聽看嗎？"
16015-240-1 = "我的生日嗎？\n啊……沒，沒錯！"
16015-250-1 = "如果可以的話，\n要不要一起去演唱會……！"
16015-260-1 = "新年快樂，老師！"
16015-270-1 = "今年會發生什麼，\n我已經開始期待了！"
16015-280-1 = "聖誕快樂～！\n今年的我，\n是個乖孩子嗎？"
16015-290-1 = "萬聖節……是個好日子呢！\n我想嘗試各種裝扮！"
16015-310-1 = "耶嘿嘿……\n請進，老師！"
16015-320-1 = "來這邊！\n不用客氣！"
16015-330-1 = "……？老師……？\n怎麼了嗎？"
16015-340-1 = "難道……\n讓你為難了嗎？"
16015-350-1 = "唔～！\n好不容易鼓起勇氣了說……"
16015-360-1 = "雖然說要亂來的\n我也有錯……\n可是，還是希望能\n稍微配合一下。"
16015-370-1 = "……哼哼哼。\n來！請進！"
16015-380-1 = "（……好像得\n　感謝這場雨呢）"
16015-390-1 = "我一發出信號，\n就一起跑唷！\n準備好了吧？"
16015-400-1 = "那要出發囉～！"
16015-2600-1 = "這一天居然會到來，我怎麼想也沒想到。\n……原來這種事真的會發生。\n……我真的很開心。"
