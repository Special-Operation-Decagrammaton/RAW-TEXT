[translation]
16015-10-1 = "Blue, Archive!"
16015-20-1 = "Sensei... I'm going to show you! ...The part of me that's capable of change!"
16015-30-1 = "What a pretty place!"
16015-40-1 = "Everyone looks very cool!"
16015-50-1 = "Would it be a nuisance if I practiced here...?"
16015-60-1 = "I'm getting a bit hungry..."
16015-70-1 = "I wonder what song everyone would enjoy?"
16015-80-1 = "Welcome, Sensei! Is there a song you'd like to listen to?"
16015-90-1 = "Oh, Sensei! I've been waiting for you."
16015-100-1 = "What kind of songs do you typically listen to, Sensei?"
16015-110-1 = "Although I'm not quite at a professional level..."
16015-120-1 = "I can play proficiently now!"
16015-130-1 = "Hm? It feels as if I have an entirely different aesthetic now?"
16015-140-1 = "Um... Which one seems better...?"
16015-150-1 = "Now that I think about it, the mint candy I bought..."
16015-160-1 = "Heehee. Would you like to try it?"
16015-170-1 = "Heeheeheeheehee..."
16015-180-1 = "Hm? ...Heehee. Nothing."
16015-190-1 = "Honestly, I was worried at first. I thought I might have done something unnecessary..."
16015-200-1 = "In the end... I'm glad I did! Thank you, Sensei!"
16015-210-1 = "Happy birthday, Sensei!"
16015-220-1 = "I've prepared a song for you, Sensei!"
16015-230-1 = "Would you like to hear it?"
16015-240-1 = "My birthday? Ah... Y-Yes!"
16015-250-1 = "If you don't mind, would you go watch a live show with me...?"
16015-260-1 = "Happy New Year, Sensei!"
16015-270-1 = "I'm already wondering what sort of things are going to happen this year!"
16015-280-1 = "Merry Christmas! Was I a good kid this year?"
16015-290-1 = "Halloween... What a good day! There's a lot of different costumes I want to try on!"
16015-310-1 = "Heehee... Now, Sensei!"
16015-320-1 = "Come here! Don't be shy!"
16015-330-1 = "...? Sensei...? What's wrong?"
16015-340-1 = "Did I... Did I make you uncomfortable?"
16015-350-1 = "Hmph! But I went to all this effort..."
16015-360-1 = "I realize I'm being stubborn again, but... Can you humor me a little, please?"
16015-370-1 = "...Heeheehee. Okay! Yay!"
16015-380-1 = "(...I should thank the clouds for this rain today.)"
16015-390-1 = "On my mark, we're going to run out together! Are you ready?"
16015-400-1 = "Let's go!"
16015-2600-1 = "I never even fathomed a day like this would come. These kinds of things can really happen, after all. I'm very happy."
