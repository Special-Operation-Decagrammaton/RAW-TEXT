[translation]
10053-10-1 = "Blue Archive!"
10053-20-1 = "Haha... All preparations complete. There won't be a single error in my calculations today!"
10053-30-1 = "I'm feeling a little drained... I wonder if now's a good time for a break."
10053-40-1 = "If you don't start taking care of your physical fitness..."
10053-50-1 = "This is an interesting cafe. Also, very unexpected."
10053-60-1 = "I already knew this, but wow... Exercise is not easy..."
10053-70-1 = "As long as we don't go completely bankrupt, we'll be fine. I hope."
10053-80-1 = "Welcome, Sensei. I've been waiting for you."
10053-90-1 = "Come now! There's a mountain of work that needs doing!"
10053-100-1 = "You're late!"
10053-110-1 = "..."
10053-120-1 = "I'll let you off the hook... But only this once!"
10053-130-1 = "You have to arrive on time from now on, got it?"
10053-140-1 = "I've heard that sometimes all it takes to change your mood is a different outfit."
10053-150-1 = "I'm not actually sure of that, but..."
10053-160-1 = "...While I have it on... What do you think about this outfit?"
10053-170-1 = "As a treasurer, and as an athlete..."
10053-180-1 = "...all I can do is my best."
10053-190-1 = "This outfit...is a refreshing look?"
10053-200-1 = "Wh-Where did that come from?!"
10053-210-1 = "Well, um... Thank you..."
10053-220-1 = "You like my ponytail?"
10053-230-1 = "Y-You're always just...saying things like that!"
10053-240-1 = "...Doesn't mean I don't appreciate hearing it, though..."
10053-250-1 = "When you really think about it..."
10053-260-1 = "Physical education is just another STEM subject that can be scientifically analyzed."
10053-270-1 = "Although, that's hard to do in the middle of a run..."
10053-280-1 = "Sensei. Happy birthday."
10053-290-1 = "If we take your date of birth and just do a little math, you're..."
10053-300-1 = "Haha. Don't worry, I'll stop there."
10053-310-1 = "Sensei... Do you remember?"
10053-320-1 = "Today is my birthday."
10053-330-1 = "I left my schedule empty for today."
10053-340-1 = "What about you, Sensei? What does your schedule look like today?"
10053-350-1 = "Happy New Year, Sensei!"
10053-360-1 = "Here's to another great year together."
10053-370-1 = "I was wondering... Do you want to start off the year with a run?"
10053-380-1 = "I don't really understand why some people get so excited for Christmas..."
10053-390-1 = "But thinking of a Christmas with you, Sensei..."
10053-400-1 = "It starts to make sense."
10053-410-1 = "A day of costumes, tricks, treats, and..."
10053-420-1 = "Calories!"
10053-430-1 = "I-I'm not going to let down my guard just because I'm wearing workout clothes!"
10053-450-1 = "*pant* *pant*"
10053-460-1 = "I can't believe I've become so unfit after just a few months..."
10053-470-1 = "To ensure that I don't embarrass myself at the Kivotos Halo Festival..."
10053-480-1 = "I'm going to have to double down on my training."
10053-490-1 = "Oh, Sensei. You want water too?"
10053-500-1 = "Sure, here..."
10053-510-1 = "S-Stop right there, Sensei! I-I mean, um, maybe now isn't...a good time to drink water?"
10053-520-1 = "(If Sensei drinks from the bottle I've been drinking from...)"
10053-530-1 = "(I-It'd be an indirect ki—)"
10053-540-1 = "(No, no! It doesn't matter what the circumstances are...)"
10053-550-1 = "(Such shamelessness can never, absolutely never be tolerated!)"
10053-560-1 = "(That being said, if it's Sensei...)"
10053-570-1 = "...One sip... You can have just one sip, okay?"
10053-2600-1 = "This is surprisingly...suitable and reasonable for exercise. Thank you, Sensei."
