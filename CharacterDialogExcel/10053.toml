[translation]
10053-10-1 = "ブルーアーカイブ！"
10053-20-1 = "ふふっ……準備万端です。\n今日の私の計算に、ミスはありませんよ！"
10053-30-1 = "ちょっと疲れた……\nここで休めるかな。"
10053-40-1 = "普段から体調管理に\n気をつけないと……。"
10053-50-1 = "このカフェ、面白い。\nちょっと計算外かも。"
10053-60-1 = "分かってはいたけど\n運動って簡単じゃ\nないわね。"
10053-70-1 = "破産しないと\nいいんだけど……。"
10053-80-1 = "おかえりなさい、先生。\nお待ちしておりました。"
10053-90-1 = "……さあ、積もりに積もった\n仕事が山ほどありますよ！"
10053-100-1 = "遅いですよ！"
10053-110-1 = "……"
10053-120-1 = "今回だけ、大目に見てあげます。"
10053-130-1 = "次からは、\n早めに来てくださいね？"
10053-140-1 = "着替えるだけで、気分転換に\nなるとよく言いますよね。"
10053-150-1 = "私は、\nあまり分かりませんけど……"
10053-160-1 = "……ところで、\nこの格好、どうでしょう？"
10053-170-1 = "会計として、選手として。"
10053-180-1 = "どちらに対しても\n最善を尽くすだけです。"
10053-190-1 = "この格好、\n新鮮……ですか？"
10053-200-1 = "きゅ、急に何を！？"
10053-210-1 = "うう……その……\nありがとうございます……。"
10053-220-1 = "ポニーテールが\n似合ってる、ですか？"
10053-230-1 = "せ、先生はいつも\n心にもないお世辞を……！"
10053-240-1 = "……それが嫌、という\nわけではないですけど……。"
10053-250-1 = "見落としがちですが、"
10053-260-1 = "運動も科学的に計算できる\n理系科目の一つなんですよ？"
10053-270-1 = "……走ってる最中は、\nそう思えませんが。"
10053-280-1 = "お誕生日\nおめでとうございます、先生。"
10053-290-1 = "生まれた日からの\n日数計算は……"
10053-300-1 = "ふふっ、\nやめておきますね。"
10053-310-1 = "先生……\nその、覚えていますか？"
10053-320-1 = "今日は私の誕生日なんです。"
10053-330-1 = "この日のために\n予定を空けておきました。"
10053-340-1 = "先生は……\nお時間どうでしょうか？"
10053-350-1 = "あけまして\nおめでとうございます、先生。"
10053-360-1 = "今年もよろしく\nお願いいたしますね。"
10053-370-1 = "もしよろしければ\n初走り、一緒にどうですか？"
10053-380-1 = "クリスマスを特異点に\nしたがる人たちの気持ちは\nよく分かりませんけど……"
10053-390-1 = "先生と一緒なら\nと考えると……"
10053-400-1 = "少し分かる気もします。"
10053-410-1 = "仮装、いたずら、\nお菓子、そして……"
10053-420-1 = "カロリーの日！"
10053-430-1 = "た、体操着を着ているからと\n言って油断しませんからね！"
10053-450-1 = "はぁ、はぁ……"
10053-460-1 = "まさかたった数か月の間に\nここまで体力が\n落ちていたなんて……"
10053-470-1 = "「晄輪大祭」で無様な姿を\nみせないためにも……"
10053-480-1 = "もっと体力づくりを\n頑張らないと。"
10053-490-1 = "あ、先生もお水、\n要りますか？"
10053-500-1 = "はい、どうぞ……"
10053-510-1 = "ま、待ってください、先生！\nや、やっぱ今はダメです！"
10053-520-1 = "（今ここで私が\n口をつけたペットボトルから\n先生が水を飲んだら……）"
10053-530-1 = "（事実上の間接キ……）"
10053-540-1 = "（いやいや、\nいくらそういう状況だからって)"
10053-550-1 = "（そんな破廉恥なことが\n許されるわけ……！）"
10053-560-1 = "（でも……先生なら……）"
10053-570-1 = "一口……\nだけですよ……？"
10053-2600-1 = "合理的で……\nとても運動に適した装備ですね。\nありがとうございます、先生。"
