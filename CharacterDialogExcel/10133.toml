[translation]
10133-10-1 = "ブルーアーカイブ。"
10133-20-1 = "電子の領域を制する最も合理的な答えを、\n貴方に見せてあげる。"
10133-30-1 = "ここも概念空間の\n一種……要分析ね。"
10133-40-1 = "片づけが上手く\nできるように\nなりたい……。"
10133-50-1 = "……どうやら、\n先生の感性は\n私と近いようね。"
10133-60-1 = "「アバンギャルド君\nType.メイド」を\n作ったら、ここに\n置こうかしら。"
10133-70-1 = "できる限り……\nきれいに使うわ。"
10133-80-1 = "待っていたわ、先生。"
10133-90-1 = "効率的な業務サポートを\n提供してあげる。\n合理的でしょう？"
10133-100-1 = "仕事を始めるのね。\n何でも言ってちょうだい。"
10133-110-1 = "時間は流れていない……\nという話があるのだけれど。"
10133-120-1 = "過去、現在、未来が全て同じ\n瞬間に存在するという説よ。"
10133-130-1 = "その理論なら……"
10133-140-1 = "今も、あの大きな事件の渦中に\nあるということになるわね。"
10133-150-1 = "正直、貴方のPCの\n中身に興味があるの。"
10133-160-1 = "このスーツがあれば、\n先生のデバイス程度、\n容易にハッキングできる。"
10133-170-1 = "……安心してちょうだい。\nそういったやり方は……\n好まないから。"
10133-180-1 = "観測可能な世界の向こうには、\n何があるのかしら。"
10133-190-1 = "私はその答えが知りたい。"
10133-200-1 = "……貴方と一緒に、よ。"
10133-210-1 = "先生のスーツも\n用意すれば良かったわね。"
10133-220-1 = "そうしたら、一緒に概念空間を\n楽しむことができたのに。"
10133-230-1 = "……現実でこのまま\n出かければ良い？"
10133-240-1 = "この格好ではダメよ。"
10133-250-1 = "重力は、どこにでも存在する。"
10133-260-1 = "……そう、貴方と私の間にも。"
10133-270-1 = "私たちは無意識に、\n互いの方向へ落ちているのよ。"
10133-280-1 = "お誕生日おめでとう、先生。"
10133-290-1 = "プレゼントに、\n業務サポート特化型の\nアバンギャルド君を用意したわ。"
10133-300-1 = "……えっ？サポートなら\n私から直接、受けたい……？"
10133-310-1 = "そ、それは……困るわ……。"
10133-320-1 = "ああ、今日は私の誕生日……\nだったのね。"
10133-330-1 = "任務に没頭していたから、\n忘れていたわ。"
10133-340-1 = "何かに集中すると……他に\n気が回らなくなってしまうの。"
10133-350-1 = "先生のおかげで、\n良い思い出ができたわ。\nありがとう。"
10133-360-1 = "先生、明けましておめでとう。"
10133-370-1 = "お正月には、\n適した服装があるのでしょう？"
10133-380-1 = "……これで大丈夫かしら。"
10133-390-1 = "大歓迎……？\nなら……良いのだけれど。"
10133-400-1 = "今日は、ある人の\n誕生を祝う日らしいわね。"
10133-410-1 = "あまりそういったものは\n理解できないのだけれど、"
10133-420-1 = "この時間を作ってもらえた\nことには……お礼を言うわ。"
10133-430-1 = "幽霊？私は信じていないわ。"
10133-440-1 = "重力や電磁気力と\n相互作用できない存在は、"
10133-450-1 = "私たちの目では\n捉えられないもの。"
10133-460-1 = "……よく分からない？どうして？"
10133-480-1 = "ふぅ……落ち着いたわ。"
10133-490-1 = "室内温度を\n考慮していなかったの。"
10133-500-1 = "私としたことが……\n目の前の結果に、気を\n取られてしまったみたい……。"
10133-510-1 = "……少し、休ませてちょうだい。"
10133-520-1 = "暑さで、思考があまり……。"
10133-530-1 = "……先生？\nどうしてそんな顔で……。"
10133-540-1 = "……あ！！"
10133-550-1 = "（わ、私は……なにを……！？）"
10133-560-1 = "こ、これは\nわざとじゃないの……！\nごめんなさい……！"
10133-570-1 = "わ、私はもう、\n大丈夫だから……！"
10133-2600-1 = "みんなを守って見せる……\nその強い意志が、\n私に引き金を引かせるの。"
