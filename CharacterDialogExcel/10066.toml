[translation]
10066-10-1 = "Blue Archive!"
10066-20-1 = "ถึงจะเปลี่ยนคลาสเป็นเมด แต่อาริสึก็คืออาริสึคนเดิมค่ะ\nคอยเฝ้าดูอาริสึด้วยนะคะคุณครู!"
10066-30-1 = "...ให้เริ่มทำความสะอาด\nจากตรงไหนดีคะ?"
10066-40-1 = "ที่นี่เหมือนจะมี\nเควสรองให้เล่นเลยค่ะ...!"
10066-50-1 = "อาริสึรู้ดีค่ะว่าในโลกนี้\nมีสิ่งที่เรียกว่า\nเมดคาเฟ่อยู่ด้วยค่ะ!"
10066-60-1 = "ถ้าเป็นเมดก็ต้องมีนายท่าน\nนายท่านของอาริสึ...\nแน่นอนว่าต้องเป็นคุณครูค่ะ!"
10066-70-1 = "เลเวลเมดเพิ่มขึ้นแล้วค่ะ!\nอาริสึกับชุดเมดเริ่มเหมาะกัน\nขึ้นมานิดหน่อยแล้วค่ะ"
10066-80-1 = "เชิญเลยค่ะนายท่าน!"
10066-90-1 = "ไม่ว่าเรื่องอะไร\nก็ให้เมดอาริสึทำได้เลยค่ะ"
10066-100-1 = "วางใจได้ทุกเรื่องเลยค่ะ"
10066-110-1 = "ก็อาริสึในตอนนี้\nคือเมดของคุณครูยังไงล่ะคะ!"
10066-120-1 = "อาริสึในวันนี้เป็นทั้งเมดและผู้กล้า!"
10066-130-1 = "หรือเรียกได้ว่าผู้กล้าเมดค่ะ!"
10066-140-1 = "ผู้กล้าเมดก็คือที่สุดของ\nทั้งเมดและผู้กล้าค่ะ"
10066-150-1 = "ถ้าเทียบกับเกม RPG\nก็ต้องเป็นอาชีพสูงสุดค่ะ!"
10066-160-1 = "พอเปลี่ยนมาใส่ชุดเมด\nก็เหมือนว่าสกิลทำความสะอาด\nจะพัฒนาขึ้นเลยค่ะ!"
10066-170-1 = "คุณครู มีตรงไหนจะให้\nทำความสะอาดมั้ยคะ?"
10066-180-1 = "ได้ยินมาว่า เมดทำงานได้\nหลายแบบเลยค่ะ!"
10066-190-1 = "ทั้งทำอาหาร ทำความสะอาด ซักผ้า♪\nทำลายล้าง โจมตี เฝ้ายาม\nแล้วก็พิทักษ์สันติ!"
10066-200-1 = "ได้ยินมาว่าสิ่งสำคัญ\nของสไนเปอร์\nก็คือความสงบทางใจค่ะ"
10066-210-1 = "คะ... คุณครู?\nถ้ามาลูบหัวกันแบบนี้ละก็..."
10066-220-1 = "แหะๆ... เดี๋ยวความสงบทางใจ\nของอาริสึก็แตกกระเจิงหรอกคะ..."
10066-230-1 = "คุณครูคะ บอกตารางงานวันนี้\nมาหน่อยสิคะ!"
10066-240-1 = "กลิ้งไปกลิ้งมาทั้งวันเลยเหรอคะ?\nคะ? อาริสึก็ด้วย...?"
10066-250-1 = "ค่ะ! อาริสึก็จะกลิ้งไปกลิ้งมาด้วยค่ะ!"
10066-260-1 = "สุขสันต์วันเกิดค่ะคุณครู!"
10066-270-1 = "อยากได้ไอเทมอะไร\nเป็นของขวัญเหรอคะ?"
10066-280-1 = "วันที่ได้เจอเพื่อนๆ ชมรมพัฒนาเกม\nและคุณครู..."
10066-290-1 = "เรื่องที่เกิดขึ้นในวันนั้น\nอาริสึจะไม่ลืมเลยค่ะ"
10066-300-1 = "คุณครู\nต่อไปก็ขอฝากตัวด้วยนะคะ!"
10066-310-1 = "สวัสดีปีใหม่ค่ะคุณครู!"
10066-320-1 = "วันแรกของเมดอาริสึ\nให้ทำอะไรดีคะ?"
10066-330-1 = "...ให้อยู่ข้างๆ กันก็พอเหรอคะ?"
10066-340-1 = "อาริสึรู้ดีค่ะ"
10066-350-1 = "ไม่ว่าจะในเกมหรือชีวิตจริง\nคริสต์มาสคือเทศกาล\nที่ต้องเฉลิมฉลองค่ะ!"
10066-360-1 = "แฮปปี้ฮาโลวีน!"
10066-370-1 = "ถึงวันที่ทุกคนแต่งตัว\nเหมือนตัวละครในเกมแล้วค่ะ"
10066-380-1 = "หรือว่านี่คือ...\nวันที่เกมกลายเป็นความจริงคะ?"
10066-400-1 = "คะ... คุณครู!?\nอาริสึยังเตรียมตัว\nอยู่เลย..."
10066-410-1 = "อาริสึคิดว่าจะให้คุณครูได้เห็น\nอาริสึที่ก้าวข้ามชุดเมด"
10066-420-1 = "แล้วเปลี่ยนคลาส\nมาได้แล้วน่ะค่ะ..."
10066-430-1 = "คุณครูช่วยรออีกนิด\nจนกว่าอาริสึจะเตรียมตัวเสร็จ\nได้มั้ยคะ"
10066-440-1 = "ใช่แล้วค่ะ!\nตอนนี้อาริสึไม่กลัวเมดแล้วค่ะ!"
10066-450-1 = "ทั้งหมดนี้เป็นเพราะ\nคุณครูอยู่ข้างๆ กันไงคะ"
10066-460-1 = "เพราะถ้าอยู่กับคุณครู..."
10066-470-1 = "ไม่ว่าจะดันเจี้ยนแบบไหน\nอาริสึก็ฝ่าฟันได้ค่ะ!"
10066-480-1 = "ค่ะ! อาริสึพร้อม\nออกผจญภัยแล้วค่ะ!"
10066-2600-1 = "นี่คือ... ดาบวิเศษในตำนานที่อัปเกรด\nจากพลังของอาริสึกับคุณครูค่ะ...!\nขอบคุณค่ะ คุณครู!\nอาริสึจะอัปเลเวลเมดให้มากขึ้น\nแล้วเป็นผู้กล้าเมดให้ได้ค่ะ!"
