[translation]
10066-10-1 = "Blue Archive!"
10066-20-1 = "Although I look like a maid now, in truth I am still Aris. Please continue to support me, Sensei."
10066-30-1 = "Where shall I begin to clean?"
10066-40-1 = "This looks like a location that will trigger a side quest!"
10066-50-1 = "I have heard tell that this world holds places called \"maid cafes.\""
10066-60-1 = "A maid needs a master. My master must be you, Sensei!"
10066-70-1 = "My maid level has gone up! Wearing this maid uniform has improved my stats!"
10066-80-1 = "Welcome, Master!"
10066-90-1 = "Aris the maid is here to take care of everything!"
10066-100-1 = "Tell me anything."
10066-110-1 = "For now, I am your maid, Sensei!"
10066-120-1 = "I am both a hero and a maid today."
10066-130-1 = "So that makes me a hero maid!"
10066-140-1 = "A hero maid has to have all the skills of both a hero and a maid."
10066-150-1 = "So that means it is an advanced class!"
10066-160-1 = "When I wear a maid uniform, I feel as if my cleaning skill level has increased!"
10066-170-1 = "Sensei, do you need me to clean somewhere?"
10066-180-1 = "I have heard that a maid has many duties!"
10066-190-1 = "Cooking, cleaning, laundry, destruction, ambushes, security and even world peace! ♪"
10066-200-1 = "I have heard that a calm mind is very important for a sniper."
10066-210-1 = "Um, S-Sensei? When you pat my head like that..."
10066-220-1 = "Augh... I have lost my calm mind..."
10066-230-1 = "Sensei, what is on your task list for the day?"
10066-240-1 = "Oh, you are going to spend all day vegging out? And you want me to join you?"
10066-250-1 = "Yes! I will veg out as well!"
10066-260-1 = "Happy birthday, Sensei!"
10066-270-1 = "What would you like as a gift item?"
10066-280-1 = "The day I met you and my friends in the Game Development Department..."
10066-290-1 = "I will not ever forget that day."
10066-300-1 = "Sensei, I look forward to many more days together!"
10066-310-1 = "Happy New Year, Sensei!"
10066-320-1 = "What is my first task as a maid?"
10066-330-1 = "Is it truly all right for me to just spend time with you?"
10066-340-1 = "I know."
10066-350-1 = "In games or in reality... Christmas is a time for events!"
10066-360-1 = "Happy Halloween!"
10066-370-1 = "Today is a day people when disguise themselves as video game characters!"
10066-380-1 = "Or...is it that video games are becoming reality today...?"
10066-400-1 = "S-Sensei?! I am still preparing..."
10066-410-1 = "I wanted to show you that I had overcome my fears and successfully changed my class to a maid..."
10066-420-1 = "That is the side of me that I want to show you."
10066-430-1 = "So, please wait until I am ready."
10066-440-1 = "That is correct! I am no longer afraid of maids!"
10066-450-1 = "I could achieve this only because you were here for me, Sensei."
10066-460-1 = "If I'm with you..."
10066-470-1 = "Then I can take on any dungeon in the world."
10066-480-1 = "Yes! I am ready for a new adventure!"
10066-2600-1 = "This...this is a legendary holy sword, imbued with both my strength and Sensei's! Thank you! I will raise my level even higher to become a maid hero worthy of this!"
