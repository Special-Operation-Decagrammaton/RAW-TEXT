[translation]
10066-10-1 = "ブルーアーカイブ！"
10066-20-1 = "メイドにジョブチェンジしても、アリスはアリスです。\n見ていてください、先生！"
10066-30-1 = "……どこからお\n掃除しましょう？"
10066-40-1 = "サブクエストが\n発生しそうな\n場所です……！"
10066-50-1 = "アリス、知ってます。\n世の中には\nメイドカフェというものが\nあるらしいです！"
10066-60-1 = "メイドには\nご主人様が必要です。\nアリスのご主人様は……\nもちろん先生です！"
10066-70-1 = "メイドレベルが\n上がりました！\nアリスとメイド服の相性は、\n少し良くなってきました。"
10066-80-1 = "おかえりなさいませ、\nご主人様！"
10066-90-1 = "メイドのアリスに\n何でもお任せください。"
10066-100-1 = "何でも言ってください。"
10066-110-1 = "今のアリスは\n先生のメイドなので！"
10066-120-1 = "今日のアリスは\nメイドであり勇者！"
10066-130-1 = "つまりメイド勇者です！"
10066-140-1 = "メイド勇者とは、メイドと\n勇者を極めた先にあります。"
10066-150-1 = "RPGで例えるなら上級職です！"
10066-160-1 = "メイド服に着替えると、お掃除\nスキルが上がった気がします！"
10066-170-1 = "先生、どこかお掃除する\nところはありますか？"
10066-180-1 = "メイドは様々な\nお仕事をこなすと聞きました！"
10066-190-1 = "お料理、お掃除、お洗濯♪\n破壊に強襲、警備に\n世界平和まで！"
10066-200-1 = "狙撃手にとって、\n平常心が大事だと聞きました。"
10066-210-1 = "せ、先生？\nそんなに頭を撫でられると……"
10066-220-1 = "……ふわぁ。アリスは\n平常心を失ってしまいました……"
10066-230-1 = "先生、今日のスケジュールを\n教えてください！"
10066-240-1 = "一日中、\nゴロゴロするんですか……？\nえ、アリスも……？"
10066-250-1 = "はい！\nアリスもゴロゴロします！"
10066-260-1 = "お誕生日\nおめでとうございます、先生！"
10066-270-1 = "記念アイテムは\n何が良いですか？"
10066-280-1 = "ゲーム開発部のみんな、\nそして先生と出会った日……"
10066-290-1 = "あの日の出来事を、\nアリスは忘れません。"
10066-300-1 = "先生、これからも\nよろしくお願いします！"
10066-310-1 = "あけまして\nおめでとうございます、先生！"
10066-320-1 = "メイドアリスの初仕事、\n何が良いですか？"
10066-330-1 = "……そばに居るだけで\n良いんですか？"
10066-340-1 = "アリス、知っています。"
10066-350-1 = "ゲームでも現実でも、\nクリスマスはイベントの\n時間です！"
10066-360-1 = "ハッピーハロウィーン！"
10066-370-1 = "みんなでゲームのキャラクター\nみたいに仮装する日ですね！"
10066-380-1 = "それとも……ゲームが\n現実になる日なのでしょうか？"
10066-400-1 = "せ、先生！？\nアリス、まだ\n準備中なので……"
10066-410-1 = "メイドを克服し、\nジョブチェンジした\nアリスの姿……"
10066-420-1 = "先生に見せようと\n思ったのですが……"
10066-430-1 = "アリスの支度が整うまで、\nもう少しだけ\n待っていてください。"
10066-440-1 = "その通りです！\nもうメイドは\n怖くありません！"
10066-450-1 = "これも全部、先生が\n居てくれたおかげです。"
10066-460-1 = "先生と一緒なら……"
10066-470-1 = "アリスはどんな\nダンジョンでも\n攻略できますから。"
10066-480-1 = "はいっ！アリス、\n冒険の準備が\n整いました！"
10066-2600-1 = "これは……アリスと先生の\n力で強化した伝説の聖剣……！\nありがとうございます、先生！\nアリス、もっとメイドレベルを\n上げて、メイド勇者になります！"
