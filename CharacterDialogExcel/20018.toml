[translation]
20018-10-1 = "Blue Archive."
20018-20-1 = "SRT Academy, RABBIT Squad's Kazekura Moe. Heeheehee... I'll be your support."
20018-30-1 = "Should we designate this as our new base?"
20018-40-1 = "It's...weirdly safe here."
20018-50-1 = "Need...more candy..."
20018-60-1 = "Something important, like a launch button, might have fallen off..."
20018-70-1 = "Heehee..."
20018-80-1 = "Welcome, Sensei. You look busy as usual. Heeheehee."
20018-90-1 = "Oh, it's you, Sensei! You seem busy these days."
20018-100-1 = "I've got to replenish supplies for the RABBIT Squad...."
20018-110-1 = "Nom nom... Sugar is important. I can't give it up!"
20018-120-1 = "Ah... I wanna eat the inarizushi she makes..."
20018-130-1 = "Seriously... Why are candies not included in the basic supplies?"
20018-140-1 = "Sugar is like the fuel that keeps the operator going."
20018-150-1 = "Aren't you a busy bee. Need help?"
20018-160-1 = "You can count on me! Mostly... Heeheehee."
20018-170-1 = "Happy birthday, Sensei. On that note..."
20018-180-1 = "How about we have some extravagant fireworks to celebrate?"
20018-190-1 = "Birthday cake? No, no. Birthday fireworks is more like it."
20018-200-1 = "Yeah! Something flashy! Something that goes ka-boom! Heeheehee."
20018-210-1 = "I heard that Shanhaijing Academy has a custom where they set off fireworks to drive away demons..."
20018-220-1 = "I've never heard of a more beautiful custom. Heeheehee."
20018-230-1 = "This Christmas I'm gonna eat turkey with RABBIT Squad members."
20018-240-1 = "Huh? At the park where we always stay, of course."
20018-250-1 = "Hm? The Fire Safety Act...? What's that?"
20018-260-1 = "This jack-o'-lantern... Wouldn't it burn more nicely if I put in some white phosphorous powder..."
20018-270-1 = "*pant* *pant*"
20018-290-1 = "Sensei, there are many taboos in this world."
20018-300-1 = "Buttons that shouldn't be pressed, lines that shouldn't be crossed..."
20018-310-1 = "And choices that can lead you to irreversible destruction."
20018-320-1 = "You can lose everything with one wrong step."
20018-330-1 = "What would you choose, Sensei?"
20018-340-1 = "I know it's a meaningless question. You aren't tempted like I am."
20018-350-1 = "But I...might end up crossing the line."
20018-360-1 = "Because that moment of destruction is also the moment I prove myself."
20018-370-1 = "So, Sensei."
20018-380-1 = "Would you...like to cross the line with me?"
20018-2600-1 = "RABBIT Type 224 pistol received... Um, it's kinda small though. I need a little more ka-boom!"
