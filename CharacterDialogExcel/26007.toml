[translation]
26007-10-1 = "ブルーアーカイブ！"
26007-20-1 = "お、奥空アヤネです。\nど、どうでしょうか…こういう格好は、\n少し恥ずかしいですね。"
26007-30-1 = "こ、この格好でここに\nいるのは、ちょっと\n恥ずかしいですね…"
26007-40-1 = "あれ、\nみんなはどこに…？"
26007-50-1 = "どこかゆっくり\nできそうなところは…"
26007-60-1 = "ん…？\nあれは何でしょう…？"
26007-70-1 = "何だか、楽しく\nなっちゃいますね。"
26007-80-1 = "あっ、おかえりなさい、先生！"
26007-90-1 = "先生、お待ちしておりました。"
26007-100-1 = "えっと…\nど、どうされましたか…？"
26007-110-1 = "こ、この格好ですか？"
26007-120-1 = "え、えっと…\n夏っぽさを\n出してみようと…。"
26007-130-1 = "ど、どうですか？\nに、似合って\nますでしょうか…？"
26007-140-1 = "いつもあれをしなきゃ、\nこれをしなきゃって\n考えてばかりだったので…"
26007-150-1 = "何だかこういう\nゆったりした時間は、\n不思議な気分です。"
26007-160-1 = "この格好ですと、\n何だか気が緩んで\nしまいますね。"
26007-170-1 = "お誕生日\nおめでとうございます、\n先生！"
26007-180-1 = "先生と出会えたこと、\nこうしてゆっくりと\n過ごせること…\n本当に嬉しく思います。"
26007-190-1 = "せ、先生…その…\nき、今日は、えっと…"
26007-200-1 = "あっ…ありがとう、ございます。\nこうしていられるだけで\n嬉しいのに、誕生日まで\n祝ってもらって…"
26007-210-1 = "贅沢な一日です"
26007-220-1 = "新年あけまして\nおめでとうございます！"
26007-230-1 = "今年もたくさん、楽しいことが\nあるように願ってます！"
26007-240-1 = "メリークリスマス！\nな、何かリアクションを\n頂けないと、恥ずかしいです…"
26007-250-1 = "なるほど、ハロウィンだから\nみなさん仮装を…"
26007-260-1 = "あ、いえ、私のこれは\nそういう意味ではなく…！？"
26007-280-1 = "えっと、私はこの辺の、\n端っこに写っていれば\n良いでしょうか…？"
26007-290-1 = "こんな感じで、\n大丈夫ですかね…？"
26007-300-1 = "ど、どうすれば\nヘリが際立つんでしょう…？"
26007-310-1 = "すみません、こういうのは\nあまり慣れてなくって…"
26007-320-1 = "えっと…先生？\n修理の記念写真と\nいうことでしたら…"
26007-330-1 = "もっとヘリを\n中心に撮った方が\n良いのでは…？"
26007-340-1 = "…え、ヘリではなくて、\n私の記念写真…？"
26007-350-1 = "そ、そうだったんですか！？\nえぇっ！？"
26007-360-1 = "そ、それはその、いえ、\n嫌ではないですが…！"
26007-370-1 = "な、何だか急に、\n顔が熱く…っ"
26007-2600-1 = "こんなに凄いものを、私に…\n先生にはいつも、色んな物を\n頂いてばかりですね。少しでも\nお返しできるよう、引き続き頑張ります！"
