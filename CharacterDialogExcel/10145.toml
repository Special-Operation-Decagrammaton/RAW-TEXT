[translation]
10145-10 = "Blue Archive... สินะ ฮู่ว..."
10145-20 = "ฮู่ว... แดดแรงจริงเชียว\nนี่ ครู มาทางนี้..."
10145-30 = "ฮืม... อุณหภูมิช่าง\nน่าประหลาดเสียจริง..."
10145-40 = "โอ้ สิ่งนั้นมัน...?\nน่าสนใจจริงเชียว"
10145-50 = "นี่คงเป็นการพักผ่อน\nอีกแบบสินะ ดีจริงๆ"
10145-60 = "(จะมีที่ให้เรา\nเอนกายสักครู่มั้ยนะ...?)"
10145-70 = "กาแฟใส่นม... แม้เราจะชอบ\nแต่ซายะก็กำชับให้\nระวังเอาไว้..."
10145-80 = "รีบเข้ามาสิ ครู"
10145-90 = "เป็นอะไรไปเล่า?\nชุดว่ายน้ำนี่น่ะหรือ?"
10145-100 = "ก็คล้ายกับการบริการ\nเพื่อครูนั่นแหละ ฮุฮุ"
10145-110 = "อ๊ะ ครูนี่เอง"
10145-120 = "ที่นี่สบายอยู่เสมอเลยนะ\nนี่ก็เพื่อเพิ่มประสิทธิภาพ\nในการทำงานเช่นกันหรือ?"
10145-130 = "หมายความว่า แม้เราใส่\nชุดว่ายน้ำอยู่แบบนี้"
10145-140 = "ก็ไม่มีปัญหาใหญ่อะไรน่ะ\nฮุฮุ"
10145-150 = "สิ่งที่เราปรารถนาในตอนนี้หรือ?"
10145-160 = "อืม..."
10145-170 = "ออกเดินทางไปที่ไหนสักแห่ง...\nด้วยกันสองคนเช่นนี้เป็นไง?"
10145-180 = "แค่คุณกับเราสองคนเท่านั้น\nแน่นอนว่าแค่ไปพักร้อนกัน"
10145-190 = "หากวันนี้เราขอค้างคืน\nทั้งที่ยังแต่งกายเช่นนี้อยู่"
10145-200 = "คุณจะ... ทำเช่นไรเล่า?"
10145-210 = "ฮุฮุ อย่าตกใจถึงเพียงนั้นสิ\nเราล้อเล่นน่ะ"
10145-220 = "อย่างน้อยก็ตอนนี้ละนะ"
10145-230 = "อ่า~ รู้สึกว่า\nจะเริ่มเวียนหัวขึ้นมาเสียแล้ว"
10145-240 = "หากครูให้เรานั่งบนตัก\nแล้วลูบหัวให้ละก็"
10145-250 = "กายใจของเราคงสงบลง\nและดีขึ้นมากทีเดียว"
10145-260 = "อย่าแสร้งทำเป็นไม่ได้ยินสิ..."
10145-270 = "การเคร่งเครียดอยู่ตลอดเวลา\nย่อมไม่ดีต่อร่างกาย"
10145-280 = "หากคนเราไม่พักผ่อน\nย่อมต้องทรุดโทรม เช่นนั้นแล้ว..."
10145-290 = "คุณครู! ตอนนี้คิกิ\nอยากพักผ่อนกับคุณครูค่ะ!"
10145-300 = "ก็หมายความเช่นนั้นละ..."
10145-310 = "แม้ความร้อนของฤดูร้อน\nจะช่วยเติมพลังชีวิต"
10145-320 = "แต่หากมากเกินไป\nก็ย่อมก่อปัญหาได้เช่นกัน"
10145-330 = "เราเลยอยากให้ครูช่วย\nดับความร้อนของเราให้หน่อย"
10145-340 = "กำลังคิดสิ่งใดอยู่เล่า...? \nเราหมายถึงให้พัดให้ต่างหาก?"
10145-350 = "มีคำกล่าวว่า ควรระวัง\nเมื่อพูดคำว่า 'ทุกอย่าง'"
10145-360 = "แต่ว่าวันนี้ เรารู้สึก\nอยากทำ 'ทุกอย่าง'\nให้คุณเลยละ"
10145-370 = "ก็เพราะวันนี้\nคือวันเกิดของครูมิใช่หรือ?"
10145-380 = "เอาละ ครูปรารถนาสิ่งใดเล่า?"
10145-390 = "เรารู้สึกขอบคุณใน\nความเอาใจใส่ของครูเสมอเลย"
10145-400 = "โดยทั่วไปแล้ว การอวยพร\nระหว่างศิษย์กับครู"
10145-410 = "ย่อมต้องรักษาขอบเขต\nและธรรมเนียมเอาไว้บ้าง..."
10145-420 = "แต่เราก็ไม่ได้เป็น\nคนเรื่องมากอะไรนัก\nเช่นนั้นก็ทำตามที่ปรารถนาเถิด"
10145-430 = "ปีใหม่แล้วสินะ"
10145-440 = "ยิ่งมีความสัมพันธ์ใกล้ชิดกัน\nก็ยิ่งไม่ควรลืม\nมารยาทต่อกัน"
10145-450 = "เราขอให้พรแห่งปีใหม่\nสถิตอยู่กับครูเสมอ"
10145-460 = "จริงสิ วันคริสต์มาสแล้วสินะ"
10145-470 = "เด็กดีจะได้ของขวัญ\nส่วนเด็กไม่ดี\nจะได้ถ่านหิน... ใช่หรือไม่นะ?"
10145-480 = "ปีนี้คิกิเป็นเด็กดีใช่มั้ยคะ?\nคุณครูคิดว่ายังไงคะ?"
10145-490 = "เป็นเด็กดีเลยละ..."
10145-500 = "ฮาโลวีน... ในแง่หนึ่งคือวันแห่ง\nภูตผีและสิ่งเหนือธรรมชาติ\nหรือเปล่า?"
10145-510 = "ไม่รู้ว่าเพราะชุดว่ายน้ำ\nหรือเพราะเหตุอื่น\nเราเลยรู้สึกหนาวสั่นขึ้นมานิดหน่อย"
10145-520 = "วันนี้ให้เราอยู่ข้างกาย\nระหว่างทำงาน ก็ดูไม่เลวนะ?"
10145-540 = "เป็นอย่างไรเล่า ครู"
10145-550 = "ทิวทัศน์ที่เคยเต็มไปด้วยสีสัน\nบัดนี้มัน..."
10145-560 = "อืม ดูสะอาดตาขึ้นมากทีเดียว"
10145-570 = "สายน้ำ ลำธาร\nม่านหมอก ยอดเขา..."
10145-580 = "ทว่ามีเพียงครูเท่านั้น\nที่ปรากฏอยู่ในสายตาของเรา"
10145-590 = "แล้วในดวงตาของคุณ\nกำลังสะท้อนสิ่งใดอยู่เล่า?"
10145-600 = "ในบรรดาทิวทัศน์นี้ มีเพียงเรา"
10145-610 = "ที่สลักอยู่ในดวงตาของคุณ\nเช่นเดียวกับของเราหรือเปล่า?"
10145-620 = "ฮุฮุ... เคยได้ยิน\nเรื่องเล่าเช่นนี้หรือไม่?"
10145-630 = "ว่ากันว่านางฟ้าจะโต้สายลม...\nและร่ายรำอยู่บนท้องฟ้า\nดุจดั่งขนนก"
10145-640 = "เอาละ\nสูดลมหายใจเข้าสิ ครู"
10145-650 = "แม้จะเพียงแค่เล็กน้อย"
10145-660 = "แต่ครูอาจสัมผัสได้ถึง\nตัวเราจากในนั้นก็เป็นได้"
10145-2600 = "ครูคิดว่าสิ่งที่สถิตอยู่ในนี้\nคือสิ่งใดหรือ?\nสำหรับเรา... มันคือสายสัมพันธ์\nอันไม่เปลี่ยนแปลงระหว่างเราสองคน"
