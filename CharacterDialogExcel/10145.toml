[translation]
10145-10-1 = "蔚藍檔案，啊……呵呵。"
10145-20-1 = "呼呣……這陽光真強啊。\n來，老師，到這邊來……"
10145-30-1 = "呼呣，\n真是不可思議的\n氣溫呢……"
10145-40-1 = "哦？那是……？\n真有意思啊。"
10145-50-1 = "休息呢。\n著實舒暢啊。"
10145-60-1 = "（能躺下的地方在……）"
10145-70-1 = "咖啡牛奶……\n不過，咖啡因一事\n才剛遭沙耶唸過呢。"
10145-80-1 = "汝來了啊，老師。"
10145-90-1 = "嗯？啊啊，這身泳裝嗎……"
10145-100-1 = "可說是為汝\n所準備的福利吧。\n呵呵。"
10145-110-1 = "汝來得正好呢，老師。"
10145-120-1 = "此處總是舒適宜人呢。\n這也是為了\n提升業務效率嗎？"
10145-130-1 = "即便是這身打扮\n也不以為苦……"
10145-140-1 = "妾身是在問\n是否真是如此。\n呵呵，真是個\n壞心眼的大人呢。"
10145-150-1 = "妾身的願望……？"
10145-160-1 = "呼呣……"
10145-170-1 = "……二人就此，\n同往他處走走如何？"
10145-180-1 = "就汝與妾身二人。\n當然，是去避暑哦。"
10145-190-1 = "倘若妾身就此\n欲求借宿一夜……"
10145-200-1 = "汝，會怎麼做呢？"
10145-210-1 = "呵呵……\n別那麼驚訝，\n開個玩笑罷了。"
10145-220-1 = "目前是如此。"
10145-230-1 = "嗯……有些目眩。\n啊啊……這是──"
10145-240-1 = "若汝不為妾身膝枕，\n並摸摸妾身的頭……"
10145-250-1 = "總覺得是治不好的呢？"
10145-260-1 = "……裝作毫不知情\n可是行不通的哦？"
10145-270-1 = "若始終繃緊心神，\n對身子可不好。"
10145-280-1 = "適時休息也是要緊的……\n換言之──"
10145-290-1 = "老師！\n妃妃想和老師一起休息！"
10145-300-1 = "……便是這麼回事。"
10145-310-1 = "夏日的暑氣\n雖能為身體\n帶來活力……"
10145-320-1 = "然而凡事過猶不及啊。"
10145-330-1 = "吶，老師。\n能將妾身的熱意──\n平復下來嗎？"
10145-340-1 = "呵呵，汝那是何等表情啊。\n只需拿團扇替妾身搧搧風，\n如此便足夠了哦？"
10145-350-1 = "言語一經出口\n便具有強烈的意義。\n至於妾身所言，\n自是不言而喻。"
10145-360-1 = "不過──說得也是。\n僅限今日，妾身可為\n汝做「任何」事。"
10145-370-1 = "畢竟今日，\n是汝的生日啊。"
10145-380-1 = "來，將汝的願望說出口吧。\n「任何」願望\n妾身皆能替汝實現。"
10145-390-1 = "妾身對老師始終心存感激。"
10145-400-1 = "啊啊，對了──\n師徒間每逢喜事之際……"
10145-410-1 = "妾身聽聞是有禮法的。"
10145-420-1 = "不過，\n妾身並非那般講究。\n汝隨意便可。"
10145-430-1 = "是新年呢。"
10145-440-1 = "縱使情誼深厚，\n亦不可忘了禮節。"
10145-450-1 = "今年亦是碩果累累之年，\n妾身如此衷心祈願"
10145-460-1 = "是聖誕節呢。"
10145-470-1 = "好孩子能收穫禮物，\n壞孩子則收穫煤炭……\n是這麼說的吧。"
10145-480-1 = "妃妃今年也是好孩子吧？\n老師覺得呢？"
10145-490-1 = "……是好孩子，對吧？"
10145-500-1 = "萬聖節……\n又名為摩訶不思議之日，\n倒也未嘗不可呢。"
10145-510-1 = "不知是因這身打扮嗎，\n抑或另有緣由……\n總覺得有些寒意呢。"
10145-520-1 = "呵呵，是啊……\n能否替妾身暖和暖和呢？"
10145-540-1 = "如何，老師。"
10145-550-1 = "那般絢麗多彩的景觀──\n如今成了這副模樣。"
10145-560-1 = "唔呣，愈發洗鍊了呢。"
10145-570-1 = "河、水、霧、山……"
10145-580-1 = "以及老師……\n唯有汝映入妾身眼中。"
10145-590-1 = "汝的眼中映照著什麼呢？"
10145-600-1 = "在妾身與這片景色之中……"
10145-610-1 = "汝可曾將妾身，\n囚禁於那雙眼眸之中？"
10145-620-1 = "呵呵……汝是否\n曾聽聞這番逸事？"
10145-630-1 = "仙女乘著風──\n如羽翼般漫舞於天際。"
10145-640-1 = "試著閉上眼深吸\n一口氣吧，老師。"
10145-650-1 = "如此一來，在那之中──"
10145-660-1 = "或許能感受到妾身也說不定哦？"
10145-2600-1 = "老師認為寄託於這件武器之中的意義為何？\n……妾身認為，象徵著兩人始終如一的羈絆哦。"
