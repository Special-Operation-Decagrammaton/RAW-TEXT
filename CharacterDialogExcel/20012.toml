[translation]
20012-10-1 = "Blue Archive."
20012-20-1 = "I'm Himuro Sena, president of Gehenna's Medical Emergency Club. A pleasure to meet you."
20012-30-1 = "Hmm... Everything seems fine here."
20012-40-1 = "Any corp—I mean. Is anyone injured?"
20012-50-1 = "This looks like a good place to take a break."
20012-60-1 = "I don't mind something like this every once in a while."
20012-70-1 = "Where are you, Sensei...?"
20012-80-1 = "Welcome, Sensei. I've been waiting for you."
20012-90-1 = "Everything is ready. Just let me know, Sensei."
20012-100-1 = "You called for me?"
20012-110-1 = "It's fine if it's not anything big, even if it's just a personal matter."
20012-120-1 = "My club's basic purpose is to respond to medical emergencies, including surgical ones."
20012-130-1 = "We don't attend to common ailments such as colds."
20012-140-1 = "I'm used to waiting."
20012-150-1 = "And I'm used to being called suddenly."
20012-160-1 = "Being in this position..."
20012-170-1 = "...means that you're trusted."
20012-180-1 = "It's smart to rest when you have a chance and there's nothing else to do."
20012-190-1 = "Happy birthday, Sensei."
20012-200-1 = "I hope today passes without incident."
20012-210-1 = "I just remembered today is my birthday."
20012-220-1 = "Not that it holds any significance."
20012-230-1 = "You're...wishing me a happy birthday?"
20012-240-1 = "Thank you. I'm happy to hear that."
20012-250-1 = "It's already time for the new year."
20012-260-1 = "I look forward to working with you this year too, Sensei."
20012-270-1 = "Christmas is great time of year..."
20012-280-1 = "...but we tend to be busier than usual."
20012-290-1 = "If it's a day for gift giving, I just want my gift to be time alone..."
20012-300-1 = "I mean, maybe some time alone for the two of us."
20012-310-1 = "Trouble typically arises on days such as today. I have to be more alert."
20012-330-1 = "I don't have much, but would you like some? All I have is food from a convenience store."
20012-340-1 = "There isn't time to go anywhere when I'm on standby, so this is the best I can do."
20012-350-1 = "Anyway, Sensei. What brings you here? It's out of your way."
20012-360-1 = "Huh? You came to check on me because I looked exhausted?"
20012-370-1 = "So that's why. Of course."
20012-380-1 = "Now I understand. Thank you for checking on me, Sensei."
20012-390-1 = "I wasn't really expecting you to come here..."
20012-400-1 = "...but I'm always happy to be with you."
20012-2600-1 = "The equipment has been transferred. We'll be able to provide more support now. We look forward to working with you."
