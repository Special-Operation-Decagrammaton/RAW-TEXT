[translation]
10039-10-1 = "B-Blue...Archive..."
10039-20-1 = "Th-This is SRT Academy. RABBIT Squad's Kasumizawa Miyu... Umm... May I please...go b-back...?"
10039-30-1 = "Oh, um..."
10039-40-1 = "(I want to start a conversation first...but I'm scared...)"
10039-50-1 = "(I want a cup of hot chocolate...)"
10039-60-1 = "(I knew a useless crybaby like me didn't belong here...)"
10039-70-1 = "Wh-What about the cover...?"
10039-80-1 = "Th-Thanks for your hard work, Sensei..."
10039-90-1 = "Please tell me when a good time is... I-I'm really good at waiting..."
10039-100-1 = "Um, Sensei... D-Do you remember me?"
10039-110-1 = "It's always h-hard for me to make new f-friends..."
10039-120-1 = "I wish the RABBIT Squad members got along b-better..."
10039-130-1 = "I w-wish I was stronger...like th-the others..."
10039-140-1 = "I'm as useless as a p-pebble on the street..."
10039-150-1 = "I-I don't know how I even g-got into SRT Academy..."
10039-160-1 = "S-Sensei... Today's your b-birthday..."
10039-170-1 = "I'm homeless, so I couldn't g-get you anything..."
10039-180-1 = "B-But... Happy Birthday...!"
10039-190-1 = "H-Huh? My b-b-birthday?"
10039-200-1 = "H-How...did you remember that...? Wow..."
10039-210-1 = "Th-Thank you... I'm so happy...!"
10039-220-1 = "I w-wanna go home...back to the SRT this year..."
10039-230-1 = "I-I heard Santa Claus...doesn't give bad kids p-presents..."
10039-240-1 = "S-Santa Claus probably forgot I exist..."
10039-250-1 = "I w-wore a ghost costume at a Halloween festival once..."
10039-260-1 = "B-But no one cared I was there..."
10039-280-1 = "Phew... Take a breath..."
10039-290-1 = "Focus on the target..."
10039-300-1 = "The distance is 1,150 meters...wind is from the northeast, fifteen knots."
10039-310-1 = "If I correct the error caused by temperature and humidity..."
10039-320-1 = "U-Um... Sensei. S-Stop playing around...p-please..."
10039-330-1 = "That's...! I can't focus on aiming..."
10039-340-1 = "...Oh. I-It's not interference?"
10039-350-1 = "Y-You're training me for a-actual combat..."
10039-360-1 = "I think w-we did this at SRT..."
10039-370-1 = "E-Eek...?!"
10039-380-1 = "S-Sensei...! Y-You're b-b-breathing in m-my ear...!!"
10039-390-1 = "(Sensei's breath is...so close...!)"
10039-400-1 = "(I-I can't aim...)"
10039-2600-1 = "RABBIT Type 39 rifle received. H-Heavy..."
