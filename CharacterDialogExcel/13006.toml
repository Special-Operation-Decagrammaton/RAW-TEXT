[translation]
13006-20-1 = "Ta-da! I'm finally here! All right, Sensei, let's have some fun!"
13006-30-1 = "As long as it's fun, it's okay."
13006-40-1 = "Hmm? That doesn't look half-bad either!"
13006-50-1 = "Heehee! ♥"
13006-60-1 = "One head pat, please!"
13006-70-1 = "Let's play together!"
13006-80-1 = "Hello, Sensei! I'm here to give YOU a lesson!"
13006-90-1 = "What kind of mission are we doing today? Let's start with something fun!"
13006-100-1 = "What should we do for fun today, Sensei?"
13006-110-1 = "What? You're busy? Can't you do work stuff some other time?"
13006-120-1 = "Should we pick up where we left off last time?"
13006-130-1 = "That was fun...wasn't it?"
13006-140-1 = "Heehee! It's funny seeing you get all embarrassed. ♥"
13006-150-1 = "Huh? Was I teasing you too much? I hope I don't get in trouble..."
13006-160-1 = "Wait, it's your birthday, Sensei?! We have to celebrate the occasion!"
13006-170-1 = "We can throw a party at the Problem Solver office!"
13006-180-1 = "Today's my birthday!"
13006-190-1 = "Sensei... You'll spend it with me...riiight?"
13006-200-1 = "We'll have even more fun this year than we did last year!"
13006-210-1 = "Heehee, I can't wait! ♥"
13006-220-1 = "Drum roll, please! Your Christmas present is...me!"
13006-230-1 = "Want to unwrap your present? Heeheehee!"
13006-240-1 = "You know how this works! Trick or treat!"
13006-250-1 = "Huh? You're giving me a treat? I'm more of a trick kind of gal, though."
13006-270-1 = "Ah, what a shame. Looks like I've finally been caught! ♪"
13006-280-1 = "Sensei. Today's cute client was none other than me!"
13006-290-1 = "Honestly, though, I can't take care of a Problem Solver mission all by myself."
13006-300-1 = "What do you think, Sensei? My prank worked flawlessly, didn't it?"
13006-310-1 = "What's up with that dumbfounded look? It's so funny! Ahaha! ♪"
13006-320-1 = "We did a lot of fun stuff today."
13006-330-1 = "We ate crepes, stopped by a theme park, and we were partners in crime at the library!"
13006-340-1 = "Ah... I could've had you tricked the whole time. What a shame!"
13006-350-1 = "But next time, I'll be sure to keep you fooled until the end! Look forward to it!"
13006-360-1 = "Ah, I had so much fun today!"
13006-2600-1 = "Sensei! Look! Look! This weapon seems really powerful, and it's cute!"
