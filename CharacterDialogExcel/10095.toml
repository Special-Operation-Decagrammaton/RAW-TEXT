[translation]
10095-10-1 = "Blue, Archive."
10095-20-1 = "I tried becoming a maid today... Nice to meet you... Master."
10095-30-1 = "A maid cafe... It really is too cliché."
10095-40-1 = "Lots of elements I can use as a motif..."
10095-50-1 = "It'd be hard to clean here..."
10095-60-1 = "Would a maid that games be a fresh idea? Maybe not...?"
10095-70-1 = "You think I could get something like a part-time job here?"
10095-80-1 = "Welcome, Sensei! I missed you! What can I do for you today?"
10095-90-1 = "Welcome, Master! I missed you! What would you like me to do today?"
10095-100-1 = "While I'm in this maid uniform, I'll become the perfect maid."
10095-110-1 = "And what any good maid needs...is a \"master\"!"
10095-120-1 = "Um... Does it suit me?"
10095-130-1 = "...Cute, you said?"
10095-140-1 = "Hearing that makes me...happy. Heehee."
10095-150-1 = "There were lots of different reasons that led to me putting on a maid uniform..."
10095-160-1 = "But I don't regret it. Since you're looking at me now."
10095-170-1 = "If it's organizing Schale's office, I'll put in my all! I'll be at least ten times more meticulous than I am with our club room!"
10095-180-1 = "Huh? I should put in the same amount of effort into keeping the club room organized...?"
10095-190-1 = "My heart starts racing on my duty days. About an hour before I start serving as Student Rep, I can't help but feel excited and happy."
10095-200-1 = "Today is Master's birthday, right?"
10095-210-1 = "Heehee. Remembering my master's birthday is also a part of my maid responsibilities."
10095-220-1 = "Birthdays are typically spent with families..."
10095-230-1 = "But...today...just for today...I want to spend it with you, Sensei..."
10095-240-1 = "Happy New Year, Sensei."
10095-250-1 = "Will you go with me to make a wish? Only if you don't mind."
10095-260-1 = "Christmas... Is there anything you want to eat?"
10095-270-1 = "Apparently, maids make special dishes during celebrations like today."
10095-280-1 = "...Cooking isn't my forte, but I'll do my best."
10095-290-1 = "Someone told me my maid costume is too basic for Halloween...but it's not even a costume!"
10095-310-1 = "I'm...sorry...Master!"
10095-320-1 = "I made another mistake and...fell over..."
10095-330-1 = "But...don't worry about me. Reprimand me as you will, Master..."
10095-340-1 = "No matter what... I'll accept it..."
10095-350-1 = "What...do you think?"
10095-360-1 = "B-But...this is the scenario we're in!"
10095-370-1 = "I'm the one who asked you to...do this..."
10095-380-1 = "Umm, Sensei?"
10095-390-1 = "Did you find today's maid experience with Midori...satisfying?"
10095-2600-1 = "Pen, cleaning supplies, guns... They're all similar in that they're tools. And with better tools, I can get more done. Thank you, Master. I will never, ever forget this."
