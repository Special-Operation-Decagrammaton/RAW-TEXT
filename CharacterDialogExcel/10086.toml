[translation]
10086-10-1 = "ブルーアーカイブ。"
10086-20-1 = "ゲヘナ学園所属、風紀委員長の空崎ヒナ。\nその……先生が選んでくれたドレスを着て、\nみたんだけど。似合って、るかな……？"
10086-30-1 = "ドレスだと、\n少し落ち着かない……"
10086-40-1 = "どこかに座って、\n練習したいところ\nだけど……"
10086-50-1 = "みんな\nキラキラしてる。"
10086-60-1 = "ふぅ、なんだか\n少し疲れる……"
10086-70-1 = "風紀委員長として、\n気を引き締めないと。"
10086-80-1 = "いらっしゃい。先生。\n何か手伝うことは\nあるかしら？"
10086-90-1 = "あ、先生。\nここ。ここよ。"
10086-100-1 = "え？ん？\nか、可愛い？"
10086-110-1 = "あ、ありがとう……\nそ、その……"
10086-120-1 = "この、ドレス……\n先生が選んでくれたんだね。"
10086-130-1 = "……すごく綺麗だけど、\nやっぱり私には……"
10086-140-1 = "……え？\nよく似合ってる……って？"
10086-150-1 = "な、何を言ってるの、\n先生……！？"
10086-160-1 = "最近はピアノの\n練習をしてるの。"
10086-170-1 = "久しぶりに風紀委員の\n業務以外に打ち込んでるから、\nちょっと新鮮かも。"
10086-180-1 = "ドレスを着ると、\nちょっとだけ背筋が伸びるの。"
10086-190-1 = "だからなのかな、\nいつもより少しだけ、\nドキドキする。"
10086-200-1 = "ドレスを着てても、私は私。\n今日も先生の仕事を、\n隣でサポートする。"
10086-210-1 = "だから……\n逃げちゃダメよ。"
10086-220-1 = "「厳しいけど、やっぱり\nヒナは可愛い」って……。"
10086-230-1 = "うっ、本当にな、な、何を\n言ってるの。あなたは。"
10086-240-1 = "……そりゃ、嬉しいけど、\nで、でも……もう。"
10086-250-1 = "お誕生日おめでとう、先生。"
10086-260-1 = "その……今日のために\n練習した曲があるの。\nよかったら……聞いてくれる？"
10086-270-1 = "……むしろ自分から\nお願いしたいくらい、って。"
10086-280-1 = "そ、そういってもらえるような\nものでは……いや。"
10086-290-1 = "あなたのために\n用意した曲だから。\n私、全力で演奏するね。"
10086-300-1 = "あ、今日は私の誕生日、か。\nそういえばそう、だった。"
10086-310-1 = "祝ってくれて、\nありがとう。先生。"
10086-320-1 = "欲しいもの？そうだね……"
10086-330-1 = "先生がこうして\n来てくれるだけで\n十分……かな。"
10086-340-1 = "いつもありがとう、先生。"
10086-350-1 = "また年が明けたね。\n明けましておめでとう。先生。"
10086-360-1 = "こうして新たな年をあなたと\n積み重ねていくんだね。"
10086-370-1 = "ふふ。私にとっては\nとても嬉しいことよ。"
10086-380-1 = "メリークリスマス、先生。"
10086-390-1 = "今日という日はドレス姿で\nあなたと一緒にいても、\n浮かないかな？"
10086-400-1 = "え……？\nドレスに相応しい場所に……\n行ってみよう？"
10086-410-1 = "え、えっと、先生……\nちょ、ちょっと……！？"
10086-420-1 = "ハロウィンだね。\nトリックオアトリート。"
10086-430-1 = "今日だけは、\nあなたにいたずらをしても……\nいいかな？"
10086-450-1 = "これから……\n先生のために演奏するね。"
10086-460-1 = "あ、いや、あの時は……\nふ、2人きりじゃ、\nなかったから……"
10086-470-1 = "その……ピアノを\nずっと練習してたのは……"
10086-480-1 = "先生に聞かせるためで……"
10086-490-1 = "このまま、\n披露できなかったら……\n絶対、後悔しそうだったから。"
10086-500-1 = "う、うん？\nいや、そ、そんなに\nすごいことじゃない、よ……"
10086-510-1 = "そういう風に期待されると……\nちょっと困るかも。"
10086-520-1 = "あ……\nう、うーん……"
10086-530-1 = "そう……あなたは、\nいつもそうだった。"
10086-540-1 = "うん……じゃあ、\nちゃんと聞いててね。"
10086-550-1 = "……あなたに送る、\n私の演奏を。"
10086-2600-1 = "これを、私に……ありがとう。先生。\nいつもあなたが私にくれる言葉、信頼。\nそのまっすぐな心に、私もまっすぐに応えたい。だからどうか、最後まで見守ってて。"
