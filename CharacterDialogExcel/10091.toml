[translation]
10091-10-1 = "Ah, ah... Blue Archive."
10091-20-1 = "A vocalist... Well, since it's come to this, I'll do my best. Looking forward to working with you, Sensei."
10091-30-1 = "Whoa... There's a crowd! I wonder if it'll be okay here?"
10091-40-1 = "I'd stick out if I sing here, no?"
10091-50-1 = "Singing made me hungry."
10091-60-1 = "I don't stand out, right? ...Well, maybe I'm worrying too much."
10091-70-1 = "Where...is everyone?"
10091-80-1 = "You're here, Sensei. What do you think? Does it look good?"
10091-90-1 = "Ah, Sensei! Here, over here!"
10091-100-1 = "Considering the occasion... Want me to sing something?"
10091-110-1 = "G-Gotcha... It was just a joke, okay?"
10091-120-1 = "Hm? This mask?"
10091-130-1 = "...Ah, it's not what you think, Sensei."
10091-140-1 = "This is actually more comfortable than I expected."
10091-150-1 = "Maybe I'll start wearing it as one of my casual outfits too..."
10091-160-1 = "Practicing here..."
10091-170-1 = "...would be a nuisance, I suppose."
10091-180-1 = "Sensei, it's your birthday today, right?"
10091-190-1 = "If it's not a bother, do you want to go karaoke somewhere..."
10091-200-1 = "...w-with me?"
10091-210-1 = "Uh... I-I was thinking, maybe I could sing you a happy birthday song...or something."
10091-220-1 = "Today's my birthday."
10091-230-1 = "So... Sensei... Could you sing \"that\" for me?"
10091-240-1 = "Happy New Year, Sensei."
10091-250-1 = "Looking forward to working together this year too, Sensei."
10091-260-1 = "Christmas... Was I a good girl this year?"
10091-270-1 = "Halloween? Ah... No wonder it's been so loud."
10091-280-1 = "Sensei... Don't you have something to give me?"
10091-300-1 = "...Now, hurry!"
10091-310-1 = "Say \"ah\"! Before it drops!"
10091-320-1 = "If you don't eat it, then I can't have mine either!"
10091-330-1 = "Now, say \"ahhh\"!!"
10091-340-1 = "...Huh?"
10091-350-1 = "It's fine? For me to have mine first...?"
10091-360-1 = "Huh...? This spoon, it's mine?"
10091-370-1 = "...Hm? ...Huh?"
10091-380-1 = "Spoon...? Mine...?"
10091-390-1 = "...Ah."
10091-400-1 = "Whoaaa! Forget what I just said!"
10091-2600-1 = "Seriously, how did it end up like this? Heehee... This is a little off topic, but I'm really glad that I met you, Sensei. So...thank you."
