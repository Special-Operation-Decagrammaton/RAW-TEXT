[translation]
10091-10-1 = "あ、あー……ブルーアーカイブ。"
10091-20-1 = "ボーカルか……まぁ、こうなった以上頑張るよ。\nよろしくね、先生。"
10091-30-1 = "うわっ……人多っ！\n大丈夫？ここ。"
10091-40-1 = "ここで歌ったら\n浮いちゃうよね？"
10091-50-1 = "ちょっと歌ったら、\nお腹空いてきたな。"
10091-60-1 = "目立ったりしないよね？\n……まぁ、考えすぎか。"
10091-70-1 = "みんな、どこに\n居るんだろ。"
10091-80-1 = "来たんだ、先生。\nどう？似合ってる？"
10091-90-1 = "あ、先生！こっち、こっち！"
10091-100-1 = "せっかくだから……\n一曲、歌ってあげようか？"
10091-110-1 = "な、なんてね……\n冗談、冗談。"
10091-120-1 = "ん？マスク？"
10091-130-1 = "……ああ、先生が思ってる\nようなのとは違うよ。"
10091-140-1 = "思ったより\n動きやすいね、これ。"
10091-150-1 = "普段着のレパートリーに\n入れようかな。"
10091-160-1 = "ここで練習を……"
10091-170-1 = "……するのは、\n流石に迷惑だよね。"
10091-180-1 = "先生、今日誕生日だよね？"
10091-190-1 = "良かったら、\n一緒にカラオケでも……"
10091-200-1 = "い、行きませんか？"
10091-210-1 = "その……\nお、お祝いの歌でも\n歌おうかなぁ……って。"
10091-220-1 = "今日は私の誕生日なんだ。"
10091-230-1 = "その……先生……\n「あれ」歌ってくれない？"
10091-240-1 = "あけましておめでと\nうございます。先生。"
10091-250-1 = "今年も宜しくお願いします。"
10091-260-1 = "クリスマス、か……\n私、今年はいい子だったかなぁ？"
10091-270-1 = "ハロウィン？あぁ……\nどうりで騒がしいと思ったら。"
10091-280-1 = "先生……私に何か渡すもの、\nあるんじゃない？"
10091-300-1 = "……ほら、早く！"
10091-310-1 = "あ～んして！\n落ちる前に！"
10091-320-1 = "先生が食べてくれないと、\n私も食べらんないから！"
10091-330-1 = "はい、あ～ん！"
10091-340-1 = "……え？"
10091-350-1 = "大丈夫？先に食べて……？"
10091-360-1 = "え……？このスプーン、\nカズサのだし？"
10091-370-1 = "……へ？\n……あれ？"
10091-380-1 = "スプーン……？\n私の……？"
10091-390-1 = "……あ。"
10091-400-1 = "うわああああぁ！？\n今のナシ！"
10091-2600-1 = "ほんと、まさかこんなことになるなんて。\nふふ……今更だけど、先生に会えて本当に\n良かった。……ありがとうございます。"
