[translation]
13009-10-1 = "Blue...Archive..."
13009-20-1 = "I thought this moment...was a dream. Hello, Sensei. I'll be working with you from now on."
13009-30-1 = "This place is so comfy that I could see myself taking a nap here."
13009-40-1 = "It feels like I'm dreaming. I wonder why..."
13009-50-1 = "Ahahaha! Ah, whew... All that laughing made me sleepy."
13009-60-1 = "Wow! I think I can get a good rest here."
13009-70-1 = "Heeheehee. A new pillow should be arriving soon. I can't wait."
13009-80-1 = "Ahahaha! In the dream I just had, Sensei was... Oh my goodness, it was too funny! Ahaha!"
13009-90-1 = "Ahahaha! I slept great. Hmm? You've never seen me like this before?"
13009-100-1 = "*yawn* G'morning, Sensei."
13009-110-1 = "Huh? It's not morning?"
13009-120-1 = "Who cares...?"
13009-130-1 = "Zzz. Sorry, Sensei... I think I need some more sleep."
13009-140-1 = "Do you wanna lie down too...Sensei?"
13009-150-1 = "*yawn* Huh? When did you get here, Sensei?"
13009-160-1 = "Now's the perfect time for a nap..."
13009-170-1 = "I think we'd both be more productive...after a good nap."
13009-180-1 = "What am I never able to get a good night's rest?"
13009-190-1 = "Heh heh. Should I tell you, Sensei?"
13009-200-1 = "Well..."
13009-210-1 = "It's hard to sleep when I know that I get to see you when I wake up."
13009-220-1 = "I'm so happy."
13009-230-1 = "(I wish this moment could last forever. I feel so comfy.)"
13009-240-1 = "Happy birthday, Sensei."
13009-250-1 = "Care to take a celebratory birthday nap? *yawn* You can use my lap as a pillow."
13009-260-1 = "Today is...my birthday?"
13009-270-1 = "What better way to celebrate than by sleeping in more?"
13009-280-1 = "Happy New Year. My resolution is to wake up earlier this year."
