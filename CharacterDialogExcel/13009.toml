[translation]
13009-10-1 = "ブルー…アーカイブ…"
13009-20-1 = "夢かと思った、今この瞬間…。\nこんにちは。先生。\nこれからよろしくね。"
13009-30-1 = "なんだか眠たくなるような\nのんびりとした空間だね～"
13009-40-1 = "夢を見てる気分なの。\nなんでだろう？"
13009-50-1 = "あはは！\nあー…笑ったら\n眠くなった。"
13009-60-1 = "わ～ここなら\nゆっくりできそう～"
13009-70-1 = "うふふふっ。\n新しい枕が届くよ。\n楽しみすぎる。"
13009-80-1 = "あはは！さ、さっき…！\n夢で…先生が…\nああ、もうダメ、\n面白すぎる！あはは。"
13009-90-1 = "あはは！あ～よく寝た！\nうん？そんな姿を\n見るのは初めて？"
13009-100-1 = "ふぁ～。\nおはよう…先生。"
13009-110-1 = "え？朝じゃない？"
13009-120-1 = "別にいいでしょ～"
13009-130-1 = "ふあ。先生…ごめん…\nもうちょっと寝る。"
13009-140-1 = "先生も…ここに横になる？"
13009-150-1 = "ふあー…あれ？\n先生。来てた？"
13009-160-1 = "昼寝にちょうど\nいい時間なのに…"
13009-170-1 = "一旦寝て起きたら、もっと\n仕事も捗るんじゃないかな？"
13009-180-1 = "夜に何をしてたら\nそんなに眠いのかって？"
13009-190-1 = "ふふっ。先生になら\n教えてあげようかな～"
13009-200-1 = "ふぁ…ん…。"
13009-210-1 = "起きてから一番\n初めに会う人が\n先生だとは"
13009-220-1 = "…いいね。"
13009-230-1 = "（このまま時間が止まって\nほしい。なんだか、\nすごく心地いい気持ち）"
13009-240-1 = "お誕生日おめでとう先生。"
13009-250-1 = "私が膝枕してあげるから\nひと眠りする？"
13009-260-1 = "今日が…\n私の誕生日…？"
13009-270-1 = "記念にもっと寝ないと…\nそれがいいね。"
13009-280-1 = "明けましておめでとう。\n今年はもうちょっと\n頑張って起きてるね。"
13009-290-1 = "クリスマスは好き…。"
13009-300-1 = "百鬼夜行では少し\n珍しい祭りだけど"
13009-310-1 = "たくさんの人が\n幸せそうな顔をする、\n聖なる夜だからね。"
13009-320-1 = "今日は、眠るには\nもったいない日だね。"
13009-330-1 = "街に出ようよ、先生。"
13009-340-1 = "きっと起きてても、\n夢を見てるような\n気分になれるから。"
13009-360-1 = "先生…\n来てくれたんだね…"
13009-370-1 = "うん、今は修行中…。\n座禅をしてた…。"
13009-380-1 = "居眠りしてたんじゃないの、\nって…？"
13009-390-1 = "違うよ…。\nこれも、れっきとした、\n修行の一環だから…。"
13009-400-1 = "近場にこんな、\n修行にぴったりの場所が\nあったなんて…。"
13009-410-1 = "幸せ。まるで、\n夢を見てるみたいな\n気分…。"
13009-420-1 = "この幸せも、全部、\n先生のお陰なのかな…？"
13009-430-1 = "ん…ほら、\n先生もそんな\nところにいないで、"
13009-440-1 = "私と一緒に…。"
13009-450-1 = "…寝よ？"
13009-2600-1 = "この武器は……夢なのかな……\nずっと願ってたことが、叶った。"
