13009-300-1 = "It's not a typical holiday in Hyakkiyako..."
13009-310-1 = "...but it's still a holy night that many people find joy during."
13009-320-1 = "It'd be a waste to sleep today."
13009-330-1 = "Let's go outside, Sensei."
13009-340-1 = "It's going to feel like a dreamscape, even when we're awake."
13009-360-1 = "Sensei. You're here..."
13009-370-1 = "Yup. It's training. I was meditating..."
13009-380-1 = "You think I was just dozing off...?"
13009-390-1 = "Not at all. This is all part of my training..."
13009-400-1 = "I didn't expect to find such a good training spot nearby."
13009-410-1 = "I'm so happy. It feels like a dream..."
13009-420-1 = "Am I this happy thanks to you, Sensei?"
13009-430-1 = "Mmm! Don't just stand there, Sensei."
13009-440-1 = "Let's lie down and..."
13009-450-1 = "...nap together."
13009-2600-1 = "This weapon is... Is this a dream? My dream came true, then."
