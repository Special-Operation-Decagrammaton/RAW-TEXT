[translation]
20001-10-1 = "Blue Archive"
20001-20-1 = "Originally, Millennium was my master, but starting today...you're my master, Sensei."
20001-30-1 = "*sigh* I hate having to study math. I'm so sick of numbers."
20001-40-1 = "What a nice place. Someday, I'd love to... Oh! D-Did you hear that just now?!"
20001-50-1 = "Taking a rest is sometimes important too."
20001-60-1 = "Cute things? Sure, I like them. A lot. Is there something wrong with that?"
20001-70-1 = "Neru and Asuna always take the lead. My responsibility is to cover for them."
20001-80-1 = "There you are, Sensei. I've...been waiting."
20001-90-1 = "I had checked your schedule, and I'm looking forward to working with you today."
20001-100-1 = "Target confirmed. Proceeding with elimination."
20001-110-1 = "...Only kidding. You don't have to hide."
20001-120-1 = "No problem, Sensei. That issue has already been taken care of."
20001-130-1 = "How? Th-That's...! On a need-to-know basis."
20001-140-1 = "What mission will you see to today? I'll be there to help no matter what."
20001-150-1 = "Happy birthday, Sensei. I may not be the best when it comes to expressing these sorts of things..."
20001-160-1 = "...but I'm truly glad to have you in my life."
20001-170-1 = "My birthday... I've never really celebrated it or anything."
20001-180-1 = "But it does feel different...to hear you wish me a happy one."
20001-190-1 = "Happy New Year, Sensei. I'll be counting on you again this year."
20001-200-1 = "Christmas, huh? I don't need Santa..."
20001-210-1 = "...because I have you."
20001-220-1 = "Treat or fire! Surrender the candy, or I will open fire!"
20001-230-1 = "Huh? Is that not how the saying goes?"
20001-250-1 = "I-Is this really...a reward?"
20001-260-1 = "So... Um. This is..."
20001-270-1 = "...really embarrassing. But if this is really what you want, Sensei."
20001-280-1 = "You want me to do it a little harder...? O-Okay."
20001-290-1 = "As long as you're happy, Sensei...then I'm happy too."
20001-300-1 = "Ah! D-Don't get up so suddenly! I could have fallen!"
20001-310-1 = "I-Is this really...a reward?"
20001-320-1 = "So... Um. This is..."
20001-330-1 = "...really embarrassing. But if this is really what you want, Sensei."
20001-2600-1 = "The chance of winning a war is proportional to the development of weapons. Watch this, Sensei."
