[translation]
10056-10-1 = "Blue Archive"
10056-20-1 = "เมอร์รีคริสต์มาส~! เซรินะจากชมรมอัศวินบรรเทาทุกข์ค่ะ!\nขอให้เป็นคริสต์มาสที่พิเศษนะคะ!"
10056-30-1 = "ทุกคน\nระวังเป็นหวัดนะคะ"
10056-40-1 = "ยาในชุดปฐมพยาบาล\nใช้เป็นของขวัญได้มั้ยนะ..."
10056-50-1 = "จะส่งของขวัญอะไร\nให้เด็กที่ว่านอนสอนง่าย\nดีเหรอคะ?"
10056-60-1 = "อย่าหักโหมนะคะ\nสุขภาพสำคัญที่สุดค่ะ"
10056-70-1 = "ฉันขออวยพรให้\nทุกคนมีสุขภาพดีนะคะ"
10056-80-1 = "เข้ามาสิคะคุณครู!\nวันนี้เซรินะ\nเป็นซานต้าค่ะ ฮิฮิ"
10056-90-1 = "กลับมาแล้วเหรอคะคุณครู?\nเมอร์รีคริสต์มาส~!"
10056-100-1 = "กำลังกลุ้มใจว่าจะให้\nของขวัญอะไรเด็กๆ เหรอคะ?"
10056-110-1 = "มาคิดด้วยกันกับฉันมั้ยคะ...\nฮิฮิ"
10056-120-1 = "เราต้องมีซานต้าค่ะ\nอย่างน้อยก็เพื่อ\nความฝันของเด็กๆ ค่ะ"
10056-130-1 = "ถ้าฉันเป็น\nซานต้าจริงๆ ละก็..."
10056-140-1 = "จะช่วยเหลือคุณครู\nได้มากกว่านี้มั้ยนะ?"
10056-150-1 = "เรียกฉันเหรอคะ?\nฉันเองค่ะ เซรินะของคุณครูเองค่ะ!"
10056-160-1 = "วันนี้เซรินะ\nเป็นซานต้าค่ะ"
10056-170-1 = "บอกมาได้ตลอดเลยค่ะ"
10056-180-1 = "เพราะฉันเตรียมใจ\nไว้พร้อมตลอดแล้วค่ะ"
10056-190-1 = "คุณครู สุขสันต์วันเกิดค่ะ!"
10056-200-1 = "ช่วยตั้งตารอรับ\nของขวัญด้วยนะคะ"
10056-210-1 = "วันเกิด... วันเกิดฉันเหรอคะ...?"
10056-220-1 = "อ๊ะ ฉันยุ่งจนลืมไปเลยค่ะ!\nขอบคุณนะคะ!"
10056-230-1 = "คริสต์มาสเพิ่งผ่านไป\nเมื่อไม่นานมานี้เอง\nปีใหม่แล้วเหรอคะเนี่ย"
10056-240-1 = "สวัสดีปีใหม่นะคะ"
10056-250-1 = "ถ้าทุกคนมีความสุข\nอย่างนี้ไปเรื่อยๆ\nฉันก็จะดีใจด้วยค่ะ"
10056-260-1 = "คริสต์มาสมาถึงแล้วค่ะ!\nเป็นไงคะ... เข้ากับฉันมั้ยคะ?"
10056-270-1 = "พอฉันเดินในชุดนี้\nมีคนเข้าใจผิดว่าเป็น\nชุดฮาโลวีนด้วยละค่ะ"
10056-280-1 = "ฉันไม่ได้ตั้งใจให้เป็นแบบนั้นนะ..."
10056-300-1 = "คะ... คุณครู?\nผ้าพันคอนี้... ให้ฉันเหรอคะ?"
10056-310-1 = "ตะ... แต่ว่า...\nวันนี้ฉันคือซานต้านะคะ"
10056-320-1 = "ที่จริงฉันต้อง\nเป็นฝ่ายให้ของขวัญสิ..."
10056-330-1 = "กลับเป็นคุณครูที่ให้ของขวัญแทน..."
10056-340-1 = "คะ? ซานต้าก็รับรางวัล\nได้เหมือนกันเหรอคะ...?"
10056-350-1 = "ถ้าคุณครูว่าอย่างนั้นก็..."
10056-360-1 = "ฮุฮุ..."
10056-370-1 = "ขอบคุณมากเลยนะคะ\nฉันจะรักษาอย่างดีเลยค่ะ"
10056-2600-1 = "ว้าว ขอบคุณค่ะ! คุณครูรู้อยู่แล้วเหรอคะ?\nคุณลุงซานต้าบอกว่าจะไม่ให้\nของขวัญเด็กที่ร้องไห้ค่ะ\nเพราะงั้นคุณครูก็ห้ามร้องนะคะ"
