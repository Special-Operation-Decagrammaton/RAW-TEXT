[translation]
10072-10-1 = "ブルー、アーカイブ！"
10072-20-1 = "RABBIT2、作戦準備完了。\n海とはいえ、警戒任務は怠らないぞ！"
10072-30-1 = "（やはりこの格好、\n室内では\n動きづらいな…）"
10072-40-1 = "（あれは…\n食べられるん\nだろうか…？）"
10072-50-1 = "次の作戦では…\nああいう格好をするのも、\n悪くないかもしれないな。"
10072-60-1 = "あれはまさか…\n教範でしか\n見たことがない、\n例の武器…？"
10072-70-1 = "偵察中、異常なし。"
10072-80-1 = "来たか、先生。\n丁度、銃の整備を\nするところだったんだ。"
10072-90-1 = "う、うわっ！？\nいつの間に？"
10072-100-1 = "べ、別にサボってないぞ！？"
10072-110-1 = "今日も暑っいなぁ。"
10072-120-1 = "熱中症対策はできてるか？"
10072-130-1 = "脱水に気をつけるんだぞ、\n水の補給はしっかりとな。"
10072-140-1 = "あと、塩も摂ったほうがいい。"
10072-150-1 = "本当は、そんなに\n海は好きじゃないんだ。"
10072-160-1 = "銃器が壊れやすいから…。"
10072-170-1 = "だが、どんな環境でも\n完璧に対応できてこそ、\nSRTの生徒だからな。"
10072-180-1 = "海辺では、\n防水処理をした\n戦術地図を使っている。"
10072-190-1 = "モエには防水機能付きの\nGPS装備を勧められたが…"
10072-200-1 = "私は嫌だ。\n紙には紙にしかない\n価値があるのだからな！"
10072-210-1 = "（任務ではない形で、\n他の隊員とも一緒に、\n海に来れたら\nよかったのだが…）"
10072-220-1 = "いつもの鉄帽は\nどうしたのかって？"
10072-230-1 = "このブーニーハットが\n鉄帽の代わりだ。"
10072-240-1 = "こう見えて、防弾素材で\nできてるんだぞ？"
10072-250-1 = "お誕生日おめでとう、先生。"
10072-260-1 = "時間がかかる仕事は、\n私がやっておくから。\n今日は先に帰って休んどけ。"
10072-270-1 = "誕生日の日に夜勤だなんて…\n悲しいからな。"
10072-280-1 = "…誕生日プレゼント？\n別に…要らない…。"
10072-290-1 = "でも、先生がよければ…\n一緒に晩飯を食べよう。"
10072-300-1 = "メニューは、\nコンビニ弁当でも\nなんでもいいから。"
10072-310-1 = "あけましておめでとう、先生。\n今年の目標…？"
10072-320-1 = "そうだな…できれば、\n週に1回は新鮮な\n魚料理を…。"
10072-330-1 = "あ、いや…\nSRT特殊学園の復活だな！"
10072-340-1 = "あ、先生。\n夜に時間があったら、\n子ウサギ公園に\n来てくれないか？"
10072-350-1 = "クリスマスだから、\nモエが大きな七面鳥を\n持ってきたんだけど、"
10072-360-1 = "RABBIT小隊だけじゃ\n食べ切れそうにないんだ。"
10072-370-1 = "シャーレでバーベキューは\n難しいし…\n公園でパーティーにしよう。"
10072-380-1 = "ここ最近、カボチャの\n入ったコンビニ弁当を\nよく見かける\n気がするんだが。"
10072-390-1 = "もしかして…\nこれが噂に聞く\nハロウィーンシーズン？"
10072-410-1 = "（さあ、先生。\n落ち着いて、\nこっちを見るんだ）"
10072-420-1 = "（そうそう、ゆっくり。\n息をゆっくり吐いて）"
10072-430-1 = "（ふふっ、\nさすが先生。\n習得が早いな）"
10072-440-1 = "（…なんか変な感じだ）"
10072-450-1 = "（海の中で先生と\n二人きり、言葉もなく\n視線とジェスチャーだけで\n会話していると…）"
10072-460-1 = "（まるで…）"
10072-470-1 = "（…えっ？呼吸が\n苦しそうに見える？）"
10072-480-1 = "（いや、\n何も問題ない。\n大丈夫だ！）"
10072-490-1 = "（なんだか、\nいつもと違って…\n呼吸が不安定だ）"
10072-500-1 = "（…先生とのダイブ、\n私にはまだ早かったのかも\nしれないな)"
10072-2600-1 = "RABBIT26式機関銃、\n確かに受け取った。\n水中でも壊れないように、\n防水処理もバッチリだ。\nもちろん、戦闘が終わったら\nきちんと整備しないとだけど…。"
