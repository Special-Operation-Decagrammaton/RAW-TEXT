[translation]
9009005-10-1 = "接続確認。"
9009005-20-1 = "[USERNAME]先生。\nお待ちしておりました。"
9009005-30-1 = "お仕事を始める時間です。\n[USERNAME]先生。"
9009005-40-1 = "どのお仕事から始めますか。\n先生？"
9009005-50-1 = "待機中。\n解決しなければならない作業が\n多数存在しています。"
9009005-60-1 = "ここで先生の様々なお仕事を\n進行できます。"
9009005-70-1 = "[USERNAME]先生。\nご希望のお仕事を選んでください。"
9009005-80-1 = "解決していただかねばならない\nお仕事がたくさんあります。\nでは、お願いします。"
9009005-90-1 = "混乱。理解できない行動です。\nつつかないでください。故障します。"
9009005-100-1 = "理解しました。先生は今\n特にやるべきことがないのですね。\n暇なのですね。"
9009005-110-1 = "うーん……。"
9009005-120-1 = "うーん……。"
9009005-130-1 = "……。"
9009005-140-1 = "あ……！"
9009005-150-1 = "ここは……\nそういうことなのですね。"
9009005-160-1 = "……そういうことですね。"
9009005-170-1 = "ふむ……なるほど。"
9009005-180-1 = "ふむ……\nそういう構造なんですね。"
9009005-190-1 = "……あ。"
9009005-200-1 = "雨が降ったらこれで……"
9009005-210-1 = "役に立つのでしょうか……？"
9009005-220-1 = "私も……一緒に……"
9009005-230-1 = "あ。"
9009005-240-1 = "あれ、見えますか？プラナちゃん？"
9009005-250-1 = "あれのことですか、先輩？"
9009005-260-1 = "はい！あれです！"
9009005-270-1 = "あっちはどうですか？"
9009005-280-1 = "うーん……。"
9009005-290-1 = "……あっ。"
9009005-300-1 = "じー"
9009005-310-1 = "うーん……。"
9009005-320-1 = "……視線を感じます。"
9009005-330-1 = "……困ります。"
9009005-340-1 = "あ。"
9009005-350-1 = "認証完了。"
9009005-360-1 = "ようこそ、\n[USERNAME]先生。"
9009005-370-1 = "先生の接続\nプロセスを確認。\nよろしくお願いします。"
9009005-380-1 = "シッテムの箱、制約解除。\nプロセス「ペレツ･ウザ」\n限定稼働中。"
9009005-390-1 = "待機中。\n先生、ご命令を。"
9009005-400-1 = "今の私は無敵です、\n普段の2倍は強いです。"
9009005-410-1 = "アロナ先輩と力を\n合わせて、先生を\nサポートします。"
9009005-420-1 = "おかえりなさい、先生。\nお仕事を選んでください。"
9009005-430-1 = "ここで先生のスケジュールを\n決めることができます。"
9009005-440-1 = "今日はどのお仕事から\n始めますか？"
9009005-450-1 = "生徒さんたちがお待ちです。\n私は先生をサポートします。"
9009005-460-1 = "先生は……\nいつも通りですね。\n安心しました。"
9009005-470-1 = "待機中。\n自由にスケジュールを\n選んでください。"
9009005-480-1 = "うーん……。"
9009005-490-1 = "芽、いつでるんでしょうね？"
9009005-500-1 = "……もう少し、\n見守りましょう。"
9009005-510-1 = "あ。"
9009005-520-1 = "仮想適性試験を\n開始します。"
9009005-530-1 = "ここでは、\nさまざまな模擬試験を\n実施できます。"
9009005-540-1 = "装置の使用方法は、\n右のガイドより\n確認できます。"
9009005-550-1 = "……何か、\nお困りでしょうか。"
9009005-560-1 = "特別な状況でのみ\n開花する才能も\n存在します。"
9009005-570-1 = "仮想環境でも\n疲労は蓄積しますので、\n無理はしないでください。"
