[translation]
9009005-10-1 = "ยืนยันการล็อกอิน"
9009005-20-1 = "กำลังรออยู่เลยค่ะ\nคุณครู [USERNAME]"
9009005-30-1 = "ได้เวลาเริ่มงานแล้วค่ะ\nคุณครู [USERNAME]"
9009005-40-1 = "จะเริ่มจากงานไหนก่อนดีคะ?\nคุณครู?"
9009005-50-1 = "กำลังรอคำสั่ง\nมีงานที่ต้องรีบจัดการ\nอยู่เยอะมากเลยค่ะ"
9009005-60-1 = "คุณครูสามารถเลือกงานต่างๆ\nได้จากตรงนี้ค่ะ"
9009005-70-1 = "คุณครู [USERNAME]\nโปรดเลือกภารกิจที่จะทำด้วยค่ะ"
9009005-80-1 = "นี่เป็นงานที่ต้องจัดการให้เสร็จค่ะ\nถ้างั้นฉันขอฝากด้วยนะคะ"
9009005-90-1 = "สับสน พฤติกรรมที่ไม่สามารถเข้าใจได้\nอย่าสะกิดฉันค่ะ เดี๋ยวจะพังเอาได้  "
9009005-100-1 = "เข้าใจแล้วค่ะ คุณครูกำลังว่างงาน\nแล้วก็คงเบื่อๆ อยู่สินะคะ"
9009005-110-1 = "อืม..."
9009005-120-1 = "อืม..."
9009005-130-1 = "..."
9009005-140-1 = "อ้อ...!"
9009005-150-1 = "ที่นี่... งั้นเหรอคะ"
9009005-160-1 = "อย่างนี้นี่เอง... "
9009005-170-1 = "อืม... อย่างที่คิดไว้เลย"
9009005-180-1 = "อืม... โครงสร้างแบบนี้นี่เอง"
9009005-190-1 = "อ่า..."
9009005-200-1 = "ถ้าฝนตกก็ใช้เจ้านี่..."
9009005-210-1 = "น่าจะพอช่วยได้ใช่ไหมคะ...?"
9009005-220-1 = "ฉันเอง... ก็..."
9009005-230-1 = "อ๊ะ"
9009005-240-1 = "นี่ เห็นรึเปล่า? พลาน่าจัง?"
9009005-250-1 = "หมายถึงนั่นเหรอคะ รุ่นพี่?"
9009005-260-1 = "ค่ะ ตรงนั้นค่ะ!"
9009005-270-1 = "ดูเป็นยังไงบ้างคะ?"
9009005-280-1 = "อืม..."
9009005-290-1 = "อ๊ะ...."
9009005-300-1 = "(จ้อง...)"
9009005-310-1 = "อืม..."
9009005-320-1 = "รู้สึกถึงสายตาที่มองมานะคะ"
9009005-330-1 = "แบบนี้ลำบากใจนะคะ..."
9009005-340-1 = "อ๊ะ"
9009005-350-1 = "ยืนยันสำเร็จ"
9009005-360-1 = "ยินดีต้อนรับเข้าสู่การเชื่อมต่อค่ะ\nคุณครู [USERNAME]"
9009005-370-1 = "ฉันตรวจสอบกระบวนการ\nเชื่อมต่อของคุณครูแล้วค่ะ\nรบกวนด้วยนะคะ"
9009005-380-1 = "ยกเลิกการควบคุมกล่องแห่งซิสดิม\nกระบวนการ <เปเรซ อุซซาห์>\nกำลังทำงานอย่างจำกัด"
9009005-390-1 = "กำลังรอคำสั่ง คุณครู\nช่วยออกคำสั่งด้วยค่ะ"
9009005-400-1 = "ตอนนี้ฉันเป็นอมตะค่ะ\nแข็งแกร่งกว่าปกติ 2 เท่าค่ะ"
9009005-410-1 = "ฉันจะรวมพลังกับรุ่นพี่อะโรน่า\nแล้วสนับสนุนคุณครูค่ะ"
9009005-420-1 = "เชิญค่ะ คุณครู\nกรุณาเลือกงานเลยค่ะ"
9009005-430-1 = "สามารถปรับตารางงาน\nของคุณครูได้ที่นี่ค่ะ"
9009005-440-1 = "วันนี้จะเริ่มจาก\nงานแบบไหนก่อนดีคะ?"
9009005-450-1 = "นักเรียนกำลังรออยู่ค่ะ\nฉันจะคอยสนับสนุนคุณครูเองค่ะ"
9009005-460-1 = "คุณครูน่ะ... เป็นคุณครู\nคนดีคนเดิมตลอดเลยนะคะ\nฉันวางใจได้แล้วค่ะ"
9009005-470-1 = "กำลังสแตนด์บาย\nเลือกตารางงานได้\nตามที่ต้องการเลยค่ะ"
9009005-480-1 = "อืม..."
9009005-490-1 = "ต้นอ่อนจะงอกตอนไหนเหรอคะ?"
9009005-500-1 = "มารอดูต่ออีกหน่อยแล้วกันค่ะ..."
9009005-510-1 = "อ่า"
9009005-520-1 = "ต่อจากนี้จะเริ่มทดสอบ\nความถนัดแบบเสมือนจริงค่ะ"
9009005-530-1 = "ที่นี่คุณครูสามารถทดสอบ\nสถานการณ์จำลองในสภาพแวดล้อม\nที่หลากหลายได้ค่ะ"
9009005-540-1 = "วิธีใช้อุปกรณ์ไดฟ์\nเขียนอยู่ทางด้านขวาค่ะ"
9009005-550-1 = "ต้องการความช่วยเหลือจากฉันมั้ยคะ...?"
9009005-560-1 = "พรสวรรค์บางอย่างก็ไม่เผยออกมา\nหากไม่ได้อยู่ในสถานการณ์พิเศษค่ะ"
9009005-570-1 = "แม้อยู่ในสภาพแวดล้อมเสมือน\nความเมื่อยล้าก็สะสมได้ค่ะ\nอย่าฝืนตัวเองเกินไปนะคะ"
