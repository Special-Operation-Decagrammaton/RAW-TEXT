[translation]
9009005-10-1 = "접속 확인."
9009005-20-1 = "[USERNAME] 선생님.\n기다리고 있었습니다."
9009005-30-1 = "업무를 시작할 시간입니다.\n[USERNAME] 선생님."
9009005-40-1 = "어떤 업무를 하실 겁니까,\n선생님?"
9009005-50-1 = "대기 중.\n해결이 필요한 작업들이\n다수 존재합니다."
9009005-60-1 = "여기서 선생님의 다양한 업무를\n진행할 수 있습니다."
9009005-70-1 = "[USERNAME] 선생님.\n원하시는 업무를 선택해 주십시오."
9009005-80-1 = "해결해 주셔야 할 업무들입니다.\n그럼 부탁드립니다."
9009005-90-1 = "혼란. 이해할 수 없는 행동입니다.\n찌르지 말아주세요. 고장납니다."
9009005-100-1 = "이해했습니다. 선생님은 지금\n딱히 할 일이 없는 것이군요.\n심심한 것이군요."
9009005-110-1 = "음……."
9009005-120-1 = "으음……."
9009005-130-1 = "……."
9009005-140-1 = "아……!"
9009005-150-1 = "이곳은…… 그런 건가요."
9009005-160-1 = "…그렇군요."
9009005-170-1 = "음… 과연."
9009005-180-1 = "음… 그런 구조군요."
9009005-190-1 = "……아."
9009005-200-1 = "비가 오면 이걸로……."
9009005-210-1 = "도움이 될 수 있겠죠…?"
9009005-220-1 = "저도… 함께…"
9009005-230-1 = "아."
9009005-240-1 = "저기, 보이나요? 프라나 쨩?"
9009005-250-1 = "저것 말인가요, 선배?"
9009005-260-1 = "네! 저거요!"
9009005-270-1 = "저긴 어때요?"
9009005-280-1 = "음……."
9009005-290-1 = "…앗."
9009005-300-1 = "지이-"
9009005-310-1 = "으음……"
9009005-320-1 = "…시선이 느껴지고 있습니다만."
9009005-330-1 = "…곤란하네요."
9009005-340-1 = "아."
9009005-350-1 = "인증 완료."
9009005-360-1 = "접속을 환영합니다,\n[USERNAME] 선생님."
9009005-370-1 = "선생님의 접속 프로세스를\n확인했습니다.\n잘 부탁드립니다."
9009005-380-1 = "싯딤의 상자 제약 해제\n프로세스 <베레스 웃사>\n한정 가동 중."
9009005-390-1 = "대기 중. 선생님,\n명령을 내려주십시오."
9009005-400-1 = "지금의 저는 무적입니다.\n평소보다 2배 강합니다."
9009005-410-1 = "아로나 선배와\n힘을 합쳐서,\n선생님을 지원합니다."
9009005-420-1 = "어서 오십시오. 선생님.\n업무를 선택해 주세요."
9009005-430-1 = "이곳에서 선생님의\n스케줄을 정할 수 있습니다."
9009005-440-1 = "오늘은 어떤 업무부터\n시작하시겠습니까?"
9009005-450-1 = "학생들이 기다리고 있습니다.\n저는 선생님을 보조하겠습니다."
9009005-460-1 = "선생님은…… 언제나,\n평소대로의 선생님이시군요.\n안심했습니다."
9009005-470-1 = "대기 중.\n자유롭게 일정을\n선택해 주십시오."
9009005-480-1 = "으으음…"
9009005-490-1 = "싹은 언제쯤 틀까요?"
9009005-500-1 = "…조금 더 지켜보죠."
9009005-510-1 = "아."
9009005-520-1 = "지금부터 가상적성시험을\n시작하겠습니다."
9009005-530-1 = "이곳에서\n다양한 환경의 모의 상황을\n시험해 보실 수 있습니다."
9009005-540-1 = "다이브 장치의 사용법은\n우측에 적혀 있습니다."
9009005-550-1 = "……제 도움이 필요하십니까?"
9009005-560-1 = "특별한 상황이 아니면\n개화하지 않는 재능도\n있는 법이지요."
9009005-570-1 = "가상의 환경에서도\n피로는 누적됩니다.\n무리는 하지 마시길 바랍니다."
