[translation]
23002-10-1 = "蔚藍檔案！"
23002-20-1 = "白衣天使！\n來找你了！！"
23002-30-1 = "啦啦～\n需要手術的人～？\n在哪裡呢～"
23002-40-1 = "不管是救援！希望！\n還是愛！\n花繪全部都準備好了唷！"
23002-50-1 = "好想趕快\n跟兔子和貓咪玩啊！"
23002-60-1 = "交到很多朋友，\n每天都很開心！"
23002-70-1 = "你好！\n我是花繪！\n請多多指教！"
23002-80-1 = "老師！有新的信寄來了！\n快樂的任務，今天也開始吧！"
23002-90-1 = "呀啊！歡迎你來！\n我一直在等老師來唷！"
23002-100-1 = "啊，老師！你的臉色好差！\n要不要做個簡單的手術呀！？"
23002-110-1 = "想要活力和笑容的話！\n就交給我花繪吧！"
23002-120-1 = "老師喜歡的類型是？"
23002-130-1 = "活潑可愛的少女對吧！？"
23002-140-1 = "今天要做的事情很多\n不可以偷懶唷！"
23002-150-1 = "啊！總覺得有預感\n會有好事發生！"
23002-160-1 = "今天是最開心的日子！\n老師！生日快樂！"
23002-170-1 = "今天是我的生日！\n我想收到的生日禮物是……"
23002-180-1 = "老師的一天！"
23002-190-1 = "新年快樂！\n希望今年\n也是幸福的一年！"
23002-200-1 = "是大家都會幸福的聖誕節！\n是每個三一的女學生，\n都會心動不已的日子唷！"
23002-210-1 = "啊。萬聖節開始了。\n我們趕快到外面去吧～\n慶典就要開始了！"
23002-230-1 = "那麼，首先要\n消毒傷口，"
23002-240-1 = "請脫下襪子\n並乖乖的唷！"
23002-250-1 = "不好好消毒的話，\n傷口會發炎，"
23002-260-1 = "甚至變得更嚴重喔。"
23002-270-1 = "可能會有點痛，\n請忍耐一下吧！"
23002-280-1 = "嘿咻……！\n變乾淨吧……！"
23002-290-1 = "很好，忍住了呢！\n還差一點點唷──"
23002-300-1 = "作為贈品，\n我來施一道\n能讓傷口好得更快的\n魔法咒語吧！"
23002-310-1 = "那麼，痛痛，\n飛走吧～！"
23002-320-1 = "如何？\n不痛了吧？"
23002-2600-1 = "這個武器裡……\n有著滿滿的愛！"
