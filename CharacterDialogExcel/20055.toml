[translation]
20055-10-1 = "ブルー……すぅ……！アーカイブ！ "
20055-20-1 = "ミレニアムサイエンススクール……\nゲーム開発部の花岡ユズ、です……。\nこ、こんな格好ですが……\nよろしく、お願いします……。"
20055-30-1 = "（平和な日常……\n今はその大切さが、\nよく分かります） "
20055-40-1 = "ソファ……\n突然発射したり、\nしませんよね……？"
20055-50-1 = "あたたかくて、\nいい匂い……\nいいですね。\nえへへっ。"
20055-60-1 = "ロッカーには……\nしばらく、入りたく\nありません……うぅ。"
20055-70-1 = "やっぱり、これ……\n少し派手過ぎ\nませんか……？\nうぅぅ……。"
20055-80-1 = "ふえぇ……！\nこ、この格好は、その……。"
20055-90-1 = "……お、おかえりなさい、\n先生。"
20055-100-1 = "お、お待ちしてました、\n先生……！ "
20055-110-1 = "早く出撃……"
20055-120-1 = "ち、ちがうっ。\n当番のお仕事を、\n始めましょう……！"
20055-130-1 = "このスーツ、思ったより\n楽ではあるんですが……"
20055-140-1 = "それ以上に……恥ずかしい、\nです……。"
20055-150-1 = "スーツの感触、なんだか\n不思議ですよね。\n弾も弾いてしまいそうです。"
20055-160-1 = "全身を覆っているはずなのに……\nなんだか落ち着かなくて……\nうう……。"
20055-170-1 = "このスーツ……パソコンとも\n連動できるんです……。"
20055-180-1 = "当番の時……\n役に立つでしょうか？ "
20055-190-1 = "あ、暑いですか……？"
20055-200-1 = "こ、このスーツ……\n表面が冷たくて、\n気持ちいいですよ……？"
20055-210-1 = "お誕生日、\nおめでとうございます……！"
20055-220-1 = "あ、あの、\n誕生日プレゼントに……"
20055-230-1 = "ソフトを、\n用意してみたのですが……。"
20055-240-1 = "ど、どうでしょう……？"
20055-250-1 = "あ、ありがとうございます、\n先生……"
20055-260-1 = "わたしのこと、\n忘れないでくれて……。 "
20055-270-1 = "いろんなことがありましたが、\nあっという間に一年が\n過ぎましたね。"
20055-280-1 = "……あけまして\nおめでとうございます、\n先生。"
20055-290-1 = "さ、サンタ服じゃないですが……\nあ、赤いですし……に、\n似たような、ものですよね。"
20055-300-1 = "め、メリークリスマスです、\n先生！"
20055-310-1 = "わ、わたしよりすごい格好の\n人たちが、たくさん……！ "
20055-320-1 = "あっ、い、いや、\nわたしも着たかったとかじゃ、\nなくて……！ "
20055-340-1 = "見てください、先生。"
20055-350-1 = "わたしが守り抜いた世界です。"
20055-360-1 = "……もちろん、分かっています。"
20055-370-1 = "この光景を見たのは、\nわたしだけじゃないって。"
20055-380-1 = "大会の時、\nこんなことを仰いましたよね。"
20055-390-1 = "今この瞬間が、\nゲームが。\nわたしたちの現実だって。"
20055-400-1 = "だから、たとえエンディングの\n決まった世界だとしても……。"
20055-410-1 = "この世界のみんなが、"
20055-420-1 = "同じシナリオを\n歩むとしても……。"
20055-430-1 = "わたしがした選択、\nこの感情は……。"
20055-440-1 = "間違いなく、本物なんです。"
20055-2600-1 = "練習は本番のように。\n本番はゲームのように……！\nわたし、最善を尽くします……！ "
