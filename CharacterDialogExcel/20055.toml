[translation]
20055-10-1 = "Blue Archive...!"
20055-20-1 = "ฮานาโอกะ ยูสึค่ะ...\nถะ... ถึงจะใส่ชุดแบบนี้ แต่ก็ขอฝากตัวด้วยนะคะ..."
20055-30-1 = "(ชีวิตประจำวันที่แสนสงบสุข\nตอนนี้ฉันรู้ถึงความสำคัญ\nของมันแล้วละค่ะ)"
20055-40-1 = "โซฟาคงจะ\nไม่ดีดตัวออกไปใช่มั้ยคะ...?"
20055-50-1 = "อบอุ่น แถมยังมีกลิ่นหอม\nดีจังเลยนะคะ ฮิฮิ"
20055-60-1 = "ตู้เก็บของ... ฮือ\nฉันคงจะไม่อยากเข้าไป\nในนั้นอีกพักใหญ่ค่ะ..."
20055-70-1 = "คิดแล้วเชียวว่าชุดนี้\nมันเตะตาเกินไป\nใช่มั้ยล่ะคะ... ฮือ..."
20055-80-1 = "เอ๋...!\nชะ... ชุดนี้ คือว่า..."
20055-90-1 = "ยะ... ยินดีต้อนรับค่ะ\nคุณครู"
20055-100-1 = "กะ... กำลังรออยู่เลยค่ะ\nคุณครู...!"
20055-110-1 = "ออกปฎิบัติการ..."
20055-120-1 = "ไม่สิ ไม่ใช่\nมาเริ่มงานเข้าเวรตัวแทน\nกันเลยมั้ยคะ...?!"
20055-130-1 = "ชุดนี้สบายกว่าที่เห็น..."
20055-140-1 = "ถึงมันจะใส่สบาย\nแต่ฉันก็เขินอยู่ดีค่ะ..."
20055-150-1 = "สัมผัสของชุดสูท มันน่าทึ่งมากเลยค่ะ\nเหมือนว่ากระสุนปืนจะลื่นผ่านไปเลยค่ะ"
20055-160-1 = "ถึงชุดมันจะปกปิดมิดชิด...\nตะ... แต่รู้สึกเหมือนมันเปิดเผย\nทุกส่วนเลยค่ะ... ฮือ..."
20055-170-1 = "ชุดนี้... ดูเหมือนว่ามันจะเชื่อมต่อ\nกับคอมพิวเตอร์ด้วยค่ะ..."
20055-180-1 = "มันพอจะช่วยเรื่อง\nงานเข้าเวรตัวแทน...\nได้มั้ยคะ"
20055-190-1 = "ระ... ร้อนเหรอคะ?"
20055-200-1 = "คือว่า ถ้าลองจับ\nด้านนอกของชุดดู\nจะรู้สึกเย็นสบายมากเลยค่ะ..."
20055-210-1 = "สุขสันต์วันเกิดค่ะ...!"
20055-220-1 = "ฉันเตรียมซอฟต์แวร์"
20055-230-1 = "วิดีโอเกมเอาไว้\nเป็นของขวัญ... ให้…"
20055-240-1 = "คะ... คุณครูรับไว้ได้ใช่มั้ยคะ...?"
20055-250-1 = "ขะ... ขอบคุณค่ะ คุณครู"
20055-260-1 = "ขอบคุณที่ไม่ลืมฉัน..."
20055-270-1 = "ถึงจะเกิดเรื่องมากมาย\nแต่ก็ผ่านไปอีกหนึ่งปีแล้วนะคะ"
20055-280-1 = "สวัสดีปีใหม่ค่ะ...\nคุณครู"
20055-290-1 = "ถึงฉันจะไม่มีชุดซานตาคลอส\nแต่ชุดนี้ก็ดูคล้ายๆ กันอยู่นะคะ..."
20055-300-1 = "มะ... เมอร์รีคริสต์มาสค่ะ\nคุณครู!"
20055-310-1 = "มะ... มีคนใส่ชุดเจ๋งๆ\nยิ่งกว่าฉันอยู่บนท้องถนน..."
20055-320-1 = "นะ... แน่นอนว่า\nฉันไม่ได้อยากใส่ชุด\nอะไรแบบนั้นหรอกนะคะ...!"
20055-340-1 = "ดูตรงนี้สิคะ คุณครู"
20055-350-1 = "โลกที่ฉันปกป้องไว้ค่ะ"
20055-360-1 = "ฉันรู้อยู่แล้วค่ะ..."
20055-370-1 = "ว่าคนที่เห็นทิวทัศน์ในตอนนี้\nไม่ได้มีแค่ฉันคนเดียว"
20055-380-1 = "ตอนแข่งเกมเมื่อครั้งที่แล้ว\nคุณครูก็เคยบอกเอาไว้นี่คะ"
20055-390-1 = "ว่าช่วงเวลานี้ ว่าเกมเกมนี้\nคือความจริงของพวกเรา"
20055-400-1 = "เพราะงั้น แม้ว่าจะเป็นโลก\nที่ถูกกำหนดตอนจบเอาไว้แล้วก็ตาม"
20055-410-1 = "แม้ทุกคนในโลกนี้"
20055-420-1 = "จะเดินไปตามเรื่องราวเดียวกันก็ตาม"
20055-430-1 = "แต่สิ่งที่ฉันเลือกมาตลอด...\nกับความรู้สึกนี้..."
20055-440-1 = "คือเรื่องจริงไม่ผิดอย่างแน่นอนค่ะ"
20055-2600-1 = "ซ้อมให้เหมือนปฏิบัติจริง\nปฏิบัติจริงให้เหมือนซ้อม...!\nฉะ... ฉันจะทำให้เต็มที่เลยค่ะ...!"
