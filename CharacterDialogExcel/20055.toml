[translation]
20055-10-1 = "Blue... Phew... Archive...!"
20055-20-1 = "Hanaoka Yuzu here... E-Even though I look like this right now, please take care of me..."
20055-30-1 = "(I think I now know...how precious peaceful everyday life is.)"
20055-40-1 = "The sofa isn't going to suddenly deploy or anything, right...?"
20055-50-1 = "It's warm, it smells good... It's nice, heehee."
20055-60-1 = "A cabinet... Ugh, I don't want to go in one of those for a while..."
20055-70-1 = "I knew it. This outfit stands out too much... Augh..."
20055-80-1 = "Eek...! Th-This outfit is, um..."
20055-90-1 = "...W-Welcome, Sensei..."
20055-100-1 = "I-I was waiting for you, Sensei...!"
20055-110-1 = "Let's move out..."
20055-120-1 = "No, no. Shall we get started with Student Rep duty...?!"
20055-130-1 = "This outfit is more comfortable than it looks..."
20055-140-1 = "But it's more embarrassing than how comfortable it is..."
20055-150-1 = "Doesn't the texture of this suit seem strange? I feel like even a bullet would slide off."
20055-160-1 = "I'm certain that everything is covered, but I feel naked... Augh..."
20055-170-1 = "This suit... For some reason, it seems like it can be linked with a computer..."
20055-180-1 = "Will this...help with Student Rep duties?"
20055-190-1 = "A-Are you feeling hot?"
20055-200-1 = "Um, this suit feels quite cool on the surface..."
20055-210-1 = "Happy birthday...!"
20055-220-1 = "Um, as your gift,"
20055-230-1 = "I prepared a game...package..."
20055-240-1 = "A-Are you okay with it...?"
20055-250-1 = "Th-Thank you, Sensei."
20055-260-1 = "For not forgetting about me..."
20055-270-1 = "Many things happened, but the year passes by in the end."
20055-280-1 = "...Happy New Year, Sensei."
20055-290-1 = "I don't have a Santa outfit, but this is similar, so..."
20055-300-1 = "M-Merry Christmas, Sensei!"
20055-310-1 = "Th-There are people in the streets with outfits even more daring than mine...!"
20055-320-1 = "...Um, of course, it's not like I wanted to be daring...!"
20055-340-1 = "Look around, Sensei."
20055-350-1 = "This is the world I protected."
20055-360-1 = "...I understand, of course."
20055-370-1 = "I know that I'm not the only one to have seen this view."
20055-380-1 = "Back at that gaming tournament, you said something like this, didn't you?"
20055-390-1 = "That this moment, this game, is our reality."
20055-400-1 = "So, even if this world has a predetermined ending,"
20055-410-1 = "even if everyone in this world"
20055-420-1 = "follows the same scenario,"
20055-430-1 = "The choices I make, these emotions..."
20055-440-1 = "Without a doubt, they are all real."
20055-2600-1 = "Practice like it's real, treat it like it's a game...! I'll do my best...!"
