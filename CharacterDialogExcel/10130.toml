[translation]
10130-10-1 = "是蔚藍檔案，呵呵。"
10130-20-1 = "我是梯昴。\n遇到困難的時候，就讓我助你一臂之力吧。\n雖然……僅限於「奧利斯式」就是了。"
10130-30-1 = "咖啡廳……感覺\n是個很高級的地方。"
10130-40-1 = "（總覺得……讓我\n想起了Water Time）"
10130-50-1 = "那是……什麼呢。"
10130-60-1 = "（以前幾乎沒能\n來過這種地方呢……）"
10130-70-1 = "咖啡廳的打工……\n有沒有在招募呢？"
10130-80-1 = "歡迎回來，老師。\n今天的值日生由我擔任，\n我是梯昴。"
10130-90-1 = "我正在待命。\n請問有什麼指示嗎？"
10130-100-1 = "咦？「先放輕鬆」……？"
10130-110-1 = "零食也可以隨意吃……？"
10130-120-1 = "那，那怎麼行！\n就算是值日生……"
10130-130-1 = "……"
10130-140-1 = "那麼，我就吃一點……"
10130-150-1 = "這些話我只在這裡說……"
10130-160-1 = "被稱呼為奧利斯「分校」……\n我其實不是很喜歡。"
10130-170-1 = "被說是「分校」的話，不就會\n給人地位低於本校……或者\n是個被隔離的地方的印象嗎？"
10130-180-1 = "……不好意思，\n我剛剛在思考留在\n奧利斯的大家的事。"
10130-190-1 = "就算是為了那些孩子，\n我也必須努力才行。"
10130-200-1 = "……咦？「也要為自己努力」？"
10130-210-1 = "謝……謝謝你……"
10130-220-1 = "咦？讀書……？\n我，我有好好讀書哦。"
10130-230-1 = "唉……不過，\n為什麼要學這些看起來\n派不上用場的東西……"
10130-240-1 = "「就算現在不懂，總有一天\n　也會派上用場」……是嗎？"
10130-250-1 = "啊啊，真是的……\n好好好，我知道了啦！"
10130-260-1 = "那個……每次見到老師，\n我都會有種奇妙的感覺。"
10130-270-1 = "因為至今為止，\n對我這麼好的大人……\n從來沒有出現過。"
10130-280-1 = "祝你生日快樂，老師。"
10130-290-1 = "那個，因為我能做的事情不多，\n只能送上祝福的話而已……"
10130-300-1 = "咦？下次想聽我吹口琴……？\n這，這……"
10130-310-1 = "唉……我知道了。\n只有老師才有哦？"
10130-320-1 = "生日……願意為我慶祝，\n真的很謝謝你，老師。"
10130-330-1 = "在奧利斯，\n生日是很重要的。"
10130-340-1 = "互相祝福彼此的生日……"
10130-340-2 = "如果連這個都放棄了的話，\n感覺就連真正重要的某些東西\n都會消失不見。"
10130-350-1 = "不過呢……因為會被罵的關係，\n也不能慶祝得太盛大就是了。"
10130-360-1 = "一年結束，新的一年\n開始的日子──"
10130-370-1 = "以前，我明明希望\n這種日子最好不要來的。"
10130-370-2 = "真是不可思議……\n現在，我覺得那並不壞哦。"
10130-380-1 = "祝你新年快樂，老師。"
10130-390-1 = "是聖誕節呢。\n我姑且知道哦。"
10130-400-1 = "因為之前──\n我還開過要成為\n送三一跟格黑娜"
10130-410-1 = "槍林彈雨當禮物的\n聖誕老人的玩笑。"
10130-420-1 = "萬聖節我不是很懂……"
10130-430-1 = "如果不趁著節日討糖果的話，\n就只是平凡無奇的一天對吧。"
10130-440-1 = "感覺就像以前的奧利斯一樣。\n……只留下恐懼的那個時候。"
10130-460-1 = "總覺得，有股新鮮的感覺。"
10130-470-1 = "像這樣為某個人演奏\n還是第一次……"
10130-480-1 = "感覺，怎麼樣呢？"
10130-490-1 = "應該，不奇怪吧……？"
10130-500-1 = "那是……那個……\n我可以，認為那是真心話嗎？"
10130-510-1 = "……謝謝你。"
10130-520-1 = "其實，要是還能做點\n別的事情就好了……"
10130-530-1 = "現在的我，只能做到這些……"
10130-540-1 = "咦？「希望練習之後\n能再讓我聽」……？"
10130-550-1 = "「因為買了很多樂譜」……？"
10130-560-1 = "這，這個……"
10130-570-1 = "等到……那個時候，\n再讓我考慮一下吧。"
10130-2600-1 = "現在還完全沒有實感……\n甚至每天早上醒來，\n都會擔心這會是不是一場夢……\n真的很謝謝你，老師。我會珍惜的。"
