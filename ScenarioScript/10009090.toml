[translation]
10009090-1 = "후일담;보안 대책"
10009090-3 = "시큐리티의 핵심은 결국 접근 제한이지."
10009090-8 = "크게 보아서, 세 가지 조건을 충족시켜야 해. 기밀성, 무결성, 가용성."
10009090-9 = "들어갈 자격이 없으면 안 보여주고, 틀린 정보는 취급하지 않으며, 들어갈 자격이 있는 사람이 보내달라고 하면 보내주는 것."
10009090-10 = "고대 사회에도 이런 개념은 이미 존재했다고 해."
10009090-11 = "이 중에서 무결성을 검사하는 데에 가장 쉽게 떠올릴 수 있는 것이 암호화인데……"
10009090-12 = "암호화 블록 크기에 따라서 128, 192, 256비트 세 종류가 표준으로 지정되어 있어."
10009090-13 = "그중에서 앞으로는 256비트를 기준으로 시큐리티 정책을 개선할 거야."
10009090-14 = "이 보안 알고리즘은 크게 네 단계로 이루어져."
10009090-21 = "우선은 256비트 길이인 하나의 주 암호화 키를 받아서, 라운드들에서 사용할 여러 개의 128비트 라운드 키를 생성하지."
10009090-22 = "다음은 0라운드. 라운드 키 중 첫 번째 키를 사용, 보안 알고리즘을 한 번 실행해."
10009090-23 = "그리고 1라운드에서 13라운드까지의 과정. 여기에서는 4차 행렬을 기반으로 한 보안 프로토콜 4단계를 순서대로 실행하지. 이걸 13번 반복하게 돼."
10009090-24 = "그리고 마지막 14번째 라운드…… 지금까지의 보안 키를 순서대로 다시 한번 실행해 암호화를 마치게 되지."
10009090-26 = "뚫으려는 자와 막으려는 자 사이의 대결은, 대개 뚫으려는 자의 승리로 끝난다고 하지만."
10009090-27 = "과학과 기술의 발전은 보안의 영역에도 영향을 끼쳤고, 결과적으로 둘을 거의 대등한 관계로 만드는 데까지 성공한 거야."
10009090-28 = "(점점 아무도 알 수 없는 이야기를 하기 시작한 치히로였다.)"
10009090-29 = "저기, 저희가 알고 싶은 것은, 그걸 해제하기 위해서는 어떤 일을 어떻게 해야 하는가, 정도입니다만……"
10009090-30 = "글쎄? 문을 통째로 뜯어내기라도 하지 않는 한 불가능하지 않을까?"
10009090-35 = "……"
10009090-36 = "여전히 낡은 시설이로군요……"
10009090-41 = "나름대로 보안 시스템은 개선된 것 같군요. 전자식 도어록도 새것으로 바꾼 것 같지만, 정작 경첩이 헐거워져 있고……"
10009090-42 = "후후후…… 어리석군요. 이 정도로 저를 가둘 수 있다고 생각하다니."
10009090-49 = "자, 문을 통째로 뜯어냈으니, 나가 볼까요?"
10009090-55 = "후후훗……."
10009090-56 = "제게서 벗어날 수 없답니다!"
