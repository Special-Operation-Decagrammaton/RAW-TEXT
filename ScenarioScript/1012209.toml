[translation]
1012209-1 = "그래도 괜찮아"
1012209-4 = "……아, 안녕. 선생님."
1012209-5 = "[s] \"안녕, 미카.\""
1012209-9 = "내가 부르긴 했지만 민망하네……"
1012209-10 = "저, 저기 앉을 수 있는 곳으로 갈까?"
1012209-15 = "(자리에 앉은 미카가 주섬주섬 도시락을 꺼냈다)"
1012209-19 = "간단하게 샌드위치를 만들어 봤는데……"
1012209-20 = "맛은 보장 못 해. 으응……"
1012209-21 = "그, 그럼 연다……?"
1012209-22 = "[s] \"과연 미카의 요리는……!!\""
1012209-23 = "에, 에잇!!"
1012209-28 = "보, 보기에는 별로 맛없어 보이긴 하는데……"
1012209-29 = "그래도 맛은 있을……!"
1012209-30 = "……"
1012209-31 = "모르겠네…… 레시피대로 하긴 했는데……"
1012209-32 = "[ns] \"그래도 정성이 느껴지는걸……\""
1012209-33 = "헤헤…… 자, 어서 먹어봐. 선생님."
1012209-37 = "(샌드위치를 하나 집었다.)"
1012209-40 = "[ns] \"잘 먹겠습니다!\""
1012209-42 = "그, 그럼 나도……"
1012209-46 = "[ns] \"이 맛은……\""
1012209-47 = "……"
1012209-48 = "어?"
1012209-49 = "왜, 왜 이런 맛이 나지……? 레시피대로 했는데……?"
1012209-50 = "마요네즈가 없어서 대신 굴 소스를 넣고,"
1012209-51 = "피클은 별로 안 좋아하니까 조금만 넣었고,"
1012209-52 = "여름에는 염분이 부족해진다고 하니까, 소금을 좀 많이 넣었고…… 단짠단짠이니까 설탕도 넉넉하게……"
1012209-53 = "[s] \"완전히 새로운 레시피를 창조했구나, 미카.\""
1012209-54 = "그, 그렇지만~~!! 그렇게 해도 맛있을 것 같았는데!"
1012209-59 = "서, 선생님. 억지로 먹을 필요 없어. 맛없으면 그냥……"
1012209-60 = "응? 먹을 만하다고?"
1012209-61 = "저, 정성이 담겨서 나름 맛있다고……?"
1012209-62 = "우우……"
1012209-63 = "미안해…… 맛있는 샌드위치를 대접하고 싶었는데……"
1012209-64 = "[s] \"생각해서 만들어준 거잖아. 고마워, 미카.\""
1012209-65 = "……응. 헤헤."
1012209-66 = "먹어줘서 고마워, 선생님."
1012209-70 = "어? 뭔가……"
1012209-71 = "나, 조금 달라진 것 같기도 해."
1012209-72 = "예전 같았으면 잘 해내지 못해서 엄청 속상했을 것 같은데……"
1012209-73 = "지금은 그렇게까지 기분이 나쁘지는 않거든."
1012209-74 = "그냥…… 다음에 더 잘하면 된다는 생각이 들었어."
1012209-75 = "[s] \"그거, 엄청 긍정적인 마음인데?\""
1012209-76 = "그, 그렇지?"
1012209-77 = "선생님이랑 보낸 시간이 효과가 있는 것 같아."
1012209-78 = "또, 선생님이 맛있게 먹어줘서 그런 것 같기도 하고. 헤헤."
1012209-79 = "……"
1012209-80 = "왠지, 조금 모자란 나도 괜찮은 것 같아."
1012209-81 = "서툴고, 바보 같고, 실수투성이지만……"
1012209-82 = "그래도…… 괜찮지 않을까?"
1012209-85 = "[ns1] \"물론이지.\"\n[ns2] \"얼마든지 그래도 괜찮아.\""
1012209-91 = "……응!!"
1012209-92 = "지금도 그렇고, 앞으로도……"
1012209-93 = "잘 부탁해, 선생님."
