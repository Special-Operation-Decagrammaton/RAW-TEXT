[translation]
10055085-2 = ""
10055085-3 = "喲呵呵！看到了嗎！這就是我們[ruby=萬魔殿之人]萬魔船[/ruby]的實力！"
10055085-5 = ""
10055085-6 = "這些傢伙不是普通的海盜耶！？"
10055085-7 = "尤其那個銀髮船長不是省油的燈！就連澄華都被一擊打倒了！"
10055085-8 = "那傢伙不是挺強的嗎……？"
10055085-9 = ""
10055085-11 = ""
10055085-12 = ""
10055085-13 = "撤退，撤退！"
10055085-14 = "咦，人還好好的耶？"
10055085-15 = "我明明看到他倒下了……？"
10055085-16 = "那還用說！沒有人知道在海上會發生什麼事，怎麼能隨便亮出全部的實力呢！#n力量這種東西就是要盡可能隱藏才對！"
10055085-17 = "說得那麼好聽，結果就是隨便打打而已嘛……"
10055085-18 = "意思是認真打的話就能贏？"
10055085-19 = "……老實說，對上那個人我有～點沒自信呢。"
10055085-20 = "就體感來說是這樣。該說和副部長交手時的感覺有點像嗎？"
10055085-21 = "什麼？那不就是怪物了嗎！？"
10055085-22 = "啊，他們包圍過來了！快逃！"
10055085-23 = ""
10055085-25 = ""
10055085-26 = ""
10055085-27 = "膽敢登上本大人的旗艦俾斯丸，居然還想平安回去！"
10055085-28 = "給我追！把他們通通都拿去餵鯊魚！"
10055085-29 = ""
10055085-30 = "那個，雖然這是我第一次看到真琴前輩戰鬥……"
10055085-31 = "但再怎麼說也太強了吧……？"
10055085-32 = "那是恍惚狀態！"
10055085-33 = "咦？是催眠時的那個嗎？"
10055085-34 = "沒錯。現在的真琴醬深信自己是窮兇惡極的海盜船長。"
10055085-35 = "多虧了那個暗示，他才能發揮出超乎平常的力量。"
10055085-36 = "光是相信就能變強嗎？"
10055085-37 = "那當然。心理狀態會影響身體，這在運動領域早就是常識了。"
10055085-38 = "我的催眠術能讓部下們變強，也是應用了這個原理。"
10055085-39 = "啊哈！我一下子就懂了！"
10055085-40 = "不對！可信度一下子就沒了啦！"
10055085-41 = "不過，只靠自我暗示應該不會有這麼大的效果才對……真不愧是真琴醬呢。"
10055085-42 = "……那不就是說他是個頭腦簡單的笨蛋嗎？"
10055085-44 = ""
10055085-45 = "那些傢伙逃走了！"
10055085-46 = "我們贏了！"
10055085-47 = ""
10055085-49 = ""
10055085-50 = ""
10055085-51 = "船長！船長！船長！"
10055085-52 = "喲呵呵呵！看到了嗎！這就是……！"
10055085-53 = ""
10055085-55 = ""
10055085-56 = "什，什麼！？這劇烈的震動是怎麼回事！？"
10055085-57 = "大，大事不好了，船長！"
10055085-58 = "是敵人的增援！不是機關槍，是真正的艦砲！"
10055085-59 = "增援！？這裡可是大海正中央！增援要從哪裡來！？"
10055085-60 = "[s1] 「怎麼好像有種既視感……」\n[s2] 「這個發展好像在哪裡看過。」"
10055085-63 = "在水平線那頭！出現了！"
10055085-64 = "是艦隊，大規模的艦隊！"
10055085-65 = "三叉戟風紀委員會的主力艦隊抵達了！"
10055085-66 = "卑鄙的傢伙！居然叫援軍！"
10055085-67 = "全員反擊！把那些船艦全都拿去餵鯊魚！"
10055085-68 = "不可能的！我們的大砲根本打不到！"
10055085-69 = "那跟巡洋船的等級完全不同！砲彈不可能有效的！"
10055085-70 = "可惡！又在說喪氣話！"
10055085-71 = "沒骨氣的傢伙！本大人親自出馬！"
10055085-72 = ""
10055085-74 = ""
10055085-75 = "嗚啊！？失去平衡……"
10055085-76 = ""
10055085-78 = ""
10055085-80 = "[ns3] 「啊，真琴！？」\n[ns4] 朝真琴跑過去"
10055085-83 = "[ns5] （距離不夠……！）\n[ns6] （這樣下去真琴會掉進海裡……！）"
10055085-87 = "……你到底在做什麼啊！"
10055085-89 = ""
10055085-90 = ""
10055085-91 = ""
10055085-92 = "你瘋了嗎！？差點就掉進海裡了耶！"
10055085-93 = "伊，伊呂波？"
10055085-94 = "我還以為你討厭我……"
10055085-95 = "……啊！真是的！"
10055085-96 = "你已經夠笨了，還打算笨到什麼程度啊！？#n這種狀況下誰還會計較那種事！？"
10055085-97 = "而且真琴前輩你根本是旱鴨子吧！"
10055085-99 = "什麼！？你怎麼知道！？本大人明明藏得天衣無縫！？"
10055085-100 = "你把游泳課全都翹掉，就算不想知道也會知道好嗎！？"
10055085-101 = ""
10055085-103 = ""
10055085-104 = "而且，我本來就……！"
10055085-105 = "像這樣先開口道歉的前輩……！"
10055085-106 = ""
10055085-110 = "又被擊中了！"
10055085-111 = "要，要沉了！"
10055085-112 = ""
10055085-115 = "（就這樣，俾斯丸沉入了海底）"
