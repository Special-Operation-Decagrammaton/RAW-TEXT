[translation]
10055085-3 = "ヨーホホ！見たか、[ruby=マン・オブ・パンデモニウム]我が万魔船の底[/ruby]力を！！"
10055085-6 = "こいつら、普通の海賊じゃないぞ！？"
10055085-7 = "特にあの銀髪の船長……只者じゃねえ、スミカも一撃だったけど！？"
10055085-8 = "あいつって結構強くなかった……？"
10055085-13 = "後退！後退です！"
10055085-14 = "あれ？ピンピンしてる。"
10055085-15 = "さっき倒れてたよな……？ちゃんと見たぞ。"
10055085-16 = "いきなり本気を見せるわけないでしょう、当然です！本気は隠せば隠すほどいいんですから！"
10055085-17 = "なんかイイ感じに言ってるけど、要はテキトーにやったってことだろ……？"
10055085-18 = "本気出せば勝てるってこと？"
10055085-19 = "……正直、あの人の相手はちょっと自信ないですね。"
10055085-20 = "そうですね……体感的に、副部長の相手をしてるような感じ？というか。"
10055085-21 = "はっ？そんなんただの化け物じゃん！"
10055085-22 = "あっ、囲まれるっ！逃げるぞ！！"
10055085-27 = "我がビス丸に土足で上がりおって……無事に帰れると思うか？"
10055085-28 = "一人も残さずサメの餌食にしてやれ！"
10055085-30 = "あのぉ……マコト先輩が戦ってる姿、初めて見たんですが……。"
10055085-31 = "にしても強すぎませんか……？"
10055085-32 = "あれはトランス状態よ！"
10055085-33 = "えっ？催眠の時のアレ、ですか？"
10055085-34 = "そう。今のマコトちゃんは、自分を極悪非道な海賊船長と信じ込んでるわ。"
10055085-35 = "そのおかげでいつも以上の力を出せてるの。"
10055085-36 = "思い込みだけで強くなるんですか？"
10055085-37 = "もちろん。心理状態は身体に影響を及ぼすって、スポーツ分野ではすでに常識よ。"
10055085-38 = "私の催眠術でみんなが強くなるのも、それの応用ってわけ。"
10055085-39 = "なるほど！よく分かりましたっ！"
10055085-40 = "一気に信憑性なくなりましたけど！？"
10055085-41 = "でも、普通は自己暗示でここまでの効果は出ないわ……#nさすがマコトちゃんってところかしら。"
10055085-42 = "……バカ単純ってことではなく？"
10055085-45 = "奴らが逃げたぞ！"
10055085-46 = "勝った！！"
10055085-51 = "キャプテン！マコト！キャプテン！マコト！"
10055085-52 = "ヨーホホ！見たかこれが我々の……！"
10055085-56 = "なっ、なんだこの揺れは！？"
10055085-57 = "た、大変ですキャプテンマコト！"
10055085-58 = "敵の増員です！機関銃じゃなく本物の艦砲です！"
10055085-59 = "増員！？ここは遠洋だぞ？どこから増員が来るというのだ！？"
10055085-60 = "[s1] \"なんだか既視感が……。\"\n[s2] \"見たことあるような流れだ。\""
10055085-63 = "水平線向こうに！奴らが現れました！"
10055085-64 = "艦隊……大規模な艦隊です！"
10055085-65 = "トライデントのメイン艦隊が到着しました！！"
10055085-66 = "卑怯な奴らめ……援軍を呼ぶだと？"
10055085-67 = "みな、応戦だ！あいつらも全員、サメの餌食にしてやれ！！"
10055085-68 = "無理です！こっちの大砲じゃそもそも届きません！"
10055085-69 = "巡視船とはワケが違います！こっちの砲弾が効くわけないっす！？"
10055085-70 = "ええいっ！また泣き言か！"
10055085-71 = "根性のない奴らだ！私がやる！"
10055085-75 = "うあっ！？滑っ……。"
10055085-80 = "[ns3] \"あっ、マコト！？\"\n[ns4] マコトに向かって走る。"
10055085-83 = "[ns5] （届か、ない……！）\n[ns6] （このままじゃマコトが海に……！）"
10055085-87 = "……何やってるんですか！！"
10055085-92 = "気は確かですか！？海に落ちるとこでしたよ！？"
10055085-93 = "い、イロハ？"
10055085-94 = "お前は私を、嫌ってるとばかり……。"
10055085-95 = "……ああっもう！"
10055085-96 = "本物のバカなんです！？#nこんな状況でそんなこと気にしてる場合ですか！？"
10055085-97 = "というか、マコト先輩カナヅチですよね！？"
10055085-99 = "なっ、どうやってそれを！？マコト様最大の秘密をっ！？"
10055085-100 = "水泳の授業全部休んでるのに、知らないわけないでしょうが！！"
10055085-104 = "それに私はそもそも……！"
10055085-105 = "先に謝ってくるような先輩、なんて……。"
10055085-110 = "また着弾しました！"
10055085-111 = "し、沈んでしまう……！！"
10055085-115 = "（そしてビス丸は海の底へ沈んでいった）"
