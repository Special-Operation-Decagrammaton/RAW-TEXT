[translation]
10055085-3 = "요호호! 보았느냐! 우리 [ruby=맨 오브 판데모니움]만마선[/ruby]의 저력을!"
10055085-6 = "이 녀석들, 평범한 해적이 아닌데?!"
10055085-7 = "특히 저 은발 선장은 보통내기가 아니야! 스미카도 한 방에 쓰러졌어!"
10055085-8 = "걔, 꽤 강하지 않았나……?"
10055085-13 = "후퇴, 후퇴입니다!"
10055085-14 = "어라, 멀쩡한데?"
10055085-15 = "분명히 쓰러지는 걸 봤는데……?"
10055085-16 = "당연하죠! 이 바다에서 무슨 일이 생길 줄 알고, 함부로 전력을 드러내나요! 힘은 숨길수록 좋은 법이라고요!"
10055085-17 = "그럴싸하게 말하지만, 결국 대충 싸웠다는 거잖아……."
10055085-18 = "진심으로 싸우면 이길 수 있다는 뜻?"
10055085-19 = "……솔직히 저 사람 상대로는 살~짝 자신 없네요."
10055085-20 = "체감상, 그렇네요. 부부장님을 적으로 만난 느낌이라 할까요?"
10055085-21 = "뭐? 그건 그냥 괴물이잖아?!"
10055085-22 = "앗, 포위해 온다! 도망쳐!"
10055085-27 = "감히 이 몸의 기함, 비스마루에 올라타고 무사히 돌아가려 하다니!"
10055085-28 = "쫓아서 한 놈도 빠짐없이 상어밥으로 만들어줘라!"
10055085-30 = "……저요, 마코토 선배가 싸우는 모습 자체를 처음 보기는 하는데요……."
10055085-31 = "아무리 그래도 너무 강하지 않나요……?"
10055085-32 = "저건, 트랜스 상태야!"
10055085-33 = "네? 최면할 때 그거요?"
10055085-34 = "맞아. 지금 마코토 쨩은 자신을 흉악무도한 해적 선장이라 믿어 의심치 않고 있어."
10055085-35 = "그 암시 덕분에, 평소 이상의 힘을 낼 수 있는 거야."
10055085-36 = "고작 믿는 것만으로 강해지는 건가요?"
10055085-37 = "물론이지. 심리 상태가 신체에 영향을 끼친다는 것은 스포츠 분야에서는 이미 상식이야."
10055085-38 = "내 최면술로 부하들이 강해지는 것도, 그 응용이지."
10055085-39 = "아하! 단번에 이해했습니다!"
10055085-40 = "아니! 단번에 사라졌는데요, 신뢰성!"
10055085-41 = "하지만, 고작 자기암시 정도로 이렇게 효과가 나오지는 않을 텐데…… 역시 마코토 쨩이네."
10055085-42 = "……단순 무식한 바보라는 뜻 아닌가요?"
10055085-45 = "놈들이 도망갔다!"
10055085-46 = "이겼다!"
10055085-51 = "캡틴! 캡틴! 캡틴!"
10055085-52 = "요호호호! 보았느냐! 이게 바로……!"
10055085-56 = "뭐, 뭐냐?! 이 엄청난 진동은?!"
10055085-57 = "크, 큰일입니다, 캡틴!"
10055085-58 = "적의 증원입니다! 기관총이 아니라, 진짜 함포입니다!"
10055085-59 = "증원이라니?! 여기는 바다 한복판이란 말이다! 어디서 증원이 올 수 있단 말이냐?!"
10055085-60 = "[s1] \"뭔가, 데자뷔가…….\"\n[s2] \"본 적 있는 흐름이다.\""
10055085-63 = "수평선 너머로! 나타났습니다!"
10055085-64 = "함대, 대규모 함대입니다!"
10055085-65 = "트라이던트 선도부의 본 함대가 도착했습니다!"
10055085-66 = "비열한 녀석들! 원군을 부르다니!"
10055085-67 = "다들 대응 사격하라! 저 함선들 모두 상어밥으로 만들어줘라!"
10055085-68 = "불가능해요! 저희 대포로는 아예 사거리가 안 나와요!"
10055085-69 = "순찰선이랑은 체급부터 다릅니다! 대포알이 먹힐 리가 없어요!"
10055085-70 = "에에잇! 또 우는 소리냐!"
10055085-71 = "근성 부족한 녀석들! 이 몸이 직접 나서겠다!"
10055085-75 = "으앗?! 균형이……."
10055085-80 = "[ns3] \"앗, 마코토?!\"\n[ns4] 마코토를 향해 달린다."
10055085-83 = "[ns5] (거리가, 안 닿아……!)\n[ns6] (이대로면 마코토가 물에……!)"
10055085-87 = "……뭐 하는 거예요!"
10055085-92 = "제정신이에요?! 바다에 빠질 뻔했다고요!"
10055085-93 = "이, 이로하?"
10055085-94 = "너는 나를 미워한다 생각했는데……."
10055085-95 = "……아! 진짜!"
10055085-96 = "이미 바보면서 얼마나 더 바보가 될 셈인가요?! 이런 상황에 그런 걸 따질 거 같아요?!"
10055085-97 = "게다가 마코토 선배, 맥주병이잖아요!"
10055085-99 = "뭣?! 그걸 어떻게?! 철저히 숨기고 있었는데?!"
10055085-100 = "수영 수업을 전부 빼먹으면, 모르고 싶어도 알거든요?!"
10055085-104 = "그리고, 저는 애초에……!"
10055085-105 = "먼저 사과하는 선배 모습 같은 건……!"
10055085-110 = "또 착탄!"
10055085-111 = "가, 가라앉는다!"
10055085-115 = "(그렇게, 비스마루는 바닷속으로 가라앉았다.)"
