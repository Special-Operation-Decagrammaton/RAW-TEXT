10055085-37 = "Of course. It's like how people's mental state affects their performance in sports."
10055085-38 = "And my hypnosis making my subordinates stronger is also an application of the same principle."
10055085-39 = "Aha! Makes sense to me!"
10055085-40 = "None of that made sense! In fact, it made it less believable!"
10055085-41 = "Of course, simple suggestion wouldn't have this kind of effect on just anyone. Makoto is just special in that way."
