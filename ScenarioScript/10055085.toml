[translation]
10055085-2 = ""
10055085-3 = "โฮ่ๆๆ! เห็นศักยภาพของเรือแมน ออฟ แพนเดโมเนียมของเราหรือยังล่ะ!"
10055085-5 = ""
10055085-6 = "พวกนี้ไม่ใช่โจรสลัดธรรมดาเลยนี่?!"
10055085-7 = "โดยเฉพาะกัปตันผมเงินนั่น ไม่ใช่เล่นๆ เลยนะ! สุมิกะโดนซัดทีเดียวก็ล้มไปแล้วเลย!"
10055085-8 = "ยัยนั่นเองก็มีฝีมือไม่ใช่รึไง...?"
10055085-9 = ""
10055085-11 = ""
10055085-12 = ""
10055085-13 = "ถอนกำลัง ถอนกำลังก่อน!"
10055085-14 = "อ้าว ก็ดูโอเคอยู่นี่นา?"
10055085-15 = "ฉันเห็นกับตาว่าล้มไปแล้วแท้ๆ...?"
10055085-16 = "ก็ต้องทำแบบนั้นอยู่แล้วสิคะ! ใครจะไปรู้ล่ะว่าในทะเลนี้จะเกิดอะไรขึ้น จะเผยฝีมือเต็มที่ให้เห็นได้ยังไง! พลังน่ะยิ่งซ่อนเร้นไว้ก่อนก็ยิ่งดีค่ะ!"
10055085-17 = "พูดซะสวยหรู แต่สุดท้ายก็คือสู้แบบขอไปทีนั่นแหละ..."
10055085-18 = "หมายความว่าถ้าสู้แบบเอาจริงก็ชนะได้เหรอ?"
10055085-19 = "อันที่จริงถ้าต้องสู้กับคนคนนั้น ฉันก็ไม่ค่อยมั่นใจสักนิดเลยค่ะ"
10055085-20 = "ให้ความรู้สึกเหมือนกับต้องสู้กับรองหัวหน้าชมรมเลยละมั้งคะ?"
10055085-21 = "ว่าไงนะ? งั้นก็เป็นสัตว์ประหลาดของแท้เลยน่ะสิ?!"
10055085-22 = "อ๊ะ พวกนั้นเข้ามาล้อมไว้แล้ว! หนีเร็ว!"
10055085-23 = ""
10055085-25 = ""
10055085-26 = ""
10055085-27 = "บังอาจขึ้นมาบนเรือบิสมารุของเราแบบนี้ คิดว่าจะกลับไปได้อย่างปลอดภัยงั้นเหรอ!"
10055085-28 = "ตามเจ้าพวกนั้นไป จับไปโยนเป็นอาหารฉลามอย่าให้เหลือแม้แต่คนเดียว!"
10055085-29 = ""
10055085-30 = "ฉันเองก็เพิ่งเคยเห็นรุ่นพี่มาโคโตะต่อสู้เป็นครั้งแรกเลยค่ะ..."
10055085-31 = "ว่าแต่แบบนี้จะไม่เก่งเกินไปหน่อยเหรอคะ...?"
10055085-32 = "ก็อยู่ในภาวะทรานซ์นี่!"
10055085-33 = "คะ? ภาวะที่เกิดขึ้นตอนถูกสะกดจิตน่ะเหรอคะ?"
10055085-34 = "ใช่ ตอนนี้มาโคโตะจังเชื่อสนิทใจเลยว่าตัวเองเป็นกัปตันโจรสลัดสุดโหด"
10055085-35 = "เพราะถูกชี้นำให้เชื่อแบบนั้น เลยทำให้ใช้แรงได้มากกว่าปกติไงล่ะ"
10055085-36 = "แค่เชื่อก็แข็งแกร่งขึ้นได้เหรอคะ?"
10055085-37 = "แน่นอน แม้แต่ในวงการกีฬาก็เป็นที่รู้กันว่าเรื่องสภาพจิตใจน่ะ ส่งผลต่อร่างกายมากๆ เลยนะ"
10055085-38 = "ที่พวกลูกน้องแข็งแกร่งขึ้นด้วยวิชาสะกดจิตของฉัน ก็เป็นการประยุกต์ใช้จากหลักการนี้แหละ"
10055085-39 = "อ๋อ! เข้าใจกระจ่างเลยค่ะ!"
10055085-40 = "เดี๋ยวสิ! ความน่าเชื่อถือหายวับไปเลยต่างหากค่ะ!"
10055085-41 = "แต่ว่าแค่ทำให้ตัวเองเชื่อแบบนั้นเฉยๆ มันไม่น่าจะได้ผลขนาดนี้เลยนะ... สมกับที่เป็นมาโคโตะจังจริงๆ เลย"
10055085-42 = "แปลว่าเป็นคนโง่ที่คิดอะไรตื้นๆ ไม่ใช่เหรอคะ...?"
10055085-44 = ""
10055085-45 = "เจ้าพวกนั้นหนีไปแล้ว!"
10055085-46 = "พวกเราชนะแล้ว!"
10055085-47 = ""
10055085-49 = ""
10055085-50 = ""
10055085-51 = "กัปตัน! กัปตัน! กัปตัน!"
10055085-52 = "โฮ่ๆ! เห็นหรือยัง! นี่แหละคือ...!"
10055085-53 = ""
10055085-55 = ""
10055085-56 = "อะ... อะไรกัน?! ทำไมสั่นสะเทือนรุนแรงขนาดนี้ล่ะ?!"
10055085-57 = "ยะ... แย่แล้วค่ะ กัปตัน!"
10055085-58 = "ศัตรูมีกำลังเสริมมาค่ะ! ไม่ใช่แค่ปืนกล แต่มีปืนใหญ่เรือของจริงด้วยค่ะ!"
10055085-59 = "กองกำลังเสริมเหรอ?! ที่นี่มันกลางทะเลนะ! จะมีกองกำลังเสริมมาจากที่ไหนได้?!"
10055085-60 = "[s1] \"รู้สึกเหมือนเดจาวูเลย...\"\n[s2] \"เหมือนเคยเห็นเหตุการณ์แบบนี้มาก่อนเลย\""
10055085-63 = "โผล่มาจากตรงเส้นขอบฟ้าด้านโน้นค่ะ!"
10055085-64 = "กองเรือ... เป็นกองเรือขนาดใหญ่เลยค่ะ!"
10055085-65 = "กองเรือหลักของคณะกรรมการวินัยไทรเดนต์มาถึงแล้วค่ะ!"
10055085-66 = "เจ้าพวกขี้ขลาด! บังอาจเรียกกำลังเสริมมางั้นเหรอ!"
10055085-67 = "ทุกคนเตรียมยิงตอบโต้! ล่มเรือทุกลำให้กลายเป็นอาหารฉลามไปซะ!"
10055085-68 = "เป็นไปไม่ได้หรอกค่ะ! ปืนใหญ่ของเรายิงไม่ได้ไกลขนาดนั้นหรอกค่ะ!"
10055085-69 = "คนละระดับกับเรือลาดตระเวนเลยค่ะ! ลูกปืนใหญ่ของเราไม่มีทางทำอะไรเรือนั่นได้หรอกค่ะ!"
10055085-70 = "ให้ตายสิ! แค่นี้ก็คร่ำครวญกันแล้วเรอะ!"
10055085-71 = "เจ้าพวกนี้ไม่มีเลือดนักสู้เอาซะเลย! งั้นเราผู้นี้จะลงมือเอง!"
10055085-72 = ""
10055085-74 = ""
10055085-75 = "อ๊ะ?! การทรงตัวมัน..."
10055085-76 = ""
10055085-78 = ""
10055085-80 = "[ns3] \"อ๊ะ มาโคโตะ?!\"\n[ns4] วิ่งไปหามาโคโตะ"
10055085-83 = "[ns5] (ไกลเกินไป ไปไม่ทันแน่...!)\n[ns6] (ถ้าเป็นแบบนี้ มาโคโตะได้ตกน้ำแน่ๆ...!)"
10055085-87 = "คิดจะทำอะไรกันคะ...!"
10055085-89 = ""
10055085-90 = ""
10055085-91 = ""
10055085-92 = "ยังสติดีอยู่รึเปล่าคะ?! เกือบตกลงไปในทะเลแล้วนะคะ!"
10055085-93 = "อะ... อิโรฮะ?"
10055085-94 = "เรานึกว่าเธอจะเกลียดเราซะอีก..."
10055085-95 = "ฮึ่ย...! จริงๆ เลยเชียว!"
10055085-96 = "ปกติก็ทึ่มอยู่แล้ว จะทำตัวทึ่มไปถึงไหนกันคะ?! สถานการณ์แบบนี้คิดว่าจะมามัวสนใจเรื่องแบบนั้น#nเหรอคะ?!"
10055085-97 = "รุ่นพี่มาโคโตะยังว่ายน้ำไม่เป็นนี่คะ!"
10055085-99 = "ว่าไงนะ?! เธอรู้ได้ยังไงกัน?! เราอุตส่าห์ปิดเรื่องนั้นไว้เป็นอย่างดีแล้วแท้ๆ?!"
10055085-100 = "ก็รุ่นพี่โดดเรียนว่ายน้ำทุกคาบแบบนั้น ต่อให้ไม่อยากรู้ ฉันก็รู้ได้อยู่ดีนั่นละค่ะ?!"
10055085-101 = ""
10055085-103 = ""
10055085-104 = "แล้วก็นะ ฉันน่ะ...!"
10055085-105 = "ภาพรุ่นพี่ที่ยอมขอโทษก่อนอะไรแบบนั้นน่ะ...!"
10055085-106 = ""
10055085-110 = "ยิงมาอีกแล้ว!"
10055085-111 = "จะ... จะจมแล้ว!"
10055085-112 = ""
10055085-115 = "(และแล้วบิสมารุก็จมลงสู่ใต้ทะเล)"
