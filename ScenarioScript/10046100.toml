[translation]
10046100-1 = "여름, 문제아, 해변에서"
10046100-7 = "……네? 잘못씀다?"
10046100-12 = "그러니까, 프라이빗 비치를 일반 개장할 겁니다."
10046100-13 = "그것만으로는 의미가 없으니, 선전을 위해 크로노스 스쿨의 보도부원들을 초청했고요."
10046100-14 = "……역시, 별장 건물 건 때문입니까?"
10046100-15 = "아, 그것과는 무관하니, 너무 심려하지 마시길."
10046100-19 = "이치카 씨, 이 해변을 어떻게 보시나요?"
10046100-20 = "어…… 글쎄요. 예쁘다?"
10046100-21 = "네, 저도 동의합니다. 정말 아름다운 해변이죠."
10046100-22 = "이런 좋은 땅을 묵혀두고 있는 것은 아깝죠. 그러니, 최대한 많은 분이 누릴 수 있도록 대중에 개장하려 합니다."
10046100-23 = "예에…… 좋은 생각 같습니다."
10046100-24 = "혹시 저를 부르신 이유가……?"
10046100-25 = "맞습니다. 한 가지 부탁드리고 싶은 일이 있어서요."
10046100-26 = "이치카 씨만 괜찮으시다면, 이번 바캉스 기간에 해변 순찰을 맡겨도 될까요?"
10046100-27 = "순찰, 입니까?"
10046100-28 = "예, 휴가철이니만큼, 개장 직후 상당한 인파가 몰리리라 예상됩니다."
10046100-29 = "사람이 모이는 곳에는 사고가 터지기 마련이고, 어떠한 불미스러운 사태가 벌어진다면 그건 저희 티파티의 과실이 되겠죠."
10046100-30 = "아아, 이해했습니다."
10046100-31 = "이렇게 급하게 부탁드리게 되어 정말 송구하네요."
10046100-32 = "아, 아뇨! 당치도 않습니다! 맡겨주십쇼!"
10046100-33 = "후후. 믿음직스럽네요. 하지만, 그렇게 딱딱한 업무는 아닙니다."
10046100-34 = "저는 남들보다 걱정이 많은 편인 듯하여…… 이것도 살짝 과한 처사라고 이해하고 있습니다."
10046100-35 = "이치카 씨도 한 사람의 피서객으로서, 바다 산책을 즐기며 겸사겸사 가볍게 수행해 주세요."
10046100-41 = "아마 큰 문제는 없을 테니까요."
10046100-46 = "와~하하하핫!!"
10046100-50 = "개발이다, 개발!! 허가가 떨어진 이상, 망설일 이유는 없다!!"
10046100-55 = "와아!! 다들 부장을 따라라!!"
10046100-64 = "킥킥킥, 장사 준비는 순조롭게 되고 있군."
10046100-65 = "그래, 막 개장한 해변이라니까, 제대로 된 가게도 없지. 놀다가 출출하면 우리 가게에서 사 먹을 수밖에!"
10046100-66 = "우리 진짜 천재 아니냐? 이런 생각은 우리밖에 못할걸?"
10046100-68 = "어머, 제법 흥미로운 가게가 있네요? 야끼소바 한 접시에 7000엔, 아이스바 하나에 3000엔이라……."
10046100-69 = "가격에 걸맞은 자신감이 있다, 라고 이해해도 괜찮겠죠?"
10046100-70 = "그렇네요~ 미식연구회로서, 탐구심이 마구 솟구치네요★"
10046100-89 = "하하, 큰 문제는 없을 거다……."
10046100-90 = "없을 거다……."
10046100-102 = "없을 거다."
