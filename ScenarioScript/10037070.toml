[translation]
10037070-1 = "제7화;유주의 울창한 숲속에서."
10037070-4 = "읏……!"
10037070-16 = "……."
10037070-17 = "(기억이 혼란스럽구나. 무슨 일이 있었던가…….)"
10037070-18 = "(그래……. 분명 붉은겨울의 방문단과 대나무숲에서……. 판다를 보러 가자고 했고, 그리고…….)"
10037070-22 = "(그리고……?)"
10037070-23 = "[ns] \"조금 정신이 들어, 키사키?\""
10037070-27 = "선생? 선생이 왜 여기에……."
10037070-28 = "아니, 잠시만 기다려 다오. 생각을 정리할 터이니……."
10037070-32 = "……."
10037070-33 = "불을 좀 켜 줄 수 있겠는가? 방이 조금 어둡구나."
10037070-44 = "윽……!"
10037070-45 = "[s] \"……다시 끌까?\""
10037070-46 = "……부탁하마……."
10037070-48 = "대나무숲에서의 일은, 어떻게 되었는가?"
10037070-49 = "그렇구나. 방문단은 판다를 잘 보고는 돌아갔다……?"
10037070-50 = "마리나 위원장이 자꾸만 판다에게 안기려 해서, 미나가 말리느라고 고생했다고? 후후……."
10037070-51 = "마리나 위원장은 정말로 곰을 좋아하는 모양이구나. 그렇지만 판다 역시 아무리 귀여워 보여도 곰이다."
10037070-52 = "자칫하면 큰 해를 입을 수도 있었을 터인데. 미나가 고생이 많았구나."
10037070-53 = "이거야 원. 손님맞이도 제대로 해 내지 못하는 문주라니, 그야말로 문주 자격이 없구나. 그렇게 생각하지 않는가, 선생?"
10037070-54 = "[s] \"…….\""
10037070-55 = "재미있는 학생들이다. 붉은겨울의 방문단은."
10037070-58 = "체리노 서기장은, 아직 속을 잘 알 수 없지만, 상당히 강단이 있어 보이고."
10037070-59 = "토모에 비서실장은, 그 스스로는 제법 숨기려 하지만, 어쩔 수 없이 배어 나오는 지혜가 엿보이지."
10037070-60 = "마리나 위원장은…… 후후. 그 지위에 있는 것 치고는, 상당히 머리를 맑게 해 주는 사람이다. 보고 있으면 즐겁기까지 할 정도로."
10037070-61 = "모두, 좋은 학생들이로구나. 모두……."
10037070-62 = "[s] \"…….\""
10037070-66 = "……."
10037070-67 = "많이 놀랐는가, 선생?"
10037070-68 = "[s1] \"……이런 때까지 다른 사람을 챙기려 할 필요는 없어…….\"\n[s2] \"지금은 키사키가 스스로를 돌보았으면 해.\""
10037070-71 = "그렇게 말해 주는구나. 선생은."
10037070-72 = "내 상태가 다른 학생들…… 붉은겨울의 방문단에게도, 알려졌는가?"
10037070-73 = "[s] \"사야가 잘 처리해 주어서, 미나도 알아차리지 못했어.\""
10037070-74 = "그러한가. 그렇다면 안심이 되는구나."
10037070-75 = "[s] \"어떻게 된 건지 이야기해 줬으면 해.\""
10037070-76 = "무얼, 대단한 것은 없다."
10037070-77 = "그저…… 이 몸은, 하루에 제한된 시간 외에는 제대로 움직이지 못할 정도로, 나약한 것이 되었을 뿐이니."
10037070-78 = "[s] \"그건 정말로 큰일이 아닐까!?\""
10037070-79 = "괜찮다. 아직 움직일 수 있지 않은가. 그렇다면 할 수 있는 일이 있다는 게다. 그것으로 족하다. 그것으로……."
10037070-80 = "이 사실을 알고 있는 학생이, 또 있느냐고?"
10037070-81 = "나의 이해가 틀리지 않았다면, 사야 이외에는 아무도 알지 못한다."
10037070-82 = "그래, 루미조차도 모를 것이다. 아무에게도 알려지지 않도록 했으니 말이다."
10037070-83 = "루미와는 오래 알고 지낸 사이가 아니었느냐고? 그것은 그렇지."
10037070-84 = "허나 그 아이와 함께 자랐던 시절의 나는, 이렇게까지 나약하지 않았으니 말이다."
10037070-85 = "[s] \"언젠가부터 갑작스럽게 이렇게 되었다는 거야?\""
10037070-89 = "……."
10037070-90 = "모든 것은, 내가 이례적으로 2학년부터 현룡문의 문주 자리에 올랐을 때부터 시작되었다."
10037070-93 = "문주는 관례적으로 3학년생이 맡게 되는 것이 보통이었으나, 그 3학년생이 조금, 불미스러운 일로 실각하게 되어서 말이지."
10037070-94 = "어째서인지 다들 만장일치로 나를 추대하더구나."
10037070-95 = "지금 생각해도 기묘한 일이다. 그렇게 전통을 중시한다는 학생들이, 관례를 깨고 그때의 2학년생을 현룡문의 문주로 추대하다니……."
10037070-96 = "[s3] \"그건, 어쩌면…….\"\n[s4] \"현룡문의 문주라는 건, 사실 힘들기만 한 자리였으니까……?\""
10037070-101 = "……후후."
10037070-102 = "진실의 파편에 너무 다가가지 않는 게 좋을 때도 있지 않을까 한다만. 선생."
10037070-103 = "2학년이면서 문주가 된 내가 가장 먼저 내린 결정은, 어떤 3학년을 직권 퇴학시키는 일이었다."
10037070-104 = "다들 반발했지. 한 명의 산해경 학생에게 그런 엄벌을 내릴 때에는, 전통대로의 절차와 과정을 반드시 지켜야 한다고 말이야."
10037070-105 = "……역설적이라고 생각했다. 2학년생을 문주의 자리로 추대할 때에는 그런 이야기를 하지 않던 자들이, 그 결정에 대해서는 전통을 찾더구나."
10037070-106 = "이런, 이야기가 옆으로 새어 나갔구나. 원래대로 되돌리도록 하지."
10037070-107 = "내 몸에 이상이 생기기 시작한 것은…… 그 직후였다."
10037070-108 = "후후. 어쩌면 그것이 문주라는 자리의 무게, 또는 이 옥좌의 무게인지도 모를 일이지?"
10037070-109 = "[s] \"…….\""
10037070-110 = "이런. 왜 그리 얼굴이 어두운 것인가, 선생. 이만하면 지금까지 제법 잘 속여 오지 않았는가?"
10037070-111 = "루미도 선생도 모를 정도로, 내 연기가 쓸만했다는 뜻이 되겠지."
10037070-112 = "이 정도면 다른 학원에서 연극이나 영화 동아리 활동을 해도 괜찮지 않겠냐는 말이다."
10037070-113 = "후후후. 키보토스의 배우계는 어쩌면 큰 인재를 잃고 있는 것인지도 모른다. 그렇게 생각하지 않는가, 선생?"
10037070-114 = "[s5] \"그렇게 힘들다면, 암행 같은 것도…….\"\n[s6] \"그만두는 게, 좋지 않을까?\""
10037070-117 = "……그래. 그것이 옳은 일이겠지."
10037070-118 = "자기 몸도 제대로 가누지 못하는 자가, 얌전히 구중궁궐에 앉아 보양이나 하고 있을 것이지."
10037070-119 = "무얼 볼 것이 있다고 다른 모습으로까지 변해, 쓸데없이 바깥을 쏘다니는 것인가, 하고 말이지."
10037070-120 = "[s] \"…….\""
10037070-121 = "그렇지만, 선생. 물론 나의 이기적이고 어리석은 욕심에 지나지 않는 것이지만, 말이다."
10037070-122 = "더…… 모든 것이 진짜로 늦어버리기 전에."
10037070-123 = "하나라도 더욱, 이 눈으로 직접, 많은 것을 보고 싶은 것이야……."
10037070-124 = "[s7] \"왜…… 다른 학생들에게 아프다는 걸 숨기고 있는 거야?\"\n[s8] \"솔직하게 도움을 구하면, 방법이 생길지도 모르는데.\""
10037070-129 = "……."
10037070-130 = "현룡문의 문주라는 것이, 그런 자리이기 때문이다."
10037070-141 = "언제나 강하고 완벽한 모습을 보이지 않으면, 안쪽에서부터 잡아먹히고 만다."
10037070-142 = "나 이전의 문주가, 바로 그렇게 실각하고 말았으니 말이다."
10037070-145 = "문주라는 자리에 그렇게 연연할 필요가 있느냐고? 나 역시 그렇게 생각할 수 있다면, 조금은 편해질지도 모르겠지만……."
10037070-146 = "그…… 기억하는가, 선생? 산해경의 학생들…… 현룡문의 아이들은."
10037070-147 = "방문객들을 현룡문의 방식으로 극진히 모시라는 말을, 취조실로 방문객을 압송해."
10037070-148 = "무슨 음모를 꾸미고 있는지 알아내야 한다는 식으로 해석하곤 하니 말이다……."
10037070-149 = "[s9] \"다, 다른 학원에도 엇나간 행동을 하는 학생이 많아!\"\n[s10] \"미식연구회라든가 온천개발부라든가!\"\n[s11] \"밀레니엄의 엔지니어부 아이들도, 심성은 물론 착하지만……!\""
10037070-153 = "그러한가……."
10037070-154 = "……."
10037070-155 = "그렇지만, 선생."
10037070-156 = "나는 아무래도…… 산해경을 내버려두기가 어려운 모양이다."
10037070-160 = "(누워 있던 키사키가, 천천히 상반신을 일으켰다.)"
10037070-167 = "(키사키가 조용히, 이마를 가슴에 부딪혀 왔다.)"
10037070-168 = "(창 너머 달빛이, 방 안을 들여다보고 있었다.)"
10037070-171 = "부탁이 있노라. 선생."
10037070-172 = "내가 이러하다는 것이, 선생과 사야를 제외한 누구에게도 알려지지 않았으면 한다."
10037070-173 = "사야에게는 언제나 입단속을 다짐받고 있으니, 이 이야기가 새어 나간다면…… 그 근원지가 어디일지는 분명한 것이 되겠지."
10037070-174 = "[s] \"……응.\""
10037070-175 = "왜 그러는가, 선생. 괴로운 표정을 짓고 있지 않은가."
10037070-176 = "괜찮다. 아직은 살아 있고, 움직일 수도 있지 아니한가."
10037070-180 = "(키사키의 뒷머리를 가만히 쓰다듬었다.)"
10037070-181 = "후후…… 좋구나. 마음이 편안해져. 조금이지만 고통도 가라앉는 것 같다."
10037070-182 = "그렇게 괴로워하지 말거라. 선생이 아니라면 누구에게 이런 일을 부탁할 수 있겠는가."
10037070-187 = "(키사키의 맑은 눈동자와 부드러운 미소가 조용히 위를 올려다보고 있었다.)"
10037070-188 = "(그 얼굴을 마주 대할 자신이 없어, 나도 모르게 눈을 감고 말았다…….)"
10037070-195 = "……몸은 조금 괜찮은가, 문주?"
10037070-196 = "많이 나아졌다. 걱정하지 말거라."
10037070-197 = "그렇지만 이상한 일이로구나. 분명 내 그대의 단약을 오늘도 확실히 복용했거늘."
10037070-198 = "응. 바로 그 일로 찾아온 것이다."
10037070-204 = "……잘 들어주었으면 하는 것이다. 문주. 단약이 바꿔치기당한 것을 확인했다."
10037070-205 = "……?!"
10037070-206 = "그것이 무엇을 의미하는지는, 영민한 문주라면 짐작할 수 있으리라 생각하는 것이다."
10037070-212 = "우선, 내가 여기에서 연단방의 인적자원 관리에 문제가 있었음을 질책해야 하는가?"
10037070-213 = "그런 질책이라면 얼마든지 받아들일 각오가 되어 있는 것이다…… 그렇지만 더 큰 문제가 남아 있는 것이다……!"
10037070-214 = "연단방의 핵심적인 자리에, 내통자가 있었다는 뜻이로구나."
10037070-215 = "그렇게밖에는 해석할 수 없겠지……?"
10037070-216 = "……북방의 찬 바람을 불렀다고 생각했더니, 정작 바람은 다른 곳에서 불고 있었는가……."
10037070-217 = "내일부터는 나님이 직접 문주에게 단약을 제조해, 전달하도록 하겠다. 연단방 전체의 조직도 다시 점검해야 할 것이고."
10037070-218 = "서글픈 것이다. 다른 누구도 아닌 연단방의 부장이, 부원들을 믿지 못하는 상황이 될 것이라고는……."
10037070-219 = "자주는 아니어야 하겠지만, 이따금 일어나는 일이지."
10037070-220 = "문주도 한층 더 조심하는 게 좋을 것이라는 것이다. 책임과 처벌이라면, 이 일이 끝난 후에 얼마든지 받을 테니……."
10037070-221 = "그래. 그러도록 하지. 그대도 아무쪼록 조심하거라."
10037070-222 = "미안한 것이다……. 나님이 좀 더, 완벽한 단약을 만들 수 있었다면……."
10037070-223 = "문주의 상태를 조금이라도 호전시킬 수 있는 약재를 발견할 수 있었다면……."
10037070-224 = "하지만 언제나 일시적이고, 부작용도 따르고, 현상 유지밖에 할 수 없는 결과물뿐이니……."
10037070-225 = "무슨 말을 하고 있는 겐가. 그대의 단약이 없었다면 아예 아무것도 되지 않았을 것이야."
10037070-229 = "문주…… 부탁이 있는 것이다. 1주일, 아니, 적어도 내일 하루만이라도 모든 일정을 취소하고 안정을 취했으면 하는 것이다."
10037070-230 = "후후. 그것은 역시 무리이겠구나. 아무래도 귀한 손님들이 와 계시니 말이다."
10037070-231 = "물론 손님맞이가 끝나면, 그대의 말대로 당분간 안정을 취하도록 하겠다. 그러니 조금만 더, 이 못난 환자를 이해해 다오."
10037070-232 = "……알겠는 것이다……."
10037070-238 = "전화가……?"
10037070-242 = "나를 찾는 전화로구나. 이건…… 카구야?"
10037070-249 = "무슨 일인가. 제법 늦은 시간일 텐데 말이다."
10037070-253 = "예. 늦은 시간, 송구스럽기 그지없습니다. 문주님! 하지만 새로운 경극의 구상이 지금 막 완료되어서요!"
10037070-254 = "가능하다면 내일, 붉은겨울의 여러분이 방문을 마치기 전에, 새 경극을 공연해 드리고 싶은데. 괜찮으시겠습니까?"
10037070-255 = "새 경극이라……. 우선, 수고했다는 말을 전해야겠구나."
10037070-256 = "그리고 공연 역시 허하도록 하마. 체리노 서기장은 그대를 상당히 마음에 들어 하는 것 같으니 말이다."
10037070-257 = "하해와 같은 너그러운 결정에 감사의 말씀을 올립니다. 문주님!"
10037070-258 = "아뢰옵기 황송하오나, 아무래도 새 경극이므로, 현룡문 부원들 역시 전원 초대드리고 싶습니다만, 괜찮으실까요?"
10037070-259 = "흠……. 그러도록 하마. 백호공원은 넓은 곳이기도 하고, 현룡문 부원들 중에서도 경극을 즐기는 자가 제법 있으니 말이다."
