[translation]
1301403-1 = "수영복과 무인도"
1301403-2 = "(약속일. 렌게와 바다에 도착했다.)"
1301403-6 = "여기가 [ruby=・]그[/ruby] [ruby=・]섬[/ruby]인가?"
1301403-7 = "그래. 아마 자네들을 방해할 사람은 없을 게야."
1301403-13 = "그럼 난 이만. 섬에서 나갈 때 다시 연락 주게나."
1301403-20 = "[ns1] \"저기, 렌게? 여긴 어떤 섬이야?\"\n[ns2] \"뭔가 평범한 섬은 아닌 것 같은데…….\""
1301403-25 = "응? 말 안 했던가?"
1301403-26 = "여긴 무인도야!"
1301403-27 = "[s] \"무, 무인도?!\""
1301403-28 = "'무인도 일일 체험'이야. 이 섬의 해변을 써도 된다고 했어."
1301403-29 = "얕은 바다에, 위험한 동물도 없어. 연락만 하면 언제든지 나갈 수 있고."
1301403-30 = "수련하기에 딱 맞는 환경이지?"
1301403-31 = "[s3] \"……둘만의 해변!\"\n[s4] \"청춘 그 자체네!\""
1301403-34 = "후후, 역시 스승님도 좋아할 줄 알았어."
1301403-35 = "그럼 바로 수련을 시작하자!"
1301403-44 = "[ns] \"또 안에 입고 왔구나?\""
1301403-45 = "스승님도 입고 왔지?"
1301403-46 = "[s] \"후후, 물론이지……!\""
1301403-54 = "좋았어! 먼저—"
1301403-55 = "바다에서 식량 확보다!"
1301403-56 = "[s] \"……식량 확보? 바다에서 노는 게 아니라?\""
1301403-57 = "……잘 들어? 여긴 무인도야."
1301403-58 = "이번 수련은 이 섬에서 생존하는 것!"
1301403-59 = "다들, 이런 청춘을 보내고들 있잖아?"
1301403-60 = "[s] \"저는 그런 청춘 없었습니다……!\""
1301403-61 = "후후, 그럼 지금부터 청춘인 거네!"
1301403-65 = "뜰채로 물고기를 잡자!"
1301403-71 = "앗! 스승님! 그쪽으로 물고기가 가고 있어!"
1301403-72 = "[s] \"내가 잡을게! 간닷……!\""
1301403-80 = "하핫, 멋진 헛스윙이네."
1301403-81 = "자, 내가 시범을 보여줄게! 그대로 따라 하라고!"
1301403-94 = "[ns5] \"어떻게 따라 하라는 거야?!\"\n[ns6] \"물고기 비가 쏟아지는데요?!\""
1301403-98 = "자, 스승님도 할 수 있어. 다시 해봐."
1301403-99 = "일단 자세부터 바르게 잡고, 정확하게 휘두르면……."
1301403-107 = "음, 내가 뒤에서 잡아줄 테니까 다시 해보자."
1301403-113 = "침착하게…… 괜찮으니까."
1301403-114 = "이제 물고기가 지나가는 타이밍에 맞춰서……."
1301403-121 = "[ns] \"오, 잡았다!\""
1301403-122 = "역시 스승님. 할 수 있잖아?"
1301403-123 = "그럼 이렇게 계속 뒤에서 잡아줄 테니까……."
1301403-124 = "잡아줄……."
1301403-129 = "(잠깐. 생각해 보니 수영복 차림으로 너무 밀착해 있었잖아?!)"
1301403-133 = "아, 아하하…… 여기서부터는 스승님 혼자서 해 봐! 그게 성장의 지름길이야!"
1301403-134 = "[s] \"그, 그렇지!\""
1301403-135 = "그, 그래! 그럼 이대로 계속 잡아보자!"
1301403-138 = "(……이후 서로의 거리를 의식하며 물고기를 잡는 청춘 활동을 이어갔다.)"
1301403-145 = "시간 참 빠르네……."
1301403-146 = "오늘 정말 즐거웠어."
1301403-147 = "햇볕 아래에서 몸을 말리고, 함께 잡은 물고기를 나눠 먹고……."
1301403-148 = "정말로 무인도에 고립됐다면 이랬을까?"
1301403-153 = "……."
1301403-154 = "전에, 무인도에 표류한 두 사람이 맺어지는 내용의 소설을 읽었는데……."
1301403-155 = "나라면 어떻게 했을까라고 계속 생각했어."
1301403-156 = "스승님도 이런 상상 해본 적 있어?"
1301403-157 = "[s7] \"응. 해봤어.\"\n[s8] \"그런 상상, 즐겁지.\""
1301403-160 = "……그렇구나."
1301403-161 = "마, 만약 무인도에서 지내게 된다면, 스승님은 어떤 파트너와 함께 있고 싶어? #n예를 들면 그…… 생존력이 높다던가, 여러 가지가 있다고 생각하는데."
1301403-165 = "……."
1301403-166 = "후후, 표정을 보니 대답하기 곤란한 모양이네. 괜찮아. 지금 말해주지 않아도."
1301403-167 = "스승님과 청춘을 즐기는 것만으로도 나는 충분하니까."
1301403-168 = "……물론 언젠간 대답을 들을 거지만 말이야."
1301403-172 = "아냐…… 아무것도 아니야!"
1301403-173 = "자……! 아무튼 시간이 늦었으니 어서 다음 준비를 하자!"
1301403-174 = "[s] \"야영 준비지? 밤도 깊었으니까.\""
1301403-175 = "스승님과의 야영…… 그것도 매력적인 청춘 활동이네."
1301403-176 = "하지만 이번 목표는 '무인도 생존'이야."
1301403-177 = "탈출 방법을 생각하는 것도 중요하잖아?"
1301403-178 = "어부 아저씨를 부르는 것도 괜찮지만……."
1301403-179 = "……자력으로 탈출하는 것까지가 무인도 생활이려나 싶어서."
1301403-183 = "그래서 뗏목을 만들어 탈출하려고!"
1301403-184 = "마침 여기 주변엔 나무도 많으니까 재료 걱정은 없겠어!"
1301403-185 = "[s] \"잠깐……? 뭘 만든다고?!\""
1301403-186 = "뗏목. 지금부터 만들기 시작하면 내일 중엔 어떻게든 되지 않을까?"
1301403-190 = "자! 우리의 청춘과 생존을 위해 힘내자고, 스승님!"
1301403-191 = "[s] \"오, 오—!\""
1301403-196 = "(……이후 렌게와 밤새 뗏목을 만들어 섬을 탈출했다.)"
