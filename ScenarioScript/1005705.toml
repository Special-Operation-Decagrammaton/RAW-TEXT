[translation]
1005705-1 = "미식의 요소는 요리, 시기, 상대. 그리고……"
1005705-2 = "(약속한 장소에서 하루나를 기다리고 있었다.)"
1005705-6 = "안녕하세요, 선생님."
1005705-7 = "기다리게 해 드려서 죄송합니다."
1005705-8 = "[s] \"나도 온 지 얼마 안 된 참이야.\""
1005705-9 = "그러신가요."
1005705-10 = "쭉 생각해 보았습니다."
1005705-11 = "미식에 정말로 중요한 것은 무엇인가."
1005705-12 = "단지 요리만으로는 어딘가 부족하다……"
1005705-13 = "그것이 제가 몇 번이고 반복해서 내려왔던 결론입니다."
1005705-14 = "그래서 오늘은, 제가 준비할 수 있는 모든 요소를 고려해 보았어요."
1005705-15 = "후후후후."
1005705-16 = "이것으로 분명, 지고의 맛에 도달할 수 있겠지요."
1005705-17 = "[s] \"그럴 수 있다면…… 좋겠네.\""
1005705-18 = "우선, 준비한 것은 이것입니다."
1005705-23 = "네. 3단 찬합에 가득 담은 오세치 요리죠."
1005705-24 = "미식의 요소는 요리와 시기와 그 상대……"
1005705-25 = "준비된 것은 시기에 맞춘 계절 요리, 그리고 선생님."
1005705-26 = "세 가지 요소가 충족되었으니, 분명 지금껏 경험해 본 적 없는 미식이 되겠죠?"
1005705-27 = "[s] \"어…… 잘 모르겠지만, 하루나가 그렇다면 그렇지 않을까?\""
1005705-28 = "후후후."
1005705-29 = "우선 자리에 앉으실까요?"
1005705-30 = "나머지 준비는 제가 하겠습니다."
1005705-37 = "[wa:500]― 미식에 있어서 중요한 것은,"
1005705-39 = "― 요리와 상대… [wa:2000]그리고 시기."
1005705-42 = "― 그것들 만큼이나, [wa:1300]미식을 즐기는 상황도,"
1005705-44 = "― 빼놓을 수 없는 존재죠."
1005705-47 = "[wa:100]― 우후훗. [wa:1800]그런고로,"
1005705-49 = "― 오늘은 [wa:450]서로 먹여 주기를 [wa:700]해 보도록 할까요?"
1005705-52 = "[wa:500]― 우선은 저부터…… [wa:2500]자, 선생님"
1005705-54 = "― 입을 벌리고…… [wa:1800]아~ [wa:1000]해 주세요."
1005705-57 = "[wa:200]― 저, [wa:600]정말, [wa:900]어서요.[wa:300]"
1005705-59 = "― 저도…… [wa:1050]부끄럽습니다만……"
1005705-62 = "― 선생님께서 먹어 주실 때까지,"
1005705-64 = "― 저는 [wa:750]이대로 있을 거랍니다?"
1005705-67 = "[wa:500]― 자요…… [wa:1300]아~"
1005705-70 = "어떠신가요, 맛있으셨나요?"
1005705-71 = "[s1] \"부, 분명히 맛있긴 했는데!\"\n[s2] \"가, 갑작스러워서 맛이 정확히 느껴지지 않았다고 할까!\""
1005705-74 = "후후후. 그러신가요."
1005705-75 = "그렇다면 다시 한번, 아~앙."
1005705-81 = "네, 잘 하셨어요. 잘 드시네요?"
1005705-82 = "그러면 이번에는, 제게 먹여 주시겠어요?"
1005705-83 = "[s] \"내, 내가?!\""
1005705-84 = "네. 그래야 서로 먹여 주기가 될 테니까요."
1005705-88 = "기다리고 있겠습니다, 선생님. 아–"
1005705-90 = "(그렇게 서로에게 오세치를 먹여 주며 찬합을 비워 갔다……)"
1005705-93 = "후후훗."
1005705-94 = "평생 기억에 남을 미식이었어요."
1005705-95 = "감사합니다. 선생님."
1005705-96 = "[s3] \"하루나가 그렇게 말해 준다면야, 내가 영광이지.\"\n[s4] (처음에는 조금 놀랐지만, 뭔가 익숙해졌다고 할까……)"
1005705-99 = "아직 시간이 남았는데, 조금만 더 같이 있어 주시겠어요?"
1005705-100 = "손이…… 조금, 시리네요."
1005705-104 = "괜찮으시죠, 선생님?"
1005705-111 = "(하루나와 함께 손을 잡고 한가로이 거리를 돌아다녔다.)"
