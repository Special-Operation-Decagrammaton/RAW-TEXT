[translation]
102070-1 = "제7화;자치구 방어 작전 - 산해경"
102070-6 = "으, 으아아-! 괴물이다!!"
102070-11 = "각 자치구에 습격이 시작된 것이다!"
102070-12 = "이쪽은 저희 매화원의 교관들이 맡겠습니다! 코코나 쨩은 사람들을 대피소로 유도해 주세요!"
102070-14 = "으, 응! 알았어, 언니."
102070-20 = "하하하! 자아, 가보자고!"
102070-22 = "꽤 떠들썩한 것 같구나."
102070-27 = "앗, 키사키 회장……!?"
102070-31 = "명색이 문주인데 이런 사태에 손 놓고 있을 수는 없겠지."
102070-32 = "보아하니 대비가 허술한 곳이 있더군. 해서, 집행부장을 그곳에 보내놨으니 참고하도록 해라."
102070-33 = "문주님……."
102070-43 = "훗. 이럴 때 필요한 말이라면…… <친구는 가까이 두고, 적은 더 가까이 두어야 한다.>"
102070-44 = "갑자기 뭔 소리예요, 부장? 뜬금없게."
102070-45 = "또 무슨 영화 명대사 같은 거겠지."
102070-46 = "시끄럽다, 이놈들아! <대모>는 마스터피스라고! 평소에 좀 봐두란 말이다!"
102070-47 = "여튼 가자! 문주님의 명이시다!"
