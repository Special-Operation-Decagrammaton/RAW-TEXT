[translation]
1403-1 = "GUNS N' PEPPERS 3"
1403-2 = "밀레니엄 학원 복도"
1403-8 = "……아직까지는 총의 이변을 알아차리지 못한 것 같네요."
1403-9 = "……하지만 방심은 금물. 만에 하나라도 네루 선배가 방아쇠를 당기는 순간 모든 게 들통나고 말 거야."
1403-10 = "그건 걱정 마세요. 네루 선배는 다혈질이기는 하지만, 그만큼 밀레니엄의 모두가 그녀를 자극하지 않기 위해 조심하고 있으니까요!"
1403-11 = "\"대놓고 시비를 걸만큼 어지간히 멍청한 녀석\"이 나타나지 않는 이상, 네루 선배도 섣불리 방아쇠에 손을 대지는 않을 거예요."
1403-13 = "아앗, 찾았다! 네루 선배!"
1403-14 = "뭐야, 게임개발부의 쌍둥이 중 하나잖아. #n내게 무슨 볼일이라도 있는 거냐?"
1403-15 = "그래, 이 망가진 콘솔 게임기 좀 보라고!"
1403-16 = "저번에 네루 선배가 교내에 숨어든 헬멧단을 잡는다고 날뛰었을 때, 날아든 유탄에 맞아 기판이 망가졌단 말이야! 선배가 책임져!"
1403-17 = "……아앙? 장난 하냐? 그게 어째서 나 때문인데?"
1403-18 = "그 때 선배가 총을 난사하지 않았더라면 게임기가 망가질 일도 없었잖아! #n이게 얼마나 비싼 물건인데…… 물어내! 물어내라고!"
1403-19 = "이 자식…… 적당히 하지 않으면……!"
1403-20 = "잠깐—! 여기는 저희에게 맡겨주세요!"
1403-22 = "으응? 엔지니어부가 왜 여기에 있는 거야?"
1403-23 = "잠깐, 모모이. 그 게임기의 상태를 볼 수 있을까……?"
1403-25 = "음, 음. 접속 단자가 부러지면서 생긴 가벼운 고장이네요. 이 정도 고장은 저희 엔지니어부에서 가지고 있는 부품으로도 쉽게 고칠 수 있어요!"
1403-26 = "정말? 그렇다면 다행이지만……."
1403-28 = "흥. 그럼 내게 볼 일은 없는 거지? 나는 먼저 간다."
1403-30 = "자, 잠깐 기다려주세요. 네루 선배!"
1403-31 = "이 게임기는 엔지니어부 부실에 맡겨 두면 나중에 고쳐 줄게. 지금은 바쁜 일이 있어서……."
1403-32 = "히비키, 네루 선배가 다른 트러블에 휘말리기 전에 어서 따라가죠!"
1403-34 = "……트러블? 엔지니어부는 도대체 무얼 하고 있는 거야?"
1403-36 = "하지만 그 이후로도 위기는 계속되었다……."
1403-39 = "부장. 늘 궁금했었는데 부장이 입는 그 조그마한 스카잔은 도대체 어디서 구하는 거야? 아동복 매장?"
1403-40 = "뭐, 말 다했냐! 죽여버린다!"
1403-42 = "잠깐! 네루 선배, 화내지 마세요! 아스나 선배도 나쁜 뜻으로 한 말이 아닐 테니까!"
1403-43 = "……맞아. 그리고 아스나 선배도 심한 말을 한 것에 대해 네루 선배에게 사과해."
1403-44 = "헤에. 이게 그렇게 심한 소리였어?"
1403-45 = "기분을 상하게 했다면 미안해. 그저 나는 그 스카잔이 멋지다고만 생각해서……."
1403-46 = "쳇…… 하여간 너란 녀석은. 이번만큼은 엔지니어부의 얼굴을 봐서 넘어가주지. #n하지만 다음번에도 아동복 운운하면 죽여버릴 줄 알아!"
1403-50 = "네루, 혹시 이 잠긴 문 좀 총으로 부숴줄 수 있어? 깜박 잊고 키를 두고 나와서 말이야."
1403-51 = "그거라면 어렵지 않지. 손잡이에 총구를 가져다 대고—"
1403-53 = "자, 잠깐! 문 따는 일이라면 저희에게 맡겨주세요!"
1403-54 = "엔지니어부의 기술이라면 손잡이를 부수지 않고도 쉽게 문을 열 수 있으니까……."
1403-57 = "우와. 영화에서 보던 것처럼 철사만 가지고 문을 열었네. 정말 대단해!"
1403-58 = "이런 건 저희 전문이니까요! 문이 잠기더라도 절대로, 총을 쓸 필요가 없답니다!"
1403-59 = "……."
1403-67 = "너희들…… 도대체 뭐야?"
1403-68 = "네, 네? 저, 저희는 엔지니어부인데요?"
1403-69 = "그걸 몰라서 물었겠냐!"
1403-70 = "내가 물어본 건, 어째서 계속 나를 따라다니면서 내 일에 사사건건 참견하는 거냐고!"
1403-71 = "고, 곤란한 사람이 있으면 돕는 게 학생의 미덕이니까요! 하, 하하!"
1403-72 = "게다가 폭력은 나빠…… 기술로 폭력을 막을 수 있다면 그게 제일 아닐까……?"
1403-73 = "정론이긴 하지만…… 어쩐지 수상쩍은데."
1403-74 = "너희 혹시, 설마 내 총에 무슨 수작을 부린 건 아니겠지……?"
1403-76 = "여기 있었구나, 미카모 네루!"
1403-79 = "지난 번에 당한 이후로 계속 네 녀석을 찾아다녔다고!"
1403-80 = "아앙? 이 자식들…… 여기가 어디라고 뻔뻔하게 나타나는 거야?"
1403-81 = "후후. 그 때는 갑작스럽게 습격을 받는 바람에 속수무책으로 당하고 말았지만, 이번에는 만반의 준비를 갖추고 돌아왔지!"
1403-82 = "헬멧은 물론이고 모든 보호 장비의 소재를 방탄 재질로 바꾸었지! 네 녀석이 들고 있는 나약한 기관단총의 권총탄으로는 우리를 절대로 쓰러트릴 수 없어!"
1403-83 = "자. 각오해라, C&C의 부장! 이번에야 말로 지난번의 복수를 해주마!"
1403-84 = "하. 제법 기합 넣고 온 모양인데."
1403-85 = "좋아. 상대해주지!"
1403-86 = "자, 잠깐만요. 네루 선배! 그 총은 아직 개조가—!"
1403-87 = "타다다다!"
1403-88 = "크하하! 신상 방탄 헬멧의 위력을 똑똑히 보여주…… 응?"
1403-90 = "끄아아아악!"
1403-91 = "이, 이게 뭐야? 총알에서 매콤하고 시큼한 향기가 나는 게…… 차바스코 소스?"
1403-92 = "으, 으악! 헬멧 틈으로 매콤한 소스가 눈과 코에 들어가서…… #n콜록, 콜록! 숨을 쉴 수가 없어! 살려줘!"
1403-93 = "콜록, 콜록……! 이, 비열한 녀석! 이제는 폭약도 모자라 화학탄까지 사용하다니, 역시 피도 눈물도 없는 C&C의 부장답구나! 콜록!"
1403-94 = "아니…… 나는……."
1403-95 = " 이번에는 후퇴다! 다음 번을 기약하자! 콜록, 콜록!"
1403-99 = "이야, 정말 큰일날 뻔했네요. 방탄복으로 무장한 헬멧단에 의해 네루 선배의 무패신화가 깨질 뻔했으니까요."
1403-100 = "……미리 차바스코 소스 분사 장치를 설치해두길 잘했어. #n경사로세, 경사로세."
1403-101 = "……어이."
1403-102 = "이게 어떻게 된 일인지 설명을 해주실까, 엔지니어부……?"
1403-103 = "어, 그게 그러니까…… 실험을 하다가 우연히 태어난 산물이라고 할까…… #n총에서 차바스코 소스가 발사되면 더 쓸모가 있지 않을까 싶어서……."
1403-104 = "실제로도 쓸모가 있었으니 다행 아닐까……?"
1403-105 = "……유언은 그 정도면 충분하겠군."
1403-106 = "타다다다!"
1403-107 = "으, 으악! 선배! 사람에게 차바스코 소스를 뿌리는 건 그만둬 주세요!"
1403-108 = "콜록! 콜록! 눈에 들어가면 정말로 위험하니까…… #n정말로 위험하니까요!"
1403-109 = "네 녀석들이 자초한 일이잖아!"
1403-110 = "타다다다!"
1403-112 = "GUNS N' PEPPERS"
