[translation]
1006802-1 = "안녕 레이사"
1006802-4 = "영차……."
1006802-5 = "……음?"
1006802-6 = "……어!"
1006802-7 = "어어어어-!! 선생님!! 안녕하세요!!"
1006802-8 = "[s1] \"안녕, 레이사.\"\n[s2] \"이런 곳에서 다 보네.\""
1006802-11 = "그러게요! 우연이네요! 하긴 이 정류장은 노선들이 많이 지나니까요!!"
1006802-12 = "선생님도 어디 가시는 길인가요? 아니면 반대로 누구 기다리시는 길……?"
1006802-13 = "아, 버스 기다리시는 길이시라고요. 하하, 그렇죠. 당연하겠네요! 생각해 보니."
1006802-14 = "음……."
1006802-15 = "하하! 그럼 저는 이만……!"
1006802-19 = "[ns3] \"아, 잠깐. 레이사.\"\n[ns4] 가려던 레이사를 불러 세운다."
1006802-22 = "……??"
1006802-23 = "음? 왜 그러시나요? 뭔가 하실 말씀이라도……."
1006802-24 = "……네? 아, 아침에 보내 드렸던 모모톡이요?"
1006802-25 = "아, 아하하……! 그, 그건 죄송해요. 괜히 신경 쓰시게 만들었나 보네요. 신경 쓰지 않으셔도 됩니다!"
1006802-26 = "진짜로 아무 내용 없었던 것뿐이니까요! 그냥 인사드리려고 그랬던 것이라……."
1006802-27 = "하긴 생각해 보면 선생님도 가뜩이나 바쁘실 텐데, 일을 얹어드린 것인지도 모르겠네요."
1006802-28 = "앞으로는 주의하도록 하겠습니다!"
1006802-29 = "[s5] \"아냐. 정말로 편하게 해도 괜찮아.\"\n[s6] \"더 해도 된다고 말하려고 그런 거야.\""
1006802-32 = "……네?"
1006802-33 = "어라? 어? 음……? 가, 감사합니다……?"
1006802-34 = "그, 그런데 선생님. 굳이 그런 말씀을 해 주시려고……."
1006802-35 = "……네? 오늘 약속이라든가 있냐고요? 아, 아뇨. 딱히 그렇지는……."
1006802-36 = "약속……은 보통 없죠. 특별한 일 없는 이상에야. 하하……."
1006802-37 = "……앗!!"
1006802-38 = "혹시나 해서 미리 말씀드리지만 학급 친구들이랑은 잘 지내고 있으니까요!! 전혀 그런 거 아니니까요! 절대로!!"
1006802-39 = "오히려 연락이나 같이 놀자는 말은 오는데, 제가 제대로 반응을 못 한달까……."
1006802-40 = "고민하다 타이밍이 늦어버린다거나, 어쩌다 보니 너무 격하게 반응해서 곤란하게 만든다거나……. 그런 게 좀 있죠!! 네! 그런 거죠!!"
1006802-41 = "그, 그래서 선생님께 어떻게 하면 그런 실수를 좀 줄일 수 있을까 하고……."
1006802-42 = "[s7] \"응. 그런 일일 거라 생각했어.\"\n[s8] \"연습과 조언 상대가 필요한 거지. 이해해.\""
1006802-45 = "그, 그렇게 말씀하시니 뭔가 더욱 죄송스러워지는걸요……."
1006802-46 = "으음. 하지만 사실이기도 한 것 같아요. 선생님은 좀……. 뭐라고 해야 할까……."
1006802-47 = "그래도 선생님……이시니까? 제가 실수해도 괜찮지 않을까……? 그런 생각에……."
1006802-51 = "뭔가 말하고 나니 더 대놓고 민폐였군요. 정말 죄송합니다……."
1006802-52 = "……괜찮으시다고요? 그렇지만……."
1006802-53 = "[s9] \"이제 다른 사람들에게도 방금처럼 해보는 거야.\"\n[s10] \"오히려 실수하지 않으려는 생각을 좀 줄여보자.\""
1006802-56 = "……??? 그게 무슨 말인가요?"
1006802-57 = "그치만 지금도 실수가 많은데, 실수를 더 하라니……."
1006802-58 = "'하지 않으려는 것에만 집중하다 보면 그런 일도 생긴다'고요? 으음? 무슨 뜻인지 잘……."
1006802-59 = "……으음……. 죄송해요. 역시 잘 모르겠네요."
1006802-60 = "음! 그렇지만 선생님의 말씀이니까요! 몰라도 해봐야겠죠!! 네!!!"
1006802-61 = "솔직히 좀 겁도 나긴 하지만……. 한 번 해보겠습니다!!"
1006802-67 = "앗. 버스……. 그러고 보니 선생님 시간을 많이 뺏어버렸네요."
1006802-68 = "저는 먼저 가 볼 테니! 선생님도 좋은 하루 되세요!!"
1006802-73 = "……진짜 그럼 이만!!"
1006802-77 = "[ns11] \"조심히 들어가.\"\n[ns12] 버스에 올라탄다."
