[translation]
102020-1 = "제2화;작전 회의"
102020-4 = "하아…… 하아……."
102020-5 = "이야, 조금 난폭하게 해버렸을까나……."
102020-7 = "아비도스 학교 자전거 주차장"
102020-8 = "호시노 선배……."
102020-9 = "그치만 힘 조절을 어설프게 했다간 내가 당했을 거라구? 이 아이, 엄청 강했으니까."
102020-10 = "……."
102020-11 = "흐음. 그치만 이상하네. 이 정도의 학생이 자치구에 남아 있었다면 내가 알았을 텐데……"
102020-12 = "이름이 뭐야, 좀도둑 쨩?"
102020-13 = "……시로코. 스나오오카미 시로코."
102020-14 = "흐음, 그렇구만. 그럼 시로코 쨩. 여기서 뭘 하고 있었던 거야?"
102020-15 = "……."
102020-16 = "여기가 폐허처럼 보이는 건 이해하지만 아직은 아비도스 분교…… 아니, 본교거든."
102020-17 = "그 옷은…… 처음 보는 복장인데……."
102020-18 = "그렇지? 게다가 이 날씨에 그것만 입고 있으면 추울 것 같은데 말이지."
102020-20 = "저기, 시로코 쨩은 어디 학생이야?"
102020-21 = "……몰라."
102020-22 = "……?"
102020-23 = "……정신을 차려보니 여기였어. 내 이름 말고는 아무것도 기억나지 않아서……."
102020-24 = "무, 무슨 뜻이야, 그거?! 설마 기억 상실, 뭐 그런 게 요즘 유행하는 거야? 이 아저씨는 그런 거 잘 모르는데?"
102020-25 = "그, 그럼 시로코 쨩은 이름 말고는 아무것도 모르는 건가요? 학원도……? 전화번호도……? 이메일도……?"
102020-26 = "(끄덕)"
102020-28 = "……."
102020-29 = "……."
102020-30 = "호, 호시노 선배. 어떡하죠?"
102020-31 = "흐음……. 골치 아프네."
102020-33 = "일단 들어가서 얘기하자, 시로코 쨩. 여기는 얘기하기 좋은 곳은 아니니까."
102020-34 = "네?! 데, 데려가려고요?"
102020-36 = "자아, 추우니까 일단 이거라도 둘러."
102020-39 = "목도리……?"
102020-40 = "맞아, 없는 것 보단 나으니까."
102020-41 = "어때, 좀 낫지?"
102020-42 = "……응."
102020-44 = "……따뜻해,"
102020-47 = "선배……."
102020-48 = "시로코 쨩을 찾지 않으면 안 돼…… 분명히 무슨 일이 생긴 거야."
102020-49 = "하지만……."
102020-50 = "샬레의 호출은 나는 빠질게. 먼저 가도록 해. 노노미 쨩."
102020-51 = "……시로코 쨩이 어디 있는 줄 알고요! 어떻게 찾으려고 하는 거예요?! 선배 혼자서?!"
102020-52 = "……."
102020-53 = "그때랑은 달라요, 선배! 시로코 쨩은 조난 당한 게 아니에요!"
102020-54 = "아냐…… 다르지 않아…… 뭐가 다르다는……."
102020-56 = "그때는 선배 혼자였지만, 지금은 아니니까요!!"
102020-57 = "……!!"
102020-65 = "찾았다! 뭐야, 여기서 뭐하는 거야, 선배들!!"
102020-66 = "호시노 선배…… 같이 가서 선생님을 만나도록 해요."
102020-67 = "……모두들."
102020-68 = "분명 선생님이 도와주실 거예요……."
102020-70 = "……호시노 선배."
102020-71 = "……."
102020-72 = "……맞아."
102020-73 = "분명히 선생님이 도와주겠지……? 늘 그랬듯이……."
102020-74 = "그러니까, 괜찮을 거야……. 그렇지?"
102020-78 = "……."
102020-79 = "……."
102020-83 = "……네! 분명히."
102020-87 = "……."
102020-88 = "각 자치구에서 학생들이 집결하고 있어요. 곧 여기에 도착할 예정이에요……."
102020-89 = "……."
102020-90 = "……괜찮겠어, 선배? 총학생회가 아니라 여기, 샬레에 있어도……?"
102020-91 = "……현재 생텀 타워가 파괴되었고, 대행인 저는 불신임 상태."
102020-92 = "총학생회는 지금 와해된 것과 마찬가지입니다. 다른 실장들을 소환한다고 해도 저의 지시에 따라 줄 것이란 보장도 없고요……."
102020-93 = "지금은 <샬레>만이 유일한 희망입니다."
102020-94 = "……흐응. 알겠지만 뒷감당이 힘들어질지도 몰라."
102020-96 = "……그렇겠죠."
102020-97 = "그건 이 모든 일들을 해결한 뒤에 고민해 보겠습니다."
102020-98 = "모모카, 아유무. 그때까지 잘 부탁드립니다."
102020-99 = "네, 네! 저, 저야말로……."
102020-100 = "끄응…… 이거 뭔가 잘못 걸린 느낌이네."
102020-101 = "그치만 린 선배가 그렇게까지 말한다면야, 우주 끝까지라도 따라가 줘야겠는걸."
102020-105 = "……."
102020-107 = "어라, 누구?"
102020-109 = "……오니카타 카요코 씨."
102020-110 = "내가 일등인가. 뭐, 상관없지만."
102020-111 = "대행. 말해두겠지만 나는 이런 상황의 전문가는 아냐. 크게 도움이 되진 않을 거야."
102020-112 = "……당신을 부른 건 샬레의 선생님입니다. 총학생회가 아니라."
102020-113 = "……알고 있어. 그러니까 여기 온 거야."
102020-121 = "지금 막 도착했어! 대행, 이건 우리 쪽에서 이 현상을 분석한 리포트야. 양이 얼마 되진 않지만……."
102020-122 = "게헨나 선도부의 선임 행정관 아마우 아코입니다. 샬레의 요청에 응해 지금 도착했습니다."
102020-124 = "유우카 씨. 아코 씨."
102020-125 = "총학생회……? 선생님은 어디 계시죠?"
102020-126 = "선생님은 지금 D.U.를 방어하기 위해 자리를 비우셨습니다. 곧 돌아오실 거예요."
102020-127 = "꽤 바빠지겠군. 선생……."
102020-128 = "카, 카요코 씨까지……?!"
102020-129 = "……그렇게 됐어."
102020-130 = "흐응……."
102020-135 = "흐응. 과연. 이런 조합이군요."
102020-136 = "어라……? 우라와 하나코?"
102020-137 = "후후. 오랜만이에요, 유우카 씨."
102020-138 = "아비도스 고등학교의 대표 오쿠소라 아야네입니다. 선생님의 요청으로 지금 막 샬레에 도착했습니다!"
102020-139 = "아야네 씨……."
102020-140 = "아, 아하하…… 하나코 씨도 계셨군요……. 잘 지내셨어요? 저기 그러니까……."
102020-141 = "네. ……사정은 들었어요. 아야네 씨."
102020-142 = "반드시 행방불명된 시로코 씨를 찾아내도록 해요. 저희가 도울게요!"
102020-143 = "네. 고맙습니다……."
102020-144 = "좌절하고 있어선 아무것도 변하지 않으니까…… 지금은 무엇이든 행동하지 않으면……."
102020-145 = "……그러네요. 제 친구도 같은 말을 자주 했었는데."
102020-146 = "아야네 씨는 강한 분이시군요. 저보다도 훨씬."
102020-147 = "네? 아뇨, 저, 저는……."
102020-148 = "학원을 지키기 위해 오랫동안 싸워오셨잖아요? 당신은 강한 분이에요."
102020-149 = "……."
102020-154 = "아아. 선생은 지금 D.U. 전역에 벌어지고 있는 정체불명의 병력들의 방어 작전을 수행하고 있어."
102020-155 = "슬슬 마무리되어서, 곧 여기로 다시 복귀하신다고 해."
102020-157 = "알겠습니다. 선생님이 오시면 바로 회의실로 이동합니다."
102020-179 = "지금 받으신 것이 저희가 준비한 작전 계획서입니다. 먼저 그것부터 확인을 부탁드립니다."
102020-180 = "언제 이 정도 수준의 자료를……."
102020-181 = "……그러네요. 수고 많으셨어요, 수석행정관님."
102020-182 = "지금은 린으로 괜찮습니다, 하나코 씨. 행정관으로서의 제 권한은 현재 정지된 상태이니까요"
102020-183 = "아, 그랬었죠……."
102020-184 = "대행은 권한 정지, 총학생회는 분열. 거기에다가 저 탑에 의해 생텀 타워는 파괴…… 지금 움직일 수 있는 곳은 샬레뿐인 거네요."
102020-185 = "과연, 이해하기 쉬워서 좋아요."
102020-186 = "총학생회는 생텀 타워에 너무 많이 의지하고 있다니까."
102020-187 = "……노아? 지금 총학생회의 보고서를 보낼 테니까, 확인해줘. 그리고……."
102020-188 = "저희 대책위원회가 확보한 정보와 차이가 있는지 교차 검증을 해볼게요!"
102020-196 = "결론부터 말씀드리자면, 저 탑을 2주 안에 파괴해야 합니다."
102020-197 = "……."
102020-198 = "현재 키보토스에 나타난 6개의 정체불명의 탑. 그것을 지금부터 <거짓된 성소>라고 명명합니다."
102020-199 = "과연. 그러니까 일종의 가짜 생텀 타워인 거네. 그런 거라면 이 붉은 하늘과 폭풍…… 고위 에너지까지 설명이 돼."
102020-201 = "이것을 파괴하는 작전인 거죠? 2주 안에……."
102020-202 = "그렇습니다."
102020-204 = "세이아 쨩…… 아니, 티파티와 시스터후드가 서로 협력해 각자가 은닉한 정보를 교환했고 고서관의 고서들까지 뒤져서 얻어낸 정보를 취합해서 낸 데이터예요."
102020-205 = "참고로 이들이 서로 협력하는 건 예전엔 상상도 못 할 일이었을 텐데……. 샬레의 선생님이 안 계셨다면 지금도 불가능했겠죠♡"
102020-207 = "이것은 예언이 아니라 제가 직접 경험한 것이기에 확답드릴 수 있습니다."
102020-208 = "이 현상은 <색채>라고 불리는 존재가 우리 세계를 침공하고 있는 것입니다."
102020-210 = "네. 색채라는 개념은 저희 시스터후드가 간직하고 있는 고서들에도 기록되어 있어요."
102020-211 = "간단히 말하자면…… 사람을 <광기>에 빠트리는 빛."
102020-213 = "색채……? 광기에 빠트린다고……?"
102020-214 = "유우카 쨩, 저 말이 맞아요."
102020-215 = "노아?"
102020-216 = "지금 엔지니어부가 성소의 샘플 데이터를 분석 중인데, 사람의 정신을 교란시키는 신호가 감지되었어요."
102020-218 = "이 빛에 노출되면 인격과 의식 기능에 변이가 생기는 것 같아. 일종의 정신 공격 같은 걸로 보이지만……."
102020-219 = "하지만 그것만으로는 설명되지 않는 게 너무 많아. 데이터가 더 필요해."
102020-220 = "맞아. 우리들이 가진 장비로는 신뢰도가 10%도 되지 못해. 지금으로선 가설 단계를 넘어서지 못해."
102020-221 = "그래서 베리타스에 데이터를 더 요청해둔 상태야. 하지만 그걸로도 부족해."
102020-222 = "이럴 때야말로 서로 다른 관점의 해석이 필요한 법! 그래서 트리니티 고서관의 책들을 가져왔어요! 어디에 둘까요?"
102020-223 = "아! 번거로운데 이 책들 잘라서 전부 스캔해버릴까요? E-BOOK으로 만들면 가지고 다니기도 편해지고 검색도 용이해지고……!"
102020-224 = "그런 짓을 했다간 트리니티의 도서부 부장에게 살해당할걸……?"
102020-226 = "이쪽도 가설 단계이지만, 저 탑에 담긴 고위급 에너지 말야……"
102020-227 = "이거 그대로 두면 약 300시간 뒤에 임계점에 도달해."
102020-228 = "저걸 이대로 두면 총 네 번의 변이를 거친 뒤 마지막엔 키보토스 전체에 그 에너지가 퍼지게 될 거야."
102020-229 = "카페인이 더 필요해……."
102020-230 = "요괴 MAX 더 주문할까요? 10박스 정도?"
102020-232 = "지금 이 현상은 제가 예전에 선생님께 경고했던 바로 그 예지몽의 광경 그대로입니다."
102020-233 = "……하늘에서 거대한 탑이 도래하고, 하늘은 붉게 변하며……"
102020-234 = "그 불길한 탑은……마치 비명처럼…… 이 세계를 조금씩 깎아나가고, 붕괴시키고…… 불길한 다른 무언가들로 이 세계를 덧씌웁니다."
102020-236 = "종말 예언이라고……?"
102020-237 = "……하긴. 트리니티에도 있을 법하지."
102020-238 = "……."
102020-239 = "약 300시간…… 그러니까 2주 뒤에 색채가 키보토스 전역에 퍼지게 되면……."
102020-241 = "찢어진 세계의 조각들이 폭풍처럼 휘몰아치는 가운데 검은빛이 내려오고……. 파멸이 이어지고 또 이어져……."
102020-242 = "마침내…… 키보토스의 모든 것이 멸망합니다."
102020-244 = "먼지 하나 남기지 않고. 모든 것들이."
102020-246 = "[ns] \"거기에 노출된 사람을 원래대로 되돌리는 방법을 찾아야 해.\""
102020-248 = "……."
102020-253 = "네……. 그렇죠."
102020-254 = "저는 거기에 대해서는 아는 것이 없지만…… 다만 저를 구해주었던 그녀라면 어쩌면……."
102020-255 = "백귀야행의 대 예언자 쿠즈노하. 그녀를 찾아내야만 할지도 모릅니다."
102020-256 = "냐하-? 쿠즈노하라고요?"
102020-257 = "……."
102020-259 = "이야…… 갑자기 여기서 그 이름이 나오다니, 깜짝 놀라버렸달까."
102020-260 = "흐음 흐음……. 뭐, 상황은 이해했어요. 어쩐지 카호 쨩이 총학생회에서 쿠즈노하에 대해 문의가 왔다고 하더니……. 그렇군요. 흐음~ 흐음."
102020-261 = "뭐, 이건 따로 저랑 얘기를 하자고요, 선생님♪"
102020-262 = "조금 복잡한 문제가 있지만, ……중요한 문제로 보이니 어떻게든 해볼 테니까요."
102020-264 = "[ns] \"부탁할게. 니야.\""
102020-265 = "냐하하. 그럼."
102020-269 = "정리하자면, 이 <거짓된 성소>를 이대로 두면 약 2주 뒤에 임계점에 도달."
102020-270 = "그렇게 되면……"
102020-271 = "세계의 파멸…… 엔딩이네요."
102020-273 = "그걸 막기 위해 거짓된 성소를 파괴해야 한다……"
102020-274 = "심플한 목표군요."
102020-275 = "그래. 2주 안에 말이지."
102020-276 = "……현재 존재하는 <거짓된 성소>는 모두 6개."
102020-277 = "아비도스 사막, D.U. 근교의 유원지, 밀레니엄 외곽의 폐쇄지, 트리니티와 게헨나 사이의 접경 지역, 밀레니엄 근교의 신도시, 그리고 D.U. 정중앙."
102020-278 = "그 중 D.U.에 있는 성소의 에너지가 가장 크기 때문에, 먼저 나머지 5개의 성소를  파괴한 뒤에 D.U의 중앙 성소를 처리해야 할 것 같아요……."
102020-279 = "하지만 그렇게 간단한 문제가 아닌 것 같네요."
102020-281 = "히마리 선배……?!"
102020-282 = "후후후. 네, 여기서 밀레니엄의 초천재병약미소녀해커의 등장이에요."
102020-283 = "천재……?"
102020-284 = "병약미소녀……"
102020-286 = "저희는 빅 시스터가 남긴 데이터를 통해 먼저 <거짓된 성소>에 접근해 보았어요. 그런데 거기에……."
102020-287 = "…… <거짓된 성소>를 지키고 있는 적들이 있어요. 그것도 일반적인 전력으로는 상대할 수 없는 강력한 수준의 적들이."
102020-288 = "토키. 데이터 확보는 이제 충분해. 무리하지 말고 후퇴해."
102020-290 = "크윽……!! 하지만……."
102020-298 = "……여기가 재미있는 부분이에요."
102020-299 = "저 생텀 타워를 지키고 있는 존재…… 그건 지금까지 키보토스에 발생했던 기이하고 신비하고 불가해한 모든 현상들이 총망라된 것이에요."
102020-300 = "데카그라마톤의 예언자들, 트리니티에서 나타났던 미메시스 현상, 그리고 얼마 전 밀레니엄의 폐허에서 관측된 <Divi:Sion>까지……."
102020-301 = "네, 그래요."
102020-303 = "아비도스 사막"
102020-305 = "데카그라마톤의 세 번째 예언자, <비나>"
102020-307 = "D.U. 근교의 버려진 유원지"
102020-310 = "슬럼피아에 미메시스된 어뮤즈 돌 <시로&쿠로>"
102020-312 = "트리니티와 게헨나 사이의 접경 지역"
102020-314 = "콤뮤니오 상토룸의 <예로니무스>"
102020-316 = "밀레니엄 외곽의 폐쇄지"
102020-318 = "데카그라마톤의 네 번째 예언자 <헤세드>"
102020-320 = "밀레니엄 근교의 신도시"
102020-324 = "여덟 번째 예언자 <호드>까지……."
102020-326 = "[ns] \"과연…… 이렇게 나온다는 거네.\""
102020-327 = "……선생님은 뭔가 짚이는 게 있으신가 보네요."
102020-328 = "네. 저 성소의 수호자들을 먼저 처치하지 않으면 거짓된 성소는 파괴할 수 없어요."
102020-330 = "뭐. 좋아, 이리저리 복잡한 이야기지만, 결국 <성소의 수호자>들을 쓰러트리면 만사 해결이라는 거잖아?"
102020-331 = "네, 그럼 지금 당장 준비하시죠. 6개의 목표를 동시 공격…… 이건 대규모 연합 작전을 상정해야 해요."
102020-332 = "그래. 시간도 한정적이고."
102020-334 = "아아, 모두들 진정하라구. 의욕은 알겠지만 한 가지만 더 짚고 가야 해."
102020-335 = "당연하겠지만 이 작전을 수행하는 동안, 각 자치구의 시민들과 학생들의 대피…… 그리고 성소가 불러내고 있는 적들로부터 방어하는 것도 필요해."
102020-336 = "게헨나, 백귀야행, 붉은겨울, 산해경, 트리니티, D.U.……각 자치구에서 습격 보고가 이어지고 있으니까. 적은 수호자만이 아니라는 거야."
102020-337 = "그 부분이라면 걱정하지 말아주세요."
102020-339 = "각 자치구를 지키는 것은 저희가 책임지겠습니다. 이것이야말로 저희의 의무."
102020-340 = "그렇죠, 미카 씨, 세이아 씨?"
102020-341 = "아하하, 응, 그런 느낌으로☆"
102020-342 = "있지? 이번엔 얌전히 나기 쨩과 세이아 쨩이 시키는 대로 움직일 테니까. 트리니티 쪽은 걱정하지 마."
102020-343 = "응, 물론 선생님이 여유 될 때 도와주러 온다면 더 좋겠지만……."
102020-344 = "우리끼리라도 어떻게든 할 수 있으니까, 맡겨줘, 선생님."
102020-345 = "네. 이제 더 이상 미래가 보이지 않지만……"
102020-346 = "모두와 함께 힘을 합쳐 싸우고, 행동한다. 그것만이 정답이라는 것을 알고 있어요."
102020-348 = "게헨나 자치구의 방어는 우리가 맡겠어!"
102020-349 = "저희 선도부가 학생들과 시민들의 대피와 방어를 책임지겠습니다."
102020-351 = "저희도 일손을 덜어드리죠."
102020-352 = "응급의학부……!"
102020-353 = "그편이 선도부장이 아무런 걱정 없이 이 작전을 수행할 수 있을 테니까요."
102020-354 = "세나 선배님……."
102020-355 = "네. 감사합니다."
102020-357 = "대신 그 대가로 치나츠가 응급의학부로 돌아오는 겁니다."
102020-358 = "네?! 무, 무슨……."
102020-359 = "농담입니다."
102020-361 = "네, 이해했습니다. 저희도 준비하겠습니다."
102020-362 = "붉은겨울의 동지들은 우리에게 맡겨 달라고!"
102020-364 = "백귀야행 자치구는 저희에게 맡겨주시길."
102020-365 = "응. 맡겨줘. 선생님."
102020-366 = "수행부도 있어-"
102020-368 = "사람들의 대피와 구호는 우리가 맡을게!"
102020-369 = "네! 마침 사장님이 모아둔 자금도 있고, 대여해 둔 건물도 있으니까요! 거길 대피소로 쓰는 거죠?"
102020-370 = "마치 축제 같네요!"
102020-371 = "……아, 이렇게 말하면 실례려나……."
102020-372 = "아니아니, 대규모의 인파를 케어하고 지원하는 거니까 본질은 다르지 않다고 봐!"
102020-374 = "여긴 우리에게 맡겨달라는 것이다!"
102020-375 = "네, 매화원의 아이들과 시민들, 학생들 모두 저희가 책임지고 보호할 테니……."
102020-376 = "네……! 노력할게요!"
102020-378 = "대피 공간이나 음식이 필요하면 우리 현무상회에게 말해줘."
102020-379 = "그리고 현룡문도 가만있진 않을 거고. 뭐, 이런 상황이니 키사키도 손 놓고 있지는 않겠지. 하하핫!"
102020-381 = "D.U.의 대피는 저희에게 맡겨주세요!"
102020-382 = "뭐, 여기는 발키리의 몫인 거겠지."
102020-383 = "그래, 어떻게든 움직일 수 있는 병력을 다 끌어모았으니까……."
102020-385 = "밀레니엄의 대피는 문제없어요."
102020-386 = "빅 시스터는 언제나, 언제 벌어질지 모를 재난을 강박적으로 준비해 왔었거든요."
102020-387 = "요새도시같은 그런 그녀의 강박증이 독이 될 때도 있겠지만…… 지금은 쓸모가 있겠네요."
102020-388 = "그녀가 밀레니엄 곳곳에 숨겨둔 쉘터를 확보해두겠어요."
102020-390 = "……그럼 대충 정리됐군요."
102020-391 = "우리들의 목표는, 키보토스에 도래한 6개의 거짓된 성소를 파괴한다."
102020-392 = "그리고 동시에 각 자치구의 대피와 방어 작전을 수행한다."
102020-393 = "이 모든 작전은 <샬레>의 [USERNAME] 선생님을 중심으로 진행합니다."
102020-394 = "모든 자치구의 방어와 대피 작전, 그리고 성소의 공략까지 선생님이 확인해 주셔야 합니다. 괜찮으실까요?"
102020-395 = "[s] \"응. 문제없어.\""
102020-396 = "이야, 엄청 바쁘겠구만. 선생."
102020-397 = "그, 그럼 모두들 시계를 키보토스 표준시로 맞춰 주시겠어요?"
102020-399 = "성소의 최종 임계까지 남은 시간은 14일 23시간 59분 59초……."
102020-401 = "저게 우리에게 남은 시간인 거네."
102020-402 = "네. 자, 잘 부탁드립니다……. 저 시간 안에 작전 수립과 준비, 공략까지 전부 끝내야 해요……."
102020-403 = "좋습니다. 그럼……."
102020-405 = "지금부터 작전 준비를 시작하겠습니다."
102020-408 = "아아 선생님. 잠깐 시간 괜찮나요?"
102020-409 = "……. 선생님이 부탁한 것에 대해서 말씀드리겠습니다."
102020-410 = "[s] \"니야, 카호.\""
102020-411 = "트리니티의 세이아 님도 부디 불러주시길……."
102020-413 = "네. 쿠즈노하의 행방은…… 뭔가 실마리라도 찾으셨나요?"
102020-414 = "냐하하~ 뭐랄까, 모두가 있는 앞에서 이야기하긴 조금 난감한 주제라서 말이죠……."
102020-415 = "정말이지…… 쿠즈노하의 행방을 찾으라니, 정말 이제 와서 딱히 놀랍지도 않지만."
102020-417 = "……결론부터 말하자면, 쿠즈노하라는 이름을 가진 학생은 저희 백귀야행에 존재한 적이 없습니다."
102020-418 = "[s] \"존재한 적이 없어……?\""
102020-420 = "역시……. 그럴 것 같았지만……."
102020-421 = "그러니까~ 학생 리스트에 등재된 적이 없다는 얘기랍니다."
102020-422 = "하지만 대 예언자 쿠즈노하라는 존재는 그게…… 있다고 해야 할지…… 있었다고 해야 할지……."
102020-423 = "……무슨 뜻이죠?"
102020-424 = "뭐랄까…… 쿠즈노하는 백귀야행의 몇몇 학생만이 만났다고 주장하거나…… 이런 말이나 저런 말을 들었다고 주장할 뿐인, 소문으로만 확인된 존재거든요~"
102020-425 = "……!"
102020-426 = "뭐, 다 같이 꿈이라도 꾸는 건가, 했지만…… 설마 백귀야행이 아닌 학생이 그 이름을 말하다니 깜짝 놀랐지 뭐예요. 냐하하핫."
102020-430 = "……딱 한군데, 쿠즈노하를 언급한 기록이 있긴 합니다."
102020-431 = "옛날 설화나 전설 따위를 수집해 둔 오래된 기담집에 짧게 언급만 된 거라, 신뢰하기는 힘들지만……."
102020-432 = "괜찮습니다, 어떤 내용이죠?"
102020-433 = "……과거, 아직 저희 백귀야행 연합학원이 연합이 아니었던 시절. 천 갈래 만 갈래로 찢어져서 서로 싸우고 있었던 혼란의 시기."
102020-434 = "그때 대 예언자 쿠즈노하가 <백화요란>을 조직하여, 백귀야행의 분쟁 조정을 맡겼다는 이야기입니다."
102020-435 = "백화요란……?"
102020-436 = "아아…… 연합의 갈등을 해결하기 위해 만들어진 조직 말이군요. <백화요란 분쟁조정위원회>. 일종의 조정자들."
102020-437 = "냐하~ 역시 트리니티의 아가씨랄까. 잘 알고 있네요?"
102020-438 = "네, 맞아요. 백화요란은 그런 집단. 조정자랄까, 균형자랄까……. 역사는 잘 모르겠지만."
102020-439 = "그러고 보면 쿠즈노하를 만났다고 주장하는 학생들은…… 전통적으로 <백화요란> 부장들뿐이었습니다."
102020-440 = "지금도 백화요란의 부장은 쿠즈노하와 대면할 권리를 가지고 있고, 그녀로부터 지시를 받고 있다거나 하는 등의 믿기 어려운 소문이 있긴 합니다만……."
102020-441 = "바로 그 백화요란만이 쿠즈노하의 존재를 믿고 있는 거죠."
102020-442 = "아니, 걔들만이 쿠즈노하를 만날 수 있는 것일지도……?"
102020-443 = "어느 쪽이든 수상쩍어 보이긴 하지만."
102020-444 = "……저는 그게 그저 백화요란의 특이한 전통 같은 거라고 생각했습니다."
102020-445 = "보이지 않는 비밀 친구처럼?"
102020-446 = "……뭐, 우리가 진실을 알 수는 없겠지. 카호. 딱히 문제가 되는 것도 아니라서……."
102020-450 = "……그럼 백화요란 부장을 만나볼 수밖엔 없겠네요."
102020-451 = "응…… 그것도 좀 곤란하지 않으려나 싶은 게……. 그간 여러 사정이 있어서……."
102020-452 = "<백화요란>은 곧 폐부 될 예정입니다."
102020-453 = "……!!"
102020-454 = "응? 아니 아니, 아직 공식적으로는 폐부까진 아니잖아?"
102020-455 = "실질적으론 맞죠. 부장과 부부장이 소식을 끊고 잠적해버리지 않았습니까."
102020-456 = "부활동은 정지된 지 오래고, 남은 부원들도 의욕을 잃고 탈퇴한다느니 그런 소문이 돌고 있으니."
102020-457 = "그 둘에게 무슨 일이 생긴 건지 저희도 자세히 알고 싶지만…… 다른 부원들도 부장과 부부장의 행방을 모르는 것 같고……."
102020-458 = "백화요란은 자세한 내막을 파악하기 힘든 비밀스러운 집단이라……. 죄송합니다."
102020-459 = "흐음~ 백화요란의 상태가 알려지면 우리 망량즈들이 어떤 난리를 피울지 몰라서 비밀로 해두고 있는데 말이지~"
102020-460 = "아직 자치구의 학생들은 모르고 있지만……. 그것도 곧 시간문제입니다. 니야 님."
102020-461 = "뭐, 그렇겠지……."
102020-462 = "그렇다면 쿠즈노하를 찾는 방법은 현재는 존재하지 않는 것이군요……."
102020-463 = "네. 유감스럽게도……."
102020-464 = "……뭐, 방법이 아주 없는 건 아닐지도."
102020-465 = "니야 님……?"
102020-466 = "키보토스에 나타난 <색채>라는 무서운 현상……. 샬레의 선생님은 지금 거기에 당한 학생들을 원래대로 되돌릴 수 있는 방법을 찾고 싶은 거잖아."
102020-467 = "중요한 일이니까. 그러니 어떻게든 도와야지."
102020-468 = "그건 그렇습니다만…… 어떻게……?"
102020-469 = "엣~헴 그건 말이지……."
102020-470 = "내게 좋은 아이디어가 있거든~♪ 그러니 조금만 기다려주시길. 냐핫."
102020-472 = "다음화;작전 준비 1"
