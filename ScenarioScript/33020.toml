[translation]
33020-1 = "제2화;포스트모템 2"
33020-2 = "……세이아는 그렇게 말했어."
33020-3 = "에덴조약으로 게헨나와 트리니티의 분쟁이 사라진다면, 아마 그다음엔 아리우스의 문제를 해결할 수 있을지도 모른다고."
33020-4 = "트리니티가 고질적으로 가지고 있는 이 문제를 해결할 수 있는 방법은, 지금은 이 에덴조약 밖에 없다고."
33020-5 = "……하지만 아리우스는 티파티의 헤일로를 파괴하려고 하고 있어. 그렇게 된다면 키보토스는 진짜 전쟁터가 되겠지."
33020-6 = "그것을 막고 싶은거냐고 물었어……."
33020-8 = "……그렇군요."
33020-9 = "하지만 분명하게 말씀드릴 수 있는 건, 저는 당신의 생각에 동의하지 않는다는 것입니다. 시라스 아즈사."
33020-10 = "저는 5번째 화두…… 즉, 낙원의 증명 같은 건 불가능하다는 것을 누구보다 잘 알고 있거든요."
33020-11 = "하지만……."
33020-12 = "그 끝이 결국 파국으로 이어지더라도, 그럼에도 불구하고, 발버둥을 치겠다면……."
33020-13 = "그렇다면, 당신에게 지혜를 빌려드리겠습니다."
33020-14 = "하지만 그게 어떤 결과로 이어질지는……"
33020-16 = "그래서 세이아 님의 방을 폭파시킨 건가요?"
33020-17 = "세이아가 죽은 걸로 위장하려면 반드시 필요했어. 아리우스 스쿼드도 속을 정도여야만 했으니까."
33020-18 = "세이아는 모든 사건을 은폐할 조력자로 구호기사단장을 지명했어. 나머지는 그 사람에게 맡기면 된다고."
33020-19 = "그렇게 난 방을 폭파시키고 도망쳤어. 스쿼드는 그 이후 트리니티에서 벌어진 소동과 첩보를 통해 내가 성공했다고 믿었지."
33020-20 = "그게 진상의 전부야……."
33020-21 = "……."
33020-22 = "그 이후로는 나도 세이아의 소식을 알지 못했어, 설마 아직 의식을 되찾지 못했을 줄은……."
33020-23 = "아니에요, 아즈사 쨩. 세이아 쨩의 상처는 다 나았어요. 세이아 쨩이 의식을 못 찾는 건 뭔가 다른 이유인 거 같아요……."
33020-24 = "그럼 습격 명령을 내린 사람이 미카 님인지는 전혀 몰랐다는 건가요?"
33020-25 = "나는……."
33020-26 = "미카 씨는 철저하게 자신의 정체를 속이고 있었어요. 아즈사 쨩 같은 말단이 알 수 있는 방법은 없었을 거예요."
33020-27 = "아, 아우우…… 아즈사 쨩은 살인자가 아니에요……! 그 뒤에도 아즈사 쨩은 나기사 님을 구하려고 엄청 애썼고 또……."
33020-28 = "아니, 저는 그저 일을 하고 있는 거라……."
33020-29 = "……괜찮아, 하나코, 히후미."
33020-35 = "명령을 내린 것은 아리우스 스쿼드의 리더 조마에 사오리였어. 스쿼드는 사오리가 지휘하니까."
33020-37 = "……. 네."
33020-38 = "실제로 시라스 아즈사는 트리니티에 전학 와서 나기사 씨를 지켜내었죠. 그 행동에 의혹은 없습니다."
33020-39 = "그 이후의 평가시험에서도 합격했고요. 나기사 씨가 억지를 부렸지만 보충수업부는 명명백백하게 결과를 이루어 냈습니다."
33020-40 = "더 트집 잡을 것은 없겠죠. 네……. 그녀의 신원은 저, 우타즈미 사쿠라코도 보증하겠습니다."
33020-41 = "시스터후드의 보증에 그 누구도 이의를 제기하지는 못할 겁니다."
33020-42 = "……네! 고마워요, 사쿠라코 씨."
33020-47 = "[ns] \"신세를 졌어.\""
33020-48 = "……이제 시라스 아즈사는 진짜 트리니티의 학생입니다."
33020-49 = "아직 마무리되지 못한 일들도 많고, 특히 아리우스 분교는 아직 해결되지 못한 채로 남아있지만……."
33020-50 = "이 정도라면 급한 불은 모두 끈 것 같군요."
33020-51 = "그럼 모두 수고 많으셨습니다. 하나코 씨, [USERNAME] 선생님."
33020-52 = "후후후. 네♡"
33020-53 = "그럼. 저는 다른 일이 있어서 먼저 일어나겠습니다. 마리. 가시죠."
33020-54 = "네."
33020-55 = "저기…… 하나코 씨, 선생님…… 상황이 정리되면 좀 더 이야기를……."
33020-57 = "후후, 그래요. 마리 쨩."
33020-60 = "하아. ……아즈사 쨩 일도 이걸로 마무리되었고."
33020-61 = "[s] \"수고했어, 하나코.\""
33020-62 = "네. 수고하셨어요, 선생님. 그치만 아직 남아 있는 일들이 잔뜩이라……."
33020-63 = "나기사 씨의 일도, 미카 씨의 일도, 다른 일들도 아직 끝나지 않아서……."
33020-64 = "……아, 맞아요. 얼마 전에 나기사 씨가 히후미 쨩을 만났다고 하더라고요."
33020-65 = "[s] \"나기사가?\""
33020-66 = "네. 저도 히후미 쨩에게 들었는데, 아무래도 이런저런 신경이 쓰이는 게 있었는지……."
33020-68 = "히후미 씨."
33020-69 = "나기사 님……. 어, 어쩐지 살이 좀 빠지신 것 같은데요?! 아, 아우우, 괜찮으신가요?"
33020-70 = "히후미 씨…… 정식으로 사과드릴게요."
33020-74 = "저는 히후미 씨를 의심했어요."
33020-75 = "네? 아, 아우우……"
33020-76 = "그것 때문에 히후미 씨가 받은 상처를 생각한다면…… 이 자리에서 저에게 홍차를 끼얹더라도 저는 아무 말도 할 수 없겠죠."
33020-77 = "히후미 씨가 수영복을 입은 범죄 집단의 리더라니…… 생각해보면 말도 안되는 이야기인데, 전 어째서 그런 허튼 소리에……."
33020-78 = "…………………."
33020-79 = "저를 용서하지 않아도 괜찮습니다. 또 제가 이걸로 용서받았다고 생각하지도 않을 거예요. 그러니……."
33020-80 = "아, 아니에요. 나기사 님."
33020-81 = "저, 저는…… 괜찮달까…… 무, 물론 힘들 때도 있긴 했지만…… 오해는 어찌저찌 잘 풀렸고……"
33020-82 = "나기사 님을 미워한다거나 그런 생각을 해본 적 없으니까……. 그러니 더 사과하지 않으셔도 괘, 괜찮달까……."
33020-83 = "……."
33020-84 = "……그렇군요. 저였다면 상대를 절대 용서 못했을 것 같은데…… 어째서 히후미 씨는 그렇게도……."
33020-85 = "네? 아, 아하하……."
33020-89 = "(아하하…….)"
33020-91 = "아하하…… 즐거웠어요, 나기사 님과 함께 한 우정 놀이."
33020-92 = "콜록, 콜록콜록!!"
33020-93 = "나기사 님……?"
33020-95 = "콜록. 콜록, 콜록콜록. 아, 아무것도 아니…… 갑자기 사레가…… 콜록콜록."
33020-96 = "아, 아우우……?"
33020-101 = "[ns] \"……….\""
33020-102 = "으응. 아직도 그 발언을 신경 쓸 줄은…… 장난이 조금 심했으려나……."
33020-106 = "……나기사 씨는 그 후에도, 다른 사람들을 만나고 다니면서 제대로 사과한 것 같더라고요."
33020-115 = "물론 저에게도…… 저도 이런저런 심한 짓을 해버려서 미안하다고 함께 사과했고……."
33020-116 = "……."
33020-117 = "그녀는…… 이제는 의심암귀에서 벗어날 수 있게 되었지만……. 그 대신……. 더 많은 것을 잃은 거겠죠."
33020-118 = "[s] \"……나기사가 걱정돼.\""
33020-119 = "네……. 저도 그러네요……."
33020-120 = "[s] \"그리고 미카도.\""
33020-121 = "……. 그런가요. 미카 씨까지……."
33020-125 = "선생님은…… 미카 씨의 동기가 이해가 되시나요?"
33020-127 = "응? 왜 이런 짓을 했냐고? 선생님? 그렇게 묻는 거야?"
33020-128 = "응, 그야, 게헨나가 싫으니까."
33020-129 = "나는 게헨나가 진짜, 너무너무 싫거든."
33020-131 = "나기사 씨와 미카 씨는 매우 친한 친구……라고 말할 수는 없을지도 몰라도, 그래도 오랫동안 함께 지내온 소꿉친구 사이예요."
33020-132 = "생각이 많고 과할 정도로 신중한 나기사 씨와, 자유분방하고 활동적인 미카 씨……."
33020-133 = "성격도 상극이고 서로 간의 사이가 결코 좋았다고는 볼 수는 없었지만……"
33020-134 = "그래도 게헨나가 싫다는 이유로 그런 사건을 벌인 게 이해되지 않아서……."
33020-135 = "……시스터후드의 도움을 받아서 미카 씨를 만나려고 했었어요."
33020-137 = "그런데, 먼저 온 손님이 있더군요."
33020-139 = "트리니티 유폐실"
33020-140 = "와아~! 나기 쨩이다~! 어서 와!"
33020-141 = "네. 미카 씨. 좀 어떠신가요? 불편한 부분은 없고요?"
33020-142 = "뭐, 엄~청 불편하긴 하지만 괜찮아. 지하 감옥보단 낫지. 이거 봐, TV도 있고, 의외로 있을건 다 있으니까."
33020-143 = "내가 유폐실에서 지내게 될 줄은 예상하지 못했지만 말야. 아니, 조금은 예상했지만 그게 지금일 줄은 몰랐거든?"
33020-144 = "그러게요. 저도 그건 전혀 예상하지 못했네요."
33020-145 = "아하하! 예측할 수 없다는 게 또 인생의 묘미 아닐까? 응, 그런 느낌으로!"
33020-146 = "……."
33020-147 = "……."
33020-148 = "……진짜 와줄 줄은 몰랐는데. 나기 쨩."
33020-149 = "……."
33020-154 = "다음화;포스트모템 3"
