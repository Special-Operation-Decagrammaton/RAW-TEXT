[translation]
1015006-1 = "#title;말하고 싶은 범고래"
1015006-2 = "#na;(오디세이아의 선단이 D.U.에 돌아온 지 얼마 지나지 않았던 때.)"
1015006-3 = "#na;(선단이 정박한 항구 인근의 상가에서 우연히 코토네를 보게 되었다.)"
1015006-4 = "3;코토네;00\n#3;a"
1015006-5 = "3;코토네;99;으음……\n#3;stiff"
1015006-6 = "#st;[0,0];instant;1;"
1015006-8 = "1;???;00\n#1;hide"
1015006-9 = "#na;(코토네는 상가 앞에 설치된 우체통을 마주본 채 무언가를 골똘히 고민하고 있었다.)"
1015006-10 = "#na;(평소보다 심각해 보이는 표정이, 무언가 도움을 필요로 하는 것 같아 말을 걸어보기로 했다.)"
1015006-11 = "3;코토네;99\n#3;h"
1015006-12 = "[ns] \"코토네?\""
1015006-13 = "3;코토네;02;어라, 선생님?\n#3;em;[반응]"
1015006-14 = "3;코토네;03;여기 상가에서 마주치는 건 처음인 것 같네."
1015006-15 = "3;코토네;01;늦은 점심 식사라도 하러 온 거야?"
1015006-16 = "[s] \"응. 이 근처에 볼 일이 있어서 겸사겸사.\""
1015006-17 = "#st;[0,0];instant;1;"
1015006-20 = "[ns1] \"그나저나 우체통에 무슨 문제라도 있는 거야?\"\n[ns2] \"……혹시 실수로 물건을 떨어트렸다던가?\""
1015006-23 = "3;코토네;02;아, 그건 아닌데……"
1015006-24 = "3;코토네;04;편지를 부칠까 말까 고민중이었거든.\n#3;em;[한숨]"
1015006-25 = "3;코토네;10;편지는 이미 다 썼는데, 막상 보내려니 조금 주저하게 되어서."
1015006-26 = "[s3] \"왜? 뭔가 껄끄러운 내용이라도?\"\n[s4] \"누구에게 보낼 편지인데?\""
1015006-29 = "3;코토네;02;그게…… 펜팔 친구에게 보낼 편지거든.\n#3;m4"
1015006-30 = "3;코토네;00;항해 중에 무선 통신을 하다가 우연히 알게 되었는데……"
1015006-31 = "3;코토네;01;뭔가 생각보다 취향이 잘 맞아서, 계속 무선으로 이야기를 나누게 되었어."
1015006-32 = "3;코토네;03;좋아하는 풍경이라든지, 게임이라든지, 음식이라든지."
1015006-33 = "3;코토네;02;선생님도 알겠지만, 원양 항해 중에는 전파가 터지지 않을 때가 많거든.\n#3;em;[속상함]"
1015006-34 = "3;코토네;01;그래서 육지의 소식을 들으려면 단파 통신을 하는 수 밖에 없는데, 어느날 우연히 채널을 돌리다가 단파 방송을 하는 학생이 있어서 서로 알게 되었어."
1015006-35 = "3;코토네;02;우연한 만남이긴 했지만, 즐겁게 이야기를 나누었고. 그 이후로도 매일 같은 시간에 채널에 들어가면 대화를 할 수 있다보니, 개인적인 이야기까지 털어놓게 되어서……"
1015006-36 = "3;코토네;04;조금, 친해졌다고 생각했던 것 같아.\n#3;stiff"
1015006-37 = "[s] \"생각했다고?\""
1015006-38 = "3;코토네;10;응. 어쩌면 착각이었을지도 모르겠다는 생각이 들어서.\n#3;m3"
1015006-39 = "3;코토네;99;그게, 얼마 전부터 그 친구로부터 갑자기 연락이 끊겨 버렸거든.\n#3;em;[한숨]"
1015006-40 = "3;코토네;02;사실 항구에 도착하기 직전에, D.U.에 도착하면 직접 한 번 만나자고 연락을 보냈었는데…… 그 메시지를 끝으로 갑자기 연락이 끊겨버렸어."
1015006-41 = "3;코토네;04;역시 통신으로 알게 된 사람이니, 직접 만나는 건 부담스럽게 느껴졌던 걸까."
1015006-42 = "[s] \"그건 꽤 상심할만한 일이었겠네.\""
1015006-43 = "#st;[0,0];instant;1;"
1015006-46 = "[ns] \"하지만 갑자기 무슨 일이 생겼을 수도 있잖아?\""
1015006-47 = "3;코토네;00;응. 나도 그렇게 생각했거든."
1015006-48 = "3;코토네;02;그래서 무슨 일이 있는 건지 전에 받은 주소로 편지를 부쳐 물어보려고 했는데……\n#3;em;[…]"
1015006-49 = "3;코토네;04;갑자기 머리가 복잡해져서.\n#3;m2"
1015006-50 = "3;코토네;06;상대가 나를 피하려 하는 것일지도 모르는데, 이렇게 계속 말을 걸어도 괜찮은 걸까."
1015006-51 = "3;코토네;01;그보다 얼굴도 모르는 상대 때문에 이렇게 마음을 쓰는 게 맞나— 싶기도 하고."
1015006-52 = "3;코토네;02;나는 눈이 나빠서 사람의 얼굴을 잘 기억하지 못하거든."
1015006-53 = "3;코토네;10;그러다 보니 매일 마주치는 오디세이아 학생들 중에서도 기억하지 못하는 사람이 허다한데, 얼굴 모를 무선 너머의 친구에게는 안부를 전하고 싶어지다니.\n#3;em;[속상함]"
1015006-54 = "3;코토네;04;역시…… 선생님이 보기에도 좀 이상하지?"
1015006-55 = "[s] \"글쎄. 전혀 이상하지 않다고 생각해.\""
1015006-56 = "#st;[0,0];instant;1;"
1015006-59 = "[ns5] \"마음을 전하는 방법은 다양하니까.“\n[ns6] \"사람에 따라서는 얼굴을 모르더라도 깊게 사귈 수 있지.\""
1015006-62 = "3;코토네;02;……그런걸까."
1015006-63 = "[s7] \"게다가 고단한 항해를 위로해 준 소중한 인연이잖아?\"\n[s8] \"그 인연을 놓치고 싶지 않은 건 당연한 거야.\""
1015006-66 = "3;코토네;00;……….\n#3;em;[…]"
1015006-67 = "3;코토네;03;좋아. 결정했어.\n#3;m3"
1015006-71 = "3;코토네;03\n#3;a"
1015006-72 = "3;코토네;99;부디, 이 편지가 무사히 닿을 수 있기를."
1015006-73 = "3;코토네;00;후…… 결심하니 생각보다 간단하네.\n#3;em;[한숨]"
1015006-74 = "3;코토네;03;고마워, 선생님.#n선생님이 아니었더라면 계속 고민하다가 결국 포기했을 거야."
1015006-75 = "[s] \"천만에.\""
1015006-76 = "#st;[0,0];instant;1;"
1015006-79 = "[ns9] \"그나저나 요즘 시대에 펜팔이나 종이 편지라니—\"\n[ns10] \"뭔가 낭만적이라서 좋은 걸.\""
1015006-82 = "3;코토네;02;그래?\n#3;em;[?]"
1015006-83 = "3;코토네;03;그럼 다음 번에는 선생님께 직접 편지를 써 줄게."
1015006-84 = "[s] \"내게 전하고 싶은 말이 있으면 모모톡으로 해도 돼.\""
1015006-85 = "3;코토네;03;물론 선생님은 언제나 모모톡으로 물어보면 바로 바로 답해주지만……"
1015006-86 = "3;코토네;02;선생님이 방금 말했잖아?"
1015006-87 = "3;코토네;01;마음을 전하는 방법은 다양하다고."
1015006-88 = "3;코토네;09;혹시 또 알아? #n어쩌면 말이나 모모톡으로는 전할 수 없는 감정이 전달될지도. 후후.\n#3;closeup\n#3;em;[하트]"
