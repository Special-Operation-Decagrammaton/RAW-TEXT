212210-156 = "ฉันจบแล้วที่นี่ ล้มเหลวอย่างสิ้นเชิงแล้วค่ะ"
212210-157 = "อย่าใช้คำหรูหราอย่าง 'ต่อไป' กับฉันเลยค่ะ ฉันเป็นคนที่สมควรชดใช้ความผิดอยู่ในกำแพงเย็นเยียบนี้ แล้วก็ถูกลืมไปค่ะ"
