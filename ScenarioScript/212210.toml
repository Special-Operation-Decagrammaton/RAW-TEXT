212210-135 = "ถ้างั้นมันคืออะไรกันแน่คะ? ฉันเป็นอาชญากรที่พยายามโค่นล้มเกเฮนน่า และเป็นคนที่ล้มเหลวนะคะ"
212210-136 = "แล้วทำไมถึงเอาของแบบนี้... ไม่สิ ทำไมกัน"
