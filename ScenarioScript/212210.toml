212210-97 = "อื้ม..."
212210-98 = "ถ้าเป็นอย่างนั้นละก็ ฉันก็จะไม่แพ้ให้อะไรทั้งนั้นเลยละ"
212210-100 = "(เรื่องของเกเฮนน่าคลี่คลายลงได้ในระดับหนึ่งแล้ว แต่ว่า...)"
