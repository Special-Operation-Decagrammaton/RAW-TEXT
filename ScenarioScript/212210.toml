[translation]
212210-1 = "第21話;消えることのない"
212210-5 = "[ns] \"ヒナ、いる？\""
212210-10 = "先生。来てくれたんだ。"
212210-11 = "[s] \"大丈夫？ちょっと根を詰めすぎじゃない？\""
212210-12 = "これくらいなら問題ないわ。#nそもそも、泣き言を言っていられる暇も無いもの。"
212210-13 = "[s1] \"私も人のことは言えないんだよね……。\"\n[s2] \"ゲヘナにかかりきりだったから……。\""
212210-16 = "あ……。"
212210-20 = "[ns] \"あっ、ごめん！そんなつもりじゃなくて……。\""
212210-23 = "先生は相変わらずだね。"
212210-24 = "……。"
212210-25 = "先生……。"
212210-26 = "私、また間違えた。"
212210-27 = "本当……馬鹿みたい。"
212210-28 = "何よりも嫌いで、捨て去りたい過去だったのに。"
212210-29 = "ねっとりした……底で淀んだ真っ黒い感情が、今も生々しく残ってる。"
212210-33 = "私が何を嫌っているか……先生は分かる？"
212210-34 = "……あの時。"
212210-35 = "気分がよかったの。"
212210-37 = "拳を握って、それを振り下ろす準備をしていたことが。"
212210-38 = "暴力を正当化するために大義名分をこじつける過程が。"
212210-39 = "少しだけ……心地よかった。"
212210-41 = "……。"
212210-42 = "それが……一番気持ち悪い。私がそういう人間だったってことが。"
212210-43 = "線を守る、なんて言ってたのにね。"
212210-44 = "何を馬鹿なこと言ってるんだろう。はは。"
212210-45 = "心の奥では、ああいう行いに快感を覚えてる私がいるのに。"
212210-46 = "そんな私が風紀委員長……？"
212210-47 = "笑えない冗談。"
212210-48 = "私は救いようがない。"
212210-49 = "弱くて、悪くて、愚かで……どうしようもない。"
212210-50 = "[s] \"それでも、ヒナは線を守ってきたよね。\""
212210-54 = "[ns] \"私が保証するよ。\""
212210-55 = "先生……。"
212210-59 = "[ns3] \"それに、私だって同じだよ。\"\n[ns4] \"自分の弱さに負けそうになる。たまにね。\""
212210-63 = "先生も……？"
212210-64 = "[s5] \"人は、いろんな側面を持つ生き物なんだ。\"\n[s6] \"でも、なりたい自分があるからさ。\"\n[s7] \"そうなれるように努力するんだよ。\""
212210-68 = "先生も……そんなことで悩むの……？"
212210-69 = "私がこんなことを考えるのも、当たり前のことなの……？"
212210-70 = "そうじゃない人でいることより、そうなろうとすること自体が素敵だって……。"
212210-71 = "[s] \"それに私は、ヒナがそういう人だからこそ、むしろ好きなんだ。\""
212210-72 = "すっ……！？"
212210-73 = "な、何を言っているの……！！"
212210-77 = "自分の未熟さを分かっていて、それでも前に進もうとする人だから……？"
212210-78 = "…………。"
212210-82 = "そうね。"
212210-83 = "私は……とても未熟で、情けない。"
212210-84 = "でも……。"
212210-85 = "それでも、進み続ける。"
212210-86 = "過去には負けない。自分にも負けない。ずっと……進んでいくよ。"
212210-90 = "だから、先生……。"
212210-95 = "これからも、私のそばにいて。"
212210-96 = "[s] \"もちろん。\""
212210-97 = "……うん。"
212210-98 = "それなら、私は何にも負けない。"
212210-100 = "（やっと一段落ついたけど……）"
212210-101 = "（まだ、残ってることがある）"
212210-104 = "……。"
212210-105 = "[ns] \"ショウコ。\""
212210-107 = "……先生ですか。前とは立場が逆転しましたね。"
212210-108 = "こちら側というのは、なかなか新鮮な体験です。"
212210-109 = "……おめでとうございます。#n貴方の勝ちですよ。"
212210-110 = "[s] \"そういう話をしにきたんじゃないんだ。\""
212210-114 = "ええ、分かっています。貴方はいつだってそうでしたから。"
212210-115 = "ですが……これが正解だと、本気で思っているんですか？#nまた昔みたいなゲヘナに戻ることが。"
212210-116 = "そこかしこで銃を乱射し、爆弾を投げつけて。#n皆が好き勝手に振る舞う混沌としたゲヘナが、本当に正しいと？"
212210-117 = "[s8] \"それでも、線を守ろうとする人がいるから。\"\n[s9] \"私も、外から見守ってるし。\""
212210-120 = "……理解できません。"
212210-121 = "謝罪や反省を期待しているのなら、望みには沿えませんよ。"
212210-122 = "失敗に終わろうとも、私の信念が間違っていたとは思っていませんから。"
212210-127 = "[ns] \"実はね、差し入れを持ってきたんだ。\""
212210-129 = "これは……お菓子……？#nそれも、私の好きな……。"
212210-133 = "もしかして……馬鹿にされてますか？"
212210-134 = "[s] \"まさか。そんなつもりはないよ。\""
212210-135 = "それなら、何のつもりですか？"
212210-136 = "私はゲヘナの転覆を企てて失敗した、敗北者です。#nどうしてこんなものを……。"
212210-137 = "[s10] \"生徒がちゃんと食べてるか気にかけるのは――\"\n[s11] \"先生として当然のことだから。\""
212210-140 = "またその目……。"
212210-144 = "それが同情じゃないなら……一体何なんですか……？"
212210-145 = "教えてくださいよ。"
212210-146 = "[s] \"……待ってるんだよ。\""
212210-147 = "待つ……？何を？"
212210-148 = "私がここで朽ちていくのを？それとも、自滅していく様を？"
212210-149 = "[s12] \"自分を縛っていた呪いを断ち切って。\"\n[s13] \"次に進む勇気を持てる日を、かな。\""
212210-155 = "次……私に次なんてありません。"
212210-156 = "失敗したんです。もうおしまいなんですよ。"
212210-157 = "この冷たい壁の中で、忘れられていくのがふさわしい存在なんです。#n「次」だなんて、贅沢な言葉を使わないでください。"
212210-161 = "……はい？#n罪を償うのは、再び立ち上がるためだと？"
212210-162 = "[s14] \"それに、そうやって見守る人が――\"\n[s15] \"一人くらいいてもいいんじゃないかな。\"\n[s16] \"その時まで待ってる。\""
212210-166 = "……。"
212210-170 = "はぁ……。"
212210-171 = "……嵐。"
212210-172 = "[s] \"え……？\""
212210-173 = "私を見つけて、教育し、任務を与えた組織の名前です。"
212210-174 = "[s] \"それって……！！\""
212210-175 = "いま言えるのはそれだけです。"
212210-176 = "……もうお帰りください。"
212210-177 = "[s] \"……また来るね。\""
212210-178 = "…………。"
212210-182 = "……。"
212210-188 = "……甘いです。"
212210-192 = "甘すぎて……頭がぐちゃぐちゃになりそうなんですけど……。"
212210-193 = "うっ……ひっく……。"
212210-196 = "……。"
212210-201 = "思った通り。裏にいたのは「嵐」だった。"
212210-202 = "雷帝の思想を受け継いで、遺産を復元しようとしている連中。"
212210-203 = "地下の隅っこで、雷帝の古い設計図でも舐め回してるネズミどもに過ぎんと思っていたが――"
212210-204 = "ここまで大胆に動くとはな。"
212210-205 = "……甘く見すぎていたみたいね。"
212210-206 = "学園を脅かすだけの力がある――それを証明したテロだった。"
212210-207 = "私たちが封じたはずのあの怪物が……。"
212210-208 = "もっと狡猾な形で、目を覚ましたようだな。キシシッ。"
212210-209 = "……。"
212210-210 = "不幸中の幸いは、校内に残っていた雷帝の遺産を排除できたこと。"
212210-211 = "これでもう、内部の脅威は消えたはず。#nだから後は、外からの侵入に備えれば――"
212210-212 = "いいや。雷帝の遺産がすべて消えたわけではない。"
212210-216 = "……あ。"
212210-220 = "…………。"
212210-221 = "捉えようによれば、真なる雷帝の遺産とも言える――"
212210-224 = "イブキがいるのだから。"
212210-227 = "炎と影編;To be Continued in Chapter 3"
