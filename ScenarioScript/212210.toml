[translation]
212210-1 = "Episode 21;Unfading"
212210-5 = "[ns] \"Hina, you there?\""
212210-9 = ""
212210-10 = "O-Oh... Sensei."
212210-11 = "[s] \"Are you okay? You haven't taken any breaks, have you?\""
212210-12 = "There's too much to do right now."
212210-13 = "[s1] \"I realized I'm actually probably in deep trouble right now.\"\n[s2] \"I've been at Gehenna for a while now...\""
212210-16 = "Ah..."
212210-17 = ""
212210-19 = ""
212210-20 = "[ns] \"I-I wasn't trying to make you feel bad! I'm sorry!\""
212210-21 = ""
212210-22 = ""
212210-23 = "Haha. You really never change, do you?"
212210-24 = "..."
212210-25 = "Sensei..."
212210-26 = "I messed up again."
212210-27 = "I really am just the world's biggest fool."
212210-28 = "I've been running from the past for so long. Trying to escape from the blackness of that hatred."
212210-29 = "I can still feel the seething malice that built up inside of me."
212210-30 = ""
212210-32 = ""
212210-33 = "But you know what really bothers me, Sensei?"
212210-34 = "When it was happening, in truth..."
212210-35 = "I...felt better than I thought I could."
212210-37 = "Unleashing the full brunt of my power..."
212210-38 = "Justifying the violence with absurdities..."
212210-39 = "I liked all of it."
212210-41 = "..."
212210-42 = "I'm disgusted with myself. I'm terrified to find out that this is who I really am."
212210-43 = "...Me? Protector of our values?"
212210-44 = "What a joke."
212210-45 = "I enjoyed it. I didn't want to stop."
212210-46 = "What if they found out what I'm really like? Their Head Prefect, the one who holds the line...?"
212210-47 = "It has to be a bad joke."
212210-48 = "I'm beyond redemption."
212210-49 = "I'm weak, wicked, and utterly foolish."
212210-50 = "[s] \"Despite all that, what did you choose to do, Hina?\""
212210-51 = ""
212210-53 = ""
212210-54 = "[ns] \"You held the line. For Gehenna. I can prove that to you.\""
212210-55 = "Sensei..."
212210-56 = ""
212210-59 = "[ns3] \"And I'm just like you. I feel that way sometimes too.\"\n[ns4] \"I have despicable weaknesses I have to overcome too.\""
212210-62 = ""
212210-63 = "You, Sensei...?"
212210-64 = "[s5] \"I face them without letting them define me.\"\n[s6] \"So that I can become the version of myself I want to be.\"\n[s7] \"That's why I try so hard to do better.\""
212210-68 = "You...worry about these things too, Sensei?"
212210-69 = "...Yes? These kinds of thoughts are completely natural?"
212210-70 = "...To you, it's more admirable when someone strives to overcome their weakness than just having none?"
212210-71 = "[s] \"And it just makes me like you more, learning about this side of you.\""
212210-72 = "...?!"
212210-73 = "Wh-What are you saying to me right now, Sensei...?!"
212210-74 = ""
212210-76 = ""
212210-77 = "...You admire me for always acknowledging my weaknesses, picking myself up and moving forward?"
212210-78 = "..."
212210-79 = ""
212210-81 = ""
212210-82 = "...You're right."
212210-83 = "I'm lacking in so many ways. I'm pathetic."
212210-84 = "But..."
212210-85 = "I'll just keep moving."
212210-86 = "I won't lose to anything or anyone: not the past, not myself, not my weaknesses. I'll only continue walking straight ahead."
212210-87 = ""
212210-89 = ""
212210-90 = "So..."
212210-91 = ""
212210-93 = ""
212210-94 = ""
212210-95 = "Will you always stay by my side, Sensei?"
212210-96 = "[s] \"Of course.\""
212210-97 = "...Yeah."
212210-98 = "Then I'll never lose again."
212210-100 = "Things in Gehenna had more or less settled back to normal."
212210-101 = "But not for everyone..."
212210-104 = "..."
212210-105 = "[ns] \"Shouko.\""
212210-106 = ""
212210-107 = "Ah. Sensei. So our positions have reversed."
212210-108 = "This is quite a fresh experience. Did you come all the way down here to indulge in a little schadenfreude?"
212210-109 = "Congratulations, Sensei. You've won."
212210-110 = "[s] \"I didn't come here to settle scores, Shouko.\""
212210-111 = ""
212210-113 = ""
212210-114 = "Of course you didn't. It's not in your nature. But I still must ask."
212210-115 = "You really believe this is the correct answer? Gehenna just returning to what it was?"
212210-116 = "You think that the chaos of the current Gehenna, a school ruled by rowdiness and explosions, is the right answer for this school?"
212210-117 = "[s8] \"There are those who are trying to protect the line.\"\n[s9] \"And then there's me, watching from the outside.\""
212210-120 = "...I will never understand you."
212210-121 = "If you came here hoping to inspire self-reflection and kowtowing on my part, I'm afraid you'll have to leave disappointed."
212210-122 = "Though my plans ended in failure, I refuse to believe that my convictions were wrong."
212210-123 = ""
212210-127 = "[ns] \"I just brought these because they popped into my head.\""
212210-128 = ""
212210-129 = "...Aren't these...the snacks I told you about...?"
212210-130 = ""
212210-132 = ""
212210-133 = "Are you trying to mock me right now?"
212210-134 = "[s] \"No. That isn't my intention, Shouko.\""
212210-135 = "Then what is the meaning of this? I am a criminal and a failure who tried to overthrow Gehenna."
212210-136 = "So, why... Why would you bring me such a thing?"
212210-137 = "[s10] \"Because it's a teacher's responsibility...\"\n[s11] \"...to make sure their students are eating well.\""
212210-140 = "You're looking at me like that again..."
212210-141 = ""
212210-143 = ""
212210-144 = "If you don't call that pity... Then what could it be...?"
212210-145 = "Tell me, Sensei."
212210-146 = "[s] \"It's called patience.\""
212210-147 = "\"Patience\"? For what?"
212210-148 = "For me to rot away here?"
212210-149 = "[s12] \"For you to break free from the shackles you've attached yourself to.\"\n[s13] \"For you to have the courage to live the life you deserve, Shouko.\""
212210-152 = ""
212210-154 = ""
212210-155 = "Live...the life I deserve...?"
212210-156 = "I failed. Everything is over for me."
212210-157 = "Don't tout luxuries like the future to me. I'll rot away here for the rest of time, just like I deserve."
212210-158 = ""
212210-160 = ""
212210-161 = "...I can't pay for my sins by fading into nothingness, but by starting over?"
212210-162 = "[s14] \"And wouldn't it be fine to have at least one person...\"\n[s15] \"...be by your side during that process?\"\n[s16] \"I'll be waiting for you.\""
212210-166 = "..."
212210-167 = ""
212210-169 = ""
212210-170 = "Aah..."
212210-171 = "...Storm."
212210-172 = "[s] \"Storm...?\""
212210-173 = "That's the name of the organization that found me, trained me, and assigned me this mission."
212210-174 = "[s] \"What?!\""
212210-175 = "That's all I can say for now."
212210-176 = "...So please be on your way, Sensei."
212210-177 = "[s] \"I'll be back again, Shouko.\""
212210-178 = "..."
212210-181 = ""
212210-182 = "..."
212210-183 = ""
212210-185 = ""
212210-186 = ""
212210-187 = ""
212210-188 = "...It's sweet."
212210-189 = ""
212210-191 = ""
212210-192 = "...It's too sweet... It's mixing me up."
212210-193 = "*sniffle* *sob*"
212210-196 = "..."
212210-197 = ""
212210-200 = ""
212210-201 = "...As expected, the organization behind all this was indeed \"Storm.\""
212210-202 = "Those who seek to inherit the Tyrant Emperor's ideology and restore her legacy."
212210-203 = "They used to be nothing more than rats obsessing over the Tyrant Emperor's old blueprints in a basement."
212210-204 = "I didn't think they'd accrued the power and standing to pull off something like this."
212210-205 = "...We let our guard down. This wasn't an isolated incident."
212210-206 = "They committed this act to scare us. And to prove that they could harm us."
212210-207 = "The monster we believed we put to sleep..."
212210-208 = "...seems to have reawakened with far more cunning this time. Kihehe."
212210-209 = "..."
212210-210 = "At the very least, the Tyrant Emperor's legacy within this academy is no more after this incident."
212210-211 = "Now that the internal threat is gone, all we need to do is to prepare ourselves against the outside..."
212210-212 = "...Not all of the Tyrant Emperor's legacy is completely erased."
212210-213 = ""
212210-215 = ""
212210-216 = "...Ah."
212210-217 = ""
212210-219 = ""
212210-220 = "..."
212210-221 = "...In a way, we still have the true legacy of the Tyrant Emperor..."
212210-223 = ""
212210-224 = "We have Ibuki."
212210-225 = ""
212210-227 = "Flame and Shadow;To Be Continued in Chapter 3"
