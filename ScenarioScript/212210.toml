212210-111 = ""
212210-113 = ""
212210-114 = "ค่ะ ฉันรู้ค่ะ เพราะคุณครูเป็นแบบนั้นมาตลอด แต่ฉันก็อยากถามค่ะ"
212210-115 = "คุณครูคิดว่านี่คือคำตอบที่ถูกต้องเหรอคะ? การกลับไปเป็นเกเฮนน่าแบบเมื่อก่อนน่ะ?"
212210-116 = "เกเฮนน่าที่วุ่นวาย สาดกระสุนไปทั่ว ระเบิดไปทั่ว ทำตามใจตัวเอง มันคือสิ่งที่ถูกต้องจริงๆ เหรอคะ?"
212210-117 = "[s8] \"เพราะมีคนที่ตั้งใจจะรักษาเส้นนั้นอยู่\"\n[s9] \"แล้วก็มีครูที่คอยเฝ้าดูอยู่ข้างนอกนั้นอยู่น่ะ\""
212210-120 = "ฉันไม่เข้าใจเลยค่ะ..."
