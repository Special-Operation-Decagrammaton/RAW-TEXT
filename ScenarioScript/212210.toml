212210-106 = ""
212210-107 = "อ่า คุณครู ครั้งนี้ตำแหน่งของเรากลับกันนะคะ"
212210-108 = "อะไรแบบนี้ก็เป็นประสบการณ์ที่แปลกใหม่ดีเหมือนกันค่ะ"
212210-109 = "ยินดีด้วยค่ะ คุณครู คุณครูเป็นฝ่ายชนะแล้ว"
