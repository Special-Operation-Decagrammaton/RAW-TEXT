[translation]
212210-1 = "第21話;不會熄滅的"
212210-5 = "[ns] 「陽奈，你在嗎？」"
212210-9 = ""
212210-10 = "嗯……你來了啊，老師。"
212210-11 = "[s] 「你還好嗎？一直工作到現在吧？」"
212210-12 = "這點程度不算什麼。#n而且要做的事也堆積如山……"
212210-13 = "[s1] 「仔細想想，我也挺不妙的……」\n[s2] 「因為好一陣子都只待在格黑娜……」"
212210-16 = "啊……"
212210-17 = ""
212210-19 = ""
212210-20 = "[ns] 「不是！我不是在暗示你什麼！！真的！」"
212210-21 = ""
212210-22 = ""
212210-23 = "哈哈……明明經歷了那種事，老師卻還是老樣子呢。"
212210-24 = "……"
212210-25 = "老師……"
212210-26 = "我又犯錯了。"
212210-27 = "真的很蠢吧。"
212210-28 = "那明明是我最討厭、最想擺脫的過去。"
212210-29 = "那種黏膩的惡意……沉積在底部的漆黑情感，到現在都還歷歷在目。"
212210-30 = ""
212210-32 = ""
212210-33 = "不過老師，你知道讓我快要發瘋的是什麼嗎？"
212210-34 = "我那時候……"
212210-35 = "感覺比想像中還要好。"
212210-37 = "揮舞力量，準備將它傾瀉到某處……"
212210-38 = "為了讓暴力正當化而捏造荒唐名目的那一切……"
212210-39 = "全都讓我隱約有種舒服的感覺。"
212210-41 = "……"
212210-42 = "那才是最讓我感到噁心的。#n我居然是那樣的人。"
212210-43 = "還說什麼守護界線……？"
212210-44 = "真是胡說八道。哈哈。"
212210-45 = "明明在內心深處，有個會對那些行為產生快感的自己。"
212210-46 = "那樣的我是風紀委員長……？守護界線的人……？"
212210-47 = "別說傻話了。"
212210-48 = "我已經無可救藥了。"
212210-49 = "軟弱、邪惡，又愚蠢至極。"
212210-50 = "[s] 「即便如此，陽奈還是一直守護著界線。」"
212210-51 = ""
212210-53 = ""
212210-54 = "[ns] 「這點我很清楚，也可以證明。」"
212210-55 = "老師……"
212210-56 = ""
212210-59 = "[ns3] 「而且，我也是會有那種愚蠢想法的人。」\n[ns4] 「常常會面對自己軟弱的一面。」"
212210-62 = ""
212210-63 = "老師也是……？"
212210-64 = "[s5] 「當然那並不能完全定義我自己。」\n[s6] 「只是，因為我有自己想成為的樣子。」\n[s7] 「所以我只是努力朝那個方向前進而已。」"
212210-68 = "老師也會……有那種煩惱……？"
212210-69 = "我會這樣想，也是理所當然的嗎……？"
212210-70 = "不是那樣的人，光是努力想成為那樣的人就已經很了不起了……"
212210-71 = "[s] 「而且正因為陽奈是那樣的人，我反而更喜歡你。」"
212210-72 = "……！？"
212210-73 = "你，你在說什麼啊？老師……！！"
212210-74 = ""
212210-76 = ""
212210-77 = "因為我是明白自己的不足，仍然想往前走的人……？"
212210-78 = "…………"
212210-79 = ""
212210-81 = ""
212210-82 = "沒錯。"
212210-83 = "我是個非常不成熟又沒用的人。"
212210-84 = "但是……"
212210-85 = "儘管如此，我還是會繼續前進。"
212210-86 = "為了不輸給過去、不輸給自己……而繼續前進。"
212210-87 = ""
212210-89 = ""
212210-90 = "所以……"
212210-91 = ""
212210-93 = ""
212210-94 = ""
212210-95 = "老師你也要一直待在我身邊。"
212210-96 = "[s] 「當然。」"
212210-97 = "……嗯。"
212210-98 = "那樣的話，我就不會輸給任何事物。"
212210-100 = "（格黑娜的事情雖然暫時平息了……）"
212210-101 = "（但還有一些殘留的事物）"
212210-104 = "……"
212210-105 = "[ns] 「翔子。」"
212210-106 = ""
212210-107 = "啊啊，老師。這次立場反過來了呢。"
212210-108 = "這也是相當新鮮的經驗呢。"
212210-109 = "恭喜您，老師。是老師贏了。"
212210-110 = "[s] 「我不是來分勝負的，翔子。」"
212210-111 = ""
212210-113 = ""
212210-114 = "是的，我知道。因為老師一直都是那樣。#n不過，我想請教您一個問題。"
212210-115 = "您真的認為回到以前的格黑娜就是正確答案嗎？"
212210-116 = "到處亂開槍、引爆炸彈、為所欲為的混亂格黑娜，真的是對的嗎？"
212210-117 = "[s8] 「因為有想守護界線的人們……」\n[s9] 「也有在界線外守望著的我。」"
212210-120 = "……我無法理解。"
212210-121 = "如果您是期待我謝罪或反省才來的，那您恐怕要失望了。"
212210-122 = "雖然以失敗收場，但我並不認為自己的信念本身是錯的。"
212210-123 = ""
212210-127 = "[ns] 「我只是想到這個就帶過來了。」"
212210-128 = ""
212210-129 = "這是……我喜歡的點心……？"
212210-130 = ""
212210-132 = ""
212210-133 = "您現在是在嘲弄我嗎？"
212210-134 = "[s] 「我既沒有嘲弄翔子，也沒有同情你。」"
212210-135 = "那到底是為什麼？#n我可是企圖顛覆格黑娜的罪犯，也是個失敗者。"
212210-136 = "為什麼要帶這種東西……不，為什麼。"
212210-137 = "[s10] 「擔心自己的學生有沒有好好吃飯……」\n[s11] 「是老師理所當然該做的事。」"
212210-140 = "又是那種眼神……"
212210-141 = ""
212210-143 = ""
212210-144 = "如果那不是同情的話……究竟是什麼……？"
212210-145 = "請告訴我，老師。"
212210-146 = "[s] 「那是等待。」"
212210-147 = "等待……？等待什麼？"
212210-148 = "等我在這裡腐朽嗎？還是等著看我自取滅亡？"
212210-149 = "[s12] 「等待翔子斬斷束縛著自己的咒縛……」\n[s13] 「鼓起邁向下一步的勇氣。」"
212210-152 = ""
212210-154 = ""
212210-155 = "下一步……我根本沒有什麼下一步。"
212210-156 = "我在這裡已經結束了。徹底失敗了。"
212210-157 = "請不要對我用「下一步」這種奢侈的詞。#n因為我是理應在這冰冷的牆壁裡贖罪，然後被遺忘的存在。"
212210-158 = ""
212210-160 = ""
212210-161 = "……您說贖罪不是為了被遺忘，而是為了重新開始？"
212210-162 = "[s14] 「而且，有個默默守望著那個身影的人……」\n[s15] 「應該也挺不錯的吧。」\n[s16] 「我會一直等到那個時候到來的。」"
212210-166 = "……"
212210-167 = ""
212210-169 = ""
212210-170 = "唉……"
212210-171 = "……「嵐」。"
212210-172 = "[s] 「嵐……？」"
212210-173 = "是發現我、教育我、給我任務的組織名稱。"
212210-174 = "[s] 「！！」"
212210-175 = "我現在能說的就只有這些。"
212210-176 = "……請您回去吧，老師。"
212210-177 = "[s] 「我還會再來的，翔子。」"
212210-178 = "…………"
212210-181 = ""
212210-182 = "……"
212210-183 = ""
212210-185 = ""
212210-186 = ""
212210-187 = ""
212210-188 = "……好甜。"
212210-189 = ""
212210-191 = ""
212210-192 = "因為太甜……感覺腦袋都要變得一團亂了……"
212210-193 = "嗚……嗚嗚……"
212210-196 = "……"
212210-197 = ""
212210-200 = ""
212210-201 = "……幕後組織果然是「嵐」。"
212210-202 = "繼承雷帝的思想，企圖修復其遺產的一群人。"
212210-203 = "本以為他們只不過是一群躲在地下角落、舔著雷帝老舊設計圖的鼠輩……"
212210-204 = "沒想到竟然敢像這次一樣，大膽地在格黑娜內部搞事啊。"
212210-205 = "……是我們太輕忽了。#n這次的事態不是一名追隨者獨斷引發的事故。"
212210-206 = "而是一場證明了他們確實有能力威脅學園的恐怖攻擊。"
212210-207 = "我們以為已經讓它沉睡的那頭怪物……"
212210-208 = "似乎以更加狡猾的姿態甦醒了啊。嘰嘻嘻。"
212210-209 = "……"
212210-210 = "不幸中的大幸是，這次的事讓校內的雷帝遺產完全消失了。"
212210-211 = "既然內部的威脅已經消失，往後只要防備來自外部的入侵……"
212210-212 = "……雷帝的遺產並沒有全部消失。"
212210-213 = ""
212210-215 = ""
212210-216 = "……啊。"
212210-217 = ""
212210-219 = ""
212210-220 = "…………"
212210-221 = "畢竟某種意義上，可說是真正的雷帝遺產的……"
212210-223 = ""
212210-224 = "伊吹還在啊。"
212210-225 = ""
212210-227 = "烈焰與陰影篇;To Be Continued in Chapter 3"
