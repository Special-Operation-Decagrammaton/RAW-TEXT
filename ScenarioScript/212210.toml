[translation]
212210-1 = "ตอนที่ 21;สิ่งที่ไม่มอดดับ"
212210-5 = "[ns] \"ฮินะ อยู่มั้ย?\""
212210-9 = ""
212210-10 = "อื้ม... มาแล้วเหรอ คุณครู"
212210-11 = "[s] \"ไหวหรือเปล่า? ทำงานมาตลอดจนถึงตอนนี้เลยใช่มั้ย?\""
212210-12 = "แค่นี้ไม่เป็นไรหรอก ยังไงงานที่ต้องทำก็กองเป็นพะเนินอยู่แล้ว..."
212210-13 = "[s1] \"พอมาคิดดูแล้ว ครูเองก็แย่เหมือนกัน...\"\n[s2] \"ครูก็อยู่แต่ที่เกเฮนน่ามาสักพักแล้วน่ะ...\""
212210-16 = "อ่า..."
212210-17 = ""
212210-19 = ""
212210-20 = "[ns] \"เปล่า! ครูไม่ได้พูดเป็นนัยแฝงอะไรหรอกนะ!! จริงๆ!\""
212210-21 = ""
212210-22 = ""
212210-23 = "ฮะฮะ... คุณครูผ่านเรื่องแบบนั้นมาแล้วแต่ก็ยังเหมือนเดิมอยู่เลยนะ"
212210-24 = "..."
212210-25 = "คุณครู..."
212210-26 = "ฉันทำผิดไปอีกแล้ว"
212210-27 = "โง่จริงๆ เลยเนอะ"
212210-28 = "ทั้งที่นั่นเป็นสิ่งที่ฉันเกลียดที่สุดแท้ๆ เป็นอดีตที่ฉันอยากหนีให้พ้นเลยด้วยซ้ำ"
212210-29 = "เจตนาร้ายอันเหนียวแน่น... ความรู้สึกดำมืดที่เกาะติดอยู่ก้นบึ้งนั่น ตอนนี้ฉันยังรู้สึกถึงมันได้ชัดเจนอยู่เลย"
212210-30 = ""
212210-32 = ""
212210-33 = "แต่คุณครูรู้มั้ย ว่าอะไรที่ทำให้ฉันแทบจะเป็นบ้าไปน่ะ?"
212210-34 = "ตอนนั้นฉัน..."
212210-35 = "รู้สึกดีมากกว่าที่คิด"
212210-37 = "ตอนใช้กำลัง ตอนเตรียมระบายมันออกไปที่ไหนสักแห่ง..."
212210-38 = "ทุกอย่างที่ฉันทำ ตั้งแต่สร้างข้ออ้างไร้สาระมาทำให้ความรุนแรงดูชอบธรรม..."
212210-39 = "ทุกอย่างมันทำให้ฉันรู้สึกดีอยู่ลึกๆ"
212210-41 = "..."
212210-42 = "นั่นแหละที่น่าขยะแขยงที่สุด ที่ฉันเป็นคนแบบนั้น"
212210-43 = "ปกป้องและรักษาเส้นขอบเขตงั้นเหรอ...?"
212210-44 = "พูดเหลวไหลอะไรกัน ฮะฮะ"
212210-45 = "ทั้งที่ลึกๆ ในใจ ตัวฉันเองยังรู้สึกพอใจกับการกระทำพวกนั้นอยู่เลย"
212210-46 = "คนแบบฉันน่ะเหรอ ประธานกรรมการวินัย...? คนที่ปกป้องและรักษาเส้นขอบเขตไว้...?"
212210-47 = "พูดให้มันมีเหตุผลหน่อยสิ"
212210-48 = "ฉันมันแก้ไม่หายแล้ว"
212210-49 = "ทั้งอ่อนแอ ทั้งชั่วร้าย แล้วก็ยังโง่เขลาที่สุด"
212210-50 = "[s] \"ถึงอย่างนั้น ฮินะก็รักษาเส้นนั้นไว้มาตลอดนะ\""
212210-51 = ""
212210-53 = ""
212210-54 = "[ns] \"เรื่องนั้นครูรู้ดี และพิสูจน์ได้ด้วย\""
212210-55 = "คุณครู..."
212210-56 = ""
212210-59 = "[ns3] \"แล้วก็ ครูเองก็เป็นคนที่คิดอะไรโง่ๆ แบบนั้นเหมือนกัน\"\n[ns4] \"บางครั้งครูก็ได้เจอด้านที่อ่อนแอของตัวเองนะ\""
212210-62 = ""
212210-63 = "คุณครูก็ด้วยเหรอ...?"
212210-64 = "[s5] \"แน่นอนว่าด้านนั้นไม่ได้เป็นตัวกำหนดว่าครูเป็นคนแบบไหน\"\n[s6] \"เพียงแต่ครูมีตัวเองแบบที่อยากจะเป็น\"\n[s7] \"ครูก็แค่พยายามจะเป็นแบบนั้นเท่านั้นเอง\""
212210-68 = "คุณครู... ก็มีเรื่องกลุ้มใจแบบนั้นด้วยเหรอ...?"
212210-69 = "การที่ฉันคิดแบบนี้ก็เป็นเรื่องธรรมดางั้นเหรอ...?"
212210-70 = "คนที่ยังไม่เป็นแบบนั้น แค่พยายามจะเป็นให้ได้ก็เท่มากแล้ว..."
212210-71 = "[s] \"แล้วก็ เพราะฮินะเป็นคนแบบนั้น ครูถึงยิ่งชอบเข้าไปอีก\""
212210-72 = "...?!"
212210-73 = "พะ... พูดอะไรน่ะ? คุณครู...!!"
212210-74 = ""
212210-76 = ""
212210-77 = "เพราะฉันเป็นคนที่รู้ข้อบกพร่องของตัวเอง แล้วยังพยายามก้าวต่อไปงั้นเหรอ...?"
212210-78 = "..."
212210-79 = ""
212210-81 = ""
212210-82 = "ใช่แล้ว"
212210-83 = "ฉันเป็นคนที่ยังขาดตกบกพร่องอยู่มาก แล้วก็ไม่ได้เรื่องเลยด้วย"
212210-84 = "แต่ว่า..."
212210-85 = "ถึงอย่างนั้น ฉันก็จะยังคงก้าวต่อไป"
212210-86 = "จะไม่ยอมแพ้ให้กับอดีต ไม่แพ้ให้กับตัวเอง แล้วก็จะ... ก้าวต่อไปเรื่อยๆ"
