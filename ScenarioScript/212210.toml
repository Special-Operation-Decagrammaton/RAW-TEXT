[translation]
212210-1 = "제21화;꺼지지 않는"
212210-5 = "[ns] \"히나, 있어?\""
212210-10 = "으응…… 와줬구나, 선생님."
212210-11 = "[s] \"괜찮아? 지금까지 계속 업무한 거지?\""
212210-12 = "이정도는 괜찮아. 안 그래도 할 일이 많이 쌓여서……."
212210-13 = "[s1] \"생각해 보니 나도 큰일 났네……\"\n[s2] \"한동안 게헨나에만 있었으니까…….\""
212210-16 = "아……."
212210-20 = "[ns] \"아니! 눈치 준 거 아니니까!! 진짜로!\""
212210-23 = "하하…… 선생님은 그런 일을 겪고도 여전하구나."
212210-24 = "……."
212210-25 = "선생님……."
212210-26 = "나, 또 잘못을 저질렀어."
212210-27 = "정말 바보 같지."
212210-28 = "그거야말로, 내가 가장 싫어하던 거였는데. 벗어나고 싶은 과거였는데."
212210-29 = "그, 찐득찐득한 악의가…… 밑바닥에 들러붙은 시커먼 감정이 지금도 생생해."
212210-33 = "그런데 선생님, 내가 미쳐버릴 것 같은 게 뭔지 알아?"
212210-34 = "나, 그때……"
212210-35 = "생각보다 기분이 좋았어."
212210-37 = "힘을 휘두르고, 어딘가로 쏟아낼 준비를 하면서……"
212210-38 = "폭력을 정당화할 수 있게 말도 안 되는 명분을 만들던 그 모든 것들이……"
212210-39 = "다 은근히 기분 좋더라."
212210-41 = "……."
212210-42 = "그게 제일, 제일 역겨워. 내가 그런 사람이었다는 게."
212210-43 = "……선을 지킨다고……?"
212210-44 = "무슨 헛소리야. 하하."
212210-45 = "마음속 깊은 곳에서는 그 행동들에 쾌감을 느끼는 나 자신이 있는데."
212210-46 = "그런 내가 선도부장……? 선을 지키는 사람……?"
212210-47 = "말이 되는 소릴 해야지."
212210-48 = "나는 구제 불능이야."
212210-49 = "약하고, 악하고, 어리석기 짝이 없어."
212210-50 = "[s] \"그럼에도 불구하고, 히나는 계속해서 선을 지켜왔네.\""
212210-54 = "[ns] \"그건 내가 알아. 증명할 수도 있어.\""
212210-55 = "선생님……."
212210-59 = "[ns3] \"그리고, 나도 그런 바보 같은 생각을 하는 사람이야.\"\n[ns4] \"종종 내 약한 모습들을 마주치곤 하지.\""
212210-63 = "선생님도……?"
212210-64 = "[s5] \"물론 그게 나 자신을 완전히 규정하지는 않아.\"\n[s6] \"다만, 내가 되고 싶은 내 모습이 있으니까.\"\n[s7] \"그래서 그렇게 되려고 노력할 뿐이야.\""
212210-68 = "……선생님도…… 그런 고민을 해……?"
212210-69 = "내가 이런 생각을 하는 것도 당연한 거야……?"
212210-70 = "그렇지 않은 사람이, 그렇게 되려고 하는 것만으로도 멋지다고……."
212210-71 = "[s] \"그리고 나는 히나가 그런 사람이기에, 오히려 더 좋아.\""
212210-72 = "……?!"
212210-73 = "무, 무슨 말을 하는 거야? 선생님……!!"
212210-77 = "자신의 부족함을 알고 나아가려는 사람이라서……?"
212210-78 = "…………."
212210-82 = "맞아."
212210-83 = "나는 아주 부족하고, 못난 사람이야."
212210-84 = "하지만……."
212210-85 = "그럼에도 불구하고, 계속 나아가겠어."
212210-86 = "과거에 지지 않고, 나 자신에 지지 않고 계속…… 나아갈게."
212210-90 = "그러니까……."
212210-95 = "선생님도, 항상 내 곁에 있어 줘."
212210-96 = "[s] \"물론이지.\""
212210-97 = "……응."
212210-98 = "그렇다면, 나는 그 무엇에도 지지 않아."
212210-100 = "(게헨나의 일은 어느 정도 봉합되었지만……)"
212210-101 = "(아직, 남은 것들이 있다.)"
212210-104 = "……."
212210-105 = "[ns] \"쇼코.\""
212210-107 = "아아. 선생님. 이번에는 위치가 반대군요."
212210-108 = "이런 것도 꽤 신선한 경험이네요."
212210-109 = "축하드립니다, 선생님. 선생님이 이겼습니다."
212210-110 = "[s] \"승패를 가리려고 온 게 아니야, 쇼코.\""
212210-114 = "네, 알고 있습니다. 선생님은 언제나 그랬으니까요. 하지만 묻고 싶군요."
212210-115 = "이게 정답이라고 생각하시나요? 다시 예전의 게헨나로 돌아가는 것이?"
212210-116 = "아무 곳에나 총을 갈겨대고, 폭탄을 터뜨리고, 제멋대로 행동하는 혼란스러운 게헨나가 맞는 걸까요?"
212210-117 = "[s8] \"선을 지키고자 하는 사람들이 있고,\"\n[s9] \"그 밖에서 지켜보는 내가 있으니까.\""
212210-120 = "……이해할 수 없어요."
212210-121 = "제게 사죄나 반성 같은 걸 기대하고 오셨다면 실망하실 겁니다."
212210-122 = "비록 실패로 끝났지만, 제 신념 자체가 틀렸다고는 생각하지 않으니까요."
212210-127 = "[ns] \"그냥 이게 생각나서 가져왔어.\""
212210-129 = "……이건…… 제가 좋아하던 간식……?"
212210-133 = "지금 저를 조롱하시는 건가요?"
212210-134 = "[s] \"나는 쇼코를 조롱하지도, 동정하지도 않아.\""
212210-135 = "그럼 대체 뭐죠? 저는 게헨나를 전복시키려 했던 범죄자이자 실패자입니다."
212210-136 = "그런데 왜 이런 걸…… 아니, 왜."
212210-137 = "[s10] \"내 학생이 밥은 잘 먹고 있는지 걱정하는 건,\"\n[s11] \"선생이 당연히 해야 할 일이니까.\""
212210-140 = "또 그 눈……."
212210-144 = "그게 동정이 아니라면…… 대체 뭔가요……?"
212210-145 = "알려주세요, 선생님."
212210-146 = "[s] \"그건 기다림이야.\""
212210-147 = "기다림……? 무엇을 말인가요?"
212210-148 = "제가 이곳에서 썩어가는 것을요? 아니면 스스로 무너지는 꼴요?"
212210-149 = "[s12] \"쇼코가 스스로를 옭아매던 주박을 끊어내고,\"\n[s13] \"다음으로 나아갈 용기를 내길 기다리는 거야.\""
212210-155 = "다음…… 제게 다음 따위는 없습니다."
212210-156 = "저는 여기서 끝났습니다. 완전히 실패했어요."
212210-157 = "제게 '다음' 같은 사치스러운 단어를 쓰지 마세요. 저는 이 차가운 벽 안에서 죗값을 치르다 잊혀야 마땅한 존재니까요."
212210-161 = "……죗값을 치르는 건 잊히기 위해서가 아니라 다시 시작하기 위해서라고요?"
212210-162 = "[s14] \"그리고 그런 모습을 묵묵히 지켜보는 사람이,\"\n[s15] \"한 명쯤은 있어도 괜찮지 않을까.\"\n[s16] \"그때까지 기다리고 있을게.\""
212210-166 = "……."
212210-170 = "하아……."
212210-171 = "……<폭풍>."
212210-172 = "[s] \"폭풍……?\""
212210-173 = "저를 발견하고, 교육하고, 임무를 준 단체의 이름입니다."
212210-174 = "[s] \"!!\""
212210-175 = "지금 말할 수 있는 건 그것뿐이에요."
212210-176 = "……이제 그만 가주세요, 선생님."
212210-177 = "[s] \"또 올게, 쇼코.\""
212210-178 = "…………."
212210-182 = "……."
212210-188 = "……달아."
212210-192 = "……너무 달아서…… 머리가 엉망진창이 될 것 같다고요……."
212210-193 = "흑…… 흐윽……."
212210-196 = "……."
212210-201 = "……배후 단체는 역시 <폭풍>이더군."
212210-202 = "뇌제의 사상을 계승하고, 유산을 복구하려는 자들."
212210-203 = "지하 구석에서 뇌제의 낡은 설계도나 핥고 있는 쥐새끼들에 지나지 않았을 텐데……"
212210-204 = "이번처럼 대담하게 게헨나 내부에서 일을 벌일 줄은 몰랐군."
212210-205 = "……우리가 너무 안일했어. 이번 사태는 추종자 한 명이 독단적으로 일으킨 사고가 아니야."
212210-206 = "그들이 실제적으로 학원에 위협을 끼칠 능력이 있다는 것을 증명한 테러였지."
212210-207 = "우리가 잠재웠다고 믿었던 그 괴물이……"
212210-208 = "훨씬 더 교활한 모습으로 깨어난 것 같군. 키킥."
212210-209 = "……."
212210-210 = "정말 다행인 건, 이번 일로 교내에 있는 뇌제의 유산이 완전히 소멸되었다는 거야."
212210-211 = "이제 내부의 위협은 사라졌으니, 외부에서의 침입에 대비하면……."
212210-212 = "……뇌제의 유산이 전부 사라진 건 아니지."
212210-216 = "……아."
212210-220 = "…………."
212210-221 = "어떤 의미에서는 진정한 뇌제의 유산인……"
212210-224 = "이부키가 있으니까."
212210-227 = "불꽃과 그림자 편;To Be Continued in Chapter 3"
