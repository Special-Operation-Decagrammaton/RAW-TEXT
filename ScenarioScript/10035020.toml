[translation]
10035020-1 = "제2화;워터슬라이드, 태워 드립니다!"
10035020-2 = "아이고, 이거 반갑습니다. 저는 <아에기르>의 사장 되는 사람입니다."
10035020-3 = "라이프가드가 부족해서 큰일이었는데, 발키리 경찰학교에서 이렇게 파견을 와 주시니 든든하군요."
10035020-4 = "지원 요청에 흔쾌히 승낙해 주신 덕분에 한시름 놓았습니다."
10035020-5 = "넵! 길거리든 워터파크든, 시민들의 안전은 저희 생활안전국의 몫이니까요!"
10035020-6 = "맡겨만 주세요!"
10035020-7 = "하하하! 이거 듣던 중 반가운 말씀입니다."
10035020-8 = "이번에 처음 개장한 만큼, 오늘은 잘 좀 부탁드리겠습니다."
10035020-9 = "그럼 근무지를 배정해 드리지요."
10035020-10 = "편한 곳으로 부탁해~"
10035020-11 = "물론이지요. 도와주러 오신 분들이니 업무가 가장 쉬운 시설로 보내 드리겠습니다."
10035020-12 = "음……여기가 좋겠군요."
10035020-14 = "우리 파크의 자랑, '아쿠아 봅슬레이'입니다!"
10035020-17 = "히, 히익!"
10035020-18 = "이, 이 위는 생각보다 높네요……!"
10035020-19 = "이런 높이에서 슬라이드를 타고 내려간다니 생각만 해도 오금이 저립니다……."
10035020-20 = "진정하라구. 키리노한테 타고 내려가라고는 안 하니까."
10035020-21 = "그건 파크 이용객들의 몫이잖아."
10035020-22 = "그, 그건 그렇죠."
10035020-23 = "그렇게 생각하니 별로 겁나지 않네요!"
10035020-24 = "(계단으로 내려가는 게 더 무서울 것 같긴 하지만……말은 아껴둬야겠네.)"
10035020-25 = "뭐, 아무튼."
10035020-26 = "우리는 손님이 준비되면 여기 있는 버튼을 눌러서 내려보내기만 하면 돼."
10035020-27 = "단순해서 마음에 드는걸. 힘쓰는 일도 아니고."
10035020-28 = "국장도 마음에 들지?"
10035020-33 = "마음에 들고 안 들고는 중요하지 않다. 주어진 임무인 이상 해내는 수밖에."
10035020-34 = "하지만 확실히, 이 정도 일이라면 큰 어려움은 없을 것 같군."
10035020-35 = "해보겠다."
10035020-36 = "여기 매뉴얼이 있으니 봐 주세요! 이대로만 하면 될 거예요!"
10035020-37 = "그리고 매뉴얼에 없는 사항이라도 언제든 편하게 물어봐 주시면 되겠습니다!"
10035020-38 = "대민 업무에 있어서는 저랑 후부키가 익숙하니까, 분명 도움이 될 수 있을 거예요!"
10035020-39 = "……알겠다. 고맙군."
10035020-40 = "[s1] \"힘내, 모두들!\"\n[s2] \"힘내, 칸나!\""
10035020-42 = "네, 선생님. 감사합니다."
10035020-43 = "자, 그럼 첫 번째 손님! 이쪽으로 올라오세요!"
10035020-47 = "우, 우와아……위에서 보니 더 무서워……."
10035020-48 = "내가 이걸 탈 수 있을까……?"
10035020-49 = "자, 긴장하지 마시고! 먼저 탑승이 가능하신지 확인하기 위해 키를 체크하겠습니다!"
10035020-50 = "여기 있는 신장계 위에 서 주세요!"
10035020-55 = "오케이, 통과~"
10035020-56 = "이쪽 발판 위로 올라가 줘."
10035020-57 = "드, 드디어……!"
10035020-58 = "셋 하면 누르겠습니다!"
10035020-59 = "하나, 둘, 셋!"
10035020-63 = "우아아아아아아아아!"
10035020-65 = "[ns] \"히이익…….\""
10035020-66 = "생각보다 험악하게 내려가는걸."
10035020-67 = "어때, 선생도 탈래?"
10035020-68 = "[s3] \"무, 무리입니다.\"\n[s4] \"전 보기만 할게요.\""
10035020-71 = "그치, 역시 무리지~"
10035020-72 = "이런 걸 왜 타는지 이해할 수가 없네."
10035020-73 = "자신을 괴롭히지 않으면 견디지 못하는 걸까……?"
10035020-74 = "후부키, 다음 분 입장 부탁드려요!"
10035020-75 = "오케이~"
10035020-79 = "……."
10035020-80 = "안전 장비까지 지참하신 분이네요!"
10035020-81 = "[ns5] \"어라?\"\n[ns6] \"어디서 본 듯한……?\""
10035020-85 = "키도 통과입니다! 셋 하면 누를게요!"
10035020-86 = "하나, 둘!"
10035020-90 = "셋이라며어어어어!"
10035020-92 = "[ns] (맞구나…….)"
10035020-93 = "헉! 손이 미끄러져 버렸습니다!"
10035020-94 = "두 번 실수했다간 분명 심장에 무리 가는 사람이 나올 것 같은데."
10035020-95 = "국장, 키리노랑 교대 부탁해."
10035020-96 = "알겠다."
10035020-97 = "키리노, 교대다."
10035020-98 = "네……."
10035020-103 = "히야, 드디어 내 차례네."
10035020-104 = "엄청나게 기다렸다고."
10035020-106 = "정숙!"
10035020-107 = "이쪽으로 서도록."
10035020-108 = "연행, 아니 탑승 전에 신체검사를 실시하겠다."
10035020-110 = "시, 신체검사?"
10035020-111 = "아니, 잠깐, 당신 말투가 왜 그래?"
10035020-112 = "이견은 받지 않는다."
10035020-113 = "차렷!"
10035020-114 = "차, 차렷?!"
10035020-119 = "탑승 불가다."
10035020-120 = "계단을 통해 내려가도록."
10035020-121 = "뭐, 뭐라고? 못 타?"
10035020-122 = "한 시간이나 기다려서 겨우 올라왔는데 슬라이드를 못 탄다니!"
10035020-126 = "매뉴얼에 따르면……."
10035020-127 = "'아쿠아 봅슬레이'는 고속 루핑 슬라이드로, 안전사고의 위험이 있어 적정 범위 내의 신장을 가진 손님들에게만 탑승을 허용하고 있다."
10035020-128 = "손님이 원하면 어떻게 해서든 태워줘야 할 것 아냐!"
10035020-129 = "사장 나오라 그래!"
10035020-130 = "어, 어! 이런 곳에서 그렇게 크게 움직이면 위험합니다!"
10035020-131 = "손님! 진정해 주세요!"
10035020-132 = "우왓! 몸부림치면 위험해!"
10035020-133 = "떨어질지도 모른다구!"
10035020-134 = "그러니까 태워달라는 말을—"
10035020-140 = "아야야야얏! 아프잖아!"
10035020-141 = "조용히 해라."
10035020-142 = "제, 제압했어……."
10035020-143 = "너는 묵비권을 행사할 수 있고 변호사를 선임할 권리가 있다."
10035020-145 = "구, 국장님! 손님을 범죄자처럼 제압하면 어떡해요!"
10035020-148 = "법은 사람들의 안전을 지키기 위한 것."
10035020-149 = "그리고 워터파크의 안전 규정 또한 이용객들의 안전을 위한 것이다."
10035020-150 = "그러므로 워터파크의 안전 규정은 법률이나 다름없지."
10035020-151 = "안전을 수호하는 라이프가드로서 범죄자를 제재하는 것은 당연한 일……."
10035020-152 = "뭐, 뭐야, 저 라이프가드!"
10035020-153 = "히익! 설마 신체검사를 통과하지 못하면 저렇게 되는 건가?!"
10035020-154 = "항의한 것뿐인데 저런 취급은 심하잖아!"
10035020-158 = "당연한 일……일 텐데."
10035020-159 = "어째서 반응이……?"
10035020-160 = "국장님! 어서 손님을 놓아주세요!"
10035020-164 = "헉, 허억!"
10035020-165 = "주, 죽는 줄 알았잖아!"
10035020-166 = "라이프가드가 손님을 폭행하다니, 정식으로 항의할 테다!"
10035020-170 = "……."
10035020-171 = "저어, 국장님? 괜찮으세요?"
10035020-172 = "으음, 대민 업무는 공안국 업무랑 좀 차이가 있달까……."
10035020-173 = "대외적으로 보이는 것도 중시해야 한달까."
10035020-174 = "아무튼 방금은 좀 과했어."
10035020-175 = "그런가……."
10035020-176 = "면목이 없다……."
10035020-185 = "뭐하시는 겁니까!"
10035020-186 = "손님을 제압하다니!"
10035020-187 = "하지만 그 손님이 안전 규정을 무시하고 슬라이드를 태워달라고 해서……."
10035020-188 = "그렇다고 해도 고객에게 신체적인 위협을 가하는 건 안 되지요!"
10035020-189 = "대민 업무에 익숙한 생활안전국 요원들이라고 해서 마음을 놓고 있었는데 이게 뭡니까!"
10035020-190 = "죄, 죄송합니다!"
10035020-191 = "미, 미안……아니, 죄송합니다."
10035020-192 = "됐습니다."
10035020-193 = "이번 일은 우선 넘어가지요."
10035020-194 = "근무지를 옮겨드릴 테니, 이런 일이 또 발생하지 않게 해 주세요."
10035020-196 = "보직 변경?"
10035020-197 = "어디로……말씀이신가요?"
10035020-199 = "키즈 풀입니다."
