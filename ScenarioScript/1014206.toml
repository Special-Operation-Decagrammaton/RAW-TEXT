[translation]
1014206-1 = "只屬於兩人的祕密暗號"
1014206-2 = "（於是一起前往了海邊……）"
1014206-3 = ""
1014206-4 = ""
1014206-6 = ""
1014206-7 = "漂亮的殺球～！"
1014206-8 = "被，被擺了一道啊……！"
1014206-9 = "這個聲音是……？"
1014206-10 = "老師，過去那邊看看吧。"
1014206-13 = ""
1014206-14 = ""
1014206-15 = ""
1014206-16 = "[ns] 「原來是在打沙灘排球啊？」"
1014206-17 = "啊！是名草大人和老師！"
1014206-18 = "兩位要不要跟我們一起打沙灘排球？"
1014206-19 = ""
1014206-21 = ""
1014206-22 = ""
1014206-23 = "感覺是個不錯的主意，老師覺得呢？"
1014206-24 = "[s1] 「我在旁邊看就好。」\n[s2] 「我上場的話只會扯後腿。」"
1014206-27 = "可是一起打一定會很有趣的。"
1014206-28 = "啊……"
1014206-29 = "難道說……你是屬於比較喜歡看的那種類型？"
1014206-30 = ""
1014206-32 = ""
1014206-33 = "老師果然……"
1014206-34 = "[s] 「我不知道你在想像什麼，但絕對不是那樣！」"
1014206-36 = "（結果還是決定大家一起打沙灘排球……）"
1014206-37 = ""
1014206-38 = "那麼老師和名草大人一隊！"
1014206-39 = "這樣實力的平衡應該剛剛好！"
1014206-40 = "[s] 「我會努力不扯名草後腿的。」"
1014206-41 = ""
1014206-44 = "別這麼說。我從來沒有這麼看待老師。"
1014206-45 = "而且正好右手的狀態也達到了巔峰。"
1014206-46 = "別擔心。現在的我……不會輸給任何人。"
1014206-47 = "[s3] 「就，就算是這樣也不能全都丟給名草。」\n[s4] 「有沒有能讓我派上用場的作戰？」"
1014206-50 = ""
1014206-52 = ""
1014206-53 = ""
1014206-54 = "作戰嗎……"
1014206-55 = "那麼，來擬定幾個簡單的手勢吧。"
1014206-56 = "即使在比賽中也能隱瞞對手進行溝通的……"
1014206-57 = "只屬於我們兩人的祕密暗號。"
1014206-59 = "（不久後，比賽的時間到了……）"
1014206-60 = ""
