1014206-84 = ""
1014206-85 = "是對方隊伍先攻。"
1014206-86 = "如果想掌握有利的局勢，第一次防守是很重要的。"
1014206-90 = "― [log=나구사 수영복]一開始就先用這個作戰吧。[/log][wa:1571] "
1014206-92 = "― [log=나구사 수영복]我想對方一開場就會全力進攻。[/log][wa:1890] "
1014206-95 = "― [log=나구사 수영복]……老師？[/log][wa:4721] "
1014206-97 = "― [log=나구사 수영복]我的暗號，你有看清楚嗎？[/log][wa:1960] "
1014206-100 = "― [log=나구사 수영복]一開始就東張西望，真不像你呢。[/log][wa:2690] "
1014206-102 = "― [log=나구사 수영복]你究竟在看什麼……[/log]"
1014206-105 = "― [log=나구사 수영복]啊……原來如此。[/log][wa:5921] "
1014206-107 = "― [log=나구사 수영복]對不起。 [/log][wa:120] "
1014206-110 = "― [log=나구사 수영복]這樣反而沒辦法無法集中吧。 [/log]"
1014206-112 = "― [log=나구사 수영복]畢竟我……是個充滿神祕感的美少女。[/log][wa:3020] "
1014206-115 = "― [log=나구사 수영복]雖然沙灘排球是這樣打暗號的……[/log][wa:2481] "
1014206-117 = "― [log=나구사 수영복]不過從現在開始，改變方式會比較好嗎？[/log][wa:1710] "
1014206-120 = "― [log=나구사 수영복]……不行，果然還是太遲了呢。[/log][wa:4291] "
1014206-123 = "― [log=나구사 수영복]就這樣上吧，老師。[/log][wa:1973] "
1014206-125 = "― [log=나구사 수영복]如果是我們的話…… 一定沒問題的。[/log][wa:2250] "
1014206-128 = "（接著比賽開始了）"
1014206-129 = "（不論勝敗，這是一段非常愉快的時光）"
1014206-131 = ""
1014206-132 = ""
1014206-133 = ""
1014206-134 = ""
1014206-135 = ""
1014206-136 = ""
1014206-138 = "（比賽結束之後……）"
1014206-139 = ""
1014206-140 = "啊哈哈！真的好開心！"
1014206-141 = "那麼兩位！請繼續享受美好的時光哦～！"
1014206-142 = ""
1014206-144 = ""
1014206-145 = ""
1014206-146 = "美，美好的時光……是什麼意思？"
1014206-147 = "[s5] 「不就是字面上的意思嗎？」\n[s6] 「意思是希望這麼愉快的時光能一直持續下去。」"
1014206-150 = "……"
1014206-151 = "……嗯。說的也是。"
1014206-152 = "這段時間真的發生了好多事。"
1014206-153 = "要是沒有老師，我的手大概到現在都還沾染著黑暗又不祥的黃昏吧。"
1014206-154 = "多虧了老師……"
1014206-155 = "我才知道該如何伸出手。"
1014206-156 = "也明白了……該如何向前邁進。"
1014206-157 = "雖然還不是所有事情都回到了正軌……"
1014206-158 = "但只要有老師一直陪在身邊，我想就不用擔心了。"
1014206-159 = "……啊。"
1014206-160 = "我不知不覺又說了太多話呢。"
1014206-161 = ""
1014206-163 = ""
1014206-164 = ""
1014206-165 = "[ns] 「名，名草……？」"
1014206-166 = "既然都已經這樣了，我就重新把話說清楚吧。"
1014206-167 = "雖然我還有很多不成熟的地方……"
1014206-168 = "雖然除了外表以外沒什麼優點……"
1014206-169 = "今後也請你多多指教了，老師。"
1014206-171 = "（之後和名草在海邊度過了愉快的時光直到深夜）"
