[translation]
1014206-1 = "สัญญาณลับของสองเรา"
1014206-2 = "(คุณครูกับนางุสะมาถึงที่ชายหาด...)"
1014206-3 = ""
1014206-4 = ""
1014206-6 = ""
1014206-7 = "ลูกตบสวยมาก~!"
1014206-8 = "ดะ... โดนเล่นงานเข้าจนได้...!"
1014206-9 = "เสียงนี้มัน...?"
1014206-10 = "คุณครู ไปทางโน้นกันเถอะ"
1014206-13 = ""
1014206-14 = ""
1014206-15 = ""
1014206-16 = "[ns] \"กำลังเล่นวอลเลย์บอลชายหาดกันอยู่นี่เอง\""
1014206-17 = "อ๊ะ! คุณนางุสะกับคุณครูนี่นา!"
1014206-18 = "อยากเล่นวอลเลย์บอลชายหาดกับพวกเรามั้ยคะ?"
1014206-19 = ""
1014206-21 = ""
1014206-22 = ""
1014206-23 = "ฉันว่าน่าสนใจนะ คุณครูล่ะว่ายังไง?"
1014206-24 = "[s1] \"ครูขอเป็นกองเชียร์เฉยๆ ดีกว่า\"\n[s2] \"ถ้าให้ครูลงแข่งด้วย ครูจะเป็นภาระเปล่าๆ นะ\""
1014206-27 = "แต่ถ้าเล่นด้วยกันก็น่าจะสนุกนะ"
1014206-28 = "อ่า..."
1014206-29 = "หรือว่า... คุณครูชอบดูมากกว่า?"
1014206-30 = ""
1014206-32 = ""
1014206-33 = "ตามคาดเลย คุณครูนี่นะ..."
1014206-34 = "[s] \"ถึงจะไม่รู้ว่าจินตนาการอะไรอยู่ แต่ไม่ใช่อย่างนั้นนะ!\""
1014206-36 = "(แต่สุดท้ายคุณครูก็ตกลงเล่นวอลเลย์บอลชายหาดด้วย...)"
1014206-37 = ""
1014206-38 = "ถ้างั้นคุณครูกับคุณนางุสะก็อยู่ทีมเดียวกันได้เลยค่ะ!"
1014206-39 = "แบบนี้สมดุลของทีมน่าจะดีกว่าค่ะ!"
1014206-40 = "[s] \"ครูจะพยายามไม่เป็นภาระของนางุสะนะ\""
1014206-41 = ""
1014206-44 = "ภาระอะไรกัน ฉันไม่คิดว่าคุณครูจะเป็นแบบนั้นหรอกนะ"
1014206-45 = "แล้วตอนนี้มือขวาของฉันก็ใช้การได้ดีแล้วด้วย"
1014206-46 = "ไม่ต้องกังวลนะ ฉันในตอนนี้น่ะ... ไม่แพ้ให้ใครแน่นอน"
1014206-47 = "[s3] \"แต่ครูก็จะให้นางุสะแบกคนเดียวไม่ได้หรอก\"\n[s4] \"มีกลยุทธ์อะไรที่ครูพอจะช่วยเหลือได้มั้ย?\""
1014206-50 = ""
1014206-52 = ""
1014206-53 = ""
1014206-54 = "กลยุทธ์ ต้องมีกลยุทธ์......"
1014206-55 = "งั้นเรามากำหนดสัญญาณมือแบบง่ายๆ สัก 2-3 อย่างแล้วกัน"
1014206-56 = "เอาแบบที่เราสื่อสารกันระหว่างแข่งขันได้โดยที่อีกทีมอ่านความหมายไม่ออก..."
1014206-57 = "ให้เป็นสัญญาณลับของสองเราไง"
1014206-59 = "(การแข่งขันจะเริ่มในอีกไม่ช้า...)"
