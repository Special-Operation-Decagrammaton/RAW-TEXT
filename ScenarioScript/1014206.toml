1014206-86 = "ถ้าเราอยากคุมเกมให้ได้ ก็ต้องรับลูกแรกให้ดี"
1014206-90 = "― [log=나구사 수영복]ช่วงแรกเราใช้กลยุทธ์นี้แล้วกัน[/log][wa:851] "
1014206-92 = "― [log=나구사 수영복]ทีมตรงข้ามน่าจะใส่สุดพลังกันตั้งแต่ช่วงแรกเลย[/log][wa:650] "
1014206-95 = "― [log=나구사 수영복]... คุณครู?[/log][wa:4481] "
1014206-97 = "― [log=나구사 수영복]ตั้งใจดูสัญญาณจากฉันอยู่หรือเปล่า?[/log][wa:1080] "
1014206-100 = "― [log=나구사 수영복]วอกแวกตั้งแต่เริ่มเลยนะ ไม่สมกับเป็นคุณครูเลย[/log][wa:1490] "
1014206-102 = "― [log=나구사 수영복]มัวแต่ไปมองอะไรอยู่น่ะ...[/log]"
1014206-105 = "― [log=나구사 수영복]อ่า... อย่างนี้สินะ[/log][wa:5481] "
1014206-107 = "― [log=나구사 수영복]ขอโทษที [/log][wa:10] "
1014206-110 = "― [log=나구사 수영복]คงจะตั้งสมาธิไม่ได้สินะ [/log]"
1014206-112 = "― [log=나구사 수영복]ก็ฉันเป็น... สาวสวยที่น่าค้นหานี่เนอะ[/log][wa:2220] "
1014206-115 = "― [log=나구사 수영복]ปกติวอลเลย์บอลชายหาดจะส่งสัญญาณกันแบบนี้...[/log][wa:1361] "
1014206-117 = "― [log=나구사 수영복]หรือว่าตอนนี้ควรเปลี่ยนวิธีการดู?[/log][wa:1110] "
1014206-120 = "― [log=나구사 수영복]ไม่สิ... จะเปลี่ยนตอนนี้ก็ไม่ทันแล้ว[/log][wa:3411] "
1014206-123 = "― [log=나구사 수영복]ทำแบบนี้ต่อไปเรื่อยๆ เลย คุณครู[/log][wa:1093] "
1014206-125 = "― [log=나구사 수영복]พวกเรา... ไหวอยู่แล้ว[/log][wa:2090] "
1014206-128 = "(จากนั้นการแข่งขันก็เริ่มต้นขึ้น)"
1014206-129 = "(ไม่ว่าผลลัพธ์จะเป็นอย่างไร มันก็เป็นช่วงเวลาที่สนุกสนานมาก)"
