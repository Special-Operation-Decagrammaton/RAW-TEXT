[translation]
1014206-1 = "둘만의 비밀 신호"
1014206-2 = "(그리하여 찾아간 해변…….)"
1014206-7 = "나이스 스파이크~!"
1014206-8 = "다, 당했다아아……!"
1014206-9 = "이 소리는……?"
1014206-10 = "선생님. 저쪽으로 가보자."
1014206-16 = "[ns] \"비치발리볼을 하고 있었구나?\""
1014206-17 = "아! 나구사 님이랑 선생님이다!"
1014206-18 = "여러분! 우리랑 같이 비치발리볼 할래요?"
1014206-23 = "나는 좋은 것 같은데, 선생님은 어때?"
1014206-24 = "[s1] \"나는 구경만 할게.\"\n[s2] \"내가 하면 짐만 될 거야.\""
1014206-27 = "그래도 같이 하는 게 재미있을 텐데."
1014206-28 = "아……."
1014206-29 = "혹시…… 보는 걸 더 좋아하는 쪽이야?"
1014206-33 = "역시 선생님은……."
1014206-34 = "[s] \"무슨 상상을 하는지 몰라도 아니야!\""
1014206-36 = "(결국 다 함께 비치발리볼을 하기로 했다…….)"
1014206-38 = "그럼 선생님과 나구사 님이 한 팀이에요!"
1014206-39 = "그쪽이 팀 밸런스가 맞을 것 같으니까요!"
1014206-40 = "[s] \"나구사의 짐이 되지 않도록 노력할게.\""
1014206-44 = "짐이라니. 나는 선생님을 그렇게 생각하지 않아."
1014206-45 = "마침 오른손의 컨디션도 최고조야."
1014206-46 = "걱정하지 마. 지금의 나라면…… 그 누구에게도 지지 않아."
1014206-47 = "[s3] \"그, 그래도 나구사한테 전부 맡길 순 없지.\"\n[s4] \"내가 도움이 될만한 작전은 없을까?\""
1014206-54 = "작전이라……."
1014206-55 = "그러면 간단한 수신호를 몇 개 짜보자."
1014206-56 = "경기 중에도 상대에게 들키지 않고 소통할 수 있는……."
1014206-57 = "우리 둘만의 비밀 신호를."
1014206-59 = "(잠시 후 다가온 경기의 시간…….)"
1014206-61 = "[fffbab]고[-]"
1014206-62 = "[fffbab]료[-]"
1014206-63 = "[fffbab]나[-]"
1014206-64 = "[fffbab]구[-]"
1014206-65 = "[fffbab]사[-]"
1014206-68 = "[ffaecd]백[-]"
1014206-69 = "[ffaecd]귀[-]"
1014206-70 = "[ffaecd]야[-]"
1014206-71 = "[ffaecd]행[-]"
1014206-72 = "[ffaecd]학[-]"
1014206-73 = "[ffaecd]생[-]"
1014206-74 = "[ffaecd]들[-]"
1014206-75 = "[ffaecd] [-]"
1014206-76 = "[ffaecd] [-]"
1014206-81 = "[fffbab]VS[-]"
1014206-85 = "선공은 상대 팀."
1014206-86 = "유리한 흐름을 가져가려면 첫 수비가 중요해."
1014206-90 = "[wa:1451]― [log=나구사 수영복]처음에는 이 작전으로 가자.[/log]"
1014206-92 = "― [log=나구사 수영복]상대는 초반부터 [wa:1650]전력을 다할 테니까.[/log]"
1014206-95 = "[wa:3201]― [log=나구사 수영복]……[wa:1480]선생님?[/log]"
1014206-97 = "― [log=나구사 수영복]내 신호, [wa:1880]잘 보고 있어?[/log]"
1014206-100 = "― [log=나구사 수영복]시작부터 한눈을 팔다니, [wa:2370]선생님답지 않네.[/log]"
1014206-102 = "― [log=나구사 수영복]대체 뭘 보고 있었던…….[/log]"
1014206-105 = "[wa:4161]― [log=나구사 수영복]아……. [wa:1680]그렇구나.[/log]"
1014206-107 = "― [log=나구사 수영복]미안해.[wa:120] [/log]"
1014206-110 = "― [log=나구사 수영복]반대로 집중이 안 되겠네.[/log]"
1014206-112 = "― [log=나구사 수영복]내가…… [wa:1700]미스테리어스한 [wa:1200]미소녀이니까.[/log]"
1014206-115 = "[wa:2081]― [log=나구사 수영복]비치발리볼은 보통 이렇게 사인을 보내는데…….[/log]"
1014206-117 = "― [log=나구사 수영복]지금이라도 [wa:1590]방식을 바꾸는 게 좋을까? [/log]"
1014206-120 = "[wa:2321]― [log=나구사 수영복]……아니야. [wa:1810]지금 바꾸기엔 늦어.[/log]"
1014206-123 = "[wa:691]― [log=나구사 수영복]이대로 가는 거야, [wa:1042]선생님.[/log]"
1014206-125 = "― [log=나구사 수영복]우리라면…… [wa:2490]괜찮아.[/log]"
1014206-128 = "(이후 경기가 시작되었다.)"
1014206-129 = "(승패를 떠나, 매우 즐거운 시간이었다.)"
1014206-138 = "(그렇게 경기가 끝난 뒤…….)"
1014206-140 = "아하핫! 정말 즐거웠어요!"
1014206-141 = "그럼 두 분! 계속 좋은 시간 보내세요~!"
1014206-146 = "조, 좋은 시간 보내라니…… 무슨 의미로 한 이야기일까?"
1014206-147 = "[s5] \"의미 그대로의 이야기가 아닐까?\"\n[s6] \"이렇게 즐거운 시간이 계속됐으면 좋겠다고 말이야.\""
1014206-150 = "……."
1014206-151 = "……응. 그렇네."
1014206-152 = "그동안 정말 많은 일이 있었어."
1014206-153 = "선생님이 없었다면, 내 손은 아직도 어둡고 불길한 황혼에 물들어 있었을 거야."
1014206-154 = "선생님 덕분에……."
1014206-155 = "어떻게 손을 내밀어야 하는지 알게 됐어."
1014206-156 = "어떻게 앞으로 나아가야 할지…… 깨달았어."
1014206-157 = "아직 모든 것이 정상으로 돌아온 건 아니지만……."
1014206-158 = "선생님이 계속 곁에 있어 준다면 걱정이 없을 것 같아."
1014206-159 = "……아."
1014206-160 = "나도 모르게 너무 많은 이야기를 해버렸네."
1014206-165 = "[ns] \"나, 나구사……?\""
1014206-166 = "이렇게 되어버렸으니, 확실히 하자는 의미에서 다시 한번 말할게."
1014206-167 = "부족한 몸이지만……."
1014206-168 = "외모 말고는 장점이 별로 없는 나지만……."
1014206-169 = "계속해서 잘 부탁해. 선생님."
1014206-171 = "(이후 늦은 시간까지 나구사와 해변에서 즐거운 시간을 보냈다.)"
