1014206-139 = ""
1014206-140 = "อะฮะฮ่า! สนุกมากๆ เลยค่ะ!"
1014206-141 = "ขอให้มีช่วงเวลาที่ดีด้วยกันนะคะ ทั้งสองคนเลย~!"
1014206-142 = ""
1014206-144 = ""
1014206-145 = ""
1014206-146 = "ขะ... ขอให้มีช่วงเวลาที่ดีด้วยกันงั้นเหรอ... พูดแบบนั้นความหมายว่าอะไรน่ะ?"
1014206-147 = "[s5] \"ก็น่าจะหมายความตามนั้นเลยนะ?\"\n[s6] \"อยากให้เรามีช่วงเวลาที่สนุกด้วยกันต่อยังไงล่ะ\""
1014206-150 = "..."
1014206-151 = "อื้อ... นั่นสินะ"
1014206-152 = "ที่ผ่านมาเกิดเรื่องราวขึ้นมากมายจริงๆ"
1014206-153 = "ถ้าหากไม่มีคุณครูอยู่ด้วยละก็ มือของฉันคงยังแปดเปื้อนไปด้วยห้วงอัสดงที่มืดมิด และน่ากลัวนั่นแน่ๆ"
1014206-154 = "ต้องขอบคุณคุณครู..."
1014206-155 = "ที่ทำให้ฉันได้เรียนรู้ว่าต้องยื่นมือออกไปยังไง"
1014206-156 = "และตระหนักได้ว่า... ฉันควรจะก้าวต่อไปยังไงในอนาคต"
1014206-157 = "ถึงตอนนี้ทุกอย่างจะยังไม่กลับสู่ภาวะปกติ..."
1014206-158 = "แต่ถ้ามีคุณครูอยู่ข้างกันต่อไปแบบนี้ ฉันคิดว่าฉันคงไม่ต้องกังวลอะไร"
1014206-159 = "อ่า..."
1014206-160 = "ฉันเผลอพูดเรื่องโน้นเรื่องนี้เยอะเกินไปแล้ว"
1014206-161 = ""
1014206-163 = ""
1014206-164 = ""
1014206-165 = "[ns] \"นะ... นางุสะ?\""
1014206-166 = "ในเมื่อเป็นแบบนี้แล้ว ฉันจะขอพูดอีกครั้งเพื่อความชัดเจนนะ"
1014206-167 = "ถึงฉันจะยังมีข้อบกพร่อง..."
1014206-168 = "และไม่มีข้อดีอะไรมากมายนอกจากรูปลักษณ์ภายนอก..."
1014206-169 = "แต่ต่อไปก็รบกวนด้วยนะ คุณครู"
1014206-171 = "(หลังจากนั้นคุณครูกับนางุสะก็สนุกสนานด้วยกันในชายหาดต่อจนเย็น)"
