[translation]
10008045-2 = "하아하아……."
10008045-3 = "후우……."
10008045-4 = "아니아니아니아니……!! 이거 좀 뭔가 이상하지 않아?!"
10008045-5 = "대체 어디서들 튀어나오는 거야?! 왜 기다렸다는 듯이 방해하는 건데?! 싱크대 아래의 '그거'냐고……!"
10008045-6 = "아까부터 진짜 뭐야? 이렇게나 몰려들다니. 혹시 새전함의 비밀 효과? 내가 모르는 사이에 새전함에 꿀이라도 발렸다던가? 그런 거야?"
10008045-7 = "장수풍뎅이 잡기냐고……."
10008045-8 = "[s] \"아무래도 모두 새전함을 노리는 것 같은데.\""
10008045-9 = "하지만 어떻게 새전함이 도난당했다는 걸 다른 문제아 녀석들이 전부 알고 있는 거지?"
10008045-10 = "이래서야 마치 모두가 어디서 뉴스라도 보고 온 듯한……."
10008045-12 = "……뉴스? 앗, 설마?!"
10008045-13 = "응? 왜 그래? 알바 쨩?"
10008045-14 = "있어 봐, 그게……. 마침 행사장에 이번 새해 행사의 홍보 방송을 위해 크로노스 보도국 사람들이 왔었거든……."
10008045-15 = "그걸 고려해본다면 분명……."
10008045-20 = "……역시나잖아!"
10008045-21 = "SNS에 속보가 떠 있어!!"
10008045-25 = "그럼 아디오스! 정의를 위해!"
10008045-30 = "방금 보셨던 영상은 <대길전>의 새해맞이 행사장에서 벌어진, 새전함 강탈 사건의 생생한 모습이었습니다!"
10008045-31 = "흉악한 지명수배범 카이텐져는 현재 새전함을 가지고 도주하고 있습니다! 과연! 새전함의 주인은 누가 될 것인가!"
10008045-32 = "여기서, 다시 한번 <대길전>의 관리인의 인터뷰를 보시겠습니다!"
10008045-34 = "용서할 수 없는 일입니다……!!"
10008045-35 = "그런 흉악범들에게 우리의 1년 치의 수익을……"
10008045-36 = "흠흠! 아니, 사람들의 소원이 담긴 소중한 새전함을 뺏기다니……."
10008045-37 = "이렇게 된 이상, 새해 첫날부터 강도를 당한 우리의 체면만큼은 반드시 되찾겠습니다……!!"
10008045-38 = "저희에게 새전함은 중요하지 않습니다!"
10008045-39 = "카이텐져를 잡을 수만 있다면……"
10008045-40 = "그 새전함의 돈은 잡은 사람에게 모두 드리겠습니다!!"
10008045-45 = "네! 여러분, 보셨습니까? 이것이 새해 첫날부터 벌어지는 숨 막히는 추격전! 추정액 약 8자리의 현금이 걸린 탐욕의 레이스!"
10008045-46 = "새전함의 현금을 사리사욕으로 사용할 수 있는 절호의 기회입니다!"
10008045-47 = "이래도 괜찮을까요? 천벌이 내리거나 하지 않을까요? 뭐, 상관없겠죠!"
10008045-48 = "저희 크로노스 스쿨 보도부는 어디까지나 진실과 사실만을 전할 뿐이니까요!"
10008045-52 = "이 멋진 특종은 우리에게 맡겨줘!"
10008045-53 = "네엣~! 그러니 여러분들도 놓치지 말고 이 욕망의 레이스에 참가하세요!!"
10008045-54 = "새전함의 행방은 과연 어디로 향하는가!"
10008045-55 = "이 두근거리는 뉴스의 다음이 궁금하시다면 크로노스 보도국 채널 구독 부탁드리고요,"
10008045-56 = "좋아요, 알림 설정까지 진실은 언제나 여러분 곁에!"
10008045-59 = "뭐 하는 짓이야!!!"
10008045-60 = "그, 그래서였군……. 그래서 이렇게 방해꾼들이 몰려들고 있는 건가……."
10008045-61 = "아하핫~"
10008045-62 = "그럼 계속해서 방해꾼들이 더 늘어나는 거야? 흐응."
10008045-64 = "헤에…… 뭐, 일이 이상하게 되었지만, 상관없겠지. 저 말대로라면 일당보다 돈을 더 벌 수 있게 된다는 거니까."
10008045-68 = "이렇게 된 이상, 사람들을 불러서 협력을 요청하겠어!"
10008045-72 = "아, 안 돼!!"
10008045-73 = "……응?"
10008045-74 = "뭐야, 아루 쨩? 사람이 많으면 좋은 거 아냐? 설마 돈을 나누기 싫어서 그러는 거야?"
10008045-78 = "새전함은, 원래 있어야 할 곳에 돌려놓는다."
10008045-79 = "새전함의 돈이 단 한 푼이라도 사리사욕으로 쓰이는 걸 용납하지 않겠어!"
10008045-81 = "……?!"
10008045-82 = "뭐?!"
10008045-83 = "어째서? 행사장의 관리인도 허락한 거잖아."
10008045-85 = "후후. 무츠키 실장."
10008045-86 = "우리가 그런 시시하고 한심한 이유로 움직이는 거라면, 우리 흥신소의 입장이 어떻게 되겠어?"
10008045-87 = "멋도 품격도 없는 고작 이런 송사리들과 같은 급이 될 뿐이겠지. 난 그걸 용납할 수 없어."
10008045-88 = "그리고 이런 자잘한 일조차 우리끼리 해결하지 못하고 외부에 도움을 요청한다?"
10008045-89 = "그건 그야말로 언어도단! 용납할 수 없어! 이번 일은 우리 흥신소의 힘으로 해결해야 해……!"
10008045-90 = "이미 결정한 일이야. 번복은 없어."
10008045-95 = "……하아. 뭐, 사장의 결정이라면 따르겠지만."
10008045-96 = "그, 그것이 하드보일드인가요?"
10008045-97 = "이해를 못 하겠어."
10008045-98 = "그래도 뭐, 아루 쨩이 원한다면 할 거지만."
10008045-100 = "……여기서 정론이라니, 꽤 하잖아. 너희 사장."
10008045-101 = "그 정도로 확고한 신념을 가지고 있었을 줄이야…… 역시 얕잡아 볼 수는 없겠는 걸."
10008045-102 = "뭐, 그렇게까지 말한다면 따라주지 못할 것도 없어."
10008045-103 = "나도 내 일당 외의 돈을 챙겨와봤자 다들 좋아해 주지도 않을 거고. 게다가 새해 소원을 빈 새전이라니, 찝찝할 거 같아."
10008045-104 = "모모톡은 보내다 말았고…… 어차피 선배들 전부 신년이라 자고 있을 거니까. 됐어. 우리끼리 해결하는 거야!"
10008045-105 = "[s] \"그럼 카이텐져 추격, 계속 가자!\""
10008045-109 = "그 염원이 이루어지기도 전에 저 새전함에 [ruby=不淨]부정[/ruby]이 묻는다면……."
10008045-111 = "저 새전함에 [ruby=不淨]부정[/ruby]이 묻는다면……"
10008045-113 = "[ruby=不淨]부정[/ruby]이 묻는다면……"
10008045-114 = "(여기서 괜히 사람이 더 달라붙었다간, 새전함에 더욱더 많은 부정이 묻어버릴지도 모르니까……!)"
10008045-115 = "빠, 빨리! 추격이야!!"
