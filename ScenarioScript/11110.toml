[translation]
11110-2 = "제11화;블랙마켓으로 1"
11110-3 = "블랙마켓"
11110-4 = "(와글와글)"
11110-5 = "여기가 블랙 마켓……."
11110-6 = "와아-☆ 사람이 엄청 많은데요?"
11110-7 = "그러게. 작은 시장 정도를 생각했는데 도시 정도 규모일 줄은."
11110-8 = "치외법권이 이렇게 거대하게 생성되어 있는 줄은 몰랐는데."
11110-9 = "으헤~ 우리야 계속 아비도스 구역 내에 있었으니까. #n학교 밖으로는 꽤 이상한 곳이 많다고."
11110-10 = "호시노 선배는 여기 와본 적이 있어?"
11110-11 = "아니. 나도 여기는 처음이야. #n하지만 다른 학교 지역이나 마을에는 신기한 것들이 많다고 들었다고."
11110-12 = "엄~청 큰 수족관도 있대. 아쿠아리움!"
11110-13 = "다음에 가봤으면 좋겠네~ 으헤, 물고기랑 횟감……."
11110-14 = "나도 잘 모르지만 아쿠아리움이라는 건 생각하는 그런 게 아닌 거 같은데……."
11110-15 = "여러분 집중하세요. 거기는 불법 무기와 병기들이 거래되는 곳이라 무슨 일이 있을지 몰라요."
11110-16 = "무슨 일이 있으면 제가…… 우왓?!"
11110-17 = "(타타타타타탕-!)"
11110-19 = "총소리다."
11110-22 = "거기 서라!!"
11110-23 = "으, 으아아! 망했어요, 망했어, 쪼, 쫓아오지 말아 주세요!"
11110-24 = "너 같으면 그러겠냐!!"
11110-28 = "어라…… 저 교복은……."
11110-31 = "엄마야, 거기 비켜주세요~"
11110-34 = "(콰당-)"
11110-35 = "아, 아야야……. 죄, 죄송합니다!"
11110-36 = "괜찮아?"
11110-37 = "아니, 쫓기는걸 보니 그다지 괜찮아 보이진 않네."
11110-38 = "그……. 그게……."
11110-41 = "너희는 뭐야? 저리 비켜! 우리는 그 트리니티 녀석에게 볼일이 있다."
11110-42 = "아, 아우…… 저, 저는 볼일 없는데……."
11110-43 = "……!!"
11110-44 = "맞아요, 저 교복…… #n키보토스의 가장 큰 학교 중 하나인 트리니티 종합학원이에요!"
11110-46 = "그래, 키보토스에서 제일 돈 많은 학교잖아! #n그러니까 납치해서 몸값을 듬뿍 받아낼 수 있겠지?"
11110-47 = "납치 후 협상! 꽤 훌륭한 재테크라구. 크크크큭."
11110-48 = "어때, 너희도 관심있으면 계획에 낄래? 몸값을 나눠 가져도……."
11110-50 = "응?"
11110-53 = "(콰당탕!)"
11110-54 = "끄아아악!"
11110-55 = "악당은 혼나야 해요~☆"
11110-56 = "음."
11110-57 = "아…… 네? 네?"
11110-59 = "고, 고맙습니다. 여러분. #n여러분이 아니었으면 진짜 학원에 폐를 끼칠 뻔했어요……."
11110-60 = "여기도 몰래 나온 건데 문제가 생겼으면…… 아우우…… 생각만해도……."
11110-61 = "이야~ 히후미 쨩이라고 했지? #n그러게 트리니티의 아가씨가 이런 위험한 곳엔 왜 온 거야?"
11110-62 = "아, 아하하…… 그게……. #n사실은 찾고 있는 물건이 있어서……."
11110-63 = "판매가 중단되어서 지금은 구할 수가 없는 물건인데, #n블랙 마켓에서는 암암리에 거래되고 있다는 얘기를 들어서요……."
11110-64 = "그거…… 혹시 전차인가?"
11110-65 = "아니면 불법화기?"
11110-66 = "생화학탄인가요?"
11110-67 = "네?! 아, 아뇨……. 그러니까, 페로로 한정 굿즈예요."
11110-68 = "페로로?"
11110-69 = "한정 굿즈?"
11110-70 = "네! 이거예요. 페로로 님과 아이스크림 프랜차이즈 콜라보로 나온 한정 인형!"
11110-71 = "한정 생산이라 100개 밖에 없는 물건이거든요."
11110-72 = "어때요, 귀엽죠?"
11110-73 = "……."
11110-74 = "우와~☆ 모모프렌즈! 저도 좋아해요! 페로로 쨩 엄청 귀엽죠~ #n저는 Mr. 니콜라이 팬이에요."
11110-75 = "그렇죠? 니콜라이 씨도 철학적이라서 멋있어요."
11110-76 = "최근에 나온 니콜라이 씨의 철학서 <선악의 저편>도 샀어요! 초판본으로요!"
11110-77 = "……이야~ 무슨 말인지 이 아저씨는 전혀 모르겠는데."
11110-78 = "호시노 선배는 이런 팬시한거 전혀 관심없잖아."
11110-79 = "흐음. 요즘 젊은이들이란 어렵단 말이지."
11110-80 = " 그러니까 나이 차이 얼마 안 난다고……."
11110-81 = "그래서 굿즈를 찾으러 왔다가 어쩐지 불량배들에게 걸려서…… #n여러분이 아니었으면 큰일날 뻔 했어요."
11110-82 = "……그런데 아비도스 학교의 여러분들은 여기 무슨 일이신가요?"
11110-83 = "우리도 비슷해. 찾고 있는 게 있거든."
11110-84 = "맞아. 지금은 생산이 중단된 물건이고, 구하기가 힘든 건데, #n그게 여기 있다는 소문을 듣고 찾으러 왔어."
11110-85 = "역시 비슷하나 봐요."
11110-86 = "잠깐만요! 여러분, 주변에서 무장한 사람들이 몰려들고 있어요!"
11110-87 = "뭐야?!"
11110-89 = "저 놈들이다!!"
11110-90 = "감히 우리를 건드려? 혼쭐을 내주마!!"
11110-93 = "방금 해치웠던 불량배 패거리들인가봐요! 완전 적대 모드입니다!"
11110-94 = "바라던 바야."
11110-95 = "정말이지 어딜 가도 불량배들이랑 엮이는 거야? 우리가 뭘 잘못했다고?"
11110-96 = "불평은 나중에 하고…… 대응입니다, 여러분!"
