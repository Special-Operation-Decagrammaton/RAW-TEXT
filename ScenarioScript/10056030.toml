[translation]
10056030-1 = "第3話;自慢の昆布茶"
10056030-2 = "ダイビング部・部室"
10056030-3 = "ほんっとうにすみません……！"
10056030-4 = "先ほどはとんだ失礼を……。"
10056030-5 = "そ、それと昨日は、泳いでいるところを覗き見されているのかと思って……。"
10056030-6 = "本当に申し訳ありません！"
10056030-7 = ""
10056030-9 = ""
10056030-12 = ""
10056030-13 = "急に逃げてごめん……アイランドって言うから、つい。"
10056030-14 = "イワシアイス、おいしかった。"
10056030-15 = "[s] \"誤解されても仕方ない状況だったからね。\""
10056030-16 = ""
10056030-18 = ""
10056030-19 = "[ns1] \"それにしても、二人は元気そうだね。\"\n[ns2] \"全力疾走したから、私はもうクタクタで……。\""
10056030-22 = "そんなに走ってないけどな……。"
10056030-23 = "まあダイビング部だからさ。肺活量はあるほうだし。"
10056030-24 = "サユリは10分以上、息を止めたことある。"
10056030-25 = "[s3] \"10分も！？\"\n[s4] \"すごいね……。\""
10056030-28 = "もっと褒めて良いよ。"
10056030-29 = "サユリは私たちの中で一番フリーダイビングの才能があるんですよ。"
10056030-30 = ""
10056030-32 = ""
10056030-34 = ""
10056030-35 = "先生、これ。お茶飲む？"
10056030-36 = "のどを潤すと少しは落ち着くと思うよ。"
10056030-37 = "[s] \"ありがとう。もらうよ。\""
10056030-38 = ""
10056030-41 = "[ns] \"これは……昆布茶？\""
10056030-42 = "はい。乾燥昆布に熱い湯を注いだものです。"
10056030-43 = "オデュッセイアでは食材のほとんどを海に依存しているので。#n茶葉の代わりに、昆布を。"
10056030-44 = "初めの頃はこの旨味がきつく感じましたが、今では昆布茶なしではいられません。"
10056030-45 = "オデュッセイアの昆布は品質が良いって有名なんだよ。"
10056030-46 = "前にトリニティも昆布茶を買ってくれたみたいだけど……それ以降はさっぱりらしい。#n好みじゃなかったのかな。"
10056030-47 = "昆布茶、おいしいのに……。"
10056030-48 = "[s] \"この昆布は自分たちで採ったの？\""
10056030-49 = "と、とんでもないこと言わないでください！"
10056030-50 = "ダイビング部の漁業活動は原則的に禁じられています。"
10056030-51 = "ただでさえ、密漁しているんじゃないかって嫌味を言われているんですから。"
10056030-52 = "漁業とダイビングは別のくくりなんだよ。お互いの領域は侵さない。"
10056030-53 = "そうそう。潜って何か採るのが目的なら「海女部」にしてたよね。"
10056030-54 = "[s] \"じゃあ普段はどんな活動をしてるの？\""
10056030-55 = "それは――"
10056030-56 = "ダイビング。"
10056030-57 = "フリーダイビング！"
10056030-58 = "いや、フリーダイビングで海底まで行くのはあんただけだよ。"
10056030-59 = "海中でできる、漁業以外の活動を色々と。"
10056030-60 = "落とし物を探したり、海中の撮影とか、海底地図の作成とか……。"
10056030-61 = "海底施設の整備だって、ダイビング部なしじゃできないってこと！"
10056030-62 = "お友達も作れる。サメとか、カメとか。"
10056030-63 = ""
10056030-65 = ""
10056030-66 = "要は、海底で起きた問題を解決し、その対価を得て活動しているんです。"
10056030-67 = "でも……D.U.に停泊してからは、水中での問題はほとんどないので……#n頼られることも減ってしまって……。"
10056030-68 = "最近はファンダイビング――ただ楽しむだけの水中探検ばかりですね……。"
10056030-69 = "[s5] \"部活動には色んな目的があるしさ。\"\n[s6] \"暇だからって悪いわけじゃないと思うけど……。\""
10056030-72 = ""
10056030-75 = "[ns] \"ダイビングの器材はどこで手に入れてるの？\""
10056030-76 = ""
10056030-77 = "えっと、それは……。"
10056030-78 = "つ、通販で……？"
10056030-79 = "[s7] \"こういうのって高いよね？\"\n[s8] \"お金のやりくりが大変じゃない？\""
10056030-82 = "うっ、その……。"
10056030-83 = ""
10056030-85 = ""
10056030-86 = "実は……借金が……少し……。"
10056030-87 = "[s] \"借金！？\""
10056030-88 = "厳密に言えば少し違うんだけどね。"
10056030-89 = "今いくらくらいだっけ。ドライスーツ4着分ぐらい……？"
10056030-90 = "「アクアシール」のシングルコーンを5000個買えるくらい。"
10056030-91 = "だ、大丈夫ですよ？ご心配には及びません！#n海底に眠る宝を見つけられたら、一気に返せますから……！"
10056030-92 = "[s9] \"でも……借金か……。\"\n[s10] \"節約する方法はないの？\""
10056030-95 = "こればっかりは……。"
10056030-96 = "ダイビングにはどうしてもお金がかかるので……。"
10056030-97 = "ケチって安全を疎かにするわけにはいきませんし……。"
10056030-98 = "潜らなければ、私たちには何の価値も……。"
10056030-99 = "前はスポンサーがいたんだけど、急に連絡つかなくなっちゃったんだよね。"
10056030-100 = "全てのチャンネルで通信を試したけど音沙汰なし。"
10056030-101 = "このアビススーツを使い始めてからもう1ヶ月か……。いつまでこの状態なんだろ。"
10056030-102 = "このままだと繋ぎ目が錆びてきちゃうよ……。"
10056030-103 = "良い機会。もっと素潜りの訓練をするのはどう？"
10056030-104 = "サユリ基準で考えないで！？"
10056030-105 = ""
10056030-107 = ""
10056030-108 = "[ns] \"スポンサーか……。\""
10056030-109 = ""
10056030-110 = "[ns11] \"それなら、こういうのはどう？\"\n[ns12] \"私が新しいスポンサーになるよ。\""
10056030-113 = ""
10056030-114 = "先生が……？"
10056030-115 = "ね、狙いはなんですか……。"
10056030-116 = "アイランドが裏で糸引いてたり？"
10056030-117 = "こういう時は大抵、裏がある。"
10056030-118 = "とんでもないお人よしかも～？"
10056030-119 = "[s] \"もちろん、タダじゃないよ。\""
10056030-120 = ""
10056030-122 = ""
10056030-123 = "[ns] \"体で返してもらおうと思って。\""
10056030-124 = "体で返せることと言ったら……。"
10056030-125 = ""
10056030-127 = ""
10056030-128 = "まさか――！？"
