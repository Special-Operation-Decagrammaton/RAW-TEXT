[translation]
10056030-1 = "제3화;건강과 미용을 위한 한 잔의 다시마 차"
10056030-2 = "다이빙부 부실"
10056030-3 = "정말, 죄송합니다……!"
10056030-4 = "좀 전에는 저와 저희 부원들이 실례를……"
10056030-5 = "그, 그리고 어제 뵈었을 때는 분명 수영하는 모습을 엿보는 엿보기범이라고 생각해서……"
10056030-6 = "정말 죄송합니다!"
10056030-13 = "갑자기 도망쳐서 미안…… 아일랜드에서 왔다고 해서 다이빙부에 원한이 있는 사람인 줄 알았어."
10056030-14 = "정어리맛 아이스크림 맛있었지~"
10056030-15 = "[s] \"괜찮아. 충분히 오해할 수 있는 상황이었는 걸.\""
10056030-19 = "[ns1] \"다만 너무 뛰어서 그런지 호흡이 돌아오질 않아……\"\n[ns2] \"……그에 비해 두 사람은 멀쩡해 보이네.\""
10056030-22 = "그렇게 오래 뛴 것 같지는 않은데……"
10056030-23 = "뭐, 일단은 다이빙부니까. 다른 학생들에 비하면 심폐지구력은 좀 더 나은 편이지."
10056030-24 = "사유리는 10분 넘게 숨 참는 것도 해봤어."
10056030-25 = "[s3] \"10분이나?!\"\n[s4] \"상상한 것 이상으로 대단하네……\""
10056030-28 = "후후, 더 칭찬해도 좋아."
10056030-29 = "뭐, 저희 중에서도 사유리는 독보적으로 프리다이빙에 특화된 재능을 갖고 있긴 하지만요."
10056030-35 = "선생님. 차 마실래?"
10056030-36 = "목을 조금 축이면 호흡을 가다듬는 데 도움이 될 거야."
10056030-37 = "[s] \"아, 고마워.\""
10056030-41 = "[ns] \"이건…… 다시마 차인가?\""
10056030-42 = "네. 건조한 다시마를 뜨거운 물에 우려낸 차에요."
10056030-43 = "오디세이아 학원에서는 대부분의 식재료를 해산물에 의존하고 있기 때문에, 차도 찻잎 대신 다시마를 쓰는 경우가 많아서……"
10056030-44 = "처음에는 감칠맛이 조금 거슬리긴 했지만, 이제는 이 다시마 차가 없으면 오히려 심심하게 느껴지라고요."
10056030-45 = "오디세이아의 다시마는 떫은 맛이 거의 없는 상등품으로 유명하니까."
10056030-46 = "차로 유명한 트리니티 학원에서도 한 번 수입해 간 적이 있었다고 들었는데…… 뭔가 취향이 아니었는지 그 이후로는 사간 적이 없다 하더라고."
10056030-47 = "다시마 차, 맛있는데……"
10056030-48 = "[s] \"이 다시마는 다이빙부가 직접 채집 한거야?\""
10056030-49 = "크, 큰일 날 소리 마세요!"
10056030-50 = "다이빙부의 어로 활동은 원칙적으로 금지되어 있으니까요."
10056030-51 = "안 그래도 몰래 물 속에서 채집을 하는 거 아니냐고 다이빙을 할 때마다 싫은 소리를 듣는데……"
10056030-52 = "어로와 다이빙은 확실하게 구분되어 있으니까. 서로의 영역은 침범하지 않아."
10056030-53 = "맞아. 애초에 물질을 하는 게 목적이었다면 동아리 이름을 '해녀부'로 지었겠지."
10056030-54 = "[s] \"그럼 다이빙부는 평소에 어떤 활동을 해?\""
10056030-55 = "그야……"
10056030-56 = "다이빙이지."
10056030-57 = "프리 다이빙!"
10056030-58 = "아니, 프리 다이빙으로 바닥까지 내려가는 사람은 너 밖에 없다니까."
10056030-59 = "부원들이 말한 것처럼 어로 활동을 제외한 잠수 중에 할 수 있는 대부분의 활동을 하고 있어요."
10056030-60 = "희귀한 바다의 풍경을 찍거나, 해저 지도를 그리거나……"
10056030-61 = "물에 빠트린 유실물을 줍거나, 해저 시설물을 정비할 때도 다이빙부를 제외하고선 일을 진행할 수가 없지!"
10056030-62 = "상어나 거북이와도 친구가 될 수도 있어."
10056030-66 = "저희는 보통 평범한 학생들이 내려갈 수 없는 해저에서 발생한 문제를 해결하고, 그 대가로 보수를 받아 활동하고 있는데요."
10056030-67 = "하지만 이번에 선단이 D.U.에 정박한 이후로는 저희가 할 만한 일도 크게 줄었고, 물 속에서 발생하는 문제도 거의 없는지라."
10056030-68 = "요즘은 그냥 펀 다이빙— 재미를 위한 수중 탐험만 계속하고 있는 것 같네요……"
10056030-69 = "[s5] \"동아리 활동에는 여러가지 목적이 있으니까.\"\n[s6] \"일이 없는 게 나쁜 것만은 아니지만……\""
10056030-75 = "[ns] \"다이빙 장비는 보통 어디서 구하고 있어?\""
10056030-77 = "어, 그게……"
10056030-78 = "토, 통신판매로 구입하고 있는데요……?"
10056030-79 = "[s7] \"하지만 이런 장비는 대체로 비싸잖아?\"\n[s8] \"잘 모르겠지만 용돈만으로 구입하긴 어려울 텐데……\""
10056030-82 = "윽, 그게……"
10056030-86 = "사실 빚이, 조금……"
10056030-87 = "[s] \"빚?!\""
10056030-88 = "엄밀히 말해 조금은 아니지."
10056030-89 = "드라이 슈트 네 벌 값 정도는 되려나……?"
10056030-90 = "<아쿠아 씰> 아이스크림 싱글 콘 5000개 정도는 살 수 있는 돈이야."
10056030-91 = "괘, 괜찮아요! 탐사 중에 보물을 인양하기만 하면 한 번에 다 갚을 수 있는 돈이니까요……!"
10056030-92 = "[s9] \"그래도 빚을 지는 건 여러모로 위험해.\"\n[s10] \"비용을 아낄 다른 방법은 없는 거야?\""
10056030-95 = "하, 하지만……"
10056030-96 = "다이빙을 계속하려면 돈이 어쩔 수 없이 드는 걸요……"
10056030-97 = "다이빙 장비는 녹슬지 않게 유지하는 것 만으로도 비용이 많이 들고……"
10056030-98 = "물 속에 들어가지 않으면, 저희에게는 아무런 가치도 없는데……"
10056030-99 = "예전에는 다이버 활동을 지원하는 스폰서도 있었는데, 최근에 갑자기 연락이 끊겨 버려서."
10056030-100 = "갖고 있는 모든 채널로 통신을 시도했지만, 감감무소식이야."
10056030-101 = "아아— 어비스 슈트를 가동한지도 벌써 한 달이 넘었다고. 언제까지 이 상태를 유지해야 하는 거야?"
10056030-102 = "조금만 더 방치하면 슈트의 이음새에 녹이 슬어버릴 거야……"
10056030-103 = "이 기회에 맨 몸으로 잠수하는 훈련을 더 하는 건 어때?"
10056030-104 = "세상 사람들이 다 너처럼 튼튼한 건 아니거든?!"
10056030-108 = "[ns] \"스폰서라……\""
10056030-110 = "[ns11] \"그럼 이건 어때?\"\n[ns12] \"내가 다이빙부의 새로운 스폰서가 되어줄게.\""
10056030-114 = "서, 선생님이 저희의 스폰서가 되어 주신다고요?"
10056030-115 = "여, 역시 수상한데……"
10056030-116 = "너무 형편 좋은 제안이잖아. 아일랜드에서 뭔가 다른 부탁을 한 게 아닐까."
10056030-117 = "대가 없이 호의를 베푸는 데에는 보통 뭔가 꿍꿍이가 있는 법이야."
10056030-118 = "아니면 대책 없는 바보라던가~"
10056030-119 = "[s] \"물론 아무런 대가 없이 해 준다는 건 아니야.\""
10056030-123 = "[ns] \"너희들도 직접 몸으로 할 수 있는 일을 해야지.\""
10056030-124 = "저희가 몸으로 직접 할 수 있는 일이라면……"
10056030-128 = "서, 설마……?!"
