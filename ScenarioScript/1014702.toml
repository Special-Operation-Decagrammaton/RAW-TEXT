[translation]
1014702-1 = "皐月的安全對策"
1014702-2 = "（接到皐月的聯絡後沒多久……）"
1014702-3 = ""
1014702-6 = ""
1014702-7 = "老師～"
1014702-8 = "[s] 「你好，皐月。」"
1014702-9 = "呵呵，幸好你還沒下海。"
1014702-10 = "老師應該也知道，海邊潛藏著許多危險。"
1014702-11 = "只要一個不小心，就可能造成無法挽回的後果……"
1014702-12 = "在這種情況下沒有貿然下水，而是先觀察狀況……真是明智的判斷。"
1014702-13 = "[s] 「沒有，我只是剛到而已……」"
1014702-14 = "哼嗯，總之……"
1014702-15 = ""
1014702-17 = ""
1014702-18 = "老師，你現在的狀態非常危險。這樣下去可不行。"
1014702-19 = "來，快過來這裡。"
1014702-21 = "（被皐月帶到了遮陽傘附近）"
1014702-23 = "來，快躺到這張墊子上。"
1014702-24 = "很好，很好。躺正……對，就是這樣。"
1014702-25 = "呵呵，接下來我要進行能大幅提升老師生存率的處置。"
1014702-26 = ""
1014702-28 = ""
1014702-29 = ""
1014702-30 = ""
1014702-31 = ""
1014702-32 = "[ns1] 「這是……」\n[ns2] 「防曬乳？」"
1014702-35 = "呵呵，答對了。"
1014702-36 = "老師應該也知道，海邊的紫外線比平常強得多，對皮膚的傷害非常大。"
1014702-37 = ""
1014702-39 = ""
1014702-40 = "尤其現在這個時段更危險。#n為了防止曬傷和皮膚老化，防曬乳是必需品。"
1014702-41 = ""
1014702-43 = ""
1014702-44 = "開心吧，老師。#n現在幫你擦的防曬乳，可是萬魔殿訂製的特製品哦。"
1014702-45 = ""
1014702-47 = ""
1014702-48 = "只要擦了這個，就能隔絕大部分的紫外線了。"
1014702-49 = "[s3] 「謝謝你，皐月。」\n[s4] 「不過是不是擦太多了？」"
1014702-52 = ""
1014702-54 = ""
1014702-55 = "越多越好，我再幫你多擦一罐。"
1014702-56 = "[s] 「嗯……」"
1014702-58 = "（皐月就這樣擦完了整整兩罐防曬乳）"
1014702-60 = "好，完美。亮得簡直不只能抵擋紫外線，連可見光都能反射了。"
1014702-61 = "很好很好，現在去盡情地玩吧，老師。"
1014702-62 = "我會幫你設好計時器的。"
1014702-63 = "[s] 「計時器？」"
1014702-64 = "玩水過度會消耗體力。#n除了會提高發生意外的機率之外，也可能造成體溫下降。"
1014702-65 = "呵呵，不過別擔心。我會像這樣設好時間，好好盯著你的。"
1014702-66 = "根據萬魔殿情報部的調查，玩水25分鐘後休息10分鐘，對體力的負擔最小。"
1014702-67 = "老師快去盡情玩水吧。"
1014702-69 = "（雖然本來沒打算玩水，還是被皐月推了出去……）"
1014702-73 = "（不過玩著玩著就興奮了起來，還是玩得很開心）"
1014702-74 = "老師，25分鐘到了。快回來～"
1014702-75 = "[ns] 「啊，我玩得正開心耶～！」"
1014702-78 = "呵呵，看得出來。不過老師的健康可是比什麼都重要哦？"
1014702-79 = "萬一因為玩過頭搞壞身體，那就得不償失了。"
1014702-80 = "來，坐在這裡把這瓶飲料喝了。"
1014702-81 = "[s5] 「總覺得被伺候得好周到。」\n[s6] 「謝謝你這麼照顧我，皐月。」"
1014702-84 = "因為老師是我們萬魔殿最優先要確保的人才。"
1014702-85 = "從保護管理的角度來看，這點成本是理所當然的。"
1014702-86 = ""
1014702-88 = ""
1014702-89 = "對了，老師。能請你也幫我擦防曬乳嗎？"
1014702-90 = "因為海水和沙子會反射的關係，就算待在遮陽傘下也會接觸到紫外線。"
1014702-91 = "我自己擦的話，手碰不到背。"
1014702-92 = ""
1014702-94 = ""
1014702-97 = "[ns] 「這……」"
1014702-98 = "來，快點。"
1014702-99 = "[s] 「好，好吧……」"
1014702-106 = "唔呵呵～"
1014702-107 = "老師的手摸起來有點粗粗的，卻又很溫柔呢。"
1014702-108 = "啊，綁帶可以解開哦。不然沒辦法全部擦到……"
1014702-110 = "（幫皐月擦完防曬乳後，和他一起躺在遮陽傘下看海）"
