[translation]
1014702-1 = "サツキの安全対策 "
1014702-2 = "（サツキから連絡を受けた後……しばらくして）"
1014702-7 = "待たせたわね、先生。"
1014702-8 = "[s] \"こんにちは、サツキ。\""
1014702-9 = "よかった。まだ海には入っていないみたいね。"
1014702-10 = "先生も知っているでしょうけど、海には危険がたくさん潜んでいるの。"
1014702-11 = "一歩間違えると、取り返しのつかない事態になりかねない……。"
1014702-12 = "でも、流石先生ね。#nすぐ海に入らず、冷静に状況を観察しているだなんて。"
1014702-13 = "[s] \"実は、今来たばかりなんだ。\""
1014702-14 = "ふぅん、そうなのね――"
1014702-18 = "先生は今、とても危険な状態よ。早く何とかしないと。"
1014702-19 = "ほら、こっちに来て。"
1014702-21 = "（サツキに導かれ、パラソルの方へ歩いて行った）"
1014702-23 = "さあ、このマットに寝そべって。"
1014702-24 = "いいわよ。ええ、そのまま……。"
1014702-25 = "ふふっ、これから先生の生存率を大きく上げる処置を行うわ。"
1014702-32 = "[ns1] \"これは――\"\n[ns2] \"日焼け止め？\""
1014702-35 = "ええ、そうよ。"
1014702-36 = "海辺では砂浜や海面からの照り返しがあるから、#n普段より多く紫外線にさらされるの。"
1014702-40 = "紫外線は肌へのダメージが大きいのよ。しっかり対策しないと。#n特に今みたいな日差しが強いときはなおさらよ。"
1014702-44 = "それに、これは万魔殿の特注品……。"
1014702-48 = "これさえ塗っておけば、たいていの紫外線は防げるわ。"
1014702-49 = "[s3] \"ありがとう、サツキ。\"\n[s4] \"でも、ちょっと塗り過ぎな気が……。\""
1014702-55 = "多ければ多いほど効果があるのよ。#nもう一本塗ってあげる。"
1014702-56 = "[s] \"あ、ありがとう……。\""
1014702-58 = "（サツキは丸々2本分の日焼け止めを塗ってくれた）"
1014702-60 = "これでよし、と。ふふっ、かなりしっかり塗れたわね。#n輝いているわよ、先生。"
1014702-61 = "今のうちに思いっきり遊んできていいわよ。"
1014702-62 = "タイマーかけておくわね。"
1014702-63 = "[s] \"タイマー？\""
1014702-64 = "長時間の水遊びは危ないのよ？#n体温も下がっちゃうし、事故の確率も上がってくるわ。"
1014702-65 = "でも安心して。私がしっかりモニタリングしているから。"
1014702-66 = "万魔殿情報部の調査によると……。#n水遊びは25分、休憩10分が理想的なサイクルみたいよ。"
1014702-67 = "時間になったら声をかけるから、先生は心置きなく遊んできて頂戴。"
1014702-69 = "（泳ぐつもりはなかったけど、サツキに押し出されるように海へ入る……）"
1014702-73 = "（遊んでいるうちに楽しくなってきて、思いのほか満喫した）"
1014702-74 = "先生、25分経ったわよ～#n早く戻って頂戴。"
1014702-75 = "[ns] \"え～、今いいところだったのに～！\""
1014702-78 = "うふふ、楽しんでいる最中にごめんなさいね。#nでも、先生の健康は最優先事項だもの。"
1014702-79 = "無理をして体調を崩したら、元も子もないでしょう？"
1014702-80 = "さあ、座って。水分補給をしましょう。"
1014702-81 = "[s5] \"至れり尽くせりだね。\"\n[s6] \"色々と気にかけてくれて、ありがとうサツキ。\""
1014702-84 = "先生は万魔殿が最優先で確保すべき人材だもの。"
1014702-85 = "このくらい当然よ。"
1014702-89 = "ああ、そうだ……今度は私に日焼け止めを塗ってくれる？"
1014702-90 = "パラソルの下でも、紫外線って入ってくるのよね。#n砂も海も反射しちゃうから……。"
1014702-91 = "自分で塗れるところは塗ったけど……背中は届かなくて。"
1014702-97 = "[ns] \"えっと……。\""
1014702-98 = "ほら、お願い。"
1014702-99 = "[s] \"わ、分かった。\""
1014702-106 = "うふふっ♪"
1014702-107 = "先生の手、ちょっとザラザラしているのね。#n……でも、悪くないわ。"
1014702-108 = "あ、紐は外して頂戴。そうじゃないと塗れてない場所ができちゃうでしょう？"
1014702-110 = "（日焼け止めを塗り終えたあと、サツキと一緒にパラソルの下で海を眺めた）"
