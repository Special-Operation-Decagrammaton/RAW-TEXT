[translation]
1014702-1 = "Satsuki's Safety Plan "
1014702-2 = "Not long after getting Satsuki's message..."
1014702-3 = ""
1014702-6 = ""
1014702-7 = "Sensei!"
1014702-8 = "[s] \"Hi, Satsuki.\""
1014702-9 = "Fufu. What a relief. You haven't entered the waters yet."
1014702-10 = "As you likely know, Sensei, there are many dangers lurking around the beach."
1014702-11 = "Just one mistake can lead to irreversible consequences..."
1014702-12 = "In such a situation, it's a sound decision to first observe your surroundings, instead of hastily entering the water."
1014702-13 = "[s] \"No, I just arrived...\""
1014702-14 = "Hm, for now..."
1014702-15 = ""
1014702-17 = ""
1014702-18 = "Oh no. Sensei, you are not properly prepared for the coming danger."
1014702-19 = "Hurry, this way."
1014702-21 = "Satsuki led me to the parasol."
1014702-23 = "Lie down on the mat, please."
1014702-24 = "Excellent, yes, down. Just like that."
1014702-25 = "Fufu, I will now implement measures to drastically increase your chances of survival."
1014702-26 = ""
1014702-28 = ""
1014702-29 = ""
1014702-30 = ""
1014702-31 = ""
1014702-32 = "[ns1] \"This is...\"\n[ns2] \"Sunscreen?\""
1014702-35 = "Fufu. You are correct."
1014702-36 = "Sensei must already know, but you are much more exposed to UV rays at the beach, posing a great danger to your skin."
1014702-37 = ""
1014702-39 = ""
1014702-40 = "It's especially dangerous around this time. Sunscreen is a must to prevent sunburn and skin aging."
1014702-41 = ""
1014702-43 = ""
1014702-44 = "Be happy, Sensei. The sunscreen I am applying to you right now is a special formula, custom-made by the Pandemonium Society."
1014702-45 = ""
1014702-47 = ""
1014702-48 = "With this, UV rays are essentially a problem of yesterday."
1014702-49 = "[s3] \"Thank you, Satsuki.\"\n[s4] \"But aren't you putting on too much?\""
1014702-52 = ""
1014702-54 = ""
1014702-55 = "The more the better. I will have to use one more bottle after this."
1014702-56 = "[s] \"Okay...\""
1014702-58 = "So Satsuki put two whole bottles of sunscreen on me."
1014702-60 = "Perfect. It's a glare that could reflect even visible light, never mind block UV rays."
1014702-61 = "Now, then. Go have a blast, Sensei."
1014702-62 = "I will set the timer."
1014702-63 = "[s] \"Timer?\""
1014702-64 = "Playing in water decreases your stamina more rapidly, increasing the chance of accidents and sickness."
1014702-65 = "Fufu, sounds terrifying, doesn't it? However, I will keep a close eye on the timer."
1014702-66 = "According to the studies by Pandemonium Society's Intelligence Committee, twenty-five minutes of playing in water and ten minutes of resting puts the least strain on your stamina."
1014702-67 = "Sensei, go ahead and enjoy playing in the water for the next twenty-five minutes."
1014702-69 = "I hadn't originally planned on even going in the water, but I listened to Satsuki's orders."
1014702-73 = "I ended up having a great time in the ocean."
1014702-74 = "Sensei, it's been twenty-five minutes. Time to return!"
1014702-75 = "[ns] \"Ah, it was just getting fun!\""
1014702-78 = "Fufu, it seemed like it. But your well-being takes precedence over everything."
1014702-79 = "It would be a devastating blow to Gehenna if you compromised your physical condition."
1014702-80 = "Now, sit here and sip on this drink."
1014702-81 = "[s5] \"This feels like a real treat.\"\n[s6] \"Thank you for taking care of me, Satsuki.\""
1014702-84 = "Sensei is someone we, the Pandemonium Society, absolutely must secure."
1014702-85 = "From a protection and management standpoint, this much is only natural."
1014702-86 = ""
1014702-88 = ""
1014702-89 = "Ah, Sensei. Could you apply sunscreen on me as well?"
1014702-90 = "Even under the parasol, the reflection of the water and sand can still expose you to UV rays."
1014702-91 = "And I am unable to reach my back myself."
1014702-92 = ""
1014702-94 = ""
1014702-97 = "[ns] \"Oh...\""
1014702-98 = "Go on."
1014702-99 = "[s] \"U-Understood...\""
1014702-106 = "Heehee..."
1014702-107 = "Sensei's hands are somewhat rough, but also soft."
1014702-108 = "Please feel free to untie the laces, so you don't miss any spots."
1014702-110 = "I dutifully applied Satsuki's sunscreen, then lay back under the parasol with her to watch the waves."
