[translation]
1014702-1 = "มาตรการความปลอดภัยของซัตสึกิ"
1014702-2 = "(ไม่นานหลังจากคุณครูได้รับการติดต่อจากซัตสึกิ...)"
1014702-3 = ""
1014702-6 = ""
1014702-7 = "ครู~"
1014702-8 = "[s] \"สวัสดี ซัตสึกิ\""
1014702-9 = "ฮุฮุ ค่อยยังชั่วนะที่ยังไม่ได้ลงไปในทะเล"
1014702-10 = "ครูก็คงรู้อยู่แล้วว่าที่ชายหาดมีปัจจัยเสี่ยงมากมายซ่อนอยู่"
1014702-11 = "ถ้าพลาดพลั้งไปนิดเดียว ก็อาจนำไปสู่ผลลัพธ์ที่ไม่อาจย้อนคืนได้..."
1014702-12 = "ในสถานการณ์แบบนั้น การเฝ้าดูสถานการณ์ก่อนและไม่ลงน้ำอย่างผลีผลามคือการตัดสินใจที่#nยอดเยี่ยมเลยละ"
1014702-13 = "[s] \"เอ่อ ครูแค่เพิ่งมาถึงเฉยๆ...\""
1014702-14 = "ฮึ่ม ก่อนอื่น..."
1014702-15 = ""
1014702-17 = ""
1014702-18 = "ครู ตอนนี้ครูอยู่ในสภาพที่อันตรายมากเลยนะ ปล่อยไว้แบบนี้ไม่ได้"
1014702-19 = "เอาละ รีบมาทางนี้เร็วเข้า"
1014702-21 = "(ซัตสึกิพาคุณครูไปทางร่มชายหาด)"
1014702-23 = "เอ้า รีบนอนลงบนเสื่อนี่สิ"
1014702-24 = "ดีมากๆ นอนดีๆ... ใช่แล้ว แบบนั้นละ"
1014702-25 = "ฮุฮุ จากนี้ไปฉันจะเริ่มมาตรการเพื่อเพิ่มอัตราการรอดชีวิตของครูให้สูงขึ้นอย่างมากละนะ"
1014702-26 = ""
1014702-28 = ""
1014702-29 = ""
1014702-30 = ""
1014702-31 = ""
1014702-32 = "[ns1] \"นี่มัน...\"\n[ns2] \"ครีมกันแดด?\""
1014702-35 = "ฮุฮุ ใช่แล้วละ"
1014702-36 = "ครูก็คงรู้อยู่แล้ว แต่ที่ริมชายหาดน่ะ ร่างกายเราจะสัมผัสรังสียูวีมากๆ จนกลายเป็นภัยใหญ่หลวงต่อผิว"
1014702-37 = ""
1014702-39 = ""
1014702-40 = "โดยเฉพาะช่วงเวลานี้ยิ่งอันตรายเข้าไปใหญ่ เพื่อป้องกันผิวไม่ให้ถูกแดดเผาและผิวแก่ก่อนวัย#nครีมกันแดดที่กันรังสียูวีได้ดีจึงเป็นสิ่งจำเป็น"
1014702-41 = ""
1014702-43 = ""
1014702-44 = "ดีใจได้เลย ครู เพราะครีมกันแดดที่ฉันกำลังทาให้ครูอยู่นี้ เป็นผลิตภัณฑ์ที่แพนเดโมเนียม โซไซตี้สั่งทำ#nเป็นพิเศษเชียวนะ"
1014702-45 = ""
1014702-47 = ""
1014702-48 = "ถ้าทานี่แล้ว รังสียูวีทั่วไปก็สะท้อนกลับได้หมดเลย"
1014702-49 = "[s3] \"ขอบใจนะ ซัตสึกิ แต่ทาเยอะไปหรือเปล่า?\"\n[s4] \"ทาให้ครูเยอะเกินไปแล้วหรือเปล่า?\""
1014702-52 = ""
1014702-54 = ""
1014702-55 = "ยิ่งเยอะยิ่งดี เดี๋ยวฉันทาให้อีกหลอดนะ"
1014702-56 = "[s] \"อืม...\""
1014702-58 = "(แล้วซัตสึกิก็ทาครีมกันแดดให้จนหมดทั้งสองหลอด)"
1014702-60 = "ดีมาก สมบูรณ์แบบเลย เปล่งประกายจนดูเหมือนไม่ใช่แค่ต้านรังสียูวีได้#nแต่สะท้อนได้แม้กระทั่งรังสีที่ตามองเห็นเลย"
1014702-61 = "เอาละ ทีนี้ก็ไปเล่นให้สนุกได้แล้ว ครู"
1014702-62 = "ฉันจะจับเวลาไว้ให้เอง"
1014702-63 = "[s] \"จับเวลาเหรอ?\""
1014702-64 = "ก็การเล่นน้ำมากเกินไปมันจะทำให้พละกำลังลดลง เพิ่มโอกาสเกิดอุบัติเหตุ และยังอาจทำให้อุณหภูมิร่างกายลดต่ำลงด้วยน่ะ"
1014702-65 = "ฮุฮุ แต่ไม่ต้องห่วงหรอก ฉันจะตั้งเวลาไว้แบบนี้แล้วก็จะตั้งใจคอยเฝ้าดูเลย"
1014702-66 = "จากการสำรวจของฝ่ายข่าวกรองแพนเดโมเนียม โซไซตี้ การเล่นน้ำประมาณ 25 นาที#nแล้วพักสัก 10 นาที จะช่วยถนอมแรงได้ดีที่สุดน่ะ"
1014702-67 = "ครูรีบไปเล่นน้ำให้เต็มที่ได้เลยนะ"
1014702-69 = "(คุณครูไม่ได้คิดจะเล่นน้ำเป็นพิเศษ แต่ก็ถูกซัตสึกิผลักให้ไปเล่นน้ำ...)"
1014702-73 = "(แต่พอเล่นไปเล่นมาก็สนุกขึ้นมา จนได้ใช้เวลาอย่างเพลิดเพลิน)"
1014702-74 = "ครู ครบ 25 นาทีแล้ว รีบกลับมาเร็ว~"
1014702-75 = "[ns] \"อ่า กำลังสนุกอยู่เลย~!\""
1014702-78 = "ฮุฮุ ก็ดูออกอยู่หรอก แต่สุขภาพของครูสำคัญกว่าสิ่งใดนะ"
1014702-79 = "ถ้าเผลอเล่นมากเกินไปจนร่างกายไม่ไหวขึ้นมา คงเป็นเรื่องใหญ่เลยนะ"
1014702-80 = "เอาละ ทีนี้ก็นั่งตรงนี้ แล้วดื่มเครื่องดื่มนี่นะ"
1014702-81 = "[s5] \"รู้สึกเหมือนได้รับการปรนนิบัติอย่างดีเลยนะ\"\n[s6] \"ขอบใจที่คอยดูแลครูนะ ซัตสึกิ\""
1014702-84 = "ก็ครูคือบุคลากรที่แพนเดโมเนียม โซไซตี้ของเราต้องคว้าตัวไว้ให้ได้เป็นอันดับแรกนี่นา"
1014702-85 = "ในเรื่องของการดูแลแล้ว ต้นทุนระดับนี้ถือเป็นเรื่องธรรมดา"
1014702-86 = ""
1014702-88 = ""
1014702-89 = "อ๊ะ ครู ช่วยทาครีมกันแดดให้ฉันบ้างได้มั้ย?"
1014702-90 = "ที่หาดทรายน่ะ ต่อให้อยู่ใต้ร่มชายหาด ก็ยังโดนรังสียูวีจากการสะท้อนของทะเลและทรายได้อยู่ดีนะ"
1014702-91 = "ฉันจะทาเองคนเดียวก็ยากน่ะ ก็เอื้อมมือไม่ถึงตรงหลังนี่นา"
1014702-92 = ""
1014702-94 = ""
1014702-97 = "[ns] \"อ่า...\""
1014702-98 = "มาเถอะ เร็วเข้า"
1014702-99 = "[s] \"กะ... ก็ได้...\""
1014702-106 = "ฮืม~"
1014702-107 = "มือของครูให้ความรู้สึกหยาบๆ นิดหน่อย แต่ก็นุ่มดีนะ"
1014702-108 = "อ๊ะ แก้สายออกได้เลยนะ จะได้ทาให้ทั่วทั้งตัว..."
1014702-110 = "(หลังจากทาครีมกันแดดให้เสร็จ คุณครูก็นอนชมวิวทะเลใต้ร่มชายหาดกับซัตสึกิ)"
