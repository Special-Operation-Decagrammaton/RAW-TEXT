[translation]
1006503-1 = "부장님보다 더 부장님다운 카호 님"
1006503-2 = "(그리하여 오늘은 카호의 요청에 따라 음양부의 부실을 방문하게 되었다.)"
1006503-8 = "[ns] \"안녕. 나 왔어. 카호.\""
1006503-12 = "아, 선생님. 오늘 시간을 내주셔서 감사합니다."
1006503-13 = "[s] \"혹시 지금 업무로 바쁜 거야? 타이밍이 나빴으려나?\""
1006503-14 = "앗, 괜찮습니다. 오늘은 원래 음양부의 업무일도 아니고."
1006503-15 = "지금은 단순히 업무 자료를 정리하고 있었을 뿐이니까요."
1006503-20 = "……후우."
1006503-21 = "네. 정리는 이것으로 마무리랍니다. 가실까요?"
1006503-22 = "[s] \"아, 응.\""
1006503-25 = "[ns] \"그래서 카호, 에스코트라니 무슨 뜻이야?\""
1006503-26 = "네, 저번에 선생님을 찾아뵈었을 때는 미처 제대로 알아보지도 못한 채, 막무가내로 밀어붙이기만 하는 태도를 보여드렸었지요."
1006503-27 = "그건 지금 다시 생각해 보더라도, 그…… 무척이나……."
1006503-28 = "무척이나…… 그……."
1006503-29 = "부끄러운 실수였다고 생각한답니다."
1006503-30 = "[s] \"아니, 뭐, 실수라고 할 것까지야…….\""
1006503-31 = "아뇨. 분명한 실수입니다."
1006503-32 = "때문에 부실로 돌아와 곰곰이 생각하다 보니 문득 이런 생각이 들었답니다."
1006503-33 = "협업을 말하기에 앞서, 먼저 선생님께 백귀야행이 어떠한 곳인지. 어떠한 매력을 가졌기에, 알리고 싶어 하는지."
1006503-34 = "우선해서 그런 부분들을 소개해 드려야 했던 게 아닐까. 라고 말이지요."
1006503-35 = "[s] \"백귀야행의 소개를……?\""
1006503-36 = "네."
1006503-37 = "물론 선생님께선 그간 백귀야행 학원의 학생들을 도와주시거나, 학원 곳곳에 산재한 문제들을 함께 해결해 주셨던 만큼."
1006503-38 = "충분히 익숙하고 여러모로 알고 계신 부분도 많다고는 생각합니다만."
1006503-39 = "그것과 이것은 별개."
1006503-40 = "백귀야행의 학생으로서 아직 선생님께 정식으로 학원을 안내해드린 적은 없다는 걸 깨달았답니다."
1006503-41 = "그러니 이대로 가만히 있을 수 없다. 선생님을 직접 에스코트하며 백귀야행을 소개해 드릴 필요가 있다는 결론에 다다랐지요."
1006503-42 = "[s] \"아, 과연…… 그런 의미에서의 에스코트였구나.\""
1006503-44 = "[ns] \"신경 써줘서 고마워. 카호.\""
1006503-48 = "아……"
1006503-49 = "아, 아니요. 이건 응당, 전략홍보팀장으로서 짜낸 계책……이라고 할지."
1006503-50 = "꿍꿍이……라고 할지."
1006503-51 = "어디까지나 선생님께 음양부로서 좋은 인상을 심어주기 위한 계책……의 일환, 이랄지……"
1006503-52 = "[s] \"속마음이 줄줄이 새고 있어.\""
1006503-56 = "흠흠. 아, 아닙니다."
1006503-60 = "이러고 있을 게 아니라, 선생님. 준비가 되는 대로……."
1006503-65 = "[ns] \"손님?\""
1006503-66 = "네…… 하지만, 오늘은 업무일이 아닌 만큼 방문자가 있을 리는 없습니다만."
1006503-67 = "네, 들어오세요."
1006503-73 = "카, 카호 님! 도, 도와주세요! 문제가……!"
1006503-74 = "아…… 하지만 오늘은 음양부의 업무일이 아니라……."
1006503-75 = "죄, 죄송합니다. 하지만 그 부분을 어떻게든……."
1006503-79 = "……네, 교우분의 부탁이라면."
1006503-80 = "죄송합니다. 선생님. 잠시 이 업무만 처리해도 괜찮을까요?"
1006503-81 = "[s] \"응, 기다리고 있을게.\""
1006503-82 = "네. 그럼……."
1006503-85 = "(그리하여 예정에 없던 업무를 시작한 카호였지만……)"
1006503-86 = "(그렇게 급작스럽게 시작된 업무 처리는 아주 당연하게도…….)"
1006503-89 = "카호 님!"
1006503-90 = "부탁드려요! 여기, 음양부의 확인이 필요한 일이……!"
1006503-91 = "부부장님! 저희 부실의 소유권과 관련해! 클레임이 들어온 것 때문에 음양부의 확인이 필요해서……!"
1006503-92 = "어, 어째서 오늘따라…… 이런 일이……?!"
1006503-93 = "[s] \"음음. 일이라는 건 원래 다 그런 법이지.\""
1006503-94 = "네, 네에……? 선생님……?"
1006503-96 = "(한 가지 해결했다고 생각한 순간, 또다시 밀려드는 다른 업무.)"
1006503-97 = "(그것을 돌파했다고 생각한 순간, 그 이상으로 덮쳐드는 업무의 파도 속에서)"
1006503-98 = "(그렇게 카호는 끊임없이 밀려드는 파도를 필사의 노력으로 헤쳐 나갔다.)"
1006503-101 = "네, 이 서류를 전달하면, 저쪽에서도 아무런 이의를 제기할 수 없을 테지요."
1006503-103 = "가, 감사합니다! 역시 카호 님이세요!"
1006503-104 = "카호 님이 계시지 않았다면…… 저희는……!"
1006503-105 = "분명 아무것도 해보지도 못한 채 부실을 빼앗겼을 거예요!"
1006503-106 = "정말 이 은혜를 어찌 갚아야 할지……!"
1006503-107 = "그런 거라면 괜찮습니다. 여러분. 오히려 앞으로도 이런 일이 있다면 언제나 저희 음양부를 찾아주시기 바랍니다."
1006503-108 = "교우분들을 지원하는 것. 그것이 저희 음양부의 역할이니까요!"
1006503-109 = "네!"
1006503-114 = "(그렇게 한 차례의 파도가 몰아치고 나서, 잠시 여유가 생겼을 즈음이었다.)"
1006503-117 = "[ns] \"……카호는 굉장하네.\""
1006503-118 = "네?"
1006503-119 = "[s1] \"아니, 그렇게 일이 끊임없이 밀려들어도…….\"\n[s2] \"전혀 피곤한 기색 없이 해결하는 게 또 대단하다 싶어서.\""
1006503-122 = "아뇨, 이런 건 아무것도 아니랍니다."
1006503-123 = "원래부터 음양부가 해야 할 일을 하는 것뿐이니까요."
1006503-124 = "[s] \"하지만 듣기로 음양부는 원래 학생회 같은 게 아니라고 했었지?\""
1006503-125 = "아, 네. 그 이야기라면……"
1006503-126 = "말씀하신 대로 음양부는 학생회가 아닙니다."
1006503-127 = "때문에 타 학교에서 학생회라면 응당 가지고 있을 권리나, 문제 해결에 필요한 힘도 가지고 있지 않지요."
1006503-128 = "……보다 정확히 말하자면 <가질 수 없다.> 쪽에 가깝습니다만."
1006503-129 = "[s] \"……?\""
1006503-130 = "문제가 발생하더라도 저희 음양부에게 가능한 것은 사건의 해결이 아닌 중재와 조정, 그리고 조율 정도뿐."
1006503-131 = "필시 그 방법으로는 모든 문제를 깔끔하게 해결할 수 없고…… 한계도 명확하겠지만."
1006503-132 = "그럼에도 저희는 최선을 다할 뿐입니다."
1006503-133 = "그것만이 스스로 해결할 수 없는 문제에 대해 고민하고 고민한 끝에……"
1006503-134 = "어렵사리 음양부의 문을 두드리는 교우들을 위해, 저희가 할 수 있는 유일한 방법……"
1006503-135 = "그게 바로 음양부의 역할이자 의무이니까요."
1006503-136 = "[s] \"그렇구나……. 역시 굉장해.\""
1006503-137 = "네? 아, 아뇨…… 굉장하다는 칭찬을 들을 정도까지는……."
1006503-138 = "이 정도 돕는 일쯤이야. 과거, 백귀야행 학원의 연합이 흔들리던 시절에 비하면……."
1006503-139 = "네! 카호 님은 굉장해요!"
1006503-140 = "네, 네엣?"
1006503-141 = "카호 님이 계시기 때문에 어지간한 문제는 한 번에 짠! 하고 해결되고 있으니까요!"
1006503-142 = "요즘 백귀야행에서 싸움이 줄어든 것도 전부 카호 님이 음양부의 부부장님이 된 뒤로 바뀐 거예요!!"
1006503-143 = "아뇨…… 그런 건 저만의 공이 아니라, 모두가 노력해 준 덕분이라고 할까……."
1006503-144 = "애당초 전 음양부의 부장도 아니고……."
1006503-145 = "그렇다면 더 대단한 거죠!"
1006503-146 = "부장님보다 더 부장님다운 카호 님!"
1006503-147 = "그, 그런…… 곤란한 말씀들을……."
1006503-149 = "(계속해서 밀려드는 업무를 간신히 끝내고 나니, 어느덧 시간은 저녁을 지나가게 되었다.)"
1006503-152 = "[ns] \"후우…… 찾아온 학생들도 모두 돌아갔고. 어떻게든 끝냈네.\""
1006503-153 = "네, 그렇긴 합니다만……."
1006503-157 = "벌써…… 시간이 이렇게……."
1006503-158 = "…………."
1006503-159 = "으읏…… 죄송합니다. 선생님."
1006503-160 = "[s] \"으응? 카호?\""
1006503-161 = "모처럼…… 오늘 선생님을 에스코트 해드리기 위해……"
1006503-162 = "백귀야행의 멋진 모습을 소개하고 싶어, 이렇게 방문을 요청드렸는데……."
1006503-163 = "또 이런 식으로…… 또다시 시간을 낭비하시게 만들다니……."
1006503-164 = "이래서야…… 결국……."
1006503-165 = "[s] \"음양부의 좋은 인상을 주려던 작전은 실패라고?\""
1006503-169 = "네? 아, 그……."
1006503-170 = "[s] \"그거라면 오히려 엄청난 성공이라고 생각하는데.\""
1006503-171 = "……네?"
1006503-172 = "[s3] \"이런 시간이 되기까지 일을 계속한 건 결국…….\"\n[s4] \"도움을 요청해 온 학생들을 못 본 척할 수 없어서 그랬던 거잖아?\""
1006503-175 = "하지만 그렇다고 해서…… 아무리 좋은 일을 위해서였다고 한들……."
1006503-176 = "선생님께 폐를 끼친 게 없던 일이 되지는 않습니다."
1006503-177 = "설사 선생님이 신경 쓰지 않으신다고 해도……."
1006503-178 = "이건……. 분명 제 실수가 맞습니다. 죄송합니다. [USERNAME] 선생님."
1006503-179 = "[ns] \"카호는 자신에게 엄격하구나…….\""
1006503-181 = "[ns] \"좋아, 그럼 이번엔 빚을 진 걸로 하자.\""
1006503-182 = "빚, 말인가요……?"
1006503-183 = "없던 일로 하는 게 아니라…… 이번 일을 빚으로 달아두고…… 다음 에스코트를 더욱 완벽하게…… 한다?"
1006503-184 = "……정말 그런 걸로 괜찮으신 건가요?"
1006503-185 = "[s] \"응. 그거면 충분해.\""
1006503-189 = "……그렇군요."
1006503-190 = "네, 알겠습니다."
1006503-191 = "오늘의 실수를 발판 삼아…… 다음번엔……"
1006503-192 = "다음번엔 반드시 완벽한 에스코트를 약속하겠습니다."
1006503-193 = "[s] \"좋아. 기쁜 마음으로 기대하고 있을게.\""
1006503-194 = "네, 저 또한 마찬가지로……."
1006503-195 = "기쁜 마음으로, 그때를 기대하고 있겠습니다."
