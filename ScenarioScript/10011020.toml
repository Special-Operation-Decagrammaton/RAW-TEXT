[translation]
10011020-1 = "제2화;커다란 소녀"
10011020-2 = "백귀야행 공연 준비 무대"
10011020-4 = "공연 도우미분들께서는 이리로 와 주시기 바랍니다!"
10011020-5 = "[s] \"아, 저쪽으로 가야 하나 봐.\""
10011020-6 = "이즈나~ 갑니다!"
10011020-11 = "네, 넷!"
10011020-19 = "진짜 공연을 돕게 됐다니, 정말 믿기지가 않는다고나 할까. 으음."
10011020-20 = "우선 본격적인 활동에 앞서, 도우미 여러분께선 내부 공연 장비 등의 파악을 위해 각자 역할 분담이 필요합니다."
10011020-21 = "으잉? 역할분담?"
10011020-22 = "네, 거기 있는 분은 이쪽으로."
10011020-23 = "아, 응."
10011020-27 = "그리고 이쪽 분은 저쪽으로."
10011020-28 = "네엡! 닌닌!"
10011020-32 = "키가 제일 크신 분께선, 저기 있는 저 장비를 맡는 게 좋을 것 같군요."
10011020-33 = "네, 네에에……!"
10011020-38 = "그럼 지금부터 1시간, 스태프의 설명을 따라 움직여 주시기 바랍니다!"
10011020-40 = "……갑작스럽긴 하지만, 뭐, 어쩔 수 없지? 다들."
10011020-42 = "네! 이즈나! 열심히 공부할게요!"
10011020-43 = "저, 저도……. 노, 노력하겠습니다아……."
10011020-44 = "[s] \"응, 그럼 모두 수고해. 1시간 뒤에 보자.\""
10011020-48 = "(그렇게 1시간 하고 20분 정도가 더 지났을 때였다.)"
10011020-52 = "[ns] \"다들 늦네…….\""
10011020-53 = "(얼마나 하염없이 모두가 돌아오는 걸 기다리고 있었을까.)"
10011020-58 = "[ns] \"응……? 밖에서 뭔가 소란이…….\""
10011020-64 = "[ns] \"저기에 있는 건 분명……?\""
10011020-65 = "저, 저기…… 그, 그러니까아……. 여, 여러부운……비, 비켜주세요오……."
10011020-66 = "응? 뭐. 임마. 그냥 거기 딱 서 있으라고."
10011020-67 = "맞아. 네녀석 키가 커서 딱 좋다니까?"
10011020-68 = "커다란 녀석 앞에서 친구들하고 만나자고 약속했으니까. 움직이면 큰일 날 줄 알아?"
10011020-69 = "히, 히이잉…… 저, 전, 마, 만남의 타워 같은 게…… 아닌데에………"
10011020-70 = "저, 이러고 있을 때가 아니라, 고, 공연의 준비를 해야……."
10011020-71 = "[s] \"츠쿠요?\""
10011020-72 = "……!!"
10011020-76 = "넌 또 뭐야?"
10011020-77 = "우리의 축제 약속을 방해할 셈이냐?"
10011020-78 = "오늘만큼은 우리가 축제 공연의 앞자리를 독차지하고, 소란을 피울 작정이었다고!"
10011020-79 = "방해하는 녀석은 용서 못 해! 쳐라!"
10011020-80 = "[s] \"알았어. 츠쿠요. 상대해주자.\""
10011020-82 = "네, 네엣?!"
