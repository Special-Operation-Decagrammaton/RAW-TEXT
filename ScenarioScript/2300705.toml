[translation]
2300705-1 = "선물을 주는 소녀"
2300705-2 = "여기예요, 선생님."
2300705-3 = "기다리셨나요? 죄송해요, 청소가 늦게 끝나서……."
2300705-4 = "자아, 가실까요?"
2300705-6 = "응? 선생님……? 안 가시나요?"
2300705-7 = "[s] \"……어디로 가는 거야?\""
2300705-8 = "어머, 제가 말씀을 안 드렸나 보네요."
2300705-9 = "근처의 쇼핑몰이에요."
2300705-10 = "음…… 정상적으로 영업하는 곳이고, 사람들도 많이 드나드는 평범한 곳이에요."
2300705-11 = "[s] \"아하…….\""
2300705-12 = "……아하하."
2300705-13 = "제가 평소에 너무 장난이 심했나봐요…… 이, 이렇게까지 반응하실 줄은……."
2300705-14 = "음…… 죄송해요. 어쩐지…… 어른을 놀린 거 같아서 죄송하네요."
2300705-15 = "그냥 선생님만 보면 자꾸 장난을 치고 싶어져서……."
2300705-16 = "음, 이런 변명도 소용없으려나……"
2300705-17 = "다시금 사과드릴게요."
2300705-18 = "곤란하게 해드려서 죄송합니다. 선생님."
2300705-19 = "[s] \"아니…… 하나코 쨩 나름의 친근함의 표현이라고 생각하니까……\""
2300705-20 = "그렇게 호의적으로 해석해주시는 걸까요?"
2300705-21 = "……후후."
2300705-22 = "음, 그럼 사죄의 의미로 선생님께 드릴 선물도 하나 드릴 겸…… 자아- 얼른 가요."
2300705-23 = "[s1] \"선물? 아니, 괜찮아.\"\n[s2] \"그런 건 없어도 돼.\""
2300705-24 = "아아…… 역시 그런가요…… 그렇겠네요……."
2300705-25 = "아아…… 역시 그런가요…… 그렇겠네요……."
2300705-26 = "양말 정도면 부담없이 괜찮을까 했는데……."
2300705-27 = "역시…… 잃어버린 신뢰를 회복하는 건 쌓는 것의 10배의 노력이 필요하다고 하던데……."
2300705-28 = "이미 저는 너무 늦어버린 거…… 일까요……."
2300705-29 = "장난이라고는 하지만, 당사자인 선생님이 느꼈을 당혹함을 생각한다면……. 이런 불신은 어쩌면 당연한 것일 테고……."
2300705-30 = "……네. 이건 제가 감당해야 할 당연한 미움이니……. 죄송합니다. 선생님."
2300705-31 = "그럼…… 다음에 뵙겠습니다."
2300705-32 = "[s] \"아, 아니. 아니…… 양말 정도라면 고맙게 받을게.\""
2300705-33 = "……네?"
2300705-34 = "[s] \"가자. 쇼핑몰.\""
2300705-36 = "……다정하신 분."
2300705-37 = "후후, 그럼 얼른 가요."
2300705-39 = "(의류 매장에 양말을 보러 왔다.)"
2300705-40 = "선생님, 이건 어떤가요?"
2300705-41 = "우후후, 이 디자인은 엄청 웃기네요."
2300705-42 = "음, 그래도 역시 고르라면……"
2300705-43 = "이런 디자인의 흰 양말. 역시 이게 좋아 보여요. 선생님은 어떠세요?"
2300705-44 = "[s3] \"난 화려한 게 좋은데.\"\n[s4] \"난 평범한 게 좋은데.\""
2300705-45 = "어라…… 그런가요?"
2300705-46 = "어라…… 그런가요?"
2300705-47 = "그치만 저는 이런 스타일이 좋거든요."
2300705-48 = "제가 신을 거니까, 역시 제가 좋아하는 걸로 살게요."
2300705-49 = "[s] \"……응?\""
2300705-53 = "이거, 계산해주세요."
2300705-54 = "네. 1000엔입니다. 선물용이신가요? 포장해드릴까요?"
2300705-55 = "아뇨. 제가 신을 거예요."
2300705-56 = "음, 지금 갈아 신을 건데, 탈의실을 써도 될까요?"
2300705-57 = "네. 저쪽을 이용해주시면 됩니다."
2300705-58 = "잠깐 다녀올게요, 선생님."
2300705-60 = "[s] \"………??\""
2300705-64 = "자아, 돌아왔어요. 우후후. 잘 어울리네요. 사이즈도 딱 맞고."
2300705-65 = "아, 그리고 이건 포장해주세요."
2300705-66 = "네? 포장……입니까?"
2300705-67 = "이건……."
2300705-69 = "이걸요?"
2300705-70 = "네. 포장요."
2300705-71 = "제가 신고 있던 양말인데, 여기 계신 선생님께 선물로 드릴 거라 예쁜 포장지에 포장을……."
2300705-72 = "[s] \"잠깐 기다려-!!\""
2300705-73 = "어머나? 선생님?"
2300705-74 = "양말 정도라면 고맙게 받겠다고 하지 않으셨나요?"
2300705-75 = "……."
2300705-76 = "……………………."
2300705-77 = "[s] \"아니라고오오오오- 아닙니다, 아니에요! 아무튼 아닙니다!!\""
2300705-79 = "[s] \"그런 눈으로 날 보지 말아주세요오- 아무튼 오해입니다!\""
2300705-80 = "어라…… 설마 양말 정도로는 성에 안차시는……?"
2300705-81 = "그, 그런 거라면…… 으음, 그렇다면 저도 꽤나 각오를 해야겠네요……."
2300705-82 = "저, 저기…… 여기서 제일 가까운 속옷 매장은 어디에 있나요……?"
2300705-83 = "……………………………."
2300705-84 = "[s] \"실례했습니다아아아----!!\""
2300705-86 = "(급하게 하나코를 붙잡고 쇼핑몰을 탈출했다.)"
