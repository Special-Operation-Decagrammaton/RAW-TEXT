[translation]
1012103-1 = "백화요란의 방식이 아니어요!"
1012103-2 = "(유카리와 만나기로 한 약속 장소까지 나왔다.)"
1012103-3 = "(그나저나…….)"
1012103-5 = "백귀야행 인근의 수영장 앞"
1012103-9 = "(연일 무더운 날씨가 이어진 탓인지 수영장 바깥부터 손님들이 인산인해를 이루고 있다.)"
1012103-10 = "앗! 선생님! 여기여요!"
1012103-14 = "소녀는 여기 있사와요!"
1012103-18 = "와아앗! 사람이 너무 많아서 조금만 방심하면 금방 놓쳐버릴 것 같사와요!"
1012103-19 = "호, 혹시…… 조금만 붙잡아도 괜찮을까요?"
1012103-20 = "……그러면, 에잇!"
1012103-25 = "후후. 이제 놓치지 않겠네요."
1012103-26 = "그나저나 여기가 말로만 듣던 워터 파~쿠로군요!"
1012103-27 = "듣던 대로 굉장히 멋진 장소……."
1012103-28 = "[s1] \"아직 입구지만.\"\n[s2] \"안쪽은 더 대단하다고?\""
1012103-31 = "그렇지만, 정말 중요한 것은 보이지 않아도 알 수 있사와요."
1012103-32 = "여기 있는 사람들의 얼굴에 하나같이 웃음꽃이 피어 있으니, 틀림없이 워터 파~쿠는 별천지처럼 멋진 장소겠죠!"
1012103-33 = "두근두근 기대되어서 더는 기다리고 있을 수 없사와요! 선생님!"
1012103-34 = "저희도 들어가는 것이에요!"
1012103-36 = "와아……! 선생님, 보셔요!"
1012103-37 = "다들 수영복을 입고 있사와요!"
1012103-38 = "[s3] \"미묘한 부분에 감탄하네…….\"\n[s4] \"좀 더 기구라든지, 풀이라든지…….\""
1012103-41 = "전날 선생님께 배운 그대로인걸요! 역시 다들 드레~수 코오~두에 맞게 입고 있는 것이어요!"
1012103-42 = "모두 평소와 다르게 차려입고, 즐거운 행사를 즐긴다…… 꼭 축제 날 같사와요!"
1012103-43 = "비록 소녀는 백화요란 활동으로 참가자보다는 관리자 쪽에 서는 편이지만…… 오늘만큼은 선생님과 함께 마음껏 즐기는 쪽에 서겠사와요!"
1012103-44 = "웅성웅성……."
1012103-48 = "어라……? 소녀의 착각인지, 어쩐지 분위기가 갑자기 바뀐 듯이……?"
1012103-49 = "다들 혼란스러운 얼굴로 출구 쪽으로 향하고 있사와요. 혹시 안에서 무슨 사고라도……?"
1012103-53 = "오늘도 저희 수영장에 들러주신 고객 여러분들께 감사의 말씀드립니다."
1012103-54 = "송구스러우나 금일 영업이 조기 종료되었음을 안내 드립니다. 아직 실내에 남아계신 고객 여러분께서는 신속한 퇴장을 부탁드립니다."
1012103-55 = "이, 이게 어떻게 된 일이죠……?! 아직 폐점까지는 시간이 꽤 남았던 게……."
1012103-56 = "혹시 이것도 소녀가 모르는 수영장의 문화라는 걸까요?!"
1012103-57 = "아가씨도 참…… 최근 얌전하시더니 이런 말썽을."
1012103-61 = "하지만 이제 괜찮습니다. 이 수영장은 카데노코지 이름으로 대절했으니까요."
1012103-62 = "사용인님, 어떻게 여길……?!"
1012103-63 = "그보다, 대절이라고요?!"
1012103-64 = "아무래도 갑작스러운 부탁이었지만, 여기 주인 분께서 이야기가 통하는 분이셔서요."
1012103-65 = "전부 카데노코지 가문이 백화요란에서 덕을 쌓아온 덕분이겠죠."
1012103-66 = "카데노코지 가문의 부탁이라뇨…… 소녀는 딱히 그런 걸 바라지는……."
1012103-67 = "안 됩니다! 이건 엄연히 가문의 문제에요! 카데노코지의 귀하신 아가씨가, 대중 앞에서 피부를 드러내시다뇨!"
1012103-68 = "아, 물론, 선생님께서는 괜찮습니다. 선생님께는 입은 은혜도 있고……."
1012103-69 = "무엇보다 아가씨께서 뜻이……."
1012103-70 = "……하여튼! 선생님께서는 복 받으신 줄 아셔야 해요!"
1012103-71 = "[s] \"……? 감사합니다?\""
1012103-73 = "선생님과 단둘이 있게 된 상황은…… 분명, 소녀가 바라 마지않던 것……."
1012103-74 = "역시 그렇죠? 저도 금방 나갈 테니, 두 분이서 모쪼록……. 호호."
1012103-76 = "뭐야? 오늘은 수영장 안돼?"
1012103-77 = "어제부터 잔뜩 기대했는데!"
1012103-78 = "자자, 애들아~ 다음에 또 오면 되니까……."
1012103-81 = "선생님."
1012103-82 = "소녀는 선생님과 하는 매 순간, 심지어 선생님이 계시지 않을 때도 선생님을 생각하면 즐겁고 두근거린답니다."
1012103-83 = "그건 분명, 선생님과 함께하는 순간들이 소녀에게 있어 부끄럽지 않고, 더없이 소중하기 때문일 테죠."
1012103-87 = "그러니까, 선생님."
1012103-88 = "[s5] \"응, 무슨 말인지 알겠어.\"\n[s6] \"유카리가 하고 싶은 대로 해.\""
1012103-91 = "네! 여기서 당당히 선언하겠사와요!"
1012103-92 = "자신의 행복을 위해 타인을 불행하게 하는 것은, 카데노코지의 뜻이 어떻든 간에 저 유카리의 방식이 아니어요!"
1012103-93 = "정 그러시다면 어쩔 수 없지만…… 대신 수영장 이용은 삼가 주셔야겠습니다. 그래도 괜찮다는 말씀이시죠?"
1012103-94 = "네!"
1012103-95 = "왜 그렇게까지…… 알겠습니다."
1012103-99 = "선생님."
1012103-100 = "면목이 없습니다. 먼저 선생님을 불러내었는데, 소녀의 집안 사정으로 이렇게 될 줄은……."
1012103-101 = "네? 저기를 보라고요?"
1012103-105 = "어…… 그게…… 조금 전 안내방송으로 혼란을 드려 죄송합니다. 금일 영업은 아직 진행 중입니다. 그리고…… 어……."
1012103-106 = "사과의 뜻으로 오늘 하루는 무료입장을 진행하겠습니다! 이미 입장료를 지불하신 손님께는 카운터에서 환불 도와드리겠습니다!"
1012103-107 = "어차피 대관료 덕에 돈 문제는 없고…… 그보다는 민심을 되돌려야……! 앗, 마이크가……!"
1012103-108 = "어라? 뭐가 어떻게 된 거지? 높으신 분이 온다 해서 나가라 했던 거 같은데……."
1012103-109 = "변덕으로 취소했나 보지! 게다가 무료라니, 최악의 휴일인 줄 알았는데 오히려 최고야!"
1012103-111 = "와, 수영장 들어가도 된대!"
1012103-112 = "빨리 미끄럼틀 줄 서자!"
1012103-116 = "애들아~ 뛰면 위험해~"
1012103-119 = "……다들 즐겁게 웃고 있사와요."
1012103-120 = "[ns7] \"이게 유카리가 바란 결과지?\"\n[ns8] \"그렇다면 나도 좋아.\""
1012103-123 = "네!"
1012103-125 = "(비록 수영 연습은 하지 못했지만, 돌아오는 길에 유카리와 함께 막과자집에 들러 즐거운 시간을 보냈다.)"
