[translation]
10052055-2 = "후우, 어떻게든 됐네요……."
10052055-3 = "……."
10052055-4 = "[s] \"뭔가, 신경 쓰여?\""
10052055-5 = "신경 쓰인다는 정도…… 까지는 아닙니다만."
10052055-6 = "……애초에 그 애들 신경 쓸 여유가 있으면, 우리가 무사할지부터 걱정해야 할 지경이기도 하고요."
10052055-7 = "그렇지만……."
10052055-8 = "있잖아요, 선생님."
10052055-9 = "[s] \"응?\""
10052055-10 = "왜 다들, 그렇게 서로 못 싸워서 안달일까요."
10052055-11 = "[ns] \"양보할 수 없는 게 있을 테니까.\""
10052055-12 = "그런 거야 물론 모두에게 있겠지만."
10052055-13 = "그게 무엇인지조차 서로 모르는 상황인데 말이죠."
10052055-17 = "……생명이, 언젠가는 화해할 수 있을까요."
10052055-18 = "[s] \"나는 그렇게 믿고 싶어.\""
10052055-19 = "지금은 그렇게까지 안 믿는다는 뜻이시네요."
10052055-20 = "[s1] \"그렇게 볼 수도 있겠지만.\"\n[s2] \"그래도 말이지.\""
