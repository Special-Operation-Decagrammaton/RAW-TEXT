[translation]
2300815-1 = "솔직한 마음"
2300815-2 = "(시스터후드의 비품을 구매하기 위해 마리와 함께 쇼핑몰에 왔다.)"
2300815-4 = "후아…… 짐이 생각보다 많네요……"
2300815-5 = "바자회 용품 준비, 제의에 사용할 도구들, 봉사활동에 필요한 물품에 이번 달 간식까지……"
2300815-6 = "[s] \"응, 같이 오길 잘했네.\""
2300815-7 = "그러게요. 선생님께 도움을 요청드리지 않았다면 큰일 날 뻔했어요."
2300815-8 = "매번 감사할 따름이네요."
2300815-9 = "[s] \"항상 마리가 이렇게 준비하는 거야?\""
2300815-10 = "앗, 그렇지는 않아요. 보통 당번을 정해서 돌아가며 하거든요."
2300815-11 = "그런데 다들 이래저래 바쁘시니, 제가 자청하는 경우가 많긴 하지요."
2300815-12 = "오늘은 시간 되는 분이 아무도 안 계셔서 저 혼자였지만, 항상 이렇지는 않답니다."
2300815-13 = "[s] \"고생하네…… 마리……\""
2300815-14 = "후후, 작은 도움이라도 될 수 있다는 사실이 감사할 뿐이죠."
2300815-15 = "그래도 이렇게 큰 쇼핑몰에 오면 주변에 구경할 거리가 많아서, 그것도 나름대로 재미랍니다."
2300815-16 = "앗, 선생님. 저기 보세요. 귀여운 인형들이 가득하네요."
2300815-17 = "저기에는 예쁜 옷 가게가……"
2300815-18 = "이쪽의 액세서리들도 귀엽네요……"
2300815-19 = "[ns] (마리의 이런 모습은 처음 보는 것 같네……)"
2300815-20 = "거기! 사이 좋아 보이는 두 분! 인물이 아주 훤하구만?"
2300815-21 = "엣, 저…… 저희 말씀이신가요?"
2300815-22 = "그럼 여기 두 분 말고 또 누가 있어? 껄껄껄."
2300815-23 = "가게 들러서 한번 구경이나 해봐요! 아주 예쁜 액세서리가 가득하다니까!"
2300815-24 = "애, 액세서리……"
2300815-25 = "최신 유행 상품이야! 내가 할인도 팍팍 해드릴게!!"
2300815-26 = "[ns] \"한번 골라볼래?\""
2300815-28 = "옛?! 아, 액세서리를요?"
2300815-29 = "[s1] \"항상 열심인 마리에게 뭐라도 선물하고 싶어서.\"\n[s2] \"마음에 드는 걸 골라봐.\""
2300815-32 = "앗, 아아……"
2300815-38 = "아, 아니에요."
2300815-42 = "그, 으음…… 말씀과 마음은 너무나도 감사하지만……"
2300815-43 = "저도 한 명의 시스터로서, 불필요한 치장과 사치는 최대한 삼가야 하니까요……"
2300815-44 = "무, 물론 예쁜 액세서리들이 너무 많고…… 저도 보고 있자니 욕심이 나는 것도 사실이지만……"
2300815-45 = "[s] \"코사지는 하고 있지 않아?\""
2300815-46 = "아…… 이, 이거 말씀이신가요……"
2300815-50 = "……이 코사지는……"
2300815-51 = "그, 시스터후드의 서약을 잊지 말자는 의미에서 구매했던 거니까요."
2300815-52 = "시들지 않는 이 하얀 꽃처럼, 저도 처음의 마음을 잊지 말자고…… 그, 그런 의미였거든요……"
2300815-53 = "[s] \"그렇구나……\""
2300815-58 = "……선생님…… 솔직하게 말해도 될까요?"
2300815-59 = "[s] \"편하게 이야기해.\""
2300815-63 = "이곳이 고해성사실은 아니지만…… 그래도 솔직하게 말해야겠다는 생각이 들었어요……"
2300815-64 = "사실 이 코사지는……"
2300815-65 = "예, 예뻐서 산 것도 있어요……"
2300815-66 = "[s] \"응?\""
2300815-67 = "볼 때마다 마음을 다잡기 위한 목적도 물론 없지는 않았지만……!!"
2300815-68 = "그, 그냥 예뻐서 산 거예요……"
2300815-72 = "아까 말씀드렸듯이 시스터의 덕목은 검소함과 청빈함인데……"
2300815-73 = "사실 저도 액세사리 같은 것들에 관심이 없지는 않고…… 다른 학생들처럼 꾸미고 싶은 마음도 조금은 있고……"
2300815-74 = "그, 그래서 이 코사지를 달고 있는 거예요……"
2300815-75 = "하아…… 이렇게 세속적인 욕망이라니…… 그런 주제에 다른 핑계를 대다니……"
2300815-76 = "시스터로서 부적격이에요……"
2300815-77 = "……"
2300815-78 = "그래도, 선생님께 말씀드리고 나니 확실히 마음은 조금 편해졌어요."
2300815-79 = "[s] \"최대한 사치를 부린 게 그 코사지였구나……\""
2300815-80 = "예…… 이 정도면 죄악의 범주에 들지 않을까, 고민하면서 고른 물품이라……"
2300815-81 = "서, 선생님은…… 어떻게 생각하세요……? ……실망하셨나요?"
2300815-82 = "[s] \"크흑, 귀여워……\""
2300815-83 = "예, 예?!"
2300815-84 = "[s3] \"그정도는 괜찮다고 생각해.\"\n[s4] \"저번에도 이야기했지만, 시스터이자 학생이니까.\""
2300815-87 = "그, 그런가요…… 이 정도는 괜찮은 걸까요……"
2300815-88 = "[s5] \"한창때의 나이잖아.\"\n[s6] \"멋을 부리거나, 귀여운 것을 좋아하는 마음은 당연한 거야.\""
2300815-91 = "그런 걸까요……"
2300815-92 = "……선생님께서 그렇게 말씀해 주시니 조금은 마음이 놓이네요."
2300815-93 = "어디까지가 당연하고, 어디까지가 당연하지 않은 건지……"
2300815-94 = "아직도 제게는 조금 어렵긴 하네요. 후후."
2300815-95 = "아무튼, 선생님의 마음은 감사히 받을게요."
2300815-96 = "제게는, 이 코사지 하나면 충분해요."
2300815-97 = "[s] \"그럼, 액세서리 대신 맛있는 거라도 사게 해줄래?\""
2300815-98 = "정말이지…… 항상 제게 뭘 주시려고 하네요. 이미 많이 주고 계신데……"
2300815-99 = "……"
2300815-106 = "그럼, 부탁드릴게요."
2300815-108 = "(마리와 함께 아주 맛있는 식사를 하고 돌아왔다.)"
