[translation]
1600603-1 = "소녀의 비법 재료"
1600603-3 = "[ns1] \"그래서, 이즈미 어딜 가는 거야?\"\n[ns2] \"여긴 바닷가도 아니잖아.\""
1600603-4 = "그야~"
1600603-5 = "그야~"
1600603-6 = "여름의 별미라고 꼭 바닷가에서만 먹으란 법은 없어. 선생님."
1600603-7 = "내 조사에 따르면, 이 근처에서 별미로 유명한 곳은 따로 있더라구."
1600603-8 = "[s] \"그거, 믿을 수 있는 정보야?\""
1600603-9 = "어? 이거 바닷가에 찾아온 할머니가 말해준 건데?"
1600603-10 = "'얘, 복스럽게 먹을 거 같은 아가씨. 여기 전병 좀 먹어볼래?' 라길래."
1600603-11 = "바로 전병을 받아서 맛봤는데, 그 새우 전병이 엄청 맛있어서……. 츄릅."
1600603-12 = "[s] \"이야기가 전력으로 탈선해버렸어. 이즈미.\""
1600603-13 = "흐에에?!"
1600603-14 = "핫! 츄릅, 그, 그러니까. 중요한 건 이게 아니라아-!"
1600603-15 = "이 도로만 지나면 지역 명물 요리인 중화냉면으로 유명한 노점이 있대!"
1600603-16 = "오늘은 그걸 맛볼 거야!"
1600603-20 = "여기인가 봐!"
1600603-21 = "여름 별미 중화냉면을 파는 가게가!"
1600603-22 = "[s] \"응? 근데…….\""
1600603-25 = "지역 명물이라더니, 왜 사람 하나 없이 횅한 거야?"
1600603-26 = "어?! 혹시 이미 망한 거야?! 그럼 곤란해애!"
1600603-27 = "모처럼 그 햇볕이 쨍쨍 내리쬐는 도로를 30분이나 걸어서 왔단 말야!"
1600603-28 = "내 걸음 물어내!"
1600603-29 = "[s] \"이즈미는 가차없구나!\""
1600603-30 = "아, 아직 안 망했어!"
1600603-31 = "크흑, 이게 다 해변가에 새로 생긴 바다의 집 때문이야……."
1600603-32 = "여름만 되면 모래뺏기 게임 챔피언이 운영하는 가게가 모든 손님을 싹슬……."
1600603-33 = "아, 아직 안 망했어?"
1600603-34 = "그럼 됐어! 아저씨! 여기! 중화냉면 두 개!"
1600603-35 = "[s] \"이즈미는 흔들리지 않는구나?!\""
1600603-37 = "자, 주문하신 중화냉면 두 개! 나왔슴다!"
1600603-39 = "와아- 고명이 알록달록한 게, 응. 맛있어 보여!"
1600603-40 = "그럼 어디. 한 입."
1600603-45 = "[ns] \"어때?\""
1600603-46 = "우음- 맛은 있는데. 뭔가, 부족해."
1600603-47 = "으으으으음!! 아! 맞다. 이걸 넣어보면 어떨까?"
1600603-49 = "[s] \"이즈미……? 방금 뭘 넣은 거야?\""
1600603-50 = "응? 이거, 내가 직접 만든 땅콩버터인데?"
1600603-51 = "여기 중화냉면에 이 땅콩버터를 덜어서, 이렇게 휘적휘적 하면……. 완성!"
1600603-52 = "자, 이거, 분명 맛있을 거야! 선생님도 한 번 먹어볼래?"
1600603-53 = "[s3] \"이즈미가 만든 땅콩버터를……!\"\n[s4] \"중화냉면에……?!\""
1600603-60 = "자, 선생님! 아-앙!"
1600603-61 = "(질끈!)"
1600603-62 = "(눈을 꼭 감고, 이즈미가 먹여주는 중화냉면을 맛보았다.)"
1600603-63 = "(우물)"
1600603-64 = "(……꿀꺽)"
1600603-67 = "(새콤한 중화냉면의 국물과 땅콩버터의 찐득하고 달콤한 풍미가 만나 벌어지는 앙상블……!)"
1600603-68 = "[s] \"마, 맛있다고……? 어째서?\""
1600603-69 = "그치? 맛있지?! 잘 어울릴 줄 알았다니까!"
1600603-70 = "나도 먹어야지! 냠!"
1600603-73 = "음! 맛있다! 선생님, 이거 무지 맛있어!"
1600603-74 = "[s] \"으, 으응, 어째서……??\""
1600603-77 = "(다음 날.)"
1600603-78 = "에에에에엥?! 이게 뭐야?! 왜 이렇게 사람이 많은 건데?!"
1600603-79 = "[s] \"그러게 어제까지만 해도 분명…….\""
1600603-80 = "오늘은 중화냉면말고도 여기 대표 메뉴를 먹어보려고 했는데!"
1600603-81 = "이래서야 우리 여름여름맛집콤비가 앉을 자리가 없어! 어떡하지. 선생님?!"
1600603-82 = "[s] \"그 이름 계속 쓰는구나.\""
1600603-83 = "으으으으음, 어쩔 수 없지. 다른 장소로 가는 수밖에."
1600603-84 = "마침 그 할머니가, 중화냉면 다음으로 또 맛있는 별미를 파는 가게가 있다고 추천해줬거든!"
1600603-85 = "아쉽지만, 오늘은 그쪽으로 가자!"
1600603-87 = "[ns] \"여긴?\""
1600603-88 = "여긴 장어덮밥으로 유명한 가게래."
1600603-89 = "그런데 여기도 사람이 없네."
1600603-90 = "헉?! 설마 망한 건 아니지?!"
1600603-91 = "여기 장사 아직 하는 거 맞지?!"
1600603-92 = "물론입니다! 손님!"
1600603-93 = "비록 손님들은 전부 모래뺏기 게임 챔피언과 어째서인지 오늘 아침부터 손님이 몰려들기 시작한 포장마차에……."
1600603-95 = "그럼 됐어! 아저씨!"
1600603-96 = "여기 장어덮밥 두 개!"
1600603-98 = "여기, 장어덮밥 나왔슴다!"
1600603-100 = "좋아! 그럼 어디 한 번~~~"
1600603-105 = "으, 으으으음……."
1600603-106 = "흐으음. 흐음?"
1600603-107 = "[s] \"이즈미, 왜 그래 또?\""
1600603-108 = "그게……. 선생님, 이 장어 덮밥. 맛은 있는데. 으음, 맛은 있는데 말이야아……."
1600603-109 = "뭔가 부족하다고 할까……."
1600603-110 = "[s] \"어딘가 부족하다?\""
1600603-111 = "응! 맞아! 어떻게 알았어. 선생님?!"
1600603-112 = "뭔가 딱 한 걸음, 한 걸음이 부족해. 으으음……."
1600603-117 = "[ns] \"또?\""
1600603-118 = "응! 이럴 땐 마침 준비해온 땅콩버터가 딱이지!"
1600603-123 = "우물우물우물……."
1600603-124 = "음, 맛있다!"
1600603-125 = "선생님도 먹어볼래애?"
1600603-126 = "[s] \"정말?\""
1600603-131 = "자아, 선생님. 아-앙! 먹여줄게!"
1600603-134 = "(입안을 가득 채운 장어의 고소한 단맛 위로 은은하게 퍼져 나가는 땅콩버터의 풍미.)"
1600603-135 = "(장어덮밥은 진화했다!)"
1600603-136 = "그치? 맛있지? 땅콩버터는 어디에든 어울린다니까?"
1600603-137 = "식빵에 땅콩버터를 바르고 떨어트리면 언제든지 땅콩버터 쪽으로 떨어진다던데."
1600603-138 = "이것만 봐도 역시 땅콩버터는 굉장해!"
1600603-139 = "[s5] \"그게 굉장한 요소야……?\"\n[s6] \"하지만 왜? 왜, 맛있는 거지……?\""
1600603-140 = "이래봬도 나도 미식연구회 부원이라고~?"
1600603-141 = "이래봬도 나도 미식연구회 부원이라고~?"
1600603-142 = "언제나 미식을 위해 노력하고 있으니까. 이 정도 어레인지는 기본이야!"
1600603-143 = "(맛있다는 듯이 장어덮밥을 먹어 치우는 이즈미 앞에서 이해할 수 없는 의문만이 깊어져 갔다…….)"
1600603-146 = "(다음 날. 장어덮밥 가게는 어째서인지 손님으로 붐비고 있었다.)"
1600603-147 = "어?! 왜 또 사람으로 붐비는 거야?!"
1600603-148 = "어제까지만 해도 파리만 날렸는데?! 오늘도 파리만 날려야 하는 거 아냐?!"
1600603-149 = "[s] \"이즈미는 가차없구나…….\""
1600603-150 = "으아아아앙! 어젠 덮밥이었으니까. 오늘은 장어초밥(특)을 먹으려고 했단 말이야아~!"
1600603-151 = "근데 왜애애애??"
1600603-156 = "앗! 저 소녀입니다! 저 소녀의 손이 닿은 음식은, 손님을 부르는 음식이 됩니다!"
1600603-157 = "나도 깜짝 놀랐다고!"
1600603-158 = "뭣이?!"
1600603-159 = "저 소녀가!"
1600603-160 = "파리만 날리는 가게도 단숨에 되살린다는 전설의 컨설턴트?!"
1600603-161 = "[s] \"……응?\""
1600603-162 = "부디! 우리에게도!"
1600603-163 = "여름 특수를 누릴 수 있는 조언을!"
1600603-164 = "도움을 주십쇼! 아가씨!"
1600603-166 = "흐에에엥?! 뭐, 뭐야아?!"
1600603-167 = "[s] \"이즈미, 일단 도망치자.\""
1600603-168 = "뭐야아아~! 난 그냥 여름 별미가 먹고 싶었을 뿐인데에!!"
1600603-170 = "(그렇게 몰려드는 식당 주인들을 피해, 이즈미와 함께 바다 끝까지 도망쳤다.)"
