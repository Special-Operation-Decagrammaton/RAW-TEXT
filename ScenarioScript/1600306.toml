[translation]
1600306-1 = "소녀는 반짝임을 쫓는다"
1600306-2 = "(스즈미가 알려준 장소는 트리니티 내에 있는 한산한 유원지였다.)"
1600306-3 = "(꽤 늦은 시간이었기 때문에, 별다른 손님 없이 놀이기구들만 움직이고 있었다.)"
1600306-4 = "아, 선생님. 여기입니다."
1600306-5 = "바쁘실 텐데 일부러 와 주셔서 감사합니다. 이런 늦은 시간까지……"
1600306-6 = "[s1] \"괜찮아.\"\n[s2] \"무슨 일이야?\""
1600306-7 = "마, 말씀드렸듯 딱히 중요한 용건이 있는 건 아니었습니다."
1600306-8 = "마, 말씀드렸듯 딱히 중요한 용건이 있는 건 아니었습니다."
1600306-9 = "……그……"
1600306-10 = "[s] \"그......?\""
1600306-11 = "그게…… 벼, 별……"
1600306-12 = "별을…… 좀…… 보여드리고 싶어서……."
1600306-13 = "[s3] \"……네?\"\n[s4] \"갑자기 별?\""
1600306-14 = "죄, 죄송합니다. 역시 갑작스럽고 두서도 없지요."
1600306-15 = "죄, 죄송합니다. 역시 갑작스럽고 두서도 없지요."
1600306-16 = "갑자기 불러내서 이런 말을…… 아무래도 제가 실수를 한 모양입니다."
1600306-17 = "역시 없던 일로……."
1600306-21 = "네? 괜찮으시다고요?"
1600306-22 = "그보다…… 갑자기 왜 별이냐고요……?"
1600306-23 = "그, 그게…… 큰 이유는 없습니다만……"
1600306-24 = "그저 선생님께도 보여드리고 싶었던 것뿐이라……"
1600306-31 = "……이곳……"
1600306-32 = "이 유원지는…… 제가 매일 순찰을 도는 마지막 코스입니다."
1600306-33 = "이 시간대의 유원지는 사람도 없고 숨기 좋은 곳이라, 처음에는 여기도 불량배분들이라던가 꽤 있었습니다만……"
1600306-34 = "자주 저와 부딪혀서 그런지, 다들 다른 곳으로 가버리고 조용해졌습니다."
1600306-35 = "……평온함을 느낄 수 있었습니다."
1600306-36 = "난간에 앉거나 멍하니 서서, 저 별들을 볼 시간이 생기게 됐습니다."
1600306-37 = "그러다 보니 자연스레……. 혹시 좀 더 높은 곳으로 가면 별이 더 잘 보이지 않을까. 그런 생각이 들었습니다."
1600306-38 = "당연히 당장 떠오른 건 관람차였습니다만……."
1600306-39 = "……그……."
1600306-40 = "역시. 관람차 같은 건……. 아무리 그래도 혼자 타기가 좀……. 그래서……."
1600306-41 = "[s] \"같이 탈 사람이 필요해서 부른 거였구나.\""
1600306-42 = "……뭔가 정리하고 보니 정말 어린애 같은 이유였네요. 죄송합니다."
1600306-43 = "……네? 괜찮다고요? 지금 바로 가자고요?"
1600306-44 = "그, 그게……. 그……."
1600306-48 = "……으음……. 아닙니다."
1600306-49 = "감사합니다. 선생님."
1600306-53 = "그럼 이쪽으로……."
1600306-54 = "[s] 스즈미를 따라간다."
1600306-60 = "(그렇게 스즈미와 나란히 걸으며 관람차 쪽으로 향했다.)"
1600306-68 = "예전에 한번, 신경 쓸 것 없는 하루에 대해서 말씀을 드린 적이 있었죠."
1600306-69 = "자경단 일을 하지 않고, 아무런 생각 없이 편하게 지내는 날이 있었으면 좋겠다고."
1600306-70 = "……잘 생각해 보면, 이미 가지고 있는 게 아닐까……."
1600306-71 = "그런 생각이 들었습니다."
1600306-75 = "쓰, 쓸데없이 말이 또 길어졌네요. 죄송합니다."
1600306-83 = "이제 도착했습니다."
1600306-84 = "금방 올라가니 조금만 기다려주세요."
1600306-87 = "[wa:1200]― ……예쁘네요."
1600306-90 = "[wa:1200]― 여기서라면,"
1600306-92 = "[wa:500]― 별을 [wa:200]잡을 수 [wa:200]있을 것만 같아요."
1600306-95 = "[wa:1200]― 최근에는 [wa:1200]이렇게 [wa:300]느긋하고,"
1600306-97 = "[wa:500]― 차분한 시간도 [wa:500]보낼 수 있게 [wa:300]되었네요……."
1600306-100 = "[wa:1200]― ……선생님과 [wa:900]만났을 무렵부터, [wa:300]인지도 모릅니다."
1600306-103 = "[wa:2800]― ……선생님."
1600306-106 = "[wa:1100]― 괜찮으시다면 [wa:700]앞으로도"
1600306-108 = "[wa:900]― 함께 [wa:600]해주실 수 [wa:300]있을까요?"
1600306-111 = "[wa:1300]― 저는 [wa:200]언제나,"
1600306-113 = "[wa:200]― 재미없는 이야기를 계속 [wa:1100]하게 될지도 모릅니다만……."
1600306-116 = "[wa:1800]― 그래도 [wa:400]언젠가는 [wa:1900]저도……."
1600306-118 = "[wa:1300]― ……네. [wa:1600]언젠가, [wa:1500]반드시."
1600306-121 = "……확실하게 말씀드리는 날이, 왔으면 좋겠다고 생각합니다."
