[translation]
12070-1 = "제7화;아비도스 사막으로 2"
12070-3 = "여기서부터 버려진 사막……."
12070-4 = "모래로 뒤덮인 시가지까진 가봤지만 저도 여기부터는 처음 가보는 곳이에요……."
12070-5 = "이야~ 여기 오랜만이네."
12070-6 = "선배는 여기 와본 적 있어?"
12070-7 = "아아, 응. 예전에 학생회 임무로 몇 번 와본 적이 있었어."
12070-8 = "여기서 조금만 더 가면 아비도스 사막 축제가 펼쳐졌던 오아시스가 나온다고!"
12070-9 = "뭐어? 오아시스? 이런 곳에?"
12070-10 = "뭐, 지금은 다 말라버렸지만. 예전엔 웬만한 호수보다 넓어서, 배를 띄울 수 있을 정도였다고 해."
12070-11 = "나도 직접 본적은 없지만 말야."
12070-12 = "사막 축제…… 나도 들은 적 있어. 아비도스 최고의 축제여서 사람들이 많이 찾았다고 했어."
12070-13 = "그렇지. 다른 학교에서도 그 축제를 보려고 찾아 올 정도였으니까. 뭐, 사막화가 진행되기 수십 년 전의 일이지만."
12070-14 = "축제…… 인파…… 이런 사막에? 사람들이? 믿겨지지가 않아."
12070-15 = "뭐, 예전엔 여기도 살기 좋은 곳이었다고 하니까. 모래 먼지도 그땐 없었고."
12070-17 = "게헨나의 선도부장이 언급한 섹터까진 아직 조금 더 가야해요."
12070-18 = "하지만…… 이런 곳에 특별히 뭐가 있을지……."
12070-19 = "일단 주위를 살피면서 전진입니다."
