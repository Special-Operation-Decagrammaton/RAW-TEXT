[translation]
2004502-1 = "피나의 두 얼굴"
2004502-2 = "(피나를 찾아 백귀야행으로 왔다.)"
2004502-7 = "[ns] \"간만에 와서인지 길을 잘 모르겠는데…….\""
2004502-9 = "고마워요, 덕분에 안 헤맸네요."
2004502-10 = "실례지만 여기 이 글에 있는 포목점이 어디에 있는지……."
2004502-12 = "[ns1] (안내 가이드가 있구나.)\n[ns2] \"저기…… 길 좀 묻겠습니다.\""
2004502-15 = "네에!! 물론입니다!! 어디……."
2004502-20 = "앗!! 선생님!!"
2004502-21 = "안녕하십니까!! 새로워진 피나로 인사드립니다!"
2004502-22 = "[s3] \"피나?!\"\n[s4] \"새로워진 피나?!\""
2004502-25 = "네! 그렇습니다!"
2004502-26 = "백귀야행 상점가로부터 잠시 안내의 부탁을 받아서 가이드를 하고 있었습니다!"
2004502-30 = "마침 상점가를 돌아보면서 안내를 하는데 선생님도 함께, 어떠신가요!"
2004502-31 = "[s] \"피나만 괜찮다면 얼마든지\""
2004502-32 = "네에-! 그러면 출발하겠습니다! 다들 잘 따라와 주시기 바랍니다!"
2004502-34 = "이곳은 백귀야행의 전경을 한 눈에 담을 수 있는 전망대입니다!"
2004502-35 = "멀리 보이는 신목은 백귀야행 연합학원의 자랑이자 상징으로, 매해 신목제를 열고 있습니다!"
2004502-36 = "오오… 멋지다."
2004502-37 = "배경으로 한번 사진 찍고 싶은데 가이드씨 괜찮을까요?"
2004502-38 = "네에-! 물론입니다!"
2004502-45 = "백귀야행의 맛과 매력을 잔뜩 즐길 수 있는 음식거리입니다!"
2004502-46 = "모르는 음식이 있다면 얼마든지 물어보세요!"
2004502-47 = "이 가이드가 전부 알려드리겠습니다!"
2004502-48 = "음식 냄새부터 장난이 아닌걸."
2004502-49 = "뭐부터 골라야 할지 모르겠어."
2004502-50 = "네! 그럴 때에는 우선 이곳의 닭꼬치 가게가……."
2004502-52 = "다음에는 이 역시 우리 백귀야행의 자랑… 인데…"
2004502-53 = "……어라?"
2004502-57 = "?"
2004502-61 = "뭐……뭐지…… 어라라…… 안 보입니다……."
2004502-62 = "[s] \"피나? 뭘 찾고 있는 거야?\""
2004502-63 = "온데간데없습니다!! 이걸 어떻게 해야 할지……."
2004502-64 = "분명 이럴 리가 없습니다!!"
2004502-65 = "[s] \"영화 세트라면 영화 촬영이 끝나고 철거했을지도…….\""
2004502-66 = "그게 아니라……."
2004502-67 = "매일 여기에 있는 강아지씨가 안 보입니다!!"
2004502-68 = "[s] \"강아…… 지?\""
2004502-69 = "<바람의 시바>의 주인공 <시바> 옷을 입은 강아지씨가 매일 여기서 낮잠을 자고 있었는데……."
2004502-70 = "손님분들이 백귀야행에서 꼭 보고 가야 할 명물중의 명물입니다!"
2004502-71 = "[s6] \"강아지라면 시설이나 물건이 아니니까.\"\n[s7] \"어딘가 다른 곳으로 간 게 아닐까?\""
2004502-74 = "아앗!! 하기사 강아지라면 어디든지 갈 수 있으니까…"
2004502-75 = "매일같이 낮잠 자고 있어서 깜빡했습니다!!"
2004502-76 = "가이드 아가씨, 여기는 뭘 하는 곳이야?"
2004502-77 = "아까부터 기다리고 있었다구요."
2004502-82 = "(으아아……다……당황하면 안 되는데…….)"
2004502-83 = "(예상치 못한 일이 일어나니까 머리가 새하얘져서…….)"
2004502-84 = "[ns] \"여기 이 등신대는 뭐에 관련된 건가요?\""
2004502-85 = "(앗! 두목님……!)"
2004502-86 = "네에-! 이곳은 백귀야행의 영화촌으로, 그 역사를 거슬러 올라가면……."
2004502-91 = "(선생님…… 감사합니다……!)"
2004502-93 = "(다시 여유를 되찾은 피나의 활약으로 가이드 투어는 성황리에 끝났다.)"
