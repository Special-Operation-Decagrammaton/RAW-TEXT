[translation]
10027050-1 = "제5화;누구에게나 있는 비밀"
10027050-2 = "동인회장"
10027050-5 = "결국 여기까지 왔군요. 메루리 씨."
10027050-6 = "어……? 네가 왜 여기 있냐?"
10027050-7 = "[s] \"아. 타카네다.\""
10027050-8 = "안녕하세요. 선생님. 평안하셨는지요. 절반 정도는 기대하지 않고 있었지만, 절반 정도는 또한 변덕에 의해 기대하고 있었던 상황에서, 두 분을 이렇게 뵙게 되다니."
10027050-9 = "한편으로는 놀라움과 황망함이, 다른 한 편으로는 반가움과 황송함이 자연스럽게 솟아오르는군요."
10027050-10 = "……앞의 건 나 들으라고 하는 말이야……?"
10027050-11 = "어떨까요. 그것은 또 해석에 따라서."
10027050-12 = "……하나만 묻자. 우리더러 출판부로 가 보라고 한 건…… 이걸 위해서였던 거야?"
10027050-13 = "당신은 모미지 씨를 위해 <루나>의 완결권을 찾으려 했죠. 그렇지만 그건 애초부터 불가능한 일이었어요."
10027050-14 = "<루나>의 22권은 원래부터 존재하지 않았으니까요."
10027050-15 = "하지만 인터넷에선, 극히 소량이지만 찾을 수 있다고……."
10027050-16 = "인터넷에서의 그 이야기는, 아마 이 행사에서 만들어진 여러 책들을 두고 한 말이겠죠."
10027050-17 = "<루나>는 비운의 명작이에요. 시대를 풍미하고 선풍적인 인기를 끌었지만……"
10027050-19 = "<루나>의 가장 치명적인 단점…… 그건 완결권이 출간되지 않았다는 사실이죠."
10027050-20 = "[s] \"어째서……?\""
10027050-21 = "흔한 일이예요. 루나는 인기를 끌었지만, 완결로 다가갈수록 시장의 외면을 받으면서, 점차 잊힌 작품이 된 거죠."
10027050-22 = "……정당한 평가를 받지 못한 탓이 가장 크다고 생각하지만요."
10027050-23 = "지금 보면 큰 무리 없는 내용이, 연재 당시에는 너무 과격하거나 위험하게 읽혔다던가, 평가 자체를 받을 기회를 얻지 못했다던가……"
10027050-24 = "시간이 지난 뒤에 비로소 가치를 인정받게 된 명작들의 수는, 저는 잘 알 수 없지만, 아마 0보다는 많겠죠."
10027050-25 = "평론가로서…… 저는 그런 작품들에 대해 다른 사람들보다는 조금 더 잘 알고 있답니다. 제가 조금이라도 더 많은 것을 읽고, 하나라도 더 평론을 남기고자 하는 이유이기도 하죠."
10027050-26 = "그렇다는 건…… 처음부터 <루나>의 완결권을 찾을 수 없다는 걸 알고 있었다는 거잖아?"
10027050-27 = "말해 봐. 왜 날 여기로, 그것도 그렇게 번거로운 과정을 거쳐…… 불러온 거지?"
10027050-31 = "어떤 의미로는, 당신을 시험해 본 거예요. 메루리 씨."
10027050-32 = "당신…… 메루리 씨라는, 인간관계가 그다지 좋지 않은 데다 자존심까지 강한 창작자가, 진심으로 다른 사람과 화해하기 위해 <루나>의 완결권을 찾고 있는 거라면……"
10027050-33 = "여느 때의 당신과 달리, 정말로 이곳까지 찾아올 수 있을까, 해서요."
10027050-34 = "……즉, 그만큼 간절하다면, 출판부를 찾아가 부탁을 하거나 머리를 숙이는 일도 할 수 있었을 거라는 이야기……?"
10027050-35 = "그래요. 그리고 정말로…… 이렇게 당신은, 여기까지 찾아온 것이로군요. 그리고……."
10027050-36 = "이런 일에, 괜히 휘말리게 한 건 죄송합니다. 선생님."
10027050-37 = "[s1] \"그런 건 괜찮아.\"\n[s2] \"타카네는…… 두 사람이 화해하길 바랐던 거구나.\""
10027050-38 = "이 무슨 포용력과 관대함……. 역시 선생님이시군요. 어느 성격 안 좋고 자존심 강한 창작자와는 근본적으로 다르세요."
10027050-39 = "아니, 너 너무 뻔뻔한 거 아니냐, 지금은……."
10027050-40 = "그, 그그, 글쎄요?! 저, 저는 단지! 메루리 씨가 스스로를 굽히는 모습을 보고 싶었달까, 그런 것뿐이었으니까요! 흐, 흥!"
10027050-41 = "맞아, 그럴 리가 없잖아. 속지 마. 선생! 여기에 어떤 꿍꿍이가 있을지……!"
10027050-42 = "당신은 꼭 한 마디가 많다구요!"
10027050-43 = "누가 할 소리인데, 그거!"
10027050-44 = "[s] \"자, 자. 서로 거기까지 하자.\""
10027050-45 = "……네, 선생님의 말씀대로."
10027050-46 = "쳇……!"
10027050-47 = "……뭐, 신경을 써줬다는 것 정도는…… 나도 알겠지만 말이야……"
10027050-48 = "……흥."
10027050-49 = "[s] \"그보다, 타카네는 여기에서 뭘 하고 있었어?\""
10027050-50 = "그것은……."
10027050-56 = "아, 회장. 여기 있었네. 다들 찾고 있다고. 어서 가야지."
10027050-57 = "!!!"
10027050-58 = "회장?"
10027050-59 = "[s] \"회장?\""
10027050-60 = "가만있자. 이런 장소, 이런 조건, 그리고 이곳에서 불리는 회장이라는 칭호를 고려하면……."
10027050-61 = "……이렇게 된 이상, 숨겨도 소용없겠지요. 네, 제가 <루나> 동호회의 회장이랍니다."
10027050-62 = "[s] \"타카네가…… 이 동인 행사를 주최한 주최자?\""
10027050-63 = "잠깐, 잠깐……. 지금 정보가 너무 몰려서 머릿속이 좀 혼란스러운데. 정리 좀 해 보자."
10027050-64 = "이 행사를 주최한 건, 역시 너도 <루나>의 완결권을 보고 싶어서?"
10027050-65 = "……그게 틀린 이유는 아니라고 한다면, 어떻게 나올 건가요. 메루리 씨?"
10027050-66 = "뭐야. 숨겨진 가치를 찾아준다느니 평론으로 작품을 한층 빛나게 해 준다느니 말은 그럴듯하게 해 놓고."
10027050-67 = "결국 하고 있었던 건 자기가 좋아하는 작품 수집이었잖아……. 뭔데, 그 이중잣대?"
10027050-73 = "가, 갑자기 또 무슨 짓이야?!"
10027050-74 = "저같이 평론가라는 직책을 가진 자가, 특정 작품의 애호가라는 사실이 밝혀지고……."
10027050-75 = "심지어 그 사실로, 남의 트집만 잡기 좋아하는 메루리 씨에게 놀림 받을 바에는……."
10027050-77 = "차라리 이대로, 침묵시켜 드리겠어요!"
10027050-78 = "무슨 말도 안 되는 짓이야?! 애당초 날 여기로 부른 게 자기면서!"
10027050-80 = "그건 그거고, 이건 이거예요!"
10027050-81 = "와, 진짜! 이중잣대도 적당히 하라고!"
10027050-82 = "하아…… 뭐 어쩔 수 없죠. 네. 맞아요."
10027050-83 = "그렇지만 설사 완결이 나지 않았다고 할지라도. 그 마지막을 보고 싶어 하는 사람들은 있기 마련이에요."
10027050-84 = "완결을 내지 않고 소식이 끊긴 작가를 걱정해도 좋고, 그걸 무책임하다며 아쉬워해도 좋겠지요."
10027050-85 = "그렇지만 <루나>를 아끼고, 계속해서 보고 싶고, 그 마지막을 알고 싶다는 팬들의 바람은 좀처럼 사라지지 않았습니다. 그래서 우리들은…… 각자, 자기만의 <루나>를 만들기 시작했던 것이죠."
10027050-86 = "그러다 보니, 어느새 여기에까지 이르게 된 것입니다만……."
10027050-87 = "어디에도 없는 마지막을, 각자가 자기 형태로 만들고 있다는 건가……"
10027050-88 = "결국은 해석의 문제에요. 메루리 씨. 열 명의 팬이 있으면, 열 개의 해석이 존재하기 마련이죠."
10027050-89 = "그 해석 중 무엇이 정답인지는, 아무도 알 수 없어요. 원칙적으로 모든 해석은 존중받아야 하고, 나름의 가치를 가지고 있죠."
10027050-90 = "그러면서도 자기의 해석과 창작이 조금이나마 더 인정받기를 바라는 것은, 창작이라는 행위가 기본적으로 욕망에 기반하기 때문일 거고요."
10027050-91 = "……하지만 결국 이것은 어디까지나 동인 활동."
10027050-92 = "결론적으로 당신이 원하는 대로 온전한 <루나>의 완결권을 찾아, 모미지 씨와 화해한다는 것은 원래부터 불가능한 일이었어요."
10027050-93 = "대신 여기에서 가장 평가가 좋은 <루나>의 완결 동인지를 찾아 선물한다면……"
10027050-94 = "모미지 씨와 화해할 수 있을지도 모르죠."
10027050-95 = "그래서…… 너는 나를 이리로……."
10027050-96 = "……."
10027050-97 = "……맞는 말이군. 확실히 맞는 말이야."
10027050-98 = "완결권을 찾을 수 없는 이상…… 어쩌면…… 그것만이 정답일지도 몰라……"
10027050-99 = "그렇지요? 당신도 가끔은 현실이라는 것을 볼 줄 아는군요."
10027050-103 = "……하지만 말이야."
10027050-105 = "세상에는 맞는 말이기에 오히려 반발하고 싶어지는 말도 있는 법이지!"
10027050-106 = "갑자기 또 무슨 소리예요?!"
10027050-108 = "나도 그릴 거야!"
10027050-109 = "뭘요?"
10027050-111 = "<루나>의 마지막 권!"
10027050-117 = "[ns] \"응?\""
10027050-118 = "……네?"
