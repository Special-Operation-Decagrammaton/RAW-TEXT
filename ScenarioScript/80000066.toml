[translation]
80000066-1 = "맛있어져라 모에모에 쿵"
80000066-3 = "(연락을 받고 카페 안으로 들어가자 한창 아르바이트 중이던 카린의 모습이 보였다.)"
80000066-4 = "아. 선생……. 아니, 주인님. 어서 와. 그렇잖아도 기다리고 있었어."
80000066-5 = "……응? 아, 아니. 그다지 큰일은 아니야. 그저……."
80000066-6 = "오늘이……. 그……. 그러니까……."
80000066-7 = "[s1] \"발렌타인 데이니까……?\"\n[s2] 눈치껏 자리에 앉는다."
80000066-8 = "으, 으음. 역시 선생님. 대화가 빨라서 좋군."
80000066-9 = "으, 으음. 역시 선생님. 대화가 빨라서 좋군."
80000066-10 = "평소에는 늘 선생님의 도움만 받고 있으니 말이지. 별거 아니지만, 이런 날이라도 보답을 해야겠다고 생각했어."
80000066-11 = "으음……. 이제 와서 생각하니 바쁜 와중에 괜히 부른 게 아닌가 오히려 걱정이 되는군."
80000066-12 = "……괜찮다고? 신경 쓰지 말라고?"
80000066-13 = "후후. 선생님은 늘 그런 식으로 말하니까. 오히려 괜찮다는 말을 곧이곧대로 믿기 어려워."
80000066-14 = "그렇지만, 그래……. 오늘은 조금은 억지를 부려 그 말을 의심하지 않기로 하지."
80000066-15 = "그러니 이건 내가 사는 거야, 선생님."
80000066-19 = "……응? 이건 초콜릿이 아니라 오므라이스 아니냐고?"
80000066-20 = "맞아. 여기는 메이드 카페니까. 따로 초콜릿을 주는 메뉴 같은 건 없어."
80000066-21 = "하지만……."
80000066-29 = "[ns3] \"케첩 대신 초콜릿을 뿌렸어……!?\"\n[ns4] \"초콜릿 오므라이스……라고!?\""
80000066-30 = "후후. 나름대로 고민을 해서 선생님을 위해 만들어낸 고유 메뉴야. 마음에 들었으면 좋겠군."
80000066-31 = "후후. 나름대로 고민을 해서 선생님을 위해 만들어낸 고유 메뉴야. 마음에 들었으면 좋겠군."
80000066-32 = "……음?"
80000066-33 = "……아직 한 가지가 부족한 거 같다고? 그, 그게 뭐지?"
80000066-34 = "……뭐라고?"
80000066-35 = "맛있어지는 주문……? 바, 바보 같은……! 물론 여기가 메이드 카페긴 하지만……!"
80000066-36 = "다, 다른 사람도 아닌 선생님에게 그런 걸……! 부끄럽게……!"
80000066-37 = "……윽……."
80000066-38 = "……후. 아냐. 좋아. 오늘은 선생님을 위한 날이니, 선생님이 원한다면 그 정도쯤은 해줄 수 있겠지."
80000066-39 = "……마……."
80000066-40 = "[s5] \"……마……?\"\n[s6] \"드디어……!\""
80000066-41 = "……마, 맛있어져라……!"
80000066-42 = "……마, 맛있어져라……!"
80000066-43 = "……모에모에……!!"
80000066-47 = "으아아아아아아-!!!"
