[translation]
11160-2 = "제16화;밝혀지는 진실"
11160-3 = "아비도스 대책위원회 부실"
11160-4 = "(히후미와 함께 아비도스 학교로 돌아와 다 같이 서류를 확인하고 있다.)"
11160-5 = "(콰앙-!)"
11160-6 = "이게 뭐야-!!! 무슨 소리야, 대체!!"
11160-7 = "……!!"
11160-8 = "트럭의 주행 기록엔 아비도스- 788만엔 수금이라고 적혀 있어. #n우리 학교에 왔던 그 트럭이 맞아."
11160-9 = "……하지만 바로 그다음에 카타카타 헬멧단, 임무 지원금 500만엔 전달이라는 기록이 적혀 있다……?"
11160-10 = "이 의미는……. 그렇다는 건……."
11160-12 = "우리한테 돈을 받은 뒤에 바로 헬멧단 본거지로 가서 임무 지원금을 전달했다는 거잖아!!"
11160-13 = "임무라니…… 카타카타 헬멧단에게……?"
11160-14 = "헬멧단의 배후가 바로…… 카이저 론이었다?"
11160-17 = "……."
11160-18 = "……."
11160-19 = "……."
11160-20 = "어째서?! 이해할 수 없어요! 학교가 파산하면 빌려준 돈도 돌려받을 수 없을 텐데…… #n대체 무슨 이유로 그런 행동을……?"
11160-21 = "흐음……."
11160-22 = "이건 일개 은행의 작당은 아닌 것 같네. #n카이저 코퍼레이션 본사의 의지가 개입되었다고 볼 수 밖엔……."
11160-23 = "……네. 그게 논리적인 추론이에요."
11160-27 = "여러가지로 고마웠습니다, 여러분."
11160-28 = "히후미 씨를 이상한 사건에 엮여들게 해서 미안해요."
11160-29 = "아, 아하하……."
11160-30 = "나중에 놀러가면 놀아달라고-."
11160-31 = "네, 얼마든지요."
11160-32 = "아직 자세한 정황은 드러나지 않았지만…… #n이건 카이저 코퍼레이션이 범죄자들이나 폭력단과 연관이 있다는 실체적 증거예요."
11160-33 = "돌아가서 이 사실을 티파티에게 보고하겠어요!"
11160-34 = "그리고 아비도스 학교의 현재 상황도요……."
11160-35 = "……."
11160-36 = "뭐, 티파티는 이미 다 알고 있을 걸?"
11160-37 = "네, 네?!"
11160-38 = "그정도 학원의 수뇌부들이 그정도도 모를 거라고 생각하진 않아. #n정보부 쪽 학생들도 놀고만 있는 건 아니니."
11160-39 = "그, 그럴 수가……. 알고 있는데도 여러분들을……."
11160-40 = "으헤~ 히후미 쨩은 순수하구나. #n이 세상은 선의로 가득 차 있는 건 아니라고."
11160-41 = "……."
11160-42 = "히후미 쨩의 마음은 고맙지만 그쪽에 알려봤자 딱히 뾰족한 수가 나오는 것도 아니고, #n오히려 우리한테 혼란만 가중될 거야."
11160-43 = "그, 그런가요……."
11160-44 = "지금 우리 학교는 폐교 직전인 상태라, 트리니티나 게헨나 같은 거대 학원의 행동을 #n컨트롤할 수 있는 힘이 없어. 무슨 말인지 알지?"
11160-45 = "……도와준다는 명목으로 와서 나쁜 마음을 먹어도 그 행동을 막을 수 없다……#n라는 이야기네요."
11160-46 = "……네. 그럴 가능성도 분명히 있네요.#n아우우…… 어렵네요, 정치라는 건."
11160-47 = "그치만…… 호시노 선배, 너무 비관적으로만 생각하는 건 아니에요? #n진짜로 도와줄 수도 있는데……."
11160-48 = "으헤~ 난 이미 남의 호의 같은 건 못 믿는, 때 묻은 못난 아저씨가 되어버렸다구."
11160-50 = "만의 하나, 라는 걸 무시했다가 이 학교가 이 꼴이 되어버린 거니까."
11160-51 = "……."
11160-52 = "……."
11160-53 = "그럼……"
11160-54 = "그러니까……"
11160-55 = "정말 뭐랄까…… 하룻밤 사이에 엄청난 일들이 있었네요."
11160-56 = "응. 무척 즐거웠어."
11160-57 = "……즐거웠던 건 시로코 선배뿐 아냐?"
11160-58 = "아, 아하하하……. 저도 즐거웠어요."
11160-59 = "이야, 파우스트 님. 신세를 졌네."
11160-60 = "그, 그렇게 부르지 말아주세요!"
11160-61 = "수영복 복면단 단장님!"
11160-62 = "여러분…… 히후미 씨가 곤란해하잖아요."
11160-63 = "어, 어쨌든 앞으로…… 쉽진 않겠지만 잘 되시길 바라고, 응원할게요."
11160-64 = "그럼…… 다음에 또 뵈어요, 여러분."
11160-66 = "여러분들도 고생하셨습니다. 일단 오늘 푹 쉬고 내일 다시 모여요."
11160-67 = "해산~"
11160-69 = "다음화;드리우는 먹구름"
