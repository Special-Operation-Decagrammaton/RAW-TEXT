[translation]
90001110-1 = "제11화;막다른 길"
90001110-3 = "좋아요. 그쪽은 어떤가요, 리오?"
90001110-4 = "새로운 예언자의 신호 분석 말이지?"
90001110-5 = "네. 신호 발생 순간의 세기에 비해서는, 지나치게 빨리 소실되어서 자세한 분석은 무리였지만……."
90001110-6 = "그래. 이건 분명 게부라와 호크마와는 또 다른…… 새로운 예언자야."
90001110-7 = "……우리가 여기에 온 뒤, 세 번째로 포착한 예언자라는 뜻이군요."
90001110-12 = "예언자 바겐세일이네."
90001110-13 = "하나 사고 싶군요. 얼마 정도 할까요?"
90001110-14 = "당신들…… 그런 걸 저쪽에서 판매할 리 없잖아요……."
90001110-15 = "신호의 좌표는 기록해 두었어. 전송할게."
90001110-16 = "지금 우리들의 위치와는 상당히 떨어져 있군요……? 으음. 살펴보고는 싶지만, 그러기 위해서는 또다시 거점을 이동시켜야 할 위험성이……."
90001110-17 = "애초에 그렇게 강력한 신호를 내보냈다는 것 자체가, 무언가를 의도하고 있었던 것일 수도 있고……."
90001110-18 = "이쪽으로 한 번 와 보라든가?"
90001110-19 = "벌레잡이 불빛 같은 것이로군요. 알 것 같습니다."
90001110-21 = "거기까지는 알 수 없지만, 저는 그럴 가능성도 배제할 수 없다고 봐요."
90001110-22 = "[s] \"그리고 이런 경우에는, 함정이 숨어 있기 마련이지…….\""
90001110-23 = "함정이 있으면 그것을 정면으로 돌파해 주는 것이, 우리 초현상특무부! 라고 말해 보고 싶은 참이기도 합니다만……."
90001110-24 = "난 반대야. 비합리적인 데다 비효율적이기까지 하니까."
90001110-25 = "응. 이번만은 리오 회장의 의견에 찬성."
90001110-26 = "어쩔 수 없군요. 아무도 편을 들어주지 않을 히마리 부장을 위해서라도, 저는 이번만큼은 히마리 부장의 의견을 존중하도록 하겠습니다. 죄송합니다. 리오 님."
90001110-30 = "으, 응……?"
90001110-34 = "팔다 남은 재고를 처리하는 느낌으로 동정심을 내비추지 말아 주시겠어요?! 거기에 아직 그렇게 하자고 의견을 확정 지은 것도 아닌데요?!"
90001110-36 = "부장이 잘못했네. 이런 때일수록 의견은 확실하게 제시해야지."
90001110-37 = "아이스 브레이킹이에요, 아이스 브레이킹!"
90001110-38 = "어쨌든, 함정과 위험을 무릅써 보고도 싶지만, 모두의 안전을 생각해서라도 그 길을 골라서는 안 될 것으로 보입니다."
90001110-39 = "그렇다면 내 AMAS를 활용하도록 해."
90001110-40 = "혹시나 이런 일이 있을까 해서, 고속 정찰 형태로 개조한 AMAS 드론이 있어."
90001110-41 = "그걸 신호가 포착된 좌표로 보내도록 할게."
90001110-42 = "어머나. 리오의 성격이 순수하게 도움이 될 때도 있군요?"
90001110-43 = "가장 합리적인 방법을 택한 것뿐인데, 굳이 그걸 언급하는 이유가 뭐지?"
90001110-44 = "……됐어요! 무슨 말을 못 하겠다니까요, 정말!"
90001110-47 = "드론 순항 중. 20분 정도 더 비행하면 목표 지점에 도착할 거야."
90001110-48 = "서서히 속도를 낮추고, 정찰 영상을 연결해서–"
90001110-49 = "–?!"
90001110-50 = "무슨 일이신가요, 리오 님?"
90001110-51 = "……정찰 AMAS 드론의 신호가, 소실됐어."
90001110-52 = "조금 더 자세하게 이야기해 봐. 회장."
90001110-53 = "말 그대로야. AMAS의 신호가 돌연 끊겼어."
90001110-54 = "마지막으로 보내온 정보 정도는 있을 것 아니에요?"
90001110-55 = "기다려. 지금 분석 중이야. 그러니까……?"
90001110-56 = "이, 건……?"
90001110-57 = "……무슨 일이라도 있나요?"
90001110-58 = "히마리. 지금 자료를 공유할게. 같이 분석해 줘."
90001110-59 = "당신이 저에게 선뜻 공유 요청을 보낸다는 건 정말로 드문 일이군요. 그리고 그렇다는 것은……."
90001110-60 = "그래. 지금 나는 진심으로 내 해석이 틀리기를 바라고 있어."
90001110-65 = "[ns] \"무슨 일이야? 괜찮은 거…… 맞지?\""
90001110-66 = "세상에……! 이렇다는 것은……!"
90001110-67 = "……내가 틀렸던 게 아닌 모양이네."
90001110-68 = "그래요. 당신이 이런 부분에서 실수를 할 리 없죠. 그 부분에서만큼은, 저는 당신을 인정하니까요."
90001110-69 = "무슨 일이길래 그러십니까, 히마리 부장?"
90001110-70 = "결론부터 빠르게 말하도록 하죠. 그 좌표에서 검측된 것은……."
90001110-71 = "……예전, <아트라하시스의 방주>를 보호하고 있었던, <다차원 배리어> 야."
90001110-72 = "[s] \"아트라하시스의 방주……??!!\""
90001110-77 = "네. 선생님. 틀림없습니다."
90001110-78 = "그렇지만 그게 왜 지금 여기에서 모습을 드러낸 거지? 다시 그때처럼…… 키보토스가 붉게 뒤덮이는 거야? 이상한 기계들이 생겨나고?"
90001110-86 = "불행인지, 다행인지는 모르겠지만, 그 정도 수준까지는 가지 않을 것 같아요."
90001110-87 = "그 말이 맞아. 적어도 해당 좌표에 차원 간섭의 징후까지는 일어나고 있지 않은 듯하니까."
90001110-88 = "그렇지만 <다차원 배리어>는 확실히 존재한다는 뜻이로군요?"
90001110-89 = "그래요. 그리고 지금까지의 정보를 종합해서, 이 상황에 대입하여 새로운 결론을 내려 보자면……."
90001110-90 = "예언자들이, 이제는 이름 없는 신들의 힘을 본격적으로 사용하기 시작했다는 뜻이 되겠지."
90001110-91 = "그리고 우리가 마주쳐 온 모든 '초현상' 중에서, 가장 강력하다고 볼 수 있는 방어 수단인 다차원 배리어를 활용하고 있다는 것은……."
90001110-92 = "거기에, 정말로 감춰야 할 무언가가 있을 거란 뜻이겠네."
90001110-93 = "네. 그리고 우리가 이 시점에서 할 수 있는 것은…… 무엇이, 있을까요?"
90001110-94 = "다차원 배리어에 대응하기 위해, 저희는 선생님께서 준비해 주셨던 <우트나피쉬팀의 배>에 의존할 수밖에 없었죠."
90001110-95 = "그리고 그 정도의, 이른바, '초현상'은, 좀처럼 두 번 다시 구하기 힘든 것일 테고요."
90001110-99 = "[ns] \"그래…… 그건 아마도, 그럴 거야…….\""
90001110-100 = "그렇겠죠……. 좀처럼 인정하고 싶지 않지만, 사방이 막힌 느낌이에요."
90001110-101 = "일단, 이름 없는 신들의 힘에 대응할 방법을 찾지 못하면, 사태의 근본적인 해결에는 이르지 못해."
90001110-102 = "그래요. 다차원 배리어는 일단 생각하지 않는다고 해도, 그 물질의 재구축 능력에서 기인하는, 무한에 가까운 예언자들의 회복력을 감당할 방법이 없죠."
90001110-103 = "확실히, 게부라도 호크마도 어느 정도 타격을 주었다고 생각했지만, 이내 원래의 모습을 되찾았습니다."
90001110-104 = "그래. 분명 재구축 이후의 원상 복구 과정을 순간적으로 처리한 것일 거야."
90001110-105 = "하지만, 예언자들이 이름 없는 신들의 힘을 그렇게까지 활용하고 있다면, 우리가 뭘 어떻게 대처할 수 있다는 건데?"
90001110-106 = "무엇보다 부장은 일단 생각하지 않는다고 했지만, 결국 다차원 배리어를 어떻게 해야 그다음으로 나아갈 수 있지 않을까?"
90001110-107 = "[s] \"그러고 보니 우리, 그때에는 어떻게 했더라?\""
90001110-108 = "그때는……."
90001110-111 = "저희의 가장 큰 목표는, 키보토스 상공에 있는 <아트라하시스의 방주>를 파괴하는 것입니다."
90001110-114 = "하지만 방주는 외부의 물리적인 개입이 불가능하게 만드는 <확률적 중첩 상태>의 배리어로 보호되고 있습니다."
90001110-115 = "이 배리어가 있는 이상 방주에 물리적으로 도달하는 것은 불가능."
90001110-117 = "따라서 저희는 <우트나피쉬팀의 배>를 그것과 동일한 <확률적 중첩 상태>로 만들어서 배리어를 통과할 예정입니다."
90001110-119 = "하지만 결과적으로 그 접근 방식은 실패했습니다. 아트라하시스의 방주가 스스로의 상태 값을 변경했기 때문이었죠."
90001110-120 = "그래서 우리가 결과적으로 기대게 된 것은……."
90001110-121 = "아……!"
90001110-131 = "[ns] \"……!\""
90001110-136 = "다음화;제안"
