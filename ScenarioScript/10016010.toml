[translation]
10016010-1 = "제1화;불타는 실행위원회"
10016010-2 = "황륜대제 실행위원회 사무실"
10016010-10 = "……다들 바쁜 일정을 뒤로한 채 이번 황륜대제에 참가해줘서 고마워."
10016010-11 = "개회식도 무사히 끝났으니, 앞으로의 운영 일정과 참고 사항에 대해 가볍게 설명할게."
10016010-12 = "물론 개회식 중에 몇 가지 '사소한' 문제가 발생하긴 했지만……"
10016010-13 = "어머. 밀레니엄 학원 측은 개회식 때 있었던 그 사고가 사소하다고 판단하시는 건가요?"
10016010-14 = "그, 그건 그러니까……"
10016010-15 = "트리니티가 내보낸 학생 대표가 공개 석상에서 황륜대제의 권위를 실추시키는 발언을 했는데 이를 어물쩍 넘길 수는 없지요."
10016010-16 = "이 일은 트리니티 학원 측에 확실히 책임을 물어야 한다고 생각합니다만."
10016010-17 = "……."
10016010-18 = "죄, 죄, 죄송합니다……"
10016010-19 = "저희 <시스터후드> 측에서도 설마 그런 말씀을 하실 거라고는 생각지 못해서……"
10016010-20 = "아, 아니, 사실 생각을 전혀 안 한 건 아니지만…… 그래도 설마…… 이, 이렇게까지 저질러 버리실 줄은……."
10016010-21 = "생각을 하긴 했구나……."
10016010-22 = "후후, 이렇게 된 이상 트리니티는 이번 실행위원에서 손을 떼는 게 어떨까요?"
10016010-23 = "그 대신 저희 선도부의 인력으로 그 빈자리를 채우는 걸로 하시죠."
10016010-24 = "네?! 여기서 게헨나 학생을 더 늘리겠다고요?"
10016010-25 = "이 대회 자체를 망쳐버릴 생각인가요, 선임행정관?"
10016010-26 = "이미 어떤 학원 덕분에 망해가고 있는 것 같은데요?"
10016010-27 = "저…… 다, 다들 조금만 진정해 주세요!"
10016010-28 = "<황륜대제>는 학원을 가리지 않고 모두가 사이좋게 선의의 경쟁을 치르는 평화의 제전이잖아요?"
10016010-29 = "그런데 대회가 시작하기도 전에 여러분이 이렇게 다투고 있다는 사실을 다른 학생 여러분께서 알게 되신다면……"
10016010-30 = "분명 모두 슬퍼하실 거예요!"
10016010-31 = "……일단은, 알겠습니다."
10016010-32 = "뭐, 실행위원들끼리 싸우고 있다는 사실이 알려진다면 슬퍼하기는커녕 즐거워할 학생들이 더 많겠지만요."
10016010-36 = "말려줘서 고마워. 이오치 양이라고 했던가? 덕분에 한숨 돌렸네."
10016010-37 = "아, 아녜요. 오히려 저희 쪽에서 폐를 끼쳐서 죄송합니다……."
10016010-38 = "그보다 그렇게 어렵게 말씀하지 않으셔도 괜찮아요. 저는 편하게 마리라고 불러주세요!"
10016010-39 = "(어째서 트리니티 학원에서 이 아이까지 더해 두 사람의 실행위원을 보내주었는지 약간은 알 것 같네……)"
10016010-45 = "……상기 사유로 아래 종목은 경기 내용이 일부 수정되었고, 준비에 필요한 시간을 고려하여 경기 순서는 유인물에 적힌 대로 조정되었어."
10016010-46 = "다소 긴급히 조정된 안건이지만 참가 학교 모두 이견 없다고 회신했으니, 문제는 없으리라 생각하지만……"
10016010-47 = "그 외에 또 질문 있는 학생?"
10016010-48 = "[s] \"하나 물어봐도 돼?\""
10016010-49 = "네, 학생은 아니시지만…… 샬레의 [USERNAME] 선생님."
10016010-50 = "선생님께서는 어떤 점이 궁금하신가요?"
10016010-51 = "[s1] \"이번 황륜대제는 밀레니엄이 주관하는 것으로 알고 있는데……\"\n[s2] \"실행위원은 다른 학교의 학생도 맡을 수 있는 거야?\""
10016010-52 = "네. <황륜대제>의 경기 운영은 특정 학원이나 집단에 유리하지 않도록 공정하게 진행되어야 하니까요."
10016010-53 = "네. <황륜대제>의 경기 운영은 특정 학원이나 집단에 유리하지 않도록 공정하게 진행되어야 하니까요."
10016010-54 = "경기의 운영 관리를 주최교의 임원이 도맡게 되면 부정이 발생하기 쉽고 선수가 불복하는 일도 생길 수 있기 때문에, 실행위원은 주최교와 상관없이 늘 여러 학교의 학생들이 나누어 맡았습니다."
10016010-55 = "더욱이 대운동회에는 다양한 학원에서 학생들이 모여든 만큼, 대회의 안전을 위협하는 문제 학생이 나타났을 때 해당 학교의 실행위원들이 대응한다면 더 효율적으로 단속을 할 수 있지요."
10016010-56 = "그래서 황륜대제의 실행위원은 각 학원 자치구를 대표할 수 있는 학생회 임원들이 맡는 것이 관례였습니다만……"
10016010-58 = "……어째서 이번 대운동회에는 <만마전>과 <티파티>의 임원들이 오지 않은 거야?"
10016010-59 = "그러게 말이죠. 저희 선도부로서는 오히려 항의를 하고 싶을 정도예요."
10016010-60 = "<만마전>의 너구리…… 아니, 마코토 의장께서는 다음과 같은 이유로 참여를 거절하셨습니다."
10016010-62 = "게헨나의 탑인 만마전이 실행위원을 하며 고작 평범한 학생들의 뒤치다꺼리나 하라고?"
10016010-63 = "……이 마코토 님이 그런 귀찮아 보이는 일을 직접 할 수는 없지! 거절이다!"
10016010-64 = "대신 운영에 대한 책임은 선도부가 알아서 전부 지도록! 키키킷!"
10016010-66 = "……그럼 티파티의 호스트 여러분은?"
10016010-67 = "현 티파티의 호스트이신 나기사님께서는 다음과 같은 축전으로 인사를 대신하셨습니다."
10016010-69 = "공사가 다망하여 <황륜대제>에 직접 참여하지 못한 것을 매우 유감스럽게 생각합니다."
10016010-70 = "하스미 씨를 통해 좋은 홍차와 함께 심심한 사과의 말씀을 전달 드립니다."
10016010-71 = "……그럼, <황륜대제>의 성공적인 개최를 기원하겠습니다."
10016010-73 = "……뭔가요, 결국은 귀찮아서 못 온다는 뜻이잖아요."
10016010-74 = "실례군요. 티파티의 호스트는 그 자리에 앉아있는 것만으로도 처리해야 하는 일이 잔뜩 몰려드는 중책."
10016010-75 = "나기사 님은 분명 안타까운 마음으로 부득이하게 황륜대제의 참가를 고사하셨을 겁니다."
10016010-76 = "그렇게 말한다면 만마전에도 바쁜 일이 잔뜩—"
10016010-77 = "……하아. 그 너구리들만큼은 옹호할 수 없겠네요."
10016010-78 = "분명 중요한 일처리는 히나 부장님께 미뤄두고 쓸데없는 모략에나 힘쓰고 있을 테니까요."
10016010-79 = "그나저나 지금 마시고 있는 이 차가 티파티에서 가져온 그 홍차인가요?"
10016010-80 = "설마…… 나중에 터무니없는 비싼 대가를 요구한다든가, 그러지는 않으시겠지요?"
10016010-81 = "걱정마시길. 게헨나의 학생에게 대접할 홍차는 특별히 근처 편의점에서 제일 싼 걸로 준비했으니까요."
10016010-82 = "어머나. 수돗물이 아닌 것에 감사를 드려야겠네요."
10016010-83 = "저, 저기…… 조금만 말을 더 부드럽게……"
10016010-87 = "……게헨나와 트리니티의 학생회 임원들이 참가하지 못한 이유는 충분히 이해했어."
10016010-88 = "하지만……"
10016010-89 = "최소한 선도부나 정의실현부의 부장들은 와야 했던 거 아니야?!"
10016010-90 = "트리니티와 게헨나에서 존재만으로도 불량 학생들을 제압할 수 있는 학생은 두 부장 외에는 없다는 걸 다들 잘 알고 있으면서……"
10016010-91 = "그건…… 히나 부장님께는 부탁드릴 다른 일이 있기 때문에……"
10016010-92 = "다른 일이라면……?"
10016010-93 = "닭을 잡는 데 소를 잡는 칼을 쓸 수는 없는 법. 사람에게는 나름의 적재적소가 있는 법이니까요."
10016010-94 = "츠루기는 정의실현부의 부장이지만, 실행위원회와 같은 대외업무는 원래 제가 맡고 있습니다."
10016010-95 = "게다가 츠루기가 실행위원을 맡게 된다면 그만큼 출전할 수 있는 경기의 숫자도 줄어드니……"
10016010-96 = "……아."
10016010-97 = "……그 말인, 즉."
10016010-98 = "대운동회에서 좋은 기록을 낼 수 있도록, 각 학교의 전력이 될 수 있는 부장들은 선수로 빼 둔 채 '운동치'인 학생들만 실행위원으로 파견되었다는 뜻……?"
10016010-100 = "우, 운동치라뇨. 말씀이 심하시네요!"
10016010-101 = "운동 신경이 뛰어난 편은 아니지만, 그래도 정의실현부의 부부장으로서 최소한의 체력은 갖추고 있다고 생각합니다만."
10016010-102 = "아, 물론 게헨나에는 우수한 선수들이 잔뜩 있기에 제가 경기에 직접 참가할 생각은 없지만요."
10016010-103 = "그건 저도 동감입니다. 경기에는 좀 더 우수한 선수를 보내는 편이 종합 우승에 더욱 유리하겠지요."
10016010-107 = "정말 다들…… 너무한 거 아니야?!"
10016010-108 = "학교 입장에서 종합 우승이 중요하다는 건 알고 있지만, 대운동회의 운영은 뒷전으로 미룬 채 다들 자기 학교만 생각하고!"
10016010-109 = "우리 밀레니엄 학원이라고 해서 승부에 열의가 없는 건 아니거든?!"
10016010-111 = "하지만 밀레니엄의 학생들은 전통적으로 스포츠 승부에는 관심이 없지 않았던가요?"
10016010-112 = "그렇네요. 야구 인터하이에서도 언제나 순위권 밖이었고, 경기 내용보다는 기행으로 더 유명할 정도니……"
10016010-114 = "그, 그건 사실이지만……"
10016010-115 = "하지만 이번 황륜대제는 우리 밀레니엄 학원에서 개최한 만큼, 전력을 다하겠어!"
10016010-116 = "밀레니엄 사이언스 스쿨이 자랑하는 과학적인 경기 분석과 스포츠 트레이닝을 통해 보란 듯이 종합 우승을 따내 보일 테니까!"
10016010-124 = "뭔가…… 생각했던 것보다 더 험악한 분위기가 되어 버렸네요."
10016010-125 = "키보토스의 평화를 기원하는 제전을 돕는 일이라 해서 기쁜 마음으로 자원했는데, 설마 이런 상황이 되어버릴 줄이야……"
10016010-126 = "[s3] \"다들 활기차 보여서 좋지 않아?\"\n[s4] \"경기 전에 가벼운 신경전 정도는 뒤따르는 법이지.\""
10016010-127 = "선생님께서 그렇게 말씀하신다면 괜찮겠지만……"
10016010-128 = "선생님께서 그렇게 말씀하신다면 괜찮겠지만……"
10016010-132 = "그보다, 그 어중간하게 가슴을 강조한 저지는 뭔가요? 트리니티는 체육복조차 제대로 입지 못하는 건가요?"
10016010-133 = "그러니까 이건…… 억지로 올리려 했지만 불가항력으로……"
10016010-134 = "그보다 당신이 다른 사람의 옷차림을 지적할 처지인가요?!"
10016010-135 = "부디 큰 사고 없이 대운동회가 진행되기를……"
