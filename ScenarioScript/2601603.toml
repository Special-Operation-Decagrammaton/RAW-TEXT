[translation]
2601603-1 = "한 서기에 따르면,"
2601603-2 = "과연, 바다는 여전히 물이 많은 곳이군요!"
2601603-3 = "일단 팩트 하나부터 적립! 시작이 순조롭네요!"
2601603-4 = "[s] \"아주 작은 것부터 만족하기, 좋네!\""
2601603-5 = "그러면 출동! 가시죠, 선생님!"
2601603-10 = "속닥속닥, 이러쿵 저러쿵……."
2601603-11 = "속닥속닥, 이러쿵 저러쿵……."
2601603-12 = "안녕하세요! 황송합니다! <주간 만마전>에서 나왔습니다!"
2601603-13 = "본의 아니게 지나가다 듣게 되었는데요! 취재를 위해 몇 가지 여쭤봐도 될까요?"
2601603-14 = "취재? 뭐야 뭐야? 방송 같은 거? 나 TV 나오는 거야?"
2601603-15 = "TV보다 훨씬 좋은 거예요! 괜찮으시다면 염치 불고하고-!"
2601603-17 = "두 분, 아까 <속닥속닥, 이러쿵저러쿵> 이라고 하셨는데요!"
2601603-18 = "혹시 무슨 의미가 있는 건가요?!"
2601603-19 = "어? 모르는 거야? 알고서 온 거 아니었어?"
2601603-20 = "여기서 <속닥속닥, 이러쿵저러쿵> 이라고 소리 내서 말하면 소원이 이루어진대!"
2601603-21 = "그런 전설이 있다고 해서, 우리도 소원 빌려고 와봤어!"
2601603-22 = "아는 사람만 아는 명소야!"
2601603-24 = "호오호오호오!! 바다에 얽힌 전설 이야기! 심지어 아직 알려지지 않은 명소!"
2601603-25 = "우핫-! 이건 특종이네요! 어디어디어디- 메모장이-"
2601603-30 = "으, 으잉?"
2601603-31 = "[s] \"뭔가 문제라도 있니?!\""
2601603-32 = "별건 아니고 엄청 큰 문제기는 한데요……!"
2601603-33 = "메모장…… 두고 왔습니다……!"
2601603-34 = "들떠서 급하게 챙겨왔는데, 메모장이 아니라 돌로 된 코스터였네요……!"
2601603-35 = "[s] \"아…… 은근히 비슷하게 생긴 게 있지…….\""
2601603-36 = "핸드폰도 더워서 그런지 배터리가 다 떨어졌고,"
2601603-37 = "페, 펜은 잘 들고 왔는데……."
2601603-38 = "이러면 괘, 괜찮겠네요! 손바닥에 적으면 되니까!"
2601603-40 = "아, 그러고 보니 저기 숲에서 밤마다 이상한 소리가 들린다는데, 그건 취재했어?"
2601603-41 = "그거 진짜일까? 엄청 무섭던데!"
2601603-42 = "전설도 모자라서 제목부터 흥미로울 것 같은 이야기까지?!"
2601603-43 = "서, 선생님! 혹시 선생님 손바닥도 빌려주실 수 있나요?!"
2601603-44 = "다른 곳도 좋아요! 잊어버리기 전에 메모해야……!"
2601603-45 = "[s1] \"스톱! 스톱!\"\n[s2] \"오해할 거야! 어떤 방식으로건!!\""
2601603-48 = "하지만, 이런 특종을 단순히 기억만 의존해서 쓸 수는 없어요!"
2601603-49 = "여러 이야기가 뒤섞이거나, 기억이 흐려지면서 창작이 될 수도 있으니까요!"
2601603-53 = "어쩔 수 없습니다! 제 등에라도 써주세요!"
2601603-54 = "[s] \"몸에 적는 것에서 벗어나 보면 어떨까?!\""
2601603-55 = "그렇지만, 모래밖에 없는 이 바닷가에 뭔가 적을 만한 게……."
2601603-56 = "어? 모래?"
2601603-57 = "앗!! 그런 방법이!!!"
2601603-68 = "-그래서! 콘비프 깡통은 그런 모양인 거래!"
2601603-69 = "그랬던거구나, 그렇구나!"
2601603-70 = "중간부터는 바다랑 상관없기는 했는데요! 그래도 무지무지무지 재밌네요!"
2601603-71 = "앗! 이야기하다보니 벌써 시간이! 집합 시간 다 됐어!"
2601603-72 = "우리 이만 가볼게! 수고해-! 기사 잘 쓰고!"
2601603-73 = "말해주신 것 모두 빠짐없이, 모래사장에 적었어요! 아하하!"
2601603-74 = "취재 협력 감사합니다아-! 바이바이바이-!"
2601603-79 = "이야-! 보람찬 하루였네요!"
2601603-80 = "모래사장에 글씨를 적는다니, 제 임기응변, 대단하죠!"
2601603-81 = "카메라 배터리는 남아있으니, 이걸로 해변을 찰칵! 하고 찍으면 메모는 오케이!"
2601603-82 = "자아- 모래들 모두, 스마-일-"
2601603-86 = "에, 엥?"
2601603-89 = "와, 와아앗-!!"
2601603-92 = "아?"
2601603-93 = "[s3] \"치아키, 괜찮니?!\"\n[s4] \"갑자기 웬 파도가?!\""
2601603-96 = "하루 종일 한 메모……. 없다……?"
2601603-97 = "커……컨트롤…… 제트……."
2601603-98 = "아……?"
2601603-99 = "[s] \"망가지면 안 돼, 치아키!!\""
2601603-100 = "아……?"
2601603-102 = "(이후, 풀죽은 치아키를 위로하며 돌아왔다.)"
2601603-103 = "(대신, 최근의 일화들을 들려주니, 금세 기운을 차렸다.)"
