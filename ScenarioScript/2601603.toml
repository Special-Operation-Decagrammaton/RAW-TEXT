[translation]
2601603-1 = "ตามคำบอกเล่าของเลขาคนหนึ่ง"
2601603-2 = "ยังไงทะเลก็ยังเป็นที่ที่มีน้ำเยอะอยู่ดีนะคะ!"
2601603-3 = "รวบรวมข้อเท็จจริงได้หนึ่งอย่างแล้ว! เริ่มต้นได้ราบรื่นเลยค่ะ!"
2601603-4 = "[s] \"รู้จักพอใจกับเรื่องเล็กๆ ด้วย ดีจังเลยนะ!\""
2601603-5 = "งั้นก็ออกปฏิบัติการ! ไปกันเลยค่ะ คุณครู!"
2601603-6 = ""
2601603-8 = ""
2601603-9 = ""
2601603-10 = "ซุบซิบซุบซิบ อย่างนั้นอย่างนี้..."
2601603-11 = "ซุบซิบซุบซิบ อย่างนั้นอย่างนี้..."
2601603-12 = "สวัสดีค่ะ! ขออภัยที่รบกวนนะคะ! ฉันมาจาก <แพนเดโมเนียม โซไซตี้รายสัปดาห์> ค่ะ!"
2601603-13 = "พอดีฉันเดินผ่านมาแล้วบังเอิญได้ยินน่ะค่ะ! ขอสัมภาษณ์อะไรสัก 2-3 ข้อเพื่อเก็บข้อมูลได้มั้ยคะ?"
2601603-14 = "เก็บข้อมูล? อะไรน่ะ เอาไปออกอากาศเหรอ? นี่ฉันจะได้ออกทีวีเหรอ?"
2601603-15 = "ดีกว่าทีวีเยอะเลยค่ะ! ถ้าไม่รังเกียจ ฉันขอถือวิสาสะถามเลยนะคะ!"
2601603-17 = "เมื่อกี้ทั้งสองคนพูดว่า <ซุบซิบซุบซิบ อย่างนั้นอย่างนี้> ใช่มั้ยคะ!"
2601603-18 = "มีความหมายอะไรเป็นพิเศษหรือเปล่าคะ?!"
2601603-19 = "อ้าว? ไม่รู้หรอกเหรอ? นึกว่ารู้แล้วถึงมาถามเสียอีก?"
2601603-20 = "ถ้าพูดว่า <ซุบซิบซุบซิบ อย่างนั้นอย่างนี้> ออกมาดังๆ ที่นี่ คำขอจะเป็นจริงละ!"
2601603-21 = "พอได้ยินว่ามีตำนานแบบนั้น พวกเราก็เลยมาลองขอพรดู!"
2601603-22 = "เป็นสถานที่ลับที่รู้กันเฉพาะคนวงในน่ะ!"
2601603-24 = "โอ้โฮ โอ้โฮ โอ้โฮ!! ตำนานเกี่ยวกับทะเล! แถมยังเป็นสถานที่เด็ดที่ยังไม่เป็นที่รู้จักอีกด้วย!"
2601603-25 = "ว้าว! นี่เป็นสกู๊ปพิเศษได้เลยค่ะ! ไหนๆๆ สมุดจดอยู่ไหน"
2601603-26 = ""
2601603-28 = ""
2601603-29 = ""
2601603-30 = "เอะ... เอ๋?"
2601603-31 = "[s] \"มีปัญหาอะไรเหรอ?!\""
2601603-32 = "ไม่มีอะไรมากหรอกค่ะ แค่ปัญหาใหญ่มากเลย...!"
2601603-33 = "ฉัน... ลืมเอาสมุดจดมาค่ะ...!"
2601603-34 = "ฉันตื่นเต้นจนรีบหยิบมา แต่ที่หยิบมาดันไม่ใช่สมุดจด เป็นจานรองแก้วที่ทำจากหินค่ะ...!"
2601603-35 = "[s] \"อ่า... มันก็หน้าตาคล้ายกันอยู่เหมือนกันนะ...\""
2601603-36 = "โทรศัพท์ก็แบตหมดแล้ว ไม่รู้ว่าเป็นเพราะอากาศร้อนหรือเปล่า"
2601603-37 = "ตะ... แต่ถ้าเป็นปากกา ฉันเอามาด้วยค่ะ..."
2601603-38 = "แบบนี้ก็ มะ... ไม่เป็นไรค่ะ! เขียนลงฝ่ามือก็ได้!"
2601603-40 = "อ้อ จะว่าไป ว่ากันว่าทุกคืนมีเสียงแปลกๆ ดังมาจากป่าตรงโน้นด้วย ไปทำข่าวเรื่องนั้นมาหรือยัง?"
2601603-41 = "เรื่องนั้นจะจริงมั้ยนะ? น่ากลัวสุดๆ เลย!"
2601603-42 = "นอกจากตำนานแล้ว ยังมีเรื่องที่แค่ฟังหัวข้อก็น่าสนใจอีกเหรอคะ?!"
2601603-43 = "คะ... คุณครู! ขอยืมฝ่ามือของคุณครูด้วยได้มั้ยคะ?!"
2601603-44 = "ตรงอื่นก็ได้ค่ะ! ต้องจดไว้ก่อนจะลืม...!"
2601603-45 = "[s1] \"สต็อป! สต็อป!\"\n[s2] \"เดี๋ยวคนจะเข้าใจผิดนะ! ไม่ว่าจะตรงไหนก็ตาม!!\""
2601603-48 = "แต่จะเขียนสกู๊ปพิเศษแบบนี้โดยอาศัยแค่ความจำไม่ได้นี่คะ!"
2601603-49 = "เรื่องต่างๆ อาจปะปนกัน หรือพอความทรงจำเลือนราง ก็อาจกลายเป็นเรื่องแต่งไปก็ได้ค่ะ!"
2601603-50 = ""
2601603-52 = ""
2601603-53 = "ช่วยไม่ได้แล้วค่ะ! เขียนบนหลังฉันก็ได้ค่ะ!"
2601603-54 = "[s] \"ลองหาวิธีที่ไม่ต้องเขียนบนตัวดูมั้ย?!\""
2601603-55 = "แต่ชายหาดที่มีแต่ทรายแบบนี้ จะมีอะไรให้เขียนได้..."
2601603-56 = "เอ๊ะ? ทราย?"
2601603-57 = "อ๊ะ!! มีวิธีนั้นด้วยนี่นา!!!"
2601603-58 = ""
2601603-60 = ""
2601603-62 = ""
2601603-63 = ""
2601603-64 = ""
2601603-65 = ""
2601603-67 = ""
2601603-68 = "เพราะแบบนั้นไง! กระป๋องคอร์นบีฟถึงมีรูปร่างแบบนั้น!"
2601603-69 = "อย่างนี้นี่เอง เข้าใจแล้ว!"
2601603-70 = "ถึงตั้งแต่ช่วงกลางเรื่องจะไม่เกี่ยวกับทะเลแล้ว! แต่ก็เป็นเรื่องที่สนุกมากๆๆ เลยค่ะ!"
2601603-71 = "อ๊ะ! คุยเพลินจนเวลาผ่านไปขนาดนี้แล้ว! ใกล้ถึงเวลารวมตัวแล้วละ!"
2601603-72 = "พวกเราไปก่อนนะ! สู้ๆ! เขียนข่าวให้ดีล่ะ!"
2601603-73 = "ฉันจดทุกเรื่องที่เล่ามาลงบนหาดทรายครบแล้วค่ะ! อะฮะฮ่า!"
2601603-74 = "ขอบคุณที่ให้ความร่วมมือในการเก็บข้อมูลนะคะ! บ๊ายบาย!"
2601603-75 = ""
2601603-77 = ""
2601603-79 = "โอ้โฮ! ช่างเป็นวันที่คุ้มค่าจริงๆ เลยค่ะ!"
2601603-80 = "คิดวิธีเขียนลงบนหาดทรายได้ด้วย ฉันแก้ปัญหาเฉพาะหน้าเก่งใช่มั้ยล่ะคะ!"
2601603-81 = "กล้องยังมีแบตเหลืออยู่ แค่ใช้ถ่ายชายหาด แชะ! ก็เก็บบันทึกไว้ได้แล้วค่ะ!"
2601603-82 = "เอาละ ทรายทุกเม็ด สไมล์~"
2601603-83 = ""
2601603-86 = "เอะ... เอ๋?"
2601603-89 = "วะ... ว้ายยย!!"
