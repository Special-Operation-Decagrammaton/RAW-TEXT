[translation]
2601603-1 = "根據某位書記所言"
2601603-2 = "海果然是水很多的地方呢！"
2601603-3 = "先記下一個事實！開頭很順利呢！"
2601603-4 = "[s] 「從小事開始感到滿足，很好呢！」"
2601603-5 = "那麼出動！走吧，老師！"
2601603-6 = ""
2601603-8 = ""
2601603-9 = ""
2601603-10 = "嘀嘀咕咕，這樣那樣……"
2601603-11 = "嘀嘀咕咕，這樣那樣……"
2601603-12 = "您好！打擾了！我們來自週刊萬魔殿！"
2601603-13 = "剛才路過時不小心聽到了！為了採訪，可以請教幾個問題嗎？"
2601603-14 = "採訪？什麼什麼？是電視節目之類的嗎？我要上電視了嗎？"
2601603-15 = "是比電視還好的東西哦！如果不介意的話，那我就不客氣了～！"
2601603-17 = "兩位剛才說了「嘀嘀咕咕，這樣那樣」對吧！"
2601603-18 = "請問那有什麼特別的意思嗎！？"
2601603-19 = "咦？你不知道嗎？不是知道才來的嗎？"
2601603-20 = "聽說在這裡大聲說出「嘀嘀咕咕，這樣那樣」的話，願望就會實現哦！"
2601603-21 = "因為聽說有這樣的傳說，我們也來許願了！"
2601603-22 = "這裡是只有內行人才知道的名勝哦！"
2601603-24 = "哦哦哦哦！！與海有關的傳說！而且還是鮮為人知的名勝！"
2601603-25 = "嗚哈～！這是獨家新聞呢！在哪在哪在哪～筆記本～"
2601603-26 = ""
2601603-28 = ""
2601603-29 = ""
2601603-30 = "咦，咦咦？"
2601603-31 = "[s] 「有什麼問題嗎！？」"
2601603-32 = "雖然不算什麼大事，但其實是個超大的問題……！"
2601603-33 = "筆記本……忘記帶了……！"
2601603-34 = "太興奮匆匆忙忙抓了就走，結果帶的不是筆記本，而是石頭杯墊……！"
2601603-35 = "[s] 「啊……的確有些東西長得意外地像……」"
2601603-36 = "手機大概也是因為太熱，電池都沒電了……"
2601603-37 = "筆，筆倒是有帶來……"
2601603-38 = "這樣就，就沒問題了！寫在手掌上就好了！"
2601603-40 = "啊，說到這個，聽說那邊的樹林每晚都會傳出怪聲，你們採訪過了嗎？"
2601603-41 = "那是真的嗎？超可怕的！"
2601603-42 = "不只有傳說，還有光聽標題就很有趣的故事！？"
2601603-43 = "老，老師！你的手掌也可以借我一下嗎！？"
2601603-44 = "其他地方也可以！得趁忘記之前記下來……！"
2601603-45 = "[s1] 「停！停！」\n[s2] 「會被誤會的！不管是哪種意義上！！」"
2601603-48 = "可是，這種獨家新聞不能只靠記憶來寫啊！"
2601603-49 = "各種故事可能會混在一起，記憶也可能變模糊，最後變成創作啊！"
2601603-50 = ""
2601603-52 = ""
2601603-53 = "沒辦法了！請寫在我背上吧！"
2601603-54 = "[s] 「要不要先別考慮寫在身體上！？」"
2601603-55 = "可是這片海邊只有沙子，哪有東西可以寫……"
2601603-56 = "咦？沙子？"
2601603-57 = "啊！！還有這種方法！！！"
2601603-58 = ""
2601603-60 = ""
2601603-62 = ""
2601603-63 = ""
2601603-64 = ""
2601603-65 = ""
2601603-67 = ""
2601603-68 = "──所以說！鹹牛肉罐頭才會是那種形狀！"
2601603-69 = "原來是這樣，原來如此！"
2601603-70 = "雖然中途開始就跟海沒什麼關係了！不過還是超級超級超級有趣呢！"
2601603-71 = "啊！聊著聊著都這個時間了！集合時間快到了！"
2601603-72 = "我們先走了！辛苦了～！報導要好好寫哦！"
2601603-73 = "你們說的我全都一字不漏地寫在沙灘上了！啊哈哈！"
2601603-74 = "感謝協助採訪～！掰掰掰～！"
2601603-75 = ""
2601603-77 = ""
2601603-79 = "哎呀～！真是收穫滿滿的一天呢！"
2601603-80 = "居然想到在沙灘上寫字，我的應變能力很厲害吧！"
2601603-81 = "相機還有電，只要用這個把海灘喀嚓！拍下來，筆記就OK了！"
2601603-82 = "來～沙子們，笑一個～"
2601603-83 = ""
2601603-86 = "咦，咦？"
2601603-89 = "哇，哇啊啊～！！"
