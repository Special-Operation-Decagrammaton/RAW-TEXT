2601603-92 = "啊？"
2601603-93 = "[s3] 「千秋，你沒事吧！？」\n[s4] 「怎麼突然來了一陣浪！？」"
2601603-96 = "一整天的筆記……沒了……？"
2601603-97 = "Ctrl……Z……"
2601603-98 = "啊……？"
2601603-99 = "[s] 「千秋，你不能崩潰啊！！」"
2601603-100 = "啊……？"
2601603-102 = "（之後一邊安慰垂頭喪氣的千秋一邊回去）"
2601603-103 = "（作為補償，跟他說了最近的趣事後，他很快就恢復了精神）"
