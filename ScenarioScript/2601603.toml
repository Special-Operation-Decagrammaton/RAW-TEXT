2601603-92 = "อ่า?"
2601603-93 = "[s3] \"จิอากิ เป็นอะไรมั้ย?!\"\n[s4] \"จู่ๆ คลื่นมาจากไหนเนี่ย?!\""
2601603-96 = "ที่จดมาทั้งวัน... หายหมดแล้ว... เหรอ?"
2601603-97 = "คะ... คอนโทรล... แซด..."
2601603-98 = "อ่า...?"
2601603-99 = "[s] \"จิอากิ อย่าเพิ่งสติหลุดสิ!!\""
2601603-100 = "อ่า...?"
2601603-102 = "(หลังจากนั้นคุณครูก็ปลอบจิอากิที่หงอยไป และเดินกลับด้วยกัน)"
2601603-103 = "(แต่พอเล่าเรื่องสนุกๆ ที่เกิดขึ้นช่วงนี้ให้ฟัง จิอากิก็กลับมามีชีวิตชีวาทันที)"
