[translation]
2601603-1 = "ある書記によると"
2601603-2 = "ふむ。やっぱり海は水が多いですね！"
2601603-3 = "まず一つ、事実を確認しました！"
2601603-4 = "[s] \"千里の道も一歩から、だね！\""
2601603-5 = "はい！では行きましょう！"
2601603-10 = "ひそひそ、うんたらかんたら……。"
2601603-11 = "ひそひそ、うんたらかんたら……。"
2601603-12 = "こんにちは！「週刊万魔殿」です！"
2601603-13 = "突然ですが、お時間大丈夫ですか？いくつかお伺いしたいことがありまして！"
2601603-14 = "取材ってこと？別にいいけど……。"
2601603-15 = "ありがとうございます！では――"
2601603-17 = "さっき、お二人は「ひそひそ、うんたらかんたら」とおっしゃっていましたが！"
2601603-18 = "どういう意味なんですか？"
2601603-19 = "え？知らないの？"
2601603-20 = "ここで「ひそひそ、うんたらかんたら」って言えば願いが叶うんだって！"
2601603-21 = "私たちもその伝説を聞いて来たクチなんだ。"
2601603-22 = "ここは、知る人ぞ知る名所なんだよ！"
2601603-24 = "隠れた名所に眠る……海にまつわる伝説！"
2601603-25 = "なんと！これはスクープですね！えっと、メモ帳は――"
2601603-30 = "あ、あれ？"
2601603-31 = "[s] \"なにか問題でもあった？\""
2601603-32 = "は、はい……大問題です……！"
2601603-33 = "メモ帳を……忘れてしまいました……！"
2601603-34 = "手元にあるのは石のコースターだけ……。"
2601603-35 = "[s] \"あ、本当だ……ちょっと似てる……。\""
2601603-36 = "こんな時に限ってスマホも電池切れですし……。"
2601603-37 = "あ、あるのはペンだけ……。"
2601603-38 = "もう手のひらに書くしか……！"
2601603-40 = "そういえば、夜になるとあっちの森から変な音が聞こえるらしいけど……。#nそれは取材した？"
2601603-41 = "ああ、あれか。みんな怖がってるよね。"
2601603-42 = "他にも面白そうな話が！？"
2601603-43 = "せ、先生の手のひらも貸してくれませんか？"
2601603-44 = "他の場所でもいいので！忘れる前にメモしないと……！"
2601603-45 = "[s1] \"ストップ、ストップ！\"\n[s2] \"落ち着いて、チアキ。\""
2601603-48 = "でも、こんな特ダネを記憶に頼って書くわけにはいかないです！"
2601603-49 = "色んな話がごちゃまぜになって、思い出せなくなっちゃうかも！"
2601603-53 = "背に腹は代えられません！私の背中にも書いてください！"
2601603-54 = "[s] \"いったん身体に書くことから離れようか！？\""
2601603-55 = "で、ですが……足元には砂しかないのに、他のどこに書けば――"
2601603-56 = "うん？砂？"
2601603-57 = "そっか、その手がありました！"
2601603-68 = "――だから、コンビーフの缶はあんな形なんだよ！"
2601603-69 = "なるほど、そうだったんだ！"
2601603-70 = "途中から海とは全然関係なくなりましたが、興味深いお話ですね！"
2601603-71 = "あっ、そろそろ集合時間だ！"
2601603-72 = "私たちはもう行くね！記事書くの頑張って！"
2601603-73 = "はい！お話いただいた内容は全て砂浜に書かせていただきました！"
2601603-74 = "取材協力感謝します！またお会いしましょう～！"
2601603-79 = "いやぁ～！あっという間でしたね！"
2601603-80 = "砂浜に文字を残すとは、我ながら良い作戦でした！"
2601603-81 = "あとはカメラでパシャリ！と撮れば完璧です！"
2601603-82 = "それでは、砂の皆さんー！はい、チーズ！"
2601603-86 = "え……？"
2601603-89 = "あ、あああっー！！"
2601603-92 = "あ……あ……。"
2601603-93 = "[s3] \"チアキ、大丈夫！？\"\n[s4] \"急に波が来たけど……。\""
2601603-96 = "アンドゥ……できない……？"
2601603-97 = "全部……パァに……。"
2601603-98 = "う、嘘ですよね……？"
2601603-99 = "[s] \"チアキ、しっかりして！！\""
2601603-100 = "……へ？"
2601603-102 = "（その後、落ち込むチアキを精一杯慰めた）"
2601603-103 = "（代わりに最近の出来事を話したら、すぐに元気を取り戻してくれた）"
