[translation]
10059035-8 = "く、ううっ……！こ、こいつ……！"
10059035-9 = "何でこんなに固ぇんだ……。"
10059035-10 = "はい、おしまい。これ以上やっても意味はないよ。"
10059035-11 = "だから、少しお話しない？"
10059035-12 = "ほら、座って座って。"
10059035-13 = "は？"
10059035-14 = "き、急に何言ってんだ！"
10059035-15 = "座って？"
10059035-22 = "君たちは、どうしてこの仕事をするようになったの？"
10059035-23 = "そんなこと聞いてどうすんだよ！"
10059035-24 = "どうもしないよ。こんな危ない仕事をしている理由が気になっただけ。"
10059035-25 = "何か欲しいものでもあるの？"
10059035-26 = "その……「フレデリカ・セムラ」ってやつを食べてみたくてさ。"
10059035-27 = "ぜんっぜん手に入らない幻のデザートなんだ。"
10059035-28 = "けど、金さえあれば何とかなる。#nこの世に金で解決できないことなんてないからな。ふふふ。"
10059035-29 = "フレデリカ・セムラ……ああ。"
10059035-30 = "手に入れようとして、トリニティ[ruby=カーニバル]謝肉祭[/ruby]運営委員会を夜襲した子がいたって聞いたよ。"
10059035-31 = "私も気になって探してみたんだけど……たしかにあれ、なかなか手に入らないよね。"
10059035-32 = "でもその代わり、セムラに似たスイーツを出すお店なら見つけたんだ。"
10059035-33 = "おっ、マジか。どこだよ？"
10059035-39 = "[ns] \"なんというか……雑談？\""
10059035-40 = "……そりゃ雑談してますからね。"
10059035-41 = "うちの隊長は、ああ見えてものすごくおしゃべりなんです。"
10059035-42 = "しかも相手を選びません。"
10059035-43 = "……ってか、連絡先教えてくれよ！今度一緒に行こうぜ！"
10059035-44 = "そうだな！#nあっ、もちろんお前のおごりな？あとからナシとか言うなよ？"
10059035-45 = "……加えて、コミュ力も高いんです。"
10059035-46 = "[s1] \"「お話」って物騒な意味の隠語だと思ってたけど……。\"\n[s2] \"本当にお話が好きな子だったんだね……。\""
10059035-49 = "寮監隊の役目は、生徒を正しい道へ導くこと。"
10059035-50 = "その手段は武力に限らないのです。"
10059035-51 = "力と言葉――対立と調和。"
10059035-52 = "対極にある要素が美しく噛み合ってこそ、初めて人を導けるのでしょう。"
10059035-53 = "もちろん、何事にも例外はあります。#n……時には、強制的に制圧せざるを得ないことも。"
10059035-54 = "[s] \"時には……？\""
10059035-55 = "ええ、時には。"
10059035-61 = "……まあ、そんなこんなで、ここで働くようになったんだよ。"
10059035-62 = "で？#nどうしてお前らはこんなとこで自分とこの芸術品を探してんだ？"
10059035-63 = "誰かが生徒の作品を持ち出してるみたいなんだけど、それが誰か分からなくてね。"
10059035-64 = "何か心当たりないかな？"
10059035-65 = "言いにくければ無理に話さなくてもいいよ。"
10059035-66 = "うちらはただの警備だから、詳しいことまでは知らねぇよ。"
10059035-67 = "気になるなら、あっちの地下オークションでも当たってみれば？#n最近、妙に品物の出入りが多いみたいだぜ。"
10059035-68 = "そんな大事なこと、私たちに教えちゃっていいの？"
10059035-69 = "言ったろ？うちらはただの警備なんだ。"
10059035-70 = "高級スイーツ食べたさで始めた仕事だし。#nお前がおごってくれるんならいいかなって。"
10059035-71 = "だ～か～ら～約束、忘れんなよな。"
10059035-72 = "……だそうです。"
10059035-73 = "さすがはサヨ寮監隊長。#n敵を相手に、見事な落としどころを見つけましたね。"
10059035-74 = "皆さん、地下オークション会場へ向かいます。"
10059035-75 = "うーん……。"
10059035-76 = "ごめんね。君たちはちょっとだけ気絶しててくれる？"
10059035-77 = "そうしないと他の子に怪しまれちゃうでしょ？"
10059035-78 = "くそっ。そりゃそうだけどよ……。"
10059035-79 = "や、やるなら優しくして……。"
10059035-90 = "さあ、移動しましょう。"
10059035-94 = "さーあ皆々様！続いてご覧いただくのはこちらの作ひ――"
10059035-100 = "なっ、何だ！？いったい何が――！！"
10059035-112 = "あらまあ。本当だったんだね。#nここにある作品、全部ワイルドハントの刻印が入ってる。"
10059035-113 = "やっぱり、こいつらの仕業か……！"
10059035-114 = "き、貴様らは……！！"
10059035-115 = "警備！警備は何をしてる！？早くこいつらを取り押さえろ！！"
10059035-123 = "はぁ……こんなに働くつもりじゃなかったんだけどな。"
10059035-127 = "そろそろ面倒だし、みんな大人しくしてくれる？"
10059035-137 = "はぁっ、はぁっ……くそっ、思ったより早く足がついた……！"
10059035-138 = "捕まってたまるかよ！#n私がどれだけ苦労して、ここまでのし上がったと思って――！！"
10059035-139 = "――ん！？"
10059035-145 = "一人だけ逃げ出すとは。#nあなたからは上に立つ者としての品格を感じませんね。"
10059035-146 = "どのみち末端なのでしょうけれど……何も知らないわけでもないのでしょう？"
10059035-147 = "知っていることを全て話していただけますか？"
10059035-148 = "まだ、私が親切でいられるうちに。"
10059035-149 = "はっ、死んでも喋るもんかよ……！"
10059035-150 = "裏切れば永遠に消されちまうからな……！！"
10059035-151 = "ほう。それなりの忠誠心はあるのですね。"
10059035-152 = "そういう方は、嫌いではありません。"
10059035-153 = "その忠義に敬意を表し……一思いにして差し上げましょう。"
10059035-154 = "ひいぃっ！や、やられてたまるか……！！"
10059035-163 = "ぐはぁっ……！"
10059035-167 = "……無駄な足掻きを。"
10059035-169 = "連れていきなさい。"
10059035-178 = "マ、マナミ様。中の制圧も……終わりました。"
10059035-179 = "ただ、その……どうにも不吉な香りがします。"
10059035-180 = "カノン様が帳簿を確認してくださっているのですが……#nどうやら、生徒の作品が違法な取引に使われていたのは本当のようで……。"
10059035-181 = "申し訳ありません……わたくしがもっと早く気づけていれば、こんなことには……。"
10059035-182 = "ここは違法組織のアジト。今は誰の責任かを問うている時ではありません。"
10059035-183 = "芸術品と資料の回収、そして撤退を優先しましょう。"
10059035-184 = "……はい！#nわたくしはカノン様のお手伝いに行ってきます。"
10059035-185 = "マナミ様は……どうか、ここで少し休憩なさってください……。"
10059035-191 = "本来なら、休んでいる場合ではないのですが……。"
10059035-192 = "さすがはウララ副会長。お見通しでしたか。"
10059035-193 = "疲労は隠していたつもりなのですが、無理がたたってしまいましたね……。#nお言葉に甘えさせてもらいましょう。"
10059035-194 = "[s] \"本当に大丈夫？\""
10059035-195 = "ええ。少し休めば問題ありません。"
10059035-196 = "それでも心配だと仰るなら――"
10059035-197 = "特別に、私に肩を貸す栄誉を差し上げましょう。"
10059035-198 = "[s] 静かに頷く。"
10059035-199 = "ふふっ。逃げずに受け止めてくださるのですね。"
10059035-205 = "……そのご厚意に、感謝を。"
10059035-206 = "こうして誰かに身を預けるのは……ずいぶんと久しぶりです。"
10059035-207 = "普段であれば「特別な瞬間」として記念に残したがるのでしょうが……#n今は、そんな気分にはなれません。"
10059035-211 = "想像しうる最悪の事態です。"
10059035-212 = "学院の生徒の作品が犯罪に利用されていたなんて。"
10059035-213 = "この件はきっと、私の心に残り続けるでしょう。"
10059035-214 = "美しいばかりではなく、苦々しい「感覚の芸術」もあるのですね。"
10059035-215 = "……。"
10059035-216 = "酌量の余地などありません。徹底的に。"
10059035-217 = "――芸術を汚す者に、鉄槌を。"
