[translation]
10059035-8 = "크, 으윽……! 이, 이 녀석……!"
10059035-9 = "뭐가 이렇게…… 단단해?!"
10059035-10 = "자. 더 이상 싸우는 건 무의미해."
10059035-11 = "그러니까 대화를 나누지 않겠니?"
10059035-12 = "다들 그쪽에 앉으렴."
10059035-13 = "응?"
10059035-14 = "가, 갑자기 뭐라는 거야!"
10059035-15 = "앉으렴."
10059035-22 = "너희는 어쩌다 이 일을 하게 됐니?"
10059035-23 = "아, 알아서 뭐 하게!"
10059035-24 = "그냥 이런 험한 일을 하는 이유가 궁금해서."
10059035-25 = "뭐 사고 싶은 거라도 있는 거니?"
10059035-26 = "사실은 그…… <프레데리카 셈라>라는 녀석을 먹어보고 싶어서."
10059035-27 = "엄청나게 구하기 힘들다는 디저트 말이야."
10059035-28 = "하지만 돈이 있다면 가능해. 이 세상에 돈으로 안 되는 건 없으니까. 후후후."
10059035-29 = "아…… 프레데리카 셈라."
10059035-30 = "그걸 구하려고 트리니티 사육제 운영위원회를 야습한 녀석들이 있다고 들었어."
10059035-31 = "나도 궁금해서 구해보려 했는데 쉽진 않더라."
10059035-32 = "대신 셈라와 비슷한, 꽤 괜찮은 디저트를 파는 가게를 찾았는데."
10059035-33 = "오, 진짜? 어딘데?"
10059035-39 = "[ns] \"뭔가…… 점점 잡담이 되어가는 것 같은데…….\""
10059035-40 = "……그야 잡담이 맞으니까요."
10059035-41 = "우리 대장님, 보기와는 다르게 엄청 수다쟁이거든요."
10059035-42 = "상대를 가리지도 않아요."
10059035-43 = "오…… 연락처 알려줘! 언제 같이 가보자!"
10059035-44 = "그래! 네가 쏘는 거야! 나중에 딴말하기 없기다?"
10059035-45 = "……더불어 친화력도 좋죠."
10059035-46 = "[s1] \"……<대화>가 무력을 강조하는 은어인 줄 알았는데.\"\n[s2] \"진짜 대화를 좋아하는 아이였구나…….\""
10059035-49 = "사감대의 주요 업무는 학생들을 선도하는 것."
10059035-50 = "그런 선도는 무력만으론 이루어질 수 없죠."
10059035-51 = "무력과 대화. 반목과 조화."
10059035-52 = "이 극과 극의 요소가 감각적으로 훌륭하게 조화를 이루는 것이야말로 선도죠."
10059035-53 = "물론…… 가끔 강제 진압이 발생하는 것은 어쩔 수 없지만요."
10059035-54 = "[s] \"가끔……?\""
10059035-55 = "네. 가끔입니다."
10059035-61 = "……뭐, 그래서 이런 곳에서 일하게 됐지."
10059035-62 = "넌 왜 여기서 너희 학원 예술품을 찾는 건데?"
10059035-63 = "어떤 녀석이 학생들 작품을 빼돌리는데, 누군지 알 수가 없어서."
10059035-64 = "혹시 짐작 가는 거 있니?"
10059035-65 = "대답하기 어려우면 말 안 해도 돼."
10059035-66 = "우린 그냥 경비만 서는 거라 자세한 건 몰라."
10059035-67 = "궁금하면 저쪽의 지하 경매장이라도 뒤져보든가. #n요즘 물건이 자주 왔다 갔다 하더라고."
10059035-68 = "그런 거 말해줘도 되는 거니?"
10059035-69 = "뭐, 어차피 우린 깊은 관계도 없어."
10059035-70 = "고급 디저트 먹으려고 시작한 일이었는데 네가 사준다며? 그럼 됐지."
10059035-71 = "크크큭, 약속 잊지 말라고."
10059035-72 = "……라고 하네요."
10059035-73 = "역시 사요 사감대장. 적과도 감각적인 타협을 이끌었군요."
10059035-74 = "이제 다음 목표는 지하 경매장입니다."
10059035-75 = "흐으음……."
10059035-76 = "미안하지만 너희는 기절을 좀 해주렴."
10059035-77 = "그래야 딴 녀석들이 의심 안 하잖아?"
10059035-78 = "큭, 제길. 그건 그렇긴 한데……."
10059035-79 = "사, 살살 해줘……."
10059035-90 = "자. 이동합시다."
10059035-94 = "자, 여러분. 다음은 이쪽의 작품을……."
10059035-100 = "뭐, 뭐야?! 갑자기 무슨……!!"
10059035-112 = "어머나. 정말이었네. 여기 작품들, 전부 와일드헌트의 인장이 있어."
10059035-113 = "역시 이 범죄자 놈들이……!"
10059035-114 = "너, 너희는……!!"
10059035-115 = "겨, 경비원! 어서 저 녀석들을 제압해……!!"
10059035-123 = "하아…… 이렇게까지 열심히 일하고 싶진 않았는데."
10059035-127 = "슬슬 귀찮으니 다들 쓰러져 주렴."
10059035-137 = "허억, 허억…… 제길, 생각보다 빨리 꼬리가 밟혔어."
10059035-138 = "잡힐까 보냐. 내가 어떻게 여기까지 올라왔는데……!!"
10059035-139 = "……응?!"
10059035-145 = "몰래 달아나다니. 당신에게서는 지도자의 품격이 느껴지지 않는군요."
10059035-146 = "아무래도 당신은 말단 중의 말단. 하지만 아무것도 모르진 않겠죠?"
10059035-147 = "자, 아는 것을 남김없이 말해주세요."
10059035-148 = "제가 아직 친절함을 유지하고 있을 때 말이에요."
10059035-149 = "우, 웃기지 마! 죽어도 말 못 해……!"
10059035-150 = "배신하면 영원히 매장이라고……!!"
10059035-151 = "아, 그렇군요. 충성심은 있다는 겁니까."
10059035-152 = "당신 같은 사람, 싫진 않아요."
10059035-153 = "그러니 최대한 아프지 않게 해드릴게요."
10059035-154 = "히이이익! 다, 당할까 보냐……!!"
10059035-163 = "커, 커헉……!"
10059035-167 = "……쓸데없는 발버둥을."
10059035-169 = "자. 연행하세요."
10059035-178 = "마, 마나미 님. 안쪽의 제압도 마무리됐어요."
10059035-179 = "그런데 그게…… 상당히 불길한 향기가 나요."
10059035-180 = "카논 님이 장부를 확인하고 있는데, 역시나 우리 학생들의 작품이 불법적인 일에 이용된 것 같아서……."
10059035-181 = "정말 죄송해요. 제가 좀 더 일찍 파악해야 했는데……."
10059035-182 = "……지금은 누군가의 잘못을 따질 때가 아닙니다."
10059035-183 = "이곳은 불법 조직의 한복판. 오래 머물면 좋지 않으니, 예술품과 자료를 회수해 퇴각하는 것에 집중하죠."
10059035-184 = "아…… 네! 그럼 저는 카논 님을 도우러 가볼게요."
10059035-185 = "마나미 님은…… 여기서 잠시 쉬고 계시길……."
10059035-191 = "쉬고 있을 때가 아니긴 합니다만……."
10059035-192 = "역시 우라라 부회장. 눈치가 빠르군요."
10059035-193 = "피로가 쌓인 상황에서 과격하게 움직였더니……. #n지금은 잠깐 쉬는 게 나을지도 모르겠습니다."
10059035-194 = "[s] \"정말로 괜찮은 거야?\""
10059035-195 = "네. 조금만 쉬면 된답니다."
10059035-196 = "그래도 걱정이 된다면……."
10059035-197 = "제가 잠깐 기댈 수 있도록 어깨를 빌려주는 영광을 드리죠."
10059035-198 = "[s] 조용히 고개를 끄덕인다."
10059035-199 = "후후, 피하지 않는 모습이 보기 좋군요."
10059035-205 = "우선 친절에 감사드립니다."
10059035-206 = "이렇게 누군가에게 기대보는 건…… 저도 참 오랜만이네요."
10059035-207 = "평소 같았으면 특별한 순간이라며 기념품을 지정했겠지만, 지금은 그럴 기분이 아닙니다."
10059035-211 = "가장 일어나지 않았으면 했던 일이 일어났어요."
10059035-212 = "정말로 학생들의 작품이 불법적인 일에 이용되고 있었다니."
10059035-213 = "이번 일로 저는 항상 마음속의 짐을 느끼겠죠."
10059035-214 = "아름답지 않은, 쓰디쓴 '감각의 예술'도 있는 법이군요."
10059035-215 = "……."
10059035-216 = "용서할 수 없어요."
10059035-217 = "우리의 예술을 더럽히는 녀석들은…… 모두."
