[translation]
103050-1 = "제5화;아비도스에 있는 것 2"
103050-5 = "대책위원회 동아리실"
103050-8 = "흐음."
103050-15 = "어…… 그러니까…… 아비도스에 오신 것을 환영합니다……?"
103050-17 = "네. 잠시만 실례하겠습니다."
103050-18 = "그 당시, 카이저 코퍼레이션이 생텀 타워를 습격했을 때, 프레지던트가 저에게 그런 말을 했었습니다."
103050-21 = "생텀 타워를 장악하려고 하네."
103050-22 = "왜냐고? [ruby=.]초[/ruby][ruby=.]고[/ruby][ruby=.]대[/ruby] [ruby=.]병[/ruby][ruby=.]기[/ruby]가 손에 들어왔거든. 그래서 생텀 타워의 힘이 필요해졌다네. 뭐, 자세한 설명은 생략하지."
103050-23 = "이제 키보토스는 카이저 코퍼레이션의 지배하에 놓이는 걸세. 게마트리아도, 총학생회도 아닌 바로 우리가 학원 도시의 주인이 되는 거야."
103050-26 = "그 당시에는 당장 눈앞에 닥친 계엄령과 거짓된 성소의 도래로 생각할 겨를이 없었지만, 생각해 보면 이상한 말이었습니다."
103050-27 = "초고대 병기? 기업의 총수가 입에 담기엔 굉장히 위화감이 있는 단어였죠."
103050-28 = "평소였다면 깨닫지 못했을 겁니다. <카이저 코퍼레이션>과 <초고대 병기>…… 그 두 단어의 연결점을요."
103050-29 = "네……. 그 둘의 연결점은 바로……."
103050-33 = "뭐야. 그런 건가…… 으음."
103050-34 = "호시노 선배?"
103050-40 = "결국 카이저가 사막에서 찾고 있는 게 <초고대 병기>였다는 거잖아."
103050-43 = "아비도스 사막 발굴지 근처"
103050-44 = "카이저가 우리 아비도스 자치구의 땅을 빼앗은 이유가 사실은……. 흐음……."
103050-45 = "그게 뭘까 늘 궁금했는데…… 막상 알게 되니까 맥이 빠지는데~ 그런 거였나."
103050-47 = "<초고대 병기>라니, 뭐야, 그게! 애들도 아니고! 한심하게!"
103050-48 = "보물찾기라고 한 게 진짜 말 그대로였을 줄은……."
103050-50 = "……. 아니, 어떻게 보면 그 녀석들다운 목표이긴 해. 돈으로도 살 수 없는 <강력한 무기>라면 무슨 방법을 써서라도 손에 넣으려고 했겠지."
103050-51 = "네. 그때 카이저 코퍼레이션은 <초고대 병기>가 손에 들어왔다는 이유만으로 총학생회를 공격했습니다."
103050-52 = "뒷일은 신경 쓰지도 않고, 마치 그게 있으면 키보토스의 전부와도 싸울 수 있다는 듯한 행동이었죠."
103050-53 = "그래. 카이저 PMC가 최근 사막을 오가는 빈도가 잦아진 것도 그거 때문이겠지……."
103050-54 = "그래서, 아야네 쨩? 지금부터 우리는 그 PMC 발굴지로 가서 그 <초고대 병기>를 확보하면 되는 거지?"
103050-56 = "네. 하지만 거기는 아직 카이저의 사유지라서……"
103050-57 = "오호라…… 그렇구만. 그렇다면 여기서는 시로코 쨩 스타일로 할 수밖에 없는 거구만?"
103050-62 = "……네?!"
103050-68 = "네?! 자, 잠깐만요!! 그런 뜻이 아니라……."
103050-69 = "안 들키면 되는 거잖아? 빠르게 가는 거야."
103050-70 = "응응☆ 그걸 확보해야 시로코 쨩을 포획하러 갈 수 있다고 하니까요!"
103050-78 = "카이저 PMC는 지금 그 기지에서 철수했어요! 지금은 텅 비어 있을 거예요!"
103050-79 = "응? 그래?"
103050-80 = "네! 하지만 여전히 카이저의 사유지니까…… 언제 다시 카이저가 돌아올지도 모르니 조심하라는 얘기였어요!"
103050-85 = "하아, 그렇구만. 살짝 화풀이하려고 했는데 아쉽네."
103050-92 = "그렇다고 같이 복면을 쓸 필요는 없었지만요. 응응, 분위기를 읽는 아야네 쨩 귀여워~☆"
103050-98 = "네? 그, 그건……."
103050-99 = "그럼 그냥 이 위치로 가져오기만 하면 되는 거야?"
103050-100 = "생각보다 간단하잖아……."
103050-102 = "아뇨, 대책위원회 여러분. 그건 가져오는 게 불가능해요."
103050-103 = "히마리 씨……?"
103050-104 = "여러분은 장소를 확보해 주시기만 하면 돼요."
103050-106 = "가져오는 게 불가능하다고? 엄청 큰 물건인가 봐?"
103050-108 = "네."
103050-109 = "선생님이 확보한 정보에 의하면 그 <초고대 병기>라는 것이 바로……."
103050-115 = "우주전함이라고 하네요."
103050-121 = "뭐라고-?!"
103050-131 = "뭐, 뭐야! 네놈들?!"
103050-132 = "하늘이 정상으로 돌아와서 기지 상태를 보러왔더니……?! 침입자가……?!"
103050-141 = "흐응. 성소가 사라지고 나니 슬슬 카이저도 여기로 복귀하고 있나 보네."
103050-142 = "그치만 여기는 원래 우리 땅이거든요?"
103050-143 = "그래, 멋대로 눌러앉은 건 네 녀석들이고!"
103050-145 = "그치만…… 서류상으로는 아직……"
103050-146 = "으응, 괜찮으려나……."
103050-147 = "뭐어, 키보토스가 혼란한 상황이니까, 선생이 어떻게든 얼버무려주지 않을까?"
103050-148 = "와아~☆ 어른의 힘!"
103050-149 = "아, 아하하……."
103050-158 = "우왓?!"
103050-159 = "아직 남아 있는 녀석들이 있잖아!"
103050-160 = "좋아, 제대로 처리하고 가보자고!"
103050-161 = "네! 해당 좌표까지 바로 전진하겠습니다!"
103050-162 = "선생님, 지휘를 부탁드립니다!"
103050-163 = "[ns] \"자아, 시작해 보자!\""
