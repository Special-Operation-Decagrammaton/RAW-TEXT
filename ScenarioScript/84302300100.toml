[translation]
84302300100-5 = "(데이터 센터에서 있었던 일들을 리오에게 설명해 주었다.)"
84302300100-8 = "……과연."
84302300100-9 = "그렇군. 상황은 대충 이해했어. 고생이 많았네."
84302300100-10 = "하고 싶어서 한 게 아니니까 말이야. 중간에 통신이 끊기지만 않았어도……"
84302300100-11 = "그래도 재량을 발휘해 잘 해결했잖아. 역시 적임자였던 거지."
84302300100-15 = "웬일이냐, 그런 빈말도 할 줄 알고?"
84302300100-16 = "빈말이 아니니까."
84302300100-18 = "생각지도 않은 변수였을 텐데 훌륭한 대처였군요. 과연 C&C의 리더다운."
84302300100-19 = "자, 자. 그만, 그만. 칭찬해 봐야 뭐 더 안 나오니까. 아무튼 목적은 달성했고, 이제부터는 바톤이 넘어가는 건가?"
84302300100-20 = "물론이지. 덕분에 밀레니엄 내의 데이터 흐름을 완벽하게 파악할 수 있게 됐어. 여기서부터는 내 역할이야."
84302300100-21 = "그러고 보니 <코유키>에 대해서는……. 정말 이걸로 괜찮겠어?"
84302300100-22 = "말해준 대로 수정된 데이터와 상황을 포함해, 모두 세미나에 연락하긴 했지만……."
84302300100-23 = "이러면 네루 네가 그녀와 한 약속이 어긋나는 게 아닐까 싶어서."
84302300100-27 = "응? 무슨 말이야? 약속은 철저하게 지켰잖아?"
84302300100-28 = "\"유우카 선배와 노아 선배에겐 절대로 말하지 말아 주세요.\""
84302300100-29 = "말 안 했잖아? ……'나는' 말이지."
84302300100-33 = "과연. 거짓말은 안 했군요. '당신은' 말하지 않았죠."
84302300100-34 = "그렇다고 세미나의 데이터가 그녀의 손에 수정된 것도 그대로 내버려둘 수는 없으니, 리오가 대신 세미나로 단서를 흘리게끔……."
84302300100-35 = "너무 걱정하지 마~. 붙잡힌 뒤에는 녀석도 나에 대해 불어버릴 지 모르지만, 의외로 그 녀석은 그리 쉽게 잡히지 않거든."
84302300100-36 = "적어도 하루 이상은 잘 도망 다닐 거야. 그리고 그사이에 우리는 일을 끝마칠 수 있을 거고."
84302300100-37 = "대신……."
84302300100-43 = "마침 도착했군."
84302300100-46 = "\"용서 못 해……! 절대로 용서 못 해요, 선배!!\""
84302300100-47 = "\"언젠가 지옥에서 이 코유키의 원망을 듣게 되실 거예요!!\""
84302300100-51 = "크큭. 뭐, 이렇게 되겠지."
84302300100-52 = "답장을 해줘야지."
84302300100-53 = "\"내가…… 직접 말한, 건, 아니니까……. 약속은…… 안 어겼다…….\""
84302300100-54 = "송신-."
84302300100-59 = "\"밀레니엄에 저주가 있으리라!!!\""
84302300100-60 = "끝! 자, 이제 다음 단계로 넘어가면 되지?"
84302300100-61 = "으, 으응……. 브리핑을 준비할게."
84302300100-62 = "미카모 네루……."
84302300100-63 = "철두철미하고 노련한 C&C의 리더……."
84302300100-65 = "……적으로 돌리기에는, 무서운 사람이네요."
