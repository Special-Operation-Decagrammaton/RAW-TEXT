[translation]
1003903-1 = "RABBIT 4, 출동합니다."
1003903-2 = "(평소처럼 샬레의 밀린 업무를 처리하던 중…….)"
1003903-6 = "아, 선생님……."
1003903-10 = "어……"
1003903-16 = "우으……"
1003903-20 = "[ns1] \"미, 미유?\"\n[ns2] \"어, 언제부터 와 있었던 거야?\""
1003903-21 = "아까 전부터 와 있었는데……."
1003903-22 = "아까 전부터 와 있었는데……."
1003903-23 = "……역시 선생님도 제 존재를 알아차리지 못하게 되셨군요."
1003903-24 = "제 존재감은 계속 희미해져 가고 있어요……."
1003903-25 = "사이좋은 친구들도, 점차 저를 알아차리지 못하게 되어버리고……."
1003903-26 = "학교에서도 조를 짤 때도 친구들이 뒤늦게 제 존재를 알아차려서, '아, 맞다. 미유도 있었지—' 같은 어색한 표정을 짓는 걸 지켜보고 있으면, 오히려 이쪽이 도망치고 싶어져서……."
1003903-27 = "……결국 저는 아무에게도 기억되지 못하는 외톨이인 채로 쓸쓸히 죽어버릴 거예요."
1003903-28 = "[s] \"그런 게 아니라 사실은…….\""
1003903-29 = "……네? 제가 들어 오는 발소리를 듣지 못하셨다고요?"
1003903-30 = "아…… 그, 그건 아마도 제가 원래부터 살금살금 걷는 버릇이 있어서 그럴 거예요."
1003903-31 = "잠입 임무를 할 때는 좋지만, 평상시에도 버릇이 들어버려서……."
1003903-32 = "……이제는 일부러 발소리를 내면서 움직이려고 해도 힘들어요."
1003903-33 = "……그러고 보면 제 존재감이 희박한 이유도 이런 버릇 때문이 아닐까요."
1003903-34 = "하지만 지금에 와서 걷는 버릇을 고치는 것도 어렵고……."
1003903-35 = "[s] \"몸에 방울 같은 건 달아보는 게 어떨까?\""
1003903-36 = "……방울, 이요?"
1003903-37 = "……나쁘지 않은 방법이네요. 몸에 소리 나는 방울을 달아 둔다면 주변 사람들도 소리로 제 존재를 알아차릴 수 있을 테니까요."
1003903-38 = "그러고 보니 가방 속에 쓸 만한 방울이 하나 있었는데……."
1003903-42 = "[ns] \"잠깐, 미유. 그 방울은…….\""
1003903-44 = "네?"
1003903-45 = "이건 전에 돌보던 고양이에게 쓰던 방울 달린 목걸이인데요…… 무슨 문제라도 있나요?"
1003903-46 = "전에 쓰던 것이 너무 낡아버려서 새 목걸이를 주고 남은 것을 마침 갖고 있었거든요."
1003903-47 = "이렇게 방울이 달린 목걸이를 착용한다면, 움직이는 데 불편하지도 않고, 주변 사람들도 확실하게 제 존재를 알아차릴 거예요!"
1003903-48 = "[s] \"분명 확실하게 알아차리겠지만…….\""
1003903-49 = "후후. 다른 사람들이 제 존재를 알아차려 줄지 벌써 기대가 되네요……."
1003903-50 = "선생님, 바로 시험하러 나가봐요!"
1003903-54 = "[ns] \"미유, 잠깐 기다려!\""
1003903-58 = "……저 여자아이 뭐야? 애완동물용 목걸이를 차고 있어."
1003903-59 = "그 옆에 있는 사람은 샬레의 선생님 같은데……"
1003903-60 = "그러고 보니 전에 소문을 들은 적이 있어. 샬레의 선생님이 당번으로 지정한 학생은 아무리 높은 사람이라도 샬레의 사무실로 즉시 달려와야 한다고……."
1003903-61 = "……설마 그동안 당번 활동이라며 학생들에게 저런 짓을 하고 있었던 거야?"
1003903-62 = "너무해…… 학생들이 불쌍해……."
1003903-63 = "서, 선생님, 보세요……! 사람들이 저를 주목하고 있어요……!"
1003903-64 = "아무도 저를 무시하지 않고, 모두가 저를 열심히 쳐다보고 있어요."
1003903-65 = "선생님의 말씀처럼 방울이 존재감을 드러내는 데 효과가 있었나 봐요."
1003903-66 = "[s] \"그 목걸이는 그만 벗어줘…….\""
1003903-67 = "……네? 벗으라고요?"
1003903-68 = "모처럼 사람들로부터 주목을 받고 있는데, 예전의 저로 돌아가라니……."
1003903-69 = "어째서 그런 심한 말씀을……."
1003903-70 = "……방금 그 소리 들었어? 이런 밖에서 학생에게 벗으라고 말하다니……"
1003903-71 = "곤란해하는 학생의 얼굴 좀 봐…… 불쌍해……"
1003903-72 = "어떻게 저리도 극악무도한 사람이 어떻게 선생님이 된 거지?"
1003903-73 = "[s] \"제발 부탁이니까 그만해 줘……!\""
1003903-75 = "(이후 간곡히 부탁하여 미유가 그 목걸이를 차는 일은 없게 되었지만…….)"
1003903-76 = "(한동안 주변의 시민들로부터 따가운 시선을 받게 되었다…….)"
