[translation]
10052030-2 = "빌어먹으으으으으으을!!!"
10052030-3 = "두고 보자고요! 히마리, 리오, 그리고 선생님!!!!!"
10052030-8 = "그러면 빠르게 마무리 짓도록 하죠, 리오."
10052030-9 = "……그래."
10052030-18 = "[ns] \"히마리! 리오! 괜찮아?\""
10052030-19 = "어머나. 선생님께서 이렇게 신경 써 주시다니, 약간 무리해서 회선에 개입한 보람이 있었네요."
10052030-20 = "선생님 덕분에 저는 아무렇지도 않았답니다♪"
10052030-21 = "오히려 매번 이렇게 보살펴 주신다면, 앞으로도 계속 이런 방식을 유지해 볼지 고민할 정도로요♬"
10052030-22 = "어…… 나는 잘 모르겠지만, 그러면 안 될 것 같아……."
10052030-23 = "[ns] \"그러게. 이번에는 리오 말이 맞아.\""
10052030-24 = "우우……."
10052030-25 = "……뭘 그렇게 노골적으로 시무룩해하고 있는 건가요, 히마리."
10052030-26 = "아무튼 둘 다 무사히 돌아와서 다행이지만요."
10052030-27 = "어머나. 케이가 진심으로 걱정해 주고 있었다니, 다시 기운이 나려고 하네요?"
10052030-28 = "……!!! 돼, 됐어요! 진짜 괜히 걱정했네요!!!"
10052030-32 = "부장? 회장? 괜찮아? 여기…… 뭔가, 그 코어라는 걸 발견한 것 같아."
10052030-37 = "그것이 코어……?"
10052030-39 = "케이? 혹시 원격 상이지만, 어느 정도 확인할 수 있겠어?"
10052030-40 = "잠시만요……. 그거 잠시 바닥에 내려놓아 주겠어요, 에이미?"
10052030-41 = "응? 응. 알았어."
10052030-45 = "……."
10052030-46 = "이해…… 관찰자…… [ruby=JEHOVAH ELOHIM]예호바 엘로힘[/ruby]…… 침묵과 탐욕, 풍부함과 슬픔……."
10052030-47 = "……!"
10052030-48 = "네. 확실합니다. 비나의 코어예요."
10052030-49 = "어머나, 직접 보지 않고도 알 수 있나요?"
10052030-50 = "지금이라면요."
10052030-51 = "……! 그렇구나. 비나의 구역 전체는 아직 점령 중이지만, 이 구덩이 근처는 벌써……!"
10052030-52 = "그래요. 더군다나 이 구역은 강철대륙 네트워크의 도입부 같은 곳이기도 하니까, 이 정도는 가능한 거죠."
10052030-53 = "그리고…… 예언자들의 코어에 대해서, 또다시 새롭게 알아낸 정보가 있었습니다."
10052030-54 = "그게 뭔가요?"
10052030-55 = "네. 코어의 정보…… 그러니까 비물질적인 데이터……."
10052030-56 = "즉 네트워크의 상위 접근 권한과 신위(神威)…… 각 세피라의 위격(位格)은, 저의 이 몸에 다운로드가 가능합니다. 이 부분은 예전에도 말씀드린 부분이죠."
10052030-57 = "그런데 여기에서 한층 더 나아가서……"
10052030-58 = "예언자들의 코어를 수송선에 이식시켜서 응용한다면, 수송선 자체를 새롭게 개조하고 강화하는 것도 가능해 보여요."
10052030-59 = "어떤 식으로……?"
10052030-60 = "그러니까…… 가령 비나의 코어를 수송선에 이식하면, 비나의 능력이나 출력 중 일부를 수송선이 사용할 수 있게 된다는 거죠."
10052030-61 = "다른 예언자들의 코어 역시 마찬가지일 거고요."
10052030-66 = "……? 그건, 혹시!!!"
10052030-67 = "역시 그거네요, 케이! 적을 삼켜서 능력을 카피하는 동그란 생명체!"
10052030-68 = "아뇨, 아리스……. 하아……."
10052030-69 = "차라리 특수 무기 칩을 장비하는 것으로 기능 확장이 가능한, 암 웨폰 쪽 비유로 부탁드립니다……."
