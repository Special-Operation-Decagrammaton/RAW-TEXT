[translation]
1001008-1 = "도시 관찰"
1001008-2 = "아비도스 근처의 거리"
1001008-4 = "(지나가는 길에 시로코를 우연히 발견했다.)"
1001008-5 = "오후 1시 30분…… 카이저 편의점의 납품용 트럭 도착. 무거운 물건부터 적재 시작……"
1001008-6 = "점원이 밖으로 나오면서 창고에 사각이 발생."
1001008-7 = "이 때 뒷문을 통해 건물에 돌입한다면…… #n경우에 따라서는 차량을 수소문해두는 것도 고려를……."
1001008-8 = "흠. 애초에 이 구역은 너무 유동인구가 많군. 최적의 시간대를 찾는 건 고민해 볼 필요가 있겠어."
1001008-9 = "좋아, 다음 구역으로 이동하자."
1001008-11 = "[s] 시로코의 상태가 수상하다. 그녀를 따라가보자."
1001008-13 = "또 다른 거리"
1001008-15 = "(시로코가 역시 몸을 숨긴 채 고가도로를 주시하고 있다.)"
1001008-16 = "오후 2시 10분…… 코키 전기의 저 트럭 기사는 매일 이 시간이면 KV 하이웨이의 고가도로 아래에 차를 세워 두고 낮잠을 청하곤 하지."
1001008-17 = "이 때 트럭의 화물칸에 올라탈 수 있다면…… 손쉽게 본사 건물 안으로……."
1001008-18 = "음… 하지만 이 트럭은 곧 외곽 도로를 타고 5시간 이상 논스톱 주행을 이어갈 예정이니, 음식을 준비해둬야 할지도……"
1001008-19 = "음. 다음 구역으로 이동하자."
1001008-21 = "[s] 역시 시로코가 수상하다. 그녀를 따라가자."
1001008-23 = "어느 건물의 옥상"
1001008-25 = "(시로코가 마찬가지로 몸을 숨긴 채 지역 은행을 내려다보고 있다.)"
1001008-26 = "오후 3시 정각. 경비가 삼엄하지만…… 경비원들이 교대될 때만큼은 경계에도 사각이 생기는 법."
1001008-27 = "업무를 인수인계하는 5분 남짓한 시간 내에 정문의 경비원들을 제압할 수 있다면, 금고까지는 일사천리로……"
1001008-30 = "[s] \"뭘 하고 있는 거야……\""
1001008-31 = "(화들짝?!)"
1001008-32 = "……."
1001008-33 = "서, 선생님?!"
1001008-34 = "음…… 이건…… 그러니까……."
1001008-35 = "그게…… 음……. 뭐라고 설명하면 좋을까……. 이건……."
1001008-36 = "[s] \"안 됩니다.\""
1001008-37 = "……."
1001008-38 = "역시 은행을 터는 건 안 되는 건가……."
1001008-39 = "[s] \"범죄는 안됩니다.\""
1001008-40 = "……들키지 않으면……."
1001008-41 = "[s] \"안됩니다.\""
1001008-42 = "아니…… 미안해. 알겠어……."
1001008-43 = "으음…… 변명하는 건 아니지만 정말로 마음 먹었다기보다는 취미 같은 거……인데."
1001008-44 = "……."
1001008-45 = "……미안."
1001008-47 = "(어딘가 약간 풀이 죽은 시로코였다.)"
