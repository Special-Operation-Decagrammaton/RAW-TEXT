[translation]
1301306-1 = "약간의 일탈"
1301306-2 = "(모미지의 초대를 받고, 붉은겨울의 도서관으로 향했다……)"
1301306-3 = "도서관 내부"
1301306-7 = "아, 어서 오세요. 선생님!"
1301306-8 = "[s] \"어라? 도서관에 아무도 없네?\""
1301306-9 = "아, 그게…… 오늘은 임시 휴관일이거든요."
1301306-10 = "네? 휴관일인데 굳이 선생님을 부른 이유요?"
1301306-11 = "……"
1301306-12 = "일단, 조금 더 안쪽으로 들어오세요. 어서요!"
1301306-15 = "어때요, 선생님? 이 정도면 충분히 따듯하지 않으세요?"
1301306-16 = "[s1] \"응. 엄청 따듯하고…… 아늑한 느낌이야.\"\n[s2] \"그래서, 왜 휴관일에 부른 거야?\""
1301306-19 = "그, 그게요!"
1301306-20 = "일단은…… 오늘은 정기 휴관일이 아니에요. 임시죠."
1301306-21 = "대, 대답이 되지 않는다고요? 그렇긴…… 하네요……."
1301306-25 = "저기, 선생님."
1301306-26 = "그…… 도서관에서 낮잠, 자 보시지 않으시겠어요……?"
1301306-27 = "[s] \"엥?! 사서가 도서관에서 잠을 자자고 말해도 돼?!\""
1301306-28 = "그, 그게요!"
1301306-29 = "종종…… 학생들이나 체리노 회장이, 낮잠을 자러 도서관에 들를 때가 있어요……"
1301306-30 = "그때마다 깨우거나, 체리노 회장 같은 경우 몇 번 내보내기도 했는데요……"
1301306-31 = "……"
1301306-32 = "저기, 도대체 우리 도서관이 얼마나 낮잠을 자기에 좋은지, 궁금해져서 따라 해 봤다가……"
1301306-33 = "[s] \"의외로 낮잠 자기 좋은 장소라는 걸 알게 되었다는 거고?\""
1301306-34 = "……네."
1301306-35 = "그럼, 도서관은 왜 휴관시켰냐고요?"
1301306-36 = "그, 그건……!"
1301306-37 = "[s] \"알겠습니다. 사서로서의 최소한의 양심이란 거군요.\""
1301306-38 = "그, 그렇게 표현하시면……!"
1301306-39 = "틀린 건, 아니긴, 한데요……"
1301306-40 = "우우…… 역시 이상하겠죠…… 안 될 일이겠죠……"
1301306-41 = "도서관의 유지와 관리를 맡고 있는 사서가, 도서관을 낮잠이라는 사적인 용도로 사용하려 하다니……"
1301306-42 = "그, 그래도 일단, 수면실 같은 공간을…… 임시로 분리해 두기는 했지만……"
1301306-43 = "다른 학교의 도서관들은, 수면실을 따로 두기도 한다고 하니까요! 그러니까 우리도 이번만은……!"
1301306-47 = "……"
1301306-48 = "죄송해요. 선생님…… 저, 변명만 하고 있네요……"
1301306-49 = "[s3] \"아~ 아. 철야를 했더니, 왠지 엄청나게 졸리네.\"\n[s4] \"밖이 추워서 더 그런가? 졸음이 쏟아져.\""
1301306-52 = "저, 정말요?!"
1301306-53 = "저기…… 절 위해서 일부러 그렇게 말씀해 주시는 건 아니고요……?"
1301306-57 = "왜, 왜 대답 없이 웃기만 하세요…… 부끄럽잖아요……!"
1301306-58 = "……"
1301306-59 = "저기, 선생님."
1301306-65 = "그러면…… 같이, 낮잠 주무시지 않을래요……?"
1301306-66 = "[s] \"응. 금방이라도 쓰러질 것 같아. 음냐음냐.\""
1301306-67 = "에헤헤…… 그러면 이쪽으로 오세요. 잠자리를 준비해 뒀어요."
1301306-72 = "(모미지가 마련한 잠자리는, 말 그대로 따듯하고 아늑했다.)"
1301306-73 = "(온기가 충분히 서려 있었고, 책장이 절묘하게 그늘을 만들어 눈이 부시지도 않았다.)"
1301306-75 = "자리는 편안하신가요. 선생님?"
1301306-76 = "벌써 숨소리가 느려지셨네요. 정말 피곤하셨나 봐요……"
1301306-77 = "……"
1301306-78 = "있잖아요. 선생님."
1301306-79 = "저는…… 절 이해해 주는 사람이, 정말로, 좋아요."
1301306-83 = "그러면, 안녕히 주무세요."
