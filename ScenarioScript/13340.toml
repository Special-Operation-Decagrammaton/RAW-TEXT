[translation]
13340-1 = "제34화;사과"
13340-3 = "……선생님."
13340-4 = "[ns] \"……?\""
13340-5 = "우웅…… 죄송해요. 깨우기 곤란할 정도로 주무시고 계셨지만……."
13340-6 = "그치만 이제 슬슬 준비하지 않으면 안 된달까…… 호시노 쨩이 화낼 거 같아서……."
13340-11 = "유메 선배! [USERNAME] 선생님! 빨리 나오세요! 오아시스로 보물 찾으러 가야죠!!"
13340-12 = "교문 앞에서 기다리고 있을게요!"
13340-13 = "빨리 안 나오면 혼자 가버릴 거예요?!"
13340-17 = "우웅…… 호시노 쨩, 엄청 신났네요……."
13340-18 = "선생님이 오신 뒤로 좀 더 개구쟁이 같아졌달까……. 아, 물론 좋은 의미로요."
13340-19 = "[s] \"……………….\""
13340-20 = "……선생님?"
13340-21 = "[s] \"유메…….\""
13340-22 = "네, 선생님……? 무슨 일 있으세요?"
13340-23 = "혹시 무서운 꿈이라도 꾼 거예요? 그렇게 슬픈 얼굴로……."
13340-24 = "[s] \"미안해. 유메…….\""
13340-25 = "……."
13340-26 = "[s] \"미안해…… 나는…… 어른인데…….\""
13340-27 = "……."
13340-28 = "[ns] \"어른으로서…… 나는…….\""
13340-30 = "[ns] \"나는…….\""
13340-32 = "선생님."
13340-33 = "우웅…… 사실 자세히는 모르겠지만……. 그래도 이거 하나는 분명할 거 같아요."
13340-34 = "그건 선생님 잘못이 아니에요."
13340-35 = "응…… 그러니까 사과하지 않아도 괜찮아요."
13340-36 = "[ns1] \"나는 시간을 되돌릴 수 없어.\"\n[ns2] \"죽음을 없던 걸로 만들 수 없어.\""
13340-39 = "[ns] \"나는 그런 [ruby=신]존재[/ruby]가 아니야…….\""
13340-41 = "[ns] \"나는…… 그저……\""
13340-44 = "[ns3] \"내 손이 닿는 곳에서 고통받고 있는 아이에게,\"\n[ns4] \"손을 내미는 정도만 가능한 평범한 사람이니까.\""
13340-47 = "……. 응. 그거면 충분하지 않을까요, 선생님?"
13340-48 = "그런 작은 것들이 쌓여서…… 언젠가는……."
13340-49 = "커다란 기적이 될 수도 있으니까요! 저기 호시노 쨩 같은!"
13340-50 = "……우웅. 기적이라는 말을 쓰면 호시노 쨩이 화내지만……."
13340-51 = "그래도…… 저는 그런 걸 믿는 쪽이랄까……. 믿고 싶달까……."
13340-55 = "[ns] \"그 말을 계속 기억할게. 유메 쨩.\""
13340-56 = "네? 우, 우웅…… 이건 그냥 아무렇게나 한 말이지만……."
13340-60 = "……고통받은 아이를 구하러 가는 거죠?"
13340-61 = "[s] \"응. 내 손이 닿는 곳의 아이를.\""
13340-62 = "구할 수 있었으면 좋겠네요!"
13340-63 = "[s] \"구할 거야.\""
13340-73 = "[ns] \"너였구나.\""
13340-74 = "네놈은……?!"
13340-75 = "[USERNAME] 선생?! 어, 어떻게 이곳을……?!"
13340-76 = "[s] \"이제서야 만났구나. 지하생활자.\""
13340-77 = "무슨 속셈이냐! 이미 이 게임은 끝났다!"
13340-78 = "이건 이미 나의 승리다!! 무력하게 일방적으로 패배한 주제에!!"
13340-79 = "[s] \"아니.\""
13340-80 = "아니라고-?"
13340-81 = "[s] \"지금부터 시작이야.\""
13340-90 = "좌표 확인. 제한적으로 발현된 <색채>의 힘을 강탈, 그것으로 강제 도약 시퀀스 발동."
13340-94 = "[ns] \"시로코!! 시로코를 막아줘-----!!!\""
13340-101 = "……!!"
13340-102 = "그런 거에 손 내밀지 마."
13340-103 = "어, 어떻게……!!?"
13340-113 = "스나오오카미 시로코. 나는 너를 알고 있어. 넌 약하지 않아."
13340-114 = "왜냐면 너는 나니까. 응. 그리고 나는 강해."
13340-115 = "간단한 삼단논법이지. 그러니까 괜찮아."
13340-119 = "[ns] \"시로코!!\""
13340-120 = "응."
13340-124 = "선생님이 불러서 왔어. 내 도움이 필요한 거지?"
13340-125 = "지, 지금 상황은……."
13340-127 = "알고 있어. 호시노 선배를 그대로 두면 이 세계가 파멸로 향하게 돼."
13340-128 = "으, 으응……."
13340-129 = "알고 있어. [ruby=.]그[/ruby][ruby=.]건[/ruby] 가장 먼저 아비도스부터 시작했으니까."
13340-137 = "저걸 피했어……?!"
13340-141 = "모르…… 잖…… 아……"
13340-142 = "너희……. 이…… 고통을……."
13340-143 = "아니, 호시노 선배. 잘 알고 있어. 그 고통 같은 건."
13340-144 = "누구보다도 잘 알아."
13340-147 = "내가 저지하겠어. 타카나시 호시노. 덤벼."
13340-148 = "승산은 있는 거야?"
13340-149 = "응. [ruby=.]저[/ruby][ruby=.]걸[/ruby] 어떻게 상대해야 하는지 알고 있어."
13340-158 = "저번에 한 번 싸워봤으니까. 지지 않아."
13340-160 = "다음화;테러 vs 테러"
