[translation]
10052190-3 = "……언제까지인가."
10052190-4 = "언제까지 그렇게, 헛된 저항을 반복하려 하는가."
10052190-5 = "그대들의 헛된 저항이 1초 늘어날수록, 그대들의 고통 역시 1초 늘어날 뿐인 것을."
10052190-9 = "[ns] \"어……?\""
10052190-10 = "주, 주위가……. 강철대륙이……?"
10052190-11 = "당황하지 마요! 이건, 그러니까……. 결론만 말하자면……!"
10052190-12 = "데카그라마톤이 멋대로 에너지를 전개해서 만들어낸, 자기만의 '가상 영역' 같은 거니까요!"
10052190-13 = "저 자식을 박살 내면, 모든 게 원래대로 돌아올 거예요!"
10052190-14 = "바꿔 말해서 이 '영역' 안은, 완전히 데카그라마톤을 위해 구축된 공간이라고도 볼 수 있겠군요."
10052190-15 = "그, 그건 그런데……. 어떻게 알았죠?"
10052190-16 = "아마 만화책이나 게임에서 봤다고 할걸?"
10052190-17 = "그 말대로입니다. 역시 언제, 어느 때나 준비된 완벽한 메이드이자 요원인 저입니다."
10052190-18 = "긴장을 잠시 풀어줘서 좋기는 한데, 지금은 진지해야 할 때 같은데요?!"
10052190-25 = "서, 선생?! 지금, 지금……!"
10052190-26 = "[s] \"왜 그래, 리오?!\""
10052190-27 = "수송선과의 연결이 끊겼어!"
10052190-28 = "네?!"
10052190-29 = "절대제압장치 <아칠루트의 띠>, 가동."
10052190-34 = "하늘에 떠 있던 기계 구조물이……?"
10052190-36 = "[ns] \"저건 또 뭐야……?\""
10052190-39 = "그 생명을 거두지는 않겠다."
10052190-40 = "몸소 무릎을 꿇고 추한 모습을 보였던 그대의 모습을 보아, 그것만은 약속한다."
10052190-41 = "열쇠의 몸을 통해 여덟 세피라의 힘이 이 자리에 모였으니, 내가 그것을 사용하겠다."
10052190-42 = "무기물로 한정되었던 '변화'를, 모든 속성의 원소로 확장한다."
10052190-43 = "이 아칠루트의 띠 아래에서, 너희는 강철대륙의 일부가 되어."
10052190-44 = "새 몸과 새 영혼을 받아, 나의 사도로서 거듭날 것이다."
