[translation]
2004505-1 = "가이드 잔협전"
2004505-2 = "(피나의 호출을 받아 영화촌에 왔다.)"
2004505-3 = "(그리 어렵지 않게 피나를 찾을 수 있었다.)"
2004505-7 = "오늘 여러분들의 가이드를 맡게 된 피나입니다."
2004505-8 = "이곳 영화촌 공연장에서 관람하시게 될 연극은 임협 영화의 걸작인 <임협냥전기>를 무대로 옮긴 작품입니다."
2004505-9 = "평단으로부터 날카로운 주제의식과 더불어, 진중한 정극의 분위기로 호평을 받았던 바가 있는 <임협냥전기>의 명성을 이어 공연예술로 각색하게 되었습니다."
2004505-10 = "무대의 특성상 연출의 제한도 있었습니다만, 그 점에서는 깊은 고려를 통해……."
2004505-11 = "공연을 보기 전에 이렇게 사전 설명을 들으니까 좋은데."
2004505-12 = "아무것도 모른 채 봤다면 몰랐을 디테일을 아니까 공연이 더 기대돼."
2004505-13 = "저렇게 차분하게 잘 설명해 주니까 본격적인 문화행사 같아서 새롭구만."
2004505-14 = "……백문이 불여일견. 백귀야행이 자랑하는 명작 임협물, <임협냥전기>를 부디 감상해 주시기 바랍니다. 감사합니다."
2004505-18 = "[ns1] \"피나, 엄청 멋있는걸!\"\n[ns2] \"차분하게 설명하는 모습이 신선했어!\""
2004505-23 = "앗, 선생님!"
2004505-24 = "에헤헤. 부끄럽습니다."
2004505-25 = "물론 피 끓어오르는 백귀야행의 협객물은 생각만 해도 피나의 가슴이 활활 타오릅니다만……!"
2004505-26 = "여행객분들께 여행의 경험과 감정을 그대로 안겨드리기 위해서는 가이드가 한 발짝 물러나는 것도 중요하다고 배웠습니다!"
2004505-27 = "그러기 위해서 차분하게, 바위처럼 침착한 협객의 모습을 보여주고 있습니다!"
2004505-28 = "[s] \"이것이…… 임협……!\""
2004505-29 = "에헤— 선생님이 인정해 주시니 기쁩니다!"
2004505-30 = "앗, 공연이 곧 시작합니다! 선생님도 함께 보시면 좋겠습니다!"
2004505-32 = "(공연의 막이 오르고, 객석이 조용해졌다.)"
2004505-33 = "(공연의 이야기는 다소 무겁고 진중한 분위기로 시작되었다.)"
2004505-35 = "흐음.. 계속 언급되는 <잔 나누기>가 무슨 뜻일까……."
2004505-36 = "<잔 나누기>는 협객 간의 결연 의식입니다. 저 두 사람은 의를 맺으려고 하는 거랍니다."
2004505-37 = "아하, 그냥 술 약속을 하는 게 아니라 중요한 의미였구먼."
2004505-38 = "고마워요, 덕분에 이해가 됐어요."
2004505-43 = "저기, 가이드님. <연장>은 무슨 뜻인가요?"
2004505-44 = "아, 그건 말이지요—"
2004505-49 = "[ns3] (오오… 관람에 방해되지 않는 선에서 척척 대답을…….)\n[ns4] (피나, 멋지다!)"
2004505-53 = "형님…… 뒷일까지 제가 맡아서 했는데, 이런 대접이라뇨……!"
2004505-54 = "흐음…… 뒷일?"
2004505-55 = "대신 책임을 지는 것을 말합니다!"
2004505-56 = "엑?!"
2004505-57 = "냥스케가 대신 사죄하고 모든 책임을 졌었는데, 저렇게 헌신짝처럼 내쳐버리다니,"
2004505-58 = "인도 의도 없는 겁니다!"
2004505-59 = "어……어 그렇군요. 감사해......요?"
2004505-61 = "(이윽고, 주인공과 조직의 대립이 클라이막스에 이르자……)"
2004505-63 = "이……이……."
2004505-64 = "배신했겠다, 이 자식이!!"
2004505-65 = "?!"
2004505-66 = "냥스케!! 지면 안 됩니다!! 반드시 원한을 갚아주는 겁니다!!"
2004505-70 = "[ns5] \"피나?!\"\n[ns6] \"목소리가 커!!\""
2004505-73 = "승리는 인과 의를 지키는 사람의 편입니다!! 힘내는 겁니다!!"
2004505-77 = "[ns] (큰일이다… 관객들이 당황했을 텐데!)"
2004505-78 = "뭐…… 뭐지 이게?"
2004505-79 = "아까까지만 하더라도 조용하고 엄숙했는데?"
2004505-80 = "이건…… 역시 그거겠네."
2004505-81 = "그 유명한 관객 참여 극을 여기서 볼 줄이야!"
2004505-85 = "오호 그렇구먼, 이런 연극을 처음 보는 사람들이 많아서 가이드 씨가 이끌어주는 건가."
2004505-86 = "한번 해보고 싶긴 했었어, 관객 참여!"
2004505-87 = "싸워라!! 꼭 이겨라!!"
2004505-88 = "컵 나누기인지 뭔지 했잖냐!"
2004505-89 = "Yes!! 끝장내는 겁니다 냥스케!"
2004505-96 = "죄죄죄죄, 죄송합니다아아앗!!"
2004505-97 = "입이 백 개여도 할 말이 없습니다!! 너무 좋아하는 <임협냥전기>의 연극을 보는 것은 처음이라 너무 흥분해 버린 나머지 이런 결례를…!!"
2004505-98 = "이래서는 가이드 실격입니다……. 이제 파문입니다!"
2004505-99 = "이 책임, 어떻게 해야……! 이, 이 손가락이라도……!"
2004505-100 = "[s7] \"피나, 진정하고…….\"\n[s8] \"대신 사과드립니다. 손해가 있다면 제가 어떻게든…….\""
2004505-103 = "핫핫핫하!! 무대 베테랑을 당황시키다니 재주가 있더군 아가씨!"
2004505-104 = "걱정말라구, 무대에서 보아도 다들 좋아하는 눈치였고 말이지."
2004505-105 = "하지만 불초 피나의 잘못으로 공들여 준비하신 연극을 망쳐버린 게…"
2004505-106 = "뭐어, 우리가 생각했던 분위기가 아니긴 했지만,"
2004505-107 = "가끔씩은 이런 일 정도야 괜찮지 뭘."
2004505-108 = "젊을 적 히어로 공연 하던 추억도 떠올랐어."
2004505-109 = "너무 주눅들지 말라구, 왠지 기운을 받은 것처럼 힘도 났고 말야."
2004505-110 = "다들 몰입해서 표정까지 달라진 건 오래 살고 볼 일이었지~"
2004505-111 = "우…… 우우…… 감사합니다아……."
2004505-116 = "저…… 저기, 배우 만남은 이곳으로 오면 된다고 해서 왔는데요."
2004505-117 = "평소 보던 공연과는 특이하게 진행되어서 꼭 기념사진을 남기고 싶어서요."
2004505-118 = "오~ 좋지요, 가이드씨도 기왕 이렇게 된 거 한 장 박자고."
2004505-119 = "피나 말입니까?!"
2004505-123 = "자자 사양 말고~"
2004505-129 = "(그렇게 공연은 뒷마무리까지 무사히 끝났고,)"
2004505-130 = "(쑥스러워 하면서도 피나가 안심하는 모습을 보며 하루가 끝났다.)"
