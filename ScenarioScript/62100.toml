[translation]
62100-1 = "10화;둥지"
62100-3 = "부탁드립니다, 사오리 선배! 이만 돌아가 주세요!"
62100-4 = "저희는 여기를 지키라는 명령을 받았어요! 누구도 들어오지 못하게 하라고요!"
62100-6 = "대립하기만 해서는 아무것도 변하지 않는다!"
62100-7 = "너희들이 우리를 탐탁지 않게 생각하고 있다는 것은 알고 있지만…… 그래도 길을 열어 주었으면 한다!"
62100-8 = "우리는 단지…… 수업 거부를 하고 있는 카케하시 스바루와, 상담을 하러 온 것뿐이다!"
62100-9 = "애초에 여기는, 누구에게도 허락되지 않은 장소였다!"
62100-11 = "그, 그건 그렇긴 한데……!"
62100-12 = "어떻게 하지……?"
62100-13 = "그래도 스바루 선배는…… 여기를 지키라고 했어."
62100-14 = "그냥 진지 만들고 있으라고 했던 것 같은데……."
62100-15 = "밖에서든 안에서든 나오지 못하게 하라고 했으니까, 비슷한 말일 거야!"
62100-16 = "역시 돌아가 주세요! 안 그러면 저희도 발포할 수밖에–"
62100-21 = "누, 누구야?!"
62100-22 = "아, 미안……. 발포라는 말이 들려서……."
62100-27 = "……쏜 건가."
62100-28 = "그래. 쐈네."
62100-29 = "어쩐지 이렇게 될 것 같긴 했는데요오……."
62100-31 = "괘, 괜찮으시겠어요?! 숫자 차이가 너무 나는데요……"
62100-32 = "걱정하지 마."
62100-33 = "근거라도 있나요?!"
62100-35 = "근거라……."
62100-36 = "역시 보여주는 게 빠르겠지?"
62100-37 = "부탁할게. 선생님."
62100-38 = "[s] \"왜 가장 중요할 때 결론은 이렇게 되는 걸까!\""
62100-39 = "그건……."
62100-41 = "어떤 의미로는, 아리우스식이니까?"
