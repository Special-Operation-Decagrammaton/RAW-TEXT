[translation]
1014802-1 = "出遊少女與優雅的假日"
1014802-4 = ""
1014802-5 = "打擾了。"
1014802-6 = "啊，今天沒泡咖啡啊。咖啡壺借我一下。"
1014802-7 = ""
1014802-9 = ""
1014802-10 = ""
1014802-12 = "趁著燒水的時候，把上次買的零食……"
1014802-13 = "對了，我放進櫃子裡了。"
1014802-14 = ""
1014802-18 = "最後再把沙發弄好……"
1014802-19 = ""
1014802-21 = ""
1014802-22 = "……好，這樣就完美了。"
1014802-23 = "怎麼了，老師？"
1014802-24 = "[s1] 「沒有，沒什麼。」\n[s2] 「我覺得吐槽就輸了。」"
1014802-27 = "是嗎？你不用在意我。"
1014802-28 = "今天我沒打算妨礙你，也不是為了萬魔殿的事來的。"
1014802-29 = "我會乖乖看書，你就專心工作吧。"
1014802-32 = "（2小時後……）"
1014802-33 = ""
1014802-34 = "…………"
1014802-35 = ""
1014802-37 = ""
1014802-38 = "（伊呂波跟平常一樣，只顧著看書）"
1014802-39 = ""
1014802-41 = ""
1014802-42 = "[ns3] 「那個，嗯……」\n[ns4] 「雖然由我來說有點好笑。」"
1014802-45 = "……嗯？有什麼事嗎？"
1014802-46 = "[s5] 「難得放暑假……」\n[s6] 「要不要過得更像暑假一點……」"
1014802-49 = "……"
1014802-50 = "…………"
1014802-51 = ""
1014802-53 = ""
1014802-54 = "啊啊，原來如此。我明白了。"
1014802-55 = "可以請你出去一下嗎？"
1014802-56 = "[s] 「咦？」"
1014802-57 = "其實你要待在這裡也無所謂。"
1014802-58 = "但這樣的話……"
1014802-59 = ""
1014802-61 = ""
1014802-62 = "你會好好「負起責任」吧？"
1014802-63 = ""
1014802-66 = "（有種不好的預感，急忙走出了辦公室）"
1014802-67 = "（然後，過了一陣子……）"
1014802-68 = "現在可以進來了。"
1014802-69 = ""
1014802-71 = "[ns] 「呃，雖然想問的事情很多……」"
1014802-73 = "[ns] 「為什麼穿泳裝？」"
1014802-74 = "咦？你該不會想裝傻吧？"
1014802-75 = "剛才不是你吵著說想看我穿泳裝嗎？"
1014802-76 = "[s] 「我第一次聽說耶！？」"
1014802-77 = "畢竟我是借用沙發的人，也只能照辦了。"
1014802-78 = "今天一整天就只好穿這樣了。"
1014802-79 = "……"
1014802-80 = "那麼我要回去看書了，先這樣。"
1014802-81 = ""
1014802-83 = ""
1014802-84 = "[ns] 「……就算換了衣服，做的事還是一樣啊。」"
1014802-85 = "咦？嗯……是啊？"
1014802-86 = ""
1014802-88 = ""
1014802-89 = "還是說，你希望我做些適合穿泳裝的事呢？"
1014802-90 = "[s7] 「不，沒這回事。」\n[s8] 「我覺得看書很棒。」"
1014802-91 = ""
1014802-92 = ""
1014802-97 = "（結果那天伊呂波一整天都穿著泳裝看書，就這樣回去了）"
1014802-98 = "（令人非常冤枉的是，夏萊的老師讓學生穿泳裝工作的傳聞傳開了）"
