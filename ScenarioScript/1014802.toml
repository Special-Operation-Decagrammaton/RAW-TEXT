[translation]
1014802-1 = "นักท่องเที่ยวหญิงกับวันหยุดสุดหรู"
1014802-4 = ""
1014802-5 = "ขออนุญาตค่ะ"
1014802-6 = "อ๊ะ วันนี้ยังไม่ได้ชงกาแฟสินะคะ ฉันขอใช้กาต้มน้ำหน่อยค่ะ"
1014802-7 = ""
1014802-9 = ""
1014802-10 = ""
1014802-12 = "ระหว่างรอน้ำเดือด ก็ไปดูขนมที่ซื้อไว้คราวก่อน..."
1014802-13 = "อ้อ เก็บไว้บนชั้นนี่เนอะ"
1014802-14 = ""
1014802-18 = "แล้วสุดท้ายก็จัดโซฟาให้เรียบร้อย"
1014802-19 = ""
1014802-21 = ""
1014802-22 = "ดีละ... เท่านี้ก็สมบูรณ์แบบแล้วค่ะ"
1014802-23 = "เป็นอะไรไปคะ คุณครู?"
1014802-24 = "[s1] \"เปล่า ไม่มีอะไรหรอก\"\n[s2] \"ขืนทักก็เหมือนเป็นฝ่ายแพ้สิ\""
1014802-27 = "งั้นเหรอคะ? ไม่ต้องใส่ใจมากหรอกค่ะ"
1014802-28 = "วันนี้ไม่ได้คิดจะมารบกวนหรอกค่ะ แล้วก็ไม่ได้มาเพราะงานของแพนเดโมเนียม โซไซตี้ด้วย"
1014802-29 = "ฉันจะนั่งอ่านหนังสือเงียบๆ คุณครูก็ทำงานตามสบายได้เลยค่ะ"
1014802-32 = "(2 ชั่วโมงต่อมา...)"
1014802-33 = ""
1014802-34 = "..."
1014802-35 = ""
1014802-37 = ""
1014802-38 = "(อิโรฮะยังคงอ่านหนังสือเหมือนทุกที)"
1014802-39 = ""
1014802-41 = ""
1014802-42 = "[ns3] \"เอ่อ คือ...\"\n[ns4] \"จะให้พูดเองก็ตลกอยู่หรอกนะ\""
1014802-45 = "คะ...? มีอะไรเหรอคะ?"
1014802-46 = "[s5] \"อุตส่าห์ได้ลาพักร้อนทั้งทีนะ...\"\n[s6] \"พักผ่อนให้สมกับเป็นวันลาพักร้อนสักหน่อยมั้ย...\""
1014802-49 = "..."
1014802-50 = "..."
1014802-51 = ""
1014802-53 = ""
1014802-54 = "อ่า อย่างนี้นี่เอง เข้าใจแล้วค่ะ"
1014802-55 = "ช่วยออกไปข้างนอกสักครู่ได้มั้ยคะ?"
1014802-56 = "[s] \"หืม?\""
1014802-57 = "ถ้าคุณครูจะอยู่ต่อ ฉันก็ไม่ได้ว่าอะไรหรอกค่ะ"
1014802-58 = "แต่ถ้าเป็นแบบนั้น..."
1014802-59 = ""
1014802-61 = ""
1014802-62 = "จะ 'รับผิดชอบ' ให้เต็มที่ใช่มั้ยคะ?"
1014802-63 = ""
1014802-66 = "(คุณครูรู้สึกไม่สบายใจขึ้นมา จึงรีบออกไปนอกสำนักงาน)"
1014802-67 = "(หลังจากนั้นสักพัก...)"
1014802-68 = "เข้ามาได้แล้วค่ะ"
1014802-69 = ""
1014802-71 = "[ns] \"เอ่อ ครูมีเรื่องที่อยากถามหลายเรื่องเลย\""
1014802-73 = "[ns] \"ทำไมถึงใส่ชุดว่ายน้ำล่ะ?\""
1014802-74 = "คะ? อย่าบอกนะคะว่าจะทำเป็นไม่รู้เรื่อง?"
1014802-75 = "เมื่อกี้คุณครูยังงอแงอยากเห็นฉันใส่ชุดว่ายน้ำอยู่เลยนี่คะ?"
1014802-76 = "[s] \"ไม่เห็นจะรู้เรื่องเลย?!\""
1014802-77 = "ฉันเป็นคนที่มาอาศัยใช้โซฟาของคุณครู ก็ช่วยไม่ได้นะคะ"
1014802-78 = "วันนี้คงต้องอยู่ในชุดนี้ทั้งวันแล้วละค่ะ"
1014802-79 = "..."
1014802-80 = "ถ้างั้น ฉันจะกลับไปอ่านหนังสือต่อแล้วนะคะ"
1014802-81 = ""
1014802-83 = ""
1014802-84 = "[ns] \"ถึงชุดจะเปลี่ยน แต่ก็ยังทำเหมือนเดิมสินะ...\""
1014802-85 = "คะ? ก็... ใช่ค่ะ?"
1014802-86 = ""
1014802-88 = ""
1014802-89 = "หรือว่าอยากให้ฉันทำอะไรที่เข้ากับชุดว่ายน้ำเหรอคะ?"
1014802-90 = "[s7] \"เปล่า ไม่ใช่เลย\"\n[s8] \"การอ่านหนังสือเป็นเรื่องดีมากเลยนะ\""
1014802-91 = ""
1014802-92 = ""
1014802-97 = "(สรุปว่าวันนั้นอิโรฮะก็ใส่ชุดว่ายน้ำอ่านหนังสืออยู่ทั้งวัน ก่อนจะกลับไป)"
1014802-98 = "(ทั้งที่ไม่ได้ทำอะไรผิดแท้ๆ แต่กลับมีข่าวลือแพร่ไปว่าคุณครูของชาเล่ต์ให้นักเรียนใส่ชุดว่ายน้ำทำงาน)"
