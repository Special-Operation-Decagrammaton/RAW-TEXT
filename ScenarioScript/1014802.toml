[translation]
1014802-1 = "아우스플뤼글러린과 우아한 휴일"
1014802-5 = "실례합니다."
1014802-6 = "아, 오늘 커피 안 따르셨네요. 포트 좀 빌릴게요."
1014802-12 = "물이 끓는 동안, 저번에 사둔 과자가……."
1014802-13 = "아참, 선반에 넣어뒀었죠."
1014802-18 = "그리고, 마지막으로 소파를 세팅하면."
1014802-22 = "……좋아, 이걸로 완벽하네요."
1014802-23 = "왜 그러세요, 선생님?"
1014802-24 = "[s1] \"아뇨, 아무것도 아닙니다.\"\n[s2] \"지적하면 지는 거라 생각해.\""
1014802-27 = "그런가요? 뭐, 너무 신경 쓰지 마세요."
1014802-28 = "오늘은 딱히 방해할 생각 없거든요. 만마전 일로 방문한 것도 아니고."
1014802-29 = "얌전히 책만 읽을 테니까, 편하게 일하고 계세요."
1014802-32 = "(2시간 후…….)"
1014802-34 = "…………."
1014802-38 = "(평소와 똑같이 이로하는 책만 읽고 있다.)"
1014802-42 = "[ns3] \"저기, 그…….\"\n[ns4] \"내가 말하는 것도 우습긴 한데.\""
1014802-45 = "……네? 무슨 일인가요?"
1014802-46 = "[s5] \"모처럼 여름휴가인데…….\"\n[s6] \"좀 더 여름휴가다운 휴양을 하는 게…….\""
1014802-49 = "……."
1014802-50 = "…………."
1014802-54 = "아아, 과연. 이해했습니다."
1014802-55 = "잠깐 나가 주시겠어요?"
1014802-56 = "[s] \"네?\""
1014802-57 = "뭐, 저는 딱히 계셔도 상관은 없지만."
1014802-58 = "그렇게 되면……."
1014802-62 = "제대로 '책임'져 주실 거죠?"
1014802-66 = "(불안한 마음이 들어, 서둘러 사무실 바깥으로 나왔다.)"
1014802-67 = "(그리고, 잠시 후…….)"
1014802-68 = "이제 들어오셔도 돼요."
1014802-71 = "[ns] \"그, 묻고 싶은 건 많은데. \""
1014802-73 = "[ns] \"어째서 수영복 차림?\""
1014802-74 = "네? 설마 발뺌하시는 건가요?"
1014802-75 = "조금 전에 제 수영복 차림이 보고 싶다고 그렇게 떼쓰셨잖아요?"
1014802-76 = "[s] \"금시초문인데요?!\""
1014802-77 = "저로서는, 소파를 빌려 쓰는 입장이라 어쩔 수 없네요."
1014802-78 = "오늘 하루는 이 차림으로 보내는 수밖에요."
1014802-79 = "……."
1014802-80 = "그러면, 다시 독서로 돌아갈 테니까, 이만."
1014802-84 = "[ns] \"……복장은 바뀌어도, 하는 건 같구나.\""
1014802-85 = "네? 뭐…… 그렇죠?"
1014802-89 = "아니면, 혹시 수영복 차림에 맞는 무언가를 하길 바라시는 걸까요?"
1014802-90 = "[s7] \"아뇨, 아닙니다.\"\n[s8] \"독서는 훌륭하다고 생각합니다.\""
1014802-97 = "(결국, 그날 하루 종일 이로하는 수영복 차림으로 책을 읽다가 돌아갔다.)"
1014802-98 = "(몹시나 억울하게도, 샬레의 선생님이 학생을 수영복 차림으로 일하게 한다는 소문이 퍼졌다.)"
