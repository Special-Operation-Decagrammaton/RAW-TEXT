[translation]
90000045-4 = "비나의 데이터 수집 완료."
90000045-5 = "네. 확인했습니다. 데카그라마톤의 세 번째 예언자, 비나. 데이터 확보했습니다."
90000045-6 = "이제 분석만 남았네요. 수고 많으셨어요. 모두들."
90000045-7 = "[s] \"수고했어.\""
90000045-8 = "응, 부장도 수고했어. 부장의 알고리즘 덕분이야."
90000045-9 = "이제……. 분석 결과가 저쪽 모니터에 출력될 거예요."
90000045-16 = "으응. 이게 전부야?"
90000045-17 = "우리가 확보한 데이터를 기반으로 분석하는 것이라 현재 시점에는 이 정도네요."
90000045-18 = "부족할 지도 모르겠지만, 지금은 첫 발을 디뎠다는 것에 의의를 두죠."
90000045-19 = "응. 그런가. 첫술에 배부를 수는 없겠지."
90000045-20 = "지금은 최대한 많은 개체의 정보를 확보하는 것이 목표니까요."
90000045-21 = "그럼 조금만 쉬고, 다음 예언자를 목표로 이동해보죠."
90000045-28 = "바로…… 밀레니엄 근교에 있는 <폐허>입니다."
90000045-30 = "다음화;정보수집 5 - 폐허"
