[translation]
2006405-1 = "교칙 위반"
2006405-2 = "(우라라의 고민을 들어주기 위해 와일드헌트 예술학원으로 향했다.)"
2006405-4 = "와일드헌트의 인적 없는 공터"
2006405-8 = "선생님. 이쪽입니다."
2006405-9 = "여기까지 오느라 고생하셨을 텐데…… 정말 죄송해요."
2006405-10 = "[s] \"괜찮아! 학생의 고민을 해결하는 게 내 기쁨이야!\""
2006405-11 = "그렇게 말씀하시니 다행이긴 한데……."
2006405-14 = "저…… 아직도 망설여져요."
2006405-15 = "학원의 방침과 정면으로 반하는 고민을…… 선생님께 털어놓아도 될지……."
2006405-16 = "[s] \"그렇게 말하니까 더 듣고 싶어졌어.\""
2006405-19 = "그, 그렇군요?"
2006405-20 = "우으으……."
2006405-21 = "이번 비밀도…… 지켜주실 거죠?"
2006405-25 = "그럼 믿고 말씀드릴게요."
2006405-28 = "며칠 전의 일이에요."
2006405-32 = "마나미 님의 명령으로 학원의 금지 목록이 추가됐죠."
2006405-33 = "그 안에…… 제가 가장 사랑하는 연극이 포함되어 있었어요."
2006405-34 = "[ns] \"대체 어떤 내용인데 금지가 된 거야?!\""
2006405-36 = "주인공이 평소에는 평범한 학생으로 생활하는데……."
2006405-41 = "밤이 되면 가면과 망토를 쓴 다크 히어로가 되어서 권선징악을 실천하는 내용이에요."
2006405-42 = "그런데 그것이 무법자를 영웅화해서 <괴도>에 대한 잘못된 인식을 줄 수 있다면서……."
2006405-43 = "마나미 님이 직접 금지했죠."
2006405-46 = "[ns] \"그랬구나…….\""
2006405-48 = "해당 내용이 공표된 후, 사감대가 금지된 연극 관련 물품들을 전부 압수했어요."
2006405-49 = "다행히 저는 부회장이라 아직은 괜찮지만, #n일반 학생들은 모두 빼앗기고 말았어요."
2006405-50 = "……하지만 제 소장품들을 찾아내는 것도 시간문제겠죠."
2006405-51 = "언제까지 계속 숨길 수는 없을 거예요."
2006405-52 = "제가 자진해서 관련 물품들을 제출해 볼까 생각도 해봤지만……."
2006405-55 = "역시…… 좋아하는 소장품을 잃는 건 싫어요."
2006405-56 = "특히 대본은 초회 공연 때의 것이라 지금은 구하지도 못하는데."
2006405-57 = "아아…… 모두의 모범이 되어야 하는 부회장이 이렇게 교칙을 어긴다니……."
2006405-58 = "선생님……."
2006405-59 = "저는 어떻게 해야 좋나요?"
2006405-60 = "[s1] \"만약에 압수당하거나 자진 제출하면…….\"\n[s2] \"물건은 언제 돌려받을 수 있는 거야?\""
2006405-63 = "아마 마나미 님을 설득하지 않는 한…… 돌려받지 못할 거예요."
2006405-64 = "하지만 쉽게 설득이 될 분도 아니고……."
2006405-65 = "[s] (이대로는 정말 답이 없어 보인다…….)"
2006405-68 = "[ns] \"내가 맡아둘게. 그럼 샬레에 와서 볼 수는 있잖아?\""
2006405-69 = "선생님이…… 맡아주신다고요?"
2006405-70 = "……."
2006405-71 = "저는 학원의 곳곳을 잘 알고 있다 보니, 몰래 외부로 반출할 수 있는 루트도 알고 있어요."
2006405-72 = "하지만 모든 게 대본대로 완벽하게 흘러가진 않을 거라……."
2006405-73 = "만약에 발각되면 선생님도 불이익을 받을 수 있는데, 정말 괜찮아요?"
2006405-74 = "[s3] \"같이 저질러 보는 거야!\"\n[s4] \"우리는 이미 비밀 극단의 동료니까!\""
2006405-77 = "……."
2006405-78 = "으으으…… 예술 평의회 부회장이 나쁜 짓을 꾸미다니, 학우들을 볼 낯이 없네요. #n이래서는 제가 '괴도'가 되어버려요……."
2006405-79 = "하지만 지금은 달리 방법이……"
2006405-82 = "……선생님. 오늘 밤에 여기서 다시 만나요."
2006405-83 = "어두운 때를 이용해 행동을 시작하는 거예요."
2006405-84 = "[s] \"응! 밤에 다시 보자!\""
2006405-91 = "(그리하여 다가온 약속의 시간…….)"
2006405-95 = "(우라라가 알려준 루트로 사감대의 감시를 피해 학원 내부로 들어왔다.)"
2006405-96 = "(우라라는 어떻게 이런 루트를 알고 있던 걸까…….)"
2006405-99 = "선생님. 때맞춰 오셨군요."
2006405-103 = "시간이 없으니 바로 실행에 들어갈게요."
2006405-104 = "자…… 이걸 받아주세요."
2006405-108 = "[ns] \"새, 생각보다 무겁네?\""
2006405-109 = "조, 좋아하는 연극이라 관련 굿즈들이 많다 보니……."
2006405-110 = "부탁하는 처지에 죄송하지만, 부디 조심히 옮겨 주세요. #n특히 대본은 절대 구겨지면 안 돼요."
2006405-111 = "[s] \"응. 맡겨줘.\""
2006405-112 = "그럼 서둘러 주세요. 아직 주변에 사감대가 있을지도 모르……."
2006405-113 = "응? 거기 누구야?"
2006405-116 = "[ns] (근처의 덤불 속에 숨자……!!)"
2006405-120 = "서, 선생님? 우, 우리 너, 너무 가깝지 않나요?"
2006405-121 = "[ns5] \"미안. 조금만 참아.\"\n[ns6] \"바로 옆에 왔어.\""
2006405-124 = "우, 우으으으으……."
2006405-128 = "흐으음?"
2006405-129 = "뭐지? 분명 여기서 사람 목소리를 들은 것 같은데."
2006405-132 = "……."
2006405-133 = "어이! 거기 너! 숨어 있는 거 다 아니까 나와!"
2006405-134 = "자진해서 나오면 정상참작해 줄 테니까!"
2006405-138 = "……역시 잘못 들었나?"
2006405-144 = "얍! 간 줄 알았지?"
2006405-147 = "……."
2006405-148 = "뭐야. 진짜로 없나 보네."
2006405-149 = "에이, 실적 올려서 외출증이나 받으려 했더니."
2006405-153 = "가, 갔나요?"
2006405-154 = "[s] \"응. 간 것 같아.\""
2006405-155 = "우으으으……."
2006405-160 = "다, 다행이네요. 발각됐으면……. 정말 큰일 날 뻔……."
2006405-161 = "순간 얼어서 꼼짝도 못 했는데…… 선생님 덕분에 피했어요."
2006405-164 = "……."
2006405-165 = "으으으, 평의회 부회장이 사감대를 피해서 이런 밤에 뭘 하고 있는 거람."
2006405-166 = "아무튼 어서 가보세요. 사감대가 또 올지도 모르니 조심히……."
2006405-167 = "[s] \"응. 우라라도 조심해.\""
2006405-170 = "(이후 서둘러서 학원을 빠져나갔다.)"
2006405-171 = "(아무튼 들키지 않아서 다행이다…….)"
2006405-175 = "역시 선생님…… 죄가 많은 분이네요."
2006405-176 = "자기가 무슨 짓을 했는지……. 이해는 하고 계실까요?"
2006405-177 = "……."
2006405-178 = "후, 후후…… 안 돼요, 안 돼."
2006405-179 = "착한 생각, 착한 생각……."
