[translation]
2006405-1 = "ルール違反"
2006405-2 = "（ウララの悩みを聞くため、ワイルドハントに向かった）"
2006405-4 = "人がいないワイルドハントの空き地"
2006405-8 = "先生。"
2006405-9 = "ご足労をおかけして……本当に申し訳ありません。"
2006405-10 = "[s] \"大丈夫。生徒の悩みを解決するのが私の仕事だから。\""
2006405-11 = "そう言ってくださるのは嬉しいのですが……。"
2006405-14 = "この期に及んで……まだ迷っています。"
2006405-15 = "学院の方針に背反する悩みを、先生に打ち明けても良いものか……。"
2006405-16 = "[s] \"なおさら聞かせてほしいな。\""
2006405-19 = "そ、そうですか？"
2006405-20 = "うぅ……。"
2006405-21 = "今回のことも……秘密にしてくださいますよね？"
2006405-25 = "……先生を信じて、お話します。"
2006405-28 = "数日前のことです。"
2006405-32 = "マナミ様の指示により学院の禁止リストが更新されました。"
2006405-33 = "その中に……わたくしが最も愛する「演劇」も含まれていたのです。"
2006405-34 = "[ns] \"禁止になるって、どんな内容だったの？\""
2006405-36 = "平凡な生徒として過ごしている主人公が――"
2006405-41 = "夜になるとマスクとマントをつけたダークヒーローとなり、悪を成敗するという内容です。"
2006405-42 = "それが無法者を英雄扱いしており、#n「怪盗」に対する誤った認識を与える恐れがあると……。"
2006405-43 = "マナミ様自ら禁止になさったのです。"
2006405-46 = "[ns] \"そうなんだ……。\""
2006405-48 = "禁止リストの更新が公表されてから、#n演劇に関する物品は全て没収の対象になっています。"
2006405-49 = "幸い、わたくしは副会長なのでまだ大丈夫ですが、#n一般の生徒は皆、取り上げられてしまいました。"
2006405-50 = "……わたくしの物が見つかるのも時間の問題です。"
2006405-51 = "いつまでも隠し通せるものではありませんので。"
2006405-52 = "ならば、と。自発的に提出しようとも考えましたが……。"
2006405-55 = "やはり、好きな物を手放すことはできません。"
2006405-56 = "特に台本は初演の時のものなので、今はもう手に入らないですし。"
2006405-57 = "ああ……模範となるべき副会長がルールを破っているなんて……。"
2006405-58 = "先生……。"
2006405-59 = "わたくしはどうするべきだと思いますか？"
2006405-60 = "[s1] \"没収されたり、自ら提出したりしたら……。\"\n[s2] \"それはいつ返してもらえるの？\""
2006405-63 = "返ってくることはないかと。#n……マナミ様を説得しない限り。"
2006405-64 = "ですが簡単に説得できる方ではないので……。"
2006405-65 = "[s] （何か良い方法は……あっ！）"
2006405-68 = "[ns] \"私が預かろうか？\""
2006405-69 = "先生に預ける……ですか？"
2006405-70 = "……。"
2006405-71 = "わたくしは学院内を把握していますので、外部に持ち出せるルートを知っています。"
2006405-72 = "しかし物事が台本どおりにいくとは限らない……。"
2006405-73 = "万が一見つかれば、先生にも害が及ぶかもしれません。#nそれでも、本当によろしいのですか？"
2006405-74 = "[s3] \"その時はその時だよ！\"\n[s4] \"私たちはもう秘密劇団の一座だからね！\""
2006405-77 = "……。"
2006405-78 = "うぅぅ……芸術評議会副会長が悪事を企むなんて、学友に合わす顔がありません。#nこれではわたくしが「怪盗」になってしまいます……。"
2006405-79 = "ですが、今は他に方法が……。"
2006405-82 = "……先生。今夜、またこの場所にいらしてください。"
2006405-83 = "事は夜闇に乗じて進めましょう。"
2006405-84 = "[s] \"分かった。また夜に！\""
2006405-91 = "（1日の仕事を片づけて、約束の時間が近づいてきた）"
2006405-95 = "（ウララが教えてくれたルートでワイルドハントに潜り込む）"
2006405-96 = "（どうして寮監隊の目を逃れられるルートを知ってたんだろう……）"
2006405-99 = "先生、時間どおりですね。"
2006405-103 = "長居は禁物です。"
2006405-104 = "……これをお持ちください。"
2006405-108 = "[ns] \"い、意外と重いね？\""
2006405-109 = "好きな演劇なので、集めたグッズも数が多く……。"
2006405-110 = "頼んでいる立場でおこがましいですが、どうか、細心の注意をお願いします。#n特に台本は丁重に。絶対に折れたりしないよう取り扱ってください。"
2006405-111 = "[s] \"任せて。\""
2006405-112 = "では、寮監隊にはお気をつけて。まだ近くにいるかもしれ――"
2006405-113 = "ん？誰かいるのか？"
2006405-116 = "[ns] （そこの草むらに隠れよう……！！）"
2006405-120 = "せ、先生？近過ぎませんか？"
2006405-121 = "[ns5] \"ごめん、ちょっと我慢して。\"\n[ns6] \"すぐそばまで来てるから。\""
2006405-124 = "うっ、うぅぅぅぅ……。"
2006405-128 = "うーん？"
2006405-129 = "おっかしいな……人の声したと思ったんだけど。"
2006405-132 = "……。"
2006405-133 = "おーい！隠れても無駄だ、出てきなさい！"
2006405-134 = "自首すれば情状酌量してやるぞー？"
2006405-138 = "……気のせいだったのかな？"
2006405-144 = "行ったと思った？残念！まだ行ってませんでしたー！"
2006405-147 = "……。"
2006405-148 = "なんだ。本当に気のせいか。"
2006405-149 = "はぁ……実績を上げるチャンスだと思ったのに。"
2006405-153 = "い、行きましたか……？"
2006405-154 = "[s] \"うん、もう行ったみたい。\""
2006405-155 = "うぅぅぅ……。"
2006405-160 = "よかったです……もしも見つかっていたらと思うと……。"
2006405-161 = "わたくし、一瞬固まって動けなくなってしまって……先生のおかげで隠れられました。"
2006405-164 = "……。"
2006405-165 = "うぅぅ、寮監隊から逃げるなんて、何をしているのでしょう……。"
2006405-166 = "先生。今のうちにワイルドハントを出てください。#n寮監隊がまた来るかもしれないので、くれぐれもお気をつけて。"
2006405-167 = "[s] \"ウララもね。\""
2006405-170 = "（それから急いでワイルドハントを出た）"
2006405-171 = "（バレずにシャーレまでたどり着けた）"
2006405-175 = "やはり先生は……罪深い方ですね。"
2006405-176 = "ご自身の行いを理解されているのでしょうか？"
2006405-177 = "……。"
2006405-178 = "ふ、ふふ……いけないいけない。"
2006405-179 = "落ち着いて、落ち着いて……。"
