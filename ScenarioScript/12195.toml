[translation]
12195-2 = "있지. 호시노 쨩."
12195-3 = "나는 있지."
12195-4 = "호시노 쨩을 처음 봤을 때, 이게 꿈인가 싶어서 몇번이고 볼을 꼬집어봤었어."
12195-5 = "호시노 쨩 같이 귀엽고 강하고 믿음직한 후배가 곁에 있어준다는 게 너무 기뻐서……"
