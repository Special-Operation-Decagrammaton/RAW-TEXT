12195-7 = "호시노 쨩과 이렇게 마주보고 있을 수 있다는 게 나한텐 기적 같은 거였으니까……."
12195-8 = "……어차피 매일 보는 얼굴이잖아요."
12195-9 = "어제도 봤고, 오늘도, 내일도 볼 거면서. 그런 당연한 걸 가지고 호들갑입니까."
12195-10 = "하우웅…… 그치만……."
12195-11 = "기적은 좀 더 대단하고 희귀한 것입니다."
12195-12 = "……으응. 아냐, 호시노 쨩. 나는 다르게 생각해."
12195-13 = "나는 바보지만…… 그건 장담할 수 있어."
12195-14 = "있지. 호시노 쨩. 언젠가 호시노 쨩에게도 귀여운 후배들이 생기면……."
12195-16 = "……."
