[translation]
10014020-1 = "제2화;누구나 한두 개쯤은"
10014020-2 = "슬슬 도착이네. 저기 지나면 이제 교문이니까, 여기까지 오면 안심이야."
10014020-3 = "아무리 녀석이라도 교내에서는 소란 피우기 어렵겠지……."
10014020-4 = "음……."
10014020-5 = "뭔가 의도치는 않았지만, 선생님이 날 에스코트해 준 것처럼 돼 버렸네."
10014020-6 = "……민폐 끼쳐서 죄송합니다."
10014020-7 = "그리고, 도와주셔서 감사합니다."
10014020-8 = "[s1] \"……친근하듯 예의 바르네, 카즈사는.\"\n[s2] \"뭔가 태도를 잘 구분하는 느낌이네.\""
10014020-9 = "으, 응? 구분? 그, 그런가?"
10014020-10 = "으, 응? 구분? 그, 그런가?"
10014020-11 = "그야 앞에 있는 게 선생님이니까, 자연스레 선생님으로 대한 것뿐인데……?"
10014020-12 = "아무튼 뭐, 이번 상담은 여기까지 하고. 나중에 다시 시간 내서 찾아갈게."
10014020-13 = "……응?"
10014020-14 = "이제 와서 하는 말이지만 과거에 대해 말해줘도 괜찮았던 거냐고? ……뭘?"
10014020-15 = "……스케반 쪽 이야기?"
10014020-16 = "……'숨기는 과거' 같은 거 아니었냐고?"
10014020-20 = "아아. 그런 뜻이었구나. 난 또 뭐라고……."
10014020-21 = "확실히 딱히 떠벌리고 다닐 건 아니긴 하지만……."
10014020-22 = "싫어도 어쩔 수 없잖아. 사실은 사실인걸."
10014020-23 = "숨긴다기보다, 뭐랄까……. 그냥 싫달까. 잊어버렸으면 좋겠달까. 그런 일인 거지."
10014020-24 = "피곤하기만 할 뿐이고……. 마치 우자와 녀석처럼 말이지."
10014020-25 = "……녀석도 그만 그걸 알았으면 좋으련만. 어떻게 이 나이 먹도록 변한 게 하나도 없냐."
10014020-26 = "우리도 이제 고등학생이잖아. 언제까지 철부지처럼 굴 수는 없는 건데……."
10014020-27 = "슬슬 중학생 때의 자신과 지금을 좀 구분해줬으면 좋겠어. 계속 옛날처럼 굴지 말고……."
10014020-28 = "……고등학생쯤 왔으면, 예전 모습 같은 건 잊을 때도 됐잖아?"
10014020-29 = "서로 다 잊고 새출발하면 좋을 텐데. 그치? 왜 굳이 저러는지 도저히 이해가 안 간다니까."
10014020-30 = "[s] \"…….\""
10014020-31 = "……???"
10014020-32 = "음? ……반응이 왜 그래?"
10014020-33 = "……뭐?"
10014020-34 = "혹시 스케반을 그만두게 된 다른 계기라도 있냐고……?"
10014020-35 = "어……. 그건……."
10014020-36 = "그, 그건 갑자기 왜……? 그거야……. 그……. 음……."
10014020-37 = "역시 스케반은……. 그다지……."
10014020-47 = "그, 그런데 갑자기 그런 건 왜 묻고 그래!? 딱히 요즘 세상에 드문 케이스도 아니잖아?"
10014020-48 = "어차피 누구나 말하기 싫은 과거 한두 개 정도는 가지고 있고……. 청산하기도 하고……."
10014020-49 = "뭐, 전직 스파이였다든가, 은행을 털어 봤다든가, 메이드로 위장한 에이전트라든가, 자칭 닌자라든가……."
10014020-50 = "어쩌면 그런 사람들도 왕왕 있을 수 있는 거 아니겠어? ……그치? 있겠지?"
10014020-51 = "[s3] \"아. 그렇게 나오시겠다…….\"\n[s4] \"……묘하게 부정하기 어렵네요.\""
10014020-52 = "거 봐. 나라고 딱히 다를 거 없다니까? 그저 수많은 케이스 중 하나일 뿐이지."
10014020-53 = "거 봐. 나라고 딱히 다를 거 없다니까? 그저 수많은 케이스 중 하나일 뿐이지."
10014020-54 = "때가 되면 다 알아서 철이 드는 거라고. 그러니 그때 일은 그만 물어봐. 창피해."
10014020-55 = "……맞아. 창피하지, 그런 건."
10014020-59 = "……아. 시간이 벌써……."
10014020-60 = "그래도 선생님 앞인데 지각은 하면 안 되겠지. 먼저 들어갈게. 다음에 또 봐, 선생님."
10014020-61 = "오늘 일은 정말로 고마웠어, 선생님. 벌써 마음이 좀 나아진 것 같아."
10014020-62 = "……정말 감사합니다."
10014020-63 = "그럼 이만."
10014020-67 = "(………….)"
10014020-68 = "[ns] \"……자경단이라.\""
10014020-76 = "……아. 선생님. 여깁니다."
10014020-81 = "기다리고 있었습니다, 선생님. 물어보고 싶으신 것이 있으시다고요?"
10014020-82 = "아, 아뇨. 부담이라니 당치도 않습니다. 오히려 저로선 이런 기회가 더 감사할 일이죠."
10014020-83 = "선생님께는 늘 신세만 지고 있으니……."
10014020-84 = "뭔지는 모르지만 제가 도와드릴 수 있는 거라면 성심성의껏 도와드리겠습니다."
10014020-85 = "……네? 수업요? 아, 괜찮습니다. 지금 시간에는 딱히 수업이 없거든요."
10014020-86 = "학년이나 반마다 수업 시간표도 다르니까요. 그래도 먼저 물어봐 주셔서 감사합니다."
10014020-87 = "그나저나 어떤 걸 여쭤보고 싶으신지……."
10014020-88 = "……네? 자경단 멤버에 관한 일이라고요? 과연……. 그렇군요. 그래서 제게……."
10014020-89 = "으음. 그렇지만 도움이 돼 드릴 수 있을지는……. 자경단이라는 게 사실 제대로 된 '조직'은 아니거든요."
10014020-90 = "말 그대로 '자경단'이니까요. 각자가 자신이 지내는 곳 근처의 치안을 지키려고 자발적으로 나선 사람들입니다."
10014020-91 = "어떤 사람들이 있는지, 어디서 어떤 활동을 하는지 제가 파악하고 있기는 어렵습니다만……."
10014020-92 = "……네?"
10014020-93 = "……우자와 레이사……씨요?"
10014020-94 = "[s5] \"예전에 같이 있는 걸 본 적이 있어서.\"\n[s6] \"스즈미도 레이사는 알지 않아?\""
10014020-95 = "……으음. 그렇군요. 또 레이사 씨……라."
10014020-96 = "……으음. 그렇군요. 또 레이사 씨……라."
10014020-97 = "아무래도 무슨 사고를 친 모양이네요. 큰일이 아니었으면 좋겠습니다만……."
10014020-98 = "[s7] \"잠깐. 지금 '또'라고…….\"\n[s8] \"바로 '사고'부터 나오는 거군요.\""
10014020-99 = "결코 나쁜 분은 아닙니다. 확실히 말해 의도나 마음씨는 훌륭하신 분이죠."
10014020-100 = "결코 나쁜 분은 아닙니다. 확실히 말해 의도나 마음씨는 훌륭하신 분이죠."
10014020-101 = "……물론 다소 에너지가 넘치고, 그것을 조절하지 못해 사람들로부터 겉도실 때도 있지만요……."
10014020-102 = "그래도 의외군요. 아무리 레이사 씨라도 선생님에게 폐를 끼칠 만한 일을 하진 않을 줄 알았는데……."
10014020-103 = "……네? 아, 다른 분에 관한 이야기라고요?"
10014020-104 = "그렇군요. 괜찮으시다면 상황을 좀 들어볼 수 있을까요? 그분의 신상에 대해서는 따로 밝히지 않으셔도 좋습니다만……."
10014020-105 = "[ns] 현재 상황을 설명해준다."
10014020-108 = "……그렇군요. 이해했습니다."
10014020-109 = "확실히 레이사 씨 다운 일이네요. 그분도 참 곤란하시겠어요."
10014020-110 = "그나저나 놀랍군요. 스케반들에 대해서는 스스로도 꽤 잘 알고 있다고 생각했는데……."
10014020-111 = "그런 '그들만의 세계'도 따로 존재할 줄이야. 역시 세상은 넓은 모양입니다."
10014020-112 = "……하지만 결국 그분은 스케반을 그만두신 것이잖습니까. 레이사 씨는 왜 계속 도전하시는 걸까요?"
10014020-113 = "이미 스케반을 그만둔 사람에게 계속해서 결투……. 뭔가 이유라도 있는 걸까요? 호승심?"
10014020-114 = "아무래도 이건 레이사 씨께 직접 여쭤보는 게 나을 것 같네요."
10014020-115 = "레이사 씨라면 저도 연락처를 가지고 있으니, 선생님께서 부르신다고 말씀드리면 금세 찾아오시겠죠."
10014020-116 = "아까도 말씀드렸듯, 행동력이 좋은 분이니까요."
10014020-117 = "그럼 바로 연락을……."
10014020-121 = "……응? 먼저 어디선가 연락이 오는군요."
10014020-122 = "……레이사 씨?"
10014020-123 = "[s9] \"레이사가 먼저 연락한 거야?\"\n[s10] \"무슨 일이야?\""
10014020-124 = "어……"
10014020-125 = "어……"
10014020-126 = "……지원요청이로군요."
