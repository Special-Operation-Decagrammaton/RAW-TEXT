[translation]
10035120-1 = "후일담;밀레니엄 엔지니어부의 실수 1"
10035120-5 = "덥다……."
10035120-7 = "더워……."
10035120-8 = "덥네요……."
10035120-9 = "그치만 여름이니 당연한 거겠죠……."
10035120-14 = "여름이라니? 벚꽃 핀 지 얼마 안 됐는데?"
10035120-15 = "그러게 말야."
10035120-16 = "그때쯤 이 꽃꽂이용 로봇을 개조하기 시작했으니 며칠 안 됐을 텐데."
10035120-18 = "며칠이라뇨! 지금 한여름인데요?!"
10035120-20 = "으, 응?!"
10035120-21 = "우리 설마, 계절이 바뀐 것조차 모르고 있었던 건가?"
10035120-22 = "한 번 작업을 시작하면 시간 가는 줄 모르니까 말이지……."
10035120-23 = "으음, 여름휴가 계획을 세울 기회는 놓쳤지만, 이 꽃꽂이 로봇은 잘 완성될 것 같으니 그걸로 위안을 삼아야겠지."
10035120-29 = "음?"
10035120-37 = "잠깐 모두 주목. 의뢰가 들어왔어."
10035120-41 = "의뢰요?"
10035120-42 = "누구의 의뢰인데?"
10035120-44 = "해양생물 연구 동아리에서, 이번 여름휴가를 위한 레저용 로봇을 만들어 달라는 의뢰야."
10035120-48 = "마감일은……다음 주로군."
10035120-51 = "다음주까지 새로운 물건을 준비하는 건 일정상 쉽지 않아."
10035120-52 = "프로그래밍 문제도 있고요."
10035120-54 = "그렇지만 마이스터로서, 들어온 의뢰를 내치는 건 있을 수 없는 일이지."
10035120-60 = "그럼 이렇게 하는 건 어때?"
10035120-61 = "지금 개발 중인 꽃꽂이 로봇을 이용하는 거야."
10035120-62 = "그렇군요!"
10035120-63 = "꽃꽂이 기능에 해양 레저 기능까지 갖춘 로봇이 되겠네요!"
10035120-65 = "좋아, 그럼 지금부터 꽃꽂이 겸 해양 레저용 로봇 제작 프로젝트를 시작한다!"
10035120-70 = "인터넷으로 검색해 본 결과, 해양 레저에는 다음과 같은 것이 있다고 합니다!"
10035120-71 = "스쿠버다이빙, 낚시, 바나나보트!"
10035120-72 = "설명드리자면, 그중 스쿠버다이빙은 잠수장비를 착용한 채 바닷속으로 들어가는 것으로서—"
10035120-78 = "음, 고맙지만, 코토리, 설명은 다음 기회에 듣도록 하지."
10035120-79 = "발주서에 따르면, 여러 가지 해양 레저를 한 개의 로봇으로 즐길 수 있으면 좋겠다는 조건이 있었어."
10035120-80 = "그리고 해양생물 연구 동아리답게, 자연환경과 어울리는 외형도 함께."
10035120-82 = "그 말씀은…… 다이빙 포인트를 확보할 수 있는 기능과 낚시 서포트 기능, 그리고 보트를 끌 수 있는 파워를 모두 가진 로봇을 만들어야 한다는 거군요."
10035120-83 = "난이도가 높은걸."
10035120-85 = "혹시 스쿠버다이빙이나 낚시, 바나나보트 중에 하나라도 경험해본 사람?"
10035120-91 = "음, 나도 해본 적 없다."
10035120-93 = "하지만……."
10035120-98 = "만들면 어떻게든 되겠지!"
10035120-106 = "(며칠간 인내와 노고의 시간이 흐르고…….)"
10035120-110 = "드디어."
10035120-111 = "마침내."
10035120-113 = "완성했습니다!"
10035120-119 = "엔지니어부의 야심작, 레저용 메카 악어!"
10035120-121 = "다이빙 포인트 개척을 위한 강철 팔다리와 수온을 높여 물고기를 모이게 할 화염방사 기능, 보트 견인을 위한 스피드와 파워까지 갖춘 공방일체의 최종병기입니다!"
10035120-122 = "자연환경과 어울리는 바다악어의 외형과 기초적인 본능 알고리즘도 갖췄어."
10035120-123 = "역시…… 힘들긴 했지만 완성품을 볼 때의 이 기분은, 무엇과도 바꿀 수 없네."
10035120-125 = "음, 본체는 완성했지만, 프로그램 쪽은 아직 미흡해."
10035120-126 = "하지만 시간도 늦었으니, 시운전은 내일 해도 괜찮을 것 같군."
10035120-127 = "오늘은 들어가서 쉬자고! 모두 수고했어!"
10035120-130 = "수고하셨습니다!"
