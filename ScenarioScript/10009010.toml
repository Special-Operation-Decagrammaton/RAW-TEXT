[translation]
10009010-1 = "제1화;첫 번째 습격!"
10009010-2 = "D.U. 자치구 중심 대로변"
10009010-4 = "흐음, 순찰은 하고 있습니다만 좀처럼 시체……."
10009010-5 = "아니, 부상자가 나올 낌새는 없는 듯하군요."
10009010-6 = "[s] \"저기, 세나, 방금 아쉬워한 거 아니지?\""
10009010-7 = "네? 오해입니다. 선생님. 결코 흥미 본위로 시체……"
10009010-8 = "가 아니라, 부상자를 어디서 볼 수 있지 않을까. 하는 생각은 전혀……."
10009010-9 = "아니, 약간은 했습니다만은."
10009010-10 = "[s] \"한 거냐!!\""
10009010-11 = "……하지만, 축제의 열기 속에서 별다른 소동이 없다면, 그 자체로 다행이구나. 하고 생각하는 것도 사실입니다."
10009010-12 = "저희 동아리의 활동 내용을 고려하면, 활약할 틈이 없다는 건 곧 평화롭다는 걸 의미하기에."
10009010-13 = "[s] \"세나는 성실하구나…….\""
10009010-14 = "네. 역시나 다소 아쉽긴 합니다만."
10009010-15 = "[s] \"역시 아쉬운 거냐고!\""
10009010-17 = "(그렇게 세나와 여러 대화를 주고받으며 대로변의 끄트머리에 도착했을 때였다.)"
10009010-22 = "네, 이것으로 말씀하신 현장 시큐리티 시스템의 재부팅은 끝났습니다."
10009010-23 = "추후 소란이 일어나더라도, 제대로 작동할 테니 안심하셔도 좋습니다."
10009010-24 = "고맙습니다! 역시 베리타스로군요! 이걸로 만약의 사태에 대해 걱정을 덜 수 있겠어요!"
10009010-25 = "아, 별말씀을……."
10009010-29 = "그럼 전 이만……."
10009010-30 = "[s] \"아, 치히로.\""
10009010-31 = "응? 선생님……?"
10009010-32 = "그 아이는 게헨나의 학생?"
10009010-33 = "……이건 또 보기 드문 조합이네. 무슨 일이야? 발렌타인 데이에 단둘이라니……."
10009010-34 = "아, 설마, 라고는 생각하지만."
10009010-35 = "선생님과는 순찰 중이었습니다."
10009010-36 = "주로 시체의 확보를 위해."
10009010-37 = "……시, 시체? 확보? 대체 무슨 불법적인 일을 하고 있는 거야?"
10009010-38 = "[s] \"아냐! 축제 순찰을 돌고 있었을 뿐이야! 그보다 치히로는?!\""
10009010-39 = "필사적인 변명……."
10009010-40 = "뭔지는 몰라도 사연이 있단 거네."
10009010-41 = "나는……. 뭐, 별건 아니고. 발키리 학원의 의뢰로 축제 현장의 시스템 장비나 시큐리티를 체크 및 보수하고 있었어."
10009010-42 = "현장에 설치된 통신 중계기 중에 노후화된 장비는 없는지. 시스템으로 제어되는 경비 센서나 스프링클러 같은 안전장치엔 문제가 없는지-"
10009010-43 = "사람이 복작거리는 시끄러운 축제인 만큼, 체크해두지 않으면 안 될 게 산더미니까."
10009010-44 = "[s] \"치히로도 고생하고 있구나.\""
10009010-45 = "……고생이라고 할 정도는 아니야."
10009010-46 = "일단은 베리타스에게 정식으로 들어온 의뢰고, 히마리 부장이 자리를 비운 만큼 허투루 할 순 없는 법이니까."
10009010-47 = "더군다나 오늘은, 그게……. 발렌타인 데이잖아?"
10009010-48 = "특별한 날. 오늘 같은 날을 무사히 보낼 수 있도록 이 정도 수고스러운 것쯤이야. 아무것도 아니지."
10009010-49 = "[s] \"응, 그래도 역시 치히로는 굉장하네.\""
10009010-50 = "……나 참, 그런 게 아니래도……."
10009010-51 = "뭐, 기왕 이렇게 된 거, 선생님 순찰을 돌고 있는 중이라고 했지?"
10009010-55 = "그럼 잠깐 다음 시큐리티 장비를 체크하는 데까지 어울려 주겠어?"
10009010-56 = "네, 다음 시체,"
10009010-57 = "아니. 부상자가 있을지 모르니, 신속히 확보하러 가도록 하지요."
10009010-58 = "……저기. 진짜 불법적인 일, 아닌 거 맞지?"
10009010-59 = "[s] \"오해입니다!\""
10009010-62 = "후아아암……. 호송이란 거, 생각보다 심심하네."
10009010-63 = "후부키! 그렇게 늘어져 있다가 경비국장님에게 걸리면 한 소리 들을 거예요."
10009010-64 = "냅둬~ 오히려 키리노야말로 너무 딱딱하게 굳어 있는 거 아니야?"
10009010-65 = "으, 으으음, 하지만……. 지금 저희가 누굴 호송하고 있는지 생각하면……."
10009010-66 = "걱정이 너무 지나친 거 아냐?"
10009010-67 = "아무리 지나쳐도 부족하지 않다구요."
10009010-68 = "그도 그럴 게, 상대는 교정국을 탈출한 일곱 명 중에서도 가장 최악을 자랑한다던……."
10009010-70 = "바로 그 <재액의 여우>니까요!"
10009010-71 = "실제로 고작 일개 개인의 몸으로 문제아들을 선동하면서, 언제는 또 총학생회 사람들을 희롱하는 수준의 소동을 일으켰다고 들었다구요?!"
10009010-73 = "뭐, 그때는 총학생회도 회장의 실종이니 뭐니로 정신없었던 모양이니까. 어쩔 수 없었던 거겠지."
10009010-74 = "으음, 그래도 역시 방심할 수 없어요. 오죽하면 저 이런 소문을 들은 적이 있어요."
10009010-75 = "소문?"
10009010-76 = "재액의 여우는 어어어엄-청 요사하고 간악해서……!"
10009010-77 = "그게, 조금만 말을 섞기만 해도 자기도 모르게 홀려버려서……, 그대로 말을 따르게 하는 기이한 재주를 가졌다는 이야기를 말이에요!"
10009010-81 = "아니……. 만화를 너무 많이 본 거 아냐?"
10009010-82 = "그래도 진정해, 키리노. 쓸데없는 걱정이랑 말라구?"
10009010-83 = "네?"
10009010-84 = "우리 생활안전국이야 그렇다 쳐도, 여기엔 경비국 녀석들도 다닥다닥 붙어 있잖아?"
10009010-85 = "체포한 직후엔 그 매끈하고 이쁜 가면이랑 옷가지 빼곤 죄다 회수도 했겠다. 제아무리 재액의 여우라고 한들 여기서 어떻게 도망치겠어?"
10009010-86 = "하핫. 말 그대로 요술이라도 부리지 않는 한은 절대로 불가능……."
10009010-90 = "……엥?"
10009010-91 = "마, 말이 씨가 되어 버렸잖아요! 후부키?!"
10009010-97 = "또 사고인가요?"
10009010-98 = "뭐야, 갑작스럽게 폭발이라니, 어디서 가스관이라도 터진 거야?"
10009010-99 = "[s] \"잠깐만, 이거 단순한 폭발이 아니라…….\""
10009010-103 = "긴급 속보입니다! 조금 전 교정국으로 문제아를 호송 중이던 버스가 폭발!"
10009010-104 = "동시에 다수의 문제아 집단이 난동을 부리고 있다는 소식입니다!"
10009010-110 = "선생?! 지금 어디야?!"
10009010-111 = "[s] \"후부키……?\""
10009010-112 = "호송 중이던 재액의 여우가 현장에서 탈주했어! 그 사이에 다른 문제아들을 동원해서 발키리 경찰학교의 장갑차나 장비까지 탈취하는 바람에……!"
10009010-113 = "그래서 말이지만! 도와줘! 선생!"
10009010-114 = "여기서 아무것도 못하고 놓쳤다간, 시말서 정도가 아니라 어쩌면 휴가가 깎일지도 몰라……!"
10009010-115 = "아! 참고로 재액의 여우가 향한 방향은 말이지……!"
10009010-121 = "[ns] \"……아무래도 알려줄 필요까진 없는 모양이야.\""
10009010-123 = "후후훗……. 냄새……. 네에, 냄새가 나는군요……."
10009010-127 = "한 번 노린 먹잇감. 절대로 놓치지 않을 거랍니다!"
