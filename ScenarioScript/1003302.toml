[translation]
1003302-1 = "부드러운 재회"
1003302-2 = "(잠시 일이 있어 샬레의 사무실을 나와 거리를 걷고 있을 때였다.)"
1003302-3 = "얌마! 여기! 내 아이스크림! 어쩔 거냐고!"
1003302-4 = "히이이익?! 뭐, 뭔가용!"
1003302-5 = "네놈이 재채기를 한 바람에 누님이 깜짝 놀라서 들고 있던 아이스크림을 떨어트려 버렸잖아! 누님이 얼마나 기대한 물건이었는데!"
1003302-6 = "네놈! 용서 못 해! 나의 「봄 계절 신상 한정 바닐라 후르츠 기가 점보 디럭스 소프트 아이스크림 Mk.02」를 물어내 주셔야겠어!"
1003302-7 = "어, 억울해용! 전 그냥 재채기를 했을 뿐인뎅!"
1003302-8 = "[s] \"너희들, 잠깐 기다려.\""
1003302-9 = "응? 뭐야, 당신?"
1003302-10 = "누님, 저거 샬레의 선생인데요?"
1003302-11 = "호오, 샬레의 선생? 그 유명한 사람이 우릴 막겠다는 거냐?"
1003302-12 = "뭐, 좋아. 그럼 네놈이 이 녀석을 대신해서 아이스크림을 물어내라고!"
1003302-13 = "[s1] \"앗, 횡포다!\"\n[s2] \"음, 사주고 싶어도 최근 지갑 사정이…….\""
1003302-16 = "그딴 거, 알 게 뭐야! 아니면 하다못해 그 몸으로라도 지불을……!"
1003302-27 = "[ns] \"으, 응?\""
1003302-28 = "구, 구해주셔서 고마워용!"
1003302-29 = "꼼짝없이 재채기 한 번 잘못했다고 큰일을 당할 뻔했는데!"
1003302-30 = "역시 샬레의 선생님이시네용!"
1003302-31 = "[s] \"아니, 방금 건…….\""
1003302-32 = "이게 환절기라 그런지 저도 재채기가 멈추질 않아서……."
1003302-33 = "에, 에,"
1003302-34 = "에췽!"
1003302-38 = "재, 재채기를 했을 뿐인데엥!!"
1003302-43 = "[ns3] \"이런 타이밍에, 하필 갑작스러운 습격이라니……? 설마?!\"\n[ns4] (이대로 있으면 위험해……!)"
1003302-47 = "(갑작스럽게 쏟아지는 총알과 폭발을 피해, 그때부터 필사적인 도주가 시작되었다.)"
1003302-51 = "잠깐! 여긴 우리 용역팀이 도로공사를 시작한 참이라 통행금지야!"
1003302-52 = "지금 막 발파 작업이 있으니……."
1003302-56 = "끄앙! 발파 작업을 대신해줄 필요까지는 없는데?!"
1003302-62 = "(그 뒤로도 어떻게든 폭발을 피해 인적이 드문 곳을 찾아 내달렸다.)"
1003302-64 = "응? 저건 샬레의 선생이잖아?"
1003302-65 = "크크큭! 어이 선생!"
1003302-66 = "얼굴이 새빨개져서는, 뭔가 재미있는 일이라도……."
1003302-71 = "크, 크억?!"
1003302-76 = "[ns] \"큭!\""
1003302-86 = "(그렇게 얼마나 내달렸을까. 가까스로 인적이 거의 보이지 않는 장소에 도망칠 수 있었다.)"
1003302-89 = "[ns] \"하아, 하아……. 이곳이라면 어떻게든…….\""
1003302-93 = "후후훗, 이제야 드디어 방해꾼이 전부 사라졌네요."
1003302-98 = "[ns5] \"역시나 그럴 줄은 알고 있었지만…….\"\n[ns6] \"지금까지의 그거. 와카모, 너였구나.\""
1003302-99 = "어머나……. 이미 선생님께선, 저인 줄 알고 계셨다구요……?"
1003302-100 = "어머나……. 이미 선생님께선, 저인 줄 알고 계셨다구요……?"
1003302-101 = "그 말씀은……."
1003302-102 = "곧, 당신께선 줄곧 저를 기다리고 계셨다는 말씀……?"
1003302-103 = "[s] \"으, 응?\""
1003302-104 = "아아……. 더는 참을 수 없어요!"
1003302-107 = "― 기뻐요……."
1003302-110 = "― 이 와카모,"
1003302-112 = "― 모든 것은 이렇게 [wa:1650]당신과 만나기 [wa:1000]위해서……!"
1003302-115 = "― 어떻게든 직접, [wa:1950]제 기분을,"
1003302-117 = "― 이 감정을, [wa:1750]전해드리고 싶어서……."
1003302-120 = "[wa:100]― 이렇게 [wa:200]만나게 된 것 또한 [wa:600]분명,"
1003302-122 = "― 붉은 실로 맺어진 [wa:1700]운명의 인도겠죠……."
1003302-125 = "― 아아……. [wa:2400]그, [wa:1150]그렇게 [wa:650]뚫어져라 쳐다보시면……"
1003302-127 = "― 아무리 저라고 해도, [wa:2500]부끄러워져 버리고 말아요……."
1003302-130 = "― 당신의 [wa:500]그런 시선만으로도, [wa:2000]몸 이곳저곳에서,"
1003302-132 = "― 안타까움이 [wa:500]흘러넘쳐서……."
1003302-135 = "[wa:100]― 하지만……. [wa:1900]당신이 [wa:1600]그렇게나 [wa:1150]원하신다면……. [wa:2350]네♡"
1003302-138 = "― 자아, [wa:1350]부디 이쪽으로,"
1003302-140 = "― 좀 더 좀 더 [wa:2250]저의 곁으로……. [wa:2200]우후후♡"
1003302-143 = "자아, 선생님, 좀 더……. 좀 더 가까이……."
1003302-144 = "[s] \"떽!\""
1003302-145 = "꺅?!"
1003302-146 = "[s7] \"그러면 안 되지! 와카모! 남에게 함부로 피해를 주다니!\"\n[s8] \"그건 몹쓸 짓이라고, 몇 번이나 이야기했잖아?\""
1003302-149 = "네에……? 하, 하지만."
1003302-150 = "전 어디까지나 서, 선생님을 만나고 싶다는 일념만으로……!"
1003302-151 = "[s] \"어찌 되었든 간에 남에게 피해가 된다면 그건 잘못된 일이야.\""
1003302-152 = "그, 그렇지만. 저 와카모의 가슴 속에 담긴 이 감정이……."
1003302-153 = "저도 모르게, 이렇게나 흐, 흘러넘친 까닭에 어쩔 수 없이……."
1003302-154 = "그, 그게……. 아, 으으……."
1003302-155 = "[s] \"그 마음은 기쁘지만, 계속 이런 식이면 와카모를 싫어하게 될지도 몰라.\""
1003302-156 = "……!!"
1003302-157 = "아아, 선생님, 제발, 제발 그것만은……!"
1003302-158 = "저 와카모, 당신께 미움받아버리면, 저는 더는, 더 이상은……!"
1003302-159 = "죄, 송, 해요! 죄송해요! 죄송해요죄송해요! 용서해주세요! 선생님……!"
1003302-160 = "저, 와카모……! 다시는, 다시는 선생님을 실망시키지 않도록 할 터이니……! 제발……! 부디!"
1003302-161 = "저를, 미워하지 말아 주세요……. 용서, 해주세요……."
1003302-162 = "[s] \"……와카모가 충분히 반성한다면.\""
1003302-166 = "선생님……."
1003302-170 = "앗……. 하필 당신과 제 사이를 방해하는, 사이렌 소리가……."
1003302-171 = "네에, 선생님. 저 와카모. 더는 선생님을 실망시키지 않도록, 앞으로도 주의를 하겠습니다."
1003302-172 = "오늘은……. 이렇게 물러가게 되겠습니다만."
1003302-173 = "다음번에, 그게, 다시……. 찾아 뵈어도 될까요……?"
1003302-174 = "[s] \"……응.\""
1003302-175 = "네에, 그럼 다음에 또!"
1003302-180 = "(그렇게 멀어져가는 와카모를 얌전히 배웅해주었다.)"
