[translation]
1002006-1 = "무슨 짓을 하는 거야?"
1002006-2 = "(금방이라도 피로로 쓰러질 것 같았지만, 일단은 코하루가 부른 장소로 나가보았다.)"
1002006-3 = "(도착하고 보니 미리 약속장소에 도착해 있었던 코하루가 보였다.)"
1002006-4 = "여, 여기야. 선생님. 응…… 잘 왔어."
1002006-5 = "워, 원래라면 이렇게 위험천만한 장소에 선생님을 부르는 위험을 감수하진 않겠지만……"
1002006-6 = "[s1] \"위험천만……? 여기가?\"\n[s2] \"이번엔 또 무슨 망상을 하시는지 들어나 볼까.\""
1002006-7 = "그, 그야 그렇잖아?"
1002006-8 = "그, 그야 그렇잖아?"
1002006-9 = "아, 아무도 없는 방과후의 학교 입구……"
1002006-10 = "언제 누가 올 지 모르는 그 아슬아슬함 때문에…… 주요 이벤트 배경으로 쓰이는 곳……"
1002006-11 = "사람에 따라서는 그 위기감이 오히려……?"
1002006-12 = "……헛."
1002006-13 = "마, 만약…… 선생님이 그런 위험을 즐기는 타입이라면……"
1002006-14 = "위, 위험해 이건…… 설마…… 거기까진 생각 못했는데……?"
1002006-15 = "만약…… 만약 정말 그런 거라면……!!"
1002006-16 = "[s3] \"아니, 정말로 괜찮다니까……\"\n[s4] \"저기, 용무 없으시면 돌아가도 될까요?\""
1002006-17 = "……정말로?"
1002006-18 = "진짜야? 진짜 괜찮은 거야……?"
1002006-19 = "거짓말이 아니라……?"
1002006-20 = "자, 잠깐만……!"
1002006-21 = "알았어, 알았다고……"
1002006-22 = "으음…… 그…… 불러낸 건 이거 때문이니까……"
1002006-23 = "……자. 여기…… 프렌즈샵에서 산 쿠키……"
1002006-24 = "그, 그래도 전에 도움 받은 게 있으니까, 답례로……"
1002006-25 = "저, 절대로 다른 의미는 아니야…… 알겠지?"
1002006-26 = "[s] \"고마워. 잘 먹을게.\""
1002006-27 = "호, 혹시라도 이상한 생각을 하고 있다면 그만두는 게 좋아……"
1002006-28 = "이상한 거라던가…… 그런 거 탄 거 전혀 아니니까…… 물론 그런 전개도 꽤 있겠지만……"
1002006-29 = "아니, 보통 여기서라면 그럴 거라고 생각할 수 있지만……!"
1002006-30 = "아니, 선생님이라면 오히려 그런 걸 기대하고 있을 거라는 걸…… 난 이미 알고 있지만……!"
1002006-31 = "[s5] \"역시 또 이 패턴인가……\"\n[s6] \"피곤하다…… 쓰러질 것 같다……\""
1002006-32 = "……뭐, 뭐야 그 얼굴……."
1002006-33 = "……뭐, 뭐야 그 얼굴……."
1002006-34 = "어, 어째서 선생님이 그런 표정을 짓는 거야……? 이쪽이 해야 얼굴인데……"
1002006-35 = "애당초 나는 선생님을 감시하는 역할로……?"
1002006-36 = "[s7] ……못참겠으니 코하루를 혼내준다.\n[s8] ……못참겠으니 코하루를 놀래켜준다."
1002006-46 = "히, 히익? 서, 선생님……!?!?"
1002006-49 = "[wa:200]― 뭐, [wa:600]뭐야……?!"
1002006-52 = "― (어, [wa:600]어라……[wa:1200]이거 [wa:1050]설마……?!)"
1002006-55 = "[wa:250]― 따, [wa:500]딱히 [wa:450]내가 [wa:600]틀린 말 한 건 [wa:950]아니잖아?"
1002006-58 = "[wa:50]― (자, 잠깐만…… [wa:1350]이대로라면 [wa:600]설마 [wa:850]선생님과…….)"
1002006-61 = "― (이, [wa:600]이 전개라면…… [wa:1450]그 책에서 몇번이나 봤었어……)"
1002006-63 = "― (저, 정말 [wa:1200]그 흐름이야?!)"
1002006-66 = "[wa:1000]― (이런 거……[wa:300]라든가,[wa:700] 저런 거……[wa:750]라든가…….)"
1002006-69 = "[wa:950]― (서, [wa:650]설마?! [wa:950]그런 짓까지도……!?) [wa:500]"
1002006-72 = "― 선생님, [wa:700]결국 [wa:450]본색을[wa:300] 드러내는구나……?[wa:850]"
1002006-75 = "[wa:50]― (큰일났다, 큰일났다.)"
1002006-77 = "[wa:150]― (아, [wa:550]아직 [wa:250]각오 같은 건 [wa:850]전혀 되어 있지 않은데……?!)"
1002006-80 = "[ns] 머리를 쓰다듬는다."
1002006-83 = "……?"
1002006-84 = "……아, 으아아아아아아?!?"
1002006-87 = "(…….)"
1002006-88 = "……서, 선생님?"
1002006-89 = "(이후 얼어붙은 코하루를 적당히 달래준 후, 사무실로 돌아와 쓰러지듯 잠이 들었다.)"
