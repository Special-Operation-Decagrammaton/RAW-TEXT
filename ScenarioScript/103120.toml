103120-112 = "당신에게 사과하고 싶었습니다."
103120-113 = "저는 당신을 이해할 수 없었기에 당신을 거부하고 외면했습니다. 당신에게서 도망치려고 했습니다."
103120-114 = "저는 당신이 두렵고 무서웠지만…… 그렇다고 해도 당신을 외면해서는 안 되었는데……."
103120-115 = "이해할 수 없더라도…… 당신을 마주 보았어야 했는데……."
103120-117 = "……."
103120-119 = "저는 케이를 모르니까…… 제가 케이의 입장이었으면 어땠을까 생각해 봤습니다."
103120-120 = "세상을 파멸로 이끄는 <열쇠>가 케이의 존재 목적이라면…… 그건 분명 괴로운 일이었겠죠……."
103120-123 = "그래서 어쩌면 케이도 줄곧 괴로웠던 게 아니었을까 생각했습니다……."
103120-125 = "왕녀여…… 저는……."
103120-127 = "자신의 존재는 자신이 결정해도 된다고, 선생님이 말씀해 주었습니다."
103120-130 = "케이도 케이가 원하는 존재가 될 수 있습니다. 누구도 그걸 남에게 허락받을 필요가 없습니다."
103120-132 = "……."
