103120-1 = "제12화;빛의 자격 1"
103120-5 = "서, 설마……"
103120-6 = "우리는 얼마나 괴물 같은 시스템을 상대로 싸우고 있었던 거죠……?!"
103120-7 = "전함의 속도를 늦춰!! 이대로 가면 저쪽의 변형된 다차원 배리어에 충돌하게 돼!"
103120-8 = "연동이 풀린 상태로 충돌하면…… 우리는 우리가 알지 못하는 차원으로 빨려 들어가거나, 아니면 그대로 산산조각이 나거나 둘 중 하나야!"
103120-9 = "저, 저기…… 속도를 줄인다고 해도 이대로라면 충돌을 피할 수는 없어요……!"
103120-10 = "뭔가 방법이 없나요?"
103120-12 = "……무리야. 저건 이제부터 과학이라기보다는 일종의 개념화 상태야. 저 상태를 파훼할 방법은 존재하지 않아."
103120-13 = "……. 단 하나만 빼고."
103120-14 = "……!!"
103120-15 = "저것이 <아트라하시스의 방주>라는 존재를 카피한 것이라면……. 저것에 개입할 수 있는 건 오직……."
103120-16 = "……. 동일한 자기 존재만이 가능하겠지."
103120-17 = "동일한 자기 존재……?"
103120-18 = "……!! 설마."
103120-19 = "뭐?! 무슨 소리 하는 거야, 회장?!"
103120-20 = "아니!! 그건 안 돼요!! 방주는 더 이상 그런 걸 했다간……."
103120-21 = "빅 시스터, 당신이라는 사람은 정말……!!"
103120-23 = "충돌 6분 전……!! 싸우지 말고 방법을 찾아요!"
