103120-38 = "아리스. 나는……."
103120-39 = "네. 이해했습니다."
103120-40 = "그러니까, <이름 없는 신들의 왕녀>인 아리스의 도움이 필요한 상황입니다."
103120-42 = "그, 그치만 아리스 쨩……!"
103120-43 = "아, 안 돼! 아리스!!"
103120-44 = "또 그렇게 새빨간 눈이 되어버리면……."
