103120-82 = "그러면 히마리 선배는 더 이상 리오 회장님을 미워하지 않아도 될 거고,"
103120-83 = "리오 회장님은…… 더 이상 스스로를 미워하면서 숨어 있지 않아도 될 테니까요."
