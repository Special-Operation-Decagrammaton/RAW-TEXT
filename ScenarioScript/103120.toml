103120-90 = "우트나피쉬팀의 배가 기동했을 때, 기적처럼 당신이 무사할 수 있었던 것은……."
103120-91 = "그 모든 업화와 공격을…… 저 <어른>이 감당했기 때문입니다."
103120-92 = "하지만 그것도 금세 끝날 겁니다. 저 어른은 그 상처를 이기지 못하고 얼마 안 가 죽을 거니까요."
