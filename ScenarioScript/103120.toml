103120-62 = "네. 모모이. 미도리. 유즈."
103120-63 = "그리고 유우카. 히마리 선배. 리오 회장님."
103120-64 = "……선생님."
103120-65 = "아리스의 존재는 아리스가 결정해도 된다고 선생님이 말씀하셨습니다."
