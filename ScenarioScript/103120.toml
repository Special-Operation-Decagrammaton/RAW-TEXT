103120-135 = "그건, 그냥 잘못 읽어버린 이름이니까요. 아리스의 이름처럼요."
103120-136 = "거기엔 아무런 이유도, 목적도, 의미도 없으니까요."
103120-138 = "그래서…… 세계를 파멸시키는 저라는 존재가…… 더 이상 괴롭지 않았으면 좋겠다고 생각하는 겁니까?"
103120-139 = "저를…… 구하고 싶다고요? 그렇게 말씀하시는 겁니까? 왕녀여?"
