[translation]
10017070-1 = "제7화;폭풍의 언덕"
10017070-2 = "카페 <화이트&메이슨> 입구"
10017070-3 = "쳇, 역시 호락호락하지 않군……!"
10017070-4 = "괜찮아! 저 녀석들도 거의 한계야! 한 번 더 제대로 공격하면 끝장낼 수 있다고!"
10017070-6 = "뭐, 뭐가 어떻게 된 거죠?"
10017070-8 = "알고 싶냐? 알고 싶겠지! 물론 그럴 거고 말고!"
10017070-9 = "알고 싶다면 설명해 주는 것이 인지상정! 간단한 거다! 정의실현부는 우리의 치킨을 빼앗았고!"
10017070-10 = "우린 그걸 이용해 구호기사단과 정의실현부를 충돌시켰을 뿐이지!"
10017070-11 = "너희들이 이렇게까지 생각대로 움직여 줬을 줄은 몰랐지만 말이야. 후하하하!"
10017070-12 = "[s] \"하스미, 정말 저 아이들의 치킨을…… 빼앗은 거야?\""
10017070-14 = "그건 사실이었습니다만…… 선생님."
10017070-15 = "하지만 그것이 정말로 '치킨'이라고 불릴 수 있을 물건이었는지는…… 논란의 여지가 있다고 생각합니다."
10017070-20 = "그, 그게 뭐 어때서!"
10017070-21 = "우리가 만든 헬파이어 치킨의 창의성을 무시하는 거냐!"
10017070-23 = "헬…… 뭐라고요?"
10017070-24 = "그건 또 뭐죠?!"
10017070-25 = "[s] \"……지금, 무슨 치킨이라고……?\""
10017070-27 = "설명하지! 헬파이어 치킨이란 말 그대로 매운맛의 한계를 시험하는 치킨!"
10017070-28 = "하지만 인공 캡사이신만을 사용하지는 않았어!"
10017070-29 = "키보토스 최강의 고추, '키보토스 리퍼'를 넉넉하게 집어넣어 그 220만 스코빌의 자연스러운 매운맛을 추구했지!"
10017070-30 = "마지막 남은 헬파이어 치킨 한 통을 가져왔으니, 어디 한번 구경해 보라고!"
10017070-37 = "어? 그저 보고만 있었는데 눈에 매운 기운이 전해져 와요."
10017070-38 = "우으으…… 매워서 눈물이 나려고 해요. 훌쩍."
10017070-39 = "진짜예요. 손으로 만져 봤을 뿐인데 따끔거리는 느낌이 나는데요?"
10017070-40 = "와앗! 피부가 부어오르기 시작했어요! 파스, 파스가 어디에 있었지……?"
10017070-41 = "[ns1] \"냄새를 맡은 것만으로 코 안쪽이 따가워졌어!\"\n[ns2] \"이건 이미 음식이 아니라 독성 화학 물질이 아닌지……?\""
10017070-44 = "……덧붙여서, 아무도 먹고 싶어 하지 않았습니다."
10017070-45 = "그렇다고 할까, 먹을 수 없었다고나 할까요."
10017070-46 = "그리고 그 치킨들을 행인들에게 강매하려고까지 해서, 정의실현부가 나선 것입니다만……"
10017070-51 = "헤, 헬파이어 치킨이 왜! 맛에는 항상 새로운 도전이 필요하다고!"
10017070-52 = "게헨나의 어떤 학생이 그렇게 말하기도 했어!"
10017070-54 = "아무튼 저희 정의실현부는…… 그 강매 행위와 음식에 대한 미각적 테러……"
10017070-55 = "나아가 취향을 강요하는 자들에 대한 응징을 하려 했던 것뿐입니다."
10017070-56 = "하는 김에 음식물 쓰레기 혹은 산업폐기물을 수거할 겸 해서요."
10017070-57 = "음식물 쓰레기라니! 산업폐기물이라니! 사과해!"
10017070-58 = "하지만 당신들, 그걸 추가 금액까지 붙여서 비싸게 팔려고 했잖아요?"
10017070-59 = "아니, 뭐. 수고비는 받아야 할 것 아냐. 소스 개발비라든가 추가 비용이라든가."
10017070-60 = "맞아, 맞아! 우리도 투자한 게 있었다고! 수수료 정도는 좀 더 받아내도 되는 거잖아!"
10017070-62 = "그 수수료가, 치킨 원가의 400%를 넘어가는 폭리일 필요가 있었는가 싶네요."
10017070-63 = "'치킨을 사 가지 않으면 뜨거운 맛을 보여주겠다. 케헤헤.' 라며 협박했던 것은 또 어디의 누구였는지."
10017070-64 = "……그런 것이었습니다. 미네 단장님."
10017070-65 = "……"
10017070-70 = "아무튼, 이야기는 다 끝난 건가? 다들 엉망인 것처럼 보이는군. 정의실현부고, 구호기사단이고."
10017070-71 = "기다리다 지쳤단 말이다. 다 됐으면 시작할까? 아니면 우리 멋대로 시작해 버릴까."
10017070-72 = "내분 유도는 언제나 좋은 전략이지. 헷, 재미있구만."
10017070-74 = "너무해요!"
10017070-75 = "믿었는데…… 여러분을, 믿었는데……!"
10017070-76 = "선의를 악용해서 저희를 싸우게 하다니……!"
10017070-77 = "모두가 행복해야 할 크리스마스에 서로를 속이다니! 나쁜 짓이에요!"
10017070-78 = "산타클로스께서 선물도 안 줄 거라구요!"
10017070-83 = "뭐야, 아직도 산타 같은 걸 믿는 거냐?"
10017070-84 = "잘 모르는 모양인데 말해 주지, 산타는 말이야-"
10017070-86 = "……거기까지, 해 주세요."
10017070-90 = "윽? 뭐, 뭐야. 이제 와서 무섭게 노려봐도 하나도 안 겁나거든!"
10017070-91 = "울면서 도망가게 해 주마! 그리고 산타가 뭔지 확실하게 큰 소리로 떠들어 버릴 거야!"
10017070-93 = "거기까지 해 달라고 말씀드렸어요……!"
10017070-95 = "[ns3] \"……이 이상 세리나와 하나에를 화나게 만들지 마.\"\n[ns4] \"선의를 악용하다니…… 나도 그건 참을 수 없어……!\""
10017070-99 = "히, 히익? 선생……?"
10017070-100 = "표, 표정이……!"
10017070-107 = "세리나, 하나에."
10017070-109 = "단장님……"
10017070-110 = "단장님!"
10017070-112 = "저는 단장으로서의 자격이 아직 모자란 것인지도 모르겠습니다."
10017070-113 = "하지만, 이 순간만큼은 제게 힘을 빌려주실 수 있겠습니까?"
10017070-115 = "네, 네! 물론이죠. 단장님!"
10017070-116 = "저희는 언제나 단장님을 믿고 있어요!"
10017070-118 = "감사합니다. 그러면, 가도록 할까요."
10017070-119 = "키에에에……"
10017070-125 = "나도, 끼지……"
10017070-130 = "히, 히에에엑?!"
10017070-131 = "어, 어떻게 된 거야, 저거! 싸우다가 쓰러진 거 아니었어?!"
10017070-132 = "나, 나한테 묻지 마! 분명 조금 전에는 분명 정신을 잃고 있었는데?!"
10017070-133 = "이렇게 된 이상 이판사판이다! 아무리 저 녀석이라고 해도 만전의 상태는 아닐 거야!"
10017070-135 = "……결과적으로, 본의는 아니었지만 츠루기라는 최중요 전력을 온전히 보존한 셈이 되었군요."
10017070-137 = "크케케케케케케케!"
10017070-138 = "이 지긋지긋한 소동을 끝내기 위하여!"
10017070-140 = "신념과 긍지를 가슴에!"
