[translation]
1014005-1 = "有所意識的狐狸"
1014005-2 = "夏萊附近地鐵站內部"
1014005-3 = "（結束外出業務，正要搭乘地鐵返回夏萊的途中……）"
1014005-4 = ""
1014005-6 = ""
1014005-7 = ""
1014005-8 = ""
1014005-9 = "（看見了正在地鐵站內的證件快照機拍照的胡桃）"
1014005-10 = "唔……不要緊張……"
1014005-11 = "一，二……"
1014005-12 = ""
1014005-13 = "（……面對證件快照機的胡桃，看起來莫名地緊張）"
1014005-14 = ""
1014005-16 = ""
1014005-17 = ""
1014005-19 = "……唔哇！"
1014005-20 = "[ns] 靠近胡桃"
1014005-25 = "― [log=쿠루미]嘿，嘿咿！[/log][wa:670] "
1014005-29 = "― [log=쿠루미]什──！什，什麼啊老師，你什麼時候來的？[/log][wa:4530] "
1014005-32 = "[ns] 「為什麼要那麼緊張……？」"
1014005-33 = "― [log=쿠루미]我，我才沒有緊張呢！[/log][wa:2240] "
1014005-35 = "― [log=쿠루미]只是……有點難掌握時機……[/log][wa:1570] "
1014005-38 = "― [log=안내 음성]「開始拍攝──三，二，一。」[/log][wa:4770] "
1014005-40 = "― [log=쿠루미]嘻，嘻！[/log][wa:880] "
1014005-43 = "― [log=쿠루미]嗚……又閉眼睛了……[/log][wa:2120] "
1014005-45 = "― [log=쿠루미]如果倒數的話，會莫名地有點緊張呢…… [/log][wa:1890] "
1014005-48 = "― [log=쿠루미]啊，不是！我才沒有緊張哦！ [/log][wa:2690] "
1014005-50 = "― [log=쿠루미]只是會不小心閉上眼睛──[/log][wa:820] "
1014005-53 = "― [log=안내 음성]「開始拍攝──」 [/log][wa:650] "
1014005-55 = "― [log=쿠루미]來了……！[/log]"
1014005-58 = "― [log=안내 음성]「三，二，一。」[/log][wa:2180] "
1014005-60 = "― [log=쿠루미]嘻，嘻！[/log][wa:650] "
1014005-63 = "― [log=쿠루미]真是的！又閉眼了…… [/log][wa:1550] "
1014005-65 = "― [log=쿠루미]為什麼會這樣啦──！　[/log]"
1014005-68 = "嗚嗚，這已經是第幾次失敗了啊？"
1014005-69 = "也剩沒多少錢了……"
1014005-70 = "[s] 「你倒數就會閉眼，是有什麼原因嗎？」"
1014005-71 = "與其說是倒數的問題……不如說問題在於閃光燈。"
1014005-72 = "因為我是尖兵，所以比較常暴露在閃光攻擊之下。#n我使用的盾牌上也裝有閃光裝置。"
1014005-73 = "因此從SRT時期開始，我就持續在做「防閃光訓練」。#n所以只要感覺閃光燈快要亮起來的時候，我就會反射性地閉眼並轉頭……"
1014005-74 = "結果這個習慣反而在拍照時成了阻礙。"
1014005-75 = "[s] 「平常拍照的時候也會這樣嗎？」"
1014005-76 = "不會。只要不去意識閃光燈就沒問題……"
1014005-77 = "可是像地鐵裡的這種證件快照機都一定會有閃光燈……#n而且還會提醒你時機，不是嗎？"
1014005-78 = "所以我才會不自覺地緊張起來。"
1014005-79 = "嗚嗚……所以我才不想用證件快照機的。"
1014005-80 = "[s] 「胡桃，可以站到那面牆前面一下嗎？」"
1014005-81 = "牆壁？像這樣……？"
1014005-82 = ""
1014005-84 = ""
1014005-85 = "[ns] 「不是那邊，是旁邊那面白色的牆。」"
1014005-86 = ""
1014005-88 = ""
1014005-89 = "突然叫我站到牆前面，我實在無法理解你想要做什麼。"
1014005-90 = "就算這麼做，也解決不了什麼問──"
1014005-91 = ""
1014005-94 = "……唔！"
1014005-95 = "你，你突然做什麼啊？#n也不先徵求同意就擅自拍照！"
1014005-96 = "[s] 「抱歉，沒有事先徵求你的同意。」"
1014005-97 = ""
1014005-100 = "[ns] 「不過照片好像拍得挺好的。」"
1014005-101 = "在毫無準備的狀態下突然拍的照片，怎麼可能會好看……！"
1014005-102 = ""
1014005-104 = ""
1014005-105 = "……咦？真的拍得很好耶。"
1014005-106 = "[s1] 「每個人放鬆的時機都不一樣嘛。」\n[s2] 「我覺得胡桃自然的表情最漂亮了。」"
1014005-108 = "說，說什麼漂亮……你……！"
1014005-109 = "你以為這樣說我就會放過你嗎？#n你想拿那張照片做什麼？"
1014005-110 = "[s3] 「有那種可以用數位檔案印大頭照的店家。」\n[s4] 「把這張照片傳過去，請他們印成大頭照吧。」"
1014005-113 = "什麼！？有這種方法的話就早點告訴我啊！"
1014005-114 = "……不對。沒有詳細說明的我也有責任吧。"
1014005-115 = "今天算是白跑了一趟呢。"
1014005-116 = "而且還浪費了一堆錢和時間……"
1014005-117 = "[s] 「但是我反而覺得賺到了呢。」"
1014005-118 = "哪裡賺到了？"
1014005-119 = "[s] 「因為我得到了一張胡桃的照片啊。」"
1014005-120 = "那，那種事……"
1014005-121 = "嗚，嗚嗚嗚……"
1014005-122 = "要是你敢拿去用在大頭照以外的奇怪地方，我是絕對不會放過你的！"
1014005-124 = "（之後和莫名害羞的胡桃一起回到了夏萊）"
