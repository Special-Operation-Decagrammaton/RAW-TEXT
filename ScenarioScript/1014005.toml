[translation]
1014005-1 = "An Aware Fox"
1014005-2 = "Inside a subway station near Schale"
1014005-3 = "I'd finished up some work and had to take the subway to get back to Schale."
1014005-4 = ""
1014005-6 = ""
1014005-7 = ""
1014005-8 = ""
1014005-9 = "At the subway station, I saw Kurumi taking pictures in a self-service booth."
1014005-10 = "Ah... Don't be nervous..."
1014005-11 = "One, two..."
1014005-12 = ""
1014005-13 = "...For some reason, Kurumi looked extremely anxious as she tried to take her pictures."
1014005-14 = ""
1014005-16 = ""
1014005-17 = ""
1014005-19 = "...Kyaaah!"
1014005-20 = "[ns] Walk up to Kurumi."
1014005-25 = "― [log=쿠루미]Ugh, bah![/log][wa:510] "
1014005-29 = "― [log=쿠루미]Wh-What? When did you get here, Sensei? [/log][wa:3730] "
1014005-32 = "[ns] \"Why are you so nervous in front of the camera...?\""
1014005-33 = "― [log=쿠루미]I-I'm not! I'm not nervous at all![/log][wa:1280] "
1014005-35 = "― [log=쿠루미]It's just... I'm having a bit of a tough time getting the timing right...[/log][wa:10] "
1014005-38 = "― [log=안내 음성]Look over here... One. Two. Three.[/log][wa:3970] "
1014005-40 = "― [log=쿠루미]H-Haha.[/log][wa:760] "
1014005-43 = "― [log=쿠루미]Ugh... I closed my eyes again.[/log][wa:1320] "
1014005-45 = "― [log=쿠루미]For some reason, the counting makes me nervous. [/log][wa:730] "
1014005-48 = "― [log=쿠루미]N-No, wait. I never get nervous! [/log][wa:1930] "
1014005-50 = "― [log=쿠루미]I just closed my eyes without thinking...[/log][wa:10] "
1014005-53 = "― [log=안내 음성]\"Look over here\" [/log][wa:330] "
1014005-55 = "― [log=쿠루미]Here I go...![/log]"
1014005-58 = "― [log=안내 음성]\"One. Two. Three.\"[/log][wa:1780] "
1014005-60 = "― [log=쿠루미]Haha. [/log][wa:570] "
1014005-63 = "― [log=쿠루미]Why?! Why do I keep [/log][wa:1190] "
1014005-65 = "― [log=쿠루미]closing my eyes?![/log]"
1014005-68 = "Ugh, how many times have I failed so far?"
1014005-69 = "I don't have much cash left..."
1014005-70 = "[s] \"Do you think the counting is making you close your eyes?\""
1014005-71 = "The counting isn't the problem... I think the problem is thinking the flash is going to go off."
1014005-72 = "As point woman, I have to handle flash attacks a lot. The shield I use also has a flash device on it."
1014005-73 = "I've always been trained to turn my head and close my eyes when I think a flash is coming."
1014005-74 = "I guess muscle memory is kicking in."
1014005-75 = "[s] \"Does this happen when you're taking pictures normally?\""
1014005-76 = "No, it's really only when I start THINKING about the flash going off."
1014005-77 = "With a booth like this, you know the flash is about to go off, and it tells you exactly when it's going to happen. "
1014005-78 = "So it instinctively puts me on edge."
1014005-79 = "Ugh... This is why I didn't want to use a self-service photo booth."
1014005-80 = "[s] \"Kurumi, can you stand in front of that wall for a moment?\""
1014005-81 = "Wall? Like this...?"
1014005-82 = ""
1014005-84 = ""
1014005-85 = "[ns] \"No, get in front of that white wall, right by it.\""
1014005-86 = ""
1014005-88 = ""
1014005-89 = "I don't really understand what standing in front of a wall is going to do."
1014005-90 = "This doesn't solve my problem at—"
1014005-91 = ""
1014005-94 = "...Gah!"
1014005-95 = "Wh-What are you doing? You just took that photo of me on your phone without my consent!"
1014005-96 = "[s] \"Sorry, sorry. I should've warned you.\""
1014005-97 = ""
1014005-100 = "[ns] \"But then the photo might not have come out so well.\""
1014005-101 = "I doubt it did! Especially because I wasn't ready for it!"
1014005-102 = ""
1014005-104 = ""
1014005-105 = "...Huh? Oh. It looks nice."
1014005-106 = "[s1] \"Everyone relaxes at different times.\"\n[s2] \"I think you look prettiest with a natural expression, Kurumi.\""
1014005-108 = "What do you mean \"pretty\"...?!"
1014005-109 = "Don't think that smooth talking is going to get you out of this one! What are you planning to do with that picture?"
1014005-110 = "[s3] \"There are companies that print digital ID photos.\"\n[s4] \"We can ask them to print your ID photos with this one.\""
1014005-113 = "What? You should've told me about this method sooner!"
1014005-114 = "...No. It's partially my fault for not explaining in detail."
1014005-115 = "Anyway, today turned out to be a waste of time."
1014005-116 = "Wasted money and time..."
1014005-117 = "[s] \"Yet I feel like I've come out ahead.\""
1014005-118 = "How did you come out ahead?"
1014005-119 = "[s] \"I got a photo of Kurumi.\""
1014005-120 = "Th-That's..."
1014005-121 = "Ugh... Aughhh..."
1014005-122 = "That photo. If you use it for anything other than an ID photo, don't think I'll go easy on you!"
1014005-124 = "After, I returned to Schale with a curiously shy Kurumi."
