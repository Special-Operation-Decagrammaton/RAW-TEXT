[translation]
1014005-1 = "의식하는 여우"
1014005-2 = "샬레 인근 지하철 역사 내부"
1014005-3 = "(외부 업무를 마치고 지하철을 통해 샬레로 복귀하던 중……)"
1014005-9 = "(지하철 역사 내에 있는 무인 사진기에서 사진을 찍는 쿠루미를 보았다.)"
1014005-10 = "읏…… 긴장하지 말고……"
1014005-11 = "하나, 둘……"
1014005-13 = "(……무인 사진기를 마주한 쿠루미는 어쩐지 잔뜩 긴장한 것처럼 보였다.)"
1014005-19 = "……끄앙!"
1014005-20 = "[ns] 쿠루미에게 다가간다."
1014005-25 = "― [log=쿠루미]으, [wa:630]에잇![/log]"
1014005-29 = "[wa:2510]― [log=쿠루미]뭐,[wa:500] 뭐야? [wa:360]선생님, [wa:1160]언제 왔어?[wa:40] [/log]"
1014005-32 = "[ns] \"사진기 앞에서 뭘 그렇게 긴장하는 거야……?\""
1014005-33 = "[wa:830]― [log=쿠루미]따, [wa:420]딱히[wa:510] 긴장 같은 거 하지 않았거든![/log]"
1014005-35 = "― [log=쿠루미]나는 그저……[wa:1050]타이밍 재는 게 조금 어려워서……[/log]"
1014005-38 = "[wa:210]― [log=안내 음성]<여기 보세요—[wa:2060] 하나, [wa:1250]둘, [wa:1050]셋.>[/log]"
1014005-40 = "― [log=쿠루미]아, [wa:800]아핫.[/log]"
1014005-43 = "[wa:860]― [log=쿠루미]으윽…… [wa:980]또 눈을 감아 버렸어.[/log]"
1014005-45 = "― [log=쿠루미]누가 숫자를 세면 [wa:1650]이상하게 긴장이 되어서—[wa:40] [/log]"
1014005-48 = "[wa:1550]― [log=쿠루미]아, [wa:240]아니. [wa:620]긴장한 게 아니라![wa:120] [/log]"
1014005-50 = "― [log=쿠루미]자꾸 [wa:620]무의식적으로 눈을 감아서—[/log]"
1014005-53 = "[wa:570]― [log=안내 음성]<여기 보세요—>[wa:40] [/log]"
1014005-55 = "― [log=쿠루미]온다……![/log]"
1014005-58 = "― [log=안내 음성]<하나,[wa:1100] 둘, [wa:960]셋.>[/log]"
1014005-60 = "― [log=쿠루미]아핫.[wa:650] [/log]"
1014005-63 = "[wa:550]― [log=쿠루미]그러니까! [wa:800]왜 자꾸 눈을[wa:80] [/log]"
1014005-65 = "― [log=쿠루미]감아버리는 거냐고![/log]"
1014005-68 = "으으, 벌써 몇 번째나 실패한 거야?"
1014005-69 = "이제 현금도 얼마 남지 않았는데……"
1014005-70 = "[s] \"숫자를 세면 눈을 감는 이유라도 있어?\""
1014005-71 = "숫자를 세는 게 문제라기 보다는…… 플래시가 터진다고 생각하는 게 문제인 것 같아."
1014005-72 = "나는 포인트맨이니까, 섬광 공격에 노출되는 일이 잦은 편이거든. 내가 사용하는 방패에도 섬광 장치가 달려 있기도 하고."
1014005-73 = "그렇다 보니 플래시가 터질 것 같으면 반사적으로 눈을 감고 고개를 돌리는 훈련을 SRT 때부터 꾸준히 해 왔는데……"
1014005-74 = "이 습관이 오히려 사진을 찍을 때는 방해가 되는 것 같아."
1014005-75 = "[s] \"평범하게 사진을 찍을 때도 그래?\""
1014005-76 = "아니. 플래시가 터진다고 생각하지 않으면 문제가 없는데……"
1014005-77 = "이런 지하철에 있는 무인 사진기는 무조건 플래시를 터트리는 데다가, 타이밍까지 알려주잖아?"
1014005-78 = "그러니까 나도 모르게 긴장을 하게 되더라고."
1014005-79 = "으으…… 이래서 무인 사진기는 이용하기 싫었었는데."
1014005-80 = "[s] \"쿠루미, 잠깐 그 쪽 벽 앞에 서볼래?\""
1014005-81 = "벽? 이렇게……?"
1014005-85 = "[ns] \"아니, 그 옆에 흰색 벽 앞으로 가 봐.\""
1014005-89 = "갑자기 벽 앞에 서라니, 이해할 수가 없네."
1014005-90 = "이런다고 뭔가 문제가 해결되는 것도 아닌데—"
1014005-94 = "……읏!"
1014005-95 = "가, 갑자기 무슨 짓이야? 멋대로 양해도 구하지 않고 스마트폰으로 사진을 찍다니!"
1014005-96 = "[s] \"갑자기 예고도 없이 찍어서 미안해.\""
1014005-100 = "[ns] \"그래도 사진은 꽤 잘 나온 것 같아.\""
1014005-101 = "그렇게 갑자기 준비도 안 된 상태에서 사진을 찍으면 잘 나올리가……!"
1014005-105 = "……어라? 진짜 잘 나왔네."
1014005-106 = "[s1] \"사람마다 긴장을 푸는 타이밍은 다르니까.\"\n[s2] \"쿠루미는 자연스러운 표정이 제일 예쁘다고 생각해.\""
1014005-108 = "예쁘다니, 그런……!"
1014005-109 = "그렇게 말하면 봐줄거라고 생각한 거야? 그 사진으로 뭘 어쩌려고?"
1014005-110 = "[s3] \"데이터로 증명사진을 뽑아 주는 업체도 있으니까.\"\n[s4] \"이 사진을 보내서 증명사진을 뽑아달라고 하자.\""
1014005-113 = "뭐? 그런 방법이 있었으면 진작 알려달라고!"
1014005-114 = "……아니지. 자세히 말하지 않은 내게도 책임이 있으려나."
1014005-115 = "여하튼 오늘은 헛걸음만 한 셈이 되었네."
1014005-116 = "돈도 날리고, 시간도 날리고……"
1014005-117 = "[s] \"하지만 나는 오히려 이득을 본 느낌인데.\""
1014005-118 = "뭐가 이득인데?"
1014005-119 = "[s] \"쿠루미의 사진을 한 장 얻게 되었으니까.\""
1014005-120 = "그, 그런……"
1014005-121 = "으으, 으으으……"
1014005-122 = "그 사진. 증명사진 이외에 이상한 데 쓰면, 정말 가만두지 않을 테니까!"
1014005-124 = "(이후, 묘하게 부끄러워하는 쿠루미와 함께 샬레로 돌아왔다.)"
