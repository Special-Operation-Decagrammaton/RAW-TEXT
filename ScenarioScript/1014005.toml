[translation]
1014005-1 = "จิ้งจอกผู้รู้ตัว"
1014005-2 = "ในสถานีรถไฟใต้ดินใกล้ชาเล่ต์"
1014005-3 = "(ขณะที่กำลังเดินทางกลับชาเล่ต์ด้วยรถไฟใต้ดินหลังเสร็จงานข้างนอก...)"
1014005-4 = ""
1014005-6 = ""
1014005-7 = ""
1014005-8 = ""
1014005-9 = "(คุณครูก็เห็นคุรุมิกำลังถ่ายรูปอยู่ที่ตู้ถ่ายรูปอัตโนมัติในสถานีรถไฟใต้ดิน)"
1014005-10 = "อึก... อย่าประหม่าสิ..."
1014005-11 = "หนึ่ง... สอง..."
1014005-12 = ""
1014005-13 = "(คุรุมิมีท่าทีประหม่าอย่างประหลาดขณะเผชิญหน้ากับกล้องถ่ายรูปอัตโนมัติ)"
1014005-14 = ""
1014005-16 = ""
1014005-17 = ""
1014005-19 = "แง...!"
1014005-20 = "[ns] เดินไปหาคุรุมิ"
1014005-25 = "― [log=쿠루미]อึก อ๊าย![/log][wa:510] "
1014005-29 = "― [log=쿠루미]อะ...อะไรน่ะ? คุณครู มาตั้งแต่ตอนไหน? [/log][wa:3810] "
1014005-32 = "[ns] \"ทำไมถึงประหม่าอยู่หน้ากล้องแบบนี้ล่ะ...?\""
1014005-33 = "― [log=쿠루미]ฉะ... ฉันไม่ได้ประหม่าอะไรสักหน่อย![/log][wa:1240] "
1014005-35 = "― [log=쿠루미]ฉันก็แค่... รู้สึกว่าการกะจังหวะมันค่อนข้างยากน่ะ...[/log][wa:10] "
1014005-38 = "― [log=안내 음성]<มองตรงนี้นะคะ หนึ่ง สอง สาม>[/log][wa:4170] "
1014005-40 = "― [log=쿠루미]อะ... อ๊ะ[/log][wa:680] "
1014005-43 = "― [log=쿠루미]อึก... เผลอหลับตาอีกจนได้[/log][wa:1520] "
1014005-45 = "― [log=쿠루미]พอได้ยินใครนับเลข ฉันก็จะประหม่าขึ้นมาแปลกๆ น่ะ [/log][wa:730] "
1014005-48 = "― [log=쿠루미]มะ... ไม่สิ ไม่ได้ประหม่า! [/log][wa:2170] "
1014005-50 = "― [log=쿠루미]แค่มันชอบหลับตาอัตโนมัติไปเองต่างหาก[/log][wa:10] "
1014005-53 = "― [log=안내 음성]<มองตรงนี้นะคะ> [/log][wa:370] "
1014005-55 = "― [log=쿠루미]มาแล้ว...![/log]"
1014005-58 = "― [log=안내 음성]<หนึ่ง สอง สาม>[/log][wa:1900] "
1014005-60 = "― [log=쿠루미]อ๊ะ [/log][wa:650] "
1014005-63 = "― [log=쿠루미]เอาอีกแล้ว! ทำไมฉันถึง [/log][wa:1070] "
1014005-65 = "― [log=쿠루미]เอาแต่หลับตาล่ะเนี่ย![/log]"
1014005-68 = "อึก... ถ่ายเสียไปกี่ครั้งแล้วเนี่ย?"
1014005-69 = "ตอนนี้เงินสดก็เหลือไม่เท่าไรแล้วด้วย..."
1014005-70 = "[s] \"ทำไมถึงหลับตาเวลานับเลขเหรอ?\""
1014005-71 = "ปัญหาไม่ได้อยู่ที่การนับตัวเลขหรอก... ฉันว่ามันอยู่ที่การคิดว่าแฟลชมันจะสว่างวาบออกมา#nต่างหาก"
1014005-72 = "ฉันเป็นพ็อยนต์แมน ก็เลยมีโอกาสที่จะโดนระเบิดแสงโจมตีใส่บ่อยๆ แถมโล่ที่ฉันใช้ก็มีอุปกรณ์#nปล่อยแสงวาบติดตั้งเอาไว้ด้วย"
1014005-73 = "ก็เพราะอย่างนี้แหละ ตั้งแต่สมัยอยู่ SRT ฉันก็เลยต้องฝึกหนักจนมีปฏิกิริยาสะท้อนกลับอัตโนมัติ ถ้าเหมือนจะมีแสงแฟลชวาบขึ้นมาเมื่อไร ฉันก็จะติดนิสัยหลับตา แล้วสะบัดหน้าหนีทันที..."
1014005-74 = "ฉันว่านิสัยนี้เป็นอุปสรรคต่อการถ่ายรูปแล้วละ"
1014005-75 = "[s] \"เป็นอย่างนี้แม้กระทั่งตอนถ่ายรูปปกติเลยเหรอ?\""
1014005-76 = "เปล่าหรอก ถ้าฉันไม่คิดกับตัวเองว่าเดี๋ยวจะมีแสงแฟลช มันก็ไม่เป็นปัญหาหรอก..."
1014005-77 = "แต่ตู้ถ่ายรูปอัตโนมัติในรถไฟใต้ดินนี่น่ะ นอกจากจะเปิดแฟลชเสมอแล้ว มันยังนับเวลาให้ด้วยนี่นา "
1014005-78 = "เพราะงั้นฉันเลยประหม่าโดยไม่รู้ตัวน่ะ"
1014005-79 = "อึก... นี่แหละเหตุผลที่ฉันไม่อยากใช้ตู้ถ่ายรูปอัตโนมัติ"
1014005-80 = "[s] \"คุรุมิ มายืนข้างหน้ากำแพงฝั่งนี้เดี๋ยวหนึ่งสิ\""
1014005-81 = "หน้ากำแพง? แบบนี้น่ะเหรอ...?"
1014005-82 = ""
1014005-84 = ""
1014005-85 = "[ns] \"ไม่ใช่ ให้ไปยืนหน้ากำแพงสีขาวข้างๆ นั้นต่างหาก\""
1014005-86 = ""
1014005-88 = ""
1014005-89 = "ทำไมจู่ๆ ถึงสั่งให้ไปยืนหน้ากำแพงนะ ไม่เห็นจะเข้าใจเลย"
1014005-90 = "ทำแบบนี้ใช่ว่าจะแก้ปัญหาได้สักหน่อย—"
1014005-91 = ""
1014005-94 = "อึก...!"
1014005-95 = "จะ... จู่ๆ ก็ทำบ้าอะไรเนี่ย? ยกโทรศัพท์มือถือขึ้นมาถ่ายรูปโดยที่ไม่ถามอะไรสักคำเลย!"
1014005-96 = "[s] \"ขอโทษที่ครูถ่ายรูปแบบไม่ได้บอกก่อนนะ\""
1014005-97 = ""
1014005-100 = "[ns] \"แต่รูปก็ออกมาดูดีเลยละ\""
1014005-101 = "ถ้าถ่ายรูปกะทันหันแบบไม่ได้เตรียมตัวล่วงหน้า รูปมันไม่มีทางออกมาดีหรอก...!"
1014005-102 = ""
1014005-104 = ""
1014005-105 = "เอ๋...? ดูดีเลยนี่นา?"
1014005-106 = "[s1] \"แต่ละคนมีจังหวะที่รู้สึกผ่อนคลายไม่เหมือนกันน่ะ\"\n[s2] \"ครูว่าสีหน้าเป็นธรรมชาติของคุรุมินี่ละ สวยที่สุดแล้ว\""
1014005-108 = "สวยงั้นเหรอ อะไรกัน...!"
1014005-109 = "คิดว่าพูดแบบนั้นแล้วฉันจะปล่อยผ่านให้งั้นเหรอ? จะเอารูปที่ถ่ายเมื่อกี้ไปทำอะไรน่ะ?"
1014005-110 = "[s3] \"มีร้านที่รับทำรูปติดบัตรจากไฟล์รูปน่ะ\"\n[s4] \"ครูจะเอารูปถ่ายนี้ไปทำเป็นรูปติดบัตรให้นะ\""
1014005-113 = "ว่าไงนะ? ถ้ามีวิธีแบบนั้น ก็น่าจะบอกฉันตั้งแต่แรกสิ!"
1014005-114 = "ไม่สิ... หรือฉันก็มีส่วนผิดเหมือนกันที่ไม่ได้อธิบายให้ฟังอย่างละเอียด"
1014005-115 = "แต่ก็เอาเถอะ ยังไงวันนี้ก็พยายามไปโดยเปล่าประโยชน์สินะ"
1014005-116 = "เสียทั้งเงิน เสียทั้งเวลา..."
1014005-117 = "[s] \"แต่ครูว่าได้ประโยชน์มากกว่านะ\""
1014005-118 = "ได้ประโยชน์ตรงไหนกัน?"
1014005-119 = "[s] \"ก็ครูได้รูปของคุรุมิมารูปหนึ่งไง\""
1014005-120 = "พะ... พูดอะไรเนี่ย..."
1014005-121 = "อะ... อึก..."
1014005-122 = "รูปนั้นน่ะ ถ้าเอาไปใช้ทำเรื่องอื่นนอกจากทำรูปติดบัตรละก็ ฉันไม่อยู่เฉยๆ แน่!"
1014005-124 = "(หลังจากนั้นคุณครูก็กลับไปยังชาเล่ต์พร้อมกับคุรุมิที่ดูเขินอายอย่างผิดปกติ)"
