[translation]
1003006-1 = "둘 만을 위한 노천탕"
1003006-2 = "아, 선생님. 오셨군요. 기다리고 있었습니다."
1003006-3 = "말씀드린 대로 이곳 료칸의 저녁 숙박권을 예약해 두었습니다."
1003006-4 = "이 료칸은 게헨나 학원에서도 손꼽히는 유서 깊은 료칸으로 키보토스 전역에서 손님들이 끊이지 않고 찾아오는지라, 평범한 방법으로는 예약하는 것조차 쉽지 않은 관광명소입니다."
1003006-5 = "하지만 다행히 선도부에게 주어지는 특권으로 하루 치의 숙박권을 어렵사리 구할 수 있었던지라, 이렇게 선생님을 모시게 되었습니다."
1003006-6 = "[s1] \"그런 귀한 숙박권을 받아도 괜찮아?\"\n[s2] \"뭔가 부담스러운걸…….\""
1003006-7 = "아뇨, 선생님께서 그동안 제게 베풀어주셨던 은혜를 생각하면 오히려 하루로는 모자랄 정도입니다."
1003006-8 = "아뇨, 선생님께서 그동안 제게 베풀어주셨던 은혜를 생각하면 오히려 하루로는 모자랄 정도입니다."
1003006-9 = "하지만 선생님의 시간을 더 빼앗았다가는 일정에도 여러 가지 문제가 생길 테니, 부디 하루 치의 숙박권으로 만족해 주셨으면 합니다."
1003006-10 = "게다가 이 료칸은 2인 숙박이 기본 조건이었던지라……"
1003006-11 = "같이 갈 사람이 없어서 곤란하던 참이었거든요."
1003006-12 = "[s] \"그럼 치나츠의 성의를 받도록 할게.\""
1003006-13 = "네, 오늘은 제가 성심성의껏 선생님을 모시겠습니다."
1003006-19 = "어서 오십시오. 저희 료칸을 찾아주셔서 대단히 감사합니다."
1003006-20 = "오늘 하루 숙박을 예약하신 히노미야 치나츠님이시지요?"
1003006-21 = "네, 두 사람분의 저녁 식사와 숙소를 예약했는데요."
1003006-22 = "네, 확인했습니다."
1003006-23 = "그나저나 손님, 지금 저희 료칸에서는 커플 손님에게 전세 노천탕 시설을 무료로 제공하고 있습니다."
1003006-24 = "호화로운 프라이빗 온천을 전세 낼 수 있는 모처럼의 기회이니, 한 번 이용해 보시는 게 어떠신가요?"
1003006-25 = "네? 커, 커, 커플이요?!"
1003006-26 = "네. 여기 예약서에 커플전용 플랜을 선택하셨기에……"
1003006-27 = "혹시 예약서에 무슨 문제라도 있으신가요?"
1003006-28 = "(이런, 큰일이네요. 예약을 서두르느라 오기재를 하고 말았어요.)"
1003006-29 = "(학생과 선생이 커플이라니. 이런 부끄러운 실수를 한 걸 선생님께서 아신다면, 저를 어찌 생각하실지……)"
1003006-30 = "……저, 제가 실수를 한 것 같네요."
1003006-31 = "네? 그럼 혹시 두 분은 커플이 아니신가요?"
1003006-32 = "[s3] \"아뇨, 틀리지 않았습니다.\"\n[s4] \"아직 익숙하지 않은 것뿐이라…….\""
1003006-35 = "서, 서, 선생님?!"
1003006-36 = "아하, 그러시군요."
1003006-37 = "그럼 말씀드린 대로 전세 노천탕을 준비해드리겠습니다."
1003006-38 = "탕은 숙소 바로 앞에 있으니 편하실 때 이용해주시면 됩니다."
1003006-43 = "서, 서, 선생님?! 어째서 그런 거짓말을 하신 건가요?"
1003006-44 = "네? 모처럼의 호화 료칸에서 제공하는 서비스인데, 받지 않으면 아깝다고요?"
1003006-45 = "그건 그렇습니다만……"
1003006-46 = "둘이서 전세 노천탕에 들어간다는 건 결국…… 선생님과 같은 탕에 들어가게 된다는 뜻……"
1003006-47 = "설마 이런 일이 될 줄이야……"
1003006-51 = "……아니, 아무것도 아닙니다."
1003006-52 = "오늘은 선생님의 은혜에 보답하기 위한 자리니까요. 사소한 것 때문에 폐를 끼칠 수는 없습니다."
1003006-53 = "저녁 식사가 준비되려면 조금 시간이 걸릴 것 같으니……"
1003006-59 = "우선은 그럼 그 노천탕에 한 번 들어가 볼까요?"
1003006-62 = "[wa:750]― 이렇게 [wa:400]호화로운 온천을 [wa:1350]둘이서만 쓸 수 있다니……"
1003006-64 = "― 인생, [wa:800]무슨 일이 일어날지 [wa:550]모르는 거네요."
1003006-67 = "[wa:480]― 언젠가는…… [wa:1800]어쩌면 [wa:1820]이런 미래도……."
1003006-70 = "[wa:200]― 아, [wa:650]아, [wa:500]아뇨! [wa:800]신경 쓰지 말아 주세요……!"
1003006-73 = "[wa:1300]― 그러니까, [wa:1350]만약, [wa:650]정말로 언젠가 그렇게 [wa:1650]된다면……"
1003006-76 = "― 그런 분에 넘치는 나날을 [wa:2050]상상하지 않은 것은,"
1003006-78 = "― 아닙니다만……."
1003006-81 = "[wa:850]― 선생님과 학생으로도,"
1003006-83 = "― 지금은, [wa:870]지나칠 정도로 충분히 행복하네요. [wa:2600]정말로……"
1003006-86 = "정말 좋은 탕이었네요."
1003006-87 = "하루의 피로는 물론이고, 학기 중에 쌓인 피로까지 모두 날아가는 느낌이었습니다."
1003006-88 = "그럼 선생님, 지금부터 무얼 하실 계획이신가요?"
1003006-89 = "이 료칸에는 온천 이외에도 즐거운 시설이 잔뜩 있는 것 같습니다만……."
1003006-90 = "네? 다시 한번 노천탕에 들어가고 싶으시다고요?"
1003006-94 = "……그럼 저도 선생님을 따라 같이 탕에 들어가겠습니다."
1003006-95 = "혼자서 탕을 즐기다가 더운물 때문에 현기증이라도 나면 큰일이니까요."
1003006-96 = "게헨나의 보건 담당이자, 일단은 서류상의 커플로서…… 선생님을 옆에서 계속 지켜봐 드리겠습니다."
1003006-98 = "(이후, 현기증이 나기 직전까지 치나츠와 함께 탕을 즐겼다.)"
