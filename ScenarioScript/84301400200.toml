[translation]
84301400200-5 = "별일…… 그래, 어쩌면 이건……."
84301400200-6 = "\"별일이야 있겠어\"라는 말을 한 내 잘못인가……."
84301400200-7 = "확실히 이번 건 조금 스케일이 컸네요. 그래도 두 분 덕분에 무사했어요. 고맙습니다."
84301400200-8 = "신경 쓰지 마! 재밌었으면 됐지~! 깜짝이벤트라는 느낌도 있잖아?"
84301400200-9 = "아니, 선배. 깜짝이벤트라는 건 이런 게 아닌……."
84301400200-11 = "어째서…… 어째서 아방가르드군이……!?"
84301400200-12 = "이런 패턴은 입력한 적이 없는데……"
84301400200-18 = "이 연락은 분명……."
84301400200-23 = "이게 대체 뭐야-!!!!"
84301400200-27 = "예상대로……"
84301400200-28 = "엔지니어부……!! 기어코 사고를 쳤구나!"
84301400200-29 = "특별히 어제까지도 와서 내가 같이 검사했는데, 그 사이에 또 뭔가를 집어넣었어!?"
84301400200-30 = "아니, 아니야. 우리는 아무것도 하지 않았어."
84301400200-31 = "아무것도 하지 않았는데 어제는 괜찮았던 게 갑자기 오늘은 난동을 부렸다고!? 그게 말이 돼!?"
84301400200-32 = "말이 안 되지만 사실이야. 우리는 아무도 손대지 않았어."
84301400200-33 = "몰래 넣으려고 했던 건…… 그 전에 이미 넣어 뒀었고."
84301400200-34 = "뭐라고……?"
84301400200-35 = "……윽. 괜한 말을 했나."
84301400200-37 = "(거짓말을 못 하시는 타입이네요.)"
84301400200-39 = "하지만 이번만큼은 정말로 이해할 수 없는 상황이야. 소란스럽게 만든 건 미안하지만, 대신 우리 스스로 수습할 수 있게, 조사할 시간이라도 주지 않겠어?"
84301400200-43 = "……진짜 의도한 게 아니라고?"
84301400200-44 = "후…… 우타하 선배가 거짓말을 하는 타입은 아니지……."
84301400200-45 = "이쪽에 관해선 전문가가 아니니 뭐라고 확인하기도 어렵네. 이럴 때 회장만 자리에 있었어도……."
84301400200-46 = "확실히 리오가 있었다면 이 자리에서 바로 증명할 수 있었겠네. 아쉬워라."
84301400200-48 = "(리오……. 예상은 했지만, 기술적으로 꽤 신뢰받고 있었군요.)"
84301400200-50 = "알았어. 일단 자체적으로 조사할 시간을 주도록 할게. 대신 확실하게 원인을 찾아내야 해."
84301400200-51 = "고마워."
84301400200-57 = "(뭔가 이 상황……. 수상한 낌새가 느껴지네요.)"
84301400200-58 = "(조금 찾아보도록 할까요.)"
