[translation]
2003503-1 = "속성 강좌"
2003503-5 = "……안녕, 선생님……. 음냐……."
2003503-6 = "[s] \"어……. 안녕, 츠바키? 가이드 복으로 샬레까지 온 거야?\""
2003503-7 = "웅……. 그렇지만 이 옷을 입었더니, 여기까지 오는 길에 사람들이 계속 길을 물어봐서……."
2003503-8 = "여러 가지로…… 곤란했어……."
2003503-9 = "내가 가이드해 줄 수 있는 건, 잠을 잘 자는 방법밖에 없는데……."
2003503-13 = "계신가요, 선생님? 지금 샬레에 '백귀야행의 잠자는 공주'가 와 있다는 소식을 들었는데요!"
2003503-14 = "우웅……?"
2003503-15 = "[ns] \"……츠바키 씨, 뭔가 했나요……?\""
2003503-16 = "아냐, 아무것도 안 했어……."
2003503-17 = "그러고보니, 여기까지 오는 길에…… 왠지 다들 날 따라오고 있는 것 같은 느낌이 들긴 했는데……."
2003503-21 = "(어쩔 수 없이 문을 열었다.)"
2003503-25 = "(그러자……!)"
2003503-30 = "안녕하세요, 선생님! '잠자는 공주'를 따라왔는데요!"
2003503-31 = "잘은 모르지만, '잠자는 공주'를 따라가면, 샬레에서 편히 잠을 자며 쉴 수 있다는 소문이 퍼져서……."
2003503-32 = "으으…… 불면증이 너무 심해졌어……. 웬만한 수면유도제로는 이제 효과가 없을 지경이라고…… 한 시간이라도 좋으니 푹 자고 싶어……"
2003503-37 = "야간 순찰을 2주 동안 교대 없이 했더니…… 생활 리듬이 다 엉망이 되어 버렸어요……."
2003503-38 = "[s] \"발키리 학생까지?!\""
2003503-39 = "……치안도, 잠을 자야 지키죠……."
2003503-40 = "……어떻게 할까, 선생님?"
2003503-41 = "[s1] \"……부탁해, 츠바키.\"\n[s2] \"이렇게 된 거, 이 아이들을…… '가이드' 해 줘!\""
2003503-44 = "응. 선생님이 그렇게까지 말한다면…… 알았어."
2003503-45 = "잘할 수 있을지는 모르겠지만. 어디, 열심히 해볼게. 선생님."
2003503-49 = "다들 몸으로 실감하고 있겠지만…… 제대로 잠을 자는 건 의외로 쉽지 않은 일이야."
2003503-50 = "현대인들은 오늘날에도 갖은 불면증에 시달리면서……."
2003503-51 = "잠 잘 자는 법, 숙면 취하는 방법을 갈구하면서 인터넷에 질문 글을 올리고 있어."
2003503-52 = "자기 전에 따듯하게 샤워하기, 코코아 마시기, 화이트 노이즈 들으면서 명상하기 등등……."
2003503-53 = "하지만 여기 온 사람들은 모두 그 정도 방법 정도는 다 해 봤겠지?"
2003503-55 = "샤워를 해 봤지만, 오히려 혈액순환이 활발해져서 잠이 달아났어요……."
2003503-56 = "코코아를 마셨는데, 그 안에 있는 카페인 성분 때문인지 거꾸로 잠이 깨 버렸어……."
2003503-58 = "애초에 화이트 노이즈는 기계를 만지다 보면 지겹도록 듣는 거라…… 도리어 작업 중 환경이 떠올라서 정신만 집중되더라……."
2003503-59 = "눈가리개가 효과가 있다고 해서 착용해 봤는데, 거꾸로 청각이 예민해져서 거기에 집중하게 되더라고요……."
2003503-60 = "그래. 수많은 숙면 방법이 있다고 이야기되지만, 자기에게 맞는 숙면법을 찾기란 쉬운 일이 아니지……."
2003503-61 = "그러니까, 내가 시험해 보고 효과를 본 방법을 가르쳐 줄게."
2003503-62 = "우선, 숨을 천천히 깊게 쉬기. 너무 부자연스럽지 않게, 그렇지만 평소보다는 느리게."
2003503-63 = "스으– 후우– 스으– 후우– 스으– 후우–"
2003503-67 = "……쿨……."
2003503-69 = "버, 벌써?!"
2003503-70 = "이것이 백귀야행의 잠자는 공주……. 그, 그렇지만 우리는……?!"
2003503-76 = "우웅……? 미안. 깜빡 먼저 잠들어 버렸네."
2003503-77 = "그리고 다음으로는 인상을 쓰지 말고, 눈, 눈꺼풀, 혀, 턱에 힘이 들어가지 않도록 주의하기. 천천히 얼굴에서 힘을 뺀다고 생각하면 될 거야."
2003503-78 = "그렇게 하면서 아까의 호흡을 유지하면……."
2003503-82 = "……코오……."
2003503-83 = "조금 기분이 나른해지는 느낌은 드는데…… 이미 잠들었어?!"
2003503-84 = "어떤 의미로는 부럽기까지 하네요. 경이롭기도 하고요."
2003503-86 = "후앗? 벌써 간식 시간……? 아니구나……."
2003503-87 = "다시, 이어서 목, 어깨, 상체, 팔, 다리 순으로 힘을 빼는 거야. 온몸이 흐늘흐늘한 물풍선이 되었다고 생각하고……."
2003503-88 = "충분히 힘이 빠졌다는 느낌이 들고, 어딘가 기운이 빠져나간다는 기분이 머리에서부터 내려오면……."
2003503-89 = "머릿속의 생각을 지우개로 지운다고 생각하며…… 자기 숨소리에 주의를 기울여 봐……."
2003503-90 = "아 참……. 눕기 전에 미리 눈가리개와 귀마개를 착용하는 것도 추천하는 방법이야……."
2003503-91 = "눈가리개뿐만 아니라, 귀마개도요?"
2003503-92 = "응……. 청력은 의외로 수면에 중요한 요소거든……."
2003503-93 = "그러고 있다 보면…… 모든 게 잘 된다면……."
2003503-97 = "……쿠우울……."
2003503-99 = "역시 대단하네요……! 하지만 뭔가, 평소보다 확실히 좋은 기분으로 기운이 빠지는 것 같아요……."
2003503-100 = "이 나른한 감각……. 뭔가 오랜만인데……."
2003503-102 = "어…… 뭐지? 눈이 무거워……. 제발 이대로……."
2003503-103 = "……스으……."
2003503-114 = "(학생들은 이내 잠 속으로 빠져들어 갔다.)"
2003503-115 = "(츠바키의 효과는…… 굉장했다!)"
2003503-117 = "음냐……? 어라, 모두 잠들었네……?"
2003503-118 = "헤헤……. 잘 됐다……."
2003503-119 = "[s] \"역시 츠바키야. 믿고 있었어!\""
2003503-120 = "쉿, 선생님. 너무 큰 소리를 내면 도로 깨어나 버릴지도 몰라."
2003503-123 = "그러면 나도…… 계속해서 잠을 자 볼까……."
2003503-129 = "[ns] (츠, 츠바키?!)"
2003503-130 = "무릎 좀 빌릴게……."
2003503-131 = "괜찮지, 선생님?"
2003503-133 = "(츠바키는 내 무릎을 베더니 그대로 잠들어 버렸다.)"
2003503-134 = "(휴게실은 그렇게, 학생들의 고른 숨소리로 가득 찼다.)"
