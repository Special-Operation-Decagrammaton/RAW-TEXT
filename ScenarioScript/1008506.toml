[translation]
1008506-1 = "디카페인"
1008506-2 = "밀레니엄 학원 인근 야영장"
1008506-5 = "아, 선생님. 어서 와."
1008506-6 = "캠핑용 의자와 테이블을 조립하느라 미리 와서 준비하고 있었어."
1008506-7 = "[s1] \"카페인을 줄이는 방법을 시험해 본다고 들었는데……\"\n[s2] \"갑자기 캠핑이라도 하려는 거야?\""
1008506-10 = "음, 캠핑이 주목적은 아니지만……"
1008506-11 = "왜, 일전에 한 번 디지털 노마드를 체험해 본다고 야외에 노트북을 들고나와서 작업을 했던 적이 있었잖아?"
1008506-12 = "물론 결과적으로는 실패로 끝나긴 했지만……"
1008506-13 = "하지만 그때의 기억을 돌이켜 떠올려보니 평소보다 에너지 드링크를 덜 마셨던 것 같아서."
1008506-14 = "물론 애초에 들고 간 에너지 드링크의 양 자체가 적었던 탓도 있겠지만……"
1008506-15 = "아예 물리적으로 카페인을 섭취할 수 없는 상황을 만들어 두면 억지로라도 참게 되지 않을까 싶어서."
1008506-16 = "[s3] \"콜드 터키식 중독 탈출법이구나……\"\n[s4] \"효과가 있었으면 좋겠네.\""
1008506-19 = "응, 그래서 오늘은 편의점이나 냉장고가 없는 환경에서 느긋하게 오프라인 작업을 하면서 시간을 때우려고."
1008506-20 = "하지만 혹시라도 중간에 의지가 꺾여 돌아가고 싶어질지도 모르니까……"
1008506-26 = "선생님이 옆에서 계속 지켜봐 줬으면 좋겠어."
1008506-27 = "[s5] \"그거라면 문제없지.\"\n[s6] \"같이 힘내서 참아보자!\""
1008506-30 = "응, 그럼 지금부터 시작해 볼까?"
1008506-36 = "(약 한 시간 뒤……)"
1008506-41 = "으음……"
1008506-42 = "집중이 안 돼……"
1008506-43 = "평소에 자주 하는 간단한 작업인데도, 머리가 복잡하고 자꾸 다른 생각이 떠오르는 것이……"
1008506-44 = "……금단 증상이 시작된 것 같아."
1008506-45 = "[s] \"벌써부터?\""
1008506-46 = "으음…… 뭔가 의식적으로 에너지 드링크를 떠올리지 말아야 한다고 생각하니 더 신경 쓰이는 느낌이야."
1008506-47 = "그래도 계속 일에 집중하다 보면 신경 쓰이지 않는 때가 오겠지……."
1008506-48 = "조금만 더 참아볼게……."
1008506-50 = "(하지만 시간이 지날수록 하레의 금단증상은 점차 심해지는 것처럼 보였고……)"
1008506-54 = "(……끝내 얼굴을 손에 파묻은 채 아무것도 하지 못하게 되어 버렸다.)"
1008506-56 = "으으…… 으으으……"
1008506-57 = "카페인…… 카페인이 부족해……"
1008506-58 = "금단 증상이 너무 심해서 카페인 이외에는 아무것도 생각할 수 없게 되어버린 것 같아……"
1008506-59 = "어쩌지, 선생님……?"
1008506-60 = "이대로 가다가는 나도 모르게 다른 야영객의 캠프를 습격해서 커피를 빼앗아 마실지도 몰라……"
1008506-61 = "[s] \"그건 곤란한데……\""
1008506-63 = "[ns] \"잠시만 기다려 봐.\""
1008506-71 = "[ns] 보온병에 담아 온 커피를 내민다."
1008506-75 = "고마워, 선생님……"
1008506-80 = "하아…… 바로 이걸 원했어."
1008506-81 = "지친 몸에 카페인이 스며들어서…… 이대로 녹아버릴 것 같아……"
1008506-82 = "……그나저나 선생님에게는 한심한 꼴을 보였네."
1008506-83 = "이번에야말로 카페인을 줄이겠다고 호언하고서는 몇 시간도 참지 못하다니……"
1008506-84 = "역시 내가 카페인을 멀리하는 건 불가능한 일이었나 봐."
1008506-85 = "[s] \"아니, 하레는 여전히 잘 참고 있어.\""
1008506-87 = "[ns] \"방금 준 커피는 디카페인 원두로 내린 것이거든.\""
1008506-91 = "응……? 이 커피에 카페인이 포함되어 있지 않았다고?"
1008506-92 = "하지만 마시자마자 뭔가 몸이 풀리면서 기분이 고양되는 것처럼 느껴졌는데……"
1008506-96 = "……역시 마음가짐이 중요한 걸까."
1008506-97 = "선생님이 준 커피라고 하니 나도 모르게 자기 최면이 걸렸던 걸지도."
1008506-98 = "[s] \"뭔가 몸에 이상이라도 있어?\""
1008506-102 = "아니, 아무것도 아니야!"
1008506-103 = "선생님이 준 디카페인 커피가 생각보다 잘 듣는 것 같아서……"
1008506-104 = "다음에도 내가 집중하지 못하고 방황하는 것처럼 보인다면……"
1008506-110 = "그때도 선생님의 커피, 마시게 해 줘야 해……?"
