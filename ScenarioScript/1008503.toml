[translation]
1008503-1 = "글램핑"
1008503-3 = "(샬레의 업무차, 밀레니엄 학원을 방문한 김에 하레를 만나러 베리타스의 부실을 방문했다.)"
1008503-8 = "베리타스 해커 휴게실"
1008503-10 = "[ns1] \"하레, 있어?\"\n[ns2] \"저번에 부탁한 <요괴 MAX> 패션 후르츠 맛, 사왔는데—\""
1008503-16 = "[ns3] \"우왓, 추워!\"\n[ns4] \"이 날씨에 에어컨이 켜져 있잖아……?\""
1008503-23 = "아, 선생님. 왔었구나."
1008503-24 = "미안. 받기로 한 택배가 있어서 잠깐 자리를 비우고 있었어."
1008503-28 = "손에 든 그 음료수는…… 요괴 MAX 패션 후르츠 맛이잖아?"
1008503-29 = "마침 마시고 싶던 참이었는데…… 일부러 가져다줘서 고마워."
1008503-30 = "[s5] \"천만에.\"\n[s6] \"그나저나 지금 에어컨이 켜져 있는 것 같은데……\""
1008503-33 = "아, 그건 신경 쓰지 마. 일부러 켜 둔 거니까."
1008503-34 = "새로운 고연산 클라우드 컴퓨팅을 시험해 보느라, 부실에 있는 서버 컴퓨터를 최대 스펙으로 가동하는 중이었거든."
1008503-35 = "온도가 조금이라도 높아지면 서버의 효율이 떨어질 수 있어서, 에어컨으로 직접 쿨링을 하던 중이었어."
1008503-36 = "……부실이 조금 춥더라도 양해해줘."
1008503-37 = "[s7] \"나야 큰 상관은 없지만……\"\n[s8] \"이렇게 추운데 하레는 계속 여기서 작업을 할 수 있겠어?\""
1008503-40 = "응. 그 문제라면 걱정하지 않아도 괜찮아."
1008503-41 = "이럴 때를 대비해서 부부장에게서 캠핑 도구를 빌려왔거든."
1008503-46 = "에어컨 바람을 막아줄 윈드 자켓과 휴대용 전기 손난로, 방한용 담요는 물론이고……"
1008503-47 = "작업 중 몸속까지 따듯하게 덥혀줄 수 있는 수프 캔과 컵라면도 챙겨왔지."
1008503-48 = "다시 말해 오늘의 베리타스 해커 휴게실은—"
1008503-50 = "글램핑장이나 다름없어!"
1008503-54 = "[ns] \"글램핑장……?\""
1008503-55 = "응. 전에 모모톡으로 한번 말했었잖아?"
1008503-56 = "캠핑 중에는 텐트 설치나 장비 운반과 같은 귀찮은 과정을 생략하고 캠핑의 감성만 즐기는 글램핑이라는 형태도 있다고."
1008503-57 = "비록 부실 안에서 머무르고 있지만 엄연히 캠핑 도구를 사용하고 있으니, 이것도 일종의 글램핑이라고 할 수 있겠지."
1008503-58 = "이런 식의 글램핑에 익숙해지면, 나중에 치히로 선배를 따라 야외에 캠핑을 나갔을 때도 쉽게 적응할 수 있을 거야."
1008503-59 = "물론 언뜻 보기에는 평소와 거의 달라 보이지 않겠지만……"
1008503-60 = "이것도 결국은 야외 활동을 대비한 사전 준비라고 할 수 있으니까!"
1008503-61 = "[s] \"뭔가 결론이 조금 이상하지만……\""
1008503-62 = "여하튼 오늘은 모처럼 캠핑 장비를 빌려왔으니 캠핑을 하는 것처럼 느긋하게 하루를 보내 볼까 싶어."
1008503-66 = "일단은 요괴 MAX부터 한 캔……"
1008503-71 = "하아…… 역시 캠핑 중에 마시는 에너지 드링크라서 그런지 더 맛있게 느껴지는 것 같네."
1008503-72 = "그럼 지금부터 서버 세팅을 시작해 볼까……?"
1008503-76 = "(……그리고 한동안 하레가 도롱이처럼 담요에 들어간 채 작업하는 모습을 지켜보았다.)"
1008503-79 = "으음, 이 부분의 문제 해결이 까다롭네."
1008503-80 = "접속이 몰렸을 때 노드의 자동 용량을 증가시키는 설정이 정상적으로 작동하려면……"
1008503-84 = "………. (꿀꺽)"
1008503-85 = "[s9] \"저기, 하레……\"\n[s10] \"책상 위에 쌓인 음료 캔 말이야.\""
1008503-90 = "……응? 음료 캔……?"
1008503-91 = "어라? 어느새 이렇게 마셔버린 거지?!"
1008503-92 = "[s11] \"사사건건 잔소리를 하고 싶지는 않지만……\"\n[s12] \"책상 위에 쌓인 쓰레기는 바로 버리는 게 어때?\""
1008503-95 = "음…… 그렇네."
1008503-96 = "하지만 모처럼 작업에 열중하고 있는데, 쓰레기를 버리기 위해 밖에 다녀오는 건 조금……"
1008503-100 = "……아, 그래. 지금은 캠핑 중이었잖아?"
1008503-101 = "캠핑 중에는 쓰레기가 발생하더라도 한데 모아두는 게 당연하니까……"
1008503-102 = "캔은 나중에 몰아서 한 번에 치울 테니까, 오늘만큼은 봐주면 안 될까……?"
1008503-103 = "[s] \"그렇게 말한다면 어쩔 수 없지만……\""
1008503-104 = "후후, 이해해 줘서 고마워."
1008503-105 = "그럼 이어서 다음 작업을……"
1008503-111 = "(하지만 그 이후로도 하레의 나태한 캠핑은 계속되어……)"
1008503-115 = "후후, 침낭 안에 반쯤 누운 상태로 먹는 컵라면의 맛도 각별하네."
1008503-116 = "마치 침대에 누워서 라면을 먹는 것 같아서…… 배덕감이 느껴질 정도야."
1008503-122 = "하아암……"
1008503-123 = "그렇게 에너지 드링크를 많이 마셨는데, 이상하게 잠이 오네……"
1008503-124 = "따듯한 침낭에 둘둘 싸인 채로 차가운 바람을 맞고 있으니 몸이 나른해져서 그런가. 자꾸 눈이 감겨와……"
1008503-128 = "으읏…… 이제야 겨우 정리된 것 같네."
1008503-129 = "이제 남은 일은 데이터 분석이 완료되기를 기다리는 것뿐이니……"
1008503-130 = "그동안 낮잠이라도 잠깐 자 둘까."
1008503-131 = "선생님, 대신 불 좀 꺼줄래?"
1008503-132 = "침낭 안이 따끈따끈해서 도저히 이 밖으로 나가고 싶지 않아……"
1008503-140 = "서, 선생님……? 갑자기 왜 그래? 그런 무서운 표정으로……"
1008503-145 = "[ns] \"……기상!\""
1008503-149 = "으, 으응……?"
1008503-150 = "[s13] \"계속 두고 보려 했지만…… 이대로는 안 되겠어.\"\n[s14] \"캠핑을 핑계로 평소보다 더 나태한 하루를 보내고 있잖아.\""
1008503-153 = "[ns] \"지금부터 스트레칭을 겸해 운동을 시작하겠습니다!\""
1008503-154 = "하지만…… 오늘의 캠핑은 글램핑인걸? 무리하게 신체를 움직일 필요는—"
1008503-155 = "몸을 움직이면 캠핑 장비를 걸치지 않아도 춥지 않을 거라고?"
1008503-156 = "그야 당연한 이야기지만…… 굳이 에너지를 낭비하고 싶지는 않은데……"
1008503-157 = "연구 결과에 따르면 프로그래밍과 같은 지적 활동도 칼로리를 크게 소모한다고 하니까—"
1008503-162 = "잠깐만, 선생님…… 알겠으니까! 억지로 끌고 가지 말아 줘……!"
1008503-168 = "(이후, 하레를 데리고 몸에 열이 날 때까지 가볍게 학원 근처를 조깅했다……)"
