[translation]
42180-1 = "제18화;엘리트와 엘리트"
42180-4 = "이 거렁뱅이들이…… 거처도 없이 떠돌던 녀석들을 거둬 먹여주고 입혀주었더니 그 은혜도 모르고 배신을 해?!"
42180-6 = "배신이라니요? 애초에 일하지 않겠다는 사람을 강제로 끌고 가 취업시킨 건 당신들 아닙니까!"
42180-7 = "저는 이번 일을 계기로 결심했습니다. 앞으로도 영원히 일하지 않을 것을……"
42180-8 = "……세상의 모든 소유에 맞서 싸울 것을!"
42180-9 = "덤벼라, 이 악독한 악당아!"
42180-10 = "너 같은 깡마른 깡통은 이 데카르트 님의 적수가 되지 못할 테니까!"
42180-12 = "이 배은망덕한 배신자가…… 누구더러 깡통이라는 거야!!"
42180-23 = "크, 크윽……"
42180-24 = "도, 동지들…… 도와주십시오……!"
42180-28 = "악! 이건 정말 아프다!"
42180-29 = "역시 카이저 코퍼레이션의 훈련된 병사들을 상대로 싸우는 건 무리야……!"
42180-30 = "도, 도망쳐……!"
42180-35 = "이 겁쟁이들이…… 빨리 돌아오지 못해?"
42180-37 = "……<소확행>의 여러분께서 도와주신 덕분에 수적 열세는 면할 수 있었지만, 역시 돌파력이 조금 부족하네요."
42180-38 = "게다가 카이저 시큐리티의 지원이 언제 도착할지 모르는 상황에서, 종심을 재빠르게 돌파하지 못한다면 역으로 포위될 가능성도 있으니……"
42180-39 = "위험을 무릅쓰더라도, 지금은 제가 직접 공세에 나서는 수밖에 없겠어요."
42180-44 = "어라? 저 사람은……"
42180-51 = "……시민들이 사용하는 공공시설 앞에서 이게 도대체 무슨 난리법석이지?"
42180-52 = "이 난장판에 대해서는 설명을 좀 들어야겠는데— 카이저 시큐리티."
42180-53 = "아, 공안국장! 마침 잘 왔군. 이 머저리들 좀 어떻게 해 봐!"
42180-54 = "이런 사회 부적응자들을 처리하는 게 너희들 일이잖아?"
42180-59 = "히익…… 그, 그때의 '미친개'……?"
42180-74 = "지금 이게 뭐 하는 짓이야……?!"
42180-75 = "발키리 경찰학교의 공안국장이, 감히 방위실장의 직권을 받은 우리에게 총을 발포하다니!"
42180-77 = "……공안국장?"
42180-78 = "너희들도 알고 있을 텐데. 공안국은 징계로 인해 현재 영업 중지다."
42180-79 = "그럼 뭐야. 아무 권한도 없으면서 괜한 시비나 걸고 있었던 거야?"
42180-80 = "이곳의 치안 업무는 우리가 책임지고 있으니 발키리의 참새들은 썩 꺼져!"
42180-81 = "아니. 굳이 공안국이 아니더라도 D.U.에서 치안 관리를 할 수 있는 조직은 남아있지."
42180-82 = "발키리 경찰학교 집무규칙 제32조 1항. 발키리 경찰학교 '생활안전국' 학생은 지하철 및 대중교통 이용을 방해하는 시민을 일시 구속할 수 있다."
42180-89 = "……징계 중 사회봉사 업무의 일환으로 생활안전국 후배들 일이나 도울까 해서."
42180-95 = "생활안전국이다! 모두 무기를 버리고 엎드려!"
42180-100 = "이 머저리들이…… 사회를 좀먹는 쓰레기들은 저쪽이야!"
42180-101 = "우리는 규정에 따라 정당하게 공무를 수행하는 중이라고!"
42180-103 = "카이저 시큐리티라 하더라도 예외는 없습니다!"
42180-104 = "역 앞에서 소란을 피웠으니, 순순히 서까지 동행하도록 하시지요!"
42180-105 = "혹시라도 불응한다면 무력으로 제압할 수도 있으니까…… 귀찮은 일이 생기기 전에 순순히 따라오라고."
42180-107 = "……생활안전국이? 생활안전국 따위가, 우리를 제압한다고……?"
42180-108 = "크크큭…… 크하하하!"
42180-109 = "뭐, 뭐가 그렇게 우스운 건가요?"
42180-110 = "그야 당연히 우스울 수밖에. 생활안전국이 우리를 무력으로 제압한다고?"
42180-111 = "지금은 이름을 바꿔 활동하고 있지만, 우리는 카이저 PMC에서도 가장 우수한 SOF 출신의 대원으로만 구성된 엘리트들이다."
42180-112 = "그런데 발키리 경찰학교에서도 가장 형편없는 무장을 지닌 생활안전국의 오합지졸들이 우리를 상대하겠다니. 농담도 유분수지!"
42180-113 = "아무리 유능한 지휘관이 붙더라도 잡졸을 지휘해서 엘리트를 상대로 승리를 따낼 수는 없다."
42180-115 = "엘리트와 그렇지 못한 자들 사이에는 좁힐 수 없는 간극이 존재하니까."
42180-117 = "오합지졸……? 뭔가 착각한 모양인데."
42180-118 = "생활안전국은 발키리 경찰학교의 최우수 엘리트만이 들어갈 수 있는 특수한 조직이다."
42180-119 = "……공안국의 국장인 나조차도 생활안전국을 지원했다가 떨어진 적이 있거든."
42180-121 = "뭐? 그게 무슨……"
42180-122 = "저기, 혹시 그거 알고 있어?"
42180-123 = "이곳 코우사기 역은 보수 공사를 한 지 벌써 10년이 넘게 지나서, 역 간판을 지지하고 있는 지지대가 꽤 삭았거든."
42180-124 = "그 때문인지 바람이 세게 불면 간판이 흔들려서 걱정된다는 민원이 최근 몇 달 사이에 계속 생활안전국에 들어왔어."
42180-125 = "그래서 안전상의 이유로 이번 달 말에 간판을 새것으로 교체하기로 했는데—"
42180-126 = "네 녀석은 또 무슨 소리를 하는 거야!"
42180-127 = "……참을성이 부족하네."
42180-128 = "뭐, 요약하자면…… 가벼운 총격만으로도 네 머리 위에 있는 간판이 떨어질 수도 있다는 소리지."
42180-133 = "네 녀석, 설마—"
42180-135 = "머리 조심!"
42180-145 = "이 지긋지긋한 참새 녀석들, 가만두지 않겠어!"
42180-147 = "키리노, 연막탄 투척!"
42180-148 = "맡겨주세요!"
42180-153 = "젠장, 시야가……"
42180-154 = "입구를 막아! 연막을 틈타 녀석들이 역 안으로 들어가지 못하도록 해!"
42180-159 = "시민을 위한답시고 핑계는 번드르르하게 댄 주제에, 문제가 터지자마자 역사 안으로 달려가는 걸 보면 뭔가 대단한 걸 숨겨놓은 모양이로군."
42180-160 = "……하지만 장소를 잘못 골랐어. 시민들이 매일 이용하는 역사야말로 생활안전국에게는 홈그라운드나 마찬가지거든."
42180-164 = "키리노, 후부키."
42180-165 = "다른 생활안전국 학생들과 함께 역사를 어지럽히는 '불량 승객'들을 단속하도록."
42180-166 = "나는 이곳에서 불청객이 더 늘어나지 않도록 입구를 단속하고 있겠다."
42180-168 = "네!"
42180-169 = "그보다 약속한 대로 마스터 도넛의 한정 크롤러 도넛, 꼭 사주는 거다?"
42180-171 = "그깟 도넛쯤이야. 얼마든지 사주지."
42180-172 = "……그리고 SRT."
42180-173 = "이후의 일을 부탁한다."
42180-174 = "……칸나 국장님. 이번에도 다시 명령을 어기면 당신은—"
42180-175 = "—귀관이 부담을 가질 필요는 없다."
42180-176 = "전에 말했잖아? 책임과 결정은 스스로 내리는 것이라고."
42180-177 = "내가 믿는 정의를 위해서라면, 이보다 더한 결정도 감내할 수 있어."
42180-178 = "국장님……"
42180-183 = "그럼, 선생님. 이 바보들을 잘 부탁드리겠습니다."
42180-184 = "[s] \"맡겨만 줘!\""
42180-185 = "자, 그럼."
42180-191 = "'미친개'의 이름을, 다들 한 번쯤은 들어봤겠지."
