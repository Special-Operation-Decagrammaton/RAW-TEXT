[translation]
10053100-1 = "後日談;烤肉與悠閒"
10053100-3 = "嗯～烤肉的味道真香～"
10053100-4 = "大家拿盤子過來，我來幫你們分。"
10053100-9 = "……"
10053100-10 = "怎麼了？叫你拿盤子啊。"
10053100-11 = "不是……那個……雖然很感謝啦……"
10053100-12 = "但想說我們可以在這裡蹭吃嗎……"
10053100-13 = "你在說什麼？"
10053100-14 = "難道要餓著嗎？大家都是為了吃飯而活著的吧？"
10053100-15 = "不是，就是有點……"
10053100-16 = "那就閉上嘴快吃。"
10053100-17 = "閉上嘴怎麼吃……？"
10053100-18 = "好像也是……？"
10053100-21 = "……"
10053100-22 = "怎麼了？"
10053100-23 = "木乃香你……對別人那麼好，總有一天會被人狠狠背叛的。"
10053100-24 = "哼～？"
10053100-25 = "突，突然幹什麼，噁心死了！"
10053100-26 = "這麼擔心姐姐啊～？"
10053100-27 = "嚇啊──！我什麼時候那樣說了！"
10053100-28 = "但也不是說……不擔心！"
10053100-29 = "竟然還會為我擔心啊～"
10053100-33 = "玲奈……姐姐教你兩個人生智慧。"
10053100-34 = "第一個是……不管什麼事總會有辦法。"
10053100-35 = "另一個是世上沒有力量解決不了的事，哈哈哈哈！"
10053100-41 = "唉……也是，擔心徒手能砸壞巴士的人幹嘛……"
10053100-43 = "啊～好幸福～"
10053100-44 = "我有多久沒吃到肉了啊……"
10053100-49 = "……"
10053100-50 = "咳……！"
10053100-51 = "差點在部員面前失去威嚴，好險好險……"
10053100-52 = "嗯？部長？怎麼突然吃著吃著就不吃了？"
10053100-53 = "沒，沒有啊……那個……肉吃太多有點膩了，啊哈哈……"
10053100-54 = "不愧是部長！還是很厲害！"
10053100-55 = "那，那是，當，當然的！"
10053100-56 = "話說回來……翼一直待在我旁邊沒關係嗎？"
10053100-57 = "啊，抱歉，因為好久不見就太高興了……"
10053100-58 = "打擾到你了嗎……"
10053100-59 = "不，不是啦，不是那個意思！我只是問問而已！"
10053100-60 = "那，那就……再待一會吧。"
10053100-61 = "呵呵呵。"
10053100-62 = "這樣要我怎麼吃啊……"
10053100-65 = "喂，騙子。"
10053100-66 = "別那樣叫我！"
10053100-67 = "就算是騙子對部員也挺好的啊？從沒見過所長這麼追隨別人。"
10053100-68 = "就說了我不是騙子……"
10053100-70 = "木乃香君。"
10053100-71 = "認真勸告你，最好不要太相信媒體。"
10053100-73 = "……咦？"
10053100-75 = "奇普托斯的所有主流媒體都受聯邦學生會控制，#n而且聯邦學生會和研討會關係密切，這在圈子裡是眾所周知的事實。"
10053100-76 = "我們部長只是被誣陷了而已。"
10053100-77 = "因為部長的才能太出眾，所以感到威脅的研討會「大姐頭」就親自出手牽制了。"
10053100-79 = "啊啊……是那種設定？"
10053100-80 = "什麼設定！？我被大姐頭親自驅逐是明明白白的事實！"
10053100-81 = "OK，OK～"
10053100-82 = "你完全不相信吧！？"
10053100-86 = "比起這個，說別的事。"
10053100-87 = "不管怎樣，半夜爬上2樓偷看睡覺的樣子是不是有點過度保護？"
10053100-88 = "畢竟是所長嘛，有點擔心的心情我是能理解。"
10053100-89 = "什麼意思……？"
10053100-90 = "就是拍照的那天，那時候在窗外的不是你嗎？"
10053100-91 = "我什麼時候說過那種話了？"
10053100-92 = "……？"
10053100-96 = "橋斷了的時候我在山莊前面想該怎麼辦，你們就突然打開窗戶大叫不是嗎？所以我才逃跑。"
10053100-97 = "啊，對了，我倒是想問。"
10053100-98 = "那個貼在窗戶上的人是誰？好像不在這裡。"
10053100-103 = "……？"
10053100-104 = "咦……"
10053100-106 = "咦咦咦咦！？！？！？"
