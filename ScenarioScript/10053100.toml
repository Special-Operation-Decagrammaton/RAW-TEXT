[translation]
10053100-1 = "ย้อนวันวาน;บาร์บีคิวกับพริก"
10053100-2 = ""
10053100-3 = "อืม~ กลิ่นเนื้อหอมจัง~"
10053100-4 = "ทุกคนเอาจานมาเร็ว ฉันจะคีบแบ่งให้"
10053100-5 = ""
10053100-7 = ""
10053100-8 = ""
10053100-9 = "..."
10053100-10 = "ทำไมล่ะ...? ก็บอกว่าให้เอาจานมาไง"
10053100-11 = "เปล่าหรอก... ฉะ... ฉันก็รู้สึกขอบคุณอยู่"
10053100-12 = "แต่ก็แค่คิดน่ะว่าพวกฉันมาขอกินฟรีแบบนี้ได้ด้วยเหรอ"
10053100-13 = "พูดตลกอะไรของเธอ...?"
10053100-14 = "งั้นจะอดข้าวหรือไง? คนเราต้องกินเพื่ออยู่นะ"
10053100-15 = "เปล่าหรอก ก็แค่..."
10053100-16 = "งั้นก็หุบปากแล้วก็กินๆ ซะสิ"
10053100-17 = "ถ้าหุบปาก แล้วจะกินได้ไงล่ะ...?"
10053100-18 = "นั่นสิเนอะ...?"
10053100-20 = ""
10053100-21 = "..."
10053100-22 = "แล้วเธอล่ะเป็นอะไรอีก?"
10053100-23 = "นี่ โคโนกะ เธอน่ะ... ทำตัวเป็นแม่พระแบบนี้ สักวันจะโดนแทงข้างหลังเข้าอย่างจังนะ"
10053100-24 = "หืม~?"
10053100-25 = "จะ... จู่ๆ ก็พูดอะไรของเธอเนี่ย ทำฉันขนลุกอีกแล้ว!"
10053100-26 = "เป็นห่วงพี่สาวคนนี้ขนาดนั้นเลยใช่ม้า~?"
10053100-27 = "ว้ากกก! ฉันเคยพูดแบบนั้นตอนไหนกัน!"
10053100-28 = "แต่ก็ใช่ว่า... ฉันจะไม่เป็นห่วงหรอกนะ!"
10053100-29 = "ไม่ต้องเป็นห่วงหรอกน่า~"
10053100-30 = ""
10053100-32 = ""
10053100-33 = "เรนะ พี่สาวคนนี้จะสอนข้อคิดของชีวิตให้สองข้อนะ"
10053100-34 = "ข้อแรกก็คือ ไม่ว่าจะเรื่องอะไร ถ้าถึงคราวต้องเผชิญหน้ากับมันจริงๆ เดี๋ยวทางออกมันก็มาเองแหละ"
10053100-35 = "ข้อสอง ในโลกนี้ไม่มีอะไรที่แก้ไขด้วยกำลังไม่ได้หรอก อะฮะฮ่าฮ่าฮ่า!"
10053100-36 = ""
10053100-38 = ""
10053100-40 = ""
10053100-41 = "เฮ้อ... คงไม่มีประโยชน์ที่จะเป็นห่วงคนที่ทุบรถบัสด้วยมือเปล่าหรอกเนอะ..."
10053100-42 = ""
10053100-43 = "ฮื้ม~ มีความสุขจัง~"
10053100-44 = "ไม่ได้กินเนื้อมานานแค่ไหนแล้วนะคะ..."
10053100-45 = ""
10053100-48 = ""
10053100-49 = "..."
10053100-50 = "เฮือก!"
10053100-51 = "เกือบเสียศักดิ์ศรีต่อหน้าสมาชิกชมรมแล้วค่ะ ระวังไว้สิ ระวัง..."
10053100-52 = "หืม? เป็นอะไรไปเหรอ หัวหน้า? ทำไมจู่ๆ ถึงหยุดกินล่ะ?"
10053100-53 = "มะ... ไม่มีอะไรค่ะ... ฉะ... ฉันกินเนื้อบ่อยจนเบื่อแล้วน่ะค่ะ อะฮะฮ่า..."
10053100-54 = "สมแล้วที่เป็นหัวหน้า! ยังอยู่ดีมีสุขเหมือนเดิมสินะ!"
10053100-55 = "มะ... มันก็... นะ... แน่นอนอยู่แล้วค่ะ!"
10053100-56 = "จะว่าไป... สึบาสะมาอยู่แต่กับฉันอย่างนี้ได้เหรอคะ?"
10053100-57 = "อ๊ะ ขอโทษที เราไม่ได้เจอกันนานมาก พอเจอกันฉันเลยดีใจน่ะ..."
10053100-58 = "นี่ฉันมา... รบกวนหรือเปล่านะ..."
10053100-59 = "ปะ... เปล่านะคะ ฉันไม่ได้หมายความอย่างนั้นเลยค่ะ! ฉันแค่ถามเฉยๆ ค่ะ!"
10053100-60 = "ถะ... ถ้างั้น... ฉันขออยู่ข้างๆ ต่ออีกหน่อยนะ"
10053100-61 = "ฮุฮุฮุ"
10053100-62 = "กินไม่สะดวกเลยแฮะ..."
10053100-64 = ""
10053100-65 = "นี่ มิจฉาชีพ"
10053100-66 = "อย่าเรียกกันแบบนั้นสิคะ!"
10053100-67 = "ถึงจะเป็นมิจฉาชีพ แต่ก็ดูแลสมาชิกชมรมดีเลยนะ? นี่น่าจะเป็นครั้งแรกเลยนะที่ฉันเห็นหัวหน้าตัวติด#nใครแบบใกล้ชิดขนาดนี้..."
10053100-68 = "ก็บอกว่าอย่าเรียกกันว่ามิจฉาชีพ..."
10053100-70 = "นี่ โคโนกะ"
10053100-71 = "ฉันขอเตือนอย่างจริงจังนะ อย่าไปเชื่อสื่อโซเชียลให้มากเกินไปเลย"
10053100-73 = "เอ๋...?"
10053100-75 = "สื่อกระแสหลักทั้งหมดในคิโวทอสอยู่ภายใต้การควบคุมขององค์การนักเรียน และเราก็รู้กันอยู่ว่าองค์การนักเรียนกับเซมิน่าก็มีความสัมพันธ์ใกล้ชิดกัน"
10053100-76 = "หัวหน้าของฉันน่ะ โดนใส่ร้าย"
10053100-77 = "หัวหน้าของฉันมีพรสวรรค์ยอดเยี่ยม คนที่เป็น <บิ๊กซิสเตอร์> ของเซมิน่าก็เลยคิดว่าเป็นภัยคุกคาม และลงมือมาขัดขวางด้วยตัวเอง"
10053100-79 = "อ่า... เอาเป็นพล็อตแบบนั้นเหรอ?"
10053100-80 = "พล็อตอะไรกันล่ะคะ?! เป็นความจริงแจ่มแจ้งต่างหากค่ะที่ฉันโดนบิ๊กซิสเตอร์ขับไล่ออกมาด้วยตัวเอง!"
10053100-81 = "โอเค โอเค~"
10053100-82 = "คุณไม่เชื่อเลยสักนิดใช่มั้ยคะ?!"
10053100-83 = ""
10053100-85 = ""
10053100-86 = "ฉันขอพูดถึงประเด็นอื่นดีกว่า"
10053100-87 = "ถึงจะยังงั้นก็เถอะ แต่การขึ้นมาชั้นสองตอนกลางดึกเพื่อแอบดูว่านอนหลับดีหรือเปล่า แบบนี้ไม่ถือว่าเป็นห่วงเกินเหตุไปหน่อยเหรอ?"
10053100-88 = "ถ้าจะเป็นห่วงหัวหน้าทีมสำรวจของเรา ฉันก็เข้าใจได้หรอกนะ แต่ก็..."
10053100-89 = "หมายความว่ายังไงคะ...?"
10053100-90 = "ก็วันที่ถ่ายรูปติดมาไง ตอนนั้นคนที่อยู่นอกหน้าต่างคือเธอไม่ใช่เหรอ?"
10053100-91 = "ฉันเคยพูดแบบนั้นเมื่อไรกันคะ?"
10053100-92 = "...?"
10053100-93 = ""
10053100-95 = ""
10053100-96 = "พอสะพานขาด ฉันก็กลับมาหน้าบ้านพักแล้วคิดกังวลว่าจะทำยังไงดี แล้วจู่ๆ ก็มีคนเปิดหน้าต่าง#nแล้วตะโกนออกมา ฉันก็เลยหนีไป ก็แค่นั้นเองค่ะ?"
10053100-97 = "นั่นสินะคะ ฉันต่างหากที่อยากถาม"
10053100-98 = "ใครคือผู้หญิงที่มายืนอยู่ที่หน้าต่างเหรอคะ? เหมือนจะไม่ได้เป็นหนึ่งในพวกคุณเลยนะ?"
