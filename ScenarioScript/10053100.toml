[translation]
10053100-1 = "후일담;바비큐 앤 칠리"
10053100-3 = "음~ 고기 냄새 좋고~"
10053100-4 = "다들 접시 들고 와. 나눠줄 테니까."
10053100-9 = "……."
10053100-10 = "……? 뭐야? 접시 달라니까."
10053100-11 = "아니…… 그, 고맙기는 한데."
10053100-12 = "우리가 여기 껴서 얻어먹고 있어도 되나 싶어서 말이지."
10053100-13 = "……? 뭔 웃기는 짬뽕이래?"
10053100-14 = "그럼 굶기랴? 다 먹고 살자고 하는 짓인데."
10053100-15 = "아니, 그건 조금……."
10053100-16 = "그러면 입 닫고 먹어."
10053100-17 = "……? 입 닫고 어떻게 먹어?"
10053100-18 = "……? 그러네?"
10053100-21 = "……."
10053100-22 = "너는 또 왜?"
10053100-23 = "아니, 코노카 너…… 그렇게 사람 좋게 굴다가, 언제 한 번 뒤통수 세게 맞는다?"
10053100-24 = "흐응~?"
10053100-25 = "가, 갑자기 뭐야, 또 징그럽게!"
10053100-26 = "그렇게나 이 누님이 걱정된다 이거지~?"
10053100-27 = "샤아악! 내가 언제 그렇게 말했어!"
10053100-28 = "걱정되지…… 않는다는 건 아니긴 한데!"
10053100-29 = "걱정도 아주 사서 해라, 사서~"
10053100-33 = "……레나야, 이 누님께서 삶의 지혜를 두 개 알려주마."
10053100-34 = "하나는, 무슨 일이든 닥치고 보면 다 방법이 있다는 거고."
10053100-35 = "또 하나는, 세상에 힘으로 안 되는 건 없다는 거야. 크하하하핫!"
10053100-41 = "에휴…… 하긴, 맨손으로 버스도 부수는 사람을 걱정해 봐야……."
10053100-43 = "하아~ 행복해라~"
10053100-44 = "이게 얼마 만에 먹어보는 고기인가요……."
10053100-49 = "……."
10053100-50 = "핫!"
10053100-51 = "부원의 앞에서 위엄을 잃을 뻔했네요. 조심, 또 조심……."
10053100-52 = "응? 왜 그래, 부장? 갑자기 먹다가 말고?"
10053100-53 = "아, 아니요……. 그, 고기는 너무 많이 먹어서 물렸다고 할까, 아하하……."
10053100-54 = "역시 부장이네! 여전히 잘 나가는구나!"
10053100-55 = "그, 그야, 다, 당연하죠!"
10053100-56 = "그나저나…… 츠바사는 계속 제 옆에만 붙어 있어도 괜찮나요?"
10053100-57 = "앗, 미안. 오랜만에 만난 게 너무 기뻐서……."
10053100-58 = "방해, 됐으려나……."
10053100-59 = "아, 아뇨, 싫다는 뜻은 아니었어요! 그냥 물어본 거니까요!"
10053100-60 = "그, 그러면…… 조금만 더 옆에 있을게."
10053100-61 = "후후후."
10053100-62 = "……먹기 불편해……."
10053100-65 = "어이, 사기꾼."
10053100-66 = "그렇게 부르지 말라고요!"
10053100-67 = "사기꾼이라도, 부원들한테는 꽤 잘해줬나 보네? 소장이 그렇게나 따르는 사람은 처음 볼지도."
10053100-68 = "그러니까, 사기꾼이……."
10053100-70 = "저기, 코노카 군."
10053100-71 = "진지하게 충고하는데, 언론을 너무 믿지 않는 게 좋아."
10053100-73 = "……엥?"
10053100-75 = "키보토스의 모든 주류 언론은 총학생회의 통제를 받고 있어. 그리고 총학생회와 세미나가 밀착 관계라는 건, 이 바닥에서 유명한 사실이지."
10053100-76 = "우리 부장은, 모함을 썼을 뿐이야."
10053100-77 = "부장의 재능이 너무 뛰어난 나머지, 위협을 느낀 세미나의 <빅 시스터>가 직접 손을 써서 견제한 거지."
10053100-79 = "……. 아아, 그런 설정?"
10053100-80 = "설정이라니요?! 제가 빅 시스터에게 직접 축출된 것은 명명백백한 사실이라고요!"
10053100-81 = "오케이, 오케이~"
10053100-82 = "당신, 전혀 안 믿고 있죠?!"
10053100-86 = "그보다, 다른 이야기인데."
10053100-87 = "아무리 그래도, 한밤중에 2층까지 올라와서 자는 모습을 엿보는 건, 좀 과보호 아니야?"
10053100-88 = "뭐, 소장은, 약간 걱정되는 맘은 이해 가긴 하는데."
10053100-89 = "……그건 또 무슨 소리래요?"
10053100-90 = "아니, 그날 사진 찍힌 날 있잖아. 그때 창밖에 있던 거, 너라며."
10053100-91 = "제가 언제 그런 말을 했나요?"
10053100-92 = "……?"
10053100-96 = "다리가 끊겨서 산장 앞에서 어떻게 할지 고민하고 있었는데, 갑자기 창문을 열고 소리 질렀잖아요? 그래서 도망쳤을 뿐인데요?"
10053100-97 = "아, 그래요. 저야말로 물어보고 싶었어요."
10053100-98 = "당신들, 창문에 붙어 있던 여자, 누구였나요? 여기는 없는 거 같은데."
10053100-104 = "어……."
10053100-106 = "어어어어?!?!?!"
