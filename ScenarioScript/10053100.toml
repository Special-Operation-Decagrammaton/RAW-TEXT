[translation]
10053100-1 = "後日談;烤肉與悠閒"
10053100-2 = ""
10053100-3 = "嗯～烤肉的味道真香～"
10053100-4 = "大家拿盤子過來，我幫你們分吧。"
10053100-5 = ""
10053100-7 = ""
10053100-8 = ""
10053100-9 = "……"
10053100-10 = "怎麼了？叫你拿盤子啊。"
10053100-11 = "那個……雖然很感謝你們……"
10053100-12 = "可是我們就這樣混進來白吃白喝……真的沒問題嗎……"
10053100-13 = "你在說什麼傻話？"
10053100-14 = "總不能讓你們餓肚子吧？大家不都是為了吃飯而活著的嗎？"
10053100-15 = "沒有啦，就是覺得有點……"
10053100-16 = "不用想那些有的沒的，閉上嘴趕快吃吧。"
10053100-17 = "閉上嘴就不能吃了吧……？"
10053100-18 = "好像也是……？"
10053100-20 = ""
10053100-21 = "……"
10053100-22 = "怎麼了？"
10053100-23 = "木乃香你啊……如果老是對別人那麼好的話，總有一天會被狠狠背叛的哦？"
10053100-24 = "哼嗯～？"
10053100-25 = "為，為什麼要突然靠過來啦！很噁心耶！"
10053100-26 = "原來你這麼擔心姐姐我啊～？"
10053100-27 = "嚇啊──！我什麼時候說過那種話了！"
10053100-28 = "雖然……也不是說完全不擔心啦！"
10053100-29 = "哎唷～不需要為了這種事情擔心啦～"
10053100-30 = ""
10053100-32 = ""
10053100-33 = "玲奈……姐姐我來傳授你兩個人生智慧吧。"
10053100-34 = "第一，任何事情只要硬著頭皮做下去，總有辦法能夠解決。"
10053100-35 = "第二，世界上沒有力量解決不了的事！啊哈哈！"
10053100-36 = ""
10053100-38 = ""
10053100-40 = ""
10053100-41 = "唉……也是啦，我何必擔心一個能徒手砸爛巴士的人呢……"
10053100-42 = ""
10053100-43 = "哈啊～真幸福～"
10053100-44 = "我有多久沒吃到肉了啊……"
10053100-45 = ""
10053100-48 = ""
10053100-49 = "……"
10053100-50 = "咳……！"
10053100-51 = "差點就在部員面前失去威嚴了，好險好險……"
10053100-52 = "嗯？部長你怎麼了嗎？#n怎麼吃到一半突然停下來？"
10053100-53 = "沒，沒有啦……肉吃太多稍微有點膩了，啊哈哈……"
10053100-54 = "不愧是部長！看來你還是一樣過得很好呢！"
10053100-55 = "那，那那，那當然囉！"
10053100-56 = "話說回來……翼一直待在我旁邊沒關係嗎？"
10053100-57 = "啊，抱歉。因為好久沒見到你的關係，一時太高興了……"
10053100-58 = "打擾到你了嗎……"
10053100-59 = "沒，沒有啦，我不是那個意思！只是順口問問而已！"
10053100-60 = "那，那就……再待一會吧。"
10053100-61 = "呵呵呵。"
10053100-62 = "這樣要我怎麼吃啊……"
10053100-64 = ""
10053100-65 = "喂，騙子。"
10053100-66 = "就跟你說不要那樣叫我了！"
10053100-67 = "雖然是個騙子，對待部員倒是挺不錯的嘛？#n我還是第一次看見所長這麼親近別人呢。"
10053100-68 = "就說了我不是騙子……"
10053100-70 = "那個……木乃香君。"
10053100-71 = "這是我發自內心的忠告……勸你還是別太相信媒體比較好。"
10053100-73 = "……咦？"
10053100-75 = "奇普托斯的所有主流媒體，都在聯邦學生會的控制之下。#n而聯邦學生會和研討會的密切關係，在業界裡也是眾所周知的事實。"
10053100-76 = "我們部長只是受人誣陷而已。"
10053100-77 = "因為部長的才能太過出眾，感受到威脅的研討會「大姐頭」才會親自出手進行打壓。"
10053100-79 = "啊啊……是那種設定？"
10053100-80 = "什麼設定！？我被大姐頭親自驅逐可是千真萬確的事實耶！"
10053100-81 = "OK，OK～"
10053100-82 = "你完全不相信吧！？"
10053100-83 = ""
10053100-85 = ""
10053100-86 = "先不說這個了，我們換個話題吧。"
10053100-87 = "不管有什麼原因……半夜爬到2樓確認別人睡覺的樣子，未免有點過度保護了吧？"
10053100-88 = "雖然你會擔心所長的心情，我也多少能夠理解就是了。"
10053100-89 = "……這是什麼意思？"
10053100-90 = "就是我們拍照的那天啊？當時在窗外的不就是你嗎？"
10053100-91 = "我什麼時候說過那種話了？"
10053100-92 = "……？"
10053100-93 = ""
10053100-95 = ""
10053100-96 = "那天因為橋斷了的關係，我只好在山莊前思考該怎麼辦……#n結果你們突然打開窗戶大吼大叫，所以我才會逃跑啊？"
10053100-97 = "聽你這麼一說，我反而想問你們呢。"
10053100-98 = "那時候貼在窗戶上的人是誰啊？好像不在這裡耶。"
10053100-99 = ""
10053100-101 = ""
10053100-102 = ""
10053100-103 = "……？"
10053100-104 = "咦……"
10053100-106 = "咦咦咦咦！？！？！？"
