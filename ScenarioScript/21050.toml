[translation]
21050-1 = "제5화;나는 아리스입니다."
21050-2 = "밀레니엄 게임개발부"
21050-4 = "으음. 정말 걱정이야."
21050-5 = "이 애를 우리 부원으로 위장하는 거…… 괘, 괜찮을까?"
21050-6 = "괜찮? 의미 확인, 상태가 나쁘지 않고 문제가 발생하지 않는 상태, 긍정합니다."
21050-7 = "……부정하고 싶어! 이 말투는 정말 의심받기 딱 좋아!"
21050-8 = "그만 두자니까! 이건 불가능해!"
21050-10 = "그럴 수 없어. 어떻게든, 우리 게임개발부를 되살려야 해."
21050-11 = "그렇지 않으면…… 기숙사로 돌아가길 거부하는 유즈는 갈 곳이 없어진단 말야."
21050-12 = "……."
21050-13 = "그건…… 그래……."
21050-16 = "복장은 대충 되었으니…… 남은 건 무기랑 학생증인가."
21050-17 = "학생 등록과 학생증은 내가 해결할게."
21050-18 = "미도리 너는 유즈와 함께 아리스에게…… '대화'를 가르쳐줘."
21050-19 = "대, 대화?"
21050-20 = "지금 상태로는 네 말대로, 제대로 된 학생처럼 보이지 않을 테니까."
21050-21 = "가뜩이나 '친구도 없는 너희들이 부원 모집에 성공할 리가 없잖아' 말하는……"
21050-22 = "유우카가 정말로 게임개발부냐고 물었을 때……."
21050-25 = "\"긍정, 당신의 질문, 아리스의 대답으로 대체되었다. 나는 게임개발부.\""
21050-26 = "……라고 말하면 엄청나게 의심할 거야."
21050-27 = "아니…… 그야 그렇겠지만……"
21050-28 = "하아……."
21050-29 = "할 수 없지. 한 번 해볼게."
21050-30 = "좋아! 그럼 맡긴다!"
21050-33 = "자, 잠깐만!"
21050-34 = "으음……."
21050-36 = "???"
21050-37 = "어, 그러니까…… 아리스…… 쨩?"
21050-38 = "긍정. 본기, 아리스를 지칭합니다."
21050-39 = "대화라…… 나, 나는 대화라는 걸 어떻게 배웠더라. TV나 주변의 말을 따라 했던 것 같은데."
21050-40 = "……으음. 아동용 교육 프로그램 같은 게 인터넷에 있으려나……."
21050-43 = "(두리번두리번)"
21050-44 = "?"
21050-45 = "질문, 해당 사물의 정체, 확인 바람."
21050-46 = "응?"
21050-47 = "이, 이건?!"
21050-51 = "봤구나. 부끄럽네. 여기 올라가 있는 게임이, 바로 우리 게임이야. 아주 혹평을 받았지."
21050-52 = "아 그래!"
21050-53 = "저기, 올해의 쿠소게 1위의 게임이라 부끄럽긴 하지만……"
21050-54 = "아리스 쨩, 우리 게임…… 한 번 해보지 않을래?"
21050-55 = "분명 '대화'로 진행되니 게임을 해보는 것도, 공부가 될거야."
21050-56 = "……?"
21050-57 = "의도, 파악, 불가."
21050-58 = "하지만…… (끄덕)"
21050-59 = "저, 정말?! 조금만 기다려 금방 세팅할게!"
21050-62 = "자…… 준비 끝!"
21050-63 = "……"
21050-66 = "아리스, 게임을 시작합니다."
21050-68 = "우리 게임은 제목 그대로, 동화적 색채가 풍성한 정통 판타지 RPG 게임이야."
21050-69 = "[56cd7b]< 코스모스 세기 2354년, 인류는 업화의 불길에 휩싸였다. >"
21050-71 = "……?"
21050-72 = "어, 그러니까…… 다소 퓨전적인 요소는 있을 수 있어. 트렌드잖아? 지나치게 정석에 고집하면 진부해질 수 있으니까."
21050-73 = "……"
21050-74 = "버튼…… 입력……."
21050-75 = "[56cd7b]< 튜토리얼을 시작합니다. >"
21050-77 = "[56cd7b]< 먼저 B 키를 눌러, 눈앞의 무기를 장착해보세요. >"
21050-79 = "B 키…… 입력……."
21050-82 = "(퍼어어어엉!!)"
21050-83 = "???"
21050-84 = "[FF6666]< GAME OVER >"
21050-86 = "?!"
21050-87 = "아하하하!"
21050-89 = "예측되는 전개만큼 재미없는 것도 없지! 원래 여기서는 A 버튼을 눌렀어야 했어!"
21050-90 = "언니……? 학생증 구하러 간다고 하지 않았어?"
21050-91 = "아, 너무 늦어서 아무도 없더라고. 내일 다시 다녀올게."
21050-92 = "으음. 그건 그렇고, 지금 다시 봐도 이 장면은 좀 심한 것 같아."
21050-95 = "……"
21050-96 = "다, 다시……"
21050-97 = "재개, 텍스트로 설명 불가능한 감정 발생."
21050-98 = "오오! 나 그거 알아! 분명 '흥미'나 '기대'일 거야!"
21050-99 = "아무리 생각해도 그 감정은 '분노'일 것 같은데……."
21050-101 = "[56cd7b]< 무기 장착에 성공했습니다. >"
21050-103 = "……칼을…… 들었……"
21050-104 = "헤에. 생각보다 금방 적응하네? 이대로 튜토리얼을 진행하면 RPG의 꽃인……"
21050-105 = "[FF6666]< 전투 발생! 전투 발생! >"
21050-107 = "?!"
21050-108 = "[56cd7b]< 야생의 푸니젤리가 나타났다! >"
21050-110 = "긴장, 고조, 흥미."
21050-111 = "A버튼을 연타해! 이번엔 거짓말이 아니야!"
21050-112 = "A버튼……< 비검 츠바메가에시, 한 번에 적을 2회 공격한다. >"
21050-113 = "……간다. 푸니젤리……"
21050-114 = "비검! 츠바메……!!"
21050-115 = "[56cd7b]< 탕!! >"
21050-117 = "[56cd7b]< 명중, 당신의 캐릭터가 즉사했다. >"
21050-120 = "[FF6666]< GAME OVER >"
21050-122 = "??!!"
21050-123 = "[56cd7b]< 푸니젤리: 아무리 칼질을 잘해봤자…… 총 앞에선 무력하지. 훗. >"
21050-126 = "칫. 역시 푸니젤리가 '훗' 이라 말하는 건 어색한가."
21050-127 = "…… 태클을 걸어야 할 부분은 그게 아닐 것 같아."
21050-130 = "사고 정지. 전산 처리 불가."
21050-131 = "아, 아리스 쨩? 괜찮아?"
21050-132 = "……"
21050-133 = "지속, 개시."
21050-134 = "우선 총의 사거리 안쪽으로 조심스럽게 접근, 푸니젤리를 제거합니다."
21050-135 = "그래! 바로 그거야! 끝없이 도전하며 답을 찾아내는 것! 그것이 레트로 게임의 로망이지!"
21050-137 = "(2시간 후……)"
21050-138 = "……전산처리 및 의사구현에 치명적인 오류 발생."
21050-139 = "지, 진정해 아리스. 이번 페이즈만 넘어가면 대망의 클라이맥스야!"
21050-140 = "으으……! 아무리 생각해도……!"
21050-141 = "'초식남'이라는 단어가 떠오르지 않는다고 '식물인간'이라고 적은 건 문제가 있던 것 같아."
21050-142 = "\"아 미안해요. 나는 식물인간이라서 여성분에게 말 거는 게 쉽지 않네요.\" 라는 장면에서 아리스 쨩이 순간 의식을 잃었잖아!"
21050-143 = "……질문, 어째서 어머니가 히로인이고, 사실 어머니는 전생의 아내였으며,"
21050-144 = "아내는 어렸을 때 왜 헤어진 이복 친구가 타임리프해서 왔으며, #n아니 애초에 이복 친구라는 표현은 키보토스 사전 데이터에 등재되어 있지 않……"
21050-145 = "오류 발생. 오류 발생!"
21050-146 = "괘, 괜찮아 아리스 쨩? 클라이맥스까지만 버텨줘!"
21050-147 = "……리부팅."
21050-148 = "프로세스 회복."
21050-149 = "……후우."
21050-150 = "이것이, 게임……"
21050-153 = "재개합니다."
21050-155 = "(1시간 후……)"
21050-156 = "\"죽…… 여…… 줘……\""
21050-158 = "굉장해 아리스! 아무리 개발자가 두 명이나 붙었다지만 세 시간 만에 트루엔딩이라니! 엄청난 속도야!"
21050-159 = "그보다……"
21050-160 = "어째 게임을 하면 할수록……"
21050-161 = "아리스 쨩의 말투가, 굉장히 다채로워지는 거 같지 않아?!"
21050-164 = "동의를 원한다면, 용사여. 그렇다고 말하겠다."
21050-165 = "오? 그렇네?"
21050-166 = "조, 조금 이상한 것 같기도 하지만…… 단어만 나열하는 것보다는 그럴 듯해!"
21050-167 = "그, 근데 저기……"
21050-168 = "지금 물어보긴 좀 민망하지만……"
21050-172 = "우리 게임, 어땠어? 재밌었어?!"
21050-173 = "……"
21050-174 = "설명, 불가."
21050-175 = "뭐, 뭐라고?! 왜!"
21050-176 = "……유사 표현 검색."
21050-177 = "로딩……"
21050-178 = "호, 혹시 욕설을 찾고 있는 건 아니겠지?"
21050-179 = "……재미……"
21050-180 = "분명…… 존재……"
21050-181 = "오오!"
21050-182 = "플레이를 진행하면 진행할수록……"
21050-183 = "마치…… 새로운 세계를 여행하는……"
21050-184 = "꿈을 꾸는 듯한…… 그런 기분…… 좀 더……"
21050-188 = "좀 더……"
21050-190 = "……"
21050-191 = "(주룩)"
21050-193 = "우와와와앗!"
21050-194 = "아, 아리스 쨩. 왜 우는 거야?"
21050-195 = "왜긴 왜야! 그만큼 우리 게임이 감동적이었다는 거잖아!"
21050-196 = "아, 아무리 그래도…… 우리 게임은 개그 RPG일 텐데……."
21050-197 = "고마워 아리스! 네 눈물은 어떠한 평론가의 말보다 웅변적이야! 유즈에게도 보여주고 싶었는데!"
21050-199 = "……보았어."
21050-200 = "(끼익)"
21050-201 = "어라? 캐비닛이 갑자기 열렸……?"
21050-203 = "꺄아아아악! 귀, 귀, 귀신인가!"
21050-204 = "진정해 미도리! 또 플라이 스테이션을 던지면 안 돼!"
21050-206 = "……."
21050-207 = "……?"
21050-208 = "유즈!"
21050-209 = "아무리 찾아도 안보이더니! 언제부터 캐비닛 안에 있었던 거야?"
21050-210 = "……너희가 폐허에서 돌아왔을 때부터……."
21050-211 = "한참 전이잖아! 그때부터 계속 캐비닛에 들어가 있던거야? 아 설마 아리스 쨩이 무서워서?!"
21050-212 = "말하지. 그랬으면 아리스 쨩이랑 내가 나가 있었을 텐데."
21050-213 = "아리스는 처음이겠구나. 아리스, 이 애가 바로 우리 게임개발부 부장 유즈야."
21050-216 = "(스윽)"
21050-219 = "?"
21050-220 = "그, 저기, 그러니까……"
21050-221 = "고, 고, 고……"
21050-222 = "고……?"
21050-223 = "……고마워."
21050-224 = "게임…… 재밌다고 해줘서…… 다시 하고 싶다고 말해줘서……"
21050-225 = "울어줘서…… 진심으로, 고마워."
21050-226 = "???"
21050-229 = "재미있다는, 그런 말…… 듣고 싶었어."
21050-233 = "유즈 쨩……"
21050-235 = "다음화;언어를 배우는 방법"
