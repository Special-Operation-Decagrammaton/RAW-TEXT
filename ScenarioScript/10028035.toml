[translation]
10028035-5 = "이야아아~!"
10028035-6 = "뭐야, 뭐야~! 이 사람 뭐야~!!"
10028035-7 = "선생님이야 저번에도 봤고, 어련히 그런 사람이겠거니~ 하고 있었지만……."
10028035-12 = "이쪽이야말로 생각보다 훨씬 대단한 양반이었잖아!? 이거 제대로 사과해야겠는걸!!"
10028035-13 = "이런 아가씨한테 계속해서 깜찍이니 뭐니 해댔으니, 얼마나 억울했을까? 이렇게 보통내기가 아닌데!"
10028035-14 = "……그……."
10028035-15 = "그러면서도 계속 그 단어 쓰고 계심다만……."
10028035-16 = "됐어, 됐어! 사소한 건 신경 쓰지 말자고 했잖아, 우리! 그치?"
10028035-20 = "아무튼 좋아. 그럼 이렇게까지 힘내 주는 두 사람을 위해, 나도 뭔가 주는 게 있어야겠지?"
10028035-23 = "지금 두 사람……. 아니, '우리'가 타고 있는 이 열차 칸! 원래는 열차에서 '꼬리 앞 칸'이었지."
10028035-24 = "그리고 그……. 수화물 칸이라고 했나? 그건 아마도 열차 머리 칸, 조종석과 기관차 바로 다음 칸에 있을 거야."
10028035-25 = "나름대로 귀띔이나 이런저런 정황을 모아서 머리를 좀 굴리고 있었거든. 이런 계산은 빠른 편이라서 말이지."
10028035-26 = "열차를 멈추건, 물건을 찾건. 뭘 하려고 해도……. 일단!"
10028035-27 = "다 함께 머리 칸까지 가는 수밖에 없다~ 이 말이지!"
10028035-28 = "원래 계획대로라면 내가 호송 열차 칸을 끊는 데에 실패한 시점에서, 바로 플랜 B로 돌입해……."
10028035-29 = "약속된 지점에서 폭탄으로 열차를 전복시킨 뒤, 정신없는 틈을 타 부원들과 접선해서 도망칠까 했지만……?"
10028035-30 = "[s] \"과연, 열차를 전복…….\""
10028035-34 = "[ns1] \"……지금 뭐라고 했어?\"\n[ns2] \"'멈춘다'는 게 그런 의미였어!?\""
10028035-37 = "와하핫핫핫핫!! 그런 표정으로 보지 말라고~."
10028035-38 = "걱정하지 않아도 돼, 내가 있는 한 그러진 않을 테니까! 내가 있는 한!"
10028035-39 = "이제 서로 도와주는 사이가 된 거잖아? 아무리 나라고, 설마 그런 식으로 배신하겠어?"
10028035-40 = "그쪽은 물건 잘 찾아서 가져가야 된다며? 부서지면 안 되는 거라며?"
10028035-41 = "그럼 열차가 전복되면 안 되지. 게다가 선생님도 있으니, 더더욱 그랬다간 큰일 난다고."
10028035-42 = "살~짝 손은 더 가지만, 여기서는 좀 더 '직접' 멈추는 수밖에 없다~. 이 말이야."
10028035-43 = "나처럼 노리는 사람이 많은 몸일수록……."
10028035-44 = "……'약속'과 '신용'을 중시하는 법이거든."
10028035-45 = "그래야 이 짓거리도 계속할 수 있는 거지. ……안 그래?"
10028035-46 = "그래도, 뭐. 다행이라면 다행이랄까……."
10028035-53 = "이 아가씨도……. 트리니티치고는 꽤 하는 것 같았고?"
10028035-58 = "[ns3] \"이, 일단 가방! 가방을 찾아야 하니까!\"\n[ns4] \"그, 그런 의미가 아냐! 그런 게 아니니까!!\""
10028035-61 = "아하, 아하하하……."
10028035-62 = "……음? 뭔가 또 내가 말을 잘못한 건가? 안색이 안 좋아 보이네?"
10028035-63 = "근데 안 좋은 게 맞긴 해? 계속 눈 감고 이야기를 하니 도통 알 수가 있나, 원 참. 미안해, 미안해! 와하핫핫!"
10028035-64 = "뭘 잘못했는지는 모르지만 내 사과할 테니까! 그럼 됐지? 그렇지?"
10028035-65 = "…………."
10028035-66 = "……………………."
10028035-67 = "캬~. 좋아, 좋아! 그래도 어떻게 잘 참고 있는 거 같네!!"
10028035-68 = "훌륭하구만! 앞으로도 그런 식으로 잘 부탁한다고~?"
10028035-69 = "……하.하."
10028035-70 = "그렇죠. 일단……. 가방을 찾아야 하니까요……."
10028035-71 = "하하……."
10028035-72 = "[s5] \"………….\"\n[s6] \"나중에 꼭 맛있는 거 사 줄게…….\""
10028035-75 = "자~! 시간이 없다!! 그럼 다 같이 출발해 볼까!!"
10028035-76 = "어차피 무정차 노선으로 변경된 것 때문에 열받은 승객들은 우리 말고도 한 트럭일 테니까! 다 같이 가면 못 할 것도 없다고!"
10028035-77 = "좋-아! 끝까지 간다!! 끝까지 가지 않으면, 어디까지 가건 무의미하니까!!"
10028035-78 = "꼬리 칸에서~!"
10028035-79 = "머리 칸으로~!!"
