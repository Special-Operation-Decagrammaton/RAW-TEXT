[translation]
12200-1 = "제20화;에필로그"
12200-2 = "안녕하세요, 선생님. 좋은 아침입니다!"
12200-3 = "아비도스 대책위원회의 하루는 또 바쁘게 시작됩니다."
12200-4 = "대책위원회는 선생님의 공식 인증으로 아비도스 학교의 정식 동아리로 승인받았습니다."
12200-5 = "이것 때문에 큰 곤욕을 치렀으니까, 확실하게 해 두고 싶다는 이유 때문인데요."
12200-6 = "덕분에 대책위원회는 아비도스 학생회의 역할을 떠 안게 되었어요."
12200-7 = "개인적으로는 학생회장 자리를 호시노 선배가 맡아주었으면 했지만, 본인이 극구 반대해서……."
12200-8 = "학생회장 자리는 아직 공석이에요."
12200-10 = "어서 오세요! 시바세키 라멘입니다!"
12200-12 = "시바세키 라멘은 포장마차로 다시 오픈했어요."
12200-15 = "장사가 잘 되고 있어서 세리카 쨩도 아르바이트 자리를 다시 구할 수 있게 되었구요."
12200-17 = "마스터도 의욕에 넘쳐서 일을 하고 계셔서…… 은퇴는 한참 미뤄진 것 같아요."
12200-19 = "호시노 선배의 사건은 선생님의 활약으로 해결되었지만 아비도스의 빚은 여전히 9억엔이에요……. 뭐, 이건 처음과 다를게 없지만……."
12200-20 = "카이저 론은 블랙 마켓에서의 불법 금융 거래가 들통나 총학생회의 수사를 받는다고 해요."
12200-21 = "히후미 씨가 트리니티 쪽에 손을 써 준 걸까요……."
12200-22 = "솔직히 총학생회가 어디까지 수사할 수 있을지 미심쩍지만……. 그래도 카이저 론은 예전만큼 불법을 횡행하진 못할 거라고 생각해요."
12200-23 = "PMC 이사는 그 사건 이후 불법 학생 납치극의 주요 용의자가 되어서 지명수배를 받았다고 합니다."
12200-24 = "카이저 코퍼레이션에서도 자기들과는 관계없다고 선을 긋고는 해고처리가 되었다고 하네요. 기업이란 저런 느낌인가봐요……."
12200-25 = "멋대로 올려버린 이자 또한 문제가 되어서, 아비도스는 예전보다는 훨씬 적은 이자를 내게 되었어요. 이건 좋은 일이네요."
12200-26 = "지금도 수배 중이지만, 총학생회가 업무 마비인 상태여서 쉽게 잡히진 않을 것 같아요."
12200-28 = "아비도스의 자치구 대부분은…… 여전히 카이저 코퍼레이션의 소유로 남아 있습니다."
12200-29 = "아비도스와 카이저의 거래 자체는 유효하니까요."
12200-30 = "그곳에서 무슨 일을 벌이고 있는지는…… 여전히 공개하고 있지 않고 있지만요……."
12200-32 = "아, 흥신소 분들은 또 어딘가에서 사무실을 차린 것 같은데요……."
12200-33 = "소문엔 게헨나 자치구로 돌아갔다는 얘기도 있고, 다른 곳으로 갔다는 얘기도 있어서, 자세히는 모르겠지만……."
12200-34 = "또 나쁜 짓을 저지르진 않을지 선도부가 예의 주시하고 있다고 하니…… 이래저래 고민이 많을 것 같네요."
12200-36 = "그 검은 양복이라는 사람은……."
12200-37 = "선생님과 호시노 선배에게 듣긴 했지만…… 그 어디에서도 그 사람의 정보를 찾을 수는 없었어요."
12200-38 = "모든 죄는 카이저 이사에게 넘어갔고……. 그 사람의 이름도, 정체도 모르는 상황이라……."
12200-39 = "저는 더이상은 알 수 없기에, 나머지는 <샬레>에 맡기는 것으로 하겠습니다."
12200-41 = "……자, 그러면 아비도스 대책위원회 정기 회의를 시작하겠습니다."
12200-42 = "지금까지 꽤 많은 일들이 있었지만, 빚이 사라진 것은 아니에요."
12200-43 = "하지만 매달 상환해야 하는 이자는 줄었어."
12200-44 = "그렇지~ 우리 부담은 줄어든 게 맞으니까. 그러니까 이 기회에 좀 더 낮잠을……."
12200-45 = "응! 다들 그동안 너무 바빴으니까, 이번 기회에 휴가라도 가는 게 어떨까요?"
12200-46 = "무슨 소리야!! 조금은 여유가 생겼을지도 모르겠지만, 한가하게 있을 때가 아니라고!"
12200-47 = "세리카 쨩……."
12200-48 = "대책위원회 회계 담당으로써 말하겠는데, 지금도 우리는 위기야! 위기가 아니었던 때가 없었다고!"
12200-49 = "으, 으음……."
12200-50 = "그러니까, 최신 트렌드에 맞춰서 말이지!"
12200-52 = "이것 봐! 이게 뭔지 알아?"
12200-53 = "어…… 컴퓨터 부품?"
12200-54 = "이게 GPU라는 거야! 이걸로 스캠 코인이라는 디지털 화폐를 채굴하는 거야!"
12200-55 = "디지털 화폐가 뭐냐면……. 뭐, 뭐야?! 다들? 표정이 왜 그래?!"
12200-56 = "아니, 나에게 더 좋은 방법이 있어. 자, 이걸 봐줘."
12200-57 = "기각~"
12200-58 = "……대책위원회는 이런 느낌이네요."
12200-59 = "아무 것도 달라지지 않았고, 변한 것도 없는 여전한 느낌이지만……."
12200-60 = "아하하……."
12200-64 = "앞으로도 잘 부탁드립니다. 선생님."
12200-65 = "잃은 것과 놓지 않은 것"
12200-67 = "대책위원회 편;To be Continued in Chapter 3"
