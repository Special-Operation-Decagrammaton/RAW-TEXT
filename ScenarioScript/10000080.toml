[translation]
10000080-1 = "제8화;마지막 피날레를!"
10000080-3 = "으, 으읏!"
10000080-4 = "큰소리를 친 것 치고는 약하기 짝이 없구나! 이즈나!"
10000080-5 = "[s1] \"이즈나, 괜찮아?!\"\n[s2] \"망량즈의 숫자가 너무 많아!\""
10000080-6 = "크흐흐, 네가 거리에서 날뛰어 주는 동안, 백귀야행 각지에 있던 망량즈를 죄다 불러들였다!"
10000080-7 = "크흐흐, 네가 거리에서 날뛰어 주는 동안, 백귀야행 각지에 있던 망량즈를 죄다 불러들였다!"
10000080-8 = "이런 상황에서 바보같이 날 배신하고 선생에게 붙는다고?"
10000080-9 = "지금이라면 없던 일로 해줄 수도 있다! 잘 생각해 보는 게 어떠냐, 이 어리석은 녀석!"
10000080-10 = "어리석은 게 아니에요!"
10000080-11 = "닌자는……. 꿈꾸는 이즈나는!"
10000080-12 = "이즈나의 꿈을 믿어준 사람을 위해, 주군을 위해 싸울 뿐이에요!"
10000080-14 = "그게 이즈나가 이제껏 바라온 닌자의 길, 그 자체니까!"
10000080-15 = "흥! 말만 번지르르해서는! 망량즈!"
10000080-16 = "넵! 보스!"
10000080-23 = "[ns] \"이즈나……!\""
10000080-24 = "흥, 드디어 귀찮은 방해꾼을 처리했군."
10000080-25 = "으읏, 이즈나가, 여기서 쓰러질 수는……."
10000080-26 = "이즈나가, 주군을 지켜야만 하는, 데……."
10000080-27 = "제법이잖아, 닌자 소녀! 여기서부턴 우리에게 맡겨!"
10000080-28 = "윽?! 누, 누구냐!"
10000080-31 = "선생님! 괜찮으신가요?!"
10000080-32 = "두목! 저희가 왔습니다!"
10000080-40 = "마츠리부와 수행부 녀석들까지……!"
10000080-41 = "역시, 범인은 당신이었군요! 상인회장 냥텐마루!"
10000080-42 = "냥텐마루가 아니라, 냥테 마사무네다!"
10000080-43 = "그보다 어떻게 선생이 납치된 걸 알고 구하러 온 거지?!"
10000080-44 = "납치 건은 망량즈가 조용히 처리했을 텐데……?"
10000080-45 = "그야 당연히 이거 덕분이죠!"
10000080-47 = "(처억)"
10000080-48 = "그건 핸드폰……? 설마?"
10000080-49 = "선생님께서 직접 제게 모모톡을 보내주셨어요!"
10000080-50 = "'지금 납치될 예정이니까. 늦기 전에 도와줘.' 라고 말이죠!"
10000080-52 = "……음?!"
10000080-54 = "그 말은……. 샬레의 선생은, 처음부터 이걸 노리고……!"
10000080-55 = "[s] 딴청을 피운다."
10000080-56 = "크으, 하지만 그렇다고 해도 용케 내 정체를, 그리고 이 장소를 알아냈군……!"
10000080-57 = "필경, 내가 망량즈의 고용주라는 사실에 도달하기까지 수많은 역경이 있었겠지!"
10000080-58 = "마츠리운영관리부의 부장 카와와 시즈코여!"
10000080-59 = "네? 아뇨, 딱히……"
10000080-60 = "여기 오기 전에, 축제 참관객들에게 혹시 수상한 사람을 본 적 없는지 물어봤습니다!"
10000080-61 = "그랬더니 다들 상인회장님이 망량즈랑 함께 여기 상점가 뒷골목의 폐가로 들어가는 걸 봤다고 하더라구요."
10000080-62 = "망량즈, 원래부터 엄청 눈에 띄는 애들이었고. 하아암."
10000080-63 = "……나의 사, 상인회장이라는 직책이, 오히려 계획의 맹점으로……!"
10000080-64 = "에, 에이잇! 됐다! 어차피 이것도 전부 나 냥테 마사무네의 책략이었으니까."
10000080-65 = "처음부터 '너희들이 이곳에 오리라는 것'쯤은 예측하고 있었다!"
10000080-66 = "지금 바로 너희를 위해 준비한 걸 보여주마!"
10000080-73 = "우, 우와아앗! 이게 다 뭐야?!"
10000080-74 = "오, 점점 더 많아진다~"
10000080-75 = "분위기가 심상치 않아요."
10000080-77 = "……진짜야?"
10000080-82 = "피나도! 피나도 <의리 없는 냥냥펀치>에서 이 비슷한 걸 봤습니다!"
10000080-83 = "적 조직을 끌어들여 습격하는 씬이었습니다!"
10000080-84 = "말 그대로다. 너희를 끌어들여 일망타진하기 위해, 망량즈를 준비해두고 있었다!"
10000080-85 = "자, 함정에 제 발로 기어들어온 걸 알게 된 느낌이 어떠냐!"
10000080-86 = "이대로 네놈들을 전부 쳐부숴 주마!"
10000080-87 = "우와아……. 뭐랄까. 진짜, 삼류 악당 대사란 느낌?"
10000080-88 = "과연! 부장의 평가! 신랄합니다!"
10000080-89 = "흐아암, 어쨌거나 상점가 거리의 평화를 어지럽히는 거."
10000080-90 = "멋진 레이디 지망생으로서! 우리 수행부 또한 용납할 수 없다구!"
10000080-92 = "여기서 다 같이, 함께 싸우겠어요!"
