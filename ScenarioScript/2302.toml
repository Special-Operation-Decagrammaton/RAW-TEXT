[translation]
2302-1 = "다시 한번! 마츠리부 정례회의!"
2302-4 = "(다시, 어느 휴일 오후, 백야당 구석에 마츠리운영관리부의 부원들이 모였다.)"
2302-10 = "화이트보드 준비 OK, 마카도 새것으로 마련했고. 이걸로 준비는 완벽해."
2302-14 = "그럼 피나."
2302-15 = "네엡! 그럼 부장의 명을 받들어서엇!"
2302-22 = "지금부터 마츠리운영관리부의 정례회의르으으을, 시작합니다앗!"
2302-27 = "후후, 우후후후후후후후……"
2302-28 = "예전에는 뜻하지 않은 불청객인 수행부에게 휘둘렸지만……"
2302-29 = "이번에는 달라! 다르다고!"
2302-30 = "왜냐하면, 뭐니 뭐니 해도 우리들의 숨겨둔 필살기……"
2302-32 = "우미카가 돌아왔기 때문이야!"
2302-33 = "예스! 더 히든 카드!"
2302-34 = "어서 와요, 우미카! 피나도 기다렸답니다!"
2302-36 = "네에, 네에–! 사장님!"
2302-37 = "피나도 오랜만이에요!"
2302-38 = "사장님이 아니라 부장님!"
2302-39 = "하아……"
2302-40 = "몇 번을 이야기해도 고쳐지지 않는다니까."
2302-41 = "그래서 말인데! 이제 곧 다음 달에 여우캥캥 상점가에서 축제를 개최해야 하니까 말이지."
2302-42 = "우미카는 축제 조사 원정이라는, 일종의 유학을 다녀왔으니까!"
2302-50 = "자, 우미카! 너의 멋진 아이디어를 들려줘! 우리가 힘을 합쳐, 상점가의 축제를 부흥시키는 거야!"
2302-52 = "것입니다~!"
2302-57 = "네, 네네! 의견 있습니다!"
2302-58 = "우선은요. 이번에 게헨나에서 열렸던 피 칠갑 축제에 대해, 그간 숨겨져 있던 어마어마한 정보를 조사해 왔는데 말이죠!"
2302-65 = "(피 칠갑이라면……. 게헨나에서 열린다는 토마토 축제 말이구나.)"
2302-66 = "(서로에게 토마토를 던져 맞춘 모습이 꼭 서로 피 칠갑을 한 거 같다던…… 이름부터가 엄청 게헨나스럽던……)"
2302-67 = "(그런 축제의 어마어마한 정보를 조사해왔다니, 대체……)"
2302-73 = "으, 응!"
2302-74 = "우미카가 어마어마하다고 말할 정도라니, 무슨 정보인지 궁금한데…… 뭐야?"
2302-75 = "그게 말이죠."
2302-76 = "게헨나의 피 칠갑 축제의 기원은, 원래 서로가 피 칠갑이 될 정도로 총을 난사해대는 축제였다는 거 있죠!"
2302-77 = "응……?"
2302-82 = "그건…… 조직과 조직의 항쟁이로군요……"
2302-83 = "역시 게헨나! 무섭습니다!"
2302-84 = "아니아니아니. 그런 게 축제의 기원일 리가 없잖아! 대체 어디서 그걸 들은 거야?"
2302-85 = "네? 게헨나에 현지 조사를 하러 갔을 때, 길거리에서 껄렁하게 생긴 헬멧단 단원이 말해줬어요."
2302-86 = "1000엔만 주면, 피 칠갑 축제의 어마어마한 비밀을 알려준다길래, 저도 모르게 냉큼!"
2302-87 = "당한 거잖아! 아무리 봐도 현지에서 당한 거잖아. 관광을 하러 갔다가 당한 관광객의 전형이잖아. 우미카?!"
2302-88 = "네?"
2302-89 = "어쨌거나– 그러한 축제가 시간이 지나 내려오고 내려온 끝에– 이제는 마침내 토마토를 던지는 축제로 변해……"
2302-90 = "지금은 서로 상상할 수 있는 모든 수단으로 토마토를 던져대는 축제가 된 거래요!"
2302-94 = "토마토 투석기, 토마토 발칸, 날개안정분리토마토탄……"
2302-96 = "상상력이란 얼마나 위대한지!"
2302-97 = "그 모든 토마토 투척 수단을 보는 것만으로도 시간 가는 줄 모른다니까요?"
2302-99 = "날개안정분리토마토탄이란 건 대체 뭔데?!"
2302-100 = "심지어 밀레니엄과도 커넥션이 있다는 소문이 돌 정도로 엄청난 규모의 축제였어요!"
2302-101 = "그러니 그런 피 칠갑 축제를 벤치마킹하는 거예요! 사장님!"
2302-102 = "으, 응? 베, 벤치마킹?"
2302-105 = "게헨나에서 열리는 그 토마토 축제는, 단순히 토마토를 던지는 축제인 게 아니라."
2302-106 = "평소 농가에서 생산되었지만, 미처 상품성이 없어 팔지 못하고 남은 토마토를 처분하는데도 큰 도움이 되는 축제라고 들었어요."
2302-109 = "생각해 보세요, 사장님!"
2302-110 = "이를 벤치마킹한다면……"
2302-111 = "저희 백귀야행에서도 미처 여러 이유로 처분하지 못했던 농가의 토마토를 들여와!"
2302-112 = "다 함께 상부상조하는 느낌으로 시장을 활성화시킬 수 있을 거예요!"
2302-113 = "거기에 더해, 맛있는 토마토 요리를 함께 제공하는 건 어떨까요?"
2302-119 = "쓸모 없어 판매할 수 없었던 토마토의 소비를 촉진하는 것으로 한 번."
2302-120 = "또한 농가와 연계해서 토마토 전문 요리를 구상해 판매하는 것으로 또 한 번!"
2302-121 = "그렇게 연속적으로 토마토 소비를 촉진할 수 있을 테니까요!"
2302-122 = "이렇게 되면 토마토 소비량이 늘어날 것은 확실하고, 뿐만이 아니라 축제가 끝난 뒤에 청소와 세탁에도 인력이 들어가야 하니까……."
2302-127 = "그 관련 산업도 엄청나게 부흥하겠죠!"
2302-128 = "과연 우미카!"
2302-129 = "현지 조사를 하며 견문이 넓어진 것이로군요!"
2302-130 = "이 피나, 거기까지는 생각도 못했습니다!"
2302-132 = "그, 그런가……?"
2302-133 = "소비 시장 활성화와 청소 산업 활성화가 되니까…… 괜찮, 나……?"
2302-137 = "아니, 역시 아니야! 무엇보다 그럴 예산 없으니까!"
2302-138 = "그보다 부상자가 생길 수도 있다니 애초에 아웃이야!"
2302-139 = "그럼 이건 어떠세요?"
2302-140 = "와일드헌트 예술학원에서는 특별한 학원제가 열린대요! 학원 전부가 참여하는 빅 이벤트죠!"
2302-141 = "아, 학원제. 좋은 울림이네. 평범하고."
2302-142 = "그렇죠? 그렇죠?"
2302-143 = "하지만 와일드헌트에서는 조금 달라요. 가령 연극이라고 하면……"
2302-144 = "하면?"
2302-150 = "연극에서 리얼리티는 생명!"
2302-151 = "그러니까 MG5의 전탄을 무대에서 맞아라! 100발 모두!"
2302-152 = "그렇다면 이쪽은 소이탄이다! 발사!"
2302-153 = "그렇게 무대가 전부 불타고, 무너지고, 터져 나간 끝에 진정한 연극이 완성되는 거죠!"
2302-154 = "그런 식으로 모든 동아리가 자신만의 예술을 발표하고……"
2302-155 = "그 예술들이 하나로 모인 끝에, 폭발! 해체! 혼돈! 파괴! 광기! 가 되는 거예요!"
2302-156 = "역시 우미카! 예술은 곧 폭발이라는 것이로군요?"
2302-157 = "아니, 파괴인가?"
2302-159 = "축제에서 사용되어서는 안 되는 단어들이 너무 많지 않아?!"
2302-160 = "참고로 그 소식은 어디에서……?"
2302-161 = "인터넷에서 봤어요!"
2302-166 = "인터넷에선 믿을 수 없는 정보가 잔뜩이니까. 조금은 조심하자?!"
2302-167 = "그러면요, 그러면요. 시골 학원의 경주 축제는 어떠세요?"
2302-168 = "아…… 시골 학원. 어감이 좋네. 편안하고 치유 받을 수 있을 것 같은 느낌이야. 경주라면…… 달리기 경주 같은 거야?"
2302-169 = "그건 바로…… 테크니컬 레이스 축제예요!"
2302-170 = "테, 테크니컬?!"
2302-171 = "네! 튜닝한 트럭에 각종 무기를 장착한 차량이에요! 대공포, 다연장포, 대공 기관포, 중기관총…… 올릴 수 있는 거라면 뭐든 좋죠!"
2302-172 = "무게중심이 불안정한 테크니컬을 몰고, 차량을 전복시키지 않으며, 무허가 개조 8기통 엔진을 한계까지 몰아붙이는 그 모습……"
2302-173 = "저는 분명! 그 모습이!"
2302-174 = "그 모습이! 침체된 거리에 활기를 되찾아 줄 거라고 믿어요!"
2302-176 = "오오–! 피나도 그 레이스, 보고 싶습니다!"
2302-177 = "분명 힘과 박력이 넘치겠지요!"
2302-179 = "안 되니까! 일단 무허가 개조라는 것부터 문제니까! 거기에 백귀야행에서 그런 무서운 무기들은 안 다루거든?!"
2302-181 = "그러니 안 돼! 기각!"
2302-189 = "우미카아아…… 응? 우미카…… 뭐랄까, 좀 더 그, 우리 백야당에서 할 수 있는…… 그러면서 너무 크거나 요란하지는 않은, 그런 아이디어는 없을까아……?"
2302-190 = "으으음…… 제게 남은 아이디어라고는 이제 작은 거 하나밖에 없는데요오……"
2302-191 = "이건 그다지 도움이 안 될 거라고 생각이 들고…… 무엇보다 규모가 작아서어……"
2302-192 = "그야말로 극적으로, 한 번에 상점가를 폭발적으로 펑! 부흥시킬 수 있는 그런 아이디어는 아닐지도 모르지만……"
2302-193 = "그래도 현지 조사 중에 우연히 보았던 축제가 있었냐고 물으신다면……"
2302-198 = "버드나무 축제라는 게 있었어요."
2302-203 = "버드나무 축제라는 것은 무엇입니까, 우미카?"
2302-208 = "정말 단순하고 소박한 축제여서…… 축제 참가자들이 버드나무 가지 모양의 장식물을 만들어서 손에 들고 물가를 산책하는 축제인데요."
2302-212 = "바람에 흔들리기 쉬운 버드나무 가지와 잎을 보면서, 마찬가지로 흐르는 물을 바라보며……."
2302-213 = "그때 느껴지는 특유의 잔잔한 분위기를 즐기는 거죠."
2302-214 = "당연히 배가 고파지면 축제 음식을 먹고. 또 버드나무 모양의 사탕이나 과자를 준비하기도 하고요."
2302-215 = "이게 말이죠? 버드나무가지에는 활력을 주는 기운이 가득 담겨 있다는 속설이 있어서!"
2302-216 = "거기에서부터 이 축제가 유래되었다는 말이 있거든요?"
2302-218 = "오오, 버드나무에 그런 속설이 있었다니. 처음 알았습니다!"
2302-223 = "네! 실제로 버드나무는 수질을 정화하는 능력이 매우 뛰어나다죠."
2302-224 = "또 버드나무 껍질이나 잎에는 약효 성분이 있다고 오래 전부터 알려져 있었어요! 살리실산이라고 불리는 물질이래요!"
2302-225 = "그걸 아세트산과 잘 반응시키면, 아세틸살리실산, 즉 해열진통제가 만들어진다고 하네요!"
2302-226 = "그 외에도 나그네가 목이 말라 물을 달라고 했는데, 급히 마시다 체하지 말라고 버들잎을 띄워서 주었다는 설화와도 관련이 있다고 하고요."
2302-227 = "뭔가 낭만적인 설화로군요!"
2302-228 = "그렇죠? 저도 왠지 마음에 들었어요!"
2302-229 = "아무튼 예전에는, 버드나무 가지를 꺾어서 손에 들고 물가를 산책하며, 흐르는 물을 바라보고 즐기는 축제였는데……."
2302-230 = "지금은 버드나무가 불쌍하니까, 버드나무 가지 모양의 장식물을 만들어서 즐기는 축제가 되었다고 해요!"
2302-237 = "우미카! 바로 그거야!"
2302-238 = "역시 우미카네! 우미카가 최고야!"
2302-243 = "우미카! 대단해요! 지금 뭔가 마음에 팟! 하고 와닿았습니다! 피나도 대찬성입니다!"
2302-244 = "아? 네?"
2302-245 = "에헤, 에헤헤헷. 에헷. 그, 그런가요? 다행이네요! 사장님!"
2302-246 = "그럼 그 아이디어에, 역시 대형 버드나무 가지 모형을 만들기로 하고, 거기에는 또 대량의 예산을 들여서!"
2302-248 = "아냐! 이거면 돼. 이거면 충분하니까!"
2302-249 = "네?"
2302-250 = "그래도……."
2302-252 = "충분하니까!"
2302-257 = "네, 네. 사장님이 충분하다고 하시면……."
2302-261 = "그러면 이것으로 회의 종료!"
2302-263 = "네! 우미카의 아이디어를 바탕으로, 이제부터 축제를 준비하는 것이군요!"
2302-264 = "네에? 저, 저요……? 흐, 흐름상 그렇게 되기는 하지만, 지금은 사장님도 계시고……."
2302-265 = "괜찮습니다, 우미카! 우미카는 할 수 있습니다! 무엇보다 우미카는 혼자가 아니니까요!"
2302-266 = "마츠리운영관리부는, 언제나 함께인 것입니다!"
2302-268 = "그렇지! 축제라는 것은 원래 다 같이 즐기는 거니까!"
2302-273 = "그러면 가자! 피나, 우미카! 마츠리운영관리부의 능력, 제대로 보여 주는 거야!"
2302-276 = "예–이! 자, 우미카도요!"
2302-277 = "예, 예–이!"
2302-280 = "(그렇게 마츠리운영관리부의 본격적인 활약이…… 바야흐로 시작되려 하는 것이었다!)"
2302-281 = "다시 한번! 마츠리부 정례회의!"
