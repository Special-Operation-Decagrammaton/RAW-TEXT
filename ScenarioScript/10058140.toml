[translation]
10058140-1 = "後日談その2;戦士たちの楽園"
10058140-2 = ""
10058140-3 = "閉幕の祝賀パーティー"
10058140-4 = "イッツー！"
10058140-5 = "パーティータイム！だよ～！"
10058140-7 = ""
10058140-8 = ""
10058140-9 = "祝うにはまだ早いぞ！！#nイロハの奴は逃げ、服を盗んだ犯人もまだ捕まっていないんだからな！"
10058140-10 = "まあまあ！大会は無事終わったんだから、いいじゃないですか！"
10058140-11 = "でも、本当に不思議よね。#n荷物を受け取った時には、たしかに重みを感じたのに……。"
10058140-13 = "服が盗まれたのか……ゲヘナも経済的に困ってるみたいだね。"
10058140-14 = "水着が1着あれば、人は十分生きていけるのですが……。"
10058140-15 = "あんたは早く服を着なさいよ！！それしかないの！？"
10058140-16 = "レースは終わったのに、どうしてまた水着なの！？"
10058140-17 = "さっき着ていた水着は汗でびしょびしょになってしまったので……#nこのような場には清潔でサラっとした水着を着てくるのがマナーかと。"
10058140-18 = "それとも、コハルちゃんはびしょびしょの私のほうが好きですか？"
10058140-19 = "い、嫌っ！！近づかないで！！"
10058140-21 = ""
10058140-23 = "うわああぁぁん！"
10058140-25 = "あはは……#nですが、誰もケガすることなく無事にレースが終わって良かったです。"
10058140-26 = "ん？"
10058140-28 = ""
10058140-30 = ""
10058140-31 = "あなたは、あの時の……。"
10058140-32 = "ふむ。"
10058140-33 = "また会えたので、今は敵ですね。"
10058140-34 = "うん、そうだね。"
10058140-36 = ""
10058140-37 = ""
10058140-38 = "ラナと同じ漫画を読んでるんだね～。"
10058140-39 = "類は友を呼ぶからね。"
10058140-40 = "よく考えると前に再会しているので、#n今は一周回って友達になったということです。"
10058140-41 = "不変の法則だ。また会えば敵、さらに会えば戦友。"
10058140-42 = "前回も敵というより、味方でしたけどね。"
10058140-44 = ""
10058140-45 = ""
10058140-46 = "こんばんは、183号のみなさん！"
10058140-47 = "改めて、優勝おめでとうございます。"
10058140-48 = "ヒフミさん！ハナコさん！昨日から本当にお世話になりました！"
10058140-49 = "ううっ……#nもう一滴も出ないと思ってたけど、みんなの顔を見たらまた涙が……。"
10058140-50 = "や、やめてよ。私まで泣いちゃうじゃない……ひぃん……。"
10058140-51 = "ふふっ。せっかくのパーティーなんですから、一緒に楽しくお祝いしましょう！"
10058140-52 = "あの二人は泣き虫だね。"
10058140-53 = "他にもいろいろな側面がありますが、はぁ……今は泣き虫のようです。"
10058140-54 = "うあぁん！ありがとー！！"
10058140-56 = "あー！すっきりした！思いっきり暴れた後のパーティーってのも悪くねぇな！"
10058140-57 = "だろ？お前ら！"
10058140-59 = ""
10058140-60 = ""
10058140-61 = ""
10058140-62 = ""
10058140-63 = ""
10058140-64 = ""
10058140-65 = ""
10058140-66 = ""
10058140-67 = "私たちの上であんだけ暴れたんだから、そりゃすっきりするでしょ……。"
10058140-68 = "デコピンされたところが、たんこぶになってそう……。"
10058140-69 = "アリスが何をしたって言うんですか！とばっちりです！"
10058140-70 = "チビメイド様は戦車より強いと思います！"
10058140-71 = "銃を撃つのが違反じゃないなんて、このレースおかしい……。"
10058140-72 = "文句ばっか言いやがって！勝負は勝負だろうがぁ！"
10058140-74 = ""
10058140-75 = "……ほんとに痛むのか？……悪ぃ。"
10058140-76 = "痛いよ！！ひどすぎる！！ちゃんと謝って！！"
10058140-77 = "ちっ。たしかにやりすぎちまったかもな。悪か……。"
10058140-78 = "ここにいたのかい、ネル？プリズム戦車はどうだった？"
10058140-79 = "あ、ちょっと待ってろお前ら。ウタハ、戦車は問題なかったぜ。"
10058140-80 = "ビームがババーン！って出てくるの、すっごくかっこよかったよー！"
10058140-81 = "満足してもらえたなら、エンジニアとしては嬉しい限りだ。"
10058140-82 = "それでは、ここにサインを。"
10058140-83 = "ああ、そういや後払いだったな……。"
10058140-85 = ""
10058140-86 = ""
10058140-87 = ""
10058140-88 = ""
10058140-89 = "あぁ？なんで2枚なんだよ？"
10058140-90 = "C&Cからの注文は2台だからさ。"
10058140-91 = "んなわけねーだろ！！1台しか……。"
10058140-93 = ""
10058140-94 = "おい、[ruby=あすま]飛鳥馬[/ruby]トキ。"
10058140-95 = "はい、トキです。"
10058140-96 = "いかがされましたか？"
10058140-97 = "良い度胸じゃねぇか！堂々とC&C名義で決済しやがって！！"
10058140-98 = "名案だと思ったのですが、#n先々のことまで考えが及ばなかったのは失敗でしたね。"
10058140-99 = "てめぇ、今日という今日は……！"
10058140-100 = "代筆していただいたネル先輩のサインは完璧だったのに……#nすみません、モモイ。"
10058140-101 = "ああっ！！バラしちゃダメじゃん！！"
10058140-103 = ""
10058140-104 = "……あっ！"
10058140-105 = "……ははっ。"
10058140-107 = ""
10058140-108 = ""
10058140-109 = "当然、ボコられる覚悟はできてんだよなぁ？"
10058140-110 = ""
10058140-117 = "ぎゃあああああっ！"
10058140-121 = ""
10058140-122 = "ん、花火。すごい。"
10058140-123 = "というか今、悲鳴が聞こえなかった！？"
10058140-124 = "ふぁあー……おじさんはパーティーより寝ていたいかなー。"
10058140-125 = "先輩！そんなこと言ってないで、一緒にパーティーを楽しみましょう☆"
10058140-126 = "パジャマパーティーだったらよかったんだけどねー。"
10058140-127 = "みんな無事にレースを終えられたことは良かったのですが……。"
10058140-128 = "私たちの戦車、完全に壊れてしまいましたね。修理費はどうしましょう……？"
10058140-129 = "砲身は壊れて、自力走行も2速ギアがやっとって……#nもうまともなトコないわね。"
10058140-130 = "それなら問題ない。どうせタダだから。"
10058140-131 = "タダってどういうこと？"
10058140-132 = "これは、カイザーローンが校門の前に停めてたやつだから。"
10058140-133 = "元に戻しておけばいいだけ。"
10058140-134 = "それって、まさか盗んできたってことですか？"
10058140-135 = "無断駐車したってことは、その土地の持ち主が使うことに同意したってこと。"
10058140-136 = "カイザーローンが不法投棄したゴミは、毎日私たちが片づけてるでしょ。"
10058140-137 = "そ、それとこれとは違うでしょ！"
10058140-138 = "昔のこと思い出すなぁー。"
10058140-139 = "うちの後輩……どこかに行くと、いつも何か拾ってきてたよねー。"
10058140-140 = "恩返しする猫みたいでしたね☆"
10058140-141 = "思い出に浸ってる場合じゃないでしょ！！"
10058140-142 = "もう……これ、どうやって戻すの！？"
10058140-143 = "簡単だよ。カイザーローンの戦車なんだし……。"
10058140-144 = "銀行の前に駐車しよう。"
10058140-145 = "誤解されるわよ！！！"
10058140-147 = ""
10058140-148 = ""
10058140-149 = "待て！！"
10058140-150 = "うわああぁぁん！！"
10058140-152 = "いやあぁ！！水着ハグはやめて！！"
10058140-154 = ""
10058140-156 = "えいっ♡えいっ♡"
10058140-158 = "もう、泣くのはおしまいですよ～！"
10058140-159 = "わああぁぁん！"
10058140-160 = "ひいいぃぃん！"
10058140-162 = ""
10058140-163 = "こうして、ゲヘナカップは無事に幕を下ろしました！"
10058140-164 = "先生！最後に一言お願いします！"
