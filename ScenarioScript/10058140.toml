[translation]
10058140-1 = "후일담;전사들의 낙원"
10058140-3 = "폐막 축하 파티"
10058140-4 = "잇-츠!"
10058140-5 = "파티타임-! 이래!"
10058140-9 = "축하하기엔 이르다!! 이로하 녀석은 도망쳤고!! 옷 도둑은 잡지 못했잖나!!"
10058140-10 = "에이, 어쨌건 경기는 끝났잖아요! 좋은 게 좋은 거라구요!"
10058140-11 = "정말 이상하네, 분명 어제 받아왔을 때는 상자가 묵직했는데……."
10058140-13 = "옷 도둑이라……. 게헨나도 경제적으로 넉넉한 곳은 아닌가 봐."
10058140-14 = "사람은 수영복 한 벌만 있어도 충분히 살아갈 수 있는데 말이죠."
10058140-15 = "너는 제대로 된 옷 좀 입어! 옷장에 불이라도 난 거야?"
10058140-16 = "경기 끝났으면 멀쩡한 옷 좀 입으라구, 왜 이번에도 수영복인데?!"
10058140-17 = "그렇지만, 아까 입은 수영복은 땀으로 셔츠까지 젖어버렸는걸요? 격식 있는 자리에는 청결하고 보송보송한 수영복이 매너에 맞죠."
10058140-18 = "아니면, 코하루 쨩은 제가 축축한 쪽이 더 좋으신 걸까요?"
10058140-19 = "시, 싫어!! 다가오지 마!!"
10058140-23 = "으아아아앙!!"
10058140-25 = "아하하……. 그래도 다친 분 없이 무사히 경기가 끝나서 다행이에요."
10058140-26 = "음?"
10058140-31 = "너는, 그때의……."
10058140-32 = "음."
10058140-33 = "다시 만났으니, 적이군요."
10058140-34 = "아아, 그래."
10058140-38 = "라나하고 똑같은 만화책을 보고 있나 보네~"
10058140-39 = "동류는 동류를 알아보는 법이야."
10058140-40 = "따지고 보면 저번에 한 번 더 만났기 때문에, 지금은 한 바퀴 돌아서 친구인 게 맞습니다."
10058140-41 = "불변의 법칙이지. 다시 만나면 적, 또다시 만나면 전우."
10058140-42 = "그런 것치고, 저번에도 적보다는 아군이었지만요."
10058140-46 = "안녕하세요, 183호 여러분!"
10058140-47 = "우승, 다시 한번 축하해요."
10058140-48 = "히후미 씨! 하나코 씨! 어제도 오늘도, 정말 신세 많았어요!"
10058140-49 = "으읏……. 다 울었다고 생각했는데, 막상 다시 보니까 눈물이……."
10058140-50 = "바, 바보야……. 나까지 눈물 나잖아, 히잉……."
10058140-51 = "후후! 좋은 날이잖아요! 다 같이 놀고 축하하면 되죠!"
10058140-52 = "저 두 사람은 울보로군."
10058140-53 = "그 이외에도 가지가지 하는 편입니다만, 일단 지금은 울보입니다."
10058140-54 = "으아앙-! 고마워요-!!"
10058140-56 = "아-! 개운하다! 그래도 한바탕 날뛰고 파티하니까 좋네!"
10058140-57 = "그치? 꼬맹이들!"
10058140-67 = "우리 위에서 날뛰었으니까 개운하지……."
10058140-68 = "딱밤 맞은 이마에 혹 난 것 같은데요……."
10058140-69 = "아리스는 무슨 잘못을 했다고 같이 혼낸 겁니까! 억울합니다!"
10058140-70 = "꼬마 메이드 씨, 탱크보다 더 센 것 같았습니다!"
10058140-71 = "주먹으로 때리는 게 룰 위반이 아니라니, 이 경기 이상해."
10058140-72 = "경기는 경기잖아! 불평하기는!"
10058140-75 = "……진짜 많이 아파? ……미안."
10058140-76 = "아파!! 너무 과했어!! 사과해라, 사과해!!"
10058140-77 = "끄응, 내가 너무 심했나, 그렇다면 미……."
10058140-78 = "여기 있었네, 네루. 프리즘 탱크는 어땠어?"
10058140-79 = "아, 잠깐만. 우타하, 탱크는 문제없었어. 꽤 괜찮던데?"
10058140-80 = "빔이 빠바바-! 하고 나가는 게 엄청 멋있었어!"
10058140-81 = "만족했다니, 엔지니어로서 더할 나위 없이 기쁜걸."
10058140-82 = "그렇다면, 여기 대금 영수증에 서명해 줘."
10058140-83 = "아차, 그렇지. 사용해 보고 결제하기로 했으니까……."
10058140-89 = "뭐야, 왜 영수증이 두 장이야?"
10058140-90 = "C&C에서 두 대를 주문했으니까?"
10058140-91 = "뭔 소리야?! 우리는 한 대밖에 못 받았……."
10058140-94 = "어이, 아스마 토키."
10058140-95 = "네, 토키입니다."
10058140-96 = "뭔가 용건이라도 있으신지요."
10058140-97 = "깡 있네, 인마. C&C의 공금으로 당당하게 결제했다고?"
10058140-98 = "좋은 아이디어라고 생각했습니다만, 그 이후의 일은 생각하지 않았던 게 문제였군요."
10058140-99 = "너, 진짜 오늘……."
10058140-100 = "대필해 주신 네루 선배의 사인은 완벽했는데……. 죄송합니다, 모모이."
10058140-101 = "아앗!!! 일러바쳤겠다!!!"
10058140-104 = "……헉……!"
10058140-105 = "……하."
10058140-109 = "당연히, 맞을 거 각오하고 한 거지?"
10058140-117 = "끄아앙!"
10058140-122 = "응, 불꽃놀이. 멋있어."
10058140-123 = "그런데, 비명 소리 들리지 않았어?"
10058140-124 = "으하아암- 아저씨는 파티보다는 더 자고 싶은데-"
10058140-125 = "선배! 그러지 말고 같이 즐겨요, 파티☆"
10058140-126 = "파티는 파자마 파티가 최고라구-"
10058140-127 = "다치지 않고 무사히 경기를 마쳐서 다행이긴 한데요……."
10058140-128 = "저희 전차, 완전히 망가졌는데 어떻게 하죠? 수리비가……."
10058140-129 = "포신도 망가지고, 자력주행은 기어 2단으로 겨우 가능한데, 멀쩡한 게 없잖아?"
10058140-130 = "그거라면 문제없어. 어차피 공짜 전차였거든."
10058140-131 = "공짜 전차? 그게 무슨 소리야?"
10058140-132 = "응, 카이저 론이 학교 후문에 세워뒀던 전차거든."
10058140-133 = "다시 원래 자리에 되돌려 놓으면 돼."
10058140-134 = "시로코 선배, 설마 전차를 훔쳐 온 거예요?!"
10058140-135 = "불법 주차를 했다는 건, 땅 주인이 마음껏 써도 된다는 동의라고 할 수 있어."
10058140-136 = "카이저론이 불법 투기한 쓰레기는 우리가 매일 치웠잖아."
10058140-137 = "그, 그거랑 그거는 다른 거잖아! 내가 못 살아!"
10058140-138 = "옛날 생각나는구먼-"
10058140-139 = "우리 후배, 어디 나갔다 오면 항상 뭘 가지고 오곤 했었지-"
10058140-140 = "은혜 갚는 고양이 같았죠☆"
10058140-141 = "추억에 젖지 말고!!"
10058140-142 = "으아……. 이걸 어떻게 돌려줘야 하지?!"
10058140-143 = "간단해. 카이저론 전차잖아."
10058140-144 = "몰아서 은행에 갖다주자."
10058140-145 = "오해할 거라고!!!"
10058140-149 = "거기 서!!"
10058140-150 = "끄아앙!!"
10058140-152 = "으아앙!! 수영복 허그 그마안!!"
10058140-156 = "에잇♡ 에잇♡"
10058140-158 = "자, 이제 뚝이에요, 뚝!"
10058140-159 = "와아앙-!"
10058140-160 = "히에에엥-!"
10058140-163 = "자! 이렇게, 게헨나 컵은 무사히 막을 내렸습니다!"
10058140-164 = "선생님! 소감 한 말씀 부탁드립니다!"
10058140-165 = "[ns] \"음!\""
10058140-167 = "[ns] \"청춘이구나!\""
