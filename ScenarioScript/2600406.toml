[translation]
2600406-1 = "좀 더 자주자주"
2600406-2 = "(도서관에 도착하니, 웬일로 로비까지 나와 있던 시미코가 보였다.)"
2600406-3 = "아, 선생님! 오셨군요. 기다리고 있었어요."
2600406-4 = "왜 여기까지 나와 있었냐고요?"
2600406-5 = "그, 그야 선생님을 도와 드리기 위해……."
2600406-6 = "……네? 평소엔 늘 책을 보고 있지 않았냐고요?"
2600406-7 = "아, 아하하……. 역시나 그런 이미지였군요. 저……."
2600406-8 = "뭐, 자업자득이겠지만요."
2600406-12 = "……후후훗."
2600406-14 = "물론 제가 책 보는 걸 좋아하는 건 사실이지만, 그것만이 도서관의 즐거움은 아니니까요."
2600406-15 = "사실 책 보는 것으로만 따지면, 도서관보다 집에서 보는 걸 더 선호하는 편이기도 하고요."
2600406-16 = "제가 굳이 매일처럼 도서관으로 나와서 사서 일을 도맡아 하고 있는 이유는……."
2600406-17 = "바로 지금 이런 일. 이런 상황들 때문이죠."
2600406-18 = "[s1] \"……? 이런 일?\"\n[s2] \"내 이야기야?\""
2600406-19 = "네. 그래서 지금 되게 신이 나 있답니다. 정말로 선생님께서 응해 주실 줄은 몰랐거든요."
2600406-20 = "네. 그래서 지금 되게 신이 나 있답니다. 정말로 선생님께서 응해 주실 줄은 몰랐거든요."
2600406-21 = "사서가 가장 좋아하는 일. 그것은 바로 필요한 사람에게 '밖에선 구할 수 없는 책'을 찾아주는 일."
2600406-22 = "지금 선생님께서 필요로 하시는 책이 뭔지는 아직 못 들었지만, 분명 구하기 힘든 거겠죠?"
2600406-23 = "어디서든 구할 수 있는 내용이었다면, 요즘 같은 시대에 인터넷으로 벌써 찾으셨을 테니까요."
2600406-24 = "[s3] \"과연. 확실히 말이 되네.\"\n[s4] \"결국 검색으론 못 찾았었지.\""
2600406-25 = "후훗. 역시……."
2600406-26 = "후훗. 역시……."
2600406-27 = "많은 것들이 인터넷과 e북으로 풀려 있고, 점점 더 도서관으로 올 일이 적어지는 세상이지만."
2600406-28 = "의외로 아직도 진짜 깊은 정보들은, 인터넷 검색으로 찾기 어려운 게 많답니다."
2600406-29 = "찾는 사람이 많지 않은 정보. 접근이 쉽지 않은 이야기들은 아직도 종이 속에 잠들어 있죠."
2600406-30 = "그게 뭔지 같이 찾아보는 것만 해도 사서로서는 더 없는 즐거움!"
2600406-31 = "게다가……."
2600406-35 = "[ns5] \"……게다가?\"\n[ns6] \"……시미코?\""
2600406-36 = "……으응. 아무것도 아니에요. 자, 어서 책을 찾아보죠! 어떤 책을 찾으시는 중인가요?"
2600406-37 = "……으응. 아무것도 아니에요. 자, 어서 책을 찾아보죠! 어떤 책을 찾으시는 중인가요?"
2600406-38 = "종류와 이름으로 꽤 깔끔하게 정돈된 도서관이긴 하지만, 크기가 엄청난 만큼, 쉽진 않을 거라고요."
2600406-45 = "……음음. 그렇군요. 알겠어요."
2600406-46 = "그거라면……. 이쪽으로!"
2600406-50 = "[ns] 시미코를 따라간다."
2600406-54 = "(시미코를 따라 점점 더 도서관 깊은 곳으로 향했다.)"
2600406-55 = "(어마어마한 크기의 도서관이었기 때문에, 종류별로 분류된 블록만 해도 방 하나를 다 차지했다.)"
2600406-56 = "(거기서부터는 일일이 찾아보는 수밖에 없었다. 한참 동안 책장들을 오가며 책들을 찾았다.)"
2600406-57 = "(……이후 얼마나 더 시간이 흘렀을까.)"
2600406-61 = "(마침내 찾던 책을 발견했다.)"
2600406-62 = "[s] 책을 뽑아 든다."
2600406-67 = "(책이 뽑히지 않았다.)"
2600406-68 = "……? 응?"
2600406-69 = "[s] \"……?\""
2600406-72 = "[wa:1250]― [log=시미코]그……. [wa:2300]우, [wa:880]우연이네요.[/log]"
2600406-73 = "[wa:1785]― [log=시미코]하필이면 [wa:650]딱 이렇게…….[/log]"
2600406-76 = "― [log=시미코]먼저 찾아서[/log]"
2600406-77 = "[wa:1170]― [log=시미코]선생님께 [wa:815]알려드리려고 했는데…….[/log]"
2600406-80 = "― [log=시미코]……[wa:300]아뇨.[/log]"
2600406-81 = "[wa:800]― [log=시미코]그래도 먼저 집은 건 [wa:1250]저니까요. [wa:1890]그렇죠?[/log]"
2600406-84 = "― [log=시미코]음~. [wa:1925]어떻게 할까~.[/log]"
2600406-85 = "[wa:1955]― [log=시미코]정 필요하시다면 [wa:1690]양보해 드릴 수도…….[/log]"
2600406-88 = "― [log=시미코]……[wa:400]농담이에요.[wa:1160] [/log]"
2600406-91 = "― [log=시미코]대여기록만 찍고 [wa:1595]바로 드릴게요.[/log]"
2600406-92 = "[wa:2260]― [log=시미코]찾을 수 있어서 [wa:720]다행이었네요.[/log]"
2600406-95 = "[wa:1050]― [log=시미코]어때요? [wa:2000]도서관에서의 이런 시간도……[/log]"
2600406-96 = "[wa:2730]― [log=시미코]나름대로 [wa:800]즐겁지 않나요?[/log]"
2600406-99 = "― [log=시미코]다른 곳에서는 [wa:525]맛볼 수 없는 [wa:920]거니까…….[/log]"
2600406-100 = "[wa:2020]― [log=시미코]여기서만의 [wa:890]일이랄까…….[/log]"
2600406-103 = "[wa:900]― [log=시미코]그러니 [wa:1290]앞으로도,[/log]"
2600406-104 = "[wa:2450]― [log=시미코]필요하시다면 [wa:900]언제든 찾아와 주세요.[/log]"
2600406-107 = "[wa:700]― [log=시미코]저…… [wa:1200]기다리고 있을게요! [/log]"
2600406-110 = "(시미코와 다른 책들도 조금 더 둘러본 후, 빌린 책을 들고 샬레로 돌아왔다.)"
