[translation]
10013020-1 = "제2화;우선 상황을 정리해 보자."
10013020-2 = "(다들 준비를 위해 잠시 자리를 비운 사이.)"
10013020-6 = "이런 상황에서도 고집을 부리다니, 시즈코 양도 차암~ 그런 효율적이지 않은 방식을 택하다니."
10013020-7 = "거기에 미모리 양과 치세까지 덩달아 찬성을 해버리다니 충격~이라니까요~"
10013020-8 = "선생님은 이해가 되시나요~?"
10013020-9 = "[s] \"글쎄. 뭐가 정답이다. 라고 딱 잘라 말할 순 없겠지.\""
10013020-13 = "[ns] \"단지 시즈코가 그러겠다고 결정했다면, 존중할 뿐이야.\""
10013020-14 = "……과연~ 당신께서도 그녀의 방식을 부정하지는 않으신다. 이거로군요?"
10013020-15 = "냐하핫- 네, 알겠습니다. 그럼 지루한 이야기는 여기까지."
10013020-16 = "제 조언이 먹히지 않는 이상~? 다시금 본업으로 돌아가야 하므로 저는 이만"
10013020-17 = "[s] \"응. 니야. 잘 부탁해.\""
10013020-18 = "차암……. 선생님께서 무슨 말씀을 하시온지, 저는 도통 모르겠는걸요- 냐하핫~"
10013020-27 = "아, 선생님. 먼저 나와 계셨네요."
10013020-28 = "[s] \"엇…… 시즈코……. 그 옷차림은…….\""
10013020-29 = "네? 이거요? 수영복인데요?"
10013020-30 = "지금부터 치열한 전장이 될, 저 너머의 바다에 맞춰! 복장도 갖춰 입지 않으면?! 이라는 결론에 도달한 끝에-"
10013020-31 = "네-! 이렇게 수영복으로 갈아입었답니다!"
10013020-32 = "어떠신가요-! 저 카와와 시즈코의 유비무환!"
10013020-33 = "전천후 완벽히 대응하는 이 프로페셔널한 모습이!"
10013020-34 = "[s] \"아, 응…….\""
10013020-35 = "후후……."
10013020-36 = "후……."
10013020-44 = "그, 그래서 이, 일단 서, 설명은 했는데"
10013020-45 = "호, 호, 혹시…… 그, 서, 선생님께서는, 이걸 보고, 그 뭐야."
10013020-46 = "가, 가, 감상이라던가……."
10013020-47 = "주-----구우운----!!"
10013020-53 = "[ns] \"우왓, 이, 이즈나?!\""
10013020-59 = "네! 이즈나! 시즈코 공과 마찬가지로-"
10013020-60 = "여름 바다에 어울리는 전투복으로! 이렇게 갈아입었습니다!"
10013020-64 = "어떠신가요?! 주군! 이즈나는 멋지게 변신을 했나요?!"
10013020-68 = "[ns] \"아, 으응. 멋지네.\""
10013020-69 = "자, 잠깐……! 이즈나-"
10013020-70 = "다들 기운이 넘치네요. 후후."
10013020-71 = "선생님- 변장했어-"
10013020-72 = "옷을 갈아입었으니까- 이제 나도-"
10013020-73 = "바다 위, 달릴 수 있을까?"
10013020-74 = "[s] \"아마…… 무리일 거라고 생각해.\""
10013020-75 = "그으-래?"
10013020-77 = "그래도 치세 공!"
10013020-78 = "지금은 비록 힘들지 몰라도 인법 수련을 하며 노력하다 보면!"
10013020-79 = "언젠가 닌자처럼 달릴 수 있을 거라, 이즈나는 생각해요! 네! 아마도!"
10013020-80 = "[s] \"물론 자신감을 가진다는 건 좋은 일이지만……!\""
10013020-85 = "[ns] \"어쨌거나 다들 수영복 차림으로 갈아입었네.\""
10013020-86 = "앗, 네……."
10013020-87 = "이즈나의 수영복은, 부장과 츠쿠요 공이 골라준 거예요! 바다로 임무를 떠난다고 했더니- 혹시 필요할지도 모른다고-! 마침 이렇게 쓰이는 거네요!"
10013020-88 = "니야 부장이- 입으면, 바다에서 강해질 수 있다고 해서- 그래서-"
10013020-89 = "[s] \"으, 응 그래……. 미모리는?\""
10013020-90 = "앗, 저, 저는…… 그게."
10013020-93 = "볼일이 있어 바다에 간다고 하니까. 츠바키 쨩이랑 카에데 쨩이 제게 어울리는 걸 찾았다면서……."
10013020-94 = "여기에 온 건 어디까지나 놀러 온 게 아니라, 시즈코 쨩이 위험할지도 모른다는 말을 듣고 찾아온 건데……."
10013020-95 = "역시, 염치가 없……지요?"
10013020-98 = "[ns1] \"아냐. 모처럼이기도 하니까.\"\n[ns2] \"다들 잘 어울려, 정말 무척이나.\""
10013020-101 = "그, 그런가요……?"
10013020-102 = "네, 그, 그렇죠! 그럴 거라고 생각했어요!"
10013020-103 = "네! 정말 여러분 모두 잘 어울려요-!"
10013020-104 = "이건 또 무슨 지상천국! 혹시 저도 모르는 사이에 새롭게 시작된 축제인가-! 싶을 정도네요!"
10013020-105 = "이럴 줄 알았으면 나도 수영복을 가져올걸!"
10013020-106 = "아니다! 이런 축제가 열리고 있다면, 역시 한 발짝 멀리 떨어져서 차분하게 음미하며 감상하는 것도, 나름의 정취가……."
10013020-107 = "그렇지 않나요?! 선생님?!"
10013020-108 = "[s] \"으, 으응…… 그, 그런가……?\""
10013020-110 = "우미카, 선생님이 곤란해하시니까……."
10013020-117 = "으헤~ 다들 모였으면 말했던 대로 가지고 있는 정보를 나눠볼까?"
10013020-124 = "니야 씨가 조사해준 정보에 따르면, 현재 이곳 <로스트 파라다이스 리조트>에서 두각을 나타내는 세력은 이렇게 정리해볼 수 있어요."
10013020-125 = "대충…… 일곱 개 정도인가……."
10013020-128 = "응. 특히 그중에서 가장 능동적으로 <리조트 사냥>을 하고 있는 건, 여기 헬멧단-"
10013020-129 = "저번에 우리에게 쳐들어왔던 애들이야. 요란한 녀석들이었다니깐."
10013020-130 = "제일 많이 움직이는 만큼, 위치나 이동 경로 등도 다양하게 노출되어 있네요."
10013020-132 = "네, 헬멧단이 특이한 경우이고 대부분은 조용히 물밑으로 움직이고 있거나, 세력 등을 숨기려는 모양새라서 그런지."
10013020-133 = "정확하게 특정되기보다는 마치 일종의 별명처럼 불리고 있는 모양이에요."
10013020-134 = "[s] \"별명이라니?\""
10013020-135 = "예를 들면 여기 이곳에서 제일 가까운 섬에 자리 잡고 있는 세력 같은 경우. 세간에 불리기를."
10013020-140 = "<영원토록 끓어오르는 뜨거운 땅을 찾는 유황의 광부들>……?"
10013020-141 = "어머나~☆ 낭만적인 캐치프레이즈네요~☆"
10013020-142 = "[s] \"나, 낭만적인가……?\""
10013020-145 = "그 외에도 여기 적혀 있는 건 <패자를 파멸시키는 하얀 귀의 괴물들>……이라고 적혀 있네요."
10013020-148 = "앗, 그리고 여기에 적혀 있는 글귀는 <모든 것에 대가를 요구하는 현무의 사신들>이래요! 주군!"
10013020-149 = "음! 마치 닌자와 싸우고는 하는 악당 이름 같네요!"
10013020-150 = "[s] \"이즈나의 기준은 잘 모르겠지만…….\""
10013020-151 = "……혹시 만화 설정?"
10013020-153 = "그리고 이 마지막에 적혀 있는 건……"
10013020-157 = "아. <닥치는 대로 싸움을 걸고 다니는 헬멧단>이네요."
10013020-158 = "게다가 맨 마지막은 그냥 헬멧단이잖아!"
10013020-159 = "대충 이 정도가 우리가 가지고 있는 정보의 전부려나."
10013020-160 = "으으음, 이래서야 정보를 얻었다고 할지 여전히 오리무중이라고 할지……."
10013020-162 = "으음, 이제 어떡하면 좋을까요? 시즈코 쨩?"
10013020-173 = "으음, 여기서는……."
10013020-174 = "……으음. 보다 효율적으로 움직이려면……."
10013020-181 = "응, 결정했어."
10013020-182 = "여기부터는 팀을 두 개로 쪼개는 게 좋겠어."
10013020-183 = "[s] \"어? <리조트 사냥>을 할 거면서, 그래도 돼?\""
10013020-184 = "네, 쪼개면 세력으로서는 약해질지 모르지만, 그래도 그편이 효율적일 거라고 생각해요."
10013020-185 = "이러는 와중에도 백야당의 평판은 실시간으로 하락 중일지도 모르니까."
10013020-186 = "시간 싸움이란 거죠!"
10013020-187 = "[s3] \"응, 알았어. 그럼 팀은……\"\n[s4] \"아비도스와 백귀야행 이렇게 나누는 게 좋겠네.\""
10013020-194 = "네, 이 지도를 기준으로 보자면, 저희는 이쪽으로 향할 테니, 아비도스 여러분에겐 이쪽을 부탁할게요"
10013020-195 = "으헤~ 그럼 결정된 건가~?"
10013020-196 = "네, 그럼 다 함께-"
10013020-197 = "출발이에요!"
10013020-199 = "네에! 닌닌!"
10013020-200 = "[s] \"다들 힘내자.\""
10013020-201 = "네! 그럼 지금부터 <로스트 파라다이스 리조트>의 점령전……."
10013020-202 = "시작하겠어요!"
