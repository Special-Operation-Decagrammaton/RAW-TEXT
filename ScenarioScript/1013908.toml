[translation]
1013908-1 = "อาหารของนิโกะ"
1013908-2 = "(คุณครูสงสัยว่าเสบียงอาหารสำหรับปฏิบัติการที่นิโกะพูดถึงเป็นแบบไหน จึงแวะมาดูที่ห้องครัว#nในเวลาพักกลางวัน)"
1013908-3 = ""
1013908-7 = "ห้องครัวในอาคารของชาเล่ต์"
1013908-9 = "(พอเปิดประตูครัว กลิ่นน้ำมันหอมกรุ่นก็ลอยเข้ามาพร้อมกับเสียงฉ่าคล้ายเสียงฝนตก)"
1013908-10 = "[ns] \"กลิ่นนี้มัน...\""
1013908-12 = ""
1013908-13 = "อ๊ะ คุณครู มาแล้วเหรอคะ?"
1013908-14 = "คุณครูมาเร็วเกินไปนะคะ อาหารจานนี้ต้องใช้เวลาปรุงอีกนานเลยกว่าจะเสร็จดีค่ะ"
1013908-15 = "[s1] \"กลิ่นเหมือนของอร่อยๆ เลย\"\n[s2] \"ไหนบอกว่าเป็นเสบียงอาหารสำหรับปฏิบัติการไง?\""
1013908-18 = "ค่ะ เป็นเสบียงอาหารสำหรับปฏิบัติการถูกแล้วค่ะ"
1013908-19 = "ที่ฉันทำอยู่ตอนนี้ก็คือเสบียงอาหารแบบดั้งเดิมที่ทหารในสมัยก่อนนิยมพกติดตัว..."
1013908-20 = ""
1013908-23 = "ซูชิเต้าหู้หวานนั่นเองค่ะ!"
1013908-24 = "[s] \"ซูชิเต้าหู้หวานเป็นอาหารสำหรับปฏิบัติการได้ด้วยเหรอ?\""
1013908-25 = ""
1013908-27 = ""
1013908-28 = ""
1013908-29 = "ค่ะ ซูชิเต้าหู้หวานเหมาะกับการเป็นเสบียงอาหารสำหรับปฏิบัติการที่สุดแล้วค่ะ"
1013908-30 = "นอกจากจะทอดด้วยน้ำมันจนมีแคลอรีสูงแล้ว ตัวอาหารยังชุ่มน้ำน้อย ทำให้บูดเสียได้ยาก นอกจากนี้ยังมีน้ำส้มสายชูช่วยต้านเชื้อแบคทีเรียผสมอยู่ด้วยค่ะ"
1013908-31 = "เวลาอยู่กลางแจ้งที่จุดไฟไม่ได้ ขอบอกเลยว่าไม่มีเสบียงอาหารอะไรที่ดีกว่านี้แล้วค่ะ"
1013908-32 = "ถ้าจะมีข้อเสียอยู่ข้อหนึ่ง ก็คงเป็นการที่มันอร่อยมากจนอาจเผลอกินหมดก่อนจะเกิด#nสถานการณ์ฉุกเฉินอีกค่ะ ฮุฮุ"
1013908-33 = "[ns] \"พอฟังดูก็จริงอย่างที่ว่านะ...\""
1013908-35 = "[ns3] \"แต่ถ้าถึงกับเสียเวลามาทำเองเลยแบบนี้...\"\n[ns4] \"แสดงว่ามันต่างจากซูชิเต้าหู้หวานที่ทำปกติเหรอ?\""
1013908-38 = "ซูชิเต้าหู้หวานที่ฉันทำวันนี้เป็นแบบทำเองทั้งหมด ตั้งแต่ทอดเต้าหู้เอง ไปจนถึงทำไส้ข้างในเลยค่ะ"
1013908-39 = "ซูชิเต้าหู้หวานที่ฉันห่อเป็นข้าวกล่องให้กองทหาร FOX ปกติแล้วฉันจะใช้เต้าหู้ทอดที่ขายทั่วไป#nในท้องตลาด..."
1013908-40 = "แต่ถ้ามีเวลา ฉันก็อยากลองทำซูชิเต้าหู้หวานด้วยเต้าหู้ที่ทอดเองสักครั้งค่ะ"
1013908-41 = ""
1013908-44 = "ตายจริง คุยจนลืมเวลาไปเลย"
1013908-45 = "ฉันขอตัวสักเดี๋ยวนะคะ..."
1013908-50 = "― [log=니코]ฮุฮุ สุกกำลังดีเลยนะคะ [/log][wa:1500] "
1013908-52 = "― [log=니코]อันที่อ้วนพองขึ้นมา น่าจะเป็นเต้าหู้ทอดที่ดีเลยค่ะ[/log][wa:1200] "
1013908-55 = "[ns] \"ดูน่าอร่อยจังเลยนะ\""
1013908-56 = "― [log=니코]อ๊ะ ยังไม่ได้ค่ะ[/log][wa:1500] "
1013908-59 = "― [log=니코]ยังต้องเอาไปทอดอีกครั้งหนึ่งค่ะ[/log][wa:450] "
1013908-62 = "― [log=니코]ตอนแรกต้องใช้ไฟต่ำ[/log]"
1013908-64 = "― [log=니코]แล้วค่อยมาทอดในไฟสูงอีกครั้ง ความชื้นจะได้หายไปหมด จนเป็นเต้าหู้ทอดที่อร่อยค่ะ [/log][wa:160] "
1013908-67 = "[ns] \"เต้าหู้ทอดเป็นอาหารที่มีขั้นตอนเยอะขนาดนี้เลยสินะ...\""
1013908-68 = "― [log=니코]ค่ะ [/log][wa:1180] "
1013908-70 = "― [log=니코]เต้าหู้ทอดเป็นอาหารที่ต้องใช้เวลาและความพยายามมากค่ะ[/log]"
1013908-73 = "― [log=니코]ได้ยินว่าสมัยก่อนก็เลยทำเต้าหู้ทอด[/log]"
1013908-75 = "― [log=니코]เพื่ออธิษฐานขอความอุดมสมบูรณ์และความสุขสวัสดีกันค่ะ[/log][wa:1020] "
1013908-78 = "― [log=니코]ถึงฉันจะหวังเพียง[/log][wa:1730] "
1013908-80 = "― [log=니코]ความสุขและความสงบของผู้คนรอบตัวก็ตาม [/log][wa:1740] "
1013908-83 = "― [log=니코]ถ้าความรู้สึกของฉันส่งผ่านทางเต้าหู้ทอดนี้ได้...[/log]"
1013908-85 = "― [log=니코]ก็คงน่าดีใจนะคะ[/log]"
1013908-89 = ""
1013908-90 = "ทอดเต้าหู้เสร็จสองรอบแล้วค่ะ!"
1013908-91 = "แน่นอนว่าต้องใช้เวลามากกว่านี้เพื่อประกอบให้เป็นซูชิเต้าหู้หวาน..."
1013908-92 = "แต่ถ้าคุณครูสะดวกละก็ จะลองชิมเต้าหู้ทอดนี้ดูก่อนมั้ยคะ?"
1013908-93 = "[s5] \"ครูยินดีอยู่แล้ว แต่ว่า...\"\n[s6] \"ให้ครูชิมเต้าหู้ทอดชิ้นแรกของนิโกะได้เหรอ?\""
1013908-96 = "ไม่เป็นไรค่ะ ที่จริงฉันอยากให้คุณครูทานเป็นคนแรกด้วยซ้ำค่ะ"
1013908-97 = "[s] \"งั้นไหนขอชิมหน่อย...\""
1013908-98 = ""
1013908-100 = ""
1013908-101 = "[ns7] \"นุ่มและรสเข้มข้นกว่าเต้าหู้ทอดที่ขายในตลาดอีกนะ!\"\n[ns8] \"เนื้อสัมผัสนุ่มฟูดีมากเลย!\""
1013908-104 = "ค่ะ ข้อดีของอาหารที่ทำเองก็คือ เราสามารถปรับความหนาหรือขนาดได้ตามต้องการค่ะ"
1013908-105 = "แต่ฉันน่าจะโลภมากไปหน่อย ก็เลยทำชิ้นใหญ่จนเหมือนอัตสึอาเกะมากกว่าแผ่นเต้าหู้ทอดสำหรับ#nยัดไส้..."
1013908-106 = "แต่สำหรับการลองทำครั้งแรก ฉันว่าทำได้เท่านี้ก็ดีมากแล้วค่ะ"
1013908-107 = "จริงสิ คุณครู เมื่อกี้บอกไว้ว่ายังไม่มีนัดทานมื้อเย็นวันนี้ใช่มั้ยคะ?"
1013908-108 = "ฉันจะเอาเต้าหู้นี้ทำเป็นซูชิเต้าหู้หวานให้ ไว้เรามาทานมื้อเย็นด้วยกันมั้ยคะ?"
1013908-109 = "[s] \"เอาสิ!\""
1013908-110 = "ค่ะ งั้นฉันจะรีบทำเลยค่ะ เชิญคุณครูพักผ่อนตามตารางวันหยุดที่วางไว้แล้วรอฉันหน่อยนะคะ"
1013908-111 = "[s] \"แต่ว่า...\""
1013908-112 = "ไม่ค่ะ! ไม่ต้องช่วยฉันก็ได้ค่ะ ยังไงฉันก็เริ่มทำสิ่งนี้เพราะความอยากของตัวเองอยู่แล้ว..."
1013908-113 = ""
1013908-115 = ""
1013908-116 = ""
1013908-117 = "แล้วนี่ก็เป็นครั้งแรกที่ฉันมาทำอาหารให้คุณครูถึงที่ด้วยนี่คะ..."
1013908-119 = "(ไม่นานหลังจากนั้น คุณครูก็ได้กินซูชิเต้าหู้หวานฝีมือนิโกะ และได้ใช้เวลาของเย็นวันนั้น#nอย่างสนุกสนานด้วยกัน)"
1013908-120 = "(พอเป็นอาหารที่ทำด้วยความตั้งใจจริง อาหารของนิโกะจึงนุ่มและอบอุ่นอย่างเหลือเชื่อ)"
