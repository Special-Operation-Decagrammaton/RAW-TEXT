[translation]
1013908-1 = "仁子的供品"
1013908-2 = "（因為好奇仁子說的野戰口糧是什麼樣子，於是趁午休時間順道去了一趟調理室）"
1013908-3 = ""
1013908-7 = "夏萊大樓內的調理室"
1013908-9 = "（剛打開調理室的門，一股香氣就隨著雨滴般滋滋作響的聲音撲鼻而來）"
1013908-10 = "[ns] 「這個味道是……」"
1013908-12 = ""
1013908-13 = "啊，老師。您來啦？"
1013908-14 = "距離料理完成還需要一些時間……您好像來得有點早呢。"
1013908-15 = "[s1] 「有一股很香的味道呢。」\n[s2] 「你不是說要做野戰口糧嗎？」"
1013908-18 = "沒錯，是野戰口糧哦。"
1013908-19 = "我正在做的是很久以前，士兵們會隨身攜帶的傳統野戰口糧──"
1013908-20 = ""
1013908-23 = "豆皮壽司！"
1013908-24 = "[s] 「豆皮壽司也能當野戰口糧嗎？」"
1013908-25 = ""
1013908-27 = ""
1013908-28 = ""
1013908-29 = "是的。豆皮壽司相當符合作為野戰口糧的條件哦。"
1013908-30 = "經過油炸而具備較高的熱量，偏少的水分也讓它不易腐壞……#n除此之外，裡面還加入了大量具備抗菌效果的醋。"
1013908-31 = "在無法生火的野外，沒有比這更合適的野戰口糧了。"
1013908-32 = "要說有什麼缺點的話……#n可能就是因為太好吃的關係，常常會在緊急狀況來臨之前就不小心吃光了吧，呵呵。"
1013908-33 = "[ns] 「聽你這麼一說，好像也是呢……」"
1013908-35 = "[ns3] 「不過從你特地抽出時間製作來看……」\n[ns4] 「這次和平常做的豆皮壽司不太一樣嗎？」"
1013908-38 = "是的。今天的豆皮壽司，是從炸豆皮到內餡全都親手製作的手工豆皮壽司。"
1013908-39 = "平常裝在FOX小隊便當裡的豆皮壽司，使用的都是市售的炸豆皮……"
1013908-40 = "所以我一直很想用親手炸的豆皮來包一次豆皮壽司。"
1013908-41 = ""
1013908-44 = "哎呀，已經這個時間了。"
1013908-45 = "我先失陪一下……"
1013908-50 = "― [log=니코]呵呵， 炸得很漂亮呢。 [/log][wa:1940] "
1013908-52 = "― [log=니코] 圓圓鼓鼓的……真期待成品。[/log][wa:2640] "
1013908-55 = "[ns] 「看起來好好吃。」"
1013908-56 = "― [log=니코]啊， 現在還不行哦。[/log][wa:1740] "
1013908-59 = "― [log=니코]因為等一下還要再炸一次呢。[/log][wa:1170] "
1013908-62 = "― [log=니코]先用低溫炸過。[/log]"
1013908-64 = "― [log=니코]接著再用高溫油炸…… 水分就會散去變成美味的炸豆皮。 [/log][wa:2240] "
1013908-67 = "[ns] 「原來炸豆皮是很費工夫的料理啊……」"
1013908-68 = "― [log=니코]炸豆皮其實是一道 [/log][wa:980] "
1013908-70 = "― [log=니코]非常費時又費工的料理哦。[/log]"
1013908-73 = "― [log=니코]因此據說在以前，[/log]"
1013908-75 = "― [log=니코]還是祈求一年豐收與安寧的供品呢。[/log][wa:2420] "
1013908-78 = "― [log=니코]我的願望是，[/log][wa:2170] "
1013908-80 = "― [log=니코]希望身邊的大家都能幸福，平平安安地度過每一天。 [/log][wa:2260] "
1013908-83 = "― [log=니코]如果我傾注在炸豆皮裡的心意能傳達出去的話……[/log]"
1013908-85 = "― [log=니코]那就太好了。[/log]"
1013908-89 = ""
1013908-90 = "經過兩次油炸的炸豆皮……完成了！"
1013908-91 = "當然，要做成豆皮壽司還需要再花一點時間……"
1013908-92 = "老師，如果方便的話，可以請您先嚐嚐這個炸豆皮嗎？"
1013908-93 = "[s5] 「我很樂意……」\n[s6] 「不過這具有紀念意義的第一份炸豆皮，由我來品嚐真的可以嗎？」"
1013908-96 = "當然可以。#n不如說，我更希望是由老師來享用呢。"
1013908-97 = "[s] 「那我就不客氣了……」"
1013908-98 = ""
1013908-100 = ""
1013908-101 = "[ns7] 「確實比市售的炸豆皮還要柔軟濃郁許多耶！」\n[ns8] 「這鬆軟的口感真的很棒！」"
1013908-104 = "是的。可以隨心所欲地調整厚度與大小，正是手工製作的優點呢。"
1013908-105 = "不過可能是我有點貪心的關係，比起炸豆皮好像更接近炸豆腐……"
1013908-106 = "但是以第一次嘗試來說，我覺得算是做得不錯了。"
1013908-107 = "對了，老師。#n您說過今天接下來沒有與人用餐的安排對吧？"
1013908-108 = "那麼我就用這些炸豆皮做成豆皮壽司，一起共進晚餐如何呢？"
1013908-109 = "[s] 「好啊！」"
1013908-110 = "好的，那我馬上準備。#n老師您就按照原本的假日行程，悠閒地休息吧。"
1013908-111 = "[s] 「不過……」"
1013908-112 = "不！不用您幫忙。#n這畢竟是我自己樂意才這麼做的……"
1013908-113 = ""
1013908-115 = ""
1013908-116 = ""
1013908-117 = "……而且，這也是我獻給老師的第一份供品呢。"
1013908-119 = "（之後品嘗著仁子親手做的豆皮壽司，度過了一段愉快的晚餐時光）"
1013908-120 = "（或許是因為仁子的豆皮飽含真心，嚐起來格外柔軟溫暖）"
