[translation]
1013908-1 = "Niko's Offering"
1013908-2 = "I was curious about the preserved food Niko had mentioned, so I popped into the kitchen for a moment during my lunch break."
1013908-3 = ""
1013908-7 = "Schale Building Kitchen"
1013908-9 = "As soon as I opened the kitchen door, a sizzling sound, like the pitter-patter of raindrops, filled the air, along with the strong, savory smell of oil."
1013908-10 = "[ns] \"This smell...\""
1013908-12 = ""
1013908-13 = "Ah, Sensei. You're here."
1013908-14 = "You're a bit early. There's still a way to go until the food is ready."
1013908-15 = "[s1] \"Something smells delicious.\"\n[s2] \"Didn't you say you were making combat rations?\""
1013908-18 = "Yes, that's what these are."
1013908-19 = "What I'm making right now are traditional combat rations that soldiers carried with them long ago..."
1013908-20 = ""
1013908-23 = "It's inarizushi!"
1013908-24 = "[s] \"Inarizushi can be a combat ration?\""
1013908-25 = ""
1013908-27 = ""
1013908-28 = ""
1013908-29 = "Yes. Inarizushi meets the criteria for combat rations perfectly."
1013908-30 = "Not only is it deep-fried in oil, making it calorically dense, but it also has low moisture content, so it doesn't spoil easily. As an added bonus, it contains plenty of vinegar, which has antibacterial properties."
1013908-31 = "If you're in a situation where you can't cook or start a fire, nothing beats an inarizushi for missions."
1013908-32 = "I suppose the problem with mine is that they're so delicious, you'll want to eat them all up right away. Fufu."
1013908-33 = "[ns] \"Now that I think about it, you're right...\""
1013908-35 = "[ns3] \"But seeing how you went out of your way to make time to make it...\"\n[ns4] \"Is this different from the inarizushi you usually make?\""
1013908-38 = "Yes. The inarizushi I'm making today is completely homemade, meaning everything was done from scratch, from the fried tofu slices to the filling."
1013908-39 = "The inarizushi I usually pack for FOX Squad's bento boxes use store-bought fried tofu, but..."
1013908-40 = "I've always wanted to find the time to make the fried tofu slices myself!"
1013908-41 = ""
1013908-44 = "Oh, would you look at the time?"
1013908-45 = "Excuse me for a second..."
1013908-50 = "― [log=니코]Fufu. Cooked to perfection. [/log][wa:1300] "
1013908-52 = "― [log=니코]The perfect puff. For the perfect slice of fried tofu![/log][wa:1040] "
1013908-55 = "[ns] \"It looks delicious.\""
1013908-56 = "― [log=니코]Ah, it's not ready yet.[/log][wa:1220] "
1013908-59 = "― [log=니코]I'll need to fry it again a little more later.[/log][wa:10] "
1013908-62 = "― [log=니코]It needs to be fried at a lower temperature, and then again at a higher one.[/log]"
1013908-64 = "― [log=니코]That'll ensure all the moisture is removed, creating the perfect deep-fried tofu! [/log][wa:40] "
1013908-67 = "[ns] \"I didn't realize deep-frying tofu was so labor-intensive...\""
1013908-68 = "― [log=니코]Yes. [/log][wa:1140] "
1013908-70 = "― [log=니코]Deep-fried tofu slices take a lot of time and effort.[/log]"
1013908-73 = "― [log=니코]That's why [/log]"
1013908-75 = "― [log=니코]they were offered when praying for good health and a rich harvest.[/log][wa:420] "
1013908-78 = "― [log=니코]All I wish for[/log][wa:1850] "
1013908-80 = "― [log=니코]is the happiness and well-being of those around me. [/log][wa:1140] "
1013908-83 = "― [log=니코]And if that feeling, packed into this dish, reaches them...[/log]"
1013908-85 = "― [log=니코]I'd be very happy.[/log]"
1013908-89 = ""
1013908-90 = "The double-fried tofu is done!"
1013908-91 = "Of course, it'll take a little more work to become inarizushi."
1013908-92 = "But if you don't mind, would you try a bite of the tofu first, Sensei?"
1013908-93 = "[s5] \"I'd be more than happy to, but...\"\n[s6] \"Is it really okay for me to try your first-ever deep-fried tofu, Niko?\""
1013908-96 = "It's okay. Actually, I would be really happy if you tried it, Sensei."
1013908-97 = "[s] \"Okay, here I go...\""
1013908-98 = ""
1013908-100 = ""
1013908-101 = "[ns7] \"It's so much softer and richer than store-bought fried tofu!\"\n[ns8] \"I really love the fluffy texture!\""
1013908-104 = "Yes. That's the advantage of making it by hand: You can customize the thickness and size however you like."
1013908-105 = "I might've gotten a little overboard, though. It's more thick-fried tofu than deep-fried."
1013908-106 = "But it's not bad for a first try!"
1013908-107 = "Ah, Sensei. You said you don't have any plans for the rest of the day, right?"
1013908-108 = "Well, since I'm going to make some inarizushi with this fried tofu, would you like to eat them with me for dinner?"
1013908-109 = "[s] \"Sounds good!\""
1013908-110 = "Okay. I'll get it ready right away, so please take it easy and wait as you would on a normal day off, Sensei."
1013908-111 = "[s] \"But...\""
1013908-112 = "No, no! I insist. After all, this was all just something I wanted to do."
1013908-113 = ""
1013908-115 = ""
1013908-116 = ""
1013908-117 = "Besides, this is my first offering to you, Sensei."
1013908-119 = "Afterward, we spent a pleasant evening eating the homemade inarizushi that Niko had made."
1013908-120 = "It had a very smooth and warm flavor. That must have been because Niko made it with such sincerity."
