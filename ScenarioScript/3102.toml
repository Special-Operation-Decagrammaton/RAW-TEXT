[translation]
3102-1 = "가치의 증명 2"
3102-4 = "……사람은 누구나 미래를 두려워하지요."
3102-5 = "고정된 과거와는 달리 미래는 무한한 가능성으로 열려 있으니까요."
3102-6 = "확정되지 않은 미래란 곧 무지. 무지는 인간에게 두려움을 안겨다 주는 법입니다."
3102-7 = "하지만 사람들의 생각과는 달리 미래는 절대 갑작스럽게 다가오지 않습니다. 변화는 언제나 충분한 전조를 수반하지요."
3102-8 = "……다만 그 전조를 관측할 수 있는 충분한 수단이 인류에게 없을 뿐."
3102-9 = "그래서 키보토스의 모든 정보를 관측할 수 있는 천재 미소녀 해커인 저, 히마리는 이런 생각을 떠올렸습니다."
3102-10 = "관측 가능한 모든 전조를 전산화하여 연산 장치에 넣고 돌리면 높은 확률로 미래를 예측할 수 있지 않을까— 하고 말이죠."
3102-11 = "……그렇게 해서 완성된 것이 바로 이 미래관측기관, <예언의 기록>의 설계도입니다."
3102-12 = "이 장치는 천체의 움직임부터 사람들의 생체 정보까지— 세상의 모든 변수를 취합하여 가장 가능성이 높은 미래를 사용자에게 보여줍니다."
3102-13 = "혹시라도 불확실한 미래의 편린을 조금이라도 들여다보고 싶으신 분이 있다면……"
3102-17 = "부디 이 설계도에 따라 <예언의 기록>을 완성해 주시길."
3102-20 = "그러니까 이 주석에 쓰인 내용대로라면……"
3102-21 = "이 설계도로 미래를 예지할 수 있는 전산 장치를 만들 수 있다는 거야?"
3102-22 = "그런 모양이네요. 미래를 예지하는 전산 장치라……"
3102-29 = "그나저나 히마리 부장이 직접 작성한 설계도라니, 저도 처음 봤어요."
3102-30 = "밀레니엄의 정규 보고 양식도 따르지 않고 있고, 생략되고 비약된 가설이 많아 한 눈에 알아보긴 어렵지만……"
3102-31 = "기존의 패러다임을 바꿀 수 있는 새로운 개념이 적용된 설계도라는 것만큼은 분명하네요."
3102-43 = "……말도 안 돼. 세상의 모든 변수에 순위를 매겨 미래를 연산하는 게 실제로 가능하다고?"
3102-44 = "그건 현존하는 최고 성능의 컴퓨터를 사용하더라도 불가능할 텐데……"
3102-48 = "하지만 다른 사람도 아닌, 베리타스의 그 히마리 부장이 직접 설계한 물건이라면……"
3102-49 = "공상을 현실로 이끌어내는 것도 불가능한 일이 아닐지도 몰라……."
3102-50 = "……그나저나 이 제안서, 생각보다 고가의 부품을 꽤 요구하는군요."
3102-54 = "천체 관측에 쓰이는 고가의 굴절 렌즈부터 슈퍼컴퓨터에 쓰이는 하이엔드 코어까지……."
3102-55 = "가볍게 계산해보아도 어지간한 동아리의 분기 예산에 가까운 비용이 들 것 같네요."
3102-56 = "정말로 이 장치가 미래를 예지할 수 있다는 보장도 없고, 제대로 된 절차를 밟아서 제출된 제안서도 아닌 것 같으니……"
3102-57 = "역시 이 제안서는 기각하도록 할까요?"
3102-61 = "자, 잠깐 기다려!"
3102-62 = "이런 첨단 기술이 도입된 제안서를 검토하지도 않고 기각하다니, 아깝지도 않은 거야?"
3102-63 = "……네? 하지만 유우카 쨩이 아까 말했잖아요?"
3102-64 = "밀레니엄의 재정은 검증되지 않은 기술을 모두 시험해볼 수 있을 만큼 여유롭지 않다고……"
3102-65 = "무, 물론 그건 그렇지만……"
3102-66 = "그, 그래도 기술의 발전을 위해서라면 가끔은 새로운 도전도 감내해야지!"
3102-67 = "혹시라도 이 예언의 기록이 난제의 해석에 도움이 될 단서를 줄지도 모르고……"
3102-68 = "그동안 천재적인 발명을 해온 히마리 부장이 작성한 설계도라면, 아예 허황한 물건은 아닐 테니까……."
3102-70 = "유우카 쨩의 생각이 그렇다면 반대할 생각은 없지만……"
3102-71 = "이 <예언의 기록>의 제작에 드는 비용은 어느 동아리의 이름으로 청구해야 할까요?"
3102-72 = "정식 인가 동아리도 아닌 베리타스에 청구서를 요청할 수도 없고……"
3102-73 = "단체라면 몰라도 히마리 부장 개인에게는 지원을 하지 말라는 리오 회장님의 지시도 있었으니……."
3102-74 = "……내 이름으로 청구해줘."
3102-78 = "……유우카 쨩의 이름으로요?"
3102-79 = "하지만 괜찮으시겠어요? 분명 어제 점심 때 들은 바로는 최근 유우카 쨩이 투자했던 펀드가 대폭락해서 개인적으로 쓸 돈도 빠듯하다고……."
3102-80 = "괘, 괜찮아. <예언의 기록>이 완성된다면 돈 같은 건 아무래도 좋은 수준의 문제가 될 테니까……"
3102-85 = "주식 시장의 흐름이라든가…… 인간의 광기라든가…… 예지로 돈을 벌 방법은 잔뜩 있어!"
3102-90 = "……그럼 그렇게 할까요? 유우카 쨩도 뭔가 의욕이 넘치는 것처럼 보이고."
3102-91 = "유우카 쨩의 오랜 친구…… 아니, 밀레니엄의 학생으로서 이런 재미있는 기회를 놓칠 수는 없으니까요."
3102-92 = "비록 구조가 복잡하긴 하지만, 예언의 기록의 제작은 외주 없이 세미나 내에서 은밀히 이루어져야 해."
3102-93 = "이런 위험한 물건의 존재가 밀레니엄의 괴짜들에게 알려진다면…… 또 어떤 사고가 터질지 모르니까."
3102-98 = "자. 이제 우리는 돈 걱정에 시달리지 않는 완벽한 미래—"
3102-99 = "아니, 기술적 특이점이 달성된 완벽한 미래를 향해 한 걸음 더 나아가는 거야!"
3102-101 = "벌써부터 완성이 기대되네요~"
