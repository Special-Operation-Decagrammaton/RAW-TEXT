12040-124 = "……뭐야, 분위기가 왜 이래?"
12040-125 = "무, 무슨 일 있었나요……?"
12040-126 = "[s] \"아니, 딱히.\""
12040-127 = "……? 으, 응. 그것보다 말야!"
12040-128 = "엄청 중요한 사실을 알았으니까!"
12040-129 = "네! 긴급한 사항이에요! 모두들 이것부터 봐주세요!"
12040-131 = "(펄럭-)"
12040-134 = "이건……. 뭐야? 지도?"
12040-135 = "최근까지의 거래가 기록된 아비도스 자치구의 토지 대장 지적도예요."
12040-136 = "응? 토지 소유자를 확인할 수 있는 문서요……?"
12040-137 = "아비도스의 토지는 당연히 학교 소유인데 이걸 왜……."
12040-138 = "아냐. 그러니까, 그게 아니라고!"
12040-139 = "오전에 병문안을 갔을 때, 마스터에게 사정을 들었어요!"
12040-140 = "시바세키 라멘집의 건물을 포함해서…… 아비도스 자치구의 대부분이……."
12040-141 = "……저희 학교 소유가 아니었어요."
