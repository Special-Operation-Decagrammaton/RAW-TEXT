[translation]
12040-1 = "제4화;각자의 이야기들 1"
12040-2 = "아비도스 학교 정문"
12040-5 = "어라, 선생님?"
12040-6 = "일찍 오셨네요~☆ 모임 시간은 아직 많이 남았는데."
12040-7 = "[s] \"노노미도 일찍 와 있었네.\""
12040-8 = "네! 일찍 도착해서 아침 청소를 하고 있었어요. 저도 아무래도 가만히 있을 수가 없어서……."
12040-9 = "마스터 씨는…… 괜찮으시던가요?"
12040-10 = "[s] \"……응. 다행히 건강은 괜찮아 보였어.\""
12040-11 = "……응, 다행이네요☆"
12040-12 = "아무래도 병원에 여럿이서 몰려가는 건 민폐일 거 같아서…… 함께 가지 않았지만."
12040-13 = "나중에라도 시로코 쨩이랑 호시노 선배를 데리고 같이 가야겠네요."
12040-14 = "……그치만. 건강은 괜찮다, 라는 건……"
12040-15 = "뭔가 다른 문제가 생겼다는 얘기……죠?"
12040-16 = "[s] \"……노노미는 눈치가 빨라서 큰일이야.\""
12040-17 = "아하하…… 왠지 그런 느낌이 들었어요."
12040-18 = "세리카 쨩, 아야네 쨩과 같이 갔었는데, 선생님 혼자 돌아오셔서 또 뭔가 일이 생긴 걸까 싶어서……."
12040-19 = "응, 그럼 다 같이 모였을 때 얘기해주세요. 그런 얘기는 모두 함께 들어야 하니까."
12040-20 = "[s] \"응. 그래.\""
12040-21 = "……."
12040-22 = "그러고보면 선생님이 오신 뒤로 많은 것들이 변했는데……."
12040-23 = "우리에게도 처음으로 담당 고문 선생님이 생겼고, 우릴 괴롭히던 폭력단도 퇴치할 수 있었고……."
12040-24 = "필요하던 보급도 확보했고, 이런 저런 문제들을 헤쳐나갈 수 있었지만……."
12040-25 = "……또 그만큼 더 많은 일들이 우리 앞을 가로막는 거 같아요."
12040-26 = "헬멧단…… 흥신소…… 선도부……. 카이저 코퍼레이션……"
12040-27 = "다음엔 또 어떤 사건이 앞에 놓여있을지……."
12040-28 = "……."
12040-29 = "그래도 저희는……, 대책위원회는 계속 나아갈 수 있겠죠?"
12040-30 = "[s1] \"물론이야.\"\n[s2] \"당연하지.\""
12040-31 = "응응! 선생님이 그렇다고 하니, 분명 그럴 거예요."
12040-32 = "응응! 선생님이 그렇다고 하니, 분명 그럴 거예요."
12040-35 = "안녕. 노노미. 선생님."
12040-36 = "어라? 시로코 쨩도 일찍 왔네요?"
12040-37 = "……. 호시노 선배는?"
12040-38 = "선배요? 먼저 와 있어요. 학교 안 어딘가에서 또 낮잠을 자고 있지 않으려나 싶은데……."
12040-39 = "음. 알겠어."
12040-40 = "……."
12040-41 = "……선생님. 마스터는?"
12040-42 = "[s] \"마스터는…….\""
12040-43 = "응응! 마스터는 건강은 괜찮다고 해요☆"
12040-44 = "……그치만 뭔가 다른 사정이 있는 것 같으니 다같이 모여서 소식을 들어봐야 할 거 같아요."
12040-45 = "……응. 알았어."
12040-47 = "그럼 먼저 들어가 있을게."
12040-49 = "시로코 쨩……? 어쩐지……."
12040-50 = "[s] \"조금 이상해 보이지 않았어?\""
12040-51 = "여, 역시 그렇죠? 저도 비슷하게 느꼈는데……."
12040-52 = "어쩐지 약간 불안해보였다고 해야 하나……."
12040-53 = "으응. 기분 탓이면 좋겠지만……."
12040-54 = "[s] \"같이 가보자.\""
12040-55 = "으응? 네!"
12040-57 = "(콰앙!)"
12040-58 = "(콰당탕-!)"
12040-59 = "아아~ 아프잖아- 시로코 쨩."
12040-60 = "……시치미 떼는 것은 그만해. 선배."
12040-61 = "?!!"
12040-62 = "이 소리는……, 설마……!"
12040-65 = "[ns] 소리가 난 교실 안으로 들어간다."
12040-68 = "시치미라니, 무슨 말인지 이 아저씨는 잘 모르겠는걸……."
12040-69 = "……."
12040-70 = "……거짓말."
12040-71 = "거짓말이 아니라……. 응?"
12040-73 = "호시노 선배! 시로코 쨩! 무슨 일이에요!!"
12040-74 = "[s] \"진정해. 다들.\""
12040-75 = "으, 으음……."
12040-76 = "대체 무슨 일이에요? 응?"
12040-77 = "……호시노 선배에게 볼일이야."
12040-78 = "……."
12040-79 = "……미안한데 둘만 있게 해 줘."
12040-80 = "응, 안돼요~☆"
12040-81 = "……."
12040-82 = "대책위원회에 둘만의 비밀♡ 같은 건 없어요. 잘 알죠? 우리는 운명공동체니까."
12040-83 = "……으, 으음."
12040-84 = "그러니까, 제대로 이 상황에 대해서 설명하지 않으면……."
12040-87 = "혼나는 거예요☆"
12040-89 = "으, 으음……."
12040-90 = "어…… 그러니까……."
12040-91 = "……으헤~ 이 아저씨가 몰래 낮잠 자던 걸 걸려버렸지 뭐야."
12040-92 = "그치만 너무하잖아. 나의 게으름은 흔한 일이라고. 주변의 공기 같은 거라고."
12040-93 = "아, 으, 음……."
12040-94 = "그렇게 화내지 않아도 되는데. 시로코 쨩은 가끔씩 너무 엄하다니까."
12040-95 = "자아, 그럼 슬슬 모임 시간이니까. 동아리실로 가자고."
12040-97 = "……."
12040-98 = "으, 으음……."
12040-101 = "……."
12040-102 = "[s] \"괜찮아, 노노미?\""
12040-103 = "……. 네에. 뭔가 말하고 싶지 않은 게 있나 봐요."
12040-104 = "……."
12040-105 = "어쩔 수 없죠. 가끔씩은 누구라도 그런 비밀이 하나씩 있는 법이니까……."
12040-106 = "자아, 저희도 가요, 선생님. 모두 기다리고 있겠어요."
