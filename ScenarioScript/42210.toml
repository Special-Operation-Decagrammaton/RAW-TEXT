[translation]
42210-1 = "제21화;카르바노그의 굴속에서 2"
42210-2 = "오퍼레이션 룸"
42210-5 = "여, 여기는 FOX 3…… 미안, 꼴사납게 당해버렸어. <토끼>는 이미 포인트 리마를 지나쳤어."
42210-6 = "여기는 FOX 4. 이쪽도 마찬가지야. 매복 지점을 어이없이 노출당했어…… 현재 저격 지원은 불가능해."
42210-8 = "여기는 FOX 2. <토끼>가 포인트 오스카를 향해 현수 하강을 시도하고 있습니다."
42210-9 = "준비한 차단 대책은 무력화되었으며, 재정비가 필요합니다."
42210-15 = "……확인."
42210-16 = "이후 방어선은 FOX 1이 단독으로 구축하여 대응하겠다."
42210-17 = "FOX 2는 예정대로 대원들을 수습하여 작전 지역 밖으로 벗어나 퇴로를 확보하도록."
42210-21 = "……FOX 2. 모두 듣고 있나?"
42210-25 = "통신 두절인가……"
42210-26 = "그렇게 큰 폭발이 있었으니 회선이 불안정해졌다 하더라도 어쩔 수 없지."
42210-27 = "……오히려 소대원들에게 불필요한 말을 하지 않게 되어서 다행일지도 몰라."
42210-31 = "그럼 '마지막' 공세를 개시하러 가볼까."
42210-38 = "RABBIT 1, 레펠 하강 완료."
42210-39 = "선생님은 괜찮으신가요?"
42210-40 = "[s1] \"화물처럼 묶여서 내려오긴 했지만……\"\n[s2] \"괜찮아. 문제없어!\""
42210-43 = "다행히 다치신 곳은 없는 듯하네요."
42210-49 = "RABBIT 2, 레펠 하강 완료."
42210-53 = "……목표 지점인 오퍼레이션 룸은 저 앞인가?"
42210-54 = "응. 이 통로를 따라 직진하면 바로 저곳이 사일로의 최심부— 오퍼레이션 룸이야."
42210-56 = "적 소대를 모두 제압했다고는 하지만, 최소한의 방어 시설이 남아있을지도 모르므로 끝까지 긴장을 늦추어서는 안 됩니다."
42210-57 = "장비를 재점검한 뒤, 마지막으로—"
42210-68 = "……훌륭한 솜씨였다, 츠키유키 소대장."
42210-70 = "……유키노 선배."
42210-71 = "앞서 위층에서 진행된 전투의 결과는 알고 계시겠지요?"
42210-72 = "승기는 저희에게 넘어왔습니다. 불필요한 저항을 그만두고 순순히 투항하시지요."
42210-73 = "아니, 오히려 그 반대다."
42210-74 = "우리가 이 사일로에 먼저 들어온 시점에서, '전쟁'은 이미 우리가 승리했다."
42210-76 = "그게 무슨……"
42210-80 = "지금 내 손에는 <A.N.T.I.O.C.H.> 탄두를 즉시 자폭시킬 수 있는 버튼이 쥐어져 있다."
42210-81 = "너희가 오퍼레이션 룸에 들어오는 순간…… 바로 이 버튼을 누르겠다."
42210-86 = "이런 밀폐된 공간에서 탄두가 폭발한다면, 여기에 있는 모두가 목숨을 잃겠지만…… '작전'은 성공하겠지."
42210-87 = "그건 선배도 마찬가지일 텐데요."
42210-88 = "내 목숨은 중요하지 않아."
42210-89 = "작전을 위해서라면 무엇이든 수행할 수 있는 것이 SRT니까."
42210-92 = "………"
42210-93 = "……목숨이 아깝다면 돌아가라. 선배로서 베푸는 마지막 호의다."
42210-99 = "……선생님."
42210-100 = "[s] \"……포기하고 싶지 않은 거지?\""
42210-101 = "……네."
42210-102 = "작전을 위해서라면 무엇이든 할 수 있는 건 저희도 마찬가지니까요!"
42210-104 = "[ns] \"……그럼 해야지!\""
42210-105 = "고작 그런 블러핑에 우리가 꼬리를 말고 도망칠 거라고 생각한 거야?"
42210-106 = "그렇게 재미있어 보이는 버튼을 나보다 먼저 누르도록 놔둘 수는 없지. 쿠히히……"
42210-107 = "SRT의 미래를 위해서라도…… 여기서 물러날 수는 없어!"
42210-109 = "전원, 사주 경계!"
42210-113 = "RABBIT 소대, 오퍼레이션 룸을 향해 돌입합니다!"
