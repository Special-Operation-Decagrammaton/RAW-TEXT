[translation]
10046070-1 = "제7화;우리는 지금 토요일 밤"
10046070-8 = "아아~ 과연. 역시 이렇게 되었나~"
10046070-13 = "벌써 알아냈어?!"
10046070-14 = "[s1] \"빨라!\"\n[s2] \"알고 있는 건가, 카스미덴?!\""
10046070-20 = "응? 아, 뭐어~ 원래 개발 목적으로 조사했던 곳이니까~"
10046070-21 = "그리고 무엇보다~"
10046070-22 = "경험에서 오는 짬이란 게 있으니까, 와~하하핫~!!"
10046070-23 = "자, 그러면 제군……."
10046070-27 = "개발을 시작하지."
10046070-31 = "이게 어떻게 된 겁니까?!"
10046070-38 = "어째서 온천개발부가 여기 있는 거죠?"
10046070-39 = "이치카, 준비하세요! 이번에야말로 얼씬도 못 하게 쫓아내죠!"
10046070-44 = "제가 불렀습니다."
10046070-48 = "……이치카?"
10046070-53 = "하스미 선배, 이번 한 번만 못 본 척 넘어가 주세요. 부탁드립니다."
10046070-54 = "도대체 이게 무슨……?"
10046070-55 = "온천개발부의 위험성을 가장 잘 아는 건, 이치카 당신이 아니었나요?"
10046070-56 = "[s3] \"나도 부탁할게.\"\n[s4] \"이치카는 정말 최선을 다했어.\""
10046070-61 = "선생님까지…… 알겠습니다."
10046070-62 = "두 분이 그리 말할 정도라면, 분명 사정이 있겠죠."
10046070-63 = "대신, 일이 끝나면 상세히 설명해 주셔야 할 겁니다."
10046070-64 = "감사합니다!"
10046070-68 = "저기~! 카스미 부장 베프~!"
10046070-72 = "베프는 뭔 놈의 베프임까?!"
10046070-73 = "응? 부장이 그렇게 말했는데 아니야?"
10046070-74 = "그 인간을 진짜……."
10046070-75 = "[s5] \"이번 기회에 사이좋게 지내는 건 어떨까…….\"\n[s6] \"선생님은 그렇게 생각하는데…….\""
10046070-81 = "선생님."
10046070-82 = "세상에는 해도 되는 말이 있고, 아닌 말이 있는 검다."
10046070-83 = "[s7] \"앗, 죄송합니다.\"\n[s8] (시선을 피한다.)"
10046070-86 = "카스미 부장이 왜? 부장은 사교적이라 누구와도 원만하고 친하게 지내는 성격인걸."
10046070-87 = "본인 주장 아닙니까?"
10046070-88 = "어떻게 알았어? 아하, 역시 둘이 친하구나!"
10046070-89 = "그게 아니라…… 에휴, 부원들한테 뭔 잘못이 있겠슴까~"
10046070-90 = "……아니, 부원들 잘못도 꽤 있지 않나?"
10046070-91 = "아, 그나저나 깜빡했다! 부장이 빨리 오라고 그랬어!"
10046070-92 = "네? 공사에 뭔가 차질이라도?"
10046070-93 = "아니~ 공사는 다 끝났고, 준공식을 해야 하니 의뢰주가 필요하다고."
10046070-94 = "벌써 끝났다고요? 설마 부실 공사를…….?"
10046070-95 = "자, 이쪽이야!"
10046070-105 = "……온천이잖슴까."
10046070-110 = "이래서 아마추어는 곤란하다니까!"
10046070-111 = "자재 자체는 온천을 지으려고 가져온 것이니까, 그런 모습으로 보이기야 하겠지."
10046070-112 = "하지만, 결정적인 부분에서 꽝이야! 온천수가 나오지 않는다! 그렇다면 온천이라 부를 수 없지!"
10046070-113 = "그래도 임의로 전기를 끌어다 온수가 나오게 해뒀고, 유황 성분이 든 입욕제를 넣어뒀으니 느낌 자체는 느낄 수 있을 거야."
10046070-114 = "그렇지만, 느낌 정도라고! 진짜 온천에 비하면 한참 부족하니까!"
10046070-115 = "오, 되게 신났네…… 진짜 온천을 좋아하긴 하는구나."
10046070-116 = "아니, 아니, 그보다 왜 이런 모양이 된 검까? 원래 건물이랑 전혀 다르지 않슴까?!"
10046070-120 = "무엇보다 속도가 중요한 의뢰라고 이해했으니까."
10046070-121 = "그러니 자재를 공수하는데 시간을 쓰기보다는, 있는 자재를 쓰는 수밖에. 그리고 애초에 온천을 지으려고 가져온 만큼, 온천풍이 된 거지"
10046070-122 = "……돌려준 자재를 그대로 쓴 겁니까?"
10046070-123 = "응? 뭐, 보다시피?"
10046070-124 = "그러면, 당신 입장에서는 결국 아무것도 소득 없는 거 아닙니까?"
10046070-125 = "어쩌다 보니 그렇게 되었네."
10046070-126 = "왜 그렇게까지 합니까?"
10046070-127 = "약속을 했으니까."
10046070-131 = "……역시, 당신 조금……."
10046070-136 = "다들! 나기 쨩이 이쪽에 오고 있어! 서둘러야 해!"
10046070-137 = "카스미 쨩! 정말 미안한데……!"
10046070-138 = "아아, 알고 있다고~ 초대하지 않은 손님이 있다면, 긴장될 수밖에. 조연은 눈치껏 빠져야지."
10046070-139 = "소중한 친구를 위해서, 말이네?"
10046070-143 = "으, 응! 건물 건도 그렇고, 정말 고마워!"
10046070-144 = "감사는 내가 아닌 이치카 쨩한테 해두라고~"
10046070-152 = "설마 세이아 씨에게 티파티의 품위를 논하게 될 줄은……."
10046070-153 = "불가항력이었습니다. 그렇게 차를 잔뜩 마시게 하고, 대체 뭘 바란 건가요?"
10046070-154 = "이 일은 나중에 미카 씨가 있을 때 다시 한번……?"
10046070-158 = "……? 어라, 별장이……?"
10046070-159 = "다들! 어서 와! 잘 즐기고 왔어?"
10046070-160 = "아, 미카 씨. 정말, 말도 아니었습니다. 아까 그 장면을 보여 드리고 싶군요."
10046070-161 = "그나저나, 저희 별장 모습이, 뭔가 좀 바뀌지 않았나요?"
10046070-165 = "어, 글쎄?! 내가 보기에는 똑같은데. 조금 단장해서 분위기가 다르게 느껴지는 거 아닐까?"
10046070-166 = "그 정도로 표현할 만한 느낌이 아닌데……."
10046070-168 = "……오늘은 여러모로 강행군이었으니까요. 피로 때문에 그렇겠죠. 제가 보기에도 별장은 별로 바뀌지 않았습니다."
10046070-170 = "그럴까요? 세이아 씨까지 그리 말한다면, 틀림없겠습니다만."
10046070-171 = "당장은, 무엇보다 방에 들어가서 쉬고 싶네요."
10046070-175 = "아, 목욕물 준비해 뒀어!"
10046070-176 = "어머. 친절한 배려 감사합니다. 그러면, 먼저 실례하겠습니다."
10046070-182 = "……후훗. 무슨 일이 있었는지 몰라도 꽤 고생한 모양이네요."
10046070-183 = "어쩌다, 그리고 어떻게. 건물을 새로 지었는지 모르지만…… 수고했어요."
10046070-184 = "눈치챘어?!"
10046070-185 = "되려 반문하고 싶어지네요. 왜 모를 거라 생각했나요?"
10046070-186 = "아무리 제가 보증했어도, 평소 나기사였다면 씨알도 먹히지 않았을 겁니다."
10046070-187 = "……네, 평소의 나기사였다면요."
10046070-188 = "응? 그건 무슨 뜻?"
10046070-189 = "조금 힘을 빼도 괜찮다는 겁니다. 쉬운 일은 아니겠죠. 오늘의 일정, 그 자체만으로도 우리가 품고 있는 부채감이 드러나는 셈이니까요."
10046070-190 = "그렇지만, 지금 미카는, 조금 과하게 쫓기는 감이 있어요. 이유는 짐작이 갑니다만, 당신과 나기사 사이의 관계는 그토록 허술한 것이 아닐 텐데요."
10046070-191 = "그저 그런 이야기입니다. 그럼 저도 오늘은 드물게 기특한 미카의 호의에 순응해, 먼저 실례하겠습니다."
10046070-197 = "……뭐야, 또 갑자기 뭔지 모를 소리만 잔뜩 늘어놓고."
10046070-198 = "선생님은 좀 알 것 같아?"
10046070-199 = "응? 선생님은 모르지만…… 나라면 알 수도 있을 거라고?"
10046070-200 = "……뭐야, 그게. 선생님까지 세이아 쨩 닮아가는 거야?"
10046070-205 = "……무슨 냄새가 나지 않나요?"
10046070-209 = "……! 아참! 냄비를 불에 올려놓고 왔어!"
10046070-210 = "그러면, 이따 얘기하자, 선생님!"
10046070-222 = "(이후 저녁 식사를 마치고, 나기사와 세이아 모두 더없이 편안한 모습으로 잠자리에 들었다.)"
10046070-225 = "다들~ 수고했어~!"
10046070-226 = "고생 많았습니다!"
10046070-231 = "설마, 뒤에서 세 분께서 그렇게 고생하고 계셨을 줄이야."
10046070-232 = "그것도 모르고 편안히 바캉스를 즐기는 꼴이었다니, 정말 부끄럽기 그지없습니다."
10046070-233 = "그렇지도 않아. 하스미 쨩이 없었다면, 우리도 안심하고 다른 준비를 할 수 없었을 테니까."
10046070-234 = "이거, 섭섭한데~ 우리는 숫자로 안 쳐주는 거야?"
10046070-235 = "온천개발부……."
10046070-236 = "애초에 문제를 일으킨 장본인들이 무슨 말입니까?"
10046070-237 = "하핫! 역시 그런가? 부부장님은 냉정하구만~"
10046070-238 = "빚을 졌다고는 생각하지 않지만, 도움을 받은 것은 틀림없군요."
10046070-239 = "설마 당신들에게 감사하는 날이 올 줄이야……."
10046070-244 = "응? 왜? 모두 만족했으니까 다 해결된 거 아니야?"
10046070-245 = "그렇지! 그렇지! 역시 메구는 똑똑하다니까!"
10046070-246 = "앗, 그러고 보니, 어떻게 한 거야?"
10046070-247 = "분명 건물이 폭삭 내려앉을 만큼 지반이 나쁘다고 했는데……."
10046070-248 = "아아, 그건 간단해. 지하수 때문이야."
10046070-249 = "지하수?"
10046070-250 = "수맥이 흐른다는 거야. 지하수의 이동에 따라 토사가 유출되어 지반 자체가 약해질 뿐만 아니라, 습기 때문에 건축재의 노후도 빠르게 일어나지."
10046070-251 = "이런 까다로운 장소에 건물을 세우려면, 첫 토대를 세울 때부터 방수 대책을 철저히 하고, 기초 공사를 안정적으로 해야 했어."
10046070-252 = "뭐, 요컨대 무사안일주의가 일으킨 인재라는 셈이지."
10046070-254 = "헤에~ 카스미 쨩은 박식하구나."
10046070-258 = "[ns9] \"잠깐, 지금 뭐라고……?\"\n[ns10] \"수맥이 흐른다고……?\""
10046070-261 = "……그리고, 수맥이 흐르는 것은, 충분히 깊이 굴착하기만 하면 지열로 가열된 물이 솟는다는 뜻과 같지."
10046070-265 = "그래, 그 말은 즉……!"
10046070-270 = "[ns11] \"미, 미카!! 카스미를 멈춰!!\"\n[ns12] \"아, 안돼, 너무 늦었……!!\""
10046070-275 = "와~하하하핫!! 그래, 바로 온ㅊ……!!"
10046070-287 = "게흑……?!"
10046070-288 = "……어, 언제부터 눈치를……?"
10046070-295 = "처음부터."
10046070-296 = "……하핫! 너는, 역시 나와, 닮았……."
10046070-300 = "……정말, 끝까지 방심할 수 없는 상대네요."
10046070-302 = "뭐야, 뭐야? 지금 어떻게 된 거야?"
10046070-303 = "방금 카스미 쨩이 꺼냈던 거는…… 폭탄 스위치인 거야?!"
10046070-304 = "뭐, 그런 느낌임다. 시공 중에 건물 밑에 숨겨뒀거나 한 거겠죠."
10046070-305 = "혹시나 하고 대비했지만, 설마 진짜 저지를 줄이야. 그래도 스위치만 회수하면 문제는……."
10046070-314 = "무슨 일이죠? 이 늦은 시간에, 굉장히 어수선하네요."
10046070-315 = "지금 나오는 것은, 좋지 않은 예감이 듭니다만……."
10046070-326 = "……게헨나, 인가요? 어째서 게헨나 학생이 여기?"
10046070-330 = "자, 잠깐만! 내가 전부 설명할 수 있으니까!"
10046070-331 = "어라, 이건 뭐죠?"
10046070-335 = "뭔가의 스위치인가요?"
10046070-339 = "앗, 잠……,"
10046070-340 = "에잇."
10046070-361 = "……???"
