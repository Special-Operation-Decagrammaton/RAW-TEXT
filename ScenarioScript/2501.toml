[translation]
2501-1 = "매너가 게임을 만든다 1"
2501-2 = "밀레니엄 게임개발부"
2501-7 = "으으…… 으으읏……!"
2501-8 = "뭐하고 있는 거야, 언니?"
2501-9 = "방해하지 마, 미도리! 지금 중요한 순간이란 말이야!"
2501-10 = "한 대만. 한 대만 더 때리면 승리가 눈 앞에……!"
2501-11 = "아, <스튜던트 파이터 2> 하고 있구나. 요새 열심히 플레이하네."
2501-12 = "응, 요번에 온라인 매치 기능이 추가되어서 게임센터의 유저들과 실시간 대전이 가능해졌거든."
2501-13 = "그동안 시시한 상대뿐이라 지루했는데……"
2501-14 = "오랜만에 제법 괜찮은 상대를 만났어."
2501-20 = "좋았어, 구석에 몰아붙였어! 이제 잡기 기술로 적의 가드를 무효화시키면—"
2501-22 = "아니? 여기서 가드 회피 후 어퍼컷이라고?!"
2501-23 = "그 후에 이어지는 연속 콤보에…… 필살기까지?!"
2501-29 = "<SYSTEM> 'Peach_Fighter' 선수의 패배!"
2501-30 = "으앙, 이게 뭐야! 마지막의 실수로 순식간에 역전당했잖아!"
2501-31 = "아깝네. 정말 간발의 차이였는데……."
2501-32 = "그래도 어쩔 수 없지. 승부는 승부니까."
2501-33 = "우선은 좋은 경기를 보여준 상대에게 감사의 메시지라도 남길까."
2501-35 = "<Peach_Figther : 좋은 승부였어, Sukeban312. 다음에 기회가 되면 또 승부하자.>"
2501-36 = "<Sukeban312 : ㅋㅋㅋ 허접 ㅋㅋㅋ 엄마 젖이나 더 먹고 와라>"
2501-37 = "뭐, 뭐라고? 말이 심하잖아!"
2501-39 = "<Peach_Figther : 잠깐, 그 말투는 뭐야? 유치한 어린애도 아니고!>"
2501-40 = "<Sukeban312 : 어린애는 그쪽이겠지. 아니, 조작 속도가 느릿느릿한 게 어린애가 아니라 할머니인가?>"
2501-41 = "하, 할머니라니……!"
2501-43 = "<Peach_Figther : 그러는 너도 나한테 거의 질 뻔 했잖아!>"
2501-44 = "<Sukeban312 : 응? 어디서 누가 울고 있나? 패배자의 목소리는 안 들리는데~.>"
2501-45 = "야! 너 어디 살아! 주소 불러!"
2501-46 = "<SYSTEM> 상대가 당신을 차단했습니다."
2501-47 = "……."
2501-49 = "……우와, 심하네."
2501-50 = "뭐야……."
2501-52 = "뭐냐고, 이 비매너 플레이어 녀석은!"
2501-54 = "이런 일이 있었기 때문에……"
2501-55 = "지금부터 현실 PK를 하러 간다!"
2501-57 = "우, 우리도……?"
2501-58 = "……저희도 같이 갑니까?"
2501-59 = "물론이지! 현실 PK에서 중요한 건 무엇보다 기선 제압이라고!"
2501-60 = "어차피 상대는 게임밖에 모르는 너드일 게 분명하니까, 여럿이 떼를 지어 몰려가면 지레 겁을 먹고 먼저 사과할 거야!"
2501-61 = "그건 이쪽도 마찬가지가 아닐까……."
2501-62 = "언니, 이렇게까지 화를 낼 필요가 있는 거야? 고작 게임에서 지고 놀림을 받은 것 뿐이잖아."
2501-63 = "고작 게임이라니! 이건 게임개발부의 자존심이 걸린 일이라고!"
2501-64 = "그 녀석은 내가 먼저 건넨 호의를 짓밟았을 뿐만 아니라, 나를 할머니라고 불렀어!"
2501-65 = "할머니라니……"
2501-66 = "절대 용서할 수 없어!"
2501-67 = "……게임에서 진 것보다 할머니라고 불린 것 때문에 화가 난 거 아냐?"
2501-68 = "게다가 이런 매너 없는 게이머들은 대전 게임 환경에 조금도 도움이 되지 않아."
2501-69 = "게임을 할 때마다 이런 불쾌한 일을 계속 당하게 된다면, 누가 대전 게임을 하려 하겠어?"
2501-70 = "깨끗한 게임 환경을 위해서라도 이런 비매너 유저는 단단히 혼을 내줘야 해!"
2501-71 = "그렇습니다. 아리스도 어제 시작한 온라인 RPG에서 만렙 유저에게 PK를 당했을 때는 게임을 그만두고 싶을 정도로 낙심했었습니다……."
2501-72 = "물론 하루 만에 레벨을 따라잡아 바로 복수를 해주었지만요!"
2501-73 = "하루 만에 만렙을 찍다니…… 그 집념이 무서워……."
2501-74 = "게다가 언니도 가끔 게임에서 이기면 상대를 도발하기도 하잖아?"
2501-75 = "어제도 후루젤리 대전이 끝나자마자 '발로 싸워도 이기겠다'며 나를 도발했으면서……."
2501-76 = "윽, 그건…… 그러니까……."
2501-77 = "아, 아는 사람은 상관없잖아! 처음 보는 사람에게 막말을 하는 게 훨씬 더 무례한 일이라고!"
2501-78 = "여하튼! 상대의 대전 기록을 검색해보니 10분 전에 근처의 게임센터에서 접속한 기록이 발견되었어."
2501-79 = "그러니까 지금 바로 그 게임센터로 가면 그 괘씸한 비매너 유저를 찾아낼 수 있을 거야. 가서 아까의 일에 대한 사과를 받아내자고!"
2501-80 = "게임센터라면 마침 나도 볼 일이 있었으니까…… 같이 가는 것 정도라면 상관없어."
2501-81 = "사악한 마왕군 간부를 잡으러 떠나는 여행이군요. 4인 레이드입니다!"
2501-82 = "저…… 나는 게임센터에 볼 일도 없고, 싸우고 싶지도 않은데……."
2501-83 = "나는 빠지면 안 될까……?"
2501-84 = "안 돼! 이런 단체 공략에서는 한 사람, 한 사람의 역할이 중요하단 말이야!"
2501-85 = "네 사람이 4면을 둘러싸야 압박 효과가 제대로 나오는 법이라고!"
2501-86 = "하지만……"
2501-87 = "아, 그러고보니 유즈가 기대하던 신작 콘솔이 게임센터에서 시연중이라던데…… 어떤 기능이 추가되었는지 궁금하지 않아?"
2501-88 = "시, 신작 콘솔……!"
2501-89 = "어차피 유즈 혼자서는 절대로 나가지 않을 거잖아. 이 기회에 같이 보고 오자. 으응~?"
2501-90 = "우으…… 알겠어."
2501-91 = "그럼 나는 끼어들지 않고 지켜보고만 있을 테니까……."
2501-92 = "그거면 충분해!"
2501-93 = "빰빠밤! 4인 파티가 완성되었습니다!"
2501-96 = "좋아, 그럼 지금부터 괘씸한 그 게이머를 응징하러 가자!"
