[translation]
13360-1 = "제36화;수첩"
13360-6 = "효, 효과가 있어요……?"
13360-7 = "그래! 선배의 움직임이 멈췄어!!"
13360-8 = "저 번개 덩어리도 사라지고 있어요!!"
13360-9 = "해낸 거지? 그럼 호시노 선배를 되돌릴 수 있는 거야?"
13360-13 = "응……!! 이대로라면……."
13360-14 = "아니. 그건 불가능해."
13360-18 = "부, 불가능하다고요……?"
13360-19 = "공포로 완전히 반전된 호시노 선배는 더 이상 예전으로 되돌아오지 못해. 그건 죽은 사람을 되돌리는 것과 같은 일이야. 불가능해."
13360-20 = "나와 마찬가지로."
13360-21 = "그, 그치만…… 그 말은……. 선배를……?"
13360-22 = "응. 나는 너희를 구하러 온 거야."
13360-27 = "이대로 호시노 선배의 헤일로를 파괴할 거야."
13360-28 = "뭐?!"
13360-29 = "그러지 않으면 호시노 선배에게 이끌려 소환되고 있는 <저것>이 현현하게 되고, 그건 아마도 세계의 멸망으로 이어지게 될 거야."
13360-30 = "하지만…… 선배를……."
13360-31 = "……선배가 원한 일이었어. 우리에게도 그렇게 부탁한 적이 있었잖아."
13360-36 = "……. 내가 알고 있는 것과는 다르지만, 이건 결국 스나오오카미 시로코에게 펼쳐진 확정된 미래."
13360-37 = "하지만 사실은 그러고 싶지 않았잖아."
13360-38 = "……."
13360-45 = "[ns] \"도와줘. 시로코. 방법이 없을까?\""
13360-46 = "방법……."
13360-47 = "방법이라……. 나는 결국 실패만을 반복해 왔지만……. 방법……."
13360-51 = "잠깐. 조금 다른 게 있어……."
13360-52 = "호시노 선배의 가슴에 있는 저것……."
13360-56 = "저런 건 처음 봐. 저건……. 뭔가 아직 현현하지 못한……? 형태를 가지지 못한……."
13360-57 = "저건……."
13360-58 = "어…… 저 모습은……."
13360-59 = "저거…… 수첩처럼 생기지 않았어……?"
13360-60 = "……!!"
13360-64 = "[ns] \"유메의 수첩……인가.\""
13360-69 = "나는……………."
13360-70 = "선배의 수첩은……. 대체……."
13360-71 = "……. 선배……."
13360-79 = "[ns1] \"호시노는 아직 헤매고 있는 거야. 이 아비도스 사막을.\"\n[ns2] \"유메의 수첩을 찾기 위해서.\""
13360-82 = "……."
13360-86 = "……호시노 선배."
13360-87 = "그렇네요……."
13360-92 = "그래. 아직 호시노 선배는 <테러>로 완전하게 반전된 상태가 아니야."
13360-93 = "아주 약간이지만, 저 수첩이…… 뭔가 현현되지 못하게 막고 있는 걸지도 몰라……."
13360-94 = "[s3] \"그러니까, 지금이 마지막 기회야.\"\n[s4] \"호시노에게 전해야만 하는 걸 전해야 해.\""
13360-97 = "……………………………………."
13360-102 = "-------------------------------!!!"
13360-103 = "다, 다시 움직이기 시작했어……!!"
13360-105 = "……. 상황 확인."
13360-106 = "프라나 쨩……?"
13360-107 = "방법 구축."
13360-112 = "호시노 씨의 <신비>가 완전히 반전되기 전에, 접촉할 방법이 있을 것 같습니다."
13360-113 = "어, 어떻게요?"
13360-114 = "……. 오버 클럭입니다. 아로나 선배. <싯딤의 상자>의 힘만으로 일종의 유사 <나람신의 왕좌>를 생성합니다."
13360-115 = "네?! 어, 어떻게……?! 그건 <방주>가 있어야만 가능했잖아요! <싯딤의 상자>의 힘만으론……."
13360-116 = "……조금 전에 <지하생활자>의 능력을 분석했습니다."
13360-118 = "차원과 차원, 시간과 시간, 존재와 비존재가 확정되지 않고 뒤섞여 있는 혼돈 영역…… 그 유사한 것을 만들 수만 있다면……."
13360-119 = "호시노 씨에게 목소리 정도는 전달할 수 있을 겁니다."
13360-120 = "하, 하지만…… 그건…… 위, 위험하잖아요……."
13360-121 = "인정. 그렇습니다. 지금부터 연산 리소스의 99%를 선배에게 돌려드리겠습니다."
13360-122 = "그리고 저는 지금부터 일종의 가사 상태로 전환합니다."
13360-123 = "가, 가사 상태요……?"
13360-124 = "네. 그 상태로 <싯딤의 상자>의 수면 아래로 침잠. 거기서 가상의 혼돈 영역을 구축합니다."
13360-125 = "하, 하지만…… 프라나 쨩이 돌아오지 못하면……."
13360-126 = "인정. 그렇기 때문에 이것은 선생님에게는 비밀입니다."
13360-127 = "하지만……."
13360-128 = "지금부터 시작입니다. 선배. 그 전에 부탁이 있습니다."
13360-129 = "네, 프라나 쨩? 뭔가요!"
13360-130 = "손을…… 잡아주실 수 있을까요……."
13360-131 = "손을요……?"
13360-132 = "네. 조금…… 무서워서……."
13360-138 = "……네!! 당연하죠!! 계속, 계속 잡고 있을게요! 절대 놓치지 않을 거예요!"
13360-139 = "감사합니다. 아로나…… 선배."
13360-142 = "[ns] 아로나에게 방법을 설명 들었다."
13360-146 = "[ns] 그리고 모두에게 방법을 전한다."
13360-147 = "선생님이…… 호시노 선배의 몸에 접촉해야 하는 거네요……."
13360-148 = "응. 정확히는 저 수첩에 선생님의 <싯딤의 상자>가 접촉하면……."
13360-149 = "으, 으으…… 그러려면 엄청 가까이 가야 하는데……."
13360-150 = "일단 호시노 선배를 쓰러트려야만 해요."
13360-151 = "……알겠어. 호시노 선배를 제압하고, 저 수첩에 접근하겠어."
13360-153 = "선생님. 나에게도 지휘를 내려줘."
13360-154 = "우리끼리 가능……할까……."
13360-155 = "……. 내가 돕겠어."
13360-159 = "[ns] \"히나!! 몸은 괜찮아!? 움직이면…….\""
13360-160 = "아니, 이 정도는 아무것도 아니야. 상황은 이해했고, 시간이 없으니까 빠르게 가자. 내가 도울 테니까."
13360-161 = "……."
13360-162 = "또 다른 스나오오카미 시로코. 저번엔 선생님에게 신세를 졌다지? 뭔가 문제라도?"
13360-163 = "……아니."
13360-164 = "서둘러야 해요!! 저 번개가 다시 커지고 있어요!"
13360-165 = "응. 이게 마지막 기회야. 가자."
