[translation]
34260-1 = "제26화;앞으로의 우리들"
34260-6 = "자, 여러분! 카타콤의 길은 세이아 님이 알려주신 대로만 하면 길을 잃을 일은 없을 겁니다!"
34260-7 = "네, 네……!!"
34260-8 = "이치카, 그쪽은 어떤가요? 선생님은 찾았나요?"
34260-9 = "(치익) 아, 네. 찾았습니다. 그런데……. 츠루기 선배가……."
34260-10 = "……네? 츠루기가?"
34260-17 = "진정하지말임다, 츠루기 선배. 거기는 문이 아니라 벽……."
34260-21 = "아, 망했다."
34260-26 = "……키키키키키키."
34260-30 = "캬아아아아아아악--!!"
34260-35 = "[ns] \"츠루기…….\""
34260-36 = "……정의실현부? 어, 어째서 여기에……."
34260-37 = "아, 아아. 안녕하세요, 선생님. 정의실현부의 이치카입니다."
34260-38 = "저번에 미식연구회 체포 때 잠깐 뵈었었죠. 직접 대화하는 건 처음이지만…… 보시다시피 구하러 왔습니다."
34260-39 = "[s] \"응, 여기서 보니 너무 반갑네, 이치카.\""
34260-40 = "에헤. 선생님에게 인사받으니 좋네요."
34260-44 = "하스미 선배, 선생님과 미카 님도 확보했습니다."
34260-45 = "(치익) 그런가요? 그럼 빠르게 안전 지역으로 퇴각을…… 선생님을 카타콤에 확보된 루트로 안내합니다!"
34260-46 = "네에- 네에. 자, 가시죠. 여러분을 기다리고 있는 사람이 있슴다."
34260-55 = "선생님……!! 미카 씨……!! 무사하셨군요!"
34260-57 = "나, 나기 쨩……? 어, 어떻게 여기에……."
34260-59 = "여기가 바로 아리우스 수복작전의 지휘본부예요……."
34260-60 = "어, 어떻게 여기에 온 거야……? 어떻게 알고?"
34260-62 = "제가 알려주었습니다."
34260-63 = "[ns] \"세이아……?!!\""
34260-69 = "세……"
34260-70 = "세이아…… 쨩……."
34260-71 = "정말로 바보 같은 아이군요. 미카."
34260-72 = "늘 그렇듯이 충동적으로 일을 그르쳤어요. 그게 당신의 나쁜 습성입니다."
34260-73 = "……세이아 쨩. 어, 어떻게…… 어떻게 된 거야……."
34260-74 = "……말하자면 길어요."
34260-79 = "백일몽 속에서 우연히 누군가를 만나지 못했다면……."
34260-80 = "아아. 많은 일들이 있었지만…… 말하자면 작은 거래를 하고 어떻게든 거기서 탈출할 수 있었던 거죠."
34260-83 = "세, 세이아 님……?!"
34260-84 = "쿨럭, 쿨럭……"
34260-85 = "다, 단장님! 세이아 님이……!! 세이아 님이!"
34260-86 = "부탁드려요, 지금 당장 나기사를…… 시스터후드와 정의실현부를 여기에……!!"
34260-87 = "네?! 네네!!"
34260-88 = "시간이 없어요…… 지금 바로 선생님과 미카를 구하러 가야 해요……!!"
34260-90 = "정신을 차리자마자 저는…… 시스터후드와 구호기사단, 그리고 정의실현부를 호출해서 이곳으로 사람들을 출동시켰습니다."
34260-91 = "한 가지 분명한 건 나기사는 미카를 구할 수만 있다면, 자신의 권력을 전부 내려놓을 수도 있다고 억지를 부렸다는 거죠."
34260-93 = "……부탁드립니다. 여러분. 저를 도와주세요…… 미카 씨를 구해주세요……."
34260-94 = "네. 저도 부탁드리겠습니다."
34260-99 = "……."
34260-101 = "그런……."
34260-102 = "고개를 드세요. 나기사 님. 세이아 님. 당신들이 머리를 조아리다니, 당치도 않습니다."
34260-103 = "미카 님의 문제는 이해했습니다. 하지만 무엇보다 저는 세이아 님이 무사해서 다행이에요. 대체 무슨 일이 있었던 거죠?"
34260-105 = "그건…… 말하자면 길어서……"
34260-106 = "……알겠습니다."
34260-107 = "그렇다면 굳이 묻진 않겠습니다."
34260-108 = "무엇보다 선생님의 신변은 우리 모두에게도 중요한 일이겠죠……. 알겠어요. 저도 최선을 다하겠어요."
34260-109 = "트리니티에는 저뿐만 아니라 선생님의 신세를 진 학생들이 많습니다. 그들도 도움을 거절하지 않을 거예요."
34260-110 = "네. 그럼 부탁드립니다."
34260-115 = "……이 정도야. 이게 내가 알고 있는 카타콤의 변화 패턴식이야."
34260-116 = "네. 큰 도움이 되었어요. 고마워요. 아즈사."
34260-117 = "저기…… 정말로 내가 가지 않아도 돼?"
34260-118 = "네. 당신은 여기서 선생님을 맞이해주세요."
34260-119 = "이 임무조차 보충수업부…… 특히 당신의 도움을 받아버리면 우리들의 긍지…… 체면…… 그런 것들이 무너져버립니다."
34260-120 = "그래서 하나코 씨에게도 단순한 것만 부탁드렸으니……."
34260-121 = "이건 우리들이 해결할 수 있게 해주세요."
34260-122 = "으, 으응……."
34260-123 = "저, 저기……."
34260-124 = "네. 더 하실 말씀이라도?"
34260-128 = "아츠코…… 아츠코를 구해줘."
34260-129 = "……. 그 아이는 이미 선생님이 구해냈을 거예요. 아즈사. 우리는 그 선생님을 구하러 가는 거고요."
34260-130 = "……응. 그리고…… 기왕이면…… 다른 모두도 무사히…… 아무 일 없이…… 구할 수 있었으면 좋겠어……."
34260-131 = "……. 그런가요. 한때 당신에게 총을 겨누었던 사람들이었을 텐데……."
34260-132 = "……맞아. 수없는 악행을 저질러 온 악당들이지."
34260-137 = "하지만…… 내 가족들이기도 했어……."
34260-140 = "으, 으으으…… 지금 시간이 몇 시인 줄은 알고 있는 건가요……?"
34260-141 = "네. 모두가 잠든 인적이 드문 새벽이죠. 우이 씨. 저쪽 페이지를 찾아봐요."
34260-142 = "아, 아니…… 그런데 왜 그런 차림……."
34260-143 = "저도 산책…… 아니, 수영 중에 급하게 소식을 받고 온 거니까요."
34260-144 = "……음, 이건가? 다음 페이지로 가죠."
34260-145 = "수영……? 이 시간에……? 아니, 그 전에 산책이라는 말을 하지 않았나요?"
34260-149 = "잠깐! 저기, 그쪽이에요. 찾았어요, 이거예요! 고대 성도회가 남긴 카타콤의 고지도!"
34260-150 = "이, 이 페이지요? 거의 바스라져가는 상태인데……. 변색도 심하고……."
34260-151 = "네. 그러니까 제가 여기를 찾아온 거예요. 고서관의 마술사라 불리는 코제키 우이 씨에게."
34260-152 = "으, 아, 으으……."
34260-153 = "당신이라면 이 지도를 복원할 수 있겠죠? 시간이 없어요."
34260-158 = "그러니까 지금부터 이걸 복원해 보아요, 코.제.키.선.배.님.? 제가 힘껏 도와드릴 테니까요♡"
34260-159 = "……. 으, 으으……. 어쩌다 내가 이런 꼴이……."
34260-163 = "자, 빨리 움직이죠! 가장 가까운 유적지는 저쪽입니다!"
34260-166 = "네, 네!"
34260-171 = "저, 저기……!"
34260-172 = "응? 당신은……. 코하루……?"
34260-173 = "아, 아으…… 저, 저도 정의실현부인데…… 지, 지금은 보충수업부라서 함께 출동은 못하지만……. 저, 저기…… 선배……."
34260-174 = "그…… 티파티의 높으신 분께 이거를……."
34260-180 = "응……? 이건 뭐죠? 리본이랑 액세서리……?"
34260-181 = "그…… 정의실현부 압류품 창고에 남아있던…… 티파티의 높으신 분의 물건……인데."
34260-182 = "어라…… 그러네요. 이건 미카 님이 모아둔 그 액세서리들이군요……?"
34260-183 = "성난 학생들의 소요로 도둑맞아서 불타거나 했다고 들었는데……. 그 중에 정의실현부가 되찾은 게 압류품에 섞여 있었나 보네요?"
34260-184 = "아, 맞아요……. 그 중에 온전한 것들을 몰래 모아서……. 저, 저기…… 원래 그러면 안되지만……."
34260-185 = "……그렇군요. 알겠어요. 코하루."
34260-186 = "미카 님에게 전해주도록 할게요."
34260-187 = "아, 으…… 네……. 고맙습……니다."
34260-197 = "모두들……."
34260-198 = "우리도 언제까지 선생님에게만 기대고 있어서는 안 되죠. 우리도 선생님을 도울 수 있어야 그게 이상적인 상호보완 관계일 테니까요."
34260-199 = "그러니 이렇게…… 당신을 구하기 위해 온 거예요. 미카."
34260-200 = "……응. 세이아 쨩. 여전히 말을 너무 어렵게 하네. 진짜 너무 잘난 척 심해. 왕재수야."
34260-204 = "몇번이고 혼내주고 싶다고 생각했었어."
34260-205 = "그래도 너무 좋아해. 세이아 쨩."
34260-206 = "……네?"
34260-207 = "나기 쨩은 히스테리 완전 심해. 이런 데까지 와서 홍차를 놓지 못하다니, 너무 꼴불견 아냐?"
34260-213 = "혹시 카페인 중독? 아니면 강박증?"
34260-214 = "그런 나기 쨩을 너무 너무 좋아해."
34260-216 = "이, 이건…… 너무 긴장이 되어서……."
34260-217 = "……네?"
34260-222 = "응. 둘 다 너무 좋아해."
34260-223 = "……고마워. 응. 너무 좋아해. 고마워. 둘 다. 그리고 미안해……."
34260-228 = "미카 씨……."
34260-229 = "……아뇨. 오히려 제가 사과하지 않으면 안되겠죠. 미안해요. 미카."
34260-230 = "늘 당신에게 사과하고 싶었어요."
34260-231 = "하지만 그러지 못했죠. 유치하게 아이처럼……."
34260-232 = "…… 미카. 당신이 아리우스에게 화해하고 싶다는 말을 꺼냈을 때, 저는……."
34260-233 = "……아냐. 아무 말도 하지 마. 괜찮으니까. 응."
34260-234 = "내가 미안해. 내가 잘못한 거야……."
34260-235 = "미카 씨……."
34260-236 = "미카……."
34260-243 = "아, 저기. 좋은 분위기인데 초쳐서 죄송함다. 미카 님, 전해드릴 게 있어서요."
34260-244 = "응? 나……?"
34260-245 = "이거 받으세요."
34260-249 = "이건……."
34260-253 = "내…… 액세서리들……? 어, 어떻게? 전부 사라졌었는데……?!"
34260-254 = "아아. 네. 그 압류품 보관창고 담당 부원이 있는데……"
34260-255 = "끄응. 설명하기가 힘든데……"
34260-256 = "그 아이가 미카님이 빼앗긴 액세서리들 중에 불타지 않고 남은 걸 숨겨 두었나 봐요."
34260-257 = "코하루 쨩이……?"
34260-258 = "네. 코하루라고,"
34260-259 = "아니, 네?! 코하루를 아세요?"
34260-260 = "……응. 알고 있어."
34260-261 = "……고마워. 코하루 쨩. 나는 너에게 못되게 굴었는데…… 너는……."
34260-266 = "……."
34260-271 = "……."
34260-272 = "[ns] \"서로 나눌 말이 많겠네. 모두.\""
34260-273 = "……네. 그렇겠네요."
34260-274 = "그럼 슬슬 가 볼까요. 시간이 없네요. 미카 씨의 청문회가 곧 열릴 거니까요."
34260-275 = "네."
34260-276 = "응, 저기, 그런데 나 이런 꼴로 가야 하는 거야?"
34260-277 = "먼저 씻으면 안 되려나? 상처 치료도 받고 싶고. 사람들 앞에 서야 하는 거니까 드라이도 해야 하고."
34260-281 = "……."
34260-282 = "……."
34260-283 = "하아. 어쩔 수 없죠. 그렇게 해요. 미카."
34260-284 = "네……. 저희 세 명 모두 다 청문회에 가지 않으면 안 되니까. 게다가 저희도 밤을 꼬박 새워서 꼴이 말이 아니기에……."
34260-286 = "[ns] \"나도 함께야!\""
34260-288 = "……네. 물론이죠. 선생님. 함께 다 같이 청문회에 참석하는 게 애초에 우리들의 약속이었으니까요."
34260-290 = "다음화;에필로그"
