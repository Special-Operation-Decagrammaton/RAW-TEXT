[translation]
21130-1 = "제13화;Nerd VS Maid"
21130-2 = "밀레니엄 본교사 통제실"
21130-3 = "(콰과과과광)"
21130-4 = "끄앙!"
21130-5 = "다, 당했습니다!"
21130-6 = "부활 주문을…… 부탁합니……"
21130-8 = "(털썩)"
21130-10 = "……."
21130-11 = "어이가 없네."
21130-12 = "그래서 선택한 방법이…… 학생회 강행돌파라니."
21130-13 = "이 아이가 아리스 양이로군요."
21130-14 = "귀.여.워.라. 여섯 번째 에이전트 메이드로 키우고 싶어지네요. 제가 데려가도 될까요?"
21130-15 = "……안돼."
21130-16 = "어디까지나 학생회를 습격한 범인인 만큼, 일단 학생회 내부에 있는 상담실에 가둬 둘 거야."
21130-17 = "어쨌든, 곤란하네. 설마 승강기의 '지문 인식 시스템'을 돌파하겠다고 문을 쏴버릴 줄이야."
21130-18 = "승강기 도어락은…… 수리가 불가능합니다. 당장 바꿔야 합니다."
21130-19 = "…… 흐음. 그럼 새로운 거로 교체…… 아니 잠깐만."
21130-20 = "생각해보니, 아리스 쨩의 저 무기는…… 엔지니어부에서 만든 거겠지."
21130-21 = "기본적으로 이런 일이 발생하면 엔지니어부에 의뢰했지만……"
21130-22 = "이번엔 신중할 필요가 있어."
21130-23 = "엔지니어부의 작품을 제외한, 키보토스에서 가장 강력한 시큐리티를 구입하도록 해."
21130-25 = "밀레니엄 복도 외곽"
21130-26 = "크윽! 아리스가 끌려가고 있어!"
21130-27 = "침착해. 모모이. 계획대로야."
21130-28 = "아리스 쨩…… 기다려. 곧 꺼내 줄 테니까."
21130-31 = "일단은…… 첫 단추는 잘 끼워진 것 같네."
21130-32 = "그렇지? 선생님?"
21130-33 = "[s1] \"맞아.\"\n[s2] \"엔지니어부에게 준비는 끝났냐고 물어봐 줘.\""
21130-34 = "엔지니어부 쪽에서의 연락. '수고했다. 트로이를 심는 데 성공했다.'"
21130-35 = "엔지니어부 쪽에서의 연락. '수고했다. 트로이를 심는 데 성공했다.'"
21130-36 = "휴우. 다행이다. 만약 이게 실패했으면 아리스가 그냥 감금만 당하고 끝날 뻔했잖아."
21130-37 = "다음 스텝으로 넘어가자."
21130-39 = "자, 시작해 볼까."
21130-40 = "하아…… 긴장돼."
21130-41 = "고대역사연구회 건물을 습격했을 때 이후 이런 기분은 처음이야."
21130-42 = "히비키와 우타하 선배는?"
21130-44 = "이미 '손님'을 맞이할 준비는 끝났어."
21130-45 = "좋아."
21130-46 = "별로 안 좋은 것 같은데."
21130-47 = "마키와 코토리는?"
21130-48 = "대기중~"
21130-49 = "맡겨만 주세요! 내 이론상 이 작전이 성공할 확률은 2% 이상입니다!"
21130-50 = "실패 확률이 98% 이하라는 얘기잖아!"
21130-51 = "에헤헷. 농담이에요, 농담! 그 반대예요!"
21130-52 = "코토리 쨩과 마키 쨩까지 준비가 끝났다면……."
21130-53 = "2단계에 돌입하는 거지."
21130-54 = "그렇다면…… 선생님!"
21130-55 = "[s] \"작전 개시!\""
21130-57 = "네!"
21130-58 = "해보는 거야!"
21130-60 = "밀레니엄 본교사 통제실"
21130-62 = "(삐삑-삐빅-)"
21130-63 = "온 건가."
21130-64 = "감시 카메라에서 대상 확인. 통칭 제1번 입구. A1 포인트에 타겟 등장."
21130-65 = "곧 있으면 A2 포인트로 진입합니다."
21130-66 = "거기까지 들어오면, 탈출은 거의 불가능하다는 말이죠? 알겠어요. 제가 나가죠."
21130-67 = "헤에. 직접 나갈 필요가 있을까?"
21130-68 = "물론이죠."
21130-71 = "최선을 다해 손님을 맞이하는 것이 메이드의 기본 자세니까요."
21130-73 = "밀레니엄 베리타스"
21130-74 = "(2시간 전)"
21130-75 = "일단, 우리의 타겟 '거울'이 있는 학생회 압류품 보관소에 대해 설명할 게."
21130-76 = "기본적으로 수상쩍은 구석이 많은, 밀레니엄 학생회 '세미나'는, 밀레니엄 타워의 최상층을 전용 플레이스로 사용하고 있어."
21130-77 = "그중 우리의 타겟인 학생회 압류품 보관소는, 최상층 서쪽 방향에 있지."
21130-78 = "정보에 의하면 입구부터 압류품 보관소까지 약 400개의 감시 카메라와 약 50개 정도로 추측되는 경비 로봇, 거기에 블랙기업에서 차압해온 전투 로봇들 수십 개를 돌파해야 해."
21130-79 = "정확히는 442개의 감시 카메라와 3종 52개로 분류된 경비 로봇들이야."
21130-80 = "거기 보안 시스템 구축에 협력한 게, 바로 엔지니어부거든."
21130-83 = "우와아……."
21130-84 = "가장 큰 문제는, 압류품 보관소로는 무조건 승강기를 사용해야 해. 이 승강기는 학생회 임원이나 자격을 부여받은 사람들 아니면 지문 인식 시스템을 통과할 수 없어."
21130-85 = "설령 승강기를 돌파한다고 해도, 학생회 소속 학생들과 무장 경비들을 마주치게 될 테고, 무엇보다……"
21130-86 = "학생회 전용 플레이스는 각 방별로 섹터화 되어 있어."
21130-87 = "섹터……?"
21130-88 = "만약 어느 방에 불이 나거나 연기가 발생했을 때, 셔터를 내려 방을 분리해버리는 방식이야."
21130-89 = "셔터가 내려가면, 오직 학생회의 지문으로만 해제할 수 있어."
21130-90 = "그 외의 지문이 입력되면? 티타늄 재질로 더 강력해진 두 번째 셔터가 내려오게 되지. 이때부터는 오직 학생회 임원의 지문과 홍채 인식, 이 두 가지 인증을 동시에 통과해야만 해."
21130-91 = "으으음. 너무 현란해서 오히려 실감이 안 되는데."
21130-92 = "정리하면, 각 '층별'로 이동할 수 있는 방법은 승강기뿐이며……"
21130-93 = "대부분의 통로에는 지문을 이용한 보안 장치가 존재하며, 통과하지 못하면 셔터가 내려오는 섹터형 구조."
21130-94 = "통과하지 못할 때마다 더 강력한 셔터가 내려와 갇히게 된다……."
21130-95 = "무장 경비들과 감시 카메라를 빼놓지 말아줘~"
21130-96 = "그리고 감시 카메라만이라면…… 해킹할 수 있겠지만, 보안장치는 베리타스라 해도 불가능해. 오직 내부망으로만 연결되어 있으니까."
21130-97 = "억지로 승강기에 진입하려고 하면 층 전체의 섹터가 차단된다는 것도 방금 알아냈어."
21130-99 = "으아아아! 절망적인 소식뿐이잖아! 뭔가 좋은 소식은 없어?!"
21130-100 = "……약점은 있어. 그걸 만든 게 우리라서 알아."
21130-101 = "일단은 외부 전력을 차단하는 방식에 약해. 그렇게 되면 자연히 외부망으로 연결되고, 일시적으로 시스템을 해킹할 수 있을 거야."
21130-102 = "우리가 만든 극소형 EMP라면…… 약 6초 정도 밀레니엄을 중세 시대로 바꿀 수는 있어."
21130-103 = "6초라……"
21130-106 = "충분해."
21130-108 = "밀레니엄 복도 외곽"
21130-109 = "(다시 현재, 밀레니엄 복도)"
21130-110 = "으음. 대충 이 쯤인 것 같은데."
21130-111 = "잘못 온거 아냐. 너무 깊숙이 들어온 느낌인데?"
21130-113 = "아니요. 제대로 들어왔습니다."
21130-114 = "?!"
21130-115 = "어서 오세요. 기다리고 있었답니다."
21130-116 = "이미 깨달았겠지만, 당신들의 계획은 실패했어요."
21130-117 = "C&C 콜사인 제로쓰리. 본명은 비밀이니 수수께끼의 미녀 메이드라 불러주시길."
21130-118 = "히익! 아카네 선배다!"
21130-119 = "그 특기란에 '암살'이라고 쓰는 그 메이드 에이전트지?"
21130-120 = "으음. 우리 목표는 어디까지나 비밀 에이전트였는데 어느새 이렇게 알려진 걸까요. 아무래도 정체를 밝히지 못하는 히로인 역할은 그만둬야 할지도……?"
21130-121 = "그리고 코타마 선배에게 듣기로 분명 최근 그녀의 체중은……"
21130-122 = "자, 잠깐! 거기까지 알려져 있다는 건 정말 문제가 있는데요!"
21130-123 = "그 정보에 대해서는 함구해 주셔야겠어요. 모모이, 그리고 미도리!"
21130-125 = "……"
21130-126 = "……"
21130-127 = "후후후."
21130-130 = "?"
21130-131 = "아직도 깨닫지 못했겠지만, 너희들의 계획이야말로 실패했어."
21130-132 = "네?"
21130-137 = "(스윽)"
21130-138 = "데헷. 안녕 아카네 선배! 기숙사로 돌아가다가 길을 잃었지 뭐야."
21130-140 = "다, 당신들은?!"
21130-141 = "우리가 누구냐고 물으신다면! 설명해드리는 게 인지상정!"
21130-142 = "질문만 입력되면 대답을 제공하는 엔지니어부의 설명의 화신, 토요미 코토리!"
21130-143 = "예술과 과학의 콤비네이션! 베리타스의 디지털 아티스트! 마키!"
21130-144 = "……게임개발부가 아니라…… 이런?!"
21130-146 = "유우카! 대체 어떻게 된 거죠?"
21130-147 = "감시 카메라에는 분명 모모이와 미도리가 A2로 접근하고 있어! 하지만 아카네 네 모습은 보이지 않아……!"
21130-148 = "뭐, 뭐라고요? 그렇다면…… 설마?!"
21130-149 = "카메라 설정을 초기화시켜! 클라우드 접속을 차단하고 오직 폐쇄회로 화면만 틀어!"
21130-150 = "화면 갱신! 새 화면이…… 뜹니다! 아카네 확인! 코토리와 마키와 대치 중입니다!"
21130-151 = "……그렇다면……."
21130-152 = "우리가 조금 전까지 보고 있던 영상은 설마?!"
21130-154 = "밀레니엄 복도 통로"
21130-155 = "녹화된 영상이 슬슬 들켰으려나."
21130-156 = "으음. 이럴 바엔 평온한 상태로 녹화된 영상을 틀어두고 몰래 거울을 빼내는 게 낫지 않았을까?"
21130-157 = "출입이 잦은 곳이라, 잘못된 영상을 틀어두면 금방 들켰을 거야."
21130-158 = "그럴 바엔 메이드들을 분열시켜놓고, 가둬둔 상태에서 움직이는 게 더 가능성 있어."
21130-164 = "아, 승강기 도착. 그럼 '진짜'로 들어가 볼까."
21130-165 = "잠깐만…… 선생님, 어두우니까 저희 손을 꼭 잡아주세요."
21130-166 = "그럼…… 준비 완료!"
21130-167 = "간다!"
21130-169 = "(삐이이익-)"
21130-171 = "밀레니엄 복도 외곽"
21130-172 = "침입자 확인, 세미나 전용층 섹터, 긴급 폐쇄 가동."
21130-173 = "앗…… 셔터가 내려오…… 서, 설마?! 자, 잠깐만!"
21130-174 = "(쿠궁)"
21130-175 = "이런……."
21130-176 = "헤헷. 사이 좋게 갇혀버렸네~"
21130-177 = "그럴 리가요. 저는 당신들과 달리 여길 통과할 수 있습니다."
21130-178 = "지문 입력. 여러분은 여기 갇혀서 제가 나가는 모습이나 잘 봐두세…… (삐빅)"
21130-179 = "올바른 지문이 아닙니다."
21130-180 = "……앗……?!"
21130-181 = "세컨드 셔터가 가동합니다."
21130-182 = "자, 잠깐만!"
21130-184 = "(차르르르…… 철컹!)"
21130-186 = "밀레니엄 본교사 통제실"
21130-187 = "아카네가 갇혔습니다!"
21130-188 = "학생회 임원을 한 명 보내! 노아가 근처에 있어! 그녀들의 지문으로 문을 열어주면 돼."
21130-191 = "대체 무슨 생각인 거지. 이대로라면 '진짜' 모모이와 미도리도 어딘가에 갇혀 있을 텐데."
21130-192 = "아니…… 혹시……?!"
21130-193 = "노아로부터의 연락! 자신들도 갇혔는데 문이 열리지 않는답니다!"
21130-194 = "노아도 두 번째 셔터에 갇혀버렸답니다! 도움 요청!"
21130-195 = "뭐, 뭐, 뭐라고?!"
21130-196 = "대체 어떻게! 오늘 설비는 전부 새로 맞춘……아 설마……?!"
21130-197 = "처음부터 이걸 노리고 아리스 쨩에게 문을 부수게 만든거였어?!"
21130-199 = "밀레니엄 본교사 내부"
21130-200 = "선생님! 언니! 하레 선배로부터의 연락! 아카네 선배를 가두는데 성공!"
21130-201 = "지문 인식 장치도 '정상' 작동."
21130-202 = "학생회 임원들은 전부 차단되었고 이제 이 학생회 건물을 자유롭게 움직일 수 있는 건 우리 뿐이야!"
21130-203 = "제작자를 속인, 엔지니어부가 만든 최신형 보안장치를 채택해 줘서 다행이야."
21130-204 = "엔지니어부 작품이라는 건 몰랐겠지만. 그만큼 제대로 만들었다는 거지. 자, 그럼 가볼까."
21130-205 = "삐빅- 사이바 모모이, 사이바 미도리, 그리고 선생님. 승인 되었습니다."
21130-206 = "음? 이거 예전에 비슷한 상황이 있었던 것 같은데……."
21130-207 = "맞아. 폐허에서였던가~ 그립네~ 벌써 꽤 오래 지난 일 같아."
21130-208 = "어쨌든 아카네 선배를 가뒀다는 건 매우 긍정적이지만…… 이왕이면 아스나 선배까지 가뒀으면 좋았을 텐데. 아직도 그 선배의 위치는 확인 안 되었지?"
21130-209 = "하레 선배가 밀레니엄 전체를 뒤져보는데도 찾지 못한 모양이야. 밀레니엄 외부에 있는 거 아닐까?"
