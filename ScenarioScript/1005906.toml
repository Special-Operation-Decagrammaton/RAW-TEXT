[translation]
1005906-1 = "상처와 흉터"
1005906-6 = "(학원 교직원에게 무슨 일이 있었는지 자초지종을 들었다.)"
1005906-7 = "……미카 학생은 지금 교내 폭력 사건을 일으켜서 반성실에서 근신 중입니다."
1005906-8 = "[s] \"폭력 사건요……?\""
1005906-9 = "네. 오늘 미카 학생이 다른 학생을 때리는 일이 발생했습니다."
1005906-10 = "[ns1] \"………………?!!\"\n[ns2] \"무슨 일이 있었던 거죠?\""
1005906-13 = "저, 저는 자세히 모르지만……"
1005906-14 = "오늘 수영 수업 때 미카 학생이 수영복을 가져오지 않았는지 견학만 했거든요."
1005906-15 = "[s] \"……수영복을?\""
1005906-16 = "네. 그것도 수업이 다 끝나갈 때쯤에서야 느즈막히 수영장에 도착해서 제대로 앉아있지도 않고 이리저리 돌아다니기나 하고……"
1005906-17 = "미카 학생의 수업 태도에 문제가 있었습니다."
1005906-18 = "그래서 그걸 못마땅하게 여긴 학생들이 몰려가서 항의를 했나 봐요. 그러다가 미카 학생이 갑자기 폭력을……."
1005906-22 = "[ns] \"…………….\""
1005906-23 = "다행히 그 학생은 크게 다치진 않았고 미카 학생도 자진해서 처벌을 희망해 와서 상황은 거기서 일단락되었지만……."
1005906-24 = "미카 학생의 입장도 입장인지라 상황이 복잡해서요……. 일이 여기서 더 커지지 않았으면 좋겠는데……."
1005906-25 = "그래서…… 샬레의 선생님이 미카 학생을 인계해 주시면……."
1005906-26 = "[s] \"……알겠습니다.\""
1005906-30 = "감사합니다!"
1005906-34 = "그럼 저는 다른 일이 있어서 이만!"
1005906-38 = "[ns] \"…….\""
1005906-44 = "(근신 중인 미카의 신변을 인계받았다.)"
1005906-50 = "[ns] \"미카…….\""
1005906-51 = "……뭐어, 결국 이렇게 되어버렸네."
1005906-52 = "실망했어? 그치만 알고 있었잖아. 나는 불량 학생이라는 걸."
1005906-53 = "가만히 놔둬도 문제를 일으키는 그런 나쁜 아이니까."
1005906-57 = "여기까지 폐를 끼쳐버렸으니 이제 나도 슬슬……."
1005906-64 = "[ns] \"괜찮아? 괴롭힘 당하고 있는 거 아냐?\""
1005906-65 = "……으, 으응?!"
1005906-66 = "[s] \"수영복. 잃어버린 거야?\""
1005906-70 = "나…… 나는……."
1005906-71 = "선생님이 준…… 수영복이었는데……."
1005906-78 = "어, 어째서?!"
1005906-79 = "수, 수영복이 없어……?! 어, 어디로……?!"
1005906-85 = "킥킥…… 티파티의 아가씨는 캐비닛 관리도 허술한가 보네요."
1005906-86 = "뭐어, 지금까진 전부 수행원들이 관리해주었을 테니 그런 걸까나."
1005906-87 = "그치만 잘되었네요. 고귀한 분이니 우리 같은 서민들이랑 같은 풀장에 들어가는 건 싫었을 거 아니에요?"
1005906-88 = "그러고 보니 오늘 쓰레기통이 꽉 차 있네요? 버릴 게 많아서 그런가? 호호호-!"
1005906-89 = "……."
1005906-101 = "없어…… 쓰레기통도 다 찾아보고 소각로까지 전부 뒤져봤지만……."
1005906-102 = "없어…… 어째서…… 소중한 건데……. 어디에……."
1005906-107 = "어머나, 여기에 웬 쓰레기가?"
1005906-111 = "……!!"
1005906-112 = "쓰레기라기보다는 이리저리 가위질된 수영복 같은데요?"
1005906-116 = "뭐어, 그게 쓰레기긴 하겠지만."
1005906-125 = "네 년들이 지금 감히……."
1005906-127 = "히, 히익?!"
1005906-128 = "뭐, 뭐야?! 미카는 이제 저항하지 못한다며! 이빨 빠진 호랑이랬잖아!"
1005906-129 = "사, 살해당한다?!"
1005906-136 = "(안 돼……)"
1005906-137 = "(다시 이러면 안 돼……. 나는…….)"
1005906-138 = "마녀! 마녀다-! 사, 살려줘-!"
1005906-142 = "기, 기다려! 같이 가!!"
1005906-146 = "자, 잡지 마! 우, 우와앗?!"
1005906-152 = "아, 아파…… 아아……."
1005906-157 = "수영복이……."
1005906-159 = "……."
1005906-160 = "선생님…… 미안해. 선물해 준 수영복은…… 못쓰게 되어버렸어……. 이렇게 엉망진창으로 찢어져 버렸어……."
1005906-161 = "당연한 거야. 내가 그동안 너무 나쁜 짓을 해 왔으니까……. 내가 착하게 살아왔다면 이런 일도 생기지 않았겠지……"
1005906-162 = "하지만 이번엔 정말 노력했는데……. 그랬는데…… 잘되지 않았어……."
1005906-163 = "이렇게 늘 선생님의 마음을 망쳐버려……. 새 수영복으로 수영 수업하는 거 기대했는데……."
1005906-164 = "역시 나는 안되는 거겠지……"
1005906-165 = "어떻게 해도 돌이킬 수 없는 거야……."
1005906-166 = "[s] \"……그러네. 미카. 오늘 시간은 괜찮아?\""
1005906-167 = "……응?"
1005906-168 = "갑자기 시간이라니…… 응, 아직 기숙사 통금 시간은 한참 남긴 했지만……."
1005906-174 = "[ns] \"그럼 수영 수업을 하러 갈까?\""
1005906-175 = "……응?"
1005906-182 = "트리니티 지정 의류판매점"
1005906-185 = "……그러네요. 많이 찢어지긴 했지만 수선은 불가능한 건 아닙니다."
1005906-187 = "……."
1005906-188 = "꿰맨 게 티는 나겠지만 사용하는데 문제도 없을 거구요. A/S 기간이니 무료로 해드릴게요."
1005906-189 = "[s] \"그럼 부탁드립니다.\""
1005906-190 = "네. 금방 되니까 잠시만 기다려 주세요."
1005906-194 = "여기 있습니다."
1005906-199 = "……."
1005906-200 = "수영복도 수선이 되는구나……."
1005906-201 = "몰랐어…… 찢어지면 새로 사는 걸로만 알고 있었어……."
1005906-205 = "저, 저기 선생님…… 어디로 가는 거야? 이쪽은 교실이 아닌데……."
1005906-206 = "수, 수영 수업이라고 하지 않았어? 그게 무슨 얘기인지는 잘 모르겠지만……"
1005906-207 = "게다가 지금 시간엔 오픈된 수영장이 하나도 없을 건데……."
1005906-208 = "[s] \"알고 있는 데가 있어.\""
1005906-213 = "별관 수영장"
1005906-215 = "여기는……."
1005906-220 = "……그렇구나. 여기가 있었지……."
1005906-221 = "[s] \"추억의 장소지?\""
1005906-222 = "……응."
1005906-223 = "원래 여기는 오랫동안 방치되어서…… 낡고 지저분하고 손 쓸 도리가 없을 만큼 엉망진창이었는데……."
1005906-224 = "……지금은 이렇게 깨끗하게 바뀌어 있었지."
1005906-225 = "[s3] \"그래. 엉망진창이 된 수영복도 그렇고.\"\n[s4] \"다른 것들도 마찬가지라고 생각해.\""
1005906-228 = "……."
1005906-229 = "이제 여기서 선생님이랑 수영 수업하는 거야?"
1005906-230 = "이런 심야의 외딴 수영장에서 단둘이? 괜찮아? 들키면 꽤 문제가 커질지도 모르는데?"
1005906-231 = "[s] \"……어? 그, 그런가?\""
1005906-232 = "뭐, 나는 들켜도 상관없으니까☆ 수영복으로 갈아입고 올게! 기다려!"
1005906-236 = "[ns] \"아니, 잠깐 기다려 미카?!\""
1005906-239 = "짜안-☆"
1005906-240 = "이것 봐, 선생님. 약간 작아지긴 했지만 감쪽같아!"
1005906-244 = "어때? 어때?? 잘 어울려? 학교 수영복이긴 하지만, 그래도 괜찮은 거 같아?"
1005906-245 = "응? 응응?"
1005906-246 = "[s] \"어…… 저기……. 너무 가깝습니다. 미카 씨.\""
1005906-247 = "아하하하☆ 뭐야? 여고생의 수영복 차림이잖아. 뒷걸음질치면 상처받는다구?"
1005906-248 = "[s] \"…….\""
1005906-259 = "우와…… 생각해 보니까 부끄러워져 버렸어……."
1005906-260 = "[s] \"그러고 보면 미카는 저질러놓고 후회하는 쪽이지.\""
1005906-261 = "아하하☆ 응, 역시 본성은 변하지 않나 봐."
1005906-265 = "자, 선생님도 들어올래? 엄청 시원해!"
1005906-266 = "[s] \"아니. 사양하겠습니다…….\""
1005906-270 = "삐이이익-! 거기 누구입니까! 지금 시간에 별관은 출입금지입니다!"
1005906-271 = "우, 우와?! 경비인가 봐, 선생님?!"
1005906-272 = "[s5] \"갑자기 급한 일이 생각나서! 그럼 이만!\"\n[s6] 미카를 데리고 도망친다."
1005906-277 = "서, 선생님?!"
1005906-282 = "서, 선생님?!"
