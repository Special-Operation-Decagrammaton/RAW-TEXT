[translation]
10044060-1 = "제6화;죽음의 팬클럽"
10044060-3 = "에~ 대충 시간을 계산해 보면……"
10044060-4 = "어떻게든 원래 도착 시간은 맞출 수 있겠네."
10044060-5 = "아슬아슬-"
10044060-7 = "[ns] \"그래도 다행이야. 열차를 찾아서.\""
10044060-8 = "아~ 맞지 맞지! 열차도 찾았고, 시간도 어떻게든 될 것 같고!"
10044060-9 = "그런데 뭔가 계속 찝찝한데. 왜지……?"
10044060-14 = "저기! 저게 그 열차 맞지?!"
10044060-15 = "끼얏호-! 달려라!!"
10044060-16 = "아……"
10044060-19 = "하, 찾았다! 하이랜더 애송이들, 이쪽으로 가고 있을 줄 알았지!"
10044060-20 = "계획대로야, 총장!!"
10044060-21 = "화물을 강탈한 다음, 목적지까지 우리가 더 빠르고 안전하게 직접 배송한다……"
10044060-22 = "다시 생각해 봐도 완벽한 계획이야."
10044060-23 = "그것으로 모두가 알게 되겠지, 우리가 최고라는 것을!!"
10044060-24 = "맞아! 이 업계는 결과로 증명하는 곳이니까!"
10044060-26 = "우리 전국 트랜스포터 연맹…… 줄여서 부릉부릉질주연합의 저력을 보여주마!!"
10044060-30 = "……어?"
10044060-31 = "왜 그래?"
10044060-32 = "저기 저 헬기는 뭐지?"
10044060-40 = "어디든 간다!! 크로노스 라이브!! 카와루 시논입니다!"
10044060-41 = "지금 보이십니까? 아까 전 특종으로 보도 드렸던 열차가 달리고 있습니다!"
10044060-42 = "아앗, 그 옆에 이미 열차를 노리고 있는 폭주족들이!! 벌써 냄새를 맡은 걸까요!!"
10044060-43 = "저 열차에 과연 어떤 물건이 실려 있길래?! 열차는 어디로 향하는 걸까요!!"
10044060-44 = "궁금하신 분들은 채널 고정! 여러분의 알 권리를 위한 방송, 저희 크로노스가 계속해서 추적 보도 드릴 것을 약속합니다!"
10044060-51 = "아니, 저 사람들 전부 우리랑 무슨 원수를 졌다고 저러는 거죠?!"
10044060-52 = "크로노스야 그렇다 쳐도, 저 폭주족들은 아까부터 왜 따라오는 거지?"
10044060-53 = "피자의 원한-?"
10044060-55 = "이, 이해할 수 없어요…… 그리고 이게 알 권리랑 무슨 상관인데요!!"
10044060-56 = "완전히 우리 열차가 공격당하기를 조장하고 있는 거잖아요……!!"
10044060-57 = "차, 차라리 쏴서 떨어뜨려 버리면 조용해질 것 같은데요……!!"
10044060-58 = "[ns] \"지, 진정해! 아오바!\""
10044060-59 = "뭐 어쩌겠어? 이미 벌어진 일인데."
10044060-60 = "이제 어떻게 할지를 생각하는 게 더 낫지."
10044060-61 = "……. 그건 확실히 맞는 말씀이긴 한데……"
10044060-62 = "물론 좋은 생각 따위는 전혀 안 나지만 말야! 파햐햐!"
10044060-63 = "……이런 사람 말에 순간 납득해 버린 나 자신이 미워……!"
10044060-67 = "아- 저기 먼지구름-"
10044060-68 = "……"
10044060-69 = "점점 다가와-"
10044060-70 = "[ns] \"어……\""
10044060-72 = "[ns] \"뭔가…… 엄청나게 쫓아오고 있는데……?\""
10044060-75 = "크하하! 찾았다, 보물 열차!!"
10044060-76 = "저 열차는 우리 차지다!! 전부 비켜!!"
10044060-81 = "초, 총장! 어떻게 하지? 별 이상한 녀석들이 다 붙었는데!"
10044060-82 = "뭐, 뭐야…… 이거? 왜 갑자기?? 설마 저 보도 헬기 때문인가??"
10044060-83 = "아, 안돼! 저 열차는 우리 거라고!!"
10044060-85 = "뉴, 뉴스 때문에 엄청난 추격자들이……!!"
10044060-86 = "이야, 각종 바이크에 택틱컬 차량에…… 저건 또 뭐야? 개조 전차?"
10044060-87 = "왕 인기- 죽음의 팬 미팅 현장-"
10044060-88 = "저걸 상대하는 건 말도 안 되고. 계속 달릴 수밖에 없네!"
10044060-89 = "소, 속도! 속도를 더 올려야……!!"
10044060-95 = "이야~ 이거 진짜 위험한 상황인데?"
10044060-96 = "대- 핀치-"
10044060-100 = "크하하! 그 열차는 우리가 갖는다!!"
10044060-101 = "갖지 못한다면, 부숴버리겠어!!"
10044060-106 = "대, 대체 왜 이렇게 된 거죠~~~!!!"
10044060-112 = "보이십니까, 여러분! 현재 상황입니다!!"
10044060-113 = "아아- 소문의 열차를 쫓는 세력들! 대 추격전이 벌어졌습니다!"
10044060-114 = "과연 보물이 가득한 열차를 차지할 자는 누구인가-!! 크로노스에서 끝까지 보도 예정!!"
10044060-116 = "응? 뭔가 다가오는데……"
10044060-117 = "……로켓 아냐?"
10044060-118 = "아! 맞습니다! 지금 로켓이 저희가 탄 헬기를 향해……"
10044060-122 = "……어?"
10044060-125 = "끼야아아악!! 누, 누가 헬기에 로켓을~~!!"
10044060-126 = "어, 언론 탄압이다아아아~~!!"
10044060-128 = "우왓~~!! 속 시원한데! 파햐햐!! 누가 한 거지?!"
10044060-129 = "아오바-? 쐈어-?"
10044060-131 = "아, 아니에요! 바란 건 맞지만 쏘진 않았다구요! 애초에 그런 거 없고!"
10044060-132 = "우, 우리를 추격하는 쪽에서 쏜 거예요!!"
10044060-134 = "하하! 이제 저 크로노스 녀석들에게는 볼일 없다!"
10044060-135 = "계속 보도해 봐야 떨거지들만 더 몰려들겠지!"
10044060-139 = "어이, 빠른 판단이잖냐! 멋진데!!"
10044060-146 = "꺄악!!"
10044060-148 = "흥! 네 녀석들도 어차피 모두 경쟁자야. 저 위대한 유산은 우리 것이다!!"
10044060-154 = "으아악-!! 공격받는다! 초, 총자앙~~!!"
10044060-155 = "우, 우리는 배달 전문이라 무장이 상대적으로 약하단 말이닷~!!"
10044060-159 = "이야~ 상황 판단이 빠른데? 경쟁자들을 먼저 공격하다니."
10044060-160 = "우승 후보- 넘버 원-"
10044060-161 = "뭐, 뭘 칭찬하고 있는 거예요~!! 그 우승 상품이 우리 열차인데!!"
10044060-162 = "아, 맞다-"
10044060-163 = "적이 줄어든 건 좋지만…… 그래도 점점 거리가 좁혀지고 있어요……!"
10044060-164 = "게다가 지금 여기는 게헨나랑 가까워서, 무, 무서운 문제아들이 더 늘어날 수도 있고……"
10044060-165 = "이, 이렇게 된 이상 그냥 열차를 버리고 탈출하는 방법은 어때요……?"
10044060-166 = "그건 안 되지. 받은 임무에는 의무를 다해야 한다고."
10044060-167 = "지금 같은 비상 상황에서 매뉴얼대로만 할 수는……!"
10044060-168 = "[ns1] \"모두 진정하고 생각해 보자……!\"\n[ns2] \"분명 헤쳐나갈 방법이 있을 거야!\""
10044060-171 = "으으…… 저, 정말 그럴까요……"
10044060-172 = "화물은 전부 약탈당하고, 열차는 철저하게 파괴되고, 저희는 모조리 시말서에 징계까지 받는 미래를 피할 수 있을까요……!!"
10044060-173 = "파햐햐, 구체적으로 무시무시한데!"
10044060-174 = "뭐, 뭘 웃고 있냐구요!! 지금 웃을 때예요?!"
10044060-175 = "으아앙- 흑흑흑-"
10044060-176 = "울지도 말고요!! 아니, 애초에 우는 척이잖아요!? 실제로 울지도 않네!!"
10044060-177 = "이래서 눈치 빠른 아이는-"
10044060-179 = "[ns] \"음? 저 뒤에 또 다른 먼지구름이……\""
10044060-183 = "히얼 컴스 어 뉴 챌린저-"
