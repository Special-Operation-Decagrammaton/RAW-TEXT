[translation]
90001130-1 = "제13화;출발"
90001130-10 = "오, 드디어 도착한 모양이네."
90001130-12 = "네, 네에! <그리드 포인트>로부터…… 마지막 자원이 도착했어요!"
90001130-13 = "뭐어, 뭐어, 뭐어. 정확성을 기하자면 완전 마지막은 아니긴 하죠. 총 수집률 99.98%....... 두 번 정도는 더 운송이 필요하겠네요."
90001130-17 = "그, 그렇긴 하지만……. 히잉……."
90001130-19 = "괘, 괜찮아. 아인! 그, 뭐냐, 오차 범위를 고려하면 지금 당장 다음 공정에 들어가도 문제없으니까!"
90001130-20 = "오르, 너는 왜 꼭 한 마디를 덧붙여서 분위기를 망치는 거야?"
90001130-24 = "하지만…… 소프도 전에 동의했잖아요?"
90001130-25 = "……뭘 동의했다는 거야? 내가 네 궤변에 맞장구를 쳐 준 기억은 거의 없는데."
90001130-31 = "아인은 울먹일 때 가장 귀엽다는 것을!"
90001130-33 = "네, 네에?!?!"
90001130-35 = "음, 그건 확실히 그렇지만……"
90001130-37 = "소프까지!?!?"
90001130-42 = "아, 그, 그러니까 아인! 방금 그 말은 그런 의미가 아니라–"
90001130-43 = "이게 다 오르 너 때문이잖아!"
90001130-44 = "여기서 제 탓을 한다고요?!"
90001130-54 = "저기요…… 모두들……."
90001130-62 = "자, 자원 이송이 끝났으니까……! 다음은 우리, 레이버 쨩들의 수, 순서네요!"
90001130-66 = "맞아요, 아인. 다들 잘 해주고 있다고요?"
90001130-67 = "그치만 역시…… 거, 걱정이에요…… 헬리컬 5호 쨩의 상처가, 다 낫지 않았는데……."
90001130-72 = "헬리컬 5호? 아, 전에 그 페인트 벗겨진 거? 벌써 또 이름 붙여 뒀던 거야?"
90001130-73 = "마, 맞아요! 페인트가 벗겨지면, 아무래도 녹이 슬기 쉬우니까요!"
90001130-74 = "그리고 상처를 낫게 하는 김에, 더 큰 기계 팔로 보강해 주고, 크기가 커졌으니까 그만큼 출력이 필요할 거고……!"
90001130-75 = "그러면 구동기의 크기도 따라서 커져야 할 테니, 이 기회에 더 큰 몸통과 더 튼튼한 재료를 사용해서……!!!"
90001130-76 = "진정해, 아인. 진정하라고. 네가 그…… 헬리컬 3호였나? 그 설비를 얼마나 아끼는지는 잘 알았으니까."
90001130-77 = "5, 5호예요! 그리고 헬리컬 5호 쨩은 설비 같은 게 아, 아니예요! 그 아이는, 그러니까……."
90001130-78 = "트, 특별하다구요!"
90001130-79 = "그렇게 특별할 게 있어? 수만 개나 되는 레이버 중의 하나일 뿐인데."
90001130-84 = "아아, 이 얼마나 냉혹하고 가혹한가요! 모든 것을 대상과 목적으로밖에 바라보지 않는, 철혈과 냉혈의 관리자 소프는!"
90001130-85 = "그녀는 감정 없는 그 차가운 말이, 아인의 여린 마음에 얼마나 커다란 상처를 입힐지, 정녕 알지 못하는 것인가–"
90001130-86 = "……너한테 그런 말 듣고 싶지 않거든?"
90001130-87 = "그보다, 아인. 헬리컬 5호의 상처를 치료하는 데 그걸로 충분하겠어요?"
90001130-93 = "모든 물리 업그레이드에는 그에 맞는 소프트웨어 최적화와 보조 장비가 필요한 법이죠."
90001130-94 = "그렇게 출력이 과한 설비를 잔뜩 달아주면, 헬리컬 5호의 관절과 부품이 마모를 견디지 못해 수명이 절반으로 줄어들지도 모른다고요?"
90001130-96 = "네, 네에?! 그, 그건…… 역시 싫어요……!!!"
90001130-97 = "그러니까 제가 도와주겠다는 겁니다. 맡겨만 줘요."
90001130-98 = "우선 모든 작업 프로세스를 최적화시켜서 기존 업무를 절반 이하의 시간으로 끝마칠 수 있도록 만들고……."
90001130-102 = "그리고 남는 시간에는…… 아, 그렇네요! 헬리컬 5호가 자기 발 밑을 붙잡고 영원히 한 자리에서 빙글빙글 돌게 만들어 보죠! 그리고 또-"
90001130-104 = "그, 그건 너무해요! 히이이잉……."
90001130-117 = "폭력, 반대…… 꾸에엑……."
90001130-119 = "그렇지만…… 그, 수집률이 99.98%라는 건……."
90001130-120 = "……응. 그래. 이제 정말로 때가 되었다는 거지."
90001130-124 = "그렇습니다. 바로, 우리들의 언니……."
90001130-128 = "<말쿠트>의 강림지를, 이 땅에 마련할 준비가 말이죠."
90001130-130 = "하, 하하하하, 할 수 있을까요? 제가 다 망친 건 아닐까요?"
90001130-131 = "제, 제가 뭔가 중간에, 실수 같은 거라도 해서, 그래서 언니가 깨어나지 못한다면……!"
90001130-132 = "이상한 소리 하지 마, 아인. 우리는 널 믿어. 지금까지 잘 해왔잖아?"
90001130-133 = "우리 중에서 기계 설비에 대한 건 누구도 너를 못 따라간다고."
90001130-134 = "그, 그그그그, 그렇지만……!"
90001130-139 = "아인의 걱정도 이해는 가요. 결국 어떤 영역에 다다르면…… 양자역학적인 효과를 고려해야 하니까 말이죠."
90001130-140 = "무엇보다 최선을 다했다는 것만으로는, 어느 시점부터는 변명이 되지 않는 법이기도 하고요. 후후……"
90001130-141 = "히이잉……."
90001130-142 = "그렇지만 지금은 할 수밖에 없어요. 결과를 받아들이는 것 말고는 할 수 있는 일이 없을 때라는 건, 언제든지 찾아오니까요."
90001130-143 = "언니의 강림에, 그 금지된 힘의 손을 빌리게 된 것은 저로서도 그다지 마음에 들지 않지만……."
90001130-144 = "뭐, 결과가 좋으면 다 좋은 법 아니겠어요? 무엇보다 이 땅을 누구에게도 드러나지 않게 지킬 수 있었으니까요!"
90001130-145 = "그래. <다차원해석 확률 중첩 위상 배리어>…… 뭔가 길고 귀찮으니까, 그냥 다차원 배리어라고 하자고."
90001130-146 = "무한차원속의 모든 가능성이, 확률로서 뒤섞인 공간 그 자체를, 방어구조로 사용한다……."
90001130-149 = "그날, 아주 좋은 샘플을 볼 수 있었지. 덕분에 우리가 리버스 엔지니어링으로, 여기까지 재구축하는 데에 성공할 수도 있었고."
90001130-150 = "후후. 후후. 우후후후후. 그 부분에 있어서는 소인의 공이 가장 컸다는 것을 이제 슬슬 인정하실 때가 아니신지?"
90001130-151 = "……그래. 진짜 절대로 인정하기 싫지만, 그건 사실이니까."
90001130-152 = "죄, 죄송해요……. 역시 그 부분의 이론, 저는 아직도 완전히 이해가 안 가요…… 히잉……."
90001130-155 = "괜찮아, 괜찮아. 아인! 애초에 우리 셋은 각각 전공이 다르잖아, 응?"
90001130-156 = "소프, 너무 아인에게만 무른 것 아닌가요……."
90001130-157 = "네 평소 행실을 생각하라고."
90001130-158 = "아무튼, 그래요. 이곳은 다차원 배리어로 보호받고 있고, 외부에서 우리를 발견하는 것은 불가능에 가까운 상태죠."
90001130-163 = "이름없는 신들의 힘 같은 거, 전부 우리들 손에 있는 거나 마찬가지니까요!"
90001130-165 = "저, 정말 그렇게 생각해도…… 되는, 걸까요? 나중에 누군가가 남의 힘을 멋대로 사용했다며 화를 내면 어쩌죠……."
90001130-166 = "뭐, 그렇지만 남들이 보기에도 지금 그 힘을 가장 잘 활용하고 있는 건 우리잖아?"
90001130-171 = "그렇게 생각할 필요도 없는 것 아닐까요? 우리는 이미 완전하니까 말이죠."
90001130-172 = "쓸 수 있는 부분만 골라서 활용하고, 나머지는 내다 버리면 되는 것이고요. 지나간 세월의 잊힌 유산 같은 거, 알 게 뭔가요!"
90001130-173 = "그렇네요. 어딘가에 그 신의 사제 같은 존재들이 있다는 소문을 듣기도 했지만……."
90001130-174 = "우리들이 사용해 주는 걸 감사하게 여기라고요, 시간의 패배자들!"
90001130-176 = "오, 좋은데. 오르. 바로 그 기세야."
90001130-177 = "저, 정말로 이래도 되는 걸까요……."
90001130-193 = "……드디어, 엔딩, 봤다……."
90001130-202 = "어, 어땠어. 어땠어?!"
90001130-207 = "네! 아리스, 알고 있습니다! 이것은……."
90001130-208 = "이것은……?"
90001130-213 = "망겜이군요!"
90001130-215 = "히윽……!"
90001130-216 = "쿠엑?!"
90001130-217 = "일단 말이야, 언니……. 왜 얼음 위에 발을 내딛자마자, 추위로 죽어야 하는 거야?"
90001130-218 = "그거야…… 이번 게임 배경이 극지니까? 실제로 극지에 가면, 그렇게 되는 게 당연한 거 아닐까?"
90001130-219 = "그래도 너무 심하잖아! 플레이는 하게 해 줘야지!"
90001130-220 = "분명 튜토리얼을 스킵하지 않으면 방한 장비를 챙길 수 있게 해 놨는걸?!"
90001130-221 = "그 튜토리얼은 30분이 넘어가는 길이이고 말이지? 거기에 방한 장비도 구석에 숨겨져 있고!"
90001130-222 = "무엇보다, 극지라고 해서 첫발을 내딛자마자 죽을 만큼 춥지는 않을 거거든?!"
90001130-223 = "미도리도 안 가 봤잖아! 그럴지 안 그럴지 어떻게 알아!"
90001130-227 = "……하아. 그래. 고증 문제는 그렇다 쳐. 내가 그렸던 방한복 리소스 아트들은 전부 어디로 갔는데?"
90001130-231 = "그, 그것은 추후 DLC로……."
90001130-236 = "그럴 거면 애초에 미리 그려 달라고 하지나 말든가!"
90001130-244 = "모, 모두 싸우지 마……."
90001130-245 = "그렇지만 아리스는 즐거웠습니다! 모두와 함께 게임을 만드는 것도, 그 게임을 플레이하면서 하나하나 고쳐 가는 것도요!"
90001130-251 = "우아앙~ 아리스~"
90001130-252 = "하아…… 아리스 쨩이 언니를 너무 받아 주니까, 언제나 이렇게 되는 게 아닐까."
90001130-254 = "그렇지만…… 문제가 없는 건, 아니었던 것 같아. 뭐가…… 모자랐던 걸까?"
90001130-256 = "으음……! 확실히 이것은 시나리오 라이터 겸 기획자 겸 총괄 프로듀서로서 진지하게 고민해야 할 문제로군!"
90001130-257 = "총괄 프로듀서는 자칭이잖아……."
90001130-261 = "그렇다! 이번 우리의 게임 <아크틱 어드벤처>에서 모자랐던 것은, 전적으로 현실의 레퍼런스였던 것이라고 생각하는 바이다!"
90001130-262 = "구체적으로 이야기하자면, 지금보다 더 실감 나는 극지에 대한 정보가 필요하다는 거야!"
90001130-263 = "무슨 소리야, 언니! 여기서 그런 이야기가 왜 나오는데?! 지금 뭐 눈 쌓인 평원으로 여행이라도 가자는 거야!?!?"
90001130-268 = "여행……? 바깥 세계에서도 더욱 바깥……? 그건, 그건……!"
90001130-274 = "유, 유즈? 괜찮습니까, 유즈?!"
90001130-276 = "하지만 생각해 보라구……. 어디까지나 눈이 쌓인 벌판, 푸르고 투명한 빙하, 사이좋게 놀고 있는 백곰과 펭귄……."
90001130-277 = "그야말로 우리에게 영감과 활력을 가득 불어넣어 줄, 멋진 풍경들이 아닐까?!"
90001130-278 = "그냥 언니가 보고 싶은 것뿐이잖아…… 그리고 백곰과 펭귄은 같은 지역에 살지 않거든? 만난다고 해도, 펭귄 쪽이 잡아먹힐 거고."
90001130-279 = "여, 여기에서 날것의 야생을 그대로 가져오지 말아 줘……."
90001130-288 = "전화? 아리스에게?"
90001130-293 = "이 번호는……?"
90001130-298 = "선생님이……?"
90001130-299 = "어, 뭐야. 선생님이야?"
90001130-301 = "뭔가, 선생님이라니 반갑네. 후후……."
90001130-305 = "여보세요, 선생님!"
90001130-306 = "[s] \"안녕, 아리스!\""
90001130-307 = "네! 선생님의 아리스입니다! 선생님을 만나는 것도 오랜만이라는 느낌입니다!"
90001130-308 = "어라? 느낌만이 아니었던 걸까요? 그러고 보니 요새 선생님을 잘 못 보게 된 것 같습니다……."
90001130-309 = "아리스도 모모이도, 그리고 미도리와 유즈도 선생님과 더 많이 만나고 싶습니다! 자주 연락해 주세요!"
90001130-310 = "[s] \"미안, 미안.\""
90001130-312 = "[ns] \"그러고 보니, 거기에 모두 있는 거야?\""
90001130-313 = "네! 부실에서 새로 만든 게임을 테스트해 보고 있었습니다! 나중에 선생님과 같이해 보고 싶습니다!"
90001130-317 = "그 정도로 잘 만든 게임이냐고요? 그건……."
90001130-327 = "아리스는 잘 모르겠지만, 만드는 과정은 정말로 즐거웠습니다!"
90001130-328 = "그보다 무슨 일인가요, 선생님? 평소와는 목소리가 조금 다른 것 같은 느낌이 듭니다."
90001130-329 = "[s] \"응……. 맞아. 마침 모두 거기에 있다고 했지?\""
90001130-330 = "그런데요?"
90001130-335 = "(아리스와 게임개발부 아이들에게 어디까지 이야기해야 하는지, 계속 고민했지만…….)"
90001130-336 = "(역시, 솔직하게 말하는 것이 제일이라는 생각이 들었다.)"
90001130-338 = "[ns] \"모두, 지금부터 내가 하는 말을 잘 들어 줘.\""
90001130-349 = "빙?"
90001130-350 = "해!"
90001130-351 = "탐?"
90001130-352 = "험!!!"
90001130-353 = "와아, 와아! 그렇군요, 선생님! 이것은 모두와 함께하는 빙해 여행이로군요! 잘 됐습니다, 모모이!"
90001130-355 = "그러게! 마침 딱이네! 역시 선생님이야!"
90001130-356 = "[s1] \"어…… 저기, 얘들아? 내가 몇 번 강조했을 텐데…….\"\n[s2] \"이거, 정말로 위험할 수도 있는 일인데……?\""
90001130-359 = "마, 맞아. 언니! 아리스 쨩도! 그러니까 선생님의 말을 대충 요약하자면……."
90001130-360 = "정체도 목적도 알 수 없는 인공지능이, 거대 기계 괴수 같은 걸 만들어서 무언가를 꾸미고 있다는 이야기잖아?!"
90001130-361 = "그리고, 거기에 아리스 쨩의 도움이 필요할지도 모른다는 거고?!?!"
90001130-362 = "우으으…… 그런 건, 게임 속의 보스만으로 충분하다고 생각해……."
90001130-363 = "[s3] \"그, 그래! 미도리와 유즈의 말대로라니까?!\"\n[s4] \"그러니까 이 일은 조금 더 신중하게…….\""
90001130-366 = "그렇지만 선생님. 아리스는 선생님의 동료입니다. 마찬가지로 선생님도 아리스의 동료이고요."
90001130-367 = "[s] \"그렇게 생각해 주는 건 정말 고맙긴 한데…….\""
90001130-369 = "[ns] \"내가 다시 이야기해 줄게. 이건 어떻게 보면–\""
90001130-370 = "아……? 그렇군요. 알겠습니다. 이건 정말로 보통 일이 아닐 수 있고."
90001130-371 = "어쩌면 선생님께서도, 아리스의 안전을 담보할 수 없을 정도로 위험한 일일 수 있다는 뜻이군요."
90001130-372 = "아리스 쨩……."
90001130-377 = "……."
90001130-378 = "알겠습니다. 선생님. 그러면 빙해로 가기 위해서는 어떻게 해야 하나요?"
90001130-379 = "[s] \"어!?\""
90001130-384 = "아, 아리스?!"
90001130-385 = "아리스 쨩!?!?"
90001130-390 = "왜 그렇게 놀라십니까? 동료가 힘들 때 외면하면 안 됩니다. 그것은 파티 플레이의 기본입니다."
90001130-391 = "그리고 아리스는, 선생님이 이럴 때 아리스를 생각해 주셔서 오히려 감사드리고 싶습니다."
90001130-392 = "그것은 선생님께서 아리스를 믿어 주시고 있다는 뜻이니까요. 그리고 신뢰야말로 동료의 가장 큰 증거이니까요."
90001130-393 = "[s] \"……괜찮겠니?\""
90001130-394 = "선생님. 아리스는 견습이지만, 용사입니다. 적어도 그렇게 되려고 노력하고 있습니다."
90001130-395 = "그래서 아리스는…… 세상이 조금이라도 더 나은 곳이 되었으면 합니다. 그것만큼은 아리스의 진심입니다."
90001130-396 = "그리고 그렇게 생각하고 있기 때문에…… 아리스를 도와준 사람이, 아리스에게 도움을 청할 때, 회피하거나 도망치고 싶지 않습니다."
90001130-397 = "왜냐하면, 그래야 세상이 조금이라도 더 멋진 곳이 될 테니까요."
90001130-398 = "[s] \"그래도 정말 위험한 상황이 닥치면, 어떻게 할 생각이야?\""
90001130-399 = "그렇네요. 정말 어떻게 되어도 위험하게 된다면……."
90001130-405 = "그때는, 잠시 학생으로 돌아가서 안전한 곳으로 숨겠습니다!"
90001130-407 = "오, 그렇지! 그거 좋네! 사실 게임 플레이에 치사한 패턴 같은 건 없으니까!"
90001130-408 = "응. 핵이나 치트키를 쓰는 정도가 아니면 말이지."
90001130-409 = "나, 나도 그 정도라면, 괜찮을 것 같아……. 어떠세요. 선생님……?"
90001130-410 = "[s] \"정말로, 꼭, 치사해져 줄 수 있다고 약속할 거지?\""
90001130-412 = "물론입니다, 선생님! 용사는 반드시 약속을 지킵니다!"
90001130-413 = "어…… 그런데 치사한 약속을 지키는 것은, 과연 옳은 일일까요……?"
90001130-418 = "괘, 괜찮아. 아리스! 이건 그러니까…… 그래! 일종의 얍삽이 같은 거야!"
90001130-419 = "얍삽이도 어떻게 보면 게임의 일부이기도 하고?"
90001130-420 = "오, 오히려 어떤 건, 이스터 에그처럼…… 사용해 주길 바라고 넣어 둔 것도 있으니까……."
90001130-422 = "그렇군요…… 알겠습니다! 그러면 다시, 빙해로 가기 위해서는 어떻게 해야 하나요?"
90001130-423 = "[s5] \"고마워, 아리스. 모모이도, 미도리도, 유즈도.\"\n[s6] \"오는 방법에 대해서는, 메일을 보내 둘게.\""
90001130-426 = "[ns] \"그리고 마지막으로 이야기해 두고 싶은 것이 있어.\""
90001130-432 = "그건 뭔가요. 선생님?"
90001130-433 = "[s] \"빙해는 추우니까, 따듯하게 입고 와 줘…….\""
90001130-438 = "다음화;합류"
