[translation]
10023060-1 = "제6화;일단은 가 보도록 합시다."
10023060-2 = "(소란스러웠던 첫째 날이 지나고, 둘째 날이 되었다.)"
10023060-6 = "이것이 내일 경매에서 출품될 그 그림이군요. 저는 참여할 생각입니다만, 어떠십니까?"
10023060-7 = "제 경우에는 분위기를 봐서, 라고 말씀드릴 수밖에 없겠습니다."
10023060-12 = "[ns] (그런 일이 있었는데도 다들 아직 의욕적인 것 같네.)"
10023060-21 = "후아…… 힘들다."
10023060-22 = "[s] \"수고가 많네. 모모이.\""
10023060-23 = "응…… 여기까지 오면 오기가 생긴달까, 그냥 넘어가고 싶지 않달까."
10023060-24 = "뭔가 그런 느낌이 들어서 말이지."
10023060-25 = "선생님, 미안해. 괜히 우리 때문에 이런 일에 휘말리기까지 하고."
10023060-26 = "[s] \"나는 오히려 신선해서 좋은데?\""
10023060-27 = "……정말? 그 말 후회하게 될지도 모른다?"
10023060-28 = "다음에도 비슷한 일이 생길 것 같으면, 선생님을 마구마구 불러 버릴 거니까!"
10023060-29 = "[s] \"선처 부탁드립니다……\""
10023060-34 = "!!!"
10023060-35 = "[ns] \"시작된 건가……!\""
10023060-36 = "이것은!"
10023060-37 = "진정하십시오. <자애의 괴도>가 나타난 곳에는…… 인명 피해가 발생하지 않는다고 하니까요."
10023060-38 = "생각해 보니 그렇군요. 그렇다면 우리는 어제처럼…… '볼거리'를 즐기면 되는 걸까요?"
10023060-39 = "메이타로 씨에게는 조금 유감인 말이 될 수도 있겠습니다만, 일종의 여흥은 되겠군요."
10023060-46 = "의외로 다들 크게 동요하지 않네? 한 번 겪어 본 일이라 그런가?"
10023060-47 = "그러면 우리도……"
10023060-48 = "[s] \"응. 사전에 이야기한 대로 움직이자.\""
10023060-50 = "그림의 보호는 제가 맡겠습니다."
10023060-51 = "위층 계단으로 이동할게요."
10023060-57 = "아리스는 중앙 홀에서 어디든 저격할 수 있도록 준비하겠습니다!"
10023060-58 = "숨어서…… 상황을 지켜볼게요……"
10023060-59 = "[s] \"다들 힘내!\""
10023060-63 = "……"
10023060-64 = "……"
10023060-66 = "……"
10023060-68 = "왜 아무 일도 안 일어나는 건데?!"
10023060-73 = "(그때, 발밑으로 투명한 구슬 같은 것이 굴러왔다.)"
10023060-74 = "(무심코 구슬을 집어 들자……)"
10023060-78 = "안녕하세요, 제 목소리가 들리시나요?"
10023060-79 = "[s] \"누구……?\""
10023060-81 = "이 구슬은 저의 가제트예요. 지향성 스피커가 내장되어 있죠. 이 대화는 우리를 제외하고 아무에게도 들리지 않을 거예요."
10023060-82 = "[s] \"너는, 혹시……?\""
10023060-83 = "쉿. 거기까지."
10023060-84 = "시간이 없어요. 우리 모두는 어떤 의미에서, 지금 이 순간에도 속고 있으니까요."
10023060-85 = "[s] \"속고 있다고? 누구에게?\""
10023060-86 = "차차 알게 되실 거예요. 예고장을 올바르게 풀이하셨다면, 더더욱 빨리."
10023060-87 = "아쉽지만, 대화는 여기까지예요. 저는 지금부터 향해야 할 곳으로 향하겠습니다."
10023060-88 = "속은 채로 눈을 감고 지켜보느냐, 위험을 무릅쓰고 진실을 향해 걸음을 내딛느냐……"
10023060-89 = "인생이란 선택을 향해 나아가는 과정이죠. 그렇지 않나요?"
10023060-93 = "[ns] \"끊어졌어……\""
10023060-98 = "다시 조명이 돌아온 모양이군요!"
10023060-99 = "자애의 괴도는…… 으흠? 어디에도 없는 모양입니다."
10023060-100 = "그렇다면 정말로 단순한 정전이었던 걸까요?"
10023060-101 = "아니면 경비가 성공한 것이던가요."
10023060-107 = "선생님, 왜 그래?"
10023060-108 = "[s] \"모모이. 잠시 모두를 불러 모아 줄래?\""
10023060-109 = "어? 하지만 경비는 어떡하고?"
10023060-110 = "[s] \"바로 그것 때문이야.\""
10023060-115 = "그게 정말인가요, 선생님?!"
10023060-116 = "모두 속고 있다고? 누구에게?"
10023060-117 = "[s1] \"그건 이야기해 주지 않았지만.\"\n[s2] \"예고장을 올바르게 풀어냈다면, 알 수 있을 거라고 했어.\""
10023060-120 = "그런 걸 어떻게 믿어?"
10023060-121 = "상대는 일곱 죄수잖아. 어떤 거짓말을 하고 있을지 모르는 일이고."
10023060-122 = "……하지만, 자애의 괴도는 미도리가 위험했을 때 구해주기도 했었고……"
10023060-123 = "그, 그건 분명 고마운 일이지만!"
10023060-124 = "단순한…… 변덕 같은 것 아니었을까? 선생님은 어떻게 생각해?"
10023060-125 = "[s3] \"음…… 아무리 일곱 죄수라고 해도.\"\n[s4] \"학생인 이상, 그 이야기를 들어 보고 싶어.\""
10023060-128 = "으음, 선생님은 그런 사람이었지……."
10023060-130 = "그런 것과는 별개로…… 조금, 석연치 않은 점은 있었어요."
10023060-131 = "'안티키테라의 뒤편'…… 그 단어가 나왔을 때, 메이타로 씨의 태도가 조금 이상했죠."
10023060-132 = "아, 확실히 그랬었어! 내가 아직 예고장을 다 해석하지 않은 것 아니냐고 물었더니, 그런 건 아무래도 상관없다는 식으로 말했으니까!"
10023060-133 = "거기에 기사 서임 그림만을 지키면 된다고, 너무나 간단히 확언하기도 했고……"
10023060-135 = "아리스, 조금 전부터 이상합니다. 메이타로 씨의 모습이 어디에도 보이지 않습니다."
10023060-136 = "아…… 저도 홀과 정문, 창가를 지켜보았는데…… 메이타로 씨는 보이지 않았어요……"
10023060-137 = "[s] \"여기, 메이타로 씨를 본 사람 있어?\""
10023060-142 = "이상한데? 우리에게 그림 경비를 맡겨 놓고, 어딘가로 가 버렸다는 건가?"
10023060-143 = "그러고 보니 메이타로 씨, 전시회가 시작되었던 때부터……"
10023060-144 = "[s5] \"흐음…… 그림을 지켜야 한다고 말했던 사람이.\"\n[s6] \"정작 괴도가 나타나자 모습을 감추었다는 거네.\""
10023060-147 = "예고장 중, 풀리지 않았다는 구절이란 무엇이었습니까?"
10023060-148 = "'달이 닿지 않는 자리, 멈춘 춤사위와 안티키테라의 뒤편'……이라는……"
10023060-149 = "미도리. 그때…… 메이타로 씨가 보여준 반응이 어딘가 이상했다고 했지?"
10023060-150 = "응. 뭔가, 말을 돌리려는 듯한 느낌이었다고 할까……"
10023060-151 = "안티키테라…… 안티키테라……"
10023060-156 = "혹시……?"
10023060-157 = "아, 이것은 유즈의 <UZQueen모드> 인 겁니다! 아리스는 알고 있습니다."
10023060-158 = "[s] \"뭔가 생각이 든 게 있는 거야?\""
10023060-159 = "메이타로 씨가 이 저택에는…… 커다란 아날로그 시계가 있다고 했었죠……?"
10023060-160 = "안티키테라 기계는…… 천체의 움직임을 계산하는 복잡한 달력 장치……"
10023060-161 = "단순하게 생각하자면, 시계의 일종이라고도 볼 수 있으니까……"
10023060-171 = "이것이 그 아날로그 시계로군요."
10023060-172 = "그리고 지금, 멈춘 춤사위라는 것이 무엇인지 알게 된 것 같습니다."
10023060-178 = "시계와 나란히…… 무용수의 동상이 서 있군요."
10023060-179 = "[s] \"말 그대로 멈춘 춤사위네.\""
10023060-180 = "으음…… 하지만 시계와 동상 뒤편에는 아무것도 없는데?"
10023060-181 = "잠시만 기다려 주십시오. 이 부분의 바닥 타일 문양이, 원형으로 어긋나 있습니다."
10023060-185 = "왠지 타일을 돌려서 모양을 맞출 수 있을 것처럼 보이는군요."
10023060-189 = "(토키는 신중하게 타일을 조작했다.)"
10023060-190 = "(그러자……!)"
10023060-197 = "!!!"
10023060-199 = "[ns] \"벽이 열리면서…… 계단이 나타났어?!\""
10023060-200 = "지하로 향하는 계단이군요."
10023060-201 = "'달이 닿지 않는 자리……' 과연."
10023060-202 = "왠지, 메이타로 씨가 말을 돌렸다는 이유를 알 것 같기도 합니다."
10023060-203 = "[s] \"그러면…… 이 아래에는 뭐가 있는 걸까?\""
10023060-204 = "거기까지는 알 수 없습니다만, 만일 메이타로 씨와 자애의 괴도가 이곳으로 향했다면……"
10023060-206 = "괘, 괜찮아. 선생님! 여차하면 우리 게임개발부가 선생님을 지켜 줄게!"
10023060-207 = "……그렇게 떨리는 목소리로 말하면 설득력이 없어지잖아, 언니."
10023060-209 = "그렇습니다. C&C 역시 여기에 있습니다."
10023060-210 = "서로 협력하기로 한 동료입니다. 같이 가겠습니다."
10023060-211 = "[s] \"모두를 믿을게!\""
10023060-213 = "퀘스트 조건이 갱신되었습니다! 던전 탐험입니다! 아리스가 좋아하는 장르입니다!"
10023060-214 = "선생님은 아리스 옆에 꼭 붙어 있어야 합니다. 아리스는 용사고, 선생님은 마스코트니까요!"
10023060-215 = "[s] \"넵. 용사님만 믿겠습니다.\""
10023060-216 = "조심……하셔야 해요. 선생님……?"
10023060-217 = "여차하면 제 상자에 숨으셔도…… 웅크리면 두 사람은 들어갈 수 있으니까요……"
10023060-218 = "[s] \"그러면…… 조심해서 가 보자!\""
