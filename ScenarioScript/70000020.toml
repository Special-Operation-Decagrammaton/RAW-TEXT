[translation]
70000020-1 = "수상쩍은 교류회 2"
70000020-2 = "(어찌저찌 붉은겨울 사무국과 만마전의 교류회가 시작되었다.)"
70000020-6 = "키키키킥-! 봤느냐 서기장? 이번 우리 만마전의 재신임 투표율은 역대 최저를 기록했다!"
70000020-15 = "(마코토 선배…… 꺾인 기세를 되찾으려고 하는 건지 아까부터 말이 많아졌군요…….)"
70000020-16 = "무슨 뜻인지 모르겠다는 얼굴이군? 알려주지."
70000020-17 = "정치라는 것은 기본적으로 중우정치! 학생들이 정치에 관심 없을수록 우리의 권력은 공고해지는 것이다!"
70000020-18 = "이 3.8%의 투표율은 우리의 영속적인 권력을 상징하는 숫자인 것이지!"
70000020-20 = "하찮군. 의장. 네 녀석의 속셈은 얕고 시시한 소인배의 잔머리가 아닌가."
70000020-21 = "토모에, 이번의 붉은겨울 총선거의 투표율이 얼마였었지?"
70000020-22 = "300%였습니다. 서기장님."
70000020-24 = "뭐, 뭣이라아-?!!!!"
70000020-25 = "봤느냐? 자고로 숫자는 커야 좋은 법!"
70000020-26 = "이 붉은겨울 학원과 겨루려면 이 정도로 크고 대범해야 하는 것이야!"
70000020-27 = "다, 당했다아-?! 서 설마 숫자에서도 밀리다니?!"
70000020-28 = "………………"
70000020-33 = "하아…… 제, 제길. 얕잡아 보이는 건가……!! 이 천하의 마코토 님께서……!!"
70000020-34 = "선배…… 뭔가 계획한 것도 실패했고 여기 더 있을 이유가 없지 않나요? 그냥 돌아가죠?"
70000020-35 = "아, 아직이다! 붉은겨울 놈들에게 당한 채 이대로 돌아가는 굴욕은 절대……."
70000020-36 = "……응?"
70000020-43 = "이, 이건 대체……"
70000020-45 = "결국 봐 버렸군. 의장."
70000020-50 = "서, 서기장……!"
70000020-57 = "그건 이 몸의 권위와 영광을 상징하는 초상화인 것이다."
70000020-58 = "어떤가? 바라보기만 해도 마음속 깊은 곳에서 외경이 솟아오르지 않는가?"
70000020-59 = "아니, 잘 모르겠는데……."
70000020-63 = "(게다가 이걸 당당하게 본인이라고 주장해도 괜찮은 거야?)"
70000020-64 = "(일단 성별이 다르잖아……)"
70000020-67 = "예술을 보는 안목이 낮군."
70000020-68 = "프로파간다의 기본이 부족해. 이래서야 한 학원의 리더라고 할 수 있는 건가."
70000020-69 = "이대로라면 게헨나의 미래는 어두울 게 뻔하군!"
70000020-70 = "뭐라고? 그 발언은 흘려들을 수 없겠는데?"
70000020-71 = "선배…… 여기서 싸우면 전부 다 망하는 거예요."
70000020-72 = "일단은 진정하세요. 좁은 속이 그대로 드러나잖아요."
70000020-74 = "시시한 잡담에 일일이 반응하지 마라. 의장."
70000020-75 = "그리고 속이 좀 좁으면 어떤가. 이 몸은 개의치 않으니까."
70000020-76 = "좋다. 모처럼 우호의 자리이니 붉은겨울에서 비슷한 걸 하나 만들어주마."
70000020-77 = "의장. 평소의 신념이나 좌우명 같은 게 있나?"
70000020-83 = "응? 뭐? 신념? 좌우명……?"
70000020-84 = "마코토 선배에게 그런 게 있다면…… 분명……"
70000020-85 = "예전에 냉장고의 푸딩을 뺏어 먹어놓고 뻔뻔하게 외쳤던 말이 있었죠?"
70000020-88 = "아앙? 푸디이잉?"
70000020-89 = "키키키키키킥. 그래, 내가 먹었다."
70000020-90 = "그래서? 그게 어쨌다는 거지? 이 내가 미안하다고 할 줄 알았나?"
70000020-91 = "아니, 사과를 요구하는 건 아니지만……."
70000020-92 = "그것보다 마코토 선배, 지금 엄청 당당한데요?"
70000020-93 = "키키키키킥. 잘 들어라. 이로하. 나는 후회도 반성도 하지 않는다."
70000020-94 = "만마전의 의장에게 그런 건 없어."
70000020-95 = "이 마코토,"
70000020-96 = "내 생에 한 점의 후회도 없으니까--!!"
70000020-97 = "아…… 네."
70000020-99 = "……. 과연 얕잡아 볼 수 없는 자다."
70000020-100 = "푸딩은 중대사항이지. 그 배짱과 두려움을 모르는 뻔뻔함은 신뢰할만하다. 마코토 의장."
70000020-101 = "좋아, 마음에 들었다!"
70000020-102 = "토모에, 붉은겨울에서 가장 실력 있는 장인을 불러와라!"
70000020-103 = "네. 서기장님."
70000020-104 = "그 외침에 걸맞는 훌륭한 물건을 만들어주마!"
70000020-106 = "(대체 무슨 일이 벌어지고 있는 거지……)"
70000020-108 = "(며칠 뒤, 게헨나 교문 앞)"
70000020-114 = "……이건 뭐지?"
70000020-115 = "만마전에서 붉은겨울인가에 다녀온 뒤에 생긴 동상인데요……."
70000020-116 = "마코토 의장……이죠? 이거?"
70000020-121 = "………………………"
70000020-128 = "(정체불명의 동상은 이스보셋의 총성과 함께 먼지처럼 사라졌다.)"
70000020-129 = "만마전의 붉은겨울 순회록"
70000020-141 = "짜안-! 이부키 등장!"
70000020-142 = "응응! 선배들 안녕! 이부키의 푸딩은 잘 있지?"
70000020-143 = "?!"
70000020-144 = "이, 이부키…… 그게……."
70000020-145 = "그, 그게 그러니까……!?"
70000020-147 = "우웅? 이부키의 푸딩이…… 없어……?"
70000020-148 = "이부키…… 푸딩 못 먹어? 이부키가 나쁜 아이라서 그런 거야?"
70000020-149 = "그, 그럴 리가 없잖아요. 나쁜 건 전부……."
70000020-150 = "이, 이부키이-! 내가 잘못했어어! 이부키건 줄 모르고 내가…… 내가아아아-!!"
70000020-151 = "내가 나빴어-! 내가 잘못했어어어-!!"
70000020-152 = "하아……."
