[translation]
1014906-1 = "다이버와 잠수병"
1014906-2 = "(다음 날, 다이빙부의 업무 참관을 위해 배를 빌려 가까운 바다로 나갔다.)"
1014906-3 = "(다이빙 준비를 마치고 코코로가 물에 들어가려던 찰나……)"
1014906-6 = "참, 선생님. 그러고 보니 그 소문 들으셨나요?"
1014906-7 = "최근 이 주변에 불량 학생들이 돌아다니며 작은 배를 습격하는 경우가 있다던데……"
1014906-8 = "생각해 보니 제가 물 속에 들어간 사이에 불량 학생들이 와서 선생님을 습격하면 어쩌죠?"
1014906-9 = "선생님은 저희와 다르게 스스로를 지킬 방법도 없으시니, 습격을 받으면 꼼짝 없이 당하고 마실텐데……"
1014906-10 = "[s1] \"걱정 마. 불량학생 상대는 익숙하니까.\"\n[s2] \"그런 일이 생기면 대화로 해결해볼게.\""
1014906-13 = "아, 안 돼요!"
1014906-14 = "선생님은 뱃일하는 여학생이 얼마나 위험한지 몰라서 그런 말씀을 하시는 거예요!"
1014906-15 = "바다에서 일하는 학생들이 얼마나 거칠고 무자비한지 아세요? 육지의 스케반들과는 차원이 다르다고요!"
1014906-16 = "바다의 불량 학생들이 용돈이든 무엇이든, 선생님께 원하는 바를 얻지 못한다면 그 다음엔 어떻게 나올지……"
1014906-17 = "으으, 생각도 하고 싶지 않아요."
1014906-18 = "그동안 다이빙에 필요한 물건은 늘 빼놓지 않고 준비했다고 생각했는데, 선생님과 관련된 일에는 이상하게 늘 하나씩 놓치는 게 생기는 것 같네요……."
1014906-19 = "[s3] \"그렇게 걱정할 필요는 없다고 생각하지만……\"\n[s4] \"혹시 문제가 생겼을 때 연락할 방법은 없을까?\""
1014906-22 = "그러게요. 깊은 물 속에서는 전파도 닿지 않으니 핸드폰도 쓸 수 없으니……"
1014906-26 = "아, 그런 방법이 있었구나……!"
1014906-27 = "선생님, 이걸 받아주세요."
1014906-28 = "[s] \"이건……?\""
1014906-29 = "다이버용 신호 부이에요."
1014906-30 = "물에 놓으면 자동으로 펼쳐지며 소음을 내기 때문에 멀리서도 알아볼 수 있거든요."
1014906-31 = "기다리시다가 무슨 일이 생기시거든 이 부이를 물 위에 던져주세요."
1014906-32 = "틈틈이 수면을 살펴보다 부이가 펼쳐진 걸 확인하면 바로 올라올게요……!"
1014906-33 = "[s5] \"알겠어.\"\n[s6] \"내 걱정은 말고 코코로도 조심히 다녀 와.\""
1014906-36 = "네……!"
1014906-38 = "(코코로가 입수한지 약 30분 정도 지났을 무렵……)"
1014906-41 = "[ns] \"우, 우왓?!\""
1014906-45 = "(갑자기 달려 든 바닷새에 놀라, 실수로 들고 있던 신호 부이를 놓치고 말았다.)"
1014906-46 = "(바다에 떨어진 신호 부이는 곧 물위에 펼쳐지며 요란한 소음을 내기 시작했다.)"
1014906-50 = "[ns7] (이런 어쩌지……?)\n[ns8] (코코로가 오해를 하지 않았으면 좋겠는데……)"
1014906-57 = "서, 선생님……!"
1014906-58 = "괘, 괜찮으신가요? 수면 위에 신호 부이가 떠 있는 걸 보았는데……!"
1014906-59 = "[s9] \"미안, 실수로 부이를 물에 떨어트렸어.\"\n[s10] \"아무 일도 없었어. 정말 미안해.\""
1014906-62 = "그, 그렇군요…… 아무 일도 없었군요……."
1014906-63 = "다, 다행이네요…… 저는 혹시나 선생님께…… 무슨 문제라도 생긴 줄 알고……"
1014906-64 = "[s11] \"그나저나 코코로야 말로 괜찮은 거야?\"\n[s12] \"갑자기 출수하면 잠수병에 걸릴 수도 있다고 했으면서……\""
1014906-67 = "……제 몸 상태요?"
1014906-68 = "저는…… 전혀…… 아무렇지도 않아요."
1014906-69 = "……딸꾹."
1014906-70 = "[s] \"누가 봐도 안 좋아 보이는데?!\""
1014906-71 = "조금 어지럽긴 하지만…… 전혀, 문제 업써요……!"
1014906-72 = "뭔가 시야가 흐리고, 몸이 간질간질 거리지만…… 딸꾹, 괜찮아요!"
1014906-73 = "[s] \"안 되겠다. 바로 감압 챔버로 가자.\""
1014906-74 = "아뇨…… 저를 걱정하실 필요는, 없어요!"
1014906-75 = "오히려 걱정해야 하는 건…… 선생님이시니까요……!"
1014906-76 = "[s] \"내가?\""
1014906-77 = "네."
1014906-78 = "선생님은 총알도 못 버티고, 100m 수압도 맨 몸으로는 버티지 못하시면서……"
1014906-79 = "학생들이 위험해 보이면 제일 먼저 달려오시고, 책임지겠다는 말을 입에 달고선……"
1014906-80 = "극악무도한 불량 학생들에게도 친절하게 대하시니……"
1014906-81 = "제대로 대비하지 않으면…… 분명, 분명 언젠가는……"
1014906-82 = "험한 꼴을 당하실지도 모른다구여……!"
1014906-83 = "[s13] \"알겠어. 그러니까 지금은 내게 의지해줘.\"\n[s14] \"자, 의무실까지 부축해 줄테니 나한테 기대.\""
1014906-86 = "선생님께 의지를……?"
1014906-87 = "선생님의 어깨를…… 정말로 빌려도 괜찮은 건가여……?"
1014906-88 = "후후…… 후후후……"
1014906-89 = "……어쩌면 가끔씩 잠수병에 일부러 걸리는 것도 나쁘지 않을지도."
1014906-90 = "[s] \"뭔가 지금 위험한 말 하지 않았니?\""
1014906-91 = "안 했는데요?!"
1014906-93 = "(이후, 잠수병에 취해 인사불성이 된 코코로를 오디세이아의 의무실까지 데려다 주었다.)"
1014906-94 = "(감압 챔버에서 나온 코코로는 다행히 무사해 보였지만, 어째서인지 한동안 나를 피해 다녔다…….)"
