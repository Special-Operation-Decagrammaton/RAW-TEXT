[translation]
10035110-1 = "제11화;에필로그"
10035110-3 = "실례합니다!"
10035110-4 = "생활안전국 경관 키리노, 공안국에 용무 있어서 왔습니다!"
10035110-5 = "들어가도 되겠습니까!"
10035110-6 = "그러니까 그런 절차 필요 없다니까."
10035110-7 = "확실히……저번에도 그렇고, 대답해 주는 사람은 없는 느낌……."
10035110-8 = "응응, 그러니까 대충 들어가면 된다는 뜻."
10035110-9 = "그리고 어차피 공안국에서 불러서 온 거잖아."
10035110-10 = "아, 그랬죠."
10035110-11 = "분명 저번 파견 임무를 성공적으로 마친 것에 대한 포상을 준다고 했어요!"
10035110-12 = "이 순간이 가장 기대됐단 말이지."
10035110-13 = "뭘 줄까? 10박 11일 포상 휴가? 마스터 도넛 한 달 무료이용권?"
10035110-14 = "혹은 경비국이나 공안국에서 특별히 스카우트해 줄지도 모릅니다!"
10035110-15 = "그건 좀 사양하고 싶은데……."
10035110-22 = "입구에서 뭐 하고 있는 거냐."
10035110-23 = "걸리적거리니 안으로 들어가든지 밖으로 나오든지 해라."
10035110-25 = "아! 공안국장님!"
10035110-26 = "변함없이 일에 찌든 표정이구만."
10035110-28 = "조용히 해."
10035110-29 = "들어와라. 코노카 녀석이 포상을 준비해 뒀다고 했으니까."
10035110-30 = "오오, 듣던 중 반가운 소리."
10035110-31 = "뭔지 살짝 알려주면 안 돼?"
10035110-32 = "나도 모른다."
10035110-44 = "푸엣취!"
10035110-49 = "아, 오셨슴까, 누님."
10035110-50 = "……감기인가?"
10035110-51 = "엣취!"
10035110-52 = "뭐, 그렇긴 한데 별건 아님다. 그럴 만한 사정이 있어서."
10035110-53 = "아무튼, 마침 부르러 갈까 생각했는데 딱 맞게 오셨지 말임다."
10035110-54 = "안녕하세요, 부국장님! 생활안전국 소속 경관 키리노입니다!"
10035110-55 = "여어, 언제나 누님이 신세를 지고 있지 말임다~"
10035110-56 = "나중에 같이 규동이라도 한 그릇 어떻슴까?"
10035110-58 = "쓸데없는 소리 그만해."
10035110-59 = "용건은 포상증 수령이다. 일이 바쁘니 빠르게 처리하도록 하지."
10035110-60 = "알겠슴다. 자, 여기!"
10035110-62 = "오오, 드디어~"
10035110-63 = "어라? 작은 봉투네요?"
10035110-65 = "……어쩐지 불길한데."
10035110-66 = "열어보시지 말임다."
10035110-76 = "이건……."
10035110-77 = "<아에기르>워터파크 이용권이네요."
10035110-79 = "정답!"
10035110-80 = "열심히 일한 당신, 돌아가라!"
10035110-81 = "라이프가드로 일했던 워터파크를 이용객으로 다시 방문!"
10035110-82 = "……하면 특별한 경험이 되지 않을까! 해서……일부러 신청한 건데……."
10035110-83 = "어째, 다들 표정이 안 좋으심다?"
10035110-84 = "거길 또 가라고? 이젠 지긋지긋한걸."
10035110-89 = "본관도, 아직 온몸의 근육통이 사라지지 않았습니다……."
10035110-91 = "나도 반납하지."
10035110-96 = "오, 오잉?"
10035110-97 = "그치만 선배, 워터파크에서 돌아오셨을 때 표정이 꽤나 좋아 보였지 말임다."
10035110-98 = "물놀이, 좋아하시는 거 아니었슴까?"
10035110-99 = "그랬던가. 아니, 물놀이에 취미는 없다."
10035110-100 = "내가 기분이 좋았다면 그건 아마……다른 일 때문이었겠지."
10035110-101 = "무슨 일 말씀이심까?"
10035110-107 = "기밀사항이다."
10035110-110 = "Say-Bing!"
