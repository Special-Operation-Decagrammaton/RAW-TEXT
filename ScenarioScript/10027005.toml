[translation]
10027005-1 = "프롤로그;지식해방전선의 어떤 하루"
10027005-2 = "붉은겨울 학원 도서관"
10027005-13 = "콜록, 콜록!"
10027005-14 = "괜찮아요. 선배?"
10027005-16 = "먼지가 너무 많아! 이러다 폐 다 상하겠어!"
10027005-17 = "청소와 먼지는 떼려야 뗄 수 없는 관계죠……"
10027005-19 = "조금 전부터 계속 같은 생각만 들고 있는데, 이 청소, 의미는 있는 거야?"
10027005-20 = "도서관을 깨끗하게 정리해 봤자, 누가 찾아오기나 하겠냐고! 좋아한다고 해 봤자 낮잠 자러 찾아오는 체리노 회장 정도겠지!"
10027005-21 = "그렇게 뻔질나게 찾아올 거면, 차라리 장서 반입이나 허락해 주던가!"
10027005-22 = "그 말에는 공감이 가네요…… 그렇지만 도서관을 정리해 두는 건 나쁜 일이 아니잖아요?"
10027005-23 = "적어도…… 도서관에서 생활하는 우리들에게는, 좋은 일이 되겠죠……."
10027005-24 = "우에에…… 청소하면서까지 정론을 듣기는 싫어……."
10027005-25 = "그리고요. 청소하다 보면 가끔 뜻하지도 않은 보물을 발견하기도 하잖아요?"
10027005-27 = "이왕 하는 거, 겸사겸사 여러 가지를 노린다고 생각하는 게 좋을 것 같은데요."
10027005-28 = "……그 보물이란 거, 보통 유행 지난 책이나 만화 같은 거잖아……."
10027005-30 = "잊었어요, 메루 선배? 우리 <지식해방전선>에게는 그런 것도 귀하다구요!"
10027005-31 = "콘텐츠의 유입과 순환이 되지 않아서, 다들 무언가 새로운 것을 내놓으라고 아우성치는 게 우리들의 현실이잖아요!"
10027005-32 = "새로운 콘텐츠라고 공급해 줄 수 있는 게, 한물간 책이나 만화 정도라는 거잖아. 그 소리는……."
10027005-33 = "왜 이럴 때만 냉정하게 현실을 지적하는 거예요!"
10027005-46 = "어? 메루 선배! 여기 좀 와 보세요!"
10027005-47 = "엉? 뭔데. 뭔가 찾았어?"
10027005-48 = "네! <루나> 4권부터 21권까지예요! 세상에, 이런 보물이 도서관에서 잠들어 있었다니……!"
10027005-49 = "……<루나>가 뭔데?"
10027005-50 = "네……?! 설마, <루나>를 모르는 거예요? 어떻게 그러고서도 <지식해방전선>을 자처할 수 있다는 거죠. 메루 선배는?!"
10027005-51 = "그러니까 그게 뭐냐고……."
10027005-52 = "이 전설의 작품을 모르시다니, 저 조금 실망했을지도 몰라요!"
10027005-53 = "똑같이 '루나'라는 이름을 가진 두 명의 등장인물이, 어쩌다 같은 이유로 동거하게 되면서 벌어지는 이야기를 다룬……."
10027005-54 = "사랑과 인생과 펑크와 밴드와 영화와…… 아무튼 모든 것의 집대성이라고요!"
10027005-55 = "여러 사정이 있어 완결권인 22권은…… 조금, 그렇게 되었지만……."
10027005-56 = "어쨌든! 이 전설을 모르고 살아왔던 메루 선배의 시간이 불쌍해요!"
10027005-57 = "내 시간이 불쌍하고, 나는 불쌍하지 않은 거냐. 모미지!"
10027005-59 = "제가 메루 선배를 불쌍하다고 생각할 리가 없잖아요!"
10027005-60 = "그건 그래!"
10027005-61 = "아무튼 간에요! 마침 1권부터 3권까지는 제가 소장 중이니까, 이 기회에 선배도 <루나>에 입문해 보는 거예요!"
10027005-62 = "그거 꼭 해야 해?"
10027005-63 = "우리는 <지식해방전선>이잖아요. 모든 지식은 평등하며 소중하죠! <루나>라고 해서 예외가 될 수는 없어요! 아뇨, 그래서는 안 돼요!"
10027005-64 = "사심이 담긴 형태로 <지식해방전선>을 이용하지 마–!"
10027005-79 = "후아아…… 다 읽었다…… 뭐야. 시간이 언제 이렇게 됐대?"
10027005-80 = "그래서요? 그래서요? 어땠어요? 어땠나요?"
10027005-81 = "음…… 우선."
10027005-82 = "우선?"
10027005-83 = "나쁘지 않았어. 나쁘지 않았는데."
10027005-84 = "역시 그렇죠?!"
10027005-85 = "이거, 너무 자극 일발적인 소재만 남발하는 거 아냐?"
10027005-86 = "네……?"
10027005-87 = "갈등을 위한 갈등만을 계속해서 만들어 낸다든가, 처리하기 곤란해진 캐릭터는, 우연을 가장해 잊히게 둔다든가."
10027005-88 = "그, 그건 분명…… 연재 당시에도, 간간이 들렸던 비평이긴 한데, 요……."
10027005-89 = "하, 하지만 그런 식으로 만난 캐릭터들은 분명 매력적이잖아요! 특히나 16권에서 나왔던 스튜디오의 매니저 캐릭터랑 루나가 부딪쳤을 때는 굉장히 멋져서……!"
10027005-90 = "응, 캐릭터 조형은 꽤 좋았어. 출간 연도를 생각하면 오히려 선구적이었다고 봐야겠지."
10027005-91 = "하지만 그 반대급부로 그 캐릭터들을 띄워주기 위해 구성된 스토리가 이리 꼬이고 저리 꼬이는 바람에, 끝내 파탄 나버린 에피소드도 몇 있었고……."
10027005-92 = "심지어 마지막 부분도 마찬가지야. 21권 마지막의 그건 뭐야? 제대로 마무리된 게 하나도 없던데."
10027005-93 = "완결권이 22권이라고 했지? 거기까지 커진 사건을 22권에서 다 수습하는 게 정말 가능한지 궁금할 지경인데. 어때?"
10027005-94 = "22권은…… 없어요."
10027005-95 = "뭐? 완결권이 없다고? 왜?"
10027005-96 = "……데요."
10027005-97 = "응? 잘 안 들렸어."
10027005-104 = "메루 선배가 <루나>에 대해 뭘 안다고 그러는 건데요?!"
10027005-105 = "……으, 으응?"
10027005-107 = "완결권이 왜 없냐니. 그건 오히려 제가 묻고 싶다구요!!"
10027005-108 = "그리고……!"
10027005-109 = "그, 그리고……?"
10027005-110 = "그렇게 말하는 메루 선배야말로, 얼마나 대단한 작품을 만들었다고 그런 말을 하는 건가요?!"
10027005-111 = "일단 이야기를 질러 놓고 뒷수습을 생각하지 않는 건, 선배도 마찬가지잖아요!"
10027005-112 = "캐릭터와 스토리를 짤 때, 장면만 우선 떠올리고 나머지를 거기에 끼워 맞추는 식이니!"
10027005-113 = "스토리와 캐릭터가 흔들리는 건 선배도 더하면 더했지 나은 게 뭔지 모르겠거든요?!"
10027005-114 = "모, 모미지? 갑자기 왜 그래?"
10027005-116 = "저도 참을 만큼 참았어요! 할 말은 해야겠어요!"
10027005-124 = "그랬던 거였군요! 그랬던 거였네요! 제 팬케이크 튀김을 먹은 게 메루 선배였던 거네요?!"
10027005-125 = "실온에 하루 종일 놓여 있길래 괜찮은 줄 알았지! 그러면 이름표라도 써 놓던가!"
10027005-126 = "애초에 자기 것이 아니면 함부로 건드리지 않는 게 상식이잖아요!"
10027005-135 = "늘 자기 멋대로 행동하고, 이야기하고……!"
10027005-136 = "메루 선배…… 쫌생이!"
10027005-137 = "……!"
10027005-138 = "듣자 듣자 하니까…… 나도 해주고 싶은 말이라면 잔뜩이거든?!"
10027005-140 = "남말만 할 게 아니라 모미지도 저번에……!"
10027005-148 = "왜 자꾸 같은 책만 반복해서 들어왔나 했더니, 중복 발주를 넣었던 게 너였냐. 모미지!"
10027005-149 = "하, 한정판을 어떻게든 구하려다 보니 어쩔 수 없었다고요! 그 한정판 구하기가 얼마나 힘든데요!"
10027005-151 = "그 덕분에 두 달간 장서 신청 금지당했잖아! 그건 어떻게 할 건데!"
10027005-158 = "나만 멋대로 행동하는 것처럼 말하는데! 모미지도 마찬가지잖아!"
10027005-160 = "그건 그거고, 이건 이거라구요!"
10027005-161 = "그렇게 구분될 리가 없잖아!"
10027005-163 = "이잇……!"
10027005-164 = "헹……!"
10027005-169 = "됐어요! 이제 선배 같은 건 몰라요!"
10027005-171 = "어디! 자기가 말한 것처럼! 혼자서 잘난 듯이 그렇게 굴고 있으라구요!"
10027005-180 = "누가 무서워할 줄 알고!"
10027005-181 = "나도 모미지 같은 거 몰라!"
10027005-182 = "……."
10027005-183 = "도서관, 나가 버렸네."
10027005-184 = "헹. 잘 됐지 뭐! 모미지 없이도 나 혼자서 얼마든지……!"
10027005-185 = "얼마든지……."
10027005-186 = "……."
10027005-187 = "그래도 되나?!?!"
