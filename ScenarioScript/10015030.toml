[translation]
10015030-1 = "3화;밀레니엄의 트레이너"
10015030-5 = "밀레니엄 서편 별관"
10015030-6 = "(노아와 함께 밀레니엄 학원의 동아리를 순회하며 대운동회 업무를 부탁하던 중에……)"
10015030-7 = "어디 보자…… 고장 난 기기의 수리는 엔지니어 부에서 처리해주시기로 했고, 전산 업무에 대한 걱정도 한시름 덜었으니……"
10015030-8 = "이제 남은 일은 출전 선수들의 컨디션을 체크하고, 엔트리를 정리하는 일 정도네요."
10015030-9 = "[s] \"컨디션 체크?\""
10015030-10 = "네. 선수들이 경기에서 최선의 기량을 낼 수 있도록 개개인의 컨디션을 체크하는 것도 세미나의 업무니까요."
10015030-11 = "다만 저나 다른 세미나의 인원들은 이런 분야의 문외한인지라. 컨디션 체크에는 체육 트레이닝 전문 동아리인 <트레이닝부> 여러분의 도움을 받고 있답니다."
10015030-12 = "……그러고 보니 이 시간이라면 트레이닝부의 부원 여러분도 대회를 앞두고 마지막 훈련을 하고 계시겠네요."
10015030-16 = "열심히 훈련 중인 선수분들을 응원할 겸, 스타디움으로 가기 전에 잠시 피트니스 센터에 들러볼까요?"
10015030-23 = "밀레니엄 피트니스 센터"
10015030-24 = "엉덩이를 뒤로 빼고, 무릎과 발끝 방향은 일치!"
10015030-25 = "이어서 스쿼트 2세트, 추가하겠습니다!"
10015030-26 = "자, 잠시만요, 스미레 부장! 분명 방금 마지막 세트라고 하셨잖아요?"
10015030-27 = "맞아! 심지어 그전에도 마지막이라고 했으면서!"
10015030-28 = "백 스쿼트는 전반적인 근육의 성장을 위해, 바벨을 이용하여 근육에 긴장을 주는 운동……"
10015030-29 = "초심자인 여러분을 위해 저중량의 바벨을 준비했습니다만, 근육 전반에 제대로 된 자극을 주기 위해서 고반복 운동은 필수적이니까요."
10015030-30 = "운동회에서 좋은 성적을 거두기 위해서라도, 포기하지 말고 끝까지 함께 도전합시다!"
10015030-32 = "이렇게 혹독한 훈련을 반복해서야……"
10015030-33 = "대회가 시작하기도 전에 녹초가 되어 쓰러져버리겠어……."
10015030-38 = "어라? 시간이 벌써 이렇게 되었군요."
10015030-39 = "그럼…… 잠깐 휴식한 뒤에 계속해서 운동을 재개하도록 하겠습니다."
10015030-45 = "후후, 스미레 씨는 여전히 운동에는 엄격하시네요."
10015030-46 = "어라? 노아 씨…… 그리고 트레이너?"
10015030-47 = "이 시간에 피트니스 센터에는 어쩐 일이신가요?"
10015030-48 = "내일 있을 대운동회의 막바지 점검 차 학교를 돌아보던 중에 트레이닝부의 선수 여러분을 응원하기 위해 잠시 찾아왔답니다."
10015030-49 = "늦은 밤까지 훈련에 애쓰느라, 수고가 많으시네요."
10015030-50 = "[s1] \"오랜만이야. 스미레.\"\n[s2] \"평소보다 훨씬 기운 차 보이네.\""
10015030-53 = "물론이지요, 트레이너."
10015030-54 = "내일은 <황륜대제>의 개최일…… 그것도 밀레니엄이 주최하는 대운동회가 열리는 날이니까요!"
10015030-55 = "평소에는 스포츠에 관심이 없는 밀레니엄의 학생들이라 하더라도 이날만큼은 회장의 선수들이 자아내는 각본 없는 드라마에서 눈을 떼지 못하겠지요."
10015030-56 = "회장에 울려 퍼지는 관중의 함성……"
10015030-57 = "땀을 흩날리며 코트 위에서 뜨겁게 맞부딪치는 선수들……"
10015030-59 = "그 말인 즉 밀레니엄의 학생들에게 스포츠의 매력을 전파할 수 있는 절호의 기회라는 뜻입니다!"
10015030-60 = "[s] \"아, 알았으니까 진정해…….\""
10015030-61 = "아, 저도 모르게…… 실례했습니다."
10015030-62 = "여하튼. 그래서 오늘은 보시는 것처럼, 내일의 경기를 대비해 다른 학생들과 어울려 개운히 땀을 흘리던 중이었습니다만……"
10015030-68 = "……어라? 방금 전까지 이곳에서 다 같이 스쿼트를 하고 있었는데, 다들 어디에 가신 거죠?"
10015030-69 = "아마 내일의 경기를 위해 먼저 쉬러 돌아가신 모양이시네요."
10015030-70 = "잠을 자기엔 이르지만, 이미 꽤 늦은 시간이니까요."
10015030-71 = "네? 아직 가벼운 스트레칭과 스쿼트 밖에 진행하지 않았는걸요?"
10015030-72 = "초심자가 하는 조직 적응기의 서킷 트레이닝은 심폐기관의 향상을 위해 다양한 부위의 근육을 차례로 강화시켜야 하는데……"
10015030-73 = "게다가 새로운 케이블 머신이 들어와서 다른 방식의 고립 운동법도 가르쳐 드리려 했는데……"
10015030-74 = "그리고 운동이 바로 끝난 뒤에 바로 마실 수 있도록 프로틴 음료도 준비했는데……"
10015030-75 = "[s] \"뭔가 이것저것 많이 준비한 모양이네…….\""
10015030-76 = "물론입니다. 모처럼 세미나에서 부탁을 받아 진행되는 트레이닝인 만큼 허투루 할 수는 없지요."
10015030-77 = "사람의 몸은 다양한 변수로 이루어진 객체이기 때문에 근육을 성장시키기 위한 조건이나 시간이 모두 다르고, 획일화된 트레이닝 스케줄을 사용하면 여러모로 오차가 발생할 수 있습니다."
10015030-78 = "그래서 저희 <트레이닝부>에서는 선수 여러분의 식단부터 생활 습관까지 꼼꼼하게 분석하여, 개인의 환경과 특성에 최적화된 맞춤형 트레이닝 스케줄을 제시하고 있습니다."
10015030-79 = "……앞서 말했듯이 이번 대운동회는 학생들에게 스포츠의 매력을 전파할 기회이기도 하지만, 저희 트레이닝부의 실험 성과를 증명할 기회이기도 하지요."
10015030-80 = "그래서 더욱…… 이번 대운동회가 기대됩니다."
10015030-81 = "[s3] \"이런 모습만 두고 보면……\"\n[s4] \"스미레도 영락없는 밀레니엄의 학생이네.\""
10015030-84 = "후후, 밀레니엄의 동아리 활동은 모두 과학적인 연구에 기반하여 진행되고 있으니까요."
10015030-85 = "트레이닝부의 여러분이 열심히 노력해 주신 만큼, 이번 대운동회에서는 밀레니엄 학원의 선수들이 좋은 기록을 내면 좋겠네요."
10015030-86 = "음…… 아쉽지만 그건 어려울 것 같습니다."
10015030-90 = "대회에 출전하는 대부분의 선수가 정규 트레이닝을 경험한 적 없는 운동 초보자이고, 훈련 기간도 충분하지 못했으니까요."
10015030-91 = "하지만 괜찮습니다. 대운동회의 가치는 경기의 승패나 기록이 아닌, 참가 그 자체에 있으니까요!"
10015030-92 = "……그렇지만 조금 아쉬운 것도 사실이네요."
10015030-93 = "짧은 훈련 기간을 보완하기 위해 근육을 효율적으로 성장시킬 수 있는 맞춤형 트레이닝 플랜을 세웠는데, 다들 중도에 포기해 버리셔서……"
10015030-94 = "[s] \"너무 어려운 스케줄을 짠 거 아냐?\""
10015030-95 = "그렇지 않습니다. 균형 잡힌 근육을 만들기 위해 하루 2시간의 무산소 운동을 부탁드렸을 뿐인걸요."
10015030-96 = "물론 워밍업을 위한 스트레칭과 심폐 강화를 위한 유산소 운동에 드는 시간은 제외하긴 했지만……"
10015030-97 = "그래도 길어봐야 하루 4시간은 넘지 않으니까요!"
10015030-98 = "[s] (트레이닝부에 온 학생들이 어째서 도망가는지 알 것 같네…….)"
10015030-99 = "그러고 보니…… 모처럼 피트니스 클럽을 찾아와 주셨는데, 트레이너도 가볍게 운동이나 하고 가시는 게 어떠신가요?"
10015030-100 = "[s7] \"마음은 고맙지만, 대운동회 준비가 바빠서……\"\n[s8] \"우리는 빨리 돌아가야지, 노아?\""
10015030-103 = "아뇨. 그렇게 서두를 필요는 없습니다."
10015030-104 = "각 동아리를 순회하는 업무도 생각보다 일찍 끝났고, 남은 일이라면 엔지니어부 부실에 가서 수리된 로봇을 수령하는 것 정도인데……"
10015030-105 = "부탁하는 입장에서 업무를 독촉하듯 일찍 찾아가도 곤란하니까요."
10015030-106 = "적어도 앞으로 30분 정도는 여기서 느긋하게 쉬어도 괜찮겠네요."
10015030-107 = "30분이라……"
10015030-108 = "가볍게 웨이트 트레이닝을 하기에 딱 좋은 시간이군요!"
10015030-114 = "[ns] \"그럼…… 노아도 같이 운동하는 거야?\""
10015030-115 = "그야 물론……"
10015030-119 = "어머나, 갑자기 제 검토를 필요로 하는 급한 메일이……"
10015030-120 = "아쉽지만 저는 여기에 앉아서 잠깐 업무를 먼저 처리해야겠어요."
10015030-121 = "그동안 선생님께서는 스미레 씨와 느긋하게 운동을 즐겨주세요."
10015030-125 = "[ns] \"앗, 치사하게 혼자 도망치다니!\""
10015030-126 = "후후. 안 그래도 트레이너와 함께 새로 도입한 초절정 스미스 머신으로 가슴 이두근 고립 웨이트를 하고 싶던 참이었습니다."
10015030-130 = "자, 먼저 여기에 서서 자세를 잡아주세요."
10015030-135 = "[ns] \"무…… 무거워……!\""
10015030-136 = "왜 그러시죠? 휘청거리고 계시지 않습니까."
10015030-137 = "무릎과 발끝 방향 일치시키고, 허리는 구부리지 않습니다!"
10015030-138 = "앞으로 3세트…… 시작합니다!"
10015030-140 = "선생님, 허리 다치지 않게 조심하세요~"
10015030-145 = "(이후, 30분 동안 진이 다 빠질 때까지 스미레와 웨이트 트레이닝을 했다……)"
