[translation]
1001515-1 = "아리스와 칭찬 스티커"
1001515-2 = "(아리스의 말대로, 게임개발부실로 향했다.)"
1001515-3 = "(그때……!)"
1001515-8 = "선생님!!!"
1001515-9 = "[s] \"아리스!!!\""
1001515-10 = "와아! 선생님입니다!"
1001515-15 = "(아리스가 있는 힘껏 달려와 안겼다!)"
1001515-16 = "(선생님은(는) 거의 넘어질 뻔했다!)"
1001515-19 = "어서 오세요, 선생님! 기다리고 있었습니다!"
1001515-20 = "[s] \"응! 그런데 보여 주고 싶다는 게 뭐야?\""
1001515-21 = "후. 후. 후……. 그건 말이죠……."
1001515-22 = "이것입니다!"
1001515-24 = "(아리스는(은) 작은 플라스틱 배지 같은 것을 건네 왔다!)"
1001515-26 = "[ns1] \"이건…… 배지, 같은 거야?\"\n[ns2] \"'Good Job'이라고 쓰여 있네?\""
1001515-29 = "배지가 아니라 <선생님의 칭찬 스티커> 실물 굿즈입니다!"
1001515-30 = "그게 뭐냐고요? 어어, 그러니까……."
1001515-31 = "예전에, 모두와 힘을 합쳐 만들었던 로그라이크 게임이 있었습니다."
1001515-32 = "거기에서 정말 얻기 힘든, 행운의 유니크 아이템을 만들었는데……."
1001515-33 = "그것이 <선생님의 칭찬 스티커>였습니다!"
1001515-34 = "장비하거나 사용하지 않아도, 그저 인벤토리에 가지고만 있어도, 캐릭터가 강해지고 행운이 올라가는……."
1001515-35 = "정말 좋은 아이템이었습니다!"
1001515-36 = "[s3] \"그래, 그래…….\"\n[s4] \"그래서 그 실물 굿즈를 만들었다는 거구나.\""
1001515-39 = "맞습니다!"
1001515-40 = "그래서 이제부터, 이 칭찬 스티커를 모두에게 나눠드리려고 해요!"
1001515-41 = "그러니까, 선생님. 함께 모험을 떠나죠!"
1001515-43 = "(기운 넘치는 아리스에게 이끌려, 밖으로 향했다.)"
1001515-45 = "안녕하세요, 여러분!"
1001515-46 = "안녕, 아리스. 선생님도 안녕하세요?"
1001515-47 = "그래서 오늘은 무슨 일이야?"
1001515-48 = "네! 칭찬 스티커를 전해드리러 왔습니다. 여기요!"
1001515-49 = "'Good Job'……. 그러네. 특별히 뭘 한 건 없지만, 왠지 기분이 좋아지는 느낌이야."
1001515-50 = "그러고 보니 이거, 선생님이 칭찬해 주는 거나 마찬가지였지?"
1001515-51 = "감사합니다. 선생님."
1001515-52 = "[s] \"어, 으응……. 내가 특별히 뭘 해준 건 없지만 말이야.\""
1001515-53 = "헤헤. 그래도 왠지 이런 게 좋아서요."
1001515-54 = "고마워. 아리스. 잘 간직할게."
1001515-55 = "네. 분명 좋은 일이 일어날 겁니다. 게임에서도 행운 스탯까지 올려 주는 아이템이었으니까요."
1001515-56 = "행운……. 응. 그런 거라도 있으면 좋을 것 같아."
1001515-57 = "……신소재를 개발하는 건, 가끔 복권을 긁는 거나 마찬가지일 때가 있거든."
1001515-58 = "………막자사발에 재료를 넣고, 손으로 직접 하나하나 갈아준 다음 구워내고."
1001515-59 = "그걸 또다시 부숴서 갈고, 섞고, 섞고, 돌리고, 흔들고……."
1001515-60 = "그걸 무한히 반복하면서, 뭔가 새로운 결과가 나오기를 기도하는 과정이니까……."
1001515-61 = "부탁이니까 이번 도자기는 제대로 만들어지게 해 주세요, 칭찬 스티커님!!!"
1001515-62 = "[s] \"고, 고생이 많구나……?\""
1001515-63 = "아리스도 잘은 모르겠지만……."
1001515-64 = "분명히, 그렇게 될 겁니다!"
1001515-65 = "그러면 아리스는 다른 분들에게 칭찬 스티커를 나눠드리러 가겠습니다!"
1001515-69 = "야, 야! 빨리 와 봐! 지금 뭔가 새 그래프가 나왔어!"
1001515-70 = "어?! 정말로?!?!"
1001515-71 = "그렇다니까!"
1001515-76 = "설마……."
1001515-77 = "정말로, 칭찬 스티커가……?"
1001515-80 = "그러면 아리스는 가 보겠습니다. 힘내세요! 분명 모든 게 잘될 겁니다!"
1001515-81 = "말만이라도 고마워. 서버를 다루다 보면, 기도라도 하고 싶어지거든."
1001515-85 = "어……?"
1001515-86 = "정말로 서버 오류가 고쳐졌잖아?!?!"
1001515-89 = "아하. 이게 그 칭찬 스티커구나."
1001515-90 = "네! 아리스와 선생님을 생각하며, 소중하게 간직해 주셨으면 합니다!"
1001515-91 = "물론 그래야지. 고마워, 아리스."
1001515-96 = "어라? 식권 추첨 3등 상에…… 당첨?"
1001515-97 = "……."
1001515-98 = "오늘은 가라아게 추가해서 먹어야지!"
1001515-101 = "이것이야말로! 원적외선과 음이온을 방출해 혈액 순환에 좋고!"
1001515-102 = "총열의 탄매도 감소시켜 주며, 몸에 지니기만 해도 탄 걸림 현상까지 싸악 없애주는!"
1001515-103 = "바로 게르게르 게르마늄 팔찌입니다!!!"
1001515-107 = "……"
1001515-108 = "하아……. 뭔가 장사가 잘 안되네……."
1001515-109 = "안녕하세요! 뭔가 잘 안되는 일이 있으신가요?"
1001515-111 = "어? 특별히 그런 건……."
1001515-112 = "……아닌 것도 아니긴 한데……."
1001515-113 = "그렇군요……. 그러면 이걸 드리겠습니다."
1001515-114 = "행운 스탯을 올려주는, 칭찬 스티커입니다!"
1001515-115 = "뭐, 뭐야. 강매라도 할 셈이야?!"
1001515-116 = "아닙니다. 그냥 드리는 겁니다."
1001515-117 = "아리스는, 더 많은 분이 행복해졌으면 하니까요!"
1001515-121 = "뭐야, 대체……."
1001515-125 = "어? 지금 무슨 소리지?"
1001515-126 = "……! 저, 정말로 걸렸던 탄피가 알아서 배출됐어!"
1001515-130 = "이상하다……? 게르게르 게르마늄 팔찌에, 정말로 그런 효과는 없을 텐데……?"
1001515-135 = "(그렇게 아리스와 함께, 많은 학생에게 칭찬 스티커를 나눠주고 게임개발부실로 돌아왔다.)"
1001515-136 = "(하루의 마무리는 당연히…… 게임인 것이었다!)"
1001515-143 = "감사합니다. 선생님."
1001515-144 = "[s] \"응? 뭐가?\""
1001515-145 = "오늘 아리스와 함께해 주셔서요. 그리고……."
1001515-146 = "지금도 아리스와 같이, 이렇게 게임을 해 주셔서요."
1001515-147 = "게임개발부 친구들과는 자주 같이 게임을 할 수 있지만……."
1001515-148 = "선생님과 단둘이서 하는 게임은, 좀처럼 드문 경험이니까요."
1001515-149 = "그 모든 것이 아리스에게는, 소중한 레어 경험치입니다."
1001515-150 = "[s] \"에이, 이런 거 가지고 뭘.\""
1001515-151 = "아닙니다. 아리스는 선생님과 같이 있다는 것이 너무 좋습니다."
1001515-152 = "얼마나 좋으냐고 한다면……."
1001515-153 = "선생님과 함께라면, 그리고 칭찬 스티커와 함께라면……."
1001515-154 = "오늘뿐만이 아니라, 3일은 밤새가며 게임을 할 수 있을 것 정도로요!"
1001515-155 = "[s5] \"그렇게 게임만 하면 안 된단다…….\"\n[s6] \"선생님은 3일 밤샘은 무리에요…….\""
1001515-158 = "그, 그렇습니까……? 죄송합니다……."
1001515-159 = "하지만 선생님도 칭찬 스티커를 받으시면, 분명 뭐든지 더 잘할 수 있게 될 겁니다. 아리스는 그랬거든요!"
1001515-160 = "대전 게임에서 체력이 1픽셀 남았을 때, 필살기를 전부 저스트 가드하고!"
1001515-161 = "레이지 상태의 역전 일발 초필살기를 날릴 수도 있을 정도로요!"
1001515-162 = "[s] \"그걸 진짜로 한 거야?!\""
1001515-163 = "그렇습니다! 모모이와 싸울 때 한 번뿐이었지만!"
1001515-164 = "그날은, 게임개발부실이……."
1001515-165 = "어어, 그러니까……."
1001515-166 = "그야말로 폭발할 정도였습니다!"
1001515-167 = "[s] \"나도 부르지!\""
1001515-168 = "그, 그러고 보니……?"
1001515-169 = "끄앙! 죄송합니다, 선생님!"
1001515-170 = "[s] \"괜찮아, 괜찮아.\""
1001515-176 = "[ns7] \"하지만 그 스티커는, 일단 내가 주는 스티커란 거잖아?\"\n[ns8] \"그걸 선생님이 받아 봤자, 어딘가 어색할 것 같은데~\""
1001515-179 = "맞습니다. 선생님. 정말 중요한 부분을 이야기해 주셨습니다."
1001515-180 = "그래서 말이지요……."
1001515-181 = "아리스는 사실, 선생님 전용으로 <아리스의 칭찬 스티커>를 두 개 만든 것입니다!"
1001515-182 = "[s] \"아리스의 칭찬 스티커?!\""
1001515-190 = "네! 아리스가 선생님께 드리는……."
1001515-191 = "아리스가 선생님을 칭찬하는 스티커입니다!"
1001515-192 = "물론 선생님의 칭찬 스티커처럼 모든 것이 잘 되고, 행운 스탯이 오르거나 하지는 않겠지만……."
1001515-193 = "그래도, 받아 주셨으면 좋겠습니다. 아리스도 같은 것을 가지고 있으니까요."
1001515-194 = "그렇게 해 주시면, 아리스는 언제나 선생님과 연결된 기분을 느낄 수 있을 것 같습니다."
1001515-200 = "[ns] \"응. 당연히 그래야지.\""
1001515-201 = "네. 선생님."
1001515-202 = "역시 아리스는 선생님이 정말로 좋습니다."
1001515-203 = "[s] \"선생님도 그래.\""
1001515-204 = "감사합니다. 선생님."
1001515-205 = "그렇게 말하는 사이, 2연 부채 날리기에 점프 강킥, 거기에서 이어지는 강펀치 스턴!"
1001515-206 = "마지막으로 스페셜 아츠 레벨 3 초필살기입니다!!!"
1001515-210 = "[ns9] \"다, 당했다!!!\"\n[ns10] \"아리스……! 듣기 좋은 말을 깔아두고 울트라 콤보라니!\""
1001515-213 = "후후후……. 그렇습니다! 피도 눈물도 사제지간도 없는 수라의 길!"
1001515-214 = "그것이 격투게임의 세계인 겁니다!"
1001515-216 = "(그렇게 아리스와 사이좋게 게임을 계속했다.)"
1001515-217 = "(아리스는 이길 때나 질 때나, <아리스의 칭찬 스티커>를 소중하다는 듯이 바라보곤 했다.)"
