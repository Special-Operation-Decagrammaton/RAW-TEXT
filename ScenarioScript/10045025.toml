[translation]
10045025-2 = "[log]70명 탈락![/log]"
10045025-4 = "[log]경기 종료![/log]"
10045025-7 = "모두 고마워. 덕분에 통과할 수 있었어."
10045025-8 = "모두 고생하셨습니다!"
10045025-10 = "……예상보다 격렬한 싸움이었네."
10045025-11 = "이걸로 전원 통과네요! 다른 분들이 없었다면 정말 어떻게 되었을지."
10045025-13 = "……."
10045025-14 = "키쿄? 괜찮아? 표정이 안 좋은데."
10045025-15 = "……머리카락이 살짝 젖었어."
10045025-16 = "으, 역시 젖는 건 기분 나쁘네."
10045025-21 = "……뭐야? 그 눈."
10045025-22 = "말하고 싶은 게 있으면 확실히 말하는 게 어때?"
10045025-23 = "으음, 그러고 보니 네가 물에 들어가는 건 목욕할 때 말곤 본 적이 없네."
10045025-24 = "물에 젖어 흐트러진 모습은 남에게 보여주고 싶지 않아."
10045025-26 = "누가 봐도 고양이잖아."
10045025-33 = "(……그래. 차라리 고양이 같다는 말을 듣는 게 나아.)"
10045025-34 = "(중요한 건 어떻게든 자연스럽게 내가 물을 싫어한다고 어필하는 것.)"
10045025-35 = "(그래야 만약 물에 빠졌을 때도 핑곗거리가 생길 테니까.)"
10045025-36 = "(모든 건…… 계획대로!)"
10045025-38 = "자아~ 참가자 여러분 모두 수고하셨습니다!"
10045025-39 = "그럼 이제 다음 경기를 발표한 뒤 잠시 휴식에 들어갈게요!"
10045025-40 = "다음 종목에 대비할 수 있도록, 충분히 쉬어 주세요!"
10045025-41 = "[ns] \"다음 경기는 바로 이거야!\""
10045025-43 = "[log]폭주하는 제트보트![/log]"
10045025-46 = "드리프트와 다이브를 반복하는 제트보트! #n떨어지면 실격입니다!"
10045025-47 = "[ns] \"경기는 열 명이 남을 때까지 계속될 거야!\""
10045025-48 = "안전요원을 빼곡하게 배치했으니, 모두 걱정 마시고 즐겨주세요, 냥냥!"
10045025-51 = "……망했네."
