[translation]
10033070-1 = "제7화;각자의 사정"
10033070-3 = "이야– 게헨나 녀석들, 보통이 아니었지?"
10033070-4 = "그러게 말이야. 간만에 힘들여서 전망대 바닥을 '청소'해 뒀는데."
10033070-5 = "오히려 바닥 전체를 미끌미끌하게 만들어서 놀이터로 만들어 버릴 줄은."
10033070-6 = "그런 말도 있잖아? 가장 강한 것은 사실 즐기는 자라고."
10033070-7 = "맞아, 맞아. 애초에 축제란 건 즐기는 거니까 말이지. 아, 그래도 사출 폭탄을 설치하겠다고 했을 때는 조금 가슴이 철렁했어."
10033070-8 = "만에 하나 바닥에 흠이 나거나 깨지기라도 하면, 뒷처리가 골치 아파졌을 테니까 말야……."
10033070-15 = "뭘 한가하게 그 녀석들 대단해, 이 녀석들 엄청나~ 같은 이야기 하고 있는 거야!"
10033070-16 = "아, 리더! 거기 있었군요! 이제 돌아오는 겁니까?"
10033070-17 = "<담력 시험 코스에서 일부러 엄청난 요괴를 보여줘서, 게헨나 녀석들에게 뜨거운 맛을 보여주자! 계획>은 어떻게 됐어요?"
10033070-18 = "……작전상 후퇴야!"
10033070-19 = "돌아오면서 살짝 봤는데, 그 녀석들 겁먹기는커녕 신이 나서 온갖 화기들을 있는 대로 쏴대던데요."
10033070-20 = "어떤 의미로는 불꽃놀이 같았죠! 막 펑펑 터지고 번쩍거리고 하는 게."
10033070-21 = "아, 그래도 공예 공방에서 다짜고짜 온천을 파 내려간 다음, 우리를 온천장의 장식으로 쓰겠다는 말은 솔직히 무서웠어……."
10033070-22 = "대응 수준의 스케일이 다르다고 할까, 우리로서는 도저히 상상도 못 할 방법으로 접근해 온다고 할까……. 역시 게헨나네. 무엇을 상상하든, 그 이상을 보여 줘."
10033070-23 = "쿠사야 잼 토스트, 다시 만든다면 먹을 거야?"
10033070-24 = "내가 왜?! 스스로 만들면서도 정신이 어딘가로 날아가 버릴 것 같았는데! 킁킁. 으으, 아직도 옷에 냄새가 배어 있는 것 같아……."
10033070-25 = "그런데도 그걸 왠지 맛있게 먹던 녀석이 있었지……."
10033070-26 = "그건 일종의 경이라고 해야 하나……. 그 녀석이 먹지 못하는 음식이라는 게 존재하기는 하는 걸까?"
10033070-32 = "크아앗! 뭘 추억담 나누듯 한가하게 그랬었지, 이랬었지 말랑말랑한 이야기나 하고 있는 거야!"
10033070-33 = "너희들! 너무 안이해진 것 아니냐고! 생각해 보란 말이야! 애초에 신목제를 내일 한다는 것부터가 문제잖아!"
10033070-34 = "신목제는 원래 1년에 한 번만 이루어지는 축제이자 백귀야행의 축제…… 어떤 의미로는 우리 망량즈의 축제란 말야!"
10033070-35 = "그런 우리 망량즈의 신목제를, 게헨나 녀석들이 놀러 왔다는 이유를 들어, '재현'이라는 명목을 붙여 다시 개최하려 하다니!"
10033070-36 = "신목에게 두 팔이 달려 있었다면, 지금쯤 땅을 치며 한숨을 내쉬고 있겠다!"
10033070-38 = "어어…… 그렇지만 게헨나 학생들은 어떤 의미로 보면 백귀야행의 축제를 즐기러 온 관광객들이고요?"
10033070-39 = "원래 우리 백귀야행은…… 관광객이 찾아오는 걸 누구보다 환영하는 학원이기도 했잖습니까?"
10033070-40 = "거기에 뭐, 신목제 역시 이제 와서는 운수 대통! 만사 형통! 쪽의 느낌이 더 강해지기도 했고 말이죠……."
10033070-41 = "또 아나요? 신목 입장에서는 그렇게라도 한 번 더 자기를 찾아와 주고, 기억해 줘서 기쁘다고 생각할지도 모르고 말이죠."
10033070-46 = "너희들까지 말이 안 통하면 어쩌자는 거야!"
10033070-51 = "자, 자. 리더. 너무 그렇게 열 내지 말고요."
10033070-53 = "두고 보자고……. 내일의 신목제에서, 반드시 우리들 망량즈의 축제를 되찾아 오겠다고 선언해 줄 테니까 말이야!"
10033070-55 = "그런데 리더. 그거…… 어떤 의미로는 우리들의 축제를 우리가 방해하는 셈이 되는데…… 괜찮은 겁니까?"
10033070-56 = "뭔가, 살짝 느낌이 좋지 않다고 할지, 구체적으로는 오히려 우리가 더 큰 망신을 당할 것 같다고 할지……."
10033070-58 = "괜찮아! 어차피 내일의 신목제는 결국 재현 행사니까, 어느 정도 엉망이 된다 해도 의미상 큰 문제는 없을 거야!"
10033070-59 = "우리의 목적은, 백귀야행의 축제는 백귀야행의 것이라는 걸! 나아가 우리 망량즈의 것이라는 걸! 게헨나 녀석들에게 확실하게 보여 주자는 거니까!"
10033070-61 = "아, 그건 조금 마음에 드네요. 백귀야행의 축제는 백귀야행의 것…… 나아가 우리 망량즈의 것……."
10033070-62 = "뭐어, 어떤 의미로는 지금까지 게헨나 녀석들에게 당하기만 해 왔다고 볼 수도 있으니 말이죠?"
10033070-63 = "그러면 내일 조금만 더 힘내 볼까?"
10033070-64 = "그러고 보니 내일은 치세 님도 직접 신목제에 참가하신다고 했지~ 기대되네~"
10033070-65 = "무대에 올라서 봉헌하는 모습도 볼 수 있으려나~ 좋구나~"
10033070-70 = "그! 러! 니! 까! 조금 더 확실하게 경각심을 가지라고!!!"
10033070-78 = "아. 수고하셨어요, 선생님."
10033070-79 = "그래도 걱정했던 것보다, 게헨나 학생분들이 비교적 잘 잠들어 주셔서 다행이었네요."
10033070-80 = "[s1] \"분명 피로 피를 씻는 베개싸움이라든가…….\"\n[s2] \"자유!!! 를 외치며 밤거리로 나올 학생들이 생길 줄 알았어…….\""
10033070-83 = "다들 피곤했던 모양이었으니까요."
10033070-84 = "그래도 야간 순찰은 소홀히 할 수 없겠죠?"
10033070-85 = "[s] \"우미카야말로 인솔하느라 고생이 많네.\""
10033070-86 = "아니에요……. 그야말로, 최악인 모습만 모두에게 보여드려서."
10033070-87 = "할 수 있다면…… 지금까지의 모든 시간을 지우고 싶은 기분이에요……."
10033070-88 = "일정대로 흘러간 건 없고, 계획이란 계획은 모두 어그러지기만 하고……."
10033070-89 = "사장님이 계셨더라면…… 분명……."
10033070-90 = "[ns3] \"세상에는…… 이런 말이 있어.\"\n[ns4] \"계획이란, 어그러지기 위해 있는 거라는 말이…….\""
10033070-93 = "네, 네에? 그건 도대체 무슨 의미이신지……?"
10033070-94 = "때가 되면 자연히 알게 될 거라고요? 점점 더 모르겠는데요……?"
10033070-95 = "[s] \"그렇지만, 축제 계획도 종종 어긋나고는 하잖아?\""
10033070-98 = "……축제 계획, 말씀이신가요……."
10033070-99 = "확실히, 생각해 보면 축제를 위해 세운 계획은…… 뜻대로 안 되는 경우가 많죠."
10033070-100 = "축제 현장은 보통 돌발 상황의 연속이니까, 거기에 어떻게 대처하느냐가 핵심이기도 하고요."
10033070-101 = "하지만……."
10033070-102 = "……저는, 지금까지 현장의 돌발 상황을 제대로 대처해 본 적이 없어요."
10033070-103 = "[s] \"그건 조금 의외네.\""
10033070-104 = "네. 그런 부분은 보통, 사장님께서 주로 담당하시곤 했으니까요."
10033070-105 = "저, 한심하죠? 축제를 좋아하면서, 축제를 계획하고 준비하는 일에는 나름대로 열심이면서……."
10033070-106 = "축제에서 가장 중요하고 힘든 부분에 대해서는…… 사장님에게 무의식중에 어리광을 부리고 있었던 거예요……."
10033070-107 = "지금은 제가 어떻게든 할 수밖에 없다는 걸 알면서도, 마음속 어딘가에서는……."
10033070-108 = "사장님이 여기 있었으면 좋겠다고 생각하는, 그런 저 자신이 있어요……."
10033070-109 = "[s5] \"갑자기 이 정도의 일을 맡게 되었으니, 당연하다고 생각하지만.\"\n[s6] \"그걸 그냥 방치하고 싶지는 않은 거지?\""
10033070-112 = "히잉……."
10033070-114 = "얍! 공격이다!"
10033070-115 = "[ns] \"우왓?!\""
10033070-117 = "키, 키라라 씨? 에리카 씨?"
10033070-121 = "안녕안녕! 뭔가 기운 없이 축 쳐진 채 걸어가길래!"
10033070-122 = "그러다 누구 다치면 어쩌려고 그래."
10033070-123 = "에이, 설마! 그런데 왜 이렇게 풀이 죽었어?"
10033070-124 = "그건……."
10033070-130 = "지금까지는 잘 하고 있는 것 같은데?"
10033070-131 = "……잘, 모르겠어요. 오늘만 해도 일정대로 된 건 거의 없었고, 스케줄은 밀리기만 하고……."
10033070-132 = "으음……. 내가 이런 말을 하는 것도 조금 우스울 수 있겠지만."
10033070-133 = "……우리 학교 애들이잖아? 그 정도면…… 정말 잘 했다고 생각해."
10033070-134 = "맞아, 맞아! 자신 가지세요. 가이드 언니!"
10033070-135 = "전망대에서 신목도 멋있었고, 공예품 만들기도 재밌었고, 저녁도 맛있었고!"
10033070-136 = "담력 훈련은…… 음……."
10033070-137 = "여, 역시?!"
10033070-138 = "아니, 우리가 미안해. 그냥 그렇다고."
10033070-142 = "……있잖아요. 저는 그냥……."
10033070-143 = "잘하고 싶었어요. 그저…… 그게 전부에요."
10033070-144 = "[s] \"응. 알지……. 이해해. 이해하고말고.\""
10033070-145 = "(사장님이었다면, 분명…….)"
10033070-146 = "하지만 말이야. 항상 모든 게 100퍼센트로 잘 되는 건 거의 불가능한 일이잖아?"
10033070-147 = "그렇지. 무슨 일이 있을지, 사전에 다 알면서 움직이는 게 아니라면 말이야."
10033070-148 = "난 오늘 좋았어! 분명 내일도 재미있을 것 같고! 그러면 된 거 아냐?"
10033070-149 = "말씀만이라도, 감사해요……."
10033070-150 = "으음, 뭐. 그냥 하는 말은 아니긴 한데 말이지."
10033070-151 = "아무튼, 쌤도 우미카도 고생이네. 이런 시간에 순찰까지 돌아야 하고."
10033070-152 = "아하하하! 그야말로 가이드 팀이라는 거네!"
10033070-157 = "[ns] \"별말씀을. 그런데 말입니다.\""
10033070-158 = "응? 갑자기 왜 그래, 쌤?"
10033070-159 = "[ns] \"지금은 통금 시간 아니었던가요. 게헨나 여러분?\""
10033070-164 = "앗차."
10033070-165 = "와아~ 들켰다~ 도망가자~!"
10033070-170 = "[ns] \"거기 서라~ 말썽꾸러기들~\""
10033070-173 = "(…….)"
10033070-174 = "(무슨 일이 있을지, 사전에 다 알면서 움직이는 게 아니라면, 이라고……?)"
10033070-175 = "(그러면, 무슨 일이 있을지 알고 미리 준비한다면…….)"
10033070-176 = "(오늘처럼, 스케줄이나 일정이 어그러지지 않도록 할 수도 있지 않을까?)"
