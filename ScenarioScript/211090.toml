211090-113 = "*gasp* A-Aren't you...?!"
211090-114 = "Indeed we are. And listen closely, little man. Soba must uphold the \"trinity of freshness\"—freshly ground, freshly rolled, and freshly boiled. But what has been laid before us, ladies?"
211090-115 = "I can barely spare a moment to mention the ODOR of the buckwheat. The noodles were not so much as rinsed properly, and this starchy texture is akin to chewing on mud."
211090-116 = "Most egregious is the tsuyu, as unbalanced as a trebuchet! The soy sauce and the broth fail to sing in harmony, for they are SCREAMING in utter agony!"
211090-117 = "That's right! My noodles were waterlogged and clumped up in a doughball! I'm on the verge of passing out from hunger, and this is still unacceptable."
211090-118 = "Fufu, your generous portions gave me high hopes, but I was quickly disappointed... With such flavorless noodles, I could eat a hundred bowls and not be satiated."
211090-119 = "How about we add some peanut butter and hot sauce? It might zing it up!"
211090-120 = ""
211090-122 = ""
211090-123 = "There is no way for a restaurant, one which has willingly and repeatedly exchanged \"food\" for payment, to repent for such actions."
211090-124 = "N-No...! P-Please! We'll stop with the clickbait ads, and even the AI pictures! I beg you!"
211090-125 = "This shop has soiled the very foundation of this building. Only an explosion can...!"
