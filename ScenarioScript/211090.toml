[translation]
211090-1 = "第9話;チャンス"
211090-2 = "ゲヘナ再興委員会"
211090-4 = "先生！やっほー！"
211090-5 = "やっほ～！"
211090-6 = "[s] \"やっほー。\""
211090-7 = "お越しいただきありがとうございます。"
211090-8 = "早速本題で恐縮なのですが、本日協力していただきたいのは――"
211090-12 = "「ポイント提携店」との新規契約です！"
211090-13 = "[s] \"気合の入れ方が違う……！\""
211090-14 = "最近SNSでめっちゃバズってるお蕎麦屋さんだよ。#n昼休みは2時間待ちが当たり前。"
211090-15 = "[s] \"昼休みに……2時間待ち？\""
211090-16 = "授業をサボって昼休み前から並ぶか、次の授業をサボるかしているそうです。"
211090-17 = "実にゲヘナらしいですね。"
211090-18 = "規律に従わない生徒がいるのなら、そうせずに済む環境を整えるのが私たちの目標。"
211090-19 = "この店を新規提携先に選んだ理由も、そこにあります。"
211090-20 = "前置きはこのくらいにして、ひとまず行きましょう。"
211090-25 = "こちらです。"
211090-26 = "蕎麦食べるの久しぶりかも！#n最近忙しかったし、ずっと売店で済ませてたからね。"
211090-27 = "食べてみようって話には賛成だけど、奢ってもらっちゃっていいの？"
211090-28 = "[s] \"大丈夫、大丈夫。\""
211090-32 = "人に厚意を示せる機会はそう多くありません。どうか私たちに感謝してください。"
211090-33 = "[s] \"あ、そっちが感謝される側？\""
211090-34 = "奢ってもらうのに何言ってんのさ。"
211090-35 = "私はこれでいいんです。一介の書記ですから。"
211090-36 = "ショウコちゃんの中で書記って……。"
211090-37 = "とにかく！ありがとう、先生！"
211090-38 = "おや？なにやら面白いイベントをやっているようですね。"
211090-39 = "わんこそば100杯チャレンジ成功で全額無料……。"
211090-40 = "やー、100杯は無理じゃない？そんな食べらんないよ。"
211090-41 = "フードファイターか、お腹に亜空間を持ってる人しか挑戦しないでしょ。"
211090-42 = "早く順番来ないかな～！"
211090-51 = "ありがとうございました～！"
211090-52 = "……。"
211090-53 = "……もう来なくていいかな。"
211090-54 = "だよね。あんなに待たされたのに。時間の無駄だった。"
211090-59 = "[ns] \"……。\""
211090-61 = "（その後も、楽しそうな顔で出てくる人はほとんどいなかった）"
211090-62 = "（かなり長い時間待ち続けた）"
211090-64 = "（ようやく席について注文を済ませると……）"
211090-68 = "はい、お待ちどうさま～！ざるそば定食、四人前で～す！"
211090-73 = "えっ、早すぎない！？もうお腹ぺこぺこだから嬉しいけど！"
211090-74 = "見た目はめちゃ美味しそうだね。"
211090-75 = "いただきまーす！"
211090-76 = "[s] \"いただきます！\""
211090-80 = "……。"
211090-81 = "……。"
211090-82 = "……。"
211090-83 = "うーん……。"
211090-84 = "……味、薄くない？"
211090-85 = "私のは驚くほどしょっぱいです。#nそちらの塩分がすべて移ってきたのかと思うくらい。"
211090-86 = "なんか、バランスがさ……。"
211090-87 = "[s] \"美味しくは……ないね。\""
211090-88 = "だよね、かなり微妙。"
211090-89 = "空腹補正がかかっていてこの評価なら、かなり深刻です。"
211090-90 = "なんで人気なんだろ……？"
211090-91 = "先生が奢ってくれたし、楽しく食べたかったのに……。"
211090-92 = "私たちはまんまと騙されたわけです。"
211090-93 = "わんこそば100杯という噂に！！"
211090-94 = "それ気にしてたのショウコだけじゃない？"
211090-98 = "これは……見過ごせませんわね。"
211090-102 = "[ns] \"この声は……！\""
211090-105 = "SNSで話題だと聞き、美食の地平を広げるべく足を運んでみれば――"
211090-106 = "とんだ無駄骨でした。"
211090-113 = "ひっ……！あ、あなた達は……！"
211090-114 = "蕎麦は「三たて」……すなわち、挽きたて・打ちたて・茹でたてが命です。#nですが……これはどうでしょう？"
211090-115 = "蕎麦の香りはまったく感じられず。#nすすぎ切れていないでんぷん質は、まるで泥を噛んでいるような舌触り。"
211090-116 = "何より絶望的なのは、つゆのアンバランスさ！#n醤油と出汁が好き勝手に暴走して悲鳴を上げています。"
211090-117 = "見てこれ！麺が伸びて団子みたいに固まってるんだけど！？#nどうやって食べろって言うのよ！"
211090-118 = "期待していたんですけど……残念ですね★#nただただ[ruby=・]量[/ruby]しか言及するところがないなんて。"
211090-119 = "ピーナッツバターとタバスコを一緒に入れたらどうかな？#nちょっとはマシになるかも！"
211090-123 = "基本すら忘れた飲食店に存在価値はありません。"
211090-124 = "や、やめて……！！心を入れ替えるから、どうかお慈悲を……！"
211090-125 = "いえ……このような店は存在自体が食への冒涜！ならば――！！"
211090-130 = "[ns] \"待って……！\""
211090-132 = "あら、先生もいらしたのですね。ごきげんよう。"
211090-133 = "こんにちは～"
211090-134 = "わ～先生だ！"
211090-138 = "え、先生も食べたの？これ……。"
211090-139 = "……。"
211090-140 = "なるほど。この粗末な蕎麦を先生にも出したのですね。#nもはや考慮の余地はありません。"
211090-141 = "[s] \"ちょっ、ちょっと考え直さない？\""
211090-142 = "……。"
211090-143 = "なぜ止めるのですか？#nまさか……料理がお気に召したとでも？"
211090-144 = "[s] \"あ、不味いのは確かだよ、うん。\""
211090-145 = "ぐふぅっ……！？"
211090-147 = "美食研究会の爆破行為は、ゲヘナの評判をひどく傷つけています。"
211090-148 = "彼女たちを統制できれば、理想に大きく近づきます。"
211090-149 = "……よし、勝負だね！"
211090-156 = "こんにちは！"
211090-157 = "あなた方は……。"
211090-158 = "私たちはゲヘナ再興委員会！"
211090-159 = "存じています。ゲヘナを変えようとしているのだとか。"
211090-160 = "そう！#nそれで相談なんだけどさ、このお店の「改善」に賭けてみない？"
211090-164 = "改善？あり得ませんわね。"
211090-171 = "それでも爆破は下策かと。可能性の芽を摘んでしまうのですから。"
211090-172 = "気持ちは分かるけど、即爆破はやりすぎじゃない？"
211090-173 = "だから、私たちと勝負！"
211090-177 = "このお店に時間をあげるの。1週間くらい！"
211090-178 = "それまでは爆破をいったん保留。"
211090-179 = "……？"
211090-180 = "この店が改善して合格点に届いたらさ、希望が証明されるでしょ？"
211090-181 = "……？"
211090-182 = "しかも、もしかしたら美食の聖地になるかも！"
211090-183 = "……。"
211090-184 = "……。"
211090-185 = "えっと……なんか反応ほしいな……。"
211090-191 = "[ns] \"あっ……！！\""
211090-193 = "ドカーン！！"
211090-195 = "あああああ！私の店がぁ！！"
211090-196 = "[ns] \"ハルナ～！\""
211090-198 = "げほっ、げほっ……！"
211090-202 = "結局こうなるんじゃ～ん。"
211090-203 = "はあ……。"
211090-207 = "当然の帰結です。"
211090-208 = "ああ、みなさんの言いたいことは理解しました。"
211090-209 = "じゃあどうして！！"
211090-210 = "私たちの信念とは相反するからです。"
211090-211 = "すでにこの店は美食の道を踏みにじりました。#nなぜ「チャンス」という贅沢を与えねばならないのでしょうか？"
211090-212 = "なにより、この店だけ特別扱いしては、今まで木っ端微塵になってきた数多の店が浮かばれませんわ。"
211090-213 = "そういうことです★"
211090-214 = "うえっ、ぺっぺっ！木くず入った！"
211090-215 = "私、まだ一口も食べれてないのに……。"
211090-216 = "うぅ……本気でこれ続ける気！？"
211090-217 = "あっちこっちの店を爆破して回るつもりなの！？"
211090-218 = "勘違いされては困ります。私たちは手当たり次第に爆破しているわけではありません。"
211090-219 = "美食への想いを、軽く見ないでいただけますか？"
211090-220 = "こんなことしてるからゲヘナの印象が悪くなるんだよ！テロリストじゃん！"
211090-221 = "本質的な過ちは、対価に見合うサービスを提供できない飲食店側にあるのでは？"
211090-222 = "客は代金を支払い、店は金額に見合う料理を出す。簡単なことでしょう？"
211090-223 = "この基本すらできない店に存続する価値があるとでも？"
211090-224 = "言ってることは正論だ……！"
211090-228 = "覚えておいてください。私たちは美食研究会。"
211090-229 = "美味しいものを食べるためなら。"
211090-230 = "どんな苦難も乗り越えてみせる――"
211090-231 = "――あれ、なんだっけ？"
211090-232 = "EAT OR DIE～！"
211090-237 = "では、またお会いしましょう。先生と――"
211090-238 = "「料理の後に残ったオイスターソース保存委員会」の皆さん！"
211090-239 = "ちがーう！「ゲヘナ再興委員会」だから！！"
211090-246 = "[ns] \"結局こうなるのか……。\""
211090-248 = "やはり彼女たちは一筋縄ではいきませんね。"
211090-249 = "そもそも、どうにかできるのかな？#n力ずくでねじ伏せるとかならともかく――"
211090-250 = "なんであれ、努力は続けなければなりません。#nゲヘナのために、制御不能な存在を減らすのです。"
211090-251 = "……必ず。"
211090-252 = "次こそは説得してみせる！"
211090-253 = "とはいえ……美食研究会の考え方自体には共感できる部分もあります。"
211090-254 = "どのへん？"
211090-255 = "弱肉強食の世界で「もう1度」は贅沢だ、という点です。"
211090-260 = "ショウコ、たまに冷たいよね。"
211090-261 = "事実ですから。"
211090-262 = "[s] \"でも、やり直すチャンスはあるといいよね。\""
211090-266 = "……そうですか。"
211090-267 = "誰にでも等しく与えられるなら、それも悪くはないかもしれません。"
211090-268 = "まあまあ。今日は失敗しちゃったけど気にしない！"
211090-269 = "私たちの歩みは止まらないんだから！"
211090-270 = "んー、とりあえず何か食べない？もうお腹ぺこぺこ……。"
211090-271 = "わんこそばにしましょう。近くに別の店があるので。"
211090-272 = "そんなに食べたかったの？"
211090-273 = "行こ行こ！先生もお腹空いてるでしょ？"
211090-277 = "その言葉を待ってたよ。是非ご馳走させてほしいな。"
211090-278 = "――と、先生は考えました。"
211090-279 = "[s] \"元々そのつもりだよ！\""
211090-295 = "（食べるそばから出てくるお代わりと格闘しながら、与えられなかったチャンスについて考えた）"
211090-297 = "（なお、その店はポイント提携をしてくれることになった）"
211090-299 = "次回;交渉……？"
