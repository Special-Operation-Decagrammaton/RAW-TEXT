211090-159 = "Yes, I've heard. You are a group of underclassmen who pledge to bring glorious reforms to Gehenna."
211090-160 = "That's right! To cut to the chase, let's collaborate. What if I told you that we're working to peacefully improve places like this that sell awful food?"
