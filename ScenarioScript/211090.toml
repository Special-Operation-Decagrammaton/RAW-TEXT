211090-217 = "ต่อไปก็จะทำแบบนี้ จะไล่ระเบิดทุกร้านต่อไปเรื่อยๆ งั้นเหรอ!"
211090-218 = "ตายจริง พูดแบบนั้น ฟังดูเหมือนพวกฉันระเบิดร้านไปทั่วโดยไม่เลือกเลยนะคะ"
211090-219 = "อย่าดูแคลนหัวใจที่พวกฉันมีต่ออาหารรสเลิศได้มั้ยคะ?"
211090-220 = "ยิ่งพวกคุณชมรมชิมอาหารทำแบบนี้ ภาพลักษณ์ของเกเฮนน่าเราก็ยิ่งแย่ลงนะ!#nจนตอนนี้กลายเป็นสัญลักษณ์ของการก่อการร้ายไปแล้วด้วย!"
211090-221 = "แต่ความผิดที่แท้จริงอยู่ที่ร้านอาหารที่ให้บริการได้ไม่สมกับเงินที่รับไปไม่ใช่เหรอคะ?"
211090-222 = "ลูกค้าจ่ายค่าตอบแทน ส่วนร้านอาหารก็เสิร์ฟอาหารที่สมน้ำสมเนื้อ..."
211090-223 = "เรื่องง่ายๆ ไม่ใช่เหรอคะ? ร้านอาหารที่ทำไม่ได้แม้แต่เรื่องพื้นฐานที่สุดแบบนี้ มีเหตุผลอะไรให้ยังคง#nอยู่ต่อไปเหรอคะ?"
