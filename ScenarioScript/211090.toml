[translation]
211090-1 = "第9話;機會"
211090-2 = "格黑娜再興委員會"
211090-3 = ""
211090-4 = "你好，老師！"
211090-5 = "呀哈！你好～！"
211090-6 = "[s] 「大家好。」"
211090-7 = "感謝您特地前來。"
211090-8 = "今天之所以請老師來幫忙……"
211090-9 = ""
211090-11 = ""
211090-12 = "正是為了替格黑娜再興委員會簽下新的點數合作店家！"
211090-13 = "[s] 「真是氣勢十足呢！」"
211090-14 = "因為那裡是最近在社群網站上爆紅的蕎麥麵店啊！#n聽說午休時間至少都要排2小時？"
211090-15 = "[s] 「2小時？在那之前午休時間不就結束了嗎？」"
211090-16 = "聽說大部分人不是翹課在午休前就去排隊，就是排完隊吃完再翹掉下一堂課。"
211090-17 = "是的，很有格黑娜的風格吧。"
211090-18 = "既然格黑娜學生們會憑自由意志打亂規律，#n那麼營造出讓他們不必這麼做的環境，就是我們的目標。"
211090-19 = "選擇這裡作為新的點數合作店家，也是因為這個理由。"
211090-20 = "開場白說得有點長了，我們先走吧。"
211090-24 = ""
211090-25 = "就是這裡。"
211090-26 = "哇，好久沒吃蕎麥麵了！最近一直都在福利社隨便解決。"
211090-27 = "老師，沒問題嗎？#n先吃吃看我是贊成啦，不過連我們的份都要請客，真的沒關係嗎？"
211090-28 = "[s] 「沒關係，沒關係。」"
211090-29 = ""
211090-31 = ""
211090-32 = "人生中能施予善意的機會可是少之又少，您不妨感謝我們一下吧。"
211090-33 = "[s] 「謝謝你們？」"
211090-34 = "被請客的人還說這什麼話啊？"
211090-35 = "我這樣就可以了。畢竟我不是委員長，只是一介書記。"
211090-36 = "翔子醬到底把書記當成什麼了啊？"
211090-37 = "總之謝謝你，老師！"
211090-38 = "話說，這家店正在舉辦很有趣的活動呢。"
211090-39 = "「挑戰碗子蕎麥麵100碗成功即全額免費」……"
211090-40 = "噁，100碗太扯了吧？我才吃不了那麼多。"
211090-41 = "會做那種事的人，要不是厲害的大胃王，就是肚子裡有異次元空間吧。"
211090-42 = "真希望趕快輪到我們！"
211090-43 = ""
211090-45 = ""
211090-49 = ""
211090-50 = ""
211090-51 = "謝謝光臨～！"
211090-52 = "……"
211090-53 = "……應該沒必要再來了。"
211090-54 = "就是說啊。白白等了那麼久。根本是浪費時間。"
211090-55 = ""
211090-57 = ""
211090-58 = ""
211090-59 = "[ns] 「……」"
211090-61 = "（之後有許多人進進出出，但幾乎沒有人露出開心的表情）"
211090-62 = "（就這樣等了好長一段時間）"
211090-64 = "（入座點完餐沒多久……）"
211090-65 = ""
211090-67 = ""
211090-68 = "來，各位點的竹篩蕎麥麵套餐4人份上桌了～！"
211090-69 = ""
211090-71 = ""
211090-72 = ""
211090-73 = "咦，這麼快？雖然等到肚子都餓了，上菜快是很好啦！"
211090-74 = "看起來超好吃的耶？那就～"
211090-75 = "我要開動了～！"
211090-76 = "[s] 「我要開動了！」"
211090-77 = ""
211090-79 = ""
211090-80 = "……"
211090-81 = "……"
211090-82 = "……"
211090-83 = "唔嗯……"
211090-84 = "該怎麼說呢……好像有點不夠鹹？"
211090-85 = "我的蕎麥麵倒是鹹得要命。#n看來你那碗的鹽分全都跑到我這碗來了。"
211090-86 = "這味道，有點不太平衡……"
211090-87 = "[s] 「不好吃……」"
211090-88 = "就是說啊。超普通的。"
211090-89 = "在相當飢餓的狀態下還是這種評價，問題可就嚴重了。"
211090-90 = "這家店到底為什麼這麼受歡迎啊？"
211090-91 = "因為是老師請的，本來想吃得開開心心的說～！"
211090-92 = "原來如此。我們被騙了。"
211090-93 = "被碗子蕎麥麵100碗這種好聽的噱頭給騙了！！"
211090-94 = "在意那件事的好像只有翔子吧？"
211090-95 = ""
211090-98 = "這可不能坐視不管呢。"
211090-99 = ""
211090-101 = ""
211090-102 = "[ns] 「這個聲音是……！」"
211090-103 = ""
211090-104 = ""
211090-105 = "聽說最近有家店在社群上備受討論，心想或許能拓展美食的視野才特地前來……"
211090-106 = "沒想到別說是美食了，這裡連最基本的事都做不到呢。"
211090-107 = ""
211090-109 = ""
211090-110 = ""
211090-111 = ""
211090-112 = ""
211090-113 = "嗚，嗚哇！你……你們是！？"
211090-114 = "蕎麥麵的生命在於「三現」……也就是現磨、現擀、現煮的協調。#n然而，這粗劣的成品又如何呢？"
211090-115 = "別說蕎麥的香氣了，沒有好好沖洗而殘留澱粉的口感，簡直就像在嚼泥巴一樣。"
211090-116 = "最重要的是這醬汁的失衡！醬油與高湯各行其是，甚至到了慘叫的地步！#n真是令人無法接受的暴行！"
211090-117 = "沒錯！我的麵都泡脹了，黏得跟年糕一樣！#n雖然我餓到快昏倒了，但這也太過分了吧？"
211090-118 = "呵呵，看起來分量很多，我還很期待呢……真可惜。#n完全感受不到味道深度的碗子蕎麥麵，就算吃完100碗也完全不會有飽足感呢。"
211090-119 = "那要不要試試把這個花生醬跟塔巴斯科辣椒醬一起加進去？#n說不定會好一點哦。"
211090-120 = ""
211090-122 = ""
211090-123 = "收了錢提供餐點的餐廳，卻連這麼基本的事都忘了……實在罪無可赦！"
211090-124 = "不，不要……！！我，我錯了！我再也不在社群網站上買業配廣告了，求求你們！"
211090-125 = "這種店的存在本身就是罪行！就用爆炸來……！！"
211090-126 = ""
211090-129 = ""
211090-130 = "[ns] 「等，等一下！羽留奈！」"
211090-131 = ""
211090-132 = "哎呀，老師也在呢。貴安。"
211090-133 = "老師好～"
211090-134 = "哇～是老師！你好你好！"
211090-135 = ""
211090-137 = ""
211090-138 = "老師也吃了這個嗎？"
211090-139 = "……"
211090-140 = "原來如此！居然給老師也端上這種糟糕透頂的蕎麥麵！#n本來就無法原諒，現在更加無法原諒了！代價就由……！！"
211090-141 = "[s] 「不是……等一下啦！羽留奈！」"
211090-142 = "……"
211090-143 = "老師，為什麼要阻止呢？難道您喜歡這家店的料理嗎？"
211090-144 = "[s] 「怎麼可能！確實是難吃得要命啦！」"
211090-145 = "好受傷！"
211090-146 = ""
211090-147 = "美食研的爆破行為，確實在格黑娜的混亂與惡評中占了很大一部分。"
211090-148 = "要是能管控住他們，對我們來說就沒有比這更好的劇本了。"
211090-149 = "好，該一決勝負了！"
211090-150 = ""
211090-152 = ""
211090-153 = ""
211090-154 = ""
211090-155 = ""
211090-156 = "美食研的各位，你們好！"
211090-157 = "你們是……"
211090-158 = "我們是格黑娜再興委員會！有聽說過嗎？最近開始打響名號了！"
211090-159 = "原來如此。我也有所耳聞。是想改變格黑娜的後輩們組成的團體吧。"
211090-160 = "沒錯！我就開門見山地說了。#n如果能改善這種賣爛食物的店，你們覺得怎麼樣呢？"
211090-161 = ""
211090-163 = ""
211090-164 = "那是不可能的吧。"
211090-165 = ""
211090-167 = ""
211090-170 = ""
211090-171 = "單純的爆破乃是下策。何不嘗試看看變得更好的可能性呢？"
211090-172 = "就算是只值1顆星的店，也沒必要炸掉吧。"
211090-173 = "所以說，要不要跟我們打個賭？"
211090-174 = ""
211090-176 = ""
211090-177 = "給這家店一段改善的時間。大概一週左右？"
211090-178 = "在那之前先暫緩爆破。怎麼樣？"
211090-179 = "……？"
211090-180 = "如果下次這家店拿到及格分數，不就證明了它有變好的希望嗎！"
211090-181 = "……？"
211090-182 = "說不定還會脫胎換骨成為美食聖地呢！不是嗎？"
211090-183 = "……"
211090-184 = "……"
211090-185 = "那個……給點反應嘛……"
211090-186 = ""
211090-188 = ""
211090-189 = ""
211090-191 = "[ns] 「啊啊……！！」"
211090-193 = "轟隆隆隆！！！！"
211090-195 = "不要～～～！！嗚嗚嗚！我的店啊！"
211090-196 = "[ns] 「羽，羽留奈～！」"
211090-198 = "咳，咳咳！"
211090-199 = ""
211090-201 = ""
211090-202 = "結果還是直接炸了嘛～！！"
211090-203 = "唉……"
211090-204 = ""
211090-206 = ""
211090-207 = "呵呵，是的。"
211090-208 = "我明白各位這番話的意思了。"
211090-209 = "那為什麼還要這樣！！"
211090-210 = "因為那完全違背了我們的信念。"
211090-211 = "我實在不明白，為什麼要給背棄美食之道的地方「機會」這種奢侈品。"
211090-212 = "而且要是聽了你們的話……#n那些至今沒能得到一次機會就被炸掉的無數店家，豈不是很冤枉嗎？"
211090-213 = "所以就轟隆隆★了～"
211090-214 = "噁，呸呸！木屑跑進嘴裡了！"
211090-215 = "我的麵都黏在一起，一口都沒吃到耶……"
211090-216 = "嗚嗚，你們真的要這樣嗎？"
211090-217 = "以後也要像這樣到處炸掉各種店家嗎！"
211090-218 = "哎呀，這話聽起來像是我們隨便哪家店都炸呢。"
211090-219 = "可以不要小看我們對美食的心意嗎？"
211090-220 = "你們美食研究會越是這樣，我們格黑娜的形象就越差！#n都變成恐怖攻擊的代名詞了啦！"
211090-221 = "本質上的錯誤，難道不是在於無法提供與價錢相符的服務的餐廳嗎？"
211090-222 = "客人支付代價，餐廳端出與之相應的料理……"
211090-223 = "這不是很簡單嗎？#n連這種基本中的基本都做不到的餐廳，有存在下去的理由嗎？"
211090-224 = "唔，雖然是正論沒錯……！"
211090-225 = ""
211090-227 = ""
211090-228 = "請記住。我們是美食研究會。"
211090-229 = "為了吃到美味的東西……"
211090-230 = "我們什麼都做得出來……"
211090-231 = "啊，接下來是什麼？"
211090-232 = "EAT OR DIE～！！"
211090-233 = ""
211090-235 = ""
211090-236 = ""
211090-237 = "那麼，我們後會有期。老師，還有……"
211090-238 = "……「料理後剩餘蠔油保存委員會」的各位！"
211090-239 = "是「格黑娜再興委員會」啦！完全不一樣好嗎！"
211090-240 = ""
211090-242 = ""
211090-243 = ""
211090-244 = ""
211090-245 = ""
211090-246 = "[ns] 「結果還是變成這樣了……」"
211090-247 = ""
211090-248 = "……要管控他們，果然是非常困難的事呢。"
211090-249 = "那有可能做到嗎？如果是把他們揍趴的話倒還好說……"
211090-250 = "為了格黑娜，我們也必須持續努力，減少無法管控的不確定因素。"
211090-251 = "是的。一定要。"
211090-252 = "嗚，下次一定要說服他們！"
211090-253 = "不過……美食研的思考方式，我倒是有幾分認同。"
211090-254 = "哪個部分？"
211090-255 = "在適者生存的世界裡，「再一次機會」實在太過奢侈了。"
211090-256 = ""
211090-258 = ""
211090-259 = ""
211090-260 = "翔子有時候真的很冷酷耶。"
211090-261 = "因為這是事實。"
211090-262 = "[s] 「要是每個人都有彌補過錯的機會就好了……」"
211090-263 = ""
211090-265 = ""
211090-266 = "……是嗎。"
211090-267 = "如果是適用於每個人的話，那樣也不錯呢。"
211090-268 = "雖然今天各種失敗，不過大家別太在意！"
211090-269 = "因為我們不會停下努力的腳步！"
211090-270 = "嗚啊，先吃點東西吧！餓死我了！"
211090-271 = "附近還有另一家碗子蕎麥麵店。我們走吧。"
211090-272 = "你從剛才就一直在講碗子蕎麥麵耶。原來你這麼想吃啊？"
211090-273 = "走吧，老師！老師也餓了吧？"
211090-274 = ""
211090-276 = ""
211090-277 = "我等你們這句話很久了。就讓我大方地請客吧。"
211090-278 = "──老師是這麼想的。"
211090-279 = "[s] 「就算不加那種旁白，我也會請客的啦！」"
