[translation]
211090-1 = "제9화;기회"
211090-2 = "게헨나재흥위원회"
211090-4 = "안녕, 선생님!"
211090-5 = "야핫! 안녕~!"
211090-6 = "[s] \"안녕, 모두들.\""
211090-7 = "이렇게 찾아주셔서 감사합니다."
211090-8 = "금일 선생님께 도움을 요청 드린 건 다름이 아니라……"
211090-12 = "게헨나재흥위원회의 새로운 마일리지 가맹점을 체결하기 위함입니다!"
211090-13 = "[s] \"비장하네!\""
211090-14 = "왜냐면 거기가 최근 SNS에서 크게 유명해진 소바 가게라서!#n점심시간에는 2시간 웨이팅이 기본이라던데?"
211090-15 = "[s] \"2시간? 그전에 점심 시간이 끝나지 않아?\""
211090-16 = "대부분 수업을 땡땡이치고 점심시간 전에 줄을 서든가, 아니면 줄 서서 먹고 다음 수업을 땡땡이치든가 한다더군요."
211090-17 = "네, 게헨나답죠."
211090-18 = "이렇듯 게헨나 학생들이 자유 의지로 규율을 흐린다면, 그러지 않아도 되는 환경을 조성해 주는 것이 저희의 목표니까요."
211090-19 = "이곳을 신규 마일리지 가맹 대상점으로 결정한 이유도 거기에 있습니다."
211090-20 = "서두가 길어졌습니다만, 일단 가시죠."
211090-25 = "이곳입니다."
211090-26 = "와, 소바는 오랜만이네! 요즘 계속 매점에서 때웠는데."
211090-27 = "선생님, 괜찮아? 일단 먹어보자는 건 공감이지만, 우리 것까지 사줘도 괜찮아?"
211090-28 = "[s] \"괜찮아, 괜찮아.\""
211090-32 = "살면서 호의를 베풀 기회는 좀처럼 오지 않는 법이니, 저희에게 감사하는 것도 좋겠습니다."
211090-33 = "[s] \"감사합니다?\""
211090-34 = "얻어먹으면서 무슨 소리야?"
211090-35 = "저는 이래도 됩니다. 회장도 아니고 한낱 서기니까요."
211090-36 = "쇼코 쨩은 서기를 뭐라고 생각하는 거야?"
211090-37 = "아무튼 고마워, 선생님!"
211090-38 = "그런데 이 가게, 흥미로운 이벤트를 하고 있군요."
211090-39 = "'완코소바 100그릇 도전에 성공하면 전액 무료'라……."
211090-40 = "으에, 100그릇은 무리 아냐? 그렇게 많이 못 먹어."
211090-41 = "저런 걸 하는 사람은 대단한 푸드파이터거나, 뱃속에 아공간이라도 있는 거겠지."
211090-42 = "아무튼 얼른 차례가 왔으면 좋겠다!"
211090-51 = "안녕히 가세요~!"
211090-52 = "……."
211090-53 = "……또 올 필요는 없겠네."
211090-54 = "그러게. 괜히 오래 기다리기만 하고. 시간만 날렸어."
211090-59 = "[ns] \"…….\""
211090-61 = "(그뒤로 많은 사람들이 들어오고 나왔지만, 즐거운 표정의 사람은 딱히 없었다.)"
211090-62 = "(그렇게 꽤 오랜 시간을 기다렸다.)"
211090-64 = "(착석하고 주문한 지 얼마 지나지 않아……)"
211090-68 = "자, 주문하신 자루소바 정식 4인 나왔습니다~!"
211090-73 = "엑, 이렇게 빨리? 기다리느라 배고파서 빨리 나오면 좋긴 한데!"
211090-74 = "엄청 맛있어 보이잖아? 그럼-"
211090-75 = "잘 먹겠습니다~!"
211090-76 = "[s] \"잘 먹겠습니다!\""
211090-80 = "……."
211090-81 = "……."
211090-82 = "……."
211090-83 = "음……"
211090-84 = "뭐랄까…… 약간 간이 부족한 느낌?"
211090-85 = "제 소바는 엄청나게 짭니다만. 그쪽의 염분이 모두 이쪽으로 넘어온 것 같군요."
211090-86 = "이거, 좀 밸런스가……"
211090-87 = "[s] \"맛없네…….\""
211090-88 = "그러게. 엄청 별로야."
211090-89 = "상당히 배가 고픈 상태임에도 이 정도라면 심각하군요."
211090-90 = "대체 이 가게, 왜 인기가 많은 거지?"
211090-91 = "선생님이 사준 거니까 맛있게 먹고 싶었는데~!"
211090-92 = "그렇군요. 우리는 속아버린 겁니다."
211090-93 = "완코소바 100그릇이라는 허울 좋은 이야기에!!"
211090-94 = "그건 쇼코만 신경 쓰고 있었던 것 같은데?"
211090-98 = "이건 좌시할 수 없겠군요."
211090-102 = "[ns] \"이 목소리는……!\""
211090-105 = "최근 SNS에서 크게 언급되는 가게가 있다 하여 미식의 지평을 넓힐 수 있을까 하여 걸음 했더니……"
211090-106 = "미식은커녕, 기본조차 지키지 못하는 곳이었군요."
211090-113 = "허, 헉! 다…… 당신들은?!"
211090-114 = "소바의 생명은 '삼정(三正)'…… 즉, 갓 갈고, 갓 치고, 갓 삶아낸 조화에 있습니다.#n하지만 이 조악한 결과물은 어떤가요?"
211090-115 = "메밀의 향기는 고사하고, 제대로 헹구지 않아 전분기가 남은 식감은 흡사 진흙을 씹는 것 같군요."
211090-116 = "무엇보다 이 츠유의 불균형! 간장과 육수가 따로 놀다 못해 절규하는 맛!#n도무지 납득할 수 없는 폭거입니다!"
211090-117 = "맞아! 내 건 면이 다 불어서 떡처럼 뭉쳐있다고!#n배고파서 쓰러지기 일보 직전이지만, 이건 좀 심한 거 아냐?"
211090-118 = "후후, 양은 많아 보여서 기대했는데 아쉽네요. 맛의 깊이가 전혀 느껴지지 않는 완코소바로는 100그릇을 모두 먹는다 해도 전혀 배가 찰 것 같지 않아요."
211090-119 = "그럼 혹시 이 땅콩버터랑 타바스코를 같이 넣어보면 어떨까? 조금 나아질지도 모르잖아."
211090-123 = "대가를 받고 음식을 제공하는 식당에서 그 기본조차 잊은 죄, 씻어낼 길이 없습니다!"
211090-124 = "아, 안 돼……!! 자, 잘못했어요! 이제 SNS에 바이럴 광고는 그만둘 테니, 제발!"
211090-125 = "이런 가게는 존재 자체가 흉행입니다! 폭발로서……!!"
211090-130 = "[ns] \"자, 잠깐! 하루나!\""
211090-132 = "어머, 선생님도 계셨군요. 안녕하셨나요?"
211090-133 = "안녕하세요, 선생님~"
211090-134 = "와~ 선생님이다! 안녕안녕!"
211090-138 = "그런데 선생님도 이거 먹은 거야?"
211090-139 = "……."
211090-140 = "그렇군요! 선생님에게까지 이런 형편없는 소바를 내준 거였군요!#n이미 용서할 수 없었지만, 더욱더 용서할 수 없어졌습니다! 대가를……!!"
211090-141 = "[s] \"아니…… 잠깐만 기다려줘! 하루나!\""
211090-142 = "……."
211090-143 = "선생님, 어째서 그러시는지요? 혹시 이 가게의 음식이 마음에 드셨다거나 하는 걸까요?"
211090-144 = "[s] \"그럴 리가! 정말 더럽게 맛없긴 한데!\""
211090-145 = "상처!"
211090-147 = "확실히 미식연의 폭파 행위는 게헨나의 혼란과 악평에 있어 큰 부분을 차지하고 있습니다."
211090-148 = "만약 이들을 통제 가능하다면, 우리에게 그보다 좋은 시나리오는 없겠지요."
211090-149 = "좋아, 승부의 시간인가!"
211090-156 = "미식연 여러분, 안녕!"
211090-157 = "그쪽은……."
211090-158 = "우리는 게헨나재흥위원회! 들어본 적 있어? 최근 이름을 알리고 있는데!"
211090-159 = "그렇군요. 저도 들어본 적 있습니다. 게헨나를 바꾸겠다는 후배들의 모임이었죠."
211090-160 = "그래! 단도직입적으로, 만약 이런 저질 음식을 파는 곳을 개선할 수 있다면 어떻게 할래?"
211090-164 = "그럴 리 없을 텐데요."
211090-171 = "단순한 폭파는 하책. 더 나아질 가능성을 보지 않겠습니까?"
211090-172 = "별점 1점짜리 가게라도 터트릴 것까지는 없지 않냐는 얘기지."
211090-173 = "아무튼, 우리와 내기하지 않겠어?"
211090-177 = "이 가게에 개선할 시간을 주는 거야. 한 일주일 정도?"
211090-178 = "그때까지는 폭파를 잠시 유예하도록 하는 거지. 어때?"
211090-179 = "……?"
211090-180 = "만약 다음에 이 가게가 합격점을 받는다면, 나아질 수 있을 거라는 희망을 증명한 거잖아!"
211090-181 = "……?"
211090-182 = "그럼, 어쩌면 미식의 성지로 거듭날지도 모르지! 안 그래?"
211090-183 = "……."
211090-184 = "……."
211090-185 = "저…… 뭔가 반응을 좀……."
211090-191 = "[ns] \"아앗……!!\""
211090-193 = "콰아아앙!!!!"
211090-195 = "안돼~~~!! 어흐흑! 내 가게가!"
211090-196 = "[ns] \"하, 하루나~!\""
211090-198 = "코, 콜록!"
211090-202 = "그냥 터뜨려버렸냐고~!!"
211090-203 = "하아……."
211090-207 = "후후, 네."
211090-208 = "여러분이 하신 말씀, 어떤 뜻인지는 알았습니다."
211090-209 = "그런데 어째서!!"
211090-210 = "왜냐면, 저희의 신념에 정면으로 반하기 때문입니다."
211090-211 = "미식의 도를 저버린 곳에 기회라는 사치가 필요한 이유를 모르겠더군요."
211090-212 = "게다가 당신들의 말을 듣는다면, 지금까지 그 한 번의 기회를 받지 못해 폭파당한 수많은 가게들이 원통해하지 않을까요?"
211090-213 = "그래서 와장창★이에요~"
211090-214 = "으엣, 퉤퉤! 나무조각이 들어갔어!"
211090-215 = "난 면이 뭉쳐 있어서 한 입도 못 먹었는데……."
211090-216 = "으으, 당신들 정말 이럴 거야?"
211090-217 = "앞으로도 계속 이렇게 온갖 가게를 다 터트리고 다닐 거냐고!"
211090-218 = "어머, 그 말씀은 저희가 아무 가게나 폭파하는 것처럼 들리는군요."
211090-219 = "미식에 대한 저희의 마음을 얕보지 말아 주시겠어요?"
211090-220 = "당신들 미식연구회가 이럴수록 우리 게헨나 이미지가 안 좋아진다고!#n테러의 상징이 되어버렸잖아!"
211090-221 = "본질적인 잘못은 대가에 걸맞은 서비스를 제공하지 못한 음식점에 있지 않을까요?"
211090-222 = "손님은 대가를 지불하고, 음식점은 그에 상응하는 음식을 내놓는다……"
211090-223 = "쉽지 않나요? 이런 기본 중의 기본도 해내지 못하는 음식점이 존속할 이유가 있을까요?"
211090-224 = "큭, 정론이긴 한데……!"
211090-228 = "기억하세요. 저희는 미식연구회."
211090-229 = "맛있는 것을 먹기 위해서라면,"
211090-230 = "무엇이든 할 수 있는……"
211090-231 = "아, 뭐였지?"
211090-232 = "EAT OR DIE~!!"
211090-237 = "그럼, 다음에 또 뵙겠습니다. 선생님, 그리고……"
211090-238 = "……<요리 후 남은 굴소스 보존위원회> 여러분!"
211090-239 = "<게헨나재흥위원회>거든! 완전히 다르잖아!"
211090-246 = "[ns] \"결국 이렇게 됐구나…….\""
211090-248 = "……역시 저들을 통제하는 것은 매우 어려운 일이겠군요."
211090-249 = "그게 가능할까? 때려눕히는 거라면 모르겠지만……."
211090-250 = "게헨나를 위해서라도 통제 불가능한 불확실성을 줄이고자 하는 노력은 계속되어야겠지요."
211090-251 = "네. 반드시."
211090-252 = "으, 다음에는 꼭 설득하고 말겠어!"
211090-253 = "다만…… 저는 미식연의 사고방식에 다소 공감은 되는군요."
211090-254 = "어떤 거?"
211090-255 = "적자생존의 세계에서, 또 다른 기회란 지나치게 사치스럽다는 생각입니다."
211090-260 = "쇼코는 가끔 보면 냉정하다니까."
211090-261 = "사실이니까요."
211090-262 = "[s] \"누구에게나 잘못을 돌이킬 수 있는 기회가 있으면 좋을 텐데…….\""
211090-266 = "……그렇습니까."
211090-267 = "누구에게나 적용되는 말이라면, 그것도 좋겠군요."
211090-268 = "아무튼, 오늘은 이것저것 실패했지만 다들 너무 신경 쓰지 마!"
211090-269 = "우리는 계속 노력을 멈추지 않을 거니까!"
211090-270 = "으아, 일단 뭐 좀 먹자! 배고파 죽겠어!"
211090-271 = "근처에 또 다른 완코소바 집이 있습니다. 가시죠."
211090-272 = "아까부터 계속 완코소바 얘기네. 엄청 먹고 싶었구나?"
211090-273 = "가자, 선생님! 선생님도 배고프지?"
211090-277 = "기다리고 있었습니다. 제대로 모시겠습니다."
211090-278 = "-라고 선생님은 생각했습니다."
211090-279 = "[s] \"그런 나레이션 안 넣어도 사줄 거긴 한데!\""
211090-295 = "(맛있는 소바를 먹으며, 받지 못한 기회에 대해 조금 더 생각했다.)"
211090-297 = "(다행히 이번 가게에서 마일리지 계약도 성공적으로 체결할 수 있었다.)"
211090-299 = "다음화;협상……?"
