[translation]
42020-1 = "제2화;토끼가 꾸는 꿈"
42020-4 = "<저희 SRT 특수학원은…… 총학생회장의 사전 활동 허가를 받은 특수 부대로……>"
42020-6 = "<……SRT의 소대는 소수 정예의 팀으로 구성되어……>"
42020-8 = "<……정의란, 진리에 들어맞는 올바른 도리.>"
42020-11 = "<SRT의 정의는, 그 어떤 상황에서도 변하지 않습니다.>"
42020-15 = "……TV 속에 나온 선배들의 모습은 밝게 빛나고 있었다."
42020-16 = "우리가 갖지 못했던 이상을 품고 있는 선배들의 모습은. 선망의 대상, 그 자체였다."
42020-18 = "가혹한 상황 속에서도 중심을 잃지 않는 엄격한 규율을 동경했다."
42020-19 = "그 어떤 악인이라도 일격에 제압할 수 있는 강대한 힘을 동경했다."
42020-20 = "두려운 적 앞에서도 흔들리지 않는 대담한 용기를 동경했다."
42020-22 = "……언제나 변치 않는 정의를 동경했다."
42020-23 = "선배들은 우리의 꿈이자 미래였다."
42020-24 = "그 그림자를 쫓아서 우리는 계속해서 앞으로 달려왔다."
42020-26 = "그리고 우리는……"
42020-30 = "SRT가 되었다."
42020-33 = "으음……."
42020-34 = "아, 미야코 쨩. 좋은 아침."
42020-35 = "……좋은 아침입니다, 미유."
42020-36 = "벌써 일어난 거야? 아침 식사 준비가 끝나려면 아직 시간이 남았는데……"
42020-37 = "미야코 쨩은 어제 야간 경계 근무 때문에 늦게 자리에 들어갔으니까…… 조금 더 자도 괜찮아."
42020-38 = "괜찮습니다. 수면은 이미 충분히 취했는걸요."
42020-42 = "오늘은 날씨가 좋네요. 볕이 좋으니 빨래도 잘 마를 것 같아요."
42020-43 = "그보다 모에와 사키는 어디에……?"
42020-44 = "아까 새벽부터 반찬거리를 구해 온다고 나가던데……"
42020-51 = "다들 이것 좀 봐! 대박이야, 대박!"
42020-52 = "평소에 가던 산책로를 벗어나서 안 가던 길로 가 봤는데, 그 근처에 커다란 버섯 군락이 있어서 큰 것만 골라서 채집해 왔어."
42020-53 = "이만한 양이라면 이틀은 버섯만 먹어도 충분하겠어!"
42020-58 = "후후…… 내가 가져온 물건도 보면 깜짝 놀랄 걸?"
42020-59 = "이것 봐, 달걀이 한 꾸러미나 있어! 아까 돌아오는 길에 상점가에서 주더라고."
42020-60 = "지난번에 골목의 해충 구제를 도와준 답례라나. 나는 그저 새로운 연막탄을 시험해 본 것뿐이었지만……"
42020-61 = "도움이 되었다니 다행이네. 쿠히히……"
42020-62 = "신선한 식재료가 잔뜩……!"
42020-66 = "다행이네요. 안 그래도 보급품인 빵 통조림이 남아있으니, 빵을 곁들이면 호화로운 아침 식사가 되겠어요."
42020-67 = "일단 요리를 하려면 불을 먼저 피워야겠지? 마른 가지가 잔뜩 필요하겠네……"
42020-68 = "그럼 채소와 팬을 씻는 건 내가 맡을게."
42020-69 = "그럼 그 외에 필요한 재료와 향신료는 제가 챙겨오겠습니다."
42020-73 = "나, 나도 도울게……!"
42020-78 = "계란과 빵, 버섯볶음을 곁들인 아침 식사라…… 정말 상상도 못 한 사치인걸."
42020-79 = "매일 이렇게 호화로운 음식만 먹고 싶다—"
42020-80 = "그러게 말이야. 오늘은 선선하니 날씨도 나쁘지 않고……"
42020-81 = "좋은 날씨와 맛있는 밥만 있다면 이곳에서 계속 머무르는 것도 나쁘지 않을지도—"
42020-86 = "……우리. 어느새 노숙 생활에 너무 적응한 것 같지 않아?"
42020-87 = "……부인하지는 못하겠네. 이제 작전은 둘째 치고 사소한 의식주가 개선되는 것에 일희일비하고 있으니……"
42020-88 = "큿…… 우린 SRT의 엘리트인데…… 장비만큼은 키보토스 제일인 특수학원의 소대원인데……"
42020-89 = "너무 우울한 이야기는 하지 말자고. 모처럼 좋은 식재료를 얻었는데, 우중충한 이야기를 하면 밥맛이 떨어지잖아?"
42020-90 = "맞아, 맞아! 우리에겐 이보다 더 좋은 상황은 없을 거야—"
42020-94 = "[ns] \"모두들 안녕!\""
42020-95 = "아, [USERNAME] 선생님이다."
42020-96 = "응? 선생님이잖아. 어서 와."
42020-97 = "아침부터 웬 낯익은 얼굴이 보이기에 누군가 했었네."
42020-98 = "[s1] \"사키에게 이렇게 상냥한 인사를 듣다니…….\"\n[s2] \"선생님이 되길 잘했어……\""
42020-99 = "시, 시끄러워……! 딱히 반가워한 거 아니거든?"
42020-100 = "시, 시끄러워……! 딱히 반가워한 거 아니거든?"
42020-107 = "아, 선생님. 좋은 아침입니다."
42020-108 = "오신다는 연락은 받지 못했는데…… 이 시간에 공원에는 무슨 일로 오셨나요?"
42020-109 = "혹시 저희 때문에 무언가 곤란한 일이라도……"
42020-110 = "[s] \"아니. 그런 문제는 아니야. 단지—\""
42020-112 = "[ns] \"지난번 일에 대해 감사의 인사를 전하고 싶어서.\""
42020-113 = "지난번 일이라면……"
42020-114 = "아아, 그때 그 사건 말인가."
42020-119 = "……그때는 정말 키보토스가 통째로 사라지는 줄 알았다니까."
42020-120 = "파멸을 즐기는 나로서도 등골이 오싹할 정도였다고. 쿠히히……"
42020-121 = "하늘은 새빨갛게 물들고, 시내 곳곳에서는 알 수 없는 적들이 잔뜩 나타나고…… 마음 같아서는 도망쳐 숨고 싶었었지만……"
42020-122 = "……모두가 키보토스를 위해 힘내고 있었으니까요."
42020-123 = "[s] \"성소를 공략하며 많은 학생들의 도움을 받긴 했지만……\""
42020-125 = "으라차차아—!!!"
42020-126 = "RABBIT 소대, 선생님의 도움 요청 연락을 받고 지금 이곳에 도착했습니다."
42020-127 = "[ns3] \"처음에 RABBIT 소대가 나를 구해주지 않았더라면\"\n[ns4] \"반격을 시작하지도 못했을 테니까.\""
42020-132 = "……그 건에 대해서는 감사를 표하지 않으셔도 괜찮습니다."
42020-133 = "SRT의 대원으로서 해야 할 일을 한 것뿐인 걸요……"
42020-134 = "맞아. 선생님이 도움을 요청하지 않았더라도 우리는 도와주러 갔을 거라고!"
42020-135 = "게다가 샬레 건물에 미사일을 날려볼 수 있는 귀중한 기회를 놓칠 수는 없으니까. 쿠후후……"
42020-136 = "[s] \"그래도 뭔가 답례라도 해야 할 것 같아서.\""
42020-140 = "[ns] \"먹을 것을 좀 가져왔는데.\""
42020-141 = "후후…… 이 생활에 완벽히 적응한 우리들에게 먹을 건 충분하거든?"
42020-142 = "답례는 마음만으로도 충분하니 다시 넣어둬."
42020-144 = "네. 저희에게는 시민의 안전을 지켰다는 사실이 제일의 기쁨이니까요."
42020-145 = "오히려 선생님도 아침 식사가 아직이라면 같이 먹고 가는 게 어때? 마침 계란도 버섯도 잔뜩 있거든."
42020-146 = "게다가 오늘 내가 구해온 이 버섯으로 말할 것 같으면 이 근처에서는 쉽게 보기 어려운 만가닥버섯으로, <향은 송이, 맛은 만가닥버섯>이라는 말도 있을 정도의—"
42020-151 = "[ns] \"하지만 이거……\""
42020-153 = "[ns] \"……스테이크용 특상 소고기 등심인데?\""
42020-155 = "어…… 그, 그게 그러니까……"
42020-156 = "물론…… 시민의 안전이 제일의 기쁨이지만……"
42020-157 = "특상 소고기…… 그중에서도 비싸기로 소문난 스테이크용 등심……?"
42020-158 = "그런 거…… 평생 먹어본 적도 없는데……"
42020-159 = "[s5] \"안 받겠다면 어쩔 수 없지……\"\n[s6] \"양이 많으니 대충 라면에 넣어 먹는 수밖에……\""
42020-162 = "그게 무슨 짓이야!"
42020-163 = "지방을 잔뜩 머금은 스테이크용 등심을 라면에 넣어 먹는다고?"
42020-164 = "무슨 판단이냐, 돈을 시궁창에 버릴 셈이냐!"
42020-168 = "[ns7] \"하지만 너무 많아서 이걸 혼자 다 먹기는 어려운걸.\"\n[ns8] \"샬레에는 화덕도 없으니 고기를 굽기도 어렵고.\""
42020-169 = "그, 그런 거라면 여기서 먹어도 괜찮잖아……"
42020-170 = "그, 그런 거라면 여기서 먹어도 괜찮잖아……"
42020-171 = "여기에는 화덕도 있고, 사람도 있는데……"
42020-175 = "[ns] \"그럼 여기서 다 같이 먹자.\""
42020-177 = "네!"
42020-178 = "그럼 저는 바비큐 그릴로 쓸 만한 철망을 준비해 오겠습니다."
42020-179 = "접시가 하나 더 필요하겠네……"
42020-183 = "그, 그보다 고기에 곁들일 만한 부재료가 없으려나. 감자? 아니면 양파……?"
42020-184 = "일단 이 흔해빠진 버섯은 좀 치우고……"
42020-189 = "……쉽게 보기 어려운 버섯이라며?"
42020-190 = "평생 볼 수 있을지 말지도 모르는 특상 소고기 등심이 있는데 버섯이 뭐가 대수야?"
42020-191 = "모에, 너도 빨리 불 준비해! 숯불구이의 생명은 화력이니까!"
42020-192 = "네~ 네~"
42020-198 = "다음화;미끼"
