[translation]
1010205-1 = "퍼퍼퍼펑!"
1010205-2 = "(히요리의 연락을 받고, 늦은 오후에 해변을 찾았다.)"
1010205-7 = "헤헤…… 또 하나 찾았어요……."
1010205-8 = "어디어디…… 여기도 작지만 하나 있고……."
1010205-12 = "[ns] (깡통에다가 뭔가를 주워서 모으고 있네…….)"
1010205-13 = "이쪽은 다 찾은 것 같네요…… 아, 하나 더 있다."
1010205-17 = "찾아보니 상당히 많네요…… 이거라면 선생님도 좋아할 것 같아요……!"
1010205-18 = "아, 여기도……!"
1010205-20 = "(이쪽을 눈치채지 못한 채 뭔가 주워 모으는 히요리를 잠시 지켜보았다…….)"
1010205-22 = "[ns] \"히요리.\""
1010205-23 = "앗, 선생님?"
1010205-24 = "약속 시간이 되었다고요……? 저, 정말이네요. 어느새……."
1010205-25 = "와주셔서 고마워요, 선생님."
1010205-26 = "오늘 와 달라고 부탁드린 건 선생님께 뭔가 보답을 해 드리기 위해서예요…… 헤헤."
1010205-27 = "저번에도 말씀드렸다시피, 선생님께는 매번 받기만 하니까……."
1010205-28 = "[s1] \"부담 가질 필요 없어.\"\n[s2] \"내가 해 주고 싶어서 한 일이니까.\""
1010205-31 = "그, 그런가요? 하지만 제 마음이 편치 않은걸요……."
1010205-32 = "대단한 건 아니니까, 받아 주셨으면 해요…… 헤헤."
1010205-33 = "그럼 바로 시작…… 아, 아직 어두워지지 않았네요. 조금 더 기다려야겠는데요……."
1010205-34 = "네? 어두워져야만 가능한 거냐고요?"
1010205-35 = "그, 그건 비밀이에요. 헤헤……."
1010205-36 = "그럼 잠깐만 같이 기다리죠……."
1010205-40 = "이제 딱 적당해진 것 같네요……!"
1010205-41 = "그럼 시작할게요……."
1010205-47 = "여기 깡통에 모은 물건들에…… 불을 붙이면……."
1010205-48 = "앗, 붙었어요……! 선생님, 여기, 가까이 와서 보세요……!"
1010205-49 = "[s] \"어디, 어디?\""
1010205-52 = "헤헤…… 불꽃놀이에요. 사소하지만요."
1010205-53 = "사실, 아까부터 해변에서 타다 남은 폭죽이랑 부러진 선향을 주워 모았거든요."
1010205-54 = "여름 해변에서는 불꽃놀이가 필수라고, 잡지에서 봤으니까요……."
1010205-55 = "마음 같아서는 새 폭죽을 사서 함께 즐기고 싶었는데, 돈이 없어서…… 헤헤헤."
1010205-56 = "어떤가요……? 그래도 이 정도면 나름 분위기는 난다고 생각하는데요……?"
1010205-57 = "[s3] \"응, 내가 본 것 중 가장 멋진 불꽃놀이야.\"\n[s4] \"멋진 추억이 될 것 같아.\""
1010205-60 = "다, 다행이네요……."
1010205-61 = "보잘것없어서, 선생님이 실망하면 어쩌나 했거든요……."
1010205-62 = "밤하늘에서 멋지게 터지는 불꽃놀이도, 언젠가 볼 수 있으면 좋겠네요……."
1010205-63 = "그때도 선생님이랑 함께라면…… 응?"
1010205-67 = "어라…… 깡통 안에서 뭔가 소리가……."
1010205-71 = "히엑!"
1010205-72 = "[s] \"우왁!!\""
1010205-74 = "콜록, 콜록……."
1010205-75 = "커다란 게 하나 남아있었나 봐요…… 크게 터지는 바람에 깡통이 다 쏟아졌……."
1010205-79 = "……쏟아진 것도 바닷물에 다 꺼져 버렸네요…… 망했네요……."
1010205-80 = "왜 저는 항상 이 모양인 거죠? 불꽃놀이의 낭만 같은 건 제 인생에 있을 수 없다는 건가요?!"
1010205-81 = "우와아아앙!"
1010205-83 = "(히요리를 달래준 뒤, 새 폭죽을 사서 다시 즐겼다.)"
1010205-84 = "(……다행히 히요리는 다소 기분이 풀어진 듯했다.)"
