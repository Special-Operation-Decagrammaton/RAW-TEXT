[translation]
1300805-1 = "공원 잡초 뽑기"
1300805-2 = "오늘은 공원 잡초 뽑기! 간단하면서도 귀찮은 일이야."
1300805-3 = "포인트는 여기, 저기, 저기."
1300805-4 = "특히 저쪽은 엄청 우거져서 제대로 뿌리까지 뽑지 않으면 금세 다시 자라버려."
1300805-5 = "뽑아도 뽑아도 계속 자라는 잡초를 보고 있으면…… 하아……. #n이야기 속에 나오는 돌 굴리는 할아버지가 된 느낌이란 말야."
1300805-6 = "전문 장비라도 있으면 좋겠는데 장비는 장갑이랑 낫뿐이고……."
1300805-7 = "[s] \"힘내자.\""
1300805-8 = "좋아! 파이팅이야, 선생님! 시작하자!"
1300805-10 = "(하루종일 세리카와 잡초를 뽑았다.)"
1300805-11 = "(해가 질쯤에야 간신히 마무리할 수 있었다.)"
1300805-13 = "끝~! 이정도면 OK야!"
1300805-14 = "좋아, 선생님도 그 정도면 꽤 하잖아? 육체노동에 숙달되어 있나 본데?"
1300805-15 = "아우으…… 허리야."
1300805-16 = "환경미화 알바는 방과후에 할 수 있어서 좋긴 한데…… 시급이 좋진 않은 거 같아."
1300805-18 = "……벌써 이렇게 어두워졌구나. 돌아가자, 선생님."
1300805-21 = "(세리카와 나란히 아픈 허리를 부여잡고 집으로 복귀했다.)"
