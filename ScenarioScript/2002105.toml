[translation]
2002105-1 = "산타를 기다리며"
2002105-2 = "어서 오세요, 선생님!"
2002105-3 = "에헤헤. 선생님을 제 방에 초대하는 건 처음이네요."
2002105-4 = "대단한 건 없지만, 편하게 있다 가세요!"
2002105-7 = "[wa:800]― 이건…… [wa:700]제가 산타 할아버지를"
2002105-9 = "[wa:100]― 맞이하는 [wa:800]준비예요."
2002105-12 = "[wa:700]― 산타 할아버지가 춥지 않게"
2002105-14 = "― 벽난로에 [wa:450]불을 넣고…"
2002105-17 = "[wa:50]― 크리스마스 트리를 [wa:800]귀엽게 꾸미는 거예요."
2002105-20 = "[wa:800]― 산타 할아버지,"
2002105-22 = "― 기다리고 있어요~"
2002105-25 = "― 그렇게 하면,"
2002105-27 = "― 반드시 양말에 [wa:1000]선물을 [wa:550]넣어 주시거든요!"
2002105-30 = "[wa:700]― 그리고 올해에는 말이죠……"
2002105-33 = "[wa:800]― 꼭 산타께 [wa:650]보답해 드릴 거예요!"
2002105-36 = "[wa:100]― 에헤헤, [wa:900]어때요?"
2002105-38 = "― 직접 만든 과자와 [wa:1000]신선한 우유라구요!"
2002105-41 = "산타클로스는 매년 이때마다 엄청나게 고생하잖아요?"
2002105-42 = "하지만 저는 받기만 하고, 해 드린 게 없었으니까……"
2002105-43 = "그래서 올해는 반드시 보답해 드리고 싶은 거예요."
2002105-44 = "그러면 산타클로스도 조금이나마 더 힘이 나지 않을까요?"
2002105-46 = "(그 뒤로 하나에가 양말을 다 만들 때까지 옆에 있어 주었다.)"
2002105-47 = "(양말을 다 만든 하나에는 피곤해진 탓인지, 소파에 앉아 꾸벅꾸벅 졸기 시작했다.)"
2002105-48 = "후냐…… 올해 선물로는…… 아무도 안 다치게 해 주세요……"
2002105-49 = "그게 아니라면…… 강력한 소독약을 주세요……"
2002105-50 = "[ns] 조심스럽게 우유와 쿠키를 먹는다."
2002105-52 = "[ns] 하나에의 선물을 사러 나간다."
2002105-54 = "(강력한 소독약이란 건, 생각보다 구하기 어려웠다……)"
