[translation]
101115-2 = "하아…… 하아……. 어, 어떻게든 해낸 것 같아요."
101115-3 = "선생의 지휘는 훌륭하지만 그래도 숫자도, 지원도, 보급품도 압도적으로 우리가 불리해! 지원, 지원이 필요해!"
101115-4 = "하지만 지금 D.U. 전역의 모든 통신망이 셧다운된 상태라……."
101115-5 = "큭…… 이렇게 된 이상 다 같이 탈출하는 수밖엔 없겠군."
101115-6 = "좋아…… 나도 좀 쉬어서 기운을 차렸으니까, 움직이자. 여기서 나가야 해!"
101115-8 = "다음화;탈출 2"
