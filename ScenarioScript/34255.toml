[translation]
34255-5 = "어, 어떻게 된 거야! 마담은 왜 연락이 되질 않는 거지!"
34255-6 = "긴급사태다!! 자치구에 있는 수십 개의 카타콤 입구에서……!!"
34255-7 = "트, 트리니티 병력이…… 쏟아져오고 있습니다!!"
34255-8 = "뭐, 뭐라고?!"
34255-14 = "이, 이쪽입니다!"
34255-15 = "추, 출동-!"
34255-23 = "누, 누구냐!!"
34255-30 = "이곳이 바로 아리우스 자치구……."
34255-31 = "세이아 님의 말대로…… <구호>가 필요한 곳이 분명하군요."
34255-37 = "머, 멈춰!!"
34255-51 = "저를 용서하십시오. 저 역시 사사로운 기억에 이끌려 저의 의무를 등한시했습니다."
34255-52 = "세리나, 하나에. 이들의 치료를."
34255-53 = "네, 네…… 단장님."
34255-54 = "지금부터 제가 만들어내는 부상자들을, 빠르게 구호해서 치료하도록 하세요."
34255-55 = "갑니다!!"
34255-64 = "다, 단장님……"
34255-66 = "이게 바로 <미네 단장님이 부수고 기사단이 고친다.> 라는 저희의 모토네요!! 마치 자가 발전하는 무한 동력 같아요!"
34255-67 = "그, 그런 모토는 없거든요……."
34255-69 = "자, 근면하게 움직이십시오!"
34255-70 = "신념과 긍지를 가슴에! 구호가 필요한 곳에 구호를!"
34255-71 = "갑니다!! 아리우스 자치구를 해방하고 선생님과 미카 님을 구하는 겁니다!!"
34255-73 = "네에!"
34255-74 = "새벽에 불려나와서 갑자기 이런 엄청난 임무라니……! 으아앙-!"
34255-76 = "다음화;앞으로의 우리들"
