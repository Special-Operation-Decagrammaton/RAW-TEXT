[translation]
10054120-1 = "12화;하나만 더"
10054120-5 = "[ns] \"모두 잘 놀았지?\""
10054120-6 = "네! 최고였어요!"
10054120-7 = "맞아. 정말 잊지 못할 기억이었어."
10054120-8 = "일단 명분은 투자처의 현지 감사였다는 사실을 잊지 말아 주었으면 하지만……."
10054120-9 = "후. 그것을 고려해도, 좋은 시간이었다."
10054120-10 = "감사합니다, 선생님. 저희를 위해 이렇게 시간을 내주셔서요."
10054120-11 = "[s] \"아니야. 나도 정말 좋았어.\""
10054120-12 = "그래. 그렇다면 다행이구나."
10054120-13 = "헌데…… 산해경에 별일은 없었겠지?"
10054120-14 = "그럴 겁니다. 카나에 녀석, 그래도 할 때는 하니까요."
10054120-15 = "이렇게 저희가 떠날 때와 마찬가지로, 산해경이 조용한 것을 보면–"
10054120-20 = "어, 어라……?"
10054120-27 = "?!"
10054120-28 = "왜 그러는가, 카나에. 무슨 일이라도 있었느냐?"
10054120-29 = "문주님…… 미나 쨩……."
10054120-33 = "저는, 최선을 다했어요."
10054120-34 = "정말로…… 최선을 다했답니다……."
10054120-35 = "그것만은 부디, 믿어 주셨으면 해요……."
10054120-36 = "꼴까닥."
10054120-41 = "무, 무슨 일인가요? 왜 그러세요?!"
10054120-45 = "현룡문 녀석들, 보자 보자 하니 우리를 무슨 꿔다 놓은 보릿자루 취급하는데 말이지."
10054120-46 = "왜 불 다루는 사람을 건드리면 안 된다는 건지, 이 기회에 좀 알려 주자고."
10054120-52 = "오늘에야말로, 저 오만한 녀석들을 법과 질서로 다스려야 한다!"
10054120-53 = "가자! 현룡문의 시간이다!!!"
10054120-55 = "와! 언니들 엄청 많이 나왔어!"
10054120-56 = "교관 언니들은 나가지 말랬지만, 몰래 나와 보길 잘한 것 같아!"
10054120-57 = "그런데 언니들 표정이 다들 험상궂은데……?"
10054120-58 = "분쟁이란 건 중력 같은 거야. 누가 조금만 밀어주면 아래로 와르르 굴러 내리게 되지."
10054120-59 = "그리고 당사자들 말고는 모두 이익을 가져가는 법이고. 언론은 시청률을 얻고, 기업은 신을 내겠지."
10054120-60 = "세상에서 갈등이 사라지지 않는, 수많은 이유 중 하나라고나 할까."
10054120-61 = "네가 하는 말, 가끔 잘 모르겠어!"
10054120-62 = "[ns1] \"…….\"\n[ns2] \"결국 이렇게 된 건가…….\""
10054120-65 = "……루미."
10054120-66 = "응……. 알고 있어, 키사키."
10054120-67 = "미안하구나. 면목이 없다."
10054120-68 = "아니, 나야말로."
10054120-69 = "조금만 더 힘내 다오."
10054120-70 = "응. 너도."
10054120-75 = "어, 언니? 우리…… 우린 어쩌지?"
10054120-76 = "일단은…… 매화원 아이들을 데리고 돌아가도록 할까요?"
10054120-78 = "[ns3] \"정말이지~\"\n[ns4] \"교육이란 어렵다니까~\""
10054120-82 = "람과천청"
