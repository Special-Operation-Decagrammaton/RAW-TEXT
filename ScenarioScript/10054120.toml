[translation]
10054120-1 = "ตอนที่ 12;อีกเรื่องหนึ่ง"
10054120-2 = ""
10054120-3 = ""
10054120-4 = ""
10054120-5 = "[ns] \"ทุกคนสนุกกันใช่มั้ย?\""
10054120-6 = "ค่ะ! ยอดเยี่ยมที่สุดเลยค่ะ!"
10054120-7 = "ใช่ เป็นความทรงจำที่จะไม่มีวันลืมจริงๆ"
10054120-8 = "แต่อย่างน้อยก็อยากให้จำไว้ว่าจุดประสงค์ของทริปนี้คือการลงพื้นที่ตรวจสอบสถานที่ลงทุนนะ..."
10054120-9 = "ฮุฮุ ถึงจะคำนึงถึงเรื่องนั้นด้วย ก็ยังเป็นช่วงเวลาที่ดีอยู่ดี"
10054120-10 = "ขอบคุณนะคะ คุณครู ที่สละเวลาให้พวกเราแบบนี้"
10054120-11 = "[s] \"ไม่หรอก ครูก็สนุกมากเลย\""
10054120-12 = "อื้อ เช่นนั้นก็ดีแล้ว"
10054120-13 = "ว่าแต่... ที่ซานไห่จิงคงไม่มีเรื่องอะไรเกิดขึ้นหรอกนะ?"
10054120-14 = "คงไม่มีอะไรหรอกค่ะ ยัยคานาเอะน่ะ พอถึงเวลาต้องเอาจริงก็ทำได้อยู่ค่ะ"
10054120-15 = "ดูจากที่ซานไห่จิงยังเงียบสงบเหมือนตอนที่พวกเราออกเดินทางแล้วละก็..."
10054120-16 = ""
10054120-19 = ""
10054120-20 = "เอะ... เอ๋...?"
10054120-21 = ""
10054120-23 = ""
10054120-26 = ""
10054120-27 = "?!"
10054120-28 = "เป็นอะไรไปเล่า คานาเอะ? เกิดเรื่องอะไรขึ้นอย่างนั้นหรือ?"
10054120-29 = "ท่านประมุข... มินะจัง..."
10054120-30 = ""
10054120-32 = ""
10054120-33 = "ฉัน... พยายามอย่างเต็มที่แล้วค่ะ"
10054120-34 = "ฉันพยายาม... อย่างเต็มที่แล้วจริงๆ ค่ะ..."
10054120-35 = "อย่างน้อยก็... เชื่อฉันด้วยนะคะ..."
10054120-36 = "เฮือก"
10054120-37 = ""
10054120-39 = ""
10054120-41 = "กะ... เกิดอะไรขึ้นคะ? เป็นอะไรไปคะ?!"
10054120-44 = ""
10054120-45 = "เจ้าพวกมังกรดำนั่น พอปล่อยไว้ก็เหลิงเลยนะ ทำเหมือนพวกเราเป็นหัวหลักหัวตอไปได้"
10054120-46 = "ถือโอกาสนี้สอนให้พวกนั้นรู้กันหน่อย ว่าทำไมถึงไม่ควรหาเรื่องคนที่ทำงานกับฟืนกับไฟ"
10054120-47 = ""
10054120-49 = ""
10054120-50 = ""
10054120-51 = ""
10054120-52 = "วันนี้แหละ เราจะต้องกำราบพวกยโสโอหังนั่นด้วยกฎและระเบียบ!"
10054120-53 = "ไปกันเลย! ถึงเวลาของมังกรดำแล้ว!!!"
10054120-55 = "ว้าว! พวกพี่สาวออกมากันเยอะมากเลย!"
10054120-56 = "ถึงพี่ๆ ผู้ฝึกสอนจะบอกว่าห้ามออกมา แต่คิดถูกจริงๆ ที่แอบออกมาดู!"
10054120-57 = "แต่ว่าสีหน้าของพวกพี่สาวดูน่ากลัวกันทุกคนเลยนะ...?"
10054120-58 = "ความขัดแย้งก็เหมือนแรงโน้มถ่วง แค่มีใครผลักเพียงนิดเดียว มันก็จะล้มครืนลงสู่เบื้องล่าง"
10054120-59 = "และคนที่ได้ประโยชน์ก็มักเป็นทุกคน ยกเว้นคู่กรณีเอง สื่อได้เรตติง ส่วนบริษัทต่างๆ ก็คงพากัน#nดีอกดีใจ"
10054120-60 = "นี่คงเป็นหนึ่งในเหตุผลมากมายที่ทำให้ความขัดแย้งไม่เคยหายไปจากโลกนี้ละนะ"
10054120-61 = "พูดอะไรยากๆ อีกแล้ว บางครั้งฉันก็ไม่เข้าใจสิ่งที่เธอพูดเลย!"
10054120-62 = "[ns1] \"...\"\n[ns2] \"สุดท้ายก็กลายเป็นแบบนี้สินะ...\""
10054120-65 = "รูมิ..."
10054120-66 = "อืม... ฉันรู้แล้วละ คิซากิ"
10054120-67 = "ขอโทษนะ เราละอายจนไม่รู้จะสู้หน้ายังไง"
10054120-68 = "ไม่หรอก ฉันต่างหาก"
10054120-69 = "ช่วยพยายามต่ออีกหน่อยนะ"
10054120-70 = "อื้อ เธอก็ด้วย"
10054120-71 = ""
10054120-73 = ""
10054120-74 = ""
10054120-75 = "พะ... พี่ชุน? พวกเรา... พวกเราจะทำยังไงดี?"
10054120-76 = "ก่อนอื่น... พาเด็กๆ จากสวนต้นบ๊วยกลับกันดีมั้ยคะ?"
10054120-77 = ""
10054120-78 = "[ns3] \"ให้ตายสิ~\"\n[ns4] \"การอบรมสั่งสอนนี่เป็นเรื่องยากจริงๆ นะ~\""
10054120-82 = "พายุผ่านพ้น ฟ้าหลังฝนงดงาม"
