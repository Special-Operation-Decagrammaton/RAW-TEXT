[translation]
10054120-1 = "第12話;還有一件事"
10054120-2 = ""
10054120-3 = ""
10054120-4 = ""
10054120-5 = "[ns] 「大家都玩得開心嗎？」"
10054120-6 = "嗯！非常開心！"
10054120-7 = "真是一段難以忘懷的回憶呢。"
10054120-8 = "不過還是希望各位別忘了，我們名義上是去對投資地施行實地查核的……"
10054120-9 = "呼……即便把那件事考慮在內，依然稱得上是一段美好的時光啊。"
10054120-10 = "老師，謝謝您特地為我們撥出了寶貴的時間。"
10054120-11 = "[s] 「不會，我也玩得很開心。」"
10054120-12 = "是嗎，若是如此便再好不過了。"
10054120-13 = "不過……山海經應當安然無恙吧？"
10054120-14 = "我想應該不會有事。#n加奈惠那傢伙，該認真的時候還是很可靠的。"
10054120-15 = "就像我們離開一樣，山海經依然平靜──"
10054120-16 = ""
10054120-19 = ""
10054120-20 = "咦，怎麼回事……？"
10054120-21 = ""
10054120-23 = ""
10054120-26 = ""
10054120-27 = "！？"
10054120-28 = "怎麼了，加奈惠。莫非發生了什麼事嗎？"
10054120-29 = "門主大人……美奈醬……"
10054120-30 = ""
10054120-32 = ""
10054120-33 = "我……已經盡力了。"
10054120-34 = "真的……竭盡所能了……"
10054120-35 = "唯獨這點，還請務必相信我……"
10054120-36 = "呃啊。"
10054120-37 = ""
10054120-39 = ""
10054120-41 = "發，發生什麼事了？還好嗎！？"
10054120-44 = ""
10054120-45 = "玄龍門那些傢伙真的是越來越過分，根本把我們當成可有可無的擺設了嘛。"
10054120-46 = "趁這個機會讓他們好好明白為什麼有句話叫「不能招惹玩火的人」吧！"
10054120-47 = ""
10054120-49 = ""
10054120-50 = ""
10054120-51 = ""
10054120-52 = "今天一定要以法律和秩序來制裁那些狂妄的傢伙！"
10054120-53 = "上啊！玄龍門的時代到了！！！"
10054120-55 = "哇！跑出來好多姐姐哦！"
10054120-56 = "雖然教官姐姐們要我們別亂跑，不過偷偷跑出來果然是對的！"
10054120-57 = "可是那些姐姐的表情都很可怕耶……？"
10054120-58 = "紛爭這種東西就像重力一樣，只要有人輕輕一推就會不斷滾下去。"
10054120-59 = "最終除了當事者以外的所有人都能得到好處。#n媒體獲得了收視率，企業則是賺得盆滿缽滿。"
10054120-60 = "或許這就是世界上的衝突始終無法消弭的眾多原因之一吧。"
10054120-61 = "有時候我真的聽不懂你在說什麼！"
10054120-62 = "[ns1] 「……」\n[ns2] 「結果還是變成這樣了嗎……」"
10054120-65 = "……瑠美。"
10054120-66 = "嗯……我知道，妃姬。"
10054120-67 = "抱歉，妾身實在無顏以對。"
10054120-68 = "別這麼說，該道歉的是我才對。"
10054120-69 = "再稍微加把勁吧。"
10054120-70 = "嗯，你也加油。"
10054120-71 = ""
10054120-73 = ""
10054120-74 = ""
10054120-75 = "姐，姐姐？我們……我們該怎麼辦？"
10054120-76 = "總之……先帶著梅花園的孩子們回去吧？"
10054120-77 = ""
10054120-78 = "[ns3] 「真是的～」\n[ns4] 「教育這件事還真難啊～」"
10054120-82 = "嵐過天晴"
