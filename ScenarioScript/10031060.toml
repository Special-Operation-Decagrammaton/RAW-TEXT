[translation]
10031060-1 = "제6화;의장님의 결단"
10031060-2 = "(파티 준비를 돕기로 한 네 번째 날. 만마전으로 향하기 전에 샬레의 업무를 처리하던 중 이로하로부터 연락이 도착했다.)"
10031060-8 = "선생님……"
10031060-9 = "[s] \"어라? 마코토가 아닌 이로하의 연락이라니 별일이네.\""
10031060-10 = "그게 말이죠…… 마코토 선배는 연락을 할 수 없는 상태라고 할까……"
10031060-11 = "아니, 연락을 할 수 없는 정도를 넘어서서…… 이거 어쩌지…… 싶은 곤란한 상태라고 할까."
10031060-12 = "이럴 게 아니라…… 예정보다 빠르지만, 만마전으로 와주시겠나요?"
10031060-13 = "[s] \"………?\""
10031060-20 = "(그렇게 되어 조금은 서둘러 만마전의 집무실을 찾았을 때.)"
10031060-23 = "아……."
10031060-24 = "[s] \"마코토……! 곤란한 상황이 생겼다고 들었어! 무슨 일이야?\""
10031060-28 = "평안하신가요? 선생님."
10031060-29 = "오늘은 평소보다 일찍 찾아와 주셨군요. 후훗. 부지런하시네요."
10031060-33 = "[ns1] \"이로하……! 마코토가 고장났어?!\"\n[ns2] \"단번에 엄청나게 곤란한 상황이란 게 뭔지 이해했어!\""
10031060-36 = "……그렇죠?"
10031060-37 = "저 상태의 마코토 선배, 이상한 걸 넘어서서 솔직히 좀 무섭지 않아? 이로하 쨩……."
10031060-39 = "마코토 선배~ 괜찮아~?"
10031060-40 = "후훗, 이부키. 전 괜찮답니다."
10031060-41 = "아, 이번 파티를 위해 특별히 공수한 우롱차가 있는데. 드셔 보실래요?"
10031060-42 = "이부키는 코코아가 좋아~"
10031060-43 = "네~ 코코아도 좋겠네요~"
10031060-44 = "……………"
10031060-48 = "[ns] \"저기…… 이게 대체 어떻게 된 거야?\""
10031060-49 = "……그게 말이죠."
10031060-51 = "(사건 발생 3시간 전)"
10031060-53 = "이 몸의 동상 홍보 대작전을 방해하다니……! 크읏! 선도부 놈들!"
10031060-54 = "아니, 아무리 그래도 그건 정말 억지였으니까요……."
10031060-55 = "그래도 나름 화제가 된 거 같으니, 홍보로는 성립되었다고 봐도 괜찮지 않을까요? 아하핫. 뭐, 엄청 떠들썩했으니까요~"
10031060-56 = "안돼…… 이대로 있기만 해서는…… 이번 <게헨나 특별 파티>를 통해, 우리 만마전과 선도부의 상하관계를 확실히 하려고 했던 이 몸의 계획에 차질이……."
10031060-57 = "크읏. 치아키! 지금 선도부 녀석들은 뭘 하고 있지?!"
10031060-58 = "아~ 마침 파티에 맞춰, 선도부는 부장 휘하의 멤버 전부가 정기적으로 이루어지는 대테러 훈련에 들어간 모양이에요."
10031060-59 = "과연…… 이것으로 피아노 연습할 시간을 빼앗고는 있단 말이로군."
10031060-60 = "하지만 그것만으로는 부족해. 좀 더 확실한 방법이 필요하다."
10031060-61 = "이 게헨나의 누가 진정한 권력자이고, 리더이며, 앞으로 어깨를 함께 나란히 하고 걸어갈 자격이 있는 자인지…… 게헨나의 모든 학생은 물론 샬레의 [USERNAME] 선생에게 각인시키기 위해서라면……"
10031060-62 = "에이잇! 이로하 <그것>을 가져와라!"
10031060-63 = "<그것>이라니 뭔데요."
10031060-68 = "아, 맞아. 그러고 보니 이번엔 이로하 녀석이 아니라 사츠키에게 준비를 시켰었던가."
10031060-69 = "사츠키 선배를 통해 준비했다고요……?"
10031060-70 = "아하핫! 그 말에 바로 불안감을 느끼는 게 이로하 쨩답네!"
10031060-71 = "대체 뭘……"
10031060-76 = "후후후, 마코토 쨩의 말대로야. 이미 준비는 끝마쳤어."
10031060-77 = "바로 여기…… 나의 NK울트라 프로젝트의 개량판이 말이야!"
10031060-78 = "……네? 개량, 뭐요?"
10031060-79 = "후후, 기존의 내 프로젝트는 어디까지나 만마전에게 충성을 맹세하고 싶게끔 만들어주는, 만마전의 사병을 육성하기 위한 방향성에 초점이 맞춰져 있었지만."
10031060-80 = "이번 개량판은 달라. 마코토 쨩의 요청에 따라, 이번 <최면 기술>이 지향하는 바는 바로……"
10031060-81 = "존경심! 리더를 향한 존경과 그 사랑에 대한 부분에 초점을 맞추어 개량했지!"
10031060-82 = "크크큭! 역시 사츠키! 이 몸의 요청에 제대로 부응한 것이로군! 사츠키의 저 개량판 <최면 기술>을 사용하면……."
10031060-83 = "선도부고 게헨나의 학생이고 선생이고 할 거 없이. 전부 이 몸에 대한 존경을 가슴에 품게 될 터!"
10031060-84 = "………아니, 그게 뭐냐고요."
10031060-85 = "자아. 일단 그 첫 번째 타자로서, 치아키! 이부키! 이로하를 붙잡아라!"
10031060-86 = "네엣?! 뭐, 뭐요?!"
10031060-87 = "네엡~! 명을 받듭니다앗~! 미안, 이로하 쨩~ 부하는 상사의 말을 따라야 하니까!"
10031060-88 = "이로하 선배~! 술래잡기야~!"
10031060-92 = "자, 잠깐?! 이, 이부키까지……?!"
10031060-97 = "크크큭. 이로하, 너의 가슴 깊은 곳에…… 이 몸을 향한 존경심을…… 더욱 업그레이드 시켜주마!"
10031060-98 = "그 말을 제게 직접 하는 시점에서 존경심이고 뭐고 전부 박살 난다는 걸 모르고 있냐고요!"
10031060-99 = "자! 사츠키!"
10031060-100 = "괜찮아. 이로하. 쪼오끔 더 지금보다 마코토 쨩을 좋아하게 될 뿐이니까!"
10031060-101 = "자, 잠까안……!"
10031060-106 = "후후후! 간다!"
10031060-126 = "[ns] \"……즉 이로하에게 걸려던 최면이 마코토에게 걸렸다?\""
10031060-128 = "……네, 천벌 받은 거라고요. 진짜."
10031060-129 = "뭐, 이대로도 무해하니까. 내버려둬도 괜찮지 않아?"
10031060-130 = "보고 있으면 살짝 무섭긴 하지만."
10031060-131 = "이부키는 지금의 마코토 선배도 좋아~"
10031060-132 = "후후, 저도 이부키는 물론, 만마전의 모두들…… 그리고 선생님까지 전부 좋아한답니다."
10031060-133 = "……진짜 무섭긴 하지만 말이야."
10031060-134 = "……마코토 쨩이 이렇게 된 걸 선도부가 알게 되면. 큰일 나는 거 아냐?"
10031060-135 = "특히나 그 선임행정관이 알게 된 날에는…… 가만히 있지 않을 텐데."
10031060-136 = "그러고 보니 마코토 선배가 <대테러 훈련이 걸려 있는 이상, 피아노 연습은 중단하고 훈련 준비부터 해라! 소라사키 히나!>"
10031060-137 = "<이 몸이 만마전의 의장으로서 착실히 모든 훈련 과정을 검수할 테니 말이야!>라고 해서, 현장에 나가야 하는 상황이었죠?"
10031060-138 = "……! 마코토 쨩의 상태를 들키면 그 자리에서 바로 전면전이 발생할지도 모른다구?!"
10031060-139 = "[s] \"아무리 그래도 선도부가 거기까지는…….\""
10031060-140 = "선도부장은 몰라도, 선임행정관이라면 당한 게 있으니…… 욱할지도 모르는데도요? 그래도 선생님은 아무 일도 없을 거로 생각하시나요?"
10031060-141 = "[s] \"……잘 모르겠습니다.\""
10031060-142 = "아하핫~ 거기서 바로 물러서는 건가요. 선생님~"
10031060-143 = "선도부……? 갈등……?"
10031060-144 = "응? 마코토 선배? 왜 그래~?"
10031060-145 = "…………그렇지요. 저희 만마전과 선도부는 이제껏 줄곧 앙숙 관계."
10031060-146 = "견원지간으로서 싸움에 싸움을 거듭해 오고 있었지요."
10031060-147 = "그 원인…… 이유는 무엇일까. 저는 생각한 끝에, 그 이유는 하나밖에 없다고 생각했답니다."
10031060-148 = "[s] \"참고로 그 이유가 뭔데……?\""
10031060-149 = "그건 바로 만마전과 선도부가 존재한다는 사실이어요!"
10031060-153 = "……네?"
10031060-154 = "조직이 존재함으로써 다툼이 발생할 수밖에 없다면…… 그로 인해 다른 학생들이 혼란스러워하며 괴로워하는 미래가 있다면……!"
10031060-155 = "저는 의장의 권한을 행사하여 만마전과 선도부의 해체를 선언하겠어요!"
10031060-166 = "코코아, 맛있다아~"
10031060-168 = "[ns] \"마코토………?\""
10031060-169 = "이러고 있을 때가 아니에요. 이 중대한 결정을 얼른 게헨나 전역에 알리고…… 새로운 시대를 열지 않으면……!"
10031060-170 = "네, 그렇습니다…… 더 이상 싸움을 계속해 봤자 아무것도 얻을 수 없으니까요!"
10031060-171 = "모든 건 게헨나의 평화를 위해서!"
10031060-177 = "자, 자, 자, 잠깐만요?! 마코토 선배?!"
10031060-182 = "아하하하핫!!!"
10031060-183 = "……저러면 싸움이 끝나는 게 아니라, 게헨나 자체가 끝나버릴걸?"
10031060-184 = "[s] \"마, 마코토……! 기다려……!\""
10031060-187 = "(그 뒤로 달려 나간 마코토를 쫓아가, 각고의 노력 끝에 최면을 푸는 데 성공했다.)"
