[translation]
10043080-1 = "제8화;인생은 9회 말 투아웃부터"
10043080-2 = "잠시 보여주십시오. 저는 트레이닝 중 부상에도 어느 정도 대응할 수 있으니……."
10043080-6 = "으……. 으으……."
10043080-8 = "어, 어떤가?"
10043080-9 = "선배, 괜찮죠? 괜찮은 거 맞죠?"
10043080-14 = "으음……."
10043080-15 = "어때요? 어떤가요? 네???"
10043080-16 = "일단, 뼈에는 이상이 없는 것 같습니다. 그건 좋은 소식이군요."
10043080-17 = "하지만……. 오늘 배트를 잡는 것은 위험할 것 같습니다. 적어도 3일 정도는 이 부위를 사용해서는 안 됩니다."
10043080-18 = "자칫하면, 영구적인 인대 손상으로 이어질 수도 있습니다……."
10043080-19 = "영구, 손상이요? 그럴 수가……!"
10043080-21 = "그러게 왜 4번 타자가 이렇게 중요할 때 이런 곳에 와서!"
10043080-22 = "……."
10043080-23 = "……아니야. 따지고 보면, 우리가 잘못한 게 맞지……."
10043080-24 = "우리가 이런 쓸데없는 일을 벌이지 않았어도……. 그냥 아무 일도 하지 않았더라면……."
10043080-25 = "그렇지만……. 역시……."
10043080-26 = "이기는 걸 보고 싶었어! 아니면 적어도 납득할 수 있는 방식으로 지고 싶었어!"
10043080-27 = "……납득할 수 있는 경기 같은 것은 없다네."
10043080-28 = "납득할 수 있는 훈련과, 납득할 수 있는 연습만이 있을 뿐이지……."
10043080-30 = "감독님……!"
10043080-31 = "멋진 말씀이군요. 제 트레이닝 노트에도 기록해 둬야겠습니다."
10043080-36 = "배트가 돌아가지 않았습니다! 배트가 돌아가지 않았습니다! 볼넷을 얻어냅니다!"
10043080-37 = "9회 말 투아웃에서 브레이브스, 만루를 얻어냅니다!"
10043080-38 = "야구에서 특정 상황에 대한 특정 결과를 언급하는 것은 불문율로 알려져 있죠."
10043080-39 = "하지만 이 상황에서는…… 저라고 해도, 조금은 '그 결과'를 기대하게 되는군요."
10043080-41 = "타순은 4번! 4번입니다! 경기장을 가득 채워 주신 팬 여러분!"
10043080-42 = "이 순간입니다! 오늘의 이 경기는 어쩌면 이 순간을 위해 이어져 온 것인지도 모르겠습니다!"
10043080-45 = "[ns] \"9회 말 투아웃에 만루라고? 정말로?!\""
10043080-46 = "그, 반쯤은 자조적으로 하는 농담이기는 하지만, 야구는 9회 말 투아웃부터라는 말이 있기는 하죠……?"
10043080-47 = "그런데 정말로 그런 상황이 와 버렸는데……."
10043080-48 = "으아아아, 어떡하죠. 감독님? 대타, 대타라도……!"
10043080-49 = "나, 남은 대타들의 타율이……?"
10043080-50 = "틀렸어……. 이건 안 돼. 남은 대타는 두 명뿐인데, 그중 한 명은 6푼 9리이고, 다른 한 명은 5푼 3리야……."
10043080-51 = "차라리 관중석에 있는 아무나 데려다 놓고, 눈 감고 휘두르라고 하는 게 더 가능성이 높을 지경이라고!"
10043080-52 = "안 되는 건가……. 오늘도 이렇게, 이런 식으로……!"
10043080-56 = "[ns] \"아니…… 있습니다. 방법은, 있어요.\""
10043080-61 = "방법이…… 있다고 하셨습니까, 선생님?"
10043080-62 = "그게 뭐죠?! 뭔가요!!!"
10043080-63 = "[s] \"레이.\""
10043080-64 = "네, 네!"
10043080-65 = "[s] \"그건, 너야.\""
10043080-69 = "……네?"
10043080-70 = "누구, 저요???"
10043080-71 = "네에? 모든 조건을 따져 봐도, 여기에서 제일 잘 치는 건 저라고요?"
10043080-72 = "밀레니엄 야구부 4번 타자의 진면목을 보여 줄 때라고요???"
10043080-73 = "저기, 조금 진정해 주세요. 선생님. 저도 할 수 있는 일과 할 수 없는 일은 구분할 줄 알아요."
10043080-74 = "일단 저도 밀레니엄 학생이고, 그중에서도 데이터와 통계적인 분석으로 보다 야구의 본질에 접근할 수 있다고 믿는 쪽이라고요."
10043080-75 = "……밀레니엄 야구부가, 객관적으로 강팀이라고는 절대로 말할 수 없는, 아마추어 고등학교 팀이기도 하고요."
10043080-80 = "서, 선생님?!?!"
10043080-84 = "(레이의 양 어깨를 힘차게 잡는다.)"
10043080-85 = "그, 선생님. 아파요. 아니, 사실 아프지는 않지만. 그보다."
10043080-86 = "얼굴 가깝고, 죽을 만큼 부끄럽고……."
10043080-87 = "[s] 레이와 시선을 맞춘다."
10043080-88 = "서, 서서서서, 선생님?!"
10043080-89 = "[s] \"잘 들어. 레이. 내 눈을 봐. 너라면 할 수 있어.\""
10043080-90 = "그러니까 무슨 근거로요!"
10043080-91 = "[s1] \"레이의 타율은 무려 8푼이야. 바꿔 말하면 8%지.\"\n[s2] \"이 확률은…… 웬만한 모바일 게임 확률보다 한참이나 높아!\""
10043080-94 = "……네?"
10043080-95 = "[ns3] \"너 자신을 믿어! 그게 어렵다면 너를 믿는 나를 믿어!\"\n[ns4] \"어차피 이 경기는, 밑져야 본전이니까!\""
10043080-99 = "[ns5] \"만에 하나 레이가 치지 못한다고 해도…….\"\n[ns6] \"브레이브스가 지는 것은, 이제 와서 그렇게 대단한 일도 아니야!!!\""
10043080-104 = "듣고 보니까 그 말은 또 맞는 것 같긴 하네요!"
10043080-105 = "틀렸다고는…… 할 수 없지……."
10043080-106 = "으, 으음……!"
10043080-107 = "야구는…… 사람이 하는 스포츠이고, 사람에 의해 진행되지."
10043080-108 = "그 경향이 점점 통계와 숫자, 이론으로 넘어가고 있는 것도 사실이지만……."
10043080-109 = "사람이 하는 일이다 보니, 가끔 숫자가 이야기해 주지 못하는 부분을, 그 스스로 말할 때도 생기는 법이야."
10043080-111 = "그렇습니다. 레이 양. 이렇게 많은 팬이, 그렇게나 반복되는 결과에도 불구하고, 이 팀을 응원하기 위해 오늘도 이렇게 모였습니다."
10043080-112 = "이것이야말로 확률과 통계만으로는 설명되지 않는, 스포츠다운 현상이 아닐까요"
10043080-113 = "가서, 후회 없이 타석에 다녀오세요. 저 역시 응원하겠습니다."
10043080-118 = "선배……."
10043080-124 = "다녀오겠습니다."
10043080-137 = "보고 계십니까, 여러분! 아무도 기대하지 않았던 대타, 누구도 예상하지 못했던 대타, 그리고 어떤 사람도 알지 못했던 대타!"
10043080-138 = "그 대타가! 오늘 이 경기에서, 가장 뜨거운 결과를 만들어내고 있습니다!"
10043080-142 = "저 대타…… 도대체 누구야? 진짜 처음 보는데……."
10043080-143 = "이 팀에서, 9회 말 2사 만루 상황에서, 여기까지 끌고 올 수 있었던 타자가 존재했다니……."
10043080-148 = "이거 진다고 해서 세상 끝나는 거 아니야. 이거 진다고 해서 내 인생 망하는 거 아니야. 이거 진다고 해서…… 그래도 오늘은 제발!!!"
10043080-149 = "으아아…… 아아아…… 나 못 보겠어. 진짜 못 보겠어. 심장 터질 것 같아. 흐으으으으……."
10043080-150 = "하느님, 부처님, 이름도 모르는 대타님…… 부디……!"
10043080-153 = "투 스트라이크 쓰리 볼……. 흔히 우리가 풀 카운트라고 하죠. 주자는 만루, 이닝은 9회 말."
10043080-154 = "나아갈 곳도 물러설 곳도 없다는 표현은, 아마 이런 때를 위해서 존재하는 것인지도 모르겠습니다."
10043080-159 = "말씀드리는 순간, 투수! 1루로 견제! 다행히도 주자의 발이 빨랐습니다!"
10043080-160 = "투수도 긴장하고 있다는 뜻이겠지요. 당연하다면 당연한 일일 겁니다."
10043080-166 = "(......아무 소리도 들리지 않아.)"
10043080-167 = "(이렇게 많은 사람들이 모여 있고, 이렇게 분위기가 뜨거운데도.)"
10043080-168 = "(나에게는, 아무 소리도 들리지 않아.)"
10043080-172 = "투수 다시 견제! 이번에는 3루였습니다!"
10043080-173 = "(선생님은, 나 스스로를 믿으라고 하셨어.)"
10043080-174 = "(스스로를 믿을 수 없다면, 나를 믿는 선생님을 믿으라고 하셨어.)"
10043080-175 = "(솔직히 그게 무슨 소리인지, 아직도 잘 모르겠지만…….)"
10043080-179 = "가서, 후회 없이 타석에 다녀오세요. 저 역시 응원하겠습니다."
10043080-180 = "(선배는, 응원한다고 말해 주었지.)"
10043080-186 = "……납득할 수 있는 경기 같은 것은 없다네."
10043080-187 = "(정말로, 그 말은 맞는 것 같아. 특히 이 팀에게는…… 어쩌면 나에게도.)"
10043080-193 = "제 응원으로 누군가가 힘을 낼 수 있다면…… 그래서 포기하려고 했던 일에 한 번만이라도 더 도전할 수 있게 된다면……."
10043080-194 = "(그리고…….)"
10043080-197 = "[log]\"너희들을 보는 게\"[/log]"
10043080-199 = "[log]\"좋기 때문일 거야.\"[/log]"
10043080-203 = "(포기하려고 했던 일.)"
10043080-204 = "(하지만 아마, 포기할 수 없을 그 어떤 일…….)"
10043080-205 = "(…….)"
10043080-206 = "(숨을, 들이쉬고.)"
10043080-207 = "(시선을, 앞으로.)"
10043080-211 = "투수, 세트 포지션! 승부구입니다!"
10043080-214 = "힘내요, 레이 양! 할 수 있습니다! 부담 가질 필요도 없어요!"
10043080-215 = "모든 것을 다했다면, 결과는 그다음의 문제입니다!"
10043080-216 = "저는 포기하지 않는 사람을, 정말로 좋아합니다!"
10043080-240 = "쳤습니다! 잡아당겼습니다!"
10043080-241 = "심상치 않아요!"
10043080-242 = "좌익수 뒤로! 좌익수 뒤로! 좌측 담장! 좌측 담장! 날아갑니다! 날아갑니다! 그대로 쭉쭉 날아갑니다!"
10043080-243 = "정말로 큰 타구입니다!!!"
10043080-248 = "넘어갔습니다!!! 넘어갔습니다!!! 좌측 담장 넘어가는!!! 끝내기! 역전 만루 홈런입니다!!!"
10043080-249 = "만루 홈런으로 경기를 장식하는!!! 코기 브레이브스입니다!!!"
10043080-250 = "드디어네요! 마침내입니다! 세상에, 제 눈을 믿을 수 없습니다!!! 이런 일이 현실로 일어날 수 있군요!!!"
10043080-251 = "그렇습니다! 코기 브레이브스의 시라토리 시리즈 첫 승이!!! 이렇게 기적과 같이 쓰입니다!!!"
10043080-254 = "(무슨 일이 있었는지, 어떤 소리가 들렸는지, 그다지 기억나는 것은 없다.)"
10043080-255 = "(다만 기억에 남는 것은, 확실히 무언가를 '쳤다' 는 감각과.)"
10043080-258 = "(하늘 높이 포물선을 그리며 날아가는, 하얀 공의 잔상뿐.)"
10043080-263 = "코기 우승! 코기 우승!"
10043080-264 = "으아아아! 코기 우승!!!"
10043080-266 = "크흐흑…… 이겼어…… 드디어 이겼어. 진짜 정말 처음으로 마침내 이겼다고……!"
10043080-272 = "힉?! 깜짝이야. 이게 도대체……. 어라…… 이겼어? 우리가, 이겼다고? 진짜? 코기 우승!!!!!"
10043080-273 = "안 되는 줄 알았어…… 나 진짜 안 되는 줄 알았어…… 이 팀은 그냥 안 되는 팀이구나, 쭉 그렇게 생각했었어……!!!"
10043080-277 = "감사합니다…… 감사합니다……."
10043080-278 = "이렇게 첫 승을 주셔서, 진심으로 감사합니다……."
10043080-279 = "이기고 싶었습니다…… 진정 이기고 싶었습니다…… 단 한 번이라도 좋으니, 정말로 이겨 보고 싶었습니다……!"
10043080-283 = "길었다……. 정말로 길었어……."
10043080-284 = "하지만, 이 1승으로 만족해서는 안 되겠지. 우리들 브레이브스의 야구는, 이제부터니까!"
10043080-287 = "뭔가 잘 모르겠지만."
10043080-291 = "다들 좋아하니, 저도 좋네요!"
