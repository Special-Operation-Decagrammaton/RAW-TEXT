[translation]
10050030-1 = "제3화;소득 신고"
10050030-2 = "트리니티 학생 숙소"
10050030-3 = "아이고~ 힘드네요, 이거. 이제 겨우 첫날인데."
10050030-4 = "고생 많으셨어요, 부장님."
10050030-5 = "그렇다고는 해도 역시 트리니티네요. 학교 안에 이런 곳이 다 있고."
10050030-6 = "어쨌든 외부와의 교류가 많은 학원이니까요. 이 정도 시설은 있을 수 있겠죠."
10050030-7 = "……제법 가격이 있기는 했지만요……."
10050030-8 = "으음~ 이것도 다 우리가 부담해야 하는 출장 비용이라고 생각하니, 뭔가 아깝긴 하네요. 역시 그때 정산 비율을 좀 더 올릴 걸 그랬나요."
10050030-9 = "그랬다간 메루리 씨가 마지막까지 계약 안 했을 걸요……."
10050030-10 = "그래도 오늘 하루 제법 잘 팔렸던 것 같으니, 어느 정도 보충이 되지 않을까요?"
10050030-11 = "말이 나온 김에, 얼마나 벌었는지 보죠. 설마 손해겠어요?"
10050030-12 = "이야아~ 역시 이때가 가장 두근거린단 말입니다. 그러면 어디, 어디……."
10050030-13 = "……."
10050030-14 = "……."
10050030-19 = "저, 정신 차려요. 타카네!"
10050030-20 = "부장님…… 저 알았어요. 이거 꿈이죠? 그렇다면 다 받아들일 수 있어요."
10050030-21 = "아닙니다. 타카네. 이건 엄연한 현실이에요."
10050030-22 = "우리에게 이렇게 좋은 일이 일어나다니, 그걸 믿으라는 건가요?!"
10050030-23 = "무슨 말인지는 알겠는데, 그래도 이건 현실이에요. 받아들여요."
10050030-24 = "그런데, 확실히 단위 수가 다르긴 하네요. 0이 도대체 몇 개가 더 붙은 거죠……. 이것이 트리니티? 두렵네요. 실로 두려워요……."
10050030-25 = "역시 돈을 벌려면 돈이 모이는 곳으로 가야 하는 거였어요!"
10050030-26 = "이제 와서 하는 감상이지만, 트리니티 학생분들이 우리의 이야기를 신선하게 받아들이는 것도 컸던 것 같아요."
10050030-27 = "한 학생분의 감상이 생각나네요. '지금까지 맛보지 못했던 영양소를 느꼈다……' 였던가요."
10050030-28 = "붉은겨울에서는 어느 정도 익숙해진 것이라도, 다른 곳에서는 그렇지 않을 수 있다는 거네요."
10050030-29 = "역시 문화는 교류해야 해요. 순환해야 하고요. 그렇지 않으면 정체되어서, 주위를 좀먹는 폐단이 되죠."
10050030-30 = "……마치 오래되어 상해 버린, 묵은 꿈처럼요."
10050030-31 = "부장님……."
10050030-32 = "뭐, 기본적으로 우리가 하는 일은, 문화를 널리 퍼트리고 순환시키는 일이죠."
10050030-33 = "……아무튼 문화는, 돈이라는 토양에서 자라나는, 살아 있는 무생물이니까요."
10050030-34 = "돈이라는 개념이 갖는 교환 가치가, 너무 커진 탓도 있겠지만요……."
10050030-35 = "그래도 역시 순환은 필요합니다. 그건 우리에게 있어 중요한 가치예요."
10050030-36 = "오래 묵은 꿈과 오래 묵은 문화는, 많은 것을 망가뜨리는 슬픈 유산들이니까요."
10050030-37 = "무엇보다 그 과정에서 돈 역시 돌게 되는 것이고요. 힛. 힛. 히."
10050030-38 = "네에, 네에. 부장님. 물론이죠……."
10050030-39 = "아무튼, 또다시 다른 의미의 정산 시간입니다! 우선 지식해방전선과 연락하도록 할까요!"
10050030-43 = "후아암…… 뭐야, 야쿠모. 이제 조금 있으면 잘 시간이라고……."
10050030-44 = "지금 졸고 있을 때가 아니에요, 메루. 여러 가지 할 말이 있지만…… 말보다는 숫자가 한번에 와 닿기 마련이죠."
10050030-45 = "받아요. 오늘치 정산분입니다."
10050030-46 = "정산……? 아, 그래. 그렇지. 그러면……."
10050030-53 = "메루 선배? 메루 선배?! 왜 그래요?!?!"
10050030-54 = "모미지. 내가 뭘 잘못 봤나 봐……. 네가 좀 확인해 줘……."
10050030-55 = "네? 이건 그러니까…… 오늘의 정산 금액이네요? 그런데……?"
10050030-56 = "히에에에엑?!?!"
10050030-57 = "솔직히 말해, 야쿠모. 어디 뭐 은행 같은 거 턴 거 아니지? 아니면 무슨 금융상에 중대한 버그나 범죄를 저질렀다거나……?"
10050030-59 = "사람을 뭐로 보는 건가요. 저는 기본적으로 사업적인 마인드를 유지하려 한다고요?"
10050030-60 = "미래에 어떤 리스크를 불러일으킬지 모를, 출처 불명의 자금 같은 건 제 쪽에서 사양입니다."
10050030-61 = "그러면 이게……."
10050030-62 = "……진짜, 라고요?"
10050030-63 = "이런, 이런. 이래서 창작자라는 분들은. 만들 줄만 알지, 홍보할 줄을 모른다니까요."
10050030-64 = "일단 밥이라도 좀 먹어요. 어차피 오늘 저녁도 굶었겠죠?"
10050030-65 = "정말 그래도 돼요……?"
10050030-66 = "그래요. 그건 누구도 부정할 수 없는 지식해방전선의 성과니까요."
10050030-67 = "그런 거죠. 축하해요, 여러분."
10050030-68 = "어, 아, 으, 그, 저기…… 그러니까……."
10050030-69 = "안 돼요, 메루 선배. 이럴 땐 확실하게 말씀드려야 하잖아요."
10050030-70 = "감사합니다. 출판부 여러분. 정말로…… 덕분에…… 살았어요……!"
10050030-71 = "그래도 뭐, 기본적으로 잘 만든 책이었어요. 그러니까 팔린 거고요."
10050030-72 = "애초에 포텐셜이 없는 걸 팔 수 있는 재주는, 저한테 없고 말이죠?"
10050030-73 = "……니가 웬일로 칭찬을 다 하냐. 야쿠모."
10050030-74 = "어라, 이상한가요? 그것도 저 정도나 되니까 하는 거지, 타카네가 할 리 없지 않겠어요?"
10050030-75 = "듣고 보니 그럴 것 같네."
10050030-77 = "……부장님? 메루리 씨? 지금 두 분이서 사이좋게 무슨 대화를 하고 계신 건가요?"
10050030-78 = "히익?! 아, 아무것도 아니었어!"
10050030-79 = "그, 그래요! 사업을 하다 보면 오갈 수 있는…… 그렇네요! 비즈니스 토크였다고 할까요!"
10050030-80 = "흐음……."
10050030-81 = "아, 아무튼! 이대로라면 며칠 내로 다 팔고 빠질 수 있을 것 같으니까 말이죠?!"
10050030-82 = "그러니까 기대해도 좋을 겁니다! 우리만 믿으라고요!"
10050030-83 = "으, 응! 안 그래도 믿고 있었지만, 오늘 결과를 보니까 더 믿고 싶어졌어!"
10050030-84 = "그것참, 부장님은 그렇다 쳐도 메루리 씨가 언제부터 저를 그렇게 믿었다는 건지, 어떤 의미로는 기이하기만 하네요."
10050030-85 = "아무튼 끊을게! 고마워!"
10050030-86 = "그, 그래요! 밥 잘 챙겨 먹고요!"
10050030-91 = "자, 자아! 그러면 우리도 자 볼까요? 피로를 풀어야 내일도 사업을 할 수 있을 테니까요!"
10050030-92 = "네, 네. 부장님. 그러면 우리도 푹 쉬도록 하죠."
10050030-93 = "그건 그렇고, 타카네도 의외로 이런 강행군에 잘 따라와 주는군요? 다시 봤어요."
10050030-94 = "그건 당연한 것 아닌가요? 이 정도 일정은, 붉은겨울에 비하면 그저 평범한 정도고……."
10050030-95 = "그래요. 그랬었죠. 하지만 타카네는 어딘가 귀한 분위기가 조금 풍겨서 말이죠."
10050030-96 = "오늘만 해도, 붉은겨울에 타카네 같은 귀족 영애 같은 학생이 있을 줄은 몰랐다거나……."
10050030-97 = "무, 무슨 말씀을 하시는 건가요, 부장님! 애초에 우리 붉은겨울에 영애니 뭐니 하는 게 있을 리 없잖아요?!"
10050030-98 = "물론 사실은 그렇지만, 마케팅에 꼭 100%의 사실만을 적용해야 하는 법은 없지 않겠어요?"
10050030-99 = "……냉정하게 이야기하자면, 현실적으로 송출되는 광고의 대부분은 '거짓말은 하지 않았다' 수준인 것이 많기도 하고요."
10050030-100 = "……무슨 말씀을 하고 싶으신 건가요, 부장님?"
10050030-101 = "이런 겁니다. 들어 보세요. 이것도 다 홍보 전략이라니까요? 그러니까……."
10050030-106 = "정의실현부 부실"
10050030-107 = "안녕하십니까, 선생님! 시미코 씨! 그러면 오늘도 정의를 실현하기 위해 함께 나아가죠!"
10050030-108 = "[s] \"아, 안녕. 마시로. 힘차고 좋은 아침이네…….\""
10050030-109 = "엄청나게 기합이 들어가 있네요. 마시로 씨……."
10050030-110 = "아. 놀라셨다면 죄송합니다. 도서부와의 협업이라는 것과, 무엇보다 선생님도 계신다는 사실에 조금 들떠서요."
10050030-111 = "무엇보다 공인되지 않은 서적이라니, 이것만큼 정의와 부합하지 않는 물건도 또 없을 겁니다."
10050030-112 = "어떻게 봐도 수상하고, 어떻게 생각해도 떳떳하지 못하며, 아무리 해도 불미스러운 부분이 있을 수밖에 없는……."
10050030-113 = "그야말로 뿌리부터 잘라내어 없애 버려야 할 대상이겠죠!"
10050030-114 = "[s] (마시로의 열정이 조금 어긋난 방향으로 불타는 느낌이…….)"
10050030-115 = "그런데, 그 책은 읽어 보셨나요. 마시로 씨?"
10050030-116 = "읽어볼 필요도 없습니다. 정의에 어긋나는 일임이 틀림없으니까요."
10050030-117 = "그, 그런가요……?"
10050030-118 = "그리고 우리에게 주어진 시간이란, 기본적으로 한정적인 자원이기에……."
10050030-119 = "이미, 정의실현부 부원들을 트리니티의 각지에 파견해 둔 상태입니다!"
10050030-120 = "머지않아 그 비인가 도서가 거래되는 장소 역시 특정할 수 있겠지요!"
10050030-121 = "[s] \"어? 벌써?!\""
10050030-122 = "네, 네! 선생님. 최선을…… 다할게요!"
10050030-123 = "절대로 실망시켜 드리지 않겠습니다!"
10050030-124 = "감사합니다. 여러분. 각자 맡은 위치에서 대기해 주세요."
10050030-125 = "알겠습니다!"
10050030-130 = "그러면, 저도 먼저 현장으로 가겠습니다. 언제든 연락 부탁드립니다!"
10050030-135 = "열의가 엄청나네요……."
10050030-136 = "[s] \"그러게……. 살짝 걱정될 정도로…….\""
10050030-137 = "마시로 씨가 걱정되시나요, 선생님?"
10050030-138 = "[s1] \"마시로도 마시로지만…….\"\n[s2] \"아직은 누구인지도 모를, 그 책을 거래하는 아이들도 말이지.\""
10050030-141 = "아하. 그쪽 말씀이시군요. 사실 저도 비슷한 생각을 하고 있었어요."
10050030-142 = "의외라고요? 하지만 우이 부장님도 기본적으로는 같은 말씀을 하실지도 모르는 일인데요? 책을 사랑하는 사람이 나쁜 사람일 리 없으니까요."
10050030-143 = "네? 책을 그냥 돈벌이 대상으로만 생각하는 사람일 수도 있지 않느냐고요?"
10050030-144 = "……."
10050030-145 = "그럴 수도 있겠지만, 저는 그렇게 생각하지 않아요."
10050030-146 = "왜냐하면 책이라는 것은 이미…… 사랑하지 않으면, 팔거나 살 수 없는 것이 되어 가고 있으니까요."
10050030-147 = "애초에, 돈만을 노리는 사람이 왜 책을 사고팔겠어요? 더 큰 돈을 벌 수 있는 방법은, 그 밖에도 얼마든지 있는데요."
10050030-148 = "[s] \"그건…… 확실히 그런 것 같네.\""
10050030-149 = "그렇죠? 그러니까 이 소동을 벌이고 있는 분들도 아마, 좋은 분들일 거예요."
10050030-150 = "……적어도 서로 이야기 정도는 나눠 볼 수 있는, 나쁘지 않은 분들이거나요."
