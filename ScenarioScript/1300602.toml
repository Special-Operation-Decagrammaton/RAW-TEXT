[translation]
1300602-1 = "소악마는 노는 걸 좋아해"
1300602-2 = "그래서~!"
1300602-3 = "짜잔, 사랑스러운 무츠키 쨩이 놀러왔~어. 선생님!"
1300602-4 = "[s] \"그대로 놀러온 거구나…….\""
1300602-5 = "열심히 노력하는 선생님을 곁에 딱 붙어서 도와주려고 왔지."
1300602-6 = "자자, 그러니까~"
1300602-8 = "같이 놀자. 선생님!"
1300602-9 = "[s] \"무츠키, 일단 당장 업무가 바빠서 놀아줄 수는…….\""
1300602-10 = "괜찮아. 기다릴 수 있어."
1300602-12 = "선생님 업무가 끝날 때까지 옆에서 얌전히 있을게."
1300602-13 = "그러니까~ 응?"
1300602-14 = "[s] \"뭐, 무츠키가 그렇게까지 말한다면야…….\""
1300602-15 = "고마워, 선생님!"
1300602-17 = "(그렇게 무츠키가 지켜보는 가운데 남은 업무를 처리하기 시작했다.)"
1300602-19 = "지-이."
1300602-20 = "[s] \"…….\""
1300602-22 = "지—이."
1300602-23 = "[s] \"저기, 무츠키……?\""
1300602-24 = "어? 선생님. 업무 다 끝났어?"
1300602-25 = "[s] \"일이 끝나려면 조금 더 시간이 필요하니까…….\""
1300602-26 = "에잇, 여기서 더 기다리는 건 지루해."
1300602-27 = "그러지 말고 같이 놀자. 선생님."
1300602-28 = "모처럼 오늘 같은 날, 선생님하고 놀려고 장난감도 준비해왔는데~"
1300602-29 = "[s] \"장난감?\""
1300602-31 = "이거, 오늘은 이 팔찌로 선생님하고 즐거운 시간을 보내려고 했다구."
1300602-32 = "[s] \"으음, 하지만 아직 남은 업무가….\""
1300602-33 = "일을 할 땐 하더라도 쉬는 것도 중요하잖아?"
1300602-34 = "선생님은 보이지 않을 땐 맨날 일만 하고 있으니까……."
1300602-35 = "나는 모처럼 같이 놀면서 선생님도 좀 쉬었으면 해서……."
1300602-36 = "놀면……."
1300602-40 = "……안 돼?"
1300602-42 = "[s] \"암, 쉬는 것도 업무를 하는 것만큼이나 중요하고 말고!\""
1300602-43 = "앗싸~ 그럼 자자, 놀자. 선생님!"
1300602-45 = "[ns] \"그래서 이 팔찌는 용도가 뭐야?\""
1300602-46 = "후후후, 이건 심박수 탐지기야."
1300602-47 = "각자 이걸 손목에 찬 채로 심박수가 일정 수준 이상으로 올라가면 찌릿 하고 전기가 통하게 돼."
1300602-48 = "[s] \"그걸로 어떻게 노는데?\""
1300602-49 = "쿠흐흐, 좋은 질문이야. 선생님."
1300602-50 = "자, 게임의 룰은 간단해. 지금부터 서로 번갈아 가면서 상대를 당황시키는 거야."
1300602-51 = "당황해서 심박수가 올라간 끝에, 먼저 감전 당하는 쪽이 지는 거지."
1300602-52 = "그리고 패자는 당연히 승자가 원하는 걸 한 가지 들어줘야 해."
1300602-53 = "[s] \"또 사전에 합의되지 않은 게…….\""
1300602-54 = "에이, 그런 쩨쩨한 소리는 하지 말구."
1300602-57 = "자, 선생님!"
1300602-60 = "지금부터 게임, 시~작!"
1300602-62 = "그럼 선생은 이 게임을 처음 해보니까. 첫 공격은 양보해줄게. 초심자를 위한 배려야."
1300602-63 = "(어디 그럼, 무츠키를 당황스럽게 만들기 위해서…….)"
1300602-64 = "[ns1] (무츠키를 간지럽힌다.)\n[ns2] (무츠키 앞에서 얼굴 개그를 한다.)"
1300602-65 = "아하하하!! 선생님~! 간지러워~!!"
1300602-66 = "(그렇게 무츠키를 간지럽혔지만, 무츠키의 팔찌가 작동할 낌새는 없었다.)"
1300602-67 = "아하하하! 하핫, 후하. 후우……. 이걸로 끝이야?"
1300602-68 = "그럼 유감! 선생님의 공격은 실패인 거네."
1300602-69 = "……우와아……. 선생님……. 그렇게까지 필사적이라니……."
1300602-70 = "……."
1300602-71 = "푸, 푸푸풉. 아하하하하!!!! 엄청 웃겨~!"
1300602-72 = "아하, 아하핫! 푸훕! 아하하! 무진장 웃었네~!"
1300602-73 = "응! 유감이야~ 통하지 않았네요~ 자, 선생님의 공격은 실패야."
1300602-74 = "땡~ 선생님의 턴은 이걸로 종료!"
1300602-75 = "이번엔 내 차례야. 자아, 각오하라구."
1300602-78 = "[s3] \"저, 무츠키 양…….?\"\n[s4] \"갑자기 매달리셔서 무얼 하시려는지?\""
1300602-79 = "선생님의 귓가에……."
1300602-80 = "선생님의 귓가에……."
1300602-81 = "후우~ 귓바람 공격이야~!"
1300602-82 = "[s] \"우, 우와아아앗?!\""
1300602-85 = "[ns] \"앗, 따거!\""
1300602-87 = "[ns] \"까, 깜짝 놀랐다.\""
1300602-88 = "아하하!! 완전 당황한 거 봐! 이걸로 이번 게임은 내가 이겼네?"
1300602-89 = "그럼 승자로서~ 선생님한테 뭘 부탁해볼까~?"
1300602-90 = "쿠흐흣~"
1300602-93 = "(무츠키에게 졌다. 그렇게 생각하고 한숨을 내쉬고 있을 때. 눈에 들어온 게 있었다.)"
1300602-94 = "[s5] \"응? 무츠키, 잠깐, 그 팔찌…….\"\n[s6] \"전원…… 꺼져 있는 거 아니야?\""
1300602-98 = "……."
1300602-99 = "[s] \"설마, 무츠키 너……. 속였구나!\""
1300602-100 = "아핫, 들켜버렸네♪"
1300602-101 = "그럼 속임수가 들켰으니, 나는 이만~!"
1300602-103 = "[s] \"자, 잠깐 무츠키……!\""
1300602-106 = "(그렇게 무츠키는 제지할 틈도 없이 바람처럼 사라져 버렸다.)"
