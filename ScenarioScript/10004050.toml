[translation]
10004050-1 = "제5화;들통난 정체"
10004050-2 = "(도원향에서의 소동을 피해 근처의 공원으로 빠져나왔다.)"
10004050-6 = "우으으, 선생님과 느긋하게 차를 마시면서 이야기를 나누고 싶었는데……. 계속 방해만 받고, 속상해요."
10004050-7 = "그래도 괜찮아요."
10004050-8 = "산해경은 넓으니까요! 아직도 갈 곳이 잔뜩 남아있어요."
10004050-9 = "그럼 지금부터는 뭐하고 놀까요?"
10004050-10 = "[s] \"잠깐 기다려, 슈에링.\""
10004050-11 = "네? 무슨 문제라도 있으신가요?"
10004050-12 = "아니면 선생님께서 가보고 싶은 특별한 장소라도 따로 있으신가요?"
10004050-13 = "아무에게도 방해받지 않는 두 사람 만의 장소라든가……♥"
10004050-14 = "[s] \"슈에링은 정말로 매화원의 원생인거야?\""
10004050-15 = "네, 네, 네에엣~?"
10004050-16 = "(어, 어쩌죠. 호, 혹시 정체를 들킨 걸까요?)"
10004050-17 = "어, 어, 어째서 그렇게 생각하신 건가요?"
10004050-18 = "[s] \"매화원의 원생치고는 산해경에 대해 너무 잘 아는 걸.\""
10004050-19 = "그, 그건 아까도 말했듯이 슌 언니와 함께 지내다 보니 우연히 알게 된 정보들이에요! 우연히!"
10004050-20 = "[s] \"게다가 슌을 찾는 일에는 관심도 없어 보이고…….\""
10004050-21 = "그, 그건 눈 앞에 재미있어 보이는 것들이 잔뜩 있어서 한 눈이 팔린 것 뿐이에요."
10004050-22 = "워, 원래 어린 아이들은 다 그런 법이잖아요? 헤헷."
10004050-23 = "[s] \"어린 아이는 그런 식으로 말하지 않아…….\""
10004050-24 = "우으…… 그게 그러니까……."
10004050-29 = "슌~ 오래 기다린 것이다~!"
10004050-30 = "사, 사야 양?!"
10004050-31 = "회춘의 비약에 들어갔던 재료들을 분석해서 약의 부작용을 없애주는 해독제를 만들어 온 것이다!"
10004050-36 = "이런 짧은 시간 내에 해독제를 만들어내다니…… 역시 나님은 천재라니까!"
10004050-37 = "[s1] \"……회춘의 비약?\"\n[s2] \"……슌?\""
10004050-40 = "(하필이면 이 타이밍에 나타나다니, 운도 없지…….)"
10004050-41 = "……슌 언니요? 슌 언니는 여기에 없는데요?"
10004050-42 = "응? 그게 무슨 소리인 것이냐. 네가 슌이잖아. 아까 나님이 만든 회춘의 비약 때문에 그 꼴이 되었으면서."
10004050-43 = "……혹시 비약의 부작용 중에 기억을 잃는 부작용도 있었던 건가?!"
10004050-44 = "사…… 사……"
10004050-46 = "사람 잘못 보셨어요!"
10004050-51 = "우, 우앗? 사람을 갑자기 밀치고 지나가면 위험하잖아!"
10004050-52 = "해독제를 가져온 것 뿐인데, 왜 저렇게 당황하는 거지?"
10004050-53 = "[s] \"슈에링이 슌이라니, 그게 무슨 소리야?\""
10004050-54 = "아아, 그러고보니 선생은 이 일에 대해 모르고 있었나."
10004050-55 = "으음, 어디서부터 설명해야 하려나……."
10004050-58 = "(사야로부터 슌이 마셨던 비약에 대한 설명을 들었다.)"
10004050-60 = "[ns] \"슌이 회춘의 비약을 마시고 어려졌다고?!\""
10004050-61 = "그래. 아무리 부작용이라 하지만 정말로 신체의 나이를 되돌리는 약을 개발하다니……"
10004050-62 = "나님도 가끔은 나님의 재능이 무서운 것이다."
10004050-63 = "그나저나 이상하군. 그렇게 배려심 많던 슌 교관이 저런 천방지축의 어린애가 될 줄이야."
10004050-64 = "……어쩌면 회춘의 비약의 또 다른 부작용이 나타나고 있는 걸지도!"
10004050-65 = "[s] \"또 다른 부작용?\""
10004050-66 = "응. 사람의 인격은 뇌나 호르몬 같은 육체 기관의 영향을 받기도 하니까."
10004050-67 = "몸이 어려진 만큼 인격도 그 영향을 받아 어려지고 있는 걸지도 모르지."
10004050-68 = "최악의 경우, 몸은 되돌아오더라도 어려진 인격은 다시 돌아오지 않을지도……."
10004050-69 = "[s] \"그거 큰일이잖아!\""
10004050-70 = "물론 그러니까 그 전에 해독약을 먹여야 하는 것이지."
10004050-71 = "분명 회춘의 비약은 흥미로운 연구 소재지만, 나님도 모처럼의 외출 시간을 낭비하고 싶지는 않다고."
10004050-72 = "……자, 그럼 추가 실험 개시다!"
