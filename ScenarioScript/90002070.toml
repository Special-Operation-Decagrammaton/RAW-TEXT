[translation]
90002070-1 = "제7화;케이"
90002070-2 = "케이? 케이?! 괜찮습니까, 케이!?!? 부탁입니다! 아리스를…… 아리스를 혼자 내버려두지 말아 주세요!"
90002070-3 = "케이!!!!!"
90002070-8 = "아리스."
90002070-12 = "네, 네! 뭐, 뭔가요. 케이의 말이라면 뭐든지 들을 테니까……!"
90002070-13 = "미안해요. 조금 머리가 울리니까, 목소리 살짝만."
90002070-14 = "네……?"
90002070-15 = "으어어…… 죽겠다……."
90002070-16 = "괜찮은, 건가요. 케이……?"
90002070-17 = "괜찮아요, 괜찮아. 아리스. 끄떡없어요. 그냥 몸 여기저기가 완전 삐그덕거리고 있을 뿐이니까요."
90002070-20 = "내가 볼게. 아리스. 잠시만."
90002070-21 = "네, 네에! 리오 선배……!"
90002070-24 = "우선은 괜찮아, 아리스. 케이의 의식…… 생명에 지장은 없어."
90002070-25 = "정말입니까? 감사합니다, 리오 선배!"
90002070-26 = "그 대신이라고 해야 할지, 지금 케이의 몸은 거의 한계에 다다른 상태이기는 해요."
90002070-27 = "저, 정말입니까? 어떻게 해야 하나요, 히마리 선배……?"
90002070-28 = "어려울 건 없어. 그냥 전반적으로 오버홀을 하면 되는 문제니까."
90002070-29 = "결국 문제가 생긴 것은, 기능과 작동성 쪽의 물리적인 부분일 뿐이거든."
90002070-30 = "그, 그렇대. 잘됐네……. 케이 쨩……."
90002070-31 = "잠깐만요. 결론적으로는 이 몸을 정비해서 다시 쓰자는 건가요?"
90002070-32 = "그런데? 물론 부품 단위까지 분해해서 점검 후 재조립하는 것이니까, 시간은 조금 걸리겠지만……. 문제라도 있어?"
90002070-36 = "……."
90002070-37 = "그냥 건의 사항 같은 건데요."
90002070-38 = "……이 기회에, 좀 다른 몸으로 바꾸면 안 돼요?"
90002070-39 = "다른 몸이요? 그렇지만 딱히 마땅한 소체가 없어 보이는데요?"
90002070-40 = "마땅한 소체 같은 건 거기 있었잖아요, 거기!"
90002070-41 = "거기……?"
90002070-43 = "그 소체라는 게, 여기 있는 이걸 말한 거였어?"
90002070-44 = "하지만 이건 아마도 데카그라마톤 쪽에서 만든 것일 텐데……?"
90002070-45 = "우리 이거 거의 분석 다 했거든요? 아무 문제 없다고 확인까지 했거든요?"
90002070-46 = "진정해, 케이. 그건 가동성 측면에서 그럴 거라는 뜻이었잖아."
90002070-47 = "그래요. 무언가 의식 회로를 이식하면 곧장 움직일 수 있을 거라고 이야기하기는 했지만……."
90002070-48 = "그러니까! 저를! 쓰라고요!"
90002070-49 = "찬성할 수 없어. 어떤 변수가 생겨날지 예측조차 되지 않아. 아주 간단히 이야기해서…… 너무 위험해."
90002070-50 = "무엇보다 소체 내부의 보안을, 우리가 돌파할 수 있을지 어떤 확신도 가질 수 없고."
90002070-51 = "그거, 제가 해 볼게요. 시간과 예산이 주어진다면, 분명 할 수 있을 거라고 말했잖아요?"
90002070-52 = "[s] \"지금 우리에겐 시간도 예산도 둘 다 없는 거 아닐까?!\""
90002070-53 = "으, 으음……. 완전히 가능성이 없는 시도는 아니겠지만, 역시 리스크를 고려하면……."
90002070-57 = "왜 다들 안 된다고만 하고!"
90002070-58 = "직접 해보지는 않는 겁니까!"
90002070-59 = "오. 뭔가 기세가 부활했네, 케이."
90002070-60 = "자, 보세요? 저거, 여기 강철대륙의 소재로 만든 것일 거 아니에요? 그렇죠?"
90002070-61 = "그러니까 잘만 하면요? 네? 제가 막 거기에 접속해서 말이죠? 뭔가 실마리를 찾을 수도 있는 거잖아요?"
90002070-62 = "그렇지만 실패한다면……."
90002070-64 = "왜 자꾸 그렇게 부정적인 소리만 하는 거예요! 그러다 될 일도 안 되는 수가 있다고요!"
90002070-65 = "일단 해 보고! 네? 그러고도 안 되면 말이죠! 네? 그때 다시 생각해 보면 되는 거 아니냐구요!"
90002070-66 = "오늘따라 꼭 어딘가의 고리타분한 상사 같은 말을 하네요, 케이……."
90002070-67 = "제발요. 의식 시스템 이동시키는 거, 이미 한번 해 본 거잖아요. 저 원래 열쇠고리에 있었어요! 다들 알다시피요!"
90002070-73 = "네! 아리스, 아직 기념품으로 가지고 있습니다!"
90002070-74 = "아, 네. 고마워요. 아리스. 아무튼 제가 하고 싶은 말은."
90002070-75 = "한번 된 게 또 안될 리 없지 않냐는 겁니다!"
90002070-76 = "누누이 말씀드리는 것이지만, 진짜로 안 되면 그때 다른 방법을 찾으면 되는 거고요!"
90002070-77 = "……그렇게나 지금 몸이 싫어……?"
90002070-78 = "제발요! 이렇게 부탁할게요. 네? 안 옮겨주면––"
90002070-79 = "––저 여기에 드러누워서 될 때까지 떼쓸 거니까요~~~!!!"
90002070-88 = "케이?!"
90002070-89 = "으어…… 상태 안 좋은 몸으로 너무 흥분했나 봐요……."
90002070-91 = "[ns] \"……케이가 원하는 대로 해 보지 않을래?\""
90002070-92 = "하, 하지만 선생……."
90002070-93 = "그게 완전히 불가능한 거냐고? 그런 건…… 아닐 거야. 그렇지만……. 역시 위험성을 수반해."
90002070-94 = "나는 가능하다면, 여기에서 이 이상의 변수를 만들고 싶지 않다는 쪽이기는 한데……."
90002070-95 = "[s] \"케이의 말대로, 성공한다면 얻는 것도 있겠지?\""
90002070-96 = "모든 게 잘 풀린다면, 그렇겠죠. 어쨌든 저것은 데카그라마톤의 그 아이들이 만든 소체일 가능성이 크고."
90002070-97 = "어떤 영역이 특정한 보안 시스템으로 지켜지고 있다는 것도 확인했으니, 그걸 해석할 수 있다면 분명 작전상 큰 도움이 되겠죠."
90002070-98 = "그 보안 시스템과 케이가 어느 정도 연관이 있는 것도 확실한 데다, 실패를 대비해서 추가 보조 기억 장치를 연결해 두는 방법도 있기는 하니까."
90002070-99 = "케이의 의식 보존 자체에는, 큰 위험이 없다고도 볼 수 있겠습니다만……."
90002070-100 = "그래. 실패했을 경우, 상당한 시간이 지체될 거야."
90002070-101 = "기존 케이의 신체를 오버홀하는 데 걸리는 시간에다, 새 소체에 케이의 의식을 이식하는 데 걸리는 시간과."
90002070-102 = "그걸 해석하는 시간까지 더해지는 셈이니까."
90002070-103 = "[s] \"…….\""
90002070-107 = "[ns] \"그러면, 일단 해 보자!\""
90002070-108 = "지, 진심이야. 선생?!"
90002070-109 = "성공하면 큰 리턴이 있다는 것은 확실하니까? 그리고 실패하더라도 케이를 잃지는 않을 거고? 그건 그렇지만……."
90002070-110 = "시간이라든가, 정비라든가, 여러 문제가 발생할 것은 확실해 보이는데……."
90002070-111 = "응? 사람 소원 한번 들어주는 셈 치자고?"
90002070-112 = "……."
90002070-116 = "알았어……. 선생. 해 보기는 할게."
90002070-117 = "하아……. 선생님께서 그렇게 말씀하신다면, 어쩔 수 없네요. 귀여운 후배의 부탁이기도 하고요."
90002070-118 = "잘 됐습니다, 케이! 모두 도와주신다고 합니다!"
90002070-119 = "후후, 후후후…… 역시 진심과…… 혼이 담긴 설득은…… 모두를 움직이게 하는 법이죠……."
90002070-120 = "그렇구나! 케이한테 하나 배운 것 같아. 나도 다음에 저렇게 유우카를 설득해 봐야지!"
90002070-121 = "……우린 아마 안 되지 않을까, 언니……."
90002070-123 = "–셋에 동시에 입력하는 거야, 히마리! 하나, 둘–"
90002070-124 = "–셋!"
90002070-131 = "케이?"
90002070-132 = "나도! 나도 볼래! 우와……."
90002070-136 = "일단 이 소체가 성공적으로 가동했다는 것은 확인했어요. 그리고……."
90002070-137 = "우리를 알아볼 수 있겠어?"
90002070-140 = "[ns] \"……케이?\""
90002070-143 = "선생님? 그리고……."
90002070-144 = "아리스?"
90002070-146 = "케이–!!!"
90002070-152 = "역시 케이입니다! 아리스는 믿고 있었습니다!"
90002070-153 = "……말했잖아요. 아무 일 없을 거라고. 다들 너무 호들갑이라니까요……."
90002070-154 = "[s] \"왜, 호들갑 떨 만했지.\""
90002070-155 = "그러게. 침착했으면 다른 의미로 섭섭했을지도 몰라?"
90002070-156 = "어쩔 수 없군요. 이 상황에서는 저라도 침착함을 유지하도록 하겠습니다. 케이."
90002070-157 = "아뇨, 괜찮으니까요……."
90002070-159 = "어…… 음…… 그러면 다시 한번, 모두 안녕하세요. 케이입니다."
90002070-160 = "케이입니다!"
90002070-161 = "오, 이제야 정말로 뭔가 미소녀형 안드로이드라는 느낌이야!"
90002070-162 = "그러게. 디자인적으로도 훨씬 느낌이 오네."
90002070-163 = "자, 잘됐네……. 케이 쨩."
90002070-164 = "(……기존 디자인도, 그렇게까지 나쁘지는 않았던 것 같은데…….)"
90002070-169 = "……이제 걸을 수 있는 거네요, 저. 스피커가 아니라 목으로 말을 할 수도 있고."
90002070-170 = "머리카락에, 손도 있고, 손가락도 있고……. 어떤 의미로는 예전에도 있긴 했는데, 어쨌든."
90002070-174 = "……훌쩍."
90002070-175 = "축하해요. 케이. 그러면 다음 과정으로 넘어가도록 하죠. 그 몸에서 무언가 알아낸 것은 없었나요?"
90002070-176 = "물론 아무 성과가 없었어도, 저로서는 케이가 만족하고 있는 것 같아 충분히 기쁘지만요."
90002070-180 = "음…… 네. 그 정도 떼를 쓰고도 아무 성과가 없었다면, 오히려 제가 민망해지겠죠."
90002070-181 = "빠르게 결론부터 말씀드리도록 하죠. 달리 말하면…… 그 정도로 말씀드릴 것이 많다는 의미이기도 합니다."
90002070-182 = "그러니 일단은, 수송선으로 돌아가도록 하죠."
90002070-184 = "다음화;Level Up"
