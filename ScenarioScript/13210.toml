[translation]
13210-1 = "제21화;두 번째 추격"
13210-2 = "다들 괜찮은 거야?"
13210-3 = "고, 고맙네……. 덕분에 살았습니다……."
13210-5 = "이, 이제 더는 무리야…… 나는 돌아갈 거야."
13210-6 = "나도…… 아비도스에 손을 대다니…… 내가 미쳤지……."
13210-8 = "손해가 막심해……."
13210-9 = "그래…… 애초에 이런 일에 발을 담그는 게 아니었어……."
13210-11 = "네. 잘 생각하셨어요. 프레지던트는 카이저 그룹의 모든 병력을 이곳으로 호출했습니다. 오늘 저녁 내로 제1진이 자치구 안으로 진입할 거예요."
13210-12 = "아비도스 자치구는 이제 곧 전쟁터가 될 거예요. 그 전에 빨리 도망치세요."
13210-13 = "아, 알겠어……."
13210-16 = "영애님……."
13210-17 = "집사님. 괜찮으세요……?"
13210-18 = "……. 제, 제가 무슨 짓을……."
13210-19 = "응. 엄청난 짓을 저질러 버렸어요. 이제 아비도스는 전쟁터가 될 거예요."
13210-20 = "……. 제가 원했던 것은……. 이런 게……."
13210-21 = "……알아요. 집사님."
13210-22 = "……안다고요?"
13210-23 = "네. 집사님이 원했던 건…… 대책위원회와 마찬가지였죠? 네프티스와 아비도스의 부흥……. 과거의 그 번영을 되찾는 것……."
13210-24 = "……."
13210-25 = "하지만 결국 이런 결과로 도달해 버렸어요. 보세요. 저쪽의 <사모펀드>를."
13210-26 = "……. 알고 있습니다. 하지만……."
13210-27 = "열차포의 존재를 알게 된 순간, 거기서 벗어날 수 없었습니다……."
13210-28 = "그때부터 다른 생각은 할 수 없게 되었습니다…… 그것만 있다면. 그것만……."
13210-29 = "사실 아직도 마찬가지입니다. 그것만 있으면 네프티스는…… 아비도스로 돌아갈 수 있을 텐데……."
13210-30 = "응, 그치만 그건 절대 무리겠죠~♧"
13210-31 = "……."
13210-32 = "그럼, 건강하세요, 집사님."
13210-33 = "어, 어디로 가시려는 겁니까? 영애님?"
13210-34 = "호시노 선배를 막으러 갈 거예요."
13210-35 = "선배가 열차포를 파괴하고 자퇴해 버리려는 걸 막을 거예요."
13210-36 = "하, 하지만 어떻게……?"
13210-37 = "……응. 어떻게든 해야죠."
13210-41 = "……."
13210-43 = "……. 호시노 선배를 또 막지 못했어. 내 힘이 부족해서……."
13210-44 = "또 그 얘기야? 그건 시로코 선배 탓이 아니라니깐. 호시노 선배가 너무 강한 거지."
13210-45 = "……. 기운 내요, 시로코 쨩."
13210-46 = "응……."
13210-47 = "네…… 호시노 선배는 아마 처음부터 이럴 생각이었던 거 같아요."
13210-48 = "노노미 선배를 구하고, 공증으로 자신을 대책위원회와 분리시키고 열차포를 파괴한다……."
13210-49 = "그러면 열차포의 피해 보상이 아비도스 학교에 전가되지 않을 테니까……."
13210-50 = "그러게. 생각해 보면 뭔가 이상했던 거 같아. 호시노 선배의 모습."
13210-51 = "뭐랄까, 잘 설명은 못 하겠지만 무언가 다급하게 쫓기는 것 같달까……."
13210-52 = "응…… 다 함께 힘을 합쳐서 고민해야 할 문제인데 그걸 일부러 거부하고 있는 것 같달까……."
13210-54 = "……생각해 보면 그때랑 비슷한 느낌이야."
13210-59 = "호시노 선배는…… 열차포를 파괴하는 걸 유메 선배의 유지로 여기고 있는 것 같아요."
13210-60 = "뭐? 그치만 그 회장님이 그렇게 말한 적은 없는 거 아냐?"
13210-61 = "응. 하지만 호시노 선배는 유메 회장이라면 분명 이렇게 말했을 거다, 라는 생각에 사로잡혀 있는 것 같아."
13210-62 = "어째서……?"
13210-64 = "모르겠어요. 호시노 선배를 그렇게 몰아세우는 게 무엇인지……."
13210-65 = "하지만 그건 아마도……."
13210-74 = "호시노 쨩! 보물찾기야!! 호시노 쨩!"
13210-75 = "호시노 쨔…… 앙……?"
13210-81 = "네. 또 무슨 일인가요?"
13210-82 = "호시노 쨩……? 뭐, 뭐야 그 모습은?"
13210-83 = "네? 아, 이, 이건……."
13210-84 = "어…… 설마 물고기를 너무 좋아해서 이제 진짜 물고기가 되려고……?"
13210-88 = "무슨 소리예요! 그럴 리가 없잖아요!"
13210-89 = "이건 좀 전까지 상수도 수리 작업을 하다가 옷이 다 젖어버려서…… 말리는 중이라 그런 거라고요!"
13210-90 = "헤에, 운동장의 고장 난 수돗가? 그거 수리한 거야?"
13210-91 = "……한번 시도해 봤지만 고치진 못했어요. 구조가 생각보다 복잡해서……."
13210-92 = "에헤헤, 그렇구나. 호시노 쨩 같은 천재도 못 하는 게 있구나?"
13210-93 = "그것도 기계 쪽은 어려운 거야? 아저씨처럼?"
13210-94 = "그건 됐고, 또 무슨 일이에요, 선배."
13210-95 = "보물찾기라뇨? 이번엔 또 뭔가요?"
13210-97 = "응! 맞아, 이것 좀 봐!"
13210-101 = "호시노 쨩. 굉장한 거야!"
13210-102 = "매번 그렇게 말했지만 전부 꽝이었잖아요…… 이제 안 믿어요."
13210-103 = "아냐, 이번엔 확실한 거야! 아비도스에 떠도는 소문이지만, 실제로 기록도 있는 거라고!"
13210-104 = "그런 기록들도 죄다 헛소문들이었잖아요. 한두 번 속는 게……"
13210-105 = "학생회장들의 계곡……?"
13210-106 = "응! 예전 아비도스의 학생회장들이 자신들의 강력함을 기념하려고 만든 전시관이 있대!"
13210-107 = "거기다가 엄청 값비싼 물건들을 잔뜩 진열해 두었다고 해!"
13210-108 = "그게 진짜라면 진작 그 보물들은 학교가 어려워지기 시작했을 때 팔아치웠겠죠."
13210-109 = "응, 보통은 그랬겠지? 그치만 문제는…… 이 학생회장들의 계곡은, 보물을 노리는 악당들을 막기 위해서 누구도 알지 못하는 곳에 건설했다는 거야."
13210-110 = "그래서 지금도 여기가 어딘지 아무도 모른다고 해!"
13210-112 = "그말은 즉……."
13210-113 = "응! 거기엔 아무도 건들지 않은 값비싼 보물들이 아직 잔뜩 남아 있을지도 몰라!"
13210-114 = "……그래서, 거기를 찾자고요?"
13210-115 = "응! 보물찾기야! 호시노 쨩!"
13210-116 = "말이 안 되잖아요! 아무도 모른다면서요? 그런데 거기를 어떻게 찾아요?"
13210-117 = "후! 후! 후!"
13210-118 = "그러니까, 여기서부터 본론인데, 예전 학생회의 서류들을 뒤지다가 이런 걸 발견했어."
13210-119 = "예전 학생회 녀석들의?"
13210-123 = "……뭔가요, 이 종이는. 전부 까맣게 칠해져 있어서 뭐라고 적혀 있는지 모르겠는데."
13210-124 = "뭔가 숨기려고 했던 거 같은데…… 그치만 이것 봐, 여기."
13210-125 = "……주소인가요? <아비도스 사막 폐쇄지구 섹터 35-9>……?"
13210-126 = "응! 여기가 뭔지는 모르겠지만, 명확한 실마리가 있는 거야! 지금까지의 보물찾기랑은 차원이 다르다구!"
13210-130 = "하아…… 유메 선배. 진짜."
13210-131 = "무, 물론 주소뿐이지만…… 그래도……."
13210-132 = "또 몇 번이나 제가 같은 말을 반복해야 하는 거죠……?"
13210-133 = "어…… 그, 그러니까……."
13210-138 = "이러고 있을 때가 아니잖아요! 지금 당장 거기로 가야죠!! 일분일초가 아깝다구요!"
13210-139 = "응! 보물찾기 출발이야!"
13210-141 = "으헤~ 이번엔 느낌이 좋아요! 진짜 보물이 기다리고 있을 것 같은데요?"
13210-146 = "호, 호시노 쨩? 기다려, 옷, 옷 갈아입고……!"
13210-149 = "아……!?"
13210-160 = "유메 선배. 이쪽은 아무것도 없어요."
13210-161 = "……우웅. 여기도 꽝이야. 실패야. 으흐흑."
13210-165 = "……."
13210-169 = "아비도스 사막 폐쇄지구 섹터 35-9"
13210-171 = "여기는…… 아직 변하지 않았구나."
13210-174 = "……집착, 일까요."
13210-175 = "집착?"
13210-176 = "아니, 호시노 선배나 저뿐만 아니라……. 어쩌면 이곳에 모여든 전부가……."
13210-177 = "사모펀드, 네프티스, 카이저 프레지던트까지도…… 마치 빛에 이끌려 스스로를 불태우기 위해 날아오는 불나방처럼……. 어떤 집착으로……."
13210-178 = "으음……."
13210-179 = "[s] \"집착…… 집착이라.\""
13210-180 = "응. 우리의 결론은 변하지 않았어. 호시노 선배를 막아야 해."
13210-182 = "네, 맞아요. 카이저는 열차포가 파괴되는 순간 엄청난 금액을 배상하라고 압박할 거예요."
13210-183 = "하지만 카이저를 이대로 놔둔다면 열차포는 카이저가 소유하게 될 거고요."
13210-184 = "그러니 방법을 찾아야 해요."
13210-185 = "네. 무엇보다 호시노 선배의 그 무모한 행동을 막아야 해요. 저도 이제는 더 이상 망설이지 않겠어요!"
13210-187 = "하지만 이대로라면 또 지금 같은 결과가 반복될 뿐 아냐? 호시노 선배를 상대하는 게 거의 불가능하잖아."
13210-188 = "으으음……."
13210-189 = "선생님? 혹시 도움을 요청할 만 한 사람이 있어?"
13210-190 = "기왕이면 호시노 선배를 상대할 수 있을 정도로 강한 사람으로……."
13210-191 = "[s] \"으으음…….\""
13210-193 = "아뇨…… 그건 근본적인 해결이 아니에요."
13210-194 = "호시노 선배의 행동이 유메 회장 때문이라면……. 호시노 선배를 물리적으로 제압한다고 해결되는 문제는 아니에요."
13210-195 = "이건 외부자들이 개입할 수 없는 아비도스의 싸움…… 그런 구도가 될 수밖에 없어요……."
13210-197 = "그럼 정리된 거네! 역시 우리가 할 수밖에 없는 거잖아?"
13210-198 = "응. 또다시 결론은 그거야."
13210-199 = "그럼 이러고 있을 게 아니라 당장 호시노 선배를 추격해야지! 학생회장들의 계곡으로 가는 거야!"
13210-200 = "그런데…… 거기가 어딘지 아는 사람?"
13210-205 = "으음……."
13210-206 = "호시노 선배는 가는 법을 알고 있는 것 같았지만……."
13210-208 = "제가 알고 있습니다."
13210-209 = "앗……?"
13210-210 = "집사님?"
13210-216 = "집사님?! 학생회장들의 계곡이 어딘지 알고 있나요?"
13210-217 = "<아비도스 사막 폐쇄 지구 섹터 35-9>…… 프레지던트는 분명 그렇게 말했었죠."
13210-218 = "거긴 여기서 480km 이상 떨어져 있는, 아비도스 사막 중에서도 가장 황량한 바위 계곡 지대입니다."
13210-223 = "그 주소에는 아마 오래전에 폐쇄된 사막횡단철도역이 있을 겁니다."
13210-226 = "……저쪽에 문이 열려 있어?"
13210-237 = "……. 관제 시스템이 켜져 있어……?"
13210-238 = "고장 난 고물들이라고 생각했는데……."
13210-242 = "네프티스 관리자 admin 확인. <이자요이 노노미>……."
13210-243 = "그렇구나. 고장 난 게 아니라 네프티스의 카드로 접속해야만 했던 거구나……."
13210-244 = "그렇구나…… 이런 식으로 숨겨져 있었던 거였어……."
13210-245 = "……. 목적지. 대 오아시스 역…… 아니고. 학생회장들의 계곡…… 이건가 보네……."
13210-246 = "그리고 좀 전에 계곡으로 출발한 기차가 한 대 더 있어. ……이게 그 안대 쨩이겠지."
13210-247 = "어디…… 기차 기동은……."
13210-257 = "……."
13210-259 = "겉으로는 단순한 폐쇄 역으로 보이겠지만…… 사실 거기는 <학생회장들의 계곡>으로 이어진 비밀통로가 숨겨져 있는 정션 스테이션입니다."
13210-260 = "<아비도스 학생회>가 네프티스의 기술로 건설한 곳이겠죠."
13210-261 = "거기서 영애님의 인증을 활성화시키면 <학생회장들의 계곡>으로 가는 숨겨진 루트를 해제할 수 있을 것입니다."
13210-262 = "어…… 그, 그렇다는 건……."
13210-263 = "집사님……."
13210-269 = "[ns] \"도움을 주셔서 감사합니다. 집사님.\""
13210-270 = "……. 아뇨. 아닙니다."
13210-271 = "죄송합니다…… 영애님."
13210-272 = "……. 집사님."
13210-273 = "이러고 있을 때가 아닙니다. 서두르셔야 할 겁니다. 스오우도, 그리고 호시노도 그곳으로 향했을 테니까요."
13210-274 = "네……."
13210-275 = "그런데…… 스오우 씨는 대체 누구인가요?"
13210-276 = "……. 처음엔 하이랜더의 편인 줄 알았는데 알고 보니 네프티스였고, 그러다 <사모펀드>의 편을 드는 듯했다가 사실 카이저PMC였고…… 그런데 또…… 이제는……."
13210-277 = "그녀는 무슨 생각으로 호시노 선배를 그곳으로 불러낸 거죠?"
13210-281 = "아사기리 스오우는 원래 소속 학원 없이 여기저기를 떠돌던 불량배였습니다."
13210-282 = "그러다가 우연히 네프티스의 눈에 띄어서, 영애님의 경호원 역할로 하이랜더에 입학시켰었죠."
13210-283 = "저의 경호원요……?"
13210-284 = "네. 하지만 영애님의 입학이 취소되고선 그 임무도 사라졌고, 저희도 다른 임무를 주지 않은 채 까맣게 존재를 잊고 있었는데……."
13210-285 = "어느 순간 보니 감사실의 고위 감독관의 자리에까지 올라가 있더군요."
