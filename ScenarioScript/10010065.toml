[translation]
10010065-1 = "제6화;트리니티의 달리는 섬광탄 2"
10010065-5 = "콜록, 콜록……! 케헥! 켁켁……!"
10010065-6 = "뭐, 뭐야……. 또 졌잖아……. 이번에는 이긴다며……! 진짜 이길 수 있다며!!"
10010065-7 = "낸들 아냐!? 저런 게 갑자기 튀어나올 줄 누가 알았겠냐고!"
10010065-8 = "대관절 저 녀석은 또 누구야……? 갑자기 튀어나와서는……!"
10010065-10 = "싸, 싸움은 안 돼요! 멈추세요, 여러분……! 부디 평화롭게 대화로……!"
10010065-11 = "이제 와서!?"
10010065-12 = "유탄기관총을 갈기면서 그런 소릴 해도……."
10010065-13 = "그, 그건! 어, 어쨌든 상황을 중지시켜야 했어서……."
10010065-14 = "……덕분에 살았습니다. 누구신지는 모르겠지만 감사합니다."
10010065-15 = "그리고 옆의 분은……."
10010065-16 = "……어라……. 선생님……?"
10010065-17 = "[s1] \"안녕, 스즈미.\"\n[s2] \"다친 데는 없어?\""
10010065-18 = "아, 안녕하세요. 이런 곳에서 다 뵙는군요."
10010065-19 = "네, 뭐……. 덕분에……."
10010065-20 = "그런데 선생님이 어째서 이런 곳에……."
10010065-21 = "……네? 찾으시는 물건이 있다고요?"
10010065-22 = "……보아하니 또 곤경에 처한 누군가를 도와주고 계신 것 같군요."
10010065-23 = "정말이지. 세상 사람들이 모두 선생님 같은 분들이라면, 저도 좀 더 편하게 생활할 수 있을 텐데 말이죠."
10010065-24 = "마침 저도 선생님께 도움받은 참이니, 답례로 함께 찾아 드리고 싶습니다만……. 찾으시는 게 뭔지 여쭤봐도 괜찮을까요?"
10010065-26 = "……네? 물이끼 아교……?"
10010065-27 = "으음……. 처음 듣는 물건이네요."
10010065-28 = "아. 그래도 말씀하신 '오래된 폐건축물'이라면 짐작 가는 바가 있습니다."
10010065-29 = "통상적으로 다니는 길에서는 찾기 어렵지만, 간간이 건물들 사이에 그런 버려진 건물들이 끼어 있으니까요."
10010065-30 = "순찰을 하다 보면 하나둘쯤 눈에 들어오기 마련이죠. 이 근처에도 하나가……."
10010065-35 = "……!!"
10010065-36 = "어이, 잠깐, 잠깐잠깐잠깐……!!"
10010065-37 = "……?"
10010065-38 = "잠깐 기다려. 너 방금 말한 그 건물이라는 거……. 그거 설마!"
10010065-39 = "우리 아지트 이야기하는 거 아냐, 지금!?"
10010065-40 = "……? 네. 맞습니다만……."
10010065-41 = "미쳤어!? 지금 우리 아지트를 철거하겠다는 거냐!? 우릴 쫓아내겠다는 거야!?"
10010065-42 = "아니, 그게 어떻게 그런 이야기가 되는 건지 잘 모르겠는데……."
10010065-43 = "지금 말대로라면 필요한 건 창틀에 굳은 아교를 좀……."
10010065-44 = "와……. 진짜, 야! 너무한 거 아냐!? 아주 우리 씨를 말리려고 들고 있잖아!?"
10010065-45 = "씨를 말리다니, 그런 무서운 말씀을……."
10010065-46 = "우리라고 이러고 싶어서 이러고 사는 줄 알아!? 어!?"
10010065-47 = "어흐허엉? 허엉!? 엉!? 우히가 어? 우히는 뭐가 조하서어헝……!?"
10010065-48 = "……?????"
10010065-49 = "아니. 왜 갑자기 우는 겁니까. 그런 뜻이 아니라니까……."
10010065-50 = "[s3] \"……틀렸어. 일단 기다려 보자.\"\n[s4] \"일단 하는 말을 끝까지 들어봐 주자.\""
10010065-51 = "네. 뭐……. 선생님께서 그렇게 말씀하신다면……."
10010065-52 = "네. 뭐……. 선생님께서 그렇게 말씀하신다면……."
10010065-54 = "훌쩍…… 큽……. 거길 나가면……. 우린 이제 어디서 지내란 말이야!? 용돈은 뭘로 벌고!?"
10010065-55 = "우리라고 뭐 좋아서 삥 뜯기 알바(?) 하는 줄 알아? 어!? 이제는 이거밖에 할 수 있는 게 없다고!"
10010065-56 = "평범한 알바 같은 거, 전과가 있는 시점에서 이미 전부 1차 탈락이니까 말이지."
10010065-57 = "이 성적으론 기숙사도 못 들어가고, 월세를 내려 해도 돈이 없으니 당연히 방도 못 구해."
10010065-58 = "……이제 좀 알겠어? '평범하게 지낸다'는 것도 누군가에겐 특권이라는 걸."
10010065-59 = "뭐, 보통의 녀석들이 그걸 알 수 있을 리도 없겠지만 말이야."
10010065-61 = "……그건……."
10010065-62 = "[s5] \"그럼 그건 내가 어떻게든…….\"\n[s6] \"그 부분은 그럼 내가…….\""
10010065-65 = "……저희 쪽이라도, 만약 여러분만 괜찮으시다면."
10010065-68 = "[ns] \"……히나타?\""
10010065-69 = "……?"
10010065-71 = "……응? 너는……?"
10010065-72 = "저희 성당 쪽 일이라도 괜찮으시다면……. 그럼 그 부분은 저희에게 맡겨주시겠어요?"
10010065-73 = "……성당 쪽? 지금 성당 쪽 일이라고 했어?"
10010065-74 = "시스터후드? 당신……. 시스터였어?"
10010065-75 = "어, 어라? 모르셨나요……? 그야 보시면……이렇게 복장도……."
10010065-76 = "아니, 아니. 아니아니아니. 무리지, 그건. 절대로 무리."
10010065-77 = "그 모습으로 시스터라니 절대로 무ㄹ……읍!"
10010065-82 = "진짜로 시스터님이신가 보네. 전투 도중에 난입하길래 또 모방범일 줄 알았지."
10010065-83 = "트리니티의 시스터~같은 식으로……. 코스프레를 한……. 섬광탄의 짝퉁……."
10010065-84 = "코, 코스프레……. 아하하하……."
10010065-85 = "뭔가 죄송하지만 전 진짜로 시스터후드의 시스터랍니다."
10010065-86 = "사정은 잘 알았습니다. 미안합니다. 자매님들. 여태껏 그런 곤경에 처해 있는지도 모르고……."
10010065-90 = "괜찮으시다면, 미력하게나마 저희가 여러분을 도울 수 있도록 허락해 주시겠어요?"
10010065-92 = "일자리라면 저희도 항상 봉사활동에 동참해 줄 사람들을 모집하고 있으니까요."
10010065-94 = "돈을 버는 기관이 아니라서 따로 일당을 드릴 순 없지만, 하시는 동안 숙식 제공 정도는 해 드릴 수 있고……."
10010065-95 = "한 달만 그곳에서 활동하고 나면, 이후로는 성당에서 발급한 추천서로 다른 아르바이트들도 구하실 수 있을 테니까요."
10010065-97 = "그동안은 조금 고되실 수도 있지만……."
10010065-98 = "부디 저희가 자매님을 도와드릴 수 있도록 허락해 주세요."
10010065-105 = "뭐, 뭐야. 왜 갑자기 우리에게 그런 말을……."
10010065-106 = "그, 그런 짓 한다고 딱히 그쪽에 득이 될 것도 없잖아? 이해하기 어려운 걸……."
10010065-107 = "득 될 게 없다뇨. 전혀 그렇지 않아요. 저희는 시스터후드니까요."
10010065-108 = "……뭐라고?"
10010065-110 = "시스터후드는 트리니티의, 아니 이 키보토스의 모든 분이 평안하고 행복하게 지내시는 것이 목표인 곳."
10010065-111 = "여러분의 문제가 해결되고 그로 인해 전보다 평안을 얻으실 수만 있다면, 그 자체만으로 저희에게는 기쁨이랍니다."
10010065-112 = "어이어이……. 웃기지 말라고. 우리가 그런 말에 속을 것 같……."
10010065-113 = "그런 뻔한 소리에 설마 우리가 넘어갈 거라고……."
10010065-114 = "으허어어흐엉어엉~!!"
10010065-115 = "……!?"
10010065-116 = "……!?"
10010065-117 = "[s7] \"……통했다.\"\n[s8] \"……많이 힘들었나 보네.\""
10010065-118 = "그럼 우리 이제 이런 짓 안 해도 되는 거야? 알바할 수 있는 거야?"
10010065-119 = "그럼 우리 이제 이런 짓 안 해도 되는 거야? 알바할 수 있는 거야?"
10010065-120 = "돈 모아서 영화관 갈 때 정의실현부 눈치 안 봐도 되는 거야? 카페도? 게임장도?"
10010065-121 = "나 할래. 가서 봉사활동이든 뭐든 할 테니까……!"
10010065-122 = "네. 같이 땀 흘려 일하고,"
10010065-126 = "개운하게 목욕하고,"
10010065-128 = "같이 앉아서 밥도 먹어요."
10010065-130 = "어어허헝헝……. 시스터 님……!"
10010065-131 = "옳지, 옳지. 그래요. 마음을 열어줘서 고마워요, 여러분."
10010065-136 = "[ns] \"해결된 거라 봐도 되겠지?\""
10010065-137 = "아아. 뭐……."
10010065-138 = "……맘대로 해. 아지트든 아교든, 이젠 우리랑 상관없는 이야기니까."
10010065-143 = "감사합니다, 시스터님. 덕분에 저도 전보다 좀 더 편해질 수 있을 것 같네요."
10010065-144 = "예? 아, 아아니에요. 감사라뇨, 당치도 않습니다."
10010065-145 = "길을 잘못 든 분들을 인도하는 것도, 어려운 선택을 하시는 분들을 도와 드리는 것도……."
10010065-146 = "……결국 누군가는 해야 하는 일이니까요. 저도 그런 사람들 중 하나일 뿐이고요."
10010065-148 = "……!"
10010065-152 = "……그렇군요."
10010065-154 = "……그것도 참, 모처럼 듣기 좋은 말이네요."
