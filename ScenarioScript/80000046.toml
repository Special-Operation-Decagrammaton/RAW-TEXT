[translation]
80000046-1 = "당신을 위한 문구 하나."
80000046-2 = "음양부 부실"
80000046-3 = "(잠시 샬레 업무의 일환으로 처리해야 할 일이 있어, 음양부 부실을 찾았을 때였다.)"
80000046-4 = "아. 선생님. 안녕~"
80000046-5 = "……어? 근데 선생님. 여긴 어쩐 일이야~?"
80000046-6 = "[s] \"잠깐 볼일이 있어서, 그보다 오늘은 치세 혼자야?\""
80000046-7 = "응. 집 보기 담당. 중요한 임무야~"
80000046-8 = "……선생님도 임무~? 우리, 비슷하네~"
80000046-9 = "[s] \"그러게.\""
80000046-10 = "좋아. 그럼 나도 선생님 옆에서 열심히 해야지."
80000046-11 = "선생님도 힘내~ 응원할게~"
80000046-12 = "[s] \"응? 어, 응. 고마워.\""
80000046-14 = "(그렇게 치세와 함께 잠깐의 업무를 시작했다.)"
80000046-20 = "[ns] \"으음, 여긴 이렇게 하고, 다음 내용은…….\""
80000046-24 = "으음~ 역시 이것도 아니야."
80000046-28 = "역시 이것도 아니고……."
80000046-29 = "[s] \"……치세?\""
80000046-30 = "아. 선생님? 일 끝났어?"
80000046-31 = "아직 끝난 건 아니야? 어른이란 힘든 거구나……."
80000046-32 = "그럼, 자 이거."
80000046-33 = "[s] \"이건……. 초콜릿 조각?\""
80000046-34 = "응. 선생님한테 줄게. 그럼 다시 열심히 찾아야지~"
80000046-35 = "같이 힘내자?"
80000046-36 = "[s] \"어, 으, 응…….\""
80000046-40 = "(그렇게 다시금 일을 계속하고 있을 무렵, 계속해서 치세는…….)"
80000046-44 = "선생님, 자, 여기."
80000046-51 = "선생님, 이거, 이것도."
80000046-58 = "여기."
80000046-64 = "응."
80000046-69 = "(그렇게 몇 개나 되는 초콜릿 조각을 치세에게서 받았을까…….)"
80000046-71 = "으응. 아무리 찾아도 없네~"
80000046-72 = "[s1] \"저기, 치세. 아까부터 뭘 하고 있는 거야?\"\n[s2] \"……여기 잔뜩 쌓인 초콜릿 조각은 또 뭐고.\""
80000046-73 = "아. 이거."
80000046-74 = "아. 이거."
80000046-78 = "이거, <사자성어 센베이 초콜릿>이야. 선생님."
80000046-79 = "안에 사자성어가 쓰인 종이가 들어있대."
80000046-80 = "[s] \"사자성어 초콜릿……?\""
80000046-81 = "응. 발렌타인 데이 기념."
80000046-82 = "여기서 갖고 싶은 게 있어서."
80000046-83 = "이렇게 찾고 있었는데."
80000046-87 = "아- 나왔다."
80000046-88 = "이거야. 찾고 있던 거. <호접지몽>"
80000046-89 = "[s] \"아, 호접지몽이라면 그 뜻이 분명…….\""
80000046-90 = "응. 어느 날, 나비가 되는 꿈을 꿨는데-"
80000046-91 = "아……. 나비가 되는 꿈. 분명 두둥실. 즐거운 꿈일 거야. 그치?"
80000046-92 = "[s] \"으, 응. 그건 그렇네, 확실히…….\""
80000046-93 = "좋아하는 문구도 찾고, 초콜릿도 먹을 수 있다니."
80000046-94 = "발렌타인 데이란 좋은 거네~"
80000046-95 = "자, 선생님에게도 아까 찾은 이거. 줄게."
80000046-99 = "[ns3] \"으, 응 고마워.\"\n[ns4] \"그런데 이 문구는……. <안심저축>?\""
80000046-100 = "응. 저축은 중요하니까. 이것도 중요한 말이네~♪"
80000046-101 = "응. 저축은 중요하니까. 이것도 중요한 말이네~♪"
80000046-102 = "[s5] \"그, 그렇지. 응. 저축은 확실히 중요하지…….\"\n[s6] \"근데, 이게 사자성어였던가……?\""
80000046-105 = "(그 뒤로 남은 초콜릿 조각은 치세와 담소를 나누며 얌전히 나눠 먹었다.)"
