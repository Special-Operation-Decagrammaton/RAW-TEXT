[translation]
11010-1 = "제1화;대책위원회에 어서 오세요!"
11010-2 = "샬레 집무실"
11010-3 = "좋은 아침이에요, 선생님!"
11010-4 = "요 며칠 사이에 샬레에 대한 소문도 많이 퍼져나간 것 같고, 다른 학생들의 도움 요청 편지도 도착한 것도 있어요."
11010-5 = "좋은 신호예요! 저희의 활약이 시작될 거란 얘기니까요!"
11010-6 = "음…… 그런데 그중에…… 이런 편지가 있었어요."
11010-7 = "이건 선생님이 한번 읽어보셔야 할 거 같아서요."
11010-8 = "[s] 편지를 읽는다."
11010-11 = "연방수사동아리의 고문 선생님께."
11010-13 = "안녕하세요. 저는 <아비도스 고등학교>의 오쿠소라 아야네라고 합니다."
11010-15 = "이렇게 편지를 드리는 건 다름이 아니라 염치 불고하고 부탁드릴 일이 있어서입니다."
11010-17 = "단도직입적으로, 저희 학원은 괴롭힘을 당하고 있습니다."
11010-19 = "그것도 지역의 폭력 조직에게요."
11010-21 = "(다음 장을 읽는다.)"
11010-23 = "이렇게 된 사정은 꽤 복잡하지만……"
11010-25 = "폭력 조직은 아무래도 저희 학교 건물을 노리고 있는 것 같아요."
11010-27 = "지금은 저희 학생들이 어떻게든 막아내고 있지만,"
11010-29 = "슬슬 탄약과 보급품이 다 떨어져가고 있습니다……."
11010-31 = "이대로 가다간 폭력 조직에게 학교를 점령당할 상황이에요."
11010-33 = "(마지막 장을 읽는다.)"
11010-35 = "그래서 이렇게 부탁을 드리게 되었습니다."
11010-37 = "선생님, 저희를 도와주실 수 있나요?"
11010-40 = "흐음…… 아비도스 고등학교라……."
11010-41 = "예전엔 무척 큰 자치구였는데, 기후변화 때문에 마을이 어려움에 처해 있다고는 들었어요."
11010-42 = "얼마나 크냐면, 마을 한가운데에서 길을 잃고 조난 당하는 사람이 있을 정도래요!"
11010-43 = "아하하, 설마 그런 사람이 있을까요? 아무리 그래도 마을 한가운데서 조난이라니……."
11010-44 = "과장된 허풍 같은 거겠죠."
11010-45 = "그런데 학원이 폭력 조직에게 괴롭힘을 당한다니……, 보통일은 아닌 거 같은데……."
11010-46 = "무슨 일이 생긴 걸까요?"
11010-47 = "[s] 아비도스로 출장을 간다."
11010-48 = "바로 출발인가요?! 이것이 바로 어른의 행동력!"
11010-49 = "알겠습니다! 바로 출발입니다!"
11010-51 = "(아비도스 자치구에 도착했지만,)"
11010-52 = "(며칠 동안이나 학교를 찾지 못해 헤매다가, 마을 한가운데서 길을 잃고 조난당해 버렸다.)"
11010-54 = "다음화;아비도스에서의 첫날"
