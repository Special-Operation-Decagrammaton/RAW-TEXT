[translation]
1006306-1 = "평소의 행실"
1006306-3 = "(……다른 일로 시내를 거닐다, 오락실에서 게임을 하던 코유키를 발견했다.)"
1006306-4 = "아아!! 제발, 제발! 제발제발제발제발……! 이번에는!!"
1006306-9 = "……오……?"
1006306-15 = "오! 오! 오! 오! 오! 오! 오……!!"
1006306-20 = "오! ……오! 오……!"
1006306-29 = "아아아아아아-!!!!"
1006306-30 = "아니, 아니 니하하!! 아니 이게 말이 되냐고, 진짜!! 아니!!"
1006306-31 = "대체 몇 번이나 연속으로 실패하는 거야!? 어? 이게 말이 돼?? 말이 안 되잖아 말이!!"
1006306-32 = "말이! 안! 된다고! 말이!! 어!?"
1006306-39 = "아아아아아아아-!!"
1006306-49 = "[ns1] \"안녕, 코유키.\"\n[ns2] \"물건을 그렇게 때리면 안 돼.\""
1006306-52 = "……헉!? 죄, 죄송합니다……!!"
1006306-56 = "어라!? 선생님!? 선생님이 왜 여기에……."
1006306-57 = "그냥 지나가다가 보셨다고요? 그, 그렇군요. 우연도 이런 우연이!"
1006306-58 = "……네? 뭐 하고 있었냐고요? 그야 보시다시피 게임인데, <찻집등반>이라는 게임이에요."
1006306-59 = "근데 이게 아주 똥게임이거든요? 난이도도 난이도지만 무작위성이 심해서……!!"
1006306-60 = "하아……. 남들은 대충 해도 5층까진 간다는데, 왜 난 3층도 안 깨지는지……."
1006306-61 = "[s3] \"코유키는 정말 게임을 좋아하는구나.\"\n[s4] \"전에도 비슷한 광경들을 꽤 봤었지.\""
1006306-64 = "뭐어, 그……렇죠?"
1006306-65 = "그치만 어지간히 고리타분한 사람 아니고서야 게임 싫어하는 사람이 있겠어요? 설마 선생님은 별로신가요?"
1006306-66 = "아. 꽤 좋아하신다고요? 거 봐요, 역시 그렇잖아요!"
1006306-67 = "……네?"
1006306-68 = "게임이면 다 좋아하는 거냐고요? 아니, 뭐 그렇지는 않고요."
1006306-69 = "체스 같은 건……. 가끔 선배들이 하자고 하면 은근슬쩍 도망치는 쪽이거든요."
1006306-70 = "뭔가 수 싸움이라든가, 계산하는 거라든가……. 그런 건 그다지 취향이 아닌가 봐요."
1006306-71 = "좀 더 뭐랄까, 예상할 수 없고? 분명 안 돼야 하는데 되는 거……? 그런 쪽이 재밌지 않아요?"
1006306-72 = "분명 안 될 것 같은 것이 될 때의 쾌감인 거죠!! 논리적으로는 절대 시도해선 안 되는 거지만!!"
1006306-73 = "[s5] \"금단의 취향을 가지고 있으시네.\"\n[s6] \"뭔가 어렴풋이 이해는 간다만…….\""
1006306-76 = "니하하……."
1006306-77 = "뭐, 말씀대로 불행히도 저는 그다지 운이 좋은 편은 아니라서, 늘 이렇게 지고 있지만……."
1006306-78 = "반대로 생각하면, 뜻대로 잘 되지 않는 게 있어야 하는 맛도 있는 거 아니겠어요? 그쵸?"
1006306-79 = "마치 제가 늘 선배들에게 붙잡히면서도 탈출을 시도하는 것처럼 말이죠!!"
1006306-80 = "[s7] \"그걸 거기다 가져다 붙이는 거야?\"\n[s8] \"전혀 즐거워 보이지는 않았지만…….\""
1006306-83 = "어, 어허~! 말이 그렇다는 거죠, 말이!! 태클 걸지 마시라고요! 세상만사 뭐든 생각하기 나름! 이라는 의미잖아요!!"
1006306-84 = "……음? 네?"
1006306-85 = "평소의 행실이 좀 더 좋았으면……. 게임 운도 좋아질지 모른다……고요?"
1006306-86 = "저기, 선생님~? 갑자기 무슨 뜬금없는……."
1006306-87 = "하아. 정말, 선생님이야말로 아무 데나 막 가져다 붙이시는 거 같은데~."
1006306-88 = "평소 행실이랑 게임은 아무 상관 없는 거잖아요. 아무리 생각해도……."
1006306-89 = "그런 식으로 갑자기 훈계 타임을 잡으려 하셔도……."
1006306-93 = "……아니, 잠깐만."
1006306-94 = "그럼……. 지금 말씀대로라면……."
1006306-95 = "저랑은 달리……. 평소에 행실이 훌륭하신 선생님께서는 게임 운이 굉장하시겠군요? 그렇죠? 제 말 맞죠?"
1006306-96 = "……네?"
1006306-97 = "……그런 이야기가 아니라고요? ……흐응~. 그렇게 나오시겠다……?"
1006306-98 = "뭐, 그렇게 대답하실 거라 생각하긴 했지만……."
1006306-99 = "뭐, 선생님께서는……. 역시……."
1006306-100 = "자.신.이……."
1006306-101 = "……없으신 것…… 같고……?"
1006306-102 = "[s9] \"…………?\"\n[s10] \"뭐……라고?\""
1006306-105 = "아니, 뭐. 갑자기 그렇게 빼시는 것도 그렇고……. 제가 비록 못한다 못한다 했지만, 그래도 전 2층까진 갔으니까요."
1006306-106 = "선생님의 말씀대로라면~? '평소 행실' 대로라면~?"
1006306-107 = "선생님께선 10층도 순식간이어야겠지만~?"
1006306-108 = "혹~시나 뭐~. 안 될 수도 있고~? 그냥 그럴 수도 있다는~? 그런 이야기~?"
1006306-109 = "아니시라면……. 아무리 그래도 3층은 넘으실 수 있지 않을까요? 그렇죠?"
1006306-114 = "……GO?"
1006306-115 = "[s11] \"GO.\"\n[s12] \"어른의 무서움을 보여주마.\"\n[s13] \"후회하게 해 드리죠.\""
1006306-126 = "(이후 코유키가 보는 앞에서 <찻집등반>을 시작했다.)"
1006306-128 = "(……들고 나온 용돈을 모두 쏟아부었지만, 2층이 한계였다.)"
