[translation]
1013502-1 = "스트레스 해소"
1013502-3 = "……."
1013502-4 = "[s] \"…….\""
1013502-5 = "왜요. 뭐요. 왜요. 왜 그렇게 쳐다봐요."
1013502-6 = "제 얼굴에 뭐 묻었어요? 아니죠? 그럴 거예요. 조금 전에 거울 보고 왔으니까."
1013502-7 = "[s] \"아니, 뭔가.\""
1013502-8 = "뭔가?"
1013502-9 = "[s] \"잘 됐구나~ 싶어서.\""
1013502-10 = "……그럼요."
1013502-11 = "[s] \"그리고 역시 케이 쨩은 귀엽구나~ 싶어서.\""
1013502-12 = "왜 또 바로 그런 이야기로 흐르는 건데요!"
1013502-13 = "[s] \"아, 혹시 예전 몸이 좋았어?\""
1013502-14 = "절대, 절대, 절대, 절대, 절대로! 아니니까!!! 말이죠!!!!!"
1013502-15 = "네? 그러면 귀여운 거 싫어하는 거냐고요?"
1013502-16 = "……."
1013502-17 = "………."
1013502-18 = "…………."
1013502-19 = "……싫은 건, 아니에요."
1013502-20 = "[s] \"잘 안 들렸는데~?\""
1013502-21 = "……싫어하지 않는다고요……."
1013502-22 = "………네? 여전히 안 들린다고요?"
1013502-23 = "…………."
1013502-24 = "안 싫어해요! 굳이 어느 쪽이냐고 한다면! 그래요! 좋아해요! 이제 됐어요?!?!"
1013502-25 = "[s] \"아유.\""
1013502-26 = "아유?"
1013502-27 = "[s] \"귀여워 죽겠네.\""
1013502-28 = "크아아아아아아아악!!!!!"
1013502-30 = "일단은 현장 팀 쪽에 더 가까운 포지션이기는 합니다만."
1013502-31 = "……묘하게 이 몸, 여기저기 삐걱거리는 느낌이란 말이죠……."
1013502-32 = "네? 관절에 WE-40이라도 필요하냐고요? 무슨 소릴 하는 거예요, 이 인간아!"
1013502-33 = "거기에 그거 윤활제로 쓰기보다는 세정 용도로 쓰는 게 더 좋거든요? 애초에 그런 용도로 만들어진 거고요!"
1013502-34 = "거기에 삐걱거린다는 건 비유 같은 거지, 진짜 그렇다는 게 아니라고요!!!"
1013502-35 = "[s] \"미안, 미안…….\""
1013502-36 = "뭐…… 그렇습니다. 애초에, 솔직히……."
1013502-37 = "여기저기 굴러다니던걸, 적당히 주워 쓰고 있는 거나 마찬가지이니……. 움직여 준다는 것만으로 감사해야 할 일이겠죠."
1013502-38 = "화가 나냐고요? 그렇게까지는 아니에요."
1013502-39 = "뭐, 감사해야 한다면 감사해야 할 지경이기는 하죠. 인생은 어차피 투쟁이고요."
1013502-40 = "세상에 100이 어디 있겠어요, 100이. 50 정도 주어지면 다행이고, 보통은 그 이하죠."
1013502-41 = "아직 불태울 것이 남아 있다면, 그걸 마지막까지 불태워서……."
1013502-42 = "아무튼, 뭔지 모를 저 위의 무언가를 향해, 내질러야 한다고 생각해요."
1013502-43 = "거기에 뭐, 붙어 있던 걸 보면 이거, 애초에 불량품 내지는 처분용이었던 것 같고요."
1013502-44 = "……말해 놓고 보니까, 지금 제 처지에 한층 더 깊은 우울함이 느껴지려고 하네요……."
1013502-45 = "[s] \"역시 예전 몸이…….\""
1013502-46 = "그건! 죽어도! 아니니까요!!!"
1013502-47 = "하아, 하아, 하아……. 무슨 말을 못 하겠네요. 진짜."
1013502-48 = "아무튼 다른 사람들도 그렇고 선생님도 그렇고, 이 몸 보기보다 엉망이기는 하지만."
1013502-49 = "그런 주제에 또 제법 섬세하게 만들어져 있으니까 말이죠?"
1013502-50 = "그러니까, 그, 뭐라고 할까……."
1013502-51 = "[s] \"응? 모두 케이를 소중하게 대해 주고 있는데?\""
1013502-52 = "그, 그건 알고 있어요! 제가 하려는 말은 그런 게 아니라!"
1013502-53 = "그러니까, 저기……."
1013502-54 = "……."
1013502-55 = "……머리 묶을 때 쓰는 리본이라든가, 그 비슷한 거, 없을까 해서……."
1013502-56 = "[s] \"리본?\""
1013502-57 = "……!!!"
1013502-58 = "역시 아무것도 아니에요! 못 들은 걸로 해 주세요! 아뇨, 당신은 아무것도 못 들었습니다!"
1013502-59 = "뭐, 뭔가요! 그 기분 나쁜 능글능글 웃음! 지, 진짜로 화낼 거니까요? 정말이니까요?"
1013502-60 = "네……?"
1013502-61 = "리오에게 부탁해서, 액세서리 같은 거 만들어 달라고 하겠다고요? 아니, 왜 하필 리오에게……."
1013502-62 = "……."
1013502-63 = "……??!!!"
1013502-64 = "일부러 그러는 거죠, 선생님?!?!"
1013502-65 = "[s1] \"나는! 어디까지나!\"\n[s2] \"케이 쨩을 생각하는! 순수한 선의로!\""
1013502-70 = "선생님 진짜 미워 죽겠어요!!!!!"
