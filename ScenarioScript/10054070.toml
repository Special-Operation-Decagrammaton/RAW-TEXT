10054070-14 = "Fufu. Word of us sure has spread far!"
10054070-15 = "Any kid who wants to rebel against the system is our friend!"
10054070-16 = "Ufufufu... One day, every kid in Kivotos will be a Peep!"
10054070-17 = "That worked?!"
10054070-18 = "Hm..."
10054070-19 = "Yay!! Thanks! Kiki can't believe she's actually meeting the real Peep Syndicate!"
10054070-20 = "Heehee! I'm excited to play with y'all!"
10054070-21 = "Ya' know... You're awful tall for a kindergartener."
10054070-22 = "Huh?!"
10054070-23 = "Aww...yes. Kiki's a little embarrassed about it."
10054070-24 = "Kiki didn't ask to be this tall...and everyone makes fun of her for it... That's why Kiki was hoping you three would play with her instead..."
10054070-25 = "Eh, they're just jealous! Don't let 'em get to you."
10054070-26 = "Fufufu. Maybe you're just ahead of the game and did all your growin' already."
10054070-27 = "That's right! I'm gonna be taller than all y'all in a few years, so it ain't no thing!"
10054070-28 = "Thank you!"
10054070-29 = "So, I gotta give y'all props where it's due, being brave enough to wanna join the Peep Syndicate, but..."
10054070-30 = "Yes?"
10054070-31 = "You also gotta PROVE you're brave enough. We don't want no losers who can't stick to their word or nothin'."
10054070-32 = "It ain't no joke, walking the path of a Peep. Ufufu, so prove yourself!"
10054070-33 = "How...should we do that?"
10054070-34 = "All you gotta do is pass the Peep Syndicate Induction Ceremony!"
10054070-35 = "\"Induction Ceremony\"...?"
10054070-36 = "But it's a terrible, cruel ceremony... Harsh beyond your wildest dreams..."
10054070-37 = "Aw, geez. I still get nightmares sometimes."
