10054070-2 = ""
10054070-3 = "And who in the heck are you?"
10054070-4 = "I ain't seen y'all around town..."
10054070-5 = "How'd you know we were here, huh??"
10054070-6 = "Um, hi! I'm Shunling! We just heard people talking about the Peep Syndicate, and we wanted to come join you guys!"
10054070-7 = "You don't follow rules and do whatever you want, right? All the cool kids wanna be a Peep these days!"
10054070-8 = "Ah! And I'm Kiki!"
10054070-9 = "Shunling? Kiki...?"
10054070-10 = "You heard about us?"
10054070-11 = "All the...\"cool kids\"...?"
