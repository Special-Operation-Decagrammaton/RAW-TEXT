[translation]
10054070-1 = "第7話;入團儀式"
10054070-2 = ""
10054070-3 = "唔嗯……你們是誰啊？"
10054070-4 = "沒看過你們呢……"
10054070-5 = "你們是怎麼知道這裡的？"
10054070-6 = "那個……你好！我的名字叫小旬。#n我們是聽說了雛鳥組的名聲，所以特地來申請加入的！"
10054070-7 = "沒錯！聽說是個超厲害又帥氣，而且還很有名的組織！"
10054070-8 = "啊，對了！我是妃妃！"
10054070-9 = "小旬？妃妃……？"
10054070-10 = "聽說了我們雛鳥組的名聲特地跑來的……？"
10054070-11 = "厲害又帥氣……有名的組織……"
10054070-12 = "果，果然很奇怪嗎……？"
10054070-13 = "唔……確實很難不認為這是臨時拼湊而來的說詞……"
10054070-14 = "那就沒辦法了呢！"
10054070-15 = "如果是討厭被說教的朋友，我們隨時歡迎。"
10054070-16 = "唔呵呵。直到把奇普托斯的所有小孩都變成雛鳥組的那一天為止……"
10054070-17 = "哎呀……？"
10054070-18 = "唔呣……"
10054070-19 = "謝謝你們！請多多指教！"
10054070-20 = "哇～！可以一起玩了，好開心！"
10054070-21 = "可是你們……以幼稚園生來說，身高是不是有點太高了？"
10054070-22 = "！？"
10054070-23 = "沒錯……其實妃妃也在煩惱這件事情。"
10054070-24 = "大家都取笑我們，還不願意跟我們玩……#n我們又不是自己想長這麼高的……"
10054070-25 = "不用放在心上啦。他們只是在羨慕你們而已。"
10054070-26 = "唔呵呵。你們搞不好只是把以後要長的部分先長完而已。"
10054070-27 = "對啊！等我十歲之後一定會長得比你們還要高！不用在意啦！"
10054070-28 = "謝謝你們！"
10054070-29 = "不過說是這麼說……雖然聽到我們雛鳥組的名聲而跑來加入，確實勇氣可嘉……"
10054070-30 = "咦？"
10054070-31 = "但你們還是得證明那份勇氣才行。#n很抱歉，又弱又沒骨氣的人沒有資格當我們的夥伴。"
10054070-32 = "畢竟雛鳥組的道路，可是一條困難重重的荊棘之路啊……#n唔呵呵，你們必須展現出能夠克服那些困難的覺悟才行。"
10054070-33 = "我們該怎麼做呢……？"
10054070-34 = "很簡單！只要通過雛鳥組的入團儀式就行了！"
10054070-35 = "入團儀式……？"
10054070-36 = "不過那個儀式，可是出了名的恐怖和殘酷……"
10054070-37 = "我到現在還會偶爾夢到接受儀式時的惡夢呢……"
10054070-38 = "究竟是什麼樣的儀式呢？"
10054070-39 = "嗚嗚……雖然聽起來很可怕，可是妃妃還不想放棄……"
10054070-40 = "哦？那股氣勢，我喜歡。"
10054070-41 = "那就馬上開始吧！儀式就是……"
10054070-42 = ""
10054070-44 = ""
10054070-45 = ""
10054070-46 = "把這碗無糖優格一口氣喝光！"
10054070-47 = "嗯……？"
10054070-48 = "嗚嗚，太恐怖了……一點甜味都沒有，只有酸味的無糖優格……"
10054070-49 = "通常別說一口氣喝完了，光是一小口就酸得眼淚都要流出來了呢……"
10054070-50 = "尤其那股酸味還會一直留在嘴裡，讓人難受好久……"
10054070-51 = "其實我們自己也沒能一口氣全部喝完就是了。"
10054070-52 = "所以只要喝到一定程度就能算你們通過了。"
10054070-53 = "……"
10054070-54 = "原來如此……確實是一場試煉呢。#n要把這碗既酸又不甜、光是喝下去就是種苦難的優格一口氣……"
10054070-55 = "但是，妃妃會鼓起勇氣的！"
10054070-56 = ""
10054070-58 = ""
10054070-62 = "呼……"
10054070-63 = "咦，咦咦……？"
10054070-64 = "真的假的……？"
10054070-65 = "天啊，連我都沒辦法一口氣喝那麼多耶……！"
10054070-66 = "我也要挑戰看看！"
10054070-67 = ""
10054070-69 = ""
10054070-73 = "噗哈！"
10054070-74 = "全都喝完了！"
10054070-75 = "怎麼樣呢？妃妃很努力了唷！"
10054070-76 = "……"
10054070-77 = "…………"
10054070-78 = "呵，呵呵……看來我的眼光果然沒錯啊！歡迎你們加入！"
10054070-80 = ""
10054070-81 = "好！既然有新成員加入了，就來開始進行下一個計畫吧！"
10054070-82 = "你是說商店街那些又遜又弱的大人對吧？"
10054070-83 = "唔呵呵，真不錯呢。#n畢竟這段時間……確實對他們太客氣了嘛……？"
10054070-84 = "沒錯！這次一定要用華麗的「煙火」，熱熱鬧鬧地為那條街「慶祝」一番！"
10054070-85 = "贊成！"
10054070-86 = "啊，那個……"
10054070-87 = "嗯？你們怎麼了？"
10054070-88 = "……該不會事到如今才說做不到或不想做吧？#n我們雛鳥組可是一即是全，全即是一的組織哦。"
10054070-89 = "怎，怎麼會呢！妃妃很期待唷！"
10054070-90 = "哇～！好厲害！感覺一定很有趣！"
10054070-91 = "可是……"
10054070-92 = "為什麼要特地去那個地方放「煙火」呢？"
10054070-93 = "那還用問嗎？因為那麼做的話……"
10054070-94 = "感覺一定會很好玩嘛！唔呵呵呵呵……"
10054070-95 = "……而且那些大人也有點可惡呢。"
10054070-96 = "就是說啊！居然敢接待我們以外的客人……！#n雖然我們也沒說不准接待，但都是大人了也該自己察覺一下吧！"
10054070-97 = "可是……我們不也是因為這樣才能加入雛鳥組的嗎？"
10054070-98 = "是這樣沒錯，但那也只是碰巧運氣好而已。"
10054070-99 = "光是這樣……還不足以原諒他們。"
10054070-100 = "總之事情就是這樣！好，那麼……！"
10054070-101 = ""
10054070-103 = ""
10054070-104 = ""
10054070-105 = ""
10054070-106 = ""
10054070-107 = "您好，大小姐。您對那個地方還滿意嗎？請問有什麼吩咐？"
10054070-108 = "在明天早上之前準備好重火器和彈藥，還有……對了！把護衛隊也叫來！"
10054070-109 = "咦？重火器、彈藥……還有護衛隊嗎？#n可，可是護衛隊不能隨便派到外面去……"
10054070-110 = "那就隨便找幾個傭兵也行！我要去好好教訓一下這裡的人！"
10054070-111 = "又來了嗎……？這次又是為了什麼理由……"
10054070-112 = "不要老是問這種問題！小心我把你開除哦！？"
10054070-113 = "不不不，我沒有那個意思……#n您是說明天早上之前對吧？我明白了，我這就去安排。"
10054070-114 = ""
10054070-116 = ""
10054070-117 = ""
10054070-118 = "……"
10054070-119 = "好，這樣就準備完成了！"
10054070-120 = "真期待明天呢！一定會是一場非常華麗的「煙火秀」。"
10054070-121 = "那麼計畫也都定好了……"
10054070-122 = ""
10054070-124 = "要不要大家一起玩呢？"
10054070-125 = "好啊！"
10054070-126 = "……"
10054070-127 = "對了，雛鳥組的大家平常都玩什麼呢？"
10054070-128 = "很好奇嗎？我就知道！#n你們肯定連想都想不到哦。首先是……"
10054070-129 = "迫擊砲投壺！"
10054070-130 = "迫擊砲……投壺？"
10054070-131 = "過來這邊！"
10054070-133 = ""
10054070-134 = "有看到畫在那邊的圓圈嗎？"
10054070-135 = "嗯，看到了。"
10054070-136 = "只要發射這個迫擊砲，把最多砲彈打進圓圈裡的人就贏了。"
10054070-137 = "但是發射的時候只能完全憑感覺瞄準，這就是最重要的規則。"
10054070-138 = "這，這樣啊？那麼砲彈應該不會爆炸，或者已經把炸藥取出來了對吧？"
10054070-139 = "唔呵呵。我們怎麼可能做那種無聊的事呢？#n砲彈當然是完全比照實戰規格囉。"
10054070-140 = "咦！？"
10054070-141 = "要問為什麼的話，是因為規則也允許攻擊別人先發射的砲彈，#n也就是用撞擊或引爆的方式把別人的砲彈炸到圓圈之外。"
10054070-142 = "這可是迫擊砲投壺最大的亮點與戰略所在呢！"
10054070-143 = "那麼……你叫妃妃對吧？特別讓你先發射！盡情地轟炸吧！"
10054070-144 = "雖然這其實是越晚發射越有利的遊戲就是了。"
10054070-145 = "唔呵呵……"
10054070-153 = "啊哈哈哈哈！全部都被我炸掉了哦！"
10054070-154 = "真可惜呢……好不容易成功打進三顆的說……"
10054070-156 = "接下來是[ruby=MANPADS]單兵防空飛彈[/ruby]飛靶射擊遊戲。"
10054070-157 = "我，我知道什麼是飛靶射擊……但你剛才說單兵防空飛彈？"
10054070-158 = "嗯，就是用單兵防空飛彈把黏土飛靶炸成碎……我是說擊落。"
10054070-159 = "這裡有個重點！用定時引信在附近引爆也可以哦！#n就算用衝擊波把飛靶炸得粉碎也沒關係，反正掉下來就算擊落了嘛。"
10054070-160 = "唔呵呵……不過定時引信的計時器必須要自己設定。#n這才是遊戲最好玩的部分呢。"
10054070-161 = "那就由我先來！預備……發射！！！"
10054070-162 = ""
10054070-172 = "啊，太快爆炸了！呀哈哈哈哈！！！"
10054070-173 = "接下來是用半自動直射榴彈發射器來打彈珠……不對，是擊倒標靶。"
10054070-174 = "目標是只用一發，盡可能地打倒更多標靶唷。"
10054070-175 = "可是榴彈原本的目的，不就是用一次的爆炸對大範圍造成衝擊嗎？"
10054070-176 = "唔呵呵……在這個遊戲中使用的，是口徑比較小的榴彈發射器。"
10054070-177 = "雖然說爆炸半徑最大有5m，但是實際上大概只有2～3m呢。"
10054070-178 = "不過只要技術夠好，也能炸出最大半徑哦！"
10054070-179 = "這個遊戲比的就是那種技術。"
10054070-180 = "可是我是第一次用這種榴彈發射器耶？"
10054070-181 = "那就是你自己的問題囉！"
10054070-194 = ""
10054070-195 = "嗯～！"
10054070-196 = "真好玩！！！"
10054070-197 = "果然有新成員加入的感覺真不錯呢。"
10054070-198 = "唔呵呵……畢竟人越多就越有趣嘛。"
10054070-199 = "是，是的！我們也玩得非常開心！"
10054070-200 = "可是今天差不多該回去了……明天再一起玩吧！"
10054070-201 = "咦？要回去了嗎？留下來再多玩一下嘛！"
10054070-202 = "我們也很想留下來……但是還有人在等我們，傍晚之前得必須回去。"
10054070-203 = "哦哦，是門禁啊。那種東西真的很討厭呢。"
10054070-204 = "真可憐……果然還是要盡快把奇普托斯的所有小孩都拉進雛鳥組才行。"
10054070-205 = "沒錯！這樣門禁那些煩人的規定也會通通消失了吧！"
10054070-206 = "我知道了。那明天就照我們說好的……在商店街舉辦慶典吧！到時候就在那裡集合！"
10054070-212 = "（兵荒馬亂的一天過去了）"
10054070-213 = "（各自分享「調查結果」之後，心菜可能是因為累了而早早回房休息……）"
