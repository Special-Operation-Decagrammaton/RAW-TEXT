[translation]
10054070-1 = "7화;입단식"
10054070-3 = "어라? 너희들, 누구야?"
10054070-4 = "못 보던 얼굴인데……."
10054070-5 = "여기는 어떻게 알고 온 건가요?"
10054070-6 = "어……. 안녕하세요! 슈에링이라고 해요. 그러니까 우리는…… 병아리파의 소문을 듣고, 가입하러 왔어요!"
10054070-7 = "맞아요! 정말 대단하고 멋진 조직이라고 들었거든요! 엄청 유명하댔어요."
10054070-8 = "아, 그리고 저는 키키예요!"
10054070-9 = "슈에링? 키키……?"
10054070-10 = "우리 병아리파의 소문을 듣고 왔다……?"
10054070-11 = "대단하고 멋진 조직……. 유명……."
10054070-12 = "여, 역시 이상했을까요……?"
10054070-13 = "으, 음……. 확실히 급조한 변명이라는 느낌을 지우기 어렵긴 했지……."
10054070-14 = "그런 거라면 어쩔 수 없네!"
10054070-15 = "잔소리가 싫은 친구는, 언제든 환영이야."
10054070-16 = "우후후후. 모든 키보토스 아이들을, 병아리파로 만드는 그날까지……."
10054070-17 = "어라……?"
10054070-18 = "으흠……."
10054070-19 = "감사합니다! 잘 부탁드릴게요!"
10054070-20 = "와아! 같이 놀 수 있게 된다니, 기뻐요!"
10054070-21 = "그런데 너희들…… 유치원생치고는 키가 좀 큰데?"
10054070-22 = "?!"
10054070-23 = "맞아요……. 키키도 그게 고민인 거 있죠?"
10054070-24 = "다들 놀리고, 잘 안 놀아주려고 하고……. 이렇게 크고 싶어서 큰 것도 아닌데요……."
10054070-25 = "걱정하지 마. 다들 부러워서 그러는 거니까."
10054070-26 = "우후후. 나중에 자랄 것을, 지금 몰아서 자라 버린 걸 수도 있으니까요."
10054070-27 = "맞아! 내가 열 살만 돼도, 분명 너희들보다 더 커져 있을 테니까! 신경 쓰지 마!"
10054070-28 = "고맙습니다!"
10054070-29 = "그런데 말이지, 우리 병아리파의 소문을 듣고 가입하러 온 것은 용감하지만……."
10054070-30 = "네?"
10054070-31 = "그렇다면 그 용기를 증명해야 할 거야. 약하고 근성이 모자라는 친구는, 미안하지만, 함께 하기 어려우니까."
10054070-32 = "병아리파의 길은 그야말로 험난한 가시밭길……. 우후후후. 그걸 이겨낼 수 있다는 각오는, 보여줘야 할 테니까요."
10054070-33 = "어떻게 하면 되나요……?"
10054070-34 = "그건 바로! 병아리파 가입 의식을 통과하면 돼!"
10054070-35 = "가입 의식……?"
10054070-36 = "하지만 그 의식은 너무나 끔찍하고 가혹하기로 이름 높아……."
10054070-37 = "아직도 그 의식을 치렀을 때의 기억을 악몽으로 꾸고는 하죠……."
10054070-38 = "도대체 무엇이길래요?"
10054070-39 = "으우……. 아주 아주 무섭지만, 그래도 키키, 아직은 포기하고 싶지 않아요……."
10054070-40 = "호오. 그 자세, 마음에 들었어."
10054070-41 = "그러면 곧바로 시작하도록 할까! 그것은 바로……."
10054070-46 = "이 무가당 요거트 대접을, 한 번에 마시는 거야!"
10054070-47 = "네……?"
10054070-48 = "으으, 너무 끔찍해……. 조금도 단맛이 안 나고, 시기만 한 무가당 요거트……."
10054070-49 = "보통은 한 번에 마시기는커녕, 입에 대기만 해도 셔서 눈물이 나오고 말죠……."
10054070-50 = "심지어 그 신맛이 입에 계속 남아서, 한동안 기분이 나쁘기까지 해……."
10054070-51 = "사실 우리도 한 번에 다 마시지는 못했지만 말이야."
10054070-52 = "그래서 적당히 어느 정도만 마셔도 통과시켜 줄 생각이지만요."
10054070-53 = "……."
10054070-54 = "알겠어요……. 이것은 확실히 시련이네요. 시큼하고, 달콤하지도 않고, 먹는 것 자체가 고난인 요거트를 단숨에……."
10054070-55 = "하지만 키키, 용기를 내겠어요!"
10054070-62 = "후우……."
10054070-63 = "어, 어어……?"
10054070-64 = "정말로……?"
10054070-65 = "세상에, 저도 한 번에 저렇게 많이 마시지는 못했는데……!"
10054070-66 = "저도 해 볼래요!"
10054070-73 = "푸하!"
10054070-74 = "다 마셨어요!"
10054070-75 = "어떤가요? 키키, 힘냈어요!"
10054070-76 = "……."
10054070-77 = "………."
10054070-78 = "후, 후후……. 역시 내 안목은 틀리지 않았어! 둘 다 환영해!"
10054070-81 = "좋아! 신입도 왔으니까, 이제 다음 계획으로 넘어가 볼까?"
10054070-82 = "그 허접하고 약해 빠진 상점가 어른들 이야기지?"
10054070-83 = "우후후. 좋네요. 그동안…… 너무 많이 봐 주긴 했죠……?"
10054070-84 = "그래! 그 거리를…… 이번에야말로 화려한 '불꽃놀이'로, 화끈하게 '축하'해 주는 거야!"
10054070-85 = "찬성!"
10054070-86 = "어, 어어……."
10054070-87 = "응? 왜 그래, 너희들."
10054070-88 = "……설마, 이제 와서 못 하겠다거나 싫다거나 그러는 건 아니지? 병아리파는 하나이면서 전체, 전체이면서 하나니까."
10054070-89 = "그, 그럴 리가요! 키키, 기대돼요!"
10054070-90 = "와아, 멋져요! 재미있겠어요!"
10054070-91 = "그런데……."
10054070-92 = "무슨 이유로 거기에 '불꽃놀이'를 하러 가는 건가요?"
10054070-93 = "그건 당연하잖아? 그렇게 하면……."
10054070-94 = "정말로 재미있을 것 같으니까요! 우후후후후……."
10054070-95 = "……그 어른들 조금, 괘씸하기도 했고요."
10054070-96 = "맞아! 감히 우리 말고 손님을 받다니……! 물론 받지 말란 말은 안 했지만, 알아서 눈치챘어야지! 어른이면서!"
10054070-97 = "하지만…… 우리는 그 덕분에 병아리파가 될 수 있었는데요?"
10054070-98 = "맞는 말이지만, 그건 어쩌다 얻어걸린 셈이니까."
10054070-99 = "그 정도로는…… 아직 용서해 주기에는 모자란 것이에요."
10054070-100 = "그런 거야! 자아, 그러면……!"
10054070-107 = "여보세요? 그곳은 마음에 드십니까, 아가씨? 무슨 일이신가요?"
10054070-108 = "내일 아침까지, 중화기랑 탄약이랑 그리고 또…… 맞아! 경호대를 불러!"
10054070-109 = "네? 중화기에 탄약에…… 경호대를요? 하, 하지만 경호대를 함부로 밖으로 내보낼 수는……."
10054070-110 = "그러면 적당히 일일 용병이라도 고용해! 여기를…… 혼내 줘야 하니까!"
10054070-111 = "또요……? 이번에는 도대체 무슨 일로……."
10054070-112 = "자꾸 그런 거 물어볼 거야?! 확 짤라버린다!?"
10054070-113 = "아이구, 아닙니다. 아닙니다……. 내일 아침까지라고 하셨죠? 알겠습니다. 준비해 두겠습니다."
10054070-118 = "……."
10054070-119 = "자, 이걸로 준비는 완료!"
10054070-120 = "내일이 기대되네. 정말 화려한 '불꽃놀이'가 될 거야."
10054070-121 = "그러면 계획도 다 세웠으니……."
10054070-124 = "다 같이 놀까요?"
10054070-125 = "좋아!"
10054070-126 = "……."
10054070-127 = "그러고 보니, 병아리파 여러분은 뭘 하고 노나요?"
10054070-128 = "궁금해? 그렇겠지! 너희는 상상도 못 할걸? 우선은……."
10054070-129 = "박격포 투호(投壺)야!"
10054070-130 = "박격포 투호…… 요?"
10054070-131 = "이리 와 봐!"
10054070-134 = "자, 저기 그려진 원이 보이지?"
10054070-135 = "네. 보여요."
10054070-136 = "그러면 이 박격포를 쏴서, 가장 원 안에 많이 집어넣으면 이기는 거야."
10054070-137 = "하지만 박격포 조준은 감으로만 해야 해. 그게 가장 중요한 규칙이니까."
10054070-138 = "그, 그렇군요? 그러면 박격포탄은 폭발하지 않거나, 작약을 덜어냈겠네요?"
10054070-139 = "우후후후후. 그런 재미없는 일을 할 리가 없잖아요? 전부 실전 사양 그대로랍니다."
10054070-140 = "네?!"
10054070-141 = "왜냐하면, 남이 먼저 쏜 박격포탄을 맞혀서 터트려서, 포탄을 원 밖으로 날려 보내는 것도 허용되거든요."
10054070-142 = "이 박격포 투호의 하이라이트이자 전략이라고도 할 수 있지!"
10054070-143 = "그러면…… 키키라고 했지? 특별히 너부터 쏘게 해 줄게! 마음껏 터트려 봐!"
10054070-144 = "사실 나중에 쏠수록 유리한 놀이지만."
10054070-145 = "우후후후후……."
10054070-153 = "아하하하하하! 내가 다 터트려 버렸지롱!"
10054070-154 = "아쉽네요……. 간신히 세 개 넣는 데 성공했는데……."
10054070-156 = "다음은 클레이 맨패즈(MANPADS) 놀이야."
10054070-157 = "크, 클레이 사격은 아는데…… 맨패즈요?"
10054070-158 = "응. 보병용 대공미사일. 그걸로 진흙 원반인 클레이를 박살…… 떨어뜨리는 거지."
10054070-159 = "여기에서 중요한 거! 시한신관으로 근처에서 폭발시켜도 돼! 충격 데미지로 산산조각내도, 떨어진 건 떨어진 거잖아?"
10054070-160 = "우후후후…… 단지 시한신관의 타이머는 스스로 세팅해야 하죠. 그게 이 놀이의 재미지만요."
10054070-161 = "나부터 한다! 준비…… 발사!!!"
10054070-172 = "아, 너무 일찍 터졌네! 아하하하하!!!"
10054070-173 = "다음은 반자동 직사 유탄발사기로 구슬치기…… 가 아니라, 타겟 쓰러트리기에요."
10054070-174 = "한 발로 최대한 많은 타겟을 쓰러트리는 게 목표랍니다."
10054070-175 = "하지만 유탄은 원래, 한 발로 넓은 범위에 충격을 주는 게 목적 아닌가요?"
10054070-176 = "우후후후…… 하지만, 이 놀이에서 사용할 유탄발사기는, 구경이 조금 작은 것이어서요."
10054070-177 = "폭발반경이 최대 5미터라고는 하는데, 실제로는 2~3미터 정도죠."
10054070-178 = "하지만 잘 쏘기만 하면, 최대 폭발반경으로 터트릴 수도 있거든!"
10054070-179 = "바로 그 능력을 겨루는 놀이야."
10054070-180 = "하지만 저는 이 유탄발사기를 처음 써 보는데요?"
10054070-181 = "그건 우리가 알 바 아니지!"
10054070-195 = "아~아."
10054070-196 = "재미있었다!!!"
10054070-197 = "역시 사람이 늘어나니까 좋네."
10054070-198 = "우후후후……. 많이 모이면 모일수록, 즐거운 법이니까요."
10054070-199 = "네, 네에! 우리도 정말 즐거웠어요!"
10054070-200 = "하지만 오늘은 이만 가 봐야 할 것 같아요……. 내일 또 놀아요!"
10054070-201 = "어? 가려고? 여기에서 더 놀자!"
10054070-202 = "정말로 그러고 싶지만…… 일행이 있거든요. 저녁에는 돌아와야 한다고 했어요."
10054070-203 = "아하. 통금 시간이구나. 그거 정말 싫지."
10054070-204 = "불쌍하네요……. 역시 하루라도 빨리 모든 키보토스의 아이들을 병아리파에 가입시켜야겠어요."
10054070-205 = "맞아! 그러면 통금이니 뭐니 귀찮은 것도, 모두 사라지겠지!"
10054070-206 = "알았어. 그러면 내일은 이야기한 대로…… 상점 거리에서 축제를 벌이는 거야! 거기에서 만나자!"
10054070-212 = "(정신없었던 하루가 지나갔다.)"
10054070-213 = "(각자 '조사 결과'를 이야기하고, 코코나는 피곤한지 먼저 자러 가고…….)"
10054070-221 = "(다른 아이들도 하나둘 숙소로 돌아갔다.)"
10054070-224 = "[ns] \"…….\""
10054070-226 = "[ns] \"생각이라도 조금 정리할까…….\""
10054070-232 = "[ns] \"참 평화롭고 조용한 풍경인데…….\""
10054070-233 = "그러게요. 정말로 좋은 곳이죠?"
10054070-234 = "[ns] \"……?\""
10054070-237 = "안녕하세요, 선생님. 밤 산책 중이셨나요?"
