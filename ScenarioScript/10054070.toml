10054070-158 = "Man-Portable Air-Defense Systems! We use them to destroy—I mean, shoot down clay disc targets."
10054070-159 = "You gotta set the fuse timer right to blow them up! If you destroy the disc from the impact, it's the same thing as shooting it!"
