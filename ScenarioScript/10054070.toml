[translation]
10054070-1 = "ตอนที่ 7;พิธีเข้าร่วมแก๊ง"
10054070-2 = ""
10054070-3 = "เอ๊ะ? พวกเธอเป็นใครกันน่ะ?"
10054070-4 = "หน้าไม่คุ้นเลย..."
10054070-5 = "รู้จักที่นี่ได้ยังไงคะ?"
10054070-6 = "เอ่อ... สวัสดีค่ะ! ฉันชื่อชุนหลิงค่ะ คือว่าพวกเรา...ได้ยินกิตติศัพท์ของแก๊งลูกเจี๊ยบ ก็เลยมาขอเข้าร่วมค่ะ!  "
10054070-7 = "ใช่ค่ะ! ได้ยินว่าเป็นแก๊งที่ยิ่งใหญ่และเท่มาก! แล้วก็โด่งดังสุดๆ เลยด้วยค่ะ "
10054070-8 = "อ้อ ส่วนฉันชื่อคิกิค่ะ!"
10054070-9 = "ชุนหลิง? คิกิ...?"
10054070-10 = "มาที่นี่เพราะได้ยินข่าวลือของแก๊งลูกเจี๊ยบงั้นเหรอ...?"
10054070-11 = "แก๊งที่ยิ่งใหญ่และเท่มาก... โด่งดังสุดๆ ด้วย..."
10054070-12 = "ดะ... ดูแปลกใช่มั้ยคะ...?"
10054070-13 = "อะ... อืม... คงปฏิเสธไม่ได้จริงๆ ว่ามันเหมือนข้ออ้างที่เพิ่งด้นสดขึ้นมา..."
10054070-14 = "ถ้าเป็นแบบนั้นก็ช่วยไม่ได้ละค่ะ!"
10054070-15 = "ใครที่ไม่ชอบโดนบ่น ที่นี่ยินดีต้อนรับเสมอ!"
10054070-16 = "ฮุฮุฮุฮุ จนกว่าจะถึงวันที่เด็กๆ ทั่วคิโวทอสกลายเป็นสมาชิกแก๊งลูกเจี๊ยบ..."
10054070-17 = "เอ๋...?"
10054070-18 = "อืม..."
10054070-19 = "ขอบคุณค่ะ! ฝากตัวด้วยนะคะ!"
10054070-20 = "ว้าว! ดีใจจังเลยค่ะที่จะได้เล่นด้วยกัน!"
10054070-21 = "ว่าแต่พวกเธอ... ตัวสูงไปหน่อยสำหรับเด็กอนุบาลหรือเปล่า?"
10054070-22 = "?!"
10054070-23 = "ใช่ค่ะ... คิกิเองก็กลุ้มใจเรื่องนั้นอยู่เหมือนกันค่ะ"
10054070-24 = "คนอื่นพากันล้อ แล้วก็ไม่ค่อยยอมเล่นด้วย... คิกิไม่ได้อยากตัวโตขนาดนี้สักหน่อยค่ะ..."
10054070-25 = "ไม่ต้องกังวลนะ คนอื่นคงแค่อิจฉาน่ะ"
10054070-26 = "ฮุฮุฮุ เพราะบางที ส่วนที่ควรจะค่อยๆ โตในภายหลัง อาจมาโตพรวดเดียวเสียตั้งแต่ตอนนี้แล้วก็ได้ค่ะ"
10054070-27 = "ใช่! ถ้าฉันอายุครบสิบขวบ ก็ต้องตัวโตกว่าพวกเธอแน่นอน! งั้นก็อย่าใส่ใจให้มันมากนักเลย!"
10054070-28 = "ขอบคุณค่ะ!"
10054070-29 = "แต่ว่านะ การได้ยินกิตติศัพท์ของแก๊งลูกเจี๊ยบของเราแล้วมาขอเข้าแก๊งแบบนี้#nก็ถือว่าพวกเธอใจกล้าดีอยู่หรอก..."
10054070-30 = "คะ?"
10054070-31 = "ถ้างั้นก็ต้องพิสูจน์ความกล้านั้นก่อนละนะ คนที่อ่อนแอและขาดความมุ่งมั่นน่ะ คงร่วมทางกับพวกเราลำบาก"
10054070-32 = "เส้นทางของแก๊งลูกเจี๊ยบเต็มไปด้วยขวากหนามยากลำบาก... ฮุฮุฮุฮุ เพราะงั้นก็ต้องแสดงให้เห็นหน่อยว่ามีความมุ่งมั่นพอจะฝ่าฟันมันไปได้ค่ะ!"
10054070-33 = "แล้วต้องทำยังไงเหรอคะ...?"
10054070-34 = "นั่นก็คือ! ต้องผ่าน 'พิธีเข้าแก๊งลูกเจี๊ยบ' ให้ได้!"
10054070-35 = "พิธีเข้าแก๊ง...?"
10054070-36 = "แต่ว่าพิธีนั่นน่ะ ขึ้นชื่อว่าโหดร้ายและหนักหนาสาหัสมาก..."
10054070-37 = "ตอนนี้พวกเรายังฝันร้ายถึงความทรงจำตอนผ่านพิธีนั้นมาอยู่เลยค่ะ..."
10054070-38 = "มันคืออะไรเหรอคะ?"
10054070-39 = "อึก... ถึงจะฟังดูน่ากลัวมากๆ แต่คิกิก็ยังไม่อยากถอดใจค่ะ..."
10054070-40 = "โอ้ นี่แหละท่าทีที่ฉันชอบ "
10054070-41 = "ถ้างั้นก็มาเริ่มกันเลย! สิ่งนั้นก็คือ..."
10054070-42 = ""
10054070-44 = ""
10054070-45 = ""
10054070-46 = "โยเกิร์ตรับน้อง! ต้องกินโยเกิร์ตไม่ใส่น้ำตาลให้หมดในรวดเดียว!"
10054070-47 = "คะ...?"
10054070-48 = "อึก น่ากลัวเกินไปแล้ว... โยเกิร์ตไม่ใส่น้ำตาลที่ไม่หวานเลยสักนิด มีแต่รสเปรี้ยวอย่างเดียว... "
10054070-49 = "อย่าว่าแต่กินรวดเดียวหมดเลย แค่ยกขึ้นแตะปากก็เปรี้ยวจนน้ำตาไหลแล้วค่ะ..."
10054070-50 = "แถมรสเปรี้ยวยังติดอยู่ในปากไม่หาย จนรู้สึกแย่ไปพักหนึ่งเลย..."
10054070-51 = "ที่จริงพวกเราก็กินไม่หมดในครั้งเดียวหรอก"
10054070-52 = "เพราะงั้นแค่กินไปได้สักพอประมาณหนึ่ง ก็คิดว่าจะให้ผ่านแล้วค่ะ"
10054070-53 = "..."
10054070-54 = "เข้าใจแล้วค่ะ... สมกับเป็นบททดสอบเลยนะคะ โยเกิร์ตที่เปรี้ยว ไม่มีรสหวานเลย ปกติแค่ชิมๆ ดูก็ลำบากแล้ว แต่นี่ต้องกินให้หมดในรวดเดียว..."
10054070-55 = "แต่คิกิจะรวบรวมความกล้าค่ะ!"
10054070-56 = ""
10054070-58 = ""
10054070-62 = "ฮู่ว..."
10054070-63 = "เอะ... เอ๋...?"
10054070-64 = "เอาจริงเหรอเนี่ย...?"
10054070-65 = "ตายจริง แม้แต่ฉันก็ยังกินมากขนาดนั้นในรวดเดียวไม่ได้เลยค่ะ...!"
10054070-66 = "ฉันก็จะลองด้วยค่ะ!"
10054070-67 = ""
10054070-69 = ""
10054070-73 = "อึ้ก!"
10054070-74 = "หมดแล้วค่ะ!"
10054070-75 = "เป็นยังไงบ้างคะ? คิกิพยายามเต็มที่เลยค่ะ!"
10054070-76 = "..."
10054070-77 = "......."
10054070-78 = "ฮุ... ฮุฮุ... ฉันดูคนไม่ผิดจริงๆ! ยินดีต้อนรับทั้งคู่เลย!"
10054070-80 = ""
10054070-81 = "ดีละ! ในเมื่อได้สมาชิกใหม่มาแล้ว งั้นไปต่อที่แผนถัดไปกันเลยดีมั้ย?"
10054070-82 = "หมายถึงผู้ใหญ่ในย่านร้านค้าที่กากๆ อ่อนปวกเปียกนั่นใช่มั้ย?"
10054070-83 = "ฮุฮุฮุ ดีเลยค่ะ ที่ผ่านมา... พวกเราอ่อนข้อให้มากเกินไปใช่มั้ยคะ...?"
10054070-84 = "ใช่! ครั้งนี้พวกเราจะ 'ฉลอง' ให้ถนนเส้นนั้นอย่างร้อนแรงด้วย 'ดอกไม้ไฟ' สุดอลังการเลย!"
10054070-85 = "เห็นด้วย!"
10054070-86 = "อะ... อ่า..."
10054070-87 = "หืม? เป็นอะไรกัน พวกเธอ? "
10054070-88 = "มาถึงป่านนี้แล้ว คงไม่บอกว่าทำไม่ได้ หรือไม่อยากทำขึ้นมาหรอกใช่มั้ย? แก๊งลูกเจี๊ยบคือหนึ่งเดียวกันทั้งหมด และทั้งหมดก็รวมเป็นหนึ่งเดียวกันนะ"
10054070-89 = "ทะ... ทำได้สิคะ! คิกิรอไม่ไหวแล้วค่ะ!"
10054070-90 = "ว้าว เท่มากค่ะ! น่าสนุกจังเลยค่ะ!"
10054070-91 = "ว่าแต่..."
10054070-92 = "ทำไมถึงจะไป 'จุดดอกไม้ไฟ' ที่นั่นเหรอคะ?"
10054070-93 = "มันก็แน่อยู่แล้วไม่ใช่เหรอ? ที่เราจะทำแบบนั้น..."
10054070-94 = "เพราะมันดูน่าสนุกมากๆ ยังไงล่ะคะ! ฮุฮุฮุฮุฮุ..."
10054070-95 = "อีกอย่าง ผู้ใหญ่พวกนั้นก็น่าหมั่นไส้นิดหน่อยด้วยค่ะ..."
10054070-96 = "ใช่! บังอาจต้อนรับลูกค้ากลุ่มอื่นนอกจากเรา...! ถึงจะไม่ได้บอกว่าห้ามรับลูกค้าอื่น แต่ก็ควรรู้เองสิ! เป็นผู้ใหญ่แท้ๆ!"
10054070-97 = "แต่ว่า... ก็เพราะเรื่องนั้นไม่ใช่เหรอคะ พวกเราถึงได้มาเป็นแก๊งลูกเจี๊ยบน่ะ?"
10054070-98 = "ก็พูดถูกอยู่หรอก แต่เรื่องนั้นเป็นแค่โชคช่วยน่ะ"
10054070-99 = "แค่นั้น... ยังไม่พอที่จะยกโทษให้หรอกนะ"
10054070-100 = "ใช่เลย! เอาละ ถ้างั้นก็...!"
10054070-101 = ""
10054070-103 = ""
10054070-104 = ""
10054070-105 = ""
10054070-106 = ""
10054070-107 = "ฮัลโหล? ถูกใจที่นั่นมั้ยครับ คุณหนู? มีเรื่องอะไรหรือเปล่าครับ?"
10054070-108 = "ฉันขออาวุธหนักกับกระสุนภายในพรุ่งนี้เช้า แล้วก็... ใช่! เรียกทีมอารักขามาด้วย!"
10054070-109 = "ครับ? ทั้งอาวุธหนัก กระสุน... แล้วก็ทีมคุ้มกันด้วยเหรอครับ? ตะ... แต่ผมส่งทีมอารักขาออกไป#nตามใจชอบไม่ได้..."
10054070-110 = "ถ้างั้นก็หาทหารรับจ้างมาแทนสิ! ฉันต้อง... สั่งสอนคนที่นี่หน่อย!"
10054070-111 = "อีกแล้วเหรอครับ...? คราวนี้เกิดเรื่องอะไรขึ้นกันแน่..."
10054070-112 = "จะถามเซ้าซี้ตลอดเลยหรือไง?! เดี๋ยวก็ไล่ออกซะเลย!?"
10054070-113 = "ไม่นะ ขออภัยครับ ผมไม่ได้จะเซ้าซี้... อยากได้ทุกอย่างภายในพรุ่งนี้เช้าใช่มั้ยครับ? เข้าใจแล้วครับ ผมจะจัดเตรียมไว้ให้ครับ"
10054070-114 = ""
10054070-116 = ""
10054070-117 = ""
10054070-118 = "..."
10054070-119 = "เอาละ เท่านี้ก็เตรียมพร้อมเรียบร้อย!"
10054070-120 = "อยากให้ถึงพรุ่งนี้แล้วสิ ต้องเป็น 'ดอกไม้ไฟ' ที่อลังการมากแน่ๆ"
10054070-121 = "เอาละ ในเมื่อวางแผนเสร็จหมดแล้ว..."
10054070-122 = ""
10054070-124 = "งั้นก็มาเล่นด้วยกันมั้ยคะ?"
10054070-125 = "ดีเลย!"
10054070-126 = "..."
10054070-127 = "ว่าแต่ ปกติในแก๊งลูกเจี๊ยบเล่นอะไรกันเหรอคะ?"
10054070-128 = "อยากรู้เหรอ? อยากรู้ก็ไม่แปลก! พวกเธอต้องคาดไม่ถึงแน่ อย่างแรกก็คือ..."
10054070-129 = "เกมยิงปืนครก!"
10054070-130 = "ยิงปืนครก... เหรอคะ?"
10054070-131 = "ตามมาสิ!"
10054070-133 = ""
10054070-134 = "เอาละ เห็นวงกลมที่วาดอยู่ตรงนั้นมั้ย?"
10054070-135 = "ค่ะ เห็นค่ะ"
10054070-136 = "ถ้างั้นก็ยิงปืนครกนี่ ใครยิงเข้าไปในวงกลมได้มากที่สุดเป็นผู้ชนะ"
10054070-137 = "แต่ตอนเล็งปืนครก ต้องกะเอาจากความรู้สึกล้วนๆ นะ นั่นเป็นกฎสำคัญที่สุด"
10054070-138 = "ละ... เล่นอย่างนี้สินะคะ? ถ้างั้น กระสุนปืนครกก็คงเป็นแบบไม่ระเบิด หรือไม่ก็ลดปริมาณวัตถุระเบิด#nข้างในลงสินะคะ?"
10054070-139 = "ฮุฮุฮุฮุฮุ จะไปทำเรื่องน่าเบื่อแบบนั้นทำไมล่ะคะ? กระสุนทั้งหมดเป็นสเปกเดียวกันกับที่ใช้ในสนามรบ#nจริงเลยค่ะ"
10054070-140 = "คะ?!"
10054070-141 = "เพราะกติกาอนุญาตให้ยิงกระสุนปืนครกที่คนอื่นยิงไว้ก่อนให้ระเบิด แล้วใช้แรงระเบิดซัดกระสุนออก#nนอกวงได้ด้วยยังไงล่ะคะ"
10054070-142 = "นี่เป็นทั้งไฮไลต์และกลยุทธ์ของเกมยิงปืนครกเลยละ!"
10054070-143 = "เอาละ... เมื่อกี้บอกว่าชื่อคิกิใช่มั้ย? จะให้สิทธิ์พิเศษเธอยิงก่อน! ระเบิดให้เต็มที่เลย!"
10054070-144 = "ถึงจริงๆ นี่จะเป็นเกมที่ยิ่งยิงทีหลังยิ่งได้เปรียบก็เถอะ"
10054070-145 = "ฮุฮุฮุฮุฮุ..."
10054070-153 = "อะฮะฮะฮะฮ่า! ฉันระเบิดหมดทุกเป้าแล้ว!"
10054070-154 = "น่าเสียดายจังค่ะ... อุตส่าห์ยิงเข้าได้ตั้งสามลูกแล้วแท้ๆ..."
10054070-156 = "ต่อไปคือเกมยิงเป้าดินด้วยแมนแพดส์"
10054070-157 = "ถะ... ถ้าเป็นยิงเป้าบินก็พอรู้จักอยู่... แต่นี่ให้ยิงเป้าดินเหรอคะ แล้วก็ยิงด้วยแมนแพดส์?"
10054070-158 = "อื้อ มันคือมิสไซล์ต่อสู้อากาศยานแบบพกพา เราจะใช้มันยิงเป้าที่เป็นจานดินเผาให้แตก... และร่วงลงมายังไงล่ะ"
10054070-159 = "เรื่องสำคัญก็คือ! จะใช้ชนวนเวลาทำให้มันระเบิดใกล้ๆ ก็ได้! ต่อให้จะแตกกระจายด้วยแรงกระแทก แต่ยังไง ถ้าร่วงก็นับว่าร่วงแล้วอยู่ดีใช่มั้ยล่ะ?"
10054070-160 = "อุฮุฮุฮุ... แต่ต้องตั้งเวลาชนวนด้วยตัวเองนะคะ นี่ละค่ะความสนุกของเกมนี้"
10054070-161 = "ฉันขอเริ่มก่อน! เตรียมตัว... ยิงได้!!!"
10054070-162 = ""
10054070-172 = "อ๊ะ ระเบิดเร็วเกินไป! อะฮะฮะฮะฮ่า!!!"
10054070-173 = "ต่อไปคือเกมดีดลูกแก้ว... ไม่สิ เกมยิงเป้าหมายด้วยปืนยิงระเบิดแนวตรงกึ่งอัตโนมัติค่ะ"
10054070-174 = "เป้าหมายก็คือ ล้มเป้าให้ได้มากที่สุดด้วยการยิงครั้งเดียวค่ะ"
10054070-175 = "แต่เดิมที จุดประสงค์ของระเบิดคือสร้างความเสียหายเป็นวงกว้างด้วยการยิงเพียงนัดเดียวนี่คะ?"
10054070-176 = "ฮุฮุฮุฮุ... แต่ปืนยิงระเบิดที่จะใช้ในเกมนี้มีขนาดลำกล้องค่อนข้างเล็กค่ะ"
10054070-177 = "ถึงจะบอกว่ารัศมีแรงระเบิดสูงสุดอยู่ที่ 5 เมตร แต่เอาเข้าจริงก็ประมาณ 2-3 เมตรเท่านั้นค่ะ"
