[translation]
2002803-1 = "멈출 수 없는"
2002803-2 = "(짐을 옮기고 있을 히나타를 찾아 캠프 주변을 돌아보았다.)"
2002803-6 = "(어마어마한 무게의 짐들을 양팔로 든 채 숲을 거닐던 히나타가 보였다.)"
2002803-10 = "영차……. 음음. 이건 이렇게……."
2002803-15 = "생각했던 것보다 훨씬 가볍네요."
2002803-16 = "성당 짐들보다 양이 적어서 그런 걸까요……?"
2002803-20 = "……음?"
2002803-24 = "……응!? 서, 선생님……!?"
2002803-25 = "어, 언제부터 거기 계셨던 건가요!?"
2002803-26 = "바, 방금 오셨다고요?"
2002803-27 = "그, 그렇군요……. 네……."
2002803-28 = "네? 도와주러 오셨다고요?"
2002803-29 = "아니에요!! 그러실 것 같아서 괜찮다고 그렇게 말씀드렸는데!"
2002803-30 = "다른 분들도 굳이 같이 해주시겠다는 걸 뿌리치느라 힘들었는데 선생님마저……."
2002803-31 = "이러시면……. 도와드리고 싶다는 제 의지가 오히려 폐를 끼치는 게 되는데……."
2002803-32 = "제 고집이……."
2002803-33 = "[s1] \"내가 좋아서 하는 거니 신경 쓰지 마.\"\n[s2] \"마음이 불편한 게 더 싫으니까 봐줘.\""
2002803-36 = "으, 으으……. 또 그렇게 말씀하시면……. 제가 대응할 수가 없는데……."
2002803-37 = "으음……."
2002803-42 = "하아……. 네……. 이것도 결국 어쩔 수 없는 일이겠군요."
2002803-43 = "알겠습니다……. 그럼 부탁드리도록 할게요. 감사해요, 선생님."
2002803-48 = "그치만 정말로 가벼운 것들만이니까요. 그 이상은 오히려 제 마음이 불편하니까요."
2002803-49 = "아시겠죠……?"
2002803-50 = "[s3] \"고마워. 그렇게 할게.\"\n[s4] \"앗싸-! 히나타랑 함께다!\""
2002803-53 = "…………풋."
2002803-54 = "후후, 후후후……."
2002803-58 = "아, 죄송해요. 어째서인지 웃음이 나와서……."
2002803-59 = "잘은 모르겠지만 마음이 편해진달까……. 그래서 저도 모르게 그만……."
2002803-60 = "분명 선생님께서 일부러 신경 써주시는 것이겠지요. 아무리 저라도, 그 정도는 알고 있답니다."
2002803-64 = "아무튼 그럼 슬슬 출발하도록 할까요? 이왕 같이해 주시는데, 시간을 끌어서 더 오래 걸리면 그것도 곤란하니까요."
2002803-65 = "앞장서도록 할게요. 그럼……."
2002803-66 = "영-차!"
2002803-75 = "……음? 저건……."
2002803-76 = "[s5] \"큰 바위가 있네.\"\n[s6] \"길이 막혔네. 큰일인걸.\""
2002803-79 = "그러게요. 캠프로 가려면, 여기를 지나가야 되는데 말이에요."
2002803-80 = "……네? 돌아갈 길을 찾자고요?"
2002803-81 = "으음-."
2002803-82 = "아뇨. 그러지는 않아도 될 것 같아요."
2002803-83 = "누군가 의도한 것 같지도 않고, 평범한 바위니까 이 정도는 손으로 치워 두면 될 것 같고……."
2002803-84 = "[s] \"아아. 그렇…….\""
2002803-88 = "[ns7] \"……네? 뭐라고요?\"\n[ns8] \"뭘로 뭘 어떻게 한다고?\""
2002803-91 = "잠시만요. 우선 짐을 내려다 두고……."
2002803-96 = "이 정도는 이렇게……. 흐응……!!"
2002803-100 = "흐으응……! 응……차!!"
2002803-109 = "……휴우. 된 거 같아요. 이 정도면 지나갈 수 있겠네요."
2002803-114 = "오래 기다리셨죠? 다시 가실까요?"
2002803-118 = "[ns] \"…….\""
2002803-123 = "어라……. 이번에는 이런 곳에 쓰러진 고목이……."
2002803-127 = "수명을 다해 죽은 나무인 모양이네요. 이대로라면 지나가기 어렵겠어요."
2002803-128 = "옆으로 밀어 놓기에는 너무 큰 것 같기도 하고……."
2002803-129 = "……네? 이번에야말로 돌아가야 할 것 같냐고요?"
2002803-130 = "하하……. 그런 것도 방법이지만, 선생님께 그런 수고를 드리게 하고 싶지는 않은데……."
2002803-131 = "음. 어쩌면 좋을까요? 이런 경우에는……."
2002803-135 = "그래도 이건 바위가 아니라 나무니까. 이렇게 해 보면……?"
2002803-139 = "흥……차!!"
2002803-148 = "[ns9] \"두꺼운 고목이 수수깡처럼…….\"\n[ns10] \"……어……음…….\""
2002803-151 = "……후우! 의외로 그렇게 단단하진 않았네요! 다행이에요!"
2002803-152 = "자, 선생님! 계속 가실까요? 이제 거의 다 왔으니까요!"
2002803-156 = "……음?"
2002803-157 = "선생님……? 어라……. 왜 그런 표정을 지으시는……."
2002803-158 = "[s] \"……히나타.\""
2002803-159 = "네, 네……?"
2002803-165 = "[ns11] \"히나타가 착한 아이라서, 선생님은 기뻐.\"\n[ns12] \"무슨 일 있으면, 꼭 선생님에게 연락해줘.\""
2002803-170 = "네, 네……?"
2002803-171 = "아. 네……. 감사합……니다……."
2002803-175 = "……선생님?"
2002803-177 = "(이후 영문을 몰라 하던 히나타와 함께, 짐을 들고 캠프로 무사히 돌아갔다.)"
2002803-178 = "(바위를 밀어내고 고목을 두 동강 낸 걸 자갈이나 나뭇가지 치운 것처럼 표현하던 히나타의 말에, 따로 반박은 하지 않았다.)"
