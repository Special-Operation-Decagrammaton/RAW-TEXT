[translation]
84302300301-6 = "괜찮다면 한가지 여쭤봐도 될까요? 개인적인 궁금증입니다만……"
84302300301-7 = "어? 뭔데?"
84302300301-8 = "그 코유키 씨라는 분은…… 문제를 자주 일으키시나요? 조금 사고뭉치를 대하는 것처럼 느껴져서요."
84302300301-13 = "조금 사고뭉치……?"
84302300301-15 = "……아."
84302300301-16 = "죄송합니다. 그래도 세미나의 일원이라고 들었는데, 제가 실언을 했나 보네요."
84302300301-17 = "반대야, 반대. '조금'에서 되물은 거라고."
84302300301-18 = "음…… 어떻게 비유해야 하지 이걸……"
84302300301-19 = "그쪽엔 그런 애 없어? 손만 대면 사고가 터지고, 아무 생각 없는데 행동력만 좋고, 머리도 핑크색이라 눈에는 또 쓸데없이 잘 띄고……"
84302300301-20 = "…………."
84302300301-21 = "있……긴 합니다만……."
84302300301-23 = "(……왜 당황하는 거지?)"
