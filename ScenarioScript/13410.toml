[translation]
13410-1 = "제41화;그 후에 남은 것들"
13410-3 = "아비도스의 어떤 중학교"
13410-4 = "공지 봤어? 폐교 날짜가 결정됐어."
13410-5 = "……이제 우린 어떻게 되는 거지?"
13410-6 = "떠나야지. 모두들 떠나고 있잖아. 진학할 고등학교도 이제 없고……."
13410-7 = "그치만……"
13410-8 = "아비도스 고등학교는 이미 끝났어. 소문에는 학생회도 해산했다고 해. 그럼 자치구도 끝난 거야."
13410-9 = "네프티스도 빠져나갔어! 기업이 우리를 책임져줄 것 같아?"
13410-10 = "그치만 아직 그 영애님은…… 졸업식까진 여기 있을 거라고……."
13410-11 = "그거 다 헛소문이야! 여기 남아 있는 건 바보나 멍청이뿐이라고! 기업의 아가씨가 그럴 거라고 생각해?"
13410-12 = "실제로 학교에서 얼굴을 본 적도 없잖아! 우리도 빨리 살길을 찾아야지!"
13410-19 = "해가…… 떠오른다고?"
13410-20 = "어째서……? 나는 아직 아무것도……."
13410-21 = "제기랄…… 나는 무엇을……."
13410-22 = "무엇을 증명하고 싶었던 거지……."
13410-29 = "뭐야, 감독관 어디 있어? 어디로 사라진 거야?!"
13410-30 = "도망-가지 마- 스오우-"
13410-33 = "대체 무슨 일이 있었던 거예요!!"
13410-35 = "어째서 부장님이 아비도스에 계신 거죠? 그것도 치료 중이라고요? 얼마나 다친 거예요?"
13410-36 = "[s] \"아코…… 조금만 진정하고…….\""
13410-37 = "지금 진정하게 생겼어요?! 선생님은 괜찮은 거예요? 병원에서 멋대로 사라져 놓고서!"
13410-38 = "[s1] \"나는 괜찮아.\"\n[s2] \"다친 데도 없었고. 단순히 과로가 문제였으니까.\""
13410-44 = "하아…… 실은 저도 부장님께 대충 연락은 받긴 했었어요. 개인적인 일 때문에 자리를 비운다더니 전혀 개인적인 일이 아니었네요."
13410-45 = "사실은 선생님이 도와달라고 한 것이었다니……."
13410-46 = "그런데 선생님은 언제 부장님에게 연락하신 거였어요?"
13410-47 = "[ns] \"그게…….\""
13410-52 = "[ns3] 밤새워 수집한 자료를 정리한다.\n[ns4] \"……필요한 건 대충 알겠어. 그럼 이제…….\""
13410-58 = "대기 중. [USERNAME] 선생님. 필요한 게 있으신가요?"
13410-59 = "[s] \"아아, 고마워, 프라나. 아로나는?\""
13410-60 = "아로나 선배는 지금 자고 있습니다. 잠꾸러기입니다. 그러니 시키실 게 있다면 부지런한 저에게 명령해 주시면 됩니다."
13410-61 = "[s5] \"고마워. 그럼…….\"\n[s6] 프라나에게 업무를 맡긴다."
13410-65 = "[ns] 열차포가 게헨나와 관계있을지도 모르니, 히나에게 연락을 해두는 게 좋을 것 같다."
13410-67 = "확인. 간단한 일이니 금방 처리할 수 있습니다."
13410-70 = "어쨌든, 기다려요! 제가 지금 거기로 갈 거니까!"
13410-71 = "……어라?"
13410-75 = "부장님의 연락……? 지금 갈 예정이니까 번거롭게 오지 말라고요……? 어, 어떻게 제 머릿속을 들여다보고 있는 거죠, 부장님?!"
13410-76 = "그럼 당장 준비를……. 연락드릴게요, 선생님!"
13410-80 = "[ns] \"……으음.\""
13410-83 = "어라, 선생님? 나와 계셨네요?"
13410-84 = "[s] \"노노미. 돌아왔구나.\""
13410-85 = "네, 코인 세탁소에 다녀왔어요! 언제까지 체육복으로 있을 수는 없으니까요~♧"
13410-86 = "하는 김에 선도부장님의 옷도 같이 세탁했는데…… 실례가 되진 않았겠죠?"
13410-87 = "[s] \"응. 당연하지.\""
13410-88 = "……. 응응. 그러네요. 여기까지 저희를 도와주러 오셨으니까, 분명 겉으로 보는 것과는 다른 분일지도……."
13410-89 = "자, 들어가요, 선생님! 곧 회의가 있잖아요?"
13410-90 = "[s] 노노미와 함께 교실로 들어간다."
13410-95 = "짜안~ 모두들 자기 옷 찾아가세요~"
13410-96 = "응. 고마워, 노노미."
13410-97 = "아하하…… 죄송해요, 노노미 선배. 번거롭게 해드려서……."
13410-98 = "으응~ 아니에요. 아야네 쨩. 이런 건 한사람이 금방 다녀오는 게 편하잖아요?"
13410-99 = "게다가 우리들 사이잖아요? 세탁물 정도는 다 같이 돌려도 문제없다고 생각해요♧"
13410-100 = "맞아. 세탁은 모아서 한 번에 돌리면 절약도 되고 좋으니까."
13410-101 = "응? 그러고 보니 호시노 선배는요?"
13410-102 = "양호실에 가 있어요. 선도부장님에게 할 말이 있는 것 같던데……."
13410-106 = "어디보자. 이 스패츠는 내꺼고, 이 팬티는 시로코 선배 꺼지? 가져가."
13410-107 = "으, 으음."
13410-108 = "응? 왜 그렇게 멍하니 있어, 선배? 저기 뭐가 있길래……?"
13410-109 = "앗……?"
13410-113 = "[ns] \"……………………….\""
13410-114 = "뭐, 뭐야! 선생님?! 왜 여고생의 세탁물을 빤히 쳐다보고 있는 거야!?!"
13410-115 = "[s] \"아니, 딱히 난 아무것도…….\""
13410-116 = "정말이지 섬세함이 없잖아!! 고개 돌려!! 시로코 선배가 부끄러워하잖아!"
13410-117 = "아니…… 난 딱히……."
13410-121 = "아, 선생님은 그럼 양호실에 가서 호시노 선배랑 선도부장님을 불러와 주시겠어요?"
13410-122 = "그러네, 선생님은 잠깐 나가 있으면 되겠네! 얼른 다녀와!"
13410-123 = "[s] \"억울해…….\""
13410-128 = "[ns7] \"히나, 호시노?\"\n[ns8] \"어디 있어?\""
13410-133 = "……여기야, 선생."
13410-141 = "……."
13410-142 = "[s] \"으음……….\""
13410-143 = "타카나시 호시노가 잠들어버려서…… 움직일 수가 없어……."
13410-144 = "[s] \"으으음………….\""
13410-145 = "이제 슬슬 돌아가 봐야 하는데…… 저기, 선생. 좀 도와주지 않을래?"
13410-146 = "[s] \"으으으으음……………….\""
13410-147 = "의미를 알 수 없는 신음 소리만 내지 말고, 좀 도와줘……!"
13410-151 = "호시노를 깨워서 이래저래 곤경에 빠진 히나를 도와주었다."
13410-153 = "그럼 모두 다 모이셨죠?"
13410-154 = "응!"
13410-155 = "응."
13410-156 = "응응, 모두 모였어요♧"
13410-157 = "하암-"
13410-158 = "그런데 호시노 선배는 계속 그 꼴로 있을 거야?"
13410-159 = "괜찮아, 괜찮아. 사람이 여유가 있어야지."
13410-160 = "응? 그런데 선도부장…… 히나 쨩은?"
13410-161 = "선도부장님은 좀 전에 게헨나로 돌아갔어요."
13410-162 = "뭐어? 벌써?"
13410-163 = "그래, 호시노 선배가 옷도 갈아입기 전에 그 사람은 준비를 다 끝내고 가버렸다니까."
13410-164 = "어딘가의 누구와는 다르게 엄청 성실하지 않아?"
13410-165 = "헤에……. 아직 인사도 안 했는데……."
13410-167 = "……실례 많았어."
13410-168 = "저기…… 아직 호시노 선배가 일어나지 않았는데……."
13410-169 = "아니, 다들 기다리고 있을 거야. 나도 멋대로 자리를 비운 거라서."
13410-170 = "그리고 인사는 다음에 해도 돼. 어차피 열차포 때문에 해결해야 할 문제가 있으니까."
13410-171 = "자세한 이야기는 그때 하지."
13410-172 = "저기……"
13410-177 = "도와주셔서 감사해요. 선도부장님."
13410-179 = "네, 맞아요. 선도부장님이 아니었으면 호시노 선배를 막는 건 불가능했을 거예요."
13410-180 = "응. 신세를 졌어."
13410-181 = "그리고 나중에 호시노 선배랑 싸운 이야기 좀 해줘."
13410-182 = "응. 관심 있는 주제야."
13410-187 = "[ns] \"고마워. 히나. 나중에 신세 갚을게.\""
13410-189 = "……늦었어."
13410-190 = "그럼 다음에 또 보지. 아비도스 대책위원회."
13410-195 = "뭐어? 그렇게 그냥 가버렸다고?"
13410-196 = "아 그리고 선배의 체육복은 가져가서 깨끗이 세탁한 다음 우편으로 돌려주기로 했어요."
13410-197 = "뭐어? 그걸 가져가 버렸어?"
13410-198 = "사이즈가 맞는 체육복은 호시노 선배 것뿐이라서 어쩔 수 없었지만……."
13410-199 = "내 속옷도 빌려줬는데 그것도 세탁해서 돌려주려나~"
13410-200 = "그, 그런 건 직접 물어보라고! 여기서 큰 소리로 말하지 말고!"
13410-201 = "그치만 연락처도 모르고…… 이 아저씨는 낯을 가리는 성격이라……."
13410-202 = "선생님에게 물어보면 되잖아! 그리고 언제부터 그런 이상한 설정이 추가된 거야?"
13410-203 = "으음…… 뭐어……."
13410-204 = "자아, 그리고 선배 옷 받으세요. 회의 시작할 거니까 얼른 갈아입고 오세요."
13410-205 = "이 아저씨는 이 복장으로도 괜찮은데……."
13410-207 = "체육시간이 아니잖아! 주말에 티비 앞에 널브러진 아저씨도 아니고!"
13410-208 = "하암~ 어쩔 수 없나."
13410-216 = "자, 그럼 아비도스 폐교대책위원회이자 아비도스 학생회…… 줄여서 대책위원회의 정기 회의를 시작하겠습니다!"
13410-217 = "먼저 첫 번째 의제는 저부터……."
13410-218 = "잠깐. 모두에게 할 말이 있어."
13410-219 = "……네? 호시노 선배?"
13410-220 = "할말?"
13410-221 = "어떤 건가요?"
13410-222 = "또 이상한 소리 하면 가만 안 둘 거야, 선배."
13410-223 = "흠흠……."
13410-224 = "노노미 쨩, 시로코 쨩. 그리고 아야네 쨩, 세리카 쨩. ……그리고 선생님."
13410-225 = "……요 며칠 간의 소동 말이지……."
13410-226 = "으, 으음……. 그러니까……."
13410-231 = "어…… 그러니까…… 저기……."
13410-232 = "내, 내가…… 잘못했다고 생각해……."
13410-233 = "어라라? 무슨 소린지 잘 안 들리는데요? 시로코 쨩, 들었나요?"
13410-234 = "아니. 하나도 안 들려."
13410-235 = "……!!"
13410-236 = "흐음, 그러네. 나도 잘 안 들리는데, 호시노 선배?"
13410-237 = "[s] \"더 크게 말하지 않으면 닿을 수 없어. 호시노.\""
13410-238 = "선생마저……."
13410-239 = "뭐어…… 그러니까……."
13410-243 = "제가 잘못했습니다……! 그것도 한 번도 아니고 두 번씩이나!"
13410-244 = "지금 돌이켜보면 내가 왜 그랬을까, 하는 생각이지만…… 뭐……."
13410-245 = "그치만 역시 내가 모두에게 잘못한 건 사실이니까……. 여러 가지 걱정도 끼쳤고…… 폐도 끼쳤고……. 으음……."
13410-249 = "……. 끼쳤죠. 민폐."
13410-250 = "뭐, 그렇지만 결국 다 잘됐잖아."
13410-251 = "돌아와 줘서 다행이야. 선배."
13410-252 = "응. 맞아요."
13410-253 = "……그러게. 나도 뭐가 뭔지 잘 모르겠지만. 그때 한 가지는 확실하게 기억나."
13410-254 = "그때 모두의 목소리가 들렸거든."
13410-261 = "……그 목소리를 통해서 최소한 한 가지는 확실하게 알 수 있었지."
13410-262 = "세리카 쨩이 아야네 쨩과 아이돌 데뷔하기로 약속했다는 걸 말야!!"
13410-263 = "네에?"
13410-264 = "아이돌?"
13410-265 = "네, 네?! 네에?"
13410-266 = "뭐, 뭐라는 거야-!!"
13410-267 = "그치만 확실하게 들었거든? 세리카 쨩, 지금 와서 그 약속을 어기겠다는 거야? 그런 거야? 설마 그런 말 한 적 없다고 발뺌할 셈이야아-?"
13410-268 = "그, 그건……! 그러니까, 그냥 홧김에 던진 거랄까…… 아니, 그런 말 하긴 했는데……."
13410-269 = "세리카 쨩?!"
13410-270 = "그치만 어쩔 수 없었단 말야!"
13410-271 = "으헤~ 그러니까 이 아저씨는 그 광경을 보기 전까진 눈을 감을 수 없다고 생각해 버렸거든?"
13410-273 = "그러니까 지금 와서 무리입니다, 실언이에요, 같은 소릴 하는 건 아니겠지이이-?"
13410-274 = "아니, 무리 맞거든? 실언…… 까진 아니지만."
13410-275 = "응응! 그럼 적당한 기회가 오면 두 사람 멋지게 데뷔하는 거예요!? 제가 프로듀서 할 테니까♧"
13410-276 = "아이돌이라니…… 그런……."
13410-277 = "(소근소근) ……. 그치만 생각해 보면 그런 기회 같은 게 그렇게 쉽게 올 리가 없잖아. 여기서는 적당히 얼버무리는 거야."
13410-278 = "(소근소근) 세리카 쨩……."
13410-283 = "아니, 기회는 직접 만드는 거야. 내가 확실하게 만들어주겠어."
13410-284 = "부탁이니까 시로코 선배는 의욕을 좀 낮춰 줘……."
13410-297 = "호시노 선배. 언젠가 기회가 되면…… 유메 회장의 이야기를 들려줘."
13410-301 = "맞아. 나도 듣고 싶어."
13410-302 = "아하하…… 그럼 저도요."
13410-303 = "응응! 듣고 싶어요!"
13410-304 = "흐음~ 그렇단 거지? 이 손에 땀을 쥐게 하는 모험담을 원하는 건가아~"
13410-305 = "그럼 가장 먼저 대 오아시스에 수영복을 입고 간 이야기부터 해주지 않으면 안 되겠구만?"
13410-306 = "뭐?! 수영복을? 대체 왜?! 어째서?"
13410-307 = "후후후. 그건 말이지……. 사실 거기엔 엄청난 이유가 숨겨져 있었거든?"
13410-311 = "[ns] \"이제 괜찮은 거야? 호시노?\""
13410-312 = "……."
13410-313 = "괜찮진 않지만…… 괜찮아."
13410-316 = "괜찮은 거야? 호시노 선배……?"
13410-317 = "그 고통과 함께 살아가는 삶은 힘들잖아……."
13410-318 = "응, 힘들어. 매일 매일 후회와 자책을 반복하며 어둠 속으로 가라앉아 가."
13410-319 = "하지만 매일 매일 지치지도 않고 그런 나에게 손을 내밀어 주는 녀석들이 있었어."
13410-320 = "이 고통이 있었기 때문에 노노미 쨩, 시로코 쨩, 아야네 쨩과 세리카 쨩…… 그리고 또 다른 시로코 쨩까지. 귀여운 후배들과 만날 수 있었어."
13410-321 = "그러니까…… 이 고통도 그 행복도 모두 나의 삶의 일부였던 거야."
13410-322 = "그러니까……"
13410-323 = "나는 이 고통 때문에 멈춰 있는 게 아니라, 이 고통과 함께 나아가지 않으면 안 돼."
13410-326 = "두 번 다시 되찾을 수 없는 소중한 것들은……?"
13410-331 = "그걸 흘러가게 두는 게 가능할까……?"
13410-334 = "아니, 시로코 쨩. 불가능해. 그건 나의 일부니까."
13410-335 = "하지만…… 두 손에 그 고통만을 움켜쥐고 있으면……"
13410-336 = "나에게 내밀어 주는 사람들의 손을 잡을 수 없게 되니까."
13410-343 = "그러니까……."
13410-344 = "그러니까 아마도……."
13410-354 = "틀렸어…… 틀렸습니다…… 여기는…… 글러 먹었어요……."
13410-355 = "애초에 말이 안 돼…… 이런 곳에서 어떤 깨달음을 얻을 수 있다는 거야……."
13410-356 = "소인은…… 잘못된 곳에 내던져진 겁니다…… 이건…… 이딴 세계는……."
13410-357 = "<게마트리아>인 이 소인에게 절대 어울리지 않는……!!"
13410-361 = "<게마트리아>라고?"
13410-362 = "……!!"
13410-370 = "히, 히이이이익-?! 주, 주, 죽음의 신……?! 어, 어떻게 여기를……?!"
13410-371 = "게마트리아는 내가 전부 죽였다. 그런데 아직 한 명이 더 남아 있었군."
13410-372 = "이, 이, 이 정체불명의 빛은……? 이 불가해한 힘은……? 나를 추격할 수 있다고……?"
13410-373 = "무, 무슨 짓을 한 거죠, 그 녀석들은……? 대체 뭘 이 세계에 불러온 겁니까……?"
13410-374 = "죽음의 비의를 찾고 있다고 했지? 그걸 스스로 깨달을 수 있게 도와줄까? 게마트리아?"
13410-375 = "히, 히이이익---!?"
13410-376 = "직접 체험해 보면 알 수 있을 테지."
13410-379 = "시, 싫어……! 싫어!! 그건……!!"
13410-380 = "그건……!!!"
13410-383 = "……. 죽이진 않겠어."
13410-384 = "원래는 죽이려고 했으나, 그러지 않겠어."
13410-385 = "꺼져라. 너의 지하로."
13410-386 = "두 번 다시 돌아오려고 하지 마라."
13410-387 = "이 아비도스 어딘가에 죽음의 신이 있다는 것을 기억해라. 지하생활자."
13410-398 = "……괴로워."
13410-399 = "괴로워…… 괴로워……. 히이익……."
13410-402 = "괴로워……. 괴로워……."
13410-403 = "……괴로워……."
13410-408 = "확인. 지하생활자와의 연결, 완전히 차단되었습니다."
13410-409 = "……. 네, 이제 지하생활자는 두 번 다시 이곳으로 올 수 없을 거예요. 선생님."
13410-410 = "[s] \"수고했어. 아로나, 프라나.\""
13410-411 = "그때 조우했던 <색채>의 힘도 이제 완전히 고갈되었습니다. 이제 두 번 다시 이 힘을 쓸 일은 없을 것입니다."
13410-412 = "그런데…… 또 다른 시로코 씨는……."
13410-413 = "확인. 스나오오카미 시로코와의 연결……."
13410-414 = "……."
13410-415 = "프라나 쨩……?"
13410-417 = "……. 스나오오카미 시로코의 연결이 완전히 차단되었습니다……."
13410-418 = "네?!"
13410-419 = "[s] \"어째서?! 무슨 일이야!?\""
13410-420 = "……. 스나오오카미 시로코 쪽에서 연결을 끊었습니다. 이것은……"
13410-424 = "작별 인사……? 자신을 찾지 말아 달라는 뜻인가요, 시로코 씨……?"
13410-427 = "아비도스 사막 어딘가"
13410-428 = "……."
13410-442 = "다음화;에필로그 1"
