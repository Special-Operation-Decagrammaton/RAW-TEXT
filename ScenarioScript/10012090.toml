[translation]
10012090-1 = "제9화;리조트 사용권의 진실"
10012090-6 = "으, 으윽……."
10012090-7 = "더는……. 무리……."
10012090-14 = "……자. 다 끝났어! 순순히 항복하시지!"
10012090-15 = "항복하신다면 저희는 더 이상 싸울 생각 없습니다."
10012090-17 = "큭……. 이런……. 이런 말도 안 되는……."
10012090-18 = "겨우 여섯 명한테 이 많은 병력이 전부 쓰러졌다고……!?"
10012090-19 = "그동안 리조트 사냥에서 연전연승해 온 우리 퐁당퐁당 헬멧단이……!?"
10012090-21 = "……연전연승?"
10012090-22 = "……리조트 사냥?"
10012090-23 = "뭔가 또 알 수 없는 이야기가 나왔네. 이번 휴양은 참 매 순간이 새로운걸."
10012090-25 = "……."
10012090-26 = "[ns] \"…….\""
10012090-28 = "[ns] \"……와카모.\""
10012090-29 = "……죄송합니다. 선생님……."
10012090-30 = "제가 부족해서……."
10012090-31 = "하지만 이 와카모, 절대 포기하지 않으니까요……! 꼭 선생님을 구해 드리겠습니다!"
10012090-32 = "조금만 더 기다려 주세요. 선생님. 제가 꼭 선생님을…….!"
10012090-33 = "[s1] \"아냐, 와카모. 그건 오해야.\"\n[s2] \"난 괜찮아, 와카모.\""
10012090-34 = "……네?"
10012090-35 = "……네?"
10012090-39 = "……오해……라니요? 그게 무슨 말씀……."
10012090-40 = "[ns3] 와카모에게 다가간다.\n[ns4] 와카모의 머리를 쓰다듬어 준다."
10012090-47 = "……!?"
10012090-48 = "서, 선생님……!?"
10012090-49 = "[s5] \"……예쁜 수영복이네, 와카모.\"\n[s6] \"와카모의 마음은, 잘 받았으니까.\""
10012090-54 = "……? ……?"
10012090-55 = "……시……."
10012090-56 = "[s] \"……시……?\""
10012090-57 = "……시……."
10012090-58 = "……실례했습니다아아아!?"
10012090-63 = "……뭐야아아아아아!?!"
10012090-65 = "…………아니."
10012090-66 = "아니! 나는 인정 못 해……. 절대로 인정 못 해!!"
10012090-67 = "이걸로 포기할 거라 생각하지 마라, 나중에 다시……! 좀 더 많은 섬을 공략하고 세력을 키워서!!"
10012090-68 = "그때에는 반드시 이곳도 내 수중에 넣고야 말겠어! 결국 시간 문제일 뿐이다!!"
10012090-69 = "반드시……. 반드시 내 손으로 '군도의 리조트를 모두 통일'해서 이곳의 지배자가 될……!!"
10012090-70 = "아니, 아니아니아니아니. 잠깐만!"
10012090-71 = "아까부터 대체 무슨 소리야? 인정 못 한다니? 뭘?"
10012090-72 = "저희는 어디까지나 세리카 쨩이 얻어온 리조트 사용권 덕택에 여기에 왔습니다만……. 리조트 군도……라는 건 또 무슨 이야기죠?"
10012090-73 = "혼자서 중얼거리지만 말고, 좀 알아듣게 설명하라고!"
10012090-78 = "하아……. 진짜냐……."
10012090-79 = "진짜 '리조트 사냥꾼'이 아니었단 말이냐……. 이런 녀석들에게 지다니, 더 자존심에 상처가 깊어지네……."
10012090-80 = "뭐, 사실 그렇대도 이상할 건 없겠지만……. 정말 아무것도 모르는 것 같으니 조금은 알려주도록 할까."
10012090-81 = "너희가 뭐라고 말해도 결국 너희는 우리의 경쟁자다. 비단 너희뿐만이 아니라……."
10012090-82 = "이곳, '군도'에 있는 녀석들은 모두가 마찬가지지. 단지 아직 그걸 깨닫지 못했을 뿐."
10012090-84 = "……뭐?"
10012090-85 = "……군도?"
10012090-86 = "경쟁자라고요……? 그게 무슨……."
10012090-87 = "아니, 아니! 정말 말귀를 못 알아듣네, 우리는 계약서가……!"
10012090-89 = "그러니까 말귀를 못 알아듣는 건 그쪽이래도!? 그 계약서라면 나도 있단 말이야!!"
10012090-90 = "자! 못 믿겠으면 직접 봐!! 이거 보라고!!"
10012090-92 = "……네!? 이, 이게 무슨……."
10012090-93 = "뭐, 뭐야!? 뭔데!? 진짜야? 진짜 우리랑 똑같은 거야……!?"
10012090-95 = "당연하지!! 애초에 너희들, 여기를 어떻게 알고 왔어? 분명 <리조트 사용권>인지 뭔지 하는 계약서를 손에 넣어서겠지?!"
10012090-97 = "……!!"
10012090-98 = "그걸 당신이 어떻게……."
10012090-99 = "어떻게고 자시고, 당연한 거지. 이 군도에 들어온 녀석들은 모두 마찬가지니까 말이야."
10012090-100 = "알겠어? 너희처럼 이 리조트를 '사용'할 권리를 가진 녀석들은……."
10012090-102 = "……이 군도 전체에 쫙 깔려있다니까!?"
10012090-105 = "뭐어어어어-!?!?"
10012090-113 = "그, 그런……! 그게 정말이야? 어서 계약서를……!"
10012090-114 = "여기 있어요. ……저 분 말대로 밑에 약관도 빽빽하게 적혀 있네요."
10012090-115 = "본 계약서의 계약자는, <로스트 파라다이스 리조트>의 '사용 권한'을 얻는다."
10012090-116 = "상기한 '사용 권한'이란 리조트의 모든 토지, 물품 및 설비 일체에 대한 권한과……."
10012090-117 = "그로 인해 창출된 모든 수익과 자원 또한 소유할 수 있는 것으로서……?"
10012090-118 = "……설마 '사용권'이라는 게 그런 뜻이었어? 진짜로? 숙박권이 아니라고?"
10012090-119 = "그렇군요. ……이제야 이해했어요. 명백한 독소 조항이네요."
10012090-120 = "섬 하나하나에 각자 계약한 것처럼 뿌려져 있기 때문에 얼핏 공정한 당첨처럼 보였지만……."
10012090-121 = "사실 이 군도 전체가…… 하나의 로스트 파라다이스 리조트였던 거예요. 사실은 모두가 똑같은 권리를 가지고 있는 거죠."
10012090-122 = "단지 여러 개의 섬으로 나뉘어 있어서, 다들 처음에는 그것을 눈치채지 못했을 뿐."
10012090-123 = "하지만 조금씩……. 지금 저분처럼 계약서의 '허점'을 깨달은 사람들이 하나둘씩 나타나 다른 곳을 공격하기 시작했고……."
10012090-124 = "지금처럼 '리조트 사냥'이 진행되고 있는 거지!! 아, 이제야 좀 상황 파악이 되는 모양이네!!"
10012090-125 = "……네. 말씀대로 서로가 서로의 섬을 자기 것이라 주장하며 싸우는 상황인 거죠."
10012090-126 = "여러분. 여기는 위험해요. 아무리 생각해도 이 계약서, 이 섬들……. 느낌이 좋지 않아요."
10012090-127 = "저희도 더 나쁜 일에 엮이기 전에 어서 여기를 빠져나가야……."
10012090-129 = "…………!!"
10012090-130 = "……. 빈틈!!"
10012090-134 = "……! 콜록, 콜록!! 으읏!?"
10012090-135 = "연막탄……!? 이런 걸 아직도 숨겨두고 있었다니……!"
10012090-136 = "다시 만나도록 하지! 그땐 지금처럼 당할 거라 기대하지 마라!!"
10012090-137 = "일어나!! 일단 퇴각이다!! 모두 퇴각!!"
10012090-138 = "으, 으응!? 아! 퇴, 퇴각!"
10012090-139 = "호버크래프트로 퇴각!!"
10012090-144 = "으음……. 가버렸네요……."
10012090-146 = "……으헤……."
10012090-148 = "……정신없는 여름이야. 정말로."
