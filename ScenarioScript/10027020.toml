[translation]
10027020-1 = "제2화;마지막 한 권"
10027020-3 = "으엑……. 하필 여기에서 이런 거랑……."
10027020-4 = "사람을 가리켜 '이런 거'라고 표현하시다니, 자칭 인기 작가 메루리 씨 다운 어휘 활용이네요. 필요하다면 다음에 단어 사전이라도 선물해 드릴까요?"
10027020-5 = "피, 필요 없어! 무엇보다 네 사전을 받으면 밤에 꿈자리가 사나울 것 같단 말이야……."
10027020-6 = "메루리 씨 치고는 수준 높은 농담이었어요. 치하해 드릴까요?"
10027020-7 = "됐거든! 거기서 굳이 '치하'라는 표현을 써서 은근슬쩍 상하관계를 집어넣는 게 너 답긴 하네!"
10027020-8 = "어머. 그 부분을 읽어내시다니 분위기를 읽는 능력이 많이 늘었군요."
10027020-10 = "……!"
10027020-11 = "……!"
10027020-17 = "[ns1] \"자, 자. 둘 다 거기까지.\"\n[ns2] \"지나친 싸움은 좋을 것 없답니다. 여러분.\""
10027020-20 = "이분은……?"
10027020-21 = "으응~? 그런가아~? 타카네 씨께서는 처음이었던가아~? 그러면 어쩔 수 없구만! 이 내가 직접 소개해 줄 수밖에!"
10027020-22 = "으, 으으으으음……! 다른 누구도 아닌 당신에게 소개받게 되다니, 이 무슨 굴욕……!"
10027020-23 = "그, 그렇지만……! 처음 뵙는 분께 직접 스스로를 소개해 달라고 말씀드리는 것도 경우에 어긋나는 일일 터……!"
10027020-24 = "그렇지~? 그렇지~? 이야아, 이거 무릎 꿇고 지금까지의 오만과 무례를 용서해 달라고 눈물로써 빌면 못 해 줄 것도 없는데 말이야~?"
10027020-29 = "적당히 하세요!"
10027020-37 = "까, 깜짝이야?! 다짜고짜 발밑에 총 쏘는 그거! 그 버릇 좀 고치라고! 게다가 그렇게 사사건건 비꼬아 대니까, 너는 늘 겉도는 거야!"
10027020-38 = "어머. 기껏 동인행사에 참가했는데도, 그 어떤 작가에게도 말을 붙이지 못한 나머지, 혼자 굳센 척 아무렇지 않아 하는 건 메루리 씨 역시 마찬가지 아닌가요?"
10027020-39 = "말했겠다! 사실이지만!"
10027020-45 = "[ns3] \"저기~\"\n[ns4] \"나 슬슬 잊히고 있지 않아~?\""
10027020-48 = "아."
10027020-49 = "어머."
10027020-50 = "으, 으음. 그러니까 말이야. 이쪽은……."
10027020-59 = "어머. 어머, 어머, 어머."
10027020-60 = "처음 뵙겠습니다. 선생님. 그 말씀으로만 듣던 샬레의 선생님을 직접 뵐 날이 올 줄은, 정말이지 꿈에서도 생각하지 못했기에."
10027020-61 = "저는 미요시 타카네라고 합니다. 출판부에 소속되어, 붉은겨울에서 출판되는 여러 작품들의 평론을 <붉은 곰>에 기고하고 있죠."
10027020-62 = "[s] \"출판부……?\""
10027020-63 = "네. 붉은겨울에서 이루어지는 각종 출판 활동, 저자 활동 등, 다양한 활동에 힘쓰는 학생들이 소속되어 있는 동아리랍니다."
10027020-64 = "자랑은 아닙니다만, 저 또한 한 명의 평론가로서, 붉은겨울에서 출간되는 책들을 전부 읽어보며 평론을 하고 있답니다."
10027020-65 = "자랑이 아니라면서 자랑은 다 하고 있잖아……."
10027020-66 = "후후, 다음에 시간이 되신다면 한 번 저희 출판부에도 들러주시길."
10027020-67 = "무시하는 거냐! 그렇다고 할까, 일단 이 자리에서 선생과 선약이 있는 건 내 쪽인데?!"
10027020-68 = "그것참 드문 일이군요. 세상이 두 쪽 나도 작업실에 틀어박히기를 선택하는 것이 메루리 씨라고 생각했는데, 이렇게 몸소 여기까지 발걸음을 내딛다니요."
10027020-69 = "어…… 뭐, 나도 가끔은 현장 시찰이라고 할까, 그런 거 한다고……."
10027020-70 = "그것도 재미있는 말이로군요. 보통 그런 일은 함께 계시는 분에게 부탁하시지 않으신지……?"
10027020-71 = "어머. 그런데 정작 그분이 보이지 않는군요."
10027020-73 = "모미지 씨는 어디에 계시죠?"
10027020-74 = "어……? 그, 그게……! 지금은 조금, 다른 곳에 있어……"
10027020-76 = "……흐음? 그건 이상하네요. 다른 곳도 아닌 이곳에 당신이 와 있는데, 모미지 씨가 같이 오지 않는 것은 비상식적인 일이예요."
10027020-77 = "……."
10027020-78 = "어떻게 된 거죠, 메루리 씨? 평소 뻔뻔함이 지나쳐서 시끄럽기까지 한 당신의 모습과는 너무나 거리가 있는데요?"
10027020-79 = "아, 이것은 드물게도 제가 당신을, 걱정하는 것은 아니고, 벌새의 발톱 끝만큼이라도 생각해서 한 말이에요. 감사하도록 하세요."
10027020-80 = "아뇨. 역시 감사하지 마세요. 그건 어딘가 기분이 나쁘군요."
10027020-81 = "둘 중 하나만 하라고! 정말이지 귀찮다니까……."
10027020-82 = "[s5] \"있잖아. 붉은겨울에서 나오는 책은\"\n[s6] \"전부 읽어 봤다고 했지?\""
10027020-85 = "네. 다시 말씀드리지만, 자랑은 아니랍니다."
10027020-86 = "그러니까 그거, 자랑이 아닌 게……."
10027020-87 = "[s] \"그러면…… <루나>에 대해서도 알고 있어?\""
10027020-88 = "<루나> 말씀이신가요……?"
10027020-89 = "일단 알고 있느냐, 알고 있지 않느냐로 물으신다면, 그거야 당연히 알고 있답니다."
10027020-90 = "단지, 선생님과…… 메루리 씨가, <루나>에 대해 관심을 보이는 이유가 갑자기 궁금해지는군요."
10027020-91 = "[s] \"우린 <루나>의 마지막 권을 찾고 있어.\""
10027020-93 = "<루나>를요? 그것도, 마지막 권을……?"
10027020-103 = "……그렇군요. 모미지 씨는 그렇게 도서관을 나가 어딘가로 모습을 감췄고……"
10027020-104 = "……"
10027020-105 = "언젠가는 그럴 줄 알았답니다, 메루리 씨."
10027020-106 = "뭐, 뭐가!"
10027020-107 = "평소 당신의 인망을 돌아보세요. 이런 일이 이제서야 터졌다는 게 오히려 놀랍기만 하네요."
10027020-108 = "인망이라고 했냐! 말 잘했어. 그건 너도 마찬가지잖아! 맨날 어려운 평론만 하고, 말을 빙빙 돌리니까 알아듣는 사람이 없지!"
10027020-109 = "평론에는 형식이 필요한 법이거든요? 다른 사람들이 보지 못한 관점을 짚어, 작품의 새로운 가치를 발견하는 것이 평론이죠. 그 정도는 슬슬 이해하세요!"
10027020-110 = "헹! 창작자 없이는 평론가도 없는 법이라고!"
10027020-111 = "좋은 평론은 작품을 더욱 빛나게 한다고요! 독자가 없는 작품이라는 게 존재할 수 있나요?"
10027020-113 = "그런 건 붉은겨울에 널렸거든? 체리노 회장 선전물이라던가!"
10027020-114 = "그건 그래요!"
10027020-119 = "[ns7] \"자, 자. 둘 다 그만. 그만.\"\n[ns8] \"<루나>의 마지막 권 이야기로 돌아가고 싶은데.\""
10027020-122 = "아, 그랬지……."
10027020-123 = "……."
10027020-124 = "사정은 잘 알았어요. 선생님."
10027020-125 = "선생님께서 왜 저런 식으로 사회성은 요만큼도 없는 데다, 밖으로 나온 것조차 신기하기 짝이 없는 생물을 도우려고 하는 것인지도 말이죠."
10027020-126 = "이젠 야생동물 취급이냐……."
10027020-127 = "그렇지만 결론부터 말씀드리자면. 선생님."
10027020-128 = "……<루나>의 완결권인 22권에는 굉장히 복잡한 사정이 얽혀 있어요."
10027020-129 = "적어도 어느 누구 씨가 찾아야지. 라고 마음먹었다고 바로 찾을 수 있는 물건은 아니지요."
10027020-130 = "무슨 뜬구름 잡는 소리를 하는 거야?"
10027020-131 = "그리고, 조금 전부터 <루나>에 대해 뭔가 잘 알고 있다는 듯이 구는데. 혹시 너도 <루나> 수집 중이야? 그래서 우리를 견제하는 거고?"
10027020-132 = "질문을 한 번에 몰아서 하지 마세요. 대화에는 순번이 있다는 것도 모르시나요?"
10027020-133 = "……."
10027020-134 = "여기부터는 메루리 씨에게 이야기하도록 하죠."
10027020-135 = "출판부를 찾아가 보세요."
10027020-136 = "엥? 출판부? 거기는 왜?"
10027020-137 = "<루나> 22권에 대한 단서는, 거기에 남겨져 있을 것이기 때문이에요."
10027020-138 = "당신이 진정으로 누군가를 위해 22권을 찾고자 하는 것이라면……"
10027020-139 = "……에 도달하는 것도 가능하겠지요."
10027020-140 = "……응?"
10027020-142 = "그럼 저는 이만. 다음에 기회가 된다면 다시 뵙도록 하지요. [USERNAME] 선생님."
10027020-143 = "……메루리 씨는 빼고요."
10027020-144 = "그러니까 한 마디가 더 많다고!"
10027020-150 = "저기, 자, 잠깐?!"
