[translation]
10008135-2 = "……결국 알바비는 못 받게 되었어."
10008135-3 = "[s] \"행사장의 관리인이 선도부에게 잡혀갔으니, 뭐…….\""
10008135-4 = "으으……! 하아……. 뭐, 어쩔 수 없지."
10008135-5 = "아르바이트를 하다 보면 이런 일이야 다반사고……."
10008135-6 = "[s] \"다반사야?!\""
10008135-10 = "나도 나지만, 저 녀석들도 제법 실망이 큰 모양이고 말이야."
10008135-15 = "하, 하하……. 후후……. 전부…… 전부 끝나버렸어……."
10008135-16 = "아, 저, 저기……."
10008135-17 = "……하아. 대소동이었네."
10008135-18 = "결국…… 우린 새해 첫날부터 뭘 한 거지……?"
10008135-19 = "어, 그, 그게, 그러니까……."
10008135-21 = "그런 건 됐잖아. 아루 쨩!"
10008135-22 = "[s] \"무, 무츠키?\""
10008135-23 = "쿠흐흣~ 뭐, 나는 나름대로 재미있었으니까. 허무하다거나 하진 않은걸~?"
10008135-24 = "앞으로도 기억에 계속 남을 것 같은 멋진 이벤트였다니까~ 정말 재미있었어!"
10008135-25 = "하, 하지만 소원이……. 으으으……."
10008135-26 = "소원이라고 하니 말이지만. 그러고 보니 무츠키, 아직 소원을 빌지 않았었지?"
10008135-27 = "어? 맞다. 그랬었네~"
10008135-28 = "그럼 지금이라도 빌어두면 어때? 마침 여기 새전함도 있고."
10008135-29 = "으음~!"
10008135-30 = "그렇다면! 좋아!"
10008135-31 = "이렇게 된 거! 다 같이 빌자!"
10008135-32 = "여기! 장난감 지폐라면 마침 딱 사람 수만큼 가지고 있으니까!"
10008135-33 = "으, 응?"
10008135-34 = "어, 엇, 괘, 괜찮을까요?"
10008135-36 = "괜찮아. 괜찮아."
10008135-44 = "자! 선생님도 여기!"
10008135-45 = "이걸로 새해 소원을 빌자구~!"
10008135-46 = "아! 물론 아까랑 다르게 완전히 새로운 소원을 비는 거야!"
10008135-47 = "새로운 마음으로! 새로운 소원을! 알았지?"
10008135-53 = "으, 음……."
10008135-54 = "……뭐, 상관없겠지."
10008135-55 = "[s] \"응.\""
10008135-57 = "그럼! 지금이야!"
10008135-66 = "자, 소원 빌기 끝!"
10008135-67 = "[s] \"응? 벌써……?\""
10008135-70 = "쿠흐흣, 이런 건 빨리 끝내는 사람이 이기는 거라구? 선생님."
10008135-71 = "하아……. 뭐, 승리나 패배 조건은 잘 모르겠지만."
10008135-72 = "흐, 흠. 그런데 선생님, 혹시 어떤 소원을 빌었어?"
10008135-73 = "[s] \"아, 그거라면 아직…….\""
10008135-74 = "쉿! 아루 쨩! 소원이란 건 원래 남에게 말하면 효과가 사라지는 법이라고?"
10008135-75 = "아루 쨩도 그러고 싶진 않잖아?"
10008135-76 = "……그건 그렇지만."
10008135-77 = "결국 오늘 하루도 정말 엉망진창이었네. 그래서 그런지……."
10008135-81 = "죄, 죄송합니다! 제 배꼽시계가 멋대로 울어서, 그, 죄, 죄송……!"
10008135-82 = "아하핫~! 마침 다들 배가 고픈 참이고……."
10008135-83 = "그래! 선생님에게 맛있는 거 사달라고 하자!"
10008135-84 = "그거 좋은 아이디어야! 채용하겠어."
10008135-85 = "뭐, 나도 찬성."
10008135-86 = "……오늘 하루 종일 고생한 보상으로 선생님이 쏘는 밥이라면, 뭐, 괜찮을지도."
10008135-87 = "[s] \"……거부권은 없는 거겠죠?\""
10008135-89 = "흥! 물론이지. 선생님. 모처럼 다 같이 한바탕 고생을 했으니까 말이야."
10008135-90 = "응! 그럼 가자!"
10008135-91 = "뭘 먹을까……."
10008135-93 = "하핫."
10008135-94 = "저, 저는 역시 아루 님과 먹는 거라면 라멘을……!"
10008135-97 = "(그렇게 키보토스엔 새로운 한 해가 찾아왔다.)"
10008135-102 = "[ns] (남에게는 말할 수 없는, 올해의 소원이라면…….)"
10008135-107 = "[ns] 올해, 반드시 이루어졌으면 하는 소원을 빈다."
10008135-108 = "신춘광상곡 제68번"
