[translation]
90000080-1 = "제9화;수색 작전"
90000080-3 = "부장, <케테르>의 이동이 포착되었어. 여기로 오고 있어."
90000080-4 = "3분 후 조우하게 돼."
90000080-5 = "그 루트도 데드엔드군요……"
90000080-6 = "응. 어느 루트로 진입해도 반드시 케테르가 막아서고 있어."
90000080-7 = "이 녀석을 따돌리는 건 애초에 불가능한 일일 지도 몰라……."
90000080-8 = "<폐허수몰지구>의 수색…… 생각보다 시간이 더 걸릴지도……."
90000080-9 = "숨바꼭질은 나름 자신있었는데……. 어쩔 수 없네요."
90000080-10 = "선생님, 일단 에이미와 함께 퇴각해주세요. 저는 다음 방법을 고민해보겠습니다."
90000080-11 = "[s] \"알겠어.\""
