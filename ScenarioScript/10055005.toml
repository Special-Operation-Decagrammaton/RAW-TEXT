10055005-66 = "3;이부키;15;치~즈~ 히히! 어때? 이부키 잘 보여?\n#3;em;[음표]\n#3;closeup"
10055005-67 = "3;이부키;15\n#na;치아키;네! 엄청 잘 보여요! 마코토 선배의 현란한 장광설에 이은 이부키 쨩의 귀여움 공세! 오늘도 만마전의 전력은 무시무시하군요!\n#3;closeup"
