10055005-25 = "3;마코토;00\n#na;치아키;아핫! 처음에 말씀드리긴 했는데요~ 다시 찍을까요?"
10055005-26 = "3;마코토;25;아니, 사소한 것은 아무래도 좋다! 우리 수준의 거물들이라면 말이야, 키키킷!\n#3;em;[재잘]"
