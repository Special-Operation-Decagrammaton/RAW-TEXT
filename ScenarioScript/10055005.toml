[translation]
10055005-1 = "プロローグ;キャスト・ガール・アウェイ"
10055005-3 = "（蒸し暑さが続く、とある夏の日……）"
10055005-4 = ""
10055005-7 = "（[ruby=パンデモニウム・ソサエティー]万魔殿から1通[/ruby]のビデオレターが届いた）"
10055005-13 = ""
10055005-14 = "……。"
10055005-15 = ""
10055005-17 = ""
10055005-18 = "…………。"
10055005-20 = "マコトせんぱーい？#n無言はちょっと……。"
10055005-21 = ""
10055005-23 = ""
10055005-24 = "ん？ああ、もう回っているのか。"
10055005-25 = "さっき声かけましたよ？#nやり直します？"
10055005-26 = "いや、構わん。#nこの程度、どうということはない！キキッ！"
10055005-27 = ""
10055005-29 = ""
10055005-30 = "――先生よ、喜ぶがいい！"
10055005-31 = "今年の夏は酷暑が続いていて、先生も頭を悩ませていただろう？#nだが、このマコト様に任せれば良い！"
10055005-32 = "先日――契約が無事成立してな。この栄光ある旅に先生も参加できることとなったのだ！キキキッ！"
10055005-33 = "嬉しいだろう？きっと、驚いて腰を抜かしていることだろう。"
10055005-34 = "……しかしビデオメッセージゆえに、顔を見れないのが残念だ。"
10055005-35 = ""
10055005-37 = ""
10055005-38 = "まぁ、だいたい想像つきますけどね。"
10055005-39 = "マコト先輩、そろそろ本題に入ってください。"
10055005-40 = "キキキッ！言わずとも、先生なら当然把握していることだろう――"
10055005-41 = ""
10055005-45 = "マコト先輩たち何のお話してるのー？"
10055005-46 = ""
10055005-48 = ""
10055005-49 = "あっ、イブキちゃん！"
10055005-50 = ""
10055005-54 = ""
10055005-55 = "先生にビデオレター？イブキもお話する！"
10055005-56 = "イブキちゃんこっち来て！#nはい、チーズ！"
10055005-57 = ""
10055005-60 = ""
10055005-62 = ""
10055005-64 = ""
10055005-66 = "チーズっ！えへへっ！どう？イブキ映ってる？"
10055005-67 = "はい、バッチリ！#n今日も万魔殿は絶好調です！"
10055005-68 = "あ、そうだ先生！#nイブキたちとの旅行の準備はちゃんとしてる？"
10055005-69 = "歯ブラシと歯磨き粉と……水着とパジャマと――"
10055005-70 = "あ！おやつも忘れないようにね！おやつは300円までです！#nはい、イブキと約束！"
10055005-71 = ""
10055005-73 = ""
10055005-74 = ""
10055005-75 = ""
10055005-76 = ""
10055005-77 = "キキキッ！イブキ偉いぞ！完璧な説明だ！"
10055005-78 = "……というわけだ。#nこの夏、我々は豪華客船を貸し切り――超豪華なクルーズ旅行を予定している！"
10055005-79 = "風紀委員の連中が地獄の合宿で汗水流している間、我々は優雅に超超超超豪華旅行を楽しむというわけだ！"
10055005-80 = "そして先生を招待し――風紀委員会との格の違いを見せつけてやろう！キキキキッ！"
10055005-81 = ""
10055005-83 = ""
10055005-85 = "はぁ……そんなことをして何の意味があるんですか。"
10055005-86 = ""
10055005-88 = ""
10055005-89 = ""
10055005-90 = "とりあえず、数泊はする予定ですので。#n来る時は連絡してください。"
10055005-91 = ""
10055005-98 = "[ns1] （夏のバカンス……もうそんな時期）\n[ns2] （せっかく誘ってくれたし……行こうかな）"
10055005-103 = "（そうして、しばし日常を離れ――ロマンチックな船旅へと向かった）"
10055005-109 = "[log]漂 流  7 日 目[/log]"
10055005-113 = ""
10055005-114 = "みっ……みずぅ……！"
10055005-115 = ""
10055005-117 = ""
10055005-119 = "[ns3] \"マコト！！気をしっかり！マコトぉ――っ！！\"\n[ns4] \"ど、どうしてこんなことに……！！！\""
10055005-123 = "（……事の起こりは7日前）"
