[translation]
10055005-1 = "프롤로그;캐스트 걸 어웨이"
10055005-3 = "(어느 무더위가 이어지는 여름날…….)"
10055005-7 = "(만마전으로부터 한 통의 영상 메시지가 도착했다.)"
10055005-14 = "……."
10055005-18 = "…………."
10055005-20 = "저기~ 마코토 선배애~? 아무 말이나 해주세요~"
10055005-24 = "응? 뭐야, 찍고 있었나?"
10055005-25 = "아핫! 처음에 말씀드리긴 했는데요~ 다시 찍을까요?"
10055005-26 = "아니, 사소한 것은 아무래도 좋다! 우리 수준의 거물들이라면 말이야, 키키킷!"
10055005-30 = "자, 선생이여, 기뻐하도록 하라!"
10055005-31 = "기다리는 시간 동안 여러 생각을 했겠지. 어쩌면 이번 여름은 어렵지 않을까? 그렇지만 마코토 님이라면 어떻게든 해주지 않을까?"
10055005-32 = "그 생각대로! 염려하지 마라! 계약은 막 성사되었다! 그리고 이 영광의 자리에, 선생도 초청하기로 막 결정한 참이다! 키키킥!"
10055005-33 = "……아무래도 영상 메시지라 표정을 볼 수 없는 게 아쉽군."
10055005-34 = "제아무리 선생이라 해도 틀림없이 놀라 자빠졌을 테지. 아니면 기쁨에 눈물겨워 하고 있을지도……?"
10055005-38 = "지금 선생님 표정이라면 대강 짐작 가는데요."
10055005-39 = "보나 마나 뭔 말인지 하나도 모르겠다는 표정이시겠죠. 마코토 선배, 아직까지 무슨 용건인지 한마디도 안 했거든요?"
10055005-40 = "키키키킷! 무슨 말을 하나 했더니, 소인배스러운 말을 하는구나. 말하지 않아도 선생이라면 지금쯤 내막을 전부 파악하고 있을……."
10055005-45 = "응? 뭐야? 뭐야?"
10055005-49 = "앗, 이부키 쨩!"
10055005-55 = "선생님한테 영상 편지 보내는 거야? 이부키도 찍을래!"
10055005-56 = "좋아요! 이부키 쨩! 여기 봐요! 치~즈!"
10055005-66 = "치~즈~ 히히! 어때? 이부키 잘 보여?"
10055005-67 = "네! 엄청 잘 보여요! 마코토 선배의 현란한 장광설에 이은 이부키 쨩의 귀여움 공세! 오늘도 만마전의 전력은 무시무시하군요!"
10055005-68 = "아! 맞다! 선생님! 우리 선생님이랑 여행 가기로 했다?"
10055005-69 = "칫솔이랑 치약이랑~ 그리고, 또~ 수영복이랑~ 또~ 잠옷이랑~"
10055005-70 = "배고프면 먹을 간식도 까먹지 말고 챙겨와야 해~ 잊지 말고, 이부키랑 약속~!"
10055005-77 = "키키킷! 역시 이부키! 명철하고 명료한 설명이다! 장하구나!"
10055005-78 = "……아무튼, 그렇게 된 거다, 선생. 올여름 우리 만마전은 크루즈 대절해, 초호화 크루즈 여행을 떠날 예정이다!"
10055005-79 = "얄미운 선도부 놈들이 지옥 합숙으로 땀을 뻘뻘 흘리는 동안, 우리는 여유롭게 초초초호화 여행을 즐기는 거지!"
10055005-80 = "거기에 우리 여행에 선생을 초대하는 도량까지 베풂으로써, 선도부 놈들에게 격과 그릇의 차이를 뼈저리게 느끼게 하는 계획이다! 키키키킷~!"
10055005-85 = "뭐…… 그릇 차이라면 확실히 느껴질지도."
10055005-90 = "아무튼, 최소 몇 박은 할 예정이니 오신다면 미리 연락 주세요."
10055005-98 = "[ns1] (여름 바캉스라…… 벌써 그런 시기인가.)\n[ns2] (딱히 계획도 없었고, 모처럼 초대받았으니 가볼까.)"
10055005-103 = "(……그렇게 잠시간 일상에서 벗어나, 낭만적인 선상 여행을 떠나기로 했다.)"
10055005-109 = "[log]표 류  7 일 차[/log]"
10055005-114 = "물…… 무울……!"
10055005-119 = "[ns3] \"마코토!!! 정신 차려, 마코토오!!!\"\n[ns4] \"어째서 이런 비극이……!!!\""
10055005-123 = "(……모든 사건은 7일 전에 시작했다.)"
