[translation]
10055005-1 = "บทเริ่มต้น;Cast Girl Away"
10055005-3 = "(วันหนึ่งในฤดูร้อนที่อากาศร้อนอบอ้าว...)"
10055005-4 = ""
10055005-7 = "(คุณครูได้รับวิดีโอข้อความจากแพนเดโมเนียม โซไซตี้)"
10055005-13 = ""
10055005-14 = "......"
10055005-15 = ""
10055005-17 = ""
10055005-18 = "........."
10055005-20 = "นี่~ รุ่นพี่มาโคโตะ... พูดอะไรสักหน่อยสิคะ~"
10055005-21 = ""
10055005-23 = ""
10055005-24 = "หืม? อะไรกัน นี่ถ่ายอยู่หรอกเหรอ?"
10055005-25 = "อะฮ่า! ฉันบอกไปตั้งแต่แรกแล้วนะคะ~ ให้เริ่มถ่ายใหม่มั้ยคะ?"
10055005-26 = "ไม่ต้อง เรื่องเล็กน้อยพวกนั้นน่ะช่างมันเถอะ! สำหรับคนใหญ่คนโตระดับเราน่ะนะ คิกคิกคิก!"
10055005-27 = ""
10055005-29 = ""
10055005-30 = "เอาละ ครูเอ๋ย จงดีใจเสียเถอะ!"
10055005-31 = "ระหว่างที่รอฟังคงคิดไปต่างๆ นานาแล้วสินะ แต่ก็เอาเถอะ ฤดูร้อนนี้คงจะลำบากใช่หรือเปล่า แต่เรื่องพวกนั้นน่ะ ถ้าเป็นท่านมาโคโตะผู้นี้ก็คงจัดการให้ได้อยู่แล้ว ใช่มั้ยล่ะ?"
10055005-32 = "เป็นไปตามที่คิดเลย! ไม่ต้องกังวลไป! เราทำสัญญากันเสร็จเรียบร้อยแล้วละ! และเราก็เพิ่งตัดสินใจว่าจะเชิญครูมาร่วมในโอกาสอันทรงเกียรตินี้ด้วย! คิกคิกคิก!"
10055005-33 = "น่าเสียดายนะที่นี่เป็นวิดีโอข้อความ... เราเลยไม่ได้เห็นสีหน้าของครู"
10055005-34 = "ถึงจะเป็นครูก็อาจจะตกใจจนหงายหลัง หรืออาจกำลังปลื้มปริ่มน้ำตาไหลพรากอยู่ก็ได้...?"
10055005-35 = ""
10055005-37 = ""
10055005-38 = "ฉันพอจะเดาสีหน้าของคุณครูตอนนี้ได้นะคะ"
10055005-39 = "คงจะทำหน้างงๆ ไม่เข้าใจว่ารุ่นพี่พูดเรื่องอะไรอยู่แน่ๆ ก็รุ่นพี่ยังไม่ได้บอกเลยนี่คะว่ามีธุระอะไรน่ะ?"
10055005-40 = "คิกคิกคิก! นึกว่าจะพูดอะไร ที่แท้ก็พูดจาแบบคนใจแคบนี่เอง ถึงเราไม่พูด ครูก็คงเข้าใจเรื่องทั้งหมด#nอยู่แล้ว..."
10055005-41 = ""
10055005-45 = "หืม? อะไรน่ะ? มีอะไรเหรอ?"
10055005-46 = ""
10055005-48 = ""
10055005-49 = "อ๊ะ อิบูกิจัง!"
10055005-50 = ""
10055005-54 = ""
10055005-55 = "อัดคลิปส่งให้คุณครูเหรอ? อิบูกิก็อยากถ่ายด้วยเหมือนกัน!"
10055005-56 = "ได้เลยค่ะ อิบูกิจัง! มองทางนี้นะ! ชีส~!"
10055005-57 = ""
10055005-60 = ""
10055005-62 = ""
10055005-64 = ""
10055005-66 = "ชีส~ ฮิฮิ! เป็นไงบ้าง? เห็นอิบูกิชัดมั้ย?"
10055005-67 = "ค่ะ! เห็นชัดเลยค่ะ! หลังรุ่นพี่มาโคโตะรัวสุนทรพจน์ยาวเหยียด ก็ถึงคราวอิบูกิจังใช้ความน่ารักบุก! วันนี้พลังรบของแพนเดโมเนียม โซไซตี้ก็น่ากลัวเหมือนเดิมเลยค่ะ!"
10055005-68 = "อ๊ะ! จริงด้วย คุณครู! พวกเราตกลงกันว่าจะไปเที่ยวกับคุณครูด้วยละ!"
10055005-69 = "เอาแปรงสีฟันกับยาสีฟัน~ แล้วก็... ชุดว่ายน้ำ~ แล้วก็... ชุดนอนไปด้วย~"
10055005-70 = "อย่าลืมเอาขนมไว้กินตอนหิวมาด้วยนะ~ ห้ามลืมล่ะ สัญญากับอิบูกิแล้วนะ~!"
10055005-71 = ""
10055005-73 = ""
10055005-74 = ""
10055005-75 = ""
10055005-76 = ""
10055005-77 = "คิกคิกคิก! สมกับเป็นอิบูกิจริงๆ! อธิบายได้เฉียบแหลมและชัดเจนที่สุด! แน่มาก เก่งจริงๆ!"
10055005-78 = "เอาเป็นว่าตามนั้นนะ ครู... ฤดูร้อนนี้แพนเดโมเนียม โซไซตี้ของเราจะเหมาเรือสำราญสุดหรู#nออกท่องเที่ยว!"
10055005-79 = "ระหว่างที่พวกคณะกรรมการวินัยน่าหงุดหงิดไปทรมานอยู่ในแคมป์ฝึกนรก พวกเราก็จะไปเพลิดเพลินกับทริปสุดหรูอย่างสบายใจกัน!"
10055005-80 = "แถมเรายังใจกว้างเชิญครูมาร่วมทริป เพื่อให้เจ้าพวกคณะกรรมการวินัยได้ตระหนักถึงความต่างของ#nชั้นเชิงและความใจกว้างของเราด้วยยังไงล่ะ! คิกคิกคิก~!"
10055005-81 = ""
10055005-83 = ""
10055005-85 = "อืม... ถ้าเป็นความใจกว้างละก็สัมผัสได้ชัดเจนจริงๆ ค่ะ"
10055005-86 = ""
10055005-88 = ""
10055005-89 = ""
10055005-90 = "เอาเป็นว่าคงไปค้างข้างนอกหลายคืน ถ้าจะมาก็รบกวนบอกล่วงหน้าด้วยนะคะ"
10055005-91 = ""
