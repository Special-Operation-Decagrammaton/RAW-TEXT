10055005-37 = "3;이로하;06\n#3;em;[한숨]\n#3;h\n#wait;1200"
10055005-38 = "3;이로하;00;지금 선생님 표정이라면 대강 짐작 가는데요."
10055005-39 = "3;이로하;02;보나 마나 뭔 말인지 하나도 모르겠다는 표정이시겠죠. 마코토 선배, 아직까지 무슨 용건인지 한마디도 안 했거든요?"
10055005-40 = "3;마코토;17;키키키킷! 무슨 말을 하나 했더니, 소인배스러운 말을 하는구나. 말하지 않아도 선생이라면 지금쯤 내막을 전부 파악하고 있을…….\n#3;em;[재잘]"
