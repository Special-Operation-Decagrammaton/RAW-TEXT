[translation]
10055005-1 = "序幕;Cast Girl Away"
10055005-3 = "（某個酷暑持續的夏日……）"
10055005-4 = ""
10055005-7 = "（萬魔殿寄來了一則影片訊息）"
10055005-13 = ""
10055005-14 = "……"
10055005-15 = ""
10055005-17 = ""
10055005-18 = "…………"
10055005-20 = "那個～真琴前輩～？隨便說點什麼吧～"
10055005-21 = ""
10055005-23 = ""
10055005-24 = "嗯？什麼，已經在錄了嗎？"
10055005-25 = "啊哈！我一開始就說過了啊～要重錄嗎？"
10055005-26 = "不必，像我們這種等級的大人物，才不會介意這種小事！嘻嘻！"
10055005-27 = ""
10055005-29 = ""
10055005-30 = "好了，老師啊，高興吧！"
10055005-31 = "等待的這段時間，你應該想了很多吧。#n今年夏天會不會很難熬？如果是真琴大人的話，一定有辦法吧？"
10055005-32 = "正如你所想！不必擔心！契約剛剛談成了！#n而且我剛剛決定，也要邀請老師參加這場榮耀的盛會！嘻嘻！"
10055005-33 = "……可惜這是影片訊息，看不到你的表情啊。"
10055005-34 = "就算是老師，肯定也嚇得腿軟了吧。又或者，正高興得熱淚盈眶也說不定……？"
10055005-35 = ""
10055005-37 = ""
10055005-38 = "老師現在的表情，我大概猜得到。"
10055005-39 = "想必是一臉完全聽不懂在說什麼的表情吧。#n真琴前輩，你到現在都還沒說是什麼事哦？"
10055005-40 = "嘻嘻嘻！我還以為你要說什麼，真是小家子氣的發言。#n就算不說，老師現在應該也早就掌握了所有內情……"
10055005-41 = ""
10055005-45 = "嗯？什麼？什麼？"
10055005-46 = ""
10055005-48 = ""
10055005-49 = "啊，伊吹醬！"
10055005-50 = ""
10055005-54 = ""
10055005-55 = "在寄影片信給老師嗎？伊吹也要錄！"
10055005-56 = "好啊！伊吹醬！看這邊！笑一個～！"
10055005-57 = ""
10055005-60 = ""
10055005-62 = ""
10055005-64 = ""
10055005-66 = "笑一個～耶嘿嘿！怎麼樣？伊吹有拍清楚嗎？"
10055005-67 = "有！拍得超清楚！真琴前輩華麗的長篇大論，接著是伊吹醬的可愛攻勢！#n今天萬魔殿的戰力也好驚人呢！"
10055005-68 = "啊！對了！老師！我們要跟老師一起去旅行哦？"
10055005-69 = "牙刷和牙膏～還有，還有～泳裝～還有～睡衣～"
10055005-70 = "肚子餓的時候要吃的點心也別忘了帶哦～不可以忘記，跟伊吹約好了～！"
10055005-71 = ""
10055005-73 = ""
10055005-74 = ""
10055005-75 = ""
10055005-76 = ""
10055005-77 = "嘻嘻！真不愧是伊吹！說明得清楚又明瞭！真了不起！"
10055005-78 = "……總之，就是這麼回事，老師。#n今年夏天，我們萬魔殿將包下郵輪，展開超豪華郵輪之旅！"
10055005-79 = "在那些討厭的風紀委員們參加地獄集訓、揮汗如雨的時候，#n我們就悠哉地享受超超超豪華旅行！"
10055005-80 = "再加上展現出邀請老師一同旅行的氣度，#n讓風紀委員會那群傢伙深刻體會到格局與器量的差距！嘻嘻嘻嘻～！"
10055005-81 = ""
10055005-83 = ""
10055005-85 = "嗯……要說器量的差距，或許確實感受得到吧。"
10055005-86 = ""
10055005-88 = ""
10055005-89 = ""
10055005-90 = "總之，預計至少會住上幾晚，如果要來的話請事先聯絡。"
10055005-91 = ""
10055005-98 = "[ns1] （夏日渡假啊……已經到這個時候了嗎）\n[ns2] （反正也沒什麼計畫，難得受到邀請就去看看吧）"
10055005-103 = "（……就這樣暫時脫離日常，踏上了浪漫的海上旅程）"
10055005-109 = "[log]漂 流  第 7 天[/log]"
10055005-113 = ""
10055005-114 = "水……水……！"
10055005-115 = ""
10055005-117 = ""
10055005-119 = "[ns3] 「真琴！！！振作一點，真琴～！！！」\n[ns4] 「怎麼會發生這種悲劇……！！！」"
10055005-123 = "（……一切都要從7天前說起）"
