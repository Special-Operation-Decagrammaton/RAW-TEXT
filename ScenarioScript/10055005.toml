[translation]
10055005-1 = "Prologue;Castaway Girl"
10055005-3 = "On a hot, sweltering summer day..."
10055005-4 = ""
10055005-7 = "...I received a video message from the Pandemonium Society."
10055005-13 = ""
10055005-14 = "..."
10055005-15 = ""
10055005-17 = ""
10055005-18 = "..."
10055005-20 = "Um, Makoto? That's your cue!"
10055005-21 = ""
10055005-23 = ""
10055005-24 = "Eh? What? Were you already recording?"
10055005-25 = "Ahaha! I told you to start when I said \"Action!\" We can do another take—"
10055005-26 = "No! When you reach my level of stardom, there's no such thing as a second take! Kihehe!"
10055005-27 = ""
10055005-29 = ""
10055005-30 = "Now then, Sensei, rejoice!"
10055005-31 = "Your mind, of course, has been heavy with anticipation for the summer. Another season of heat, sweat, and suffering. But you already knew that the Great Makoto always has the answer, didn't you?"
10055005-32 = "And of course, you were right to think so! The ink has just dried on the deal that will save us from our suffering! And I am graciously extending you an invitation to bear witness to this glorious event!"
10055005-33 = "...Next time, make this live, so I can see Sensei's reactions."
10055005-34 = "Well, anyway, I'm sure you fainted in shock! Or cried out of joy!"
10055005-35 = ""
10055005-37 = ""
10055005-38 = "I can already imagine what their expression is right now."
10055005-39 = "They're probably just confused. You haven't even explained yet, Makoto."
10055005-40 = "Kihehe! I expected such small-minded thinking from everyone else besides me! But I know that Sensei has already deduced the entire situation without me saying a word!"
10055005-41 = ""
10055005-45 = "Hmmm? What'cha all doing?"
10055005-46 = ""
10055005-48 = ""
10055005-49 = "Oh, Ibuki!"
10055005-50 = ""
10055005-54 = ""
10055005-55 = "You're making Sensei a video message? Ibuki wants to be in it!"
10055005-56 = "That's a given! Look over here and say \"cheese,\" Ibuki!"
10055005-57 = ""
10055005-60 = ""
10055005-62 = ""
10055005-64 = ""
10055005-66 = "CHEEEESE! Ibuki wants to see! Did it come out good?"
10055005-67 = "Yep! Crystal clear! First it was Makoto's dazzling speech, and now we're featuring Ibuki's irresistible cuteness! The Pandemonium Society is out in full force today!"
10055005-68 = "Ah, Sensei! Sensei! Don't forget about our trip, 'kay?"
10055005-69 = "You gotta pack your toothbrush and toothpaste...and your swimsuit...and your pajamas..."
10055005-70 = "Oooh, and snacks! For when you get hungry! Pinky promise you won't forget, Sensei!"
10055005-71 = ""
10055005-73 = ""
10055005-74 = ""
10055005-75 = ""
10055005-76 = ""
10055005-77 = "Kihehe! That's our Ibuki! A clear and brilliant explanation! Well done!"
10055005-78 = "...Therefore, these are the current circumstances. The Pandemonium Society is chartering a luxury cruise ship and taking an extravagant trip for summer break!"
10055005-79 = "While those insufferable Prefect Team fools sweat through their hellish boot camp, we'll be relaxing on an ultra-luxurious getaway!"
10055005-80 = "And by graciously inviting you along, we'll make the Prefect Team painfully aware of the difference in our class and generosity! Kiheheheh!"
10055005-81 = ""
10055005-83 = ""
10055005-85 = "It does speak to a difference in character, that's for sure."
10055005-86 = ""
10055005-88 = ""
10055005-89 = ""
10055005-90 = "Anyway, the trip will be a few nights long, so just give me a heads-up if you want to come."
10055005-91 = ""
10055005-98 = "[ns1] \"(A summer vacation... Is it already that time of year?)\"\n[ns2] \"(I didn't have any plans, and they went out of their way to invite me. Maybe I should go.)\""
10055005-103 = "...And so, I decided to leave everyday life behind for a while and set off on a dreamy voyage."
10055005-109 = "[log]Day 7 Adrift[/log]"
10055005-113 = ""
10055005-114 = "Water... Waaater...!"
10055005-115 = ""
10055005-117 = ""
10055005-119 = "[ns3] \"Makoto! Stay with me, Makoto!\"\n[ns4] \"How could such a tragedy befall us...?!\""
10055005-123 = "...Our horrors had begun seven days prior."
