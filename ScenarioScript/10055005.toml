10055005-30 = "3;마코토;10;자, 선생이여, 기뻐하도록 하라!\n#3;closeup\n#fontsize;100"
10055005-31 = "3;마코토;99;기다리는 시간 동안 여러 생각을 했겠지. 어쩌면 이번 여름은 어렵지 않을까? 그렇지만 마코토 님이라면 어떻게든 해주지 않을까?\n#3;closeup"
10055005-32 = "3;마코토;17;그 생각대로! 염려하지 마라! 계약은 막 성사되었다! 그리고 이 영광의 자리에, 선생도 초청하기로 막 결정한 참이다! 키키킥!\n#3;em;[!]\n#3;closeup"
10055005-33 = "3;마코토;26;……아무래도 영상 메시지라 표정을 볼 수 없는 게 아쉽군.\n#3;closeup"
10055005-34 = "3;마코토;25;제아무리 선생이라 해도 틀림없이 놀라 자빠졌을 테지. 아니면 기쁨에 눈물겨워 하고 있을지도……?\n#3;em;[음표]\n#3;closeup"
10055005-35 = "#st;[0,0];instant;1;"
