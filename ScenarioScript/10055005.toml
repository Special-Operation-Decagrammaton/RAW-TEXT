10055005-77 = "3;마코토;17;키키킷! 역시 이부키! 명철하고 명료한 설명이다! 장하구나!\n#3;em;[재잘]"
10055005-78 = "3;마코토;10;……아무튼, 그렇게 된 거다, 선생. 올여름 우리 만마전은 크루즈 대절해, 초호화 크루즈 여행을 떠날 예정이다!"
10055005-79 = "3;마코토;23;얄미운 선도부 놈들이 지옥 합숙으로 땀을 뻘뻘 흘리는 동안, 우리는 여유롭게 초초초호화 여행을 즐기는 거지!"
10055005-80 = "3;마코토;03;거기에 우리 여행에 선생을 초대하는 도량까지 베풂으로써, 선도부 놈들에게 격과 그릇의 차이를 뼈저리게 느끼게 하는 계획이다! 키키키킷~!\n#3;em;[음표]"
