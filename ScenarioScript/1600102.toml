[translation]
1600102-1 = "마이 페이스의 그녀"
1600102-2 = "딸그랑 딸그랑-."
1600102-3 = "아, 어서 오세요. 바로 안내해 드릴까요?? 주인……."
1600102-4 = "……어?"
1600102-5 = "와!! 주인님이잖아!? 와줬구나, 주인님! 기다리고 있었어!"
1600102-6 = "아, 그래도 우선 자리는 안내해 드려야겠죠, 주인님?"
1600102-7 = "……주인님……?"
1600102-8 = "……흐음. 주인님이라……"
1600102-9 = "[s] \"……아스나?\""
1600102-10 = "……그러고 보니 여기선 손님을 주인님이라고 하는데, 주인님은 원래부터 주인님이잖아?"
1600102-11 = "원래부터 주인님인 주인님이니까 주인님은 어떻게 불러야 하지?"
1600102-12 = "원래 주인님인 주인님? 아니 그냥 주인님인 주인님인가? 그냥 주인님이면 되나?"
1600102-13 = "주인님…… 주인님인 주인님……?"
1600102-14 = "[s1] \"주인님은 주인님인 주인님……?\"\n[s2] \"여긴 어디, 나는 누구……\""
1600102-15 = "아하하하! 주인님 표정 좀 봐! 멍한 게 귀여워!"
1600102-16 = "아하하하! 주인님 표정 좀 봐! 멍한 게 귀여워!"
1600102-17 = "역시 호칭이 똑같으니 헷갈리지?"
1600102-18 = "그래도 어쨌거나 주인님은 주인님이니, 여기서도 그냥 주인님이라고만 부를게."
1600102-19 = "응? 놀러 온 거 아니었냐고? 왜 아르바이트를 하고 있는 모양새냐고?"
1600102-20 = "놀러 온 거 맞아! 근데 메이드복을 입고 와서 그런지 사람들이 종업원인 줄 알더라고."
1600102-21 = "마침 여긴 메이드 카페니까 말이지. 그래서 그냥 어울려주고 있었어."
1600102-22 = "응? ……시급?"
1600102-23 = "아니? 그냥 재미로 하고 있는 건데?"
1600102-24 = "아하하하! 뭐야 그 표정은 또! 아하하하하!"
1600102-25 = "하아, 하아…… 역시 주인님이랑 있으면 재밌다니까."
1600102-26 = "……응?"
1600102-27 = "카페로 불러낸 이유?"
1600102-28 = "……아! 맞다. 내가 주인님보고 나와 달라고 했었지?"
1600102-29 = "응? 그새 까먹었냐고? 아니야. 이건 '사소한 건 신경 쓰지 않는다.'라고 해야지!"
1600102-30 = "아무튼 그렇지. 왜 불렀더라……."
1600102-31 = "아! 맞다!"
1600102-32 = "오늘은 사실 비밀작전을 수행하는 날이거든. 어떤 사람을 추적해서 붙잡아야 하는데……"
1600102-33 = "그래서 같이 카페에서 놀까 하고 있었어. 헤헤헤."
1600102-34 = "……응? 그건 대답이 안 된다고? 그 이전에 무슨 소린지 모르겠다고?"
1600102-35 = "비밀작전을 수행하는데 왜 카페에서 놀고 있냐고?"
1600102-36 = "으음~. 그러게…… 그렇게 물어보면 음…… 어떻게 설명할까……"
1600102-37 = "……그냥?"
1600102-38 = "그냥 여기서 주인님이랑 놀고 있으면 어떻게든 될 거 같은 느낌?"
1600102-39 = "응. 그런 느낌이야! 왠지 그럴 거 같았어!"
1600102-40 = "에에~? 성실하게 일을 하는게 어떻겠냐고?"
1600102-41 = "싫어~! 그냥 여기서 주인님이랑 놀 거야. 왠지 안 그러면 안 될 거 같단 말이야."
1600102-42 = "아니면 혹시 주인님 지금 바빠? 바쁜데 괜히 부른 걸까나?"
1600102-43 = "아, 그런 건 아니라고? 다행이다. 럭키-!☆"
1600102-44 = "흠-. 그럼 모처럼의 데이트 같은 거니까, 나도 이제 아르바이트 놀이는 그만 할까나-."
1600102-47 = "영차-. 괜찮지? 앞자리에 앉아도."
1600102-48 = "저기, 메이드 씨! 여기 주문이요-!"
1600102-49 = "[s3] \"메이드에서 순식간에 주인님으로 바뀌었어……\"\n[s4] \"정말 괜찮아? 이렇게 놀고 있어도?\""
1600102-50 = "사소한 건 신경 쓰지 말래도~. 여기는 <디지털 데상트 디저트 세트>가 맛있는데……"
1600102-51 = "사소한 건 신경 쓰지 말래도~. 여기는 <디지털 데상트 디저트 세트>가 맛있는데……"
1600102-52 = "……딸그랑 딸그랑-."
1600102-53 = "네~. 어서 오세요, 주인님~!"
1600102-54 = "……"
1600102-55 = "……후우, 좋아. 무사히 따돌린 것 같군. 여기라면 문제가 없다. 당분간 여기 숨어있자."
1600102-56 = "정말 끈질기게 쫓아 오는군, 그 녀석들……"
1600102-57 = "어디 보자. 그나저나 빈 자리가……"
1600102-58 = "아, 저기 있군. ……뭐지? 옆에는 메이드가……?"
1600102-60 = "이봐, 넌 뭐 하는 거야? 주문 안 받아?"
1600102-61 = "에? 나?"
1600102-62 = "왜 메이드가 자리에 앉아서 음식을 고르고 있는 거야!? 정신이 있어 없어!?"
1600102-63 = "얼른 주문이나 받지 못……?"
1600102-64 = "……?"
1600102-65 = "……?"
1600102-66 = "[s] \"……아스나?\""
1600102-67 = "……!"
1600102-68 = "추적 대상이다!!"
1600102-69 = "야호!! 여기서 만나네! 딱 걸렸어~!!"
1600102-70 = "어, 어떻게 여기에서 잠복을!? 이건 말도 안 돼……!!"
1600102-71 = "잠ㄲ……!"
1600102-75 = "우당탕쿵쾅!"
1600102-77 = "(결국 수상한남자는 아스나의 손에 붙잡혔고, 아스나가 말한 비밀작전도 훌륭하게 마무리됐다.)"
1600102-78 = "(하지만 처음부터 경로를 예상하고 있었냐는 질문에 아스나는……)"
1600102-79 = "……"
1600102-81 = "아니!"
1600102-83 = "(……)"
1600102-84 = "(……어쨌든 이후의 남은 시간은, 아스나와 함께 디저트를 먹으며 보냈다.)"
