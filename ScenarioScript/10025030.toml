[translation]
10025030-1 = "제3화;금기"
10025030-4 = "……조사 결과에 대해 중간보고 드리겠습니다."
10025030-8 = "이곳 야토우라 마을의 어민들을 탐문한 결과, 요 몇 달간 새우 조업에 영향을 끼칠 만큼 특별한 환경 변화는 없었던 것으로 보입니다."
10025030-9 = "증언에 의하면 근래 새우 어획량이 다소 줄어든 것은 사실인 것 같지만…… D.U. 전역에 새우 대란을 일으킬 정도는 아니었던 것 같네요."
10025030-10 = "나도 <레드 훅 익스프레스>의 수산물 가공 공장에 사고가 발생하지는 않았는지 따로 기록을 확인해 보았지만, 그쪽도 아무 문제가 없었어."
10025030-11 = "……마을이 기분 나쁠 만큼 조용하다는 걸 제외하면 오히려 평화로워 보일 정도인걸."
10025030-16 = "마을 어귀의 CCTV도 모두 살펴보았지만, 하루에 두 번씩 오가는 버스 이외에 드나드는 차량은 없는 것 같아."
10025030-17 = "몇 톤이나 되는 냉동 새우를 육로로 옮기려면 다른 방법으로는 불가능할 테니……"
10025030-18 = "<레드 훅 익스프레스>의 정기선을 거치지 않고 별개의 루트로 새우가 반출된 것 같지는 않네."
10025030-19 = "그 밖에 외부와의 교류도 거의 없는지, 이 마을에 외지인은 우리밖에 없는 것 같아."
10025030-20 = "아. 다만 부둣가 근처에서 가벼운 낚시채비를 갖춘 낚시꾼과 마주치긴 했는데……"
10025030-21 = "……그 낚시꾼은 정작 낚시에는 관심이 없어 보였고, 뭔가 다른 걸 찾는 것처럼 보였어."
10025030-27 = "[ns] \"뭔가……\""
10025030-28 = "……수상하네요."
10025030-29 = "객관적인 정보만 두고 보자면 큰 문제가 없어 보이지만, 현재 밝혀진 정황만으로는 D.U.에 새우가 제대로 납품되지 않는 이유를 설명할 수 없습니다."
10025030-31 = "마을 주민 모두가 큰 착각에 빠진 게 아니라면……"
10025030-32 = "주민들 중 누군가는 거짓말을 하고 있다는 뜻이겠지."
10025030-33 = "[s] \"그 밖에 신경 쓰이는 일은 없었어?\""
10025030-34 = "신경 쓰이는 일이라고 해도……"
10025030-35 = "마을 주민 모두가 하나같이 외지인을 경계하고 있어서 대부분은 제대로 말도 붙여보지 못했어."
10025030-36 = "친절하기로 소문난 발키리 경찰학교의 학생들조차 이곳에서는 어찌나 날이 서 있던지. 말을 걸기가 겁날 정도였다니까."
10025030-38 = "뭔가…… 외지인에게 들켜서는 안 되는 비밀이라도 있는 걸까?"
10025030-39 = "쿠후후…… 당연하지, 미유."
10025030-40 = "보통 이유도 없이 화가 난 것처럼 보이는 사람들은 대부분 어딘가 찔리는 구석이 있는 법이거든."
10025030-42 = "예를 들자면 저번에 사키가 빨래가 덜 말랐다고 속옷 없이 작전을 나갔을 때, 보여주었던 반응만 떠올리더라도—"
10025030-43 = "야! 넌 왜 갑자기 그때 이야기를……!"
10025030-49 = "……그리고 정확한 의미를 이해하지는 못했지만, 마을 주민들로부터 <깊은 곳의 존재들>을 조심하라는 이야기도 들었습니다."
10025030-50 = "아, 그 말은 나도 경찰서 앞에서 들었어."
10025030-51 = "이 근처에서 수영을 할 거라면 <깊은 곳의 존재들>에게 노여움을 사지 않도록 각별히 조심하라던데."
10025030-52 = "나도…… 낚시꾼들이 물고기를 잡을 때 <깊은 곳의 존재들>로부터 도움을 받을 수 있다고 들었어……"
10025030-54 = "……물고기를 잡을 때 도움을 주는 수중의 존재들? 그게 뭐야?"
10025030-55 = "이 마을 앞바다에는 돌고래 같은 생물이라도 살고 있는 건가?"
10025030-60 = "……<깊은 곳의 존재들>은 바닷속의 초인적인 존재를 이르는 이 마을의 오래된 표현입니다."
10025030-70 = "당신은……?"
10025030-71 = "아, 중간에 끼어들어서 죄송합니다."
10025030-72 = "밖에서 온 손님을 보는 건 오랜만이라, 반가워서 저도 모르게 불쑥 말을 걸었군요."
10025030-73 = "인사드리겠습니다. 저는 이곳 야토우라 마을에서 생산한 새우를 D.U.까지 운송하는 역할을 맡고 있는…… 일개 해운업자입니다."
10025030-75 = "새우의 운송? 그렇다면……"
10025030-76 = "당신이 그 <레드 훅 익스프레스>의 대표인가요?"
10025030-77 = "하하, 그렇게 말씀해 주시니 조금은 부담스럽네요."
10025030-78 = "오래전부터 이 마을에서 작게 해운업을 벌이고 있습니다만, 노련한 뱃사람들이 보기에는 소금기가 덜 밴 애송이에 불과하지요."
10025030-83 = "저희 역시 뵙게 되어 반갑습니다."
10025030-84 = "안 그래도 D.U.에 사시사철 맛있는 새우를 납품해 주시는 <레드 훅 익스프레스>의 대표님이 어떤 분인지 꼭 뵙고 싶었거든요."
10025030-85 = "하하. 그렇게 말씀해 주시니 노력한 보람이 있네요."
10025030-86 = "그런데…… 최근에는 D.U.에서 새우를 통 보지 못한 것 같네요."
10025030-87 = "납품되는 새우에 무슨 문제가 생겼는지, 요새는 음식점은 물론이고 편의점 도시락에서도 새우를 볼 수가 없던데……"
10025030-88 = "………."
10025030-89 = "D.U.의 새우 납품을 책임지고 계신 사장님께서는 혹시 뭔가, 알고 계신가요?"
10025030-90 = "그건 당연히, 새우가 잡히지 않기 때문입니다."
10025030-91 = "요새 날씨가 더운 탓인지, 조업을 나간 어부들이 물고기를 잡아 오는 날이 손에 꼽힐 정도로 새우가 잘 잡히지 않는 모양이더군요."
10025030-92 = "잡아 들인 새우가 없으니, D.U.에 납품할 물건도 자연히 부족해진 것이지요."
10025030-93 = "새우 조업이 정상화되면 해결될 문제이니 너무 걱정하지 않으셔도 괜찮습니다."
10025030-94 = "하지만 이곳의 사람들은 새우잡이에는 문제가 없다고 말했는걸?"
10025030-95 = "……뱃사람들의 자존심이 걸린 문제니까요. 솔직하게 답하고 싶지는 않았을 겁니다."
10025030-96 = "게다가 조업 자체에 문제가 생긴 건 아니지 않습니까?"
10025030-97 = "계절에 따라 잡히는 새우의 숫자가 늘었다 줄어드는 것은 자연스러운 섭리이니, 이를 '문제'라고 부르는 것도 어폐일 수밖에요."
10025030-98 = "그건 그렇긴 하지만……"
10025030-100 = "오히려 새우가 잡히지 않는 상황에 대해서는 오히려 제가 하소연을 하고 싶은 정도입니다."
10025030-101 = "이번 달만 하더라도 새우를 팔지 못해 본 손해가 얼마인지……"
10025030-102 = "정말 가능하다면 <깊은 곳의 존재들>에게 직접 부탁이라도 해서 새우 떼를 다시 불러들이고 싶은 정도라니까요."
10025030-103 = "저…… <깊은 곳의 존재들>이 정확히 무엇인가요?"
10025030-104 = "아까도 말씀드렸지만, <깊은 곳의 존재들>은 야토우라 마을의 설화에 등장하는 바닷속의 신비한 존재를 이르는 말입니다."
10025030-105 = "이 마을의 오랜 설화에 따르면, 마을 동쪽에 있는 <도깨비의 암초> 아래에는 신비한 힘을 지닌 존재가 사는 해저 도시가 있다고 하지요."
10025030-106 = "그들은 물고기와 같이 온몸이 비늘로 덮여 있으며, 아무리 깊은 바닷속이라도 자유로이 헤엄칠 수 있는 튼튼한 몸을 갖고 있다고 합니다."
10025030-107 = "그들은 늙거나 굶주려서 죽는 법이 없으며, 오로지 폭력에 의해서만 죽음을 맞이하기 때문에 불로불사를 꿈꾸는 많은 사람들이 그들을 보고자 이 마을을 찾아왔다고 하지요."
10025030-108 = "물론 그들을 마주한 외지인들이 끝내 어떤 결말을 맞았는지는 적혀있지 않지만……"
10025030-109 = "히, 히익……"
10025030-110 = "게다가 <깊은 곳의 존재들>은 바닷속의 물고기를 자유롭게 부리기 때문에 마음에 든 인간에게는 바다에서 얻을 수 있는 온갖 풍요를 약속해 준다고 합니다."
10025030-111 = "간단히 정리하자면…… <깊은 곳의 존재들>은 바다의 일을 주관하는 해신과 같은 존재라 할 수 있습니다."
10025030-112 = "[s1] \"용왕님이라던가……?\"\n[s2] \"아쿠O 맨이라던가……?\""
10025030-113 = "네. 완전히 일치하지는 않겠지만 비슷한 개념이겠지요."
10025030-114 = "……네? 그게 뭔가요……?"
10025030-115 = "여하튼…… 어획량이 줄어들어서 그런지는 몰라도, 최근 마을 사람들이 <깊은 곳의 존재들>을 입에 담는 일이 크게 늘어났습니다."
10025030-116 = "예를 들면 그들의 분노를 다스리기 위해 제물을 바치거나, 바다를 어지럽히는 외지인을 몰아내야 한다고 말이지요."
10025030-118 = "제물이라면…… 어떤 제물을 말씀하시는 건가요?"
10025030-120 = "그야 물론…… 살아있는 사람을 말하는 것이지요."
10025030-122 = "………!"
10025030-124 = "후후, 농담입니다. 너무 두려워 마시길."
10025030-125 = "사람을 산제물로 바쳤다는 것도 오래된 설화에나 나오는 이야기고, 그마저도 진위는 불확실하니까요."
10025030-126 = "게다가 요즘 같은 시대에, 야토우라 같은 외진 어촌에서 갑자기 사람이 사라지기라도 한다면 큰 소란이 일지 않겠습니까?"
10025030-127 = "……저희는 가급적 이 마을에서 조용히 장사를 계속하고 싶으니까요."
10025030-128 = "(……마치 가능하다면 사람을 제물로 바칠 수도 있다는 말처럼 들리는데……)"
10025030-129 = "혹 <깊은 곳의 존재들>에 대해 더 관심이 있으시다면, <도깨비의 암초>를 직접 찾아가 보시는 것도 추천 드립니다."
10025030-130 = "……다만 조차가 큰 사리날 밤에는 절대로 그 근처에 가까이 가시지 마시길."
10025030-131 = "……어째서인가요?"
10025030-132 = "오랜 설화에 따르면 사리날 밤은 <깊은 곳의 존재들>이 공물을 거두어 가기 위해 뭍으로 올라오는 때라고 합니다."
10025030-133 = "물론 뱃사람들의 허풍이 섞인 이야기라고는 하지만, 만에 하나 그 깊은 바닷속의 존재들이 실존한다면……"
10025030-134 = "마을의 비밀을 캐고 다니는 외지인을 환대할 거라 생각할 수는 없으니까요."
10025030-136 = "………!!"
10025030-138 = "이런, 너무 사설이 길었군요. 괜한 이야기를 한 것 같습니다."
10025030-139 = "아뇨. 마을을 이해하는 데 큰 도움을 받았습니다. 감사합니다."
10025030-140 = "……세상에는 아느니 못한 것이 잔뜩 있는 법이지만."
10025030-142 = "그럼, 즐거운 바캉스 되시길."
10025030-150 = "여, 역시 이 마을은 저주받았어…… <깊은 곳의 존재들>이라는 말을 들었을 때 눈치챘어야 했는데……"
10025030-151 = "분명 우리는 이 마을에 물고기 떼를 불러들이기 위한 산 제물로 선택된 거야…… 이제는 도망치고 싶어도 도망칠 수 없어……"
10025030-152 = "그게 무슨 소리야, 미유. 이 마을은 우리 발로 직접 찾아온 거잖아?"
10025030-153 = "하지만…… 공포 영화의 오프닝도 다 이렇게 시작한다고!"
10025030-154 = "처음에는 순수한 호기심에 이끌려 들어오지만, 중반부터는 도망치고 싶어도 도망칠 수 없게 되어서……"
10025030-155 = "온갖 기이하고 공포스러운 괴물들이 발길을 가로막고, 정신을 갉아먹어……"
10025030-156 = "끝내는 이 세상의 것이 아닌 환영을 마주한 채 공포 속에서 살아가게 될 거야……!"
10025030-157 = "……호들갑 떨지 마, 미유. 세상에 그런 괴물이 어디에 있어?"
10025030-158 = "괴물이니 저주니 해도, 결국은 사람이 사람을 겁주기 위해 만든 이야기일 뿐이야."
10025030-159 = "저도 동감합니다."
10025030-160 = "그렇게 강력하고 기이한 존재가 바다 아래에 있었더라면, 그동안 키보토스 총학생회가 그 존재를 눈치채지 못했을 리가 없지요."
10025030-161 = "……미유, 그거 알아?"
10025030-162 = "세상에서 제일 기이하고 두려운 존재는 바다 밑이 아니라 총학생회 재무실에 살고 있어……"
10025030-164 = "<깊은 곳의 존재들>이 얼마나 신성하고 기이한 존재인지는 모르겠지만, 그들이 어로 활동 따위로 키보토스의 경제에 영향을 끼치고 있었다면 재무실 세무조사 4팀의 시선으로부터 자유로울 수는 없었을 거야……"
10025030-165 = "……뭔가 쓸데없이 예시가 구체적인데."
10025030-167 = "오디세이아 해양학교를 통해 우회 구매한 미사일은 나름 잘 숨겼다고 생각했는데……"
10025030-168 = "넌 또 우리 몰래 무슨 짓을 벌이고 있었던 거야?!"
10025030-169 = "여하튼 귀신도 잡아낸다는 SRT 특수학원의 대원이, 고작 뜬소문이 무서워 작전 현장에서 달아날 수는 없지."
10025030-171 = "이 뜬소문의 뒤에서 누가 부정한 이득을 챙기고 있는지, 내가 샅샅이 파헤쳐 주겠어!"
10025030-173 = "……하지만 조사를 더 진행하려 해도 지금은 보는 시선이 너무 많은 것 같군요."
10025030-174 = "마을 사람들이 저희를 경계하고 있는 이상, 현시점에서 탐문을 계속하는 것도 어려울 듯합니다."
10025030-175 = "우선 전 대원은 모두 숙소로 돌아가 이른 수면을 취하도록 합시다."
10025030-176 = "마을이 조용해지고 사람들이 잠을 청하기 위해 집으로 돌아가면……"
10025030-177 = "그때부터 본격적인 수색을 재개하겠습니다!"
