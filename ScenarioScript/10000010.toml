[translation]
10000010-1 = "제1화;백야당에 어서 오세요"
10000010-2 = "백야당이라면, 그 유명한 찻집?"
10000010-3 = "암암, 그렇지. 백야당의 딸기 안미츠는 최고라니까?"
10000010-4 = "그리고 무엇보다 참을 수 없는 건……."
10000010-6 = "\"\"\"시즈코 땅의 귀여운 미소지!\"\"\""
10000010-8 = "(그렇게 찾아온 이곳. 백야당 앞에서 걸음이 멈추었다.)"
10000010-12 = "오셨-습니까아, 두목! 환영합니다아앗!"
10000010-13 = "샬레파에서 친히 오신다는 이야기를 듣고, 불초 피나! 기다리고 있었스으읍~니다!"
10000010-14 = "[s1] \"으, 으응……?\"\n[s2] \"샤, 샬레파?\""
10000010-15 = "잠깐잠깐잠깐. 피나! 선생님이 당황하시잖아!"
10000010-16 = "잠깐잠깐잠깐. 피나! 선생님이 당황하시잖아!"
10000010-17 = "네……? 하지만 부장?"
10000010-18 = "선생님이 오시면 깜짝 놀랄 정도로 환영의 인사를 건네 드리라고, 부장이."
10000010-19 = "아니아니아니. 어디까지나 그건 백야당의 아이돌로서! 첫인상!"
10000010-20 = "그래, 첫인상의 문제야!"
10000010-21 = "첫 만남에서 귀~엽게 보이는 걸로, 처음부터 선생님의 호감도를 MAX로 찍고 가자는……."
10000010-22 = "[s] \"음, 저기…….\""
10000010-23 = "핫?! 선생님?!"
10000010-24 = "아, 이게, 그러니까. 으음……."
10000010-25 = "데, 데헷페로……?"
10000010-26 = "가 아니라…… 으무웃!"
10000010-29 = "어서 오세요. 선생님!!"
10000010-30 = "백야당에 오신 걸 환영해요~! 냥냥!"
10000010-31 = "[s] \"냥냥……?\""
10000010-32 = "에헤헷, 일단 안으로 안내하겠습니다!"
10000010-33 = "피나, 손님 한 분!"
10000010-34 = "네엣! 불초 피나! 전력을 다해 모시겠습니다!"
10000010-35 = "그러니까 그게 아니래두!"
10000010-37 = "그보다 와아, 선생님. 정말 와주신 거군요!"
10000010-38 = "[s] \"일단은 샬레의 선생님이니까.\""
10000010-39 = "엣헴! 그럼 정식으로 소개해 드릴게요."
10000010-40 = "저는 카와와 시즈코."
10000010-41 = "백귀야행 연합학원 소속 마츠리운영관리부의 부장이자, 백귀야행이 자랑하는 전통찻집 백야당의 오너!"
10000010-42 = "동시에 백야당의 얼굴을 맡고 있기도 한, 모두의 아이돌이랍니다! (으쓱)"
10000010-43 = "그리고 전 백야당의 종업원이자, 아쵸오옷!"
10000010-44 = "최고의 협객을 꿈꾸는 피나입니다!"
10000010-45 = "[s] \"둘 다 잘 부탁해.\""
10000010-46 = "흠흠, 그래서 선생님께선 백귀야행 연합학원은 처음이신 거죠?"
10000010-47 = "앗, 그럼 저, 시즈코. 그리고 마츠리운영부의 자기 PR을 겸해서 말씀드리자면."
10000010-50 = "애당초 백귀야행 연합학원이란 어떤 곳인가~!"
10000010-52 = "저희 백귀야행 연합학원은 예로부터 관광업을 중심으로 발달한 학원 자치구예요."
10000010-54 = "축제…… 온천…… 음악…… 오락……."
10000010-55 = "그리고 빼놓을 수 없는 먹거리까지!"
10000010-57 = "갖은 문화와 다양한 학생들이 어우러져 숨 쉬는 이곳!"
10000010-59 = "저희 <마츠리운영관리부>는 그런 백귀야행의 관광업 중에서도 가장 큰 분야인 축제 부문을 전문적으로 담당."
10000010-60 = "기획 및 주최, 운영, 그리고 전반적인 관리를 맡은 동아리랍니다! 엣-헴!"
10000010-61 = "그리고 백야당은 저희 마츠리부의 Cooool한 아지트입니다!"
10000010-62 = "지금은 저희가 온 힘을 다해 준비한 백야앵제도 성황리의 전개 중!"
10000010-63 = "에헤헷, 이게 저희 마츠리운영관리부의 파-워인 거죠!"
10000010-64 = "[s] \"확실히 거리에도 활기가 넘쳤지.\""
10000010-65 = "후우, 이렇게 각고의 노력 끝에 백야앵제가 성황 중이기는 하지만……."
10000010-66 = "하아, 최근 방해꾼들이 나타났어요."
10000010-67 = "오늘 아침만 해도 또 난장판을 치기 시작한 게……."
10000010-68 = "[s] \"그러고 보니 상담하고 싶다던 게 …….\""
10000010-69 = "네…… 선생님을 이번에 초대한 이유가 백야앵제를 보여 드리기 위한 것도 있었지만."
10000010-72 = "오옷! 부장! 놈들입니다!"
10000010-73 = "우와아아악! 그 녀석들! 말하자마자 또냐구?!"
10000010-74 = "앗……. (힐끔)"
10000010-75 = "에헤헷, 데헷, 페로……?"
10000010-76 = "하, 하여간 자세한 건 혀, 현장에서 말씀드릴게요!"
10000010-79 = "크하하핫! 우린 백귀야행 길거리의 망량들."
10000010-80 = "이름하야……. 길거리 망량즈임다! (두둥!)"
10000010-81 = "자아, 모두 다 같이 고용주의 의뢰를 따라! 난장판이다!"
10000010-83 = "[ns3] \"혹시 저것도 축제 퍼레이드의 일종이야?\"\n[ns4] \"요즘 축제 행사는 과격하네.\""
10000010-84 = "그, 그럴 리가 없잖아요! 어느 축제의 이벤트인가요, 그건?!"
10000010-85 = "그, 그럴 리가 없잖아요! 어느 축제의 이벤트인가요, 그건?!"
10000010-86 = "쟤들은 단순한 방해꾼이에요!"
10000010-87 = "축제를 방해하려는 그 불의! 용서할 수 없습니다!"
10000010-89 = "겨우 마츠리부 따위가 우릴 막을 수 있을 거라 생각지 마라!"
10000010-92 = "전원! 돌격!"
