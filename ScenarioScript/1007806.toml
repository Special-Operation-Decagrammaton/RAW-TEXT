[translation]
1007806-1 = "깊은 산중의 구조요청"
1007806-2 = "(카스미의 연락을 받고, 서둘러 표시된 위치로 찾아갔다.)"
1007806-6 = "아~아. 한적한 곳이라 그런지, 멀리서부터 소리가 들리네! 와핫핫핫!!"
1007806-7 = "그렇게 서두르진 않아도 된다고 했는데……. 뭐, 이럴 거라 예상은 했지만서도."
1007806-8 = "어~이! 선생님~!"
1007806-9 = "이쪽이야, 이쪽~!"
1007806-11 = "크으……. 이거 참……. 뭔가 좀 무안하네. 그렇다고 부르지 않을 수도 없고……."
1007806-12 = "고마워, 선생님. 안 그래도 바쁜 사람한테 신발 심부름이라니, 어떻게 사과와 감사를 표해야 할지 모르겠어."
1007806-13 = "……응? 그런 건 됐고 많이 다쳤냐고?"
1007806-14 = "아아, 아니아니! 전혀 그런 건 아니야! 하하! 정말로 괜찮아, 괜찮다고!"
1007806-15 = "괜찮으니까 제발 그런 걱정하는 얼굴은 좀 그만둬 주지 않겠어? 그럴수록 내가 정말 무안해지거든."
1007806-16 = "그저 포인트를 찾느라 산길을 좀 돌다가……. 미끄러지는 과정에서 슬리퍼가 찢어져 버렸을 뿐인데 말이야."
1007806-17 = "말 그대로 발이 좀 삐끗! 했다-는 것. 정말 단지 그것뿐! 다치거나 피가 난 건 아니니, 걱정할 거 없어!"
1007806-18 = "정말이라니까~. 그렇게 못 믿겠으면 직접 보겠어?"
1007806-19 = "……자! 봐 봐! 내 발! 여~기~."
1007806-20 = "멀쩡하지? 긁힌 곳도 피가 나진 않을 정도로 살짝 스쳤을 뿐이야. 호들갑 떨 거 없다고."
1007806-21 = "……음? 왜 이런 곳에 혼자서 왔냐고?"
1007806-22 = "뭐, 당연히 사전 조사지. 포인트로 정한 곳 중 하나인데……. 실제로 괜찮은지 확인을 해야 하니까."
1007806-23 = "여기는 그래도 괜찮지만, 보통 발파 포인트는 도심지인 경우도 꽤 많거든."
1007806-24 = "다른 부원들이랑 우르르 몰려다니면 그 자체로도 이미 여러 녀석의 표적이 되게 마련."
1007806-25 = "그래서 포인트 확인 조사는 보통 나 혼자서 진행해. 그 편이 빠르기도 하고."
1007806-26 = "나라고 늘 책상머리나 지도 위에서만 움직이는 건 아니라고?"
1007806-27 = "……응? 뭐라고?"
1007806-28 = "……호오? 그래서 여기는 어떤 거 같냐……고?"
1007806-29 = "음……. 그러게. 안타깝지만, 단도직입적으로 말하자면……."
1007806-30 = "……꽝!"
1007806-31 = "……이로군! 와핫핫핫핫!! 완전히 꽝이야!! 더 고려할 가치도 없겠어, 여기는!"
1007806-32 = "딱히 뭐 온천이 나올 것 같지도 않고, 발파 작업 자체도 밋밋하니 평범할 것 같아."
1007806-33 = "그렇다고 그 과정에서 뭔가 다이나믹한 게 생길 거 같지도 않지. 모든 면에서 별로야."
1007806-34 = "나 정도 되는 녀석이 이런 실수를……! 이라는 생각까지 들 정도로 말이야. 와핫핫핫!!"
1007806-35 = "심지어 슬리퍼까지 하나 해 먹어 버리고……. 에휴~."
1007806-36 = "그러고 보니 선생님, 부른 것만으로도 이미 충분히 염치가 없지만……."
1007806-37 = "……혹시 가져왔어? 부탁한 거."
1007806-38 = "[s1] \"슬리퍼 말이지? 물론.\"\n[s2] 가져온 슬리퍼를 보여준다."
1007806-41 = "핫핫핫! 역시 선생님이야! 믿고 있었다고!"
1007806-42 = "자, 그렇다면 그 슬리퍼, 이리 좀 주겠어? 여긴 더 볼 일이 없으니, 얼른 같이 내려가서……."
1007806-43 = "……응?"
1007806-44 = "지금은 안 준다고……? 갑자기 그건 또 무슨 소리야?"
1007806-45 = "……뭐?"
1007806-46 = "등에 타라고……? 업어줘? 선생님이? 나를?"
1007806-47 = "흐음……."
1007806-48 = "흐으으음……!!"
1007806-49 = "……으으으으으으으음~!!!"
1007806-53 = "……그, 그……. 어……. 음……."
1007806-54 = "……꼭……. 그래야 할까? 꼭 그렇게까지 해야 할까?"
1007806-55 = "뭔가 조금……. 낯 뜨거운 느낌이 드는 것 같기도 하고……."
1007806-56 = "그, 그야. 뭐. 발목이 삐었으니 걷기 편한 건 아니라고는 하지만……."
1007806-57 = "그래도 적당히 천천히 내려가면 될 것 같기도 하고……. 아니면 부축 정도만 해도 되고……."
1007806-58 = "……업는다……. 업는다……라……. 선생님이 업어준다……. 음……."
1007806-59 = "으으으음……!!"
1007806-60 = "……꼭?"
1007806-61 = "[s3] \"응. 꼭.\"\n[s4] \"당연하잖아, 환자인데.\""
1007806-64 = "허으으으음……. 그런가……."
1007806-65 = "그, 그럼 뭐……. 어, 어쩔 수 없나……."
1007806-66 = "와, 와하, 와하핫핫……. 와핫핫핫……!!"
1007806-70 = "정말이지 사람을 곤란하게 하는 재주가 있는 사람이야. 살다 살다 이런 상황은 처음이라고."
1007806-71 = "누가 보면 특별한 관계인 줄 알겠어, 아주? 그런 오해가 생겨도 괜찮은 걸까, 선생님은?"
1007806-72 = "아무튼 알겠어. 내려간 뒤에는 슬리퍼 제대로 주는 거겠지? 그런 거라고 알고 있으면 되겠지?"
1007806-73 = "그럼 잘 부탁해. 선생님."
1007806-80 = "[ns5] \"……카스미?\"\n[ns6] \"왜 그래?\""
1007806-83 = "아, 아니. 뭐, 그냥 좀. 개인적인 생각."
1007806-84 = "………핫핫."
1007806-85 = "뭐랄까……. 이렇게 보니, 오늘의 조사도 꼭……."
1007806-87 = "……'허탕'은 아니었던 모양이야."
