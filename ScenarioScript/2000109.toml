[translation]
2000109-1 = " 메이드 카페! 2"
2000109-2 = "카페 메이드라마틱!"
2000109-4 = "……."
2000109-5 = "……."
2000109-6 = "그런 표정 짓지 말아줘."
2000109-7 = "친구는 돌아왔다. #n문제는 점장님이 오늘까지만이라도 도와달라고 해서 어쩔 수 없이……"
2000109-8 = "하아. 일이라면 좋은 평가를 받는데. #n어째서 공부는 안 되는 걸까."
2000109-9 = "[s1] \"공부할 시간에 일을 하고 있으니까……?\"\n[s2] \"인정받는다는 건 좋은 일이야.\""
2000109-10 = "으음. 부정할 말이 없네."
2000109-11 = "으음. 부정할 말이 없네."
2000109-12 = "어쨌든, 무조건! #n오늘이 마지막이다."
2000109-13 = "자, 선생님. 주문하도록 해."
2000109-14 = "[s] \"업계포상 해줘.\""
2000109-15 = "아, 아직도 그 소리야?"
2000109-16 = "그런 건 점장님도 안된다고 했잖아."
2000109-17 = "그리고…… 나도 선생님을 짓밟긴 싫어. #n어쩐지 옳지 않은 거 같아."
2000109-18 = "[s] \"선생님을 짓밟는 것은 옳지 못하지만, 주인님을 짓밟는 것은 매우 옳아.\""
2000109-19 = "그것참 놀라운 논리네."
2000109-20 = "그보다 어서 주문을……"
2000109-22 = "꺄앗. 주, 주인님! 이러시면 안 돼요!"
2000109-23 = "후하하핫! 귀여워! 귀여워! 이런 천국이 있다니!"
2000109-24 = "……이런, 취객인가."
2000109-25 = "저런 손님이 가장 번거로운데……"
2000109-26 = "점장님은 대체 뭘 하고 있는 거야."
2000109-27 = "후우-후우- 이게 카츄사 라는 건가? #n한 번 만져봐도~ 될까나~"
2000109-28 = "큭. 저 녀석……"
2000109-29 = "날려버릴까……? #n아, 아니야. 내 총은 이런 실내에서 쓰기엔……."
2000109-30 = "게다가 메이드가 손님을 총으로 쏴버렸다는 소문이라도 나버리면……."
2000109-32 = "크윽. 대체 어떻게 해야……!"
2000109-34 = "[ns] 일어나 취객에게 다가간다."
2000109-36 = "응? 넌 뭐야! #n너 같은 건 주문 안 했어!"
2000109-37 = "[s3] \"사실 여기는 '여장남자 메이드 카페'야.\"\n[s4] \"나는 당신을 테이크아웃 하고 싶은데?\""
2000109-38 = "뭐, 뭐, 뭐라고?!"
2000109-39 = "뭐, 뭐, 뭐라고?!"
2000109-40 = "[s5] \"지금 내 곁에 있는 그녀…… 아니 그는 사실……\"\n[s6] \"농담이 아니다.\""
2000109-41 = "이, 이럴 수가! 천국인 줄 알았는데 지옥이었을 줄이야!"
2000109-42 = "이, 이럴 수가! 천국인 줄 알았는데 지옥이었을 줄이야!"
2000109-43 = "가, 가까이 오지 마! 거, 거스름돈은 필요 없으니 돌려보내 줘!"
2000109-45 = "고, 고, 고맙습니다!"
2000109-46 = "……굉장해."
2000109-47 = "나도, 감사할게. #n고마워 선생님."
2000109-48 = "잠깐 자리를 비운 사이에…… 이런 일이……!"
2000109-49 = "발키리에 신고하려 했는데."
2000109-50 = "고맙습니다. 손님."
2000109-51 = "이건 저희 메이드카페 특별회원증입니다."
2000109-52 = "손님에게는 특별히 입실료를 받지 않겠……!"
2000109-53 = "[s7] \"그런 건 필요 없어.\"\n[s8] \"그보다 더 받고 싶은 게 있는데.\""
2000109-54 = "네? 대체 무슨…… #n저희가 할 수 있는 거라면……."
2000109-55 = "네? 대체 무슨…… #n저희가 할 수 있는 거라면……."
2000109-56 = "…… 서, 설마?"
2000109-57 = "[s] \"업 계 포 상.\""
2000109-58 = "?!"
2000109-59 = "후. 어쩔 수 없죠."
2000109-60 = "하아?! 뭐가 어쩔 수 없다는 거냐!"
2000109-64 = "자, 자, 잠깐만!"
2000109-65 = "아, 아직 마음의 준비가……."
2000109-66 = "하아. 아, 알겠다고!"
2000109-67 = "……해줄게."
2000109-68 = "그럼 선생님……"
2000109-70 = "……누워."
2000109-73 = "― 저, [wa:1000]정말로…… [wa:2500]이런 게 포상이 되는 건가……?"
2000109-75 = "― 어…… [wa:1500]음…… [wa:2000]어쩐지……"
2000109-78 = "― 엄청나게 부끄럽네. [wa:2500]하지만 [wa:1500]선생님이 좋다면……"
2000109-81 = "― 응? [wa:2000]좀 더 [wa:500]힘껏…………? [wa:2000]아, [wa:1300]알겠다."
2000109-84 = "― 선생님이 좋다면…… [wa:2500]나도…… [wa:1500]좋다."
2000109-87 = "― 아앗! [wa:500]가, [wa:700]갑자기 일어나지 마! [wa:1300]위험하다고!"
2000109-90 = "선생님은…… 참 재미있네."
2000109-91 = "일단, 말해둘게."
2000109-92 = "가게에서 이런 거 해주는 건…… 오늘이 마지막이라는걸."
2000109-93 = "……"
2000109-94 = "후후. 그렇게 실망한 표정 하지 마."
2000109-95 = "대신…… 선생님이 원한다면…… 가게가 아니라……"
2000109-98 = "개인적으로…… 해줄 테니까."
