[translation]
2600203-1 = "소녀의 요리법"
2600203-2 = "게헨나 제8번 학생식당"
2600203-3 = "오늘 만들어볼 요리는……."
2600203-4 = "카레예요!"
2600203-5 = "[s] \"그건, 평범하네.\""
2600203-6 = "모처럼 선생님과 함께 도전해보는 요리이니까."
2600203-7 = "누구나 좋아하는 카레를 선택한 건데."
2600203-8 = "아, 혹시 카레는 별로이신가요?"
2600203-9 = "그럼 예전에 드셨던 감바스를 다시 만들어볼까요?"
2600203-10 = "[s] \"아니! 평범한 건 좋은 거야. 응! 그렇고말고!\""
2600203-11 = "으음, 그러신가요?"
2600203-12 = "자, 그럼 재료부터 준비할게요!"
2600203-14 = "카레를 만들기 위해 필요한 재료들을 가져왔어요."
2600203-15 = "여기 카레 블럭과 돼지고기, 감자 세 개, 양파 한 개……."
2600203-16 = "그리고 당근이랑 여기에 부가적으로 쓸 수 있는 향신료들까지 포함해서."
2600203-17 = "이거면 얼추 준비가 되었네요."
2600203-18 = "[s] \"……역시 평범해.\""
2600203-19 = "네?"
2600203-20 = "[s] \"으응, 아무것도 아니야.\""
2600203-21 = "으음~? 뭐어, 그럼 본격적으로 재료 손질에 들어가 볼게요."
2600203-22 = "우선 레시피에 따르면, 달짝지근한 카레에서는 고기의 식감이 제법 중요한 만큼."
2600203-23 = "돼지고기를 부드럽게 만들어주는 게 중요하대요."
2600203-24 = "[s1] \"연육 작용이구나. 여러 가지 방법이 있었지.\"\n[s2] \"다진 마늘을 쓴다거나, 우유를 쓴다거나.\""
2600203-25 = "네, 연육 작용을 일으키기 위해, 여러 가지 방법이 있지만……."
2600203-26 = "네, 연육 작용을 일으키기 위해, 여러 가지 방법이 있지만……."
2600203-27 = "아, 마침 좋은 방법이 떠올랐어요."
2600203-28 = "고기라는 건 치대면 치댈수록 부드러워지기 마련이니까."
2600203-29 = "그거라면 이만한 물건이 없죠!"
2600203-31 = "[s] \"저기……. 주리 씨? 손에 든 그 도구는 대체……?\""
2600203-32 = "총이에요."
2600203-33 = "더블 배럴 샷건, 단 한 번에 수십 발의 탄환을 박아서 고기를 부드럽게 갈아줄 거예요!"
2600203-34 = "[s3] \"그야 갈아주겠지!\"\n[s4] \"물리적으로!\""
2600203-35 = "에잇, 얍☆"
2600203-36 = "에잇, 얍☆"
2600203-44 = "고기의 연육 작용은 이걸로 충분……."
2600203-45 = "[ns5] \"한 게 아니지……!\"\n[ns6] \"요리잖아! 총을 쓰면 어떡해?!\""
2600203-46 = "네?! 아, 안되나요……?!"
2600203-47 = "네?! 아, 안되나요……?!"
2600203-48 = "어, 어쩐지……."
2600203-49 = "제가 총만 꺼내면 다들 기겁을 하면서 말리길래."
2600203-50 = "저는 혹시 총을 쥐는 방법이 잘못되어서 다들 화를 내는 건가 했는데……. (시무룩)"
2600203-51 = "[s] \"쥐는 법의 문제야?!\""
2600203-52 = "앗! 선생님! 도구의 사용법은 중요하다고요?"
2600203-53 = "칼을 잘못된 방식으로 쥐면 다칠 수도 있으니까. 조심해야 해요!"
2600203-54 = "[s] \"역으로 혼나는 흐름?!\""
2600203-55 = "하, 하지만 이번엔 실수했어도 다음 번엔 실수하지 않을 거예요!"
2600203-56 = "레시피……. 레시피……."
2600203-57 = "앗, 찾았다."
2600203-58 = "다음으로는 재료를 볶을 차례예요."
2600203-59 = "레시피에 따르면 볶는 순서가 분명……."
2600203-60 = "당근이 첫 번째, 감자, 그리고 양파 순이네요."
2600203-61 = "[s] \"좋아, 그럼 당근부터…….\""
2600203-62 = "그래서는 너무 오래 걸리지 않나요?"
2600203-63 = "[s] \"응?\""
2600203-64 = "그 왜, 급양부에선 급식시간에 맞춰 요리를 만들려면, #n빠르게 그리고 많이 만들 필요가 있어요."
2600203-65 = "개인적으로 어떤 방법이 뭐가 있을지, 고민해봤거든요?"
2600203-66 = "그러다가 마침내 획기적인 방법을 찾아냈답니다!"
2600203-67 = "에잇!"
2600203-73 = "[s] \"잠깐잠깐잠깐잠깐?!\""
2600203-74 = "네……? 선생님, 왜 그러시나요?"
2600203-75 = "[s] \"냄비에 재료를 한 번에 집어넣다니, 골고루 익지 않을 거야!\""
2600203-76 = "아, 야채에 따라 익는 시간이 다르니까."
2600203-77 = "그 점을 주의하란 말씀이신 거죠?"
2600203-78 = "[s] \"잘 알고 있네!\""
2600203-79 = "엣-헴! 급양부 부원으로서 그 정도야 당연히 알고 있어요~♪"
2600203-80 = "그리고 당연히, 제가 떠올린 획기적인 방법으로 해결할 수 있답니다!"
2600203-81 = "짜잔! 이걸 쓰면 되어요!"
2600203-82 = "[s] \"그건……. 휴대용 토치?\""
2600203-83 = "네, 가스레인지의 화력만으로 골고루 익히는데 문제가 있다면."
2600203-84 = "토치를 이용해서 양쪽으로 볶으면 되는 거예요!"
2600203-85 = "가스레인지와 토치를 합쳐서, 두 배의 화력으로 단숨에!"
2600203-86 = "[s] \"아니, 요리는 덧셈이 아니니까! 그건……!\""
2600203-87 = "에잇, 얍★"
2600203-90 = "(그러한 일련의 과정을 거쳐 드러난 참상은 그야말로 끔찍했다.)"
2600203-92 = "(학생 식당의 바닥 절반 이상을 뒤덮고 있는, 검게 탄 카레 가루…….)"
2600203-93 = "(가스레인지에서 활활 타고 있는 불꽃…….)"
2600203-94 = "(냄비에서 흘러 넘친 카레가 되다만 스튜가 마치 용암처럼 들끓고 있었다.)"
2600203-95 = "어, 어째서 또 다시 이런 일이……."
2600203-96 = "[s] \"아니……, 원인이라면 확실히 알 거 같은데.\""
2600203-97 = "저, 저는 그냥 학생들을 위해, 빨리 카레를 만들려고……."
2600203-98 = "[s] \"즉……. 정규 레시피가 아니라, 속도를 우선시했다는 거구나.\""
2600203-99 = "괘, 괜찮아요! 처음부터 다시 시작하면 되니까요!"
2600203-100 = "일단은 불부터 꺼야……!"
2600203-101 = "영차!"
2600203-102 = "[s] \"주리, 잠깐. 스톱......!\""
2600203-104 = "어머, 폭발로 스프링쿨러가……."
2600203-108 = "(그렇게 주리와 함께 물에 쫄딱 젖은 생쥐가 된 채, 오늘 어떤 방법이 잘못되었는지 열띤 토론을 나누었다.)"
