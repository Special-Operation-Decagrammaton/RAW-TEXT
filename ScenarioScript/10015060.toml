[translation]
10015060-1 = "6화;응원이라는 이름의 전차"
10015060-9 = "뭐야, 저 로봇? 엄청나게 단단한데?"
10015060-18 = "마키의 철갑탄이 장갑에 손상을 주기는커녕 모두 튕겨 나가 버렸어…… 도대체 무슨 소재를 쓴 거야?"
10015060-19 = "게다가 가속력도 엄청나서, 차체를 조준하는 것조차 쉽지 않군요."
10015060-21 = "엔지니어부 녀석들…… 그 짧은 시간 동안 무슨 괴물을 만들어 낸 거야?"
10015060-23 = "하하, 그렇게 말씀해 주시니 조금은 부끄럽네요."
10015060-24 = "하지만 의뢰를 받은 이상 허투루 일할 수는 없으니까……"
10015060-25 = "맡겨진 일은 언제나 최선을 다하는 게 우리 엔지니어부의 모토거든."
10015060-27 = "칭찬한 거 아니거든!!"
10015060-36 = "하아, 하아…… 추격은 따돌렸나?"
10015060-37 = "그나저나 저 로봇, 대단해……!"
10015060-38 = "역시 밀레니엄의 마이스터들이 만든 작품답다고 해야 할까……"
10015060-39 = "이 정도의 전투력을 갖춘 로봇이라면 얼마든지 학생들의 발을 묶어 둘 수 있겠어."
10015060-40 = "……그나저나 엔지니어부는 이런 무시무시한 성능의 전차를 대운동회의 어디에 쓰려고 했던 걸까?"
10015060-41 = "그건 이제 아무래도 상관없어. 대운동회에 대해 생각을 거듭해도 나쁜 기억만 떠오를 뿐이고……."
10015060-42 = "우선은 상대가 우리가 숨어있는 곳을 찾아내지 못하도록 계속 위협 기동을 하는 거야!"
10015060-48 = "우, 우왓! 이쪽으로 굴러온다!"
10015060-49 = "자, 잠깐, 마키. 밀지 마! 넘어진다고!"
10015060-51 = "우타하 부장, 저 전차를 무력화시킬 방법은 없어? 너희들이 만든 물건이잖아!"
10015060-52 = "미안하지만 지금 우리들의 힘만으로는 불가능해."
10015060-53 = "저 전차…… 아니, 응원 로봇의 외피는 어지간한 충격으로는 깨지지 않는 고경도 압연 장갑으로 이루어져 있거든."
10015060-54 = "네. 여러 겹으로 압연한 철판에 초고주파를 흘려 표면 경화 처리를 했거든요!"
10015060-55 = "수리가 어려운 게 단점이지만, 방어력만큼은 확실히 보장할 수 있어……."
10015060-57 = "……너희들은 왜 언제나 이렇게 엉뚱한 일에만 진심인 거야?"
10015060-58 = "처음에 범인들이 로봇을 해킹했던 것처럼 베리타스가 다시 제어권을 빼앗아오는 건 어려우려나……?"
10015060-59 = "제어에 사용되는 멀티채널에 간섭하여 주도권을 빼앗아오는 것도 가능하긴 하지만, 기체가 움직이고 있는 상황에서는 그다지 추천하고 싶지 않아."
10015060-60 = "전파 간섭으로 인해 명령이 혼선되어 기체가 폭주할 위험도 있으니까."
10015060-61 = "……그때는 정말로 그 누구도 처리할 수 없는 거대한 골칫덩이가 되고 말걸."
10015060-62 = "이렇게 된 이상 다량의 폭탄으로 궤도를 끊어내는 수밖에……"
10015060-63 = "중간에 끼어들어서 죄송합니다만, 그 안건은 재고를 부탁드리겠습니다."
10015060-67 = "궤도를 끊어낼 만큼의 강력한 폭약을 사용한다면, 그 폭발에 휘말려 다른 학생들이 다칠 위험도 있으니까요."
10015060-68 = "게다가 기능과 모양은 어찌 되었든, 지금 시점에서 가용할 수 있는 응원 로봇은 엔지니어부의 저 로봇뿐인 것 같으니……"
10015060-69 = "지금은 가능한 손상을 최소로 한 채 적 전차— 실례, 저 응원 로봇을 제압했으면 합니다."
10015060-70 = "하지만 10톤에 가까운 로봇을 무슨 수로 손상을 입히지 않은 채 제압해?"
10015060-71 = "성난 황소처럼 날뛰는 전차에 다가가서 목줄을 거는 건 피하고 싶습니다만……"
10015060-72 = "맞아, 우리가 무슨 카우보이도 아니고!"
10015060-73 = "카우보이라…… 후후, 그것도 재미있는 아이디어네요."
10015060-78 = "마침 좋은 생각이 하나 떠올랐는데, 다들 잠깐 손을 빌려주시겠어요?"
10015060-90 = "……그새 다들 어디로 간 거지? 포기했나?"
10015060-91 = "그럴 리가 없잖아. 세미나의 임원들이 이번 <황륜대제>에 들인 비용이 얼마인데, 겨우 이 정도의 방해로 포기하겠어?"
10015060-92 = "분명 녀석들은 지금도 우리 몰래 대운동회를 계속할 방법을 찾고 있을 거야."
10015060-93 = "어라? 저 학생은……"
10015060-100 = "우, 우와…… 드, 들켜버렸다……"
10015060-101 = "<황.반.모>의 눈을 피해 몰래 만국기를 가져가려던 계획이~"
10015060-103 = "……그런 화려한 옷을 입고 몰래 움직이는 게 가능할 리가 없잖아……"
10015060-105 = "트랙 크래셔, 바로 쫓아가!"
10015060-113 = "잠깐! 너희의 상대는 그쪽이 아니야!"
10015060-114 = "거기에 있는 그 전차…… 아니, 그 응원 로봇의 상대는 내가 대신하지!"
10015060-120 = "어라? 이번에는 다른 방향에서……?"
10015060-121 = "무슨 생각을 하고 있는지는 모르겠지만, 싸움을 걸어온다면 사양하지 않겠어!"
10015060-122 = "잠깐, 조심해. 뭔가 분위기가 이상해. 함정이 아닐까?"
10015060-123 = "게다가 그 앞에 만국기가 철조망처럼 잔뜩 가설되어 있는 데……"
10015060-124 = "괜찮아. 어차피 트랙 크래셔의 장갑을 관통할 수 있을 만한 무기는 이 근처에 없어."
10015060-125 = "게다가 겨우 저런 가는 철사 따위로 전차를 멈출 수 있을 리가……"
10015060-142 = "머, 멈췄다?"
10015060-143 = "어, 어째서……?!"
10015060-145 = "그건 제가 지금부터 설명해 드리겠습니다!"
10015060-146 = "바퀴 위에 연결한 궤도를 붙여 접지력을 높인 무한궤도는 지형의 영향을 거의 받지 않고 손쉽게 험지를 주파할 수 있지만, 기동륜과 궤도 사이에 이물질이 끼면 고장이 나기 쉽다는 단점이 있지요!"
10015060-147 = "때문에 이렇게 여러 단으로 설치한 와이어 위를 주행하게 되면, 와이어가 궤도에 빨려 들어가 주행 장애를 일으키게 됩니다!"
10015060-148 = "후후…… 도면상에서 궤도와 기동륜 사이에 와이어가 들어갈 수 있는 틈이 있는 것처럼 보여서 드린 의견이었는데, 과연 정답이었네요."
10015060-149 = "깃발 거치 용도로 주문한 이 특허 와이어는 인장력과 전단력이 뛰어나기 때문에 어지간해서는 잘 끊어지지 않는답니다."
10015060-150 = "엔진 고장까지 유발하지는 않겠지만…… 궤도 사이에 말려들어 간 와이어를 모두 일일이 제거하려면 꽤 시간이 걸릴 거예요."
10015060-152 = "아, 아무리 그래도 명색이 엔지니어부의 마이스터들이 만든 물건인데, 이런 단순한 트랩에 주행 불능이 된다는 게 말이나 돼?"
10015060-154 = "어…… 그러고 보니 그렇네요. 이런 치명적인 단점이 있었는데 어째서 개선하지 않은 걸까요?"
10015060-155 = "경사로를 쉽게 오르내릴 수 있는 기능은 넣어 달라고 요청받았지만, 철조망 지대를 개척할 수 있는 기능은 넣어 달라고 하지 않았으니까."
10015060-156 = "개발에 들어가는 비용은 무한하지 않거든. 효율적으로 기능을 선별해서 구현해야만 클라이언트를 만족시킬 수 있는 법이지."
10015060-157 = "……그걸 잘 아는 녀석이 응원 로봇에 15mm 기관포는 왜 달은 거야?"
10015060-158 = "무슨 소리야. 15mm 기관포는 로망이거든?"
10015060-160 = "괘, 괜찮아! 당황하지 마!"
10015060-162 = "설령 궤도에 이상이 생겼다고 해도 두꺼운 장갑과 기관포는 여전히 멀쩡하니까—"
10015060-169 = "……어?"
10015060-170 = "여기 계셨군요, 회원님."
10015060-172 = "우, 우와아아악?!"
10015060-174 = "스, 스미레 부장? 어, 어떻게 우리가 여기에 있는 걸 알고?!"
10015060-176 = "방치된 창고에서 목소리가 들리기에 혹시나 했더니…… 역시 다들 여기에 계셨군요."
10015060-177 = "아무리 작게 말씀하셔도, 제 귀에서는 벗어날 수 없습니다."
10015060-178 = "공을 굴려 가며 뛰는 운동은 여러 번 했었지만, 도망치는 공을 뒤쫓는 경험은 처음이라…… 평소에 안 쓰는 근육을 제법 단련할 수 있었군요."
10015060-179 = "아무래도 특별한 운동을 체험하게 해 주신 것에 대한 보답을 해야겠습니다."
10015060-183 = "그럼 지금부터, 특별 트레이닝을 개시하겠습니다!"
10015060-185 = "시, 싫어~!!"
