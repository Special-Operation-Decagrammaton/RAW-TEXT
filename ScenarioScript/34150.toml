[translation]
34150-1 = "제15화;남은 것"
34150-3 = "[ns1] \"미카…… 그만둬!!\"\n[ns2] \"지금은 이러고 있을 때가 아니야!\""
34150-4 = "……미안, 선생님. 나, 애초에 말 잘 안 듣는 나쁜 아이잖아?"
34150-5 = "……미안, 선생님. 나, 애초에 말 잘 안 듣는 나쁜 아이잖아?"
34150-6 = "선생님이 지금 무슨 상황인지는 대충 알지만…… 그 말을 따를 순 없어."
34150-7 = "나는 몇 번이나 선생님의 마음을 배신해 왔고…… 지금 한두 번 더 추가된다고 딱히 달라질 것도 없을 거고, 응."
34150-11 = "……."
34150-12 = "어떡하지? 또 도망쳐야 하나?"
34150-13 = "서, 선생님……."
34150-17 = "[ns3] \"일단 미카를 제압한다.\"\n[ns4] \"일단 미카를 쓰러트려 두자.\""
34150-20 = "……다행이네. 슬슬 열받기 시작했거든."
34150-22 = "어라……? 이 흐름은 어쩐지 내가 혼나는 분위기……?"
34150-23 = "정말이지, 미움받는 역할은 손해만 본다니까."
