[translation]
2003003-1 = "이것이야말로 새로운 미식이군요."
2003003-6 = "(운동회장 이곳저곳을 순찰하던 도중, 낯익은 얼굴과 마주쳤다.)"
2003003-7 = "[ns] \"어라, 하루나?\""
2003003-11 = "아, 선생님. 마침 잘 오셨습니다."
2003003-15 = "이거 한 번 드셔 보시겠어요?"
2003003-16 = "(하루나가 보라색의…… 알갱이…… 같은 것이 가득 올려진 스푼을 내놓았다.)"
2003003-21 = "[ns1] \"어라, 이건…… 블루베리?\"\n[ns2] \"식감이 엄청 신기하네. 톡톡 터져.\""
2003003-24 = "후후후……"
2003003-25 = "어떠신가요. 선생님. 신선한 경험이시죠?"
2003003-26 = "[s] \"확실히, 처음 맛보는 식감이야.\""
2003003-27 = "새로운 경험이야말로, 안일해지고 경직된 미식의 세계에 신선한 바람을 불어넣어 줄 중요한 요소……"
2003003-28 = "선생님을 대상으로 한 분자요리 시식은, 그야말로 성공적이라고 할 수밖에 없었네요."
2003003-29 = "이것으로 그 밀레니엄의 학생분도, 편히 눈을 감을 수 있겠지요……"
2003003-30 = "아니, 저 멀쩡한데요?"
2003003-31 = "[s] \"분자요리?\""
2003003-32 = "네. 그것이야말로 전통적인 요리법에서 탈피해, 완전히 새로운 방식으로 미식에 접근해 가는 미식 혁신의 최첨단……"
2003003-37 = "안녕하세요…… 선생님. 이번에…… 그, 노점을 열어 보기로 했는데요……"
2003003-39 = "(하루나가 들려준 이야기는 다음과 같았다……)"
2003003-46 = "저기……"
2003003-53 = "한 번 드셔 보시고 가세요…… 분자요리 시식 중입니다……"
2003003-59 = "분자요리라는 게 뭐지?"
2003003-65 = "글쎄. 여기 보이는…… 뭔가, 이상한 이 음식들 같은데?"
2003003-66 = "으음…… 가격이 조금 비싸네. 생긴 것도 어딘가 수상하고……"
2003003-67 = "다른 익숙하고 맛있는 것도 많은데, 굳이 이런 것까지 맛봐야 하는 생각도 드는구만. 타코야키라든가, 야키소바라든가……"
2003003-68 = "그 말을 들으니 타코야키가 먹고 싶어졌어. 조금 전에 괜찮아 보이는 가게가 있었는데, 어때?"
2003003-69 = "좋지. 어서 가자고."
2003003-75 = "아, 저기요!"
2003003-79 = "하아……또 허탕이야."
2003003-80 = "역시, 너무 과격한 시도는 환영받지 못하는 건가……"
2003003-86 = "어머나. 이건 뭐죠? 재미있어 보이는 요리네요."
2003003-87 = "!!!"
2003003-90 = "과연. 이것이 말로만 듣던 분자요리라는 것이군요."
2003003-94 = "이쪽은 과일주스를 마치 캐비어처럼 굳힌 것……"
2003003-95 = "네, 네! 염화칼슘을 녹인 물에, 알긴산나트륨을 섞은 주스를 조금씩 떨어뜨리면 이런 게 나오거든요!"
2003003-96 = "흥미롭네요. 다른 것은 없나요?"
2003003-97 = "다, 다음은…… 그래요."
2003003-98 = "수비드 조리법을 이용한 고기구이도 있어요!"
2003003-99 = "아하. 많이 들어 본 조리법이네요."
2003003-100 = "진공포장된 재료를 60도 정도의 물에서 장시간 저온 조리를 하면……"
2003003-102 = "단백질만이 정확하게 익어서 부드러운 촉감을 최대한 살릴 수 있죠!"
2003003-103 = "이 과일에서는 탄산음료처럼 톡 쏘는 맛이 나네요?"
2003003-104 = "탄산화 기법으로 표면을 처리했거든요! 과일 표면에 드라이아이스를 접촉시켜, 재료 속에 탄산을 주입하는 거죠!"
2003003-106 = "그렇게 하는 것으로 과일의 식감과 탄산음료의 식감을 동시에 즐길 수 있게 된 거군요. 놀랍네요."
2003003-107 = "확실히, 밀레니엄의 기술력이라면 고분자 화합 기술을 통해 특정한 맛을 추출하거나 극대화하는 것도 가능할 테니……"
2003003-113 = "(하루나는 그 뒤로도 그렇게, 분자요리의 개념과, 거기에 사용되는 공학적 공구들에 대해 주의 깊게 설명을 들었다고 한다.)"
2003003-116 = "그러던 참에, 선생님께서 마침 근처를 지나가고 계셨던 거죠."
2003003-117 = "이런 요리를 모두가 맛보지 못하는 것은, 미식적으로도 큰 손실이라 할 수밖에 없을 거예요."
2003003-118 = "미식의 길을 걷는 입장으로서, 정말로 슬프고 가슴 아픈 일이죠……"
2003003-119 = "[s] \"하지만 사람들이 낯설어하는 것은 어쩔 수 없었다는 거구나.\""
2003003-121 = "네…… 그 부분만 어떻게 된다면, 더 많은 사람이 우리 노점을 이용해 줄 텐데 말이에요……"
2003003-122 = "[s] \"뭔가, 좀 더 친숙한 분자 요리 같은 건 없을까?\""
2003003-123 = "친숙한 분자 요리……"
2003003-128 = "!!!"
2003003-129 = "왜, 왜 그러시죠?!"
2003003-131 = "[ns3] \"하루나의 눈매가…… 날카로워졌어!\"\n[ns4] \"이것은 하루나의 미식 센서가 발동했다는 증거!\""
2003003-134 = "그, 그런 건가요. 선생님?!"
2003003-135 = "[s] \"사실 그냥 말해 본 거야.\""
2003003-136 = "네, 네?!"
2003003-137 = "후후후……"
2003003-138 = "그렇다면 여기에서는, 솜사탕부터 시작해 보도록 할까요?"
2003003-140 = "솜사탕이요?"
2003003-141 = "그렇습니다. 분자 요리란, 식재료를 분자 수준에서 다른 질감으로 변화시켜 신선함을 꾀하는 요리 방식……"
2003003-143 = "그렇다면 단맛은 그대로 유지하면서, 가루인 설탕을 실의 형태로 변형해 기존의 설탕과 전혀 다른 질감을 느낄 수 있는 솜사탕 역시, 훌륭한 분자 요리라고 할 수 있겠지요!"
2003003-144 = "[s] \"역시 하루나의 미식 센서야!\""
2003003-146 = "아까는 그냥 말해 본 거라고 하셨잖아요?!"
2003003-153 = "한 번 드셔 보시고 가세요……"
2003003-154 = "솜사탕으로 시작하는 분자요리 시식이랍니다."
2003003-155 = "솜사탕, 좋아하시나요?"
2003003-157 = "솜사탕…… 그립구만."
2003003-158 = "마침 단 게 먹고 싶기도 했고. 하나 줄 수 있겠어?"
2003003-159 = "후후후……"
2003003-160 = "네. 그리고 여기, 솜사탕과 더불어…… 블루베리 캐비어 한 스푼, 어떠신가요?"
2003003-161 = "그건 또 뭐야?"
2003003-162 = "이상하게 생겼는데…… 이거 먹을 수 있는 거 맞지?"
2003003-163 = "걱정하지 마세요. 여차하면 여기 계신 선생님께서 보증해 주실 테니까요."
2003003-164 = "[s] \"괜찮습니다. 저도 먹어 봤거든요.\""
2003003-165 = "그렇다면 어디……"
2003003-172 = "어엇?!"
2003003-174 = "이 식감은 뭐지……?!"
2003003-178 = "여기가 그 분자요리인지 뭔지를 파는 곳이라면서요?"
2003003-179 = "벌써 30분도 넘게 기다렸는데도, 좀처럼 줄이 줄어들지 않네요……"
2003003-180 = "이렇게 많은 사람이 기다린다는 건, 그 자체로 광고가 되기도 하지만……"
2003003-181 = "기대가 되네요. 도대체 어떤 요리일까요? 분자요리라는 건."
2003003-186 = "어……"
2003003-187 = "노점이 잘 되길 바랐지만, 이렇게까지 잘 되길 바랐던 건 아니었는데요!"
2003003-188 = "무엇보다 분자요리의 단점인, 만드는 시간이 오래 걸린다는 것은 아직 해결되지 않았고요……."
2003003-189 = "후후후……"
2003003-190 = "미식의 길에는 이처럼 고난과 역경이 뒤따르는 법…… 오늘도 또 한 가지를 배우고 가게 되는군요."
2003003-191 = "[s] \"하루나 양. 거기에서 홀로 납득하셔도 말이죠……?\""
2003003-192 = "하지만 어떻게든 될 것 같아요. 대량 생산 방식만 엔지니어부에 부탁해서 어떻게든 해결한다면……"
2003003-193 = "분자요리를 더 널리, 많이 알릴 수 있을 거예요!"
2003003-194 = "고맙습니다. 선생님! 하루나 씨!"
2003003-196 = "어머나. 도움이 되었다니 다행이네요."
2003003-200 = "그러면 선생님. 저희는 이만 가 볼까요?"
2003003-201 = "[s] \"여기서 그냥 떠나 버리는 거야?!\""
2003003-202 = "미식의 색다른 길을 보다 많은 사람에게 널리 알린다는 목적은 달성했으니까 말이죠."
2003003-203 = "나머지는 저분이 스스로 해결할 문제이지 않을까요?"
2003003-204 = "무엇보다…… 이곳에서 맛볼 수 있는 것은 다 맛본 것 같으니 말이에요."
2003003-205 = "[s] \"그렇게 나오는 건가.\""
2003003-206 = "후후후…… 우리에겐 아직 다 정복하지 못한 가게들이 많습니다."
2003003-207 = "미식이란 신선한 음식에서도 찾을 수 있지만, 익숙한 음식에서도 물론 얼마든지 찾을 수 있는 법이니까요."
2003003-212 = "그러면, 선생님. 오늘도 마지막까지 함께 해 주실 거죠?"
