[translation]
1008302-1 = "저택을 지키는 고양이"
1008302-5 = "……이상이 우리 백화요란의 올해 분기별 훈련 계획 및 운영 일정이야."
1008302-6 = "이 문서를 참고해서 논의를 진행한다면 올해 샬레와 좀 더 긴밀한 업무 협조 관계를 유지하는 게 가능할 거야."
1008302-14 = "이쪽의 이야기는 이걸로 끝."
1008302-15 = "……질문이라면 받겠어."
1008302-16 = "[s1] \"음, 현재로선 딱히 없는 거 같아.\"\n[s2] \"자료도 설명도 이해하기 쉬웠고, 완벽했어.\""
1008302-19 = "그래."
1008302-20 = "[s] \"그 짧은 시간 안에 이 정도 완성도라니, 역시 키쿄야. 굉장한걸.\""
1008302-21 = "흥, 입에 발린 소리라면 됐어."
1008302-22 = "백화요란의 작전참모로서 이 정도는 기본 소양일 뿐이야."
1008302-23 = "……우리는 이제 막 다시 기지개를 켜기 시작한 거나 다름없으니까."
1008302-24 = "백화요란을 다시 예전처럼 부활시키기 위해 <이용할 수 있는 수단은 많으면 많을수록 좋은 법>. 샬레와의 업무 협력도 다 그 수단의 일환이란 거야."
1008302-25 = "갈 길은 멀어도 할 수 있는 것부터 차근차근히 해 나가는 수밖에."
1008302-26 = "[s] \"그래도 키쿄가 있으니, 백화요란은 안심이야.\""
1008302-27 = "……방금 내 말 들은 거 맞지? 수단이라고까지 언급했는데."
1008302-28 = "그래도 상관없다고?"
1008302-29 = "………나 참. 남 일이라는 듯이 쉽게 말하는구나. 당신은."
1008302-30 = "뭐, 그럼 됐어. 이것으로 볼일은 끝이야. 더 할 말이 없다면 자리를 파하겠어."
1008302-31 = "[s] \"아, 응. 그럼 오늘 수고했어. 키쿄.\""
1008302-32 = "…………."
1008302-33 = "뭐어……."
1008302-34 = "특별히 뭐가 어떻다는 건 아니지만."
1008302-35 = "당신도 여기까지 오느라, 제법 수고……."
1008302-44 = "……했어. 가는 길은 따로 배웅하지 않을 테니, 혹시라도 잊은 물건이 없는지 잘 챙겨서 돌아가도록 해."
1008302-45 = "[s] \"……저기, 키쿄 양. 갑자기 천장이 무너졌는데요.\""
1008302-46 = "그거라면 당신이 신경 쓸 필요는 없어."
1008302-47 = "잔말은 됐고, 나가는 길은 이쪽이니까."
1008302-51 = "아, 거기 잔해는 밟지 않도록 조심해."
1008302-52 = "괜히 걸려 넘어지기라도 하면 귀찮아지……."
1008302-59 = "[ns] \"키쿄 양?! 이번엔 키쿄가 밟은 바닥이 푹 하고 꺼졌는데?!\""
1008302-60 = "……말했다시피 이것도 별거 아니니까."
1008302-61 = "신경 쓸 필요는……."
1008302-67 = "[ns] \"아무리 봐도 별 게 아닌 게 아닌데?! 이게 다 어떻게 된 거야……?\""
1008302-71 = "………하아."
1008302-73 = "[ns] \"건물 자체가 노후화된 탓이라고?\""
1008302-74 = "……그래, 맞아."
1008302-75 = "조정실은, 백화요란이 설립된 이후로 계속해서 사용해온 건물이야. ……그런 곳이 이제껏 꽤 오랜 시간 방치되어 있었으니까."
1008302-76 = "옛 건물이라는 건 잠깐 사람의 손이 타지 않는 것만으로도 금방 낡기 마련이야."
1008302-77 = "눈에 보이는 곳이든, 보이지 않는 곳이든 여기저기 보수가 필요해졌다고 해도 놀랄 일은 아니란 거지."
1008302-78 = "다만 그건 어디까지나 우리 백화요란의 사정. 샬레의 선생인 당신이 신경 쓸 필요는 없어."
1008302-79 = "그러니 얌전히 돌아……."
1008302-80 = "[s] \"아니, 그럴 순 없어!\""
1008302-84 = "뭐?"
1008302-85 = "이미 망가진 것들을 봐 버린 이상…… 못 본 척할 수 없으니 고치는 걸 도와주겠다고?"
1008302-86 = "……왜?"
1008302-87 = "[s] \"왜냐니…….\""
1008302-88 = "애당초 건물을 고친다고 한들 당신에겐 아무런 이득도 없잖아?"
1008302-89 = "그런 일을 자진해서 한다고 해봤자, 당신과 같은 타인에겐 시간 낭비에 지나지 않을 텐데……."
1008302-90 = "왜 굳이 귀찮게 그런 식으로 참견을……."
1008302-91 = "[s] \"학생이 곤란해하면 돕고 싶으니까.\""
1008302-95 = "하아……. 그래."
1008302-96 = "뭐, 그렇게나 정성을 다해 참견을 하고 싶다면야 멋대로 해."
1008302-97 = "참고로 나는 백화요란 업무로 해야 할 일이 있으니까. 도와주지 않을 거야."
1008302-98 = "……내 맡은 바 업무가 끝나고 나면 직접 수리해 두려고 한 걸, 당신이 멋대로 고치겠다고 말한 거니까."
1008302-99 = "그래. 그런 거니까. 어디, 마음껏 참견하지 그래?"
1008302-100 = "[s] \"그래? 그럼 허락한 거지! 좋아! 맡겨만 달라고!\""
1008302-113 = "(이해가 안 돼.)"
1008302-114 = "(곤경에 처한 거라면 돕고 싶어……라든지, 학생이 곤란한 상황이라면 돕는 게 당연하잖아……라든지.)"
1008302-115 = "(결국 입에 발린 말에 불과하면서…….)"
1008302-116 = "(어차피 눈앞에서 맞닥뜨려 버린 상황을 못 본 척하기엔 체면이 있다 보니, 어쩔 수 없이 신경 쓰는 척을 하겠다. 같은 느낌으로 액션을 취했을 뿐이잖아?)"
1008302-117 = "(오랜 시간 방치된 이곳이 잠깐 돕는 정도로는 수리가 전부 끝날 리도 없는데.)"
1008302-123 = "……흥."
1008302-124 = "어차피 조금 하다가 제풀에 지쳐 떨어져 나갈 게 뻔하니까."
1008302-129 = "(그렇게 백화요란의 건물 이곳저곳을 수리하기 시작한 지 어느덧 5시간째가 되었을 무렵…….)"
1008302-135 = "[ns] \"바닥은 이 정도면 됐고, 다음은 천장 수리를 해볼까.\""
1008302-137 = "………잠깐, 아직도 계속하는 거야?"
1008302-138 = "[s] \"아? 응. 바닥은 어떻게든 끝내 놓았지만, 천장이 아직이라서…….\""
1008302-139 = "벌써 시간이 이렇게나 늦었는데? 대체 얼마나 한가한 거야. 당신."
1008302-140 = "처음부터 그러기로 약속하지 않았냐, 니……."
1008302-141 = "이 정도쯤은 괜찮아? 앞으로 3시간 안에 끝낼 자신이 있어. 라고……?"
1008302-142 = "……정말 어처구니가 없네."
1008302-146 = "…………."
1008302-147 = "좋아. 알았어."
1008302-152 = "천장을 수리하려면 여기, 이 도구를 쓰면 되는 거지? 사다리라면 내가 잡아줄 테니까."
1008302-153 = "필요한 도구가 있으면 뭐든 말해. 바로 밑에서 건네줄 테니까."
1008302-154 = "[s] \"어, 키쿄…… 일이 있어서 바쁘다고 하지 않았어?\""
1008302-155 = "………날 누구라고 생각하는 거야? 그거라면 이미 전부 끝냈어."
1008302-156 = "그리고…… 이대로 당신 혼자서 계속했다간 괜히 끝나는 시간만 늦어질 테니까."
1008302-157 = "지금부터는 나도 도울 거야."
1008302-158 = "[s] \"그래? 고마워. 그럼 사양하지 않을 테니까. 바로 힘내볼까!\""
1008302-159 = "……흥."
1008302-166 = "[ns] \"좋아, 이걸로 전부 끝이야. 고생했어. 키쿄.\""
1008302-167 = "………당신이야말로 고생했어."
1008302-168 = "정말…… 오늘 안에 이걸 전부 수리할 줄이야……."
1008302-169 = "인정할게. 나라는 작전참모가…… 사람을 조금 잘못 판단하고 있었던 모양이야."
1008302-170 = "[s] \"그렇게 말해주니, 살짝 낯부끄러운걸.\""
1008302-175 = "[ns] \"어쨌거나 이걸로 볼일은 끝났으니 그럼 나는 이만 돌아가 볼 테니까.\""
1008302-179 = "[ns] \"어…… 저기, 키쿄? 옷자락은 왜……\""
1008302-183 = "아."
1008302-187 = "……아니, 특별히 이유가 있어서 그런 건 아니야."
1008302-188 = "시간도 이미 이렇게나 늦어서 아슬아슬하게 저녁때도 지난 참이니까."
1008302-189 = "샬레로 돌아간 시점에선 아마 심야에 가까운 시간이 될 거 아냐."
1008302-190 = "그러니…… 오늘 백화요란 건물의 보수를 도와준 것에 대해 감사를 표할 겸."
1008302-191 = "……저녁 정도는 대접해 줄 수 있다……고."
1008302-192 = "그냥 그런 말을 하고 싶었을 뿐이야."
1008302-193 = "물론 좀 더 제대로 된 대가를 지불하는 쪽이 바람직할 테고, 당신으로서도 갑작스럽게 저녁을 대접받아 봐야 당혹스럽기만 할지도 모르지만──"
1008302-195 = "[ns] \"먹고 싶습니다. 키쿄의 저녁밥. 반드시 전력을 다해서!\""
1008302-199 = "……권한 사람이 말하기엔 조금 그런 말이긴 하지만. 그 정도로 기쁜 표정을 지을 일이야?"
1008302-200 = "아까부터 생각했던 거지만 당신이란 사람은 정말……."
1008302-201 = "조금, 이상해."
1008302-202 = "[s] \"……어?! 그런 말을 들을 정도로 이상해?!\""
1008302-203 = "……됐어."
1008302-204 = "가서 손부터 씻고 와."
1008302-210 = "당신이 충분히 만족할 정도로 정성 들인 저녁을 내어줄 테니까."
1008302-212 = "(그 뒤로도 백화요란과 샬레의 업무에 관련된 대화나, 자질구레한 신변잡기의 이야기 따위를 나누며 키쿄와 저녁을 함께했다.)"
