[translation]
21180-1 = "제18화;G.Bible"
21180-2 = "밀레니엄 게임개발부"
21180-4 = "G.Bible…… 실행!"
21180-6 = "[56cd7b]G.Bible의 세계에 오신 것을, 환영합니다."
21180-8 = "떠, 떴다!"
21180-9 = "[56cd7b]최고의 게임이란 무엇인가라는 질문에,#n[56cd7b]세상은 수많은 대답을 가지고 있습니다."
21180-11 = "[56cd7b]작품성, 인기, 매출, 탁월한 스토리텔링과 타격감, 소름 끼치는 연출력 등이"
21180-13 = "[56cd7b]최고의 게임의 '조건'으로 지목됩니다만,#n[56cd7b]그것들은 모두 '진리'의 곁가지에 불과합니다."
21180-16 = "[56cd7b]최고의 게임을 만드는 비결은 단 하나뿐이고,"
21180-18 = "[56cd7b]G.Bible은 바로 그 진리를 담은 책입니다."
21180-20 = "드, 드디어!"
21180-21 = "뭔가 굉장해 보여……."
21180-22 = "[56cd7b]최고의 게임을 만드는 단 하나의 비법,#n[56cd7b]지금 공개합니다."
21180-24 = "오오오!"
21180-25 = "[56cd7b]……"
21180-28 = "[56cd7b]……"
21180-30 = "[56cd7b] < 게임"
21180-32 = "[56cd7b]을"
21180-34 = "[56cd7b]사"
21180-36 = "[56cd7b]랑"
21180-38 = "[56cd7b]하"
21180-40 = "[56cd7b]라"
21180-42 = "[56cd7b]. >"
21180-44 = "오오…… 오프닝…… 인가 그럴듯한데?"
21180-45 = "그, 그런가?"
21180-46 = "[56cd7b]< 게임을 사랑하라 >"
21180-48 = "설마…… 끝…… 은 아니겠지?"
21180-49 = "뭐, 뭔가 잘못된 게 아닐까?"
21180-50 = "자, 잠깐만!"
21180-51 = "어디보자 설정 버튼이……."
21180-52 = "[56cd7b]< 게임을 사랑하라 >"
21180-56 = "[56cd7b](당신이 이 버튼을 눌렀다면,#n[56cd7b]파일이 깨졌거나, 무언가 잘못되었거나,"
21180-58 = "[56cd7b]오류가 났을 거라 의심하는 상황일 겁니다.)"
21180-60 = "오! 하긴 이대로 끝일 리 없지!"
21180-61 = "[56cd7b]하지만[wa:500] 끝입니다."
21180-63 = "지, 진짜로?!"
21180-64 = "[56cd7b]유감!"
21180-66 = "[56cd7b]< 게임을 사랑하라! >"
21180-69 = "그, 그럴 리 없어! 분명 뭔가 오류가……!"
21180-70 = "파일의 손상이나 수정 내용은 없어……. 가장 최근의 발견된 사본의 정보, 파일 크기 및 데이터 구성은 완전히 똑같아."
21180-71 = "그, 그렇다면…… 정말로……?"
21180-72 = "이걸로…… 끝?!"
21180-73 = "……마……"
21180-74 = "언니? 우리…… 아무래도…… 속은 것 같……."
21180-76 = "망했다아아아아!!!"
21180-78 = "(현재)"
21180-79 = "저기…… 모모이. 일퀘 안 하나요?"
21180-80 = "모모이는 항상 '일퀘는 목숨보다 중하다' 말했는데……."
21180-81 = "그만둬 아리스…… 내 HP는 이미 제로야……"
21180-82 = "으음……."
21180-83 = "미도리……."
21180-84 = "미안해 아리스 쨩…… 현실이란 원래 이래…… 그래…… 이것이 바로 트루엔딩인 거야……."
21180-85 = "아앗……."
21180-86 = "유, 유즈는…… 어디 갔지요?"
21180-87 = "다시 캐비닛 안에 틀어박혀 있을 거야. 봐봐. 캐비닛이 가끔 부들부들하지?"
21180-89 = "지금 모두의 모습은……"
21180-90 = "마치 정신줄을 로그아웃한듯한 모습입니다."
21180-91 = "크윽."
21180-92 = "어쩔 수 없잖아! 마지막으로 기대했던, 유일한 수단이었는데! 그게 사실은 저따위 다 아는 소리나 떠드는 문장 하나만 들어있었다니! 낚시도 정도가 있다구!"
21180-93 = "알아! 세상에 그런, 한 마디만으로 모든 것이 바뀌는, 그런 편리한 방법 따위는 없다는 거! 하지만 기대 정도는, 해도 되는 거잖아! 후에에엥!"
21180-95 = "후우……."
21180-96 = "미안 아리스 쨩…… 우리는…… G.Bible 없이는 좋은 게임을 만들 수 없어……. 무능해서 미안해."
21180-97 = "……"
21180-98 = "아니요."
21180-99 = "부정합니다."
21180-100 = "아리스는 테일즈 사가 크로니클을 할 때마다, 이렇게 생각합니다."
21180-101 = "재미있다고."
21180-102 = "응?"
21180-103 = "느껴지니까요."
21180-104 = "모모이가, 미도리가, 유즈가……"
21180-105 = "이 게임을 얼마나 사랑하고 있는지."
21180-106 = "그런 마음이 담긴 이 세계를 여행할 때마다……"
21180-107 = "……가슴이 뛰었습니다."
21180-108 = "동료들과 함께 새로운 세계를 여행한다는 그 감각은……"
21180-109 = "꿈을 꾼다는 게 어떤 감각인지, 어렴풋이 알게 해주었습니다."
21180-110 = "때문에 대망의 엔딩에 다가갈 때에, 그렇게 괴로워했으면서 처음 든 생각은……"
21180-111 = "이 꿈이 깨지 않았으면 좋겠다……."
21180-112 = "아리스는 오직, 그런 생각뿐이었습니다."
21180-113 = "아리스……."
21180-114 = "……."
21180-115 = "우왓. 유즈 쨩. 언제 나왔어?"
21180-116 = "얼마 안 되었어…… 테일즈 사가 크로니클 이야기를 할 때부터……"
21180-117 = "처음부터잖아!"
21180-118 = "만들자……."
21180-119 = "응?"
21180-120 = "내 꿈은, 내가 만든 게임을 사람들이 재미있다고 말해주는 거야."
21180-121 = "하지만…… 내가 처음 만든 테일즈 사가 크로니클 프로토타입은…… 약 네 자릿수의 악플과 조롱만 받고 끝났지……."
21180-122 = "괴로워서, 게임개발부 부실에 틀어 박혀 있을 때……"
21180-124 = "너희가 찾아왔어."
21180-126 = "(6개월 전)"
21180-129 = "[56cd7b]와. 이게 게임이냐."
21180-131 = "[56cd7b]이걸 만든 사람 머리에는 뭐가 있을지 궁금하다."
21180-133 = "[56cd7b]뇌 대신 뭐가 있을까. 아무것도 없겠지."
21180-135 = "[56cd7b]꼭 게임에 대해 알지도 못하는 것들이 게임 만든다고 까불더라."
21180-137 = "[56cd7b]좀 주제 파악을 했으면 좋겠음."
21180-139 = "[56cd7b]이건 게임을 만드는 게 아니라 게임인척 하는 쓰레기를 만든거임."
21180-141 = "으으……."
21180-142 = "그만해…… 잘못했어……."
21180-143 = "힘들어…… 제발…… 용서해줘……!"
21180-145 = "(쾅쾅쾅)"
21180-147 = "히익!"
21180-148 = "누, 누구지?"
21180-149 = "어, 저기! 그러니까! 여기가 테일즈 사가 크로니클 프로토타입을 만든 밀레니엄 게임개발부가 맞나요?"
21180-150 = "또, 또 욕하러 온 건가?"
21180-151 = "죄, 죄송합니다. 죄송합니다. 다시는 게임을 만들지 않을게요. 그러니 부디 용서를……!"
21180-152 = "히익?!"
21180-153 = "무슨 말이에요! 이렇게 재미있는 게임을 만들었는데! 아니 프로토타입만 만들고 그만두면 어떡해요!"
21180-154 = "이다음의 내용이 너무 궁금한데! 이렇게 설레게 해놓고! 당신이라는 개발자에게 실망했어!"
21180-155 = "……어?"
21180-156 = "저기요! 나는 테일즈 사가 크로니클이 너무 재밌었어요!"
21180-157 = "그건 사실이지. 밤새도록 했으니까."
21180-158 = "너도 그 옆에서 같이 깔깔대며 게임했잖아! 게임에 관심도 없었으면서!"
21180-159 = "어. 음. 도트인데도, 캐릭터들이 귀여워서 좋았어."
21180-160 = "어쨌든, 저기! 실례합니다!"
21180-161 = "(철컥!)"
21180-163 = "……?!"
21180-164 = "당신이 UZ 님?!"
21180-165 = "어. 어, 그, 그렇습니다."
21180-166 = "팬이에요!"
21180-167 = "저도! 미도리도! UZ 님처럼! 재미있는 게임을 만들고 싶어요!"
21180-168 = "……!!"
21180-174 = "……."
21180-177 = "……너희는 그렇게, 와주었지."
21180-178 = "그리고, 함께 테일즈 사가 크로니클을 만들고…… 올해의 쿠소게 1위에 올랐지만……."
21180-179 = "(뜨끔)"
21180-180 = "……."
21180-181 = "아리스가 찾아오고……"
21180-182 = "재미있다고 말해준, 그 순간부터…… 나의 꿈은 이루어졌어."
21180-183 = "마음이 맞는, 소중한 사람들과, 함께 게임을 만들고…… 그것이 재미있다는 소리를 듣는…… 그런 꿈 말야."
21180-184 = "……"
21180-185 = "그리고 이 꿈이…… 이대로 끝나지 않았으면 좋겠어."
21180-186 = "유즈쨩……."
21180-187 = "……으으으으으음!"
21180-188 = "미도리. 앞으로 밀레니엄 프라이스까지 시간이 얼마나 남아있다고 했지?"
21180-190 = "언니!"
21180-191 = "6일 하고도 4시간 38분입니다."
21180-192 = "충분하네."
21180-193 = "게임개발부!"
21180-194 = "테일즈 사가 크로니클 2 개발! 시작한다!!"
21180-196 = "오우!"
21180-198 = "다음화;더블오"
