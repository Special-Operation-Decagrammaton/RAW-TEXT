[translation]
41150-1 = "제15화;소소하지만 확실한 패배"
41150-2 = "코우사기 공원"
41150-6 = "설마 그 녹슨 미사일들을 갖고 싶어 하는 사람이 있을 줄이야…… 의외네요."
41150-7 = "시, 심지어 대금도 그 자리에서 모두 현금으로 건넬 줄이야……."
41150-8 = "나는 그렇게 많은 현금은 난생처음 봤어……."
41150-10 = "……그 거래 상대, 아무래도 수상해."
41150-11 = "얼굴을 꼭꼭 가린 채 나타난 것부터 시작해서, 무기의 상태도 제대로 보지 않고 엄청난 금액의 현금을 에누리 없이 건네다니……."
41150-12 = "우리가 받은 돈. 사실 어딘가의 검은돈이거나 위조지폐 같은 거 아냐?"
41150-13 = "돈의 출처야 아무렴 어때. 새로운 무기와 탄약을 구할 수만 있다면 그만이지."
41150-14 = "……그나저나 사키, 너는 왜 화력도 안 좋은 고체 연료랑 가솔린을 주문한 거야?"
41150-15 = "돈이 남으면 플라스틱 폭탄이나 몇 개 더 사지."
41150-16 = "너는 폭탄으로 밥을 짓고, 폭탄으로 헬리콥터를 돌릴 생각이야?"
41150-17 = "전장에서 화력이 무조건 제일은 아니거든?!"
41150-18 = "무슨 소리야, 전장에서 화력보다 더 중요한 게 어디에 있다고!"
41150-19 = "그래도 다행이네요."
41150-20 = "처음 이 공원에 도착했을 때만큼은 아니지만, 이번 거래 덕분에 폭우로 손실된 전력을 대부분 회복할 수 있었습니다."
41150-21 = "이로써 당분간 공원에 불청객들이 찾아온다 하더라도 무사히 격퇴할 수 있겠습니다……."
41150-23 = "헉, 헉…… 도, 도와주십시오……."
41150-35 = "어라, 벌써 침입자인가."
41150-36 = "새로 산 무기를 시험해 보고 싶었는데, 마침 침입자가 찾아오다니. 나이스 타이밍이네. 쿠히히……"
41150-38 = "그게 아니야! 도와 달라고 했잖아?!"
41150-39 = "……무슨 일이시죠?"
41150-40 = "저희는 원칙적으로 시민들의 사적인 분쟁에는 개입하지 않습니다만."
41150-41 = "맞아. 문제가 있으면 그 '소학교'인가 뭔가 하는 너희 동료들에게 도와 달라고 하면 되잖아?"
41150-42 = "<소확행>이야! <소유하지 않고도 확실한 행복을 찾는 모임>! 줄여서 소확행!"
41150-43 = "우읏…… 안타까운 일이지만, 소확행의 동료들은 모두 뿔뿔이 흩어졌습니다……."
41150-44 = "공안국을 위시한 발키리 경찰학교의 사악한 공권력이 수도자들을 무력으로 몰아내고, 소중히 쌓아 온 기물들을 파괴했으니까요!"
41150-45 = "……공안국?"
41150-46 = "공안국이 한가하게 노숙자들이랑 싸움이나 하고 있을 리가 없잖아?"
41150-47 = "겨, 경비국을 착각하신 게 아닌가요……?"
41150-48 = "착각이 아닙니다! 제 이 두 눈으로 똑똑히 보았습니다!"
41150-49 = "처음 보는 무기를 든 채 우리의 성소에서 날뛰던 그 <미친개>의 모습을요!"
41150-50 = "[s1] \"발키리 경찰학교의……?\"\n[s2] \"칸나 국장이……?\""
41150-55 = "……잠깐, 장갑에 난 그 탄흔 좀 보여줘."
41150-61 = "소이제로 인한 발화 흔적과 고경도의 코어가 직격한 흔적……"
41150-62 = "이건 평범한 탄이 아니라 [ruby=고폭소이철갑]HEIAP[/ruby]탄 같은데."
41150-63 = "[s] \"탄흔만 보고도 알 수 있는 거야?\""
41150-64 = "다는 아니지만, 교범에 나와 있는 정도라면."
41150-65 = "……저도 이 정도 구경의 HEIAP탄을 실제로 보는 건 처음인 것 같네요."
41150-66 = "응. 구조가 복잡해서 개인 화기에 쓰기엔 너무 비싸고 실용성도 떨어져서 키보토스 내에서는 거의 생산되지 않으니까."
41150-67 = "이런 걸 대량으로 생산할 수 있는 업체는……"
41150-68 = "<카이저 인더스트리> 정도려나."
41150-73 = "그럼 설마, <카이저 인더스트리>에서 대량으로 무기와 탄환을 사 갔다는 고객이 발키리 경찰학교인 거야?"
41150-74 = "하, 하지만 발키리 경찰학교에 이런 비싼 무기를 살 여유가 있을 리가……."
41150-80 = "게다가 요즘은 학교의 재정상황도 좋지 않아 탄환을 구입하는 것조차 어렵다고 하니……."
41150-81 = "이러다가는 치안을 담당하는 발키리 경찰학교의 무장이 제일 빈약해질지도 모르겠습니다."
41150-83 = "무슨 생각을 하고 계신가요, 선생님?"
41150-84 = "[s] \"잠깐 예전의 기억을 떠올리고 있었어.\""
41150-85 = "뭐야. 대낮부터 선 채로 낮잠이라도 자고 있었던 거야?"
41150-86 = "선 채로 꿈을 꿀 수 있다니 그것도 대단한 능력이네."
41150-87 = "여하튼, 사정은 딱하게 되었네요. 운 나쁘게 경찰의 수사망에 걸려들다니."
41150-89 = "운이 나쁘다니, 너희들에게도 남 일이 아니거든?!"
41150-90 = "그 공안국 녀석들, 우리뿐만 아니라 이 근처의 폐허를 순찰하며 노숙자들은 보이는 족족 모두 타운에서 쫓아내고 있다고!"
41150-91 = "이제 곧 녀석들이 이쪽으로 올지도—"
41150-96 = "……끄악!"
41150-106 = "……들짐승은 위기에 처하면 가장 힘이 센 우두머리 근처로 몰려들기 마련이지."
41150-111 = "덕분에 쓰레기 수거를 위해 돌아다니는 수고를 조금은 덜었군."
41150-113 = "다음화;리베이트"
