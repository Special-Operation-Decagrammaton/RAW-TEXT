[translation]
90000105-2 = "후퇴했어. 이렇게 되면 작전 실패……?"
90000105-3 = "아뇨. 도망치는 걸 막지 못한 건 아쉽지만…… 대미지는 확실하게 받았어요."
90000105-4 = "12시간까지는 아니겠지만 수복하는데 시간이 꽤 걸릴 거예요."
90000105-5 = "그런가? 그럼 이제 <연구지구>로 진입이 가능하다는 이야기?"
90000105-6 = "네. 케테르가 돌아오기 전까지는요. 아마 예상으로는 8시간 정도? 그 안에 저 연구지구 안에서 포착된 데카그라마톤의 신호를 찾아냅니다."
90000105-7 = "알겠어. 오늘은 철야 작업이겠네."
90000105-8 = "흔히 있는 일이죠."
90000105-9 = "그럼 연구지구로 진입합니다."
90000105-12 = "연구지구"
90000105-16 = "부장. <연구지구>에 무사히 도착했어."
90000105-21 = "주변에 별다른 위험 요소도 보이지 않아. 그냥 다른 폐허랑 다를 게 없어 보이는데……."
90000105-22 = "네. 생각보다 조용하네요."
90000105-23 = "하지만 이곳의 지형을 분석해보면 원래 수몰되어 있어야 하는 곳이에요."
90000105-24 = "그치만 여긴 물은 하나도 보이지 않는데?"
90000105-25 = "그렇죠. 이곳만 마른 땅으로 있다는 건…… 누군가 거대한 토목공사를 시행해서 이 지역의 물을 빼냈다는 뜻이겠죠."
90000105-26 = "……과연. 이쪽 지역에서 약 10km 떨어진 곳에 거대한 댐이 만들어져 있군요."
90000105-27 = "데카그라마톤이 한 거야?"
90000105-28 = "혹은 그 예언자가."
90000105-29 = "……그러네. 주변을 보니 확실히 한번 물에 잠겼던 흔적이 있어. 물이끼가 자란 흔적이 빌딩 중간까지 있고."
90000105-30 = "에이미. 저곳을 제 두 눈으로 직접 확인하고 싶어요. 일단 복귀하세요."
90000105-31 = "부장이 직접?"
90000105-32 = "네. 저는 그동안 탐색을 위한 준비를 끝내놓을 테니까요."
90000105-37 = "……그렇다고 하네. 일단 돌아가자."
90000105-38 = "케테르가 돌아오기 전까진 아직 시간이 있을 테니까. 뭐, 괜찮겠지."
90000105-40 = "다음화;데카그라마톤"
