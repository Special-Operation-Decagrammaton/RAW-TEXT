[translation]
1006303-1 = "판도라의 상자 1"
1006303-6 = "(샬레 당번으로 코유키가 찾아왔다.)"
1006303-7 = "오오오-!! 여기가 말로만 듣던 샬레 사무실!!"
1006303-8 = "……생각보다는 평범한 사무실이네요? 흐음~."
1006303-9 = "[s1] \"그야 평범한 사무실이니까…….\"\n[s2] \"뭘 기대한 거야.\""
1006303-12 = "에이~. 장난이에요, 장난. 선생님께서 일하시는 곳이니까 당연히 이런 분위기겠죠."
1006303-13 = "자, 근데 그럼 저는 뭘 하면 될까요? 당번 학생이라고 해서 오긴 했는데……."
1006303-14 = "간단한 계산은 할 수 있지만, 어딘가의 냉혹한 회계처럼 기괴한 계산 능력을 가진 건 아니니까요."
1006303-15 = "대신 심부름이든 뭐든 시키시는 대로 열심히 해보겠습니다!! 선생님의 지시니까!!"
1006303-16 = "[s3] \"의외로 의욕이 넘치네.\"\n[s4] \"놀고 싶어 할 줄 알았는데, 적극적이네.\""
1006303-19 = "하하……. 그야……. 당연하죠……."
1006303-20 = "밀레니엄에서 선배들이 시키는 것을 하는 것보다야……. 뭘 하든 재밌을 테니까요!!"
1006303-21 = "……네?"
1006303-22 = "여기 일도 지루한 건 세미나와 마찬가지일 거라고요?"
1006303-23 = "하하……. 선생님. 모르시는군요. 단순히 지루한 것의 문제가 아니라고요!! 이건!!"
1006303-24 = "거기서 제가 하는 일들은……. 말하자면 내용도 모르는 서류에 그저 도장만 찍어 넘기는 것과도 같은 일!"
1006303-25 = "같은 자리에서 계속 그런 일만 하고 있으면, 진짜 정신이 어떻게 돼 버릴 것 같단 말이에요!"
1006303-26 = "……구체적으로 어떤 일이냐고요?"
1006303-27 = "뭐, 잡다하고 별거 아닌 일들이죠? 학생이 잃어버린 비밀번호를 뚫어 주거나, 실수로 잠긴 보안 장치를 풀거나……."
1006303-28 = "오래돼서 누가 만든 건지도 잊어버린 코드의 접근방식을 찍어내거나……. 그런 쓸데없는 것들?"
1006303-29 = "[s5] \"하나같이 의미 있는 일들 아냐?\"\n[s6] \"굉장한 일을 하고 있었구나, 코유키.\""
1006303-32 = "……아닛! 정말!! 그런 반응을 원한 게 아니라고요!!"
1006303-33 = "제 입장에서는 정말 재미도 없고 감동도 없는 일이란 말이에요!"
1006303-34 = "그냥 앉아 있으면 뭔가 가져다주고, 이유도 모른 채 생각난 걸 쓰면 알아서 풀리고, 또 다음 걸 가져다주고, 또 풀고 또 가져오고……!"
1006303-35 = "저는 사람이지 자판기가 아니란 말이에요!! 이제 더는 그런 일들은 사양이에요!"
1006303-36 = "그럴 거면 저는 자유를 찾아 떠날 거라고요! 매번 실패하긴 하지만 말이죠!!"
1006303-37 = "……게다가 사람을 감금까지 하고!! 독방이니 반성실이니……! 무시무시한 밀레니엄 세미나!!"
1006303-38 = "[s7] \"뭐……. 사실 그 부분은 자업자득도 있지만…….\"\n[s8] \"사고만 안 치면 그렇게까진 안 할 거 같지만…….\""
1006303-41 = "선~생~님!! 여기선 제 편을 들어줘야죠!! 불쌍한 아이의 사연을 토로하는 장면이잖아요!?"
1006303-42 = "아무튼……."
1006303-43 = "뭐, 그런 이야기죠. 여기서 선생님이 뭘 시키시든, 적어도 세미나의 그런 일들보다는 저에게 재미있을 거다- 그런 이야기였어요."
1006303-44 = "……그래서? 시키실 일이라도 있나요? 혹시 여기서도 암호를……."
1006303-45 = "……네?"
1006303-46 = "그런 일은 안 시키신다고요? 오히려 여기 암호들은 풀어버리면 안 된다고요? 아하……."
1006303-51 = "……왜요?"
1006303-52 = "[s9] \"……왜요……라고????\"\n[s10] \"여긴 샬레잖아……. 밀레니엄이 아니니까?\""
1006303-55 = "흐응……."
1006303-56 = "……그런……가? 그걸로 되나……?"
1006303-57 = "뭔가 답이 안 되는 느낌인데요. 혹시 제가 알면 안 되는 거라도 있나요?"
1006303-58 = "……아주 많다고요? 그게 뭔데요??"
1006303-59 = "[s11] \"뭐냐니…….\"\n[s12] \"말할 수 있으면 기밀이 아니잖아.\""
1006303-65 = "흐응……. 그건 그렇네요."
1006303-66 = "……흐흐응……."
1006303-67 = "[ns13] \"……저기, 코유키 씨?\"\n[ns14] \"너 또 이상한 생각하고 있지.\""
1006303-70 = "? 아, 아뇨? 아무것도? 딱히? 그다지? 전혀?"
1006303-71 = "딱히 뭐 봐야겠다거나~"
1006303-72 = "그런 생각 전혀 하지 않았거든요? 안 했거든요?"
1006303-73 = "아마도?"
1006303-74 = "아무튼……. 뭔가 오늘은 딱히 일이 없는 거 같으니……."
1006303-75 = "저는……."
1006303-76 = "오늘……."
1006303-77 = "이만……."
1006303-78 = "물러가……. 보겠습니다……. 선생님……. 나중에 또 올게요……."
1006303-79 = "[s15] \"코유키, 잠깐…….\"\n[s16] \"아니. 명백히 수상하잖아. 지금 행동…….\""
1006303-83 = "그럼 좋은 하루 되세요!!!!!"
1006303-88 = "[ns] \"………….\""
1006303-98 = "(사무실 내 보안을 모두 최고 등급으로 교체하였다.)"
