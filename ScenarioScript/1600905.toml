[translation]
1600905-1 = "닌자 소녀는 숨기지 않아"
1600905-2 = "(그렇게 되어 미치루와 함께 닌자 굿즈……가 아니라, 인법 도구를 팔고 있다는 가게로 향하게 되었다.)"
1600905-6 = "선생 공. 이쪽이야. 이쪽-"
1600905-13 = "아, 도착했다. 바로 여기야. 내가 말했던 단골 가게라는 곳이."
1600905-14 = "[s] \"여기는…… 노점상? 굿즈 가게라고 하기엔 조금 특이하네.\""
1600905-15 = "우냐핫- 그렇지? 알음알음 아는 사람들 사이에서만 알려진 숨겨진 가게라고나 할까……."
1600905-16 = "……라기보다도! 굿즈 가게가 아니라, 어디까지나 인법 도구를 파는 가게라니까?!"
1600905-17 = "응? 이거 누군가 했더니, 항상 찾아와 주는 닌자 코스프레 아가씨로구먼? 오늘은 데이트?"
1600905-18 = "[s] \"바로 알아볼 정도의 단골이구나……. 안녕하세요.\""
1600905-19 = "데, 데, 데, 데이…… 투우?!"
1600905-20 = "오늘은 어쩐 일인 감? 아, 어제 새로 들어온 굿즈를 보려고? 이야~ 역시나 아가씨. 보는 눈이 있는걸?"
1600905-21 = "와핫핫! 마침 이번에 나온 게 진짜 진국이라서 말이야. 한 번에 불꽃을 엄청 멋지게 뿜어내는 녀석인데……. 코스프레 촬영에 이만한 게 없다고 자부할 수 있지!"
1600905-22 = "아니, 그러니까 코스프레가 아니라니까!"
1600905-23 = "아, 저번에도 몇 번 그런 말을 했었지. 대충 그런 설정이라고 했던가?"
1600905-24 = "가끔 있지. 그런 까다로운 아가씨들이. 댁도 고생이겠어?"
1600905-25 = "[s] \"아니, 그렇게까지 고생은…….\""
1600905-26 = "우캬앗!"
1600905-27 = "흠흠. 그렇다 한들 고객의 요구에 어울려주는 것 또한 판매자로서의 상도인 법……. 그러니까 흠흠."
1600905-28 = "……여기는 코드네임 제로써-틴. 마드모아젤. 무엇을 필요로 하나?"
1600905-29 = "아우----웃! 완전 아웃! 틀려! 그건 장르가 다르다고! 전혀 닌자가 아니잖아!"
1600905-30 = "아- 물론 넓은 의미로 보면 첩보물도 닌자라고 볼 수 없는 여지가 없는 건 또 아니지만!"
1600905-31 = "[s] \"미치루의 바운더리, 너무 넓지 않아?\""
1600905-32 = "껄껄껄. 뭐, 구경하고 싶은 만큼 구경하면서 데이트를 즐기라고! 아가씨도, 댁도."
1600905-36 = "[ns] \"그렇대.\""
1600905-37 = "우, 우냐악! 그러니까 데, 데, 데이트가 아니라……! 어디까지나 공부를 위해……! 지, 지, 진짜, 뭐냐고오!"
1600905-38 = "후우……. 후우……. 심호흡. 심호흡……"
1600905-39 = "좋았어. 나는 이래 봬도 인법연구부의 부장! 겨우 이까짓 일로 당황하진 않으니까!"
1600905-40 = "여기선 명경지수와 같은 마음으로……."
1600905-41 = "응? 어, 어엇?!"
1600905-45 = "………우, 우와아, 선생 공! 이거 봐! 이거! 굉장하지 않아?!"
1600905-46 = "[s1] \"명경지수는 어디로?!\"\n[s2] \"그건 기관총이네? 그게 왜?\""
1600905-47 = "뭣이?! 이걸 보고 '기관총이네?' 하고 만다니, 믿을 수가 없어! 선생 공! 그건 아니지~!"
1600905-48 = "뭣이?! 이걸 보고 '기관총이네?' 하고 만다니, 믿을 수가 없어! 선생 공! 그건 아니지~!"
1600905-49 = "이건 평범한 기관총이 아니야! 삼색고양이 냥고로 감독 작품에서 자주 소품으로 나오는 저주받은 마의 기관총 <요총 무라마틀링>이야!"
1600905-50 = "무려 기관총을 손에 쥔 사람을 마의 소울을 지닌 고대의 에인션트 닌자로 타락시킨다는 전설적인 물건!"
1600905-51 = "아, 물론 삼색고양이 냥고로 감독 작품에서도 세계관을 넘나들며 시도 때도 없이 튀어나오는 어처구니없는 등장 빈도 때문에 팬들 사이에서도 호불호가 갈리긴 하지만……."
1600905-52 = "그래도 이 정도의 완성도라니……. 굉장해! 사고 싶어! 얼마지?!"
1600905-53 = "뭐?! 200만 엔?!"
1600905-54 = "으읏…… 이, 이건…… 아쉽지만……… 어쩔 수 없……. 응?"
1600905-58 = "앗! 이건 카이견컹컹 감독 작품의 초기작 포스터잖아?! 진품인가?! 진짜루?! 뭐냐고! 그 가게 주인장의 취향……! 얕볼 수가 없다니까."
1600905-59 = "앗! 그리고 또 저건……!"
1600905-60 = "(그렇게 미처 말릴 틈도 없이 미치루는 이곳저곳을 기웃거리며 감탄을 쏟아 내기 시작했다.)"
1600905-62 = "후아아아~~ 진짜 굉장한 물건들로 가득하네! 어딜 봐도 전혀 질리지 않아! 생각 같아선 여기에서 몇 시간, 아니 하루 종일이라도 있을 수 있겠어!"
1600905-63 = "[s] \"미치루, 엄청 즐거워 보이네.\""
1600905-64 = "우냐나하핫! 그야 어쩔 수 없는걸. 여긴 완전 보물창고나 다름없다니까! 군침이 흐르는 걸 멈출……."
1600905-65 = "……핫?! 아, 그, 그게…… 미, 미안. 선생 공! 그…… 내가 너무 흥분한 나머지. 그게."
1600905-66 = "같이 오자고 먼저 권한 주제에, 기, 기분 나쁘게 혼자 떠들어대기만 하고, 그게 그러니까-"
1600905-67 = "[s3] \"아냐. 미치루가 즐거워하는 걸 보니 나도 즐거운걸.\"\n[s4] \"마구 플러스 에너지가 느껴지는 느낌이야.\""
1600905-68 = "어?! 그, 그래……? 우, 우헷. 우헤헷……. 프, 플러스 에너지~? 이야~ 이거, 쑥스러운데. 아, 물론 내가 평소에도 파이팅이 넘치기는 하지만-"
1600905-69 = "어?! 그, 그래……? 우, 우헷. 우헤헷……. 프, 플러스 에너지~? 이야~ 이거, 쑥스러운데. 아, 물론 내가 평소에도 파이팅이 넘치기는 하지만-"
1600905-70 = "[s] \"미치루를 보고 있으면 질리지가 않는달까.\""
1600905-71 = "그, 그렇게 말하니까. 왠지 부끄러운데?!"
1600905-72 = "뭐, 그래도, 그……. 이렇게 옆에 있어 주고, 같이 다녀 주는 건, 그……. 기쁘다고 할지……."
1600905-73 = "케케케! 이건 또 뭐야? 닌자 굿즈? 이딴 걸 어따 써먹는다는 거야? 키히히!"
1600905-74 = "……응?"
1600905-79 = "케헤헤헤! <초심자용 수리검 세트>으으으? <1분이면 폭발! 간편 연막탄 번들>이라고오오~~?"
1600905-80 = "대체 이딴 쓰레기 같은 걸 누가 돈 주고 산다는 거야? 바보냐고- 킬킬킬!"
1600905-81 = "완전 구려~!"
1600905-83 = "[ns] \"뭔가 시끄러운 사람들이네……. 응? 미치루?\""
1600905-84 = "아, 아이에에에?! 부, 부, 불량배?! 어째서?! 불량배?!"
1600905-89 = "[ns] \"……저기, 미치루? 괜찮아?\""
1600905-90 = "후우……. 하아……."
1600905-91 = "핫! 소생씩이나 되는 몸……. 자, 잠시 평정을 잃었소이다만. 지금은 괜찮소. 선생 공. 다시금 소생은 명경지수와도 같은 마음을 되찾아,"
1600905-92 = "되찾, 찾아차자차차차찾……."
1600905-93 = "[s] \"몸하고 말꼬리가 엄청 흔들리고 있는데.\""
1600905-94 = "우냐앗! 그, 그도 그럴게! 왜 불량배 녀석들이 나의 성지에 나타난 거냐구웃?!"
1600905-99 = "선생 공! 지금도 저길 봐! 아무렇지나 않게 굿즈를 두드리면서, 저, 저저! 닌자에 대한 애정이나 존중은 하나도 보이지 않는 거친 손놀림을!"
1600905-100 = "지인-짜! 닌자라고는 하나도 모르면서, 구리다느니, 시대착오적이라느니 있는 말, 없는 말이나 잔뜩 해대기나 하고 말이야!"
1600905-101 = "쉿쉿-! 저리 가! 얼른 사라지라고!"
1600905-102 = "[s] \"미치루, 거긴 벽이야.\""
1600905-103 = "아…… 그게……. 우으……. 지, 직접 얼굴을 맞대고 이야기하는 건, 그게 좀. 껄끄럽다고나 할까-"
1600905-104 = "아니, 그, 그러니까! 불량배들한테 다짜고짜 큰소리를 치는 건 리스크가 크다고나 할까."
1600905-105 = "그, 그게! 어디서 어떻게 될지 모르는 거니까! 응! 역시, 그게 좀……!"
1600905-106 = "……으응, 아니, 이런 식으로 변명을 해봤자. 그게, 실은 나도 알고 있지만……."
1600905-107 = "선생 공이 보기에도……. 그게."
1600905-108 = "……역시, 한심하지? 앞에 나서지도 못한 주제에, 입으로만 이런 말을 하기만 하고……."
1600905-109 = "[s5] \"아니, 겨우 그런 걸로 한심한가, 아닌가가 갈리지는 않아.\"\n[s6] \"실제로 한심한 짓을 하는 건 소동을 일으키는 저쪽이고.\""
1600905-110 = "아, 선생 공……."
1600905-111 = "아, 선생 공……."
1600905-112 = "케헤헤! 이건 또 뭐야? 마의 기관총? 무라마틀링? 캬하하! 장난하냐~! 웃기고자빠졌넴마!"
1600905-113 = "……?!"
1600905-115 = "응? 이걸 쥐면 마총에게 지배를 당해? 에인션트…… 닌자 소울? 무슨 헛소리야?"
1600905-116 = "케헤헤! 이러다가 마의 기관총에게 지배당하는 거냐고~! 어디 지배해 보라고~!"
1600905-117 = "킬킬킬, 닌자라니 그딴 구린 걸 누가 좋아하냐고~! 까고자빠졌넴마-!"
1600905-118 = "그럼 어디 시험 삼아 한번 쏴 볼……."
1600905-120 = "까고 자빠진 건 네 녀석들이다-!!"
1600905-125 = "쿠, 쿠어어억?! 어, 언 놈이냐!"
1600905-126 = "내가 누구냐고?! 잘 기억해두라고! 불량배 녀석들아! 나는 다름 아닌 인법연구부의 부장! 최강의 닌자 소울을 가진 치도리 미치루!"
1600905-127 = "의, 의미를 모르겠거덩?!"
1600905-128 = "네놈들이 들고 있는 그 기관총이 얼마나 대단한 물건인지 알아보지도 못하는 주제에-! 함부로 다루다가 망가트리기라도 하면 어쩌려고 그래?!"
1600905-129 = "가, 갑자기 총을 쏜 건 오히려 네놈……."
1600905-131 = "문답무용! 미치루류 인법을 보여주마! 닌자 디스트로이이이!!"
1600905-141 = "크윽, 두, 두고 보자……! 인법연구부의 부장!"
1600905-142 = "네놈의 얼굴, 평생 기억해두마!"
1600905-143 = "어?! 아니, 그건 좀! 봐주라?!"
1600905-147 = "……괘, 괜찮은 걸까?! 얼굴을 기억한다는데?!"
1600905-148 = "나, 앞으로 밤길 괜찮은 거 맞지?!"
1600905-149 = "[s] \"괜찮아. 고생했어. 미치루.\""
1600905-150 = "아, 아니, 에, 에헤헷. 고, 고생이랄 것까지야……. 그냥 불량배 녀석들이 굿즈를 함부로 다루니까. 나도 모르게 열이 뻗쳐서……."
1600905-151 = "[s] \"역시 닌자 도구가 아니라 굿즈였구나.\""
1600905-152 = "선생 공, 이제 와서 그런 이야기?!"
1600905-153 = "이거 참~ 잠깐 소란이 일길래, 뭔가 했더니. 단골 아가씨가 멋지게 해결해 줬구먼. 고마우이. 아가씨."
1600905-154 = "우햐핫. 뭐어, 별말씀을……"
1600905-155 = "그래도 방금 걸로 아가씨의 애정이 얼마나 깊은지 알게 됐으니, 기념으로 이 굿즈를 주도록 하지."
1600905-156 = "뭐?! 아저씨?! 내가 살짜쿵 엄청 멋지게, 굳이 말하자면 우리 채널에 영상으로 찍어 올리고 싶을 정도로 활약하긴 했지만."
1600905-158 = "200만 엔짜리 무라마틀링을 그렇게 시원스레 넘겨줘도 되는 거야?!"
1600905-160 = "응? 아니, 아무리 그래도 그건 못 주고."
1600905-161 = "[s] \"미치루, 아쉽게 됐네.\""
1600905-162 = "우, 우햐앗?! 사, 사람을 착각하게 만들지 말라구웃?!"
1600905-163 = "자, 이번에 새로 입고된 굿즈다. 다시 한번 말하지만 도와줘서 고맙다. 너희 같은 팬이 있으니 우리 가게가 의미를 지니는 법이지. 앞으로도 잘 부탁한다."
1600905-164 = "아……."
1600905-165 = "[s7] \"와, 잘 됐잖아. 미치루. 불량배들도 물리치고, 원하던 굿즈도 얻었고.\"\n[s8] \"역시 치도리 미치루. 인법연구부의 부장다운 활약이잖아!\""
1600905-166 = "그렇게 콕 집어서 말하면, 그, 엄청나게 부끄럽거든. 선생 공?!"
1600905-167 = "그렇게 콕 집어서 말하면, 그, 엄청나게 부끄럽거든. 선생 공?!"
1600905-168 = "하, 하지만……."
1600905-169 = "……응! 어쨌거나 해피엔딩이란 것으로! 우, 우햐핫~!"
1600905-171 = "(그 뒤로 미치루와 함께 조금 더 쇼핑을 즐기며 시간을 보냈다.)"
