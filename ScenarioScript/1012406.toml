[translation]
1012406-1 = "여름 하늘의 검은 새"
1012406-2 = "(잠깐 쉬는 사이에 밤바다는 완전히 어두워졌다.)"
1012406-6 = "(호텔 쪽에서 하스미가 다가오는 모습이 보인다.)"
1012406-10 = "선생님. 여기 계셨군요."
1012406-11 = "꼭 저녁 이후 한가할 때 불러달라 하셔서…… 그래도 너무 늦었을까요?"
1012406-12 = "[s1] \"아니야, 오히려 딱 좋아.\"\n[s2] \"지금 정도가 아니면 안 되니까.\""
1012406-15 = "안 된다……? 뭔가 하실 예정인가요?"
1012406-16 = "하지만 지금처럼 늦은 시간에는 딱히 아무것도……."
1012406-17 = "[s3] \"후후후…… 서툴러……!\"\n[s4] \"욕망을 해방하는 방법이 너무 서툴러……!\""
1012406-20 = "서, 선생님?"
1012406-21 = "[ns5] \"짜잔!\"\n[ns6] (준비해온 불꽃놀이 세트를 꺼낸다.)"
1012406-24 = "그건…… 불꽃놀이인가요?"
1012406-28 = "오늘 하루 동안 선생님과 바다에 와서 할 수 있는 모든 일을 해봤죠."
1012406-29 = "모래성을 만들었고, 모래찜질을 하고, 수영에, 수박 깨기, 비치 발리볼……은 하지 못했지만."
1012406-30 = "그리고 불꽃놀이까지."
1012406-34 = "……전부 제 기억에 있는 목록이네요."
1012406-35 = "[s7] \"맞아. 누군가 하고 싶었던 일들이야.\"\n[s8] \"당사자는 다른 사람을 위해 양보했지만.\""
1012406-38 = "……정말 사소한 것들이었어요."
1012406-39 = "오래 고민하지도 않았고, 이런 것들이 있다지, 하는 느낌으로 적어 내려간."
1012406-40 = "기억할 만한 것도 아닌데……."
1012406-41 = "[s9] \"그래도 하스미가 생각한 '최고의 여름 바다'잖아.\"\n[s10] \"그런 여름 바다를 선물해 주고 싶었어.\""
1012406-46 = "[ns] \"항상 고마워, 하스미.\""
1012406-47 = "……선생님께서는 정말 나쁘신 분입니다."
1012406-48 = "[s11] \"앗, 시작했다.\"\n[s12] (하늘에 수놓은 불꽃을 바라본다.)"
1012406-54 = "[ns] \"아름답네.\""
1012406-56 = "네, 정말로……."
1012406-57 = "눈을 뗄 수가 없이……."
1012406-59 = "(사 온 불꽃이 다 떨어질 때까지, 둘이서 불꽃놀이를 감상했다.)"
1012406-61 = "즐거운 시간은, 정말 순식간에 지나가네요."
1012406-62 = "욕심을 말하자면, 다시 현실로 돌아가고 싶지 않을 정도예요."
1012406-63 = "[s] \"그것까지 포함해서, 여름 바다인 거지.\""
1012406-64 = "후후. 그렇네요. 몰랐어요. 여름 바다란 게 이렇게 즐거운지."
1012406-65 = "다음 여름에는 업무가 아니라, 정말로 놀러 오고 싶네요."
1012406-66 = "[s13] \"재밌었던 거 같아서 다행이네!\"\n[s14] \"열심히 준비한 보람이 있어!\""
1012406-69 = "네, 물론, 여기서 한 모든 일이 다 즐거웠지만."
1012406-70 = "무엇보다, 누구와 함께했는지가, 중요하니까요."
1012406-71 = "그러니, 다음 여름에도……."
1012406-72 = "아니요, 아무것도 아닙니다. 이건 너무 욕심부리는 거겠죠."
1012406-77 = "……선생님, 돌아가실까요?"
