[translation]
90102080-1 = "제8화;친구를 찾습니다"
90102080-3 = "뭐? 미야코 쨩이랑 만났었다고?"
90102080-4 = "미야코 쨩과……?"
90102080-5 = "미야코 소대장이랑?!"
90102080-9 = "음. 역에서 탐문을 하던 중 어쩌다 보니 마주치게 되었다."
90102080-10 = "우연히도 츠키유키 소대장 또한 이번 실종 사건을 독자적으로 조사하던 모양이었고……"
90102080-11 = "덕분에 소문의 열차를 직접 목격했다는 학생과 약속을 잡을 수 있게 되었지."
90102080-12 = "직접 만나 이야기를 들어보면 중요한 단서를 확보할 수 있을지도 몰라."
90102080-13 = "그런가…… 뭔가 아쉽네."
90102080-14 = "목격 정보를 확보했는데, 뭐가 아쉽다는 말이지?"
90102080-15 = "내 말은 미야코  말이야! 나도 미야코랑 이야기하고 싶었는데……"
90102080-16 = "나도. RABBIT 소대의 후배들과 직접 이야기한 지도 꽤 오래된 것 같은데."
90102080-17 = "우리 소심한 저격수 후배님은 잘 지내고 있으려나~"
90102080-18 = "나도 아쉬운 건 마찬가지지만, 지금은 작전중이니까."
90102080-19 = "작전이 모두 끝나면 정식으로 후배들에게 인사를 하러 가자."
90102080-20 = "그래. 모든 것이 끝나면 이야기할 기회가 있을 거야."
90102080-21 = "우리의 과거와도, 그리고 미래와도."
90102080-27 = "저기…… 미야코 양에게 이야기를 듣고 왔는데요."
90102080-28 = "혹시 미야코 양이 말한 해결사 일을 하신다는 선배님들이 맞으신가요?"
90102080-29 = "아, 네가 사라진 친구를 찾아달라고 부탁했다는 그 학생이구나?"
90102080-30 = "어서 와. 후배님의 소개로 찾아왔으니, 최선을 다해 찾아줄게."
90102080-31 = "우선은…… 그 사라진 친구에 대한 이야기부터 해볼까?"
90102080-32 = "네, 넵!"
90102080-35 = "타카하시는 어릴 적부터 늘 저와 함께였어요."
90102080-36 = "같은 동네에서 살며, 같은 학교에 진학했고, 등하굣길도 언제나 함께 했었죠."
90102080-37 = "하지만 저희가 다니던 히아신스 학원이 갑작스럽게 폐교되는 바람에, 저희는 다른 학원으로 흩어지게 되었어요."
90102080-38 = "그러고 보니 전에 히아신스 학원이 폐교될 예정이라는 기사를 본 적이 있어."
90102080-39 = "학생이 없는 것도 아니었는데, 히아신스 학원은 어째서 폐쇄된 거야?"
90102080-40 = "저도 자세히는 모르지만, 뭔가 재정적인 문제가 있었던 것 같아요."
90102080-41 = "매년 신입생의 숫자가 줄어들자 학원의 경제 상황도 악화되었고……"
90102080-42 = "히아신스 학원은 재단의 이익을 위해 운영되었던 사립 학원인 만큼, 학생회에서도 반대할 명분을 찾지 못했던 모양이에요."
90102080-43 = "그렇다 하더라도 돌이켜 보면 아쉬움이 많이 남네요. 학원이 폐쇄되지 않도록 뭐라도 해볼걸……"
90102080-44 = "으음…… 확실히. 갑자기 학원이 없어진다면, 받아들이기 어려운 게 당연하지."
90102080-45 = "알아, 알아. 우리도 비슷한 기분이었으니까."
90102080-46 = "혹시 여러분도 다니던 학원이 폐쇄된 적이 있으신가요?"
90102080-47 = "어…… 폐쇄되었다고 해야 할까……"
90102080-48 = "말하자면 복잡한데……"
90102080-49 = "그래서, 친구가 실종된 건 언제였지?"
90102080-50 = "아, 네. 그러니까 지난주 금요일이었어요."
90102080-51 = "그동안 저와 타카하시는 오랫동안 연락을 주고받지 못했거든요. 만나기 어려우니 점차 연락도 뜸해졌고, 저도 새 학교에 적응하느라 한동안 신경 쓰지 못했는데……"
90102080-53 = "월요일 저녁, 갑자기 타카하시로부터 '과거로 가는 열차가 도착했어' 라는 의미를 알 수 없는 문자를 받았어요."
90102080-54 = "그게 무슨 뜻이냐고 물었지만, 아무런 답장도 없었고…… 타카하시는 그대로 실종되었죠."
90102080-56 = "……유감이네요. 오랜 친구가 갑자기 사라져 버렸으니, 상심이 크시겠어요."
90102080-57 = "상심보다는…… 마지막으로 받은 문자가 여전히 마음에 걸려요."
90102080-58 = "정말로 타카하시가 과거로 가는 열차를 타고 현재에서 사라진 거라면."
90102080-59 = "……타카하시는 현재의 삶이 만족스럽지 않았던 게 아닐까요?"
90102080-60 = "[s] \"왜 그런 생각을 하게 된 거야?\""
90102080-61 = "저저도, 가끔은 과거로 돌아가고 싶을 때가 있으니까요."
90102080-63 = "새 학기에 점심을 함께 먹을 친구를 구하지 못해, 빈 교실에서 쓸쓸하게 점심을 해결해야 할 때."
90102080-65 = "새로 생긴 디저트 가게의 크레페가 옛 학원에서 먹던 것만 못하다는 생각이 들 때."
90102080-67 = "가을이면 꽃무릇이 가득 피어, 불붙은 것처럼 일렁이던 통학길의 풍경이 그리울 때."
90102080-69 = "그런 생각이 들 때마다 과거로 돌아가, 다른 선택을 하고 싶어요."
90102080-70 = "조금만 더 적극적으로 나섰더라면, 학원이 사라지지 않았을지도 모르는데."
90102080-71 = "최소한, 타카하시에게만이라도 좀 더 연락을 자주 했더라면…… 그 아이가 사라지지 않았을지도 모르는데."
90102080-72 = "그건 무의미한 가정일 뿐이야."
90102080-73 = "설령 과거로 돌아간다 하더라도 더 나은 결론을 낼 수 있을 거란 보장은 없으니까."
90102080-74 = "하지만 여러분에게는 되돌리고 싶은 과거가 없으신가요?"
90102080-75 = "그동안 내렸던 모든 결정에 대해 정말 조금도 후회하지 않으시나요?"
90102080-76 = "그건……"
90102080-80 = "너희의 결정에 책임을 지란 말이야!"
90102080-81 = "뭐가 시민을 위한 작전이냐! 나는 그 작전 때문에 손해를 입었다고!"
90102080-84 = "왜 나만 희생해야 해? 하필이면 왜 그 예외가 나인데?!"
90102080-85 = "……차라리 사고가 터지게 놔두었으면 좋았으련만."
90102080-91 = "[ns] \"아무리 지금이 고통스러워도, 과거는 다시 돌아오지 않아.\""
90102080-93 = "그건…… 저도 알고 있어요."
90102080-94 = "하지만 자꾸 지금이 힘들고 괴로울 때마다, 뒤를 돌아보게 되는 걸요."
90102080-95 = "그 쪽의 어른은, 이런 고민이 무의미한 일이라고 생각하시나요?"
90102080-96 = "[s1] \"과거의 일을 반추하지 말라는 뜻은 아니야.\"\n[s2] \"추억과 경험은 우리를 앞으로 나아가게 하니까.\""
90102080-102 = "[ns] \"하지만 우리는 지금을 살아가고 있잖아?\""
90102080-103 = "그 말씀은……?"
90102080-104 = "[s3] \"과거에서 나아가도 결국은 현재를 거쳐야 하니까.\"\n[s4] \"지금에서 눈을 돌리면 미래로는 한 발자국도 내딛을 수 없어.\""
90102080-107 = "과거의 승리에 도취되어 실패한 사례는 교범 밖에도 잔뜩 있으니까요."
90102080-108 = "어제의 경험으로 인해 오늘의 작전을 실패한다면 본말 전도죠."
90102080-109 = "하지만 타카하시가 과거로 돌아가 버렸다면……"
90102080-110 = "[s] \"설마, 소중한 친구를 과거에 남겨두고 싶은 건 아니겠지?\""
90102080-111 = "그, 그야 물론이죠! 다시 한번 꼭 타카하시를 만나야 하는 이유는 잔뜩 있으니까요!"
90102080-112 = "그동안 못다했던 이야기도 잔뜩 나누고, 새로 생긴 크레페 가게도 가고……"
90102080-116 = "……그동안 연락이 뜸했던 것에 대해 사과도 하고 싶어요."
90102080-117 = "좋아, 그럼 결정이네."
90102080-118 = "그러고 보니 그 쪽도 역에서 수상한 열차를 목격했다며?"
90102080-119 = "네. 사흘 전에 타카하시의 흔적이 남아 있지 않을까 해서 학교가 끝나서 카와니시 역을 다시 방문했는데, 그 때 열차 시간표에 없는 낯선 열차와 마주쳤어요."
90102080-120 = "아니…… 오히려 너무나도 잘 아는, 낯이 익은 열차였지만."
90102080-121 = "그 열차는 이전에 통학을 할 때 자주 탔었던 히아신스 학원 행 열차였거든요."
90102080-122 = "뭔가 수상한 점은 없었어? 열차 번호가 달랐다거나, 내부 구조가 달랐다거나."
90102080-123 = "너무 순식간에 지나가서 저도 자세히 보지는 못했지만, 가장 이상한 점은 열차에 아무도 타고 있지 않았다는 점이었어요."
90102080-124 = "카와니시 역은 환승역이기 때문에 늦은 시간이라도, 열차에 한 두 사람 정도는 늘 타고 있거든요."
90102080-125 = "그런데 아무도 없는 열차에, 어쩐지 싸늘한 분위기가 느껴져서 저는 열차에 타지 않았어요……"
90102080-126 = "역시…… 그 열차를 목격할 수 있는 건 히아신스 학원 출신의 학생뿐인 건가?"
90102080-127 = "그럴지도 모르지. 우린 폐선된 그 노선에 대한 그리움도 없을 뿐더러, 그 유령 열차가 어떻게 생겼는지도 모르잖아."
90102080-128 = "정말 몇 번이나 생각하는 것이지만, 이 로어라는 현상. 귀찮기 짝이 없네. 그저께는 밤새도록 승강장에서 기다려도 나타나질 않더니."
90102080-129 = "뭐 그렇기에 불가해한 현상이라고 부르는 게 아닐까?"
90102080-130 = "일단 열차의 출현 조건 중 하나는 만족한 것 같지만……"
90102080-131 = "잠깐, 오늘 저녁에 이 승강장에서 다시 볼 수 없을까?"
90102080-132 = "오늘 저녁이라면 특별한 일정은 없지만…… 뭔가 제가 확인해 드려야 할 내용이 또 있을까요?"
90102080-133 = "걱정 마. 별 건 아니니."
90102080-135 = "그저…… 즐거웠던 과거를 다시 한 번 마주하러 가자."
90102080-137 = "다음화;히아신스 학원행 급행열차"
