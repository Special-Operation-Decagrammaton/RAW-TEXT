[translation]
10055160-1 = "แมดด็อกผู้วิ่งวุ่นไม่มีวันหยุด"
10055160-2 = "ว้าว! เหมือนงานเทศกาลเลย!"
10055160-3 = "ตอนอยู่หาดด้านโน้นไม่เห็นใครเลยแท้ๆ แต่ที่นี่คนเยอะเหมือนกันนะ?"
10055160-4 = "โอ้! เป็นการแข่งขันจริงๆ ด้วยค่ะ! ชักตื่นเต้นแล้วสิคะ!"
10055160-5 = "กลิ่นหอมจัง~"
10055160-6 = "อ้าว มีของกินขายด้วยเหรอเนี่ย แบบนี้ก็จะได้กินอะไรที่ไม่ใช่อาหารทะเลสักทีสินะ?"
10055160-7 = "นี่ นี่ นี่~ สาวน้อยคนสวยตรงนั้นน่ะ~"
10055160-8 = ""
10055160-10 = ""
10055160-11 = ""
10055160-12 = ""
10055160-13 = "ก่อนจะเข้าไปที่ชายหาด มาคุยกับพวกเราสักหน่อยดีมั้ยคะ~?"
10055160-14 = "วะ... วัลคิรี่?! จิอากิ เธอไปทำอะไรมารึเปล่า?!"
10055160-15 = "เอ๋?! ฉันยังไม่ได้ทำอะไรเลยนะคะ?!"
10055160-16 = ""
10055160-18 = ""
10055160-20 = ""
10055160-21 = "โคโนกะ เรียกให้หยุดกะทันหันแบบนั้น พวกเขาก็ตกใจแย่สิ"
10055160-22 = "ซอรี่~"
10055160-23 = "นั่นเรียกว่าขอโทษแล้วเหรอ... ขออภัยด้วยนะคะ"
10055160-24 = "พวกเรามาจากกรมความมั่นคงสาธารณะของวัลคิรี่ค่ะ"
10055160-25 = ""
10055160-26 = "แมดด็อกผู้วิ่งวุ่น#nไม่มีวันหยุด"
10055160-29 = ""
10055160-31 = "ตอนนี้พวกเรารับผิดชอบดูแลความสงบเรียบร้อยบนเกาะแห่งนี้ค่ะ"
10055160-32 = "พวกเราได้ยินมาแล้วละค่ะว่าพวกคุณเอาชนะคณะกรรมการแผนงานมาได้"
10055160-33 = "มันก็จริงอยู่หรอกนะ... แต่รู้เรื่องนั้นได้ยังไงคะ?"
10055160-34 = "จุ๊ๆๆ เกาะเล็กๆ แบบนี้ ข่าวลือน่ะไปไวจะตาย!"
10055160-35 = "ยิ่งคณะกรรมการแผนงานเป็นทีมดังที่ถือเป็นตัวเต็งด้วยแล้ว..."
10055160-36 = "นี่เป็นปัญหาสำคัญเลยนะคะ"
10055160-37 = "อีกอย่าง ปูเสฉวนกับกุ้งเครย์ฟิชก็เป็นสิ่งมีชีวิตคนละลำดับชั้นกันเลย"
10055160-38 = "ทั้งการรักษาความสงบเรียบร้อยของเมือง และการรักษาสมดุลของระบบนิเวศ! ล้วนเป็นหน้าที่ของ#nสำนักงานความมั่นคงสาธารณะของเราค่ะ!"
10055160-39 = "คิกคิกคิก... อย่างนี้นี่เอง"
10055160-40 = "คิดจะขัดขวางเราจนถึงกับต้องยกข้ออ้างแบบนั้นมาเลยเหรอ?"
10055160-41 = "ดี ถ้าเป็นคำท้าละก็ เราย่อมไม่ปฏิเสธ!"
10055160-42 = "ฮุฮุ"
10055160-43 = "มีอะไรน่าขำรึไง?"
10055160-44 = "ขออภัยค่ะ คณะกรรมการแผนงานเป็นตัวเต็งที่แข็งแกร่งอยู่ก็จริง..."
10055160-45 = "แต่อยู่อันดับต่ำกว่ากรมความมั่นคงสาธารณะอีกนะคะ"
10055160-46 = "ฝ่ายที่เป็นคนท้าคือพวกคุณต่างหากค่ะ"
10055160-47 = "พะ... พูดอะไรไร้สาระ!"
10055160-48 = "แค่สุนัขรับใช้ขององค์การนักเรียน ไม่คู่ควรให้แพนเดโมเนียม โซไซตี้อย่างเราต้องเอาจริงด้วยหรอก!"
10055160-49 = "ว้าว... บทพูดเหมือนตัวประกอบปลายแถวเลย"
10055160-50 = "เงียบไปเลย อิโรฮะ!"
10055160-51 = "เอาละ จิอากิ! ไปแสดงความยิ่งใหญ่ของเลขานุการของแพนเดโมเนียม โซไซตี้ให้พวกนั้นเห็นซะ!"
10055160-52 = "คะ... คะ?! จู่ๆ ก็ให้ฉันไปสู้งั้นเหรอคะ?!"
10055160-53 = "โอ้!"
10055160-54 = "ดีเลยค่ะ จิอากิ ฉันจะคอยเชียร์นะคะ"
10055160-55 = "อิโรฮะจัง จู่ๆ ก็ดูยิ้มกว้างขึ้นมาเลยนะคะ?!"
10055160-56 = "ก็ปกติฉันเป็นฝ่ายอยู่ตรงนั้นนี่คะ แหม พอได้มาอยู่ฝั่งคนดูบ้างก็สนุกดีนะคะ~"
10055160-57 = "จะ... ใจร้ายเกินไปแล้ว~!"
10055160-58 = "อื้อ~ ถะ... ถ้าเป็นแบบนี้ ก็มีแต่ต้องลุยลูกเดียวแล้วละค่ะ!"
10055160-59 = "ไปกันเถอะค่ะ แบล็กดอลลี่! แสดงสายสัมพันธ์ของพวกเราให้เห็นกันเลย!"
10055160-60 = "ฮุฮุ เลือกผู้เข้าแข่งขันได้แล้วสินะคะ"
10055160-61 = "ถ้าอย่างนั้น ปูทั้งสอง เข้าประจำที่...!"
10055160-62 = ""
10055160-64 = ""
10055160-65 = "แคร็บ...ไฟต์!!"
