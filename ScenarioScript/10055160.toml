[translation]
10055160-1 = "東奔西走、年中無休マッドドッグ"
10055160-2 = "わあ！お祭りだ～！"
10055160-3 = "へぇ、結構賑わってるのね。"
10055160-4 = "おお！結構大きなイベントなんですね！テンション上がってきました！"
10055160-5 = "美味しそうな匂い～"
10055160-6 = "ふふっ、久々に海鮮以外が食べられそうね。"
10055160-7 = "へいへーい、そこの可愛いおねーさんたち。"
10055160-8 = ""
10055160-10 = ""
10055160-11 = ""
10055160-12 = ""
10055160-13 = "ちょーっとこっちに来てもらえます？"
10055160-14 = "ヴァルキューレ！？チアキ、一体何やらかしたのよ！"
10055160-15 = "へっ！？な、何もしてませんよ～！"
10055160-16 = ""
10055160-18 = ""
10055160-20 = ""
10055160-21 = "副局長、いきなり呼び止めたら驚くだろう。"
10055160-22 = "あー、たしかに。さーせん。"
10055160-23 = "本当に反省してるのか？まったく……。コホン、失礼した。"
10055160-24 = "改めて、我々はヴァルキューレ警察学校の者だ。"
10055160-25 = ""
10055160-26 = "東奔西走、#n年中無休マッドドッグ"
10055160-29 = ""
10055160-31 = "今はこの島の治安を担当している。"
10055160-32 = "そちらの噂はかねがね。なんでも、対策委員会を倒したとか。"
10055160-33 = "それは事実ですが……どうしてそれを？"
10055160-34 = "こんな小さい島っすから、噂はすーぐ広まるんすよ。"
10055160-35 = "対策委員会は優勝候補の一つでしたし。"
10055160-36 = "これはちょっとした事件だ。"
10055160-37 = "それに、ザリガニとヤドカリは明らかな上下関係にある生物……。"
10055160-38 = "町の秩序に加えて、生態系を乱されたとあっては、我々も黙ってはいられない。"
10055160-39 = "……キキキッ。なるほど。"
10055160-40 = "そんな言い訳をしてまで私たちの邪魔をしたいのか？"
10055160-41 = "いいだろう。その挑戦、受けて立とうではないか！"
10055160-42 = "……フッ。"
10055160-43 = "何がおかしい？"
10055160-44 = "これは失礼……確かに、対策委員会は強力な優勝候補だったが……。"
10055160-45 = "順位は公安局よりも下だった。"
10055160-46 = "挑戦者は、そちらの方だ。"
10055160-47 = "お……面白い！"
10055160-48 = "連邦生徒会の犬ごときに、本気を出すまでもないわ！"
10055160-49 = "うわ、雑魚みたいなセリフ。"
10055160-50 = "うるさいぞイロハ！"
10055160-51 = "さあチアキ！万魔殿の書記として、威厳を見せてこい！"
10055160-52 = "えっえっ！？私ですか！？急すぎません！？"
10055160-53 = "おおっ！"
10055160-54 = "頑張ってください、チアキ。応援してます。"
10055160-55 = "イロハちゃん、今すごい喜んでなかった！？"
10055160-56 = "いや、いつもは私がそっち側なんで。はたから見てる分には楽しいもんですね。"
10055160-57 = "ひ、ひどい！"
10055160-58 = "うぅ……こうなった以上、やるしかありませんね！"
10055160-59 = "いきますよ、ブラックドリー！私たちの絆を見せつけてやりましょう！"
10055160-60 = "ふっ、選手が決まったみたいっすね。"
10055160-61 = "それじゃ両カニ、位置について……！"
10055160-62 = ""
10055160-64 = ""
10055160-65 = "クラブ、ファイッ！！"
