[translation]
10055160-1 = "東奔西走的全年無休瘋狗"
10055160-2 = "哇！就跟祭典一樣！"
10055160-3 = "從那邊的海灘完全看不出來，原來人還挺多的嘛？"
10055160-4 = "哦哦！真的是大會耶！我都興奮起來了！"
10055160-5 = "好香的味道～"
10055160-6 = "哎呀，連吃的都有賣呢。#n終於能吃到海鮮以外的東西了嗎？"
10055160-7 = "嘿嘿嘿～那邊的美女們～"
10055160-8 = ""
10055160-10 = ""
10055160-11 = ""
10055160-12 = ""
10055160-13 = "進海灘之前，可以先過來一下嗎～？"
10055160-14 = "女，女武神！？千秋，你到底做了什麼！？"
10055160-15 = "咦咦！？我什麼都沒做啊！？"
10055160-16 = ""
10055160-18 = ""
10055160-20 = ""
10055160-21 = "木乃香，不由分說就把人攔下來會嚇到對方的吧。"
10055160-22 = "抱歉啦～"
10055160-23 = "那也算道歉嗎……咳，失禮了。"
10055160-24 = "我們是女武神的公安局。"
10055160-25 = ""
10055160-26 = "東奔西走的#n全年無休瘋狗"
10055160-29 = ""
10055160-31 = "目前負責維持這座島的治安。"
10055160-32 = "事情我已經聽說了。你們打倒了對策委員會吧。"
10055160-33 = "那倒是事實沒錯……你們怎麼會知道？"
10055160-34 = "嘖，嘖，嘖。這種小島上的傳聞可是傳得很快的！"
10055160-35 = "尤其對策委員會還是被看好能奪冠的有力人選……"
10055160-36 = "這是個重大問題。"
10055160-37 = "況且寄居蟹和螯蝦之間，存在著明顯的上下關係。"
10055160-38 = "維護城市的秩序，進而維護生態系的秩序！這都是我們公安局的使命！"
10055160-39 = "……嘻嘻。原來如此。"
10055160-40 = "不惜找這種藉口也要扯我們後腿嗎？"
10055160-41 = "好啊。既然是挑戰，本大人就奉陪到底！"
10055160-42 = "哼。"
10055160-43 = "有什麼好笑的？"
10055160-44 = "失禮了。對策委員會的確是奪冠的有力人選沒錯……"
10055160-45 = "不過排名可是在我們公安局之下。"
10055160-46 = "你們才是挑戰者。"
10055160-47 = "真，真是可笑！"
10055160-48 = "區區聯邦學生會的走狗，還不值得我們萬魔殿認真出手！"
10055160-49 = "哇，根本就是小嘍囉的台詞。"
10055160-50 = "吵死了，伊呂波！"
10055160-51 = "來，千秋！去展現萬魔殿書記的威嚴吧！"
10055160-52 = "咦！？怎麼突然換我上場！？"
10055160-53 = "哦！"
10055160-54 = "太好了。千秋，我會幫你加油的。"
10055160-55 = "伊呂波醬，你是不是突然變得超開心的！？"
10055160-56 = "沒有啦，平常都是我站在那一邊嘛。#n哎呀，換到這邊來看還真開心呢～"
10055160-57 = "太，太過分了～！"
10055160-58 = "嗚嗚～事，事到如今也只能上了！"
10055160-59 = "上吧，黑色多莉！讓他們見識我們的羈絆！"
10055160-60 = "呵呵，看來選手決定好了。"
10055160-61 = "那麼，兩隻螃蟹各就各位……！"
10055160-62 = ""
10055160-64 = ""
10055160-65 = "Crab～Fight！！"
