[translation]
10055160-1 = "동분서주한 연중무휴 매드 독"
10055160-2 = "와아! 축제 같아!"
10055160-3 = "저쪽 해변에서는 전혀 보이지 않았는데, 사람이 꽤 많네?"
10055160-4 = "오오! 진짜로 대회군요! 텐션이 오르네요!"
10055160-5 = "맛있는 냄새~"
10055160-6 = "어머, 먹을 것까지 팔고 있네. 오랜만에 해산물이 아닌 걸 먹을 수 있는 걸까?"
10055160-7 = "헤이헤이헤이~ 거기 이쁜이들~"
10055160-13 = "해변에 들어가기 전에, 잠깐 우리 좀 보실까~?"
10055160-14 = "바, 발키리?! 치아키, 대체 무슨 짓을 한 거야?!"
10055160-15 = "네엣?! 저는 아무것도 안 했는데요?!"
10055160-21 = "코노카, 다짜고짜 멈춰 세우면 당황하지 않겠나."
10055160-22 = "죄송쓰~"
10055160-23 = "그걸 사과라고…… 이거, 실례했습니다."
10055160-24 = "저희는 발키리 공안국입니다."
10055160-26 = "동분서주한#n연중무휴 매드 독"
10055160-31 = "지금은, 이 섬의 치안을 담당하고 있죠."
10055160-32 = "이야기는 들었습니다. 대책위원회를 쓰러트렸다죠."
10055160-33 = "그건 사실이긴 한데요…… 어떻게 그 사실을?"
10055160-34 = "쯧. 쯧. 쯧. 이런 작은 섬에서는 소문이 빠르게 돈다는 말씀!"
10055160-35 = "하물며 대책위원회는 우승 후보로 꼽히는 거물이었으니……."
10055160-36 = "이건 중대한 문제입니다."
10055160-37 = "하물며, 소라게와 가재는 명백한 상하관계에 있는 생물."
10055160-38 = "도시의 질서를 지키는 것도, 더 나아가 생태계의 질서를 지키는 것도! 우리 공안국의 사명입니다!"
10055160-39 = "……키키킷. 과연."
10055160-40 = "그런 핑계를 대면서까지 우리의 발목을 잡겠다는 건가?"
10055160-41 = "좋다. 도전이라면, 마다하지 않으마!"
10055160-42 = "훗."
10055160-43 = "뭐가 우습지?"
10055160-44 = "이거 실례. 대책위원회는 분명 강력한 우승 후보였지만."
10055160-45 = "순위는 공안국보다 낮았습니다."
10055160-46 = "도전자는 그쪽입니다."
10055160-47 = "우…… 웃기는 소리로군!"
10055160-48 = "총학생회의 개 따위, 우리 만마전에서 진심으로 나설 정도는 아니다!"
10055160-49 = "우와, 진짜 조무래기 같은 대사."
10055160-50 = "시끄럽다, 이로하!"
10055160-51 = "자, 치아키! 가서 만마전 서기의 위엄을 보여라!"
10055160-52 = "네, 넵?! 갑자기 저요?!"
10055160-53 = "오!"
10055160-54 = "잘됐네요. 치아키, 응원할게요."
10055160-55 = "이로하 쨩, 갑자기 엄청 신나지 않았나요?!"
10055160-56 = "아니, 보통은 제가 그쪽에 서니까. 이야, 이쪽에 서는 건 즐겁네요~"
10055160-57 = "너, 너무해~!"
10055160-58 = "으으~ 이, 이렇게 된 이상, 하는 수밖에 없네요!"
10055160-59 = "가죠, 블랙 돌리! 저희의 유대를 보여주는 거예요!"
10055160-60 = "후후, 선수가 정해졌슴까."
10055160-61 = "그러면, 두 게 모두 자리로……!"
10055160-65 = "크랩 파이트-!!"
