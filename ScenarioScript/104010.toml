[translation]
104010-1 = "제1화;확정된 운명"
104010-11 = "우트나피쉬팀의 배가 방주에게 해킹당했다고?"
104010-12 = "……네. 지금 우리는 아트라하시스의 방주와 강제로 연결된 상태예요."
104010-13 = "즉, 우트나피쉬팀은 방주의 보조연산장치가 되어버렸어요."
104010-15 = "방주는 지금 우트나피쉬팀의 연산 장치와 에너지를 빼앗아 다차원해석에 활용하고 있어요!!"
104010-16 = "그, 그럼 어떻게 되는 거야……?"
104010-17 = "이 연결을 끊어야 해요!! 적은 지금 파괴된 <차원엔진>까지 수복하고 있어요! 게다가 이걸 이대로 두면……"
104010-18 = "키보토스 전역의 <거짓된 성소>의 현현이 가속화되어서……!! 지금 당장 성소가 나타나게 될지도 몰라요!"
104010-20 = "우트나피쉬팀의 최종종말처리 시행. <자폭 시퀀스> 재기동."
104010-21 = "자, 자폭이라고요? 또다시?!"
104010-25 = "앞으로 800초 후 자폭 시퀀스 기동. 모든 탑승자들은 신속히 탈출하시기 바랍니다."
104010-26 = "이, 이거 멈출 수 없어요?"
104010-27 = "다시 한번 알려드립니다. 모든 탑승자들은 신속히 탈출하시기 바랍니다. 앞으로 793초 후 자폭 시퀀스 기동……."
104010-28 = "안돼……!! 모든 시스템이 반응이 없어. 이 해킹을 먼저 해결하지 않는 이상……."
104010-30 = "지금 대응하고 있어요!! 방주와의 연결을 강제 해제하겠어요! 치 쨩-!"
104010-33 = "알고 있어, 지원할게!"
104010-34 = "크, 크윽……? 잠깐만 뭐야 이거?"
104010-35 = "대응하기가……."
104010-36 = "시, 실시간으로 알고리즘을 바꾸고 있어?"
104010-37 = "이런 속도에 질 수 없지. ……됐어!! 해제해, 히마리!"
104010-38 = "연결 해제!"
104010-45 = "크윽-?!"
104010-47 = "……거부당했어요."
104010-48 = "다시 한번 알려드립니다. 모든 탑승자들은 신속히 탈출하시기 바랍니다. 앞으로 533초 후 자폭 시퀀스 기동.……."
104010-49 = "……."
104010-50 = "이, 이대로 가다간……."
104010-51 = "으, 으아아? 어, 어쩌지?"
104010-52 = "대체……."
104010-53 = "방주의 연산장치 대부분을 잃은 상태에서 저희 배를 해킹하고, 차원엔진을 수복하면서 동시에 성소의 다차원해석까지 가속화시킨다고요……?"
104010-54 = "이 정도의 연산 처리가 가능한 통제시스템이 방주에 있었단 말인가요……."
104010-59 = "그런 시스템의 존재를 알아차리지 못한 시점에서…… 우리는 패배한 것일지도……."
104010-73 = "저건…… 나?"
104010-83 = "긍정. 스나오오카미 시로코, [ruby=.]다[/ruby][ruby=.]른[/ruby] [ruby=.]시[/ruby][ruby=.]간[/ruby][ruby=.]대[/ruby]의 동일 존재."
104010-84 = "[s1] \"다른 시간대의……\"\n[s2] \"동일 존재……?\""
104010-87 = "긍정. 맞습니다. [USERNAME] 선생님."
104010-88 = "[s] \"그리고 네가…… 아로나……?\""
104010-92 = "일부 긍정. 저는 <싯딤의 상자>에 상주하는 시스템 관리자이자 메인 OS  <A.R.O.N.A.>가 맞습니다."
104010-94 = "네에-?!"
104010-95 = "무, 무, 무슨 말인지 모르겠어요. <싯딤의 상자>에 상주하는 시스템 관리자라면…… 그건 저잖아요……? 제, 제가 둘이라고요?"
104010-96 = "시로코 씨도 둘이고요……? 그, 그렇다는 건……."
104010-100 = "아니! 그래도 이상해요!!"
104010-101 = "어째서 <싯딤의 상자>의 OS가 저렇게 실제 모습을 드러낼 수 있는 거죠? 뭐, 뭔가 사기나 반칙이 아니고서야……."
104010-103 = "대답. 그것은 이곳이 확률적 중첩 상태를 유지하는 아트라하시스의 방주 내부이기 때문입니다."
104010-104 = "특히 이 <나람신의 왕좌>는 차원과 차원, 시간과 시간, 존재와 비존재가 확정되지 않고 뒤섞여 있는 혼돈 영역."
104010-105 = "제 교실이 없는 지금, [USERNAME] 선생님이 이곳을 제가 머무를 수 있게 왜곡했기에 가능한 것입니다. 사기나 반칙이 아닙니다."
104010-107 = "지, 지금……."
104010-108 = "제 말에 대답한 건가요? 어, 어떻게? 제 목소리는 선생님 외에 다른 사람이 들을 수는 없을 텐데……."
104010-109 = "긍정. 들립니다."
104010-110 = "까, 깜짝이야?!"
104010-111 = "여기에 접속할 수도 있다고요……?!"
104010-112 = "……."
104010-113 = "……?"
104010-114 = "…….긍정. 네, 그렇습니다. 또 다른 버전의 <A.R.O.N.A.>."
104010-115 = "저희는 동일한 <싯딤의 상자>의 OS이기에 아마 상호 간섭이 가능한 것이라 추측합니다."
104010-119 = "………."
104010-122 = "저는 어디까지나 <싯딤의 상자>의 소유자인 [USERNAME] 선생님을 돕고 지원합니다."
104010-123 = "선생님, 명령을 내려주십시오."
104010-124 = "[ns] \"…………………그렇다는 건,\""
104010-128 = "[ns] \"프레나파테스가…… [ruby=.]다[/ruby][ruby=.]른[/ruby] [ruby=.]시[/ruby][ruby=.]간[/ruby][ruby=.]대[/ruby]의 나라는 거야……?\""
104010-130 = "일부 긍정. 대상은 <연방수사동아리 샬레>의 담당 고문 [USERNAME] 선생님과 동일 존재인 것을 확인."
104010-131 = "[s] \"……………………………………!!\""
104010-135 = "……하지만, 특정 부분에서 상이한 격차가 존재합니다."
104010-137 = "서, 선생님……!!"
104010-138 = "[s] \"아로나……?\""
104010-139 = "마, 맞아요…… 마, 맞긴 하달까…… 뭔가 다르달까……."
104010-140 = "지금 저도 프레나파테스의 생체 정보를 확인해 보았어요, 부, 분명 맞긴 해요…… 모습이나 외형이 달라지긴 했지만……"
104010-141 = "저 프레나파테스는…… 서, 선생님이 맞아요…… 다른 시간대의…… 하, 하지만……."
104010-142 = "프레나파테스, 아니…… 저쪽의 다른 시간대의 선생님은……"
104010-143 = "이, 이미……"
104010-146 = "[ruby=.]살[/ruby][ruby=.]아[/ruby] [ruby=.]있[/ruby][ruby=.]지[/ruby] [ruby=.]않[/ruby][ruby=.]아[/ruby][ruby=.]요[/ruby]……."
104010-147 = "[ns3] \"프레나파테스는 살아 있지 않다고……?\"\n[ns4] \"이미 죽은 상태라는 거야……?\""
104010-152 = "응. 맞아."
104010-157 = "왜냐하면 선생님은 내가 죽였으니까."
104010-158 = "……뭐?"
104010-163 = "선생님은 그 후에, <색채의 인도자>가 되었어."
104010-164 = "이 모습은 아마 <색채>의 영향 때문이겠지."
104010-165 = "[ns] \"…………………………….\""
104010-167 = "그 뒤에 선생님은…… 나를 여기로 데려온 거야. 모든 세계를 멸망시켜야 하는 내 운명을 실현해 주기 위해서."
104010-171 = "……. 네가, 나라고……?"
104010-172 = "응."
104010-173 = "……. 내가, 선생님을…… 죽…… 였…… 다고?"
104010-174 = "응."
104010-176 = "내가, 세계를 멸망시켜……?"
104010-177 = "응."
104010-178 = "웃기지 마------------!!!"
104010-189 = "거짓말-!!"
104010-190 = "세계를 멸망시키고, 선생님을 해쳐? 그게 나라고? 거짓말!!"
104010-198 = "선생님을 죽이고, 네 존재의 도구로 이용했다고?"
104010-199 = "내가 그럴 리가 없잖아--------!!"
104010-218 = "네가 부정해 봤자야. 그건 정해진 사실이니까."
104010-220 = "넌 그러게 될 거야."
104010-221 = "네가 이 세계에 존재하는 이상, 그건 이미 그렇게 되도록 정해져 있는 거야."
104010-225 = "……으, 으으……. 쿨럭."
104010-228 = "그게 바로 스나오오카미 시로코라는 존재의 운명. 세상을 죽음으로 인도하는 신…… 그게 우리 존재의 본질."
104010-229 = "[ns] \"시로코……!!\""
104010-232 = "……. 아, 안 돼…… 선생님…… 오지 마……."
104010-237 = "나는 너보다 강해."
104010-238 = "나는 네가 모르는 것을 경험하고, 네가 모르는 것을 알고 있어. 그 격차는 메워지지 않아."
104010-239 = "쿨럭…… 너는…… 쿨럭."
104010-240 = "……. 어째서……. 그런……."
104010-244 = "스나오오카미 시로코라는 존재는……."
104010-245 = "……. 프레나파테스의 계획에 어떤 변수가 될지 알 수 없었어. 세계를 멸망으로 인도하는 숭고는 한 세계에 단 하나만 존재할 수 있으니까."
104010-246 = "내가 이 세계에서 안정적으로 활동하기 위해서는, 나와 동일한 존재인 너를 이 세계에 존재하지 않는 상태로 두는 게 필요했어."
104010-247 = "그래서 가장 먼저 너를 납치해서 존재와 비존재가 뒤섞여 있는 이 <방주>의 공간에 가둬두었지."
104010-248 = "하지만 그것보다도……."
104010-252 = "……. 나는 너를 동정해. 스나오오카미 시로코."
104010-253 = "너는 여기서 아무것도 모른 채로 얌전히 종말을 맞이했다면 좋았을 것을."
104010-254 = "그랬다면 네가 사랑하는 사람들의 죽음을 모른 채로 죽을 수 있었을 건데."
104010-256 = "이렇게 헛되이 저항하는 바람에…… 너는 또다시 고통받게 되겠지."
104010-260 = "자아, 이제 어떡할 거지, 선생님?"
104010-261 = "[ns] \"…………………………………………….\""
104010-264 = "다음화;저항 1"
