[translation]
51180-1 = "제18화;거리를 거니는 괴담 2"
51180-4 = "저는, 단지…… 돌아가고 싶었을 뿐이어요……."
51180-5 = "저는! 그저 함께 있던 때로 돌아가고 싶었을 뿐인데……!"
51180-8 = "남을 위해 속내와 다른 말을 해봤자………"
51180-9 = "서로에게 상처만을 줄 뿐이니까. 라고……"
51180-10 = "……유카리를 위해, 그런 말을 했다고 해도."
51180-11 = "결국 제일로 괴로워했을 사람은……"
51180-17 = "나구사 선배………"
51180-18 = "왜, 당신은 그때……."
51180-22 = "응? 누구……?"
51180-29 = "키쿄. 오랜만이야."
51180-30 = "나구사 선배……?!"
51180-31 = "그간 대체 어디 있다가 이제서야……!"
51180-32 = "아니. 그런 건 됐어. 잘 돌아왔어. 선배."
51180-33 = "현재 백화요란의 상태가 말이 아니야. 아야메 부장과 나구사 선배가 사라진 뒤로, 부원들도 하나둘 떠나가고 있어."
51180-34 = "이대로 가다간 정말 백화요란이 폐부될지도 몰라. 지금이라도 좋으니까. 선배가 나서서 이야기를 해준다면 모두들……!"
51180-40 = "자, 키쿄. 이걸 받아."
51180-41 = "이건 백화요란 부장이 가진다는 <자격>……? 이걸 왜?"
51180-46 = "키쿄. 너는 우수해. 백화요란의 작전참모로서, 많은 아이들이 널 따르고 있어."
51180-47 = "……심지어 다른 일반부원들뿐만 아니라. 나조차도."
51180-48 = "그래서 생각했어. 차라리 나보다는 네가 백화요란의 부장 자리를 맡는 게 맞다고."
51180-49 = "그러니…… 자격을 <반납>하겠어."
51180-55 = "키쿄. 네가 이것을 맡아줘."
51180-60 = "그것이 지난 반년간 사라졌다가 다시 돌아온…… 당신의 답이야?"
51180-62 = "그래."
51180-63 = "왜……? 어째서야?"
51180-68 = "………나는 아야메가 아니니까."
51180-69 = "나는, 아야메의 대신이 될 수 없으니까."
51180-75 = "화가 났다."
51180-76 = "단순히 반납을 하고, 도망치려고 했기 때문이 아니야."
51180-81 = "당신은 우리들의 우상이었다."
51180-82 = "우리는 솔선해서 걷는 당신의 모습을 좋아했다."
51180-83 = "그런데."
51180-85 = "아야메 부장 따윈, 아무래도 좋아."
51180-86 = "단 한 번도…… 지금까지 단 한 번도, 우린 당신을 대신이라고……"
51180-87 = "대신이 되어주었으면 좋겠다는…… 그런 생각 따윈 해본 적도 없는데."
51180-92 = "내 선택은, 실수인 거야?"
51180-94 = "……그럼 어쩌면 좋았다는 거야. 나는……."
51180-99 = "……거리에서 소란이……."
51180-105 = "(거리 이곳저곳에서는 불길이 타오르며 혼란이 벌어지고 있었다.)"
51180-115 = "우, 우와아앗?!"
51180-116 = "도, 도와주세요! 괴, 괴물이……!"
51180-124 = "후우. 괜찮아?"
51180-127 = "[ns] \"저희가 달려온 방향은 대충 정리가 끝난 참입니다. 그곳으로 대피를!\""
51180-128 = "네, 넵! 가, 감사합니다!"
51180-135 = "……끝이 없어."
51180-136 = "[s] \"우선은 아직 대피하지 못한 사람이 없는지 찾아보자.\""
51180-137 = "뭐? 이런 상황 속에서도 도망치지 않고 안쪽으로 향하겠다고?"
51180-138 = "샬레의 선생님, 당신…… 진심이야?"
51180-139 = "당신도 알고 있을 거 아냐. 지금 벌어지는 일이 일반적인 게 아니라는 것쯤은."
51180-140 = "그렇다면 이럴 때는 얌전히 도망치는 게, 올바른 선택이잖아? 근데 왜."
51180-141 = "[s] \"그야, 모두가 위험하니까.\""
51180-142 = "……상관없잖아. 여기서 무슨 일이 벌어지든, 어차피 당신과는 타인."
51180-143 = "우선해야 하는 건 자기 자신……이잖아. 그게 당연한 거잖아."
51180-144 = "그런데도 당신은 어떻게 한 치의 망설임도 없이 그런 말을……."
51180-145 = "[s1] \"타인이 아니야. 학생을 포함해,\"\n[s2] \"백귀야행 사람들은 줄곧 알고 지낸 사람들이니까.\""
51180-149 = "[ns3] \"아니, 설사 타인이라고 해도\"\n[ns4] \"위험에 빠진 걸 두고 볼 수만은 없어.\""
51180-152 = "그런 위선적인 태도로, 단순히 말뿐인 이야기를 해봤자……!"
51180-153 = "[ns] \"그러는 나구사도 지금, 도망치기보다 앞으로 향하고 있잖아?\""
51180-157 = "[ns] \"나구사도 내버려 둘 수 없는 거지? 나도 마찬가지일 뿐이야.\""
51180-158 = "……!!"
51180-159 = "그건……"
51180-160 = "나는, 그저……"
51180-161 = "[s5] \"나구사 알려줘. 소동의 원인……\"\n[s6] \"저 녀석들이 뭔지. 알고 있는 거지?\""
51180-164 = "………끝까지 돌아가지 않겠다, 이거구나."
51180-165 = "…………"
51180-172 = "저들의 이름은…… <환량 · 츠쿠모가미>."
51180-173 = "과거 오랜 옛날. 백화요란이 퇴치했다고 알려진 전래담의 편린. 이야기 속에서 전해져 내려온 괴담이자 풍문의 일부."
51180-174 = "요컨대…… 황혼에서 재래한 <괴담>의 일종."
51180-175 = "[s] \"……괴담?\""
51180-179 = "가담항설, 유언비어, 가담항어, 도청도설, 그리고 거기에 더해 조금 더 정취가 있는 말로 표현하자면……."
51180-182 = "예로부터 항간에 전해져 내려오는 <[ruby=괴담]백물어[/ruby](百物語)>."
51180-183 = "그들은 <백귀야행의 연합을 인정하지 않는 패악의 동아리>, <괴서를 다루며 사람을 홀리는 이매망량>이더라…… 하는 이야기가 있다던가, 아니라던가~"
51180-186 = "하지만 이상해……"
51180-187 = "어째서 저들이 이곳에 나타난 거지?"
51180-188 = "이런 곳에서 나타날 리가 없는 것들인데, 어째서……."
51180-189 = "[s] \"………이것도 전부 화조풍월부의……?\""
51180-193 = "샬레의 선생. 당신이 어떻게 그 이름을……!"
51180-199 = "등 뒤에서……?!"
51180-205 = "우와아앗! 사격 중지! 사격 중지! 거참 성질 급하네! 이쪽은 괴물이 아니니까 좀 기다려 달라고!"
51180-206 = "이 목소리는……."
51180-215 = "앗! 선생님이다!"
51180-216 = "선생님! 괜찮으신가요……?!"
51180-217 = "[s] \"아, 응. 난 괜찮아…… 너희들은 다친 데는 없고?!\""
51180-219 = "……응. 우린 괜찮아."
51180-220 = "그보다……"
51180-222 = "선생님!"
51180-223 = "오는 길에 이상한 거랑 만나서 싸우고…… 도망치고…… 넘어지고!"
51180-224 = "으아앙! 뭐가 뭔지 전혀 모르겠어!"
51180-226 = "괜찮아요. 카에데 쨩. 여기에 모두 함께 있으니까. 무서워할 필요 없어요!"
51180-227 = "우으……. 미모리 선배……!"
51180-228 = "[s] \"그래도 다치지 않아 다행이야. 그리고 수행부 말고도…….\""
51180-236 = "나구사 선배. 여기 있었구나."
51180-237 = "렌게……."
51180-238 = "선배에겐 이것저것 해주고 싶은 말도 많고, 따지고 싶은 것도 잔뜩이지만……"
51180-239 = "그전에 먼저──"
51180-251 = "거리를 어지럽히는 이 괴물들부터 정리하는 게 우선이겠지!"
51180-252 = "보다시피 난장판이야. 여기서는 나구사 선배도, 협력해 줄 거지?!"
51180-257 = "나는………"
51180-263 = "짐승……."
51180-264 = "이 긴 울음은……. 설마……."
51180-269 = "(거리가 불타고 있다.)"
51180-270 = "(그 너머에서 울려 퍼지는 길고 긴 귀곡성.)"
51180-276 = "화조풍월부가 이곳까지 찾아왔다는 건 역시……"
51180-278 = "츠쿠모가미로 끝이…… 아니야……?"
51180-280 = "도망쳐야 해."
51180-281 = "뭐?! 잠깐, 나구사 선배! 도망이라니 무슨 소리를……!"
51180-282 = "여기까지 와서 선배는 또…… 도망을 치겠다는 거야?!"
51180-283 = "[s] \"잠깐, 렌게. 조금 진정을 하고…….\""
51180-284 = "이게 진정할 일이야?! 저 사람은 또다시……!"
51180-285 = "츠쿠모가미라면…… 괜찮아. 거기까지는."
51180-290 = "그것들은 백물어의 편린에 불과한…… 어디까지나 풍문이 나돌 때 생겨나는 이야기의 여분과도 같은 것이니까."
51180-291 = "하지만 정말로 <그게> 나타난 거라면……."
51180-292 = "이야기의 끝이, 풍문을 넘어 괴담이 되어버리는 것이라면…… 이다음에 찾아올 것은 분명……."
51180-302 = "저게……… 뭐야?"
51180-303 = "……………고양이?"
51180-304 = "뭐?! 저렇게 큰 고양이가 있어?!"
51180-306 = "정말로…… 그것이……."
51180-307 = "<환량백물어>가 이곳에……."
51180-308 = "그건 어떻게 할 수 없어. 괴담이 되어버린 백물어는……"
51180-309 = "아야메가 아니라면 절대로……"
51180-314 = "[ns] \"모두 조심해! 올 거야……!\""
