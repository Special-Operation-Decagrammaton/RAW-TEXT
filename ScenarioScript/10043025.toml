[translation]
10043025-5 = "으, 으윽……."
10043025-6 = "경기도, 이 모양인데, 두 배로 분하다……."
10043025-13 = "으음. 정말로 그냥 과격한 면이 있는 팬들이셨군요."
10043025-14 = "조금, 아쉬움이 느껴지기도 합니다……."
10043025-15 = "[s] \"괜찮으니까, 괜찮으니까…….\""
10043025-20 = "드디어! 마침내! 그 모든 인고의 과정을 거쳐! 브레이브스가 쓰리 아웃을 잡아냅니다!"
10043025-21 = "아직 경기는 2회 초인데 말이지요. 남은 로테이션이 걱정이네요. 하지만 2회 말의 공격에서, 브레이브스가 반격의 서막을 올리기를 바랍니다."
10043025-25 = "아, 공수 교대로군요."
10043025-26 = "그렇다면…… 범인으로부터, 연락이 올 것이라는 뜻이 될 거고요."
10043025-27 = "……."
10043025-28 = "트레이너. 어서 레이 양에게 가 보셔야 할 것 같습니다."
10043025-29 = "[s] \"그래도 될까?\""
10043025-30 = "네. 제 걱정은 마십시오. 저희는 언제든 이 경기장 안에서 만날 수 있을 테니까요."
10043025-31 = "저는 저 나름대로 탐색을 계속해 보겠습니다."
10043025-32 = "교섭, 잘 부탁드리겠습니다."
