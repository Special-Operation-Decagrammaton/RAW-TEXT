[translation]
2601403-1 = "더욱 격렬히 아무것도 안 하기"
2601403-4 = "실례합니다."
2601403-5 = "아, 선생. 업무 중에 미안하다."
2601403-6 = "그게, 아까 모모톡으로 말했듯이 다음엔 뭘 해야 할지 막막한 상태라서……."
2601403-7 = "[s] \"아, 오늘은 샬레에서 쉬도록 해.\""
2601403-8 = "쉬라고? 저번처럼 뭔가 특별한 활동 같은 건 안 해도 되는 거야?"
2601403-9 = "아니…… 생각해 보면 '휴일'이니까 쉬는 게 당연한가."
2601403-10 = "[s1] \"아무것도 안 하고 쉬는 날도 필요해.\"\n[s2] \"몸도 마음도 재충전, 이라는 느낌?\""
2601403-13 = "음, 확실히 그렇군."
2601403-14 = "확실히 쉬어 둬야 임무 시에 원활하게 활동할 수 있을 테니까."
2601403-15 = "좋아, 그럼 선생님의 조언을 받아들이도록 하지."
2601403-16 = "[s] \"이쪽 소파에 앉아서 쉬어.\""
2601403-17 = "그러고 보니 선생님은 업무 중이군."
2601403-18 = "함께 휴식을 취하지 않는 건가?"
2601403-19 = "[s] \"나는 일이 조금 밀려서 말야.\""
2601403-23 = "[ns] \"카린은 그대로 편히 쉬어 줘!\""
2601403-24 = "아, 알겠다."
2601403-25 = "선생님도 얼른 끝내고 쉴 수 있었으면 좋겠군."
2601403-28 = "……."
2601403-33 = "[ns] \"네, 샬레 사무실 전화 받았습니다.\""
2601403-35 = "[ns] \"앗, 그 서류 오늘까지 보내드릴게요! 죄송합니다!\""
2601403-36 = "…………."
2601403-37 = "저어…… 급한 용무가 있으면 내가 조금 도와줘도……."
2601403-38 = "[s] \"괜찮아! 괜찮아! 카린은 편히 쉬고 있어!\""
2601403-39 = "아, 알겠다……."
2601403-40 = "으으음……."
2601403-42 = "현재 실내 공기 질이 좋지 않습니다."
2601403-43 = "[ns] \"아차, 오늘 청소를 깜빡했잖아.\""
2601403-44 = "아, 그런 거라면 역시 내가……!"
2601403-45 = "[s] \"아냐! 내가 할게! 카린은 휴일이니까 가만히 있어!\""
2601403-49 = "으읏……."
2601403-51 = "[ns] \"읏차, 여기 가구 배치를 조금 바꾸면…….\""
2601403-52 = "……."
2601403-53 = "[s] \"아! 도와주지 않아도 괜찮아!\""
2601403-55 = "[ns] \"카린은 오늘 휴일이니까!\""
2601403-56 = "……."
2601403-57 = "[s] \"카, 카린?\""
2601403-58 = "……선생님."
2601403-59 = "내가 선생님 일을 돕는 게 싫으면, 솔직하게 말해 줘."
2601403-60 = "그렇게 에둘러서 표현하지 말고……."
2601403-61 = "[s3] \"그, 그게 무슨 소리야?\"\n[s4] \"오늘은 카린의 휴일이니까 쉬어줬으면 한 것뿐인데……?\""
2601403-64 = "그런 거라면 선생님 일을 돕게 해 줘!"
2601403-65 = "아무리 휴일이라고 해도, 선생님 혼자 일하게 두는 건 마음이 편하지 않다!"
2601403-66 = "[s] \"그, 그랬구나…… 미안.\""
2601403-67 = "쉴 때 쉬더라도, 역시 선생님과 같이 쉬는 게 좋으니까……."
2601403-68 = "할 일이 있다면 같이 끝내 버리고 함께 휴식을 취하자."
2601403-72 = "[ns] \"좋아, 그럼 부탁해 볼까.\""
2601403-73 = "……응, 맡겨만 줘. 청소는 특기다."
2601403-75 = "(카린과 함께 샬레 사무실을 깨끗이 청소했다.)"
2601403-76 = "(……그 뒤 함께 취한 휴식은 평소보다 달콤했다.)"
