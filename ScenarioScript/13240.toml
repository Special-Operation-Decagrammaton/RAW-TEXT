[translation]
13240-1 = "제24화;열차포"
13240-10 = "크윽-!"
13240-17 = "강하군…… 타카나시 호시노."
13240-18 = "비켜, 안대 쨩. 시간을 낭비하고 싶지 않아."
13240-19 = "후배들이 오기 전에 빨리 저 열차포를 처리해야 하니까."
13240-20 = "그래. 알고 있어. ……열차포의 관제실은 저쪽이야."
13240-21 = "하지만 나를 쓰러트리지 않으면 지나갈 수 없어!! 아직, 아직 난 멀쩡하다."
13240-25 = "……비켜."
13240-27 = "아직이야!!!"
13240-37 = "……공략도 이제 최종 단계를 앞두고 있습니다."
13240-38 = "공략법 첫 번째…… <이미 벌어진 일은 되돌릴 수는 없다.>"
13240-39 = "두 번째. <육체의 한계는 극복할 수 없다.>"
13240-40 = "세 번째. <마음은 예측도, 통제도 불가능하다.>"
13240-45 = "그리고 이제 마지막 네 번째. <가장 작은 구멍이 가장 거대한 둑을 무너트린다.>"
13240-46 = "이것은 탐욕과 죄책감의 죄인들의 양태를 통해 닿을 수 없는 진리를 탐구해 나가는 캠페인."
13240-47 = "이 혼란의 끝에서 나는 마침내 <여섯 번째 화두>의 대답을 들을 수 있을 테죠……."
13240-51 = "……음?"
13240-52 = "잠깐 무언가가……."
13240-59 = "도착했어……. 여기가 바로 학생회장들의 계곡?"
13240-60 = "응, 여기에 호시노 선배가 있을 거야."
13240-61 = "네. 그리고 열차포와, 스오우 씨도……."
13240-63 = "네, 열차포가 있는 장학전은 저쪽이에요, 빨리 가봐요!"
13240-71 = "……."
13240-72 = "뭔가 상상했던 거랑은 다른데……?"
13240-73 = "수백년 전에 지어진 아비도스 역대 학생회장들의 전시관…… 이었을 텐데……."
13240-74 = "기관포와 초소…… 저건 대공포? 저런 게 전시관에 왜 필요하지?"
13240-75 = "게다가 이건 게헨나의 마크야."
13240-76 = "……이, 이상하잖아. 아비도스 사막 한가운데 어째서 게헨나 마크가 있는 거야?"
13240-77 = "……."
13240-82 = "저기, 저쪽에."
13240-83 = "응?"
13240-85 = "저게……."
13240-88 = "[ns] \"저게 바로…….\""
13240-89 = "열차포……"
13240-90 = "자, 잠깐만? 저 사이즈가 맞아? 뭔가 원근감이 안느껴지는데……?!"
13240-91 = "열차포 <셰마타>……. 상상 이상으로 엄청난 크기예요……."
13240-92 = "응……."
13240-95 = "[ns] \"열차포의 탄생에 게헨나의 누군가가 개입했던 거야.\""
13240-96 = "네……. 골칫덩이 사막횡단철도 사업을 뒤바꿀 아이디어를 학생회에 제공했던 사람이겠죠……."
13240-97 = "하지만, 저 크기는 잘 이해가 되지 않아요……. 현재의 키보토스 기술로 저런 사이즈를 운용하는 건 불가능할 텐데……."
13240-99 = "그럼…… 저건 대체……."
13240-100 = "……."
13240-102 = "네, 맞아요! 선생님!"
13240-105 = "저것은 단순한 무기가 아니에요! 현시점에서는 키보토스에 존재할 수 없는 기술이라는 해석입니다!"
13240-106 = "즉, 고대의 병기, 혹은 그것에 준하는 어떤 무언가예요……!!"
13240-107 = "하지만 지금까지 그런 기술들은 계속…… 설마……?"
13240-108 = "[s] \"게마트리아…….\""
13240-109 = "하, 하지만 아직은 확인이 좀 더 필요합니다! 제가 좀 더 분석해 볼게요!"
13240-110 = "으으…… 이럴 때 프라나 쨩이 있었다면……."
13240-111 = "[s] \"프라나는 어때?\""
13240-112 = "아직 잠들어 있어요. 특별히 문제가 있는 상태는 아니지만…… 엄청 피곤해하는 것 같아서……."
13240-117 = "프, 프라나 쨩?!"
13240-118 = "……. 선배……. 선생님……"
13240-124 = "프라나 쨩? 괜찮은 거예요? 아픈 데는 없어요?"
13240-125 = "[s] \"괜찮아, 프라나?\""
13240-126 = "……. 잠들어 있는 중…… 무의식 속에서…… 시선을 발견했습니다."
13240-127 = "시선요……?"
13240-128 = "……네. 누군가 지금 여기를…… 지금 벌어지고 있는 이 상황을…… 관측하고 있습니다……."
13240-129 = "[s] \"……………………………….\""
13240-130 = "네?! 누, 누가요? 여긴 아무도 없는데……?!"
13240-131 = "여긴 다른 사람은 아무도 탐지되지 않는걸요, 프라나 쨩……?"
13240-132 = "하지만 그건…… 바로 저이기 때문에…… 알 수 있습니다. 이건…… 이 시선은……."
13240-137 = "프라나 쨩……?!"
13240-146 = "이건……?!"
13240-147 = "총소리? 저쪽이에요!"
13240-148 = "호시노 선배의 총소리야!"
13240-149 = "빨리 가보자!"
13240-154 = "선생님? 멍때리고 있지 말고 얼른 와!"
13240-155 = "[ns] \"……알았어!\""
