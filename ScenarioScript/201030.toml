201030-95 = "นั่นสินะคะ... ถ้าเป็น 'เธอคนนั้น' ก็คงทำได้"
201030-96 = "ไม่สิ ถ้าเป็นเธอคนนั้นละก็ คงไม่จำเป็นต้องพิสูจน์ความสามารถของตัวเองตั้งแต่แรก เพราะคงไม่มีใครสงสัยในการตัดสินใจเลือกของเธออยู่แล้ว"
201030-97 = "หลังจากที่เธอหายตัวไป ตัวฉันเองก็คอยวิ่งไล่ตามเงาของเธอมาโดยตลอดเหมือนกันค่ะ"
201030-98 = "ฉันเฝ้าคิดว่าจะเป็นตัวแทนของเธอที่หายตัวไปได้อย่างสมบูรณ์รึเปล่า และต้องทำยังไงถึงจะกลายเป็นยอดคนแบบนั้นได้..."
201030-99 = "ฉันตรวจสอบบันทึกที่เหลืออยู่ที่องค์การนักเรียน และพยายามใช้ประโยชน์จากสิ่งที่เธอเหลือไว้..."
201030-100 = "แต่สุดท้ายก็ลงเอยในสภาพนี้ค่ะ"
201030-101 = "ตอนที่คิโวทอสตกอยู่ในความโกลาหลและไม่อาจทำงานได้อย่างปกติ"
201030-102 = "สิ่งที่คุณสั่งให้กองทหาร FOX ไปนำมาจากชั้นใต้ดินของชาเล่ต์คืออะไรกันแน่คะ?"
201030-103 = "......"
201030-104 = "หากคุณไม่สะดวกพูดตอนนี้ ฉันจะขอให้คนอื่นออกไปก่อนค่ะ เรื่องแค่นั้น ฉันใช้อำนาจของรักษาการประธานสภานักเรียนสูงสุดขอให้ได้อยู่แล้วค่ะ"
201030-105 = ""
201030-107 = ""
201030-108 = "ไม่ค่ะ ไม่ต้องทำแบบนั้นหรอก "
201030-109 = "ต่อให้ตัวตนที่แท้จริงของสิ่งนั้นถูกเปิดเผยตอนนี้ มันก็ไม่ได้ทำให้อะไรเปลี่ยนไปหรอกค่ะ"
201030-110 = ""
201030-112 = ""
201030-113 = "สิ่งที่ฉันเอามาจากชั้นใต้ดินของอาคารชาเล่ต์คือนาฬิกาธรรมดาๆ เรือนหนึ่งค่ะ"
201030-114 = "ไม่สิ... บอกว่ามันเป็นวัตถุที่ไม่ว่าจะพิจารณาอย่างไร ก็เป็นเพียงแค่นาฬิกาธรรมดาๆ น่าจะถูกต้องกว่า"
201030-115 = "หมายความว่ายังไงคะ?"
201030-116 = "หลังจากประธานองค์การนักเรียนหายตัวไป ฉันได้แอบตรวจสอบสิ่งของที่เธอเหลือทิ้งไว้ค่ะ"
201030-117 = "ส่วนใหญ่เป็นแค่ของใช้ส่วนตัวธรรมดาๆ อย่างพวกชุดชาหรือเครื่องเขียนเท่านั้น แต่ในนั้นก็มีสิ่งของ#nจำพวกวัตถุหลงยุคที่มีพลังมหาศาล ถึงขนาดถ่ายโอนสิทธิ์การควบคุมแซงก์ทัมทาวเวอร์ได้อยู่ด้วย#nเหมือนกันค่ะ"
201030-118 = "ใช่แล้วค่ะ ฉันกำลังพูดถึง <กล่องแห่งซิสดิม> ที่คุณครูของชาเล่ต์ครอบครองอยู่"
201030-119 = "ถ้าเกิดว่ามีวัตถุหลงยุคที่ทรงพลังถึงขั้นควบคุมโครงสร้างพื้นฐานของคิโวทอสได้ด้วยมือข้างเดียวอยู่#nจริงๆ ละก็ ฉันคิดว่ามันก็น่าจะมีวัตถุหลงยุคที่ทัดเทียมกันอยู่... ไม่สิ น่าจะมีชิ้นอื่นที่ทรงพลังยิ่งกว่านั้น#nอยู่อีกก็ได้ค่ะ"
201030-120 = "แล้วระหว่างที่ตรวจสอบบันทึกของประธานองค์การนักเรียน ฉันก็ได้รู้ว่ามีวัตถุหลงยุคอีกหนึ่งชิ้นที่#nเทียบเคียงได้กับ <กล่องแห่งซิสดิม> ถูกเก็บรักษาอยู่ในหีบแห่งพันธสัญญาที่ชั้นใต้ดินของชาเล่ต์ค่ะ"
201030-121 = "ชื่อของวัตถุหลงยุคชิ้นนั้นคือ <คทาแห่งชาเคด> ค่ะ"
201030-122 = "ตามบันทึกของประธานองค์การนักเรียนระบุเอาไว้ว่า มันเป็นวัตถุที่มีความสามารถแยกแยะ#nความเป็นจริงได้ค่ะ"
201030-123 = "[s] \"คทาแห่งชาเคด...?\""
201030-124 = "ตายจริง คุณครูคงรู้อยู่แล้วสินะคะ?"
