201030-8 = ""
201030-10 = "กำลังสงสัยเลยว่าจู่ๆ ก็มีใครมาเยี่ยมแบบนี้..."
201030-11 = "มีธุระอะไรเหรอคะ คุณรักษาการประธานองค์การนักเรียน ถึงกับแต่งชุดลำลองมาพบกัน"
201030-12 = ""
201030-14 = ""
201030-15 = "แถมยังพาคุณครูจากชาเล่ต์มาด้วยแบบนี้... หรืออยากจะอวดว่ามาเดตเหรอคะ?"
201030-16 = "ไม่ใช่ค่ะ... ฉันไม่เข้าใจเลยว่าทำไมทุกคนถึงพูดเหมือนกันราวกับนัดกันมาแบบนั้น"
201030-17 = "ฉันแค่มาไถ่ถามสารทุกข์สุกดิบ  และก็มีเรื่องที่อยากถามสักหน่อยค่ะ"
201030-18 = "เฮ้อ..."
201030-19 = "ระดับเจ้าหน้าที่ฝ่ายบริหาร ริน จะส่งคนมาแทนหรือส่งเป็นเอกสารมาก็ได้ไม่ใช่เหรอคะ?"
201030-20 = "ฉันเองก็ทราบดีว่ารักษาการประธานองค์การนักเรียนไม่ใช่ตำแหน่งที่มีเวลาว่างขนาดนั้น เพราะงั้นไม่จำเป็นต้องมาถึงสำนักควบคุมด้วยตัวเอง..."
201030-21 = "ไม่ต้องห่วงค่ะ วันนี้เป็นวันหยุด เพราะงั้นไม่ต้องกังวลเรื่องงานของฉันหรอกค่ะ"
201030-22 = "ฉันสั่งการแนวทางปฏิบัติให้ผู้รับผิดชอบของแต่ละฝ่ายไว้เรียบร้อยแล้ว เพื่อให้รับมือได้ไม่ว่าจะเกิด#nอะไรขึ้น เพราะฉะนั้นต่อให้ฉันจะอยู่ที่นี่ ก็คงไม่มีปัญหาใหญ่อะไรเกิดขึ้นหรอกค่ะ"
201030-23 = "......"
201030-24 = "อุตส่าห์ได้หยุด แต่กลับอยากมาดูหน้าศัตรูในวันหยุดแบบนี้ คุณยังสติดีอยู่รึเปล่าคะ?"
201030-25 = "หรือว่าตั้งใจจะมาเยาะเย้ยคนที่อยู่ในห้องคุมขัง..."
201030-26 = "เอาเถอะค่ะ ถ้าการพูดคุยต่อหน้าทำให้คุณอึดอัด คราวหน้าฉันจะส่งจดหมายมาถามความเป็นอยู่แทนค่ะ"
201030-27 = ""
201030-29 = ""
201030-30 = "ดะ... เดี๋ยวก่อนค่ะ ฉันยังไม่ได้บอกว่าอึดอัดเลยนะ อย่ากลับไปเองตามใจชอบสิคะ!"
201030-31 = "อะแฮ่ม... พอดีฉันเองก็ไม่ได้ยุ่งมาก และไหนๆ ทั้งสองคนก็อุตส่าห์สละเวลาอันมีค่ามาหาถึงที่นี่แล้ว ฉันจะยอมสละเวลาให้สักครู่ก็ได้ค่ะ"
201030-32 = "[s] \"อยู่ที่สำนักควบคุมก็มีงานต้องทำเยอะเลยเหรอ?\""
201030-33 = "นะ... แน่นอนสิคะ ตอนเช้าก็ต้องรีบตื่นไปวิ่งเพื่อฝึกความแข็งแรงของร่างกาย..."
201030-34 = "หลังจากนั้น เพื่อให้มีภาวะผู้นำที่ดีเยี่ยม ก็จะอ่านหนังสือพัฒนาตัวเองไปจนกว่าจะถึงเวลาอาหาร..."
