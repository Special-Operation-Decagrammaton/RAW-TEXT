[translation]
201030-1 = "第3話;后翼棄兵"
201030-2 = "矯正局・特殊收容所A棟會面室"
201030-4 = "囚犯編號1192號。有人來會面了。"
201030-5 = ""
201030-8 = ""
201030-10 = "還在想是誰突然在這種時間跑來會面……"
201030-11 = "找我有什麼事嗎？聯邦學生會長代理。#n而且還特地穿了便服。"
201030-12 = ""
201030-14 = ""
201030-15 = "連夏萊的老師也一起帶來了啊……莫非是想來跟我炫耀一下難得的約會嗎？"
201030-16 = "……並不是。真不明白大家為何都不約而同地把那個詞掛在嘴邊。"
201030-17 = "我只是單純來關心一下你的近況，順便請教你一些事而已。"
201030-18 = "唉……"
201030-19 = "以琳行政官這種職位的人來說，大可以請人代理或以書面詢問吧？"
201030-20 = "我很清楚聯邦學生會長代理的業務並不輕鬆，實在沒有必要像這樣特地跑一趟──"
201030-21 = "請不用擔心。#n因為今天是可以不用為工作操心的假日。"
201030-22 = "為了應對任何突發狀況，我已經向各部門的負責人下達了指示。#n所以就算我待在這裡，也不會發生什麼大問題。"
201030-23 = "……"
201030-24 = "……難得放個假卻跑來看仇人的臉，你是笨蛋嗎？"
201030-25 = "還是說，你果然是特地來嘲笑我這個被關在牢裡的──"
201030-26 = "好吧。如果你對於當面談話感到為難，那我日後再改以書信問候。"
201030-27 = ""
201030-29 = ""
201030-30 = "等，等一下。我又沒說感到為難？不要擅自回去好不好！"
201030-31 = "咳，咳哼……剛好我也不怎麼忙，兩位又撥出寶貴的時間特地前來拜訪……#n如果只是稍微聊一下的話，我也不是不能抽出時間。"
201030-32 = "[s] 「在矯正局裡也有很多事情要處理嗎？」"
201030-33 = "那，那當然。早上一起床就要為了鍛鍊體力去跑步……"
201030-34 = "之後還得在用餐之前閱讀自我啟發的書籍，以培養優秀的領導能力……"
201030-35 = "用餐結束之後還要……"
201030-36 = ""
201030-38 = ""
201030-39 = "……好吧。其實我並沒有什麼特別要做的事。"
201030-40 = "矯正局裡既沒有什麼像樣的娛樂，也沒有幾個能聊得來的對象。"
201030-41 = "為了不讓我和FOX小隊碰面而把收容所分開，這份體貼倒是值得感謝……#n不過連其他收容者都見不到，這樣簡直就和單人牢房沒兩樣了吧？"
201030-42 = "幾乎接觸不到外界的消息，也沒有人來探望我……！"
201030-43 = "當然就算是這樣，也不代表我很高興見到你們這些久違跑來探監的人哦！？"
201030-44 = "[s] 「看來是感到寂寞了呢……」"
201030-46 = "……幸好健康看起來沒什麼問題。"
201030-47 = "那當然。作為將來要身居高位的人──#n如果因為一次失敗就喪氣到無法做好健康管理，還能稱得上是「超人」嗎？"
201030-48 = "雖然現在因為失勢而被關押在矯正局，#n但是總有一天我一定會再次發動政變，成功奪回那個位置的！"
201030-49 = "……你的那份自信，我從以前就給予相當高的評價。"
201030-50 = "不在意旁人眼光，不因失敗而氣餒──#n一次又一次提出挑戰的那股意志，正是你的優點之一。"
201030-51 = "拜其所賜，你在玩遊戲時也從來不曾以敗北收場呢。"
201030-52 = ""
201030-54 = ""
201030-55 = "……說到這裡，要不要來下一局西洋棋呢？"
201030-56 = ""
201030-58 = ""
201030-62 = "城堡h8。將軍。"
201030-63 = "主教h3。"
201030-64 = "騎士g6。"
201030-65 = "城堡f7。將軍。"
201030-66 = "國王h6。"
201030-67 = "皇后g6。將軍。"
201030-68 = ""
201030-71 = "……我輸了。"
201030-72 = "你的棋力還是一如既往呢，香耶。#n看來這種單純的戰術是沒辦法贏過你的。"
201030-73 = ""
201030-74 = "畢竟被關在矯正局的這段期間，我一直在獨自研究殘局的解法。#n雖然不敢肯定，但是和以往相比或許稍微有所長進也說不定。"
201030-75 = ""
201030-77 = ""
201030-78 = "……西洋棋明明這麼簡單，為什麼那個時候卻無法用相同的戰術取勝呢。"
201030-79 = ""
201030-81 = ""
201030-82 = "唉……"
201030-83 = "為，為什麼要露出那種表情啊？我說了什麼奇怪的話嗎！？"
201030-84 = "看來你到現在還不明白呢，香耶。"
201030-85 = "無論戰術再怎麼高明，現實都不會像棋盤上的對局那樣運作。"
201030-86 = "因為你，還有你的部下們都不是超人。"
201030-87 = "人並非棋盤上的棋子，越是想完美掌控就越是難以駕馭。"
201030-88 = "無法成為超人的凡人所能做的，最多也不過是遷就於平凡的現實並維持現狀罷了。"
201030-89 = "什麼啊。意思是如果是你就能夠掌控嗎？"
201030-90 = "不。我也同樣不是超人。"
201030-91 = "……能將現實中的人物如西洋棋一般完美操縱的超人，據我所知就只有他而已。"
201030-94 = ""
201030-95 = "……是啊。「他」的話想必能辦到吧。"
201030-96 = "不，如果是他，應該根本不需要證明自己的能力才對。#n因為所有人都會對他的決定與選擇深信不疑。"
201030-97 = "自從他消失之後，我也一直追逐著那道光芒。"
201030-98 = "思考著該怎麼做才能完美填補他所留下的空缺。#n該達成什麼才能成為像他那樣的超人……"
201030-99 = "我查閱了他留下的記錄，試圖運用他留下的成果……"
201030-100 = "結果卻落得這副德行。"
201030-101 = "當奇普托斯陷入混亂，體系無法正常運作的時候……"
201030-102 = "你指使FOX小隊從夏萊的地下室帶回來的東西，究竟是什麼？"
201030-103 = "……"
201030-104 = "如果現在不方便說明，我可以請其他人迴避。#n這點小事，以聯邦學生會長代理的權限是可以辦到的。"
201030-105 = ""
201030-107 = ""
201030-108 = "不，沒有那個必要。"
201030-109 = "反正就算現在揭曉那個東西的真面目，也不會因此發生什麼重大的變化。"
201030-110 = ""
201030-112 = ""
201030-113 = "我從夏萊的地下室帶回來的東西，是一支普通的手錶。"
201030-114 = "……不，或許應該說「看起來只是一支普通手錶的東西」比較貼切吧。"
201030-115 = "那是什麼意思？"
201030-116 = "在聯邦學生會長消失之後，我暗中調查了他所留下的物品。"
201030-117 = "大部分都只是茶具或文具之類的個人用品，#n不過其中也有能夠轉移聖所之塔的控制權限、擁有強大力量的歐帕茲。"
201030-118 = "沒錯，就是夏萊的老師所持有的「希迪姆的箱子」。"
201030-119 = "既然存在能以一己之力掌控奇普托斯基礎設施的強大歐帕茲，#n我不禁思考或許還存在著能與之匹敵……不，甚至更為強大的歐帕茲也說不定。"
201030-120 = "而在查閱聯邦學生會長記錄的過程中，我得知了一件事──#n有另一件與「希迪姆的箱子」對等的歐帕茲，被保管在夏萊地下室的聖櫃之中。"
201030-121 = "它的名字是「沙克德之杖」。"
201030-122 = "根據聯邦學生會長的記錄，那是一件擁有辨明真實能力的物品。"
201030-123 = "[s] 「沙克德之杖……？」"
201030-124 = "哎呀，老師果然早就知道了嗎？"
201030-125 = "[s1] 「不，其實我也不太清楚……」\n[s2] 「只是有種似曾相識，好像在哪裡聽過的感覺……」"
201030-128 = "……害我期待了一下。真掃興。"
201030-129 = "雖然不清楚「辨明真實」究竟意味著什麼，我還是命令FOX小隊取回了那件物品。"
201030-130 = "倘若「沙克德之杖」真的是擁有與「希迪姆的箱子」同等力量的歐帕茲，#n那麼別說是政變了，對於掌控聯邦學生會也能提供莫大的幫助。"
201030-131 = "……然而當我實際見到「沙克德之杖」時，它在我眼中卻只是一支普通的手錶。"
201030-132 = "即便嘗試各種方法進行調查，始終無法找出隱藏在手錶內的任何資訊或功能……#n等到最後發動政變的時候，我早就把它的存在忘得一乾二淨了。"
201030-133 = "後來我將它放回了聖櫃，存放在聯邦學生會大樓的倉庫裡。#n如果沒有被人動過，現在應該還原封不動地留在那裡才對。"
201030-134 = "[s] 「為什麼沙克德之杖沒有啟動呢？」"
201030-135 = "誰知道呢……"
201030-136 = "或許是我不知道正確的使用方法，也可能是我沒有駕馭那個歐帕茲的能力。"
201030-137 = "又或者……單純是聯邦學生會長的記錄有誤也說不定。"
201030-138 = "不過如果是正在使用希迪姆的箱子的[USERNAME]老師，#n搞不好就能發現它真正的價值了吧。"
201030-139 = "……看來回到聯邦學生會之後，我必須去尋找那個聖櫃才行。"
201030-140 = "[s] 「結果又變成業務的一環了呢……」"
201030-141 = "請別介意。別看我這樣，其實我也算是在享受假日了。"
201030-142 = "品嚐回憶中的美食、和久違的損友享受娛樂……這些都是我平時無法做到的事。"
201030-143 = ""
201030-145 = ""
201030-146 = "……不過現在，還是先好好珍惜這段休息時間吧。"
201030-147 = "香耶，不介意的話可以再和我下一局西洋棋嗎？#n我想為剛才那場對局一雪前恥。"
201030-148 = "西洋棋的話我倒是隨時奉陪……"
201030-149 = "不過就算你這麼說，我也不會手下留情哦。"
201030-152 = ""
201030-153 = "第一手……士兵移動到d4。"
201030-154 = "士兵d5。"
201030-155 = "……首席行政官。"
201030-156 = "雖然這可能不太符合行政官的行事風格……"
201030-157 = "不過為了有效率地經營中盤，採取[ruby=Gambit]后翼棄兵[/ruby]的戰術也不失為一個好選擇哦。"
201030-158 = "士兵c4。"
201030-159 = ""
201030-161 = ""
201030-162 = "……士兵e6。請恕我拒絕。"
201030-164 = "下一話;天藍色的思念"
