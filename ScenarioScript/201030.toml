201030-128 = "ฉันเผลอคาดหวังไปซะได้ น่าผิดหวังจริงๆ เลยค่ะ"
201030-129 = "เอาเถอะค่ะ ฉันไม่รู้ว่าคำว่า 'แยกแยะความจริง' เป็นคำเปรียบเปรยถึงอะไร แต่ฉันก็สั่งให้กองทหาร FOX ไปนำวัตถุชิ้นนี้มาค่ะ"
201030-130 = "หาก <คทาแห่งชาเคด> เป็นวัตถุหลงยุคที่มีพลังเทียบเท่า <กล่องแห่งซิสดิม> จริง มันก็จะเป็นประโยชน์กับการปฏิวัติและการยึดอำนาจองค์การนักเรียนอย่างมากค่ะ"
