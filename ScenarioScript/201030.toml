201030-85 = "ต่อให้มีกลยุทธ์ที่ยอดเยี่ยมแค่ไหน แต่โลกในความเป็นจริงไม่ได้เคลื่อนไหวไปเหมือนเกมบนกระดาน#nหมากรุกหรอกค่ะ"
201030-86 = "เพราะทั้งคุณและผู้ใต้บังคับบัญชาของคุณไม่ใช่ยอดคนค่ะ"
201030-87 = "คนเราไม่ใช่ตัวหมาก ยิ่งพยายามควบคุมให้สมบูรณ์แบบมากเท่าไร ก็ยิ่งรับมือและควบคุมได้ยากขึ้นเท่านั้น"
201030-88 = "สำหรับคนธรรมดาที่ไม่อาจเป็นยอดคน การคอยประนีประนอมกับความเป็นจริงอันแสนธรรมดานี้ แล้วประคองสถานการณ์ไว้ให้ได้ ก็ถือว่าทำดีที่สุดแล้วค่ะ"
