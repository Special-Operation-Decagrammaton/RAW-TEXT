201030-38 = ""
201030-39 = "อืม... ที่จริงแล้วก็ไม่ได้มีอะไรให้ทำเป็นพิเศษหรอกค่ะ"
201030-40 = "ในสำนักควบคุมแทบไม่มีกิจกรรมบันเทิงหรือคนให้พูดคุยด้วยเลยค่ะ"
201030-41 = "การช่วยแยกเรือนจำเพื่อไม่ให้ต้องไปเจอหน้าพวกสมาชิกหน่วย FOX ก็นับเป็นความใส่ใจที่น่าขอบคุณ#nอยู่หรอกนะคะ แต่การที่ไม่ให้เจอแม้กระทั่งผู้ต้องขังคนอื่นเลยเนี่ย มันก็ไม่ต่างอะไรกับห้องขังเดี่ยวเลย ไม่ใช่เหรอคะ?"
201030-42 = "ฉันแทบไม่ได้รับข่าวสารใดๆ จากโลกภายนอกเลย แถมยังไม่มีใครมาเยี่ยมเลยสักคน...!"
201030-43 = "แต่ก็ใช่ว่าฉันจะดีใจที่พวกคุณแวะมาเยี่ยมหลังจากไม่ได้เจอกันตั้งนานหรอกนะคะ?!"
201030-44 = "[s] \"คงจะเหงามากเลยสินะ...\""
201030-46 = "โชคดีที่ดูเหมือนจะไม่ได้มีปัญหาด้านสุขภาพนะคะ..."
201030-47 = "แน่นอนสิคะ หากคนที่จะก้าวขึ้นสู่จุดสูงสุดเหนือคนอื่นในวันข้างหน้า มาท้อแท้กับความผิดพลาด#nแค่ครั้งเดียวจนแม้แต่ตัวเองยังดูแลไม่ได้ แบบนั้นจะเรียกว่า 'ยอดคน' ได้ยังไงกันคะ?"
201030-48 = "ถึงตอนนี้ฉันจะสูญเสียอำนาจและถูกคุมตัวอยู่ที่สำนักควบคุม แต่สักวันหนึ่งฉันจะปฏิวัติให้สำเร็จ และทวงตำแหน่งนั้นคืนมาให้ได้ค่ะ!"
201030-49 = "ฉันคิดเรื่องนี้มาสักพักแล้วค่ะว่า... ความมั่นอกมั่นใจของคุณนี่น่าชื่นชมจริงๆ เลยนะคะ"
201030-50 = "ความมุ่งมั่นที่จะเผชิญความท้าทายครั้งแล้วครั้งเล่าโดยไม่ย่อท้อต่อความพ่ายแพ้ นั่นคือหนึ่งในข้อดีของคุณเลยละค่ะ"
201030-51 = "เพราะอย่างนั้น เวลาเล่นเกมก็เลยไม่เคยต้องจบลงด้วยความพ่ายแพ้เลยสักครั้งสินะคะ "
