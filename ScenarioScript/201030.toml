[translation]
201030-1 = "Episode 3;The Queen's Gambit"
201030-2 = "Corrections Bureau, Special Camp A-Wing Visiting Room"
201030-4 = "Prisoner 1192. You have a visitor."
201030-5 = ""
201030-8 = ""
201030-10 = "And here I was, wondering who would visit me at this hour..."
201030-11 = "What brings you here, Acting General Student Council President? Dressed all cute too."
201030-12 = ""
201030-14 = ""
201030-15 = "Judging by the fact that you even brought Schale's Sensei with you... Are you here to brag about your date?"
201030-16 = "...Not at all. Why does everyone keep jumping to that assumption?"
201030-17 = "I wanted to check in on you. And ask a few questions."
201030-18 = "*sigh*"
201030-19 = "Chief Officer Rin. Wouldn't it be better for someone of your position to just send someone? Or leave a note?"
201030-20 = "I'm fully aware of how busy you must be as the Acting President. Do you really have time to dawdle here in the Corrections Bureau?"
201030-21 = "Thank you for the concern, but today's my day off."
201030-22 = "I've left each department strict guidelines to follow, so they'll be fine, no matter what crises occur."
201030-23 = "..."
201030-24 = "...So on your precious day off, you came to make small talk with an enemy? Are you actually an idiot?"
201030-25 = "Or does it fulfill some kind of sadistic urge in you to taunt a prisoner?"
201030-26 = "If you're uncomfortable with me being here, I'll leave and send you a letter instead."
201030-27 = ""
201030-29 = ""
201030-30 = "H-Hold on! I didn't say that! Don't leave yet!"
201030-31 = "A-Ahem. I mean, I happen to have a moment, and you made the effort to come all the way out here. It'd be a shame if I didn't spare some time for you."
201030-32 = "[s] \"Oh, are you normally pretty busy in here?\""
201030-33 = "O-Of course. As soon as I wake up, I go for a run..."
201030-34 = "Then, before breakfast, I read self-help books on leadership..."
201030-35 = "Then, after breakfast, I..."
201030-36 = ""
201030-38 = ""
201030-39 = "...Okay, fine. I have no schedule at all."
201030-40 = "It's rare to find something enjoyable to do, let alone someone to talk to, in prison."
201030-41 = "I do appreciate that they separated me to keep me from running into any of the FOX Squad members, but that means I don't have anyone to talk to at all. I'm essentially in solitary confinement."
201030-42 = "I have ridiculously limited access to outside news, and I don't get any visitors..."
201030-43 = "But I'm still not happy to see you, okay?!"
201030-44 = "[s] \"So you were lonely...\""
201030-46 = "...I'm glad to see that you're in good health."
201030-47 = "Of course I am. I'm destined for greatness—A superhuman like me won't falter and neglect my well-being from a singular mistake."
201030-48 = "I may have slipped from my path, but I will recover! And when I do, I'll stage a successful coup and regain my power!"
201030-49 = "I've thought this before, but I have to acknowledge your boundless confidence."
201030-50 = "You don't seem to know what defeat is and march endlessly forward, no matter the obstacle or judgment."
201030-51 = "I've never seen you lose a game. "
201030-52 = ""
201030-54 = ""
201030-55 = "...Which is why I want to ask you to play chess with me."
201030-56 = ""
201030-58 = ""
201030-62 = "Rook, H8. Check."
201030-63 = "Bishop, H3."
201030-64 = "Knight, G6."
201030-65 = "Rook, F7. Check."
201030-66 = "King, H6."
201030-67 = "Queen, G6. Check."
201030-68 = ""
201030-71 = "...I lost."
201030-72 = "Your chess skills haven't dulled at all, Kaya. I've never met someone quite like you."
201030-73 = ""
201030-74 = "Like I said, there's not much to do here. I've been solving chess problems by myself. This is my first time actually playing against someone else since I started, but I think I've improved a bit."
201030-75 = ""
201030-77 = ""
201030-78 = "...When chess is this simple for me, I still can't seem to understand why my tactics didn't work back then."
201030-79 = ""
201030-81 = ""
201030-82 = "*sigh*"
201030-83 = "Wh-What is that look? What's wrong with what I said?!"
201030-84 = "You still don't understand, Kaya."
201030-85 = "Tactics and perfect plans mean nothing in the real world. Life isn't like a chess board."
201030-86 = "Because neither you nor your subordinates are superhumans."
201030-87 = "People are not chess pieces. The harder you try to control them, the harder they become to manage."
201030-88 = "For an ordinary person, one who couldn't become a superhuman, the best they can do is to maintain the status quo."
201030-89 = "And you think YOU would have been able to succeed where I couldn't?"
201030-90 = "No. I'm no superhuman either."
201030-91 = "There's only one superhuman we know of that can move people across the board like chess pieces."
201030-94 = ""
201030-95 = "...You're right. She could've done it."
201030-96 = "But she never would have needed to in the first place. No one would've questioned her. The idea of having to prove herself is probably a foreign concept to her."
201030-97 = "I've been chasing her shadow ever since she disappeared. Just like you."
201030-98 = "I thought it was my chance to become a superhuman. I thought I could become the perfect replacement."
201030-99 = "I read through countless records, thinking that if I just tried hard enough..."
201030-100 = "But here I am."
201030-101 = "When Kivotos fell into chaos..."
201030-102 = "What was it that you had the FOX Squad bring to you from the Schale basement?"
201030-103 = "..."
201030-104 = "If there are too many people here, I can ask them to leave. I have the power to do at least that much, as the Acting President."
201030-105 = ""
201030-107 = ""
201030-108 = "No, it's fine. "
201030-109 = "What difference does it make to me now?"
201030-110 = ""
201030-112 = ""
201030-113 = "I had them bring me a plain, old wristwatch."
201030-114 = "More so, what appeared to be one."
201030-115 = "Please elaborate."
201030-116 = "After the General Student Council President disappeared, I secretly investigated everything she left behind."
201030-117 = "Most of it was just personal belongings, things like school supplies and teacup sets. But what I was looking for was an artifact, one powerful enough to transfer the Sanctum Tower's control."
201030-118 = "Exactly. Sensei's Shittim Chest."
201030-119 = "If an artifact powerful enough to control Kivotos' infrastructure with the swipe of a hand existed, I thought that there must be more. Maybe even one more powerful than the Chest."
201030-120 = "And when I was going through the records of the General Student Council President, I found records of just that: another artifact, stored inside the Schale basement."
201030-121 = "The Staff of Shaqed."
201030-122 = "Based on the President's records, it's an object capable of discerning the truth."
201030-123 = "[s] \"Did you say the Staff of Shaqed...?\""
201030-124 = "Oh? You already knew, Sensei?"
201030-125 = "[s1] \"No, not in so many words...\"\n[s2] \"It just sounds vaguely familiar.\""
201030-128 = "...You got my hopes up for nothing. How boring."
201030-129 = "It was difficult to tell from the records just what \"discerning the truth\" meant, so I ordered the FOX Squad to bring it to me."
201030-130 = "I figured that, if the Staff of Shaqed really was comparable to the Shittim Chest, it would benefit me not only in my coup, but also in controlling the General Student Council."
201030-131 = "...But once I had it in my hands, the Staff of Shaqed seemed like nothing more than an ordinary watch."
201030-132 = "I studied about it this way and that, but it really didn't seem to do anything but tell the time. And I'd forgotten about it by the time the coup began."
201030-133 = "I put it back in the chest it was originally stored in and left it in the General Student Council building's storage room. Unless someone took it, it should still be in there."
201030-134 = "[s] \"I wonder why the Staff of Shaqed didn't work.\""
201030-135 = "I could never figure it out."
201030-136 = "Maybe there's some special way to operate it, or I just don't possess the ability to control the artifact."
201030-137 = "Or maybe the General Student Council President's records were wrong."
201030-138 = "The user of the Shittim Chest might be able to get something out of it, [USERNAME] Sensei."
201030-139 = "...We'll investigate once we return to the General Student Council."
201030-140 = "[s] \"And we're back at work again.\""
201030-141 = "Don't worry too much, Sensei. Despite appearances, I've been enjoying my time off."
201030-142 = "Enjoying a nostalgic meal and playing games with a long-time rival is an uncommon experience for me."
201030-143 = ""
201030-145 = ""
201030-146 = "...So I should make the most of it while I can."
201030-147 = "If you don't mind, Kaya, maybe I could make up for my embarrassing loss from earlier with a rematch?"
201030-148 = "I'm always happy to play chess..."
201030-149 = "...but I have no plans on going easy on you."
201030-152 = ""
201030-153 = "My first move... Pawn to D4."
201030-154 = "Pawn, D5."
201030-155 = "...Chief Officer."
201030-156 = "This might not suit your style..."
201030-157 = "But sometimes, it's an effective gambit to sacrifice a pawn to strengthen your mid-game."
201030-158 = "Pawn, C4."
201030-159 = ""
201030-161 = ""
201030-162 = "...Pawn, E6. I'll decline."
201030-164 = "Next Episode;Sky-Blue Tinted Nostalgia"
