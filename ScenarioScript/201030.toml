201030-74 = "ระหว่างถูกคุมตัวอยู่ที่สำนักควบคุมนี่ ฉันฝึกแก้เกมหมากรุกคนเดียวอยู่หลายครั้งเลยค่ะ ถึงอาจจะบอกไม่ได้แน่ชัด แต่ฝีมือฉันอาจจะพัฒนาขึ้นกว่าเมื่อก่อนนิดหน่อยก็ได้ค่ะ"
