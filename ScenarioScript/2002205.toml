[translation]
2002205-1 = "가끔은 천천히, 이대로."
2002205-2 = "게헨나 교정"
2002205-9 = "죄, 죄송해요! 많이 기다리셨나요?"
2002205-10 = "[s] \"나도 막 도착한 참이야.\""
2002205-11 = "선생님 말씀대로 기모노를 입고 나오긴 했는데……"
2002205-12 = "무슨…… 일이신가요?"
2002205-13 = "[s1] \"우선은 장소를 옮길까?\"\n[s2] \"게헨나는 후우카에게 있어 너무 익숙한 곳일 테니까.\""
2002205-16 = "네……?"
2002205-17 = "선생님만, 믿을게요?"
2002205-19 = "시내"
2002205-20 = "여기가 말로만 듣던 초고층 투명 전망대군요."
2002205-21 = "초고속 엘리베이터를 타고 올라왔는데……"
2002205-22 = "아우우, 아직도 눈 앞이 핑핑 도는 것 같아요."
2002205-26 = "와아, 시내가 정말 한눈에 내려다보이네요."
2002205-27 = "그런데 왜 발밑이 유리인 거죠?!"
2002205-28 = "다리가 후들거려서 꼼짝도 못하겠어요!"
2002205-29 = "죄, 죄송하지만 선생님. 손 좀 잡아 주세요!"
2002205-35 = "땅을 다시 밟으니 살 것 같아요!"
2002205-36 = "물론 전망대에서 본 풍경은 대단했는데요……"
2002205-37 = "네? 사실은 선생님도 무서우셨다고요?"
2002205-38 = "왜 사람들은 자기 돈을 내고 무서운 곳을 찾아갈까요? 이해가 안 돼요……"
2002205-39 = "그 말을 들으니 또 가볼 만한 곳이 생각나셨다고요?"
2002205-40 = "이번에는 괜찮은 곳이겠죠? 아뇨, 물론 전망대는 괜찮은 곳이었지만……"
2002205-48 = "놀이공원"
2002205-50 = "아, 놀이공원이군요. 저도 말은 많이 들었어요."
2002205-54 = "네? 정지 상태에서 1.56초만에 180km/h로 가속?"
2002205-55 = "중간에 직경 39.7m짜리 루프?"
2002205-56 = "그거 정말 사람이 탈 수 있는 건가요? 죽는 거 아닌가요?!"
2002205-57 = "[s] \"물론 후우카가 타고 싶지 않다면 어쩔 수 없지만.\""
2002205-58 = "우으, 그렇지만 선생님께서 권유해 주셨고, 시간도 내 주셨고……"
2002205-59 = "저, 탈게요. 후우카, 타겠습니다!"
2002205-61 = "꺄아아아아아아아악!"
2002205-70 = "우우우…… 정말 죽는 줄 알았어요."
2002205-71 = "네? 이제 곧 퍼레이드가 시작된다고요?"
2002205-72 = "저거네요! 백귀야행 연합학원의 이름이 쓰여 있어요."
2002205-73 = "저게 말로만 듣던 백귀야행 연합학원의 축제 실력……"
2002205-74 = "어? 산해경 고급중학교의 행렬도 뒤이어 따라오네요? 그리고 저건…… 붉은겨울?"
2002205-75 = "아…… 이건 각 학교들의 특징과 심볼을 따 와서 구성한 컨셉 퍼레이드라고요?"
2002205-76 = "그러면 게헨나도 나올까요? 우와, 트리니티도 있네요……"
2002205-78 = "상점가"
2002205-83 = "고생하셨어요, 선생님. 아하하……"
2002205-84 = "배고프시다고요? 저도 조금 피곤해져서…… 어디 쉴 곳 없을까요?"
2002205-85 = "네? 이럴 땐 내키는 대로 아무 식당에나 들어가자고요?"
2002205-86 = "멋대로…… 뭐든 주문해도 괜찮다고요?"
2002205-87 = "그렇지만…… 너무 죄송한데……"
2002205-88 = "네, 네. 선생님께서 그렇게 말씀하신다면……"
2002205-90 = "(후우카와 함께 괜찮아 보이는 음식들을 멋대로 시켰다.)"
2002205-92 = "괜찮은 요리였어요. 하지만……"
2002205-93 = "괜찮으신가요? 가격이……"
2002205-94 = "저 같은 아이에게, 그 정도의 돈을 쓰셔도 괜찮으신 건가요?!"
2002205-95 = "[s] \"후우카를 위해서라면야, 그 정도는 거뜬하지!\""
2002205-96 = "죄송합니다……"
2002205-97 = "네? 이럴 때는 죄송하다고 하는 게 아니라고요?"
2002205-98 = "네…… 그렇군요. 그렇겠네요."
2002205-99 = "감사합니다. 선생님."
2002205-100 = "[s] \"다리 아프겠지만, 조금만 더 같이 걸을까?\""
2002205-101 = "네! 물론이죠!"
2002205-103 = "거리"
2002205-108 = "조용하네요……"
2002205-109 = "이런 시간에 밖에 있는 것도, 간만이에요."
2002205-110 = "[s] \"정신없는 하루였지.\""
2002205-111 = "그러게요. 엄청난 하루였어요."
2002205-112 = "[s] \"오늘만큼은 후우카가 자유로웠으면 했어.\""
2002205-113 = "네……?"
2002205-114 = "무엇 때문에 그런……?"
2002205-115 = "[ns] \"후우카는 늘 게헨나에만 갇혀 있으니까.\""
2002205-117 = "[ns] \"더 많은 것들을 보여주고 싶었거든.\""
2002205-121 = "서, 선생님……"
2002205-122 = "가, 갇혀 있다뇨. 그런 건 아닌데…… 아니지만……"
2002205-123 = "저는 그냥, 제 할 일을 할 뿐인데……"
2002205-124 = "[ns] \"알고 있어.\""
2002205-126 = "[ns] \"그래도, 좋은 연휴 선물이 되었으면 했어.\""
2002205-127 = "연휴, 선물……"
2002205-128 = "그렇, 군요. 알겠어요, 선생님."
2002205-131 = "[wa:1500]― 정말로…… [wa:1700]기뻐요."
2002205-134 = "[wa:1500]― 언제나 [wa:700]감사합니다. [wa:1200]선생님."
2002205-137 = "[wa:2000]― 선생님으로부터는, [wa:1000]여러 가지를 [wa:500]받기만 하네요."
2002205-140 = "― 제 요리를, [wa:1400]누구보다 [wa:500]맛있게 먹어주시는 분은……"
2002205-141 = "[wa:1500]― 언제나 [wa:400]선생님이었어요."
2002205-144 = "[wa:1500]― 그게……"
2002205-145 = "[wa:1600]― 저에게는, [wa:1100]제일 큰 [wa:400]선물이었고요."
2002205-148 = "[wa:1500]― 그러니까, [wa:500]그… [wa:2000]선생님."
2002205-149 = "[wa:2100]― 앞으로도, [wa:1300]잘 부탁드릴게요?"
2002205-152 = "(어느새 밤이 늦어서, 후우카를 바래다주는 길이었다.)"
2002205-153 = "게헨나 교정"
2002205-161 = "꺄악?!"
2002205-166 = "[ns] \"괜찮아?!\""
2002205-167 = "네, 네에. 잠시 발을 헛디뎌서……"
2002205-168 = "아얏!"
2002205-169 = "죄송해요. 발목이 살짝…… 꺅!?"
2002205-171 = "(비틀거리는 후우카를 끌어안듯 받아내었다.)"
2002205-174 = "서, 선생님?"
2002205-175 = "선생님……"
2002205-176 = "조금만 더…… 이대로 있어도, 괜찮을까요……?"
2002205-180 = "(사실은, 이미 멀쩡해졌지만……)"
2002205-181 = "(죄송해요, 선생님. 저는…… 나쁜 아이인가 봐요.)"
2002205-183 = "(후우카를 지지해 주면서, 조심스럽게 돌아갔다.)"
