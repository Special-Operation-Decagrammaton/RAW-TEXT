[translation]
1601402-1 = "이부키와 함께 게임을!"
1601402-4 = "실례합니다!"
1601402-8 = "선생님 안녕! 놀러 왔어!"
1601402-9 = "[s1] \"오랜만이야, 이부키!\"\n[s2] \"못 본 사이 키가 커진 것 같은데?\""
1601402-12 = "헤헤, 그런가?"
1601402-13 = "사실은 있잖아, 마코토 선배가 샬레에서 놀다 오는 건 어떻겠냐고 했거든!"
1601402-14 = "이부키도, \"오늘은 샬레에서 잔뜩 놀고 싶어~!\" 라고 생각해서! 그래서 온 거야~!"
1601402-15 = "[s3] \"모처럼 이부키가 이렇게 찾아와줬는데 미안해.\"\n[s4] \"우선 선생님은 샬레의 일부터 해결해야 할 것 같아.\""
1601402-21 = "문제없습니다!"
1601402-22 = "오늘은 당번으로 온 거니까, 이부키가 선생님의 일을 도와줄게!"
1601402-23 = "[s5] \"정말? 그럼, 어디 한 번 맡겨 볼까?\"\n[s6] \"이부키가 도와준다니 일할 의욕이 나는걸.\""
1601402-26 = "응! 무엇이든 맡겨주세요!"
1601402-28 = "(그렇게 이부키와 함께 일을 시작했다.)"
1601402-36 = "서류가 하나, 두울, 세 장……."
1601402-37 = "……."
1601402-41 = "……(힐끔)"
1601402-42 = "[s] (응?)"
1601402-46 = "네, 네 장, 다섯 장……."
1601402-51 = "……(힐끔)"
1601402-52 = "[s] (이부키의 시선이……. 한쪽에 치워 둔 게임기와 장난감으로……?)"
1601402-53 = "(도리도리)"
1601402-54 = "안 돼, 딴 짓을 하면 나쁜 아이니까……."
1601402-55 = "[s] \"이부키.\""
1601402-56 = "응? 왜 불러, 선생님?"
1601402-57 = "[s] \"잠깐 게임이라도 같이 할까?\""
1601402-58 = "아, 아니! 이부키는 오늘 선생님 일을 도우러 온 거니까!"
1601402-59 = "평소처럼 놀고만 있을 수는 없는걸!"
1601402-60 = "[s] \"하지만, 선생님은 이부키가 같이 어울려 줬으면 좋겠는데.\""
1601402-62 = "[ns7] \"평소 일이 많다 보니,\"\n[ns8] \"크게 마음을 먹지 않으면 저런 걸 할 시간도 체력도 없거든.\""
1601402-65 = "그렇구나……."
1601402-66 = "어? 그럼 하지도 않는데 게임기랑 장난감은 왜 산 거야?"
1601402-67 = "[s9] \"구, 구매하는 게 메인 콘텐츠랄까, 스트레스 해소랄까…….\"\n[s10] (악의 0%의 순수함이 너무 아프다……!)"
1601402-70 = "선생님 어디 아파? 표정이 안 좋아……."
1601402-71 = "[s] \"괘, 괜찮아…… 그보다 이부키는 어때? 같이 해주지 않을래?\""
1601402-72 = "응?"
1601402-73 = "이, 이부키는…… 그러니까……"
1601402-77 = "[ns] \"그리고 말이야. 선생님은 이부키가 하고 싶은 게 있다면…….\""
1601402-79 = "[ns] \"억지로 참기보다는 솔직히 말해주는 편이 기쁠 거야.\""
1601402-84 = "헤헤. 그렇구나."
1601402-85 = "사실, 이부키도 선생님이랑 놀고 싶었어! 게임도 하고, 같이 인형 놀이도 하고!"
1601402-86 = "정말 그래도 괜찮아?"
1601402-87 = "[s] \"물론이지! 그럼, 게임부터 시작해 볼까?\""
1601402-88 = "응! 좋아!"
