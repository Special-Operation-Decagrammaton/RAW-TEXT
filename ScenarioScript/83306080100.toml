[translation]
83306080100-6 = "후우카 선배가 급양부에서 게헨나 일반 급식을 준비하는 사이……"
83306080100-7 = "저 우시마키 주리! 오늘은 만마전 여러분을 위해 특별히 야외배식을 나왔답니다!"
83306080100-8 = "이런 데까지 와서 밥을 제공하다니, 그쪽도 제법 고생이네."
83306080100-9 = "의사당이 무너져서 침울해져 있을 만마전 여러분을 위해서. 힘이 날 수 있는 밥을 제공하고 싶었거든요!"
83306080100-10 = "슬픈 일이 있어도 밥은 꼭꼭 챙겨 먹어야 해요! 그럼, 기분이 조금 풀리고 행복해질 수도 있으니까요!"
83306080100-11 = "(마코토를 보면 그렇게 침울해하는 것 같진 않지만……)"
83306080100-12 = "그런 의미에서 여기, 미리 준비한 드럼통에…… 은박지로 감싼 식재료를 넣고……"
83306080100-18 = "어라……?"
83306080100-20 = "응? 왜 그래? 주리."
83306080100-31 = "그, 방금 드럼통에 넣은 건, 만마전 여러분을 위해 준비한 후식인데……!"
83306080100-35 = "가, 갑자기, 움직이기 시작한 거 같아요……! 어, 어째서?!"
83306080100-37 = "(만마전 의사당의 앞, 이곳은 온천개발부가 특별히 파헤치려고 했던 장소야……)"
83306080100-38 = "(그렇다는 건 설마…… 또 온천이……?)"
83306080100-44 = "우, 우와아아앙?! 여러분~! 조, 조심하세요~!"
