[translation]
10011080-1 = "제8화;정말로 우리 앞을 가로막는 것은"
10011080-3 = "[ns] \"여기서 멈춰 달라니, 무슨 소리야?\""
10011080-4 = "뒤늦게나마 상황은 파악했습니다."
10011080-5 = "교류회에서 하필 이런 불미스러운 일이 벌어질 줄이야……"
10011080-6 = "어째서 귀빈이 납치된 직후 신고를 해주시지 않았는지. 한마디 하고 싶은 참입니다만."
10011080-7 = "윽…… 그건……!"
10011080-8 = "그래도 여러분이 나름 노력해 주셨다는 걸 고려해, 이번 일은 불문에 부치겠습니다."
10011080-9 = "이 뒤부터는 저희가 맡겠습니다."
10011080-10 = "여, 여기서 빠지라는 건, 가요……?"
10011080-11 = "네, 다행히 방송 중계라는 형태로 도주 중인 제멋대로 망량즈의 소재지는 파악하고 있습니다."
10011080-12 = "문제 해결을 위해 백화요란도 호출한 참입니다. 여기서부턴 저희 음양부가 맡도록 하지요."
10011080-13 = "그럼."
10011080-18 = "가, 갑자기 그렇게 말하는 건 너무해요!"
10011080-25 = "마, 맞아요! 아, 아직 공연이 실패로 돌아간 건 아, 아니에요!"
10011080-26 = "모두 힘을 합쳐서 여기까지 왔고…… 망량즈만 잡으면, 공연도 무사히 마무리할 수……!"
10011080-28 = "그야 훌륭한 말씀입니다만……. 그건, 정말로 모두가 동의한 일인가요?"
10011080-29 = "정작 가장 중요한 분께서는 아무 말도 없으시기에."
10011080-30 = "……!"
10011080-34 = "……하아."
10011080-35 = "다행히 외부에는 아직 공연이 계속되는 것으로 알려져 있지만."
10011080-36 = "솔직히 말하도록 하지요."
10011080-37 = "공연은 이미 실패로 돌아갔습니다."
10011080-38 = "그 뒷수습을 정식 동아리도 아닌 인법연구 동호회 여러분에게 맡길 순 없는 노릇입니다."
10011080-39 = "그러니 부디 여기에서 손을 떼주셨으면 합니다."
10011080-40 = "애당초 정식 동아리가 되기 위한 방법이라면,"
10011080-41 = "이것 말고도 얼마든지 있잖아요?"
10011080-42 = "윽……!"
10011080-48 = "……카호의 말이 맞아."
10011080-49 = "부장……?"
10011080-50 = "부장님……?"
10011080-52 = "[ns] \"미치루.\""
10011080-53 = "처음부터 그냥 다 내 욕심이었어. 나 때문에 일이 이렇게 되어버린 거야."
10011080-54 = "미안해…… 모두…… 카호에게도, 선생 공에게도 전부……."
10011080-55 = "괜히 내 욕심 때문에, 이런 일에 끌어들이기나 하고."
10011080-60 = "……아마, 이부키도 나 때문에 울고 있을지도 몰라."
10011080-61 = "이것도 전부 내가 바보라서 그런 거니까."
10011080-63 = "응…… 그러니 여기에서 그만……"
10011080-64 = "……아니요! 그럴 수 없어요!"
10011080-69 = "……부, 분명 …으, 음양부 부부장님의 말이 맞을지도 몰라요."
10011080-70 = "저, 저도 왜 부장님이 이제까지 동아리 신청서를 내지 않았고, 그래서 이번 일에 얽매이고……"
10011080-71 = "결국 이렇게 되어버릴 때까지……… 저와 이즈나 쨩에게 아무런 말도 안 해줬는지!"
10011080-72 = "저는, 둔하고, 덩치만 커다랄 뿐이고…… 할 수 있는 것도, 아는 것도 별로 없어서 잘 모르겠어요!"
10011080-73 = "츠쿠요……"
10011080-74 = "하지만 그런 건 전부 제쳐두고서라도……! 저희는 약속했잖아요!"
10011080-75 = "……약속?"
10011080-76 = "이부키 쨩에게, 무서워하지 말라고-"
10011080-77 = "<그 어떤 상황이라도 닌자가 공주님을 구해주러 가겠다>고요!"
10011080-84 = "……츠쿠요?"
10011080-85 = "닌자의 철칙! 그 세 번째! <닌자란! 자고로 약속한 것은……!>"
10011080-86 = "……반드시 지키는 법!"
10011080-87 = "그러니 선생님……!"
10011080-88 = "[s] \"응. 맡겨 줘.\""
10011080-89 = "……여기서 굳이 덤벼들겠다는 건가요!"
10011080-90 = "……그렇게 나오신다, 이거로군요. 어쩔 수 없지요! 제 쪽에서도 그럼 힘으로 제압하겠습니다!"
