[translation]
1002603-1 = "별 거 아닌 부탁"
1002603-2 = "(네루가 불러낸 곳은 어째서인지 밀레니엄 변두리의 작은 체육관이었다.)"
1002603-3 = "(규모도 작고 가는 길도 불편해서 그런지, 다른 사람들의 모습이 전혀 보이지 않았다.)"
1002603-4 = "큭……."
1002603-5 = "[s] \"……?\""
1002603-6 = "으으……. 아……!"
1002603-7 = "……쯧. 결국 또 이렇게 됐네."
1002603-8 = "[s] \"……????\""
1002603-9 = "대체 어떻게 하는 거야……?"
1002603-10 = "다른 녀석들은 잘만 하고 다니는 것 같더만……."
1002603-11 = "아야야……. 또 다쳤나……."
1002603-12 = "[s1] \"……네루!?\"\n[s2] 소리가 난 곳으로 다급히 들어간다."
1002603-23 = "[ns] \"……네루?\""
1002603-24 = "……응? 선생?"
1002603-25 = "아아. 생각보다 빨리 왔네. 마침 잘 됐어. 말 한 건 가지고 왔겠지?"
1002603-26 = "……응? 어디 다쳤냐고?"
1002603-27 = "……하아. 선생. 내 말 안 들었지? 신경 쓸 거 없다고 했잖아."
1002603-28 = "그냥 발 까진 곳 좀 붙이려고 했을 뿐이야. 아무 문제 없어."
1002603-29 = "……뭐?"
1002603-30 = "옷은 또 왜 이 옷이냐고? 발은 또 왜 까졌냐고?"
1002603-31 = "한 번에 하나씩만 물어, 선생."
1002603-32 = "그래도 뭐……. 그래. 여기까지 와줬는데 대답 정도는 해 주지."
1002603-33 = "그냥 개인적인 연습이야."
1002603-34 = "평소에 잘 안 입는 복장이라도 입을 땐 자연스러워야 하잖아?"
1002603-35 = "언젠간 이런 거 입고 일도 해야 할 테니까 말이지."
1002603-36 = "그치만 이 신발……."
1002603-37 = "특히 이런 류의 신발은 좋아하지도 자주 신지도 않아서 신을 때마다 귀찮더군."
1002603-38 = "길들이기라도 해 놔야겠단 생각으로 신어 봤는데, 오히려 내 발이 까지더라고."
1002603-39 = "……이제 알겠지? 진짜 별거 아니야. 알았으면 얼른 밴드나 줘. 나 지금도 따가우니까."
1002603-40 = "……뭐? 직접 붙여주겠다고?"
1002603-41 = "그, 그것 또 무슨 소리야!? 쓸 데 없는 소리 말고 그냥 밴드나 내 놔!"
1002603-42 = "엉? 직접 붙이게 해주지 않으면 그냥 가겠다고? 뭐, 뭐야!? 이 선생 갑자기 왜 이래?"
1002603-43 = "아니, 대체 왜 이러는……!"
1002603-44 = "……."
1002603-45 = "……하아……."
1002603-46 = "쯧. 그래. ……뭐, 달리 방법도 없나."
1002603-47 = "……마음대로 해."
1002603-50 = "[wa:2100]― ……뭐, [wa:1000]뭐야. [wa:1000]왜 그렇게 봐."
1002603-53 = "[wa:250]― ……응. [wa:1850]OK."
1002603-56 = "― 잘 붙었어?"
1002603-58 = "― 아아. [wa:1400]괜찮네. [wa:1450]땡큐."
1002603-61 = "[ns3] \"그러고 보니…….\"\n[ns4] \"이런 모습의 네루를 보는 것도 신기하네.\""
1002603-62 = "[wa:1150]― ……말해두지만, [wa:50]"
1002603-63 = "[wa:1150]― ……말해두지만, [wa:50]"
1002603-65 = "― 보통은 이런 거 [wa:950]누구한테도 부탁하지 않으니까."
1002603-68 = "― 선생이니까 [wa:900]부탁한 거지……."
1002603-71 = "[wa:1850]― ……뭐, 됐어."
1002603-73 = "― 여전히 [wa:1070]선생은 이상한 사람이야."
1002603-76 = "[wa:2500]― 뭐, [wa:1200]그러니까……. [wa:2350]음……."
1002603-79 = "― ……알고 있겠지만 [wa:50]"
1002603-81 = "― 이거, [wa:1200]다른 녀석들에게는 말하지 말라고.[wa:100]"
1002603-84 = "……그러고 보니 나도 의도치 않게 선생님의 다른 모습을 봐 버렸군."
1002603-85 = "갑자기 문 박차고 들어왔을 때의 그 얼굴……."
1002603-86 = "크큭. 꽤 볼 만했다고, 그거."
1002603-87 = "……뭐야. 별로 곤란해하지 않는 얼굴이잖아. 재미없구만."
1002603-88 = "뭐, 그래도. 어쨌거나……."
1002603-89 = "……방금 일은 고마워. 선생."
1002603-91 = "(이후 네루와 조금 더 시간을 보내다 샬레 부실로 돌아왔다.)"
