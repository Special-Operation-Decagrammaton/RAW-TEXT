[translation]
1012506-1 = "마법의 화가"
1012506-2 = "(에리와 약속한 와일드헌트의 학원 거리로 나왔다.)"
1012506-8 = "오오! 이쪽입니다, 마스터!"
1012506-9 = "준비는 모두 마쳐두었습니다. 어서 가시지요."
1012506-10 = "[s] \"오늘은 그림을 그린다고 했지?\""
1012506-11 = "그렇습니다."
1012506-12 = "그것도 마스터를 모델로 초상화를 그려보려 합니다."
1012506-13 = "[s] \"오오, 기대되는걸?\""
1012506-14 = "뉴후후, 기대하셔도 좋습니다. 오늘은 특별한 상황에서 진행할 거니까요."
1012506-15 = "최대한 저의 몸에 내재된 마나만을 사용해서 그릴 거랍니다."
1012506-16 = "[s1] \"실기 시험 대비를 하는 거구나?\"\n[s2] \"혹시 모자도 벗는 거야?\""
1012506-22 = "마, 마스터는 저를 발가벗기고 싶으신 건가요……?"
1012506-23 = "……뭐, 마스터의 요구라면 벗겠습니다만. 이렇게 사람이 많은 곳에선 곤란해요."
1012506-24 = "[s] \"……모자 이야기하는 거 맞지?\""
1012506-28 = "뉴후후후, 어떨까요?"
1012506-29 = "[s] \"맞다고 해줘!\""
1012506-30 = "뉴후후. 맞아요. 모자 이야기였어요!"
1012506-31 = "자, 환영인사는 어느 정도 한 것 같으니 바로 아틀리에로 이동하죠."
1012506-36 = "[ns] \"응? 이쪽은 아틀리에로 가는 길이 아니잖아?\""
1012506-37 = "아닙니다. 아틀리에로 가는 길이 맞습니다."
1012506-38 = "바로 여기가 오늘의 아틀리에이기 때문이죠!"
1012506-39 = "와일드헌트 학원에서 가장 많은 사람이 오가는 이곳에서 마스터의 초상화를 그릴 겁니다!"
1012506-40 = "이런 곳에서 그림을 그리면, 분명 자신감을 키울 수 있을 거예요!"
1012506-41 = "[s3] \"확실히 이 방법이라면…….\"\n[s4] \"보는 눈이 많으니 자신감이 키워질지도.\""
1012506-44 = "자, 그럼 이쪽의 의자에 앉아주세요. 바로 캔버스를 설치할 테니까."
1012506-51 = "으음? 야외 실습인가?"
1012506-52 = "심심하던 참이었는데 적당히 구경이나 하다 가죠."
1012506-57 = "[ns] \"벌써 구경꾼이 모이기 시작했어…….\""
1012506-59 = "괘, 괜찮습니다! 예상했던 부분이니까요!"
1012506-63 = "그럼 시작하겠습니다."
1012506-64 = "공개된 아틀리에에서 진행하는, 저만의 세계창조 마법을!"
1012506-67 = "[wa:5510]― [log=에리]……처음 회화를 그렸을 때가[wa:1530] 생각나요. [/log]"
1012506-70 = "― [log=에리]그때는…… [wa:1200]정직하게,[wa:660] 순수하게[/log]"
1012506-72 = "― [log=에리]캔버스와 마주했었어요.[wa:120] [/log]"
1012506-75 = "[wa:650]― [log=에리]지금의 저는…… [wa:1510]아닌 것 같아요.[/log]"
1012506-78 = "― [log=에리]무엇을 그리면 좋을지[wa:1200] 방황하다가,[wa:40] [/log]"
1012506-80 = "― [log=에리]자신감을 [wa:680]잃어버리게[wa:400] 되어서…… [/log]"
1012506-83 = "[wa:660]― [log=에리]그러던 중,[/log]"
1012506-85 = "― [log=에리]마스터께서[wa:560] 알려 주셨어요. [/log]"
1012506-88 = "― [log=에리]<꿈>이라는 마법이,[/log]"
1012506-90 = "― [log=에리]이미 [wa:490]마음속에 [wa:830]깃들어 [wa:250]있다고.[/log]"
1012506-93 = "[wa:920]― [log=에리]꿈이 있다면……[wa:2170] 더 이상,[/log]"
1012506-95 = "― [log=에리]길을 헤매는 일은 [wa:810]없을 거예요.[/log]"
1012506-98 = "― [log=에리]마스터…… [wa:1530]괜찮다면, [/log]"
1012506-100 = "― [log=에리]저와 같은 길을 [wa:1020]걷지 않으시겠어요?[/log]"
1012506-103 = "[wa:610]― [log=에리]형형색색의 [wa:1450]꿈으로 가득한,[/log]"
1012506-105 = "― [log=에리]마법의 길을![/log]"
1012506-109 = "어떤가요, 마스터. 저의 마음이 닿았나요?"
1012506-110 = "[s5] \"그래. 확실히 닿았어.\"\n[s6] \"언령 마법사는 내가 아니라 에리였네.\""
1012506-113 = "에헤헤헤……."
1012506-114 = "[s] \"그림, 살짝 봐도 돼?\""
1012506-115 = "그건 안 돼요! 완성되면 보여드릴 거예요!"
1012506-120 = "오, 에리 쨩이다!"
1012506-121 = "어라? 이 그림은……?"
1012506-122 = "여, 여러분? 여, 여, 여기는 언제?!"
1012506-123 = "와아, 인상적인 초상화네. 에리만의 색감이 느껴져!"
1012506-124 = "후훗, 부끄러워하더니, 엄청 멋진 그림이잖아."
1012506-125 = "그, 그런가요……?"
1012506-126 = "아, 미안! 방해하면 안 되니까 이만 물러날게!"
1012506-127 = "멋지다, 에리 쨩! 파이팅이야!"
1012506-131 = "에헤, 에헤헤헤……."
1012506-132 = "[s] \"좋은 친구들이네.\""
1012506-133 = "네. 모두 좋은 분들이에요."
1012506-134 = "……역시, 괜한 걱정이었던 거네요."
1012506-139 = "그럼 계속 진행해 보겠습니다!"
1012506-144 = "저만의, 세계창조를……!"
1012506-146 = "(이후 많은 사람들의 호응 속에서 에리의 작품이 완성되었다.)"
1012506-147 = "(누가 보아도 에리가 그렸다고 느껴지는, 훌륭하고 멋진 작품이었다.)"
