[translation]
80000132-1 = "마스터를 위한 마나 충전"
80000132-2 = "(오늘 아침에 있었던 일이다.)"
80000132-5 = "마스터! 오늘 저희 학원에 오실 예정이라 하셨죠?"
80000132-6 = "그렇다면 꼭 전해드리고 싶은 게 있어요!"
80000132-7 = "뉴후후, 그럼 학원의 비밀 장소에서 만나도록 하죠!"
80000132-9 = "(그리하여 도착한 와일드헌트 예술학원의 어느 공터.)"
80000132-12 = "인적 없는 공터"
80000132-14 = "오. 안녕하십니까, 마스터! 생각보다 일찍 오셨군요!"
80000132-15 = "[s] \"이런 곳에서 보자니, 무슨 일이야?\""
80000132-16 = "그건…… 마스터와의 마나 공명을 최대화할 수 있는 장소라 판단했기 때문입니다."
80000132-17 = "다른 곳은 사람이 많아, 다양한 마력장이 간섭 효과를 일으키기에……."
80000132-18 = "[s] \"응……? 단둘이서 만나고 싶었다는 말이야?\""
80000132-19 = "그, 그렇습니다!"
80000132-20 = "역시 마스터. 눈치가 빠르시군요."
80000132-21 = "그러니까, 둘뿐이기도 하고……!"
80000132-22 = "……벗어도, 되겠죠?"
80000132-23 = "[s] \"……으응?!\""
80000132-24 = "마스터. 오늘은 저의 각오를 보여드리고 싶어요."
80000132-25 = "……에잇!!!"
80000132-30 = "햐아아아앗……!"
80000132-39 = "아, 아무리 마스터를 위해서라고는 하지만, 밖에서라니…… 여, 역시 부끄럽네요."
80000132-40 = "[s] \"저기…… 에리야?\""
80000132-41 = "죄, 죄송합니다, 이상하죠! 알고 있기는 한데요……!"
80000132-42 = "저는 알몸이 되는 것과 같은 거라……"
80000132-43 = "으으, 오컬연 분들과 연습할 때는 괜찮았는데……."
80000132-44 = "[s] \"그 아이들 앞에서는 부끄럽지 않은 거야?\""
80000132-45 = "그, 그분들과는 목욕도 같이하는 사이니까요."
80000132-46 = "그래서 모자를 벗어도 딱히……."
80000132-47 = "똑같다, 고 해야 할까요……"
80000132-48 = " ……아?! 그, 그러니까 여기엔 뭔가 다른 의미가 있는 게 아니라!"
80000132-49 = "[s] \"무, 무리하지 않아도 돼! 다시 써도 괜찮으니까!\""
80000132-50 = "하, 하지만 저도 각오는 하고 왔다고요……!"
80000132-51 = "게다가 효율적인 마력 전달을 위해서라면…… 이런 모습이 되어야……."
80000132-52 = "……."
80000132-53 = "괘, 괜찮습니다, 제대로 할 수 있으니까요……!"
80000132-54 = "후우……."
80000132-55 = "그, 그럼 마스터!"
80000132-60 = "저의 마력을…… 꾹꾹 눌러 담은 초콜릿이에요."
80000132-61 = "모자의 힘에 의지하지 않고, 저만의 마법을 사용해 만들었죠."
80000132-62 = "그래서 모자를 쓰고 드리는 건 좋지 않다고 생각해서……!"
80000132-63 = "……마, 마스터?"
80000132-64 = "[s] \"오오, 보는 것만으로도 힘이 솟아!\""
80000132-65 = "저, 정말인가요?"
80000132-66 = "그, 그럼, 그……."
80000132-67 = "'아~앙'을 부탁드려도 괜찮을까요……!?"
80000132-68 = "[s] \"마나 충전이구나!\""
80000132-69 = "그, 그렇습니다!"
80000132-70 = "또 저의 의도를 간파하시다니…… 역시 마스터는 대단하군요."
80000132-71 = "모, 모자가 없어서 얼굴이 전부 드러나는 게 부끄럽긴 합니다만……."
80000132-72 = "해보겠습니다! 준비되셨나요?"
80000132-73 = "[s] \"언제든 오케이야!\""
80000132-74 = " 그, 그렇다면 갑니다!"
80000132-75 = "우선 별 모양 초콜릿부터……."
80000132-80 = "어, 어떠실까요?"
80000132-85 = "[ns] \"오오, 달콤하고 톡톡 튀는 느낌이야!\""
80000132-86 = "에헤헤…… 별 모양 초콜릿엔 팝핑 캔디를 넣었어요."
80000132-87 = "잠이 올 때 하나씩 먹으면 분명 도움이 될 거예요."
80000132-88 = "[s] \"하트 모양은 어떤 맛이야?\""
80000132-89 = "그건…… 드셔보시고 판단해 주세요."
80000132-90 = "그, 그럼 부디……!"
80000132-94 = "[ns] \"이, 이 맛은……?!\""
80000132-95 = "(……달콤하면서도, 새콤한 맛이 느껴진다.)"
80000132-96 = "(왠지 고갈된 마나가 회복되는 느낌이 든다……!)"
80000132-97 = "어, 어떠신가요?"
80000132-98 = "하트 모양 초콜릿엔…… 다양한 비타민을 넣어 봤어요."
80000132-99 = "초콜릿이면서도 영양제인 거죠."
80000132-100 = "그게…… 마스터는 항상 바쁘시잖아요?"
80000132-101 = "식사도 제대로 못 하시고, 늦게까지 야근하실 때도 있고……."
80000132-102 = "으으, 생각만으로도 뭔가 슬퍼져요……."
80000132-103 = "그럴 땐 저를 생각하면서 이 하트 모양 초콜릿을 드셔주세요."
80000132-104 = "분명, 고갈된 마나가 샘솟을 거예요!"
80000132-105 = "[s1] \"에리의 마음이 느껴진다…….\"\n[s2] \"지금 당장 다 먹고 싶어!\""
80000132-108 = "너, 너무 많이 드시면 곤란해요!"
80000132-109 = "마나 충전도 지나치면 과부하가 일어나는 법이니까요."
80000132-110 = "[ns] \"응! 명심할게!\""
80000132-112 = "[ns] \"에리도 같이 먹지 않을래?\""
80000132-115 = "마, 마스터로부터의 마나 역제공……?!"
80000132-116 = "그 효과는 분명 통상적인 충전보다 두 배 이상 뛰어나겠죠!"
80000132-117 = "그, 그럼 부탁드립니다, 마스터!"
80000132-119 = "(이후 한참 동안 에리와 마나가 충만한 시간을 보냈다.)"
