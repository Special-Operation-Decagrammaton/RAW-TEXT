[translation]
10057050-1 = "#title;제5화;왜 하필 전차야?"
10057050-3 = "#stm;[0,90];serial;100;[log]전차대회 예선까지[/log]"
10057050-5 = "#stm;[0,-90];instant;100;[log]D-3[/log]"
10057050-8 = "3;에리나;99\n#3;em;…\n#3;a\n#wait;2500"
10057050-9 = "3;에리나;00;좋은 소식은, 전차 제작이 순조롭다는 것-\n#3;em;[반응]"
10057050-10 = "3;에리나;01;나쁜 소식은, 저번에 말한 초저가 푸딩 연구가 성공해 버렸다는 거예요!"
10057050-11 = "3;에리나;14;생긴 것도 푸딩이고 감촉도 푸딩인데, 물 비율을 한계까지 높였더니 입에 넣자마자 사라져 버렸어요!\n#3;m4"
10057050-12 = "3;에리나;99;뭐…… 지시대로 '입 안에서 살살 녹는' 푸딩이니까, 뭐라고 못 하겠죠……."
10057050-13 = "3;에리나;00;이걸 급식으로 받게될 학생들에게, 미리 몰래 미안-!\n#3;jump"
10057050-14 = "3;에리나;11;여튼, 어제부터 전차 만들기는 잘 되고 있어요! 놀라울정도!"
10057050-15 = "[s] \"안나하고는 의견 조율이 잘 됐어?\""
10057050-16 = "3;에리나;03;그쪽도 잘되고 있어요…… 아마도요! 선생님 덕분이에요!\n#3;em;[재잘]\n#3;m3"
10057050-17 = "3;에리나;02;안나 녀석, 머리도 똑똑한 데다, 실력도 대단하긴 하거든요. 전차 설계는 원래 전문 분야이기도 하고요."
10057050-18 = "3;에리나;04;하지만 협업할 때는 조금 꼴통…… 아, 아니지. 이건 단어가 좀 세다…….\n#3;stiff"
10057050-19 = "3;에리나;02;선생님, 그 단어가 뭐였죠? '생각이 얕고 성격이 좋지 않은 사람을 일컫는, 꼴찌에서 통이라는 뜻의 단어' 요. \n#3;em;[?]"
10057050-20 = "[s] \"그…… 중요한건 아닌 것 같네!\""
10057050-21 = "3;에리나;21;공학자로서 조금 안 맞는 점이 있달지……. 아니, 사실 하나도 안 맞네요.\n#3;em;[한숨]"
10057050-22 = "3;에리나;00;그래도 우리 중에, 실제로 굴러가는 전차를 만들어본 건 걔밖에 없으니까…… 믿어봐야죠!"
10057050-23 = "3;에리나;99;그 녀석은 뭔가 방법이 있는 것 같아요. 잘난 척은 괜히 하는 게 아니겠죠!"
10057050-24 = "3;에리나;07;그리고, 산 위는 진-짜 싫단 말이에요! 추워서 맨날 감기 걸리고, 달콤한 디저트 카페도, 예쁜 옷가게도 없어요!\n#3;hophop"
10057050-25 = "#st;[0,0];instant;1;"
10057050-27 = "3;에리나;02\n#3;em;[!]\n#3;h\n#wait;800"
10057050-28 = "3;에리나;04;아, 그러니까! 디저트의 감미료도, 옷의 섬유도…… 어디까지나 연구 레퍼런스라는 거예요!\n#3;stiff"
10057050-29 = "3;에리나;20;에헤헤……!\n#3;em;[///]"
10057050-30 = "[s] \"연구는 중요하지, 그렇지!\""
10057050-32 = "[ns] \"그런데, 다른 분야도 많은데 왜 하필 전차야?\""
10057050-33 = "3;에리나;00;전차는 기계, 화학, 전자가 모인 중공업의 결정체잖아요? 고생하며 공부해서 얻은 실력 발휘해 보기 딱 좋죠!"
10057050-34 = "3;에리나;99;강판의 열처리, 화약의 배합, 연료와 윤활유의 합성도 전부 화학이니까요!"
10057050-35 = "3;에리나;11;그리고, 완전 멋지잖아요!\n#3;closeup\n#fontsize;100"
10057050-37 = "3;안나;04\n#3;em;[...]\n#3;a\n#wait;2500"
10057050-38 = "3;안나;14;에리나, 그런 얘길 했군요. 제 앞에서도 그렇게 좋게 말하면 좀 좋을 텐데."
10057050-39 = "3;안나;99;확실히, 에리나하고는 의견이 잘 안 맞아요. 목표는 같은데 방법이 전혀 다르달지. 후우…….\n#3;em;[한숨]"
10057050-40 = "3;안나;01;서로 전공부터, 경력도 전혀 다르니까 어쩔 수 없긴 해요. 어디, 예를 들자면……."
10057050-41 = "#st;[0,0];instant;1;"
10057050-43 = "3;안나;01\n#3;m2\n#wait;1300"
10057050-44 = "3;안나;02;선생님, 이 추가 연료통을 전차 옆에 달고 다니는 건 어떨 것 같으세요?\n#3;em;[?]"
10057050-45 = "3;안나;03;위험할까요? 아니면 오히려 안전할까요?"
10057050-46 = "[s] \"포탄에 맞아서 불이 붙으면 위험하지 않을까…….\""
10057050-47 = "3;안나;33;후훗, 얼핏 보면 위험해 보이죠.\n#3;em;[반짝]"
10057050-48 = "3;안나;24;하지만 오히려 안전성이 올라가요. 연료탱크가 전차를 보호해 주거든요!"
10057050-49 = "[s] \"그래? 어떤 식으로?\""
10057050-50 = "3;안나;03;어차피 외부에서 불이 나봤자, 전차 자체에는 큰 영향이 없거든요. 알루미늄 차체라면 연소되겠지만, 어차피 강철이니까요.\n#3;m3"
10057050-51 = "3;안나;20;그리고, 연료는 포탄의 위력을 일정 수준 감쇄시켜 줘요."
10057050-52 = "3;안나;25;이런 설계를 하면, 연료탱크의 용적하고 방어력 문제를 한 번에 해결할 수 있어요."
10057050-53 = "3;안나;31;특히, 성형작약탄 같은 경우엔…… 연료가 관통력을 엄청 떨어뜨려서, 공간장갑 역할도 하고요!\n#3;em;[음표]\n#3;jump"
10057050-54 = "3;안나;20;얼핏 보면 위험하지만, 조금만 더 생각하면 그렇지 않은 셈이죠!"
10057050-55 = "3;안나;05;그런데 에리나한테 이 제안을 했더니 거의 기절하는 거 있죠!\n#3;em;[한숨]"
10057050-56 = "3;안나;18;겉으로는 쿨한 체 다 하면서, 의외로 겁쟁이거든요!"
10057050-57 = "[s] \"전차 제작은 순조롭니?\""
10057050-58 = "#st;[0,0];instant;1;"
10057050-60 = "3;안나;04\n#3;em;[!]\n#3;h\n#wait;800"
10057050-61 = "3;안나;22;……그럼요! 예전과는 비교도 되지 않을 정도로 진척이 빨라요.\n#3;stiff"
10057050-62 = "3;안나;03;예전 같았으면 RWWE로 하나하나 정하느라 시간이 다 갔을 거예요. 가끔은 둘 다 레슬링으로 설득하는 거에 너무 집중해서 뭘로 다퉜는지 잊기도 했고요."
10057050-63 = "3;안나;13;……선생님 도움이 없었더라면 어떻게 됐을지."
10057050-64 = "[s] \"다른 분야도 많은데 왜 하필 전차야?\""
10057050-65 = "3;안나;02;아…… 전차로 한 이유요?\n#3;em;[?]"
10057050-66 = "3;안나;01;한창 체리노 회장이 '게헨나 컵에서 이겨야 해!'라고 했을 때, 사무국원이 여기까지 대회 포스터를 붙이러 왔어요."
10057050-67 = "3;안나;99;그때 무심코 '전차는 오래간만이네'라고 말했더니, 에리나가 엄청나게 들떴어요."
10057050-68 = "3;안나;03;다들 '당장 하자!!'는 분위기가 되어서 어쩌다 보니 시작된 거예요."
10057050-69 = "3;안나;31;아! 그리고 당연히 전차 만드는 거에 제가 빠질 수 없으니까 그렇죠! 붉은겨울…… 아니, 키보토스 최고의 전차 설계자니까요!\n#3;em;[음표]\n#3;jump"
10057050-70 = "3;안나;03;전차는 기계 공학의 집대성이에요. 동력, 구조, 재료, 가공기술 전부가 설계도부터 시작해서 실존하는 멋진 기계 생태계를 이루죠!"
10057050-71 = "3;안나;25;이런 기회에 제가 참여하지 않는 건 공학에게 있어 모독이라 할 수 있죠."
10057050-72 = "3;안나;31;용접 시퀀스도 전부 제가 다 짰어요! 용접 순서가 마구잡이라면, 잔류 응력 때문에 차체가 뒤틀리거든요!\n#3;em;[반짝]"
10057050-73 = "3;안나;34;후우…… 참, 아카데미 수석의 천재는 귀찮은 법이네요. 여기까지 와서도, 다시 전차를 만드는 운명이라니.\n#3;stiff"
10057050-74 = "3;안나;21;미리 우승 소감 연설문이라도 작성해둘까요? 아하하…….\n#3;em;[///]"
10057050-76 = "3;라나;00;그렇군요, 진전이 있었다니 다행입니다.\n#3;em;…\n#3;a"
10057050-77 = "3;라나;02;아, 발밑에 주의해 주시기 바랍니다. 고무호스를 정리하고 있었습니다."
10057050-78 = "3;라나;99;두 사람은 매번 의견이 맞질 않았습니다. 닮았지만, 맞는 게 하나도 없습니다."
10057050-79 = "#st;[0,0];instant;1;"
10057050-81 = "3;라나;01\n#3;em;[?]\n#3;h\n#wait;800"
10057050-82 = "3;라나;02;……저 말씀이십니까? 본업의 전산관리가 일단락된 참이었습니다."
10057050-83 = "[s] \"일단 해킹을 했는데도 전산을 맡기는구나…….\""
10057050-84 = "3;라나;00;엄밀히 말하자면, 조금 다릅니다."
10057050-85 = "3;라나;99;체리노 회장은 제가 물건을 도둑질한 줄 알고 있습니다. 보고를 대충 들은 탓이겠죠."
10057050-86 = "3;라나;01;그래서 저를 훔칠 게 없는 전산으로 보내라고 지시했습니다."
10057050-87 = "[s] \"그…… 렇구나.\""
10057050-88 = "3;라나;13;그…… 런 겁니다.\n#3;em;[한숨]"
10057050-89 = "3;라나;01;이미 전산국이 있는데도 굳이 별도의 전산 업무를 맡겼다는 건 의문입니다."
10057050-90 = "3;라나;02;전산국에서 고무 오리를 너무 적게 주문했기에 몰래 수량조정을 해준 적도 있습니다만, 그 이외에도 다른 실수를 한 모양인지 별도의 전산부서가 필요했던 것 같다는 추측입니다.\n#3;m4"
10057050-91 = "3;라나;01;그러고 보니, 선생님께서 말씀하신 '227호 특별반'에 대해 신경이 쓰여서 찾아봤습니다."
10057050-92 = "3;라나;99;서버실 아주 깊은 곳에 있어서 찾는 데 애를 먹었습니다."
10057050-93 = "#st;[0,0];instant;1;"
10057050-95 = "3;라나;00\n#3;m5\n#3;h\n#wait;1300"
10057050-96 = "3;라나;00\n#3;greeting\n#3;h\n#wait;1300"
10057050-97 = "3;라나;03;바로, 여기 있습니다.\n#3;em;[반짝]"
10057050-98 = "[s] \"이게 뭐니? OMR 카드?\""
10057050-99 = "3;라나;02;<천공카드>라고 하는 것입니다. 붉은겨울의 전산을 관리하는 데 쓰이는 물건입니다.\n#3;em;[반응]"
10057050-100 = "3;라나;01;각 칸마다 구멍을 뚫어서 데이터를 입력하는 방식의 기록 매체입니다."
10057050-101 = "3;라나;99;용량이 아주 작아서, 한 장에 80자밖에 못 넣습니다."
10057050-102 = "[s] \"이걸 아직 쓰는 이유가 있니?\""
10057050-103 = "3;라나;02;'일단 작동은 하니까'입니다.\n#3;m3"
10057050-104 = "3;라나;13;자세한 이유는 모르겠습니다만, 바꾸지 않은 이유는 아마 그래서일 거라고 생각합니다.\n#3;em;[한숨]"
10057050-105 = "3;라나;00;붉은겨울은 지도자 빼고 딱히 바꿀 이유가 없으면 바꾸지 않는 편이라서요. 붉은겨울의 전자기술은 대체로 이런 수준입니다."
10057050-106 = "3;라나;02;눈에 보이고 만질 수 있어서 안심이 되기에 제 취향에도 맞는 건 덤입니다."
10057050-107 = "3;라나;01;아무튼. 아마 227호 특별반의 명부와 관리 내역이 있을 것으로 예상되기에, 천천히 로딩해 보겠습니다."
10057050-108 = "3;라나;13;천공카드는 순차 접근만 가능하기에, 순서가 뒤섞이면 무용지물이 되니 조심해서…….\n#3;m4"
10057050-109 = "#st;[0,0];instant;1;"
10057050-113 = "[ns] \"라나, 발 밑에 조심하렴!!\""
10057050-114 = "4;라나;04;앗,\n#4;em;[!]"
10057050-116 = "4;라나;04\n#4;falldownL\n#wait;1500"
10057050-118 = "4;라나;15\n#4;greeting\n#4;a\n#wait;1200"
10057050-119 = "4;라나;05;……\n#4;stiff"
10057050-120 = "[s3] \"라나, 괜찮니?! 다치지 않았어?\"\n[s4] \"카드가 다 흩어졌는…… 데?\""
10057050-123 = "4;라나;15;……."
10057050-124 = "4;라나;00;딱히 중요한 건 아니었을 겁니다. 정말 중요한 거라면 체리노 회장이 기억하고 있겠지요.\n#4;em;[한숨]\n#4;m3"
10057050-125 = "4;라나;99;……음. 다시 하던 이야기로 돌아가자면, 저 둘의 작업 속도에 개선이 있는 것은 좋은 일입니다."
10057050-126 = "4;라나;02;저는 보조만 하는지라, 두 사람의 진척은 전차 완성시기를 좌우하게 됩니다."
10057050-127 = "[s] \"라나는 전차에 딱히 관심 없는 거니?\""
10057050-128 = "4;라나;00;네. 관심이 있느냐 없느냐고 물으신다면, 관심이 없는 편입니다."
10057050-129 = "4;라나;99;전차는 그저 멋있고, 기술적으로 흥미롭고, 강하고, 멋진 것 이외에 별것 없습니다.\n#4;em;…"
10057050-130 = "[s] \"별것 없다기엔 '멋있다'가 두 번이나 나왔는데…….\""
10057050-131 = "4;라나;02;저는 183호가 사면받는다거나, 상을 받거나 하는 데는 흥미가 없습니다.\n#4;em;[반응]"
10057050-132 = "4;라나;01;그저, 제 둘뿐인 친구들이 하고 싶어 하는 일이기에 돕고 싶은 것뿐입니다."
10057050-133 = "4;라나;99;친구가 생겨본 것은 처음이라, 지금의 마음이 옳은지는 모르겠습니다."
10057050-134 = "#st;[0,0];instant;1;"
10057050-138 = "3;라나;00\n#3;em;[?]\n#3;h\n#wait;1200"
10057050-140 = "3;안나;04\n#3;a\n#3;h\n#wait;1300"
10057050-141 = "3;안나;05;라-나-! 재료 남은 거 더 있니?\n#3;hophop"
10057050-142 = "#st;[0,0];instant;1;"
10057050-144 = "3;안나;02\n#3;em;[!]\n#3;h\n#wait;800"
10057050-145 = "3;안나;22;앗, 선생님도 여기 계셨군요!\n#3;stiff"
