[translation]
10005005-1 = "프롤로그;C&C의 뉴 멤버"
10005005-3 = "……클리어. 잠입 완료."
10005005-4 = "여기도 클리어. 아무도 없음을 확인했다."
10005005-5 = "……좋아."
10005005-11 = "골든 플리스호 선내 기관실"
10005005-14 = "하, ……뭐야? 생각보다 별거 없네?"
10005005-15 = "망망대해를 움직이는 크루즈선에 접근해서 몰래 올라타다니……."
10005005-16 = "그것도 밀레니엄조차 아닌 다른 학교의 선박에 말이지. 이런 경험은 또 처음인걸."
10005005-17 = "다행이네요. 아직은 아무도 저희 존재를 눈치채지 못한 것 같아요."
10005005-18 = "후훗. 이 정도면 문제없이 진행되고 있다고 봐야겠죠?"
10005005-19 = "……하아."
10005005-20 = "문제가 없긴 뭐가 없어? 이 일은 시작부터 문제였는데."
10005005-21 = "맘에 안 들어, 맘에 안 든다고. 하나부터 열까지……!"
10005005-22 = "그 세미나 회계 녀석 말을 따라야 하는 것도, 이런 식으로 쫄래쫄래 숨어다녀야 하는 것도!"
10005005-23 = "그리고 무엇보다……."
10005005-24 = "……(찌릿)."
10005005-25 = "[s1] \"잘 부탁해, 네루.\"\n[s2] \"내가 있어서 불편한 거야?\""
10005005-26 = "다른 사람도 아닌 선생이, 우리를 감시하는 역할로 붙었다는 게 제일 열 받는다고!"
10005005-27 = "다른 사람도 아닌 선생이, 우리를 감시하는 역할로 붙었다는 게 제일 열 받는다고!"
10005005-28 = "[s] \"난 딱히 그럴 생각으로 온 건 아니지만…….\""
10005005-29 = "아하하……. 괜찮습니다. 저희도 결코 선생님을 그렇게 여기는 건 아니니까요."
10005005-30 = "이건 아무래도 상황의 문제라는 거겠죠."
10005005-31 = "선생님은 그럴 의도가 아니었어도, 보낸 세미나 입장에선 그럴 의도였다……. 그런 말이지."
10005005-32 = "아~. 진짜! 화딱지 나네! 대체 왜 일이 이렇게 된 거야? 앙?"
10005005-33 = "알아서 한다니까? 진짜. 일을 맡겼으면 그냥 맡겨 놓고 기다리기나 할 것이지……!"
10005005-34 = "아하하……."
10005005-35 = "음……."
10005005-36 = "뭐……."
10005005-37 = "그 부분은 어느 정도 자업자득인 것 같기도 하고……."
10005005-39 = "(……이틀 전.)"
10005005-42 = "……연결되었습니다. C&C의 아카네,"
10005005-43 = "수신 이상 없습니다."
10005005-44 = "아, 아. 응. 이쪽도 잘 돼."
10005005-45 = "하아……. 결국 또 이렇게 되는 거네."
10005005-46 = "후훗. 보아하니 또 의뢰하실 일이 생기셨나 보군요."
10005005-47 = "이왕이면 좋게 생각하시는 게 어떨까요? 그래도 항상 목표는 달성하잖아요?"
10005005-48 = "문제는 그다음이라고! 설마 잊은 건 아니겠지? 너희가 벌인 일의 뒷수습을 누가 하는지."
10005005-49 = "매번 조용하게 처리해 달라고 해도 한 번을 그냥 넘어간 적이 없었잖아."
10005005-50 = "주변 일대는 늘 화려하게 터뜨려 버리고, 비품들은 다 망가뜨리고!"
10005005-51 = "이쪽은 매번 그거 때문에 골치란 말이야! 저번 달에도 정해 뒀던 예산의 여섯 배를……!"
10005005-52 = "……후. 뭐, 그래도 이번 일만큼은 그럴 수 없겠지."
10005005-53 = "나도 나름대로 머리를 써 뒀으니까."
10005005-54 = "……네? 그게 무슨……."
10005005-55 = "인사하시지. 이번 의뢰에 당신들과 함께 참여할 참관인."
10005005-60 = "너희가 정말 필요한 만큼만 일을 벌이는 건지, 그 이상으로 사고를 치고 다니는 건지 확인해 줄 분이니까."
10005005-61 = "확인을 위한 절차일뿐이니, 너무 나쁘게는 생각하지 말아 달라고."
10005005-62 = "아하하……. 그야……."
10005005-63 = "……어……?"
10005005-67 = "……선생님?"
10005005-69 = "하, 세미나 녀석들. 진짜 이번에는 내가 한 방 먹었다."
10005005-70 = "이런 식으로 우리를 물 먹일 거라곤 상상도 못 했는데 말이지."
10005005-71 = "화려하게 터뜨려? 보건실을 만석으로 채워? 그게 뭐 어쨌다고?"
10005005-72 = "일만 잘 처리하면 되는 거 아냐? 애초에 그 부대비용을 대는 게 자기 일이잖아?"
10005005-73 = "하, 진짜 생각하니까 또 열 받네. 그냥 이번 일도 대놓고 쳐들어가 버릴까?"
10005005-74 = "아니, 선배. 그건 무리다. 여긴 밀레니엄이 아니니까……."
10005005-75 = "아무래도 그건 문제가 있겠죠. 학교 간의 일로 발전할 수도 있고……."
10005005-76 = "알 게 뭐야? 학교 간의 문제가 되면 그 문제도 그냥 다 밀어버리면 되는 거잖아!"
10005005-77 = "자신 없으면 나한테 맡기든가, 내가 여기부터 싹 다 밀어버리면 되냐? 그런 거냐?"
10005005-78 = "[s3] \"그건 안 된다고 생각해. 네루.\"\n[s4] \"아무리 그래도 그건 동의하기 어려운걸.\""
10005005-79 = "……앙?"
10005005-80 = "……앙?"
10005005-86 = "선생, 지금 뭐라고 했어? 반대한 거야?"
10005005-87 = "선생까지 그렇게 나오겠다는 거야? 지금 그 회계 녀석 편을 드는 거냐고!"
10005005-88 = "[s5] \"응.\"\n[s6] \"안 되는 건 안 되는 거지.\""
10005005-89 = "……어……. 어어?"
10005005-90 = "……어……. 어어?"
10005005-91 = "……음……."
10005005-95 = "크으으윽! 진짜……! 진짜……!! 아으으으~!!!"
10005005-96 = "……후. 알았어. 알았다고. 안 하면 되잖아, 안 하면."
10005005-97 = "하여간 이번 일은 맘에 안 들어……."
10005005-102 = "오……."
10005005-103 = "……아카네. 지금 봤어?"
10005005-104 = "네, 카린. 저도 같은 생각이에요. 분명 세미나 회계 분의 방식이 그다지 반갑지는 않지만……."
10005005-105 = "후훗. 적어도 효과는 확실하네요. 아무리 부장님이라도 역시 선생님 말씀은 듣는군요."
10005005-106 = "혹시 처음부터 사실 감시가 아니라 이걸 노리고……?"
10005005-107 = "시끄러워! 아무튼, 오늘 기분 안 좋으니까 괜히 건드리지 말라고, 알았어?"
10005005-108 = "네. 그렇게 하죠."
10005005-109 = "그리고 선생님. 말씀드렸듯, 이번 임무는 싸우는 일 없이 조용하게 진행될 예정이에요."
10005005-110 = "이유야 어쨌건 선생님께서도 지금부터는 저희와 함께해 주실 테니, 승선증을……."
10005005-112 = "뭐야, 뭐야? 주인님!"
10005005-113 = "오늘은 우리랑 같이 일하는 거야?"
10005005-114 = "같은 팀? C&C의 뉴 멤버!?"
10005005-119 = "……네?"
10005005-120 = "……?"
10005005-121 = "C&C의 새 멤버? ……선생님이?"
10005005-122 = "뭐……. 이번 일에 한정한다면 그렇다고도 볼 수 있겠군. 흠……."
10005005-123 = "어머나……. 후훗. 그건 좀 재미있는 이야기네요."
10005005-124 = "선생님이 저희 멤버라, 이번 일에 대해 아주 조금은 호감이 생기려고 하는 걸요?"
10005005-126 = "부장님은 어떠세요? 아직도 싫으신가요?"
10005005-127 = "아앙? 말이라고 해!? 고작 그런 것 정도로 맘에 드네 마네가 손바닥 뒤집듯 뒤집히겠냐!?"
10005005-128 = "응! 난 좋은데? 부장은 싫어?"
10005005-129 = "하이고, 참 나. 누굴 열 살짜리 꼬맹인 줄 아나……."
10005005-130 = "그런 거 치곤 말하는 거랑 표정이 따로 놀고 있다만……."
10005005-131 = "쓰, 쓸데없는 소리 하지 마! 난 안 즐거우니까, 하나도 안 좋다고. 이런 거!"
10005005-132 = "[s7] \"난 꽤 즐거울 것 같은데.\"\n[s8] \"오늘은 잘 부탁해.\""
10005005-135 = "……큭."
10005005-136 = "……크으으으윽……!!"
10005005-140 = "……."
10005005-141 = "배, 백 프로 나쁘지만은 않다고 해 두겠어……."
