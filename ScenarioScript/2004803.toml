[translation]
2004803-1 = "물 위의 나기사님"
2004803-2 = "(나기사가 말한 텐트 앞에 도착했다.)"
2004803-3 = "(대체 이 텐트 안에 뭐가 들어있는 걸까…….)"
2004803-5 = "프라이빗 해변"
2004803-6 = "[ns] 텐트를 연다."
2004803-9 = "[ns] \"……서핑보드?\""
2004803-10 = "(텐트 안에는 서핑보드를 비롯해 바나나보트, 수상스키, 카약 등 다양한 수상 레저용품들이 정리되어 있었다.)"
2004803-11 = "(그런데…….)"
2004803-12 = "[ns] \"……정말 아무도 안 건드렸구나.\""
2004803-13 = "(아무도 손을 대지 않은 탓에, 레저용품들 위에는 먼지만 쌓여 가고 있었다.)"
2004803-17 = "(그래서 괜히 손으로 먼지를 쓸어보다가…….)"
2004803-18 = "[ns] \"……이참에 서핑에 입문이나 해 볼까?\""
2004803-20 = "(그렇게, 서핑보드를 들고 호기롭게 바다로 향했다.)"
2004803-22 = "(그런데…….)"
2004803-24 = "해상 어딘가"
2004803-26 = "[ns] \"흡프웕!\""
2004803-27 = "(파도를 타기는커녕, 보드 위에서 균형을 잡는 것도 어려웠다.)"
2004803-31 = "[ns] \"쿨럭, 어푸푸……!\""
2004803-32 = "(그렇게 몇 번이나 물속으로 고꾸라졌을까.)"
2004803-33 = "……선생님?"
2004803-36 = "[wa:1160]― [log=나기사 수영복]이런 곳에서 [wa:930]어쩐 일이신가요?[wa:40] [/log]"
2004803-38 = "― [log=나기사 수영복]보드 위에 [wa:590]축 늘어져서…….[wa:40] [/log]"
2004803-41 = "[ns] \"숱한 역경을 겪었거든…….\""
2004803-42 = "[wa:330]― [log=나기사 수영복]……? [wa:1620]좀 더 구체적으로 여쭤봐도 될까요?[wa:700] [/log]"
2004803-45 = "― [log=나기사 수영복]바다는, 조금만 잘못해도[wa:1110] [/log]"
2004803-47 = "― [log=나기사 수영복]위험한 사고로 [wa:730]이어질 수 있는 [wa:550]장소니까요. [/log]"
2004803-50 = "[ns] \"아니…… 그 정도는 아닌데…….\""
2004803-51 = "[wa:400]― [log=나기사 수영복]이해하기 [wa:680]어렵네요……. [/log]"
2004803-53 = "― [log=나기사 수영복]상황에 따라서 [wa:1600]대응이 달라질 수 있으니 [wa:820]좀 더 자세히…….[/log]"
2004803-56 = "[ns] \"그냥 보드 위에서 자주 넘어졌을 뿐이야…….\""
2004803-57 = "[wa:700]― [log=나기사 수영복]아하, [wa:1270]그런 일이었군요.[wa:40] [/log]"
2004803-59 = "― [log=나기사 수영복]위험한 상태는 [wa:760]아니었던 것 같아서 [wa:970]안심입니다.[wa:80] [/log]"
2004803-62 = "― [log=나기사 수영복]균형 감각을 잡기까지가[wa:920] [/log]"
2004803-64 = "― [log=나기사 수영복]서핑의 [wa:660]첫 번째 [wa:920]고비라고들 합니다.[/log]"
2004803-67 = "― [log=나기사 수영복]처음에는 누구나 겪을 수밖에 없는 일이죠.[wa:1060] [/log]"
2004803-70 = "[wa:250]― [log=나기사 수영복]하지만…… [wa:1800]휴식을 취하더라도,[/log]"
2004803-72 = "― [log=나기사 수영복]그런 상태로는 몸이 차가워져 버릴 거예요.[wa:670] [/log]"
2004803-75 = "― [log=나기사 수영복]이쪽으로 오세요.[/log]"
2004803-77 = "― [log=나기사 수영복]따뜻한 음료가 준비되어 있답니다.[wa:1040] [/log]"
2004803-82 = "마침 보온병에 마실 것을 담아 왔답니다."
2004803-83 = "한 모금 드시면 몸이 따뜻해질 거예요."
2004803-84 = "[s] \"바다 위에서도 홍차를……?\""
2004803-85 = "후후, 홍차는 아니고 그냥 따뜻한 물이랍니다."
2004803-86 = "홍차는 보온병에 담아 두면 맛이 변하거든요."
2004803-87 = "예? 저는 뭘 하고 있었냐고요?"
2004803-88 = "보시다시피, 표류를 즐기고 있었답니다."
2004803-89 = "모래사장에서 바닷바람을 맞으며 가만히 수평선을 바라보는 것도…… 조금 싫증이 나서요."
2004803-90 = "하지만 헤엄칠 기분은 아니고……."
2004803-91 = "가만히 있고 싶은데 가만히 있고 싶지는 않은 이 마음."
2004803-92 = "선생님은 알고 계신가요?"
2004803-93 = "[s] \"뭔지 모르겠는데 알 것 같아……!\""
2004803-94 = "후후, 선생님이라면 이해해 주실 줄 알았어요."
2004803-95 = "어쨌든, 그런 연유로 이렇게 표류하고 있었답니다."
2004803-96 = "바다 위에서는 가만히 있어도 바다가 대신 움직여 주니까요."
2004803-97 = "그래도 결국에는 올바른 선택이었네요."
2004803-98 = "이렇게 선생님을 만날 수 있었으니까."
2004803-100 = "(그렇게 나기사와 바다 위에서 따뜻한 물을 나눠 마셨다.)"
