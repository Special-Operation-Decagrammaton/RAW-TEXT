[translation]
101030-1 = "제3화;일상 속의 균열 1"
101030-2 = "아비도스 사막 발굴지"
101030-5 = "차, 찾은 것 같습니다!"
101030-6 = "찾았다고?"
101030-7 = "네, 넵! 전달받은 좌표의 지하에서 약 135m X 23m X 13m 크기의 구조체를 발견했습니다……!!"
101030-8 = "확실하군……! 지금 당장 제너럴에게 연락드려라! 긴급사항이다!!"
101030-9 = "네, 넵!!"
101030-10 = "그리고 총학생회의 방위실장에게도 연락해라. 아, 그쪽은 방첩 통신망으로."
101030-11 = "네!"
101030-16 = "아비도스 시내"
101030-17 = "……."
101030-23 = "서둘러! 이동한다!"
101030-24 = "넵!"
101030-29 = "카이저 PMC……."
101030-35 = "PMC 병력들이 사막 쪽으로 이동하고 있었다고?"
101030-36 = "응. 지금까지와는 전혀 다른 규모였어."
101030-37 = "흐음~ 무슨 일이라도 있는 건가. 그 녀석들 한동안 조용했잖아."
101030-38 = "요 며칠 사이에 카이저 PMC의 이동이 잦아진 건 맞아요……."
101030-39 = "젠장…… 그놈들 남의 자치구를 제집 드나들듯이……."
101030-40 = "아비도스 사막에 무슨 일이라도 있는 걸까요? 거기는 카이저의 사유지라 저희가 접근할 수가 없어서……."
101030-41 = "몰래 확인해보면 돼."
101030-42 = "시로코 쨩……."
101030-43 = "이야, 우리 시로코 쨩이 그랬다간 예전의 일이 반복될 뿐이잖아. 조금은 과거에서 교훈을 얻어야지."
101030-44 = "으, 으응……."
101030-45 = "맞아요. 이번엔 선생님과 논의를 해보는 게 좋을 거 같아요."
101030-49 = "그건 그렇지만…… 선생님, 최근엔 훨씬 더 바빠진 것 같아서…… 저희의 연락이 폐가 되진 않아야 할 텐데……."
101030-50 = "폐가 될 리가 없잖아. 우리와 선생님 사이인데!"
101030-51 = "응응, 맞아요. 아야네 쨩. 선생님이라면 분명 발 벗고 나서줄 거예요."
101030-52 = "맞아. 참고로 저번엔 선생님이 연락해서 그냥 특별한 이유 없이 내 안부를 물어보기도 했어."
101030-53 = "선생님이요? 선배에게만?"
101030-54 = "시로코 선배 이 타이밍에 자랑을……?"
101030-55 = "응. 자랑이 아니라 사실 보고."
101030-56 = "으헤~ 눈치 없기는. 이럴 땐 원하는 리액션을 해주는 게 예의라구. 시로코 쨩~ 너무해. 이 아저씨는 질투 나버린다고!"
101030-60 = "아냐! 그런 거 자꾸 받아주니까 시로코 선배 버릇 나빠져 버리잖아! 가끔씩은 엄격하게 해야지!"
101030-61 = "음…… 그런가."
101030-62 = "으, 으음……."
101030-63 = "응응! 시로코 쨩은 강아지처럼 귀여우니까요. 어쩔 수 없어요☆"
101030-64 = "아하하…… 그럼 선생님이 뭐라고 하시던가요?"
101030-65 = "그냥…… 안부만 묻고…… 별일 없는지……. 특별한 내용이 있는 건 아니었어."
101030-66 = "흐음. 그렇구만. 그건 또 그거대로 찝찝한 느낌인데……."
101030-67 = "그러면 제가 선생님에게 연락을 드려볼게요. 한번 아비도스로 와달라고."
101030-68 = "네, 아야네 쨩. 부탁할게요."
101030-73 = "밀레니엄 게임개발부"
101030-75 = "언니, 이 컨셉은 안돼."
101030-76 = "뭐? 어째서?! 엄청 좋다고 생각했는데!"
101030-77 = "우리가 만드는 건 검과 마법이 나오는 RPG로 하기로 했잖아."
101030-78 = "그런데?"
101030-79 = "그런데가 아니라…… 그런데 어째서 주인공이 우주 전함을 타고 다니는 거야?"
101030-80 = "그거야 악당들이 우주 해적이니까! 악을 무찌르는 게 주인공의 역할이니까 그렇지!"
101030-81 = "용사가 우주 전함을 타고 있으면 안 된다구……."
101030-83 = "아냐! 엄청 느낌 좋잖아! 우주 용사!"
101030-87 = "유즈는 어떻게 생각해?"
101030-88 = "나, 난…… 나쁘지 않을지도……. 요즘 유행한다는 다다이즘 같은 느낌으로……."
101030-89 = "거봐! 무슨 소린지 모르겠지만 이건 먹힌다니까!"
101030-90 = "뭐야 그게……."
101030-95 = "아리스도 우주 용사는 좋은 것 같습니다."
101030-96 = "아리스 쨩?"
101030-97 = "아리스! 돌아왔구나!"
101030-98 = "엔지니어부에선 뭐래……?"
101030-99 = "네. 간단한 신체검사와 이것저것 건강 체크를 했는데 아리스에게서는 아무 이상도 발견하지 못했다고 합니다."
101030-100 = "그래서 베리타스 분들이 정기적으로 검사를 하자고 하셔서 알겠다고 했습니다."
101030-101 = "그, 그렇구나……. 그럼 아리스 쨩은 괜찮다는 거지?"
101030-102 = "그때 만났던 그 이상한 녀석…… 뭐였지, 케이……? 그 녀석은 못 찾아낸 거야?"
101030-103 = "케이가 아니라 키<Key>가 아닐까, 언니……."
101030-104 = "뭐든 상관없잖아. 복잡한 이름보단 간단한 게 좋으니까. 네이밍의 규칙이라고."
101030-105 = "네. <케이>는 발견되지 않았습니다."
101030-106 = "케이로 결정 난 거야? 뭐, 상관없으려나……."
101030-107 = "지금 엔지니어부의 기술로는 <케이>가 사라진 건지 확인할 수 없다고 해서, 베리타스 분들과 협력해본다고 했습니다!"
101030-109 = "그렇구나……."
101030-110 = "그 이상한 녀석! 아리스를 멋대로 왕녀인지 뭔지로 만들려고 했어! 만약 다음에 만나게 되면 절대 가만 안 둬!"
101030-111 = "아리스 쨩은 괜찮은 거야……?"
101030-112 = "네. 저는 문제 없습니다. 다음에 <케이>를 만나게 되면 이번엔 300% ……아니, 100,000% 빔 포를 먹여주겠습니다!"
101030-116 = "그리고 아리스도 우주 용사는 좋은 것 같습니다. 우주 전함을 타는 용사 파티! 좋은 것 같습니다."
101030-117 = "그렇지? 울림이 있잖아. 우주 전함은 로망이니까!"
101030-118 = "아리스도 언젠가 우주 전함을 탈 수 있을까요?"
101030-119 = "그건 좀 무리이지 않을까, 아리스 쨩……."
101030-120 = "응? 그래? 엔지니어부는 뭔가 그런 걸 준비하고 있던데? 아리스의 레일건도 그렇잖아."
101030-121 = "현재 키보토스의 기술력으론 우주 전함은 무리야……. 그냥 로망이니까 다들 불가능한 것에 도전해보고 싶은 거고……."
101030-122 = "그런 거였어?"
101030-123 = "그치만 불가능에 도전하는 건 좋은 것 같습니다. 그것이 로망이군요! 아리스도 이해했습니다."
101030-124 = "좋아! 그런 의미로 다음 작품은 우주 용사와 그 파티의 스페이스 오페라물로 가는 거야! 이걸로 결정!"
101030-125 = "네! 좋은 것 같습니다!"
101030-126 = "그럼 장르도 탄막슈팅계로 바꾸자. 엄청 하드한 난이도로……. 컨티뉴도 전멸 폭탄도 없는……."
101030-132 = "……하아. 역시 이렇게 될 줄 알았어."
101030-135 = "……."
101030-136 = "케이……"
101030-137 = "왕녀여…… 당신은 자신의 [ruby=왕녀]존재 목적[/ruby]을 부정하고…… 저의 [ruby=열쇠]존재 목적[/ruby]도 부정하는 건가요."
101030-138 = "존재를 잃은 열쇠는 더 이상 열쇠가 아닌 거군요. 그렇게 불릴 필요도 없듯이."
101030-142 = "……알겠습니다."
101030-143 = "그렇다면 저는 일단 당신을 지켜보도록 하겠습니다. 왕녀…… 아니, 아리스."
101030-144 = "하지만 그 누구도 존재 목적에서 벗어날 수 없습니다. 아리스, 그것이 우리들이 맞이해야 할 운명입니다."
101030-148 = "그리고 그때가 되면…… 저는……."
101030-151 = "세미나의 집무실"
101030-153 = "……흐음."
101030-154 = "귀찮은 일은 전부 저에게 다 떠넘기는군요. 리오."
101030-155 = "그렇게 위험한 <이름없는 신들>의 유산에까지 손을 뻗어놓고, 계획이 실패하자 정보를 왕창 던져놓고는 뒤를 부탁한다, 라니……."
101030-156 = "그정도 사건을 벌여놓고도 얼굴을 뻔뻔하게 드러내 줘야 그 <빅 시스터>라는 별명이 울지 않을 텐데요……."
101030-157 = "뭐, 그치만 만년설처럼 순수하고 청초한 1급 미네랄 워터 같은 저니까 당신의 그런 부탁도 양해해 드리도록 하죠."
101030-158 = "어디…… 무슨 말을 저에게 전하고 싶었던 건가요, 당신은."
101030-159 = "……."
101030-160 = "……………."
101030-161 = "이건……."
101030-162 = "……가설에 억측을 더한 해석이지만, 그렇군요……."
101030-163 = "이 정도의 정보까지 확보해 두었으니…… 당신의 그 편집증적인 망상도 이제 조금은 이해가 되네요."
101030-164 = "과연 빅 시스터……."
101030-165 = "……뭐, 그렇다고 해도 <전지>라고 불리는 천재병약미소녀인 제가 훨씬 더 대단하지만요."
101030-166 = "그건 부장이 멋대로 만들어낸 거잖아."
101030-170 = "깜짝이야……! 에이미, 어, 언제부터……."
101030-171 = "만년설 어쩌고 할 때부터?"
101030-172 = "……."
101030-173 = "초현상특무부는 원래 리오 회장의 직속 조직이었잖아? 나도 여기의 위치 정도는 알고 있어."
101030-174 = "그래서, 회장이 남긴 말이 뭐야? 부장?"
101030-175 = "일단 제일 중요한 정보들은 블랙박스에 꽁꽁 숨겨두어서 확인하는데 시간이 걸리겠지만……."
101030-176 = "……그러네요. 요악하자면, 또 다른 <초현상>을 대비하지 않으면 안 된다…… 그런 말이네요."
101030-177 = "응?"
101030-178 = "네, 이건 말하자면 빅 시스터의 경고예요."
101030-179 = "매우 매우 위험한…… 일이 벌어질 것이라는 경고……."
101030-180 = "……."
101030-182 = "그럼 이제 우리는 뭘 하면 되죠?"
101030-186 = "까, 깜짝이야……?! 어, 언제부터……?!"
101030-187 = "회장의 전속 메이드 토키……?"
101030-188 = "두 분이 오기 전부터 있었습니다. 여기는 숨어 있을 만한 곳이 많거든요."
101030-189 = "헤에. 과연 에이전트구나. 기척을 전혀 눈치채지 못했어."
101030-190 = "그런데 회장을 따라간 게 아니었구나."
101030-191 = "네. 회장은 저에게 <이제부터 자유롭게 지내도록 해>, 라는 말을 남기고 사라졌습니다."
101030-192 = "뭘 자유롭게 지내라는 건지…… 어떻게 해야 하는지 저는 도무지 알 수가 없어서……."
101030-193 = "회장이 있던 이곳에서 시간을 보내고 있었는데…… 두 분이 오신 거죠."
101030-194 = "흐음……."
101030-196 = "하지만 토키는 C&C에 몸을 의탁한 거 아니었어요? 애초에 거기 소속이기도 했고…… 설마 거기서 거부하던가요?"
101030-197 = "아뇨. 그렇지는 않습니다. 선배들은 친절하게 대해주었습니다. 하지만……."
101030-198 = "하지만?"
101030-199 = "그게……."
101030-200 = "……."
101030-201 = "……흐음. 대충 알 것 같네요."
101030-203 = "……."
101030-204 = "저는 토키가 좀 더 뻔뻔한 줄 알았는데 말이에요. 의외의 면이 있네요."
101030-205 = "하지만 뭔가 위험한 일이 벌어질 것이라면…… 저도 돕고 싶습니다. 그게 무엇이든지요."
101030-206 = "……어떡할 거야, 부장?"
101030-207 = "제가 어떻게 할지는 뻔하지 않나요? 협력자는 많을수록 좋죠."
101030-208 = "네!"
101030-209 = "후후, 좋아요. 그럼 지금부터 해야 할 일은 명확해요."
101030-210 = "에이미, 지금부터는 <샬레>의 힘이 필요해요."
101030-211 = "응. 역시 그렇겠지?"
101030-212 = "……."
101030-214 = "다음화;일상 속의 균열 2"
