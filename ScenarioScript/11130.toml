[translation]
11130-2 = "제13화;출동! 수영복 복면단 1"
11130-3 = "블랙 마켓 시가지"
11130-4 = "하아…… 지쳤어."
11130-5 = "몇시간은 걸어다닌 것 같은데……."
11130-6 = "이 정도의 강행군은 아저씨에겐 무리라고. #n허리랑 무릎이 남아나질 않잖아."
11130-7 = "어라…… 호시노 씨는 나이가……."
11130-8 = "그러니까 몇살 차이 안 난다고!"
11130-9 = "앗, 저기! 붕어빵이에요!"
11130-10 = "어라, 진짜다. 이런 곳에도 노점이 다 있네."
11130-11 = "저희 저거 먹으면서 조금 쉴까요? 제가 살게요!"
11130-12 = "뭐?! 노노미 선배, 또 현금 카드를 쓰는 거야?!"
11130-13 = "선생님의 어른의 카드도 있는데~"
11130-15 = "으응, 제가 먹고 싶으니까요-☆ 다 같이 하나씩 나눠먹어요."
11130-18 = "감사합니다~!"
11130-19 = "(냠냠)"
11130-20 = "맛있는데?"
11130-21 = "이야, 당 떨어졌는데 잘됐네."
11130-22 = "(부스럭) 아하하…… 잘 먹겠습니다."
11130-23 = "(냠)"
11130-24 = "자……"
11130-26 = "선생님도."
11130-27 = "[s] \"잘 먹겠습니다.\""
11130-29 = "아야네 쨩은 학교 돌아가서 따로 챙겨 드릴게요. 우리끼리 먹어서 미안해요……."
11130-30 = "아하하. 괜찮아요, 노노미 선배. #n저는 여기서 다른 과자 챙겨 먹고 있으니……."
11130-31 = "먹으면서 잠깐 쉬자고."
11130-33 = "이렇게까지 정보가 없을 수는 없는데…… 이상하네요."
11130-34 = "찾고 계신 그 전략병기의 정보. #n존재하지 않는 건 아닌데 찾으면 흔적이 없어요……."
11130-35 = "판매 루트…… 자재 보관 기록…… #n전부 이상하리만치 누군가 의도적으로 숨기고 있는 느낌이에요."
11130-36 = "아무리 이곳을 지배하는 <기업>들이라도 이 정도로 블랙마켓을 통제하진 못할 텐데……."
11130-37 = "그 정도로 이상한 거야?"
11130-38 = "이상한 거라기 보다는……. 굳이 이렇게까지……? #n같은 느낌이라……."
11130-39 = "여기에 모인 <기업>들은 대놓고 악행을 일삼고 있어서 딱히 숨기거나 하지 않거든요."
11130-40 = "가령 저기 빌딩 보이시죠? 저기가 바로 블랙 마켓에서 유명한 암흑 은행이에요."
11130-41 = "암흑 은행?"
11130-42 = "블랙마켓의 가장 큰 은행 중 하나예요. #n들리는 소문으로는 키보토스에서 벌어지는 범죄의 장물 중 15%가 저기로 흘러 들어가고 있다고 해요……."
11130-43 = "횡령, 강도, 납치 등등 다양한 범죄로 벌어들인 돈들이 흘러들어서 또 다른 범죄에 이용되는 불법 무기나 병기가 되고……"
11130-44 = "그런 악순환이 반복되는 거죠."
11130-45 = "……. 그럴 수가. 은행이 범죄를 조장하는 거나 마찬가지잖아요."
11130-46 = "네. 따지고 보면 저 은행도 범죄집단인 거죠……."
11130-47 = "……."
11130-48 = "너무하잖아! 총학생회는 뭘 하고 있는 거야?"
11130-49 = "뭐 여러 이유가 있겠지. 그쪽도 그쪽 나름의 사정이 있을 테니까."
11130-50 = "실제 세계는 우리 생각보다 훨씬 더 지저분하네. #n우리는 아비도스 안에서만 있어서 밖의 사정을 너무 모르고 있었던 거 같아……."
11130-53 = "모두들 잠시만요! 그쪽으로 일군의 무장 병력이 접근하고 있어요!"
11130-54 = "!!"
11130-55 = "딱히 우리를 발견한 것 같진 않지만……. #n일단은 몸을 숨기는 게 좋을 거 같아요……."
11130-56 = "우, 우와앗? 저들은 마켓 가드예요!"
11130-57 = "마켓 가드?"
11130-58 = "아까 얘기한 치안 기관 중 최상위 조직이에요!"
11130-59 = "서둘러요!"
11130-62 = "……. 그냥 단순한 순찰? 호위 중인 거 같은데……."
11130-63 = "(부르르르르릉-)"
11130-64 = "트럭을 호송하고 있어……. 현금 수송 차량이야."
11130-65 = "어라…… 저쪽은……"
11130-66 = "(부르르르릉-)"
11130-67 = "암흑 은행으로 들어가네요?"
11130-70 = "(끼이이이익-)"
11130-71 = "이달의 수금입니다."
11130-72 = "오오 일찍 도착했구만. 수고했어. 자, 여기 주행확인 서류에 싸인을."
11130-74 = "네. (슥슥)"
11130-75 = "좋아."
11130-76 = "그럼 수고하십시오."
11130-79 = "자, 문 열어. 이번 달 현금 들어간다."
11130-80 = "(부르르르르르르릉-)"
11130-82 = "어라…… 저 사람……?"
11130-83 = "어……? 뭐, 뭐야?! 저 녀석은 매달 우리한테서 이자 받아가는 그 은행 직원……?"
11130-84 = "어라, 그러네."
11130-85 = "네?! 네……?"
11130-86 = "……어떻게 된 거지?"
11130-87 = "저, 정말이네요?! 카이저 론 소속의 트럭이에요!"
11130-88 = "우리가 오전에 상환한 현금이 실려있는 바로 그 트럭같은데……!! #n저게 왜 블랙 마켓으로……!?"
11130-89 = "카, 카이저 론이요?!"
11130-90 = "알고 있어? 히후미 쨩?"
11130-91 = "카이저 론이라면…… 그 유명한 카이저 코퍼레이션의 고리대금 회사예요……."
11130-92 = "유명한……? 범죄자들?"
11130-93 = "아, 아뇨……. 카이저 그룹 자체는 범죄 회사는 아니에요……. #n하지만 적법과 범법 사이를 교묘하게 줄타기를 하면서 운용하고 있는 문어발 기업으로……."
11130-94 = "카이저는 저희 트리니티 지역 쪽에도 많이 진출해 있는데, #n학생들에게 문제가 될까 티파티에서도 계속 예의주시하고 있는 중이에요."
11130-95 = "티파티…… 그 트리니티의 학생회가 말이지."
11130-96 = "그런데 여러분의 빚이라는 게…… #n아비도스 학교는 저 카이저 론한테서 빚을……?"
11130-97 = "우리가 빌린 건 아니지만요……."
11130-98 = "말하자면 길어. #n아야네 쨩, 방금 들어간 수송 트럭의 주행 루트를 검색할 수 있어?"
11130-99 = "잠시만요."
11130-101 = "……안돼요. 무리예요. 모든 데이터를 오프라인으로 관리하고 있나 봐요. #n전혀 검색이 안돼요."
11130-102 = "역시 그렇겠지……."
11130-103 = "그러고보니 우리한테도 현금만을 요구했었잖아요. 그게 설마……."
11130-104 = "우리가 낸 현금이 블랙 마켓의 범죄 은행으로 흘러 들어가고 있었다……?"
11130-105 = "그럼 뭐야?! 우리가 블랙 마켓의 범죄 자금을 대주고 있었다는 이야기가 되는 거야?!!"
11130-106 = "……."
11130-107 = "……."
11130-108 = "……."
11130-109 = "……."
11130-110 = "아, 아직은 몰라요……. 증거가 부족하잖아요. #n저 트럭의 동선을 찾기 전까진……."
11130-111 = "……아! 방금 그 직원이 싸인한 주행확인 서류……. #n그걸 보면 증거가 되지 않을까요?"
11130-112 = "과연."
11130-113 = "오오, 그렇네. 나이스, 히후미 쨩."
11130-114 = "하하…… 그치만 생각해보니까 서류는 저 은행 안에 있으니…… 무리네요."
11130-115 = "블랙 마켓에서 가장 철통같은 보안을 자랑하는 은행 안에 있으니…… #n마켓 가드도 저렇게 잔뜩 지키고 있고……."
11130-116 = "그거 말고 저 트럭의 주행 증거를 찾는 방법이라면……. #n어디보자……. 끄응……."
11130-117 = "아니,"
11130-118 = "다른 방법은 없어."
11130-119 = "네?"
11130-120 = "호시노 선배. 여기서는 그 방법 밖엔."
11130-121 = "과연-. 그건가. 그것인가아-"
11130-122 = "……네?"
11130-123 = "아……!! 그러네요! 그 방법이라면-!"
11130-124 = "뭐야, 무슨 소리야? #n……설마 그거야? 내가 생각하는 그 방법은 아니지?"
11130-125 = "……."
11130-126 = "저, 정말이야?!! 진심?!"
11130-128 = "……저, 저기? 무슨 얘길 하고 있는지 잘 모르겠어요……. #n그 방법이라는 게 뭐죠?"
11130-129 = "방법은 하나."
11130-130 = "(스윽)"
11130-132 = "은행을 턴다."
11130-133 = "네?!"
11130-134 = "그렇지. 여기서는 그런 전개지."
11130-135 = "네?!?!"
11130-136 = "와아-☆ 악당 은행을 혼내주는 거예요!"
11130-137 = "네?!?! 저, 저기요?!"
11130-138 = "하아. 진짜야? 진심인 거지……?"
11130-139 = "그렇다면……"
11130-140 = "해주는 수 밖에 없잖아!!"
11130-141 = "아, 우아……? 우아아……?"
11130-143 = "……."
11130-144 = "……하아, 알겠습니다. 여기까지와서 말린다고 들을 사람들도 아니고…… #n어떻게든 되겠지……."
11130-146 = "미안해, 히후미. 네 복면은 준비해두지 못했어."
11130-147 = "이야~ 이렇게 되면 들키면 전부 트리니티 짓이라고 둘러댈 수 밖에 없잖아."
11130-148 = "네?!! 아, 아니…… 복면이…… 왜…… 그러니까……. #n아, 아우……."
11130-149 = "그건 불쌍하잖아요."
11130-150 = "히후미 쨩은 급한대로 이거라도☆"
11130-151 = "붕어빵 봉투? 오오! 이거라면 괜찮겠네."
11130-152 = "네? 자, 잠깐만요, 여러분……?"
11130-153 = "아, 아우우……."
11130-155 = "(부스럭)"
11130-156 = "아우웃……."
11130-157 = "……."
11130-158 = "음. 완벽해."
11130-159 = "번호도 써 드렸어요. 히후미 쨩은 5번이에요~☆"
11130-160 = "비주얼은 보스급인데? 원흉인데? 리더인데?"
11130-161 = "저, 저도 가는 건가요? 암흑 은행을 털러……? 가, 가는 건가요?"
11130-162 = "으헤~ 아까 약속했잖아. 히후미 쨩은 오늘은 우리와 함께 하는 걸로."
11130-163 = "아, 으아아…… #n저, 저는 이제 학생회 분들을 어떻게 봐야 할지……."
11130-164 = "상관없잖아! 나쁜 건 저쪽이라고! 범죄 은행을 터는 거니까!"
11130-165 = "자, 선생님. 그 대사를 부탁해."
11130-166 = "[s] \"은행을 털자!\""
11130-168 = "예에! 출발~☆"
11130-169 = "아우우……."
11130-170 = "수영복 복면단…… 하아……."
11130-172 = "(스윽)"
11130-173 = "출격입니다."
11130-175 = "다음화;출동! 수영복 복면단 2"
