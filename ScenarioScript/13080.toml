[translation]
13080-1 = "제8화;아비도스 학생회 1"
13080-5 = "[ns1] 밤새 수집한 자료를 정리한다.\n[ns2] \"……필요한 건 대충 알겠어. 그럼 이제…….\""
13080-11 = "대기중. [USERNAME] 선생님. 필요한 게 있으신가요?"
13080-12 = "[s] \"아아, 고마워, 프라나. 아로나는?\""
13080-13 = "아로나 선배는 지금 자고 있습니다. 잠꾸러기입니다. 그러니 시키실 게 있다면 부지런한 저에게 명령해 주시면 됩니다."
13080-14 = "[s3] \"고마워. 그럼…….\"\n[s4] 프라나에게 업무를 맡긴다."
13080-19 = "확인. 간단한 일이니 금방 처리할 수 있습니다."
13080-20 = "그것보다 선생님은 조금이라도 주무셔야 할 것 같습니다. 철야 작업은 건강에 좋지 않습니다."
13080-21 = "[s] \"응. 그치만 지금 당장 아비도스로 출발해야 해. 시간이 없어.\""
13080-22 = "알겠습니다. 그럼……."
13080-28 = "이상 현상 감지."
13080-33 = "[ns] \"프라나……? 왜 그래?\""
13080-46 = "…………………."
13080-47 = "……뭐지?"
13080-48 = "내 계산이 틀렸다고……? 어째서……?"
13080-51 = "[ns] \"무, 무슨 일이 벌어진 거지?!\""
13080-53 = "[ns] \"폭발……?! 그런데 나는 멀쩡해……?!\""
13080-56 = "크, 큰일 날 뻔했어요! 선생님!"
13080-57 = "[s] \"아로나? 어떻게 된 거야……?!\""
13080-60 = "지금 샬레 건물이 폭발했어요!"
13080-61 = "하지만 그것보다…… 프라나 쨩이……!!"
13080-67 = "선생님이 무사하도록…… 지금 긴급 보호를……"
13080-68 = "하지만 더 이상은…… 무리……."
13080-73 = "프, 프라나 쨩?!"
13080-75 = "……. 두 번 다시 선생님이 다치는 모습을 저는……."
13080-76 = "[s] \"프라나?! 괜찮아?!\""
13080-77 = "괘, 괜찮아요, 선생님! 프라나 쨩은 기절한 거뿐이에요! 하지만 그보다……."
13080-88 = "[ns] \"…………!!!\""
13080-96 = "[ns] (의식이…….)"
13080-103 = "……. 과연."
13080-104 = "저 상자의 보호 시스템은 제 계산보다 훨씬 더 강력하군요."
13080-105 = "예리코의 성벽을 무너트린 병기, 불가해한 기적을 일으키는 [ruby=ARK]성궤[/ruby]……. 그것을 너무 과소평가했던 것일지도……."
13080-106 = "……흐음. 뭐, 상관없습니다. 이제 공략법을 수정해야 한다는 걸 깨달았지만, 그래도 무의미하진 않았어요."
13080-110 = "공략법 두 번째. <육체의 한계는 극복할 수 없다.>…… 이것은 아직 유효합니다."
13080-111 = "가장 중요한 이야기는 선생의 육체가 없는 곳에서 진행되고 있어요. 선생이 깨어난다고 해도 이미 늦은 뒤일 거예요."
13080-113 = "자아, 그럼 플레이를 계속하겠습니다."
13080-121 = "……선생님이 연락을 안 받으세요."
13080-125 = "으음……."
13080-126 = "무슨 일 있으신 걸까요?"
13080-127 = "자고 있는 거 아냐?"
13080-129 = "연락이 안 되는 때는 종종 있긴 했지만…… 그래도 일찍 오시기로 했는데……."
13080-130 = "호시노 선배는?"
13080-134 = "선배도 연락이 안 되는데……."
13080-136 = "정말이지, 다들 뭐 하는 거야?"
13080-137 = "……."
13080-141 = "……벌써 아침이네."
13080-142 = "……슬슬 돌아가야겠지. 시로코 쨩이랑 선생님…… 모두가 기다릴 테니."
13080-143 = "흐음…… 시로코 쨩 점점 더 강해져서 슬슬 상대하기 버겁단 말이지……. 조금만 더 지나면 이 아저씨보다 강해지려나~?"
13080-144 = "시로코 쨩…… 처음엔 엄청 작고 귀여웠는데 이제 이 아저씨를 위협할 정도로 커버리다니. 으아~ 세월이란~"
13080-149 = "여기는 변하지도 않았네……."
13080-150 = "하긴 버려진 동네니까 어쩔 수 없으려나."
13080-154 = "부탁드립니다! 여기에 서명 부탁드려요!"
13080-168 = "아비도스의 환경 개선을 위한 주민 서명입니다!"
13080-169 = "기업들에게 권고하기 위해서 여러분들의 도움이 필요해요."
13080-171 = "……. 아니…… 관심 없어……."
13080-175 = "쓸데없는 짓을……."
13080-179 = "저, 저기. 죄송합니다…… 괜찮으시면 여기 서명을 ……."
13080-180 = "의미 없잖아. 이제 네프티스도 자치구를 떠난다는데 환경 개선이 무슨 소용이야!"
13080-192 = "아……! 저기, 저기! 잠깐! 일단정지! 스톱!"
13080-198 = "에헤헤…… 응. 거기 말야. 얼굴 알고 있어. 최근에 입학한 그 신입생이지? 이름이 그러니까 호시노……."
13080-204 = "……호시노 쨩 맞지……? 어, 어라?!"
13080-205 = "자, 잠깐만 호시노 쨩?"
13080-214 = "하아……."
13080-219 = "자치구 안전을 위한 순찰 강화 방안의 설명회를 개최합니다! 부디 참석해 주셔서 시민들의 의견을 전해주세요!"
13080-220 = "여기, 설명회의 전단지를 받아주시고 부디……."
13080-227 = "……앗! 호시노 쨩!!"
13080-233 = "기, 기다려! 도망가지 말고!! 잠깐만! 할 말이 있어!"
13080-237 = "후, 후엥……?!"
13080-245 = "……칫."
13080-251 = "아, 고, 고마워."
13080-252 = "어…… 그러니까 여, 영광입니다? 유명인의 손을 잡아본 건 처음이야……."
13080-253 = "저를 아세요?"
13080-254 = "응, 당연하지! 엄청 강하고 성격 나쁜 신입생이잖아! 소문이 파다한걸?"
13080-255 = "뭐, 그래봤자 나 혼자만의 소문이지만……."
13080-256 = "저기, 저번에 그 불량 써클들을 내쫓은 거, 호시노 쨩이 한 거지? 이상한 폭력집단들끼리 싸우는 걸 말린 것도!"
13080-257 = "응. 아비도스를 위해서 해준 일이잖아. 학생회장으로서 인사해 두지 않으면 안 된다고 생각해. 고맙습니다. 호시노 쨩."
13080-261 = "……집으로 돌아가십시오. 유메 학생회장님. 여기 어두워지면 위험한 녀석들이 돌아다녀요."
13080-262 = "아, 그, 그래? 그치만 아직 해야 할 일이 많은데……."
13080-269 = "앗, 어, 어라……?"
13080-270 = "……. 그런데 내 이름 알고 있었어……?"
13080-282 = "……하아. 벌써 시간이……."
13080-283 = "아직 서명도 다 못 채웠고 나눠줘야 하는 전단지도 이렇게 잔뜩인데……."
13080-284 = "우웅…… 그래도 이번 주까진 서명을 다 채워야 다음 주부턴 다른 거리로 갈 수 있는데……."
13080-288 = "어, 어두워지니까 조, 조금 을씨년스럽네……. 호시노 쨩 말대로 슬슬 돌아가야……."
13080-298 = "이 녀석은 뭐야?"
13080-300 = "아, 앗……?"
13080-305 = "아비도스 학생회의 순찰 강화 방안 설명회? 뭐야, 너 아비도스 학생이냐?"
13080-306 = "마침 잘됐네, 네놈들이 우리를 고용해 놓고 용역비를 늦게 줘서 곤란해졌잖아!"
13080-311 = "네? 저, 저는……. 그러니까……."
13080-314 = "대금이 지연된 만큼 이자를 내야 할 거 아냐! 어떻게 책임질 거냐고! 앙?"
13080-320 = "서, 서명 종이가……."
13080-322 = "이건 또 뭐야! 앙?"
13080-326 = "그, 그만둬주세요! 이건 내일 사람들에게 나눠줘야 하는……."
13080-329 = "알 게 뭐야!!"
13080-330 = "기분도 더러운데 잘 걸렸다! 분풀이라도 해야겠어!"
13080-362 = "아, 아앗……? 호, 호시노 쨩……?"
13080-364 = "그러니까 내가 말했잖아요! 밤이 되면 위험하다고!"
13080-365 = "왜 말을 안 듣습니까! 바보예요?!"
13080-370 = "미, 미안해……."
13080-371 = "이 주변엔 이런 놈들이 수두룩하다고요! 심야의 아비도스는 무법지대라는 걸 모르는 거예요?!"
13080-372 = "……."
13080-381 = "네, 네 녀석…… 뭐, 뭐야?!"
13080-382 = "얼굴 기억했어! 두고 봐!"
13080-387 = "하아……."
13080-388 = "……다친 데는 없으세요? 유메 학생회장님."
13080-389 = "으, 으응……. 고마워 호시노 쨩……."
13080-390 = "왜 맞서 싸우지 않은 겁니까? 이 정도 녀석들을 상대하는 건 어려운 일은 아닐 텐데."
13080-391 = "그, 그치만……. 싸움으로 문제를 해결하면…… 으응……. 뭔가 진짜 해결이 되진 않고 뱅글뱅글 제자리걸음이 된달까……."
13080-392 = "그런데 익숙해져 버리면 그런 틀린 방식으로만 문제를 해결할 수 있게 된달까……."
13080-393 = "……무슨 소린지 전혀 모르겠습니다."
13080-394 = "그럼 뭘로 어떻게 해결해야 하죠?"
13080-395 = "그, 그러게……."
13080-399 = "이제 돌아가세요. 도망친 놈들이 동료를 데려올지도 모르니까요."
13080-404 = "아, 앗? 호시노 쨩?!"
13080-415 = "아비도스의 환경 개선을 위한 주민 서명입니다!"
13080-416 = "기업들에게 권고하기 위해서 여러분들의 도움이 필요해요."
13080-417 = "……."
13080-421 = "어…… 환경 개선을 위한…… 서명을……."
13080-422 = "호시노 쨩……? 왜 여기 있는 거야?"
13080-423 = "당연하지 않습니까. 어제 그 녀석들이 앙갚음하러 올 수도 있잖아요."
13080-424 = "나, 나를 지켜주려고?!"
13080-425 = "아뇨. 미끼를 노리고 몰려드는 녀석들을 노리는 게 더 편하거든요."
13080-426 = "미끼였어?!"
13080-427 = "그런 겁니다. 아비도스 학생회는 적이 많으니까요. 게다가 당신은 학생회장님이니까요. 미끼 같은 거죠. 엄청 큰 미끼."
13080-431 = "후, 후, 후. 과-연-?"
13080-435 = "호시노 쨩은 솔직하지 못하구나? 사실은 내가 걱정돼서 그런 거잖아? 응? 그 귀여운 얼굴에 다 쓰여 있다구? 유메 선배가 걱정돼요! 하고."
13080-436 = "누, 누가 걱정했다고요! 게다가 뭐가 귀엽다는 겁니까?!"
13080-437 = "우웅…… 그치만 호시노 쨩, 엄청 무서운 얼굴을 하고 잔뜩 찡그리고 있지만…… 사실 그거 일부러 그러는 거잖아?"
13080-441 = "그 얼굴 속에 숨겨진 진짜 호시노 쨩의 본모습은…… 으음……. 뭐랄까…… 좀 더 앙증맞은……."
13080-442 = "무, 무슨 소릴 하는 거예요! 쓸데없는 소릴 할 거면 갈 겁니다?!"
13080-443 = "헤헤…… 고마워. 호시노 쨩."
13080-444 = "이렇게 강한 후배가 날 걱정해 준다니 엄청 듬직하달까……. 믿음직스럽달까……."
13080-445 = "잡담은 그만하고 일에 집중하세요. 회장님."
13080-446 = "학생회의 일을 도와주는 건 이번 한 번뿐이니까요."
13080-447 = "그치만 학생회장 말고 선배가 더 괜찮은데……. 유메 선배라고 불러주면 더 기쁠지도……."
13080-451 = "……듣고 있습니까."
13080-455 = "다음화;아비도스 학생회 2"
