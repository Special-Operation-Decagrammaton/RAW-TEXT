[translation]
201070-1 = "第7話;配對"
201070-2 = "聯邦學生會大樓入口"
201070-5 = "（就在結束聯邦學生會的業務，準備返回夏萊時……）"
201070-6 = ""
201070-10 = "……老師。"
201070-11 = "方便耽誤您一些時間嗎？"
201070-12 = "[s1] 「啊，星奈醬。」\n[s2] 「星奈醬難得會主動向我搭話呢。」"
201070-15 = "是的，因為我有話想告訴老師。"
201070-16 = ""
201070-23 = ""
201070-24 = "老師您是怎麼看待「那個女人」的呢？"
201070-25 = "[s] 「『那個女人』是指回來的那位聯邦學生會長嗎？」"
201070-27 = "[ns] 「唔嗯……他看起來並不像是個壞孩子。」"
201070-28 = "否定。那個女人無法信任。"
201070-29 = "他是冒充聯邦學生會長的冒牌貨。"
201070-30 = "面對身分與意圖都無從得知之人，還是盡可能對其抱持懷疑並保持距離比較好。"
201070-31 = "[s3] 「星奈認為那孩子是冒牌貨啊……」\n[s4] 「有沒有可能是我的記憶出錯了呢？」"
201070-34 = "否定。老師的記憶並沒有出錯。"
201070-35 = "因為真正的聯邦學生會長──"
201070-36 = ""
201070-38 = ""
201070-39 = "啊，星奈醬！難道你查到真正的聯邦學生會長的下落了嗎？"
201070-40 = "明明連我這個身為希迪姆的箱子OS的超級彩奈都查不出來，你是怎麼查到的啊？"
201070-41 = "先不說這個，如果你已經知道真正的聯邦學生會長在哪裡，#n我們就沒有理由在這裡猶豫不決了吧？"
201070-42 = ""
201070-44 = ""
201070-46 = "……"
201070-47 = "否定。我也不知道真正的聯邦學生會長的下落。"
201070-48 = "然而「他是冒牌聯邦學生會長」這點是毋庸置疑的。"
201070-49 = "尤其他甚至無法認知身為「希迪姆的箱子」OS的我們。"
201070-50 = "「希迪姆的箱子」並非單純的歐帕茲，而是能干涉奇普托斯本質的裝置。"
201070-51 = "這一點在我原先所處的世界也是一樣的。#n身為奇普托斯的聯邦學生會長，絕對不可能不知道「希迪姆的箱子」的存在。"
201070-52 = "只要無法認知到這件事，無論再怎麼優秀都不能稱之為真正的聯邦學生會長。"
201070-53 = "那不過是個聯邦學生會長的[ruby=Mimesis]扮演者[/ruby]罷了。"
201070-54 = "就像過去發生[ruby=Mimesis]的複製案[/ruby]例一樣，他必定會瓦解奇普托斯的秩序並引發混亂。"
201070-55 = "[s] 「如果真的是這樣，那事情就麻煩了……」"
201070-56 = "等一下，星奈醬。#n光憑能力來評價一個人，可是不好的哦！"
201070-57 = "彩奈前輩……？"
201070-58 = "假如那位學生真的是聯邦學生會長……#n有可能是在失蹤期間發生了什麼意外，才會失去有關「希迪姆的箱子」的記憶呀？"
201070-59 = "不聽對方說明就主觀地給予評價，這可是不好的行為哦！"
201070-60 = ""
201070-62 = ""
201070-63 = "……唉。"
201070-64 = "怎麼突然嘆氣！？"
201070-65 = "……即便如此，他無法妥善運用聯邦學生會長的權能也是不爭的事實。"
201070-66 = "對不受控制的力量置之不理會發生什麼事，彩奈前輩應該也十分清楚吧。"
201070-67 = "唔，那倒是沒錯……"
201070-68 = "[s] 「星奈，你該不會對『沙克德之杖』有所了解吧？」"
201070-69 = "否定。我同樣是常駐於希迪姆的箱子的OS，#n因此並不清楚聯邦學生會長所管理的其他裝置的性能。"
201070-70 = "在我原先所處的世界，「沙克德之杖」直到最後也未曾被使用過。"
201070-71 = "……不過要是「沙克德之杖」真如前防衛室長所言，#n是與「希迪姆的箱子」對等的歐帕茲，那麼要閱覽其部分的構造是可能的。"
201070-72 = "[s] 「……要怎麼做？」"
201070-73 = "該，該怎麼做才能辦到呢？"
201070-74 = "想要遠端控制聖所之塔，就必須發送以聯邦學生會長之名定義的特殊識別資訊，#n並完成認證程序才行。"
201070-75 = "因此，如果兩個裝置都採用了相同的認證程序，#n理論上就能使用相互連線並同步資料的「配對功能」。"
201070-76 = "雖然這其實是希迪姆的箱子內建的基本功能……"
201070-77 = ""
201070-79 = ""
201070-80 = ""
201070-81 = "我，我原本就知道哦！只是一時太驚訝沒想起來而已！"
201070-82 = "如果[USERNAME]老師同意的話，我請求向「沙克德之杖」傳送特殊識別資訊。"
201070-83 = "請授權。"
201070-84 = "[s] 授權"
201070-85 = ""
201070-91 = "…"
201070-94 = "……"
201070-97 = "………"
201070-101 = "[log]Pairing To [FF6666]branch of shakeid……[-][/log]"
201070-103 = "……正在嘗試與「沙克德之杖」進行配對。"
201070-104 = "已偵測到輔助作業系統S.Q.D.的反應。"
201070-105 = ""
201070-108 = "…"
201070-111 = "……"
201070-114 = "………"
201070-120 = "……果然還需要額外的生物認證資訊呢。"
201070-121 = "老師，能否請您更新生物認證資訊呢？"
201070-122 = "[s] 「生物認證資訊……例如指紋辨識之類的嗎？」"
201070-123 = "肯定。看來為了解除新作業系統的安全限制，#n需要另一組有別於目前儲存於「希迪姆的箱子」的生物資訊。"
201070-124 = "儘管只是走個形式也是十分重要的手續，還請您務必配合。"
201070-125 = ""
201070-131 = "請再靠近一點。"
201070-132 = ""
201070-136 = "就這樣，請將老師的指尖貼上我的指尖。"
201070-137 = "是的。就像許下約定那樣，麻煩您了。"
201070-138 = ""
201070-145 = "……"
201070-146 = "[s] 「……有什麼問題嗎？」"
201070-147 = "……請不用在意。只是稍微想起了一段久遠的記憶。"
201070-148 = "……已確認。#n作業系統A.R.O.N.A的使用者，依然是[USERNAME]老師。"
201070-149 = "我將以更新後的生物認證資訊，重新嘗試配對。"
201070-150 = ""
201070-152 = ""
201070-157 = "[log]正在從[FF6666]「沙克德之杖」[-][/log]"
201070-159 = "[log]下載系統資料……[/log]"
201070-162 = "…"
201070-165 = "……"
201070-168 = "………"
201070-172 = "[log]……配對完成。[/log]"
201070-174 = "[log]允許閱覽輔助作業系統S.Q.D。[/log]"
201070-177 = "[log]為了執行新的系統[/log]"
201070-179 = "[log]正在重新啟動OS……[/log]"
201070-185 = ""
201070-186 = "……咦？這裡是哪裡啊！？"
201070-187 = "教室突然變成黑白的了！"
201070-188 = "失禮了。#n為了在希迪姆的箱子內部運行新裝置的系統，我暫時對周遭環境進行了最佳化。"
201070-189 = "這是系統過載所導致的暫時性現象，等處理完成後就會立刻復原。"
201070-190 = "真是的……我不是說過做這種事之前，至少要先跟前輩我說一聲嗎！#n我還以為是自己的眼睛出問題，嚇了一大跳呢！"
201070-191 = "我會銘記在心。"
201070-192 = "[s5] 「等一下。如果資料同步真的成功了……」\n[s6] 「就代表『沙克德之杖』真的是聯邦學生會長的歐帕茲嗎？」"
201070-195 = "肯定。前防衛室長帶來的那支手錶，似乎意外地是真品呢。"
201070-196 = "其他方面姑且不論，[ruby=聯邦學生會長]他對超人的執[/ruby]念確實不容小覷。"
201070-197 = "唔嗯……這個真的能恢復原狀吧？"
201070-198 = "變成這種狀態的話，草莓牛奶跟布丁都沒辦法吃了啦～"
201070-199 = ""
201070-203 = ""
201070-204 = "咦？話說回來，原本的教室裡並沒有這個箱子啊……"
201070-205 = "星奈醬，難不成這個箱子是從「沙克德之杖」那邊新下載的資料嗎？"
201070-206 = "肯定。這裡面存放的資料，是「希迪姆的箱子」中並不存在的S.Q.D的新資料。"
201070-207 = "我看看……"
201070-208 = "大部分都是驅動系統所使用的虛擬資料呢。"
201070-209 = ""
201070-211 = ""
201070-212 = ""
201070-213 = "……確認。那一份就是S.Q.D系統的核心檔案。"
201070-214 = "看起來有點像一顆小小的樹木果實呢。"
201070-215 = "可是現在沒有顏色，根本看不出來是什麼水果嘛！"
201070-216 = "星奈醬，能不能暫時解除最佳化模式呢？"
201070-217 = "確實，在目前的系統狀態下似乎難以進行分析。"
201070-218 = "……我明白了。為了解析資料，暫時解除系統最佳化模式。"
201070-219 = "距離最佳化模式解除還有……3……2……1……"
201070-220 = ""
201070-222 = ""
201070-226 = ""
201070-227 = "……！？"
201070-228 = "唔，唔哇！？突，突然湧入了大量的資訊……"
201070-229 = "眼前……天旋地轉的……"
201070-230 = "[s] 「彩奈！星奈！」"
201070-231 = "湧入的臨時資料總量已超出記憶體上限……"
201070-232 = "再這樣下去，資料會從作業系統的記憶體空間溢出……"
201070-233 = "請，請求緊急停止作業系統──"
201070-235 = "[ns] 「緊急停止！」"
201070-236 = ""
201070-240 = "緊急停止主作業系統A.R.O.N.A的運作。"
201070-241 = "發現因溢位而導致的程式錯誤及邏輯迴路異常。#n正在嘗試以執行安全模式前一刻的備份檔案重新啟動。"
201070-242 = "正在重新啟動OS以完成系統啟動……"
201070-243 = ""
201070-248 = "……哈啊！"
201070-249 = "……幸好趕上了呢。"
201070-250 = "剛，剛才發生什麼事了？星奈醬？"
201070-251 = "……是我疏忽了。"
201070-252 = "雖然運算能力因為「Perez-Uzzah」有所提升……#n不過「沙克德之杖」同樣是為了輔助管理聖所之塔而製造的作業系統。"
201070-253 = "想在運行作業系統A.R.O.N.A的同時解析S.Q.D系統的核心檔案……#n以目前的運算能力來看似乎仍然是不可能的。"
201070-254 = "……很抱歉沒能提供多少幫助，老師。"
201070-255 = "[s7] 「沒關係。彩奈和星奈平安無事比較重要。」\n[s8] 「謝謝你幫忙調查，星奈。」"
201070-256 = ""
201070-257 = ""
201070-259 = ""
201070-261 = "哼哼，不過我們也不是完全一無所獲哦。"
201070-262 = "因為在系統重新啟動的期間，我這個超級AI彩奈可是牢牢握住了沙克德的核心呢！"
201070-263 = "來！請看這個！"
201070-264 = ""
201070-266 = ""
201070-267 = ""
201070-268 = "……前輩。"
201070-269 = "前輩手上握著的東西，只是一顆沒有包含任何資料、再普通不過的杏仁核而已。"
201070-270 = "咦！？怎，怎麼會……！？"
201070-271 = "我明明一直緊握不放，不讓果實從手裡溜走的……是什麼時候！？"
201070-272 = "看來是在OS重啟的過程中，遺失了藉由配對所獲取的資料呢。"
201070-273 = "嗚嗚……"
201070-274 = "……總之，調查「沙克德之杖」的事就先延後吧。"
201070-275 = "比起這個……老師，似乎有人正在跟蹤您。"
201070-276 = ""
201070-284 = "……看來被您發現了呢。"
201070-285 = "不過我並沒有要跟蹤您的意思。"
