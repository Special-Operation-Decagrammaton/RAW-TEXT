[translation]
201070-1 = "ตอนที่ 7;แพริ่ง"
201070-2 = "ทางเข้าอาคารองค์การนักเรียน"
201070-5 = "(คุณครูกำลังจะกลับไปที่ชาเล่ต์ หลังเสร็จสิ้นงานที่องค์การนักเรียน...)"
201070-6 = ""
201070-10 = "คุณครู..."
201070-11 = "พอจะมีเวลาสักครู่รึเปล่าคะ"
201070-12 = "[s1] \"อ๊ะ พลาน่าจัง\"\n[s2] \"พลาน่าจังไม่ได้เป็นฝ่ายชวนคุยก่อนมานานแล้วนะ\""
201070-15 = "ค่ะ ฉันมีเรื่องที่อยากคุยกับคุณครูค่ะ"
201070-16 = ""
201070-23 = ""
201070-24 = "คุณครู... คิดยังไงกับ 'ผู้หญิงคนนั้น' เหรอคะ?"
201070-25 = "[s] \"หมายถึงประธานองค์การนักเรียนที่เพิ่งกลับมาเหรอ?\""
201070-27 = "[ns] \"อืม... ดูไม่น่าใช่เด็กที่เลวร้ายอะไรนะ\""
201070-28 = "ปฏิเสธ ผู้หญิงคนนั้นไม่น่าไว้ใจเลยค่ะ"
201070-29 = "ผู้หญิงคนนั้นเป็นประธานองค์การนักเรียนตัวปลอม"
201070-30 = "เนื่องจากไม่ทราบตัวตนที่แท้จริงและเจตนาของเธอ แนะนำว่าควรระมัดระวังและรักษาระยะห่างไว้ค่ะ"
201070-31 = "[s3] \"พลาน่าคิดว่าเด็กคนนั้นเป็นตัวปลอมสินะ...\"\n[s4] \"เป็นไปได้รึเปล่าว่าความจำของครูจะผิดไปน่ะ?\""
201070-34 = "ปฏิเสธ ความจำของคุณครูไม่ได้ผิดพลาดค่ะ"
201070-35 = "นั่นก็เพราะว่าประธานองค์การนักเรียนตัวจริง..."
201070-36 = ""
201070-38 = ""
201070-39 = "อ๊ะ พลาน่าจัง! รู้แล้วเหรอคะว่าประธานองค์การนักเรียนตัวจริงอยู่ที่ไหน?"
201070-40 = "ขนาดซูเปอร์อะโรน่าที่เป็นระบบปฏิบัติการหลักของกล่องแห่งซิสดิมยังหาไม่เจอเลย! พลาน่าจังหาเจอได้ยังไงกันคะ?"
201070-41 = "อีกอย่าง ถ้ารู้ว่าประธานองค์การนักเรียนตัวจริงอยู่ที่ไหน ก็อย่ามัวชักช้ากันเลยค่ะ"
201070-42 = ""
201070-44 = ""
201070-46 = "......"
201070-47 = "ปฏิเสธ ฉันเองก็ไม่ทราบที่อยู่ของประธานองค์การนักเรียนตัวจริงค่ะ"
201070-48 = "แต่ถึงอย่างนั้น เธอคนนั้นก็เป็นตัวปลอม ไม่ผิดแน่นอนค่ะ"
201070-49 = "เพราะเธอไม่สามารถรับรู้ถึงพวกเราที่เป็นระบบปฏิบัติการหลักของ <กล่องแห่งซิสดิม> ได้ค่ะ"
201070-50 = "<กล่องแห่งซิสดิม> ไม่ใช่แค่วัตถุหลงยุคทั่วไป แต่เป็นเครื่องมือที่แทรกแซงแก่นแท้ของคิโวทอสได้"
201070-51 = "ในโลกที่ฉันจากมาก็เช่นเดียวกัน หากเป็นประธานองค์การนักเรียนของคิโวทอสละก็ ย่อมไม่มีทางที่จะไม่รู้จัก <กล่องแห่งซิสดิม> ค่ะ"
201070-52 = "แต่ถ้าหากไม่สามารถรับรู้ถึงสิ่งนี้ได้ ต่อให้เก่งกาจแค่ไหน ก็คงไม่อาจเรียกได้ว่าเป็นประธานองค์การนักเรียนที่แท้จริงหรอกค่ะ"
201070-53 = "เธอเป็นเพียง[ruby=มิเมซิส]ผู้ที่สวมบทบาท[/ruby]เป็นประธานองค์การนักเรียนเท่านั้นค่ะ"
201070-54 = "เช่นเดียวกับมิเมซิสที่เคยปรากฏตัวขึ้นมาก่อนหน้านี้ เธอจะทำลายระบบของคิโวทอส และก่อให้เกิดความโกลาหลขึ้นค่ะ"
201070-55 = "[s] \"ถ้าเป็นเรื่องจริงก็เรื่องใหญ่เลยนะ...\""
201070-56 = "เดี๋ยวก่อนค่ะ พลาน่าจัง ตัดสินคนจากความสามารถอย่างเดียวแบบนั้นมันไม่ดีเลยนะคะ!"
201070-57 = "รุ่นพี่อะโรน่า...?"
201070-58 = "ถ้านักเรียนคนนั้นเป็นประธานองค์การนักเรียนตัวจริงละก็ ระหว่างที่หายไปอาจเกิดอุบัติเหตุไม่คาดฝัน จนทำให้ความทรงจำเกี่ยวกับ <กล่องแห่งซิสดิม> หายไปก็ได้นี่คะ?"
201070-59 = "การตัดสินอีกฝ่ายจากข้อสันนิษฐานโดยไม่ฟังเรื่องราวให้ดีก่อน เป็นทัศนคติที่ไม่ดีค่ะ!"
201070-60 = ""
201070-62 = ""
201070-63 = "เฮ้อ..."
201070-64 = "จู่ๆ ก็ถอนหายใจเหรอ?!"
201070-65 = "ถึงอย่างนั้น ความจริงที่ว่าเธอไม่สามารถใช้พลังของประธานองค์การนักเรียนได้อย่างถูกต้อง มันก็ไม่เปลี่ยนแปลงไปอยู่ดีค่ะ"
201070-66 = "รุ่นพี่อะโรน่าก็น่าจะรู้ดีนะคะว่าจะเกิดอะไรขึ้นบ้าง เมื่อพลังที่ไม่อาจควบคุมถูกปล่อยทิ้งไว้"
201070-67 = "อึก เรื่องนั้นมันก็..."
201070-68 = "[s] \"พลาน่ารู้เรื่อง <คทาแห่งชาเคด> บ้างรึเปล่า?\""
201070-69 = "ปฏิเสธ ฉันเองก็เป็นระบบปฏิบัติการของกล่องแห่งซิสดิม เลยไม่เคยได้รับข้อมูลเกี่ยวกับอุปกรณ์อื่น#nที่ประธานองค์การนักเรียนดูแลอยู่ค่ะ"
201070-70 = "และในโลกที่ฉันจากมา <คทาแห่งชาเคด> ก็ไม่ได้ถูกนำมาใช้จนถึงท้ายที่สุดเหมือนกันค่ะ"
201070-71 = "แต่ถ้า <คทาแห่งชาเคด> ที่เป็นวัตถุหลงยุคอีกชิ้นหนึ่งที่มีพลังเทียบเท่ากับ <กล่องแห่งซิสดิม> อย่างที่อดีตหัวหน้าสำนักป้องกันกล่าวไว้ละก็ การเข้าถึงโครงสร้างบางส่วนของมันก็อาจเป็นไปได้ค่ะ"
201070-72 = "[s] \"ยังไงเหรอ...?\""
201070-73 = "ระ... เรื่องนั้นทำได้ยังไงเหรอคะ?"
201070-74 = "การควบคุมแซงทัมทาวเวอร์จากระยะไกล จำเป็นต้องผ่านขั้นตอนการส่ง และยืนยันข้อมูลระบุตัวตนพิเศษที่ถูกกำหนดไว้ในนามของประธานองค์การนักเรียนค่ะ"
201070-75 = "ดังนั้น หากอุปกรณ์ทั้งสองใช้ขั้นตอนการยืนยันตัวตนเดียวกัน ในทางทฤษฎีแล้วจะสามารถใช้ 'ฟังก์ชันแพริ่ง' เพื่อเรียกใช้งานกันและกันในการซิงก์ข้อมูลได้ค่ะ"
201070-76 = "นี่เป็นฟังก์ชันพื้นฐานที่ติดตั้งอยู่ในกล่องแห่งซิสดิมนะคะ..."
