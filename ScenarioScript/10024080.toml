[translation]
10024080-1 = "8화;파사현정: 그릇된 것을 깨트리고 바른 것을 드러내다."
10024080-6 = "끄악?!"
10024080-7 = "으악!?"
10024080-15 = "제압, 완료했습니다."
10024080-16 = "헉, 헉…… 정말 형편없는 사격 솜씨군. 자기 몸이나 제대로 지킬 수 있겠나?"
10024080-17 = "당신이 사격에 능하다는 건 알겠습니다만, 체력이 너무 약한 것 아닙니까?"
10024080-18 = "무술 영화밖에 모르는 근육뇌한테 그런 소리 듣기 싫은데 말이지!"
10024080-19 = "당신이야말로, 마피아 영화 말고는 아는 게 없잖습니까!"
10024080-20 = "[s] (둘 다 그게 그거 아니냐고 묻고 싶지만…… 참기로 하자.)"
10024080-21 = "좋아, 이걸로 한 건 해결, 인가."
10024080-22 = "연단방이 이 녀석들에게 묻고 싶은 게 있는 것 같은데, 어떻게 할 거야?"
10024080-28 = "크흠. 그렇다면 묻겠다."
10024080-29 = "너희들이 만년삼을 거래하고 있는 대상에 관해 묻고 싶은 것이다."
10024080-31 = "?!"
10024080-32 = "!?"
10024080-33 = "마, 말할 수 없다! 그런 건 모른다!"
10024080-35 = "……"
10024080-36 = "세상에는 꼭 말하지 않아도 알 수 있는 게 있는 것이다……"
10024080-37 = "<오욕의 미후>, 신타니 카이인 것이겠지?"
10024080-39 = "……!"
10024080-40 = "어, 어떻게……?"
10024080-42 = "뭐어. 반응을 보니, 그것으로 이미 대답이 된 것 같은 것이다."
10024080-44 = "도대체 누구야? 그 <오욕의 미후>란 게."
10024080-45 = "저희는…… 금시초문입니다만……"
10024080-46 = "잠깐, 잠깐 잠깐 잠깐!"
10024080-47 = "그 <오욕의 미후>가, 내가 아는 그 신타니 카이가 맞는 건가?"
10024080-48 = "그…… 예전 연단방의 부장이었다는……?"
10024080-50 = "한 명은 이야기가 통하는 것으로 보여 다행인 것이다……"
10024080-51 = "그렇다. 연단방의 전 부장. 일곱 죄수 중 한 명."
10024080-52 = "금지된 약물과 비약 유통에 손을 대다가, 영구히 산해경에서 추방된 자……"
10024080-53 = "[s] \"일곱 죄수라면, 분명……?\""
10024080-55 = "아, 그래. 일곱 명 전부 어떤 이유로 탈옥에 성공했다고 들었어."
10024080-56 = "그중 한 명이 이번 사건의 배후……"
10024080-57 = "저희들의 생각보다 규모가 큰 일이었군요."
10024080-59 = "자아, 자백하는 것이다! 누구와 어디에서, 무슨 거래를 어떻게 한 것이냐!"
10024080-61 = "……우리도, 정확히는 몰라."
10024080-62 = "우리 역시 점조직 중 하나였을 뿐이야. 정해진 장소까지 만년삼을 배달하고, 그 보수를 받았지."
10024080-63 = "(우리가 카이 씨를 알고 있다는 사실은 말하지 않는 게 좋겠지?)"
10024080-64 = "(당연하지! 분위기로 봐서 그 사실은 어떻게든 끝까지 숨겨야 해!)"
10024080-66 = "으윽…… 분명 무언가를 숨기고 있는 것 같은데……!"
10024080-68 = "여기에서부터는 우리에게 맡겨라."
10024080-69 = "그 말이 사실인지 어떨지는, 현룡문의 이름으로 밝혀내 주지!"
10024080-82 = "연단방도…… 과거가 복잡한 것 같네."
10024080-83 = "……산해경의 집단 대부분은, 풀어내기 쉽지 않은 과거를 갖고 있지요. 저희 현무상회만 하더라도……"
10024080-84 = "자, 자. 레이죠. 우리도 거기까지만 하자고. 지금 가장 머리가 복잡한 건 현룡문일 테니까."
10024080-85 = "우리 현룡문이?"
10024080-86 = "아닌가? 만년삼에, 저쪽 간부 뒤처리에, 하부 조직도 밝혀내야 할 것이고……"
10024080-88 = "아, 알고 있다! 그런 것 정도는!"
10024080-89 = "[s] \"현룡문은 이제 어떻게 할 거야?\""
10024080-90 = "우선은 가능한 모든 만년삼을 회수해야겠지."
10024080-91 = "그리고…… '현룡문'의 방법으로 책임을 지게 할 거다. 그 뒤에는 무한히 이어지는 심문이 기다리고 있을 거고."
10024080-92 = "현룡문의 이름에 오점을 남긴 죄는 가볍지 않을 거라고. 후후후후후……"
10024080-93 = "웃는 것도 좋지만, 한 가지 잊은 게 있는 것 같습니다."
10024080-94 = "윽?!"
10024080-95 = "모든 경위를 따져 보면, 결국 현룡문이 만년삼 거래의 주 범인 중 하나였다……고 해석해도 되는 것이겠지요?"
10024080-96 = "그, 그게…… 여기에는 현룡문 내부의 사정이……"
10024080-97 = "현룡문의 사정 같은 것은 현무상회로서 알 바 아닙니다."
10024080-99 = "현룡문도 현무상회의 사정을 고려하지 않고, 다짜고짜 범인으로 몰아갔으니 말입니다."
10024080-101 = "아니, 그게, 그렇게 볼 수도 있긴 하겠지만, 지금 말이 좀 심하지 않나?!"
10024080-102 = "그 물음에 대해서는, 저희 현무상회가 현룡문을 방문했을 때의 취급을 대답으로 대신하고 싶군요."
10024080-103 = "드, 들어 보라고. 이 일에 대해서는 현룡문의 방법으로 확실히 책임을 지고 진상을 밝혀낼 테니……!"
10024080-104 = "현룡문의 방법이든, 또 다른 전통적인 방법이든 그런 것은 아무래도 좋습니다."
10024080-105 = "이 일의 결말로, 현무상회로서는 현룡문에게 사과를 요구할 정당한 권리가 생겼다는 것만 알아주시면 됩니다."
10024080-106 = "그, 그게……. 그러니까……"
10024080-107 = "애, 애초에 나 혼자 결정할 수 있는 문제가 아니다! 하지만…… 끄응…… 일방적으로 단정 지었던 것은…… 잘못되었다고, 생각한다……"
10024080-109 = "나, 나중에 제대로 사과할 수 있게, 자리를 마련할 테니까!"
10024080-115 = "도망가 버렸습니다……!"
10024080-116 = "하하하. 뭐, 지나치게 몰아세우면 대부분은 이렇게 되기 마련이지."
10024080-117 = "회장님은 그것으로 괜찮으신 겁니까? 저는 최소한 받은 만큼은 돌려주어야……"
10024080-118 = "됐어, 됐어. 우리의 무고를 증명한 것만으로 충분해."
10024080-119 = "어차피 현룡문과는 계속해서 만날 수밖에 없을 거고."
10024080-120 = "이야기가 잘 풀린다면 거기에서 우리의 그 권리를 주장할 수도 있겠지."
10024080-121 = "자, 일단 상회로 돌아갈까! 연단방도 수고했어. 고마워."
10024080-122 = "우리도 일단은 돌아가는 것이다. 대비해야 할 게 많은 것이다……"
10024080-123 = "미리 걱정하는 것도 좋지만, 일단은 축하하자고."
10024080-124 = "선생님도 수고했어. 고마워."
10024080-125 = "[s] \"할 일을 한 것뿐이야.\""
10024080-126 = "그렇게 겸손 떨지 말고. 돌아가면…… 그렇군. 보답으로 모두에게 새로 실험 중인 음식이라도 대접해 줄게!"
10024080-127 = "네?! 그건 어떤 의미에서 은혜를……! 아뇨, 아닙니다. 실언을 할 뻔했군요."
10024080-129 = "(그렇지만 회장님께서 새로 실험하는 음식은…… 대부분 맛이……)"
10024080-130 = "(맛이…… 괴상하달까, 형언할 수 없달까, 극한의 실험 정신을 품고 있다고 해야 할까……)"
10024080-135 = "[ns] \"현무상회의 새 요리라니, 기대되는데?\""
10024080-136 = "새 요리라면…… 예전의 치즈 난자완스를 얹은 볶음도삭면 같은 것이냐?! 그런 거라면 얼마든지 환영인 것이다!"
10024080-138 = "(역시 여기에서는 두 분께 진실을 말씀드리는 것이……! 하지만 저는 루미 회장님을 지키는 몸……!)"
10024080-139 = "(그러나 선생님과 사야 님은 또한 현무상회의 은인 되신 분……!)"
10024080-140 = "(아아, 저는 어찌해야 좋습니까. 누군가 부디 가르침을……)"
10024080-146 = "그래…… 만년삼의 반출이 금지되었는가."
10024080-147 = "그 아이들이…… 의외로군. 아니, 이것도 샬레의 '선생'이 함께했기 때문인가."
10024080-148 = "상관없다. 만년삼으로 할 수 있는 신약의 실험은 대부분 끝난 상태."
10024080-149 = "하지만 아쉬움이 남는 것은 어쩔 수 없군. 아직 임상 시험의 자료는 충분히 축적되지 않았거늘."
10024080-153 = "좋아, 좋아. 이 또한 여흥."
10024080-154 = "쿡쿡. 다음에는 후배들의 얼굴도 볼 겸, 내 직접 산해경에 들어가 보아야겠어."
10024080-155 = "'선생'과의 만남 역시 도모하면서 말이지."
10024080-156 = "선생, 선생이라……"
10024080-157 = "간만에, 참으로 기대되는 만남이 되겠군. 쿡쿡."
