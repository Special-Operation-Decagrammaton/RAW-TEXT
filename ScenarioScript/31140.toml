[translation]
31140-1 = "제14화;정의실현부의 부부장 1"
31140-2 = "(그 이후, 저녁까지 자율학습이 진행되었다.)"
31140-3 = "코하루, 질문이 있어."
31140-4 = "으, 으응? 나? 나한테?!"
31140-5 = "그래. 우리는 같은 부분을 배우고 있으니까. 이 문제 말인데……."
31140-6 = "으, 으응……."
31140-7 = "……아, 이거! 알고 있는 거야!"
31140-8 = "이건…… 이렇게 해서, 밑변에 직각으로 닿는 보조선을 그으면 된다고 했어!"
31140-9 = "자, 그럼 이 삼각형과 이 삼각형이 같은 비율이 되잖아? 봐봐, 그렇지?"
31140-10 = "……과연. 그렇군."
31140-11 = "도움이 됐어. 과연 정의실현부의 엘리트야."
31140-12 = "……?!"
31140-13 = "에, 엣헴! 알면 됐어."
31140-14 = "또 모르는 게 생기면 언제든지 내 도움을 받아도 돼. 아즈사라면 특별히 괜찮으니까."
31140-15 = "응. 고마워. 신세를 질게."
31140-19 = "……. 어머나."
31140-20 = "좋은 분위기네요. 역시 서로의 알몸을 본 사이랄까♡"
31140-21 = "무, 무슨 소리야! 그거랑 무슨 상관인데!!"
31140-22 = "딱히 난 상관없으니까, 하나코도 씻는데 도움이 필요하면 말해."
31140-23 = "……아, 아우……."
31140-27 = "그럼 하나만 더 신세를 지지. 코하루."
31140-29 = "응……? 이 문제는……."
31140-30 = "코하루도 모르는 문제야?"
31140-31 = "으, 으응?! 아냐! 이건 분명 참고서에서 본 것 같은데……."
31140-32 = "기, 기다려 봐."
31140-33 = "(뒤적뒤적) 가방에 넣어둔…… 이 참고서에……."
31140-37 = "자아!"
31140-44 = "이게…… 참고서……?"
31140-45 = "응, 이 참고서……."
31140-46 = "……응?"
31140-47 = "야한 책이네요."
31140-52 = "으, 으갸아아아아?! 이, 이게 왜?!"
31140-53 = "코하루 쨩, 야한 책이에요. 맞죠? 숨겨도 소용없어요. R18이라고 적혀 있었잖아요?"
31140-54 = "아, 아니야! 잘못 본 거야! 아냐! 아무튼 아냐! 절대 아냐!!"
31140-58 = "제 눈을 속이려고 하지 마세요. 분명 이건 야한책이에요! 그것도 하드한 R18등급의……"
31140-59 = "트리니티에서, 아니, 키보토스에서도 찾기 힘든 수위의……! 이리저리 살색이 뒤엉키고 비명이 난무하고 이성이 날아가는 그런 내용이잖아요?!"
31140-60 = "어째서 그런 책을 가지고 있는 거죠? 교칙에 분명히 금지되어 있을 텐데?"
31140-61 = "아, 아니…… 그게……. 내, 내 거가 아니야, 이건…… 그러니까……. 내 거가 아니라……."
31140-62 = "분명히 코하루 쨩의 가방에서 나왔잖아요? 게다가 합숙소까지 가져온 걸 보면……. 엄청나게 소중하다는 뜻이잖아요?"
31140-63 = "그 철저하던 코하루 쨩이 이런 야한 책을 가지고 있었다니……."
31140-68 = "……아하. 그렇군요. 생각해보니 꼭 필요한 물건이네요."
31140-69 = "합숙 준비를 철저하게 했네요, 코하루 쨩♡"
31140-73 = "아니야아아아아아아!!"
31140-74 = "??"
31140-75 = "아, 아우우……. 하나코 쨩…… 놀리는 건 그만……."
31140-76 = "어머. 너무 심했나……."
31140-81 = "우우우우……."
31140-83 = "……."
31140-84 = "그러니까, 코하루 쨩……."
31140-85 = "정의실현부 활동 중에 압류한 압류품을 모르고 가져와버렸다는…… 그런 거죠?"
31140-86 = "우우우……. 응……. 내가 압류품 관리자 역할이라……."
31140-87 = "그러네요. 고서관 지하에는 저런 금서들이 잔뜩 쌓여있다는 소문을 듣기도 했었으니…… 정의부가 압류한 수량도 분명 있겠죠."
31140-88 = "그치만 큰일이네요. 코하루 쨩, 지금은 보충수업부 소속이라 이걸 가지고 있으면 문제가 생길 텐데……."
31140-89 = "우우…… 가져다 둔다는 걸 깜빡하고……."
31140-90 = "압류 품목의 숫자가 빈다는 걸 알기 전에 다시 돌려놓는 편이……."
31140-91 = "정의실현부로 가서 몰래 다시 넣어두면 문제없지 않을까요?"
31140-92 = "아, 으응?"
31140-93 = "[s] \"나랑 같이 다녀오자. 코하루.\""
31140-94 = "응? 서, 선생님이……?"
31140-95 = "……응. 그러네요. 선생님이 함께 가면 혹시 들켰을 때도 하스미 씨도 크게 혼내진 못할 테고……."
31140-96 = "코하루 쨩, 가서 다음 권을 가져오면 안 돼요?"
31140-101 = "아, 안 그래!!"
31140-103 = "(그렇게 코하루와 함께 트리니티 정의실현부 부실로 향했다.)"
31140-105 = "다음화;정의실현부의 부부장 2"
