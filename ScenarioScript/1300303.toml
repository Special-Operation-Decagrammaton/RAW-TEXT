[translation]
1300303-1 = "깨닫지 못한 사실"
1300303-2 = "(딸랑-)"
1300303-4 = "(약속을 잡은 장소에 하스미가 들어왔다.)"
1300303-5 = "아. 기다리고 계셨네요, 선생님."
1300303-6 = "[s] \"안녕.\""
1300303-7 = "음, 그럼 주문부터 하시겠어요? 이곳의 밀크티가 꽤 맛있거든요."
1300303-8 = "주문하시겠어요?"
1300303-9 = "저는 밀크티로 하고, 음…… 선생님은 어떤 걸로 하시겠어요?"
1300303-10 = "[s1] \"블랙 커피로.\"\n[s2] \"오렌지 쥬스로.\"\n[s3] \"후르츠 파르페로.\""
1300303-11 = "네, 그럼……."
1300303-12 = "허니 밀크티 하나랑, 블랙 커피 하나,"
1300303-13 = "네, 그럼……."
1300303-14 = "허니 밀크티 하나랑, 오렌지 쥬스 하나,"
1300303-15 = "네, 그럼……."
1300303-16 = "허니 밀크티 하나랑, 후르츠 파르페 하나,"
1300303-17 = "버터 푸딩 하나, 쇼콜라 바움 쿠헨, 치즈 타르트 하나랑……"
1300303-18 = "계절 과일 티라미수 케이크, 오렌지 마들렌…… 그리고……."
1300303-19 = "쵸코 크로칸 슈 2개에…… 녹차 크레이프랑……."
1300303-20 = "[s] \"………….\""
1300303-21 = "음. 이 정도면 될 것 같네요."
1300303-23 = "드시죠, 선생님."
1300303-24 = "[s] \"즐거워보이네.\""
1300303-25 = "(우물우물)"
1300303-26 = "그, 그런가요?"
1300303-27 = "실례했습니다. 조금 격의가 없을 지도 모르겠네요……."
1300303-28 = "이렇게 디저트 먹는 것을 좋아해서, 원래 정의실현부에 오지 않았다면 방과후 디저트 부에 가입했을지도 모르겠네요."
1300303-29 = "하지만 이렇게 매일 혼자서라도 맛있는 걸 먹는 시간이 무척 소중해서……."
1300303-30 = "(우물우물)"
1300303-31 = "[s] \"그래서, 상담하고 싶다는 건 뭐야?\""
1300303-32 = "네. 그건……."
1300303-33 = "………."
1300303-34 = "다이어트……에 대한 얘기였습니다만……."
1300303-35 = "[s] \"다이어트?\""
1300303-36 = "……."
1300303-37 = "네. 저는 특별히 뭔가 하지 않아도 살이 찌는 체질인 탓에,"
1300303-38 = "일단 다이어트를 하고는 있는데……. 해도 해도 성과가 잘 나오지 않아서."
1300303-39 = "도무지 원인을 모르겠어서……."
1300303-40 = "선생님은 학생들의 관리를 하시는 분이니까, 뭔가 조언을 받을 수 있는 게 없을까 해서……."
1300303-41 = "[s4] \"……원인을.\"\n[s5] \"……모르겠다고?\""
1300303-42 = "……네. 선생님은 원인을 아시겠나요?"
1300303-43 = "……네. 선생님은 원인을 아시겠나요?"
1300303-44 = "체질인가요? 아니면 생활 습관……? 운동을 조금 더 늘려야 할까요?"
1300303-46 = "[s] 디저트를 먹고 있는 하스미를 바라본다."
1300303-48 = "……?"
1300303-49 = "……."
1300303-50 = "…………."
1300303-51 = "……. 아, 그, 그, 그러니까……."
1300303-52 = "……."
1300303-53 = "원인은……. 어…… 이, 이거였을까요?"
1300303-54 = "……."
1300303-55 = "그, 그렇…… 겠네요. 역시. 이거겠죠."
1300303-56 = "……. 이 단순한 걸 깨닫지 못하고…… 저, 저는……."
1300303-57 = "……원인을 물으러 선생님을 찾아와서…… 또 엄청 먹고 있었던 건가요……. #n부끄러워……."
1300303-58 = "[s] \"괜찮아?\""
1300303-60 = "가, 갑자기 급한 일이 생각나서, 선생님! 저는 이만 돌아가보겠습니다!"
1300303-62 = "(휘잉~)"
1300303-64 = "[s] \"또?!\""
1300303-65 = "그럼 다음에!"
1300303-67 = "(바람처럼 사라져버린 하스미였다.)"
