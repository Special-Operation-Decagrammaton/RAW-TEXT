[translation]
10027070-1 = "제7화;톱니바퀴"
10027070-2 = "붉은겨울 도서관"
10027070-5 = "그 녀석, 갔어?"
10027070-6 = "[s] \"응. 타카네, 잘 돌아갔어.\""
10027070-7 = "그래……. 그렇구만……."
10027070-13 = "[ns] \"메루?!\""
10027070-14 = "괜찮아, 괜찮아. 졸려서 조금 다리가 풀린 것뿐이야. 긴장이 풀리면 늘 있는 일이니, 신경 쓸 거 없어."
10027070-15 = "만화가도 큰일이라고? 히히……. 선생이 알아주니 뭔가 좋은데."
10027070-16 = "그러면 난 조금만 잘게. 아주 조금만……. 키보토스가 멸망할 것 같은 일이 아니면 깨우지 마……."
10027070-21 = "(메루는 그대로 다시 쓰러지듯 잠들었다…….)"
10027070-27 = "(정신을 잃은 메루를 침대에 눕혀 주고, 잠시 도서관 의자에 몸을 앉혔다.)"
10027070-34 = "[ns] \"전화……? 발신인이…….\""
10027070-37 = "[ns] \"모미지?!\""
10027070-42 = "붉은겨울 산길"
10027070-44 = "아, 안녕하세요. 선생님. 그동안 잘 지내셨어요?"
10027070-45 = "네. 저야 뭐……. 괜찮죠. 잘 지내고 있어요."
10027070-46 = "……."
10027070-47 = "저기, 선생님. 최근 조금…… 고민이 생겨서요. 선생님께 약간, 상담을 부탁드리고 싶어서……."
10027070-48 = "무슨 문제냐고요? 그건……."
10027070-49 = "……."
10027070-50 = "메루 선배에, 대한 건데요……."
10027070-51 = "[s] \"메루와 싸운 이야기?\""
10027070-52 = "네, 네?! 어, 어떻게 선생님께서 그걸……?!"
10027070-53 = "예? 지금 이미…… <지식해방전선>의 도서관에 와 계시다고요?! 어떻게 된 거죠?!"
10027070-62 = "그렇군요. 메루 선배가……."
10027070-63 = "저기, 선생님."
10027070-64 = "저도…… 메루 선배와 화해하고 싶어요."
10027070-65 = "물론 메루 선배는 자기밖에 모르고, 시야도 좁고, 시끄럽고 천방지축인 데다 안하무인인 주제에 미묘한 부분에서 소심하지만……."
10027070-66 = "그래도, 근본적인 부분에서 나쁜 사람은 아니니까요."
10027070-67 = "<루나>에 관한 것도, 조금 제가 과하게 감정적으로 반응한 것뿐이지. 충분히 그렇게 느낄 만한 감상이었고요."
10027070-71 = "메루 선배는…… 작가니까요."
10027070-72 = "아마…… 바라보는 관점이 달랐던 거라고 생각해요."
10027070-73 = "그냥…… 제가 잠깐 머리가 뜨거워져서, 메루 선배에게 조금 심한 말을 해 버린 것 같아요."
10027070-74 = "헤헤……. 그리고 메루 선배, 사과 같은 거 잘 못 하는 성격이니까, 그냥 제가 먼저 사과하는 편이 나을 것 같기도 하고요."
10027070-78 = "[ns1] \"그거 말인데. 모미지.\"\n[ns2] \"메루가 <루나>의 마지막 권 동인지를 그리고 있어.\""
10027070-82 = "네?! 그건 또 무슨 말씀이세요?!"
10027070-83 = "저기, 제가 잠시 <지식해방전선>을 떠나 있던 사이에, 무슨 일이 벌어지고 있었던 거죠?!"
10027070-85 = "(모미지에게 지금까지 있었던 일을 차근차근 설명해 주었다…….)"
10027070-94 = "……."
10027070-95 = "…………."
10027070-96 = "……………………."
10027070-97 = "[s] \"저기, 모미지……?\""
10027070-98 = "이럴 때는 어떤 반응을 하면 좋은지 모르겠어요……."
10027070-99 = "[s] \"그 기분, 알 것 같네…….\""
10027070-100 = "메루 선배가 거기까지 행동하고 있었다고요? 그리고 선생님은 그걸 다 지켜보고 계셨고요? 동인지는 절반 정도 완성되었고, 남은 기간은 이틀이라고요?"
10027070-101 = "이거, 현실 맞죠? 제가 무슨 이상한 꿈 같은 거 꾸고 있는 거 아니죠?"
10027070-102 = "엄연한 현실이라고요? 너무하네요……. 왜 엄연한 현실이라는 것은 우리를 조금도 봐 주지 않고 구석으로 몰아붙이는 걸까요."
10027070-103 = "무엇보다 메루 선배, 아무도 거기까지 그렇게 행동하라고 말하지 않았을 텐데."
10027070-104 = "참, 늘 느끼지만 한 번 꽂히면 누가 뭐라고 해도 주위를 돌아보지 않는단 말이죠……."
10027070-105 = "[s] \"그래도, 메루는 모미지를 위해 그 동인지를 그렸어.\""
10027070-106 = "……네."
10027070-107 = "그건…… 알 것 같아요. 헤헤. 뭔가 기분이 이상하네요."
10027070-108 = "다른 건 모르겠지만…… 메루 선배의 <루나>는, 역시 한번 보고 싶네요."
10027070-112 = "그거…… 정말이야?"
10027070-113 = "?!"
10027070-114 = "[s] \"!?\""
10027070-119 = "……."
10027070-120 = "메, 메루 선배?!"
10027070-121 = "아니, 그게. 자다가 잠깐 깼는데. 선생이 갑자기 도서관 밖으로 바쁘게 나가길래……."
10027070-122 = "그, 그러면 저희 대화, 다 들었던 거예요?!"
10027070-123 = "전부는 아니고……. 어느 정도이긴 하지만……."
10027070-125 = "후에에에에……."
10027070-126 = "으우우우우우……."
10027070-131 = "[ns] \"으으으으으음…….\""
10027070-132 = "서, 선생님?! 적어도 뭔가 도움 되는 말씀이라도 한마디……. 저희랑 마찬가지로 곤란하다는 신음소리를 내뱉으시면……!"
10027070-133 = "그, 그래. 선생. 이 분위기 어떻게 좀 해 줘……."
10027070-134 = "[s] \"어른이라고 모든 일에 대처할 수 있는 건 아니란다…….\""
10027070-136 = "지금 그런 일반론으로 도망칠 때냐-!"
10027070-142 = "그, 메루 선배? 저희……."
10027070-143 = "으, 응. 그러니까……."
10027070-144 = "……."
10027070-145 = "……."
10027070-146 = "[s] \"만나고 나서 생각하는 건 어떨까?\""
10027070-147 = "선생님?!"
10027070-148 = "선생!?"
10027070-149 = "어…… 얼굴을 보고 이야기하면, 풀리지 않을 것도 풀릴지 모른다고요?"
10027070-150 = "그, 그렇지만 이렇게 갑작스럽게……. 그 뭐냐, 빌드업이라고 해야 하나 밑 작업이라고 해야 하나, 그런 거 있잖아, 왜!"
10027070-151 = "그런 걸 하나하나 따지다가는 될 일도 안 된다고요……? 그, 그건 분명 그럴지도 모르겠는데요……."
10027070-152 = "……."
10027070-153 = "……."
10027070-154 = "저기, 모미지……?"
10027070-155 = "네, 네?"
10027070-159 = "우리, 일단…… 만나서, 이야기할래?"
10027070-160 = "그, 그럴…… 까요?"
