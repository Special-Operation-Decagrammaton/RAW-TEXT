[translation]
1005506-1 = "솔직하게"
1005506-2 = "(샬레의 조리실습실에서 기다리고 있노라니, 약속 시간에 맞춰 시구레가 도착했다.)"
1005506-8 = "호오, 여기가 샬레의 조리실습실……. 생각보다 이것저것 갖춰져 있네."
1005506-13 = "당번 활동을 하러 샬레에 방문한 적은 있지만, 조리실습실에 들어오는 건 처음이려나."
1005506-14 = "[s1] \"어서 와, 시구레. 그런데…….\"\n[s2] \"등에 멘 그 보따리는 뭐야?\""
1005506-19 = "……응? 아아, 이거?"
1005506-20 = "후후. 역시 바로 물어볼 줄 알았지."
1005506-21 = "오늘 내가 여기 온 이유는 선생님도 알고 있잖아? 직접 요리를 대접해 주고 싶다고."
1005506-22 = "그래서 요리에 필요한 식재료를 좀 챙겨왔어."
1005506-23 = "아, 걱정할 건 없어. '이상한' 식재료는 하나도 없으니까."
1005506-24 = "요리는 내가 다 알아서 할 테니, 선생님은 그냥 거기 편히 앉아서 기다리면 돼. 알았지?"
1005506-25 = "그럼 227호 특별반 특제 지비에 요리를……"
1005506-32 = "[ns3] \"자, 잠깐—!\"\n[ns4] \"이 날고기들은 다 뭐야?!\""
1005506-35 = "응? 뭘 놀라는 거야. 재료가 너무 신선해서 당황했어?"
1005506-36 = "후후. 그 표정을 보아하니 이 정도로 신선한 고기는 선생님도 처음 보는 모양이네."
1005506-37 = "……지비에가 뭐냐고? 지비에는 지비에지."
1005506-38 = "사냥으로 직접 잡은 곰이나 사슴, 토끼 같은…… 그런 야생동물 고기를 말하는 거야."
1005506-39 = "보통은 잡아서 그 자리에서 직접 손질하지만, 지비에 요리의 생명은 신선도니까."
1005506-43 = "오늘은 이 상태로 가져와서 샬레에서 직접 손질을……."
1005506-44 = "……응? 좀 더 평범한 식재료는 없냐고?"
1005506-45 = "지비에 정도면 평범하지 않은가? 특별반 학생들은 매 끼니마다 지비에 요리만 먹는데?"
1005506-46 = "……라는 건 물론 농담. 사무국에서 빵이나 쌀 같은 식재료는 배급해 주기 때문에 우리에게도 지비에는 특식 같은 느낌이야."
1005506-47 = "하지만 저번에는 선생님이 번화가에서만 먹을 수 있는 음식을 대접해 주었으니, 이번에는 내가 특별반에서만 먹을 수 있는 특식을 대접해 주고 싶었거든."
1005506-48 = "다만 이 날고기는 오늘의 요리에 쓰지 않을 거야. 잡은 지 얼마 되지 않은 고기는 너무 질겨서 먹기에 적합하지 않거든."
1005506-49 = "후후. 그래도 선생님의 놀라는 얼굴을 보았으니, 고생해서 이 고깃덩어리를 들고 온 보람이 있네."
1005506-50 = "[s5] \"놀리려고 그런 고생까지…….\"\n[s6] \"시구레는 여러 가지로 정말 대단하구나.\""
1005506-53 = "즐겁게 사는 건 중요한 일이니까. 장난을 빼면 인생의 재미가 반감되는 법이라고."
1005506-54 = "자, 그럼 본격적으로 요리를 시작해 볼까……?"
1005506-57 = "고기에 소금과 향신료로 밑간을 하고……"
1005506-63 = "잘 달구어진 팬 위에 버터를 두른 다음 겉이 바삭해질 때까지 익힌 다음……"
1005506-67 = "마지막으로 보드카를 위에 뿌리면……"
1005506-72 = "[ns7] \"잠깐, 멈춰!\"\n[ns8] \"어째서 요리 위에 술을 뿌리는 거야?\""
1005506-75 = "응? 선생님, 요리에 술을 쓰는 걸 처음 봐?"
1005506-76 = "요리에 술을 넣으면 고기의 잡내를 잡아줄 수 있을 뿐만 아니라 술이 갖는 독특한 풍미를 음식에 더할 수 있다고."
1005506-77 = "전에 갔던 레스토랑에서도 마지막에 술을 붓고 불을 붙여줬잖아. 그걸 플람베라고 하던가……?"
1005506-78 = "[s9] \"그건 술을 넣고 가열했을 때의 이야기지……\"\n[s10] \"이대로는 고기에서 술 냄새가 날 거야\""
1005506-81 = "으음, 그런가……"
1005506-82 = "하지만 어쩌지? 이미 고기는 충분히 익어서 여기서 더 열을 가하면 탈 것 같은데……"
1005506-83 = "역시 하는 수 없지만 이번에는 직접 먹는 수밖에—"
1005506-87 = "[ns] \"내가 대신 새로 만들어줄게.\""
1005506-91 = "응? 선생님이 직접 요리를?"
1005506-92 = "상관없지만, 오늘은 내가 요리를 대접하려고 했었는데……"
1005506-93 = "[s] \"괜찮으니까, 거기 앉아서 기다려줘.\""
1005506-103 = "(……시구레가 가져온 식재료로 직접 요리를 해주었다.)"
1005506-109 = "……결국은 선생님이 해준 요리를 먹게 됐네."
1005506-110 = "미안한걸. 모처럼 선생님의 시간을 빼앗았는데, 또 대접을 받게 되다니……."
1005506-111 = "[s11] \"괜찮아. 그렇게 어려운 일도 아니었으니까.\"\n[s12] \"시구레가 직접 찾아와 준 것만으로도 충분해.\""
1005506-116 = "……흐음."
1005506-117 = "그렇게 말해주니 다행이지만……."
1005506-118 = "그래도 그렇게 대놓고 말하면 아무리 나라도 조금 당황하게 되는걸."
1005506-119 = "과연, 이것이 어른의 여유인가…… 어쩐지 신선한걸."
1005506-120 = "하지만 그런 식으로 자꾸 기대를 하게 만들면, 나도 앞으로 어떻게 할지 모른다고."
1005506-121 = "그러니 주의해줬으면 해."
1005506-122 = "선생님도 내가 샬레에 너무 자주 들락거리면 피곤할 거 아니야."
1005506-123 = "……응? 괜찮다고?"
1005506-124 = "이런 장난 정도는 얼마든지 받아줄 수 있다고?"
1005506-125 = "호오, 그렇게 나오시겠다……."
1005506-126 = "응. 알겠어. 앞으로도 자주 들를 테니까."
1005506-127 = "선생님도 우리 227호 특별반을 자주 찾아와줘."
1005506-128 = "물론, 오기 전에 연락하는 거 잊지 말고!"
