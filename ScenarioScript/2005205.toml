[translation]
2005205-1 = "타임 테이블"
2005205-4 = "[ns] \"…….\""
2005205-5 = "……."
2005205-6 = "[s1] \"기차…… 안 오네……\"\n[s2] \"이러다 선생님……. 더 나이를 먹어 버려요……?\""
2005205-9 = "진짜, 아무리 우리 학원이지만……."
2005205-10 = "이 말도 안 되는 인프라, 어떻게 안 되나 싶네요……."
2005205-11 = "어제오늘 일도 아니지만, 교내 순환 기차가 제시간에 도착하는 꼴을 못 봤단 말이죠……."
2005205-12 = "안 되겠습니다. 선생님."
2005205-13 = "저 아라마키 야쿠모, 결심했습니다."
2005205-14 = "[s] \"이상한 결심만 하지 말아 다오…….\""
2005205-15 = "어허, 거 왜 그러세요. 저에게 속고만 사셨나요?"
2005205-16 = "모든 변화에는, 이른바 모범 사례가 있어야 하는 법."
2005205-17 = "붉은겨울의 철도 인프라를 바꿔 나가기 위해서는, 모범적인 철도 운영 사례……."
2005205-18 = "적어도 정시에 기차가 도착하고, 출발하는 사례를 직접 체험할 필요가 있다고 보입니다!"
2005205-19 = "[s] \"야쿠모가 오래간만에 제대로 된 말을 하고 있어!\""
2005205-20 = "그렇죠?"
2005205-21 = "그래서 뭘 할 거냐고요?"
2005205-22 = "이제부터 저는…… 붉은겨울 바깥……."
2005205-23 = "특히 D.U.의 철도 위주로 타면서, 노선과 시간표를 분석할 겁니다!"
2005205-24 = "그러니까 선생님도 함께하시죠! 조사 고문 교사로서요!"
2005205-25 = "[s] \"결국 그렇게 되나…….\""
2005205-26 = "에이, 왜 그러세요. 이거 나름 학생의 교육과도 관련된 업무라고요?"
2005205-27 = "경위서 잘만 써 내면, 예산도 분명 할당될 거고요."
2005205-28 = "아, '그런 쪽' 문서 작성에 도움이 필요하시면, 언제든 저에게 말씀해 주시면 한층 수월할 겁니다."
2005205-29 = "힛. 힛. 히."
2005205-31 = "(야쿠모의 제안은 일단 거절했지만.)"
2005205-32 = "(철도 인프라 체험은 필요한 것 같았기에, 일일 철도 패스를 두 장 구입했다.)"
2005205-35 = "아하, 그렇군요. 일단은 지하철부터인가요오……."
2005205-36 = "원래 지하철이라는 게 웬만하면 정시 도착, 정시 출발 시스템이 확립된 것이기는 하지만."
2005205-37 = "뭐, 이것도 이것 나름대로 정취가 있겠지요."
2005205-41 = "그러면 선생님. 오늘 열차 투어."
2005205-42 = "잘 부탁드립니다아~ 힛. 힛. 히."
2005205-49 = "으음~ 주기적인 흔들림. 레일 소리. 하지만 방음 시설 덕분에, 상대적으로 백색 소음만큼 편하게 들리네요오……."
2005205-50 = "이래서야 지하철만 타면 잠이 온다는 사람이 생길 만도……."
2005205-51 = "……."
2005205-52 = "코오……."
2005205-57 = "오오, 멋진 역이네요. 시설도 깔끔하고, 이용객 역시 한눈에 봐도 많아 보이고……!"
2005205-58 = "오호. 키보토스 각지로 이어지는 고속철도 노선들도, 여기와 이어져 있군요. 이어진 선로 수만 해도 32선……. 흐음, 흐음."
2005205-59 = "그러면, 선생님. 이렇게 중앙역으로 분류되는 핵심 철도역에 왔을 때, 우리는 무엇을 해야 할까요?"
2005205-60 = "[s3] \"어…… 노선을 헷갈리지 않기 위해 길 물어보기?\"\n[s4] \"열차 시간표 다시 한번 확인하기?\""
2005205-63 = "물론 그런 것도 있겠지만……."
2005205-64 = "또 하나 중요한 것이 있습니다! 바로, 기차 여행의 명물! 역 도시락 고르기죠!"
2005205-65 = "[s] \"그거냐.\""
2005205-66 = "에이, 왜 그러세요. 이거 나름 중요한 거라고요? 사람이 다 먹고살아야 그다음 일을 할 수 있는 법이잖아요."
2005205-67 = "자, 자. 여기 철도 시간표가 제대로 지켜진다면, 아직 탑승까지는 40분 정도 남았어요."
2005205-68 = "도시락을 고르기에는 딱 좋은 정도라는 겁니다! 가시죠!"
2005205-73 = "오, 이건 그 유명한 문어 항아리 도시락이네요."
2005205-74 = "낙지에 붕장어 조림, 야채를 곁들인 맛밥. 그리고 문어 튀김도 있는 데다……."
2005205-75 = "무엇보다 이 도시락 용기가 진짜 항아리라는 것이 포인트죠."
2005205-76 = "……그 덕에 조금 무겁기는 합니다만, 그 부분은 어쩔 수 없는 것으로 하고."
2005205-77 = "문어를 잡을 때 쓰는 항아리를, 그대로 형상화해서 상품성을 준 것이 중요한 부분이라고 할 수 있겠네요."
2005205-81 = "아, 소고기덮밥 도시락이군요."
2005205-82 = "평범하고 무난한 메뉴이지만, 거기에서만 맛볼 수 있는 풍류가 있는 법이죠."
2005205-83 = "간장으로 맛을 낸 소고기와, 야채조림에 계란말이. 초생강도 빼놓을 수 없겠죠."
2005205-84 = "기차에서 먹는 음식이라는 것을 고려해, 냄새가 많이 나지 않도록 초생강에 탈취 처리를 해 두었는데."
2005205-85 = "이런 섬세한 배려가, 한 그릇이라도 더 팔리고 안 팔리고를 결정한다고 생각합니다."
2005205-89 = "기차 모양 도시락!"
2005205-90 = "도시락 용기를, 그야말로 기차 모양 그 자체로 만든 도시락이에요."
2005205-91 = "내용물은 상대적으로 평범한 주먹밥과 가라아게, 소시지 같은 것들이지만……."
2005205-92 = "도시락 용기를 기념품으로 가져갈 수 있다는 것만으로, 이미 본전이라고 할 수 있지 않을까요?"
2005205-95 = "역 도시락은 아니지만, 이 아이스크림 또 나름대로 유명하다고 합니다."
2005205-96 = "뭐가 유명하냐고요? 그건……."
2005205-97 = "……너무 단단하게 얼어서, 도저히 그대로는 떠먹을 수 없다는 것으로요."
2005205-98 = "하도 답답해서 망치로 내리쳤더니, 망치가 오히려 튕겨 나갔다는 전설 같은 이야기도 있다는 모양이네요……."
2005205-101 = "대단하지 않습니까, 역 도시락!"
2005205-102 = "[s] \"그래, 그래. 전부 사 가자.\""
2005205-103 = "네?"
2005205-104 = "전부, 요?"
2005205-105 = "그러려고 고른 거 아니냐고요?"
2005205-106 = "틀리지는 않은데……."
2005205-107 = "이렇게 흔쾌히 사 주신다고 할 줄은……."
2005205-108 = "[s] \"학생이 잘 먹어야지.\""
2005205-109 = "……."
2005205-113 = "몇 가지는 돌려놓고 올게요."
2005205-114 = "의외라고요?"
2005205-115 = "뭐어……."
2005205-116 = "사양할 때는 사양할 줄 알아야죠."
2005205-117 = "그리고 어차피 이렇게 사 봤자 다 못 먹고 버릴걸요. 그편이 훨씬 아깝습니다."
2005205-139 = "[ns] \"기차 여행은 어땠어?\""
2005205-140 = "그렇네요오……. 아직도 약간은 꿈속에서 겪었던 일처럼 느껴지기도 하지만, 우선은……."
2005205-141 = "일단, 우리는 침목부터 재정비해야 할 것 같네요오……."
2005205-142 = "[s] \"아, 그거 중요하지.\""
2005205-143 = "네. 침목이 불안정하면 진동도 소음도 심해지고."
2005205-144 = "무엇보다 열차가 제대로 속도를 낼 수도 없으니 말이죠."
2005205-145 = "그런데 침목을 교체하려면 결국 철로도 재정비해야 하는데……."
2005205-146 = "어디 보자…… 붉은겨울의 넓이를 생각하면……."
2005205-147 = "붉은겨울 횡단 철도가 끝에서 끝까지 얼마나 걸리는지를 고려해서……."
2005205-151 = "……."
2005205-152 = "하아."
2005205-153 = "그래도 저는 언젠가, 전 붉은겨울에 제대로 된 철도 노선이 깔리는 걸 보고 싶네요."
2005205-154 = "[s5] \"철도 노선에 관심이 많구나?\"\n[s6] \"운행 도표 작성 같은 것도, 해 볼 생각 있어?\""
2005205-157 = "네? 다이어 작성이요? 그건 정말로 사양하고 싶은데요."
2005205-158 = "작성 자체도 번거롭지만, 그거 하는 사람은 전략 인재 취급이라고요?! 그러면 당연히 이런저런 간섭을 받게 될 거고……."
2005205-159 = "그러면 출판 사업을 못 하게 될 거 아닙니까!"
2005205-160 = "제가 관심이 있는 것은 어디까지나, 국지적인 철도 노선 분석 정도라고요! 그것도 가능하면 수동적으로!"
2005205-161 = "애초에 그쪽에 관심을 두게 된 것도, 책의 운송은 철도로 하는 법이었으니까 그랬던 거고요."
2005205-162 = "[s] \"야쿠모는 정말 출판부 부장이구나…….\""
2005205-163 = "그럼요. 당연하죠. 송충이는 솔잎을 먹어야 하는 법 아닙니까."
2005205-164 = "힛. 힛. 히."
