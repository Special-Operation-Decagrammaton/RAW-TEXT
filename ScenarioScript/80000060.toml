[translation]
80000060-1 = "교보재: 초콜릿"
80000060-2 = "(나츠의 연락을 받고, 기다리고 있다는 교실로 찾아갔다.)"
80000060-6 = "음. 역시 선생님이야. 제시간에 딱 맞춰서 도착했네."
80000060-7 = "오늘 부른 이유는……. 뭐, 사실 선생님도 알고 있겠지? 숨길 것 없이 바로 그 이유야."
80000060-8 = "특별한 날은 그 존재 자체만으로도 사람들에게 목적과 행동을 제시해 주는 법이니까 말이지."
80000060-9 = "평소에는 할 수 없었던 말과 행동들, 수많은 무의미하지만 강한 제약들로부터 해방시켜주는 날이기도 하고……."
80000060-10 = "……그래. 바로 마음을 표현한다는 것."
80000060-11 = "모든 사람에게 매일매일이 오늘처럼 특별한 날이라면, 세상은 지금보다 훨씬 아름다울 텐데."
80000060-12 = "사람들 또한 그것을 모르지 않기에, 온갖 이유를 대서 별거 없는 날마저 다 의미를 부여하지만……."
80000060-13 = "슬프게도 '특별한 것'이란, 오직 희귀할 때에만 그 가치를 유지할 수 있는 법……."
80000060-14 = "특별한 날들이 많아지면 당연히 그중에서 더욱 특별한 날이 생기고, 나머지는 평범한 날들로 전락하게 마련이지."
80000060-19 = "……그렇다면 과연 오늘. 이 '발렌타인 데이'라는 것은 그것들 중 얼마나 깊은 가치를 지키고 있을까?"
80000060-20 = "어느샌가 제과 회사들의 각축장이나 한탕 성수기로 변질돼 버린 지금의 발렌타인 데이가, 과연 살아 있다고 할 수 있을까?"
80000060-21 = "그것은 이미 '나는 이렇게 생각해' 정도로 소심하게 말할 수밖에 없을 만큼 어려운 문제."
80000060-22 = "그리고 바로 지금 내가 선생님께 하고 있는 이 잡담처럼 무의미한 이야기……."
80000060-23 = "[s1] \"나츠 답지 않게 회의적인 이야기네.\"\n[s2] \"나츠는 발렌타인 데이가 싫은 거야?\""
80000060-24 = "아니. 결코 그렇지 않아. 오히려 사랑하지."
80000060-25 = "아니. 결코 그렇지 않아. 오히려 사랑하지."
80000060-26 = "방과후 디저트부의 일원인 내가, 디저트로 서로의 마음을 주고받는 이런 날을 싫어할 리 없잖아?"
80000060-27 = "그렇지만 지금의 내 말에서 그런 주저함이 느껴진다면. 어쩌면……. 아마도 내 말이 이렇게 길어지고 있다는 건……."
80000060-33 = "[ns] \"직접 만든 초콜릿이야?\""
80000060-34 = "……후후."
80000060-35 = "그걸 물어보는 건, 여기까지 와서 조금 세련되지 못한 일이라고 생각하는데."
80000060-36 = "물론 이런 날 길게 말을 늘어놓고 있는 나도 요령이 부족한 건 매한가지겠지만……."
80000060-37 = "……발렌타인 데이는 디저트로 마음을 교류하는 날이라고 했지."
80000060-38 = "그 안에 든 감정이 어떤 것인지, 애정인지 호의인지, 어쩌면 그 이상의 무언가인지는……."
80000060-39 = "분명 오늘만큼은, 절대로 말로 표현하면 안 되는 걸 거야."
80000060-40 = "그게 바로 발렌타인 데이. 평소 말이라는 걸 조리 있게 잘 못 하는 이들에게는 더없이 편한 날."
80000060-41 = "반대로 나처럼 늘 담소 나누길 좋아하는 이들에게는 그것을 틀어막는 답답한 날."
80000060-42 = "……그게 바로, 오늘이라는 '특별한 날'이 제시한 목적과 행동일 테니까."
80000060-47 = "……그러니 그냥, 아무 말 하지 말고 받아줘. 선생님."
80000060-51 = "오늘만큼은……."
80000060-55 = "이걸로, 그 모든 것들을 대신하자."
80000060-57 = "(나츠에게서 받은 초콜릿을 챙기고 교실을 빠져나왔다.)"
