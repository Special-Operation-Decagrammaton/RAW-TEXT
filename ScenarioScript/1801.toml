[translation]
1801-1 = "정의실현부의 휴무일 1"
1801-2 = "트리니티 종합학원 근교의 폐공장"
1801-3 = "꺄아악!"
1801-5 = "소란 피우지 마! 계속 반항했다가는 험한 꼴을 볼 줄 알아!"
1801-6 = "다, 당신들은 도대체 누구죠? 무슨 목적으로 저를 이곳에 납치한 건가요?"
1801-7 = "트리니티 학원의 아가씨가 그런 건 알아서 뭐하게?"
1801-8 = "너는 그냥 학원에서 인질 협상금을 지불할 때까지 이곳에 얌전히 잡혀만 있으면 되는 거야. 혹여나 엉뚱한 생각은 하지 말라고!"
1801-9 = "네?! 트, 트리니티 학원에 협상을 했다고요?"
1801-10 = "앙? 당연하지! 이미 연락을 끝냈다고. 학생들을 납치했으니 돌려받고 싶으면……."
1801-11 = "아, 안돼…… 모두 도망쳐…… 아니, 피해요……!!"
1801-12 = "응?"
1801-13 = "갑자기 무슨 소리야?"
1801-15 = "콰아아앙-!!"
1801-16 = "히, 히이이익?!"
1801-17 = "뭐, 뭐야?! 무슨 일이야?!"
1801-19 = "크크크크큭. 크크큭……."
1801-21 = "크히히히히히히히히힛-!!"
1801-22 = "우, 우와아아아?!"
1801-23 = "나, 나타났어요-!! 나타나버렸어요!!!"
1801-25 = "키에에에에에에에엑---!!!!"
1801-28 = "구호기사단 중앙 병동"
1801-29 = "……상태는 어떤가요?"
1801-30 = "인질로 잡혔던 학생들은 다행히 심각한 상태는 아니지만……."
1801-31 = "몇 명은 극심한 스트레스로 PTSD 증상을 보이는 거 같아요…… 3주 정도는 절대 안정을 취해야 해요."
1801-32 = "……."
1801-33 = "세리나 선배, 저 다녀왔어요!"
1801-34 = "시외에 있는 공공 병원에 데코보코 헬멧단 악당분들, 확실하게 배달하고 왔어요!"
1801-35 = "그분들, 완전 구겨진 캔콜라 같이 되어버려서 응급처치하는데 너무 무서웠다구요!"
1801-36 = "요컨대 그거죠? 정의실현부 츠루기 님의……."
1801-37 = "하나에 쨩……."
1801-39 = "앗, 죄, 죄송……."
1801-42 = "……그럼 계속 수고 부탁드립니다."
1801-43 = "아하하…… 네. 그럴게요."
1801-45 = "하아……."
1801-46 = "수고하셨습니다, 선배."
1801-47 = "다음은 무너진 건물에서 인질들을 같이 찾아주신 <시스터후드>에 감사 인사를……."
1801-48 = "아…… 그러네요. 거기도 들려야 하고……."
1801-49 = "그다음은 손해배상 청구를 처리해준 행정실에 들려야 하고……."
1801-50 = "음…… 그렇죠."
1801-51 = "초과 사용한 탄환의 보고를 위해 서클 본부에도……."
1801-52 = "……."
1801-53 = "……정의를 위해서라면 어쩔 수 없지요. 그렇다고 생각합니다."
1801-54 = "그건 그렇지만……."
1801-55 = "어쩐지 츠루기, 이번엔 좀 더 상심한 기분이 들어서……."
1801-56 = "……흔히 있는 패턴 아닌가요?"
1801-57 = "그것도 그렇지만……."
1801-58 = "(띵동-) 응……?"
1801-59 = "왜 그러세요, 선배?"
1801-60 = "아아……. 티파티에서의 영상 메일……이네요."
1801-61 = "네? 티파티에서요?!"
1801-63 = "오늘 있었던 일은 잘 들었습니다. 정의실현부 여러분."
1801-64 = "구출 임무였는데, 인질로 잡혔던 우리 학생들까지 모조리 병원에 보내져버렸고……"
1801-65 = "심지어 그 중 몇몇은 츠루기 씨의 얼굴을 보고 외상 후 스트레스까지 얻었다고……."
1801-66 = "……."
1801-67 = "제가 생각을 좀 해봤는데요."
1801-68 = "어째서 정의실현부에는 이런 일들이 끊기지 않는가— 에 대해서요."
1801-69 = "역시 핵심은 교류…… 라고 생각해요."
1801-70 = "교류랄까…… 정확히는 상식과…… 사랑의…… 교류."
1801-71 = "정의실현부의 여러분들께 필요한 건 바로 그것. 즉, 다른 동아리와의 교류가 좀 더 필요하다고 생각합니다."
1801-72 = "그래서, 제가 플랜을 세워봤어요. 내일 하루 동안 정의실현부는 휴무합니다."
1801-73 = "대신 우리 학원의 다른 동아리나 부활동에 참가해보시는 거예요."
1801-74 = "저의 플랜은 완벽하니까, 아마 다른 사람들과의…… 상식과 사랑을 좀 더 이해하는 장이 될 거라고 생각해요."
1801-75 = "후후 어때요? 기대되죠?"
1801-76 = "그럼, 모두 파이팅~☆"
1801-78 = "아, 참고로 이거 강제예요. 예외는 없어요."
1801-80 = "……."
1801-81 = "……이게 무슨 뜻인가요, 선배? 다른 동아리 참관……?"
1801-82 = "하아. 이건 또 무슨……."
