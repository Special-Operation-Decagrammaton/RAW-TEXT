[translation]
10023055-2 = "제법이군요. 이름 모를 분."
10023055-3 = "네. 도둑님. 이번에는 제대로 말했습니다. 이것으로 기분이 상하지는 않으시겠지요."
10023055-4 = "후후…… 그런 식으로 나오시겠다, 이건가요?"
10023055-18 = "?! 이런 곳에 함정이……?"
10023055-26 = "다음부터는 발밑을 조금 더 세심하게 살피는 것이 좋겠어요."
10023055-30 = "?!"
10023055-31 = "그렇게 멋대로 내버려 둘 것 같아?"
10023055-32 = "올라오는 데에는 시간이 걸렸지만…… 우리도 그냥 두고 보고 있지는 않을 거예요!"
10023055-34 = "어머나, 귀여운 메이드들의 증원인가요?"
10023055-36 = "귀, 귀엽다고?! 에헤헤."
10023055-37 = "언니! 지금 헤벌쭉할 때야?!"
10023055-38 = "여기서 우리가 당신을 막을 거니까요!"
10023055-39 = "후후…… 용기는 가상하네요. 하지만 가능할까요?"
10023055-45 = "당신들은 첫 기습에서 끝을 내야 했어요."
10023055-46 = "당신들의 용기는 아름답지만, 아직 몸놀림은 미학적이지 않군요. 굼뜨고, 느려요."
10023055-48 = "우리는 그럴지도 모르지만……!"
10023055-50 = "당신을 상대하는 건 우리가 아니니까요!"
10023055-51 = "……?"
10023055-55 = "빛이여!"
10023055-60 = "큭……?!"
10023055-61 = "잘했어, 아리스!"
10023055-62 = "어…… 주위에 피해는 없지?"
10023055-63 = "네! 지금의 아리스는 명속성 단일 딜러! 하나의 목표만을 노리고 모든 화력을 집중합니다!"
10023055-65 = "……!"
10023055-66 = "아직은 움직일 수 있다는 거군요. 그렇다면……!"
10023055-75 = "……쏘겠어요……!"
10023055-76 = "윽?!"
10023055-82 = "지금이다! 붙잡아!"
10023055-83 = "응, 언니!"
10023055-91 = "우왓?!"
10023055-92 = "꺄악!"
10023055-93 = "어, 어떻게 된 거야?!"
10023055-94 = "저기, 봐. 천장이야!"
10023055-96 = "앞에서 했던 말을 정정하도록 하지요."
10023055-97 = "실력이 상당한 분들이군요. 조금 늦었지만, 당신들은 누구죠?"
10023055-99 = "저는 C&C소속 콜사인 제로포. 아스마 토키라고 합니다."
10023055-104 = "C&C라면 그……?"
10023055-105 = "C&C가 메이타로를 돕는다고요? 무엇 때문에?"
10023055-107 = "우린 의뢰를 받아서…… 그 보상으로…… 새 플라이스테이션을 사려고……."
10023055-108 = "……네?"
10023055-109 = "언니! 그런 생각을 하고 있었어?!"
10023055-110 = "아니! 그런 게 아니라……! 우리는 괴도를……"
10023055-111 = "도둑을 잡으려는 것뿐이에요!"
10023055-115 = "……"
10023055-116 = "[ns] \"너는 왜 예술품을 훔치려는 거지?\""
10023055-117 = "당신은……?"
10023055-118 = "아아, 그 얼굴. 그러고 보면 본 적이 있어요."
10023055-119 = "분명……. 샬레의 선생님, 이라고 했던가요?"
10023055-120 = "그 날. 저희 일곱 죄수가 교정국을 빠져나왔을 때, 새롭게 키보토스에 찾아왔다고 하는……."
10023055-121 = "과연…… 그런 것이로군요."
10023055-122 = "자애의 괴도! 한 번 들어온 이상, 쉽게는 빠져나가지 못한다!"
10023055-129 = "자, 잠깐만! 그렇게 무차별로 쏴 대면, 우리도……!"
10023055-130 = "아앗?!"
10023055-134 = "미도리?!"
10023055-137 = "(아……?)"
10023055-138 = "(나, 떨어지고 있어……?)"
10023055-140 = "후훗."
10023055-146 = "앗! 자애의 괴도가 미도리를 구했습니다!"
10023055-147 = "미도리, 괜찮아?!"
10023055-148 = "으, 응. 괜찮아. 그런데 왜 자애의 괴도가 나를……?"
10023055-149 = "(어째서……?)"
10023055-153 = "상황은 대강 이해했어요. 재미있어지겠네요."
10023055-154 = "한마디만 하죠. 표면에 너무 집중하면, 내면의 아름다움을 찾아내지 못한답니다."
10023055-155 = "오늘은 이만 물러나도록 하겠어요. 조만간 다시 만나게 되겠지만요."
10023055-159 = "도망갔어!"
10023055-160 = "뭔가 종이 같은 게 떨어져 있는데……"
10023055-161 = "예고장? <예고는 아직 유효합니다.> 라는데?"
10023055-162 = "헹, 엉망진창으로 당하고 도망간 주제에!"
10023055-163 = "이번엔 수수께끼가 없네…… 그렇다고 할까, 언제나 이런 예고장을 가지고 다니는 거야?"
10023055-167 = "여러분…… 이게 어떻게 된 일이죠?"
10023055-168 = "엑?! 그, 그게……!"
10023055-169 = "[s] \"사실은, 이 모든 것이 비밀 양동 작전 같은 것이었습니다.\""
10023055-170 = "선생님!"
10023055-171 = "흐음…… 설명을 부탁드려도 되겠습니까?"
10023055-173 = "과연…… 작전상의 이유로 다섯 번째 멤버는 조금 늦게 합류하기로 했고."
10023055-174 = "그 작전이 거의 성공할 뻔했다는 거군요."
10023055-175 = "[s] \"죄송합니다. 거의 잡기 직전까지 갔는데……\""
10023055-176 = "아닙니다, 아닙니다. 그 자애의 괴도를 몰아붙인 것만으로도 엄청난 성과입니다."
10023055-177 = "혹시 또 압니까? 괴도가 여러분에게 겁을 먹고 두 번 다시 나타나지 않을지도 모르지요."
10023055-178 = "으음…… 그건 또 어떨까 싶기는 한데요."
10023055-180 = "이봐요, 메이타로 씨. 이게 다 어떻게 된 겁니까?"
10023055-181 = "<자애의 괴도>라니, 그런 게 나타날 줄 알았으면 여기에 오지 않았을 텐데……"
10023055-182 = "자, 자. 여러분. 진정하십시오. 아무 문제 없을 겁니다."
10023055-183 = "보셨다시피, 저희는 자애의 괴도를 이미 훌륭하게 물리쳤습니다. 그렇지 않습니까?"
10023055-184 = "그도 그럴게, 이 저택의 경비를 맡고 있는 것은, 그 유명한 비밀 조직, C&C이니까요!"
10023055-186 = "C&C라고? 그 유명한 비밀 에이전트들의 조직……?"
10023055-187 = "그리고 보면 조금 전 괴도를 가볍게 퇴치한 것도 전혀 이상하지 않아."
10023055-189 = "다시 한번 감사드립니다. 여러분."
10023055-190 = "다만 파티는 이쯤에서 끝내는 편이 나을 것 같군요. 게스트분들을 숙소로 안내해 드려야겠습니다."
10023055-194 = "그러면 천천히…… 이후의 작전 계획을 세워주시기 바라겠습니다."
10023055-197 = "……(뭐, 뭐야, 엄청 노, 노려보고 있는데?!)"
10023055-198 = "……"
10023055-199 = "(조금 전부터 토키 씨……. 말 한마디 없이 바라보고만 있어요. 선생님……)"
10023055-200 = "[ns] \"저기, 토키, 일단 진정하는 게……\""
10023055-201 = "뭐, 뭐야! 그렇게 노려봐도 하나도 안 무섭거든?!"
10023055-202 = "오히려 우리가 도와줬으니까, 감사 인사라도 받고 싶은 심정이지만 말이지!"
10023055-207 = "……그렇군요."
10023055-208 = "감사했습니다. 게임개발부 여러분."
10023055-209 = "어, 어? 에엥?"
10023055-210 = "세상에……!"
10023055-214 = "아뇨, 도움을 받은 것은 사실이기도 하고. 인사드리는 것도 당연한 일이었습니다."
10023055-215 = "그, 그럼 왜 말없이 계속 노려 보고만 있던 건데!"
10023055-216 = "그건…… 그렇군요. 이럴 때는 어떻게 말을 꺼내야 하는지 익숙하지 않아서."
10023055-217 = "즉, 토키 씨는 무슨 말을 해야 할지 몰라서 그냥 보고만 있었다는 뜻……?"
10023055-218 = "그렇습니다. 먼저 이야기를 꺼내 주셔서 감사합니다. 모모이."
10023055-219 = "다만…… 조금, 상황이 복잡해진 것 같군요."
10023055-221 = "그렇군요. 토키 씨의 미션이란, <자애의 괴도>를 막는 것이었군요……"
10023055-222 = "그렇습니다. 또 다른 미션 역시 주어져 있기는 합니다만."
10023055-223 = "서, 설마 우리가 방해만 되었다거나 그런 식으로, 나중에 네루 선배에게 말할 거야?"
10023055-224 = "아뇨. 그럴 생각은 없습니다. 게임개발부 여러분은 방해는커녕 최선을 다해 주셨고."
10023055-225 = "그렇군요. 여기에서는 C&C와 게임개발부의 합동 작전…… 이라고 해 두도록 하지요."
10023055-226 = "정말 그런 걸로 괜찮나요?"
10023055-227 = "괜찮습니다. 선배들도 지금 안 계시고."
10023055-228 = "그런 문제야??"
10023055-230 = "예. 그런 문제입니다."
10023055-231 = "그러면, 아리스들과 토키는 동료인 거네요?"
10023055-232 = "……?"
10023055-233 = "아리스는 토키와 파티를 맺고 싶습니다. 그래서 토키와 함께, 이 퀘스트를 해결하고 싶습니다!"
10023055-234 = "예? 그, 그건……"
10023055-235 = "역시, 안 되는 건가요……?"
10023055-236 = "아뇨, 아닙니다. ……그러고 보니 저번에 거절하기도 했으니까. ……네."
10023055-237 = "와아! 그러면 이제부터 아리스는 토키의 동료입니다! 게임개발부도요!"
10023055-238 = "감사합니다. 그렇게 말씀해 주셔서."
10023055-239 = "뽜밤뽜밤! 파티 멤버가 늘어났습니다!"
10023055-244 = "꺅?!"
10023055-245 = "저, 그렇게 갑자기 끌어안으시면……?"
10023055-249 = "……(스윽, 스윽.)"
10023055-250 = "(쓰다듬기 좋은 높이로군요. 어딘가…… 마음이 편안해집니다.)"
10023055-255 = "……괜찮은 걸까, 언니?"
10023055-256 = "뭐…… 아리스니까. 말이지."
10023055-258 = "잘 됐네, 아리스 쨩. 토키 씨도……"
10023055-260 = "(그렇게, 토키와 게임개발부는 동료가 되었다.)"
10023055-261 = "(해피 엔딩, 해피 엔딩……)"
10023055-263 = "(이 아니고!)"
