[translation]
10011005-1 = "프롤로그;닌자, 습격해오다!"
10011005-5 = "샬레의 휴게실"
10011005-8 = "(샬레의 오전 업무를 예정보다 일찍 끝내고, 잠시 휴게실에 들러 쉬고 있을 때였다.)"
10011005-13 = "[ns] \"어라? 왜 불이…….\""
10011005-25 = "후후, 무사히 잠입 완료!"
10011005-27 = "저, 정말로 저희…… 자, 잠입해버린 거네요. 말로만 듣던 그, 그 샤, 샬레에……!"
10011005-29 = "닌자의 철칙 그 첫 번째! <닌자란! 자고로 언제 어디서든 망설이지 않고 도전해야 하는 법!>"
10011005-30 = "이것으로 샬레도 손에 넣는다!"
10011005-32 = "앗, 과연……!"
10011005-34 = "닌자라면 자고로 앞뒤 재지 않고 일단 저지르고 보는 것도 중요하다……"
10011005-36 = "부장님의 말씀! 잊지 않도록 메, 메모할게요!"
10011005-38 = "저기…… 그거 칭찬 맞지……?"
10011005-40 = "하여간 바로 가자! 샤샤샥-! 닌자 이동이닷!"
10011005-42 = "네, 넷! 샤, 샤샤샥, 이, 이에요오……!"
10011005-46 = "[ns] \"저기, 너희들…….\""
10011005-51 = "………어?"
10011005-53 = "네엣………?"
10011005-54 = "[s] \"너흰 누구야……?\""
10011005-58 = "우냐앗! 당황하지 마! 츠쿠요! 내가 몇 번이나 말했잖아!"
10011005-59 = "닌자의 철칙! 그 두 번째!"
10011005-60 = "앗, 네, 넵!"
10011005-61 = "<닌자란! 자고로 어떤 궁지에 몰리더라도, 어떠한 역경에 부딪치더라도 포기하지 않는 법!>"
10011005-62 = "바로 여기서 츠쿠요와 나! 둘이서 동시에 <앰부쉬>야!"
10011005-64 = "……네? 여, 여……. 여기서 말인가요오?!"
10011005-65 = "간닷!"
10011005-66 = "[s] \"아니, 자, 잠깐, 기다ㄹ-?!\""
10011005-73 = "앗, 부장님. 전등이……."
10011005-74 = "응?!"
10011005-78 = "이즈나……! 등장! 이에요!"
10011005-79 = "앗, 이즈나 쨩!"
10011005-80 = "저 이즈나! 주군의 목소리를 듣고, 지금 막 나타났습니다!"
10011005-81 = "주, 주구운……?! 설마 주군께서는 지금 위기일발?!"
10011005-82 = "아, 안 돼요! 그건 안 되는 일이에요!"
10011005-83 = "이즈나! 가세하겠습니다!"
10011005-84 = "잠깐, 이즈나앗-! 이건 계획이랑 다르잖……."
10011005-85 = "에잇-! 닌닌-!"
10011005-86 = "[s] \"우, 우와아앗?!\""
10011005-92 = "(약 10분 정도의 실랑이 끝에 간신히, 덮쳐온 세 명에게서 빠져나올 수 있었다.)"
10011005-96 = "샬레의 사무실"
10011005-97 = "우갸악! 이즈나! 갑자기 덮쳐오면 어떡해! 작전이랑 다르잖아!"
10011005-98 = "우으……. 하지만 부장!"
10011005-99 = "주군이 도움을 요청하는 목소리를 들은 순간, 저 이즈나! 저도 모르게 발이 움직여 버렸어요!"
10011005-100 = "네……! 그야말로 닌자처럼!"
10011005-101 = "아니, 물론 그 마음을 모르는 건 아니지만!"
10011005-102 = "그, 그래도, 이, 이즈나 쨩이 재빠르게 달려왔을 때의 그, 모, 모습……."
10011005-103 = "머, 멋졌어요. 이, 이즈나 쨔앙."
10011005-104 = "에헤헷! 칭찬, 고맙습니다. 츠쿠요 공!"
10011005-105 = "에, 에헤헤……."
10011005-106 = "[s] \"그러니까, 이즈나의 지인…인가? 어째서 여기에……?\""
10011005-107 = "응?"
10011005-108 = "네?! 아, 저, 저, 저기, 그러니까. 저, 저, 저희는……."
10011005-112 = "앗, 주, 주군……?! 설마……!"
10011005-113 = "[s] \"설마?\""
10011005-114 = "이즈나와 함께 했던 날들을 잊어버리신 건가요?!"
10011005-115 = "혹시 방금 전의 충격으로 기억을 전부 잃어버렸다는 전개인가요?!"
10011005-116 = "[s] \"그런 게 아니라, 이즈나는 물론 기억을…….\""
10011005-117 = "그러고 보면, 이즈나……. 닌자 드라마에서 본 적 있었어요! 주군을 지키기 위해 몸을 던진 닌자가 습격을 받아……."
10011005-118 = "끝내 기억상실증에 걸려 버리는, 눈물 없이는 볼 수 없는 전개를! 그런데 여기선 주군이?!"
10011005-119 = "[s] \"이즈나, 잠깐, 좀 진정…….\""
10011005-120 = "주군…… 전부 잊어버리셨나요! 이즈나가 주군과 처음 만났던 그 순간을……! 이즈나의 꿈을 응원해준다고 말했던 그때를……!"
10011005-121 = "그 뒤로도 갖은 수라장 끝에 마침내 냥텐마루라고 부르는 천하의 대악당을……."
10011005-122 = "세계를 지배할 야욕을 품었던 그 대마왕을 이즈나, 그리고 동료들과 함께 쓰러트렸던 그 추억까지 전부 잊어버리시고야 만 건가요?!"
10011005-123 = "[s] \"아니, 그 정도로 엄청난 이벤트를 겪었던 기억은 없는데?!\""
10011005-124 = "이즈나, 슬프지만. 그래도 괜찮아요!"
10011005-125 = "설사 주군께서 전부 잊어버리셨더라도 추억은, 다시 쌓아가면 되는 거니까요!"
10011005-126 = "이즈나는 언제나 주군의 닌자! 주군은…… 언제나 이즈나의 주군이니까요! 닌닌!"
10011005-127 = "[s1] \"이즈나, 고마운 말이지만. 그런 심각한 설정이 아니니까!\"\n[s2] \"그냥 다른 두 사람과 초면이라 물어본 거니까!\""
10011005-136 = "후후후. 과연, 우리가 누군지 궁금하다. 이거지."
10011005-137 = "흠흠……!"
10011005-138 = "도-모, 처음 뵙겠습니다. 선생=공. 소생은 미치루라고 하오."
10011005-139 = "아, 그, 처, 처, 처음 뵙겠습니다……! 츠, 츠쿠요라고, 하, 합니다아……."
10011005-140 = "그리고 이즈나는 이즈나예요! 주군!"
10011005-141 = "[s] \"아, 안녕……이 아니라……. 선생, 공?\""
10011005-142 = "우햐햣! 무엇 숨기랴! 이 자리에 모인 우리 3인방! 내 소개해 드리 오리다!"
10011005-143 = "이즈나! 츠쿠요!"
10011005-144 = "네! 부장!"
10011005-145 = "네, 넷! 부, 부, 부장님……!"
10011005-146 = "닌자 하이퍼 합체다!"
10011005-147 = "[s] \"닌자, 뭐……?\""
10011005-153 = "닌자란 무엇인가! 나아가 닌자가 사용하는 인법이란 무엇인가!"
10011005-156 = "무, 무엇인가!"
10011005-160 = "그 본질을 연구하고 탐구하고, 또한 궁구하는……."
10011005-161 = "무릇 닌자의 매력을 널리 알리기 위해 활동하는, 귀엽고 아리따운 소녀 우리 삼인방!"
10011005-162 = "삼인방이에요~!"
10011005-166 = "우는 아이도 듣고 나면 방긋 웃게 된다는,"
10011005-167 = "백귀야행 학원-! 최강의 닌자 동아리!"
10011005-168 = "[s] \"……?\""
10011005-172 = "이름하여어어!! <인법연구부>라 이름을 대겠소이다!"
10011005-173 = "네! 대겠소이다~♪"
10011005-174 = "대, 대겠, 대, 대겠, 소이다아……."
10011005-178 = "그리고 내가 바로 그 인법연구부의 부장! 치도리 미치루란 말씀!"
10011005-179 = "[s] \"으음, 그래서 인법연구부가 여긴 어쩐 일이야?\""
10011005-180 = "크흠. 흠흠. 크흠! 흠흠흠흠!!!"
10011005-181 = "선생 공은 우리를 보고 이렇게 생각했을 거야."
10011005-182 = "아마 '이 소녀들! 닌자! 닌자다! 너무나도 굉장하고 멋진! 미소녀 닌자가 나타났다!' 라고."
10011005-183 = "[s] \"아니, 그런 건 딱히…….\""
10011005-184 = "그럼 당연히 이런 생각도 했을 거야."
10011005-185 = "'아아! 이 소녀들을 응원하고 싶다! 널따란 날개를 펼치고, 가슴에 품은 풍운의 꿈을 펼치도록 응원하고 싶구나!'……라고."
10011005-186 = "응응. 이해해. 나라도 완전 그랬을 테니까. 그래서 준비했어!"
10011005-191 = "[ns] \"<정식 동아리 인가 추천서>……?\""
10011005-192 = "그러니 자! 여기에! 사인을 부탁해!"
10011005-193 = "[s3] \"정식 동아리 인가를 받기 위해 찾아온 거야……?\"\n[s4] \"그보다 인법연구부는 정식 동아리가 아니었던 거야?\""
10011005-196 = "네? 부장?! 그런 계획이었나요?! 이즈나 몰랐어요!"
10011005-197 = "앗, 저, 저도…… 어, 어디까지나 서, 선생님께 안부 인사를 하러 온 줄로만……."
10011005-198 = "무, 물론 그것도 있지만……!"
10011005-199 = "……흠흠! 선생 공의 소문은 들었어. 뭐든 해결할 수 있는 엄청난 파워가 있다고!"
10011005-200 = "그러니! 도와주라! 선생 공이 도와준다면 정식 동아리가 되는 것쯤이야……!"
10011005-201 = "[s] \"안 돼. 그럴 수 없어.\""
10011005-202 = "뭣……?!"
10011005-203 = "네, 네엣?"
10011005-204 = "캥……?!"
10011005-205 = "뭐, 뭐냐고! 설마…… 선생 공…… 선생 공도……."
10011005-206 = "<닌자를 연구하는 동아리라니, 그런 웃기지도 않는 동아리 활동은 인정해줄 수 없어.> 같은 말을 하려고……!"
10011005-207 = "[s] \"정식 동아리가 되기 위해선 따로 절차가 있는 거지?\""
10011005-208 = "응? 아, 그, 그건 그런데…… 그게, 그러니까………"
10011005-209 = "하, 하지만! 카호는 이런 건 전혀 받아주지 않는단 말이야!"
10011005-210 = "엄청 깐깐하고……! 또 그래! 깐깐하거든!"
10011005-211 = "……?"
10011005-212 = "카, 카호 씨가 그렇게 깐깐한 분……이셨던가요……?"
10011005-213 = "응? 그러니까. 이 부분을 선생 공이 어떻게 좀……"
10011005-214 = "[s] \"그러니까 못 해준대도…….\""
10011005-219 = "[ns] \"어라…… 손님?\""
10011005-227 = "처음 뵙겠습니다. 선생님. 저는 음양부 소속의 부부장, 쿠와카미 카호."
10011005-228 = "음양부로서 샬레에게 정식으로 의뢰할 건이 있어 찾아왔습니다만."
10011005-229 = "잠시 함께 가주실 수 있을까요?"
10011005-230 = "우왓! 호랑이도 제 말하면 나타난다더니……!"
10011005-231 = "……어라, 여러분은……"
10011005-232 = "[s] \"어, 음양부의 정식 의뢰……?\""
