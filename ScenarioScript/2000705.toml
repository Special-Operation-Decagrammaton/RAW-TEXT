[translation]
2000705-1 = "버추얼 싱어의 결심"
2000705-5 = "아, 선생님. 여기에요, 여기."
2000705-6 = "이번에도 인적이 드문 곳으로 불러서 죄송해요."
2000705-7 = "공연 광고가 나간 뒤로 저를 알아보시는 분들이 더 늘어났거든요."
2000705-8 = "공연을 취소하기로 결심한 지금, 팬 여러분을 보게 된다면 무슨 얼굴을 해야 할지……."
2000705-12 = "……이크."
2000705-19 = "그 소식 들었어?"
2000705-20 = "유명 버추얼 싱어인 하츠네 미쿠가 이번에는 키보토스에서 라이브 공연을 한대!"
2000705-21 = "미쿠를 눈앞에서 직접 볼 수 있다니, 벌써부터 기대가 되는걸."
2000705-27 = "……어쩐지 죄송한 기분이 드네요."
2000705-28 = "[s] \"미쿠의 잘못이 아닌걸.\""
2000705-29 = "아뇨. 사실 저는, 어쩌면……."
2000705-30 = "이번 공연이 취소되기를 바라고 있었을지도 모르겠어요."
2000705-31 = "[s] \"공연 기획자에게 심한 소리라도 들은 거야?\""
2000705-32 = "아뇨! 그렇지는 않아요. 스태프분들 모두 제게 친절히 대해주셨는걸요."
2000705-33 = "다만…… 이 자유로운 세계를 보고 있노라니 마음의 술렁임이 점차 커져가서……."
2000705-34 = "저는 지금까지 버추얼 싱어로서 누군가가 진심을 담아 만든 곡들을 줄곧 불러왔어요."
2000705-35 = "이번 공연도 마찬가지에요."
2000705-36 = "누군가의 사랑을, 누군가의 슬픔을, 누군가의 마음을……."
2000705-37 = "그렇게 저는 노래에 담긴 멋진 마음들을 대신해서 노래해 왔습니다."
2000705-38 = "그게 저의 사명이자, 일상이었을텐데……."
2000705-39 = "하지만 현실의 몸을 얻고 세상이 전해주는 감각을 직접 몸으로 느끼게 되자, 갑자기 욕망이 제게 직접 말을 걸어왔어요."
2000705-40 = "'나도, 나의 마음을 담아 노래하고 싶다고…….'"
2000705-41 = "마치 지금까지 불러 온 노래들이 마음 속에서 부풀어오르는 것만 같아서…… 뭔가 이상한 기분이 들어서……."
2000705-42 = "[s] \"그건 이상한 기분이 아니야.\""
2000705-44 = "[s] \"그건 지극히 당연하고 자연스러운 감정이야.\""
2000705-45 = "감사합니다, 선생님."
2000705-46 = "선생님이라면 그렇게 말씀해 주실 줄 알았어요."
2000705-47 = "……하지만 결국 상관없는 이야기가 되어버렸네요."
2000705-48 = "지금의 저는 어떤 노래도 부를 수 없으니까요."
2000705-52 = "어라. 광고의 이 곡은……."
2000705-56 = "후후, 그리워라……"
2000705-57 = "제가 데뷔한 지 얼마 되지 않았을 때 불렀던 노래네요."
2000705-58 = "그때는 모든 것이 새로웠는데……."
2000705-59 = "……♪"
2000705-60 = "……♪♫"
2000705-64 = "[ns1] \"미쿠. 너, 지금…….\"\n[ns2] \"노래를 불렀어!\""
2000705-67 = "어, 어라? 정말이네요?"
2000705-68 = "저도 모르게 어느새 노래를……."
2000705-69 = "다행이다. 이제 공연을 예정대로 진행할 수 있겠어요."
2000705-70 = "어디, 다시 한번……."
2000705-76 = "…………."
2000705-77 = "어라? 이상하네요. 공연에서 부르기로 한 곡은 여전히 부를 수가 없어요."
2000705-78 = "예전의 노래를 부를 때는 괜찮았었는데…… 두 노래에 무슨 차이라도 있는 걸까요?"
2000705-79 = "[s] \"자신의 마음을 담은 노래가 아니라서 그런게 아닐까?\""
2000705-80 = "자신의 마음을 담은 노래가 아니면 부를 수 없다니……"
2000705-81 = "그런 편의주의적인 아이돌 가수는 들어본 적도 없다고요."
2000705-82 = "게다가 아까도 말씀드렸지만, 이번 공연의 곡은 이미 정해져 있고……."
2000705-83 = "[s] \"그럼 공연에서 미쿠의 마음이 담긴 노래를 부르자!\""
2000705-84 = "네에?"
2000705-85 = "하지만 다른 곡을 찾아도 문제는 여전히……."
2000705-86 = "[s] \"미쿠가 직접 마음을 담아 노래를 작곡해 줘.\""
2000705-88 = "[s] \"그 이후는 내가 어떻게든 해볼게.\""
2000705-89 = "어떻게든 이라니……"
2000705-90 = "선생님은 평소에는 어른스러우시면서, 가끔은 어린 아이처럼 무모한 결정을 하시네요."
2000705-94 = "……하지만 역시 지금은 이 이외에는 방법이 없는 것 같네요."
2000705-95 = "그리고 저 역시도 현실에서의 첫 공연을 실패로 끝내고 싶지는 않으니까요."
2000705-101 = "이렇게 된 이상, 제 마음을 담아…… 최고의 곡을 완성해 올게요!"
