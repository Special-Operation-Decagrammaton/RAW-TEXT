[translation]
10056070-1 = "第7話;ブルーホール"
10056070-2 = "（波をかき分けながら、船は進み続けた）"
10056070-6 = "先生、着いた。"
10056070-7 = "ここが地図に書いてあったポイント。"
10056070-13 = "（船が止まったので、外に出てみた）"
10056070-14 = "（大海原の中、そこだけ別のインクを垂らしたように濃い青色で染まっていた）"
10056070-15 = "[ns] \"……神秘的だね。\""
10056070-18 = "はい……見る分には。"
10056070-19 = "ブルーホールは洞窟や鍾乳洞が水没して形成されるので、#n奥に入り込んでしまうと抜け出せなくなることもあるんです。"
10056070-20 = "だからこそ挑戦しがいがあるのですが、それだけ危険だとも言えます。"
10056070-21 = "なので、普段よりも準備を徹底しないと……！"
10056070-22 = "いつも細かいのに、それ以上になんてできるの？"
10056070-23 = "も、もちろん！"
10056070-24 = "2回チェックするところを3回、3回を4回にすれば――"
10056070-25 = "そしたら日が暮れちゃう……。"
10056070-26 = "どっちから先に潜るか決めようか。"
10056070-27 = "はい！はいはいはい！#n私とサユリが先に行く！"
10056070-28 = "マキナが？"
10056070-29 = "うん。"
10056070-30 = "今回のことは私の責任でもあるからさ……。"
10056070-31 = "で、でも、どんな危険があるかも分からない場所だし、先に行くなら、#n部長の私のほうが……。"
10056070-32 = "危ないのは、誰が行っても同じじゃん？"
10056070-33 = "だいじょうぶ、心配ないよ。危なかったら急いで上がってくるから。"
10056070-37 = "サユリ・イズ・ファスト～"
10056070-38 = "ふ、浮上する時はゆっくり時間をかけてね！？"
10056070-40 = "（その後、ココロの必死の頼みを聞きながら、マキナとサユリが海に入っていった）"
10056070-44 = "（それから1時間ほど過ぎた頃）"
10056070-47 = "ふぅ……。"
10056070-52 = "おかえり。思ったより戻りが早いね。"
10056070-53 = "な、何か問題でもあった？"
10056070-54 = "ううん、ダイビングは問題ないよ。"
10056070-55 = "クジラがいた～"
10056070-56 = "[s] \"クジラ？\""
10056070-57 = "ザトウクジラの群れが押し寄せてきて、それ以上は潜れなかったんだ。#n水深60メートルくらいかな。"
10056070-58 = "他じゃあんなの見たことないのに……どうしたんだろ？"
10056070-59 = "もっと深い場所に捕食生物がいるのかもね。#n前にサメを見つけた時がそうだったみたいに。"
10056070-60 = "そんな危険な生物がいるようには見えないけどね。"
10056070-61 = "ルスカだ……！"
10056070-62 = "だからそれは[ruby=UMA]未確認生物[/ruby]だってば。"
10056070-67 = "まさか……あの時に聞いたお宝って……。"
10056070-68 = "……部長？"
10056070-72 = "な、なんでもないよ。"
10056070-73 = "とにかくお疲れ様。次は私とコトネが行くね。"
10056070-74 = "了解。"
10056070-80 = "あ、ウミネコ。"
10056070-81 = "……そうだね。"
10056070-86 = "今度はアヤトビウオ～"
10056070-87 = "……ほんとだ。"
10056070-91 = "……。"
10056070-92 = "[s] \"何か言いたいことでもあるの？\""
10056070-93 = "えっ？あ、ううん。"
10056070-94 = "ただ待ってるだけだと、なんか持て余しちゃって。"
10056070-99 = "……あのさ。"
10056070-100 = "シャーレの先生って、超法規的権限を持ってるんだよね？"
10056070-101 = "生徒に対して自由に命令とか指示を出せるんじゃないの？"
10056070-102 = "[s1] \"た……ぶん？\"\n[s2] \"制度上はそうかも？\""
10056070-105 = "じゃあ、欲しいものは何でも手に入る？"
10056070-106 = "生徒から無理やり10万円もらうとか。"
10056070-107 = "[s3] \"そんなことはないよ……。\"\n[s4] \"できるとしても、やりたくはないな……。\""
10056070-110 = "どうしてそんな権限を持ってるのに、生徒の話を聞いてるだけなの？"
10056070-111 = "[s] \"例えば？\""
10056070-112 = "だって今回のことも、一言で解決できるでしょ？"
10056070-113 = "ダイビングを辞めろって私たちに命令すれば済むのに。"
10056070-114 = "[s] \"マキナはダイビングを辞めたいの？\""
10056070-115 = "そんなわけない！"
10056070-116 = "でも、アイランドは私たちのせいで困ってるし。"
10056070-117 = "先生にとっては、あっちも「生徒」だよね？"
10056070-118 = "[s] \"そうだね。\""
10056070-119 = "生徒のためって言うのに、生徒が解決するのを待ってるだけな気がするんだ。"
10056070-120 = "行き詰まってるのに足掻きつづける生徒を見てるだけって――"
10056070-121 = "もどかしくない？"
10056070-122 = "[s] \"そういう時もあるよ。\""
10056070-123 = "先生が代わりに結論を出したらダメなの？"
10056070-124 = "[s5] \"ダメだよ。\"\n[s6] \"私にはそんな権限はないから。\""
10056070-130 = "なんで？全生徒に命令して指示する権限があるんでしょ？"
10056070-131 = "[s7] \"それはあくまで「指示」できるだけ。\"\n[s8] \"指示を受け入れるのは生徒自身だから。\""
10056070-134 = "んー……？#nなんか煙に巻かれたような……。"
10056070-135 = "怪しい大人の香りが……。"
10056070-136 = "マキナ、マキナ。"
10056070-137 = "どしたん？部長たち上がってきた？"
10056070-138 = "違う。水平線のほうから、誰かがこっちに来てる。"
10056070-139 = "この辺は航路じゃないのに？#nトライデントのパトロールにしては沖合過ぎるし……。"
10056070-140 = "……あの旗、知ってる。"
10056070-144 = "あれって――"
10056070-145 = "[ruby=ちょうすい]潮水の[/ruby][ruby=こうりゅう]蛟龍！[/ruby]？"
10056070-146 = "[s] \"たしか、問題の生徒だっけ。\""
10056070-147 = "問題どころじゃない！"
10056070-148 = "潮水の蛟龍はオデュッセイアで……いや、キヴォトスで最凶の海賊集団の頭なんだよ！"
10056070-149 = "先生、逃げ――"
10056070-150 = "いや、逃げ場ないね、これ。"
10056070-151 = "とりあえず隠れよう！#nサユリ、海賊が出たって部長に連絡して！"
10056070-152 = "メーデー、メーデー！"
10056070-159 = "……[USERNAME]先生！"
10056070-160 = "くっ、いつの間に……。"
10056070-161 = "もうかなり接近されてるね。ボートで戻るのは難しいかな。"
10056070-162 = "部長、どうする？"
10056070-163 = "まずはバディチェックから。問題ない？"
10056070-164 = "問題なし。"
10056070-165 = "サユリ。マキナは「潮水の蛟龍」って言ってたんだよね？"
10056070-166 = "うん。サユリも旗を見た。"
10056070-167 = "いつの間にあんな艦隊を確保したのかは知らないけど……#n喫水が浅いから、装備はそんなに積んでないと思う。"
10056070-168 = "もう一度潜って位置を――"
10056070-169 = "下手な真似をするより、諦めるほうが身のためだぞ。"
10056070-170 = "お主らの相棒と[USERNAME]先生はすでに余の手中にある。"
10056070-174 = "いつの間に……。"
10056070-177 = "ごめん、部長……。"
10056070-178 = "部長たちが上がってくるまで時間稼ぎしようと思ったんだけど……。"
10056070-179 = "先生を守り切れなくて……。"
10056070-180 = "[s9] \"ごめん、油断してた……。\"\n[s10] \"話が通じる相手じゃないね……。\""
10056070-183 = "新しい臣下を迎えると聞いたが、まさかシャーレの先生まで含まれているとは。"
10056070-184 = "白蛤を開けたら、思いがけず真珠が出てきた気分だな。"
10056070-190 = "まずは余とじっくり話し合わぬか？"
10056070-191 = "[ruby=とうみ]渡海[/ruby]ココロ。"
