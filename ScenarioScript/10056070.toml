[translation]
10056070-1 = "제7화;블루홀"
10056070-2 = "(블루홀을 향한 긴 항해가 끝나갈 무렵……)"
10056070-6 = "선생님, 도착했어."
10056070-7 = "여기가 보물 지도에 표시된 장소야."
10056070-13 = "(배가 정박하고, 선수 밖으로 나가 밖을 바라보니 블루홀의 풍경이 눈 앞에 펼쳐졌다.)"
10056070-14 = "(수면 한 가운데 위치한 블루홀은 그 이름처럼 바다에 푸른 잉크를 떨어트린 것처럼 짙푸른 빛깔로 물들어 있었다.)"
10056070-15 = "[ns] \"……정말 신비로운 풍경이네.\""
10056070-18 = "네…… 정말 아름다운 풍경이지만요."
10056070-19 = "블루홀은 석회 동굴과 같은 원리로 생성된 지형이라, 안에 들어가면 길을 잃고 빠져나오지 못할 수도 있어요."
10056070-20 = "그래서 다이버들에게는 도전의 대상이기도 하지만, 해난 사고가 자주 일어나는 위험한 다이빙 포인트이기도 해요."
10056070-21 = "그런 만큼…… 더 철저히 안전 준비를 하지 않으면……!"
10056070-22 = "코코로 부장이 평소에 하는 것 이상으로 더 철저히 준비를 할 수 있는 거야?"
10056070-23 = "무, 물론이지!"
10056070-24 = "두 번 봐야 하는 걸 세 번 보고, 세 번 볼 것을 네 번 보면서 계속 체크하면—"
10056070-25 = "그러다 하루가 다 저물겠어~"
10056070-26 = "우선은 누가 먼저 들어갈지 부터 정하자."
10056070-27 = "나, 나, 나, 나, 나!#n나랑 사유리가 먼저 들어갈게!"
10056070-28 = "마키나가 먼저?"
10056070-29 = "응."
10056070-30 = "이번 일은 내 책임도 있으니까……"
10056070-31 = "하, 하지만 어떤 위험이 있을지 알 수 없는 장소이니, 여기선 역시 부장인 내가 먼저 들어가는 편이……"
10056070-32 = "위험한 건 부장이든 누구든 마찬가지 잖아?"
10056070-33 = "걱정 마. 위험한 일이 있으면 바로 빠르게 물 밖으로 도망칠 테니까."
10056070-37 = "아이 엠 패스트~"
10056070-38 = "무, 물 밖으로 나올 때는 천천히 시간을 들여서 나와야 하거든?!"
10056070-40 = "(이후, 코코로의 신신당부를 받아가며 마키나와 사유리가 물 속으로 들어가는 것을 지켜보았다.)"
10056070-44 = "(그리고 그로부터 약 한 시간 정도 지났을 때……)"
10056070-47 = "후우……"
10056070-52 = "생각보다 일찍 올라왔네."
10056070-53 = "무, 무슨 문제라도 있었어?"
10056070-54 = "아니, 다이빙 자체는 큰 문제가 없었는데……"
10056070-55 = "고래가 있어~"
10056070-56 = "[s] \"고래?\""
10056070-57 = "응. 한 60m 정도 내려갔을 때 한 무리의 혹등고래가 몰려와서 우리가 더 내려가는 걸 방해하더라고."
10056070-58 = "다른 곳에서는 이런 행동을 보인 적이 었었는데…… 왜 그러는 걸까?"
10056070-59 = "뭔가 더 깊은 곳에 포식 생물이라도 있는 건가? 가끔 상어 떼를 발견하면 그러잖아."
10056070-60 = "블루홀의 수심 100m 지점에 그렇게 위험한 생물이 살고 있을 것 같지는 않은데."
10056070-61 = "루스카다……!"
10056070-62 = "그러니까 그건 도시 전설이라니까."
10056070-67 = "……설마. 그 때 말한 보물이라는 게……"
10056070-68 = "……부장?"
10056070-72 = "아, 아니야."
10056070-73 = "여하튼 수고 많았어. 이어서 이번에는 나와 코토네가 내려갈게."
10056070-74 = "오케이~"
10056070-80 = "아, 괭이갈매기다."
10056070-81 = "……그러게."
10056070-86 = "이번에는 새날치야~"
10056070-87 = "……진짜네."
10056070-91 = "………."
10056070-92 = "[s] \"뭔가 하고 싶은 말이라도 있어?\""
10056070-93 = "아, 아니!"
10056070-94 = "그냥 두 사람이 언제 올라올지 기다리다 보니 심심해서."
10056070-99 = "……저기."
10056070-100 = "샬레의 선생님이라는 건 총학생회장에 준하는 초법적인 권한을 갖고 있는 거지?"
10056070-101 = "그럼 원한다면 학생들에게 마음대로 명령하고, 지시할 수 있는 거 아냐?"
10056070-102 = "[s1] \"아…… 마도?\"\n[s2] \"해본 적은 없지만 그렇지 않을까?\""
10056070-105 = "……그럼 원하는 것도 뭐든지 가질 수 있는 거야?"
10056070-106 = "아무 학생에게나 10만엔만 빌려달라고 하면 무조건 빌려줘야 해?"
10056070-107 = "[s3] \"그건 아닐 거야……\"\n[s4] \"가능하더라도 그런 말은 하고 싶지 않아……\""
10056070-110 = "그런데, 왜 그런 권한을 갖고 있으면서 학생들의 이야기를 듣고만 있는 거야?"
10056070-111 = "[s] \"예를 들면?\""
10056070-112 = "생각대로 해결되지 않는 문제라도, 선생님이라면 한 마디로 해결할 수 있잖아."
10056070-113 = "다이빙부의 문제도…… 선생님이 우리에게 다이빙을 그만두라고 명령하면 바로 해결되었을 텐데."
10056070-114 = "[s] \"응? 혹시 마키나는 다이빙을 그만두고 싶어?\""
10056070-115 = "그건 아니지만……!"
10056070-116 = "아일랜드는 우리 때문에 곤란해 했잖아."
10056070-117 = "선생님 입장에서는 그 쪽도 학생이잖아?"
10056070-118 = "[s] \"학생이지.\""
10056070-119 = "그런데 선생님은 학생을 위한다면서도 학생들이 서로 갈등하고 싸우는 데도 쉬이 결단을 내리지 않고 계속 기다리는 것만 같아서."
10056070-120 = "뭔가 답이 없는 문제를 되풀이하며 억지를 부리는 학생을 보면……"
10056070-121 = "답답하지 않아?"
10056070-122 = "[s] \"답답할 때도 있지.\""
10056070-123 = "그럼 선생님이 대신 결론을 내려주면 안 돼?"
10056070-124 = "[s5] \"안 돼.\"\n[s6] \"나는 그럴 권한이 없거든.\""
10056070-130 = "왜? 아까는 모든 학생에게 명령하고, 지시할 권한이 있다며."
10056070-131 = "[s7] \"그건 어디까지나 지시를 할 수 있을 뿐이지.\"\n[s8] \"지시를 받아들이고 수용하는 건 학생 본인이니까.\""
10056070-134 = "으음…… 뭔가 궤변론자처럼 보이는데."
10056070-135 = "이상한 어른의 향기가……"
10056070-136 = "마키나, 마키나."
10056070-137 = "왜? 부장이랑 부부장이 올라오는 것처럼 보여?"
10056070-138 = "아니, 수평선 쪽에서 누군가가 이쪽으로 오고 있어."
10056070-139 = "이 주변은 항로도 아닌데? 트라이던트가 순찰을 나오기엔 꽤 먼 거리인데……"
10056070-140 = "……익숙한 깃발."
10056070-144 = "저건……"
10056070-145 = "<조수의 교룡>이잖아?!"
10056070-146 = "[s] \"조수의 교룡이라면…… 그 문제아 학생?\""
10056070-147 = "문제아라는 말 만으로는 부족해!"
10056070-148 = "조수의 교룡은 오디세이아에서…… 아니, 키보토스에서 가장 악랄한 해적 집단의 리더라고!"
10056070-149 = "선생님, 도망—"
10056070-150 = "아니, 도망칠 곳도 없나."
10056070-151 = "일단은 숨어! 그리고 사유리, 바로 부장에게 연락해. 해적이 나타났다고!"
10056070-152 = "메이데이, 메이데이~"
10056070-159 = "……선생님!"
10056070-160 = "젠장, 어느 틈에……"
10056070-161 = "이미 상대가 너무 가까이 접근해서 보트로 돌아가는 건 어려울 것 같아."
10056070-162 = "부장, 어쩌지?"
10056070-163 = "일단은 버디 체크부터…… 다들 문제 없지?"
10056070-164 = "올 그린. 문제없어."
10056070-165 = "사유리. 아까 마키나가 분명히 상대가 '조수의 교룡' 이라고 했었어?"
10056070-166 = "응. 나도 확실히 깃발을 확인했어."
10056070-167 = "어느 틈에 이 정도의 선단을 확보했는지는 모르겠지만…… 흘수가 낮은 것으로 보아 장비를 많이 싣고 있는 건 아닌 것 같아."
10056070-168 = "일단은 다시 물 속으로 잠수해서 교룡의 위치를—"
10056070-169 = "허튼 수작을 부릴 거라면 포기하는 게 좋을 텐데."
10056070-170 = "네 동료와 [USERNAME] 선생님은 이미 우리 손에 넘어왔거든."
10056070-174 = "어느 틈에……"
10056070-177 = "미안, 부장……"
10056070-178 = "부장이 올라올 때까지 어떻게든 시간을 벌어보려고 했는데……"
10056070-179 = "그 사이에 선생님이 붙잡혀 버렸어."
10056070-180 = "[s9] \"미안. 방심해 버렸어……\"\n[s10] \"말이 통하는 상대가 아니었네……\""
10056070-183 = "새로운 가신이 온다고 들었는데, 그 무리에 설마 샬레의 선생님이 섞여 있었을 줄이야."
10056070-184 = "귀한 백합을 열었더니, 생각지도 못한 진주를 손에 넣은 기분이구나."
10056070-190 = "우선은 여와 천천히 이야기를 나누어 보지 않겠나?"
10056070-191 = "토미 코코로."
