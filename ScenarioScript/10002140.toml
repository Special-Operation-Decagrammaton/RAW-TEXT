[translation]
10002140-1 = "후일담;동상이몽"
10002140-3 = "Q. 처음으로 만들어 본 모래성은 어떤 느낌이었나요?"
10002140-9 = "아……."
10002140-10 = "어엄……. 네……?"
10002140-11 = "그……. 선생님……."
10002140-12 = "혹시 괜찮으시다면, 이게 뭔지 여쭤봐도……?"
10002140-13 = "……예? 인터뷰……요?"
10002140-14 = "아, 아닙니다. 선생님께서 그리 말씀하신다면 거기에도 뭔가 뜻이 있으신 것이겠지요."
10002140-15 = "음……. 그렇습니까……."
10002140-16 = "모래성입니까……."
10002140-17 = "흠……."
10002140-18 = "꽤……. 꽤 즐거웠습니다……. 그 시범 보이던 학생도……. 굉장한 실력이었습니다."
10002140-19 = "보면서 나름대로 최선을 다해 만든다고 만들었습니다만……. 제 것은 많이 미숙했던 지라……."
10002140-20 = "음……."
10002140-21 = "혹시 나중에 다시 기회가 오게 된다면, 한 번 더 같이 해보고 싶습니다. 혹시 그럴 기회가 또 있을까요."
10002140-22 = "[s] \"가능하다면 또 해보고 싶어?\""
10002140-23 = "……! 가, 가능한 것입니까?"
10002140-24 = "하고 싶습니다. 가능하면 한 번 더 해보고 싶습니다……!!"
10002140-25 = "헤……. 헤헤……. 모래성……. 크케케케케……."
10002140-26 = "크케케케케케케……!"
10002140-29 = "Q. ……라는 이야기가 있었습니다만, 어떻게 생각하시나요?"
10002140-35 = "……에."
10002140-36 = "……저, 저요?"
10002140-37 = "아아. 모래성이요?"
10002140-38 = "아하하……."
10002140-39 = "……아아……. 그렇군요……. 네……."
10002140-40 = "같이……. 다시……."
10002140-41 = "그러니까…… 아, 아하하하하……."
10002140-43 = "……아하하……. 하하하하……."
10002140-45 = "(인터뷰 상대의 감정이 매우 불안정해져서, 인터뷰를 멈출 수 밖에 없었다.)"
