[translation]
1008103-1 = "막과자의 맛이 [ruby=Excellent]엑서얼~란투[/ruby]인 것이어요!"
1008103-5 = "앗, 여기여요! 선생님!"
1008103-6 = "오늘 선생님과 나눈 모모톡…… 소녀에겐 무척이나 컬쳐 쇼-쿠의 내용이었사와요!"
1008103-7 = "설마! 이미 짠맛 과자가 존재하고 있었다니! 그게 사실이어요?!"
1008103-8 = "[s] \"혹시나 해서 그런데, 유카리는 평소 어떤 디저트를 먹어왔어?\""
1008103-9 = "으음~ 이제껏 소녀가 식후에 먹어온 디저어-트라고 한다면……."
1008103-10 = "평소 주로 즐겨 먹는 건 역시 식후에 걸맞은 아이스쿠리임이라거나……."
1008103-11 = "가끔 사용인 분께서 백귀야행의 상점가에서 사다 주시는 화과자, 라거나……."
1008103-12 = "아, 그 밖엔 가끔 바깥에서 선물 받고는 했던 붉은겨울 학원의 푸디-잉이나 트리니티 특제 롤케이~쿠, 바클라아-바 같은 과자들이 있었사와요."
1008103-13 = "[s1] \"역시나. 대부분 그런 종류의 과자를 먹어왔던 거구나.\"\n[s2] \"아무래도 선물용 과자에는 단맛 계열이 많으니까 말이야.\""
1008103-16 = "네? 그 말씀은……."
1008103-17 = "[s] \"하지만 유카리 놀라지 말고 들어, 세상엔 그 밖에도 다양한 과자가 있어!\""
1008103-18 = "……!"
1008103-19 = "때문에 오늘은 그 짠맛 과자들을 주로 취급하는 멋진 장소로…… 소녀를 안내해 주시고자 이곳에서 만나자는 말씀을……?"
1008103-20 = "[s] \"응, 이번엔 유카리에게 막과자에 대해 알려줄게.\""
1008103-21 = "……막, 과자?"
1008103-26 = "이곳이 선생님께서 말씀하셨던 <막과자집>이 있는 장소……"
1008103-31 = "아, 선생님. 저기 사람들이 몰려 있사와요!"
1008103-35 = "이건……!"
1008103-38 = "한쪽 벽면이 전부 낱개로 포장된 과자로……"
1008103-39 = "앗, 저쪽엔 사탕이 잔뜩 든 유리병이 진열되어 있사와요!"
1008103-40 = "그 옆으로는 튀김과자와…… 음료가 든 병과…… 우산 모양의…… 초콜릿?"
1008103-41 = "그리고 이쪽의 이건…… 폭죽과 수리검 팽이……?"
1008103-42 = "여기에선 이런 물건들까지 팔고 있는 건가요?!"
1008103-43 = "저 유카리……. 이제 뭐가 뭔지, 눈이 빙글빙글 돌아서 하나도 모르겠사와요!"
1008103-44 = "소녀는……. 소녀는 여기에서 무얼 하면 좋은 걸까요?!"
1008103-45 = "[s] \"자, 이럴 땐 경력자를 믿어보라고. 운메에봉 하나 주세요.\""
1008103-46 = "매번 감사 땡큐!"
1008103-51 = "매번…… 감사, 땡큐……?"
1008103-52 = "선생님께선 매번 이곳을 오고 계신다는……?"
1008103-53 = "[s] \"일종의 관용어 같은 거니까! 자자, 그렇게 머뭇거리지 말고. 자, 여기.\""
1008103-57 = "운메에봉…… 작은 과자봉지에 들어 있는 낱개의 과자란 말이지요."
1008103-58 = "이것이야말로 막과자의 기본이자 막과자의 왕, 막과자의 키잉덤, 막과자의 지존이자 고향……? 의미를 모르겠사와요!"
1008103-59 = "오히려 그런 의미를 잘 알 수 없는 부분이야말로 막과자다……?"
1008103-60 = "으음, 저 유카리 잘은 모르겠지만. 선생님께서 추천해 주시는 것이니 우선……"
1008103-67 = "이거! 맛있사와요! 오묘하게 달짝지근하면서도 매콤하고 고소한 이 맛은 대체!"
1008103-68 = "<콘포타아쥬 믹수후르추 메, 가맥수 맛>……?"
1008103-69 = "의미도 영문도 모르겠사와요!"
1008103-70 = "[s] \"하지만 나쁘지 않지?\""
1008103-71 = "네! 무척이나…… 가슴이 설레고…… 굉장한…… 그런 맛이었사와요!"
1008103-73 = "다음엔 이 과자를? 먹으면 혀의 색이 변하는 사탕인가요?"
1008103-77 = "아앗! 정말로! 소녀의 혀가 파랗게!"
1008103-78 = "선생님! 선생님! 이것 좀 보시어요!"
1008103-80 = "(그렇게 얼마나 유카리와 함께 막과자집의 다양한 과자들을 즐기고 있었을까.)"
1008103-82 = "이곳저곳에 실로 다양한 과자들이 잔뜩…… 세상에 이렇게나 다양한 종류의 과자가 있었을 줄이야."
1008103-83 = "저, 전혀 모르고 있었사와요. 그야말로 컬쳐쇼-쿠. 나아가 일렉투릭 쇼쿠여요……."
1008103-84 = "[s] \"게다가 유카리, 막과자의 진수는 이것만이 아니라고!\""
1008103-85 = "여기서 뭔가가 더 있는 건가요?!"
1008103-89 = "어라? 막과자집 구석에 있는 곳에, 다양한 분들이 모이셔서……."
1008103-90 = "다들 모여! 지금부터 즉석 격투 게임 대회를 시작한대!"
1008103-91 = "좋아! 이번에야말로 내 실력을 보여주겠어!"
1008103-95 = "즉석…… 격투 게에임 대회……?"
1008103-96 = "[s] \"응, 여기에선 고전 게임기로 이렇게 즉석 대회가 열리기도 하거든.\""
1008103-97 = "어린아이분들께서 눈을 빛내면서 잔뜩 즐거워하고 있사와요."
1008103-98 = "……과연, 이런 부분까지 포함해서 전부가…… 선생님께서 알려주고 싶어 하신 막과자……라는 것이군요."
1008103-99 = "[s] \"어때? 유카리.\""
1008103-100 = "아, 그게…… 그러니까……."
1008103-104 = "……후훗."
1008103-105 = "여전히 제게는 낯설고 대부분이 처음 접하는…… 그런 것들이긴 하지만."
1008103-106 = "네! 이건 또 저번에 방문하였던 오락실과는 다른 의미의…… 화려함이어요!"
1008103-107 = "북적북적하지만 동시에 어딘지 모르게 고즈넉하기도 하여……"
1008103-108 = "그렇기에 소녀의 마음에 차분히 스며드는 이 느낌은……"
1008103-109 = "네! 여전히! 전부 다! 최고의 경험들이어요! 선생님께선 항상 이렇게 소녀에게 새로운 것을 가르쳐 주셔서…… 깜짝 놀랐사와요!"
1008103-110 = "[s3] \"그래? 하지만 겨우 이 정도로 놀라지 말도록.\"\n[s4] \"막과자집에서 즐길 수 있는 여러 가지를 더 가르쳐줄 테니까.\""
1008103-113 = "……!"
1008103-114 = "네! 오늘도! 저 유카리!"
1008103-115 = "전력을 다해 배우도록 하겠사와요!"
1008103-117 = "(그 뒤로도 계속해서 막과자집의 여러 문화를 체험하며 유카리와 늦은 오후를 함께 했다.)"
