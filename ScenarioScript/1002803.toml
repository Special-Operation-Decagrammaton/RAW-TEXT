[translation]
1002803-1 = "토끼의 생태"
1002803-2 = "(계속되는 업무에 피로가 쌓여 더는 업무를 진행할 수 없는 상태가 되었다.)"
1002803-3 = "(잠시 바람이라도 쐬야 했기 때문에 근처의 강변으로 나왔다.)"
1002803-6 = "어? 주인님이네?"
1002803-7 = "[s1] \"……?\"\n[s2] \"이 목소리는…….\""
1002803-13 = "야호-! 주인님! 이런 곳까지 무슨 일이야?"
1002803-14 = "혹시 그런 거야? 주인님도 토끼의 생태를 확인해 보려고……?"
1002803-15 = "[s] \"……아스나?\""
1002803-16 = "응? 나? 나 왜?"
1002803-17 = "……왜 여기 있냐고? 복장? 내 복장은 또 왜?"
1002803-18 = "아하하! 무슨 말이야? 방금 말했잖아? 토끼의 생태를 확인하기 위해서라고!"
1002803-19 = "토끼에 대해 이해하기 위해서 토끼의 기분이 돼 보기로 한 거지. 어때, 똑똑하지?"
1002803-20 = "자 봐. 주인님! 여기 토끼풀도 있다고! 토끼가 살기에 딱 좋은 장소야!"
1002803-21 = "……응?"
1002803-22 = "다른 사람들이 본다고? 그게 왜?"
1002803-23 = "생각해 봐, 주인님. 당연하잖아? 여기에 토끼가 있어도 주인님도 볼 거잖아."
1002803-24 = "그런 뜻이 아니라고?"
1002803-25 = "으음……? 무슨 말이지?"
1002803-29 = "으음~. 그런 건가……."
1002803-30 = "혹시……."
1002803-31 = "……선생님도 토끼가 돼 보고 싶은 거야?"
1002803-32 = "[s3] \"……어째서 그렇게 이어지는 거야?\"\n[s4] \"방금 대화의 어느 부분에서 그런 맥락이…….\""
1002803-33 = "옷이 필요한 거면 말만 해. 내가 주인님한테 딱 맞는 걸로 구해 올 테니까!"
1002803-34 = "옷이 필요한 거면 말만 해. 내가 주인님한테 딱 맞는 걸로 구해 올 테니까!"
1002803-35 = "……응? 괜찮다고?"
1002803-36 = "주인님은 토끼가 아니어도 괜찮다고?"
1002803-37 = "아하하하하!! 왜 갑자기 당황해? 역시 주인님은 알다가도 모를 사람이라니까."
1002803-38 = "흠~. 토끼가 아니면 주인님은 뭘 할까? 역시 주인님은 그냥 주인님이려나……."
1002803-39 = "……잠깐."
1002803-40 = "그럼 지금은 메이드의 주인님이 아니라 토끼 주인님이네?"
1002803-41 = "그렇구나! 토끼 주인님이구나!"
1002803-42 = "……응! 그런 쪽도 궁금하긴 한 걸. 밖에서 사는 토끼랑 주인님이 있는 토끼는 또 다를 테니까."
1002803-48 = "주인님! 지금부터 아스나 토끼를 쓰다듬어 줘!"
1002803-49 = "[s5] \"갑자기 또 엄청난 요구를 하네.\"\n[s6] \"제 말을 전혀 듣지 않는군요.\""
1002803-50 = "빨리, 주인님 빨리~!"
1002803-51 = "빨리, 주인님 빨리~!"
1002803-52 = "쓰다듬어 줘! 빨리~!"
1002803-56 = "음~? 왜 안 쓰다듬어주는 거야? 왜 다른 데를 보는 거야?"
1002803-57 = "토끼는 외로우면 안 된다고 했다고! 죽을 수도 있다고 했단 말이야!"
1002803-58 = "주인님이 아스나를 외롭지 않게 해 줘야지! 그렇지 않아?"
1002803-62 = "흐으으음~~."
1002803-63 = "……그렇다면 어쩔 수 없지!"
1002803-64 = "주인님이 쓰다듬어주지 않으면 아스나가 직접 몸을 부비는 수밖에 없겠네!"
1002803-69 = "어, 어어? 주인님. 어디 가는 거야?"
1002803-70 = "주인님! 도망치지 마! 주인님~!!"
1002803-75 = "주인님~~~~!!"
