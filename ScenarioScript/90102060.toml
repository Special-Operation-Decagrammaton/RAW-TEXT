[translation]
90102060-1 = "제6화;뜻밖의 해후"
90102060-4 = "여기는 FOX 4. FOX 1, FOX 2. 방금 탐문 조사를 막 완료했다."
90102060-8 = "여기는 FOX 2. 어쩐지 목소리가 밝네. 뭔가 중요한 단서라도 찾은 거야?"
90102060-9 = "응. 아직 확신할 수는 없지만, 유력한 용의자를 찾은 것 같아."
90102060-10 = "FOX 1, <배금의 브로커>를 기억하고 있어?"
90102060-11 = "<배금의 브로커>라면…… CCC의 다이아를 조작해서 고의로 물류를 마비시켰던 그 녀석 말인가? 그 이름이 여기서 왜 나오는 거지?"
90102060-12 = "나도 처음 들었을 때는 같은 생각이었는데……"
90102060-13 = "아무래도 이번 실종 사건에 배금의 브로커가 관련되어 있는 것 같아."
90102060-17 = "그게 정말이야?"
90102060-19 = "……그렇군. 심야에 간헐적으로 나타나는 유령 열차가 사실은 배금의 브로커가 운용하는 밀수 열차일 수도 있다는 건가."
90102060-20 = "응. 그 녀석은 하이랜더 학원 출신이니까, 운행 기록을 조작하거나 배차 간격 사이에 가짜 열차를 끼워 넣는 건 어렵지 않았을 거야."
90102060-21 = "그 열차를 통해 무엇을 밀수하려는 건지는 알 수 없지만, 이번 일이 배금의 브로커가 벌인 사건이라면 어느 정도 아귀가 맞아."
90102060-22 = "실종된 학생들도 이 밀수에 가담하거나, 혹은 휘말린 관계자일지도 모르고."
90102060-23 = "충분히 설득력이 있는 가설이군."
90102060-24 = "최근 재액의 여우를 비롯한 일곱 죄수들의 목격담이 늘어나고 있으니, 배금의 브로커가 활동을 재개했다고 해도 이상한 일이 아니야."
90102060-25 = "하지만 뭔가 갑작스럽네. 설마 '교수'가 또 무언가를 꾸미고 있는 건 아니겠지?"
90102060-26 = "그렇다 하더라도 일단 지금은 실종 사건을 수사하는 게 우선이니까."
90102060-27 = "이번 사건이 정리되는 대로 후속 조사를 재개하도록 하지."
90102060-28 = "[s] \"저기, 한 가지 묻고 싶은 게 있는데……\""
90102060-29 = "네, 선생님. 편히 여쭈어 주십시오."
90102060-30 = "[s1] \"그러니까 하이랜더 출신의 일곱 죄수라고 했던가……?\"\n[s2] \"배금의 브로커가 누구야?\""
90102060-36 = "아…… 그러고 보니 선생님께는 낯선 이름일지도 모르겠군요."
90102060-37 = "<배금의 브로커>는 와카모와 함께 탈옥한 일곱 죄수 중 한 사람이에요."
90102060-38 = "하이랜더 출신으로 온갖 불법 유통에 앞장서서 키보토스의 유통망을 교란시킨 데다가, 온갖 수단의 도주로를 갖고 있었기 때문에 발키리에서도 체포에 애를 먹던 학생 중 하나였지요."
90102060-39 = "우리도 내부자와 협력하지 못했더라면 끝끝내 놓치고 말았을 거야."
90102060-40 = "다른 의미로 체포에 제일 애를 먹은 범죄자 중 하나였다니까."
90102060-42 = "[ns3] \"일곱 죄수 중 하나란 말이지.\"\n[ns4] \"어쩐지 최근 일곱 죄수의 목격담이 곳곳에서 들려오는 것 같네.\""
90102060-45 = "아마 총학생회장이 복귀하고 수사망이 좁혀오니 발악을 하는 것이겠지요. 문제아들의 사소한 말썽에 대해서는 신경 쓰지 마시길."
90102060-46 = "우선은 그 열차를 직접 두 눈으로 확인해 볼 필요가 있겠습니다만……"
90102060-50 = "뭐, 특별한 방법이 없을 때는 나올 때까지 기다리는 것밖에 방법이 없겠지?"
90102060-51 = "일단 오늘 밤은 우리에게 맡겨 줘. 승강장에서 대기하며 수상한 열차가 오지는 않는지 직접 확인해 볼게."
90102060-52 = "오늘은 밤샘 근무인가~ 잠복 근무를 하는 것도 오랜만이네."
90102060-53 = "[s] \"괜찮겠어? 오늘 밤은 꽤 쌀쌀하다던데.\""
90102060-54 = "걱정 마. 그 어떤 환경이라도 묵묵히 임무를 완수해 내는 것이 SRT의 특수 부대니까."
90102060-55 = "영하의 추위 속에서 진행되는 혹한기 훈련도 몇 번이나 치렀는데, 이런 환절기 날씨쯤이야."
90102060-56 = "그럼 계속해서 현장의 감시를 부탁하지. FOX 3, FOX 4."
90102060-57 = "맡겨 두라고!"
90102060-59 = "(하지만 그날 밤……)"
90102060-65 = "늦네, 브로커 쨩……"
90102060-66 = "이러다가 저 동태가 되어버려요?"
90102060-67 = "으으…… 일교차 때문인가? 뭔가 밤 공기가 평소보다 더 차갑게 느껴지네……"
90102060-68 = "저기, FOX 4. 정말로 오늘 그 열차가 오는 건 맞아?"
90102060-69 = "몰라. 그건 배금의 브로커한테 물어 봐야지."
90102060-70 = "아니, 그 녀석이 이 일에 진짜 관련되었는지도 아직은 확신할 수 없지만."
90102060-71 = "으으, 이럴 줄 알았으면 모포라도 한 장 가져올 걸 그랬네."
90102060-75 = "……지금이라도 선생님께 연락해 볼까?"
90102060-76 = "제정신이야? 지금이 몇 시인데. #n안 그래도 바쁜 선생님께 폐를 끼칠 셈이야?"
90102060-77 = "……게다가 SRT의 자존심이 있지. 여기서 [USERNAME] 선생님께 더 폐를 끼칠 수는 없으니까."
90102060-78 = "하긴, 그것도 그렇네."
90102060-79 = "하여튼 아무나 빨리 와라. 진짜 유령 열차라도 상관없으니까……"
90102060-81 = "(이후, 승강장에서 밤새도록 기다렸지만 결국 쿠루미와 오토기는 아무 성과도 거두지 못한 채 아침을 맞이하고 말았다.)"
90102060-87 = "FOX 3…… 방금 복귀했어."
90102060-88 = "FOX 4도 도착—"
90102060-89 = "[s5] \"어서 와. 쿠루미, 오토기.\"\n[s6] \"밤새 많이 추웠지?\""
90102060-92 = "괜찮아. 그럭저럭 버틸만 했는 걸."
90102060-93 = "두 사람 모두 고생 많았어."
90102060-94 = "어젯밤 승강장에서 잠복하는 동안 뭔가 수상한 점은 없었어?"
90102060-95 = "아니, 전혀."
90102060-96 = "유령 열차는 고사하고, 개미 한 마리 얼씬거리지 않던걸."
90102060-97 = "뭔가 어제는 날이 아니었나 봐. 게다가 바람까지 세게 불어서…… 에취!"
90102060-98 = "으으…… 몸이 왜 이러지? 열이 나는 것 같은데."
90102060-99 = "나도 뭔가 몸이 으슬으슬한 게…… 감기 기운이 올라오는 것 같네."
90102060-100 = "이런, 큰일이네. 두 사람 모두 이쪽에 앉아."
90102060-101 = "금방 따듯한 차를 준비해 줄 테니까……"
90102060-105 = "역시 일교차가 크다 보니 컨디션이 망가졌나."
90102060-106 = "미안, FOX 1. 고작 이 정도의 날씨에 컨디션을 해치다니, 면목이 없어……"
90102060-107 = "아니. 미리 기온 차를 고려하지 못한 건 내 탓이야. 고생을 하게 했네."
90102060-108 = "두 사람 모두 푹 쉬도록 해. 오늘 탐문은 나갈 필요 없으니까."
90102060-109 = "하지만 그 사이에 용의자가 나타나면 어쩌려고?"
90102060-110 = "그건 걱정할 필요 없어."
90102060-111 = "……오늘 조사는 내가 직접 진행할 테니까."
90102060-115 = "유키노가?"
90102060-116 = "유키노가?!"
90102060-117 = "유키노가 직접 시민들을 조사한다고?"
90102060-121 = "……뭔가 문제라도 있나?"
90102060-122 = "아니…… 하지만 유키노 너, 거짓말 진짜 못하잖아."
90102060-123 = "솔직히 SRT 훈련 때는 다 짜고 치는 거니까 모른 체 넘어갔지만, 실전에서 그 연기가 먹힐 것 같지는 않은데……"
90102060-124 = "걱정할 필요 없다. 조사 준비는 이미 완벽히 해두었으니까."
90102060-125 = "인터넷에서 '인싸' 들이 쓰는 유행어는 물론이고, 화제까지 완벽히 조사해 두었으니—"
90102060-126 = "유행에 민감한 여고생을 연기하는 건 문제없을 거다."
90102060-127 = "아니, 연기고 자시고 넌 이미 여고생이잖아."
90102060-129 = "……유키노의 인싸 흉내라니, 상상이 안 가네."
90102060-130 = "[s] \"……유키노가 그렇게 연기를 못해?\""
90102060-131 = "연기를 못한다기보다는…… 거짓말을 못하는 성격이라고 할까요. 하하……"
90102060-132 = "선생님, 괜찮으면 오늘 유키노가 탐문 조사하는 것 좀 동영상으로 찍어서 보내줄래?"
90102060-133 = "요새 볼만한 시트콤이 없어서 심심하던 차라서."
90102060-135 = "FOX 4. 헛소리는 말고 오늘은 휴식에 몰두하도록."
90102060-136 = "FOX 1, 정 뭣하면 내가 대신 나갈까?"
90102060-137 = "아니. FOX 2의 얼굴은 요새 SNS에 너무 많이 올라왔으니까."
90102060-138 = "보안을 위해서라도 내가 나가는 게 타당하다고 생각해."
90102060-139 = "그건 이해하지만…… 너무 무리는 하지마."
90102060-140 = "그럼, FOX 1. 금일 조사를 다녀오지."
90102060-146 = "괜찮으려나……"
90102060-151 = "후우……"
90102060-152 = "[s7] \"괜찮아, 유키노?\"\n[s8] \"뭔가 잔뜩 긴장한 것처럼 보이는데……\""
90102060-155 = "괜찮습니다, [USERNAME] 선생님."
90102060-156 = "그저, 현장 조사는 오랜만이라 숨을 가다듬고 있었을 뿐입니다."
90102060-157 = "예기치 못한 상황에 대응할 수 있도록, 현장 시뮬레이션을 하는 건 몇 번을 반복하더라도 부족하니까요."
90102060-158 = "후우우우……"
90102060-159 = "그럼, 지금부터 탐문을 개시하겠습니다."
90102060-160 = "침착하게. 유행에 민감한 키보토스의 여느 학생들처럼, 자연스럽게 공감을 사기 쉬운 화제를 택해야……"
90102060-164 = "예이~ 거기 지나가는 귀여운 학생!"
90102060-165 = "시간 있으면 ME랑 페로롯치 이야기하지 않을래?"
90102060-166 = "[ns9] (우와아아아……)\n[ns10] (너무 어색해서 소름이 돋을 정도야……)"
90102060-169 = "……네? 페로롯치? 그게 뭐죠?"
90102060-170 = "가벼운 상담이라면 상관없지만, 저는 지금부터 급히 가봐야 할 곳이 있어서……"
90102060-171 = "그, 그렇다면 어쩔 수 없지……"
90102060-172 = "잠깐. 이 목소리는……"
90102060-176 = "……유키노 선배?"
90102060-177 = "아."
90102060-178 = "[ns] \"아.\""
90102060-179 = "그리고 그 옆에는 [USERNAME] 선생님까지……"
90102060-183 = "이게 도대체…… 무슨 상황인 거죠?"
90102060-188 = "……설명해 주시죠. 자세하게."
90102060-189 = "[s] \"그게 그러니까……\""
90102060-193 = "………."
90102060-194 = "……오랜만이군, 츠키유키 소대장."
90102060-196 = "다음화;여우와 토끼"
