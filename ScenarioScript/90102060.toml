[translation]
90102060-1 = "第6話;思わぬ再会"
90102060-4 = "こちらFOX4。#nFOX1、FOX2。聞き込み調査が終わったよ。"
90102060-8 = "こちらFOX2。なんだか声が弾んでるね。重要な手がかりでも掴んだ？"
90102060-9 = "まだ断定はできないけど、有力な容疑者が見つかったかも。"
90102060-10 = "FOX1、拝金のブローカーのこと覚えてる？"
90102060-11 = "なぜ今、その名前が？"
90102060-12 = "私も最初はそう思ったんだけど……。"
90102060-13 = "今回の失踪事件に関わってるみたいなの。"
90102060-17 = "それ、本当？"
90102060-19 = "……なるほど。#n幽霊列車の正体が、拝金のブローカーの使う密輸列車かもしれないということか。"
90102060-20 = "運行情報の改ざんとか、ダイヤの隙間に列車を紛れ込ませたりするくらい、#nハイランダー出身のあいつなら難しくないはず。"
90102060-21 = "何を運んでるのかは分からないけど、拝金のブローカーの仕業と考えれば、#nある程度つじつまは合うんだよね。"
90102060-22 = "失踪した生徒も、密輸に加担してたか、たまたま巻き込まれたのかもしれないし。"
90102060-23 = "仮説としての筋は十分だな。"
90102060-24 = "災厄の狐をはじめとして、七囚人の目撃情報が増えている。#n拝金のブローカーが活動を再開していても不思議ではない。"
90102060-25 = "でも、少し唐突な気もしない？#n「教授」がまた何か企んでたりするのかな……？"
90102060-26 = "仮にそうだとしても、今は失踪事件が優先だ。"
90102060-27 = "後続の調査は、目前の件が片づき次第、再開する。"
90102060-28 = "[s] \"ねえ、1つ聞きたいことがあるんだけど……。\""
90102060-29 = "なんでしょうか？"
90102060-30 = "[s1] \"ハイランダー出身の七囚人……？\"\n[s2] \"拝金のブローカーって？\""
90102060-36 = "そういえば、先生はご存じないかもしれません。"
90102060-37 = "拝金のブローカーは、ワカモと共に脱獄した七囚人の1人です。"
90102060-38 = "あらゆる違法流通に手を染めてキヴォトスの物流網をかき乱したうえ、#n逃走経路が多様でヴァルキューレも逮捕に苦労していました。"
90102060-39 = "私たちも、内部協力者がいなかったら取り逃がしてたと思う。"
90102060-40 = "捕まえるのに手を焼いたって意味じゃトップクラスの犯罪者だったんだから。"
90102060-42 = "[ns3] \"七囚人か……。\"\n[ns4] \"最近、目撃情報が多い気がするね。\""
90102060-45 = "追い詰められて足掻いているのでしょう。#n連邦生徒会長が復帰し、捜査の手も迫っていますから。"
90102060-46 = "問題児の騒ぎなど、先生はお気になさらず。まずは目前のことに集中しましょう。#nどうにかして、例の列車を確認する必要がありますが……。"
90102060-50 = "特別な方法がないなら、出るまで待つしかないわよね。"
90102060-51 = "とりあえず今夜は私たちに任せて。ホームで張り込んでれば、いずれ来るでしょ。"
90102060-52 = "今日は徹夜か～張り込みなんて久しぶりだね。"
90102060-53 = "[s] \"結構冷え込むらしいけど、大丈夫？\""
90102060-54 = "心配ないよ。どんな環境下でも黙々と任務を遂行するのが、SRTの特殊部隊だから。"
90102060-55 = "耐寒訓練だって何度もこなしてるし、季節の変わり目の夜風くらい余裕、余裕。"
90102060-56 = "ではFOX3、FOX4、引き続き現場の監視を頼む。"
90102060-57 = "任せといて！"
90102060-59 = "（しかし、その夜――）"
90102060-65 = "ブローカーちゃん、遅いね……。"
90102060-66 = "このままじゃ氷漬けになっちゃうよ……。"
90102060-67 = "なんかいつもより空気冷たくない？#n昼間は暖かかったからかな……。"
90102060-68 = "ねえ、FOX4。列車、本当に来ると思う？"
90102060-69 = "さぁ。そればっかりはブローカー本人に聞いてみないと。"
90102060-70 = "そもそも、拝金のブローカーが関わってるかどうかもまだ分からないんだけどさ。"
90102060-71 = "うぅ……こんなことなら毛布の1枚でも持ってくるんだった。"
90102060-75 = "……先生に連絡してみる？"
90102060-76 = "正気？今何時だと思ってるの。#nただでさえ忙しい先生に迷惑かけられないでしょ。"
90102060-77 = "……それに、SRTの意地もあるし。#nここで[USERNAME]先生に甘えるわけにはいかないんだから。"
90102060-78 = "それもそうだね。"
90102060-79 = "早く来ないかな……もうこの際、本物の幽霊列車でもいいから……。"
90102060-81 = "（2人はホームで待ち続けたが、何の成果も得られぬまま朝を迎えることになった）"
90102060-87 = "FOX3……ただいま帰還。"
90102060-88 = "FOX4も到着――"
90102060-89 = "[s5] \"クルミ、オトギ。おかえり。\"\n[s6] \"寒いなかお疲れ様。\""
90102060-92 = "まあ、なんとか耐えられる程度だったよ。"
90102060-93 = "二人ともお疲れ様。"
90102060-94 = "一晩張り込んでみてどうだった？"
90102060-95 = "平和そのものだったよ。"
90102060-96 = "幽霊列車どころか、アリ1匹通らなかった。"
90102060-97 = "昨日は日が悪かったのかも。#nおまけに風まで強くて――っくしゅん！"
90102060-98 = "うう……なんか身体が変。熱っぽい気がする。"
90102060-99 = "私も寒気が……風邪っぽいかも。"
90102060-100 = "大変。二人とも、こっちに座って。"
90102060-101 = "すぐ温かいお茶を用意するね。"
90102060-105 = "やっぱり寒暖差が大きいと体調も崩れるか。"
90102060-106 = "ごめん、FOX1。この程度の気温でやられるなんて、面目ない……。"
90102060-107 = "いや。事前に考慮できなかったのは私の責任だ。苦労をかけた。"
90102060-108 = "二人はしっかり休め。今日の聞き込みに出る必要はない。"
90102060-109 = "でも、その間に容疑者が現れたらどうするの？"
90102060-110 = "心配は無用だ。"
90102060-111 = "今日の調査は私が行う。"
90102060-115 = "ユキノが？"
90102060-116 = "ユキノが！？"
90102060-117 = "ユキノが……聞き込み？市民に？"
90102060-121 = "……何か問題でも？"
90102060-122 = "いや……ユキノ、嘘つくの下手じゃん。"
90102060-123 = "SRTの訓練は段取りありきだから見逃されてただけで、#nユキノが実戦で通用するとは思えないんだけど……。"
90102060-124 = "調査の準備は万全に整えてある。"
90102060-125 = "「陽キャ」が使う流行語はもちろん、「ナウい」話題についても完璧に調査済みだ。"
90102060-126 = "流行に敏感な女子高生を演じることに、何の問題もない。"
90102060-127 = "いや、演じるも何も……私たち女子高生なんだけど。"
90102060-129 = "陽キャのユキノ……まったく想像できないわね。"
90102060-130 = "[s] \"……ユキノって、そんなに演技が下手なの？\""
90102060-131 = "というより……嘘がつけない性格、というべきでしょうか。あはは……。"
90102060-132 = "先生、よかったらユキノの動画を撮っておいてくれない？"
90102060-133 = "最近、見応えのあるバラエティ番組がなくて退屈してたところなんだ。"
90102060-135 = "FOX4、くだらないことを言っていないで今日は休養に専念しろ。"
90102060-136 = "FOX1、私が代わりに行こうか？"
90102060-137 = "いや、FOX2はSNSで知られすぎている。"
90102060-138 = "作戦の秘匿性を考えても、私が出るのが妥当だろう。"
90102060-139 = "それは分かるけど……無理はしないでね。"
90102060-140 = "では、FOX1。本日の調査に向かう。"
90102060-146 = "大丈夫かな……。"
90102060-151 = "ふぅ……。"
90102060-152 = "[s7] \"ユキノ、大丈夫？\"\n[s8] \"すごく緊張してるみたいだけど……。\""
90102060-155 = "問題ありません。"
90102060-156 = "こうして現場に出るのは久しぶりなので、脳内でシミュレーションしていただけです。"
90102060-157 = "不測の事態に対応できるよう、現場シミュレーションを繰り返すことは重要ですから。"
90102060-158 = "ふううう……。"
90102060-159 = "では、これより聞き込みを開始します。"
90102060-160 = "落ち着け。#n一般的な生徒を想定し、自然に共感を得られる話題を選ぶんだ……。"
90102060-164 = "いえーい、そこのカワイイ彼女！"
90102060-165 = "時間あったら、MEとペロロッチの話でもしない？"
90102060-166 = "[ns9] （うわあああ……）\n[ns10] （見てるこっちが恥ずかしくなる……）"
90102060-169 = "……間に合っています。"
90102060-170 = "先を急ぎますので。"
90102060-171 = "そ、そうか。なら仕方ない……。"
90102060-172 = "えっ？待ってください。この声は――"
90102060-176 = "……ユキノ先輩？"
90102060-177 = "あ。"
90102060-178 = "[ns] \"あ。\""
90102060-179 = "――と、[USERNAME]先生。"
90102060-183 = "これは……どういう状況ですか？"
90102060-188 = "……説明してください。詳しく。"
90102060-189 = "[s] \"えっと、その……。\""
90102060-193 = "……。"
90102060-194 = "……久しぶりだな、[ruby=つきゆき]月雪[/ruby]小隊長。"
90102060-196 = "次回;狐と兎"
