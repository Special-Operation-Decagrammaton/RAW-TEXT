[translation]
10047030-1 = "제3화;예술에 깃든 오컬트"
10047030-2 = "(오컬연 아이들을 따라 도착한 장소는 바로…….)"
10047030-4 = "와일드헌트 미술관"
10047030-6 = "[ns] \"오…… 와일드헌트의 미술관은 이런 느낌이구나.\""
10047030-7 = "네. #n시대를 초월해 사랑받는, 걸작들이 전시되어 있죠."
10047030-8 = "작품뿐만 아니라, 건물 자체가 하나의 예술품이에요."
10047030-12 = "자, 이쪽의 돔 구조를 보세요. 완만하고 아름다운 형태죠?"
10047030-13 = "놀랍게도 이 건물이 지어질 당시엔 높은 구조물로 권위를 나타내려는 경향이 강했어요.#n하지만 이 미술관은 달랐죠."
10047030-14 = "높이로 권위를 나타내기보다, 완만한 돔 형태로 아름다움이라는 본질에 집중한 거예요!"
10047030-19 = "자, 보세요! 이 황금비율과 구조를! 이것이 바로 키보토스 예술 변혁의 순간!"
10047030-20 = "[s] \"그, 그런 것 같네…….\""
10047030-21 = "후후, 저희는 살짝 뒤로 빠져 있을까요?"
10047030-22 = "이런 설명은…… 에리 쨩이 잘하니까……."
10047030-23 = "계속 이런 텐션으로 가는 거야……?!"
10047030-25 = "자, 이제 이쪽을 보시죠! 이 회화는 <창세의 초상>이라는 이름으로, 저희 와일드헌트를 대표하는 작품입니다!"
10047030-26 = "엄청난 수의 망령들이 석양을 내달리는 이 압도적인 모습! 대단하지 않나요?"
10047030-27 = "[s] \"응. 상당히 인상적이네.\""
10047030-28 = "저는 이 작품을 마주한 순간 엄청난 전율을 느꼈답니다.#n이런 오컬트 색채가 강한 작품이 <창세의 초상>이라니!"
10047030-29 = "저도, 이런 작품을 그릴 수 있게 되고 싶어요……#n제 오리지널리티가 빛나― 학원을 대표할, 후세에 남을 작품을요."
10047030-33 = "……그래요. 언젠간 반드시 할 수 있을 거라 믿어요."
10047030-34 = "[s] \"기대되네. 완성되면 꼭 보여줘.\""
10047030-35 = "뉴후후, 물론이죠!"
10047030-36 = "그리고…… 오컬트를 추구하는 것이야말로, 걸작의 탄생에 이어질 테니까요."
10047030-37 = "[s] \"그런 거야?\""
10047030-38 = "사실 예술의 기원은 오컬트와 함께했다 해도 과언이 아니거든요."
10047030-39 = "영혼, 마법, 유령 같은 초자연적 존재를 마주하고― #n그것들을 고찰한 끝에 다양한 예술이 탄생했죠."
10047030-40 = "오컬트는 그냥 과장된 게 아니에요.#n이미 우리의 문화나 일상에 깊게 뿌리내리고 있어요!"
10047030-41 = "그걸 증명하고 있는 게 이 <창세의 초상>이라는 작품이랍니다."
10047030-42 = "망령들을 그린 그림이 학원의 대표작으로 여겨지고 있다. #n즉! 학원의 기원은, 오컬트와 연결되어 있다고 생각하는 게 자연스럽겠죠!"
10047030-43 = "이 생각에 도달하게 된 이유는, 아직 있어요……!"
10047030-44 = "창세의 초상 옆에 전시된 석상 보이시죠? 그 석상이 가리키는 방향엔 출입이 금지된 옛 종탑이 있어요."
10047030-45 = "모두의 기억에 잊혀 <이름 없는 종탑>이라 불리는 그 종탑엔 한 가지 전설이 있죠."
10047030-46 = "그건…… <멸망의 날, 종은 혼자 노래한다>."
10047030-47 = "망령의 행진과 멸망의 종탑! 아무리 봐도 우연이 아니잖아요?"
10047030-48 = "[s] \"그런 것 같기도……?\""
10047030-49 = "이게 끝이 아니랍니다! 옛 구전에 의하면, 와일드헌트의 주요 시설을 연결하면 <거대한 마법진>이 완성된다고 해요!"
10047030-50 = "보름달이 뜨는 날 밤 그 마법진을 완성하면 놀라운 일이 벌어진다죠!"
10047030-51 = "[s] \"오오……!\""
10047030-52 = "그 외에도 피눈물을 흘리는 석상, 고개가 움직이는 인물화, 혼자 연주하는 피아노 등등, 정말 수많은 오컬트 요소가 있어요!"
10047030-53 = "이 미술관에도 혼자 움직이는 악마상이 있죠!"
10047030-54 = "이런 걸로 미루어 보면 예술엔 오컬트가 깊이 관여하고 있는 게 분명해요!"
10047030-55 = "……어째 점점 뒤로 갈수록 도시전설 같은 이야기가 되고 있는데."
10047030-56 = "후후, 에리의 이야기는 항상 멋져요."
10047030-57 = "……잠깐, 누가 온다."
10047030-64 = "오? 에리 쨩이다. 안녕, 에리 쨩!"
10047030-65 = "안녕~!"
10047030-66 = "어, 어라……?"
10047030-67 = "응? 옆에 계신 분은 누구야? 처음 뵙는데."
10047030-68 = "샤, 샤, 샬레의 선생님입니다!"
10047030-73 = "[ns] \"다들 안녕.\""
10047030-75 = "반가워요, 선생님. 에리 쨩이랑 같이 견학 중이셨나 보네요."
10047030-76 = "룸메 분들도 안녕하세요."
10047030-81 = "으음, 조금 섭섭하네…… 에리 쨩, 우리랑은 잘 안 어울려 주잖아."
10047030-82 = "아……! 저, 그, 그건 일부러 그런 게 아니라……!"
10047030-83 = "아하하, 나도 알아. 농담해 본 거였어."
10047030-84 = "가끔은 우리랑 어울려 줘. 교실에서만 보는 사이라니, 섭섭하잖아."
10047030-85 = "으, 으아…… 여기선 뭐라고 대답을 해야……."
10047030-90 = "그래……! 이럴 때야말로 아르카나의 인도로……!"
10047030-94 = "아하하…… 점은 다음에 부탁할게."
10047030-95 = "그럼 우리는 이만 갈게~ 다음에 또 보자!"
10047030-96 = "그땐 다과회라도 같이 하자고."
10047030-97 = "네, 네엡! 기, 기, 기대하고 있겠습니다!!"
10047030-103 = "[ns1] \"으음…….\"\n[ns2] \"저 아이들이랑 무슨 일 있었어?\""
10047030-106 = "아, 아니요! 아무 일 없었어요!"
10047030-107 = "다들 친절하고 상냥하게 잘해줘서…… 오히려 문제가 있는 건 저라고 해야 할까……."
10047030-111 = "아, 아하하핫! 이, 이 이야기는 다음에 다시……."
10047030-112 = "[ns] (뭔가 사정이 있어 보인다. 일단 넘어가자.)"
10047030-113 = "아하하…… 죄송해요, 저 때문에."
10047030-117 = "……그러면, <그걸>하자. 히히."
10047030-118 = "……아, <그거> 말인가요."
10047030-122 = "또 하는 거야……?! 싫은데?!"
10047030-123 = "[ns] \"도대체 뭘 할 생각인데?\""
10047030-124 = "해보면…… 알 거야……."
10047030-129 = "자. 시작할게, 모두. 선생님도…… 자."
10047030-130 = "아, 네……!"
10047030-136 = "……도착했어."
10047030-137 = "[ns] \"응? 아까랑 같은 장소 아니야?\""
10047030-138 = "같은 장소로 보이지만, 이미 이곳은 이공간으로 바뀌었어요."
10047030-139 = "방금, 우리는……<의식>을 했어."
10047030-140 = "원을 그리듯, 미술관을 돈다―#n이 행위에는 마술적 의미가 있죠."
10047030-141 = "[s] \"그건 어떤……?\""
10047030-142 = "바로 이 악마와 대화하기 위해서랍니다!"
10047030-146 = "이 악마상은 먼 옛날 트리니티와의 교류를 위해 만들어졌던 것으로, 다른 악마를 내쫓는 주술적 의미를 가지고 있죠."
10047030-147 = "오랜 세월 트리니티 대성당 꼭대기에 장식되었습니다만, 현재는 문화재 관리 차원에서 이곳으로 옮겨져 보관 중이에요."
10047030-148 = "이런 유서 깊은 악마라면, 충분히 우리의 목소리가 닿을 터!"
10047030-149 = "히히…… 무기 쨩. 시작해."
10047030-150 = "네. 그럼, 악마와의 대화를 시작합니다~!"
10047030-158 = "나는 예술의 테러리스트—!!!"
10047030-159 = "어제는 회화를— 오늘은 문학을 점령한다—!!!"
10047030-163 = "우우워우우우어어어어어—!!!"
10047030-165 = "와아……!#n츠무기의 데스보이스는, 언제 들어도 대단해요."
10047030-166 = "감동할 만한 거야?!"
10047030-167 = "[ns] \"저, 정말 이걸로 악마와 이야기할 수 있어?\""
10047030-168 = "물론이죠! 저길 보세요!"
10047030-172 = "(악마상의 위치가 바뀌었다……!)"
10047030-173 = "히히…… 우리는 손가락 하나 안 댔어."
10047030-174 = "역시, 악마는 실존하는 거예요!"
10047030-175 = "돼, 됐으니까 빨리 도망가!"
10047030-176 = "여기서 이런 짓을 하면 위험하다고!"
10047030-177 = "그렇군요. 이대로 있다간 악마상이 소환한 <험한 것>이 우릴 덮치겠죠!"
10047030-181 = "[ns] \"험한 것……?\""
10047030-183 = "네. 즐기는 것도 좋지만 적당히 물러나는 것도 중요한 법."
10047030-184 = "여러분. 재빨리 이동하죠."
10047030-195 = "(갑작스러운 일이었지만, 확실히 악마상은 움직였다.)"
10047030-196 = "(게다가 <험한 것>이란 대체…….)"
10047030-200 = "[ns] \"이 학원에 무슨 일이 일어나고 있는 거야……?\""
