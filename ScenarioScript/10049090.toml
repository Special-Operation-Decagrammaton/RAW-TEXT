[translation]
10049090-1 = "제9화;플래쉬뱅 오퍼레이션"
10049090-2 = "마시로 씨, 뭔가 보이는 게 있으신가요?"
10049090-3 = "관측은 하고 있습니다만, 저녁이라 시야가 좁아서 찾는 데 시간이 좀 걸립니다."
10049090-4 = "물건을 판매하는 사람을 찾으면 됩니다, 풍선에 팝콘 통을 팔고 있어요!"
10049090-5 = "위치는 아까의 첫 번째 무대 근처입니다."
10049090-6 = "스즈미 씨는 어떻게 아시는 건가요?"
10049090-7 = "아까, 무대에 오르기 전에 어린아이들이 속상해하는 것을 보았습니다."
10049090-8 = "물건을 파는 상인에게 불량품을 바꿔 달라고 하고 있었어요."
10049090-9 = "그러면 이동하지 않았을까?"
10049090-10 = "아뇨, 아마도 그렇지 않을 겁니다."
10049090-11 = "이곳은 게헨나와 트리니티의 경계선에 가깝습니다."
10049090-12 = "즉, 그 말은, 어느 쪽이로든 도망치기에는 최적인 장소라는 뜻이죠."
10049090-13 = "무엇보다 무대 근처이고, 가장 많은 사람들이 오가는 곳이기도 하니."
10049090-14 = "장사가 목적이라면, 여기가 최적일 겁니다."
10049090-15 = "[s] \"날카로운데, 스즈미!\""
10049090-16 = "자경단원의 감입니다, 그보다 시간이……."
10049090-17 = "더 늦으면 퍼레이드가 끝나고 돌아가게 될 겁니다."
10049090-18 = "그렇게는 안 되지! 여기 들어오느라 얼마나 고생했는데!"
10049090-19 = "악어한테 물릴 뻔했단 말야!"
10049090-21 = "아, 악어요……?"
10049090-22 = "현장, 찾았습니다! 관객석에서 볼 때 무대 왼쪽쯤에 있습니다!"
10049090-26 = "갑니다!"
10049090-30 = "자자- 어린이 여러분~ 풍선에서 바람이 샌 게 아니에요~"
10049090-31 = "여러분들의 몸에 있는 해로운 기운이 풍선에 들어있는 하이퍼 음이온과 결합한 거랍니다!"
10049090-32 = "바람이 빠졌다면 럭키! 더 건강해진 거예요!"
10049090-34 = "이 언니 뭔가 어려운 말만 해."
10049090-35 = "건강? 그러면 병원 가서 주사 안 맞아도 돼?"
10049090-37 = "그, 그래도 아플 때에는 주사를 맞긴 해야죠!"
10049090-38 = "거기에 약 잘 먹고 병원 잘 가면 더더욱 효과가 좋답니다!"
10049090-39 = "거기까지, 그만!"
10049090-40 = "예, 예?!"
10049090-41 = "잠시 몇 가지만 묻겠습니다."
10049090-42 = "협조, 해 주시겠습니까?"
10049090-43 = "아~ 아! 물론이죠~"
10049090-44 = "잠시만요~ 하하하! 수상한 일이라니, 이런~! 여기 잠시 수레에 고임목을……."
10049090-49 = "……빼고 오늘은 폐점! 모두들 안녕히 계세요~!!!!"
10049090-50 = "핑크, 쏘세요!"
10049090-51 = "핑크라고 불러주셔서 감사합니다앗-!!"
10049090-60 = "아야!!!"
10049090-61 = "잡았다, 이 포상금 녀석!!"
10049090-62 = "윽, 단속반이었나요, 당신들?!"
10049090-63 = "모두들! 단속입니다! 장사 접고 모두 모이세요!!"
10049090-65 = "아군을 부르고 있습니다!!"
10049090-70 = "부장님 여기로! 엄호사격 할게!"
10049090-71 = "쏴! 부장님을 지켜!!"
10049090-79 = "뭐지? 오늘의 마지막 쇼인가 봐."
10049090-80 = "그러게, 모든 캐스트들이 다 나오네?"
10049090-82 = "퐁당퐁당 헬멧단! 준비됐냐! 저 포상금을 놓치면 오늘 불고기는 날아가는 거야!"
10049090-86 = "그게 싫다면……."
10049090-91 = "무조건 잡아!!!"
