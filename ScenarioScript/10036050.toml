[translation]
10036050-1 = "제5화;헬멧단 물총 대회"
10036050-3 = "점심시간이 지나 복귀했다."
10036050-4 = "앗, 알바 양!"
10036050-5 = "덕분에 여유롭게 쉬고 왔다. 감사를 표하지."
10036050-6 = "다음에 할 일은 뭐지?"
10036050-7 = "딱히 없으니 그냥 편하게 쉬는 걸로 하지!"
10036050-11 = "[ns] (아까 일이 상당히 기억에 남았던 모양이지…….)"
10036050-12 = "아니, 아무 일도 하지 않고 급료를 받을 수는 없는 노릇이다."
10036050-13 = "가서 무대 근처 청소라도……."
10036050-17 = "이봐, 거기! 너, 할 일이 없다고?"
10036050-23 = "잘됐네! 이쪽에 인원이 모자라서 고민이었거든!"
10036050-24 = "사격에 자신 있으면 너도 참가하는 게 어때?"
10036050-26 = "사격? 무슨 일인지는 몰라도, 내 임무는 DJ B.o.B의 보조 및 경호다."
10036050-27 = "자리를 뜰 수는 없어."
10036050-28 = "괜찮아! 괜찮아! 다녀와도 아무 문제 없어!"
10036050-29 = "하지만……."
10036050-31 = "자, 자, 사양 말고!"
10036050-32 = "어, 어……."
10036050-33 = "물총싸움, 분명 재미있을 거라고!"
10036050-38 = "[ns] \"재밌다고 하니 따라가 보는 게 어때?\""
10036050-39 = "아, 알겠다. 선생까지 그렇게 말한다면……."
10036050-40 = "그럼 나중에 보자, 선생."
10036050-44 = "[ns] (그럼 아츠코와 미사키, 히요리 쪽으로 가 볼까…….)"
10036050-47 = "앗, 선생님이다!"
10036050-48 = "어디 갔었어, 선생님? 점심식사는 함께 하고 싶었는데."
10036050-49 = "[s1] \"그게…… 조금 사정이 있어서.\"\n[s2] \"잠깐 볼일이 생겨서…….\""
10036050-52 = "아, 아쉽네요…… 저희, 이벤트 당첨됐는데…… 덕분에 마음껏 먹었거든요, 헤헤."
10036050-53 = "선생님도 같이 계셨으면 좋았을 텐데……."
10036050-54 = "[s] \"괜찮아. 나도 점심은 먹었어.\""
10036050-55 = "식사도 했으니, 다시 삿 쨩이 뭐 하고 있는지 살피러 갈까? 어때?"
10036050-56 = "보나마나 아직 무대 작업 중이겠지."
10036050-61 = "아, 아, 헬멧단에서 공지사항이다!"
10036050-62 = "잠시 후 해변가 경기장에서 각 지부별 최강자를 가리기 위한 물총 대회를 개최한다!"
10036050-63 = "각 지부의 명예, 그리고 푸짐한 우승 상품을 걸고 벌이는 한판 승부니까 많이들 보러 오셔!"
10036050-64 = "이상 안내방송 끝!"
10036050-68 = "[ns] (사오리가 끌려간 곳이 저기구나…….)"
10036050-69 = "물총 대회……? 헬멧단이라면 실탄을 쓸 것 같은 이미지인데."
10036050-70 = "그래도 축제니까, 아픈 건 싫겠지."
10036050-71 = "[s] \"어때? 우리도 보러 가지 않을래?\""
10036050-72 = "하지만 우리, 사오리 언니를 보러 가는 거 아니었나요?"
10036050-73 = "물총 대회를 보러 가도 되는 걸까요……?"
10036050-74 = "[s] \"사오리를 챙기는 것도 좋지만, 축제도 즐겨야지.\""
10036050-75 = "축제에 참가한 사람들 모두가 모이는 분위기인걸."
10036050-76 = "어쩌면 삿 쨩도 대회장 근처에 있을지 몰라."
10036050-79 = "<무법자 해변>에 모여 주신 헬멧단, 그 외 불량하신 여러분! 환영합니다!"
10036050-80 = "축제도 한낮의 태양처럼 그 열기를 더해가는 이때!"
10036050-81 = "축제의 열기는 더하고! 더위는 싹 가시게 해 줄 물총 대회를 준비했습니다!"
10036050-82 = "평소 서로 눈치를 보며 서로의 힘을 가늠해 왔던 헬멧단 각 지부들!"
10036050-83 = "여기! 헬멧단 총연합회야말로 그 최강자를 가리기에 딱 맞는 전장!"
10036050-84 = "각 지부 대항 물총 싸움 대회를 시자아아아아악! 하겠습니다!"
10036050-91 = "여어, 우리 지부 여러분, 들어 둬."
10036050-92 = "우리 파닥파닥 헬멧단은 딱히 나서지 않아도 돼. 그냥 적당히 참가하는 데 의의를 두는 거야. 다들 열 내지 말라고."
10036050-93 = "알겠지?"
10036050-98 = "응, 응~ 적당히 하자고~"
10036050-99 = "(으음……어쩌다 이런 상황이…….)"
10036050-104 = "어차피 이번 대회의 흐름이랄까. 결과는 대강 정해져 있으니까~"
10036050-105 = "흐름과 결과가 정해져 있다……?"
10036050-106 = "어이쿠, 이 이상은 남에게 들리면 좋을 게 없으니. 여기까지."
10036050-107 = "자, 거기 보충 인원도, 알아들었지?"
10036050-108 = "………………."
10036050-109 = "그래. 알아들었다."
10036050-110 = "본의는 아니지만. 이곳까지 와서 전투에 임하게 되었다면 요구받은 대로 최선을 다하도록 하지."
10036050-111 = "봐주는 것 없이, 전력으로 가겠다."
10036050-112 = "……어?! 못 알아들은 것 같은데?!"
10036050-114 = "규칙은 간단합니다!"
10036050-115 = "실제 총기처럼 보이지만, 어디까지나 물총인! 물총 맞나? ……싶지만 역시 물총인 게 분명한! 아무튼 총 이름은 물총인!"
10036050-116 = "그런 총기를 사용, 마구마구 쏴대서! 마지막으로 살아남는 지부가 우승!"
10036050-117 = "그럼 각 지부, 위치로!"
10036050-120 = "우앗…… 안 보여요…… 사람이 너무 많아요……!"
10036050-121 = "구경꾼뿐만 아니라 참가자도 상당한 수야. 하나, 둘, 셋…… 헬멧단 지부가 이렇게 많았던가?"
10036050-122 = "다들 신나서 달려 나왔나 보지."
10036050-123 = "저, 저는 높은 곳에 올라가서 볼게요…… 선생님, 괜찮으시면 조금 도와주세요……."
10036050-124 = "[s3] \"좋아, 나한테 업혀.\"\n[s4] \"영차……!\""
10036050-132 = "헤, 헤헤, 이왕 올려주시는 김에 목말도 태워 주시면 안 될까요……?"
10036050-133 = "[s5] \"……그러자.\"\n[s6] 히요리에게 목말을 태워 준다."
10036050-139 = "헤, 헤헤, 여기가 딱 좋네요…… 일등석이네요……!"
10036050-140 = "눈길을 끌어서 쫓겨나는 건 아닐까 싶지만……."
10036050-141 = "……어라?"
10036050-143 = "왜 그래, 히요리?"
10036050-149 = "저기, 해변가 쪽 '파닥파닥 헬멧단' 깃발을 봐요!"
10036050-150 = "깃발 바로 밑에 사오리 언니가……!"
10036050-155 = "……정말이네."
10036050-156 = "어째 예상외의 곳에서만 발견되는 느낌이……."
10036050-157 = "히익…… 눈빛이 완전 무서운데요…… 완전 진지한 리더 모드인데요……!"
10036050-158 = "무슨 이유인지는 몰라도, 대회에 참가한 모양인걸."
10036050-159 = "응, 축제를 즐기고 있는 것 같아서 다행이야."
10036050-160 = "즐기는…… 걸까?"
10036050-161 = "사오리 언니가 이길 수 있을까요?"
10036050-162 = "어차피 헬멧단의 수준이라고 해 봐야 고만고만할 테니까 걱정은 없는데……."
10036050-163 = "문제는 숫자인가."
10036050-164 = "뭐어, 꼭 우승해야 한다는 법은 없으니까."
10036050-165 = "그냥 삿 쨩이 즐길 수만 있다면 OK 아닐까?"
10036050-168 = "다들 기세등등하구만. 쓸데없지만."
10036050-169 = "뭐, 그냥 분위기 내는 거지. 어차피 우승할 지부는 이미 정해져 있으니까."
10036050-170 = "어디였지? 까칠까칠 헬멧단이랬나? 하여튼, 우리한테 대회라는 건, 전부 짜고 치는 거지."
10036050-171 = "그걸 모르는 사람도 없을 거고."
10036050-172 = "그래도 꽤나 난장판이 벌어질 테니, 보기엔 나쁘지 않을 것 같네."
10036050-176 = "[ns] \"승부 조작……. 이라고?\""
10036050-181 = "……이건 듣고 그냥 넘길 수 없는걸."
10036050-182 = "사, 사오리 언니가 저렇게 열심히 노력하고 있는데! 너무해요!"
10036050-183 = "……아무리 그래도, 리더가 그런 승부 조작 따위에 놀아나게 둘 수는 없지."
10036050-189 = "헤, 헤헤…… 선생님, 목마, 조금 더 태워 주셔야 할 것 같아요……."
10036050-192 = "준비!!"
10036050-194 = "시자아아아악! 하겠습니다!!"
10036050-195 = "흠!"
10036050-199 = "우왓! 빠르다!"
10036050-200 = "시, 시작하자마자?!"
10036050-210 = "다음은?"
10036050-211 = "이쪽이다!"
10036050-216 = "피, 피했어?!"
10036050-221 = "우왁!"
10036050-227 = "아니! 기대도 하지 않던 파닥파닥 헬멧단의 일원이 거세게 모두를 몰아붙이고 있습니다!"
10036050-228 = "뭐야, 저 녀석? 이거 얘기가 다르잖아! 뭐 하는 녀석이야, 대체!"
10036050-229 = "응? 저게 누군지 모른다고?"
10036050-231 = "저 녀석! 사전에 짜둔 이야기는 어떻게 된 거야?!"
10036050-232 = "칫! 어쩔 수 없지! 저 녀석부터 잡고 계획대로 가자고!"
10036050-233 = "좀 짜고 치는 티가 나겠지만 어쩔 수 없지!"
10036050-234 = "우선 둘러싸! 수를 앞세워서 포위하는 거다!"
10036050-236 = "나 한 사람을 잡으려고 협력하는 건가. 전략적으로는 좋은 판단이다만……"
10036050-237 = "헌데 이번 대회는 지부별 대항이 아니었나?"
10036050-244 = "저 녀석부터 탈락시켜!"
10036050-251 = "어라?"
