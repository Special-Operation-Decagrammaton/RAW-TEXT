[translation]
101010-1 = "제1화;프롤로그"
101010-3 = "이 이야기는 전복되었다."
101010-4 = "맥락도, 구성도, 장르도, 의도도, 해석도 모두 파괴되었다."
101010-5 = "의미는 이제 뒤엉키고 뒤섞여 통제되지 못하게 퇴색되었다."
101010-8 = "선생이여."
101010-9 = "지금까지의 이야기는 모두 잊어라."
101010-10 = "지금부터 너에게 벌어질 일은 이제 더 이상 그런 것이 아니다."
101010-12 = "주인공도, 악당도, 사건도, 갈등도 없는 세계."
101010-13 = "해체되어 모든 것이 뒤엉킨 세계."
101010-15 = "맥락도, 구성도, 개연성도, 없는 어떤 작위의 세계."
101010-16 = "마침내 의미를 잃고 제멋대로 날뛰는 이해 불가능한 부조리의 세계."
101010-20 = "아아, 그렇다. 이 세계는 그저 그렇게 존재할 뿐이었다."
101010-21 = "우리는 모두 그것을 망각하고 있었을 뿐."
101010-24 = "그러니 드디어 시작하자."
101010-26 = "이야기가 아닌 이야기를."
101010-28 = "맥락도, 장르도, 개연성도, 핍진성도 모두 사라진 채,"
101010-32 = "이리저리 충돌하고, 날뛰고, 배신하고, 뒤엎고, 전복하는 이야기를."
101010-34 = "이야기라고 부를 수 없는 망가진 이야기를."
101010-36 = "관객을 모독하고 등장인물을 모독하는 이야기를."
101010-37 = "그 반란의 이야기를."
101010-56 = "다음화;파국"
