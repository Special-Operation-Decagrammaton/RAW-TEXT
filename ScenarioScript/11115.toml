[translation]
11115-2 = "적, 후퇴하고 있습니다."
11115-3 = "하지만 이대로라면……."
11115-4 = "동료를 더 불러올 생각인가? 얼마든지 상대해주지."
11115-5 = "자, 잠깐만요! 여러분, 더 싸우면 안돼요!"
11115-6 = "음? 왜 그러지?"
11115-7 = "블랙마켓에서 이렇게 크게 소란을 피우면 이곳을 지배하고 있는 치안기관들이 우리를 발견할지도 몰라요!"
11115-8 = "아우우…… 그렇게 되면 진짜 큰일이니…… #n일단 여기를 벗어나는 걸로……."
11115-9 = "흠……. 알았어, 여기는 우리보다 히후미 쨩이 더 잘 아는 것 같으니 말을 따르자고."
11115-10 = "쳇. 운이 좋은 줄 알라고!"
11115-11 = "이쪽이에요!"
11115-15 = "다음화;블랙마켓으로 2"
