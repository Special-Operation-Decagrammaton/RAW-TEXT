[translation]
10000065-1 = "제6화;축제와 꿈, 그리고"
10000065-2 = "선생님과 함께 하는 피나는 무적입니다!"
10000065-4 = "크윽?! 뭐, 뭐냐고. 이 무식할 정도로 강한 힘은!"
10000065-5 = "제길! 두, 두고 보자!"
10000065-7 = "등을 보이고 도망치다니! 협객의 수치!"
10000065-8 = "앗……. 하지만 여기엔, 피나가 지켜야할 두목이!"
10000065-9 = "으으음! 어, 어쩌면 좋죠!"
10000065-10 = "[s] \"괜찮아. 피나가 해야 할 일을 해.\""
10000065-11 = "과연……! 두목의 말씀대로! 넵! 알겠습니다! 피나! 축제의 평화를 위해! 갑니다!"
10000065-12 = "두목은 먼저 백야당으로 돌아가주세요! 거리는 망량즈로 위험하니까요!"
10000065-15 = "(피나를 배웅한 뒤, 얌전히 백야당으로 복귀하려고 한 그때였다.)"
10000065-21 = "(쫑긋) (쫑긋)"
10000065-23 = "(축제 거리 끝에서 익숙한 실루엣을 발견했다.)"
10000065-26 = "힐끔힐끔. 두리번두리번."
10000065-27 = "샤샤샥……!"
10000065-28 = "이즈나는 지금……. 남몰래 야음을 틈타 잠행하는 한 명의 닌자……!"
10000065-29 = "분명 선생님이 이쯤 어딘가에 있다고……."
10000065-30 = "[s] \"이즈나, 여기서 뭐하고 있어?\""
10000065-31 = "앗, 네. 이즈나는 지금 선생님을 찾고……."
10000065-32 = "히양?! 서, 선생님?!"
10000065-33 = "아, 아뇨! 이즈나는 당황하지 않습니다! 이즈나는 저번에 예고한대로 선생님을 쓰러트리러 왔을 뿐이니까요!"
10000065-34 = "저, 이즈나 그때 돌아가서 생각했어요!"
10000065-35 = "저번에 이즈나가 졌던 건, 선생님을 속이는 방해꾼들까지 우르르 튀어나온 탓이라는 걸!"
10000065-36 = "그러니 여기선 닌자답게! 남몰래! 혼자서 선생님을 쓰러트리면 되는 거예요!"
10000065-37 = "각오하세요. 선생님!"
10000065-38 = "[s] \"그럼, 일단 산책이라도 할까?\""
10000065-39 = "네! 좋아요!"
10000065-40 = "……가 아니라, 핫?! 이, 이즈나는 선생님을 쓰러트리러 왔다고, 방금……!"
10000065-41 = "[s] \"산책, 싫어?\""
10000065-42 = "으헷, 아, 아니요. 그런 건 아닌데…… 후, 후엥?"
10000065-45 = "와, 선생님, 달고나래요!"
10000065-46 = "이 달콤한 냄새는……. 솜사탕!"
10000065-48 = "앗?! 야키소바! 야키소바도 팔고 있어요!"
10000065-51 = "에헤헷, 맛있어요! 앗, 선생님도 한 입 드실래요?"
10000065-53 = "에헤헷, 이즈나이즈나 캥캥~"
10000065-54 = "백야앵제는, 이즈나도 정말정말 좋아하는 축제니까!"
10000065-55 = "이렇게 선생님과 함께 즐기는 것만으로도 엄청 기뻐요!"
10000065-56 = "[s] \"하지만 이 즐거운 축제가 자칫하면 중지될지도 몰라.\""
10000065-57 = "후엥? 가, 갑자기 무슨 말씀이신가요?"
10000065-58 = "[s1] \"축제를 망치고 싶어하는 사람이 있어.\"\n[s2] \"이즈나의 고용주 말이야.\""
10000065-59 = "축제를 망치고 싶어하는 사람……. 고용주가……."
10000065-60 = "축제를 망치고 싶어하는 사람……. 고용주가……."
10000065-61 = "하, 하지만 이즈나는 그저 고용주의 명령을 따라서……."
10000065-62 = "어디까지나 사업을 방해하는 방해꾼들을 쓰러트리려고……."
10000065-63 = "그게 축제를, 망치게 된다? (당황) (혼란)"
10000065-65 = "!! (퍼엉)"
10000065-66 = "[s] \"이즈나, 혹시 고용주가 누군지 말해줄 수 있어?\""
10000065-67 = "이, 이즈나의 고용주는…… (꿀꺽)"
10000065-68 = "아니요! 고용주를 함부로 발설하는 건……! 닌자로선 해선 안 될 일이니까요!"
10000065-69 = "이, 이, 이즈나는 훌륭한 닌자를 꿈꾸고 있으니까!"
10000065-70 = "아무리 선생님이 물어본다고 해도……!"
10000065-71 = "[s] \"그렇구나. 알았어.\""
10000065-72 = "……네?"
10000065-73 = "[s3] \"이즈나가 말하고 싶지 않다면, 그걸로 괜찮아.\"\n[s4] \"그건 이즈나가 결정한 일이니까.\""
10000065-74 = "이즈나가 결정한……."
10000065-75 = "이즈나가 결정한……."
10000065-76 = "[s5] \"하지만 선생님으로서 축제를 방해하게 둘 순 없어.\"\n[s6] \"그러니 이즈나를 막을 거야.\""
10000065-77 = "핫……! 선생님과 이즈나는 역시 숙명의……!"
10000065-78 = "핫……! 선생님과 이즈나는 역시 숙명의……!"
10000065-79 = "이, 이즈나. 이만 물러가보겠습니다! 이번엔 이렇게 같이 축제를 즐겨버렸지만!"
10000065-80 = "다음번엔 다를 거예요! 다음번엔!"
10000065-81 = "[s] \"응, 잘 가. 또 같이 놀자. 이즈나.\""
10000065-82 = "!!"
10000065-83 = "에헤헷, 네, 그럼, 선생님 나중에 또!"
10000065-87 = "[ns] \"역시, 이즈나는 고용주의 명령에 따라…….\""
10000065-91 = "아, 찾았다. 찾았어. 샬레의 선생님."
10000065-92 = "호위 하나 없이 이 무법천지에 홀로 있다니, 부주의함다!"
10000065-93 = "다치고 싶지 않다면 순순히 투항해라! 샬레의 고문선생!"
10000065-94 = "괜히 반항하다간 아픈 꼴을 당할 검다!"
10000065-95 = "우리 보스께서 당신에게 볼일이 있으시다거든!"
10000065-96 = "[s] \"그래? 그럼 어쩔 수 없지.\""
10000065-97 = "하하하! 역시나 무의미하게 반항을……!"
10000065-98 = "응?!"
10000065-99 = "순순히 따라주시는 검까?!"
10000065-100 = "으, 으으음……. 뭔가, 계획대로 일이 풀리지만, 뭔가 이건 아닌 거 같은……."
10000065-101 = "에라, 모르겠다! 데려가자!"
10000065-102 = "넵!"
10000065-106 = "후, 후아아……. 선생님, 또 어려운 말을……."
10000065-107 = "……헷."
10000065-108 = "에헤헷. 하지만, 선생님과 맛본 야키소바……. 맛있었어요."
10000065-109 = "이즈나를 막겠다고 했지만, 그래도 그다음에 잘 가……라고 다음에 또 만나자고……."
10000065-110 = "응! 이즈나, 지지 않아요! 다음번엔 반드시 제 손으로 선생님을……!"
10000065-117 = "어? 망량즈들이랑 같이 가는 사람, 설마……."
10000065-118 = "……선생님?"
10000065-120 = "넵! 수고하셨습니다!"
10000065-121 = "으으, 가, 간신히 끝났다……."
10000065-122 = "고생하셨습니다! 부장! 여기 음료수입니다!"
10000065-123 = "아, 고마워. 피나."
10000065-125 = "(꿀꺽꿀꺽) 푸하아~ 시원하다~"
10000065-126 = "응? 그런데 피나."
10000065-127 = "네! 부장……!"
10000065-128 = "……지금 혼자 있는 거야? 같이 있던 선생님은?"
10000065-130 = "헉?!"
10000065-134 = "두목?! 두목의 실종이라니! 미처 눈치채지 못했습니다!"
10000065-135 = "피나……! 통한의 실책입니다!"
10000065-136 = "뭐? 잠깐 그렇단 말은……."
10000065-137 = "미아가 된 꼬마 아가씨에게 부모님을 찾아주자마자 선생님이 미아가 됐다고?!"
10000065-138 = "크, 큰일이다아아!!"
10000065-139 = "선생님은 어른인데도 미아가 되는구나~"
10000065-140 = "츠바키 쨩. 태평하게 있을 때가 아니에요!"
10000065-141 = "이러는 사이에, 망량즈가 선생님을 노리기라도 했다간……."
10000065-142 = "읏!! 망량즈라면 그러고도 남을 거야! 이러고 있을 때가 아니야."
10000065-143 = "피나, 그리고 수행부 너희들!"
10000065-144 = "더 늦기 전에 얼른 선생님을 찾아서……!"
10000065-145 = "(띠링)"
10000065-147 = "어라? 이건……."
