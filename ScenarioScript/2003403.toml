[translation]
2003403-1 = "Do It Yourself!"
2003403-2 = "그래서 오늘은 이렇게, 떡 만들기 체험 교실을 찾아왔습니다★"
2003403-3 = "[s] \"……여러 가지 의미로 아카리 답네…….\""
2003403-4 = "후후. 아쉬우면 직접 자신의 손으로 해 보라는 말도 있잖아요?"
2003403-10 = "저희 떡 체험관에 오신 것을 환영합니다."
2003403-11 = "아유, 그럼요. 그럼요. 음식에 들어갈 떡이 부족하다면, 직접 떡을 만들어 먹는 게 최고죠!"
2003403-12 = "갓 만든 떡이 얼마나 맛있는데요! 거기에 자기가 만들었다는 보람까지 더해지면, 그 맛은 한층 더 각별하답니다!"
2003403-13 = "[s] \"그런데…… 그 옷으로 괜찮겠어?\""
2003403-14 = "네? 아하. 이 기모노 말씀이군요."
2003403-15 = "후훗. 기모노를 입고 있다고 해서, 떡을 만들지 말라는 법은 없잖아요?"
2003403-16 = "거기에 만일 어딘가가 상하거나 망가지면, 수선을 부탁드리거나 아예 새로 한 벌 더 마련하면 되는 일이고요."
2003403-17 = "저에게는 옷보다도, 맛있는 떡을 충분히 먹을 수 있다는 게 더 중요하답니다?"
2003403-18 = "[s] \"……응. 아카리가 그렇다면야…….\""
2003403-19 = "그러면, 선생님. 시작해 볼까요?"
2003403-22 = "[wa:600]― [log=아카리 새해]휴……[/log]"
2003403-23 = "[wa:1230]― [log=아카리 새해]생각보다, [wa:1120]힘이 필요하네요.[/log]"
2003403-26 = "― [log=아카리 새해]괜찮답니다. [wa:850]선생님.[/log]"
2003403-27 = "[wa:1150]― [log=아카리 새해]더 할 수 있어요.[/log]"
2003403-30 = "[wa:1200]― [log=아카리 새해]걱정해 주셔서 기뻐요……[/log]"
2003403-31 = "[wa:2280]― [log=아카리 새해]하지만 역시, [wa:1920]기대되는 건 [wa:390]어쩔 수 없네요.[/log]"
2003403-34 = "[wa:730]― [log=아카리 새해]어떤 떡이 만들어질지.[/log]"
2003403-35 = "[wa:2560]― [log=아카리 새해]그걸로 [wa:880]어떤 음식을 만들 수 있을지…….[/log]"
2003403-38 = "[wa:900]― [log=아카리 새해]……[wa:500]그걸,[/log]"
2003403-39 = "[wa:700]― [log=아카리 새해]선생님과 함께 먹을 수 있다고 생각하면…….[/log]"
2003403-42 = "[wa:730]― [log=아카리 새해]……[wa:500]저기, [wa:230]선생님?[/log]"
2003403-45 = "― [log=아카리 새해]떡이 만들어지면,[/log]"
2003403-46 = "[wa:1200]― [log=아카리 새해]먼저 먹어 주셨으면 좋겠어요.[/log]"
2003403-49 = "― [log=아카리 새해]괜찮으시죠?[/log]"
2003403-52 = "아유, 대단하시네요! 처음 만들어 보는 게 맞나요?"
2003403-56 = "찰기도 적당하고, 그러면서도 부드러움을 잃지 않았어요!"
2003403-57 = "이 떡으로 만든 오조니는…… 세상에. 저도 한번 먹어보고 싶어지네요!"
2003403-58 = "처음에는 오조니에 넣기 위해서 만들자고 결심했지만……."
2003403-59 = "이렇게 된 이상, 이 떡으로 만들어 먹을 수 있는 요리는 한 번씩 다 만들어 봐야겠네요."
2003403-60 = "[s] \"그런데…… 아카리가 요리를 직접 하는 거야?\""
2003403-61 = "으음~ 제가 직접 요리까지 할 수 있었다면 더할 나위 없겠지만."
2003403-62 = "어쩔 수 없죠! 여기에서는 저희 미식연구회와 좋은 관계를 맺고 있던 식당 중 한 곳에 부탁드릴 수밖에요."
2003403-63 = "[s] (정확히는, 아직 아무 일도 일어나지 않은 식당이려나…….)"
2003403-64 = "그러면, 선생님. 같이 가실까요?"
2003403-69 = "오조니에 오시루코, 오하기와 이소베야키……. 후후. 떡으로 만들 수 있는 요리는 엄청나게 많으니까요!"
2003403-71 = "(아카리와 함께, 온갖 떡 요리를 맛보았다.)"
2003403-72 = "(……사실은 절반도 다 못 먹었지만, 그래도 아카리의 떡은 정말로 맛있었다.)"
