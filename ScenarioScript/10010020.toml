10010020-1 = "제2화;마술사의 탑으로"
10010020-5 = "……저기……. 계신가요……?"
10010020-6 = "……."
10010020-7 = "……아무도 안 계신 걸까요? 시미코 씨 말로는 항상 여기 계신다고 했었는데……."
10010020-11 = "아무도 안 계신가요……? 들어가도 괜찮을까요……?"
10010020-15 = "……어라……. 열려 있네요?"
10010020-16 = "실례합니다……?"
10010020-21 = "저기……. 아무도 안 계시나요……? 이렇게 마음대로 들어와도 괜찮은 걸까요……."
10010020-22 = "[s1] \"괜찮아. 출입증은 받았으니까.\"\n[s2] \"시미코가 괜찮다고 했으니 괜찮을 거야.\""
10010020-23 = "그, 그랬었죠……. 시미코 씨께서는 분명 그렇게 말씀해주시긴 했었죠……."
10010020-24 = "그, 그랬었죠……. 시미코 씨께서는 분명 그렇게 말씀해주시긴 했었죠……."
10010020-25 = "'고서관은 부장님의 전유물이 아니에요!'라고 하시면서……."
10010020-26 = "오히려 가급적 더 많은 사람이 이용할 수 있게 해야 한다……라고……."
10010020-27 = "그렇긴 하지만……. 저기, 정말 아무도 안 계신가요……?"
10010020-33 = "……히이이익!?"
10010020-34 = "[s] \"……??\""
10010020-35 = "……? 이 목소리는……?"
10010020-36 = "뭐, 뭐야……!? 누, 누구세요……!? 도둑……!?"
10010020-37 = "네, 네!? 아, 아뇨! 아니에요! 그럴 리가요!!"
10010020-38 = "저희는 수상한 사람이 아니에요! 여, 여기 출입증도 있다고요……!"
10010020-39 = "저희는 그저 이곳에 계시다는 도서부 부장님을 뵈러……!"
10010020-41 = "추, 출입증……? 도서부 부장을 만나러 왔다고요……?"
10010020-42 = "……그런데 도서부 부장은 왜요?"
10010020-43 = "[s3] \"책 복원에 관한 일로 추천을 받았어.\"\n[s4] \"고서에 관한 전문가가 필요해서 찾아왔어.\""
10010020-44 = "……그렇군요. 그런데 그 이전에 누구신지……."
10010020-45 = "……그렇군요. 그런데 그 이전에 누구신지……."
10010020-46 = "한 분은 시스터후드 쪽 분이신 것 같은데, 다른 한 분은 도통 잘……."
10010020-48 = "……아아. 소개가 늦었네요. 죄송합니다."
10010020-49 = "말씀하신 대로 저는 시스터후드 소속의 히나타라고 해요. 그리고 이분은……. 선생님이세요."
10010020-52 = "……예?"
10010020-53 = "……선생님이라고요? 선생님이라면 그…… 샬레에 오셨다는……. 그 선생님……?"
10010020-54 = "선생님……. 선생님……."
10010020-55 = "으음……. 선생님이라……. 으으음……."
10010020-67 = "[ns5] \"아. 나타났다.\"\n[ns6] \"안녕.\""
10010020-68 = "……아……안녕하세요. 선생님……."
10010020-69 = "……아……안녕하세요. 선생님……."
10010020-74 = "저는 여기……. 고서관을 관리하고 있는……. 도서부의 부장 코제키 우이……라고 합니다……."
10010020-78 = "그……. 그런데 선생님께서 제게는 무슨 일로……?"
10010020-79 = "[s7] \"네가 도서부 부장인 우이로구나.\"\n[s8] \"반갑소. 당신이 이곳의 마술사요?\""
10010020-80 = "일단 그렇기는 한데요……."
10010020-81 = "으, 으으……. 누가 또 그런 소리를……. 싫어하는 별명인데……."
10010020-82 = "……아. 그 출입증……. 분명 대도서관에서 발행한 거……."
10010020-83 = "……으으……. 시미코 녀석……. 또 이런 식으로 사람을 보내다니……."
10010020-84 = "몇 번이나 싫다고 했는데……. 일이 있으면 본인이 오거나 다른 애들을 보내면 될 것을……."
10010020-85 = "나중에 다시 한번 따끔하게 한마디 해야겠어. ……전혀 먹히지는 않겠지만……. 으……."
10010020-86 = "……아. 죄송합니다. 물론 선생님에 대한 이야기는 아니었어요."
10010020-87 = "그 옆의 시스터 분은……."
10010020-93 = "뭐, 해당 사항일 수도 있겠지만……."
10010020-94 = "예!? 저는 해당사항인 건가요!? 싫은 쪽이신 건가요!?"
10010020-95 = "그야 결국 바깥사람이잖아요. 시스터든 뭐든……. 바깥사람들은 거의 거기서 거기니까……."
10010020-96 = "그리고 부탁이니 조금만 조용히 해주시겠어요……? 여기는 소리가 잘 울리거든요."
10010020-97 = "그, 그렇군요……. 죄송합니다……."
10010020-98 = "……후우. 아무튼 본론으로 돌아가서……."
10010020-99 = "고서 복원에 관한 이야기로 찾아오셨다고요. 오래된 책이라도 발굴하신 건가요……?"
10010020-103 = "……네?"
10010020-104 = "발굴하긴 했는데……라니요? 뭔가 문제라도 생긴 건가요?"
10010020-105 = "……경전'이었던' 것? ……도대체 그게 무슨 말씀이신지……."
10010020-106 = "[s] 조각조각 난 경전을 꺼내 보여준다."
10010020-112 = "……음? 이건……?"
10010020-113 = "……어."
10010020-117 = "……아. 어어……. 음……. 어으…… 으……?? 흐엇……!?"
10010020-119 = "서, 선생님……? 우, 우이 씨의 상태가……!"
10010020-120 = "괜찮으신 걸까요? 안면 근육과 팔이 떨리고 있으신데요……!?"
10010020-125 = "[ns9] \"……뭔가 위험한 느낌!\"\n[ns10] 말없이 귀를 막는다."
10010020-126 = "선……."
10010020-127 = "선……."
10010020-128 = "으아아아아아아-!?"
10010020-129 = "……히이익!?!?"
10010020-131 = "대, 대대, 대대대 대체 무슨! 무, 무슨 짓을……!?"
10010020-132 = "뭐, 뭔가요. 이게!? 이게 대체 무슨 짓인가요!? 어쩌다가 이렇게 돼 버린 건가요, 이 아이!!!"
10010020-133 = "우, 우이 씨. 우선 진정하시고……."
10010020-134 = "지, 지지, 진정? 진정이라고 했어요, 지금? 이걸 보여주고……?"
10010020-135 = "산산조각이 났잖아요!! 어떻게 진정을 해요!? 일부러 망치려고 해도 이렇게는 힘들겠는데요!"
10010020-136 = "게다가 이 아이, 그냥 봐도 그냥 고서가 아니라 유물 수준의 고서잖아요! 경전이잖아요!?"
10010020-137 = "아무리 적게 잡아도 고대 공의회에서나 썼을 법한 나이 같은데요!?"
10010020-138 = "이쯤 되면 거의 이 학교의 보물급 아닌가요? 교보(校寶) 아닌가요, 이 아이!?"
10010020-139 = "그런 애가 어떻게 이런 꼴이……!!"
10010020-140 = "[s11] \"그걸 보고 그걸 맞춰낼 수 있다니…….\"\n[s12] \"확실히. 의심할 여지 없이 전문가.\""
10010020-141 = "우, 우선 저희 말씀을 들어주세요. 우이 씨! 그러니까 저희도 어떻게든 고치고 회복시키려고……."
10010020-142 = "우, 우선 저희 말씀을 들어주세요. 우이 씨! 그러니까 저희도 어떻게든 고치고 회복시키려고……."
10010020-143 = "저기요! 회복은 부상자에게 쓰는 말이고요! 이건 사망자라니까요!? 회복이 아니라 죽은 자의 소생이라니까요!?"
10010020-144 = "어쩌다가, 어쩌다가 이런……. 이런 끔찍한 일이……!"
10010020-145 = "이 아이가 가진……. 페이지 한 장 한 장 품어져 있었을 기록들의 가치는 그야말로……!"
10010020-146 = "[s13] \"진정해. 우선 심호흡을 하고…….\"\n[s14] \"그래서 더더욱 널 찾아온 거야. 고서관의 마술사님.\""
10010020-147 = "……!!"
10010020-148 = "……!!"
10010020-152 = "……후, 후우. 후우우……."
10010020-153 = "스읍……. 후우……. 후우우우우……."
10010020-154 = "……죄, 죄송합니다……. 선생님 앞인데, 저도 모르게 그만……."
10010020-155 = "그, 그렇군요. 일단……. 네. 그렇죠. 저 아이는 되살려야만 하겠죠. 무슨 수를 써서라도……."
10010020-156 = "……우선 선생님. 그럼……. 괜찮으시다면……. 자세한 이야기를 좀 들어볼 수 있을까요……?"
10010020-157 = "이 아이가 정확히 어떤 아이고, 어디서 발굴되었고, 어떻게 된 건지……."
10010020-158 = "하나도 남김없이……. 전부 다요."
10010020-159 = "[ns] 자초지종을 설명해 준다."
10010020-161 = "……그렇군요. 네……."
10010020-169 = "그렇게 된 거였군요."
10010020-170 = "솔직히 듣고도 믿기 힘들 정도로 어처구니없는 일이지만……."
10010020-171 = "죄송합니다……."
10010020-172 = "……뭐……. 선생님께서 직접 보셨다고 하셨으니, 그 부분에 있어서는 틀림이 없겠지요."
10010020-173 = "그나저나 내일 아침이 경전 낭독 행사라……."
10010020-174 = "역시 바깥사람들의 사고는 도무지 좋아할 수가 없네요. 발굴한 지 이틀밖에 안 된 아이를? 정말로?"
10010020-175 = "이 아이의 컨디션과 보존 상태, 발굴 직후의 응급처치 같은 것은 다들 안중에도 없나 보죠?"
10010020-179 = "물론 트리니티의 경전들은 오래된 아이들이라 해도 대체로 내구성 처리들이 잘 돼 있어요."
10010020-180 = "하지만 언제나 예외는 존재하고, 겉보기에는 아주 멀쩡해 보이지만……. 속으론 심각한 병을 앓고 있는 아이들도 가끔 존재해요."
10010020-181 = "그러니 오래된 고서들은 찾아내자마자 그런 부분들에 하자가 없는지 면밀히 검수를 해야만 해요. 이 아이도 그래야만 했죠."
10010020-182 = "……그렇지만 그러지 않았네요. 일단 겉보기에 멀쩡했고, 발굴 당시에는 튼튼했을 테니까요."
10010020-183 = "아마도 이 아이는 모종의 이유로 그 당시 그런 내성 처리가 제대로 안 된 상태였을 거고……."
10010020-184 = "오히려 사실 진즉 썩어야 했는데……. 발굴 전에는 공기가 거의 통하지 않는 장소에 보존돼 있어 괜찮았던 걸 거예요."
10010020-187 = "그게 이제 발굴돼 세상으로 나오면서……. 급격히 부식화가 이루어진 거고……."
10010020-188 = "저 시스터 님이 그때 부서뜨리지 않았더라도, 몇 주 지나지 않아 알아서 부서졌겠죠."
10010020-190 = "……그, 그런……. 그럴 수가……."
10010020-191 = "뭐, 공개할 당시까지만 멀쩡하면 된다……라는 발상이었다면 그럴 수는 있었겠지만……."
10010020-192 = "아마 거기까지 생각하지도 않았을 거 같네요. 그냥 무사안일주의, 안전불감증에 따른 결과."
10010020-193 = "……어쨌든 이렇게 돼 버린 이상, 단도직입적으로 말해서 이 아이는 거의 가망이 없어요."
10010020-194 = "일반적인 방법으로는……. 불가능한 선이니까요."
10010020-195 = "[s15] \"역시 너무 무리한 부탁이었던 거구나.\"\n[s16] \"……갑자기 이런 부탁을 해서 미안해.\""
10010020-201 = "……그렇지만."
10010020-202 = "……?"
10010020-203 = "[s] \"……그렇지만?\""
10010020-205 = "네. 그렇지만……. 그렇다고 해도, 이대로 놔둘 순 없겠죠."
10010020-206 = "말씀드렸듯 이 아이가 가진 내용의 가치는, 그렇다고 해서 버릴 만큼 가벼운 게 아닐 테니까요."
10010020-207 = "가벼운 게 아니라니……. 그, 그야 당연히 경전이니까……."
10010020-208 = "제발. 생각해 보세요. 그런 이야기가 아니잖아요? 이상한 부분들이 한두 가지가 아니라고요!"
10010020-214 = "굳이 시스터후드 주관의 공개 행사를 멀쩡한 대성당 놔두고 '교외의 고성당 유적'에서 한다?"
10010020-215 = "유물이니까 유적지에서 하겠다? 정말 단순히 그런 이유로, 그 고귀하신 트리니티의 고위층분들이 모두 행차하신다?"
10010020-216 = "진심으로……. 그게 말이 된다고 생각하시는 건 아니시죠?"
10010020-219 = "게다가 그런 경전의 상자를 이송하는데, 오히려 경전을 읽을 수도 없는 시스터님께 맡긴다고요?"
10010020-220 = "여기까지 가면 이미 수상쩍지 않다는 쪽이 억지잖아요? 그렇지 않나요?"
10010020-222 = "자세한 내용은 저도 봐야 알겠지만, 아무튼 이건 아주 중요한 내용이면서 동시에……."
10010020-223 = "[s] \"……아무에게나 보여줄 수 없는 내용.\""
10010020-224 = "아무래도 그렇겠죠……. 어느 정도의 비밀인지는 아직 확신할 수 없지만……."
10010020-225 = "어쩌면 트리니티의 밝혀지지 않은 역사가 담겼을 수도 있는……. 그런 레벨의 아이예요."
10010020-231 = "……<물이끼 아교>."
10010020-232 = "……네?"
10010020-233 = "[s] \"물이끼 아교?\""
10010020-235 = "네. 물이끼 아교. 그리고 <정성약>이 필요해요. 복원을 위해 이 책의 제작 방식을 그대로 따라야 하거든요."
10010020-236 = "정성약은 아마도 전문 병동에서 구하실 수 있을 거예요. 그리고 아교는……."
10010020-237 = "……지금 시대에는 새로 구할 수 없지만, 오래된 건물의 창틀 같은 데에서도 사용됐으니, 구해 오시면 제가 녹여서 쓰겠습니다."
10010020-238 = "사실 따지고 보면 이 건물도 그런 건물이긴 하지만……. 그렇다고 여길 부술 순 없으니까요."
10010020-239 = "어쨌든 구해만 와 주신다면……. 이후에는 저도 어떻게든 해볼게요. 복원 작업……."
10010020-240 = "……!! 우, 우이 씨……."
10010020-241 = "착각하지 말아 주세요. 시스터후드의 사정이나 높으신 분들 관심사 따위는 제가 알 바 아니거든요."
10010020-242 = "그저 저도, 이런……. 이런 귀중한 아이가, 이대로 사라져버리는 걸 바라지는 않으니까요."
10010020-248 = "선생님의 부탁이시기도 하고요……. 제가 할 수 있는 일이긴 하니까……."
10010020-249 = "[s17] \"고마워, 우이.\"\n[s18] \"반드시 구해 올게.\""
10010020-250 = "네, 네. ……그럼 잘 부탁드립니다."
10010020-251 = "네, 네. ……그럼 잘 부탁드립니다."
