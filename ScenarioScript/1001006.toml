[translation]
1001006-1 = "지하철"
1001006-2 = "D.U. 지하철 역사"
1001006-5 = "어라, 선생님?"
1001006-6 = "[s] \"시로코? 여긴 웬일이야?\""
1001006-8 = "아아, 응. 개인적인 볼일로……."
1001006-9 = "무슨 볼일이냐고?"
1001006-10 = "좀 장거리 라이딩을 계획하고 있거든. 일단 가볍게 400km 정도."
1001006-11 = "그래서 좀 멀리까지 나와서 코스를 체크하고 있었어."
1001006-12 = "응? 너무 길지 않냐고?"
1001006-13 = "음……. 철야를 각오하고 달리면 24시간 안에 주파할 수 있긴 해."
1001006-14 = "선생님은 퇴근하는 중이었어?"
1001006-15 = "응? 아비도스 자치구에 볼일이 있어서?"
1001006-16 = "아아. 응. 그렇구나……."
1001006-17 = "그러고보니 선생님이 출근하는 지하철이었네. D.U.에 오게 되면서 혹시라도 만날 수 있지 않을까 했는데."
1001006-18 = "……음. 딱히 의도한 것은 아닌데. 만나버렸네."
1001006-19 = "……."
1001006-20 = "말해두지만 우연이야."
1001006-21 = "……."
1001006-22 = "[s] \"……우연히 만났으니 그럼 같이 돌아갈까?\""
1001006-23 = "음……."
1001006-25 = "(시로코와 함께 지하철로 아비도스 중앙역까지 함께 돌아갔다.)"
