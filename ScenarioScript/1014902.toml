[translation]
1014902-1 = "ダイバーと安全対策"
1014902-2 = "シャーレ執務室"
1014902-3 = "（ココロのシャーレ当番の日――）"
1014902-8 = "こんにちは。先生……！"
1014902-9 = "ダイビング部の[ruby=とうみ]渡海[/ruby]ココロです。#n今日は一日……どうぞよろしくお願いしますっ！"
1014902-10 = "[s1] \"そんなに緊張しなくて大丈夫だよ。\"\n[s2] \"こちらこそよろしくね、ココロ。\""
1014902-13 = "は……はい！"
1014902-14 = "オデュッセイアを離れるのはほぼ1年ぶりなので……#n少し、力んじゃってたみたいです。"
1014902-18 = "……D.U.の景色もずいぶん変わりましたね。"
1014902-19 = "[s3] \"最近は、色々と移り変わりが激しいよね。\"\n[s4] \"私も街並みの変化にはびっくりしてるよ。\""
1014902-22 = "目まぐるしく変わる景色を見ていると……すごいと思う反面、少し怖くなります。"
1014902-23 = "この景色の中には、まだ見ぬ危険が潜んでいるんじゃないかって……。"
1014902-24 = "それはさておき！今日は何をしましょうか？"
1014902-25 = "[s] \"そうだね……。\""
1014902-29 = "[ns5] \"オフィスが結構散らかってるから……。\"\n[ns6] \"備品の片づけを頼めるかな？\""
1014902-32 = "分かりました！任せてください！"
1014902-40 = "先生、この机の角なんですが……。"
1014902-41 = "[s] \"うん？何か問題でもあった？\""
1014902-42 = "見てください。角が鋭いです。それに、鉄製ですし……。"
1014902-43 = "安全のために、コーナーガードをつけましょう。"
1014902-44 = "転んでしまったら、大怪我をしてしまいます。"
1014902-45 = "[s7] \"そんな、まさか……。\"\n[s8] \"かなりレアケースだと思うけど……。\""
1014902-48 = "うぅ……。"
1014902-52 = "……そんなこと、あります！"
1014902-53 = "万が一、事故が起きたら取り返しがつかないんです！"
1014902-54 = "それに、先生は弾丸一発で大怪我になってしまうくらい弱いと聞いています。"
1014902-55 = "安全対策を怠ったことで、先生が怪我を負ったら……みんなはどう思うでしょうか？"
1014902-56 = "[s] \"じ、じゃあ、お願いしようかな……。\""
1014902-57 = "はい、お任せください！"
1014902-59 = "（ココロはすぐさまオフィスの至る所に安全装置を設置しはじめた)"
1014902-62 = "先生。トイレの前の床ですが、かなり滑りやすくなっています。"
1014902-63 = "転倒事故のほとんどはトイレや浴室で起こるんです。マットを敷きましょう。"
1014902-64 = "倉庫で見つかったラグを使ってもいいでしょうか？"
1014902-68 = "このテレビ、ネジ一本で支えられてる……？"
1014902-69 = "もし衝撃で頭の上に落ちてきてしまったら……うぅ……。"
1014902-70 = "ネジをもっと――いや、いっそのこと固定バンドを使いましょう！"
1014902-77 = "（ココロの指示に従い、オフィスのあちこちに安全装置を取りつけた）"
1014902-78 = "（点検は思ったより時間がかかり、終わる頃には夕方になっていた）"
1014902-80 = "……これで、ある程度対策はできたと思います。"
1014902-81 = "えっと、残りの危険要素は……。"
1014902-85 = "ひゃっ！"
1014902-86 = "[ns9] \"ごめん、冷たかった？\"\n[ns10] \"飲み物を持ってきたよ。\""
1014902-89 = "……お心遣い、ありがとうございます。"
1014902-91 = "ふぅ……。"
1014902-92 = "気付いたら、もうこんな時間ですね……。"
1014902-93 = "ごめんなさい。少しやりすぎてしまいました。"
1014902-94 = "[s] \"やりすぎ？そうかな？\""
1014902-95 = "はい。普段は言葉一つ言うにも慎重になるのに……。"
1014902-96 = "ダイビング教育の名残で、安全に関わることとなると……。#nちょっと興奮してしまって……。"
1014902-97 = "暴走してしまうというか……。"
1014902-98 = "今日だって、先生に無理強いしてしまって……。"
1014902-99 = "[s] \"失礼だなんて思ってないよ。\""
1014902-103 = "[ns] \"おかげで事故防止できたんだから。\""
1014902-104 = "でも……。"
1014902-105 = "こういうときだけ騒いでしまうのは……傍から見ると、変だと思うのですが……。"
1014902-106 = "[s] \"ううん、それもココロの魅力だと思うよ。\""
1014902-110 = "[ns] \"何か一つでも欠けたら、それはココロじゃないし。\""
1014902-112 = "………。"
1014902-113 = "先生……その……。"
1014902-118 = "それ……無自覚、ですか？"
1014902-119 = "[s] \"え？なんかまずいこと言った？\""
1014902-120 = "そうではなくて……。"
1014902-121 = "……シャーレの一番の危険要素は先生かも。"
1014902-123 = "（その後、なぜかココロから警戒の視線を向けられながら、仕事を続けた……）"
