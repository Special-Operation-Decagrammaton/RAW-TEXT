[translation]
1014902-1 = "다이버와 위험 방지 대책"
1014902-2 = "샬레 집무실"
1014902-3 = "(샬레의 당번으로 코코로가 방문하기로 한 어느 날……)"
1014902-8 = "아, 안녕하세요. 선생님……!"
1014902-9 = "오디세이아 다이빙부의 토미 코코로입니다. 오늘 하루…… 잘 부탁드릴게요!"
1014902-10 = "[s1] \"그렇게 너무 긴장할 필요 없어.\"\n[s2] \"오늘 하루, 잘 부탁할게. 코코로.\""
1014902-13 = "아, 네…… 넵!"
1014902-14 = "원양 항해 이후로 오디세이아 학원을 벗어난 건 거의 1년 만이라……#n조금, 긴장을 한 것 같네요."
1014902-18 = "……그 동안 D.U.의 풍경도 꽤 많이 바뀌었네요."
1014902-19 = "[s3] \"그러게. 요새는 뭐든지 빨리빨리 변하니까.\"\n[s4] \"나도 가끔씩 거리의 변화를 인지할 때마다 깜짝 놀라곤 해.\""
1014902-22 = "이렇게 정신 없이 바뀌는 풍경을 보고 있노라면 신기하기도 하지만, 조금 걱정이 되기도 해요."
1014902-23 = "이 새로운 풍경에는 어떤 새로운 위험이 있을까 싶기도 하고……"
1014902-24 = "참. 그래서, 오늘은 어떤 일을 도우면 될까요?"
1014902-25 = "[s] \"특별히 부탁할 것이라면……\""
1014902-29 = "[ns5] \"며칠동안 자리를 비웠더니 집무실이 지저분해졌는데.\"\n[ns6] \"이 주변의 집기 정리를 부탁해도 괜찮을까?\""
1014902-32 = "네, 맡겨주세요……!"
1014902-40 = "그런데 선생님, 이 책상 모서리는 이대로 두어도 괜찮은가요?"
1014902-41 = "[s] \"무슨 문제라도 있어?\""
1014902-42 = "이 철제 책상의 모서리는 너무 날카롭게 다듬어져 있는데……"
1014902-43 = "실수로 이 위에 넘어지기라도 크게 다칠 것 같은데요."
1014902-44 = "안전을 위해서라도 모서리 보호대를 설치해야 하지 않을까요?"
1014902-45 = "[s7] \"에이, 설마.\"\n[s8] \"설마 우연히 그 위에 넘어지는 일이 생기겠어?\""
1014902-48 = "그, 그렇지……"
1014902-52 = "……그렇지 않아요!"
1014902-53 = "가능성은 희박하더라도, 만에 하나 사고가 발생한다면 결과는 돌이킬 수 없다고요!"
1014902-54 = "더군다나 선생님은 총알 하나로도 목숨이 위태로울 만큼 연약한 분이라고 들었는데……"
1014902-55 = "안전 조치를 제대로 하지 않아 선생님이 크게 다치신다면, 다들 어떻게 생각하겠어요?"
1014902-56 = "[s] \"그, 그럼…… 조치를 부탁해도 괜찮을까?\""
1014902-57 = "네. 제게 맡겨주세요!"
1014902-59 = "(그 후, 코코로는 곧바로 집무실 곳곳에 안전 장치를 설치하기 시작했다.)"
1014902-62 = "선생님. 화장실 앞의 이 바닥은 물기 대책이 되어 있지 않은 것 같은데……"
1014902-63 = "대부분의 낙상 사고는 화장실이나 욕실에서 발생하는 만큼, 매트를 깔아두는 게 좋겠어요."
1014902-64 = "창고에 있는 이 낡은 러그를 발 매트로 써도 될까요?"
1014902-68 = "이 벽걸이 TV는…… 설마 나사 하나에만 의존해서 걸려 있는 건가?"
1014902-69 = "혹시라도 충격 때문에 TV가 머리 위로 떨어지면…… 으으……"
1014902-70 = "고정 나사를 더 가져와야— 아니, 아예 고정 밴드를 챙겨올게요!"
1014902-77 = "(코코로의 지시에 따라 집무실 곳곳에 안전 장치를 설치했다.)"
1014902-78 = "(안전 점검에는 생각보다 시간이 오래 걸려, 설치가 끝날 즈음에는 저녁이 되고 말았다.)"
1014902-80 = "이, 이만하면 어느 정도 위험 방지 대책은 다 끝난 것 같네요."
1014902-81 = "샬레에 더 남은 위험 요소는……"
1014902-85 = "히, 히익!"
1014902-86 = "[ns9] \"미안. 차가웠어?\"\n[ns10] \"시원한 음료수야. 마시면서 쉬어.\""
1014902-89 = "네…… 챙겨 주셔서, 감사합니다."
1014902-91 = "후우……"
1014902-92 = "어느새 시간이 이렇게……"
1014902-93 = "……죄송해요. 조금, 저 답지 않게 흥분했네요."
1014902-94 = "[s] \"그래? 코코로 답지 않았나?\""
1014902-95 = "네. 평소에는 생각이 많아서 평범한 말을 건네는 것도 주저하고, 우물쭈물하면서……"
1014902-96 = "정작 안전과 관련된 일에 대해서는 다이빙 교육 때의 습관 때문인지, 다소 흥분하는 경향이 있어서."
1014902-97 = "이런 상황에서는 어쩐지 폭주하게 되어버리는 것 같아요."
1014902-98 = "오늘도 제 억지 때문에 선생님께 폐를 끼쳐버렸고."
1014902-99 = "[s] \"전혀 폐라고 생각하지 않는데?\""
1014902-103 = "[ns] \"오히려 덕분에 위험한 사고를 예방할 수 있게 되었잖아.\""
1014902-104 = "하지만……"
1014902-105 = "이렇게 특정한 상황에서만 호들갑을 떠는 것이 남들 보기에는…… 우습지 않을까요?"
1014902-106 = "[s] \"글쎄. 난 그런 점도 코코로의 일부라고 생각하는데.\""
1014902-110 = "[ns] \"그 중 하나라도 제외한다면 코코로의 매력을 충분히 느끼지 못할 거야.\""
1014902-112 = "………."
1014902-113 = "선생님, 혹시 방금 그 말……"
1014902-118 = "그…… 자각이 없으신가요?"
1014902-119 = "[s] \"응? 뭔가 말 실수라도 했어?\""
1014902-120 = "아, 아뇨. 그건 아니지만……"
1014902-121 = "어쩌면 샬레에서 제일 위험한 건 선생님이었을지도……"
1014902-123 = "(이후, 어째서인지 코코로에게 잔뜩 경계 섞인 시선을 받으며 업무를 계속했다……)"
