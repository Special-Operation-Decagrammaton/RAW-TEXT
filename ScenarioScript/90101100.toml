[translation]
90101100-1 = "第10話;不變的價值"
90101100-6 = "唔……那傢伙怎麼這麼硬啊？"
90101100-7 = "這裡是FOX3，目標的裝甲太厚，45口徑子彈打不穿！"
90101100-8 = "請求火力支援！"
90101100-9 = ""
90101100-13 = ""
90101100-14 = "正在將目標誘導至Point Beta，以便進行狙擊。"
90101100-15 = "FOX4，把彈種更換為HE彈重新裝填，並於當前位置待命。"
90101100-16 = "咦，不使用AP彈也沒關係嗎？"
90101100-17 = "光是貫穿裝甲是沒有用的。"
90101100-18 = "因為那傢伙已經在短時間內開始再生了。"
90101100-19 = "不盡快解決的話外殼會變得更厚，到時候就更難處理了。"
90101100-20 = "哇……這就是所謂的生物裝甲嗎？實際交手起來還真夠麻煩的。"
90101100-21 = "FOX2，你有辦法讓那傢伙的腹甲吃上一發獨頭彈嗎？"
90101100-22 = ""
90101100-23 = "想要造成有效打擊就必須靠得相當近才行……稍微幫我爭取一點時間。"
90101100-24 = "我來試著連接能夠遠端操控的起重機。"
90101100-25 = ""
90101100-31 = "……還有10秒。"
90101100-32 = "收到！"
90101100-33 = ""
90101100-38 = "已確認命中目標！"
90101100-39 = ""
90101100-42 = "FOX4，你能狙擊FOX2剛才擊破的腹甲上那塊六角形區域嗎？"
90101100-43 = "那裡就是螃蟹的弱點。"
90101100-44 = "距離700m……風向由北往南12節。"
90101100-45 = "這點程度不算什麼。"
90101100-46 = ""
90101100-49 = "Tango Down。"
90101100-50 = "就是現在，FOX3。引爆闊刀地雷！"
90101100-51 = "去死吧！這個噁心的甲殼類！"
90101100-52 = ""
90101100-60 = "哇啊！這是什麼！？從螃蟹的嘴裡噴出了一大堆腥臭的液體！"
90101100-61 = "唔嘔……味道好重，感覺全身上下都散發著一股腥味……"
90101100-62 = "哈哈……看來回去之後得馬上把制服拿去洗了呢。"
90101100-63 = ""
90101100-64 = "啊啊，啊啊啊……"
90101100-65 = "怪異已被擊倒，現在這個區域安全了。"
90101100-66 = "……不，不可能。傳聞中的螃蟹居然真的……"
90101100-67 = "就因為這種東西……這種螃蟹……"
90101100-68 = ""
90101100-70 = ""
90101100-71 = ""
90101100-72 = "是受到的打擊太大了嗎？好像連話都說不太清楚了。"
90101100-73 = "親眼目睹了原本以為不存在的未知怪獸，會受到打擊也是當然的。"
90101100-74 = "為了守護我們家族保管在這間倉庫裡的債券和美術品，#n我這段時間才吃了這麼多苦頭……"
90101100-75 = "竟然被那種荒唐的怪物螃蟹把一切都給毀了！"
90101100-76 = "這下子，我要徹底被老大給盯上了……！"
90101100-77 = "啊，是那個方面……？"
90101100-78 = "難怪你對這個港口的警備業務異常執著……原來是因為那樣的理由啊。"
90101100-79 = "這是你自作自受吧？一點都不值得同情呢。"
90101100-80 = "接下來只要悄悄向女武神公安局透露消息，剩下的事情他們自己會處理吧。"
90101100-81 = "畢竟與怪物螃蟹的傳聞不同，這個情況已經足以構成女武神公安局出動的理由了。"
90101100-82 = ""
90101100-84 = ""
90101100-85 = "……"
90101100-86 = "[s] 「你還好嗎？」"
90101100-87 = "是的，我沒事。畢竟我一直待在後方。"
90101100-88 = "承受風險的反而是仁子和胡桃他們──"
90101100-89 = "[s] 「我不是在說作戰的事……」"
90101100-90 = ""
90101100-93 = "[ns1] 「剛才審問的途中，你的情緒好像有點激動。」\n[ns2] 「是不是想起了什麼事？」"
90101100-96 = "那個時候……"
90101100-97 = "抱歉我失態了。當時情緒稍微有點失控。"
90101100-98 = "因為在審問途中突然想起了往事……一時有點憤怒。"
90101100-99 = "[s] 「是在生對方的氣嗎？」"
90101100-100 = "……我也不太清楚。"
90101100-101 = "雖然當時確實有感到憤怒，但事後回想起來卻不知道那股怒氣是在針對誰。"
90101100-102 = "究竟是對方……還是曾經犯下同樣錯誤的過去的自己。"
90101100-103 = "……又或者，是讓這種事一再重演的社會本身。"
90101100-104 = "我明白這聽起來像是小孩子的抱怨……#n但是對於不如自己所願的這個狀況，我就是莫名感到無法忍受。"
90101100-105 = "[s3] 「這不是只有小孩子才會有的問題。」\n[s4] 「大人遇到事情不如預期時也是會生氣的。」"
90101100-108 = "老師也會這樣嗎……？"
90101100-109 = "[s5] 「那當然。」\n[s6] 「況且如果毫不在意的話，不就代表打從一開始就沒抱任何期待嗎？」"
90101100-112 = ""
90101100-114 = ""
90101100-115 = "就像卡爾帕喬家族成員所說的，這次他們做的事在法律上沒有問題。"
90101100-116 = "只是悄悄散播怪談來營造形象，再藉此以合法的投標獲取利益罷了。"
90101100-118 = "然而那還是讓許多人陷入恐懼，最終造成了實質性的損害。"
90101100-119 = "我從以前就有種感覺……#n無論把規則制定得多麼周全，對於矯正惡人的效果似乎依舊有限。"
90101100-120 = "因為惡人擅長找出規則裡沒有提及的漏洞並加以濫用。"
90101100-121 = ""
90101100-122 = "反倒是複雜的規則會給大多數市民帶來不便，有時還會產生無辜的受害者。"
90101100-123 = "就像完美的正義一樣……世上是否不存在能夠徹底約束惡人的規則呢？"
90101100-124 = "[s] 「這個嘛……應該視為不存在吧。」"
90101100-125 = "果然如此啊。"
90101100-126 = "[s] 「因為規則通常不是為了人而制定的。」"
90101100-127 = ""
90101100-129 = ""
90101100-130 = "……咦？"
90101100-131 = "[s7] 「很多人都以為規則是為了人而產生的。」\n[s8] 「不過實際上，人配合規則改變的情況反而更加常見。」"
90101100-132 = ""
90101100-133 = ""
90101100-136 = "[ns9] 「跟時刻都在動搖和改變的人心不同。」\n[ns10] 「規則一旦被制定下來就不會改變，同時也很難修改。」"
90101100-139 = "[ns] 「正因如此，人們才會容易被過去制定的規則所束縛。」"
90101100-140 = "那麼，如果不想被過去所束縛……"
90101100-141 = "無法互相理解又不斷動搖的人，該依靠什麼東西活下去呢？"
90101100-142 = "[s] 「不能依賴規則，應該以不變的價值作為自己的標竿。」"
90101100-143 = "不變的……價值。"
90101100-144 = "[ns] 「雪乃，你的正義依然沒有改變嗎？」"
90101100-145 = ""
90101100-147 = ""
90101100-148 = "……我想相信是如此。"
90101100-149 = "[s] 「那就回想那份不變的正義，重新整理規則吧。」"
90101100-150 = "是。"
90101100-151 = ""
90101100-153 = ""
90101100-154 = ""
90101100-155 = ""
90101100-156 = "你們在聊什麼？怎麼那麼嚴肅啊？"
90101100-157 = "難道是瞞著我們跟老師約好週末要出去嗎？"
90101100-158 = "怎麼可能。#n只是在討論整理完現場後，該怎麼向聯邦學生會報告而已。"
90101100-159 = ""
90101100-161 = ""
90101100-163 = ""
90101100-164 = "我們回來了～"
90101100-165 = "辛苦了，FOX2。#n現場沒有其他市民吧？"
90101100-166 = "嗯。幸好我們迅速聯絡港口事務所管制出入，所以沒有人被捲入這場騷動。"
90101100-167 = "只是……我在那隻巨大螃蟹倒下的地方發現了這個。"
90101100-169 = "[ns] 「這是……」"
90101100-170 = "看起來不像是螃蟹的殘留物呢。"
90101100-171 = "……嗯。感覺像是玻璃碎片……不對，更像是映照著其他世界的鏡子碎片。"
90101100-172 = "之前也見過這種東西吧？"
90101100-173 = "嗯。之前打倒扭來扭去的時候，地上也留下了這種鏡子碎片。"
90101100-174 = "當時映照出的是扭來扭去站著的那片草原般的風景，#n但是這面鏡子的另一頭卻什麼也看不見。"
90101100-175 = "看它呈現深沉的墨藍色，難道是映照著那隻螃蟹誕生的海底風景嗎？"
90101100-176 = "無論如何，我們遭遇的怪談都留下了性質相似的殘留物就表示……"
90101100-177 = ""
90101100-178 = "最近突然增加的都市怪談以及與之相關的失蹤事件，全都並非巧合的可能性更高了。"
90101100-179 = "當然，光憑目前掌握的證據還無法對任何事情下定論。"
90101100-180 = "老師，這次的玻璃碎片也麻煩您代為保管了。"
90101100-181 = "[s] 「嗯，交給我吧。」"
90101100-182 = "哈啊……累死了……"
90101100-183 = "那現在也差不多該回──"
90101100-184 = ""
90101100-186 = ""
90101100-187 = "嗯……？那邊……在貨櫃之間成群亂竄的小螃蟹是什麼？"
90101100-188 = "你是不是才剛對付那隻巨大的怪物螃蟹，所以對尺寸的感覺變得怪怪的？#n那不是小螃蟹，而是普通成體大小的螃蟹哦。"
90101100-189 = "可是怎麼會突然冒出這麼多螃蟹啊？"
90101100-190 = ""
90101100-192 = ""
90101100-193 = "……啊，該不會是卡爾帕喬家族為了嚇唬人而買來的那些螃蟹吧？"
90101100-194 = "剛才倉庫倒塌的時候，牠們可能趁機逃出來了。"
90101100-195 = "從方向來看，似乎正從倉庫往大海移動。"
90101100-196 = ""
90101100-198 = ""
90101100-199 = ""
90101100-200 = "看著大量螃蟹以被破壞的港口設施為背景，井然有序地朝大海前進……#n總感覺有種怵目驚心的感覺呢。"
90101100-201 = "簡直就像破壞了人類家園的螃蟹正在返回大海一樣。"
90101100-202 = "……接下來一段時間，這附近海域捕到的螃蟹量恐怕會莫名增加吧？"
90101100-203 = "要是再加上有人目擊螃蟹破壞了建築物的傳聞……"
90101100-204 = "搞不好會出現「無數怪物螃蟹破壞人類住所」的新都市怪談哦？"
90101100-205 = "我才不要！光是一隻螃蟹就把我累得半死，你要我怎麼對付一大群螃蟹啊！？"
90101100-206 = ""
90101100-208 = ""
90101100-209 = "看來要宣告作戰結束還有點為時過早。"
90101100-210 = "全體隊員，從現在起全力回收在港口徘徊的螃蟹。"
90101100-211 = ""
90101100-213 = ""
90101100-214 = "全部都要……？由我們來嗎？"
90101100-215 = "這麼多螃蟹要什麼時候才撿得完啊！"
90101100-216 = "[s11] 「如果能杜絕後患的話……」\n[s12] 「我也一起幫忙吧。」"
90101100-219 = "真是的……"
90101100-221 = "我暫時不想再看到螃蟹了啦！！"
90101100-223 = "（之後為了抓回從倉庫逃走的螃蟹，與FOX小隊一起在港口裡奔波了一整夜……）"
90101100-225 = "下一話;尾聲"
