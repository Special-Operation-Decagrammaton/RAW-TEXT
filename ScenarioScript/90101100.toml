[translation]
90101100-1 = "제10화;변치 않는 가치"
90101100-6 = "큿…… 저 녀석, 왜 이렇게 단단한 거야?"
90101100-7 = "여기는 FOX 3, 목표의 장갑이 두꺼워 45구경 탄환이 먹히지 않아!"
90101100-8 = "화력 지원을 요청한다!"
90101100-14 = "저격을 위해 포인트 베타 방향으로 유인 중."
90101100-15 = "FOX 4, 탄종을 HE 탄환으로 바꾸어 재장전하고 현 위치에 대기하도록."
90101100-16 = "어라, AP 탄환을 쓰지 않아도 괜찮아?"
90101100-17 = "장갑을 관통하는 것만으로는 소용이 없어."
90101100-18 = "이 녀석, 그 짧은 시간 내에도 재생하고 있으니까."
90101100-19 = "바로 끝내지 않으면 외피가 더 두꺼워져서 끝내기 어려워질 거야."
90101100-20 = "우와…… 생체 장갑이라는 거. 실제로 상대하니 꽤나 성가시네."
90101100-21 = "FOX 2, 녀석의 배판에 슬러그탄을 먹일 수 있어?"
90101100-23 = "유효타를 내려면 꽤 가까이 가야 하는데…… 잠깐 시간 좀 벌어 줘."
90101100-24 = "원격 조작이 가능한 크레인에 접속해 볼게."
90101100-31 = "……앞으로 10초."
90101100-32 = "확인!"
90101100-38 = "목표의 피격을 확인."
90101100-42 = "FOX 4. FOX 2가 방금 깨트린 배판의 육각형 부분을 저격할 수 있겠어?"
90101100-43 = "그곳이 게의 약점이다."
90101100-44 = "거리 700m. 풍향은 북에서 남쪽으로 12노트."
90101100-45 = "이 정도야 뭐."
90101100-49 = "탱고 다운."
90101100-50 = "지금이야, FOX 3. 클레이모어 격발!"
90101100-51 = "죽어라, 이 역겨운 갑각류!"
90101100-60 = "우왓, 이게 뭐야? 게 주둥이에서 비릿한 물이 잔뜩 뿜어져 나왔어!"
90101100-61 = "으으…… 비려. 온 몸에서 비린내가 진동을 하는 것 같아……."
90101100-62 = "하하…… 돌아가면 바로 교복을 세탁해야겠네."
90101100-64 = "아아, 아아아……"
90101100-65 = "괴이는 쓰러졌다. 이제 이 구역은 안전해."
90101100-66 = "……마, 말도 안 돼. 진짜로 소문 속의 게가……"
90101100-67 = "이런 게 때문에…… 게 같은 경우가……"
90101100-72 = "충격이 컸나? 뭔가 말도 제대로 못하는 것 같은데."
90101100-73 = "실존하지 않는다고 생각하던 미지의 괴수를 목도했으니, 충격을 받을 법도 하지."
90101100-74 = "이 창고에 보관 중인 우리 패밀리의 채권과 미술품을 지키기 위해 그동안 이 고생을 해왔는데……"
90101100-75 = "저런 말도 안 되는 괴물 게에게 모든 게 박살나다니!"
90101100-76 = "난 이제 보스에게 완전히 찍혔어……!"
90101100-77 = "아, 그쪽……?"
90101100-78 = "어쩐지 이 항구의 보안 용역에 이상하리만큼 집착하더니…… 그런 이유가 있었었군요."
90101100-79 = "자업자득이라고 할까. 불쌍하지도 않네."
90101100-80 = "나머지는 발키리 공안국에 슬쩍 찔러두면 알아서 처리하겠지."
90101100-81 = "사람을 습격하는 소문 속의 괴물 게와는 달리, 이건 발키리가 충분히 움직일만한 이유가 되니까."
90101100-85 = "………."
90101100-86 = "[s] \"괜찮아?\""
90101100-87 = "네, 저는 괜찮습니다. 계속 후방에 있었으니까요."
90101100-88 = "오히려 위험을 감내한 건 니코와 쿠루미 쪽—"
90101100-89 = "[s] \"작전의 이야기가 아니라……\""
90101100-93 = "[ns1] \"아까, 심문 중에 감정이 격해진 것 같아서.\"\n[ns2] \"뭔가 떠오르는 일이라도 있었어?\""
90101100-96 = "그 때는……"
90101100-97 = "죄송합니다. 저답지 않게 조금 감정이 격해지고 말았군요."
90101100-98 = "심문을 하던 중 잠깐 옛 일이 떠올라서…… 화가 났습니다."
90101100-99 = "[s] \"상대에게?\""
90101100-100 = "……잘 모르겠습니다."
90101100-101 = "화를 내고 있었지만 돌이켜 생각해 보면 누구에게 화를 냈는지 알 수가 없습니다."
90101100-102 = "상대인지, 아니면 같은 실수를 했던 과거의 저에게 인지."
90101100-103 = "……아니면 이런 일이 반복되는 이 사회 그 자체인지."
90101100-104 = "어린 아이 같은 불평이라는 생각은 하고 있지만, 의도대로 움직이지 않는 이 상황을 어쩐지 참을 수가 없었습니다."
90101100-105 = "[s3] \"어린 아이만의 문제는 아니야.\"\n[s4] \"어른도 일이 뜻대로 되지 않으면 화가 나는 걸.\""
90101100-108 = "선생님도 그렇습니까……?"
90101100-109 = "[s5] \"당연하지.\"\n[s6] \"오히려 아무렇지 않다면, 처음부터 기대가 없었다는 뜻 아닐까?\""
90101100-115 = "카르파초 패밀리의 조직원이 했던 말처럼 이번에 그들이 저지른 일은 법적으로는 문제가 없는 일이었습니다."
90101100-116 = "괴담을 슬쩍 퍼트려 이미지를 꾸며내고, 이를 통해 합법적인 입찰로 이득을 취한 것뿐이니까요."
90101100-118 = "하지만 이로 인해 많은 사람들이 공포에 휩싸였고, 결국 유의미한 피해가 발생하고 말았습니다."
90101100-119 = "이전부터 느껴온 것이지만, 아무리 규칙을 철저하게 만들더라도 악인을 구제하는 데에는 별 소용이 없는 것 같습니다."
90101100-120 = "악인은 규칙에 적히지 않은 허점을 찾아 내 악용하는 데 익숙하니까요."
90101100-122 = "오히려 복잡한 규칙은 대부분의 시민들에게 불편을 초래하고, 선의의 피해자를 만들기도 합니다."
90101100-123 = "완벽한 정의처럼…… 악인을 완벽하게 통제할 수 있는 규칙 같은 건 세상에 존재하지 않는 걸까요."
90101100-124 = "[s] \"뭐, 존재하지 않는다고 봐야지.\""
90101100-125 = "역시 그렇군요."
90101100-126 = "[s] \"대개 규칙은 사람을 위해 만들어지지 않으니까.\""
90101100-130 = "……네?"
90101100-131 = "[s7] \"많은 사람들이 사람을 위해 규칙이 생겨난다고 생각하지만.\"\n[s8] \"사실은 규칙에 맞추어 사람을 바꾸는 경우가 더 흔해.\""
90101100-136 = "[ns9] \"쉴 새 없이 흔들리고 바뀌는 사람의 마음과는 달리.\"\n[ns10] \"한 번 기록된 규칙은 변치않고, 바꾸기도 어렵거든.\""
90101100-139 = "[ns] \"그렇기 때문에 사람은 과거가 만든 규칙에 종속되기 쉽단다.\""
90101100-140 = "그럼 과거에 종속되지 않으려면."
90101100-141 = "서로가 이해하지 못하고, 쉴 새 없이 흔들리는 사람은 무엇으로 살아가야 합니까?"
90101100-142 = "[s] \"규칙이 아닌 변치 않는 가치로 이정표를 세워야지.\""
90101100-143 = "변치 않는…… 가치."
90101100-144 = "[ns] \"유키노, 너의 정의는 여전히 변치 않았니?\""
90101100-148 = "……그렇다고 믿고 싶습니다."
90101100-149 = "[s] \"그럼 그 변치 않는 정의를 되새기며, 규칙을 다시 정리해 보자.\""
90101100-150 = "네."
90101100-156 = "무슨 대화를 그렇게 심각하게 나누고 있는 거야?"
90101100-157 = "혹시 우리를 빼 놓고서 선생님과 주말 약속이라도 잡고 있었던 거야?"
90101100-158 = "그럴 리가. 현장을 정리한 뒤에, 총학생회에 무어라 보고할지 논의하던 것뿐이야."
90101100-164 = "우리 돌아왔어~"
90101100-165 = "수고 많았어, FOX 2.#n현장에 다른 시민은 없었나?"
90101100-166 = "응. 빠르게 항만사무소에 연락해서 출입을 통제한 덕분에 소동에 휘말린 사람은 없는 것 같아."
90101100-167 = "다만…… 그 거대한 게가 쓰러진 자리에서 이걸 발견했어."
90101100-169 = "[ns] \"이건……\""
90101100-170 = "게의 부산물처럼 보이지는 않는데."
90101100-171 = "……응. 유리 조각, 아니 뭔가 다른 세계를 비추는 거울 조각처럼 보여."
90101100-172 = "전에도 이런 걸 본 적이 있었지?"
90101100-173 = "응. 그 쿠네쿠네를 쓰러트렸을 때도 바닥에 이런 거울 조각이 남겨져 있었었지."
90101100-174 = "그 때는 쿠네쿠네가 서 있던 초원 같은 풍경을 비추고 있었는데, 이 거울 너머로는 아무것도 보이질 않네."
90101100-175 = "짙은 검푸른 색이 도는 걸 보면 게가 태어난 해저의 풍경을 보여주고 있는 걸까?"
90101100-176 = "무엇이 되었든 우리가 상대한 로어들이 유사한 특성의 부산물을 남기고 있다는 건……"
90101100-178 = "최근 갑작스럽게 증가한 도시 괴담과 이와 연계된 실종자들이, 단순한 우연의 산물이 아닐 가능성이 더욱 높아졌군."
90101100-179 = "물론 지금까지 확보한 증거만으로는 그 무엇도 확신할 수 없지만."
90101100-180 = "선생님. 이번에도 이 유리 조각의 처리는 대신 부탁드리겠습니다."
90101100-181 = "[s] \"응. 맡아둘게.\""
90101100-182 = "하아, 지쳤다……"
90101100-183 = "그럼 이제 슬슬 돌아가서—"
90101100-187 = "응……? 저기, 컨테이너 사이로 몰려다니는 새끼 게들은 뭐야?"
90101100-188 = "거대한 괴물 게를 상대하느라 크기 감각이 이상해진 거 아냐? 저건 새끼 게가 아니라, 평범한 성체 크기의 게라고."
90101100-189 = "하지만 어디서 갑자기 이렇게 많은 게들이 나타난 거지?"
90101100-193 = "……아, 저거. 카르파초 패밀리가 사람들을 겁주려고 사들인 그 게 아냐?"
90101100-194 = "아까 창고가 무너지면서 그 틈을 타 도망친 거지."
90101100-195 = "그렇네. 움직이는 방향을 보아하니 창고에서 바다 방향으로 이동하는 것 같아."
90101100-200 = "수많은 게가 파괴된 항만 시설을 배경으로 질서정연하게 바다로 향하는 걸 보니 꽤나 섬뜩한 느낌인걸."
90101100-201 = "마치 인간의 터전을 파괴한 게들이 바다로 돌아가는 것처럼 보여."
90101100-202 = "……당분간 이 근해에서는 이유 없이 게가 많이 잡히겠지?"
90101100-203 = "거기에 건물을 파괴하는 게를 보았다는 목격담까지 더해진다면……"
90101100-204 = "이제는 수많은 괴물 게가 인간의 거처를 파괴한다는 새로운 도시 괴담이 생겨날지도."
90101100-205 = "그건 싫어! 게 한마리도 이렇게 진땀을 뺐는데, 수많은 게 무리랑 어떻게 맞서 싸우라는 거야?"
90101100-209 = "아직 작전의 종료를 선언하긴 조금 이른 것 같군."
90101100-210 = "전 소대원, 지금부터 전력으로 항만을 배회하고 있는 게들을 회수한다."
90101100-214 = "이걸 전부……? 저희가요?"
90101100-215 = "이 수많은 게를 어느 세월에 다 주워 담아!"
90101100-216 = "[s11] \"그래도 후환을 막을 수 있다면야……\"\n[s12] \"나도 같이 도울게.\""
90101100-219 = "정말……"
90101100-221 = "한동안 게는 쳐다보지도 않을 거야!"
90101100-223 = "(이후, FOX 소대와 함께 창고에서 탈출한 게를 붙잡느라 밤새도록 항만을 뛰어다녔다……)"
90101100-225 = "다음화;에필로그"
