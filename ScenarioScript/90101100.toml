90101100-147 = ""
90101100-148 = "ฉันอยากเชื่อว่าเป็นแบบนั้นค่ะ..."
90101100-149 = "[s] \"งั้นก็ทบทวนกฎกันใหม่ โดยยึดมั่นในความยุติธรรมที่ไม่เสื่อมคลายนั้นกัน\""
90101100-150 = "ค่ะ"
90101100-151 = ""
90101100-153 = ""
90101100-154 = ""
90101100-155 = ""
90101100-156 = "กำลังคุยเรื่องอะไรเหรอ ดูจริงจังกันเชียว?"
90101100-157 = "หรือว่ากำลังนัดคุณครูไปเที่ยวช่วงสุดสัปดาห์โดยไม่ชวนพวกเราอยู่เหรอ?"
90101100-158 = "ไม่มีทางหรอก เราแค่กำลังหารือกันว่า หลังจากจัดการสถานที่แล้ว จะรายงานต่อองค์การนักเรียนว่า#nยังไงก็เท่านั้น"
90101100-159 = ""
90101100-161 = ""
90101100-163 = ""
90101100-164 = "พวกเรากลับมาแล้ว~"
90101100-165 = "เหนื่อยหน่อยนะ FOX 2#nในที่เกิดเหตุไม่มีชาวเมืองคนอื่นอยู่ใช่มั้ย?"
90101100-166 = "อื้อ ฉันรีบติดต่อสำนักงานท่าเรือให้ควบคุมการเข้าออกไว้ ดูเหมือนว่าจะไม่มีใครได้รับผลกระทบจาก#nเหตุการณ์วุ่นวายนี้นะ"
90101100-167 = "แต่ว่า... ฉันพบสิ่งนี้ตรงจุดที่ปูยักษ์ตัวนั้นล้มอยู่น่ะ"
90101100-169 = "[ns] \"นี่มัน...\""
90101100-170 = "ดูไม่เหมือนสิ่งตกค้างจากปูเลย"
90101100-171 = "อื้อ... ดูเหมือนเศษแก้ว ไม่สิ เหมือนเศษกระจกที่สะท้อนโลกอีกใบหนึ่งเลย"
90101100-172 = "ก่อนหน้านี้เราเคยเห็นของแบบนี้แล้วใช่มั้ย?"
90101100-173 = "อื้อ ตอนที่กำจัดคุเนะคุเนะได้ ก็มีเศษกระจกแบบนี้หลงเหลืออยู่บนพื้นเหมือนกัน"
90101100-174 = "ตอนนั้นมันสะท้อนภาพทุ่งหญ้าที่คุเนะคุเนะยืนอยู่ แต่หลังกระจกชิ้นนี้กลับมองไม่เห็นภาพอะไรเลย"
90101100-175 = "เห็นแค่เป็นสีครามเข้มเกือบดำ หรือว่ามันกำลังแสดงภาพใต้ทะเลที่ปูถือกำเนิดขึ้นกันนะ?"
90101100-176 = "ไม่ว่าจะเป็นอะไรก็ตาม การที่ตำนานที่พวกเราต่อสู้ด้วยทิ้งสิ่งตกค้างที่มีลักษณะคล้ายคลึงกันไว้นั้น มันก็ตีความได้ว่า..."
90101100-177 = ""
90101100-178 = "ความเป็นไปได้ที่ว่า \"ตำนานเมืองที่เพิ่มขึ้นอย่างฉับพลันเมื่อเร็วๆ นี้ รวมถึงผู้สูญหายที่เกี่ยวข้อง ไม่ได้เกิดจากความบังเอิญธรรมดา\" ก็ยิ่งสูงขึ้นแล้วสินะ"
90101100-179 = "ถึงหลักฐานที่รวบรวมได้จนถึงตอนนี้ เรายังไม่อาจยืนยันอะไรได้เลยก็เถอะ"
90101100-180 = "คุณครู ครั้งนี้ก็ขอฝากให้ช่วยจัดการเศษแก้วชิ้นนี้แทนด้วยนะคะ"
90101100-181 = "[s] \"อื้อ ครูจะเก็บไว้เอง\""
90101100-182 = "เฮ้อ... เหนื่อยจัง..."
90101100-183 = "ถ้างั้น พวกเราก็ค่อยๆ กลับกัน..."
90101100-184 = ""
90101100-186 = ""
90101100-187 = "หืม...? พวกลูกปูที่กำลังกรูกันอยู่แถวตู้คอนเทนเนอร์นั่นมันอะไรกันน่ะ?"
90101100-188 = "เพราะสู้กับปูยักษ์มา เลยแยกแยะขนาดผิดเพี้ยนไปแล้วหรือเปล่า? นั่นไม่ใช่ลูกปู แต่เป็นปูโตเต็มวัยขนาดปกติต่างหากล่ะ"
90101100-189 = "แต่จู่ๆ ปูมากมายขนาดนี้โผล่มาจากไหนกัน?"
90101100-190 = ""
90101100-192 = ""
