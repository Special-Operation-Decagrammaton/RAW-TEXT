[translation]
90101100-1 = "Episode 10;Unchanging Value"
90101100-6 = "Tch... How is it so sturdy?"
90101100-7 = "This is FOX 3. Its armor is too thick. Even my 45-caliber rounds can't crack it."
90101100-8 = "Requesting supporting fire!"
90101100-9 = ""
90101100-13 = ""
90101100-14 = "Baiting the target to Point Beta for sniper support."
90101100-15 = "FOX 4, switch ammunition to HE rounds and hold your current position after reloading."
90101100-16 = "Not AP rounds?"
90101100-17 = "Piercing its armor won't do anything."
90101100-18 = "It regenerates too quickly for us to capitalize on it."
90101100-19 = "We need a quick, decisive blow. Or its shell will just get thicker and thicker."
90101100-20 = "Ughhh. This bio-armor thing is more annoying than I thought it'd be."
90101100-21 = "FOX 2, can you get a slug round into its belly plate?"
90101100-22 = ""
90101100-23 = "Yes, but I'll need to get much closer. Can you buy me time?"
90101100-24 = "Those cranes can be controlled remotely. I'll try connecting to them."
90101100-25 = ""
90101100-31 = "...I can give you ten seconds."
90101100-32 = "Roger!"
90101100-33 = ""
90101100-38 = "Target hit."
90101100-39 = ""
90101100-42 = "FOX 4. Can you shoot the hexagonal section of the belly plate FOX 2 just breached?"
90101100-43 = "It should be weak there."
90101100-44 = "The target is 700 meters away. Wind blowing from north to south at 12 knots."
90101100-45 = "Piece of cake."
90101100-46 = ""
90101100-49 = "Tango down."
90101100-50 = "Now, FOX 3. The claymores!"
90101100-51 = "Die, you disgusting crustacean!"
90101100-52 = ""
90101100-60 = "Ugh! What the heck? It spat some gross liquid all over me!"
90101100-61 = "Ughhh. This sucks. I smell like fish."
90101100-62 = "Haha. I guess it's laundry day today."
90101100-63 = ""
90101100-64 = "Ow, oww..."
90101100-65 = "Anomaly down. This area is safe now."
90101100-66 = "...I-I can't believe it. The crab from the rumors was actually..."
90101100-67 = "What the... What the crab is this...?"
90101100-68 = ""
90101100-70 = ""
90101100-71 = ""
90101100-72 = "You okay there? Are you in shock?"
90101100-73 = "It's a natural response to seeing a supernatural monster that's not supposed to exist."
90101100-74 = "We worked so hard to protect our family's bonds and artworks in this warehouse."
90101100-75 = "And that absurd monster crab destroyed everything!"
90101100-76 = "The boss is gonna kill me!"
90101100-77 = "I see. That's what it was?"
90101100-78 = "No wonder this port had such strict security. It all makes sense now."
90101100-79 = "Karma comes for us all. You can hardly complain."
90101100-80 = "From here, we'll leave the rest to Valkyrie's Public Peace Bureau."
90101100-81 = "Valkyrie can act on this intel. Unlike with monster crabs that allegedly eat people."
90101100-82 = ""
90101100-84 = ""
90101100-85 = "..."
90101100-86 = "[s] \"Are you okay?\""
90101100-87 = "Yes, I'm fine. I was backing them up from the rear."
90101100-88 = "Niko and Kurumi are the ones who went—"
90101100-89 = "[s] \"I'm not talking about the fight.\""
90101100-90 = ""
90101100-93 = "[ns1] \"It looked like you got a little bit emotional during the interrogation earlier.\"\n[ns2] \"Did it remind you of something?\""
90101100-96 = "Back then..."
90101100-97 = "I apologize. It's unlike me to let my emotions get the best of me."
90101100-98 = "It reminded me of the past...and it infuriated me."
90101100-99 = "[s] \"Who were you mad at?\""
90101100-100 = "...I'm not entirely sure."
90101100-101 = "I felt this surge of anger, but I don't know who it was directed towards."
90101100-102 = "Was I angry with the capo for the harm she's caused? Or was it because it felt like I was looking in a mirror?"
90101100-103 = "Maybe it was society as a whole, letting incidents like this occur over and over again."
90101100-104 = "It's childish of me. I think I was angry about the entire situation going in a direction I couldn't control."
90101100-105 = "[s3] \"That's not because you're childish.\"\n[s4] \"Even adults get angry when things don't go their way.\""
90101100-108 = "You too, Sensei?"
90101100-109 = "[s5] \"All the time!\"\n[s6] \"If you didn't, that would mean you didn't care at all.\""
90101100-112 = ""
90101100-114 = ""
90101100-115 = "It's just like she said. The Carpaccio Family didn't technically do anything wrong, legally."
90101100-116 = "They spread urban legends through the public to create a false reputation and bolster their chances of winning the bidding process. There's no law against that."
90101100-118 = "But there were still consequences. People were forced to live in fear, and it hurt the community around them, even if not by their direct hand."
90101100-119 = "I've been thinking about this lately. No matter how well-written or strict a rule is, it does little in deterring criminals."
90101100-120 = "Someone becomes a criminal by finding and abusing whatever loopholes they can find. It becomes a part of the trade."
90101100-121 = ""
90101100-122 = "On the contrary, we lay these rules out for an already rule-abiding public, only inconveniencing them and creating more victims."
90101100-123 = "It's like the idea of \"perfect\" justice... It's impossible to find the silver bullet that will eliminate criminal behavior in society."
90101100-124 = "[s] \"Honestly, it makes a lot of sense that you came to that conclusion.\""
90101100-125 = "So it's true."
90101100-126 = "[s] \"Because rules aren't made for the people of today.\""
90101100-127 = ""
90101100-129 = ""
90101100-130 = "...Huh?"
90101100-131 = "[s7] \"It's easy to see rules as something made to help people.\"\n[s8] \"But what really happens is that people adapt to the rules.\""
90101100-132 = ""
90101100-133 = ""
90101100-136 = "[ns9] \"People's hearts are fickle—they waver at every turn.\"\n[ns10] \"Rules are the opposite. They're set in stone, and they're hard to change, even if you want to.\""
90101100-139 = "[ns] \"So we're prone to being bound to rules created for and by the past.\""
90101100-140 = "Then how can we avoid being bound by the past?"
90101100-141 = "What rules can people, narrowminded and volatile, live by harmoniously?"
90101100-142 = "[s] \"We should view life through our unwavering values instead.\""
90101100-143 = "Unwavering...values."
90101100-144 = "[ns] \"Yukino, has your definition of 'justice' stayed consistent?\""
90101100-145 = ""
90101100-147 = ""
90101100-148 = "I'd like to think so, yes."
90101100-149 = "[s] \"Let's reorganize the rules based on your unwavering justice.\""
90101100-150 = "Yes."
90101100-151 = ""
90101100-153 = ""
90101100-154 = ""
90101100-155 = ""
90101100-156 = "What are you talking about so seriously?"
90101100-157 = "*gasp* Are you making plans to meet up with Sensei over the weekend? WITHOUT US?"
90101100-158 = "No, absolutely not. We're discussing cleanup and how to report this to the General Student Council."
90101100-159 = ""
90101100-161 = ""
90101100-163 = ""
90101100-164 = "We're baaack!"
90101100-165 = "Welcome back, FOX 2. Were there any other civilians on site?"
90101100-166 = "Nope. Port management did a good job locking this area up after we asked them."
90101100-167 = "But...I did find this near the crab."
90101100-169 = "[ns] \"This is...\""
90101100-170 = "It doesn't seem to be from the crab itself."
90101100-171 = "I'd agree. This glass... It looks like a mirror reflecting into a different world."
90101100-172 = "Haven't we seen something like this before?"
90101100-173 = "Yeah. I remember, when we took down the kunekune."
90101100-174 = "We could see a field reflecting through that one...but this one's blank."
90101100-175 = "Not entirely blank—it has a kind of a dark blue hue. Maybe it's the sea where the crab came from?"
90101100-176 = "Regardless, the different Lores we've encountered have left behind items with similar characteristics."
90101100-177 = ""
90101100-178 = "It lends weight to the theory that someone behind the scenes is intentionally driving the sudden spike in urban legends and missing persons."
90101100-179 = "We don't have the evidence to draw any conclusions yet, though."
90101100-180 = "Can we ask you to hold onto this piece as well, Sensei?"
90101100-181 = "[s] \"Of course. I'll keep it safe.\""
90101100-182 = "Phew, I'm beat..."
90101100-183 = "Let's go back now—"
90101100-184 = ""
90101100-186 = ""
90101100-187 = "Eh? Am I going crazy, or are there a bunch of baby crabs swarming out of those containers?"
90101100-188 = "Did fighting the monster crab mess up your sense of scale? Those are regular-sized crabs."
90101100-189 = "Geez, fine. But where did they COME from?"
90101100-190 = ""
90101100-192 = ""
90101100-193 = "Ah, I know. They must be the ones the Carpaccio Family bought to scare people."
90101100-194 = "The warehouse collapsed. They saw their chance to escape and took it."
90101100-195 = "You're probably right. It looks like they're headed to the sea."
90101100-196 = ""
90101100-198 = ""
90101100-199 = ""
90101100-200 = "What a creepy image. It's not every day you see crabs marching single-file from a bunch of ruined buildings."
90101100-201 = "It's kind of like the crabs came out of the sea, destroyed all the human settlements, and are returning home now."
90101100-202 = "Crab fishers are sure going to be confused by the random uptick in the crab population."
90101100-203 = "And I'm sure rumors are going to spread of a crab big enough to destroy buildings after this."
90101100-204 = "New urban legend: countless monster crabs rise from the ocean to destroy humanity!"
90101100-205 = "PLEASE don't even say that aloud! Just dealing with one crab was already rough. How are we going to deal with an entire army of them?"
90101100-206 = ""
90101100-208 = ""
90101100-209 = "Our mission isn't over yet."
90101100-210 = "Squad, fan out and retrieve all crabs roaming around the port. Now."
90101100-211 = ""
90101100-213 = ""
90101100-214 = "\"Squad\" as in \"FOX Squad\"? And \"all\" as in \"every single one\"?"
90101100-215 = "That'll take forever!"
90101100-216 = "[s11] \"Think about our future selves...\"\n[s12] \"I'll help too.\""
90101100-219 = "Seriously..."
90101100-221 = "I never want to see another crab again!"
90101100-223 = "I stayed up all night with FOX Squad at the port, catching the crabs that had escaped from the warehouse..."
90101100-225 = "Next Episode; Epilogue"
