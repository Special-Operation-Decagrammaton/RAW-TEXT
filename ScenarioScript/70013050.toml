70013050-1 = "วัชพืชมิอาจเติบโตเพียงลำพัง 5"
70013050-2 = "หลายวันต่อมา..."
70013050-4 = "เลานจ์ ห้องอาหารหรูของโรงแรม"
70013050-5 = "......"
70013050-6 = "อืม... ไม่คิดเลยว่าพวกเราจะกลับมาที่นี่อีก"
70013050-7 = "ฮุฮุฮุ ทางโรงแรมอยากตอบแทนพวกเรานี่นา ก็คงต้องรับไว้ตามมารยาทละนะ"
70013050-8 = "คะ... คงไม่มีอะไรหรอกเนอะ? คงไม่ได้วางกับดักเรียกพวกเรามาเพื่อเรียกค่าเสียหายหรอกใช่มั้ย?"
70013050-9 = "ไม่เป็นไรหรอกน่า"
70013050-10 = "ฉันลองตรวจสอบดูแล้วก็เจอว่าโรงแรมนี้ถูกพวกริกาโตนีแฟมิลี่คุกคามมานานแล้วน่ะ"
70013050-11 = "และพวกเราเป็นคนขับไล่เจ้าพวกนั้นไป เพราะงั้นคงไม่ได้หลอกกันเรื่องอยากตอบแทนหรอก"
70013050-12 = "ถ้าเกิดพวกเขาหลอกพวกเราละก็... ฉันจะจัดการให้เองค่ะ"
70013050-13 = "เพราะงั้นไม่ต้องกังวลนะคะ ท่านอารุ"
70013050-14 = "อะ... อื้อ!"
70013050-15 = "ใครบอกว่าฉันกังวล? ก็แค่จะบอกว่าให้ระวังเอาไว้ก็เท่านั้น"
70013050-16 = "แหะๆ... สมกับเป็นท่านอารุเลย... รอบคอบในทุกๆ เรื่องเลยนะคะ"
70013050-18 = "โอ๊ะ ยินดีต้อนรับทุกคนครับ!"
70013050-19 = "ผมจะนำทางให้เองครับ เชิญทางนี้ครับ!"
