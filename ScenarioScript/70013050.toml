[translation]
70013050-1 = "雜草不會獨自綻放（５）"
70013050-2 = "（幾天後……）"
70013050-4 = "飯店高級餐廳休息區"
70013050-5 = "……"
70013050-6 = "……沒想到我們還會再來到這裡呢。"
70013050-7 = "咯呼呼，人家飯店想要表達感謝不是嗎？#n那心懷感激地接受才是應有的禮儀吧。"
70013050-8 = "不，不會有問題吧？會不會是為了申請損害賠償而設下的陷阱？"
70013050-9 = "不用擔心。"
70013050-10 = "我已經調查過了，這間飯店以前就一直被利加托尼家族騷擾。"
70013050-11 = "而我們幫他們解決了問題，所以想表達感謝的心意應該不是假的。"
70013050-12 = "如果他們敢騙我們……我會解決掉他們的。"
70013050-13 = "所以請別擔心，亞瑠大人。"
70013050-14 = "呃……嗯！"
70013050-15 = "我並沒有擔心哦？#n只是覺得還是要小心一點而已。"
70013050-16 = "耶嘿嘿……亞瑠大人果然……無論做什麼事都很謹慎呢。"
70013050-18 = "哎呀，各位！歡迎大駕光臨！"
70013050-19 = "我這就為你們帶位！請跟我來！"
70013050-20 = ""
70013050-22 = ""
70013050-24 = ""
70013050-25 = ""
70013050-26 = "他要是敢耍花招……我會立刻開槍的。"
70013050-27 = "就，就說我沒有在擔心那種事嘛！"
70013050-29 = "來，請隨意挑選您喜歡的座位。"
70013050-30 = "嗯？除了我們以外……一個人都沒有呢？"
70013050-31 = "因為今晚是專門為各位準備的特別招待。"
70013050-32 = "菜單也是特地為各位準備的。"
70013050-33 = "為了今天，我們把飯店數一數二的主廚全都請來了，敬請期待。"
70013050-34 = "這裡是菜單。#n那麼祝各位用餐愉快。"
70013050-35 = ""
70013050-37 = ""
70013050-38 = ""
70013050-39 = "這，這是……！"
70013050-40 = "嗯？怎麼了？是寫了什麼奇怪的菜色嗎？"
70013050-41 = ""
70013050-43 = ""
70013050-44 = "哇哦～"
70013050-45 = "……怎麼了？"
70013050-46 = ""
70013050-48 = ""
70013050-49 = "天啊……"
70013050-50 = ""
70013050-52 = ""
70013050-53 = ""
70013050-54 = "怎，怎麼了嗎！？果然是陷阱嗎！？"
70013050-55 = "遙香醬，你看得懂這些菜是什麼嗎？"
70013050-56 = ""
70013050-58 = ""
70013050-59 = ""
70013050-60 = "奧賽特拉黃金帝王魚子醬布利尼薄餅……？"
70013050-61 = "這，這是什麼……？#n除了這個以外，也都是唸得出來但是看不懂的東西……"
70013050-62 = "這，這些是料理的名字嗎？該不會是什麼暗號吧？"
70013050-63 = "咯呵呵，看不懂的話就點來吃吃看吧！"
70013050-64 = "我要這個還有這個，這個也要！"
70013050-65 = "不過還是點一個比較認得出來的菜比較好吧？"
70013050-66 = "比如說……松露奶油燉飯之類的。"
70013050-67 = "那，那個我也不太懂是什麼……所以就交給大家了……！"
70013050-68 = "好，那我就點餐囉。"
70013050-69 = "服務生！"
70013050-70 = "是，請問您想點些什麼呢？"
70013050-71 = "從這裡到這裡，全部都給我們送上來。"
70013050-72 = "還有松露奶油燉飯！"
70013050-73 = ""
70013050-75 = ""
70013050-77 = "好的。#n那麼飲料的部分呢？"
70013050-78 = "飲，飲料？"
70013050-79 = ""
70013050-81 = ""
70013050-82 = ""
70013050-83 = "（唔，這我倒是沒想到……）"
70013050-84 = "（不過來到這種地方卻點普通的飲料，那樣一點也掛不住面子啊……！）"
70013050-85 = ""
70013050-87 = ""
70013050-88 = ""
70013050-89 = ""
70013050-90 = "呵呵，請慢慢挑選。"
70013050-91 = "畢竟今晚這間餐廳，都是為了招待各位而準備的。"
70013050-92 = ""
70013050-94 = ""
70013050-95 = ""
70013050-97 = ""
70013050-99 = "（之後，大家享用了一頓豐盛的晚餐）"
70013050-100 = "（那是便利屋68開業以來，最豪華的一頓晚餐）"
70013050-102 = ""
70013050-103 = "啊～吃得好飽，真是幸福的夜晚。"
70013050-104 = "尤其是甜點之前的那道菜，真的超好吃的。"
70013050-105 = "名字叫什麼來著？亞瑠醬還記得嗎？"
70013050-106 = "既，既然是烤過的牛肉，應該就叫牛排吧。"
70013050-107 = "不過好像不是普通的牛排就是了。"
70013050-108 = "總，總之好吃就行了。#n對吧，遙香？"
70013050-109 = ""
70013050-111 = ""
70013050-112 = ""
70013050-113 = ""
70013050-114 = "……"
70013050-115 = "遙香？"
70013050-116 = "啊……是的！亞瑠大人。#n我也覺得很開心，耶嘿嘿……"
70013050-117 = "你看哪裡看到都恍神了？"
70013050-118 = "啊，那，那個……我看到那邊有一條似曾相識的巷子……"
70013050-119 = ""
70013050-121 = ""
70013050-122 = ""
70013050-123 = "那條巷子……"
70013050-124 = "……啊。"
70013050-125 = "咯呵呵，我們要不要去那邊看看？感覺會挺有趣的。"
70013050-126 = "可是……"
70013050-127 = "沒關係啦！走吧走吧～！"
70013050-128 = "也對。如果有在意的事，就應該去確認看看。"
70013050-129 = "因為面對過去也是很重要的。"
70013050-130 = "……好的。"
70013050-131 = "既然……大家都這麼說的話……"
70013050-133 = "……好久沒來這裡了呢。"
70013050-134 = "這裡是我和大家第一次相遇的……那條巷子。"
70013050-136 = "這裡還是跟以前一樣呢。"
70013050-137 = "不過遙香醬變了很多，對吧？"
70013050-139 = "是，是這樣嗎？我自己不太清楚……"
70013050-140 = "確實變了很多呢。"
70013050-141 = "那時候你還只是個又弱小又可憐的孩子……#n但現在已經是我們便利屋68值得信賴的員工了。"
70013050-142 = "耶嘿嘿……沒想到可以得到您這樣的評價……實在是感激不盡。"
70013050-143 = "……"
70013050-144 = "應該就是這裡沒錯，亞瑠大人突然出現並且救了我。"
70013050-145 = "那時候……我想保護我照顧的那個孩子，但是……"
70013050-146 = "……"
70013050-147 = "不，不過沒關係！因為我多虧了大家──"
70013050-148 = "……嗯？等一下，遙香醬。"
70013050-149 = "現在遙香醬腳邊的雜草，不就是當年的那株雜草嗎？"
70013050-150 = "……咦？那是什麼意思……"
70013050-151 = ""
70013050-153 = ""
70013050-154 = ""
70013050-155 = "啊……！啊啊……！"
70013050-156 = "還，還活著……！這孩子……還好好地活著……！！"
70013050-157 = "而且竟然還開了花……是，是怎麼獨自一個人……"
70013050-158 = ""
70013050-159 = ""
70013050-160 = "這孩子並不是獨自綻放的哦。"
70013050-161 = "不是有遙香每天照顧他嗎？"
70013050-162 = "多虧如此，它才能儲存足夠再次綻放的養分吧。"
70013050-163 = "那，那種事……"
70013050-164 = "啊！我剛好想到一個好主意。"
70013050-165 = "我們把那株雜草帶回事務所吧！#n把它移植到花盆裡，然後大家一起照顧怎麼樣？"
70013050-166 = "嗯，非常帥氣呢。簡直就是硬派作風啊。"
70013050-167 = "社長都這麼說了哦，遙香。"
70013050-168 = ""
70013050-170 = ""
70013050-171 = ""
70013050-172 = "……"
70013050-173 = "謝，謝謝大家。"
70013050-174 = "謝謝大家願意收留我。"
70013050-175 = "謝謝大家如此珍惜……從小就被討厭的我，真的非常感謝你們。"
70013050-176 = "這份恩情，我就算死也一定會報答的……！"
70013050-177 = "說什麼傻話。我不是說過報恩早就足夠了嗎？"
70013050-178 = "咯呵呵。也別再說「想死」之類的話了，要是少了遙香醬我們該怎麼辦啊？"
70013050-179 = "嗯。我們大家聚在一起，才是便利屋68嘛。"
70013050-180 = "所以……今後也請多多指教囉，遙香。"
70013050-181 = ""
70013050-183 = ""
70013050-184 = ""
70013050-186 = ""
70013050-187 = ""
70013050-188 = ""
70013050-190 = "（就這樣……不論是隔天，還是之後的每一天……）"
70013050-191 = "（便利屋68硬派的日常依然會持續下去）"
70013050-193 = "雜草不會獨自綻放"
