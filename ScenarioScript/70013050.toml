[translation]
70013050-1 = "잡초는 홀로 피지 않는다 5"
70013050-2 = "며칠 후……."
70013050-4 = "호텔 파인 다이닝 레스토랑 라운지"
70013050-5 = "……."
70013050-6 = "……으으음. 우리가 또 이곳에 올 줄이야."
70013050-7 = "쿠후후, 호텔에서 사례를 하고 싶다잖아? 그러면 받아주는 게 예의지."
70013050-8 = "괘, 괜찮겠지? 손해배상 청구하려고 덫을 놓은 건 아니겠지?"
70013050-9 = "괜찮을 거야."
70013050-10 = "조사해 보니 이 호텔은 예전부터 리가토니 패밀리에게 시달리고 있었어."
70013050-11 = "그걸 우리가 퇴치해 준 거야. 사례를 하고 싶다는 마음은 거짓이 아니겠지."
70013050-12 = "만약 우릴 속인 거라면…… 제가 해치울게요."
70013050-13 = "그러니까 걱정 마세요, 아루 님."
70013050-14 = "으, 으음!"
70013050-15 = "걱정은 누가 걱정했다는 거야? 난 그저 주의하자는 말을 하려던 것뿐이었어."
70013050-16 = "헤헤……. 역시 아루 님…… 무슨 일이든 신중하시네요."
70013050-18 = "아이고, 여러분! 잘 오셨습니다!"
70013050-19 = "바로 안내해 드리겠습니다! 따라오시죠!"
70013050-26 = "허튼짓하면…… 바로 쏴버릴게요."
70013050-27 = "그, 그러니까 그런 걱정 말래두!"
70013050-29 = "자, 마음껏 원하는 자리에 편히 앉으십시오."
70013050-30 = "응……? 우리 말곤 아무도 없네?"
70013050-31 = "오늘 저녁은 여러분만을 위한 특별한 초대석입니다."
70013050-32 = "메뉴도 여러분을 위해 특별히 준비했습니다."
70013050-33 = "오늘을 위해 저희 호텔의 내로라 하는 쉐프를 전부 모셨으니 기대하셔도 좋을 겁니다."
70013050-34 = "자, 여기 메뉴판입니다. 부디 마음껏 즐겨 주시길."
70013050-39 = "이, 이건……!"
70013050-40 = "응? 왜 그래? 뭐 이상한 메뉴라도 적혀 있어?"
70013050-44 = "와우~."
70013050-45 = "……뭔데 그래?"
70013050-49 = "세상에……."
70013050-54 = "뭐, 뭔가요? 역시 우릴 함정에 빠뜨린 건가요?"
70013050-55 = "하루카 쨩. 이 메뉴들 뭔지 알아보겠어?"
70013050-60 = "오세트라 골든 임페리얼 캐비어 블리니……?"
70013050-61 = "이, 이게 뭔가요……? 이거 말고도 읽을 수는 있지만, 잘 모르는 게 잔뜩 있는데……."
70013050-62 = "애, 애초에 음식 이름이 맞긴 한 거죠? 무슨 암호 같은 건 아니죠?"
70013050-63 = "쿠후후, 뭔지 모르겠으면 일단 시켜보자!"
70013050-64 = "이거랑, 이거랑, 이것도!"
70013050-65 = "그래도 하나 정도는 알 것 같은 메뉴를 시켜 보는 게 좋지 않을까?"
70013050-66 = "예를 들면…… 트러플 크림 리조또 같은 거."
70013050-67 = "그, 그것도 뭔지 잘 모르겠지만…… 믿고 맡길게요……!"
70013050-68 = "좋아. 그럼 주문할게."
70013050-69 = "웨이터!"
70013050-70 = "네, 어떤 걸 주문하시겠습니까?"
70013050-71 = "여기서부터 여기까지 전부 가져다줘."
70013050-72 = "트러플 크림 리조또도!"
70013050-77 = "그렇군요. 마실 것은 어떻게 드리면 될까요?"
70013050-78 = "마, 마실 거?"
70013050-83 = "(으윽, 그건 생각 못 했는데…….)"
70013050-84 = "(이런 곳에 와서 평범한 음료수를 달라고 하면 그건 그것대로 체면이 안 선다고……!)"
70013050-90 = "후후, 천천히 골라주십시오."
70013050-91 = "오늘 이 호텔 레스토랑은 여러분의 것이니까요."
70013050-99 = "이후 모두가 풍요로운 저녁 식사를 즐겼다."
70013050-100 = "흥신소 68이 영업을 시작한 이래, 가장 호화로운 저녁 식사였다."
70013050-103 = "아아, 배부르다. 진짜 행복한 저녁이었어."
70013050-104 = "특히 마지막 디저트 먹기 전에 먹었던 메뉴 있잖아. 그거 진짜 좋았는데."
70013050-105 = "그거 이름이 뭐였더라? 아루 쨩. 기억나?"
70013050-106 = "쇠, 쇠고기를 구운 거니까 스테이크겠지."
70013050-107 = "그냥 스테이크는 아닌 것 같지만 말이야."
70013050-108 = "아, 아무튼 맛있었으니 된 거야. 그렇지, 하루카?"
70013050-114 = "……."
70013050-115 = "하루카?"
70013050-116 = "아…… 네! 아루 님. 저도 좋았어요. 헤헤……."
70013050-117 = "멍하니 어딜 보고 있었던 거야?"
70013050-118 = "아, 저, 그게……. 저쪽에 뭔가 익숙한 골목이 보여서……."
70013050-123 = "저 골목은……."
70013050-124 = "……아."
70013050-125 = "쿠후후, 우리 저쪽으로 가보지 않을래? 뭔가 재밌을 것 같은데."
70013050-126 = "하지만……."
70013050-127 = "괜찮을 거야. 가자, 가자~!"
70013050-128 = "그래. 우리 사원이 신경 쓰이는 것이 있다면 가보는 게 좋겠지."
70013050-129 = "과거와 마주하는 것도 중요하니까."
70013050-130 = "……네."
70013050-131 = "여러분이…… 그렇게 말씀하신다면……."
70013050-133 = "……오랜만이네요."
70013050-134 = "여러분과 처음 만났던…… 그 골목이에요."
70013050-136 = "여긴 예전 그대로네."
70013050-137 = "하지만 하루카 쨩은 많이 바뀌었지? 안 그래?"
70013050-139 = "그, 그런가요? 잘 모르겠는데……."
70013050-140 = "확실히 많이 바뀌었어."
70013050-141 = "그때는 그저 약하고 불쌍한 아이였지만, 지금은 우리 흥신소 68의 믿음직한 사원이니까."
70013050-142 = "헤헤…… 그렇게 말씀해 주시니…… 감사할 따름이네요."
70013050-143 = "……."
70013050-144 = "아마도 이쪽이었을 거예요. 아루 님이 나타나셔서 절 구해주셨죠."
70013050-145 = "그때 저는…… 제가 돌보던 아이를 지키려 했지만……."
70013050-146 = "……."
70013050-147 = "하, 하지만 괜찮아요! 저는 여러분 덕분에……!"
70013050-148 = "……응? 잠깐만, 하루카 쨩."
70013050-149 = "지금 하루카 쨩이 서 있는 곳에 있는 풀, 그때 그 풀 아니야?"
70013050-150 = "……네? 그게 무슨……."
70013050-155 = "아……! 아아……!"
70013050-156 = "사, 살아있었어요……! 이 아이…… 살아있었어요……!!"
70013050-157 = "게다가 꽃까지 피웠다니……. 어, 어떻게 혼자서……."
70013050-160 = "이 아이는 혼자서 피어난 게 아니야."
70013050-161 = "하루카가 매일 돌봐 줬었잖아?"
70013050-162 = "그 덕에 다시 피어날 정도의 영양분을 저장할 수 있었던 거겠지."
70013050-163 = "그, 그런……."
70013050-164 = "아! 나, 마침 좋은 생각이 났어."
70013050-165 = "우리 저 풀을 사무실로 가져가자! 화분에 옮겨 심어서 모두가 돌봐 주는 거야! 어때?"
70013050-166 = "음, 완전 쿨한데? 그야말로 하드보일드야."
70013050-167 = "그렇다고 하네, 하루카."
70013050-172 = "……."
70013050-173 = "가, 감사합니다."
70013050-174 = "거두어 주셔서 감사합니다."
70013050-175 = "어렸을 때부터 모두가 싫어하던 저를…… 아껴 주셔서 정말로 감사합니다."
70013050-176 = "이 은혜는, 정말 죽어서도 갚겠습니다……!"
70013050-177 = "무슨 소리야. 은혜라면 이미 갚았다고 했잖아."
70013050-178 = "쿠후후, 죽는다는 말도 이제 그만 해. 하루카 쨩이 없으면 우린 어쩌라고?"
70013050-179 = "응. 모두가 모여야 흥신소 68인 거니까."
70013050-180 = "그러니까, 앞으로도 잘 부탁해. 하루카."
70013050-190 = "그렇게 다음 날도, 그다음 날도……."
70013050-191 = "흥신소 68의 하드보일드한 일상이 계속되었다."
70013050-193 = "잡초는 홀로 피지 않는다"
