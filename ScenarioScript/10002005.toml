[translation]
10002005-1 = "프롤로그;여름 바다의 소녀들"
10002005-6 = "와! 바다예요, 바다!"
10002005-7 = "진짜 바다예요, 아즈사 쨩! 드디어 우리가 바다에 도착했다고요!"
10002005-8 = "응. ……바다네."
10002005-9 = "어라……. 생각보다 담담하네요? 좀 더 순수하게 기뻐해도 좋을 텐데……."
10002005-10 = "처음이잖아요? 아즈사 쨩. 바다라고요! 우여곡절 끝에 처음으로 온 바다잖아요?"
10002005-11 = "아즈사 쨩을 위해 모두 힘냈는걸요!"
10002005-12 = "그쵸, 선생님?"
10002005-13 = "[s1] \"고생한 건 내가 아니라 너희들이었지만…….\"\n[s2] \"설마 바다를 가 본 적이 없었을 줄이야.\""
10002005-14 = "아니. 나쁘다는 건 아니야. 나도 조금은 감탄하고 있으니까."
10002005-15 = "아니. 나쁘다는 건 아니야. 나도 조금은 감탄하고 있으니까."
10002005-16 = "다만……."
10002005-17 = "그렇지. 조금 일들이 있었으니까."
10002005-18 = "……지금도 진행중이고."
10002005-19 = "……."
10002005-20 = "그, 그건……."
10002005-26 = "키헤……. 키헤헤!!"
10002005-27 = "……하아. 어쩌다가 저까지 이런 곳에……."
10002005-28 = "케헤헤헤!!"
10002005-30 = "케케케케케케케케-!!!"
10002005-35 = "……."
10002005-36 = "……."
10002005-37 = "이제부터……."
10002005-38 = "이제부터 어떻게 하죠……. 저희?"
10002005-43 = "사[wa:200]건[wa:200]의[wa:400] [wa:500]전[wa:200]모"
10002005-49 = "얌전히 들어가 주세요. 딴 생각은 하지 마시고."
10002005-50 = "꺄, 꺄아아-?!"
10002005-51 = "……큭."
10002005-58 = "수고많으셨습니다. 선배."
10002005-59 = "하아……. 대체 왜 이런 일이……."
10002005-60 = "현재 집계된 피해는 정의실현부의 부원 30여명이 중경상, 동쪽 학원 광장이 반파, 12번 교사가 완파 되었고……."
10002005-61 = "피해보고는 나중에 해주세요. 마시로."
10002005-62 = "그런데…… 이게 학생 두 명이 입힌 피해 규모가 맞나요? 중대 규모의 적과 싸운 게 아니라……?"
10002005-63 = "상대가 전차를 탈취해서 빠른 기동력을 바탕으로 전격전을 벌이면……. 대전차무기를 확보하기 전까진 대응이 어려워서……."
10002005-64 = "게다가 전차 위에서 지정사수가 척탄병만 노려대니……"
10002005-65 = "놀랐습니다, 그런 전술."
10002005-66 = "……그러네요. 설마 대놓고 전차를 훔치다니. 보기보다 대담한 부분이 있네요, 두 사람."
10002005-67 = "네에-!? 후, 훔친 게 아니에요! 잠깐만 빌려 쓰고 다시 돌려 놓으려고 한 건데……"
10002005-68 = "세간에선 그걸 보통 훔쳤다고 하지 않나요……? 아지타니 히후미 씨. 그리고 시라스 아즈사 씨."
10002005-69 = "……흥."
10002005-70 = "……여러분들의 처우는 곧 논의할 예정이니 그때까지 그 방에서 얌전히 계셔주세요."
10002005-76 = "아, 아우……. 뭔가 단단히 오해가 생긴 거 같은데……."
10002005-77 = "아까웠어. 히후미. 마지막에 저격수의 매복을 방심하지만 않았어도 2시간은 더 버틸 수 있었을 거야."
10002005-78 = "아, 아즈사 쨩. 일단 지금은 오해를 살 말은 안 하는 게 좋지 않을까요오……"
10002005-79 = "그리고 애초에 왜 정의실현부 부원들을 공격한 거예요?! 얌전히 투항했어야 했던 거 같은데……."
10002005-80 = "쫓아오니까 공격했을 뿐이야. 그리고 히후미가 전차를 잘 조종해서 20명 가까이 해치울 수 있었고."
10002005-81 = "특히 그 순간 가속 후 코너에서 한 드리프트는 엄청 훌륭했어."
10002005-82 = "그, 그건 조종한 게 아니라…… 아무거나 막 만진 건데…… 아, 아우우……."
10002005-83 = "어, 어떡해요?! 이대로라면 학원의 전차를 훔쳐서 교내를 질주하며 정의실현부 부원들을 수십명이나 해치운 대악당이 되어 버린다구요……!"
10002005-84 = "그 말 그대로잖아?"
10002005-85 = "아, 아니에요…… 제 계획은 이게…… 이런 게 아닌데……."
10002005-86 = "아우우……."
10002005-87 = "이제 어떻게 되는 거지? 손톱이라도 뽑히는 거야? 고문에 견디는 훈련은 했어? 히후미?"
10002005-88 = "그런 훈련은 안 해요……. 그리고 정의실현부가 고문 같은 걸 할 리도 없고요……. 아마도……."
10002005-89 = "정의실현부의 부장도? 그쪽은 고문보단 처형인가……."
10002005-90 = "츠, 츠루기 씨는…… 자, 잘 모르겠지만…… 그, 그래도 같은 학우를 괴롭힐 리가……."
10002005-91 = "들리는 소문으로는 이미 몇 명이나 보내버렸다던데."
10002005-92 = "아, 아우우……. 그 소문은 저도 들었지만……."
10002005-93 = "이렇게 된 이상 솔직하게 다 털어놓고 용서를 비는 수 밖엔 없겠네요……."
10002005-95 = "……"
10002005-96 = "그러니까 전차를 훔친 이유가……"
10002005-97 = "아즈사 씨에게 바다를 보여주고 싶어서…… 라고요?"
10002005-98 = "네에…… 그래서 학원 비품을 살짝 빌려서 타고 갔다 오려고…… 절대 훔치려던 게 아니었어요……."
10002005-99 = "성실히 보충수업부를 이끌어 온 모범생 히후미 씨니까 거짓말을 할 거라고 생각하지 않지만……."
10002005-100 = "바다라면, 그냥 가면 되잖아요? 왜 굳이 전차를……?"
10002005-101 = "아, 안 돼요! 그건 안 돼요."
10002005-102 = "아즈사 쨩은 바다를 한번도 본 적이 없단 말이에요. 이번이 첫 바다라고요! 분위기를 내야 하잖아요!?"
10002005-103 = "네에……?"
10002005-104 = "여름 방학이고, 여태 한 번도 바다에 못 가본 아즈사 쨩의 첫 바다잖아요? 해변이잖아요?"
10002005-105 = "해변이니까……?"
10002005-109 = "그러면 당연히 전차를 타고 가야하잖아요?!"
10002005-115 = "이해했습니다. 여름방학. 빛나는 바다. 반짝이는 모래사장. 친구들과 떠나는 바다 여행."
10002005-116 = "그러면 전차가 빠질 수 없죠. 로망이니까요. 저는 이해합니다."
10002005-118 = "(끄덕끄덕끄덕!)"
10002005-119 = "그, 그런가요……?"
10002005-120 = "그런거야?"
10002005-121 = "요컨대, 우정. 바다. 로망, 그리고……."
10002005-125 = "……? 으, 으응? 뭔가요!? 지진?"
10002005-126 = "아뇨. 그런 건 아닙니다. 이 소리는……."
10002005-131 = "청춘-------------!!!!"
10002005-132 = "(와장창-!)"
10002005-133 = "(콰앙!! 와장창-!!)"
10002005-136 = "키에에에에엑-!!"
10002005-138 = "히, 히이이이익-!?! 벼, 벽을 뚫고 나타나버렸어요?!"
10002005-139 = "츠루기……?"
10002005-141 = "츠루기 선배님!? 지금까지 어디 계셨던 건가요!?"
10002005-142 = "키에아아아악-!!!"
10002005-143 = "바다아어이이이아아!!"
10002005-144 = "여름!! 우정!! 크케케케켁!!"
10002005-145 = "……???"
10002005-146 = "으아아아 잘못했어요! 용서해주세요! 제 손톱은 뽑아도 별로 즐겁지 않으니까아……!"
10002005-147 = "츠루기 선배……? 오늘따라 특히 텐션이 높은 것 같습니다만……."
10002005-150 = "……흠."
10002005-151 = "과연…… 어쩌면 이건……."
10002005-152 = "……츠루기."
10002005-153 = "크케케케케……!"
10002005-154 = "……크헤?"
10002005-155 = "잠시만, 이쪽으로……."
10002005-156 = "어엉? ……?"
10002005-161 = "휴, 휴우……"
10002005-162 = "무서웠어요…… 정말로……"
10002005-163 = "……아직 끝이 아니야. 어쩌면 최후의 항전을 준비해야 할지 모르니, 마음을 단단히 먹어. 히후미."
10002005-164 = "에, 에!? 그런 건가요? 정말로 그렇게 되는 건가요, 저희들!? 마시로 씨……!"
10002005-165 = "으음…… 글쎄요……. 요 며칠간 츠루기 선배가 기운이 없어보였는데 말이죠."
10002005-166 = "지금은 텐션이 높아보인다고 해야 하나, 기분이 나빠 보인다고 해야 하나……."
10002005-167 = "아무래도 역시 피와 화약의 축제가 곧…… 시작될 거 같은데."
10002005-168 = "아, 아우우…… 역시……."
10002005-172 = "……다녀왔습니다."
10002005-173 = "히, 히익!! 제발 최후의 항전만큼은!! 아니, 유언이라도 남기게 해주세요!"
10002005-174 = "……네? 유언?"
10002005-175 = "……츠루기라면 일단은 잘 이야기해서 돌려보냈고요."
10002005-176 = "대신 두 분께 부탁드려야 할 일이 좀 생길 거 같아요."
10002005-177 = "네, 네!? 저희한테요?"
10002005-180 = "……이해했어. 사법 거래지?"
10002005-181 = "불법적이고 위험하고 누구도 하고 싶어하지 않는 그런 일을 떠맡기려는 거군."
10002005-182 = "으음……. 그렇게 볼 수도 있을 수도 있고……"
10002005-183 = "정확히는 오늘 있었던 일을 징계 대신 봉사활동으로 대체한다는 느낌이겠지만……"
10002005-184 = "보, 봉사활동이요……?"
10002005-185 = "뿐만 아니라 저희 쪽에서 여비는 물론 전차까지 정식으로 대여해 드릴게요. 그러면 모두가 행복한 엔딩이 되겠네요."
10002005-190 = "……그렇게 해서, 지금의 이 사법거래가 이루어진 거지."
10002005-191 = "'츠루기씨와 같이 바다로 가서 주어진 임무들을 완수하고, 증거사진을 찍어 제출하세요.'"
10002005-192 = "'임무들은 이 리스트에 작성해 두었습니다……'"
10002005-193 = "……라니, 하스미 씨는 대체 왜 이런 임무를 저희에게……."
10002005-194 = "그래서 도무지 저희 둘만으로는 어떻게 이 일을 이어가야 할지 몰라서……"
10002005-195 = "……선생님께 부탁드렸던 거예요."
10002005-196 = "[s] \"잘 모르겠지만 힘내 볼게.\""
10002005-197 = "아하하……"
10002005-198 = "그래도 같이 와 주셔서 든든해졌어요!"
10002005-202 = "음……."
10002005-203 = "이 녀석은 감시 역인가. 우리가 도망치지 못하게 철저하게 감시할 셈이겠지. 하여간 철두철미한 녀석들이다, 정의실현부."
10002005-204 = "딱히 그런 임무는 아닙니다만……"
10002005-205 = "감시당하고 있는 이상, 방심하지 않겠어. 그 내막에 어떤 진의를 감추고 있을 지는 모르니까 말이야."
10002005-206 = "(뭔가 오해가 있는 거 같은데……)"
10002005-209 = "……요컨대 여름 휴가를 보내고 오라는 얘기인가요?"
10002005-210 = "네. 츠루기, 요즘 며칠간 침울해져서 우울해하고 있었거든요."
10002005-211 = "(그러셨던가요……?)"
10002005-212 = "요 며칠간 계속 강행군이었고……"
10002005-213 = "이대로라면 정의실현부의 임무 수행에 차질이 생겨버려요."
10002005-214 = "모처럼 좋은 기회니까, 마시로도 가서 푹 즐기다 오세요."
10002005-215 = "그렇군요. 쉬는 것도 임무……"
10002005-216 = "이것도 정의실현을 위한 일이니 최선을 다하겠습니다. 선배."
10002005-219 = "이 미션을 수행하지 못하면…… 끌려가서 손톱을…… 아우우……."
10002005-220 = "[ruby=MIA]임무 수행 중 실종[/ruby]을 의도하고 있는 것일지도 모른다."
10002005-221 = "[s] \"……그 임무 리스트 좀 볼 수 있을까?\""
10002005-222 = "아, 네! 여기 있어요."
10002005-227 = "<모래성 만들기와 모래찜질>, <수영 배우기>, <비치발리볼 하기>, <불꽃놀이>, <수박깨기>, <바다의 집 가기>……"
10002005-228 = "다 해서 이렇게 6개네요. 이 일들을 츠루기 씨와 함께 수행하고 증거 사진을 찍어야 해요……"
10002005-229 = "[s3] \"……역시 그냥 놀다 오라는 것 같은데.\"\n[s4] \"그냥 위시리스트 아냐, 이거?\""
10002005-230 = "그렇게 말할 줄 알았지. 하지만 틀렸다. 선생님은 너무 순진한 게 탈이야."
10002005-231 = "그렇게 말할 줄 알았지. 하지만 틀렸다. 선생님은 너무 순진한 게 탈이야."
10002005-232 = "원래 비밀 기관은 무고한 사람을 이용해 공작활동을 벌이는 법이다."
10002005-233 = "이런 일일수록 뒤에 다른 의도가 숨어 있는 법. 하물며 상대는 다른 곳도 아닌 그 트리니티의 정의실현부……"
10002005-234 = "임무를 수행하고 쓸모가 없어지면 쥐도 새도 모르게 처리 당하겠지. 단 한 순간도 방심하지 않겠어."
10002005-235 = "하우우…… 아즈사 쨩 또 무서운 소릴……."
10002005-236 = "그치만 결국 하기로 약속 했잖아요? 받아버렸으니 어쩔 수 없다고요."
10002005-237 = "덕분에 이렇게 크루세이더 쨩까지 빌렸는 걸요…… 에헤헤…… 그래도 이건 기쁘달까……"
10002005-238 = "바다와 수영복, 해변, 그리고 전차……"
10002005-239 = "제가 원하던 완벽한 여름방학의 이미지예요!!"
10002005-240 = "으, 음. 히후미가 그렇다면 그런 거겠지만……"
10002005-241 = "그러니까, 일단 뒷이야기는 나중에 생각하도록 하는 게 어떨까요?"
10002005-242 = "우선은 주어진 이것들을 잘 해내고……"
10002005-250 = "키헤헤헤헤헤!!"
10002005-251 = "캬하하하!!! 바다아아!!! 해변!! 하하하!!!"
10002005-252 = "꺄아아악! 뭐, 뭐야!? 뭐야 저건!?"
10002005-253 = "……해내고……"
10002005-254 = "귀, 귀신!? 바다 귀신이다!! 모두 도망쳐!!!"
10002005-257 = "캬하하하하하하하하!!!"
10002005-260 = "……해내……"
10002005-264 = "……"
10002005-265 = "……해……"
10002005-266 = "……저희 정말로 잘 해낼 수 있을까요, 선생님?"
10002005-267 = "[s5] \"힘내, 히후미! 파이팅!!\"\n[s6] (고개를 돌린다.)"
10002005-268 = "흐아아아아아앙~!! 선생니이이임~~!!"
10002005-269 = "흐아아아아아앙~!! 선생니이이임~~!!"
