[translation]
10059070-1 = "제7화;전열 정비"
10059070-2 = "……이상이 제가 입수한 브로커의 전언이에요."
10059070-3 = "정말 대단합니다, 우라라 부회장. 브로커와 접촉해 협상 장소를 만들어 내다니."
10059070-4 = "지금 이 순간을 기억하기 위한 특별 기념품을 지정해야겠어요. 어디 보자……."
10059070-5 = "아, 그래요. 제가 아끼는 이 머리핀을 드리겠어요. 우라라 부회장에게도 아주 잘 어울리겠죠."
10059070-6 = "가, 감사합니다……."
10059070-12 = "[ns] \"협상 장소는 일주일 뒤, 블랙마켓 인근의 슬럼가라고 했지?\""
10059070-13 = "네. 사실상…… 전면전을 예고한 것과 다름없어요……."
10059070-14 = "죄송해요. 좀 더 좋은 제안을 받아내지 못해서……."
10059070-15 = "아닙니다. 애초에 저도 일이 쉽게 풀릴 거라고는 생각하지 않았으니까요."
10059070-16 = "그쪽도 저와 생각이 같을 겁니다. 동원할 수 있는 병력은 모두 끌고 나타나겠죠."
10059070-17 = "그렇다면 우리도 학원의 전력을 집중하겠어요."
10059070-18 = "우라라 부회장?"
10059070-19 = "아…… 네! D-Day까지 사감대원들의 훈련 일정을 작성해 볼게요."
10059070-20 = "카논 서기관."
10059070-21 = "저는 브로커와 블랙마켓의 정보를 취합해 효율적인 작전을 구상해 보겠습니다."
10059070-22 = "역시 믿음직한 분들이군요. 잘 부탁드리겠습니다."
10059070-23 = "[s] \"나는 뭘 하면 될까?\""
10059070-24 = "선생님은…… 학원의 학생들을 격려해 주세요."
10059070-25 = "이번 일로 다들 마음고생이 심했습니다."
10059070-26 = "그 원인을 제공한 제가 나서는 것보다는, 모두가 따르는 선생님께서 살펴주는 것이 좋겠죠."
10059070-27 = "[s1] \"그렇게 생각한다면 같이 가자.\"\n[s2] \"그러는 편이 효과도 더 좋을 거야.\""
10059070-30 = "제가 선생님과……?"
10059070-31 = "후후. 재미있는 아이디어입니다만, 안타깝게도 저는 처리해야 할 업무가 있어서요."
10059070-32 = "유감스럽지만, 신청하신 데이트는 다음으로 미뤄두도록 하겠습니다."
10059070-33 = "흐음, 선생님이 학생에게 공개 데이트 신청이라니."
10059070-34 = "안 되겠습니다. 이 건도 기록으로 남겨서 후세에까지 널리 알려야……."
10059070-35 = "[s] \"왜곡된 기록이잖아……!\""
10059070-39 = "기록이란 원래 왜곡되기 쉬운 법이죠."
10059070-40 = "그중에서도 힘이 없는 자의 기록은, 강자의 입에 맞춰 모든 것이 바뀌게 됩니다."
10059070-41 = "그런 의미에서 이번 싸움은 반드시 승리해야만 합니다."
10059070-42 = "모두, 각오를 굳혀 주세요."
10059070-47 = "(이후, 마나미가 말한 대로 와일드헌트의 학생들을 만나 격려했다.)"
10059070-69 = "(각자가 처한 상황은 달랐지만, 모두 이번 사태의 빠른 해결을 바라고 있었다.)"
10059070-70 = "[ns] \"부디 잘 해결됐으면 좋겠는데…….\""
10059070-71 = "(그렇게 시간이 흘러…….)"
10059070-83 = "[ns] \"벌써 이런 시간이…….\""
10059070-85 = "[ns] \"슬슬 샬레로 돌아갈까?\""
10059070-87 = "(그러고 보니, 아직 본관에 불이 켜져 있다.)"
10059070-90 = "[ns3] (마나미가 아직 있는 걸까?)\n[ns4] 본관의 평의회실에 들어가 본다."
10059070-103 = "[ns] \"저, 마나미……?\""
10059070-105 = "선생님? 언제 여기에……?"
10059070-106 = "[s5] \"아…… 미안. 엿볼 생각은 없었어.\"\n[s6] \"노크했는데도 대답이 없어서…….\""
10059070-109 = "……이런. 생각보다 깊이 집중하고 있었나 보군요."
10059070-110 = "학원의 서류 작업을 미리 처리하고 있었답니다."
10059070-111 = "앞으로 어떤 일이 일어날지 알 수 없으니까요."
10059070-112 = "그나저나 이 시간에 무슨 일이시죠? 샬레로 돌아가신 줄 알았는데."
10059070-113 = "[s] \"돌아가려 했는데, 불이 켜져 있는 게 보여서.\""
10059070-114 = "후후, 혹시 호기심이 고양이를 죽인다는 속담을 아시는지."
10059070-115 = "으음? 선생님은 고양이가 아니라 상관없다고요?"
10059070-116 = "……."
10059070-120 = "……이렇게 거리낌 없이 다가오는 사람은 정말 오랜만이군요."
10059070-121 = "이 학원에서 저를 두려워하지 않는 사람은 둘 정도였습니다."
10059070-122 = "카논 서기관과 사요 사감대장."
10059070-123 = "그 외의 사람들은 다들 제 앞에 서면 겁을 먹더군요."
10059070-124 = "우라라 부회장마저도, 저와 단둘이 있으면 긴장하는 느낌이 있어요."
10059070-125 = "그런데도 선생님은 저를 피하지 않으시네요."
10059070-126 = "대부분의 학생이 두려워하는, 독선과 독단으로 학원을 이끄는 저를."
10059070-127 = "[s] \"선생이 학생과 가까워지고 싶은 건 당연한 거잖아?\""
10059070-130 = "……."
10059070-131 = "평의회장인 저도, 선생님의 앞에서는 평범한 학생…… 이라는 겁니까?"
10059070-132 = "……."
10059070-133 = "제법…… 신선하군요. 나쁘지 않은 대답이었습니다."
10059070-137 = "안에 누구 있니?"
10059070-142 = "응……? 평의회장이랑 선생님?"
10059070-143 = "불 켜놓고 갔나 해서 끄러 왔더니……."
10059070-144 = "아…… 신경 써주셔서 감사합니다."
10059070-145 = "아직 선생님과 나눌 대화가 있으니, 마무리는 제가 하고 돌아가도록 하죠."
10059070-146 = "으으응……? 이런 늦은 밤에?"
10059070-147 = "……흐음?"
10059070-151 = "아아, 그렇구나—"
10059070-152 = "후후, 걱정 마. 아무한테도 말 안 할게."
10059070-153 = "그럼 좋은 시간 보내라고."
10059070-154 = "사, 사요 사감대장……?"
10059070-159 = "……."
10059070-160 = "……뭔가, 쓸데없는 오해를 산 것 같군요."
10059070-161 = "아무래도 오늘은 이만 쉬러 가는 것이 좋겠습니다. 선생님도 샬레로 돌아가시길."
10059070-162 = "[s] \"나는 좀 더 마나미와 이야기를 나누고 싶은데.\""
10059070-163 = "……."
10059070-164 = "역시 당신은 거리낌이 없군요."
10059070-165 = "좋습니다. 상대가 도전해 온다면 피하지 않는 것이 평의회장인 저의 도리."
10059070-166 = "장소를 바꿔서, 조금만 더 이야기를 나누도록 하죠."
10059070-167 = "[s] \"조용한 곳이라면…… 샬레에 갈까?\""
10059070-171 = "후후…… 후후후……."
10059070-172 = "이런 야심한 때에 학생을 데려간다고요? #n사전에 약속도 없이?"
10059070-173 = "당연하지만 각하입니다."
10059070-174 = "그렇게 아쉽다는 표정 지어도 어쩔 수 없습니다. 안 되는 건 안 되는 겁니다."
10059070-175 = "대신…… 다른 곳으로 선생님을 모시도록 하죠."
10059070-176 = "아무에게도 공개하지 않았던 저만의 프라이빗한 공간."
10059070-177 = "저의……."
10059070-182 = "개인 박물관입니다."
10059070-183 = "[s] \"그런 곳에 내가 가도 괜찮은 거야?\""
10059070-184 = "오히려 좋은 기회라고 생각했습니다."
10059070-185 = "서로의 예술관을 비교해 보기에 이보다 좋은 장소도 없겠죠."
10059070-186 = "자, 어떻게 하실래요? 도전해 보시겠습니까?"
10059070-187 = "[s7] 도전해 본다.\n[s8] 고개를 마구 끄덕인다."
10059070-190 = "아아, 좋습니다. 그럼 안내하도록 하죠."
10059070-191 = "부디 제 기대에 부합해 주시길."
10059070-195 = "소개하죠. 이곳이 바로……."
10059070-200 = "저의 개인 박물관입니다."
10059070-201 = "마주하신 소감이 어떠신지?"
10059070-202 = "[s9] (예술품도 있지만, 잡동사니로 보이는 이상한 물건도 있다…….)\n[s10] \"정말…… 다양한 것들이…… 모여 있네?\""
10059070-205 = "잘 이해가 안 된다는 반응이네요."
10059070-206 = "이런 예술을 알아보지 못하신다니. 마이너스 100점 드리겠습니다."
10059070-207 = "[s] \"윽……!\""
10059070-208 = "뭐, 사실 일반인의 시선이라면 이해 못 하는 것도 무리는 아닙니다."
10059070-209 = "소장품의 가치를 정하는 것은, 세간의 평론가가 아닌 저 자신이니까요."
10059070-210 = "다른 누구도 아닌, 제가…… 저만을 위해 선정한 예술인 겁니다."
10059070-211 = "그 안에 담긴 감정은 시간마저 뛰어넘을 수 있죠."
10059070-212 = "말씀드렸듯이, 수집은 감각의 예술이니까요."
10059070-216 = "[ns] \"……저 티켓은 설마?\""
10059070-217 = "아아, 알아보셨군요."
10059070-218 = "그렇습니다. 선생님과의 첫 만남 때 사인을 받았던 그 티켓입니다."
10059070-219 = "앞으로 선생님의 행동에 따라 계속 장식장에 남을지 쓰레기통에 들어갈지 결정될 아이죠."
10059070-220 = "[s] \"나와의 추억을 쓰레기통에 버리진 말아줘!\""
10059070-221 = "후후, 여전히 반응이 재미있으시네요."
10059070-222 = "안심하시길. 농담이니까요."
10059070-223 = "마음이 바뀌었다고 쓰레기통에 들어가는 하찮은 수집품은 이곳에 들여놓지 않습니다."
10059070-224 = "선생님과의 티켓도, 샬레와의 협업을 기념하는 것이기에 꽤 중요한 의미를 가지죠."
10059070-225 = "……그래요. 이곳의 수집품들은 모두 특별한 아이들."
10059070-226 = "그만큼 저마다의 사연을 가지고 있답니다."
10059070-227 = "그 안에 깃든 감정들을 하나하나 설명하려면 몇 날 며칠을 새워도 부족할 정도죠."
10059070-228 = "그래서일까요……."
10059070-229 = "……이 아이들을 지켜보고 있으면, 저도 모르게 그 감정에 취하게 된답니다."
10059070-230 = "행복, 영광, 좌절, 슬픔, 극복, 환희…… 그 모든 것이 이 안에 담겨 있죠."
10059070-231 = "선생님은 어떻게 생각하시는지?"
10059070-232 = "아직도 이 아이들이 수상한 잡동사니로 보이시나요?"
10059070-233 = "[s] \"……아니. 절대로 아니야.\""
10059070-237 = "[ns] \"소박하면서도, 훌륭한 박물관이었구나.\""
10059070-238 = "……후후. 마음에 드는 답변입니다. 플러스 50점 해서, 현재 스코어 마이너스 50점입니다."
10059070-239 = "여기서 50점을 추가 획득하면 0점이 되니 분발해 주시길."
10059070-240 = "[s] \"분발해야 0점이라니, 너무해……!\""
10059070-241 = "0점도 제 기준에선 높은 거랍니다?"
10059070-242 = "참고로 첫 만남 때는 마이너스 5천 점이었습니다."
10059070-243 = "[s] \"……?!\""
10059070-244 = "그 이야기는, 선생님은 지금까지 그 마이너스 점수들을 꾸준히 쇄신하고 계셨다는 것."
10059070-245 = "이대로 분발하시면, 최종 스코어인 10점까지도 달성할 수 있을지도요?"
10059070-246 = "[s] \"최종 스코어라면 최소한 100점으로 해줘!\""
10059070-247 = "후후, 과연 어떨까요?"
10059070-248 = "제 박물관에 대한 이야기를 비밀로 해주시면 고려해 보도록 할게요."
10059070-249 = "[s11] \"그러고 보니 이 박물관…….\"\n[s12] \"세간엔 이상한 소문이 돌고 있던 것 같던데…….\""
10059070-255 = "와일드헌트의 특별한 예술품들이 은밀히 보관된 장소."
10059070-256 = "학생들에게 아무런 정보도 공개하지 않는 금단의 성소."
10059070-257 = "평의회장의 욕망이 만들어낸, 키보토스 최대의 예술 수장고."
10059070-258 = "……이런 소문 말씀이군요."
10059070-259 = "네. 저도 알고 있답니다. 이 박물관의 이야기가 왜곡되어 떠돈다는 건."
10059070-260 = "하지만, 그 소문이 완전히 틀린 것은 아니에요."
10059070-261 = "이곳의 예술품들이 특별한 것도, 정보를 공개하지 않은 것도, #n저의 욕망이 만들어낸 장소라는 것도 맞으니."
10059070-262 = "……저의 욕망은 여기서 멈추지 않을 겁니다."
10059070-263 = "저는 언젠가, 이보다 더 규모가 큰 박물관을 만들고 싶어요."
10059070-264 = "저뿐만이 아니라, 학생 모두의 추억이 담긴 박물관을 만드는 거죠."
10059070-265 = "그 추억은 학생들이 꿈을 이루는 데 훌륭한 버팀목이 될 거예요."
10059070-266 = "어떤가요? 꽤 좋은 박물관이 될 것 같지 않나요?"
10059070-267 = "[s] \"마치 큐레이터 같은 계획이네.\""
10059070-268 = "……네. 저는 모두를 위한 큐레이터가 되려 해요."
10059070-269 = "그것이 제가 평의회장이 된 이유니까."
10059070-270 = "[s13] (어째서 예술학원의 가장 높은 자리에 오른 학생이……)\n[s14] (……큐레이터의 꿈을?)"
10059070-273 = "(그런 생각을 떠올린 순간, 장식장에 있는 어떤 물건이 눈에 들어왔다.)"
10059070-276 = "(그것은 티아라.)"
10059070-277 = "(그것도 평범하지 않은 티아라다.)"
10059070-278 = "[ns15] (그러고 보니…… 어디선가 비슷한 티아라를 봤던 것 같은데.)\n[ns16] \"………….\""
10059070-282 = "선생님?"
10059070-286 = "[ns] \"……이기자, 마나미.\""
10059070-288 = "[ns] \"와일드헌트 예술학원의, 모든 학생을 위해서.\""
10059070-290 = "네. 이길 거랍니다."
10059070-291 = "……반드시."
10059070-293 = "(이후 마나미와 계속 이야기를 나누며, 다가올 싸움에 대한 결의를 굳혔다.)"
10059070-294 = "[ns] \"……그래서, 오늘 내 최종 점수는 몇 점이었어?\""
10059070-295 = "10점입니다."
10059070-296 = "[s] \"오오, 만점 달성인 건가!\""
10059070-297 = "100점 만점에서요."
10059070-298 = "[s] \"으그그극……!\""
