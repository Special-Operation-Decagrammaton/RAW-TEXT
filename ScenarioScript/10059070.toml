[translation]
10059070-1 = "第7話;態勢の立て直し"
10059070-2 = "――以上が、ブローカーからの伝言です。"
10059070-3 = "お見事です、ウララ副会長。#nブローカーとの接触に成功し、交渉の場まで取りつけるとは。"
10059070-4 = "この瞬間を記憶に留めるため、何か記念品を定めましょう。"
10059070-5 = "……では、この髪飾りを差し上げます。#n私のお気に入りではありますが、ウララ副会長にもよく似合いますよ。"
10059070-6 = "あ、ありがとうございます……！"
10059070-12 = "[ns] \"一週間後、ブラックマーケット近郊のスラム街だね？\""
10059070-13 = "はい。#nですが交渉と言いつつ……事実上の宣戦布告かと。"
10059070-14 = "申し訳ありません。#nもう少し穏当な条件を引き出せればよかったのですが……。"
10059070-15 = "いえ、場を設けられただけで御の字です。#n元より話し合いだけで収まるとは思っていませんでしたから。"
10059070-16 = "斯く言う相手も同様でしょう。#n動かせる戦力は全て引き連れてくるはずです。"
10059070-17 = "こちらも、学院の総力をもって迎え撃ちましょう。"
10059070-18 = "ウララ副会長。"
10059070-19 = "……はい！D-Dayに向けて寮監隊の訓練計画を組んでおきます。"
10059070-20 = "カノン書記官。"
10059070-21 = "ブローカーとブラックマーケットに関する情報を整理し、#n最も効率的な作戦を検討します。"
10059070-22 = "さすが、頼もしいですね。よろしくお願いいたします。"
10059070-23 = "[s] \"私は何をすればいい？\""
10059070-24 = "先生には……生徒のケアをお願いできますか。"
10059070-25 = "今回の件で、皆かなり心を痛めています。"
10059070-26 = "その一因である私が声をかけるよりも、#n慕われている先生に寄り添っていただく方がよいでしょう。"
10059070-27 = "[s1] \"そう思うなら、一緒に行こうよ。\"\n[s2] \"その方が、みんなも安心するはずだよ。\""
10059070-30 = "私が、先生と……？"
10059070-31 = "ふふっ。それも面白い案ではありますが……#n残念ながら、私には片づけなければならない仕事がありますので。"
10059070-32 = "せっかくのデートはまたの機会へ持ち越しといたしましょう。"
10059070-33 = "ほう。先生から生徒へ、大胆にもデートのお誘い――"
10059070-34 = "これはいけません。しかと記録し、後世に語り継がなくては。"
10059070-35 = "[s] \"記録が歪んでるよ……！\""
10059070-39 = "記録は往々にして都合よく書き換えられます。"
10059070-40 = "とりわけ、力なき者の記録は、強者に都合のよい物語へと塗り替えられてしまう。"
10059070-41 = "だからこそ、この戦いには必ず勝たなければなりません。"
10059070-42 = "皆さん、覚悟を決めてください。"
10059070-47 = "（その後、ワイルドハントの生徒たちを訪ねて励ました）"
10059070-69 = "（それぞれ置かれた立場は違えど、#nこの事態の一刻も早い解決を願う気持ちは同じだった）"
10059070-70 = "[ns] \"無事に終わってくれるといいけど……。\""
10059070-71 = "（そうして時は過ぎ――）"
10059070-83 = "[ns] \"もうこんな時間か……。\""
10059070-85 = "[ns] \"そろそろシャーレに戻ろうかな。\""
10059070-87 = "（ふと視線を向けた本館には、まだ明かりがついている）"
10059070-90 = "[ns3]（マナミが残っているのだろうか？）\n[ns4] 本館の評議会室に顔を出していく。"
10059070-103 = "[ns] \"……マナミ？\""
10059070-105 = "先生？いつからそこに……？"
10059070-106 = "[s5] \"ごめん。覗くつもりはなかったんだ。\"\n[s6] \"ノックしたんだけど、返事がなかったから。\""
10059070-109 = "おや。思いの外、集中していたようですね。"
10059070-110 = "事務仕事を少しでも片づけておこうと思いまして。"
10059070-111 = "この先、何が起こるか分かりませんから。"
10059070-112 = "私のことはさておき、こんな時間にどうされたのですか？#nてっきり、もうシャーレへお戻りになったものと。"
10059070-113 = "[s] \"帰りがけに、明かりがついているのが見えて。\""
10059070-114 = "ふふっ。好奇心は猫をも……という言葉をご存じですか？"
10059070-115 = "……はい？自分は猫ではないから問題ない、と？"
10059070-116 = "……。"
10059070-120 = "何のためらいもなく私の懐へ踏み込んでくる方は、本当に久しぶりです。"
10059070-121 = "この学院で、私を恐れない方は2人だけです。"
10059070-122 = "カノン書記官と、サヨ寮監隊長。"
10059070-123 = "他の方々は、私を前にすると決まって身構えてしまいますから。"
10059070-124 = "ウララ副会長でさえ二人きりになると、どこか緊張しているように感じます。"
10059070-125 = "だというのに先生は、私を避けないのですね。"
10059070-126 = "多くの生徒から恐れられ、独善的だの独断的だのと言われつつ学院を率いる、私を。"
10059070-127 = "[s] \"先生として、生徒と仲良くなりたいからね。\""
10059070-130 = "……。"
10059070-131 = "評議会長である私も、先生の前ではただの生徒……ということですか？"
10059070-132 = "……。"
10059070-133 = "それは……新鮮ですね。悪くないお答えでした。"
10059070-137 = "中に誰かいるの？"
10059070-142 = "ん……？評議会長と先生？"
10059070-143 = "明かりがついてたから、消し忘れかなって見に来たんだけど……。"
10059070-144 = "お気遣いありがとうございます。"
10059070-145 = "まだ先生とお話がありますので、戸締まりは私がしておきますね。"
10059070-146 = "話……こんな夜遅くに？"
10059070-147 = "……ふうん？"
10059070-151 = "ああ、そういうことか。"
10059070-152 = "ふふ、心配しなくても誰にも言わないよ。"
10059070-153 = "それじゃ、ごゆっくり。"
10059070-154 = "サ、サヨ寮監隊長……？"
10059070-159 = "……。"
10059070-160 = "……何やら余計な誤解を招いてしまったようですね。"
10059070-161 = "今日はもう休みましょうか。先生もお帰りください。"
10059070-162 = "[s] \"私は、もう少しマナミと話したいけどな。\""
10059070-163 = "……。"
10059070-164 = "やはりあなたは、遠慮というものを知りませんね。"
10059070-165 = "ふふっ、いいでしょう。#n挑まれたからには、それに応えるのも評議会長の務めです。"
10059070-166 = "場所を変えて、もう少しだけ話を続けましょうか。"
10059070-167 = "[s] \"静かな場所……シャーレに来る？\""
10059070-171 = "ふふ……ふふふ……。"
10059070-172 = "こんな夜更けに生徒を連れ込むと？#n事前の約束もなく？"
10059070-173 = "当然ですが却下です。"
10059070-174 = "……そんなに残念そうな顔をされても困ります。#n駄目なものは駄目です。"
10059070-175 = "代わりに……別の場所へご案内しましょう。"
10059070-176 = "これまで誰にも見せたことのない、私だけの秘密の場所。"
10059070-177 = "私の――"
10059070-182 = "個人博物館です。"
10059070-183 = "[s] \"私が行ってもいいの？\""
10059070-184 = "むしろ、ちょうど良い機会だと思いまして。"
10059070-185 = "お互いの芸術観を知るには、これ以上ふさわしい場所もないでしょう。"
10059070-186 = "残すは先生のご意思だけですが……いかがされますか？"
10059070-187 = "[s7] 首を縦に振る。\n[s8] 勢い良く何度も頷く。"
10059070-190 = "よろしい。では、ご案内いたしましょう。"
10059070-191 = "どうか、期待を裏切らないでくださいね。"
10059070-195 = "どうぞ。ここが――"
10059070-200 = "私の個人博物館です。"
10059070-201 = "いかがですか？実際にご覧になった感想は。"
10059070-202 = "[s9] （芸術品もあるけど、ガラクタみたいなモノもある……）\n[s10] \"色んなモノがあるんだね……？\""
10059070-205 = "その反応……まだご理解いただけていないようですね。"
10059070-206 = "この価値が分からないとは……マイナス100点です。"
10059070-207 = "[s] \"うぐっ……！\""
10059070-208 = "とはいえ、一般的な感覚では理解できなくとも無理はありません。"
10059070-209 = "収蔵品の価値を決めるのは、世間でも評論家でもなく、私自身です。"
10059070-210 = "他の誰でもない、この私が――私のために選定した芸術なのです。"
10059070-211 = "そこに宿った感情は、時を経てなお記憶を呼び覚ますもの。"
10059070-212 = "以前、お話しましたね。収集とは「感覚の芸術」なのだと。"
10059070-216 = "[ns] \"あっ。あのチケット、もしかして……？\""
10059070-217 = "お気づきになりましたか。"
10059070-218 = "先生と初めてお会いした時に、サインをいただいたチケットです。"
10059070-219 = "今後の先生次第で、このまま飾られ続けるか、#nそれともゴミ箱行きになるかが決まる子ですね。"
10059070-220 = "[s] \"思い出を捨てないでよ！\""
10059070-221 = "ふふっ、相変わらず良いリアクションをしてくださいますね。"
10059070-222 = "ご安心ください、冗談です。"
10059070-223 = "気が変わった程度で捨ててしまえるようなものを、私はここに置きません。"
10059070-224 = "あのチケットも、シャーレとの関係を象徴する品として大切な意味を持っています。"
10059070-225 = "……この場所にあるものは、どれも私にとって特別な子たちなのです。"
10059070-226 = "一つひとつに、それぞれの時間と物語がある。"
10059070-227 = "宿った思いをすべて語るのなら、何日あっても足りません。"
10059070-228 = "……だからでしょうか。"
10059070-229 = "この子たちを眺めていると、宿った感情に引き込まれてしまうのです。"
10059070-230 = "幸福、栄光、歓喜、挫折、悲しみ、克服……ここには、そのすべてが残っています。"
10059070-231 = "先生はどう思われますか？"
10059070-232 = "まだ、怪しげなガラクタに見えるでしょうか？"
10059070-233 = "[s] \"……ううん。\""
10059070-237 = "[ns] \"とても素敵な博物館だね。\""
10059070-238 = "ふふっ、気に入りました。#nプラス50点――これで現在のスコアは、マイナス50点です。"
10059070-239 = "あと50点でようやく0点ですから、引き続き励んでください。"
10059070-240 = "[s] \"まだ0点に届かないなんて……。\""
10059070-241 = "0点でも、私の基準では高得点なのですよ？"
10059070-242 = "ちなみに、初めてお会いした時はマイナス5000点でした。"
10059070-243 = "[s] \"えっ……！？\""
10059070-244 = "先生は、積み重ねてきた減点を少しずつ取り戻しているところなのです。"
10059070-245 = "この調子で頑張れば、最終スコア10点も夢ではないでしょう。"
10059070-246 = "[s] \"せめて100点にしてほしいな！\""
10059070-247 = "ふふっ、どうでしょう。"
10059070-248 = "この博物館のことを秘密にしてくださるなら、一考には値するかも。"
10059070-249 = "[s11] \"この博物館といえばさ。\"\n[s12] \"妙な噂が広まってるみたいだけど……。\""
10059070-255 = "ワイルドハントの特別な芸術品が密かに眠る場所。"
10059070-256 = "生徒にさえ何ひとつ明かされていない、禁断の聖域。"
10059070-257 = "評議会長の欲望が生み出した、キヴォトス最大の芸術収蔵庫。"
10059070-258 = "……そのような噂がありますね。"
10059070-259 = "私も存じています。ずいぶん尾ひれがついているようですが。"
10059070-260 = "もっとも……全てが荒唐無稽なものというわけでもありません。"
10059070-261 = "ここにある品々が特別なのも、誰にも公開していないのも――#nそして私の欲望から生まれた場所であることも、事実ですから。"
10059070-262 = "……ですが、私の欲望はこの程度では終わりません。"
10059070-263 = "いつか、ここよりもずっと大きな博物館を作りたいと思っています。"
10059070-264 = "私一人の記憶ではなく、生徒全員の思い出を収める博物館を。"
10059070-265 = "そこに残された思い出が、夢を追いかける生徒の心の支えになればと願って。"
10059070-266 = "いかがでしょう。素敵な博物館になると思いませんか？"
10059070-267 = "[s] \"まるで、キュレーターみたいな夢だね。\""
10059070-268 = "ふふっ。ええ。私は、皆のためのキュレーターになりたいのです。"
10059070-269 = "それが、評議会長になった理由ですから。"
10059070-270 = "[s13] （マナミは芸術学院の頂点に立っているのに）\n[s14] （そんな生徒が、どうしてキュレーターの夢を？）"
10059070-273 = "（そう考えた瞬間、飾り棚に置かれた芸術品が目に入った）"
10059070-276 = "（それはティアラだった）"
10059070-277 = "（だが、ただのティアラではなさそうだ）"
10059070-278 = "[ns15] （……どこかで、よく似たものを見たような気がする）\n[ns16] \"…………。\""
10059070-282 = "先生？"
10059070-286 = "[ns] \"……勝つよ、マナミ。\""
10059070-288 = "[ns] \"ワイルドハント芸術学院の、すべての生徒のために。\""
10059070-290 = "ええ。勝ちましょう。"
10059070-291 = "……必ず。"
10059070-293 = "（その後もマナミと語り合いながら、来たる戦いへの決意を固めた）"
10059070-294 = "[ns] \"ところで、今日の私の最終スコアは何点だったの？\""
10059070-295 = "――10点です。"
10059070-296 = "[s] \"ついに満点！？\""
10059070-297 = "100点満点中の、ですが。"
10059070-298 = "[s] \"うぐぐぐ……！\""
