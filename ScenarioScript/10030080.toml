[translation]
10030080-1 = "에필로그;작심삼일"
10030080-4 = "(새해가 시작된 지 약 1주일 후……)"
10030080-6 = "베리타스 해커 휴게실"
10030080-9 = "으읏…… 그으읏……"
10030080-14 = "하레 선배, 힘내! 거의 다 왔으니까!"
10030080-15 = "앞으로 조금만 더…… 신기록이 눈앞에 있습니다……!"
10030080-25 = "으으읏…… 됐다!"
10030080-26 = "선배, 대단해! 지난 기록에서 10kg이나 추가했는데 바로 성공하다니……!"
10030080-27 = "저도 꽤 성장했다고 생각했습니다만, 역시 하레의 체력을 따라가려면 한참 멀었군요."
10030080-28 = "그렇게 띄워주니 뭔가 부끄럽네……"
10030080-29 = "뭐, 그래도 요 며칠간 계속 꾸준히 트레이닝을 해왔으니까."
10030080-30 = "[ruby=파워]근력[/ruby]이 필요한 운동이라면 어느 정도는 무리 없이 할 수 있을 것 같아."
10030080-32 = "좋아. 그럼 이제는 [ruby=스태미나]지구력[/ruby] 위주로 단련해 볼까……?"
10030080-38 = "……나 왔어."
10030080-42 = "아, 선배! 어서 와!"
10030080-44 = "오랜만입니다, 부부장."
10030080-45 = "새해 첫 일출을 본 이후로 부실에서 보는 건 처음인 것 같네. 요새 많이 바빴어?"
10030080-47 = "응. 보안 자문을 하고 있는 IT 기업들의 신년회에 참가해야 해서 한동안 여기저기 바쁘게 돌아다녔거든……"
10030080-48 = "행사에서 자기소개와 신년 인사를 하도 많이 반복해서 그런지…… 소리를 지른 것도 아닌데 목이 조금 쉰 것 같아."
10030080-49 = "선배, 너무 무리하는 거 아니야……?"
10030080-50 = "일감은 언제든 받을 수 있지만, 한 번 잃은 건강은 쉽게 되찾을 수 없습니다."
10030080-51 = "……돌아오는 다음 주에는 조금 쉬는 게 어때?"
10030080-52 = "그러게. 휴식은 중요하지만……"
10030080-53 = "그래도 지금처럼 중요한 시기에 외부 활동을 쉴 수는 없으니까. 걱정해 줘서 고마워."
10030080-54 = "그러고 보니 너희들은 지난 한 주간 뭘 하면서 보냈어?"
10030080-55 = "아까 부실 밖에서 잠깐 들었는데, 뭔가 운동 계획을 짜는 것처럼 보였는데……"
10030080-56 = "평소에는 부실 밖으로 나오지도 않던 학생들이 솔선해서 운동 계획을 짜다니, 캠핑의 성과가 있었던 것 같아서 뭔가 흐뭇해지네."
10030080-61 = "아, 그게 사실은……"
10030080-62 = "운동 계획이라는 말 자체는 틀린 게 아니지만……"
10030080-69 = "<피트니스 시뮬레이터>의 육성 모드를 진행하는 중이었어!"
10030080-75 = "………뭐?"
10030080-76 = "아, 선배라면 <피트니스 시뮬레이터>를 모를 수도 있겠네. 나온 지 얼마 되지 않은 게임이니까."
10030080-77 = "<피트니스 시뮬레이터>는 게임 속의 피트니스 선수가 되어 다양한 신체 능력을 단련하는 게임이야. 현실의 다양한 트레이닝을 실감 나게 체험할 수 있어서 큰 화제가 되었지!"
10030080-78 = "다만 1회차 플레이로 키울 수 있는 선수 능력치에는 상한이 있어서……"
10030080-79 = "좋은 능력치의 선수를 뽑기 위해서는 오랜 시간을 들여 반복 플레이를 하는 게 필수적이야."
10030080-80 = "그러니까…… 지금까지 말했던 근력이나 지구력이 현실의 운동에 대한 이야기가 아니라……"
10030080-81 = "……게임 속 캐릭터의 이야기였다고?"
10030080-82 = "응!"
10030080-83 = "혹시나 해서 묻는 것이지만……"
10030080-84 = "너희들, 마지막으로 부실 밖에 나간 게 언제였어?"
10030080-86 = "어제…… 아니, 그저께였던가?"
10030080-87 = "훨씬 전입니다. 캠핑을 다녀온 이후로는 계속 부실에만 있었으니까요."
10030080-88 = "<피트니스 시뮬레이터>의 육성 모드를 모두 플레이하려면 최소한 사흘은 넘게 걸리니까, 어쩔 수 없지."
10030080-90 = "……그럼 다음 주 계획은?"
10030080-92 = "아, 다음 주에는 고전 액션 게임 <BOOM> 시리즈의 리부트작인 <BOOM 이터널>이 발매될 예정이라서."
10030080-94 = "진리를 추구하는 베리타스의 일원으로서, 키보토스에서 가장 뜨거운 신작 게임의 리뷰를 놓칠 수는 없지!"
10030080-95 = "그러고 보니 <요괴 MAX>에서 <BOOM 이터널>의 플레이 영상을 SNS에 인증하면 한정 프로모션 상품을 추첨으로 증정한다고 하던데……"
10030080-96 = "지난 시리즈에서 달성한 스피드런 기록을 경신할 기회로군요."
10030080-97 = "치히로 선배도 어때? 새벽에 게임이 출시되자마자 같이 밤샘 플레이를—"
10030080-106 = "역시 너희들은……"
10030080-111 = "건강한 생활 습관에 대해 다시 한번 따끔하게 훈계해야겠어……!"
10030080-117 = "으앙~ 한 번만 봐줘, 선배!"
10030080-125 = "전뇌신춘행진곡"
