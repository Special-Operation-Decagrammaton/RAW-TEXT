[translation]
22100-1 = "제10화;가혹한 진실 2"
22100-15 = "이딴 조무래기들로 날 막을 수 있으리라고 생각하냐?! 아앙?!"
22100-19 = "역시 네루. AMAS 정도로는 널 막을 수 없다는 거네."
22100-20 = "나로서는 이렇게까지 하고 싶지는 않았지만."
22100-22 = "……토키."
22100-23 = "예스, 맴."
22100-24 = "지금부터 <무장>의 사용을 허가하겠어."
22100-26 = "네, 알겠습니다."
22100-31 = "지시에 따라 지금부터 <모드2>로 이행합니다."
22100-32 = "하아? 또 뭘 그렇게 궁시렁궁시렁……."
22100-42 = "어라…… 복장이……"
22100-43 = "[ns] \"……<모습>이 변했어?\""
22100-45 = "……!"
22100-54 = "그쪽이냐?!"
22100-69 = "놓치지 않아……!"
22100-82 = "또 빗나갔다고……?!"
22100-83 = "수, 순식간에 사라져버렸어……."
22100-89 = "이 자식 어디로………"
22100-91 = "네루 선배, 등 뒤에……!"
22100-92 = "……뭐?"
22100-106 = "크으윽?!"
22100-107 = "[s] \"네, 네루가 순식간에 제압당했어?!\""
22100-109 = "눈 깜짝할 새에…… 갑작스럽게 나타나서……"
22100-110 = "아, 아으………"
22100-115 = "크아아악! 이거 못 놔?! 쳐부숴 버린다?!"
22100-116 = "계속 그렇게 저항하시면, 팔이 꺾일 수 없는 각도로 꺾일 거예요. 선배."
22100-117 = "물론 다른 분들도 섣불리 움직이지 말아 주시길. 무의미한 저항은 추천드리지 않습니다."
22100-119 = "……웃!"
22100-120 = "……!"
22100-123 = "[ns] \"방금 그건 대체…….\""
22100-124 = "만일을 대비해 만들어 둔 특수 호위 무장이야."
22100-125 = "물론 이런 곳에서 꺼내고 싶었던 물건은 아니지만."
22100-126 = "그럼 AMAS. 아리스를 회수해오도록."
22100-136 = "!!"
22100-137 = "잠깐 멈……!"
22100-139 = "섣불리 움직이는 건 좋지 않을 거야."
22100-145 = "무관계한 아이들까지 상처 입히고 싶지는 않으니까."
22100-151 = "(움찔!)"
22100-154 = "[ns] \"멈춰. 리오.\""
22100-157 = "아니, 선생. 그건 내가 할 말이야."
22100-158 = "물론 나도 싸우고 싶지 않아."
22100-159 = "당신과 대적하고 싶지도, 솔선해서 미움을 사고 싶은 것도 아니야."
22100-160 = "되려 난 당신에게 묻고 싶어."
22100-161 = "이러한 사태에서 가장 먼저 움직여야 할 건,"
22100-166 = "오히려 어른인 샬레의 선생. 당신이지 않아?"
22100-167 = "[s] \"……뭐?\""
22100-168 = "어린아이보다 냉철하고, 냉정하게 상황을 판단할 수 있는──"
22100-169 = "그러한 어른인 당신이 움직여줘야 하는 거 아냐?"
22100-170 = "[s] \"학생을 상처 입히는 일 따윈……….\""
22100-171 = "언제까지 그런 잠꼬대 같은 말을 늘어놓을 셈이야?!"
22100-172 = "[s] \"……!!\""
22100-173 = "──착각해서는 안 돼."
22100-176 = "<저건> 살아 있는 생명체가 아니야. 당신이 책임져야 할 학생이 아니야."
22100-177 = "만약 그렇게 느낀다면 그건 단순한 <일라이자 효과>에 지나지 않아."
22100-178 = "저건 이 세계를 멸망으로 몰아넣을 가공할 병기야."
22100-181 = "[ruby=아리스]저것[/ruby]과 키보토스의 모든 학생을 저울질하라면 답은 명확해."
22100-182 = "……그럼에도 여전히 당신이 움직이지 않겠다면."
22100-183 = "아리스의 헤일로는 내 손으로 파괴하겠어. 그걸 위한 준비는 모두 끝마쳐 놨으니까."
22100-189 = "……."
22100-190 = "아니야……."
22100-191 = "아니야! 아리스 쨩은 병기니 뭐니 하는, 그런 이상한 게 아니야!"
22100-192 = "아리스 쨩은…… 용사야! 왜냐하면……!"
22100-193 = "아리스 쨩은, 빛의 검을…… 용사의 증거인 슈퍼 노바를 가지고 있으니까!"
22100-195 = "빛의 검이라면…… 엔지니어부에게서 받았다던 그 장난감?"
22100-196 = "그래…… 너희가 그렇게 말한다면……"
22100-197 = "알았어."
22100-205 = "[ns] \"슈퍼 노바의 전원이…… 꺼졌어?\""
22100-206 = "……!"
22100-207 = "가벼운 해킹을 통한 무력화야."
22100-208 = "빛의 검이라는 건 이제 없어."
22100-209 = "그럼 이것으로 증명은 끝난 거지?"
22100-210 = "아리스의…… 검이……… 용사의, 증거가………"
22100-211 = "아, 으……"
22100-217 = "……미도리, 유즈……."
22100-223 = "크으읏! 이 자식이?! 놔! 놓으라고! 젠장!"
22100-224 = "어이, 꼬맹이! 가만히 있지 말고 반격하라고! 어이! 야!"
22100-226 = "………."
22100-227 = "네루 선배…………."
22100-230 = "……선생님……………."
22100-231 = "[s] \"……아리스.\""
22100-232 = "……!!"
22100-239 = "……………모모이."
22100-240 = "이 모든 건 아리스가 있어서……"
22100-245 = "아리스가 <마왕>이기 때문에…… 일어난, 일인가요?"
22100-246 = "……."
22100-247 = "아리스가…… 계속 이곳에 있으면…… 같은 일이…… 몇 번이고……"
22100-248 = "………………"
22100-249 = "……………………아리스가."
22100-250 = "……………………………아리스가 용사가 아니라면……."
22100-255 = "……………그렇, 군요."
22100-261 = "[ns] \"아리스……?\""
22100-266 = "네, 아리스. 전부 이해했습니다."
22100-267 = "…………아리스가 떠나도록 하겠습니다."
22100-268 = "안 돼! 아리스 쨩!"
22100-269 = "아리, 스…… 쨩……."
22100-270 = "뭣…… 너어……!"
22100-275 = "[ns] \"아리스, 그럴 필요 없어.\""
22100-279 = "아니요. 괜찮습니다."
22100-280 = "아리스는…… 선생님을 다치게 하고 싶지 않습니다."
22100-281 = "아리스는……."
22100-291 = "미도리도, 유즈도, 네루 선배도, 다른 사람들도 전부……."
22100-292 = "다치게 하고 싶지 않습니다."
22100-293 = "……모모이가 아리스 때문에 다쳤을 때, 아리스의 가슴이 무척이나 아팠습니다."
22100-294 = "……어째서…… 왜 이런 일이 벌어졌던 건지, 아리스는 잘 모르겠습니다."
22100-297 = "하지만 그래도, 말을 듣고…… 이야기를 듣고…… 이제야 이해했습니다."
22100-298 = "이 모든 건…… 아리스가 있어서 그런 거라는 걸……"
22100-299 = "아리스가 이대로 계속 이곳에 있으면……"
22100-300 = "결국…… 언젠가는 모두가 다치게 된다는 걸."
22100-301 = "[s] \"아냐! 리오의 그런 말 따위 들을 필요 없어!\""
22100-302 = "선생님…… 걱정하지 않으셔도 됩니다."
22100-305 = "괜찮습니다. 아리스는 생명이 아니니까."
22100-306 = "아리스는 밀레니엄의 학생이 아니니까. 이대로 사라져도 괜찮습니다."
22100-307 = "아리스는…… 용사가 아니니까………"
22100-308 = "아리스는……… 괜…… 찮습니다."
22100-313 = "선생님. 그동안 감사했습니다."
22100-314 = "모두, 아리스와 함께 모험을 해줘서 고마웠습니다."
22100-315 = "아리스는………"
22100-319 = "그동안 정말로 행복…… 했습니다."
22100-329 = "그럼. 안녕. 샬레의 선생."
22100-330 = "혹시라도 나의 무례한 행동에 상처받았다면……"
22100-331 = "나중에 모든 일이 끝난 뒤에 당신에게 사과를 하러가겠어."
22100-332 = "그럼."
22100-338 = "(이후 리오와 아리스가 자리를 떠날 때까지)"
22100-342 = "(AMAS와 토키에게 제압된 우리는 손가락 하나 움직일 수가 없었다.)"
22100-347 = "(그저 그렇게 무력하게 지켜볼 수밖에 없던 우리들 앞에서……)"
22100-352 = "(……아리스는 모습을 감췄다.)"
22100-358 = "다음화;그딴 건 아무래도 좋아!"
