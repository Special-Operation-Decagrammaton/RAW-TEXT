[translation]
1013203-1 = "또다시, 모델이에요……?"
1013203-2 = "미술 학원의 원장실"
1013203-3 = "오, 오셨어요, 선생님?"
1013203-4 = "[s]\"무슨 일이야, 츠쿠요?\""
1013203-5 = "그게……."
1013203-6 = "제, 제가 이번에는 미술 학원의 그림 모델로 섭외되었어요."
1013203-7 = "그런데 제가 미술 모델 일은 처음이라……."
1013203-8 = "그렇지만 선생님과 함께라면 조금은 마음 편하게 할 수 있을 것 같고……."
1013203-12 = "자, 잠깐, 이러면 제가 제 사정 때문에 선생님께 민폐를 끼친 게 되는 걸까요?!"
1013203-13 = "죄, 죄송해요……!"
1013203-14 = "[s]\"괘, 괜찮아 츠쿠요……!\""
1013203-16 = "[ns]\"그런데, 어쩌다 또 모델을……?!\""
1013203-17 = "그, 그게 사실은……."
1013203-18 = "저번에 저에게 <닌자는 일곱 번 산다>의 팸플릿을 구해다 주셨던 사장님 기억나시나요?"
1013203-23 = "그분이 딱 한 번만 더 도와달라고 너무 간곡하게 부탁하셔서요……."
1013203-24 = "원래 오늘 이 일을 맡기로 했던 모델이 도망을 쳐 버렸다나 봐요……."
1013203-25 = "그런데 새 모델을 구하는 것은 너무 어렵다고 하셔서……."
1013203-26 = "거기다 미술 모델은 그냥 가만히 있기만 하면 된다고도 하고……."
1013203-27 = "[s1] \"아하……!\"\n[s2] \"난 또, 미술가로 전직하려는 줄 알았어. 그것도 좋지만.\""
1013203-30 = "그, 그럴 리가요!"
1013203-31 = "츠쿠요는 앞으로 훌륭한 닌자가 될 예정인 걸요!"
1013203-32 = "예? 그런데 왜 드레스를 입고 왔느냐고요?"
1013203-33 = "그게, 오늘 이곳에서 수강생들이 그려야 하는 그림의 주제가 ‘드레스를 입은 여인’이라고 하더라고요."
1013203-34 = "그, 그래서 미리 입고 온 거예요."
1013203-39 = "츠쿠요 씨, 지금 교실로 들어가실 수 있으신가요?"
1013203-43 = "예, 예! 바로 가겠습니다!"
1013203-44 = "서, 선생님! 다녀올게요!"
1013203-46 = "미술학원 교실"
1013203-50 = "아, 오늘 모델 대타로 오신 오노 츠쿠요 씨 맞으시죠?"
1013203-51 = "아, 예!"
1013203-52 = "그럼 처음 오셨을 테니 설명을 해드리자면……."
1013203-53 = "일단 츠쿠요님께서 들어가실 반은 와일드헌트 예술학교 진학 준비반입니다."
1013203-54 = "그곳의 데생 수업에서 모델을 서게 되실 거고요."
1013203-55 = "포즈는 제가 현장에서 자세히 알려드릴 테니, 그대로 그냥 가만히 있어 주시면 됩니다."
1013203-57 = "아, 알겠습니다!"
1013203-58 = "처, 처음이지만 열심히 할게요!"
1013203-59 = "하하, 너무 부담 갖지 마세요."
1013203-64 = "(……라고 말은 했지만, 처음이라면 쉽지는 않겠지.)"
1013203-65 = "(오랫동안 가만히 있는 것은, 원하는 대로 움직이는 것보다 훨씬 어려운 일이니까…….)"
1013203-68 = "(……라고 생각했는데.)"
1013203-69 = "(벌써 한 시간째인데 아예 미동도 없다고?!)"
1013203-75 = "저기 그런데, 저 모델분, 사람 맞지?"
1013203-76 = "밀랍 인형 아니었어?"
1013203-77 = "너네 저 사람 몰라? 이번에 엄청나게 주목받았던 신인 패션모델이잖아!"
1013203-78 = "아, 다시 보니 그 사람 맞네!"
1013203-82 = "(어…….)"
1013203-83 = "(걱정했었는데, 이 일, 패션모델보다 훨씬 쉽네요…….)"
1013203-84 = "(그냥 가만히 있는 것만큼은 누구보다 자신 있으니까요…….)"
1013203-85 = "(헤헤, 나무 분장술을 열심히 수련한 보람을 이런 데서 느끼게 되네요.)"
1013203-86 = "(천재다……!)"
1013203-87 = "(강사 생활 10년, 저 정도로 완벽한 미술 모델은 처음이야……!)"
1013203-88 = "(그대로 들어다가 밀랍 인형 박물관에 세워 놔도 아무런 위화감이 없을 정도……!)"
1013203-89 = "(거기다 표정까지도 너무나 편안해……!)"
1013203-90 = "(이런 인재가 어디서 갑자기 나타난 거지?!)"
1013203-92 = "(그렇게 시간이 흐르고, 데생 수업은 끝이 났다.)"
1013203-95 = "수고하셨습니다! 고생 많으셨어요!"
1013203-96 = "헤헤, 고, 고생이라뇨……."
1013203-97 = "그나저나 굉장히 능숙하시던데"
1013203-98 = "이전에도 미술 모델을 해본 적이 있으신가요?"
1013203-99 = "예? 아, 그, 오늘 처음인데요……."
1013203-100 = "(역시, 타고난 천재가 맞았어……!)"
1013203-101 = "저기, 그럼 저는 이만……."
1013203-102 = "잠시만요!"
1013203-103 = "혹시 괜찮으시다면, 오늘 한 번만 더 모델을 서 주실 수 있나요?"
1013203-104 = "예……?"
1013203-105 = "그게, 조소반에서도 마침 모델이 필요해서요……!"
1013203-107 = "시급은 2배로 쳐서 드리겠습니다!"
1013203-108 = "그, 그게……."
1013203-109 = "사실, 츠쿠요 씨처럼 완벽하게 자세를 유지하는 모델은 처음 봤습니다."
1013203-110 = "그래서 다른 학생들도 츠쿠요 씨를 모델로 수업을 할 수만 있다면……."
1013203-111 = "그 아이들의 실력을 높이는 데에 더없이 큰 도움이 될 겁니다!"
1013203-112 = "부탁드립니다!"
1013203-113 = "그, 으우우……."
1013203-117 = "그, 그럼 한 번 더 잘 부탁드립니다……."
1013203-120 = "(그렇게, 츠쿠요는 조소 수업의 모델까지 서게 되었다.)"
1013203-121 = "(그 수업에서도 완벽한 퍼포먼스를 보여줬음은 물론이었고.)"
1013203-122 = "(그리고 몇 시간 뒤…….)"
1013203-125 = "오늘 정말 수고 많으셨습니다, 츠쿠요 씨."
1013203-126 = "가, 강사님도 수고 많으셨어요!"
1013203-131 = "저기, 서, 선생님! 오래 기다리셨죠……?"
1013203-132 = "[s]\"아냐, 학원생들이 작업하는 것을 보느라 재미있었어.\""
1013203-133 = "그, 그렇게 배려해 주지 않으셔도……!"
1013203-134 = "오히려 선생님께서 같이 계셔 주셔서 제가 더 마음 편히 있을 수가 있었던 건데……."
1013203-135 = "예? 조소반은 어땠냐고요?"
1013203-136 = "음, 데생반과 분위기 자체는 크게 다르지 않았는데……."
1013203-137 = "조소라는 것이 계속 찰흙을 깎고 다듬는 일이라서 그런지 공기 중에 흙먼지가 많이 떠다니더라고요……."
1013203-138 = "그래서 목이 조금……."
1013203-139 = "[s3] \"그럼 흙먼지는 충분히 먹었으니…….\"\n[s4] \"이제는 맛있는 밥이나 먹으러 가자.\""
1013203-144 = "저, 저기……."
1013203-145 = "그, 그러면 이번에는 제가……."
1013203-146 = "[s]\"그럴 줄 알고 레스토랑을 미리 예약해 놨지!\""
1013203-147 = "그, 그런……!"
1013203-148 = "가, 감사합니다, 선생님!"
1013203-150 = "(그렇게 일부러 츠쿠요를 데려간 곳은…….)"
1013203-151 = "(백귀야행에 있는, 야채 메뉴가 풍부한 레스토랑이었다.)"
1013203-155 = "(……어쩐지, 츠쿠요의 모델 활동이 오늘로 끝나지 않을 것 같다는 예감이 들었으니까.)"
