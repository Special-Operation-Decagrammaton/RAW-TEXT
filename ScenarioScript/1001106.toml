[translation]
1001106-1 = "높게 높게"
1001106-2 = "산해경 매화원"
1001106-3 = "선생님, 선생님!"
1001106-4 = "나 말이지- 높게 높게 해줘!"
1001106-5 = "[s] \"높게 높게……?\""
1001106-6 = "높게 높게, 모르는 거야?"
1001106-7 = "이렇게 팔을 잡고 높이 올려서 날아다니는 것처럼 해주는 놀이야."
1001106-8 = "슌 언니는 가끔 해줬는데…… 선생님은 못해?"
1001106-9 = "[s] \"아니야, 높게 높게 해줄게.\""
1001106-10 = "와, 신난다!"
1001106-11 = "[s] \"높게- 높게-\""
1001106-12 = "와, 정말 하늘을 나는 것 같아!"
1001106-13 = "고마워, 선생님!"
1001106-14 = "아앗, 치사해! 선생님, 나도 나도!"
1001106-15 = "나도 높게 높게 해줘, 선생님!"
1001106-16 = "[s] \"모두 해줄 테니까 다들 차례를 지켜서 기다려줘.\""
1001106-17 = "하하하, 신난다! 높다, 높아!"
1001106-18 = "이젠 내 차례야!"
1001106-21 = "……."
1001106-23 = "산해경 교실"
1001106-28 = "아까 지켜보니 선생님께서 학생들에게 높게높게를 해주고 계시더라고요."
1001106-29 = "무슨 문제가 있느냐고요? 아뇨, 선생님께서 시간을 내 매화원 학생들과 놀아주신거니 오히려 제가 감사를 드려야 할 정도죠."
1001106-30 = "다만 개인적인 문제라면…… 어째서 제게는 높게높게를 해주시지 않느냐는 점 정도에요."
1001106-31 = "저도 높게높게 좋아하는데…… 양 팔을 들어 펄쩍 날아오르는 걸 느껴보고 싶은데……!"
1001106-32 = "[s] \"하지만, 슌은 아이들과 다르게 무게가……\""
1001106-33 = "지금 숙녀의 몸무게를 입에 담으신 건가요, 선생님?"
1001106-34 = "[s] \"알겠어. 슌에게도 높게높게를 해줄게.\""
1001106-35 = "정말이죠? 어머나, 기뻐라~"
1001106-36 = "자, 양팔을 벌리고 있을 테니 선생님께서 끌어안듯 저를 들어올려주세요."
1001106-37 = "[s] \"자, 그럼 높게……\""
1001106-39 = "하읏!?"
1001106-40 = "아, 아, 아무것도 아녜요. 다시 처음부터……."
1001106-44 = "하으으……"
1001106-45 = "자, 자꾸 선생님의 팔이 겨드랑이에 닿으니 참을 수 없이 간지러워져서……"
1001106-46 = "역시 어린아이가 하는 놀이를 어른이 하지 않는 데에는 이유가 있었군요."
1001106-47 = "높게높게가 이렇게 부끄럽고 민망한 놀이였을 줄이야……"
1001106-48 = "하는 수 없지요. 대신 저는 선생님의 허그를 받아가도록 할게요."
1001106-51 = "후후, 이것도 높게높게 만큼은 아니지만 충분히 즐겁네요."
1001106-52 = "오늘은 충분히 만족했어요. #n고마워요, 선생님."
