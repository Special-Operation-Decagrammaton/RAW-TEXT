[translation]
10032045-9 = "허억……. 헉……. 헉……."
10032045-10 = "대, 대체 무슨……. 이게 무슨 일이지……!?"
10032045-11 = "노리는 녀석들이 있을 거라고는 생각했지만……."
10032045-12 = "그렇다고 노리는 녀석들밖에 없을 줄은……!!"
10032045-13 = "데리고 온 경호원 녀석들도 다 떨어져 나가버렸고……."
10032045-18 = "이봐! <그 녀석>은 지금 어디에 있지? 긴급 사태다! 빨리 이쪽으로 와서 날 도와!!"
10032045-19 = "나? 나는 지금 배우 대기실 쪽이다! 그래, 그쪽으로 와! 나도 거기로 갈 테니!"
10032045-23 = "쯧. 우선 배우 대기실……. 배우 대기실로만 가자. 그러면 그곳에는……!"
10032045-24 = "나의 '대비책'이……!"
10032045-28 = "젠장. 벌써 여기까지……!!"
10032045-33 = "조금만……. 조금만 더 가면……!!"
10032045-37 = "기다리고 있었다. 아무래도 상황이 발생한 모양이군."
10032045-38 = "……!? 이 소리는……!?"
10032045-42 = "설명은 나중에. 우선 이쪽으로 들어오는 게 좋겠어."
10032045-55 = "어, 어디지? 분명 방금 전까지 있었는데……!"
10032045-56 = "배, 배우 대기실 쪽이에요! 아까 전과는 달리 여기저기 총탄과 폭발 흔적이……!!"
10032045-57 = "안에서도 한바탕 한 거야? 아니면 이미 상황이 끝난 걸까?"
10032045-58 = "……어느 쪽이건 안으로 들어갔다는 건 확실하네. 늦지는 않았으면 좋겠는데."
10032045-62 = "[ns] \"……카요코?\""
10032045-63 = "아니. 그냥 좀, 뭔가 찝찝한 느낌이 들어서."
10032045-64 = "저 방……. 분명 다른 출구 하나 없는 막다른 방이었는데, 왜 굳이 저기를……."
10032045-65 = "[s1] \"왜 굳이 저런 곳으로……?\"\n[s2] \"도망치다 잘 못 들어간 건가?\""
10032045-68 = "……그건 모르지. 그렇게 허술한 녀석은 아닐 거라고 생각하지만 말이야."
10032045-69 = "분명 \"2중 3중의 안전장치를 마련해 두는 녀석\"이라고 들었고……."
10032045-73 = "잠깐. 그렇다면 안에 함정 같은 게 있을 가능성도……."
10032045-78 = "얌전히 아루님께 잡히란 말이다아아아-!!"
10032045-85 = "하, 하루카! 잠깐 기다려!"
10032045-86 = "혼자 들어가지 말고 다 같이……!!"
10032045-105 = "……하, 하루카……!?"
10032045-107 = "[ns3] \"하루카가……. 날았어?\"\n[ns4] \"괘, 괜찮아, 하루카!?\""
10032045-110 = "……곤란하게 됐군."
10032045-111 = "이번 의뢰인은 신변을 노리는 녀석들 중에 거물이 많다는 건 미리 들었지만……."
10032045-112 = "……결국 붙을 수밖에 없게 되는 건가, 흥신소 68."
10032045-115 = "[ns5] \"……!? 음?\"\n[ns6] \"이 목소리는…….\""
10032045-119 = "……!? 뭐, 뭐지……!?"
10032045-120 = "보아하니 아란치노가 말했던 '대비책'인 것 같은데."
10032045-121 = "어째 들은 적 있는 것 같은 목소리가……."
10032045-126 = "[ns] \"……어…….\""
10032045-132 = "…………."
10032045-134 = "……조마에 사오리?"
