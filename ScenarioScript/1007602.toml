[translation]
1007602-1 = "치어리더 코토리"
1007602-2 = "(아직 일정이 시작하지 않은 아침. 텅 빈 스타디움에서 비품들을 체크하고 있었다.)"
1007602-9 = "선생님~~!!"
1007602-10 = "오래 기다리셨지요-! 최대한 빨리 달려왔습니다!!"
1007602-11 = "[s1] \"그렇게 서두르지는 않아도 됐는데.\"\n[s2] \"아침 일찍부터 부지런하네. 코토리는.\""
1007602-14 = "그, 그런가요!? 아하, 아하하하……."
1007602-15 = "아, 아무튼! 한창 일과 중엔 바쁘실 테니, 혹시나 지금이 타이밍인가 하고 와 봤답니다."
1007602-16 = "네? 무슨 타이밍이냐고요? 그야 물론! 오늘 하루 있을 많은 일들의 준비를 위한……."
1007602-17 = "……준비운동! 스트레칭 타임-!!"
1007602-21 = "어라. 뭔가 의외로 반응이……. 혹시 이미 해 버리신 건가요……?"
1007602-22 = "아, 아니라고요? 잘됐네요!"
1007602-23 = "선수로 뛰지 않으시더라도, 오늘 하루 큰 움직임이 많으실 테니, 스트레칭 정도는 해 두시는 게 좋다고요!"
1007602-24 = "……음? 네?"
1007602-25 = "꼭 해야 하냐고요……? 그야 당연히……. 이건 미리 해 두셔야 혹시 모를 부상을 예방……."
1007602-26 = "……아!"
1007602-27 = "참고로 스트레칭이란, 사용할 근육이나 관절 등을 의도적으로 긴장시키고 이완시켜 '회복 탄력성'을 향상시키는 준비 운동의 한 형태로, 처음으로 한 스포츠 과학 논문에서……."
1007602-28 = "[s3] \"하, 하자~! 스트레칭~! 너무 좋아~!!\"\n[s4] \"지금 바로 시작하자~! 와~!\""
1007602-31 = "오오! 아주 좋네요! 그런 의욕! 역시 선생님이십니다!"
1007602-32 = "하지만 스트레칭 또한 마구잡이로 아무 행동이나 해서는 안 되는 것."
1007602-33 = "그렇기 때문에 제가 미리 동작들을 외워왔지요! 선생님께서 귀찮게 일일이 찾아보지 않으셔도 되게끔!"
1007602-34 = "자, 그럼 지금부터 제가 먼저 동작을 시행할 테니, 보고 따라해 주세요!"
1007602-35 = "첫 번째 동작입니다! 몸을 쭉 펴는 동작이에요!"
1007602-36 = "이렇게 한쪽 다리를 올리고……."
1007602-37 = "그 뒤에는 이렇……게……."
1007602-41 = "이, 이렇……게……?"
1007602-46 = "[ns5] \"……코토리?\"\n[ns6] (뭘 하고 있는 거지……?)"
1007602-49 = "어, 어라……? 어……? 음……?"
1007602-50 = "아니, 그러니까 이게……."
1007602-51 = "……흐엥!?"
1007602-54 = "[wa:1400]― [log=코토리 응원단ND]앗, [wa:900]어라……?[/log]"
1007602-56 = "― [log=코토리 응원단ND]음, [wa:1000]으음…… [wa:1800]팔이…… [wa:1600]닿아야, [wa:1800]하는데……?[/log]"
1007602-59 = "[wa:1700]― [log=코토리 응원단ND]이럴 수가…![/log]"
1007602-61 = "[wa:100]― [log=코토리 응원단ND]여기서 [wa:1200]힘을 [wa:800]빡 주면――!?[/log]"
1007602-64 = "― [log=코토리 응원단ND]히이익!?[/log]"
1007602-66 = "― [log=코토리 응원단ND]아, [wa:600]아야야야야야야……![/log]"
1007602-69 = "[ns7] \"무리하면 안 돼, 코토리! 그러다 다쳐!\"\n[ns8] \"긴장을 풀어. 힘줘서 하는 게 아니야.\""
1007602-72 = "[wa:500]― [log=코토리 응원단ND]이, [wa:800]이상하네요…![/log]"
1007602-74 = "― [log=코토리 응원단ND]찾아본 대로, [wa:1300]하고 있는데…![/log]"
1007602-77 = "[wa:400]― [log=코토리 응원단ND]사람마다 [wa:700]편차가 있다는 건 [wa:600]알고 있었지만,[/log]"
1007602-79 = "[wa:100]― [log=코토리 응원단ND]이 정도일 줄은…….[/log]"
1007602-82 = "[wa:1500]― [log=코토리 응원단ND]다, [wa:900]다시 한번만 더…….[/log]"
1007602-84 = "― [log=코토리 응원단ND]아, [wa:1800]아아아……! [wa:900]아야야……!![/log]"
1007602-87 = "[wa:400]― [log=코토리 응원단ND]더, [wa:1300]더는 [wa:800]무리…[/log]"
1007602-89 = "― [log=코토리 응원단ND]으으으…. [wa:3400]저, [wa:1000]저기…. [wa:1550]선생님, [wa:1700]이건…[/log]"
1007602-92 = "[wa:1100]― [log=코토리 응원단ND]이런 모습을 [wa:1100]보여 드리려던 게[/log]"
1007602-94 = "― [log=코토리 응원단ND]아니었는데…….[/log]"
1007602-97 = "[wa:100]― [log=코토리 응원단ND]못난 모습을…… [wa:2100]보이고 [wa:1600]말았어요……[/log]"
1007602-99 = "[wa:300]― [log=코토리 응원단ND]으으으으…….[/log]"
1007602-103 = "죄송해요, 선생님. 제 계획은 이게 아니었는데……."
1007602-104 = "이래서야 그냥 선생님 시간만 빼앗고 아무런 도움도 못 되는 꼴이네요……."
1007602-105 = "[s9] 천천히 코토리의 등을 밀어준다.\n[s10] \"조금 도와줄게. 긴장을 풀렴.\""
1007602-108 = "서, 선생님……!? 이, 이건 무슨……!?"
1007602-109 = "뭐, 뭔가 엄청 이유는 모르겠지만 부끄러워지는 느낌이 확 드는데요……!!"
1007602-110 = "……네?"
1007602-111 = "원래 스트레칭은 같이하는 경우가 더 많다고요? 특히 처음 하는 사람은……?"
1007602-112 = "그, 그런가요……!? 거기까지는 제대로 찾아보지 못했네요, 저도……!"
1007602-113 = "그, 그그 그럼……!"
1007602-114 = "……자……. 잘부탁드리겠습니다!!"
1007602-116 = "(이후 코토리와 함께, 서로 도와 가며 한 세트의 스트레칭을 시행했다.)"
1007602-117 = "(막상 하고 나니 몸의 뭉쳐 있던 부분들이 풀리며, 훨씬 개운하고 움직이기도 편해졌다.)"
