[translation]
10025005-1 = "프롤로그;사라진 새우"
10025005-2 = "코우사기 공원"
10025005-6 = "더워……"
10025005-7 = "무덥군요……"
10025005-8 = "녹아내리는 것만 같아……"
10025005-13 = " ……현재 시각은 1305시. 캠프 RABBIT의 지표 온도는 35℃……"
10025005-18 = "전에 가지고 온 이동식 캠핑용 에어컨은 어디에 둔 거야? 분명 지난번에 과열된 워크스테이션을 식히느라 쿨러 대용으로 사용한 기억이 있는데."
10025005-19 = "그건…… 지난번의 폭우 때 고장 나 버렸습니다."
10025005-20 = "우으…… 역시 이렇게 될 줄 알았어……"
10025005-22 = "우리는 이대로 뙤약볕 아래에 방치되어 결국은 뭍 위의 불가사리처럼 말라 죽고 말 거야……"
10025005-28 = "거수자 동향 및 경계 태세에 특이사항 없음. 그 외 이슈는……"
10025005-35 = "으아아— 더워서 짜증 나!"
10025005-36 = "종알종알 시끄럽게 불평 좀 하지 마!"
10025005-37 = "도대체 왜 다들 갑자기 불평이야? 날씨가 갑자기 더워진 것도 아니잖아?"
10025005-38 = "특히 모에, 너는 평소에도 폭탄을 시험한다느니 뭐니 하며 불을 잔뜩 피워 대는 주제에……"
10025005-39 = "여름의 열기와 폭탄의 열기는 완전히 다르거든?!"
10025005-40 = "아무리 내가 강력한 화력을 사랑한다고는 하지만, 이렇게 오랜 시간에 걸쳐 뜨거운 바람에 서서히 익혀지는 건 사양이야."
10025005-41 = "물론 파멸적인 기분이 든다는 점에서 이 더위도 제법 나쁘진 않지만…… 하아, 하아……"
10025005-42 = "내 참, 여름을 처음 겪는 것도 아니고. 괜한 호들갑일 뿐이야."
10025005-43 = "잡념을 떨치면 불 속에서도 시원한 법. 이렇게 마음을 가라앉히고 집중하면……"
10025005-48 = "……확실히 오늘은 좀 덥긴 하네."
10025005-49 = "사키. 뜨거운 볕 아래에 계속 머무르면 온열 질환에 걸릴 위험도 있으니, 일단은 그늘 아래로 이동하도록 하지요."
10025005-50 = "……알겠어. 그럼 오늘 경계 임무는 안쪽에서 진행할게."
10025005-61 = "하아…… 전자기기가 내뿜는 열기 때문에 통신 텐트 안에 들어갈 엄두가 안 나."
10025005-62 = "차라리 겨울에는 모니터를 끌어안고 있으면 따듯해서 괜찮은데…… 이래서 여름은 질색이라니까."
10025005-63 = "나, 나도 여름보다는 겨울이 조금 더 괜찮은 것 같아."
10025005-64 = "시야가 넓게 확보되는 저격 포인트는 볕도 잘 드는 경우가 많으니까……"
10025005-65 = "여름의 뙤약볕 아래에서 위장복을 입고 가만히 누워 있노라면 오븐 안에 앉아 있는 것 같아서…… 견디기가 어려워……"
10025005-67 = "저도 여름은 쉽게 몸이 더러워지기 때문에 그다지 좋아하는 계절이 아닙니다."
10025005-68 = "심지어 지금처럼 냉장 시설이 없는 상황에서는…… 음식이 빨리 상하기도 하니까요."
10025005-70 = "맞아."
10025005-71 = "지난번에도 편의점에서 받아온 폐기 도시락이 예정보다 일찍 상하는 바람에 한나절을 쫄쫄 굶어야 했던 적이 있었으니까."
10025005-73 = "받아온 지 하루밖에 지나지 않은 도시락이었는데, 밥에서 쉰내가 나기 시작해서……"
10025005-75 = "눈물을 머금고 귀한 불고기 도시락을 네 개나 버렸었지……"
10025005-76 = "역시 여름은 싫어……"
10025005-77 = "그러고보니 더운 날씨 때문에 그런가? 요새는 새우가 들어간 도시락이 잘 안 보이네."
10025005-78 = "가끔씩 폐기로 나오던 바질 새우 샌드위치가 개인적으로 꽤 마음에 들었었는데."
10025005-80 = "날씨 탓이라고 하기에는 생선 도시락은 꽤 자주 보였던 것 같습니다만……"
10025005-81 = "수레와 마차로 물건을 옮기는 시대도 아니고, 날씨 때문에 물류에 지장이 생길 리가 없잖아?"
10025005-82 = "우리야 냉장 시설이 없으니까 곤란한 것이지만, 편의점에 도시락을 납품하는 기업들은 냉각기가 설치된 냉동 트럭으로 산지부터 편의점까지 해산물을 바로 운송해 온다고."
10025005-83 = "게다가 새우는 대부분이 배 위에서 잡자마자 바로 냉동하기 때문에, 보관과 운송이 손쉬운 해산물 중 하나야."
10025005-84 = "냉동 새우의 선도가 얼마나 좋냐 하면 양식 요리를 하는 셰프들 사이에서는 '가장 신선한 새우는 생새우가 아닌 냉동 새우'라는 말도 있을 정도니까."
10025005-85 = "……너는 도대체 왜 그런 사실을 알고 있는 거야? 옛날에 새우잡이 어선이라도 탔던 거야?"
10025005-86 = "예전에 스쿠버 다이빙 교육을 받을 때 교관에게 들은 것 뿐이거든?"
10025005-88 = "하지만 모에 쨩의 말처럼 요새는 D.U.에서 새우가 거의 보이지 않는 것 같아."
10025005-89 = "어제도 돌아오는 길에도 시내의 음식점에 '새우는 품절이라 주문할 수 없습니다'라고 안내문이 쓰여 있는 걸 보았는걸."
10025005-90 = "다른 해산물에도 같은 문제가 생겼다면 몰라도, 새우의 유통에만 문제가 생겼다니…… 뭔가 수상하네요."
10025005-91 = "설마, D.U.에서 유통되는 새우를 노리고 어딘가의 범죄 조직이 개입했다든가—"
10025005-93 = "새우만 골라서 노리는 범죄 조직이 있다고……? 그게 무슨 이득이 되는 거야?"
10025005-94 = "내가 먼저 말을 꺼내긴 했지만, 최근의 새우 시세를 살펴보았을 때 새우를 훔쳐서 취할 수 있는 이득은 크지 않을 거야. 차라리 게나 전복을 훔치면 모를까."
10025005-95 = "자세한 내막은 모르겠지만 이것도 분명 키보토스에서 흔히 벌어지는 사소한 문제들 중 하나겠지."
10025005-96 = "예를 들자면 새우 트럭만 골라 탈취한 뒤, 맛이 없으면 폭파하는 미식 테러리스트의 소행이라든가……"
10025005-97 = "아니, 그런 녀석들이 정말로 있다면 사소한 문제가 아니잖아."
10025005-99 = "……그렇겠지요, 괜한 걱정을 했네요."
10025005-100 = "최근에 너무 많은 일을 겪어서 조금 예민해졌을지도 모르겠습니다."
10025005-106 = "[ns1] \"다들 안녕!\"\n[ns2] \"오늘따라 정말 날이 무덥네……\""
10025005-110 = "아, 선생님. 낯익은 얼굴이 보이기에 누군가 했었네."
10025005-111 = "이렇게 더운 날 코우사기 공원에는 어쩐 일이야?"
10025005-115 = "[ns3] \"이 근처를 지나가다 너희들이 생각나서.\"\n[ns4] \"근처 편의점에서 아이스크림을 좀 사 왔는데……\""
10025005-121 = "[ns] \"괜찮다면 같이 나누어 먹을래?\""
10025005-123 = "네!"
10025005-130 = "하아…… 살 것 같아……"
10025005-131 = "역시 아이스크림은 더운 여름날에 그늘에서 먹는 게 최고네!"
10025005-132 = "시원한 아이스크림의 냉기가 온몸으로 퍼져 나가는 게…… 마치 냉장고 안에 들어온 기분이야."
10025005-138 = "감사합니다, 선생님. 소대원 모두가 더위에 시달리고 있던 참이었는데……"
10025005-139 = "덕분에 한숨 돌릴 수 있었네요."
10025005-140 = "[s] \"대단한 것도 아닌데, 뭘.\""
10025005-144 = "[ns5] \"그보다 D.U.에서 유통되는 새우가 모두 사라졌다니……\"\n[ns6] \"그게 무슨 소리야?\""
10025005-147 = "아, 그게…… 확실히 파악된 건 아닙니다만."
10025005-148 = "최근 편의점의 도시락에서 새우 메뉴가 갑작스럽게 사라진 것 같아서요."
10025005-157 = "[ns] \"그러고 보니 나도 D.U.에서 새우를 먹은 지 꽤 오래된 것 같네.\""
10025005-159 = "네. 하지만 일시적인 현상일지도 모르고, 확실한 정보도 없기에 대응이 조심스러운 상황입니다."
10025005-160 = "더욱이 누군가가 새우의 유통 과정에 개입하여 부정한 이득을 취하고 있다 하더라도……"
10025005-161 = "이는 총학생회나 발키리의 식품 안전 관련 부서가 처리해야 할 문제이지, 저희 SRT가 개입할 문제는 아니니까요."
10025005-162 = "그러고 보니 D.U.에서 유통되는 새우는 대부분 카네사키 항구 근처의 야토우라 마을에서 가져오는 거지?"
10025005-163 = "응. 그 마을에 유명 수산물 유통 업체인 <레드 훅 익스프레스>의 수산물 가공 공장이 있다고 했던가."
10025005-164 = "원래는 존재감 없는 조용한 어촌 마을이었는데, 거대한 수산물 가공 공장이 세워진 이후로는 출하량이 급격히 늘어나면서 이제는 D.U. 전역에 새우를 공급하게 되었다고 해."
10025005-168 = "어촌 마을, 그리고 바다라—"
10025005-172 = "아아…… 시원한 바다 풍경을 떠올렸더니 날씨가 더 후덥지근한 것 같아……"
10025005-173 = "그러고 보니 바다에 가 본 지도 꽤 되었네요."
10025005-175 = "나는 SRT 학원에 있었을 때가 마지막이었던 것 같아."
10025005-176 = "그마저도 해양 훈련의 실습 차 다녀온 것이라, 바다를 즐길 틈도 거의 없었고……"
10025005-177 = "하지만 학원도 없는 우리가 지금 바다에 가는 건 역시 어렵겠지……"
10025005-178 = "음, SRT 학원이 부활할 때까지 이 공원을 떠나지 않기로 했으니까."
10025005-179 = "작전도 아닌데 멋대로 공원을 떠나 바다에 놀러 가는 건 조금 눈치가 보이지."
10025005-180 = "[s] \"그럼 지금 바로 다 같이 바다에 가자!\""
10025005-181 = "……선생님, 여태까지 우리가 한 소리를 무어로 들은 거야?"
10025005-182 = "우리는 특별한 이유가 없는 한 이 공원을 비울 수 없다니까?"
10025005-183 = "시민의 안전을 책임지고 어떤 상황에서도 빠르게 투입되어야 하는 SRT가 시내를 벗어나 바다에서 여유롭게 바캉스를 즐기는 모습을 보인다면 시민들이 다들 어떻게 생각하겠어?"
10025005-184 = "[s] \"아니, 단순히 바캉스를 즐기러 바다에 가자고 한 게 아니야.\""
10025005-185 = "그, 그럼 무슨 일로 바다에 가는 건가요……?"
10025005-186 = "[s] \"아까 D.U.에서의 새우 유통이 수상하다고 말했었잖아?\""
10025005-190 = "[ns7] \"이런 문제는 현지에서 직접 확인하지 않으면 알기 어려우니까……\"\n[ns8] \"직접 그 마을에 잠입해서 새우의 행방을 조사하는 거야!\""
10025005-193 = "새우의 행방을 찾아 직접 바다에 간다고……?"
10025005-194 = "……선생님의 말씀도 일리가 있군요."
10025005-195 = "신분을 숨긴 채 현지에 잠입하여 위험 요인을 사전에 제거하는 것도 특수부대의 임무 중 하나."
10025005-196 = "FOX의 선배들이 잠입 조사를 위해 관광객으로 위장하던 것을 몇 번 보았던 기억이 있습니다."
10025005-197 = "다만…… 아까도 말씀드렸듯이 현재는 파악된 정보가 거의 없기에 저희가 나서도 되는 일인지 아직도 확신이 들지 않네요……"
10025005-198 = "게다가 막상 확인해 보았더니 어획량 감소로 인한 일시적인 문제였다거나, 물류 상의 착오로 새우가 도착하지 못한 것뿐이라고 하면……"
10025005-199 = "[s9] \"그때는……\"\n[s10] \"이왕 바다에 갔으니 느긋하게 여름휴가를 즐기고 돌아오자.\""
10025005-206 = "……결국 그쪽이 목표였나요."
10025005-207 = "물론 그런 이유라도 없다면, 다들 이 공원을 떠나지 않겠지만요."
10025005-208 = "하지만 SRT가 나서기로 한 이상 허투루 작전에 임할 수는 없습니다."
10025005-209 = "소대원 전원은 지금 즉시 사복으로 환복 부탁드립니다."
10025005-210 = "이번 작전은 주민들의 시선을 끌지 않고 은밀하게 정보를 수집해야 하는 잠입 작전인 만큼, 소대원 모두가 평범한 관광객처럼 보이도록 철저히 위장해야 합니다."
10025005-211 = "……모두 이해하셨는지요?"
10025005-213 = "확인!"
10025005-215 = "그럼 지금부터 야토우라 마을에 잠입하여 새우의 행방을 조사하는……"
10025005-216 = "새우 그물 작전을 개시합니다!"
