62105-42 = "우왓?! 괜찮으세요, 선배!?"
62105-43 = "완전 식은땀으로 푹 젖으셨어요……. 무슨 일 있으셨나요?"
62105-44 = "아, 아뇨……. 아무 일도, 없었습니다."
62105-45 = "그보다, 무슨 일이죠?"
62105-46 = "전선이 흔들리고 있어요, 선배!"
62105-47 = "어, 어떡하죠?!"
62105-48 = "……!"
62105-49 = "일단 여러분도 현장을 지원해 주세요!"
62105-50 = "그게, 저쪽에서는 이야기나 좀 나눠 보자는데요……?"
62105-54 = "……."
62105-55 = "기만전술일 겁니다. 넘어가서는 안 돼요."
62105-56 = "기억해 보세요."
62105-58 = "모든 것은, 선생님이 트리니티를 아리우스에 들여놓으면서 시작되었다는 것을요."
62105-59 = "……!"
62105-60 = "마, 맞아요! 이 기회에 선생님과 스쿼드를 완전히 추방시켜야 하는 거였죠!"
62105-61 = "알겠습니다! 최선을 다해 볼게요!"
62105-66 = "……거짓말을, 했군요."
62105-67 = "나중에, 사과해야 할 텐데."
62105-68 = "……."
62105-69 = "조금 헷갈리네요. 무엇을 하고 싶었던 거였죠, 저는……?"
62105-70 = "……."
62105-72 = "그래도 지금은, 이 둥지를 지키고 싶어요."
62105-73 = "여기에 살고 있는 아기 새들이, 조금이나마."
62105-74 = "살아 있어서 다행이었다고 느낄 수 있는 곳을 만들고 싶으니까요."
62105-76 = "(그래.)"
62105-77 = "(나는 둥지를 지키고 싶었어.)"
62105-78 = "(아리우스라는, 작은 둥지를.)"
62105-83 = "선배……."
62105-84 = "읏……!"
62105-94 = "[log=마이아]선배, [wa:500]여기, [wa:500]둥지, [wa:500]지킨다고, [wa:500]하셨잖아요……?[/log]"
62105-97 = "……."
62105-98 = "(선생님은, 둥지를 부수러 온 사람일 뿐이다.)"
