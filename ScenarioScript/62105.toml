62105-130 = "[log][FF6666][i]우리의 분노를 풀어 다오.[/i][-][/log]"
62105-133 = "……?!"
62105-134 = "[log][FF6666][i]트리니티에게 응징을, 게헨나에게 파멸을.[/i][-][/log]"
62105-135 = "[log][FF6666][i]배신자에게 돌아가야 할, 정당한 심판을.[/i][-][/log]"
62105-138 = "이 목소리는……?"
