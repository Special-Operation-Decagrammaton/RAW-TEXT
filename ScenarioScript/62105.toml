[translation]
62105-4 = "그럴 수가……. 하지만 천사는요? 기록된 종말은?!"
62105-10 = "그렇다는 것은……. 설마……."
62105-11 = "이 손으로……."
62105-16 = "하지만, 어째서 저인가요? 저는 그저……."
62105-17 = "네? 오히려 그렇기에……?"
62105-18 = "으윽?!"
62105-25 = "[log]땅을 망하게 하는 자와 거짓된 자.[/log]"
62105-27 = "[log]그리고 그 이름을 망령되이 일컫는 자들을[/log]"
62105-29 = "[log]비로소 멸망시키실 때로소이다 하더라.[/log]"
