[translation]
10013030-1 = "제3화;유황의 광부들 1"
10013030-5 = "우선 저희는 제일 가까운 곳으로 향하도록 하죠"
10013030-6 = "제 입으로 말하기도 좀 뭣하긴 하지만, 분명 이런 이름이었죠……"
10013030-11 = "[ns1] \"<영원토록 끓어오르는 뜨거운 땅을 찾는 유황의 광부들>……\"\n[ns2] \"……이 있는 곳이라면, 아무래도 이 근처인가 봐.\""
10013030-14 = "그 이름은, 몇 번을 말해도 익숙해지지 않는다고 할지……. 여전히 정체불명이라는 인상이지만……."
10013030-15 = "그래서 이 근처에 리조트가 있다는 거죠?"
10013030-16 = "으음~ 마땅히 리조트라고 할 만한 건 보이지 않네요."
10013030-17 = "이즈나의 눈에도 전부 모래로 가득한 모래사장만 보여요!"
10013030-19 = "으음~ 혹시 저희가 입구를 못 찾고 헤매고 있는 걸까요?"
10013030-21 = "………?"
10013030-26 = "선생님-"
10013030-27 = "[s] \"왜 그래? 치세?\""
10013030-28 = "……뚝딱뚝딱- 소리가 들려."
10013030-29 = "[s] \"뚝딱뚝딱……?\""
10013030-39 = "앗, 정말이네요! 이 소리는 마치……."
10013030-40 = "저쪽이야. 가보자."
10013030-51 = "여기가…… 이 군도에서 강한 세력을 자랑하는 곳이 운영하는…… 리조트?"
10013030-52 = "그런 것치고는 어째……."
10013030-53 = "[s] \"그냥 단순한 밀림 아냐?\""
10013030-54 = "그걸 말해버리는 건가요?! 선생님?!"
10013030-55 = "아니, 안쪽으로 들어올 때부터 바로 그런 생각이 들긴 했지만 말이죠!"
10013030-62 = "아무래도 평범한 휴양지는 아닌 듯한 느낌이에요."
10013030-63 = "여기저기서 땅을 파헤치거나 부수는 것 같은데, 뭘 하는 걸까요? 주군?"
10013030-64 = "[s] \"글쎄, 이건 아마도…….\""
10013030-66 = "어이! 거기 누구야?! 왜 정문이 아닌 쪽에서 갑자기 나타난 거야?"
10013030-72 = "잘은 모르겠지만! 여기 수상한 녀석들을 발견했어! 모두 집하아압-!!"
10013030-73 = "네, 자, 잠깐?!"
10013030-80 = "[ns] \"어라, 너희는 분명…….\""
10013030-81 = "뭐야, 수영복을 입고 있는 걸 보니…… 손님인가?"
10013030-82 = "아냐, 손님이라기엔…… 저기 가운데 서 있는 어른! 왠지 수상해 보이지 않아?"
10013030-83 = "어라? 어디선가 본 얼굴인데…… 누구였더라………"
10013030-85 = "누구긴 누구야-! 샬레의 선생님이잖아!"
10013030-86 = "[s] \"메구!\""
10013030-87 = "안녕~! 안녕~! 여기서 보다니 깜짝 놀라버렸네~! 선생님!"
10013030-89 = "또…… 아는 사이신가요……?"
10013030-90 = "[s3] \"엄청 수상한 시선으로 바라보고 있는데……!\"\n[s4] \"온천개발부와 안면이 있는 것뿐이야!\""
10013030-93 = "유황의 광부들……이라는 게 무슨 의미인가 했더니, 게헨나의 온천개발부 여러분이셨군요."
10013030-94 = "맞아! 우리가 바로 이곳 <로스트 파라다이스 리조트>에서 이른바 <영원토록 끓어오르는 뜨거운 땅을 찾는 유황의 광부들>이라는-"
10013030-95 = "어-엄청 멋진 이름으로 불리는! 온천개발부! 내가 지은 거지만, 정말 잘 붙였지?"
10013030-96 = "[s] \"심지어 직접 붙인 별명이었어?!\""
10013030-97 = "응, 맞아~♪ 그런데 이런 곳에서 선생님을 만나다니 별일이네~?"
10013030-98 = "뭐야? 왜 여기서 어슬렁거리고 있어? 혹시 미아가 됐어?"
10013030-100 = "그건 오히려 이쪽에서 묻고 싶은 말이야. 이런 밀림 한가운데에서, 너희는 대체 뭘 하고 있는 거야?"
10013030-101 = "불법 리조트 사업이라기엔 뭔가……."
10013030-103 = "그 질문은 아둔하군!"
10013030-108 = "카스미 부장!"
10013030-112 = "온천이 있는 곳엔 우리가 있다! 아니, 설사! 온천이 없다고 하더라도 우리가 있다!"
10013030-113 = "응! 어차피 뭐든 파내서 온천으로 만들어버리면 되니까!"
10013030-114 = "와아-! 멋지네요! 축제 같아요!"
10013030-115 = "우미카, 감탄할 때야?! 저건 그냥 막무가내잖아!"
10013030-117 = "아아~ 이거 참 의외의 만남인걸. 샬레의 선생님이란 게 당신인가?"
10013030-118 = "[s] \"안녕.\""
10013030-119 = "설마 이런 곳에서 마주칠 줄이야. 우리 애들에게 이야기는 자주 들었어."
10013030-120 = "우리 온천개발부의 해양심층수 온천 리조트에 온 걸 환영한다구~"
10013030-121 = "[s] \"심층, 해양…… 뭐?\""
10013030-122 = "다시 한번 묻겠는데……. 온천개발부는 대체 여기서 뭘 하고 있는 거야?"
10013030-123 = "뭘 하고 있냐니 당연히 온천 개발이지!"
10013030-124 = "이런…… 밀림 속에서 말인가요?"
10013030-125 = "밀림이라고는 해도, 바닷가에 인접한 장소라고? 내 후각을 속일 순 없어."
10013030-126 = "이곳 밀림의 흙바닥 아래엔…… 그래. 해저 화산을 자극해서 이 앞바다의 해양심층수를 펄펄 끓는 온천으로 만들 수 있는 비장의 지맥이 흐르고 있어!"
10013030-127 = "우린 그걸 뚫는다! 뚫어서 온천으로 만든다!"
10013030-128 = "[s] \"앗! 지난번에 들어본 적 있는 이야기다!\""
10013030-129 = "서, 선생님?!"
10013030-130 = "해양심층수 온천은 굉장하다고? 내 추정에 따르면 그 효능만 해도 약 365가지가 넘는 개수!"
10013030-131 = "그중에서도 특히 주효한 효능을 꼽아보자면, 체력증진, 성적향상, 가내안전, 거기다 자연스러운 인법 단련의 효과까지!"
10013030-132 = "괴, 굉장해요! 해양심층수에 그런 효과가 있을 줄이야. 이즈나 처음 알았어요!"
10013030-133 = "[s] \"이즈나?! 바로 설득당해버리는 거야?!\""
10013030-134 = "아니아니아니. 그럴 리가 없잖아-!"
10013030-135 = "이런 엉망진창인 애들이…… 진짜 군도에서 제일 강력한 세력 중 하나야……?"
10013030-136 = "아~ 그 이야기라면 별거 아니야."
10013030-137 = "우리가 온천을 개발하는 사이에, 뭐, 계약서와 리조트를 노리고 다들 왕창 쳐들어오던 거 있지!"
10013030-138 = "그럴 때마다 친절하게, 우리 온천개발부의 이름으로 전부 격퇴해줬지. 응. 정말 파란만장했어."
10013030-139 = "그렇게 쓰러트린 녀석들은, 저어기- 저쪽 개발지에서 부려 먹는 중이고."
10013030-140 = "응! 우리는 온천 개발의 인력이 늘어서 좋고,"
10013030-141 = "저쪽에서 일하는 애들도 우리랑 같이 어엄~~청 즐거운 온천 개발을 같이 할 수 있으니 좋고!"
10013030-142 = "일석이조! 꿩 먹고 알 먹고! 도랑치고 가재 잡고!"
10013030-143 = "정말 카스미 부장은 천재야!"
10013030-144 = "와핫핫핫! 그 누구도 우리의 해양심층수를 향한 의지를 막을 순 없다아~!"
10013030-145 = "[s] \"해양심층수를 향한 집념……! 무섭다! 온천개발부……!\""
10013030-146 = "하여간 그러는 그쪽이야말로 여긴 무슨 일이야? 얌전히 온천 리조트를 찾아온 거 같진 않고"
10013030-147 = "역시 <리조트 사냥>의 건인가?"
10013030-152 = "……당신네도 <리조트 사용권>이 적힌 계약서를 가지고 있겠지?"
10013030-153 = "아! 응! 인터넷에서 싸게 팔길래 아, 이거면 온천 개발. 할 수 있을지도?! 라고 생각해서~"
10013030-154 = "[s] \"인터넷에서 팔기까지 했어?!\""
10013030-155 = "응, 그렇게 구한 물건인데, 이게 왜?"
10013030-157 = "해당 계약서는, 문어 은행의 독단으로 뿌려진 불법 계약서예요."
10013030-158 = "우린 그걸 회수하러 온 거야!"
10013030-159 = "그러니 부디 이즈나들에게 돌려주세요!"
10013030-161 = "아하, 오호, 흐음, 과연-"
10013030-162 = "이러저러한 사정이 있으므로, 우리 보고 협조 및 협력해달라 이건가."
10013030-163 = "응, 그렇게만 한다면……!"
10013030-167 = "싫은데?"
10013030-169 = "윽?!"
10013030-170 = "사정이야 어찌 되었든 간에, 이건 우리가 구매한 물건이야. 더구나 이미 이곳 온천 리조트에 적지 않게 투자한 상황이거든."
10013030-171 = "응! 이미 여기에 주차장이라거나, 온천장의 휴게 시설이라거나, 숙박 시설 같은 걸 지어 놨으니까!"
10013030-172 = "뭐! 가장 중요한 온천이 아직이지만!"
10013030-173 = "[s] \"그 시점에서 온천 리조트라고 불러도 괜찮은 거야……?\""
10013030-174 = "그러니 넙죽 알겠습니다~하고 넘겨줄 수는 없지!"
10013030-175 = "그 말씀은……."
10013030-176 = "그런데도 이 계약서를 빼앗고 싶다면…… 그래, 말 그대로……."
10013030-177 = "대결을! 쟁탈전을! 목소리 드높이며 <사냥>을 시작하는 수밖에!"
10013030-178 = "[s] \"잠깐 모두 진정하고, 대화를 통해 무언가 합의점을…….\""
10013030-180 = "칫, 본의는 아니지만"
10013030-181 = "알았다고! 분쟁을 원한다면 까짓것 응해주겠어!"
10013030-182 = "원래부터 그럴 마음으로 시작한 싸움이니까!"
10013030-183 = "뒤로 빼지 않고 마주 선언하는 그 호쾌함! 그렇게 나와야지!"
10013030-184 = "그럼 다 같이~!"
10013030-185 = "대결 시작~~"
