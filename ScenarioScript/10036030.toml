[translation]
10036030-1 = "제3화;다가오는 그림자"
10036030-5 = "시끄러워 죽겠네."
10036030-6 = "맞아. 해변가 숲이라서 그런지 갈매기 소리가 엄청 요란해."
10036030-7 = "그게 아니라, 인마! 헬멧단 녀석들 말야!"
10036030-8 = "총연합회라니 건방지기 짝이 없어!"
10036030-9 = "우리 큰누님한테 한 짓도 잊어버리고 이렇게 희희낙락하며 축제를 벌이다니……!"
10036030-10 = "맞아. <무법자 해변>이 자기들 것이라도 된 것 마냥!"
10036030-11 = "맞아, 맞아!"
10036030-12 = "너희들도 그렇게 생각하지?"
10036030-14 = "물론이지!"
10036030-15 = "헬멧단 녀석들, 언젠가 원수를 갚아줄 기회가 올 거라 생각했어."
10036030-16 = "우리 큰누님을 그렇게 만들었으니, 녀석들도 대가를 치러야지."
10036030-17 = "가장 즐거울 때 그 순간을 박살 내는 것이야말로 우리 복수심을 보여 줄 방법……!"
10036030-18 = "근데 그 교수라는 녀석, 정체가 뭘까? 돈을 내면 계획을 짜 준다니……."
10036030-19 = "뭐, 블랙마켓에 흔한 정보상 중 한 명이겠지."
10036030-20 = "얼굴도 숨기고 목소리만 들려준 걸 보면 직접 나설 용기는 없는 모양이야."
10036030-21 = "으음, 역시 조금 수상한데……."
10036030-22 = "수상하든 말든, 저렇게 눈앞에 헬멧단 녀석들이 축제를 벌이고 있다는 게 중요한 거잖냐!"
10036030-23 = "다들 축제를 실컷 망쳐 놓을 준비는 됐겠지!"
10036030-24 = "물론이지!"
10036030-25 = "좋아, 그러면……!"
10036030-29 = "……때마침 전화가 왔군. 계획이 완성되었나 봐."
10036030-34 = "아, 선생님. 지갑은 찾은 모양이네."
10036030-35 = "마침 잘 왔어. 자, 여기 바위 뒤로 와서 몸을 숨겨."
10036030-39 = "[ns] 아츠코의 말대로 바위 뒤에 몸을 숨긴다."
10036030-41 = "히요리, 밀지 마. 윽, 넓은 곳 놔두고 이게 무슨 짓인지……."
10036030-42 = "하, 한 명이 늘어나서 자리가 좁아졌어요……여러모로 여기저기 닿고 있고……."
10036030-43 = "[s] \"이거 미안합니다…….\""
10036030-45 = "쉿, 다들 조용. 삿 쨩한테 들리겠어."
10036030-46 = "사오리 언니, 어디 있는데요?"
10036030-47 = "저기, 해변가를 봐."
10036030-50 = "이렇게 찾아 주셔서 감사합니다, DJ B.o.B님!"
10036030-51 = "블랙마켓 최고의 실력을 갖춘 B.o.B님 덕분에 총연합회가 더욱 풍성해질 것 같네요! 감사합니다!"
10036030-56 = "흠, 뭐, 헬멧단 여러분의 중요한 행사라고 하니 이 몸도 조금은 거들어야지."
10036030-57 = "그건 그렇고, 대금은 확실히 약속한 금액이 맞겠지?"
10036030-58 = "물론이죠. 행사 끝나면 곧바로 입금해 드리겠습니다."
10036030-59 = "좋아, 좋아. 여러분과는 같은 블랙마켓 주민이라는 신뢰가 있으니까……."
10036030-60 = "야! 거기 알바! 그거 비싼 거니까 조심해서 옮겨!"
10036030-62 = "흡! 알겠다!"
10036030-63 = "그거 옮겨 놓고, 저기 스피커 손 좀 봐! 아까 보니 모서리 부분이 좀 긁혔던데."
10036030-64 = "잘못하다 뭐 하나 고장 나기라도 하면 전부 짐을 옮긴 네 탓이니까. 네 몸보다 소중히 여기라고!"
10036030-65 = "……알겠다."
10036030-66 = "어, 그리고 무대 말인데, 오른쪽 장식을 1미터쯤 왼쪽으로 옮겨 놔."
10036030-67 = "하지만 아까는 너무 왼쪽으로 치우쳤다고……."
10036030-68 = "지금 보니까 역시 아까 위치가 나은데 어떡해?"
10036030-69 = "뭐, 불만이라도 있나? 그럼 나 확 집에 가 버린다?"
10036030-70 = "헉! 아, 안 됩니다! 화내지 마세요!"
10036030-71 = "알바! 말씀하신 대로 조정해! 얼른!"
10036030-72 = "……알겠다."
10036030-75 = "……너무해."
10036030-76 = "아무리 삿 쨩을 고용한 입장이라고 해도, 저건 너무 심하잖아."
10036030-77 = "표본으로 써도 좋을 만한 악덕 고용주네. 나 같으면 이미 쐈어."
10036030-78 = "그러네요…… 완전 블랙이네요……"
10036030-79 = "이대로 가다간 만성피로에 불면증이 와서 매일매일이 힘들어지겠네요…… 신경성 위염이나 고혈압으로 쓰러질지도……."
10036030-80 = "[s1] \"직장인 종합 선물 세트 같은 병명들이네…….\"\n[s2] \"묘하게 익숙한 병명들이네…….\""
10036030-83 = "어떻게든 손을 써야겠어."
10036030-84 = "하, 하지만 우리는 사오리 언니를 지켜보는 거 아니었나요?"
10036030-85 = "여기서 끼어들면 분명 만나 버리고 말 텐데요?"
10036030-86 = "……고생 좀 했으면 좋겠다고 생각은 했지만, 저런 방식은 아니었으니까."
10036030-87 = "뒤쪽에서 손을 좀 쓰면 되겠지."
10036030-92 = "아주 친절하게 말야."
10036030-96 = "하아, 하아……."
10036030-97 = "아냐, 아냐, 역시 스피커는 관객석에 좀 더 가까운 편이 좋을 것 같아."
10036030-98 = "알바, 위치를 다시 옮기도록!"
10036030-99 = "아, 알겠다."
10036030-100 = "왜 그리 꾸물대고 있어? 얼마나 일했다고?"
10036030-101 = "보조 겸 경호원이라더니 영 맘에 안 드는구만. 에잉, 쯧쯧."
10036030-102 = "……."
10036030-103 = "잠깐 바람 좀 쐬고 올 테니 옮겨 놔. 알겠어?"
10036030-104 = "알겠다."
10036030-105 = "흐흠~ 상쾌한 바닷바람~"
10036030-114 = "산책로도 잘 되어 있군. 좋아, 좋아."
10036030-115 = "돌아가면 알바한테 라멘이나 한 그릇 사 오라고 시켜야겠어."
10036030-116 = "이 몸이 친히 공연해 주는데 그런 서비스쯤은 당연히—으음?!"
10036030-125 = "뭐, 뭐냐 너희들은? 갑자기 나타나서 길을 막고……."
10036030-126 = "저리 비켜! 산책하는 데 방해하지 마!"
10036030-127 = "잠깐 이야기 좀 할 수 있을까, DJ씨? 오래 걸리진 않을 거야."
10036030-128 = "나 참, 사인이라도 받으려고? 안 돼, 안 돼. 팬미팅은 공식 루트를 통해서 하도록."
10036030-132 = "초, 총은 왜 장전하시는……?"
10036030-133 = "[s] \"잠깐잠깐잠깐! 미사키! 친절하게 한다며!\""
10036030-134 = "이 이상 어떻게 더 친절한데?"
10036030-135 = "누, 누군지는 몰라도, 나한테 이러는 거 실수하는 거야!"
10036030-136 = "내가 누군지 알아? DJ B.o.B야! 나한테 무슨 일 생기면 헬멧단이 가만 안 있을걸?"
10036030-137 = "후환이 두려우면 당장 총 치우고……아얏!"
10036030-143 = "손이 미끄러졌네."
10036030-144 = "미사키, 진짜로 해를 입히면 안 돼. 삿 쨩이 준비하는 공연에 필요한 사람이잖아."
10036030-145 = "알고 있어. 하지만 이 녀석 말하는 게 기분 나쁘잖아."
10036030-146 = "말로 타이르면 알아들을 거야. 그렇죠, DJ B.o.B씨?"
10036030-148 = "인마! 너네 진짜 죽고 싶어! 내가 당장 헬멧단을 몰고 와서……!"
10036030-152 = "아얏!"
10036030-153 = "[s] \"……아츠코까지?!\""
10036030-158 = "그치만 말하는 게 기분 나쁜걸."
10036030-160 = "망할 녀석들…… 으으……."
10036030-165 = "저, 저어, 협박 중에 죄송한데요……."
10036030-167 = "협박이 아니라 대화인걸, 히요리. 어쨌든, 무슨 일?"
10036030-169 = "그게…… 나무 위에서 망을 보다가, 이쪽으로 향하는 사람들을 발견했어요."
10036030-170 = "제 계산상으로는 10초 이내에 여기로 도달할 것 같은데요…… 헤헤, 임시로 설치한 부비트랩이라도 발동할까요?"
10036030-175 = "아니, 일단 대기. 히요리는 원래 위치로 돌아가고, 공주는 DJ를 확보해 줘."
10036030-176 = "선생님은……."
10036030-177 = "[s] \"옆에 있을게.\""
10036030-178 = "……뭐, 마음대로 해."
10036030-180 = "이 자식들, 누구 마음대로 확보하고 말고—으읍?!"
10036030-189 = "B.o.B씨. 잠깐만 조용히 있어 줘."
10036030-191 = "……온다."
10036030-198 = "하하! 진짜로 DJ B.o.B이 여기 있잖아? 계획이 맞아떨어지는데?"
10036030-199 = "돈을 냈으니 당연히 그래야지! 한 푼 두 푼 소중히 모은 모두의 용돈인데!"
10036030-200 = "좋아! 이걸로 헬멧단 녀석들의 축제도 끝장이다!"
10036030-203 = "축제를 뭐 어쩐다고?"
10036030-205 = "근데 뭐야, 네 녀석들은? 헬멧단? 헬멧은 안 썼는데……."
10036030-206 = "DJ B.o.B랑 무슨 관계야?"
10036030-207 = "별 볼 일 없으면 비켜! 우린 이 녀석을 납치해야 하니까!"
10036030-209 = "으읍?!"
10036030-211 = "납치?"
10036030-212 = "[s] \"납치?!\""
10036030-213 = "불량배들인가…… 너희, 축제를 망치려는 거야?"
10036030-215 = "그래! 너희 헬멧단 녀석들에게 복수할 거다!"
10036030-216 = "뭐시기 교수라는 녀석한테 산 계획대로, DJ B.o.B를 납치하기만 하면 헬멧단 총연합회를 망쳐버릴 수 있어! 메인 이벤트가 망해버리니까! 완벽한 계획이라고!"
10036030-217 = "그래! 납치해서 하루 종일 부려 먹을 거야! 일주일 내내 디제잉만 시켜야지!"
10036030-218 = "우리 큰누님을 위해 하루 36시간 감사의 턴테이블 스크래치를 하는 거다!"
10036030-220 = "으으읍……!"
10036030-222 = "복수…… 무슨 말인지는 몰라도, 그렇게는 안 돼."
10036030-223 = "이 축제는 삿 쨩이 열심히 만들어가고 있는 축제니까."
10036030-224 = "그런 계획을 가만 놔둘 수는 없어."
10036030-226 = "하, 말로 해서는 못 알아먹는 녀석들이군."
10036030-227 = "그래서 뭐, 우리를 막기라도 하겠다는 거냐?"
10036030-228 = "얘들아!"
10036030-238 = "겨우 세 명이서 해 보겠다고? 호되게 당하기 전에 물러나시지?"
10036030-240 = "좋아, 그렇게 하지."
10036030-241 = "대신 거기 너, 왼쪽으로 세 걸음만 가 봐."
10036030-243 = "응? 무슨 소리야?"
10036030-247 = "이렇게?"
10036030-249 = "잘했어."
10036030-250 = "—히요리, 쏴."
10036030-256 = "아얏! 저, 저격수가 있다!"
10036030-258 = "지금이야, 아츠코."
10036030-259 = "응!"
