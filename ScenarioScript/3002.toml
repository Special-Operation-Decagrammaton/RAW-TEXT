[translation]
3002-1 = "통조림의 그림자 2"
3002-5 = "뭐야, 방금 그 소리는?!"
3002-6 = "분명, 미유의 비명 소리였습니다."
3002-10 = "설마 경계 근무 중 습격이라도 당한 건가?"
3002-15 = "미유, 무슨 일이야!"
3002-16 = "저, 저기…… 식량 창고에……"
3002-17 = "식량 창고가 왜? 습격자라도 나타난 거야?"
3002-18 = "그, 그게 아니라…… 저기 통조림……"
3002-19 = "……저기 있는 통조림? 저 해물비빔소스 통조림이 왜?"
3002-20 = "저 통조림이…… 스스로 움직였어……."
3002-26 = "……너 졸았냐?"
3002-27 = "난 또 무슨 소동인가 했더니, 통조림이 스스로 움직였다니……"
3002-28 = "최근 너무 무리를 한 게 아닌가요?"
3002-30 = "자, 잘못 보지 않았어!"
3002-31 = "분명 저 통조림이 혼자서 딸각거리면서 움직였는데……"
3002-32 = "어디 보자……"
3002-38 = "……조금도 안 움직이는데?"
3002-39 = "……역시 주간에 있었던 작전 때문에 피로가 쌓였나 보네요."
3002-41 = "어라……? 이상하다, 분명 아까는 격렬하게 움직였었는데……."
3002-42 = "헛것을 볼 정도로 피로가 쌓인 상태로 무슨 근무를 선다는 거야?"
3002-44 = "자, 남은 경계근무는 내가 설 테니까 너는 들어가서 쉬어."
3002-45 = "하지만……"
3002-47 = "신경 쓰지 마, 신경 쓰지 마."
3002-48 = "할머니들은 아침잠이 없다는 이야기도 있잖아? 사키도 매일 새벽마다 먼저 일어나는 걸 보면 괜찮을 거야."
3002-49 = "누가 할머니라는 거야."
3002-50 = "……그럼 남은 경계 근무 임무는 부탁드리겠습니다, 사키."
3002-54 = "다른 대원들은 텐트로 돌아가 잠을 보충하도록 하지요."
3002-56 = "……고마워, 사키 쨩. 그럼 부탁할게."
3002-68 = "……딸깍."
3002-75 = "(……다음 날, 아침.)"
3002-76 = "후후, 역시 말번초를 서고 먹는 아침 식사는 각별하네."
3002-77 = "더욱이 오늘 아침은 어제 전투식량을 잔뜩 가져와서, 선택의 여지가 다양하게 있다는 게 마음에 들어."
3002-82 = "새벽 동안 경계 근무 서느라 수고하셨습니다, 사키."
3002-83 = "괜찮으시다면 먼저 메뉴를 고르시죠."
3002-84 = "그럼 나는…… 이 캔 치킨 누들 수프로 할까."
3002-85 = "나는 팥밥과 고등어 된장 조림!"
3002-86 = "저는 요크셔 푸딩과 채식 오믈렛으로 하겠습니다."
3002-87 = "나, 나는 오트밀 포리지와 초콜릿 쿠키로……"
3002-88 = "다행히 겹치지 않게 가져간 것 같네. 그럼 남은 메뉴는……"
3002-96 = "이 해물비빔소스 통조림, 먹을 사람 없어?"
3002-97 = "힉, 히익……."
3002-98 = "미유는 아무래도 어제의 일을 아직도 신경 쓰고 있는 모양이고……"
3002-99 = "모에, 너 먹을래? 이거 냄새는 고약해도 밥과 같이 먹으면 그럭저럭 먹을만한데."
3002-100 = "글쎄. 캔에 든 해산물은 조금……"
3002-101 = "고등어 된장 조림도 결국은 해산물이잖아."
3002-102 = "……그럼 미야코는?"
3002-103 = "저도 오늘은 조금……"
3002-104 = "그런가. 뭐, 그럼 이건 나중에 먹지."
3002-109 = "자, 그럼 아침 식사를 시작할까?"
3002-112 = "잘 먹겠습니다!"
3002-119 = "(이후, 그 해물비빔소스 통조림은 무관심 속에 방치되어……)"
3002-126 = "(……어느덧 유통기한의 막바지에 이르게 되었다.)"
