[translation]
10046040-1 = "제4화;미식가와는 협상하지 않는다"
10046040-2 = "……자세한 사정은 모릅니다만."
10046040-3 = "선생님께 듣기로는, 급하게 바비큐 재료가 필요하게 되었다고요? 그것도 구이 준비가 끝난 것으로요."
10046040-7 = "으, 응! 그 말대로야!"
10046040-8 = "선생님이 아마도 게헨나의 미식연구회라면, 가지고 다녀도 이상하지 않다고!"
10046040-9 = "……역시 좀 이상하다고는 생각하지만, 선생님이 이런 일로 거짓말할 리는 없고."
10046040-14 = "급하게 바비큐 세트가 필요한 상황이란 게 뭐야?"
10046040-15 = "나는 알 것 같은데. 종종 있지 않아? 지금은 이거 아니면 안 돼! 라는 느낌!"
10046040-16 = "아무리 그래도 그렇지. 보통 다른 학교 학생한테 그런 일로 부탁해?"
10046040-17 = "게다가 티파티라며? 티파티라면 트리니티의 엄청 높으신 분 아니야? 부하들한테 명령하면 척척 가져오는 거 아니야?"
10046040-18 = "티파티? 아무 때나 차하고 쿠키를 먹을 수 있는 거야? 부러워~!"
10046040-19 = "아니…… 응? 전혀 다른 것 같으면서, 비슷한 거 같기도……?"
10046040-24 = "선생님이 이 사실을 어떻게 아셨는지는 모르겠지만."
10046040-25 = "우연히 바비큐 세트를 가지고 있는 건 사실이네요. 어디 내놓아도 부끄럽지 않을 상등품으로요."
10046040-26 = "[s1] \"정말로?!\"\n[s2] \"그냥 찔러본 건데!\""
10046040-29 = "선생님이 놀라는 거야?"
10046040-30 = "그래도 다행이다~ 이제 잘 설득해서 양보만 받으면 되니까."
10046040-31 = "저기, 게헨나의…… 하루나 쨩이랬던가?"
10046040-32 = "혹시 바비큐 세트를 양보해 줄 수 있을까?"
10046040-33 = "물론, 그냥 달라는 뜻은 아니야! 제대로 대가는 지불할 테니까. 값은 부르는 대로……."
10046040-37 = "앗 차, 이제는 그렇게 못하지……."
10046040-38 = "그래도, 섭섭하지 않게 보상할 테니까!"
10046040-39 = "후후, 교섭인가요? 흥미롭군요. 다름 아닌 티파티 보증이라면, 분명 섭섭하지 않은 보답을 받겠죠."
10046040-40 = "그러면……!"
10046040-41 = "허나, 거절합니다."
10046040-42 = "어, 어째서?!"
10046040-43 = "저희는 미식가. 미식에서 오는 경험과 가치는 천금과도 바꿀 수 없습니다."
10046040-44 = "하물며 돈으로 환산하려는 시도는, 그 발상의 안일함에 모욕감마저 느낍니다."
10046040-46 = "……역시나."
10046040-50 = "미카 님. 외람되지만, 여기는 저희한테 맡겨주시죠."
10046040-51 = "아니, 하스미 선배…… 너무 빠르지 말임다."
10046040-52 = "일단, 조금 더 대화해보면…… 대화해보면…… 음~"
10046040-61 = "……저도 하스미 선배에 동감임다. 말이 통하는 상대가 아니라는 느낌이 팍 왔슴다."
10046040-62 = "그리고 선생님께서도 마찬가지입니다."
10046040-63 = "[s3] \"으, 응?!\"\n[s4] \"갑자기 나는 왜?!\""
10046040-66 = "대뜸 소개할 사람이 있다더니, 설마 그 상대가 미식연구회라뇨."
10046040-67 = "저들이 지금까지 트리니티 자치구에 끼친 피해가 얼마라 생각하시나요?"
10046040-68 = "그걸로 모자라 미카 님을 이런 위험한 사람들 앞에 데려올 줄이야."
10046040-69 = "[s5] \"아니! 하스미가 생각하는 것만큼…….\"\n[s6] \"위험한 애들이…… 아니지는…… 않지만.\""
10046040-74 = "보십시오! 선생님께서도 그리 생각하고 있지 않습니까!"
10046040-75 = "협상은 중단입니다. 지금 당장……."
10046040-77 = "자, 잠깐!"
10046040-83 = "잠깐만, 하스미 쨩."
10046040-88 = "조금만 더 이야기해보고 싶어. 어쩌면 합의점을 찾을 수 있을지도 모르고."
10046040-89 = "싸움이 벌어진다면, 일이 커지고 말 거야."
10046040-90 = "어쩌면, 나기 쨩이나 세이아 쨩이 눈치챌 만큼…… 그러니까, 부탁할게."
10046040-91 = "오늘 하루만은 아무 소란 없이 끝내고 싶어."
10046040-96 = "미카 님……."
10046040-100 = "하는 수 없군요. 미카 님의 부탁이니, 일단은 지켜보고 있겠습니다."
10046040-101 = "하지만 조금이라도 위험하다 판단되면, 그때는 주저 없이 개입하겠습니다."
10046040-102 = "응, 그걸로 충분해! 고마워, 하스미 쨩!"
10046040-108 = "그, 저기, 하루나 쨩?"
10046040-109 = "내가 너무 생각 없이 말한 거 같아. 미안해."
10046040-110 = "후후, 괜찮습니다. 저희의 철학이 대중으로부터 오해를 사는 일이 많다는 건 이미 알고 있으니까요."
10046040-111 = "오히려 저희 부원이 아니면서도 저의 철학을 이해하려 노력하신다는 점에서, 꽤나 진심으로 탄복하고 있답니다."
10046040-112 = "그러니까…… 응, 미식은 돈으로 바꿀 수 없다는 거지?"
10046040-113 = "그러면 이건 어때? 바비큐 재료를 양도해 준다면, 이틀…… 아니, 사흘 안에 더 좋은 바비큐 재료를 구해다 줄게!"
10046040-114 = "과연, 흥미로운 접근 방식이군요."
10046040-115 = "미식의 가치는 돈으로 환산할 수 없다…… 그러니, 미식에는 미식으로."
10046040-116 = "후후후, 과연 소문의 티파티. 상당히 재미있는 분이시군요."
10046040-117 = "그, 그러면?"
10046040-118 = "그렇네요. 여기서는 정성을 생각해서라도 최대한 응해주고 싶습니다만."
10046040-119 = "역시 거절하겠습니다."
10046040-123 = "어?! 괜찮은 분위기 아니었어?! 어째서?!"
10046040-124 = "앞서 말하지만, 저에게도 쉬운 대답은 아니었습니다. 미카 씨의 제안은, 미식을 향한 담론 그 자체였으니까요."
10046040-125 = "과연 맛있는 음식을 먹었을 때의 체감, 인상, 그 행복과 만족감은 얼마나 지속될까요?"
10046040-126 = "일주일? 하루? 몇 시간? 아니요, 실제로는 거의 그 순간에 휘발되는 것이겠죠."
10046040-127 = "그에 비해 미식을 위해 준비하는 재료, 연마하는 기술에 소요되는 시간은 한없이 깁니다. 그리고 그것들은 돌아오지 않죠."
10046040-128 = "즉, 미식은 순간의 경험을 위해, 무수한 항구적 가치를 포기하는 덧없는 행위이다…… 저는 이렇게 정의하고 있습니다."
10046040-129 = "그러니 미카 씨의 제안은 거절하겠습니다."
10046040-130 = "저와 부원들은 지금 바비큐를 먹기로 했습니다. 거절할 이유는 그것만으로 충분하죠."
10046040-137 = "어…… 그러니까, 무슨 말이야? 꼭 세이아 쨩이 둘로 늘어난 기분이야."
10046040-141 = "역시 협상은 결렬입니까? 미카 님, 이제 저희에게 맡겨주시죠."
10046040-142 = "하스미 쨩?!"
10046040-143 = "이미 말씀드렸지만, 게헨나가 상대라면 <상식적으로>는 통하지 않습니다."
10046040-144 = "하물며 미식연구회라면, 대화를 하는 것 자체가 손해입니다."
10046040-149 = "어머, 귀가 간지럽네요~"
10046040-150 = "잠깐! 말이 좀 심한 거 아니야?!"
10046040-152 = "여태까지 당신들이 저질러온 일들을 생각하면, 바로 체포하지 않을 것에 감사해야 할 겁니다!"
10046040-153 = "타협 따위는 언어도단입니다!"
10046040-155 = "어머나. 그 대사는 제가 하고 싶은 말인데요."
10046040-156 = "미식의 길은 타협 대상이 아닙니다. 이 바비큐도 온전히 저희 미식연구회의 탐구를 위한 것."
10046040-157 = "이렇게 되니 차라리 알기 쉽군요. 이치카!"
10046040-161 = "넵!"
10046040-163 = "자, 잠깐만! 다들! 진정해 봐!"
10046040-165 = "미카 님, 선생님. 걱정하지 않으셔도 됩니다. 값은 제대로 지불할 테니까요."
10046040-166 = "대신 교섭 수단을, 말에서 총알로 바꿨을 뿐입니다."
10046040-167 = "뭐, 그렇게 된 거 같네요, 하하."
10046040-172 = "[ns7] \"아~ 결국 이렇게 되는 건가?\"\n[ns8] \"와장창★ 인 거네…….\""
10046040-180 = "그전에 잠깐."
10046040-187 = "싸우기 전에 한 가지 여쭤봐도 괜찮을까요?"
10046040-188 = "미카 씨."
10046040-192 = "어, 나?"
10046040-193 = "네, 미카 씨는 어째서 바비큐에 그렇게 집착하는 거죠?"
10046040-194 = "실례되는 말인지 모르지만, 미카 씨는 저희처럼 미식의 길을 걷는 분은 아닌 듯합니다."
10046040-195 = "지금 당장, 꼭 바비큐가 필요하다, 그럴 만한 이유가 있지 않을까 해서요."
10046040-199 = "그, 그건……."
10046040-205 = "걱정이 많은 친구가 있거든."
10046040-206 = "조금이라도 계획과 달라지면, 불안해서 견딜 수가 없는 그런 아이야."
10046040-207 = "예를 들어, 점심으로 바비큐를 먹기로 했는데, 그 계획이 틀어진다면 혼자 무슨 문제가 생겼는지 끙끙 걱정하며 편하게 쉬지도 못하는……."
10046040-208 = "정말 귀찮은 성격이지?"
10046040-209 = "하지만 내게는 정말 소중한 친구인데, 나는 별로 도와주질 못하고……."
10046040-210 = "아니, 오히려 사고만 쳤지 뭐야."
10046040-211 = "그래서 오늘 하루만큼은 모든 걸 잊고 꼭 쉬게 해주고 싶었어."
10046040-212 = "……잘 안된 거 같지만 말이야."
10046040-217 = "과연…… 그런 사정이 있었군요."
10046040-218 = "으음…… 그렇다고 해도 타협하게 되면……."
10046040-223 = "저기, 있잖아."
10046040-224 = "하루나, 그냥 이 바비큐 주면 안 될까?"
10046040-225 = "이즈미 씨……?"
10046040-226 = "나는 하루나만큼 말을 잘하진 못하지만, 그, 맛있는 것은 다같이 먹어야 더 맛있잖아?"
10046040-227 = "이런 이야기를 무시하고 먹는 바비큐는, 으응…… 그렇게 맛있을 거 같지도 않고."
10046040-229 = "나도 동감."
10046040-230 = "준코 씨까지……?"
10046040-231 = "뭐라고 할까. 사정을 듣고 나니까 남 얘기 같지가 않아졌어."
10046040-232 = "우리는 지금 이 바비큐를 못 먹는다고 큰일나는 것도 아니잖아?"
10046040-233 = "……애초에 바비큐인 줄도 방금 알았고."
10046040-234 = "두 분께서는 그렇군요. 그러면, 아카리 씨는……."
10046040-238 = "이런, 우문이었나요? 답이 뻔한데."
10046040-243 = "후후후. 역시 하루나는 저를 너무 잘 안다니까요~"
10046040-244 = "……부원들의 의견은 그렇습니까."
10046040-245 = "좋아요. 바비큐 재료는 양보하겠습니다."
10046040-250 = "정말로?!"
10046040-251 = "진짜?!"
10046040-252 = "[s] \"뭐라고?!\""
10046040-256 = "여, 여러분? 대체 저를 어떻게 생각하셨길래?"
10046040-257 = "어, 솔직히 말할까? 아니면 상처 덜 받게 말해?"
10046040-258 = "그 표현부터 이미 조금 상처입니다만……."
10046040-262 = "물론 무상으로 제공하는 것은 아닙니다. 최초의 조건에 응한다는 뜻입니다."
10046040-263 = "사흘 뒤에 더 좋은 바비큐 재료를 받는다는 약속이었죠."
10046040-264 = "응, 고마워! 약속은 꼭 지킬게!"
10046040-265 = "재료는 여기 있습니다."
10046040-271 = "됐다, 선생님! 이제 돌아가서 빨리 구울 준비를……."
10046040-276 = "…………."
10046040-280 = "어?"
10046040-281 = "[s9] \"왜 그래, 미카?\"\n[s10] \"재료에 뭔가 문제라도 있어?\""
10046040-284 = "아니, 이 상자, 내용물까지…… 처음에 내가 준비했던 바비큐 재료랑 똑같은데?"
10046040-290 = "오."
10046040-291 = "이야~ ……망했네요, 이거."
10046040-296 = "즉, 식자재 배송 트럭을 습격한 괴한들은, 처음부터 미식연구회였다……?"
10046040-301 = "역시 이 협상은 무효입니다!"
10046040-302 = "미카 님!! 지금이라도 말씀만 하시면 저 테러리스트들을 일망타진하겠습니다!!"
10046040-303 = "………."
10046040-308 = "(아, 이거는 글렀네. 이제는 말릴 명분도 없고.)"
10046040-309 = "(사정상 계속 양보하는 모양새였지만, 미카 님은 원래 매파로 유명하신 분.)"
10046040-310 = "(충돌을 피하는 건 불가피할 테니, 음…….)"
10046040-311 = "(나기사 님께 어떻게 보고드려야 할지 미리 생각해 둘까.)"
10046040-316 = "……다행이다. 완전히 잃어버린 줄만 알았는데."
10046040-323 = "미안, 하스미 쨩. 이번에는 내 얼굴을 보고 넘어가 줘. 부탁할게."
10046040-324 = "……네?"
10046040-325 = "아무래도 답답하고, 억울하겠지만, 더 늦기 전에 돌아가고 싶어."
10046040-326 = "저는 괜찮지만…… 미카 님은 그걸로 괜찮습니까?"
10046040-327 = "응, 지금은 좀 더 중요한 일이 있으니까."
10046040-332 = "…………."
10046040-334 = "자, 잘 모르겠지만, 지금 우리 죽다 살아난 거지?!"
10046040-335 = "나, 나도 선도부장 만났을 때 같았어."
10046040-337 = "후후…… 우후후……."
10046040-338 = "딱히 의도한 것은 아니지만, 중요한 선택지에서 운이 따라준 모양이군요."
10046040-339 = "평소의 선행이 돌아왔다는 것일까요?"
10046040-341 = "뻔뻔하게 잘도 말하네……."
10046040-343 = "아하…… 과연, 여자아이들의 우정이란~★"
10046040-346 = "역시 너무 늦지 않았을까?!"
10046040-347 = "으음…… 최대한 서두른다 해도, 3시는 되어야 도착할 거 같네요."
