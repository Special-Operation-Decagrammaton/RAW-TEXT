[translation]
10047070-1 = "제7화;전설의 증명"
10047070-2 = "(기숙사로 돌아와 모두와 열심히 방을 치웠다.)"
10047070-6 = "[ns] \"……이건?\""
10047070-7 = "(방구석에 검은 천으로 덮인 캔버스가 잔뜩 쌓여 있었다.)"
10047070-11 = "그건…… 보지 않는 게 좋아."
10047070-12 = "에리 쨩의…… 옛날 그림이니까."
10047070-13 = "내버려둬……."
10047070-14 = "[ns] \"버리지 않고 가지고 있구나.\""
10047070-15 = "자신의 발자취를…… 돌아보고 싶대."
10047070-16 = "미숙한, 과거의 자신과 마주하는 건…… 괴로울 텐데……."
10047070-17 = "우리 중에서는 제일…… 노력가야."
10047070-23 = "[ns] \"……꿈을 좇는 소녀라.\""
10047070-24 = "마스터? 여기서 뭐 하고 계세요?"
10047070-25 = "[s] \"어? 그, 그게……!\""
10047070-26 = "……전생에 대한 이야기."
10047070-27 = "아무래도 선생은…… 나와의 전생을 기억 못 하나 봐."
10047070-28 = "헉, 그럼 선배가 말하던 전생의 인연이 설마!"
10047070-30 = "[ns] \"난 모르는 이야기야……!\""
10047070-32 = "(……카노에가 화제를 돌려준 덕분에 대화를 들키지 않았다.)"
10047070-37 = "[ns] \"에리의 꿈이라…….\""
10047070-38 = "(여러 생각에 잠긴 채, 계속 청소를 이어나갔다.)"
10047070-41 = "뉴후후, 이걸로 원상복구 되었군요!"
10047070-42 = "하아, 이런 짓 또 했다간 진짜 가만 안 둘 테니까……."
10047070-43 = "오! 그럼 조금 다른 방향으로는 해도 괜찮나요?"
10047070-44 = "반성을 하라고, 반성을!"
10047070-45 = "흐음…… 생각보다 폭발이 강하긴 했지……."
10047070-46 = "역시 안전하게 하려면…… 기숙사 밖이 낫겠어……."
10047070-47 = "하지만 기숙사 밖은 사감대의 감시가 심하지 않나요?"
10047070-48 = "길이 보이지 않는군요. 이럴 때 필요한 것은……."
10047070-49 = "아르카나의 마법! 타로 카드가 나설 차례입니다!"
10047070-53 = "……그럴 줄 알았어."
10047070-54 = "우선 이번에 실패했던 원인을 분석해 볼까요?"
10047070-58 = "마스터. 이 카드를 세 장 뽑아 뒷면이 보이게 테이블에 놔주세요."
10047070-59 = "[ns] 조심스럽게 카드를 뽑아 테이블에 놓는다."
10047070-64 = "그럼 확인해 볼게요."
10047070-68 = "흐음, 이건……."
10047070-69 = "……화력이 부족했다는 걸까요?"
10047070-74 = "히히…… 기숙사 자체를 날려버렸어야 했다는 건가……."
10047070-75 = "그렇군요. 악마는 자극적인 상대가 아니면 만나주지 않는다는 거네요."
10047070-76 = "……기숙사를 날렸다간 퇴학이라는 이름의 악마를 만났을 것 같은데."
10047070-77 = "으음, 아무래도 여기서 말하는 화력이라는 건 추상적인 의미인 것 같아요."
10047070-78 = "게다가 이건…… 오래된 역사를 상징하기도 하고."
10047070-79 = "으으으으음……."
10047070-83 = "마스터, 죄송합니다.#n한 장 더 뽑아주시겠어요?"
10047070-84 = "[ns] 고개를 끄덕이며 카드를 뽑는다."
10047070-92 = "이건…… 정방향 마법사?"
10047070-93 = "[s1] \"그건…….\"\n[s2] \"좋은 거야? 나쁜 거야?\""
10047070-96 = "마법사는 한 가지 방향으로 해석하면 안 돼요."
10047070-97 = "엄청난 능력을 가졌지만, 어디로 튈지 모르는 변칙성도 가지고 있죠."
10047070-98 = "어디로 튈지 모르는 건 선배들이랑 똑같네."
10047070-99 = "저희랑…… 똑같다고요?"
10047070-106 = "그래요! 그거였군요!"
10047070-107 = "고마워요, 레나 쨩! 역시 오컬연의 일원이에요!"
10047070-108 = "뭐, 뭔데? 갑자기 그러니까 불안해지잖아."
10047070-109 = "이건 오래된 역사를 참고해 변혁을 꿈꾸라는 의미예요. 그것도 마법에 관련된 것으로요!"
10047070-110 = "여러분! 와일드헌트의 마법에 관련된 이야기를 기억하시나요?"
10047070-111 = "설마…… 그걸 말하는 건가……?"
10047070-112 = "그렇군요."
10047070-113 = "구전으로 전해지던 존재를, 현대에 부활시킨다…… 그것 또한 예술이죠."
10047070-114 = "뭔데? 자기들끼리 아는 말 하지 말고 설명을 해, 설명을!"
10047070-115 = "거대 마법진이에요!"
10047070-116 = "보름달이 뜨는 날 밤! 학원의 주요 시설을 연결해 거대 마법진을 그리면 놀라운 일이 일어난다는 전설!"
10047070-117 = "[s] \"그 놀라운 일이라는 게 구체적으로 뭐야?\""
10047070-118 = "옛날부터 구전으로 전해지는 거라…… 자세한 내용은 모르지만……."
10047070-119 = "<소원>이 이루어지는 마법이라고 해……."
10047070-120 = "뉴후후, 두근거리지 않나요?"
10047070-121 = "진심이야?"
10047070-122 = "한밤중에 기숙사 밖을 돌아다니면서 학원 전체에 그림을 그리겠다고?"
10047070-123 = "그, 그러다 사감대에게 잡히면 어쩌려고!"
10047070-124 = "히히, 잘 들어 레나 쨩……."
10047070-129 = "들키지만 않으면 되는 거라구?"
10047070-130 = "후후, 예술은 모험을 통해서 피어나는 법이죠."
10047070-131 = "전해져 내려오는 대로라면, 제 꿈도 이루어질 테죠……!"
10047070-132 = "……덤으로, 재밌어 보이고요!"
10047070-133 = "샤아악! 내가 이럴 줄 알았어! 선생님! 쟤들 좀 말려봐!"
10047070-137 = "[ns3] \"에리의 꿈을 이룰 수 있다면, 도움이 되고 싶어.\"\n[ns4] \"물론 과격한 방법은 안 되겠지만 말이야.\""
10047070-140 = "저도 같은 생각이랍니다. 서로의 꿈을 응원하고 힘을 빌려주는 것. 그것이 바로—"
10047070-145 = "—'동료'."
10047070-146 = "……라는 것이니까요!"
10047070-147 = "으으으으……!"
10047070-148 = "아아, 몰라! 마음대로 해! 난 절대로 안 도와줄 거니까!"
10047070-149 = "괜찮습니다! 레나 쨩이 걱정하는 것도 이해하고 있으니까요."
10047070-150 = "만약 무슨 일이 생기더라도, 레나 쨩에겐 절대 피해가 가지 않도록 하겠어요."
10047070-151 = "흥. 말은 잘해요, 말은."
10047070-153 = "자…… 그럼 확인해 보자……."
10047070-154 = "학원 전체를 둘러싸고 있다는…… 거대 마법진의 정체를……."
10047070-155 = "그럼 다 같이 예술정보관으로 가서 연결하면 마법진이 될 법한 시설을 조사해 보죠!"
10047070-159 = "레나 쨩도 같이 갈까요?"
10047070-160 = "난 선배들이 또 사고 치는지 감시하러 가는 거야."
10047070-161 = "정~~~말로! 다른 뜻은 없으니까!"
10047070-162 = "후후, 알고 있어요."
10047070-164 = "와일드헌트 예술정보관"
10047070-189 = "(조사는 생각보다 난항을 겪었다…….)"
10047070-194 = "(생각보다 좋은 결과가 나오지 않았다.)"
10047070-195 = "(어떤 시설을 연결해도 웃기게 찌그러진 마법진이 나올 뿐이었다.)"
10047070-204 = "(그렇게 얼마나 더 조사가 이어졌을까.)"
10047070-209 = " ……찾았어요."
10047070-210 = "드디어 찾아냈어요! 우리 학원에 숨어있던 거대 마법진의 정체를……!!"
10047070-217 = "이, 이게 진짜라고? 옛날 지도 위에 그럴싸하게 그린 그림이 아니라?"
10047070-218 = "뉴후후, 진짜예요."
10047070-219 = "현재의 시설에서 찾으려 하니까 안 됐던 거예요."
10047070-220 = "설립 초기의 <옛 시설>을 연결하니, 완벽하게 대칭을 이루는 진짜 마법진이 나타났어요."
10047070-221 = "그것도 수학을 이용한…… 말하자면 <마방진>이에요!"
10047070-222 = "여기 선으로 이은 각 시설의 주소 뒷자리를 더하면……."
10047070-223 = "보세요! 합이 26인 여섯 개의 선이 나와요!"
10047070-224 = "이건…… 100퍼센트 의도된 구조예요!#n학원의 건립에 오컬트가 영향을 줬다는 게 사실이었던 거죠!"
10047070-225 = "마, 말도 안 돼……."
10047070-226 = "마치, 누군가가 발견해 주기를 기다려왔던 것 같은……."
10047070-227 = "이것은 의심할 여지가 없는 진짜 마법진. 완성한다면 어떤 놀라운 일이 기다리고 있을지."
10047070-231 = "그런데 말이야…… 문제가 하나 있어."
10047070-236 = "자. 이건 지금 우리 학원의 지도야……. 확실히 옛날 학원의 지도와는 다르지."
10047070-237 = "사라진 건물도 있고…… 새로 생겨난 건물도 있어……."
10047070-238 = "문제는 이쪽의…… 마법진이 지나가는 자리에 생긴 건물이야."
10047070-242 = "헉! 설마 이 건물은……?!"
10047070-243 = "어머나."
10047070-244 = "그래…… 이 지도대로 마법진을 완성하기 위해선……"
10047070-246 = "[log=카노에]사감대 기숙사를 지나가야만 해.[/log]"
