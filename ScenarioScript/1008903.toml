[translation]
1008903-1 = "조금은 비슷해졌을까"
1008903-2 = "(아루가 불러낸 곳은 커다란 기업가와 뒷세계의 사람들이 모이는 사업 설명회장이었다.)"
1008903-6 = "어서 와, 선생님. 기다리고 있었어."
1008903-7 = "[s1] \"아루……?\"\n[s2] \"사업 설명회……?\""
1008903-10 = "후후. 마침 눈여겨보던 프로젝트들의 발표날이어서 말이지. 선생님이 했던 말이 떠오르더라고."
1008903-11 = "옷을 입을 일을 찾는 게 아니라……. 일을 하다 보면 입어야 할 날이 찾아올 것이다."
1008903-12 = "이런 곳에서까지 교복을 입고 있으면……. 누군가는 학생이라고 얕볼 거 아냐?"
1008903-13 = "그래서 드레스를 입은 김에……. 우리 흥신소의 가장 신뢰할 수 있는 협력자인 선생님을 부른 거지."
1008903-14 = "후훗……. 어때? 이거라면 확실하겠지?"
1008903-18 = "……확실하겠지……?"
1008903-19 = "[s3] \"오……. 확실히!\"\n[s4] \"훌륭해. 바로 그런 이야기였어!\""
1008903-22 = "후후후. 아주 좋아."
1008903-23 = "그러면 선생님. 오늘은 특별히 선생님에게, '학생'이 아닌 한 사람의 '사장'으로서 제안하지."
1008903-24 = "같이 들어가서 나와 함께 사업 설명회를 봐주겠어? 물론 맨입으로 부탁하는 건 아니야."
1008903-25 = "잘 되면……. 그에 상응하는 보답도 물론 준비할 생각이니까."
1008903-26 = "그럼, 선생님."
1008903-30 = "……함께 들어가 볼까?"
1008903-34 = "(이후 아루와 함께, 사업 설명회에 참석해 수많은 발표와 부스들을 살펴보았다.)"
1008903-37 = "(……하나같이 모두 허풍이나 사기로 가득 찬, 엉망진창의 발표회였다.)"
1008903-41 = "어째서야!!!!"
1008903-43 = "어째서냐고, 어째서! 도무지 제대로 된 프로젝트가 하나도 없잖아!?"
1008903-45 = "트라이앵글 파워라니, 게르마늄 팔찌라니! 물이 감정을 느낀다니!!"
1008903-46 = "요즘 세상에 그런 오컬트를 믿으며 투자와 협력을 하라는 거야!? 누굴 바보로 아는 거야!?"
1008903-47 = "[s5] \"지, 진정하고…….\"\n[s6] \"뭐, 사실 이런 경우가 절반은 되니까.\""
1008903-50 = "하아……. 지쳤어……."
1008903-51 = "모처럼 어른스럽고 사장다운 모습을 보여줄 기회라고 생각했는데."
1008903-52 = "이래서야 신뢰를 쌓기는커녕 오히려 허술한 사람으로 보이는 꼴밖에 안 되잖아……."
1008903-55 = "……전혀 그렇게 보지 않는다고?"
1008903-58 = "선생님……."
1008903-63 = "위로해주는 건 고맙지만, 지금은 괜찮아. 나도 상황 파악 정도는 한다고."
1008903-64 = "오늘의 일정은 완전히 실패였어. 괜히 선생님을 불러내 시간까지 뺏었는데, 뭐라도 진전시킨 게 하나도 없다고."
1008903-65 = "……신경 쓰지 말라고?"
1008903-66 = "그런 의미에서 한 말이 아니야……? ……그러면……?"
1008903-67 = "[s7] \"이런 거에 익숙해지는 것부터가 진짜야.\"\n[s8] \"원래 안 될 때가 대부분이야. 정말이야.\""
1008903-70 = "으, 으음……? 그건 또 무슨 이야기야……?"
1008903-71 = "잘 모르겠는데……. 솔직히, 여전히 선생님이 날 위로해 주려 하는 말처럼 들려."
1008903-72 = "……응?"
1008903-73 = "……우선 따라오라고? 어, 어딜 가려는 건데? 이제 해도 거의 다 져 가는데?"
1008903-74 = "좋은 곳……?"
1008903-78 = "……내가 좋아할 거라고?"
1008903-79 = "[s9] \"아루라면 분명 좋아할 거야.\"\n[s10] \"마지막 일정은 내가 정하게 해줘.\""
1008903-82 = "으, 으응……. 뭐……. 선생님이 그렇게까지 말한다면야……."
1008903-86 = "……어디야?"
1008903-92 = "……???"
1008903-93 = "여기는……. 라멘 집……?"
1008903-94 = "선생님? 데려오겠다고 한 곳이……. 여기야……?"
1008903-95 = "[s11] \"맞아. 일단 앉아.\"\n[s12] 자리에 앉아 메뉴를 주문한다."
1008903-98 = "서, 선생님!?"
1008903-106 = "내가 좋아할 곳이라고 해서, 어떤 장소인가 살짝 궁금했었는데. 그래서 도착한 곳이 라멘집…이라는 건……."
1008903-107 = "무, 물론 라멘을 싫어하는 건 아니지만……. 아니, 뭐. 굳이 따지자면 좋아하는 쪽이긴 하지만……."
1008903-108 = "그래도 뭔가 생각한 거랑은 다른 느낌인걸. 이유라도 있는 거야?"
1008903-109 = "이래서야 평상시에 나한테 라멘 사주는 것과 다를 게……."
1008903-110 = "……달라? 오늘은?"
1008903-111 = "뭐가……?"
1008903-112 = "[s13] \"일이 잘 안 풀려서 함께 푸념하러 온 거잖아.\"\n[s14] \"나는 내 일이 안 풀릴 때, 이런 델 찾는 편이거든.\""
1008903-115 = "……어……."
1008903-116 = "그건 무슨 이야기……."
1008903-120 = "……아."
1008903-121 = "그, 그럼 이게……."
1008903-122 = "선생님 같은 어른들의……?"
1008903-126 = "[ns15] \"……이제 이해했어?\"\n[ns16] \"어때. 막상 별거 없지?\""
1008903-129 = "……후……."
1008903-130 = "후훗. 후후후……."
1008903-131 = "정말 늘……. 이렇게 생각지도 못한 방법으로 이야기를 하는구나, 선생님은."
1008903-132 = "그래. 뭐……."
1008903-133 = "……응."
1008903-135 = "……생각보다 별거 없네."
1008903-138 = "[wa:550]― [log=아루 드레스]하아…… [wa:1900]이렇게 될 줄은 [wa:1760]생각도 못했어.[/log]"
1008903-139 = "[wa:2430]― [log=아루 드레스]하지만… [wa:800]선생님 말대로 [wa:1750]이런 것도 나쁘지는 않네.[/log]"
1008903-142 = "[wa:700]― [log=아루 드레스]솔직히, [wa:1100]신기했었거든……[/log]"
1008903-145 = "― [log=아루 드레스]잘 차려 입은 어른이[/log]"
1008903-146 = "[wa:1900]― [log=아루 드레스]왜 이런 곳에서 [wa:1000]굳이 밥을 먹는지……[/log]"
1008903-149 = "[wa:600]― [log=아루 드레스]하지만…… [wa:1500]지금은 [wa:600]조금 알 것 같아.[/log]"
1008903-152 = "[wa:100]― [log=아루 드레스]각자 이유는 달라도…[/log]"
1008903-153 = "[wa:3000]― [log=아루 드레스]분명, [wa:1300]모두 이런 기분이었겠구나, 하고.[/log]"
1008903-156 = "[wa:450]― [log=아루 드레스]…선생님도, [wa:1120]분명 그렇겠지.[/log]"
1008903-159 = "[wa:400]― [log=아루 드레스]후후… [wa:2400]나도 조금은… [wa:2250]선생님이랑 비슷해졌나?[/log]"
1008903-162 = "(이후 아루와 함께 라멘을 먹으며, 그간 쌓여 있던 아루의 하소연들을 들어주었다.)"
1008903-163 = "(대체로 흥신소 직원들에 대한 칭찬과 고마움, 그리고 '사업'에 대한 어려움과 푸념이었는데.)"
1008903-164 = "(한밤중이 다 돼서도 끝나지 않아, 방에 데려다 줄 때까지 계속되었다…….)"
