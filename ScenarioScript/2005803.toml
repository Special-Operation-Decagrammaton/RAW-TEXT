[translation]
2005803-1 = "에리카, 밤 산책"
2005803-3 = "선생님~ 안녕!"
2005803-4 = "와, 이 시간에 여기서 선생님을 보니까 신기하네."
2005803-5 = "[s1]\"좀 늦긴 했지.\"\n[s2]\"배 많이 고파?\""
2005803-8 = "조금?"
2005803-12 = "……이 아니라 꽤나 고플지도."
2005803-13 = "정신없이 돌아다닐 때는 몰랐는데, 지금은 엄청 고프네."
2005803-14 = "[s3]\"나도 엄청 배고파.\"\n[s4]\"뭐 땡기는 거 있어?\""
2005803-17 = "음……."
2005803-20 = "선생님, 그거 어때?"
2005803-23 = "왠지 햄버거가 엄청 땡기더라! 하핫."
2005803-24 = "선생님은 좋아해? 자주 먹으려나?"
2005803-25 = "[s5]\"환장하지~\"\n[s6]\"오늘은 맛있게 먹을 수 있을 것 같아.\""
2005803-28 = "진짜? 괜히 내가 먹고 싶다고 해서 억지로 어울려 주는 거 아냐?"
2005803-29 = "그런 게 아니라면 다행이지만~ 후후."
2005803-30 = "그런데 늦은 시간인데도 사람이 많네. 다들 활기차 보이고."
2005803-31 = "역시, 밤의 패스트푸드점은 뭔가 들뜨는 기분이 있어."
2005803-32 = "보통은 내일을 준비할 시간이지만, 야식으로 칼로리 높은 음식을 먹는다는 게 뭐랄까. 일종의 해방감? 배덕감? 그런 게 느껴지지."
2005803-33 = "[s7]\"뒷일보다 '지금'을 즐긴다는 기분이려나.\"\n[s8]\"뭔지 알 것 같아.\""
2005803-36 = "그래, 그런 거. 저질러 버렸다~ 라는 느낌. 아하하."
2005803-40 = "아, 엄청 금방 나왔네."
2005803-47 = "[ns]\"자, 주문하신 세트 나왔습니다~\""
2005803-48 = "사주는 사람이 가져다 주기까지 하는 거야? 고마워, 선생님."
2005803-49 = "선생님은 뭐 시켰어?"
2005803-50 = "[s9]\"트리플 치즈 버거 세트!\"\n[s10]\"쉬림프 버거 세트!\""
2005803-53 = "그럼 이쪽이구나. 나는 이거 시켰어."
2005803-57 = "베이컨 토마토 치즈 버거 세트~"
2005803-58 = "[s11]\"토마토가 없는데?\"\n[s12]\"잘못 나온 거 아냐?\""
2005803-61 = "아, 내가 주문할 때 일부러 뺐거든."
2005803-62 = "토마토…… 좋아하긴 하는데, 먹을 때 좀 불편하잖아."
2005803-63 = "한입에 끊어내지 못하면 주욱~ 딸려나온다구."
2005803-64 = "그럼 보기도 안 좋고, 조금 바보 같은 기분이 든달까……."
2005803-65 = "모처럼 선생님이랑 먹게 됐는데, 혹시라도 그런 모습을 보여주기는 싫거든."
2005803-66 = "그럼 선생님 주면 된다고?"
2005803-67 = "……."
2005803-68 = "우와, 그건 내가 부끄러울 것 같은데? 왠지 모르게."
2005803-69 = "그건 다음에 부탁하는 쪽으로~"
2005803-73 = "자, 그럼……."
2005803-74 = "잘 먹겠습니다~ 고마워, 선생님!"
2005803-76 = "(그렇게 에리카와 늦은 저녁을 먹으며 즐겁게 이야기했다.)"
