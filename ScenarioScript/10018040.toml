[translation]
10018040-1 = "제4화;우민들은 구분하지 못할 것이다!"
10018040-2 = "공장 내부"
10018040-5 = "맛 같은 건 아무래도 좋다! 중요한 것은 마진!"
10018040-6 = "위생은 탈이 나지 않을 정도로만! 조미료로 혀를 속일 수 있다면 뭐든지!"
10018040-7 = "미식이니 뭐니, 전부 뇌가 만들어내는 환상에 지나지 않는다!"
10018040-8 = "우리는 환상을 팔고, 그 대가로 돈을 버는 셈이니!"
10018040-12 = "적당 애매한 품질의 식재료를 대량 구입해, 저급한 재료를 섞어 양을 불리고,"
10018040-13 = "냐오푸드 특허 합성 조미료를 섞어 맛을 속이는 것으로 박리다매를 추구!"
10018040-14 = "컴플레인은 상관없다! 우민들은 구분하지 못할 것이다!"
10018040-18 = "뭇후후후. 그리고 거기에서 나오는 모든 이득을,"
10018040-19 = "프랜차이즈형 체인점 '냐오식당'의 운영과 확장에 공격적으로 투자!"
10018040-20 = "드디어 사업이 궤도에 올라, 나날이 번창해 가는 시점에 이르렀다!"
10018040-22 = "보고드립니다, 보스."
10018040-23 = "뭇후후후. 무엇인가? 그보다 여기서는 회장이라는 표현을 쓰라고 했지만?"
10018040-24 = "아, 그랬었지요. 회장님. 아무튼 급히 보고드릴 건이 있습니다."
10018040-25 = "급한 보고라니, 별일이군. 뭇후후후."
10018040-26 = "사업 수익률의 변동 이외에 무엇이 급하다는 것인지?"
10018040-27 = "이 몸을 납득시키지 못한다면 그에 응당하는 대가를 치르게 될 것이야. 뭇후후후후."
10018040-28 = "그게 말입니다. 현장에서 연락이 왔는데 말이죠……"
10018040-30 = "므흐으으음……"
10018040-31 = "어떻게 할까요, 회장님?"
10018040-32 = "그 식당의 처분에 대해서는 익히 생각하고 있었지만……"
10018040-33 = "일단, 미식연구회 같은 군소 동아리 같은 것에는 관심이 없다."
10018040-34 = "위험 요소는 그 동아리가 속한, 게헨나라는 거대 학원."
10018040-36 = "그것 말인데요. 미식연구회는 게헨나 내에서도 제법 눈 밖에 난 동아리라고 합니다."
10018040-37 = "그 정보에 한 치의 거짓도 없는지?"
10018040-38 = "예? 예…… 뭐, 그럴 겁니다."
10018040-39 = "좋아. 그 말을 믿도록 하지. 이야기가 간단해졌군."
10018040-43 = "그렇다면 남은 것은 그 미식연구회의 처분인데……"
10018040-46 = "참새정 내부"
10018040-47 = "다시 생각해 주세요. 참새정에는 가치가 있습니다!"
10018040-48 = "그래요. 이제 막 시작했는걸요. 여기서 마음이 꺾이시면……"
10018040-50 = "모두 감사합니다. 하지만 그 마음만으로도 충분합니다."
10018040-51 = "무엇보다 제가 너무 민폐를 끼쳐드리는 것 같아 면목이 서질 않네요."
10018040-52 = "[s] \"확실히, 하루나와 후우카가 의견이 일치하는 일은 드물긴 하지……\""
10018040-53 = "선생님? 무슨 말씀이시죠?"
10018040-54 = "……아냐, 됐어. 앓느니 죽지."
10018040-55 = "하지만 여기서 더 이상 얽히면…… 어려움이 많을 거예요."
10018040-56 = "냐오푸드 같은 대기업과 싸우는 건, 아무리 해도 무리니까요."
10018040-57 = "처음에는 제가 부족하여 여러분들의 도움을 받으면 될 일이라고 안일하게 생각했지만……"
10018040-58 = "점점 감당할 수 없는 일들만 이어지는 느낌이네요……"
10018040-60 = "대대로 이어져 온 가게는 어쩔 생각이시죠?"
10018040-61 = "그래요. 그것만은 어떻게 해서든 지키고 싶다고 하셨잖아요."
10018040-66 = "역시…… 냐오푸드의 프랜차이즈로 들어가는 것이 최선이 아닐까 합니다."
10018040-67 = "그렇게 한다면 최소한 가게 건물이라도 지킬 수 있을 테니까요."
10018040-68 = "아니요. 그것은 아닙니다."
10018040-69 = "무릇 미식이란 음식뿐만이 아니라 장소, 분위기, 역사, 상황……"
10018040-70 = "모든 것이 하나로 어우러져야 비로소 미식을 자처할 수 있는 법."
10018040-71 = "저는 참새정의 그 어떤 요소도 잃게 할 생각이 없습니다."
10018040-78 = "포기하면 안 된다고 생각해요."
10018040-79 = "네……?"
10018040-83 = "저도, 요리를 잘 못해요."
10018040-84 = "손대는 것마다 엉망이 되고, 맛없는 결과밖에 나오지 않고."
10018040-85 = "약간만 실수하면, 요리가 살아 날뛰면서 사람들을 습격하기도 해요."
10018040-87 = "……그거, 실수라고 말할 수 있는 수준이야? 괴현상 아냐?"
10018040-88 = "하지만 저는 포기하지 않았어요!"
10018040-89 = "후우카 선배가 있어 주셨고, 선생님도 격려해 주셨고, 무엇보다 제가 요리를 그만두고 싶지 않아요!"
10018040-90 = "전 요리를 못하지만, 그래도 요리가 즐거워요!"
10018040-92 = "자신이 만든 음식을 사람들이 먹어 줄 때, 그걸 생각하는 것만으로도 즐겁잖아요?"
10018040-93 = "중간에 그만두면…… 아무것도 되지 않아요."
10018040-94 = "전 언젠가, 정말 맛있는 요리를 만들고 말 거예요."
10018040-96 = "그러니까 주인분도…… 포기하지 않으셨으면 좋겠어요……"
10018040-97 = "제가 이런 말씀을 드리는 것 자체가, 분수를 넘는 짓일지도 모르겠지만요."
10018040-98 = "여러분……"
10018040-99 = "하지만, 어떻게 해야 할까요……?"
10018040-102 = "[s] \"이왕 만든 요리는 아무래도 아깝잖습니까.\""
10018040-104 = "[ns] \"그러니까 사람들에게 평가를 받아 보죠.\""
10018040-107 = "과연. 시식을 통한 판촉 홍보로군요."
10018040-108 = "그렇네요. 저희가 이렇게 노력했다는 것을, 모두에게 보여 드릴 겸 해서요."
10018040-109 = "새로 태어난 참새정…… 그것을 증명하는 새롭게 만들어진 요리…… 후후후."
10018040-110 = "손님들이 만족하는 식당은, 언제든 다시 일어설 수 있어요. 우리 같이 해 봐요!"
10018040-112 = "제가……"
10018040-117 = "여기서 한 번 더 힘내 봐도…… 괜찮을까요?"
10018040-120 = "그 말씀을 기다렸답니다."
10018040-121 = "네! 저희가 도와 드릴게요. 뭐든지요!"
10018040-123 = "아직 시작도 하지 않았으니까 말이지."
10018040-124 = "!!"
10018040-128 = "[ns] \"그러면 우선, 시식회부터 시작합시다.\""
