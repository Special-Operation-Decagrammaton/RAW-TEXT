[translation]
10033100-1 = "제10화;할 수 있는 일"
10033100-2 = "안 돼요!!!!!"
10033100-12 = "불꽃이 터지기 시작했는데?!"
10033100-13 = "불길도 퍼지고 있어. 화재를 막아야 해."
10033100-14 = "물……! 아니, 소화기……! 어느 쪽이든, 뭐든 간에 어서요!"
10033100-15 = "불길을 잡지 못하면 신목제가…… 치세 님이……!"
10033100-20 = "한낮에 불꽃이 무대를 둘러쌌네……."
10033100-21 = "폭죽 놀이– 예뻐–"
10033100-24 = "[ns1] \"우앗, 뜨거워!\"\n[ns2] \"폭죽이 계속 터져 올라가고 있어서……!\""
10033100-29 = "무대 근처로 갈 수가 없어요……!"
10033100-31 = "잘못하면 주위 건물까지 불이 옮겨붙을지도 모릅니다!"
10033100-32 = "으앙–! 어떻게 하면 좋지? 어떻게 해야……?!"
10033100-34 = "이건…… 이래서는……."
10033100-36 = "어, 어떡하죠. 리더?!"
10033100-37 = "폭죽을 터트리는 것까지는 성공했는데…… 그렇게 보면 절반은 해 낸 거라고 봐야 하나요?!"
10033100-42 = "아니야……. 이건……."
10033100-43 = "이렇게까지는, 아니야. 이런 걸 바라지 않았어……."
10033100-48 = "리더! 위험합니다!"
10033100-49 = "앗, 뜨거. 앗 뜨거!"
10033100-60 = "(나 때문에…… 내가…… 내가 멋대로 불꽃을 가져와서…….)"
10033100-61 = "(아니야. 근본적으로……. 애초에…….)"
10033100-62 = "(어제부터 계속 내가 가이드를 제대로 하지 못했으니까. 일정을 맞추지 못했으니까…….)"
10033100-63 = "(그래. 그랬었어…….)"
10033100-64 = "(그래서 이번만큼은, 어떤 일이 일어나더라도, 불꽃을 미리 준비해 두면 제시간에 불꽃놀이를 할 수 있을 거라고 생각했으니까…….)"
10033100-65 = "(…….)"
10033100-66 = "(멍청이.)"
10033100-67 = "(사장님이었다면, 달랐을까……?)"
10033100-68 = "(그래…… 이 자리에, 내가 아니라 사장님이 계셨더라면, 그랬다면…….)"
10033100-69 = "(내가 모두 망쳤어……. 백귀야행뿐만 아니라, 게헨나 학생들에게까지 실망을 끼쳐 버렸어…….)"
10033100-71 = "흑……. 으으…… 흐윽……."
10033100-75 = "[ns] (우미카에게 다가간다.)"
10033100-81 = "[ns] (우미카에게 손을 내민다.)"
10033100-83 = "선생, 님……?"
10033100-84 = "[s] \"아직 할 수 있는 일이 있어.\""
10033100-85 = "하지만…… 저 때문이에요. 제가 모든 걸 망쳤어요."
10033100-86 = "제가, 예정보다 빨리, 불꽃을 가져왔기 때문에."
10033100-87 = "시키지도 않은 짓을 해 버려서. 그래서……."
10033100-88 = "죄송해요, 선생님. 죄송해요. 아무것도 하지 말았어야 했어요. 저 같은 게 이런 일을 맡지 말았어야 했어요. 저 따위가…… 무언가를 하려고 하면 안 되었어요……."
10033100-89 = "죄송해요……. 죄송해요……. 모두들, 정말 죄송해요……."
10033100-90 = "[s3] \"아니야. 우미카.\"\n[s4] \"우미카는, 어떻게든 모두를 위해 노력하려 했던 거잖아.\""
10033100-93 = "그렇지만, 저 때문에 모든 일이……! 게헨나 여러분에게 제대로 된 추억이 되지 못할 만큼 커다란 일을 저질러 버려서……!"
10033100-94 = "[s] \"괜찮아. 봐.\""
10033100-95 = "……?"
10033100-98 = "이거 뭔가 분위기가 묘하지 않아?"
10033100-99 = "혹시 또 모르지? 이것도 축제 과정 중 하나일지도."
10033100-100 = "여기저기서 터지고 불타는 게? 그런 거라면 백귀야행 애들, 우리보다 잘 노네."
10033100-102 = "그 말을 들으니 왠지 지고 있을 수만은 없다는 생각도 드는데……!"
10033100-104 = "야, 나 총류탄 발사기 좀 줘 봐."
10033100-105 = "그건 왜?"
10033100-106 = "지연 신관 유탄을 하늘로 쏘면, 적당히 날아가다가 터지지 않을까?"
10033100-107 = "불꽃놀이 대신에?"
10033100-108 = "그거야!"
10033100-109 = "맘에 든다, 그 생각."
10033100-115 = "으으, 으으으……. 어떻게 해야……."
10033100-116 = "리더! 정신 차리는 겁니다!"
10033100-117 = "그래요! 리더까지 중심을 못 잡으면 우리 망량즈는 어떡하란 겁니까!"
10033100-118 = "……! 아, 알았다고!"
10033100-123 = "어디를 보아도 불꽃뿐–"
10033100-127 = "예쁘네–"
10033100-132 = "………어, 어라……?"
10033100-133 = "저기…… 다들 어째서인지…… 당황하신다거나 무서워하시기보다는…… 그게……."
10033100-134 = "[ns] \"그래. 어떻게 보면…… 당연한 거야.\""
10033100-135 = "네……?"
10033100-149 = "[ns] \"……게헨나잖아.\""
10033100-150 = "………!"
10033100-151 = "……저, 이럴 땐 어떻게 반응해야 할까요……?"
10033100-152 = "하, 하지만 그래도 역시 제가 저지른 일이라는 건 변함이 없는데!"
10033100-153 = "[s5] \"괜찮아. 이 정도로 우미카가 좌절할 필요는 없어.\"\n[s6] \"무엇보다 우미카는 혼자가 아니잖아?\""
10033100-156 = "우미카? 우미카? 괜찮나요?"
10033100-157 = "피나……."
10033100-158 = "좀 여러 가지로 정신없어졌지만…… 그러니까 모두에게 도와달라고 하자!"
10033100-159 = "도와, 달라고요……?"
10033100-160 = "맞아! 게헨나 학생이랑, 그리고 또 백귀야행의 모두랑…… 아무튼! 다른 사람들한테!"
10033100-161 = "하지만, 이건 전부 제 실수인데요……? 남에게 책임을 미루다니, 가이드로서 실격인데……."
10033100-169 = "그렇지 않아."
10033100-170 = "츠바키 선배……?"
10033100-171 = "[ns7] \"도움을 요청하는 건, 남에게 책임을 미루는 일이 아니야.\"\n[ns8] \"세상에 완전한 사람 같은 건 없으니까.\""
10033100-174 = "하지만, 사장님이라면 이럴 때……."
10033100-175 = "그거라면…… 시즈코 부장도 마찬가지였습니다!"
10033100-176 = "네……?"
10033100-188 = "[ns9] \"응. 시즈코도 자기 힘이 모자랄 것 같은 일에는.\"\n[ns10] \"솔직하게 도움을 받아들이고, 그렇게 문제를 해결했으니까.\""
10033100-191 = "……."
10033100-195 = "저기, 선생님? 우미카 쨩? 괜찮아?"
10033100-203 = "여러분……?!"
10033100-205 = "뭔가 느낌이 좋지 않아서 찾아와 봤는데……."
10033100-206 = "으음~ 이거, 뭔가 조금 위험하다는 느낌? 맞으려나?"
10033100-207 = "[s] \"맞아. 더 늦기 전에 불을 꺼야 해.\""
10033100-208 = "역시 그런 건가. 다들 이것도 축제의 일부가 아니냐고 하고 있지만……."
10033100-209 = "으음, 이 사태를 해결하기 위해선 우리 게헨나 애들도 전부 와장창~ 하고 도와주는 편이 좋겠지?"
10033100-210 = "하지만 어떻게? 다들 긴가민가하고 있어서 당장 움직이기엔 부족한 느낌인데."
10033100-211 = "후후후~ 그거라면 괜찮아. 상황을 반전시킬 방법이라면, 있어."
10033100-213 = "저, 정말인가요?!"
10033100-214 = "맞아! 우미카 쨩! 이럴 때 필요한 게 바로 이번 수학여행을 이끌어 온…… '가이드'의 역할이야!"
10033100-215 = "가이드, 라는 건……?"
10033100-225 = "[ns] \"지금까지 모두를 이끌어 온 우미카가 활약할 차례야.\""
10033100-226 = "……제가 활약할 차례."
10033100-231 = "네. 선생님. 그리고 여러분."
10033100-232 = "저, 생각이…… 하나, 떠올랐어요."
10033100-233 = "염치없지만, 조금만 더 저희를 도와주실 수 있나요?"
10033100-234 = "물론이지!"
10033100-240 = "여러분! 이 축제를 즐기고 계신 모두들! 백귀야행과 게헨나 학원의 모든 분들!"
10033100-241 = "이 불길은! 이번 축제의 이벤트 코너 중 하나랍니다!"
10033100-242 = "갑작스러운 사고로 위기에 빠진 광장과 무녀님! 사방에서 천천히, 그렇지만 빈틈없이 조여 오는 불길!"
10033100-243 = "이대로 둔다면 광장도, 무녀님도 위기에 빠질 것이 너무나 분명한 상황!"
10033100-244 = "이 상황을 이겨내기 위해서는, 이곳에 모인 모든 분들의 힘이 필요하답니다!"
10033100-245 = "그렇게 하면 신목도, 모두의 소원과 뜻을 이어받아, 이 자리에 모인 행운을 모든 분들께 나누어 줄 테니까요!"
10033100-250 = "뭐가 어떻게 되어가고 있는 거야, 이거……."
10033100-256 = "에리카 쨩. 알겠지?"
10033100-257 = "으응. 뭐. 잘 될지 어떨지는 모르겠지만."
10033100-258 = "그러면 잠깐 다녀올게. 선생님, 우미카 쨩!"
10033100-264 = "부탁드리겠습니다!"
10033100-270 = "얘들아! 축제래!"
10033100-271 = "아니, 뭐. 그렇다고 듣고는 있는데……."
10033100-272 = "간단하다면 간단한 거지. 불을 끄고 무녀님을 구하면 돼."
10033100-273 = "그럼 지금까지 일어났던 일이 전부 상황극이었다는 거야?"
10033100-274 = "맞아! 모두 힘을 합쳐 무녀님을 구하고, 다 같이 신목제를 마무리하는 게 순번이라고 하더라!"
10033100-275 = "아, 벌써 시작한 모양인데?"
10033100-278 = "카에데! 여기입니다! 여기부터 불길을 잡으면 될 것 같습니다!"
10033100-279 = "물이 더 필요해! 양동이든 소화기든 좋으니까, 어서!"
10033100-280 = "소방용 양동이 나눠줄게~ 차례차례, 하나씩~"
10033100-286 = "응! 나도 가야지! 다녀올게!"
10033100-290 = "그렇게 됐으니까, 먼저 갈게. 너희들도 생각 있으면 오라고."
10033100-295 = "그런가…… 그런 거였나……!"
10033100-296 = "이런 건 못 참지!"
10033100-308 = "거기, 망량즈! 어서 움직여요!"
10033100-310 = "어, 어……? 나……?"
10033100-311 = "그래요. 축제가 엉망이 되는 건, 싫잖아요?"
10033100-313 = "……!"
10033100-314 = "그래, 맞아……."
10033100-315 = "우리가 저질렀지만, 그것 때문에 축제가 엉망이 되어어선 안 돼. 응……!"
10033100-316 = "망량즈! 다들 모여! 할 일이 있다!"
10033100-321 = "네, 넷! 리더! 뭘 하면 될까요?"
10033100-322 = "으으……. 이대로는 우리들의 신목이…… 축제가……!"
10033100-324 = "그래, 그거야! 다른 건 몰라도, 신목에 불이 붙는 건 막아야 해!"
10033100-325 = "우리들은 지금부터 화재 진압에 들어가는 거야!"
10033100-330 = "알겠습니다. 리더!"
10033100-331 = "우리의 축제를, 우리 손으로 지키는 거군요!"
10033100-374 = "헉, 헉……. 갑자기 불길이 피어올라서 뛰어왔는데……."
10033100-375 = "상황은 정리된 모양이군요. 다행입니다."
10033100-376 = "[s] \"어? 게헨나 선도부? 회담이 있다고 하지 않았어?\""
10033100-377 = "마침 그 회담 장소가, 신목제가 열리는 바로 옆이었어서요……"
10033100-378 = "니야라고 했던가? 음양부의 그 사람이 준비한 자리였는데 말이지."
10033100-379 = "그보다 이 난리는 대체……."
10033100-380 = "일단 수습부터 하죠."
10033100-387 = "학원과 학원…… 학생과 학생을 넘어, 하나가 되어 위기에 대처하는 모습이라니……."
10033100-388 = "이 무슨 아름답고 가슴 벅차오르는 광경……! 소녀, 감격했사와요!"
10033100-389 = "우리도 가만히 있을 수는 없지. 그치, 키쿄?!"
10033100-390 = "응. 우리 백화요란도 기민하게 대응할 때야."
10033100-397 = "[ns] \"아, 그래서 니야는 처음부터…….\""
10033100-406 = "그러면, 여러분! 이 자리에서 다시 한번, 신목제의 무녀님을 소개하겠습니다!"
10033100-407 = "여러분들의 참여와 노력으로, 무사히 다시 무대에 올라, 신목제의 의식을 주관하실 무녀님은–"
10033100-409 = "정말 백귀야행은 관객이 참여하는 축제가 많구나……."
10033100-410 = "아하하하. 그렇지? 언제 또 이런 요란한 축제를 경험해 보겠어."
10033100-411 = "그러게. 물론 다 준비되고 조절된 것이었겠지만, 실감 났어."
10033100-416 = "으음……. 뭐, 그런 걸로 하면 되겠지. 응."
10033100-418 = "괜히 관광에 축제로 유명한 학원이 아니라는 느낌? 오길 잘했네."
10033100-419 = "그렇지? 이렇게 끝나다니, 조금 여러 가지로 아쉬운 느낌? 하루만 더 있고 싶은데."
10033100-421 = "……그러다 또 무슨 사고가 날지 어떻게 알고……."
10033100-422 = "응? 뭐라고? 지금 사고 같은 말이 들린 것 같은데……?"
10033100-423 = "아니. 아니야. 아무것도 아니니까. 하아……. 그래도, 뭐."
10033100-424 = "왜 그래?"
10033100-428 = "그냥, 잘 됐다 싶어서."
10033100-429 = "응?"
10033100-431 = "지금 보고 계신 춤은, 기도와 봉납을 위하여–"
10033100-434 = "응……. 다행이네. 그렇지?"
10033100-435 = "그러게."
10033100-443 = "……."
10033100-444 = "축제의 시간."
10033100-445 = "모두가 기뻐하며."
10033100-446 = "막이 내리네."
