[translation]
1011506-1 = "남겨진 것, 이어지는 것"
1011506-5 = "우아……. 모아 놓고 보니 엄청나게 많네요."
1011506-6 = "실밥이 터진 야구공, 찢어진 글러브, 휘어진 알루미늄 배트……."
1011506-7 = "이건 뭐야. 흙 얼룩이 지워지지 않게 된 유니폼……? 아니, 이런 건 좀 스스로 하는 데까지 해 보고 나서……."
1011506-8 = "애초에 흙이 깊이 묻은 유니폼은, 손빨래로 세탁하는 것밖에 방법이 없는데……."
1011506-9 = "하아. 일단 장비 위주로 수선 물품의 리스트를 작성해 봐야겠네요."
1011506-10 = "[ns] \"나도 좀 도와줄게.\""
1011506-11 = "네? 서, 선생님이요? 그렇지만 이건 저희 밀레니엄 야구부가 할 일이고, 그중에서도 오늘은 제가 당번이고……."
1011506-16 = "그렇다고 할까, 벌써 분류를 시작하셨잖아요? 기, 기다려 주세요! 할 거면 저도 같이–"
1011506-19 = "이 글러브의 찢어진 각도와 입사각, 그리고 캐치 순간에 발생했을 것으로 보이는 충돌에너지의 예상치를 대입하여 역산해 보면……!"
1011506-20 = "[s] \"역산해 보면……?\""
1011506-21 = "이건, 플라이 볼이 아니라 직선타를 잡다가 찢어진 글러브일 거예요!"
1011506-22 = "플라이 볼은 결국 중력 가속도로 떨어지는 공이다 보니, 종단 속도에 한계가 있기 마련이거든요."
1011506-23 = "그 정도로는 이렇게 크고 인상적인 흔적을 남길 수 없죠."
1011506-27 = "보세요. 엄지손가락과 집게손가락 사이를 채워 주는 부위인 웹(web)이, 가죽 끈인 레이스(Lace)째로 뜯겨 나가 있잖아요?"
1011506-28 = "분명 엄청나게 잘 맞은 직선타였을 거예요. 방향만 수비수 쪽이 아니었다면 그대로 쭉 뻗은 안타가 되었을지도 몰랐겠네요."
1011506-31 = "이 야구공의 실밥이 뜯어진 개수와 위치를 세어 보니……."
1011506-32 = "분명, 각도 큰 스위퍼를 던지다가 실밥이 상한 걸 거예요!"
1011506-33 = "[s] \"스위퍼?\""
1011506-34 = "슬라이더라는 변화구의 일종이에요. 그중에서도 옆으로 휘는 횡 슬라이더의 일종이죠."
1011506-35 = "기존 슬라이더의 포심 그립과 달리 투심 그립으로 던지는 게 특징인데…… 횡적인 무브먼트가 엄청나게 중요하거든요!"
1011506-36 = "잘 꺾인 스위퍼는 타자가 커트하기도 힘든 바깥쪽으로 흘러 나가버리곤 해서, 자연스럽게 헛스윙률이 높아지게 되고요!"
1011506-37 = "그거 아세요? 세이버메트릭스의 통계 중 피치 밸류에서, 슬라이더는 단 한 번도 1위의 자리에서 내려온 적이 없어요!"
1011506-38 = "[s1] \"그건 정말 대단한데…….\"\n[s2] \"밀레니엄 야구부에 그런 구종을 던질 수 있는 투수가 있었어?\""
1011506-41 = "아."
1011506-42 = "……."
1011506-43 = "아마, 밀레니엄제 피칭&히팅 머신에서 던진 것일 거예요……."
1011506-46 = "이 알루미늄 배트 휘어진 각도 말이에요. 수상하지 않으세요?"
1011506-47 = "어디가 그렇냐고요? 타격 연습 중에 손상이 갔다면, 이 자리가 휘어졌을 리가 없어요!"
1011506-48 = "응력과 작용점을 계산해 보면, 이건 절대 공이 맞을 자리가 아니니까요! 아니면 타자가 정말 말도 안 되는 궤도로 배트를 휘둘렀던가요."
1011506-52 = "하지만 그보다 가능성이 높은 건, 배트를 땅에 끌고 다니다가 넘어져서 휘어지고 만 것이겠죠……."
1011506-53 = "안 되겠어요. 다들 장비를 좀 소중히 해 달라고, 주장에게 이야기해 둬야겠어요!"
1011506-54 = "[s3] \"입사각, 충돌에너지, 종단 속도, 응력, 작용점…….\"\n[s4] \"레이도 정말, 밀레니엄 학생이구나…….\""
1011506-57 = "네? 무슨 뜻이세요, 선생님?"
1011506-58 = "아, 손상된 장비를 동역학적으로 분석하는 부분 같은 거 말씀이시군요. 그렇지만 밀레니엄에서는 그냥 보통인데요?"
1011506-59 = "선생님? 왜 다 이해하셨다는 표정으로 저를 바라보시는 건가요……?"
1011506-61 = "아, 이건……!"
1011506-67 = "이건 수선 보낼 장비가 아닌데. 선배들도 참……."
1011506-68 = "[ns] \"그 야구공에, 뭔가 있어?\""
1011506-69 = "……."
1011506-70 = "이 야구공은, 말이죠……."
1011506-75 = "[wa:1900]― [log=레이]이건, [wa:1050]제가 처음 잡아 본……[/log]"
1011506-76 = "[wa:2170]― [log=레이]그때의, [wa:1050]홈런공이에요.[/log]"
1011506-79 = "[wa:1240]― [log=레이]야구를 제대로 시작한 뒤로,[/log]"
1011506-80 = "[wa:1500]― [log=레이]늘 가지고 다녔었죠.[/log]"
1011506-83 = "[wa:1370]― [log=레이]그때 본 홈런을……[/log]"
1011506-84 = "[wa:2490]― [log=레이]언젠가, [wa:1220]저도 쳐 보고 싶다고 생각해서요.[/log][wa:1200]"
1011506-87 = "[wa:900]― [log=레이]지금은 [wa:720] [/log]"
1011506-88 = "[wa:1980]― [log=레이]사물함에 소중히 보관하고 있어요.[/log]"
1011506-91 = "[wa:1280]― [log=레이]마음이 꺾일 것 같을 때, [wa:1450]이 공을 보면,[/log]"
1011506-94 = "― [log=레이]초심을 찾게 해 주는 것 같아서…… [wa:2930]힘이 나곤 해요.[/log]"
1011506-95 = "[wa:2950]― [log=레이]……소중한, [wa:1670]부적 같은 공이랍니다.[/log]"
1011506-99 = "[ns] \"정말로, 추억의 야구공이구나.\""
1011506-100 = "신기하죠, 선생님?"
1011506-101 = "그냥 물성학적으로 분석하면, 아주 낡은 가죽과 108개의 실밥."
1011506-102 = "그리고 그 안은 코르크와 고무 속심으로 이루어진, 둥그런 물체일 뿐인데 말이죠."
1011506-103 = "그런데도 이렇게, 꺼내 보는 것만으로 특별한 느낌을 주고……."
1011506-104 = "나아가서, 다시 한번 해 보자는 마음마저 생겨나게 해 주다니요."
1011506-105 = "[s] \"그래서 소중한 무언가가 있다는 건, 좋은 걸 거야.\""
1011506-106 = "정말로 그래요."
1011506-107 = "네. 정말로……."
1011506-108 = "저, 선생님?"
1011506-109 = "그러니까, 말이죠……?"
1011506-113 = "언젠가 제가, 선생님의…… 그……."
1011506-114 = "소중………… 한."
1011506-115 = "누군가가, 되었으면, 좋겠네요."
1011506-116 = "[s] \"이미 그런데?\""
1011506-117 = "네?!?!"
1011506-118 = "[ns] \"레이는 내 학생이잖아.\""
1011506-119 = "……."
1011506-123 = "그런, 가요. 그렇군요. 헤헤. 그것도 좋아요."
1011506-124 = "적어도…… 지금은요."
1011506-125 = "네. '지금'은, 말이에요."
