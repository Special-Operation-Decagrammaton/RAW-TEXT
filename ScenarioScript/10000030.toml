[translation]
10000030-1 = "제3화;음양부의 전파 아가씨"
10000030-2 = "그럼 늦기 전에 바로 움직이죠! 선생님!"
10000030-3 = "이번처럼 백귀야행에서 각종 트러블이 일어났을 경우……."
10000030-4 = "도움을 받을 수 있는 곳은 크게 두 곳이 있어요."
10000030-5 = "한 곳은 백귀야행 연합학원의 학생회라고도 할 수 있는 <음양부>."
10000030-6 = "그리고 또 다른 한 곳은 <백화요란 분쟁조정위원회>……."
10000030-7 = "백화요란은 지금 자리를 비우고 없다고 들었습니다!"
10000030-8 = "네, 피나 말대로, 백화요란이 부재중인 지금."
10000030-9 = "오늘 저희가 그나마 도움을 요청해볼 수 있는 곳은 음양부……일 거예요. 아마도."
10000030-10 = "[s] \"아마도?\""
10000030-11 = "으음, 그게……."
10000030-12 = "에잇! 이건 직접 가서 접해보는 수밖에 없어요!"
10000030-13 = "자아, 가죠! 선생님!"
10000030-14 = "그리고 피나. 나 없는 사이에, 별다른 일이 없나 백야당 잘 보고 있어야 해?"
10000030-15 = "물론입니다! 협객 정신으로, 명심하고 있겠습니다!"
10000030-16 = "……그래? 그럼 질문이야."
10000030-17 = "네! 두근두근."
10000030-18 = "선생님과 내가 자리를 비운 사이에 망량즈가 찾아왔다고 치자."
10000030-19 = "녀석들이 갑자기 '목이 말라서 그런데, 물 좀 한 잔만 줄래?' 라면서 백야당 문을 두드리면 어쩔 거야……?"
10000030-20 = "어려움에 처한 사람이 있으면 돕는다! 그게 협객입니다!"
10000030-21 = "그러니까 그러면 안 된다니까!"
10000030-22 = "으으으……. 정말……."
10000030-23 = "……맡겨도 되는 거지?"
10000030-24 = "네! 부장! 피나에게 맡겨만 주세요! (활짝)"
10000030-26 = "(도착한 곳은 풍취가 느껴지는 어떤 커다란 건물이었다.)"
10000030-27 = "이곳이 백귀야행 연합학원의 주요 장소 중 하나……."
10000030-28 = "안쪽에 음양부의 부실이 있을 거예요."
10000030-29 = "으……. 여긴 몇 번을 와도 속이 쓰리다니까요."
10000030-30 = "[s] \"왜?\""
10000030-31 = "그게……. 음양부는 괜히 엉덩이만 무거워서, 어지간해선 잘 움직이지 않아요."
10000030-32 = "애당초 그걸 전문으로 하는 건 백화요란 쪽이고……."
10000030-33 = "당장 음양부라는 이름답게 자기들은 백귀야행의 균형을 지키기 위해 존재한다면서."
10000030-34 = "무슨 일이 벌어져도 웃는 얼굴로 '우린 아무런 권한도 없어요~' 라면서 어중간한 태도로 나오기 일쑤고."
10000030-35 = "특히나 맨날 히죽히죽 웃고 있는 그 음양부 부장!"
10000030-36 = "이쪽에서 필요에 따라 클레임을 걸면 늘상 '중요한 안건은 서면으로 부탁드립니다.' 라는 말이나 하질 않나."
10000030-37 = "당장 축제 준비가 한창인데!"
10000030-38 = "관료제라는 건가요? 관료제의 폐해라는 건가요?!"
10000030-40 = "……후후후. 하지만 그것도 오늘까지의 이야기."
10000030-41 = "저쪽이 그렇게 나오겠다면, 이쪽도 다 방법이 있다. 이거죠. 이쪽엔 샬레의 선생님이 계시니까요."
10000030-42 = "선생님만 계신다면 음양부 부장도 찍소리 못하고 협력할 수밖에 없겠죠."
10000030-43 = "그 콧대 높은 사람도 얼마든지 내 마음대로 크흐흐……가 아니라."
10000030-44 = "……에헤헷?"
10000030-45 = "[s] \"……이미 늦었다고 생각하지만 말이야.\""
10000030-46 = "어, 어찌 되었건 어서 들어가죠!"
10000030-49 = "어서-와. 선생님. 기다리고 있었어."
10000030-50 = "치세……, 선생님을 기다리고 있었다고?"
10000030-51 = "우리가 올 걸, 미리 알고 있었던 거야?"
10000030-52 = "응- 니야 부장이 말했었-어."
10000030-53 = "둘이서 온다."
10000030-54 = "귀여운 선생님과"
10000030-55 = "너구리 씨가."
10000030-56 = "읏……! 누가 너구리라는 거야?!"
10000030-58 = "흠흠……. 그래서 정작 그 다 안다는 듯이 말한 부장 씨는?"
10000030-59 = "부장은."
10000030-60 = "어……."
10000030-61 = "음-"
10000030-62 = "키운다면 검은 고양이가 좋-대."
10000030-63 = "반려동물 취향을 물어본 게 아니잖아!"
10000030-64 = "……그보다 너구리라는 거, 반려동물 이야기였어?!"
10000030-66 = "하여간……. 오늘 이렇게 선생님과 찾아온 이유는 부장을 만나기 위해서야."
10000030-67 = "치세, 부장은 어디 있어?"
10000030-68 = "부장은……."
10000030-69 = "오늘은 이미"
10000030-70 = "하교했습니다."
10000030-71 = "그럼 내일 봐."
10000030-72 = "뭐엇? 자리를 비웠다고? 아직 한낮인데? 대체 왜?"
10000030-73 = "……? (갸웃)"
10000030-74 = "고양이를…… 보러?"
10000030-75 = "……라니, 이쪽 한테 되묻자면 어쩌자는 거야! 전혀 이해가 안 되는데요?!"
10000030-76 = "으읏, 이런 중요한 때에 가장 껄끄러운 인간이……, 하필 가장 필요할 때 없다니……."
10000030-77 = "[s] 치세에게 찾아온 이유를 설명한다."
10000030-78 = "응, 알고 있어. 축제의 소란 때문."
10000030-79 = "어?!"
10000030-80 = "그리고 부장이 말했어. 직접 도움은 줄 수 없-지만."
10000030-81 = "수행부에 가라. 라고."
10000030-82 = "……수행부?"
10000030-83 = "수행부에서도 왔어. 클레임. 거리의 소란, 시끄럽다고. 그래서 부장이-"
10000030-84 = "하나로 안 되면, 둘로 합치면 될 거라고-"
10000030-85 = "[s] \"비슷한 고민을 하는 동아리가 있었나 보네.\""
10000030-86 = "으으읏. 수행부……란 말이지."
10000030-87 = "알았어. 일단 이야기를 들었으니, 이번엔 수행부를 찾아가 봐야겠네."
10000030-88 = "치세, 만약 혹시 나중이라도 부장이 돌아오거나 그러면 따로 연락해줘."
10000030-89 = "자아, 선생님! 가죠!"
10000030-92 = "네. 잘 다녀오세요~"
10000030-94 = "으음, 수행부, 수행부란 말이지. 수행부……."
10000030-95 = "수행부 학생들은, 꽤 괴짜들이란 말이죠……."
10000030-96 = "[s1] \"그래?\"\n[s2] \"괴짜라니, 시즈코만큼이나?\""
10000030-97 = "정말 그렇다니까요?"
10000030-98 = "저 보고 괴짜라니, 무, 무무무, 무슨 말씀이신가요! 선생님도 차암!"
10000030-99 = "저 시즈코~ 백야당의 아이돌이라구욧~?!"
10000030-100 = "그.러.니.까!"
10000030-101 = "수행부란 매사 수행을 위해서라면서 여러 가지 활동을 하는 동아리예요."
10000030-102 = "예를 들어 잠자기 수행의 일환으로 자면서 직소 퍼즐을 맞춘다던가."
10000030-103 = "[s] \"……응?\""
10000030-104 = "멋진 레이디가 되겠다면서 길거리의 불량배들을 격퇴한다던가."
10000030-105 = "[s] \"……으응?\""
10000030-106 = "최고의 요조숙녀가 되기 위해서라면서 독심술을 쓰는 부원도 있대요!"
10000030-107 = "[s] \"……??\""
10000030-108 = "뭐, 결국 소문일 뿐이니까. 진짜 사실은 직접 확인해봐야 할 일이지만."
10000030-109 = "그런 괴짜들에게 협력을 받는다고, 도움이 될는지."
10000030-110 = "으음……. 아뇨. 부정적인 생각은 끝!"
10000030-111 = "이런 건 직접 부딪쳐 보기 전까지 모를 일이니까!"
10000030-112 = "자! 얼른 수행부 동아리가 있는 장소로 가죠……!"
10000030-115 = "콜록콜록, 또, 또 뭐얏?!"
10000030-117 = "크흐흐흣! 축제를 망치기 위해, 우리 망량즈가 납시었다!"
10000030-118 = "이번에야말로! 전부 파괴해주마!"
10000030-120 = "으으으! 망량즈 녀석들 질리지도 않고 또!"
10000030-121 = "좋아! 얼마든지 상대해주겠다구!!"
