[translation]
13290-1 = "제29화;격전 2"
13290-34 = "……사라졌다?"
13290-35 = "이쪽이야."
13290-52 = "큭……!"
13290-53 = "……!!"
13290-54 = "뭐야…… 어째서 네가……?"
13290-55 = "이건 너랑 아무 상관 없는 일이야……!! 비켜!"
13290-60 = "……, 으그으윽……!!"
13290-61 = "방해, 하지 마……! 선도부장……, 이건……!"
13290-62 = "내 문제……야! 아비도스의……!"
13290-63 = "상관……, 있어."
13290-64 = "뭐……?!"
13290-65 = "설마 선생님이 보낸 거야? 그치만……."
13290-68 = "흐읍-!"
13290-76 = "(이대로라면 열차 칸이 떨어져 나갈 거야……!!)"
13290-77 = "(위로 올라가지 않으면……!)"
13290-93 = "하아…… 하아……."
13290-97 = "……하아."
13290-98 = "……. 꽤 끈질기네. 선도부장 쨩."
13290-99 = "아아. 자주 듣는 말이야."
13290-103 = "(선도부장이 선생님의 부탁으로 온 거면…… 내가 오아시스역으로 가지 못하게 저지하는 것이 목표…….)"
13290-104 = "(아마 기차의 최선두 엔진 칸을 파괴하거나, 아니면 나를 여기서 떨어트릴 셈이겠지.)"
13290-105 = "……."
13290-111 = "(선도부장을 기차에서 떨어트리고 내가 이 기차에 계속 남아 있을 수 있는 방법을 찾아야 해…….)"
13290-112 = "(그런 방법은…….)"
13290-122 = "다음화;알 수 없는 것"
