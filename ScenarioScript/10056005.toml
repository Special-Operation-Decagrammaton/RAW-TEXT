10056005-70 = "1;아미;02;저기, 함장."
10056005-71 = "3;미나토;13;그나저나 선생님, 점심 식사는 하셨나요? 오늘은 금요일이라서 점심 메뉴로 카레가 예정되어 있는데……\n#3;em;[재잘]"
10056005-72 = "3;미나토;12;저는 오늘 특식으로 나오는 카레가 너무 기대되어서, 어제 저녁부터 다른 음식이 성에 차질 않더라고요. 후후."
10056005-73 = "3;미나토;03;특히 항해 중에는 신선한 채소를 구하기가 어려워서 냉동 야채나 고기만 들어간 카레를 먹는 경우가 많았는데……"
10056005-74 = "3;미나토;10;오늘 나오는 카레는 조리장이 D.U.에서 공수해 온 신선한 토마토를 잔뜩 넣었다고 하네요.\n#3;em;[음표]"
