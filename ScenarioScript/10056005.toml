10056005-57 = "3;미나토;11;오디세이아에서 지내시기에 불편하신 점은 없으신가요?\n#3;em;[반짝]"
10056005-58 = "[s1] \"다들 배려해 준 덕분에 즐겁게 지내고 있어.\"\n[s2] \"아직 모르는 부분이 잔뜩 있지만……\""
10056005-61 = "3;미나토;13;네, 오디세이아 해양 학원은 키보토스에서도 손 꼽히는 큰 규모의 큰 학원인 만큼, 학원의 시설물을 모두 둘러보시려면 시간이 꽤 걸리실 거예요.\n#3;em;[재잘]"
10056005-62 = "3;미나토;01;물론 오디세이아보다 더 큰 규모의 학원도 여럿 있긴 하지만……"
10056005-63 = "3;미나토;03;각자의 배를 부실로 사용하고 있는 대다수 오디세이아 동아리들의 특성상 항해 일정이 어긋나면 방문할 수 없는 동아리도 여럿 있으니까요."
10056005-64 = "3;미나토;11;저희와 함께 원양 항해라도 함께 떠나시지 않는 한 오디세이아 학원을 완벽하게 이해하시기는 어렵지 않을까요?\n#3;em;[음표]"
10056005-65 = "3;미나토;12;아니, 어쩌면 이 드넓은 바다를 모두 항해할 때까지 오디세이아를 완전히 이해했다고 말할 수는 없을지도. 후후."
