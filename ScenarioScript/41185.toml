[translation]
41185-2 = "적 돌격병 처치! 탱고 3 다운!"
41185-4 = "확인! 제압 사격을 하는 동안 RABBIT2는 다음 엄폐물까지 전진을 부탁합니다!"
41185-5 = "알겠어!"
41185-6 = "그 외 분대원은 5초간 현 위치를 사수합니다!"
41185-7 = "3…… 2…… 1……"
41185-12 = "사키, 지금입니다! 폭스트롯 투하!"
41185-13 = "전방 섬광탄!"
41185-19 = "미유! 5시 방향 창문에 적 저격수입니다!"
41185-20 = "방금 처리했어!"
41185-21 = "하지만 앞으로 남은 잔탄은 한 발…… 재장전이 필요해!"
41185-22 = "허가합니다. 사키, 그 사이 엄호사격을 부탁합니다!"
41185-23 = "맡겨 두라고!"
41185-34 = "저 녀석들 뭐야? 한 소대가 거대한 톱니바퀴처럼 맞물려서 맹렬히 돌격하고 있어!"
41185-35 = "학생의 숫자도 무기도 우리가 압도적으로 많은데…… 어째서 계속 후퇴하게 되는 거야?"
41185-36 = "심지어 이 건물은 우리 학교 본관인데…… 지형적 이점을 저쪽이 다 가져가고 있어!"
41185-37 = "이러다가는 본관 중앙 현관까지 밀려나겠어……"
41185-38 = "거, 걱정하지 마! 곧 서편 현관을 통해 경비국 인력이 곧 추가로 도착할 테니까."
41185-39 = "인원이 보충되면 머릿수로 한번에 밀어붙이는 거야!"
41185-45 = "서편 현관에서 다수의 발소리 포착……"
41185-49 = "모에. 경찰학교 본관의 난방 시설과 연결된 실내 온도 감지 장치의 수치를 조작할 수 있나요?"
41185-50 = "보안 시설의 접근이라면 어렵지만, 그 정도라면 괜찮아!"
41185-51 = "그럼 건물 관리 프로그램이 실내 온도를 착각하도록 수치를 조작 부탁드립니다."
41185-52 = "몇 도면 괜찮겠어?"
41185-53 = "섭씨 900도로!"
41185-54 = "오케이!"
41185-57 = "어라? 이게 웬 물이지?"
41185-58 = "갑자기 스프링클러가 고장 났나 봐!"
41185-59 = "그 말은……"
41185-63 = "으악! 방화벽이 내려간다!"
41185-68 = "하아…… 우리 학교 건물에 우리가 갇혀버렸네."
41185-69 = "이래서야 지원을 온 학생들도 들어올 수가 없겠어."
41185-70 = "괜찮아. 이 방화벽은 안에서 수동으로 개폐할 수 있으니까……"
41185-71 = "지원 병력이 들어올 수 있도록 방화벽을 다시 열자!"
41185-75 = "……어라? 이게 뭐지? 녀석들이 두고 간 물건인가?"
41185-76 = "C4 폭약 같은데? 그런데 폭약 위에 급조 폭발물처럼 개조된 리튬 배터리가 붙어 있어."
41185-77 = "잠깐. 리튬은 물에 닿으면……"
41185-81 = "……망했군."
41185-91 = "흐아암— 졸려……."
41185-92 = "한밤중에 이게 무슨 소동이람?"
41185-93 = "설마 겁도 없이 경찰학교 본관에 침입하는 도둑이 있을 줄이야. 무서운 세상이네……"
41185-94 = "그런데 아무리 그래도 생활안전국 학생들까지 다 깨울 필요가 있었나? 도둑 정도야 경비국 학생들 선에서 처리할 수 있었을 텐데."
41185-95 = "나는 적당히 순찰하는 척 근처나 어슬렁거리다 돌아가야지……."
41185-99 = "……응? 저건 뭐지……?"
41185-106 = "……누가 만들었는지는 모르겠지만 아주 질 나쁜 함정인걸."
41185-107 = "도넛을 좋아하는 학생이 많은 경찰학교 본관에 이런 함정을 만들었다는 점이 특히나 악질이야."
41185-108 = "하지만 바보가 아니고서야, 저런 허접한 도넛으로 만든 함정에 빠지는 사람이 있을 리가……"
41185-110 = "아. 그거, 마시멜로가 들어간 <마스터 도너츠>의 한정 판매 도넛이야."
41185-111 = "그래? 그럼 참을 수 없지!"
41185-115 = "잘 먹겠습니다~"
41185-120 = "으악~ 당해버렸다~"
41185-127 = "설마 진짜 이 함정이 먹힐 거라고는 예상 못 했는데."
41185-128 = "나도 조금은 걱정스러웠지만…… 이해할 수 없는 지시가 내려오더라도 일단 따라 달라고 미야코 쨩이 부탁했으니까."
41185-129 = "……이렇게 성공한 걸 보면, 역시 미야코 쨩을 믿길 잘했어."
41185-131 = "아하하…… 방금의 함정은 제게도 도박수이긴 했습니다만……."
41185-132 = "그 많은 병력을 뚫고 여기까지 나올 수 있었던 건 소대원 여러분의 뛰어난 능력 덕분입니다."
41185-133 = "제가 아닌 다른 사람이 지휘를 맡았더라도, 결과는 같았을 테지요……."
41185-134 = "……또 그렇게 말을 흐릴 셈이야?"
41185-135 = "네? 방금 제가 무슨 말실수를 했나요……?"
41185-136 = "미야코, 이건 네 공적이야. RABBIT 소대의 그 누구도 아닌 네가 해낸 거라고!"
41185-137 = "그 상황에서 최적의 해를 찾아내고 소대원들을 적재적소에 배치할 수 있는 사람은 RABBIT 소대에— 아니, 이 키보토스에 너밖에 없어."
41185-139 = "맞아. 우린 그저 네 도구가 되어 움직인 것뿐이라고."
41185-140 = "미야코 쨩이 생각하는 것보다, 우린 미야코 쨩을 더 많이 믿고 있으니까……."
41185-141 = "그…… 전에 소대장으로 인정할 수 없다느니 말했던 건……"
41185-142 = "미안해. 내가 나빴어."
41185-147 = "……그렇게 말씀해 주시니 감사합니다."
41185-148 = "하지만 작전의 성공이 저의 공적이라는 말만큼은 여전히 인정할 수 없습니다."
41185-149 = "특수부대의 작전은 소대원 모두가 함께 치르는 것이니까요!"
41185-151 = "……역시 말이 안 통하는 소대장이야."
41185-152 = "그러게 말이야."
41185-154 = "이야기가 길었군요."
41185-155 = "지금도 발키리의 학생들이 저희를 뒤쫓아오고 있을 테니…… 서두르죠!"
41185-161 = "잠깐, 거기 서세요! 이 악당들!"
41185-162 = "발키리 경찰학교에 침입자가 있다고 해서 누구인가 했는데……"
41185-163 = "역시 당신들이었군요!"
41185-168 = "당신은 분명……"
41185-169 = "네! 저번의 사건 때 멋진 사격 솜씨로 당신을 제압한 생활안전국의 에이스, 키리노입니다!"
41185-170 = "공권력을 위협하고 질서를 어지럽히는 여러분 같은 불량 학생들은 본관이 용서하지 않겠습니다!"
41185-175 = "……뭔가 이상한 열혈 경찰 같은 학생이 우리 앞을 가로막았는데."
41185-176 = "……어떻게 할까, 미야코 쨩."
41185-178 = "(분명 선생님께 들은 정보에 의하면 이 학생의 사격 실력은……)"
41185-179 = "……무시합니다. 저희는 계속 집결지를 향해 이동하지요."
41185-185 = "자, 잠깐 제 목소리가 들리지 않으시는 건가요?"
41185-186 = "쏘, 쏩니다…… 지시에 불응하면 정말 쏠 거라구요?!"
41185-187 = "에잇……!"
41185-196 = "한 발도 맞지 않았네……"
41185-197 = "우으으…… 분명 지난번에는 멋지게 제압에 성공했었는데……"
41185-198 = "분하게도 눈앞에서 범죄자들을 놓쳐버리고 말았습니다……."
41185-199 = "……그나저나 후부키. 어째서 그곳에서 박스를 뒤집어쓴 채 쓰러져 있었던 건가요?"
41185-200 = "글쎄. 어째서인지 손에 들린 도넛 이외에는 기억이 안 나는데……."
41185-206 = "키리노도 도넛, 먹을래?"
41185-208 = "다음화;어른의 시간"
