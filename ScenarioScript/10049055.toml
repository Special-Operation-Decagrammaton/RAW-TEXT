[translation]
10049055-2 = "허억…… 허억……."
10049055-3 = "으윽…… 하아……."
10049055-4 = "(레이사 씨의 산탄총도, 제 섬광탄도…… 제대로 쓸 수 없었습니다.)"
10049055-5 = "(아이들이 있어서, 도저히…….)"
10049055-6 = "(무엇보다, 마음이 불안하니까 싸움에 집중할 수 없었어요…….)"
10049055-7 = "(이제는 힘도 약해서, 아무것도 지킬 수 없군요.)"
10049055-8 = "(나는, 역시…….)"
10049055-12 = "[ns] \"마시로, 위협사격이라도!\""
10049055-13 = "……죄송합니다. 선생님. 스즈미 씨, 그리고 레이사 씨."
10049055-14 = "아직 상부의 발포 허가가 나지 않았습니다."
10049055-15 = "무엇보다, 게헨나 쪽 구역이어서 개입할 수 없습니다."
10049055-16 = "죄송합니다. 정말, 죄송합니다."
10049055-17 = "정의는, 지지 않아요…… 다시, 다시……!"
10049055-25 = "그…… 그만……!"
10049055-27 = "뭐야, 이 자식들. 엄청 약하잖아?"
10049055-28 = "강한 줄 알았는데…… 괜히 경계했잖아?"
10049055-29 = "충분히 귀찮게 했으니, 날씨도 좋은데 누워서 푹 쉬라구."
10049055-30 = "……!"
10049055-34 = "뭐야, 마법소녀들이 진 거야?"
10049055-35 = "에이 설마~ 그러면 진행이 이상해지잖아?"
10049055-36 = "그런가? 그보다 액션이 진짜 같더라. 완전 생생했어."
10049055-37 = "엑?"
10049055-38 = "고, 공연……? 이걸 보고……?"
10049055-40 = "테르밋 화이트! 핑크!"
10049055-41 = "지지 마아! 맞서 싸워! 으아앙-!"
10049055-42 = "마법소녀는 정의의 편이라고 했잖아! 정의는 지지 않을 거라고 했잖아! 으아앙-!"
10049055-43 = "으앙-! 악당 미워 으아앙!!"
10049055-45 = "으…… 윽……."
10049055-46 = "몇…… 가지…… 물어만…… 보겠다고…… 했잖습니까……."
10049055-47 = "마법소녀의 슈퍼스타, 핑크는 지지 않아요……!"
10049055-49 = "(이, 이게 뭐야?)"
10049055-50 = "(애기들은 빽빽 울어대고, 이 녀석들은 그렇게 당하고도 일어나고.)"
10049055-51 = "(그리고 내가 악당? 맞긴 한…… 가? 아니 그치만…….)"
10049055-55 = "으…… 으으윽……!"
10049055-56 = "크악-! 당했다!"
10049055-58 = "대장?!"
10049055-60 = "역시 강, 강하구나 텔렐레 화이트? 그리고 핑크!"
10049055-61 = "너희들이 있는 한, 그러니까, 아!"
10049055-62 = "이 세상에 범죄는 없다-!"
10049055-68 = "갑자기 왜 그래요, 대장?!"
10049055-69 = "우리가 다 이겼잖아요!"
10049055-73 = "눈치 챙겨 임마! 우리는 우리 목표만 달성하면 되는 거잖냐!"
10049055-74 = "물건이나 챙기고 튀어! 타겟에나 집중해!"
10049055-75 = "네, 네엣!!"
10049055-76 = "너희들이 이겼다-!"
10049055-83 = "와……."
10049055-84 = "와아아아!!!"
10049055-85 = "이겼어!"
10049055-87 = "[ns1] \"자, 자! 캐스트 쉬는 시간입니다!\"\n[ns2] \"얘들아, 일어날 수 있겠니?\""
10049055-91 = "선생님……."
