[translation]
10023010-1 = "제1화;슈퍼 모모이 토네이도!"
10023010-4 = "앗! 실수했다!"
10023010-5 = "아직 할 수 있어! 다음을 노려!"
10023010-6 = "프레임 싸움에서 감히 강공격을 질렀겠다! 각오하라고!"
10023010-7 = "지금이 바로, 새롭게 연마한 비장의 필살기……!"
10023010-8 = "모모이 토네이도를 선보일 때!!!"
10023010-10 = "커맨드는 CD! A A B B C C A B C C C 캔슬!!!"
10023010-20 = "그리고! 거기에 이어서!"
10023010-21 = "왼쪽, 오른쪽, 아래!"
10023010-27 = "왼쪽, 오른쪽, 아래 플러스 AB!"
10023010-36 = "초필살, 슈퍼 모모이 토네이도!!!"
10023010-51 = "(쿵! 털썩!)"
10023010-52 = "「Player MOMORIA WIN!」"
10023010-55 = "핫핫하~! 나의 승리라고!"
10023010-56 = "길었어…… 정말로 긴 시간이었어……"
10023010-57 = "미도리에 유즈나 아리스는 물론이고, 심지어 선생님에게까지 패배를 거듭했던 지난 나날들……"
10023010-58 = "하지만 아픈 과거는 이걸로 끝이야! 이 승리를 시작으로, 나는 다시 태어나는 거야!"
10023010-59 = "그래, 오늘이야말로 '신 모모이 전설'이 시작되는 날인 거야!"
10023010-60 = "저기 말이야…… 저 학생…… 역시, 그거지?"
10023010-61 = "설마, 그 소문의, 이길 때까지 대전을 무한히 계속한다는……?"
10023010-62 = "이, 이길 때까지 라니! 그렇게까지는……"
10023010-63 = "봐봐, '이긴다'는 말에 바로 반응했어."
10023010-64 = "소문대로네… 그럼 저 애가……."
10023010-65 = "어, 설마 나, 유명인이야……!?"
10023010-66 = "<리틀 타이런트>임에 틀림없어!"
10023010-70 = "어……?"
10023010-71 = "누구야, 그게……?"
10023010-72 = "요즘 이 근처 오락실에서 소문이 자자하지!"
10023010-73 = "불리해지면 일단 아무 생각 없이 필살기를 내지르고, 맞지 않으면 맞을 때까지 다시 내지르는 오락실의 폭군!"
10023010-74 = "자기가 지면 이길 때까지 승부를 걸어오고, 그래도 화가 풀리지 않으면 기판을 확 내리치려다가 끝내 살살 툭 건들고 나가 버린다지!"
10023010-75 = "무, 무슨 소리를 하는 거야! 누가 성질이 더럽다고 그래!"
10023010-76 = "그리고 불리해지면 아무 생각 없이 필살기를 내지른다니!"
10023010-77 = "어…… 음…… 뭐, 조금은 그럴지도…… 모르…… 나?"
10023010-78 = "봐! 벌써 인터넷에 올라왔어! 오락실에 <리틀 타이런트>가 나타났다고!"
10023010-79 = "우와…… 퍼지는 속도가 장난 아닌데?"
10023010-80 = "어? 어? 뭐, 뭐야. 무슨 일이 일어나고 있는 거야……?"
10023010-84 = "이 사람들은 대체 다 뭐야─!!!"
10023010-85 = "저것 봐. 저 학생이 소문의 <리틀 타이런트>래!"
10023010-86 = "빠, 빨리 가자. 눈이 잘못 마주쳤다가는 날이 저물 때까지 다시 대전하자는 요구를 받는다는 소문이 있으니까……."
10023010-87 = "그러니까 그 <리틀 타이런트>라는 게 뭐냐고!"
10023010-88 = "애초에 난 그렇게 흉악하지도 않고, 폭력적이지도 않은 데다, 무엇보다 정상적인 게이머거든?!"
10023010-89 = "오오, 처음 뵙겠습니다. <리틀 타이런트> 님."
10023010-93 = "누, 누구?!"
10023010-95 = "그러고 보니 소개가 늦었군요. 저는 도다 메이타로라고 합니다. 메이타로라고 불러 주십시오."
10023010-96 = "본론부터 말씀드리기로 하지요. <리틀 타이런트> 님. 저는 당신들만이 해낼 수 있는 의뢰를 부탁하고 싶습니다."
10023010-97 = "아니…… 그러니까 애초에 나는……"
10023010-98 = "어려운 일은 아닙니다. 그저 청소 의뢰입니다. 아주 쉽죠."
10023010-99 = "청소……?"
10023010-100 = "네. 정말로 간단한 청소 의뢰입니다. 혹시 어려우신가요?"
10023010-101 = "아니, 뭐, 청소 정도라면야…… 그런데 청소 같은 건 누구나 할 수 있는 거 아냐?"
10023010-102 = "하지만 저는 꼭 <리틀 타이런트> 님에게 부탁드리고 싶습니다."
10023010-103 = "괜찮으시다면 의뢰와 계약을 진행하기로 하죠."
10023010-104 = "여기, 편지를 드릴 테니 정해진 날짜에 정해진 장소로 와 주시면 감사하겠습니다."
10023010-105 = "잠깐, 잠깐만!"
10023010-106 = "그러면 앞으로도 잘 부탁드립니다. <리틀 타이런트>……"
10023010-108 = "아니, C&C의 '미카모 네루' 씨."
10023010-114 = "…………어!?"
10023010-116 = "……그렇게 된 거야."
10023010-117 = "……"
10023010-121 = "……"
10023010-122 = "?"
10023010-127 = "언니……"
10023010-128 = "왜, 왜?!"
10023010-129 = "애초에 우리가 왜 네루 선배네 일을 대신해야 하는데! 어째서 자기가 네루 선배가 아니라고 제대로 말하지 않은 거야!"
10023010-130 = "나, 나도 제대로 이야기하려고 했다구! 하지만 자기 할 말만 하고, 절대로 남의 말을 안 듣는 타입이었단 말이야!"
10023010-134 = "잘은 모르겠지만, 아리스, 알았습니다! 새로운 퀘스트를 받은 겁니다! 뽜밤뽜밤!"
10023010-135 = "그, 그렇다는 말은……. 밖으로 나가야, 하는 거야……?"
10023010-137 = "으으으…… 어떡하지? 미안해, 모두……!"
10023010-138 = "내가 좀 더 확실하게 거절하기만 했어도…… 우아아앙!"
10023010-139 = "하아…… 우선, 언니. 청소 일이라는 건 확실해?"
10023010-140 = "그건 확실해. 몇 번이나 확인했으니까."
10023010-141 = "그럼 정말 청소 일이라고 치고…… 언니 말대로, 청소는 누구나 할 수 있는 일이기도 해."
10023010-142 = "단지, '사람을 부르는' 청소 일이라는 게, 보통은…… 엄청난 청소가 되기 마련이겠지만……"
10023010-143 = "도, 도와주는 거야, 미도리?!"
10023010-144 = "……어쩌겠어. 일은 멋대로 진행되어 버린 것 같고. 되돌리기도 힘들어 보이고."
10023010-145 = "가볍게 생각하면, 우리들이 네루 선배…… C&C인 척하고 청소를 하면 되는 일인 거잖아."
10023010-146 = "우와아아아앙! 언니는 이런 동생을 둬서 기뻐!"
10023010-147 = "아, 알았으니까 떨어져!"
10023010-151 = "청소…… 바깥…… 사람과의 만남…… 낯선 상대와의 이야기…… 으으, 으으으……"
10023010-152 = "괘, 괜찮아 유즈! 우리가 도와줄 테니까!"
10023010-153 = "분노…… 멸망…… 부식…… 절망…… 세계는 파멸을 향해서……"
10023010-154 = "퀘스트의 내용을 알았습니다! 청소 퀘스트인 겁니다!"
10023010-155 = "그렇게 되었으니, 선생님! 도와주라!"
10023010-156 = "[s] \"어, 나?!\""
10023010-158 = "응! 선생님이 같이 가주면, 우리 손이 닿지 않는 곳도 문제없을 거고!"
10023010-159 = "의뢰인이 뭔가 물어보면…… 임시 고문인 걸로!"
10023010-160 = "그런 구실을 만드는 건 어른들이 더 잘할 거 아냐?"
10023010-161 = "[s] \"모모이에게 어른이란 건 어떤 이미지인 거야……\""
10023010-162 = "선생님도 함께인 겁니까? 그렇다면 아리스는 아무것도 무섭지 않습니다! 마스코트가 붙어 있는 용사는 최강인 겁니다!"
10023010-163 = "저…… 정말 죄송하지만…… 선생님께서 같이 있어 주신다면…… 저도 조금은 용기를 낼 수 있을 것 같아요……"
10023010-164 = "[s1] \"이런 이런. 어쩔 수 없군.\"\n[s2] \"학생이 하려는 일을 지켜보는 건 선생님의 역할이니까.\""
10023010-165 = "정말이지, 선생님? 얏호! 믿고 있었다고!"
10023010-166 = "정말이지, 선생님? 얏호! 믿고 있었다고!"
10023010-167 = "그러면 우리의 임시 관리 감독 겸 임시 고문인 선생님에게, 가장 먼저 부탁하고 싶은 일이 있어!"
10023010-168 = "[s3] \"오, 기대되는데?\"\n[s4] \"좋아! 뭐든지 와라!\""
10023010-169 = "메이드복을 구해다 줘!"
10023010-170 = "메이드복을 구해다 줘!"
10023010-171 = "[s] \"어……?\""
10023010-173 = "토키의 오피스"
10023010-175 = "[ns] \"……그렇게 된 겁니다만.\""
10023010-176 = "그런 이유로군요. 알겠습니다."
10023010-177 = "[s] \"네루에게는 말하지 말아 줘…… 엄청나게 화낼 테니까.\""
10023010-178 = "저는 괜찮습니까?"
10023010-179 = "[s] \"어…… 으…… 토키라면, 도와줄 거라고 생각했어…… 미안.\""
10023010-180 = "……그렇군요."
10023010-181 = "안심하십시오. 비밀은 지켜드릴 테니까요."
10023010-182 = "[s] \"……나중에 어떤 식으로든 꼭 벌충할게.\""
10023010-183 = "예. 기대하고 있겠습니다."
