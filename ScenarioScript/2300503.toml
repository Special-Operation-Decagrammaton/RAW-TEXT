[translation]
2300503-1 = "달려라 아야네"
2300503-2 = "(아비도스 학교에 가니 고철더미들을 실은 트럭이 출발 준비를 하고 있었다.)"
2300503-3 = "늘 감사합니다. 아야네 씨."
2300503-4 = "후후. 네. 수고하셨어요."
2300503-5 = "이 정도면 좋은 가격이라고 생각해요. 바로 재활용 처리 센터로 보내서 용광로에 넣어버리면 됩니다. 타이밍이 좋았네요."
2300503-6 = "그럼 수고하시길!"
2300503-7 = "네! 수고하셨어요."
2300503-11 = "아, 선생님."
2300503-12 = "[s] \"방금 그건……?\""
2300503-13 = "네! 마침 오랫동안 저희랑 거래해 온 고철상 주인분이 오셔서, 출장비를 제외하고 괜찮은 값에 처분했어요."
2300503-14 = "그런데 굳이 오지 않으셔도……."
2300503-15 = "[s] 어디서 찾은 건지 물어본다."
2300503-16 = "학교 구석에 방치된 자재 창고 안쪽인데, 방수천으로 덮혀 있어서 그런 게 있는 줄도 몰랐거든요."
2300503-17 = "300kg 가까이 되는 거라 꽤 괜찮은 가격에……."
2300503-18 = "[s] 그 창고로 가보자고 한다."
2300503-19 = "네?"
2300503-20 = "네…… 뭔가 걸리는 거라도 있으신 걸까요?"
2300503-21 = "이쪽이에요."
2300503-23 = "(철컹-)"
2300503-24 = "여기예요. 폐자재들을 쌓아두는 곳이라 좀 지저분한데……."
2300503-25 = "이 방수천에 덮혀 있었어요."
2300503-26 = "[s] 방수천 안쪽을 확인한다."
2300503-27 = "방수천이라면…… 어라……?"
2300503-28 = "뭔가 쓰여져 있네요……. <취급 주의. 이 자재는 고가의 특수강철로, 습기 및 온도에 특별한 관리가 필요한……>"
2300503-29 = "고가의…… 특수강철……?"
2300503-30 = "고가……의……?!"
2300503-31 = "[s] …………."
2300503-32 = "……."
2300503-33 = "아, 안돼!!"
2300503-37 = "고철상 주인분이 연락이 안돼요!"
2300503-38 = "가게에 저, 전화도 안받아요!"
2300503-39 = "어, 어떡하지?"
2300503-40 = "[s1] \"진정해, 아야네!\"\n[s2] \"분명 방법이 있을 거야!\""
2300503-41 = "……. 네, 네!"
2300503-42 = "……. 네, 네!"
2300503-43 = "정신차려, 아야네…… 이런 위기, 언제나 있어 왔으니까……!"
2300503-45 = "일단, 현황 파악부터……!"
2300503-46 = "……하아."
2300503-47 = "(번뜩-!)"
2300503-48 = "고철상 트럭은 재활용 처리 센터로 가는 화물 기차가 정차하는 화물역으로 향할 거예요."
2300503-49 = "화물 기차에 실어버리면 그 뒤로는 추적은 불가능! 이 미션은 실패합니다!"
2300503-50 = "화물역으로 향하는 하이웨이에 진입하면 그 뒤로도 추적은 불가능!"
2300503-53 = "(타타타탁-)"
2300503-54 = "[s] \"화물역에 연락을 하는 건?\""
2300503-55 = "화물역은 무인역이라 담당자가 없어요. 그리고 지금부터 바로 출발해도 트럭이 먼저 도착합니다."
2300503-56 = "저희의 승부처는 화물역이 아니에요!"
2300503-57 = "[s] \"그, 그렇다는 건……?!\""
2300503-60 = "(타타타타탁-)"
2300503-61 = "지금까지의 고철상 아저씨의 동선을 파악해보겠습니다."
2300503-62 = "저희 학교와 장기 거래하시던 분이라, 그쪽 정보는 제가 다 기록해뒀어요."
2300503-66 = "(타타타타타타타탁-)"
2300503-67 = "……과연, 고철상 아저씨의 다음 동선은…… 평균적으로 아비도스 상점가의 대형건축자재 관리 센터였어요."
2300503-68 = "[s] \"그럼 그곳으로 가면……?!\""
2300503-69 = "……하지만! 그것은 트럭에 더 실을 짐이 있었을 경우!"
2300503-70 = "지금은 트럭에 300kg 짜리 화물이 실려있어요. 그렇다면 대형건축자재 관리 센터에서 추가로 뭔가를 더 실을 수는 없어요!"
2300503-71 = "이곳은 대형 화물 위주니까요!"
2300503-72 = "[s] \"과, 과연……!"
2300503-73 = "저기를 패스했을 때는, 아저씨의 다음 동선을 계산하면……."
2300503-74 = "……."
2300503-75 = "……찾았어요! 이곳입니다! <아비도스 중앙 공원 3지구!>"
2300503-76 = "공원 철거가 진행 중인 곳이라, 여기서 가벼운 물건을 더 실을 예정이에요!"
2300503-77 = "거기까지는 직선 거리 약 3km……. 가깝습니다!"
2300503-78 = "예측 도착 시간은 10분이내……."
2300503-79 = "[s] \"태, 택시나 자가용이라도…….\""
2300503-80 = "아뇨. 택시를 부르면 제 시간에 도착할 수 없어요."
2300503-81 = "……달립니다."
2300503-82 = "[s] \"네?!\""
2300503-84 = "트럭의 동선은 지그재그에다가 신호까지 있어요. 하지만 최적의 동선을 계산한다면 10분 안에 3km를 달려서 도착할 수 있어요!"
2300503-85 = "[s] \"……네?!\""
2300503-86 = "선생님. 지휘를 부탁드립니다."
2300503-87 = "[s] \"네?!\""
2300503-88 = "네비게이션을 확인하며 달릴 수는 없어요……. 저에게 길을 알려주세요."
2300503-89 = "그럼 출발하겠습니다!!"
2300503-91 = "(아야네가 바람처럼 사라져갔다.)"
2300503-92 = "(어쩔 수 없이 오퍼레이터 역할을 하기로 했다.)"
2300503-94 = "선생님! 사거리에 도착했어요! 어느 쪽으로 가야 하죠?!"
2300503-95 = "[s] \"오, 오른쪽!\""
2300503-96 = "네!"
2300503-98 = "하아, 하아……!! 선생님! 맞은 편 도로로 건너가야 하는데 횡단보도가 보이지 않습니다!"
2300503-99 = "[s] \"직진해서 300미터를 더 가면 육교가 있어!\""
2300503-100 = "유, 육교군요! 알겠습니다!! 하아, 하아……!!"
2300503-101 = "……꺄악?!"
2300503-102 = "(콰당탕-!)"
2300503-103 = "[s] \"무슨 일이야?!\""
2300503-104 = "아, 아무것도 아니에요! 계속 지시를!"
2300503-107 = "하아, 하아, 하아……"
2300503-108 = "평소에…… 하아…… 운동이라도…… 하아, 하아…… 해둘걸……."
2300503-109 = "도, 도착했습…… 자, 잠깐만요, 아저씨!! 하아, 하아……!"
2300503-110 = "아, 아니! 아야네 씨! 이게 무슨 일이에요!"
2300503-111 = "사고라도 당한 거예요?"
2300503-112 = "자, 잠깐…… 하아…… 하아…… 잠깐만…… 화물, 화물이……."
2300503-113 = "화……물……."
2300503-114 = "(털썩)"
2300503-115 = "아, 아야네 씨?!"
2300503-117 = "(결국 고철은 원래 지불했던 것보다 2배 더 비싸게 팔 수 있었다고,)"
2300503-118 = "(만신창이가 된 모습으로 돌아온 아야네가 희미하게 웃으며 말해주었다.)"
