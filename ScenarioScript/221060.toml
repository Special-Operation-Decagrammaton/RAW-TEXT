221060-154 = "ありがとうございます……！#nおかげで海に落ちずに済みました……！"
221060-155 = "急にサミーが目の前で滑ったので、つい焦っちゃって……。"
221060-156 = "[ns] \"掃除中の床は滑りやすいから気をつけないと。\""
