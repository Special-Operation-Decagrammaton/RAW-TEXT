[translation]
221060-1 = "第6話;好奇心は猫をも……"
221060-2 = "（翌日から、時間を見つけてはオデュッセイアに立ち寄って、#n生徒とサミーがじゃれ合う様子を見守った）"
221060-3 = "（サミーはどこに行っても可愛がられていたのだが――）"
221060-5 = ""
221060-6 = "ふぅ……洗濯おわり！"
221060-7 = "めちゃくちゃあったね……干すだけで3時間かかってるでしょ。"
221060-8 = "こんなに溜まる前にちょこちょこ洗えなかったの？"
221060-9 = "無理だって。航海中は水の使用が制限されてるんだから。#n布団を洗うなんてできなかったんだよ。"
221060-10 = "せっかく陸に戻ってきて真水を好きに使えるんだし。#n溜まった服も一気に洗っとかないと――"
221060-12 = "にゃあ～"
221060-13 = "あ、サミーだ。"
221060-14 = "や、調子はどう？"
221060-15 = "最近ぜんぜん会わないよね。見つけても昼寝してるし。"
221060-16 = "まあ仕方ないって。歳考えなよ。"
221060-17 = "にゃあん……。"
221060-18 = ""
221060-20 = "けふっ、けふっ……。"
221060-21 = "だっ、大丈夫？どこか苦しいの？"
221060-22 = ""
221060-26 = "…………。"
221060-27 = "行っちゃった。"
221060-28 = "最近のサミー、なに考えてるのか分からないんだよね。"
221060-29 = "……ていうか、大丈夫かな。"
221060-30 = "何が？"
221060-31 = "ほら……猫が咳をすると嵐が来るって話。"
221060-32 = "最近のサミー、咳してること多いし……なんか嫌な予感が……。"
221060-34 = ""
221060-37 = ""
221060-38 = "うわっ、スコールだ！"
221060-39 = "やっぱりサミーが咳したから！？"
221060-40 = "こんな話してる場合じゃないって！早く布団取り込んで！"
221060-41 = ""
221060-43 = ""
221060-44 = "せっかく洗ったのに……これじゃあやり直しだよぉ……。"
221060-48 = "クルーズ運営部旗艦「ゴールデンエリジウム」前の渡り桟橋"
221060-49 = ""
221060-50 = "はーい、注目！ちゅーもーく！"
221060-51 = "本日より改めて、賞味期限が短い食品の積み込みを開始します。"
221060-52 = "特に今日は重いものが多いので、怪我のないよう注意してください。"
221060-53 = "はい、支配人！"
221060-54 = "もしも、ふざけた拍子に落としたり、こぼしたりしたら――"
221060-55 = "私とオートマチック拳銃でロシアンルーレットをすることになりますので、#n覚悟しておいてくださいね？"
221060-56 = "……承知しました！"
221060-58 = "次は……瓶牛乳5ケース、入りまーす！"
221060-59 = "瓶牛乳5ケース、受け取り！"
221060-61 = ""
221060-64 = "……ん？#n今、何か横切らなかった？"
221060-65 = ""
221060-67 = ""
221060-68 = "にゃお。"
221060-69 = "なんだ、サミーか。"
221060-70 = "サミー、そこは手すりだから危ないよ。"
221060-71 = "最近はジャンプもつらそうじゃない。#nそんなとこで足を滑らせでもしたら――"
221060-72 = "にゃあ～"
221060-74 = ""
221060-77 = "うにゃっ！？"
221060-78 = "ちょっ、サミー！？#nそっちは――"
221060-79 = ""
221060-81 = ""
221060-83 = ""
221060-86 = ""
221060-87 = "……注意しろと、言いましたよね？"
221060-88 = "そんなに私と賭けがしたいのなら……仕方ありません。"
221060-89 = "誤解です！今のはサミーが――"
221060-90 = ""
221060-92 = ""
221060-93 = ""
221060-94 = "……サミー？もしかして、逃げた……？"
221060-95 = "うぅ……やっぱ猫が転ぶとろくなことがない！"
221060-97 = "（サミーが近くにいる時に悪いことが起きると、#nオデュッセイアの生徒は反射的に関連づけてしまうのだった）"
221060-98 = "（サミーが好奇心旺盛すぎるのも一因ではあったが……）"
221060-100 = "トライデント旗艦「ロードス号」・上部甲板前"
221060-101 = ""
221060-102 = ""
221060-103 = ""
221060-104 = "さあさあ、甲板清掃を開始します！"
221060-105 = "入港後の甲板清掃が初めての1年生も多いと思いますが、気を引き締めてください！#nこれはただの水洗いではありません！"
221060-106 = "常に潮風に晒されている甲板は、定期的に掃除しないと錆びる！#nそれすなわち戦闘力の低下に直結します！"
221060-107 = "トライデントの名誉のためにも、隅々までツヤッツヤに磨くこと！#nいいですね！？"
221060-108 = "はーい。"
221060-109 = "……てか、なんでスミカがキャプテン役なの？#nハルピュイア号と勘違いしてない？"
221060-110 = "まさか……甲板清掃が面倒だから監督役に回ろうとか思ってるんじゃ――"
221060-111 = "そんなわけないじゃないですか！"
221060-112 = "この手の集団作業は、誰かが全体の進行を監督することで、見落としなくできるんですよ！"
221060-113 = "私がその役目を買って出ることに、何か問題でも？"
221060-114 = "スミカがやる必要なくない？"
221060-115 = "やらない理由だってありません！"
221060-116 = "ほらほら！こうしてる間にも船は錆びていくんですから。#nさっさと掃除を始めますよ！"
221060-117 = "はいは～い。"
221060-122 = ""
221060-123 = "わ～！シャボン玉だ～！"
221060-124 = "粉石けん混ぜたからかな。めっちゃ泡出るね。"
221060-125 = "きれい……。"
221060-126 = "そういえば……こうやって掃除してると、決まってお客さんが――"
221060-127 = ""
221060-129 = ""
221060-130 = ""
221060-131 = "サミー！"
221060-132 = "なにさ、シャボン玉で遊びに来たの？"
221060-133 = "悪いんだけど、今は遊んでるわけじゃなくってさ。#nちょーっとどいててくれる？"
221060-136 = ""
221060-137 = "そこ、雑談してないで掃除に集中し――"
221060-138 = "にゃおっ！？"
221060-139 = "うわっ！？"
