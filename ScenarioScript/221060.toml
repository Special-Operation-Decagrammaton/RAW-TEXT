[translation]
221060-1 = "제6화;호기심이 고양이를 망친다"
221060-2 = "(다음 날부터, 시간이 날 때마다 오디세이아 학원에 들려 학생들과 새미가 어울리는 모습을 지켜보았다.)"
221060-3 = "(대부분의 경우 새미는 학생들의 귀여움을 잔뜩 받으며, 큰 문제없이 지냈지만……)"
221060-6 = "후우…… 빨래 끝!"
221060-7 = "엄청난 양의 빨래였네…… 빨래를 걷는 데만 세 시간이 넘게 걸린 것 같아."
221060-8 = "이렇게 쌓이기 전에 미리미리 빨래를 해 둘 수는 없었던 거야?"
221060-9 = "어쩔 수 없잖아. 항해 중에는 물 사용량이 제한되어 있으니까, 이런 이불 빨래는 쉽게 시도할 수 없었다고."
221060-10 = "모처럼 육지에 돌아와 청수를 마음껏 쓸 수 있게 되었으니, 이 기회에 묵은 옷을 잔뜩 빨아 둬야지―"
221060-12 = "냐아―"
221060-13 = "아, 새미 잖아?"
221060-14 = "안녕, 새미. 오늘 컨디션은 어때?"
221060-15 = "너 요새 얼굴 보기 힘들다고. 계속 낮잠만 자고. 게으름 부리는 거 아냐?"
221060-16 = "어쩔 수 없지. 새미도 나이가 있으니까……"
221060-17 = "냐앙……"
221060-20 = "켁, 켈룩. 켈룩……"
221060-21 = "갑자기 기침? 어, 어디 아픈 거야?"
221060-26 = "………."
221060-27 = "뭐야, 말도 없이 또 가버렸네."
221060-28 = "요새의 새미는 무슨 생각을 하는 지 알다가도 모르겠다니까."
221060-29 = "……그나저나 괜찮을까?"
221060-30 = "뭐가?"
221060-31 = "그…… 배 위에서는 고양이가 기침을 하면 비바람이 몰려온다는 이야기가 있잖아."
221060-32 = "요새 새미가 기침을 하는 빈도가 늘긴 했지만, 어쩐지 불길한 예감이……"
221060-38 = "우앗, 스콜이다!"
221060-39 = "저, 정말 새미가 기침을 해서 비가 내린 거야?"
221060-40 = "그런 이야기를 할 때가 아니잖아! 빨리 이불 걷어!"
221060-44 = "우으…… 모처럼 한 빨래를 처음부터 다시 해야 하게 생겼네."
221060-48 = "여객관리부 기함, <골든 엘리시움> 앞 잔교"
221060-50 = "자, 다들 주목!"
221060-51 = "항해가 모두 끝났으니 다시 오늘부터 채소와 신선 식품과 같은 유통 기한이 짧은 부식의 적재를 시작하겠습니다."
221060-52 = "특히 오늘 들어오는 부식 중에는 무거운 게 많으니까, 다치지 않도록 주의하면서 작업 부탁드립니다."
221060-53 = "네, 지배인님!"
221060-54 = "혹여라도 장난을 치다가 부식을 바다에 떨어트리거나 깨트리는 일이 발생한다면……"
221060-55 = "저와 자동권총으로 러시안 룰렛 게임을 하게 될 테니, 미리 각오해 두세요?"
221060-56 = "……알겠습니다!"
221060-58 = "다음은…… 병 우유 5 박스 들어갑니다!"
221060-59 = "병 우유 5 박스, 전달!"
221060-64 = "응? 방금 뭐가 지나간 거지?"
221060-68 = "야옹."
221060-69 = "뭐야, 새미잖아."
221060-70 = "새미. 미안하지만 그 위는 난간이라서 거기 있으면 위험해."
221060-71 = "게다가 너 요새 다리가 아파서 점프도 잘 못하잖아. 그러다가 떨어지기라도 하면―"
221060-72 = "냐아―"
221060-77 = "우냐앙?!"
221060-78 = "자, 잠깐! 진정해, 새미! 그 쪽으로 도망치면―"
221060-87 = "……분명 주의하라고 방금 전에 말씀드렸을 텐데."
221060-88 = "그렇게 저와 내기를 하고 싶으시다면, 어쩔 수가 없네요."
221060-89 = "오, 오해입니다! 억울해요! 방금 새미가―"
221060-94 = "……새미? 그 새 또 어디로 도망간 거야?"
221060-95 = "으으…… 역시 고양이가 넘어지면 꼭 나쁜 일이 생긴다니까!"
221060-97 = "(오디세이아 학생들은 나쁜 일이 생기거나, 불운한 일이 생기면 반사적으로 근처에 있던 새미를 떠올리곤 했다.)"
221060-98 = "(……물론 새미가 워낙 호기심이 많아, 이곳저곳 건드리는 물건이 많다는 점도 한 몫 했지만.)"
221060-100 = "트라이던트 기함, <로도스 호> 상부 갑판 앞"
221060-104 = "자자, 지금부터 로도스 호의 갑판 청소를 시작하겠습니다!"
221060-105 = "이 중에는 입항 후의 갑판 청소를 처음 하는 1[ruby=Assembly]학년 신참 녀석[/ruby]들도 꽤 있겠지만, 이건 단순한 물청소가 아니니까 진지하게 임하도록 하세요."
221060-106 = "소금기를 잔뜩 머금은 갑판을 주기적으로 청소하지 않으면, 장갑이 녹슬게 되고, 이는 곧 전투력 하락으로 이어지는 법!"
221060-107 = "트라이던트의 명예를 위해서라도 모두 구석구석 윤기 나게 갑판을 닦는 겁니다. 다들 알겠나요?"
221060-108 = "알겠어~"
221060-109 = "……그런데 왜 스미카가 여전히 캡틴 역할을 맡는 거야? 여긴 하르피아 호의 갑판도 아니잖아."
221060-110 = "설마, [ruby=Deck]데끼[/ruby]질 하는 게 귀찮아서 혼자 감시역으로 빠질 생각은―"
221060-111 = "그, 그럴 리가 없잖아요!"
221060-112 = "이런 갑판 청소 같은 단체 작업은 누군가가 함교 위에서 전반적으로 진행 상태를 감시하고 있어야만 놓치는 곳 없이 완벽하게 진행할 수 있는 법!"
221060-113 = "제가 그 역할을 맡는다는 데, 무슨 문제라도 있나요?"
221060-114 = "하지만 스미카가 그 역할을 맡을 필요는 없잖아."
221060-115 = "안 맡을 이유도 없거든요?!"
221060-116 = "자, 자. 이러는 시간에도 배는 조금씩 녹슬어가고 있으니까…… 빨리 청소를 시작하자고요!"
221060-117 = "네, 네~"
221060-123 = "와~ 비눗방울이다~"
221060-124 = "뭔가 가루 비누를 섞어서 그런가, 비눗방울 놀이를 하는 것 마냥 거품이 잘 나네."
221060-125 = "그러게. 예뻐라……"
221060-126 = "그러고 보니 이렇게 갑판 청소를 하고 있을 때면 꼭 찾아오는 손님이 있었지."
221060-131 = "새미!"
221060-132 = "후후, 비눗방울 놀이를 하러 온 거야?"
221060-133 = "저기, 새미. 미안하지만 지금 우리는 장난을 치는 게 아니거든? 잠시만 비켜 줄래……?"
221060-137 = "거기, 잡담하지 말고 청소에 집중해야―"
221060-138 = "냐아―?!"
221060-139 = "우, 우왓?!"
221060-144 = "[ns] \"위험해!\""
221060-150 = "[ns1] \"간신히 잡았다……\"\n[ns2] \"다치지는 않았어?\""
221060-153 = "[USERNAME] 선생님?!"
221060-154 = "가, 감사합니다…… 덕분에 물에 빠지는 건 면했네요."
221060-155 = "새미 녀석이 갑자기 눈 앞에서 미끄러지는 바람에 당황해서……"
221060-156 = "[ns] \"비누칠을 한 바닥은 미끄러우니까 조심 해야지.\""
221060-160 = "……네. 주, 주의하겠습니다."
221060-161 = "그보다…… 선생님은 괜찮으신가요?"
221060-162 = "[ns] \"그야 물론이지! 겨우 이 정도로 다치지는―\""
221060-166 = "[ns3] \"허리가 아파서……\"\n[ns4] \"힘이 안 들어가……\""
221060-170 = "……선생님!"
221060-175 = "다음화;불편한 기다림"
