[translation]
2000906-1 = "우유로 만든 권위"
2000906-2 = "(목욕을 마친 뒤, 료칸의 매점 앞에서 다시 체리노를 만났다.)"
2000906-3 = "후우. 머리가 복잡할 때 탕에 몸을 뉘고 있는 것도 생각보다 나쁘지는 않구나."
2000906-4 = "복잡한 생각이 사라지며 나른한 기분이 드는 것이……."
2000906-5 = "설마, 이것이 수행자들이 말하는 무아정적의 경지라는 것인가?"
2000906-6 = "이 몸의 위대함은 익히 알고 있었지만, 설마 어른의 계단을 넘어 성인(聖人)의 계단까지 단숨에 오르게 되었을 줄이야……."
2000906-7 = "엄청난 속도의 내적 성장에 스스로가 두려워질 정도로군."
2000906-8 = "[s] \"그럼 후르츠 밀크는 마시지 않아도 괜찮아?\""
2000906-9 = "그럴 리가 없지 않느냐!"
2000906-10 = "성인의 경지에 다다르는 것과 맛있는 음식을 먹는 건 별개라고!"
2000906-11 = "어서 그 후르츠 밀크를 이리 주게!"
2000906-17 = "[ns] 체리노에게 후르츠 밀크를 건넨다."
2000906-18 = "흐음. 평범한 흰 우유와는 달리 후르츠 밀크는 달콤한 향이 나는 것이 무척이나 먹음직스러워 보이는구나."
2000906-19 = "어디 한번……."
2000906-26 = "[wa:250]― [log=체리노 온천ND]꿀꺽, [wa:800]꿀꺽…… [wa:640]캬아~[/log]"
2000906-30 = "[wa:500]― [log=체리노 온천ND]목욕 후의 [wa:780]후르츠 밀크……[/log]"
2000906-32 = "― [log=체리노 온천ND]이것은 정말 훌륭하군![/log]"
2000906-35 = "[wa:550]― [log=체리노 온천ND]응? [wa:1000]무슨 일 있는가, [wa:710]콤라드?[/log]"
2000906-37 = "― [log=체리노 온천ND]이 몸의 얼굴에 [wa:1260]뭔가 묻은 건가?[/log]"
2000906-40 = "[wa:470]― [log=체리노 온천ND]……[wa:340]뭐? [wa:1130]입 주변에 [wa:1500]수염같은 자국이……!?[/log]"
2000906-43 = "[wa:160]― [log=체리노 온천ND]우와, [wa:610]정말이잖아? [/log]"
2000906-45 = "― [log=체리노 온천ND]우유만 마셨을 뿐인데, [wa:1740]이렇게 멋진 수염이……![/log]"
2000906-48 = "― [log=체리노 온천ND]맛있는 음료를 마셨을 뿐인데,[/log]"
2000906-50 = "― [log=체리노 온천ND]새로운 수염까지 얻을 수 있다니……[/log]"
2000906-53 = "[wa:180]― [log=체리노 온천ND]굉장하군! [wa:1160]콤라드, [wa:730]좀 더 가져오게![/log]"
2000906-55 = "― [log=체리노 온천ND]좀 더 이 후르츠 밀크를 [wa:1660]잔뜩 가져오는 거야![/log]"
2000906-58 = "으응? 벌써 수염 자국이 사라졌잖아?"
2000906-59 = "상관없지. 수염 자국은 후르츠 밀크를 마실 때마다 새로 생겨나니까."
2000906-60 = "이렇게 만든 수염은 몸에서 떨어질 염려도, 더러워질 염려도 없으니……"
2000906-61 = "앞으로는 수염 자국이 마르지 않도록 후르츠 밀크를 쉬지 않고 계속 마셔야겠어!"
2000906-63 = "(이후, 체리노는 열 병이 넘는 후르츠 밀크를 마시고 배탈이 나 밤새도록 고생을 했다고 한다.)"
