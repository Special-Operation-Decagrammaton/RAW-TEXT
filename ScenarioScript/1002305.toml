[translation]
1002305-1 = "선도부원의 가벼운 일탈"
1002305-2 = "어이, 어째서 이 '젠자이'에는 찹쌀떡이 없는 거야?"
1002305-3 = "게다가 뜨겁지도 않고, 팥 대신 망고와 얼음이 잔뜩 들어가 있잖아! 장난하는 거야?"
1002305-4 = "하, 하지만…… 이건 '단팥죽 젠자이'가 아니라, 남국 과일을 잔뜩 넣은 '빙수 젠자이'인걸요."
1002305-5 = "알게 뭐야! 우리는 뜨끈한 단팥죽이 먹고 싶다고!"
1002305-6 = "당장 팥과 찹쌀떡이 듬뿍 들어간 젠자이를 가져와!"
1002305-7 = "빙수 가게에 와서 단팥죽을 찾으셔도……."
1002305-11 = "행패는 거기까지다, 이 교칙 위반자 녀석들!"
1002305-13 = "으앗? 게헨나 선도부잖아?"
1002305-14 = "쳇, 벌써 신고가 들어간 건가!"
1002305-15 = "정면 승부로는 승산이 없어. 어서 도망치자!"
1002305-19 = "아앗, 비겁하게 도망치다니!"
1002305-20 = "거기 서라!"
1002305-26 = "이오리가 해변에서의 추격전을 시작했다……."
1002305-36 = "후우, 이걸로 한 건 해결인가."
1002305-37 = "[s1] \"수고 많았어.\"\n[s2] \"다치지는 않았어?\""
1002305-38 = "흥, 생각보다 발이 빨라서 추격하는 데 시간이 걸리긴 했지만 별거 아니었어."
1002305-39 = "흥, 생각보다 발이 빨라서 추격하는 데 시간이 걸리긴 했지만 별거 아니었어."
1002305-40 = "이 바보들은 지치지도 않는지, 하루가 멀다 하고 매일 사고를 저지르고 있으니……."
1002305-41 = "이번 하계 합숙은 해변으로 간다고 해서 모처럼 선오일도 준비했는데, 이래서야 느긋하게 일광욕을 즐길 시간도 없겠어."
1002305-42 = "[s] \"무슨 문제라도 있어?\""
1002305-43 = "아, 아무것도 아니야!"
1002305-44 = "바보들을 쫓느라 조금 지친 것 뿐이라……."
1002305-46 = "선생님, 괜찮다면 이 근처의 순찰을 부탁해도 괜찮을까? 나는 저쪽의 인적이 드문 해변가를 순찰할까 해서……."
1002305-47 = "그, 왜, 있잖아. 인적이 드문 곳이라면 바보들이 또 무슨 흉계를 꾸미고 있을지도 모르고."
1002305-48 = "선도부의 스페셜리스트로서 눈이 닿지 않는 곳까지 살펴 볼 필요가 있겠다 싶어서……."
1002305-49 = "[s] \"그럼 같이 갈까?\""
1002305-50 = "뭐?! 아니, 선생님이 올 필요는 없어. 절대로!"
1002305-51 = "나 혼자로도 충분해! 위험하니까 선생님은 이곳에서 기다려 줘."
1002305-52 = "[s] \"……알겠어.\""
1002305-53 = "정말로 이해한 거 맞지?"
1002305-54 = "선생님은 절대로 따라오면 안 돼!"
1002305-55 = "그, 그럼 나머지는 부탁할게."
1002305-59 = "[ns] 이오리를 따라간다."
1002305-62 = "(인적이 드문 바위 그늘 아래에 이오리가 누워 일광욕을 하고 있다.)"
1002305-63 = "하아…… 모처럼 바다에 왔는데, 단속만 하다가 가는 건 역시 아쉽지."
1002305-64 = "가끔은 이렇게 여유를 즐기는 것도…… 응?"
1002305-67 = "[wa:100]― 으, [wa:750]으햣?!"
1002305-71 = "[wa:100]― 어,[wa:400] 어느 틈에[wa:500] 온 거야?"
1002305-74 = "[wa:1100]― 아까 전부터[wa:600] 계속[wa:350] 지켜 보고 있었다고?"
1002305-76 = "― 이[wa:980] 변태,[wa:500] 죽어!"
1002305-79 = "[wa:300]― ……말해 두겠지만,[wa:980] 놀고 있는 게 아니니까 말이야?"
1002305-81 = "― 이것도 엄연히,[wa:1200] 풍기를 지키는 활동의 일환으로……!"
1002305-84 = "[wa:250]― ……그보다,[wa:640] 언제까지[wa:300] 지켜보고 있을 거야!"
1002305-86 = "― 빨리 어디론가 가 버려!"
1002305-89 = "……놀고 있는 거 아니었거든?"
1002305-90 = "[s] \"다시 말하지 않아도 알고 있어.\""
1002305-91 = "모처럼의 바다고, 휴식도 임무의 일부이고, 애초에 조금만 쉬다가 돌아올 생각이었는데……"
1002305-92 = "게다가 모처럼 선생님이 자외선 차단제를 사다 주었는데, 사용하지 않으면 아까우니까……"
1002305-93 = "그러니까 결국은 이것도 풍기를 지키기 위해 어쩔 수 없이—"
1002305-94 = "……아니, 내가 왜 선생님에게 변명을 하고 있는 거야?"
1002305-95 = "애초에 선생님이 따라오지만 않았어도 이런 모습을 들키지 않았을텐데……."
1002305-96 = "선생님, 진짜 싫어!"
1002305-98 = "(이오리와의 관계가 서먹해졌다…….)"
