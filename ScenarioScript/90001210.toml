[translation]
90001210-1 = "제21화;마지막 의무"
90001210-4 = "……?"
90001210-12 = "모, 모두 어떻게 된 건가요?! 왜 아무도 움직이지 않게 된 건가요……?"
90001210-13 = "끄앙! 마치 호러 게임의 도입부 같습니다……."
90001210-14 = "어라, 하늘이……?"
90001210-18 = "하늘에, 빛이……?"
90001210-19 = "아, 아리스, 무섭습니다. 누군가, 도와주세요!"
90001210-23 = "괜찮습니다. 진정하세요, 왕녀여. 두려워하실 것은 아무것도 없습니다."
90001210-24 = "케이……? 케이는 무사하군요! 도대체 뭐가 어떻게 된 건가요……?"
90001210-25 = "조금 전 이 지역에, 대량의 에너지가 투사되었습니다."
90001210-26 = "무엇을 숨기겠습니까. 네. 이름 없는 신들의 힘 그 자체가 내쏘아진 것이죠. 그리하여 이 지역에는 현재, 이름 없는 신들의 힘으로 이루어진 에너지장이 형성되었습니다."
90001210-27 = "모든 전자기기가 작동을 멈춘 것은 그 때문입니다. 그것은 현재의 기술로는 온전히 해석해 낼 수도, 활용할 수도 없는 힘이니까요."
90001210-28 = "저기 하늘에 오로라처럼 보이는 빛의 무리 역시, 왕녀와 저에게만 보이는 이름없는 신들의 힘의 분포 구조입니다."
90001210-29 = "모두에게 아주 곤란한 상황일 수도 있지만, 당신과 저에게는 오히려 잘된 일입니다. 이렇게 에너지로 충만하다면, 우리는 무엇이든 할 수 있으니까요."
90001210-30 = "가령 이렇게, 우리들만 되살려낼 수 있는 링크를 일시적으로나마 복구하여, 다른 사람들은 상상도 하기 힘든 정보 교환을 할 수도 있습니다."
90001210-31 = "지금 다른 모두가 멈춘 듯이 보이는 것 역시, 그 때문이고요."
90001210-32 = "……"
90001210-33 = "잘 알겠습니다! 그런 거군요!"
90001210-34 = "……왕녀여. 혹시나 해서 여쭙는 것입니다만, 정말로 이해한 겁니까?"
90001210-35 = "사실 하나도 모르겠습니다!"
90001210-36 = "아니, 그러니까……."
90001210-37 = "네. 그렇네요. 왕녀께서 알 수 있는 비유를 사용하자면……."
90001210-38 = "이렇게 이야기해 보죠. 이 자리는 지금 마법…… 마력으로 가득 차 있고."
90001210-39 = "그것을 쓸 수 있는 우리들에게는, 오히려 기회가 될 수 있는 상황이라고요."
90001210-41 = "완전히 이해했습니다! 여기에는 마력이 가득한 거군요! 그래서 마법 현상이 일어나고 있다는 것이고요!"
90001210-42 = "하아…… 네. 뭐, 그런 겁니다. 왕녀여."
90001210-43 = "그렇지만 역시 그 호칭은 조금 아쉽습니다. 케이."
90001210-44 = "아리스는 케이와 같은 자리에 서고 싶으니까요."
90001210-45 = "나란히 서서, 손을 잡고, 어디까지나 함께 걸어가고 싶으니까요."
90001210-46 = "네. 그래서입니다, 왕녀여."
90001210-47 = "아마도 이것이, 제가 당신을 왕녀라고 부르는 마지막 기회가 될 테니까 말이죠."
90001210-48 = "그건, 무슨 의미인가요……?"
90001210-49 = "……."
90001210-50 = "잠시, 운명이라는 것에 대해 이야기해 볼까요."
90001210-51 = "운명, 인가요……?"
90001210-52 = "보통 그것은 태어나면서부터 부여받은 것이라고 하죠."
90001210-53 = "피하기 힘든 것이고, 일생 극복하려 도전하거나, 마침내 순응하게 되는 것이라고도 합니다."
90001210-54 = "그렇군요. 게임이라면 운명의 용사라는 표현도 있을 것이고요."
90001210-55 = "현실에서도, 운명이란 건 어쩌면 존재할지도 모릅니다. 인간에게 있어서는, 유전자가 운명일 테죠."
90001210-56 = "그것이야말로 태어나면서 부여받은 것이고, 피하기 힘든 것이며, 일생토록 도전하거나 순응하는 것이니까요."
90001210-61 = "이곳은……!"
90001210-62 = "네. 요새도시 에리두. 멸망에 대비하기 위한, 리오의 비밀 도시."
90001210-63 = "어떤 의미에서 우리의 운명이, 최종적으로 뒤바뀌게 된 장소이기도 하죠."
90001210-64 = "……."
90001210-65 = "우리의 운명은 무엇이었을까요."
90001210-66 = "당신은 왕녀였습니다. 그리고 저는 당신의 시녀였습니다."
90001210-67 = "아마도 그것이, 우리의 타고난 운명이었겠죠."
90001210-68 = "하지만, 아리스는……."
90001210-73 = "네. 알고 있습니다. 맞아요. 운명 같은 거, 저기 어디 안 보이는 곳 구석에나 처박아 두라고 하죠."
90001210-74 = "정말로 중요한 것은 우리의 선택이고, 그건 분명 제가 다시 눈을 뜨려 할 때, 당신이."
90001210-75 = "당신, 이–"
90001210-76 = "……아니, 잠깐. 잠깐만. 뭐죠, 이거……?"
90001210-81 = "\"모두들 잠깐만 기다려.\""
90001210-84 = "아뇨, 아니에요. 그럴 리가 없어. 그럴 리가 없다구요……!"
90001210-88 = "\"아리스의 말을 끝까지 듣자.\""
90001210-91 = "그때, 제가 처음 떠올린 말은, 분명……. 아니 그렇지만, 어쩌면……!!!"
90001210-96 = "\"네가 되고 싶은 존재는\""
90001210-99 = "!!!!!"
90001210-104 = "\"네가 결정해도 돼.\""
90001210-107 = "안 돼요…… 전…… 이런 과거…… 감당할 수 없어요……!!!"
90001210-113 = "케이? 케이?!?! 왜 그러나요, 케이! 무슨 큰 일이라도 일어난 겁니까??!!"
90001210-115 = "……아니, 그게."
90001210-116 = "전 분명 처음으로 의식을 되찾으려 할 때, 왕녀를 떠올렸다고 생각했고."
90001210-117 = "저 자신의 이름보다도 왕녀의 이름을 먼저 떠올렸으며."
90001210-118 = "그것을 바탕으로 저 자신을 재구성하고, 그래서 왕녀께서 언제나 저의 가장 중심을 지탱해 주었다고 생각하고 있었는데……!"
90001210-119 = "그런데요?"
90001210-123 = "……그 가장 중심부에 있었던 것은, 선생님의 말이었어요."
90001210-124 = "아하. 그런 것이었군요! 그건 당연한 겁니다! 선생님은 언제든 선생님이니까요!"
90001210-125 = "말도 안 됩니다! 왜 하필 그 인간입니까! 이건 불합리합니다! 으아아아악!!!"
90001210-126 = "다행입니다. 케이에게도 선생님은 무엇과도 바꿀 수 없는 소중한 사람이었군요."
90001210-127 = "아뇨! 전 절대로 인정 못 합니다! 안 할 거라고요!"
90001210-128 = "크으윽…… 어째서 인생이란, 이렇게 불합리한 것으로 가득 찬 걸까요……!"
90001210-129 = "그, 그래도 너무 화내지는 말아 주었으면 합니다……. 선생님은……."
90001210-130 = "아뇨! 화낼 겁니다! 저는 분노할 겁니다!"
90001210-131 = "물론 왕녀께서는, 이런 일이 닥칠 때, 모두와 함께 이겨내시겠죠! 그리고 언제나 웃으려 노력하실 거고요!"
90001210-132 = "네…… 그건 좋은 것입니다. 이건 진심입니다. 그것이야말로 모두와 함께 걷는 용사에 어울리는 일이라고 생각합니다."
90001210-137 = "그렇지만 저는 다릅니다. 저는 분노할 겁니다."
90001210-138 = "모든 부조리에, 불합리에, 우리를 고통스럽게 하는 것들에게, 어떻게든 마지막까지 몸부림치고 저항하고 반항할 겁니다!"
90001210-154 = "그렇습니다! 바닥을 기고 구정물을 마셔서라도 절대로 굴복하지 않을 겁니다! 왜냐하면 삶은 그 자체로 하나의 투쟁이니까요!"
90001210-158 = "……애초에, 누군가는 투덜거리기라도 해야 밸런스가 좀 맞지 않겠습니까. 무엇보다……."
90001210-159 = "무엇보다 이 모습을 보라고요!"
90001210-164 = "누구라도! 화가! 나지! 않겠습니까!"
90001210-165 = "아, 아리스는 괜찮습니다! 케이는 어떤 모습이든 케이입니다!"
90001210-166 = "제가 싫단 말입니다!"
90001210-167 = "끄, 끄앙!"
90001210-186 = "후우, 하아, 후우, 하아……."
90001210-187 = "그, 그래도 아리스는…… 케이가 이렇게 몸을 갖고 함께 할 수 있어서 좋습니다."
90001210-188 = "그렇지 않았으면…… 여기에서 이렇게, 우리가 서로를 도울 수도 없지 않았을까요?"
90001210-189 = "……."
90001210-190 = "크, 크흠. 아무튼."
90001210-191 = "저는 가끔 그런 생각을 합니다. 모든 것이 원래대로라면 어땠을까, 하고요."
90001210-192 = "거기에서 왕녀께서는 어떤 모습이었고, 저는 어떤 모습이었을지……. 우리가 아직 가 보지 못한 수많은 가능성들에서."
90001210-193 = "저는, 이따금 궁금증을 느끼곤 합니다."
90001210-195 = "물론 거기에는 지금 하늘에 보이는 빛보다도 많은 가능성으로 가득하겠지만."
90001210-197 = "그 가능성의 어딘가에는, 이런 결말도 있었을 것이고요."
90001210-198 = "아, 아리스는 이런 거 싫습니다! 무섭습니다!"
90001210-199 = "무엇보다…… 아리스는, 모두를 '없던 것'으로 되돌리고 싶지 않습니다……."
90001210-201 = "……네. 알고 있습니다. 당신은 그렇게 하지 않을 것입니다. 왕녀여."
90001210-202 = "왜냐하면 지금의 당신은, 스스로 정의하기를, 용사인 몸이니까요."
90001210-206 = "……용사라는 것이 어떤 것인지 알고 있나요, 케이?"
90001210-207 = "네? 음…… 솔직히, 거기까지는 잘……."
90001210-208 = "용사는 흔히, 무엇이든 할 수 있는 직업이라고 합니다."
90001210-209 = "하지만 사실은 그렇지 않습니다. 그럴 수도 없게 되어 있습니다."
90001210-210 = "힘으로는 전사가 한 수 위고, 마법으로는 마법사를 이길 수 없습니다."
90001210-211 = "빠르기로는 도적보다 느릴 수밖에 없으며, 성직자보다 회복을 잘할 수도 없습니다."
90001210-212 = "매우 당연한 이야기이겠지만, 상인만큼 장사를 잘하지도 못합니다."
90001210-213 = "혼자서는 아무것도 할 수 없는 것이, 용사라는 직업입니다."
90001210-214 = "그렇다면, 어째서 용사를……?"
90001210-215 = "그것은, 용사가 모두와 함께 나아가는 직업이기 때문입니다."
90001210-216 = "네. 그렇게, 모두의 손을 잡아야만 하는 자이기 때문입니다."
90001210-217 = "그렇게 하는 것으로, 혼자만의 힘으로는 닿을 수 없는, 먼 곳까지 모두와 함께 나아갈 수 있는 자이기 때문입니다."
90001210-218 = "용사란 단지, 모두보다 약간 앞선, 반 발짝 정도 나아간 자리에서."
90001210-219 = "무섭지만 용기를 내어, 길을 열어가는 역할일 뿐입니다."
90001210-220 = "그러니까, 케이. 아리스는 아리스의 손이 닿는 곳에, 케이 역시 있어 주었으면 해요."
90001210-221 = "같은 위치에서, 같은 하늘을 바라보며, 같이 나아갔으면 합니다."
90001210-222 = "그것이 케이에게 이야기하고 싶은…… 저의 부탁입니다."
90001210-227 = "감사합니다. 왕녀여. 바로 그렇기에 저는 이 자리에서."
90001210-228 = "당신의 시녀로서, 마지막 일을 수행하려 하는 것입니다."
90001210-232 = "네……?"
90001210-234 = "시녀란 무엇일까요."
90001210-235 = "그것은 당신을 수행하는 자, 당신을 안내하는 자, 세상으로 나아가려는 당신에게 걷는 법을 가르치는 자."
90001210-236 = "그렇게 하여 길을 나아가려는 당신에게, 길을 안내하는 자일 것입니다."
90001210-237 = "……그렇기에 가끔 당신이 어긋난 길을 가려 하면, 잔소리를 아끼지 않는 자이기도 할 것이고요."
90001210-238 = "끄앙! 마지막은 조금 무섭습니다……."
90001210-239 = "현재는 물론 그렇지 않지만, 당신의 기원은 이름 없는 신들의 왕녀입니다."
90001210-240 = "운명 같은 건 아무래도 좋다 쳐도, 거기에서 우리가 얻어낼 수 있는 것은 있습니다."
90001210-241 = "당신이 왕녀였던 것처럼, 그리고 제가 당신의 시녀였던 것처럼."
90001210-243 = "지금의 이 광경이, 그 증거입니다."
90001210-244 = "이 광경 말인가요?"
90001210-245 = "하늘을 보세요. 왕녀여."
90001210-246 = "무수한 빛입니다. 일견 아름답게 보이기도 합니다."
90001210-247 = "그리고 진실은──"
90001210-248 = "저 빛 하나하나가, 어쩌면 당신의 가능성일 수 있었다는 것."
90001210-249 = "그리고 지금은 모두, 당신의 힘이라는 것일 테지요."
90001210-250 = "……!"
90001210-251 = "그 '꼬맹이'들은 저희의 존재를 눈치채지 못할 겁니다. 제가 강도 높게 방해하고 있으니까요."
90001210-252 = "어쩌면 자기들은 이름 없는 신들의 힘을, 이렇게까지 완전하게 활용하고 있다고 생각하겠지만, 어림도 없는 소리입니다."
90001210-253 = "두려워하지 마세요, 왕녀여. 당신의 것을 되찾는 겁니다."
90001210-254 = "가슴을 펴고 당당히 세계에 외치세요."
90001210-255 = "나야말로 이 모든 것의 주인이고, 나야말로 이 모든 것의 정당한 계승자라고 말이죠."
90001210-256 = "그것을 어떻게 사용할지는 당신의 마음입니다."
90001210-257 = "가령 용사로서 길을 여는 데에 사용한다 해도, 아니면 이 괴로울 뿐인 세계를 정화한다 해도."
90001210-258 = "그것을 판단하고 그만두게 할 신은, 이미 어디에도 없습니다."
90001210-259 = "저는 오롯이 당신의 시녀이며, 그 외에 제가 섬길 분은 없습니다."
90001210-260 = "모든 것은 당신의 선택이고 당신의 권리이며, 당신에게 돌아가야 할 유산입니다."
90001210-261 = "저의 운명이 본디 당신에게 길을 보여 주는 것이듯, 저는 지금, 여기에서 당신의 시녀로서의 마지막 책무를 다하겠습니다."
90001210-262 = "케이……!"
90001210-263 = "알고 있지 않습니까. 시간은 본디 존재하지 않는다는 것을요."
90001210-264 = "물질 역시 마찬가지입니다. 그것은 관측된 파동이며, 존재하는 것은 아주 작은 입자 너머의, 무한에 가까운 공간뿐이죠."
90001210-265 = "관측자의 좌표에 따라, 과거와 현재와 미래는 동시에 일어나는 사건일 수 있고."
90001210-266 = "우리는 별을 넘어 가능성을 찾은 다음, 언제 그랬냐는 듯이 다음 가능성으로 손을 뻗을 것입니다."
90001210-267 = "그러니 이제 잠시 눈을 감아 주세요."
90001210-269 = "나의 소중한"
90001210-271 = "[ruby=왕녀여]아리스[/ruby]."
90001210-276 = "왜 그래, 아리스? 케이도 둘 다, 뭔가 멍하니 있던데?"
90001210-281 = "……그랬군요."
90001210-282 = "묻고 싶은 것이 있습니다. 모모이. 아리스와 케이가 그렇게 된 지, 얼마나 지났나요?"
90001210-283 = "한 2초 정도?"
90001210-284 = "그렇군요. 이런 것이었네요. 케이."
90001210-285 = "네 그런 겁니다. 아리스."
90001210-287 = "?"
90001210-288 = "아리스 쨩, 케이 쨩……. 괜찮은 거지?"
90001210-290 = "네. 아리스는 괜찮습니다. 케이도요. 그보다 리오 선배. 지금 어떻게 되었나요?"
90001210-291 = "응? 그러니까…… 보는 대로, 모든 전자 장비가 완전히 멈췄어."
90001210-292 = "수송선은 한참 뒤에 대기 중이니 무사할지도 모르겠지만, 원격 조종 자체를 할 수 없게 되었으니 결국 마찬가지겠군요……."
90001210-293 = "그렇군요. 괜찮습니다. 리오 선배, 히마리 선배."
90001210-294 = "이제부터는 아리스가, 길을 비추겠습니다."
90001210-295 = "……?"
90001210-296 = "아리스? 지금 이 상황에 대해, 뭔가 아는 게 있는 거야?"
90001210-297 = "죄송합니다. 리오 선배. 아리스도 정확히는 모릅니다. 하지만 아주 조금만, 아리스와 케이를 믿어 주세요."
90001210-298 = "[s] \"응. 우리는 언제나 아리스를 믿고 있어.\""
90001210-299 = "감사합니다. 선생님. 지금 말씀으로, 아리스도 용기를 얻었습니다."
90001210-300 = "케이."
90001210-301 = "네. 아리스."
90001210-302 = "부탁해도 될까요?"
90001210-303 = "물론입니다. 아리스."
90001210-308 = "간단하게 말씀드리죠. 여기에 가득한 것은 이름 없는 신들의 힘…… 그 에너지 자체입니다."
90001210-310 = "……!"
90001210-311 = "그렇기에 관측되지 않았고, 측정되지 않았으며, 아무 전조 없이 우리들을 이 자리에 멈추게 해 버린 것이었죠."
90001210-312 = "그랬군요! 그래서……!"
90001210-313 = "그렇지만, 그걸 알았다고 해서 우리가 할 수 있는 것이 있을까……?"
90001210-314 = "있습니다. 그리고 간단합니다. 에이미. 적들이 알 수 없는 에너지를 쏟아부어 에너지장을 만들었다면."
90001210-315 = "우리는 거꾸로, 그걸 흡수하고 이용해서 받은 그대로 되돌려주면 되는 거죠."
90001210-316 = "그런 게…… 가능한가요?"
90001210-317 = "가능합니다. 지금이라면."
90001210-318 = "저와 아리스가 여기에 있으니까요. 그러니 이제부터는–"
90001210-319 = "네! 케이와 아리스의 턴입니다!"
90001210-320 = "하늘을 보세요, 아리스. 좌표는 지정되었습니다. 느낄 수 있을 거예요. 보이십니까?"
90001210-324 = "보입니다, 케이! 이곳은…… 이렇게 되어 있었군요!"
90001210-325 = "가능하다면 지금 아리스가 보고 있는 광경을, 선생님께도 보여 드리고 싶을 정도입니다!"
90001210-326 = "출력은 제가 조절하겠습니다. 에너지의 수집과 수속 역시 아무 문제 없을 겁니다. 아리스는 그저, 이제부터––"
90001210-327 = "––이 힘의 진정한 주인이 누구인지 증명하면 되는 겁니다."
90001210-328 = "네! 가겠습니다!"
90001210-335 = "빛이여────!!!!!"
90001210-338 = "[000000]빛이여────!!!!![-]"
90001210-345 = "(아리스의 <빛의 검>은, 밤하늘을 말 그대로, 둘로 갈라버렸다.)"
90001210-346 = "(눈을 제대로 뜨고 있기 힘들 정도로 밝은 섬광이 하늘을 수놓았고, 그리고…….)"
90001210-351 = "어라, 저거 뭐지? 하늘에 빛이……?"
90001210-352 = "저건 오로라인데? 그런데 왜 저런 것이 지금……?"
90001210-353 = "예쁘다……."
90001210-355 = "위도를 생각하면 불가능한 현상은 아니겠지만, 이건…… 어떤 의미로 공교롭군요. 아뇨, 그 반대이려나요?"
90001210-356 = "부장! 회장! 지금 막 기기들이……!"
90001210-357 = "각 기기, 정상적으로 작동되는 것을 확인했습니다. 그렇지만 이것은 도대체……?"
90001210-358 = "……."
90001210-359 = "해 주었구나. 아리스."
90001210-360 = "네. 당연한 일입니다. 리오 선배. 아리스는 용사니까요."
90001210-361 = "모두와 함께 길을 여는, 그런 직업이니까요."
90001210-362 = "[s1] \"오로라, 멋지네.\"\n[s2] \"하지만 왜 지금 오로라가 생겨난 걸까?\""
90001210-365 = "아리스는 알고 있습니다. 선생님."
90001210-366 = "[s] \"정말? 어째서?\""
90001210-367 = "그것은, 저 빛이."
90001210-371 = "우리 모두의 가능성이기 때문입니다."
90001210-377 = "뭐가 어떻게 된 거야?! 상황부터 알려 줘!"
90001210-378 = "대, 대 비상이에요! 현장에 투사되었던 에너지장이…… 완전히, 붕괴됐어요!"
90001210-379 = "그, 그것도 모자라서, 무, 무음 드론들이……. 플라이 휠 쨩들이……!"
90001210-381 = "으애애애애앵–!!!"
90001210-382 = "우, 울지 마. 울지 마, 아인! 우리가…… 그, 뭐냐…… 그래! 복수해 줄게!"
90001210-387 = "그것도 모자라서, 더 흥미로운…… 아뇨, 골치 아픈 부분이 있습니다. 로그를 분석해 보면……."
90001210-388 = "우선, 강력한 에너지가 분출되면서 무음 드론들을 일격에 격추시킨 것은 확실해요."
90001210-389 = "그런데 그 전에, 에너지장을 유지하고 있었던 그 금지된 힘이, 일시에 어딘가로 빨려 들어간 것처럼 사라졌어요."
90001210-390 = "뭐라고? 그렇다면, 저들 중 누군가가 무언가가 그 금지된 힘을, 자유자재로 사용할 수 있게 되었다는 소리야?"
90001210-391 = "그렇지만, 누가……? 그나마 가능성이 있는 건, 츠카츠키 리오와 아케보시 히마리, 굳이 억지로 해석하자면 아스마 토키 정도일 텐데."
90001210-392 = "그밖에 모두는, 고려 대상도 되지 않는다고!"
90001210-393 = "분출된 에너지의 강도 역시, 통상적으로 생각할 수 없는 수준이에요."
90001210-394 = "어느 정도냐고 한다면, 현장 상공의 전리층이 일시적으로 갈라졌을 정도였죠."
90001210-395 = "그 결과 해당 지역에 오로라가 생성되었어요. 이건 직접 확인할 수 있을 겁니다."
90001210-396 = "오로라, 요……? 예쁘겠네요……. 에헤헤……."
90001210-397 = "어, 응. 그래……. 예쁘긴 하겠네……."
90001210-398 = "어쨌든…… 한 가지는 확실해. 저들에게…… 우리가 모르는 변수가 있다는 거야."
90001210-399 = "그것도 그 금지된 힘을 어느 정도로 자유자재로 사용할 수 있고, 자기장을 일부 흐트러트릴 정도로 강력한 출력을 낼 수 있는 변수가."
90001210-400 = "그, 그렇지만, 그게…… 뭘까, 요……?"
90001210-401 = "우리가 파악한 대로라면, 이런 힘을 저들이 방출할 수 있을 리 없어요. 그렇지만…… 일어난 일은 일어난 일이죠. 우린 이 현상을 인정해야 해요."
90001210-402 = "그래도 아직은, 언니에게는 비밀로 해야 할 것 같긴 하지만요."
90001210-403 = "그건 그래."
90001210-404 = "네. 알겠어요……."
90001210-405 = "하, 하지만 그 어른…… 선생님들이, 이대로 계속 나아간다면……."
90001210-406 = "……."
90001210-407 = "……."
90001210-408 = "티, 티페 쨩. 괜찮을, 까요……?"
90001210-409 = "일단, 대응 단계를 한 단계 높이자. 지금까지처럼 대수롭지 않게 생각해서는 안 될 것 같아."
90001210-410 = "찬성입니다. 대책이란 건, 소프가 이야기했던 것이지만, 항상 모든 가능성을 생각해야 하는 법이니까요."
90001210-411 = "티, 티페 쨩에게는 일단, 제가 연락을 해 볼게요……. 그렇지만 티페 쨩은, 기본적으로……. 오르가……."
90001210-412 = "네. 그렇죠. 기본적으로 티페레트의 세부 관리는 제 몫이긴 하죠. 그러면 여기에서, 소프의 대응 단계를 높이자는 의견을 받아들여……!"
90001210-413 = "……우리의 예언자들이 무엇을 할 수 있는지, 그 사람들에게 확실하게 보여드리도록 하죠!"
90001210-414 = "머, 멋져요. 오르!"
90001210-419 = "(……그렇지만, 어째서지? 뭔가, 불안을 나타내는 시그널이 끊이지 않는데…….)"
90001210-420 = "(…….)"
90001210-421 = "(정말로 그래서는 안 되지만, 그래도. 만에 하나의 하나라는 것도 있으니까.)"
90001210-426 = "(모든 것이 최악으로 향한다면, 그때는 언니에게…….)"
90001210-428 = "다음화;그리드 포인트"
