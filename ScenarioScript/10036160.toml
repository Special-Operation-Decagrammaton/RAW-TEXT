[translation]
10036160-1 = "스쿼드가 추억을 남기는 법"
10036160-3 = "끝났다……!"
10036160-4 = "이걸로……."
10036160-5 = "정말로……!"
10036160-6 = "응, 경품 획득이야!"
10036160-11 = "축하드립니다!"
10036160-12 = "최종 단계까지 완료하신 분들은 처음이네요!"
10036160-13 = "자, 경품 목록에서 가지고 싶은 경품을 골라 주시죠!"
10036160-14 = "역시 잡지 신간인가?"
10036160-15 = "축하해, 히요리!"
10036160-16 = "제, 제가 골라도 되는 건가요?!"
10036160-17 = "애초에 그거 때문에 시작했는걸."
10036160-18 = "그, 그런가요. 그러면……."
10036160-22 = "기, 기념사진 촬영권으로 할게요……!"
10036160-26 = "하지만 히요리, 잡지 최신호 때문에 게임에 참가한 거 아니었나?"
10036160-27 = "눈치 볼 필요 없어. 원하는 걸 골라라."
10036160-28 = "이, 이게 제가 원하는 거예요……."
10036160-29 = "잡지는 한 달 지나면 또 새로운 게 나오지만…… 저희 넷이서 찍은 기념사진은 계속 간직할 수 있잖아요?"
10036160-30 = "또 언제 이런 기회가 있을지 모르니까……."
10036160-31 = "그, 그리고 지난 잡지는…… 그! 선생님께 부탁하면 어떻게든 되니까요! 네!"
10036160-32 = "아니…… 어떻게든 되는 게 아니잖아. 그건……."
10036160-33 = "그건 그렇지만. 그래도……"
10036160-37 = "……그렇네. 응, 히요리 말이 맞아."
10036160-38 = "나도 오늘의 추억을 간직하는 거, 좋다고 생각해."
10036160-39 = "헤, 헤헤, 그럼 우리 네 사람 모두 함께 찍어요……!"
10036160-40 = "이, 이쪽으로……!"
10036160-49 = "으음, 막상 기념사진이라고 하니, 어색한데……."
10036160-50 = "뭔가 포즈를 취해야 하나?"
10036160-51 = "그냥 자연스럽게 있어."
10036160-52 = "후후, 웃어 봐, 삿 쨩. 미사키도."
10036160-54 = "자, 찍습니다!"
10036160-55 = "하나, 둘, 셋!"
10036160-64 = "자, 여기 즉석 사진입니다! 인원수에 맞게 4장 뽑아 드렸습니다!"
10036160-68 = "……뭐야, 꽤 잘 나왔잖아."
10036160-69 = "그러네. 모두 웃고 있어."
10036160-70 = "응, 다들 즐거워 보여요……."
10036160-71 = "좋은 기념품이 되겠어. 고맙다, 히요리."
10036160-72 = "헤, 헤헤……."
10036160-73 = "그럼, 다음은 어디로 갈까?"
10036160-74 = "다음?"
10036160-75 = "응, 축제에는 즐길 거리가 많이 남아 있는걸."
10036160-76 = "아직 밤은 끝나지 않았다구, 삿 쨩."
10036160-78 = "그, 그렇네요! 아직 해볼 게 많이 남았어요!"
10036160-79 = "그렇죠, 미사키 씨?"
10036160-80 = "마음대로 해. 따라가 줄 테니."
10036160-82 = "좋아. 그럼…… 조금 더 즐겨보도록 할까?"
