[translation]
80000055-1 = "신성모독일까요?"
80000055-2 = "(시간에 맞춰 나가니, 분수대 앞에서 마리가 기다리고 있었다.)"
80000055-3 = "어서 오세요, 선생님! 와 주셔서 감사합니다."
80000055-4 = "……네? 무슨 일이냐고요? 아하하……. 그게……. 저……."
80000055-5 = "그……."
80000055-9 = "이, 이것 때문이에요……! 여, 여기……!"
80000055-14 = "[ns1] \"기도하는 동상!?\"\n[ns2] \"초콜릿……!?\""
80000055-15 = "도, 동상이 아니에요……! 초콜릿이에요!"
80000055-16 = "아, 알아봐 주시는군요! 역시 선생님……!"
80000055-17 = "그게……. 오늘은 발렌타인 데이라서……."
80000055-18 = "평소 감사한 분들께 초콜릿을 드리며 마음을 전하는 날이라고 들었거든요."
80000055-19 = "그래서 역시 선생님께는 꼭 드려야겠다고 생각했어요."
80000055-20 = "그런데 뭘로 드려야 할지 고민하다 보니, 이런저런 생각이 깊어져서……."
80000055-21 = "정신을 차리고 보니 어째선지……. 이걸 샀었더라고요……."
80000055-22 = "……여, 역시 좀 이상한가요……? 좀 더 평범한 초콜릿이 나았으려나……."
80000055-23 = "[s3] \"오히려 특색 있어서 좋은걸.\"\n[s4] \"이쪽이 훨씬 기억에 남을 것 같아.\""
80000055-24 = "그, 그런가요……? 그렇죠? 역시 그렇겠죠……?"
80000055-25 = "그, 그런가요……? 그렇죠? 역시 그렇겠죠……?"
80000055-26 = "……휴우우……."
80000055-27 = "감사합니다, 선생님. 그렇게 말씀해 주셔서……."
80000055-28 = "사실 많이 긴장하고 있었거든요. 이상하게 생각하시면 어떻게 하지……하고. 아하하……."
80000055-29 = "뭔가 제가 드리는 상황인데도 오히려 배려받는 느낌이 들긴 하지만……."
80000055-30 = "그래도 기뻐요. 선생님께, 제 마음을 전할 수 있어서……."
80000055-34 = "……음?"
80000055-35 = "선생님? 왜 그러세요? 초콜릿을 그렇게 빤히 쳐다보시고……."
80000055-36 = "……네?"
80000055-37 = "……어디서부터 먹어야 신성모독이 안 되냐고요?"
80000055-38 = "……."
80000055-39 = "……어……. 어라?"
80000055-40 = "어라……. 그, 그게……. 어……. 그러니까……."
80000055-41 = "머, 머리는 왠지 당연히 안되고……. 소, 손? 아, 아냐. 이것도 좀……. 어……. 옷자락?"
80000055-42 = "……자, 잠깐 그러면 나중에 머리만 남게 되는 거잖아요……!?"
80000055-43 = "어, 어떻게 해야……. 저희는 어떻게 해야……!"
80000055-45 = "(이후 마리와 함께 초콜릿을 어디서부터 먹을지 함께 고민했다.)"
80000055-49 = "(……결국 몇 시간을 고민해도 답이 나오지 않아, 그냥 먹지 말고 전시하기로 했다.)"
