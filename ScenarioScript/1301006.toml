[translation]
1301006-1 = "늦잠"
1301006-2 = "밀레니엄 <세미나> 학생 사무실"
1301006-3 = "학생들도, 선생님도, 왜 이렇게 다들 자주 지각을 하는 걸까?"
1301006-4 = "규칙적으로 자고 일어나면 지각할 일도 없을 텐데. 왜 다들 이 간단한 수칙도 지키지 못하는 건지……."
1301006-5 = "밀레니엄의 모든 학생이 교칙에 맞추어 올바르게 생활한다면, 내가 할 일도 훨씬 줄어들 텐데 말이야."
1301006-8 = "하암……. 벌써 시간이 이렇게 되었네."
1301006-9 = "더 늦게까지 깨어있다가는 샬레의 내일 아침 회의에 늦을지도 모르겠어."
1301006-10 = "빨리 일을…… 마무리하지 않으면……."
1301006-13 = "……어라? 어느새 아침이 된 거지?"
1301006-14 = "어젯밤 늦게까지 학생회 일을 하다가 깜빡 잠이 들었었나? 이런 불찰을……."
1301006-15 = "그나저나 지금 시간이……."
1301006-16 = "오전 11시?! 지, 지각이야!"
1301006-17 = "우, 우선 머리 손질부터…… 아니, 그전에 회의 자료부터……!"
1301006-20 = "샬레 집무실"
1301006-22 = "느, 늦었습니다!"
1301006-23 = "[s] \"좋은 아침, 유우카.\""
1301006-24 = "죄, 죄송합니다. 선생님. 어제 늦게까지 일을 하다가 늦잠을 자는 바람에……."
1301006-25 = "………."
1301006-26 = "저, 선생님. 오늘은 지각하지 않으셨나요?"
1301006-27 = "[s] \"응, 어제 유우카가 절대로 늦지 말라고 했잖아?\""
1301006-28 = "……죄송합니다!"
1301006-29 = "선생님께 지각을 하지 말라고 그렇게 말해놓고서는, 정작 제가 지각을 하다니…… 입이 열 개라도 할 말이 없어요."
1301006-30 = "이렇게 된 이상 선생님이 내리는 벌을 달게 받겠습니다."
1301006-31 = "자, 어떤 곤란한 일이라도 괜찮으니 제게 명령해주세요!"
1301006-32 = "[s] \"괜찮은데…….\""
1301006-33 = "아뇨, 규칙은 규칙! 제 입으로 징계를 정해 놓고서 예외를 둔다면 세미나의 회계로서 체면이 서질 않아요!"
1301006-34 = "자, 명령을!"
1301006-36 = "[s] \"그럼 유우카는 생활관에 가서 낮잠을 자고 오도록.\""
1301006-37 = "네……? 그건 벌칙이 아니잖아요?"
1301006-38 = "제대로 된 벌을 주시지 않으면 반면교사가 되지 않는다고요."
1301006-39 = "[s] \"언제나 노력하는 유우카에게 필요한 건 벌이 아니라 휴식이야.\""
1301006-40 = "하지만……."
1301006-41 = "[s] \"어떤 명령이라도 듣는다면서?\""
1301006-42 = "(한숨) ……정말, 선생님다운 명령이네요."
1301006-43 = "알겠어요. 이번만큼은 선생님의 말씀대로 휴게실에서 조금 쉬도록 할게요."
1301006-44 = "하지만 그렇다고 해서 앞으로 지각을 해도 괜찮다는 뜻은 아니에요. 앞으로도 선생님이 지각하지 않는지 엄격하게 지켜볼 거예요."
1301006-45 = "물론 저도 늦지 않을 테니까요!"
1301006-47 = "이후, 유우카가 휴게실에 자러 간 사이에 세미나의 밀린 일감을 대신 처리해 주었다."
