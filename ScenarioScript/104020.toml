[translation]
104020-1 = "제2화;저항 1"
104020-4 = "아, 아루 님…… 또다시 하늘이……."
104020-5 = "이, 이거 조금 위험할지도……."
104020-6 = "……. 흥. 서둘러, 모두."
104020-7 = "아루 쨩……?"
104020-8 = "지금 선생님이랑 카요코가 노력하고 있잖아!!"
104020-9 = "잠깐 문제가 생겼다고 우리가 허둥대고 있으면 무슨 면목으로 두 사람을 보겠어!!"
104020-10 = "아, 아루 님……!"
104020-11 = "……헤에."
104020-12 = "지금 우리가 할 수 있는 일을 하는 거야! 자, 가자!"
104020-17 = "네, 네!! 끝까지 따르겠습니다! 아루 님!!"
104020-23 = "……. 역시 중요한 순간엔 멋있단 말이지. 아루 쨩은."
104020-31 = "……. 저 너머에서 수상한 빛을 확인했습니다."
104020-32 = "데이터상으로는 아무런 반응이 없는 곳인데……."
104020-33 = "……혹시 모르니 조사해 보겠습니다."
104020-38 = "상황은?"
104020-39 = "……. 다시 성소가 현현하고 있는 것 같습니다."
104020-40 = "끄응……."
104020-41 = "선생님……. 괜찮은 걸까……."
104020-42 = "알겠어. 서두르자. 적들이 나타나는 것을 대비한다."
104020-48 = "저격수는 다음 위치로 가서 대기. RABBIT 소대장은 지휘를 부탁하지. 아리스가 없기 때문에 화력 집중은 내가 맡겠어."
104020-49 = "그래. 해보자고."
104020-50 = "네. 알겠습니다."
104020-53 = "다시 한번 알려드립니다. 모든 탑승자들은 신속히 탈출하시기 바랍니다. 앞으로 17초 후 자폭 시퀀스 기동……."
104020-54 = "히, 히마리 선배…… 이거 멈출 수 있는 거 맞지?"
104020-55 = "기, 기다려주세요……!"
104020-61 = "신속히 탈출하시기 바랍니다. 앞으로 9초 후 자폭 시퀀스 기동……."
104020-62 = "더, 더 이상은 무리……."
104020-63 = "포기하지 마!!!"
104020-67 = "리, 리오?!"
104020-68 = "천재인 너답지 않은 말이야, 히마리."
104020-72 = "9초 후 자폭 시퀀스 기동.……  9초 후 자폭 시퀀스 기동.…… 9초 후 자폭 시퀀스 기동.……"
104020-73 = "머, 멎었어……?"
104020-74 = "다차원해석 억제 기능을 이용해서 강제로 우트나피쉬팀을 정지시켜 놨어."
104020-75 = "하지만 이것도 임시방편에 불과해."
104020-76 = "그러네요. 어차피 다차원해석 억제가 끝나면 방주가 도망쳐 버릴 테니까……."
104020-77 = "그래도 잠시 시간을 벌긴 했네요."
104020-78 = "그래. 그동안 이걸 해결해야 해. 절대적 성능의 통제시스템이 여기에 있다고 해도, 반드시 공략법이 있을 거야."
104020-79 = "……. 하지만 그건 나 혼자서는 무리겠지. 모두의 도움이 필요해."
104020-80 = "……. 그건 빅 시스터인 당신답지 않은 말이네요. 리오."
104020-84 = "네. 그러네요……. 아무리 절대적인 성능의 통제시스템이라고 해도 결국 그 명령을 중계하는 통신단말기가 있어야 해요."
104020-85 = "그 단말기를 찾아서 파괴하면 이 강제 연결은 해제될 거예요."
104020-86 = "해킹에서 이길 수 없으니까 전선을 자르자는 거지? 물론 그러면 되겠지만……."
104020-87 = "네. 그건 어디까지나 임시방편, 예비 단말기도 있을 테니까 잠시 시간을 버는 것뿐이죠."
104020-88 = "하지만…… 그 사이에 우트나피쉬팀의 해킹을 복구하고, 먼저 점령했던 방주의 연산 장치의 통제권을 다시 확보하는 데 성공하면……."
104020-90 = "아트라하시스의 방주의 <자폭 시퀀스>를 재기동할 수 있어요."
104020-91 = "그래. 그리고 내가 준비한 <탈출 시퀀스>도 사용할 수 있게 돼."
104020-93 = "……."
104020-94 = "……."
104020-95 = "치 쨩! 방주의 통신단말기의 위치를 찾아줄 수 있어요?"
104020-97 = "……알겠어. 확인 중이야. 방주의 통신량을 분석해서…… 집중되는 곳을 찾으면……."
104020-98 = "그치만 하드웨어 장치의 위치라면 우리 해킹으로는 한계가 있어! 이건 우리 전문이 아냐!"
104020-99 = "네. 설계 도면과 구조도가 있어야 합니다. 그건……."
104020-103 = "……엔지니어부, 도움이 필요해."
104020-106 = "……. 그래, 들었어. 지금 찾아보는 중이야."
104020-107 = "응. 방주의 설계도를 해석 중이고…… 구조도와 방주의 3D 공간 스캔 데이터를 심층 분석해서……."
104020-108 = "네, 통신량이 가장 많은 구역부터 순서대로…… 조, 조금만 기다려 주세요!"
104020-111 = "리더……."
104020-112 = "그래. 나도 불안해. 하지만……."
104020-113 = "응. 믿고 기다리자."
104020-114 = "……."
104020-118 = "끄응……."
104020-123 = "킥킥킥…… 긴장하지 마라."
104020-124 = "누, 누가 긴장했다는 거야!!"
104020-138 = "하아…… 하아……."
104020-139 = "[ns] \"아니, 아직 끝난 게 아니야.\""
104020-140 = "……. 응. 아직, 아직이야."
104020-141 = "……."
104020-143 = "찾았어, 여기야! 해킹 신호는 이곳을 통해 전달되고 있어!"
104020-144 = "치히로. 지금 위치 전달할게! <사르칼리샤리의 회랑>이라는 곳이야!"
104020-145 = "방주 최하층의 섹터예요!!"
104020-147 = "위치 확인했어! 지금 네비게이션 데이터로 전환해서 전송할게!"
104020-148 = "저걸 파괴하면 우트나피쉬팀과 방주의 강제 연결이 해제될 거야!"
104020-150 = "네. 확인했어요. 방주 최하층 섹터의 <사르칼리샤리의 회랑>. 여기서부터 약 1200미터를 내려가야 하네요."
104020-151 = "그런데 저 섹터의 보안 시스템을 해제하는 게 꽤 복잡해!! 지금부터 방법을 설명할 테니까……."
104020-152 = "저에게 주세요!"
104020-157 = "……확인했어요!!"
104020-158 = "벌써?!"
104020-159 = "정리할게요. 방주 최하층 <사르칼리샤리의 회랑>의 통신단말기에 도착하려면, 먼저 그 앞을 가로막고 있는 거대 방벽부터 열어야 해요."
104020-160 = "지금 우트나피쉬팀은 해킹당한 상태. 여기서는 그 방벽을 여는 건 불가능해요."
104020-161 = "유일한 방법은 방주의 각 동쪽 끝 섹터와 서쪽 끝 섹터에 위치한 해제 장치 두 개를 동시에 파괴하는 거예요."
104020-162 = "그러면 방벽이 약 5초 정도 열릴 거예요! 그 안에 통신 단말기를 파괴하면 돼요!"
104020-163 = "5초라고……?"
104020-164 = "시간이 없어요! 지금 바로 팀을 세 개로 나눠서 움직여야 해요. 방주의 동쪽과 서쪽, 그리고 최하층으로!!"
104020-165 = "……동쪽과 서쪽은 어떻게든 한다고 해도 문제는 최하층이에요. 1200미터 거리를 이 시간 안에 간다는 건……."
104020-167 = "……후후후후후."
104020-174 = "후우카 씨, 드디어 때가 왔습니다."
104020-175 = "응? 무슨 때? ……설마 내가 생각하는 그건 아니지?"
104020-176 = "물론 그거 맞습니다. 후우카 씨. 드디어 후우카 씨의 재능이 세상에 빛날 순간이 와 버린 거죠."
104020-180 = "저는 알고 있습니다. 후우카 씨가 얼마나 오랫동안 자신의 재능을 갈고 닦아왔는지……."
104020-181 = "매일 매일 훈련하고 개선하고 실패를 반복해 온 그 노력, 그 집념이 어느 정도인지……."
104020-182 = "네!! 그 재능을, 그 노력을, 그 실력을 유감없이 발휘할 때가 온 것입니다!! 이것이야말로 운명!!"
104020-183 = "즉, 운전 말이죠~★"
104020-184 = "맞아!! 급양부장이 세상에서 제일 잘하는 거! 바로 그거잖아!"
104020-185 = "그래, 지금 이 상황에서 최고의 전문가라면 후우카밖에 없으니까."
104020-190 = "저기, 하루나? 이거 일부러 그러는 거지? 그렇지?"
104020-191 = "그런 건 중요하지 않습니다! 후우카 씨는 사실 지금 이걸 위해서 이 배에 타고 있었던 거니까요!!"
104020-192 = "우주 식량 아니었어?"
104020-194 = "아무튼!! 그거 파괴하는 건 우리가 맡을 테니까!!"
104020-195 = "그래! 나머지는 방벽을 열어줘!!"
104020-197 = "오케이 알겠어. 이해했다구."
104020-198 = "그래! 그럼 동쪽의 비상 해제 장치는 우리가 맡을게."
104020-199 = "네! 여기서 저희가 제일 가깝거든요!"
104020-200 = "얼른 해치우자고!! 빨리 선생과 시로코 쨩을 도우러 가야 하니까!!"
104020-201 = "네! 제가 오퍼레이트하겠습니다! 가시죠!"
104020-204 = "네! 그럼 서쪽 끝은 저희가 맡겠습니다!"
104020-205 = "게임개발부?!"
104020-206 = "네, 네! 저희라면 빠르게 거기까지 도달할 수 있을 거예요……."
104020-207 = "알겠어! 그럼 내가 가이드할게!"
104020-209 = "좋아, 가자!"
104020-213 = "어, 언니 같이 가……!!"
104020-218 = "아리스, 괜찮은 거죠?"
104020-219 = "네! 문제없습니다!"
104020-220 = "아, 그리고 아리스가 만들었던 <빛의 검: 아트라하시스의 슈퍼 노바>는 아직 부서지지 않고 있습니다."
104020-221 = "……그 이름으로 확정인 거군요?"
104020-222 = "네. 혹시 모르니까 히마리 선배가 확인해 주시면 좋을 것 같습니다. 어쩌면……."
104020-223 = "네, 어쩌면 도움이 될 수도……. 알겠어요. 제가 가서 볼게요. 그럼 아리스. 몸조심하세요."
104020-224 = "네!"
104020-228 = "준비됐나요, 후우카 씨?"
104020-230 = "하아…… 어쩌다가 왜 이런 짓까지……."
104020-231 = "우리도 탑승 완료~"
104020-232 = "두근두근하네요, 지금부터 와장창★ 하러 가는 거죠?"
104020-233 = "다 탔으면 빨리 출발해!! 시간 없다고!"
104020-234 = "하아…… 1200미터 아래까지 가는 거지……? 뭐, 늘 하던 대로 배달한다고 생각하고……."
104020-235 = "그럼 출발하시죠, 후우카 씨. 그리고 모든 것을 성공시킨 후 마지막에 엄지 척-! 을 하는 겁니다!"
104020-236 = "아니, 그딴 거 하지마. 하면 화낼 거야. 진짜로."
104020-238 = "그럼 간다아아아---!!"
104020-251 = "우와아아아아--------!!!"
104020-253 = "다음화;저항 2"
