[translation]
10002050-1 = "제5화;수영 배우기 1"
10002050-2 = "자, 다음은 수영이에요! 바다에 왔으니 당연히 수영을 해봐야겠죠."
10002050-3 = "으음. 그런데 그냥 수영하는 사진을 찍는 것도 좋겠지만……"
10002050-5 = "여기엔 '수영 배우기'라고만 적혀 있네요. '배우기'니까 모르는 사람을 가르치는 거려나……"
10002050-6 = "호, 혹시 수영할 줄 모르시는 분 계신가요?"
10002050-7 = "저는 일단 모르지는 않아서……."
10002050-8 = "그럴 리가. 바다에 온 적이 없을 뿐, 전투 수영이라면 수도 없이 해 왔어."
10002050-9 = "저도 딱히…… 바다 수영도 해 본 적이 없는 것도 아니고요."
10002050-14 = "……."
10002050-16 = "……."
10002050-17 = "[s1] \"츠루기도 모른다는 표정은 아닌 거 같아\"\n[s2] \"아무래도 다들 할 줄 아는 모양인데.\""
10002050-18 = "으으…… 그런……"
10002050-19 = "으으…… 그런……"
10002050-20 = "그럼 이 리스트는 처음부터 실현 불가능한 리스트였단 말인가요……!? 그럴 수가……!"
10002050-21 = "……!"
10002050-22 = "그렇군. 역시 이런 식으로 함정을 파 놓았을 거라고 생각했지."
10002050-23 = "종종 있는 일이야. 쓰고 난 장기말을 버리기 위해, 일부러 성립 불가능한 임무를 주고선, 임무 실패 따위를 운운하겠지."
10002050-24 = "잘도 이런 악랄한 짓을……!"
10002050-25 = "아, 아뇨. 역시 그런 건 아니라고 생각하긴 하지만……"
10002050-26 = "……으음…… 그래도 역시 곤란하네요."
10002050-28 = "……네! 사진만 찍으면 되는 거니까…… 그냥 못하는 척만 해도 상관없지 않을까요……?"
10002050-29 = "음, 그렇군. 리스트 내용은 '수영 배우는 장면을 찍는다'이지 '수영을 배운다'가 아니니까."
10002050-30 = "독에는 독인 건가. 훌륭한 방책이야, 히후미. 지금 바로 실행하면 되겠어."
10002050-31 = "여기에 문제는 없는 거겠지, 감시역?"
10002050-32 = "네? 저 말입니까?"
10002050-33 = "뭐…… 별로 상관없지 않을까요. 아무래도……."
10002050-34 = "좋아. 그럼 감시관의 허가도 떨어졌겠다. 곧바로 진행해 볼까."
10002050-35 = "자, 누가 수영 못하는 연기를 할 거지? 그러고 보니, 그럼 가르쳐 주는 역할은 누구야?"
10002050-36 = "네?"
10002050-37 = "그, 그야 물론 선생님이겠죠. 여기서는……?"
10002050-38 = "[s] \"……저요?\""
10002050-39 = "아, 죄송해요. 혹시 곤란하셨나요? 그치만 역시 '가르쳐 준다'는 말 때문에 자연스레……"
10002050-40 = "[s] \"……아냐. 나라도 괜찮다면. 도와줄게.\""
10002050-41 = "고맙습니다, 선생님!"
10002050-43 = "네. 허리쯤 되는 깊이의 물에서 선생님이 손을 잡아 주시면……"
10002050-44 = "배우는 척 하기로 한 분이, 그 손을 잡고 적당히 수영하는 척 물장구 치는 거예요."
10002050-45 = "후후. 어렵지 않죠?"
10002050-46 = "좋아요, 그럼 이제 수영 못하는 척 할 역할을 정해야 하는데……"
10002050-50 = "……? 어라? 다들 어디 갔죠?"
10002050-56 = "아~. 수영을 못해서 물에 빠질 것 같아요~. 도와주세요~. 선생님~."
10002050-57 = "긴급 재난상황. 지원을 요청한다. 반복한다. 긴급 재난상황. 지원을 요청한다."
10002050-58 = "쿠헤학! 어푸! 어푸! 쿠허아아각! 켁켁케헥!! 케헤악-!!!"
10002050-59 = "아…… 어라?"
10002050-60 = "[s3] \"다들 열심히 연기하는 걸.\"\n[s4] \"일단 한 명은 진짜 물에 빠진 것처럼 실감나네.\""
10002050-61 = "저기…… 다들 어째서……."
10002050-62 = "저기…… 다들 어째서……."
10002050-64 = "(타타타타타타타탕-!!)"
10002050-65 = "꺄앗?!"
10002050-70 = "저것 봐, 저 녀석들! 이유는 모르겠지만 물에 빠져서 허우적거리고 있다고!"
10002050-71 = "나이스 타이밍이군! 왜인지는 모르겠지만 기회야!"
10002050-72 = "이 자식들, 아까 전엔 잘도 우리한테 덤볐겠다!"
10002050-73 = "야! 애들 다 끌고 와!"
10002050-82 = "……푸……? 흐……?"
10002050-84 = "……응?"
10002050-89 = "……?"
10002050-90 = "……어라."
10002050-92 = "그러고보니 저기…… 수심이 무릎 정도였던가……?"
