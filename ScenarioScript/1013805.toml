1013805-97 = "ฉะ... ฉันแค่มีเผื่อไว้เฉยๆ น่า! แค่มีติดตัวไว้!"
1013805-98 = "พอให้โอมาโมริอันผิดไป ก็รู้สึกผิดอยู่นะ"
1013805-99 = "งั้นคุณครูรออยู่ตรงนี้เดี๋ยวหนึ่งนะ ฉันจะรีบไปเอาอันใหม่มาให้!"
