[translation]
1013805-1 = "收下這個！"
1013805-2 = "（到了下午，按照約定去了狂獵學院）"
1013805-4 = ""
1013805-5 = "啊，老師。"
1013805-6 = "真的來了呢。"
1013805-7 = "這段時間沒發生什麼事吧？"
1013805-8 = "有沒有突然失眠，或者感覺到莫名的寒意之類的……"
1013805-9 = "[s] 「這倒是沒有，怎麼了嗎？」"
1013805-10 = "沒有啦……只是姑且確認一下而已。"
1013805-11 = "因為前輩們一直吵說，如果看到幽靈可能會出現那種症狀。"
1013805-12 = "唉……這到底是什麼跟什麼啊。"
1013805-13 = "總之這個給你。"
1013805-14 = ""
1013805-16 = ""
1013805-17 = ""
1013805-19 = "是我做的御守。"
1013805-20 = "本來只想隨便買一個的，可是前輩們說必須親手做才行……"
1013805-21 = "雖然不知道像我這種不相信神秘學的人做的有沒有效，不過有總比沒有好吧。"
1013805-22 = "來，拿去。"
1013805-23 = "[s] 「哦哦，手藝很厲害呢？刺繡也是自己繡的嗎？」"
1013805-24 = "當然囉，這種程度對我來說不算什麼。"
1013805-25 = "[s] 「我很喜歡！我會好好珍惜的！」"
1013805-26 = ""
1013805-28 = ""
1013805-29 = "[ns] 「白白收下禮物也有點不好意思，我請你吃點好吃的吧？」"
1013805-30 = "咦？老師要請客嗎？"
1013805-31 = "嗯，我要吃。我正好有想吃的零食！"
1013805-32 = "[s] 「像是巧克力香蕉可麗餅之類的？」"
1013805-33 = "……你，你怎麼知道！？"
1013805-34 = "我沒有每天都吃哦？"
1013805-35 = "只，只是剛好想吃而已！"
1013805-36 = "[s1] 「我知道我知道。那我們走吧。」\n[s2] 「我也正好想吃呢。」"
1013805-39 = "老師也喜歡巧克力香蕉可麗餅嗎？"
1013805-40 = "[s] 「嗯！喜歡！」"
1013805-41 = ""
1013805-43 = ""
1013805-44 = ""
1013805-45 = "唔，唔唔……果，果然是在捉弄我吧。"
1013805-46 = "算了，總之快走吧。"
1013805-47 = ""
1013805-49 = ""
1013805-50 = ""
1013805-51 = "（正要進入附近的店裡的時候……）"
1013805-52 = ""
1013805-54 = ""
1013805-55 = ""
1013805-56 = ""
1013805-57 = "（感覺好像踩到了奇怪的東西，一看才發現是口香糖……）"
1013805-58 = "嘔……誰吐了這麼大一塊啊。"
1013805-60 = "（趕緊去除了口香糖）"
1013805-61 = "[ns] 「好，進到店裡去吧。」"
1013805-65 = "這，這次又怎麼了！？"
1013805-66 = "[ns5] （玻璃門碎了……）\n[ns6] 「我明明只是輕輕推了一下門而已……！？」"
1013805-69 = "啊……門上不是寫著「拉」嗎？"
1013805-70 = "總之既然把門弄壞了，就要請您負起賠償的責任。"
1013805-71 = "[s] 「對，對不起！」"
1013805-73 = "（賠償完之後，本來打算按照計劃購買巧克力香蕉可麗餅……）"
1013805-74 = "（結果卻在輪到我們的時候剛好賣完了……）"
1013805-75 = "（就在帶著遺憾離開咖啡廳時……）"
1013805-76 = ""
1013805-80 = "（又因為踩到別人丟的香蕉皮而滑倒了）"
1013805-81 = ""
1013805-82 = "這是怎麼回事……？#n為什麼壞事會突然接連發生……？"
1013805-83 = ""
1013805-85 = ""
1013805-86 = ""
1013805-87 = "老師，剛才給你的御守借我看一下。好像有點奇怪。"
1013805-88 = ""
1013805-90 = ""
1013805-91 = ""
1013805-92 = "啊啊啊……！！"
1013805-93 = "[ns] 「怎麼了？」"
1013805-94 = "因，因為我一次做了好幾個的關係……好像不小心把沒放內容物的那個送給你了！"
1013805-95 = "難怪我一直有種不太對勁的感覺。就是因為這樣才會衰事連連啦！"
1013805-96 = "[s] 「明明不相信神秘學……卻很相信御守呢。」"
1013805-97 = "只，只是為了以防萬一啦！以防萬一！"
1013805-98 = "而且把不完整的東西送出去，我心裡也覺得不太舒服。"
1013805-99 = "總之我馬上換另一個給你，等我一下！"
1013805-100 = ""
1013805-102 = ""
1013805-104 = "（過了一會……）"
1013805-107 = ""
1013805-108 = ""
1013805-109 = "好……！這個就沒問題了，拿去吧！"
1013805-110 = ""
1013805-112 = ""
1013805-114 = ""
1013805-115 = "（裡面摸起來確實有東西，不過不知道是什麼）"
1013805-116 = "以防萬一先告訴你，不可以打開來看哦。"
1013805-117 = "聽說御守要是被打開的話，效果就會減弱的。"
1013805-118 = "知，知道了吧？絕對不能打開哦？"
1013805-119 = "[s] 「嗯！知道了！」"
1013805-120 = ""
1013805-122 = ""
1013805-124 = "（之後抱著姑且一試的心態，和玲奈一起走進了附近的另一家店）"
1013805-125 = "（結果那裡居然有賣巧克力香蕉可麗餅）"
1013805-126 = "（而且似乎還是最近才開始販售的新商品……）"
1013805-128 = "那我就開動囉，老師！"
1013805-129 = ""
1013805-131 = ""
1013805-132 = ""
1013805-133 = ""
1013805-134 = "（也許這就是小確幸的開始吧）"
