1013805-69 = "อ่า... ที่ประตูเขียนไว้ว่าให้ <ดึง> นะครับ"
1013805-70 = "ในเมื่อคุณลูกค้าทำประตูพัง ก็ต้องชดเชยค่าเสียหายให้ทางร้านครับ"
1013805-71 = "[s] \"ทะ.. ทำผิดไปแล้ว!\""
1013805-73 = "(หลังจากจ่ายค่าชดเชยเสร็จแล้ว คุณครูก็จะไปซื้อเครปช็อกโกบานาน่าตามที่ตั้งใจไว้)"
