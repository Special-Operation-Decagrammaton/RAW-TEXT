[translation]
1013805-1 = "Take This!"
1013805-2 = "As promised, I arrived at Wildhunt that afternoon."
1013805-5 = "Ah, Sensei."
1013805-6 = "You really came."
1013805-7 = "How are you feeling?"
1013805-8 = "You know... Are you sleeping all right? Any sudden shivers or...night terrors?"
1013805-9 = "[s] \"Nothing like that. Why?\""
1013805-10 = "It's nothing... I was just curious."
1013805-11 = "My roommates keep yapping about the \"consequences\" of seeing a ghost, signs of being haunted, things like that."
1013805-12 = "*sigh* How annoying."
1013805-13 = "Here."
1013805-19 = "It's an omamori I made. You know, a protective amulet."
1013805-20 = "I was just going to buy one, but my seniors insisted that I make one myself."
1013805-21 = "I don't know if it'll protect you from anything, since I made it, and I don't believe in the occult, OBVIOUSLY, but it can't hurt, right?"
1013805-22 = "Take it."
1013805-23 = "[s] \"Oh, this is so intricate. Did you embroider this yourself?\""
1013805-24 = "Of course. It was easy."
1013805-25 = "[s] \"I really like it! I'll treasure it forever!\""
1013805-29 = "[ns] \"I feel guilty just taking this from you. Would you like a...treat, perhaps?\""
1013805-30 = "Are you buying? Ha..."
1013805-31 = "Yeah! There's actually a snack I've been eager to try."
1013805-32 = "[s] \"Like a...chocolate-banana crepe?\""
1013805-33 = "...H-How did you know?"
1013805-34 = "I don't crave it all the time, you know?"
1013805-35 = "I-I just happened to be in the mood today!"
1013805-36 = "[s1] \"Sure. Let's get going.\"\n[s2] \"I could go for one too.\""
1013805-39 = "Really, Sensei? You also enjoy chocolate-banana crepes?"
1013805-40 = "[s] \"Yes! Just like you!\""
1013805-45 = "U-Ugh... I-I knew it. You're teasing me..."
1013805-46 = "Well, whatever. Let's go."
1013805-51 = "And just as I was about to enter the store..."
1013805-57 = "...I stepped on something. I pulled my shoe up to see a massive piece of gum."
1013805-58 = "Gross... That's a big one."
1013805-60 = "I quickly scraped off the sticky goo."
1013805-61 = "[ns] \"L-Let's go inside.\""
1013805-65 = "Wh-What was that?!"
1013805-66 = "[ns5] \"(The glass door shattered...)\"\n[ns6] \"But I barely pushed it...?\""
1013805-69 = "Sensei... It says \"PULL.\""
1013805-70 = "I'm sorry, but you need to cover the replacement cost."
1013805-71 = "[s] \"I-I'm so sorry!\""
1013805-73 = "After paying the damages, we tried to buy the chocolate-banana crepes."
1013805-74 = "...But they sold out right before we arrived."
1013805-75 = "And, as we departed the cafe in disappointment..."
1013805-80 = "...I slipped and fell on a banana peel someone left on the sidewalk!"
1013805-82 = "What's going on...? Why are all these bad things happening?"
1013805-87 = "Sensei. Hand me the omamori I gave you earlier. Something's off."
1013805-92 = "A-Ahh...!!!"
1013805-93 = "[ns] \"What's wrong?\""
1013805-94 = "I-I made them in bulk... A-And I think I gave you an empty one! It was a mistake!"
1013805-95 = "I knew something was weird. No wonder you've been cursed with bad luck!"
1013805-96 = "[s] \"So you don't believe in the occult...but you DO believe in omamori.\""
1013805-97 = "I-It's just in case! Only a precaution."
1013805-98 = "I'm so sorry I gave you an empty one."
1013805-99 = "Hold on for a minute. I'll get you a new one. A good one!"
1013805-104 = "A short while later..."
1013805-109 = "Here...! This one's fine! Take it!"
1013805-115 = "I felt something inside it, but I couldn't tell what it was."
1013805-116 = "Just in case you didn't know...you can't peek inside."
1013805-117 = "They say that an omamori loses its power once you open it."
1013805-118 = "G-Got it? No matter what, you CANNOT OPEN IT."
1013805-119 = "[s] \"Okay! I understand!\""
1013805-124 = "To test it out, Rena and I tried going to a different cafe."
1013805-125 = "They were selling chocolate-banana crepes!"
1013805-126 = "And the chef said that they only recently added them to their menu!"
1013805-128 = "Wonderful. Thank you, Sensei!"
1013805-134 = "Perhaps my luck had turned around."
