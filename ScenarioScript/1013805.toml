1013805-94 = "เฮ้อ น่าจะเพราะฉันทำหลายชิ้นพร้อมกัน... ก็เลยสะเพร่าจนหยิบชิ้นที่ไม่ได้ใส่อะไรไว้ข้างในมาให้!"
1013805-95 = "ก็ว่าอยู่ว่ามันแปลกๆ วันนี้คุณครูเจอแต่เรื่องโชคไม่ดีทั้งวันเลย!"
