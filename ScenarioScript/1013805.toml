[translation]
1013805-1 = "รับนี่ไปสิ!"
1013805-2 = "(หลังจากวันนั้น คุณครูก็แวะไปที่ไวลด์ฮันต์อีกครั้งตามนัด)"
1013805-4 = ""
1013805-5 = "อ๊ะ คุณครู"
1013805-6 = "มาที่นี่จริงๆ ด้วยนะ"
1013805-7 = "ระหว่างนั้นไม่ได้มีเรื่องอะไรใช่มั้ย?"
1013805-8 = "ก็อย่างเช่น จู่ๆ อาการนอนไม่หลับก็แย่ลง หรือรู้สึกหนาวสั่นโดยไม่มีสาเหตุ..."
1013805-9 = "[s] \"ไม่มีเรื่องแบบนั้นนะ ทำไมเหรอ?\""
1013805-10 = "เปล่าหรอก... ฉันแค่ลองถามเฉยๆ น่ะ"
1013805-11 = "ก็พวกรุ่นพี่น่ะสิ เอาแต่พูดว่าถ้าไปเห็นผีมา ก็อาจเจอผลข้างเคียงแบบนั้นได้"
1013805-12 = "เฮ้อ ทำไมฉันต้องมาทนทำอะไรแบบนี้ด้วยนะ"
1013805-13 = "แต่ก็เอาเถอะ รับนี่ไปสิ"
1013805-14 = ""
1013805-16 = ""
1013805-17 = ""
1013805-19 = "นี่คือโอมาโมริที่ฉันทำเอง"
1013805-20 = "ตอนแรกฉันก็ว่าจะหาซื้อโอมาโมริดีๆ สักอัน แต่พวกรุ่นพี่ก็บอกว่าต้องทำขึ้นมาเอง..."
1013805-21 = "ฉันน่ะไม่เชื่อเรื่องรหัสยศาสตร์สักนิด แล้วก็ไม่รู้ด้วยว่าทำเองแล้วจะได้ผลจริงหรือเปล่า แต่มีไว้ก็คงดีกว่าไม่มีละนะ"
1013805-22 = "เอ้า คุณครูก็เอาไปสิ"
1013805-23 = "[s] \"โอ้ ฝีมือใช้ได้เลยนะเนี่ย? ปักลายเองด้วยเหรอ?\""
1013805-24 = "ก็ต้องทำเองทั้งหมดอยู่แล้ว เรื่องแค่นี้น่ะ สำหรับฉันมันเรื่องกล้วยๆ"
1013805-25 = "[s] \"ครูชอบมากเลย จะรักษาไว้อย่างดีเลยละ!\""
1013805-26 = ""
1013805-28 = ""
1013805-29 = "[ns] \"งั้นให้ครูซื้ออะไรอร่อยๆ เป็นการตอบแทนของชิ้นนี้มั้ย?\""
1013805-30 = "โอ้ คุณครูจะเป็นเจ้ามือเหรอ?"
1013805-31 = "อื้อ เอาสิ ฉันมีของว่างที่อยากกินอยู่พอดี!"
1013805-32 = "[s] \"เครปช็อกโกบานาน่าน่ะเหรอ?\""
1013805-33 = "ระ... รู้ได้ยังไงน่ะ?"
1013805-34 = "ฉันไม่ได้กินทุกวันสักหน่อย?"
1013805-35 = "กะ... ก็แค่รู้สึกอยากกินขึ้นมาน่ะ!"
1013805-36 = "[s1] \"อื้อ งั้นก็ไปกินกันเถอะ\"\n[s2] \"ครูก็อยากกินอยู่พอดีเลย\""
1013805-39 = "คุณครูก็ชอบเครปช็อกโกบานาน่าเหมือนกันเหรอ?"
1013805-40 = "[s] \"อื้อ! ชอบสิ!\""
