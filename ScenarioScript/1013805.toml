[translation]
1013805-1 = "이거 받아!"
1013805-2 = "(그날 오후. 약속대로 와일드헌트 학원을 찾아갔다.)"
1013805-5 = "아. 선생님."
1013805-6 = "정말로 와줬네."
1013805-7 = "그동안 별일 없었지?"
1013805-8 = "갑자기 수면 장애가 심해졌다거나, 원인을 알 수 없는 한기가 느껴졌다거나……."
1013805-9 = "[s] \"딱히 그런 일은 없었는데, 왜?\""
1013805-10 = "아니…… 그냥 혹시나 하고 물어봤어."
1013805-11 = "선배들이 유령을 보면 그런 부작용이 있을지도 모른다고 하도 떠들어 대서."
1013805-12 = "에휴. 이게 진짜 무슨 고생인지."
1013805-13 = "아무튼 이거 받아."
1013805-19 = "내가 만든 오마모리야."
1013805-20 = "그냥 적당히 아무거나 사려고 했는데 직접 만들어야 한다고 선배들이 그래서……."
1013805-21 = "오컬트를 안 믿는 내가 만들어서 효과가 있을지 모르겠지만, 없는 것보단 낫겠지."
1013805-22 = "자. 가져가."
1013805-23 = "[s] \"오오, 솜씨가 대단한데? 자수도 직접 놓은 거야?\""
1013805-24 = "당연하지. 이 정도는 나한테 아무것도 아니라고."
1013805-25 = "[s] \"정말 마음에 들어! 소중히 간직할게!\""
1013805-29 = "[ns] \"그냥 받기는 미안하니까, 뭐 맛있는 거라도 사줄까?\""
1013805-30 = "오, 선생님이 사주는 거야?"
1013805-31 = "응. 먹을래. 마침 먹고 싶은 간식이 있었어!"
1013805-32 = "[s] \"초코 바나나 크레이프라든가?\""
1013805-33 = "……어, 어떻게 알았어?"
1013805-34 = "맨날 먹진 않는다니까?"
1013805-35 = "그, 그냥 먹고 싶어졌을 뿐이니까?!"
1013805-36 = "[s1] \"그래. 어쨌든 가자.\"\n[s2] \"나도 먹고 싶었던 참이었어.\""
1013805-39 = "선생님도 초코 바나나 크레이프, 좋아해?"
1013805-40 = "[s] \"응! 좋아해!\""
1013805-45 = "으, 으으으…… 여, 역시 날 놀리는 거잖아."
1013805-46 = "뭐, 됐어. 아무튼 빨리 가자."
1013805-51 = "(그렇게 근처의 가게 안으로 들어가려는 순간…….)"
1013805-57 = "(뭔가 이상한 걸 밟은 것 같아 확인해 보니 껌이었다…….)"
1013805-58 = "으엑…… 누가 엄청 큰 걸 뱉어 놨네."
1013805-60 = "(일단 서둘러서 껌을 떼어냈다.)"
1013805-61 = "[ns] \"이, 이제 가게로 들어가자.\""
1013805-65 = "이, 이번엔 또 뭐야?!"
1013805-66 = "[ns5] (유리문이 부서졌다…….)\n[ns6] \"난 그저 문을 가볍게 밀었을 뿐인데……?\""
1013805-69 = "아…… 문에 <당기시오>라고 쓰여 있었잖아요."
1013805-70 = "아무튼 문을 부수셨으니, 변상을 해주셔야겠습니다."
1013805-71 = "[s] \"죄, 죄송합니다!\""
1013805-73 = "(그렇게 변상을 마친 뒤 계획대로 초코 바나나 크레이프를 사려 했다.)"
1013805-74 = "(하지만 우리 바로 직전에 매진되어 버렸다…….)"
1013805-75 = "(아쉬운 마음으로 카페를 나오는데…….)"
1013805-80 = "(누군가가 버린 바나나 껍질을 밟고 넘어져 버렸다.)"
1013805-82 = "갑자기 뭐지……? 왜 안 좋은 일이 연달아……."
1013805-87 = "선생님. 아까 내가 줬던 오마모리 다시 줘 봐. 뭔가 이상해."
1013805-92 = "아, 아아앗……!!"
1013805-93 = "[ns] \"왜 그래?\""
1013805-94 = "하, 한꺼번에 여러 개 만들었더니…… 시, 실수로 내용물을 빠뜨린 걸 줬나 봐!"
1013805-95 = "뭔가 이상하더라. 이러니까 안 좋은 일이 연달아 일어나지!"
1013805-96 = "[s] \"오컬트는 안 믿지만…… 오마모리는 믿고 있구나.\""
1013805-97 = "호, 혹시나 해서 그러는 거야! 혹시나!"
1013805-98 = "잘못된 걸 줬으니 내 기분도 찝찝하고."
1013805-99 = "아무튼 금방 다른 걸로 바꿔올 테니까 잠깐만 기다려!"
1013805-104 = "(잠시 후…….)"
1013805-109 = "자……! 이건 괜찮아! 이걸로 가져가!"
1013805-115 = "(만져보니 확실히 안에 뭔가 들어있는 것 같은데…… 뭔지는 모르겠다.)"
1013805-116 = "혹시나 해서 하는 말이지만, 그거 열어보면 안 돼."
1013805-117 = "오마모리는 열어보는 순간 효과가 떨어진다고 하니까."
1013805-118 = "아, 알겠지? 절대 열면 안 되는 거다?"
1013805-119 = "[s] \"응! 알겠어!\""
1013805-124 = "(이후 혹시나 하는 마음에 레나와 근처의 다른 가게에 들어가 보았다.)"
1013805-125 = "(그곳에서는 초코 바나나 크레이프를 팔고 있었다.)"
1013805-126 = "(원래는 팔지 않았는데 최근 개시했다고 한다…….)"
1013805-128 = "그럼 잘 먹을게, 선생님!"
1013805-134 = "(어쩌면 이것이 작은 행운의 시작일지도 모르겠다.)"
