[translation]
1013805-1 = "收下這個！"
1013805-2 = "（到了下午，按照約定去了狂獵學院）"
1013805-5 = "啊，老師。"
1013805-6 = "真的來了呢。"
1013805-7 = "這段時間沒發生什麼事吧？"
1013805-8 = "有沒有突然睡眠障礙變嚴重，或者感覺到莫名的寒意之類的……"
1013805-9 = "[s] 「沒有特別的，怎麼了？」"
1013805-10 = "沒什麼……只是以防萬一問問。"
1013805-11 = "前輩們一直嚷嚷說看到幽靈可能會有那種症狀。"
1013805-12 = "唉……這都是什麼苦差事啊。"
1013805-13 = "總之這個給你。"
1013805-19 = "是我做的御守。"
1013805-20 = "本來想隨便買一個，但前輩們說得要自己做……"
1013805-21 = "不相信神秘學的我做的不知道有沒有效果，但總比沒有好吧。"
1013805-22 = "來，拿去。"
1013805-23 = "[s] 「哦哦，手藝很厲害呢？刺繡也是自己繡的嗎？」"
1013805-24 = "當然，這種程度對我來說不算什麼。"
1013805-25 = "[s] 「我很喜歡！我會好好珍惜的！」"
1013805-29 = "[ns] 「只是這樣收下有點不好意思，要不要請你吃點好吃的？」"
1013805-30 = "咦？老師要請客嗎？"
1013805-31 = "嗯，我要吃。我正好有想吃的零食！"
1013805-32 = "[s] 「巧克力香蕉可麗餅之類的？」"
1013805-33 = "……你，你怎麼知道！？"
1013805-34 = "我沒有每天都吃哦？"
1013805-35 = "只，只是剛好想吃而已！"
1013805-36 = "[s1] 「好，我知道，總之走吧。」\n[s2] 「我也正好想吃。」"
1013805-39 = "老師也喜歡巧克力香蕉可麗餅嗎？"
1013805-40 = "[s] 「嗯！喜歡！」"
1013805-45 = "唔，唔唔……果，果然在捉弄我吧。"
1013805-46 = "算了，總之快走吧。"
1013805-51 = "（正要進入附近的店裡的時候……）"
1013805-57 = "（好像踩到了什麼奇怪的東西，一看是口香糖……）"
1013805-58 = "呃……誰吐了這麼大一塊。"
1013805-60 = "（先趕緊把口香糖弄掉）"
1013805-61 = "[ns] 「好，進店裡吧。」"
1013805-65 = "這，這次又是什麼！？"
1013805-66 = "[ns5] （玻璃門碎了……）\n[ns6] 「我只是輕輕推了一下門而已……！？」"
1013805-69 = "呃……門上寫著「請拉」。"
1013805-70 = "總之您弄壞了門，需要請您賠償。"
1013805-71 = "[s] 「對，對不起！」"
1013805-73 = "（就這樣賠償完之後，原本按計劃是要買巧克力香蕉可麗餅的……）"
1013805-74 = "（但是到我們的時候剛好賣完了……）"
1013805-75 = "（帶著遺憾離開咖啡廳的時候……）"
1013805-80 = "（踩到了別人丟的香蕉皮滑倒了）"
1013805-82 = "突然怎麼了……？為什麼壞事接連發生……？"
1013805-87 = "老師，把剛才我給你的御守拿出來看看。好像有點奇怪。"
1013805-92 = "啊啊啊……！！"
1013805-93 = "[ns] 「怎麼了？」"
1013805-94 = "一，一次做了好幾個……結果，好像不小心把沒放內容物的給你了！"
1013805-95 = "就覺得有點奇怪，難怪壞事接連發生！"
1013805-96 = "[s] 「不相信神秘學……但相信御守呢。」"
1013805-97 = "這，這是以防萬一！以防萬一！"
1013805-98 = "給錯了我心裡也不舒服。"
1013805-99 = "總之我馬上換另一個給你，等我一下！"
1013805-104 = "（過了一會……）"
1013805-109 = "好……！這個沒問題！拿著！"
1013805-115 = "（摸了摸裡面確實好像有東西……不知道是什麼）"
1013805-116 = "以防萬一說一下，那個不能打開。"
1013805-117 = "據說御守一打開效果就會減弱。"
1013805-118 = "知，知道了吧？絕對不能打開哦？"
1013805-119 = "[s] 「嗯！知道了！」"
1013805-124 = "（之後抱著試試看的心態，和玲奈進了附近的另一家店）"
1013805-125 = "（那裡有賣巧克力香蕉可麗餅）"
1013805-126 = "（本來沒有賣，據說是最近才開始賣的……）"
1013805-128 = "那我開動了，老師！"
1013805-134 = "（也許這就是小確幸的開始吧）"
