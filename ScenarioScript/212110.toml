212110-161 = "마코토 씨가 불쌍하니까…… 이부키가 스위치를 올리면, 마코토 씨 아파하니까……."
212110-165 = "[log=???][ff4444]저건 쓰레기랍니다, 이부키. [-][/log]"
212110-167 = "[log=???][ff4444]통제를 따르지 않고 체제에 반항해서[-][/log]"
212110-169 = "[log=???][ff4444]유급까지 하게 된 쓰레기.[-][/log]"
212110-172 = "아, 아니야…… 사람이야. 쓰레기 아니야……."
212110-176 = "쿨럭, 쿨럭…… 왜…… 생각대로 안 되나, 뇌제? 키시싯."
212110-183 = "큭……!! 머, 머리가……"
212110-184 = "마, 마코토 선배……!!"
212110-185 = "괜찮아? 이부키가 미안해…… 미안해……."
212110-190 = "……."
212110-191 = "아아, 아니다…… 이부키."
212110-192 = "별거 아니야. 그냥, 갑자기 두통이 조금 있었을 뿐이다."
212110-193 = "괜찮은 거야……?"
212110-194 = "물론이지. 너는 잘못이 없다. 미안할 일은 아무것도 없어."
212110-195 = "……그래. 너는 어떤 죄도 없다."
212110-200 = "네가 원하고, 네가 하고 싶은 일을 해라. 이부키."
212110-201 = "그거면 된다."
212110-205 = "……그러면, 이부키는 마코토 선배 옆에 있고 싶어."
212110-206 = "……."
