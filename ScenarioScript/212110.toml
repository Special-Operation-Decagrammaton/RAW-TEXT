[translation]
212110-1 = "제11화;옆에 있고 싶어"
212110-8 = "……."
212110-9 = "……해서, 진격로는……."
212110-10 = "마코토 선배……."
212110-14 = "이부키, 무슨 일이냐. 지금은 많이 바쁜데……."
212110-15 = "……많이 바빠……?"
212110-16 = "으음. 아무래도 일손이 없다 보니 처리해야 할 일들이 잔뜩 쌓여서 말이다."
212110-17 = "이후에 이야기하자꾸나."
212110-18 = "……으응. 알겠어."
212110-23 = "사츠키 선배~"
212110-27 = "치아키 선배~"
212110-31 = "……."
212110-32 = "……아무도 없어……."
212110-33 = "이로하 선배는…… 정말 만마전 이제 안 하는 걸까……."
212110-34 = "이부키는 이로하 선배랑 계속 같이 있고 싶은데……."
212110-39 = "이부키."
212110-43 = "와아~ 이로하 선배다~!!"
212110-44 = "이로하 선배, 만마전에 다시 온 거야? 이부키 너무 좋아!"
212110-45 = "아…… 그건 아니에요."
212110-46 = "으응? 아니야……?"
212110-47 = "이로하 선배, 아직 완장 갖고 있어서…… 이부키는 이로하 선배가 다시 만마전에 온 줄 알았어."
212110-48 = "……이건……."
212110-52 = "그러게요. 저도 왜 아직 이걸 갖고 있는지 모르겠지만……"
212110-53 = "이부키, 저는 마코토 선배가 다시 예전처럼 돌아오기 전까지는 만마전에 돌아가지 않을 거예요."
212110-54 = "……마코토 선배는…… 요즘도 계속 이상한데……."
212110-55 = "……."
212110-56 = "이부키는 어떻게 지내고 있나요?"
212110-57 = "사실 이부키가 걱정돼서 와봤어요."
212110-58 = "응, 이부키는~~ 엄~청 잘~~"
212110-62 = "……"
212110-63 = "……잘 지내고 있는 게 아니군요."
212110-64 = "으응…… 다들 많이 바빠."
212110-65 = "이로하 선배가 나가고, 마코토 선배가 열심히 일하고 있거든."
212110-66 = "만마전 부실에서 다른 사람들이랑 막 뭔가를 하고 있어. 작전?"
212110-67 = "무슨 작전이랑, 계획이랑, 이런 거 엄청 하고 있어."
212110-68 = "그래서 이부키랑 잘 안 놀아 줘. 피곤해 보이구……."
212110-69 = "……."
212110-70 = "사츠키 선배랑, 치아키 선배도 요즘 부실에 잘 없어."
212110-71 = "그래서, 이부키 외로워."
212110-72 = "……역시, 그랬군요."
212110-73 = "이부키, 저와 함께 있을래요?"
212110-74 = "응? 정말??"
212110-75 = "네. 만마전은…… 더 이상 이부키에게 좋은 환경이 아닌 것 같아서요."
212110-76 = "말한 것처럼 항상 바쁘고, 돌봐줄 사람도 없다면 더더욱요."
212110-77 = "저와 함께 가면 머리도 빗어주고, 같이 책도 읽어드릴게요."
212110-78 = "와아~ 이부키, 이로하 선배가 머리 빗어주는 거 제일 좋아해!"
212110-79 = "……후후. 네."
212110-80 = "하지만……"
212110-84 = "그럼, 마코토 선배는 혼자 있게 돼."
212110-85 = "……."
212110-86 = "이로하 선배, 이부키는 혼자 있으면 외롭다는 걸 알아."
212110-87 = "그러니까, 마코토 선배는 지금 많이 외로울 거야."
212110-88 = "……그렇겠네요."
212110-89 = "응. 이부키는……"
212110-90 = "마코토 선배랑 같이 있을게."
212110-91 = "……괜찮겠어요?"
212110-92 = "응. 이부키 씩씩하니까. 이부키 잘 있을 수 있어."
212110-93 = "이부키의 마음이 그렇다면…… 알겠어요."
212110-94 = "이로하 선배, 마코토 선배가 예전처럼 돌아올 때까지 잘 지내고 있어."
212110-95 = "그다음에 꼭 만마전으로 다시 오는 거야. 알겠지?"
212110-96 = "……네. 그렇게 할게요."
212110-101 = "약속!"
212110-106 = "약속."
212110-116 = "……."
212110-117 = "후우…… 이제야 한숨 돌리겠군."
212110-122 = "……마코토 선배, 이제 바쁜 거 끝났어?"
212110-123 = "아아. 이부키."
212110-124 = "말도 마라. 어찌나 할 일이 많은지 모르겠군."
212110-125 = "이로하 녀석, 평소에는 이런 것들을 묵묵히 처리하고 있었던 건가……."
212110-126 = "흥, 없는 녀석 이야기를 해봤자 의미 없지."
212110-127 = "마코토 선배, 이로하 선배 보고 싶어?"
212110-128 = "하! 누가 그렇다고 하더냐?"
212110-129 = "이쯤은 이로하 녀석이 없더라도 이 몸 혼자 처리할 수 있다는 것이다."
212110-130 = "평소 일은 안 해도 실무 정도야 완벽하게 파악하고 있으니 말이다. 키시싯."
212110-131 = "일 말고, 그냥 보고 싶지 않냐는 거였는데?"
212110-135 = "…………."
212110-136 = "……이부키는 요즘 마코토 선배가 많이 외로워 보인다고 생각했어."
212110-137 = "……그렇지 않다."
212110-138 = "이 하누마 마코토 님은 오는 이 막지 않고, 가는 녀석 붙잡지 않아."
212110-139 = "특히나 지금처럼 중요한 시기에 반기를 든 녀석이라면 더더욱 말이지."
212110-140 = "그리고 지나치게 뛰어난 지도자의 고립감은 필연적인 것. 너는 아직 모를 것이다, 이부키."
212110-141 = "으응. 이부키는 그렇게 어려운 건 잘 몰라……."
212110-142 = "그치만 반항하는 건 멋있는 거라고 했었어, 마코토 선배가."
212110-146 = "……내가?"
212110-147 = "응. 마코토 선배가 그렇게 말했었는데."
212110-151 = "……반항. 반항이라."
212110-152 = "……."
212110-153 = "……아아."
