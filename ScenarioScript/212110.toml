[translation]
212110-1 = "第11話;そばにいたい"
212110-8 = "……。"
212110-9 = "……それで、進撃路は――"
212110-10 = "マコト先輩……。"
212110-14 = "イブキ、どうした。今は忙しいのだが……。"
212110-15 = "……すごく忙しいの？"
212110-16 = "うむ。どうにも人手が足りなくてな。処理すべき仕事が山積みなのだ。"
212110-17 = "話は後にしてくれ。"
212110-18 = "……わかった。"
212110-23 = "サツキ先輩～"
212110-27 = "チアキ先輩～"
212110-31 = "……。"
212110-32 = "誰もいない……。"
212110-33 = "イロハ先輩は……ほんとに、もう帰ってこないのかな……。"
212110-34 = "イブキは、ずっと一緒にいたいのに……。"
212110-39 = "イブキ。"
212110-43 = "わあ～！イロハ先輩だ～！！"
212110-44 = "帰ってきてくれたの？イブキ、すっごくうれしい！"
212110-45 = "あ……それは違います。"
212110-46 = "え……？"
212110-47 = "でもイロハ先輩、まだ腕章つけてるよね……？"
212110-48 = "これは……。"
212110-52 = "自分でもどうしてまだ持っているのか分かりませんけど……。"
212110-53 = "マコト先輩が元通りになるまでは、万魔殿に戻るつもりはありません。"
212110-54 = "マコト先輩、ずっと変なまま……。"
212110-55 = "……。"
212110-56 = "イブキはどう過ごしていましたか？"
212110-57 = "心配で様子を見に来たんです。"
212110-58 = "イブキはね、すっごく元気に――"
212110-59 = "……。"
212110-62 = "……。"
212110-63 = "……元気に過ごせているわけではなさそうですね。"
212110-64 = "うん……みんな、すっごく忙しそう。"
212110-65 = "イロハ先輩が出ていっちゃってから、マコト先輩も一生懸命お仕事してる。"
212110-66 = "他の人たちといろいろやってるの。"
212110-67 = "作戦とか、計画とか、そういうのをいーっぱい。"
212110-68 = "だから疲れてるみたいで……イブキともあんまり遊んでくれない。"
212110-69 = "……。"
212110-70 = "サツキ先輩とチアキ先輩も、最近はあんまり来てないんだ。"
212110-71 = "だから、イブキさみしい。"
212110-72 = "……予想通りでしたか。"
212110-73 = "イブキ、私と一緒に来ますか？"
212110-74 = "え？ほんとに？"
212110-75 = "はい。万魔殿は……もうイブキにとって良い環境じゃない気がするんです。"
212110-76 = "ちゃんと見てくれる人もいないのならなおさら。"
212110-77 = "私と一緒に来れば髪をとかしてあげますし、本も読んであげますよ。"
212110-78 = "わあ～！イブキ、イロハ先輩に髪とかしてもらうのが一番好き！"
212110-79 = "……ふふ。はい。"
212110-80 = "でも……。"
212110-84 = "そしたら、マコト先輩がひとりぼっちになっちゃう。"
212110-85 = "……。"
212110-86 = "ひとりだとさみしいって、イブキ知ってるんだ。"
212110-87 = "マコト先輩……すごくさみしいと思う。"
212110-88 = "……そうですね。"
212110-89 = "だから、イブキはね――"
212110-90 = "マコト先輩と一緒にいる。"
212110-91 = "……大丈夫ですか？"
212110-92 = "うん。イブキ、つよいもん。おりこうにしてられるよ！"
212110-93 = "イブキの気持ちがそうなら……分かりました。"
212110-94 = "イロハ先輩、マコト先輩が元に戻るまで、ちゃんと待っててね。"
212110-95 = "それで、絶対に万魔殿に戻ってくるの。いい？"
212110-96 = "……はい。そうします。"
212110-101 = "約束！"
212110-106 = "約束です。"
212110-116 = "……。"
212110-117 = "ふぅ……ようやく一息つけそうだ。"
212110-122 = "……マコト先輩、もう忙しいの終わった？"
212110-123 = "ああ、イブキ。"
212110-124 = "1つ山場を越えただけだ。まだまだ終わりは見えんな。"
212110-125 = "イロハのやつはこんなものを黙々と処理していたのか……。"
212110-126 = "ふん、いないやつの話をしても仕方あるまい。"
212110-127 = "マコト先輩、イロハ先輩に会いたい？"
212110-128 = "はっ！誰がそんなことを言った？"
212110-129 = "この程度、私ひとりでも処理できるということだ。"
212110-130 = "普段は仕事をしていないからといって、実務も完璧に把握しているのでな。キシシッ。"
212110-131 = "違うよ。イブキは、会いたい？って聞いたの。"
212110-135 = "…………。"
212110-136 = "……最近のマコト先輩、すごくさみしそう。"
212110-137 = "……そんなことはない。"
212110-138 = "この[ruby=はぬま]羽沼[/ruby]マコト様は、来る者拒まず、去る者追わずだ。"
212110-139 = "特に今のような大事な時に反旗を翻した者であれば、なおさらな。"
212110-140 = "なにより、優れた指導者とは孤独なものだ。お前にはまだ分からぬだろうがな。"
212110-141 = "うん……イブキ、そういう難しいのはよく分かんない……。"
212110-142 = "でもマコト先輩、前に言ってたよね？反抗はかっこいいことだって。"
212110-146 = "……私が？"
212110-147 = "うん。"
212110-151 = "……反抗。反抗か。"
212110-152 = "……。"
212110-153 = "……ああ。"
212110-158 = "[log=???][ff4444]イブキ、どうして命令に従わないのですか？[-][/log]"
212110-161 = "マコトさんがかわいそうだから……#nイブキがスイッチを上げたら、マコトさん痛がるから……。"
212110-165 = "[log=???][ff4444]あれはゴミですよ、イブキ。[-][/log]"
212110-167 = "[log=???][ff4444]統制に従わず、[-][/log]"
212110-169 = "[log=???][ff4444]体制に反抗して留年までしたゴミ。[-][/log]"
212110-172 = "ち、違うよ……ゴミじゃない……。"
212110-176 = "ごほっ、ごほっ……キシシッ、どうした雷帝？#n……思い通りにならんのか？"
212110-183 = "くっ……！頭が……。"
212110-184 = "マコト先輩……！！"
212110-185 = "マコト先輩……大丈夫……？#nごめんなさい……イブキが……。"
212110-190 = "……。"
212110-191 = "ああ、いや……違うんだ。"
212110-192 = "大したことではない。少し頭痛がしただけだ。"
212110-193 = "大丈夫……？"
212110-194 = "もちろんだ。お前は悪くない。謝る必要なんて何ひとつない。"
212110-195 = "……そうだ。お前には何の罪もない。"
212110-200 = "お前が望むことを、お前がしたいことをやればいい。"
212110-201 = "それでいいのだ。"
212110-205 = "……だったら、イブキはマコト先輩のそばにいたい。"
212110-206 = "……。"
212110-207 = "……ああ。"
212110-212 = "そうしよう。"
212110-214 = "次回;応援してくれる、先生？"
