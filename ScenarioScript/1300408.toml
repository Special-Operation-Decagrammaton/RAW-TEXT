[translation]
1300408-1 = "건강해지는 거예요"
1300408-2 = "아비도스 학교 운동장"
1300408-3 = "아, 오셨네요, 선생님!"
1300408-4 = "여기, 아령이에요."
1300408-5 = "어디보자…… 5kg짜리가 20개, 10kg짜리가 10개, 20kg짜리는 5개……."
1300408-6 = "……네? 이렇게 많은 줄 몰랐다고요?"
1300408-7 = "어라……. 그러고보니까 시로코 쨩도 비슷한 얘기를 했던 거 같은데……."
1300408-8 = "으응…… 제가 너무 많이 산 걸까요. 체력 단련에 아령이 얼마나 필요한지 잘 몰라서……."
1300408-9 = "5kg 짜리 하나면 된다고요? 그, 그렇군요……."
1300408-10 = "그럼 나머지는 아비도스 학교 체육관에다가 놔둬야겠어요."
1300408-11 = "지금은 거의 쓰이지 않고 있지만…… #n나중에 학교가 다시 정상화되었을 때 사용할 수 있었으면 좋겠네요."
