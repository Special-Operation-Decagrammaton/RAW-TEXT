[translation]
2004106-1 = "비밀 장소"
2004106-3 = "(거리를 걸으며, 리오와의 통화 내용을 떠올려 보았다.)"
2004106-5 = "이야기한 바 있지만, 내 아지트는 여러 곳이고."
2004106-6 = "나는 그중 한 곳에, 선생을 초대하는 거야."
2004106-7 = "……어떻게 보면 우리 둘만 공유하는 비밀의 장소라고도 할 수 있겠네."
2004106-8 = "보안상의 문제는 없어. 그건 내가 장담할 수 있어."
2004106-9 = "그 대신…… 그렇네. 만일 이 장소가 들키게 된다면."
2004106-10 = "그건 어떻게 보아도, 선생이 누군가에게 이 장소를 이야기한 것이겠지?"
2004106-11 = "후후. 그때는 적절한 보상을 요구하도록 하겠어."
2004106-12 = "물론 나는 선생을 믿고 있지만 말이야."
2004106-13 = "[s] \"하는 김에 조금만 더 선생님을 믿어 주셨으면 합니다…….\""
2004106-14 = "응. 알았어."
2004106-15 = "그러면, 기대할게."
2004106-17 = "(리오가 가르쳐 준 임시 번호로, 전화를 걸었다.)"
2004106-22 = "서, 선생?! 왜 지금……?"
2004106-23 = "어? 벌써 이런 시간이 된 거야?! 하, 하루 종일 커튼을 쳐 두었던 탓인가……!"
2004106-24 = "세, 세상에. 어떡하지, 나……?"
2004106-25 = "[s] \"왜 그래, 리오? 무슨 일이라도 있어?!\""
2004106-26 = "아, 아니야! 아무 일도 없어! 그렇지만……!"
2004106-34 = "(리오에게 무슨 일이 생겼다고 생각해서, 걸음을 서둘렀다!)"
2004106-43 = "[ns] \"리오!\""
2004106-45 = "서, 선생?! 왜 이렇게 빨리……."
2004106-46 = "아, 아니. 분명 제시간에 왔지만, 그렇지만……."
2004106-47 = "[ns1] \"하이고야…….\"\n[ns2] \"이거 방 안을 보니, 리오가 왜 그랬는지 알겠네…….\""
2004106-50 = "으, 읏……."
2004106-51 = "[ns] \"어디~ 보자~ 이건 편의점 도시락 용기고~\""
2004106-52 = "으, 응……."
2004106-53 = "마, 맞아. 그건 음료수병이고, 거기 있는 건 빈 생수 통이고……."
2004106-59 = "아니야! 그건 쓰레기 아니야! 실험 장치와 시약이니까! 그 옆에 있는 건 공구들이고!"
2004106-60 = "……."
2004106-61 = "미안해, 선생……. 정말, 미안해……."
2004106-62 = "난 내가…… 치울 수 있을 줄, 알았어……."
2004106-63 = "[s] \"전에는 누가 어떻게 치웠니……?\""
2004106-64 = "그, 그때는…… 토키가 이것저것……."
2004106-65 = "[s] \"그럴 수 있지, 그럴 수 있어.\""
2004106-66 = "워, 원래 이런 것도 하나하나 배워야 하는 거라고?"
2004106-67 = "그리고 선생도, 어디 가서 잘 치우고 다닌다는 소리는 못 듣는 편이라고……?"
2004106-68 = "그렇, 구나……."
2004106-73 = "어, 어디 가려는 거야. 갑자기?!"
2004106-74 = "[s] \"일단 쓰레기봉투 50L짜리 한 다발 사 올게.\""
2004106-75 = "아, 알았어……."
2004106-81 = "정말로, 어느 정도 치워졌네……?"
2004106-82 = "어? 아직 반도 안 치운 거라고? 치운다는 개념은 이런 게 아니야?"
2004106-83 = "……."
2004106-84 = "내가 뭔가, 도와줄 게 있을까?"
2004106-85 = "괜찮으니까, 거기 침대에서 쉬고 있으라고? 그렇지만 그건……."
2004106-86 = "아, 알았어. 그렇게 부탁한다면……."
2004106-89 = "[wa:1780]― [log=리오]이런 일을 [wa:1820]하기 위해서,[/log]"
2004106-90 = "[wa:1790]― [log=리오]당신을 부른 건 아니었지만……[/log]"
2004106-93 = "― [log=리오]직접 할 거야. [wa:1340]선생은 앉아 있도록 해. [/log]"
2004106-96 = "[wa:950]― [log=리오]서, [wa:790]선생은 자신의 위치에 [wa:1230]대해서 자각할 필요가 있어.[/log]"
2004106-98 = "― [log=리오]이런 걸로 [wa:360]시간을 낭비하는 건 [wa:1400]비합리적이야.[/log]"
2004106-101 = "― [log=리오]다른 중요한 [wa:360]일들이 더 많잖아?[wa:80] [/log]"
2004106-104 = "[ns3] \"학생의 생활 관리도 중요한 일이야.\"\n[ns4] \"지금은 리오를 보살피는 일이 내게 가장 중요해.\""
2004106-107 = "[wa:570]― [log=리오]무, [wa:810]무슨…… [wa:840]말을…… [/log]"
2004106-109 = "― [log=리오]나를, [wa:1180]'보살핀다'……?![/log]"
2004106-112 = "[wa:1120]― [log=리오]이…… [wa:550]이해할 수 없어. [wa:1860]그런……[/log]"
2004106-114 = "― [log=리오]……하긴. [wa:2330]당신은 늘 그랬지. [/log]"
2004106-117 = "[wa:2120]― [log=리오]……알았어.  [/log]"
2004106-119 = "― [log=리오]그렇다면 끝까지 받도록 할게.[/log]"
2004106-122 = "― [log=리오]당신의 그…… [wa:1770]'보살핌'이라는 거.[/log]"
2004106-128 = "이해했어. 이게…… '청소'라는 개념인 거구나."
2004106-129 = "응? '진짜'들에 비하면, 아무것도 아니라고? 그런, 거야……?"
2004106-130 = "무엇보다 쓰레기봉투가 저렇게 수북이 쌓여 있으니까? 그렇지만 그런 건, 적당히 지정 장소에 버리면……."
2004106-131 = "……아니구나. 생각해 보니 토키는, 제대로 모두 버려 줬던 것 같아."
2004106-132 = "그렇지만 선생도 이렇게까지는 한다는 거니까……."
2004106-133 = "……."
2004106-134 = "다들 마음만 먹으면, 이 정도는 한다는 걸까……."
2004106-135 = "[s5] \"어…… 그게…….\"\n[s6] (이번만큼은 꽤 본격적으로 해 본 건데 말이지…….)"
2004106-138 = "내, 내가 또 뭔가 잘못 이야기한 걸까……?!"
2004106-139 = "아니라고? 그렇지만……. 응? 전부 다 괜찮아? 그건 또 무슨 의미……?"
2004106-148 = "왜, 왜 갑자기 머리를 쓰다듬는 거야?!"
2004106-149 = "……."
2004106-150 = "그렇지만, 뭔가 나쁘지 않으니까…… 이대로 있을게……."
2004106-153 = "[ns] \"그러면 우리, 뭐 좀 먹자.\""
2004106-154 = "으, 응? 그야, 시간이 되기는 했지만. 나는 그렇게 배가 고프지가……."
2004106-155 = "아, 선생이 배가 고프다는 거구나. 하긴 선생은, 나 대신 내 아지트를 전부 치워 주었지……."
2004106-156 = "미안해, 선생. 다시 한번."
2004106-157 = "하지만…… 섣불리 밖에 나갔다가는, 들키지 않을까?"
2004106-158 = "[s7] \"여긴 밀레니엄에서 제법 떨어진 데다 구도심이니까.\"\n[s8] \"괜찮을 거야, 분명.\""
2004106-161 = "아, 알았어."
2004106-162 = "저기, 오늘은 여러 가지로, 그, 고마웠어."
2004106-163 = "그러면–"
2004106-167 = "꺄앗?!"
2004106-172 = "(리오가 그만 수북하게 쌓인 쓰레기봉투에 걸려 넘어졌다!)"
2004106-173 = "[ns] \"우왓? 괜찮아, 리오?!\""
2004106-177 = "으, 응. 괜찮아. 붙잡아줘서, 고마워……."
2004106-178 = "[s] \"그래, 그래. 설 수 있지?\""
2004106-179 = "그건 문제없어. 문제, 없는데……."
2004106-180 = "……."
2004106-181 = "저, 선생?"
2004106-182 = "잠깐만, 아주 잠깐만……."
2004106-187 = "이대로 있으면, 안 될까……?"
2004106-188 = "[s] \"응? 괜찮은데, 갑자기 왜?\""
2004106-189 = "그렇, 구나……. 고마워. 선생."
2004106-193 = "정말로……. 고마워."
2004106-195 = "(뭔가, 평소보다 조금 더 주저하는 기색의 리오와 함께.)"
2004106-196 = "(저녁을 함께 먹고, 샬레로 돌아왔다…….)"
