[translation]
1006906-1 = "아무려면 어때!"
1006906-2 = "(가벼운 발걸음으로 현무상회로 향했다.)"
1006906-6 = "현무상회"
1006906-8 = "생각보다 빨리 왔네. 선생님."
1006906-9 = "마침 잘 됐어. 이제부터 만두를 찔 예정이거든."
1006906-10 = "만두 빚는 과정도 보여주고 싶었지만, 그건 새벽부터 시작한 거였어서."
1006906-11 = "그러면…… 시작할까."
1006906-12 = "다들! 찜기에 불을 지피자고!"
1006906-18 = "(루미의 구령과 함께, 찜기들이 일제히 증기를 내뿜기 시작했다.)"
1006906-20 = "엄청난 수증기지?"
1006906-21 = "만두를 찔 때면, 조리실 안이 사우나가 되어 버린다니까."
1006906-22 = "[s1] \"우와…… 이건 좀…… 뜨거운데?\"\n[s2] \"찌는 동안에는 밖에서 기다려도 되지 않아?\""
1006906-25 = "물론 그럴 수 있으면 좋겠지만, 안 돼."
1006906-26 = "계속해서 찜기의 순서를 바꾸어 줘야 하거든."
1006906-27 = "안 그러면 어떤 만두는 불어 터져 버리고, 어떤 만두는 설익어 버리니까."
1006906-28 = "선생님은 그 입구 쯤에서 지켜보고 있어. 나는 이 찜기들을 돌봐 줘야 해서 말이야."
1006906-32 = "(루미의 말대로 입구 근처에서 기다리던 도중……)"
1006906-37 = "[ns] \"어…… 저, 저기. 루미……?\""
1006906-38 = "응? 왜 그래, 선생님? 무슨 일이라도 있어?"
1006906-41 = "[wa:1100]― [log=루미]아…… [wa:600]그렇군. [wa:1200]조금, [wa:300]비쳐 보이는 건가.[/log]"
1006906-44 = "[wa:500]― [log=루미]뭐, [wa:800]신경 쓰지 마. [wa:1100]닳는 것도 아니니.[/log]"
1006906-47 = "[wa:950]― [log=루미]……이렇게 될 줄 알았으면,[/log]"
1006906-49 = "[wa:100]― [log=루미]더 귀여운 속옷을 입고 왔을 텐데.[/log]"
1006906-52 = "[wa:500]― [log=루미]좀, [wa:1200]아쉬울지도?[/log]"
1006906-55 = "[wa:100]― [log=루미]하핫. [wa:1600]뭘 시선을 돌리고 그래.[/log]"
1006906-57 = "[wa:600]― [log=루미]난 [wa:400]전혀 [wa:300]신경 쓰지 않는다고?[/log]"
1006906-60 = "[wa:550]― [log=루미]선생님은 [wa:1800]의외로 그런 구석이 있구나……[/log]"
1006906-62 = "― [log=루미]후훗, [wa:1400]마음에 들었어.[/log]"
1006906-65 = "[wa:800]― [log=루미]모처럼이니까,[/log]"
1006906-67 = "[wa:100]― [log=루미]더 [wa:600]곤란하게 해 버릴까……?[/log]"
1006906-70 = "후, 좋아. 무사히 만두가 완성됐어."
1006906-71 = "선생님 몫도 확실히 만들어 두었으니, 맛이라도 보고 가라고."
1006906-78 = "[ns3] \"루, 루미 학생?!\"\n[ns4] \"이, 이 만두는……?!\""
1006906-81 = "으응? 왜 그래, 선생님."
1006906-82 = "얼마 전에 트리니티에서 정어리 파이라는 음식을 먹어 봤는데, 이게 제법 괜찮았어서 말이지."
1006906-83 = "그걸 응용해서, 정어리 만두를 만들어 봤어!"
1006906-84 = "그 정어리 파이란 게 또 나름 트리니티 종합 학원의 비법 레시피였다고 하더라고?"
1006906-85 = "선생님만을 위해 만든 만두니까 맛있게 먹어 주었으면 하는데?"
1006906-90 = "[ns5] \"쿨럭, 쿨럭……!\"\n[ns6] \"그 사실 자체는 기쁜데, 이 재료와 이 모양은……!\""
1006906-94 = "왜 그래. 뭔가 문제라도 있어? 분명히 트리니티의 역사와 전통이 담긴, 자랑스러운 레시피라는 설명을 들었는데……"
1006906-95 = "자, 어서 먹어 봐. 특히 원재료의 형태를 부서지지 않게 하려고, 제법 고생했단 말이지?"
1006906-98 = "[ns] \"……어쩔 수 없나!\""
1006906-100 = "(루미의 재촉을 이기지 못하고, 떨리는 손으로 정어리 만두를 집어 들었다.)"
1006906-101 = "(분명 상상도 못 한 맛을 보게 될 거라고 생각했지만……!)"
1006906-106 = "(의외로 만두는 제법 먹을 만했다.)"
