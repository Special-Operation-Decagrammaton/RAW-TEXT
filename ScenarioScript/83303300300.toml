[translation]
83303300300-6 = "히, 히나 부장님! 긴급 대응이 필요한 안건입니다!"
83303300300-7 = "무슨 일이지?"
83303300300-8 = "그게…… 부장님께서 제압하셨던 문제아들과 관련해 들어온 소식이……"
83303300300-9 = "난데없이 <이대로 만마전 의장의 기대를 저버리는 것만큼은 용납할 수 없다!>"
83303300300-10 = "<우리는 의리에 살고 의리에 죽는 불량배! 전원 선도부와 전쟁이다!>"
83303300300-11 = "……라고 외치면서 난동을 피우기 시작했다는 소식이……!"
83303300300-12 = "의리란 말이지…… 만마전의 의장으로서 문제아들과 대체 어떤 교감을 쌓았는지 궁금할 지경이지만."
83303300300-13 = "그렇게 난동을 부리겠다면 좋아. 이번에야말로 찍소리 못하게 해주지."
