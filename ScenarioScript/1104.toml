[translation]
1104-1 = "급양부 습격 사건"
1104-2 = "오늘 급식도 맛없어! 계란 프라이라며! 계란 프라이는 어디있는데!!"
1104-3 = "이건 삶은 달걀아닙니까. 어째서 이런 걸 주는 거죠? 급식표에는 분명……."
1104-4 = "거참 시끄럽네! 대충 대충 먹어! 삶은 달걀도 나름 맛있다고!"
1104-5 = "맞아요. 안먹을 거면 저 주시겠어요? 저는 좋아해요, 삶은 계란."
1104-7 = "그런 문제가 아닙니다."
1104-8 = "식단표에는 분명 계란 프라이라고 적혀 있었는데 삶은 달걀이 나왔다는 건,"
1104-9 = "이것은 음식에 대한 예의도, 학생에 대한 예의도 아닙니다."
1104-10 = "용납할 수 없어요. 급양부에 항의하러 가겠습니다!"
1104-12 = "(급양부 조리실)"
1104-13 = "…….알아. 안다고. 그치만 계란 프라이 4000개를 나 혼자서 2시간 안에 만들 수는 없단 말야. 주리도 결석했고."
1104-14 = "식용유도 없고, 프라이팬도 1개뿐이라고."
1104-15 = "뭐, 대충 그런 사정일 줄 알았습니다."
1104-17 = "어쩔 수 없죠. 그럼 우리가 돕겠습니다. 계란 프라이를 대신 해 드리죠."
1104-18 = "여기 우리 식용유도 가져왔습니다."
1104-19 = "……응?"
1104-20 = "어머나, 친절한 미식부가 곤란에 빠진 급양부를 돕는 광경."
1104-21 = "이것이 우정이네요☆"
1104-22 = "참나, 어쩔 수 없지. 이런 전개일 줄 알았어."
1104-23 = "그럼 오랜만에 요리 솜씨를 발휘해볼까?"
1104-24 = "뭐?! 자, 잠깐만!?! 마음대로 만지지 마……?!"
1104-27 = "와아- 그럼 여기 있는 계란 다 먹어도 되는 거야?"
1104-28 = "거기 잠깐! 요리부터 해야지! 먹는 건 나중이라고!"
1104-29 = "괜찮아, 나 날계란 덮밥은 좋아하거든!"
1104-30 = "이 계란 바구니를……"
1104-31 = "어, 어어어?"
1104-33 = "(와장창-!!)"
1104-34 = "으아아, 아까운 계란이!!"
1104-35 = "준코 씨, 발 밑!! 거기 쌓아놓은 식용유가……!!"
1104-36 = "뭐? 으, 으아아아! 미끄러진다아?!"
1104-38 = "자, 잡아줘, 하루나!"
1104-41 = "어, 어어? 제가 잡았어요!"
1104-42 = "어머나? 멈추지 않는데요?"
1104-45 = "하루나 씨, 거기 있으면 위험해요! 피해요! 구석으로!!"
1104-46 = "………!!!"
1104-49 = "(와장창-!)"
1104-50 = "아, 계란이 온 몸에 끈적끈적하게……!"
1104-51 = "으아아아아? 잠깐만! 찬장이 기울고 있는데? 우, 우왓?! 조심해! 밀가루 포대가…!!"
1104-52 = "(콰당탕-!!)"
1104-54 = "(캘룩, 캘룩!)"
1104-55 = "(허우적 허우적) 으아아아, 이거 뭐야? 계란에 밀가루라니, 우리 반죽당하는 거야?"
1104-56 = "캘룩, 캘룩. 움직이지 마, 이즈미! 발버둥치면 더 반죽되잖아!"
1104-57 = "이대로라면 미식부가 거대한 타코야키가 되어버립니다…!!"
1104-58 = "으응…… 타코야키 재료로 취급당해버리는 건가요? 이건 나름대로……."
1104-59 = "으아아아, 타코야키는 싫어! 아니, 좋지만, 되는 건 싫어어!"
1104-61 = "(와장창-!!)"
1104-62 = "(허우적 허우적)"
1104-63 = "(콰당탕-!)"
1104-66 = "………………."
1104-68 = "급양부 습격 사건"
