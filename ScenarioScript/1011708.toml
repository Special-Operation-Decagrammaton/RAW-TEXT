[translation]
1011708-1 = "걸 온 파이어"
1011708-2 = "(뭔가 불안해지는 모모톡을 받고 시간이 지났다.)"
1011708-6 = "히카리 등장-"
1011708-7 = "[s1] \"안녕, 히카리.\"\n[s2] \"손에 들린 것은……?\""
1011708-10 = "히카리의 새로운 도전."
1011708-11 = "한계를 넘어 날아가기 위한 준비물-"
1011708-12 = "바로 이거야-"
1011708-13 = "[s3] \"이건……\"\n[s4] \"아주 매운 카레??\""
1011708-16 = "응- 완전 매운맛 카레-"
1011708-17 = "오늘부터 히카리는 달콤함 대신 매운맛을 즐길래-"
1011708-18 = "치아도 지키고 뉴 히카리로 거듭난다-"
1011708-19 = "[s] \"꽤 매울 텐데, 그거……\""
1011708-20 = "마음의 강함이 곧 육체의 강함."
1011708-21 = "그런 의미로 히카리는 무적이니까-"
1011708-22 = "안 먹어봤지만 먹을 수 있어-"
1011708-23 = "[s] \"과연……\""
1011708-25 = "(걱정을 뒤로 하고, 히카리의 시식 준비가 끝났다.)"
1011708-27 = "자- 그럼-"
1011708-33 = "완전 여유-"
1011708-34 = "[s] \"오오……\""
1011708-39 = "……"
1011708-40 = "……우우……"
1011708-41 = "매워- 고통스러워-"
1011708-42 = "[s] \"원래 매운 맛은 좀 늦게 오거든……\""
1011708-43 = "히카리 크리티컬 데미지-"
1011708-44 = "입술이 타오른다…… 아파……"
1011708-45 = "선생님- 살려줘어……"
1011708-46 = "후욱- 후욱- 하아- 하아-"
1011708-47 = "[s5] \"입김이 뜨겁고 매워……!\"\n[s6] \"도움이 될 만한 걸 사 올 테니까 조금만 기다려!\""
1011708-53 = "(서둘러 사 온 우유를 히카리에게 주었다.)"
1011708-57 = "후우- 후우-"
1011708-58 = "후우우우우-"
1011708-59 = "[s] \"좀 괜찮아졌어……?\""
1011708-60 = "우우…… 아직 아파-"
1011708-61 = "지속피해- 100억 정도……"
1011708-62 = "이제 매운 거 안 먹어……"
1011708-63 = "마음의 강함 따위 소용없었어……"
1011708-64 = "히카리의 육체 무력하게 무너졌어-"
1011708-68 = "선생님- 달콤한 거 있어-?"
1011708-69 = "아직 혀가 매워어……"
1011708-70 = "[s7] \"혹시 몰라서 아이스크림도 사 왔는데……\"\n[s8] \"이거 먹고 양치 잘 해야 한다?\""
1011708-73 = "히카리 약속- 양치 잘하기-"
1011708-78 = "선생님도 같이 먹어-"
1011708-80 = "(아이스크림까지 먹은 히카리는 진이 빠졌는지 무릎 위로 올라와서 잠들었다.)"
1011708-81 = "(……)"
1011708-85 = "[ns] \"못 움직이겠어…… \""
1011708-86 = "(결국 그대로 업무 시간이 끝날 때까지 자게 뒀다.)"
