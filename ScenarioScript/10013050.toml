[translation]
10013050-1 = "제5화;하얀 귀의 괴물들 1"
10013050-7 = "(시즈코의 지시에 따라 이번엔 다 같이 어느 한적한 바닷가에 도착하게 되었다.)"
10013050-8 = "[ns] \"다음은 <패자를 파멸시키는 하얀 귀의 괴물들>……이라고 했지.\""
10013050-9 = "뭐라고 할까……. 여전히 엄청난 이름이네요……."
10013050-10 = "괴, 괴물……! 이, 이즈나의 인법으로 퇴치할 수 있을까요……?"
10013050-11 = "으음! 그건 모르겠지만, 그래도 걱정하지 않아도 되어요! 저희에겐 치세 씨가 있으니까요!"
10013050-13 = "……꿀꺽."
10013050-19 = "……악령퇴산?"
10013050-20 = "[s] \"뭐, 진짜 괴물인지 아닌지는 가보면 알 수 있겠지.\""
10013050-21 = "네, 바로 직전의 온천개발부도 별명만 요란했지. 실체는 평범했으니까"
10013050-22 = "괴물이라고 할까, 괴담이라고 할까. 로어-라는 건 어차피 뜬소문에 불과한 거고."
10013050-23 = "으으음. 여기서 말하는 괴물이란 것도 별거 아닐 게 분명……."
10013050-36 = "가, 가야만 해……."
10013050-40 = "대회장……으로."
10013050-46 = "……응? 바, 방금 그건……?"
10013050-47 = "사, 사장님! 그 사람뿐만이 아니에요……!"
10013050-52 = "어, 어서……"
10013050-57 = "늦기 전에…… 도착해야……."
10013050-63 = "아, 또 한 분이…… 저 모습은 마치……."
10013050-64 = "[s] \"뭔가에 홀린 것 같네. 괴물, 이라던가.\""
10013050-66 = "읏?! 그, 그럴 리가요! 그런 괴물 같은 게 정말로 있을 리가……!"
10013050-72 = "앗! 배의 경적이! 저기, 저쪽에서 들려오는 거 같아요!"
10013050-78 = "이건…… 커다란 배……?"
10013050-79 = "배 선체에 적혀 있는 이름은……"
10013050-81 = "<골든 플리스>호래요."
10013050-82 = "[s] \"골든 플리스라고 하면…… 어디선가 들어본 기억이…….\""
10013050-87 = "배의 입장 가능 시간이 앞으로 30분 남았습니다-!"
10013050-88 = "오늘의 게임을 이용하시려는 손님께서는 늦지 않게 배에 올라 주십시오!"
10013050-93 = "으어어어………."
10013050-101 = "마, 마치! 다들 괴물에 홀린 듯이! 배에 오르고 있어요!"
10013050-102 = "어, 어쩌죠. 사장님?!"
10013050-103 = "으으윽! 수, 수상하기 짝이 없지만! 이대로 가만히 있을 수는 없어! 우리의 목적을 잊으면 안 되니까!"
10013050-104 = "다 같이 배에 오르자!"
10013050-105 = "[s] \"응.\""
10013050-119 = "[ns] \"뭔가 소란스러운 분위기네.\""
10013050-139 = "여기에 찾아온 모든 분이 뭔가에 홀린 듯이 집중하고 있는 것 같아요……."
10013050-140 = "대체 다들 여기서 뭘 하고 있는 걸까요……?"
10013050-141 = "소란스러운 분위기…… 마치 넋이 나간 것만 같은…… 모두의 얼굴들…… 거기다 배에 오르기 전 들었던 <게임>이라는 단어까지………"
10013050-142 = "서, 설마……! 이, 이곳은…… 함부로 해서는 안 되는, 불법적인 무언가가…… 일어나는 장소라는……!"
10013050-143 = "[s] \"아, 잠깐. 저기서 뭐라고 외치고 있어.\""
10013050-148 = "그, 그, 그럼 내 차례야……!"
10013050-149 = "나는 여기서 <인면 달팽이>를 트, 특수 소환! 동시에 추, 춤을 춰서! 인면 달팽이의 방어력을 올리겠어!"
10013050-150 = "그, 그럼! 소인은 <우등생 사마귀>를 소환하겠소이다!"
10013050-151 = "동시에 이 자리에서 브릿지를 하면……! 우등생 사마귀의 스피드가 상승!"
10013050-152 = "이것으로 공격하겠소이다!"
10013050-157 = "………네?"
10013050-158 = "아, 이거, 본 적 있어요. 분명…… 카에데 쨩이 하던……."
10013050-159 = "무시퀸이란 카드 게임이네요!"
10013050-160 = "……무, 무시퀸?!"
10013050-161 = "[s] \"아, 그런 거였구나.\""
10013050-162 = "자, 잠깐! 대체 이런 곳에서? 왜?"
10013050-163 = "그보다 왜 저렇게 진지한 얼굴로…… 아니, 넋이 나간 채로 그런 카드 게임을 하는 건데……?"
10013050-164 = "카에데 쨩이 자주 말하곤 했었죠"
10013050-165 = "무시퀸이란 각자의 명예와 신념을 걸고 펼치는…… 무시무시한 게임이라고!"
10013050-166 = "맞아요! 가끔 게임에서 패배하면 카드에 갇히기도 하는 가혹한 게임이라구요! 사장님! 피나가 자주 그랬답니다!"
10013050-168 = "그, 그렇게나 무서운 게임이……!"
10013050-169 = "아니아니아니, 그건 어디까지나 애니메이션의 이야기잖아?!"
10013050-170 = "[s] \"하지만 왜 이런 곳에서 무시퀸 대회가 열리는 거지?\""
10013050-176 = "오래 기다리셨습니다! 이곳에 모인 무시퀸의 배틀리스트 여러분들!"
10013050-182 = "오늘도 다 함께-! 서로의 덱을 걸고 벌이는 뜨거운 승부!"
10013050-183 = "시크릿 무시퀸 대회에 오신 걸 환영합니다!"
10013050-184 = "시, 시크릿……?"
10013050-185 = "여러분도 알다시피 저희 배에서 열리는 무시퀸 대회는 평범한 대회가 아닙니다!"
10013050-186 = "승자와 패자! 그 명암이 완벽하게 갈리는 이곳! 승자는 모든 것을 거머쥐지만, 패자는 모든 것을 빼앗기게 되는 무서운 장소!"
10013050-187 = "구체적으로 말하자면, 패자는 가지고 있는 모든 덱과 카드를 빼앗기게 된다는, 비참한 형벌에 처해지는 곳! 아아! 무섭기 그지없어라!"
10013050-188 = "……그게 그렇게 끔찍한 거야?"
10013050-189 = "[s1] \"그, 그러게…….\"\n[s2] \"덱이란 이름의 영혼을 빼앗다니, 이 무슨 무시무시한……!\""
10013050-190 = "대체 그렇게까지 해서 이런 대회에 참가하는 이유가 뭐길래……."
10013050-191 = "선생님은 공감하실 수 있는 거예요?!"
10013050-192 = "그보다 그런 엄청난 형벌이 있다면, 왜 이런 대회에 참가하는 건데요?!"
10013050-193 = "하지만 패자를 향한 형벌이 있다면, 당연히 승자를 위한 상도 준비되어 있는 법!"
10013050-194 = "오늘 대회의 승자에겐, 무시퀸 한정 카드팩과 더불어………"
10013050-199 = "이 투기장을 운영할 수 있는 권리서 <리조트 사용권>도 상품으로 드립니다!"
10013050-203 = "[ns] \"통이 큰 대회네.\""
10013050-204 = "뭐, 뭐어어엇?! 아니, 무슨 배짱인 거야?! 그걸 넘겨주면, 전부 빼앗기게 될 텐데- 그걸로 괜찮은 거야?!"
10013050-206 = "그야 괜찮지! 무시퀸의 배틀리스트에겐 승리 아니면 죽음뿐이니까!"
10013050-211 = "뭐, 뭐야?"
10013050-212 = "소란을 피우는 녀석이 있단 신고를 받고 왔다!"
10013050-213 = "감히 신성한 대회장에서 어떤 녀석이냐!"
10013050-214 = "아니, 그러니까 나는-"
10013050-215 = "흐음, 생긴 걸 보아하니 우리 대회에 참가하러 온 녀석은 아니군?"
10013050-216 = "[s] \"생긴 것만 봐도 알 수 있어?\""
10013050-217 = "무시퀸의 배틀리스트라면, 자고로 눈에서 이글거리는 카드의 영혼이 느껴지는 법이니까!"
10013050-218 = "영문을 모르겠거든?!"
10013050-220 = "어쨌거나 일반인이라면 여기서 냉큼 꺼지시지!"
10013050-221 = "지금부터 이곳은 전쟁터로 변한다!"
10013050-222 = "[s] \"이미 전쟁터 한복판인 거 같지만…….\""
10013050-223 = "아니면 혹시 이 녀석들 <리조트 사냥>으로 찾아온 녀석들인가?"
10013050-224 = "그런 거라면 더욱 용서할 수 없지! 대회를 방해하는 녀석은! 바로 배 밖으로 걷어차 주마!"
10013050-232 = "이런 식으로 찾아온 녀석들을…… 전부 바다 밖으로 걷어차 준 거야?! 무슨 해적이냐구?!"
10013050-233 = "이, 이를 어쩌죠 사장님?! 현재진행형으로 절체절명?!"
10013050-234 = "주군! 모두가 위험에 처하더라도, 이즈나가 모두를……!"
10013050-236 = "후아암~"
10013050-237 = "……잠깐만요. 여러분의 말씀대로라면,"
10013050-238 = "무시퀸 대회에 참가할 생각만 있다면 여기 있어도 된다는 의미인가요?"
10013050-239 = "[s] \"미모리?\""
10013050-241 = "응? 뭐…… 그렇지?"
10013050-242 = "그야 무시퀸 배틀리스트라면 우리가 막진 않겠지만"
10013050-244 = "모두들, 이건 좋은 기회 같아요. 굳이 <리조트 사냥>이라는 형태로 싸우지 않더라도……"
10013050-245 = "무시퀸 대회에 참가해서 우승하면……. 계약서도 되찾을 수 있을 테니까요."
10013050-246 = "하지만 어쩌려고? 난 무시퀸 같은 건 잘 모르고, 해본 적도……."
10013050-247 = "방법이라면 있어요. 저희 주변엔 여기에 빠삭한 전문가들…… 무시퀸의 배틀리스트들이 있잖아요?"
10013050-248 = "수행부에도, 마츠리부에도!"
10013050-249 = "[s] \"……설마.\""
10013050-250 = "아!"
10013050-261 = "네! 알겠습니다! 부장!"
10013050-262 = "그런 거라면! 우리에게 맡겨줘!"
10013050-264 = "후후훗! 네!"
10013050-265 = "듬직해요! 피나! 카에데!"
10013050-266 = "[s] \"……정말 이걸로 괜찮을까?\""
10013050-267 = "으으으! 죽이 되든 밥이 되든……"
10013050-268 = "일단은 도전이라구요!"
