[translation]
10038085-9 = "성은이, 망극하옵니다……."
10038085-16 = "수고했다. 카구야."
10038085-20 = "부상자를 치료하거라. 카구야의 상태가 특히 좋지 않다. 안전한 곳으로 이송시켜, 어떠한 뒤탈도 없게 해라."
10038085-21 = "모든 결정과 처분은, 모든 것이 끝난 후에 행하도록 하겠다."
10038085-24 = "명을 받들겠습니다!"
10038085-26 = "현룡문, 집합! 해야 할 일을 집행하라!"
10038085-27 = "길이 열렸다! 기회를 놓쳐서는 안 된다!"
10038085-29 = "육화각을 되찾아라! 문주님을 모셔라!"
10038085-37 = "고생이 많구나. 미나."
10038085-38 = "별말씀을요. 이제야 밥값을 하는 것 같아서 속이 편할 지경입니다."
10038085-39 = "괜찮겠느냐? 우리는 어떤 의미에서 뒤가 없는 모험을 하고 있는 것이다. 한 번이라도 실패하거나 잘못되면, 다음은 없을 터인데."
10038085-40 = "여차하면 저 혼자만이라도 살길을 찾으라는 뜻이십니까?"
10038085-41 = "……."
10038085-42 = "걱정하지 마시라고는 말씀드리지 않겠습니다. 문주님께서는 그러기 어려워하시는 분이니까요."
10038085-47 = "하지만 문주님께서 저를 저버리시는 일은 있을 수 있어도, 제가 문주님을 떠나는 일은 없을 겁니다."
10038085-53 = "……그래."
10038085-54 = "다음의 행선지는 어디입니까. 역시 연단방인가요?"
10038085-58 = "지하 감옥으로 가자."
10038085-59 = "감옥…… 말씀이십니까?"
