[translation]
11050-2 = "제5화;세리카의 평범한 하루"
11050-3 = "아비도스 주택가 45블럭 지구"
11050-6 = "(아비도스 주택가에서 익숙한 얼굴을 만났다.)"
11050-7 = "으……, 뭐, 뭐야……!?"
11050-8 = "[s] \"좋은 아침이야.\""
11050-9 = "좋은 아침이야~, 가 아니잖아! 스스럼없이 친한 척하지 말아줄래?"
11050-10 = "난 아직 선생님을 인정한 게 아니거든?"
11050-11 = "정말이지, 아침부터 한가하게 어슬렁거리고 있기나 하고 말야. #n참 팔자도 좋은 어른이야."
11050-12 = "[s] \"세리카 쨩~ 학교 가는 거야?\""
11050-13 = "뭐, 뭐야! 왜 친하게 부르고 있어!"
11050-14 = "내가 뭘하든 별로 선생님이랑 상관은 없잖아?"
11050-15 = "아침부터 동네를 어슬렁거리는 모습이 못 미더운 어른의 표본으로 삼기 딱 좋거든?"
11050-16 = "그럼 마음껏 계속 여유를 즐기라고. 난 바쁘니까."
11050-17 = "뭐? 학교 가는 거면 같이 가자고?"
11050-18 = "아니, 내가 왜 댁이랑 같이 학교를 가야 해?"
11050-19 = "그리고 안됐지만 오늘은 자율등교라서 딱히 학교 안 가도 되거든?"
11050-20 = "응? 그럼 어디 가는 거냐고? ……그걸 내가 일일이 알려줄 거 같아?"
11050-21 = "그럼 안녕~ 수고해~"
11050-23 = "(세리카는 먼지를 일으키며 달려가 버렸다.)"
11050-24 = "[s] 쫓아간다."
11050-26 = "히햑?! 왜, 왜 따라오는 거야?!"
11050-27 = "이대로 같이 달리면 어디로 가는지 알 수 있을 거 같다고?"
11050-28 = "무슨 소리야! 저리 안 가?! 스토커냐!!"
11050-29 = "……하아, 알았어! 알려주면 되잖아!"
11050-30 = "……아르바이트 가는 거야."
11050-31 = "다, 당신처럼 팔자 좋게 놀고 있을 입장이 아니거든? 한푼이라도 벌어야 한단 말야!"
11050-32 = "됐지? 그럼 쫓아오지 마!"
11050-34 = "[s] 쫓아간다."
11050-37 = "으으…… 끈질겨."
11050-38 = "……뭐? 알바하는 곳이 궁금하다고?"
11050-39 = "크아아! 무슨 소리 하는 거야?! 저리 가! 이 망할 어른!! 꺼지라고! 죽인다?"
11050-41 = "(세리카는 먼지를 일으키며 달려가 버렸다.)"
11050-43 = "어서 오세요! 시바세키 라멘입니다!"
11050-44 = "몇 명이신가요? 비어있는 자리를 안내해 드리겠습니다!"
11050-45 = "네, 잠깐만요! 3번 테이블에 면 추가 있어요!"
11050-46 = "(드르륵-)"
11050-47 = "어서 오세요, 시바세키 라멘입……"
11050-48 = "우왓?!!"
11050-49 = "와아~☆ 저희, 저희 5명이에요!"
11050-50 = "아, 아하하. 세리카 쨩……. 안녕."
11050-51 = "안녕."
11050-52 = "모, 모두들 여긴 어떻게 알고……?!"
11050-53 = "으헤~ 여기 있을 줄 알았지."
11050-54 = "[s] \"안녕.\""
11050-55 = "선생님까지…… 뭐야, 역시 스토커냐!!"
11050-56 = "으헤, 선생은 죄가 없어. 세리카 쨩이 알바한다면 여기밖엔 없잖아? 그래서 와봤지."
11050-57 = "호시노 선배였나……!! 으으."
11050-59 = "아비도스 학생들인가. 세리카 씨, 그만 떠들고 주문 받아야지."
11050-60 = "아, 우으……. 네, 마스터. 손님들, 단체석으로 모시겠습니다. 이쪽으로 와주세요."
11050-62 = "자아, 선생님은 여기, 여기요! 제 옆에 자리 있어요!"
11050-63 = "……음. 내 옆도 자리가 비어 있어."
11050-64 = "[s1] 노노미 옆에 앉는다.\n[s2] 시로코 옆에 앉는다."
11050-65 = "(챡-)"
11050-66 = "응응, 조금 좁지만 괜찮죠?"
11050-67 = "응? 불편하세요? 그럼 제 무릎 위에 앉으실래요?"
11050-68 = "뭐하는 짓이야! 남의 가게에서!"
11050-69 = "아하하, 농담이에요, 세리카 쨩☆"
11050-70 = "여기 자리 많잖아! 전부 제대로 앉아!"
11050-71 = "아, 아하하…… 네."
11050-73 = "(챡-)"
11050-74 = "음……."
11050-75 = "좁잖아! 시로코 선배, 그렇게 달라붙어 있으면 선생이 불편하니까 조금 더 이쪽으로 오라고."
11050-76 = "아니, 문제없어. 그렇지, 선생님?"
11050-77 = "뭘 사양하고 있어! 여기 자리 많다고! 전부 제대로 앉아!"
11050-78 = "으, ……으음."
11050-81 = "세리카 쨩. 알바 유니폼 엄청 귀여워☆"
11050-82 = "이야, 세리카 쨩 그런 성향이었어? 유니폼으로 아르바이트를 구하는 타입?"
11050-83 = "무, 무, 무슨 소리야?! 관계없다고! #n여, 여기는 우리 단골이기도 했고……."
11050-84 = "알바복의 세리카 쨩이라니, 사진으로 찍어뒀다가 비싸게 팔 수 있겠는데. #n어때? 한 장 사지 않겠어, 선생?"
11050-85 = "이상한 부업하지 마세요, 선배……."
11050-86 = "언제부터 알바를 하고 있었던 거야?"
11050-87 = "이, 일주일 정도 전부터……."
11050-88 = "그렇군요☆ 가끔씩 몰래 사라지던 게 아르바이트 때문이었군요!"
11050-89 = "그, 그만 떠들고 주문하라고!"
11050-90 = "주문은 뭘로 하시겠습니까, 겠지. 세리카 쨩? 손님한테 상냥하게 대해야 하지 않겠어?"
11050-91 = "아, 으, 으으…… 주, 주문은 뭘로 하시겠습니까……."
11050-92 = "저는 차슈멘이요!"
11050-93 = "나는 시오."
11050-94 = "어…… 저는 미소라멘으로……."
11050-95 = "나는 특제 미소라멘! 구운 차슈 추가해서!"
11050-96 = "자, 선생도 망설이지 말고 잔뜩 시키라고. #n여기 엄청 맛있거든, 아비도스의 명물 시바세키 라멘!"
11050-97 = "……저기, 그런데 다들 돈은 있는 거야? 설마 또 노노미 선배에게 신세지는 건 아니겠지?"
11050-98 = "응? 저는 그래도 상관없어요☆ 어차피 집에서 받은 카드 한도도 남아 있고."
11050-99 = "아냐. 또 신세 질 수는 없지. 이건 선생이 사는 거야. 그치, 선생?"
11050-100 = "……뭐? 그런 소린 못 들었다고? 와하하, 지금 들었으니 됐잖아."
11050-101 = "[s] 도망친다."
11050-102 = "어딜 도망가."
11050-103 = "(잡혀버렸다.)"
11050-105 = "으헤~, 어른의 카드가 있잖아. 그걸 쓸 기회가 왔다고."
11050-106 = "어른의 카드는 이런 곳에서 쓰는 게 아니지만……. #n역시 밥 사준다고 모두를 모이게 한 게 이런 속셈이었군요, 선배."
11050-107 = "자아, 귀여운 학생들에게 밥을 사줄 기회라고. 흔치 않은 기회잖아."
11050-108 = "……"
11050-112 = "(소근소근) 이걸로 몰래 결제하세요, 선생님."
11050-113 = "응……? 괜찮다고요? 그치만……."
11050-115 = "(결국 모두에게 밥을 사주고야 말았다.)"
11050-116 = "이야, 잘 먹었어, 선생!"
11050-117 = "잘 먹었어요."
11050-118 = "음. 덕분에 잘 먹었어."
11050-119 = "얼른 가버려! 다신 오지 마!! 영업에 방해된다고!"
11050-120 = "아, 아하하…… 세리카 쨩 내일 봐."
11050-121 = "진짜 싫어!! 다들 죽어버려-!!"
11050-122 = "아하하, 건강하니 다행이야."
11050-123 = "[s] 돌아간다."
11050-126 = "(수고하셨습니다-!)"
11050-127 = "하아…… 겨우 끝났네. 정신없는 하루였어."
11050-128 = "모두들 몰려와선……. 시끄럽게."
11050-129 = "남 일하는 곳에 와서 깔깔거리며 선생님, 선생님 재잘재잘. 민폐잖아. 뭐냐고 대체."
11050-130 = "망할 호시노 선배!! 내가 어제 한 짓 때문에 일부러 선생님을 데리고 온 거지!"
11050-131 = "……웃기지 마. 그런다고 내가 순순히 따라줄 거 같아?"
11050-136 = "……"
11050-137 = "저 녀석인가?"
11050-138 = "……네. 맞습니다. 아비도스 학교의 대책위원회 멤버입니다."
11050-139 = "준비해. 다음 블럭에서 포획한다."
11050-142 = "……."
11050-143 = "흐음……"
11050-144 = "……그러고보니 이 동네도 많이 인적이 사라졌네. 예전엔 그래도 이 정도는 아니었는데."
11050-145 = "치안도 더 불안해진 것 같고……."
11050-146 = "안돼, 우리가 더 힘내지 않으면……. 힘내서 학교를 다시 일으켜 세워야지."
11050-147 = "일단 월급이 나오면 이걸로 대출 이자에 보태고……."
11050-152 = "……!?"
11050-153 = "뭐야, 너희들."
11050-154 = "쿠로미 세리카……인가?"
11050-155 = "……카타카타 헬멧단? 네 녀석들, 아직도 이 거리를 멋대로 활보하고 있는 거야?"
11050-156 = "잘됐어. 안 그래도 기분 안좋은데, 다시는 이 거리에 발을 못 붙이게 해주겠어……!!"
11050-157 = "(투타타타타타타-!!)"
11050-158 = "크, 크윽?!"
11050-159 = "(뒤에도?! ……이 녀석들, 나를 노리고…….)"
11050-160 = "잡아라."
11050-161 = "(퍼어어엉----!!)"
11050-162 = "콰아아아아아아앙------!!!"
11050-163 = "쿨럭, 쿨럭……."
11050-164 = "(대공포……? 아냐…… 이 폭발음은 Flak 41 개량형……?)"
11050-165 = "(화력 지원이……? 위치가 어디…… 아, 아냐. 이건……. 설마.)"
11050-166 = "(이, 이놈들, 장난이 아니잖아…… 위험해…….)"
11050-167 = "(의식이…….)"
11050-168 = "(…….)"
11050-170 = "(털썩)"
11050-172 = "……."
11050-173 = "더 때릴까요?"
11050-174 = "아니, 죽이면 안 되지. 이쯤이면 됐다. 차에 태워라. 랑데부 포인트로 데려간다."
11050-177 = "(부우우우우웅--)"
11050-179 = "다음화;구출 작전!"
