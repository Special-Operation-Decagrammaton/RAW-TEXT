1015203-5 = "#st;[0,0];instant;1;"
1015203-8 = "[ns1] (……엄청 졸리다.)\n[ns2] \"가볍게 산책이라도 할까…….\""
1015203-12 = "#place;인근의 공원"
1015203-14 = "#na;(밖에 나오니 잠이 좀 깨는 느낌이 든다.)"
1015203-15 = "#na;(하지만 밀려오는 하품은 참을 수가 없다…….)"
1015203-16 = "[ns] \"흐아아아아암…….\""
1015203-17 = "#na;츠무기 언노운;후후, 정말이지 우렁찬 하품이네요."
1015203-18 = "#na;츠무기 언노운;저도 모르게 신경이 쓰여, 그만 달콤한 꿈에서 깨어 버리고 말았답니다."
1015203-20 = "[ns] \"응? 이 목소리는…….\""
1015203-23 = "3;츠무기;01\n#3;a\n#wait;1500"
1015203-24 = "3;츠무기;09;짜잔. 잠자는 숲속의 공주, 시이나 츠무기의 등장입니다.\n#3;em;[반짝]"
1015203-25 = "3;츠무기;02;어라? 이런 곳에서 저를 만난 게 상당히 의외라는 표정이네요."
1015203-26 = "3;츠무기;99;저는…… 어렴풋이 이렇게 되지 않을까 생각했답니다."
1015203-27 = "3;츠무기;03;말씀드렸듯이 센티멘탈리즘한 운명을 느꼈으니까요."
1015203-28 = "[s] \"어, 어째서 공원에서 잠을……?\""
1015203-29 = "3;츠무기;02;저는 작곡을 할 때, 이렇게 혼자 밖을 돌아다니며 영감을 얻곤 하거든요.\n#3;em;[반응]"
1015203-30 = "3;츠무기;99;늦은 밤, 별빛이 땅으로 내려온 화사한 도시."
1015203-31 = "3;츠무기;00;기분 좋게 몸을 감싸는 밤의 고요. 향기로운 새잎의 내음."
1015203-32 = "3;츠무기;03;그리고 그 속에서 홀로 하늘의 별을 세는 나."
1015203-33 = "3;츠무기;01;어떤가요? 이야기만 들어도 수많은 영감이 떠오르지 않나요?\n#3;em;[?]"
1015203-34 = "3;츠무기;09;그 부작용으로…… 너무 편안해서 저도 모르게 잠이 들긴 하지만요."
1015203-35 = "[ns] (그러고 보니…… 처음 만났을 때도 이랬던 것 같다…….)"
1015203-37 = "[ns3] \"그래도 밖에서 자는 건 위험해.\"\n[ns4] \"기숙사로 돌아가는 게 좋지 않을까?\""
1015203-40 = "3;츠무기;07;어머나. 저를 걱정해 주시는 거군요."
1015203-41 = "3;츠무기;01;감사합니다. 하지만 선생님의 조언을 따르기엔 애매한 부분이 있군요."
1015203-42 = "3;츠무기;03;이대로 돌아갔다간…… 사감대의 검문에 걸리고 말 테니까요.\n#3;em;[…]"
1015203-43 = "[s] \"몰래 나왔던 거야?!\""
1015203-44 = "3;츠무기;99;많이 경험하고, 많이 생각하고, 많이 창작하라."
1015203-45 = "3;츠무기;03;좋은 작품을 만들기 위한 3요소라고 하죠."
1015203-46 = "3;츠무기;01;이런 청춘의 일탈도 다양한 경험 중 하나. 분명 많은 영감을 주겠죠."
1015203-47 = "3;츠무기;02;으음, 뭔가 납득이 안 되는 표정이군요.\n#3;em;[반응]"
1015203-48 = "3;츠무기;00;알겠습니다. 잠을 잘 수 있는 안전한 곳을 찾아볼게요."
1015203-49 = "3;츠무기;03;예를 들면…… 선생님의 사무실 같은 곳이요."
1015203-50 = "3;츠무기;08;후후, 그래요. 이렇게 만난 것도 인연이니, 오늘 하룻밤만 신세를 질 수 있을까요?\n#3;em;[음표]"
1015203-51 = "3;츠무기;01;선생님 일을 방해하진 않을 테니, 너무 걱정하실 건 없어요."
