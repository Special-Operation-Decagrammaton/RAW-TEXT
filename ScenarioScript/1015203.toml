[translation]
1015203-1 = "眠れる森の美女"
1015203-4 = "（夜勤中……）"
1015203-5 = ""
1015203-8 = "[ns1] （……眠すぎる）\n[ns2] \"風に当たってこよう……。\""
1015203-12 = "付近の公園"
1015203-14 = "（外に出ると、少し目が覚めた気がした）"
1015203-15 = "（それでもあくびは我慢できず……）"
1015203-16 = "[ns] \"ふぁぁぁぁぁ……。\""
1015203-17 = "ふふっ、なんともダイナミックなあくびですね。"
1015203-18 = "つい、甘い夢から目を覚ましてしまいました。"
1015203-20 = "[ns] \"この声は……。\""
1015203-23 = ""
1015203-24 = "じゃじゃーん、眠れる森の美女、「椎名ツムギ」の登場です。"
1015203-25 = "あら。ずいぶんと驚かれているようですね。"
1015203-26 = "私はこうなる予感がしていたというのに。"
1015203-27 = "以前お話ししたように、運命的なものを……感じていましたから。"
1015203-28 = "[s] \"まさか……公園で寝てたの？\""
1015203-29 = "はい。作曲の際に、こうやってインスピレーションを得ているんです。"
1015203-30 = "深夜、星の光が降り注ぐ街――"
1015203-31 = "優しく身体を包み込む夜の静寂……ふわりと香る、若葉の匂い……。"
1015203-32 = "その中で一人、星を数える私……。"
1015203-33 = "聞いているだけで、様々なインスピレーションが湧き上がってきませんか？"
1015203-34 = "……溢れ出してくるイメージに身を委ねていると、次第に夢見心地になって――#n微睡みに落ちてしまうのです。"
1015203-35 = "[ns] （そういえば……初めて出会った時もこんな感じだったような……）"
1015203-37 = "[ns3] \"でも、外で寝るのは危ないよ。\"\n[ns4] \"寮に戻ったら？\""
1015203-40 = "あら。私のことを心配してくださるのですね。"
1015203-41 = "ありがとうございます。ですが、ちょっと難しいかと。"
1015203-42 = "戻ったら……寮監隊の検問に引っかかってしまいますから。"
1015203-43 = "[s] \"無許可で出てきたの！？\""
1015203-44 = "「多くを経験し、多くを思考し、多くを創作せよ」――"
1015203-45 = "名作を生み出すための三要素です。"
1015203-46 = "こういった青春のちょっとした寄り道も、多様な経験の一つ。#nきっと貴重なインスピレーションをもたらしてくれることでしょう。"
1015203-47 = "……腑に落ちない、というお顔ですね。"
1015203-48 = "分かりました。では、安心して眠れる場所を探してみます。"
1015203-49 = "例えば……先生のオフィス、とか。"
1015203-50 = "ふふっ、こうしてお会いしたのも何かのご縁。#n一晩だけ、お世話になってもよろしいでしょうか？"
1015203-51 = "決して、お仕事のお邪魔にはなりませんから。"
1015203-52 = "[s] \"ツムギがそう言うなら……。\""
1015203-55 = "（そうして、私たちはシャーレに向かい……）"
1015203-56 = ""
1015203-58 = ""
1015203-59 = ""
1015203-60 = "この書類の山は、一体……。"
1015203-61 = "見ているだけで、糸車に指を刺された姫のように眠ってしまいそうです。"
1015203-62 = "この場合は紙で指を切って眠りにつく、が正しいでしょうか？"
1015203-63 = ""
1015203-65 = ""
1015203-66 = "何はともあれ、私にお手伝いできることはありますか？"
1015203-67 = "[s] \"自分でやらないといけないものが多くて……。\""
1015203-68 = "それでしたら……。"
1015203-69 = "お仕事が捗るよう、穏やかな曲を演奏しましょう。"
1015203-70 = "[s] \"いいの？お願いするね！\""
1015203-71 = ""
1015203-73 = ""
1015203-75 = "（ツムギの優しい音色がオフィスを満たしていく……）"
1015203-76 = "（おかげで集中力が上がった気がした……！）"
1015203-77 = ""
1015203-80 = "（しかし、それも束の間……）"
1015203-81 = ""
1015203-84 = "（眠気が……押し寄せてくる……）"
1015203-85 = ""
1015203-88 = "ふふっ、まだですよ。"
1015203-89 = ""
1015203-92 = "[ns] \"……！？\""
1015203-93 = "もうまぶたが限界のご様子。"
1015203-94 = "ですが、ご心配なく。"
1015203-95 = "私が「とっておきの目覚まし」を奏でて差し上げます。"
1015203-96 = "[s5] \"よ、よしっ！このままデスメタルをお願い！\"\n[s6] \"勢いで、一気に終わらせるぞ……！\""
1015203-99 = "ふふっ、その意気です。"
1015203-100 = "では、このリズムで参りましょう。"
1015203-101 = "眠りを誘う糸車を打ち壊し、行く手を阻む茨を焼き尽くすのです。"
1015203-102 = ""
1015203-104 = ""
1015203-105 = ""
1015203-106 = "さあ、準備はよろしいですか？"
1015203-107 = "[s] \"いつでも……！\""
1015203-108 = "それでは、行きます……！"
1015203-109 = "[s] \"う、うおおお……！！\""
1015203-111 = "（その日、シャーレのオフィスにはデスメタルが絶え間なく響き渡った）"
1015203-112 = "（爆音に急き立てられるように、なんとか仕事を終わらせた……）"
