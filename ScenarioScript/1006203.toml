[translation]
1006203-1 = "학원 생활"
1006203-2 = "밀레니엄 스쿨 캠퍼스"
1006203-3 = "(토키의 요청을 듣고 밀레니엄 학원으로 향했다.)"
1006203-7 = "와 주셨군요. 선생님."
1006203-8 = "바쁘신 중에 시간을 내 주셔서 감사합니다."
1006203-9 = "[s] \"곤란한 일이라는 게 뭐야?\""
1006203-10 = "그게……"
1006203-11 = "우선은 이 편지를 봐 주셨으면 합니다."
1006203-12 = "학교로부터 도착한 편지입니다만, 제가 이해한 내용이 맞는지 확신이 들지 않아."
1006203-13 = "이런 분야의 전문가이신 선생님의 조언을 듣고 싶었습니다."
1006203-14 = "(토키로부터 편지를 받아 들었다.)"
1006203-16 = "[ns1] \"출석 일수 부족으로,\"\n[ns2] \"유급 경고, 라는 뜻이겠는데……?\""
1006203-19 = "과연, 제가 이해한 내용과 다름이 없군요. 즉……"
1006203-20 = "별 의미 없는 것이었군요."
1006203-21 = "그러면 오늘도 보좌를 시작하도록 하지요."
1006203-26 = "[ns3] \"아니, 아니! 충분히 큰일인데요?!\"\n[ns4] \"상담해 준 건 고맙지만, 어째서?!\""
1006203-29 = "애초에 유급이라면 한 번 경험해 본 일이기도 하고. 한 번 더 당한다고 해서 달라질 것은 없겠지요."
1006203-30 = "오히려 그만큼 선생님을 더 보좌할 수 있게 된다거나."
1006203-31 = "C&C로서 활동할 수 있는 기간이 늘어나는 것이니, 좋은 일이라고 볼 수 있지 않을까요?"
1006203-32 = "[s5] \"아니니까! 절대 그런 일 아니니까!\"\n[s6] \"지금까지는 어떻게 괜찮았던 거야?!\""
1006203-35 = "예전에는 일종의 특례를 받아, 출석 일수를 인정받을 수 있었습니다."
1006203-36 = "그러나 지금은 더 이상 그럴 수 없는 사정이 되었기에, 결과적으로 출석 일수가 모자란 것으로 처리된 모양입니다."
1006203-43 = "잠깐만요. 지금 어떤 생각이 머릿속을 스쳤습니다."
1006203-44 = "만일 선생님을 모시는 것이 밀레니엄 사이언스 스쿨에서 특례로 인정된다면……?"
1006203-49 = "말씀드려 놓고 보니 그것도 좋은 생각 같군요. 선생님. 이 참에 밀레니엄 사이언스 스쿨로 완전 전근을 오지 않으시겠습니까?"
1006203-50 = "[s7] \"아니, 그건 여러 가지로 곤란하고 말이지……\"\n[s8] \"다른 방법을 찾아보자. 이 공문에서도 분명……\""
1006203-53 = "그렇습니까……"
1006203-54 = "분명히 공문에서는, 이제부터라도 성실하게 수업에 참여하고 강의를 받으며 학교에서의 일상을 계속해 나간다면."
1006203-55 = "지금까지의 상황을 생각해서라도, 출석 일수를 배려해 줄 수 있다고 쓰여 있긴 했습니다."
1006203-56 = "[s] \"알았다! 그러니까 '평범한 학원 생활'이 필요한 거였구나!\""
1006203-57 = "학원 생활……이요?"
1006203-58 = "선생님께서 그렇게 흥분하시다니, 도대체……"
1006203-59 = "[s9] \"무서워?\"\n[s10] \"낯설어?\""
1006203-62 = "……"
1006203-63 = "잘 알지 못하는 것들에게는, 그런 감정을 느끼기 마련이라고 하더군요."
1006203-64 = "솔직하게 말씀드리자면, 어떻게 행동해야 할지 짐작조차 되지 않습니다."
1006203-65 = "[s] \"내가 옆에서 도와줄게!\""
1006203-66 = "서, 선생님?"
1006203-67 = "갑자기 그렇게 팔을 잡아 끌으셔도…… 선생님? 선생님?"
1006203-72 = "(그렇게 토키의 '평범한 학원 생활'이 시작되었다.)"
1006203-73 = "(수업까지 함께 할 수는 없는 일이라, 강의에 출석시키고 그 광경을 지켜보기로 했지만……)"
1006203-75 = "교실"
1006203-76 = "그러면, 오늘의 원격 강의를 마무리하겠습니다."
1006203-77 = "모두들 집중력을 놓치지 않고 끝까지 잘 들어주어서 고마워요."
1006203-78 = "아스마 토키 양. 복습하는 의미에서 이 문제를 풀어 보겠습니까?"
1006203-82 = "……"
1006203-83 = "문제를 푼다는 것은, 바꾸어 말해 문제를 해결하는 것……"
1006203-84 = "풀리지 않는 문제가, 앞을 가로막을 때에는……"
1006203-85 = "정면으로 돌파할 줄도 아는 것이 에이전트의 소양이라고 할 수 있을 것입니다!"
1006203-87 = "뭐, 뭐 하는 겁니까?! 화면이……!"
1006203-88 = "안 됩니다. 토키 양! 수업 중에 C&C의 도구를 사용해서는 안 돼요!"
1006203-89 = "그것도 밀레니엄 스쿨의 전산 방화벽을 단숨에 해제시킬 정도로 고성능 해킹 툴이라면 더더욱!"
1006203-90 = "계속 이러면 출석을 인정할 수 없게 됩니다!"
1006203-91 = "!?"
1006203-92 = "선생님, 이럴 때는 어떻게 해야 하죠?"
1006203-93 = "[s] \"그냥 정직하게 문제를 풀면 되는 일 아니었어?\""
1006203-94 = "그런 게 가능했다면, 세상엔 수많은 다툼도 일어나지 않았을 것이고, 마침내 평화라는 것도 찾아왔을 테지요. 참으로 안타까운 일입니다."
1006203-95 = "[s] \"그러니까 그 부분을 어떻게 좀!\""
1006203-96 = "……어쩔 수 없죠. 성실하게 문제를 풀어 보도록 하겠습니다."
1006203-105 = "토키 씨. 지금부터 카페에 갈 건데, 같이 갈래?"
1006203-106 = "?!"
1006203-107 = "선생님. 어떻게 하죠?"
1006203-108 = "[s] \"즐겁게 다녀와. 너무 긴장하지 말고.\""
1006203-109 = "하지만……"
1006203-110 = "[s] \"친구와 카페에서 시간 보내기라니, 그거야말로 평범한 학원 생활이지!\""
1006203-111 = "그, 그런가요……?"
1006203-112 = "그렇다면 선생님도 함께 하시는 게 어떨까 합니다만."
1006203-113 = "[s] \"학생들의 교제에 어른이 함부로 끼어드는 건, 참으로 몹쓸 짓이란다.\""
1006203-114 = "그건 도대체 무슨 말씀이시죠……?"
1006203-115 = "선생님? 선생님?!"
1006203-117 = "(자기를 혼자 두지 말라는 듯한 눈동자로 바라보는 토키를, 흐뭇한 마음으로 전송했다.)"
1006203-118 = "(그리고……)"
1006203-120 = "콰아아앙-!!"
1006203-121 = "[ns] \"왜?!\""
1006203-122 = "꺄아아아악?!"
1006203-126 = "뭐…… 뭐야, 이 메이드……"
1006203-127 = "우린 그냥…… 혹시 다 팔지 못하고 남을지도 모를 케이크들을…… 미리 무료로 먹어 없애 주려고 한 것 뿐인데……"
1006203-135 = "그런 것을 우리는, 협박에 의한 무전취식이라고 정의하기로 했습니다."
1006203-136 = "이 자식! 밀레니엄의 메이드는 건드리지 말라는 소문이 있기는 하지만, 우리가 그런 소문에 겁 먹을 줄 아냐?!"
1006203-137 = "……"
1006203-138 = "과연, 이것이 '학생'의 일상이로군요."
1006203-139 = "C&C 부실에 있던 책에서 본 적이 있습니다."
1006203-140 = "시비를 걸어오는 문제아들을 쓰러트려…… 반쪽짜리 가위를 찾아, 학교를 정복하는 것 또한, 학생의 본분 중 하나라고!"
1006203-141 = "무슨 헛소리야!"
1006203-142 = "[ns] \"아니, 아니니까! 그런 일상 없으니까!\""
1006203-143 = "이렇게 된 이상, 진심으로 응하겠습니다."
1006203-144 = "최대 성능의 일부밖에는 내지 못하는 상태입니다만, 저의 진심을 내보이는 데 이만한 것도 없을 것입니다."
1006203-145 = "파워드 슈트 시스템, <아비 에슈흐>로 이행–"
1006203-147 = "(그 이후로도 연이어 폭주하려는 토키를 어떻게든 뜯어말렸다.)"
1006203-150 = "선생님? 괜찮으십니까?"
1006203-151 = "[s] \"수명이 몇 년 줄어든 것 같아……\""
1006203-152 = "……"
1006203-153 = "죄송합니다. 잘 모르겠지만……"
1006203-154 = "제가 또 무언가 심려를 끼쳐 드린 모양이군요."
1006203-155 = "보좌를 해야 하는 몸으로서, 이런 식으로 선생님께 폐를 끼치기만 해서는……."
1006203-156 = "이래서야 보좌로서는 자격 미달이란 말밖에……."
1006203-157 = "[s11] \"아니. 그건 토키 잘못이 아니야. 모르는 건 배워나가면 되는 거니까.\"\n[s12] \"다시 한번 차근차근 처음부터 시작해 보자!\""
1006203-160 = "……."
1006203-161 = "네. 선생님께서 그렇게 말씀하신다면……"
1006203-162 = "그나저나, 선생님."
1006203-167 = "평범한 학원 생활이란, 무척이나 어렵군요."
1006203-169 = "(진심으로 그렇다는 듯이, 쿨한 표정을 지은 채 눈 앞에 서 있는 토키를 바라보며.)"
1006203-170 = "(작은 한숨을 내쉬며 고개를 끄덕이는 것 밖에…… 달리 할 수 있는 일은 없었다.)"
