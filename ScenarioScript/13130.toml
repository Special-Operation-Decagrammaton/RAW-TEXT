[translation]
13130-1 = "제13화;인질"
13130-9 = "……다녀왔습니다……."
13130-13 = "어서와, 시로코 선배."
13130-14 = "……아, 그리고 문 좀 꼭 닫아줘. 바람 들어오잖아."
13130-15 = "으, 응."
13130-20 = "다녀오셨어요. 선배. 씻고 오신다더니 빨리 오셨네요?"
13130-21 = "아, 그리고 선배. 불도 좀 켜줘. 이제 슬슬 일어나야 하니까."
13130-23 = "응."
13130-27 = "이야~ 세리카 쨩, 선배를 그렇게 부려 먹으면 나중에 벌받을 지도 모른다고?"
13130-28 = "뭐, 뭐야? 누가 부려 먹긴?"
13130-29 = "아무도 귀찮아서 불을 켜려고 하지 않았잖아!"
13130-34 = "으음……. 선생님 소식은?"
13130-36 = "……좀 전 뉴스 말곤 한 번도 없었어요."
13130-37 = "즉, 병원으로 실려 갔지만 큰 부상은 없음. 하지만 아직 깨어나지 못하는 것 같다고……."
13130-39 = "으음……."
13130-41 = "그치만 저런 사고에 휘말렸는데도 상처 하나 없다니……. 불행 중 다행이라면 다행이랄까……."
13130-42 = "뭐, 그런 신기한 일을 달고 사는 사람이니까. 그래도 큰일이 아니어서 안심했어."
13130-44 = "……그렇다고 해도, 이제 선생의 도움을 받는 건 포기해야 해."
13130-50 = "방법을 찾지 않으면 안 돼……. 열차포의 권리를 확보하고, 두 번 다시 저런 게 움직이지 못하게 부숴버릴 방법을……."
13130-52 = "다른 학원의 도움을 받는 건……."
13130-54 = "……아니. 선생이 없는 상황에선 어렵겠지."
13130-55 = "도움을 청하려고 해도 시간이 부족해. 채권단 총회가 열리는 중앙역까지의 거리를 생각하면 지금 슬슬 출발해야 해."
13130-59 = "……."
13130-60 = "하아…… 마음의 준비를……."
13130-64 = "그런데 노노미는? 안 보이는데……?"
13130-65 = "아, 노노미 선배는 볼일 있다고 잠깐 밖에 나갔어요."
13130-66 = "그러게, 나간 지 꽤 되지 않았어……? 이제 슬슬 돌아와야 할 텐데?"
13130-68 = "……으음. 살짝 걱정되기 시작하는걸. 노노미 쨩, 무슨 일이려나……."
13130-77 = "……. 약속대로 혼자 왔어요. 집사님."
13130-84 = "그래. 알고 있어."
13130-90 = "학교에서부터 계속 따라왔었거든. 다행히 미행은 없더군."
13130-91 = "당신은……?! 집사님은 어디에 있죠?"
13130-96 = "……저는 여기 있습니다. 영애님."
13130-97 = "그런데 별일이네요. 영애님 쪽에서 먼저 저를 찾아오다니. 무슨 일이시죠?"
13130-98 = "그게……."
13130-99 = "설마…… 생각이 바뀌신 겁니까? 하이랜더로 돌아와서 학생회장이 되시겠다고요?"
13130-100 = "잘 생각하셨습니다! 그거라면 저 열차포의 소유권을 저희 네프티스가 독점할 방법이 분명 있을 거예요."
13130-101 = "아니에요……! 저는 대책위원회를 떠나지 않을 거예요……! 그게 아니라……."
13130-105 = "그러면요……? 왜 저를 찾아오신 거죠?"
13130-106 = "……. 제가 하이랜더의 학생회장이 되지 않더라도……"
13130-107 = "분명 열차포를 해결할 방법이 네프티스에겐 있을 거예요……."
13130-108 = "……."
13130-109 = "네프티스는 사모펀드의 일원이기도 하고, 또 하이랜더와 협력 관계이니…… 사모펀드보다 훨씬 더 거대한 기업 그룹이잖아요."
13130-110 = "네프티스의 모든 힘과 권력을 이 문제에 집중한다면 분명……."
13130-116 = "대책위원회, 아비도스 학생회……. 그 둘은 시로코 쨩과 호시노 선배에겐 그 무엇과도 바꿀 수 없는 소중한 장소예요……."
13130-117 = "설령 이름뿐일지라도…… 그걸 지킬 방법이 있다면…… 뭐든 방법을……."
13130-123 = "……크크, 크크크크!! 정말이지 너무 순진하시군요, 영애님. 세상을 바라보는 관점이 얄팍해요."
13130-124 = "결국 그 어떤 희생도, 대가도 없이 원하는 것을 가지고 싶다는 거잖습니까?"
13130-125 = "……!"
13130-126 = "아시겠습니까, 영애님? 세상에 그런 건 없습니다. 모든 것은 기브앤테이크. 억지를 부린다고 해결되는 것은 아무것도 없어요."
13130-127 = "그런 억지에 누가 귀 기울여 줄 것 같습니까?! 세상을 너무 모르는군요! 이래서야 중학생 때랑 다를 게 없지 않습니까."
13130-128 = "방법이라면 이미 말씀드렸습니다. 영애님이 하이랜더로 재입학하시면 됩니다. 그럼 모든 게 해결될 거예요."
13130-129 = "그, 그건……."
13130-130 = "뭐, 지금이라도 영애님을 강제로 재입학해 버리는 것도 가능하지만요. 하지만 기업의 영애님께 어찌 그럴 수야 있겠습니까."
13130-131 = "……. <사모펀드>에 열차포를 뺏기지 않을 방법…… 그거야 당연히 있습니다. 저희가 지금 준비하고 있는 계획이 있어요."
13130-132 = "그, 그게 뭐죠?!"
13130-133 = "잘못을 비십시오. 영애님."
13130-134 = "……!!"
13130-135 = "억지를 부려서 세인트 네프티스 그룹에 반항하고 손해를 끼친 것에 대해 사과하고 용서를 구하세요. 영애님. 그럼 알려드리겠습니다."
13130-137 = "……어이."
13130-138 = "끼어들지 마세요. 스오우 군. 이건 중요한 겁니다."
13130-145 = "……네. 알겠어요."
13130-146 = "죄송합니다. 집사님…… 네프티스 기업과 모두에게……"
13130-147 = "손해를 끼치게 되어……. 죄송해요……."
13130-148 = "좋습니다, 좋아요. 화가 좀 풀리네요."
13130-149 = "그 정도면 됐습니다…… 그럼 저희의 계획을 알려드리죠."
13130-155 = "원래 계획은 이랬습니다."
13130-156 = "대책위원회가 열차포의 존재를 알게 된다면, 자신들의 사상과 반대되는 이 물건을 그대로 놔둘 리 없다고 생각했습니다."
13130-157 = "어떻게든 총회에 참석해서 계약을 유지하려고 하겠죠. 자신들의 강력한 조력자인 <샬레>의 선생의 도움을 받아서요."
13130-158 = "아마 그 학생회장처럼 열차포를 아비도스의 소유로 둬서 누구도 손댈 수 없게 만들려고 하던가, 아니면 어떻게든 찾아내서 부수던가…… 어느 쪽이든 움직일 거라 생각했습니다."
13130-161 = "그 선생의 힘은 이미 충분히 확인했습니다. 그건…… 위험하죠."
13130-162 = "<샬레>의 지원을 받는 대책위원회는 그 카이저PMC마저도 막아내는 것이 불가능했습니다. 심지어 그때는 그 타카나시 호시노도 없었는데도."
13130-166 = "그래서 <사모펀드>는 엄청난 숫자의 병력을 아비도스로 끌어모았죠. 그 정도라면 천하의 <샬레>라도 돌파하지 못할 거라고 생각하겠지만……."
13130-167 = "하지만 그 선생은…… 그리고 당신들은 그런 것 따윈 개의치 않을 거구요."
13130-170 = "그리고…… 그거야말로 저희가 바라던 그림이었죠."
13130-172 = "……네?!"
13130-173 = "<샬레>와 <사모펀드>의 충돌. 둘 다 엄청난 피해를 입겠죠. 누가 이기든 상관없습니다."
13130-174 = "그렇게 두 세력이 공멸해 갈 때, 그때 저희가 동맹을 투입, <사모펀드>와 대책위원회 모두를 처리해버리면 되니까요."
13130-175 = "……?! 네?!"
13130-176 = "동맹……?! 자, 잠깐만요?! 그 말은……!!"
13130-177 = "네. 저희의 목적은 <사모펀드> 녀석들을 처리하고 <열차포>를 독점하는 것입니다."
13130-178 = "……!!!"
13130-179 = "그, 그런…… 처, 처음부터 그럴 계획으로……?!"
13130-180 = "물론이죠!! 그 열차포는 원래 저희 것입니다! 누구에게도 뺏길 수 없어요!!"
13130-181 = "그게 있다면 네프티스의 부활을 10년은 더 앞당길 수 있을 겁니다."
13130-182 = "설마 사기꾼에게 속았다고 생각하고 내다 버린 그 고철이 진짜로 동작할 거라곤……."
13130-186 = "그랬는데 말이죠……."
13130-187 = "하지만 그 선생이 아직 아비도스에 돌아오지 않았더군요. 당신들이 총회에 참석하려면 샬레의 도움이 반드시 필요할 텐데……."
13130-191 = "그래서 계획이 틀어지나 불안했는데……. 큭큭큭……."
13130-196 = "큭큭큭…… 그런데 영애님이 이렇게까지 저희를 도와주실 줄은."
13130-201 = "당신은 이용당한 거야. 영애님."
13130-211 = "꺄악……?!!"
13130-215 = "(아아…….)"
13130-216 = "(그랬던 건가요…….)"
13130-222 = "유메 선배…… 어째서…… 어째서……."
13130-223 = "어디 있는 거예요…… 선배…… 제가 잘못했어요…… 제발…… 제발……."
13130-224 = "선배……. 으흐흐흑…… 흐흐흑……. 제가, 제가 잘못했어요…… 제가……."
13130-228 = "……. 유메 선배……. 으흐흐흑……."
13130-230 = "(아아…….)"
13130-231 = "(오늘도…… 당신은 원하는 걸 찾지 못했나 보네요…….)"
13130-232 = "(그리고 내일 또다시 그 황야를 헤매는 일을 반복하겠죠…….)"
13130-238 = "(매일 매일…… 지치지도 않고……. 어째서…….)"
13130-239 = "(어째서……? 대체 무엇을 위해서……?)"
13130-240 = "(그냥 전부 잊어버리고 아비도스를 떠났다면 좋았을 텐데…….)"
13130-244 = "(이곳에서 있었던 일들은 전부 꿈이었다고, 그러니 그저 잊어버리면 된다고 생각했더라면……)"
13130-245 = "(그러면 최소한 고통스럽진 않았을 텐데…….)"
13130-246 = "(어째서…….)"
13130-252 = "(저는…… 어째서 이곳에 남기로 했었던 걸까요…….)"
13130-253 = "(그저 잊어버렸으면…… 모두 꿈이었다고 해버렸으면 좋았을 텐데…….)"
13130-257 = "(저는…….)"
13130-261 = "호시노 선배……."
13130-266 = "……수고했습니다. 스오우 군. 영애님의 학생증과 카드를 뺏으세요."
13130-267 = "……하이랜더로 돌아와서 학생회장이 되라고 운운한 건 거짓말이었나?"
13130-268 = "뭐, 그렇죠. 우리 말을 듣지 않는 사람이 권력을 쥐면 어떻게 되겠습니까."
13130-269 = "그녀는 대신 훌륭한 인질이 되어 줄 겁니다."
13130-270 = "가문의 영애를 인질로……?"
13130-271 = "이사회에서 허락한 사안이에요. 아아, 물론 해를 끼칠 생각은 없습니다."
13130-272 = "이제 대책위원회에 연락해서, 채권단 총회에 참석하라고 할 겁니다."
13130-273 = "만약 우리의 말을 듣지 않는다면 영애님은 하이랜더 학원으로 전학 보내버릴 거라고요."
13130-275 = "……총회에 참석해서? 그 계약을 유지하라고 요구하진 않을 거 아냐?"
13130-276 = "물론입니다. 그 반대입니다."
13130-277 = "쿠치나시 유메와 타카나시 호시노의 <아비도스 학생회>가 가짜 조직이었음을 자백하라고 협박해야죠."
13130-279 = "과연."
13130-280 = "대책위원회가 샬레의 지원 없이 거기까지 도달할 수는 없을 테지만, 그래도 영애님을 되찾기 위해 최대한 노력하겠죠."
13130-281 = "대책위원회가 최대한 난리를 부려줘야 저희가 <사모펀드>를 마무리하기 쉬워집니다."
13130-282 = "그리고 그들이 사모펀드의 봉쇄를 뚫는다고 해도, 학생회를 부정해야 하니 <열차포>는 너희의 것이 될 거고. 완벽하군."
13130-283 = "그럼 영애님을 약속된 장소로 옮겨주십시오."
13130-284 = "그럼 저는 대책위원회에 연락하러 가겠습니다."
13130-294 = "(치익) ……죄송해요 호시노 선배…… 제가…… 실수했어요……."
13130-295 = "쿨럭, 쿨럭……. 시로코 쨩…… 아야네 쨩…… 세리카 쨩……. 쿨럭. 호시노 선배……"
13130-299 = "저는…… 저는 처음부터 여기 있어선 안 되는 사람이었어요……."
13130-300 = "저는 네프티스니까…… 가해자니까……"
13130-301 = "저는…… 죄책감 때문에 억지로 여기에 남아있었던 것뿐이니까……. 그러니 하이랜더로 돌아가도…… 상관없던 거예요……."
13130-302 = "저는 선배가 죄책감에서 벗어나 자유롭게 살아갔으면 좋겠어요…… 그러니……."
13130-303 = "저 때문에 유메 회장을…… 아비도스 학생회를 가짜로 만들지 마세요……."
13130-304 = "분명 선생님과 함께라면…… 열차포를 파괴할 방법을……. 분명……."
13130-313 = "……그렇게 됐습니다. 타카나시 호시노, 그리고 대책위원회 여러분."
13130-314 = "어떻게든 채권단 총회에 참석해서 아비도스 학생회가 사칭이었다는 걸 자백해 주세요."
13130-315 = "타카나시 호시노와 쿠치나시 유메의 학생회 활동 그 모든 게 비인가였다는 걸 공증해 주시면 됩니다."
13130-316 = "그러면 영애님은 하이랜더의 지하 감옥이 아니라 여러분들과 함께 지낼 수 있을 겁니다."
13130-320 = "……해가 떠오르고 있군요. 총회가 얼마 남지 않았습니다."
13130-321 = "그럼 현명한 선택 하시길."
13130-326 = "……."
13130-329 = "……노, 노노미 선배."
13130-330 = "그, 그런……."
13130-331 = "노노미……."
13130-333 = "그렇군. 그렇게 된 거려나."
13130-338 = "서, 선배 어디가?!"
13130-339 = "지금 바로 출발해야지. 노노미 쨩을 구하려면 저 녀석이 시키는 대로 하지 않으면 안되잖아."
13130-340 = "뭐, 뭐라고?! 저 말을 따른다고?"
13130-341 = "또다시 내 소중한 사람들을 잃을 수 없어. 유메 선배도 지키지 못했으면서 이제 노노미 쨩 마저도 잃게 된다면…… 선배 실격이겠지."
13130-343 = "그, 그치만 그 병력을 저희만으로는……."
13130-344 = "맞아. 선생님을 기다려야 해. 선배. 분명히 연락이 올 거야."
13130-346 = "……아니. 거기 가는 건 나 혼자야."
13130-351 = "네?!"
13130-353 = "혼자?! 그건 또 무슨 소리야?! 선배 혼자서 그 봉쇄를 뚫을 수 있다고?"
13130-354 = "아아. 가능해. 내가 그러려고 마음먹었으니까."
13130-355 = "……알겠어. 호시노 선배는 노노미를 구한 뒤에 <사모펀드>도, 네프티스도 전부 처리해 버릴 생각이지?"
13130-356 = "……. 끄응."
13130-357 = "뭐어?! 뒷감당을 어떻게 하려고?!"
13130-358 = "뒷감당은 하지 않아도 돼. 내가 <아비도스 학생회>를 부정해버리면, 나는 더 이상 부학생회장이 아니게 되니까."
13130-359 = "그러니 내가 사모펀드를 와해시키고 열차포를 파괴해 버려도, 대책위원회에겐 아무런 피해가 가지 않을 거야."
13130-360 = "무, 무슨 소리야?! 그럼 선배는?!"
13130-361 = "이다음엔 정학, 교정국. 자퇴…… 그리고 키보토스를 떠나는 순서이려나?"
13130-362 = "그러니까 너희는 따라오면 안 돼."
13130-364 = "……!!"
13130-365 = "너희는?"
13130-366 = "너희, 라는 건 정확하게 뭐야?"
13130-371 = "응? 그야, 대책위원회잖아. 대책위원회야말로 선생님이 인증한 진짜 학생회니까. 그게 맞아."
13130-389 = "시, 시로코 선배?! 갑자기 총을……?!"
13130-391 = "시로코 쨩?! 위, 위험하잖아?"
13130-396 = "옥상으로 올라와. 승부야."
13130-402 = "뭐, 뭐야, 뭐야 이거?!"
13130-403 = "스, 승부……?!"
13130-411 = "헤에~ 그런가. 오랜만이네…… 이건."
13130-412 = "청춘 드라마 같아서 설레는걸?"
13130-420 = "자, 잠깐만요……?! 호시노 선배, 시로코 선배?!"
13130-421 = "대, 대체 지금 무슨 일이……. 무슨 바보 같은 일이……."
13130-422 = "어, 어떡하지, 세리카 쨩?"
13130-423 = "당연히 따라가야지!"
13130-429 = "다음화;너희, 그리고 우리"
