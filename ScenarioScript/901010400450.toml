901010400450-40 = "Oh, honestly!"
901010400450-41 = "No... Let's hear them out. I heard someone in Gehenna's working on mind control."
901010400450-42 = "...Like \"NK Mega\"? Something like that."
901010400450-43 = "The blueprints are probably out there. Someone could be trying it here."
901010400450-45 = "I haven't seen any evidence implicating Gehenna. Let's think about it some more."
