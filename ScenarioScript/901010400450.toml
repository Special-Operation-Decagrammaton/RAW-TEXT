901010400450-53 = "Right. This rumor involves Kanesaki Port, but the only people who took it seriously were tourists. They didn't know anything about the crabbing industry."
901010400450-54 = "And that's how the rumor spread so much. The people who shared it didn't even know that the story made no sense."
901010400450-56 = "Always double-check what you read online."
901010400450-57 = "Kuzunoha even has a saying, \"Don't trust the quote next to the photo.\""
901010400450-58 = "I find that quote to be VERY questionable."
