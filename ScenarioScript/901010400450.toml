[translation]
901010400450-6 = "這麼說來，我在調查過程中也遇到了去港口觀光的一般民眾……"
901010400450-7 = "和漁業無關的普通市民，出乎意料地似乎都很認真看待這則怪談。"
901010400450-8 = "有不少人對螃蟹的螯和外殼感到排斥，甚至有人認真相信襲擊居民的螃蟹真實存在。"
901010400450-9 = "就算是這樣，那種假怪談連最基本的查證都沒有就擴散出去，這說得通嗎？"
901010400450-10 = "即便只是看看新聞……不，只要上網搜尋一下，不是馬上就知道那是假的了嗎？"
901010400450-11 = "因為人們對於和自己生活沒有直接關聯的傳聞，並不會有太大的興趣。"
901010400450-12 = "在眼前難以忽視的棘手狀況，從遠處看也不過是齣喜劇罷了。"
901010400450-13 = "而且比起刺激的謊言，平淡的真相不是一點意思都沒有嗎？"
901010400450-14 = "在經過充分的討論之前，只要按一個「讚」就已經傳播給數十、數百個人了。"
901010400450-15 = "感覺像是窺見了現代社會的黑暗面呢……"
901010400450-16 = ""
901010400450-18 = ""
901010400450-20 = "結果人們會相信襲擊居民的螃蟹真實存在，是因為……"
901010400450-21 = ""
901010400450-23 = ""
901010400450-24 = ""
901010400450-27 = ""
901010400450-28 = "#Q;유키노;結果人們會相信襲擊居民的螃蟹真實存在，是因為……\n[as1] 那是實際發生過的事實。\n[as2] 有人施加了催眠，迫使大家相信。\n[as3] 經由無關的人們口耳相傳而迅速擴散。"
901010400450-29 = "……或許是我的說明有所不足吧。"
901010400450-30 = "根據目前為止蒐集到的情報，螃蟹實際襲擊居民的可能性微乎其微。"
901010400450-31 = ""
901010400450-33 = ""
901010400450-34 = ""
901010400450-37 = ""
901010400450-39 = ""
901010400450-40 = "這世上哪有那種東西啊！？"
901010400450-41 = "不……其實有道理。#n我以前好像也有聽說過，格黑娜學園曾經研究過催眠裝置。"
901010400450-42 = "好像叫作「NK-ULTRA」什麼的……"
901010400450-43 = "如果某人手上握有那份設計圖的話，倒也不是沒有可能。"
901010400450-45 = "不過目前沒有證據顯示這次的事件與格黑娜有關……再重新思考一次吧。"
901010400450-46 = ""
901010400450-48 = ""
901010400450-49 = ""
901010400450-50 = ""
901010400450-53 = "是的。這則傳聞雖然以鐘崎港為舞台，#n但是認真看待並加以散播的，卻是和漁業無關的一般人。"
901010400450-54 = "因此，即使怪談裡的螃蟹呈現與現實不同的模樣，也毫不懷疑地就被散播出去了。"
901010400450-56 = "所以大家從網路上獲得的資訊，都要記得多方驗證哦。"
901010400450-57 = "不是還有這種說法嗎？#n「不要相信照片旁邊附上的名言。」──葛葉"
901010400450-58 = "那句話才是我聽過的名言裡，感覺出處最可疑的呢。"
