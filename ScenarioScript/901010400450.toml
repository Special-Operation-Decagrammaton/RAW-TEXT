901010400450-28 = "#Q;유키노;In conclusion, the reason why people believe the killer crabs are real is because...\n[as1] \"It's actually happening.\"\n[as2] \"They're being hypnotized.\"\n[as3] \"The rumor's being spread by the ignorant.\""
901010400450-29 = "...Perhaps my explanation wasn't sufficient."
901010400450-30 = "Based on the information we've gathered so far, it is highly unlikely that a crab has actually attacked a person."
