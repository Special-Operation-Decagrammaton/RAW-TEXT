[translation]
901010400450-6 = "จะว่าไป ตอนกำลังสืบสวน ฉันได้เจอชาวเมืองที่มาเที่ยวท่าเรือด้วย..."
901010400450-7 = "น่าแปลกที่ชาวเมืองทั่วไปที่ไม่ได้เกี่ยวข้องกับการประมง กลับเชื่อตำนานเมืองนี้กันอย่างจริงจังเลยละ"
901010400450-8 = "มีหลายคนที่รู้สึกหวาดๆ กับก้ามปูหรือกระดองปู และยังมีคนที่เชื่อจริงๆ ด้วยว่าปูที่ทำร้ายคนมีอยู่จริง"
901010400450-9 = "ถึงอย่างนั้นก็เถอะ เรื่องเล่าปลอมๆ แบบนี้จะแพร่กระจายโดยไม่มีใครตรวจสอบเลยเหรอ มันจะเป็นไปได้ยังไง?"
901010400450-10 = "แค่ติดตามข่าว... ไม่สิ แค่ลองหาในอินเทอร์เน็ตสักครั้ง ก็รู้แล้วไม่ใช่เหรอว่าเป็นเรื่องโกหกน่ะ?"
901010400450-11 = "คนส่วนใหญ่ไม่ได้สนใจข่าวลือที่ไม่เกี่ยวข้องกับชีวิตของตัวเองมากนักหรอก"
901010400450-12 = "เรื่องที่เมื่ออยู่ตรงหน้าแล้วเป็นสถานการณ์น่าลำบาก แต่เมื่อมองจากไกลๆ ก็เป็นแค่เรื่องขบขันเท่านั้นละ"
901010400450-13 = "อีกอย่าง ถ้าเทียบกับเรื่องโกหกที่สร้างความฮือฮาแล้ว ความจริงที่ตรงไปตรงมามันก็ไม่น่าสนใจเท่าไรนี่นา?"
901010400450-14 = "การกด 'ถูกใจ' แค่ครั้งเดียวโดยไม่ทันได้ตรวจสอบหรือถกเถียงกันให้ดี ก็ทำให้ข้อมูลแพร่ไปถึงผู้คนหลายสิบหรือหลายร้อยคนแล้ว"
901010400450-15 = "เหมือนได้เห็นด้านมืดของสังคมยุคปัจจุบันเลยนะ..."
901010400450-16 = ""
901010400450-18 = ""
901010400450-20 = "โดยสรุปแล้ว เหตุผลที่ผู้คนเชื่อว่าปูที่ทำร้ายคนมีอยู่จริงก็คือ..."
901010400450-21 = ""
901010400450-23 = ""
901010400450-24 = ""
901010400450-27 = ""
901010400450-28 = "#Q;유키노;โดยสรุปแล้ว เหตุผลที่ผู้คนเชื่อว่าปูที่ทำร้ายคนมีอยู่จริงก็คือ...\n[as1] เพราะมันเกิดขึ้นจริง\n[as2] เพราะมีใครบางคนสะกดจิตให้เชื่อ\n[as3] เพราะข่าวลือแพร่ต่อกันในหมู่ผู้ที่ไม่เกี่ยวข้อง"
901010400450-29 = "ดูเหมือนว่าคำอธิบายของฉันจะยังไม่ชัดเจนพอนะคะ..."
901010400450-30 = "แต่จากข้อมูลที่รวบรวมมาในตอนนี้ ความเป็นไปได้ที่ปูจะทำร้ายคนจริงๆ นั้นมีน้อยมากค่ะ"
901010400450-31 = ""
901010400450-33 = ""
901010400450-34 = ""
901010400450-37 = ""
901010400450-39 = ""
901010400450-40 = "เรื่องแบบนั้นมันมีที่ไหนกัน?!"
901010400450-41 = "ไม่หรอก... ก็มีเหตุผลนะ ฉันเคยได้ยินมาว่าเมื่อก่อนสถาบันเกเฮนน่าเคยวิจัยเครื่องสะกดจิตอย่าง#nจริงจังด้วย"
901010400450-42 = "ชื่อว่าอัลตร้า NK หรืออะไรนี่แหละ..."
901010400450-43 = "ถ้ามีใครได้แบบแปลนของมันมา เรื่องนี้ก็ใช่ว่าจะเป็นไปไม่ได้หรอก"
901010400450-45 = "แต่ก็ไม่มีหลักฐานว่าเรื่องนี้เกี่ยวข้องกับเกเฮนน่านะ ลองคิดใหม่อีกครั้งเถอะ"
901010400450-46 = ""
901010400450-48 = ""
901010400450-49 = ""
901010400450-50 = ""
901010400450-53 = "ใช่ค่ะ แม้ข่าวลือนี้จะเกิดขึ้นที่ท่าเรือคาเนะซากิ แต่คนที่เชื่ออย่างจริงจังและนำไปเผยแพร่ กลับเป็นคนทั่วไปที่ไม่ได้เกี่ยวข้องกับการประมง"
901010400450-54 = "เพราะแบบนั้น ต่อให้ปูในตำนานเมืองจะมีรูปร่างแตกต่างจากความเป็นจริง ผู้คนก็ยังเผยแพร่ต่อโดยไม่สงสัยเลยค่ะ"
901010400450-56 = "ถ้าเป็นข้อมูลที่ได้มาจากอินเทอร์เน็ต ทุกคนก็ควรตรวจสอบกับแหล่งอื่นก่อนเสมอนะ"
901010400450-57 = "ก็มีคำพูดนี้ไม่ใช่เหรอ \"อย่าเชื่อคำคมที่เขียนอยู่ข้างรูปภาพ\" - คุซึโนฮะ"
901010400450-58 = "แต่คำพูดนั้นต่างหาก ที่ดูน่าสงสัยเรื่องแหล่งที่มามากที่สุดเท่าที่ฉันเคยได้ยินมาเลย"
