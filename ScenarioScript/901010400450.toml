[translation]
901010400450-6 = "I saw some tourists at the port..."
901010400450-7 = "They weren't fishers or locals, and they were taking this urban legend very seriously."
901010400450-8 = "Some were put off by crab claws or shells, and some seriously believed that crabs were attacking people."
901010400450-9 = "How can such a ridiculous urban legend spread like this?"
901010400450-10 = "If they kept up with the news... Or if they even looked this up online, they would see it's a bald-faced lie."
901010400450-11 = "People don't put much interest in rumors that don't directly affect their lives."
901010400450-12 = "A serious problem for those up close is nothing more than entertainment to those watching from afar."
901010400450-13 = "And let's face it... A spicy lie is much more interesting than a dull reality."
901010400450-14 = "A single \"like\" can spread a rumor to dozens or even hundreds of people before anyone gets a proper word in."
901010400450-15 = "How bleak..."
