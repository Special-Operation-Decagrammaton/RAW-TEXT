[translation]
1006302-1 = "반성실의 입주자"
1006302-2 = "(일단 코유키를 만나기 위해 밀레니엄의 중심부의 한 빌딩으로 향했다.)"
1006302-3 = "(평소에는 거의 들러 본 적이 없었던, 묘하게 경비가 삼엄한 빌딩이었다.)"
1006302-4 = "[s1] \"밀레니엄에 이런 곳이…….\"\n[s2] \"코유키는 이런 곳에 있는 건가?\""
1006302-7 = "……핫! 이 목소리는!!"
1006302-13 = "선생님! 선생님! 여기 있어요, 저 여기 있습니다!"
1006302-19 = "선생님!! 선생니이임-!!"
1006302-20 = "[s3] \"……코유키!?\"\n[s4] \"잠긴 문 안에서 사람 소리가……!?\""
1006302-30 = "선생님!! 정말로 와 주셨군요, 선생님!!"
1006302-31 = "선생님이라면 그 문을 여실 수 있어요!! 선생님이니까! 권한이 있을 테니까!!"
1006302-32 = "선생님만이 도와주실 수 있는 일이에요! 설마 이대로 절 버리시진 않겠죠!?"
1006302-33 = "[s5] \"진정해. 지금 갈게.\"\n[s6] 문을 열고 들어간다."
1006302-44 = "!! 선생님!! 선생님이다!!!"
1006302-45 = "와 주셔서 감사해요!! 진짜 선생님 안 와 주셨으면 진짜……!"
1006302-46 = "……와……. 진짜…… 생각만 해도 끔찍하다."
1006302-47 = "진짜 어떻게 되는 줄 알았다니까요!"
1006302-48 = "네? 무슨 일인데 그렇게 다급하냐고요? 어……."
1006302-49 = "음~~~"
1006302-50 = "그건 이제부터 생각해 봐야 할 문제가 아닐까요?"
1006302-56 = "뭐 할까요? 뭐가 좋으세요?"
1006302-61 = "……아. 이해가 안 가신다고요? 음, 딱히 뭐가 있는 건 아닌데요……."
1006302-65 = "여기는 일단 반성실이고……. 저는 또 잡혀 들어와서 내일 저녁까지 여기 있어야 하는 처지고……."
1006302-66 = "그동안은 밥 먹는 거 제외하고는 아무도 안 와주겠다고 했고……. 그래서……."
1006302-67 = "심심하니까……."
1006302-71 = "뭐, 뭐!! 사소한 건 넘어가도록 하자구요! 중요한 건 이제부터 같이 뭐 하고 놀까 하는 거잖아요!?"
1006302-72 = "[s7] \"아니, 잠깐. 문제가 있는 게 아니었다고……?\"\n[s8] \"놀자니……. 도움 요청은 대체 뭐였던…….\""
1006302-75 = "……네!?"
1006302-76 = "곤란한 거 맞잖아요? 척 봐도 곤란함에 몸부림치고 있는 모습이잖아요!?"
1006302-77 = "[s] \"………….\""
1006302-81 = "[ns9] \"……?????????????\"\n[ns10] \"어딜 봐서요…….\""
1006302-84 = "……하!!"
1006302-85 = "아니, 주변을 한 번 둘러보시라고요! 저는 이런 좁아터진 반성실에 갇혀서 하루 종일 아무것도 못하고 있었는데!"
1006302-86 = "……네?"
1006302-87 = "그 이전에 왜 계속 갇혀 있었냐고요? 그리고 나가려면 나갈 수 있지 않냐고요?"
1006302-88 = "아니아니, 아니. 선생님 하하, 참. 아실 거 아시는 분께서 왜 이러시나……."
1006302-89 = "말씀대로 나가는 것 자체는 문제가 아니다~ 이 말이에요."
1006302-90 = "문제는 언제나 그 뒤죠!!"
1006302-91 = "여길 나갔다는 사실이 들통나는 순간, 세미나랑 C&C 선배들이 또 우르르 몰려와서 저를……."
1006302-95 = "……어으……."
1006302-96 = "……뭐, 그런 연유로, 확실하게 다시 잡히지 않을 수단이 없는 이상은 무리수를 두지 않는다."
1006302-97 = "뾰족한 계획이 생각나기 전까지는, 우선 얌전히 있는 게 최선이다─라는 거죠. 아시겠어요?"
1006302-98 = "[s11] \"……후…….\"\n[s12] (일단 반성의 기미가 없다는 건 알겠다만…….)"
1006302-101 = "자, 자. 그러니까 그런 암울한 이야기는 여기까지 하도록 하고. 지금부터 뭐 하고 놀지를……."
1006302-102 = "음? 뭐라고요?"
1006302-103 = "반성실인 것 치고는 묘하게 생활감이 있다……고요?"
1006302-104 = "후. 눈썰미가 좋으시군요, 선생님. 이것도 다 저의 부단한 노력의 결과죠."
1006302-105 = "하도 자주 잡혀 와서……. 사실상 이 반성실은 제 전용 독방이나 다름없는 곳이니까요. 니하하하하!!"
1006302-106 = "[s] \"………….\""
1006302-107 = "……그렇다면 여기서 역발상!!!"
1006302-108 = "바로 그렇기 때문에! 저 나름대로! 이곳을! 살기 편하게 꾸며 놨죠!! 마치 제 방처럼 말이에요!!"
1006302-109 = "게다가 보세요, 여기! 생활감뿐만이 아니라고요? 선배들이 미처 찾지 못한 구석구석에……."
1006302-113 = "……쨔안!! 이렇게 보드게임도 숨겨놓고!!"
1006302-114 = "[s13] \"……뭐!?\"\n[s14] \"아니, 여기 반성실이라고…….\""
1006302-117 = "니.하.하.하~! 놀라시긴 아직 이르다고요! 저기 소파 밑에는 과자도 숨겨 놨고, 정수기 뒤에는 만화책도 있고!!"
1006302-118 = "같이 놀아줄 분만 와주신다면 그야말로 아늑한 저만의 아지트! 항상 갇혀 있을 수밖에 없다면, 오히려 공간을 꾸미자는 거죠!"
1006302-119 = "어때요, 굉장하지 않나요? 역시 인간은 적응의 동물! 우리는 길을 찾을 것이다!!"
1006302-124 = "……음? 선생님? 뭔가요, 그 표정은?"
1006302-125 = "역시 놀라셨군요. 니하하! 아무리 선생님이라도 역시 이런 전개에는 놀라실 수밖에 없는 걸까요?"
1006302-126 = "[s15] \"확실히 놀랍긴 하네…….\"\n[s16] \"놀랄 방향이 많이 다른 거 같긴 하지만…….\""
1006302-129 = "자, 자. 괜찮아요! 선생님이라면 저도 가진 걸 아끼지 않을 테니까요! 사양하지 마시고 편히 드세요!"
1006302-130 = "하고 싶은 게임도 마음껏 골라 보세요!! 밤은 기니까요! 아직 밤도 안 됐지만~!!"
1006302-131 = "……아."
1006302-132 = "당연하지만 다른 선배들한테 말씀만 하지 말아 주시고요!! 니하하하!"
1006302-137 = "(이후 코유키와 함께, '반성실에서' 저녁 늦은 시간까지 보드게임을 하며 놀아주었다.)"
1006302-141 = "(……당연한 이야기지만, 샬레로 돌아오자마자 세미나에 연락해 코유키의 상황을 잘 보고했다.)"
