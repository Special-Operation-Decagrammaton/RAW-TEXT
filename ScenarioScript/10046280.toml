[translation]
10046280-3 = "이, 이치카 선배!"
10046280-4 = "어라, 여기는 어쩐 일임까? 혹시 길을 헤맨 거라면……."
10046280-5 = "그, 그런 거는 아니고요!"
10046280-6 = "이치카 선배가 혼자서 순찰을 돌고 있다고 해서……."
10046280-7 = "아, 아아. 그렇게 된 건가."
10046280-8 = "……용기 내서 와보기는 했지만……."
10046280-9 = "역시 민폐였으려나……?"
10046280-10 = "이치카 선배한테 내 도움 같은 건 딱히 필요 없을 텐데……."
10046280-11 = "…………."
10046280-12 = "저기, 혹시 도와주지 않겠슴까?"
10046280-13 = "네?!"
10046280-14 = "실은, 일을 맡겨지기는 했지만, 혼자서는 슬슬 한계였어요."
10046280-15 = "모처럼 휴식 중인데 부탁해서 죄송하지만, 조금만 어울려주지 않겠어요?"
10046280-16 = "처, 천만에요!"
10046280-17 = "후후, 고마워요. 그러면, 갈까요?"
10046280-18 = "네, 네!"
