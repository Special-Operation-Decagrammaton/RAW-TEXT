[translation]
1009402-1 = "메이드의 기분!"
1009402-2 = "(모모이는 기세 좋게 장담했지만…….)"
1009402-3 = "(모모이의 말을 듣고 오히려 불안해졌기에, 평소보다 조금 바쁘게 샬레에 도착했다.)"
1009402-8 = "[ns] \"모모이? 나 왔는데…….\""
1009402-12 = "[wa:420]― [log=모모이 메이드]우헤헤……. [wa:2420]과자 [wa:1490]맛있어…….[/log]"
1009402-13 = "[wa:3020]― [log=모모이 메이드]햇살도 따듯하고…… [wa:3080]소파도 푹신하고…….[/log]"
1009402-16 = "[ns] \"모모이 씨? 청소한다며요?\""
1009402-17 = "[wa:630]― [log=모모이 메이드]우웅…… [wa:1590]청소……?[/log]"
1009402-18 = "[wa:2790]― [log=모모이 메이드]할 거야…… [wa:2330]이것만 먹고…… [wa:2370]좀 쉬었다가……[/log]"
1009402-21 = "[wa:1420]― [log=모모이 메이드]어라? [wa:1430]선생님?[/log]"
1009402-22 = "[wa:3340]― [log=모모이 메이드]아, 그렇구나. [wa:1580]이거 [wa:720]아직 꿈이네.[/log]"
1009402-25 = "[wa:670]― [log=모모이 메이드]꿈에서도 선생님을 만날 수 있다니…… [wa:4220]좋은 꿈이네……[/log]"
1009402-26 = "[wa:3160]― [log=모모이 메이드]오늘은 뭔가 [wa:1960]재미있는 일이 생길지도…… [wa:2560]우헤헤…….[/log]"
1009402-29 = "[wa:670]― [log=모모이 메이드]흠냐흠냐……. [wa:3070]아, [wa:1180]보너스 목숨이다…….[/log]"
1009402-32 = "[ns] \"으이그…….\""
1009402-33 = "(모모이를 흔들어 깨우려다가…….)"
1009402-34 = "(왠지 장난이 치고 싶어져서, 딱밤을 때리기로 했다!)"
1009402-40 = "우뮤앗?!"
1009402-41 = "무슨 짓이야, 선생님!"
1009402-45 = "어라, 선생님……?"
1009402-46 = "[ns] \"청~소~해~주~겠~다~며~\""
1009402-47 = "아니, 그건, 이게, 그러니까!"
1009402-48 = "어쩔 수 없는 일이었다고 할까, 누구라도 이렇게 될 운명이었다고나 할까!"
1009402-54 = "그러니까 말이지, 선생님? 나 우선 소파를 정리하려고 했거든?"
1009402-55 = "그런데 막상 하려고 보니까, 미묘하게 배가 고픈 거야!"
1009402-56 = "그 생각이 들자마자 주위를 보니까, 마침 근처에 과자가 있더라고?"
1009402-57 = "그래서 이것만 먹고 제대로 하자고 생각했는데, 먹다 보니까 은근히 잠이 오는 거 있지?"
1009402-58 = "그런 상황에서 아직 정리는 덜 됐지만, 푹신해 보이는 소파가 있었단 말이야!"
1009402-59 = "선생님이 같은 입장이었어도, 일단 한 번 누워 보자는 생각이 들지 않았을까?"
1009402-60 = "[ns] \"계속 이야기해 보세요~\""
1009402-61 = "역시 이야기가 통하네! 그러니까 말이지, 그러니까……."
1009402-65 = "나는 정말로 잠깐만 누워 보려고 했거든? 그런데 소파가 너무 푹신했던 거야!"
1009402-66 = "그러니까 나쁜 건 소파야! 그리고 선생님이고!"
1009402-67 = "[s] \"아니, 거기서 나는 왜.\""
1009402-68 = "이런 푹신한 소파를 준비해서 나를 유혹했잖아! 아무튼."
1009402-69 = "애초에 푹신한 소파라는 건, 따듯한 침대랑 동급의 마수라고? 마물이라고?"
1009402-70 = "사람이 아침에 침대에서 좀처럼 일어날 수 없는 것도 그 때문이고, 소파에 잡아먹혀 핸드폰만 하게 되는 것도 그 때문이란 말이야?"
1009402-71 = "그, 그러니까 이건 일종의 사고였어! 그 뭐냐, 불가사의였다고!"
1009402-72 = "[s] \"불가항력이겠지…….\""
1009402-73 = "아무튼!"
1009402-75 = "(모모이의 필사적인 설명(?)은 그 뒤로도 한참이나 계속되었다…….)"
1009402-77 = "[ns] \"이야기는 다 했어?\""
1009402-78 = "응……."
1009402-79 = "미안해, 선생님……."
1009402-80 = "[s1] \"그래, 그래…….\"\n[s2] \"그러면 이제부터 같이 청소하자.\""
1009402-83 = "어? 청소? 하는 거야?"
1009402-84 = "애초에 청소해 주겠다고 말하고 온 거 아니냐고? 생각해 보니까 그러네?"
1009402-85 = "그렇지만…… 평소에 선생님이 청소를 잘해 뒀으면, 굳이 내가 청소를 할 필요는 없지 않을까."
1009402-86 = "어, 어디까지 뻔뻔해질 생각이냐고? 어, 어쩔 수 없잖아!"
1009402-87 = "[s3] \"역시 근본적인 문제는!\"\n[s4] \"우리 둘 다 청소하기 싫어해서가 아닐까!\""
1009402-90 = "옳소! 역시 선생님, 뭘 좀 아네!"
1009402-97 = "도, 도망가지 말고 빗자루를 들라고……? 으윽……!"
1009402-100 = "알았어! 알았다고! 하면 되잖아! 으으, 메이드의 기분이란 건 이런 거였어?!"
1009402-102 = "(그렇게, 모모이와의 <샬레 청소 대작전>이 성대하게 개최되었다…….)"
1009402-118 = "해냈다!"
1009402-119 = "이야아~ 이거, 하면 되는구만! 그렇지, 선생님?"
1009402-120 = "수고 많았다고? 후훗~ 무슨 말씀을! 나에겐 이제부터가 실전이야!"
1009402-121 = "[s] \"갑자기 불길한 예감이 들기 시작했다.\""
1009402-122 = "후후후…… 직감이 늘었구만. 선생님도."
1009402-123 = "생각해 봐! 메이드라는 건 결국 고용된 사람인 거잖아?"
1009402-124 = "다른 누군가를 위해 집안일이나 이런저런 일들을 대신해 주고, 그 보상을 받는 직업이잖아?"
1009402-125 = "[s] \"그렇지……?\""
1009402-126 = "그러니까 고용주인 선생님은, 이제부터 메이드인 나에게 보수를 지불해야 하는 거야!"
1009402-127 = "[s] \"억울하다! 청소는 나도 같이했는데!\""
1009402-128 = "어허! 원래 사람은 자기 사는 곳의 청소 정도는 스스로 해야 하는 법이라고!"
1009402-129 = "[s] \"그 말을 모모이에게 들으니까 세 배로 억울해!\""
1009402-130 = "어쨌든 선생님은 나에게 일당을 지불해야 할 의무가 있는 것이오!"
1009402-131 = "그래서 뭘로 지불하면 되는 거냐고?"
1009402-132 = "후후후…… 그건 바로……!"
1009402-136 = "나랑 하루 종일 같이 놀아 주면 돼!"
1009402-137 = "그걸로 충분하냐고? 그리고 뭘 하고 놀면 좋을지 모르겠다고? 그럴 줄 알고 이미……."
1009402-138 = "이렇게! 게임기도 한가득 가져왔으니까!"
1009402-140 = "(아무튼 그렇게 결과적으로 깨끗해진 방에서, 모모이와 신나게 게임을 했다.)"
1009402-141 = "(모모이가 자꾸 무릎 위에 앉아 시야를 가리려 해서, 몇 번이나 자세를 고쳐 앉아야만 했다.)"
1009402-142 = "(그리고…….)"
1009402-144 = "들었어요? 샬레의 선생님 말이에요."
1009402-145 = "들었다마다요. 세상에, 학생에게 메이드복을 입히는 것도 모자라서 이런저런 일까지 시킨다지 뭐예요……."
1009402-147 = "(어째 샬레의 평판이 점점 더 이상한 방향으로 향하는 느낌이 들었다…….)"
