[translation]
10045010-1 = "제1화;개막! 백야수상제!"
10045010-3 = "안녕하세요, 여러분! 드디어 찾아왔습니다!"
10045010-4 = "백귀야행의 마츠리운영부에서 주관하는 수상 이벤트……!"
10045010-5 = "<백야수상제>의 화려한 개막이!"
10045010-9 = "와아! 뜨거운 성원 고마워요, 냥냥!"
10045010-10 = "백야수상제는 100명의 선수가 다양한 미션을 수행하며 최후의 생존자를 가리는 이벤트!"
10045010-11 = "우승자에겐 막대한 상금과 백야당의 상품권, 거기에 백야당의 특별 한정 메뉴까지 제공된답니다!"
10045010-12 = "아니, 이렇게 퍼주면 뭐가 남냐고요? 백야당 괜찮은 거냐고요?"
10045010-13 = "괜찮습니다! 여러분이 남으니까요……!"
10045010-18 = "여기서…… 해설로 와 주신 스페셜 게스트를 소개해 드리겠습니다!"
10045010-19 = "불철주야 수많은 학생을 챙겨주시는 키보토스의 희망!"
10045010-20 = "때로는 엄격하게, 때로는 부드럽게…… 하늘에 울려 퍼지는 그 명성! 이제는 모르는 사람을 찾기 더 어려운—"
10045010-21 = "샬레의 선생님입니다! 모두 박수로 환영해 주세요!"
10045010-26 = "[ns] \"어…… 여러분, 안녕하세요. [USERNAME]입니다.\""
10045010-27 = "아앗, 선생님! 여기서는 분위기를 띄워야 하니까 뒤에 냥냥을 붙여달라고 했잖아요!"
10045010-28 = "[ns1] \"선생님입니다, 멍멍!\"\n[ns2] \"선생님입니다, 캥캥!\""
10045010-31 = "냥냥이 아니야……?!"
10045010-32 = "자, 선생님이 지켜보는 상황에서! #n훌륭하게 우승의 영광을 거머쥐는 것은 과연 누구일지!"
10045010-33 = "[s] \"쟁쟁한 참가자들이 많아 예상이 안 되네요!\""
10045010-34 = "준비 중인 선수들은 열기 최고조라는 정보가 들어왔습니다! 준비가 조금 늦어지고 있는 것은 열의의 표현일지도 모르겠네요~."
10045010-35 = "그럼 준비가 완료될 때까지 잠시 스폰서의 광고가 있겠습니다!"
10045010-36 = "채널 고정해 주세요, 냥냥!"
10045010-37 = "……."
10045010-38 = "……아, 힘들다. 역시 행사 진행은 쉽지 않네."
10045010-39 = "[s] \"시즈코! 아직 마이크 안 꺼졌어……!\""
10045010-40 = "아, 아앗! 데헷페로~!"
10045010-41 = "시즈코는 덜렁이라 깜빡해 버렸네요! 죄송해요!"
10045010-42 = "그럼 모두 시즈코가 끝까지 힘을 낼 수 있게 응원해 주세요!"
10045010-43 = "그럼 정말로 나중에 다시 봐요, 냥냥!"
10045010-45 = "……시작부터 진행이 깔끔하네. 정말 철저히 준비했나 봐."
10045010-46 = "응? 깔끔하다고? 방금 실수한 거 아니야?"
10045010-47 = "실수일 리가."
10045010-48 = "저건 자기가 밀고 있는 덜렁이 캐릭터성을 강조하기 위한 연출이야."
10045010-49 = "분위기를 끌어올리는 것과, 자신의 어필을 동시에 달성한다……."
10045010-50 = "자칫 부정동향을 일으킬 수 있는 요소를 연출 하나로 자연스레 넘긴 거지."
10045010-51 = "역시 백야당의 간판 아가씨."
10045010-52 = "오……. 그렇구나. 난 전혀 몰랐어. 역시 키쿄는 머리가 좋네."
10045010-53 = "하지만, 질 생각은 없다구?"
10045010-54 = "쓸데없는 경쟁의식 가지지 마. 여긴 우리 말고도 강자가 많으니까."
10045010-62 = "확실히 강자들뿐이네요…… 저, 전율이 느껴져요!"
10045010-63 = "응. 방심할 수 없겠네."
10045010-65 = "그나저나 어떤 종목으로 경기를 하는 거야?"
10045010-66 = "종목은 모두 경기 시작 전에 발표한다고 해. 유연하게 대처하는 것도 중요하게 생각하는 거겠지."
10045010-67 = "(……그러니까 되도록 수영하는 종목만 없었으면.)"
10045010-69 = "잠시 후……."
10045010-71 = "여러분! 오래 기다리셨습니다!"
10045010-72 = "드디어 백야수상제의 첫 번째 경기가 준비됐어요! 과연 어떤 종목일까요?"
10045010-73 = "선생님! 소개 부탁드려요!"
10045010-74 = "[ns] \"백야수상제의 첫 경기는 바로……!\""
10045010-76 = "[log]물총 서바이벌 게임![/log]"
10045010-79 = "[ns3] \"룰은 간단해! 젖으면 바로 탈락!\"\n[ns4] \"필드 밖으로 나가도 실격이야!\""
10045010-82 = "도망칠 곳 없는 해변에서 벌어지는 치열한 전투! #n그리고! 살아남을 수 있는 건 30명까지!"
10045010-83 = "마지막까지 서 있는 것은 누가 될까요?!"
10045010-84 = "[ns] \"그럼 참가자들은 바로 해변으로 이동해 줘, 냥냥!\""
10045010-86 = "……스승님도 텐션이 잔뜩 올라가 있는 것 같네."
10045010-87 = "일단 해변으로 이동하자. 경기장의 상태부터 봐야겠어."
10045010-88 = "(……아무튼 물에 들어가는 경기가 아니라서 다행이네.)"
10045010-91 = "이건…… 너무 탁 트인 해변인데?"
10045010-92 = "비이치~에서 서로 등을 맞대고 싸우는 패터언~인가요!? #n영화 같네요!"
10045010-93 = "하아, 현실은 영화가 아니야, 유카리……."
10045010-94 = "풀 파아워~ 의 나구사 선배의 활약도 기대되어요!"
10045010-98 = "오른팔은 아직 제 컨디션은 아니긴 한데……"
10045010-99 = "최대한 해볼게."
10045010-100 = "봉인은 해제되었으니까."
10045010-102 = "……방금 그 말 묘하게 중2병 같으니까 다른 사람들 앞에선 하지 말아줘."
10045010-106 = "[ns] \"오, 반가운 얼굴들이네. 어서 와!\""
10045010-107 = "오오! 반갑사와요, 선생님!"
10045010-108 = "선생님이 직접 심판을 보시는 건가요?"
10045010-109 = "[s] \"응. 이런 경기는 가까운 곳에서 봐야 재밌잖아?\""
10045010-111 = "……수영복 학생들을 가까운 곳에서 보고 싶었다는 말이지?"
10045010-112 = "당신이라는 사람은 정말……."
10045010-113 = "[s5] \"오, 오해야……!\"\n[s6] \"후후후, 좋을 대로 생각해!\""
10045010-116 = "흠. 그건 그렇고, 슬슬 사람들이 모였네."
10045010-124 = "자아, 모두 경기장에 모이셨나요?"
10045010-125 = "그러면, 백야수상제 1회전! #n물총 서바이벌 게임—"
10045010-126 = "[ns] \"시작—!!\""
10045010-130 = "드디어 개막한 백야수상제! #n과연 1회전을 돌파하는 것은 누가 될 것인가……?"
