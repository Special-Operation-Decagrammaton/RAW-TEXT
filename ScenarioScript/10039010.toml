[translation]
10039010-1 = "제1화;이미지 체인지의 기회"
10039010-2 = "- 48시간 전 -"
10039010-7 = "……후우! 이걸로 마지막이네요!"
10039010-11 = "생각보다 훨씬 빨리 끝났어요. 힘써 주셔서 고마워요, 마리 자매님!"
10039010-12 = "아니에요. 저는 자잘한 정리만 도왔을 뿐, 큰 건 대부분 히나타 자매님께서 해주셨는걸요."
10039010-13 = "자매님이 없으셨다면 얼마나 오래 걸렸을지……. 항상 계셔서 감사하다고 생각하고 있어요."
10039010-14 = "그, 그런……! 당치도 않아요. 저 같은 건……."
10039010-19 = "음? 어라. 어디서 연락이……."
10039010-20 = "……제 게 아니네요?"
10039010-21 = "음? 아, 죄송해요. 제 거였네요! 얼른 답변을……."
10039010-25 = "……?"
10039010-26 = "……마리 자매님?"
10039010-27 = "아, 죄송해요. 조금 의외의 연락이라……."
10039010-28 = "……사쿠라코 님?"
10039010-29 = "사쿠라코 님이요? 뭔가 저희가 더 해야 할 일이 생긴 걸까요?"
10039010-30 = "아뇨. 그런 말씀은 아니신 것 같은데……. 음……. 모르겠네요. 이 문구만으로는……."
10039010-32 = "……'긴급 지원 요청'. 이라고 하시는데……."
10039010-36 = "실례합니다……."
10039010-37 = "사쿠라코님께서 부르셔서 왔습니다만……. 혹시 여기에……?"
10039010-38 = "……?"
10039010-45 = "……!?!?!?"
10039010-46 = "사, 사쿠라코 님!? 미네 님!? 이, 이게 무슨……!!"
10039010-48 = "……음?"
10039010-49 = "아아. 마리. 마침 잘 와줬어요. 바쁜 와중일 터인데도 응해줘서 정말 고마워요."
10039010-50 = "마리가 지금 와 주지 않았다면 이 이후로 상황이 어떻게 됐을지……."
10039010-51 = "아마도 심판조차 없이 결착을 내는 방향으로 흘러갔겠지요. 저도 당신도 그다지 원하는 결말은 아니었겠지만요."
10039010-52 = "겨, 결착이요!? 심판!? 대, 대체 무슨 일이시기에……!!"
10039010-54 = "……?"
10039010-55 = "……예?"
10039010-56 = "무슨 결착……? 심판이라니……? 저희 싸우는 거였나요?"
10039010-57 = "……?"
10039010-58 = "예? 조금 전까지 그런 흐름으로 말씀하셨던 게 아니었단 말인가요……?"
10039010-59 = "분명 \"저희 사이의 충돌에 앞서, 마리의 참관이 우선돼야 한다\"고 말씀하시지 않았습니까?"
10039010-60 = "……????"
10039010-61 = "네, 뭐……. 그렇게 말하긴 했습니다만. 뭔가 이상한 말인가요? 왜 그런 결론으로……?"
10039010-62 = "저는 그냥 마리에게 의견을 구하고자……."
10039010-65 = "……아니, 그……."
10039010-66 = "저, 저기……!!"
10039010-67 = "혹시 지금 말씀하신 상황에 제가 뭔가 관계가 있는 것인가요!? 제가 무언가의 잘못을……!"
10039010-68 = "……!! 아뇨. 당치도 않습니다."
10039010-69 = "마리 씨가 얼마나 모두에게 신뢰받고 계신지는 시스터후드가 아닌 저조차도 익히 들었으니까요."
10039010-71 = "이런……. 미안해요, 마리. 두서가 없었네요. 하긴 지금 상황은 마리에게도 적잖이 당혹스럽겠지요."
10039010-72 = "설명을 하자면……."
10039010-73 = "……잠깐만요."
10039010-74 = "음……. 여기서는 제가 설명하도록 하겠습니다."
10039010-75 = "의도나 탓을 하려는 것은 아니지만, 사쿠라코 님의 발언을 지켜봐 온 사람으로서 그 설명이 오히려 혼란을 가중시킬 수 있다는 생각입니다."
10039010-76 = "……예?"
10039010-77 = "제가요? ……제 말이?"
10039010-78 = "……어째서……??"
10039010-79 = "……."
10039010-80 = "당장 방금 전 말씀만 봐도 그럴 위험성이 있다고 판단됩니다만."
10039010-81 = "……크윽. 뭔가의 기시감이……."
10039010-82 = "이, 일단은 알겠습니다……. 그렇게 진행하시죠……."
10039010-84 = "사쿠라코 님……."
10039010-85 = "……그럼 마리 씨. 바쁘신 시간을 빼앗아 대단히 죄송하지만, 지금부터 저희가 처한 상황에 대해 먼저 말씀드리고자 합니다."
10039010-87 = "마리 씨도 아시다시피, 지금은 트리니티 [ruby=카니발]사육제[/ruby]가 한창인 기간입니다."
10039010-88 = "다양한 행사들이 있지만, 이번에는 특별히 <아이돌 이벤트>라는 것도 진행한다고 하더군요."
10039010-89 = "트리니티뿐만이 아니라, 다양한 학교에서 다양한 동아리가 참가할 수 있는 큰 이벤트."
10039010-90 = "동아리마다 가지고 있는 평상시의 인식이나 이미지와는 상관없이, 그저 무대를 즐기고 다른 학생들과 교감하는……."
10039010-91 = "……이미지 체인지의 기회."
10039010-93 = "……그렇습니다. 이것은 더할 나위 없는 이미지 체인지의 기회입니다."
10039010-94 = "즉, 지금껏 저희 구호기사단과 시스터후드가 가지고 있던, 잘못되고 어려운 이미지를 바로잡을 다시없을 기회죠."
10039010-95 = "자, 잘못되고 어려운 이미지……? 저희에게 그런 이미지가 있었나요……?"
10039010-97 = "안타깝게도 그렇답니다, 마리."
10039010-98 = "마리는 모를 수도 있겠지만, 저희들은 동아리의 특성상 그런 낭설과 음모론에 휘말리기 좋거든요."
10039010-99 = "가령 저희 시스터후드가 비밀스러운 음모를 꾸미고, 학생들을 감시하며 밤중에 납치해 간다거나……."
10039010-100 = "구호기사단이 구호라는 명목하에 각종 폭력을 일삼으며, 치료를 위해 먼저 파괴부터 한다는 식의 오해들입니다."
10039010-101 = "다른 학생들에게 도움이 되고, 어디보다 마음 편해야 할 곳에는 좋지 않은 소문들이지요."
10039010-102 = "그, 그럴 수가……! 어째서 그런……!"
10039010-103 = "후……. 그러게 말입니다. 어째서 그런 소문이 생기는 것인지, 참……."
10039010-104 = "그래서 이것은 저희 모두의 커다란 당면 과제 중 하나입니다. 해결을 위해서라면, 어떠한 일도 마다하지 않을 생각이지요."
10039010-105 = "그것이 설령……. 한 번도 해 본 적 없는, 난생처음의 도전이라도 말이죠."
10039010-106 = "난생처음의……. 도전?"
10039010-107 = "……마리."
10039010-108 = "미네 단장과 저는……."
10039010-112 = "……아이돌이, 될 겁니다."
10039010-113 = "……! 아이돌이요……!?"
10039010-114 = "물론 어울리지 않는 행동이라는 건 잘 알고 있습니다. 저도 미네 단장님도, 딱히 아이돌이나 귀여운 것에는 관심이 없고……."
10039010-115 = "……?"
10039010-116 = "아뇨. 전 썩 그런 걸 싫어하지는……."
10039010-117 = "저희 같은 사람들이 그런 행동을 해도, 우스꽝스러운 모습으로밖에 비치지 않을 거라는 것도 각오하고 있습니다."
10039010-118 = "……예!? 자, 잠깐만요!!"
10039010-119 = "그, 그런 거였나요!? 우스꽝스럽게 되는 거였나요!?!?"
10039010-120 = "하지만 그럼에도, 그 우스꽝스러움이 다른 학생들로 하여금 조금이라도 저희를 편하게 생각할 수 있는 계기가 된다면."
10039010-121 = "…………!!"
10039010-122 = "그럴 수만 있다면, 저희는 기꺼이 그 우스꽝스러움을 감내하고자 합니다."
10039010-124 = "……사쿠라코 님……."
10039010-128 = "알겠습니다. 두 분께서 그렇게 말씀하시는 데에, 어떻게 제가 돕지 않을 수 있겠어요."
10039010-129 = "부디 그 노력에 저도 보탤 수 있었으면 좋겠어요. 필요하신 게 있으시다면, 뭐든 말씀해 주세요."
10039010-130 = "마리……!"
10039010-131 = "마리 씨……!"
10039010-132 = "진심으로 감사드립니다. 그렇다면 염치없지만 거두절미하고 바로……. 이것을……."
10039010-137 = "이, 이건……?"
10039010-138 = "저와 미네 단장님이 준비한, 각자가 생각한 \"아이돌 기획서\"입니다. 마리를 이곳에 와달라 부탁한 이유기도 하지요."
10039010-139 = "나름대로 <의상>, <댄스>, <곡>, 세 가지로 카테고리를 구분해서 준비해 보았습니다만……."
10039010-140 = "저희끼리는 좀처럼 의견이 좁혀지지 않아서요. 마리 씨가 선택해 주었으면 합니다."
10039010-141 = "마리 씨의 선택이라면, 저도 사쿠라코 님도 승복할 것이라고 생각했기 때문입니다."
10039010-142 = "네, 네!? 선택이요? 이걸……. 제가요!? 어째서 제가 이런 중대한 일을……!?"
10039010-143 = "그야 '아이돌'에 관련된 부분은, 당연히 저나 미네 단장님보다는 마리가 더 잘 알 것이라고 생각했기 때문입니다."
10039010-144 = "마리는 유행 타는 가게에서 쿠폰도 적립할 수 있고, 패스트푸드점에서 키오스크도 능숙하게 사용할 수 있으니까요."
10039010-145 = "……? 아니, 그 정도는 저도……."
10039010-146 = "게다가 다른 학생들의 상담도 많이 받고, 바깥 학생들의 마음과 취향에 대해서도 잘 알고 있다고 알고 있습니다."
10039010-147 = "음……. 뭐, 그런 이유라면……."
10039010-148 = "결론적으로 저희들과 달리, 어린 학생들과 속세에 대해 잘 알고 관심이 있을 거라고 생각해서……."
10039010-149 = "잠깐만요, 역시 이상합니다!! 이상하다고요!!"
10039010-150 = "어째서 저도 같은 취급입니까!? 지금 말씀하시는 건 전적으로 사쿠라코 님 혼자만의 이야기잖습니까!!"
10039010-151 = "확실히 아이돌까지는 모르지만, 저도 관심이 아예 없지는 않다고요! 귀엽고 예쁜 거!!"
10039010-152 = "관심이 있다는 분이 아이돌 노래 도중에 '기사의 맹세' 같은 걸 넣습니까!? 아무리 저라도 그게 이상한 건 압니다!!"
10039010-153 = "그러니까, 그건 약간의 독창성을 넣자는 의미에서 넣은 것뿐이라고 해명하지 않았습니까!! 실수였다고요!!"
10039010-154 = "사쿠라코 님이야말로, 아이돌 곡 선정을 찬송가에서 찾고 있다니 이상하지 않습니까!?"
10039010-155 = "뭐가 이상하다는 거죠!? 찬송가는 모두가 좋아하는 노래잖아요!?"
10039010-156 = "어떻게 거기서 '모두가'라고 당당하게 말할 수 있는 거죠!? 대체 어디서 확인하신 거죠!?"
10039010-158 = "성당에서요!!"
10039010-159 = "성당이잖아요!!!"
10039010-160 = "마리에게도 물어보세요! 마리! 마리도 찬송가를 좋아하죠!?"
10039010-161 = "에, 엣. 아, 그, 그야 물론 저는 정말 좋아하지만……."
10039010-162 = "보세요!!"
10039010-164 = "제가 무슨 반응을 하길 바라시는 겁니까?"
10039010-169 = "……보십시오, 마리 씨. 저희는 지금 이런 상태입니다. 따라서 여기서는 공정한 마리 씨의 선택이 필요하다고 판단했습니다."
10039010-170 = "비록 사쿠라코 님 휘하의 시스터후드지만, 마리 씨의 인덕과 공정함은 저 또한 확실하게 신뢰하고 있는바."
10039010-171 = "만일 마리 씨마저도 사쿠라코 님의 아이돌 기획서가 맞다고 말씀하신다면, 저는 그것을 따르고자 합니다."
10039010-176 = "……어……."
10039010-177 = "그, 그러니까……. 그게……. 음……."
10039010-178 = "그렇습니다, 마리. 여기서는 저희보다 마리의 말이 옳을 것입니다. 저는 그리 믿습니다."
10039010-179 = "그……. 으음……. 저기……."
10039010-181 = "자, 골라 주세요! 저희가 앞으로 어느 방향을 향해 나아가야 할지!! 마리의 선택을!!"
10039010-182 = "그……! 으음……!!"
10039010-186 = "……며……."
10039010-188 = "며칠만……. 시간을 좀 주실 수 있을까요……?"
10039010-192 = "……라는 일이 있었답니다. 그래서……."
10039010-193 = "[s1] \"……정말 잘 참았네, 마리.\"\n[s2] \"새삼 마리의 인내심이 대단해.\""
10039010-196 = "아하하……. 그럴 리가요. 화라니, 당치도 않아요."
10039010-197 = "사쿠라코 님과 미네 단장님께서 하고자 하시는 일……."
10039010-198 = "두 분께서 말씀하신 그 말에는, 정말로 너무나도 도움이 되고픈 의도가 담겨 있었어요."
10039010-199 = "생각해 보면 두 분 모두 그러셨겠죠. 제가 모르는 곳에서도 저런 일이 많으신 거겠죠."
10039010-200 = "저는 그저 편하게 일만 하면 될 뿐이고……."
10039010-201 = "그래서 모처럼 두 분을 도울 수 있는 일이니, 잘 해결돼서 만족하셨으면 좋겠다고 생각해요."
10039010-202 = "……하지만 그러니 더더욱."
10039010-203 = "더더욱 제가 어느 한쪽을 선택하거나 한 분을 부정하게 되는 결과로, 누군가 상심하거나 슬퍼하진 않으셨으면 좋겠어요."
10039010-207 = "[ns3] \"마리…….\"\n[ns4] \"거기서 그렇게 생각할 수 있다니…….\""
10039010-210 = "선생님……? 방금 뭐라고……."
10039010-211 = "……네?"
10039010-212 = "도와주시겠다고요? ……저를요?"
10039010-213 = "같이 가자고요……? 다른 참가 동아리들을 들러서 어떻게 하는지 배워 오자고요……?"
10039010-214 = "그, 그런……! 아니에요. 그런 말씀을 드리려던 게 아니었어요!!"
10039010-215 = "선생님께서는 가뜩이나 일도 많으실 텐데, 여기서 저 때문에 이런 일까지 부탁드릴 수는……!"
10039010-216 = "……네?"
10039010-217 = "그런 의미로 생각하지 않아도 된다고요? 그, 그게 무슨 말씀이신지……."
10039010-218 = "[s5] \"여기선 마리와 내 마음이 같다고 생각해 줘.\"\n[s6] \"나도 사쿠라코와 미네는 도와주고 싶거든.\""
10039010-221 = "……선생님……."
10039010-225 = "……후후."
10039010-226 = "……정말이지……. 선생님은 어쩔 수 없는 분이시네요."
10039010-227 = "선생님다운 말씀이시랄까……. 그렇게 말씀해 주실 거라곤 생각도 못 했는데……."
