[translation]
10052150-1 = "다아트. 그림자에 가려진 심연의 지혜"
10052150-3 = "저 아이들, 뭘 하려는 거죠?"
10052150-4 = "저건…… 설마?!"
10052150-14 = "와."
10052150-15 = "히이이이이이이이?!?!"
10052150-16 = "유즈 쨩? 언니!?"
10052150-17 = "미도리…… 나는 지금까지 잘못 생각하고 있었던 건지도 몰라……!"
10052150-18 = "갑자기 또 무슨 소리야!?"
10052150-19 = "우주 전함은 먹히는 소재라고 생각했지……. 하지만 모름지기 시나리오 라이터라면 모든 가능성을 넘어, 그 저편을 바라봐야 하는 법……!"
10052150-20 = "거대 변신 합체 공룡 로봇! 그게 있었나!"
10052150-21 = "잘못하면 우리 한 번에 밟혀 죽게 생겼거든?!?!"
10052150-22 = "잘 모르겠지만, 한 가지는 확실하게 알 것 같습니다."
10052150-23 = "이곳에 네루 선배가 있었다면…… 그렇군요. 분명 이런 감상을 남겼겠지요."
10052150-24 = "'존나 멋있다.' 라고요."
10052150-25 = "[s1] \"거대 변신 합체 공룡 로봇이 아니야, 모모이!\"\n[s2] \"거대 변신 합체 '괴수' 로봇이야–!\""
10052150-28 = "……."
10052150-29 = "지금 그게 중요합니까?!?!"
10052150-36 = "개인적으로 분류학은 중요한 학문이라고 생각하지만요. 저거, 이쪽으로 오는데요? 너무 큰데요? 어떻게 할 방법이 있나요?!"
10052150-41 = "……."
10052150-42 = "그래. 그렇구나. 너무 걱정하지 마."
10052150-46 = "리오? 당신, 설마……?"
10052150-47 = "맞아. 혹시나 이런 일이 있을까 해서, 만들어 둔 것이 있어."
10052150-51 = "네오 아방가르드 군."
10052150-52 = "출격."
10052150-62 = "이것이……!"
10052150-63 = "……네오 아방가르드 군?"
10052150-70 = "……."
10052150-71 = "……."
10052150-72 = "풉! 아하하하하하! 뭐야, 그거! 생긴 것도 생긴 거지만……"
10052150-73 = "이거, 이거, 이거. 너무 작지 않나요? 그걸로 뭘 할 수 있겠어요? 다아트가 손끝으로 한번 튕겨 주면 산산조각 나겠네요!"
10052150-75 = "조, 조금은 안심해도, 될 것 같네요……! 에헤헤……."
10052150-76 = "그렇게 생각해? 그래. 적지 않은 경우, 크기가 문제가 될 때가 있지."
10052150-77 = "하지만 지금, 여기에서만큼은 아니야."
10052150-81 = "네, 네에……?"
10052150-82 = "괜찮지, 케이?"
10052150-83 = "……뭐, 약속한 것도 있긴 하니까요. 좋아요. 시간이 없으니, 바로 시작하도록 하죠."
10052150-84 = "그 전에 미리 말해 두도록 할까요. 일단 고맙다는 인사를 해 두겠습니다. 아인, 소프, 오르."
10052150-85 = "네, 네?!"
10052150-86 = "무슨…… 소리야?"
10052150-87 = "어차피 허세겠죠! 우리의 다아트는 그야말로 강인! 무적! 최강! 지금의 당신들에게 다아트를 상대할 가능성 따위 없다, 이겁니다!"
10052150-88 = "틀린 말은 아니야. '지금', '이대로'라는 조건 하에서는, 분명히 그렇겠지."
10052150-89 = "하지만 모든 것은 너희들이 이름 없는 신들의 힘을 사용해 왔고."
10052150-90 = "나아가 그것으로 이 강철대륙이라는 현상을 일으켜 주었던 덕분이기도 해."
10052150-91 = "……마지막에 와서 위상 변환을 시도했던 것 같지만, 그것도 어느 정도는 정류해 내는 데 익숙해졌어."
10052150-92 = "잠깐만요……? 우리가 강철대륙을 만들어냈기 때문에……?"
10052150-93 = "그렇지만 아무리 <왕녀>와 <열쇠>가 여기에 있다고 해도……?"
10052150-94 = "……."
10052150-95 = "서, 설마……!!!"
10052150-96 = "간단한 거예요. 한번 일어난 일은 두 번 일어날 수 있죠. 그리고 두 번째는 첫 번째보다, 당연하게도 수월한 법이고요."
10052150-97 = "<색채>가 키보토스에 내려오려 했던 날이 있었습니다."
10052150-98 = "우리는 그 힘에 맞서 싸웠고, 그 힘의 일부를 응용하기도 했지."
10052150-99 = "아무튼 쓸 수 있는 걸 모두 사용하지 않으면, 살아남을 수 없었을 테니까."
10052150-100 = "투쟁하고 있는 것은 당신들뿐만이 아니에요. 아인, 소프, 오르. 살아 있는 것이라면, 뭐든 마찬가지죠."
10052150-101 = "강철대륙은 이름 없는 신들의 힘을 사용해 만들어졌고."
10052150-102 = "그리고 그 위에서, 여덟 기의 예언자는 어느 사이엔가 그 힘의 영향을 받고 있었지."
10052150-103 = "그 모두와 싸운 끝에, 이 공간은 이름 없는 신들의 힘으로 가득 찬 곳이 되었고."
10052150-104 = "심지어 그 예언자들의 코어 정보를 흡수해 왔던 케이는, 바로 여기에 있어."
10052150-105 = "에너지가 존재하고, 그것을 분석할 수 있고, 나아가 재현할 수 있다면."
10052150-106 = "당연하게도, 그 에너지를 마음에 드는 방향으로 가공하고 응용할 수도 있다는 뜻이 될 겁니다."
10052150-110 = "어? 그건, 그 말은……!"
10052150-111 = "왜 그래요? 어떤 의미에서 이 힘, 원래 저와 아리스에게 돌아가야 했던 것일 겁니다."
10052150-112 = "불만은 접수하지 않을 테니, 그렇게 아세요."
10052150-114 = "그러면, 저 네오 어쩌고를……!"
10052150-115 = "그래. 이 경우에는, 다시 한번, <물질의 거대화>가 되는 것이겠지."
10052150-129 = "끝내준다!!!"
10052150-130 = "화, 확실히 엄청나!"
10052150-131 = "(그렇지만 디자인은 좀, 어떻게 안 되었던 걸까…….)"
10052150-132 = "……이게 그 비장의 수였던 거군요."
10052150-133 = "미안해. 여기는 적지니까. 함부로 이야기했다가는 정보가 유출될 수도 있었을 거라고 생각했어."
10052150-134 = "그래서 케이에게만 이야기한 것이기도 했던 거네요."
10052150-135 = "그래. 보안에 있어서는, 케이야말로 가장 안전한 대상이었지."
10052150-136 = "어? 거대 네오 아방가르드 군이……."
10052150-143 = "유즈에게, [ruby=젠틀하게]공손하게[/ruby] 손을 내밀고 있습니다."
10052150-144 = "어, 어어어어어어?!?!"
10052150-145 = "그래. 그렇겠지. 왜냐하면."
10052150-146 = "네오 아방가르드 군의 파일럿은, 바로 유즈, 너니까."
10052150-149 = "저는 동의한 적 없는데요?!?!?!"
10052150-150 = "앗! 유즈가 말을 더듬지 않았습니다! 이건 정말로 충격받았다는 뜻입니다!"
10052150-151 = "하지만 예전에 이미 아방가르드 군을 조종해 봤잖아?"
10052150-152 = "아……! 맞습니다, 리오 선배! UZQueen 전용기체로 개조된 아방가르드 군이 있었습니다!"
10052150-153 = "그래. 나 역시 그 기록은 파악한 상태야. 그러니까, 유즈."
10052150-157 = "네오 아방가르드 군에 타."
10052150-163 = "우, 우으으으으으으으으……!!!"
10052150-172 = "어, 어떻게 하면 될까요?!"
10052150-173 = "우선, 네오 아방가르드 군은 뇌파–뉴럴 링크로 작동하게 되어 있어."
10052150-174 = "……일단은."
10052150-175 = "일단은, 요?!"
10052150-176 = "그래. 네오 아방가르드 군은, 이 시점에서, 네가 생각하는 대로 움직일 거야."
10052150-177 = "그, 그그그그, 그런 말을 들어도요……!"
10052150-182 = "가라, 다아트! 저 웃기지도 않는 걸 날려 버려!"
