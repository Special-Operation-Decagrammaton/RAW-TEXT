[translation]
1013706-1 = "那位刑警的夥伴"
1013706-2 = "（坐上公車，抵達了和木乃香約好見面的某個鄉村）"
1013706-4 = "老師，這裡～！"
1013706-5 = "辛苦你遠道而來。#n今天因為運勢的關係，我實在需要一名夥伴。"
1013706-6 = "不過今天女武神有定期訓練，所以沒有人能陪我一起來。"
1013706-7 = "[s] 「我們要在這裡做什麼呢？」"
1013706-8 = "好問題！我們要在這裡進行走訪調查。"
1013706-9 = "有個在D.U.闖禍後逃跑的傢伙，最後被目擊到搭上了前往這裡的公車。"
1013706-10 = "外地人應該挺顯眼的，向當地居民打聽一下很快就能抓到了。"
1013706-11 = "聽說下午會下雨，趕快處理完早點回去吧！"
1013706-12 = "那麼，出發吧！"
1013706-25 = "唉，真讓人鬱悶……"
1013706-26 = "他是飛天還是遁地了啊……怎麼會連一個目擊者也沒有？"
1013706-27 = "已經花了比想像中更多的時間，繼續問下去似乎也沒什麼意義。"
1013706-28 = "難道是逃到山上了嗎……？#n哪怕得把樹都拔光，我也要把那傢伙給揪出來……！"
1013706-29 = "[s] 「停停停！這樣住在山上的動物們太可憐了！」"
1013706-30 = "拔掉之後當然會重新種回去啊。#n我好歹也是個守法的警察耶！"
1013706-31 = "總之時間不早了，得趕快想想辦法才──"
1013706-36 = "咦！？"
1013706-37 = "啊啊啊！！！真是不必要的清涼感！！"
1013706-38 = "先去那裡躲雨吧！！啊啊，真是的！！"
1013706-41 = "（連忙和木乃香一起跑到屋簷下躲雨）"
1013706-42 = "（因為接連的失敗而垂頭喪氣的木乃香，突然站起身來脫掉了外套）"
1013706-45 = "― [log=코노카]啊～啊，全都濕了……[/log][wa:3327] "
1013706-47 = "― [log=코노카]嗚嗚……好冷。[/log][wa:610] "
1013706-50 = "― [log=코노카]開始下雨了呢。[/log][wa:1948] "
1013706-52 = "― [log=코노카]聽說到晚上都不會停……唉……[/log][wa:2501] "
1013706-55 = "― [log=코노카]算了，正好可以讓腦袋冷靜一下。[/log][wa:2487] "
1013706-58 = "[ns] 「你沒事吧？冷靜下來了嗎？」"
1013706-59 = "― [log=코노카]咦？啊啊，唔嗯……[/log][wa:2390] "
1013706-61 = "― [log=코노카]要說沒有不甘心的話，那是騙人的。[/log][wa:1602] "
1013706-64 = "― [log=코노카]不只白費很多功夫，還被淋成落湯雞……[/log][wa:1953] "
1013706-67 = "― [log=코노카]但是，就和占卜說的一樣。[/log][wa:1813] "
1013706-69 = "― [log=코노카]因為有夥伴在身邊，所以是個美好的一天。[/log][wa:1881] "
1013706-72 = "― [log=코노카]……這都是多虧了老師哦。[/log][wa:1002] "
1013706-75 = "― [log=코노카]所以，如果真要說的話──[/log][wa:1844] "
1013706-77 = "― [log=코노카]我很幸福。[/log]"
1013706-80 = "― [log=코노카]……啊，不是，那個！[/log][wa:1023] "
1013706-82 = "― [log=코노카]我的意思是能像這樣有地方躲雨，真是既幸運又幸福！[/log][wa:2866] "
1013706-85 = "― [log=코노카]就，就只是這樣……而已……[/log][wa:1342] "
1013706-88 = "……"
1013706-89 = "總之，我說的幸福指的是……因為避免了最糟的情況……"
1013706-90 = "這樣的意──"
1013706-95 = "哦！？已經有人在啦！？"
1013706-96 = "抱歉抱歉，好像打擾到你們的美好氣氛了。#n因為外面突然下雨，就讓我稍微待一下吧。"
1013706-97 = "……？"
1013706-98 = "怎麼，你也正在被人追捕嗎？#n看你那個樣子，我們似乎是同類呢。"
1013706-99 = "話說，你有在這附近看到麻雀嗎？"
1013706-103 = "真的假的……？"
1013706-105 = "[ns] 「就在這裡哦……」"
1013706-107 = "咦……"
1013706-108 = "啊！我突然好想出去淋雨哦！！先告辭啦！！"
1013706-112 = "給我站住！！！！！"
1013706-116 = "你這副德性哪裡像警察了啊！？#n而且偷偷埋伏也太卑鄙了吧！！"
1013706-117 = "你這傢伙必須加重處分！！"
1013706-118 = "為什麼！？"
1013706-119 = "因為破壞氣氛罪啦，臭小子！！！"
1013706-121 = "（冒雨衝出去的木乃香很快就逮捕了嫌犯）"
1013706-122 = "（在回程的路上，木乃香始終默默望著窗外）"
