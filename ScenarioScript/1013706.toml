[translation]
1013706-1 = "那位刑警的夥伴"
1013706-2 = "（坐上公車，抵達了和木乃香約好見面的某個鄉村）"
1013706-4 = "老師，這裡～！"
1013706-5 = "辛苦你遠道而來，今天因為運勢的關係所以一定需要夥伴。"
1013706-6 = "但是今天女武神有定期訓練，所以沒有人可以一起來。"
1013706-7 = "[s] 「在這裡要做什麼？」"
1013706-8 = "好問題！我們要在這裡進行訪問調查。"
1013706-9 = "有個傢伙在D.U.闖禍後逃跑了，最後目擊到的是搭上了來這裡的公車。"
1013706-10 = "畢竟是外地人，肯定很顯眼，問問當地人應該很快就能抓到了。"
1013706-11 = "聽說下午會下雨，趕快處理完在那之前回去吧！"
1013706-12 = "那就走吧！"
1013706-25 = "唉……"
1013706-26 = "他是飛天還是遁地了啊……怎麼一個目擊者都沒有？"
1013706-27 = "比想像中還花了更多時間，再繼續問好像也沒意義。"
1013706-28 = "難道是逃到山上了嗎……？就算把樹都拔掉我也要找出來……！"
1013706-29 = "[s] 「停！這樣住在山上的動物們很可憐！」"
1013706-30 = "拔掉之後當然會重新種回去啊，我好歹也算是守法的警察！"
1013706-31 = "總之時間已經很晚了，得趕快做些什──"
1013706-36 = "咦！？"
1013706-37 = "啊啊啊！！！好冰！！"
1013706-38 = "先去那裡躲雨吧！！啊啊，真是的！！"
1013706-41 = "（和木乃香一起急忙跑到屋簷下躲雨）"
1013706-42 = "（因為接連的失敗而垂頭喪氣的木乃香，突然站起來脫掉了外套）"
1013706-45 = "― [log=코노카]啊～啊，全濕了。[/log][wa:3407] "
1013706-47 = "― [log=코노카]嗚嗚……好冷。[/log][wa:610] "
1013706-50 = "― [log=코노카]開始下雨了呢。[/log][wa:1948] "
1013706-52 = "― [log=코노카]聽說到晚上都不會停……唉……[/log][wa:2501] "
1013706-55 = "― [log=코노카]算了，正好可以讓腦袋冷靜一下。[/log][wa:2487] "
1013706-58 = "[ns] 「沒事吧？」"
1013706-59 = "― [log=코노카]咦？啊啊，嗯……[/log][wa:2430] "
1013706-61 = "― [log=코노카]要說不甘心的話，那是騙人的。[/log][wa:1682] "
1013706-64 = "― [log=코노카]不但到處跑，白忙了一場，還淋成落湯雞……[/log][wa:1873] "
1013706-67 = "― [log=코노카]不過，和占卜說的一樣。[/log][wa:1853] "
1013706-69 = "― [log=코노카]因為有夥伴在身邊，所以算是美好的一天。[/log][wa:1881] "
1013706-72 = "― [log=코노카]……這都是多虧了老師哦。[/log][wa:1002] "
1013706-75 = "― [log=코노카]所以，真要說的話……[/log][wa:1924] "
1013706-77 = "― [log=코노카]我很幸福。[/log]"
1013706-80 = "― [log=코노카]……啊，不是，那個！[/log][wa:1023] "
1013706-82 = "― [log=코노카]能有這樣可以避雨的地方，我覺得很幸運！很幸福的意思！[/log][wa:2786] "
1013706-85 = "― [log=코노카]就，就只是這樣……而已……[/log][wa:1342] "
1013706-88 = "……"
1013706-89 = "也就是說，我說的幸福是那個……因為避免了最糟的情況……"
1013706-90 = "的意思，沒有特別的含──"
1013706-95 = "哦！？ 已經有人啦！？"
1013706-96 = "抱歉抱歉，打擾你們的美好氣氛，因為突然下雨就讓我待一下吧。"
1013706-97 = "……？"
1013706-98 = "怎麼了，你也正在被追嗎？看樣子我們同病相憐呢。"
1013706-99 = "對了，你有沒有在這附近看到條子？"
1013706-103 = "真的假的……？"
1013706-105 = "[ns] 「就在這裡……」"
1013706-107 = "咦……"
1013706-108 = "啊！我突然想淋雨！！告辭！！"
1013706-112 = "站住！！！！！"
1013706-116 = "你這樣還叫警察！？竟敢偷偷埋伏！？太卑鄙了！！"
1013706-117 = "你加重處分！！"
1013706-118 = "為什麼！？"
1013706-119 = "破壞美好氣氛罪！！！"
1013706-121 = "（冒雨衝出去的木乃香很快就逮捕了嫌疑犯）"
1013706-122 = "（回去的路上，木乃香一直看著窗外）"
