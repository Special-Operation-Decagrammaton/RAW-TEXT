[translation]
1013706-1 = "그 형사의 버디"
1013706-2 = "(버스를 타고, 코노카와 만나기로 약속한 어느 시골 마을에 도착했다.)"
1013706-4 = "여기임다 선생님-!"
1013706-5 = "멀리 오느라 수고하셨슴다. 운세가 운세다 보니 꼭 버디가 필요했슴다."
1013706-6 = "오늘 발키리에서 정기 훈련하느라, 데려갈 애들이 없었지 말임다."
1013706-7 = "[s] \"여기서 무슨 일을 할 거니?\""
1013706-8 = "좋은 질문임다! 여기서 탐문 수사를 할 검다."
1013706-9 = "D.U.에서 사고 치고 도망간 녀석이 있는데, 마지막으로 목격된 게 여기로 오는 버스를 탄 거라 함다."
1013706-10 = "외지인이라 눈에 띌 테니, 주민들 상대로 몇 번 물어보면 금방 잡을 수 있을 검다."
1013706-11 = "오후에 비가 온다고 했으니, 후다닥 처리하고 그 전에 복귀하면 될 검다!"
1013706-12 = "그럼 같이 가시죠!"
1013706-25 = "아, 속상해……."
1013706-26 = "하늘로 솟았나 땅으로 꺼졌나……. 목격자가 어째 아무도 없슴까?"
1013706-27 = "생각보다 시간이 오래 걸려버렸는데, 물어보는 건 무의미할 것 같슴다."
1013706-28 = "산으로 도망갔나……? 나무를 다 뽑아서라도 찾아내야……!"
1013706-29 = "[s] \"산에 사는 동물들이 불쌍하니까 스톱!\""
1013706-30 = "당연히 뽑고 나서 다시 심을 겁니다. 이래봬도 준법 경찰인데!"
1013706-31 = "일단 이미 시간이 늦었으니, 빨리 뭐라도 해야-"
1013706-36 = "엥?!"
1013706-37 = "으갸악!!! 원치 않았던 시원함!!"
1013706-38 = "일단 저기에서 비 피하시죠!! 으아아, 진짜아!!"
1013706-41 = "(코노카와 함께 급히 비를 피했다.)"
1013706-42 = "(연이은 실패로 어깨를 축 늘어뜨리던 코노카는, 문득 일어나서 겉옷을 벗었다.)"
1013706-45 = "[wa:2172]― [log=코노카]아-아, [wa:1035]쫄딱 젖었네. [/log]"
1013706-47 = "― [log=코노카]으으…… [wa:530]추워. [/log]"
1013706-50 = "[wa:1586]― [log=코노카]비, [wa:2]결국 내리기 시작했네요.[/log]"
1013706-52 = "― [log=코노카]밤까지 안 그칠 거라던데……[wa:2261]하아…….[/log]"
1013706-55 = "― [log=코노카]뭐, [wa:994]머리도 식히고 [wa:1133]마침 좋슴다.[wa:200] [/log]"
1013706-58 = "[ns] \"괜찮아? 많이 속상하지 않니?\""
1013706-59 = "[wa:517]― [log=코노카]네? [wa:973]아아, [wa:820]으음- [/log]"
1013706-61 = "― [log=코노카]속상하지 [wa:567]않았다면, [wa:915]거짓말임다.[wa:40] [/log]"
1013706-64 = "― [log=코노카]이것저것 [wa:233]허탕 쳤고, [wa:1520]쫄딱 젖어버렸고…….[/log]"
1013706-67 = "[wa:556]― [log=코노카]그래도, [wa:736]운세대로 [wa:401]됐슴다. [/log]"
1013706-69 = "― [log=코노카]버디가 [wa:217]옆에 있으니, [wa:999]좋은 [wa:505]하루가 됐네요.[/log]"
1013706-72 = "― [log=코노카]……선생님 [wa:962]덕분임다.[wa:40] [/log]"
1013706-75 = "[wa:870]― [log=코노카]그러니, [wa:894]어느 쪽이냐면- [/log]"
1013706-77 = "― [log=코노카]행복합니다.[/log]"
1013706-80 = "― [log=코노카]……앗 [wa:416]아뇨, [wa:567]그! [/log]"
1013706-82 = "― [log=코노카]이렇게 [wa:377]비 피할 곳도 있어서 [wa:1089]럭키-! [wa:370]그래서 [wa:390]행복하구나- 라는 의미에서![/log]"
1013706-85 = "― [log=코노카]그, [wa:416]그런 거…… [wa:766]임다…….[wa:40] [/log]"
1013706-88 = "……"
1013706-89 = "그러니까, 좋다! 라는 건, 최악의 불행은 피했으니까-"
1013706-90 = "그런 게 좋다는 거-"
1013706-95 = "우왓?! 누가 이미 있었네?!"
1013706-96 = "미안, 미안- 그림 좋은데 방해했네, 비가 갑자기 와서 같이 좀 있자고-"
1013706-97 = "……?"
1013706-98 = "뭐야, 언니도 쫓기는 거야? 생긴 거 보니까 같은 처지 같은데."
1013706-99 = "혹시 이 주변에서 참새들 봤어?"
1013706-103 = "실화냐……?"
1013706-105 = "[ns] \"여기 있는데…….\""
1013706-107 = "어……."
1013706-108 = "아 갑자기 비가 맞고 싶네!! 이만 실례!!"
1013706-112 = "거기 서라!!!!!"
1013706-116 = "어딜 봐서 네가 경찰이냐고!! 치사하게 잠복이냐?!"
1013706-117 = "넌 가중 처벌이다!!"
1013706-118 = "왜 가중 처벌인데-?!"
1013706-119 = "좋은 그림 훼손죄 임마-!!!"
1013706-121 = "(비를 뚫고 달려간 코노카는 금세 용의자를 체포했다.)"
1013706-122 = "(돌아가는 길에, 코노카는 계속 창밖만 보고 있었다.)"
