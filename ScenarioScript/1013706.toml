1013706-25 = "Blaaah. This sucks."
1013706-26 = "We can't find a single witness! Maybe she grew wings and flew off into the horizon? Or burrowed deep underground?"
1013706-27 = "It's too late to try to question any more people..."
1013706-28 = "Maybe she went into mountains...? I WILL sniff her out, even if I have to rip out every tree here, one by one!"
1013706-29 = "[s] \"Think about the environment! The animals!\""
1013706-30 = "Bah, humbug! I'll replant them after I find her! I'm still a law-abiding police officer."
1013706-31 = "Before the trail gets too cold, we need to—"
1013706-32 = ""
1013706-35 = ""
1013706-36 = "Eh?!"
1013706-37 = "KYAAAH!! A cold downpour!"
1013706-38 = "Let's take shelter over there!!! Gaaah, I can't believe this!!"
1013706-41 = "Konoka and I hurried to find shelter from the rain together."
1013706-42 = "Konoka, who'd been moping in the corner from how the day had turned out, got up out of nowhere and took her jacket off."
1013706-45 = "― [log=코노카]Ah, ah, I'm soaked.[/log][wa:2967] "
1013706-47 = "― [log=코노카]Ugh... I'm cold.[/log][wa:250] "
1013706-50 = "― [log=코노카]It's really coming down.[/log][wa:1268] "
1013706-52 = "― [log=코노카]Apparently, it's not going to stop until later tonight. *sigh*[/log][wa:581] "
1013706-55 = "― [log=코노카]Well, I guess it's nice to take a beat and regroup.[/log][wa:1047] "
1013706-58 = "[ns] \"Are you okay? Aren't you disappointed?\""
1013706-59 = "― [log=코노카]Hm? Ah, well... [/log][wa:2110] "
1013706-61 = "― [log=코노카]I'd be lying if I said I wasn't disappointed. [/log][wa:402] "
1013706-64 = "― [log=코노카]I wasted my time, and I'm drenched...[/log][wa:1193] "
1013706-67 = "― [log=코노카]But still, today went just like my horoscope said it would.[/log][wa:10] "
1013706-69 = "― [log=코노카]It ended up being a nice day with a buddy by my side.[/log][wa:521] "
1013706-72 = "― [log=코노카]...It's all thanks to you.[/log][wa:442] "
1013706-75 = "― [log=코노카]So, if I had to say...[/log][wa:1444] "
1013706-77 = "― [log=코노카]I'm happy.[/log]"
1013706-80 = "― [log=코노카]...Ah, wait, I mean![/log][wa:623] "
1013706-82 = "― [log=코노카]It was really lucky that we found shelter from the rain so quickly! That's why I'm happy![/log][wa:266] "
1013706-85 = "― [log=코노카]Th-That was the...gist of it...[/log][wa:622] "
1013706-88 = "..."
1013706-89 = "It's just a good thing that I didn't have any bad luck today!"
1013706-90 = "That's all I meant..."
