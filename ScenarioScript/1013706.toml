[translation]
1013706-1 = "บัดดี้ของตำรวจ"
1013706-2 = "(คุณครูนั่งรถบัสมายังหมู่บ้านแห่งหนึ่งในชนบทตามที่นัดแนะกับโคโนกะไว้)"
1013706-4 = "ตรงนี้ค่ะ คุณครู!"
1013706-5 = "ขอบคุณที่เดินทางไกลมาหากันนะคะ ก็ดวงประจำวันนี้น่ะสิคะ บอกว่าฉันต้องมีบัดดี้"
1013706-6 = "แต่วันนี้วัลคิรี่มีการฝึกประจำ ฉันก็เลยหาเพื่อนมาไม่ได้ค่ะ"
1013706-7 = "[s] \"ว่าแต่มาทำอะไรที่นี่เหรอ?\""
1013706-8 = "ถามได้ดีเลยค่ะ! วันนี้ฉันจะมาทำงานสืบสวนที่นี่น่ะค่ะ"
1013706-9 = "มีคนที่ก่อเรื่องใน D.U. แล้วหนีไปได้ แต่เราได้เบาะแสมาว่าคนนั้นนั่งรถบัสมาลงที่นี่ค่ะ"
1013706-10 = "เขาเป็นคนแปลกหน้าของที่นี่ เพราะงั้นถ้าเราไปถามจากชาวบ้านที่นี่ก็น่าจะหาตัวจับได้ไม่ยากค่ะ"
1013706-11 = "เห็นว่าเย็นนี้ฝนจะตกด้วย ฉันอยากรีบจัดการให้เสร็จแล้วกลับวัลคิรี่ก่อนฝนจะตกค่ะ!"
1013706-12 = "งั้นเราไปกันเถอะค่ะ!"
1013706-25 = "เฮ้อ เหนื่อยใจจัง..."
1013706-26 = "ทำไมตามตัวไม่ได้เลยล่ะ หรือว่าล่องหนไปแล้ว... ไหงถึงไม่มีใครพบเห็นผู้ต้องสงสัยคนนั้นเลยล่ะคะ?"
1013706-27 = "เสียเวลาไปมากกว่าที่คิดอีกนะคะ จะให้ไปถามใครต่อก็คงเปล่าประโยชน์แล้วค่ะ"
1013706-28 = "หรือว่าจะหนีขึ้นเขาไปนะ...? ต่อให้ต้องโค่นต้นไม้ทุกต้น ฉันก็จะหาให้เจอให้ได้เลย...!"
1013706-29 = "[s] \"หยุดเลย นึกถึงพวกสัตว์บนเขาบ้างสิ!\""
1013706-30 = "โค่นไปแล้วเดี๋ยวก็ปลูกใหม่ได้ค่ะ เห็นอย่างนี้ฉันก็เป็นตำรวจที่เคารพกฎหมายนะคะ!"
1013706-31 = "นี่ก็จะตกเย็นแล้ว ฉันต้องรีบทำอะไรสักอย่าง..."
1013706-36 = "เอ๋?!"
1013706-37 = "ว้ากกก!!! ฝนตกตรงเวลาชะมัด!!"
1013706-38 = "เราไปหลบฝนตรงโน้นก่อนเถอะค่ะ!! เฮ้อ จริงๆ เลย!!"
1013706-41 = "(คุณครูรีบหาที่หลบฝนกับโคโนกะ)"
1013706-42 = "(โคโนกะนั่งไหล่ตกเพราะงานสืบสวนที่ล้มเหลวติดต่อกันหลายครั้ง และจู่ๆ ก็ลุกขึ้นพรวดแล้วก็ถอด#nเสื้อออก) "
1013706-45 = "― [log=코노카]อ่า เปียกโชกเลย [/log][wa:3087] "
1013706-47 = "― [log=코노카]อึก... หนาวจัง[/log][wa:330] "
1013706-50 = "― [log=코노카]ฝนตกลงมาจนได้นะคะ[/log][wa:1548] "
1013706-52 = "― [log=코노카]เห็นว่าจะตกถึงกลางคืนเลยด้วย... เฮ้อ...[/log][wa:1501] "
1013706-55 = "― [log=코노카]แต่มันก็ทำให้สมองให้โล่งดีนะคะ [/log][wa:1847] "
1013706-58 = "[ns] \"เป็นยังไงบ้าง ไม่ได้ผิดหวังมากใช่มั้ย?\""
1013706-59 = "― [log=코노카]คะ? อ่า อืม [/log][wa:2270] "
1013706-61 = "― [log=코노카]ถ้าบอกว่าไม่ผิดหวัง ก็คงเป็นเรื่องโกหกค่ะ [/log][wa:562] "
1013706-64 = "― [log=코노카]ทุกอย่างเปล่าประโยชน์ แล้วฉันก็เปียกโชกไปหมดด้วย...[/log][wa:633] "
1013706-67 = "― [log=코노카]แต่มันก็เป็นไปตามดวงนะคะ [/log][wa:1293] "
1013706-69 = "― [log=코노카]พอมีบัดดี้อยู่ข้างๆ ก็เลยเป็นวันที่ดีค่ะ[/log][wa:1041] "
1013706-72 = "― [log=코노카]ต้องขอบคุณ... คุณครูนะคะ [/log][wa:482] "
1013706-75 = "― [log=코노카]เพราะงั้น ถ้าถามว่ารู้สึกยังไงละก็...[/log][wa:844] "
1013706-77 = "― [log=코노카]ฉันมีความสุขค่ะ[/log]"
1013706-80 = "― [log=코노카]อ๊ะ... ไม่สิคะ คือว่า![/log][wa:543] "
1013706-82 = "― [log=코노카]มีที่ให้มาหลบฝนแบบนี้ด้วย ลักกี้! ฉันก็เลยมีความสุข ฉันจะสื่อแบบนี้น่ะ![/log][wa:986] "
1013706-85 = "― [log=코노카]กะ... ก็ประมาณนี้... น่ะค่ะ... [/log][wa:622] "
1013706-88 = "..."
1013706-89 = "สรุปได้ว่า! ดีเลยละที่หลีกเลี่ยงโชคร้ายที่สุดมาได้"
1013706-90 = "ฉันก็เลยโล่งใจที่เป็นแบบนี้"
1013706-95 = "เหวอ?! มีคนเข้ามาอยู่ก่อนแล้วเหรอ?!"
1013706-96 = "บรรยากาศกำลังดีเลย ขอโทษที่เข้ามาขัดจังหวะนะ จู่ๆ ฝนก็สาดลงมา ฉันขอหลบฝนด้วยคน..."
1013706-97 = "...?"
1013706-98 = "อะไรกัน พี่ก็โดนไล่ล่ามาด้วยเหรอ? งั้นเราก็สภาพเดียวกันเลยน่ะสิ"
1013706-99 = "พอจะเห็นพวกนกกระจอกแถวนี้บ้างหรือเปล่า?"
1013706-103 = "ล้อกันเล่นหรือเปล่าน่ะ...?"
1013706-105 = "[ns] \"เจอตัวแล้ว...\""
1013706-107 = "อ่า..."
1013706-108 = "จู่ๆ ก็อยากออกไปตากฝนขึ้นมาซะงั้น!! งั้นขอตัวก่อนนะ!!"
1013706-112 = "หยุดอยู่ตรงนั้นเลยนะ!!!!!"
1013706-116 = "อย่างเธอเนี่ยนะตำรวจ!! ซุ่มรอให้คนอื่นมาหลบฝนแล้วจะจับเหรอ ขี้ขลาดชะมัด!!"
1013706-117 = "เธอได้โดนลงโทษอย่างหนักแน่!!"
1013706-118 = "ทำไมต้องโดนโทษหนักด้วยล่ะ?!"
1013706-119 = "ก็เธอเข้ามาทำลายบรรยากาศยังไงล่ะ!!!"
1013706-121 = "(แล้วโคโนกะก็วิ่งฝ่าสายฝนไปจับตัวผู้ต้องสงสัยมาได้สำเร็จ)"
1013706-122 = "(แต่ระหว่างทางกลับ โคโนกะเอาแต่เหลียวมองออกไปนอกหน้าต่าง)"
