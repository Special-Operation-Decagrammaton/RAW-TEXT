[translation]
1013706-1 = "The Detective's Buddy"
1013706-2 = "I took a bus to the countryside village Konoka asked me to meet her at."
1013706-4 = "Over here, Sensei!"
1013706-5 = "Thanks for coming. I couldn't take any chances doing this solo after what my horoscope said."
1013706-6 = "There's basic training today, so I couldn't bring anyone from Valkyrie."
1013706-7 = "[s] \"What's the job?\""
1013706-8 = "That's a good question! We'll be canvassing."
1013706-9 = "Someone caused a bit of trouble in D.U. and took off. The last reported sightings of her placed her getting on a bus heading in this direction."
1013706-10 = "I'm sure the suspect will stick out like a sore thumb, so a few friendly locals will be sure to point us in the right direction."
1013706-11 = "Forecast said rain, so let's wrap this up with a bow before it starts coming down!"
1013706-12 = "Let's get going then!"
