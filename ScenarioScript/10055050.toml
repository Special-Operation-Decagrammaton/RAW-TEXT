10055050-197 = "There are a few differences, but..."
10055050-198 = "I'm sure of it! This is the Gehenna emblem!"
10055050-199 = "Gehenna's? Show me."
10055050-200 = ""
10055050-202 = ""
10055050-203 = ""
10055050-204 = ""
10055050-205 = "Good work, Chiaki. This is a significant clue."
10055050-206 = "The emblem on this handkerchief is undoubtedly Gehenna's."
10055050-207 = "Does that mean these pirates were from Gehenna?"
10055050-208 = "How could this have gotten here?"
10055050-209 = "It's not possible. If there were Gehenna students living on a ghost pirate ship, I would know of them."
10055050-210 = "..."
