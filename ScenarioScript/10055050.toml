10055050-45 = "รุ่นพี่ซัตสึกิ?"
10055050-46 = "เงียบๆ ก่อน ฉันกำลังวิเคราะห์สถานการณ์อยู่"
10055050-47 = "อ๊ะ ได้ค่ะ"
10055050-48 = ""
10055050-50 = ""
10055050-51 = "......"
10055050-52 = "........."
10055050-53 = "คือว่า... รุ่นพี่ซัตสึกิคะ?"
10055050-54 = "เรารีบหนีกันดีกว่านะคะ..."
10055050-55 = "ฉันรู้น่า แต่ว่า..."
10055050-56 = "เพราะงั้นเราถึงต้องมีข้อมูลไงว่าใครกำลังไล่ล่าพวกเราอยู่น่ะ"
10055050-57 = "เอ่อ งั้นเหรอคะ...?"
10055050-58 = "จู่ๆ ก็เปิดฉากยิงใส่มาเลยไม่ทันเห็นชัดๆ... ผี? ไม่สิ โจรสลัดหรือเปล่านะ? น่าจะเป็นอย่างนั้นนะคะ?"
10055050-59 = "เอาละ ค่อยๆ มาวิเคราะห์กันทีละอย่าง ก่อนอื่น มองห้องนี้แล้วนึกถึงอะไร?"
10055050-60 = "คะ? ถามฉันเหรอคะ? เอ่อ... เอ่อ... ห้องเก่าๆ ดูโบราณ? เหมือนจะให้ความรู้สึกแบบทรีนิตี้นิดๆ ด้วยค่ะ"
10055050-61 = "ฉันก็ไม่ค่อยรู้เหมือนกันค่ะ อะฮะฮ่า คุณครูคิดว่าไงบ้างคะ?"
10055050-62 = ""
10055050-64 = ""
10055050-65 = "อย่างแรกเลย เฟอร์นิเจอร์ชิ้นนี้ ถ้าอยู่บนบกก็คงเป็นแค่ของเรียบๆ ที่ไม่ได้พิเศษอะไร..."
10055050-66 = "บนเรือใบที่ไม่มีเครื่องยนต์ พื้นที่ถือเป็นสิ่งหรูหรามากเลยนะ อย่าว่าแต่จะวางเฟอร์นิเจอร์ส่วนตัวเลย แค่มีห้องเป็นของตัวเองก็แทบจะนึกภาพไม่ออกแล้ว"
10055050-67 = "ห้องส่วนตัวของผู้มีตำแหน่งสูง หรือห้องพักสำหรับแขกคนสำคัญ...? ไม่สิ ถ้าอย่างนั้นก็ไม่น่าต้องมี#nเครื่องวัดมุมกับแผนที่เดินเรือหรอก"
10055050-68 = "เพราะงั้นก็น่าจะเป็นห้องของผู้ที่มีตำแหน่งสูงในหมู่นักเดินเรือ... หรือก็คือห้องกัปตันยังไงล่ะ"
10055050-70 = "โอ้... โอ้โฮ... ถ้าอย่างนั้นก็หมายความว่า...?"
10055050-71 = "แปลว่ากลุ่มคนพวกนี้มีลำดับชั้นการบังคับบัญชา โดยมีกัปตันเป็นผู้นำไงล่ะ แน่นอนว่าถ้าจะควบคุม#nเรือใหญ่ขนาดนี้ ก็ต้องเป็นแบบนั้นอยู่แล้ว"
10055050-72 = "ไม่สิ ถ้าพูดให้ถูกคงต้องบอกว่าเคยมีมากกว่านะ เพราะถ้าตำนานเรือผีเป็นเรื่องจริง กัปตันก็คงถูกไล่ไปแล้ว"
10055050-73 = "แผนที่เดินเรือตรงนี้ก็น่าสนใจเหมือนกัน เป็นไง ดูออกมั้ย?"
10055050-74 = "อืม... เก่ามากเลยนะคะ..."
10055050-75 = "ขอโทษด้วยนะคะ ฉันดูไม่ออกเลยค่ะ"
10055050-76 = "สำหรับมือใหม่ถือว่ามองได้ดีมาก แต่น่าเสียดายที่เลือกดูเจ้านี่นะ แผ่นหนังอาจเสื่อมสภาพได้เร็วมาก ขึ้นอยู่กับสภาพแวดล้อมที่เก็บรักษาน่ะ"
10055050-77 = "แต่แผนที่เป็นสื่อบันทึกข้อมูล ดูเนื้อหาก็พอจะรู้คร่าวๆ ว่าทำขึ้นเมื่อไร อย่างเช่น เส้นทางเดินเรือที่วาด#nอยู่ตรงนี้ เคยเป็นเส้นทางที่ใช้กันมากที่สุดในคิโวทอส"
10055050-78 = "แต่หลังจากเปิดคลองที่ผ่านเขตปกครองตนเองอะบิดอสเดิม เส้นทางนี้ก็เลิกใช้ไปแล้ว หมายความว่าแผนที่นี้ทำขึ้นก่อนเปิดคลองยังไงล่ะ"
10055050-79 = "ส่วนเครื่องวัดมุมที่เห็นเมื่อกี้นี้ก็เหมือนกัน ถ้ามีอุปกรณ์อิเล็กทรอนิกส์อย่าง GPS กันแล้วละก็ คงไม่จำเป็นต้องใช้เครื่องพวกนั้นแล้วละ"
10055050-80 = "ดูตะเกียงที่เราใช้อยู่ตอนนี้สิ มีรอยเทียนละลายติดอยู่ แล้วตรงไส้เทียนก็มีรอยดับไฟอยู่ใช่มั้ยล่ะ? แปลว่าคนพวกนี้คุ้นเคยกับการใช้เทียนให้แสงสว่างแทนไฟฟ้าไงล่ะ"
10055050-81 = "ดูเหมือนเรือจากเมื่อหลายร้อยปีก่อนจะปรากฏตัวขึ้นมาจริงๆ แล้วละ"
10055050-82 = ""
10055050-84 = ""
10055050-85 = "สรุปก็คือ..."
10055050-86 = "คือ...?"
