[translation]
10055050-1 = "제5화;죽은 악마들의 사회"
10055050-2 = "선생님~ 거기 있어?"
10055050-3 = "……끄응. ……이거, 안 되겠네요."
10055050-4 = "생각보다 깊어요. 단순히 구멍에 빠진 게 아니라, 아예 층이 나뉜 거 같아요."
10055050-5 = "가능하면 구해드리고 싶지만……."
10055050-6 = "이로하! 서둘러라! 놈들이 온다!"
10055050-7 = "……저희도 이런 상황이라서요. 죄송하지만, 지금은 각자도생하죠."
10055050-8 = "기다려라, 사츠키! 선생! 반드시 구하러 오겠다!"
10055050-9 = "선생님! 선배님들! 금방 올게!"
10055050-14 = "…………."
10055050-15 = "아, 아아……."
10055050-20 = "사, 사츠키 선배! 정신 차리세요!"
10055050-21 = "선생님! 어쩌죠! 사츠키 선배는 어두운 것과 무서운 게 쥐약이란 말이에요!"
10055050-22 = "[s1] \"일단, 조명을 찾아보자!\"\n[s2] \"불을 밝히면 괜찮아질 거야!\""
10055050-25 = "과연! 나이스 아이디어입니다!"
10055050-31 = "선생님! 사츠키 선배!"
10055050-32 = "전등 스위치는 못 찾았지만, 랜턴을 발견했습니다!"
10055050-33 = "자, 잘했어, 치아키! 빨리 불을 밝혀!"
10055050-34 = "네엡! 자, 빛이여!"
10055050-41 = "뭐야, 그냥 평범한 방이잖아. 괜히 무서워했어."
10055050-42 = "아핫. 그렇지만 유령선이라고 딱히 무시무시한 것은 없네요."
10055050-43 = "그나저나, 이로하 쨩 말대로네요. 이렇게 아예 다른 층에 떨어져 버릴 줄이야……."
10055050-44 = "……."
10055050-45 = "사츠키 선배?"
10055050-46 = "조용히. 지금, 분석 중이니까."
10055050-47 = "앗, 넵."
10055050-51 = "……."
10055050-52 = "…………."
10055050-53 = "……저기~ 사츠키 선배?"
10055050-54 = "저희 빨리 도망치는 편이……."
10055050-55 = "알아. 그렇지만!"
10055050-56 = "그걸 위해서, 정보가 필요한 거야. 우리는 누구에게 쫓기고 있지?"
10055050-57 = "어, 글쎄요……?"
10055050-58 = "갑자기 총을 쏴서 제대로 못 봤는데…… 유령? 아니, 해적이었나? 그런 느낌이었던 거 같기도?"
10055050-59 = "……좋아, 하나씩 하자. 일단, 이 방을 보면 뭐가 떠올라?"
10055050-60 = "네? 저 말인가요? 어, 어어…… 낡았다? 고풍스럽다? 좀 트리니티 느낌이 나는 것 같기도."
10055050-61 = "……저는 잘 모르겠네요, 아하하. 선생님은 어떠신가요?"
10055050-65 = "일단, 이 가구, 육지에서라면 소박한, 그다지 대단할 것 없는 물건이지만……."
10055050-66 = "엔진이 없는 범선에서 공간은 대단한 사치품이야. 개인 가구를 놓는 것은 물론, 방을 따로 가지는 것조차 쉽게 상상하기 어려울 만큼."
10055050-67 = "상당한 고위직의 개인실, 또는 귀빈용 객실……? 아니, 그렇다면 육분의나 해도 같은 물건은 필요 없겠지."
10055050-68 = "그러니까, 여기는 항해사 중에서도 상위 직책…… 즉, 선장실일 가능성이 높네."
10055050-70 = "오, 오오…… 그렇다는 것은……?"
10055050-71 = "이 무리는 선장을 중심으로 한 위계질서가 있는 집단이라는 거야. 물론, 이만한 배를 운용하기 위해서는 당연한 일이겠지만."
10055050-72 = "아니, 정확히는 있었던, 이라고 해야 할까? 유령선 전설이 사실이라면, 선장은 쫓겨났을 테니까."
10055050-73 = "……여기 해도도 꽤 흥미로워. 어때, 알겠어?"
10055050-74 = "으~음. 엄청 낡았다……?"
10055050-75 = "죄송해요. 전혀 모르겠네요."
10055050-76 = "초심자치고는 나쁘지 않은 접근이야. 하지만 그 대상이 아쉽네. 양피지는 보존 환경에 따라 상태가 대단히 빠르게 열화될 수 있거든."
10055050-77 = "대신 지도는 기록 매체이니, 그 내용을 보면 어렴풋이 제작 시기를 알 수 있지. 예를 들어, 여기 그려진 해로는 한때 키보토스에서 가장 일반적인 항로였지만……."
10055050-78 = "옛 아비도스 자치구를 경유하는 운하가 개통된 이래로는 더는 사용되지 않게 되었어. 즉, 이 지도는 운하 개통 이전의 물건이라는 뜻이네."
10055050-79 = "아까 봤던 육분의만 해도, GPS처럼 전자 장치가 있다면 쓸모없는 물건이고……."
10055050-80 = "지금 우리가 쓰고 있는 랜턴도, 봐. 촛농이 녹아 있고, 심지에는 불을 끈 흔적이 있지? 전등이 아니라 양초로 불을 밝히는 생활 방식이 익숙한 거야."
10055050-81 = "말 그대로 수백 년 전의 배가 나타난 것 같아."
10055050-85 = "결론을 내리면, 즉."
10055050-86 = "즉……?"
10055050-91 = "이 배는 진짜로 유령선…… 꼬르륵……."
10055050-92 = "아앗! 사츠키 선배! 정신 차리세요!"
10055050-95 = "아, 아아…… 어디까지 얘기했지?"
10055050-96 = "그, 이 배가 수백 년 전에서 온 것 같다고……."
10055050-97 = "……그거 말고, 조금 더 무서운 뭔가가 있었던 거 같은데……."
10055050-98 = "아, 아니요! 더 이야기해 주세요!"
10055050-99 = "……? 뭐, 좋아. 떠오르지 않는 걸 보면, 중요한 건 아니겠지."
10055050-103 = "일단, 이 배와 승무원들이 정말 수백 년 전의 것을 그대로 쓰고 있다면, 어쩌면 승산이 있을지도 몰라."
10055050-105 = "승산이요?"
10055050-106 = "그래, 아무리 관리를 잘했어도, 수백 년이나 사용한 총기가 멀쩡할 리가 없잖아?"
10055050-107 = "아까는 당황해서 일방적으로 쫓겼지만, 막상 싸워보면 우리에 비해 화력이나 명중률이 형편없을 게……."
10055050-111 = "그래도 싸우는 건 무섭고 싫은데…… 치아키가 대신 싸워주면 안 될까?"
10055050-112 = "아하하…… 제가 최대한 지켜드릴게요."
10055050-113 = "진짜지? 약속한 거다?"
10055050-114 = "……어라, 선생은 왜 그렇게 넋 나간 표정이야?"
10055050-115 = "[s3] \"아니, 사츠키는 대단하구나 싶어서.\"\n[s4] \"이 상황에서도 용케 침착하네.\""
10055050-118 = "침착하다? 응…… 아무래도 치아키나, 이로하보다는 그렇겠지?"
10055050-119 = "걔네는 '2학년'이니까."
10055050-120 = "응? 왜 그래?"
10055050-121 = "아, 선생님은 게헨나로 치면 아직 '1학년'인 셈이구나. 그렇다면 모르는 게 당연해. 알 필요도 없고."
10055050-122 = "굳이 설명하자면, 경험 차이 정도라고 해둘게."
10055050-123 = "선생에게는, 좀 더 자세하게 이야기할 날이 올지 모르겠네."
10055050-124 = "그래도 별로 길게 하고 싶지는 않아."
10055050-128 = "일단, 여기에는 더 알아낼 정보도 없는 듯하고."
10055050-129 = "배에서 탈출하려면 갑판 위로 돌아가야 하니까……."
10055050-130 = "슬슬 이동할까?"
10055050-137 = "네? 선생님, 혹시 부르셨나요?"
10055050-138 = "[s5] \"그냥 조금 궁금해서.\"\n[s6] \"만마전에서 사츠키는 항상 이런 느낌이야?\""
10055050-141 = "으음~ 그렇지는 않네요."
10055050-142 = "아뇨. 오히려, 처음이에요! 이런 모습의 사츠키 선배는!"
10055050-143 = "솔직히 엄청 위기지만, 두근두근거리네요! 아직도 만마전에 제가 모르는 모습이 남아 있을 줄은!"
10055050-144 = "……응? 아니, 그 반대일지도?"
10055050-145 = "그러고 보면, 사츠키 선배에 대해서는 모르는 부분밖에 없네요."
10055050-146 = "언제나 마코토 선배 곁에서 NK 울트라 계획처럼 어려운 이야기를 한다는 이미지밖에 없고……."
10055050-147 = "그치만~ 선배님들은 제가 입학하기 전 이야기는 전혀 안 해주시고~"
10055050-148 = "베일 장막 뒤편의 인물이라고 할까, 비밀이 많으시죠?"
10055050-149 = "역시 만마전의 정보부장이라는 걸까요?"
10055050-150 = "[s7] \"사츠키가 그렇게 비밀이 많았던가……?\"\n[s8] \"솔직한 직구파라는 느낌이었던 거 같은데.\""
10055050-153 = "어라라~ 역시 선생님과 학생의 시점은 다른 걸까요?"
10055050-154 = "아앗! 이럴 수가! 엄청나게 좋은 기사가 떠올랐어요!"
10055050-155 = "이름하여 <선생님이 보는 학생들은 어떤 이미지인가?!> 대특집!"
10055050-156 = "어떤가요? 꽤 좋은 반향을 불러일으킬 거 같은데! 육지로 무사 귀환한다면, 부디 취재에 응해주세요!"
10055050-157 = "잠깐, 뭘 그렇게 둘이서만 떠드는 거야! 나 혼자 두지 말고, 빨리들 와!"
10055050-158 = "아차차! 모토미야 치아키, 지금 갑니다!"
10055050-165 = "여기는, 창고인가요?"
10055050-166 = "잠깐, 너무 어둡잖아! 조명은 없어?"
10055050-167 = "아까 랜턴을 가지고 올 걸 그랬네요. 아니, 지금이라도 가져올까요?"
10055050-168 = "잠깐, 가지 마! 사람이 줄어들면 무섭다고!"
10055050-169 = "……어쩔 수 없네."
10055050-176 = "선생, 잡아줘."
10055050-180 = "그래, 그렇게. 절대 놓으면 안 돼? 알겠지? 절대로야?"
10055050-181 = "이만한 규모의 창고라면, 틀림없이 적지 않은 정보가 있을 거야. 그것만 찾아내면……."
10055050-182 = "…………."
10055050-183 = "역시 안 되겠어! 치아키! 출동!"
10055050-184 = "네엡! 만마전의 서기, 모토미야 치아키! 돌격합니다!"
10055050-185 = "뭔가 단서가 될 만한 게……."
10055050-189 = "응? 어라, 이거는……."
10055050-190 = "선생님, 사츠키 선배! 여기 이런 물건이 있는데요!"
10055050-191 = "[s9] \"손수건?\"\n[s10] \"무슨 문양이 새겨져 있는데…….\""
10055050-197 = "제가 아는 것과 살짝 모양이 다르기는 하지만……."
10055050-198 = "그래도, 잘못 볼 리가 없어요! 이건, 게헨나의 교표예요!"
10055050-199 = "게헨나의 교표라고? 잠깐, 보여줘."
10055050-205 = "잘했어, 치아키. 이건 큰 수확이야."
10055050-206 = "일단, 이 손수건에 새겨진 건, 게헨나에서 만든 엠블럼이 맞아."
10055050-207 = "그러면 이 해적들은, 사실 게헨나 학생이었던 걸까요?"
10055050-208 = "하지만 어째서 이 물건이……?"
10055050-209 = "그렇지만 이 정도로 독특한 애들이라면, 제가 모를 리가 없는데 신기하네요."
10055050-210 = "…………."
10055050-211 = "저기, 사츠키 선배?"
10055050-212 = "……(중얼중얼)"
10055050-213 = "[s11] \"엄청난 집중력…….\"\n[s12] \"순식간에 몰입했네.\""
10055050-216 = "아하하…… 그러게요."
10055050-217 = "……그나저나, 저희 이러고 있어도 괜찮은 걸까요?"
10055050-218 = "아까부터 꽤 오래 헤매고 있는 거 같은데, 지금쯤이면 그 해적들이 저희를 찾아도 이상하지……."
10055050-222 = "우와아앗?! 진짜 나타났다?!"
10055050-223 = "꺄! 뭐야! 치아키! 선생, 선생님! 빨리 해치워!"
10055050-225 = "요호호호! 여기 있었군!"
10055050-226 = "[s] \"이 목소리는……\""
10055050-228 = "[ns] \"혹시, 마코토?\""
10055050-230 = "아니, 이 몸은 마코토가 아니다."
10055050-231 = "이제부터는 이 몸을 '캡틴 마코토'라고 부르도록!"
