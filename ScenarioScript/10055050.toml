10055050-31 = "คุณครู! รุ่นพี่ซัตสึกิ!"
10055050-32 = "ถึงหาสวิตช์ไฟไม่เจอ แต่ฉันเจอตะเกียงแล้วค่ะ!"
10055050-33 = "กะ... เก่งมาก จิอากิจัง! รีบจุดไฟเร็วเข้า!"
10055050-34 = "ค่ะ! เอาละ แสงสว่างจงมา!"
