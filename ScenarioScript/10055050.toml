10055050-216 = "Ahaha... She really did."
10055050-217 = "...By the way, is it really okay for us to just be standing around like this?"
10055050-218 = "We've been wandering around and making noise for a while... Those pirates must have caught up to us by now..."
10055050-219 = ""
