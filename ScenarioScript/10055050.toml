[translation]
10055050-1 = "Episode 5;Dead Demons Society"
10055050-2 = "Sensei, are you there?"
10055050-3 = "Ugh... This isn't good."
10055050-4 = "You fell down pretty deep. I think you might've fallen all the way to the lower level of the ship."
10055050-5 = "I'd help you if I could, but..."
10055050-6 = "Iroha! Hurry! They're coming!"
10055050-7 = "...We've got our own problems up here. Sorry, but you'll have to take care of yourself for now."
10055050-8 = "Hang in there, Satsuki! Sensei! I swear I'll return for you!"
10055050-9 = "Sensei! Everyone! Ibuki will be back soon!"
10055050-10 = ""
10055050-13 = ""
10055050-14 = "..."
10055050-15 = "A-Ah..."
10055050-16 = ""
10055050-18 = ""
10055050-19 = ""
10055050-20 = "S-Satsuki! Snap out of it!"
10055050-21 = "Sensei! What do we do?! Satsuki can't handle the dark! Or really anything scary!"
10055050-22 = "[s1] \"First, let's find some light!\"\n[s2] \"She'll feel better if we can brighten things up.\""
10055050-25 = "Oooh, good idea, Sensei!"
10055050-26 = ""
10055050-28 = ""
10055050-29 = ""
10055050-30 = ""
10055050-31 = "Sensei! Satsuki!"
10055050-32 = "I don't know about electricity down here, but I found a lantern."
10055050-33 = "E-Excellent work, Chiaki! Light it immediately!"
10055050-34 = "Yes! All right, blinding light!"
10055050-35 = ""
10055050-37 = ""
10055050-39 = ""
10055050-40 = ""
10055050-41 = "What? It's a completely normal room. I was scared for nothing."
10055050-42 = "Aha! Ghost ships aren't as scary as they're cracked up to be!"
10055050-43 = "I think Iroha was right, though. We're waaay down here."
10055050-44 = "..."
10055050-45 = "Satsuki?"
10055050-46 = "Quiet. I'm analyzing the situation."
10055050-47 = "Ah, right."
10055050-48 = ""
10055050-50 = ""
10055050-51 = "..."
10055050-52 = "..."
10055050-53 = "Um... Satsuki?"
10055050-54 = "Shouldn't we be trying to...go up?"
10055050-55 = "Yes, of course! However!"
10055050-56 = "We're in an unknown situation. So first, what do we know? Who or what was chasing us?"
10055050-57 = "Uh... I'm not sure...?"
10055050-58 = "It all happened so fast... Um, I think they looked like ghosts? Or pirates? Something along those lines."
10055050-59 = "...Okay, let's assess our current situation. What do you think of this room?"
10055050-60 = "The room? Uh, well... I guess it gives me old-timey vibes, kind of like Trinity."
10055050-61 = "...That's all I've got! Sensei, what do you think?"
10055050-62 = ""
10055050-64 = ""
10055050-65 = "For starters, this furniture would be fairly plain and unremarkable on land..."
10055050-66 = "But on a sailing ship without an engine, space is a major luxury. Having any personal furniture is unusual enough, let alone an entire private room."
10055050-67 = "So it would follow that the room is for someone important... The sextant and nautical charts suggest that it was not a guest room either."
10055050-68 = "I would surmise that this room belonged to the captain of the ship."
10055050-70 = "O-Oh... Which would mean...?"
10055050-71 = "This group likely functioned as a hierarchical organization, centered around the captain. I suppose that is only natural for a ship this large."
10055050-72 = "Or rather, it once did. According to the legends, the captain was driven out."
10055050-73 = "...This nautical chart is interesting too. Does anything catch your eye about it?"
10055050-74 = "Hmm... It's really old...?"
10055050-75 = "Sorry, I have no idea."
10055050-76 = "That's not a bad guess for a beginner. But age is hard to judge from parchment alone. Depending on how it's stored, it can deteriorate very quickly."
10055050-77 = "A map records information, though, so its contents can give us a rough idea of when it was made. For example, the sea pass shown here was once the most common trading route in Kivotos..."
10055050-78 = "But it fell into complete disuse after the canal through the old Abydos District opened. It's not included in maps these days, so it must be from at least before the canal was built."
10055050-79 = "The sextant we saw earlier is another clue. With electronic systems like GPS, people don't carry sextants on their ships anymore."
10055050-80 = "And observe the lantern we're using. There's melted wax inside, and you can see where the wick was snuffed out, correct? They were accustomed to lighting their rooms with candles rather than electricity."
10055050-81 = "All signs point to this ship being hundreds of years old. And it appeared out of nowhere."
10055050-82 = ""
10055050-84 = ""
10055050-85 = "I can only conclude..."
10055050-86 = "Yes...?"
10055050-87 = ""
10055050-89 = ""
10055050-90 = ""
10055050-91 = "That this ship...truly is a ghost ship... *thud*"
10055050-92 = "Ah! Satsuki! Wake up!"
10055050-94 = ""
10055050-95 = "Ah... Where was I?"
10055050-96 = "Um, you were saying this ship seems to be from hundreds of years ago..."
10055050-97 = "...Wasn't there something a little scarier than that...?"
10055050-98 = "N-No! Nothing at all! Please, keep going!"
10055050-99 = "Hm...? Well, if I can't remember, it probably wasn't important."
10055050-100 = ""
10055050-102 = ""
10055050-103 = "Anyway, if all of that is true, that would mean that all of the crew's equipment is from hundreds of years ago. Which provides us a fighting chance."
10055050-105 = "Enough to win?"
10055050-106 = "Precisely so. Even if their guns were perfectly maintained, time must have taken its toll on them."
10055050-107 = "While they had the element of surprise in their favor in our first encounter, I believe we would overpower them in firepower and accuracy in another clash."
10055050-108 = ""
10055050-110 = ""
10055050-111 = "But I hate fighting... It's scary... I need you to do the fighting for me, please!"
10055050-112 = "Ahaha... I'll do my best to protect you."
10055050-113 = "Really? You promise?"
10055050-114 = "...Hm? Sensei, why do you look so stunned?"
10055050-115 = "[s3] \"I was just thinking how impressive you are, Satsuki.\"\n[s4] \"You're surprisingly calm, even in a situation like this.\""
10055050-118 = "Hm... I suppose I am, compared to Chiaki and Iroha."
10055050-119 = "They're only second years, after all."
10055050-120 = "Are you still confused?"
10055050-121 = "Ah, I suppose you'd only be a \"first year\" by Gehenna standards, Sensei. You wouldn't have needed to know this."
10055050-122 = "To put it into words... It's simply a difference in experience."
10055050-123 = "If the occasion arises, I'll give you all the details one day."
10055050-124 = "Although I'd rather avoid the topic if I could."
10055050-125 = ""
10055050-127 = ""
10055050-128 = "Ahem. Well, that seems to be all the useful information we can glean from here."
10055050-129 = "The only way for us to disembark from this ship will be from the deck."
10055050-130 = "Shall we get moving?"
10055050-135 = ""
10055050-136 = ""
10055050-137 = "Hm? Sensei, do you need something?"
10055050-138 = "[s5] \"I was just curious about something.\"\n[s6] \"Is Satsuki always like this?\""
10055050-141 = "Hmm... Not really."
10055050-142 = "Actually, not at all! It's my first time seeing her like this too."
10055050-143 = "I know this situation is nothing to laugh at, but it's like stumbling on a good scoop! I didn't know there were things I still didn't know about my fellow members."
10055050-144 = "Actually, I think it's the complete opposite..."
10055050-145 = "What DO I know about Satsuki?"
10055050-146 = "I've always just seen her as the shadow by Makoto's side who always went on and on about the \"NK Ultra Project\" thing."
10055050-147 = "But all of the upperclassmen are really tight-lipped about what happened before I started going here."
10055050-148 = "She's actually kind of an unknown variable, isn't she? Like a vault of secrets and you have no idea what's inside."
10055050-149 = "She is the Pandemonium Society's Intelligence Committee Director, after all."
10055050-150 = "[s7] \"Is Satsuki really that mysterious...?\"\n[s8] \"I've always found her to be honest and sincere.\""
10055050-153 = "Whoaaa, teachers and students really do experience things differently, don't they?"
10055050-154 = "Ah! I've got it! I just thought of a fantastic headline!"
10055050-155 = "\"The Students Through Sensei's Eyes!\" It'll be a special feature!"
10055050-156 = "People would love it! Do you wanna do it? Please! Let me interview you once we get back home!"
10055050-157 = "Why are you two dawdling around?! Don't leave me alone for an instant! Hurry, hurry!"
10055050-158 = "Whoops! Motomiya Chiaki, on her way!"
10055050-159 = ""
10055050-161 = ""
10055050-164 = ""
10055050-165 = "Is this some kind of storage?"
10055050-166 = "Whatever it is, it's pitch black! Is there no light?"
10055050-167 = "Augh! We should've brought the lantern! Should I go back and grab it?"
10055050-168 = "No, no! Don't go! We need to stick together!"
10055050-169 = "...We've come to this."
10055050-170 = ""
10055050-172 = ""
10055050-173 = ""
10055050-175 = ""
10055050-176 = "Sensei, hold my hand."
10055050-179 = ""
10055050-180 = "Just like that. Do not let go. Understand? Do. Not. Let. Go."
10055050-181 = "This storeroom is huge. I'm sure we'll be able to dig up plenty of useful clues..."
10055050-182 = "..."
10055050-183 = "I can't do this! Chiaki, I choose you!"
10055050-184 = "Yes, ma'am! Motomiya Chiaki, secretary of the Pandemonium Society, moving in!"
10055050-185 = "Hm... Something that looks like a clue..."
10055050-186 = ""
10055050-188 = ""
10055050-189 = "Hmm? Wait, this—!"
10055050-190 = "Sensei, Satsuki! Look at this!"
10055050-191 = "[s9] \"A handkerchief?\"\n[s10] \"There's some kind of emblem on it...\""
10055050-192 = ""
10055050-193 = ""
10055050-195 = ""
