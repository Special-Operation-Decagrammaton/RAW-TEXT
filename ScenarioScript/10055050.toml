10055050-172 = ""
10055050-173 = ""
10055050-175 = ""
10055050-176 = "ครู ช่วยจับไว้หน่อยสิ"
10055050-179 = ""
10055050-180 = "ใช่ แบบนั้นแหละ ห้ามปล่อยเด็ดขาดเลย เข้าใจมั้ย? ห้ามเด็ดขาดเลยนะ"
10055050-181 = "คลังเก็บของใหญ่ขนาดนี้ต้องมีข้อมูลอยู่ไม่น้อยแน่ๆ ขอแค่เราหาให้เจอ..."
