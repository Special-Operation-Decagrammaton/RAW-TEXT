[translation]
10055050-1 = "第5話;死去惡魔們的社會"
10055050-2 = "老師～你在嗎？"
10055050-3 = "唔……看來是不行了呢。"
10055050-4 = "比想像中還深。這不只是掉進洞裡而已，似乎是直接掉到不同樓層了。"
10055050-5 = "可以的話我是很想救你們……"
10055050-6 = "伊呂波！動作快！那些傢伙來了！"
10055050-7 = "……可惜我們這邊也處於這種狀況。#n不好意思，現在只能各自想辦法求生了。"
10055050-8 = "等著吧，皐月！老師！我一定會回來救你們的！"
10055050-9 = "老師！前輩們！我們馬上就回來哦！"
10055050-10 = ""
10055050-13 = ""
10055050-14 = "…………"
10055050-15 = "啊，啊啊……"
10055050-16 = ""
10055050-18 = ""
10055050-19 = ""
10055050-20 = "皐，皐月前輩！請振作一點！"
10055050-21 = "老師！怎麼辦啊！皐月前輩最怕黑跟恐怖的東西了！"
10055050-22 = "[s1] 「先找找看有沒有燈吧！」\n[s2] 「只要有亮光就會沒事的！」"
10055050-25 = "原來如此！真是好主意！"
10055050-26 = ""
10055050-28 = ""
10055050-29 = ""
10055050-30 = ""
10055050-31 = "老師！皐月前輩！"
10055050-32 = "雖然沒找到電燈開關，但我找到提燈了！"
10055050-33 = "做，做得好，千秋！快把燈點亮！"
10055050-34 = "好的！來吧，亮起來！"
10055050-35 = ""
10055050-37 = ""
10055050-39 = ""
10055050-40 = ""
10055050-41 = "什麼啊，不就是普通的房間嘛。害我白害怕一場。"
10055050-42 = "啊哈。看來幽靈船好像也沒什麼可怕的東西呢。"
10055050-43 = "不過，還真被伊呂波醬說中了呢。#n沒想到會直接掉到不同的樓層……"
10055050-44 = "……"
10055050-45 = "皐月前輩？"
10055050-46 = "安靜。我現在正在分析。"
10055050-47 = "啊，好的。"
10055050-48 = ""
10055050-50 = ""
10055050-51 = "……"
10055050-52 = "…………"
10055050-53 = "……那個～皐月前輩？"
10055050-54 = "我們還是快點逃走比較……"
10055050-55 = "這我當然知道。可是……！"
10055050-56 = "正因如此，才需要情報啊。#n我們到底是被誰追著跑？"
10055050-57 = "呃，是誰呢……？"
10055050-58 = "對方突然就開槍，我根本沒看清楚……是幽靈嗎？還是海盜？好像有點那種感覺？"
10055050-59 = "……好吧，我們一個一個來。#n首先，看到這個房間會讓你聯想到什麼？"
10055050-60 = "咦？是在問我嗎？我想想……很舊？很古色古香？好像還有點三一的感覺。"
10055050-61 = "……我不太清楚呢，啊哈哈。老師覺得呢？"
10055050-62 = ""
10055050-64 = ""
10055050-65 = "首先是這件家具。雖然在陸地上只是很樸素、沒什麼特別的東西……"
10055050-66 = "不過在沒有引擎的帆船上，擁有空間可是很奢侈的。#n別說要擺放個人家具，就連擁有獨立房間都是很難想像的事。"
10055050-67 = "地位相當高的人的私人房間，或是貴賓用的客房……？#n不對，如果是那樣，就不需要六分儀或海圖這類東西了。"
10055050-68 = "所以，這裡應該是航海士中地位更高的人……也就是說，很可能是船長室。"
10055050-70 = "哦，哦哦……也就是說……？"
10055050-71 = "這代表這群人是以船長為中心、有明確階級制度的集團。#n當然，要運作這麼大一艘船，這也是理所當然的。"
10055050-72 = "不對，正確來說應該是「曾經有」吧？#n如果幽靈船傳說是真的，船長應該已經被趕走了。"
10055050-73 = "……這張海圖也相當有意思。#n怎麼樣，看得出什麼嗎？"
10055050-74 = "唔嗯～很舊……？"
10055050-75 = "對不起，我完全看不出來。"
10055050-76 = "以初學者來說是個不錯的切入點，可惜你選錯了對象。#n根據保存環境的不同，羊皮紙有可能很快就發生劣化。"
10055050-77 = "不過地圖是記錄媒介，只要看內容就能大致推測出製作時期。#n例如這裡畫的海路，曾經是奇普托斯最普遍的航線……"
10055050-78 = "但是在經過舊阿拜多斯自治區的運河開通之後，就再也沒有人使用了。#n也就是說，這張地圖是在運河開通之前製作的。"
10055050-79 = "還有剛才看到的六分儀，只要有GPS之類的電子裝置，根本派不上用場……"
10055050-80 = "再看看我們現在用的這盞提燈。上面有融化的燭淚，燈芯也有熄滅過的痕跡對吧？#n從這裡可以看出，他們使用的照明方式不是電燈而是蠟燭。"
10055050-81 = "簡直就像幾百年前的船真的出現了一樣。"
10055050-82 = ""
10055050-84 = ""
10055050-85 = "總結起來就是……"
10055050-86 = "就是……？"
10055050-87 = ""
10055050-89 = ""
10055050-90 = ""
10055050-91 = "這艘船，真的是幽靈船……啪噠……"
10055050-92 = "啊啊！皐月前輩！請振作一點！"
10055050-94 = ""
10055050-95 = "啊，啊啊……我說到哪裡了？"
10055050-96 = "那個，你剛才說這艘船好像是從幾百年前來的……"
10055050-97 = "總覺得好像還有比那更可怕的東西……"
10055050-98 = "沒，沒有沒有！請你繼續說下去！"
10055050-99 = "……？算了。既然想不起來，應該也不是什麼重要的事。"
10055050-100 = ""
10055050-102 = ""
10055050-103 = "首先，如果這艘船和乘務員真的還在使用幾百年前的東西，那我們或許還有勝算。"
10055050-105 = "勝算？"
10055050-106 = "沒錯。就算保養得再好，用了幾百年的槍枝也不可能完好無缺吧？"
10055050-107 = "剛才是因為太慌張才被單方面追著跑……#n要是真的打起來，他們的火力和命中率應該遠不如我們才對。"
10055050-108 = ""
10055050-110 = ""
10055050-111 = "可是戰鬥好可怕，我不想打……千秋可以代替我上場嗎？"
10055050-112 = "啊哈哈……我會盡全力保護你的。"
10055050-113 = "真的嗎？說好了哦？"
10055050-114 = "……哎呀，老師怎麼一副失魂落魄的樣子？"
10055050-115 = "[s3] 「沒有，只是覺得皐月真厲害。」\n[s4] 「在這種狀況下還能這麼冷靜。」"
10055050-118 = "冷靜？嗯……至少比千秋和伊呂波冷靜吧？"
10055050-119 = "畢竟那些孩子是「2年級」嘛。"
10055050-120 = "嗯？怎麼了？"
10055050-121 = "啊，換算成格黑娜的話，老師還只是「1年級」呢。#n那麼你不知道也是理所當然的。況且也沒必要知道。"
10055050-122 = "硬要解釋的話，應該說是經驗的差距吧。"
10055050-123 = "或許總有一天，我會跟老師解釋得更詳細一點。"
10055050-124 = "雖然我也不太想說太多就是了。"
10055050-125 = ""
10055050-127 = ""
10055050-128 = "總之，這裡似乎查不到更多情報了呢。"
10055050-129 = "想從船上逃出去的話，就得回到甲板上才行……"
10055050-130 = "我們差不多該走了吧？"
10055050-135 = ""
10055050-136 = ""
10055050-137 = "咦？老師，你叫我嗎？"
10055050-138 = "[s5] 「只是有點好奇。」\n[s6] 「皐月在萬魔殿也總是這種感覺嗎？」"
10055050-141 = "唔嗯～倒也不是那樣呢。"
10055050-142 = "不對，應該說我還是第一次看到這樣的皐月前輩呢！"
10055050-143 = "老實說雖然情況很危急，但我還挺興奮的！#n沒想到萬魔殿居然還有我不知道的一面！"
10055050-144 = "……嗯？不對，或許正好相反？"
10055050-145 = "這麼說來，我幾乎完全不知道關於皐月前輩的事呢。"
10055050-146 = "我對他的印象就只有總是在真琴前輩身邊，#n講著像是NK-ULTRA計畫之類的艱澀話題而已……"
10055050-147 = "可是～前輩們完全不跟我說我入學之前的事～"
10055050-148 = "不知道該說躲藏在帷幕之後，還是充滿了祕密……"
10055050-149 = "果然是因為他是萬魔殿的情報部長嗎？"
10055050-150 = "[s7] 「皐月有那麼多秘密嗎……？」\n[s8] 「我還以為他是直來直往的那種人。」"
10055050-153 = "哎呀呀～果然老師和學生的視角不太一樣嗎？"
10055050-154 = "天啊！我想到超棒的報導題材了！"
10055050-155 = "就叫做〈老師眼中的學生是什麼樣的形象！？〉大特輯！"
10055050-156 = "怎麼樣？應該會引起不錯的迴響吧！#n如果能平安回到陸地上，請務必接受採訪哦！"
10055050-157 = "等一下，你們兩個在那邊聊什麼啊！#n別丟下我一個人，快點過來啦！"
10055050-158 = "哎呀呀！元宮千秋，馬上過去！"
10055050-159 = ""
10055050-161 = ""
10055050-164 = ""
10055050-165 = "這裡是倉庫嗎？"
10055050-166 = "等一下，這也太暗了吧！沒有照明嗎？"
10055050-167 = "早知道剛才就把提燈帶過來了……還是我現在去拿？"
10055050-168 = "等一下，別走！人變少的話很可怕耶！"
10055050-169 = "……沒辦法了。"
10055050-170 = ""
10055050-172 = ""
10055050-173 = ""
10055050-175 = ""
10055050-176 = "老師，牽著我的手。"
10055050-179 = ""
10055050-180 = "對，就是這樣。絕對不能放開哦？知道嗎？絕對哦？"
10055050-181 = "這種規模的倉庫，肯定藏著不少情報。#n只要能找出來……"
10055050-182 = "…………"
10055050-183 = "果然還是不行！千秋！出動吧！"
10055050-184 = "好的！萬魔殿的書記，元宮千秋！發動突擊！"
10055050-185 = "有沒有什麼能當作線索的東西……"
10055050-186 = ""
10055050-188 = ""
10055050-189 = "嗯？咦，這是……"
10055050-190 = "老師，皐月前輩！這裡有樣東西！"
10055050-191 = "[s9] 「手帕？」\n[s10] 「上面好像有什麼圖案……」"
10055050-192 = ""
10055050-193 = ""
10055050-195 = ""
10055050-196 = ""
10055050-197 = "雖然形狀跟我知道的有點不一樣……"
10055050-198 = "但我不可能看錯！這是格黑娜的校徽！"
10055050-199 = "你說格黑娜的校徽？等一下，給我看看。"
10055050-200 = ""
10055050-202 = ""
10055050-203 = ""
10055050-204 = ""
10055050-205 = "做得好，千秋。這是很大的收穫。"
10055050-206 = "首先，這條手帕上的圖案，確實是格黑娜的徽章沒錯。"
10055050-207 = "意思是這些海盜們，其實是格黑娜的學生嗎？"
10055050-208 = "可是為什麼會有這個東西……？"
10055050-209 = "這麼有個性的人，我不可能會不知道啊……真奇怪。"
10055050-210 = "…………"
10055050-211 = "那個，皐月前輩？"
10055050-212 = "……（喃喃自語）"
10055050-213 = "[s11] 「好驚人的專注力……」\n[s12] 「一下子就進入狀況了。」"
10055050-216 = "啊哈哈……就是說啊。"
10055050-217 = "……不過，我們這樣待著真的沒問題嗎？"
10055050-218 = "好像已經在這裡迷路很久了，現在那些海盜們就算找到我們也不奇怪……"
10055050-219 = ""
10055050-221 = ""
10055050-222 = "哇啊啊啊！？真的出現了！？"
10055050-223 = "呀啊！什麼啊！千秋！老師，老師！快點解決他們！"
10055050-225 = "喲呵呵呵！原來你們在這裡啊！"
10055050-226 = "[s] 「這個聲音是……」"
10055050-227 = ""
10055050-228 = "[ns] 「難道是真琴？」"
10055050-229 = ""
10055050-230 = "不，本大人不是真琴。"
10055050-231 = "從現在起，請稱呼本大人為「真琴船長」！"
