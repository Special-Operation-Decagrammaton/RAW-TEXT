[translation]
10055050-1 = "ตอนที่ 5;สังคมของปีศาจผู้ล่วงลับ"
10055050-2 = "คุณครู~ อยู่ตรงนั้นรึเปล่า?"
10055050-3 = "อึก... แบบนี้คงไม่ไหวแล้วค่ะ"
10055050-4 = "ตกลงมาลึกกว่าที่คิดไว้เลยนะคะ คงไม่ใช่แค่ตกหลุมแล้ว แต่เหมือนตกลงไปคนละชั้นเลยค่ะ"
10055050-5 = "ถ้าทำได้ก็อยากช่วยขึ้นมานะคะ แต่ว่า..."
10055050-6 = "อิโรฮะ! เร็วเข้า! พวกมันมาแล้ว!"
10055050-7 = "ทางเราก็อยู่ในสถานการณ์ยุ่งยากเหมือนกันค่ะ ขอโทษด้วยนะคะ ตอนนี้ต่างคนต่างเอาตัวรอดกันก่อน#nเถอะค่ะ"
10055050-8 = "รอก่อนนะ ซัตสึกิ! ครู! เราจะไปช่วยให้ได้!"
10055050-9 = "คุณครู! รุ่นพี่! เดี๋ยวอิบูกิกลับมานะ!"
