10055050-89 = ""
10055050-90 = ""
10055050-91 = "เรือลำนี้เป็นเรือผีจริงๆ ด้วย... อึก..."
10055050-92 = "อ๊ะ! รุ่นพี่ซัตสึกิ! ทำใจดีๆ ไว้นะคะ...!"
10055050-94 = ""
10055050-95 = "อะ อ่า... เมื่อกี้พูดถึงไหนแล้วนะ?"
10055050-96 = "เอ่อ... เห็นบอกว่าเรือลำนี้เหมือนมาจากเมื่อหลายร้อยปีก่อนน่ะค่ะ"
10055050-97 = "ไม่ใช่เรื่องนั้นสิ เหมือนจะมีอะไรที่น่ากลัวกว่านั้นหน่อย..."
10055050-98 = "มะ... ไม่ใช่ค่ะ! เล่าต่อเถอะค่ะ!"
10055050-99 = "...? เอาเถอะ ในเมื่อนึกไม่ออกแบบนี้ละก็ คงไม่ใช่เรื่องสำคัญอะไรแหละมั้ง"
10055050-100 = ""
10055050-102 = ""
10055050-103 = "ถ้าเรือลำนี้กับพวกลูกเรือยังใช้ของจากเมื่อหลายร้อยปีก่อนอยู่จริงๆ เราก็อาจมีโอกาสชนะอยู่บ้าง"
10055050-105 = "โอกาสชนะเหรอคะ?"
10055050-106 = "ใช่ ต่อให้ดูแลดีแค่ไหน แต่ว่าปืนที่ใช้มาหลายร้อยปีแล้วมันไม่มีทางอยู่ในสภาพสมบูรณ์หรอกใช่มั้ยล่ะ?"
10055050-107 = "เมื่อกี้ตกใจเลยได้แต่ถูกไล่ต้อนอยู่ฝ่ายเดียว แต่ถ้าลองสู้กันจริงๆ ทั้งพลังการยิงกับอัตราความแม่นยำ พวกเราน่าจะเป็นต่ออยู่มาก..."
10055050-108 = ""
10055050-110 = ""
10055050-111 = "แต่ถึงอย่างนั้น ฉันก็กลัวแล้วก็ไม่อยากสู้อยู่ดี... จิอากิจังสู้แทนให้หน่อยไม่ได้เหรอ?"
10055050-112 = "อะฮะฮ่า... ฉันจะปกป้องรุ่นพี่ให้อย่างดีเลยค่ะ"
10055050-113 = "จริงนะ? สัญญาแล้วนะ?"
10055050-114 = "เอ๋ ทำไมครูถึงทำหน้าแบบนั้นล่ะ?"
10055050-115 = "[s3] \"เปล่า แค่คิดว่าซัตสึกินี่เก่งจริงๆ นะ\"\n[s4] \"สถานการณ์แบบนี้ยังใจเย็นได้เลยน่ะ\""
10055050-118 = "ใจเย็นเหรอ? อืม... อย่างน้อยก็คงดีกว่าจิอากิจังกับอิโรฮะจังละนะ"
10055050-119 = "ก็สองคนนั้นยังเป็น 'เด็กปี 2' นี่นา"
10055050-120 = "หืม? มีอะไรเหรอ?"
10055050-121 = "อ๋อ ถ้าเทียบกับเกเฮนน่า คุณครูก็ยังถือว่าเป็น ‘เด็กปี 1’ อยู่นี่นะ งั้นไม่รู้ก็ไม่แปลกหรอก แล้วก็ไม่จำเป็นต้องรู้ด้วย"
10055050-122 = "ถ้าจะให้อธิบายก็... คงเป็นเรื่องความต่างของประสบการณ์ละมั้ง"
10055050-123 = "อาจมีสักวันที่ฉันจะเล่ารายละเอียดให้ครูฟังก็ได้นะ"
10055050-124 = "แต่ก็ไม่ค่อยอยากจะพูดให้มันยืดยาวมากนักหรอก"
10055050-125 = ""
10055050-127 = ""
10055050-128 = "เอาเป็นว่า ที่นี่คงไม่มีข้อมูลอะไรให้หาเพิ่มแล้วละ"
10055050-129 = "ถ้าจะหนีออกจากเรือ ก็ต้องกลับขึ้นไปบนดาดฟ้าก่อน..."
10055050-130 = "เราไปกันเลยมั้ย?"
10055050-135 = ""
10055050-136 = ""
10055050-137 = "คะ? เมื่อกี้คุณครูเรียกฉันรึเปล่าคะ?"
10055050-138 = "[s5] \"แค่สงสัยนิดหน่อยน่ะ\"\n[s6] \"ตอนอยู่ในแพนเดโมเนียม โซไซตี้ ซัตสึกิเป็นแบบนี้ตลอดเลยเหรอ?\""
10055050-141 = "อืม... ก็ไม่ตลอดนะคะ"
10055050-142 = "เปล่าหรอกค่ะ จริงๆ นี่เป็นครั้งแรกเลยที่เห็นรุ่นพี่ซัตสึกิเป็นแบบนี้ค่ะ!"
10055050-143 = "พูดตรงๆ ว่าถึงตอนนี้จะวิกฤตสุดๆ แต่ฉันก็ตื่นเต้นจนใจเต้นแรงเลยค่ะ! ไม่คิดเลยว่าแพนเดโมเนียม โซไซตี้จะยังมีมุมที่ฉันไม่เคยเห็นอยู่อีก!"
10055050-144 = "หืม...? ไม่สิ อาจจะตรงกันข้ามก็ได้?"
10055050-145 = "จะว่าไปแล้ว ฉันแทบไม่รู้อะไรเกี่ยวกับรุ่นพี่ซัตสึกิเลยนะคะ"
10055050-146 = "รู้แค่ว่าเธอชอบอยู่ข้างๆ รุ่นพี่มาโคโตะ แล้วคุยเรื่องเข้าใจยากอย่างแผน NK อัลตร้าอยู่ตลอด..."
10055050-147 = "แต่ว่า... พวกรุ่นพี่ไม่ยอมเล่าเรื่องก่อนที่ฉันจะเข้าเรียนให้ฟังเลยค่ะ"
10055050-148 = "จะเรียกว่าเป็นคนลึกลับก็ได้มั้งคะ รุ่นพี่มีความลับเยอะเลยใช่มั้ยล่ะคะ?"
10055050-149 = "สมกับเป็นหัวหน้าฝ่ายข่าวกรองของแพนเดโมเนียม โซไซตี้เลยสินะคะ?"
10055050-150 = "[s7] \"ซัตสึกิมีความลับเยอะขนาดนั้นเลยเหรอ...?\"\n[s8] \"รู้สึกว่าเป็นพวกพูดตรงๆ ไม่อ้อมค้อมมากกว่านะ\""
10055050-153 = "เอ๋~ มุมมองของคุณครูกับนักเรียนต่างกันจริงๆ ด้วยสินะคะ"
10055050-154 = "อ๊ะ! อะไรกันเนี่ย! นึกสกู๊ปข่าวดีๆ ออกแล้วค่ะ!"
10055050-155 = "สกู๊ปพิเศษครั้งใหญ่ชื่อว่า <นักเรียนในสายตาคุณครูเป็นแบบไหน?!>"
10055050-156 = "ว่าไงคะ? ฉันว่าต้องได้กระแสตอบรับดีทีเดียวเลยค่ะ! ถ้าเรากลับขึ้นฝั่งได้อย่างปลอดภัย รบกวนให้ฉันสัมภาษณ์ด้วยนะคะ!"
10055050-157 = "เดี๋ยวสิ มัวคุยอะไรกันอยู่สองคนน่ะ! อย่าปล่อยให้ฉันอยู่คนเดียวสิ รีบตามมาได้แล้ว!"
10055050-158 = "อ๊ะ ค่ะ! โมโตมิยะ จิอากิกำลังไปเดี๋ยวนี้ค่ะ!"
10055050-159 = ""
10055050-161 = ""
10055050-164 = ""
10055050-165 = "ที่นี่เป็นคลังเก็บของเหรอคะ?"
10055050-166 = "เดี๋ยวก่อน มันมืดเกินไปรึเปล่า! ไม่มีไฟเลยรึไง?"
10055050-167 = "น่าจะเอาตะเกียงเมื่อกี้มาด้วยนะคะ เรากลับไปเอามาดีมั้ยคะ?"
10055050-168 = "เดี๋ยวสิ อย่าไปไหนนะ! ถ้าคนลดลงมันจะยิ่งน่ากลัวนะ!"
10055050-169 = "ช่วยไม่ได้แฮะ..."
