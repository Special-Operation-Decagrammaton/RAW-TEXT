[translation]
10055050-1 = "第5話;死せる悪魔の社会"
10055050-2 = "せんせー？"
10055050-3 = "ぐ……これはダメそうですね。"
10055050-4 = "想像以上に深いです。ただの穴ではなく、層が分かれているようで……。"
10055050-5 = "できることなら、助けたいのですが……。"
10055050-6 = "イロハ、急げ！奴らが来るぞ！"
10055050-7 = "……こちらもこんな状況ですので。#nすみませんが今は各自頑張りましょう。"
10055050-8 = "待っていろサツキ、チアキ、先生！必ず助けに来る！"
10055050-9 = "先生、先輩！すぐに戻るね！"
10055050-14 = "…………。"
10055050-15 = "あ、ああ……。"
10055050-20 = "さ、サツキ先輩しっかり！！"
10055050-21 = "先生、どうしましょう！？#nサツキ先輩は暗いのと怖いのがダメなんです！"
10055050-22 = "[s1] \"まず明かりを探そう！\"\n[s2] \"少し明るくなれば大丈夫なはず！\""
10055050-25 = "なるほど！ナイスアイデアです！"
10055050-31 = "先生！サツキ先輩！"
10055050-32 = "部屋の電気は見つかりませんでしたが、ランタンがありました！"
10055050-33 = "よくやったわチアキ！早く明かりをつけて頂戴！"
10055050-34 = "はい！よおし、光れ！"
10055050-41 = "なによ、普通の部屋じゃない。怖がって損したわ。"
10055050-42 = "あははっ、幽霊船も大した事ないですね！"
10055050-43 = "というかイロハちゃんの言う通りでした。#nイロハちゃんたちとは違う階みたいです。"
10055050-44 = "……。"
10055050-45 = "サツキ先輩？"
10055050-46 = "静かに。今、分析中よ。"
10055050-47 = "あっ、はいっ。"
10055050-51 = "……。"
10055050-52 = "…………。"
10055050-53 = "あのー……サツキ先輩？"
10055050-54 = "私たち、早く逃げた方が……。"
10055050-55 = "そんなこと知ってるわ！#nでも……。"
10055050-56 = "そのために情報が必要でしょう？私たちは誰に追われているのかしら？"
10055050-57 = "あ……誰でしょうね？"
10055050-58 = "急だったからあまりちゃんと見ていませんが……幽霊？いや海賊？"
10055050-59 = "……いいわ。一つずつ考えていきましょう。#nチアキはこの部屋をどう思う？"
10055050-60 = "えっ、私ですか？えっと……古いですね。古風な感じ、といいますか。#nトリニティっぽさもあるような。"
10055050-61 = "うーん、よく分からないですね。先生はどうですか？"
10055050-65 = "まずこの家具。陸上ならありふれているけど……。"
10055050-66 = "というか、エンジンのない帆船にこういった空間があること自体贅沢よ。#n個人の家具があるのはもちろん、個室があるということ自体が特殊なの。"
10055050-67 = "それなりに地位の高い人物の部屋……もしくは貴賓室。#nでも、それなら六分儀や海図なんて要らないわね。"
10055050-68 = "つまりここは航海士の中でも上級職……船長室である可能性が高いわ。"
10055050-70 = "お、おお……ということは……？"
10055050-71 = "ここの集団は船長を中心とした序列やルールがあると考えられるわ。#nまあこれだけの船を運用するなら当然なんでしょうけれど。"
10055050-72 = "……正確には「そうだった」と言うべきかしら。#n幽霊船伝説が本当なら、船長は追い出されたはずだもの。"
10055050-73 = "……この海図も気になるわね。#n何か分かるかしら。"
10055050-74 = "うーん……すごく古い……？"
10055050-75 = "ごめんなさい、全然わかんないです。"
10055050-76 = "ふふっ、初心者にしては悪くないわ。#nただ、この海図は状態が悪いわね。羊皮紙は保存環境によってすぐに劣化するの。"
10055050-77 = "地図は内容を見たら大体の制作時期が分かるのよ。#nたとえばここに描かれた海路はキヴォトスで最も一般的な航路だったけど……。"
10055050-78 = "アビドス自治区を経由する運河が開通してからは使われてないわ。#nつまりこれが作られたのは運河の開通前と言える。"
10055050-79 = "さっきの六分儀もそうね。GPSがあれば必要ないし……。"
10055050-80 = "私たちが今使っているこのランタンも。#nほら、溶けた蝋がこびりついているでしょう？#n電気もガスも無い生活を送っていたようね。"
10055050-81 = "本当、数百年前の船に乗っているみたい。"
10055050-85 = "以上のことから……。"
10055050-86 = "ことから……？"
10055050-91 = "この船は、本物の幽霊船……パタリ。"
10055050-92 = "ああっ！サツキ先輩起きてください！！"
10055050-95 = "あ、ああ……どこまで話したかしら。"
10055050-96 = "えっと、この船は数百年前のものだって……。"
10055050-97 = "……それより、もっと怖い何かがあった気がするんだけど。"
10055050-98 = "い、いえ何もありません！もっとお話してください！"
10055050-99 = "……？まあいいわ、思い出せないんだもの。#nきっと大したことじゃないわね。"
10055050-103 = "まず、この船と船員が本当に数百年前の物を使っているなら、勝ち目があるかもしれないわ。"
10055050-105 = "勝ち目？"
10055050-106 = "ええ。いくら管理が行き届いたものでも、数百年も前の銃がまともに使えるとは思えない。"
10055050-107 = "さっきはビックリして逃げちゃったけど、私たちの方が戦力は上のはずよ。"
10055050-111 = "でもやっぱり、戦闘は怖いし嫌……代わりにチアキがやっつけてくれない？"
10055050-112 = "あはは……頑張ってサツキ先輩を守ります！"
10055050-113 = "言ったわね？絶対そうしてよ？"
10055050-114 = "……あら？そんなぼうっとして、どうかしたの先生。"
10055050-115 = "[s3] \"いや、サツキはすごいなと思って。\"\n[s4] \"こんな状況でも落ち着いてるね。\""
10055050-118 = "落ち着いてる？そうね……まあチアキやイロハよりはそうかもしれないわ。"
10055050-119 = "あの子たちは「2年生」だもの。"
10055050-120 = "ん？どうしたのかしら？"
10055050-121 = "ああ、先生はゲヘナ生で換算したら「1年生」じゃないかしら？#n分からないことがたくさんあるのも当然ね。知る必要もないけど。"
10055050-122 = "そうね……経験の差、とだけ言っておくわ。"
10055050-123 = "先生には、いつか詳しく話す日がくるかもしれないわね。"
10055050-124 = "でもあまり面白い話ではないから、進んで口にしたくはないけど。"
10055050-128 = "ひとまずここに用はもうないわ。#nこれ以上の情報もなさそうね。"
10055050-129 = "脱出するにはデッキに戻らなくちゃいけないし……。"
10055050-130 = "そろそろ行きましょうか？"
10055050-137 = "あれ？先生、呼びました？"
10055050-138 = "[s5] \"ちょっと気になることがあって。\"\n[s6] \"サツキは万魔殿でもいつもこんな感じ？\""
10055050-141 = "んーそんなこともないです。"
10055050-142 = "いや、むしろサツキ先輩のこんな姿、初めて見ました！"
10055050-143 = "正直、ちょっとワクワクします！まだ私の知らない一面があるなんて！"
10055050-144 = "……ん？いや、そんなことはないか……。"
10055050-145 = "そういえばサツキ先輩のことは、知らないことだらけです。"
10055050-146 = "いつもマコト先輩のそばで難しい話をしているイメージしかないし。"
10055050-147 = "でも先輩たちは私が入学する前の話はしてくれないんですよ～"
10055050-148 = "黒幕みたいな人っていうか、秘密のベールに包まれているっていうか。"
10055050-149 = "やっぱり情報部長なだけあるんでしょうか？"
10055050-150 = "[s7] \"サツキってそんなに秘密が多いんだ？\"\n[s8] \"どちらかと言えばストレートで素直な方と思ってた。\""
10055050-153 = "うーん？やっぱり、先生と私たちでは視点が違うんでしょうか？"
10055050-154 = "あっ！！今すっごい良い記事を思いつきました！"
10055050-155 = "その名も「先生の視点から見た生徒とは！？」特集！"
10055050-156 = "どうですか？反響ありそうじゃないですか？#n無事戻れたらちゃんと取材させてくださいね！"
10055050-157 = "ちょっと、何を二人で楽しそうにしてるのよ！早く来て頂戴！？#nこっちは一人なのよ！"
10055050-158 = "あわわ、はいはい！元宮チアキ参りますー！！"
10055050-165 = "ここは倉庫でしょうか？"
10055050-166 = "ちょっと暗すぎるわ！明かりはないの？"
10055050-167 = "さっきのランタン、持ってくればよかったですね。#nいや今持ってきましょうか？"
10055050-168 = "いや行かないで！人数が減るじゃない！？"
10055050-169 = "……仕方ないわね。"
10055050-176 = "先生、手握っててくれる？"
10055050-180 = "そうよ、その調子。絶対離さないでよ、絶対！"
10055050-181 = "この規模の倉庫なら、情報が山のようにあるはず……。#nバッと探して、パッと手がかりだけ見つければ――"
10055050-182 = "…………。"
10055050-183 = "やっぱりダメ、チアキ！さあ出動よ！"
10055050-184 = "はいっ！元宮チアキ、突撃します！"
10055050-185 = "何か手がかりは……。"
10055050-189 = "ん？これ……。"
10055050-190 = "先生、サツキ先輩！ここにこんな物が！"
10055050-191 = "[s9] \"ハンカチ？\n[s10] \"なんかマークがある……。”"
10055050-197 = "私が知っているものとはちょっと違いますが……。"
10055050-198 = "でも間違いありません！これはゲヘナの校章です！"
10055050-199 = "ゲヘナの校章？ちょっと見せて頂戴。"
10055050-205 = "よくやったわチアキ。大きな収穫よ。"
10055050-206 = "このハンカチのマーク、たしかにゲヘナのものだわ。"
10055050-207 = "じゃあこの海賊……実はゲヘナの生徒だったのでしょうか？"
10055050-208 = "でもどうしてこれが……？"
10055050-209 = "こんな面白い子たち、私が知らないはずないのにな～"
10055050-210 = "…………。"
10055050-211 = "あの、サツキ先輩？"
10055050-212 = "……つまり、あれは……そういう……。"
10055050-213 = "[s11] \"すごい集中力……。\"\n[s12] \"一瞬で集中モードに入っちゃった。\""
10055050-216 = "あはは、そうですね。"
10055050-217 = "……というか私たち、大丈夫なんでしょうか？"
10055050-218 = "結構長い間迷子になってる気がするんですが、そろそろ海賊がここに来ても……。"
10055050-222 = "うわああっ！？本当に出た～～っ！？"
10055050-223 = "きゃあっ！チアキ、先生！早く退治して！！"
10055050-225 = "ヨーホホ！ここに居たのだな！"
10055050-226 = "[s] \"この声は……。\""
10055050-228 = "[ns] \"もしかしてマコト？\""
10055050-230 = "いいや、それは違うな。"
10055050-231 = "これからは「キャプテンマコト」と呼ぶがいい！"
