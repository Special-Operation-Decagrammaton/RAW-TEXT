10055050-78 = "3;사츠키 수영복;11;옛 아비도스 자치구를 경유하는 운하가 개통된 이래로는 더는 사용되지 않게 되었어. 즉, 이 지도는 운하 개통 이전의 물건이라는 뜻이네."
