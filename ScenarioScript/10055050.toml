10055050-41 = "อะไรกัน ก็แค่ห้องธรรมดานี่นา กลัวไปเสียเปล่าเลย..."
10055050-42 = "อะฮ่า ถึงจะเป็นเรือผี แต่ก็ไม่ได้มีอะไรน่ากลัวเลยนะคะ"
10055050-43 = "ดูเหมือนเป็นอย่างที่อิโรฮะจังบอกเลยนะคะ ตกลงมาอยู่คนละชั้นเลย..."
