10055050-20 = "ระ... รุ่นพี่ซัตสึกิ! ทำใจดีๆ ไว้ค่ะ!"
10055050-21 = "คุณครู! ทำยังไงดีคะ! รุ่นพี่ซัตสึกิรับมือกับความมืดและเรื่องน่ากลัวไม่ไหวหรอกค่ะ!"
10055050-22 = "[s1] \"ก่อนอื่น รีบหาไฟกันเถอะ!\"\n[s2] \"ถ้ามีแสงสว่างก็น่าจะดีขึ้นนะ!\""
10055050-25 = "จริงด้วย! ความคิดดีเลยค่ะ"
