[translation]
21195-3 = "밀레니엄 구교사 복도"
21195-4 = "헥헥……."
21195-5 = "가, 간신히 도망쳤나?"
21195-6 = "이, 이제 어쩌지?"
21195-7 = "어차피 밀레니엄 프라이스에는 출품했어."
21195-8 = "일단 결과가 나올 때까지, 이대로 도망치자!"
21195-9 = "그건 안돼."
21195-10 = "?!"
21195-12 = "(타당타당!)"
21195-13 = "꺄악!"
21195-14 = "미도리!"
21195-18 = "……"
21195-19 = "아아."
21195-20 = "어쩐지 좋은 판단이다 싶더니."
21195-21 = "방금 이 꼬마애들을 지휘한 것도, 그리고 우리 밀레니엄 압류품 보관소를 공격한 것도."
21195-22 = "역시 당신이었나."
21195-23 = "선생…… 이라고 부르면 되겠지?"
21195-24 = "아카네가 조사한, '소문'의 주인공…… 과장은 아닌 모양이야."
21195-25 = "[s1] \"여기에는 어째서 온 거지? 복수인가?\"\n[s2] \"너도 꼬마애잖아.\""
21195-26 = "하! 그런 하찮은 이유로 올리가 없잖아."
21195-27 = "굳이 이유가 있다면 일단…… 거기 이마 깐 녀석."
21195-28 = "그때는 날 잘도 속였겠다……?"
21195-29 = "히……익! 죄, 죄송합니다!"
21195-30 = "제법이었다. 칭찬해 주지."
21195-31 = "네……?"
21195-32 = "겁에 질린 척 덜덜 떨면서, 나를 속이다니. 꽤 훌륭한 연기였어."
21195-33 = "(아마 겁에 질린 건 사실이었을걸.)"
21195-34 = "하지만…… 거기 무식하게 큰 무기 든 녀석."
21195-35 = "아니거든?! 난 3학년이라고! 날 꼬마라 부른 녀석들이 어떻게 됐는지 알게 해줄까?!"
21195-36 = "……진정해 부장."
21195-37 = "신선한 느낌이네요. 아직도 네루 선배를 꼬마라 부를 수 있는 사람이 있다니."
21195-38 = "후우- 후우-."
21195-39 = "순간 냉정을 잃을 뻔했지만, 뭐 어쨌든. 거기 무식하게 큰 무기 든 녀석."
21195-41 = "(두리번두리번)"
21195-42 = "너 말이야 너!"
21195-43 = "아리스를 찾으신 겁니까?"
21195-44 = "그래. 너는 달라."
21195-45 = "잘도 우리 C&C에 한 방 먹였겠다……?"
21195-46 = "너에게, 볼일이 있다."
21195-48 = "아, 아리스, 이 패턴 알고 있습니다."
21195-49 = "'나를 이렇게 대한 건 네가 처음이야.'"
21195-50 = "고백입니다. 꼬마 메이드님은 아리스에게 반했습니다."
21195-51 = "우, 웃기지 마 이 자식아! 그리고 누가 꼬마 메이드님이야?! 죽고 싶냐!"
21195-52 = "우웃……!"
21195-53 = "무, 무서워!"
21195-55 = "후우……."
21195-56 = "어지간히 화나게 하는 녀석들이로구만. 뭐 좋아."
21195-57 = "혹시 오해할까 봐 말해두는데, 딱히 한 방 먹은 것 때문에 복수하러 온건 아니야."
21195-58 = "조금 구린 구석은 있지만, 정당한 의뢰였고, 너희는 우리를 상대로 목적을 달성했다."
21195-59 = "거기에 원한은 없지만…… 흥미는 생겼어."
21195-60 = "흥미……?"
21195-61 = "확인이라고 할까."
21195-62 = "붙어."
21195-63 = "나와 싸워 이기면, 이대로 물러나 주겠다."
21195-64 = "어지간한 조사나 분석보다, 이쪽이 서로 이해하기 쉽거든. 어떻게 할래?"
21195-65 = "……."
21195-66 = "알겠습니다."
21195-67 = "오. 할 마음 넘치는데."
21195-68 = "일기토 이벤트 같은 거군요. 이해했습니다."
21195-69 = "일기…… 뭐?"
21195-70 = "지난 번에는 좁고, 거울 탓에 전력을 내기 힘들었지만……"
21195-71 = "지금이라면……!"
21195-72 = "갑니다! 마력 충전 100%……!"
21195-74 = "……이건……!"
21195-75 = "빛이여!!"
21195-77 = "콰아아아아앙!!"
21195-79 = "큭……!"
21195-80 = "와우!"
21195-81 = "어, 엄청난 위력……!"
21195-82 = "건물 외벽이 완전히 사라졌어요!"
21195-85 = "괴, 굉장해 아리스."
21195-86 = "이런 화력은…… 처음이야."
21195-87 = "……해치웠나?"
21195-88 = "아리스 쨩! 그 대사를 함부로 말하면 안 돼!"
21195-89 = "아, 네루 선배는 3학년. 다시 말하겠습니다."
21195-90 = "……해, 해치워지셨나……?"
21195-91 = "아니 그게 아니라……."
21195-95 = "[ns] \"아직이야.\""
21195-97 = "(타당타당!)"
21195-98 = "끄앙!"
21195-101 = "확실히, 범상한 화력은 아니지만……"
21195-102 = "그게 다인가 보네."
21195-104 = "다, 다시 한번…… 마력 충전……!"
21195-106 = "(휘익) 무리라니까."
21195-107 = "앗……!"
21195-108 = "(퍼억!)"
21195-109 = "꺄아!"
21195-111 = "네 무기는 강해. 하지만 방아쇠를 당긴 후, 발사까지 콤마 몇 초 정도 대기가 필요하지."
21195-112 = "그리고 그 강한 화력 탓에, 일정 거리 이내로 진입하면 쏠 수 없어."
21195-113 = "폭압에 자기 자신까지 휘말릴 테니까 말이야."
21195-114 = "그리고 이 간격 내에서 날 이길 수 있는 녀석은 키보토스 전체를 뒤져봐도 많지 않아."
21195-115 = "아니…… 없어."
21195-116 = "끄앙……."
21195-117 = "아리스!"
21195-120 = "생각보다 실망인데. 고작 이 정도 녀석들에게 내 동료들이 당했다고 생각하니……"
21195-121 = "……"
21195-122 = "(휙!)"
21195-123 = "크윽!"
21195-124 = "레, 레일건을 기둥처럼 휘둘렀어?!"
21195-125 = "헤에. 근접전에선 좋은 판단이지만."
21195-128 = "거리는 여전히 내게 유리해."
21195-129 = "발사는 할 수 있겠지만, 날 조준하진 못하잖아."
21195-130 = "……조준, 불필요."
21195-131 = "갑니다!"
21195-132 = "그러니까 무리라니…… 응?"
21195-134 = "잠깐……? 이미…… 발사 중? 설마…… 너…… 이 거리에서……?"
21195-135 = "날 조준하지도 않고…… 바닥 쪽으로!"
21195-136 = "미쳤냐?! 이대로 쏘면 나뿐만 아니라 너까지……!"
21195-137 = "빛이여!!"
21195-139 = "(콰아아아앙!)"
21195-141 = "아리스 쨩! 크윽. 연기가!"
21195-142 = "바닥이 완전히 붕괴 되었…… 아리스?! 찾았어!"
21195-143 = "유, 육체 손상 48%…… 후퇴를 원합니다!"
21195-145 = "[s] \"내가 업을게.\""
21195-146 = "선생님! 서둘러요!"
21195-147 = "(후다닥)"
21195-149 = "부장!"
21195-150 = "괘, 괜찮을까요? 설마 잔해에 휘말린 건……"
21195-151 = "아까 아리스 쨩을 봤어. 완전 엉망이던데 우리 꼬마 부장도 지금쯤 납짝쿵……"
21195-153 = "……누가 꼬마라는 거야!"
21195-155 = "앗."
21195-156 = "우와~ 역시 우리 부장! 잔해 속에서도 멀쩡하다니!"
21195-157 = "너희는 대체 누구 편이야!"
21195-158 = "지금 아리스는 전투력을 상실한 상태, 이대로 쫓을까? 분명 그 정도 부상이라면 양호실로 갔을 테니."
21195-159 = "으음. 밀레니엄에는 두 자릿수 이상의 양호실이 있지만…… 수색하면 금방이죠."
21195-162 = "……"
21195-163 = "…………."
21195-164 = "부장?"
21195-165 = "……아아."
21195-166 = "아니, 됐어. 추격은 중지. 일단 돌아간다."
21195-167 = "뭔가 다 때려 부수고 나니 후련해졌어."
21195-168 = "……."
21195-169 = "뭐, 목적도 달성했으니까. 게임개발부에 대해 리오가 관심을 가지는 이유 정도도 알겠고……"
21195-170 = "그리고……."
21195-171 = "선생님이~ 신경 쓰이는 거지!"
21195-172 = "아, 아니! 그, 그건 아니지만……!"
21195-173 = "흐음. 이해해요. 근데 걱정이네요."
21195-174 = "같이 다니는 아이들도 전부 꼬마 애들인 걸 보면 선생님의 취향은 분명……."
21195-175 = "부장에게는 희소식이군."
21195-176 = "시끄러! 그딴 헛소리하면 다음에는 총소리로 대답할 줄 알아!"
21195-177 = "흥……."
21195-180 = "선생…… 그리고 게임개발부라."
21195-184 = "하."
21195-185 = "기대하라구. 날 꼬마라 부른 값은 치러야 할 테니까."
21195-187 = "한창 날뛰었더니 배고프네. 어이. 라멘이나 먹으러 가자."
21195-189 = "네에~"
21195-190 = "찬성 찬성~!"
21195-191 = "하긴 부장은 성장기니까……."
21195-194 = "작작 하라 했어!"
21195-196 = "다음화;밀레니엄 프라이스"
