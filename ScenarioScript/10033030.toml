[translation]
10033030-1 = "제3화;만나서 반갑습니다."
10033030-2 = "여기까지 오시느라 수고하셨습니다. 여러분."
10033030-3 = "저희는 지금부터, 이 자리에서 위쪽으로 보이는 전망대까지 올라갈 거예요!"
10033030-8 = "와, 여기 거리 신기해! 벌써부터 뭔가 느낌이 확 다른데?"
10033030-9 = "우리 학교는 일단 이런 분위기는 아니니까 말이지."
10033030-10 = "나 여기서 사진 찍을래! 에리카 쨩도?"
10033030-11 = "그럴까? 그러면 하는 김에……."
10033030-12 = "응? 아하, 무슨 말인지 알겠어. 저기요, 저기! 거기 가이드 쨩이랑 모두!"
10033030-14 = "저, 저희도요?"
10033030-16 = "응? 당연하지! 사진은 다 같이 찍는 거 아냐? 난 키라라. 요자쿠라 키라라!"
10033030-17 = "하타미 에리카야."
10033030-19 = "사진인가요! 그렇군요. 함께 사진을 찍는 것으로 의리와 우정을 다지는, 중요한 의식인 것이로군요!"
10033030-20 = "게헨나 여러분들의 가이드를 책임지고 있는, 아사히나 피나입니다! 반갑습니다!"
10033030-21 = "어, 아……. 사토하마, 우미카, 입니다. 부족한 부분이 많지만, 잘 부탁드려요……."
10033030-22 = "난 카에데! 이사미 카에데야! 멋지고 완벽한 레이디를 위해 수행 중!"
10033030-24 = "아하하하. 카에데 쨩, 내가 보기에는 이미 멋진 레이디인 것 같은데?"
10033030-25 = "어, 어?! 그, 그래?!?! 에, 에헤헷……. 그건 조금 기쁠지도……."
10033030-26 = "하, 하지만! 아직 그 정도로는 안 되니까! 지금보다 더 멋지고 더 완벽한 레이디가 될 거니까! 응!"
10033030-27 = "카스가…… 츠바키……. 하암……. 이따 밤에 잠이 잘 안 오면…… 말해 줘……. 숙면 베개와 이불, 안대랑 귀마개……. 모두 준비되어 있으니까……."
10033030-28 = "으, 으응……. 우리 학교 애들은 오히려 잠자기 싫어할 것 같지만……."
10033030-30 = "그런데 츠바키 선배, 그런 포즈로 괜찮아?"
10033030-31 = "하암……. 문제없어……."
10033030-37 = "자, 그럼 다 같이!"
10033030-42 = "예–이! 우미카! 모두들! 웃는 겁니다!"
10033030-43 = "네? 네, 네에……!"
10033030-54 = "그러면 하나. 둘–"
10033030-56 = "–셋!"
10033030-63 = "응, 잘 나왔네! 사진 보내 줄까? 아, 그러려면 번호 알아야지. 교환할래?"
10033030-64 = "보다시피 키라라는 거리감을 안 재는 편이니까, 이해 부탁해."
10033030-71 = "전망대에 오르느라 수고하셨습니다. 여러분."
10033030-72 = "보시다시피 이 전망대에서는, 백귀야행 연합학원의 상징이자 자랑이라고 할 수 있는 신목이 한눈에 들어온답니다."
10033030-73 = "그리고 또 세상에 이런 일이! 바로 내일! 저곳에서 때맞춰 신목제가 열릴 예정입니다!"
10033030-74 = "마치 모두의 방문을 기다리고 있었다는 듯이 말이지! 기대해도 좋을 거라구?"
10033030-79 = "응……. 신목제 중에는, 나도 조금 잠을 깨 볼까……."
10033030-80 = "(사실은 신목제의 일정을 조금…… 조정, 해서, 게헨나 여러분들의 수학여행에 맞춘 것이긴 하지만…….)"
10033030-82 = "그러고보니 우미카 쨩의 설명대로라면, 백귀야행은 축제로 유명한 학교라고 했지?"
10033030-83 = "축제로 유명하다고 할까, 축제를 위해 살아간다는 느낌도 조금 들었지만 말이야."
10033030-84 = "[s] \"음. 어떤 의미로 정확한 감상이군.\""
10033030-86 = "그렇지만 축제는 좋은 것이죠. 그렇지 않나요?"
10033030-87 = "일상에서 벗어나, 축제의 성공이라는 하나의 목적을 위해 노력하고……."
10033030-88 = "모두가 웃고, 즐거워하고, 새로운 경험과 생각지도 못한 체험 속에서 추억을 남기고……!"
10033030-89 = "거기에 키보토스의 각 학교에는 들은 적도, 본 적도 없는 축제들이, 각양각색의 형태를 띠고 개최된단 말이에요!"
10033030-90 = "여러분들이 다니시는 게헨나 학원만 해도, 11일 11시 11분에 정확히 시작하여 장미의 행진으로 정점을 이루는 축제라든가, 참가자 전원이 서로에게 물렁물렁한 토마토를 던져대는–!"
10033030-92 = "어……. 우리 학원에 그런 축제가 있었나?"
10033030-93 = "모르지. 우린 귀가부니까."
10033030-94 = "아하하하. 우미카 쨩은 축제를 정말 좋아하나 보네? 사람이 조금 변한 줄 알았어!"
10033030-96 = "핫……?! 죄, 죄송해요! 제가 잠시……!"
10033030-97 = "[s] \"우미카는 축제를 좋아하지……. 정말 좋아해…….\""
10033030-98 = "선생님까지 그러시기에요?!"
10033030-100 = "그보다 신목제인가……. 기대되네. 어떠려나?"
10033030-101 = "또 뭔가 큰일이 나지 않았으면 좋겠는데……."
10033030-106 = "우왓?! 여기 뭐야, 미끄러워! 넘어져 버렸네……."
10033030-107 = "괜찮아? 뭐야, 별로 다친 곳도 없잖아. 호들갑은."
10033030-108 = "앗?! 괘, 괜찮으신가요? 죄송합니다! 그런데 이 바닥……!"
10033030-110 = "신기할 정도로 잘 닦여 있습니다! 얼굴이 비칠 정도입니다!"
10033030-111 = "이, 이상하네?! 아예 다른 곳도 전부 잘 닦여 있다면 차라리 모르겠지만, 꼭 누가 여기만 신경 써서 미끄럽게 닦아 놓은 기분이야……!"
10033030-113 = "……그것도 가장 신목이 잘 보이는 자리만 반들반들하게 닦여 있어……."
10033030-115 = "나도, 나도! 나도 미끄러질래!"
10033030-116 = "줄 서라, 줄. 내가 먼저 서 있었다고."
10033030-121 = "여러분! 여러분? 그러니까! 지금부터 신목의 역사에 관한 설명을……!"
10033030-123 = "우리 학교에서 누가 언제 줄 같은 거 섰다고 그래!"
10033030-124 = "아니……. 일단 여긴 우리 학교 아니거든?"
10033030-126 = "시, 신목의 기원에 대해서 아직 완벽하게, 그리고 정확하게 알려진 것은 없습니다만, 가장 유력하게 추정되는 것은……!"
10033030-128 = "이거, 좀 말려야 하는 거 아냐?"
10033030-129 = "으음……. 그래도 아직 누가 수류탄을 꺼내거나 안전핀을 뽑거나 대인지뢰를 살포하지는 않았으니까?"
10033030-134 = "자, 자. 서로 싸우지들 말고……."
10033030-136 = "아, 어떻게든 될 것 같은데?"
10033030-143 = "이렇게 된 이상, 여기 바닥 전체를 있는 대로 닦아서, 하나의 수평 미끄럼틀을 만들어 버리는 거야!"
10033030-144 = "그런 방법이 있었네!"
10033030-145 = "[ns] \"그건 좀 아니지 않을까?!\""
10033030-150 = "오, 미끄러진다!"
10033030-151 = "나도, 나도 탈 거야!"
10033030-155 = "탈 거면 일단 바닥을 닦으라니까!"
10033030-157 = "여, 여러분?! 제발 저희 이야기를 들어주세요……!"
10033030-158 = "이왕 하는 거, 미끄러지는 자리 마지막에 사출 폭탄이라도 설치할까?"
10033030-159 = "그거 좋겠네! 멀리까지 날아갈 수도 있을 거고!"
10033030-160 = "그런데 그러다 떨어지면?"
10033030-161 = "그건 자기가 알아서 해야지!"
10033030-162 = "안 돼요오오오오오–!"
10033030-167 = "우미카 쨩, 너무 고생하는 거 아냐?"
10033030-168 = "……말리자."
10033030-169 = "아하하하. 어쩔 수 없네!"
10033030-177 = "하아, 하아……. 어떻게든 모두 진정시키는 데 성공했어!"
10033030-178 = "대단합니다! 불초 피나, 그러면 다음 장소로 모두를 안내하도록 하겠습니다!"
10033030-182 = "하아아암……. 움직였더니, 뭔가 더 졸려졌어……."
10033030-186 = "[ns] \"모두 수고 많았어…….\""
10033030-190 = "헉……. 허억……. 게헨나 여러분은…… 모두…… 힘이 넘치시네요……"
10033030-191 = "도와주셔서, 진심으로 감사드려요……."
10033030-193 = "아하하하! 우미카 쨩이 고생하고 있는 걸 보고 있으니, 나도 모르게 말이야~"
10033030-194 = "우리에겐 일상 같은 거지만, 역시 다른 학교에서 보기엔 좀 별나지?"
10033030-195 = "[s] \"그렇지만 역시 나도 고맙다고 말하고 싶네.\""
10033030-196 = "저기, 쌤? 우미카 쨩? 여기에서만 해 두는 이야기지만."
10033030-197 = "이런 일에 일일이 고마워하다가는, 오늘 하루에만 백 번 넘게 같은 말을 반복하게 될지도 모를 걸……?"
10033030-198 = "[s] \"그거참 뭔가 진의를 알고 싶어지지 않는 말이네!\""
10033030-199 = "그러면 우리는 다음 장소로 따라가 볼게! 선생님도 우미카 쨩도 천천히 와~!"
10033030-203 = "다음 장소에서 보자. 아니, 앞으로도 잘 부탁한다고 해야 하나?"
10033030-208 = "으으……. 일정이 12분이나 늦어지고 말았어요……. 어떻게든 이 시간 차이에 대응하지 않으면……!"
10033030-209 = "[s1] \"스케줄 사이사이를 넉넉하게 잡아 두었으니까.\"\n[s2] \"아직은 허용 범위 안일 거야. 아직은.\""
10033030-212 = "그렇지만…… 일정은 이제 막 시작된 참인걸요."
10033030-213 = "매번 이런 일이 일어나면…… 그때는 어떡하죠?"
10033030-214 = "[s] \"가끔은 말이지. 우미카.\""
10033030-215 = "네. 선생님."
10033030-216 = "[s] \"그저 최선을 다해 보자는 말 밖에는…… 할 수 없을 때가 있어…….\""
10033030-220 = "선생니임~!"
