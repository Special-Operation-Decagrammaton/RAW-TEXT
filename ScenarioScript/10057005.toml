[translation]
10057005-1 = "프롤로그"
10057005-2 = "샬레 사무실"
10057005-5 = "(따듯해서 그런지, 졸음이 오기 시작했다…….)"
10057005-11 = "[ns1] \"네, 들어오세요~\"\n[ns2] \"문 열려있어요~\""
10057005-16 = "[ns3] \"뭐지? 왜 들어오지 않고…….\"\n[ns4] (문을 열어본다.)"
10057005-24 = "아……."
10057005-25 = "샬레의, 선생님……. 맞으신가요."
10057005-26 = "[s] \"맞는데……. 괜찮니? 비틀거리는데…….\""
10057005-27 = "뭐든지 해결해 주고, 누구든지 돌봐준다는……."
10057005-28 = "샬레의 선생님, 이군요."
10057005-33 = "찾았다아……."
10057005-37 = "[ns] \"얘!! 괜찮니?!\""
10057005-45 = "샬레 휴게실"
10057005-48 = "다행히 건강에 문제가 있는 건 아니었어요."
10057005-49 = "평소 영양상태도 좋은 것 같고, 최근에 피로가 극심했던 것 같아요."
10057005-50 = "[s] \"건강 문제가 아니라니 그건 다행이다.\""
10057005-52 = "[ns5] \"그런데, 세리나.\"\n[ns6] \"갑자기 어디서 나온 거니……?\""
10057005-56 = "아- 맞다, 벌써 시간이- 요새 시계가 참 빠르죠-"
10057005-57 = "그럼 이만 가보겠습니다! 일어나면 따듯한 물 마시게 해주세요!"
10057005-60 = "[ns] (대체 어디에 있었던 걸까…….)"
10057005-65 = "우, 우으……."
10057005-71 = "선생님……."
10057005-75 = "라디오를 통해서 들은 대로의 외모 그대로시군요."
10057005-76 = "[s] \"일어났니? 몸은 괜찮아?\""
10057005-77 = "괜찮습니다. 여기까지는 예상했습니다."
10057005-78 = "소개가 늦었습니다. 붉은겨울 연방학원의 '후루하타 라나'입니다."
10057005-79 = "갑작스럽지만. 선생님의 도움이 필요합니다."
10057005-80 = "[s7] \"내 도움?\"\n[s8] \"어떻게 도와주면 되겠니?\""
10057005-85 = "멈춰주셨으면 합니다……."
10057005-86 = "끝이 없는 싸움을요."
10057005-87 = "[s] \"붉은겨울이면……. 쿠데타를 말하는 거니?\""
10057005-88 = "그런 게 아닙니다."
10057005-89 = "이 싸움을 멈출 수 있는 유일한 사람……."
10057005-92 = "그게 선생님, 입니다."
10057005-94 = "?"
