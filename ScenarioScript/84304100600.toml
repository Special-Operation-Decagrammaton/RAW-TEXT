[translation]
84304100600-5 = "감사합니다…… 덕분에 살았어요."
84304100600-6 = "회원님. 열정적으로 트레이닝을 하시는 것도 좋지만, 기본적으로는 자신의 페이스에 맞춰……."
84304100600-10 = "아, 아니에요! 다릅니다! 제가 오기를 부린 게 아니고…….!"
84304100600-11 = "무, 물론 살을 빨리 빼고 싶다는 생각에 조금 센 강도를 고른 건 맞지만……."
84304100600-12 = "그래도 원래는 이 정도로 빠르지 않았어요. 도중부터 속도가 알아서 바뀐 거예요!"
84304100600-13 = "속도가…… 알아서?"
84304100600-14 = "그럴 수가…… 그런 맞춤형 기능은 아쉽게도 아직 들어가지 않았는데……."
84304100600-16 = "(아쉽게도……?)"
84304100600-17 = "아쉽게도……!?"
84304100600-18 = "이상하군요. 기기에 문제라도 생긴 걸까요?"
84304100600-19 = "……."
84304100600-24 = "쳇, 성공하나 싶었는데……."
84304100600-25 = "그래도 성공에 가깝긴 했잖아. 지금까진 계속 아무리 강도를 올려도 소용없었다고. 고무적인 결과 아냐?"
84304100600-29 = "……?"
84304100600-34 = "결국 타깃의 문제였던 건가…… 저 트레이닝복 입고 있는 녀석, 저 녀석이 문제였던 거야……!"
84304100600-35 = "맞아, 맞아. 아무리 기계들 중량을 올리고 버겁게 조작해도 태연히 해내던 저 녀석이 문제라고!"
84304100600-36 = "일단 시키는 대로 조작은 다 해 두었으니, 우리는 그만 도망치자."
84304100600-37 = "괜찮아? 제대로 시연이 망쳐지는지 확인해 봐야 하지 않을까?"
84304100600-38 = "계약 내용에 그건 없었잖아. 하란 대로 했으니, 돈은 주겠지. 괜히 있다가 걸리면 그건 그것대로 문제고."
84304100600-39 = "하긴……"
84304100600-40 = "자, 자. 얼른 빠지자. 마침 다들 저 커다란 여자한테 신경 쓰고 있는 지금이 타이밍이야."
84304100600-41 = "가자, 가자!"
84304100600-47 = "……헤에."
84304100600-48 = "역시, 결국 리오 녀석의 말이 맞았나 보네."
84304100600-52 = "어이, 리오. 듣고 있지?"
84304100600-57 = "응. 마침내 꼬리를 찾은 것 같네."
84304100600-58 = "아아, 그래. 마침내지."
84304100600-59 = "따라간다."
84304100600-60 = "이제 이 성가신 일을 끝내 버리자고."
