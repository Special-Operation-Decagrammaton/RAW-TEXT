[translation]
1003905-1 = "RABBIT 4, 저격합니다."
1003905-2 = "오, 오셨군요. 선생님."
1003905-3 = "이런 외진 곳까지 불러내서 죄송해요……."
1003905-4 = "[s] \"아니야, 괜찮아.\""
1003905-5 = "아, 감사합니다. 오늘은 그, SRT의 시가전을 대비해 저격 훈련을 하려고 했는데요……"
1003905-6 = "처음에는 키보토스의 시내에 가서 훈련 협조 요청을 드리려고 했는데……"
1003905-7 = "낯선 어른들에게 훈련을 위해 협조해 달라는 말을 도저히 꺼낼 수가 없어서요……."
1003905-8 = "[s1] \"괜찮아. 잘 판단했어.\"\n[s2] \"게다가 시내에서 총을 쏘는 건 위험하기도 하니까.\""
1003905-9 = "네. 그래서 대체할 곳을 찾고 있었는데……"
1003905-10 = "네. 그래서 대체할 곳을 찾고 있었는데……"
1003905-11 = "얼마 전에 등산로를 산책하다 이곳에서 쓰이지 않는 폐가를 발견했어요."
1003905-12 = "1주일 넘게 살펴보았는데, 이곳을 사용하는 사람은 더는 없는 것 같아서……."
1003905-13 = "여, 여기서 시가전을 대비한 엄폐 저격 훈련을 하고 싶어요."
1003905-14 = "[s] \"내가 무얼 도와주면 될까?\""
1003905-15 = "어, 음…… 저격의 준비는 제가 하면 되니까……"
1003905-16 = "선생님은 저 능선 위에 표적지를 설치해 주시겠어요……?"
1003905-17 = "[s] \"한 300m 정도면 되려나.\""
1003905-18 = "아뇨, 그것보다는 더 멀리……"
1003905-19 = "[s] \"그럼 500m?\""
1003905-20 = "아뇨. 죄송하지만 더 멀리……"
1003905-21 = "최소 1km는 떨어진 곳에 부탁드립니다……. 죄, 죄송해요."
1003905-22 = "[s] \"나무 때문에 잘 보이지도 않는데 괜찮겠어?\""
1003905-23 = "네, 괜찮아요. SRT의 저격수니까요."
1003905-24 = "……게다가 소대원들에게 폐를 끼치지 않기 위해선 이 정도는 해내야 해요."
1003905-25 = "그럼, 선생님…… 부탁드리겠습니다."
1003905-28 = "[ns] 표적지를 설치하러 이동한다."
1003905-30 = "(표적지를 설치하고 다시 미유가 있는 사로로 돌아오니…….)"
1003905-31 = "후우……. 후우……."
1003905-32 = "(미유가 야생동물들에게 둘러싸여 있었다…….)"
1003905-35 = "[wa:700]― 호흡을 가다듬고……"
1003905-37 = "[wa:320]― 목표에 [wa:750]집중……"
1003905-40 = "― 거리는 1,150m, [wa:2800]바람은 동북동에서 [wa:1000]15노트."
1003905-42 = "― 온습도로 인한 [wa:980]오차를 보정하면……"
1003905-45 = "[wa:1400]― 저, [wa:900]저기…… [wa:850]선생님."
1003905-47 = "― 괜찮으시다면, [wa:1800]그런 장난을 치는 건 [wa:1400]그만둬 주지 않으실래요……?"
1003905-50 = "― 그게, [wa:1000]조준점이 흐트러지는데요……"
1003905-53 = "[ns] \"내가 방해하는 거 아니야.\""
1003905-54 = "[wa:500]― ……그렇군요."
1003905-57 = "― 이건 [wa:400]방해가 아니라,"
1003905-59 = "― 실전에 가까운 상황에서의[wa:1350] 저격을 위한 훈련[wa:1900]이군요."
1003905-62 = "― SRT에서도"
1003905-64 = "[wa:600]― 비슷한 훈련을 [wa:800]했던 것 같은 기분이……"
1003905-67 = "[ns] \"그러니까 내가 아니라니까……\""
1003905-68 = "[wa:600]― 흐, 흐익……?"
1003905-71 = "― 서, [wa:800]선생님! [wa:2300]아무리 그래도"
1003905-73 = "― 귀에 입김을 [wa:900]불어 넣는 건……!?"
1003905-76 = "[wa:500]― (으으…… [wa:1440]서, [wa:1240]선생님의 숨결이 [wa:1900]가까이에서……)"
1003905-78 = "[wa:240]― (조, [wa:1100]조준이 흔들려……!)"
1003905-81 = "[ns] 미유에게 동물들의 존재를 알려준다."
1003905-82 = "우, 우앗……? 어느 틈새에 야생동물들이?!"
1003905-85 = "우으으……"
1003905-86 = "들짐승이 경계하지 않고 가까이 다가오는 건 장점이라고 생각했는데……"
1003905-87 = "설마 정작 본업인 저격 임무의 방해를 받을 줄이야……."
1003905-88 = "역시 이 체질은 아무런 도움도 되지 않는 것 같아요……"
1003905-89 = "역시 저는 존재감 제로의 쓸모없는 존재……."
1003905-90 = "[s] \"옆에 내가 있으면 괜찮을 거야.\""
1003905-94 = "[ns] \"다시 한번 시도해보자.\""
1003905-96 = "……네."
1003905-97 = "그럼 부탁드리겠습니다!"
1003905-99 = "(이후, 미유의 곁에서 다가오는 동물들을 쫓아내며 저격 훈련을 지켜보았다.)"
1003905-100 = "(걱정과는 달리 미유는 훌륭히 먼 거리의 표적지를 연속해서 맞추었다.)"
