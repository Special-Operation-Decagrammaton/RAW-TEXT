[translation]
1602005-1 = "A Certain Sniper's Loneliness"
1602005-2 = "After seeing Otogi's cryptic MomoTalk, I headed to the Fox Squad's underground HQ."
1602005-3 = ""
1602005-7 = "FOX Squad HQ"
1602005-8 = "But no one was home, not even Otogi."
1602005-10 = "I wandered around the general area for about ten minutes."
1602005-11 = ""
1602005-12 = ""
1602005-13 = "Then, I finally found Otogi, sitting on a bench at a nearby park. She seemed lost in thought as she stared at a streetlight."
1602005-14 = ""
1602005-15 = "[ns] \"Otogi!\""
1602005-16 = "...Oh? Sensei..."
1602005-17 = "What are you doing out here so late?"
1602005-18 = "You shouldn't be wandering in places where there's no one else around."
1602005-19 = "[s1] \"I should be saying that to you.\"\n[s2] \"Why are you out this late at night?\""
1602005-22 = "Just wanted a change of pace."
1602005-23 = ""
1602005-25 = ""
1602005-26 = ""
1602005-27 = "Ah, you saw my MomoTalk."
1602005-28 = "Sorry. I didn't mean to worry you."
1602005-29 = "It really wasn't anything serious. I feel bad for making you come out this late."
1602005-30 = "I really did just come out here for a change of scenery, so you can head back, Sensei."
1602005-31 = "You have an important meeting tomorrow, right? Don't you need to sleep early?"
1602005-32 = "[s3] \"Your worries are more important to me.\"\n[s4] \"And I'm in the mood for a late-night walk too.\""
1602005-35 = "...You really just do whatever you want."
1602005-36 = "Ah. Maybe that's me, actually."
1602005-37 = "[ns5] \"What were you looking at before?\"\n[ns6] \"I don't see anything interesting.\""
1602005-40 = "Do you see that streetlight at the entrance?"
1602005-41 = "That one on the right... The one that's slightly fainter than the other lights."
1602005-42 = "I learned this on a mission before. That streetlight has older circuits and breaks down pretty often."
1602005-43 = "These days, streetlights are automated, and their sensors can tell if the sun is up or not."
1602005-44 = "But that streetlight's sensor is worn out, so it'll turn off about once an hour."
1602005-45 = "So, the park's night-shift worker monitors the cameras, and if the lights are off, they have to turn the power back on manually. Isn't that a hassle?"
1602005-46 = "The other day, when I was passing by here, I saw it light back up."
1602005-47 = "It made me think, ah, there's someone on the other side of that streetlight."
1602005-48 = "That person isn't sleeping either, keeping watch to make sure the road stays well-lit."
1602005-49 = "...So when I feel lonely, I come to this park and just stare at that light flickering off."
1602005-50 = "[s] \"Did you feel lonely today?\""
1602005-51 = "It happens sometimes. The other squad members are all out late on missions today."
1602005-52 = "It's blackouts...or radio silence. But cutting communication, depending on the situation you're in, can be pretty standard."
1602005-53 = "Snipers, especially. We'll cut comms when we need to hear better."
1602005-54 = "Remember when I told you that communication is important for snipers? I think what's more important, and harder, is being okay with the solitude."
1602005-55 = "Sometimes, I can't see the enemies at all, let alone talk to my allies. It makes me feel like I'm the only person left in the world."
1602005-56 = "Even when it feels that way, a sniper's duty is to wait for their target in that isolated spot."
1602005-57 = "The only reason I chose to be a sniper is because I have good vision and steady aim."
1602005-58 = "But I get lonely easily. And when I feel that way..."
1602005-59 = "Sometimes I wonder if I chose the wrong career path."
1602005-60 = "[s7] \"There's no such thing as a wrong choice when you're finding your way.\"\n[s8] \"That's why you're a student. You're exploring the possibilities.\""
1602005-63 = "If I end up deciding sniping isn't for me, doesn't that mean everything I did up until now was a waste of time?"
1602005-64 = "If I'd chosen correctly, I would've grown more, and faster. Instead, I could be holding onto something that's not even meant for me."
1602005-65 = "...The thought of it kind of drives me crazy."
1602005-66 = "[ns9] \"What'd you say before?\"\n[ns10] \"Even if you make a mistake, you can fix it.\""
1602005-69 = "[ns] \"It's okay. You guys have all the time in the world.\""
1602005-70 = "Not really. I'm already a third year."
1602005-71 = "It's too late for me to change, isn't it?"
1602005-72 = "I can't be a student forever."
1602005-73 = "[s11] \"That's not true. As long as they're willing to learn...\"\n[s12] \"Anyone can be a student.\""
1602005-76 = "Doesn't that mean you could be one too?"
1602005-77 = "That's a funny logic."
1602005-78 = "You definitely are a weird adult."
1602005-79 = "...But thanks. I feel less lonely."
1602005-80 = "Ah, the streetlamp is off again."
1602005-81 = "...And there it goes."
1602005-82 = "For now, I'll be faithful to my orders."
1602005-83 = "Even if it's a simple task of turning the lights on and off..."
1602005-84 = "I'll keep on doing it. Maybe it'll spark a light in someone's heart."
1602005-86 = "Otogi and I watched the street light going on and off, chasing away each other's loneliness in the quiet of the dark."
