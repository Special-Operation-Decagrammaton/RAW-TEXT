[translation]
1602005-1 = "某位狙擊手的寂寞"
1602005-2 = "（確認御伽那則意味深長的MomoTalk之後，立刻前往了FOX小隊所在的地下HQ）"
1602005-3 = ""
1602005-7 = "FOX小隊HQ"
1602005-8 = "（……然而包含御伽在內的所有人卻都不在那裡）"
1602005-10 = "（就在走出夏萊，到附近的街道上晃了大約10分鐘之後……）"
1602005-11 = ""
1602005-12 = ""
1602005-13 = "（在附近公園的長椅上，找到了正呆呆望著路燈的御伽）"
1602005-14 = ""
1602005-15 = "[ns] 「御伽！」"
1602005-16 = "……咦？老師……"
1602005-17 = "這麼晚了，你來公園做什麼？"
1602005-18 = "晚上在人煙稀少的地方閒晃很危險的。"
1602005-19 = "[s1] 「那是我要說的話。」\n[s2] 「你為什麼這麼晚了還跑出來？」"
1602005-22 = "就只是想轉換一下心情──"
1602005-23 = ""
1602005-25 = ""
1602005-26 = ""
1602005-27 = "啊，你確認過MomoTalk了啊？"
1602005-28 = "……抱歉。看來是我讓你擔心了。"
1602005-29 = "明明真的沒什麼，卻害你大半夜跑出來，對不起。"
1602005-30 = "我真的只是出來散個步轉換心情而已，老師你回去夏萊也沒關係哦。"
1602005-31 = "明天早上不是還有重要的會議嗎？早點睡比較好哦。"
1602005-32 = "[s3] 「沒有事情比傾聽學生的煩惱更重要。」\n[s4] 「而且我剛好也想散散步。」"
1602005-35 = "……你還真是隨心所欲呢。"
1602005-36 = "不對，隨心所欲的是我才對吧。"
1602005-37 = "[ns5] 「你剛剛在這裡看什麼？」\n[ns6] 「看起來也沒什麼特別有趣的東西啊。」"
1602005-40 = "你看那邊。有看到入口附近的路燈嗎？"
1602005-41 = "右邊那盞……比其他路燈光線稍微暗一點的路燈。"
1602005-42 = "這是之前進行FOX小隊的作戰時得知的……那盞路燈因為電路老舊的關係經常故障。"
1602005-43 = "最近的路燈不是一到日落就會觸發感應器，然後自動點亮嗎？"
1602005-44 = "可是那盞路燈因為感應器老化，聽說就算放著不管也會每隔一小時左右就熄滅一次。"
1602005-45 = "所以公園的夜間值班人員會透過攝影機盯著，要是路燈熄滅了就手動重新打開電源。#n真是麻煩的方式，對吧？"
1602005-46 = "不過之前經過這附近時，看到熄滅的路燈重新亮起的那一刻，我忽然這麼想。"
1602005-47 = "啊，有某個人就在那另一頭。"
1602005-48 = "有某個人在這樣的夜裡也不入睡，持續做著點亮路燈的工作呢。"
1602005-49 = "……所以每當感到寂寞的時候，我就會來這座公園怔怔地看著那盞路燈。"
1602005-50 = "[s] 「你今天也感到寂寞了嗎？」"
1602005-51 = "嗯，今天其他隊員剛好都因為夜間作戰而處於無法聯絡的狀態。"
1602005-52 = "燈火管制……或者該說是通訊靜默吧。#n基於作戰上的理由切斷通訊是相當常見的事。"
1602005-53 = "對於位置資訊敏感的狙擊手來說更是如此。"
1602005-54 = "之前雖然說過溝通能力對狙擊手來說很重要……#n但是，其實狙擊手最需要的能力是忍受孤獨。"
1602005-55 = "就算看不見友軍、看不見敵人……甚至覺得這世界上只剩下自己一個人。"
1602005-56 = "也不能離開崗位，只能默默地等待目標到來。#n這才是狙擊手該有的素質。"
1602005-57 = "而我只是因為視力好跟指尖靈巧，才會選擇走上狙擊手這條路。"
1602005-58 = "所以每當像這樣毫無理由的感到寂寞時，我就會想……"
1602005-59 = "我是不是對自己的出路做了錯誤的決定。"
1602005-60 = "[s7] 「選擇出路這件事，本身就沒有什麼錯誤。」\n[s8] 「探索各種可能性，這本來就是學生的本分啊。」"
1602005-63 = "可是把時間花在不適合自己的事情上，不覺得很浪費時間嗎。"
1602005-64 = "如果去做更適合自己的事，說不定能成長得更多。#n一想到自己抓著不適合的事，白白浪費了時間……"
1602005-65 = "……我就難以忍受。"
1602005-66 = "[ns9] 「可是御伽你之前不也說過嗎？」\n[ns10] 「就算是失誤，也是可以挽回的。」"
1602005-69 = "[ns] 「沒關係，你們還有很長的未來呢。」"
1602005-70 = "可是我已經三年級了耶？"
1602005-71 = "要重新選擇出路，是不是太晚了？"
1602005-72 = "總不能永遠停留在學生的心態吧。"
1602005-73 = "[s11] 「沒有那種事，只要有想學習的心……」\n[s12] 「任何人都能成為學生。」"
1602005-76 = "照你這麼說，老師你也能成為學生囉？"
1602005-77 = "真是個奇怪的邏輯呢。"
1602005-78 = "你果然是個奇怪的大人。"
1602005-79 = "……不過謝謝你。#n多虧了你，寂寞感似乎消散了不少。"
1602005-80 = "啊，路燈又熄滅了。"
1602005-81 = "……又亮起來了呢。"
1602005-82 = "現在就該忠實地執行命令。"
1602005-83 = "就算只是單純地把燈點亮、熄滅的工作……"
1602005-84 = "只要反覆地持續下去，就能在某個人的心中點亮一顆星星。"
1602005-86 = "（之後，和御伽一起看了好一陣子路燈的明滅，撫慰了夜晚的寂寞）"
