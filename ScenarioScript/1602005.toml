[translation]
1602005-1 = "ความเหงาของสไนเปอร์"
1602005-2 = "(หลังจากได้รับข้อความ MOMOTALK ที่น่าสงสัยจากโอโทกิ คุณครูก็มุ่งหน้าไปยัง#nกองบัญชาการใต้ดินของกองทหาร FOX ทันที)"
1602005-3 = ""
1602005-7 = "กองบัญชาการของกองทหาร FOX"
1602005-8 = "(แต่ที่กองบัญชาการของกองทหาร FOX ก็ไม่มีใครอยู่เลย รวมทั้งโอโทกิด้วย...)"
1602005-10 = "(คุณครูจึงออกมานอกชาเล่ต์ และในตอนที่เดินไปตามถนนได้ประมาณ 10 นาที...)"
1602005-11 = ""
1602005-12 = ""
1602005-13 = "(ก็เห็นว่าโอโทกิกำลังนั่งอยู่ที่ม้านั่งในสวนสาธารณะ และมองเหม่อไปยังเสาไฟ)"
1602005-14 = ""
1602005-15 = "[ns] \"โอโทกิ!\""
1602005-16 = "เอ๋...? คุณครู..."
1602005-17 = "ดึกป่านนี้แล้ว ออกมาทำอะไรในสวนสาธารณะน่ะ?"
1602005-18 = "การเดินเตร่ในที่เปลี่ยวๆ ตอนกลางคืนมันอันตรายนะ"
1602005-19 = "[s1] \"ครูต่างหากที่ต้องพูดแบบนั้น ทำไมถึงมาอยู่ที่นี่ล่ะ?\"\n[s2] \"ทำไมถึงออกมาข้างนอกกลางดึกแบบนี้ล่ะ?\""
1602005-22 = "ฉันก็แค่อยากมาเปลี่ยนบรรยากาศ..."
1602005-23 = ""
1602005-25 = ""
1602005-26 = ""
1602005-27 = "อ่า เห็นข้อความ MOMOTALK แล้วนี่เอง"
1602005-28 = "ขอโทษนะ... ดูเหมือนฉันจะทำให้คุณครูเป็นห่วงซะแล้ว"
1602005-29 = "มันไม่ใช่เรื่องใหญ่แท้ๆ ขอโทษที่ทำให้ต้องรีบออกมาตามหากลางดึกนะ"
1602005-30 = "ฉันแค่ออกมาเดินเล่นเพื่อผ่อนคลายจิตใจเดี๋ยวเดียวน่ะ คุณครูจะกลับชาเล่ต์ก่อนก็ได้"
1602005-31 = "เห็นว่าพรุ่งนี้เช้ามีประชุมสำคัญไม่ใช่เหรอ? งั้นก็ควรเข้านอนเร็วๆ สิ"
1602005-32 = "[s3] \"ไม่มีอะไรสำคัญไปกว่าการรับฟังเรื่องกังวลของนักเรียนหรอก\"\n[s4] \"ครูเองก็อยากเดินเล่นตอนกลางคืนเหมือนกัน\""
1602005-35 = "ชอบทำอะไรตามอำเภอใจจริงๆ..."
1602005-36 = "ไม่สิ ฉันต่างหากที่ทำตามอำเภอใจ"
1602005-37 = "[ns5] \"มานั่งมองอะไรอยู่ที่นี่เหรอ?\"\n[ns6] \"ที่นี่ดูไม่มีอะไรน่าสนใจเลยนะ\""
1602005-40 = "เห็นไฟถนนตรงทางเข้ามั้ย ตรงโน้นน่ะ?"
1602005-41 = "เสาต้นที่อยู่ทางขวา... ที่ไฟสว่างน้อยกว่าต้นอื่นนิดหน่อย"
1602005-42 = "ฉันได้รู้ตอนทำปฏิบัติการของกองทหาร FOX เมื่อคราวก่อนน่ะ ได้ยินว่าไฟต้นนั้น#nแผงวงจรมันเก่าแล้ว ก็เลยเสียอยู่บ่อยๆ"
1602005-43 = "ไฟถนนสมัยนี้น่ะ พอพระอาทิตย์ตกดิน เซนเซอร์ก็จะทำงานจนไฟติดขึ้นมาเองโดยอัตโนมัติ#nใช่มั้ยล่ะ?"
1602005-44 = "แต่เสาไฟต้นนั้นน่ะ พอแผงวงจรเซนเซอร์มันเก่ามากๆ เข้า ต่อให้ปล่อยทิ้งไว้เฉยๆ ไฟก็ยังดับเอง#nทุกชั่วโมง"
1602005-45 = "เจ้าหน้าที่กะดึกของสวนสาธารณะนี้ก็เลยคอยดูผ่านกล้องวงจรปิด ถ้าเห็นว่าไฟดับไป ก็จะกดเปิดสวิตช์แบบแมนนวลให้น่ะ เป็นการแก้ปัญหาที่ยุ่งยากจริงๆ ว่ามั้ย?"
1602005-46 = "แต่ตอนที่ฉันผ่านมาแถวนี้และไฟถนนที่ดับอยู่สว่างขึ้น ฉันก็พลันนึกอะไรบางอย่างขึ้นมาได้"
1602005-47 = "อ่า มีใครบางคนอยู่ตรงนั้นสินะ"
1602005-48 = "ใครบางคนที่ยังไม่หลับและกำลังทำหน้าที่เปิดไฟถนนให้"
1602005-49 = "เพราะงั้นเวลาที่ฉันรู้สึกเหงา ฉันก็จะมาที่สวนสาธารณะแล้วจ้องมองแสงไฟถนนที่ริบหรี่อยู่แบบนี้ละ"
1602005-50 = "[s] \"วันนี้รู้สึกเหงาๆ งั้นเหรอ?\""
1602005-51 = "อื้อ วันนี้สมาชิกคนอื่นในกองออกไปทำปฏิบัติการภาคดึก ก็เลยไม่รับการติดต่อจากใคร"
1602005-52 = "จะเรียกว่าเป็นช่วงแบล็กเอาต์... หรือการห้ามส่งวิทยุก็ได้#nการตัดการสื่อสารระหว่างปฏิบัติงานเป็นเรื่องที่เกิดได้บ่อยๆ อยู่แล้ว"
1602005-53 = "ยิ่งสำหรับสไนเปอร์ที่อ่อนไหวต่อเรื่องพิกัดด้วยน่ะ"
1602005-54 = "จริงอยู่ที่คราวก่อนฉันเคยบอกว่าทักษะการสื่อสารเป็นสิ่งสำคัญของสไนเปอร์ แต่ที่จริงแล้วทักษะ#nที่จำเป็นที่สุดสำหรับสไนเปอร์ก็คือการอดทนต่อความโดดเดี่ยวต่างหาก"
1602005-55 = "ต่อให้จะไม่เห็นฝ่ายเดียวกัน ต่อให้จะไม่เห็นศัตรู... และต่อให้จะรู้สึกว่าตัวเองถูกทิ้งให้อยู่ใน#nโลกใบนี้เพียงลำพัง"
1602005-56 = "แต่การยืนหยัดประจำการและคอยเฝ้ารอเงียบๆ จนกว่าเป้าหมายจะปรากฏตัว ก็คือจรรยาบรรณ#nสูงสุดของสไนเปอร์"
1602005-57 = "ฉันเลือกเส้นทางของสไนเปอร์เพียงเพราะตัวเองสายตาดีและมือนิ่งน่ะ"
1602005-58 = "เวลาที่ฉันรู้สึกเหงาอย่างไม่มีสาเหตุ บางครั้งฉันก็จะคิดว่า"
1602005-59 = "ฉันตัดสินใจเลือกเส้นทางชีวิตตัวเองผิดพลาดไปหรือเปล่า"
1602005-60 = "[s7] \"ไม่มีการตัดสินใจผิดพลาดในการเลือกเส้นทางชีวิตหรอก\"\n[s8] \"หน้าที่หลักของนักเรียนคือการสำรวจความเป็นไปได้อยู่แล้ว\""
1602005-63 = "แต่การเสียเวลาไปกับงานที่ไม่เข้ากับความถนัดของตัวเอง มันก็เป็นการเสียเวลาเปล่าไม่ใช่เหรอ?"
1602005-64 = "ถ้าฉันได้ทำงานอื่นที่เหมาะกับความถนัดของตัวเอง ฉันอาจเติบโตไปมากกว่านี้แล้วก็ได้ พอมาคิดว่าฉันเสียเวลาไปกับการทำงานที่ไม่เหมาะกับความถนัดของตัวเอง..."
1602005-65 = "ฉันก็ทนไม่ไหวน่ะ..."
1602005-66 = "[ns9] \"ต่อให้จะเป็นความผิดพลาด แต่ก็แก้ไขได้ไม่ใช่เหรอ?\"\n[ns10] \"ถึงจะเป็นความผิดพลาด แต่ก็เคยบอกว่าแก้ไขได้ไม่ใช่เหรอ?\""
1602005-69 = "[ns] \"ไม่เป็นไรนะ ทุกคนมีเวลาค้นหาตัวเองได้ไม่จำกัดเลย\""
1602005-70 = "แต่ตอนนี้ฉันอยู่ชั้นปีที่ 3 แล้วนะ?"
1602005-71 = "มันไม่สายเกินไปที่จะเลือกเส้นทางชีวิตใหม่หรอกเหรอ?"
1602005-72 = "แล้วฉันก็ใช้ชีวิตด้วยความรู้สึกเหมือนเป็นนักเรียนไปตลอดไม่ได้ด้วย"
1602005-73 = "[s11] \"ไม่หรอก ถ้าแค่มีความปรารถนาที่จะเรียนรู้ก็พอ...\"\n[s12] \"แค่มีใจอยากเรียนรู้ ไม่ว่าใครก็เป็นนักเรียนแล้วละ\""
1602005-76 = "งั้นแปลว่าคุณครูก็เป็นนักเรียนได้งั้นเหรอ?"
1602005-77 = "ตรรกะอะไรเนี่ย น่าขำชะมัด"
1602005-78 = "เป็นผู้ใหญ่ที่แปลกจริงๆ"
1602005-79 = "แต่ยังไงก็ขอบคุณนะ... เหมือนความเหงาของฉันจะหายไปเกือบหมดแล้วละ"
1602005-80 = "อ๊ะ ไฟถนนดับไปอีกแล้ว"
1602005-81 = "สว่างขึ้นแล้วสินะ..."
1602005-82 = "ต้องทำตามคำสั่งอย่างเคร่งครัดอย่างนี้แหละ"
1602005-83 = "เพราะต่อให้เป็นแค่งานธรรมดาๆ อย่างการเปิดปิดไฟ..."
1602005-84 = "แต่ถ้าเราทำมันซ้ำๆ ไปเรื่อยๆ อย่างไม่มีวันสิ้นสุด ก็อาจช่วยให้ใครบางคนเกิดแสงแห่งความหวัง#nขึ้นมาก็ได้"
1602005-86 = "(หลังจากนั้นคุณครูก็นั่งดูไฟถนนที่ส่องกะพริบกับโอโทกิ และช่วยคลายความเหงาในยามดึกให้)"
