[translation]
1602005-1 = "어느 저격수의 외로움"
1602005-2 = "(오토기의 의미심장한 모모톡을 확인한 뒤, 바로 FOX 소대가 머무르고 있는 지하 HQ로 향했다.)"
1602005-7 = "FOX 소대 HQ"
1602005-8 = "(……하지만 FOX 소대 HQ에는 오토기를 포함하여 모두가 자리를 비운 상태였다.)"
1602005-10 = "(이후, 샬레 밖으로 나와 근처의 거리를 돌아다닌지 10분쯤 지났을 무렵……)"
1602005-13 = "(인근 공원의 벤치에 앉아 멍하니 가로등을 바라보고 있는 오토기를 찾을 수 있었다.)"
1602005-15 = "[ns] \"오토기!\""
1602005-16 = "……어라? 선생님……"
1602005-17 = "이런 늦은 시간에 공원에는 뭣 하러 나온 거야?"
1602005-18 = "밤에 인적이 드문 장소를 돌아다니면 위험하다고."
1602005-19 = "[s1] \"그건 내가 할 말이야.\"\n[s2] \"왜 이런 늦은 밤에 밖에 나온 거야?\""
1602005-22 = "그건 그냥 기분 전환 겸—"
1602005-27 = "아, 모모톡 확인했구나."
1602005-28 = "……미안. 내가 걱정을 끼친 모양이네."
1602005-29 = "정말 아무것도 아니었는데, 늦은 밤에 뛰쳐나오게 만들어서 미안해."
1602005-30 = "나는 정말 기분 전환하러 잠깐 산책 나온 거니까, 선생님은 샬레로 돌아가도 괜찮아."
1602005-31 = "내일 오전에도 중요한 회의가 있다고 했잖아? 일찍 자야지."
1602005-32 = "[s3] \"학생의 고민을 들어주는 것보다 중요한 일은 없어.\"\n[s4] \"마침 나도 밤 산책을 하고 싶은 기분이라서.\""
1602005-35 = "………정말 제멋대로네."
1602005-36 = "아니, 제멋대로인 건 내 쪽인가."
1602005-37 = "[ns5] \"여기서 무얼 보고 있었어?\"\n[ns6] \"특별히 재미있는 건 없어 보이는데.\""
1602005-40 = "저기, 입구에 있는 가로등 보여?"
1602005-41 = "오른쪽에 있는…… 다른 가로등보다 조금 빛이 희미한 가로등."
1602005-42 = "전에 FOX 소대의 작전을 진행하다 알게 되었는데, 저 가로등은 회로가 낡아서 자주 고장이 난대."
1602005-43 = "요즈음의 가로등은 보통 해가 지면 센서가 반응해서 자동으로 불이 들어오잖아?"
1602005-44 = "그런데 저 가로등은 회로 센서가 낡아서 가만히 놔두어도 한 시간에 한 번 꼴로 불이 계속 꺼진다고 하나 봐."
1602005-45 = "그래서 공원의 야간 당직자가 카메라로 지켜보다가 불이 꺼져 있으면 수동으로 전원을 다시 킨대. 정말 귀찮은 방식이지?"
1602005-46 = "그런데 이전에 이 근처를 지나가다가 꺼진 가로등의 불이 켜졌을 때, 문득 그런 생각이 들었어."
1602005-47 = "아, 누군가가 저 너머에 있구나."
1602005-48 = "누군가는 이 밤에도 잠들지 않고 가로등을 계속 키는 일을 하고 있구나."
1602005-49 = "……그래서 외로움이 느껴지는 때면 이 공원에 와서 저 가로등이 점멸하는 걸 멍하니 지켜보곤 했어."
1602005-50 = "[s] \"오늘도 외로움을 느꼈던 거야?\""
1602005-51 = "응. 오늘은 공교롭게도 다른 소대원들이 모두 야간 작전 때문에 연락을 받을 수 없는 상태거든."
1602005-52 = "블랙 아웃…… 무선 침묵이라고 할까. #n작전 상의 이유로 통신을 끊는 건 꽤 흔한 일이야."
1602005-53 = "더욱이 위치 정보에 민감한 저격수에게는."
1602005-54 = "전에 저격수에게 원활한 소통 능력도 중요하다고 말한 적이 있지만, 사실 저격수에게 가장 필요한 능력은 고독을 견디는 거야."
1602005-55 = "아군이 보이지 않아도, 적이 보이지 않아도…… 심지어 이 세계에 나 혼자 남겨진 기분이 들어도."
1602005-56 = "위치를 이탈하지 않고 묵묵히 목표가 오기를 기다려야 하는 것이 저격수의 미덕인데."
1602005-57 = "나는 그저 눈이 좋고, 손 끝이 섬세하다는 이유만으로 저격수의 길을 택했거든."
1602005-58 = "그래서 가끔 이렇게 이유 없는 외로움을 느낄 때마다 생각하곤 해."
1602005-59 = "나는 내 진로에 대해 잘못된 결정을 내린 게 아닐까."
1602005-60 = "[s7] \"진로를 택하는 데 잘못된 결정은 없어.\"\n[s8] \"가능성을 탐구하는 그 자체가 학생의 본분인 걸.\""
1602005-63 = "하지만 적성에 맞지 않는 일에 시간을 허비하는 건 낭비잖아."
1602005-64 = "다른 적성에 맞는 일을 했더라면, 훨씬 더 성장할 수 있었을 텐데. 적성에 맞지 않는 일을 붙잡고 시간을 낭비했다고 생각하면……"
1602005-65 = "……참을 수가 없어."
1602005-66 = "[ns9] \"하지만 전에 오토기가 말했잖아?\"\n[ns10] \"설령 실수라 하더라도, 만회할 수 있다고.\""
1602005-69 = "[ns] \"괜찮아. 너희들에게는 무한한 시간이 있으니까.\""
1602005-70 = "하지만 난 이미 3학년인데?"
1602005-71 = "진로를 새로 선택하기에는 너무 늦은 게 아닐까."
1602005-72 = "언제까지고 학생의 기분으로 머무를 수는 없잖아."
1602005-73 = "[s11] \"그렇지 않아. 배우고자 하는 마음만 있다면…….\"\n[s12] \"누구나 학생이 될 수 있다고.\""
1602005-76 = "그 말대로라면 선생님도 학생이 될 수 있는 거야?"
1602005-77 = "진짜 우스꽝스러운 논리네."
1602005-78 = "역시 이상한 어른이야."
1602005-79 = "……하지만 고마워. 덕분에 외로움은 많이 가신 것 같아."
1602005-80 = "아, 가로등의 불이 다시 꺼졌다."
1602005-81 = "……다시 켜졌네."
1602005-82 = "지금은 명령에 충실해야지."
1602005-83 = "단순한 불을 끄고 켜는 일이라 할지라도……"
1602005-84 = "무한히 반복하다 보면 누군가의 마음에 별 하나를 태어나게 해줄 수 있으니까."
1602005-86 = "(그 후, 오토기와 함께 가로등이 점멸하는 것을 한동안 지켜보며 새벽의 외로움을 달랬다.)"
