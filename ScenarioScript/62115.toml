[translation]
62115-4 = "윽……!"
62115-5 = "선생님?!"
62115-6 = "[s] \"일단 잠시 물러나자!\""
62115-11 = "모두 무사해?!"
62115-16 = "네, 네에……!"
62115-17 = "다른 아리우스 아이들도, 그사이에 어떻게든 몸을 숨긴 것 같아요……!"
62115-19 = "……하지만 천사들이 포르타 파시스 주위를 배회 중이다. 마치…… 다음 사냥감을 찾으려는 것같이 보이는군."
62115-20 = "어, 어떻게 하죠……. 최소한 저 천사가 정말로 무엇인지라도 알 수 있어야……."
62115-22 = "(모두가 어쩔 줄 모르고 있었던 때.)"
62115-23 = "(총성도, 대치도 멈춘 채 기괴하기까지 느껴지는 침묵이 이어지고 있었다.)"
62115-24 = "(그 순간, 모모톡이 울렸다……!)"
62115-27 = "[ns] \"어라? 이 이모티콘은……?\""
62115-29 = "백기를 흔들고 있는 이모티콘이네? 이건……?"
62115-30 = "백기라니, 보통은 항복 신호잖아. 여기에서 무슨 항복 같은 걸 할 수 있다고……."
62115-31 = "[s] \"……!!! 아니야. 알 것 같아. 가 보자!\""
62115-33 = "(모모톡에서 이야기해 준 장소로, 최대한 조심스럽게 이동했다.)"
62115-37 = "일단 오기는 왔는데……."
62115-38 = "여, 여보세요오……? 아무도, 안 계신가요오……?"
62115-43 = "선생님! 스쿼드 여러분!"
62115-44 = "그리고 너……."
62115-45 = "아, 안녕…… 또 만났네. 이런 식으로……."
62115-46 = "……선생님한테 갔던 거구나."
62115-47 = "으, 응."
62115-48 = "잘했어. 걱정했거든. 감사합니다, 선생님."
62115-49 = "[s1] \"에이, 당연한 일인데 뭘.\"\n[s2] \"그보다…… 우리를, 왜?\""
62115-52 = "아, 네. 그거 말인데요."
62115-53 = "저희가…… 샛길을 알아요."
62115-55 = "샛길?"
62115-57 = "네. 확인해 봤는데, 저 천사들도 반응하지 않았어요."
62115-58 = "……솔직히 잡혀가지 않을지 무섭긴 했는데, 어떻게든 되더라고요."
62115-59 = "그래도, 들키지 않게 최대한 조심하셔야 할 것 같긴 해요."
62115-61 = "……그런가. 고맙다. 위험했을 텐데……."
62115-63 = "헤헤. 뭘요. 선생님은…… 좋은 어른, 같았거든요."
62115-64 = "이것저것 많이 도와주기도 하셨고, 그러면 역시 저희도 뭔가 도와드려야 할 것 같아서……."
62115-65 = "……벌써 이런 이야기 하는 게 조금 웃기기도 한데, 공부할 때가 좋았던 것 같네요……."
62115-66 = "수업, 재미없었지만 재미있었어요. 어라, 말하고 보니 뭔가 이상하네요……."
62115-67 = "[s3] \"……차라리 재미없다고 솔직하게 말해 줘서 고맙구나…….\"\n[s4] \"다음 교육 과정은 좀 더 잘 준비해 볼게…….\""
62115-70 = "아, 아뇨. 사오리 선배가 선생님 된 거, 신기했어요."
62115-72 = "……."
62115-74 = "아츠코 씨 수업은…… 어……"
62115-75 = "어째서인지는 모르겠지만, 흥미롭긴 했어요. 재미있었다는 건 아니긴 한데……."
62115-77 = "후훗. 고마워. 아마 전공 내용 차이가 아닐까 하는데 말이야?"
62115-79 = "……차라리 미적분은 외워서 풀면 될 것 같았는데, 삼각함수는 모르겠더라고요……."
62115-81 = "……아직 덜 외워서 그래."
62115-82 = "……."
62115-84 = "……히요리 씨 수업은, 다음에도 기대할게요. 정말 좋았어요."
62115-86 = "가, 감사합니다…….!"
62115-91 = "시험이라는 것은 아직 잘 모르겠지만…… 어쨌든, 신선했어요. 모든 시간들이요."
62115-92 = "그냥, 누군가 우리에게……."
62115-93 = "사람을 해치는 것 이외의 무언가를 가르쳐 주고, 우리를 친절하게 대해 준다는 게 좋았어요."
62115-94 = "네. 그런 것들이, 그냥……."
62115-95 = "잠깐만 경험하고 마는 이벤트 같은 것이기는 했지만, 그래도요."
62115-96 = "[s] \"이벤트가 아니야.\""
62115-97 = "네……?"
62115-98 = "[s] \"그게 너희 모두가 원래 누려야 했을, 일상이야.\""
62115-99 = "그런 걸, 매일요……?"
62115-100 = "……."
62115-101 = "죄송해요. 상상이 잘 안 가네요……."
62115-102 = "그, 그보다……. 너무 오래 저희 이야기만 했네요."
62115-103 = "스바루 선배와 이야기하러 왔다고 하셨죠? 이쪽으로 오세요. 샛길, 안내해 드릴게요."
62115-109 = "여기예요. 저쪽 계단으로 들어가면…… 지하 기록 보관소로 이어지는, 뒷문으로 들어갈 수 있어요."
62115-110 = "스바루 선배가 지금 뭘 하고 계신지는 모르겠지만……. 아무도 들어오지 말라고 한 상태거든요."
62115-111 = "무슨 상담을 하시게 될지는 모르겠지만, 잘 됐으면 좋겠어요."
62115-112 = "스바루 선배가 없었다면…… 아리우스에 남은 아이들은, 진작에 모두 뿔뿔이 흩어져…… 사라져 버렸을 테니까요……."
62115-113 = "[s5] \"최선을 다해 볼게.\"\n[s6] \"가출 학생은 데려와서 교실에 앉혀야지!\""
62115-116 = "네, 선생님!"
62115-120 = "계단이 제법 깊네……."
62115-125 = "으우……. 꼭 경전에 나오는, 무저갱으로 내려가는 길 같아요……."
62115-130 = "조명이라도 켜고 싶지만……. 안 되겠죠……?"
62115-135 = "으음. 아직 우리는 누구에게도 들켜서는 안 될 것 같으니 말이다."
62115-140 = "읏……?!"
62115-145 = "[ns] \"아츠코?!\""
62115-146 = "아츠코!?"
62115-147 = "잡아 줘서 고마워, 선생님. 그런데…… 다른 모두는 괜찮아?"
62115-152 = "뭔가 있었어? 어디 돌부리라도 걸린 거야?"
62115-153 = "앞이 잘 안 보이는 것 말고는, 아무렇지도 않은데요오……?"
62115-154 = "으, 음. 나도 특별한 기색은 느껴지지 않는다."
62115-156 = "……그렇구나. 그렇다면……."
62115-157 = "(이건, 나에게만 느껴지는 감각인 것이겠네.)"
62115-158 = "(……엄청난 압력이야. 머릿속을 누군가가 쥐고 뒤흔들려는 것 같아.)"
62115-159 = "(지금도, 조금만 집중을 잃으면 바로 정신을……!)"
62115-160 = "어……?"
62115-161 = "왜 그러지? 너에게도 뭔가가 있나?"
62115-162 = "모, 모르겠어요. 어째서죠……? 엄청나게……."
62115-163 = "슬프고, 두렵고……. 고통, 스럽고……."
62115-164 = "제가 그런 걸 느끼는 게 아니라, 마치 바깥으로부터 그런 느낌이 밀려 들어오는 것처럼……."
62115-172 = "결국 여기까지 오셨군요. 선생님."
62115-173 = "[s] \"스바루!\""
62115-177 = "선…… 배?"
62115-178 = "왜, 왜 그래요……? 무슨 일, 있으셨어요……?"
62115-184 = "……."
62115-185 = "어떤 이야기를 하러 오셨는지는 짐작이 갑니다만, 잠시 자리를 옮기시죠."
62115-186 = "포르타 파시스와 아리우스에는, 우리가 지금까지 몰랐던 것들이 너무나 많이 잠들어 있었으니까요."
62115-188 = "흘러간 시간들의 오라토리오 편;To be Continued in Chapter 3"
