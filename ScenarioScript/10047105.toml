[translation]
10047105-3 = "와일드헌트 사감대 기숙사 복도"
10047105-6 = "[ns] \"이쪽은 생각 외로 사람이 없네?\""
10047105-7 = "히히…… 추격조는 모두 따돌렸으니까……."
10047105-8 = "다른 인원은 모두 이름 없는 종탑으로 간 것 같아요."
10047105-9 = "레나 쨩…… 부디 잘 도망갔으면 좋겠네요."
10047105-10 = "이제 종이 울리지 않는 걸 보니…… 곧 녀석들이 돌아올 거야."
10047105-12 = "[ns] \"다들 서두르자!\""
10047105-20 = "이제 이 입구 쪽만 마무리하면……!"
10047105-25 = "이 녀석들, 언제 우리 기숙사까지……!"
10047105-27 = "다들 동작 그만! 이제 얕은수는 안 통해!!"
10047105-31 = "……뉴후후후, 이미 늦었어요. 방금 마법진의 구축이 끝났으니까."
10047105-32 = "때가 왔습니다! 보름달이 충만한 지금, 진리의 문이 열릴 것이니……!"
10047105-36 = "마법진과 보름달? 저, 저 녀석 설마……!"
10047105-37 = "학원의 도시전설을 재현할 생각인가?!"
10047105-38 = "그렇습니다! 보여드리죠!!"
10047105-39 = "마법 연성진, 발동……!!"
10047105-47 = "아, 아아아악……! 갑자기 온몸에 힘이……!!"
10047105-48 = "크, 으윽……! 나, 난 여기까지인가……!!"
10047105-49 = "다들 왜 그래요? 그냥 전구에 불이 들어온 것뿐이잖아요."
10047105-50 = "응. 나도 알아."
10047105-51 = "그냥 한번 해본 거였어."
10047105-56 = "어, 어라? 어째서 아무 일도 일어나지 않죠?"
10047105-57 = "마법진은 분명 제대로 그렸을 텐데……!"
10047105-58 = "소원이 이루어지는 마법은…… 없었던 건가."
10047105-62 = "하지만 예쁘지 않나요? 학원 전체가 빛나고 있어요."
10047105-64 = "……흠."
10047105-65 = "우리는 보석을 다루는 분들에게 존경을 담아 <빛의 세공사>라고 부르곤 합니다."
10047105-66 = "그리고 보석은 물질만을 칭하는 말이 아니죠. #n……꿈을 향한 소녀들의 열정. #n이것 또한 아름다운 보석이 아닐까요."
10047105-67 = "그런 의미에서, 함께하는 사람으로서 저는 생각했습니다. #n지금 여기에 있는 것은―"
10047105-68 = "―아름다운 빛의 세공, 이라고."
10047105-70 = "됐으니까 이제 얌전히 항복하시지."
10047105-71 = "우리 잠을 설치게 한 대가를 치르라고!"
10047105-92 = "[ns] \"……이렇게 끝나는 건가.\""
10047105-94 = "여러분. 잠시만요."
10047105-102 = "[ns] \"너는…….\""
10047105-103 = "안녕하세요. 모두 잠시만 멈춰주세요."
10047105-104 = "평의회장님께서 직접 전할 말이 있다 하시네요."
10047105-106 = "평의회장……? 그런 분이 우리에게요?"
10047105-107 = "네. 그렇답니다. 통신을 연결해 드리죠."
10047105-113 = "모두 안녕하십니까. 평의회장 <우루와시 마나미>입니다."
10047105-114 = "야심한 밤, 정말 수고가 많으시네요."
10047105-115 = "마음 같아서는 저 역시 현장으로 나가고 싶습니다만, 조건이 여의치 않아 이렇게 목소리로만 전달드립니다."
10047105-116 = "우선 솔직히 말씀드리면……."
10047105-120 = "……정말 감동했어요."
10047105-121 = "사실 저는 예전부터 404호 분들께 흥미를 느끼고 있었어요."
10047105-122 = "그분들이라면 기존과는 다른, 좀 더 특별한 예술을 할 수 있다 생각했거든요."
10047105-123 = "오늘 밤, 여러분은 저의 기대대로 정말 훌륭한 예술 작품을 만들어 주셨습니다."
10047105-124 = "학원의 과거와 현재를 빛으로 연결해 절제 있는 도형으로 표현한,#n지금까지 유례가 없던 전위 예술이었어요."
10047105-125 = "해당 작품은 404호 여러분의 이름을 걸고 계속 전시했으면 하는 바람입니다."
10047105-126 = "높은 곳에 전망대를 설치하고 모두가 관람할 수 있도록 추진해 보겠어요."
10047105-127 = "그 모습을 사진으로 남겨둔다면, 저의 <수집품>으로서도 손색이 없겠죠."
10047105-128 = "후후후…… 앞으로의 활약을 기대하겠습니다. #n다음 기회엔 정식으로 찾아뵙도록 하죠."
10047105-129 = "이번 창작, 그리고 새로운 예술의 탄생에 감사를. #n……그럼 이만."
10047105-131 = "우리가 그린 마법진이…… 훌륭한 예술 작품?"
10047105-132 = "제가 말씀드렸잖아요? 아름다운 빛의 세공이었다고요."
10047105-133 = "사감대 너희도…… 사실은 예쁘다고 생각하잖아?"
10047105-137 = "뭐…… 그렇긴 한데 말이지."
10047105-138 = "음, 철거하면 조금 아까울지도."
10047105-142 = "저는…… 예전부터 모두에게 인정받는 작품을 만들고 싶었어요."
10047105-143 = "형편없는 낙제생이 아니라, 사랑받은 예술가가 되고 싶었죠."
10047105-144 = "항상 자신만만하게 웃고 다녔던 것도, 그런 조바심을 감추기 위해서였어요."
10047105-145 = "고마워요. 모두 여러분 덕분이에요."
10047105-146 = "여러분이 없었다면 저는……."
10047105-150 = "[ns1] \"아니야. 에리가 노력했기 때문에 가능했던 거야.\"\n[ns2] \"그러니까 자부심을 가지도록 해.\""
10047105-153 = "[ns3] \"이곳은 꿈과 희망의 원더랜드.\"\n[ns4] \"분명 모두의 꿈이 이루어지는 장소니까.\""
10047105-156 = "마스터……."
10047105-161 = "네……! 저, 앞으로도 계속 노력할게요!"
10047105-162 = "여러분과 함께라면…… 무엇이든 할 수 있을 것 같아요!"
10047105-176 = "네. 정말로 이루어진 거예요."
10047105-177 = "제가 바라던……. 소원이 이루어지는 마법이!"
10047105-179 = "저는 바란답니다."
10047105-180 = "이곳에서 모두가 꿈을 이루기를."
10047105-181 = "그리고 언제까지나 계속……."
10047105-182 = "이 마법 같은 일상이 계속되기를!"
