[translation]
70001010-1 = "테르마이 아카이 1"
70001010-8 = "대장! 그 꼬맹이 회장이 이끄는 사무국 학생들이 이곳으로 몰려들고 있어!"
70001010-9 = "젠장, 이번 쿠데타도 여기서 끝인가……"
70001010-10 = "하지만 이것으로 끝날 거라 생각치 마라!"
70001010-11 = "기필코 다음번에야말로 꼬맹이 회장을 몰아내고 붉은겨울 학원에 새로운—"
70001010-17 = "네 녀석들, 모두 숙청이야! 숙청!"
70001010-18 = "체리노 집무실"
70001010-20 = "휴우…… 이번에도 어떻게든 끝낸 것 같군."
70001010-25 = "체리노 회장님. 이번 쿠데타를 주동한 학생들을 모두 체포하였습니다!"
70001010-26 = "으음, 수고 많았다. 마리나 위원장!"
70001010-27 = "그대의 공적을 치하하는 의미로 특별히 <1급 수염 영웅 훈장>을……"
70001010-28 = "……아니, <1급 수염 영웅 훈장>은 지난 쿠데타 때 수여했던가?"
70001010-29 = "토모에 비서실장, 이번 쿠데타가 이번 주 들어 몇 번째 쿠데타지?"
70001010-33 = "미수에 그친 게 두 번, 그리고 실제로 성공한 것이 다섯 번입니다만……"
70001010-34 = "어머나, 그러고 보니 이번 주는 하루도 빠지지 않고 쿠데타가 연달아 일어났군요."
70001010-35 = "한 주 동안 부지런히 쿠데타에 맞서 싸운 체리노 회장님의 공적을 기념하는 의미에서 화가를 불러 지난 1주일간의 기록화를 그리게 할까요?"
70001010-36 = "기록화는 이제 되었어…… 지지난 쿠데타 때는 기록화를 그리기 위해 부른 화가가 사실은 쿠데타의 주모자였으니……"
70001010-40 = "그래서…… 이번에는 또 뭐 때문이지?"
70001010-41 = "네, 네……? 뭐 때문이라니요?"
70001010-42 = "붉은겨울 학원의 학생들이 충동적이라고는 하지만, 이만한 학생들을 연속으로 동원하기 위해서는 충분한 대의명분이 필요한 법."
70001010-43 = "평소였더라면 사흘에 한 번꼴로 시도되던 쿠데타가 1주일 연속으로 일어나는 걸 보니 다들 뭔가 큰 불만이라도 있는 모양인데……"
70001010-44 = "도대체 이 몸이 통치하는 붉은겨울 학원에 무슨 불만이 있기에 쉬지 않고 쿠데타를 벌이는 거지?"
70001010-45 = "어, 그게…… 그러니까……"
70001010-49 = "조사에 따르면 이번 쿠데타를 일으킨 주동자들은 붉은겨울 학원 내 목욕 시설의 개선을 요구하며 쿠데타를 일으킨 모양이더군요."
70001010-50 = "목욕 시설……? 목욕 시설이라면 이미 붉은겨울 학원에도 충분히 있지 않나."
70001010-51 = "그동안 목욕과 관련된 일이라면 별 요구 사항도 없었으면서, 어째서 갑자기……?"
70001010-52 = "……역시 <227호 온천장>에서의 경험 때문일까요."
70001010-53 = "227호 온천장? 어째서 그 이름이 나오는 것이냐?"
70001010-57 = "227호 온천장의 시설은 그동안 붉은겨울 학원에서는 경험할 수 없었던 호화로운 목욕 시설이었으니까요."
70001010-58 = "호화로운 탕에서 목욕을 즐기다, 다시 기숙사의 낙후된 시설로 돌아가려니 상대적인 박탈감을 느낀 학생이 많은 모양입니다."
70001010-61 = "흥, 이 몸이 보기에는 큰 차이도 없어 보이던 걸."
70001010-62 = "어차피 온수만 나온다면 목욕을 하는 데에는 문제가 없을 터. 붉은겨울 학원의 공용 기숙사에도 온수만큼은 충분히 나오고 있다고!"
70001010-64 = "……오전 7시와 오후 7시, 아침저녁으로 2시간 밖에 나오지 않지만요."
70001010-66 = "심지어 그마저도 가끔은 보일러 고장으로 찬물이 나올 때도 많지만……"
70001010-68 = "게다가 붉은겨울 학원 기숙사의 샤워실은 수백 명의 학생이 동시에 씻을 수 있으니까……"
70001010-69 = "규모만 두고 본다면 키보토스 제일이라 해도 과언이 아니지!"
70001010-71 = "낡고 칸막이조차 설치되지 않은 샤워부스뿐이긴 하지만……"
70001010-73 = "가끔은 일을 마치고 뜨거운 탕에서 하루의 피로를 풀던 때가 그리워……"
70001010-74 = "거기에 목욕을 마친 뒤에 마시는 시원한 커피 우유까지 함께 곁들인다면—"
70001010-79 = "무, 물론 목욕을 마치고 나서 마시는 커피 우유가 아무리 달콤하다고 한들, 체리노 회장님께서 직접 만들어 주시는 체룐카에 비할 바는 아니지요!"
70001010-80 = "게다가 목욕과 같은 일상에서 사치를 추구하다니, 그야말로 부르주아나 할 법한 발상……"
70001010-81 = "………"
70001010-82 = "저, 정말입니다! 그러니 제발 숙청만큼은……!"
70001010-83 = "……역시 붉은겨울 학원의 목욕 시설을 전반적으로 손보는 게 좋겠군."
70001010-84 = "네, 네……?"
70001010-85 = "눈앞에서 듣고도 바로 되묻다니. 귀가 어떻게 되기라도 한 건가, 마리나 위원장?"
70001010-86 = "붉은겨울 학원의 목욕 시설을 개수하는 게 좋겠다고 말했었네."
70001010-90 = "다른 학생들뿐이라면 몰라도 사무국의 공신들까지 그렇게 말한다면, 대다수의 학생들이 같은 고충을 갖고 있는 게 분명하겠지."
70001010-91 = "위대한 지도자란 단순히 군림하는 데 그치지 않고 민생의 목소리에 귀를 기울이는 것이 당연한 법."
70001010-92 = "학생들의 원성을 모른 척한 채 뜻을 강행할 정도로 이 몸은 무능하지 않느니라!"
70001010-93 = "뭐, 거기에 더해 목욕같이 사소한 문제 때문에 쿠데타가 일어나는 걸 더 이상 방치할 수도 없고……"
70001010-94 = "정말 훌륭하신 발상이십니다, 서기장님!"
70001010-95 = "무엄하게 서기장님의 권위에 반기를 든 학생들을 단죄하는 데 그치지 않고, 그들의 괴로움까지 헤아려 넓은 아량으로 감싸 안으시다니…… 불초 토모에, 감격했습니다!"
70001010-96 = "에헴, 당연하지. 이 몸은 붉은겨울 학원의 학생회장이자, 미화부장이자, 서기장이자, 체육부장 등인…… 체리노 님이니까!"
70001010-97 = "체리노 회장님께서 붉은겨울 학원의 목욕 시설을 개수한다는 소식이 알려진다면, 학원의 모든 학생들이 그 자비로움에 감격을 금치 못할 겁니다."
70001010-98 = "지금 바로 <붉은 곰>에 일러 특집 기사를 준비하도록 할까요?"
70001010-99 = "음, 부탁하겠네. 토모에 비서실장."
70001010-107 = "그럼 구체적으로 목욕 시설을 개수하려면……"
70001010-112 = "……우선 샤워실의 크기를 두 배로 늘리면 되려나?"
70001010-113 = "저, 그건 아무래도 방향성이 다른 것 같—"
70001010-117 = "샤워실을 증축하는 것도 좋지만, 역시 이런 문제는 전문가에게 맡기는 게 어떨까요?"
70001010-118 = "전문가라니? 우리 붉은겨울 학원에 목욕 전문가가 있단 말인가?"
70001010-119 = "네, 마침 붉은겨울 학원에는 대규모의 온천장을 성공적으로 운영해 낸 목욕 시설의 전문가들이 머무르고 있는 시설이 하나 있습니다."
70001010-120 = "바로……"
70001010-123 = "그동안 구교사에서 춥고 괴로운 나날을 견뎌가며 탄원서를 작성하길 수차례……"
70001010-124 = "마침내 저희의 간절한 목소리가 체리노 회장님께 닿은 모양이군요!"
70001010-125 = "……드디어 석방인가요?"
70001010-129 = "아니, 가석방이다만."
70001010-130 = "그동안 반성의 기색이라고는 조금도 보이지 않았으면서 석방을 기대하고 있었다니, 뻔뻔하기 짝이 없군."
70001010-131 = "그게 무슨 말씀이신가요?"
70001010-132 = "구교사의 혹독한 환경 속에서도 꼬박꼬박 반성문을 제출하며 조용히 근신하고 있었는데, 반성의 기색이 없었다니요!"
70001010-133 = "………조용히?"
70001010-134 = "무, 물론 가끔씩 [USERNAME] 선생님의 모습을 보기 위해 높은 곳에 올라간 적은 있었지만……"
70001010-139 = "……지난번에는 샬레 인근의 전신주에 올라가다가 발키리의 경찰 학생들에게 체포된 적도 있었지."
70001010-144 = "그것 보라고. 일고의 반성도 없이 일탈을 반복하는 학생들을 이유도 없이 사면해 준다면, 사무국의 권위가 제대로 서지 않아!"
70001010-145 = "치잇…… 좋다 말았네."
70001010-146 = "그럼 석방도 아니라면, 저희를 갑자기 불러낸 이유는 무엇 때문인가요?"
70001010-147 = "그건…… 그대들에게 특별히 부탁하고 싶은 일이 있기 때문이다."
70001010-148 = "이번 일만 잘 해결된다면 그대들이 저지른 잘못을 불문에 부치는 것은 물론이고, 영예로운 훈장에 사무국원의 직위도 부여하도록 하지!"
70001010-149 = "체리노 회장이 내리는 영예로운 훈장 같은 건 필요 없지만……"
70001010-150 = "저희의 처우에 대해서는 그동안 관심도 없었으면서, 갑자기 이렇게 불러내서 부탁을 하시다니…… 뭔가 수상한걸요."
70001010-151 = "설마 지난번에 멋대로 온천장을 운영한 것에 대해 앙심을 품고—"
70001010-152 = "아뇨. 오히려 저희 붉은겨울 사무국 일동은 지난 사건 당시, 여러분이 일하시는 모습을 보며 깊은 감명을 받았습니다."
70001010-153 = "노하우도 없이 바닥부터 온천장을 운영해 나가며, 학원 내외에서 찾아온 손님들을 훌륭히 접객하는 특별반 여러분의 모습은 붉은겨울 학원의 여러 노동자들에게 귀감이 되었지요."
70001010-154 = "뭐…… 무허가 운영이긴 했지만."
70001010-158 = "물론 사전에 사무국의 허가는 얻지 못했지만요."
70001010-159 = "따라서 이번에는 같은 실수를 반복하지 않도록, 저희 사무국에서 먼저 여러분께 대규모의 목욕 시설을 운영할 수 있는 기회를 드리고자 합니다."
70001010-160 = "네? 그 말씀은…… 227호 온천장을 부활시키겠다는 뜻이신가요?"
70001010-161 = "흥. 게헨나의 악동들이 학원을 용암 바다로 만들려는 걸 간신히 저지했는데, 이제 와서 온천을 다시 개발할 리가 없지 않느냐."
70001010-162 = "정확히 말씀드리자면, 저희가 부탁드리고 싶은 건 공용 기숙사의 목욕 시설을 관리하는 업무입니다."
70001010-163 = "이번에 붉은겨울 사무국에서는 학생들의 건의사항을 받아들여 기숙사 내의 목욕 시설을 전면적으로 개수하려 했습니다만……"
70001010-164 = "붉은겨울 학원에서 대규모의 목욕 시설을 운영해 본 경험자가 227호 특별반의 여러분 이외에는 없어서요."
70001010-165 = "뭐야, 온천장이 아니라 기숙사의 목욕 시설이었나……"
70001010-166 = "그럼 목욕 후에 마실 음료수 같은 건 만들어 팔 수 없겠는걸."
70001010-167 = "장기적으로는 여러 가지 시설을 추가할 수도 있겠지만, 일단은 여러 학생들이 사용할 수 있는 대규모 목욕 시설이 우선입니다."
70001010-168 = "따라서 227호 특별반 여러분은 다른 학원에 설치된 목욕 시설을 견학하신 뒤에, 어떤 학원의 목욕 시설을 도입하면 좋을지 의견을 주셨으면 합니다."
70001010-169 = "다른 학원의 목욕 시설을 견학한다고요……?"
70001010-170 = "네. 처음부터 청사진 없이 목욕 시설을 시공하기에는 재원도 노하우도 부족하니까요."
70001010-171 = "이번만큼은 이미 목욕 시설을 운용하고 있는 다른 학원에 발주를 맡기고자 합니다."
70001010-172 = "다만 이 과정에서 많은 사람의 이해관계가 섞여 들어갈 수 있기 때문에, 이미 온천장을 한 차례 훌륭히 운영해 낸 경험이 있는 특별반 여러분께 부탁을 드리는 것입니다."
70001010-173 = "물론 이번 견학에 필요한 비용은 저희 붉은겨울 사무국에서 모두 지불해 드리는 것이니, 목욕 시설의 운영과 관련된 것이라면 부담 없이 체험해 보시길 바랍니다."
70001010-174 = "평소였더라면 일반 학생들은 절대로 경험해 볼 수 없는 호사이니 영광으로 여기도록!"
70001010-176 = "으음, 이렇게 형편 좋은 제안이 오다니. 어쩐지 내키지 않는데……"
70001010-177 = "하지만 시구레 쨩, 이건 기회라고!"
70001010-178 = "이번 건만 잘 해결한다면 혹독한 구교사 생활에서 벗어날 수 있는 건 물론이고, 못다 한 온천장 운영도 재개할 수 있을지도 몰라!"
70001010-179 = "게다가 여러 학원의 목욕 시설을 무료로 체험할 수 있는 기회인데, 우리 같은 평범한 학생이 거절할 이유도 없잖아?"
70001010-180 = "뭐, 노도카가 원한다면 난 반대하지는 않겠지만……"
70001010-181 = "네, 할게요!"
70001010-185 = "지금은 사라진 227호 온천장의 이름을 걸고서라도, 붉은겨울 학원의 모든 학생들이 만족할 수 있는 최고의 목욕 시설을 운영하도록 노력하겠습니다!"
70001010-187 = "후후, 그렇게 말씀해 주시니 안심이 되네요."
70001010-188 = "그럼…… 잘 부탁드리겠습니다."
