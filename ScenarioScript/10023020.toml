[translation]
10023020-1 = "제2화;청소를 시작합시다."
10023020-2 = "(모모이들과 만나기로 약속한 시간이 다 되었다……)"
10023020-3 = "(주위를 둘러보고 있던 중.)"
10023020-4 = "안녕, 선생님!"
10023020-5 = "[s] \"안녕, 모모…… 이……?\""
10023020-6 = "쨔잔–! 메이드복이라구!"
10023020-7 = "어때? 어때? 귀엽지?"
10023020-8 = "어울리지?"
10023020-9 = "자, 감상을 말해 보시라!"
10023020-10 = "[s1] \"아, 아아…… 어쩌면 난 지금까지……\"\n[s2] \"모모이의 메이드복 차림을 보기 위해 살아왔던 건지도 몰라……\""
10023020-11 = "그, 그래……? 헷. 에헷. 그렇게까지 반응해 주다니, 조금 쑥스러운데?"
10023020-12 = "그, 그래……? 헷. 에헷. 그렇게까지 반응해 주다니, 조금 쑥스러운데?"
10023020-13 = "헉, 헉……! 언니, 갑자기 뛰어가면 어떡해! 움직이기 불편하다며 투덜거릴 땐 언제고……!"
10023020-14 = "후후~! 선생님한테 빨리 보여주려고 그랬지!"
10023020-15 = "안녕하세요, 선생님. 일찍 오셨네요. 죄송해요. 저희가 먼저 도착했어야 하는데."
10023020-16 = "[s] \"이 정도야 뭘. 그보다 미도리, 귀엽네. 잘 어울려.\""
10023020-17 = "그, 그런……가요? 가, 감사합니다. 에헤헤……"
10023020-18 = "자, 유즈도 어서!"
10023020-19 = "앗, 으, 으응……"
10023020-20 = "어떠……세요, 선생님? 으우…… 치마가 너무 하늘거리는 것 아닐까요……?"
10023020-21 = "[s] \"잘 어울려, 유즈…… 최고야!\""
10023020-22 = "서, 선생님?!"
10023020-23 = "아, 그, 그게……! 아으으!"
10023020-28 = "다음은 아리스! 인데……?"
10023020-29 = "어라? 아리스?"
10023020-30 = "아리스 쨩? 왜 그래?"
10023020-32 = "역시 아리스에게는 아직 이릅니다! 메이드복…… 메이드복은……"
10023020-33 = "네루 선배의 옷입니다! 아리스에게는 무리입니다!"
10023020-35 = "앗차…… 간신히 설득해서 데려올 수 있었나 싶었더니……"
10023020-36 = "아리스 쨩의 메이드복 공포증…… 좀처럼 낫지 않네……"
10023020-37 = "[s] \"메이드복 공포증?\""
10023020-38 = "네…… 그게…… 아리스 쨩은 여전히 메이드복을 무서워해서요……"
10023020-39 = "네루 선배와는 많이 친해졌다지만, 그래도 어려운 건 어려운 건가 봐요."
10023020-40 = "으으으, 안 돼! 아리스! 용사가 메이드복 같은 것에 겁먹으면 어떡해!"
10023020-42 = "하지만, 아리스는……"
10023020-43 = "[s3] \"그래, 아리스. 두려움에 도전하는 것이야말로 용사가 할 일이야.\"\n[s4] \"용사는 포기하지 않는 법이잖아? 퀘스트를 하고, 모험을 해야지!\""
10023020-44 = "으으…… 분명히 그렇습니다. 그렇지만, 그렇지만……"
10023020-45 = "으으…… 분명히 그렇습니다. 그렇지만, 그렇지만……"
10023020-46 = "……알겠습니다. 아리스는 용사입니다. 네…… 용사가 될 겁니다."
10023020-47 = "아리스, 가겠습니다!"
10023020-50 = "우애앵……"
10023020-51 = "메이드복을 입고 있는 것만으로 온몸이 찌릿찌릿한 겁니다……!"
10023020-52 = "[s] \"역시 아리스야! 해 낼 줄 알았어!\""
10023020-53 = "……"
10023020-54 = "아리스는…… 이대로 괜찮은 겁니까?"
10023020-55 = "메이드복을 입어도…… 아리스는 아리스인 건가요?"
10023020-58 = "물론이지!"
10023020-62 = "감사……합니다."
10023020-66 = "어떤 모습을 하고 있더라도…… 아리스는 아리스인 거군요……!"
10023020-68 = "거 봐, 아리스 하면 할 수 있잖아!"
10023020-70 = "대단해, 아리스 쨩."
10023020-72 = "아리스 쨩…… 노력했구나……"
10023020-76 = "[ns] \"잘했어. 아리스.\""
10023020-79 = "(모두가 아리스를 둘러싸고 박수를 쳐 주었다.)"
10023020-80 = "(그렇게 해피 엔딩……)"
10023020-82 = "(이 아니고!)"
10023020-84 = "[ns] \"그러고 보니 모두들, 콜사인이 더블오네?\""
10023020-85 = "아, 이거? 선생님이 구해다 준 메이드복 중에서…… 네루 선배 것만 겨우 몸에 맞더라고."
10023020-86 = "아마도 아카네 선배가 써 둔 것이겠지만, '부장님이 혹시나 조금이라도 자랐을 때를 위해서'라는 메모도 끼어 있었어요."
10023020-90 = "여분의 네루 선배 옷 중에서도, 예비로 조금 큰 사이즈들을 마련해 주신 것 같으신데……"
10023020-91 = "나머지는 몸에 맞지 않았던 겁니다! 특히 카린 선배의 옷은 무지막지하게 컸습니다!"
10023020-92 = "아무튼, 이제 다 모였으니까! 메이드복이 어울린다는 것도 선생님에게 확인받았고!"
10023020-93 = "모험의 시작입니다!"
10023020-94 = "괜찮은 걸까…… 그래도 선생님이 계시기는 하지만……"
10023020-95 = "우으…… 이대로 사라지고 싶어……"
10023020-97 = "(그렇게, 의뢰를 위한 모험(?)이 시작되었다……)"
10023020-99 = "……"
10023020-100 = "……"
10023020-104 = "……"
10023020-105 = "?"
10023020-109 = "[ns] \"여기…… 생각보다 엄청난데?\""
10023020-110 = "지, 지금이라도 그만둬야 하는 거 아닐까……?!"
10023020-111 = "……여기까지 와서 그런 말을 하면 어떡해!"
10023020-118 = "어? 유즈 쨩? 유즈 쨩?!"
10023020-124 = "어서 오십시오, 여러분. 기다리고 있었습니다."
10023020-125 = "늦지도 빠르지도 않게 정확히 약속 시간에 와 주셨군요. 감사드립니다."
10023020-127 = "(미도리…… 봐봐, 이 사람이야)"
10023020-128 = "다, 당신이…… 그러니까, 의뢰인이신 거죠……?"
10023020-133 = "[ns5] \"청소 일이라고 들었습니다만……\"\n[ns6] \"어디를 어떻게 청소하면 될까요?\""
10023020-134 = "아, 바로 본론으로 들어가시는 거군요. 알겠습니다."
10023020-135 = "아, 바로 본론으로 들어가시는 거군요. 알겠습니다."
10023020-136 = "저는 미술품들의 보관과 관리, 그리고 유통을 주로 담당하고 있습니다. 그중에는 미술품들의 경매를 여는 것도 포함되어 있죠."
10023020-137 = "그런데 이번 경매에 상당히 귀중한 작품이 매물로 나올 예정이어서…… 그 작품들에 대한 경호와 경비를 부탁드리고 싶습니다."
10023020-138 = "자, 잠깐만! 우린 분명 청소 일이라고 들었는데……?!"
10023020-139 = "그렇습니다. C&C의 업무에 있어서 '청소'란, 비밀 에이전트로서의 일을 의미하는 단어가 아니었는지요?"
10023020-140 = "(그, 그랬었어?!)"
10023020-141 = "(그걸 나한테 물으면 어떡해, 언니!)"
10023020-142 = "(어, 어떡하지……? 어떡하지, 어떡하지, 어떡하지, 어떡하지……!)"
10023020-143 = "(일단 진정해! 그리고…… 지금은 이 순간을 넘겨야 해!)"
10023020-144 = "네, 네에. 분명히, 그렇기는 합니다만!"
10023020-145 = "[s] \"적어도 그런 일이었다면, 확실하게 언질을 주셨으면 좋았을 텐데요……\""
10023020-147 = "그 부분은 죄송합니다. 하지만 C&C 여러분은 분명 비밀 에이전트시고."
10023020-148 = "남들 앞에서 너무 공개적으로 의뢰를 부탁하는 것은 곤란하실 것이라 생각했습니다."
10023020-149 = "아무튼…… 저희가 이렇게 만나 함께하게 된 것도 인연이고 하니."
10023020-150 = "C&C 여러분들의 실력을, 제 눈으로 한 번 확인하고 싶군요."
10023020-153 = "!!!"
10023020-155 = "C&C 여러분들은 각자가 특정 분야의 스페셜리스트로, 자신의 분야에 대해서는 누구도 따라올 수 없는 실력을 가지고 있다고 들었습니다."
10023020-156 = "물론 그 전부를 보여 달라는 것은 아닙니다. 여러분들이 진정한 실력을 내보일 때는…… 그렇군요. '청소'의 '현장'이실테니까요."
10023020-157 = "하지만 그 실력의 일부만이라면, 시범을 요청 드려도 그렇게까지 실례는 아닐 거라 믿습니다."
10023020-158 = "(역시 사실대로 얘기하자. 언니!)"
10023020-159 = "(안 돼! 그러다 네루 선배한테 죽을 거야! 말 그대로 죽을 거야!)"
10023020-160 = "(그럼, 우리끼리 의뢰를 어떻게든 할 수 있다는 거야……!?)"
10023020-161 = "(그, 그래…… 여기에서는 우리 힘으로 어떻게든 해 보자!)"
10023020-165 = "자, 어떤 분부터 부탁드리면 되겠습니까?"
10023020-171 = "아리스, 알았습니다! 이건 전직 이벤트인 거군요! C&C 클래스로 체인지인 겁니다!"
10023020-172 = "아리스 쨩?!"
10023020-173 = "아리스?!"
10023020-174 = "아리스가 선택할 수 있는 클래스는……"
10023020-181 = "……"
10023020-187 = "……"
10023020-194 = "끄앙……!"
10023020-199 = "……!!!"
10023020-212 = "오늘 아리스의 역할은…… 명속성 단일 딜러……"
10023020-213 = "지금부터 아리스는, 저 멀리 놓여 있는 바위를 저격하겠습니다!"
10023020-214 = "하아아아아앗……!"
10023020-215 = "빛이여!"
10023020-217 = "(콰과과광!)"
10023020-219 = "오, 오오……! 800미터는 떨어져 있는 곳에 놓인 바위가, 일격에……!"
10023020-220 = "그러고 보니 C&C에는 아무리 먼 표적이라도 반드시 명중시킨다는 저격수가 있다고……!"
10023020-221 = "그런데 저격수란 건 은밀함과 은폐가 필수라고 들었는데요……?"
10023020-222 = "괘, 괜찮아요! 어쨌든 먼 거리의 목표물만 제압할 수 있다면 저격이니까요!"
10023020-223 = "맞아! 목격자가 없으면 미션 클리어라고! 이것도 그런 거야!"
10023020-224 = "그렇습니까? 그것이 C&C의 방식이라면야……"
10023020-225 = "아무튼 감사합니다. 다른 분은 어떤 포지션을 맡고 계시는지 궁금하군요."
10023020-226 = "가령 여기 조용하게 생기신 분은……?"
10023020-230 = "?! 따, 딸꾹!"
10023020-233 = "(어떡하지, 어떡하지, 어떡하지, 어떡하지……!)"
10023020-234 = "(유즈! 당황하지 마! 할 수 있는 걸 생각해!)"
10023020-235 = "(맞아! 유즈 쨩은 평소에 몸을 잘 숨기잖아! 그걸로 어떻게든……)"
10023020-236 = "(그래, 그거야!)"
10023020-237 = "(뭐, 뭘?!)"
10023020-238 = "(이리 와 봐!)"
10023020-240 = "흐음…… 잠시 자리를 피해 달라는 부탁을 듣고 그대로 했습니다만……"
10023020-244 = "음?"
10023020-247 = "뭐야, 평범한 상자로군요. 난 또 뭐라고."
10023020-262 = "꼼짝, 마세요……"
10023020-263 = "우오오옷?!"
10023020-265 = "이야아, 깜짝 놀랐지 뭡니까. 대단하십니다. 아무도 모르게 기척 없이 제 뒤를 잡으시다니."
10023020-266 = "그러고 보니 C&C에는 엄청난 행운으로, 언제 어디서 나타났는지도 모르게 목표에 접근해 목적을 달성하는 잠입 요원이 있다고 들었습니다."
10023020-267 = "작은 몸으로 잠입 임무를 처리하느라 수고가 많으시군요. 오히려 그래서 더욱 수월한 것이었을까요?"
10023020-268 = "네, 네에에…… 그런 것으로…… 해 둘게요……"
10023020-269 = "그러면 다음은…… 그렇군요. 상대적으로 냉정하게 전황을 파악하고, 모두를 아우를 줄 아는 참모도 있다고 들었는데……"
10023020-270 = "분명 당신이 그 참모이시겠군요."
10023020-271 = "네? 어…… 음…… 그래요. 저는 그런 거군요……"
10023020-272 = "그리고 마지막으로……"
10023020-273 = "……"
10023020-274 = "……"
10023020-275 = "뭐, 뭐야! 할 말이 있으면 얼른 하시지!"
10023020-276 = "아뇨. 납득했습니다. 남은 것은 <리틀 타이런트>……."
10023020-278 = "소문 그대로의 인물인 것 같으니 문제없겠군요."
10023020-279 = "뭐가 어째─!!!"
10023020-281 = "[ns7] \"이 정도 규모의 저택을 소유하고 계신다면……\"\n[ns8] \"어느 정도 방범 시스템도 구축되어 있을 텐데 왜 C&C에게 의뢰를……?\""
10023020-284 = "확실히, 제 저택의 방범 시스템은 호락호락하지 않은 수준이라고 자부하고 있습니다."
10023020-285 = "그럼에도 이번에 특별히 C&C 여러분들을 모시기로 한 것은."
10023020-289 = "<자애의 괴도>에게서, 예고장이 날아왔기 때문입니다……"
10023020-294 = "자애의…… 괴도?"
