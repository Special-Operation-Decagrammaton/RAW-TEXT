[translation]
1008705-1 = "아무튼 그런 걸로 해둬요!"
1008705-3 = "(게헨나 외곽의 한 파티홀)"
1008705-7 = "선생님. 오셨군요."
1008705-8 = "[s] \"아코. 여기는 대체…….\""
1008705-9 = "네. 여기는 게헨나 학원과 교류를 맺고 있는 사설 회사들의 친목 모임이에요."
1008705-10 = "이런저런 이유로 얼굴을 비춰야 하는 귀찮은 일인데……. 이런 일을 하는 것도 행정관의 일이거든요."
1008705-11 = "평소라면 그냥 원래 입는 옷을 입고 와도 뭐, 누구도 뭐라 하지 않았을 테지만……"
1008705-15 = "아직 이 드레스, 걷는 거라든가 움직이는 게 조금 신경 쓰여서……."
1008705-16 = "만마전 녀석들의 파티에 참석하기 전에 조금 익숙해질 필요가 있을 것 같아서요."
1008705-17 = "[s] \"즉, 모의 전투를 해보고 싶다, 라는 거구나.\""
1008705-18 = "네, 그런 거죠."
1008705-19 = "그 만마전…… 너구리 녀석들이 벌이는 파티라면 선생님과도 같이 있기 힘들 거고……"
1008705-20 = "게다가 선생님이 골라주신 옷인데…… 처음은 선생님과……."
1008705-25 = "그, 그러니까 선생님도 이 훈련에 어울려주셔야겠어요!"
1008705-26 = "[s] \"알겠어. 맡겨둬.\""
1008705-27 = "……네."
1008705-33 = "[ns] 아코를 에스코트한다."
1008705-40 = "흐음……."
1008705-41 = "[s] \"아코, 괜찮아? 걷는 게 불편해 보이는데?\""
1008705-45 = "아, 네……."
1008705-46 = "이 드레스, 생각보다 길어서 그런지, 자꾸 치마 끝을 저도 모르게 밟을 것 같아서……. 어……."
1008705-51 = "어, 어……?"
1008705-56 = "푸헤훙?!"
1008705-57 = "[ns] \"아코 괜찮아?!\""
1008705-61 = "아, 네…… 너, 넘어질 뻔했어요……. 치마를 밟아서……."
1008705-62 = "그치만 선생님이 잡아주신 덕에 다행히……."
1008705-66 = "……어라?"
1008705-67 = "저, 저기…… 뭔가 찢어지는 소리가 나지 않았나요?"
1008705-71 = "제, 제 뒤에……? 등 쪽…… 아니 허리 쪽이……?"
1008705-72 = "[s] \"등? 허리?\""
1008705-74 = "아니 좀 더 아래쪽이……."
1008705-79 = "꺄, 꺄아아-?! 찢어져 버렸어요?! 허리 쪽이……?!"
1008705-80 = "[s1] \"기, 기다려봐. 내가 어떻게든 해볼게.\"\n[s2] \"일단 사람들이 없는 구석으로 가자!\""
1008705-88 = "[wa:100]― [log=아코 드레스]이, [wa:750]이대로는 곤란해요![/log]"
1008705-90 = "― [log=아코 드레스]만약 다른 사람이 [wa:850]눈치채거나 하면……[/log]"
1008705-93 = "― [log=아코 드레스]큰일이 [wa:850]나버린다구요……![/log]"
1008705-96 = "[ns] \"있어봐, 일단 찢어진 부분을 옷핀으로…….\""
1008705-97 = "[wa:150]― [log=아코 드레스]하, [wa:700]하필이면 [wa:700]이런 타이밍에……![/log]"
1008705-100 = "― [log=아코 드레스]역시 [wa:1000]이건 선생님과 함께 [wa:1200]왔기 때문에……?[/log]"
1008705-103 = "[ns] \"네?! 그런 억지가 어딨나요?!\""
1008705-104 = "[wa:150]― [log=아코 드레스]선생님! [wa:900]어떻게든 해주세요![/log]"
1008705-107 = "― [log=아코 드레스]저에게 큰일이 나기 전에 [wa:1900]빨리![/log]"
1008705-110 = "[ns3] 아코의 찢어진 드레스를 수습하다가, 익숙한 것이 눈에 띄었다.\n[ns4] \"………………이건.\""
1008705-111 = "[wa:200]― [log=아코 드레스]응? [wa:950]뭐, [wa:650]뭔가요? [wa:750]그 표정은?[/log]"
1008705-112 = "[wa:200]― [log=아코 드레스]응? [wa:950]뭐, [wa:650]뭔가요? [wa:750]그 표정은?[/log]"
1008705-115 = "― [log=아코 드레스]……어어?[/log]"
1008705-118 = "― [log=아코 드레스]뭐, [wa:600]뭔가요?[/log]"
1008705-120 = "― [log=아코 드레스]대체 뭘 발견하신 거죠……?[/log]"
1008705-123 = "[ns] \"……반품한다고 그러지 않았어?\""
1008705-124 = "[wa:250]― [log=아코 드레스]그, [wa:700]그것은, [wa:650]그……[/log]"
1008705-126 = "― [log=아코 드레스]반품에는, [wa:950]여러 가지 [wa:450]수고가 드는 법이니까…….[/log]"
1008705-129 = "― [log=아코 드레스]그…… [wa:2000]선도부 일이 바쁘다 보니,[/log]"
1008705-131 = "― [log=아코 드레스]시간이 [wa:400]없었다고나 할까…….[/log]"
1008705-134 = "― [log=아코 드레스]아무튼 그런 거니까![/log]"
1008705-136 = "[wa:100]― [log=아코 드레스]그냥 그런 걸로 해둬요![/log]"
1008705-139 = "(어찌저찌 간신히 수습에는 성공해서, 곤란한 상황은 해결할 수 있었다.)"
1008705-140 = "(이래저래 침울해진 아코를 게헨나까지 바래다주고, 샬레로 돌아왔다.)"
