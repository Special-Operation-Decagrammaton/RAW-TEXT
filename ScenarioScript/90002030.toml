[translation]
90002030-1 = "제3화;출격"
90002030-2 = "그러면, 상황을 정리해 보도록 하자."
90002030-3 = "알아낸 사실이 한 가지 있고, 해결해야 할 문제가 한 가지 있어요. 어느 쪽부터 할까요?"
90002030-5 = "보통 해결해야 '할' 문제는 부담스럽기 마련이니, 알아낸 사실부터 이야기해 보죠."
90002030-7 = "우선 확실하게 알아낸 것은, 티페레트의 종자 보관소와 이곳에서 우리를 습격해 왔던, 데카그라마톤의 신규 병종에 대한 것이야."
90002030-8 = "네. 우선 그 병종의 모델명은, [ruby=Labor]레이버[/ruby]라고 하는 것 같아요."
90002030-10 = "레이… 버?"
90002030-15 = "작업자라는 뜻이야. 이 병종 모델의 역할에 비추어 보면, 어울리는 이름이라고도 할 수 있겠지."
90002030-16 = "레이버의 종류에는, 적어도 지금까지 우리가 알게 된 정보만으로 한정한다면, 최대 3종류가 있는 것으로 보여요."
90002030-17 = "응 현장에서도 느꼈어. 우선 겉을 장갑으로 단단하게 두른, 직육면체 모양의 모델이 있었지."
90002030-18 = "맞습니다! 엄청나게 튼튼했습니다!"
90002030-19 = "직관적으로 그 모델은 방어형 레이버라고 이름 붙여도 좋을 것 같군요."
90002030-20 = "다음으로는, 방어형 레이버에 비해서는 장갑의 강도가 낮지만, 한눈에 알 수 있을 만큼 커다란 포탑을 장착한 모델이 있었어."
90002030-22 = "디자인적인 측면에서는 아쉽기는 하지만…… 그건 포탑형 레이버라고 부를 수 있겠네요."
90002030-23 = "그, 그리고…… 아마 제가 보기에는, 나머지 두 모델의 원형처럼 보이는 상대적으로 조그마한 레이버가 있었어요……."
90002030-25 = "원형처럼 보인다는 측면에서, 그 모델을 기본형이라고 부르도록 하죠."
90002030-26 = "……보통 작다고 하면 귀엽게 보이는 부수 효과가 있기 마련인데, 이건 어떻게 봐도 거미처럼 생겨서 그런지 그런 느낌은 들지 않네요……."
90002030-27 = "거미는 귀엽지 않다는 느낌인 거야?"
90002030-28 = "보통은 그래요. 물론 당신의 미적 감각은 어딘가 독특하긴 하고, 미학이란 건 기본적으로 주관의 영역에 속하는 부분이기도 한데……."
90002030-30 = "자, 자. 그 부분은 넘어가자. 부장, 회장."
90002030-31 = "[s] \"또 알아낸 건 없어?\""
90002030-35 = "……있어. 그리고, 어쩌면 이게 가장 중요한 부분일 거야."
90002030-36 = "그 레이버들은, 기본적으로 주위의 무기물을 강철대륙의 구성 성분으로 변화시킬 수 있어."
90002030-37 = "그렇다는 것은……?"
90002030-38 = "어? 그러면 그 녀석들이 처음부터, 이 강철대륙인가 뭔가 하는 걸 넓혀 가고 있었단 소리야?"
90002030-39 = "처음부터 그랬던 것은 아니었을 거예요."
90002030-40 = "레이버들이 양산되기 시작한 시기는, 강철대륙의 기본적인 구조와 크기가 구축된 다음부터였을 테니까요."
90002030-41 = "다만 레이버들이 우리의 수송선에 접근한 이유 자체는, 이 수송선을 자기들 강철대륙의 일부로 만들기 위해서였을 가능성이 높지만요."
90002030-42 = "모든 레이버들의 구축 기록을 살펴본 것도 아니고, 애초에 그렇게 하는 게 불가능한 일이기도 하지만."
90002030-43 = "가능한 부분까지 조사한 결과, 레이버들은 지금 급속도로 넓어진 강철대륙의 내부 구조를 재정비하고 있는 것으로 보여."
90002030-44 = "재정비라고 하면…… 어떤……?"
90002030-45 = "가령 구조물을 건축한다든가, 손상된 부분을 수리한다든가."
90002030-46 = "그리고 강철대륙의 확장 과정에서 유입된 무기물에, 동화작용을 실시한다든가."
90002030-47 = "아, 그래서 우리의 수송선을……."
90002030-49 = "하나는 알았어. 그러면 해결해야 할 문제란 건 뭐야, 부장?"
90002030-50 = "그 부분은, 이야기를 꺼내는 것만이라면 간단하겠네요."
90002030-54 = "바로, 예소드를 돌파하는 일이죠."
90002030-55 = "[s] \"…….\""
90002030-56 = "지금까지 알아낸 아홉 번째 예언자 예소드에 대한 정보를, 우선 정리하도록 할게."
90002030-57 = "특이하게도 예소드에게는, 원형이 되는 형상이 없어."
90002030-58 = "그건 어떤 의미입니까, 리오 님?"
90002030-59 = "가령 호드는, 밀레니엄 사이언스 스쿨의 통신망 가설 유닛인 <허브hub>였지."
90002030-60 = "호크마는 공작선이었고, 게부라는 무인 탐사기였어."
90002030-61 = "그런 식으로 예언자들은, 기존에 존재하던 AI 시스템 기반의 구조체가, AI째로 데카그라마톤에 의해 해킹되는 것으로 만들어지곤 했어."
90002030-62 = "유일한 예외라고 볼 수 있는 것이 비나 정도이겠지만…… 비나의 최초 목격 기록은 수십 년 전 아비도스 사막이었으니."
90002030-63 = "하지만 예소드는 그렇지 않다는 말이군요, 리오."
90002030-64 = "그래. 이건 내 추측 같은 것이지만……."
90002030-65 = "예소드는 아마도, 강철대륙이 어느 정도 구축된 이후 그 기반 위에서 비로소 만들어진 예언자였을 거야."
90002030-68 = "그게 아니라면, 우리가 저렇게나 거대한 예소드의 신호를 지금까지 파악하지 못했을 리가 없었을 테니까."
90002030-69 = "네. 그건 타당한 추론이라고 보여요."
90002030-71 = "그렇다는 것은, 예소드는 다른 예언자들처럼 어떤 구조체에 덧씌워지거나 원형을 가질 필요 없이."
90002030-72 = "순수하게 목적성을 가지고 만들어진, '최적화'된 예언자라는 뜻도 되겠군요?"
90002030-73 = "……아마도."
90002030-74 = "그 말도 안 되는 크기와 위력 역시, 그 최적화의 결과물이겠지."
90002030-76 = "……어째 이야기를 하면 할수록, 답이 없다는 결론으로 가까워지고 있는 것 같은데 말이죠……."
90002030-77 = "아, 아닙니다! 아리스는…… 우리는! 분명 할 수 있습니다!"
90002030-78 = "요, 용사는…… 모험을 떠나기 전부터 겁을 먹어서는 안 됩니다……. 끄앙!"
90002030-79 = "[s] (이미 살짝 겁먹고 있는 것 같기도 하지만…….)"
90002030-81 = "하지만 강철대륙에서 만들어졌기 때문에, 그나마 다행인 부분도 있는 것 같네."
90002030-82 = "그게 뭔가요, 에이미 씨?"
90002030-83 = "저거, 저 방벽 위에 고정된 채 움직이지 못하는 것으로 보이잖아?"
90002030-84 = "네, 네에……. 게임에서도, 초거대 보스는 함부로 자리를 옮기지 못하곤…… 하죠……."
90002030-85 = "……모든 걸 게임으로 비유할 생각은 아니었는데 말야……."
90002030-87 = "후후. 하지만 유즈가 날카로운 부분을 짚어 준 것인지도 모르죠."
90002030-88 = "아무리 데카그라마톤의 예언자나 최적화된 구조체라도, 질량을 가지고 실체화된 이상, 피할 수 없는 것이 있으니까요."
90002030-89 = "피할 수 없는 것……?"
90002030-90 = "그렇구나. 속도와 내구도의 문제겠네."
90002030-91 = "그래요. 거대한 질량을 움직이기 위해서는, 그만한 에너지가 필요하죠."
90002030-92 = "출력을 과도하게 집중시켜 거대 질량체를 빠르게 움직일 수도 있겠지만, 이 경우에는 내구도에 한계가 생길 것이고요."
90002030-93 = "물론 이 강철대륙을 이루고 있는, 수수께끼의 물질들의 강도나 경도, 내구도에 대해서 우리가 정확히 알고 있지는 못하지만."
90002030-94 = "그렇다고는 해도, 질량을 가지고 실체화된 이상, 무한의 내구도를 가지는 건 불가능한 일이니까요."
90002030-95 = "[s] \"그렇다는 것은……?\""
90002030-96 = "네. 이런 거죠, 선생님."
90002030-97 = "예소드의 공격에는, 거대 질량체로서 갖는 움직임의 제약이 있을 것이라는 거예요."
90002030-98 = "그 사실에 입각해서 작전을 설립해 보자면……."
90002030-99 = "……양동 작전이겠네."
90002030-100 = "그래요. 뭐, 당신이라면…… 당연히 이 정도 흐름은 따라와야 하겠지요."
90002030-101 = "예소드의 공격, 더 정확히는 그 팔을 휘둘러서 가해지는 공격은…… 분명 치명적이고 강력하겠지만."
90002030-102 = "필연적으로, 상대적인 느림과 둔중함을 갖게 될 거예요."
90002030-103 = "우리 중 충분히 민첩하고 현장 대응이 가능한 사람이 있다면, 그 공격을 한 두 번 정도는 피할 수도 있다는 소리지."
90002030-104 = "근본적으로 그 엄청난 크기 때문에 생겨나는 한계 역시 존재하겠습니다만."
90002030-105 = "적어도, 예소드의 시선을 어느 정도 돌리는 데에는 문제가 없겠죠."
90002030-106 = "그리고 그사이에 우리는 수송선으로……."
90002030-107 = "방벽 위로의 강습 작전을, 결행할 겁니다."
90002030-113 = "마치 나 같은 제안을 하는구나, 히마리……."
90002030-114 = "……예전의 당신이라면, 누구보다 먼저 이 방안을 독선적으로 강행했겠죠."
90002030-115 = "지금의 너는, 이런 방안을 먼저 제시할 정도로……."
90002030-116 = "……아니, 아니구나. 그만큼 우리가 내몰려 있다는 뜻에 더 가깝겠네."
90002030-117 = "……시간이 없어요, 리오."
90002030-118 = "그래……. 그렇지."
90002030-119 = "[s1] \"잠깐만, 다들 조금 기다려 줘.\"\n[s2] \"내가 따라가고 있지 못한 것 같아서, 다시 물어보겠는데…….\""
90002030-122 = "……."
90002030-123 = "맞아, 선생."
90002030-124 = "이건, 누군가가 미끼가 된 사이에 예소드를 쓰러트려야 한다는, 그런 이야기야."
90002030-125 = "심지어 그 미끼의 안전을 보장할 수도 없고, 우리가 예소드를 반드시 쓰러트릴 수 있다는 확신도 없지."
90002030-126 = "누군가를 사지로 내모는 작전이 될 가능성이 높은…… 그런, 방안인 거야."
90002030-127 = "[s3] \"나는…… 찬성하기 어려울 것 같아.\"\n[s4] \"너희들의…… 선생님으로서.\""
90002030-130 = "하지만 나와 히마리는, 이 방안 말고는 내세울 수단이 없어."
90002030-132 = "그, 그러면……! 이번에도 아리스가……!"
90002030-133 = "……."
90002030-135 = "너는 안 돼. 아리스."
90002030-136 = "어, 어째서인가요? 아리스는 견습이지만 용사니까, 손에 닿는 모두를……!"
90002030-137 = "바로 그렇기 때문이야. 네가 용사니까."
90002030-138 = "네가, 아마도 우리의 비장의 수단이 될 수 있을 테니까."
90002030-139 = "……그 말은, 저 역시 그 수단에 포함될 것이라는 뜻이겠네요?"
90002030-140 = "……그래. 그 말이 맞아."
90002030-141 = "여전히 차가운 듯이 보이려고 노력하는군요, 리오."
90002030-142 = "……익숙하니까. 이런 일."
90002030-143 = "전 당신의 그런 점이 싫어요."
90002030-147 = "정말이지 참을 수 없을 만큼…… 화가 난다고요……!"
90002030-148 = "케이는 언제나 화를 내고 있지 않았습니까?"
90002030-149 = "그것도 맞긴 한데…… 아, 진짜! 그런 뜻이 아니잖습니까!"
90002030-150 = "불도 뜨겁고 마그마도 뜨겁지만! 마그마가 아무튼 더 뜨거운 법이잖아요! 왜 불 난 데 맨틀을 퍼다가 끼얹는 거냐구요!!!"
90002030-151 = "[s] \"정말로…… 다른 방법은 없는 거야?\""
90002030-153 = "……."
90002030-154 = "……."
90002030-155 = "(분위기가 돌연 무겁게 내려앉았다.)"
90002030-156 = "(그러는 사이에도, 시간은 그저 일정하게 흐르고만 있었다…….)"
90002030-161 = "그러면, 내가 다녀올게."
90002030-165 = "[ns] \"?!\""
90002030-166 = "어, 어어? 에이미?!"
90002030-171 = "응. 그러니까, 시선과 시간을 잘 끄면 되는 거지?"
90002030-173 = "그, 그건 조금……!"
90002030-174 = "마, 맞아요! 에이미 씨! 선생님께서도 걱정하셨지만……!"
90002030-176 = "괜찮아. 이게 제일 효율적이야. '아마도'나 '어쩌면' 같은 수식어를 붙일 필요가 없을 만큼, 명확하게."
90002030-177 = "어차피 현장은 익숙하고, 나, 제법 튼튼하고 빠르니까."
90002030-178 = "하, 하지만……! 만에 하나, 잘못되기라도 하면……!"
90002030-179 = "[s5] \"한 번만 더 생각해 줘, 에이미……!\"\n[s6] \"나는…… 너희들이 다치는 걸 보고 싶지 않아……!\""
90002030-182 = "……."
90002030-190 = "?!"
90002030-191 = "?!"
90002030-192 = "(에이미가, 조용히 다가와 안겼다.)"
90002030-193 = "[s] \"에, 에이미……?\""
90002030-196 = "역시 선생님의 몸, 미지근해서 좋네."
90002030-197 = "괜찮아, 선생님."
90002030-198 = "[s] \"하지만……!\""
90002030-199 = "응. 무슨 말인지 알아."
90002030-200 = "하지만 그래도, 나는 괜찮아."
90002030-201 = "정말로 우리들을 생각해 준다면, 이번에는 우리들을 믿어 줘."
90002030-202 = "선생님이 학생을 돕는 것이 당연하다면, 학생이 선생님을 돕고 싶어 하는 것도 당연한 일이니까."
90002030-203 = "그러다 만에 하나 내가 크게 다치게 되면."
90002030-204 = "그때는 실컷 선생님을 원망할 테니까, 평생 책임져 줘."
90002030-205 = "그러면, 다녀올게."
90002030-210 = "[ns] \"에이미!\""
90002030-213 = "……모두, 움직이죠."
90002030-214 = "그래. 바로 시작하자."
90002030-215 = "에이미가 안전하게 돌아오게 하려면, 우리부터 먼저 각오를 해야 해."
90002030-216 = "그렇지, 선생?"
90002030-217 = "[s] \"……무엇부터 해야 하는지, 이야기해 줘.\""
90002030-224 = "[ns] \"그러면, 각자 위치로.\""
90002030-225 = "엔진 수리 현황 보고합니다. 현재 긴급 이륙 및 긴급 착륙 모두 가능한 상태입니다."
90002030-226 = "그러면 저는 지금부터, 격납고로 이동해 강하 준비에 들어가겠습니다."
90002030-228 = "네! 아리스도 토키와 함께 가겠습니다!"
90002030-229 = "히. 힘낼게요……!"
90002030-231 = "뒤를 부탁할게, 히마리."
90002030-232 = "……토키와 아리스는, 우리의 최대 전력이자 히든카드고."
90002030-233 = "유즈는 의외로 이런 임무에서, 뜻밖의 활약을 보일 가능성이 있다고는 하지만……."
90002030-234 = "당신이 직접 가는 게 맞는 건가요, 리오?"
90002030-235 = "……현장에도, 전술 통제관은 필요해."
90002030-236 = "그것이 당신의 책임감이나, 부채 의식에 기반한 감정적인 행동은 아니고요?"
90002030-237 = "…………다녀올게."
90002030-244 = "하아…… 어쩔 수 없죠. 저 말이에요. 요새 뭔가, 사람 복이 점점 줄어들고 있는 것 같지 않으세요, 선생님?"
90002030-245 = "[s] \"어…… 내가 있는 걸로, 안 될까?\""
90002030-246 = "후훗. 그 말씀을 듣고 보니, 아직 최고의 행운이 제 곁에 남아 있는 것 같네요."
90002030-247 = "드랍 포드 준비 완료입니다. 언제든 강하 가능해요."
90002030-248 = "그러면, 선생님?"
90002030-249 = "[s] \"최전선 지휘관의 판단에 따라, 자의적으로 출격.\""
90002030-250 = "격납고, 들리나요? 상황은 어떻죠?"
90002030-256 = "지금 막 격납고에 도착했음을 보고드립니다. 드랍 포드에 탑승하겠습니다."
90002030-257 = "아리스. 절차는 알고 있죠?"
90002030-259 = "네! 아리스, 확실하게 숙지했습니다!"
90002030-260 = "어…… 그런데, 뭐부터 해야 했었죠……?"
90002030-261 = "내, 내가 도와줄게, 아리스 쨩……. 이런 건 일종의…… 게임 매뉴얼, 같은 거니까……."
90002030-263 = "그러면 아리스를 부탁하겠습니다. 유즈."
90002030-266 = "강하 준비 완료. 언제든 시작해도 좋아, 히마리."
90002030-267 = "그러면."
90002030-268 = "수송선을, 위치로 출격시키도록 하죠."
90002030-278 = "정말, 말도 안 되는 크기네."
90002030-279 = "그러면 너무 겁먹지 말고, 긴장하지 말고."
90002030-280 = "효율적으로 가 볼까."
90002030-281 = "우선은–"
90002030-293 = "–주둔 병력부터."
