[translation]
10032075-7 = "이, 일단 빠져나왔나……?"
10032075-8 = "어떻게든 그런 것 같네. 여기도 물론 시간문제인 것 같지만……."
10032075-9 = "……어라. 여기……."
10032075-10 = "음? 하루카. 왜 그래?"
10032075-11 = "아, 아닙니다. 아무것도 아니에요! 하등 쓸모없는 이야기였습니다……."
10032075-13 = "여기까지 왔으면 이제 안심인가……. 늦지 않게 흩어져서 돌아가면 될 것 같다."
10032075-14 = "……뭐라고 감사의 인사를 해야 할지 모르겠군, 선생."
10032075-15 = "그리고……."
10032075-16 = "……흥신소 68."
10032075-18 = "후훗. 감사할 필요는 없어. 우린 그저 그 상황의 손익에 맞춰서 행동했을 뿐."
10032075-19 = "딱히 당신을 위해서 한 행동 같은 건 아니니까 말이야."
10032075-21 = "……그렇군."
10032075-22 = "하지만 결국 내 입장에서 도움을 받았다는 사실은 달라지지 않는다."
10032075-23 = "너희들이 도와주지 않았다면 실컷 이용만 당한 채 토사구팽당할 뻔했으니까 말이야."
10032075-24 = "그 대신이라 하기에는 뭐하지만……."
10032075-30 = "……이건……?"
10032075-32 = "답례다. 어차피 내 계약은 파기된 것이나 다름없어 보이니."
10032075-33 = "대신 이쪽에서 도움받은 것에 대한 대가라도 지불 해야지. 그것이 이 세계의 룰이라 들었거든."
10032075-34 = "장기적으로……."
10032075-35 = "……계산에 맞는 행동으로서. 말이지."
10032075-36 = "……오……."
10032075-37 = "같은 말인데도 어딘가 느낌이 다르네~."
10032075-38 = "아, 아니, 그렇다 해도 이렇게 무슨 선물 보따리 주듯이……."
10032075-39 = "어라? 정말로 이렇게 그냥 줘 버리는 거야? 그러면……."
10032075-40 = "이제 이건 우리 거?"
10032075-41 = "설마……!"
10032075-42 = "설마 의뢰를 완수한 거야!? 우리!?"
10032075-44 = "설마라니……."
10032075-46 = "저희의 의뢰……! 설마 여기서 이렇게 완성될 줄은……!!"
10032075-47 = "여, 역시 아루님이시군요! 처음부터 다 여기까지 보시고……!!"
10032075-51 = "……아?"
10032075-52 = "응? 뭐라고……? 그게 무슨……."
10032075-54 = "……!"
10032075-55 = "그, 그런 건가……!"
10032075-56 = "과연……. 그래서 처음부터 나에게 접근하고 도와줬던 건가."
10032075-57 = "정말 대단하군. 또 한 가지 배웠다. 잊지 않도록 하지."
10032075-58 = "[s1] \"그게 그렇게 되나…….\"\n[s2] \"뭐, 좋은 게 좋은 걸로…….\""
10032075-61 = "후, 후후……. 좋아. 당연하지. 이 정도는 보통이라고."
10032075-62 = "그러면 서로 간의 짧았던 동맹과 합의도 이걸로 잘 끝났고."
10032075-63 = "이제 그쪽과 우리 모두 각자 갈 길을……."
10032075-64 = "찾았다!! 여기 있다!!"
10032075-69 = "이 자식들. 잘도 숨어들었구나. 하지만 어림없어!!"
10032075-70 = "모두 모여! 이번에야말로 돈 아란치노를 되찾는다!!"
10032075-72 = "……쯧. 생각보다 빨리 쫓아왔네."
10032075-73 = "도망칠 길은 있으니 문제 될 건 없지만, 일단 대응은 하면서 빠져야겠어."
10032075-75 = "협력하지. 우선 더 쫓아오지 못하도록 길 막을 것을……."
10032075-80 = "……마침 좋은 걸 찾았다."
10032075-86 = "훌륭하군. 철제 대형 쓰레기통인가."
10032075-87 = "마침 내부도 뭔가로 꽉 차서 무거운 것이, 엄폐로도 좋고 장애물로도 좋겠어."
10032075-89 = "……?"
10032075-90 = "어라……."
10032075-91 = "…………아."
10032075-92 = "……!?!?!"
10032075-93 = "[s3] \"하루카? 왜 그래?\"\n[s4] \"갑자기 사색이 됐어……?\""
10032075-96 = "아, 아뇨! 그게……! 그……!"
10032075-97 = "[s5] \"그게……?\"\n[s6] \"그……?\""
10032075-100 = "그, 그……."
10032075-101 = "그 쓰레기통은……!!"
10032075-107 = "……이런! 벌써 공격이 시작되는군."
10032075-113 = "보스가 걸린 일이라 그런지 주저함이 없네. 벌써 코앞까지 접근했어."
10032075-114 = "자, 이 틈에 어서 빠지자고!"
10032075-115 = "그, 그러니까……! 쓰레기통이……!"
10032075-116 = "……하루카? 왜 그래?"
10032075-117 = "쓰레기통이 왜……?"
10032075-118 = "그……. 제, 제가……."
10032075-119 = "제가 아까……. 회수한 폭탄들을 전부 저 안에……."
10032075-120 = "넣어 두었……는……데요……."
10032075-121 = "안에 든 건 전부……. 폭발물……."
10032075-122 = "……안에 든 거?"
10032075-123 = "회수한 폭탄들……이라니?"
10032075-129 = "처음에 오페라 하우스 한 바퀴 돌면서 뺏은 폭탄들 이야기하는 거 아냐? 쓰레기통에 버렸다고 했잖아."
10032075-133 = "……아하!"
10032075-134 = "맞네, 이제야 기억이 났어! 그랬었지, 참."
10032075-135 = "……잠깐만."
10032075-136 = "그럼 우리는 그걸 지금 총탄 엄폐물로 쓰고 있는 거야?"
10032075-138 = "……응? 무슨 이야기지?"
10032075-145 = "아. 유탄이……."
10032075-147 = "날아온다!"
10032075-151 = "[ns] \"……오.\""
10032075-156 = "[ns] \"이게 이렇게 되네.\""
