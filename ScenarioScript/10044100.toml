[translation]
10044100-1 = "제10화;알 수 없는 세계에서 소녀는 웃는다"
10044100-3 = "크윽……!! 이, 이 꼬맹이들이~~!"
10044100-4 = "초, 총장……! 망한 것 같은데요!"
10044100-5 = "우, 우리의 야망이 눈앞이거늘……!!"
10044100-7 = "크큭…… 이거, 이거. 아주 성대하게 저질러 주셨군요."
10044100-10 = "이, 이 목소리는……?"
10044100-16 = "하이랜더 철도학원 여러분, 수고하셨습니다."
10044100-17 = "크큭, 아무래도 예상치 못한 문제가 있었나 봅니다?"
10044100-18 = "크윽, 의뢰인……! 도착해 있었나……!!"
10044100-20 = "[ns] \"아……\""
10044100-22 = "저, 저 사람이 의뢰인……?"
10044100-23 = "이야, 화물 그냥 바로 인계해버리면 되겠다."
10044100-24 = "아니, 아니! 완전 악당 같은데요!! 괜찮은 걸까요?!"
10044100-25 = "일단 임무는 끝내야지-"
10044100-27 = "크크…… 화물을 모두 확인하고 오는 길입니다."
10044100-28 = "열차는 엉망이 되었지만, 놀랍게도 물건에는 이상이 없군요."
10044100-29 = "아아- 하이랜더의 여러분에게 맡기기를 정말 잘했습니다. 그렇지 않나요?"
10044100-30 = "우리는 맡은 임무에 최선을 다하니까. 당연한 거라고."
10044100-31 = "크큭, 그럴 거라 생각했습니다……"
10044100-32 = "자, 이 화물 인계서에 서로 사인만 하면 모든 일이 끝납니다."
10044100-33 = "여러분은 임무를 마무리하고, 저는 이 물건들을 온.전.히. 양도받게 되겠죠."
10044100-34 = "어서, 사인을 해주십시오. 크큭……"
10044100-36 = "해도 되나요?! 진짜로? 넘겨도 될까요??"
10044100-41 = "끝-"
10044100-42 = "임무 완료~!"
10044100-44 = "큭, 크크큭…… 크하핫!!"
10044100-45 = "기쁘기 그지없군요. 이 순간을 얼마나 기다려 왔던지……!!"
10044100-46 = "우우…… 서, 선생님…… 이거 맞는 걸까요……"
10044100-47 = "부, 불안한데요……!"
10044100-48 = "이야, 큭큭큭…… 그러고 보니 선생님도 계셨군요. 인사가 늦어 매우 송구합니다."
10044100-49 = "그간 샬레에 제법 신세 진 것들이 있어서, 어떻게 갚아드려야 할지? 크큭!!"
10044100-50 = "으, 으으……"
10044100-51 = "[ns] \"저도 반갑습니다. 여기서 뵐 줄이야.\""
10044100-55 = "엑?"
10044100-57 = "서, 선생님? 원래 아는 분이세요?"
10044100-58 = "[s1] \"응. 사회복지 쪽으로 유명한 사업가셔.\"\n[s2] \"학생들에게도 장학금을 아끼지 않으시지.\""
10044100-64 = "……예??"
10044100-66 = "크크, 과찬입니다. 그저 자그만 사업체 몇 개 운영하고 있지요……"
10044100-67 = "학생들에게 도움이 된다면 그걸로 만족할 뿐입니다. 크큭……!!"
10044100-68 = "아, 아니! 왜 그렇게 악당처럼 말하는 거예요?! 헷갈렸잖아요!!"
10044100-69 = "의외로 그런 이야기를 종종 듣습니다만……"
10044100-70 = "어디가 악당스럽다는 건지 도통 모르겠단 말이죠? 크하핫!"
10044100-71 = "그, 그런 부분이……!!"
10044100-72 = "아무튼, 학생들이 참 대견하군요."
10044100-73 = "최선을 다해 이 화물을 운송해 준 것 같아서 말입니다. 후후."
10044100-74 = "서둘러 주신 덕분에 중요한 행사의 준비가 무사히 마무리되겠군요……"
10044100-75 = "아, 궁금했던 건데. 이 귀중품들을 어디에 쓰려고 했던 거야?"
10044100-76 = "크큭, 꽤 구미가 당기는 일을 한번 해볼까 하고 말입니다."
10044100-77 = "자선 경매, 라고 들어보셨는지?"
10044100-78 = "몰라-"
10044100-79 = "자선 행사를 목적으로 개최되는 귀중품 경매입니다."
10044100-80 = "보통 이런 고가의 미술품이나 귀중품은 돈 많은 자산가들이 아주 애호하는 상품이거든요. 훗, 훗훗."
10044100-81 = "그만큼 돈 내겠다는 사람들을 모으기가 수월해진답니다."
10044100-82 = "그렇게 모인 경매 수익금은 공정한 과정을 거쳐 불우한 학생들에게 돌아가게 될 예정이고요."
10044100-83 = "자본의 사회 환원도 겸하고, 개최자인 제게는 절세 수단으로도 의미가 있지요."
10044100-84 = "크큭, 생각대로 이루어진다면 그야말로 굉장하겠죠!! 크하핫!!"
10044100-86 = "그 말투만 좀 어떻게 안 되냐구요!! 의도는 좋은데!"
10044100-88 = "그리고 전국 트랜스포터 연맹…… 줄여서 부릉부릉질주연합의 여러분."
10044100-89 = "와, 저걸 그대로 다 불러주네."
10044100-90 = "으윽……"
10044100-91 = "그간 여러분과 적지 않은 거래를 해왔지만, 이렇게 문제를 일으켜서야."
10044100-92 = "우리의 신뢰 관계를 다시 한번 재고해 볼 필요가 있겠군요. 크큭……"
10044100-93 = "그, 그건……! 먼저 우리와의 신뢰를 깬 건 당신이잖아!"
10044100-94 = "애초에 이 화물 운송도 우리 일감이었는데, 어째서 갑자기 하이랜더에게 넘겨준 거냐고! 납득할 수 없었어!"
10044100-95 = "그야, 그 전날 당신에게 배달을 맡긴 고급 초밥 세트가 난폭운전으로 인해 배달통 안에서 완전히 뒤섞여버렸으니……"
10044100-96 = "저는 초밥이 땡긴 거지, 카이센동을 먹고 싶었던 게 아니란 말입니다."
10044100-98 = "와, 그건 심했는데."
10044100-100 = "크윽…… 그, 그건……"
10044100-101 = "그런 분들에게 고가의 귀중품을 맡길 수는 없는 노릇이지 않겠습니까?"
10044100-102 = "하, 하지만 우리는 빠르다고! 그것도 엄청나게!"
10044100-103 = "물론, 잘 알고 있습니다."
10044100-104 = "크큭…… 그 장점을 살릴 수 있는 건수를 천천히 생각해 보지요."
10044100-105 = "저, 정말?"
10044100-106 = "단! 오늘 하이랜더뿐만 아니라 샬레의 선생, 그리고 제게 발생한 유형무형의 손해에 책임을 진 다음입니다."
10044100-107 = "소, 속죄를 하면 다시 한번 기회를 준다는 건가……"
10044100-111 = "……알겠다. 최대한 배상하지……"
10044100-112 = "그리고 우리는 초심으로 돌아가겠어."
10044100-113 = "이번에야말로, 전문 배달원으로서 성실하게 일해볼 테니까."
10044100-115 = "초, 총장……"
10044100-117 = "……꿈을 포기한 게 아냐. 천천히 올라가는 거다."
10044100-118 = "너희와 함께라면, 가능할 거라고 믿고 있어."
10044100-120 = "총장……"
10044100-122 = "뭐, 뭘 감동적인 순간처럼 비장하게 말하는 거예요!! 완전 민폐 끼친 주제에……!"
10044100-123 = "큭……!"
10044100-124 = "그, 그렇지. 배상의 의미로 일주일 배달비 무료 쿠폰을 주마……!"
10044100-125 = "피, 필요 없다구요!"
10044100-126 = "두 장! 두 장 줄 테니……"
10044100-128 = "아, 드디어 임무 완료네."
10044100-129 = "졸려- 피곤해-"
10044100-131 = "[ns] \"모두 정말 고생 많았어.\""
10044100-132 = "선생님도 고생했어- 착하다-"
10044100-133 = "파햐햐, 정신없었네! 그래도 선생님 덕분에 꽤 재밌었다구?"
10044100-134 = "다음에 또 불러도 되지? 응?"
10044100-136 = "여, 염치가 좀 있어 보세요…… 이 난리를 쳐놓고 또?"
10044100-137 = "[ns3] \"언제든 달려갈게.\"\n[ns4] \"학생의 부름에 응답하는 게 선생님이잖아.\""
10044100-140 = "……엑……"
10044100-144 = "그, 그럼……"
10044100-145 = "제, 제가 불러도…… 와주실 건가요……?"
10044100-146 = "[s] \"당연하지, 아오바.\""
10044100-147 = "……"
10044100-148 = "……하아, 진짜. 처음 보는 유형이네요. 선생님은……"
10044100-149 = "괜히 또 기대하게 만들지 마시라고요……"
10044100-150 = "아, 맞다. 임무 보고서 써야 해."
10044100-151 = "서류 노잼- 도와줘, 선생님-"
10044100-152 = "[s] \"좀 봐주라……\""
10044100-153 = "이참에 샬레에서 신세 좀 질까? 어때?"
10044100-154 = "파햐햐! 재밌을 것 같지 않아? 가자, 히카리!"
10044100-155 = "응- 출동-"
10044100-157 = "이, 이대로 가시는 건가요? 임무는 끝난 거죠……?"
10044100-158 = "끝났지! 화물도 제대로 인계했고."
10044100-160 = "휴우…… 정말 긴 하루였네요."
10044100-161 = "……간부님들도 고생 많으셨어요. 사, 살다가 간부님들이랑 같이 이런 일을 겪게 될 줄은 몰랐는데……"
10044100-162 = "……생각보다 책임감이나 직업관이 있으셔서, 조금 놀라기도 했구요……"
10044100-163 = "뭐라고-? 더 크게 말해줘-"
10044100-164 = "으으! 다 들었으면서……!"
10044100-165 = "아무튼, 이상한 간부도 많지만요! 또 생각만큼 그렇게 이상하지는 않을 수 있다…… 뭐, 그런 거 배웠으니까요!"
10044100-166 = "칭찬 맞지? 욕인가?"
10044100-167 = "칭, 칭찬이에요……! 나름!"
10044100-168 = "파햐햐, 뭐! 그렇다면 그런 거겠지!"
10044100-169 = "아오바도 오늘 멋있었어-"
10044100-170 = "마찰 계수 오버드라이브- 다음에 또 하자-"
10044100-171 = "다, 다시는 하고 싶지 않은데요……"
10044100-172 = "아무튼, 그럼 저는 숙소로 돌아가 볼게요…… 간부님들, 선생님 조심히 가세요."
10044100-177 = "무슨 소리야? 같이 가야지."
10044100-179 = "예, 예?"
10044100-181 = "이렇게 팀이잖아- 선생님까지-"
10044100-183 = "이, 임무 끝났잖아요? 이제 알아서 갈 길 가는 거 아니었어요?"
10044100-184 = "응, 아니야. 끝날 때까지 끝난 게 아니다. 몰라?"
10044100-185 = "무, 무슨 소리를 또……"
10044100-188 = "[ns] \"다 함께 저녁이라도 먹을까?\""
10044100-189 = "괘, 괜찮으신가요? 같이 가도……"
10044100-190 = "'다 함께'라구-?"
10044100-191 = "파햐햐! 가자~! 이것저것 다 시켜도 돼? 엄청 먹는다?"
10044100-192 = "오늘 차비니 뭐니 선생님한테 다 신세 져놓고서……"
10044100-193 = "선생님 찬스- 날이면 날마다 오는 게 아냐-"
10044100-194 = "자, 잠시나마 간부님들을 칭찬했던 제가 바보 같아요……!"
10044100-195 = "[ns] \"아아…… 멋진 노을이야.\""
10044100-198 = "하이랜더 철도 폭주 사건"
