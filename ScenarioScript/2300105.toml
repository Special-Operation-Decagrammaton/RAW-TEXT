[translation]
2300105-1 = "또 장 보러 가요!"
2300105-2 = "저번엔 폐를 끼쳐서 죄송했습니다."
2300105-3 = "[s] \"괜찮아. 날 위해 그런 거잖아.\""
2300105-4 = "후후후……, 선생님은 늘 그렇게 말씀해주시네요."
2300105-5 = "아, 이럴 때가 아니라, 실패를 발판 삼아 오늘은 특별한 걸 대접해드릴까 해요."
2300105-6 = "선생님, 오늘도 같이 장 보러 가주실래요?"
2300105-8 = "3번가 시장"
2300105-10 = "[ns] \"오늘은 뭘 살 거야?\""
2300105-11 = "그때 이후로 저 곰곰이 생각하다 깨달았어요."
2300105-12 = "단순히 음식을 많이 만드는 것만이 정답이 아니란 것을."
2300105-13 = "선생님을 위해서라면 더욱 특별한 요리를 만드는 게 좋지 않을까. 하고 말이죠."
2300105-14 = "오늘은 그걸 위해 특별한 식재료를 살 생각이에요."
2300105-15 = "[s] \"특별한 식재료?\""
2300105-16 = "후후후, 어떤 재료일지는 기대해주세요."
2300105-19 = "[ns] \"여기는 생선 가게?\""
2300105-20 = "어서옵쇼! 오늘도 신선한 물건이 잔뜩 들어왔습니다! 보고 가십셔!"
2300105-21 = "와, 고등어도 싱싱하고, 전갱이도 물이 잔뜩 올랐어요!"
2300105-22 = "선생님! 선생님! 여기 성게알 좀 보세요!"
2300105-23 = "이렇게나 싱싱하다면 바로 밥에 뿌려 먹어도 괜찮을 거 같아요!"
2300105-24 = "[s] \"후우카, 진정해.\""
2300105-25 = "앗, 죄, 죄송해요."
2300105-26 = "이렇게 신선한 재료들을 보면 저도 모르게……."
2300105-27 = "이런 재료들이 나중에 어떤 요리가 될지 상상하는 것만으로도 가슴이 설레서……."
2300105-28 = "아하하……. 역시, 좀 이상하죠?"
2300105-29 = "[s] \"아냐. 후우카다운 걸.\""
2300105-30 = "에헤헤……."
2300105-32 = "앗, 이 임연수어도 구워 먹으면 맛있겠어요."
2300105-33 = "오옷, 그쪽의 아가씨. 보는 눈이 좋은데!"
2300105-34 = "핫핫핫! 새댁의 눈썰미를 보아하니 요리 솜씨도 일품이겠어! 안 그래?"
2300105-35 = "네엣? 새, 새댁이요?"
2300105-36 = "[s1] \"새댁이 아니라, 제가 가르치는 학생입니다.\"\n[s2] \"예, 후우카는 세계 최강의 새댁입니다.\""
2300105-37 = "왓핫핫! 사소한 건 신경 쓰지 말라고!"
2300105-38 = "어쨌거나 챙겨주는 사람이 있다는 건 좋은 일이잖아?"
2300105-39 = "노, 농담하지 말아주세요! 선생님!"
2300105-40 = "그래서 아가씨께선 오늘 무얼 사러 오셨나?"
2300105-41 = "혹시 장어 있나요?"
2300105-42 = "장어? 당연히 있지!"
2300105-43 = "키보토스 최고의 장어를 취급하는 게 바로 우리 가게라고!"
2300105-44 = "[s] \"웬 장어……?\""
2300105-45 = "그 왜, 장어는 기력을 채워주는 스태미나 음식이라고들 하잖아요?"
2300105-46 = "선생님은 밤일 하시느라 매번 밤을 새면서 고생하시니까요."
2300105-47 = "그런 선생님을 위해서 기력에 좋은 장어 요리를 대접해드리자!"
2300105-48 = "그게 제가 할 수 있는 최선이라고 생각했어요."
2300105-49 = "아가씨가 지극정성인걸. 그쪽은 좋겠어."
2300105-50 = "옛다, 기분이다! 내 오늘 우리 가게에서 최고의 장어를 내어주지!"
2300105-51 = "감사합니다!"
2300105-52 = "아, 물론 아무리 최고급 장어라고 해도, 어디까지나 적정 가격으로 구매할 생각이지만요?"
2300105-53 = "이거, 당해낼 수가 없는 걸!"
2300105-54 = "[s] \"잠깐 후우카. 그, 스태미나 음식이라는 건…….\""
2300105-55 = "와앗, 이 장어라면 확실히 맛있는 요리가 가능할 거 같아요!"
2300105-56 = "후후, 어떻게 요리하는 게 좋을까요?"
2300105-57 = "역시 정통파로 장어덮밥? 그냥 구워서 소금만 뿌려 먹어도 맛있을 거예요!"
2300105-58 = "아가씨가 이렇게나 의욕적이라니, 그렇게 잔뜩 먹으면 밤에 쉴 수가 없겠어! 왓핫핫!"
2300105-59 = "그건 안 돼요. 그래도 쉴 때는 쉬어야죠!"
2300105-60 = "첫째도 건강, 둘째도 건강. 선생님, 아시겠죠?"
2300105-61 = "허어! 그런 부분까지 똑 부러지게 챙기다니, 사랑이 뜨겁구먼!"
2300105-62 = "사, 사랑이라니. 그런, 아이참……."
2300105-64 = "(차마 두 사람의 말을 지적하지 못한 채, 장어를 잔뜩 사서 돌아왔다.)"
