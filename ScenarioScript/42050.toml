[translation]
42050-1 = "제5화;선배의 그림자"
42050-3 = "……이게 어떻게 된 일이야? 누가 설명 좀 해줬으면 좋겠는데."
42050-4 = "나는 근처 노드에서 CCTV를 확인하고 있었는데, 갑자기 누가 뒤에서 두건을 씌우더니 나를 강제로 여기로 끌고 왔어……"
42050-6 = "우으으…… 나, 나도 은신 중이었는데 갑자기 누군가 뒤에서 덮쳐와서……"
42050-7 = "눈을 가린 채 뭔가 커다란 통 같은데 던져 넣어진 다음, 데굴데굴 굴려지면서 끌려와서……"
42050-8 = "으으…… 아직도 속이 메슥거려……"
42050-9 = "그나저나 사키, 너는 어째서 여기에 우리랑 같이 묶여 있는 거야? 너는 미야코랑 같이 건물에 돌입한 거 아니었어?"
42050-10 = "……끄응. 그게…… 나도 잘 모르겠어."
42050-11 = "중앙 통로로 돌입하던 중, 갑자기 머리에 큰 충격을 받은 것까지는 기억하는데……"
42050-12 = "정신을 차리고 보니 여기에 너희들이랑 같이 묶여 있네."
42050-13 = "지금 상황이 어떻게 돌아가고 있는지 확신할 수는 없겠지만……"
42050-14 = "……우리, 납치된 거지?"
42050-15 = "쳇…… 너무 방심했어."
42050-16 = "그, 그러고 보니 우리가 기습하려고 했던 상대는, 사람들의 눈을 피해 불법적인 거래를 하는 무기 브로커였었지……?"
42050-17 = "이렇게 우리를 산채로 묶어 한데 붙잡아 두었다는 건…… 분명 어디에 팔아넘길 속셈일 거야……"
42050-18 = "무기 연구 시설에 넘겨서 신무기를 실험하는 데 쓴다든가…… 하늘하늘한 옷을 입혀서 대답할 때마다 강제로 '냥-' 이라는 어미를 붙이게 한다든가……"
42050-20 = "……마지막의 가정은 조금 이상하지 않아?"
42050-21 = "너무 걱정하지 마, 미유. 다른 건 몰라도 미야코가 여기 없다는 건 아직 잡히지 않았다는 뜻이니까."
42050-22 = "조금만 기다리면 분명 우리를 구하러 와 줄 거야."
42050-26 = "다들…… 무사하셨나요?"
42050-27 = "미야코……!"
42050-28 = "미야코 쨩, 구하러 와줬구나……!"
42050-29 = "아, 저 그게…… 그러니까……"
42050-31 = "……저도 붙잡혔어요."
42050-32 = "이걸로 4명째…… 전원 실격인가."
42050-37 = "이게 SRT의 CQB 시험이었더라면 전원 낙제를 면치 못했었겠군."
42050-39 = "저 장비는, 설마……"
42050-40 = "FOX 소대의 선배들……? 어째서 이곳에……"
42050-41 = "뭐, 간단하게 설명하자면— 이 모든 게 후배들을 위해 여우 언니들이 준비한 서프라이즈 파티였다는 뜻이지."
42050-42 = "참나…… 요새 키보토스 곳곳에서 활약했다고 해서 조금이나마 성장했을까 기대했더니, 조금도 성장하지 않았네."
42050-43 = "처음보는 장소에 돌입하는 데 백업도 없이 따로따로 돌입하다니, 저격당하기 딱 좋은 포지션이잖아. 소풍이라도 나온 줄 알아?"
42050-45 = "하하…… 너무 거칠게 몰아세우지 마, 쿠루미 쨩."
42050-46 = "후배들도 이런 상황은 예측하지 못했을 테고, 평범한 용병이나 브로커를 상대하는 거라면 이 정도의 전술 기동만으로도 충분했을 테니까."
42050-47 = "……언제나 예상한 곳에서 예상한 적이 나타나지는 않지. 방심은 금물이야."
42050-48 = "……죄송합니다."
42050-50 = "우, 우선은 간식부터 먹고 시작할까? 이럴 줄 알고 유부초밥을 잔뜩 준비해 왔거든."
42050-51 = "이야기는 우선 배부터 채우고 계속하자."
42050-52 = "우리도 그렇지만, 너희들도…… 하고 싶은 말이 잔뜩 있을 테니까."
42050-53 = "네……."
42050-55 = "(우물우물) 그러니까— 계속 사소한 걸 신경 쓰면서 움직이니까 반응 속도가 느리잖아."
42050-56 = "잘 봐. 아까처럼 주무기의 총구를 돌리기 어려운 협소한 복도에서 적이 다른 방향에서 나타났어. 그럼 어떻게 할 거야?"
42050-57 = "……보조무기로 전환해서 사격한다?"
42050-58 = "교범에서는 보통 그렇게 말하지만, 아까와 같은 상황에서의 정답은 '개머리판으로 그대로 내려친다'야."
42050-59 = "개머리판을 사용하는 편이 무장을 교체하는 것보다 훨씬 빠르게 적에게 일격을 가할 수 있거든. 물론 적이 입고 있는 방호복이나 교전 거리에 따라 답은 달라지겠지만."
42050-61 = "으으…… 교범과 다른 실전 상황은 언제나 골치 아프다니까……"
42050-62 = "그렇게 쉽게 베테랑이 될 수 있을 거라고 생각 했어? 아직 한참 멀었다고. 후후."
42050-66 = "(우물우물) 오, 이 식감은 연어알인가? 연어알의 짭조름한 감칠맛이 생각 외로 유부초밥이랑 잘 어울리는 걸……"
42050-67 = "잠깐! 그거 내가 먹으려고 아껴 둔 건데— 먼저 손대지 마!"
42050-68 = "후배들 앞에서 쪼잔하게 유부초밥 가지고 성내지 마."
42050-69 = "자, 여기 계란 소보로 맛."
42050-70 = "계란은 됐거든? 나도 연어알 먹을 거야!"
42050-72 = "후후…… 유부초밥은 종류별로 충분히 준비해 왔으니까. 싸우지 말고 다들 천천히 먹어."
42050-76 = "자, 미유 쨩도 눈치 보지 말고 먹어."
42050-77 = "저, 저요……? 저 같은 게 이런 호화로운 유부초밥을 먹어도 괜찮을까요……?"
42050-78 = "물론이지. 다 같이 먹으려고 싸 온 거니까."
42050-79 = "가, 감사합니다……"
42050-83 = "……마, 맛있어!"
42050-85 = "아아~ 니코 선배의 유부초밥이라니. 이게 얼마 만에 먹어보는 거야?"
42050-86 = "이렇게 화려한 고명이 잔뜩 들어간 유부초밥은 키보토스 어디에서도 먹을 수 없다니까."
42050-87 = "후후, 아침부터 열심히 밥을 짓느라 고생한 보람이 있네."
42050-88 = "특히 유부를 절일 때 쓴 이 단촛물의 배합은 나만 알고 있는 특급 기밀이거든."
42050-89 = "(어라? 그러고 보니 최근에도 이 유부초밥을 먹었던 것 같은데…… 착각인가……?)"
42050-94 = "저…… 그런데 제가 매복하고 있던 곳은 어떻게 알아차리신 건가요?"
42050-95 = "제 입으로 말씀드리긴 그렇지만…… 제법 잘 숨어 있었다고 생각했는데……"
42050-97 = "아, 네가 미유였구나? 위장 훈련에서 만점을 받았다던 그 화제의 신입생!"
42050-98 = "히, 히이익……"
42050-99 = "정말 소문처럼 완벽한 위장이더라. 어찌나 잘 숨어 있었는지 니코가 좌표를 알려주기 전까지는 눈앞에서도 찾기 어려울 정도였다니까!"
42050-101 = "저, 저기…… 가, 감사합니다…… 그런데 거리가……"
42050-102 = "뭔가 특수 카모플라쥬 장비라도 사용하는 거야? 조준경 배율은?"
42050-103 = "우으, 우으으……"
42050-106 = "여하튼 무기를 사 간 그 브로커들이 FOX 소대의 선배들이었다면 SRT의 무기가 나쁜 일에 쓰이지 않았을까 걱정할 필요는 없겠네."
42050-107 = "그러게. 선배들이 준 돈이라면 돈의 출처를 염려할 필요도 없고……"
42050-111 = "………."
42050-112 = "저, 선배들. 저도 하나 여쭈어도 괜찮을까요?"
42050-113 = "그야 물론이지. 무엇이든 물어보라고."
42050-114 = "……지난번 쿠데타 당시, 선배들이 샬레의 지하실에서 가져간 물건은 무엇이었나요?"
42050-115 = "어, 그건…… 그러니까……"
42050-116 = "……그리고, SRT의 폐쇄가 결정되었을 때. 총학생회 건물은 어째서 습격하신 건가요?"
42050-117 = "그게……"
42050-122 = "아직 너희에게는 알려줄 수 없다."
42050-123 = "……기밀인가요?"
42050-124 = "아니."
42050-125 = "……너희가 '우리'의 아군인지 확신할 수 없기 때문이다."
42050-126 = "잠깐 기다려, 선배. 우리는 같은 SRT 대원이잖아……?"
42050-127 = "어째서 그런 말씀을……"
42050-128 = "그렇다면 질문을 하나 하지."
42050-129 = "지금의 너희는 샬레의 선생님을 적대할 수 있나?"
42050-131 = "………."
42050-135 = "그래. 너희는 판단할 수 없겠지."
42050-137 = "무기는 스스로 판단하지 않아야 그 가치가 있는 법이니까."
42050-139 = "그동안 어려운 작전을 수행하느라 수고가 많았다, 츠키유키 소대장."
42050-140 = "오늘부로 RABBIT 소대는 해체한다. 각 소대원은 이후 FOX 소대의 분견대로서 활동하도록."
42050-141 = "해체……? RABBIT 소대를요……?"
42050-142 = "오해는 하지 않았으면 좋겠는데."
42050-143 = "불이익을 주려는 것이 아니다. 츠키유키 소대장이 보유하고 있는 소대장으로서의 재량권은 존중하지."
42050-144 = "다만…… 갑작스러운 사고로 후배들이 짊어지게 된 책임을 선배들이 다시 가져가겠다는 것뿐이야."
42050-145 = "망설임을 수반하는 괴로운 선택은 우리에게 맡겨 둬."
42050-146 = "하지만…… SRT 학원의 부활을 위해서라면, 저희도 어느 정도는 각오를—"
42050-147 = "오랜 야영으로 인해 소대원들도 많이 지쳤겠지."
42050-148 = "………."
42050-149 = "SRT 학원의 부활을 위해 더 이상 책임을 짊어질 필요는 없다."
42050-150 = "책임은 높은 사람들이 질 테니, 각 소대원들은 무기로서의 본분을 다하도록."
42050-151 = "저희, RABBIT 소대는……"
42050-152 = "자, 츠키유키 소대장. 결정해."
42050-153 = "책임과 판단을 맡기고 무기로서의 본분을 다할 것인지."
42050-154 = "아니면 망설임을 품은 채 녹슨 칼로 정의를 휘두를 것인지."
42050-155 = "저희는……"
42050-157 = "[ns] \"……잠시만 기다려 줘!\""
42050-158 = "……침입자?"
42050-159 = "어떻게 이 장소를 알고……?!"
42050-163 = "……[USERNAME] 선생님?"
42050-164 = "[s1] \"너희들이 그 FOX 소대구나? 만나서 반가워.\"\n[s2] \"지난번에 준 유부초밥은 잘 먹었어.\""
42050-165 = "……[USERNAME] 선생님? 설마, 공원부터 우리를 쫓아온 거야?"
42050-166 = "………."
42050-167 = "……[USERNAME] 선생님? 설마, 공원부터 우리를 쫓아온 거야?"
42050-168 = "뒤를 밟히고 있는 줄은 몰랐었는데……"
42050-169 = "[s3] \"다시 공원에 돌아가 봤더니 다들 없어서……\"\n[s4] \"주변에 물어보면서 따라오느라 고생했어.\""
42050-177 = "실제로 뵙는 건 처음이군요, [USERNAME] 선생님."
42050-178 = "총학생회장의 부재로 혼란이 된 키보토스를 수습하는 데 지대한 공을 세우셨다고 들었습니다."
42050-179 = "……SRT 특수학원을 대표하여, 깊은 감사의 인사를 드립니다."
42050-180 = "[s] \"별말씀을.\""
42050-181 = "다만 지금 제가 츠키유키 소대장에게 하고 있는 이야기는 SRT 학원의 일이기 때문에."
42050-182 = "이후의 문제는 저희에게 맡겨 주셨으면 합니다."
42050-183 = "선생님께서는 학생의 결정을 존중하는 어른이시라고 들었습니다만."
42050-184 = "[s] \"그야 물론이야.\""
42050-186 = "[ns5] \"하지만 갑작스러운 만남에 다들 곤란해하는 것 같으니까.\"\n[ns6] \"미야코에게도 조금만 더 시간을 주면 안 될까?\""
42050-189 = "……알겠습니다."
42050-190 = "역시 모든 학생이 믿고 따른다는, 그 샬레의 선생님다운 말씀이시군요."
42050-195 = "선생님, 저희는 당신 같은 어른이 제일 싫습니다."
42050-196 = "[s] \"하하…… 역시, 기운 넘치네……\""
42050-197 = "……D-Day를 앞둔 시점에서 굳이 선생을 적대할 필요는 없겠지."
42050-198 = "FOX 소대, 전원 철수. 각 소대원은 HQ로 복귀하여 다음 작전에 대비하도록."
42050-206 = "……츠키유키 소대장. 방금 귀관의 핸드폰으로 좌표 하나를 송신했다."
42050-207 = "내가 건넨 제안에 대해 확신이 든다면 그 장소로 찾아오도록."
42050-208 = "저는……"
42050-209 = "……너희들도 언젠가는 우리를 이해하게 될 거야."
42050-210 = "………."
42050-214 = "다음화;후배의 고뇌"
