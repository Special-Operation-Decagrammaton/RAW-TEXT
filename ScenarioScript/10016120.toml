[translation]
10016120-1 = "후일담;RABBIT 소대 편"
10016120-4 = "……여기는 RABBIT 1. 현재 시각은 1930시. 밀레니엄의 학생들이 대운동회에 사용한 비품과 기자재를 회수하는 것을 확인."
10016120-5 = "응원 로봇으로 위장되어 회장 내에 반입된 전차— 통칭 <부르주아 크래셔>의 완전한 기능 정지 또한 확인했습니다."
10016120-6 = "그 외에 안정성이 확인되지 않은 로봇들도 '베리타스'의 관계자처럼 보이는 학생에 의해 모두 수거되었습니다."
10016120-11 = "여, 여기는 RABBIT 4…… 애슬레틱 스타디움 외곽에서 시위 중인 용역 학생들의 동향을 확인……"
10016120-12 = "조금 전까지만 하더라도 '주 3일 노동'을 외치며 발키리 학생들과 대치하고 있었는데…… 관중들이 줄어들자 분위기가 한풀 꺾인 것처럼 보여."
10016120-13 = "아무래도 이곳에서 시위를 계속하는 건 의미가 없다고 판단했나 봐……"
10016120-18 = "여기는 RABBIT 2. 방금 관중들이 빠져나간 관람석 구역을 전반적으로 순찰했는데, 폭발성 및 인화성 물질로 의심되는 화물은 없는 것 같아."
10016120-19 = "다들 퇴장하면서 쓰레기도 깨끗이 챙겨 나간 모양이라, 더 살펴볼 필요도 없더라고."
10016120-24 = "여기는 RABBIT 3. 방금 구호소의 전자 의무 기록을 살펴봤는데, 경기 중 가볍게 다친 경상자는 제법 있었지만 다행히 중상자는 발생하지 않은 모양이야."
10016120-25 = "SNS의 반응을 살펴봐도 다들 긍정적인 반응뿐이고…… 전반적으로 만족스러운 축제가 된 것 같아."
10016120-27 = "이만하면 애슬레틱 스타디움에 잔존하는 유해 위험 요인은 모두 제거된 것 같군요."
10016120-32 = "이것으로…… 미션, 클리어입니다!"
10016120-36 = "정말 다들 수고 많았어……"
10016120-37 = "그와 별개로 SRT 학원의 성적은 참가 학원 중 꼴찌에 그쳤지만 말이야. 후후……"
10016120-38 = "큿…… 그때 전차에 치이지만 않았었더라도, 최소한 1승은 거둘 수 있었을 텐데……"
10016120-39 = "아직까지 그 이야기를 하고 있는 거야?"
10016120-40 = "그렇게 치면 처음에 <물건 빌려오기> 경주 때가 더 아쉽지 않았어? 규칙만 제대로 읽어봤더라면 실격되지도 않았을 텐데……"
10016120-41 = "시끄러워. 경기장에 백린 연막탄을 가져오는 녀석이 더 이상한 거라고!"
10016120-42 = "게다가 우리는 참가한 학생의 숫자를 다 합해도 4명밖에 되지 않으니까……"
10016120-44 = "참여할 수 있는 경기의 숫자도 많지 않으니, 꼴찌를 하는 것도 어쩔 수 없는 일 아닐까……?"
10016120-45 = "하지만 아비도스 고등학교라는 곳은 전교 통틀어 5명밖에 참가하지 않았는데도, 중위권의 성적을 거둔 모양이던데."
10016120-49 = "음…… 역시 그냥 사키가 못한 것으로 하자."
10016120-50 = "야!"
10016120-54 = "너무 낙담할 필요는 없습니다, 사키."
10016120-55 = "저희는 이미 24시간이 넘도록 작전을 진행 중인 상태였으니, 정신적으로도 체력적으로도 한계가 오는 것이 당연합니다."
10016120-56 = "게다가 밀레니엄 학원에 반입된 군용 파츠의 행방을 부지런히 쫓은 덕분에, 전차가 날뛰었을 때도 당황하지 않고 초동 대처를 할 수도 있었지요."
10016120-57 = "시민의 안전을 수호한다는 제1 목표를 달성했으니, 오늘은 이것으로 만족합시다."
10016120-58 = "……사람들은 경기의 결과만을 기억하겠지만, '누군가'는 저희의 노고를 기억해 줄 테니까요."
10016120-59 = "그렇다면 조금 위안이 되긴 하지만……"
10016120-60 = "지금 상황에 이런 말을 꺼내도 괜찮을지 모르겠지만……"
10016120-61 = "사실 나는, 이번 작전이 평소와는 다르게 조금……"
10016120-62 = "조금……?"
10016120-64 = "……조금 즐거웠어."
10016120-68 = "여, 역시 이상하지……? 시민의 안전을 지켜야 하는 SRT가 작전 자체를 즐기고 있었다니……"
10016120-69 = "역시 나는 SRT 특수학원에는 어울리지 않는 쓸모없는 아이인 게—"
10016120-70 = "……아니, 나도 그 마음에는 어느 정도 동감해."
10016120-71 = "뭔가 오랜만에 기지 밖에 나와서 다른 학원의 학생들과 부딪히고, 땀을 흘리고 있노라니 새삼 실감이 되었거든."
10016120-72 = "우리가 지켜내고자 하는 시민들과 사회가 이곳이구나, 싶어서."
10016120-78 = "아, 아니…… 왜 가끔 그렇잖아! 교범으로 읽는 것보다 직접 만져보는 게 이해가 빠른 것처럼, SRT의 목적도 가끔은 실감하기 어려울 때가 있으니까……"
10016120-79 = "모처럼 SRT의 의의를 실감할 수 있는 좋은 기회가 되었다고 할까……"
10016120-80 = "사키 쨩……"
10016120-84 = "나도 이번 대운동회, 굉장히 즐거웠어."
10016120-85 = "평소에는 접하기 어려운 여러 가지 데이터도 만져볼 수 있었고……"
10016120-86 = "경기 중에 학원 간의 승패를 두고 내기가 벌어지기도 해서 용돈벌이도 조금 하고……"
10016120-87 = "너는 그만 좀 즐겨!"
10016120-91 = "네. 오늘 하루는 작전으로 숨 가쁘게 보낸 하루이기도 했지만, 시민들의 미소를 가까이에서 바라볼 수 있었던 하루이기도 했지요."
10016120-92 = "SRT의 대원으로서 오늘의 소중한 일상을 간직한 채, 앞으로도 정의를 위해 최선을—"
10016120-96 = "………."
10016120-97 = "잊고 있었지만, 우리 오늘 점심도 안 먹었었지……"
10016120-98 = "평소와는 다르게 폐기 도시락을 주으러 다닐 틈도 없었으니까……"
10016120-99 = "바쁘게 뛰어다니면서 먹은 것이라고는 빵 먹기 경주에 쓰인 단팥빵뿐이니……"
10016120-100 = "그러고 보니 아까 한 무리의 게헨나 학생들이 식재료와 바비큐 장비를 들고 중앙 필드 쪽으로 가던데……"
10016120-101 = "그곳에서 뭔가 바비큐라도 하려는 걸까?"
10016120-102 = "중앙 필드 쪽이라면…… <후야제>에 쓰이는 캠프파이어를 준비하는 장소로군요."
10016120-103 = "캠프파이어에서 바비큐 요리를 함께 만든다는 이야기는 듣지 못했습니다만……"
10016120-108 = "안전상에 문제가 있을지도 모르니…… 한 번 가볼까요?"
10016120-109 = "그, 그래! 큰불을 쓰는 행사에는 언제나 사고가 뒤따르는 법이니까……"
10016120-110 = "……절대로 바비큐를 하고 남은 식재료에 눈독을 들이고 있는 게 아니니까!"
10016120-111 = "뭔가 아까와 달리, 목적과 수단이 뒤바뀐 것 같긴 하지만……"
10016120-116 = "……그럼 초승달 작전, 조금 더 연장하겠습니다!"
10016120-117 = "확인!"
