90102070-122 = "3;유키노 비무장;01;네. 안 그래도 현장 탐문 이외에는 단서를 찾기 어려운 상황이었으니까요."
90102070-123 = "3;유키노 비무장;99;역에서 실종된 학생들도 저마다 다니는 학교나 생활 반경이 거의 겹치지 않아, 공통점을 찾기 어려웠으니……\n#3;em;[한숨]"
