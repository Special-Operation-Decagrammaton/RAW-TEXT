90102070-97 = "3;미야코;02;여하튼 그 학생이 최근에 오랫동안 알고 지내던 친구가 이곳, 카와니시 역 근처에서 갑자기 사라졌다고 해서요."
90102070-98 = "3;미야코;01;친구를 찾아달라는 의뢰를 받아, 실종 사건을 조사하다 보니 이곳까지 오게 되었습니다."
90102070-99 = "1;유키노 비무장;02;혹시…… 사라진 그 학생이 낯선 열차를 타고 사라졌다는 이야기는 듣지 못했나?\n#1;ar\n#3;m5\n#1;em;[?]"
