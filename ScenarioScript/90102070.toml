90102070-50 = "[s1] \"유키노가 일부러 너희들을 피한 건 아니야.\"\n[s2] \"FOX 소대가 출소한 사실은 비밀로 할 수밖에 없었거든.\""
90102070-53 = "3;미야코;06;그러고 보니 선배들이 출소한 것 치고는 이상하리만큼 조용하긴 했네요."
90102070-54 = "3;미야코;01;선배들이 출소했다는 사실이 알려졌더라면, 크로노스 채널이나 SNS에서 아무 이야기도 나오지 않았을 리가 없는데."
90102070-55 = "3;미야코;01\n1;유키노 비무장;02;그래. 지금도 우리가 밖에 나와 작전을 진행중이라는 사실은 총학생회장과 선생님 이외에는 알지 못하는 극비 정보다.\n#1;em;[반응]\n#1;m3\n#3;dr"
90102070-56 = "1;유키노 비무장;01;현재 추적중인 작전 목표가 위험 등급을 매길 수 없는 미지의 존재이기도 하거니와, 이 사실이 키보토스 전역에 알려질 더 큰 혼란을 가져올 수도 있기 때문이야."
90102070-57 = "1;유키노 비무장;13;그러니 미안하지만…… 당분간은 RABBIT 소대의 다른 소대원들에게도 우리가 출소했다는 사실을 비밀로 해줘."
90102070-58 = "1;유키노 비무장;14;전에도 말했지만, 우리의 내일이 될 너희들을 거친 일에 끌어들이고 싶진 않으니까."
90102070-59 = "3;미야코;99;여전하시네요, 선배는.\n#1;hide"
90102070-60 = "3;미야코;06;지난 번에도 그렇게 홀로 모든 것을 책임지기 위해 무리하다 실패하셨으면서.\n#3;em;[한숨]"
90102070-61 = "3;유키노 비무장;04;그 때는……"
90102070-62 = "3;미야코;03;하지만 선배의 정의가 빛을 잃지 않은 것 같아서 다행입니다.\n#3;em;[음표]"
90102070-63 = "3;미야코;11;대신 한 가지 약속만 부탁드리겠습니다."
90102070-64 = "3;미야코;01;지금 진행중인 작전이 모두 끝나고, 선배가 마음 속에 담고 있는 모든 앙금을 씻어냈다고 판단되신다면."
90102070-65 = "3;미야코;03;그 때는 키보토스의 그 누구보다도 저희에게 먼저 말씀해 주셔야 해요."
90102070-66 = "1;유키노 비무장;03;내 모든 걸 걸고 약속할게.\n#3;m5\n#1;a"
