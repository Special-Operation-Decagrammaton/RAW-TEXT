90102070-104 = "3;미야코;03;FOX 선배들의 작전에 도움이 될 수 있다니, 어쩐지 기쁘네요.\n#3;em;[음표]\n#fontsize;50"
90102070-106 = "3;미야코;02;의뢰인에게는 오랫동안 친하게 지냈던 소꿉친구가 있었다고 합니다.\n#3;a\n#3;em;[반응]"
90102070-107 = "3;미야코;01;의뢰인과 그 친구는 오랫동안 같은 학교에 다니며 친하게 지냈었지만, 최근 의뢰인이 전학을 가며 연락이 뜸해졌는데……"
90102070-108 = "3;미야코;11;지난주, 의뢰인의 친구가 갑자기 '과거로 가는 열차가 도착했다' 라는 메시지를 보낸 뒤, 승강장에서 사라졌다고 합니다."
90102070-109 = "3;유키노 비무장;01;그 부분까지는 우리가 알고 있는 사실과 일치해."
90102070-110 = "3;유키노 비무장;02;그 외의 정보는 없었나?"
90102070-111 = "5;미야코;02;네. 그리고 며칠 후, 친구를 찾으러 카와니시 역에 방문한 의뢰인은 우연히 수상한 열차가 승강장에 들어서는 모습을 목격했다고 합니다.\n#5;al\n#3;m1\n#5;em;[...]"
90102070-112 = "3;유키노 비무장;05;……수상한 열차?"
90102070-113 = "5;미야코;11;의뢰인의 말로는 이미 폐선 되어 사라진, 옛 노선의 열차였다고 하는데요."
90102070-114 = "5;미야코;02;의뢰인은 수상한 느낌이 들어 열차에 타지 않았지만…… 혹시 그 낯선 열차가 이번 실종 사건과 관련이 있을지도 모르겠다 싶어서요."
90102070-115 = "3;유키노 비무장;03;……확실히 중요한 정보군. #n알려줘서 고맙다, 츠키유키 소대장."
90102070-116 = "3;유키노 비무장;02;혹시 괜찮다면 우리가 그 의뢰인을 직접 만나볼 수 있을까?\n#3;em;[?]"
