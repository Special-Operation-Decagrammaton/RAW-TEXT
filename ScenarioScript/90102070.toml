[translation]
90102070-1 = "第7話;狐と兎"
90102070-8 = "……先輩のお話をまとめると。"
90102070-9 = "FOX小隊は連邦生徒会長の便宜で矯正局を出所し、#n現在は[USERNAME]先生と共に作戦を遂行している、ということですね。"
90102070-10 = "さっきのあれも、その特殊作戦の一環だったと。"
90102070-11 = "その通りだ、[ruby=つきゆき]月雪[/ruby]小隊長。"
90102070-12 = "犯した過ちについて、私はまだ償いきれたとは思っていない。#n能力を少しでも社会へ還元しろという連邦生徒会長の判断により、#n限定的な活動を許可されているのが現状だ。"
90102070-13 = "もちろん、SRT特殊学園が存在していた頃と比べれば失ったものは多い。#nだが……私たちの罪を思えば、過分な待遇だ。"
90102070-17 = "そちらの近況はニコから聞いている。#n今もあの公園で、SRT復活のために戦い続けているそうだな。"
90102070-18 = "先輩として、情けない限りだ。"
90102070-19 = "すべてが片づいてから挨拶に行くつもりだったが――"
90102070-20 = "まさかこんな形で再会することになるとは思わなかった。#n……すまない。"
90102070-25 = "はぁ……。"
90102070-26 = "……失望したか？"
90102070-27 = "はい。"
90102070-28 = "正直、がっかりです。"
90102070-29 = "そんなに酷かったのか、私の演技は……。"
90102070-30 = "ち、違います！#n演技の話ではなくて……。"
90102070-34 = "矯正局を出られたのに……#nどうして私たちには何も知らせてくださらなかったんですか？"
90102070-35 = "再会したとしても、恨み言を言ったり、#n何かを求めたりするつもりなんてありませんでした。"
90102070-36 = "ただ、普通に日々を過ごしたかっただけなのに。"
90102070-37 = "サキも、モエも、ミユも……どれだけ先輩たちに会いたがっていたか。"
90102070-41 = "……すまない。"
90102070-42 = "先輩。"
90102070-43 = "もしかして……今でも、私たちのことを味方ではないと思っているんですか？"
90102070-44 = "そ、それは――"
90102070-48 = "[ns] \"何か誤解があるみたいだね。\""
90102070-49 = "[USERNAME]先生？"
90102070-50 = "[s1] \"ユキノはわざと避けてたわけじゃない。\"\n[s2] \"出所したこと自体が極秘なんだ。\""
90102070-53 = "……言われてみれば、誰も話題にしていませんね。"
90102070-54 = "この手の話は、クロノスチャンネルやSNSが黙っているはずないですし。"
90102070-55 = "これは、連邦生徒会長と先生以外、他には誰も知らない極秘事項だ。"
90102070-56 = "追跡中の対象は危険度すら測れない未知の存在である上に……#n公になれば、キヴォトス全体に混乱を招きかねない。"
90102070-57 = "だから悪いが……しばらくは他の小隊員にも伏せておいてほしい。"
90102070-58 = "君たちまで巻き込みたくはないんだ。#n「明日」を担うのは、私たちではなく君たちだからな。"
90102070-59 = "相変わらずですね。"
90102070-60 = "前回だって、一人で全部背負い込もうと無理をして……失敗したじゃないですか。"
90102070-61 = "あれは――"
90102070-62 = "でも、先輩の正義が消えていなくて安心しました。"
90102070-63 = "その代わり、約束です。"
90102070-64 = "今の作戦が終わって、先輩が過去と向き合えたら――"
90102070-65 = "キヴォトスの誰より先に……私たちに教えてください。"
90102070-66 = "私の全てを賭けて約束しよう。"
90102070-67 = "はい、それで十分です。"
90102070-71 = "ただ、それはそれとして先ほどの演技は……。#n極秘任務中なんですよね？目立ちすぎていたような気もしますが……。"
90102070-72 = "あ、もしかして、人目を引くことが目的だったとか？"
90102070-73 = "いや、そういった特別の事情はない。"
90102070-74 = "強いて言うなら、今日は他の隊員の体調が優れなくてな。#n普段なら任せているのだが、今日は小隊長である私が聞き込みを担当していたんだ。"
90102070-75 = "ああ……なるほど。"
90102070-76 = "……私の演技はそんなに不自然だったか？"
90102070-80 = "…………はい。"
90102070-81 = "……今後の参考にしよう。"
90102070-82 = "[s3] \"だ、大丈夫だよ……たぶん……。\"\n[s4] \"得意不得意は誰にでもあるし……。\""
90102070-85 = "そのフォローは心に刺さります……。"
90102070-86 = "ふふ。こうして話していると、なんだか懐かしいですね。"
90102070-89 = "[ns5] \"ところで、ミヤコはどうしてここに？\"\n[ns6] \"子ウサギ公園からは距離あるよね？\""
90102070-92 = "実は……個人的に依頼を受けてまして。"
90102070-93 = "依頼……？"
90102070-94 = "少し前、公園の近くでスケバンに絡まれていた生徒を助けたことがあるんです。"
90102070-95 = "お弁当屋さんでアルバイトしてる子だったのでそのまま仲良く――"
90102070-96 = "大事なのは出会い方ではなくてですね！"
90102070-97 = "その子の幼なじみが、川西駅の近くで姿を消したそうなんです。"
90102070-98 = "それで事件を調べていたらここにたどり着きました。"
90102070-99 = "……その生徒だが、見慣れない列車に乗って消えたという話は聞いていないか？"
90102070-100 = "えっ、まさか先輩たちが追っている事件も？"
90102070-101 = "断定はできないが、おそらく同じ事件だろう。"
90102070-102 = "よければ、情報を共有してもらえないか？"
90102070-103 = "もちろんです。"
90102070-104 = "先輩の作戦に協力できるなんて……嬉しいですね。"
90102070-106 = "依頼人には、仲のいい幼馴染がいたそうです。"
90102070-107 = "同じ学園に通い、ずっと親しくしていたそうなんですが……#n最近、依頼人の転校をきっかけに疎遠になってしまって。"
90102070-108 = "ですが先週、突然「過去へ行く列車が来た」というメッセージが送られてきて、#nそれを最後に連絡がつかないらしく。"
90102070-109 = "そこまでは、こちらが把握している内容とも一致する。"
90102070-110 = "他に何か情報は？"
90102070-111 = "その数日後、幼馴染を探すために川西駅を訪れた依頼人は、#n偶然「奇妙な列車」がホームに入ってくるのを目撃したそうです。"
90102070-112 = "……奇妙な列車？"
90102070-113 = "既に廃線になった旧路線の車両だったと依頼人は言っていました。"
90102070-114 = "怪しいと感じて乗車はしなかったそうですが……#nもしかすると、その列車が今回の失踪事件と関係しているのではないかと。"
90102070-115 = "……たしかに重要な情報だ。教えてくれて助かった。"
90102070-116 = "可能なら、その依頼人と直接会わせてもらえないか？"
90102070-117 = "分かりました。私から連絡して、約束を取り付けておきます。"
90102070-121 = "[ns] \"目撃者が見つかって良かったね。\""
90102070-122 = "ええ。ここまで、ほとんど手掛かりがありませんでしたから。"
90102070-123 = "失踪した生徒は学園も生活圏もバラバラで……共通点を見つけられずにいましたし。"
90102070-124 = "共通点……先輩はご存じないんですか？"
90102070-125 = "何か知っているのか？"
90102070-126 = "依頼人を含め、川西駅で例の列車を目撃した生徒には共通点があります。"
90102070-127 = "全員……今は廃校になった「私立ヒヤシンス学園」出身だそうです。"
90102070-129 = "次回;友達を探しています"
