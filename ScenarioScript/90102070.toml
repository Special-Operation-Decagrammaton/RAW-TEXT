90102070-101 = "1;유키노 비무장;99;확신할 수는 없지만, 아마 같은 사건인 것 같군."
90102070-102 = "1;유키노 비무장;01;가능하다면 그 사라진 학생에 대한 정보를 공유해 줄 수 있을까?"
