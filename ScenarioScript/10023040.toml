[translation]
10023040-1 = "제4화;인사드립니다. 뿅."
10023040-8 = "[ns] \"안녕, 아리스. 청소 열심이네.\""
10023040-9 = "그렇습니다, 선생님! 지금의 아리스는 메이드 용사니까요!"
10023040-10 = "[s] \"메이드 용사?\""
10023040-11 = "메이드와 용사의 경지에 이른 끝에 있는 최강의 존재입니다! 최강과 최강이 합쳐진 상급직입니다!"
10023040-12 = "[s] (아리스에게 메이드란 건 대체 어떤 걸까……)"
10023040-13 = "그보다 선생님은 괜찮습니까? 이렇게 새벽부터 깨어 있어도 괜찮은 건가요?"
10023040-14 = "선생님은 조심해야 합니다. 잘 자고, 푹 쉬고, 잘 먹지 않으면 안 되는 겁니다."
10023040-15 = "아리스는 끄떡없습니다! 모모이들과 게임을 하다 보면 자주 밤을 새우곤 했으니까요!"
10023040-16 = "[s1] \"선생님은 아리스가 열심히 하는 것만 봐도 힘이 나니까……\"\n[s2] \"모모이에게는 자주 밤을 새우면 안 된다고 말해둬야겠네……\""
10023040-24 = "아, 역시 하품했습니다! 청소는 아리스에게 맡겨 두고, 선생님은 들어가서 쉬는 게 어떻습니까?"
10023040-25 = "무엇보다 지금은 새벽 5시 20분이 막 지났으니까요!"
10023040-26 = "저기, 아리스 쨩……? 바닥 닦기 끝났으면, 이쪽 먼지 털기 도와줄래?"
10023040-27 = "알았습니다, 유즈! 아리스, 먼지 털기 모드로 전환합니다!"
10023040-31 = "후아아아아아암……"
10023040-32 = "졸려어……"
10023040-33 = "[s] \"다들 새벽부터 고생이 많네……\""
10023040-34 = "뭐…… 5시 20분부터 7시 40분까지는 특별히 더 저택을 지켜 달라고 했으니까……"
10023040-35 = "그러는 김에 겸사겸사 간단한 청소도 부탁받은 거고요."
10023040-36 = "수당은 따로 계산해 준다고 했으니 불만은 없지만……"
10023040-37 = "졸~려~"
10023040-39 = "(그렇게 무사히 오전이 지나가고, 오후가 되었다.)"
10023040-40 = "(약속된 대로 파티가 개최되었고, 파티장은 생각보다도 더…… 혼잡했다.)"
10023040-42 = "이봐. 잔이 아직도 비었지 않나. 내 말이 들리지 않았던 겐가?"
10023040-43 = "어? 아, 미안……"
10023040-44 = "죄송합니다. 금방 가져다드릴게요."
10023040-45 = "자네의 실수는 곧 주인의 평판과도 직결되는 것이니, 그 점을 잊지 말아야 해!"
10023040-46 = "(으그그극……! 뭐야, 대체! 애초에 우리는 정식 메이드도 아니라고!)"
10023040-47 = "애초에 말이지. 아무리 고용된 몸이라고는 하지만 기본적인 양식은 갖추고 있어야 할 것 아닌가? 그게 되어 있지 않아서야……"
10023040-48 = "저…… 실례합니다만, 잔이 이미 채워져 있는 것 같은데요?"
10023040-49 = "뭣? 그럴 리가. 내 분명 확인하고 이야기를 꺼낸 것인데……!"
10023040-53 = "저, 정말이다! 대체 누가, 어느 사이에 기척도 내지 않고 이런 훌륭한 접객을……?"
10023040-55 = "(정말?! 어떻게 된 거야, 미도리?)"
10023040-56 = "(나도 모르겠어……)"
10023040-65 = "끄앙! 손님분들이 너무 많습니다! 이대로는 아리스가 스네일처럼 되고 말 겁니다!"
10023040-69 = "이봐! 여기 접시가 떨어졌잖아!"
10023040-70 = "다행히 깨지지는 않았지만, 놀란 내 심장은 어떻게 할 거야!"
10023040-72 = "죄, 죄송합니다! 그렇지만 지금의 아리스는 꼼짝할 수가……"
10023040-74 = "지금 그걸 변명이라고 하고 있나? 빨리 상황을 정리하지 못해?"
10023040-75 = "하, 하지만……"
10023040-79 = "으우우…… 조금만 비켜 주세요, 손님들……"
10023040-87 = "어라……? 접시가…… 치워졌습니다."
10023040-88 = "무슨 헛소리를 하는 거야? 분명히 떨어진 접시가……"
10023040-89 = "아니, 어느새?!"
10023040-90 = "으으음…… 파티에 트집을 잡아 조금이라도 경매에서 유리한 위치에 올라서겠다는 내 계획이……!"
10023040-92 = "이 느림보들, 뭐 하고 있는 거야! 이렇게 망친 걸 내놓으라는 거냐?"
10023040-93 = "똑똑히 봐라! 이게 구운 농어로 보여? 방생하면 살아나서 바다로 돌아갈 거다!"
10023040-94 = "그리고, 메이드들은 뭐 하고 있는 거야! 급여를 받았으면 제대로 일을 해야지!"
10023040-95 = "우와아아아, 죄송해요. 죄송해요!"
10023040-96 = "죄송하다면 다야? 음식이 쌓인 지 하도 오래돼서 남은 열기만으로도 화력발전을 할 수 있겠다! 빨리 움직……"
10023040-97 = "여?"
10023040-98 = "음식들이 전부…… 어디로 갔지?"
10023040-101 = "제가 전부 날랐습니다. 또 지시하실 일은 없습니까?"
10023040-102 = "뭐라고? 그렇게 많이 쌓여 있었던 걸 전부?"
10023040-103 = "물론입니다. 저는 우수한 메이드이기에."
10023040-104 = "메…… 메이드? 바니걸……이 아니라?"
10023040-105 = "……좋아. 다들 가 봐."
10023040-109 = "주방 팀! 너희들은 아니야! 집합!"
10023040-116 = "어……"
10023040-121 = "오랜만에 뵙는군요. 피스 피스."
10023040-122 = "어어어어어어?!"
10023040-124 = "[ns] \"그렇구나. 네루가……\""
10023040-125 = "예. <자애의 괴도>가 이 저택으로 향하고 있으니 뒤를 부탁한다고."
10023040-126 = "그 밖에도 따로 언질 받은 임무가 있습니다만……"
10023040-127 = "그건 그렇고, 선생님이 먼저 와 계셨을 줄은. 이건 천운이라고 해야겠군요."
10023040-128 = "[s] \"나도 토키를 보니 반가운데?\""
10023040-129 = "감사합니다. 선생님."
10023040-130 = "또 선배들은 이렇게도 말했습니다."
10023040-131 = "'지금 믿을 수 있는 것은 토키밖에 없으니, C&C의 이름에 부끄럽지 않은 활약을 기대한다. 좋은 소식을 기다리겠다.'"
10023040-132 = "'도구와 예산은 마음대로 사용해도 좋다. 청구는 세미나의 회계 앞으로 돌리도록.'"
10023040-133 = "'이런 말은 자주 하지 않지만, 믿고 있다. 언제나.'"
10023040-137 = "……훗."
10023040-138 = "[s] \"아니, 거기서 '어떻습니까?' 하는 표정을 지어도 말이지……\""
10023040-139 = "먼저 공유받은 정보에 따르면, <자애의 괴도>는 항상 예고장을 보낸다고 하더군요."
10023040-140 = "그 예고장을 볼 수 있다면, 사건 해결에 큰 도움이 될 것이라고 생각합니다."
10023040-141 = "[s5] \"그런데 말이야, 토키……\"\n[s6] \"조금 전부터 토키에게 신경 쓰이는 게 있어서 그런데……\""
10023040-142 = "예. 무엇인가요?"
10023040-143 = "예. 무엇인가요?"
10023040-144 = "[s] \"……왜 바니걸이야?\""
10023040-145 = "……"
10023040-146 = "실망했습니다. 선생님."
10023040-147 = "[s] \"어째서?!\""
10023040-148 = "C&C의 은밀 잠입 공작 임무에는, 바니걸 슈트가 정복이잖습니까."
10023040-149 = "저는 분명히 숙지했습니다. 예전 오디세이아 해양학원의 호화 크루즈선에 잠입했던 선배들의 기록을요."
10023040-150 = "[s] \"앗, 거기에는 여러 가지 사정이……\""
10023040-151 = "?"
10023040-152 = "[s] \"으, 으응. 아니야. 괜찮아. 다 괜찮아. 토키는 이대로 좋아……\""
10023040-153 = "왜 모든 것을 포기하는 표정을 지으시면서 한숨을 내쉬시는지 모르겠습니다만……"
10023040-154 = "선생님께서 그러하시다면, 그런 것이겠지요."
10023040-155 = "그보다, 지금 직면한 또 하나의 문제는……"
10023040-159 = "아으, 아, 아우우우우……"
10023040-163 = "……없어요…… 여기엔 아무도 없어요……"
10023040-165 = "……"
10023040-166 = "이럴 때는 어떻게 해야 할까요, 선생님?"
10023040-167 = "[s7] \"확실히, 잘 모를 때는 어른에게 물어보는 게 맞긴 한데……\"\n[s8] \"미안. 어른도 항상 모든 일에 답을 갖고 있는 것은 아니야……\""
10023040-168 = "그렇습니까…… 그런데 여러분은 여기서 무엇을 하고 계시는 중인가요?"
10023040-169 = "그렇습니까…… 그런데 여러분은 여기서 무엇을 하고 계시는 중인가요?"
10023040-170 = "너, 너 같은 건 하나도 안 무서우니까! 여차하면 격투 게임으로 물리쳐 주마!"
10023040-171 = "언니…… 조심해야 해. 저 사람, 불리해지면 옷을 벗어 던지고 치트키를 쓰니까."
10023040-173 = "아리스 쨩을 또 빼앗길 수는 없지만…… 우우우, 그렇지만……"
10023040-174 = "[ns] \"……내가 대신 설명할게……\""
10023040-177 = "C&C의 의뢰…… 그렇군요. 이걸 위해서 메이드복을 준비해 달라고 하셨던 것이고……"
10023040-178 = "어, 어떻게 하지, 언니?"
10023040-179 = "이제 끝인가?! 네루 선배한테 얻어맞는 거야?!"
10023040-180 = "끄앙!"
10023040-181 = "아뇨. 선배들께 보고하지는 않을 겁니다. 저는 미션을 수행하러 왔을 뿐이니까요."
10023040-182 = "게임개발부 여러분이 계셨을 줄은 예상하지 못하고 있었습니다만……"
10023040-183 = "[s] \"정말 괜찮겠어? 우리 멋대로 행동한 건데.\""
10023040-184 = "네. 괜찮습니다."
10023040-185 = "어차피 선배들도 저를 빼놓고 작전을 나가셨는데, 제가 반대로 행동한다고 해도 상관없겠지요."
10023040-189 = "[ns9] \"어라? 갑자기 불이…… 어째서……\"\n[ns10] \"가만, 벌써 시간이…… 7시 38분……?!\""
10023040-190 = "?!?!"
10023040-191 = "?!?!"
10023040-193 = "뭐, 뭐야? 불이 전부 꺼졌어!"
10023040-194 = "무슨 일이라도 있나? 메이타로 씨, 메이타로 씨?"
10023040-195 = "지, 진정하십시오. 여러분! 일시적인 정전일 뿐입니다. 금방 정상화하도록 하겠습니다."
10023040-196 = "아뇨. 그렇게 되지는 않을 거예요."
10023040-197 = "누구……?"
10023040-199 = "어떤 사람들은 말하죠. 가치 있는 것은 소유되어야 한다고."
10023040-200 = "소유하고, 제한하며, 밖으로 새어 나가지 않도록 엄중하게 관리되어야 한다고요."
10023040-201 = "정말 그럴까요? 진정 그것이 가치 있는 것이라면, 모두와 공유되어야 하는 것이 아닐까요?"
10023040-202 = "설마……!"
10023040-205 = "어떤 사람들은 저를 좀도둑이라고 표현해요."
10023040-212 = "또 다른 사람들은 저를 범죄자라고 표현하죠."
10023040-217 = "우리는 이름을 갖고 태어나지 못하니, 호칭이란 타자에게서 받아들여지는 것."
10023040-222 = "그렇기에 저는 저에게 붙인 당신들의 언어를 받아들이기로 했어요."
10023040-224 = "그래요. 일반적으로 불리워지는 저의 이름은."
10023040-236 = "<자애의 괴도> 랍니다."
