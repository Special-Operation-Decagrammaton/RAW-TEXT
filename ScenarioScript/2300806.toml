[translation]
2300806-1 = "자신이 바라는 것"
2300806-2 = "(마리의 안내를 따라 찾아온 약속 장소는 트리니티의 어느 한적한 사격장이었다.)"
2300806-3 = "(넓은 공간에 사람 한 명 없던 그곳은 오히려 성당이나 도서관 이상으로 고요했다.)"
2300806-4 = "……오셨군요, 선생님."
2300806-9 = "기다리고 있었답니다. 갑자기 연락 드려서 부담스럽진 않으셨을까 걱정했거든요."
2300806-10 = "……사실 딱히 대단한 이유가 있는 것도 아니라서 더욱……."
2300806-11 = "[s1] \"괜찮긴 한데……. 여기는……?\"\n[s2] \"마리가 사격장에……?\""
2300806-12 = "……아……. 죄송해요. 역시 갑작스러우셨군요."
2300806-13 = "……아……. 죄송해요. 역시 갑작스러우셨군요."
2300806-14 = "딱히 총과 관련돼서 온 건 아니에요. 그냥……. 조용한 곳이라 왔던 것뿐."
2300806-15 = "보시다시피 아무도 없이 적막만이 가득한 곳이라, 자신의 기도에도 집중할 수 있거든요."
2300806-16 = "지금 같을 땐 성당 안이나……. 참회실보다도 더 고요함을 지킬 수 있는 곳."
2300806-17 = "그래서 고민이 있거나, 스스로 기도를 드리고 싶을 때엔 오히려 이곳으로 오기도 해요."
2300806-18 = "으음……. 역시 이상한가요? 시스터가 이런 사격장을 찾는 건……."
2300806-19 = "[s3] \"아니. 전혀 안 이상해.\"\n[s4] \"듣고 보니 오히려 마리답다고 생각해.\""
2300806-20 = "휴우……. 감사합니다. 혹시나 이상한 오해를 받을까 봐 걱정했어요."
2300806-21 = "휴우……. 감사합니다. 혹시나 이상한 오해를 받을까 봐 걱정했어요."
2300806-22 = "……사실 저도 처음엔 이런 곳이 있는 줄 몰랐거든요."
2300806-23 = "그저 '가끔 다른 시스터분들도 찾아오시는 곳'이라고만 들어서……. 따라하는 느낌으로 찾아와 봤었죠."
2300806-28 = "그렇게 찾아와 보니, 과연 이 적막……. 이 고요함……."
2300806-29 = "마음을 다스리시거나 잡념을 없애고 싶으실 때……. 스스로의 일을 반성하고 혹은 격려하고플 때……."
2300806-30 = "잡념을 잊고 싶을 때……. 정말로 좋은 공간이더라고요."
2300806-31 = "……잡념……."
2300806-35 = "[ns] \"……마리?\""
2300806-36 = "……그……."
2300806-37 = "……실은……. 저번에 쉬었던 일도 있고 해서, 나름대로 고민 끝에 상담을 좀 받아봤어요."
2300806-38 = "가끔씩 그러는 건 누구라도 그럴 수 있다면서, 다른 시스터분들께선 좋게 말씀해 주셨지만……."
2300806-39 = "그래도 저는 그런 일이 또 일어나지는 않길 바랐거든요. 일종의 자기 관리에 대한 이야기랄까……."
2300806-40 = "그랬더니 '늘 봉사하는 마음을 가지는 것도 좋지만, 가끔은 스스로 하고 싶은 걸 챙기는 것도 필요하다'라고 하셔서……."
2300806-41 = "그래서 조금 생각해 봤어요. 제가 하고 싶은 것이 뭔지를."
2300806-42 = "오늘도, 방금 전까지도 이곳에서 기도하며 생각을 정리하고 있었어요. 그리고 떠올렸어요."
2300806-43 = "그치만 그 떠오른 게 너무 생각지도 못했던 것이어서……. 어떻게 해야 할지……."
2300806-45 = "……선……."
2300806-46 = "[s5] \"……선?\"\n[s6] \"……마리?\""
2300806-47 = "……선생님……."
2300806-48 = "……선생님……."
2300806-49 = "그……. 가끔……. 아주 어쩌다가 한 번의 가끔이어도 좋으니……."
2300806-50 = "저번처럼……. 저에게……. 그……."
2300806-51 = "……시……."
2300806-52 = "시간을……. 내 주실 수……. 없을까요……? 특별히 아무것도 하지 않으셔도 좋으니……."
2300806-53 = "저번에 와 주셨을 때……. 뭔가 표현하긴 어렵지만……. 굉장히 기뻤거든요. 저……."
2300806-54 = "무, 물론 알고 있어요. 이런 거, 시스터답지 않은 이야기라는 것도……."
2300806-55 = "다른 사람에게 돌봐 달라고 하는 것도, 가끔 어울려 달라고 하는 것도……."
2300806-56 = "다른 사람을 보살펴야 하는 시스터의 길과는 전혀 상관없다는 건 알고 있어요."
2300806-57 = "알고 있지만……. 그게……."
2300806-58 = "……네?"
2300806-59 = "……상관없으시다고요?"
2300806-60 = "……어……. 그렇게 쉽게……?"
2300806-61 = "그걸로 괜찮으신 거예요……?"
2300806-62 = "[s7] \"아까도 말했듯이 학생과 선생이니까.\"\n[s8] \"24시간 내내 시스터일 필요는 없다고 생각해.\""
2300806-63 = "……!"
2300806-64 = "……!"
2300806-65 = "……선생님……."
2300806-69 = "……후후후. 어쩌면 저 혼자 너무 딱딱하게 생각하고 있던 걸지도 모르겠어요."
2300806-70 = "훌륭한 시스터가 되고 싶은 건 맞지만……. 동시에 저도 한 명의 학생이었죠."
2300806-71 = "학생이니까……."
2300806-72 = "그리고 선생님이시니까……. 조금은 이런 식으로 어리광을 부려도 되는 거였군요."
2300806-73 = "……뭔가……. 그러네요. 갑자기 너무 개운해졌어요."
2300806-79 = "……정말 감사합니다. 선생님."
2300806-80 = "그럼 앞으로도……. 잘 부탁드릴게요."
2300806-81 = "선생님으로서……."
2300806-85 = "……학생인 저의 어리광을."
2300806-87 = "(이후 마리와 함께 각자의 기도를 올린 후 샬레로 돌아왔다.)"
