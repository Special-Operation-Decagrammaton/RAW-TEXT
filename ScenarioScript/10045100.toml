[translation]
10045100-1 = "제10화;결승의 끝에서"
10045100-2 = "제1경기부터 손에 땀을 쥐는 명승부가 탄생했네요!"
10045100-6 = "다음은 어떤 승부가 될지요?! 최종전 제2경기! #n이즈나 선수 대 치세 선수 경기가 시작됩니닷!"
10045100-7 = "치세 쨩! 파이팅이에요!"
10045100-8 = "오오! 할 수 있다, 이즈나! 우리의 인법을 보여줘!"
10045100-9 = "참가 못 한 우리의 몫까지…… 힘내요, 이즈나 쨩!"
10045100-11 = "관객석에서 경기를 보는 건 처음인데……."
10045100-12 = "모두 친구들을 응원해 주고 있었구나."
10045100-13 = "열정이 엄청나네."
10045100-15 = "후후후, 이것이 여름의 페~스티벌 아니겠사와요?"
10045100-16 = "그나저나 어떤 분이 렌게 선배와 결승에서 만날까요?"
10045100-17 = "소녀, 몹시 기대되어요!"
10045100-19 = "[ns] \"그럼 모두, 정정당당하게…… 승부!\""
10045100-21 = "갑니다! 이즈나류 인법! 고속이동의 술!"
10045100-25 = "빠르네."
10045100-26 = "하지만, 나도 빨라."
10045100-33 = "오오, 두 선수 모두 손이 보이지 않을 정도로 빠릅니다!"
10045100-34 = "치세 공, 이렇게나 민첩한 움직임을……! 감탄했습니다!"
10045100-35 = "[ns] \"저건……! 카루타와 무시퀸 배틀로 다져진 속도!\""
10045100-36 = "과연 백귀야행의 아이돌! 못하는 게 무엇인가……!"
10045100-37 = "슬슬 끝낼게."
10045100-38 = "하이쿠를 읊어줘."
10045100-39 = "우으읏……?!"
10045100-40 = "이즈나류 인법! 매미허물의 술……!"
10045100-45 = "도망갔네."
10045100-46 = "수, 순간 치세 공의 눈빛이 엄청났어요……."
10045100-47 = "하지만 이 이즈나, 지지 않습니다! 저를 응원하러 와주신 모두를 위해서라도……!"
10045100-49 = "나랑 똑같네."
10045100-50 = "후우우……."
10045100-52 = "어#n느#n한#n쪽#n이"
10045100-54 = "쓰#n러#n질#n때#n까#n지#n의"
10045100-56 = "승#n부#n이#n려#n나"
10045100-59 = "[log=치세 수영복]어느한쪽이[/log]"
10045100-60 = "[log=치세 수영복]쓰러질때까지의[/log]"
10045100-61 = "[log=치세 수영복]승부이려나[/log]"
10045100-62 = "자……! 다시 갑니다!"
10045100-63 = "……!"
10045100-66 = "실력은 거의 호각. 서로 결정타가 없는 상태로 대결은 장기전으로 이어졌다."
10045100-67 = "이제 승부를 가르는 것은 오로지 정신력."
10045100-68 = "그렇게 어느덧 경기는 후반부에 다다르는데……."
10045100-70 = "하아, 하아……."
10045100-71 = "후우우우……."
10045100-72 = "슬슬 두 사람 다 체력이 한계야."
10045100-73 = "응. 아마도 다음 공격에 승부가 갈리겠지."
10045100-74 = "누가 승리해도 전혀 이상하지 않사와요!"
10045100-76 = "치세 쨩! 힘내요……!"
10045100-78 = "닌자란 어떤 궁지에서도……!"
10045100-79 = "절대로, 포기하지 않는…… 법!"
10045100-87 = "과연 이번 경기의 승자는……!"
10045100-91 = "하아, 하아……."
10045100-92 = "[ns] \"쿠다 이즈나……!\""
10045100-95 = "휘유우우…… 정말로 간발의 차이. 쉽지 않은 승부였어요."
10045100-99 = "내가 졌어."
10045100-100 = "졌으니까, 하이쿠를 읊을게."
10045100-101 = "맞서 싸우고,"
10045100-102 = "지더라도 괜찮아."
10045100-103 = "청춘이어라."
10045100-105 = "좋아. 이걸로 결승 상대가 정해졌네."
10045100-106 = "오오, 렌게 공! 그럼 다음 경기에서 만나도록 하죠……!"
10045100-107 = "[ns] \"드디어 결승 진출자가 다 나왔네!\""
10045100-108 = "그럼 잠시 휴식을 취한 뒤 대망의 결승전을 시작하도록 하겠습니다!"
10045100-109 = "모두 잠시만 대기해 주세요!"
10045100-111 = "후훗, 드디어 도착했군요. 선생님이 우승자를 심사하는 경기장에."
10045100-112 = "그럼 살짝 구경부터 해볼까요?"
10045100-114 = "잠시 후……."
10045100-117 = "자, 이제 모두가 기다리던 백야수상제의 결승전! 그 결승전의 준비가 모두 끝났습니다!"
10045100-118 = "결승에 진출한 두 선수! 소감을 한마디씩 말씀해 주세요!"
10045100-119 = "어, 그러니까……."
10045100-120 = "이즈나는 좋은 분들과 재밌는 경기를 할 수 있어서 정말 즐거웠습니다! 결승전도 이 마음을 간직한 채 계속하려 합니다!"
10045100-121 = "여러분도 즐거운 마음으로 응원 부탁드립니다! 닌닌!"
10045100-123 = "파이팅~! 이즈나~!"
10045100-124 = "가, 가자아아아……."
10045100-126 = "음, 이제 내 차례인가?"
10045100-127 = "나는…… 혼자만의 힘으로 여기에 온 게 아니야. 좋은 동료와 친구들이 있어서 가능했어."
10045100-128 = "그러니까 지켜봐 달라고! 너희 몫까지 내가 이겨줄 테니까!"
10045100-129 = "지면 용서하지 않을 테니까."
10045100-130 = "렌게라면 할 수 있어."
10045100-131 = "선배! 퍼어펙~투하게 승리하는 것이어요……!!"
10045100-133 = "선수들 모두 준비가 끝난 것 같군요! 그럼 바로 경기를 시작하겠습니다!"
10045100-134 = "자, 서로를 마주 보시고……!"
10045100-140 = "[ns] \"정정당당하게, 승부……!!\""
10045100-148 = "(큭, 역시 쉽지 않네. 미꾸라지처럼 빠져나가잖아?!)"
10045100-149 = "(잠깐 힘을 겨루었을 뿐인데 느꼈습니다. 정말로 엄청난 상대라는 걸요……!)"
10045100-150 = "(그래도…….)"
10045100-151 = "(하지만…….)"
10045100-152 = "(여기서 물러날 수는 없어!) #n(여기서 물러날 수는 없습니다!)"
10045100-159 = "선생님? 여기서 우승자를 예측해 보실 수 있을까요?"
10045100-160 = "[s] \"솔직히 정말로 모르겠어. 누가 이겨도 이상하지 않아.\""
10045100-161 = "그 선생님마저! 마지막 순간까지 알 수 없죠! #n그래서 손에 땀을 쥐게 되는 법! 이제부터 눈 깜빡거리기 금지입니다!"
10045100-162 = "(열심히 해서 다행이야…… 백야수상제, 대성공의 예감……!)"
10045100-163 = "(이걸로 우리 마츠리운영관리부의 이름이 백귀야행 역사에 큼직하게 새겨질 것은 틀림없……)"
10045100-164 = "우후훗, 잠깐만요."
10045100-165 = "응? 다, 당신은……?!"
10045100-166 = "지금까지 조용히 지켜보았습니다만, 그것도 슬슬 한계군요."
10045100-167 = "선생님이 심사하는 대회. 그것도 이렇게 즐거운 대회라니."
10045100-168 = "역시 이 와카모가 빠지면 안 될 것 같……."
10045100-172 = "오오오! 재액의 여우가 나섰다! 이제 우리가 나설 차례!"
10045100-173 = "전부 부숴버려……!!"
10045100-185 = "이건 대체 무슨……."
10045100-186 = "아아아, 안돼! 공들여 만든 내 경기장이……!"
10045100-187 = "도, 도대체 무슨 짓을! 용서할 수 없사와요!"
10045100-189 = "크크큭, 막을 수 있다면 막아 보던가! 이쪽엔 재액의 여우가 있다고!!"
10045100-193 = "자, 가자! 우리가 여기를 접수하는 거야!"
10045100-194 = "……당신, 누가 경기장을 부수라고 했죠?"
10045100-195 = "……응?"
10045100-196 = "이 와카모, 선생님의 앞에서 강자들을 꺾어 멋진 모습을 보여드리려 하였건만."
10045100-197 = "그걸 방해하다니. 대체 무슨 생각이신지?"
10045100-198 = "응? 그러니까 지금 같이 강자들을 꺾으러 온 거잖아?"
10045100-200 = "저는 다른 분들처럼 선생님의 앞에서 경기가 하고 싶었을 뿐."
10045100-201 = "그걸 망치려 하다니, 용서할 수 없군요."
10045100-202 = "어, 어라?"
10045100-203 = "……모두 같이 가자."
10045100-204 = "선생님. 지휘를 부탁해."
10045100-205 = "[s] \"응! 맡겨 줘!\""
