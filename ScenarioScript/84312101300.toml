[translation]
84312101300-6 = "뭐야, 갔네?"
84312101300-7 = "정말로 말도 없이 가버렸군요."
84312101300-8 = "……적어도 메시지라도 하나 남겨 놓을 줄 알았는데 말이에요."
84312101300-9 = "왜? 서운하냐?"
84312101300-10 = "아니라고 할 수는 없겠어요. 솔직한 말로."
84312101300-11 = "하하…… 참."
84312101300-12 = "아직도 녀석에 대해 아무것도 모르는구만. 그런 게 되는 녀석이었으면 저 상황까지 가지도 않았어."
84312101300-13 = "그래도, 뭐…… 지금 너도 알다시피, 알아주는 녀석들도 조금은 있으니까 말이야."
84312101300-14 = "누구보다 오랜 기간 알고 지낸 녀석들 중 하나로서 말해주자면, 너무 섭섭해하지 말라고. 너 정도면 굉장히 각별한 편에 속하니까."
84312101300-15 = "녀석한테는 당연하고…… 뭐, 이번 일로 나한테도 어느 정도는 말이지."
84312101300-16 = "솔직히 트리니티의 고상한 아가씨가, 이 정도로 잘해 줄 거라는 기대는 하지 않았었거든. 아, 이런 말 하면 큰일나나?"
84312101300-18 = "네루……"
84312101300-19 = "후후…… 티파티의 임원이었다면 그랬겠지만, 지금은 괜찮아요. 지금은 그런 입장으로 와 있는 게 아니니까요."
84312101300-20 = "꽤 느낀 건데, 의외로 융통성이 있네. 내가 들었던 지금 티파티의 이미지와는 다르단 말이지."
84312101300-21 = "거기까지 가면 제가 아니라 제 친구에 대한 이야기가 되니, 저도 가만히 있지 않을 거예요."
84312101300-22 = "어이쿠, 그건 무서운걸? 미안, 미안. 취소할게."
84312101300-23 = "……그래서, 이제 돌아갈 거야?"
84312101300-24 = "아무래도 그래야겠지요. 네루도 같이 갈 건가요? 선생님을 뵈러 갈 예정인데."
84312101300-25 = "선생? ……뭐, 그럴까? 이제 와서 딱히 같이 있는 걸 숨길 필요도 없고."
84312101300-26 = "그러죠. 이래저래 하고 싶은 이야기가 많네요."
84312101300-30 = "……아, 그 전에. 여기 잠깐 와 봐."
84312101300-34 = "……? 네? 갑자기 무슨……"
84312101300-47 = "좋아. 잘 나왔네."
84312101300-48 = "……네루?"
84312101300-52 = "이제 같이 찍은 이걸 여기다 두고 가면, 나중에라도 녀석이 왔을 때 볼 거야."
84312101300-53 = "리오 그 녀석이 뭔가 알아서 살갑게 해주는 건 기대하는 사람만 피곤하다고."
84312101300-54 = "대신 우리가 이렇게 먼저 뭔가 해두면, 그건 또 어련히 다 찾아보니까 말이야. 분명 좋아할걸? 말은 그렇게 안 해도."
84312101300-55 = "……과연……"
84312101300-56 = "확실히 두 분은 오래된 사이의 느낌이 나는군요. 뭔가 저에게도 조금은 낯익은 감각이네요."
84312101300-57 = "자, 그럼 슬슬 돌아갈까. 너무 오래 있으면 또 사람들이 찾을 테니까."
84312101300-58 = "좋아요. 그만 돌아가죠."
84312101300-64 = "또 봐요, 리오."
84312101300-69 = "혼잣말이야?"
84312101300-70 = "CCTV에 해놓는 말이에요. 나중에 오면 볼 테니까요."
84312101300-71 = "적응 빠르네. 그래, 그렇게 하는 거야."
84312101300-72 = "그럼 나도 간다!! 나중에 또 보자고, 인마!!"
84312101300-80 = "…………."
84312101300-86 = "……또 보자."
