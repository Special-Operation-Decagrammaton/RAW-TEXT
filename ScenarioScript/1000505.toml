[translation]
1000505-1 = "희미하지만 빛나는"
1000505-2 = "빛을 만드는 것도 신기한데, 그걸로 자기 몸을 보호하다니, 신기하지."
1000505-3 = "캄캄한 심해에서 빛을 만들면 포식자에게 들키지 않을까 싶지만, 혼자라면 모를까 오히려 여럿이서 모여 군체를 이루면 위협이 되나봐."
1000505-4 = "으헤~ 어떤 모습일까? 분명 굉장할 거야."
1000505-5 = "[s1] \"물고기 얘기하러 부른 건 아닐 테고.\"\n[s2] \"오늘은 뭘 찾을 거야?\""
1000505-6 = "으헤~ 성질도 급하구만, 선생도."
1000505-7 = "으헤~ 성질도 급하구만, 선생도."
1000505-8 = "드디어 트레져헌터의 혼이 깨어난 건가. 으헤, 좋은 징조잖아."
1000505-9 = "아비도스 학교는 역사가 굉장히 오래된 곳이라서 여기 저기 숨겨진 공간을 찾아내는 재미가 있지!"
1000505-10 = "저번에는 창고였으니, 이번에는 폐쇄된 구교사로 가볼까?"
1000505-13 = "아비도스 제 3 구교사"
1000505-14 = "콜록, 콜록…… 여기도 먼지가 많네."
1000505-15 = "여기저기 잔뜩 잡동사니들도 많이 쌓여 있고. 대부분 버리고 간 것들이라 쓸만한 건 없겠지만."
1000505-16 = "선생, 조심해. 어디 걸려 넘어질 수도 있어."
1000505-17 = "[s3] \"낮에 오는게 좋지 않을까?\"\n[s4] \"으스스하네…….\""
1000505-18 = "으헤, 한 밤중의 보물찾기가 로망이 있잖아. 게다가 다른 사람들한테 들킬 일도 없고."
1000505-19 = "으헤~ 선생, 설마 겁먹은 거야?"
1000505-20 = "괜찮아, 괜찮아. 아 아저씨 뒤에 딱 붙어서 오라고."
1000505-21 = "그럼 계속 가볼까."
1000505-22 = "좋은 물건을 찾으면 바로 주워야 해. 보물찾기는 찾은 사람이 주인인 룰이니까."
1000505-25 = "흐음. 꽤 돌아다녀봤지만 쓸만한 게 보이지 않는데……."
1000505-26 = "역시 괜찮은 물건들은 이미 다 가져갔겠지……."
1000505-29 = "(드르륵)"
1000505-32 = "여긴 아주 오래 전 선배들이 쓰던 곳인가봐. 나도 와본 적은 없어서 잘 모르겠지만……."
1000505-33 = "(부스럭)"
1000505-34 = "……응?"
1000505-35 = "뭔가 소리가 들리지 않았어?"
1000505-36 = "저쪽이었는데……."
1000505-37 = "으, 으아아아아?!"
1000505-39 = "(콰당탕)"
1000505-40 = "(찍, 찍-)"
1000505-41 = "……"
1000505-42 = "으, 으아……. 깜짝 놀랬어……."
1000505-43 = "(벌떡) 쥐였구나……. 사람 놀라게 하고 있고."
1000505-44 = "덕분에 쌓아둔 잡동사니들이 쏟아졌잖아."
1000505-45 = "[s] \"…………….\""
1000505-46 = "……."
1000505-47 = "으헤에. 뭐지, 선새-앵? 그 의기양양한 표정은?"
1000505-48 = "설마, '호시노 너도 놀라긴 하는구나?' 하고 으스댈 셈인가아-"
1000505-49 = "뭐, 아무리 나라도 이런 상황이면 놀랄 수 밖에 없단 말이지?"
1000505-50 = "……뭐, 그런 걸로 뿌듯해한다면야…… 어라?"
1000505-52 = "이것 봐, 선생. 방금 쏟아진 잡동사니들 중에…… 빛나는 게 있어."
1000505-53 = "[s] 희미하게 빛나는 종이를 줍는다."
1000505-55 = "이건…… 야광스티커잖아?"
1000505-56 = "그것도 물고기 스티커야!"
1000505-57 = "이건 열대어고…… 이건 소라, 오징어, 개복치…… 으헤, 해파리도 있어!"
1000505-58 = "헤에, 선생. 굉장한 보물을 주웠네! 완전 대박이야!"
1000505-59 = "[s] \"오래 된 거라 빛이 희미한데…….\""
1000505-60 = "헤에, 그게 멋진 부분이라고. 설명은 잘 못하겠지만……."
1000505-61 = "아무도 알아주지 않는 곳에서 혼자서 이렇게 빛나고 있었던 거니까."
1000505-62 = "[s5] \"호시노에게 줄게.\"\n[s6] \"선물이야.\""
1000505-63 = "응? 나, 나한테 주는 거야?"
1000505-64 = "응? 나, 나한테 주는 거야?"
1000505-65 = "그치만 주운 건 선생이니까…… 이건 선생이 가져야하는데…… 보물 찾기의 룰은……."
1000505-66 = "[s] 건네준다."
1000505-69 = "아…… 우…… 고, 고마워, 선생."
1000505-72 = "헤에……."
1000505-73 = "……. 귀여운 물고기들이 오밀조밀하게 잔뜩 있어!"
1000505-74 = "방 천정에 붙여놔야지! 불 끄고 누워서 보면 분명 굉장할 거야!"
1000505-75 = "으헤-, 빨리 돌아가자, 선생!"
1000505-77 = "(즐거워하는 호시노와 함께 집으로 돌아갔다.)"
