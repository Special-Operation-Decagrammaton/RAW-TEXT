[translation]
2002403-1 = "교양인의 말투"
2002403-2 = "트리니티 다과회실"
2002403-3 = "(나기사와 함께 샬레의 업무에 관해 대화를 나누던 중…….)"
2002403-4 = "그러고 보니 최근 학원 내에서 교양 없는 말을 하는 학생들이 늘어난 것 같아 걱정이네요."
2002403-5 = "[s] \"교양 없는 말?\""
2002403-6 = "네. 트리니티의 학생 답지 않게 상스럽고 부적절한 말을 하는 학생들이 최근 크게 늘어났답니다."
2002403-7 = "아무래도 다른 학원의 상스러운 학생들과 어울리다 좋지 않은 물이 든 모양인데……"
2002403-8 = "학생들에게 조금 주의를 줄 필요가 있겠어요."
2002403-9 = "[s1] \"나는 잘 모르겠는데…….\"\n[s2] \"트리니티의 학생들은 대체로 얌전하지 않아?\""
2002403-10 = "물론 대부분의 트리니티 학생들은 여전히 교양 있는 말씨를 사용한답니다."
2002403-11 = "물론 대부분의 트리니티 학생들은 여전히 교양 있는 말씨를 사용한답니다."
2002403-12 = "제가 말씀드리는 것도 일부 문제 학생들의 이야기지요."
2002403-13 = "제가 보거나 들은 상스러운 말의 예를 몇 가지 들자면……"
2002403-14 = "……줄임말을 사용한다든가."
2002403-15 = "[s] \"줄임말?\""
2002403-16 = "네. 최근 모모톡과 같은 메신저를 통해 대화를 하는 경우가 늘며, 타자의 편의를 위해 단어나 문장을 줄여 말하는 학생이 종종 있습니다."
2002403-17 = "'생일파티'를 '생파', '감사합니다'를 '감사' 등으로 줄여 쓰는 것처럼 말이지요."
2002403-18 = "……심지어 얼마 전에는 '눈새'라는 말을 듣고 무슨 뜻인지 한참을 고민했다니까요."
2002403-19 = "[s] \"학생인데 그 정도의 유행어는 괜찮지 않아?\""
2002403-20 = "아니요. 용납할 수 없습니다."
2002403-21 = "아무리 편의 때문이라지만 문장이나 단어를 멋대로 줄여 은어처럼 이해하기 어렵게 만드는 행위는 올바른 대화 자세라고 할 수 없습니다."
2002403-22 = "특정 집단에서만 통용되는 은어를 즐겨 사용하는 사람은 아무리 행동이 점잖더라도 경박해 보이며, 쉽게 타인의 신뢰를 잃게 됩니다."
2002403-23 = "키보토스의 뭇 학생들에게 선망과 존경을 받는 트리니티 종합학원의 학생이라면 교양있고 품격있는 말을 사용해야지요."
2002403-24 = "……그 외에도 말끝에 '~페로' 같은 정체불명의 어미를 붙인다든가, 상대를 위협하는 폭력적인 어휘를 사용하는 학생들도 더러 있었습니다."
2002403-25 = "이런 엇나가는 학생들을 계도하고 바로잡는 것 또한 티파티의 호스트로서 가져야 할 엄연한 책무이지요."
2002403-26 = "[s] \"나기사는 그런 말을 쓰지 않는 거야?\""
2002403-27 = "물론입니다. 여러 학생에게 모범을 보여야 할 티파티의 호스트가 먼저 불량한 말을 쓴다면 다른 학교의 학생들이 저희 학원을 어떻게 여기겠나요?"
2002403-28 = "평소부터 올바른 언어 습관을 몸에 익혀 두면 어떤 상황에서도 품위 있고 우아하게 말할 수 있답니다."
2002403-29 = "크게 당황하거나 감정이 동요하는 일 하나 없이—"
2002403-33 = "저…… 나, 나기사 님……."
2002403-34 = "갑자기 무슨 일인가요? 그렇게 당황한 표정을 하고서는."
2002403-35 = "그게…… 황급히 보고 드려야 할 만한 문제가 발생해서……."
2002403-36 = "정의실현부의 보고에 따르면 지난 심야에 수영복 차림으로 트리니티 광장의 분수대를 활보하는 학생이 있었다고……."
2002403-38 = "뭐, 뭐라고요?!"
2002403-43 = "흠, 흠……"
2002403-44 = "정의실현부의 학생들이 무언가 잘못 본 게 아닐까요?"
2002403-45 = "저희 트리니티에 그런 상스러운 차림을 한 학생이 있을 리가 없잖습니까."
2002403-46 = "……돌아가서 다시 한번 확실히 진상을 파악하도록 하세요."
2002403-47 = "[s] \"나기사, 방금…….\""
2002403-48 = "네? 무슨 문제라도 있었나요?"
2002403-49 = "저는 평소처럼 느긋하고 우아하게 학원의 일을 처리했을 뿐인데요."
2002403-50 = "다시 한번 말씀드리지만 평소부터 올바른 언어 습관을 몸에 익혀 두면 어떤 상황이라도—"
2002403-53 = "나, 나기사님. 큰일입니다! 방금 도서부의 부원들이 도서를 연체한 학생들을 독촉하기 위해 교내에서 최루탄을 터트렸다고……."
2002403-54 = "방금 다시 들어온 소식에 의하면 다도부의 일부 학생들이 다과로 제공된 오이 샌드위치에 항의하며 차 상자를 수영장에 통째로 던져버리고 있다고 합니다!"
2002403-55 = "이를 막기 위해 정의실현부가 출동하여 소동을 진압한 결과, 제3 교사의 안뜰이 전소되었다고……."
2002403-59 = "정말이지……"
2002403-60 = "……다들 뭐가 그렇게 문제라서 하루도 빠짐없이 말썽을 일으키는 건지……"
2002403-61 = "……잘 들으세요. 이곳은 오랜 역사와 전통을 갖추고 있는 트리니티 종합학원입니다."
2002403-62 = "트리니티의 학생답지 않은 품위 없는 행동을 일삼으며, 학원의 이미지를 저해하는 학생이 제 눈에 다시 뜨인다면……"
2002403-63 = "입이 미어터질 때까지 마카롱을 쑤셔 넣어 버릴 테니까요!"
2002403-64 = "[ns] \"………….\""
2002403-65 = "……아."
2002403-66 = "그, 그게 그러니까…… 방금 그 말은, 저……."
2002403-67 = "오, 오해입니다! 해명을 하게 해주세요!"
2002403-68 = "[s3] \"설명하지 않아도 괜찮아.\"\n[s4] \"나기사도 화날 때는 터트려도 괜찮으니까…….\""
2002403-69 = "그, 그러니까 오해라고요!"
2002403-70 = "그, 그러니까 오해라고요!"
2002403-72 = "(이후, 한동안 나기사의 당황한 표정을 감상하며 변명을 들어주었다.)"
