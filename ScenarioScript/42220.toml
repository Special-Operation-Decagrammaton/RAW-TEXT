[translation]
42220-1 = "제22화;어제와 내일"
42220-9 = "<경고, 경고! 침입자 자동 요격 시스템이 무력화되었습니다.>"
42220-10 = "<사일로의 보안 담당자는 주요 격벽을 폐쇄하고, 기밀문서를 파기한 뒤, 침입자를 파악하여 조치를……>"
42220-16 = "(……나는 무얼 하기 위해 여기 남아있는 거지?)"
42220-17 = "(나는 그저…… SRT 학원을 부활시키기 위해 계속해서 명령을 수행했을 뿐인데……)"
42220-19 = "(……어째서 이곳에서 자폭 버튼을 들고 서 있게 된 거지?)"
42220-29 = "<다시 한번 경고합니다. 기재 태세 Z를 발령합니다. 사일로의 보안 담당자는 주요 격벽을 폐쇄하고……>"
42220-34 = "……그래. 오래 생각할 필요는 없어."
42220-35 = "늘 그래왔듯이. 작전을 성공시키기 위해 필요한 것만 정리하고, 나머지는 버리면 되는 거야."
42220-36 = "이번 작전의 목표는……"
42220-37 = "……이 탄두를 기폭 시키는 것."
42220-45 = "……오래 기다렸지!"
42220-57 = "FOX 4……? 어째서 여기에……"
42220-58 = "후배들을 피해 통풍 배관으로 우회해 오느라고 조금 늦었어."
42220-59 = "역시 비상시에도 W 구역은 따로 폐쇄되지 않은 모양이야."
42220-60 = "아야야…… 사키, 그 녀석 내가 쓰러진 걸 보고도 배에 다섯 발은 더 쐈다니까?"
42220-61 = "상대가 움직이지 않을 때까지 제압하라고 가르치긴 했지만, 너무한 거 아냐?"
42220-63 = "쓰러진 적의 처리를 어설프게 했다가 역으로 기습을 당하는 일은 실내전에서 자주 있는 일이니까."
42220-64 = "사키 쨩이 FM 답게 잘 처리한 거니까 너무 화내지 마."
42220-69 = "어째서……"
42220-70 = "어째서 돌아가지 않았지?"
42220-71 = "어……"
42220-72 = "……소대장이 여기 있으니까?"
42220-73 = "적이 방어를 돌파하면 복귀하지 말고 지상으로 올라가라고 전에 명령했을 텐데—"
42220-75 = "……유키노. 우리가 없는 틈에 이곳에서 책임지고 탄두를 기폭시키려 한 거지?"
42220-76 = "자신이 목숨을 잃을지도 모르는데 말이야."
42220-77 = "………."
42220-78 = "……작전에 불필요한 정보다. 너희가 알 필요는—"
42220-80 = "알 필요가 있어!"
42220-84 = "유키노는 FOX 소대의 소대장이기 이전에…… 오랜 친구잖아?"
42220-85 = "오랜 친구가 함께 저지른 일을 혼자서 책임지기 위해 심연으로 뛰어들려 한다는데…… 그걸 그대로 두고 볼 수는 없어."
42220-86 = "베테랑 특수부대원 답지 않은 발언이군."
42220-87 = "그걸 판단하는 건 대원 개개인이 아니라 책임을 질 수 있는—"
42220-89 = "유키노."
42220-90 = "이 작전은 처음부터 뒤틀려 있었어."
42220-91 = "우리는 SRT를 부활시킨다는 대의 때문에 손에 너무 많은 흙을 묻혔어."
42220-92 = "이렇게 더러워진 손으로 SRT의 정의를 논하기는 어렵겠지만……"
42220-93 = "여기에 책임을 피하기 위해 친구를 희생시켰다는 오욕까지 더하고 싶지는 않아."
42220-94 = "당연히 후배들에게 이 책임을 미루는 건 더더욱 싫고."
42220-99 = "이 오명은 우리 선에서 책임지고…… 저 아이들을 돌려보내자."
42220-104 = "……그래."
42220-110 = "이 모든 것은……"
42220-114 = "SRT 학원의 부활을 위하여!"
