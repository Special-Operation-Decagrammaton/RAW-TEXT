[translation]
11020-2 = "제2화;아비도스에서의 첫날"
11020-3 = "아비도스 주택가"
11020-4 = "(짹- 짹짹-)"
11020-5 = "……음?"
11020-6 = "(끼이이이익--)"
11020-7 = "……"
11020-8 = "……. 저기……"
11020-19 = "……."
11020-20 = "……괜찮아?"
11020-21 = "[s1] 고개를 끄덕인다.\n[s2] 도와달라고 한다."
11020-22 = "아아. 살아있었네. 길 한가운데 쓰러져 있어서 시체인 줄 알았어."
11020-23 = "……뭐? 배가 고파서 쓰러져 있었다고?"
11020-24 = "……노숙자?"
11020-25 = "설마 강도를 당한 거야? 아니면 사고……?!"
11020-26 = "……뭐? 배가 고파서 쓰러져 있었다고?"
11020-27 = "노숙자는 아니란 건가?"
11020-28 = "아아……"
11020-30 = "아비도스 주택가"
11020-31 = "(스윽)"
11020-32 = "볼일 때문에 이 마을에 왔는데 며칠 동안 가게를 하나도 본 적 없어서 탈수와 배고픔으로 탈진했다는 거야?"
11020-33 = "단순한 조난객이었구나."
11020-34 = "아아. 여기는 원래 그래. 음식을 사거나 할 수 있는 가게는 없어진지 오래거든."
11020-35 = "이쪽 말고 한참 더 외곽으로 나가면 시내가 있긴 해."
11020-36 = "잘 모르겠다고? #n……그렇군. 이 지역은 처음인가보네."
11020-37 = "……잠깐만."
11020-39 = "(뒤적뒤적)"
11020-42 = "자, 에너지 드링크."
11020-43 = "라이딩 용이지만…… 지금은 이런 것 밖에 없어서. 그래도 도움이 될 거야."
11020-45 = "기다려 봐, 담을 컵이……."
11020-46 = "[s] 입을 대고 마신다."
11020-47 = "(벌컥벌컥)"
11020-48 = "……!"
11020-49 = "아……. 그거……."
11020-50 = "……아니. 아무 것도 아니야. ……신경 쓰지 마."
11020-51 = "[s] 살려줘서 고맙다고 말한다."
11020-52 = "음."
11020-53 = "모습을 보니 총학생회에서 온 어른 같은데……. 고생이 많았겠네. #n학교에 볼일이 있어서 온 거야?"
11020-54 = "이 주변에는 우리 학교 밖에 없는데…… 혹시……."
11020-55 = "<아비도스>를 찾아 온 거야?"
11020-56 = "[s] 고개를 끄덕인다."
11020-57 = "……그렇네. 오랜만의 손님이구나."
11020-58 = "그럼 내가 안내해줄게. 바로 근처거든."
11020-59 = "뭐? 못 움직이겠다고? 배가 고파서?"
11020-60 = "음……. 어쩌지."
11020-61 = "[s] 태워달라고 한다."
11020-62 = "아니, 이건 1인승이라……."
11020-63 = "[s] 그럼 업어달라고 한다."
11020-64 = "……."
11020-65 = "그래. 차라리 그 편이 낫겠네."
11020-66 = "바이크는 이쪽에다 두고……."
11020-68 = "자……."
11020-71 = "(스윽)"
11020-72 = "……. 앗. 잠깐."
11020-73 = "……."
11020-74 = "아……. 한참 라이딩하고 와서……. 딱히 땀을 많이 흘린 건 아니지만 그래도……."
11020-75 = "보통은 학교 안에 있는 샤워실을 사용하거든. 여벌 옷도 거기 있고……."
11020-76 = "응? 아니라고?"
11020-77 = "……오히려 좋은 냄새가 난다고?"
11020-78 = "……."
11020-79 = "……으음. 아, 아니. 잘 모르겠지만……. #n그렇게 말한다면 상관없겠지."
11020-80 = "자……."
11020-82 = "(스윽)"
11020-83 = "꽉 잡아."
11020-85 = "아비도스 대책위원회"
11020-87 = "다녀왔어."
11020-88 = "어서 와, 시로코 선……배?"
11020-89 = "…… 우왓? 뭐야, 뭘 업고 온 거야?!"
11020-90 = "와아- 시로코 쨩이 어른을 납치해 왔어요!"
11020-91 = "납치?! 그게 아니면 시체?! #n설마 시로코 선배 결국 범죄를……!!"
11020-92 = "진정해, 진정해. 진정하고 시체를 숨길 장소를 물색해!#n체육 창고에 있는 삽과 곡괭이를 가져와서……."
11020-93 = "……."
11020-94 = "(털썩)"
11020-95 = "아니……. 평범한 어른이야. 학교 손님이라는데."
11020-96 = "네? 시체가 아니었어요……?"
11020-97 = "납치가 아니라 학교 손님?"
11020-98 = "으음……."
11020-99 = "[s] 반갑게 인사한다."
11020-100 = "와- 깜짝 놀랐어요. 손님이 우리 학교에 찾아온 건 오랜만이에요."
11020-101 = "그, 그러게요…… 우리 학교에 찾아올 손님이 있었던가……."
11020-103 = "[ns] \"<샬레>의 담당 선생님이야. 잘 부탁해.\""
11020-105 = "……아, 아아?!! 설마?!"
11020-106 = "뭐!? 연방수사부 <샬레>의 선생님이었어?!"
11020-107 = "우와-☆ 우리가 신청한 지원요청이 받아들여진 거네요! 다행이에요, 아야네 쨩!"
11020-108 = "네! 드디어…… 탄약과 보급을 지원받을 수 있게 되었어요."
11020-109 = "아, 이 사실을 빨리 호시노 선배에게 알려야……. #n어라? 호시노 선배는 어디 갔죠?"
11020-110 = "부장은 옆방에서 자고 있어. 내가 가서 데려올게."
11020-112 = "(타타타타타타타타탕-!)"
11020-113 = "초, 총소리?!"
11020-114 = "!!"
11020-117 = "우호호호호!"
11020-118 = "공격, 공격이다!! 저 놈들은 이제 탄약이랑 보급이 없으니까! 습격해!! 학교를 점령하는 거다!!"
11020-120 = "(투타타타타타타타타타타-!!)"
11020-123 = "와앗?! 무장한 다수의 인원이 학교 쪽으로 접근하고 있어요! 카타카타 헬멧단인가 봐요!"
11020-124 = "이놈들……!! 또 다시 오다니."
11020-126 = "호시노 선배를 데려왔어! 선배, 정신차려! 잠 좀 깨라고!"
11020-127 = "음냐……. 아직 일어날 시간은 아닌데."
11020-128 = "호시노 선배! 헬멧단이 다시 습격했어요! 그리고 이쪽은 샬레의 선생님이시고요."
11020-129 = "이야~ 그건 큰일이구만…… 음냐. 그리고 반가워, 선생."
11020-130 = "정신 차려, 선배! 출동이야! 장비 챙겨! 학교를 지켜야지!"
11020-131 = "하아아--암. ……음냐. 것 참, 잠도 못 자게 괴롭히는구만. 헬멧단 녀석들."
11020-134 = "(철컥) 바로 출격하자. 선생님의 방문으로 탄약과 보급은 문제없으니까."
11020-135 = "응, 다 함께 출동이에요☆"
11020-138 = "제가 상황을 맡겠습니다."
11020-139 = "선생님은 이곳에서 저희를 지원해 주세요!"
