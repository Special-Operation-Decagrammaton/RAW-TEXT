[translation]
1001203-1 = "트레이너와 함께"
1001203-2 = "밀레니엄 근교 쇼핑몰"
1001203-4 = "(늦잠으로 스미레와 약속 시간이 약 30분 정도 늦어버렸다.)"
1001203-5 = "[s] 스미레를 찾아본다."
1001203-6 = "(이 근처에서 만나기로 했는데 스미레가 보이지 않는다.)"
1001203-7 = "[s] \"……음?\""
1001203-13 = "후우, 후우."
1001203-14 = "앗? 트레이너!"
1001203-15 = "기다리고 있었습니다."
1001203-16 = "[s] \"늦어서 미안.\""
1001203-17 = "괜찮습니다. 트레이너."
1001203-18 = "안 그래도, 오늘 약속으로 운동량을 채우지 못할 것 같아 걱정이었는데."
1001203-19 = "시간이 남은 덕분에 잠깐 스쿼트를 하고 있었습니다."
1001203-20 = "역시 스쿼트는 좋은 운동이네요."
1001203-21 = "얼마 하지 않았는데도 벌써 하체의 근육 전체가 당겨지는."
1001203-22 = "[s] \"어, 다른 사람들이 신경 쓰이진 않아?\""
1001203-23 = "느낌이……. 네?"
1001203-24 = "아……."
1001203-25 = "아아아앗!"
1001203-28 = "[s] \"스, 스미레!\""
1001203-29 = "(스미레가 사라진 방향으로 달려갔다.)"
1001203-31 = "우, 우으으으……."
1001203-32 = "죄, 죄송합니다. 트레이너."
1001203-33 = "기다리는 시간 동안 뭘 할까 생각하다가."
1001203-34 = "마침, 스쿼트를 하기에 딱 좋을 것 같다는 생각에."
1001203-35 = "잠깐 해본다는 게 그만, 지나치게 열중해버렸군요."
1001203-36 = "호, 혹시……."
1001203-37 = "트레이너가 보시기에도, 제가 많이 부담된다고 하시면……."
1001203-38 = "[s1] \"아냐, 그럴 리가 없잖아.\"\n[s2] \"열심히 운동하는 모습, 보기 좋아.\""
1001203-39 = "…… 말씀 감사합니다."
1001203-40 = "…… 말씀 감사합니다."
1001203-41 = "하지만 혹시라도 이런 제가 신경 쓰이신다면."
1001203-42 = "꼭 말씀을 주셨으면 좋겠습니다."
1001203-43 = "제 근육도 물론 중요하지만."
1001203-44 = "그것보다는 트레이너가, 더……."
1001203-45 = "……."
1001203-46 = "[s] \"?\""
1001203-47 = "아, 아닙니다! 아무것도 아닙니다!"
1001203-48 = "그, 그럼! 단백질 보충제를 사러 가볼까요?"
1001203-49 = "가시죠!"
1001203-52 = "(왠지 모르게 부끄러워하는 스미레와 함께 쇼핑하면서 단백질 보충제를 구매했다.)"
1001203-54 = "밀레니엄 근교 거리"
1001203-55 = "오늘은 감사했습니다. 트레이너."
1001203-56 = "덕분에 좋은 제품으로 구할 수 있었어요."
1001203-57 = "특히, 특가 세일로 몇 개 안 남아있던 단백질 보충제를 멀리서 발견하시자마자."
1001203-58 = "삽시간에 쇼핑몰 안의 수많은 인파를 뚫고 남은 보충제를 쓸어 담던 트레이너의 모습은."
1001203-59 = "생활력과 행동력이 넘치는 실로 멋진 어른, 그 자체였습니다."
1001203-60 = "그런 트레이너의 모습에, 뭘 산 건지 궁금해하는 주변의 반응들도 재미있었죠."
1001203-61 = "저라면 그런 행동은 불가능했을 겁니다."
1001203-62 = "[s3] \"아하하, 부끄럽네.\"\n[s4] 힘껏 으스댄다."
1001203-63 = "후훗. 트레이너는 정말 재미있는 분이시네요."
1001203-64 = "후훗. 트레이너는 정말 재미있는 분이시네요."
1001203-65 = "아무튼, 이정도면 충분히 구매한 것 같습니다."
1001203-66 = "네? 단백질 보충제를 너무 많이 산 것 아니냐고요?"
1001203-67 = "보충제는 생각보다 금방 먹거든요."
1001203-68 = "그리고……."
1001203-69 = "누군가에게 곧 필요할 것 같기도 해서요."
1001203-70 = "응? 그게 누구냐고요?"
1001203-71 = "그건, 비밀입니다."
1001203-72 = "아마, 곧 알게 되실 거예요. 후훗."
1001203-73 = "그럼 전 슬슬 돌아가 봐야 할 것 같습니다."
1001203-74 = "조심히 들어가세요. 트레이너."
1001203-77 = "(스미레가 말한 비밀의 주인공이 누구일지 생각하며 집으로 돌아갔다.)"
