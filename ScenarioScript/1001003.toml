[translation]
1001003-1 = "거리 두기"
1001003-2 = "아비도스 학교 근교"
1001003-3 = "(아비도스 근교에서 시로코를 기다리고 있다.)"
1001003-4 = "[s] \"시로코가 곧 올 때가 되었는데……\""
1001003-6 = "……선생님? 여기에는 무슨 일이야?"
1001003-7 = "내가 여기서 러닝을 한다는 이야기를 듣고 에너지 드링크를 전해주러 왔다고……?"
1001003-8 = "으음. 고, 고맙긴 한데 지금은 조금 곤란한데……."
1001003-9 = "[s] \"자, 여기 드링크.\""
1001003-14 = "……."
1001003-15 = "[s] \"……?\""
1001003-20 = "[s] \"……시로코?\""
1001003-21 = "……음."
1001003-22 = "……아니. 지금은 조금……."
1001003-23 = "그러니까…… 러닝을 한 직후라서, 딱히 신경 쓰는 건 아니지만……!"
1001003-24 = "미, 미안. 선생님…… 지금은 곤란해."
1001003-25 = "잠시 후에 학교에서 보자."
1001003-28 = "대책위원회 동아리실"
1001003-33 = "(시로코가 한결 개운해진 표정으로 나타났다.)"
1001003-34 = "어서 와, 선생님."
1001003-35 = "아까 주려던 에너지 드링크? 응, 고맙게 받을게."
1001003-41 = "……응?"
1001003-42 = "아까 하고는 다르다고? 그러니까 그건……"
1001003-43 = "으, 으음……."
1001003-44 = "그건……."
1001003-45 = "아, 아, 아무것도 아니야."
1001003-49 = "[s] \"……?!\""
1001003-50 = "(그러고 보니 시로코에게서 은은하게 비누 향기가 나고 있었다.)"
1001003-51 = "(뭔가 실수한 것 같으니 다음에 사과해야겠다.)"
