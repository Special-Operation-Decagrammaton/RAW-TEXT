[translation]
1601503-1 = "슈가 러시"
1601503-2 = "(연습실로 찾아가, 아이리의 키보드 연습을 도와주었다. 문제는 생각보다 금방 해결되었다.)"
1601503-3 = "(……하지만 진짜 문제는 연습이 모두 끝나고 나서, 돌아오는 길에 시작됐다.)"
1601503-5 = "설마 이렇게 갑자기 비가 쏟아질 줄은……."
1601503-6 = "이런 건 생각 못 했는데 말이에요. 덕분에 이렇게 모르는 건물 앞에 갇혀 있게 됐고……."
1601503-7 = "우산도 없고, 편의점도 주변에는 딱히 안 보이고……."
1601503-8 = "……으으. 뭔가 괜히 저 때문에 비까지 맞으시게 만드는 느낌이네요. 죄송해요."
1601503-9 = "[s1] \"무슨 말이야. 비는 전혀 상관없잖아.\"\n[s2] \"이런 것도 나름대로 괜찮지 않아?\""
1601503-12 = "으음……. 역시 그런 거려나요. 좋게 생각해 주시면 저야 당연히 감사하지만요."
1601503-13 = "그래도 뭔가 아쉽네요. 동아리실까지는 얼마 남지도 않았는데, 조금만 더 달렸으면……."
1601503-17 = "……달렸으면……?"
1601503-18 = "어라……. 어쩌면 괜찮을 지도……?"
1601503-19 = "[s3] \"……응? 지금 뭐라고…….\"\n[s4] \"설마 달리려고? 이 장대비를?\""
1601503-22 = "물론 그냥 뛴다는 건 아니에요! 우산을 대신할 거라도 찾아서, 위는 가려야죠!"
1601503-23 = "마침……."
1601503-27 = "……이런 것도 있으니까요!!"
1601503-28 = "[s5] \"아, 아이리!? 이건…….\"\n[s6] \"아이리가 입던 재킷이잖아!\""
1601503-31 = "헤헤. 이래 봬도 꽤 크다고요? 원래부터 헐렁한 느낌으로 ."
1601503-32 = "같이 쓰고 달리기에 충분한 사이즈니까요! 어때요, 선생님! 나름대로 좋은 아이디어죠? 그렇죠?"
1601503-33 = "……네?"
1601503-34 = "그냥 조금 더 기다리자고요? 으음……? 어째서……?"
1601503-35 = "그런 일에 제 재킷을 쓸 수는 없다고요? 저는 괜찮은데요……?"
1601503-36 = "아……. 역시 좀 부담스러우실 것 같기도 하네요……. 하하. 그 생각은 못해봤다……."
1601503-37 = "으음……."
1601503-38 = "그래도 재밌을 것 같았는데……. 묘하게 아까운 느낌이네요. 헤헤……."
1601503-42 = "[ns7] \"……그럼 뛰어 볼까!!\"\n[ns8] \"이번 만입니다.\""
1601503-45 = "……!!"
1601503-49 = "……네!!"
