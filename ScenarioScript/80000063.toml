[translation]
80000063-1 = "사전에 미리 대처"
80000063-3 = "(공원 벤치에서 기다리고 있으니, 잠시 후 약속대로 하루카가 허둥지둥 달려왔다.)"
80000063-4 = "느, 늦어서 죄송합니다. 선생님!! 부르셔서 바로 달려왔습니다!!"
80000063-5 = "서, 설마 계속 기다리고 계셨던 건가요!? 그, 그럴 수가! 저 같은 게 감히 선생님의 귀하신 시간을……!!"
80000063-6 = "이, 이걸 뭘로 사죄드려야 할지……. 배, 배라도 갈라야 할까요!? 죽음으로 사죄를!!"
80000063-7 = "……네? 괘, 괜찮으시다고요? 아……. 네, 네……."
80000063-8 = "그, 그런데 어떤 이유로……. 아, 아니. 절대 따지거나 하는 그런 건방진 의도는 아니고요……."
80000063-9 = "네……? 발렌타인 데이……요……? 그, 그야……. 저도 알고는 있지만……."
80000063-10 = "주, 준비하고 있던 거 아니었냐고요……!? 마, 맞습니다! 맞아요! 역시 선생님……!"
80000063-11 = "……어……?"
80000063-12 = "그, 그런데 어떻게 선생님께서 그걸……!? 그리고 어째서 선생님께서 먼저 절 불러 주시는……."
80000063-13 = "[s1] (하루카가 일을 키우기 전에 응해줘야…….)\n[s2] (폭탄 설치 같은 괜한 고생은 예방해야지.)"
80000063-14 = "……???"
80000063-15 = "……???"
80000063-16 = "……선생님?"
80000063-17 = "아. 초, 초콜릿이요? 지금 있어요! 지금 있습니다! 구한 뒤로 항상 품고 있었으니까요!"
80000063-18 = "여, 여기……!!"
80000063-23 = "시, 실은 제가 평소에 초콜릿을 잘 먹을 일이 없어서……. 그래서 뭘 드려야 할지 몰라서……."
80000063-24 = "이, 일단 가지고 있는 돈에서 제일 비싼 걸로……! 제일 값나가 보이는 걸로 샀습니다!"
80000063-25 = "무, 물론 그래 봐야 저따위가 산 게, 선생님께 무슨 의미가 있겠냐만……."
80000063-26 = "아니 어쩌면 제 손에 닿은 시점에서 쓰레기가 된 걸 수도 있지만……. 그 전에 받아 주신다는 걸 전제로 말씀드렸다니 큰 실례를……."
80000063-27 = "[s3] \"기뻐. 사실 빨리 받고 싶어서 불렀거든.\"\n[s4] \"하루카 걸 기대하고 있었거든. 고마워.\""
80000063-28 = "……네……?"
80000063-29 = "……네……?"
80000063-30 = "제, 제 걸요……? 선생님께서……?"
80000063-31 = "그, 그게 정말이신가요!? 아, 아니! 절대로 선생님께서 하신 말씀을 의심한다거나 그런 건 아니고……!"
80000063-32 = "그냥 믿기지 않아서……! 저, 저따위의 물건을 선생님께서 원하셨다는 게 상상이 도무지 안 가서……!"
80000063-33 = "그, 그럼 이제 전 어떻게 해야 하죠……? 이런 과분하고 말도 안 되는 은혜를 받아버렸는데……. 저는 이제……!!"
80000063-34 = "……네? 웃으면 된다고요……? 그, 그런……!? 그런 정도로!?"
80000063-38 = "……흐……. 흐헤……. 흐헤헤……. 이, 이렇게……요? 헤헤헤헤……."
80000063-39 = "[s5] \"응. 그걸로 충분해. 고마워,\"\n[s6] \"응! 역시 하루카! 귀여워!\""
80000063-40 = "……! 서, 선생님……."
80000063-41 = "……! 서, 선생님……."
80000063-42 = "……헤……."
80000063-47 = "헤헤헤……. 감사합니다, 선생님……."
80000063-49 = "(이후 하루카를 돌려보내고, 혼자서 99% 초콜릿을 힘겹게 뜯어먹었다.)"
