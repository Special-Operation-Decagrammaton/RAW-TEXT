[translation]
1600106-1 = "고장난 아스나"
1600106-2 = "(아무래도 평소와는 다른 상태가 걱정돼 아스나가 있다는 곳으로 향했다.)"
1600106-6 = "(머지않아 저 멀리 벤치에 앉아 있는 아스나의 모습이 보였다.)"
1600106-10 = "(멍-.)"
1600106-11 = "[s] \"……아스나?\""
1600106-12 = "……어……. 으응……."
1600106-16 = "헛!"
1600106-17 = "응? 뭐라고? 어, 주인님!? 언제부터 와 있었어!?"
1600106-18 = "[s1] \"괜찮아? 무슨 일있어?\"\n[s2] \"오늘 따라 상태가 이상해 보이는걸.\""
1600106-19 = "아, 아하하……. 별 일은 아니고, 그냥 가끔씩 이럴 때가 있어."
1600106-20 = "아, 아하하……. 별 일은 아니고, 그냥 가끔씩 이럴 때가 있어."
1600106-21 = "아니, 오히려 너무 별다른 일이 없었다고 해야 하나……? 그래서 그런 거긴 한데……"
1600106-22 = "아무 일도 없는 기간이 너무 길어지면 나도 모르게 멍해진다고 해야 하나……"
1600106-23 = "[s3] \"즉, 이것도 늘 누리던 동물적 직감 때문에?\"\n[s4] \"오히려 오랫동안 자극 받을 일이 없으면……\"\n[s5] \"직감을 못 쓴 나머지, 다른 감각까지 통으로 마비된다?\""
1600106-24 = "으응. 그런 건가?"
1600106-25 = "으응. 그런 건가?"
1600106-26 = "으응. 그런 건가?"
1600106-27 = "그럴 지도……?"
1600106-28 = "아무튼 그러다 보면, 이렇게 아무 생각도 안 들고 집중도 안되는 때가 있……"
1600106-29 = "는데……"
1600106-33 = "(멍-.)"
1600106-34 = "……방금 뭐라고 말했더라, 나?"
1600106-35 = "[s] \"역시 위험해 보이는데요.\""
1600106-36 = "에이~. 괜찮다니까. 이러다가 또 알아서 괜찮아지거든. 자주 있는 일도 아니고……"
1600106-37 = "그치만 지금처럼, 이러는 동안은 누군가의 도움이 필요하단 거지."
1600106-38 = "주인님 덕에 살았어……"
1600106-42 = "……응? 방금 무슨……? 주인님? 언제부터 와 있었어?"
1600106-44 = "(……역시 아무래도 걱정되니 장소를 옮기자고 말했다.)"
1600106-57 = "(혼자서 걷는 것조차 엉성해 보여서, 옆에서 손을 잡아줘야만 했다.)"
1600106-58 = "(그마저도 때때로 멈춰선 아스나의 페이스에 맞추느라,)"
1600106-59 = "(고작 수백 미터 거리에 있는 곳을 걸어가는 데에 한 시간 가까이 걸렸다.)"
1600106-63 = "……으응…… 응…… 뭔가 점점 더 기분이……"
1600106-64 = "어…… 여기는……?"
1600106-65 = "[s6] \"거의 다 왔어.\"\n[s7] \"아스나의 기숙사 앞이야.\""
1600106-66 = "어라…… 나 왜…… 여기에……? 주인님은 왜 우리집 앞으로 찾아온 거야……?"
1600106-67 = "어라…… 나 왜…… 여기에……? 주인님은 왜 우리집 앞으로 찾아온 거야……?"
1600106-68 = "응……? 일단 집으로 들어가서 한숨 자라고?"
1600106-69 = "으응…… 그럴까……"
1600106-70 = "뭔가 잠은 안 오는데 잠이 와……"
1600106-74 = "……계단……"
1600106-75 = "어떻게 올라가더라…… 이렇게……?"
1600106-79 = "어……? 어어……?"
1600106-80 = "[s8] \"아스나!\"\n[s9] (얼른 팔을 뻗어 받아준다.)"
1600106-85 = "(우당탕!)"
1600106-88 = "……응?"
1600106-89 = "이건…… 왜……?"
1600106-93 = "나…… 주인님 위에 올라탔네……? 후후……"
1600106-97 = "주인님 감촉…… 따듯해……"
1600106-98 = "……응?"
1600106-99 = "[s] \"……아스나?\""
1600106-103 = "헛!?"
1600106-104 = "뭐, 뭐야!?"
1600106-105 = "내가 왜 주인님 위에 있는 거야?"
1600106-106 = "아…… 맞다. 방금 나, 넘어졌었지? 계단 위에서? 그걸 주인님이 받아줬었고?"
1600106-107 = "아하하!! 나이스 캐치네! 이런 건 처음 해봐! 재밌어!!"
1600106-108 = "에헤헤…… 메이드인데 오히려 도움을 받아버렸다. 전에는 그냥 쿵 하고 넘어졌는데……"
1600106-109 = "……근데 안 무거워?"
1600106-110 = "[s10] \"괜찮아. 전혀 안 무거워.\"\n[s11] \"뭔가 상태가 나아진 느낌이네. 아스나.\""
1600106-111 = "진짜? 고마워, 주인님!"
1600106-112 = "진짜? 고마워, 주인님!"
1600106-113 = "사실은 방금 전 이거, 꽤 재밌다고 생각했거든."
1600106-114 = "……음? 얼레?"
1600106-115 = "……뭔가 멀쩡해진 기분……!?"
1600106-116 = "[s] \"역시 돌아온 것 같네. 다행이다.\""
1600106-117 = "오……!"
1600106-121 = "풀렸다, 풀렸어! 주인님! 이제 마음대로 움직인다! 팔도! 다리도!"
1600106-128 = "이것 봐, 주인님!! 점프도 된다! 점프!!"
1600106-133 = "점-프!!"
1600106-134 = "(……?)"
1600106-135 = "(……!!!)"
1600106-144 = "― ……후훗, [wa:1400]주인님께 올라타 버렸다!"
1600106-146 = "[wa:100]― 응! [wa:850]몸도 가볍고, [wa:850]지금은 뭐든 할 수 있을 거 같아!"
1600106-149 = "[ns12] \"또, 또 고장 난 거야!?\"\n[ns13] \"으아아 잡아먹지 마세요~!\""
1600106-150 = "[wa:350]― 음. [wa:1500]뭘까나~ [wa:1250]이 느낌……."
1600106-151 = "[wa:350]― 음. [wa:1500]뭘까나~ [wa:1250]이 느낌……."
1600106-154 = "― ……뭐, 어때!"
1600106-156 = "― 쨔안-! [wa:700]언제나의 아스나 쨩으로, [wa:950]부활!"
1600106-159 = "[wa:250]― 이것도 [wa:250]다 주인님 덕이겠지? [wa:1450]고마워!"
1600106-162 = "[wa:100]― 후후. [wa:1100]역시 이렇게 [wa:550]주인님 곁에 있으니,"
1600106-164 = "― 두근두근한걸-."
1600106-167 = "― ……뭐랄까 좀, [wa:1100]습관이 될 지도!"
1600106-170 = "[wa:250]― 그러니까 앞으로도 종종 [wa:1150]이런 식으로…… [wa:1750]알겠지?"
1600106-173 = "― 잘 부탁해, [wa:800]나의 주인님!"
1600106-176 = "(이후 팔팔해진 아스나를 무사히 돌려보낸 후 집무실로 돌아왔다.)"
