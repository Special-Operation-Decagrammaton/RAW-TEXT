[translation]
101070-1 = "제7화;비상대책위원회 소집"
101070-2 = "(각 학원 자치구에 총학생회의 비상대책위원회 요청서가 전달되었다.)"
101070-4 = "이건……."
101070-5 = "뭔데, 아야네 쨩?"
101070-7 = "사쿠라코 님……."
101070-8 = "……총학생회의 연락이군요."
101070-10 = "……."
101070-12 = "……총학생회가 비대위 개최를 선언했네요. 몇 년 만이지……."
101070-13 = "선생님이 총학생회에도 그 꿈의 내용을 전달했다고는 들었지만……."
101070-14 = "네. 하지만 그 정도만으로 총학생회가 움직이진 않을 텐데. 저희가 모르는 무슨 일이 있을지도……."
101070-15 = "저는 총학생회장이 사라진 후의 총학생회를 신뢰하지 않아요. 대행 나나가미 린 씨는 무해한 사람이지만…… 그렇기에 더욱 믿을 수 없어요."
101070-16 = "네. 지금 총학생회는 휘몰아치는 폭풍 속에 있는 것과 마찬가지죠. 하지만 어차피 이 모든 일들을 선생님과 함께 논의할 필요는 있어요."
101070-17 = "그게 이 기회라고 생각하면 거절할 필요까진 없겠죠."
101070-18 = "……선생님이 함께 있으니 어떻게든 될 거니까."
101070-19 = "하지만 참가 목록에는…… 만마전, 빅 시스터, 붉은 독재자, 검은 군주…… 이들 대부분은 소환에 응하지도 않겠지만, 그래도……."
101070-20 = "이들이 모두 모인 자리에서 제대로 된 논의가 진행될지는……. 전쟁이 나지만 않아도 다행……."
101070-28 = "우와- 나기 쨩, 세이아 쨩! 뭐해, 뭐해?"
101070-29 = "미, 미카 씨……."
101070-30 = "우와, 이건 뭐야? 총학생회의 소환? 비대위? 티파티 전원 참석 요망?"
101070-31 = "걔들이 웬일이래? 흐응. 이것 참 어쩔 수 없이 나도 가야 하는 분위기? 그럼 오랜만에 외출이니까……."
101070-35 = "……게헨나도 오네? 만마전이랑?"
101070-36 = "……."
101070-37 = "미카 씨…… 부디……."
101070-38 = "부디 뭐? 응? 나기 쨩? 말썽부리지 말라고? 당연하지, 걱정하지 마☆"
101070-39 = "거기 선생님도 있는데 내가 그럴 리가 없잖아?"
101070-44 = "……."
101070-45 = "하아…… 또 뭔가 피곤한 일이……."
101070-46 = "그래. 드디어 때가 온 거다, 이로하! 바로 그 때가!"
101070-47 = "네? 때요? 무슨 때가……."
101070-48 = "총학생회와 샬레 모두에게 우리 만마전의 존재감을 각인시킬 때 말이다!"
101070-49 = "그럴 줄 알고 선도부로 간 연락은 가로채두었지! 킥킥킥킥…… 그 녀석들 없이 우리들의 계획을 시작하는 거다!"
101070-50 = "……무슨 계획인지 먼저 말해주면 좋겠는데요. 마코토 선배."
101070-51 = "그리고 설마 총학생회가 우리를 트리니티랑 같은 공간에 두진 않겠죠. 이게 무슨 일이든 제대로 진행될 리가 없을 건데."
101070-52 = "뭐, 선생님도 온다니까 어떻게든 될 것 같지만……."
101070-54 = "……읽지 않은 메시지가 51,234 건 있습니다."
101070-57 = "……읽지 않은 메시지가 51,235 건 있습니다."
101070-59 = "문주님! 이것을……."
101070-60 = "야단을 삼가거라. 나도 이미 확인했거늘."
101070-61 = "네, 넵……."
101070-62 = "내가 참석할 자리는 아니겠지만, 일단은 참고는 하고 있어야겠구나……."
101070-64 = "……. 별일이군요. 우리 같은 변경의 자치구에 총학생회의 연락이 오다니."
101070-65 = "냐하하~ 최근 그쪽에서 우릴 찾는 빈도가 잦아진 것 같지 않아? 카호?"
101070-66 = "……달가운 일은 아닙니다. 니야 님."
101070-67 = "그건 그렇지. 냐하하하하."
101070-68 = "……백화요란이라도 멀쩡히 있었으면 귀찮은 일들을 다 떠넘겼을 텐데 말야."
101070-70 = "최근 회장이 보이지 않는 것 같은데, 무슨 일 있나?"
101070-71 = "몰랐어? 저번 주에 쿠데타가 터져서 그 꼬맹이 설산으로 도망갔잖아."
101070-72 = "또? 이번엔 누구야?"
101070-73 = "몰라. 그게 중요한가? 한두 번 있는 일도 아니고."
101070-74 = "그건 그렇지. 이번엔 며칠 만에 돌아오려나."
101070-80 = "선생님, 총학생회에서 메일을 보내왔어요."
101070-81 = "수석행정관 린 씨가 주요 자치구의 학생 대표들을 소집했어요. 이른바 비상대책위원회라는 것이네요!"
101070-82 = "그리고 린 씨가 선생님에게만 따로 첨부한 데이터도 있는데요……."
101070-84 = "키보토스 전역에 초고위급 에너지를 띠는 질량체가 관측되었다고 하네요."
101070-86 = "그치만 실제로 그 지역에 그런 질량체는 보이질 않아서……."
101070-87 = "각 자치구가 서로 협력해서 이 현상의 원인과 정체를 찾아내는 것이 이 비대위의 목표인 것 같습니다!"
101070-88 = "아무래도 자치구의 학생들이 모이는 만큼, 의견 정리가 어려울 거라서 선생님의 도움이 필요하다는 요청까지 있네요!"
101070-89 = "[s] \"정리 고마워, 아로나.\""
101070-90 = "네. 곧 총학생회에서 준비한 차량이 올 거라고 하네요! 선생님은 중요한 분이니 이제 경호에도 신경을 쓰고 있나 봐요!"
101070-91 = "그럼 그동안 저는 린 씨가 준 정보를 좀 더 알아보고 있을게요."
101070-92 = "뭔가 더 발견한 정보가 있으면 말씀드릴게요!"
101070-93 = "[s] \"응. 부탁해.\""
101070-99 = "모시러 왔습니다. 선생님."
101070-100 = "여기서부터 총학생회가 있는 생텀 타워까지 저희가 경호하겠습니다."
101070-101 = "[s] \"발키리에서?\""
101070-102 = "네. 샬레의 비상 헬리포트에 헬기를 준비해 두었습니다."
101070-104 = "이 헬기입니다. 타시죠."
101070-105 = "[ns1] 헬기에 탄다.\n[ns2] 헬기에 오른다."
101070-111 = "……."
101070-112 = "……."
101070-113 = "[s] \"이동용으로 전술 수송 헬기를 쓴다니, 호화스럽네.\""
101070-114 = "아…… 네. 경찰학교니까요."
101070-115 = "저희들의 지원은 늘 풍족한 편이죠."
101070-116 = "[ns3] \"………………….\"\n[ns4] \"…………………?\""
101070-120 = "게다가 요즘은 학교의 재정상황도 좋지 않아 탄환을 구입하는 것조차도 어렵다고 하니……."
101070-121 = "이러다가는 치안을 담당하는 발키리 경찰학교의 무장이 제일 빈약해질지도 모르겠습니다."
101070-123 = "……."
101070-124 = "……."
101070-125 = "[ns5] \"너희들은…… 누구지?\"\n[ns6] \"발키리 학생이 아니잖아?\""
101070-128 = "……."
101070-129 = "……."
101070-135 = "[ns7] \"……………!!!\"\n[ns8] \"카이저 PMC……!!\""
101070-138 = "감이 좋군, 선생. 깨닫는 게 늦었지만."
101070-139 = "(치익) 샬레의 선생, 확보 완료했습니다."
101070-140 = "(치익) 수고했다. 그럼 계획대로 계속 진행한다."
101070-142 = "후후후. 어떻게 됐나요? 임무는 성공인가요? 제너럴?"
101070-148 = "……그래. 확보했다."
101070-149 = "과연."
101070-150 = "선생님이 결석한 비대위는 파행으로 이어지고 수석행정관의 권위는 지금보다 더욱 추락하겠죠."
101070-151 = "자, 이걸로 샬레의 해체라는 우리의 목표에 한 발자국 더……."
101070-152 = "……응?"
101070-157 = "크, 크윽……?!"
101070-161 = "……너의 목표겠지. 방위실장."
101070-162 = "우린 처음부터 네 정의 따위는 아무 관심도 없었어. 아니, 오히려 샬레를 해체하겠다는 그 계획을 지금 그대로 두는 건 곤란해."
101070-163 = "계획이 얼마 전에 바뀌었거든."
101070-168 = "프레지던트. 접니다."
101070-169 = "아아. 장군. 계획은 잘 진행되고 있나?"
101070-170 = "네. 문제없이."
101070-173 = "그래. 사막에서 그 오파츠를 찾아냈기 때문에 총학생회의 무력…… 방위실과의 협력은 더이상 필요가 없게 되었지."
101070-174 = "그 게마트리아와의 연계도 의미 없어졌어. 그게 손에 들어온 이상, 우리는 독단적으로 행동하면 돼."
101070-175 = "이제 자네들이 총학생회를 장악하면, 이쪽에서 생텀 타워의 행정 제어권을 확보하도록 하겠네."
101070-176 = "그렇게 되면 이 키보토스의 행정 권한은 총학생회가 아니라 우리 카이저 코퍼레이션으로 넘어오게 될 거야."
101070-177 = "……그래. 걱정하지 말게나. 그 부분은 문제없어."
101070-179 = "……알겠습니다."
101070-183 = "목표 지점에서 비대위가 종료될 때까지 대기한 후, 총학생회실이 무방비화되는 시점에 돌입한다."
101070-184 = "우리의 타깃은 총학생회의 수석행정관을 포함한 위원장들이다. 위원장들의 신병은 전부 다 확보할 필요는 없지만 최소한 수석행정관만큼은 확보해야 한다."
101070-185 = "알겠습니다."
101070-186 = "방위실장은 어떻게 하죠?"
101070-187 = "PMC 본부의 감옥에 이송시켜라. 거기라면 그녀의 사병들도 찾을 수 없겠지."
101070-188 = "선생과 방위실장이 없으니 비대위는 금방 파탄 날 거다. 우리가 총학생회를 장악하고 프레지던트가 생텀 타워의 행정 제어권을 확보하면 D.U.에 계엄령이 내려질 거다."
101070-189 = "그럼 그 뒤에 계획은 두 번째 단계로 넘어가게 될 거야."
101070-190 = "(치익) 제너럴, 선생은 어떡합니까?"
101070-192 = "(치익) 그때까지 누구도 행방을 알 수 없게 가둬 둬라. 그래, 다른 짓 못 하게 한쪽 다리라도 쏴버려."
101070-193 = "넵!"
101070-197 = "[ns] (총구가……!)"
101070-203 = "다음화;빛의 도래"
