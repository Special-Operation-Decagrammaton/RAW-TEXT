[translation]
10044050-1 = "제5화;부릉부릉질주연합"
10044050-3 = "여러분! 화물 열차에……"
10044050-4 = "엄청나게 대단한 물건이…… 키보토스를 좌지우지……"
10044050-9 = "찾았다!!!"
10044050-10 = "저거다! 크큭, 이렇게 소식이 굴러들어 오다니 운이 좋군!"
10044050-11 = "대장…… 아니, 총장! 어떻게 할까?!"
10044050-12 = "일단 가까운 연합원부터 출동하고, 주력도 즉시 출발한다!"
10044050-13 = "저 열차를, 반드시 손에 넣는다!!"
10044050-18 = "우오오! 총장의 명이다! 출동!!"
10044050-25 = "……잠깐."
10044050-26 = "왜?"
10044050-27 = "저거 뉴스 속보에 뜬 거잖아?"
10044050-28 = "그런데?"
10044050-29 = "그럼…… 우리 말고도 노리는 놈들이 생기지 않을까……?"
10044050-30 = "……"
10044050-31 = "그러네?"
10044050-33 = "뭐? 엄청난 재화가 실린 화물 열차?"
10044050-35 = "키보토스를 지배할 수 있는 무기? 확실해?"
10044050-37 = "이건 그야말로……"
10044050-39 = "보물 열차잖아!!"
10044050-40 = "이 세상 전부가 거기 있대!!"
10044050-41 = "찾아내는 자가 임자다!!!"
10044050-46 = "헉, 허억…… 이, 이게 무슨……!"
10044050-47 = "특종 탔어- 녹화해 뒀어야-"
10044050-48 = "아오~~!! 진짜! 왜 그때 거기서 라이브를 하고 있냐고!!"
10044050-49 = "[ns] \"일이 이렇게 꼬일 수도 있구나……\""
10044050-51 = "어쨌든 다른 녀석들보다 빠르게 찾아서, 바로 출발하자고!!"
10044050-52 = "그, 그게 좋겠어요. 일단 달리기 시작하면 안전할 테니……"
10044050-58 = "자, 선발대 도착이다!"
10044050-59 = "빨리 그 화물 열차를 찾아보자고!"
10044050-66 = "헉, 헉! 화물 열차! 어디 있어??"
10044050-67 = "핫……! 무전 주셨던 CCC 분들…… 맞으신가요?!"
10044050-69 = "맞아- 어디로 가야 해-?"
10044050-70 = "이, 이쪽으로……!"
10044050-76 = "어? 저 녀석들은……?"
10044050-77 = "왜? 아는 사람이야?"
10044050-78 = "어…… 맞아! 확실해! 피자 배달시킨 진상 녀석들!"
10044050-79 = "네가 말한 그 녀석들이라고?"
10044050-80 = "그래! 하이랜더 놈들!"
10044050-81 = "우오옷! 그렇다면 가만둘 수 없지! 손 좀 봐주자고!"
10044050-82 = "지금만큼은 배달 라이더가 아니라 도로 위의 무법자다 이거야!"
10044050-84 = "어이, 네 녀석들!"
10044050-90 = "크큭…… 이렇게 만날 줄이야."
10044050-91 = "아아. 복수의 기회가 와버렸지 뭐냐."
10044050-93 = "……"
10044050-94 = "누구-?"
10044050-95 = "얼마나 지났다고 기억을 못 해?! 나는 너희들 때문에 아르바이트에서 잘렸다고!!"
10044050-96 = "아, 그 엉망진창 피자 배달부잖아?"
10044050-97 = "너희가 가게에 컴플레인을 너무 빨리 거는 바람에 그날 바로 해고당했어!"
10044050-98 = "보통 이틀 정도는 일할 수 있었단 말이다!"
10044050-99 = "편하게 배달시키는 주제에 얼마나 좋은 서비스를 바라는 거야? 아앙?"
10044050-101 = "으, 음식 배달을 폭주족 운전하듯이 하면 어떻게 해요?"
10044050-102 = "그래그래! 그런 거 피자라고 할 수도 없었다고!"
10044050-103 = "바이크 촌스러워-"
10044050-105 = "이 자식들…… 아주 제대로 성질을 긁는구만?"
10044050-106 = "모두 공격! 이 녀석들에게 우리의 무서움을 알려주자!"
