[translation]
10043075-13 = "이겼다!"
10043075-17 = "이럴, 수가……. 이번에는…… 오늘만큼은……."
10043075-22 = "이렇게 된 이상, 여러분께 묻고 싶은 것이 있습니다."
10043075-23 = "왜 이런 일을 벌이신 겁니까?"
10043075-27 = "왜…… 냐고? 그걸 정말로 몰라서 물어?"
10043075-28 = "……."
10043075-32 = "너희들!"
10043075-33 = "야구!!"
10043075-34 = "너무 못하잖아!!!"
10043075-39 = "저, 정말로 그런 이유였나……?"
10043075-40 = "달리 뭐가 있는데!"
10043075-41 = "우리는 야구를 못해……."
10043075-43 = "그리고 또, 우리는 야구를 '끔찍하게' 못해……!"
10043075-44 = "그리고 또, 우리는 '매번' 야구를 끔찍하게 못 해!!!"
10043075-48 = "으, 어, 저기, 그 말에는 뭔가, 공감이 가는 부분이 없지는 않긴 한데……."
10043075-49 = "[s] \"그래…… 왠지 이럴 것 같았어…….\""
10043075-53 = "아무래도 좋습니다만, 경기는 어떻게 되어 가고 있나요?"
10043075-54 = "저희가 이분들을 제압하는 와중에도, 어쨌든 시합은 계속되고 있었던 것 같은데요."
10043075-58 = "맞아, 경기!"
10043075-59 = "……마지막 수비 이닝에, 마지막 남은 마무리 투수가 올라간 시점에서, 감독이 할 수 있는 일은 사실상 없어……."
10043075-60 = "선수들을 믿고, 코치들을 믿고, 나아가 팀을 믿을 뿐이지."
10043075-66 = "쓰리 아웃! 체인지! 멋진 투구였습니다, 브레이브스! 타자 셋을 전부 삼진으로 돌려보내는군요!"
10043075-67 = "경기는 9회 말, 마지막 이닝으로 접어듭니다!"
10043075-71 = "오, 오오……! 그래도 추가 실점은 없었구나……!"
10043075-72 = "그렇다면 이제, 8번–9번–1번 타자로 이어지는 타선과, 그 과정에서 3번 타자까지 공격이 이어지기를 기원하고……."
10043075-73 = "대망의 4번 타자가, 추격이나 동점 적시타, 조금 욕심을 부리자면 역전 만루 홈런을 때려 주기만 하면 되겠군요!"
10043075-78 = "음…… 트레이너? 저는 야구 규칙에 그리 상세하지는 않습니다만, 그런 제가 봐도 그렇게 될 확률이 높지는 않아 보이는데요……?"
10043075-79 = "[s] \"스미레. 때로 진실은…… 우리를 아프게 할 때가 있단다…….\""
10043075-80 = "그, 그렇습니까?"
10043075-85 = "으……. 으으……!"
10043075-94 = "왜, 왜 그러세요? 무슨 문제라도 있으신가요?"
10043075-95 = "이런 불찰이……. 손목에 유탄을 맞았어……. 배트를 제대로 들 수 있을지 모르겠어……!"
10043075-100 = "네에?!?!?!"
