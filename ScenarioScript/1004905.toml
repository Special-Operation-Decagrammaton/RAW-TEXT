[translation]
1004905-1 = "나쁜 타이밍"
1004905-2 = "(모처럼의 휴일이었다.)"
1004905-3 = "(느긋하게 늦잠을 잔 뒤, 점심거릴 사기 위해 슬렁슬렁 편의점으로 나왔다.)"
1004905-11 = "…………."
1004905-12 = "……!?"
1004905-13 = "[ns] \"……?\""
1004905-15 = "[ns1] \"뭔가 인기척이…….\"\n[ns2] 소리가 난 쪽으로 이동한다."
1004905-21 = "……!!!"
1004905-22 = "(……도망치는 느낌이다.)"
1004905-23 = "[ns3] 무슨 일인지 걱정되니 쫓아간다.\n[ns4] \"왜 피하는 거지……?\""
1004905-31 = "……!! 아윽……!! 아야야야……."
1004905-32 = "[s] \"……카즈사?\""
1004905-35 = "[wa:300]― 호, [wa:300]혹시."
1004905-37 = "― 처음부터 [wa:500]알고 있었던 거야?"
1004905-40 = "― 그런가……"
1004905-42 = "― 뭐, [wa:400]눈치 못 챌 리가 [wa:800]없긴 하겠지……"
1004905-45 = "[wa:150]― 아니, [wa:300]별로"
1004905-47 = "[wa:50]― 피하거나 하는 건 [wa:400]아닌데 말야……"
1004905-50 = "― 그냥 조금, 그……. [wa:1400]"
1004905-52 = "― 지금…… [wa:1220]쌩얼, [wa:960]이니까……."
1004905-55 = "[wa:1200]― 너무 [wa:900]가까운 건 [wa:900]좀……![wa:100]"
1004905-58 = "― 그러니까 선생님,"
1004905-60 = "― 말하는데 [wa:500]다가오지 말라고!"
1004905-63 = "[ns5] \"너무 신경 쓰지 않아도 되지 않을까?\"\n[ns6] \"상관없지 않아? 아직 이른 시간이고.\""
1004905-64 = "[wa:1000]― ……그, [wa:300]그래? [wa:1700]……그런가?"
1004905-65 = "[wa:1000]― ……그, [wa:300]그래? [wa:1700]……그런가?"
1004905-67 = "― 뭐…… [wa:1100]그렇다면 [wa:700]다행이다만……."
1004905-70 = "[wa:500]― ……뭐야. [wa:700]그 반응…….[wa:50]"
1004905-73 = "― 뭐, [wa:400]뭐야!? [wa:800]뭐가 그리 웃긴데!?"
1004905-75 = "― 야-!!!"
1004905-78 = "하아……. 됐어. 여기서 더 성질내봐야 나만 계속 손해일 것 같네."
1004905-79 = "그래서 살건 다 산 거야? 다 샀으면 얼른 나가라고, 선생님이 가야 내가 편하게 뭘 고르지……."
1004905-80 = "……뭐?"
1004905-81 = "'정신없이 쫓아다니다 보니 아직 하나도 안 골랐다'고……?"
1004905-82 = "……아."
1004905-83 = "아 그러셔요……. 하. 하하……."
1004905-84 = "하하하……."
1004905-89 = "하지 말라고 했잖아-!!!"
1004905-90 = "(…….)"
1004905-91 = "(아르바이트생분께 시끄럽다고 혼났다.)"
1004905-95 = "으으……. 쪽팔려 죽는 줄 알았네……."
1004905-96 = "선생님 때문이잖아."
1004905-97 = "……뭐? 즐거웠다고?"
1004905-98 = "진짜 그만해라. 나도 참는 데에 한계라는 게 있어."
1004905-99 = "아무리 그래도 선생님 앞이니까 나도 나름대로 내 이미지에 대한 신경을 쓴다고. 조금은 그런 쪽으로도 배려심을 가져 보는 게 어때."
1004905-100 = "하아. 휴일 대낮에 이게 무슨 짓인지……."
1004905-101 = "……그건 그렇고."
1004905-102 = "……확실한 거지? 아까 전 그 말."
1004905-103 = "[s7] \"뭐? 맨 얼굴? 신경 안 쓴다는 거?\"\n[s8] \"그렇게 말하니 괜히 또 신경 쓰이네.\""
1004905-104 = "……응. 그거."
1004905-105 = "으음. 역시 좀 신경 쓰이는데……."
1004905-106 = "어허-. 너무 끈질긴 타입은 인기 없어요~."
1004905-107 = "에휴. 아니다. 그래도 선생님 말씀이니까 믿도록 해야지."
1004905-108 = "혹시라도 딴소리 하기만 해 봐. 진짜 뒤통수를 때려서 기억 날려버릴 테니까."
1004905-109 = "그럼……. 볼일도 끝났으니까……."
1004905-113 = "……나, 나는 먼저 간다! 서, 선생님도 좋은 하루 되세요!!"
1004905-117 = "[ns] \"…….\""
1004905-118 = "(그렇게 카즈사를 돌려보낸 뒤, 샬레로 돌아왔다.)"
