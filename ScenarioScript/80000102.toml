[translation]
80000102-1 = "함께하고 싶은 것"
80000102-2 = "(갑자기 샬레로 찾아오겠다고 연락한 모미지를 기다리고 있었다……)"
80000102-3 = "선생님! 오래 기다리셨나요? 죄송해요……"
80000102-4 = "괜찮으시다고요? 무, 물론 선생님은 그렇게 말씀하실 것 같긴 했지만요……"
80000102-5 = "네? 제가 약속 시간보다 20분이나 먼저 도착했다고요?"
80000102-6 = "정말이네…… 오, 오히려 다른 의미로 죄송한 일을 해 버린 것 같은데, 어쩌죠……?"
80000102-7 = "[s1] \"일단 진정해, 모미지.\"\n[s2] \"그래서…… 무슨 일이야?\""
80000102-10 = "아, 네! 그게요. 이번에…… 특별 복간하는 만화책을 간신히 손에 넣었거든요!"
80000102-11 = "초콜릿 파티쉐를 소재로 한 로맨스 만화인데…… 요즘 제가 완전히 빠져 있거든요."
80000102-12 = "헤헤…… 쉽지는 않았지만, 무사히 목표로 했던 세 권을 전부 구했어요."
80000102-13 = "네? 1, 2, 3권이 아니라 똑같은 책이 세 권 있는 것처럼 보이신다고요?"
80000102-14 = "그거야 당연하죠! 하나는 소장용, 하나는 감상용…… 마지막 하나는 포교용이니까요!"
80000102-15 = "아, 소장용은 비닐 뜯으시면 안 돼요? 중요한 거니까요."
80000102-16 = "선생님께는 여기, 포교용 책을 먼저 읽게 해 드릴게요!"
80000102-17 = "[s] \"으, 응. 고마워……?\""
80000102-21 = "(해맑게 웃으며 만화책을 내미는 모미지로부터, 책을 받아 펼쳤다……)"
80000102-22 = "(그때……!)"
80000102-27 = "[ns] \"어라?\""
80000102-28 = "아, 이건……! 축하드려요, 선생님!"
80000102-29 = "주인공 모양의 열쇠고리와 초콜릿을 함께 주는 당첨 상품이네요!"
80000102-30 = "헤헤. 선생님도 운이 정말 좋으시네요. 아뇨. 처음에 이 만화책을 산 건 저니까, 저 역시 운이 좋은 걸지도요?"
80000102-31 = "네? 이건 제가 사 온 책에서 나온 거니까…… 제게 돌려주고 싶으시다고요?"
80000102-32 = "아, 안 돼요! 그래도 그건 선생님 거예요! 돌려주지 않으셔도 괜찮아요! 오히려 받아 주세요!"
80000102-33 = "왜, 왜 그렇게 당황하느냐고요? 그건, 그러니까……"
80000102-34 = "아무튼! 선생님이 받아 주세요! 꼭이에요?"
80000102-35 = "[s] \"으, 응. 알았어……\""
80000102-36 = "……"
80000102-37 = "다행이다……"
80000102-38 = "그러면 저도, 감상용 만화책을 읽어 보도록 할까요……?"
80000102-42 = "(모미지가 왠지 기뻐 보이는 표정으로, '감상용' 만화책을 펼친 그때였다.)"
80000102-47 = "……"
80000102-48 = "[s] \"……?\""
80000102-49 = "어, 어어어어! 이, 이건, 그러니까요. 선생님! 그러니까……"
80000102-50 = "저기, 절대로 선생님과 같이 한 쌍으로 산 건 아니고! 말하자면…… 말하자면!"
80000102-51 = "으에에에…… 뭐라고 말씀드려야 하죠……? 저기, 결국은……!"
80000102-52 = "[s] \"잘됐네. 모미지.\""
80000102-53 = "네, 네에……?"
80000102-54 = "[s] \"모미지도 당첨 상품을 받게 되었으니까. 안 그래?\""
80000102-55 = "……"
80000102-56 = "네. 그렇네요. 정말로 그래요."
80000102-57 = "헤헤…… 에헤헤……"
80000102-58 = "……"
80000102-59 = "저기, 선생님."
80000102-60 = "이렇게 된 거, 선생님 책상 위에…… 이 열쇠고리들, 장식해 놓아도 될까요?"
80000102-61 = "그, 저, 가능하면 나란히, 한 쌍으로요."
80000102-62 = "[s] \"응? 괜찮은데, 왜?\""
80000102-63 = "저, 정말요?! 괜찮으신 거죠?"
80000102-64 = "아…… 책상 위에 작은 장식이 늘어나는 거니까요……?"
80000102-65 = "네, 네! 맞아요! 그렇죠!"
80000102-66 = "애초에 책상 위가 지금처럼 너무 휑하기만 하면, 정서에도 안 좋고, 일하는 데 효율도 안 좋을 거고…… 아무튼 좋지 않으니까요! 네!"
80000102-67 = "……"
80000102-68 = "저기, 그러면요. 선생님. 열쇠고리는 그렇게 한다고 치고……"
80000102-69 = "초콜릿은…… 아까우니까, 같이 드실래요?"
80000102-70 = "[s] \"응. 그러자.\""
80000102-71 = "……!"
80000102-72 = "네, 그래요! 같이 먹어요!"
80000102-73 = "만화책도 같이 읽자고요? 저, 정말…… 그래도, 되나요? 괜찮으신 거죠?!"
80000102-74 = "에헤헤…… 저, 샬레에 찾아오길, 정말 잘했나 봐요."
80000102-76 = "(이상하리만치 기뻐하는 모미지와 함께, 만화책을 읽으며 초콜릿을 먹었다……)"
