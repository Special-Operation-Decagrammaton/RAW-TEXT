[translation]
3201-1 = "와라쿠 공주님의 특별한 공연 1"
3201-2 = "네, 그럼 다음 안건입니다."
3201-3 = "이번 축제에서 음양부는 <백귀야행 감사제>라는 이름으로 공연을 진행하기로 결정되었습니다."
3201-4 = "거창한 이름이긴 하지만, 평소 하던 공연과 달라질 필요는 없습니다."
3201-5 = "대단할 것 없는 공연이니, 준비는 제가 하도록 하겠습니다."
3201-10 = "잠깐만~"
3201-11 = "네? 치세 쨩? 무슨 일 있어요?"
3201-12 = "음~"
3201-13 = "이번 공연은 내가 준비할래."
3201-14 = "치세 쨩이……?"
3201-16 = "냐하, 치세가 준비라……."
3201-17 = "조금 재미있을지도~?"
3201-18 = "구, 굳이 치세 쨩이 직접 준비할 필요는 없습니다."
3201-19 = "이미 소품이나 무대장치 같은 건 전에 쓰던 것이 남아 있고 앞에서 말씀드렸던 것처럼 큰 공연도 아니니까……."
3201-20 = "그치만 이번 공연, 특별하니까~"
3201-21 = "직접, 준비할게?"
3201-22 = "(귀, 귀여워……!)"
3201-23 = "크, 크흠, 그럼 알겠습니다."
3201-24 = "그럼 소품 구입, 무대 설치, 모두 제가 옆에서 힘껏 돕겠습니다."
3201-25 = "치세 쨩이 준비하는 데 부족함이 있어서는 안 되니까요."
3201-26 = "으음~ 그렇게까지 할 거 있어?"
3201-27 = "치세가 알아서 잘할 것 같은데."
3201-28 = "음양부 부부장으로서 공연이 성공적으로 진행될 수 있게 돕는 것은 당연한 일입니다."
3201-29 = "제가 지금까지 해온 일이기도 하고요."
3201-31 = "(그리고 너무 치세 쨩에게만 맡기는 건…… 역시 제가 해야 할 일을 떠넘기는 것 같아 미안하고.)"
3201-32 = "(또 어떤 면으로는 걱정되기도 해서…….)"
3201-33 = "으응, 괜찮아."
3201-34 = "카호는 쉬고 있어~"
3201-35 = "해님을 보기 좋은 날이니까~"
3201-36 = "나한테 맡겨~"
3201-37 = "소품 구입, 하고 올게."
3201-41 = "자, 잠깐만요, 치세 쨩!"
3201-42 = "……이야, 정말로 가버렸네."
3201-43 = "치세 쨩이 평소 하지 않던 말과 행동을……"
3201-44 = "이, 이것이 바로 사춘기라는 걸까요?!"
3201-45 = "냐하하~ 카호도 차암~ 너무 호들갑이라니까. 뭐어, 이번만큼은 기다려 보는 게 좋지 않아?"
3201-46 = "치세도 나름대로 생각이 있을 테니까~"
3201-47 = "그, 그건 물론! 저도 치세 쨩이 만들 무대가 마음에 들지 않는다는 건 아니고……단지……."
3201-48 = "만약 상가에서 많은 사람들에게 둘러싸이기라도 한다면……!"
3201-49 = "그래서 혹시나 못된 마음을 먹은 사람들이 치세 쨩을 납치하기라도 한다면!"
3201-51 = "냐하하, 그건 너무 지나친 생각 같은데~?"
3201-52 = "<와라쿠 공주님> 공연도 아니고 말야."
3201-53 = "으으……역시 걱정됩니다!"
3201-54 = "그러니, 치세 쨩을 지켜보도록 하겠습니다!"
3201-55 = "니야 님도 따라오세요!"
3201-56 = "어~? 나까지~?"
3201-58 = "어서 옵쇼!"
3201-59 = "아니, 이게 누구야. 치세 님 아니신가! 하하!"
3201-60 = "안녕~ 반가워~"
3201-64 = "냐하, 그렇다고 몰래 뒤를 밟는 건……."
3201-65 = "오히려 이쪽이 위험해 보이는 게 아닐까나, 싶기도 하고~"
3201-66 = "조, 조용히 하세요! 들리겠어요!"
3201-67 = "혼자 공연을 준비하겠다는 치세 쨩의 의지를 지켜 주면서 안전을 보장하는 방법은 이것밖에 없지 않습니까!"
3201-68 = "카호 쨩 목소리가 더 큰데에."
3201-69 = "크윽!"
3201-70 = "뭐, 이렇게 온 거 일단 지켜보자구."
3201-72 = "보아하니 <백귀야행 감사제> 준비를 위해 오신 게로군."
3201-73 = "그렇다면…… 어디 보자……"
3201-74 = "아, 여기 있다."
3201-75 = "카호 씨가 늘 사가는 남색 우산이라네."
3201-76 = "맞아요, 치세 쨩!"
3201-77 = "백귀야행의 전통 공예품인 쪽 염색 우산은, 공연을 엄숙하고 격조 있게……!"
3201-82 = "아니, 저기 분홍색으로 할래~"
3201-85 = "?!"
3201-86 = "치세 쨩, 어째서……?"
3201-87 = "저번 공연에선 남색 우산을 사용했었는데……. 혹시 그게 마음에 들지 않았다든가?!"
3201-88 = "호오, 호오, 과연, 그런 건가."
3201-90 = "아이돌 치세의 작은 반란인 건가아."
3201-92 = "이 복숭아색 맞나?"
3201-93 = "자!"
3201-94 = "고마워~"
3201-95 = "그래! 언제든지 또 오라구."
3201-97 = "안녕하세요! 치세 님! 물건을 보러 오셨나요?"
3201-98 = "응, 인형도 필요해~"
3201-99 = "귀여운 거면 좋겠어."
3201-100 = "<백귀야행 감사제>를 준비하고 계신 거죠?"
3201-101 = "그렇다면 이쪽의 코케시 인형을 추천드려요."
3201-102 = "그렇지요. 인형 또한 감사제 의식에서는 무척이나 중요한 소품!"
3201-103 = "우산은 저번과 다른 색입니다만……가게 주인 분의 말씀처럼 감사제에 사용되는 인형이라고 하면, 코케시 인형!"
3201-104 = "여기에선 그게 정답이랍니다! 치세 쨩!"
3201-105 = "냐하하, 얌전히 지켜보자구~"
3201-107 = "코케시 인형……"
3201-108 = "귀엽긴 하지만, 나는 이쪽이 좋아~"
3201-109 = "네, 이쪽의 여우 인형 말씀이시죠? 의외군요. 여기 있습니다."
3201-110 = "또 다른 걸 고르다니……."
3201-111 = "응, 이건 카호 부부장~"
3201-113 = "저, 저를 말하는 건가요?!"
3201-114 = "오~ 맞네. 역시 치세야. 보는 눈이 있어~"
3201-116 = "그리고 저기, 다루마 씨도 부탁해~"
3201-117 = "네! 여기 있습니다!"
3201-118 = "이건 니야 부장이야~"
3201-120 = "으, 응?! 어째서 나는 다루마?"
3201-121 = "서, 설마 나랑 닮았다는 뜻은 아니겠지……?"
3201-122 = "고마워. 잘 쓸게~"
3201-123 = "네, 감사합니다! 성공적인 공연되세요!"
3201-128 = "치세 쨩?! 이번에는 의식에 쓰일 전통 음료가 아닌 오렌지 주스를?!"
3201-133 = "의식용 전통 다기 대신 이번엔 캐릭터 상품 컵을?!"
3201-138 = "이제는 아예 푸딩과 아이스크림까지?!"
3201-143 = "헉, 헉……."
3201-144 = "이, 이렇게 뛰어서 돌아올 필요 있었어?"
3201-145 = "치, 치세 쨩한테 들키면 안 되니까요."
3201-146 = "그건 그렇고, 치세, 무슨 생각일까나."
3201-147 = "거의 평소에 사용하지 않는 것들로만……."
3201-148 = "그, 그러게요. 치세 쨩……."
3201-149 = "분명, 뭔가 생각이 있을 거라고는 생각합니다만……."
3201-154 = "도착~"
3201-160 = "해님, 보고 있었어?"
3201-161 = "아, 치, 치세 쨩! 오셨군요!"
3201-162 = "소품 구입은 잘 끝나셨나요?"
3201-163 = "응, 완벽해~"
3201-164 = "공연, 잘될 것 같아."
3201-165 = "그, 그런가요. 다행이군요."
3201-166 = "그럼, 준비하러 갈게~"
3201-170 = "치세 쨩………."
