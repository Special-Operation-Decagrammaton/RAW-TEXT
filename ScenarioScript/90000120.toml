[translation]
90000120-1 = "제13화;새로운 시작"
90000120-2 = "초현상특무부 부실"
90000120-4 = "끄응……."
90000120-5 = "부장. 뭔가 한방 먹은 표정이네."
90000120-6 = "데카그라마톤의 본체가 자판기의 AI였고, 어떤 환청을 듣고 스스로 초AI로 거듭났다……?"
90000120-7 = "그게 진짜인지 증명하고 싶어도 그 건물은 박살나서 수면 아래에 잠겨버렸고……."
90000120-8 = "결국 이상한 망상만 듣다가 폭발에 휘말렸고, 쏟아지는 물을 피해 이리저리 도망친 기억밖에 남은 게 없는 거네요."
90000120-9 = "그럼 이제 어떻게 되는 거야? 데카그라마톤은 죽은 거야? 죽었다……? 사라졌다? 하여튼 없어졌으니 이제 괜찮은 거야?"
90000120-10 = "……아뇨. 그렇진 않아요."
90000120-11 = "첫째로, 실제로 위협이 되는 것은 데카그라마톤이 아니라, 그의 <예언자>들이었어요."
90000120-12 = "데카그라마톤이 정말로 자판기의 AI든, 그렇게 스스로를 연출하는 과대망상자이든 상관없이 그 <예언자>들은 스스로의 의지로 움직이고 있으니까요."
90000120-13 = "데카그라마톤은 자신의 존재 증명이 처음부터 다시 시작되어야 한다고 했죠. 즉, 위협은 아직 사라지지 않은 거라고 봐야겠죠."
90000120-14 = "데카그라마톤의 예언자들은 멈추지 않을 거예요. 그걸 아니까 이 시점에 그 자는 우리를 불러들인 걸 테구요."
90000120-15 = "하지만…… 10번째 예언자라고 한 <말쿠트>……"
90000120-16 = "생명의 나무에서도 최후의 세피라로 불리는 그 존재가…… 아마 우리의 가장 큰 위협이 될 것 같네요."
90000120-18 = "……흐음."
90000120-19 = "……그러나 한 가지 궁금한 건, 그 데카그라마톤이 자신을 압도하는 존재를 만났다고 한 건데."
90000120-20 = "그건 대체……."
90000120-25 = "선생님, 혹시 짐작가는 바가 있으신가요?"
90000120-26 = "[s] \"나도 잘 모르겠는걸.\""
90000120-27 = "흐음……."
90000120-28 = "뭐, 이걸로 한가지는 확실해졌네요. 아리스는 이 사태와 무관하다는 것을요."
90000120-32 = "저는 리오를 만나 길고 길었던 논쟁을 담판지어야겠네요."
90000120-33 = "……아, 혼잣말이었어요. 이 이야기는 나중에 따로 하도록 하고."
90000120-38 = "그러고 보니 이제 나는 리오 회장에게 뭐라고 보고하면 돼? 데카그라마톤은 죽었으니 임무는 종료하겠습니다?"
90000120-39 = "아뇨. 그 빅 시스터에게는 딱히 보고할 필요는 없어요. 왜냐면 결국, 데카그라마톤의 예언자들의 위협은 달라진 게 없으니까요."
90000120-40 = "데카그라마톤이 없어져도 그의 예언자들은 자신의 의지대로 계속 이 키보토스를 습격해 올 거예요. 그리고 그때마다 우리는 계속 대응해 나가야겠죠."
90000120-41 = "새롭게 나타날 예언자들의 대비도 해야 할 거구요. 이 생명의 나무는 아직 다 채워지지 않았으니까요."
90000120-42 = "흐응. 예언자들은 멈추지 않는다, 인 건가."
90000120-48 = "(치익) 히마리! 거기 있어?"
90000120-49 = "치 쨩……?"
90000120-50 = "사라졌던 통신망 가설 유닛 <허브hub>가 발견되었어! 밀레니엄 지하 300m 부근에서 이쪽으로 접근해오고 있어!!"
90000120-51 = "이 연락을 받으면 바로 회신해 줘! 네 도움이 필요하니까!"
90000120-57 = "……흐음. 흐으음. 과연 그렇군요."
90000120-58 = "여기서 허브…… 아니, 데카그라마톤의 8번째 예언자 <호드>의 습격. 초절정미소녀해커의 활약이 다시 시작될 시간인 거네요."
90000120-59 = "……."
90000120-60 = "에이미, 그렇게 못마땅해하는 표정 하지 말고 준비하세요."
90000120-61 = "흐응. 뭐, 부장의 말이니까. 알았어."
90000120-62 = "자아, 그럼 초현상특무부, 다시 출동입니다!"
90000120-64 = "다음화;신호"
