[translation]
41120-1 = "제12화;비에 젖은 청구서"
41120-2 = "총학생회 리셉션 룸"
41120-6 = "……그래서 뭐죠? 이 제안서는."
41120-7 = "[s] \"한번 확인해주었으면 해서……\""
41120-8 = "침수 피해를 입은 <코우사기 공원>의 시설을 정비하고 보수하는 안건이라……."
41120-9 = "시민들이 사용하는 공원을 수리하고 보수하는 것 자체는 어려운 일이 아닙니다만."
41120-10 = "이 공사가 샬레의 활동에 필요한 일입니까?"
41120-11 = "[s] \"어, 그건 아닌데……\""
41120-12 = "그럼…… SRT의 학생들에게 필요한 일입니까?"
41120-16 = "……대답을 피하시는 걸 보니 정답인가 보군요."
41120-17 = "방위실장으로부터 이야기는 전해 들었습니다. 전학 가기를 거부한 SRT 학원의 일부 학생들이 공원에서 노숙을 하고 있고, 선생님이 그 뒤를 봐주고 계신다지요."
41120-18 = "그 사실을 비난하려는 것은 아닙니다. 애초에 선생님께서 내키는 일을 자유롭게 하실 수 있도록 만들어진 조직이 샬레이니……."
41120-19 = "다만, 제 입장에선 그 학생들이 아직도 공원에 머무르고 있다는 사실이 마뜩잖군요."
41120-20 = "[s] \"……시민들이 사용하는 공원을 점거하고 있어서?\""
41120-21 = "아니요. 그 공원은 방문하는 사람도 거의 없는 외진 곳에 위치한 공원이었으니까요."
41120-22 = "그대로 두어도 어차피 조만간 철거할 예정이었습니다."
41120-23 = "다만……"
41120-29 = "분명 SRT 학원은 총학생회장에게 면책 특권을 부여받아, 신속하게 범죄자를 제압할 수 있도록 만들어진 조직입니다."
41120-30 = "하지만 그 특권은 올바른 목적이 있을 때만 가치를 가질 뿐…… 목적을 잃은 특권은 위험을 초래할 뿐입니다."
41120-31 = "……게다가 선생님도 아시겠지만, 총학생회 내부에는 SRT 학생들이 가진 무력을 두려워하는 임원들도 적지 않지요."
41120-32 = "그런데 그 임원들을 달래기는커녕, 농성 중인 학생들의 장비를 새것으로 교체하겠다니……."
41120-33 = "이를 강행했다가는 분명 행정위원회의 거센 반대에 부딪히게 될 겁니다."
41120-34 = "[s] \"린이 어떻게 설득해 주면 안 될까……?\""
41120-38 = "허가할 수 없습니다."
41120-40 = "(이후, 도움을 구하기 위해 다른 실장들을 만나보았지만……)"
41120-41 = "(……모두 거절당하고 말았다.)"
41120-44 = "방위실장 사무실"
41120-46 = "……그래서 이곳까지 오게 되셨군요."
41120-50 = "수고 많으셨습니다, 선생님. 차라도 한잔 드시겠어요?"
41120-51 = "……괜찮으시다고요?"
41120-52 = "아무래도 느긋하게 환담을 주고받기엔 일이 많이 바쁘신 것 같군요."
41120-56 = "본론부터 말씀드리자면. 이번 건은 저 역시 도와드릴 수가 없습니다."
41120-57 = "SRT 학원은 이미 공식적으로 폐쇄된, 존재하지 않는 학원……"
41120-58 = "존재하지 않는 학원의 학생들을 위해 총학생회의 지원금을 사용하는 건 공식적으로 불가능합니다."
41120-59 = "해당 공원의 개보수를 핑계로 자금을 융통하는 방법도 생각해봤지만, 그 방법 역시 해당 지역이 재개발 예정지이기 때문에 불가능하다더군요."
41120-60 = "……제가 할 수 있는 건 그 아이들의 학적 데이터가 말소되지 않도록 계속 기록을 갱신하고 유지하는 일뿐이라……."
41120-61 = "도움이 되지 못해 죄송하네요."
41120-62 = "[s1] \"그렇지 않아.\"\n[s2] \"카야에게는 충분히 도움을 받고 있어.\""
41120-67 = "……선생님."
41120-68 = "RABBIT 소대의 아이들과 보내는 일상은 즐거우신가요?"
41120-69 = "[s] 고개를 끄덕인다."
41120-70 = "그렇다니 다행이네요."
41120-76 = "그럼 여태까지 그래왔던 것처럼, RABBIT 소대의 학생들을 잘 부탁드리겠습니다."
41120-81 = "윽……."
41120-82 = "[s] \"그때 발키리 경찰학교의…….\""
41120-83 = "……이런 곳에서 다시 뵙게 되다니, 우연이군요."
41120-84 = "선생님께서도 실장님께 볼일이 있으셨습니까?"
41120-85 = "[s] \"응, 칸나는?\""
41120-86 = "저는, 그게 그러니까……"
41120-87 = "지극히 개인적인 볼일이 있어서 방문했습니다."
41120-91 = "그럼, 다음에 뵙겠습니다."
41120-99 = "어서 오세요, 공안국장. 기다리고 있었습니다."
41120-103 = "너무 그렇게 긴장할 필요는 없어요, 칸나. 당신을 질책하려고 부른 게 아니니까요."
41120-104 = "다만 지난번에 부탁한 일의 진척을 듣고 싶었을 뿐."
41120-108 = "대답해주세요, 칸나. 코우사기 타운의 재건축 준비는 얼마나 진행되었죠?"
41120-109 = "그게…… 다른 준비는 완료되었습니다만, 폐건물에 노숙 중인 히피들이 계속 물러나지 않고 있어서……."
41120-110 = "건물 철거 작업이 계속 지연되고 있습니다."
41120-111 = "하아~?"
41120-115 = "공안국장. 그게 말이 되는 소리라고 생각하시는 건가요?"
41120-116 = "키보토스의 치안을 책임지는 발키리 경찰학교……"
41120-117 = "그중에서도 최정예라는 공안국의 학생들이 고작 노숙자 퇴거 때문에 애를 먹고 있다는 사실이?"
41120-118 = "하, 하지만 그 일대의 노숙자들은 평범한 노숙자들과는 다릅니다. 그들은 평범하지 않은 수준의 중화기로 무장하고 있다고요!"
41120-119 = "저희가 가지고 있는 진압 장비로는 그들의 총격을 버텨내기도 어렵습니다."
41120-120 = "게다가…… 얼마 전 실장님께서 선처해주신 그 SRT의 학생들도 주변 공원에 터를 잡는 바람에 재건축 준비가 더더욱……."
41120-121 = "어머나, 제 탓을 할 생각이신가요?"
41120-122 = "시, 실례했습니다!"
41120-130 = "칸나 국장. 저는 책임을 지는 사람이 좋답니다."
41120-131 = "저는 방위실장의 자리에서, 당신은 공안국장의 자리에서. 각자 제 할 일에 열중하며 맡은 바 책임을 다하면 되는 거예요."
41120-132 = "만약 제 분수도 모르고 책임을 방관한 채 건방진 소리를 늘어놓으면……"
41120-133 = "SRT 특수학원처럼 되는 수가 있답니다?"
41120-135 = "……(꿀꺽)"
41120-136 = "후후, 조금 애를 먹고 있는 것 같으니 제가 원 포인트 어드바이스를 드리겠습니다."
41120-137 = "칸나 국장은 <세 화살의 가르침>을 알고 계시나요?"
41120-138 = "한 개의 화살은 꺾기 쉽지만, 여러 개를 묶어 만든 다발은 쉽게 꺾이지 않죠."
41120-139 = "공안국만으로 해결하기 어려운 일이 있다면 '이해관계가 맞는 사람'을 찾아 협력하면 되는 거예요."
41120-140 = "……설마 그 말씀은……."
41120-141 = "그걸 꼭 입에 올려 말해야 알아차릴 정도로 눈치가 없지는 않겠죠?"
41120-142 = "네……."
41120-143 = "그럼 다음번에는 좋은 소식을 기대하고 있겠습니다."
41120-148 = "하아— 이놈이고 저놈이고, 제대로 움직여 주는 녀석이 하나도 없네요."
41120-149 = "저는 어쩜 이리도 인복이 없는지……."
41120-151 = "……그건 우리를 두고 한 이야기인가?"
41120-152 = "그럴 리가요. 당신은 제가 만난 인생 최고의 파트너인걸요~ ♡"
41120-153 = "다만 RABBIT 소대와 샬레의 선생님이 저만큼이나 친해질 줄은 예상치도 못했네요."
41120-154 = "분명 붙여 두면 서로에게 큰 상처를 준 채 깔끔하게 떨어져 나갈 거라고 생각했는데……."
41120-155 = "'전문가'의 입장에서 이 현상을 어떻게 생각하시나요?"
41120-157 = "예상과는 크게 다르군. 하지만 놀랄 일도 아니야."
41120-158 = "당신다운 재미없는 답변이네요."
41120-163 = "조금 더…… 가까이에서 지켜봐야겠어."
41120-165 = "다음화;여우와 유부초밥"
