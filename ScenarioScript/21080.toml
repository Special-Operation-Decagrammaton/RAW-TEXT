[translation]
21080-1 = "제8화;자격 심사"
21080-2 = "밀레니엄 게임개발부"
21080-3 = "우하하! 이제 폐부 위기는 끝~ 안심하고 게임만 해도 괜찮겠지?"
21080-4 = "아리스! 오늘은 레이드를 갈 거야! 준비는 됐어?"
21080-5 = "공략 숙지 완벽, 레이드 전용 장비 획득 완료, ［초보 환영/불타는 숲 원정대/4인/힐러, 궁수 구함］ 공지, 앗, ［Perorochan32 님(이/가) 합류하였습니다.］"
21080-6 = "너, 너무 긴장 풀린 거 아니야?!"
21080-7 = "유우카에게는 말한 거지? 우리는 이제 4명이니 부의 자격요건을 갖췄다고."
21080-8 = "물론이지. 오늘 오후에 아리스의 자격심사를 하러 온다고…… 앗! 아리스! 보스가 브레스를 준비하고 있어! 피해야 해! 위기야!"
21080-9 = "위기! 보호 마법을 전개합니다."
21080-10 = "이쪽도 위기야! 자격심사?! 그런 거 처음 들어!"
21080-11 = "그 자격심사에 우리 부의 존폐가 걸렸는데 태평하게 멀티플레이나 할 때야?!"
21080-12 = "나참, 걱정하지 마. 아리스의 준비는 완벽하니까."
21080-13 = "응?"
21080-16 = "아리스! 자기 소개 시작!"
21080-18 = "제 이름은, 아리스 더 블루아이. 드워프 창기사. 사용 무기는 건랜스 <화룡의 송곳니>, 출신지는 강철 산맥, 하지만 어린 시절 마족의 습격에 가족을 잃고 불타는 광산에 들어가……"
21080-19 = "아니 네 게임 아바타 프로필 말고! 아리스 너 말야!"
21080-20 = "아, 이해했습니다."
21080-22 = "제 이름은 아리스, 밀레니엄 학원 1학년, 최근 전학 왔으며 수강신청 타이밍을 놓쳐 아직 수업 등록을 못 한 상태. 다음 달부터 수업에 들어갈 예정입니다."
21080-23 = "수업은 아직 들어갈 수 없지만, C.A는 가능하다는 말에 게임개발부에 가입했습니다."
21080-24 = "오. 그럴듯한데."
21080-25 = "게임개발부에서 맡고 있는 역할은, 탱커 겸 명 속성 근접 투사……"
21080-26 = "아니야! 맡고 있는 역할은 프로그래머라니까!"
21080-27 = "프, 프로그래머입니다! 태어났을 때부터 모국어보다 JABA어를 먼저 사용 했으며……"
21080-28 = "으으……! 우리 정말 폐부 되지 않을 수 있을까……!"
21080-29 = "……그런 건 불가능해."
21080-31 = "이곳 게임개발부에, 신입 부원이 들어왔다는 그런 게 가능할리가……!"
21080-32 = "안타깝지만, 사실이야!"
21080-33 = "유우카……."
21080-36 = "……?"
21080-37 = "네가 화제의 아리스 양이로구나. 게임개발부에 가입했다는, 네 번째 멤버."
21080-38 = "흐음. 밀레니엄 학원 소속 학생이라면 전부 알고 있다고 생각했는데……"
21080-39 = "내가 이런 귀여운 아이를 모를 수 있다는 게, 믿어지지 않네."
21080-40 = "(움찔)"
21080-41 = "……???"
21080-42 = "아."
21080-43 = "요 괴 출 현……."
21080-44 = "?! 바, 방금 이 애 나를 요괴라 부르지 않았어?"
21080-45 = "차, 착각이야. 요정이라고 말하는 걸 잘못 들은 거겠지. 아리스는 거짓말을 못하거든."
21080-46 = "크윽…… 악역은 익숙하다 말했지만, 처음 보는 아이에게 이런 대우를 받다니."
21080-47 = "용서 못 해……!"
21080-48 = "지, 진정해! 사적인 감정을 개입시키면 안 되잖아!"
21080-50 = "어쨌든, 이제 부활동 인원수는 채웠어! 게임개발부는 유지할 수 있는 거지?"
21080-51 = "'유지'라……"
21080-52 = "분명 이 아이가 자신의 의지로 이곳에 온 부원이라면, 가능하지."
21080-53 = "(뜨끔)"
21080-54 = "본래는 부원 모집이 되었다는 것만 통보해도 부의 유지는 가능했지만……."
21080-55 = "최근엔 클럽 운영 규칙이 다소 바뀌어서, 좀 더 엄격하게 확인할 필요가 생겼어."
21080-56 = "그러니 아리스 양에게 간단한 취조를…… 어머, 마음에도 없는 소리가……"
21080-57 = "간단한 질문을 몇 가지 할게."
21080-59 = "마음 가득한 말이 나온 것 같은데……."
21080-62 = "그렇게 길게 끌지는 않을 거야."
21080-63 = "(꿀꺽)"
21080-64 = "서, 선택지에 따라 배드 엔딩이 결정될 수 있는 겁니까?"
21080-65 = "뭐…… 그럴 수도 있지. 그럼…… 아리스 양."
21080-68 = "심문을, 시작한다."
21080-70 = "다음화;유우카의 질문"
