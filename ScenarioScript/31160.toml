[translation]
31160-1 = "제16화;작은 틈새"
31160-2 = "후아- 개운해요!"
31160-3 = "일찍 씻었네, 히후미."
31160-4 = "우후후. 왜냐면 히후미 쨩, 오늘 하루종일 씻지 못해서……."
31160-5 = "아, 아우! 부끄러운 소리는 하지 마세요……. 오늘은 늦잠을 자버려서……."
31160-6 = "그건 우리를 위해서 늦게까지 시험 준비를 했기 때문이잖아."
31160-7 = "면목이 없어. 히후미. 내일 아침에도 일어나는 게 힘들면 얘기해. 이번엔 히후미를 씻겨줄 테니까."
31160-8 = "네? 네? 그, 그건 괜찮아요! 아즈사 쨩……!?"
31160-9 = "혼자서 씻으라고! 어린애도 아니고!"
31160-10 = "효율을 추구할 뿐이야. 다 같이 씻으면 여러 가지 장점이 많으니까. 물도 절약할 수 있고."
31160-11 = "어머…… 그러네요……. 저희는 대욕탕 같은 건 없으니까. 모두 다 함께 씻는다, 라는 이벤트는 좀처럼 없을 것 같지만……."
31160-12 = "그럼 대신 다음에 수영장에 다 함께 알몸으로 들어가는 건 어때요? 대욕탕 대신으로!"
31160-13 = "무슨 짓이야! 금지! 금지! 절대 금지!!!"
31160-14 = "상관은 없지만 거기에 의미가 있어? 수영장에서 몸을 씻는 건 금지잖아."
31160-15 = "응? 해방감이 꽤 클 것 같지 않나요? 상상만으로도 즐거울 것 같은데…… 우후후♡"
31160-16 = "아아. 즐거움인가…… 그런 쪽으로 생각해보진 않았어. 음……. 해방감이라……."
31160-21 = "아, 아니야! 하지 마! 생각해보지 마!! 멈춰, 생각을 멈춰!!"
31160-26 = "이상한 걸 물들이지 말란 말야! 트리니티에 변태는 너 하나로 충분하니까!!"
31160-27 = "어머? 코하루 쨩은 알몸으로 수영하는 파니까 잘 알고 있는 거 아니었어요?"
31160-28 = "그런 파는 없다고!! 수영장에선 수영복이야! 그게 바로 정의라고! 그거 말고는 전부 처형이야! 사형이야!"
31160-29 = "흐응……. 그렇다면……."
31160-34 = "(소근소근) 어제 수영장에서 제가 입고 있었던 비키니……."
31160-35 = "으, 으응? 그건 왜……?"
31160-41 = "그건[wa:1000] 정말로[wa:1000] [ruby=.]수[/ruby][wa:500] [ruby=.]영[/ruby][wa:500] [ruby=.]복[/ruby][wa:1000] 이었을까요?"
31160-42 = "?!"
31160-43 = "수, 수영복이 아니면…… 그, 그, 그러면……?"
31160-45 = "요즘 언더웨어들은 디자인이 꽤 다양해서, 얼핏 보면 수영복으로 착각할만한 것도 꽤 많은 것 같고♡"
31160-46 = "…………?! …………?!!"
31160-47 = "뭐, 뭐였던 거야?! 그거?! 수영복이 아니면?! 서, 서, 설마……."
31160-48 = "어머나. 어째서 동요하는 거죠?"
31160-49 = "그게 수영복이 아니었다고 말해도, 무엇이 달라지는 걸까요? 응, 코하루 쨩?"
31160-50 = "으, 으응?"
31160-51 = "애초에…… 수영복과 속옷의 차이는 뭐죠? 방수기능? 신체 보호? 디자인? 노출의 범위?"
31160-52 = "겉으로 봤을 때 아무런 차이를 알 수 없었잖아요? 그래서 그때 모두가 그걸 <수영복>이라고 믿었잖아요?"
31160-53 = "……??"
31160-54 = "제가 사실은 그게 팬티였다고 말해도, 그 진실을 어떻게 증명할 수 있죠?"
31160-55 = "증명되지 못하는 진실만큼 무력한 건 없죠. 그렇지 않나요?"
31160-56 = "무, 무슨 말인지 모르겠어…… 그래서 뭐였다는 거야?!"
31160-57 = "우후후♡ 수영복, 이었어요. 미안해요, 놀리는 게 재미있어서 그만……."
31160-58 = "……노, 놀리고 있어!!?"
31160-59 = "음, 아니. 하나코가 얘기한 건 다섯 번째 화두 이야기야."
31160-60 = "……?!"
31160-61 = "다섯 번째…… 네? 그게 뭐에요, 아즈사 쨩?"
31160-62 = "……."
31160-66 = "누군가에게 들었던 이야기야. 키보토스에 떠도는 일곱 개의 화두. 그중에 다섯 번째였던가."
31160-67 = "\"낙원에 도착한 사람의 진실을 증명할 수 있는가.\" ……그런 내용으로 기억해. 나도 그 나머지는 모르지만."
31160-68 = "결론은 아무도 증명하지 못하는 낙원은 존재할 수 있는가. 그런 선문답 같은 이야기였어."
31160-69 = "아즈사 쨩……. 그걸 어떻게……."
31160-70 = "이 이야기를 알고 있는 건……."
31160-71 = "아즈사 쨩……! 세이아 쨩을 만난 적이 있는 거예요?"
31160-72 = "……."
31160-74 = "……세이아?"
31160-75 = "세이아라면 티파티의 세이아 님……?"
31160-76 = "……."
31160-77 = "아니, 그게 누군지 몰라. 이 이야기는 그냥 어디서 들었을 뿐."
31160-78 = "……."
31160-79 = "아, 아아……. 그렇죠. 아즈사 쨩은 전학왔다고 했으니……. 트리니티가 아닌 곳이라면……."
31160-80 = "vanitas vanitatum……. 그 분교……."
31160-84 = "응, 아무것도 아니에요. 이렇게 또 밤이 되었으니 슬슬 내일을 위해 일찍 잠자리에 들어야겠네요."
31160-88 = "응, 그럼 오늘 하루도 수고하셨습니다!"
31160-91 = "선생님의 개인실"
31160-93 = "(그날 밤. 늦은 시간.)"
31160-94 = "……네. 이걸로 분명해졌어요. 선생님."
31160-95 = "……. 하나코 쨩은……."
31160-96 = "[s] \"……….\""
31160-97 = "……모의 시험을 준비하기 위해 작년의 모범 답안지를 확인해보다가 알게 된 사실이에요."
31160-98 = "작년 1학년부터 3학년까지의 모든 모범답안이 단 한사람의 시험지로 구성되어 있었어요."
31160-99 = "[s] \"그게 바로…….\""
31160-102 = "……네. 하나코 쨩의 것이었어요."
31160-104 = "……. 본의아니게 하나코 쨩의 성적을 훔쳐본 꼴이 되었지만……."
31160-105 = "작년의 하나코 쨩은 1학년 때 3학년 수재반에서도 힘들어하는 심화 과정까지도 전부 다 만점을 받은 수재 중의 수재였어요……."
31160-106 = "그랬던 하나코 쨩의 성적이 갑자기 떨어진 것은 2학년이 되고 나서 이후……."
31160-107 = "[s] \"하나코는 그러면…….\""
31160-108 = "네. 하나코 쨩은…… 일부러 시험을 망치고 있었던 거예요……."
31160-109 = "하나코 쨩…… 어째서 이런…… 아우……."
31160-111 = "별관 중앙 로비"
31160-116 = "……."
31160-123 = "……."
31160-124 = "아즈사 쨩…… 또 불침번인가요?"
31160-125 = "……."
31160-129 = "하아아아-암-"
31160-130 = "좋은 아침이에요."
31160-133 = "(사각사각)……."
31160-134 = "……."
31160-135 = "끄응……."
31160-136 = "(……그러고보니 선생님, 아침부터 안보이시는데…….)"
31160-137 = "(어디가셨지…….)"
31160-139 = "별관 수영장"
31160-140 = "우와- 물이 채워져 있네?"
31160-141 = "아하하, 여기에 물이 채워진 건 진짜 오랜만에 봐. 수영하려고? 선생님? 아니면 풀파티?"
31160-142 = "[s] \"무슨 일로 부른 거야?\""
31160-143 = "……헤헤헤, 응."
31160-149 = "선생님이 잘하고 있나 궁금해서."
31160-151 = "다음화;트리니티의 배신자"
