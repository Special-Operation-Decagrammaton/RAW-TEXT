[translation]
10058150-1 = "후일담;달려온 곳에 낙원은 있다"
10058150-3 = "게헨나컵 결승선"
10058150-4 = "(경기 종료 후, 그날 밤)"
10058150-10 = "거기, 잘 안 빠지면 그냥 망치로 부숴도 괜찮아."
10058150-11 = "어차피 결승선은 다음 경기 때 새로 만드는 거라서 너무 애쓸 필요 없어."
10058150-12 = "그렇지만 아까운걸요. 기껏 다들 모여서 열심히 그린 간판인데."
10058150-13 = "그렇긴 한데, 다음에도 또 그리면 되니깐."
10058150-14 = "빨리 철거하고 들어가서 쉬자. 무사히 경기 끝난 뒤풀이해야지!"
10058150-15 = "좋네요! 그러면 그냥 부술게요. 영차!"
10058150-16 = "여기를 때리면……."
10058150-19 = "뭐지? 늦어지니까 도와주려고 누굴 보냈나?"
10058150-20 = "탱크로 철거해 주려고 하나 봐요."
10058150-21 = "아니, 저거 탱크가 아니라……."
10058150-23 = "히잉……. 헤엑……. 헥……."
10058150-24 = "흐갸악……. 게엑……. 크하악……."
10058150-25 = "앗! 결승선입니다! 이제 다 왔어요!"
10058150-27 = "헤엑……. 헥……. 뭐, 뭐야?! 다 어디 갔어?!"
10058150-28 = "히이잉……. 헤엑……."
10058150-29 = "아직 아무도 도착 안 했나 봅니다! 우리가 1등인가 봐요!"
10058150-30 = "아무래도 그건 아니겠지!"
10058150-33 = "전……."
10058150-34 = "……차?"
10058150-37 = "아앗……. 결승선이……."
10058150-38 = "철거 중이잖아……. 설마 경기……. 끝난 거야……?"
10058150-39 = "와, 완주했는데……."
10058150-40 = "캐앵……."
10058150-44 = "아, 아직 경기 안 끝났어요!"
10058150-45 = "아직 결승선 남아있으면 끝난 거 아니에요!"
10058150-46 = "히, 힘내라!! 힘내라!!"
10058150-50 = "우우웃-!"
10058150-53 = "골-인-!"
