[translation]
10058150-1 = "後日談その3;駆け抜けた所に楽園はある"
10058150-3 = "ゲヘナカップ・ゴール"
10058150-4 = "（レース終了後の夜）"
10058150-10 = "そこ、抜けなければハンマーで壊してもいいよ。"
10058150-11 = "どうせ、また新しく作るんだから。"
10058150-12 = "でも、なんかもったいないですね。みんなで一生懸命作ったのに。"
10058150-13 = "たしかにそうだけど、また頑張ればいいでしょ。"
10058150-14 = "早く終わらせて、打ち上げにでも行こう！"
10058150-15 = "いいですね！それなら、どんどん壊します！よいしょ！"
10058150-16 = "ここを叩けば……。"
10058150-19 = "誰か手伝いに来てくれたのかな？"
10058150-20 = "戦車で撤去しようとしてくれてるみたいです。"
10058150-21 = "いや、あれは戦車じゃなくて……。"
10058150-23 = "ひいぃ……ふうっ……はあっ……。"
10058150-24 = "うにゃあ……げへっ……くはぁ……。"
10058150-25 = "あっ！ゴールが見えました！もう少しですよ！"
10058150-27 = "へぇっ……へっ……な、なに！？みんなどこに行ったの？"
10058150-28 = "ひいぃ……。"
10058150-29 = "まだ誰もゴールしてないみたいです！私たちが優勝ですね！"
10058150-30 = "さすがにそれはないでしょ！"
10058150-33 = "せん……。"
10058150-34 = "……しゃ？"
10058150-37 = "ああっ……ゴールが……。"
10058150-38 = "撤去してる……？まさか……もう終わったの……？"
10058150-39 = "か、完走したのに……。"
10058150-40 = "きゅう……。"
10058150-44 = "ま、まだゴールしていませんよ！"
10058150-45 = "ラインまで、あと少しです！！"
10058150-46 = "が、頑張れ！！頑張れ！！"
10058150-50 = "ぶぅぅぅんっ！"
10058150-53 = "ゴールイン～！"
