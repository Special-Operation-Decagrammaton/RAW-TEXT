[translation]
33130-1 = "제13화;닿을 수 없는 저쪽"
33130-2 = "……."
33130-3 = "그러네요."
33130-4 = "하나코는 똑똑한 아이니까 지금 펼쳐진 정보만으로도 진실에 거의 도달할 수 있었습니다."
33130-5 = "지금 펼쳐진 상황. 원인. 그리고 자신은 이것을 막을 방법이 없다는 것까지도 알게 되었죠."
33130-6 = "겨우 좋아하기로 마음먹은 트리니티 학원이었는데 말이죠. 하나코에게는 잔인한 일이 되어버렸네요."
33130-7 = "……."
33130-8 = "그리고 동일하게 같은 결론에 도달한 학생의 이야기를 해볼까요."
33130-9 = "……아즈사를 찾기 위해 동분서주하던 히후미는 한 통의 연락을 받게 됩니다."
33130-10 = "좌표와 시간, 그리고 동물 이름의 음어만 적혀 있는 문자였지만, 히후미는 이런 문자를 보내는 사람이 누군지 잘 알고 있었죠."
33130-17 = "아즈사 쨩……?"
33130-18 = "아즈사 쨩? 저예요, 어디에 있는 거예요? 약속대로 제가 왔어요……."
33130-19 = "아즈사 쨩……? 여기 있는 거예요? 대답해줘요, 아즈사 쨩……."
33130-25 = "아즈사 쨩……?"
33130-26 = "히후미."
33130-27 = "아즈사 쨩……? 지금까지 어디 있었던 거예요? 지금 학원은 난리가 나서……."
33130-28 = "……알고 있어."
33130-29 = "아, 아즈사 쨩……?"
33130-30 = "……누군가는 이걸 막아야만 해."
33130-31 = "아즈사 쨩……? 지금 뭐라고…… 어째서 그런 얼굴을……?"
33130-32 = "아, 아즈사 쨩……?"
33130-38 = "가까이 오지 마!!"
33130-39 = "……!!"
33130-40 = "……."
33130-41 = "……고마워, 히후미."
33130-42 = "하지만 여기까지야. 너는 그 선을 넘어선 안 돼."
33130-43 = "[ruby= ・ ] 여[/ruby][ruby= ・ ]기[/ruby]는 학생이 아닌, 나 같은 사람에게 어울리는 곳이야."
33130-44 = "너는 [ruby= ・ ]여[/ruby][ruby= ・ ]기[/ruby]에 오면 안 돼."
33130-45 = "아즈사 쨩……? 무, 무슨 얘기인지 잘 모르겠어요,"
33130-46 = "저기…… 저로는 안 된다는 거예요? 그, 그게 무슨 뜻이에요?"
33130-50 = "여기는 평범하고 착한…… 네게 어울리는 곳이 아냐……."
33130-51 = "어째서!! 아즈사 쨩, 저는……!"
33130-52 = "살인자."
33130-53 = "……!"
33130-54 = "……살인자가 된 나를 친구로 받아줄 수 있겠어?"
33130-55 = "네? 뭐, 뭐라고요? 아즈사 쨩? 그건……."
33130-56 = "사, 살인자라니…… 대체 무슨 얘기를……."
33130-57 = "나 때문이야."
33130-58 = "나 때문에 모두가……. 선생님이 다쳤어."
33130-59 = "나 때문에 정의부의 사람들이, 티파티가, 시스터들이, 게헨나의 사람들이……."
33130-60 = "세이아가 혼수상태가 된 것도, 도시가 파괴된 것도, 모두……."
33130-61 = "그리고 이제 히후미와 하나코와 코하루까지 위험하게 될 거야."
33130-63 = "아즈사 쨩…… 그건…… 아즈사 쨩의 잘못이 아니에요……. 그건……."
33130-64 = "곧 모든 게 괜찮아질 거예요…… 서, 선생님은……."
33130-65 = "서, 선생님도…… 부, 분명…… 금방 일어나실 거고……. 그, 그러니까……."
33130-66 = "히후미."
33130-67 = "그런 해피 엔딩은…… 이 세계의 진실이 아니야."
33130-68 = "아즈사 쨩……?"
33130-69 = "지금부터 나는 사오리의 헤일로를 파괴하러 갈 거야."
33130-70 = "그것 말고는 이 사태를 막을 방법은 없어."
33130-71 = "……네? 자, 잠깐만요. 뭐, 뭐라고요……? 아즈사 쨩……? 방법……? 방법이라면……."
33130-77 = "나는 살인자."
33130-78 = "그래. 그런 것이 당연한 곳에서, 그런 교육을 받고, 그렇게 움직이게 훈련된 존재."
33130-79 = "이게 내 진짜 모습이야."
33130-80 = "이런 기괴하고 흉측한 걸 쓰고 있는 나는 히후미의 세계에 어울리지 않아."
33130-81 = "아, 아즈사 쨩……?"
33130-86 = "……히후미. 나를 친구로 여겨줘서 고마워.[wa:500]"
33130-89 = " <아즈사 쨩>이라고 불러줘서 고마워.[wa:500]"
33130-92 = "귀여운 인형을 선물해줘서 고마워.[wa:500]"
33130-97 = "같이 바다에 가서 좋았어. 즐거운 기억들이 생겨서 좋았어.[wa:4000]"
33130-100 = "예쁜 것들을 보고,[wa:2700]"
33130-101 = "모르는 것들을 알게 되어서 좋았어."
33130-106 = "보충수업부에서[wa:3000]"
33130-107 = "많은 것을 배울 수 있어서 좋았어.[wa:3500]"
33130-111 = "배운다는 건 정말 즐거운 거구나. 죽어도 잊지 않을 거야."
33130-112 = "학생일 수 있어서 다행이야."
33130-117 = "안녕. 히후미 [ruby=・]쨩[/ruby]."
33130-121 = "아즈사 쨩……?"
33130-122 = "저기, 아즈사 쨩…… 아, 안 돼요. 잠깐만요…… 기다려요……."
33130-123 = "뭐, 뭘 하려는 거예요? 잠깐만요…… 분명 다른 방법이…… 서, 선생님이……. 모두가……."
33130-124 = "아즈사 쨩……."
33130-125 = "다음에 모두 함께 바다에 가자고 약속했었잖아요…… 저기……. 아직 애니메이션도 같이 보지 못했고……. 아, 아즈사 쨩……."
33130-126 = "아……."
33130-127 = "아즈사 쨩…… 안 돼요…… 가지 마요……. 기다려요…… 아즈사 쨩……."
33130-129 = "아즈사 쨩!!!"
33130-135 = "다음화;어둠 속의 빛"
