33210-9 = "아, 아하하…… 네. 뭐…… 그럭저럭……."
33210-10 = "뭐지, 이 동창회 분위기……."
33210-11 = "응응! 좋아요~ 다 같이 사이좋게 지내면 좋으니까요-☆"
