[translation]
90101050-1 = "제5화;두려움에 대한 기록"
90101050-2 = "시라토리 제 3 구립 도서관 열람실"
90101050-5 = "저, 실례합니다. 열람실의 신문 스크랩 파일을 확인하려 하는데요……"
90101050-6 = "O월 O일의 조간 신문은 스크랩되지 않았나요? 그 날 신문만 스크랩북에서 빠져 있는 것 같아서요."
90101050-7 = "그런가요? 이상하네. 신문 스크랩 업무는 매일 아침 하고 있어서 빠진 날짜는 없을텐데……"
90101050-8 = "아…… 기억났다."
90101050-9 = "그날 저녁, 신문사에서 직접 찾아와서, 신문에 정정 보도를 해야 하는 내용이 있다며 신문을 회수해 갔거든요."
90101050-10 = "신문까지 회수하는 경우는 거의 없어서 똑똑하게 기억하고 있어요."
90101050-11 = "그렇군요…… 문제가 된 기사가 어떤 내용이었는지는 알고 계신가요?"
90101050-12 = "아뇨. 저희 업무는 스크랩 뿐이라…… 죄송합니다. 그날 실린 기사에 대해서는 잘 모르겠네요."
90101050-13 = "아닙니다. 알려주셔서 감사합니다."
90101050-20 = "(……정보통제는 확실히 진행된 모양이군.)"
90101050-21 = "(덕분에 그 괴상한 새 마스코트 모습을 한 괴수가 나타났다는 소문이 퍼지자, 대부분의 사람들은 터무니없는 이야기라 치부하고 무시했었지.)"
90101050-22 = "(나 역시도 얼마전까지는 그렇게 생각했었지만……)"
90101050-24 = "그러니까, 선생님의 말에 의하면."
90101050-25 = "그 '페로로지라'라는 이름의 한정판 봉제 인형이, 팬들의 염원으로 되살아나서……"
90101050-26 = "D.U.를 향해 접근하다 샬레와 발키리의 협동 작전으로 격퇴되었다는 거야?"
90101050-27 = "그러고 보니 전에 확보한 발키리 경비국의 기록에도, 그날 대규모의 경비 병력이 출동했다는 내용이 적혀 있었던 것 같아."
90101050-29 = "(선생님의 증언도 있었으니, 그날 바다에서 나타난 괴수가 해안을 습격했던 건 분명한 사실이었을 거야.)"
90101050-30 = "(다만 마음에 걸리는 부분이라면…… 어째서 괴수의 외형이 그런 '바보 같은 새'의 모습을 하고 있었던 걸까?)"
90101050-31 = "(불특정 다수의 심상에 남을 만한 강력한 도시 전설이라면, 보통 공포스러운 외형을 지니는 것이 보통인데.)"
90101050-32 = "(특정 매니아 층에서만 화제가 되었던 우스꽝스러운 인형이, D.U.에 거대한 재해를 일으킬 뻔 했다니……)"
90101050-36 = "……이해할 수 없어."
90101050-37 = "(좀 더 그 봉제 인형에 대한 전말과 당시의 상황을 조사해야 해.)"
90101050-38 = "(하지만 SNS는 물론이고, 대부분의 신문 기사도 검열을 당해 내용을 확인할 수가 없으니……)"
90101050-39 = "뭔가 찾으시는 책이라도 있으신가요?"
90101050-43 = "아뇨. 책은 아닙니다만……"
90101050-44 = "뭔가 찾으시는 정보가 있으시다면 제가 도와드릴게요. 지식을 찾는 사람을 돕는 것은 사서의 의무니까요."
90101050-46 = "물론 이 곳에는 없을지도 모르지만……"
90101050-50 = "저희 도서관에는 남아 있을지도 모르니까요."
90101050-51 = "저희 도서관……?"
90101050-52 = "아, 제 소개가 늦었네요. 저는 엔도우 시미코라고 합니다."
90101050-53 = "평소에는 트리니티 도서부에서 사서로 일하고 있는데, 오늘은 도서 교환 행사 차 잠깐 나왔어서요."
90101050-54 = "혹시 제 도움이 필요하신가요?"
90101050-55 = "아닙니다. 아마 이제는 구할 수 없는 자료일 거라서요."
90101050-56 = "O월 O일의 회수된 신문에 실린 기사를 찾고 있는데, 어딜가도 찾을 수가 없어서……"
90101050-57 = "O월 O일 회수된 신문의 기사라면……"
90101050-58 = "혹시 'D.U. 인근 해역에서 정체불명의 괴수가 나타났다'는 기사 말씀이신가요?"
90101050-62 = "그렇습니다. 혹시 기억하고 계신가요?"
90101050-63 = "네. 그 기사의 내용이라면 대부분 기억하고 있어요."
90101050-64 = "신고를 한 사람은 인근 해역에서 조업 중이던 어부로, 수면 아래에서 거대한 그림자가 빠르게 움직이는 것을 보고 항만관리 사업소에 연락을 했다고 해요."
90101050-65 = "신고 내용에 따르면 고래만큼이나 거대하지만, 청새치만큼 빠른 속도의 그림자…… 였다는데요."
90101050-67 = "신고를 받은 발키리 해양경찰은 괴수를 다시 바다로 돌려보내는 데에는 성공했지만, 대응 과정에서 다수의 헬리콥터가 파손되는 등 적지 않은 피해를 입었다고 해요."
90101050-68 = "괴수의 외형은 <모모프렌즈> 사의 인형 <페로로지라>를 닮았고, 작년에 개봉한 괴수 영화의 주인공처럼 눈에서 섬광을 뿜기도 했고—"
90101050-69 = "아, 참고로 그 모모프렌즈 사의 인형은 현재는 구할 수 없다는 내용도 적혀 있었어요."
90101050-71 = "감사합니다. 큰 도움이 되었습니다."
90101050-72 = "……하지만 놀랍군요. 기사 내용을 기억하고 있는 사서 분과 우연히 마주치게 되다니."
90101050-73 = "설마, 그간 읽었던 모든 신문의 내용을 기억하고 계신 건—"
90101050-74 = "아하하, 설마요. 유난히 인상적인 기사라서 기억하고 있던 것뿐이에요."
90101050-75 = "평소에는 거의 이야기도 하지 않던 부부장님이 갑자기 부탁했던 건이라 기억에 남은 것도 있고."
90101050-76 = "여하튼, 예상했던 것과는 달리 이 <페로로지라>의 원전은 평범한 이야기였군요."
90101050-77 = "……'평범한' 이야기요?"
90101050-78 = "네. 한 때 다크웹을 떠들썩하게 한 도시 전설의 원전이 지역 신문에 실려있다고 해서 한 번 찾아와 보았는데……"
90101050-79 = "실제로 기사에 실려 있는 내용은 괴수 영화에서 흔히 마주할 수 있는 클리셰와 어수룩한 인형의 단종 소식 뿐이었으니까요."
90101050-80 = "……글쎄요. 그건 저희가 판단할 수 없지 않을까요?"
90101050-81 = "그 말씀은 아직 밝혀지지 않은 증거가 또 있다는 말씀이십니까?"
90101050-82 = "아뇨. 다른 내용이 숨겨져 있다기 보다는……"
90101050-83 = "누군가에게는 그 괴수 영화와 인형이 평범하지 않았을지도 모른다는 이야기예요."
90101050-84 = "어릴 적 용과 기사가 등장하는 마법책을 읽었을 때, 저는 이 세상에 실제로 용과 기사가 존재한다고 생각했었어요."
90101050-85 = "물론 나이가 들며 동화에 나오는 존재가 모두 현실에 존재하지 않다는 사실을 깨달았지만, 책을 읽고 있을 때만큼은 그 동화 속의 세상이 제 전부처럼 느껴졌거든요."
90101050-86 = "그 어수룩한 인형과 흔한 괴수가 등장하는 가상의 세계도, 누군가에게는 현실보다 더 현실적으로 느껴지지 않았을까요?"
90101050-87 = "게다가 도시 전설은 완벽히 이해할 수 없기에 도시 전설이라고 불리는 것이니까요."
90101050-92 = "그건…… 그렇군요."
90101050-93 = "공포 이외의 감정에서도 로어가 태어날 수 있다면……"
90101050-94 = "찾으시는 책은 더 없으신가요?"
90101050-95 = "그럼 저는 다른 책을 정리하러 이만—"
90101050-96 = "저, 지극히 개인적인 질문입니다만……"
90101050-97 = "혹시 최근에 재미있게 읽었던 책이나 미디어가 있다면 하나만 추천해 주시겠습니까?"
90101050-98 = "최근에 재미있게 읽은 책이요? 으음, 너무 많아서 하나만 고르기가 어려운데요."
90101050-99 = "그래도 몰입의 측면에서 하나만 꼽으라면……"
90101050-103 = "혹시 <마법소녀 헤비캘리버>, 들어 보셨나요?"
90101050-105 = "다음화;항구의 사람들 2"
