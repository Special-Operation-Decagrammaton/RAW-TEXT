[translation]
90101050-1 = "ตอนที่ 5;บันทึกเกี่ยวกับความกลัว"
90101050-2 = "ห้องอ่านหนังสือ ห้องสมุดที่ 3 ประจำเขตชิราโทริ"
90101050-4 = ""
90101050-5 = "เอ่อ ขอโทษนะคะ ฉันมาตรวจสอบสมุดรวมข่าวหนังสือพิมพ์ของห้องอ่านหนังสือน่ะค่ะ..."
90101050-6 = "มีข่าวจากหนังสือพิมพ์ฉบับเช้าของวันที่ x เดือน x เก็บไว้บ้างมั้ยคะ? เหมือนว่าจะมีแค่ฉบับของวันนั้นที่หายไปจากสมุดรวมข่าวน่ะค่ะ"
90101050-7 = "งั้นเหรอคะ? แปลกจัง ปกติเราจะรวบรวมข่าวหนังสือพิมพ์ทุกเช้า ไม่น่าจะมีของวันไหนตกหล่นนะ..."
90101050-8 = "อ๊ะ... นึกออกแล้ว"
90101050-9 = "เย็นวันนั้น ทางสำนักข่าวหนังสือพิมพ์มาที่นี่ด้วยตัวเองและเรียกหนังสือพิมพ์คืนไป และบอกว่ามีเนื้อหาบางส่วนที่ต้องแก้ไขค่ะ"
90101050-10 = "ปกติแล้วแทบไม่มีกรณีเรียกคืนหนังสือพิมพ์เลย ฉันก็เลยจำได้แม่นค่ะ"
90101050-11 = "อย่างนี้สินะคะ... พอจะทราบมั้ยคะว่าข่าวที่มีปัญหาเป็นเรื่องอะไร?"
90101050-12 = "ไม่ทราบเลยค่ะ หน้าที่ของพวกฉันมีแค่ตัดข่าวเก็บไว้เท่านั้น... ต้องขอโทษด้วยค่ะ เรื่องข่าวที่ลงในวันนั้น ฉันก็ไม่ค่อยรู้เหมือนกันค่ะ"
90101050-13 = "ไม่เป็นไรค่ะ ขอบคุณที่ช่วยบอกนะคะ"
90101050-14 = ""
90101050-16 = ""
90101050-19 = ""
90101050-20 = "(ดูเหมือนจะมีการควบคุมข้อมูลจริงๆ ด้วยนะ...)"
90101050-21 = "(ตอนมีข่าวลือเรื่องสัตว์ประหลาดรูปร่างเหมือนมาสคอตนกแปลกๆ แพร่กระจาย คนส่วนใหญ่ถึงได้มองว่าเป็นเรื่องไร้สาระ แล้วก็ไม่สนใจ)  "
90101050-22 = "(ตัวฉันเองก็คิดแบบนั้นมาตลอด จนกระทั่งเมื่อไม่นานนี้...)"
90101050-24 = "ถ้ามันหมายความตามที่คุณครูพูดเอาไว้ละก็..."
90101050-25 = "ตุ๊กตาผ้าลิมิเต็ดที่ชื่อ 'เพโรโร่ซิลล่า' ตัวนั้นฟื้นขึ้นมาเพราะแรงปรารถนาของแฟนๆ..."
90101050-26 = "ก็เลยมุ่งหน้าไปยัง D.U. ก่อนจะถูกปราบด้วยปฏิบัติการร่วมระหว่างชาเล่ต์กับวัลคิรี่งั้นเหรอ?"
90101050-27 = "จะว่าไปแล้ว ในบันทึกของสำนักความมั่นคงที่เราได้มาก่อนหน้านี้ ก็มีระบุไว้ว่าวันนั้นมีการระดมกำลัง#nเจ้าหน้าที่รักษาความปลอดภัยชุดใหญ่เหมือนกัน"
90101050-28 = ""
90101050-29 = "(ในเมื่อมีคำให้การของคุณครู ถ้างั้นก็ยืนยันได้ว่าการที่สัตว์ประหลาดปรากฏตัวขึ้นในทะเล และบุกโจมตีชายฝั่งเป็นเรื่องจริง)"
90101050-30 = "(แต่เรื่องที่ยังติดใจอยู่ก็คือ... ทำไมสัตว์ประหลาดถึงมีรูปร่างเป็น 'เจ้านกซื่อบื้อ' แบบนั้นกันล่ะ?)"
90101050-31 = "(ถ้าเป็นตำนานเมืองที่มีพลังและฝังอยู่ในความทรงจำของผู้คนจำนวนมาก ก็ควรมีรูปลักษณ์ที่น่าสะพรึงกลัวสิ)"
90101050-32 = "(ตุ๊กตาตลกๆ ที่โด่งดังอยู่แค่ในหมู่แฟนเฉพาะกลุ่ม กลับเกือบก่อให้เกิดหายนะอย่างใหญ่หลวงกับ D.U. ได้แบบนี้...)"
90101050-33 = ""
90101050-35 = ""
90101050-36 = "ไม่เห็นจะเข้าใจเลย..."
90101050-37 = "(ต้องสืบเรื่องราวทั้งหมดของตุ๊กตาผ้าตัวนั้น และสถานการณ์ในตอนนั้นให้ละเอียดกว่านี้แล้วละ)"
90101050-38 = "(แต่ไม่ใช่แค่ในโซเชียลมีเดียเท่านั้น แม้แต่บทความข่าวในหนังสือพิมพ์ส่วนใหญ่ก็ถูกเซ็นเซอร์#nจนไม่สามารถตรวจสอบเนื้อหาได้...)"
90101050-39 = "กำลังหาหนังสืออะไรอยู่หรือเปล่าคะ?"
90101050-40 = ""
90101050-42 = ""
90101050-43 = "เปล่าค่ะ ฉันไม่ได้หาหนังสือ..."
90101050-44 = "ถ้ากำลังหาข้อมูลอะไรอยู่ ให้ฉันช่วยได้นะคะ การช่วยเหลือผู้ที่แสวงหาความรู้คือหน้าที่ของบรรณารักษ์#nอยู่แล้วค่ะ"
90101050-45 = ""
90101050-46 = "แม้ว่าข้อมูลที่กำลังหาอยู่ อาจจะไม่มีอยู่ที่นี่..."
90101050-47 = ""
90101050-49 = ""
90101050-50 = "แต่ที่ห้องสมุดของพวกเรา อาจจะมีข้อมูลนั้นหลงเหลืออยู่ก็ได้ค่ะ"
90101050-51 = "ห้องสมุดของพวกคุณเหรอคะ...?"
90101050-52 = "อ๊ะ มัวแต่คุยจนลืมแนะนำตัวเลย ฉันชื่อเอ็นโดะ ชิมิโกะค่ะ"
90101050-53 = "ปกติฉันทำงานเป็นบรรณารักษ์อยู่ที่ชมรมอ่านหนังสือของทรีนิตี้ แต่วันนี้ออกมาช่วยงานแลกเปลี่ยน#nหนังสือน่ะค่ะ"
90101050-54 = "อยากให้ฉันช่วยอะไรมั้ยคะ?"
90101050-55 = "ไม่เป็นไรค่ะ มันน่าจะเป็นข้อมูลที่ตอนนี้หาไม่ได้แล้วน่ะค่ะ"
90101050-56 = "ฉันกำลังตามหาข่าวที่ลงในหนังสือพิมพ์ฉบับที่ถูกเรียกคืนของวันที่ x เดือน x แต่ไม่ว่าจะไปหาที่ไหน#nก็หาไม่เจอเลย..."
90101050-57 = "ถ้าเป็นข่าวในหนังสือพิมพ์ฉบับที่ถูกเรียกคืนของวันที่ x เดือน x ละก็... "
90101050-58 = "หมายถึงข่าวที่ว่า 'มีสัตว์ประหลาดปริศนาปรากฏตัวในทะเลแถว D.U.' หรือเปล่าคะ?"
90101050-59 = ""
90101050-61 = ""
90101050-62 = "ใช่ค่ะ คุณยังจำเนื้อหาของข่าวได้เหรอคะ?"
90101050-63 = "ค่ะ ถ้าเป็นข่าวนั้น ฉันจำเนื้อหาได้เกือบทั้งหมดเลยค่ะ"
90101050-64 = "คนที่แจ้งเหตุเป็นชาวประมงที่กำลังออกเรืออยู่ในน่านน้ำใกล้เคียง เขาเห็นเงาขนาดมหึมาเคลื่อนที่#nอย่างรวดเร็วอยู่ใต้ผิวน้ำ ก็เลยติดต่อไปยังสำนักงานบริหารท่าเรือค่ะ"
90101050-65 = "ตามรายงานระบุว่าเป็นเงาที่มีขนาดใหญ่เท่าวาฬ... แต่เคลื่อนที่ได้รวดเร็วพอๆ กับปลากระโทงเลยค่ะ"
90101050-67 = "ตำรวจน้ำของวัลคิรี่ที่ได้รับแจ้งเหตุสามารถไล่สัตว์ประหลาดตัวนั้นกลับลงทะเลได้สำเร็จ แต่ระหว่าง#nปฏิบัติการก็ได้รับความเสียหายไม่น้อย ได้ยินว่าเฮลิคอปเตอร์ถูกทำลายไปหลายลำเลยละค่ะ"
90101050-68 = "รูปลักษณ์ของสัตว์ประหลาดตัวนั้นคล้ายกับตุ๊กตา <เพโรโร่ซิลล่า> ของ <MOMO FRIENDS> และยังปล่อยลำแสงออกจากตาได้เหมือนตัวเอกในภาพยนตร์สัตว์ประหลาดที่ฉายเมื่อปีที่แล้ว..."
90101050-69 = "อ้อ แล้วในข่าวยังบอกด้วยว่า ตอนนี้ตุ๊กตาของบริษัท MOMO FRIENDS นั้นหาซื้อไม่ได้แล้วด้วยค่ะ "
90101050-70 = ""
90101050-71 = "ขอบคุณนะคะ ข้อมูลเป็นประโยชน์มากเลยค่ะ"
90101050-72 = "แต่ก็น่าทึ่งเลยนะคะ... ฉันบังเอิญมาเจอบรรณารักษ์ที่จำเนื้อหาของข่าวที่หาอยู่ได้พอดีเลย"
90101050-73 = "หรือว่าคุณจะจำเนื้อหาของหนังสือพิมพ์ทุกฉบับที่เคยอ่านได้ทั้งหมด..."
90101050-74 = "อะฮะฮ่า... ไม่หรอกค่ะ มันเป็นข่าวที่น่าประทับใจเป็นพิเศษ ฉันก็เลยจำได้ก็เท่านั้นเองค่ะ"
90101050-75 = "อีกอย่าง มันก็เป็นเรื่องที่รองหัวหน้าชมรมที่ปกติแทบจะไม่พูดอะไรเลย จู่ๆ ก็มาขอร้องฉัน ก็เลยติดอยู่ในความทรงจำด้วยค่ะ"
90101050-76 = "ถึงอย่างนั้น ต้นกำเนิดของ <เพโรโร่ซิลล่า> ก็เป็นเรื่องธรรมดากว่าที่ฉันคิดไว้เสียอีกนะคะ"
90101050-77 = "เรื่อง 'ธรรมดา' งั้นเหรอคะ...?"
90101050-78 = "ค่ะ ได้ยินว่าต้นกำเนิดของตำนานเมืองที่เคยโด่งดังไปทั่วดาร์กเว็บอยู่ช่วงหนึ่ง ถูกตีพิมพ์อยู่ในหนังสือพิมพ์ท้องถิ่น ฉันก็เลยลองมาตรวจสอบดู..."
90101050-79 = "แต่พอได้รู้จริงๆ เนื้อหาก็มีแค่เหตุการณ์ซ้ำๆ ที่พบได้ทั่วไปในหนังสัตว์ประหลาด กับข่าวว่าตุ๊กตาหน้าตาเซ่อๆ ตัวหนึ่งเลิกผลิตไปแล้วก็เท่านั้นค่ะ"
90101050-80 = "อืม... เรื่องนั้นคงไม่ใช่สิ่งที่พวกเราจะตัดสินได้หรอกนะคะ"
90101050-81 = "คุณกำลังบอกว่ายังมีหลักฐานที่ยังไม่ถูกเปิดเผยอยู่อีกงั้นเหรอคะ?"
90101050-82 = "เปล่าค่ะ ไม่ใช่ว่ามีเนื้อหาอื่นถูกซ่อนเอาไว้..."
90101050-83 = "แต่สำหรับใครบางคน ภาพยนตร์สัตว์ประหลาดกับตุ๊กตาแบบนั้นอาจไม่ใช่เรื่องธรรมดาก็ได้ค่ะ"
90101050-84 = "ตอนเด็กๆ ตอนที่ฉันอ่านหนังสือเวทมนตร์ที่มีมังกรกับอัศวินเป็นตัวละคร ฉันเคยเชื่อจริงๆ ว่าบนโลกนี้มีมังกรกับอัศวินอยู่ค่ะ"
90101050-85 = "แน่นอนว่าเมื่อโตขึ้น ฉันก็เข้าใจว่าสิ่งที่ปรากฏในนิทานไม่ได้มีอยู่จริงทั้งหมด แต่ในตอนที่กำลังอ่านหนังสือ โลกในนิทานนั้นก็ให้ความรู้สึกราวกับเป็นทั้งโลกของฉันเลยค่ะ"
90101050-86 = "โลกสมมติที่มีตุ๊กตาหน้าตาเซ่อๆ กับสัตว์ประหลาดแสนธรรมดาปรากฏอยู่ สำหรับใครบางคนแล้ว มันอาจให้ความรู้สึกสมจริงยิ่งกว่าความเป็นจริงก็ได้นะคะ"
90101050-87 = "อีกอย่าง สิ่งที่เรียกว่า 'ตำนานเมือง' ก็เป็นเพราะมันเป็นเรื่องที่ไม่อาจอธิบายหรือเข้าใจได้อย่างสมบูรณ์#nนี่คะ"
90101050-88 = ""
90101050-90 = ""
90101050-91 = ""
90101050-92 = "เรื่องนั้นก็... นั่นสินะคะ"
90101050-93 = "ถ้า 'ตำนาน' สามารถถือกำเนิดขึ้นจากอารมณ์อื่นนอกเหนือจากความหวาดกลัวได้ละก็..."
90101050-94 = "ไม่มีหนังสือเล่มไหนที่จะหาเพิ่มแล้วใช่มั้ยคะ?"
90101050-95 = "ถ้างั้นฉันขอตัวไปจัดหนังสืออื่นต่อก่อน..."
90101050-96 = "เอ่อ... เป็นคำถามที่ค่อนข้างส่วนตัวสักหน่อยนะคะ..."
90101050-97 = "ถ้าช่วงนี้มีหนังสือหรือสื่ออะไรที่คุณอ่านแล้วรู้สึกสนุก คุณช่วยแนะนำให้สักอย่างได้มั้ยคะ?"
90101050-98 = "หนังสือสนุกๆ ที่อ่านช่วงนี้เหรอคะ? อืม... มีเยอะมากจนเลือกแค่เล่มเดียวยากเลยค่ะ"
90101050-99 = "แต่ถ้าจะเลือกสักเรื่อง โดยดูจากความชวนให้ติดตามแล้วละก็..."
90101050-100 = ""
90101050-102 = ""
90101050-103 = "เคยได้ยินเรื่อง <สาวน้อยเวทมนตร์ เฮฟวี่ แคลิเบอร์> มาก่อนมั้ยคะ?"
90101050-105 = "ตอนต่อไป;คนในท่าเรือ 2"
