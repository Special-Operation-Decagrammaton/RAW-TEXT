[translation]
90101050-1 = "第5話;關於恐懼的記錄"
90101050-2 = "白鳥第三區立圖書館閱覽室"
90101050-4 = ""
90101050-5 = "那個……不好意思。我想查看閱覽室的新聞剪報檔案……"
90101050-6 = "請問O月O日的晨報沒有被收錄嗎？好像只有那天的新聞不在剪報簿裡。"
90101050-7 = "是嗎？真奇怪。#n我們每天早上都會整理剪報，應該不會有漏掉的日期才對……"
90101050-8 = "啊……我想起來了。"
90101050-9 = "那天晚上報社的人親自跑來，說有需要更正的報導內容就把報紙收走了。"
90101050-10 = "連報紙都需要回收的情況很罕見，所以我記得很清楚。"
90101050-11 = "原來如此……您還記得當時出問題的報導內容是什麼嗎？"
90101050-12 = "不記得耶，我們的工作只有負責整理剪報而已……#n所以很抱歉，那天刊登的報導我不太清楚。"
90101050-13 = "不會，謝謝您告訴我。"
90101050-14 = ""
90101050-16 = ""
90101050-19 = ""
90101050-20 = "（……看來確實有執行過資訊管制）"
90101050-21 = "（多虧如此，當那隻有著奇怪鳥類吉祥物模樣的怪獸現身的傳聞開始流傳時，#n　大部分的人才會將其視為無稽之談而置之不理）"
90101050-22 = "（直到不久之前，我也同樣是那麼認為的……）"
90101050-24 = "也就是說，根據老師的說法……"
90101050-25 = "那個名叫「佩洛洛吉拉」的限定版布偶，因為粉絲們的執念而甦醒……"
90101050-26 = "並且朝著D.U.逼近，最後被夏萊和女武神的協同作戰擊退了，是這樣嗎？"
90101050-27 = "這麼說來，之前獲取的女武神警備局的記錄裡……#n好像也寫著那天出動了大規模的警備兵力呢。"
90101050-28 = ""
90101050-29 = "（既然有老師親自作證，想必那天從海上出現的怪獸襲擊了海岸是千真萬確的事實）"
90101050-30 = "（不過讓我在意的是……為什麼怪獸的外型會是那種「笨鳥」的模樣呢？）"
90101050-31 = "（如果是能留在廣大群眾心裡深處的都市傳說，通常都會擁有令人恐懼的外型才對）"
90101050-32 = "（只在特定族群裡成為話題的滑稽布偶，竟然差點在D.U.引發巨大的災害……）"
90101050-33 = ""
90101050-35 = ""
90101050-36 = "……無法理解。"
90101050-37 = "（必須更深入調查那個布偶的來龍去脈，以及當時的狀況才行）"
90101050-38 = "（但別說SNS了，就連大部分的新聞報導也都遭到審查而無法確認內容……）"
90101050-39 = "請問你在找什麼書嗎？"
90101050-40 = ""
90101050-42 = ""
90101050-43 = "不，我要找的不是書……"
90101050-44 = "如果你有想找的資料，我可以幫你哦。#n畢竟幫助尋求知識的人，正是圖書管理員的職責嘛。"
90101050-45 = ""
90101050-46 = "而且就算是這裡沒有的資料……"
90101050-47 = ""
90101050-49 = ""
90101050-50 = "我們的圖書館裡也可能還留著哦。"
90101050-51 = "你們的圖書館……？"
90101050-52 = "啊，忘記先自我介紹了呢。#n我叫円堂志美子。"
90101050-53 = "平常在三一圖書委員會擔任圖書管理員，今天是為了圖書交換活動才會短暫外出。"
90101050-54 = "請問是否需要幫忙呢？"
90101050-55 = "不用了，因為那大概是現在已經無法取得的資料。"
90101050-56 = "我在找O月O日被回收的報紙上刊登的報導，但不管去哪裡都找不到……"
90101050-57 = "如果是O月O日那份被回收的報紙上所刊登的報導……"
90101050-58 = "難道是「D.U.鄰近海域出現奇妙怪獸」的那篇報導嗎？"
90101050-59 = ""
90101050-61 = ""
90101050-62 = "沒錯，請問你還記得嗎？"
90101050-63 = "是的，那篇報導的內容我大致上都還記得。"
90101050-64 = "通報的人是在鄰近海域作業的漁夫。#n據說是看到巨大的影子在水面下快速移動，才聯絡了港口管理事務所。"
90101050-65 = "根據通報內容，那是個像鯨魚一樣巨大，卻又像旗魚一樣快速的影子……"
90101050-67 = "接獲通報的女武神海洋警察雖然成功將怪獸趕回了海裡……#n但是在應對過程中有多架直升機受損，似乎受到了不小的損害。"
90101050-68 = "怪獸的外型神似「Momo好友」公司的布偶「佩洛洛吉拉」，#n甚至還像去年上映的怪獸電影主角一樣從眼睛發射光束……"
90101050-69 = "啊，順帶一提，報導上還寫著那個Momo好友公司的布偶現在已經無法入手了。"
90101050-70 = ""
90101050-71 = "謝謝你，真是幫了大忙。"
90101050-72 = "……不過真是令人驚訝，竟然能偶然遇到還記得報導內容的圖書管理員。"
90101050-73 = "難道說，你把至今讀過的所有報紙內容都記在腦中──"
90101050-74 = "啊哈哈，怎麼可能呢。#n只是因為那篇報導特別地讓人印象深刻，所以才會記得。"
90101050-75 = "再加上那是平常幾乎不太說話的副委員長突然委託的案子，我才會特別有印象。"
90101050-76 = "總之，出乎意料的是這個「佩洛洛吉拉」的原型看來是個平凡的故事呢。"
90101050-77 = "……「平凡的」故事？"
90101050-78 = "是啊。聽說曾經在暗網上引起熱烈討論的都市傳說，#n其原始出處就刊登在地方報紙上，所以我才專程來看看……"
90101050-79 = "但實際刊登在報導上的內容……#n也只不過是怪獸電影裡常見的老套橋段，以及一款笨拙布偶的停產消息。"
90101050-80 = "……這恐怕不是我們能夠判斷的吧？"
90101050-81 = "你的意思是還有尚未查明的線索存在嗎？"
90101050-82 = "不，與其說是隱藏著其他內容……"
90101050-83 = "不如說是對某些人而言，那部怪獸電影和布偶或許並不平凡。"
90101050-84 = "小時候看到有龍與騎士登場的魔法書時，我曾以為這個世界上真的存在著龍和騎士。"
90101050-85 = "當然長大之後我也明白，童話裡的存在並非都真實存在於現實中。#n但至少在讀著那本書的時候，那個童話中的世界就彷彿是我的一切。"
90101050-86 = "對於某些人來說，那個笨拙的布偶和常見的怪獸所登場的虛構世界……#n會不會反而比現實世界更加真實呢？"
90101050-87 = "都市傳說正是因為無法被完全理解，才會被稱為都市傳說啊。"
90101050-88 = ""
90101050-90 = ""
90101050-91 = ""
90101050-92 = "這樣啊……原來如此。"
90101050-93 = "如果從恐懼以外的情感中也能誕生怪談的話……確實有道理。"
90101050-94 = "請問你還有其他想找的書嗎？"
90101050-95 = "如果沒有的話，我就先去整理──"
90101050-96 = "那個……雖然這是我極為私人的問題……"
90101050-97 = "不介意的話，可以請你向我推薦一部最近覺得有趣的作品嗎？"
90101050-98 = "最近覺得有趣的作品？#n唔嗯……因為實在是太多了，很難只挑一部出來。"
90101050-99 = "不過，如果以沉浸感的層面挑選一部的話……"
90101050-100 = ""
90101050-102 = ""
90101050-103 = "不知道你有沒有聽過《魔法少女Heavy Caliber》呢？"
90101050-105 = "下一話;港口的人們（２）"
