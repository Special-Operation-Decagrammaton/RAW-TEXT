[translation]
90101050-1 = "Episode 5;Records of Fear"
90101050-2 = "Shiratori District Library 3 Reading Room"
90101050-4 = ""
90101050-5 = "E-Excuse me. I wanted to look up a newspaper clipping in the reading room..."
90101050-6 = "Was the morning paper from O/O not clipped? It looks like that specific day is missing from the scrapbook."
90101050-7 = "Really? How odd. I clip the articles every morning, so nothing should be missing."
90101050-8 = "Ah... I remember now."
90101050-9 = "Someone from the publisher came and collected the newspapers that evening. They said they needed to make a correction."
90101050-10 = "It's rare for them to repossess their papers, so I remember that night clearly."
90101050-11 = "I see... Do you remember what the correction was about?"
90101050-12 = "No. I'm paid to clip, not read... I'm sorry. There were so many articles, and I simply don't remember."
90101050-13 = "I see. Thank you for your help."
90101050-14 = ""
90101050-16 = ""
90101050-19 = ""
90101050-20 = "(...An effective suppression of information.)"
90101050-21 = "(That's why most people thought that weird bird monster was nothing more than a silly story.)"
90101050-22 = "(I was among them until recently...)"
90101050-24 = "Let's get this straight, Sensei."
90101050-25 = "This limited-edition plush named \"Perorodzilla\" came to life because of fans' obsessive desires..."
90101050-26 = "...Then it approached the D.U., and was defeated in a joint operation with Schale and Valkyrie?"
90101050-27 = "You know, the Valkyrie Security Bureau records we procured mentioned a large deployment."
90101050-28 = ""
90101050-29 = "(Since Sensei attested to it, there must have been a monster attacking the coast that day.)"
90101050-30 = "(But something's bothering me... Why did the monster take the form of that goofy-looking bird in the first place?)"
90101050-31 = "(You'd think that an urban legend that lingers in the minds of the masses would be terrifying.)"
90101050-32 = "(But a silly plush that was only popular among rabid fans almost causing a catastrophic disaster in D.U...)"
90101050-33 = ""
90101050-35 = ""
90101050-36 = "...It doesn't add up."
90101050-37 = "(I need to research the story behind that plushie and the setting around it.)"
90101050-38 = "(But I can't find anything. The social media is censored...and even the newspapers are no help...)"
90101050-39 = "Is there a specific book you're looking for?"
90101050-40 = ""
90101050-42 = ""
90101050-43 = "No. It's not a book..."
90101050-44 = "I can help you with whatever you need. After all, it's a librarian's duty to aid those in search of knowledge."
90101050-45 = ""
90101050-46 = "Of course, while it might not be here..."
90101050-47 = ""
90101050-49 = ""
90101050-50 = "...we might have it in OUR library."
90101050-51 = "\"Our library\"...?"
90101050-52 = "Ah, allow me to introduce myself. I'm Endou Shimiko."
90101050-53 = "I work at the Trinity Library Committee, but I'm here today for a book exchange event."
90101050-54 = "So, what do you need help with?"
90101050-55 = "Oh, no. It's probably too hard to find..."
90101050-56 = "I'm looking for an article dated O/O. But the paper was recalled for corrections, and I can't seem to find the story anywhere..."
90101050-57 = "A recalled newspaper article on O/O... "
90101050-58 = "Do you mean, \"Unidentified Monster Appears In D.U. Waters\"?"
90101050-59 = ""
90101050-61 = ""
90101050-62 = "I think I do. Do you remember what it was about?"
90101050-63 = "Yes! Most of it, anyway."
90101050-64 = "It was an account reported to Port Management. A D.U. fisherman spotted a fast, massive shadow moving under the water's surface."
90101050-65 = "According to the report, the shadow was as big as a whale, but as fast as a marlin..."
90101050-67 = "After receiving the report, the Valkyrie coast guard succeeded in returning the monster back to the sea, but only after suffering significant damage. They lost several helicopters in the operation."
90101050-68 = "The monster resembled a Momo Friends plushie, \"Perorodzilla.\" It shot lasers from its eyes like the star of a recent monster movie..."
90101050-69 = "Ah, and the article mentioned that you couldn't get that Momo Friends plushie anymore. "
90101050-70 = ""
90101050-71 = "Thank you. That was very helpful."
90101050-72 = "...But it's surprising. I didn't expect to run into a librarian who remembers the details of a random newspaper article."
90101050-73 = "Do you have a photographic memory?"
90101050-74 = "Ahaha, there's no way! I just happened to remember it because it was a particularly striking piece."
90101050-75 = "Also, the vice president asked me about it. I rarely speak with her, so it stood out."
90101050-76 = "I guess the origin of this \"Perorodzilla\" was an unremarkable story. I didn't expect that."
90101050-77 = "...\"Unremarkable\"?"
90101050-78 = "Yes. I was researching an urban legend found only on the dark web. I thought the newspaper would reveal something sinister, but..."
90101050-79 = "It seems the article just covered ordinary monster movie clichés and a notice about a discontinued plushie."
90101050-80 = "...I wonder. But we can't be so sure, can we?"
90101050-81 = "Are you saying that there's more evidence somewhere?"
90101050-82 = "No, rather than there being a hidden story to the whole thing..."
90101050-83 = "I'm saying that a monster movie and a plushie might not be so unremarkable to some people."
90101050-84 = "When I was a child, I read a fairy tale about knights fighting a dragon. I thought it was all real."
90101050-85 = "As I got older, I realized that it was all fiction, but that fantasy world absolutely consumed my imagination as a child."
90101050-86 = "Maybe a fiction about a silly plushie and a typical monster felt more real than reality to someone out there?"
90101050-87 = "Urban legends are \"legends\" precisely because they cannot be fully explained or understood."
90101050-88 = ""
90101050-90 = ""
90101050-91 = ""
90101050-92 = "You...have a point."
90101050-93 = "If Lore can be born from emotions other than fear, then..."
90101050-94 = "Is there anything else you're looking for?"
90101050-95 = "If you'd excuse me, I need to organize some books now."
90101050-96 = "Um, I realize that this may sound overly personal..."
90101050-97 = "But have you enjoyed any media recently? I'd appreciate a recommendation."
90101050-98 = "Something I've enjoyed recently? Oh, I love so many things. How could I choose?"
90101050-99 = "But if I were to pick something that's totally immersive and amazing..."
90101050-100 = ""
90101050-102 = ""
90101050-103 = "Have you heard of \"Magical Girl Heavy Caliber\"?"
90101050-105 = "Next Episode;People of the Port 2"
