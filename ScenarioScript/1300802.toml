[translation]
1300802-1 = "아르바이트 보조"
1300802-2 = "아비도스 외곽 시장가"
1300802-3 = "늦잖아! 한참 기다렸다고."
1300802-4 = "[s] \"제 시간에 왔는데.\""
1300802-5 = "알바라는 건 원래 조금 일찍 나오는 거야."
1300802-6 = "[s] \"세리카는 엄격하구나.\""
1300802-7 = "그래도 도와주러 온 건 선생님 뿐이니까. 그런 점은 믿을만하다니까."
1300802-8 = "응? 아직 하겠다고 말한 적은 없다고? 그러지 말고."
1300802-9 = "한가한 시간을 그냥 보내는 건 아깝잖아. #n건강이라던가, 여유자금이라던가 여러 가지 생각해도 몸을 움직이는 쪽이 낫지."
1300802-10 = "응? 뭘 도우면 되냐고?"
1300802-12 = "자, 이걸 받아."
1300802-13 = "[s] \"광고지?\""
1300802-15 = "오늘 할 일은 광고지 나눠주는 알바야. #n이걸 주변의 우편함이나 지나가는 사람들에게 나눠주면 되는데, 한장에 1엔씩이거든!"
1300802-16 = "그러니까 스피드가 생명인 일이지! 오늘은 특히 양이 많아서 같이 할 사람이 필요했거든."
1300802-17 = "[s] \"이걸 돌리면 되는 거야?\""
1300802-18 = "무슨 소리야……. 선생님을 부른 건 나니까 힘든 일을 맡길 수는 없고……."
1300802-19 = "선생님은 여기서 내 보조만 해주면 돼."
1300802-20 = "여기서 자리를 지키고 있다가 내가 광고지를 돌리고 오면 다른 광고지 뭉치를 주고, 내가 다시 그걸 받아가고, 반복."
1300802-21 = "어때, 간단하지? 이걸로 내가 받은 일당의 절반을 나눌테니까! 힘내 보자고!"
1300802-22 = "[s1] \"그냥 같이하면 더 빨리 끝날 거 같은데.\"\n[s2] \"알바비를 나눈다니, 안 그래도 돼.\""
1300802-23 = "자자, 이럴 시간 없어. 그럼 시작한다! 먼저 500장 줘!"
1300802-24 = "자자, 이럴 시간 없어. 그럼 시작한다! 먼저 500장 줘!"
1300802-25 = "[s] 광고지 뭉치를 건네준다."
1300802-27 = "다녀올게!!"
1300802-30 = "자, 다녀왔어! 다음!"
1300802-31 = "[s] 광고지 뭉치를 건네준다."
1300802-33 = "다녀올게!"
1300802-38 = "하아…… 하아…… 다음!"
1300802-39 = "[s] 광고지 뭉치를 건네준다."
1300802-41 = "후우…… 간다!"
1300802-46 = "하아…… 하아…… 하아……."
1300802-48 = "하아……."
1300802-49 = "[s3] \"속도 너무 빠르지 않아?\"\n[s4] \"힘들어 보이는데…….\""
1300802-50 = "괘, 괜찮아, 이 속도가 아니면 오늘 내로 다 못 끝낸단 말야."
1300802-51 = "괘, 괜찮아, 이 속도가 아니면 오늘 내로 다 못 끝낸단 말야."
1300802-53 = "하아…… 그럼, 다녀올게!"
1300802-57 = "[s5] ……………….\n[s6] ……역시 도와줘야 할 것 같다."
1300802-58 = "(광고지를 나눠주러 가기로 했다.)"
1300802-59 = "(광고지를 나눠주러 가기로 했다.)"
1300802-62 = "(비틀) ……다녀왔어……. 하아……."
1300802-63 = "[s] \"고생했어.\""
1300802-64 = "이제…… 얼마나 남았어?"
1300802-65 = "[s7] \"이제 없어. 끝이야.\"\n[s8] 빈 가방을 보여준다."
1300802-66 = "어라……"
1300802-67 = "어라……"
1300802-68 = "분명 몇번 더 해야 할 분량이 남아 있었던 거 같은데…… 기분탓인가……."
1300802-69 = "[s9] \"기분탓이야.\"\n[s10] \"피곤해서 착각했겠지.\""
1300802-70 = "뭐, 그런가 보지! 아하하, 간신히 다했다! 야호!"
1300802-71 = "뭐, 그런가 보지! 아하하, 간신히 다했다! 야호!"
1300802-72 = "[s] \"고생했어.\""
1300802-73 = "응! 선생님도 고생했어!"
1300802-74 = "하아…… 솔직히 한계였어……. 다리가 후들거려……."
1300802-75 = "뭐, 그럼 알바비를 받으러 가볼까?"
1300802-77 = "(알바비를 받아서, 모두 다 세리카에게 주려고 했지만)"
1300802-78 = "뭐야?"
1300802-79 = "선생님이 정당하게 번 돈이잖아. 일한 대가는 제대로 받아야지!"
1300802-80 = "(라고 거절 당했다.)"
1300802-82 = "하-아-암-"
1300802-83 = "일한 뒤의 저녁은 피곤해. 그치 않아?"
1300802-84 = "[s] \"알바비는 어디 쓸 거야?\""
1300802-85 = "응? 내가 쓸 거 아냐. 당연히 대책위원회 앞으로 가는 거지."
1300802-86 = "[s] \"……그렇구나.\""
1300802-87 = "뭐, 그런 거지. 한푼이라도 더 모아야 하잖아. 학원의 빚을 갚으려면."
1300802-88 = "……대책위원회에서는 이게 개인 알바비라는 걸 알면 안받으려고 하니까."
1300802-89 = "그래서 선생님보고 도와달라고 한 거고!"
1300802-90 = "……."
1300802-91 = "그러니까 앞으로도 가끔씩 도와줄 수 있어? 오늘은 꽤 도움이 됐으니까."
1300802-92 = "[s] 고개를 끄덕인다."
1300802-93 = "후후후. 땡큐."
1300802-94 = "그럼 다음에 봐-! 난 이제 집에가서 좀 씻어야겠어. 배도 고프고."
1300802-95 = "안녕, 선생님!"
1300802-97 = "(받은 알바비를 어떻게 할지 고민해봐야 할 것 같다.)"
1300802-99 = "(……….)"
1300802-100 = "(익명으로 대책위원회 쪽에 기부하는 게 좋을 것 같다.)"
