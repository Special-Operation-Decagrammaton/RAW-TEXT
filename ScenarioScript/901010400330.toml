[translation]
901010400330-7 = ""
901010400330-8 = "สวัสดีค่ะ ฉันมาจาก <FOX EATS> ค่ะ!"
901010400330-9 = "กำลังหาร้านเพื่อไปทานอาหารอยู่ใช่มั้ยคะ?"
901010400330-10 = ""
901010400330-12 = ""
901010400330-14 = ""
901010400330-15 = "ก็ใช่นะ... ทำไมเหรอ จะส่งอาหารให้เหรอ?"
901010400330-17 = "แน่นอนว่าบริการหลักของ <FOX EATS> คือการส่งอาหารค่ะ... แต่เพราะต้องไปรับออร์เดอร์ตาม#nร้านต่างๆ ก็เลยได้รู้จักร้านอร่อยในละแวกนี้ไปโดยปริยายน่ะค่ะ "
901010400330-18 = "ถ้าไม่รังเกียจละก็ ฉันขอแนะนำร้านเด็ดในท่าเรือคาเนะซากิให้ได้มั้ยคะ?"
901010400330-19 = ""
901010400330-22 = ""
901010400330-23 = "ได้สิ แบบนี้ยิ่งดีเลย!"
901010400330-24 = "ร้านเด็ดที่พนักงานส่งอาหารแนะนำให้เอง น่าสนใจเลยนะ"
901010400330-26 = "ถ้างั้น ลองลิ้มรสเมนูปูของร้าน <อากิตะ ซีฟู้ด> ดูมั้ยคะ?"
901010400330-27 = "ร้านนี้รับปูสดใหม่ทุกวัน ก็เลยมีเมนูจากปูให้เลือกทานหลากหลายเลยค่ะ"
901010400330-28 = ""
901010400330-31 = ""
901010400330-32 = "ร้านนี้มัน... ร้านที่ฉันเห็นตอนเดินผ่านเมื่อกี้นี่นา?"
901010400330-33 = "ขอโทษนะ แต่ฉันขอเลี่ยงร้านนี้ดีกว่า ฉันไม่ค่อยชอบกินปูน่ะ"
901010400330-35 = "อ๊ะ หรือว่าคุณแพ้ปูหรือสัตว์ทะเลเปลือกแข็งเหรอคะ?"
901010400330-36 = "เปล่าหรอก... แต่ปูมันทั้งเปลือก ทั้งกระดองแข็ง จะแกะกินก็ลำบากใช่มั้ยล่ะ?"
901010400330-37 = "แถมช่วงนี้ยังมีข่าวว่ามีคนถูกปูดุๆ ทำร้ายแถวชายหาดด้วย..."
901010400330-38 = "ถ้าเห็นก้ามปูแหลมๆ อยู่ตรงหน้า ฉันก็น่าจะรู้สึกขนลุกแล้วละ"
901010400330-40 = "นั่นน่ะสิ แล้วทำไมปูถึงมีโครงสร้างที่กินลำบากแบบนี้นะ?"
901010400330-42 = "ถ้ามองจากมุมมองของปูเองก็คงช่วยไม่ได้ละนะ ก็เนื้อปูมันอร่อยมากจริงๆ นี่นา"
901010400330-43 = "ถ้างั้น ลองเป็นเมนูที่แกะปูให้แล้ว และใส่เฉพาะเนื้อปูมาดีมั้ยคะ?"
901010400330-44 = ""
901010400330-47 = ""
901010400330-48 = "เมนูที่ใส่เฉพาะเนื้อปูงั้นเหรอ?"
901010400330-49 = "ใช่ค่ะ ที่ <อากิตะ ซีฟู้ด> ก็มีเมนูที่ใช้เนื้อปูแกะพร้อมทาน ทำให้ทานได้สะดวกด้วยค่ะ"
901010400330-50 = "ลองเป็นเท็นชินฮังที่ใช้เนื้อปูแกะกับไข่มั้ยคะ? โครเก็ตครีมเนื้อปูที่ใส่เนยแบบจัดเต็มก็อร่อยมากเลยค่ะ!"
901010400330-51 = "ถ้าเป็นเมนูแบบนี้ ก็คงไม่ต้องกลัวโดนเปลือกปูบาดมือระหว่างกินแล้วละ"
901010400330-52 = "วันนี้อยากกินอาหารที่มันๆ หน่อยอยู่พอดีด้วย..."
901010400330-53 = "เอาสิ งั้นเราไปกินมื้อกลางวันที่ร้านนั้นกัน"
901010400330-59 = ""
901010400330-61 = ""
901010400330-62 = "ยะ... ยินดีต้อนรับครับ กี่ท่านครับ?"
901010400330-64 = "2 คนค่ะ~"
901010400330-65 = ""
901010400330-71 = "ที่นี่มีโต๊ะสำหรับ 4 คนมั้ยคะ?"
901010400330-72 = "ขอข้าวผัดปูกลับบ้าน 3 ห่อค่ะ!"
901010400330-73 = ""
901010400330-75 = ""
901010400330-76 = "ครับ ครับ! รอสักครู่นะครับ!"
901010400330-77 = "นี่มันอะไรกันเนี่ย? เมื่อกี้ร้านยังเงียบจนมีแต่แมลงบินอยู่เลย แต่จู่ๆ ลูกค้าก็แห่เข้ามาเต็มร้าน..."
901010400330-78 = "ที่นี่คือร้าน <อากิตะ ซีฟู้ด> ร้านอาหารเมนูปูชื่อดังที่ <FOX EATS> แนะนำหรือเปล่าคะ?"
901010400330-79 = "เห็นว่าถ้าอยากกินเมนูปูอร่อยๆ ก็ให้มาร้านนี้น่ะ..."
901010400330-80 = "ใช่ครับ ที่นี่คือร้านอากิตะ ซีฟู้ด... แต่เมื่อกี้พูดถึง <FOX EATS> งั้นเหรอครับ?"
901010400330-81 = ""
901010400330-83 = ""
901010400330-84 = "หรือว่าจะเป็นนักเรียนคนนั้นที่มาหยิบใบปลิวไป...?"
901010400330-85 = ""
