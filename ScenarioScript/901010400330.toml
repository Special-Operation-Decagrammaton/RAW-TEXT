[translation]
901010400330-7 = ""
901010400330-8 = "您好，這裡是「FOX EATS」！"
901010400330-9 = "請問兩位正在尋找用餐的地方嗎？"
901010400330-10 = ""
901010400330-12 = ""
901010400330-14 = ""
901010400330-15 = "是沒錯啦……怎麼了，你是想幫我們外送餐點嗎？"
901010400330-17 = "雖然「FOX EATS」的主要業務確實是外送餐點……#n不過因為到處接單，自然而然也就熟悉了在地的美食名店。"
901010400330-18 = "如果不介意的話，要不要為兩位介紹鐘崎港的美食名店呢？"
901010400330-19 = ""
901010400330-22 = ""
901010400330-23 = "那我們當然是求之不得！"
901010400330-24 = "由外送員親自推薦的美食名店，真令人期待呢。"
901010400330-26 = "那麼要不要到這家「龝田水產」品嚐螃蟹料理呢？"
901010400330-27 = "由於每天都會有新鮮的螃蟹進貨，所以能夠品嚐到運用螃蟹做成的各種料理哦。"
901010400330-28 = ""
901010400330-31 = ""
901010400330-32 = "這裡……不就是剛才經過看到的那家餐廳嗎？"
901010400330-33 = "不好意思，我有點想避開這家店……因為我不太喜歡螃蟹。"
901010400330-35 = "啊，難道您對螃蟹或甲殼類過敏嗎？"
901010400330-36 = "沒有，不是因為過敏……#n螃蟹的殼很硬，吃起來很麻煩不是嗎？"
901010400330-37 = "而且最近還聽說有人在海邊被凶暴的螃蟹攻擊……"
901010400330-38 = "要是直接看到螃蟹那尖銳的蟹螯，總覺得會讓人有種背脊發涼的感覺。"
901010400330-40 = "就是說啊，螃蟹為什麼會有那種吃起來這麼麻煩的構造呢？"
901010400330-42 = "從螃蟹的立場來看，這也是沒辦法的吧。#n畢竟蟹肉確實非常好吃。"
901010400330-43 = "那麼如果是將殼去除，只用蟹肉做成的料理呢？"
901010400330-44 = ""
901010400330-47 = ""
901010400330-48 = "只用蟹肉做成的料理？"
901010400330-49 = "是的。「龝田水產」也有提供事先除去蟹殼，只用蟹肉製作的料理。"
901010400330-50 = "例如這道使用蟹肉和雞蛋一起煎製而成的天津飯，您覺得怎麼樣呢？#n除此之外，加入了滿滿奶油的蟹肉奶油可樂餅也是風味絕佳哦！"
901010400330-51 = "確實，這種料理應該就不用擔心吃到一半被蟹殼弄傷手了。"
901010400330-52 = "我今天也正好想吃油膩一點的料理呢……"
901010400330-53 = "好，午餐就在那家店解決吧？"
901010400330-59 = ""
901010400330-61 = ""
901010400330-62 = "歡，歡迎光臨。#n請問幾位呢？"
901010400330-64 = "我們兩個人～"
901010400330-65 = ""
901010400330-71 = "請問這裡有四個人的座位嗎？"
901010400330-72 = "不好意思，請幫我外帶蟹肉炒飯三人份！"
901010400330-73 = ""
901010400330-75 = ""
901010400330-76 = "好，好的！請稍等一下！"
901010400330-77 = "這是怎麼回事？剛才明明還門可羅雀，怎麼突然湧進這麼多客人……"
901010400330-78 = "請問這裡是「FOX EATS」推薦的那家螃蟹料理專門店「龝田水產」嗎？"
901010400330-79 = "大家都推薦說想吃美味的螃蟹料理就來這裡……"
901010400330-80 = "是的，這裡是龝田水產沒錯……您說「FOX EATS」？"
901010400330-81 = ""
901010400330-83 = ""
901010400330-84 = "……難道是剛才拿走傳單的那個學生？"
