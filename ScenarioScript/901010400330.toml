[translation]
901010400330-7 = ""
901010400330-8 = "Hello, this is FOX EATS!"
901010400330-9 = "You two seem hungry. Are you looking for somewhere hot, new, poppin', and scrumptious?"
901010400330-10 = ""
901010400330-12 = ""
901010400330-14 = ""
901010400330-15 = "Indeed, we are... But, pardon, aren't you some sort of delivery girl?"
901010400330-17 = "While FOX EATS specializes in food delivery, we also provide insider knowledge on the local hotspots. It's a natural consequence of the job! "
901010400330-18 = "Are you looking for some Kanesaki Port recommendations?"
901010400330-19 = ""
901010400330-22 = ""
901010400330-23 = "That would be great!"
901010400330-24 = "A recommendation from a food delivery person. She's seen it all!"
901010400330-26 = "How about a crab dish right here at Akita Seafood? You can't beat-a Akita!"
901010400330-27 = "They bring in fresh crab every single day and have curated their exciting menu around it!"
901010400330-28 = ""
901010400330-31 = ""
901010400330-32 = "Didn't we...already pass this place?"
901010400330-33 = "I'm sorry, but I don't think so. I'm not partial to crab."
901010400330-35 = "Oh, dear! Do you perhaps have a shellfish allergy?"
901010400330-36 = "No, it's not that... Crab is just so hard to eat, on account of the shell. It gets messy, not to mention dangerous."
901010400330-37 = "I've even heard of people being attacked by crabs on the beach..."
901010400330-38 = "I think even SEEING a sharp crab claw on my plate would freak me out."
901010400330-40 = "Yeah. Why do crabs have to be shaped like that? Sharp and slippery at the same time. It's so awkward."
901010400330-42 = "I suppose they didn't evolve for us to eat them. They likely have their own reasons."
901010400330-43 = "Then how about a dish made with crab meat, already shelled for your convenience?"
901010400330-44 = ""
901010400330-47 = ""
901010400330-48 = "The meat, all on its own? Requiring no cracking or holding?"
901010400330-49 = "That's right. Akita Seafood boasts a diverse menu featuring shelled crab. Taste the meat, and don't feel beat!"
901010400330-50 = "How about this crab omelet? Oh, and their buttery crab cream croquette is also incredible! A best-seller!"
901010400330-51 = "I don't see any risk of injury..."
901010400330-52 = "And I was in the mood for something greasy..."
901010400330-53 = "Then it's settled. Shall we dine here, then?"
901010400330-59 = ""
901010400330-61 = ""
901010400330-62 = "W-Welcome. How many?"
901010400330-64 = "Two!"
901010400330-65 = ""
901010400330-71 = "Actually, may we have one of the larger tables?"
901010400330-72 = "I need to fit three orders of crab fried rice!"
901010400330-73 = ""
901010400330-75 = ""
901010400330-76 = "Y-Yes! One moment, ladies!"
901010400330-77 = "What's going on? This place was dead a moment ago, and now the customers are lining up..."
901010400330-78 = "Is this Akita Seafood? FOX EATS put you on their \"Must Try Before You Die\" list!"
901010400330-79 = "I was told to come here for your crab."
901010400330-80 = "Yes, this is Akita Seafood... But did you say \"FOX EATS\"?"
901010400330-81 = ""
901010400330-83 = ""
901010400330-84 = "...Is this all because that girl took my menus?"
