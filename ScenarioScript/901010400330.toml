[translation]
901010400330-8 = "안녕하세요, <FOX EATS> 입니다!"
901010400330-9 = "혹시 식사를 하실 곳을 찾고 계신가요?"
901010400330-15 = "그렇긴 한데…… 왜, 음식 배달이라도 해주려는 거야?"
901010400330-17 = "물론 <FOX EATS>의 주업무는 음식 배달이긴 하지만…… 여기저기서 주문을 받다보니 지역 맛집에 대해서도 자연스럽게 알게 되었거든요."
901010400330-18 = "괜찮으시다면 카네사키 항구의 맛집을 소개해드릴까 하는데, 어떠신가요?"
901010400330-23 = "그럼 우리야 좋지!"
901010400330-24 = "음식 배달부가 직접 추천해주는 맛집이라니 기대되는 걸."
901010400330-26 = "그럼 이곳, <아키타 수산>에서 게 요리를 드셔보는 건 어떤가요?"
901010400330-27 = "매일 매일 신선한 게를 납품받고 있어서 게를 활용한 다양한 음식을 맛 볼 수 있거든요."
901010400330-32 = "여기는…… 아까 지나가면서 보았던 그 음식점이잖아?"
901010400330-33 = "미안하지만 이 가게는 조금 피하고 싶어. 게는 별로 좋아하지 않거든."
901010400330-35 = "아, 혹시 게나 갑각류에 알레르기가 있으신가요?"
901010400330-36 = "아니, 그건 아닌데…… 게는 껍질이 단단해서 먹기가 불편하잖아?"
901010400330-37 = "게다가 최근에는 바닷가에서 난폭한 게에게 공격당했다는 이야기도 있어서……"
901010400330-38 = "뾰족한 게의 집게발을 직접 보면 꺼림칙한 기분이 들 것 같아."
901010400330-40 = "그러게 말이야. 게는 왜 그렇게 먹기 불편한 구조를 가지고 있는 걸까?"
901010400330-42 = "게 입장에서는 어쩔 수 없겠지. 게살 만큼은 정말 맛있으니까."
901010400330-43 = "그럼 껍질을 발라내고 게살만 사용해서 만든 요리는 어떠신가요?"
901010400330-48 = "게살만 사용해서 만든 요리?"
901010400330-49 = "네. <아키타 수산>에서는 먹기 편하게 발라낸 게살로 만든 음식도 취급하고 있거든요."
901010400330-50 = "여기, 게살을 계란과 함께 부쳐낸 텐신항은 어떠신가요? 버터가 듬뿍 들어 간 게살 크림 크로켓도 일품이랍니다!"
901010400330-51 = "확실히 이런 요리라면 먹다가 껍질에 손을 다칠 염려는 없을 것 같네."
901010400330-52 = "안 그래도 오늘은 기름진 요리가 당기던 참이었는데……"
901010400330-53 = "좋아. 점심은 저 가게에서 해결할까?"
901010400330-62 = "어, 어서오세요. 몇 분이신가요?"
901010400330-64 = "두 사람이요~"
901010400330-71 = "여기 네 사람 자리 있나요?"
901010400330-72 = "여기, 게살 볶음밥 3인분 포장해주세요!"
901010400330-76 = "네, 네! 잠시만 기다려주세요!"
901010400330-77 = "이게 어떻게 된 일이지? 방금전까지는 파리만 날리고 있었는데, 갑자기 손님이 몰려들다니……"
901010400330-78 = "혹시 이곳이 <FOX EATS>에서 추천하는 그 게 요리 전문 식당, <아키타 수산>인가요?"
901010400330-79 = "맛있는 게 요리를 먹고 싶다면 이곳으로 가라고 다들 추천하던데……"
901010400330-80 = "네, 여기가 아키타 수산입니다만…… <FOX EATS> 라고요?"
901010400330-84 = "……설마, 아까 전단지를 가져간 그 학생이?"
