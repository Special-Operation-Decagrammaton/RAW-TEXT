[translation]
1103-1 = "편견 없는 맛"
1103-2 = "(밀레니엄의 베리타스 연구실에 방문한 미식연구회)"
1103-3 = "……그러니까, 수용체 OR6A4가 있는 사람은 민트를 비누나 샴푸 같은 맛으로 느끼는 거야."
1103-4 = "이게 단일염기다형성(SNP) 유전자라서……."
1103-5 = "……. 좋은 얘기군요. 그러니까 치료가 불가능하다?"
1103-6 = "……민트를 좋아하는 게 병은 아니잖아. 굳이 고칠 필요가 있어?"
1103-7 = "맞아! 너무하잖아. 사람을 환자 취급하고."
1103-8 = "그런 얘기가 아니라잖아! 이 정도라면 문제가 심한 거라고! 코나 혀에 문제가 있는 걸지도 몰라!"
1103-9 = "병리학적 문제가 되는 순간은 일상에 지장이 있을 때니까요."
1103-10 = "대체 어느 정도길래……."
1103-11 = "이 문제의 시작은 30년 전으로 거슬러 올라갑니다……."
1103-12 = "너무 거슬러 올라갔잖아! 어디까지 끌고 갈 셈이야!!"
1103-13 = "……그냥 어제만 해도 민트 쥬스라는 걸 만들어서 팔다가 선도부한테 걸려서 유치장에 갇히기도 했고……."
1103-14 = "민트 쥬스……? 그건 뭐지? 음……."
1103-15 = "확실히 이상한 음료이긴 한데 잡혀갈 정도로 문제가 있는 건 아닐 텐데……."
1103-16 = "맞아!! 이게 다 혐오론자의 음모야! 민트 혐오를 멈춰라아-!"
1103-17 = "민트 쥬스라고 해놓고 치약을 물에 타서 팔았거든요☆"
1103-18 = "아, 그럼 인정."
1103-19 = "?!!"
1103-20 = "이오리 녀석도 불량 식품 어쩌고 하면서 잡아갔으니까……."
1103-22 = "(이오리. 게헨나 선도부.)"
1103-24 = "(참고: 민트성애자.)"
1103-26 = "맛은 민트 쥬스랑 똑같은데…… 치아 건강에도 좋고…… 싸고……"
1103-27 = "그딴 걸 누가 먹어!! 니가 평소에 먹는 걸 돈주고 팔지 말란 말야!"
1103-28 = "하여튼 이즈미 씨는 수용체가 없기 때문에 민트를 맛있다고 느끼는 거니까,"
1103-29 = "그렇지 않았다면 샴푸나 비누 같은 맛으로 인지했겠지."
1103-30 = "그러니까, 선천적인 문제라서 어쩔 수 없는 거야."
1103-32 = "맞아. 아무리 나라도 샴푸나 비누를 먹진 않는다고-."
1103-33 = "그냥 이건 내가 맛있다고 생각하니까 먹는 거라구!"
1103-34 = "으음. 어쩔 수 없는 거려나……."
1103-35 = "그런 거지."
1103-36 = "뭐, 기왕 연구소까지 온 김에 각자에게 수용체가 있는지 확인이라도 해 볼래?"
1103-37 = "자기가 어떤 사람인지 알고 있으면 타인에 대한 관용도 생기는 법이니까."
1103-38 = "어머나- 재밌겠네요☆"
1103-39 = "헤에~ 그러니까 선천적으로 민트를 샴푸로 느끼느냐 아니냐를 알아 볼 수 있다는 거지?"
1103-40 = "이 또한 맛의 궁극을 추구하는 일환. 흥미가 생기네요."
1103-43 = "자, 입을 아아- 해 봐. 금방 돼."
1103-45 = "(잠시 뒤)"
1103-47 = "결과가 나왔어. 일단 아카리 씨는…… 수용체 없음."
1103-48 = "어라, 그런가요? 그럼 제가 민트를 싫어한다고 생각한 건 단순한 선입견……?"
1103-49 = "다음엔 편견없이 한번 먹어 보는 것도 좋겠지."
1103-52 = "그다음 하루나 씨는…… 수용체 있음."
1103-53 = "하루나 씨에겐 민트란 샴푸나 비누 같은 맛이었겠네."
1103-54 = "예상하고 있었습니다. 모든 맛을 평등하게 대하는 저에게도 민트는 고역이었으니까요."
1103-55 = "역시 DNA 레벨의 문제였던 거였군요. 물론 그렇다고 민트를 차별하거나 하진 않을 거지만."
1103-58 = "준코 씨는 수용체 없음."
1103-59 = "뭐, 나는 민트든 뭐든 다 잘 먹으니까."
1103-60 = "그다음 이즈미 씨는……."
1103-61 = "이즈미는 당연히 수용체 없는 거 아냐? 민트 엄청 좋아하니까."
1103-63 = "응! 민트 맛있어! 왜 이 맛있는 걸 싫어하는지 모르겠단 말야."
1103-65 = "이즈미 씨는…… 수용체 있음……이라고 나오는데?"
1103-67 = "……?!"
1103-68 = "뭐, 뭐?!"
1103-69 = "어머나, 그럼 이즈미 씨는 민트를 먹을 때 샴푸나 비누처럼 느낀다는……"
1103-70 = "……어라?"
1103-72 = "호에에에에에-? 이게 샴푸맛이었어?"
1103-73 = "먹으면서도 몰랐던 거냐!! 아, 아니, 알면서도 먹었단 얘기잖아!!!"
1103-74 = "……으, 으음. 세상에는 샴푸나 비누 맛을 좋아하는 사람도 있으니까……?"
1103-75 = "있으려나……? 있겠지……?"
1103-76 = "무, 무슨 소리야!! 그런 사람이 어딨어!!"
1103-77 = "비누나 샴푸 맛이 나는데 그걸 왜 먹어!! 바보냐!! 바보지, 너!!!"
1103-79 = "흐에에에- 이게 샴푸맛이었다니…… 진짜로?"
1103-81 = "(활짝-) 그럼 이제 샴푸를 먹어도 된다는 얘기지?"
1103-82 = "먹지 말라고!!!"
1103-83 = "편견 없는 맛"
