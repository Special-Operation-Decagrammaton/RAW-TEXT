[translation]
10008120-1 = "제12화;최후의 결전이다! 카이텐져!"
10008120-2 = "카, 카이텐져라니……? 여기서 또?!"
10008120-3 = "설마 새전함의 내용물은 이미 너희가 다 빼돌렸던 거야?!"
10008120-5 = "핫핫핫! 그렇다!"
10008120-6 = "이미 그건 전부 우리가 접수한 상태!"
10008120-7 = "[s] \"그걸로 뭘 하려고?\""
10008120-8 = "정의의 히어로를 자처한다면 역시……. 의적 활동, 이라던가……?"
10008120-9 = "하하! 어리석은 질문이로군!"
10008120-10 = "으, 응?"
10008120-11 = "우리가 새전함 내용물을 빼돌려서 할 일은 단 하나!"
10008120-12 = "우리를 가로막았던 악당들의 공격으로 인해 무참히 망가져 버린 KAITEN FX MK.0……"
10008120-13 = "그 후계기를 다시 만들기 위해서였다!"
10008120-15 = "그 이름도 다름 아닌 KAITEN FX MK.1을……!!"
10008120-21 = "악당들의 공격……?"
10008120-22 = "후계기……?"
10008120-23 = "[s1] \"아, 확실히 그런 비슷한 걸 부순 적이 있었지.\"\n[s2] \"그런 일이……. 있었던, 가?\""
10008120-26 = "하하하! 너희들이 뭐라 하건 이미 새전함의 내용물을 이용해 새로운 머신의 제작은 끝난 상황이다!"
10008120-27 = "이 모든 건 무한히 회전하는 정의……."
10008120-28 = "로망을 위해!"
10008120-29 = "결국 그냥 사리사욕을 위해 썼다는 말이잖아!!"
10008120-30 = "사리사욕이 아니다! 로망이다!"
10008120-31 = "[s] \"그걸 두고 보통은 사리사욕이라고 부르는 게 아닐지…….\""
10008120-36 = "결국 새전함의 내용물을 다 써버렸다는 거잖아……?"
10008120-37 = "아루 쨩?"
10008120-38 = "우리의……. 흥신소 멤버들의 소원이……."
10008120-39 = "각자가 취미를 참아가거나, 공사장에서 육체노동을 하며 벌었던 소중한 돈을……!"
10008120-41 = "고작 저런 놈들이 훔쳐 갔단 말이야?!"
10008120-42 = "용서 못 해."
10008120-43 = "절대로 용서하지 않겠어……!"
10008120-45 = "하하!"
10008120-46 = "그 도전! 받아주마!"
