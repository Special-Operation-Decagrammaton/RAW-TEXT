[translation]
102170-1 = "제17화;제5 성소 공략 - 요새도시 에리두 근교"
102170-2 = "자, 준비됐어?"
102170-3 = "네~"
102170-4 = "잠깐 스톱!!"
102170-5 = "뭐야, 코유키?"
102170-6 = "네~ 가 아니잖아요!"
102170-7 = "뭔가요? 왜 제가 여기 있는 거죠? 왜 당연하다는 듯 준비됐냐고 묻는 거죠?"
102170-8 = "왜라니요, 코유키 쨩. <수호자>를 공략하러 가야 하잖아요."
102170-9 = "아니, 그러니까! 리오 회장의 보안 시스템을 제가 해제해 드렸잖아요!"
102170-10 = "네, 그렇죠. 수고하셨어요, 코유키 쨩."
102170-11 = "정말 볼 때마다 신기에 가까운 재능이라니까……."
102170-12 = "아니, 그러면 제 역할은 그걸로 끝이잖아요! 이제 얌전히 반성실로 돌아가면 안 될까요? 가서 벽보면서 반성하고 있을 테니까……."
102170-13 = "안 돼. 5성소의 공략을 위해서는 호드를 지상으로 유인할 필요가 있다고."
102170-14 = "그러니까!! 그걸 왜 저희가 해야 하는 거예요!! 다른 사람들 많지 않아요?"
102170-15 = "왜냐하면 이 요새도시의 곳곳에는 리오 회장이 만든 방벽이 있거든요. 호드를 유인하면서 앞을 가로막는 방벽을 해체해야 하는데……."
102170-16 = "그건 코유키 쨩만이 할 수 있는 일이거든요."
102170-17 = "그만 투덜거리고, 가자. 이걸 할 수 있는 건 우리뿐이니까."
102170-18 = "출발~"
102170-19 = "으아아아-!"
102170-29 = "여기, 여기에 말뚝을 박아!"
102170-30 = "오케이!!"
102170-35 = "발파 완료! 크하하하하!! 이 고속 도로도 전부 붕괴야!!"
102170-36 = "오오, 좋은 느낌인데? 여기도 점점 더 개발에 어울리는 모습이 되어가고 있잖아."
102170-37 = "카스미 부장. 여기는 대충 완료된 거 같아! 다음 지역으로 이동할게!"
102170-38 = "좋아! 멀쩡히 서 있는 모든 건물들은 전부 철거해버려!"
102170-39 = "오케이~! 맡겨줘."
102170-41 = "개발, 개발이다!!"
102170-47 = "와하하하핫! 그래! 밀레니엄 지하의 온천을 발견할 때까지 이 동네를 마음껏 폭파하고 철거하고 후벼파는 거야!"
102170-50 = "도시가…… 건물이……."
102170-52 = "혹시나 해서 묻는데…… 침식 타워를 철거하는 척하면서 밀레니엄 자치구를 파괴하러 온 건 아니지……?"
102170-55 = "응? 밀레니엄을 파괴하러 왔다니, 무슨 소리야? 이 모든 건 그저 온천을 위해서 일뿐! 거기에 겸사겸사 <성소>도 철거하고 말야! 일석이조! 개발은 효율적으로! 란 거지!"
102170-58 = "……."
102170-63 = "온천…… 우리 자치구 지하에 온천 같은 건 없습니다만……. 조금만 지층을 분석해 봐도 알 수 있는데……."
102170-65 = "분석해 보니 없다? 지층만 봐도 알 수 있어? 이 헛똑똑이들아! 그런 나약한 마음으로 온천을 개발할 수 있겠냐!"
102170-66 = "믿어! 온천은 존재한다는 걸! 믿으면 거기에 온천은 분명히 답해줄 테니까! 와하하핫!!!"
102170-69 = "……."
102170-71 = "……."
