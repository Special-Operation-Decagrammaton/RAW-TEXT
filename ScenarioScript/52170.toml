[translation]
52170-1 = "제17화;돌아온 부장"
52170-4 = "……<공연장 무대 설치 용역 계약 추가 신청서>."
52170-5 = "……<축제 내 안전 관리 담당자 임명서>……"
52170-6 = "<음양부 보조금 투명 감사 결과 보고서>……"
52170-10 = "우으, 우으으……"
52170-11 = "어째서 와라쿠 축제가 하루 앞으로 다가온 이 즐거운 날에도 결재 업무를 처리하지 않으면 안 되는 건지."
52170-12 = "원래 계획대로라면 귀찮은 서류 업무는 카호에게 맡겨두고 시찰을 핑계로 거리를 구경하려 했는데—"
52170-15 = "니야 님, 저는 지금부터 치세 쨩을 데리고 공연 리허설을 다녀올 예정이니 그동안 밀린 서류 결재의 처리를 부탁드립니다."
52170-16 = "다녀올게~"
52170-17 = "어, 어째서?! 나도 함께 가면 안 되는 거야?!"
52170-18 = "물론 니야 님께서 리허설에 함께하시더라도 큰 문제는 없습니다."
52170-19 = "반송 기한이 이미 한참 지난 와라쿠 축제의 공문과 서류 결재를 모두 마무리하신 뒤에 말이지요."
52170-20 = "으, 으윽……"
52170-21 = "니야 님께서 업무를 뒤로 한 채 도망치시는 건 일상다반사인지라, 이제와서는 놀랍지도 않습니다만."
52170-22 = "혹 니야 님의 게으름 때문에 와라쿠 축제의 진행에 문제가 생긴다면……"
52170-23 = "절대로, 가만두지 않을 테니까요?"
52170-24 = "카호, 얼굴이 무서워~"
52170-25 = "아, 알겠습니다……."
52170-28 = "카호도 참, 게으름을 부리기 전에 먼저 선수를 치다니. 눈치가 빨라졌다니까."
52170-29 = "하지만 나도 치세 냥의 공연 리허설을 보고 싶었는데~ 이렇게 부실에 틀어박혀서 딱딱한 서류나 처리해야 하는 처지라니~"
52170-30 = "뭔가, 서류 처리를 뒤로 미룰 수 있는 급한 핑계 같은 게 없으려나."
52170-31 = "중요한 손님의 방문이라던가—"
52170-37 = "니야 님. 바쁘신 중에 죄송합니다만……"
52170-38 = "급히 중요한 손님이 찾아오셔서 잠깐 확인해 주셔야 할 것 같습니다."
52170-39 = "왔다, 내 핑곗거리……!"
52170-40 = "핑곗거리요?"
52170-41 = "아, 아무것도 아니랍니다!"
52170-42 = "그나저나 이 시기에 갑작스럽게 방문하신 중요한 손님이라니, 누구신가요?"
52170-43 = "<와라쿠 축제>의 참관을 희망하는 다른 학원의 임원 여러분이라도……?"
52170-44 = "아뇨. 그쪽이 아니라……"
52170-45 = "백화요란 분쟁조정위원회의 부장, 나나카도 아야메님이 찾아오셨습니다."
52170-46 = "아야메 부장이……?"
52170-51 = "오랜만에 얼굴을 뵙습니다, 니야 님."
52170-52 = "그동안 무탈하셨는지요?"
52170-53 = "냐하하…… 마음 같아서는 괜찮다고 말씀드리고 싶지만. 지난 기간 동안, 아무 일도 없었다고는 말씀드리는 건 다소의 어폐가 있겠네요."
52170-54 = "백귀야행에도 '너무 많은 일'이 있었어서."
52170-55 = "……그렇겠지요. 부장의 책무를 방기하고 너무 오래 자리를 비워 죄송한 마음뿐입니다."
52170-56 = "그렇게 말씀해 주시니 말뿐이라도 기쁘군요. 후후."
52170-60 = "백화요란의 다른 부원들이 '아야메 부장'을 찾기 위해 에비스 분교에 갔다는 사실은 알고 계시나요?"
52170-61 = "네. 사실 에비스 분교에서 나구사와 다른 부원들을 만나고 온 참입니다."
52170-62 = "그럼 그들은 어디에 두고 당신 혼자 본관에 돌아온 건가요?"
52170-63 = "또, 그들과 함께 있었던 샬레의 선생님은 지금 어디에 계시죠?"
52170-64 = "사실 급히 니야 님의 접견을 희망한 이유도 그 때문이었습니다."
52170-65 = "저희는 대설원에서 화조풍월부의 본거지를 찾던 중 갑작스러운 눈사태로 인해 조난을 당하고 말았습니다."
52170-66 = "운 좋게 저는 눈사태를 피할 수 있었지만, 나머지는 설원에 고립되어 매우 위험한 상황입니다. 어서 구조대를 급파해야 합니다."
52170-67 = "……상황이 그렇다면, 지체할 틈이 없겠군요."
52170-68 = "밖에 누구 계신가요?"
52170-72 = "무슨 일이신가요, 니야 님?"
52170-73 = "지금 바로 발이 빠른 학생을 수배해 북방 자치구로 파견해 주세요. 백화요란의 부원들과 [USERNAME] 선생님께서 조난을 당하신 모양입니다."
52170-74 = "아, 알겠습니다! 급히 구조대를 파견하겠습니다!"
52170-81 = "……빠르게 조치해주셔서 감사합니다. '역시' 니야 님이시군요."
52170-82 = "아니요. 음양부의 부장으로서 당연히 해야 할 일이었는걸요."
52170-83 = "그럼 저는 부탁도 전달 드렸으니, 이만 백화요란의 부실에—"
52170-91 = "—실례."
52170-92 = "먼 길을 오시느라 피곤하시겠지만, 질문 하나만 더 드리고 싶네요."
52170-95 = "네, 부디 편하신 대로."
52170-98 = "이번에 조난을 당한 사람 중에는 아야메 부장도 포함되어 있나요?"
52170-99 = "……네? 그게 무슨 말씀이신가요?"
52170-100 = "아, 혹시 나구사나 키쿄의 이름을 착각하신 거라면—"
52170-101 = "아뇨. 제가 말하는 사람은 백화요란의 부장, 나나카도 아야메 부장이 맞습니다."
52170-102 = "당신은 그저, 아야메를 흉내내는 '그림자'일 뿐이잖아요?"
52170-103 = "그게 무슨……"
52170-104 = "처음 보았을 때부터 조화롭지 못한 사기를 흘리고 있기에 진짜가 아닌 것은 이미 알고 있었지만."
52170-105 = "'위기에 빠진 부원을 버리고 달아나는 아야메'라니, 불가능한 연기를 주문하는 것에도 정도가 있어야지요."
52170-110 = "그래서, 진짜 아야메는 어디에 있나요. 낯선 백물어여."
52170-111 = "……역시 니야 부장이야. 이렇게 빨리 들킬 줄은 예상치 못했네."
52170-116 = "………!"
52170-117 = "그런데 이거 어쩌지?"
52170-123 = "나는 당신이 생각하는 것만큼 부원을 아끼는 부장이 아니거든."
52170-125 = "다음화;동상이몽"
