[translation]
1003303-1 = "함께 하는 나 홀로 데이트"
1003303-2 = "(모처럼 업무를 쉬는 휴일이 찾아왔다.)"
1003303-3 = "[s1] \"간만의 휴일이니까…….\"\n[s2] \"오늘은 평소에 바빠서 못 해봤던 걸 해볼까…….\""
1003303-11 = "(제일 먼저 찾은 곳은 샬레에서 가까운 쇼핑몰이었다.)"
1003303-12 = "[s] \"오늘 마침 특별 할인 판매가 있다고 했으니까…….\""
1003303-13 = "네! 바쁜 와중에 귀한 걸음 해주신 손님 여러분! 감사합니다!"
1003303-14 = "오늘은 당 점의 오픈 15주년을 기념하여 트리플 S급 최고급 소고기의 특별 할인 행사가 예정!"
1003303-15 = "판매 수량은 단 100팩! 선착순으로 단 100분에게만 특가에 모실 예정이오니, 부디 기회를 놓치지 말아 주세요!"
1003303-16 = "그럼 판매 시작하겠습니다!"
1003303-21 = "(몰려드는 사람들을 따라 늦지 않게 줄을 서는 데 성공했다.)"
1003303-22 = "네! 다음 분! 또 다음 분! 당 점을 찾아주셔서 감사합니다! 다음 분!"
1003303-26 = "(그렇게 기다리고 기다린 끝에, 마침내 차례가 돌아왔다.)"
1003303-27 = "자, 남은 소고기는 마지막 1팩! 그럼 다음 분 앞으로 나와주세요!"
1003303-33 = "크크크!"
1003303-34 = "그건 내가 받아 가도록 하지!"
1003303-35 = "아앗! 소, 손님!"
1003303-36 = "[s] \"앗, 자, 잠깐……! 새치기라니!\""
1003303-37 = "새치기?"
1003303-38 = "아니. 그쪽이 굼뜨게 움직이니까. 답답해서 내가 먼저 나선 것뿐이라고!"
1003303-39 = "게다가 새치기면 또 뭐? 먼저 받아 간 놈이 이기는 거 아닌가?"
1003303-40 = "불만이면 그쪽도 새치기를 하시던가!"
1003303-41 = "[s] \"아니, 그렇게 막무가내 같은 이야기를 해도…….\""
1003303-43 = "됐다고! 이미 물건은 내가 받았으니까!"
1003303-44 = "너무 실망하지 말라고! 내 당신 몫까지 진심과 전력을 다해, 이 소고기를 맛있게 먹어줄 터이니! 크크큭!"
1003303-45 = "그럼 어디……."
1003303-51 = "앗?!"
1003303-55 = "소, 손님?"
1003303-59 = "[ns] \"으, 으응?!\""
1003303-60 = "저기, 소, 손님?! 괜찮으신가요?!"
1003303-61 = "이건……. 의식을 잃었어?"
1003303-62 = "여기! 의무반! 의무반을 불러주세요! 부상자가 발생했습니다!"
1003303-66 = "휴우……. 잠시 트러블이 있었지만. 한정판 최고급 소고기는 한 팩 남게 되었군요."
1003303-67 = "고객님. 어찌하시겠습니까?"
1003303-68 = "[s] \"그럼 감사히……. 그런데 아까 그분은 정말 괜찮은 건가요?\""
1003303-76 = "(얼떨결에 최고급 소고기 구매에 성공한 뒤, 이번엔 점심을 먹기 위해 SNS에서 유명한 패밀리 레스토랑을 찾았다.)"
1003303-80 = "[ns] \"SNS에서 가장 핫하다는 메뉴가 분명……\""
1003303-81 = "여기 음식! 듣던 대로 맛있구만!"
1003303-82 = "한 그릇 더! 한 그릇 더 주문이다!"
1003303-83 = "음~ 드링크 바에서 모든 음료를 다 섞어 버려야지~"
1003303-87 = "너무 시끄러운 거 아냐?"
1003303-88 = "쉿! 조용히 해. 불량배들 귀에 들릴라."
1003303-89 = "SNS에서 유명하다고 해서 찾아왔는데. 이래선 밥도 못 먹겠잖아……."
1003303-90 = "캬하하핫!"
1003303-91 = "키키키키!!"
1003303-92 = "우햐햐햣~"
1003303-97 = "저, 저기 손님…… 다른 손님분들이 불편해하시니, 조금은 조용히 해주셨으면……."
1003303-100 = "앙? 우리가 시끄럽다고?"
1003303-101 = "그런 말 했다가 후회하게 만들어주는 수가 있다고?"
1003303-102 = "어디, 진짜 시끄러운 게 뭔지 보여줄까?"
1003303-104 = "히익. 그, 그게 그러니까……."
1003303-105 = "[s] \"잠깐, 너희들 그 이상 민폐를 끼치는 건…….\""
1003303-108 = "앙?!"
1003303-109 = "네놈은……"
1003303-110 = "그 샬레의 선생이잖아!"
1003303-111 = "뭐냐! 저번엔 우리가 당한 일을 잊을까 봐?!"
1003303-112 = "에잇! 그때의 복수를 지금……."
1003303-125 = "소, 소, 손님? 저기, 괜찮으신가요. 손님?!"
1003303-129 = "저, 저격?"
1003303-130 = "바, 방금 어디에서 날아온 거야?"
1003303-131 = "[s] \"……또?\""
1003303-140 = "(휴일의 일과를 대강 마치고, 마지막으로 적당히 생필품을 사기 위해 편의점에 들렀을 때였다.)"
1003303-141 = "[s3] \"아무리 일진이 좋지 않다고 해도…….\"\n[s4] \"여기까지 왔으면 이제 별일 없겠지……?\""
1003303-146 = "[ns] \"네! 그럴 리가 없겠지요!\""
1003303-147 = "뭐, 무, 뭡니까?!"
1003303-148 = "크하하! 이 편의점은 우리가 접수한다!"
1003303-149 = "잠자코 계산대에 있는 현금을 전부 내놔!"
1003303-156 = "[ns] \"자, 잠깐!\""
1003303-164 = "크, 크아아악?!"
1003303-165 = "다, 당했다아!!"
1003303-170 = "[ns] \"????\""
1003303-173 = "(간만의 휴일이었는데도 불구하고 그렇게 수많은 사건과 만나며 피곤함만을 남긴 채, 휴일은 저물었다.)"
1003303-175 = "(그리고 찾아온 다음 날)"
1003303-176 = "[s] \"어제의 그건 대체 뭐였던 걸까.\""
1003303-180 = "[ns] \"응? 누구세요?\""
1003303-184 = "우후후후훗. 선생님. 저 와카모, 어제에 이어 부끄럽게도 다시 찾아뵙게 되었습니다."
1003303-185 = "어제 함께 했던 시간이 너무나도 기쁘고 행복한 시간이었던지라."
1003303-186 = "아아, 그 추억을 곱씹고 있으려니, 감히 오늘은 선생님께서 휴일이 아니란 걸 알고 있음에도 당신을 만나고자 하는 열화와 같은 마음을 미처 참지 못하여……."
1003303-187 = "이렇게 다시 찾아뵈었답니다♡"
1003303-188 = "[s] \"어, 으응. 근데 잠깐, 어제 함께……라니?\""
1003303-189 = "네에?"
1003303-190 = "혹시……. 기억, 하지 못하시는 건가요?"
1003303-191 = "저어, 와카모는, 여전히 어제의 기억만으로도 이렇게 가슴이 흥분으로 달아올라 수런거리고 있는데……?"
1003303-192 = "[s] \"아니, 진짜진짜 모르겠거든?! 설명해 줄 수 있을까?!\""
1003303-193 = "네에, 그런, 가요."
1003303-194 = "후훗. 선생님께서 원하신다면 설명을 하는 것쯤이야 얼마든지……."
1003303-195 = "아아~ 어제는 무척이나 곤란했지요. 모처럼 찾아온 선생님의 휴일을 맞이해, 데이트를 시작한 것은 좋았지만……."
1003303-196 = "[s] \"으, 응? 데, 데이트를?\""
1003303-197 = "하필 저희 두 사람의 데이트를 질투한, 눈치 없는 무리들 때문에……."
1003303-198 = "후훗, 그래도 함께 트리플 S급 최고급 소고기를 얻게 된 건 요행이었네요."
1003303-199 = "그건, 오늘 어떻게 요리해 먹을까요?"
1003303-200 = "선생님과 함께 서로 좋아하는 요리에 대해……. 좋아하는 맛과 취향에 대해 이야기를 나누는 상상만으로도……."
1003303-201 = "저 와카모, 당신에 대해 좀 더 깊게 알게 된 거 같아 기쁨에 사무쳤답니다."
1003303-202 = "[s] \"??\""
1003303-203 = "다만……"
1003303-204 = "하아. 이게 어인 일인지. 그 뒤에 함께 점심을 먹기 위해 찾은 레스토랑에선 또한 눈살이 찌푸려졌지요."
1003303-205 = "남의 시선 따윈 신경 쓰지 않고 앵앵거리며 소란을 떠는 벌레들 같으니라고……."
1003303-206 = "마음 같아선 그 자리에서 전부 박살 내고 갈아 마시고 싶었지만."
1003303-207 = "아니요. 안되지요. 당신과 함께한 시간을 더럽힐 수는 없습니다. 네에, 그건 곤란한걸요."
1003303-208 = "그래서 가볍게 넘어가 주었더니, 마지막으로 들린 편의점에선 주제도 모르고 날뛰는 강도들까지……."
1003303-209 = "휴일마저 다사다망한 것이, 이 또한 당신과 함께하기에 어쩔 수 없는 필연인 걸까요……. 후훗."
1003303-210 = "정말, 당신이란 어쩔 수 없으신 분이시로군요♡"
1003303-214 = "[ns] \"그 말은 즉, 와카모가 나를 미행하고 있었다는……?\""
1003303-215 = "미행……?"
1003303-216 = "저 와카모, 단지 당신의 그림자를 밟지 않도록 한 걸음 물러나 뒤따르고 있었을 뿐인걸요?"
1003303-217 = "네, 이건 이미 데이트나 다름없는 바."
1003303-218 = "아, 그래도 다음엔 걱정하실 거 없답니다."
1003303-219 = "앞으로는 이런 불상사가 다시는 일어나지 않도록."
1003303-220 = "다음부터는 처음부터 방해물 따윈 전부 말끔히 치워버리고……!"
1003303-221 = "단둘만의 데이트를 하면……!"
1003303-222 = "[s] \"스-토옵! 자, 잠깐! 기다려 봐. 와카모!\""
1003303-223 = "네……?"
1003303-224 = "[s] \"그게……! 그래! 다음번엔 그런 식으로 뒤에서 따라오지만 말고!\""
1003303-231 = "어머나."
1003303-232 = "[s5] \"다음엔 이렇게 직접 손을 잡고 데이트하자!\"\n[s6] (보이지 않는 곳에서 사고를 치면 곤란하니까!)"
1003303-237 = "아으, 앗. 그, 그게. 서, 선생님께서 직접. 이렇게나 저, 적극적으로……!"
1003303-238 = "네, 네에엣~! 그, 그, 그럼."
1003303-239 = "저 와, 와, 와와와, 와카모! 그, 그때만을 고대하고 있겠습……니다앗!"
1003303-240 = "그, 그럼 다음에 또…!"
1003303-245 = "(그렇게 잔뜩 당황하면서 우왕좌왕 도망치는 와카모를 얌전히 배웅했다.)"
