[translation]
84301200500-5 = "\"집 나간 로봇 펫을 찾고 있습니다. 보신 분은 연락 부탁드립니다.\"……라고 돼 있네."
84301200500-6 = "그렇게 무슨 강아지 찾듯이……."
84301200500-7 = "그러고 보니 밀레니엄에서 개최했던 <황륜대제> 때도, 작은 로봇 강아지 같은 애들이 있었는데."
84301200500-8 = "로봇 강아지에게는 자아가 있는가. 존재의 개념을 정의하는 기준은 무엇인가."
84301200500-9 = "갑자기 어려운 질문이네……. 나츠 쨩이 진지한 고찰을 시작했어."
84301200500-10 = "아니, 절대 그런 느낌은 아닐 걸……."
84301200500-12 = "그것은 나와 타인의 관계에 관한 것일까. 스스로 생각할 수 있는 능력에 관한 것일까."
84301200500-13 = "관계에 관한 것이라면, 누구와도 상호작용을 하지 않는 인간은 존재하지 않는 것과 같은 것일까. 그렇다면 존재의 가치는 연결고리?"
84301200500-14 = "스스로 생각할 수 있는 것이라면 '생각'을 정의하는 것은 무엇일까. 누구도 계산과 자아의 사고를 엄밀히 구분 지을 수 없다."
84301200500-15 = "아니, 어떻게 보면 우리 모두 그저 눈에 보이는 걸 멋대로 구성해 이해하는 통 속의 뇌일 지도 모르지……."
84301200500-16 = "아~. 또 시작이네. 이거."
84301200500-22 = "(……지금 일과는 관계가 없어 보이네요.)"
84301200500-23 = "(그래도 일단 말을 걸어 볼까요.)"
84301200500-32 = "안녕하세요, 학우분들. 실례지만 잠시 괜찮으실까요?"
84301200500-34 = "아주 그냥 입만 열면 헛소리야, 입만 열면."
84301200500-35 = "이 녀석은 한동안 아주 말을 못 하게 막아 버려야……."
84301200500-40 = "……? 음?"
84301200500-41 = "으에에!? 어, 어느새……!? 누, 누구세요!?"
84301200500-45 = "죄송해요. 놀라게 하려던 건 아니었어요. 그저 방금 여러분들이 나누시던 대화가 어떤 이야기인지를 듣고 싶어서요."
84301200500-46 = "아무래도 트리니티의 인솔자 겸으로 온 것이니……. 찾으러 가실 거라면 행선지 정도는 알아 두는 것도 좋을 거 같네요."
84301200500-47 = "트리니티의 인솔자……? 그러니까 누구신데 우릴 인솔하겠다는 거예요?"
84301200500-49 = "카, 카즈사 쨩…… 티파티의 세이아 님이시니까……."
84301200500-50 = "……? 세이아? 그게 뭔데."
84301200500-52 = "\"그게 뭔데\"라니……."
84301200500-53 = "애초에 이름은 모르더라도 '티파티'라고 하면 대충 견적이 나와야 하는 거 아니냐."
84301200500-54 = "티파티? ……아~, 그 티파티."
84301200500-58 = "……에."
84301200500-59 = "……헐."
84301200500-61 = "죄, 죄송……! 죄송합니다……!!"
84301200500-63 = "당면한 과제는 지금 SNS에서 핫해지고 있는, <순례자>와 관련된 이슈."
84301200500-64 = "기존의 자신을 탈피한 그는 자신을 찾아 떠났는가. 이것은 한창때의 사춘기 소녀와도 같은 질풍노도인가."
84301200500-65 = "남들과 다른 자신…… 아니, 애초에 '자신'이란 무엇인가. 사실 그것은 아무것도 아닌 것…… 혹은 모든 것…….이라는 이야기지."
84301200500-66 = "그렇게 말하면 어떻게 아냐고……!"
84301200500-67 = "과연……. 그렇군요, 이해했습니다. 꽤 다급한 이야기였네요."
84301200500-68 = "이해했다고!? 거짓말!"
84301200500-69 = "그러면 그 <집 나가 사라졌다는 로봇 펫>은 지금 어디 있나요?"
84301200500-71 = "진짜 이해하셨어……."
84301200500-72 = "음. 그러니까, SNS에서 올라온 포스트의 위치 정보를 보자면……. 저기 강가 어딘가에 있을 것 같네."
84301200500-73 = "지금 가 볼까? 주인 찾아 주면 기분도 좋을 거 같고."
84301200500-74 = "뭐, 좋은 일이긴 한데……."
84301200500-75 = "괜찮을까? 우리 조는 일단 이 근처를 벗어나지 말라고 했잖아."
84301200500-76 = "그건……."
84301200500-77 = "가 보자! 정말로 찾아줄 수 있을지도 모르잖아."
84301200500-79 = "응. 그게 좋겠네."
84301200500-80 = "너 진짜 싫다."
84301200500-88 = "…………."
84301200500-89 = "……??"
84301200500-91 = "나, 나츠 쨩. 그렇게 빤히 쳐다보면 부담스러워하실 텐데……."
84301200500-98 = "…….네. 가시죠."
84301200500-100 = "방금 뭔가 대화했어!?"
84301200500-101 = "순례의 길을 뒤쫓는 자들에겐 가타부타 말이 필요 없는 법."
84301200500-102 = "우린 필요하거든!? 보통은 필요하거든?!"
84301200500-104 = "아하하……."
84301200500-105 = "으음……. 괜찮겠지? 갔다가 없는 거 같으면 바로 돌아올 테니까."
84301200500-106 = "에이, 걱정하지 마. 아이리."
84301200500-107 = "설마 뭐 별일이야 있겠어."
