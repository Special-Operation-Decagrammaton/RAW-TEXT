[translation]
11434010-1 = "노말 엔딩;\"……돌아보면.\""
11434010-2 = "……같은 일도 있었지."
11434010-3 = "그래서, 어때? 발표는 떴어? 슬슬 뜰 때가 됐는데……."
11434010-4 = "으음. 잠시만. 이제 바로 확인할 게. 이게 로딩이……."
11434010-5 = "……어……."
11434010-6 = "아니, 진짜! 이런 상황에서 '어' 같은 말 막 하는 거 아니야. '어' 금지 몰라? '어' 금지!?"
11434010-7 = "아하하하……."
11434010-11 = "……어?"
11434010-13 = "……!!"
11434010-14 = "모두 이거 봐봐! 이름이야, 우리 이름!!"
11434010-15 = "뭐!? 진짜!? 그럼 붙은 거야? 이거 붙었다는 뜻이지!?"
11434010-16 = "진짜 이게 되네. 솔직히 반신반의했는데……."
11434010-17 = "이 흐름에서 안 되면, 그건 스토리가 망가진 거니까 말이지."
11434010-18 = "또 이상한 소리를……."
11434010-20 = "아무튼 그 말이 사실이라면, 이러고 있을 때가 아니군. 모두 자리에서 일어나도록."
11434010-21 = "……? 나츠? 갑자기 어딜 가려고……?"
11434010-22 = "어디냐니, 그야 뻔한 거 아닌가."
11434010-27 = "……맞네. 이제 당당히 다시 쳐들어갈 수 있겠어."
11434010-28 = "과연. 이해했다."
11434010-30 = "으, 으응……? 쳐들어가다니? 어딜? ……얘들아?"
11434010-36 = "……셈라를 가지러!!"
