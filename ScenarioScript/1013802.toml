[translation]
1013802-1 = "快脫掉！"
1013802-2 = "（買好玲奈需要的飾品材料後，拜訪了狂獵藝術學院）"
1013802-3 = "（然而……）"
1013802-5 = "啊啊啊……！你，你在做什麼！？"
1013802-6 = "竟然在義大利麵上淋番茄醬……！！"
1013802-7 = "嗯？很好吃哦。你也要試試嗎？"
1013802-8 = "閉嘴！那是對狂獵料理的侮辱！！"
1013802-9 = "……等等，旁邊那碗飯是什麼？"
1013802-10 = "啊，這個？拌義大利麵醬很好吃哦～"
1013802-11 = "唔，啊啊啊啊……！決鬥吧！你這個惡魔……！！"
1013802-12 = "啊哈哈哈！既然你找上門來，我也不會退縮……！！"
1013802-13 = ""
1013802-14 = "[ns] 「那個……你們在做什麼？」"
1013802-15 = ""
1013802-20 = "（路過時，被捲入了學生們的爭吵……）"
1013802-21 = ""
1013802-25 = ""
1013802-26 = "你們這些傢伙……竟然在客人面前打架！"
1013802-27 = "但是這傢伙……！說要用義大利麵醬拌飯吃！"
1013802-28 = "你不也在濃縮咖啡裡加水喝嗎！！"
1013802-29 = "啊啊啊啊……！！把他們兩個都給我帶走！！！"
1013802-30 = ""
1013802-32 = ""
1013802-33 = ""
1013802-34 = ""
1013802-35 = "[ns] 「是個相當敏感的問題呢……」"
1013802-36 = "這樣就守住了狂獵的正義！"
1013802-37 = "老師，您沒事吧？"
1013802-38 = "[s] 「呃，嗯。沒事。」"
1013802-39 = "那真是太好了。"
1013802-40 = "抱歉讓您見到難堪的場面。我一定會對他們嚴加管教的！"
1013802-41 = "你們這些傢伙，就讓我來告訴你們什麼是狂獵精神吧！！"
1013802-42 = ""
1013802-44 = ""
1013802-46 = "（雖然爭吵已經告一段落……）"
1013802-47 = "（現場卻依然一片狼藉……）"
1013802-48 = "[ns] 「先把翻倒的桌子扶起來吧。」"
1013802-50 = "（就在為了搬重物而蹲下的瞬間……）"
1013802-51 = ""
1013802-54 = "[ns]「……！？」"
1013802-55 = "（感覺……屁股那邊好像涼涼的……！）"
1013802-56 = "（難道是破掉了嗎……！？在這種地方……！？）"
1013802-57 = "[ns] 「怎，怎麼辦！？這樣會被當成可疑人物的……！」"
1013802-58 = "（腦袋一片空白……）"
1013802-59 = "（快思考！必須想辦法度過這個危機……！！）"
1013802-60 = "……？"
1013802-61 = "老師？你在這裡做什麼？"
1013802-62 = ""
1013802-64 = "[ns]「……！！」"
1013802-65 = "因為你沒在約好的地方出現，害我找了好久耶！"
1013802-66 = "真是的，就連電話也不接……"
1013802-67 = "……嗯？怎麼了？你的臉色不太好耶。#n而且姿勢也很奇怪。"
1013802-68 = "……"
1013802-69 = "你藏著什麼對吧？是不是？"
1013802-70 = "背後藏著什麼東西？讓我看看！"
1013802-71 = "[s] 「不，不行！這，這是……！！」"
1013802-72 = "為什麼不行？"
1013802-73 = "如果想用奇怪的惡作劇捉弄我的話，我可不會放過你……"
1013802-74 = ""
1013802-76 = ""
1013802-77 = "……"
1013802-78 = "……！？\n\n"
1013802-79 = "怎，怎麼會弄成這樣啊……！？"
1013802-80 = "褲，褲子破了就早點說啊！？"
1013802-81 = "[s] 「我，我本來也想說的……！」"
1013802-82 = "啊啊，真是的……！"
1013802-83 = "總，總之你在這裡乖乖等著！我馬上回來……！"
1013802-84 = ""
1013802-86 = ""
1013802-88 = "（之後用玲奈拿來的小毯子圍在腰上，躲到了安全的地方）"
1013802-89 = ""
1013802-90 = "呼……這裡應該就沒問題了。"
1013802-91 = "[s] 「真的很謝謝你，玲奈！」"
1013802-92 = "別用那種尷尬的姿勢鞠躬！"
1013802-93 = "而且要跟我道謝還太早了。"
1013802-94 = "現在才正要開始而已。"
1013802-95 = "唉……"
1013802-96 = ""
1013802-98 = ""
1013802-99 = "好了，脫掉吧。"
1013802-100 = "[s]「……嗯？」"
1013802-101 = "要我再說一遍這麼丟臉的話嗎！？"
1013802-102 = "快點脫掉！我幫你縫好啦！！"
1013802-103 = "[s] 「啊……好！」"
1013802-106 = "（趕緊到角落脫下破掉的褲子，並交給了玲奈）"
1013802-107 = "（之後用毯子遮住身體，看著玲奈縫補褲子）"
1013802-109 = "所以……是在打算把翻倒的桌子扶起來時破掉的？"
1013802-110 = "那種事為什麼要由老師來做啊？舍監隊他們不是會自己處理嗎？"
1013802-111 = "真是的，性格太好也是個問題呢。"
1013802-112 = "[s] 「意思是……你喜歡我？」"
1013802-113 = "蛤！？你在說什麼啊！？"
1013802-114 = ""
1013802-116 = ""
1013802-117 = "……啊。"
1013802-118 = "都，都是老師害我縫錯了啦！"
1013802-119 = "真是的，害我白白增加工作……！跟前輩們一個樣！"
1013802-120 = "[s] 「這也代表我對你很重要對吧！好感動！」"
1013802-121 = "要是再繼續捉弄我，小心我連口袋都全部縫起來哦？"
1013802-122 = "不想那樣的話，最好給我乖乖待著。"
1013802-123 = "使用針線的時候可是很危險的耶。唉……"
1013802-124 = "我接下來要專心了，安靜等我一下吧！"
1013802-126 = "（按照玲奈說的乖乖等待）"
1013802-127 = "（不久後……）"
1013802-128 = ""
1013802-129 = "好了，穿穿看吧。"
1013802-130 = ""
1013802-132 = ""
1013802-133 = ""
1013802-134 = ""
1013802-136 = "穿好了嗎？"
1013802-137 = "[s] 「嗯，穿好了。」"
1013802-138 = "真的嗎？睜開眼睛之後不會看到奇怪的東西吧？"
1013802-139 = "[s]「當然！」"
1013802-140 = "好，好吧。我相信你。"
1013802-141 = "那我睜開眼睛了哦？"
1013802-142 = "……"
1013802-143 = "怎麼樣？有補好嗎？"
1013802-144 = "[s] 「嗯！好多了！你看！」"
1013802-145 = ""
1013802-150 = "[ns]「啊……」"
1013802-151 = ""
1013802-152 = ""
1013802-153 = "吼唷，笨蛋！為什麼要那樣動啊！"
1013802-154 = "你看，又破掉了啦！！"
1013802-155 = "快點脫掉！！在我真的把你的口袋縫起來之前！！"
1013802-157 = "（……之後乖乖讓玲奈縫補褲子，並反省了一段時間）"
