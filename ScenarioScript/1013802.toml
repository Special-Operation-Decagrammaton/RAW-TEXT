[translation]
1013802-1 = "얼른 벗어!"
1013802-2 = "(레나가 필요하다는 액세서리 재료를 사서, 와일드헌트 예술학원을 방문했다.)"
1013802-3 = "(그런데…….)"
1013802-5 = "아아앗……! 지, 지금 뭐 하는 거야?!"
1013802-6 = "스파게티에 케첩을 뿌려 먹다니……!!"
1013802-7 = "응? 이거 맛있어. 너도 먹어볼래?"
1013802-8 = "시끄러워! 그건 와일드헌트 요리에 대한 모욕이야!!"
1013802-9 = "아니…… 잠깐. 그 옆에 있는 밥은 뭐야?"
1013802-10 = "아, 이거? 스파게티 소스에 비벼 먹으면 맛있어~."
1013802-11 = "으, 으아아아아아……! 싸우자! 이 악마……!!"
1013802-12 = "아하하핫! 오는 싸움은 막지 않아……!!"
1013802-14 = "[ns] \"저기…… 얘들아?\""
1013802-20 = "(지나가다 학생들의 싸움에 휘말려 버렸다…….)"
1013802-26 = "이 녀석들…… 손님이 보는 앞에서 싸우다니!"
1013802-27 = "하지만 이 녀석……! 스파게티 소스에 밥을 비벼 먹는다 했다고!"
1013802-28 = "그러는 넌 에스프레소에 물을 타서 마시고 있었잖아!!"
1013802-29 = "으아아아아……!! 둘 다 체포해!!!"
1013802-35 = "[ns] \"뭔가 상당히 민감한 문제였나 보네…….\""
1013802-36 = "그렇습니다. 이걸로 와일드헌트의 정의를 지킨 겁니다!"
1013802-37 = "아무튼 선생님. 괜찮으십니까?"
1013802-38 = "[s] \"으, 으응. 괜찮아.\""
1013802-39 = "그렇다니 다행이군요."
1013802-40 = "부끄러운 모습을 보여드렸습니다. 이 아이들은 제가 단단히 교육하도록 하겠습니다!"
1013802-41 = "이 자식들, 와일드헌트 정신이 뭔지 알려주겠어!!"
1013802-46 = "(그렇게 싸움은 끝났지만…….)"
1013802-47 = "(현장은 엉망이 되어 있었다…….)"
1013802-48 = "[ns] \"엎어진 테이블이라도 정리를 해야겠네.\""
1013802-50 = "(무거운 걸 들기 위해 잠깐 쭈그려 앉은 순간…….)"
1013802-54 = "[ns] \"……?!\""
1013802-55 = "(뭔가…… 엉덩이 쪽이 허전하다……!)"
1013802-56 = "(찢어진 건가……! 이런 장소에서……!!)"
1013802-57 = "[ns] \"어, 어떡하지?! 이대로는 수상한 사람으로 보일 텐데……!\""
1013802-58 = "(머릿속이 하얗다…….)"
1013802-59 = "(생각해 내야 한다! 어떻게든 이 위기를 모면할 방법을……!!)"
1013802-60 = "……?"
1013802-61 = "선생님? 여기서 뭐 해?"
1013802-64 = "[ns] \"……!!!\""
1013802-65 = "약속 장소에 안 나와서 한참 찾았잖아!"
1013802-66 = "정말이지 전화도 안 받고……."
1013802-67 = "……응? 왜 그래? 안색이 안 좋은데. 포즈도 뭔가 어정쩡하고."
1013802-68 = "……."
1013802-69 = "뭔가 숨기고 있구나? 그렇지?"
1013802-70 = "뒤에 감추고 있는 건 뭐야? 보여줘!"
1013802-71 = "[s] \"아, 안돼! 이, 이건……!!\""
1013802-72 = "뭐가 안 된다는 거야?"
1013802-73 = "이상한 장난으로 날 놀리려 했던 거라면 가만 안 두게……."
1013802-77 = "……."
1013802-78 = "……?!"
1013802-79 = "뭐, 뭐, 뭐야! 왜 거기가……!!"
1013802-80 = "찌, 찢어졌으면 찢어졌다고 마, 말을 했어야지!!"
1013802-81 = "[s] \"마, 말하려고 했어……!\""
1013802-82 = "아, 으아……!"
1013802-83 = "아, 아무튼 거기 얌전히 있어! 금방 돌아올 테니까……!"
1013802-88 = "(이후 레나가 가져온 작은 담요를 허리에 두르고, 안전한 장소로 피신했다.)"
1013802-90 = "휴우. 여기라면 괜찮을 거야."
1013802-91 = "[s] \"정말 고마워, 레나!\""
1013802-92 = "그렇게 엉거주춤한 포즈로 굽실거리지 마!"
1013802-93 = "아무튼 고마워하긴 아직 일러."
1013802-94 = "진짜는 지금부터 시작이니까."
1013802-95 = "……하아아."
1013802-99 = "벗어."
1013802-100 = "[s] \"……응?\""
1013802-101 = "창피하게 또 말하게 할 거야?!"
1013802-102 = "얼른 벗어! 내가 꿰매줄 테니까!!"
1013802-103 = "[s] \"아…… 응!\""
1013802-106 = "(서둘러 구석으로 가서 찢어진 하의를 벗은 뒤 레나에게 건넸다.)"
1013802-107 = "(이후 담요로 몸을 가리고 레나의 바느질을 지켜보았다.)"
1013802-109 = "그러니까…… 넘어진 테이블을 정리하다가 이렇게 찢어졌다고?"
1013802-110 = "그걸 왜 선생님이 정리하는 거야? 사감대 애들이 알아서 할 텐데."
1013802-111 = "하여간 성격이 너무 좋아도 탈이라니까."
1013802-112 = "[s] \"그건…… 내가 좋다고……?\""
1013802-113 = "뭐, 뭐엇?! 뭐라는 거야?!"
1013802-117 = "……아."
1013802-118 = "서, 선생님 때문에 진짜로 실수했잖아!"
1013802-119 = "하여간 쓸데없이 일이나 늘리고……! 선배들이랑 똑같아!"
1013802-120 = "[s] \"그만큼 내가 소중하다는 거네! 감격이야!\""
1013802-121 = "자꾸 놀리면 주머니까지 전부 꿰매서 막아버린다?"
1013802-122 = "그게 싫다면 얌전히 있는 게 좋을 거야."
1013802-123 = "바늘과 실을 사용하고 있을 때는 위험하니까. 으휴……."
1013802-124 = "지금부터 집중할 거니까, 조용히 기다려!"
1013802-126 = "(레나의 말대로 얌전히 기다리기로 했다.)"
1013802-127 = "(그렇게 잠시 후…….)"
1013802-129 = "자. 다 됐어. 입어봐."
1013802-136 = "다 입었어?"
1013802-137 = "[s] \"응. 다 입었어.\""
1013802-138 = "정말이지? 눈 떴는데 이상한 모습인 건 아니지?"
1013802-139 = "[s] \"물론이지!\""
1013802-140 = "조, 좋아. 믿겠어."
1013802-141 = "그럼 눈 뜬다?"
1013802-142 = "……."
1013802-143 = "어때? 잘 고쳐진 것 같아?"
1013802-144 = "[s] \"응! 너무 편해! 이것 봐!\""
1013802-150 = "[ns] \"아…….\""
1013802-153 = "야이, 바보야! 그렇게 과격하게 움직이면 어떡해!"
1013802-154 = "또 찢어졌잖아!!"
1013802-155 = "얼른 벗어!! 진짜로 주머니까지 다 꿰매기 전에!!"
1013802-157 = "(……이후 얌전히 레나에게 수선을 맡기고 반성의 시간을 보냈다.)"
