[translation]
1013802-1 = "รีบถอดเดี๋ยวนี้!"
1013802-2 = "(คุณครูซื้อวัสดุทำเครื่องประดับที่เรนะต้องการและมุ่งหน้าไปยังสถาบันศิลปะไวลด์ฮันต์)"
1013802-3 = "(แต่ว่า...)"
1013802-5 = "ว้ายย...! ทะ... ทำอะไรของเธอน่ะ?!"
1013802-6 = "กินสปาเก็ตตี้ราดซอสมะเขือเทศงั้นเหรอ...!!"
1013802-7 = "ทำไมล่ะ? แบบนี้อร่อยดีออก ลองกินดูมั้ยล่ะ?"
1013802-8 = "จะบ้าเหรอ! แบบนั้นเป็นการไม่ให้เกียรติอาหารของไวลด์ฮันต์นะ!!"
1013802-9 = "เดี๋ยวนะ... แล้วข้าวที่อยู่ข้างๆ นั่นมันอะไรกัน?"
1013802-10 = "อ้อ นี่น่ะเหรอ? ข้าวคลุกซอสสปาเก็ตตี้น่ะ กินแบบนี้อร่อยเลยละ~"
1013802-11 = "อะ... อ๊าาาาาา...! ไม่ไหวแล้ว มาสู้กันเลยดีกว่า! ยัยบ๊องนี่...!!"
1013802-12 = "อะฮะฮ่าฮ่า! จะตัดสินด้วยการต่อสู้งั้นเหรอ ก็เอาสิ...!!"
1013802-14 = "[ns] \"นี่... เด็กๆ?\""
1013802-20 = "(ระหว่างทาง คุณครูก็พลอยโดนหางเลขจากการทะเลาะวิวาทของนักเรียน...)"
1013802-26 = "ยัยพวกนี้นี่... มาทะเลาะกันต่อหน้าแขกของโรงเรียนงั้นเหรอ!"
1013802-27 = "ก็ยัยนี่น่ะสิ...! บอกว่าเอาซอสสปาเก็ตตี้มาคลุกข้าวกิน!"
1013802-28 = "แต่เธอก็ดื่มเอสเพรสโซ่ผสมน้ำไม่ใช่เหรอ!!"
1013802-29 = "อ๊ากกกก...!! จับตัวไปทั้งคู่เลย!!!"
1013802-35 = "[ns] \"ดูจะเป็นประเด็นที่ละเอียดอ่อนเลยนะ...\""
1013802-36 = "ใช่ค่ะ พวกฉันต้องปกป้องความยุติธรรมของไวลด์ฮันต์ไว้อย่างนี้ละค่ะ!"
1013802-37 = "เรื่องนั้นเอาไว้ก่อนเถอะค่ะ ว่าแต่คุณครู เป็นยังไงบ้างคะ?"
1013802-38 = "[s] \"อะ... อื้อ ครูไม่เป็นไร\""
1013802-39 = "โล่งอกไปทีนะคะ"
1013802-40 = "ขอโทษที่ทำให้เห็นด้านที่ไม่น่ามองนะคะ เด็กพวกนี้ต้องเอาไปปรับทัศนคติอย่างเข้มข้นเลยค่ะ!"
1013802-41 = "นี่พวกเธอ ฉันจะทำให้เห็นว่าจิตวิญญาณของไวลด์ฮันต์มันเป็นยังไง!!"
1013802-46 = "(แล้วการทะเลาะวิวาทก็จบลง...)"
1013802-47 = "(แต่สถานที่เกิดเหตุก็เละเทะไปหมด...)"
1013802-48 = "[ns] \"ต้องจัดโต๊ะที่ล้มระเนระนาดให้เรียบร้อยแล้วละ\""
1013802-50 = "(คุณครูก้มตัวลงไปเพื่อจะยกโต๊ะตัวหนักๆ ขึ้นมา...)"
1013802-54 = "[ns] \"...?!\""
1013802-55 = "(จู่ๆ ก็รู้สึกว่า... ตรงก้นมันเย็นๆ แปลกๆ...!)"
1013802-56 = "(หรือว่ากางเกงขาด...! ขาดในที่แบบนี้เนี่ยนะ...!!)"
1013802-57 = "[ns] \"ทะ... ทำไงดี?! ถ้าปล่อยไว้ ต้องถูกมองว่าเป็นภัยสังคมแน่ๆ...!\""
1013802-58 = "(มืดแปดด้านเลย...)"
1013802-59 = "(ต้องคิดให้ออกสิ! ต้องหาทางหลุดพ้นจากวิกฤตนี้ให้ได้...!!)"
1013802-60 = "...?"
1013802-61 = "คุณครู? มาทำอะไรตรงนี้น่ะ?"
1013802-64 = "[ns] \"...!!!\""
1013802-65 = "คุณครูไม่มาหาฉันตามนัด ฉันเลยเดินหาอยู่พักใหญ่เลยนะ!"
1013802-66 = "โทรศัพท์ก็ไม่รับด้วย..."
1013802-67 = "หืม...? เป็นอะไรไปเหรอ? สีหน้าไม่ค่อยดีเลย แล้วก็ยังทำท่าทางแปลกๆ อีก"
1013802-68 = "..."
1013802-69 = "ซ่อนอะไรไว้สินะ? ใช่มั้ยล่ะ?"
1013802-70 = "ซ่อนอะไรไว้ข้างหลังน่ะ? ขอฉันดูหน่อยสิ!"
1013802-71 = "[s] \"มะ... ไม่ได้นะ! คะ... คือว่า...!!\""
1013802-72 = "ทำไมถึงไม่ได้ล่ะ?"
1013802-73 = "ถ้าจะแกล้งฉันด้วยอะไรแปลกๆ ละก็ ฉันว่าคุณครูล้มเลิกไปเถอะ..."
1013802-77 = "..."
1013802-78 = "...?!"
1013802-79 = "อะ... อะ... อะไรน่ะ! ทำไมตรงนั้นมันถึง...!!"
1013802-80 = "ถะ... ถ้ากางเกงขาด กะ... ก็บอกว่าขาดตั้งแต่แรกสิ!!"
1013802-81 = "[s] \"กะ... ก็ว่าจะบอกอยู่แล้ว...!\""
1013802-82 = "อะ... อ่า...!"
1013802-83 = "อะ... เอาเป็นว่าอยู่ตรงนั้นก่อนนะ ยืนดีๆ ด้วย! แล้วฉันจะรีบกลับมา...!"
1013802-88 = "(หลังจากนั้นไม่นาน เรนะก็เอาผ้าห่มมาพันรอบเอวคุณครูไว้ แล้วพาไปหลบยังที่ปลอดภัย)"
1013802-90 = "ฮู่ว ที่นี่น่าจะโอเคนะ"
1013802-91 = "[s] \"ขอบใจมากเลยนะ เรนะ!\""
1013802-92 = "อย่าทำท่ากึ่งนั่งกึ่งยืนอยู่แบบนั้นสิ!"
1013802-93 = "แล้วก็ มันยังเร็วเกินไปที่จะขอบใจฉันนะ"
1013802-94 = "ที่ฉันจะช่วยคุณครูคือจากนี้ไปต่างหาก"
1013802-95 = "เฮ้อออ....."
1013802-99 = "ถอดออกสิ"
1013802-100 = "[s] \"หืม...?\""
1013802-101 = "จะให้ฉันพูดอีกรอบหรือไง มันน่าอายนะ! "
1013802-102 = "รีบถอดเดี๋ยวนี้! ฉันจะช่วยเย็บให้เอง!!"
1013802-103 = "[s] \"อ่า... อื้อ!\""
1013802-106 = "(แล้วคุณครูก็เดินเข้ามุมไปถอดกางเกงที่ขาดให้เรนะ)"
1013802-107 = "(หลังจากนั้นก็เอาผ้าห่มมาพันตัวไว้แล้วเฝ้าดูเรนะเย็บผ้า)"
1013802-109 = "สรุปว่า... กางเกงขาดตอนก้มลงไปเก็บโต๊ะที่ล้มระเนระนาดสินะ?"
1013802-110 = "แล้วทำไมคุณครูต้องไปเก็บโต๊ะด้วยล่ะ? เดี๋ยวพวกฝ่ายดูแลหอพักก็มาจัดการเองนั่นละ"
1013802-111 = "คุณครูน่ะ นิสัยดีเกินไปจนเป็นปัญหาเลยละ"
1013802-112 = "[s] \"หมายความว่า... ชอบที่ครูเป็นแบบนี้สินะ...?\""
1013802-113 = "วะ... ว่าไงนะ?! พูดบ้าอะไรน่ะ?!"
1013802-117 = "อ่า..."
1013802-118 = "คะ... คุณครูพูดแทรกจนฉันเผลอเย็บพลาดเลยเห็นมั้ย!"
1013802-119 = "เอาแต่สร้างเรื่องไม่เป็นเรื่องตลอดเลย...! เหมือนพวกรุ่นพี่ไม่มีผิด!"
1013802-120 = "[s] \"หวงแหนครูพอๆ กับรุ่นพี่เลยสินะ! ได้ยินแล้วซึ้งใจจัง!\""
1013802-121 = "ถ้ายังพูดแกล้งฉันอีก ฉันจะเย็บปิดกระเป๋าไปด้วยเลย!"
1013802-122 = "ถ้าไม่อยากให้กระเป๋ากางเกงหายไป ก็อยู่เงียบๆ จะดีกว่านะ"
1013802-123 = "การใช้เข็มเย็บผ้าด้วยมือน่ะมันอันตรายนะ เฮ้อ..."
1013802-124 = "จากนี้ฉันจะตั้งใจเย็บแล้ว รอเงียบๆ ล่ะ!"
1013802-126 = "(แล้วคุณครูก็รออย่างสงบเสงี่ยมตามคำสั่งของเรนะ)"
1013802-127 = "(หลังจากนั้นไม่นาน...)"
1013802-129 = "เอาละ เสร็จหมดแล้ว ลองใส่ดูสิ"
1013802-136 = "ใส่เสร็จหรือยัง?"
1013802-137 = "[s] \"อื้อ ใส่เรียบร้อยแล้ว\""
1013802-138 = "จริงนะ? ตอนฉันลืมตา ฉันจะไม่ได้เห็นภาพแปลกๆ หรอกใช่มั้ย?"
1013802-139 = "[s] \"แน่นอนอยู่แล้ว!\""
1013802-140 = "กะ... ก็ได้ ฉันจะเชื่อแล้วกัน"
1013802-141 = "งั้นฉันจะลืมตาละนะ?"
1013802-142 = "..."
1013802-143 = "เป็นไงบ้าง? ฉันซ่อมให้ดีเลยใช่มั้ยล่ะ?"
1013802-144 = "[s] \"อื้อ! ใส่สบายมากเลย! ดูครูนะ!\""
1013802-150 = "[ns] \"อ่า...\""
1013802-153 = "นี่ คุณครูคนบื้อ! ทำไมถึงขยับตัวแรงแบบนั้นล่ะ!"
1013802-154 = "มันขาดอีกรอบแล้วนะ!!"
1013802-155 = "รีบถอดเดี๋ยวนี้!! ไม่งั้นฉันจะเย็บปิดตายกระเป๋ากางเกงไปด้วย!!"
1013802-157 = "(หลังจากนั้นคุณครูก็ปล่อยให้เรนะเย็บกางเกงให้อีกครั้งและไปนั่งสำนึกผิด...)"
