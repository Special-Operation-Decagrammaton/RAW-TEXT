[translation]
1013802-1 = "快脫掉！"
1013802-2 = "（買好玲奈需要的飾品材料後，拜訪了狂獵藝術學院）"
1013802-3 = "（然而……）"
1013802-5 = "啊啊啊……！你，你在做什麼！？"
1013802-6 = "竟然在義大利麵上淋番茄醬……！！"
1013802-7 = "嗯？很好吃哦。你也要試試嗎？"
1013802-8 = "閉嘴！那是對狂獵料理的侮辱！！"
1013802-9 = "……等等，旁邊那碗飯是什麼？"
1013802-10 = "啊，這個？拌義大利麵醬很好吃哦～"
1013802-11 = "唔，啊啊啊啊……！決鬥吧！你這個惡魔……！！"
1013802-12 = "啊哈哈哈！好啊！來吧！！"
1013802-14 = "[ns] 「那個……你們在做什麼？」"
1013802-20 = "（路過時，被捲入了學生們的爭吵……）"
1013802-26 = "你們這些傢伙……竟然在客人面前打架！"
1013802-27 = "但是這傢伙……！說要把義大利麵醬拌飯吃！"
1013802-28 = "你不也在濃縮咖啡裡加水喝嗎！！"
1013802-29 = "啊啊啊啊……！！兩個都給我抓走！！！"
1013802-35 = "[ns] 「是個相當敏感的問題呢……」"
1013802-36 = "這樣就守住了狂獵的正義！"
1013802-37 = "老師，您沒事吧？"
1013802-38 = "[s] 「呃，嗯。沒事。」"
1013802-39 = "那就太好了。"
1013802-40 = "讓您看到丟臉的樣子了。我會好好教育他們的！"
1013802-41 = "你們這些傢伙，我要讓你們知道什麼是狂獵精神！！"
1013802-46 = "（就這樣，爭吵雖然告一段落了……）"
1013802-47 = "（但現場卻一片狼藉……）"
1013802-48 = "[ns] 「先把翻倒的桌子扶起來吧。」"
1013802-50 = "（為了搬重物蹲下的瞬間……）"
1013802-54 = "[ns]「……！？」"
1013802-55 = "（感覺……屁股那邊好像涼涼的……！）"
1013802-56 = "（破掉了嗎……！？在這種地方……！？）"
1013802-57 = "[ns] 「怎，怎麼辦！？ 這樣會被當成可疑人物……！」"
1013802-58 = "（腦袋一片空白……）"
1013802-59 = "（快思考！必須想辦法度過這個危機……！！）"
1013802-60 = "……？"
1013802-61 = "老師？你在這裡幹什麼？"
1013802-64 = "[ns]「……！！」"
1013802-65 = "因為你沒來約定的地方，讓我找了好久！"
1013802-66 = "真是的，電話也不接……"
1013802-67 = "……嗯？怎麼了？臉色不太好耶，姿勢也很怪。"
1013802-68 = "……"
1013802-69 = "你藏著什麼吧？對吧？"
1013802-70 = "你藏什麼在後面？給我看！"
1013802-71 = "[s] 「不，不行！這，這是……！！」"
1013802-72 = "為什麼不行？"
1013802-73 = "如果想用奇怪的惡作劇捉弄我，我可不會放過你……"
1013802-77 = "……"
1013802-78 = "……！？\n\n"
1013802-79 = "怎，怎麼會弄成這樣啊……！？"
1013802-80 = "褲，褲子破了就說啊！？"
1013802-81 = "[s] 「本，本來想說的……！」"
1013802-82 = "啊啊，真是的……！"
1013802-83 = "總，總之你在這裡乖乖等著！我馬上回來……！"
1013802-88 = "（之後用玲奈拿來的小毯子圍在腰上，躲到了安全的地方）"
1013802-90 = "呼……這裡應該就沒問題了。"
1013802-91 = "[s] 「真的很謝謝你，玲奈！」"
1013802-92 = "別用那種尷尬的姿勢鞠躬！"
1013802-93 = "總之，現在道謝還太早。"
1013802-94 = "現在才要開始而已。"
1013802-95 = "唉……"
1013802-99 = "好了，脫掉吧。"
1013802-100 = "[s]「……嗯？」"
1013802-101 = "要我再說一遍這麼丟臉的話嗎！？"
1013802-102 = "快脫掉！我幫你縫！！"
1013802-103 = "[s] 「啊……好！」"
1013802-106 = "（趕緊到角落脫下破掉的褲子交給了玲奈）"
1013802-107 = "（之後用毯子遮住身體看著玲奈縫補褲子）"
1013802-109 = "所以是……想把翻倒的桌子扶起來時破掉的？"
1013802-110 = "為什麼老師要做那種事？舍監會自己處理的。"
1013802-111 = "真是的，性格太好也是問題呢。"
1013802-112 = "[s] 「你的意思是……你喜歡我……？」"
1013802-113 = "蛤！？你在說什麼啊！？"
1013802-117 = "……啊。"
1013802-118 = "都，都是老師害我縫錯了！"
1013802-119 = "真是的，害我白白增加工作……！跟前輩們一樣！"
1013802-120 = "[s] 「也就是說我對你很重要！？好感動！」"
1013802-121 = "再囉嗦就連口袋都全部縫起來哦？"
1013802-122 = "不想那樣的話最好給我乖乖待著。"
1013802-123 = "使用針線的時候是很危險的。唉……"
1013802-124 = "我現在要開始專心了，安靜等著！"
1013802-126 = "（按照玲奈說的乖乖等待）"
1013802-127 = "（不久後……）"
1013802-129 = "好了，穿穿看。"
1013802-136 = "穿好了嗎？"
1013802-137 = "[s] 「嗯，穿好了。」"
1013802-138 = "真的嗎？睜開眼睛不會看到奇怪的東西吧？"
1013802-139 = "[s]「當然！」"
1013802-140 = "好，好吧。我相信你。"
1013802-141 = "那我睜開眼睛了哦？"
1013802-142 = "……"
1013802-143 = "怎麼樣？有修好嗎？"
1013802-144 = "[s] 「嗯！好多了！你看！」"
1013802-150 = "[ns]「啊……」"
1013802-153 = "啊，笨蛋！誰叫你要那樣動！"
1013802-154 = "你看又破了！！"
1013802-155 = "快脫掉！！想讓口袋也被縫起來嗎！？"
1013802-157 = "（……之後乖乖讓玲奈縫補褲子，並度過了反省的時間）"
