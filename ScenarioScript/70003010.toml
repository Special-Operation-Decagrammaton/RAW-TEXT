[translation]
70003010-1 = "하이랜더 운행 일지 1"
70003010-7 = "안녕하세요-! 저는 하이랜더 철도학원의 하이랜더 기관사입니다."
70003010-8 = "오늘은 키보토스 내부 순환선의 운행이 예정되어 있는데요!"
70003010-9 = "아시다시피 내부 순환선은 연간 사건사고가 가장 많이 발생하는 노선이죠."
70003010-10 = "운행 중에는 특이 사항이 발생하더라도 보통 내부 인력만으로 대응해야 해서, 살짝 긴장이 되네요."
70003010-11 = "문제가 커지거나 하면 병력을 요청하기도 하는데, 출동해서 도착하는 데에도 시간이 걸리고……"
70003010-12 = "아무래도 즉각 처리할 수 없는 일들이 종종 있다 보니, 조금 힘들기도 합니다."
70003010-13 = "……"
70003010-14 = "네에…… 그런 일이 조금 많긴 한데요……"
70003010-18 = "아하하, 어쨌든~!"
70003010-19 = "그렇게 전반적인 차량 관리나 운행 중 발생하는 사건사고에 대응하다 보면 근무 시간이 훅~ 지나간답니다!"
70003010-20 = "좋은 건진 모르겠지만 아무튼!"
70003010-21 = "뭐 하는 거야? 영상 통화?"
70003010-22 = "앗, 아니……"
70003010-23 = "그게……"
70003010-27 = "브, 브이로그를 찍고 있었어요……"
70003010-28 = "브이로그?"
70003010-29 = "네에……! 그, 뭐냐! 하이랜더 철도학원의 진면목을 좀 더 많은 이들에게 알리고자……"
70003010-30 = "헤에……"
70003010-31 = "그, 그리고 승객분들이 우리가 어떤 일을 하는지 알게 되면 좀 더 협조해 주지 않을까…… 하는 그런 마음으로……"
70003010-32 = "하긴. 그냥 열차 타고 빙글빙글 돌기만 하는 줄 아는 사람들도 많으니까."
70003010-33 = "얼마 전에도 \"네놈들이 하는 게 뭐냐!\"라며 소란을 피우던 승객이 있었지……"
70003010-34 = "그러니까요……"
70003010-35 = "그런 사람들이 워낙 많으니까, 뭐라도 해서 조금이라도 진상이 줄어들면 의미가 있겠네."
70003010-36 = "어쨌든 곧 출발이니까, 준비하자구."
70003010-37 = "네, 넵!"
70003010-41 = "휴우……"
70003010-42 = "어쨌든 오늘의 운행! 힘내보겠습니다. 이달의 우수 학생을 목표로……!"
70003010-45 = "열차 기관실"
70003010-46 = "흠…… 다행히 지금까지는 큰 이상 없이 운행 중이네요."
70003010-47 = "객실 상황은 어떤가요?"
70003010-48 = "아- 객실도 이상 무."
70003010-49 = "3호차에서 좌석을 잘못 앉은 승객이 있었지만, 큰 문제 없이 잘 해결되었음."
70003010-50 = "다행이네요. 계속 이렇게 이상이 없으면 좋을 텐데……"
70003010-55 = "아, 말하자마자……"
70003010-56 = "5호차에서 너무 춥다고 에어컨을 꺼달라는 민원이 들어왔네요."
70003010-57 = "에어컨 가동 온도를 조금 올려야겠어요."
70003010-59 = "(잠시 후……)"
70003010-62 = "엣…… 역시 또 5호차 민원인데……"
70003010-63 = "너무 덥다고 에어컨을 강하게 틀어달라고……"
70003010-64 = "그거, 아까랑 같은 사람?"
70003010-65 = "아니요, 다른 분이에요."
70003010-66 = "끄응…… 이런 경우가 제일 난감하다니까. 어느 장단에 맞춰야 하는 거야?"
70003010-67 = "어쩔 수 없죠. 불편해서 민원을 넣는 거니까……"
70003010-72 = "앗, 아아……! 객실, 객실 나와주세요."
70003010-73 = "왜? 무슨 일이야?"
70003010-74 = "다, 다시 5호차에서 신고가 들어왔는데…… 객실에서 덥다며 옷을 벗는 승객이 있다고 하네요……"
70003010-75 = "아이고…… 출동할게."
70003010-76 = "에어컨 온도는 합의가 필요할 것 같으니, 추운 승객분께는 담요를 가져다드리면 되겠지?"
70003010-77 = "객실 내에서 옷을 벗는 승객보다는 그게 낫겠죠……?"
70003010-78 = "잘 부탁드려요……"
70003010-80 = "7호 차량"
70003010-84 = "에잉~ 요즘 젊은것들이란."
70003010-88 = "어른이 보이면 자리도 재깍재깍 양보하고 그래야지."
70003010-89 = "뭐야?"
70003010-90 = "저기요, 여기 지정좌석제인데요."
70003010-91 = "아, 모르겠고! 빨리 일어나서 자리 비켜! 나 다리 아프다고!"
70003010-92 = "저거 뭘 들고 있는 거야? 막대기?"
70003010-93 = "어어, 할배! 그 샤쿠하치 안 내려놔?"
70003010-95 = "이 버르장머리 없는 놈들 같으니!! 내가 네놈들만 할 때는~!!"
70003010-96 = "뭐 이런 진상이 다 있어?!"
70003010-106 = "하아…… 그, 어르신? 그거 내려놓으시구요. 다들 진정하세요."
70003010-107 = "아앙? 넌 또 뭐야?"
70003010-108 = "어이! 저 할배가 먼저 시작했다고!"
70003010-109 = "여기서 이러시면 곤란하구요. 일단 객실 바깥 통로로 이동해주시면……"
70003010-110 = "웃기고 있네! 고객이 왕인데, 어디 이래라 저래라야?"
70003010-111 = "아니, 다른 분들께 피해가 가고 있으니까…… 일단 이동하셔서……"
70003010-112 = "여긴 우리가 돈 주고 산 좌석이라고!"
70003010-113 = "저 영감이 문제니까 우리는 여기서 한 발짝도 움직이지 않을 거야!!"
70003010-114 = "아니, 저기……"
70003010-115 = "뭐, 영감?? 이런 개념 없는 어린 것들 봐라! 어른한테 못하는 말이 없어!"
70003010-119 = "……"
70003010-120 = "왜 항상 이런 일이 벌어지는 걸까……?"
70003010-123 = "저기요. 하이랜더 승무원 맞으시죠?"
70003010-124 = "아, 네."
70003010-125 = "저 사람들 좀 빨리 어떻게 해주세요. 시끄럽잖아요."
70003010-126 = "그, 최선을 다하고 있긴 한데……"
70003010-127 = "아니, 다 끌어내든 해서 여기서 치워달라고요. 이게 뭐예요, 지금."
70003010-128 = "아, 알겠습니다……"
70003010-130 = "불편을 끼쳐드려 죄송합니다……"
70003010-134 = "7호 차량에서 소란이요? 으음, 알겠습니다."
70003010-135 = "일단 현장에서 최대한 조치해 보시고, 어려울 경우 지원 갈게요."
70003010-136 = "네, 네. 조금만 고생 부탁드립니다."
70003010-140 = "하아……"
70003010-141 = "왠지 좀 조용하다 했더니, 역시나네요."
70003010-145 = "엑? 이번엔 8호, 3호 차량에서도……?"
70003010-147 = "8호 차량"
70003010-154 = "어이! 나가는 사람 먼저야! 조심 좀 해!"
70003010-155 = "뭐야? 그쪽이 잘 피해 갔어야 하는 거 아뇨!"
70003010-156 = "아니면 당신이 먼저 양보를 하든가!"
70003010-157 = "뭐라고? 지금 그걸 말이라고 해?!"
70003010-159 = "3호 차량"
70003010-161 = "자, 자! 차내에 계신 승객 여러분~! 잠시 양해의 말씀 드립니다~!"
70003010-165 = "제가 누구냐? 중요하지 않습니다!"
70003010-166 = "중요한 것은 단 하나!"
70003010-167 = "여러분께서 정말 좋은 물건 하나 챙겨갈 수 있는 기회를 얻으셨다는 사실이죠!"
70003010-168 = "과연 그게 무엇이냐~! 다들 궁금하실 겁니다!"
70003010-169 = "뭐야, 잡상인이잖아. 빨리 신고해."
70003010-170 = "원적외선과 음이온을 방출해 혈액 순환에 좋고! 총열의 탄매도 감소시켜 주며 그저 몸에 지니기만 해도 탄 걸림 현상까지 싸악 없애주는!"
70003010-171 = "바로 게르게르 게르마늄 팔찌~!! 키보토스를 강타한 히트 상품이죠!"
70003010-172 = "없어서 못 판다는 바로 그 팔찌를 제가! 여러분을 위해 이렇게 찾아왔습니다. 날이면 날마다 오는 기회가 아닙니다~!!"
70003010-173 = "원래 정가는 5천 엔이지만, 이 열차에 타신 행운의 승객님들께는 단돈 천 엔만 받습니다! 그야말로 특별가 그 자체~!!"
70003010-174 = "어, 뭐야…… 그렇게 싸게 판매한다니, 한번 사볼 만할지도……?"
70003010-175 = "그, 그러게…… 탄 걸림 현상도 없애준다니. 대박인데……"
70003010-179 = "아, 손님! 만지셨으니 사셔야 합니다~!"
70003010-180 = "뭐, 뭐야? 호기심에 잠깐 만져봤을 뿐이라고……"
70003010-181 = "이건 저희 밀레니엄 유사과학부 특제 상품이라 만진 사람에게 즉시 각인되어 버리거든요!"
70003010-182 = "그, 그런……"
70003010-183 = "하아, 어쩔 수 없죠."
70003010-185 = "제가 특별히~! 원래는 이러면 안 되지만, 손님께는 더 저렴하게 판매하도록 하겠습니다."
70003010-186 = "5개 세트에 3천 엔! 크아~ 거저다, 거저~!!"
70003010-188 = "엣…… 그럼 2개를 공짜로 얻는 셈 아냐?"
70003010-189 = "이, 이러면 안 사는 게 바보 같은데?"
70003010-190 = "에잇, 기분이다!!"
70003010-192 = "특별히 이 객차에서는!! 손님 여러분 모두를 이 가격에 모시겠습니다~!!"
70003010-193 = "거기다 선착순 세 분께~!! 백귀야행에서 어렵게 공수해 온 액막이 부적도  드립니다!"
70003010-194 = "저, 저 살래요!"
70003010-195 = "나도, 나도!!"
70003010-197 = "6호 차량"
70003010-198 = "거기!! 짐칸 위에 올라가지 마세요! 내려오세요!"
70003010-199 = "아앙? 난 여기서 편하게 누워가겠어!"
70003010-200 = "올라가시면 위험합니다! 내려오시라구요!"
70003010-204 = "어이, 어이! 앉을 곳이 없다고! 이건 객차에 자리를 충분히 만들지 않은 네놈들 잘못 아니냐?"
70003010-205 = "예?"
70003010-206 = "손님, 혹시 승차권 좀 보여주시겠어요?"
70003010-207 = "그게 뭐야? 기차를 타는 데 승차권이 왜 필요해?"
70003010-212 = "손님, 다음 정거장에서 내려주셔야겠습니다!!"
70003010-213 = "뭐어-? 네가 뭔데?? 책임자 불러와!!"
70003010-215 = "4호 차량"
70003010-216 = "헉, 헉…… 여긴가?"
70003010-217 = "저, 손님들! 통로를 가로막고 마작을 하다니, 이러면 다른 승객들이 불편하잖아!"
70003010-218 = "아, 직원인가? 잘 왔다! 어이, 같이 하자고! 안 그래도 한 명이 내려버려서 말이야!"
70003010-219 = "응? 아니, 무슨 말……"
70003010-220 = "사람이 모자라다고! 빨리 여기 앉아!"
70003010-221 = "나, 나는 규칙도 몰라……! 아니, 그전에 여기서 마작을 하면 안 된다니까?"
70003010-222 = "으헤헤, 우리가 알려줄 테니까 일단 앉아봐!!"
70003010-225 = "네, 네에! 하이랜더 기관사입니다……!"
70003010-226 = "지원이요?! 어디로……"
70003010-230 = "네?! 전 객실이요……??"
