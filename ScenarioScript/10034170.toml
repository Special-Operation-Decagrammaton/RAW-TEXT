[translation]
10034170-1 = "2일 전: 승리를 위해"
10034170-4 = "이제 이틀밖에 안 남았네, 생각보다 시간이 빨리 지나가 버렸어."
10034170-5 = "지금까지 했던 거, 전부 한 번 다시 맞춰볼까?"
10034170-6 = "그렇게 말하니 괜히 긴장되네. 테스트 당일도 아닌데."
10034170-7 = "그 긴장감 또한 연습으로서의 가치를 지니는 법."
10034170-8 = "연습을 실전처럼, 실전을 연습처럼 하는 것이야말로 작전의 성공과 직결되는 태도겠지."
10034170-9 = "과정이 중요하다, 그동안의 추억이 보물이다 같은 소리는 실패한 뒤에나 하는 위안의 말."
10034170-10 = "중요한 건 결과다! 우리는 셈라를 손에 넣을 것이다!! 무수한 적들의 시체 위에서!!"
10034170-12 = "하여간 말투 진짜……."
10034170-13 = "대체 저러다 떨어지면 어쩌려고 저렇게 당당한 걸까."
10034170-14 = "뭐……. 그래. 그렇지만 그것도 다 저 녀석인 거니까."
10034170-15 = "확실히 분위기 타는 건 나쁘지 않다고 생각해. 이럴 땐 같이 텐션을 올려야지!"
10034170-17 = "마지막까지 가자-!!"
