[translation]
10024100-1 = "에필로그;충려지경: 집안에 경사가 가득하다."
10024100-2 = "(그렇게, 산해경을 뒤흔들었던 만년삼 밀반출 소동은 막을 내렸다.)"
10024100-10 = "이, 이 음식은 뭐야? 도대체……!"
10024100-11 = "자, 자. 먹어 봐! 붉은겨울식 고기 수프에 와일드헌트식 포도 고기찜이라고!"
10024100-12 = "국물이 분홍색……? 이거 정말 먹어도 되는 거지?"
10024100-13 = "색깔만 좀 그렇지 고소하고 새콤한 맛이 일품이라고. 고기찜은 또 얼마나 부드러운데!"
10024100-18 = "이대로 괜찮은 걸까…… 우리 산해경의 전통이…… 문화가……"
10024100-19 = "일단 먹어 보고 생각하라니까. 다 먹으면 트리니티식 다과도 기다리고 있어!"
10024100-20 = "버터와 설탕을 섞어 구운 과자에, 우유를 탄 차가 의외로 괜찮아!"
10024100-22 = "차, 차에 우유 같은 것을 섞다니 언어도단이다!"
10024100-24 = "그러지 말고 일단 한번 먹어 보라니까. 이게 또 맛 들이면 별미란 말이지."
10024100-33 = "자, 어린이 여러분. 오늘은 현룡문분들이 주최하고 현무상회분들이 개최한 연회 날이에요."
10024100-34 = "오늘만큼은 마음껏 먹고 놀아도 좋지만, 주위에 너무 폐를 끼쳐선 안 된답니다?"
10024100-35 = "네에~"
10024100-36 = "음식을 다 먹은 다음에는 고맙다고 인사드릴 것!"
10024100-37 = "그리고 집에 가서 양치질하는 것도 잊어버리면 안 돼!"
10024100-38 = "코코나 쨩도 양치질하는 거 잊어버리면 안 돼~"
10024100-39 = "코코나 쨩이 아니라 코코나 교관이라고!"
10024100-40 = "그러면 코코나 쨩. 잠시 동안만 아이들을 부탁해요?"
10024100-41 = "어? 슌 언니, 어딜 가려고?!"
10024100-42 = "후후후. 언니는 지금부터 선생님과…… '만남'이 있답니다?"
10024100-46 = "어? 언니만? 치사해! 나도……! 하, 하지만 아이들은……"
10024100-47 = "두고 봐, 슌 언니! 이 빚은 꼭 받아낼 테니까!"
10024100-52 = "……하나도 정신이 없는 것이다. 가능하면 빨리 연단방으로 돌아가고 싶은 것이다……"
10024100-53 = "하지만 이 음식들은 하나도 놓치기 싫으니 어찌하면 좋은 것이냐……"
10024100-54 = "그래! 좋은 생각이 났다! 역시 나님인 것이다!"
10024100-55 = "나님을 둘로 늘리는 비약을 만들면 되는 것이다!"
10024100-56 = "한 명은 이곳에서 음식의 맛을 보고, 다른 한 명은 조용히 연구에 몰두하면 되는 것이 아니냐!"
10024100-57 = "그런데 잠깐, 그러려면 일단 연단방으로 돌아가 보아야 하는 것이 아니냐……"
10024100-58 = "나님은 어찌하면 좋은 것이냐!"
10024100-59 = "하지만 이 음식은 정말 맛있구나…… 우물우물."
10024100-69 = "떠들썩하네, 문주."
10024100-70 = "이런 풍경을 원했던 건가?"
10024100-71 = "글쎄다. 산해경이 평화로울 수 있다면 그걸로 충분하다."
10024100-72 = "그런 것 치고는 제법 표정이 풀어져 있지 않아? 선생님은 어떻게 생각해?"
10024100-73 = "[s] \"모두 즐기고 있는 것 같아서 보기 좋아.\""
10024100-77 = "그렇게 보이는가?"
10024100-78 = "어쩌면 이 생소한 음식들 때문일 수도 있겠구나."
10024100-79 = "신기한 조합이로다. 우유 얼음과 연유, 청포도와 팥앙금이라니……"
10024100-81 = "더 가져다드릴까요, 문주님?"
10024100-82 = "아니다. 다른 것도 맛보고 싶구나. 모처럼 이런 자리이니 말이다."
10024100-83 = "하하하, 키사키는 예전부터 입이 짧았으니까 말이지. 이렇게 잘 먹는 모습을 보니 내가 다 뿌듯하네."
10024100-84 = "……나는 너의 여동생 같은 것이 아니다. 예전부터 말해 오지 않았느냐."
10024100-85 = "아무려면 어때! 알고 지난 게 몇 년인데! 자, 이것도 먹어 봐. 딸기 위에 크림을 바른 다음 떡으로 감싼 거라고!"
10024100-87 = "아니면 치즈볼 튀김을 가져다줄까? 슬슬 짭짤하고 고소한 것으로 입을 달랠 때가 됐지."
10024100-88 = "흥미롭구나. 전부 맛보도록 하지."
10024100-90 = "(두 집단 사이의 해묵은 갈등이 그렇게 쉽게 풀릴 것 같지는 않지만……)"
10024100-91 = "(그래도 지금만은, 서로를 향해 손을 내밀 수 있다는 사실이 기쁘게 다가왔다.)"
10024100-92 = "용무동주 ~마음에 그리는 것은, 하나의 미래~"
