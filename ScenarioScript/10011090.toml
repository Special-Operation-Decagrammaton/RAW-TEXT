[translation]
10011090-1 = "제9화;[ruby=소녀]닌자[/ruby]의 철칙"
10011090-7 = "우에에엥- 전부 엉망이 되어버렸슴다!"
10011090-8 = "히죽히죽 교수의 작전이고 뭐고, 이게 뭐냐고!"
10011090-14 = "냐하핫~ 모두 힘내고 있나요~?"
10011090-15 = "추격전은 갈수록 격화일로~"
10011090-16 = "과연 그 끝은 어찌 될 것인가~! 점점 더 기대되는 걸요~!"
10011090-21 = "또…… 저렇게 잘난 듯이 방송이나 해대고……!"
10011090-22 = "처음부터…… 교류회를 곤란하게 만들어서, 이쪽의 요구를 받아들이게 한다는 생각 자체부터가 물러 터졌어!"
10011090-23 = "이렇게 된 거……! 직접 찾아가서 총탄을 처먹여주겠어!"
10011090-24 = "지금부터 직접 음양부 부장이 있는 곳으로 쳐들어간다……!"
10011090-25 = "뭐, 뭣?! 진짜로?!"
10011090-26 = "네! 그래야 우리 리더임다!"
10011090-31 = "저기! 망량즈가 저기 있어요!"
10011090-34 = "저 녀석들?! 탱크까지 끌고 오잖아?!"
10011090-35 = "어, 어쩌면 좋슴까?!"
10011090-39 = "……이대로 성문 앞의 다리를 폭탄으로 끊는다"
10011090-41 = "우하하! 좋지! 그거!"
10011090-42 = "폭발임다!"
10011090-49 = "바, 방금 폭발은?!"
10011090-50 = "저, 저 녀석들……! 저 너머로 건너가는 다리를 폭탄으로 부쉈잖아?! 제정신인가?!"
10011090-51 = "와아앗! 이즈나- 이런 거, 드라마에서 본 적 있어요! 추격전의 왕도-라는 거군요! 닌닌!"
10011090-55 = "[ns] \"왕도인지 아닌지는 모르겠지만…… 이로하, 이제 어쩌지?!\""
10011090-56 = "하! 다리를 끊어, 이쪽의 추격을 방해하겠다. 이건가요?"
10011090-57 = "그거참 물러 터졌네요!"
10011090-58 = "으, 으으응?!"
10011090-59 = "선생님, 그리고 다른 분들도 꽉 잡아주세요."
10011090-60 = "[s] \"뭐, 뭘 하려고?!\""
10011090-78 = "어차피 뛰어넘으면 되는 거리는, 고작 무너진 다리 분의 분량만큼."
10011090-79 = "이 정도라면 충분히 가능해요."
10011090-84 = "충분히 가능할 리가 없잖아-!"
10011090-87 = "필요한 것은 속도-"
10011090-88 = "그렇다면 포신을 뒤로 돌려, 발포와 동시에 그 충격으로 날아간다!"
10011090-89 = "네! 그 작전이에요!"
10011090-92 = "괜찮은 거야?! 정말 그런 걸로 괜찮은 거야?!"
10011090-95 = "네, 충분히 가능해요. 영화에서 봤으니까!"
10011090-96 = "자아! 여기서부턴 기합이라고요……!!"
10011090-102 = "우와아아악?!"
