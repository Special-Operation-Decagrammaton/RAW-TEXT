[translation]
10009055-3 = "……남은 건, 이제 단 한 발자국."
10009055-4 = "아아, 기다려주세요. 제 손으로, 직접 당신께……."
10009055-8 = "……!!"
10009055-13 = "거기까지입니다."
10009055-14 = "……당신은, 그때 선생님 곁에 있던……."
10009055-15 = "무엇 때문에 선생님을 노리고 있는지는 모르겠지만, 선생님께선 안전한 장소에 계십니다."
10009055-16 = "당신이라는 화근, 응급 상황이 찾아오기 전에 미리 배제하겠습니다."
10009055-17 = "후후훗, 그런가요. 그렇게 말씀하신다 이거군요."
10009055-18 = "쓸데없는 저항은 소용없습니다. 이미-"
10009055-22 = "여기 있다! 놓치지 않는다! 재액의 여우!"
10009055-27 = "후욱후욱, 도망은 여기까지다."
10009055-28 = "와카모! 진짜, 진짜, 진짜 놓치지 않을 테다!"
10009055-29 = "애당초 여기서 더 큰일이 났다간, 학점이 위험하다고……!"
10009055-31 = "수, 수, 수수수순순히 투항하세요!"
10009055-35 = "으에엑……. 히, 힘들어……."
10009055-37 = "체크메이트, 라고 해두지요."
10009055-38 = "……과연, 좋습니다."
10009055-39 = "후후훗. 어차피 남은 건 고작 한 걸음."
10009055-40 = "……?"
10009055-44 = "고작 한 걸음뿐."
10009055-51 = "도, 도망치려고 한다!"
10009055-52 = "자, 잡아!"
10009055-62 = "……해서, 다행히 늦지 않게 또 붙잡을 수 있었어!"
10009055-63 = "어째 이번엔 좀 더 저항이 격렬했던 것 같지만요……."
10009055-64 = "……하지만 마지막에 그녀가 했던 말은."
10009055-65 = "[s] \"세나?\""
10009055-66 = "아뇨. 아무것도 아닙니다."
10009055-67 = "그보다……. 이때까지 전부 포함해 다섯 번째 탈출이라니, 외람된 말씀입니다만."
10009055-68 = "혹시 발키리 경찰학교의 경비 능력은 생각보다-"
10009055-70 = "응, 단언컨대 명백하게 기준 미달이야. 보안 의식이 낮아도 너무 낮아."
10009055-71 = "[s] \"치히로!\""
10009055-72 = "안녕, 선생님. 지금 막 축제 현장 전반의 보안 시큐리티 점검을 끝내고 오는 길이야."
10009055-73 = "생각보다 재회가 빨라졌네. 설마 내가 자리를 비운 사이에 상황이 이렇게까지 몰릴지, 전혀 예상하지 못했지만……."
10009055-74 = "일단 축제 현장의 보안은 이슈가 없다……라는 것이 우리 베리타스의 결론이지만."
10009055-75 = "막상 가장 문제가 되는 곳이 이번 치안 유지의 핵심 담당인 발키리 학교 쪽이었을 줄이야."
10009055-76 = "거기 정말 괜찮은 거야?"
10009055-77 = "[s] \"신랄해! 말 한마디 한마디가 정론이라 아파!\""
10009055-79 = "으악! 반론할 말이 없어!"
10009055-80 = "그, 그래도 말이지!"
10009055-81 = "네! 이, 이젠 진짜 다르니까요!"
10009055-82 = "방금 사태를 기점으로 경비국장님도 특단의 대책을 내린다고 하셨고!"
10009055-83 = "[s] \"특단의 대책이라니?\""
10009055-84 = "으음, 그게. 와카모가 계속해서 탈옥을 반복하니까. 경비국장의 얼굴도 완전히 새파래졌거든."
10009055-85 = "이대로 우리만으로는 역부족이란 걸 인정하고, 다른 학교의 치안 조직과 연계 작전을 생각하고 있는 모양이야."
10009055-86 = "마침 그렇지 않아도 이전에 재액의 여우가 탈옥했을 때, 선생님과 함께 대응에 나서 주셨던 분들과 연락이 닿았어요."
10009055-87 = "[s] \"아, 그 말은 혹시…….\""
10009055-94 = "네, 그런고로 소식을 듣고 왔어요. 선생님."
10009055-95 = "하필이면 오늘같이 발렌타인 데이의 열기로 뜨거운 시기에, 재액의 여우가 다시 나타나서 행패를 부리다니……."
10009055-96 = "모두가 함께 즐기는 소동을 망치려는 건, 절대로 용납할 수 없으니까요."
10009055-98 = "재액의 여우와 교전했던 경험은 얼마 되지 않지만, 그것만으로도 도움이 될 수 있다면 저희 선도부 측도 얼마든지 협력하겠습니다. 선생님."
10009055-99 = "……뭐, 그렇게 되는군요. 치나츠 씨."
10009055-100 = "네, 어디까지나 축제를 지키기 위해."
10009055-101 = "자자, 어쩐지 이렇게 넷이서 모이는 건, 꽤 오랜만인 것 같은데……."
10009055-102 = "하여간 저희가 협력할 테니, 한시름 놓으셔도 괜찮다구요?"
10009055-103 = "[s] \"응, 모두 고마워.\""
10009055-105 = "네!"
10009055-106 = "경비 규모가 지금까지 보다 더욱더 커질 테니! 물 샐 틈 하나 없는 철통 경비로 재액의 여우를 붙잡아두겠습니다!"
10009055-107 = "우리만 믿으라고!"
10009055-109 = "……혹시 모르니 나도 저쪽의 시큐리티 상태를 살펴보기에 합류할게."
10009055-110 = "내버려 두면 괜히 걱정이 되니까."
10009055-111 = "[s] \"치히로가 협력해 주면 유우카도 든든할 거야!\""
10009055-112 = "네? 아, 베리타스 부부장의 협력, 인가요?"
10009055-113 = "네, 선생님 말대로 그렇게 해준다면 엄청 믿음직스러……."
10009055-114 = "선생님 앞이라 들을 수 있는 세미나 회계의 아부라, 이건 또 나름의 맛이 있어서 나쁘지 않은걸."
10009055-115 = "좋아. 접수하겠어."
10009055-116 = "아, 아하하……. (빠직)"
10009055-120 = "그럼 가볼까?"
10009055-121 = "다녀올게. 선생님."
10009055-122 = "[s] \"모두 마지막까지 조금만 더 고생해 줘.\""
10009055-128 = "과연 이렇게나 다들 움직여준다면 이제는 정말로 안심할 수 있겠군요."
10009055-129 = "그럼, 남은 순찰을 계속하도록 하지요. 선생님."
10009055-130 = "[s] \"……응. 정말 그러게.\""
