[translation]
1004802-1 = "홀로 서기"
1004802-2 = "블랙마켓 거리"
1004802-4 = "(그렇게 사오리의 다소 심상치 않은 연락을 받고서, 블랙마켓을 찾아오게 되었다.)"
1004802-5 = "아, 선생. 도착했군."
1004802-6 = "[s1] \"앗, 사오리. 괜찮아?! 갑자기 연락이라니 깜짝 놀랐어!\"\n[s2] \"사오리가 직접 도움이 필요하다고 연락하다니 말이야…….\""
1004802-7 = "아, 그게 도움이 필요하다고 할지."
1004802-8 = "아, 그게 도움이 필요하다고 할지."
1004802-9 = "스스로 해결해보려고 했지만, 그게 불가능한 문제라고 할까."
1004802-10 = "[s] \"사오리가 직접 샬레에게 도움을 청할 정도의…… 그런 엄청난 문제인 거구나!\""
1004802-11 = "응? 아니, 그렇다기보다는……"
1004802-12 = "[s3] \"아니! 얼마나 심대하고 심각하고 중대한 문제라도 상관없어!\"\n[s4] \"사오리를 위해서라면 힘이 닿는 만큼 얼마든지 도울게!\""
1004802-13 = "아…… 응…… 그, 그래……"
1004802-14 = "아…… 응…… 그, 그래……"
1004802-18 = "그렇다면, 이쪽이다."
1004802-29 = "(사오리가 안내하는 대로 뒤를 따라 도착한 곳은 다름이 아니라…….)"
1004802-30 = "[s] \"응? 여기는…… 블랙마켓의 은행?\""
1004802-34 = "네! 어서 오세요. 손……"
1004802-38 = "켁! 아까 찾아왔던, 도통 말이 통하지 않는 그 정체불명의 아가씨!"
1004802-39 = "[s] \"으, 응? 정체불명……?\""
1004802-40 = "제가 몇 번이나 말씀드렸지 않았습니까! 안 되는 건 안 된다고!"
1004802-41 = "<신원 보증>이 되지 않는다면 절대로 이 이상 말씀하신 부분은 진행해드릴 수 없습니다!"
1004802-42 = "그래서 데려왔다. 내 신원을 보증해줄 사람을."
1004802-43 = "네? 갑자기 신원 보증을 해줄 사람을 데려왔다고 말씀하셔도……?"
1004802-47 = "응? 이 분은 혹시……."
1004802-48 = "그래. 구해왔다. 당신이 말했던 보증인을."
1004802-49 = "호오……."
1004802-50 = "[ns] \"……블랙마켓. ……신원 보증……? 헉?!\""
1004802-52 = "[ns5] \"……혹시 나, 엄청난 금융 범죄에 휘말리는 흐름인가?!\"\n[ns6] \"사오리! 믿었는데!\""
1004802-55 = "선생……? 무슨 소린지 모르겠다만."
1004802-57 = "(뒤늦게나마 대체 이게 어찌 된 일인지, 그 자초지종을 들을 수가 있었다.)"
1004802-60 = "[ns] \"전부, 통장 개설을 위해……?\""
1004802-61 = "네, 그쪽에 계신 아가씨께서 통장 개설을 하고 싶다며 당 점을 찾아와 주셨습니다만, 어째선지 학적조차 비밀로 하고 계신 탓에……."
1004802-62 = "애당초 키보토스에서 학적이 비밀이라니, 그래서야 아무것도 못 한다고요?"
1004802-63 = "[s] \"아, 그런 거라면, 나름의 이유가 있다고 할까. 복잡한 사정이 있다고 할까…….\""
1004802-64 = "다른 여타 평범한 은행이었다면 더는 볼 것도 없다고, 딱 잘라 거절하면서 쫓아내거나 했겠지만……!"
1004802-65 = "저희가 누구입니까?"
1004802-66 = "정당한 대가만 지불한다면 그 누구보다 공정하게 대우해드린다고 자신하는 블랙마켓!"
1004802-67 = "당신께 신용이 없더라도 괜찮습니다."
1004802-68 = "건장한 육체와 한 자루의 총만 가지고 있다면……."
1004802-69 = "이 블랙마켓에서 좋지는 않더라도, 싸구려 일자리 정도라면 얼마든지 찾아볼 수 있을 테니까요!"
1004802-70 = "[s] (반응하기 어려운 말이다…….)"
1004802-71 = "때문에 최소한의 신원을 보증해줄 사람, 무슨 일이 있더라도 책임을 져줄 희생……"
1004802-72 = "이 아니라, 사람을 데려만 와 주신다면 통장 개설도 OK! 라고 말씀드렸더니……"
1004802-73 = "[s] \"과연……. 기쁘긴 한데, 뭔가 살짝 신경 쓰이는 말이 들린 것 같은데…….\""
1004802-75 = "……미안해. 선생."
1004802-76 = "동료들과 헤어진 뒤로…… 이런 일에 내가 의지할 수 있는 건 당신 밖에……"
1004802-77 = "[s] \"그런데 사오리, 통장은 왜 만들려는 거야?\""
1004802-78 = "……최근에 여기 블랙마켓에 흘러 들어왔어."
1004802-79 = "그나마 앞으로도 내가 있을 수 있는 곳이라곤, 이런 뒷거리 정도일 테니까……."
1004802-80 = "그래서……. 이런 곳에서 생활해 나가기 위해선, 돈이 필요해. 그리고……"
1004802-81 = "저희 측에서 중개한 의뢰를 수행하고, 보수를 받기 위해선 통장이 필요하다고 말씀드렸지요."
1004802-82 = "[s] \"아, 그래서…….\""
1004802-83 = "……하지만, 이야기를 들어보니, 아무래도 내 억지였던 모양이야."
1004802-84 = "역시 이런 제멋대로의 이유로 당신을 끌어들이는 건, 당신도 곤란하겠지."
1004802-85 = "됐어. 이제까지 했던 이야기는 역시 없던 일로……."
1004802-86 = "[s] \"아니, 그런 문제라면 당연히 도와줘야지.\""
1004802-87 = "선생……?"
1004802-88 = "[s] \"무엇보다 사오리가 직접 먼저 말을 건네 줬다는 게 기쁜걸.\""
1004802-92 = "……그래."
1004802-94 = "[ns] \"자, 그러니! 어디 한 번 만들어보자고! 그 통장이란 걸!\""
1004802-97 = "그럼 지금부터 통장을 만들기 위한 간단한 심사를 시작하겠습니다~"
1004802-98 = "[s] \"보증인만 있으면 되는 게 아니었어?\""
1004802-99 = "아하하. 걱정하지 마시길."
1004802-100 = "심사라고는 해도 개설에 앞서 간단한 절차일 뿐입니다. 물론 하기 싫으시다면 없던 일로 해도 상관없습니다만."
1004802-101 = "나는 상관없어. 선생."
1004802-102 = "[s] \"사오리가 그렇다면야…….\""
1004802-103 = "네, 그럼 질문입니다~"
1004802-104 = "이곳에 오기 전에 혹시 어떤 직업을 가지고 계셨고, 어떤 업무 경험을 쌓아 오셨는지, 알려 주시겠습니까?"
1004802-105 = "이전 직업……?"
1004802-106 = "[s] \"아니아니, 잠깐. 그런 게 정말 필요한 정보야?!\""
1004802-107 = "네? 그야 손님께서 경험이 있고, 자신이 있는 분야가 무엇인지 말씀해주시면, 저희 쪽에서도 좀 더 어울리는 일거리를 주선해줄 수 있을 테니까요?"
1004802-108 = "무슨 문제라도?"
1004802-109 = "아니, 역시나 문제없어. 선생. 이런 질문이라면 얼마든지 답할 수 있어."
1004802-114 = "……자세히 설명할 수는 없지만, 이전엔 주로 폭파와 파괴, 학원의 전복을 계획하고 실행했다."
1004802-116 = "……?"
1004802-117 = "특히 일정 규모 이상의 조직을 무너트리는 건 내 특기이기도 하지."
1004802-118 = "……네?"
1004802-119 = "[s] \"사, 사오리?! 말이 좀?!\""
1004802-120 = "……응? 거짓말은 아니라고 생각하는데?"
1004802-121 = "[s] \"그야 그렇겠지만!\""
1004802-122 = "아, 크, 크흠! 그, 그것참. 유니크한 경력이로군요!"
1004802-123 = "네, 네에……. 그럼 다음 질문으로……."
1004802-127 = "혹시 지금 주거지가……."
1004802-128 = "주거지……"
1004802-129 = "특별히 주거지라고 할 만한 건 없다. 지금 머물고 있는 곳은 블랙마켓이고."
1004802-130 = "네?"
1004802-131 = "보다 정확히 말하자면, 폐건물이나 방치된 자동차, 지하도 같은 곳이지. 그때그때 바뀌거든."
1004802-135 = "……저기 이건 혹시, 일종의 유머 같은 걸까요?"
1004802-136 = "[s] \"어, 음! 그냥 그런 걸로!\""
1004802-137 = "그럼 다음은……."
1004802-139 = "(그렇게 얼마나 되는 질문과 답변을 거쳤을까.)"
1004802-142 = "자, 질문은 이상입니다."
1004802-143 = "[s] \"드, 드디어…….\""
1004802-145 = "그렇군."
1004802-146 = "그럼 이것으로 통장 개설은 문제없이……"
1004802-147 = "아,"
1004802-148 = "그리고 마지막으로 가장 중요한……"
1004802-150 = "실력 테스트가 남아있습니다."
1004802-154 = "[ns] \"어?! 말이 달라지지 않았어? 간단한 심사라며?\""
1004802-155 = "하하, 보증은 보증이고, 그와 별개로 이곳은 블랙마켓……."
1004802-156 = "아무리 그래도 아무 조건 없이 무작정 통장을 만들어드릴 수야 없는 노릇 아니겠습니까?"
1004802-157 = "게다가 이 테스트 또한 어디까지나 고객님을 위한 서비스의 일환입니다."
1004802-158 = "추후 혹시 모를 사태에 대비해, 어느 정도 실력을 지녔는지 알게 된다면. 최소한의 <상환능력>을 보장하는 것이니까요. 그만큼 혜택도 늘어난다고요?"
1004802-159 = "[s] \"그야말로 블랙마켓…… 하지만 역시 이렇게까지는…….\""
1004802-161 = "……여기까지 선생에게 도움을 받았는데, 이제 와서 물러서지는 않아."
1004802-162 = "좋아, 얼마든지 받아주겠어. 그 실력 테스트."
1004802-163 = "아하하! 좋군요!"
1004802-172 = "테스트는 간단합니다."
1004802-173 = "저희 블랙마켓 가드들을 상대로 얼마나 버틸 수 있는가!"
1004802-174 = "버티는 시간이 길수록 높은 등급을 부여하고, 서비스 등급 또한 올라가니, 부디 전력을 다해주시길!"
1004802-175 = "그럼 준비되셨나요?"
1004802-180 = "……."
1004802-182 = "테스트, 시작!"
1004802-183 = "……!"
1004802-201 = "[ns] \"역시 굉장하네…….\""
1004802-202 = "…………헉?"
1004802-207 = "이 정도면 됐나?"
1004802-208 = "어, 어, 엄청난 실력자……!"
1004802-209 = "핫?! 아, 아뇨! 통장 개설은…… 부, 불가합니다!"
1004802-210 = "……뭐?"
1004802-211 = "어떻게든 통장을 개설하고 싶다면,"
1004802-212 = "그, 그래!"
1004802-217 = "저희 블랙마켓 은행의 전속 시큐리티가 되어주신다면……!"
1004802-218 = "[s] \"아니, 저기요?!!\""
1004802-224 = "히, 히이익?!"
1004802-226 = "……이해했어. 말이 계속 바뀌는 걸 보니 우릴 속인 거군?"
1004802-227 = "시간 낭비한 건가."
1004802-228 = "뭐, 그래도 교훈을 얻었으니까."
1004802-229 = "바, 바, 바로 만들어드리겠습니다아~~~!"
1004802-240 = "(통장 개설을 마치고 사오리와 은행을 빠져나오는 길…….)"
1004802-241 = "[s] \"고생했어. 사오리.\""
1004802-242 = "아니, 난 그다지……"
1004802-243 = "오히려 선생이야말로 괜한 일에 엮이게 해서……."
1004802-244 = "[s7] \"으응, 아냐. 난 괜찮아.\"\n[s8] \"그보다 봤다시피 블랙마켓에선 이렇게 왕왕 말이 바뀌기도 한단 말이지.\""
1004802-245 = "……블랙마켓의 악명은 미리 들어서 알고 있다고 생각했지만."
1004802-246 = "……블랙마켓의 악명은 미리 들어서 알고 있다고 생각했지만."
1004802-247 = "정말 그렇군."
1004802-248 = "[s] \"세상 밖은 위험한 곳이야. 그러니까.\""
1004802-249 = "……그러니까?"
1004802-250 = "[s] \"앞으로도 조심해야 해. 사오리.\""
1004802-254 = "……."
1004802-255 = "……이번에 신세 진 건, 나중에 반드시 갚겠어. 선생."
1004802-256 = "그럼……"
1004802-260 = "[ns] \"……별일 없었으면 좋겠는데.\""
