10055030-136 = "มาโคโตะจังก็คงไม่ได้รู้สึกผิดจริงๆ ส่วนอิโรฮะเองที่ได้ฟังคำขอโทษแบบขอไปทีก็คงจะดูออกเหมือนกัน#nนั่นแหละ"
