[translation]
10055030-1 = "第3話;我存在的理由，船是為了啟航"
10055030-3 = "[log]漂 流  第 6 天[/log]"
10055030-6 = "別讓我一再重複。"
10055030-7 = "不需要什麼對策。再過不久，格黑娜的救援隊就會趕到了。"
10055030-8 = "你也差不多該面對現實了吧。"
10055030-9 = "都快一週了，別說是救援船，我們連一艘路過的船都沒看到耶。"
10055030-10 = "關於這點，本大人正好心裡有數。"
10055030-11 = "這肯定是風紀委員會那群傢伙搞的鬼！"
10055030-12 = "尤其是空崎陽奈，他是個心思縝密的人。#n說不定他早已掌握我們遇難的事實，甚至連我們的位置都知道了。"
10055030-13 = "然後在暗中阻撓搜索，不讓搜救隊找到我們所在的位置吧。"
10055030-14 = "壓迫與控制……那正是那群傢伙的專長。"
10055030-15 = "不過，那也撐不了多久。格黑娜越是被壓迫，反彈就會越強烈。#n現在其他學生應該也差不多開始察覺了。"
10055030-16 = "格黑娜真正需要的領袖究竟是誰！#n是卑鄙的暴君空崎陽奈，還是我羽沼真琴大人！？"
10055030-17 = "接下來就勢如破竹了！#n學生們會自行將礙事的風紀委員會一網打盡，前來拯救我們吧！嘰嘻嘻！"
10055030-18 = ""
10055030-20 = ""
10055030-21 = "……真琴前輩，你知道現在這艘船上還剩多少物資嗎？"
10055030-22 = "當然不知道。"
10055030-23 = "那你應該也不知道我們還能撐多久吧？"
10055030-24 = "不知道。說白了，本大人根本沒興趣。"
10055030-25 = "況且管理那些雞毛蒜皮的小事，本來就是你的工作吧，伊呂波。"
10055030-26 = ""
10055030-28 = ""
10055030-29 = "啊啊，真琴前輩……在這個節骨眼說這種話有點……"
10055030-30 = "雞毛蒜皮……？"
10055030-31 = ""
10055030-32 = "啊嗚嗚……伊呂波醬……"
10055030-33 = ""
10055030-35 = ""
10055030-36 = "……啊，老師。"
10055030-37 = "那個，不知道該說是來得正好，還是來得不是時候……"
10055030-38 = "[s1] 「怎麼了？」\n[s2] 「好像有點吵……」"
10055030-41 = "那個，該怎麼說呢……"
10055030-42 = "既然看起來那麼簡單，那真琴前輩自己來做不就好了？"
10055030-43 = "愚蠢的問題。本大人還有更重要的事要做。"
10055030-44 = "重要的事？你說重要的事！？"
10055030-45 = "糟了……！"
10055030-46 = "[s3] 「發生什麼事了？」\n[s4] 「你們兩個在吵架嗎？」"
10055030-49 = "那個，他們兩個……不對，正確來說是伊呂波醬……"
10055030-50 = "老師應該也知道，伊呂波醬比較重視隱私和個人空間之類的吧？"
10055030-51 = "可是，大概是因為好幾天都一直擠在狹小的船上一起生活……"
10055030-52 = "他好像累積了一點壓力……"
10055030-53 = "要是平常的話，伊呂波醬反而會嫌吵架麻煩而避開才對……"
10055030-54 = ""
10055030-56 = ""
10055030-57 = ""
10055030-58 = "……"
10055030-59 = "怎麼？有話想說就給本大人說清楚。"
10055030-60 = "算了。"
10055030-61 = "反正我本來就沒抱什麼期待。#n只要沒有期待，自然也不會失望了。"
10055030-62 = "難道你是想說，我真琴大人做的事有問題嗎？"
10055030-63 = "當然有啊。一直都有，現在也一樣。"
10055030-64 = ""
10055030-66 = ""
10055030-67 = "這艘船上又不是只有我們，老師和伊吹醬也在啊。"
10055030-68 = "萬一出了什麼差錯，你打算怎麼辦？"
10055030-69 = "愚蠢的問題。本大人做的事怎麼可能會出差錯？"
10055030-70 = "所以我才說，現在就已經變成那樣了啊！"
10055030-71 = ""
10055030-73 = ""
10055030-74 = "對不起，我太大聲了。"
10055030-75 = "……我去看看伊吹。"
10055030-76 = ""
10055030-78 = ""
10055030-79 = ""
10055030-80 = "真難得呢，那個伊呂波居然會對真琴醬大吼。"
10055030-81 = "啊，皐月前輩……"
10055030-82 = "所以接下來要怎麼辦呢，真琴醬？"
10055030-83 = "這下有好一陣子都不好拜託伊呂波做事了吧？"
10055030-84 = "……哼。不必在意。"
10055030-85 = "反正要不了多久，伊呂波就會哭哭啼啼地來求本大人原諒了。"
10055030-86 = "在那之前，由我們來做就行了。"
10055030-87 = "伊呂波平常做的那些事？真的沒問題嗎？"
10055030-88 = "哎～說白了也只是一個人就能做得來的簡單工作。"
10055030-89 = "況且還是由我真琴大人親自出手，簡直易如反掌。"
10055030-90 = "是嗎？好吧，既然真琴醬都這麼說了……"
10055030-91 = ""
10055030-93 = ""
10055030-94 = ""
10055030-95 = "……伊呂波醬。"
10055030-98 = "[log]漂 流  第 7 天[/log]"
10055030-101 = ""
10055030-102 = ""
10055030-103 = ""
10055030-104 = "水……水……！"
10055030-105 = ""
10055030-107 = ""
10055030-109 = "[ns5] 「真琴！！！振作一點，真琴～！！！」\n[ns6] 「怎麼會發生這種悲劇……！！！」"
10055030-112 = ""
10055030-113 = "沒想到才一個晚上，狀況就惡化成這樣……"
10055030-114 = "千秋，和伊呂波交涉得怎麼樣了？"
10055030-115 = "啊，關於那件事……"
10055030-117 = ""
10055030-118 = ""
10055030-119 = ""
10055030-120 = "原來如此……所以派了千秋來說服我嗎？"
10055030-121 = "不好意思，這次我絕對不會幫忙。"
10055030-122 = "除非真琴前輩先來向我道歉。"
10055030-123 = ""
10055030-124 = "什麼！？真琴醬怎麼可能會道歉啊！"
10055030-125 = "啊哈……果然皐月前輩也這麼認為吧？"
10055030-126 = "那孩子到底在想什麼啊。"
10055030-127 = ""
10055030-129 = ""
10055030-130 = "那個，要不要由皐月前輩去說服看看呢？"
10055030-131 = "嗯？是要我對伊呂波施加催眠，強迫他聽話嗎？#n那倒不是不行……"
10055030-132 = "不，不是啦！不是那邊！是真琴前輩那邊！"
10055030-133 = "雖然我不太清楚，但兩位的關係很特別吧？#n所以我在想，能不能請你讓他回心轉意……"
10055030-134 = "這個嘛……"
10055030-135 = "假如我說服了真琴醬，或者用催眠的方式讓他向伊呂波道歉，#n你覺得所有事情就能圓滿解決嗎？"
10055030-136 = "這樣真琴醬不會打從心裡感到抱歉，被迫接受道歉的伊呂波也會察覺到這點吧？"
10055030-137 = "這……"
10055030-138 = "……完全被你說中了呢。#n對不起，還是當我沒說過吧。"
10055030-139 = "如果有簡單的解決辦法，我也很樂意幫忙。"
10055030-140 = "但現在根本找不到合適的解決辦法。#n在真琴醬或伊呂波冷靜下來之前，也只能由我們自己想辦法撐下去了。"
10055030-141 = "總之……先把真琴醬帶過來吧。順便也把正在跟他一起玩的老師帶過來。"
10055030-142 = "啊哈哈，我倒是覺得老師不是在玩啦。"
10055030-144 = "唔……！為什麼身為萬魔殿議長的本大人，得去弄什麼魚……！"
10055030-145 = ""
10055030-148 = "哇啊！"
10055030-149 = "啊啊，魚跑掉了！皐月前輩！"
10055030-150 = "呀，呀啊！怎麼辦！好噁心！真，真琴醬！"
10055030-151 = "救救我，老師！不對，請救救我，老師！"
10055030-152 = ""
10055030-158 = ""
10055030-159 = "……"
10055030-160 = "……那個，伊呂波前輩。"
10055030-161 = "啊，對不起。我剛才在想事情。"
10055030-162 = "……一直待在裡面，很無聊吧？"
10055030-163 = "不會啊。伊吹跟伊呂波前輩在一起很開心。"
10055030-164 = "那真是太好了。"
10055030-165 = "可是，伊呂波前輩看起來不怎麼開心。"
10055030-166 = "我嗎？"
10055030-167 = "……怎麼會呢。"
10055030-169 = "沒有總是添麻煩的前輩，也沒有累人的雜務，還能像這樣跟伊吹待在一起……"
10055030-170 = "……我怎麼可能會不開心呢。"
10055030-175 = ""
10055030-176 = "…………"
10055030-177 = ""
10055030-179 = ""
10055030-180 = ""
10055030-181 = ""
10055030-182 = "…………"
10055030-183 = "我吃飽了。"
10055030-184 = ""
10055030-186 = ""
10055030-187 = ""
10055030-188 = "……"
10055030-189 = "伊呂波醬該不會就這樣退出萬魔殿了吧？"
10055030-190 = "……隨他高興吧。"
10055030-191 = "命令他不就好了？叫他別走。"
10055030-192 = "伊呂波本來就討厭改變，光是這樣就足以當作理由了吧？"
10055030-193 = "不……唯獨這點不行。"
10055030-194 = "侍奉真琴大人之人，無論是誰都必須出於自願。#n唯獨這點，本大人絕不退讓。"
10055030-195 = "要是我仗著權威壓抑他人的自由意志，那格黑娜跟那時候又有什麼兩樣？"
10055030-196 = "……說的也是呢。"
10055030-197 = "好吧，就照真琴醬想做的去做吧。不過要是需要我的催眠，隨時跟我說。"
10055030-198 = "只要讓對方真心相信自己是自願追隨，那就跟自由意志沒什麼兩樣了。"
10055030-199 = "不，沒有那個必要。想離開的人就讓他離開。本大人沒什麼好說的了。"
10055030-200 = "……嘖，伊呂波那傢伙。"
10055030-201 = "為了那點小事，到底要鬧彆扭到什麼時候……"
10055030-203 = ""
10055030-204 = "……唉。"
10055030-205 = "我到底想做什麼啊……"
10055030-206 = "[ns7] 「伊呂波。」\n[ns8] 「找你好久了。」"
10055030-209 = "……老師。"
10055030-210 = "又在隨口亂說了吧？#n在這麼小的船上是能跑到哪裡去，哪需要找多久啊。"
10055030-211 = ""
10055030-213 = ""
10055030-214 = "我知道你想說什麼。"
10055030-215 = "[s9] 「你看穿我的想法了……！？」\n[s10] 「無念無想……！」"
10055030-218 = "啊哈哈，那是什麼啊。"
10055030-219 = "……"
10055030-220 = "果然老師也覺得應該由我先道歉吧？"
10055030-221 = "畢竟對方可是那個真琴前輩……"
10055030-222 = "他不可能先道歉……而且最重要的是……"
10055030-223 = "……"
10055030-224 = "總之，只有我先道歉，事情才能有所進展吧。"
10055030-225 = "可是……"
10055030-226 = ""
10055030-228 = ""
10055030-229 = "唉～～～～～～"
10055030-230 = "跟平常比起來，這根本不是什麼值得生氣的事，我為什麼會那麼火大呢……"
10055030-231 = "弄得我都搞不清楚自己為什麼還留在萬魔殿了。"
10055030-232 = ""
10055030-234 = ""
10055030-235 = "……咦？"
10055030-236 = "我加入萬魔殿的理由是嗎？"
10055030-237 = "這個嘛……"
10055030-238 = "我已經想不太起來了。"
10055030-239 = "不過八成是很無聊的理由吧。#n像是加入學生會的話，學園生活搞不好會輕鬆一點……"
10055030-240 = "或者說不定能得到更好的評價……大概就是那種感覺。"
10055030-241 = "……在老師看來，我的動機果然很不單純吧？"
10055030-242 = "[s11] 「是嗎？大家都是一邊盤算一邊生活的啊。」\n[s12] 「不那樣做的人倒是確實很了不起。」"
10055030-245 = "老師總是這麼會說話呢。"
10055030-246 = "……對不起。我沒必要連老師都冷嘲熱諷的。"
10055030-247 = "可是實際加入之後，上面有真琴前輩拚命施壓，下面又問題不斷。"
10055030-248 = "有時候也會覺得當初根本不該加入。真的是做不下去了啦。"
10055030-249 = "唉～～～～～～"
10055030-250 = "真想就這樣一走了之。"
10055030-251 = "想離開嗎？"
10055030-252 = ""
10055030-255 = "咦？你剛才說什麼？"
10055030-256 = "你沒聽到嗎？好像有誰的聲音……"
10055030-258 = ""
10055030-261 = "怎，怎麼了！？"
10055030-262 = "老師，你沒事吧！？"
10055030-263 = "[s13] 「伊呂波你才是，沒事吧？」\n[s14] 「發生什麼事了？」"
10055030-266 = "好像有東西撞到船了。"
10055030-267 = "可是，剛才明明什麼都沒看到啊……"
10055030-268 = "說不定是撞上暗礁，或者卡到漂浮的垃圾堆了……"
10055030-271 = ""
10055030-272 = "怎麼可能……這是……"
10055030-273 = "幽靈船……？"
