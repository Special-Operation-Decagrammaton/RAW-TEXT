[translation]
10055030-1 = "第3話;私のいる理由、そして船は発つべく"
10055030-3 = "[log]漂 流  6 日 目[/log]"
10055030-6 = "何度も言わせるな。"
10055030-7 = "対策など不要。じきにゲヘナの救助隊が到着する。"
10055030-8 = "そろそろ現実を見たらどうなんですか？"
10055030-9 = "1週間が経とうとしてるのに、救助船どころか一隻も船を見てないじゃないですか。"
10055030-10 = "ちょうど、それに関して思い当たる節がある。"
10055030-11 = "これは間違いなく風紀委員の仕業だ！"
10055030-12 = "委員長の空崎ヒナは用意周到だからな。我々が遭難したという事実、そしてもしかしたら現在位置までも把握しているのかもしれない。"
10055030-13 = "そして、我々の居場所までたどり着けないよう、捜索活動を邪魔しているのだろう。"
10055030-14 = "抑圧と統制……それが奴らの特技だからな。"
10055030-15 = "しかし、それも長くは続かないだろう。#nゲヘナは抑圧されればされるほど、より強く反発する。いまごろ他の生徒も感づき始めたころではないか？"
10055030-16 = "果たして、ゲヘナに必要なリーダーは一体誰なのか？#n卑劣な暴君、空崎ヒナ？もしくは羽沼マコト様？"
10055030-17 = "民衆は破竹の勢いで風紀委員を撃沈させ、我々の救出へと乗り出すだろう！キシシッ！"
10055030-21 = "……マコト先輩、今この船に残ってる物資の量を把握されていますか？"
10055030-22 = "知るわけないだろう。"
10055030-23 = "じゃあ、私たちがあと何日保つかも分かりませんよね？"
10055030-24 = "ああ。そもそも興味がない。"
10055030-25 = "そういった、くだらないものを管理するのが、お前の仕事だろう？イロハ。"
10055030-29 = "あ……えっと、マコト先輩……#n今の発言はちょっと……。"
10055030-30 = "くだらない……？"
10055030-32 = "あう……イロハちゃん……。"
10055030-36 = "……あっ！先生。"
10055030-37 = "ちょうどよかったというか、そうじゃないというか……。"
10055030-38 = "[s1] \"どうしたの？\"\n[s2] \"なんか騒がしいけど……。\""
10055030-41 = "えっと、なんというか……。"
10055030-42 = "そういうならマコト先輩がやればいいんじゃないですか？"
10055030-43 = "愚問だ。私にはもっと重要な仕事がある。"
10055030-44 = "重要……？重要な仕事って何ですか？"
10055030-45 = "ああっ……！"
10055030-46 = "[s3] \"何があったの？\"\n[s4] \"ケンカしちゃった？\""
10055030-49 = "いや二人は……いや、正確にはイロハちゃんが……。"
10055030-50 = "先生もご存じだとは思いますが……イロハちゃんってほら、プライバシーとかパーソナルスペースを大事にするじゃないですか。"
10055030-51 = "なのに何日も、小さな船の中でずっと一緒だったから……。"
10055030-52 = "ちょっとストレスが溜まっちゃったみたいで……。"
10055030-53 = "いつもならケンカする方が面倒だからって、避けるはずなのに……。"
10055030-58 = "……。"
10055030-59 = "何だ？言いたいことがあるなら言えばいいだろう。"
10055030-60 = "もういいです。"
10055030-61 = "そもそも期待していないので。#n期待しなければ、落胆することもありませんし。"
10055030-62 = "ふむ……このマコト様の行動に問題があるとでも言いたいのか？"
10055030-63 = "はい。いつもありますし、今もそうです。"
10055030-67 = "この船にいるのは私だけじゃないんです。#n先生とイブキもいます。"
10055030-68 = "万が一のことがあったらどうするつもりなんですか？"
10055030-69 = "愚問だな。この私が居るのだ、万が一などない。"
10055030-70 = "だから今！そうなってるって言ってるんですよ！"
10055030-74 = "すみません、声が大きすぎました。"
10055030-75 = "……ちょっとイブキを見てきます。"
10055030-80 = "珍しいわね、イロハがマコトちゃんに怒鳴るなんて。"
10055030-81 = "あ、サツキ先輩……。"
10055030-82 = "で、どうするのマコトちゃん？"
10055030-83 = "しばらくイロハに何も頼めないわよ？"
10055030-84 = "……ふん、気にすることはない。"
10055030-85 = "放っておけば泣きながら謝罪に来るだろう。"
10055030-86 = "それまで我々がやればいい。"
10055030-87 = "イロハがやってたことを？できるのかしら。"
10055030-88 = "今までイロハ一人でできていたのだ。できないわけがない。"
10055030-89 = "このマコト様の手にかかれば一瞬だ。"
10055030-90 = "そう？まあマコトちゃんがそう言うなら……。"
10055030-95 = "……イロハちゃん。"
10055030-98 = "[log]漂 流  7 日 目[/log]"
10055030-104 = "みっ……みずぅ……！"
10055030-109 = "[ns5] \"マコト！！気をしっかり！マコトぉ――っ！！\"\n[ns6] \"ど、どうしてこんなことに……！！！\""
10055030-113 = "一晩でこんなに状況が悪化するなんてね……。"
10055030-114 = "チアキ、イロハとの交渉は？"
10055030-115 = "あっ、それは……。"
10055030-120 = "なるほど、私の説得にチアキを送ってきたんですね。"
10055030-121 = "申し訳ないですが、絶対やりません。"
10055030-122 = "マコト先輩から謝ってこない限り、絶対。"
10055030-124 = "えぇっ！？マコトちゃんが謝るわけないじゃない！"
10055030-125 = "あはは……やっぱサツキ先輩もそう思いますよね？"
10055030-126 = "イロハ、一体何を考えているのかしら……。"
10055030-130 = "あの、サツキ先輩が説得してみるのはどうでしょう？"
10055030-131 = "私が？イロハに催眠でもかければいいの？#nまあ、構わないけど……。"
10055030-132 = "ち、違いますっ！そっちじゃなくて、マコト先輩の方です！"
10055030-133 = "詳しくは分かりませんが、お二人は昔からの付き合いって聞きました。#nだから、その……なんとかできませんか……？"
10055030-134 = "そうねぇ……。"
10055030-135 = "でも、私がマコトちゃんを謝らせることに成功したとして……全部綺麗に片づくと思う？"
10055030-136 = "マコトちゃんが反省なんてするわけないし、形だけの謝罪でイロハが納得するかしら？"
10055030-137 = "それは……。"
10055030-138 = "……そうですよね。ごめんなさい、やっぱり聞かなかったことにしてください。"
10055030-139 = "簡単に解決するなら私だって手を貸すわ。"
10055030-140 = "でも、今は他にできることをすべきよ。#nマコトちゃんやイロハが落ち着くまで、私たちがなんとかしなきゃ。"
10055030-141 = "……まずはそうね、マコトちゃんを連れてきてもらえるかしら。#nあとは、暇そうにしてる先生もついでにね。"
10055030-142 = "あははっ、遊んでいるわけじゃないと思いますけどね。"
10055030-144 = "くっ……なぜ万魔殿の議長ともあろう私が、魚なんか……！"
10055030-148 = "うわあっ！？"
10055030-149 = "ああっ、魚が逃げましたサツキ先輩！"
10055030-150 = "きゃあっ！？ど、どうしようマコトちゃん！？気持ち悪いわ！！"
10055030-151 = "助けなさい先生！？いや、お願い先生！助けて頂戴！"
10055030-159 = "……。"
10055030-160 = "……イロハ先輩？"
10055030-161 = "あっ、すみません。ちょっと考え事を……。"
10055030-162 = "……ずっと中にいても、つまらないですよね。"
10055030-163 = "ううん。イブキ、イロハ先輩と一緒だから楽しいよ。"
10055030-164 = "それは、よかったです。"
10055030-165 = "でもイロハ先輩はあんまり楽しくなさそう。"
10055030-166 = "私が、ですか？"
10055030-167 = "……そんなはず。"
10055030-169 = "面倒な先輩もいなければ雑務もない。#nこうしてイブキと一緒にいるのに……。"
10055030-170 = "楽しくないわけ、ないじゃないですか。"
10055030-176 = "…………。"
10055030-182 = "…………。"
10055030-183 = "ごちそうさまでした。"
10055030-188 = "……。"
10055030-189 = "イロハちゃん、このまま万魔殿をやめてしまうんでしょうか。"
10055030-190 = "……好きにすればいい。"
10055030-191 = "命令すればいいんじゃない？#n行くなって。"
10055030-192 = "イロハは変化を好まないし、それで十分だと思うけど。"
10055030-193 = "いや――それだけはダメだ。"
10055030-194 = "このマコト様を敬う者は、誰であろうと自ら従うべきだ。#nそれだけは譲れない。"
10055030-195 = "私が権威を盾に自由意志を奪っては、あの頃のゲヘナと変わらんだろう？"
10055030-196 = "……それもそうね。"
10055030-197 = "いいわ、マコトちゃんの好きにして頂戴。#n私の催眠が必要になったら言うのよ。"
10055030-198 = "「従う」と本気で信じさせれば、それは自由意志と変わらないのだから。"
10055030-199 = "いいや、必要ない。去りたい者は去ればいい。#n私から言うことはない。"
10055030-200 = "……チッ、イロハのやつ。"
10055030-201 = "いつまで拗ねてるつもりだ……。"
10055030-204 = "……はぁ。"
10055030-205 = "私は一体何がしたいんだか。"
10055030-206 = "[ns7] \"イロハ。\"\n[ns8] \"探したよ。\""
10055030-209 = "……先生。"
10055030-210 = "また適当なこと言って。#nこんな狭い船で、探し回る場所なんてないですよ。"
10055030-214 = "言いたいことは分かってます。"
10055030-215 = "[s9] \"私の考えが読まれた……！？\"\n[s10] \"無念無想……！\""
10055030-218 = "あははっ、何ですかそれ。"
10055030-219 = "……。"
10055030-220 = "やっぱり先生も、私が謝ったほうがいいと思ってます？"
10055030-221 = "相手は、あのマコト先輩ですし……。"
10055030-222 = "あの人が先に謝るわけないですから……それに。"
10055030-223 = "……。"
10055030-224 = "私が謝ってようやく、色々動き出すとは思いますし。"
10055030-225 = "……でも。"
10055030-229 = "はぁぁ…………。"
10055030-230 = "普段と比べたら、怒るようなことでもなかったのに……。"
10055030-231 = "私、どうして万魔殿にいるんでしょうか。"
10055030-235 = "……ん？"
10055030-236 = "「万魔殿に入った理由」ですか？"
10055030-237 = "さあ。"
10055030-238 = "あんまり思い出せないですね。"
10055030-239 = "たぶん、大した理由じゃないです。#n生徒会に入ったら、楽に過ごせるかなーって。"
10055030-240 = "周囲からの評価も上がるんじゃないかとか、そんなものかと。"
10055030-241 = "……先生から見ても、可愛げのない生徒ですかね。"
10055030-242 = "[s11] \"そうでもないよ。みんな計算しながら生きてると思うし。\"\n[s12] \"そうしない人がすごいだけで。\""
10055030-245 = "いつも口は上手いですよね。"
10055030-246 = "……すみません。先生にまでこんなことを言うつもりでは。"
10055030-247 = "でも、いざ万魔殿に入ってみたら……マコト先輩はあれこれうるさいし、次々と問題は起こるし。"
10055030-248 = "なんで入ったんだろうって思ったりもします。やってらんないですよ。"
10055030-249 = "はぁぁ…………。"
10055030-250 = "このまま、消えちゃいたい。"
10055030-251 = "旅に出たい？"
10055030-255 = "え、今なんと……？"
10055030-256 = "何か聞こえませんでした？#n誰かの声、が……。"
10055030-261 = "なっ、なんですか！？"
10055030-262 = "大丈夫ですか先生！？"
10055030-263 = "[s13] \"イロハこそ大丈夫？\"\n[s14] \"何が起きたんだろう？\""
10055030-266 = "船が何かとぶつかりました。"
10055030-267 = "でもさっきまで船影ひとつなかったのに……。"
10055030-268 = "岩礁に当たったのかもしれませんね……。"
10055030-272 = "ありえない……。"
10055030-273 = "……幽霊船？"
