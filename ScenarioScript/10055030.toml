10055030-6 = "อย่าให้เราต้องพูดเรื่องเดิมซ้ำๆ สิ"
10055030-7 = "ไม่ต้องหาทางออกอะไรหรอก อีกไม่นานเดี๋ยวหน่วยกู้ภัยของเกเฮนน่าก็มาแน่นอน"
10055030-8 = "ได้เวลามองสถานการณ์ตามความเป็นจริงบ้างแล้วนะคะ"
10055030-9 = "นี่ก็จะครบหนึ่งอาทิตย์แล้วนะคะ อย่าว่าแต่เรือกู้ภัยเลย เรายังไม่เห็นเรือผ่านมาสักลำเลยค่ะ"
10055030-10 = "ไม่ต้องบอกเรื่องนั้นเราก็รู้เหมือนกันนั่นละ"
10055030-11 = "ต้องเป็นแผนของพวกคณะกรรมการวินัยแน่ๆ!"
10055030-12 = "ยิ่งเป็นโซระซากิ ฮินะที่รอบคอบขนาดนั้นด้วยแล้ว อาจรู้แล้วก็ได้ว่าเรือของเราประสบอุบัติเหตุ#nเผลอๆ อาจรู้ด้วยซ้ำว่าเราอยู่ที่ไหน"
10055030-13 = "คงกำลังขัดขวางการค้นหา เพื่อไม่ให้ใครมาถึงจุดที่เราอยู่สินะ"
10055030-14 = "กดขี่และควบคุม เป็นเรื่องที่พวกนั้นถนัดอยู่แล้ว"
10055030-15 = "แต่ก็คงทำแบบนั้นได้อีกไม่นานหรอก เกเฮนน่าน่ะยิ่งถูกกดขี่มากเท่าไร ก็ยิ่งต่อต้านหนักขึ้นเท่านั้น ป่านนี้พวกนักเรียนก็คงเริ่มรู้ตัวกันแล้วละ"
10055030-16 = "ใครกันแน่คือผู้นำที่เกเฮนน่าต้องการอย่างแท้จริง! โซระซากิ ฮินะ จอมเผด็จการผู้ต่ำช้า หรือท่านฮานุมะ มาโคโตะผู้นี้?"
10055030-17 = "จากนั้นทุกอย่างก็จะราบรื่นเอง! พวกนักเรียนจะจัดการคณะกรรมการวินัยที่คอยขัดขวางให้ราบคาบ แล้วก็มาช่วยพวกเรายังไงล่ะ! คิกคิกคิก!"
10055030-18 = ""
10055030-20 = ""
10055030-21 = "รุ่นพี่มาโคโตะรู้มั้ยคะว่าตอนนี้บนเรือเหลือเสบียงอยู่เท่าไร...?"
10055030-22 = "ไม่รู้หรอก"
10055030-23 = "งั้นก็คงไม่รู้สินะคะว่าพวกเราจะอยู่ได้อีกนานแค่ไหน?"
10055030-24 = "ไม่รู้ พูดตรงๆ ก็คือเราไม่สนใจด้วย"
10055030-25 = "หน้าที่ดูแลเรื่องหยุมหยิมแบบนั้นมันเป็นงานของเธอตั้งแต่แรกอยู่แล้วไม่ใช่รึไง"
