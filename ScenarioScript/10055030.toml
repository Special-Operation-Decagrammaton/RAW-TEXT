[translation]
10055030-1 = "3화;내가 있는 이유, 배는 떠나기 위해"
10055030-3 = "[log]표 류  6 일 차[/log]"
10055030-6 = "몇 번이고 말하게 하지 마라."
10055030-7 = "대책은 필요 없다. 얼마 안 있으면, 게헨나의 구조대가 도착할 테니까."
10055030-8 = "슬슬 현실을 좀 보라고요."
10055030-9 = "일주일이 다 되어가는데 구조선은커녕 지나가는 배 한 척 보질 못했잖아요."
10055030-10 = "안 그래도 거기에 관해서는 집히는 점이 있지."
10055030-11 = "틀림없이 선도부 녀석들의 공작이다!"
10055030-12 = "특히나 소라사키 히나는 용의주도한 인물이니까. 우리가 난파당했다는 사실도, 어쩌면 그 위치도 이미 파악하고 있을지 모른다."
10055030-13 = "그렇게 우리가 있는 위치까지 도달하지 못하게, 탐색에 훼방을 놓고 있겠지."
10055030-14 = "억압과 통제. 녀석들의 특기니까."
10055030-15 = "하지만 그것도 금방이다. 게헨나는 억누르면 억누를수록, 더욱더 강하게 반발하지. 지금쯤 학생들도 깨닫고 있을 무렵이다."
10055030-16 = "과연 진정 게헨나에 필요한 리더는 누구인가! 비열한 압제자 소라사키 히나인가, 아니면 이 하누마 마코토 님이신가?!"
10055030-17 = "그 후로는 일사천리! 학생들 스스로 방해하는 선도부를 일망타진하고 우리를 구하러 올 테지! 키시싯!"
10055030-21 = "……마코토 선배, 지금 이 배에 물자가 얼마나 남았는지 알고 있나요?"
10055030-22 = "모른다."
10055030-23 = "그러면 우리가 얼마나 더 버틸 수 있는지도 모르겠네요?"
10055030-24 = "모른다. 단적으로 말해, 관심도 없다."
10055030-25 = "애초에 그런 시시콜콜한 것들을 관리하는 것이 바로 네 일이었을 텐데."
10055030-29 = "아아, 마코토 선배…… 지금 타이밍에 그 말은 조금……."
10055030-30 = "시시콜콜……?"
10055030-32 = "아으으…… 이로하 쨩……."
10055030-36 = "……아앗, 선생님."
10055030-37 = "저기, 좋은 타이밍이라 해야 할지, 안 좋은 타이밍이라 해야 할지……."
10055030-38 = "[s1] \"무슨 일이야?\"\n[s2] \"조금 소란스럽길래…….\""
10055030-41 = "그게, 뭐라고 할까……."
10055030-42 = "그렇게 쉬워 보이면 마코토 선배가 하면 되잖아요."
10055030-43 = "우문이군. 이 몸에게는 더 중요한 일이 있다."
10055030-44 = "중요한 일이요? 중요한 일이라고요?!"
10055030-45 = "이크……!"
10055030-46 = "[s3] \"어떻게 된 거야?\"\n[s4] \"둘이 싸우는 거야?\""
10055030-49 = "그게, 둘이, 아니, 정확히는 이로하 쨩이……."
10055030-50 = "선생님께서도 아시다시피, 이로하 쨩은 프라이버시나, 퍼스널 스페이스 같은 걸 좀 중시하잖아요?"
10055030-51 = "그런데, 며칠이고 좁은 배에서 계속 같이 생활하게 되어서 그런지……."
10055030-52 = "살짝, 스트레스가 쌓였나 봐요……."
10055030-53 = "원래 같았으면, 이런 말싸움 같은 거, 오히려 귀찮다면서 피할 텐데……."
10055030-58 = "……."
10055030-59 = "뭐냐, 하고 싶은 말이 있다면 똑바로 해라."
10055030-60 = "됐어요."
10055030-61 = "애초에 기대하지 않았고, 기대하지 않은 일에는 실망도 하지 않는 법이니까요."
10055030-62 = "설마 이 마코토 님이 하는 일에 문제가 있다는 건가?"
10055030-63 = "있잖아요. 항상 그랬고, 지금도 그렇고요."
10055030-67 = "이 배에는 저희만 있는 것도 아니고, 선생님이나 이부키 쨩도 타고 있잖아요."
10055030-68 = "만에 하나라도 잘못되면 어떻게 하려고요?"
10055030-69 = "우문이군. 이 몸이 하는 일이 잘못될 리가 없지 않나?"
10055030-70 = "그러니까, 지금 그렇게 되어 있잖아요!"
10055030-74 = "죄송해요. 목소리가 너무 높았네요."
10055030-75 = "……저는, 이부키를 보고 올게요."
10055030-80 = "별일이네? 그 이로하가 마코토 쨩한테 소리치다니."
10055030-81 = "아, 사츠키 선배……."
10055030-82 = "그래서 이제 어쩔거야, 마코토 쨩?"
10055030-83 = "한동안 이로하한테 이런저런 일 부탁하기 껄끄럽게 되어 버렸는데?"
10055030-84 = "……흥. 신경 꺼라."
10055030-85 = "어차피 얼마 안 지나, 먼저 울며불며 용서해 달라고 빌겠지."
10055030-86 = "그때까지만 우리가 하면 된다."
10055030-87 = "이로하가 하던 일들을? 할 수 있겠어?"
10055030-88 = "뭘~ 어차피 한 사람이 하던 간단한 일이다."
10055030-89 = "하물며 이 마코토 님이 한다면, 더욱이 수월하겠지."
10055030-90 = "그래? 그러려나? 마코토 쨩이 그렇다면야……."
10055030-95 = "……이로하 쨩."
10055030-98 = "[log]표 류  7 일 차[/log]"
10055030-104 = "물…… 무울……!"
10055030-109 = "[ns5] \"마코토!!! 정신 차려, 마코토오!!!\"\n[ns6] \"어째서 이런 비극이……!!!\""
10055030-113 = "하룻밤 사이에 이만큼 상황이 나빠질 줄이야……."
10055030-114 = "치아키, 이로하와의 교섭은?"
10055030-115 = "앗, 그거 말인데요……."
10055030-120 = "과연…… 저를 설득하라고 치아키를 보냈나요?"
10055030-121 = "미안하지만, 이번만큼은 절대 안 도울 거예요."
10055030-122 = "마코토 선배가 먼저 사과하러 오지 않으면요."
10055030-124 = "뭐?! 마코토 쨩이 사과 같은 걸 할 리가 없잖아!"
10055030-125 = "아핫…… 역시 사츠키 선배도 그렇게 생각하시죠?"
10055030-126 = "그 아이는 대체 무슨 생각이람."
10055030-130 = "저, 혹시, 사츠키 선배가 설득하는 수는 없을까요?"
10055030-131 = "응? 이로하한테 최면을 걸어서, 강제로 말을 듣게 만들까? 그것도 나쁘지는 않은데……."
10055030-132 = "아앗! 아니요! 그쪽이 아니라! 마코토 선배 쪽이요!"
10055030-133 = "잘은 모르지만, 두 분께서는 엄청 특별한 사이잖아요? 그러니까, 혹시 마음을 돌리거나 할 수는 없을까 하고……."
10055030-134 = "있잖아."
10055030-135 = "만약에 내가 마코토 쨩을 설득하든, 최면을 걸든, 이로하에게 사과하게 만들면 모든 일이 짠하고 해결될 거라 생각해?"
10055030-136 = "마코토 쨩도 진심으로 미안하다 생각하지 않을 테고, 억지 사과를 받는 이로하도 그 정도 눈치챌 텐데?"
10055030-137 = "그거는……."
10055030-138 = "……완전히, 정곡이네요. 죄송해요. 역시 없던 걸로 해주세요."
10055030-139 = "쉬운 해결책이 있다면, 나도 마다하지는 않아."
10055030-140 = "그렇지만 지금은, 해결책 자체가 마땅하질 않네. 마코토 쨩이든, 이로하든 제정신을 차릴 때까지 적당히 우리끼리 해 나가는 수밖에."
10055030-141 = "일단은, 그래. 마코토 쨩을 데려와줘. 덤으로 같이 놀고 있는 선생도 데려오고."
10055030-142 = "아하하, 놀고 있는 건, 아니라고 생각하지만요."
10055030-144 = "끄응……! 어째서 만마전 의장이신 이 몸이 생선 따위를……!"
10055030-148 = "으악!"
10055030-149 = "아앗, 물고기가 도망쳤어요! 사츠키 선배!"
10055030-150 = "꺄, 꺄악! 어떻게 해! 징그러워! 마, 마코토 쨩!"
10055030-151 = "도와줘, 선생! 아니, 도와주세요, 선생님!"
10055030-159 = "……."
10055030-160 = "……저기, 이로하 선배."
10055030-161 = "아, 죄송해요. 잠깐 딴생각을 했네요."
10055030-162 = "……혹시 안에만 있어서 지루한가요?"
10055030-163 = "으응, 아니. 이로하 선배랑 있는 건 즐거운걸."
10055030-164 = "그건, 다행이네요."
10055030-165 = "그치만, 이로하 선배는 별로 안 즐거워 보여."
10055030-166 = "제가요?"
10055030-167 = "……그럴 리가요."
10055030-169 = "항상 귀찮게 하는 선배도, 힘들기만 한 잡일도 없이, 이부키랑 함께 있는데요."
10055030-170 = "……즐겁지 않을 리 없잖아요."
10055030-176 = "…………."
10055030-182 = "…………."
10055030-183 = "잘 먹었습니다."
10055030-188 = "……."
10055030-189 = "이로하 쨩, 이대로 만마전 그만두는 걸까요?"
10055030-190 = "……그러고 싶다면, 그러겠지."
10055030-191 = "명령하면 되잖아. 가지 말라고."
10055030-192 = "이로하는 바뀌기 싫어하는 성격이라, 그걸로도 명분은 충분할걸?"
10055030-193 = "그건, 안 된다."
10055030-194 = "이 마코토 님을 섬기는 자라면, 누구나 스스로 원해서 따라야 한다. 그것만은 양보할 수 없다."
10055030-195 = "내가 권위를 앞세워 자유 의지를 억누르면, 게헨나는 그때와 뭐가 달라진 거지?"
10055030-196 = "……그것도, 그렇네."
10055030-197 = "좋아, 마코토 쨩이 하고 싶은 대로 해. 대신 언제라도 내 최면이 필요해지면 말해."
10055030-198 = "스스로 따른다고 진심으로 믿게 만든다면, 그건 이미 자유 의지와 다를 바 없으니까."
10055030-199 = "아니, 결코 필요 없다. 떠나고 싶은 자는 떠나게 둬라. 더 할 말은 없다."
10055030-200 = "……칫, 이로하 녀석."
10055030-201 = "고작 그깟 일로 언제까지 꿍해 있을 셈인지……."
10055030-204 = "……하아."
10055030-205 = "대체 나는 뭘 하고 싶은 건지."
10055030-206 = "[ns7] \"이로하.\"\n[ns8] \"한참 찾았어.\""
10055030-209 = "……선생님."
10055030-210 = "또 아무 말씀이나 하는 거죠? 애초에 이런 좁은 배 위에서, 가 봐야 어딜 간다고 한참 찾나요?"
10055030-214 = "무슨 말을 하시려는지, 알아요."
10055030-215 = "[s9] \"내 생각을 읽었다고……?!\"\n[s10] \"무념무심……!\""
10055030-218 = "하하, 뭐에요. 그게."
10055030-219 = "……."
10055030-220 = "역시, 선생님도 제가 먼저 사과해야 한다고 생각하시죠?"
10055030-221 = "상대가 그 마코토 선배니까……"
10055030-222 = "그 사람이 먼저 사과할 리도 없고…… 무엇보다……."
10055030-223 = "……."
10055030-224 = "하여튼, 제가 먼저 사과해야, 뭐든지 진행되겠죠."
10055030-225 = "그치만……."
10055030-229 = "하아아아아아아~…………."
10055030-230 = "평소에 비하면 그다지 화낼 일도 아니었는데, 왜 그렇게 욱했는지."
10055030-231 = "이럴 거면, 왜 만마전에 남아 있는지 모르겠네요."
10055030-235 = "……네?"
10055030-236 = "제가 만마전에 들어온 이유요?"
10055030-237 = "글쎄요."
10055030-238 = "잘 기억 안 나는데요."
10055030-239 = "보나마나 시답잖은 이유겠죠. 학생회 소속이면 학창 생활이 좀 더 편해지지 않을까……."
10055030-240 = "더 좋은 평가를 받을 수 있지 않을까……. 그런 느낌으로요."
10055030-241 = "……역시 선생님이 보시기에는, 의도가 불순하죠?"
10055030-242 = "[s11] \"글쎄? 다들 계산하면서 살아가는걸.\"\n[s12] \"그러지 않는 사람들이 대단한 거지.\""
10055030-245 = "항상 말씀은 잘하시네요."
10055030-246 = "……죄송합니다. 선생님 상대로까지 비아냥거릴 필요는 없었는데요."
10055030-247 = "근데 막상 들어와 보니 위에서는 마코토 선배가 엄청 쪼아대고, 아래서는 문제만 터지고."
10055030-248 = "괜히 들어왔다 싶기도 하고. 진짜 못 해 먹겠다니까요."
10055030-249 = "하아아아아아아~…………."
10055030-250 = "이대로 훌쩍 사라지고 싶다."
10055030-251 = "떠나고 싶어?"
10055030-255 = "네? 방금 뭐라고요?"
10055030-256 = "못 들으셨어요? 무슨 목소리 같은 게……."
10055030-261 = "무, 무슨 일이죠?!"
10055030-262 = "선생님, 괜찮으세요?!"
10055030-263 = "[s13] \"이로하야 말로 괜찮아?\"\n[s14] \"무슨 일이 일어난 거지?\""
10055030-266 = "뭔가, 배에 부딪혔어요."
10055030-267 = "그렇지만, 조금 전까지 아무것도 안 보였는데……."
10055030-268 = "어쩌면, 암초나 부유하는 쓰레기 더미에 걸린 걸지도……."
10055030-272 = "말도 안 돼…… 이건……."
10055030-273 = "유령, 선……?"
