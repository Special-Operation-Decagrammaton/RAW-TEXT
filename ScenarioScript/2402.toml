[translation]
2402-1 = "수행부의 홍보 영상을 찍자! 2"
2402-2 = "아아, 카메라 테스트. 카메라 테스트."
2402-3 = "하는 김에 마이크도 테스트~! 잘 보이고 들리나요~오?"
2402-4 = "자아, 그럼 소개를 시작할게!"
2402-7 = "여기는 수행부, 그것도 수행부의 부장이 주로 활동하는 백귀야행 렛서팬더강의 강변!"
2402-8 = "이곳을 찾은 이유는 바로……."
2402-9 = "여기가 우리 수행부의 부장! 츠바키 선배의 수행장소 중 하나이기 때문이야!"
2402-10 = "앗, 말하기 무섭게 찾았다!"
2402-13 = "쿠울……."
2402-15 = "소개하도록 하지!"
2402-16 = "카스가 츠바키 선배! 2학년! 16세! 수행부의 부장을 맡고 있는, 잠자는 공주야!"
2402-17 = "츠바키 선배가 얼마나 굉장하냐면……!"
2402-18 = "응?"
2402-20 = "앗, 이때 츠바키 선배의 곁으로 고양이가 한 마리가!"
2402-22 = "두 마리 째!"
2402-24 = "거기에 더해 강아지……. 토끼, 비둘기, 사슴 등등 다른 동물들까지?"
2402-25 = "계속해서 늘어난다~!"
2402-26 = "아마 모두가 츠바키 선배의 잠자는 모습에 반해서인 게 분명해!"
2402-27 = "쿠울."
2402-28 = "괴, 굉장해! 저렇게 많은 동물들이 모여드는데도, 흔들리지 않고 잠자는 저 자세!"
2402-29 = "한 점 흐트러지지 않는 저 모습이야말로, 멋진 레이디의 표본!"
2402-30 = "좋았어. 나도 질 수 없어!"
2402-31 = "멋진 레이디를 꿈꾸는 수행부의 귀여운 마스코트로서! 츠바키 선배를 따라 수행하는 거야!"
2402-32 = "그럼 살짝, 실례합니다아~"
2402-38 = "와아……."
2402-39 = "츠바키 선배가 누울 때마다 바라보는 풍경은, 이런 거구나."
2402-40 = "이런 풍경을 바라보면서 잠자기야말로……."
2402-41 = "과연……. 이게 멋진 레이디들이 하는 수행……."
2402-42 = "그럼 나도 눈을 감고 츠바키 선배처럼……."
2402-44 = "……."
2402-47 = "앗, 가, 간지러~"
2402-48 = "잠까안~ 그렇게 뺨을 핥지 마~ 잘 수가 없다구~!"
2402-49 = "으으음!"
2402-51 = "아, 진짜~!"
2402-52 = "자, 핥을 거면 여기 츠바키 선배가 있으니까!"
2402-56 = "으음……."
2402-57 = "음! 보람찬 수행이었다! 그럼 다음 소개로!"
2402-61 = "……쿠울?"
2402-63 = "자, 그럼 다음으로 소개할 건 우리 수행부의 부부장이자."
2402-64 = "아름다운 레이디의 표본인 미모리 선배야!"
2402-65 = "이 시간이라면 미모리 선배는 분명 저녁밥을 만들고 있을 텐데……."
2402-66 = "어머, 카에데 쨩? 무슨 일인가요?"
2402-67 = "미모리 선배!"
2402-68 = "그건, 카메라……인가요?"
2402-69 = "응! 수행부의 일상을 찍고 있어!"
2402-70 = "수행부의 일상을……?"
2402-71 = "잘은 모르겠지만, 이것도 카에데 쨩이 말한 수행의 일종인 거죠?"
2402-72 = "맞아! 이걸로 멋진 레이디가 되어서, 음양부를 쓰러트릴 거야!"
2402-73 = "네에……?"
2402-74 = "어쨌거나 수행 힘내요. 오늘 저녁은 카레니까."
2402-75 = "저녁 때까지 늦지 않게 동아리실로 돌아와야 한답니다?"
2402-76 = "응!"
2402-78 = "봤지? 미모리 선배는 수행부의 부부장으로, 우리 밥은 물론 많은 걸 챙겨주고 있어!"
2402-79 = "미모리 선배의 꿈은 멋진 요조숙녀! 그걸 위해 수행하고 있대!"
2402-80 = "미모리 선배 또한 츠바키 선배에 지지 않을 만큼 멋진 레이디……."
2402-81 = "나도 지고 있을 순 없어. 미모리 선배처럼 되려면, 미모리 선배와 같은 수행을 해야만……."
2402-82 = "아! 좋은 생각이 났다!"
2402-85 = "이게 미모리 선배가 만들고 있는 카레! 냄새, 짱이다!"
2402-86 = "잠깐 숟가락으로 한 입만…….후루룩, 챱챱."
2402-88 = "!! 맛있어!"
2402-89 = "하지만 미모리 선배가 만들어준 요리를 받아먹기만 해서야, 선배처럼 될 수 없어!"
2402-90 = "그러니, 카메라 너머의 여러분! 잘 보고 있어!"
2402-91 = "나도 미모리 선배처럼 되기 위해, 카레에 어레인지를 가하는 거야!"
2402-92 = "지금도 맛있는 카레지만, 내 힘으로 더욱 맛있게 만들면……!"
2402-94 = "카에데 쨩! 굉장해요! 제 카레가 200%나 더 맛있어 질 줄이야!"
2402-95 = "카에데- 굉장해. 한 그릇 더 줘-"
2402-97 = "우힛, 우히히힛."
2402-98 = "음, 내가 보기에 카레는 무척 맛있지만. 약간 단 맛이 부족한 거 같아!"
2402-99 = "그러니 설탕을 조금 더 넣고."
2402-103 = "앗, 설탕 뚜껑이?! 왕창 넣어버렸다!"
2402-104 = "어, 어쩌지 이걸!"
2402-105 = "아!"
2402-106 = "단맛을 중화시키려면……. 짠맛을 더 넣으면 될 거야!"
2402-107 = "보통 카드 게임에서도 대미지는 그렇게 상쇄되니까!"
2402-108 = "여기에 소금을 좀 더……!"
2402-110 = "응! 됐다! 뿌듯해!"
2402-111 = "이걸로 미모리 선배와 같은 수행도 끝!"
2402-113 = "그렇게 해서, 홍보 영상! 전부 찍었어! 선생님!"
2402-114 = "여기에 수행부의 전부를, 그 진수를 담았어!"
2402-115 = "[s] \"그래?\""
2402-116 = "이것만 투고하면 수행부의 우승도 확실…… 확정! 멋진 레이디 데뷔야!"
2402-117 = "헉?! 하지만 이걸 공개했다가 엄청난 인기를 끈 나머지……."
2402-118 = "새로운 입부희망자가 마구마구 쇄도하면 어떡하지?!"
2402-119 = "으으음……! 그럼 어쩔 수 없네! 결정! 그 후배들을 직접 이끌어주는 멋진 레이디 선배가 될 수밖에! 이히힛!"
2402-120 = "[s1] \"다 좋은데 말이야.\"\n[s2] \"카에데, 뒤에.\""
2402-121 = "응? 뒤? 왜애?"
2402-122 = "응? 뒤? 왜애?"
2402-125 = "(축축끈적찝찝)고양이…… 강아지……. 할짝할짝 지옥의 연쇄……."
2402-127 = "카.에.데~~"
2402-130 = "카에데 쨩. 동아리실 부엌의 카레에 손을 댄 거, 카에데 쨩이죠?"
2402-132 = "자, 여기 앉아요. 저, 약간 진심으로 화났으니까요."
2402-133 = "저, 저건 츠바키 선배와 미모리 선배가 진짜 화났을 때 짓는 표정!"
2402-134 = "이대로 있다간 지옥의 설교 5시간 풀코스……!"
2402-135 = "히, 히잉. 도, 도와줘. 선생님~!"
2402-136 = "[s] \"자업자득입니다.\""
2402-138 = "으, 으아앙~!"
2402-140 = "(그렇게 수행부의 설교지옥이 시작되었다.)"
2402-141 = "수행부의 홍보 영상을 찍자!"
