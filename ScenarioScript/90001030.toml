[translation]
90001030-1 = "제3화;두 번째"
90001030-4 = "빙해에 남겨진 흔적을 제법 오래 추적 중입니다만, 특별한 징후는 보이지 않는군요."
90001030-5 = "잠시 상황을 정리하고, 의문점들을 고찰해 보도록 할까요?"
90001030-6 = "에이미. 화면을 출력해 주세요."
90001030-7 = "알았어, 부장."
90001030-15 = "우리의 행동은 크게 세 단계로 분류할 수 있었죠. 게부라와 교전했고, 이 흔적을 발견했고, 그 뒤를 추적하고 있어요."
90001030-16 = "하지만 기본적으로 게부라가 이곳에서 뭘 하고 있었는지에 대해서는, 알아낼 수 없었어요."
90001030-17 = "지금까지도 보통 비슷하지 않았어? 물론 군수 공장이었던 헤세드나, 폐허 수몰 지구를 지키고 있었던 케테르는 조금 예외였던 것 같지만."
90001030-18 = "그런 상황에서 데카그라마톤의 엔지니어를 자칭하는 세 명과 만났고, 그 아이들은 우리를 공격하려 했습니다."
90001030-19 = "맞아요. 하지만 제가 조금 더 신경 쓰이는 점이 있다면, 그 아이들이 <이름 없는 신들의 힘>에 대해 언급했다는 것이에요."
90001030-20 = "정확히는 '그 금지된 기술'이라고 표현했지만."
90001030-21 = "저의 무장, 아비 에슈흐에 그 힘이 사용되었다는 점 역시 한 번에 파악했지요."
90001030-22 = "네. 기본적으로 데카그라마톤과 이름 없는 신들의 힘 사이에는 아무 관계성도 없었어요."
90001030-23 = "한 때 둘 사이에 어떤 연관점이 있지 않을까 생각해 보았지만, 결국 아니었죠."
90001030-25 = "그들이 어째서 우리를 이곳까지 불러들였는지는 모르겠지만…… 그 <언니>라는 존재를 완성시키는 데 저희의 존재가 필요했다는 거겠죠."
90001030-26 = "필요했던 게 저희 중 누구였는지는 알 수 없지만……"
90001030-27 = "무명사제와 이름 없는 신들의 기술이 반영되어 있는 <아비 에슈흐>였는지,"
90001030-28 = "아니면 총학생회장이 남긴 오파츠 <싯딤의 상자>였는지……."
90001030-29 = "[s] \"…….\""
90001030-30 = "그것도 아니면 초천재병약미소녀인 저 아케보시 히마리의 <전지>의 두려운 힘이었는지……."
90001030-31 = "(그거 가짜잖아.)"
90001030-33 = "여기서부터는 저의 가설이지만요."
90001030-34 = "그 아이들, 자신들을 아인, 소프, 오르라고 소개한 엔지니어들이 우리를 빙해로 불러낸 이유가, 그 <언니>라는 존재를 완성시키기 위해서였다고 가정한다면……."
90001030-35 = "그 아이들이 가장 필요로 했던 것은, 아무래도 아비 에슈흐에 관한 정보라고 추측할 수 있을 것 같아요."
90001030-36 = "과연, 그렇군요."
90001030-37 = "[s] \"아비 에슈흐의 정보라니?\""
90001030-38 = "간단한 가정입니다. 선생님."
90001030-39 = "그녀들은 이미 <이름 없는 신들의 힘>의 실체를 알고 있었던 것이었겠죠."
90001030-40 = "그렇다면 그다음으로 필요하다고 생각되는 과정은………"
90001030-41 = "그래요. <알고 있는 지식이, 어느 정도의 의미를 지니는가에 대한 데이터 실증>……."
90001030-42 = "그 말은, 우리와의 전투를 통해 아비 에슈흐가 가진 능력이나 전투 정보 따위를 계속해서 관측하려고 했다는 뜻이야?"
90001030-43 = "[s] \"그러면, 여태까지 이어졌던 전투들이, 설마…….\""
90001030-48 = "네, 맞아요. 전부 그 아이들의 노림수…… 라는 이야기가 되겠죠."
90001030-49 = "물론 그러한 <관측>을 통해 무얼 얻고자 했는가. 까지는 여전히 오리무중이에요."
90001030-50 = "그렇게 따진다면, 애당초 지금 나누는 이야기 자체가 어디까지나 전부 가정 하의 가정일 뿐, 진실이라고 단언하기 어려운 것도 있고……."
90001030-51 = "다만 히마리 부장의 말씀대로라면, 게부라가 이제껏 지연전을 펼치려고 했던 이유도 설명할 수 있습니다."
90001030-52 = "으음~ 게부라도 게부라지만, 거기에 더해, 새롭게 눈앞에 등장한 또 다른 예언자란 건가~"
90001030-53 = "여기서 흔적을 드러냈다는 건, 이 예언자도 뭔가 목적을 가지고서 빙해를 표류하고 있다는 뜻이겠지?"
90001030-54 = "그렇게 되겠지요."
90001030-55 = "어떻게 생겼을지 궁금해지는군요."
90001030-56 = "저 역시 누구보다도 그걸 알고 싶습니다만, 지금으로서는 단서가 없군요."
90001030-57 = "단지…… 빙해에 남겨진 이 흔적의 규모를 고려했을 때, 예상외의 크기를 가지고 있을 것이라는 것."
90001030-58 = "그리고 상당히 오랜 시간 동안…… 자력으로 움직일 수 있는 예언자라는 것 정도만을 추측할 수 있을까요."
90001030-59 = "이름 없는 신들의 힘과 게부라, 데카그라마톤의 엔지니어, 그리고 또 새롭게 나타난 예언자가 빙해에서 꾸미는 음모, 라……."
90001030-60 = "[s] \"늘어놓고 보니, 뭔가 불길한 느낌만 드네…….\""
90001030-61 = "그들은 대체 무엇을 노리고 있는가……."
90001030-62 = "여전히 저희들 눈에는 보이지 않는, 좀 더 커다란 무언가가 숨겨져 있을 것이……."
90001030-74 = "뭐, 뭐뭐뭐뭐, 뭐죠? 갑자기?!"
90001030-75 = "갑자기 대공 사격이 시작됐어……! 이대로 비행하는 건 위험해 보이는데. 부장?"
90001030-76 = "거기에 기류 역시 호의적이지 않습니다. 선생님?"
90001030-77 = "[s] \"긴급 착륙!\""
90001030-78 = "예. 긴급 착륙, 실행합니다."
90001030-90 = "……포위당했군요."
90001030-91 = "돌파할게. 토키?"
90001030-92 = "네. 맡겨 주십시오."
90001030-107 = "계속 몰려오네. 이것도 전투 정보를 얻기 위해서야?"
90001030-108 = "아뇨! 이건……!"
90001030-112 = "(흔적을 추적한 끝에 조우한 것은, 마치 기다리고 있었다는 듯한 데카그라마톤의 병력 다수…….)"
90001030-113 = "(설마, 이건 계획된 함정이었다는 것일까요? 그도 아니면…….)"
90001030-118 = "응? 적 병력, 갑자기 물러나기 시작했어."
90001030-126 = "전력의 열세를 인정하고 스스로 포위를 푼 것이었다면 좋겠지만…… 그렇게 보이지는 않습니다. 그보다는……."
90001030-130 = "?!"
90001030-131 = "이것은…… 설마?!"
90001030-139 = "부장! 지하 15m 아래에서–"
90001030-140 = "게부라! 이런 곳에 있었던 건가요?!"
