[translation]
10023030-1 = "제3화;시계가 없는 심장"
10023030-2 = "<자애의 괴도>라는 게 뭐야?"
10023030-3 = "<자애의 괴도>는…… 그 무시무시한 일곱 죄수 중 하나인, 어떤 도둑의 이명입니다."
10023030-4 = "[s1] \"일곱 죄수……?!\"\n[s2] \"와카모처럼……?\""
10023030-5 = "그렇습니다. 와카모가 나타나는 곳 어디든 폭발과 폭연을 몰고 다니는 것으로 유명하다면."
10023030-6 = "그렇습니다. 와카모가 나타나는 곳 어디든 폭발과 폭연을 몰고 다니는 것으로 유명하다면."
10023030-7 = "<자애의 괴도>는…… 원하는 것이라면 무엇이든 훔치고 만다는 소문으로 유명하지요."
10023030-9 = "그러니까 도둑이 스스로를 괴도라고 말하고 다닌다는 거야? 완전 웃겨! 그리고 이름 센스 이상해!"
10023030-10 = "언니……"
10023030-11 = "으, 으음……! 이것은 또 신선한 반응……"
10023030-12 = "하지만 <자애의 괴도>의 전적은 무시할 수 있는 것이 아닙니다. 예고한 물건은 무슨 일이 있어도 반드시 훔쳐 가는 것으로 특히 유명하죠."
10023030-13 = "예고장이 워낙 난해한 내용으로 쓰여 있어서, 범행이 일어난 다음에야 그 물건을 노리고 있었다는 것을 알게 되는 경우가 많아서 그런 것 같기도 합니다만."
10023030-17 = "그렇군요! 퀘스트 내용 갱신입니다. <자애의 괴도>와의 대결입니다! 뽜밤뽜밤!"
10023030-18 = "그 예고장…… 저희도 볼 수…… 있을까요?"
10023030-19 = "그렇지 않아도 보여드리려 했습니다."
10023030-20 = "여기, 예고장입니다."
10023030-22 = "하루에 스물두 번 마주하는 두 나그네"
10023030-24 = "정확한 둘. 헤아릴 수 없는 스물. 그리고 반걸음"
10023030-26 = "달이 닿지 않는 자리, 멈춘 춤사위와 안티키테라의 뒤편."
10023030-28 = "한 번도 수여된 적 없는, 호사스럽지만 불우한 검을 위해 찾아 뵙겠습니다."
10023030-31 = "이건…… 도대체?"
10023030-35 = "예. <자애의 괴도>의 예고장입니다. 이 예고장을 해석하는 것부터 큰일이어서……"
10023030-36 = "이래 놓고 나중에 자신은 정정당당하게 예고장을 보냈다, 자신의 범행은 일반적인 절도와 다르다고 소문을 내곤 하니, 기가 찰 노릇입니다."
10023030-37 = "첫 줄부터 문제죠. 하루에 스물두 번 마주하는 두 나그네라니, 도대체 무엇일까요?"
10023030-41 = "어딘가엔 그런 사람들도 있는 거 아닐까? 하루에 스무 번씩 만나는……"
10023030-42 = "무슨 소리야. 잠도 안 자고 만난다는 거야? 하루에 스물두 번이라는 거, 생각해 보면 말도 안 되는 숫자라고."
10023030-44 = "아리스, 알았습니다! 이 나그네분들은 NPC인 겁니다. 일일 퀘스트 NPC라면 하루에 스무 번이 아니라 그 이상도 만날 수 있습니다!"
10023030-45 = "아리스 쨩…… 현실에 일일 퀘스트 NPC는 없어……"
10023030-47 = "그렇지 않습니다! 유즈는 현실에 존재하는 일일 퀘스트 NPC입니다! 특정한 장소에 가면 만날 수 있고, 말을 걸 수 있고, 퀘스트를 줍니다!"
10023030-49 = "우우우…… 완전히 아니라고만은 할 수 없다는 게 슬퍼……"
10023030-53 = "[ns] \"하루에 스물두 번이면, 평균적으로 한 시간에 한 번꼴이겠네……\""
10023030-54 = "하루는 24시간이니까 두 시간이 비는 겁니다……"
10023030-55 = "시간…… 시간……?"
10023030-56 = "저, 메이타로 씨. 여기에 혹시 아날로그식 시계 있나요……?"
10023030-57 = "예? 그야…… 홀 한가운데에 제법 커다란 아날로그 벽시계가 있기는 합니다만……"
10023030-58 = "잠시…… 그 시계를 볼 수 있을까요……?"
10023030-59 = "네. 그야 문제없습니다. 그런데 시계는 무엇 때문에……?"
10023030-60 = "유즈 쨩? 뭔가 알아냈어?"
10023030-62 = "내 생각이 맞다면…… 이 예고장은……"
10023030-64 = "역시……!"
10023030-65 = "왜, 왜 그래. 유즈? 지금 몇 시인지 궁금했어? 그런 건 휴대폰 화면만 봐도 되잖아."
10023030-66 = "아니야, 모모이. 휴대폰…… 디지털시계로는 알 수 없어."
10023030-67 = "그리고 지금…… 첫 번째 줄과 두 번째 줄 중간까지는 해석한 것 같아……!"
10023030-69 = "!!!"
10023030-70 = "어떻게? 어떻게? 혼자만 알고 있지 말고!"
10023030-72 = "'하루에 스물두 번 마주하는 두 나그네'라는 것은…… 아마도, 아날로그 시계의 시침과 분침을 뜻하는 것일 거야."
10023030-73 = "하지만 유즈, 하루는 스물네 시간입니다."
10023030-74 = "그렇기 때문이야. 아리스 쨩. 시곗바늘은 11번씩 두 번…… 하루에 22번밖에 겹치지 않아."
10023030-75 = "시침은 분당 0.5도를 이동하고, 분침은 분당 6도씩 이동하니까…… 12시에만 두 번 정각에 겹치고, 나머지 20번은 애매한 시각에 겹치지."
10023030-76 = "11시에서 12시 사이에는 겹치는 시각이 아예 없으니까……"
10023030-78 = "오오, 대단합니다! 과연 C&C군요. 그렇다면 나머지 예고장의 의미는 또 무엇일까요?"
10023030-82 = "'그리고 반걸음. 달이 닿지 않는 자리, 멈춘 춤사위와 안티키테라의 뒤편.'"
10023030-83 = "'한 번도 수여된 적 없는, 호사스럽지만 불우한 검을 위해 찾아 뵙겠습니다.' 지?"
10023030-84 = "반걸음, 반걸음…… 내 생각에는 이 부분까지도 시간을 의미하는 것 같아."
10023030-85 = "시간…… 반걸음이 무슨 시간……"
10023030-86 = "아! 혹시 30분쯤을 뜻하는 건가?!"
10023030-87 = "유즈 쨩. 시곗바늘이 겹치는 시간 중에 30분 전후가 되는 때, 구할 수 있어?"
10023030-89 = "5시 27분쯤부터 7시 38분쯤 사이…… 일까?"
10023030-90 = "그렇다면 괴도는 그 시간에 침입하겠군요?"
10023030-91 = "'달이 닿지 않는 자리, 멈춘 춤사위와 안티키테라의 뒤편'…… 이건 무슨 의미지?"
10023030-96 = "안티키테라…… 안티키테라……"
10023030-97 = "으흠?!"
10023030-98 = "뭔가, 짐작 가는 것이라도 있으세요?"
10023030-99 = "아, 아뇨! 안티키테라의 뒤편이라니, 정말로 뜬금없군요. 그렇지만 '수여된 적 없는 호사스럽지만 불우한 검'에 대해서는 짐작이 갑니다."
10023030-100 = "아마도…… 모레 전시될 미술품 중 하나이겠지요."
10023030-101 = "바로 이것입니다."
10023030-106 = "이 그림은 무엇입니까?"
10023030-107 = "기사를 서임하는 그림입니다. 기사 서임에는 검을 쓰는 것이 관례였다고 하지요."
10023030-108 = "그림에 그려진 검이라면, 수여될 수 없는 것이 당연하지 않겠습니까?"
10023030-109 = "그림은 보통 실재하지 않는 것을 그려낸 것이니까요."
10023030-111 = "듣고 보니, 그럴듯한데?"
10023030-112 = "……"
10023030-114 = "마침 이 그림은 경매에 올려질 귀한 그림이어서, 찾는 분들이 많을 겁니다."
10023030-115 = "그런 그림을 훔쳐가겠다고 이런 식으로 예고하다니…… 여러분들의 안목이 없었다면 눈 뜨고 당할 뻔했군요."
10023030-116 = "그러면 여러분들은 이 그림을 지키는 데 전력을 다해 주시기 바랍니다."
10023030-117 = "어? 다른 예술품들이나 그림들은 괜찮아?"
10023030-118 = "네! 이미 예고장의 비밀은 풀린 것이나 다름없으니까요! 멍청한 자애의 괴도 같으니……"
10023030-119 = "이렇게 유능하고 뛰어난 C&C 여러분들이, 이 자리에 와 주셨을 줄은 꿈에도 몰랐겠죠!"
10023030-120 = "아하하, 그, 그런가?"
10023030-121 = "하지만……"
10023030-125 = "도, 도움이 되었다니…… 다행이에요……"
10023030-126 = "퀘스트의 비밀이 풀리고 있습니다! 다음은 그림을 지키는 것이군요!"
10023030-130 = "그리고 여러분께…… 그렇군요. 추가로 부탁드리고 싶은 일이 생겼습니다."
10023030-131 = "네?"
10023030-132 = "내일부터 3일간, 이 저택의 보안을 지켜 주실 수 있겠습니까?"
10023030-133 = "하지만…… 예고장의 해석이…… 틀렸다면요?"
10023030-134 = "물론 괴도가 다른 것을 노릴 수도 있겠지요. 그렇지만 그 경우에는 여러분께서 직접 괴도를 막아 주시면 될 일 아닐까요?"
10023030-135 = "<자애의 괴도>는 신출귀몰하기로 유명하지만, C&C의 명성에 비하면 아무것도 아닐 테니까요. 그렇지 않습니까? 하하하."
10023030-136 = "꼭 좀 부탁드립니다. 보상은 섭섭지 않게 해 드리지요."
10023030-137 = "이 정도면 어떻겠습니까?"
10023030-141 = "!!!???"
10023030-143 = "(괘, 괜찮은 건가? 이 정도 금액을 보수로 받는다고……?)"
10023030-144 = "(모두에게 최신형 플라이 스테이션 프로 7에…… ZBOX시리즈 Z까지! 한 사람당 두 대씩 사 줘도 남을 정도잖아!)"
10023030-145 = "(어, 어떡하지? 미도리?!)"
10023030-146 = "(자꾸 나한테 묻지 마!)"
10023030-148 = "[ns] (다들 당황했네…… 뭔가 해야겠는데.)"
10023030-150 = "[ns] \"잠시…… 저희끼리 이야기를 좀 나누고 싶습니다만, 괜찮을까요?\""
10023030-151 = "네? 아, 그렇군요. 작전 회의라도 열고 싶으신 모양이군요. 알겠습니다."
10023030-155 = "하아아아아…… 고마워, 선생님. 긴장 때문에 죽는 줄 알았어."
10023030-156 = "어, 어떡하죠, 선생님? 일곱 죄수라니, 점점 더 저희가 감당할 수 없는 일이 되어 버려서……."
10023030-157 = "돌아가고 싶어…… 캐비닛…… 마음의 고향으로……"
10023030-158 = "? 어째서 모두들 이런 반응인가요……? 아리스, 뭔가를 잘못 알고 있는 것입니까?"
10023030-159 = "[s3] \"우선 문제의 범위를 줄여 보자. 이 일을 계속해야 할까?\"\n[s4] \"아니면 사실대로 이야기하고 그만둬야 할까?\""
10023030-160 = "……그만두고 싶다고 솔직하게 말씀드리면, 어떻게 되는 걸까요……?"
10023030-161 = "……그만두고 싶다고 솔직하게 말씀드리면, 어떻게 되는 걸까요……?"
10023030-162 = "아마도…… 의뢰인분은 정식으로 항의할 거야. 게임개발부와 C&C, 그리고 어쩌면 밀레니엄 전체에까지도."
10023030-163 = "그, 그렇게 되면 네루 선배에게 엄청 혼…나겠지?"
10023030-164 = "상상도 하고 싶지 않아……"
10023030-166 = "하지만 모모이! 이건 저희들에게 주어진 퀘스트입니다! 한 번 수락한 퀘스트는 책임감을 가지고 해야 한다고 모모이가 말했잖아요?"
10023030-167 = "그런데 도망쳐도 되는 건가요……?"
10023030-168 = "아, 아리스! 무, 물론 그 말도 맞긴 한데……!"
10023030-169 = "하지만…… 우리가 정말 이런 걸 할 수 있을 리가……."
10023030-170 = "[s] \"때로는 말이야. 퀘스트를 거스르는 것도 필요할지도 몰라.\""
10023030-171 = "선생님?"
10023030-172 = "무슨…… 말씀이시죠?"
10023030-173 = "[s] \"우리가 해야 할 일은, 괴도와 싸운다거나 괴도를 잡는 게 아니야.\""
10023030-174 = "네? 그게 무슨 뜻이세요……?"
10023030-175 = "잠깐만! 나, 선생님이 무슨 말을 하려는지 알 것 같아."
10023030-176 = "생각해 봐. 그냥, 괴도에게 아무것도 빼앗기지 않으면 우리의 승리 아냐?"
10023030-179 = "!!!"
10023030-181 = "애초에 여기까지 와 버렸고, 선생님도 함께야. 더구나 방범시설도 대단하대!"
10023030-182 = "괴도와 싸우거나 물리치거나 잡을 필요는 없어. 단지 물건만을 지키면 되는 거야!"
10023030-183 = "확실히, 그 방법으로 간다면 가능성이 있을지도……"
10023030-184 = "우리는…… 이미, C&C와 겨뤄 본 경험도 있고, C&C와 함께…… 싸워 본 경험도 있어…… 그리고 그보다 더한 일도……"
10023030-185 = "그 경험을 이번에도 살릴 수 있다면, 어쩌면……"
10023030-186 = "[s] \"성공하면 보수를 받을 수 있을지도 몰라. 하지만 리스크는 있어.\""
10023030-187 = "(확실히, 그 보수만 있다면 우리 게임개발부의……)"
10023030-188 = "그러면, 결정된 거지?"
10023030-189 = "하아…… 괜찮을까, 우리들."
10023030-190 = "헹. 생각해 보라고. 나중에 네루 선배에게 실컷 생색내 줄 수 있는 기회잖아?"
10023030-191 = "보기에 따라서는, 그 C&C에게 빚을 하나 만들어 둘 수 있기도 하고!"
10023030-193 = "아리스, 할 수 있을 것 같습니다. 그리고 선생님과 함께라면 우리는 무적입니다!"
10023030-197 = "그렇군요. 잘 알겠습니다. 감사드립니다, 여러분."
10023030-198 = "그렇다면 앞서 말씀드린 대로 3일간, 이 집과 미술품들을 지켜 주셨으면 합니다."
10023030-199 = "왜 3일이죠?"
10023030-200 = "내일부터 사흘 동안, 이 저택에서 행사를 개최할 예정이거든요."
10023030-201 = "첫날은 게스트분들을 모으는 파티, 두 번째 날은 미술품 전시회. 그리고 마지막 날에 미술품 경매를 열 예정입니다."
10023030-202 = "……괴도가 그 3일 중 언젠가에…… 여기에 올 것이라는 거군요……"
10023030-203 = "그렇겠지요. 첫날은 파티장에서 접객을 도우시면서, 현장을 지켜 주시면 감사하겠습니다."
10023030-205 = "엑, 접객이라고……?"
10023030-206 = "그렇습니다. 일종의 정체 위장 겸 현장 체크라고 보시면 될 것 같습니다."
10023030-207 = "혹시 또 모릅니다만, 게스트 중에 괴도와 연관된 분이 계실지도 모르는 일이니까요."
10023030-209 = "(그 그림……)"
