[translation]
84303100300-6 = "아, 찾았네요. 여기 있었군요."
84303100300-7 = "무슨 일이 있는 건가요, 리오?"
84303100300-8 = "아니, 이쪽은 특별히 문제가 없어. 지금 연락한 건 내 나름대로 '의심스러운 곳'을 찾았기 때문이야."
84303100300-9 = "그건 피트니스 센터를 말하시는 건가요?"
84303100300-13 = "아니죠. 이런 상황에서의 당신이라면, 어딘가 추가로 찾아낸 곳이 있단 이야기겠군요."
84303100300-14 = "바로 그 말대로야. 그리고 그곳에는 유리조노 세이아, 당신이 가 주었으면 해."
84303100300-15 = "그렇군요. 이런 저라도 괜찮다면야, 그건 기쁜 일이겠습니다만……."
84303100300-19 = "아니, 그런 의미는 아니었어요. 당신은 괜한 오해를 할 수도 있을 거 같아서 미리 말씀드리는 거예요."
84303100300-20 = "고마워. 그 부분의 배려는 확실히 도움이 되네."
84303100300-21 = "아무튼 <게임개발부>로 향해줬으면 해. 계산대로라면, 조만간 그곳에서 무슨 일이 일어날 거야."
84303100300-22 = "알았어요. 지금 바로 가도록 하죠."
84303100300-26 = "……리오."
84303100300-27 = "응? 왜 그러지?"
84303100300-28 = "…………."
84303100300-29 = "……고마워요."
84303100300-33 = "……천만에."
84303100300-34 = "그럼 부탁하겠어, 유리조노 세이아."
