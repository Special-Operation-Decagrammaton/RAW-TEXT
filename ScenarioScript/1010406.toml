[translation]
1010406-1 = "주체와 대상의 문제"
1010406-2 = "샬레 오피스"
1010406-5 = "[ns] \"미안해, 레이죠!\""
1010406-6 = "무, 무슨 일이신가요? 왜 그렇게 당황하시죠, 선생님?"
1010406-7 = "[s] \"그게, 그러니까…….\""
1010406-8 = "아, 갑작스럽게 외부 일정이 잡히셨다는 것이군요."
1010406-9 = "저를 혼자 내버려두게 될 것 같아서 신경이 쓰이신다고요……."
1010406-10 = "흐음……."
1010406-11 = "알겠습니다. 그러면 같이 나가시죠. 선생님."
1010406-12 = "[s] \"어? 같이?\""
1010406-13 = "그렇습니다. 저의 오늘 일정은 샬레의 당번 일을 수행하는 것."
1010406-14 = "그리고 샬레의 외부 일정을 진행하며 선생님과 함께하는 것도, 해석하기에 따라서는 당번 일의 연장이라고 볼 수 있지 않을까요?"
1010406-15 = "틀린 말 같지는 않으시다고요? 네. 그럴 겁니다. 그래야죠."
1010406-16 = "그러면 오늘 하루……."
1010406-17 = "잘 부탁드리겠습니다. 선생님."
1010406-29 = "[ns] \"으어어어……. 끝났다…….\""
1010406-30 = "고생 많으셨습니다. 선생님."
1010406-31 = "샬레의 업무란…… 정말로 다양하군요. 이 정도면 거의 손을 대지 않는 영역이 있을지, 의심이 갈 정도네요."
1010406-32 = "네? 본심을 말하자면 쳐낼 수 있는 업무는 최대한 쳐내고 싶지만, 또 막상 학생들의 일이 되면 그렇게 할 수는 없다고요?"
1010406-33 = "……."
1010406-34 = "무도(武道)라는 것에 대해 어떻게 생각하시나요, 선생님?"
1010406-35 = "네. 갑작스러운 이야기라는 것은 알고 있습니다. 당황하셨다면 죄송합니다."
1010406-36 = "저는 이렇게 생각합니다. 무도(武道)라는 것은 결국, 무술로 인해 자신을 돌아보고 나아갈 길을 닦는 것이라고요."
1010406-37 = "어떤 의미에서는 정신적인 면에서의 수양을, 신체의 단련으로 행하는 것이라고도 볼 수 있을 겁니다."
1010406-38 = "[s] \"그건 확실히 그런 것 같네.\""
1010406-39 = "그리고 무술의 길이란 어떤 의미에서, 강한 자가 약한 자를 지키고."
1010406-40 = "나아가 약한 자가 억눌리지 않도록 강한 자가 스스로의 소임을 다하는 것이라고도 생각합니다."
1010406-41 = "현룡문에서 그렇게 지겹도록 이야기하는 의(義)와 협(俠)이라는 개념과도 통하는 부분이 있을지도 모르겠네요."
1010406-42 = "[s] \"응. 그것도 확실히 그런 것 같네.\""
1010406-43 = "그러니까 말이죠, 선생님."
1010406-44 = "이제부터 선생님께서 저를 지켜 주시면 될 것 같습니다."
1010406-45 = "[s] \"응. 그것도 확실히 그런…… 뭐? 왜?!\""
1010406-46 = "그런…… 몸도 마음도 성숙한 교육자이신 선생님께서, 아직 미성숙하고 보살핌이 필요한 고등학생을 이대로 내버려두시다니……."
1010406-47 = "학생들의 일이 되면, 내버려둘 수 없다고 말씀하셨으면서……."
1010406-48 = "[s1] \"어?! 그건! 그러니까!\"\n[s2] \"물론 그럴 수는 없고! 그게 교육자의 자세도 아니긴 할 건데!\""
1010406-51 = "역시 그렇죠?"
1010406-52 = "그러면, 오늘은 선생님께서 저를 지켜 주시는 날이 되겠군요."
1010406-54 = "엉? 거기 너, 뭐야! 블링블링파 녀석 아냐? 여긴 우리 구역이라고! 썩 꺼져!"
1010406-59 = "누가 시끄럽게 떠드나 싶더니, 몰캉몰캉파 잔챙이였잖아. 한물간 자식들이 뭐 잘났다고 큰소리치고 있냐!"
1010406-60 = "말 다했냐?"
1010406-61 = "아직 절반도 안 했는데?"
1010406-67 = "선생님……!"
1010406-68 = "[s3] \"이럴 때는…… 그러니까……!\"\n[s4] \"일단, 이쪽이야!\""
1010406-73 = "음……. 네. 무사히 숨는 데 성공했군요."
1010406-78 = "총격전은 계속 커져 가고 있는 듯하지만요."
1010406-79 = "새삼 생각나는 것입니다만, 선생님."
1010406-80 = "저를 지켜 준다고 말씀하시지 않으셨나요?"
1010406-81 = "[s] \"그래. 그거 말인데. 잘 들어 줘, 레이죠…….\""
1010406-82 = "네? 지켜야 할 대상을 다치지 않도록 하는 것……."
1010406-83 = "그리고 보호해야 할 대상을 보호하는 것에, 반드시 한 가지 방법만이 있는 것은 아니라고요?"
1010406-84 = "그리고 때로는 흐르는 물처럼 돌아가는 것도, 나아가 상황에 너무 얽매이지 않는 것 역시도……."
1010406-85 = "어떤 의미로는 그 역시 하나의 강함이라는 말씀이십니까?"
1010406-86 = "……."
1010406-87 = "그렇군요. 잘 알겠습니다. 공부가 되었습니다. 선생님."
1010406-92 = "[ns] \"어, 응? 레이죠?\""
1010406-93 = "왜 그러시죠, 선생님?"
1010406-94 = "이렇게 같이 몸을 붙이고 숨어 있어야……. 조금이라도 덜 들키지 않겠습니까?"
1010406-95 = "[s] \"그건…… 그렇긴, 한데…….\""
1010406-96 = "역시 그렇지요?"
1010406-97 = "……."
1010406-98 = "뭔가, 편안하고 아늑하군요. 확실히 안전하다는 느낌마저 듭니다."
1010406-105 = "……들려오는 소리만은, 조금 뒤숭숭하기는 합니다만."
1010406-106 = "그래도, 선생님과 함께 있어서일까요."
1010406-107 = "이런 시간도…… 그렇게까지는 나쁘지 않은 것 같습니다."
1010406-110 = "(총격전은 그 뒤로도 계속해서 이어졌다…….)"
1010406-111 = "(마침내 발키리 경찰학교의…… 경비국이 출동하고서야, 사태는 겨우 진정되었다.)"
1010406-113 = "벌써 이런 시간이 되어버렸군요……."
1010406-114 = "[s] \"어차피 외부 일정은 다 끝낸 상황이었으니까!\""
1010406-115 = "그렇다고는 해도……."
1010406-116 = "죄송합니다. 선생님."
1010406-117 = "사실은…… 그렇네요."
1010406-118 = "저도 때로는, 보호받는 입장이 되어 보고 싶었습니다."
1010406-119 = "제가…… 괜한 고집을 부려, 선생님을 곤란하게 해 드린 것 같습니다."
1010406-120 = "[s] \"괜찮아. 그렇게 사과하지 않아도 돼.\""
1010406-121 = "그렇, 습니까? 그렇지만……."
1010406-122 = "[s5] \"무엇보다, 오늘 하루는 아직 끝나지 않았으니까!\"\n[s6] \"산해경으로 돌아갈 때까지는, 내가 레이죠를 지켜 줘야지!\""
1010406-125 = "네? 그건……."
1010406-126 = "……."
1010406-127 = "그렇군요. 그러면……."
1010406-133 = "(레이죠가 갑자기 몸을 붙여 오더니……)"
1010406-134 = "(내 팔을, 자기 어깨에 둘렀다.)"
1010406-137 = "[ns] \"어……?!\""
1010406-138 = "왜 그러시죠, 선생님?"
1010406-139 = "저를 지켜 주시는 것, 아니었나요?"
1010406-140 = "그러면, 선생님. 마지막까지 잘 부탁드리겠습니다."
1010406-142 = "(그날, 산해경으로 돌아가는 길은…….)"
1010406-143 = "(평소보다 어쩐지, 더욱 길게만 느껴졌다.)"
