[translation]
2000108-1 = "메이드 카페! 1"
2000108-2 = "야외 광장"
2000108-3 = "길을 걷다가 신장개업한 메이드 카페를 발견했다."
2000108-4 = "[s1] '당연히 들어가 봐야 하지 않겠어?'\n[s2] '그만둬. 여긴 아직 일러.'"
2000108-5 = "(내면의 목소리에 순응하기로 했다.)"
2000108-6 = "(하지만 생각과 달리 몸은 솔직했다.)"
2000108-7 = "(덜컥!)"
2000108-9 = "카페 메이드라마틱!"
2000108-12 = "랄~ 라~ 라라라라!"
2000108-13 = "주인님의 귀여운 메이드~ 캐서린 등장!"
2000108-14 = "다녀오셨어요~ 주인님~"
2000108-16 = "주인님을 기다리고 있던 메이드라마틱에! 어서 오세……!"
2000108-17 = "우와와와앗!"
2000108-18 = "서, 선생님. 어떻게 여기에……!"
2000108-19 = "[s3] \"…… 누구세요?\"\n[s4] \"캐서린……?\""
2000108-20 = "하아. 속았다."
2000108-21 = "하아. 속았다."
2000108-22 = "친구가…… 귀여운 웨이트리스 복장을 입을 수 있는…… #n아기자기한 디저트 카페 아르바이트 대타를 뛰어 달라고 해서……"
2000108-23 = "차마 거절할 수 없었던 탓도 있었지만."
2000108-24 = "설마 메이드카페 였을 줄이야……."
2000108-25 = "그, 그보다! 선생님은 여기에 왜 온 거야!"
2000108-26 = "아니! 선생님이 이런 곳에 와도 되는 거야?"
2000108-27 = "[s5] \"퇴근했으니 주인님이라 불러줘.\"\n[s6] \"설령 법과 도덕이 허락하지 않는다 해도, 나는 메이드가 좋다.\""
2000108-28 = "무슨 공무원 같은 소리야……"
2000108-29 = "어, 어쨌든 당장 나가! 아무리 그래도 선생님에겐…… 부끄러워!"
2000108-30 = "아니 뭐…… 퇴폐업소는 아니지만……"
2000108-31 = "그, 그래도! 안 돼! #n부탁이니 어서 밖으로……."
2000108-32 = "어허. 캐서린."
2000108-33 = "접객은 제대로 해야죠."
2000108-34 = "크윽. 점장님……."
2000108-35 = "아, 알겠습니다. 하아 어쩔 수 없지. #n지금은 손님…… 아니……"
2000108-36 = "……."
2000108-38 = "주…… 인…… 님……."
2000108-39 = "후우."
2000108-40 = "어서 오세요. 자리로 안내해 드리겠습니다."
2000108-42 = "아시겠지만 사진 촬영이나 메이드를 향한 터치는 안 됩니다."
2000108-43 = "특히 사진의 경우엔…… 생명을 보장하지 못할 수 있다는걸 염두해 주시기 바랍니다."
2000108-44 = "그럼 메뉴를 보시며 주문을……."
2000108-45 = "[s7] \"모에모에큥~ 해줘.\"\n[s8] \"맛있어져라. 샤라랄라! 주문을 외워줘.\""
2000108-46 = "왜 이렇게 잘 아는 거야……! #n선생님, 아니 주인님 혹시 메이드카페 마니아인 건가?"
2000108-47 = "왜 이렇게 잘 아는 거야……! #n선생님, 아니 주인님 혹시 메이드카페 마니아인 건가?"
2000108-48 = "어, 어쨌든 그런건 부끄러워서 못해."
2000108-49 = "[s] \"그럼 업계포상을 내려줘.\""
2000108-50 = "에? 업계포상?"
2000108-51 = "나도 메이드카페 아르바이트는 처음이라 잘 모르겠는데……"
2000108-52 = "그러니까, 잠시만…… 검색해 보겠다. #n업…… 계…… 포…… 상……"
2000108-54 = "에……?!"
2000108-55 = "이, 이거 뭐야?! 진짜로 메이드들은 이런 것도 하는 건가?"
2000108-56 = "바, 발로? 마, 망측해! 못해! 절대로 못 해!"
2000108-57 = "어떻게…… 어떻게!"
2000108-58 = "선생님을 발로 지끈지끈 밟아주라는 거냐!"
2000108-59 = "믿을 수 없다!"
2000108-60 = "에? 그런 게 마사지가 된다고? #n하아. 정말 말도 안……"
2000108-61 = "……"
2000108-62 = "우웃. 점장이 째려보고 있다."
2000108-63 = "아, 알겠다. #n업계포상은 힘들지만…… 대신……"
2000108-66 = "……해줄게."
2000108-67 = "모에…… 모에……"
2000108-68 = "큐……"
2000108-69 = "큐……!"
2000108-70 = "큐우……"
2000108-71 = "으아아아 역시 무리!!"
2000108-74 = "(이후 점장에게 둘이 함께 혼났다.)"
