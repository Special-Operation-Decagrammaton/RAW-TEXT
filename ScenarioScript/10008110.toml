[translation]
10008110-1 = "제11화;대길전 공방전"
10008110-3 = "보, 보스! 정면에서 아우성치는 인원들과 저희 조직 간에 무력 충돌이 발생!"
10008110-4 = "이대로 있으면 사무실까지 밀고 들어오는 것도 시간문제입니다!"
10008110-5 = "제길……! 고작 해봐야 조무래기들 주제에 감히 저희 조직의 사업을 방해하다니!"
10008110-6 = "예상보다 빨라졌지만 좋습니다."
10008110-7 = "새전함을 챙겨서 탈출입니다!"
10008110-12 = "저기! 찾았다!"
10008110-13 = "당신들은?! 역시 지금 이 사태는 당신들 짓이었습니까?!"
10008110-14 = "하! 당연하지!"
10008110-15 = "감히 SNS를 가지고 바이럴 마케팅이니 뭐니 라면서 이쪽을 바보 취급했겠다!"
10008110-16 = "그런 녀석이야말로 SNS로 몰락하기 마련이라고!"
10008110-18 = "……뭐, 부정할 수는 없는 말이네."
10008110-19 = "아르바이트랍시고 감히 날 이용하려고 들다니 말이야!"
10008110-20 = "용서 못 해! 이대로 놓치지 않겠어!"
10008110-22 = "크읏! 그따위 잔꾀를 부리다니!"
10008110-23 = "병력! 병력을 더 호출하는 겁니다!"
10008110-24 = "어차피 아까처럼 검은거북파의 병력을 전부 동원하면 당신네 같은 약소 서클을 제압하는 일 따윈 식은 죽……!"
10008110-25 = "그, 그게……. 보스! 곤란합니다! 현재 검은거북파의 병력 태반이 정문으로 습격해온 녀석들에게 붙잡혀 있는 상황입니다!"
10008110-26 = "네?"
10008110-29 = "이야~ 모두 다 같이 진격~!"
10008110-30 = "나쁜 아이들은 혼날 시간이에요~☆"
10008110-35 = "……꿈을 짓밟은 대가는 비싸."
10008110-38 = "저, 정문이 아닌 다른 곳의 병력을 부르면 되잖습니까!"
10008110-39 = "그뿐만이 아닙니다! 대길전의 정면 외에도, 그……. 외곽에서 또 다른 습격자가……!"
10008110-40 = "……!!"
10008110-43 = "검은거북파라고 했었지……!"
10008110-44 = "새해 첫날부터 소동을 일으키는 녀석들은 전부! 각오해!"
10008110-45 = "휴일에도 일해야 하는 내 분노를 보여주겠어!"
10008110-46 = "전원 포위망 구축이야!"
10008110-49 = "넵!!"
10008110-54 = "으음. 이오리의 마음이 이해가 안 가는 건 아니지만, 그렇게 날뛰는 것도 선도부로서의 체면이……."
10008110-55 = "아니……. 뭐, 좋아요."
10008110-56 = "지금만큼은 날뛰도록 내버려 둘까요."
10008110-57 = "검은거북파. 혼란을 부른 당신들을 이 자리에서 전부 구속하겠습니다."
10008110-60 = "이, 이 무슨……. 어째서 상황이 이렇게……."
10008110-61 = "후훗…… 어째서 상황이 이렇게 되었냐고?"
10008110-62 = "그야 뻔하잖아!"
10008110-63 = "당신네들이 겁도 없이 우리 흥신소를 적으로 돌린 까닭이라고!"
10008110-65 = "머, 멋져요! 아루 님!"
10008110-66 = "……아니, 어쩌다 이렇게 되었을 뿐이잖아."
10008110-67 = "아루 쨩. 기세를 타면 뒤도 돌아보지 않으니까~ 쿠흐흣!"
10008110-72 = "저기…… 내가 이런 말 하기도 좀 그렇지만, 뭐랄까. 너희 사장, 평소에 뻔뻔하단 말, 자주 듣지 않아?"
10008110-73 = "자, 잔말은 됐어!"
10008110-74 = "지금부터 진짜 우리의 힘을 보여주겠어! 직원들! 본격적으로 일할 시간이야!"
10008110-75 = "물론 선생님도……. 부탁한다고?"
10008110-76 = "[s] \"응! 모두 가자!\""
