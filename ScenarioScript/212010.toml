[translation]
212010-1 = "제1화;한발 늦은 대처"
212010-3 = "……뭐라고?"
212010-4 = "[s] \"뇌제의…… NK 울트라 프로젝트?\""
212010-5 = "그럼…… 사츠키 선배가 연구하던 거랑은 다른 건가요?"
212010-6 = "완전히 달라."
212010-7 = "뇌제가 꿈꾸던 것은 사람의 근본적인 부분을 건드리는 정신 조작."
212010-8 = "사람의 심층 의식을 마음대로 조종할 수 있는, 단순 최면과는 궤를 달리하는 사악하고 비윤리적인 실험이지."
212010-12 = "다들 이해하기 어렵겠지만, 사실이야."
212010-13 = "[s] \"사츠키, 더 자세한 이야기를 해줄 수 있어?\""
212010-14 = "원래대로라면 어떤 일이 있어도 말하지 않았을 이야기지만……"
212010-15 = "상황이 이렇게 되었으니, 내가 아는 대로 이야기 해줄게."
212010-16 = "……과거의 이야기군요. 선배들이 잘 말하지 않는……."
212010-17 = "그래. 2년 전의 이야기지."
212010-20 = "당시 게헨나를 공포로 지배하고 있던 뇌제는…… 비인간적이고 반인륜적인 실험들을 아무렇지도 않게 시행하는 사람이었어."
212010-21 = "그중에는 학생 개개인의 자유의지를 말살하고 학원 전체의 군체 의식을 통합하기 위해 비밀리에 개발하던 어떤 프로그램도 있었지."
212010-24 = "다행히 그 프로젝트가 본격적으로 가동되기 이전, 마코토 쨩과 나를 포함한 뇌제 반대 세력의 행동으로 뇌제가 축출되면서 그 단계까지 진행되지는 않았지."
212010-25 = "우리들은 뇌제의 방향이 잘못되었다고 생각했기 때문에, 관련된 모든 자료를 즉시 폐기했지……."
212010-28 = "그때 뇌제가 연구하던 프로젝트들을 살펴본 마코토 쨩의 방침은, '뇌제와 관련된 내용은 무조건 모두 제거'야."
212010-29 = "그만큼 위험하고, 받아들이기 힘든 내용들이 많았거든……."
212010-32 = "하, 하지만 지금 상황은…… 그 자료들은 모두 폐기했다고 하지 않았나요?"
212010-33 = "그래서 지금 상황이 심각하다고 생각하는 거야."
212010-34 = "분명 그때의 연구는 미완성이었고, 트리거에 해당하는 부분도 우리가 확인했을 때는 모두 삭제되어 있었거든."
212010-35 = "어떤 방식으로 작동하는지도 알 수 없었어."
212010-36 = "하지만 어째서 지금, 어떻게 과거의 그림자가 되살아나 게헨나를 덮쳤을까……."
212010-37 = "그런 게 있었다니…… 믿기지가 않네요……."
212010-38 = "과거를 보여줄 수는 없지만, 느낄 수는 있지."
212010-39 = "마코토 쨩과 선도부장이 손을 잡고 키보토스 정복을 외치는 모습을 봤잖아. 이로하."
212010-40 = "……."
212010-41 = "[s] \"…….\""
212010-42 = "어째서 3학년들만 이상해졌는가…… 거기에 대한 답변도 여기에 있어."
212010-43 = "2년 전, 뇌제의 실험은 당시의 게헨나 학생들을 대상으로 했으니까."
212010-45 = "그래서 그 후에 입학했던 지금의 2학년과 1학년들은 괜찮은 거군요……."
212010-49 = "그, 그렇다면 지금 3학년이 아닌 사람들까지……?!"
212010-50 = "'졸업'한 선배들까지 영향이 있느냐, 라는 물음이지?"
212010-51 = "내 생각이지만, 아마 그렇지는 않을 거야."
212010-52 = "아까의 방송이 미치는 범위는 기껏해야 이 게헨나 학원 내부일 테니까."
212010-53 = "그러면 그나마 다행일 테지만……."
212010-55 = "사츠키 선배, 그럼 저거…… 되돌릴 수는 있는 거예요?"
212010-56 = "나도 잘 모르겠어."
212010-57 = "내 최면에 걸린 마코토 쨩처럼 한숨 자고 일어나면 풀린다거나……#n그런 속 편한 일은 있지 않겠지. 저건 그 뇌제의 유산이니까."
212010-58 = "……하아…… 어떻게 하죠?"
212010-59 = "게헨나 만마전의 정보부장으로서, 할 수 있는 행동은 모두 해볼게."
212010-60 = "나도 저런 말을 하는 마코토 쨩은 그다지 보고 싶지 않거든."
212010-61 = "내가 원하는 것은 세계평화란 말이야. 아프지 않은 세상을 만들고 싶은데, 이건 전혀 내가 원하지 않는 방향이라구."
212010-62 = "그런 말도 안 되는 소리를 저 선도부장까지 거들고 나설 줄이야……."
212010-64 = "그래. 지금 우리 선임행정관까지도……."
212010-65 = "사실 선도부의 가세도 문제지만, 정말 큰 문제는 따로 있어."
212010-66 = "응? 어떤 거?"
212010-70 = "마코토 쨩이 진심으로 보인다는 점이지."
212010-71 = "어…… 대놓고 이런 말하긴 좀 미안하지만……"
212010-72 = "만마전 의장은 그냥 귀찮은 사람 아니야?#n진심이라고 해도 그렇게 막 큰 위협이 되지는 않을 것 같은데……?"
212010-76 = "그건 마코토 쨩에 대해 잘 모르기 때문에 할 수 있는 말이지."
212010-77 = "마코토 쨩이 위협적인 건, 투쟁할 대상이 있을 때 가장 강해지는 사람이라서야."
212010-78 = "맞서 싸울 상대가 강하면 강할수록 더더욱."
212010-79 = "예전, 그 뇌제와 맞섰을 때가 바로 마코토 쨩의 진면목이 발휘된 시절이지."
212010-80 = "그 후에는 선도부…… 라지만, 사실 선도부 상대로 진심을 낸 적은 없는 것 같고."
212010-81 = "뭐? 언제나 귀찮은 일을 만들어내고 있잖아."
212010-82 = "귀찮은 정도에서 끝난다면 다행인 거지."
212010-83 = "으음……."
212010-84 = "아무튼, 적이 된다면 정말로 성가신 상대가 마코토 쨩이라고 단언할 수 있어. #n그 집념과 투쟁심은 키보토스의 그 누구에게도 지지 않아."
212010-85 = "그런 마코토 쨩이 키보토스 전체를 상대로 진심 투쟁을 결심한 상황이니까……"
212010-86 = "절대로 쉽게 끝나지는 않을 거야."
212010-88 = "그건 맞는 말이에요. 그 사람…… 평소에는 온갖 허술한 면을 보여주긴 해도……."
212010-89 = "……."
212010-90 = "아, 잠깐. 그런데 왜 사츠키 의원은 멀쩡한 거야? 3학년들은 모두 이상해졌잖아."
212010-91 = "글쎄…… 내 짐작일 뿐이지만, 그간 내가 독자적으로 연구해 온 것 때문이지 않을까?"
212010-92 = "그게 뭔데……? 설마 그 최면술?"
212010-93 = "그래. 나는 나대로 NK 울트라 프로젝트에 대한 연구를 했으니까."
212010-94 = "뇌제의 연구에서 착안했지만, 강제성과 비윤리성을 최대한 덜어낸……#n말하자면 '쿄고쿠 사츠키류 NK 울트라'야."
212010-95 = "참고로 이 이름을 그대로 가져가자고 제안한 건 마코토 쨩이었어.#n똑같은 이름을 사용해서 존재 자체를 덮어버리자는 발상이었지."
212010-96 = "아무튼 그런 연구의 영향으로 내게는 세뇌가 먹히지 않은 것 같다고 생각 중이야."
212010-97 = "정상 맞지? 괜찮은 거지?"
212010-98 = "맞다니까."
212010-100 = "……뭐가 됐든 다행이긴 한데요."
212010-101 = "그럼 우리는, 이제부터 어떻게 해야 할까요?"
212010-105 = "[ns1] \"모두를 다시 돌려놓을 방법을 찾아보자.\"\n[ns2] \"세뇌를 해제할 수 있는 방법을 찾아보자.\""
212010-108 = "선생님, 혹시 샬레의 힘을 빌릴 수는 없을까?"
212010-109 = "글쎄, 그건 좀 위험하다고 생각해."
212010-113 = " 어째서?"
212010-114 = "샬레는 총학생회장 직속의 연방 동아리.#n그렇게 되면 게헨나의 일에 총학생회가 개입하게 될 수도 있어."
212010-115 = "게헨나 자치구의 주권 자체에 영향이 갈 수도 있다는 이야기야."
212010-116 = "[s] \"사츠키의 말이 맞아.\""
212010-117 = "……그, 그럴지도……."
212010-118 = "게헨나의 문제는, 게헨나가 해결한다."
212010-119 = "일단 이 명제를 최대한 지키고 싶어."
212010-120 = "물론, 우리만으로 안 될 경우 도움을 요청하는 건 나쁜 행동이 아니지만……"
212010-121 = "우선은 우리가 해결하는 게 가장 좋지 않을까 해."
212010-123 = "……저도 공감합니다."
212010-124 = "게헨나의 수뇌부가 키보토스 정복이라는 말을 진지하게 입에 담았다는 이야기가 외부에 알려지면 이것만으로도 큰 혼란이 발생할 겁니다."
212010-125 = "어떻게든, 내부에서 해결해야겠군요."
212010-126 = "[s] \"그래. 어떻게든 해야지.\""
212010-128 = "으응. 샬레의 도움은 최후의 수단으로 남겨두는 걸로 하고……."
212010-129 = "골든 타임을 놓치기 전에, 최대한 우리가 어떻게든 한다. 이게 목표지?"
212010-130 = "네, 맞아요."
212010-135 = "(그후로 많은 이야기를 나누었지만……)"
212010-139 = "(뾰족하게 떠오르는 방법은 없었다.)"
212010-143 = "어디부터 짚어나가야 할까……."
212010-148 = "사츠키 의원, 그때 방송에서 뭔가 이상한 소리가 흘러나왔잖아?"
212010-149 = "그게 그, 뭐더라?"
212010-150 = "아! 트리거! 트리거 아니야?"
212010-154 = "응, 아마 그럴 가능성이 높아."
212010-155 = "문맥이 일정하지 않은 특정 언어들의 조합이 트리거가 되어, 잠들어 있던 심층 의식이 깨어난다는 거지."
212010-156 = "그, 그럼…… 거기에 힌트가 있는 거 아닐까?"
212010-157 = "예를 들어서, 그 단어들을 거꾸로 들려준다거나?"
212010-158 = "마인드컨트롤 연구에 꽤 많은 시간을 투자한 내가 봤을 때, 그렇게 테이프를 되감는 것처럼 해결할 수 있는 세뇌는 없겠지만……."
212010-159 = "크윽…… 너무 단순하게 생각한 건가……."
212010-160 = "아니야. 때때로 단순한 해결책이 어려운 문제를 해결할 때도 있는 법이지……."
212010-166 = "윽……."
212010-167 = "에잇, 저 소리! 신경 거슬린단 말이지!"
212010-168 = "그러고 보니 저 고주파 같은 소리가 방송 때도 계속 들렸었는데……."
212010-172 = "……."
212010-173 = "주파수……?"
212010-174 = "[s] \"사츠키, 떠오르는 게 있어?\""
212010-175 = "주파수에 의한…… 트리거 워드는 단지 신호에 지나지 않는다면? 진정한 세뇌의 시작은 특정 주파수에 의해 심층 의식을 깨우는 단계를 거친다면……?"
212010-179 = "선배……?"
212010-180 = "뭐, 뭔가 엄청나게 생각하고 있는 것 같은데……!"
212010-181 = "굉장히 진지한 느낌…… 방해하면 안 되겠어요."
212010-188 = "어쩌면…… 작은 단서를 발견한 걸지도 몰라."
212010-189 = "저, 정말이야?!"
212010-190 = "정답이라는 보장은 없지만, 시도해 볼 가치는 충분해."
212010-191 = "여러 가지 방법이 떠오르고 있거든. 나는 돌아가서 연구를 해볼게."
212010-192 = "으응! 평소에는 참 이상한 사람이라고 생각했는데, 이럴 때는 의지가 되네!"
212010-194 = "이오리……!"
212010-195 = "사실이긴 하니까요……."
212010-196 = "하지만, 할 때는 하는 사람이기도 하고요."
212010-198 = "흐응, 만마전의 정보부장으로서 부끄럽지 않은 모습을 보여야겠지."
212010-199 = "[s3] \"부탁할게, 사츠키.\"\n[s4] \"도움이 필요하면 언제든 말해줘.\""
212010-202 = "그래, 선생도."
212010-203 = "아, 그리고 내 예상이지만 아마 지금 세뇌된 사람들은……"
212010-204 = "자신들의 뜻에 반대하는 자들에게 자비를 베풀지 않을 거야."
212010-205 = "……!"
212010-206 = "그게 뇌제의 방식이었거든."
212010-212 = "그러니…… 모두 조심해. 성과가 있으면 알려주도록 할게."
212010-217 = "……그럼 저희도 이만 돌아갈까요. 자리를 너무 오래 비우게 되면 위험할 것 같으니."
212010-218 = "네에…… 그리고 아무래도 우리끼리만으로는 한계가 있을 것 같네요."
212010-219 = "[s] \"다른 학생들에게도 도움을 요청해 볼게.\""
212010-220 = "선생님, 만약 사츠키 선배의 걱정이 사실이라면 선생님이 가장 위험하지 않을까요?"
212010-221 = "안 그래도 눈에 띄는데 너무 돌출되는 행동을 하면……."
212010-222 = "[s5] \"조심해서 행동하도록 할게.\"\n[s6] \"걱정해 줘서 고마워, 이로하.\""
212010-225 = "……선생님이라면 현명하게 대처하시겠지만요."
212010-226 = "이렇게 함께 해주셔서 감사합니다, 선생님."
212010-227 = "정말로, 정말로 큰 의지가 되네요."
212010-229 = "응. 그러게……."
212010-230 = "[s] \"그럼, 다들 조심히 들어가도록 하자.\""
212010-232 = "네. 모두 조심히."
212010-233 = "다시 또 뵙겠습니다."
212010-235 = "무슨 일 있으면 연락해!"
212010-243 = "하아……."
212010-247 = "이미 사라진 뇌제의 유산 따위에 지지 마, 선배들……!"
212010-248 = "제발 다시 돌아와 줘. 사고 쳐도 되니까. 당분간 나 혼자 순찰 돌아도 되니까."
212010-249 = "만마전이 괴롭히는 것도 두 번…… 아니, 세 번까지도 그냥 참을 테니까……!"
212010-250 = "그러니까…… 그러니까……."
212010-252 = "……."
212010-254 = "다음화;치나츠"
