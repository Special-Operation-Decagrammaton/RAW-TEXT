212010-157 = "อย่างเช่น ลองเปิดคำพวกนั้นย้อนกลับดู?"
212010-158 = "จากมุมมองของฉันที่ทุ่มเวลาให้กับการวิจัยด้านการควบคุมจิตใจมานาน คงไม่มีการล้างสมองแบบไหนที่แก้ได้ง่ายๆ ราวกับกรอเทปย้อนกลับหรอก..."
