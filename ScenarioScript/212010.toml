[translation]
212010-1 = "ตอนที่ 1;รับมือช้าไปหนึ่งก้าว"
212010-2 = ""
212010-3 = "ว่าไงนะ...?"
212010-4 = "[s] \"โปรเจกต์อัลตร้า NK... ของผู้เหี้ยมโหดเหรอ?\""
212010-5 = "ถ้างั้น... ก็เป็นคนละอย่างกับที่รุ่นพี่ซัตสึกิเคยวิจัยเหรอคะ?"
212010-6 = "มันต่างกันลิบลับเลยละ"
212010-7 = "สิ่งที่ผู้เหี้ยมโหดใฝ่ฝันถึง คือการควบคุมจิตใจที่เข้าไปแตะต้องถึงรากฐานของความเป็นมนุษย์"
212010-8 = "มันเป็นการทดลองอันชั่วร้ายและไร้จริยธรรม ที่ควบคุมจิตใต้สำนึกของมนุษย์ได้ตามใจ ต่างกันกับการสะกดจิตธรรมดาๆ ลิบลับเลยละ"
212010-9 = ""
212010-11 = ""
212010-12 = "อาจจะไม่ใช่เรื่องที่ทุกคนจะทำความเข้าใจกันได้ง่ายๆ แต่มันคือเรื่องจริงนะ"
212010-13 = "[s] \"ซัตสึกิ ช่วยเล่ารายละเอียดให้มากกว่านี้ได้มั้ย?\""
212010-14 = "ถ้าเป็นปกติ ต่อให้เกิดอะไรขึ้นฉันก็ไม่มีวันเล่าเรื่องนี้เด็ดขาด..."
212010-15 = "แต่ในเมื่อสถานการณ์มันกลายเป็นแบบนี้ไปแล้ว ฉันจะเล่าเท่าที่รู้ก็แล้วกัน"
212010-16 = "เป็นเรื่องราวในอดีตสินะคะ เรื่องที่พวกรุ่นพี่ไม่ค่อยยอมพูดถึง..."
212010-17 = "ใช่ มันคือเรื่องเมื่อ 2 ปีก่อนน่ะ"
212010-20 = "ในเวลานั้น ผู้เหี้ยมโหดที่ปกครองเกเฮนน่าด้วยความหวาดกลัว... เป็นคนที่ทำการทดลอง#nอันไร้มนุษยธรรมและผิดศีลธรรมได้อย่างไม่สะทกสะท้าน"
212010-21 = "หนึ่งในนั้นก็คือโปรแกรมที่ถูกพัฒนาขึ้นมาอย่างลับๆ เพื่อทำลายเจตจำนงเสรีของนักเรียนแต่ละคน#nจนหมดสิ้น และหลอมรวมจิตสำนึกของทั้งโรงเรียนให้เป็นหนึ่งเดียว"
212010-22 = ""
212010-24 = "โชคดีที่ก่อนโปรเจกต์นั้นจะเริ่มทำงานอย่างเต็มรูปแบบ กลุ่มต่อต้านผู้เหี้ยมโหดที่มีทั้งฉัน ทั้งมาโคโตะจังได้ลงมือ จนผู้เหี้ยมโหดถูกขับไล่ไป แผนการก็เลยไม่ได้ดำเนินไปถึงขั้นนั้น"
212010-25 = "พวกเราเห็นว่าแนวทางของผู้เหี้ยมโหดนั้นเป็นเรื่องผิด ก็เลยทำลายข้อมูลทั้งหมดที่เกี่ยวข้องทันที..."
212010-26 = ""
212010-28 = "หลังจากตรวจดูโปรเจกต์ต่างๆ ที่ผู้เหี้ยมโหดเคยวิจัย มาโคโตะจังก็กำหนดนโยบายว่าจะ 'กำจัดทุกสิ่งที่เกี่ยวข้องกับผู้เหี้ยมโหดโดยไม่มีข้อยกเว้น'"
212010-29 = "เพราะมันมีข้อมูลที่ทั้งอันตรายและยากจะยอมรับอยู่เต็มไปหมดน่ะ..."
212010-32 = "แต่... แต่ว่าสถานการณ์ตอนนี้... ไหนว่าข้อมูลพวกนั้นถูกทำลายไปหมดแล้วไม่ใช่เหรอคะ?"
212010-33 = "ก็เพราะแบบนั้น ฉันถึงคิดว่าสถานการณ์ตอนนี้ร้ายแรงยังไงล่ะ"
212010-34 = "งานวิจัยตอนนั้นยังไม่เสร็จสมบูรณ์ และตอนที่พวกเราตรวจสอบ ส่วนที่ทำหน้าที่เป็นทริกเกอร์ก็ถูกลบ#nไปหมดแล้วด้วย"
212010-35 = "พวกเราไม่รู้ด้วยซ้ำว่ามันทำงานด้วยวิธีไหน"
212010-36 = "แต่ทำไมถึงเป็นตอนนี้ แล้วเงาจากอดีตฟื้นคืนกลับมาเล่นงานเกเฮนน่าได้ยังไง..."
212010-37 = "เคยมีเรื่องแบบนั้นด้วยเหรอคะ... ไม่น่าเชื่อเลย..."
212010-38 = "ต่อให้จะเอาอดีตมาให้ดูไม่ได้ แต่ก็สัมผัสถึงมันได้ไม่ใช่เหรอ"
212010-39 = "เธอก็เห็นมาแล้วนี่นาว่ามาโคโตะจังกับประธานกรรมการวินัยจับมือกันและประกาศว่าจะพิชิตคิโวทอสน่ะ อิโรฮะ"
212010-40 = "..."
212010-41 = "[s] \"...\""
212010-42 = "เหตุผลที่มีแค่นักเรียนชั้นปีที่ 3 เปลี่ยนไป... คำตอบของเรื่องนั้นก็อยู่ตรงนี้เหมือนกัน"
212010-43 = "นั่นก็เพราะเมื่อ 2 ปีก่อน การทดลองของผู้เหี้ยมโหดมุ่งเป้าไปที่นักเรียนเกเฮนน่าในเวลานั้น"
212010-45 = "นักเรียนชั้นปีที่ 2 กับชั้นปีที่ 1 ในปัจจุบันที่เข้าเรียนหลังจากนั้นก็เลยไม่เป็นอะไรสินะคะ..."
212010-46 = ""
212010-48 = ""
212010-49 = "ถะ... ถ้าอย่างนั้น คนที่ตอนนี้ไม่ได้อยู่ชั้นปีที่ 3 ก็...?!"
212010-50 = "จะถามว่ารุ่นพี่ที่ 'จบการศึกษา' ไปแล้วจะได้รับผลด้วยหรือเปล่าสินะ?"
212010-51 = "ฉันคิดว่าไม่น่าจะเป็นแบบนั้นนะ"
212010-52 = "ขอบเขตที่การกระจายเสียงเมื่อกี้ส่งไปถึง อย่างมากก็คงมีแค่ภายในสถาบันเกเฮนน่าแห่งนี้น่ะ"
212010-53 = "ถ้าอย่างนั้นก็ค่อยยังชั่วหน่อย..."
212010-55 = "รุ่นพี่ซัตสึกิ ถ้างั้น... พอจะทำให้เรื่องนี้กลับมาเป็นเหมือนเดิมได้มั้ยคะ?"
212010-56 = "ฉันเองก็ไม่รู้เหมือนกัน"
212010-57 = "ถ้าแค่นอนหลับสักตื่นแล้วหาย เหมือนมาโคโตะจังตอนถูกฉันสะกดจิตก็คงดีอยู่หรอก...#nแต่เรื่องง่ายๆ แบบนั้นคงไม่มีทางเกิดขึ้น ก็นั่นคือมรดกของผู้เหี้ยมโหดนี่นะ"
212010-58 = "เฮ้อ... จะทำยังไงดีคะ...?"
212010-59 = "ในฐานะหัวหน้าฝ่ายข่าวกรองของแพนเดโมเนียม โซไซตี้แห่งเกเฮนน่า ฉันจะลองทำทุกอย่างที่ทำได้"
212010-60 = "ฉันเองก็ไม่ค่อยอยากเห็นมาโคโตะจังพูดอะไรแบบนั้นเหมือนกัน"
212010-61 = "สิ่งที่ฉันต้องการคือสันติภาพของโลกต่างหาก ฉันอยากสร้างโลกที่ไม่มีความเจ็บปวด แต่เรื่องนี้กำลังมุ่งไปในทิศทางที่ฉันไม่ต้องการเลยสักนิด"
212010-62 = "ไม่คิดเลยว่าแม้แต่ประธานกรรมการวินัยคนนั้นจะออกโรงสนับสนุนคำพูดไร้สาระแบบนั้น..."
212010-64 = "ใช่ ตอนนี้แม้แต่เจ้าหน้าที่อาวุโสของพวกเราก็ยัง..."
212010-65 = "ที่จริง การที่คณะกรรมการวินัยเข้าร่วมด้วยก็เป็นปัญหาอยู่หรอก แต่ปัญหาที่ใหญ่จริงๆ อยู่ที่อื่นต่างหากล่ะ"
212010-66 = "หืม? เรื่องอะไรเหรอ?"
212010-67 = ""
212010-69 = ""
212010-70 = "ก็ตรงที่มาโคโตะจังดูเหมือนจะเอาจริงน่ะสิ"
212010-71 = "เอ่อ... พูดตรงๆ แบบนี้ก็รู้สึกผิดอยู่หรอก แต่ก็นะ..."
212010-72 = "ประธานแพนเดโมเนียม โซไซตี้เป็นแค่คนน่ารำคาญไม่ใช่เหรอ?#nถึงจะเอาจริง ก็ดูไม่น่าจะเป็นภัยคุกคามใหญ่โตขนาดนั้นนี่นา...?"
212010-73 = ""
212010-75 = ""
212010-76 = "ที่พูดแบบนั้นได้ก็เพราะเธอยังไม่รู้จักมาโคโตะจังดีพอกันน่ะสิ"
212010-77 = "ที่มาโคโตะจังน่ากลัวน่ะ ก็เพราะเป็นคนที่จะแข็งแกร่งที่สุด ก็ต่อเมื่อมีศัตรูให้ต่อสู้ด้วย"
212010-78 = "ยิ่งคู่ต่อสู้แข็งแกร่งเท่าไร ก็จะยิ่งแข็งแกร่งขึ้นมากเท่านั้น"
212010-79 = "ช่วงที่เผชิญหน้ากับผู้เหี้ยมโหดในอดีตนั่นละ คือช่วงที่มาโคโตะจังแสดงความสามารถที่แท้จริงออกมา"
212010-80 = "หลังจากนั้นก็มีคณะกรรมการวินัย... แต่ดูเหมือนมาโคโตะจังจะไม่เคยเอาจริงกับคณะกรรมการวินัยเลย"
212010-81 = "อะไรนะ? ก็เอาแต่สร้างเรื่องน่าปวดหัวให้อยู่ตลอดเลยไม่ใช่เหรอ"
212010-82 = "ถ้าจบแค่เป็นเรื่องน่าปวดหัวได้ก็นับว่าโชคดีแล้วละ"
212010-83 = "อืม..."
212010-84 = "เอาเป็นว่า ฉันกล้ายืนยันเลยว่าถ้ากลายเป็นศัตรูกันขึ้นมาละก็ มาโคโตะจังจะเป็นคู่ต่อสู้ที่รับมือยากสุดๆ เลยละ ทั้งความมุ่งมั่น ทั้งจิตวิญญาณแห่งการต่อสู้ของเธอไม่แพ้ใครในคิโวทอสเลย"
212010-85 = "แล้วตอนนี้มาโคโตะจังคนนั้นก็ตัดสินใจจะต่อสู้กับทั้งคิโวทอสอย่างจริงจังด้วย..."
212010-86 = "เรื่องนี้ไม่มีทางจบลงง่ายๆ แน่"
212010-88 = "ที่พูดมาเรื่องนั้นก็จริงอยู่หรอกค่ะ คนคนนั้น... ถึงปกติจะเผยด้านเปิ่นๆ ออกมาสารพัดก็เถอะ..."
212010-89 = "..."
212010-90 = "อ๊ะ เดี๋ยวก่อน แล้วทำไมสมาชิกซัตสึกิถึงยังปกติดีอยู่ล่ะ? นักเรียนชั้นปีที่ 3 ทุกคนเปลี่ยนไปกันหมด#nเลยนี่นา"
212010-91 = "ไม่รู้สิ... นี่อาจเป็นแค่ข้อสันนิษฐานของฉัน แต่คงเป็นเพราะสิ่งที่ฉันศึกษาวิจัยด้วยตัวเองมาตลอดละมั้ง"
212010-92 = "มันคืออะไรเหรอ...? อย่าบอกนะว่าเป็นวิชาสะกดจิตนั่น?"
212010-93 = "ใช่ เพราะฉันเองก็ศึกษาวิจัยโปรเจกต์อัลตร้า NK ในแบบของฉันเหมือนกัน"
212010-94 = "มันเป็นงานที่ได้แนวคิดมาจากงานวิจัยของผู้เหี้ยมโหด แต่ลดทั้งการบังคับและความไร้จริยธรรมลง#nให้มากที่สุด... พูดง่ายๆ ก็คือ 'อัลตร้า NK สไตล์เคียวโงคุ ซัตสึกิ' ยังไงล่ะ"
212010-95 = "อีกอย่าง คนที่เสนอให้ใช้ชื่อนี้เหมือนเดิมก็คือมาโคโตะจัง#nเป็นแนวคิดที่ว่าใช้ชื่อเดียวกันเพื่อกลบการมีอยู่ของมันเสียเลย"
212010-96 = "เอาเป็นว่า ตอนนี้ฉันคิดว่าอิทธิพลจากงานวิจัยนั้นน่าจะทำให้การล้างสมองใช้กับฉันไม่ได้ผล"
212010-97 = "ยังปกติดีแน่นะ? ไม่เป็นอะไรใช่มั้ย?"
212010-98 = "ก็บอกว่าใช่ไง"
212010-100 = "ไม่ว่าจะยังไง อย่างน้อยก็ค่อยยังชั่วหน่อยนะคะ..."
212010-101 = "ถ้างั้น ต่อจากนี้พวกเราควรทำยังไงดีคะ?"
212010-102 = ""
212010-104 = ""
212010-105 = "[ns1] \"มาหาวิธีทำให้ทุกคนกลับมาเหมือนเดิมกันเถอะ\"\n[ns2] \"มาหาวิธีคลายการล้างสมองกันเถอะ\""
212010-108 = "คุณครู พอจะขอยืมกำลังของชาเล่ต์ได้มั้ย?"
212010-109 = "ไม่รู้สิ ฉันคิดว่าแบบนั้นค่อนข้างเสี่ยงนะ"
212010-110 = ""
212010-112 = ""
212010-113 = "ทำไมล่ะ?"
212010-114 = "ชาเล่ต์เป็นชมรมสหพันธ์ที่ขึ้นตรงต่อประธานองค์การนักเรียน ถ้าทำแบบนั้นองค์การนักเรียนอาจเข้ามา#nแทรกแซงกิจการภายในของเกเฮนน่าก็ได้"
212010-115 = "หมายความว่าอาจส่งผลกระทบต่ออธิปไตยของเขตปกครองตนเองเกเฮนน่าได้โดยตรงเลยนะ"
212010-116 = "[s] \"ซัตสึกิพูดถูกแล้วละ\""
212010-117 = "กะ... ก็อาจจะจริง..."
212010-118 = "ปัญหาของเกเฮนน่า ก็ต้องให้เกเฮนน่าเป็นคนแก้ไขเอง"
212010-119 = "อย่างน้อยฉันก็อยากรักษาหลักการข้อนี้ไว้ให้ได้มากที่สุด"
212010-120 = "แน่นอนว่า ถ้าพวกเราแก้ไขกันเองไม่ได้ การขอความช่วยเหลือก็ไม่ใช่เรื่องผิด..."
212010-121 = "แต่ฉันคิดว่าทางที่ดีที่สุดคือพวกเราลองแก้ไขกันเองก่อน"
212010-123 = "ฉันก็เห็นด้วยค่ะ..."
212010-124 = "ถ้าเรื่องที่ผู้นำระดับสูงของเกเฮนน่าพูดถึงการพิชิตคิโวทอสอย่างจริงจังแพร่ออกไปภายนอก แค่เรื่องนี้เรื่องเดียวก็คงก่อให้เกิดความโกลาหลครั้งใหญ่ได้แล้วค่ะ"
212010-125 = "ไม่ว่าจะยังไง ก็คงต้องแก้ไขกันภายในสินะคะ"
212010-126 = "[s] \"อื้ม ไม่ว่ายังไงก็ต้องหาทางให้ได้\""
212010-128 = "อืม งั้นเก็บการขอความช่วยเหลือจากชาเล่ต์ไว้เป็นทางเลือกสุดท้าย..."
212010-129 = "ก่อนจะพลาดช่วงเวลาทองไป พวกเราจะพยายามจัดการด้วยตัวเองให้ถึงที่สุด นี่คือเป้าหมายใช่มั้ย?"
212010-130 = "ค่ะ ถูกต้องแล้วค่ะ"
212010-135 = "(หลังจากนั้น ทุกคนก็พูดคุยกันอีกมากมาย...)"
212010-136 = ""
212010-139 = "(แต่ก็ยังนึกวิธีแก้ที่ได้ผลแน่ชัดไม่ออก)"
212010-142 = ""
212010-143 = "ควรเริ่มไล่ตรวจสอบจากตรงไหนก่อนดีนะ..."
212010-144 = ""
