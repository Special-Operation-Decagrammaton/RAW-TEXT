[translation]
212010-1 = "Episode 1;A Step Short"
212010-2 = ""
212010-3 = "...Excuse me?"
212010-4 = "[s] \"The Tyrant Emperor's... NK Ultra Project?\""
212010-5 = "Is that...different from what you've been working on, Satsuki?"
212010-6 = "Completely different."
212010-7 = "The Tyrant Emperor dreamed of mind control that altered the fundamental aspects of a person."
212010-8 = "It's nothing like simple hypnosis. It was a cruel and unethical experiment capable of manipulating a person's deep consciousness."
212010-9 = ""
212010-11 = ""
212010-12 = "You probably find this hard to believe, but that's the truth."
212010-13 = "[s] \"Satsuki, can you share more details?\""
212010-14 = "I promised myself never to tell anyone..."
212010-15 = "But since things have turned out this way, I'll tell you what I know."
212010-16 = "...So this is what you third-years never talk about..."
212010-17 = "Yes. It happened two years ago..."
212010-20 = "The Tyrant Emperor ruled Gehenna through fear...and carried out inhumane experiments without a second thought."
212010-21 = "Among them was a secret program to obliterate an individual student's free will and unify the entire academy. It was to be a hive mind."
212010-22 = ""
212010-24 = "Before the project's launch, the Tyrant Emperor was ousted by a rebel faction. Makoto and I were among the members."
212010-25 = "Because we saw the cruelty in the Tyrant Emperor's plans, we purged all relevant materials."
212010-26 = ""
212010-28 = "Makoto's policy was to \"unconditionally destroy anything related to the Tyrant Emperor.\""
212010-29 = "The Emperor's projects were simply that dangerous and utterly unthinkable..."
212010-32 = "B-But what's happening right now...? You said that all the relevant materials were destroyed."
212010-33 = "That's why I'm so troubled."
212010-34 = "The research was incomplete back then. We deleted anything related to trigger-words or activations..."
212010-35 = "We couldn't even parse how it worked."
212010-36 = "Now, all I wonder is how the shadows of the past reemerged to cast themselves over Gehenna..."
212010-37 = "I can't believe something like that existed..."
212010-38 = "I can't show you the past, but you know it's true."
212010-39 = "You saw Makoto and the Head Prefect shake hands, Iroha. They called for absolute conquest."
212010-40 = "..."
212010-41 = "[s] \"...\""
212010-42 = "As for why only the third-years are affected... I think I know why."
212010-43 = "The Tyrant Emperor conducted the experiment two years ago on a selection of students."
212010-45 = "So that's why the first and second-year students, who enrolled after that time, remain unaffected..."
212010-46 = ""
212010-48 = ""
212010-49 = "W-Wait, does that mean the even older students are...?"
212010-50 = "You're asking if the control affects our seniors who \"graduated,\" right?"
212010-51 = "This is only my opinion, but probably not."
212010-52 = "The broadcast was school-wide, but didn't leave the academy's walls."
212010-53 = "That's a relief..."
212010-55 = "Satsuki, um... Can we turn them back?"
212010-56 = "I'm not sure."
212010-57 = "I've only hypnotized Makoto, and she'd be her usual self after a nap. THIS situation clearly isn't as simple."
212010-58 = "*sigh* ...What should we do?"
212010-59 = "I'm not sure, though I'll do all I can as Intelligence Committee Director of the Pandemonium Society."
212010-60 = "I don't like Makoto behaving like this either."
212010-61 = "All I've ever wanted is peace, to create a world free from pain."
212010-62 = "I can't believe even the Head Prefect is going along with all this..."
212010-64 = "Yeah. Our Senior Administrator is too..."
212010-65 = "The Prefect Team turning is a problem, but we have an even bigger issue."
212010-66 = "Hm? What?"
212010-67 = ""
212010-69 = ""
212010-70 = "It's that Makoto is dead serious."
212010-71 = "Um... I'm sorry to put this bluntly..."
212010-72 = "But isn't the chairman just a nuisance? Even if she's \"serious,\" is she really a threat?"
212010-73 = ""
212010-75 = ""
212010-76 = "You only say that because you don't truly know Makoto."
212010-77 = "She's at her most ruthless and focused when she has an opponent."
212010-78 = "...Especially when she's against a worthwhile one. A strong one."
212010-79 = "I witnessed Makoto's true potential when she fought the Tyrant Emperor."
212010-80 = "After that, there was the Prefect Team... But she's never been \"serious\" with your group."
212010-81 = "What? She's always bugging us and stirring stuff up!"
212010-82 = "I'm relieved that she's never gone beyond \"bugging\" you."
212010-83 = "Hmm..."
212010-84 = "I assure you that Makoto would prove truly troublesome if she were to become your enemy. Her tenacity and fighting spirit are unmatched."
212010-85 = "Now, seeing that Makoto's decided to get serious about fighting all of Kivotos..."
212010-86 = "This won't be resolved easily."
212010-88 = "That's true. She...might seem bumbling most of the time, but..."
212010-89 = "..."
212010-90 = "Hold it. Why is Satsuki completely fine? All the other third-years turned, and you're here helping us?"
212010-91 = "Well... I'm only speculating, but maybe my ongoing research has \"inoculated\" me, so to speak?"
212010-92 = "What \"research\"...? You mean all that hypnosis crap?"
212010-93 = "Yes. After all, I studied the NK Ultra Project by myself."
212010-94 = "While I was inspired by the Tyrant Emperor's research, I removed the unethical elements as much as possible... So it's \"Kyougoku Satsuki-style NK Ultra.\""
212010-95 = "By the way, Makoto suggested I keep the name. The idea was to replace and erase the original's history."
212010-96 = "I posit that my exposure and awareness are what protected me from the mass brainwashing."
212010-97 = "You're really fine?"
212010-98 = "I am."
212010-100 = "...No matter the reason, I'm glad to hear it."
212010-101 = "Now then, what should we do?"
212010-102 = ""
212010-104 = ""
212010-105 = "[ns1] \"Let's find a way to bring everyone back.\"\n[ns2] \"We need to reverse the brainwashing.\""
212010-108 = "Sensei, do you think Schale can step in here? We need help."
212010-109 = "That seems precarious, at best."
212010-110 = ""
212010-112 = ""
212010-113 = " Why?"
212010-114 = "Schale works directly under the General Student Council President. If that happens, she might involve herself in Gehenna's affairs."
212010-115 = "Intervention could threaten the Gehenna district's sovereignty."
212010-116 = "[s] \"It's as Satsuki said.\""
212010-117 = "...Y-You have a point..."
212010-118 = "\"Gehenna must resolve Gehenna's issues.\""
212010-119 = "I'd like to stick to this principle as much as possible."
212010-120 = "Of course, I'm not saying that we should refuse help under any circumstances..."
212010-121 = "But I think it would be best if we solved this on our own."
212010-123 = "...I agree."
212010-124 = "If outsiders learn that Gehenna's leadership is considering conquering Kivotos, chaos will break out."
212010-125 = "And so, we'll have to resolve this internally."
212010-126 = "[s] \"Yeah. We need to figure this out somehow.\""
212010-128 = "Hmm. Let's save enlisting Schale's help as a last resort..."
212010-129 = "The goal is to figure something out before we lose our window of opportunity, right?"
212010-130 = "Correct."
212010-135 = "We discussed various approaches afterward..."
212010-136 = ""
212010-139 = "Unfortunately, no brilliant ideas came to mind."
212010-142 = ""
212010-143 = "Where should we start...?"
212010-144 = ""
212010-146 = ""
212010-147 = ""
212010-148 = "Satsuki, wasn't there a strange sound that interrupted Makoto's speech?"
212010-149 = "What do you call it again...?"
212010-150 = "Ah! Trigger! Wasn't there a trigger code?"
212010-151 = ""
212010-153 = ""
212010-154 = "I believe you're right."
212010-155 = "It was a combination of specific words intended to trigger and awaken programming buried in the deep consciousness."
212010-156 = "W-Well... Can't we do something with that?"
212010-157 = "You know, like what if we played those words backwards?"
212010-158 = "As someone well-versed in this, I'd say that brainwashing can't be reversed by rewinding a tape..."
212010-159 = "Tch... Maybe I was oversimplifying it..."
212010-160 = "I wouldn't say that. Many difficult problems are solved with simple solutions."
212010-161 = ""
212010-166 = "Agh..."
212010-167 = "Eek, what's that awful ringing?"
212010-168 = "Now that you mention it, I kept hearing that high-pitched whine under the broadcast..."
212010-169 = ""
212010-171 = ""
212010-172 = "..."
212010-173 = "The frequency...?"
212010-174 = "[s] \"What's up, Satsuki?\""
212010-175 = "What if the trigger words were merely a signal? What if the real brainwashing began by using specific frequencies to awaken the deep subconscious...?"
212010-176 = ""
212010-178 = ""
212010-179 = "Satsuki...?"
212010-180 = "I-It looks like she's onto something...!"
212010-181 = "She's quite focused... We better not bother her."
212010-182 = ""
212010-184 = ""
212010-185 = ""
212010-186 = ""
212010-187 = ""
212010-188 = "I... I think I have a hunch."
212010-189 = "R-Really?!"
212010-190 = "There's no guarantee it'll work, but it's worth a try."
212010-191 = "I need to explore a few possibilities. I'll return to my office and conduct more research."
212010-192 = "Okay! I always thought you were kind of a freak, but you've been super helpful!"
212010-194 = "Iori...!"
212010-195 = "I see her point..."
212010-196 = "But Satsuki always steps up when something needs to be done."
212010-198 = "On my word as Intelligence Committee Director of the Pandemonium Society, I shall do my best."
212010-199 = "[s3] \"I'm counting on you, Satsuki.\"\n[s4] \"Call me if you need help.\""
212010-202 = "You too, Sensei."
212010-203 = "Ah, and this is also only a guess, but, regarding our brainwashed peers..."
212010-204 = "They likely won't show you any mercy if you oppose them."
212010-205 = "...!"
212010-206 = "The Tyrant Emperor was the same way."
212010-207 = ""
212010-210 = ""
212010-212 = "Please be careful. I'll find you if I have any results to share."
212010-213 = ""
212010-215 = ""
212010-217 = "...We should move too. It's risky to stay away from our posts for so long."
212010-218 = "Yes. And we can only do so much on our own."
212010-219 = "[s] \"I'll ask other students for assistance.\""
212010-220 = "Sensei, if Satsuki's concerns turn out to be true, wouldn't you be in the most danger?"
212010-221 = "You already stand out. If you do something that draws attention..."
212010-222 = "[s5] \"I'll act carefully.\"\n[s6] \"Thank you for worrying about me, Iroha.\""
212010-225 = "...I'm sure you'll act wisely."
212010-226 = "Thank you for supporting us, Sensei."
212010-227 = "You're truly, undeniably reliable."
212010-229 = "Yeah. You really are..."
212010-230 = "[s] \"Okay, then let's all return safely.\""
212010-232 = "Yes. Take care, everyone."
212010-233 = "We'll see you next time."
212010-235 = "Call us if anything happens!"
212010-236 = ""
212010-243 = "Aah..."
212010-244 = ""
212010-246 = ""
212010-247 = "And don't let some has-been Tyrant Emperor win...!"
212010-248 = "Just come back safely. Even stir up trouble if you want. I can do solo patrols for a bit."
212010-249 = "I'll even put up with the Pandemonium Society messing with me twice...three times, if that's what it takes!"
212010-250 = "So... Please..."
212010-252 = "..."
