[translation]
212010-1 = "第1話;慢了一步的應對"
212010-2 = ""
212010-3 = "……你說什麼？"
212010-4 = "[s] 「雷帝的……NK-ULTRA計畫？」"
212010-5 = "所以……那和皐月前輩研究的東西不一樣嗎？"
212010-6 = "完全不一樣。"
212010-7 = "雷帝夢寐以求的，是觸及人類根本的精神操控。"
212010-8 = "那是能隨心所欲操控人類深層意識的實驗。#n與單純的催眠截然不同，既邪惡又違反倫理。"
212010-9 = ""
212010-11 = ""
212010-12 = "大家可能很難理解，但這是事實。"
212010-13 = "[s] 「皐月，可以說得再詳細一點嗎？」"
212010-14 = "照理說，這件事我無論如何都不會說出口……"
212010-15 = "不過事情都到了這個地步，我就把我知道的告訴你們吧。"
212010-16 = "……是過去的事吧。#n前輩們不太願意提起的那些……"
212010-17 = "沒錯，是2年前的事了。"
212010-20 = "當時以恐懼支配格黑娜的雷帝……#n是個會若無其事地進行非人道、違反人倫實驗的人。"
212010-21 = "其中也有某個秘密開發中的程式。#n目的是抹殺學生個人的自由意志，統合整個學園的群體意識。"
212010-22 = ""
212010-24 = "幸好在那個計畫正式啟動前，包括真琴醬和我在內的反雷帝勢力採取行動，#n把雷帝趕下了台，所以才沒有進展到那個階段。"
212010-25 = "我們認為雷帝的方向是錯的，所以立刻銷毀了所有相關資料……"
212010-26 = ""
212010-28 = "當時檢視過雷帝所研究的計畫後，#n真琴醬的方針是「凡是與雷帝有關的內容，一律全部清除」。"
212010-29 = "因為其中有太多危險又令人難以接受的內容了……"
212010-32 = "可，可是現在的狀況……不是說那些資料全都銷毀了嗎？"
212010-33 = "所以我才認為現在的狀況很嚴重。"
212010-34 = "當時的研究確實還沒完成。#n相當於觸發機制的部分，在我們確認的時候也已經全部刪除了。"
212010-35 = "我們連它是怎麼運作的都不知道。"
212010-36 = "但為什麼偏偏是現在，過去的陰影又是如何復甦並襲向格黑娜的呢……"
212010-37 = "竟然有那種東西……真讓人難以置信……"
212010-38 = "雖然沒辦法讓你們看到過去，但可以讓你們感受到。"
212010-39 = "你也看到真琴醬和風紀委員長聯手，高喊要征服奇普托斯的樣子了吧，伊呂波。"
212010-40 = "……"
212010-41 = "[s] 「……」"
212010-42 = "為什麼只有3年級生變得不對勁……答案也在這裡。"
212010-43 = "因為2年前，雷帝的實驗是以當時的格黑娜學生們為對象。"
212010-45 = "所以在那之後入學的現任2年級和1年級生才會沒事啊……"
212010-46 = ""
212010-48 = ""
212010-49 = "那，那麼連現在不是3年級的人也……！？"
212010-50 = "你是想問，連已經「畢業」的前輩們也會受影響嗎？"
212010-51 = "這只是我的想法，不過應該不至於。"
212010-52 = "因為剛才的廣播能影響的範圍，頂多只有這座格黑娜學園內部。"
212010-53 = "如果是那樣，倒還算是不幸中的大幸……"
212010-55 = "皐月前輩，那他們……有辦法恢復原狀嗎？"
212010-56 = "我也不太清楚。"
212010-57 = "像中了我的催眠的真琴醬那樣，睡一覺起來就解除了……#n應該不會有那麼輕鬆的事吧。畢竟那是雷帝的遺產。"
212010-58 = "唉……該怎麼辦呢？"
212010-59 = "身為格黑娜萬魔殿的情報部長，我會盡我所能去做的。"
212010-60 = "我也不太想看到說出那種話的真琴醬呀。"
212010-61 = "我想要的是世界和平。#n我想打造一個沒有痛苦的世界，現在這樣完全不是我想要的方向啦。"
212010-62 = "沒想到連那個風紀委員長都會附和那種荒唐的事……"
212010-64 = "是啊。現在連我們的首席行政官也……"
212010-65 = "其實風紀委員會加入也是個問題，但真正的大問題在別的地方。"
212010-66 = "嗯？什麼問題？"
212010-67 = ""
212010-69 = ""
212010-70 = "就是真琴醬看起來是認真的。"
212010-71 = "呃……雖然這樣直說有點不好意思……"
212010-72 = "萬魔殿議長不就只是個麻煩的人嗎？#n就算是認真的，好像也不會構成多大的威脅吧……？"
212010-73 = ""
212010-75 = ""
212010-76 = "你是因為不太了解真琴醬，才會說出這種話。"
212010-77 = "真琴醬的可怕之處，在於只要有該鬥爭的對象，就會變得比任何時候都強。"
212010-78 = "而且對手越強，就越是如此。"
212010-79 = "以前和那個雷帝對抗的時候，正是真琴醬展現真本事的時期呢。"
212010-80 = "在那之後的對手雖然換成了風紀委員會……但好像從來沒有對他們拿出過真本事。"
212010-81 = "什麼？明明總是在製造麻煩啊。"
212010-82 = "只是麻煩已經算是萬幸了。"
212010-83 = "唔嗯……"
212010-84 = "我敢斷言，真琴醬一旦成為敵人就會非常棘手。#n那份執念與鬥爭心，在奇普托斯沒有人比得上。"
212010-85 = "既然那樣的真琴醬，已經下定決心要認真和整個奇普托斯鬥爭……"
212010-86 = "絕對不會那麼輕易結束的。"
212010-88 = "這話說得沒錯。那個人……雖然平常總是一副漏洞百出的樣子……"
212010-89 = "……"
212010-90 = "啊，等等。可是為什麼皐月議員沒事啊？#n3年級生不是全都變得不對勁了嗎？"
212010-91 = "嗯……雖然只是我的猜測，不過大概是因為我一直以來獨自進行的研究吧？"
212010-92 = "那是什麼……？該不會是那個催眠術？"
212010-93 = "沒錯。因為我自己也有在研究NK-ULTRA計畫。"
212010-94 = "雖然是從雷帝的研究得到靈感，但盡可能去除了強制性與違反倫理的部分……#n也就是所謂的「京極皐月流NK-ULTRA」。"
212010-95 = "順帶一提，提議直接沿用這個名字的是真琴醬哦。#n想法是用相同的名字，把它的存在本身蓋過去。"
212010-96 = "我想應該是那些研究的影響，洗腦才對我沒效吧。"
212010-97 = "你真的是正常的吧？真的沒事吧？"
212010-98 = "就說是了嘛。"
212010-100 = "……不管怎樣，這倒是值得慶幸。"
212010-101 = "那我們接下來該怎麼做才好？"
212010-102 = ""
212010-104 = ""
212010-105 = "[ns1] 「一起找出讓大家恢復原狀的方法吧。」\n[ns2] 「一起找出解除洗腦的方法吧。」"
212010-108 = "老師，能不能借用夏萊的力量呢？"
212010-109 = "唔嗯，我覺得那樣有點危險。"
212010-110 = ""
212010-112 = ""
212010-113 = "為什麼？"
212010-114 = "夏萊是直屬於聯邦學生會長的聯邦社團。#n這麼一來，聯邦學生會可能就會介入格黑娜的事。"
212010-115 = "這可能會影響到格黑娜自治區的主權本身。"
212010-116 = "[s] 「皐月說得對。」"
212010-117 = "說，說的也是……"
212010-118 = "格黑娜的問題，由格黑娜自己解決。"
212010-119 = "我希望盡可能守住這個原則。"
212010-120 = "當然，光靠我們解決不了的時候，尋求協助並不是壞事……"
212010-121 = "但我想，先由我們自己解決應該是最好的吧。"
212010-123 = "……我也同意。"
212010-124 = "要是格黑娜的高層認真說出要征服奇普托斯這件事傳到外面，#n光是這樣就會引發很大的混亂。"
212010-125 = "無論如何，都得在內部解決才行呢。"
212010-126 = "[s] 「嗯。無論如何都得想辦法。」"
212010-128 = "嗯。夏萊的協助就留作最後手段……"
212010-129 = "趁還沒錯過黃金時間，盡可能由我們自己想辦法解決。#n這就是目標吧？"
212010-130 = "是的，沒錯。"
212010-135 = "（之後雖然又討論了很多……）"
212010-136 = ""
212010-139 = "（卻沒能想出什麼好辦法）"
212010-142 = ""
212010-143 = "該從哪裡著手才好呢……"
212010-144 = ""
212010-146 = ""
212010-147 = ""
212010-148 = "皐月議員，那時候廣播裡不是傳出了奇怪的聲音嗎？"
212010-149 = "那個是，叫什麼來著？"
212010-150 = "啊！觸發機制！那不就是觸發機制嗎？"
212010-151 = ""
212010-153 = ""
212010-154 = "嗯，很有可能。"
212010-155 = "以沒有固定脈絡的特定詞語組合作為觸發機制，喚醒沉睡的深層意識。"
212010-156 = "那，那麼……那裡面會不會有提示？"
212010-157 = "比如說，把那些詞倒過來播給大家聽？"
212010-158 = "就我這個在心靈控制研究上投入不少時間的人來看，#n應該不存在像倒帶一樣就能解開的洗腦……"
212010-159 = "唔……是我想得太簡單了嗎……"
212010-160 = "那倒不見得。#n有時候，簡單的解決方法反而能解開困難的問題……"
212010-161 = ""
212010-166 = "唔……"
212010-167 = "嘖，那個聲音！聽得人心煩死了！"
212010-168 = "這麼說來，那種像是高頻音的聲音在廣播時也一直都有……"
212010-169 = ""
212010-171 = ""
212010-172 = "……"
212010-173 = "頻率……？"
212010-174 = "[s] 「皐月，想到什麼了嗎？」"
212010-175 = "透過頻率……如果觸發詞只不過是個訊號呢？#n如果真正的洗腦，是要先經過以特定頻率喚醒深層意識的階段……？"
212010-176 = ""
212010-178 = ""
212010-179 = "前輩……？"
212010-180 = "好，好像在拚命想些什麼……！"
212010-181 = "感覺非常認真……還是別打擾比較好。"
212010-182 = ""
212010-184 = ""
212010-185 = ""
212010-186 = ""
212010-187 = ""
212010-188 = "說不定……我發現了一點小線索。"
212010-189 = "真，真的嗎！？"
212010-190 = "雖然不保證是正確答案，但很值得一試。"
212010-191 = "我想到了好幾種方法。#n我先回去研究看看。"
212010-192 = "嗯！平常還覺得是個很奇怪的人，這種時候倒是很可靠嘛！"
212010-194 = "伊織……！"
212010-195 = "畢竟那也是事實……"
212010-196 = "不過該做的時候，那個人還是會做的。"
212010-198 = "哼嗯，身為萬魔殿的情報部長，總得拿出應有的表現吧。"
212010-199 = "[s3] 「拜託你了，皐月。」\n[s4] 「需要幫忙的話，隨時告訴我。」"
212010-202 = "嗯，老師也是。"
212010-203 = "啊，還有，雖然只是我的預測，現在被洗腦的人們……"
212010-204 = "對於反對自己意志的人，恐怕是不會手下留情的。"
212010-205 = "……！"
212010-206 = "因為那就是雷帝的作風。"
212010-207 = ""
212010-210 = ""
212010-212 = "所以……大家要小心。有成果的話我會通知你們的。"
212010-213 = ""
212010-215 = ""
212010-217 = "……那我們也先回去吧。#n離開太久的話，恐怕會有危險。"
212010-218 = "是啊……而且光靠我們自己，看來還是會有極限。"
212010-219 = "[s] 「我也去請其他學生幫忙看看。」"
212010-220 = "老師，如果皐月前輩擔心的事是真的，那最危險的不就是老師嗎？"
212010-221 = "本來就已經很顯眼了，要是再做出太超過的舉動……"
212010-222 = "[s5] 「我會小心行動的。」\n[s6] 「謝謝你的關心，伊呂波。」"
212010-225 = "……不過如果是老師的話，應該能明智地應對吧。"
212010-226 = "謝謝您像這樣和我們一起行動，老師。"
212010-227 = "真的，真的讓人覺得非常可靠。"
212010-229 = "嗯。就是說啊……"
212010-230 = "[s] 「那麼，大家回去的路上小心。」"
212010-232 = "好的。大家小心。"
212010-233 = "我們改天再見。"
212010-235 = "有什麼事就聯絡我！"
212010-236 = ""
212010-243 = "唉……"
212010-244 = ""
212010-246 = ""
212010-247 = "別輸給早已消失的雷帝遺產啊，前輩們……！"
212010-248 = "拜託你們快回來吧。#n闖禍也沒關係，暫時讓我一個人巡邏也沒關係。"
212010-249 = "被萬魔殿找麻煩兩次……不，就算是三次我也會忍下來的……！"
212010-250 = "所以……所以……"
212010-252 = "……"
212010-254 = "下一話;千夏"
