[translation]
10025040-1 = "제4화;어둠 속을 방황하는 자"
10025040-8 = "여기는 RABBIT 1. 현재 시각은 2030시. 지금 막 랑데부 포인트에 도착했습니다."
10025040-9 = "[ruby=해상박명종]EENT[/ruby]까지는 앞으로 약 30분. 그믐달이 뜬 무월광 취약 시기이기 때문에 소대원 모두 시야 확보에 유의 부탁드립니다."
10025040-10 = "여기는 RABBIT 2. 오히려 작전을 하기에는 더없이 좋은 밤이야."
10025040-11 = "상대는 우리의 존재를 알아차릴 수 없겠지만, 우리는 어둠 속에서도 피아를 구분할 수 있는 눈을 가지고 있으니까."
10025040-12 = "RABBIT 4, 조준경의 교체 작업은 끝났지?"
10025040-13 = "으, 응…… 시야가 생각했던 것보다 흐려서 [ruby=Night Level]NL 4 수준[/ruby]의 스코프로 교체했어."
10025040-14 = "적외선 스트로브의 상태도 괜찮은 것 같지만……"
10025040-15 = "왜? 다른 문제라도 있어?"
10025040-16 = "그게 뭔가…… 낮보다 비린내가 심해지지 않았어?"
10025040-17 = "무어라 형용할 수는 없지만…… 마을 곳곳에서 비릿하고 퀴퀴한 냄새가 풍겨 나오는 것 같은데."
10025040-18 = "……사실 저도 아까 전부터 비슷한 느낌을 받고 있습니다."
10025040-19 = "코를 찌르는 역한 비린내는 물론이고, 미량의 가스가 살포된 것처럼 피부가 따끔거리는 기분이 듭니다."
10025040-20 = "[USERNAME] 선생님께서는 괜찮으신지요?"
10025040-26 = "[ns1] \"조금 고약한 냄새가 나는 것 같긴 하지만……\"\n[ns2] \"큰 문제는 없는 것 같아.\""
10025040-30 = "혹시라도 이 비린내가 나쁜 징조면 어쩌지?"
10025040-31 = "솔직히 조금 긴장되는데……"
10025040-32 = "비린내 따위에 지레 겁먹기는. 어촌에서 비린내가 풍기는 게 뭐 대수라고."
10025040-33 = "비린내가 갑자기 심해진 이유야…… 뭐, 바다 쪽에서 바람이 불어서 그런 거 아니겠어?"
10025040-34 = "바보구나, 사키."
10025040-35 = "원래 해안 지역은 밤에는 육지에서 바다 방향으로 육풍이 부는 법이라고."
10025040-36 = "육지는 바다에 비해 비열이 낮기 때문에 기압차가 생긴다고, 과학 시간 때 배우지 않았어?"
10025040-37 = "[s] \"헷갈리기 쉬운 내용이니 암기하세요.\""
10025040-38 = "시, 시끄러워! 그쯤은 나도 알고 있거든……?!"
10025040-39 = "……여하튼 RABBIT 1, 이번 작전의 목표 지점은 어디야?"
10025040-41 = "우선은 해운업자가 말했던 <도깨비의 암초>로 먼저 향합니다."
10025040-42 = "주간에는 마을 사람들의 시선이 따가우니, 멋대로 신성한 암초를 조사하다가는 의도치 않은 원한을 살지도 모르니까요. 어둠이 짙은 심야의 작전에 적합합니다."
10025040-43 = "더욱이 오늘은 해운업자가 직접 경고한, 그믐달이 뜬 사리 때이니…… 주민들이 이 마을에서 숨기고자 했던 의외의 정보를 얻을 수 있을지도 모릅니다."
10025040-44 = "RABBIT 2는 저와 함께 수색조를 꾸려 목표 지점의 탐색을, RABBIT 4는 서쪽 해안 절벽 위에서 사주 경계를 부탁드리겠습니다."
10025040-46 = "알겠어."
10025040-47 = "미, 미야코 쨩…… 아니, RABBIT 1. 이번 작전 중에는 절대로 무전 끄면 안 돼……!"
10025040-49 = "알겠습니다. RABBIT 4도 이상이 발생하면 지체 없이 보고해 주세요."
10025040-50 = "그리고 RABBIT 3는 이곳 랑데부 포인트에서 머무르며 후방 지원을 부탁드리겠습니다."
10025040-51 = "저희가 자리를 비운 것을 알아채고 뒤를 쫓는 주민이 있을지도 모르니까요."
10025040-52 = "맡겨줘. 눈 크게 뜨고 지켜보고 있을 테니까."
10025040-54 = "그럼 [ruby=해상박명초]BMNT[/ruby]전까지 랑데부 포인트로 돌아올 수 있도록, 서둘러 이동합시다."
10025040-65 = "……정지."
10025040-66 = "RABBIT 2. 마을 쪽 45도 방향에 거수자 2인이 있습니다. 신원을 확인할 수 있나요?"
10025040-68 = "음…… 한 사람은 낚시 장화를 신고 어구를 들고 있는 모습이 어부 같아 보이는 데……"
10025040-69 = "그리고 그 앞을 가로막은 채 말을 걸고 있는 사람은 이 마을의 발키리 해경 학생이야."
10025040-78 = "무언가 날카로운 목소리가 간헐적으로 나는 데. 싸우고 있는 건가?"
10025040-79 = "RABBIT 3, 대화 내용을 확인 부탁드립니다."
10025040-80 = "곧 지향성 마이크를 작동시킬 테니 잠시만 기다려 줘."
10025040-87 = "……는 이제 슬슬 그만 만들면 안 될까요?"
10025040-88 = "온 마을에 퍼진 ……의 냄새 때문에 머리가 아플 지경이라고요!"
10025040-89 = "……우리라고 이걸 좋아서 만드는 줄 알아?"
10025040-90 = "새우가 통 팔리지 않으니 지금은 이거라도 팔아야지."
10025040-91 = "게다가 ……는 마을의 오랜 전통이기도 하고, 나이 든 어르신들은 싫어하지 않으니까."
10025040-92 = "그건 이 마을에서 태어나 자라 온 주민 여러분이나 참을 수 있는 거지, 저희는—"
10025040-93 = "너희들도 이 마을에 온 지 1년이 넘었는데, 언제까지 그렇게 낯을 가리고 있을 거야?"
10025040-94 = "이제는 마을의 일원으로서 익숙해질 때도 되었잖아. 우는소리는 그만 내."
10025040-95 = "우으으……"
10025040-96 = "그나저나, 전에 말한 ……는 어떻게 된 거야?"
10025040-97 = "부탁한 지 벌써 한 달이 넘었는데, 아직 아무런 조치도 없는 거야?"
10025040-98 = "어제도 그 ……때문에 새벽 조업을 나가던 어부 하나가 크게 다칠 뻔했다고."
10025040-99 = "죄송합니다. 하지만 저희 힘으로 가능한 게 거의 없어서……"
10025040-100 = "하지만 이대로 상황을 방치할 수는 없어."
10025040-102 = "이대로 가면 온 마을이 어둠에 잠기게 될지도 몰라……"
10025040-108 = "……마을을 뒤덮은 비린내가 의도된 것이라고?"
10025040-109 = "게다가 마을이 어둠에 잠기게 될지도 모른다니, 저게 도대체 무슨 소리야?"
10025040-110 = "저, 정말로 괜찮은 거겠지?"
10025040-111 = "갑자기 육지가 가라앉거나, 검은 해저가 솟아오른다거나…… 그런 일은 없겠지……?!"
10025040-112 = "진정하세요, 미유. 그런 일은 갑자기 일어나지 않으니까요."
10025040-113 = "하지만 시야가 어두워서 그런지, 계속 부정적인 생각이 들어……"
10025040-114 = "게다가 기분 탓인지…… 이제는 뭔가 이상한 소리도 들려오는 것 같아……"
10025040-115 = "어떤 목소리인가요?"
10025040-117 = "뭔가 경전을 외우는 것 같기도 하고…… 노래를 부르는 것 같기도 한데……"
10025040-118 = "미야코, 아니 RABBIT 1…… 정말로 괜찮은 거지……?"
10025040-125 = "……지금 계신 곳에서 가만히 기다려 주세요. 저희가 금방 그쪽으로 가겠습니다."
10025040-126 = "RABBIT 2. 현재 RABBIT 4의 상태가 좋지 않은 것 같으니, 회수 후 조를 다시 정비하는 게 좋을 것 같습니다."
10025040-127 = "확인. 나도 이견은 없어."
10025040-128 = "……하지만 상황이 이쯤 되니 나도 좀처럼 진정이 되지 않는걸."
10025040-129 = "마을의 분위기도 그렇고, 주민들의 말과 행동도 그렇고…… 단순히 새우 조업과 관련된 문제라고 치부하기에는 다들 너무나 수상해."
10025040-130 = "선생님은 어떻게 생각해?"
10025040-131 = "[s3] \"마을 사람들의 언행이 이상한 건 사실이지만……\"\n[s4] \"일단은 미유의 상태를 보러 가자.\""
10025040-134 = "네. 일단 고민은 뒤로 미루고, 지금은 정보 수집에 집중합시다."
10025040-135 = "……여름의 밤은 생각보다 길지 않으니까요."
10025040-143 = "……RABBIT 4, 괜찮으신가요?"
10025040-144 = "어이, RABBIT 4. 데리러 왔어."
10025040-146 = "아아…… 아아아……"
10025040-147 = "무슨 일이야. 그사이에 습격이라도 당한 거야?"
10025040-148 = "저, 저기…… 저기 바닷가에……"
10025040-156 = "제발…… 이번에도 실패하면 정말 끝이라고……"
10025040-157 = "<깊은 곳의 존재들>이든 뭐든, 누구든 좋으니 정말로 존재한다면 제발 좀 나타나 줘……"
10025040-158 = "샌드위치— 샌드위치— 베이글 파탕—"
10025040-159 = "……그나저나 이 주문이 정말 맞는 거야?"
10025040-161 = "……악마를 소환하고 있다!"
10025040-163 = "누, 누구야? 이런 야심한 밤에……"
10025040-168 = "그건 우리가 할 소리다! 너야말로 여기서 무얼 하고 있는 거야?"
10025040-169 = "그, 그건 그러니까……"
10025040-171 = "에잇, 귀찮아지기 전에 도망치자!"
10025040-172 = "RABBIT 2, 놓쳐서는 안 됩니다!"
10025040-173 = "놓칠까 보냐!"
10025040-174 = "가, 같이 가……!"
10025040-181 = "[ns] \"잠깐만 다들 기다려—\""
10025040-190 = "헉, 헉…… 그 녀석, 어디로 간 거지?"
10025040-191 = "덩치는 곰 같은데 토끼처럼 재빠르기는……"
10025040-192 = "그보다 정신없이 뒤를 쫓다 보니 길을 잃은 느낌이네. 여기가 어디지?"
10025040-193 = "게다가 아까 전부터 나던 비린내가 더 고약해진 느낌이…… 우왓?!"
10025040-200 = "괘, 괜찮아……?"
10025040-205 = "RABBIT 2, 괜찮으신가요?"
10025040-212 = "무, 문제없어. 그저 뭔가 미끄러운 걸 밟고 미끄러진 것뿐이야."
10025040-213 = "그보다 이게 뭐지……? 생선 내장……?"
10025040-215 = "히, 히이……"
10025040-216 = "……곳곳에 손질되고 남은 생선의 머리뼈가 버려져 있군요."
10025040-217 = "지금은 쓰이지 않는 버려진 덕장 같은 곳일까요?"
10025040-219 = "버려진 장소라고 하기에는 최근에 사람이 다녀간 흔적이 있어."
10025040-220 = "게다가 건조대 위의 방치된 생선도 물기가 채 마르지 않았고……"
10025040-222 = "미, 미야코 쨩…… 사키 쨩…… 여기……"
10025040-223 = "RABBIT 4, 작전 중에는 호출명을 쓰라고 했잖아. ……그보다 무슨 일인데?"
10025040-224 = "여기 항아리 안에…… 검고 탁한 빛깔의 비린 물이 잔뜩……"
10025040-226 = "어디, 어디……"
10025040-231 = "윽, 비린내……!"
10025040-232 = "마을 전체를 뒤덮고 있던 악취가 모두 여기서 나던 거였나?"
10025040-233 = "……건조대 위에 올려진 생선도 모두 썩은 것 같군요."
10025040-234 = "마치 일부러 부패시키기 위해 이곳에 날생선을 방치한 것처럼 보입니다."
10025040-235 = "이해할 수가 없어. 외부로는 어획량이 줄었다고 불평을 하면서, 한편으로는 일부러 생선을 썩히고 있었다니……"
10025040-236 = "……이런 말을 하고 싶지는 않았지만, 이쯤 되니 의심의 여지가 없군요."
10025040-237 = "마을 사람들은 정말로 이곳에서 수상한 종교의식을 치르고 있었을지도—"
10025040-243 = "……새벽부터 덕장이 소란스럽다 싶더니만, 도둑고양이가 들었었나."
10025040-248 = "처음부터 이 별 볼 일 없는 마을에 관광을 왔다고 해서 수상하게 여겼었는데…… 역시 이곳의 생선을 노리고 들어온 놈들이었군."
10025040-250 = "뭐? 도둑……?"
10025040-251 = "그런 썩은 생선 따위, 누가 거저 준다고 해도 받을까 보냐!"
10025040-256 = "썩은 생선……? 썩은 생선이라고……?!"
10025040-257 = "하하, 정말 어처구니없는 녀석들이로군!"
10025040-259 = "잘 알지도 못하면서 혓바닥만 멋대로 놀리는 꼴이 그동안 이 마을을 찾아온 외지인들과 하나도 다르지 않아……!"
10025040-260 = "……이 마을에서 지금 무슨 일이 벌어지고 있는 거죠?"
10025040-261 = "이제 와서 그 질문을 던지는 건가."
10025040-262 = "……미안하지만 그 질문에는 답할 수 없다."
10025040-263 = "나는 남의 집 안방에 흙발로 쳐들어오는 무례한 녀석들과 담소를 나눌 정도로 친절하지 못하거든."
10025040-273 = "……이 애송이들에게 야토우라 마을의 공포를 보여주자고."
10025040-279 = "어느새 포위당했나……!"
10025040-280 = "공포를 상대하는 일이라면 저희들도 익숙하지요."
10025040-282 = "……전원, 교전 개시. 전투 대형으로 산개합니다!"
