[translation]
1012902-1 = "트리니티의 마법 자경단"
1012902-2 = "(야근 중에, 스트레칭 겸 샬레를 돌아보기로 했다.)"
1012902-13 = "(늦은 시간인데, 탈의실의 불이 켜져 있었다.)"
1012902-14 = "[ns1](소등을 깜빡하고 간 건가?)\n[ns2](누가 아직 안에 있나? 혹시 모르니까…….)"
1012902-19 = "[ns3] (아무도 없는 것 같다.)\n[ns4] 나는 천천히 문을 열었다."
1012902-27 = "[wa:270]― [log=스즈미 매지컬]서,[wa:350] 선생님!![/log]"
1012902-30 = "― [log=스즈미 매지컬]여, [wa:330]여기는 [wa:460]무슨 일로?![/log]"
1012902-32 = "― [log=스즈미 매지컬]아니, [wa:820]언제부터 계셨나요![wa:120] [/log]"
1012902-35 = "[ns5] \"미안 스즈미!! 아무도 없는 줄 알고!!\"\n[ns6] \"혹시나 해서 노크하고 들어왔는데, 미안!\""
1012902-36 = "[wa:770]― [log=스즈미 매지컬]음악에 집중하느라, [/log]"
1012902-37 = "[wa:770]― [log=스즈미 매지컬]음악에 집중하느라, [/log]"
1012902-39 = "― [log=스즈미 매지컬]전혀 눈치채지 못했습니다……[/log]"
1012902-42 = "― [log=스즈미 매지컬]그래도,[wa:550] 상대가 선생님이셔서 [wa:290]다행입니다. [/log]"
1012902-45 = "[wa:2300]― [log=스즈미 매지컬]앗, [wa:630]이,[wa:450] 이 옷은,[wa:980] 그게……![/log]"
1012902-47 = "― [log=스즈미 매지컬]자경단의[wa:800] 잠입수사를[wa:630] 위해서 [wa:370]준비한 옷, 인데요……[/log]"
1012902-50 = "― [log=스즈미 매지컬]제,[wa:250] 제 취미는……![wa:160] [/log]"
1012902-52 = "― [log=스즈미 매지컬]아닙니다![wa:620] 정말로요![/log]"
1012902-55 = "[ns] \"스즈미, 엄청 귀여워!\""
1012902-56 = "[wa:430]― [log=스즈미 매지컬]사이즈가 맞는지, [/log]"
1012902-58 = "― [log=스즈미 매지컬]미리 [wa:270]확인하려는 것 [wa:1190]뿐입니다……! [/log]"
1012902-61 = "― [log=스즈미 매지컬](귀,[wa:850] 귀엽다고 해주셨습니다……)[wa:40] [/log]"
1012902-63 = "― [log=스즈미 매지컬](갑자기 칭찬하시면…… [wa:1910]우우……!)[/log]"
1012902-66 = "― [log=스즈미 매지컬](칭찬을 듣는 건 [wa:690]역시 아직 익숙하지 않습니다.)[/log]"
1012902-68 = "― [log=스즈미 매지컬](기쁘지만……! [wa:2580]그렇지만……!)[/log]"
1012902-71 = "[wa:1170]― [log=스즈미 매지컬]오늘 보신 것,[/log]"
1012902-73 = "― [log=스즈미 매지컬]다른 분들에게는[wa:530] 비밀입니다![wa:120] [/log]"
1012902-76 = "― [log=스즈미 매지컬]이건, [wa:1320]기밀사항……[wa:1490] 이니까요![/log]"
1012902-79 = "그런데, 탈의실에는 무슨 일로 오셨나요?"
1012902-80 = "[s7]\"불이 켜져 있길래 소등하려고 했어.\"\n[s8]\"혹시라도 누가 쓰러졌을 수도 있고.\""
1012902-83 = "그렇군요, 선생님도 샬레를 순찰하시는군요."
1012902-84 = "학생들의 안전을 위해서. 마치 자경단 같다고 생각합니다."
1012902-85 = "[s]\"스즈미를 보고 배웠나 봐.\""
1012902-86 = "!!!"
1012902-87 = "……선생님은, 항상 용기를 주시는군요."
1012902-88 = "그런 점이……."
1012902-92 = "저…… 이제 옷을 다시 갈아입어야……."
1012902-93 = "[s]\"앗, 미안!! 넋 놓고 있다가!!\""
1012902-94 = "다음에 뵙겠습니다."
1012902-98 = "오늘 일은 정말 비밀입니다!"
1012902-100 = "(사무실로 돌아갔다.)"
1012902-101 = "(얼마 후, 다시 가보니 탈의실 불은 꺼져있었다.)"
