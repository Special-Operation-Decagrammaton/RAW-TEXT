[translation]
32175-2 = "……흐응. 과연. 이래서 다들 <샬레> 를 찾는 건가. 정말이지 성가시구나, 어른이란 건."
32175-3 = "뭐, 예상외긴 해도 괜찮아. 시간을 너무 낭비한 것 같지만……."
32175-4 = "세이아 쨩도, 나기 쨩도 없어졌으니까. 이제 간신히 시작할 수 있게 되었는데, 여기서 물러날 순 없지."
32175-5 = "……!"
32175-6 = "자아, 충원은 이어지고 있어. 계속 해볼까?"
32175-7 = "미카 씨! 세이아 쨩을 습격한 것도 당신이 시킨 일이었나요?!"
32175-8 = "……응?"
32175-9 = "아하하. 무슨 소리야, 왜 그런 눈으로 날 보는 거야? 하나코?"
32175-10 = "그야 당연히 내가 시킨 일이지. 세이아 쨩은 맨날 이상한 소리만 했으니까. 낙원이니 뭐니 영문을 알 수 없는 소리만 하고."
32175-11 = "하지만 헤일로를 파괴하라고는 하지 않았어. 나는 살인자가 아냐."
32175-12 = "그냥 졸업할 때까지 감옥 같은데 가둬둘 생각이었어. 그치만 그 습격조들이 멋대로 그렇게 해버린 거야."
32175-17 = "……."
32175-18 = "응, 살인자라면…… 거기 있는 아즈사 쨩? 너 세이아 습격조였잖아? 뭐라고 말 좀 해줘. 너 때문에 내가 오해받고 있잖아."
32175-19 = "세이아 쨩을 그렇게 만들어버리는 바람에, 모든 게 엉망이 되어버렸잖아."
32175-20 = "응? 덕분에 나는 이렇게, 돌이킬 수 없게 되어버렸단 말야? 너희들 때문에."
32175-28 = "그, 그건……."
32175-29 = "아즈사 쨩……? 이건 무, 무슨 얘기……?"
32175-30 = "아, 아냐……. 그건……."
32175-34 = "응?"
32175-35 = "바, 밖에서 일군의 학생들이 이쪽으로 오고 있습니다……!"
32175-36 = "그럴 리가. 티파티의 경비 계엄 명령을 어기는 녀석들이 교내에 남아 있을 리가……."
32175-37 = "……. 아뇨. 아직 남아 있어요. 티파티도, 그 누구도 명령할 수 없는 독립된 조직이……."
32175-38 = "병력들, 대성당에서 나오고 있습니다!"
32175-42 = "시스터들입니다! 시스터후드가 오고 있습니다!!"
32175-49 = "다음화;그런 세계 2"
