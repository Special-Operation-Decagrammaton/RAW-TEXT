[translation]
2003502-1 = "또 다른 수행(?)"
2003502-5 = "후우웅……. 코오……."
2003502-8 = "[ns] \"……츠바키 씨?\""
2003502-9 = "우웅……?"
2003502-13 = "아, 선생님이네……. 어서 와……. 기다리고 있었어……."
2003502-14 = "[s] \"옷을 바꿔 입었다길래, 어떤 옷인가 했더니…….\""
2003502-15 = "맞아. 이거야말로……."
2003502-19 = "수면 가이드를 위한…… 유니폼이야……!"
2003502-23 = "언제나 어디서나 숙면을 잊지 않는 것……."
2003502-24 = "그것이 나의 수행이니까……. 후아암……."
2003502-25 = "[s] \"수면, 가이드……?\""
2003502-26 = "우웅……. 원래는 백귀야행을 찾아오는 사람들을 안내하는…… 수행을 하고 있었는데……"
2003502-27 = "생각해 봐, 선생님……."
2003502-28 = "요즘…… 수면 부족이 큰 사회 문제잖아……?"
2003502-29 = "[s] \"그랬던가……?\""
2003502-30 = "그럴 거야……."
2003502-31 = "그래서…… 생각했어……."
2003502-32 = "가이드라는 건 결국, 어딘가로 누군가를 안내하는 거지……?"
2003502-33 = "그렇다면……."
2003502-34 = "사람들에게 수행부의 부장으로서…… 숙면에 대한 가이드를 해 주는 것도……."
2003502-35 = "가이드의 일종이 아닐까, 하고……."
2003502-36 = "[s] \"잘 모르겠지만, 아무튼 수면 가이드라는 거구나…….\""
2003502-37 = "응……. 그런 거야. 하아암……."
2003502-38 = "그러면 선생님……. 지금부터 내가 백귀야행을 가이드해 줄게……."
2003502-39 = "응? 수면 가이드가 아니었느냐고……?"
2003502-40 = "이야기했지만…… 원래는 백귀야행을 찾아오는 사람들을 안내하는…… 수행을 하고 있었으니까……"
2003502-41 = "그리고 일을 열심히 하면…… 편한 마음으로 푹 잘 수 있거든……."
2003502-42 = "그러니까 이것도, 수면 수행 가이드의…… 일환인 거지……."
2003502-46 = "쿠울……."
2003502-47 = "[ns] \"벌써부터 잠들면 안 된다고 생각해!\""
2003502-53 = "[ns1] \"백귀야행을 가이드해 준다고 들은 것 같은데…….\"\n[ns2] \"수행부 부실로 와 버린 것 같은데요, 츠바키 씨?\""
2003502-56 = "……."
2003502-57 = "수행부 부실도…… 백귀야행의 장소야……."
2003502-61 = "코오……."
2003502-62 = "[s3] \"그 말이 틀린 건 아니긴 한데!\"\n[s4] \"그리고 부실에 오자마자 잠들면 안 되지 않을까?!\""
2003502-65 = "우웅……?"
2003502-66 = "그렇네……. 선생님을 안내해야지……."
2003502-67 = "[s] \"응, 그래! 그거!\""
2003502-68 = "……."
2003502-69 = "있잖아, 선생님……."
2003502-70 = "사람은…… 인생의 3분의 1을 자는 데 써야 한대……."
2003502-71 = "수면이 모자라면…… 노폐 물질이 쌓여서 뇌세포가 손상되고……."
2003502-72 = "결국에는…… 뇌가 스스로 모든 감각을 차단시키고, 스스로를 강제로 재운다고 해……."
2003502-73 = "그것도 모자라서…… 잠이 모자라면……."
2003502-77 = "체내 면역기관이 제대로 작동하지 않게 되고…… 바이러스나 세균 등의 감염위험에도 취약해진다고도 해……."
2003502-78 = "[s] \"츠바키가 엄청나게 전문적인 이야기를 하고 있어!\""
2003502-79 = "그러니까, 잘 자는 건…… 나 자신을 위해서도, 선생님 본인을 위해서도, 정말로 중요하다는 거야……."
2003502-80 = "응……. 지금의 나는 수면 가이드 카스가 츠바키……."
2003502-84 = "그러니까 선생님……?"
2003502-85 = "우리 같이, 여기서 푹 자자……?"
2003502-91 = "(츠바키는 이내 수행부 부실에 드러누워, 그렇게 편안해 보일 수 없는 표정으로 깊은 잠에 빠졌다.)"
2003502-92 = "(츠바키에게 이불을 덮어주고, 샬레로 돌아왔다…….)"
