[translation]
10000070-1 = "제7화;짓밟는 음모, 그리고"
10000070-3 = "분명 이곳으로 선생님을 끌고 왔는데……."
10000070-4 = "설마, 고용주가……?"
10000070-7 = "(이건 대화하는 소리!!)"
10000070-8 = "분명 이쪽이니까. 들키지 않으려면 천장에 숨어들어서……."
10000070-16 = "대화를 나누는 소리는 분명, 이 아래에서 들려왔는데……."
10000070-18 = "보스! 명령한 대로 데리고 왔어!"
10000070-19 = "데리고 왔슴다!"
10000070-20 = "잘했다. 망량즈. 역시 일 처리가 빠르군."
10000070-21 = "(저건 망량즈랑 고용주……. 그리고 선생님!!)"
10000070-23 = "만나서 반갑군. 샬레의 고문 선생."
10000070-28 = "[ns] \"……상인회장 냥텐마루?\""
10000070-30 = "흥, 나는 냥텐마루가 아니다!"
10000070-31 = "내 이름은 마사무네……."
10000070-32 = "뒷골목의 독안룡! 냥테 마사무네다!"
10000070-33 = "(두-둥!)"
10000070-34 = "(………….)"
10000070-36 = "흠흠……. 뛰어난 전술 지휘 실력을 가진 이가 우릴 방해한다길래, 대체 누군가 했더니."
10000070-37 = "샬레의 선생님이란 자가 자네였군?"
10000070-38 = "확실히 백야당에서 안면이 있었지?"
10000070-39 = "[s1] \"그랬던 거 같기도 하고.\"\n[s2] \"아닌 거 같기도 하고.\""
10000070-40 = "크흐흐! 이런 상황에서도 여유를 부리는 걸 보니 나름 준비한 수가 있나 본데."
10000070-41 = "크흐흐! 이런 상황에서도 여유를 부리는 걸 보니 나름 준비한 수가 있나 본데."
10000070-42 = "미안하지만, 그쪽이 믿고 있는 수단이라면 이미 여기 있네."
10000070-44 = "[s] \"핸드폰을…….\""
10000070-45 = "내 조심성이 많아서 말이야. 이건 이렇게 압수하도록 하지."
10000070-46 = "자, 이걸로 도움을 요청할 수단은 없다네."
10000070-47 = "애타게 불러도 마츠리부 녀석들은 오지 않아. 고립무원이란 말이 딱이야."
10000070-48 = "이제 좀 어떤 상황인지 파악이 되나?"
10000070-49 = "[s3] \"……왜 이런 짓을 하는 거지?\"\n[s4] \"축제를 방해해서 대체 무슨 이득이 있다고?\""
10000070-53 = "[ns] \"혹시, 축제의 전통 때문인가?\""
10000070-54 = "응? 뭐? 전통? 아, 그 불꽃놀이 어쩌고 하는 거 말인가?"
10000070-55 = "크하하! 재미있는 말을 하는군!"
10000070-56 = "백야당에서 했던 그 말은 그냥 해본 이야기일세."
10000070-57 = "내 목적은 간단해. 돈 때문이지."
10000070-58 = "[s] \"돈……?\""
10000070-59 = "백야앵제가 한 번 개최되었을 때 대체 얼마나 되는 돈이 움직일 것 같나?"
10000070-60 = "그런데 그 돈을 마츠리운영관리부, 그 꼬맹이들이 꽉 쥐고 있단 말씀이야. 난 그게 마음에 안 들어."
10000070-61 = "뭐? 축제는 즐거워야만 한다고?"
10000070-62 = "그걸 위해서라면 얼마나 큰 돈이 들어도 밀레니엄에서 장비를 빌려와도 괜찮다고?"
10000070-63 = "이 얼마나 어설픈 생각인가! 나라면 그 녀석들보다 훨씬, 훨씬 더 많은 돈을 벌 수 있거늘!"
10000070-64 = "[s] \"그래서 일부러 축제를 망치려고?\""
10000070-65 = "맞아. 소동을 피웠지."
10000070-66 = "축제가 중지되면, 마츠리부는 그 책임을 지고 축제운영위원회의 자리에서 물러날 수밖에 없을 테니까."
10000070-67 = "그 뒤엔 이 몸이 축제를 장악하면 될 일이야."
10000070-68 = "[s] \"그걸 위해 이즈나를…….\""
10000070-69 = "이즈나라면, 그 자칭 닌자 꼬맹이 말인가?"
10000070-70 = "그래, 그 이즈나가 정말 많은 도움이 되었지."
10000070-71 = "딱히 큰돈을 들이지 않았는데도 불구하고……."
10000070-72 = "아주 조금 그 [ruby=놀이]닌자 놀음[/ruby]에 어울려준 것만으로도 이렇게나 활약해주다니."
10000070-73 = "이야, 혼자서 먕랑즈 수십 명 분 일을 해주던데, 엄청난 전력이었네."
10000070-74 = "[s] \"닌자놀음……?\""
10000070-75 = "맞아. 닌자 놀음, 유치하기 짝이 없는 어린아이 장난."
10000070-76 = "'고용주로서 명령만 내려 달라'느니, '고용주를 위해 방해꾼을 해치우는 게 닌자의 길'이라느니."
10000070-77 = "정말 듣는 내내 속으로 얼마나 웃겼는 줄 아나?"
10000070-78 = "그런 웃기지도 않는 놀이에 아주 조금 맞장구만 쳐줬더니."
10000070-79 = "마구 의욕을 내면서 '닌자로서 전력을 다하겠다!' 라고 할 때는 아무리 나라고 해도 대폭소 했었지!"
10000070-80 = "이제 와서 하는 말이지만 닌자라니, 무진장 웃긴 놈이라니까!"
10000070-81 = "솔직히 옆에서 보고 있는 것만으로도 웃겨서 힘들었음다."
10000070-82 = "정말 편리해. 정말 경제적인 놀이였네! 크크큭!"
10000070-83 = "[s] \"……즉 자기만을 위해 이즈나의 꿈을 이용했단 건가.\""
10000070-84 = "꿈? 무슨 헛소리인가?"
10000070-85 = "그 멍청한 놀음에 꿈이니 뭐니 하는 소리를 하다니. 자네 제정신인가?"
10000070-87 = "!!"
10000070-88 = "(고용주는, 분명 이즈나에게 닌자로서……, 활약해달라고…….)"
10000070-89 = "(하지만, 그게 전부……. 이즈나를 속이려고 꾸민 거짓말이었, 던 건가요……?)"
10000070-90 = "(이즈나는 그 말에 바보같이, 속아서……!)"
10000070-91 = "말하는 투를 보아하니, 자네도 이즈나가 내 명령을 듣고 움직이고 있던 걸 눈치챈 모양이지?"
10000070-92 = "망량즈와 이즈나가 내 명령을 듣고 있다는 걸 알면서도 이즈나와 동행하다니, 좀 머리가 모자란 거 아닌가?"
10000070-93 = "이즈나를 내버려두면 녀석을 통해 선생이란 자를 발견할 수 있을지 몰라. 그러니 망량즈를 시켜 이즈나를 미행시키다, 기회를 봐서 유괴한다."
10000070-94 = "어디까지나 책략의 하나였을 뿐이지만, 재미있을 정도로 잘 맞아떨어졌군. 이즈나가 정말 큰 도움이 되었어! 하하하!"
10000070-95 = "……!!"
10000070-96 = "(고용주에게 속은 이즈나 때문에……!)"
10000070-97 = "(꿈을 응원해주었던 선생님이……!)"
10000070-99 = "[ns] \"이즈나랑 만난 건 분명 조심성이 부족했을지도 몰라.\""
10000070-100 = "뭐야, 잘 알고 있잖나."
10000070-101 = "[s] \"하지만 그건 이즈나 잘못이 아니야.\""
10000070-104 = "……선, 생님?"
10000070-107 = "[ns] \"유치한 닌자 놀이……라고 했었지?\""
10000070-108 = "그래, 놀이다. 하찮은 꼬맹이의 소꿉장난이었지."
10000070-109 = "그게 뭐, 어쨌다고?"
10000070-110 = "[s] \"그렇다면 틀렸어. 닌자란 건 말이야…….\""
10000070-116 = "[ns5] \"무진장 멋있다고!!\"\n[ns6] \"그것만으로도 로망이라고!!\""
10000070-117 = "!!"
10000070-118 = "!!"
10000070-120 = "……(쩌억)"
10000070-121 = "으, 응?"
10000070-122 = "로, 로망이 뭠까?"
10000070-123 = "뭐? 로망……?"
10000070-124 = "[s7] \"유치한 장난? 어린애 같은 장난? 그게 뭐 어쨌다고?\"\n[s8] \"멋있으면 됐잖아!\""
10000070-125 = "……하."
10000070-126 = "……하."
10000070-127 = "크하하하하! 이거 참 걸작이로군!"
10000070-128 = "샬레의 선생이라길래, 조금은 말이 통하는 놈일 줄 알았는데 말이야!"
10000070-129 = "설득하려던 건 취소다. 헛소리만 주워섬긴다면 여기까지다!"
10000070-130 = "내 계획을 방해한 샬레의 선생님, 너는 여기서 작별이다! 망량즈! 쳐라!"
10000070-131 = "네엡! 이야아압!"
10000070-140 = "으응?! 갑자기 천장이 무너진다고?! 무슨 일이냐?!"
10000070-141 = "쿨럭쿨럭! 뭐, 뭡니까?! 보스?!"
10000070-142 = "까, 깜짝 놀랐슴다!"
10000070-144 = "닌닌! 최강을 목표로! 닌자의 길을 걷는 이즈나!"
10000070-145 = "여기에 화려하게 등장!"
10000070-146 = "[s] \"이즈나!\""
10000070-147 = "이즈나?! 어째서 천장에서 튀어나오는 게지?!"
10000070-148 = "이즈나, 이야기는 전부 들었습니다."
10000070-149 = "선생님이, 끝까지……. 마지막까지 이즈나의 꿈을 응원해준 목소리를!"
10000070-150 = "그래서, 이즈나는 깨달았어요!"
10000070-153 = "선생님 곁이라면, 이즈나는 언제까지고 꿈을 꿀 수 있다는 걸!"
10000070-154 = "뭣이?!"
10000070-155 = "선생님……."
10000070-156 = "아니, 이즈나의 주군!"
10000070-157 = "[s] \"……어? 주군?!\""
10000070-159 = "지금부터 이 이즈나가, 주군의 곁에서 같이 싸우겠습니다! 닌닌!"
