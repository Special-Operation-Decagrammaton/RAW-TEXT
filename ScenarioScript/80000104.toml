[translation]
80000104-1 = "따를 수는 없지만"
80000104-2 = "아, 선생! 이쪽이야. 이쪽!"
80000104-3 = "기다리고 있었다고, 하하! 오늘이 무슨 날인지는 알고 있겠지?"
80000104-4 = "……음? 모르는 거야? 뭐, 지나가듯 예전에 한 번 말했으니 잊어버렸을 수도 있으려나."
80000104-5 = "오늘은 말이지……."
80000104-6 = "[s1] \"……아! 발렌타인 데이!\"\n[s2] \"사실 알고 있었어. 발렌타인 데이잖아?\""
80000104-9 = "……?"
80000104-10 = "……선생?"
80000104-11 = "지금 뭐라고……."
80000104-12 = "[s3] \"음? 어째 분위기가…….\"\n[s4] \"트, 틀렸어? 맞지 않나……?\""
80000104-15 = "……선생."
80000104-16 = "설마 다른 사람도 아닌. 용역부의 부장인 내가……"
80000104-17 = "부르주아들이 만든, 자본주의의 상술과도 같은 이 날을 기념할 거라고 생각한 건 아니겠지?!"
80000104-18 = "[s] \"하지만 하루 정도라면 기념해도……\""
80000104-19 = "절대로 안 돼!"
80000104-20 = "오히려 그 하루이기 때문에 소비자들은 초콜릿이 비싼 가격에 팔리더라도 울며 겨자 먹기로 초콜릿을 사게 되는 거라고!"
80000104-21 = "심지어 발렌타인 초콜릿은 대체로 화려한 포장지로 덮혀있지만 그 안을 뜯어보면, 평소에도 살 수 있는 헐값의 초콜릿이 들어있지!"
80000104-22 = "이는 연인들의 애틋한 마음을 돈벌이로 취급하는…… 거대 기업의 만행이나 다름없다고!"
80000104-23 = "절대로 용납할 수 없어. 할 수만 있다면 달력에서 이 날을 지워버리고 싶을 정도야!"
80000104-24 = "[s5] \"그렇게 말하는 사람이 또 있었던 것 같지만……\"\n[s6] \"그럼 발렌타인 데이가 아니라면 무슨 용건으로……?\""
80000104-27 = "정말로 기억하지 못하는 건가……"
80000104-28 = "오늘은 전에 내가 맛있는 가츠동 가게를 소개해 주겠다고 한 날이잖아."
80000104-29 = "빨리 가자. 이 근처에 있는 엄청난 맛집을 알아 놓았다고."
80000104-30 = "사람이 몰릴 수 있으니 서둘러야 해. 늦지 않게 따라와!"
80000104-35 = "(이후 미노리와 함께 근처의 식당에서 식사를 했다.)"
80000104-36 = "(자신만만해했던 미노리의 말대로, 맛도 좋고 양도 푸짐한 식당이었다.)"
80000104-38 = "아~ 정말 좋았다. 특별하지 않은 재료만 써서 만든 평범한 음식이지만, 이 소박한 맛이 정말 마음에 들어!"
80000104-39 = "아, 그러고 보니 선생님은 바쁘지? 아마 오늘도 다음 일정이 있었던 걸로 기억하는데."
80000104-40 = "그럼 가기 전에 이걸……."
80000104-45 = "[ns7] \"……응? 나 주는 거야?\"\n[ns8] \"발렌타인 데이는 안 챙긴다고 하지 않았어?\""
80000104-48 = "그, 그건 그러니까……."
80000104-49 = "기업의 횡포에 놀아나지 않겠다고 했지, 초콜릿을 주는 것 자체는 문제가 없으니까……."
80000104-50 = "우리가 평소에 일할 때도 즐겨 먹는 초콜릿 바야. 모양은 조금 투박해도 밖에서 파는 거추장스러운 것들보다는 맛도 영양도 훨씬 좋을걸."
80000104-51 = "그러니까……."
80000104-55 = "뭐, 뭘 그렇게 보는 거야? 그렇게 보니까 괜히 무안해지잖아!!"
80000104-56 = "그, 그럼 나는 이만 간다!! 선생님도 좋은 하루!!"
80000104-57 = "……또 봐!!"
80000104-64 = "(……확실히 맛있었다.)"
