[translation]
10056060-1 = "第6話;密航者"
10056060-2 = "狭い操舵室内"
10056060-5 = "……宝の地図？"
10056060-9 = "そう。昨日の依頼主から受け取ったんだ。"
10056060-10 = "ポイントはD.U.から12海里のブルーホール。古い沈没船があるんだって。"
10056060-11 = "その積み荷をサルベージしてくれば買い取ってくれるって話だけど……。"
10056060-12 = "みんなはどう思う……？"
10056060-13 = "……何か裏はありそうかな。"
10056060-14 = "でもまあ、私たちに頼むのも理解はできる。#nブルーホールに沈んでる物を引き上げるのは難しいから。"
10056060-15 = "あやしい。"
10056060-16 = "前から沈没船の位置を知ってたなら、もっと早く動けたはずなんだよね。"
10056060-17 = "いまさら私たちに依頼する理由は？"
10056060-18 = "狙ってる貨物の中に、キャラクターのフィギュアがあるって言ってたよ。"
10056060-19 = "前は人気なかったけど、最近になって流行り始めて、フィギュアは言い値だって。"
10056060-20 = "昨日提示された報酬は、手数料を引いてもこのくらい……。"
10056060-26 = "うわぁお。借金を全部返済してもお釣りがくるじゃん。"
10056060-27 = "ワッフルコーンのイワシアイス……一生かけても食べきれないくらい買える。"
10056060-28 = "他の物もあるだけ買い取るから、高そうな物は全部持ってきてほしいって……。"
10056060-29 = "やっぱり怪しいかな……？"
10056060-30 = "……骨董品の価値はその時によって上がったり下がったりするよね。"
10056060-31 = "だから、費用をかけてでも引き上げるメリットが出てきたと考えれば、#n依頼人の話にも納得はできる。"
10056060-32 = "こういうのは大きな組織に頼もうとすると小回りが利かないだろうし……。"
10056060-33 = "疑い過ぎる必要はないのかもしれない。"
10056060-34 = "じゃあ悩む必要なくない？すぐ準備しよっ！"
10056060-39 = "待って。それはそれとして。#nブルーホールの探索が他の場所より危険なのはココロもよく知ってるよね？"
10056060-40 = "うっ……。"
10056060-41 = "深度の確認も、視野の確保も難しい。"
10056060-42 = "ルスカに会えるかも？"
10056060-43 = "それ[ruby=UMA]未確認生物[/ruby]じゃん。"
10056060-47 = "いつものココロらしくない。なにか焦ってる？"
10056060-48 = "もしかして……昨日、アイランドに何か言われた？"
10056060-52 = "それが……。"
10056060-56 = "今回の賠償金を払えなかったら、廃部にされるかもしれないんだ。"
10056060-57 = "廃部って……もうダイビングできないってこと？"
10056060-58 = "うん。たぶん他の部みたいに水上での活動が中心になる。"
10056060-59 = "それはイヤ……。"
10056060-60 = "……そういうことね。"
10056060-61 = "うん。水の外に……出たくないから。"
10056060-62 = "航海が終わっても、何の成果も得られずに戻ったら……。"
10056060-63 = "――に合わせる顔もないし。"
10056060-64 = "[s] \"誰に？\""
10056060-65 = "それは――"
10056060-66 = "わあっ！？"
10056060-67 = "せ、せ、先生！？いつからここに！？"
10056060-68 = "[s] \"最初から……。\""
10056060-69 = "どうしてここにいるの？"
10056060-70 = "[s1] \"ここでお昼寝してたんだ。\"\n[s2] \"目が覚めた時には船が出た後で……。\""
10056060-73 = "あー……下の部屋の確認、忘れてた……。"
10056060-74 = "どうしよう……今からでも戻るべきかな……？"
10056060-75 = "[s3] \"話は聞かせてもらったよ。\"\n[s4] \"宝探しに行くんだよね？\""
10056060-78 = "でも、沖に出るのは危ないので……。"
10056060-79 = "先生の時間を奪ってしまうことになりますし……。"
10056060-80 = "[s] \"大丈夫。今日は予定ないんだ。\""
10056060-84 = "[ns5] \"みんなの本気のダイビングも見てみたいし。\"\n[ns6] \"今回だけは許してくれないかな……？\""
10056060-87 = "あうう……分かりました……。"
10056060-88 = "その代わり！先生は絶対に船の中にいてください！"
10056060-90 = "日付が変わるまでには戻れそうだし……。"
10056060-91 = "トライデントの巡回エリアをバレずに抜けられるかも……。"
10056060-92 = "[s] \"どうしてこっそり抜けるの？\""
10056060-96 = "それは……アイランドはこの計画を許可してくれないと思うんです。"
10056060-97 = "ただでさえ借金漬けなのに、見込みの薄い宝の地図を頼るなんて……。"
10056060-98 = "燃料の無駄だとグチグチ言われるに決まっています。"
10056060-102 = "……これ以上、冷ややかな視線は浴びたくないですから。"
10056060-103 = "[s] \"アイランドに助けを求めたことはないの？\""
10056060-104 = "いえ、特には……。"
10056060-105 = "弱みを晒して、役立たず扱いされるのは嫌なんです。"
10056060-106 = "ただでさえ、生産性のない趣味に無駄遣いしてるってイチャモンつけられてるし。"
10056060-107 = "断られるようなことを、わざわざ聞く必要はない。"
10056060-108 = "[s7] \"たしかに、さらけ出すのは怖いよね。\"\n[s8] \"弱さを隠すのも理解できる。\""
10056060-114 = "[ns] \"でも時には――\""
10056060-116 = "……先生？大丈夫？"
10056060-117 = "顔、ブドウアイスみたいな色になっちゃった。"
10056060-118 = "[s9] \"ごめん……小さな船に乗るのは久しぶりで……。\"\n[s10] \"意外と揺れるね……。\""
10056060-121 = "えっ？これでも揺れてないほうだよ。"
10056060-122 = "先生、思ったより船に弱いんだね。"
10056060-123 = "[s] \"……酔い止めとかある？\""
10056060-124 = "薬はないけど……。"
10056060-125 = "これを噛んでたら気がまぎれるかも。"
10056060-129 = "[ns] \"……このガム、珍しい味だね！？\""
10056060-130 = "ガムじゃない。乾燥昆布。"
10056060-131 = "磯の香りがするから、サユリは好き。"
10056060-136 = "[ns] \"うっぷ……。\""
10056060-137 = "わっ、ヤバヤバ。"
10056060-138 = "サユリ、バケツ持ってきて！早く！"
10056060-147 = "（その後しばらく船酔いは収まらないまま、ブルーホールに向かった）"
10056060-153 = "竜王様。ただいま戻りました。"
10056060-154 = "うむ、ご苦労。"
10056060-155 = "かつての臣下を捜すのに手一杯だった故、気にかけてやれなかったが――"
10056060-156 = "その表情……愉快な知らせがあるようだな。"
10056060-157 = "はい。"
10056060-158 = "竜宮に相応しき宝の運び手を担う、深海の才媛を見つけました。"
10056060-159 = "ほぉ？#n……新顔か。楽しみだな。"
10056060-163 = "深海を自由に行き来できる[ruby=・]ク[/ruby][ruby=・]ジ[/ruby][ruby=・]ラ[/ruby][ruby=・]の[/ruby][ruby=・]末[/ruby][ruby=・]裔[/ruby]だと？"
10056060-164 = "彼女らは苦境に陥っているようです。#n竜王様が慈悲をおかけになれば、必ずや臣従するでしょう。"
10056060-165 = "それは重畳。新しい臣下はいつでも歓迎だ。"
10056060-166 = "では客人を迎える準備をせねば。"
10056060-170 = "さあ、来たまえ。新たな臣下ども。"
10056060-172 = "余の竜宮へ！"
