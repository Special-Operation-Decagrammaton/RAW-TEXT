[translation]
102130-1 = "제13화;자치구 방어 작전 - 트리니티 1"
102130-5 = "이쪽, 이쪽입니다!"
102130-6 = "이쪽으로 대피해 주세요!"
102130-8 = "트리니티 자치구의 대피는 저희가 맡겠습니다! 마시로, 후방의 지원을!"
102130-9 = "네! 하스미 선배!"
102130-14 = "이쪽으로 더 들어와 주세요! 고서관은 트리니티에서 가장 역사가 오래된 건물! 그만큼 튼튼하다는 뜻이니까요!"
102130-24 = "으으…… 내 도서관이……. 나만의 작은 아지트가……."
102130-25 = "정말, 부장님! 좋은 일을 위해 쓰는 거잖아요. 조금 더 즐거운 표정을 지어야죠!"
102130-26 = "으흐흐흐……. 으으……."
102130-32 = "우, 우와아?!"
102130-33 = "이쪽에서도 적이?!"
102130-48 = "손이 부족해 보이는군요. 저희가 돕겠습니다."
102130-49 = "네! 트리니티의 달리는 섬광탄과, 자경단의 슈퍼스타가 도착했으니까요!"
102130-51 = "자경단 여러분……!"
102130-53 = "레이사 씨…… 그 별명은 제발……."
102130-54 = "아, 아앗? 여기저기서 공격이 이어지고 있군요! 위기군요!"
102130-55 = "하지만!"
102130-66 = "……이렇게 간단하게 피했습니다! 그쵸? 보셨나요, 스즈미 씨? 저의 이 현란한 움직임을……?"
102130-71 = "저희는 저쪽을 방어하러 갑니다. 가시죠. 레이사 씨."
102130-76 = "네! 스즈미 씨! 달리는 섬광탄의 진정한 모습, 여기서 보여주실 예정입니까? 네?"
102130-77 = "아, 아앗! 스즈미 씨! 같이 가요!"
102130-82 = "……."
102130-83 = "왜 그래, 카즈사 쨩?"
102130-84 = "……아니. 뭐, 잘 지내고 있는 것 같아서."
102130-89 = "그런데 우리는 대피 안 해? 여기서 뭐 하는 거야?"
102130-90 = "이런이런. 요시미 군. 명색이 디저트부인데, 우리도 뭔가 이 사태에 도움의 손길을 건네야 하지 않겠나?"
102130-91 = "……뭔 소리야. 그거랑 디저트가 뭔 상관인데?"
102130-93 = "그치만…… 정의실현부 분들도 힘들어 보이니까……. 돕겠다고 하면 좋아할지도……."
102130-94 = "맞는 말이야. 우리도 가보자."
102130-95 = "응!"
102130-97 = "하아…… 나참. 어쩔 수 없네."
102130-109 = "아, 아앗! 측면에서 성도회 미메시스가 포착되었습니다!"
102130-110 = "뭐, 뭐야?! 저쪽은 방어 대비가 안되어 있는데!!"
102130-114 = "……효력사로 부탁드릴게요."
102130-124 = "이것은…… L118 견인포……?"
102130-126 = "네, 그렇죠. 하스미 씨. 오랜만에 듣지 않나요?"
102130-135 = "나기사 님……. 세이아 님……."
102130-136 = "……. 저, 나기사 님이 밖에 나와 계신 거 처음 보는 거 같아요."
102130-137 = "티파티의 견인포 지원에 감사드립니다."
102130-139 = "아니에요. 하스미 씨. 이 정도도 하지 못해서야 티파티라는 이름이 아깝겠죠."
102130-140 = "자아, 세이아 씨. 다음을 부탁해요."
102130-141 = "다음은…… 동북쪽 방향이에요, 좌표는……."
102130-152 = "……."
102130-153 = "세이아 씨의 예지력은 이제 없어졌지만…… 뭐랄까, 그 대신이라고 하긴 힘들지만 다른 능력이 강해진 걸까요?"
102130-154 = "이걸 능력이라고 해야 할지…… 설명하기 힘들지만…… 말하자면…… 감각이 예민해졌다고 해야 할까요……."
102130-155 = "……<감>이 좋아진 걸로 하죠."
102130-156 = "……미카. 그쪽 상황은 어떤가요?"
102130-157 = "응, 여긴 문제없어. 나 혼자서도 충분하니까, 거기 방어를 더 두껍게 해줘."
102130-158 = "……알겠어요. 무리하진 마세요."
102130-159 = "자아, 이쪽의 방어는 저희가 돕겠습니다. 하스미 씨. 지휘를 부탁드려요."
102130-163 = "……네. 알겠습니다. 그럼 사양치 않고!"
