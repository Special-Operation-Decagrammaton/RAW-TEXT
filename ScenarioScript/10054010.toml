10054010-160 = "ใช่ค่ะ! หรือว่าคุณครูก็ชอบท่องเที่ยวเหมือนกัน? ครั้งหน้าไปด้วยกันกับฉันมั้ยคะ? เอาเป็นวันหยุดยาวที่ติดกับวันศุกร์หรือวันจันทร์นะคะ!"
