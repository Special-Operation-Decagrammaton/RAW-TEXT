10054010-157 = "[ns] \"งั้นปกติแล้ว... คานาเอะไม่ออกจากห้องเลยเหรอ?\""
10054010-158 = "ฮุฮุ ไม่เสมอไปหรอก เธอจะเป็นเช่นนั้นแค่ตอนที่ทำงานในฐานะ 'กุนซือ' เท่านั้น"
