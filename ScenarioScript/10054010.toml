[translation]
10054010-1 = "第1話;突如其來的消息"
10054010-2 = ""
10054010-3 = "總覺得許久不見了呢，老師。#n真希望汝三不五時也能來山海經露個面啊。"
10054010-4 = "若論本意，希望一週能有三日停留於山海經呢。"
10054010-5 = "[s] 「一，一週三天可能有點困難？」"
10054010-6 = "說得也是。#n果然還是得在夏萊設立山海經交流大使館，由妾身親自駐留夏萊處理公務了。"
10054010-7 = "呵呵，何必如此震驚。#n方才那番話，無非是戲言罷了。"
10054010-8 = "……約莫一半吧。"
10054010-9 = "[s] 「……聽到這麼刺激的話，我得反擊一下才行！」"
10054010-10 = "嗯？反擊是指……？"
10054010-11 = ""
10054010-13 = ""
10054010-14 = ""
10054010-15 = "老，老師？怎麼了？汝竟然主動靠得這麼近……"
10054010-16 = "唔……！"
10054010-17 = "[ns] 「果然臉色看起來不太好呢……」"
10054010-18 = "……什麼？"
10054010-20 = "原來如此……汝是想確認妾身的身體狀況是否無恙啊。"
10054010-21 = "老師願意為妾身操心固然值得高興……唉。"
10054010-22 = "不，沒什麼。是妾身會錯意了，忘了吧。#n相較之下……"
10054010-23 = "……"
10054010-24 = "……莫非是玄龍門的孩子們闖禍了？"
10054010-25 = "[s1] 「！？！？！？」\n[s2] 「不，不是！不是你想的那樣……！」"
10054010-28 = "哦？"
10054010-29 = "……"
10054010-30 = "真令人失落啊。原以為老師與妾身之間無須有所隱瞞呢……"
10054010-32 = "（無可奈何之下，只好如實地對妃姬全盤托出……）"
10054010-34 = "唉……"
10054010-35 = "[s] 「別，別太責備他們哦……？」"
10054010-36 = "妾身明白。想必那些孩子也並非心懷惡意……"
10054010-37 = "可縱使心存善意，也未必能產生善果。"
10054010-38 = "歸根究柢，令那些孩子操心，又何嘗不是妾身的過失呢。"
10054010-39 = "[s] 「你真的……身體不舒服嗎？」"
10054010-40 = "沒什麼，無須大驚小怪。#n若借用世人的說法，無非是所謂的中暑罷了。"
10054010-41 = "誠如瑠美所言，妾身每逢這時節總是會虛弱幾分。"
10054010-42 = "呵呵。無需如此擔憂，老師。#n此事與妾身的身體狀況無關。"
10054010-43 = "倘若真是如此，沙耶也不會默不作聲才是。"
10054010-44 = "[s] 「如果是這樣我就稍微放心了……」"
10054010-45 = "不過，靜養身心嗎……"
10054010-46 = "[s] 「我還是覺得有那個必要。」"
10054010-47 = "……是啊。如果做得到的話。"
10054010-48 = "汝是說，可以利用暑假這般時節休養？"
10054010-49 = "呵呵。假如換做他校應該確實如此，然而作為玄龍門的門主……"
10054010-50 = "以妾身的立場而言，若無合適的「名分」也不好隨意抽身休養。"
10054010-51 = ""
10054010-53 = ""
10054010-54 = ""
10054010-55 = ""
10054010-56 = ""
10054010-57 = "您好，門主大人！不知近來是否安康？"
10054010-58 = "哦？汝竟然親自聯繫妾身，這可真是難得。#n香奈惠宣傳部長，莫非有什麼要緊事嗎？"
10054010-59 = "哎呀，門主大人也真是的。就算沒事也是可以聯絡的嘛。"
10054010-60 = "不是有句話說「若是大業所需之人，即便三度造訪空屋也在所不惜」嗎？"
10054010-61 = "咦？難道是我會錯意了嗎……？"
10054010-62 = "是啊。那句話是指為了延攬人才，無論付出再多辛勞亦不足惜……"
10054010-63 = "哎呀～！"
10054010-64 = "無論如何，假如換作他人尚有幾分道理，可汝向來並非如此。"
10054010-65 = "妾身的動向與神色汝應早有掌握，若須傳話亦會差人代為轉達才是。"
10054010-66 = "畢竟那般作風才是汝的「浪漫」啊。"
10054010-67 = "不愧是門主大人！您果然很了解我！"
10054010-68 = "聽您這麼一說，我的言行好像有點自相矛盾了呢……"
10054010-69 = "不過我可沒打算就此氣餒！#n所謂力拔山兮氣蓋世，應該勇往直前才對！"
10054010-70 = "咦？難道我連這句話的意思也搞錯了嗎？"
10054010-71 = "是啊……況且那則故事的結局，妾身記得也稱不上圓滿。#n若是讓輝夜聽見，想必會有些失落吧……"
10054010-72 = "怎麼會這樣……！"
10054010-73 = "總，總之！即便冒著有失禮節和自相矛盾的風險，我仍有一事想向您稟報……"
10054010-74 = "我打算在我的辦公室……不對，是接待室邀請眾人一聚！"
10054010-75 = "……"
10054010-76 = "說來聽聽，加奈惠。#n莫非山海經有妾身不知曉的危機即將降臨嗎？"
10054010-77 = "……咦？"
10054010-78 = "啊……確實也可以那麼解讀呢……失禮了。"
10054010-79 = "不過並不是那麼回事！雖然您可能會覺得難以置信……"
10054010-80 = "我只是想和各位一起聚餐而已……"
10054010-81 = "……"
10054010-82 = "玄武商會的……瑠美會長也會出席嗎？"
10054010-83 = "咦？是的！這場聚會，某種意義上也可以說和那位有相當密切的關係……"
10054010-84 = "呵呵。原來如此，妾身已心裡有數。#n既然如此……"
10054010-85 = "咦？"
10054010-86 = "汝那間久未迎客的接待室，看來得稍加整頓一番才是呢。"
10054010-87 = "這個嘛……您說得有理……"
10054010-88 = ""
10054010-89 = "[ns] 「剛才那是誰呢？」"
10054010-90 = "那位對老師而言，確實仍是素未謀面呢。#n明明汝與山海經……玄龍門的緣分已如此深厚。"
10054010-91 = "此事於旁人眼中或許有幾分失禮，在此理應由妾身先行表明謝罪之意。"
10054010-92 = ""
10054010-94 = ""
10054010-95 = "[ns] 「我越來越搞不懂狀況了……？」"
10054010-96 = "那孩子名為加奈惠，是與美奈共同支撐著玄龍門的重要學生。"
10054010-97 = "如果說美奈負責掌管外務，那麼加奈惠便是總攬內政。"
10054010-98 = "兩人的重要性不分軒輊，欠缺任何一方皆會導致玄龍門難以照常運轉。"
10054010-99 = "汝一副「為何直至今日都不曾知曉」的神情呢。#n妾身明白，有此一問屬實無可厚非。"
10054010-100 = "至於這其中的緣由……"
10054010-101 = ""
10054010-103 = ""
10054010-104 = "呵呵。不妨作為與加奈惠相見時的樂趣，留待日後揭曉如何？"
10054010-106 = "玄武商會的外燴宴席送到囉！"
10054010-107 = "雖然不是什麼珍饈佳餚，但也算是因應夏天特別準備的料理，請盡情享用。"
10054010-108 = ""
10054010-110 = ""
10054010-111 = ""
10054010-113 = ""
10054010-114 = ""
10054010-115 = ""
10054010-116 = "大家午安，大家好！非常感謝各位於百忙之中撥空前來！"
10054010-117 = "呵呵。好久不見了呢，加奈惠同學。謝謝你的邀請。"
10054010-118 = "謝謝你，加奈惠姐姐！#n咦？老師也在呢？老師好！"
10054010-119 = "[s] 「你好，心菜醬！」"
10054010-120 = "就說了！我不是心菜醬……！"
10054010-121 = "[s] 「啊，對耶！心菜醬教官醬！」"
10054010-122 = "咦？嗚嗚……老師有時候真的會讓人搞不懂呢……"
10054010-123 = ""
10054010-125 = ""
10054010-126 = ""
10054010-127 = "終於能正式向您問好了，老師。#n初次見面！我是宮內加奈惠！"
10054010-128 = "我與老師的相遇，以及老師與我的相遇……簡直可以用「如魚得水」來形容呢！"
10054010-129 = "哇啊！如何，門主大人？我這次應該沒搞錯意思吧！？"
10054010-130 = "雖然稱不上有誤，不過那恐怕會讓老師感到有些沉重呢……"
10054010-131 = "是，是這樣嗎……？"
10054010-132 = "[s] 「你是加奈惠對吧？請多指教。」"
10054010-133 = "……老師都造訪山海經多久了，你可總算願意露面了啊。"
10054010-134 = "這，這點我確實無話可說……不過我也是有正當理由的啊！#n你明明也知道的吧，美奈醬？"
10054010-135 = "那也能被你說成是正當理由啊……"
10054010-136 = ""
10054010-137 = "[ns] 「別這麼說，我覺得現在能見到面就很好了。」"
10054010-138 = "老師對待學生實在太過心軟了。#n當然那確實是個很大的優點……"
10054010-139 = "不過對待加奈惠的時候，還是稍微嚴苛一點比較好。"
10054010-140 = "畢竟這傢伙之所以遲遲不肯露面……#n不，是根本不願踏出自己辦公室的原因──"
10054010-141 = "就只是因為陷入了「身為軍師就該在室內擺平天下事」這種莫名其妙的堅持而已！"
10054010-142 = "怎麼能這麼說呢，美奈醬！你可真是只知其一，不知其二啊！#n雖然一直以來都是這樣的啦！"
10054010-143 = "坐於安樂椅上便能應對一切局勢……自古以來，身為軍師本就應該如此！#n這難道不是所有軍師夢寐以求的浪漫嗎？"
10054010-144 = "文能記名足矣，劍術終究僅是勝人一籌。"
10054010-145 = "然而謀略與兵法，卻是足以對抗萬人的對策啊！"
10054010-146 = "咦？這次好像對了，又好像不對……？"
10054010-147 = "那並非軍師，而是將帥之言……"
10054010-148 = "怎麼會──！？"
10054010-149 = "那種亂七八糟的東西又是從哪裡聽來的啊……而且會那麼想的就只有你而已吧！？"
10054010-150 = ""
10054010-152 = ""
10054010-153 = "好了好了，兩位都先冷靜一下吧？#n門主大人也在場哦？"
10054010-154 = "啊……非常抱歉，門主大人。也向各位說聲抱歉。"
10054010-155 = "唔……真教人慚愧。我往後多加注意的。"
10054010-157 = "[ns] 「所以……加奈惠平常都不會走出房門嗎？」"
10054010-158 = "呵呵，那倒不至於。#n唯有以「軍師」身分行事之際，他才會如此堅持。"
10054010-159 = "畢竟旅行可是加奈惠的興趣之一啊。"
10054010-160 = "沒錯！老師也喜歡旅行嗎？下次要不要找個時間一起去呢？#n假期果然還是連著週五或週一最棒了吧！？"
10054010-161 = "我有時候甚至會懷疑你是不是有雙重人格呢……"
10054010-162 = "才沒有呢，美奈醬。我只是把公私區分得很清楚而已。"
10054010-163 = "私底下的我和工作時的我，本來就該是截然不同的人！#n這也是另一種……"
10054010-164 = "身為「軍師」的浪漫嘛！正所謂學而時習之，不亦樂乎。"
10054010-165 = "那句話跟現在的情況有什麼關係……？"
10054010-166 = "咦……沒有關係嗎？"
10054010-167 = "沒有！"
10054010-168 = "……算了。總之拜託你工作的時候從房間裡出來，順便也幫幫其他部門的人吧。"
10054010-169 = "哎呀，美奈醬也真是的。#n所謂的組織就是要把職責劃分清楚，才能不留後患地順利運轉下去啊。"
10054010-170 = "職責劃分……？"
10054010-171 = ""
10054010-173 = ""
10054010-176 = "我的意思是！要你也負責！"
10054010-177 = ""
10054010-182 = "其他的工作！"
10054010-183 = ""
10054010-188 = "主動找事情做好不好！那本來就是我們的工作吧！！！"
10054010-189 = ""
10054010-194 = "你那樣根本是拿分工當藉口，把麻煩的工作全丟給我而已！！！"
10054010-195 = "嗚哇～好痛～真的很痛啦～！"
10054010-196 = "呵呵，美奈同學和加奈惠同學都很有精神呢。#n不過……這裡可是愉快的聚餐場合哦？"
10054010-197 = "就是說啊。幸好今天梅花園的孩子們不在，要是被他們看到可是不利於教育的呢。"
10054010-198 = "……非常抱歉。我無言以對。"
10054010-199 = "嗚嗚……旬姐姐！我最近真的好辛苦，美奈醬每次見到我就會欺負我～"
10054010-200 = "汝與美奈見面的機會應該不多才是……"
10054010-201 = "……「感覺」就會欺負我～"
10054010-202 = "至少我只想為自己實際做過的事情負責……"
10054010-203 = "[ns] 「別激動，美奈。深吸一口氣，再吐出來。對，就是這樣。」"
10054010-204 = "呼……謝謝你，老師。"
10054010-205 = "呵呵。老師和美奈也別太責備加奈惠了。"
10054010-206 = "至少在自身職掌的行政事務與新人培訓方面，那孩子向來盡忠職守、無人能出其右。"
10054010-207 = "舉例來說，呈交至妾身案前的公文，皆會先由加奈惠進行彙整。"
10054010-208 = "若論加奈惠所司之事，妾身對其辦事能力可謂絕對信任。"
10054010-209 = "正因如此，若再有昔日那般席捲玄龍門的危機降臨……#n加奈惠便須攜帶所有文件隱匿避禍。"
10054010-210 = "這點我也明白，但是……"
10054010-211 = "哼哼～"
10054010-212 = "然而加奈惠所謂「分內之事」的範疇，妾身也承認有些狹隘了。"
10054010-213 = "嗚嗚～"
10054010-215 = ""
10054010-217 = ""
10054010-218 = "那麼，汝究竟有何事？#n雖說佳餚甚美，席間也算盡興……"
10054010-219 = "然而汝親自出面召集眾人，此等情形著實少見。"
10054010-220 = "啊，關於這點！那個……"
10054010-221 = ""
10054010-223 = ""
10054010-224 = "對了！根據我蒐集的情報……！"
10054010-225 = "我已經確認玄武商會的資金被投資到某處外部設施了，門主大人。"
10054010-226 = "玄武商會？"
10054010-227 = "資金？"
10054010-228 = "哎呀？"
10054010-229 = "？"
10054010-230 = "……"
10054010-231 = "……"
