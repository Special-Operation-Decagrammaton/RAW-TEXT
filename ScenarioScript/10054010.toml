[translation]
10054010-1 = "ตอนที่ 1;ข่าวกะทันหัน"
10054010-2 = ""
10054010-3 = "ไม่ได้เจอกันเสียนานเลยนะ ครู เราอยากให้ครูแวะมาซานไห่จิง ให้เราได้เห็นหน้าเห็นตาบ้าง#nเป็นครั้งคราวแท้ๆ"
10054010-4 = "หากจะพูดความในใจให้ตรงกว่านี้ เราอยากให้ครูมาพำนักที่ซานไห่จิงสักสัปดาห์ละ 3 วันเสียด้วยซ้ำ"
10054010-5 = "[s] \"สะ... สัปดาห์ละ 3 วัน อาจจะลำบากไปหน่อยนะ...?\""
10054010-6 = "ก็เข้าใจได้ เช่นนั้น เห็นทีเราคงต้องผลักดันแผนก่อตั้งสถานทูตส่งเสริมการแลกเปลี่ยนของซานไห่จิง#nที่ชาเล่ต์ เพื่อให้เราไปทำงานที่ชาเล่ต์ด้วยตนเองแล้วสินะ"
10054010-7 = "ฮุฮุ อย่าตกใจไปนักเลย นั่นเป็นเพียงคำพูดล้อเล่นของเราน่ะ"
10054010-8 = "...ล้อเล่นแค่ครึ่งเดียวนะ"
10054010-9 = "[s] \"พูดให้ครูแทบหัวใจวายแบบนี้ ครูต้องเอาคืนบ้างแล้ว!\""
10054010-10 = "หืม? เอาคืนงั้นหรือ เอาคืนอะไร...?"
10054010-11 = ""
10054010-13 = ""
10054010-14 = ""
10054010-15 = "คะ... ครู? มีอะไรหรือ ทำไมเข้ามาใกล้เราถึงเพียงนี้..."
10054010-16 = "อึก...!"
10054010-17 = "[ns] \"เหมือนหน้าจะซีดอยู่หน่อยจริงๆ ด้วย...\""
10054010-18 = "ว่าอย่างไรนะ...?"
10054010-20 = "นี่ครู... เข้ามาก็เพื่อจะตรวจดูว่าร่างกายของเรายังปกติดีอยู่หรือไม่สินะ"
10054010-21 = "เราก็ดีใจอยู่หรอกที่ครูใส่ใจ แต่ก็... เฮ้อ"
10054010-22 = "ไม่สิ ไม่มีอะไร เราแค่คาดหวังไปเองตามอำเภอใจก็เท่านั้น ลืมมันไปเสียเถอะ ว่าแต่... อืม..."
10054010-23 = "..."
10054010-24 = "สมาชิกมังกรดำของเราไปก่อเรื่องอะไรไว้งั้นหรือ...?"
10054010-25 = "[s1] \"???!!!\"\n[s2] \"มะ... ไม่ใช่นะ! ไม่ใช่แบบนั้น...!\""
10054010-28 = "หืม?"
10054010-29 = "..."
10054010-30 = "น่าน้อยใจนัก เรานึกว่าระหว่างครูกับเรา ไม่มีเรื่องใดต้องปิดบังกันเสียอีก..."
10054010-32 = "(สุดท้ายคุณครูก็ไม่มีทางเลือก และเล่าทุกอย่างให้คิซากิฟังตามตรง...)"
10054010-34 = "เฮ้อ..."
10054010-35 = "[s] \"ยะ... อย่าดุพวกนั้นมากเกินไปนะ...\""
10054010-36 = "เรารู้อยู่แล้ว เด็กเหล่านั้นคงไม่ได้มีเจตนาร้าย..."
10054010-37 = "แน่นอนว่าถึงจะไม่ใช่เจตนาร้าย ก็ใช่ว่าจะลงเอยด้วยการกระทำที่ดีเสมอไป"
10054010-38 = "แต่การที่เราทำให้เด็กเหล่านั้นต้องเป็นห่วง ก็เป็นความผิดของเราตั้งแต่แรกไม่ใช่หรือ"
10054010-39 = "[s] \"ไม่สบาย... จริงๆ เหรอ?\""
10054010-40 = "ไม่ใช่เรื่องใหญ่ที่ต้องตกใจถึงเพียงนั้นหรอก หากจะให้ยืมคำที่คนทั่วไปใช้กันละก็ คงเรียกว่าเป็นลมแดดน่ะ"
10054010-41 = "เป็นอย่างที่รูมิพูด พอถึงช่วงนี้... พละกำลังของเราก็มักจะลดลงเล็กน้อย"
10054010-42 = "ฮุฮุ ไม่ต้องกังวลถึงเพียงนั้นหรอก ครู เรื่องนี้ไม่เกี่ยวกับสภาพร่างกายตามปกติของเรา "
10054010-43 = "และหากเป็นเช่นนั้นจริง ตอนนี้ซายะคงไม่มีทางอยู่เฉยๆ หรอก"
10054010-44 = "[s] \"ถ้างั้นก็พอวางใจได้อยู่หรอก...\""
10054010-45 = "แต่เมื่อกี้ที่บอกว่า การให้ร่างกายและจิตใจได้พัก..."
10054010-46 = "[s] \"ครูคิดว่านั่นเป็นสิ่งจำเป็นนะ\""
10054010-47 = "ก็จริง... หากทำเช่นนั้นได้ละก็นะ"
10054010-48 = "เราใช้วันหยุดฤดูร้อน แล้วไปพักผ่อนได้หรือเปล่าน่ะหรือ?"
10054010-49 = "ฮุฮุ จริงสิ... หากเป็นโรงเรียนอื่น ก็คงทำเช่นนั้นได้อย่างไม่ต้องสงสัย แต่ตำแหน่งประมุขแห่งมังกรดำนั้น..."
10054010-50 = "เป็นตำแหน่งที่ยากจะหาเวลาพักตามอำเภอใจเช่นนั้นได้ หากไม่มี 'ข้ออ้างที่เหมาะสม' น่ะ"
10054010-51 = ""
10054010-53 = ""
10054010-54 = ""
10054010-55 = ""
10054010-56 = ""
10054010-57 = "สวัสดีค่ะ ท่านประมุข! สุขภาพของท่านแข็งแรงดีมั้ยคะ?"
10054010-58 = "โฮ่ เป็นฝ่ายโทรหาเราโดยตรงเลยสินะ เรื่องแบบนี้ช่างหาได้ยากยิ่งนัก หัวหน้าฝ่ายประชาสัมพันธ์คานาเอะ มีเรื่องอะไรสำคัญถึงเพียงนั้นหรือ?"
10054010-59 = "โธ่ ท่านประมุขก็ ต่อให้ไม่มีเรื่องอะไร ฉันก็ติดต่อมาหาได้นี่คะ"
10054010-60 = "ว่ากันว่า \"หากมีผู้ที่จำเป็นต่อการใหญ่ ต่อให้ต้องไปเยือนเรือนที่ไร้ผู้คนถึงสามคราก็ย่อมได้\" ไม่ใช่เหรอคะ?"
10054010-61 = "เอะ... เอ๋? หรือไม่ได้หมายความแบบนั้นคะ...?"
10054010-62 = "ใช่ ไม่ได้หมายความเช่นนั้น แต่หมายถึง \"เพื่อเชื้อเชิญผู้มีความสามารถ ต่อให้ต้องใช้ความพยายาม และความอดทนก็ถือว่าคุ้มค่า\" ต่างหาก..."
10054010-63 = "แงง!"
10054010-64 = "เอาเถอะ เอาเป็นว่าหากเป็นคนอื่น คำพูดนั้นก็อาจถูกต้อง แต่กับเธอแล้ว เราคิดว่าไม่น่าจะเป็นเช่นนั้น"
10054010-65 = "เธอน่าจะสืบความเคลื่อนไหวหรือท่าทีของเราไว้ล่วงหน้าแล้ว และหากต้องส่งข้อความอะไร ก็คงให้คนอื่นเป็นคนถ่ายทอดแทนไม่ใช่หรือ?"
10054010-66 = "เพราะการทำเช่นนั้น คือ 'ความโรแมนติก' ของเธออย่างไรเล่า"
10054010-67 = "สมกับเป็นท่านประมุข! รู้จักฉันดีจริงๆ เลยนะคะ!"
10054010-68 = "พอท่านพูดแบบนั้น... คำพูดและการกระทำของฉันก็ยิ่งดูขัดแย้งกันกว่าเดิมจริงๆ ด้วยค่ะ..."
10054010-69 = "แต่ฉันไม่คิดจะห่อเหี่ยวเพียงเพราะเรื่องแค่นี้หรอกค่ะ! ดังคำกล่าวว่า \"จงก้าวไปด้วยพละกำลังที่#nสามารถถอนภูผา และเรี่ยวแรงที่ปกคลุมใต้หล้า!\""
10054010-70 = "เอะ... เอ๋? อันนี้ก็ไม่ถูกความหมายอีกแล้วเหรอคะ?"
10054010-71 = "ใช่... และเราจำได้ว่าตอนจบของเรื่องนั้นไม่ค่อยดีนัก หากคางุยะมาได้ยิน ก็คงเสียใจทีเดียว..."
10054010-72 = "ได้ยังไงกัน...!"
10054010-73 = "อะ... เอาเถอะค่ะ! แม้จะเป็นการเสียมารยาทและพูดอย่างไม่สมเหตุสมผล แต่ฉันก็ขอเรียนว่า..."
10054010-74 = "ฉันคิดว่าจะเชิญทุกท่านมารวมตัวกันที่สำนักงานของฉัน... ไม่ใช่สิ ที่ห้องรับรองค่ะ!"
10054010-75 = "..."
10054010-76 = "นี่ คานาเอะ วิกฤตของซานไห่จิงที่เราไม่ล่วงรู้กำลังมาเยือนหรือ?"
10054010-77 = "คะ...?"
10054010-78 = "อ่า... ค่ะ จะตีความแบบนั้นก็ได้สินะคะ... ขออภัยค่ะ "
10054010-79 = "แต่ไม่ใช่เรื่องแบบนั้นค่ะ! แม้ท่านอาจจะไม่อยากเชื่อก็ตาม..."
10054010-80 = "แต่ฉันแค่อยากจัดมื้ออาหารร่วมกับทุกท่านก็เท่านั้นค่ะ..."
10054010-81 = "..."
10054010-82 = "ย่านการค้าเทพเต่าดำ... เช่นนั้นประธานรูมิก็มาร่วมด้วยหรือ?"
10054010-83 = "คะ? ค่ะ ใช่ค่ะ! จะว่าไปก็เป็นการพบปะที่ท่านผู้นั้นมีส่วนเกี่ยวข้องอย่างใกล้ชิดเลยค่ะ..."
10054010-84 = "ฮุฮุ เช่นนั้นหรือ เข้าใจแล้ว เราพอจะเดาออกแล้วละ แต่หากเป็นเช่นนั้น..."
10054010-85 = "คะ?"
10054010-86 = "เห็นทีต้องจัดห้องรับรองของเธอที่ไม่ได้ใช้มาระยะหนึ่งเสียหน่อยแล้วสินะ"
10054010-87 = "เรื่องนั้น... ก็คงเป็นอย่างนั้นค่ะ..."
10054010-88 = ""
10054010-89 = "[ns] \"เมื่อกี้ใครเหรอ?\""
10054010-90 = "จริงสิ ครูยังไม่รู้จักเธอสินะ ทั้งที่สายสัมพันธ์ระหว่างครูกับซานไห่จิง... และมังกรดำลึกซึ้งถึงเพียงนี้แล้วแท้ๆ"
10054010-91 = "หากมองในอีกแง่ นี่อาจเป็นเรื่องไม่เหมาะสม เราคงต้องเป็นฝ่ายขอโทษก่อนแล้วละ"
10054010-92 = ""
10054010-94 = ""
10054010-95 = "[ns] \"ยิ่งฟังก็ยิ่งไม่เข้าใจ...?\""
10054010-96 = "อืม เด็กคนนั้นชื่อคานาเอะ เป็นนักเรียนคนสำคัญที่คอยค้ำจุนมังกรดำร่วมกับมินะ"
10054010-97 = "หากมินะรับผิดชอบกิจการภายนอก คานาเอะก็รับผิดชอบกิจการภายในทั้งหมด "
10054010-98 = "ทั้งสองมีฐานะเท่าเทียมกันทุกอย่าง หากขาดคนใดคนหนึ่ง มังกรดำก็คงทำหน้าที่ได้ยาก"
10054010-99 = "แต่สีหน้าของครูเหมือนกำลังถามว่า แล้วเหตุใดถึงไม่รู้จักมาก่อนสินะ ใช่ จะสงสัยเช่นนั้นก็ไม่แปลก"
10054010-100 = "ส่วนเรื่องเหตุผล..."
10054010-101 = ""
10054010-103 = ""
10054010-104 = "ฮุฮุ เก็บไว้เป็นความสนุกหลังจากได้พบคานาเอะด้วยตัวเองดีมั้ยเล่า?"
10054010-106 = "บุฟเฟต์นอกสถานที่จากย่านการค้าเทพเต่าดำมาถึงแล้ว!"
10054010-107 = "ถึงจะไม่ใช่อะไรที่ยิ่งใหญ่นัก แต่ทางเราก็เตรียมอาหารสำหรับเพลิดเพลินในฤดูร้อนไว้ให้ เชิญทานได้เต็มที่เลยนะคะ"
10054010-108 = ""
10054010-110 = ""
10054010-111 = ""
10054010-113 = ""
10054010-114 = ""
10054010-115 = ""
10054010-116 = "สวัสดีค่ะ สวัสดีค่ะ! น่าจะงานยุ่งกันแท้ๆ ขอบคุณทุกท่านที่สละเวลามานะคะ!"
10054010-117 = "ฮุฮุ ไม่ได้เจอกันนานเลยนะคะ คุณคานาเอะ ขอบคุณที่เชิญมาค่ะ"
10054010-118 = "ขอบคุณค่ะ พี่คานาเอะ! เอ๋? คุณครูก็อยู่ด้วยเหรอคะ? สวัสดีค่ะ!"
10054010-119 = "[s] \"สวัสดี โคโคน่าจัง!\""
10054010-120 = "ก็บอกแล้วไงคะ! ฉันไม่ใช่โคโคน่าจัง แต่เป็น...!"
10054010-121 = "[s] \"อ้อ จริงสิ! เป็นโคโคน่าจัง ผู้ฝึกสอนจังต่างหาก!\""
10054010-122 = "คะ? อึก... จริงๆ เลย บางครั้งฉันก็ไม่เข้าใจคุณครูเลยค่ะ..."
10054010-123 = ""
10054010-125 = ""
10054010-126 = ""
10054010-127 = "ในที่สุดก็ได้ทักทายกันเสียทีนะคะ ฉันชื่อมิยาอุจิ คานาเอะค่ะ คุณครู! ยินดีที่ได้พบค่ะ!"
10054010-128 = "การที่ฉันได้พบกับคุณครู และคุณครูได้พบกับฉัน... คงเหมือนปลาที่ได้น้ำเลยนะคะ!"
10054010-129 = "ว้าว! เป็นยังไงคะ ท่านประมุข? คราวนี้ฉันเหมือนจะใช้สำนวนได้ถูกแล้วใช่มั้ยคะ?!"
10054010-130 = "ใช่ว่าจะผิดหรอก แต่จากมุมของครู อาจเป็นเรื่องกดดันอยู่บ้างก็เป็นได้..."
10054010-131 = "งะ... งั้นเหรอคะ...?"
10054010-132 = "[s] \"ชื่อคานาเอะใช่มั้ย? ครูขอฝากตัวด้วยนะ\""
10054010-133 = "คุณครูมาเยือนซานไห่จิงตั้งแต่ไหนแต่ไรแล้ว แต่เธอเพิ่งจะโผล่หน้ามาให้เห็นนะ..."
10054010-134 = "ระ... เรื่องนั้นฉันก็เถียงไม่ออกจริงๆ แต่ว่า... ฉันเองก็มีเหตุผลอันสมควรของฉันนะคะ มินะจังก็รู้ไม่ใช่เหรอคะ?"
10054010-135 = "เรื่องแบบนั้น กล้าพูดว่าเป็นเหตุผลอันสมควรจากปากตัวเองเลยเหรอ..."
10054010-136 = ""
10054010-137 = "[ns] \"แต่ถึงจะเป็นตอนนี้ ครูก็ดีใจที่ได้เจอหน้านะ\""
10054010-138 = "คุณครูก็ใจดีกับนักเรียนเกินไปแล้วนะ ถึงนั่นจะเป็นข้อดีมากๆ เลยก็เถอะ..."
10054010-139 = "แต่กับคานาเอะน่ะ ฉันว่าเข้มงวดสักหน่อยจะดีกว่า"
10054010-140 = "ที่ยัยนี่ไม่ยอมโผล่หน้าออกมาให้เห็น... ไม่สิ ที่ถึงขั้นไม่คิดจะออกจากสำนักงานของตัวเองเลยน่ะ!"
10054010-141 = "ก็เพราะความยึดติดประหลาดๆ ที่ว่ากุนซือต้องแก้ไขสถานการณ์โดยไม่ขยับออกจากห้องแคบๆ เพียงห้องเดียวน่ะสิ!"
10054010-142 = "ความยึดติดประหลาดๆ งั้นเหรอคะ มินะจัง! รู้อะไรแค่ด้านเดียวจังเลยนะคะ! ถึงจะเป็นแบบนั้นมาตลอดก็เถอะค่ะ!"
10054010-143 = "ผู้ที่รับมือกับทุกสถานการณ์ได้โดยไม่ต้องลุกจากเก้าอี้... กุนซือที่แท้จริงต้องเป็นแบบนั้นอยู่แล้วค่ะ! นั่นไม่ใช่สิ่งที่กุนซือทุกคนใฝ่ฝันเหรอคะ?"
10054010-144 = "ศาสตร์อักษร ขอเพียงใช้ฝากชื่อไว้ได้ก็เพียงพอ ส่วนวิชาดาบ อย่างมากก็มีไว้เอาชนะคนเพียงคนเดียว"
10054010-145 = "แต่กลยุทธ์และพิชัยสงครามคือหนทางที่สามารถรับมือผู้คนนับหมื่นได้!"
10054010-146 = "เอ๋? คราวนี้เหมือนจะถูก แต่ก็เหมือนไม่ถูกยังไงไม่รู้นะคะ...?"
10054010-147 = "นั่นเป็นคำพูดของแม่ทัพ ไม่ใช่กุนซือ..."
10054010-148 = "ผิดอีกแล้ว?!"
10054010-149 = "ชอบไปเอาคำเปรียบเปรยมั่วๆ ที่ได้ยินจากไหนมาพูดอยู่เรื่อย... แล้วเรื่องแบบนี้ก็มีแต่เธอคนเดียวที่#nทำด้วย?!"
10054010-150 = ""
