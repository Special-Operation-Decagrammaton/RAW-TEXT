[translation]
10054010-1 = "1화;갑작스러운 소식"
10054010-3 = "간만이라는 생각이 드는구나, 선생. 이따금 우리 산해경에도 얼굴을 보여 주었으면 좋았을 텐데 말이다."
10054010-4 = "조금 더 솔직한 본심을 이야기하자면, 1주일에 3일 정도는 산해경에 체류해 주었으면 한다만."
10054010-5 = "[s] \"주, 주 3일은 조금 무리일지도……?\""
10054010-6 = "그야 그렇겠지. 그렇다면 역시 샬레에 산해경의 상호 교류 대사관을 설치하여, 내가 직접 샬레에서 업무를 보는 방안을 추진해야겠군."
10054010-7 = "후후. 그렇게 놀라지 말거라. 농담으로 건넨 말임이 당연하지 않은가."
10054010-8 = "……절반 정도는, 말이다."
10054010-9 = "[s] \"……심장에 좋지 않은 말을 들었으니까, 반격해야겠어!\""
10054010-10 = "음? 반격이라니, 무슨……?"
10054010-15 = "서, 선생? 무슨 일인가. 선생 쪽에서 먼저 이렇게 가까이……."
10054010-16 = "읏……!"
10054010-17 = "[ns] \"역시 안색이 조금 창백한 것 같기도 하고…….\""
10054010-18 = "……뭐라?"
10054010-20 = "그러니까…… 내 몸이 괜찮은지, 상태를 확인해 보려 했다는 것이로구나."
10054010-21 = "물론 선생이 신경 써 주는 것은 기쁜 일이다만…… 하아."
10054010-22 = "아니, 아니다. 내가 멋대로 기대한 것뿐이니, 잊어라. 그보다…… 흐음……."
10054010-23 = "……."
10054010-24 = "………혹시, 우리 현룡문 아이들이 사고라도 쳤는가?"
10054010-25 = "[s1] \"???!!!\"\n[s2] \"아, 아니야! 그런 건 아니고……!\""
10054010-28 = "흐음?"
10054010-29 = "……."
10054010-30 = "서운하구나. 선생과 나 사이에는 무엇 하나 숨기는 것이 없을 줄 알았거늘……."
10054010-32 = "(어쩔 수 없이, 키사키에게 솔직하게 털어놓았다…….)"
10054010-34 = "하아…………."
10054010-35 = "[s] \"너, 너무 혼내지는 말아 줘……?\""
10054010-36 = "알고 있다. 그 아이들도 나쁜 의도를 가졌던 것은 아니었을 테지……."
10054010-37 = "물론 의도가 불순하지 않다고 하여, 반드시 좋은 행동으로 열매가 맺어지는 것은 아니겠다만."
10054010-38 = "애초에, 그 아이들에게 걱정을 끼치게 한 나의 허물도 있지 않겠느냐."
10054010-39 = "[s] \"정말로…… 몸이 안 좋은 거야?\""
10054010-40 = "무얼, 그렇게 대단하게 반응할 일은 아니다. 세간의 표현을 빌리자면, 이른바 더위를 먹은 것이니."
10054010-41 = "루미의 말 그대로다. 이 시기가 되면 아무래도…… 체력이 조금 떨어지곤 했으니 말이지."
10054010-42 = "후후. 그렇게 걱정할 필요는 없다, 선생. 내 평소 몸 상태와는 관계없는 일이니."
10054010-43 = "애초에 정말로 그랬다면, 일단 사야가 이렇게 얌전할 리 없지 않겠느냐."
10054010-44 = "[s] \"그렇다면 일단 안심이기는 한데…….\""
10054010-45 = "허나, 몸과 마음을 쉬게 한다, 인가……."
10054010-46 = "[s] \"역시 그건 필요하다고 생각해.\""
10054010-47 = "……그래. 그렇게 할 수 있다면 말이지."
10054010-48 = "여름방학 같은 것을 이용해 쉬면 되지 않느냐고?"
10054010-49 = "후후. 그래……. 다른 학교라면 분명, 그렇게 해도 될 일이겠지. 허나 현룡문의 문주라는 자리는 아무래도……."
10054010-50 = "적합한 '명분' 없이는, 함부로 그런 시간을 내기 어려운 위치이기도 해서 말이다."
10054010-57 = "안녕하세요, 문주님! 기체후 일향 만강하시었습니까?"
10054010-58 = "호오. 그대가 직접 내게 전화를 걸다니, 드문 일이로구나. 카나에 홍보부장. 그만한 일이라는 건가?"
10054010-59 = "아이참, 문주님도. 별일 없는데 연락드릴 수도 있죠."
10054010-60 = "정말로 대업에 필요한 사람이 있다면, 세 번이나 빈집을 찾아갈 수도 있다잖아요?"
10054010-61 = "어, 어라? 이 의미가 아니었던가요……?"
10054010-62 = "그래. 그게 아니라, 인재를 맞아들이기 위해서는 참을성 있게 노력하는 것이 아깝지 않다는 뜻이지……."
10054010-63 = "으앙!"
10054010-64 = "어쨌든, 다른 자라면 그 말이 맞을 터이다만, 그대는 그러하지 않을 듯하여 말이다."
10054010-65 = "나의 동향이나 기색 같은 것은 진작에 파악하고 있을 것이고, 전언이 필요하다면 다른 사람을 시켜 우회하여 전하지 않겠는가?"
10054010-66 = "그리하는 것이 그대의 '낭만'일 것일 터이니."
10054010-67 = "역시 문주님! 저를 잘 아신다니까요!"
10054010-68 = "……그렇게 말씀드리고 보니, 한층 더 제 언행이 모순처럼 보이기는 하겠네요……."
10054010-69 = "하지만 이 정도로 풀이 죽을 생각은 없답니다! 이르기를, 힘은 산을 뽑을 만하고, 기운은 세상을 덮을 만큼 나아가라 하였으니!"
10054010-70 = "어, 어라? 이것도 이 의미가 아니었던가요?"
10054010-71 = "그래……. 그리고 그 이야기의 결말은 그다지 좋지 못했던 것으로 기억하는구나. 카구야가 들었다면 조금 서운했을 것이야……."
10054010-72 = "그럴 수가……!"
10054010-73 = "아, 아무튼간에요! 실례와 모순을 무릅쓰고 말씀 올리고자 하는데요……."
10054010-74 = "제 집무실……은 아니고, 접대실에서 여러 분들을 모시고 자리를 가질까 해서요!"
10054010-75 = "……."
10054010-76 = "여봐라, 카나에. 내가 알지 못하는, 산해경의 위기가 닥치려 하는가?"
10054010-77 = "……네?"
10054010-78 = "아…… 네. 그렇게 해석될 수도 있었겠네요……. 송구합니다."
10054010-79 = "하지만 그런 일은 아니랍니다! 정말로 믿기 어려우실 수도 있으시겠지만……."
10054010-80 = "그냥, 여러 분들과 식사 자리를 마련하고자 하는 것뿐인데요……."
10054010-81 = "……."
10054010-82 = "현무상회…… 루미 회장도 오는가?"
10054010-83 = "네? 네, 그렇습니다! 어떻게 보면 그분과 상당히 밀접하게 구축된 자리라고나 할까요……."
10054010-84 = "후후. 그렇구나. 알았다. 짐작이 가는구나. 허나 그렇다면……."
10054010-85 = "네?"
10054010-86 = "한동안 사용하지 않았을, 그대의 접대실을 조금 정리할 필요가 있겠구나."
10054010-87 = "그건, 그렇겠지요……."
10054010-89 = "[ns] \"방금은 누구였어?\""
10054010-90 = "그래. 선생에게도 초면이겠구나. 이렇게 산해경…… 현룡문과 선생의 연이 깊어졌는데도."
10054010-91 = "보기에 따라서는 불미스러운 일이었을지도 모를 일이로군. 내가 먼저 사죄의 뜻을 밝혀야 하겠다."
10054010-95 = "[ns] \"더더욱 영문을 모르겠는데……?\""
10054010-96 = "음. 카나에라는 아이다. 미나와 함께 현룡문을 지탱해 주고 있는 중요한 학생이지."
10054010-97 = "미나가 외치를 담당한다면, 카나에는 내치를 도맡고 있다."
10054010-98 = "둘의 격은 완전히 같기에, 둘 중 하나만 빠져도 현룡문은 제 역할을 하기 힘들 게야."
10054010-99 = "그런데 왜 선생은 지금까지 몰랐냐는 표정이로구나. 그래. 그런 의문을 품는 것이 당연하겠지."
10054010-100 = "그 이유에 대해서는……."
10054010-104 = "후후. 카나에를 직접 만난 뒤의 즐거움으로, 남겨 두도록 하는 것이 어떠한가?"
10054010-106 = "현무상회 출장 뷔페 대령이오!"
10054010-107 = "대단한 것은 아닙니다만, 나름대로 여름에 즐길 음식으로 준비했습니다. 마음껏 드셔 주세요."
10054010-116 = "안녕하세요, 안녕하세요! 모두, 바쁘신 가운데 이렇게 시간을 내주셔서 감사합니다!"
10054010-117 = "후후. 오랜만이네요. 카나에 씨. 초대해 주셔서 감사합니다."
10054010-118 = "감사합니다, 카나에 언니! 어라? 선생님도 계셨네요? 안녕하세요!"
10054010-119 = "[s] \"안녕, 코코나 쨩!\""
10054010-120 = "그러니까요! 저는 코코나 쨩이 아니라……!"
10054010-121 = "[s] \"아참, 그랬지! 코코나 쨩 교관 쨩!\""
10054010-122 = "네? 으우…… 정말이지 선생님은 가끔 영문을 모르겠다니까요……."
10054010-127 = "이제서야 인사 올리게 되네요. 미야우치 카나에라고 합니다, 선생님! 처음 뵙겠습니다!"
10054010-128 = "저와 선생님이 만난 것, 그리고 선생님과 제가 만난 것……. 마치 물고기가 물을 만난 것과 같은 일이겠네요!"
10054010-129 = "와! 어때요, 문주님? 이번에는 제대로 된 표현을 쓴 것 같은데요?!"
10054010-130 = "그다지 틀리지는 않았다만, 선생의 입장에서는 조금 부담스럽게 느껴질 수도 있을 듯하구나……."
10054010-131 = "그, 그런가요……?"
10054010-132 = "[s] \"카나에라고 했지? 잘 부탁해.\""
10054010-133 = "……선생님이 산해경에 방문하신 게 언제인데, 참 빨리도 얼굴을 내보이는군."
10054010-134 = "그, 그것은 확실히 할 말이 없지만…… 저도 나름의 정당한 사정이라는 게 있었다고요? 알잖아요, 미나 쨩?"
10054010-135 = "그걸 정당한 사정이라고 스스로 이야기하는 건가……."
10054010-137 = "[ns] \"왜, 난 이제라도 얼굴 봐서 좋은데.\""
10054010-138 = "선생님은 학생에게 너무 무르단 말이지. 물론 그것은 큰 장점이지만……."
10054010-139 = "카나에에게는 조금 엄격한 편이 좋을 거다."
10054010-140 = "뭐니 뭐니 해도 이 녀석이 그동안 얼굴을 비추지 않은 것은…… 아니, 아예 자기 집무실 밖으로 나오지도 않으려 한 것은!"
10054010-141 = "책사란, 한 칸 방 안에서 움직이지 않고 사태를 해결해야 한다는, 묘한 집착에 빠져 있어서였으니까!"
10054010-142 = "묘한 집착이라뇨, 미나 쨩! 정말 하나만 알고 둘은 모르네요! 언제나 그랬지만요!"
10054010-143 = "안락의자에서 움직이지 않고 모든 사태에 대처한다……. 책사라면 자고로 그래야지요! 그게 모든 책사가 꿈꾸는 낭만 아니겠어요?"
10054010-144 = "글이란 이름을 기록할 만하면 충분하고, 검술은 기껏해야 한 사람을 능가하는 것."
10054010-145 = "그러나 책략과 병법은 능히 만인을 대적할 수 있는 대책인 법이니!"
10054010-146 = "어라? 이번에는 뭔가 맞는 듯하면서도 아닌 것 같았는데……?"
10054010-147 = "그것은 책사가 아니라 장수의 말이다……."
10054010-148 = "어째서–?!"
10054010-149 = "또 어디에서 들은 대로 엉터리 비유를……. 거기에 그건 너만 그럴 거거든?!"
10054010-153 = "자, 자. 두 분 모두, 여기에서는 조금 흥분을 가라앉혀도 좋지 않을까요? 문주님께서도 와 계시는데."
10054010-154 = "앗, 네네. 죄송합니다, 문주님. 죄송해요, 여러분."
10054010-155 = "으음. 면목이 없군. 주의하도록 하지."
10054010-157 = "[ns] \"그러면 카나에는…… 평소에도 방 밖으로 안 나가는 거야?\""
10054010-158 = "후후. 그런 것만은 또 아니다. 오직 '책사'로서 일할 때만 그리하려는 것이지."
10054010-159 = "뭐니 뭐니 해도 카나에의 취미 중 하나는, 여행이기도 하고 말이지?"
10054010-160 = "맞아요! 혹시 선생님도 여행 좋아하시나요? 다음에 언제 저와 같이 가실래요? 역시 휴일은 금요일이나 월요일에 붙어 있는 편이 좋죠!"
10054010-161 = "가끔은 네가 이중인격이 아닌가 하는 생각마저 들 정도다만……."
10054010-162 = "아니에요, 미나 쨩. 저는 그저 공사를 확실하게 구분하는 것뿐이라고요."
10054010-163 = "사적인 시간의 저와, 공적인 시간의 저는 다른 인물이어야 한단 말이죠? 그것이 또 하나의……."
10054010-164 = "'책사'로서의 낭만이니까요! 배우고 때때로 그것을 익히니, 이 또한 어찌 기쁘지 아니하겠어요?"
10054010-165 = "그게 지금, 이 상황과 무슨 상관이야……?"
10054010-166 = "어라……. 상관없었나요?"
10054010-167 = "없다!"
10054010-168 = "……다 좋으니까, 일을 할 때에도 제발 방 밖으로 나오라는 거다. 하는 김에 다른 부서도 좀 돕고."
10054010-169 = "아이참, 미나 쨩도. 조직이라는 건 말이에요. 업무 분장을 확실하게 해야 뒤탈 없이 굴러가는 거라고요."
10054010-170 = "업무, 분장……?"
10054010-176 = "다른 일도! 좀!"
10054010-182 = "하라고!"
10054010-188 = "할 일을 찾아서 하는 게! 우리 일이란 말이다!!!"
10054010-194 = "네가 하는 것은 업무 분장 핑계를 대고, 어중간한 일을 나에게 던지는 것뿐이잖나!!!"
10054010-195 = "으아앙~ 아파요~ 아프다니까요!"
10054010-196 = "후후. 미나 씨도 카나에 씨도, 건강해서 좋네요. 하지만 여기는 즐거운 식사 자리랍니다?"
10054010-197 = "그래요. 다행히 여기에는 없지만, 매화원 아이들이 보면 교육에 안 좋을 거라고요."
10054010-198 = "……면목이 없군. 미안하다."
10054010-199 = "흑흑……. 슌 언니! 저 요새 정말 힘든 거 있죠? 미나 쨩은 저만 보면 구박하고~"
10054010-200 = "아니, 그대와 미나가 오프라인에서 만나는 일은, 나름 드문 일이 아닌가 한다만……."
10054010-201 = "……구박할 것만 같고~"
10054010-202 = "나는 적어도, 내가 실제로 저지른 일에 대해서만 책임을 지고 싶다만……."
10054010-203 = "[ns] \"진정해, 미나. 숨을 깊게 들이쉬고 내쉬자. 그래, 그렇게.\""
10054010-204 = "후우……. 고맙다, 선생님."
10054010-205 = "후후. 선생도 미나도, 카나에를 그리 지나치게 나무라지 말거라."
10054010-206 = "적어도 자기 분야인 행정 업무 처리나 신입 교육 같은 부분에 있어서만큼은, 그야말로 누구보다 충실하니까."
10054010-207 = "일례로, 나에게 올라오는 공문은 모두 카나에의 손을 한번 거쳐 정리된 것들이지."
10054010-208 = "나는 카나에의 분야에서는 절대적으로 그 일처리를 신뢰하고 있다."
10054010-209 = "그렇기에 일전과 같이 현룡문 전체에 위기가 닥치면…… 카나에가 모든 관련 문서를 가지고 은거해야 하는 것이기도 하고 말이지."
10054010-210 = "그 점은 저도 알고 있습니다만……."
10054010-211 = "흐흥~"
10054010-212 = "물론 카나에가 이야기하는 '자기 역할'의 범위가, 다소 협소할 수 있다는 것은 인정한다."
10054010-213 = "우웅~"
10054010-218 = "그래서, 무슨 일인가? 음식은 맛있었고, 자리도 즐거웠다만."
10054010-219 = "다른 누구도 아닌 카나에, 그대가 이렇게 오프라인에서 사람을 불러 모은다는 것은 상당히 드문 일인 것 같아서 말이다."
10054010-220 = "아, 그게 말이죠! 그러니까……."
10054010-224 = "그래요! 제가 알아낸 정보에 따르면!"
10054010-225 = "현무상회의 자금이, 외부 시설에 투자되었다는 사실을 확인했기 때문이랍니다. 문주님."
10054010-226 = "현무상회의?"
10054010-227 = "자금?"
10054010-228 = "어머나?"
10054010-229 = "?"
10054010-230 = "……."
10054010-231 = "……."
