[translation]
10054010-1 = "Episode 1;Unexpected News"
10054010-2 = ""
10054010-3 = "It has been much too long, Sensei. You must visit more often."
10054010-4 = "Your current count is abysmally low. I will approve of...three days a week."
10054010-5 = "[s] \"Th-That might be genuinely impossible for me...\""
10054010-6 = "As expected. Instead, we will have to draw up plans for a Shanhaijing Embassy, built directly on Schale grounds, so I may conduct my work from there instead."
10054010-7 = "Fufu, please, relax. I was jesting, of course."
10054010-8 = "...For the most part."
10054010-9 = "[s] \"...I'll have to take my revenge for that prank!\""
10054010-10 = "Hm? What kind of \"revenge,\" exactly...?"
10054010-11 = ""
10054010-13 = ""
10054010-14 = ""
10054010-15 = "S-Sensei? Y-You are entirely too close..."
10054010-16 = "Ack...!"
10054010-17 = "[ns] \"You look unwell, Kisaki.\""
10054010-18 = "...What?"
10054010-20 = "I see. You were concerned for my health."
10054010-21 = "While I do appreciate your care... *sigh*"
10054010-22 = "Nothing. Only a projection of my own desires. More importantly..."
10054010-23 = "..."
10054010-24 = "...Did my Genryumon cause you trouble?"
10054010-25 = "[s1] \"EHHH?!\"\n[s2] \"N-Not at all! It's not like that...!\""
10054010-28 = "Hmm?"
10054010-29 = "..."
10054010-30 = "I'm rather...disappointed. Was the nature of our relationship not above such deception? Since when do we lie to one another?"
10054010-32 = "When she put it like that, I had to tell Kisaki the truth."
10054010-34 = "*sigh*"
10054010-35 = "[s] \"D-Don't scold them too much, okay...?\""
10054010-36 = "I understand. They harbored no ill intent."
10054010-37 = "Although that does not necessarily mitigate the impact of their actions."
10054010-38 = "I hold a certain amount of responsibility as well, for being the root cause of their concern."
10054010-39 = "[s] \"Are you...really not feeling well?\""
10054010-40 = "It is nothing serious. Simply...heat exhaustion."
10054010-41 = "Rumi's explanation was as accurate as any. It is rather rote for my health to suffer at this time of year."
10054010-42 = "Fufu. Please, you needn't worry so, Sensei. It's unrelated to my usual condition. "
10054010-43 = "Do you believe Saya to be the type to sit idly by if it were?"
10054010-44 = "[s] \"If you mean it, I'm relieved...\""
10054010-45 = "What did she say? To \"rest mentally and physically\"?"
10054010-46 = "[s] \"I agree with her there.\""
10054010-47 = "...I find it difficult to protest. However, my workload may beg to differ."
10054010-48 = "You say I should take a vacation for summer break?"
10054010-49 = "Fufu. An alluring proposition...for any other student. However, I am the president of Genryumon."
10054010-50 = "I cannot simply run off as I please, citing \"rest\" as my only justification."
10054010-51 = ""
10054010-53 = ""
10054010-54 = ""
10054010-55 = ""
10054010-56 = ""
10054010-57 = "Hello, Madam President! How are you feeling?"
10054010-58 = "Public Relations Manager Kanae. It is rare for you to reach out first. Did something happen?"
10054010-59 = "Madam, I'm hurt! Perhaps I simply wanted to talk to you! Must there be some kind of emergency for me to call you?"
10054010-60 = "They say one can visit an empty home three times to secure the talent essential to their greater plan, right?"
10054010-61 = "A-Ah? That doesn't fit this scenario?"
10054010-62 = "Not at all. That saying means talented people are worth the effort to recruit them."
10054010-63 = "Gah!"
10054010-64 = "To return to the topic at hand... I would believe that from someone else, but not you."
10054010-65 = "You know better than anyone the current state of my affairs, as well as my health. And any message for me would come through a third party, would it not?"
10054010-66 = "Such is your definition of \"romance.\""
10054010-67 = "As expected of Madam! You know me so well!"
10054010-68 = "...I do suppose my enthusiastic agreement only serves to emphasize the contradiction between my words and actions even more."
10054010-69 = "However, I will not falter!! For it is said that one must have the strength to uproot mountains and the might to shadow the world!"
10054010-70 = "A-Ah? That doesn't work here either?"
10054010-71 = "Yes. And the ending to that one is not a particularly happy one. Kaguya may be disappointed in you."
10054010-72 = "I'll never recover from this!"
10054010-73 = "A-Ahem! Despite how contradictory, and possibly even rude, I am being, I have a request!"
10054010-74 = "Could we please all gather together in my office—I mean, the reception room!"
10054010-75 = "..."
10054010-76 = "Please be honest with me, Kanae. Is some impending doom rearing its head to strike Shanhaijing?"
10054010-77 = "...Pardon?"
10054010-78 = "Ah... I see now that the way I approached this topic was misleading at best... I do apologize. "
10054010-79 = "However! No impending doom awaits us! Please! What do I have to do for you to trust me?"
10054010-80 = "I only wanted to arrange a meal amongst friends..."
10054010-81 = "..."
10054010-82 = "Is the Black Tortoise Promenade's...President Rumi also coming?"
10054010-83 = "Ah? Ah... You have it right! From a certain perspective, she could be seen as a connecting thread weaving through this tapestry..."
10054010-84 = "Fufu. And the pieces fall into place. However, Kanae..."
10054010-85 = "Yes?"
10054010-86 = "Please take this moment to tidy the reception room. It's lain in disuse for quite some time now."
10054010-87 = "That's true..."
10054010-88 = ""
10054010-89 = "[ns] \"Who in the world was that?\""
10054010-90 = "I'd forgotten that you have yet to meet her. A lapse in my judgment, considering how close we've become as late."
10054010-91 = "I hope this late introduction does not foster distrust between us. I sincerely apologize."
10054010-92 = ""
10054010-94 = ""
10054010-95 = "[ns] \"I'm getting more and more curious...\""
10054010-96 = "Kanae is a very important member of Genryumon. She works alongside Mina to keep our day to day operations running smoothly."
10054010-97 = "While Mina manages our external affairs, Kanae is well-acquainted with the delicate web of our internal procedures. "
10054010-98 = "Like yin and yang, Genryumon could not persist with one missing."
10054010-99 = "It must seem strange that you have not met her, even by chance, considering the time you've spent here."
10054010-100 = "Shall I spoil it for you...?"
10054010-101 = ""
10054010-103 = ""
10054010-104 = "Fufu, I think not. You will have the pleasure of discovering that for yourself once you meet her."
10054010-106 = "The Black Tortoise Promenade's catering buffet is here!"
10054010-107 = "Don't expect any luxuries, but we've prepared some popular summer dishes. I hope you enjoy."
10054010-108 = ""
10054010-110 = ""
10054010-111 = ""
10054010-113 = ""
10054010-114 = ""
10054010-115 = ""
10054010-116 = "Welcome, welcome, one and all! I thank you profusely for finding time in your busy schedules to enjoy this meal with me!"
10054010-117 = "Fufu. It has been quite some time, hasn't it, Kanae? Thank you for inviting us."
10054010-118 = "Thanks, Kanae!#nWait, Sensei's here too? Hi, Sensei!"
10054010-119 = "[s] \"Hi there, Kokona!\""
10054010-120 = "How many times do I have to tell you! Call me Instructor Kokona!"
10054010-121 = "[s] \"Ah, right! Kokona— No, I meant Instructor Kokona!\""
10054010-122 = "Ehhh? Ugh! Are you making fun of me, Sensei? It's hard to tell, sometimes!"
10054010-123 = ""
10054010-125 = ""
10054010-126 = ""
10054010-127 = "And at last, we meet, Sensei! I am Miyauchi Kanae! A pleasure to meet you!"
10054010-128 = "Me meeting Sensei, and Sensei meeting me... It's like fish in water!"
10054010-129 = "Hah! Now, how was that one, Madam? Did I use the proper idiom for the situation?"
10054010-130 = "I suppose... However, you shouldn't impose yourself on Sensei so."
10054010-131 = "R-Really...? Aww."
10054010-132 = "[s] \"Kanae, right? Nice to meet you.\""
10054010-133 = "...Do you know how long it's been since Sensei first came to Shanhaijing? You took your sweet time introducing yourself!"
10054010-134 = "Wh-While I won't make excuses for myself... I do think my reasons are entirely fair! You do understand, don't you, Mina?"
10054010-135 = "\"Fair\" is a stretch by any imagination."
10054010-136 = ""
10054010-137 = "[ns] \"Don't be so harsh! I'm happy to meet her now.\""
10054010-138 = "While your consideration and forgiving nature is a strength of yours, Sensei..."
10054010-139 = "You cannot extend it to Kanae. Absolutely not."
10054010-140 = "Allow me to explain why she has trapped herself in her office all this time..."
10054010-141 = "Because she's crazy! She has this weird belief that strategists have to work out of a teeny tiny room to unleash their maximum potential!"
10054010-142 = "C-Crazy?! Me?! Mina, don't speak on subjects you don't understand!"
10054010-143 = "Every strategist ought to have a proper rocking chair to rock in while they strategize! In fact, that's our hearts' desire!"
10054010-144 = "Writing can only record names, and swordsmanship is only good for defeating the enemy in front of you."
10054010-145 = "But strategies and the art of war are measures to defeat tens of thousands of enemies!"
10054010-146 = "Huh? That sounded like it was somewhat right... Didn't it?"
10054010-147 = "It is not. That quote was spoken by a general, not a strategist."
10054010-148 = "R-Really?!"
10054010-149 = "And that's not even true, you idiom-obsessed idiot! No one thinks like that!"
10054010-150 = ""
10054010-152 = ""
10054010-153 = "Now, now. Why don't we all take a deep breath and settle down? Madam Kisaki is present, after all."
10054010-154 = "Ack! Yes, yes, I apologize, Madam and guests!"
10054010-155 = "There are no excuses for the way I acted. I won't let it happen again."
10054010-157 = "[ns] \"Does that mean...Kanae never leaves her room?\""
10054010-158 = "Fufu. No, only when she is performing her \"strategist\" duties."
10054010-159 = "One of your hobbies is traveling, correct?"
10054010-160 = "As Madam said! Sensei, do you like to travel? We should go on a trip together! Ideally when you have a Monday or Friday off!"
10054010-161 = "Sometimes, I wonder if you need to be diagnosed with something."
10054010-162 = "How cruel, Mina! I simply have strong boundaries between my professional and personal life! "
10054010-163 = "I am allowed to be who I please outside of the office! And that is also..."
10054010-164 = "...a strategist's dream! Is it not a pleasure to study and practice what you have learned?"
10054010-165 = "What does that have ANYTHING to do with what we're talking about?"
10054010-166 = "Oh... Did that saying not work here?"
10054010-167 = "Not at all!"
10054010-168 = "Look, live your dreams or whatever you please. But you need to come out of your room and help out other departments every once in a while!"
10054010-169 = "Oh, dear Mina! Without clearly defined roles and responsibilities, an organization will crumble at the seams!"
10054010-170 = "\"Roles\"...? \"Responsibilities\"...?"
10054010-171 = ""
10054010-173 = ""
10054010-176 = "HELP! WITH!"
10054010-177 = ""
10054010-182 = "OTHER! TASKS!"
10054010-183 = ""
10054010-188 = "That IS our role! To FIND and COMPLETE tasks that need to be done!"
10054010-189 = ""
10054010-194 = "If I hear you talk about responsibilities ONE MORE TIME to try to shove YOUR work onto ME—!!"
10054010-195 = "Oww!! OWWW! Help, it hurts!!"
10054010-196 = "Fufu. While I'm happy to see that both Mina and Kanae are healthy and happy, we're here to enjoy a nice meal together, yes?"
10054010-197 = "Exactly! It's a good thing the Plum Blossom Garden children are not here, but imagine what kind of example this would set for them."
10054010-198 = "...Again, I have no excuses. I apologize."
10054010-199 = "*sob* *sniff* Shun, do you see how hard I have it? Mina's always like this whenever she sees me!"
10054010-200 = "It's rather rare for you two to see each other, however."
10054010-201 = "Because she'll give me a hard time whenever we do... Hee, hee."
10054010-202 = "I'm willing to take responsibility for things I've ACTUALLY done..."
10054010-203 = "[ns] \"Deep breaths, Mina. Good job.\""
10054010-204 = "*sigh* Thank you, Sensei."
10054010-205 = "Fufu. Don't scold her too much, Sensei, and you too, Mina. "
10054010-206 = "She has her faults, but no one is more dedicated to thorough administrative work and new hire onboarding in all of Genryumon."
10054010-207 = "Every document that comes across my desk has been reviewed by Kanae first. "
10054010-208 = "When it comes to her work, I have unwavering trust in her. "
10054010-209 = "I do acknowledge that if a crisis were to ever strike Genryumon again, Kanae would have to retreat to her office to fully dedicate herself to paperwork and administrative work, just like last time."
10054010-210 = "Yes, I'm painfully aware of that fact..."
10054010-211 = "Heehee..."
10054010-212 = "Also, the scope of Kanae's role, as she defines it, is admittedly rather narrow."
10054010-213 = "Boo..."
10054010-215 = ""
10054010-217 = ""
10054010-218 = "So, what is the reason for this meeting? The food was delicious, and the gathering entertaining."
10054010-219 = "However, at risk of repeating myself, this is all rather out-of-character for you, Kanae."
10054010-220 = "Ah, yes! I understand!"
10054010-221 = ""
10054010-223 = ""
10054010-224 = "Yes, according to my intel..."
10054010-225 = "The Black Tortoise Promenade has invested funds in an outside facility, Madam."
10054010-226 = "The Black Tortoise Promenade?"
10054010-227 = "Funds?"
10054010-228 = "Oh?"
10054010-229 = "Huh?"
10054010-230 = "..."
10054010-231 = "..."
