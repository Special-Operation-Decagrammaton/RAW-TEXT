[translation]
10033095-2 = "으앙–! 어째서?!"
10033095-6 = "다행이에요. 어떻게든 막아냈어요……!"
10033095-7 = "(이것으로, 무사히 저녁까지 폭죽을 지킬 수만 있으면…….)"
10033095-12 = "리, 리더! 큰일났습니다!"
10033095-13 = "축제 폭죽 더미에…… 폭죽 더미가……!"
10033095-15 = "응? 폭죽 더미가 왜? 무슨 일이라도 생겼어?"
10033095-16 = "조금 전 싸움 때문에 불이 붙어 버렸습니다!"
10033095-18 = "네?!?!"
10033095-19 = "[ns] \"그럼 터져버리는 거야?!\""
10033095-20 = "괜찮습니다! 신목제에서 사용하는 폭죽은, 상당히 큰 폭죽이어서, 어느 정도의 둔감 처리를 해 두었으니까요!"
10033095-21 = "불이 붙은 것 정도로는 폭발하지 않습니다!"
10033095-22 = "그렇지만 내버려두면 폭죽이 전부 불에 타 버리고 말 거에요! 어서 불을 끄지 않으면……!"
10033095-24 = "아, 죄송. 죄송. 늦었슴다. 리더. 오다가 닭꼬치가 너무 먹음직스러워서!"
10033095-28 = "우와아앗?!"
10033095-32 = "아야야야……. 뭡니까, 이건. 엥? 폭죽더미?"
10033095-36 = "[ns1] \"잠깐, 지금 폭죽 더미 위로……\"\n[ns2] \"로켓 발사기 탄두가, 점화된 채……?!\""
10033095-39 = "안 돼요!!!!!"
