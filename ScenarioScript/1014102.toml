[translation]
1014102-1 = "การพบกันที่ไม่คาดคิด"
1014102-3 = "(ระหว่างเดินทางกลับจากการทำงานนอกสถานที่) "
1014102-4 = ""
1014102-6 = ""
1014102-7 = ""
1014102-8 = ""
1014102-9 = ""
1014102-10 = "(คุณครูเห็นฮารุกะกำลังเดินเตร็ดเตร่อยู่หน้าสถานที่ที่ดูเหมือนจะเป็นหอแสดงนิทรรศการบางอย่าง)"
1014102-11 = ""
1014102-13 = ""
1014102-14 = ""
1014102-15 = ""
1014102-16 = ""
1014102-17 = "(แต่ด้วยเหตุผลบางอย่าง ฮารุกะเลยไม่ได้เข้าไปในหอแสดงนิทรรศการ)"
1014102-18 = ""
1014102-19 = "(คุณครูตัดสินใจเดินเข้าไปพูดคุย)"
1014102-20 = ""
1014102-22 = ""
1014102-23 = ""
1014102-24 = ""
1014102-25 = "คะ... คุณครู?!"
1014102-26 = ""
1014102-28 = ""
1014102-29 = ""
1014102-30 = "[ns] \"สวัสดี ฮารุกะ\""
1014102-31 = "สะ... สวัสดีค่ะ!"
1014102-32 = "ขะ... ขอโทษนะคะ! ฉันไม่ทันรู้ตัวเลยว่าคุณครูกำลังเดินมา...!"
1014102-33 = "[s] \"มางานนิทรรศการเหรอ?\""
1014102-34 = "คะ? อ่า... เอ่อ... ค่ะ จะว่าอย่างนั้นก็ได้ค่ะ"
1014102-35 = "นี่คืองานนิทรรศการอะไรน่ะเหรอคะ?"
1014102-36 = "งานนิทรรศการพืชพรรณแห่งคิโวทอส... ค่ะ"
1014102-37 = "ได้ยินว่าเป็นงานขนาดใหญ่ที่มีการจัดแสดงและจำหน่ายไม้พุ่มสำหรับปลูกในแปลง หรือพวกต้นไม้ริมทาง แล้วก็พวกอุปกรณ์จัดสวน... ด้วยค่ะ"
1014102-38 = "[s] \"อ้อ ก็เลยแต่งตัวสวยมาแบบนี้สินะ\""
1014102-39 = "คะ?"
1014102-40 = "คะคะคะคะ?!"
1014102-41 = "สะ... สวยงั้นเหรอคะ? มะ... ไม่มีทางเป็นอย่างนั้นหรอกค่ะ!"
1014102-42 = "คนที่ทั้งดูโทรม หมองเศร้า แถมยังแผ่ออร่าแปลกๆ ออกมาตลอดเวลาอย่างฉัน ต่อให้ใส่เสื้อผ้าสวยๆ แบบนี้ ก็มีแต่จะทำให้ความงดงามของชุดต้องแปดเปื้อน...!"
1014102-43 = "[s] \"ใครบอกกัน? ครูว่าสวยจริงๆ นะ?\""
1014102-44 = "ฮะ... เฮือกก...!"
1014102-45 = "ถะ... ถะ... ถ้าคุณครูต้องฝืนพูดอะไร เพียงเพราะเห็นแก่คนอย่างฉันละก็..."
1014102-46 = "[s] \"ครูพูดจากใจจริงต่างหาก?\""
1014102-47 = "อ๊ายยยย...!"
1014102-48 = "ขอโทษค่ะขอโทษค่ะขอโทษค่ะ...!"
1014102-50 = "(คุณครูเข้าไปปลอบฮารุกะที่กำลังตื่นตระหนกอย่างอ่อนโยน)"
1014102-52 = "ฮือ..."
1014102-53 = "ขอโทษค่ะ... ฉันเอาแต่พูดพล่ามอยู่คนเดียวตามนิสัยอีกแล้ว..."
1014102-54 = "คะ? ทำไมฉันถึงไม่เข้าไปในหอแสดงนิทรรศการน่ะเหรอคะ?"
1014102-55 = "กะ... ก็..."
1014102-56 = "ก็ฉันไม่มีสิทธิ์ที่จะเข้าไปชมข้างใน... นี่คะ?"
1014102-57 = "[s1] \"หืม?\"\n[s2] \"แค่จ่ายเงินก็เข้าไปชมได้แล้วไม่ใช่เหรอ...?\""
1014102-60 = "มะ... ไม่ใช่อย่างนั้นค่ะ คือว่า..."
1014102-61 = "วันนี้ฉันมาที่นี่ในฐานะผู้เฝ้าประตู... แบบว่า มาเป็นเจ้าหน้าที่รักษาความปลอดภัยน่ะค่ะ... "
1014102-62 = "ก็เลยไม่จำเป็นต้องเข้าไปข้างในหอแสดงนิทรรศการค่ะ..."
1014102-63 = "[s] \"เจ้าหน้าที่รักษาความปลอดภัย...?\""
1014102-64 = "ระ... หรือว่าฉันเข้าใจความหมายของการรักษาความปลอดภัยผิดไปคะ?!"
1014102-65 = "หรือมันไม่ใช่การมาเฝ้าประตู แต่เป็น \"ที่ไหนมีเจ้าหน้าที่รักษาความปลอดภัย ที่นั่นก็คือประตู\" แบบนี้หรือเปล่าคะ?!"
1014102-66 = "[s] \"ถ้าถึงขั้นนั้น มันน่าจะทะลุขอบเขตการรักษาความปลอดภัยแล้วนะ?!\""
1014102-68 = "(ฮารุกะเล่าว่าเธอได้รับการว่าจ้างจากผู้จัดงานให้ทำหน้าที่เป็นเจ้าหน้าที่รักษาความปลอดภัย)"
1014102-69 = ""
1014102-71 = ""
1014102-72 = "[ns] \"ถ้างั้นเหตุผลที่ใส่ชุดเดรสมาก็เพราะ...\""
1014102-73 = "ใช่ค่ะ มันเป็นเดรสโค้ดของงานนี้... น่ะค่ะ"
1014102-74 = "ทางนี้บอกว่าเจ้าหน้าที่รักษาความปลอดภัยก็ต้องใส่ชุดทางการด้วย..."
1014102-75 = "หรือว่าชุดนี้มันดูไม่เป็นทางการคะ...?!"
1014102-76 = "[s] \"ไม่มีชุดไหนเป็นทางการไปกว่าชุดเดรสแล้วละ...\" "
1014102-77 = "งะ... งั้นเหรอคะ? "
1014102-78 = "ถ้างั้นฉันก็ค่อยสบายใจหน่อย... "
1014102-79 = ""
1014102-81 = ""
1014102-82 = "ตู้มมมม!"
1014102-83 = ""
1014102-85 = ""
1014102-86 = "[ns] \"เสียงระเบิดเหรอ...?!\""
1014102-87 = "ดังมาจากในหอแสดงนิทรรศการค่ะ...!"
1014102-88 = "สะ... สงสัยเกิดการทะเลาะวิวาทในนั้น...!"
1014102-89 = ""
1014102-91 = ""
1014102-92 = "ต้นไม้ริมทางที่ยอดเยี่ยมที่สุดมีแค่ต้นแปะก๊วยเท่านั้น! ส่วนต้นอื่นๆ น่ะ ก็แค่ต้นไม้ไร้ค่า!"
1014102-93 = "พวกหัวโบราณตกยุคนี่! ชอบกลิ่นเหม็นชวนอ้วกของต้นแปะก๊วยขนาดนั้นเลยรึไง!"
1014102-94 = "ว่าไงนะ? กลิ่นเหม็นชวนอ้วก?! แล้วทีต้นพลาทานัสของพวกแก พอถึงฤดูใบไม้ผลิก็โปรยปุยเมล็ด#nเหมือนขนหมาไม่มีผิดเลยไม่ใช่หรือไง!"
1014102-95 = "ว่าไงนะ...?! ขนหมางั้นเหรอ?!"
1014102-96 = "พวกเรา จัดการแก๊งบ้านี่เลย!!"
1014102-97 = ""
1014102-101 = "ทะ... ทะเลาะกันเรื่องต้นไม้ริมทางงั้นเหรอคะ?"
1014102-102 = "ทำยังไงดีล่ะ? ควรเข้าไปห้ามมั้ยคะ? "
1014102-103 = "อึก... ฉันไม่ได้รับแจ้งให้จัดการสถานการณ์แบบนี้ด้วย..."
1014102-104 = ""
1014102-107 = "[ns] \"หืม? เหมือนจะมีท่อนไม้ลอยมา...\""
1014102-111 = "[ns] \"อ๊ะ โดนลูกหลงเข้าให้แล้ว\""
1014102-112 = ""
1014102-113 = "[ns] \"เอ่อ ฮารุกะ? ทำไมทำหน้าแบบนั้น...\""
1014102-114 = "ไอ้..."
1014102-115 = "ไอ้พวกสร้างความรำคาญเหมือนศัตรูพืช...!!!"
1014102-116 = "[s5] \"ฮารุกะ?!\"\n[s6] \"ครูไม่เป็นไรจริงๆ...\""
1014102-119 = ""
1014102-121 = ""
1014102-127 = "กล้าดียังไงถึงปาท่อนไม้ใส่หน้าคุณครู?!"
1014102-128 = "อะ... อะไรกัน เธอเป็นใคร?!"
1014102-129 = "ไม่ต้องรู้หรอกค่ะ เอาเป็นว่าพวกคุณน่ะ ตายซะเถอะค่ะ ตายซะเถอะค่ะ ตายซะเถอะค่ะ ตายซะเถอะค่ะ!!"
1014102-130 = "ฉันจะฝังทุกคนไว้ใต้ต้นไม้ที่ชอบนักชอบหนานี่เลย!!"
1014102-131 = "วะ... ไว้ชีวิตฉันด้วย!!"
1014102-132 = ""
1014102-139 = "(แล้วฮารุกะก็ปราบกลุ่มคนที่ก่อความวุ่นวายในหอแสดงนิทรรศการได้ในที่สุด)"
1014102-140 = "(แม้ว่าหอแสดงนิทรรศการจะได้รับความเสียหายหนักมากก็ตาม...)"
1014102-142 = "ตรอกหลังหอแสดงนิทรรศการ"
1014102-143 = ""
1014102-144 = "[ns] \"เหนื่อยแย่เลยนะ ฮารุกะ\""
1014102-145 = "เอ่อ... อึก..."
1014102-146 = "ขอโทษค่ะ คุณครู ขอโทษค่ะ ขอโทษค่ะ ขอโทษค่ะ..."
1014102-147 = "คุณครูถึงกับไปคุยกับผู้จัดงานเพื่อแก้ตัวให้ฉันเลย... "
1014102-148 = "[s] \"ไม่เป็นไรหรอก ฮารุกะแค่ทำสิ่งที่ตัวเองต้องทำก็เท่านั้น\" "
1014102-149 = "ฮือ..."
1014102-150 = "ขอบคุณนะคะ คุณครู..."
1014102-152 = "(หลังจากนั่งพักสักครู่จนรู้สึกดีขึ้น)"
1014102-153 = "(คุณครูก็เดินไปส่งฮารุกะถึงสำนักงานหน่วยรับจ้างสารพัด)"
