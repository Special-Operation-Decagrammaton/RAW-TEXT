[translation]
1014102-1 = "意外的邂逅"
1014102-3 = "（結束外勤回來的途中）"
1014102-4 = ""
1014102-6 = ""
1014102-7 = ""
1014102-8 = ""
1014102-9 = ""
1014102-10 = "（遙香正在某個類似博覽會場的前面徘徊）"
1014102-11 = ""
1014102-13 = ""
1014102-14 = ""
1014102-15 = ""
1014102-16 = ""
1014102-17 = "（然而遙香並沒有走進博覽會場裡）"
1014102-18 = ""
1014102-19 = "（決定上前搭話）"
1014102-20 = ""
1014102-22 = ""
1014102-23 = ""
1014102-24 = ""
1014102-25 = "老，老師！？"
1014102-26 = ""
1014102-28 = ""
1014102-29 = ""
1014102-30 = "[ns] 「你好，遙香。」"
1014102-31 = "您，您好！"
1014102-32 = "對，對不起！#n我竟然沒察覺到老師走過來……！"
1014102-33 = "[s] 「你是來逛博覽會的嗎？」"
1014102-34 = "咦？啊，那個……可，可以這麼說。"
1014102-35 = "啊，您問我這是什麼樣的博覽會嗎？"
1014102-36 = "這是奇普托斯造景植物博覽會……"
1014102-37 = "聽說是展示並販售行道樹、花壇用灌木，還有造景用品之類的大型活動……"
1014102-38 = "[s] 「原來如此，所以你才打扮得這麼漂亮啊。」"
1014102-39 = "咦？"
1014102-40 = "咦咦咦咦！？"
1014102-41 = "漂，漂亮什麼的！怎，怎麼可能！"
1014102-42 = "像我這種既寒酸又陰沉，還總是散發著奇怪氛圍的傢伙，#n就算穿上這種漂亮的衣服，也只會糟蹋衣服本身的美感而已……！"
1014102-43 = "[s] 「不會啊，真的很漂亮。」"
1014102-44 = "呼，呼耶耶耶……！"
1014102-45 = "那，那是您為了顧慮我這種人而說出的違心之論吧……"
1014102-46 = "[s] 「我是真心的哦？」"
1014102-47 = "嗚啊啊啊啊啊……！"
1014102-48 = "對不起對不起對不起……！"
1014102-50 = "（溫柔地安撫了驚慌失措的遙香）"
1014102-52 = "嗚嗚嗚……"
1014102-53 = "對不起……我又只顧著把自己的想法一股腦地說出來了……"
1014102-54 = "咦？問我為什麼不進去是嗎？"
1014102-55 = "那，那是因為……"
1014102-56 = "因為我……沒有進去的資格……"
1014102-57 = "[s1] 「咦？」\n[s2] 「這裡不是只要付錢就能進去了嗎……？」"
1014102-60 = "啊，不是，那個……"
1014102-61 = "我今天是以守門人……也就是保全的身分來的……"
1014102-62 = "當然就沒有必要走進會場裡了……"
1014102-63 = "[s] 「保全……？」"
1014102-64 = "啊，難道是我誤解了保全的意思嗎！？"
1014102-65 = "其實並不是要守著門……而是保全在哪裡，哪裡就是門嗎！？"
1014102-66 = "[s] 「那樣好像已經超越保全的等級了吧！？」"
1014102-68 = "（聽遙香說明後才得知，他是受博覽會主辦方雇用來擔任保全的）"
1014102-69 = ""
1014102-71 = ""
1014102-72 = "[ns] 「那麼穿禮服來的理由也是……」"
1014102-73 = "是的，好像是叫服裝規定……的樣子。"
1014102-74 = "因為聽說要當保全就得穿正式一點的服裝……"
1014102-75 = "……難道說這套服裝，看起來不太正式嗎！？"
1014102-76 = "[s] 「應該沒有比禮服更正式的服裝了吧……」"
1014102-77 = "這，這樣啊。"
1014102-78 = "那我就放心了……"
1014102-79 = ""
1014102-81 = ""
1014102-82 = "轟隆隆隆──！"
1014102-83 = ""
1014102-85 = ""
1014102-86 = "[ns] 「爆炸聲……！？」"
1014102-87 = "是從會場裡面傳來的……！"
1014102-88 = "好，好像是起了爭執……！"
1014102-89 = ""
1014102-91 = ""
1014102-92 = "最出色的行道樹就只有銀杏樹！除此之外全都是邪教！"
1014102-93 = "你們這些死腦筋的傳統主義者！那種臭死人的樹到底好在哪裡啊！"
1014102-94 = "什麼？臭！？#n你們那些懸鈴木不也是每到春天，那種像狗毛一樣的種子就會到處亂飛嗎！？"
1014102-95 = "你說什麼……！？狗毛！？"
1014102-96 = "大家，給我上！！"
1014102-97 = ""
1014102-101 = "是，是為了行道樹在吵架嗎……？"
1014102-102 = "怎麼辦？該去勸架嗎？ "
1014102-103 = "嗚嗚，可是我沒有收到關於這種狀況的指示啊……"
1014102-104 = ""
1014102-107 = "[ns] 「嗯？怎麼有塊木頭飛過來──」"
1014102-111 = "[ns] 「啊，被砸到了。」"
1014102-112 = ""
1014102-113 = "[ns] 「那個，遙香？你的表情怎麼……」"
1014102-114 = "這……"
1014102-115 = "這群該死的蟲子──！！！"
1014102-116 = "[s5] 「遙香！？」\n[s6] 「我真的沒事……」"
1014102-119 = ""
1014102-121 = ""
1014102-127 = "竟敢把木頭丟到老師臉上！？"
1014102-128 = "什，什麼啊？你是誰！？"
1014102-129 = "你們不用知道，總之你們都給我去死給我去死給我去死給我去死！！"
1014102-130 = "我會把你們全都埋在各自喜歡的樹下的！！"
1014102-131 = "救，救命啊！！"
1014102-132 = ""
1014102-139 = "（就這樣，遙香把博覽會場裡鬧事的人們全都乾淨俐落地制伏了）"
1014102-140 = "（……雖然在過程中，會場受到了不小的附帶損害就是了）"
1014102-142 = "博覽會場後巷"
1014102-143 = ""
1014102-144 = "[ns] 「辛苦了，遙香。」"
1014102-145 = "那個……嗚嗚嗚……"
1014102-146 = "對不起，老師。對不起對不起對不起……"
1014102-147 = "您甚至還為了我特地去跟主辦方解釋賠罪…… "
1014102-148 = "[s] 「沒關係，遙香只是做了該做的事而已。」"
1014102-149 = "嗚嗚嗚……"
1014102-150 = "謝謝您，老師……"
1014102-152 = "（就這樣在長椅上坐著恢復了一些體力之後）"
1014102-153 = "（我把遙香送回了便利屋的事務所）"
