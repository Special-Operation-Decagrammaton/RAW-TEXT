[translation]
1014102-1 = "뜻밖의 마주침"
1014102-3 = "(외근을 마치고 돌아오던 중.)"
1014102-10 = "(어떠한 박람회장? 같은 곳 앞에서 하루카가 서성거리고 있다)"
1014102-17 = "(그런데 어쩐지 박람회장 안으로는 들어가지 않고 있는 하루카.)"
1014102-19 = "(일단, 다가가서 말을 걸었다.)"
1014102-25 = "서, 선생님?!"
1014102-30 = "[ns] \"안녕, 하루카.\""
1014102-31 = "아, 안녕하세요!"
1014102-32 = "죄, 죄송합니다! 선생님이 다가오는 것도 모르고 있었다니……!"
1014102-33 = "[s] \"박람회에 온 거야?\""
1014102-34 = "예? 아, 그…… 예, 그런 셈이에요."
1014102-35 = "아, 그런데 여기는 무슨 박람회냐고요?"
1014102-36 = "키보토스 조경식물 박람회……예요."
1014102-37 = "가로수나 화단용 관목들, 조경 용품 같은 것들을 전시하고 판매하는 큰 행사……라고 들었어요."
1014102-38 = "[s] \"아하, 그래서 이렇게 예쁘게 차려 입고 왔구나.\""
1014102-39 = "예?"
1014102-40 = "예예예예?!"
1014102-41 = "예, 예쁘다뇨! 그, 그럴 리가 없어요!"
1014102-42 = "저처럼 허름하고 음침하고 어딘가 이상한 분위기만 풍기는 녀석이 이런 예쁜 옷을 입어 봤자 옷의 좋은 느낌만 망칠 뿐이고……!"
1014102-43 = "[s] \"아닌데? 진짜로 예쁜데?\""
1014102-44 = "흐, 흐에에에……!"
1014102-45 = "그, 그, 저 같은 걸 배려해 주시느라 그런 마음에도 없는 말씀을……."
1014102-46 = "[s] \"진심인데?\""
1014102-47 = "으아아아아아……!"
1014102-48 = "죄송합니다죄송합니다죄송합니다……!"
1014102-50 = "(허둥대는 하루카를 상냥하게 달래주었다.)"
1014102-52 = "흐우우우……."
1014102-53 = "죄송합니다……. 또 저 혼자 멋대로 말만 쏟아내고……."
1014102-54 = "예? 그런데 왜 박람회장에 들어가지 않고 있었냐고요?"
1014102-55 = "그, 그야……."
1014102-56 = "저는, 들어갈 자격이 없으니까……요?"
1014102-57 = "[s1] \"엥?\"\n[s2] \"여긴 돈만 내면 들어갈 수 있는 곳인데……?\""
1014102-60 = "아, 아뇨, 그게……."
1014102-61 = "저는 오늘 이곳에 문지기…… 그러니까 시큐리티로 온 거라……."
1014102-62 = "당연히 박람회장 안으로는 들어갈 필요가 없어요……."
1014102-63 = "[s] \"시큐리티……?\""
1014102-64 = "아, 아니면 혹시 제가 시큐리티의 뜻을 잘못 이해한 건가요?!"
1014102-65 = "문을 지키는 게 아니라, 시큐리티가 있는 곳이 곧 문이 되는 그런 시스템인 건가요?!"
1014102-66 = "[s] \"그 정도면 이미 시큐리티의 레벨을 넘어선 것 같은데?!\""
1014102-68 = "(말을 들어보니, 하루카는 박람회 운영진 측에 시큐리티 고용되어 온 것이었다.)"
1014102-72 = "[ns] \"그러면 드레스를 입고 온 이유도…….\""
1014102-73 = "예, 드레스코드……라고 하던가요."
1014102-74 = "시큐리티를 서려면 격식 있는 옷을 입어야 한다고 해서……"
1014102-75 = "……혹시 이 옷, 너무 격식이 없어 보이나요?!"
1014102-76 = "[s] \"드레스보다 더 격식을 차릴 수는 없을 것 같은데…….\""
1014102-77 = "그, 그런가요"
1014102-78 = "그러면 안심하고……."
1014102-82 = "콰아아앙!"
1014102-86 = "[ns] \"폭발음……?!\""
1014102-87 = "박람회장 안쪽에서 들려왔어요……!"
1014102-88 = "싸, 싸움이 난 것 같은데……!"
1014102-92 = "가장 훌륭한 가로수는 오직 은행나무뿐! 그 외에는 전부 사도들이다!"
1014102-93 = "이 고리타분한 전통주의자 놈들! 그딴 냄새나는 나무가 그렇게도 좋더냐!"
1014102-94 = "뭐? 냄새?! 네놈들의 플라타너스는 봄만 되면 개털 같은 씨나 흩날리면서!"
1014102-95 = "뭐라……?! 개털?!"
1014102-96 = "얘들아, 쳐라!!"
1014102-101 = "가, 가로수를 가지고 싸우는 건가요……?"
1014102-102 = "어쩌죠? 말려야 할까요?"
1014102-103 = "으우우, 이런 상황에 대해선 전달받은 게 없는데……."
1014102-107 = "[ns] \"응? 웬 나무토막이 날아오…….\""
1014102-111 = "[ns] \"아, 살짝 맞았다.\""
1014102-113 = "[ns] \"저기 하루카? 왜 표정이…….\""
1014102-114 = "이……."
1014102-115 = "이 벌레 같은 놈들이……!!!"
1014102-116 = "[s5] \"하루카?!\"\n[s6] \"난 정말 괜찮…….\""
1014102-127 = "감히 선생님의 얼굴에 나무토막을 던져?!"
1014102-128 = "뭐, 뭐야 당신은?!"
1014102-129 = "알 거 없고 일단 다들 죽어주세요죽어주세요죽어주세요죽어주세요!!"
1014102-130 = "전부 다 좋아하는 나무 밑에 묻어줄 테니까!!"
1014102-131 = "사, 살려줘!!"
1014102-139 = "(그렇게, 하루카는 박람회장에서 난동을 부리던 사람들을 전부 깔끔하게 제압했다.)"
1014102-140 = "(……그 과정에서 박람회장이 부수적 피해를 좀 크게 입긴 했지만.)"
1014102-142 = "박람회장 뒷골목"
1014102-144 = "[ns] \"고생했어, 하루카.\""
1014102-145 = "그…… 으으으……."
1014102-146 = "죄송합니다 선생님, 죄송합니다죄송합니다죄송합니다……."
1014102-147 = "저 때문에 박람회장 측에 가서 변명까지 해 주시고……."
1014102-148 = "[s] \"괜찮아, 하루카가 해야 할 일을 한 건데 뭘.\""
1014102-149 = "우으으으……."
1014102-150 = "감사합니다, 선생님……."
1014102-152 = "(그렇게 벤치에 앉아 얼마간 기력을 회복한 뒤.)"
1014102-153 = "(하루카를 흥신소 사무실로 바래다줬다.)"
