[translation]
1014102-1 = "An Unexpected Meeting"
1014102-3 = "I was on my way home after work. "
1014102-4 = ""
1014102-6 = ""
1014102-7 = ""
1014102-8 = ""
1014102-9 = ""
1014102-10 = "I spotted Haruka out of nowhere, pacing back and forth in front of what looked like an exposition center."
1014102-11 = ""
1014102-13 = ""
1014102-14 = ""
1014102-15 = ""
1014102-16 = ""
1014102-17 = "It seemed like she was having trouble deciding if she should go in or not."
1014102-18 = ""
1014102-19 = "I decided to walk over and see what was wrong."
1014102-20 = ""
1014102-22 = ""
1014102-23 = ""
1014102-24 = ""
1014102-25 = "S-Sensei?!"
1014102-26 = ""
1014102-28 = ""
1014102-29 = ""
1014102-30 = "[ns] \"Hello, Haruka.\""
1014102-31 = "H-Hello!"
1014102-32 = "I-I'm sorry! I didn't even notice you walking up, Sensei...!"
1014102-33 = "[s] \"Are you attending an expo?\""
1014102-34 = "Huh? Oh, um... Yes, I guess I am."
1014102-35 = "You want to know what kind it is?"
1014102-36 = "It's...the Kivotos Landscape Horticulture Expo."
1014102-37 = "They show and sell things like trees, flower shrubs, and landscaping supplies..."
1014102-38 = "[s] \"Aha, so that's why you look so pretty.\""
1014102-39 = "Huh?"
1014102-40 = "Eeeeeh?!"
1014102-41 = "P-PRETTY?! No, no!!"
1014102-42 = "A shabby, gloomy, weirdo like me makes everything I touch LESS pretty!"
1014102-43 = "[s] \"No, I really mean it. You look really pretty.\""
1014102-44 = "Wh-Whaaat...?!"
1014102-45 = "Y-Y-You shouldn't say nice things to make someone as unworthy as me feel better..."
1014102-46 = "[s] \"It's not lip service. I swear.\""
1014102-47 = "UWAAAHHH...!"
1014102-48 = "Sorrysorrysorrysorry!"
1014102-50 = "I gently comforted the flustered Haruka."
1014102-52 = "Huuu..."
1014102-53 = "I'm so sorry... Why do I always have to cause trouble...?"
1014102-54 = "Huh? Why was I just standing out here?"
1014102-55 = "W-Well..."
1014102-56 = "It's because... I don't deserve to go in."
1014102-57 = "[s1] \"Huuuh?\"\n[s2] \"As long as you paid, you do...\""
1014102-60 = "N-No, er..."
1014102-61 = "I'm just working the door today—well, as security. "
1014102-62 = "So of course I don't deserve to actually go inside the center."
1014102-63 = "[s] \"Security...?\""
1014102-64 = "Ack. Did I misunderstand what security is supposed to do?"
1014102-65 = "Maybe I'm not supposed to be guarding the door, but actually become the door itself?!"
1014102-66 = "[s] \"That's way beyond the job description!\""
1014102-68 = "As it turned out, Haruka had been hired as a security guard by the exposition organizers."
1014102-69 = ""
1014102-71 = ""
1014102-72 = "[ns] \"So the reason why you're wearing a dress is also...\""
1014102-73 = "It's the uniform...apparently."
1014102-74 = "They said that security guards should wear \"formal attire.\""
1014102-75 = "I-I see! My outfit isn't formal enough, is it?!"
1014102-76 = "[s] \"Nope. It doesn't get much more formal than a dress.\" "
1014102-77 = "I-Is that so? "
1014102-78 = "That's a relief... "
1014102-79 = ""
1014102-81 = ""
1014102-82 = "BOOOOOOM!"
1014102-83 = ""
1014102-85 = ""
1014102-86 = "[ns] \"An explosion...?!\""
1014102-87 = "It came from inside the exposition center...!"
1014102-88 = "I think a fight broke out!"
1014102-89 = ""
1014102-91 = ""
1014102-92 = "The ginkgo tree is the finest tree of them all! All others pale in comparison!"
1014102-93 = "Such old-fashioned traditionalists! What's so good about that smelly old tree?!"
1014102-94 = "What? Smelly?! Every spring, your plane trees scatter their seeds all over the place...like DOG HAIR!"
1014102-95 = "Nuh-uh, no way you just said that!"
1014102-96 = "Everyone, charge!"
1014102-97 = ""
1014102-101 = "A-Are they fighting over tree types...?"
1014102-102 = "What should I do? Should I stop them? "
1014102-103 = "Uwaaah, this wasn't in my training..."
1014102-104 = ""
1014102-107 = "[ns] \"Oh? Is that a piece of wood flying this way at a dangerous speed?\""
1014102-111 = "[ns] \"Ah, I've been hit.\""
1014102-112 = ""
1014102-113 = "[ns] \"Uh, Haruka? Your whole mood just changed...\""
1014102-114 = "You..."
1014102-115 = "You insignificant worms...!!!"
1014102-116 = "[s5] \"Haruka?!\"\n[s6] \"I'm okay! Really, I'm totally fine!\""
1014102-119 = ""
1014102-121 = ""
1014102-127 = "How dare you throw a piece of wood at Sensei's face?!"
1014102-128 = "Wh-Who the hell are you?!"
1014102-129 = "It doesn't matter, just DIEDIEDIEDIEEE!!"
1014102-130 = "I'll bury you all under those trees that you love so much!!"
1014102-131 = "H-Help!!"
1014102-132 = ""
1014102-139 = "And just like that, Haruka quickly subdued all the people who had been causing a disturbance at the expo."
1014102-140 = "Although the exposition center itself was...collateral damage, to put it delicately."
1014102-142 = "Alley Behind Exposition Center"
1014102-143 = ""
1014102-144 = "[ns] \"Good work, Haruka.\""
1014102-145 = "Um... Ughhh..."
1014102-146 = "I'm sorry, Sensei, I'msorryI'msorryI'msorryI'msorry..."
1014102-147 = "You even had to beg on your knees to the organizers on my behalf! "
1014102-148 = "[s] \"That's a little dramatic... And it's really okay, Haruka.\" "
1014102-149 = "Ugh..."
1014102-150 = "Thank you, Sensei..."
1014102-152 = "We took a breath and decompressed on a bench for a little bit."
1014102-153 = "When we both felt better, I walked Haruka back to the Problem Solver office."
