[translation]
42200-1 = "제20화;카르바노그의 굴속에서 1"
42200-2 = "사일로 오퍼레이션 룸"
42200-5 = "'……토끼가 올무를 건드렸다.'"
42200-6 = "FOX 1. 작전을 시작한다. 각 소대원은 위치를 사수하며 상황 보고할 것."
42200-10 = "여기는 FOX 4. 방금 포인트 알파에서 적 드론 1기가 관측되어 격추하였음."
42200-11 = "사실 긴장한 나머지 대뜸 돌격을 하진 않을까 걱정했었는데…… 역시 미야코 소대장은 신중하네. 기합이 잔뜩 들어가 있어."
42200-12 = "다만 그 이후로 별다른 움직임은 보이질 않아."
42200-13 = "무언가 재미있는 묘수라도 궁리하는 걸까?"
42200-14 = "FOX 4. 긴장을 늦추지 말도록. 1학년이라고는 하지만 상대 또한 SRT다."
42200-15 = "알겠어, 확인."
42200-16 = "우선 아까의 사격으로 위치가 발각되었을 수도 있으니, 나는 매복 지점을 변경한 뒤에 다시 신호할게."
42200-20 = "여기는 FOX 3. 현재 포인트 리마— 오퍼레이션 룸으로 향하는 중앙 엘리베이터의 입구 근처에서 엄폐 대기 중."
42200-21 = "이 앞은 좁은 철제 난간으로 이루어져 있어서 나 혼자서도 방어할 수 있을 것 같아."
42200-22 = "운 좋게 저격을 피했다 하더라도 내 방패를 무시하고 지나갈 수는 없을 거야."
42200-23 = "잠깐, FOX 3. 그 말은 흘려들을 수 없겠는데."
42200-24 = "설마 내가 좁은 통로를 달려가는 표적도 명중시키지 못할 거라고 생각하는 거야?"
42200-25 = "네 저격 솜씨를 의심하는 건 아니지만, 한 번에 여러 명이 튀어나올 수도 있잖아?"
42200-26 = "네 저격총의 총신이 더블 배럴이었다면 고려해 볼 수도 있었겠지만."
42200-27 = "오, 그거 생각보다 괜찮은 아이디어인데?"
42200-29 = "FOX 4는 FOX 3의 백업을 우선하여 적의 발을 묶는 데 집중하도록."
42200-30 = "상대도 저격이 있는 것을 알고 있는 이상, 저격 대책을 준비해서 돌입을 시도할 것이다."
42200-31 = "……최악의 경우는 기상천외한 방법으로 침로를 우회할지도 모르지."
42200-33 = "특수전의 기본은 쉼 없이 변화하는 전장 환경에서 변인을 통제하고 질적 우세를 유지하는 것."
42200-34 = "지리적 이점이나 장비의 성능만 두고 보더라도 이쪽의 전투력이 상대보다 우세하니, 예상치 못한 변수에만 잘 대처한다면 어렵지 않게 작전을 성공시킬 수 있을 거야."
42200-36 = "……정론이네."
42200-37 = "뭐. 유키노…… 아니, FOX 1은 언제나 정론만을 말해왔으니까."
42200-38 = "그러니까 믿고 명령을 따를 수 있는 게 아니겠어?"
42200-40 = "이해했으면 사담은 이것으로 마치지. [ruby=작전개시시간]H-Hour[/ruby]까지 시간도 얼마 남지 않았으니까."
42200-46 = "여기는 FOX 2. 방금 오퍼레이션 룸으로 향하는 중앙 엘리베이터의 원격 제어 모드를 오프라인 상태로 전환했어."
42200-47 = "이렇게 해두면 모에 쨩이 무슨 수를 쓰더라도 해킹으로 엘리베이터를 조작하는 건 불가능하겠지."
42200-48 = "……그래도 역시 이건 조금 과했으려나? 아무리 후배들이 유능하다고는 하지만 이 지점까지 돌파당할 것 같지는 않은데."
42200-49 = "준비에 과함은 없어. 특수부대원이라면 언제나 최악의 수를 가정하고 움직여야지."
42200-50 = "………."
42200-51 = "유키노 쨩……"
42200-52 = "아니, FOX 1은 우리가 RABBIT 소대에게 질지도 모른다고 생각해?"
42200-53 = "……불가능한 일은 아니지."
42200-57 = "혹여라도 만에 하나…… FOX 2까지 패퇴해서 종심을 돌파당했을 때에는."
42200-58 = "모두 지상으로 올라가 다음 명령을 기다리도록 해"
42200-63 = "응? 바로 FOX 1에게 합류해서 응전하는 게 아니었어?"
42200-64 = "전력을 손실한 상태라고는 하지만, 그래도 조금이라도 움직일 수 있다면 후방에서 지원을 하는 편이—"
42200-66 = "아니. 오퍼레이션 룸까지 적의 접근을 허가했다면, 사실상 작전 실패나 다름없으니까."
42200-67 = "빠르게 퇴출이 가능할 수 있도록 지상에 올라가 미리 퇴로를 확보해줘."
42200-69 = "그건 그렇긴 하지만……"
42200-70 = "……소대장이 그렇게 말한다면, 나름의 생각이 있겠지."
42200-72 = "FOX 1, 혹시……"
42200-74 = "……명령이야, 니코."
42200-75 = "이것만큼은 이유를 묻지 말아줘."
42200-81 = "……확인."
42200-84 = "이번 작전의 목표는 본 사일로에 반입된 <A.N.T.I.O.C.H.> 열압력 탄두를 탈취, 혹은 무력화하여 FOX 소대의 기폭 시도를 저지하는 것입니다."
42200-85 = "현재 탄두는 이미 사일로에 장착되어 모든 조작은 시설 하층부에 있는 오퍼레이션 룸에서 진행되고 있습니다."
42200-86 = "때문에 탄두를 무력화하기 위해서는 이 오퍼레이션 룸을 우선 제압해야 합니다만……"
42200-92 = "……생각보다 깊은 곳에 있네."
42200-94 = "네. 이 오퍼레이션 룸은 사일로의 최심부에 자리 잡고 있기 때문에 중앙 엘리베이터까지 먼저 이동해야 합니다."
42200-95 = "게다가 엘리베이터까지 향하는 길은 엄폐물이 없고, 침로가 고정된 개활지이기 때문에 적 저격수의 시야에 그대로 노출됩니다."
42200-96 = "이 사일로는 몸을 숨길 수 있는 저격 포인트가 너무 많아서…… 위치를 확정하는 것도 어렵겠어."
42200-97 = "본래대로라면 적 저격수를 먼저 수색하여 무력화한 뒤에 진입하는 것이 안전하겠습니다만, 탄두의 기폭까지 남은 시간이 얼마 없습니다."
42200-98 = "……따라서 적에게 여유를 주지 않기 위해 전 대원이 일시에 기습을 시도합니다."
42200-99 = "움직일 때는 질풍처럼 날쌔게, 적을 칠 때는 불이 번지듯 맹렬하게. 병법의 기초로군."
42200-100 = "구체적으로 주의해야 할 포인트는?"
42200-104 = "이곳, 포인트 리마에 적 대원이 매복하고 있을 가능성이 높습니다."
42200-105 = "RABBIT 2는 해당 대원을 무력화하여 중앙 엘리베이터의 제어 콘솔을 확보해 주셨으면 합니다."
42200-106 = "그리고 RABBIT 3는 제어 콘솔이 확보되는 대로 해킹을 시도하여 엘리베이터의 통제 권한을 탈취해 주십시오."
42200-108 = "문제없어. 맡겨줘!"
42200-109 = "나, 나는 무얼 하면 될까……?"
42200-111 = "RABBIT 4는……"
42200-112 = "외곽 계단의 저격 포인트에 몸을 은폐하여 상황을 주시하다 적 저격수가 포인트맨을 향해 사격을 시도하면 거리와 방향을 역산하여 역저격을 부탁드리겠습니다."
42200-113 = "저격 원점의 방향과 거리를 역산하는 건 어렵지 않지만……"
42200-114 = "그 저격에 사키가 다치면 어떻게 하지……?"
42200-115 = "괜찮아. 포인트맨이 총알을 두려워해서야 싸울 수 있겠어?"
42200-116 = "이 철모와 방탄복은 그럴 때를 대비해서 언제나 쓰고 다니는 것이니까 너무 걱정하지 마."
42200-117 = "아, 알겠어……!"
42200-119 = "작전은 이해했는데…… 만에 하나 실패를 대비한 플랜 B는 없는 거야?"
42200-120 = "사키가 제압당하거나, 내가 해킹에 실패하거나, 미유가 역저격에 실패한다면. 작전이 순식간에 꼬여버릴 텐데……"
42200-125 = "대안은…… 없습니다."
42200-126 = "응? 대안이 없다니, 그게 무슨 소리야?"
42200-127 = "여러분은 제가 지휘하는[ruby=RABBIT 소대] 최강의 소대. [/ruby]"
42200-128 = "그 누구보다 신속하고, 강하고, 은밀한 특수 부대이기 때문에 특수전에서 지는 경우의 수는 상상도 할 수 없습니다."
42200-130 = "따라서 모두가 서로를 믿고, 모두가 성공한다는 전제로 작전을 진행해 주셨으면 합니다."
42200-131 = "……저도 여러분을 믿고 있으니까요."
42200-133 = "……네가 그동안 말한 작전 중에 제일 바보 같은 작전이네."
42200-134 = "그, 그렇게 궤변 같아 보였나요……?"
42200-135 = "뭐, 하지만 우리 소대장님의 명령이잖아?"
42200-139 = "RABBIT 2, 명령 이행하겠습니다."
42200-140 = "……모에, 미유. 후방 지원을 부탁한다."
42200-143 = "맡겨줘!"
42200-148 = "그럼…… 돌입, 개시!"
