[translation]
11434020-1 = "히든 엔딩;\"기뻐요! 기쁘지만…….\""
11434020-12 = "……이쪽으로!"
11434020-13 = "하아……. 하아, 하아……! 하아……!"
11434020-14 = "헉, 허억……. 허억……. 이, 이런 건……. 이런 건……."
11434020-15 = "말할 여유가 있으면 뛰라고!! 헉, 헉……!!"
11434020-21 = "하아, 하아……. 이쯤이면 됐나."
11434020-22 = "……모두 무사해? 낙오된 사람 없지?"
11434020-26 = "대체 이게 무슨 일이야. 자, 잘 된 건 좋지만……. 이건 좀……."
11434020-27 = "기, 기쁘긴 하지만……. 그렇지만……."
11434020-28 = "이건……. 록……을 넘어섰어……."
11434020-30 = "정말이지……."
11434020-36 = "……헉!!"
11434020-37 = "\"여기 있었군요! 질문 좀 해도 되겠습니까!?\""
11434020-39 = "\"인터뷰좀……!!\""
11434020-40 = "\"밴드명을……! 아니면 소속사 이름이라도!!\""
11434020-41 = "\"이런 실력의 밴드가 지금까지 어디 있었던 건가요!? 모두 궁금해합니다!\""
11434020-43 = "으아아아아아아-!?"
11434020-45 = "이, 이게 무슨……!"
11434020-46 = "뭐냐고, 이 상황은 대체……!"
11434020-47 = "아무래도 오해가 제대로 생긴 거 같은데!? 이 정도를 생각했던 건 아니잖아!?"
11434020-48 = "저, 저기요!? 저희는 진짜 밴드 같은 거 아니거든요!? 칠 줄 아는 곡도 겨우 이거 하나거든요!?"
11434020-49 = "후……. 또 역사를 써 버렸나, 시험장에 춤추듯 내려온 천재들이여……."
11434020-50 = "오해 늘어날 소리 하지 말고!!"
11434020-56 = "(……이후 사정을 설명한 뒤, 정중하게 거절하고 돌아왔다.)"
