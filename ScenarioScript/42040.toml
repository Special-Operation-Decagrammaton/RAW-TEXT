[translation]
42040-1 = "제4화;예상치 못한 재회"
42040-3 = "……여기는 RABBIT 1. 현재 시각은 1625시."
42040-4 = "RABBIT3로부터 전달받은 GPS 신호를 추적하여 포인트 시에라에 침입했던 용의자의 위치를 특정. 타깃 에어리어에 도착했습니다."
42040-5 = "강하 포인트인 포인트 로미오에는 현재 비가 내리고 있으며, 시계는 500m 내외로 제한되고 있습니다. 모두 작전 시 유념 부탁드립니다."
42040-6 = "여, 여기는 RABBIT 4…… 날씨 때문인지 다행히 주변을 지나가는 사람은 없는 것 같아……"
42040-7 = "그 외에 매복 중인 전투원은 없는 것을 확인했고…… 이 위치에서라면 어느 방향이든 저격 지원이 가능해."
42040-8 = "확인. RABBIT 2, 이어서 보고 부탁드립니다."
42040-9 = "여기는 RABBIT 2. 건물 외부의 폐쇄회로에 사보타주를 실행. 이것으로 당분간 경보 센서는 울리지 않을 거야."
42040-10 = "다만……"
42040-11 = "뭔가 문제라도 있나요, RABBIT 2."
42040-12 = "아니, 문제는 아니지만…… 이 건물, 어쩐지 낯이 익어서."
42040-14 = "응? 이 근처에 작전을 나왔던 기록은 없는데. 다른 곳이랑 착각한 거 아냐?"
42040-15 = "물론 그건 나도 알고 있어. 내 말은…… 이 건물의 구조가 익숙하다는 뜻이었어."
42040-16 = "그, 여기…… SRT 훈련 시설의 실내전 훈련장이랑 구조가 비슷하지 않아? 세 곳의 진입로와 3층으로 구성된 미로 같은 실내 배치……"
42040-17 = "듣고 보니 그렇네. 훈련이었다면 이 시점에서 교전이 시작되었겠지. 쿠히히……"
42040-19 = "하지만 별다른 반응도 없고…… 오히려 여러 번 훈련해 본 상황이라 더 안심되는 느낌이야."
42040-20 = "그렇네요. 익숙한 장소인 만큼 돌발 상황을 예측하기 쉬워 오히려 다행입니다."
42040-21 = "하지만 보통 이런 구조의 건물은 방어하기에 훨씬 유리해서. 학원 내 모의전을 벌였을 때도 방어 측의 승률이 늘 높았던지라, 조금 불안하네……"
42040-22 = "뭘 그렇게 겁내는 거야, 사키. 우리는 SRT잖아?"
42040-23 = "설령 적이 처음 보는 무기를 들고 와도 화력으로 밀어붙이면 그만이지. 후후……"
42040-24 = "그, 그렇지? PMC의 엘리트들도 우리 앞에서는 상대가 되지 않았으니까……"
42040-25 = "후방 지원은…… 내게 맡겨줘."
42040-26 = "그럼, 바로 돌입을 시작하겠습니다. RABBIT 2. 위치로."
42040-31 = "브리칭."
42040-36 = "진입로 확보!"
42040-37 = "RABBIT 1, 건물 내로 진입합니다!"
42040-41 = "……A 사이트 클리어."
42040-42 = "B 사이트 클리어!"
42040-43 = "이어서 C 사이트로 속행!"
42040-47 = "(……이상하네요. 이렇게나 깊숙이 침입했는데도 응전하러 나오지 않다니. 저희를 경계하고 있는 걸까요?)"
42040-48 = "(눈에 띄는 움직임이나 트랩은 없는 것 같지만, 무언가 놓치고 있는 기분이……)"
42040-49 = "여기는 RABBIT 2. RABBIT 1, 이 앞에 바리케이드가 설치되어서 진입할 수 없는데, 어떻게 하지? 그대로 돌파할까?"
42040-53 = "아니요. 큰 소리를 내면 적이 이쪽의 위치를 알아차릴 위험이 있습니다. 우회합니다."
42040-54 = "개방된 중앙 통로 방향 말이지…… 알았어."
42040-55 = "이어서 작전을 속행—"
42040-59 = "윽……!"
42040-63 = "방금 그 총소리는……?"
42040-64 = "RABBIT 2, 보고하세요. RABBIT 2!"
42040-65 = "신호가 끊어졌나……? 연락이 안 돼……"
42040-66 = "RABBIT 4, 관측 정보를 요청합니다. RABBIT 3, GPS 정보를 확인해 주세요!"
42040-70 = "……통신 재머, 인가요."
42040-71 = "(정황상 RABBIT 2는 물론이고 다른 소대원들에게도 지원을 요청할 수 없을 것 같군요.)"
42040-72 = "(선두를 기습하는 것과 동시에 재머를 발동시켜 통신을 끊고 각 부대원들을 고립시킨다……)"
42040-73 = "(간단해 보이지만 무선 침묵 상황에서 상대를 동시에 제압하는 것은 고도의 팀워크를 필요로 하는 일…… 평범한 용병이나 학생들이 할 수 있는 수준의 대응이 아닙니다.)"
42040-74 = "(우선은 RABBIT 2의 구조를 위해 이동을……)"
42040-83 = "(기습? 어느새 이 거리까지……?)"
42040-85 = "………."
42040-97 = "(큿…… 좁은 통로라 주무장이 걸리적거려……)"
42040-98 = "(근접 전투 상황은 익숙지 않지만 어쩔 수 없군요……)"
42040-102 = "(우선 상대의 무게중심을 당겨 균형을 무너트리면—)"
42040-103 = "……폭스트롯."
42040-104 = "(이 거리에서…… 설마 섬광탄을—)"
42040-113 = "……1.5초. 폭음과 섬광으로 인한 전투 스트레스 탓이라 하지만 반응 속도가 늦군."
42040-114 = "CQB 교범에 따라 사거리 안쪽으로 파고든 건 나쁘지 않은 판단이지만, 그 상황에서는 정석대로 손을 당기는 것보다 머리로 들이박는 편이 더 좋았을 거다."
42040-115 = "으읏……!"
42040-116 = "억지로 손을 빼려 하지 마. 자칫하면 팔이 부러질 수도 있으니까."
42040-117 = "당신은 누구죠……? 평범한 용병이나 브로커처럼 보이지는 않는데……"
42040-118 = "……상대가 누구인지가 중요한가? 작전에 임했으면 언제나 최악의 수를 가정했어야지."
42040-119 = "제아무리 우수한 장비로 무장한 베테랑이라 하더라도 전장에서는 눈먼 탄환 한 발에 제압될 수 있는 법."
42040-120 = "우수한 특수부대는 용맹한 전사보다는 겁 많은 겁쟁이처럼 행동해야 하는 법이야."
42040-121 = "이 목소리는……"
42040-122 = "오랜만이군. 츠키유키 소대장."
42040-127 = "……이렇게 다시 보게 되어서 다행이야."
42040-128 = "유키노 선배님……?!"
42040-130 = "다음화;선배의 그림자"
