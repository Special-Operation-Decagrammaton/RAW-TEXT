[translation]
221100-1 = "제10화;선상의 추격전"
221100-2 = "(그로부터 며칠 뒤.)"
221100-3 = "(형식적인 행정 절차를 밟고, 몇 가지의 서류를 주고받은 뒤……)"
221100-4 = "(새미를 오디세이아 학원에서 육지로 내리기 위한 모든 준비가 완료되었다.)"
221100-9 = "올림포스 호, 아일랜드 사관실"
221100-11 = "어서 오시지요, 선생님. #n……그리고 총학생회장님."
221100-12 = "아일랜드에 다시 오신 걸 환영합니다."
221100-13 = "[s1] \"오랜만이야, 두 사람 모두.\"\n[s2] \"그동안 별 일 없었어?\""
221100-16 = "네. 배려해주신 덕분에."
221100-17 = "물론 새미의 처우를 두고 약간의 소란이 있었습니다만, <트라이던트>에서 조속히 대응해 준 덕분에 큰 문제로 불거지지는 않았습니다."
221100-18 = "[s] \"약간의 소란이라고?\""
221100-19 = "네. 새미와의 작별이 아쉽다며, 일부 학생들이 작은 소란을 일으켰거든요."
221100-20 = "새미가 아프다는 말에 수상한 민간요법을 시도하려는 학생이 있지 않나, 새미와 헤어지기 전에 새미의 털 공이 갖고 싶다며 아일랜드에 무단 침입을 시도하지를 않나……"
221100-21 = "새미가 아무리 털이 많이 빠진다 해도, 메리노 양도 아닌데 원할 때마다 털 공을 뽑아낼 수 있는 것도 아닌데 말이죠."
221100-22 = "그래도 걱정과는 달리, 총학생회에서 내린 결정이라 하니 모두 순순히 잘 따라주었답니다."
221100-23 = "역시 처음부터 총학생회장님께 의견을 구할 걸 그랬네요."
221100-28 = "천만에요."
221100-29 = "특별한 수고를 한 것도 아니고, 그저 이름을 빌려드린 것뿐인 걸요?"
221100-30 = "하지만 그 덕분에 답이 나오지 않는 문제를 두고 싸울 필요도 없어졌고, 저도 새미에 관한 마음을 어느정도 정리할 수 있었는 걸요."
221100-31 = "역시 불합리를 설득할 수 있는 수단은 금기와 관습뿐인 것 같네요."
221100-32 = "……."
221100-37 = "[ns] \"그래서 새미는 지금 어디에……?\""
221100-38 = "이 시간의 새미는 늘 같은 장소에 머무르고 있습니다."
221100-39 = "아침밥을 먹은 이후에는 언제나 사관실 탁자 아래의 낡은 방석에 누워 낮잠을 자거든요."
221100-45 = "분명 지금도 이 자리에서……"
221100-49 = "……새미?!"
221100-50 = "새, 새미가 어디로 간 거지?"
221100-51 = "자, 잘 모르겠습니다…… 그동안 하루도 빠짐 없이 이 방석 위에 있었기에 의심조차 하지 않았는데……"
221100-52 = "누구, 혹시 새미를 본 사람 없나요?"
221100-53 = "저…… 사실 아까 새미가 아침을 먹은 뒤에 갑판 위로 나가는 걸 보긴 했습니다만……"
221100-54 = "죄송합니다. 그냥 아침 산책을 간다고만 생각해서 붙잡지 않았어요……"
221100-55 = "그것 참 이상하네요."
221100-56 = "그동안 새미는 단 하루도 낮잠 자는 일을 빠트린 적이 없었는데, 오늘은 갑자기 무슨 바람이 불어서 산책을 나간 건지—"
221100-57 = "설마, 우리가 배에서 내리게 하려는 걸 알아차린 건가……?"
221100-58 = "[s] \"혹시 새미는 사람의 말도 알아들어?\""
221100-59 = "아뇨. 하지만 나이가 제법 있어서 그런지, 눈치는 꽤 빠르니까요."
221100-60 = "전에도 목욕을 시키거나, 예방 접종을 하려고 하면 귀신 같이 눈치를 채고 몸을 숨겼거든요."
221100-61 = "오디세이아 학원의 특성 상, 고양이가 숨어들만한 좁은 통로가 많기 때문에 예전에는 1주일 넘게 모습을 감춘 적도 있었는데……"
221100-63 = "예전이라면 몰라도, 몸이 노쇠해진 지금은 건강에 문제가 생길지도 몰라요."
221100-64 = "아무래도 이러고 있을 때가 아니군요."
221100-65 = "다 같이 나가서 새미가 어디로 갔는지 찾아보도록 하죠."
221100-71 = "……새미!"
221100-72 = "새미, 어디에 간 거야?"
221100-73 = "이번에야 말로 잡히기만 하면—"
221100-78 = "야옹."
221100-79 = "[ns] \"저기, 난간 밧줄 위에 앉아 있어!\""
221100-81 = "다들 기다려 주세요. 제가 유인해 볼게요."
221100-82 = "새미~ 너 이 간식 좋아하지?"
221100-83 = "이리로 오면 먹게 해 줄 테니까, 그런 위험한 곳에 있지 말고 내려와—"
221100-87 = "냥."
221100-88 = "크읏."
221100-89 = "[ns] \"난간을 타고…… 다른 배로 넘어갔어?\""
221100-90 = "보기보다 꽤 날렵하네요. 바다에 빠질지도 모르는데 무서워하는 것처럼 보이지도 않고."
221100-91 = "새미에게 이 학원의 복잡한 선수 구조물은 전용 캣타워나 다름없으니까요."
221100-92 = "오래전부터 배를 오가며 학원을 누비고 다녔으니…… 어쩌면 학원의 지리를 제일 잘 이해하고 있는 건 새미일지도 모르겠네요."
221100-93 = "이, 일단은 놓치지 않게 계속 쫓아가시죠!"
221100-95 = "(……이후로도 새미를 쫓는 선상의 추격전은 계속되었다.)"
221100-96 = "(하지만 새미가 사람이 접근하기 어려운 난간이나, 좁은 통로로 계속 도망치는 바람에 좀처럼 따라잡을 수가 없었고……)"
221100-98 = "이얍!"
221100-99 = "어머나."
221100-100 = "[s] \"잡았……나?\""
221100-101 = "놓쳤습니다!"
221100-102 = "야옹."
221100-104 = "(……심지어 예상치 못한 방해를 받기도 했다.)"
221100-107 = "헉, 헉…… #n혹시, 새미 이쪽으로 왔나요?"
221100-108 = "새, 새미라면…… 그 고양이 말씀이신가요?"
221100-109 = "죄송하지만 오늘은 한 번도 못 봤는데요……"
221100-110 = "이상하네. 분명 방금 전에 이쪽 잔교 위로 도망치는 걸 똑똑히 보았는데."
221100-115 = "냥."
221100-116 = "새, 새미! 조용히 숨어 있어 있으라고 했잖아!"
221100-117 = "당신, 설마 새미를 숨겨주고 있었던 건가요?!"
221100-118 = "죄, 죄송해요! 하지만 새미가 내리기 전에 한 번이라도 더 보고 싶어서……"
221100-120 = "야옹~"
221100-121 = "거, 거기 서!"
221100-126 = "저, 저기……"
221100-127 = "어라, 함장님과 부장님…… 거기에 샬레의 선생님까지?"
221100-128 = "그렇게 급히 무슨 일이신가요?"
221100-129 = "새미, 분명히 이 쪽으로 왔죠?"
221100-130 = "………"
221100-131 = "아뇨. 고양이는 이쪽 방향으로 오지 않았습니다."
221100-132 = "……정말요?"
221100-137 = "에이. 아무리 그래도 선내 군기를 유지해야 하는 트라이던트 부원들이 거짓말을 할리가……"
221100-138 = "냐아~"
221100-143 = "……이런, 들통났네요."
221100-144 = "믿었던 트라이던트 부원들까지!"
221100-145 = "[s] \"미안, 먼저 좀 지나갈게!\""
221100-148 = "(……일부 오디세이아 학생들이 새미를 숨겨주거나, 경로를 방해하는 바람에 추격전은 예상했던 것보다 훨씬 길어지고 말았다.)"
221100-150 = "헉, 헉……"
221100-151 = "왜, 다들…… 새미를 숨겨주려고 하는 거죠? #n분명 어제까지는 아무런 불만도 없었잖아요!"
221100-152 = "말하지 않는다고 해서 불만이 없었던 건 아니겠지만……"
221100-153 = "그래도 트라이던트의 학생들까지 가세해서 새미를 숨겨줄 줄은 생각지도 못했어."
221100-157 = "……어째서 다들, 평소 같지 않은 모습을."
221100-158 = "그야, 평소와는 다른 상황이니까요."
221100-162 = "그나저나 새미는 놀이로 착각을 했는지, 아주 신이 난 것처럼 보이네요."
221100-163 = "그릉, 그르릉……"
221100-168 = "정말 이럴 때는 얄미워 죽겠다니까……"
221100-169 = "아무래도 이대로 쫓기만 하다가는 끝이 없을 것 같으니, 양동 작전을 쓰도록 하죠."
221100-170 = "아미 부장, 그리고 선생님. 저기 좌현 방향에서 새미를 유인해 주시겠습니까?"
221100-171 = "저는 우현으로 돌아가서 기다리고 있다가, 막다른 선수 쪽에 몰렸을 때 새미를 덮치겠습니다."
221100-172 = "자칫 바다에 빠지기라도 하면 큰일이지만…… 그 방법 밖에는 없을 것 같네요."
221100-173 = "그럼 부탁드리겠습니다. [USERNAME] 선생님, 이쪽으로."
221100-174 = "[s] \"음, 맡겨만 줘!\""
221100-178 = "새미…… 거기 서!"
221100-179 = "[ns] \"어흥! 이 쪽이다!\""
221100-180 = "……!"
221100-181 = "새미가 막다른 선수에……"
221100-182 = "함장님, 지금입니다!"
221100-186 = "잡았—"
221100-187 = "우냥!"
221100-188 = "어, 어라?!"
221100-194 = "[ns] \"……미나토!\""
221100-195 = "하, 함장님! 괜찮으신가요?!"
221100-196 = "어푸…… 나, 나는…… 괜찮아."
221100-197 = "내가 수영을 못하는 것도 아니고, 어차피 그리 깊은 물도 아니잖아?"
221100-198 = "하지만……"
221100-199 = "부장, 벌써 오디세이아의 금기를 잊어버린 거야? 물 위에서 수직으로 헤엄치는 익수자에게는 가까이 오면 안 된다고 누차 말했는데."
221100-200 = "일단은…… 뭔가 잡고 올라갈 수 있게 사다리나 내려줘."
221100-201 = "네…… 네! 잠시만 기다려 주세요. 금방 사다리를 내릴게요!"
221100-207 = "냐아—"
221100-208 = "응……?"
221100-210 = "잠깐, 새미! 위험하잖아. 빨리 갑판 위로 올라가!"
221100-211 = "끄응…… 끙."
221100-212 = "뭐야. 물에 빠진 내가 걱정되어서 다가온 거야?"
221100-213 = "수영도 못하는 고양이 주제에…… 누굴 걱정하는 거야."
221100-214 = "냐아아아—"
221100-215 = "……오전 내내 골탕을 먹인 주제에, 대답은 잘하네."
221100-216 = "뭔가 우습네. 수영을 할 줄 아는 사람은 바다를 두려워하는데, 정작 수영을 할 줄 모르는 고양이는 바다를 두려워하지 않는다니."
221100-217 = "모르니까 용감하다는 게 이럴 때 쓰는 표현이려나?"
221100-218 = "……아니, 너도 물은 두렵겠지. 목욕물만 봐도 진저리를 쳤으면서."
221100-219 = "하지만, 그 이상으로 나를 소중히 여겼던 거구나."
221100-221 = "고마워, 새미."
221100-222 = "그리고 미안해……"
221100-223 = "함장, 구명 사다리 내렸습니다. 이쪽으로 오세요!"
221100-224 = "자, 새미. 돌아갈 시간이야."
221100-225 = "냐아—"
221100-230 = "다음화;변심"
