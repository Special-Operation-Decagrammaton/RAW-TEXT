[translation]
1010905-1 = "무미"
1010905-2 = "샬레 휴게실"
1010905-4 = "(다음 날, 휴게실의 침대에 누워 밀린 잠을 청하고 있노라니……)"
1010905-11 = "실례하겠습니다~"
1010905-12 = "안녕하세요, 선생님. 어제 말씀드린 것처럼 문안 차 방문했습니다."
1010905-13 = "몸 상태는 좀 어떠신가요?"
1010905-14 = "[s1] \"……노아 왔구나.\"\n[s2] \"일어나서 맞아주지 못해서 미안하네.\""
1010905-17 = "아녜요. 몸이 안 좋으셔서 그런 것이니 신경 쓰지 마세요."
1010905-21 = "탁자 위에 있는 음료수와 빈 도시락 곽은 제가 치워도 괜찮을까요?"
1010905-22 = "아, 쓰레기통도 가득 찬 것 같으니 정리하면서 이쪽도 함께 비우고 돌아오겠습니다."
1010905-26 = "책 밑에 깔려 있는 이 서류는…… 집무실의 이번 달 공과금 내역서네요."
1010905-27 = "제출 기한이 얼마 남지 않은 것 같으니 이것도 제가 처리해 두겠습니다."
1010905-28 = "[s] \"그렇게 모두 처리해 주지 않아도 괜찮은데……\""
1010905-29 = "아녜요. 그렇게 손이 많이 가는 일도 아닌걸요."
1010905-30 = "잡무는 신경 쓰지 마시고 오늘은 푹 쉬세요."
1010905-31 = "어차피 당번 업무의 연장이라고 생각하면, 당연히 제가 처리할 업무고—"
1010905-32 = "[s3] \"하지만 오늘은 노아의 당번 일이 아니잖아……?\"\n[s4] \"최소한 차림만이라도 편하게 하고 진행하도록 해.\""
1010905-35 = "편한 차림이라……"
1010905-40 = "그럼 잠깐 탈의실을 빌려도 괜찮을까요?"
1010905-41 = "[s] \"응. 편하게 쓰도록 해.\""
1010905-42 = "후후, 그럼 실례하겠습니다."
1010905-47 = "(잠시 후……)"
1010905-50 = "다녀왔습니다."
1010905-51 = "[s] \"노아, 그 차림은……?\""
1010905-52 = "네? 뭔가 이상한가요?"
1010905-53 = "선생님께서 편한 차림으로 있으라 하셔서 잠옷으로 갈아입고 온 것뿐인걸요?"
1010905-54 = "[s] \"하지만 다른 학생이 보면 오해할지도 모르고……\""
1010905-55 = "하지만 분명 오늘 일정상 샬레에 방문할 학생은 없었던 걸로 아는걸요."
1010905-56 = "게다가 편한 복장으로 갈아입으라고 권하신 건 선생님이시잖아요?"
1010905-57 = "혹시 뭔가 제가 입었으면 하는 다른 복장이라도 있으신 걸까요?"
1010905-61 = "[ns] \"……잘 부탁드립니다.\""
1010905-62 = "네. 그럼 정리가 끝날 때까지 편하게 누워 계셔 주세요."
1010905-67 = "이만하면 정리는 끝난 것 같고……"
1010905-68 = "그러고보니 선생님, 점심 식사는 하셨나요?"
1010905-69 = "[s] \"입맛이 없어서 아직……\""
1010905-70 = "안 돼요. 입맛이 없으시더라도 식사는 꾸준히 하셔야 병도 빨리 낫는다고요."
1010905-71 = "……그러고 보니 지난번에 제 병문안을 오셨을 때 계란죽을 끓여주셨었죠?"
1010905-72 = "괜찮으시다면 이번에는 제가 뭔가 드실만한 음식을 만들어 드릴까요?"
1010905-73 = "[s] \"노아가 만들어 준 음식이라…… 기대되는걸.\""
1010905-74 = "그렇게 대단한 건 만들지 못하지만요."
1010905-75 = "그럼 잠시만 기다려주세요."
1010905-84 = "오래 기다리셨습니다."
1010905-85 = "냉장고에 새우와 오크라가 있기에 국으로 새우 맑은국을 끓이고 계란찜도 같이 만들었어요."
1010905-86 = "평소에 제가 먹는 대로 만들어서…… 입에 맞으실지 모르겠네요."
1010905-87 = "[s5] \"노아가 만들어 준 거라면 뭐든지 맛있을 거야!\"\n[s6] \"잘 먹을게, 노아.\""
1010905-90 = "네, 식기 전에 천천히 드셔주시길."
1010905-95 = "저…… 혹시 입에 맞지 않으신가요?"
1010905-96 = "[s] \"아니야. 정말 맛있는걸!\""
1010905-97 = "하지만 첫술을 뜨시고 뭔가 의아한 표정을 지으셔서."
1010905-98 = "[s7] \"그게, 평소에는 간이 센 음식을 주로 먹었으니까.\"\n[s8] \"간이 약한 환자식이었다는 걸 잠깐 잊고 있어서 그랬어.\""
1010905-101 = "아……"
1010905-102 = "죄송해요. 사실 일부러 간을 약하게 한 건 아니에요."
1010905-103 = "제가 선생님께 드릴 음식이라는 걸 간과하고 평소에 먹던 대로 만들어 버려서 간이 약해진 모양이에요."
1010905-104 = "혼자 먹을 때는 음식에 조미료나 간을 거의 하지 않다 보니, 무심코 습관이 되어 버려서."
1010905-105 = "[s] \"노아는 음식에 간을 하는 것을 싫어해?\""
1010905-106 = "네, 아무래도 간을 하면 식재료 본연의 맛이 다소 감춰지니까요."
1010905-107 = "주변의 색을 침범하지 않는 몰개성한 취향을 갖고 있는 것이 타인의 삶을 기록하는 제 사명에는 도움이 될거라 생각해서, 고치지 않고 여태까지 유지해 왔었는데……"
1010905-108 = "결국 이 성격 때문에 선생님께 만족스러운 한 끼를 대접하지도 못했네요."
1010905-112 = "[ns] 노아가 만들어 준 음식을 단숨에 비운다."
1010905-115 = "서, 선생님? 뜨거우니 천천히 드시는 게—"
1010905-116 = "[s] \"미안. 너무 맛있어서 허겁지겁 먹고 말았어.\""
1010905-118 = "[ns] \"그리고 노아에게 부탁하고 싶은 게 하나 더 있어.\""
1010905-119 = "제게 부탁이요?"
1010905-120 = "[s] \"응. 이건 노아에게만 부탁할 수 있는 일이거든!\""
1010905-121 = "저만 할 수 있는 일……?"
1010905-132 = "[wa:2170]― [log=노아 파자마]<총총한 별들이 마치 헤아릴 수 없는 거대한 양 떼처럼 고분고분하고 조용히 흘러가고 있었습니다……>[wa:4840] [/log]"
1010905-135 = "[wa:860]― [log=노아 파자마]선생님도 [wa:1050]참 엉뚱한 분이시네요.[/log]"
1010905-137 = "[wa:840]― [log=노아 파자마]아무런 개성도 없는 제 [wa:800]낭독을 [wa:1080]들으며 [wa:410]잠들고 싶어 하시다니.[/log]"
1010905-140 = "[ns] \"하지만 노아의 낭독으로 듣는 이야기가 가장 몰입이 잘 되는걸.\""
1010905-142 = "[wa:1000]― [log=노아 파자마]……[wa:830]어째서일까요.[wa:1400] [/log]"
1010905-144 = "[wa:1150]― [log=노아 파자마]무색, 무취의 목소리인 덕분에, [wa:2340]의미가 선명히 [wa:880]전달되는 걸까요……?[/log]"
1010905-147 = "[wa:3280]― [log=노아 파자마]감사합니다, [wa:1410]선생님.[/log]"
1010905-149 = "[wa:1160]― [log=노아 파자마]선생님 덕분에 [wa:1200]저를 더 오롯이 마주할 수 있게 되었어요.[/log]"
1010905-152 = "[wa:1000]― [log=노아 파자마]……[wa:920]선생님? [wa:1560]주무시나요?[wa:240] [/log]"
1010905-155 = "[wa:2000]― [log=노아 파자마]저 숱한 별들 중 [wa:1340]가장 가냘프고 [wa:880]빛나는 별님 하나가.[wa:40] [/log]"
1010905-157 = "[wa:1300]― [log=노아 파자마]그만 길을 잃고 [wa:2260]제 발치에 [wa:2040]고이 잠들었습니다.[/log]"
1010905-160 = "(무색, 무취에 가까운 노아의 사근한 목소리는, 부담스럽지 않게 아픈 몸에 시나브로 스며들었다.)"
1010905-161 = "(……덕분에 간만에 깊은 잠을 청할 수 있었다.)"
