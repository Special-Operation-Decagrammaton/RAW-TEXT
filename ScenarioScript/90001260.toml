[translation]
90001260-1 = "제26화;감추어져 있었던 것"
90001260-2 = "[ns] \"여기가…… 마지막 방인 것 같은데?\""
90001260-3 = "그, 그런데…… 상태가 어딘가 조금, 심상치 않은 것 같기도……."
90001260-4 = "여기…… 물이 고여 있네? 이끼뿐만 아니라, 덩굴 식물까지 들어와 있고."
90001260-5 = "이 정도로 망가져 있다니, 웬만한 종자 보관소라면 오래전에 폐기되어야 했을 수준이야."
90001260-6 = "보세요, 리오 선배! 히마리 선배! 벽 전체가 서랍입니다!"
90001260-8 = "그러네요. 잠시 볼까요? 어디……."
90001260-11 = "이건 조금 놀랍네요. 씨앗들의 보관 상태가 매우 양호해요."
90001260-12 = "리오 회장은 상태가 안 좋다고 했지만, 분위기만 보면 오히려 진짜 씨앗 보관소라는 느낌인데? 여기저기가 녹색이고."
90001260-13 = "그러게요. 오래전 작품에서 나온…… 사슴처럼 생긴 숲의 신이 산다는, 가장 깊은 곳의 은신처 같아요."
90001260-14 = "결과적으로 이 시설은, 3중 밀폐 구조로 되어 있었던 셈이군요."
90001260-16 = "그래. 그중 건물과 보관소 공간까지는 망가졌지만, 마지막 내벽…… 종자 보관 쉘터는 제 기능을 다하고 있는 것 같아."
90001260-17 = "그렇군요. 과연 밀레니엄의 기술력이라는 것일까요."
90001260-18 = "그게 전부는 아닐 거야."
90001260-20 = "그건 무슨 뜻이죠, 리오?"
90001260-21 = "기록상, 예언자로 바뀐 AI들은 기존의 행동 방식과는 다른 양상을 보이곤 했어."
90001260-22 = "가령 호드의 경우, 원래는 밀레니엄의 통신망 가설 유닛 AI였지만, 지금은 완전히 아니지."
90001260-23 = "그렇네요. 호크마만 해도 배였지만, 지금은 더 이상 그것을 배라고 부르기 힘들 지경이죠."
90001260-24 = "하지만 이 시드 볼트의 인공지능, 지금은 아마도 티페레트라고 불릴 그것은."
90001260-25 = "예언자로 바뀌었음에도, 계속해서 종자를 보관하려는……. 일종의, 의지를 보이고 있는 것 같아."
90001260-26 = "그렇지 않다면, 이렇게 보관 상태가 양호할 리 없으니까요?"
90001260-27 = "그래. 그런 가정하에서, 한 가지 의문이 다시 생기는데―"
90001260-28 = "―종자를 계속해서 보관하고자 한 것은, 그 세 명의 아이들일까. 아니면 티페레트일까?"
90001260-29 = "만일 티페레트라고 한다면, 거기에 대해 어떤 판단을 내릴 생각이죠?"
90001260-30 = "그런 것이라면…… 나는 예언자들에게도, 나름의 자의식 같은 것이 있다는 가설을 내세우겠어."
90001260-31 = "그렇게 추론을 이어 나가면―"
90001260-37 = "––?!"
90001260-38 = "이건……!?"
90001260-46 = "리, 리오 선배?! 히마리 선배!?"
90001260-47 = "그리고 모모이? 미도리? 다른 모두도……? 어, 어떻게 된 건가요??!!"
90001260-48 = "어라, 그러고 보니 무언가…… 이상한 냄새가 납니다…… 우우…… 아리스, 뭔가 기분이 좋지 않습니다……."
90001260-49 = "선생님? 선생님은 괜찮습니까? 선생님?!"
90001260-57 = "(눈앞이 빠르게 어두워졌다…….)"
90001260-58 = "(어지러움도 있었지만, 뭔가, 이대로 푹 잠들고 싶은 기분이었다…….)"
90001260-64 = "정신 차리세요, 선생님!!!"
90001260-65 = "[ns1] \"아로나……? 프라나……?\"\n[ns2] \"아침이 되면 깨워 줘……. 흠냐…….\""
90001260-68 = "아로나 선배, 이건……."
90001260-69 = "괜찮아요, 프라나 쨩! 여기서는 제가 대처할게요!"
90001260-70 = "부탁드리겠습니다. 아로나 선배. 이런 사태는 아직 제가 익숙하지 않아서……."
90001260-71 = "정확히는 모르겠지만, 어떤…… 가스 같아요! 일단 선생님의 몸에 이 이상의 가스는 들어오지 않을 거예요!"
90001260-72 = "분석. 무색. 무취. 신경계에 작용하는, 비교적 약한 정도의 작용제입니다."
90001260-73 = "다른 학생분들도 생명에 지장은 없을 거예요. 최악의 경우라도, 푹 자고 일어나면 괜찮아질 거고요."
90001260-74 = "하지만 장기간 노출에는 주의해 주십시오. 모든 작용제에는 결국 독성이 포함되어 있기 마련입니다."
90001260-75 = "에헤헤. 푹 잔다고 하니까, 저도 자고 싶어졌어요……."
90001260-76 = "아로나 선배. 여기에서 저희까지 그렇게 해 버리면……."
90001260-77 = "노, 농담이에요! 프라나 쨩도 참, 제가 진짜로 그럴 리 없잖아요?"
90001260-78 = "일단 긍정. 이럴 때의 아로나 선배는, 그런대로 믿을 수 있으니까요."
90001260-79 = "아하하. 그런대로, 라니요. 프라나 쨩……."
90001260-80 = "아, 선생님! 케이 씨가 다가오고 있어요!"
90001260-82 = "[ns] \"케이?\""
90001260-83 = "아, 무사하셨군요. 다행입니다."
90001260-84 = "그런데 이상하네요. 저는 그렇다 치고 왜 선생님만 괜찮은 걸까요?"
90001260-85 = "끄앙! 선생님이 무사해서 다행이지만, 다른 동료분들이 걱정입니다……!"
90001260-86 = "으음, 선생님과 다른 사람들의 차이라면……."
90001260-88 = "(어라, 혹시……?)"
90001260-90 = "우애앵……. 스테이터스 저하 이벤트인 겁니다……. 동료분들을 지키지 못해서, 버프를 받지 못하게 되어 버렸습니다……."
90001260-91 = "이대로는 아리스의 힘을 100% 낼 수 없습니다!"
90001260-93 = "[ns] \"다른 모두는…… 잠들어 있는 거야?\""
90001260-94 = "네? 네. 그렇습니다. 바이탈에는 아직까지 큰 이상은 없는 것 같네요."
90001260-95 = "하지만 여기에서 이런 식으로 발이 묶여 있는 것도 바람직한 상황은 아니겠지요. 아무튼, 우리에게는 별로 시간이 없으니까요."
90001260-96 = "요점만 이야기하겠습니다. 선생님. 조금 전, 어떤…… 터치 패널 같은 것을 발견했습니다. 여기, 이 보관소의 가운데입니다."
90001260-98 = "일단 제가 조작하려 해 보았습니다만, 아무 일도 일어나지 않았습니다. 그다음은 아리스에게 부탁했습니다만……."
90001260-99 = "화면이 켜지려다. 말았던 것입니다…… 으으, 이것도 아리스의 레벨이 낮아졌기 때문일까요?"
90001260-101 = "그렇다고 하기에는, 다른 잠든 사람들의 경우에도 마찬가지였습니다만……."
90001260-102 = "분명 다른 분들도 레벨 다운 이벤트가 일어나 버렸기 때문일 겁니다……. 아리스는 알 수 있습니다……."
90001260-103 = "……아리스의 말이 정말 맞는 것인지 비유적인 것인지는 잘 모르겠습니다만, 아무튼 선생님에게 부탁드려야 할 것 같습니다."
90001260-104 = "어째서인지…… 선생님은 저희 중, 가장 괜찮아 보이시니까요."
90001260-105 = "[s3] \"알았어. 그런데…… 하나만 물어볼게.\"\n[s4] \"지금 자고 있는 애들, 하나하나 끌고 와서 손을 대 본 거야?\""
90001260-108 = "그런데요? 뭔가 문제라도 있나요? 이것도 다 과학적 실험 방식이라고요."
90001260-109 = "아, 아리스는 말리고 싶었습니다만……. 끄앙!"
90001260-110 = "나중에 같이 조용히 사과하자고요? 리오라면 오히려 합리적인 행동이었다고 인정해 줄 것 같은데요."
90001260-112 = "[ns] \"듣고 보니까 그건 그렇겠네…….\""
90001260-114 = "(케이의 말대로, 터치 패널에 손을 가져다 대 보았다.)"
90001260-115 = "(그러자……!)"
90001260-122 = "[ns] \"어……?!\""
90001260-123 = "이건 붉은겨울 연방학원의 교표?! 이게 왜 여기에……?"
90001260-127 = "(그 순간, 장엄하면서도 경쾌한 음악이 흘러나왔다.)"
90001260-128 = "(뒤이어 친절하면서도 기계적인 목소리가 들려왔다……!)"
90001260-130 = "[56cd7b][log=모니터]환영합니다. 동지. [wa:500]아니면 동지 아닌 분.[/log]"
90001260-132 = "[56cd7b][log=모니터]붉은겨울의 종자 보관소에 온 것을 환영합니다.[/log]"
90001260-134 = "[ns] \"……이건, 뭐지?\""
90001260-135 = "[56cd7b]환영합니다. 동지. 아니면 동지 아닌 분."
90001260-136 = "[56cd7b]붉은겨울의 종자 보관소에 온 것을 환영합니다."
90001260-137 = "……정신 사납지만, 이곳의 관리 시스템 같은 것인 모양이네요."
90001260-139 = "[56cd7b][log=모니터]이곳은, 결국 찾아온 멸망 이후를 대비해 꾸려 놓은 모든 생명의 요람.[/log]"
90001260-141 = "[56cd7b][log=모니터]찬란히 타올랐던 인류 문명이 남긴, 마지막 잔불입니다.[/log]"
90001260-144 = "[56cd7b][log=모니터]환영 인사로 제가 제일 좋아하는 노래를 기분 전환 겸 들려드리고도 싶지만, [/log]"
90001260-146 = "[56cd7b][log=모니터]하필이면 그걸 제가 그저께 금지곡으로 지정해 버렸으니, 아쉽지만 생략하도록 하죠.[/log]"
90001260-148 = "[ns] \"……완전히 붉은겨울이네, 그거…….\""
90001260-149 = "[56cd7b][log=모니터]이 종자 보관소는 지금의 당신은 물론, '지금'의 우리를 위해 만든 장소이기도 합니다.[/log]"
90001260-152 = "[56cd7b][log=모니터]'이것만 있다면, 세상이 망하더라도 다시 시작할 수 있겠지.' 하고,[/log]"
90001260-154 = "[56cd7b][log=모니터]우리는 모두를 안심시킬 수 있었으니까요.[/log]"
90001260-157 = "[56cd7b][log=모니터]덕분에 아무것도 바꾸지 않을 수 있었고, 무엇에도 겁먹지 않을 수 있었습니다.[/log]"
90001260-159 = "[56cd7b][log=모니터]물론 그렇게 양보하지 않은 우리의 혁명적 발걸음이,[/log]"
90001260-161 = "[56cd7b][log=모니터]그 자체로 멸망을 이끌었을 가능성도 완전히 부정할 수는 없겠습니다만.[/log]"
90001260-164 = "[56cd7b][log=모니터]결과적으로 그 덕에 당신을 만나게 된 셈이니, 인연이란 참으로 재밌는 것이네요.[/log]"
90001260-166 = "아, 아리스. 잘 모르겠습니다……. 이곳의 NPC 같은 분이신 걸까요……?"
90001260-168 = "[56cd7b][log=모니터]이 시설을 만드는 과정 자체가 참으로 지난한 일이었어요.[/log]"
90001260-170 = "[56cd7b][log=모니터]건설 비용을 마련하기 위해서, 푸딩에 조금씩 물을 섞기까지 했는데 말입니다.[/log]"
90001260-173 = "[56cd7b][log=모니터]후임자들은 그런 절박한 일을 하지 않았으면 좋겠군요.[/log]"
90001260-176 = "[56cd7b][log=모니터]어찌 되었든 멸망은 찾아온 것 같으니, 우리들의 수고가 빛을 발한 모양이네요.[/log]"
90001260-178 = "그것참, 멸망을 너무 쉽게 이야기하는 거 아니에요? 불쾌하네요……."
90001260-180 = "[56cd7b][log=모니터]누차 말씀드렸듯이, 이 시설은 최후의 종자 보관소입니다.[/log]"
90001260-183 = "[56cd7b][log=모니터]멸망의 때까지 최후의 희망, 씨앗들을 안전하게 보관하기 위해 시설을 무장시켰고,[/log]"
90001260-185 = "[56cd7b][log=모니터]최신 상태를 유지하기 위해서 시험 가동 역시 생략했습니다. 합리적이네요.[/log]"
90001260-188 = "[56cd7b][log=모니터]다시 말해, 당신이 손댔던 것, 손대고 있는 것, 손댈 것들은[/log]"
90001260-190 = "[56cd7b][log=모니터]우리조차도 만져본 적 없는 것들이라는 겁니다.[/log]"
90001260-192 = "[56cd7b][log=모니터]아시겠지요? 함부로 작동시키지 마세요.[/log]"
90001260-194 = "[ns5] \"새것같이 유지하기 위해서……\"\n[ns6] \"테스트를…… 안 했다고?!\""
90001260-197 = "[56cd7b]다시 말해, 당신이 손댔던 것, 손대고 있는 것, 손댈 것들은"
90001260-198 = "[56cd7b]우리조차도 만져본 적 없는 것들이라는 겁니다."
90001260-199 = "[56cd7b]아시겠지요? 함부로 작동시키지 마세요."
90001260-200 = "도대체 무슨 생각인 거예요, 이거?!"
90001260-202 = "[56cd7b][log=모니터]이곳, 제3 구역 관리 시설까지는 당신의 출입을 허가합니다.[/log]"
90001260-204 = "[56cd7b][log=모니터]하지만, 이다음 제2 종자 보관소는 지도위원회가 지정한 표준 절차 없이는 진입할 수 없습니다.[/log]"
90001260-207 = "[56cd7b][log=모니터]그곳이야말로 전체 종자의 7할 이상을 보관 중인 중요 시설이기 때문이죠.[/log]"
90001260-209 = "[56cd7b][log=모니터]만약 시설에 위해를 가하거나, 억지로 진입을 시도하려 한다면……[/log]"
90001260-211 = "[56cd7b][log=모니터]메인 프레임은 나머지 시설을 포기하더라도 당신을…… 음……[/log]"
90001260-214 = "[56cd7b][log=모니터]지금 몇 달째 커피가 다 떨어져서 머리가 안 돌아가는데,[/log]"
90001260-217 = "[56cd7b][log=모니터]대충 끔찍한 단어를 좀 떠올려 보시겠어요? [/log]"
90001260-219 = "[56cd7b][log=모니터]되도록 본인이 당하기 싫은 것으로 말이죠.[/log]"
90001260-221 = "어, 어어…… 그러니까…… 세이브 데이터 말소?"
90001260-223 = "[56cd7b][log=모니터]네. 우리는 당신을 바로 그렇게 만들 겁니다. [/log]"
90001260-225 = "[56cd7b][log=모니터]어떤 표현이었든, 협조 고마워요.[/log]"
90001260-227 = "[56cd7b][log=모니터]그러니까 가급적 제2 보관소는 건드리지 마세요.[/log]"
90001260-230 = "[56cd7b][log=모니터]하지만 제2 보관소의 내부를 당신께 못 보여드리는 건, 조금 아쉽네요. [/log]"
