90001260-327 = "……폭풍처럼 뭔가가 지나갔네요……."
90001260-328 = "[ns7] \"중간중간 심상찮은 소리가 많이 들리긴 했는데…….\"\n[ns8] \"저 너머에는 들어가지 말라고 했었지?\""
90001260-331 = "네? 네. 여차하면 나머지 시설을 포기하더라도…… 어……"
90001260-332 = "하여튼 상상할 수 있는 가장 끔찍한 일을 당하게 만들어 줄 거라고 했죠."
90001260-333 = "세이브…… 세이브 데이터는 안 됩니다……."
90001260-334 = "(……언제 한번 아리스에게 게임을 조금 줄여야 할 것 같다고 잔소리를 해야겠네요…….)"
90001260-340 = "저, 전원이……?"
90001260-341 = "……또 뭔가요, 대체."
90001260-342 = "와, 완전히 어두워졌습니다! 아무것도 보이지 않습니다……!"
90001260-343 = "제게서 떨어지지 마세요, 아리스!"
90001260-344 = "……? 뭔가, 신호 같은 것이……?"
90001260-345 = "……!"
90001260-349 = "아, 안녕…… 하세요. 여러분, 그리고 선생님…… 또 만나네요. 에헤헤……."
90001260-350 = "정말이지, 질리지도 않고 포기할 줄도 모르네."
90001260-351 = "그러게 말입니다. 그냥 다 놓고 편해지면 서로 좋을 텐데요."
90001260-352 = "[s9] \"그게 바로 직업 윤리라는 거란다.\"\n[s10] \"선생님이 학생을 포기하면 안 되잖니.\""
90001260-356 = "헹. 우리가 학생이면 포기할 거면서."
90001260-357 = "[s11] \"아닌데?\"\n[s12] \"전학 서류는 구비되어 있으니까, 관심 있으면 연락 줘.\""
90001260-363 = "와…… 진짜 그렇게 대답할 줄은 몰랐는데……."
90001260-365 = "이, 이런 걸 보고…… 구제 불능, 이라고 하는 거죠……?"
90001260-366 = "하지만 유감이네요. 우린 그럴 생각 없거든요."
90001260-367 = "전학이고 뭐고, 전부 인간들의 시스템이잖아요? 우리 알 바 아니라고요."
90001260-369 = "[ns13] \"왜 직접 나온 거야?\"\n[ns14] \"조금 반갑기도 해서, 나는 좋지만.\""
90001260-372 = "어디까지 뻔뻔한 거야, 이 선생님……."
90001260-373 = "아무튼, 뭐. 우리는 마지막으로 기회를 주려는 거야. 여기를 넘어가면, 이제 되돌리지 못할 테니까."
90001260-374 = "그래요. 말 그대로 선을 넘는 거죠. 끝까지 가야 하는 거예요"
90001260-376 = "소프의 표현을 빌리자면, 일종의…… 최후통첩 같은 거죠."
90001260-378 = "다음화;생명과 의식"
