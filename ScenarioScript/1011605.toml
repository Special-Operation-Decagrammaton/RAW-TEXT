[translation]
1011605-1 = "은혜 갚기"
1011605-2 = "(사오리를 만나러 식당 거리에 나왔다.)"
1011605-3 = "(그런데…….)"
1011605-8 = "……."
1011605-9 = "[ns] \"저, 저기……. 사오리 씨?\""
1011605-13 = "아, 선생. 기다리고 있었다."
1011605-14 = "그럼 바로 이동하지. 어느 가게가 좋은가?"
1011605-15 = "[ns] \"자, 잠깐만!\""
1011605-17 = "[ns] \"설마 그 차림으로 계속 기다렸던 거야?\""
1011605-18 = "중요한 자리엔 최대한 차려입고 가야 한다 들어서 그랬다만……."
1011605-22 = "오…… 새하얀 드레스? 어디 높은 사람의 자제분인가?"
1011605-23 = "저런 분이 여기는 무슨 일로 오신 걸까?"
1011605-24 = "오오, 아름다워……. 사진 찍어도 되냐고 물어볼까?"
1011605-29 = "……선생. 그러고 보니 사람들이 계속 날 보며 수군거리는 것 같은데, 무슨 문제가 있는 건가?"
1011605-30 = "[ns1] \"이, 일단 다른 장소로 이동하자!\"\n[ns2] \"여기는 보는 눈이 너무 많아!\""
1011605-36 = "응? 잠깐. 선생……?"
1011605-43 = "(결국 우리가 도착한 곳은……)"
1011605-46 = "(열심히 사오리에게 상황을 설명했다.)"
1011605-53 = "……그런가? 아무래도 내가 지나치게 화려한 옷을 입었던 모양이군."
1011605-54 = "그대로 있었다간, 구경거리가 될 뻔했다."
1011605-55 = "선생을 불편하게 하려고 한 것은 아니었다만……."
1011605-56 = "미안하다. 모처럼 답례를 하고 싶었는데."
1011605-57 = "아무래도 망친 것 같다."
1011605-58 = "당장 갈아입고 올 테니 조금만 기다려 주면……."
1011605-62 = "……응? 오히려 지금이 더 좋다고? 무슨 뜻이지?"
1011605-63 = "[s3] \"날 위한 사오리의 마음이 느껴졌으니까!\"\n[s4] \"열심히 꾸민 사오리의 노력을 헛되게 할 순 없으니까!\""
1011605-66 = "큭……!"
1011605-67 = "하, 하지만 이런 모습으로는 선생이 좋아하는 가게에 갈 수가……."
1011605-68 = "……뭐? 선생이 직접 만들어 주겠다고? 어째서?"
1011605-69 = "[s5] \"이대로 있으면 내가 신세를 지는 것 같아서?\"\n[s6] \"사오리도 노력했으니까 보답을 받아야지.\""
1011605-72 = "그, 그렇게 나오겠다는 건가."
1011605-73 = "……알겠다. 선생의 요구에 따르지."
1011605-74 = "선생이 만들어주는 음식에 흥미가 있기도 하고."
1011605-75 = "[ns] \"오늘은 뭔가 기념할 만한 날이 될 것 같네.\""
1011605-77 = "[ns] \"이럴 땐 사진을 찍어야 하는데!\""
1011605-78 = "사진이라……."
1011605-79 = "알겠다."
1011605-80 = "[s] \"응? 허락해 주는 거야? 정말로?\""
1011605-81 = "선생 덕분에 모델 아르바이트도 익숙해졌으니, 이제 사진 정도는 어렵지 않아."
1011605-82 = "……그런 의미에서 선생에게 줄 게 있다."
1011605-83 = "받아라."
1011605-93 = "내 사진이 실린 패션잡지다."
1011605-94 = "어쩌다 보니 표지 모델도 하게 됐군."
1011605-95 = "다음에 기회가 된다면 다시 모델을 해달라는 요청도 받았다."
1011605-96 = "덕분에 보수는 물론, 촬영 때 입었던 드레스도 받을 수 있었지."
1011605-97 = "모두 선생 덕분이다. 그러니 누구보다 먼저 선생에게도 이 잡지를 주고 싶었……"
1011605-98 = "[ns] \"오오, 이것이 바로……!\""
1011605-101 = "자, 잠깐! 선생! 그걸 내가 보는 앞에서 펼쳐보는 건가!"
1011605-102 = "[ns7] \"훌륭하게 자랐구나, 사오리! 이 선생님은 정말 기뻐!\"\n[ns8] \"보기만 해도 가슴이 웅장해진다……!\""
1011605-110 = "아, 알겠으니 잡지랑 나를 비교하면서 보는 건 그만둬!"
1011605-111 = "그건 어느 정도 보정을 거친 거라 지금과는 다르단 말이다!"
1011605-112 = "……응? 시, 실물이랑 별로 차이가 없다고? 저, 정말인가?"
1011605-113 = "[ns] \"오, 방금 표정 정말 좋았어!\""
1011605-115 = "[ns] \"이번에야말로 사진으로 찍어서 간직해 주마……!\""
1011605-116 = "……큭!"
1011605-117 = "조, 좋아. 대신……."
1011605-121 = "절대로 다른 사람에겐 보여주면 안 된다. 알았나?"
1011605-122 = "[ns] \"이얏호!\""
1011605-131 = "(그렇게 사진을 잔뜩 찍은 뒤, 사오리와 함께 요리를 만들어 먹으며 긴 시간을 보냈다.)"
