[translation]
61080-1 = "제8화;아리우스식으로"
61080-7 = "정말이다……."
61080-8 = "진짜 왔네, 스쿼드……."
61080-9 = "무슨 염치로 다시 돌아왔대? 자기들이 여기를 버리고 나갔으면서……."
61080-11 = "여기에 있었을 때도, 특혜란 특혜는 다 받아 놓고서는……."
61080-12 = "지금 생각해 보면 그 특혜라는 것도, 별것 아니었긴 했는데."
61080-13 = "저 어른이, 선생님……? 난 직접 보는 거 처음이야……."
61080-14 = "나는 본 적 있어. 그때는 별로 신경 쓰지 않았지만……."
61080-16 = "……피부가 따끔거리는 느낌이군."
61080-17 = "네, 네에? 괜찮나요? 저, 로션 아직 남아 있으니까……!"
61080-18 = "괜찮아, 히요리. 미사키가 하는 말은 그런 게 아닐 거야. 이건……."
61080-19 = "'적의'의 문제야."
61080-27 = "스쿼드. 그리고 조마에 사오리."
61080-28 = "스바루."
61080-29 = "빠르게 묻죠. 왜 왔습니까."
61080-30 = "일이 있어서."
61080-31 = "수배자가 된 채, 여기저기 숨어 다니고 있다고 들었는데요."
61080-32 = "지금도 같은 처지이기는 해."
61080-33 = "그렇군요. 그 생활에 신물이 나기라도 했나요?"
61080-34 = "……조금, 지쳐 있기는 하지."
61080-38 = "삿 쨩……?"
61080-39 = "미안해, 아츠코. 이 자리에서는 거짓말을 하고 싶지 않아."
61080-40 = "……좋든 싫든, 이 아리우스 분교라는 자리에서는."
61080-44 = "응……. 그렇구나. 알 것 같아."
61080-46 = "그렇습니까. 그래서 그 생활 그만두려고 다시 돌아왔나요?"
61080-47 = "그런데 유감스럽게도, 당신들의 자리는 이미 남아 있지 않은 것 같은데요."
61080-48 = "그런 건 아니다."
61080-49 = "단지, 그렇군."
61080-50 = "……후후."
61080-51 = "뭘 웃고 있는 거죠?"
61080-52 = "아니다. 실례했군."
61080-53 = "하지만 지금부터 할 대답을 새삼스레 생각해 보니, 나도 모르게 웃음이 나와서."
61080-54 = "못 본 사이에, 사람의 신경을 긁는 방법이 능숙해졌네요."
61080-55 = "예전에도 어느 정도 그런 면이 있기는 했지만요."
61080-56 = "내가 그랬나? 그렇다면 미안하군. 지나간 일을 되돌릴 수는 없겠지만……."
61080-61 = "바로 그런 부분입니다!!!"
61080-65 = "쓰읍……. 후우……."
61080-66 = "아무튼, 좋아요. 왜 돌아왔나요, 스쿼드."
61080-67 = "그건 바로……."
61080-68 = "모두 함께, 시험을 보기 위해서다!"
61080-72 = "……네?"
61080-74 = "무, 무슨 소리야, 지금. 시험……? 나 뭐 잘못 들은 거 아니지?"
61080-75 = "일단 나도 같은 말을 들은 것 같으니까, 잘못 들은 건 아닐 것 같아."
61080-76 = "무슨 소리인지 하나도 모르겠어……. 바깥 생활을 너무 오래 했더니, 어딘가 약간…… 이상해진 거 아냐?"
61080-78 = "자, 잠깐만요! 조금…… 이야기를 따라가기 어려운데요. 한 번만 다시 생각을……."
61080-82 = "……."
61080-83 = "다시 생각해도 모르겠는데요!"
61080-85 = "푸흡."
61080-86 = "미, 미사키?"
61080-87 = "미안, 공주. 하지만 리더의 말도 이해가 갈 것 같아서."
61080-88 = "확실히 이건…… 웃음이, 나오네."
61080-89 = "저 스바루 선배가 당황하는 모습까지 포함해서 말이야."
61080-91 = "음. 그런가. 이해하기 어려운 화법이었군."
61080-92 = "두괄식 화법이라고 해서, 결론을 먼저 말하고 들어가면 이야기의 흐름을 빠르게 할 수 있다고 배웠는데……."
61080-93 = "아니, 아니다. 이것도 때와 상황, 그리고 문맥에 따른 것이겠지."
61080-94 = "알았으면 제대로 정보부터 알려달라고요!"
61080-95 = "음."
61080-96 = "그러니까."
61080-97 = "……."
61080-99 = "모두 함께, 시험을 보자는 거다."
61080-100 = "바보입니까?!"
61080-101 = "그, 그렇지만 그것 말고는 특별히 말할 게 없다."
61080-102 = "여기, 이렇게 시험지도 가져왔고 말이지."
61080-108 = "그러니까 그런 걸 왜 우리 아리우스 학생들이 봐야 하는 거냐고요!"
61080-109 = "으음……."
61080-110 = "학생이니까?"
61080-111 = "진짜 끝까지 사람을 화나게 하네요, 조마에 사오리……!"
61080-115 = "선배가 저러는 거 오랜만에 보네……."
61080-116 = "예전부터 그랬잖아, 저 둘. 천성적으로 상성이 안 맞는 거겠지."
61080-119 = "괘, 괜찮은 걸까요오……."
61080-120 = "아무려면 어때. 틀린 말 하고 있는 것도 아니고."
61080-121 = "개인적으로는 잘 한다, 더 해라. 이렇게 말하고 싶을 지경인데."
61080-122 = "응. 이번에는 나도 찬성. 힘내, 삿 쨩."
61080-123 = "히, 히이이이……."
61080-125 = "[ns] \"사오리가 고생하고 있는 것 같으니, 내가 끼어들도록 하지!\""
61080-126 = "서, 선생?"
61080-127 = "……당신이, 샬레의 '선생님'이시군요."
61080-128 = "처음 뵙겠습니다. 그리고……."
61080-129 = "아리우스에 오신 것을 환영합니다. [USERNAME] 선생님."
61080-130 = "일단은요."
61080-131 = "[s] \"사오리에게서 스바루에 대한 이야기는 들었어.\""
61080-132 = "하필요?"
61080-133 = "[s] \"다, 다른 스쿼드 아이들로부터도 물론 들었어!\""
61080-134 = "……하필요?"
61080-135 = "어쨌든, 좋습니다."
61080-136 = "갑자기 찾아오셔서 시험을 보자고 하시니, 저희로서는 조금 받아들이기 어려운 부분이 있어서요."
61080-137 = "[s] \"어허. 학생이면 마땅히 공부를 하고 시험을 봐야지.\""
61080-138 = "그게 아리우스에서도 통할 이야기라고 생각하세요?"
61080-139 = "[s1] \"이상하다~? 아리우스도 분명 학원일 거고~\"\n[s2] \"너희들도 확실히, 학생일 텐데에~?\""
61080-142 = "……!"
61080-143 = "우리가…… 학생?"
61080-144 = "이, 일단은 그렇게 분류되어야 하긴, 하겠지……?"
61080-145 = "키보토스는 학원 도시고, 아리우스도 그 안에 있고……."
61080-148 = "하, 하지만……."
61080-149 = "알아. 이런 우리가……."
61080-150 = "다른 학생들처럼, 학생일 수 있는 건지…… 말이지?"
61080-154 = "……일단은, 모든 학생에게 공부가 필요한 것은 아니라고 생각합니다."
61080-155 = "저희가 드릴 수 있는 대답은 그 정도입니다."
61080-156 = "[s] \"……맞아. 그건 어쩌면 그럴지도 몰라.\""
61080-157 = "네……?"
61080-158 = "[s3] \"하지만, 이렇게 해 보면 어떨까?\"\n[s4] \"일단 한번 공부란 걸 해 보고, 그래도 쓸모없다는 생각이 들면.\"\n[s5] \"그때는 정말로 다 그만둬 보는 거야.\""
61080-162 = "어차피 결론은 똑같을 텐데, 왜 그렇게 번거로운 과정을 거쳐야 하죠?"
61080-163 = "네? 경험해 보지 않은 것에 도전하는 게, 청춘이니까……?"
61080-164 = "……정말로, 꿈속의 이상론 같은 말씀이시네요……."
61080-165 = "[s6] \"아픈 곳을 찌르는구나…….\"\n[s7] \"하지만 교사라는 직업은 조금 그래야 하는 부분이 있단다…….\""
61080-168 = "되게 당당하게 대답하시는군요……."
61080-169 = "하아……. 좋습니다. 알겠습니다."
61080-170 = "[s] \"알아주는 거야?\""
61080-171 = "네."
61080-175 = "선생님과 저희의 의견이, 영원히 마주치지 못할 평행선을 달리고 있다는 것을 잘 알았습니다."
61080-179 = "……그렇게 실망하는 표정 짓지 마시고요. 어른이시잖아요."
61080-180 = "어쨌든, 그렇다면……."
61080-181 = "당신들에게 아리우스에 들어올 자격이 있는지부터, '시험'을 치러 보도록 하죠."
61080-185 = "[ns] \"어?!\""
61080-186 = "스쿼드! 너희들은 한 때 아리우스의 배신자였다. 그리고 우리의 인식은 그때와 다르지 않다!"
61080-187 = "정말로 아리우스에 다시 들어오고 싶다면, 너희들의 존재 가치를 이 자리에서 증명해라!"
61080-188 = "안전장치 해제!"
61080-197 = "……역시 그렇게 나오는 건가."
61080-206 = "[ns] \"다들 뭐 하는 거야?!?!\""
61080-207 = "괜찮다, 선생. 이건 어떤 의미로는 아리우스의 방식이다."
61080-208 = "선생에게는 낯설지도 모르겠지만, 우리는 항상 이런 식이었지."
61080-209 = "아이들은 싸우면서 크는 법이라고도 하잖아?"
61080-210 = "그 말을 내가 하니까, 정말로 여러 가지 생각이 든다고? 후후. 칭찬으로 받아들일게."
61080-211 = "그래도…… 뭔가, 정말로 돌아왔다는 느낌이 들기도 하네요. 헤. 헤헤……."
61080-212 = "그런데 아츠코. 마스크를 쓰지 않아도 괜찮은 건가?"
61080-213 = "응. 그걸 쓰면 말을 잘 못 하게 되기도 하고."
61080-214 = "괜찮아, 사오리. 나는 이제 그렇게까지 약하지 않아."
61080-215 = "……알겠다."
61080-216 = "잘 들어, 선생님. 일단 조금이라도 더 안전한 곳으로 몸을 피해."
61080-217 = "그리고…… 우리를 지휘해 줘."
61080-219 = "[ns] \"결국 이렇게 되는 건가…….\""
61080-221 = "여기는 아리우스다!"
61080-222 = "여기는 아리우스다!"
61080-223 = "주장하고 싶은 것이 있다면, 스스로의 힘으로 관철시켜라!"
61080-224 = "스스로의 힘으로!"
61080-225 = "힘이 없는 정의는 공허한 외침일 뿐이고!"
61080-226 = "자신의 삶을 책임지는 것은 결국 자기 자신밖에 없으니!"
61080-227 = "와아아아아!"
61080-232 = "……."
61080-233 = "아리우스 스쿼드."
61080-245 = "응전 준비."
