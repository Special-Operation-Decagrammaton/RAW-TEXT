[translation]
13270-1 = "제27화;종이 한 장 차이"
13270-3 = "……강해졌구나. 시로코 쨩."
13270-9 = "하아…… 하아……."
13270-10 = "선생님과 함께여서 그래. 아직 멀었어. 호시노 선배."
13270-11 = "……. 아냐. 강해졌어. 시로코 쨩은."
13270-12 = "계속 계속 나아가는구나. 이제 이 아저씨를 앞질러 버렸어……."
13270-13 = "……."
13270-18 = "호시노 선배……."
13270-19 = "……."
13270-20 = "선배……."
13270-25 = "[ns] \"이제 충분하잖아. 호시노.\""
13270-29 = "……. 그런 걸까."
13270-32 = "네. 카이저가 저 열차포의 소유권을 주장하는 건 억지예요. 다른 방법으로 싸워볼 여지가 있다고요."
13270-33 = "……그렇겠지. 선생이 같이 있으니까."
13270-34 = "방법은 있었을 거야……. 저번 때나, 그 저번 때처럼. 그렇지…… 선생?"
13270-39 = "[ns] \"맞아. 방법은 찾으면 돼.\""
13270-40 = "……."
13270-41 = "호시노 선배……."
13270-42 = "노노미 쨩……. 괜찮아?"
13270-43 = "네……."
13270-44 = "……저는 지금까지 호시노 선배가 유메 회장을 잃은 고통에서 벗어나기를 바랐어요."
13270-45 = "하지만 죽은 사람은 돌아오지 않고 지나간 시간은 되돌릴 수 없으니까……."
13270-46 = "그랬기 때문에 호시노 선배의 고통을 제 책임이라고 여겼던 거 같아요……. 제가 책임질 수 없는 것이었는데도……."
13270-53 = "저도 어쩌면 저의 죄책감에 집착하고 있었던 걸지도 몰라요……."
13270-54 = "그리고 어쩌면…… 호시노 선배도……."
13270-55 = "……."
13270-59 = "나는…… 유메 회장이나 호시노 선배의 고통을 몰라."
13270-60 = "그래서 무슨 말을 해야 할지 모르겠어…… 미안해. 선배."
13270-61 = "시로코 쨩……."
13270-62 = "하지만…… 나는 알고 싶어. 그걸 알려줬으면 좋겠어. 선배."
13270-63 = "맞아! 제대로 알려줬어야지! 멋대로 책임질 필요도 없고, 멋대로 숨길 필요도 없잖아!!"
13270-64 = "제대로 알려줬어야 하잖아!! 우리 사이인데!!"
13270-65 = "세리카 쨩……."
13270-67 = "맞아요. 제대로 알려주고, 우리가 판단하게 해 줬어야죠!"
13270-68 = "우리가 우리 자치구를, 우리들을 몰라서는 안 돼요. 숨기지 말았어야죠! 혼자 행동하지 말았어야죠!!"
13270-69 = "함께…… 함께 하자고 손 내밀었어야죠……!!"
13270-70 = "아야네…… 아니, 학생회장님."
13270-71 = "아야네 쨩이에요……."
13270-72 = "아야네 쨩……."
13270-73 = "선생님……. 모두들……."
13270-75 = "……. 유메 선배를 죽인 건 나야."
13270-76 = "네?!"
13270-77 = "그건……!"
13270-79 = "……알고 있어. 그건 사고였어. 내 탓이 아냐."
13270-80 = "하지만…… 나는 그렇게 계속 믿고 있었어."
13270-81 = "유메 선배는 학생회장으로서 책임과 의무를 다했어."
13270-84 = "나에게 따뜻하게 대해주고…… 상냥하게 말을 걸어주고……. 늘 나를 부드럽게 안아 주었는데……."
13270-85 = "나는 유메 선배가 남긴 것들을 그 어느 것도 지키지 못했어. 선배를 안아 준 적도 없었어……. 늘 불평과 불만과…… 짜증만 냈으니까……."
13270-86 = "유메 선배에게 받은 것들을 영원히 갚을 길은 없겠지. 절대…… 절대로……."
13270-89 = "선배는 죽어버렸으니까……."
13270-90 = "이제 두 번 다시 만날 수 없으니까……."
13270-93 = "[ns] \"그건 네 탓이 아니야. 호시노.\""
13270-94 = "……알고 있어. 선생님. 그냥…… 나는 투정 부리고 싶었던 거야."
13270-95 = "뭘 투정 부리고 싶었던 건지는 잘 모르겠지만…… 나는……."
13270-96 = "……. 나는 대체……."
13270-97 = "[ns] \"집으로 돌아가자. 호시노.\""
13270-98 = "……. 선생님."
13270-99 = "[s] \"네 고통은 그만하면 됐어.\""
13270-100 = "네. 호시노 선배. 돌아가요. 대책위원회로. 아비도스로."
13270-101 = "응. 맞아. 돌아가자."
13270-103 = "……응. 돌아가요."
13270-109 = "자, 손을 잡아."
13270-113 = "……. 응. 알았어."
13270-114 = "돌아가자……. 집으로……."
13270-121 = "오, 이런…… 그건 안되죠."
13270-126 = "이, 이 소리는……?!"
13270-127 = "처, 천둥 같은 소리야!"
13270-131 = "저, 저기 보세요!"
13270-145 = "움직였다?"
13270-146 = "어, 어째서……?!"
13270-147 = "앗, 제 카드는 어디에……!?"
13270-152 = "타카나시 호시노!!!"
13270-153 = "……!!"
13270-159 = "열차포를 기동시켰다! 날 막아 봐라!"
13270-160 = "이 열차포로 가장 먼저 그 아비도스 학교부터 날려주겠어!"
13270-161 = "!!"
13270-162 = "……!!"
13270-163 = "열차포의 종착지는 대 오아시스 역이다. 거기서 기다리겠어……!!"
13270-164 = "거기로 와라!! 와서 날…… (치익) 막……."
13270-173 = "기다려, 호시노 선배……."
13270-180 = "큭……!"
13270-181 = "호, 호시노 선배……!!"
13270-182 = "[s] \"호시노……!!\""
13270-186 = "…… 고마워. 선생님. 그리고 모두들."
13270-187 = "하지만 이 고통이야말로 유메 선배가 나에게 남긴 전부야. 그러니 나는 이 고통과 함께 계속 살아가지 않으면 안 돼."
13270-188 = "……나는 열차포를 파괴하러 갈 거야."
13270-189 = "유메 선배가 그때 죽지 않았다면, 분명 나에게 같은 일을 시켰을 거니까."
13270-190 = "……그러니 이건 내가 2년 전에 이미 했었어야 하는 일이야."
13270-194 = "[ns] \"호시노!! 기다려!!\""
13270-195 = "도망쳤어!"
13270-196 = "얼른 쫓아가야……."
13270-201 = "확인했습니다!! 선생님!"
13270-204 = "열차포 <셰마타>, 저것은 현재 키보토스에 존재하지 않는 기술이 반영되어 있어요!"
13270-205 = "구조상으로 저 열차포는 태양의 중심부와 비슷한 온도의 플라즈마를 사출하는 병기입니다!"
13270-206 = "하지만…… 기술이 불완전해요. 누군가가 그 기술을 재현하려고 했었지만 결국 실패한 걸로 보이는 미완성품입니다!"
13270-207 = "하지만 그렇다고 저 위험성이 사라진 건 아니에요. 오히려…… 불안전하기에 더 위험한, 언제 터질지 모르는 거대한 폭탄에 가까워요!"
13270-208 = "저걸 파괴하려고 했다간…… 저기 타고 있는 스오우 씨는 물론, 호시노 씨도, 그리고 그 주변에 있는 모든 학생들의 헤일로가 위험해져요!"
13270-210 = "해냈다!!!"
13270-211 = "히히히히히히……!!"
13270-212 = "아슬아슬했습니다…… 거의 질 뻔했어요. 1초, 아니, 그 절반이라도 늦었다면 저의 패배였을 겁니다. 그야말로 종이 한 장 차이!!"
13270-213 = "정말이지 아슬아슬한 승부였습니다…… 네, 인정합니다."
13270-214 = "[USERNAME] 선생, 당신은 제가 상대한 그 누구보다도 강력한 적이었습니다."
13270-215 = "이것으로 기적은 더 이상 발생하지 않습니다. 선생의 힘은 무력화되었어요."
13270-217 = "그럼 [USERNAME] 선생 공략전의 클라이막스입니다."
13270-218 = "자아, 죄책감으로 하나 된 자들아."
13270-219 = "그러므로 죄인들아."
13270-220 = "죄책감과, 욕망과, 두려움과, 또한 알 수 없는 헛것을 쫓는 구도자들아."
13270-221 = "이 세계에 존재하고 있는 자들 중, 그 누구도 체험하지 못했으나, 우리의 몸과 마음, 세계 그 전부를 지배하고 있는 진실."
13270-222 = "그것으로- 아아, 그래. 죽음."
13270-223 = "죽음."
13270-224 = "죽음."
13270-225 = "죽음."
13270-226 = "죽음. 죽음. 죽음. 죽음. 죽음. 죽음. 죽음. 죽음. 죽음. 죽음. 죽음. 죽음."
13270-227 = "극복되지 않고, 회피할 수 없는 그 차가운 진실."
13270-228 = "그것에 대한 깨달음을 나에게 다오."
13270-229 = "여섯 번째 화두, <존재한 적 없는 진실은 진실인가?> 에 대한 대답을, 그 진정한 의미를 깨닫게 해다오-!!"
13270-234 = "색적. 완료."
13270-238 = "무, 뭐, 뭐?!"
13270-245 = "타겟 분석 개시."
13270-246 = "뭐, 뭐냐, 너는! 어째서 이 공간에……?!"
13270-250 = "……. 분석 일부 완료. 개체명 게마트리아 소속 <지하생활자>. 검색 지속. 능력 분석 중."
13270-251 = "이곳은 존재와 비존재가 확정되지 않는 혼돈의 영역인데…… 이곳에 존재할 수 있다니, 네놈은……!!"
13270-252 = "…… 검색 실패. 이 세계에 존재한 적 없는 이질적인 존재. 검색 지속. 고유 능력 확인."
13270-253 = "……신성을 담는 빈 그릇인가. 허나 무언가에 오염되었군."
13270-254 = "방해하지 말고 꺼져라!!"
13270-258 = "이 장소도 들켜버렸나……."
13270-259 = "……허나 상관없습니다. 지금부터는 그저 시간과의 싸움일 뿐이니까……!!"
13270-262 = "……발견했습니다."
13270-263 = "프라나 쨩?!"
13270-264 = "[s] \"프라나!\""
13270-265 = "지금까지 느껴지던 시선의 정체를 확인했습니다."
13270-266 = "그자는 이 세계의 뒤집힌 공간…… 일종의 허수 세계에 숨어 있었던 것입니다."
13270-267 = "허수 세계……."
13270-268 = "저는 존재와 비존재가 확정되어 있지 않은 영역인 <나람신의 왕좌>에 적응되어 있었기 때문에 그자의 은신처에 접근할 수 있었습니다."
13270-269 = "그자는 게마트리아 소속 <지하생활자>."
13270-270 = "[s] \"지하생활자……!\""
13270-271 = "알고 있는 존재예요, 프라나 쨩?"
13270-272 = "부정. 저도 처음 보는 존재였습니다……. 지금은 그자의 목적도, 계획도…… 잘 모르겠습니다. 파악이 불가능합니다."
13270-273 = "……하지만 그 존재의 능력은 어느 정도 파악이 끝났습니다."
13270-274 = "그 능력은 이 세계의 뒤편에 숨어서 이 세계를 강제로 조작하는, 일종의 강제 개입."
13270-275 = "강제 개입……. 그렇다면 샬레의 폭발도……?"
13270-276 = "네. 그렇습니다. 저희가 없었다면 선생님은…… 아마도……."
13270-277 = "[s] \"하지만 다치지 않았잖아. 아로나 쨩과 프라나 쨩 덕분에.\""
13270-278 = "……네."
13270-279 = "선생님, 지금 벌어지고 있는 이 모든 사태는 지하생활자가 선생님에게 도전한 일종의 <대결> 같습니다."
13270-280 = "[s] \"대결이라…….\""
13270-281 = "하지만 이 싸움은, 굉장히 전략적인 의도가 층층이 중첩되어 설계되어 있는 것 같습니다."
13270-282 = "지하생활자…… 그자는 아마도……."
13270-284 = "타카나시 호시노. 즉, <키보토스 최고의 신비>를 이용해서 무언가 하려는 것 같습니다."
13270-285 = "[s] \"검은 양복과 같은 목적인가.\""
13270-286 = "……확인 불가. 하지만 그자의 능력이나 지금까지의 상황을 볼 때, 이것은 단순한 아비도스 자치구만의 문제가 아니게 됩니다."
13270-287 = "그것은……."
13270-292 = "……그렇게 되면 모든 것이 위험해질지도 모릅니다."
13270-293 = "선생님. 호시노 씨를 막지 않으면 안 됩니다……."
13270-294 = "[s] \"알았어.\""
13270-297 = "[ns] \"호시노를 막아야만 해.\""
13270-298 = "……그, 그렇지만. 더이상은……."
13270-299 = "놓쳐버렸어……."
13270-300 = "선배는 기차를 타고 학생회장들의 계곡을 빠져나가 버렸어……."
13270-302 = "하지만…… 뒤쫓는다고 해도 이제 더 이상……."
13270-303 = "……가능한 거야, 저 호시노 선배를 막는 게……?"
13270-304 = "[s] \"아는 사람에게 부탁해 볼게.\""
13270-306 = "……부탁?"
13270-307 = "하지만……."
13270-308 = "[s1] \"아아. 이 일과 무관하지 않은 사람이야.\"\n[s2] \"그리고 그 아이라면 호시노를 막을 수 있을 거야.\""
13270-315 = "[ns] \"부탁해……. 호시노를 막아줘.\""
13270-317 = "……알겠어."
13270-318 = "[s] \"호시노는 지금…….\""
13270-319 = "상황은 파악하고 있어."
13270-327 = "호시노 선배는 지금 기차를 타고 섹터 35-9의 정션 스테이션으로 돌아가고 있을 거예요."
13270-328 = "거기서 기차를 갈아타서 대 오아시스 역으로 향할 생각이겠네요……. 그게 유일한 길이니까."
13270-329 = "하지만…… 지금 그곳은 카이저 PMC가 점령하고 있을 거예요."
13270-330 = "그, 그럼 위험한 거 아냐……? 적들의 소굴로 다시 돌진하는 거잖아."
13270-331 = "……선배라면 문제없겠지."
13270-332 = "아까도 쓰러트린 줄 알았는데도 전혀 아니었어. 선배는 거기서도 힘을 아끼고 있었던 거야……."
13270-333 = "……그거 너무하네."
13270-334 = "[s3] \"…………………호시노를 추격하자.\"\n[s4] \"스오우도, 호시노도 모두 말려야 해.\""
13270-337 = "……네. 알겠습니다."
13270-338 = "벌써 해가 지고 있어……."
13270-339 = "모두들 체력이 거의 바닥났지만…… 하지 않으면 안 돼요."
13270-340 = "……. 응."
13270-371 = "카이저 PMC가…… 없어?"
13270-372 = "……. 이상하네."
13270-376 = "대 오아시스역으로 가는 기차를 움직이려면…… 저쪽 관제실에서 레버를 조작해야 하겠지."
13270-383 = "……."
13270-384 = "안에 누가 있어……."
13270-399 = "기다리고 있었어. 타카나시 호시노."
13270-402 = "어라…… 그러니까……."
