[translation]
10049050-1 = "제5화;헬멧단을 찾아서 1"
10049050-2 = "……."
10049050-3 = "하아…… 하아……."
10049050-7 = "현장, 무대에서 관객석 기준으로 2시 방향, 보이시나요?"
10049050-8 = "퐁당퐁당 헬멧단과 코마카제 라브로 추정되는 인원, 총 3명, 관측되었습니다."
10049050-10 = "!!"
10049050-11 = "신원 확인 및 위협 여부를, 현장에서 확인해 주셔야 합니다."
10049050-12 = "현재 수레를 끌고 가고 있습니다만……."
10049050-13 = "안에 든 것은 팝콘 통과 수류탄 묶음처럼…… 보입니다!"
10049050-15 = "[ns] \"수류탄?!\""
10049050-16 = "그런 것으로 보입니다만……."
10049050-17 = "거리상의 문제로, 여기서는 정확히 시인할 수 없기에, 현장의 판단을……."
10049050-21 = "대장, 이게 다일까요?"
10049050-22 = "그럴 리가 있겠냐, 할 거면 확실하게 털어먹어야지."
10049050-23 = "역시 대장이야! 곧 대박 터지겠네요!"
10049050-24 = "일단 이 근처랬는데…… 으윽. 사람이 갑자기 왜 이리 많아졌어?"
10049050-25 = "그러게요, 거기! 비켜, 비켜!"
10049050-30 = "어……."
10049050-31 = "엥……?"
10049050-32 = "대장? 무슨 일이에요?"
10049050-33 = "아니, 그게……."
10049050-34 = "무대 위의 저 분홍 옷 입은 사람."
10049050-35 = "왜요? 그냥 애들 보는 만화 쇼 캐스트 아녜요?"
10049050-36 = "한 번도 본 적 없는 사람인데……."
10049050-37 = "갑자기 오금이 저려."
10049050-38 = "강해, 저 녀석……."
10049050-45 = "튀어!!!"
10049050-49 = "네?!"
10049050-59 = "현장, 확인했습니다! 코마카제 라브 등 퐁당퐁당 헬멧단 3인!"
10049050-60 = "게헨나 쪽으로 도주합니다, 추격합니다!"
10049050-64 = "스즈…… 테르밋 화이트! 어디 가시는 건가요!"
10049050-66 = "뭐지?! 갑자기 무대에서 뛰어내렸어!"
10049050-67 = "무슨 일이지?"
10049050-69 = "테르밋 화이트!!"
10049050-70 = "방송사고…… 아니, 연극 사고인 건가?"
10049050-75 = "[ns] \"따라가자!\""
10049050-76 = "네!"
10049050-78 = "스즈미 씨! 확인만 하시면 됩니다!"
10049050-79 = "게헨나 구역에 들어가시면, 정의실현부로서는 더 이상 도와드릴 수 없습니다!"
10049050-80 = "죄송합니다. 한시가 급한 상황입니다."
10049050-81 = "그 사람들, 수류탄 같은 다수의 폭발물도 대량으로 소지하고 있었습니다."
10049050-82 = "지원은 괜찮습니다."
10049050-83 = "제가, 어떻게든 해보겠습니다."
10049050-84 = "핑크도 따라갑니다!"
10049050-88 = "헥, 헤-엑!!"
10049050-89 = "대장!! 저 녀석들 대체 뭐예요?!"
10049050-90 = "낸들 아냐?! 쫓아오니까 적이겠지!"
10049050-91 = "갑자기 무대에서 뛰어내려서 쫓아온다니,"
10049050-92 = "그냥 무대 공연의 일부 아닐까요? 무대에서 뛰어내리는……?"
10049050-93 = "락밴드 공연인 줄 알아? 저런 옷을 입고서?"
10049050-94 = "정지, 거기 서세요."
10049050-100 = "으악, 언제 앞으로 달려온 거야?!"
10049050-101 = "엄청 빠른데요, 눈 깜짝할 사이에……."
10049050-103 = "퇴로는 테르밋 핑크가 막았습니다! 헤비캘리버즈에게 항복하세요!"
10049050-105 = "헤비…… 뭐? 헤비캘리버즈?"
10049050-106 = "그거, 길거리 아이들이 갖고 놀던 장난감 아냐?"
10049050-107 = "너희들 그…… 그거냐? 뭔가 과몰입…… 하는……."
10049050-109 = "뭔가 저런 거 매니아들 같은데요?"
10049050-110 = "그보다, 웬 핑크? 보라색이니까 '퍼플' 아냐?"
10049050-112 = "이유를 알려드리면 스포일러가 될 수 있으니, 본편을 보시는 것을 추천드립니다!"
10049050-113 = "(우리의 정체에 대해서는 전혀 모르는 모양이군요. 그건 다행인데…….)"
10049050-117 = "오, 퍼레이드 쇼인가 봐!"
10049050-118 = "그게 뭔데?"
10049050-119 = "무대에서만 하는 게 아니라, 장소 전체를 무대 삼아서 하는 리얼한 공연이야."
10049050-120 = "여기 있다! 핑크랑 화이트!"
10049050-121 = "악당하고 싸우나 봐!"
10049050-125 = "(곤란하네요…… 관객분들이 점점 더 모여들고 있군요…….)"
10049050-126 = "(어린아이들도 있어서 섬광탄이라도 위험할 수 있는데…….)"
10049050-127 = "(일단, 안전하게 말로…….)"
10049050-128 = "몇 가지 확인할 게 있으니, 잠시 동행해 주시기를 부탁드리겠습니다."
10049050-129 = "[s] \"얘들아, 잠시 대화라도!!\""
10049050-131 = "켁, 샬레의 선생까지?"
10049050-132 = "누군지는 몰라도 선생까지 끌고 와서는……."
10049050-133 = "얘들아, 우리를 방해한다는데?"
10049050-135 = "그렇게는 못 하죠 대장!"
10049050-136 = "어떻게 잡은 건수인데!"
10049050-138 = "그래……."
10049050-139 = "쓸어버려!"
