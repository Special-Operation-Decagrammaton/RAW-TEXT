[translation]
1301203-1 = "총성과 지르코니아"
1301203-2 = "시바타운 대형 보석상 앞"
1301203-3 = "쾅! 콰광!"
1301203-5 = "가까이 다가오지 마! 나는 진심이야!"
1301203-6 = "조금이라도 수상쩍은 행동을 보이면 이 건물을 통째로 날려버릴 줄 알아!"
1301203-7 = "사, 살려주세요!"
1301203-9 = "대단히 용의주도한 범죄자로군요. 곳곳에 무선 기폭 장치로 폭파할 수 있는 폭탄이 설치되어 있습니다."
1301203-10 = "퍼그 인질을 구하는 일뿐이라면 돌격을 감행해도 상관없겠지만…… 자칫했다가는 인근의 상가가 모두 폭발에 휘말릴지도 모르겠습니다."
1301203-11 = "[s] \"역시 전문 교섭인을 기다리는 편이…….\""
1301203-12 = "아뇨. 범인의 인내력이 언제 바닥날지 모르는 상황. 교섭은 조금도 지체할 수는 없습니다."
1301203-13 = "게다가 이래 봬도 본관은 생활안전국의 도넛 협상에서 한 번도 밀려본 적이 없거든요!"
1301203-18 = "[ns] \"간식을 나누어 먹는 일과는 다르지 않을까…….\""
1301203-23 = "무의미한 저항은 그만두세요! 순순히 투항한다면 안전을 보장하겠습니다!"
1301203-24 = "뭐지? 벌써 교섭인이 도착한 건가?"
1301203-25 = "네 녀석은 누구냐? 교섭인이라면 당장 신분을 밝혀!"
1301203-26 = "본관은 발키리 경찰학교, 생활안전국의 키리노라고 합니다."
1301203-27 = "당신과 교섭하여 인질을 구출하기 위해 이 자리에 왔습니다."
1301203-28 = "뭐? 생활안전국? 경비국이나 공안국이 아니라 생활안전국에서 교섭인을 보냈다고?!"
1301203-29 = "웃기지 마! 나를 바보로 아는 거야? 당장 제대로 된 교섭인을 데려와!"
1301203-30 = "시, 실례네요! 이래 봬도 본관은 어엿한 발키리 경찰학교의 일원이라고요? 무시하지 말아주세요!"
1301203-31 = "젠장, 어째서 생활안전국의 조무래기가……."
1301203-32 = "할 수 없지. 협상안을 말해봐. 하지만 엉뚱한 수작을 보이려는 것 같으면 바로 이 기폭 장치를 터트릴 줄 알아!"
1301203-33 = "좋았어. 이제 매뉴얼에 따라 교섭을 진행하면……."
1301203-34 = "우, 우선 당신은 어째서 범행을 저지른 건가요?"
1301203-35 = "그야 당연히 돈 때문이지!"
1301203-36 = "젠장, 지난주에는 고양이 카페에서 너무 많은 돈을 탕진하고 말았어……."
1301203-37 = "새로 들어온 삼색 고양이에게 개다래 열매와 캣닙을 사주느라 이번 주 식비가 곤궁해져서……."
1301203-38 = "나도 돈만 충분했다면 이런 귀찮은 일은 저지르지 않았을 거라고!"
1301203-39 = "하지만 그건…… 당신 책임이잖아요?"
1301203-41 = "하아~?!"
1301203-42 = "넌 바보냐! 인질범을 자극하면 어쩌자는 거야?!"
1301203-43 = "하지만 누가 당신에게 돈을 쓰라고 강요한 것도 아니잖아요?"
1301203-44 = "소비는 계획적으로 하고, 지출이 심한 달에는 아르바이트를 했더라면 돈이 부족할 일은 없었을 텐데요."
1301203-45 = "그, 그건 그렇지만……."
1301203-46 = "설령 옳은 말이라 하더라도 현장에서는 인질범을 자극하지 않는 게 협상의 기본이라고!"
1301203-47 = "이래서 생활안전국의 조무래기들은!"
1301203-49 = "과연, 그렇군요. 참고가 되었습니다."
1301203-50 = "[s] \"어째서 범죄자로부터 협상 기술을 배우고 있는 거야.\""
1301203-51 = "그리고 그다음은…… '범인의 요구 사항을 확인한다'. 흠, 흠."
1301203-52 = "그럼 당신은 무엇이 필요해서 인질을 붙잡고 있는 건가요?"
1301203-53 = "잘 물어보았다! 내가 요구하는 것은 여기 있는 다이아몬드와 같은 가치의 현금과, 도주에 사용할 스포츠카……."
1301203-54 = "그리고 대량의 개다래 열매를 요구한다!"
1301203-55 = "저, 그건 곤란합니다만……."
1301203-56 = "뭐? 어째서! 이곳에 있는 다이아몬드가 모두 불타도 상관없다는 거냐?!"
1301203-57 = "그렇다기보다는 교통 정체 때문에 차량 접근이 어려워서요. 스포츠카를 타더라도 도망치기는 어려울 겁니다."
1301203-58 = "게다가 당신이 잔뜩 훔친 건 다이아몬드가 아니라 별 가치가 없는 지르코니아뿐이라……."
1301203-59 = "보석으로 교환할 수 있는 현금은 커녕, 스포츠카를 대여하는 비용이 더 비싸게 나오지 않을까요?"
1301203-61 = "젠장! 그럼 나는 무얼 위해서 이런 짓을……."
1301203-66 = "그아아아아아!"
1301203-67 = "히, 히익?"
1301203-69 = "이런, 인질범이 이성을 잃었습니다! 어서 조치를 취해야겠어요!"
1301203-70 = "[s] \"키리노 때문이잖아.\""
1301203-71 = "그, 그렇지 않습니다! 애초에 범죄를 저지른 범죄자 쪽이 나쁜 거라고요!"
1301203-72 = "하지만 이렇게 된 이상…… 범인이 폭탄에 손을 대기 전에 기폭 장치를 저격해야겠네요."
1301203-73 = "범인의 손을 정조준…… 사격합니다!"
1301203-84 = "으, 으악!"
1301203-85 = "뭐, 뭐야? 어째서 내가 아니라 인질을 쏜 거야?"
1301203-87 = "으으…… 또 사격 미스를……."
1301203-88 = "이번에는 놓치지 않습니다!"
1301203-98 = "끄악!"
1301203-99 = "쏘, 쏘지 마세요! 저는 인질입니다!"
1301203-100 = "뭐, 뭐야? 지금 이 상황은?!"
1301203-101 = "(도대체 이 교섭인은 뭐지? 처음부터 끝까지 인질범인 나를 화나게 하는 말만 늘어놓더니, 이제는 고의로 인질에게 총을 쏘고 있잖아?!)"
1301203-102 = "(보통은 인질이 다칠까 두려워 제대로 행동하지 못해야 정상인데…….)"
1301203-103 = "(설마…… 인질이 어떻게 되든 간에 범죄자와는 협상하지 않겠다는 의지를 표현하는 건가?)"
1301203-106 = "(……그러고 보니 들은 적 있어. 인질의 안위는 신경도 쓰지 않고 범죄자만을 악랄하게 추격하는 '미친개'가 발키리 경찰학교에 있다고…….)"
1301203-107 = "(설마 이 맹해 보이는 교섭인이 그 미친개인가?)"
1301203-108 = "(안 돼…… 이대로는 인질을 잡은 보람도 없이 끔찍한 꼴을 당하고 말 거야!)"
1301203-110 = "아, 알겠어! 하, 항복할게!"
1301203-111 = "퍼그 인질이고 보석이고 다 포기할 테니까…… 제발 목숨만 살려줘!"
1301203-113 = "어라? 갑자기 범인이 기폭 장치를 내려놓고 인질을 보내주고 있습니다."
1301203-114 = "갑자기 무슨 심경의 변화라도 생긴 걸까요?"
1301203-116 = "……후후, 역시 본관의 교섭에 범인도 마음을 열어준 모양이네요!"
1301203-117 = "[s1] \"그런 것 같지는 않은데…….\"\n[s2] \"뭔가 이상한데…….\""
1301203-118 = "아무리 극악무도한 범죄자라도 진심을 담아 대화를 시도하면 통하는 법."
1301203-119 = "아무리 극악무도한 범죄자라도 진심을 담아 대화를 시도하면 통하는 법."
1301203-120 = "오늘도 정의의 승리입니다!"
1301203-122 = "(이후, 뒤늦게 도착한 전문교섭인과 경비국 학생들이 인질범을 무사히 체포하여 데려갔다.)"
1301203-123 = "(……한편, 키리노는 인질에게 부상을 입힌 건 때문에 시말서를 썼다.)"
