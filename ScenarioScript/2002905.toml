[translation]
2002905-1 = "여름 바다의 추억"
2002905-2 = "해변가"
2002905-5 = "자, 선생님. 갈게요?"
2002905-6 = "하나, 둘…… 셋!"
2002905-14 = "[ns] \"에잇!\""
2002905-16 = "잘하셨어요! 그러면 계속해서…… 얏!"
2002905-25 = "[ns] \"으랏차!\""
2002905-27 = "(해변에서 미모리와 하게 된 것은…… 비치발리볼이었다.)"
2002905-28 = "(비치발리볼 랠리를 한참 동안 이어 나가던 도중……)"
2002905-31 = "꺄앗?"
2002905-39 = "[ns] \"괜찮아!?\""
2002905-40 = "네. 괜찮아요. 모래를 잠깐 헛디뎠네요."
2002905-41 = "우우, 이번엔 제가 지고 말았어요……"
2002905-42 = "비치발리볼 랠리에 승패는 특별히 없는 것 아니냐고요?"
2002905-43 = "그렇게 볼 수도 있겠지만…… 후훗. 어째서일까요."
2002905-44 = "오늘따라 조금, 승부욕 같은 것이 생기기도 하네요."
2002905-45 = "이렇게 된 이상, 잠깐 쉬지 않으시겠어요?"
2002905-46 = "파라솔을 펼치고…… 네. 여기, 시원한 파인애플 주스도 있답니다."
2002905-53 = "목이 마르실 테지만, 천천히 드세요. 체할 수도 있으니까요."
2002905-54 = "음…… 그 표정은 무언가, 먹고 싶은 것 같으면서도 아닌 듯한!"
2002905-55 = "근처 바다의 집에서, 야키소바라도 사 올까요, 선생님?"
2002905-56 = "[s1] \"아니야. 그렇게까지는 필요 없어.\"\n[s2] \"이왕 갈 거라면, 미모리와 같이 가고 싶고.\""
2002905-59 = "……"
2002905-60 = "저, 정말. 선생님께선 언제나……"
2002905-61 = "아, 아니에요. 선생님께서는 잘못한 거 없으세요. 그저 제가, 제가……"
2002905-62 = "모, 몰라요! 이렇게 된 거 저도 선생님이랑 같이 쉴 거니까요!"
2002905-66 = "(이상하리만치 당황하는 미모리와 나란히 앉아, 파도가 밀려오는 해변을 바라보았다.)"
2002905-71 = "……"
2002905-72 = "[ns] \"……\""
2002905-73 = "역시, 좋네요."
2002905-74 = "[s] \"바다가 좋아?\""
2002905-75 = "네? 무, 물론 그런 것도 있지만요……!"
2002905-76 = "그저, 이렇게 있는 시간 자체가 좋다고 할까요, 그도 아니면……"
2002905-77 = "……치사하시다니까요. 정말."
2002905-78 = "[s] \"내가 왜?!\""
2002905-79 = "우우……"
2002905-80 = "이렇게 된 이상……. 선생님?"
2002905-81 = "[s] \"으, 응?\""
2002905-82 = "그럼, 지금부터, 저, 절 잡아 보세요!"
2002905-87 = "(갑자기 미모리가 일어나 달리기 시작했다!)"
2002905-90 = "[ns] \"미, 미모리 갑자기?! ……좋아~! 나도 질 수 없다고!\""
2002905-91 = "와아~ 무서워요~"
2002905-97 = "(미모리와 함께 모래사장을 달렸다.)"
2002905-102 = "(그렇게 즐겁게, 쫓고 쫓기기를 계속하던 순간.)"
2002905-106 = "[ns] \"우왓?!\""
2002905-108 = "(모래를 헛디뎌 성대하게 넘어지고 말았다……)"
2002905-109 = "서, 선생님?!"
2002905-113 = "괜찮으세요? 괜히 저 때문에……"
2002905-114 = "그렇게 울상이 될 필요는 없다고 하셔도……"
2002905-115 = "죄송해요…… 정말 죄송해요. 선생님……"
2002905-116 = "[s3] \"아니, 정말로 괜찮으니까.\"\n[s4] \"그리고 나도 오랜만에 기분 좋게 뛰었고.\""
2002905-119 = "정말…… 요?"
2002905-120 = "정말이신, 거죠?"
2002905-121 = "하지만 넘어지신 것도 사실이고, 선생님, 뭔가 지쳐 보이시고……"
2002905-122 = "아, 그래요! 다음에는…… '바다 위에 둥둥 떠다니기'를 해 보는 게 어떠세요?"
2002905-123 = "그게 뭐냐고요? 후훗. 그건요……"
2002905-128 = "네. 이렇게 몸에 힘을 빼고, 하늘을 바라보면서……"
2002905-129 = "숨을 깊이 들이쉬고, 얕게 내쉬면……"
2002905-130 = "물침대에 누워 있는 느낌이 들면서, 물 위에 떠오를 수 있답니다."
2002905-131 = "선생님도 한 번, 해 보세요!"
2002905-132 = "(미모리의 말대로, 몸에 힘을 빼고 천천히 숨을 쉬었다.)"
2002905-137 = "어떠세요, 선생님?"
2002905-138 = "네? 너무 편안해서 이대로 자 버릴 것 같으시다고요?"
2002905-139 = "조, 조심하셔야 해요! 예전처럼 바다에서 함부로 잠드시면……"
2002905-140 = "……여차하면, 제가 구해드리면 되긴 하지만요……"
2002905-141 = "그래도…… 좋네요."
2002905-142 = "선생님과 함께하는 시간이어서, 더 그런 걸까요……?"
2002905-148 = "오늘은 어떠셨나요, 선생님?"
2002905-149 = "즐거우셨다고요? 그렇다면 정말 다행이네요."
2002905-150 = "……."
2002905-151 = "[s] \"미모리?\""
2002905-152 = "정말…… 하루가 끝났네요."
2002905-153 = "……모든 일에는 마지막이 있는 법이겠죠?"
2002905-154 = "[s] \"그거야…… 그렇지?\""
2002905-155 = "있잖아요, 선생님……"
2002905-156 = "조금만 더, 같이 있어 주실 수…… 있으세요?"
2002905-157 = "정말, 약간만이라도 좋으니까요."
2002905-158 = "[s] \"그런 건 아무래도 상관없는데. 갑자기 왜?\""
2002905-159 = "죄송해요, 선생님."
2002905-160 = "이게 지나친 어리광이라는 것은 알고 있어요. 하지만……"
2002905-161 = "오늘은…… 즐거웠어요. 정말로 즐거웠어요."
2002905-162 = "선생님과 함께 있다는 사실만으로도, 저는 너무 기뻐서……"
2002905-163 = "[s5] \"바다를 즐기는 건 잘못이 아니잖아.\"\n[s6] \"나도, 미모리와 함께여서 좋았어.\""
2002905-166 = "후훗. 네……"
2002905-167 = "이 시간의 바다라는 것도…… 좋네요."
2002905-168 = "[s] \"수영이라도 더 하려고?\""
2002905-172 = "아니요. 그냥…… 잠시, 바다를 걷고 싶어요."
2002905-179 = "[wa:2250]― [log=미모리 수영복ND]이대로,[/log]"
2002905-181 = "[wa:300]― [log=미모리 수영복ND]이 시간이 [wa:1500]영원할 수 있다면 좋을 텐데.[/log]"
2002905-184 = "[wa:2250]― [log=미모리 수영복ND]이대로, [wa:1050]사진이나 [wa:450]그림처럼 [wa:1300]시간이 기록되어서――[/log]"
2002905-186 = "[wa:100]― [log=미모리 수영복ND]그렇게 된다면…………[/log]"
2002905-189 = "[ns7] \"그만큼 오늘이 즐거웠다는 뜻이잖아.\"\n[ns8] \"나도 뭔가 아쉽네. 이렇게 하루가 끝나는 게.\""
2002905-190 = "[wa:400]― [log=미모리 수영복ND]선생님도 [wa:1300]같은 마음[wa:1400]이시라고요?[/log]"
2002905-191 = "[wa:400]― [log=미모리 수영복ND]선생님도 [wa:1300]같은 마음[wa:1400]이시라고요?[/log]"
2002905-193 = "[wa:250]― [log=미모리 수영복ND]그건…… [wa:1550]왠지, [wa:1550]쑥스럽네요.[/log]"
2002905-196 = "[wa:1400]― [log=미모리 수영복ND]저는 오늘……[/log]"
2002905-198 = "[wa:100]― [log=미모리 수영복ND]수행을 잊을 정도로…… [wa:1700]행복했답니다.[/log]"
2002905-201 = "[wa:1800]― [log=미모리 수영복ND]저, [wa:1700]선생님.[/log]"
2002905-204 = "[wa:1000]― [log=미모리 수영복ND]언젠가 또……[/log][wa:100]"
2002905-206 = "[wa:750]― [log=미모리 수영복ND]이런 시간을 만들어 주실 수 있으신가요?[/log]"
2002905-210 = "해가 거의 저물었네요. 조금 있으면 달이 뜰 거고요."
2002905-211 = "저, 달이 보고 싶은데…… 괜찮으실까요?"
2002905-212 = "[s] \"으, 응…… 그러자.\""
2002905-213 = "감사합니다."
2002905-214 = "오늘은…… 제가 선생님께 의존만 하게 되네요."
2002905-215 = "괜찮으시다면…… 어깨를, 조금, 빌려주실 수 있으실까요?"
2002905-220 = "(미모리를 어깨로 느끼며, 달이 뜨는 것을 함께 지켜보았다.)"
