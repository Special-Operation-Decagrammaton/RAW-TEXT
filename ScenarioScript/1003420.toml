[translation]
1003420-1 = "요조숙녀의 진심"
1003420-3 = "어서 오세요, 선생님!"
1003420-4 = "오늘은 제 요리 수행 성과를 보여드리고 싶어서…… 이렇게, 외람되지만 선생님을 초대해 드렸답니다."
1003420-5 = "그러면, 우선 조리실로 가실까요?"
1003420-6 = "수행부 조리실"
1003420-7 = "이곳이 저희 수행부의 조리실이랍니다."
1003420-8 = "요리 수행, 식사 준비, 심신 단련…… 여러 가지 용도로 사용되고 있기도 한…… 데……?"
1003420-23 = "왜 조리실이 이렇게 엉망진창이 되어 있는 거죠?!"
1003420-24 = "아, 미모리 쨩. 그게…… 지난밤 망량즈들이 조리실에서 축제를 벌여서 말이야."
1003420-25 = "아무래도 이걸 다 정리하려면 시간이 상당히 걸릴 것 같으니, 오늘은 조리실을 사용하지 않는 게……"
1003420-26 = "……"
1003420-27 = "그럴 수는 없어요."
1003420-44 = "미모리 쨩?!"
1003420-45 = "이런 거, 조금만 정성을 들여서 치우면 되는 일이니까요!"
1003420-46 = "[s] \"아. 그런 거라면 나도 도와줄게.\""
1003420-47 = "네?! 선생님께서 청소를 도와주신다고요?!?!"
1003420-48 = "아, 안 돼요! 제가 청소할게요. 아뇨, 하게 해 주세요! 애초에 여기는 저희 수행부 소속의 조리실이니까요!"
1003420-49 = "애초에 이상적인 요조숙녀라면…… 망량즈가 이곳에서 축제를 벌일 거라는 사실 정도는 사전에 짐작하고."
1003420-50 = "하루 전에 현장을 습격해, 모조리 일망타진할 줄도 알았어야 하는 법인데……!"
1003420-51 = "[s] \"그건 아니지 않을까?!\""
1003420-52 = "하지만, 하지만……"
1003420-53 = "제가 아무것도 하지 않은 탓에, 조리실이 이렇게 되어 버렸는 걸요……"
1003420-54 = "그것도 모자라 선생님의 도움까지 받아 버린다면, 저는……"
1003420-55 = "[s1] \"그런 건 괜찮으니까.\"\n[s2] \"가끔은 타인의 도움을 받아들여 주면 좋겠어.\""
1003420-58 = "……."
1003420-59 = "선생님께서 그렇게 말씀하신다면…… 네."
1003420-60 = "잘 부탁드리겠습니다. 선생님."
1003420-61 = "그, 그럼! 이렇게 몸소 시간을 내어 주신 선생님을 위해서라도!"
1003420-62 = "저, 미즈하 미모리. 수행부의 부부장으로서……"
1003420-63 = "오늘은 한층 기합을 넣어! 진심으로 가겠습니다!"
1003420-64 = "[s] \"평소의 모습만으로도, 충분히 진심 같았는데!?\""
1003420-65 = "아니에요! 더욱더 멋진 요조숙녀가 되기 위해서는, 마음가짐부터 다잡을 필요가 있답니다!"
1003420-66 = "그러니 저는…… '그것'을 꺼낼 수밖에 없어요!"
1003420-73 = "[ns] \"이것은, 도대체?!\""
1003420-74 = "그러면, 시작하겠습니다!"
1003420-77 = "(진심 모드(?)의 미모리는, 그야말로…… 굉장함을 넘어 조금 무서웠다……)"
1003420-84 = "후우…… 수고하셨습니다. 선생님."
1003420-85 = "네? 수고는 제가 다 한 것 아니냐고요? 후훗……"
1003420-86 = "별말씀을요. 오히려 선생님의 도움까지 받게 되어…… 죄송스럽기만 한걸요."
1003420-87 = "그러면, 이것도 다시……"
1003420-92 = "네? 귀여운…… 앞치마, 였다고요?"
1003420-93 = "저, 정말. 선생님도. 놀리기만 하시고."
1003420-94 = "놀리는 게 아니라고요……?"
1003420-95 = "……"
1003420-96 = "피, 피곤하실 테니, 일단 자리를 옮기시죠! 네!"
1003420-99 = "잠시만 앉아서 기다리세요. 차를 내올게요."
1003420-112 = "자, 드세요. 선생님. 화과자도 조금 준비해 봤어요."
1003420-113 = "사실은…… 이 화과자를 만드는 수행을 보여드리려, 선생님을 초대드린 것이었지만요……"
1003420-120 = "입에 맞으시나요? 차가 너무 뜨겁지는 않으시고요?"
1003420-121 = "[s] \"아주 맛있어. 향도 좋고.\""
1003420-122 = "후훗. 다행이네요……"
1003420-123 = "네? 그 앞치마는…… 뭐냐고요?"
1003420-124 = "……"
1003420-125 = "그건…… 제가 처음, 이상적인 저 자신이 되려는 꿈을 가졌을 때, 만화를 보고 샀던 앞치마예요."
1003420-126 = "지금까지 쭉 사용하며 관리해 왔던…… 낡은 물건이죠."
1003420-127 = "[s] \"그런 것 치고는 거의 새것처럼 보이던데?\""
1003420-128 = "후후. 그런가요? 사실은 여기저기 잔 수선을 한 부분도 남아 있고, 끝이 살짝 해지기도 했어요."
1003420-129 = "그렇지만 저에게는…… 무엇과도 바꿀 수 없는 앞치마죠."
1003420-130 = "착용감도 좋고, 무엇보다 마음이 편안해져서……"
1003420-131 = "청소, 요리, 세탁, 재봉,  독심…… 사용처가 무궁무진하거든요."
1003420-132 = "[s] \"……독심?\""
1003420-133 = "아, 그, 그게!"
1003420-134 = "아니에요! 말이 잘못 나왔어요!"
1003420-136 = "(독심에 대해 재차 물었지만, 그때마다 미모리는 필사적으로 말을 돌렸다……)"
1003420-138 = "지금보다 한참 어렸을 때 산 것이라, 처음에는 지나치게 커서 몇 번이고 접어 입어야 했어요."
1003420-139 = "그때에는…… 그렇게 생각했죠. 이 앞치마가 잘 맞게 되었을 때는, 제가 바라는 저 자신이 되어 있을 거라고요."
1003420-140 = "후훗…… 그립네요. 조금 부끄럽기도 하고요."
1003420-141 = "[s] \"부끄러워할 이유는 없지 않을까?\""
1003420-142 = "글쎄요…… 어떨까요?"
1003420-143 = "그때의 저는, 바라는 것이라면 뭐든지 이룰 수 있을 거라고 생각했는데 말이에요."
1003420-144 = "앞치마는 이렇게 딱 맞게 되었지만……"
1003420-145 = "제가 바라던 저 자신이 되었는지는…… 잘 모르겠네요."
1003420-147 = "(미모리 정도면 충분히 노력하고 있다고 이야기하려 한 순간이었다.)"
1003420-148 = "아, 선생님. 지금 막 저 정도면 충분히 노력하고 있다고 말씀하려 하셨죠?"
1003420-149 = "[s] \"이럴 수가, 들통났다?!\""
1003420-150 = "후후…… 선생님다운 말씀이어서 안심이 되네요. 감사하기도 하고요."
1003420-151 = "[s3] \"역시, 앞치마와 함께여서인가!\"\n[s4] \"앞치마와 함께라면 독심술력이 늘어난다는 게, 사실이었어?\""
1003420-154 = "네, 네?! 전 그런 말은 한 번도 드린 적이……?"
1003420-158 = "그, 그렇게 '다 이해했어.' 라는 표정으로 바라보셔도 말이죠……!"
1003420-159 = "선생님? 선생님??"
1003420-161 = "(그 뒤로도 미모리는, 드물게 당황해하면서도 제대로 된 대답을 해 주지는 않았다……)"
