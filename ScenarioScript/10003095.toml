[translation]
10003095-1 = "제9화;선도부 vs 문제아 2"
10003095-2 = "중전차를 일개 개인이 단독으로?!"
10003095-3 = "저, 전원 후퇴! 선도부장이 자리에 없던 거 아니었냐고~?! 제기랄! 속았다!"
10003095-4 = "아앗! 온천이!! 해양심층수 온천이!!"
10003095-11 = "으아아아-! 옥수수가! 남은 옥수수들이! 팝콘이 되어버렸어!"
10003095-12 = "어머나☆ 선도부장이 등장했다면 무리, 무리예요."
10003095-13 = "흠. 아무래도 여기까지인가 보네요. 이번 탐구는 여기까지 하는 걸로."
10003095-14 = "네~! 철수!"
10003095-15 = "뭘 그렇게 여유가 넘치는 거야?! 얼른 도망쳐!!"
10003095-19 = "……그야말로 눈 깜짝할 사이에……."
10003095-20 = "이것이 히나 부장님의 힘……."
10003095-21 = "헬멧단 및 불량배 등의 잔당들은 대부분 사로잡는 데 성공했습니다!"
10003095-22 = "현재 도주하고 있는 몇몇 학생들도, 추격을 시작했으니 곧 있으면 전부 잡을 수 있을 겁니다."
10003095-23 = "사태의 진압! 고생하셨습니다! 소라사키 부장님!"
10003095-24 = "별 거 아니었어. 그보다 이오리, 치나츠."
10003095-25 = "엑."
10003095-26 = "부장님……."
10003095-31 = "이대로 모두 호텔로 복귀한다."
10003095-32 = "아, 그리고……."
10003095-33 = "돌아간 직후에, 반성회를 가질 테니, 모두 참가하도록."
10003095-34 = "……하아."
10003095-35 = "네……."
10003095-36 = "특히 아코."
10003095-37 = "으. 네, 네에."
