90002140-282 = "……저희가 이런 말을 하는 것도 이상하겠지만……."
90002140-286 = "감사해요. 기뻤어요."
90002140-288 = "열심히 했다고 이야기해 주셔서, 기뻤어요."
90002140-289 = "최선을 다했다고 말씀해 주셔서, 기뻤어요."
90002140-291 = "……행복해졌으면 좋겠다고 말씀해 주어서…… 정말로, 기뻤어요."
90002140-296 = "뭐…… 그렇지. 그렇다는 이야기야."
90002140-297 = "선생님 입장에서는 그렇게 어렵게 생각할 거 없지 않나요? 키보토스를 엉망으로 만들려고 했던 악당들은, 자기 꾀에 빠져서 이걸로 끝!"
90002140-298 = "아마도 더 큰 문제가 이제 곧 다가오겠지만, 그건 그때 생각하기! 그런 거죠. 아닌가요? 와하하하!"
90002140-299 = "하하, 하……."
90002140-303 = "……거짓말쟁이."
90002140-304 = "뻔한 거짓말은, 서로 지적하지 말자구요."
90002140-305 = "그래요……. 웬만한 일이라면, 그랬겠죠…… 분명 그랬을 거예요……."
90002140-306 = "하지만!"
90002140-310 = "이대로는 화가 나서 도저히 참을 수 없으니까! 당신들이 지금 절 화나게 했으니까!"
90002140-311 = "어? 어? 어? 왜, 왜요?!"
90002140-312 = "그야 당연히! 하나도 괜찮지 않으면서 괜찮은 척이나 하고 있고! 속은 얕을 대로 얕아서 빤히 들여다보일 정도고!"
90002140-313 = "애초에 아리스가 이렇게까지 말했잖아요! 그런데 여기까지 와서 한다는 말이 이제 아무래도 좋으니까 도망치라고요?"
90002140-314 = "웃기지 마요! 살아 있다면 발버둥 쳐요! 뭐든 좋으니까 비틀고 몸부림쳐서 싸워요!"
90002140-315 = "마침내 행복이 다가오기를 기도하면서, 가만히 기다리고만 있지 말라고요! 손이 놀잖아요!"
90002140-316 = "바라는 것이 있다면, 그리고 그것이 무엇보다 절실하다면!"
90002140-317 = "몇 번이나 이야기했던 것이지만, 모든 것을 걸고 [ruby=싸우라]행동해라[/ruby]는 겁니다!"
