[translation]
90002140-1 = "제14화;가지고 태어난 것"
90002140-3 = "하, 하지만 우리는…… 겨, 결국…… 프로그램된 대로 행동하고 있을 뿐인 게, 아닐까요……?"
90002140-4 = "[s1] \"그럴지도 모르지만, 우리도 마찬가지야.\"\n[s2] \"우리도 사랑을 갖도록, 프로그램되어 있으니까.\""
90002140-7 = "네, 네에?!"
90002140-8 = "사랑을 갖도록 프로그램된 것은, 사람 역시 마찬가지라고요? 그, 그런 이야기는, 처음, 듣는데요……?"
90002140-10 = "[log]\"가령 부모가 아이를 무조건 사랑하는 것.\"[/log]"
90002140-12 = "[log]\"그리고 아이가 부모를 무조건 사랑하는 것.\"[/log]"
90002140-15 = "[log]\"나아가, 사람이 사람을 사랑하는 것 역시도.\"[/log]"
90002140-18 = "그거, 안 그런 사람도 있지 않아……?"
90002140-19 = "[s] \"물론 정도의 차이는 있을 수 있지. 예외도 있을 거고.\""
90002140-23 = "[ns3] \"하지만 '유전자'라는 프로그램이 있는 한.\"\n[ns4] \"우리 역시 어떤 것들을, [ruby=만들어지면서부터]태어나면서부터[/ruby] 가지고 살아가는 거야.\""
90002140-26 = "[ruby=프로그램]유전자[/ruby]……!"
90002140-27 = "그리고 그렇지 못한 [ruby=유전자들]사람들[/ruby]은, 대부분 살아남지 못하고 처음부터 없었던 것처럼 사라져 갔었다고……?"
90002140-28 = "[ruby=생명]사람[/ruby]은, 그런 식으로 지금까지 스스로를 유지해 왔던 거니까……?"
90002140-30 = "[log]\"그러니까 중요한 것은 아마도,\"[/log]"
90002140-32 = "[log]\"누군가가 누군가를 사랑할 수 있다는 것.\"[/log]"
90002140-37 = "[log]\"너희가 언니를 사랑했다는 것, 그 사실 자체였을 거야.\"[/log]"
90002140-40 = "그 모든 것이, 처음부터 가짜였다고 해도요……?"
90002140-41 = "어차피 관점에 따라서는, 세상은 가짜로 이루어져 있는 법이니까……?"
90002140-42 = "우리가 강철대륙을 만든, 근본적인 이유요?"
90002140-43 = "그건…… 맞아요. 결국, 언니를 위해서였죠……."
90002140-44 = "네? 그러니까 어떤 부분에서는, 행동이 우리를 구원할지도 모른다고요?"
90002140-45 = "그것이 진실을 판별하는 하나의 기준이 될 수 있으니까……?"
90002140-46 = "[s5] \"언니를 위해서 강철대륙을 만들었잖아?\"\n[s6] \"그것이 너희의 어떤 부분을, 확실하게 증명했다고 생각해.\""
90002140-52 = "괜찮다고…… 말씀해, 주시는 건가요……?"
90002140-56 = "……세상 모두가 뭐라고 하더라도……."
90002140-57 = "선생님은, 우리가 최선을 다했다는 것을, 이제 알고 있으니까요……?"
90002140-58 = "하, 하지만 선생님 입장에서는, 우리가…… 여러 가지를 엉망으로 만든 것 아닌가요……?"
90002140-59 = "[s7] \"음! 나는 못된 어른이라서 말이지!\"\n[s8] \"예전에 들었던 말을, 되돌려주는 걸 좋아한단다!\""
90002140-63 = "[log]\"그건 그냥,[wa:500] 정보가 부족했던 것일 뿐이야.\"[/log]"
90002140-66 = "[log]\"그러니까,[wa:1000] 다시 하면 돼.\"[/log]"
90002140-69 = "!!!!!"
90002140-74 = "……그래. 아직 그렇게 할 수 있을 때."
90002140-75 = "더 늦기 전에 아직은, 되돌이킬 수 있을 때에……."
90002140-80 = "……."
90002140-81 = "울지 말아 주세요, 라고 아리스가 말할 자격은 없다는 것을 압니다."
90002140-82 = "당신들의 슬픔을, 아리스가 완전히 이해할 수는 없을 거라고 생각합니다."
90002140-83 = "하지만 적어도 같이 슬퍼할 수는 있을 거라고 생각합니다."
90002140-84 = "아리스도 선생님을 잃게 되면……."
90002140-86 = "케이나 모모이, 미도리, 유즈와 에이미, 토키, 히마리 선배와 리오 선배……."
90002140-87 = "그렇게 다른 누군가를 잃게 되면, 참을 수 없을 만큼 슬플 테니까요."
90002140-89 = "……하지만, 너라고 해서 우리에 대해 아직 잘 아는 건 아니잖아……."
90002140-90 = "맞습니다. 아리스는 아무것도 모릅니다."
90002140-91 = "아마도 아리스는, 다른 누군가의 슬픔을 있는 그대로……."
90002140-92 = "……그 사람과 똑같은 정도로 이해할 수는, 없을 겁니다."
90002140-93 = "그건 그냥 불가능한 일이니까요. 아리스에게 주어지지 않은 기능이니까요."
90002140-94 = "그러니까 아리스는, 아리스에게 가능한 일을 하려고 합니다."
90002140-95 = "할 수 있는, 일이요……?"
90002140-96 = "네."
90002140-101 = "그러니까 아인, 소프, 오르."
90002140-106 = "아리스와, 친구가 되어 주세요."
90002140-110 = "치, 친구!?"
90002140-111 = "?!?!"
90002140-112 = "……!"
90002140-113 = "네. 아리스는, 당신들의 친구가 되고 싶습니다."
90002140-114 = "그렇게 해서, 당신들과 같이 슬퍼하게 해 주세요."
90002140-115 = "읏……!"
90002140-116 = "누군가가 울고 있을 때, 그 옆에서 가만히 함께 울어 주는 것만으로도."
90002140-117 = "그 사람은 슬픔을 이겨낼 힘을 얻게 되는 법이라고, 선생님께서 가르쳐 주셨습니다."
90002140-118 = "하지만, 언니는……."
90002140-119 = "네."
90002140-120 = "그래서 그것으로, 어떻게 해도 부족할 수밖에 없다면."
90002140-121 = "아무리 해도 아리스와 아리스의 친구들을 미워할 수밖에 없다면……."
90002140-122 = "그때는 그냥 그렇다고 이야기해 주세요."
90002140-127 = "(아아…….)"
90002140-129 = "당신들이 무엇을 느끼든, 아리스는 최선을 다해서."
90002140-130 = "그것을…… 받아들이려 노력할 테니까요."
90002140-131 = "아리스는, 기억하고 있습니다."
90002140-133 = "살아간다는 것은 고통이라고 이야기했던 것을, 아직 생생하게 기억하고 있습니다."
90002140-134 = "그리고 그 말은 분명, 맞는 부분이 있다고 생각합니다. 왜냐하면, 선생님이 가르쳐 주셨으니까요."
90002140-136 = "……."
90002140-137 = "내일은 아마도, 무언가를 잃을 날이고, 좋은 일보다 좋지 않은 일이 더 많이 일어날 날일 겁니다."
90002140-138 = "사람들이 이야기하는 것은 막연한 희망이지, 차갑고 묵묵하게 다가올 [ruby=내일]미래[/ruby]에 대한 것이 아닙니다."
90002140-142 = "……과거는 추억 속에서, 보통 아름답게 기억되지."
90002140-143 = "미래는 기대라는 착각 속에서, 보통 낙관적으로 다가오고."
90002140-144 = "현재는 그사이에 아주 얇게 존재하지만, 우리는 그것을 좀처럼 소유할 수 없어."
90002140-145 = "이런저런 것들을 배제하면, 생에서 남는 것은 고통뿐일지도 몰라. 너희들의 말처럼."
90002140-146 = "그렇지만, 그러니까 선생님은."
90002140-147 = "그걸 내버려둬서는 안 된다고, 가르쳐 주셨습니다."
90002140-148 = "그렇기 때문에 우리는 모두 행복해져야 한다고."
90002140-149 = "행복해지는 것으로…… 싸움을 계속해야 한다고요."
90002140-150 = "마치, 케이처럼요."
90002140-151 = "네, 네?!?!"
90002140-152 = "케이는 가장 먼저 싸우러 나가는, 아리스의 자랑스러운 친구입니다."
90002140-153 = "살아가면서 만나는 모든 이상한 것에게 화를 내고, 어떻게든 거기에서 벗어나려 애씁니다."
90002140-154 = "아리스도 그렇게 하고 싶습니다! 그런 의미에서 다시 한번, 케이는 정말로 좋은 친구입니다!"
90002140-155 = "……잔소리는 역시, 무섭지만요."
90002140-156 = "아니, 그건 다 제가 아리스가 잘되라고……."
90002140-157 = "끄앙! 바로 그런 부분입니다……."
90002140-158 = "하아……."
90002140-162 = "그리고 리오 선배는 준비하는 분이십니다."
90002140-163 = "나, 나?!"
90002140-164 = "네. 예상할 수 있는 모든 가능성과, 예상할 수 없는 또 다른 가능성에 대비하고."
90002140-165 = "어떻게든 자기가 할 수 있는 일을 찾으려 하는 분입니다."
90002140-166 = "그 과정에서 무언가가 꺾이거나 실패해도, 절대로 포기하지 않고."
90002140-167 = "가끔은 스스로를 내던지면서까지 최악이 아닌 선택지를 고르려 합니다."
90002140-168 = "아리스는…… 그런 분들이 곁에 계셔 주어서, 정말로 다행이라고 생각합니다."
90002140-169 = "케이도, 리오 선배도. 그리고 아리스가 아는 모두."
90002140-170 = "물론 당연하게도, 선생님도요."
90002140-171 = "그러니까 아리스는 포기하지 않을 겁니다."
90002140-172 = "절대로, 절대로 포기하지 않을 겁니다. 아리스는 그것을 배웠습니다."
90002140-173 = "네. 아리스는 무슨 일이 있어도 [ruby=싸움]행복[/ruby]을 멈추지 않을 겁니다."
90002140-174 = "……그리고 그와 완전히 같은 정도로, 아리스는 당신들과 친구가 되고 싶습니다."
90002140-175 = "친, 구……."
90002140-176 = "그렇습니다. 아리스는 아직 견습 용사입니다."
90002140-177 = "모자라고, 부족하고, 모든 것이 약하기만 해서 스스로 슬퍼질 때도 있습니다."
90002140-178 = "그렇지만 곁에 있는 분들께 손을 내미는 것만은, 언제까지든 멈추지 않을 겁니다."
90002140-179 = "그것이 아리스가 할 수 있는, 지금 여기에서의 최선이니까요."
90002140-180 = "기억하시나요, 선생님? 인생에 그렇게까지 큰 의미나 목적이 있을 필요는 없다고, 아리스에게 말씀해 주신 것을요."
90002140-184 = "[ns] \"응……. 그랬지.\""
90002140-185 = "하지만, 그건, 어째서……?"
90002140-186 = "왜냐하면, 그런 것이 존재한다면, 그걸 찾지 못한 인생은 모두 틀린 것이 되어 버릴 테니까요."
90002140-187 = "……."
90002140-188 = "그건 어딘가 잘못되었다고 생각합니다. 그런 건 너무 슬프니까요. 비참하니까요."
90002140-189 = "직업이나 스킬 트리가 하나뿐인 게임은, 그냥 망겜입니다. 기획 단계에서부터 밸런스 조절에 실패해 버린 겁니다."
90002140-190 = "아리스는 아리스가 비참해지고 싶지 않은 만큼, 다른 누군가가 비참해지는 것도 보고 싶지 않습니다."
90002140-192 = "사람은 누군가 행복해하는 모습을 보며, 자기도 행복한 기분을 느낄 수 있고."
90002140-197 = "누군가 고통스러워하는 모습을 보며, 자기도 고통에 공감할 수 있습니다."
90002140-199 = "……그런 건 보통, 위선이야. 착각이라고."
90002140-201 = "어떻게 사람이 다른 누군가의 마음을 이해할 수 있단 말이야."
90002140-202 = "네. 분명히 그렇겠지요."
90002140-203 = "그렇지만 그 정도면, 아리스는 우리가 충분히 서로를 지탱해 주며 살아갈 수 있다고 생각합니다."
90002140-204 = "선생님이 아리스와 케이와 리오 선배, 그리고 다른 모두를 만나서 다행이었다고……."
90002140-205 = "행복했다고, 이야기해 주신 것처럼."
90002140-206 = "아리스는 이렇게 당신들과 만나서 이야기할 수 있었다는 것이, 그 자체로 기쁩니다."
90002140-207 = "그러니까, 다시 부탁드릴게요. 친구가 되어 주세요."
90002140-208 = "그렇게 말해 준다면, 아리스는 정말로 행복할 겁니다."
90002140-209 = "그리고 아리스가 행복한 만큼, 당신들 역시 행복했으면 합니다."
90002140-210 = "[ruby=싸움]행복[/ruby]이야말로, 우리가 절대 멈출 수 없는, 우리에게 있어 가장 중요한 것들 중 하나일 테니까요."
90002140-215 = "……알았어요. 그것은, 왕녀의 말이군요."
90002140-216 = "네, 네?! 아닙니다! 아리스는 왕녀 같은 게 아닙니다! 아리스는 그저 아리스일 뿐이고……."
90002140-220 = "네, 네에. 그것도, 무슨 말인지 알겠어요. 그, 그리고 그게 맞겠지만……."
90002140-221 = "응. 여기에서 우리가 이야기하는 왕녀의 말이란, 말 그 자체가 갖는 힘을 뜻하는 거야."
90002140-222 = "듣는 쪽이, 자기도 모르는 사이에 귀를 기울이게 되는……."
90002140-223 = "외부로부터 주어진 것이 아니라, 그 안에서 스스로 생겨나는 권위를 말하는 거지."
90002140-224 = "그렇기에 어떤 의미에서 절대적인 힘을 갖고 있는 말이기도 하죠."
90002140-225 = "그, 그렇지만…… 행복, 일까요……. 그것이 무엇인지…… 저희는 아직 솔직히, 자, 잘 모르겠어요."
90002140-226 = "……남아 있는 행복 같은 개념이, 아직 있을지도 모르겠고."
90002140-227 = "그것이 우리에게 손을 내밀어 줄지도 알 수 없네요."
90002140-228 = "그, 그렇지만, 그렇지만……."
90002140-232 = "감사해요."
90002140-233 = "정말로…… 감사드려요."
90002140-240 = "아앗?!"
90002140-244 = "아인?"
90002140-250 = "큭, 다리가……!"
90002140-257 = "(넘어지려는 아이들을…… 어떻게든 잡아냈다!)"
90002140-262 = "선생, 님……?"
90002140-263 = "아~아. 이제 남은 기운마저 가져가시려는 건가."
90002140-264 = "그래요. 쓸모를 다한 도구는, 버려지기 마련이겠죠. 헷……."
90002140-265 = "……그게 무슨 말이죠?"
90002140-266 = "……어려운 이야기는 아니에요. 그저."
90002140-267 = "예언자들도 우리도, 이렇게 되기 위한 도구였을 뿐이니까."
90002140-268 = "그리고 이제 그 목적이 달성되었으니……."
90002140-269 = "그러면 너희들에게는…… 무슨 일이 일어나는 건데?"
90002140-270 = "그, 그분께서는, 신으로서…… 키보토스에 강림하실 거예요."
90002140-271 = "어, 어라……? 이 이야기, 저희가 했던가요……?"
90002140-272 = "우리도, 강철대륙도 결과적으로는 그렇게 되기 위한 재료 같은 것이었으니까."
90002140-273 = "잘은 모르겠지만, 이대로 기능이 정지되거나 흡수되거나 분해되는 거 아닐까요? 그렇게 생각하고 나니 뭔가 웃기네요."
90002140-277 = "……."
90002140-278 = "그, 선생님. 역시……."
