[translation]
1201-1 = "Cleaning&Clearing"
1201-2 = "밀레니엄 캠퍼스 거리"
1201-3 = "(C&C의 로고가 새겨진 트럭이 밀레니엄의 거리 한쪽 구석에 세워져 있다.)"
1201-11 = "흠흠흠~♪~♬"
1201-12 = "……."
1201-13 = "……."
1201-18 = "흠흠흠~♪ 흠흠~♬"
1201-19 = "……."
1201-20 = "하아……. 어이가 없구만."
1201-21 = "……선배. 구경만 하지 말고 선배도 좀 쓸어."
1201-22 = "너희나 실컷 해라~. 아주 즐거워 보이네."
1201-23 = "그게 재밌냐? 잘도 군말없이 계속 하고 있잖아."
1201-24 = "네? 이거라면……? 지금 이 청소요?"
1201-25 = "당연하지. 깨끗해지면 보기 좋잖아. 선배야말로 뭐가 문제인지 모르겠는걸."
1201-26 = "……됐다."
1201-27 = "하아……. 어쩌다가 내가 이런 짓까지 하고 앉아 있는 건지 정말……."
1201-28 = "야, 야. 저기 봐. C&C야. 청소하고 있네."
1201-29 = "……?"
1201-30 = "C&C……? 아, 그러네. 그게 왜? 청소 동아리가 청소하고 있는 게 이상해?"
1201-31 = "뭐? 혹시 진짜 몰라서 묻는 말이야? 저거 전부 다 위장이잖아."
1201-32 = "……."
1201-33 = "……위장? 무슨 위장?"
1201-35 = "그……. 뭐라고 할까. 실은 막 높으신 분들의 의뢰를 받는 특수 요원 같은……."
1201-37 = "아~이, 진짜! 뭐가 그리 재밌다고 떠들어? 무슨 구경 났어? 앙!?"
1201-38 = "히, 히익!"
1201-42 = "어머나……."
1201-43 = "도망쳤다. 선배가 쫓아낸 거야."
1201-44 = "환경미화 동아리로서의 이미지는 또 한 번 물 건너 간 느낌이네요……."
1201-45 = "시끄러워."
1201-49 = "야호-! 이것 봐라, 여기에도 먼지 많다! 내가 찾은 거야, 이건!!"
1201-50 = "넌 또 왜 거기 있어!? 난간 위까지 올라갈 필요는 없잖아!?"
1201-51 = "빨리 내려오라고! 그러다가 그 녀석 와서 또 괜한 소리라도 하면……!!"
1201-52 = "일들은 잘 하고 있어? C&C 여러분."
1201-53 = "……!"
1201-54 = "……!"
1201-55 = "……귀신도 부르면 온다더니……."
1201-60 = "……? 뭐, 뭐야? 갑자기 분위기가 왜 그래? 무슨 문제라도 있어?"
1201-61 = "그, 그럴 리가요. 분명 환영한다는 의미로 하신 말일 거예요. 부장님도."
1201-62 = "그럴 리가 없잖아."
1201-63 = "전혀 그래 보이지 않는 걸."
1201-64 = "……아하하……."
1201-65 = "게다가 환경미화 동아리라면서, 부장이란 분부터 저렇게 게으름을 피우고 있는데……."
1201-66 = "뭐야, 이젠 우리 청소 수준까지 감독하는 거야? 시비 걸러 왔어?"
1201-67 = "아니. 시비가 아니라 걱정이라고, 걱정. 대체 왜 사람 말을 그렇게 삐딱하게만 듣는 거야?"
1201-68 = "뭐, 방금 지나간 학생들 말 들어보면 그 위장이라는 것도 잘 안 되고 있는 거 같지만 말이야."
1201-69 = "……시비 걸러 온 거면 그냥 좀 사라져 주지, 그래……."
1201-70 = "미안하지만 그러지는 못하겠는 걸. 그리고 시비 걸러 온 것도 아니라고 이미 말했잖아."
1201-74 = "……자. 이것 좀 봐. 이게 뭐라고 생각해?"
1201-75 = "……음? 뭔가요? 영수증……?"
1201-76 = "그래. 영수증이야. 여러분이 저번 작전으로 부숴 먹은 학교 자재들에 대한 복구 비용이지."
1201-77 = "……으음."
1201-78 = "자, 봐! 이것 좀 보라고! 이 자릿수, 어떻게 생각해?"
1201-79 = "어머나……. 비용이 어마어마한 걸요. 그때 저희가 좀 심했나 보네요."
1201-80 = "으음. 하지만 외람된 이야기긴 하지만 유우카 씨. 저희 임무 활동에 대한 비용은 세미나에서 지급해 주시는 걸로……."
1201-81 = "응. 알고 있어. 당연히 알고 있지."
1201-87 = "……그러니까 이렇게 잔소리라도 하려고 찾아온 거잖아, 그렇지?"
1201-88 = "……!"
1201-89 = "……!"
1201-90 = "……."
1201-94 = "그렇게나……. 그렇게나 신신당부했는데……!"
1201-95 = "이번 작전은 비싼 기기가 많은 지역에서 하니까 주의해 달라고 내가 몇 번을 강조했는데!"
1201-99 = "그런데 아예 거길 폭탄으로 싹 날려 버리다니!"
1201-100 = "으음……. 좀 시끄럽긴 했나 보네요. 깔끔하게 한다고 한 거긴 한데."
1201-101 = "이런 식의 깔끔함을 말한 게 아니었잖아!?"
1201-102 = "부탁이니 매번 뒷정리를 해야 하는 이쪽 입장도 좀 생각해 달란 말이야."
1201-103 = "으음……. 죄송해요. 다음부터는 좀 더 신경 써서 진행하도록 할게요."
1201-104 = "……."
1201-105 = "……아냐. 나도 미안해. 방금은 조금 흥분했던 것 같네."
1201-106 = "뭐……. 그래도 여기가 가장 확실하니까."
1201-107 = "……그리고 그래서 말인데. 음……. 우선 장소부터 좀 옮길까?"
1201-108 = "……?"
1201-109 = "……?"
1201-110 = "응? 장소라니……. 설마 벌써 다음 의뢰인가요?"
1201-111 = "응. 내용이 내용인지라 당연히 브리핑은 여기서 못 하고……. 좀 안전한 곳에서 해줄게."
1201-112 = "그리고 누누이 말하지만……."
1201-113 = "이번에야말로 조용하고 깔끔하게 처리해 줘. 부탁이야, 알겠지? 조용하고 깔끔하게."
1201-115 = "아, 알았다고. 알았으니까 그만 말해. 거기서부턴 우리가 알아서 할 거야."
1201-116 = "……그 '알아서 한다'는 말이 제일 불안하긴 하지만……. 뭐, 어쩔 수 없지……."
1201-117 = "그럼 이번에도 잘 부탁하는 것으로……."
1201-120 = "(C&C의 임무가 끝난 이후, 업무보고서 한 통이 세미나로 날아들었다.)"
1201-121 = "으아아-?! 내가 못 살아~!!"
1201-122 = "Cleaning&Clearing"
