[translation]
1000509-1 = "아쿠아리움!"
1000509-2 = "아쿠아리움 입구"
1000509-3 = "으헤에- 여기가 아쿠아리움인가."
1000509-4 = "이 아저씨는 시골 사람이라 이런데는 낯설다고."
1000509-5 = "이것 봐, 팜플렛도 받았어."
1000509-6 = "열대어관이랑 심해어관, 먹이주기 체험관도 있대!"
1000509-7 = "흐음, 돌고래쇼도 있고…… 펭귄관도 있네. 여기는 춥겠지?"
1000509-8 = "이것봐, 선생! 바다터널이야!"
1000509-9 = "고래 상어도 있대! 고래 같은 건가……?"
1000509-10 = "오늘 하루만에 다 볼 수 있을까……. 음. 힘내야겠군."
1000509-11 = "그럼 어디부터 가볼까?"
1000509-13 = "(열대어 관, 심해어 관을 거쳐 바다터널관에 도착했다.)"
1000509-16 = "― 저게 고래라는 건가?"
1000509-20 = "― 헤에~ [wa:2300]굉장해. [wa:1500]이런 곳은 처음 와 봐."
1000509-23 = "― 저거 봐! [wa:1000]물고기야! [wa:1200]아하하하, [wa:500]귀여워!"
1000509-26 = "― ……."
1000509-29 = "― 나 혼자 [wa:2000]이렇게 즐거워도 되는 걸까……."
1000509-32 = "― 괜한 걱정이라고? [wa:5000]그럴까나."
1000509-35 = "(이후, 먹이주기 체험관, 해파리관, 바다거북관, 굿즈샵까지 아쿠아리움의 이곳 저곳을 돌아다니며 잔뜩 즐겁게 놀았다.)"
1000509-37 = "……하아. 즐거웠어."
1000509-38 = "아귀 먹이 주기 체험이 완전 웃겼어. 아하하. 입이 엄청 컸어."
1000509-39 = "야광 해파리들도 멋졌고. 형광 조명이 엄청 어지러웠지."
1000509-40 = "바다 터널도 엄청 크고 대단했어. 하아."
1000509-41 = "기념품도 이렇게 잔뜩 사버렸네. 으헤헤헤."
1000509-42 = "완전 녹초가 될 때까지 놀아서, 집에가면 분명 뻗어서 24시간은 자버릴 거 같아."
1000509-43 = "[s1] \"늦잠은 안돼.\"\n[s2] \"학교는 가야지.\""
1000509-44 = "으헤헤. 노력해볼게, 선생!"
1000509-45 = "으헤헤. 노력해볼게, 선생!"
1000509-46 = "자, 그럼 슬슬 돌아가볼까? 하루종일 돌았는데도 못 본 곳이 있다니, 뭔가 아쉽지만 말야."
1000509-47 = "뭐, 힘내서 다음에 또 오면 되니까. 그치?"
1000509-48 = "[s3] \"그래.\"\n[s4] \"다음에 또 오자.\""
1000509-51 = "으헤. 다음 번엔 내가 초대할 테니까, 기대하고 있어도 좋아, 선생!"
1000509-53 = "(약간 지쳤지만 즐거워하는 호시노와 함께 집으로 돌아갔다.)"
