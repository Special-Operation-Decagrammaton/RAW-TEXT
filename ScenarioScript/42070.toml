[translation]
42070-1 = "제7화;쿠데타"
42070-2 = "(그로부터 몇 시간 전…… 키보토스 총학생회 회의실.)"
42070-5 = "……이어지는 다음 안건은 재난 상황을 틈타 내란을 일으키고, 총학생회의 권한을 탈취하려 한 카이저 코퍼레이션과 그 경영진들에 대한 처벌 수위를 결정하는 사안입니다."
42070-6 = "본래대로라면 총학생회와 행정위원회가 정상화된 시점에서 가장 우선하여 처리할 사안이었습니다만……"
42070-7 = "……지난 사태로 인해 D.U.의 통신과 물류 시설이 다수 파괴되었기에, 시민들의 안전과 편의를 위해 D.U. 복구 사업을 우선하다 보니 해당 사안의 논의는 유보되었습니다."
42070-11 = "……부연 설명 감사합니다."
42070-12 = "말씀주신 대로 카이저 코퍼레이션은 지난 사태 때 사병을 이끌고 총학생회를 습격. 생텀 타워의 권한을 탈취하여 그 능력으로 자신들이 발굴한 초고대 병기를 운용하려 했습니다."
42070-13 = "다행히 샬레의 선생님과 각 자치구의 학생회 임원 여러분께서 도와주신 덕분에 사태가 악화되는 것을 막을 수 있었습니다만……"
42070-14 = "……이들을 막지 못했더라면 총학생회는 물론이고 키보토스 그 자체가 붕괴했을지도 모르는 일이지요."
42070-15 = "이 모든 시도는 카이저 코퍼레이션이 방산부터 물류까지 통제 가능한 초거대 기업이기 때문에 가능한 일이었습니다."
42070-16 = "다시는 이와 같은 시도를 할 수 없도록, 저는 카이저 코퍼레이션과 그 경영진에게 최고 수위의 처벌을 적용함이 마땅하다고 생각합니다."
42070-20 = "잠시만요. 카이저 코퍼레이션이 사병을 동원해 총학생회를 무력으로 점거한 것은 사실이지만……"
42070-21 = "그들이 쉽게 생텀 타워에 진입할 수 있었던 건 직전에 린 행정관이 독단으로 비상대책위원회를 열어 총학생회를 혼란에 빠트린 탓도 있지 않나요?"
42070-23 = "하, 하지만 그날 저희들이 자리를 비운 건 린 선배의 문책 결의안 때문에……"
42070-24 = "게다가 카이저 코퍼레이션이 발굴한 그 초고대 병기에 린 행정관이 탑승하고 있는 모습을 보았다는 증언도 있는데……"
42070-25 = "……사실은 린 행정관이 카이저 코퍼레이션과 짜고 연기를 했을 가능성도 있지 않나요?"
42070-26 = "그, 그런 말도 안 되는 음해를……"
42070-27 = "……사건의 이해 당사자인 저를 의심하실 수 있다는 것 또한 충분히 이해하고 있습니다."
42070-28 = "이번 사태에 대한 책임 결의안이 채택되고 카이저 코퍼레이션에 대한 조사가 시작된다면, 저 역시 조사에 성실히 임할 것을 약속드리도록 하겠습니다."
42070-30 = "(소근) 저기…… 아오이 선배, 이 회의 몇 시간이나 계속되는 거야? 우리 점심도 거르지 않았어?"
42070-31 = "개회로부터 막 8시간 32분 15초가 지난 시점이네."
42070-32 = "하지만 안건은 앞으로 3개 정도 더 남았으니까. 점심은 아까 나누어 준 주먹밥 정도로 참도록 해."
42070-33 = "마라톤 회의 정도야 행정위원회에서는 특별한 일도 아니잖아?"
42070-35 = "주먹밥? 난 그런 거 받은 적 없는데……?"
42070-37 = "애초에 샬레의 선생님에게 초법적인 권한을 전달한 것도 린 행정관 아닌가요?"
42070-38 = "아무리 총학생회장이 남긴 메모에 그 내용이 쓰여 있었다 하지만, 저희는 그 메모가 진짜인지도 확인하지 못했는데……"
42070-39 = "그 메모는 총학생회장이 남긴 것이 분명합니다."
42070-40 = "필요하시다면 필적 검사를 통해 진위를 확인할 수도—"
42070-41 = "수석행정관, 모든 일에는 순서와 절차가 있는 법입니다!"
42070-42 = "아무리 총학생회장 대행이라지만 행정위원회의 결정을 무시하는 행태는 더는 두고 볼 수 없습니다!"
42070-43 = "저는 언제나 규정과 절차대로 문제를 해결하고 있습니다만……"
42070-45 = "(소근) 저기, 스모모…… 넌 주먹밥 받았어?"
42070-46 = "하암…… 난 졸려서 주먹밥 같은 건 안 먹을래……"
42070-47 = "아니, 그러니까 너 말고 내 몫의 주먹밥을 말하는 건데……"
42070-49 = "게다가 카이저 코퍼레이션은 키보토스에서 손꼽히는 거대 기업입니다. 이들이 기업 활동을 멈춘다면 지난 사태 이상의 혼란이 생길지도 모릅니다."
42070-50 = "카이저 인더스트리, 카이저 컨스트럭션, 카이저 컨비니언스…… 이 모든 기업이 동시에 파산하기라도 한다면 실업자가 폭등하겠지요."
42070-51 = "그 책임은 누가 지는 건가요, 행정관?"
42070-52 = "……카이저 코퍼레이션의 영향력을 생각한다면 이쯤에서 적당히 벌금을 청구한 뒤 정리하는 것도……"
42070-54 = "저기, 모모카…… 넌 배 안고파?"
42070-55 = "뭐야, 그런 눈으로 쳐다봐도 이 명란 감자칩은 안 나눠줄 거거든?"
42070-56 = "배가 고프면 남의 감자칩에 손댈 생각 말고 나눠준 주먹밥이나 먹든가. (와작와작)"
42070-58 = "아니, 그러니까 나는 주먹밥을 받은 적이 없다니까?!"
42070-62 = "……아무래도 현시점에서 논의를 이어가는 건 어렵겠군요."
42070-63 = "수석 행정관. 다들 생각할 시간이 더 필요할 것 같으니, 오늘은 여기서 마무리하시고 나중에 다시 논의를 재개하시는 건 어떠신가요?"
42070-64 = "……알겠습니다."
42070-65 = "오늘은 시간이 늦었으니 본 회의는 폐의하고 내일 속행하도록 하지요."
42070-66 = "모두 수고 많으셨습니다."
42070-74 = "휴우……"
42070-75 = "예상은 했지만 생각보다…… 이야기가 쉽지 않네요."
42070-79 = "수고 많으셨습니다, 수석 행정관."
42070-80 = "아, 방위실장."
42070-81 = "방위실장도 수고 많으셨습니다."
42070-82 = "그보다 이렇게 폐의 뒤에 찾아오셨다는 것은…… 개인적으로 하고 싶으신 말씀이라도?"
42070-83 = "아뇨. 그저 방금 회의에서 정말 고생이 많으셨다는 이야기를 전달 드리고 싶었을 뿐이에요."
42070-84 = "별말씀을."
42070-85 = "……아까도 느낀 것이지만 정말 다들 너무하네요."
42070-86 = "행정관에 대한 풍문을 공적인 자리에서 들먹이는 것은 물론이고, 다들 저가 하고 싶은 이야기만 하고 있으니……"
42070-87 = "여러 사람의 의견을 취합하여 결정하는 지도자의 책무란, 정말 쉽지 않은 일이네요."
42070-88 = "어쩔 수 없지요. 일이 이렇게 된 데에는 제 책임도 있으니."
42070-89 = "시간이 걸리더라도 꾸준히 노력하여 임원들을 설득하는 수밖에요."
42070-90 = "……굳이 임원들의 동의를 구하실 필요가 있으신가요?"
42070-91 = "당신은 통괄실의 수석행정관이기도 하지만, 공석인 총학생회장의 자리를 대행하는 자."
42070-93 = "총학생회장 대행의 권위를 내세워 임원들을 굴복시킨다면 좀 더 일을 쉽게 처리하실 수 있으실 텐데요."
42070-94 = "권위라……"
42070-95 = "그것은 독이 든 성배와도 같습니다, 방위실장."
42070-96 = "처음에는 편리한 전가의 보도처럼 여겨지겠지만, 쓰면 쓸수록 그 가치를 잃게 되지요."
42070-97 = "제 의견과 다르다고 해서 권위를 내세워 타인을 억압할 수는 없습니다."
42070-98 = "애초에 저도…… 제 자신에 대한 확신이 들지 않는데……"
42070-99 = "하아……"
42070-101 = "………역시 당신은 총학생회장 대행의 자격이 없어요."
42070-105 = "…………."
42070-106 = "……이게 무슨 행동이죠, 방위실장?"
42070-109 = "린, 저는 예전부터 당신이 마음에 들지 않았어요."
42070-110 = "총학생회장과 닮은 부분이라고는 조금도 없으면서, 그녀의 총애를 독차지하기나 하고……"
42070-111 = "총학생회장이 사라진 이후에도 그녀의 그림자에 눌려 사람들의 의견을 귀담아듣고 절차대로 일을 진행하려 하다니……"
42070-112 = "그런 중우정치 같은 방법으로는 아무것도 해결하지 못합니다."
42070-113 = "키보토스는 [ruby=총학생회장] 초인 [/ruby]에 의해 지휘되어야 합니다."
42070-114 = "……총학생회장은 현재 실종 상태입니다, 시라누이 실장."
42070-115 = "그리고 그 자리를 지키는 건 수석행정관인 제 역할입니다."
42070-117 = "어머나, 그런가요."
42070-118 = "사실은 지난번 사태 때, 샬레의 지하실에서 흥미로운 문서를 하나 찾았거든요."
42070-120 = "그동안 세간에 단 한 번도 공개된 적 없는, 총학생회장의 비밀 서한을."
42070-121 = "비밀 서한……?"
42070-122 = "이 서한의 내용에 따르면, 총학생회장은 유사시 수석행정관이 아닌 방위실장에게 대행 업무를 부탁하려고 했던 모양이더군요."
42070-123 = "다시 말해 총학생회장이 실종된 지금, 대행이 되었어야 할 사람은 [ruby=나나가미 린] 당신 [/ruby]이 아니라[ruby=시라누이 카야]   저   [/ruby]라는 뜻입니다."
42070-124 = "그게 무슨……"
42070-125 = "……그런데 이렇게 중요한 내용이 담긴 서한이 어째서 샬레의 지하실에 은밀히 숨겨져 있었던 걸까요?"
42070-126 = "총학생회장의 실종 당시, 샬레 건물의 출입권한을 지니고 있었던 건 나나가미 린 행정관뿐이었지요."
42070-127 = "그리고 이 문서가 공개되지 않아서 가장 큰 이득을 보는 사람 또한…… 나나가미 린 행정관이지요."
42070-128 = "그 문서가 정말로 총학생회장이 직접 작성한 서한이라는 증거가 있나요?"
42070-129 = "……필적 감정을 요청합니다. 그리고 그 서한이 총학생회장이 직접 작성한 것이라면 서명도—"
42070-130 = "물론 문서의 진위 확인은 중요합니다. 총학생회장실에 남겨져 있던 그 메모처럼 말이죠."
42070-131 = "하지만 이 시점에서 총학생회에 당신의 말을 믿어줄 학생이 몇이나 남아있을까요?"
42070-132 = "……설마."
42070-137 = "나나가미 린 행정관. 당신을 공문서 은닉 및 직권 남용 혐의로 긴급 체포합니다."
42070-138 = "총학생회 임원 규정 제78조에 의거, 총학생회장 대행의 직무는 조사가 끝날 때까지 자동으로 정지됩니다."
42070-139 = "……서한의 내용이 진실인지는 둘째치더라도, 아무래도 당분간은 새로운 총학생회장 대행이 필요하겠군요."
42070-140 = "……처음부터 당신이 꾸민 일이었군요."
42070-141 = "총학생회장이 돌아온다면 용서받지 못할 겁니다."
42070-142 = "그분이 돌아오신다면 오히려 상황을 여기까지 방치한 당신을 더욱 한심하게 여기실 거예요."
42070-143 = "………"
42070-144 = "그럼 여러분, 수석행정관을 기숙사까지 정중히 모신 후 감시 부탁드립니다."
42070-145 = "네, 방위실장님!"
42070-154 = "……인재자원실장. 현재 총학생회 건물 주변에서 진행되고 있는 시위는 잘 통제되고 있나요?"
42070-155 = "아, 안 그래도 연락하려던 참이었어."
42070-156 = "최근 있었던 공공시설에서의 사고, 그리고 교통실과 조정실의 미온적인 대처를 이유로 시위대를 잔뜩 준비시켰지."
42070-157 = "처음에는 일당을 주고 고용하려고 했는데, 어찌 된 영문인지 시위라면 자원해서라도 하겠다고 나서기 시작해서……"
42070-158 = "역시 우리 모교의 학생들이라서 그런가. 이런 쪽의 일 처리는 확실하더라고."
42070-159 = "게다가 방위실장이 전해준 정보도 꽤 도움이 되었어."
42070-160 = "직접 사고 현장을 지켜본 게 아니라면 알기 어려운 정보도 잔뜩 있었는데, 이런 정보는 어떻게 다 얻어낸 거야?"
42070-161 = "……시위의 통제에 그 정보도 필요하신가요?"
42070-162 = "아, 아니…… 궁금한 건 아니지만……"
42070-163 = "여, 여하튼! 성난 학생들이 건물 앞에서 소란스럽게 시위를 하고 있으니, 파벌 싸움에 관심이 없는 중립파 임원들이라 하더라도 린 행정관에 대한 시선이 곱지는 않을 거야."
42070-164 = "불신임투표라도 하게 된다면 대부분이 이견 없이 찬성표를 던지겠지……"
42070-165 = "수고 많으셨습니다. 앞으로도 시위대의 통제에 대해서는 잘 부탁드리겠습니다."
42070-171 = "하이네, 각 체육 협회에 발송하기로 한 공문은 어떻게 되었나요?"
42070-172 = "부탁한대로 회의가 끝나자마자 바로 보냈어!"
42070-176 = "음…… 아니, 정확히 말하자면 바로는 아니지만……"
42070-177 = "회의가 끝나고 너무 배가 고파서 주방에 들러 뭐 좀 먹고 오기는 했지만……"
42070-178 = "……그런 사소한 것까지 보고할 필요는 없습니다."
42070-179 = "그래서 체육계의 동향은 어떤가요?"
