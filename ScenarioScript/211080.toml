[translation]
211080-1 = "제8화;트리거 해피 존"
211080-3 = "(광장 쪽이 뭔가 소란스럽다.)"
211080-4 = "[ns] \"저건…….\""
211080-7 = "나! 나! 내가 먼저 왔어! 번호표는?"
211080-12 = "확인 완료! 자, 1번이네~ 오늘의 1등이야!"
211080-16 = "번호표를 나눠줄 테니까! 다들 일렬로 줄 서!"
211080-20 = "으, 늦었다…… 저기, 나는 몇 번이야?"
211080-21 = "그대로 서 계시면 됩니다. 27번이군요."
211080-22 = "내 앞에 26명이나 있어? 줄이 길다고는 생각했지만……."
211080-23 = "금방 줄어들 겁니다. 그럼 선착순 30명 마감되었으니, 먼저 출발하겠습니다."
211080-24 = "다 같이, 그대로 앞으로 걸어가 주십시오."
211080-38 = "이렇게 다 같이 발맞춰 움직이는 것도 나름 재미있다니까."
211080-39 = "맞아. 처음에는 불편했는데, 지금은 나도 모르게 발을 맞추게 돼."
211080-40 = "난 곧 있으면 마일리지 꽤 모여. 너희는 얼마나 모았어?"
211080-43 = "뭐야, 저거……."
211080-44 = "다 같이 움직이고 있네. 뭐 하는 건가?"
211080-45 = "아, 너희는 아직 소식을 못 들었구나? 자, 여기 팜플렛!"
211080-49 = "엣? 이건……."
211080-54 = "……'사격도 마음대로, 폭탄도 마음대로? 뭐든지 할 수 있는 트리거 해피 존'?"
211080-55 = "'선도부로부터 자유로워지세요?'"
211080-56 = "뭐야, 이거. 이런 곳이 있었다고?"
211080-57 = "나도 가볼까?"
211080-58 = "마음대로 쏘고 터뜨릴 수 있다니, 아무튼 손해는 아니잖아?#n가봤는데 별로면 그냥 하던 대로 하면 되고!"
211080-69 = "오, 여기 맘에 드는데?!"
211080-70 = "그냥 바로 이용하면 되는 거야? 바로 쏴도 돼?"
211080-71 = "선착순 이용이야! 자, 이쪽에 일렬로 서달라고~! 먼저 온 순서대로!"
211080-77 = "앗, 뭐야! 내가 먼저 왔다고!"
211080-78 = "그럼 먼저 줄을 섰어야지, 왜 멀뚱멀뚱 있는 건데? 내가 먼저 줄 섰으니까 뒤로 가시든가!"
211080-79 = "뭐어? 그런 억지가 어디 있냐고! 규칙을 지켜!"
211080-80 = "아니, 무슨 규칙? 너 혼자만 지키는 규칙이라도 있는 거야? 어이가 없네!"
211080-81 = "어이, 이 녀석 봐! 분명 내가 먼저 왔는데 억지를 부리고 있어! 어떻게 좀 해줘!"
211080-85 = "어이, 거기. 새치기는 금지야. 순서를 지키라고."
211080-86 = "맨 뒤로 갈래, 아니면 순번대로 설래?"
211080-87 = "으…… 아, 알겠어. 순서대로 하면 되잖아."
211080-91 = "그래. 다 같이 순서를 지키면 더 빠르다고."
211080-93 = "[ns] \"생각보다 다들 규칙을 잘 따르네.\""
211080-95 = "선생님! 구경하고 있었구나!"
211080-101 = "어서 오십시오, 선생님."
211080-102 = "안녕~ 선생님!"
211080-103 = "야핫, 여기서는 자발적으로 우리가 만든 규칙을 잘 따라주고 있어. 놀라운 모습이지?"
211080-104 = "아, 맞다. 그리고 오늘은 큰 발표가 있을 거거든."
211080-105 = "마침 선생님이 와준 김에 해야겠다. 이번에도 도와줄 거지?"
211080-106 = "뭘 하면 되냐고?"
211080-107 = "이제까지랑 똑같아! 옆에 있어 주면 돼!"
211080-111 = "자, 여러분! 모두 재밌게 즐기고 계신가요?"
211080-112 = "네에~!"
211080-113 = "오늘은 여러분에게 중요한 소식을 전하고자 하는데요!"
211080-114 = "저희의 <트리거 해피 존>은, 더 좋은 환경을 제공하기 위해 앞으로는 정해진 시간만 운영하게 됩니다!"
211080-115 = "뭐라고? 아무 때나 올 수 없는 거야?"
211080-116 = "네, 그렇게 되겠지요!"
211080-117 = "이럴수가! 왜? 어째서?"
211080-118 = "그럼 굳이 여기까지 올 이유도 없잖아. 시간도 정해야 올 수 있다면……."
211080-119 = "그리고, 여러분의 성원에 힘입어 특별 이벤트 기간이 시작됩니다!#n마일리지를 2배로 적립할 수 있는 기회!"
211080-120 = "오옷! 정말이야?"
211080-121 = "안 그래도 조금만 더 모으면 신형 스코프로 교환할 수 있었는데!"
211080-122 = "아, 그래도 이용 시간이 제한되는 건 아쉽네."
211080-123 = "맞아. 그러다 갑자기 로켓이라도 날리고 싶어지면 어떻게 해?"
211080-124 = "이곳을 이용하는 사람들은 체감할 텐데? 선도부를 안 만난지 꽤 되지 않았어?"
211080-125 = "그건 그래. 여기서만 쏘고 터뜨리니까, 귀찮은 선도부랑 마주칠 일이 없잖아."
211080-126 = "후훗. 또 예전처럼 쫓고 쫓기면서 체포당하는 건 재미없지 않나요?"
211080-127 = "그것도 맞지…… 반성실에 가는 건 싫으니까."
211080-132 = "이제 여기서 누리는 자유의 맛을 잊지 못하게 되어버렸어."
211080-133 = "그런데 그것도 나쁘지 않을걸?"
211080-137 = "응? 뭐가?"
211080-138 = "하고 싶을 때 하지 않고, 참고 쌓아두다가 나중에 폭발시키는 거."
211080-139 = "으응?"
211080-140 = "그 있잖아, 알지? 간질간질한 그거. 욕구불만이 점점 쌓여가면서 터질랑말랑 하다가, 한 번에 펑~!! 하고 터뜨려 버리는 그런 거!"
211080-141 = "왜 이렇게 위험하게 들리지?"
211080-142 = "……"
211080-143 = "하지만 끌려! 매력적이야!!"
211080-144 = "야핫! 쾌감이란 언제나 얻을 수 있으면 오히려 가치가 없는 법이니까."
211080-145 = "참고 기다리고 인내하다가 비로소 그 과실을 얻어야 더욱 달콤한 법이지."
211080-147 = "듣고 보니 설득력이 있는걸."
211080-148 = "한번 참아보는 거 괜찮을지도 모르겠네."
211080-149 = "저기, 그럼 여기는 언제 이용할 수 있어?"
211080-153 = "자세한 설명은 제가 해드리지요. 자, 이쪽으로."
211080-155 = "(잠시 후……)"
211080-157 = "휴, 생각보다 더 수월하게 지나갔네!"
211080-158 = "고생했어, 선생님! 옆에 있어 주는 것만으로도 꽤 도움이 되었다고."
211080-159 = "그런데 왜 이용할 수 있는 시간을 제한했냐고?"
211080-160 = "일단은 관리하는 것도 일이니까. 우리도 언제까지 여기에 계속 있을 수는 없거든."
211080-161 = "그리고, 시간에 제한을 두자고 한 건 쇼코 쨩의 아이디어야~"
211080-162 = "선생님, 생각해 봐. 처음에는 아무 데서나 총을 쏘고, 폭탄을 터뜨리는 게 일상이었잖아?"
211080-163 = "그런데 이제는 굳이 여기까지 와서 스트레스를 해소하고 있다고. 벌써 익숙해진 거지!"
211080-164 = "그럼 이렇게 장소를 지키기 시작한 학생들이 시간까지 지키게 된다면 어떻게 될까?"
211080-168 = "게헨나에 규칙과 질서가 생기는 거야!!"
211080-169 = "그렇다면 함부로 날뛰는 학생들도 멋대로 하는 행동들도 계속해서 줄어들고, 위대한 게헨나로 한 걸음 더 나아가는 거지! 어때어때?"
211080-170 = "이런 식으로 천천히 규율과 통제에 익숙하게 만든다…… 끓는 물 속의 개구리처럼 말이지요."
211080-171 = "야핫! 그렇게 말하면 우리가 악당 같잖아. 쇼코 쨩도 가끔 보면 성격 나쁘다니까."
211080-172 = "뭐, 천천히 변화시킨다는 점에서는 그 비유가 맞을지도?"
211080-173 = "정말 특수한 경우가 아니고서야, 하루아침에 사람의 생각이 달라질 수는 없으니까요."
211080-174 = "단체 최면 같은 거라도 있으면 편하겠지만, 그런 게 있을 리가 없잖아! 와하핫!"
211080-175 = "그렇지요. 후후."
211080-176 = "아무튼 우리가 이렇게 열심히 활동하는 보람이 있다구."
211080-177 = "예전의 무질서하고 혼란스러웠던 게헨나도 이젠 안녕이라 이거야."
211080-178 = "그동안은 제멋대로 구는 학생들 덕분에 그동안 게헨나의 엄청난 잠재력이 잘 드러나지 않았지만!"
211080-179 = "이렇게 하나하나 통제와 질서를 따르도록 변화를 만들어 간다면, 곧 머지않아 어떤 학원보다 질서정연하고, 깔끔하고, 자랑스러운 학원이 될 테니까!"
211080-180 = "[s1] \"그런 게헨나라……\"\n[s2] \"잘 상상이 안 가는데…….\""
211080-183 = "에, 뭔가 미적지근한 반응이잖아."
211080-184 = "선생님은 게헨나가 더 위대해지는 게 싫은 거야?"
211080-185 = "[s3] \"아니, 전혀 그런 건 아닌데.\"\n[s4] \"뭐랄까…….\""
211080-188 = "정체성?"
211080-189 = "정체성은 만들어가기 나름이라고 생각하는데."
211080-190 = "전체를 보기보다는 학생 개개인의 가능성을 믿는 것도 괜찮다구?"
211080-191 = "글쎄! 그 말도 그럴듯하지만……."
211080-195 = "……우리의 가능성을 믿어준 거랑 같은 얘기?"
211080-196 = "……."
211080-197 = "모두가 같아지는 것이 위대해지는 길은 아니다?"
211080-198 = "그치만, 다 함께 같은 곳을 바라볼 수 있다면 좋은 거잖아? 게헨나는 지금까지 그게 안 됐다구."
211080-203 = "협동정신과 단체의식은 위대한 게헨나에게 반드시 필요한 소양입니다."
211080-204 = "그리고 여기 있는 학생들 그 누구도 강제로 온 사람은 없어."
211080-205 = "다들 자기 발로 온 거지. 재미있을 것 같아서, 친구들이 가니까, 호기심에 등등.#n일단 스스로 마음이 움직여야 하잖아?"
211080-206 = "우리는 절대 학생들에게 강요하지 않아. 강제적인 변화는 의미가 없으니까."
211080-213 = "[ns] \"그래. 내가 괜한 걱정을 한 걸지도.\""
211080-214 = "헤헤, 맞아! 선생님은 지금처럼 학생들을 응원해달라구."
211080-218 = "이제부터는 게헨나를 위해 내 목숨이라도 바칠 테니 다들 걱정 마."
211080-219 = "-라고 선생님은 생각했습니다."
211080-220 = "[s] \"그런 생각은 안 했는데요!\""
211080-221 = "쳇."
211080-222 = "아무튼, 우리가 할 일은 하나야!"
211080-223 = "게헨나를 다시금 위대하게!!"
211080-224 = "하나 된 게헨나를 위해!"
211080-229 = "(학생들이 더 좋은 방향으로 나아가고자 한다.)"
211080-230 = "(그 마음을, 어른으로서 돕는다.)"
211080-232 = "(지금은 그것에 최선을 다하자고 생각했다.)"
211080-234 = "다음화;기회"
