211080-39 = "ใช่ ตอนแรกฉันก็รู้สึกอึดอัดอยู่หรอก แต่ตอนนี้เผลอก้าวตามจังหวะโดยไม่รู้ตัวเลย"
211080-40 = "อีกไม่นานฉันก็จะมีไมล์สะสมเยอะแล้ว พวกเธอล่ะสะสมกันได้เท่าไรแล้ว?"
