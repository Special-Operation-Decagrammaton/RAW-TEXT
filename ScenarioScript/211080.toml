211080-53 = ""
211080-54 = "'ยิงก็ได้ตามใจ ใช้ระเบิดได้ตามใจ ทริกเกอร์ แฮปปี้ โซน ที่ทำได้ทุกอย่าง'?"
211080-55 = "'มาเป็นอิสระจากคณะกรรมการวินัยกันเถอะ'?"
211080-56 = "อะไรกัน มีที่แบบนี้ด้วยเหรอ?"
211080-57 = "ฉันก็ลองไปดูหน่อยดีมั้ยนะ?"
211080-58 = "ได้ยิง แล้วก็ระเบิดอะไรตามใจ ยังไงก็ไม่มีอะไรขาดทุนนี่นา?#nถ้าลองไปดูแล้วไม่เข้าท่า ก็แค่กลับไปทำแบบเดิมก็พอ!"
211080-59 = ""
211080-61 = ""
211080-68 = ""
211080-69 = "โอ้ ถูกใจที่นี่จังแฮะ?!"
211080-70 = "ใช้งานได้เลยเหรอ? ขอยิงเลยได้มั้ย?"
211080-71 = "มาก่อนได้ก่อนนะ! เอ้า มาเข้าแถวเรียงหนึ่งตรงนี้~! เรียงตามลำดับที่มาถึงนะ!"
211080-72 = ""
211080-73 = ""
211080-74 = ""
211080-75 = ""
211080-76 = ""
211080-77 = "อ๊ะ อะไรเนี่ย! ฉันมาก่อนนะ!"
211080-78 = "ถ้ามาก่อนก็ไปเข้าแถวก่อนสิ มัวยืนเหม่ออยู่ทำไมล่ะ? ฉันมาเข้าแถวก่อน งั้นเธอก็ไปต่อท้ายแถวสิ!"
211080-79 = "ว่าไงนะ? แบบนั้นมีที่ไหนกัน! ทำตามกฎสิ!"
211080-80 = "กฎอะไรกัน? มีกฎที่เธอตั้งเองแล้วทำตามอยู่คนเดียวหรือไง? เหลือเชื่อจริงๆ!"
211080-81 = "เฮ้ ดูยัยนี่สิ! ฉันมาก่อนชัดๆ แต่ยังจะมาเถียงข้างๆ คูๆ อีก! ช่วยจัดการอะไรสักอย่างที!"
211080-82 = ""
211080-84 = ""
211080-85 = "นี่ ตรงนั้นน่ะ ไปเข้าแถวตามลำดับเลยนะ ห้ามแซงคิว"
211080-86 = "จะไปต่อท้ายแถว หรือจะยืนตามลำดับ?"
211080-87 = "อึก... ขะ... เข้าใจแล้ว แค่ไปยืนตามลำดับก็พอแล้วนี่"
211080-88 = ""
211080-90 = ""
211080-91 = "ใช่ ถ้าทุกคนเข้าแถวตามลำดับก็จะเร็วกว่านะ"
211080-93 = "[ns] \"ทุกคนทำตามกฎกันดีกว่าที่คิดนะ\""
211080-94 = ""
211080-95 = "คุณครู! มาดูอยู่เหรอ!"
211080-96 = ""
211080-100 = ""
211080-101 = "ยินดีต้อนรับค่ะ คุณครู"
211080-102 = "สวัสดี~ คุณครู!"
211080-103 = "ยะฮ่า ที่นี่ทุกคนยอมทำตามกฎที่พวกเราตั้งขึ้นด้วยความสมัครใจเลยนะ น่าทึ่งใช่มั้ยล่ะ?"
211080-104 = "อ๊ะ จริงสิ แล้ววันนี้ก็จะมีเรื่องสำคัญจะประกาศด้วย"
211080-105 = "ไหนๆ คุณครูก็มาพอดี งั้นก็ประกาศเลยดีกว่า ครั้งนี้ก็จะช่วยเหมือนเดิมใช่มั้ย?"
211080-106 = "ถามว่าต้องทำอะไรงั้นเหรอ?"
211080-107 = "ก็เหมือนที่ผ่านมาเลย! แค่อยู่ข้างๆ ก็พอ!"
211080-108 = ""
211080-110 = ""
211080-111 = "เอาละ ทุกคน! กำลังสนุกกันอยู่ใช่มั้ยคะ?"
211080-112 = "สนุกสิ~!"
211080-113 = "วันนี้เรามีข่าวสำคัญจะแจ้งให้ทุกคนทราบค่ะ!"
211080-114 = "เพื่อมอบสภาพแวดล้อมที่ดียิ่งขึ้น ต่อจากนี้ <ทริกเกอร์ แฮปปี้ โซน> ของพวกเราจะเปิดให้บริการ#nเฉพาะในเวลาที่กำหนดเท่านั้น!"
211080-115 = "อะไรนะ? ต่อไปจะมาตอนไหนก็ไม่ได้แล้วเหรอ?"
211080-116 = "ค่ะ ก็จะเป็นแบบนั้นล่ะค่ะ!"
211080-117 = "ไม่จริงน่า! ทำไม? เพราะอะไรกัน?"
211080-118 = "งั้นก็ไม่มีเหตุผลต้องถ่อมาถึงที่นี่แล้วสิ ถ้าต้องดูเวลาก่อนถึงจะมาได้..."
211080-119 = "และด้วยแรงสนับสนุนของทุกคน ช่วงกิจกรรมพิเศษกำลังจะเริ่มขึ้นค่ะ!#nโอกาสสะสมไมล์เพิ่มเป็น 2 เท่า!"
211080-120 = "โอ้โฮ! จริงเหรอ?"
211080-121 = "อีกนิดเดียวก็จะสะสมไมล์ครบ แล้วเอาไปแลกกล้องเล็งรุ่นใหม่ได้แล้วแท้ๆ!"
211080-122 = "อ่า แต่การจำกัดเวลาใช้งานก็น่าเสียดายนะ"
211080-123 = "ใช่ แล้วถ้าจู่ๆ อยากยิงจรวดสักลูกขึ้นมาจะทำยังไงล่ะ?"
211080-124 = "คนที่ใช้สถานที่นี้น่าจะรู้สึกได้แล้วไม่ใช่เหรอ? ไม่ได้เจอคณะกรรมการวินัยมาพักใหญ่แล้วใช่มั้ย?"
211080-125 = "ก็จริง เพราะพวกเรายิงแล้วก็ระเบิดของกันอยู่แค่ที่นี่ เลยไม่ต้องเจอกับคณะกรรมการวินัยที่น่ารำคาญ#nนี่นา"
211080-126 = "ฮุฮุ ถ้าต้องกลับไปวิ่งไล่กันจนถูกจับเหมือนเมื่อก่อน ก็คงไม่สนุกใช่มั้ยคะ?"
211080-127 = "ก็จริงนะ... ฉันไม่อยากไปห้องสำนึกผิดหรอก"
211080-128 = ""
211080-130 = ""
211080-131 = ""
211080-132 = "ตอนนี้ฉันลืมรสชาติของอิสรภาพที่ได้จากที่นี่ไม่ลงแล้ว"
211080-133 = "แต่แบบนั้นก็ไม่เลวเหมือนกันนะ?"
211080-134 = ""
211080-136 = ""
211080-137 = "หืม? อะไรเหรอ?"
211080-138 = "การที่อยากทำแต่ไม่ได้ทำทันที แต่ต้องอดกลั้นเก็บสะสมเอาไว้ แล้วค่อยระเบิดออกมาทีหลังน่ะ"
211080-139 = "หืม?"
211080-140 = "ก็นั่นไง นึกออกใช่มั้ย? ความรู้สึกคันยุบยิบแบบนั้นน่ะ ปล่อยให้ความอัดอั้นค่อยๆ สะสมจนเกือบจะ#nระเบิด แล้วค่อยระเบิดตู้ม~!! ออกมาทีเดียว แบบนั้นไง!"
211080-141 = "ทำไมฟังดูอันตรายจัง?"
211080-142 = "..."
211080-143 = "แต่มันก็น่าดึงดูดดีนะ! ดูมีเสน่ห์มากเลย!!"
211080-144 = "ยะฮ่า! ความสะใจน่ะ ถ้าหาได้ทุกเมื่อก็ไม่มีคุณค่าหรอก"
211080-145 = "ต้องอดกลั้น เฝ้ารอ และอดทน จนในที่สุดก็ได้ลิ้มรสผลของมัน ถึงจะยิ่งหอมหวานไงล่ะ"
211080-146 = ""
211080-147 = "พอฟังแบบนี้แล้วก็มีเหตุผลเหมือนกันนะ"
211080-148 = "ลองอดทนดูสักครั้งก็อาจจะไม่เลวนะ"
211080-149 = "ถ้างั้น แล้วที่นี่ใช้งานได้ตอนไหนเหรอ?"
211080-150 = ""
211080-152 = ""
211080-153 = "เรื่องรายละเอียดเดี๋ยวฉันอธิบายให้เองค่ะ เชิญทางนี้เลยค่ะ"
211080-155 = "(ไม่นานหลังจากนั้น...)"
211080-157 = "ฮู่ว ผ่านไปได้ราบรื่นกว่าที่คิดอีกแฮะ!"
211080-158 = "เหนื่อยแย่เลยนะ คุณครู! แค่อยู่ข้างๆ ก็ช่วยได้เยอะเลยละ"
211080-159 = "ถามว่าทำไมถึงจำกัดเวลาใช้งานงั้นเหรอ?"
211080-160 = "อย่างแรกก็คือ การดูแลที่นี่ก็เป็นงานเหมือนกันน่ะ พวกเราจะเฝ้าอยู่ที่นี่ตลอดไปไม่ได้หรอก"
211080-161 = "อีกอย่าง การเสนอให้จำกัดเวลาน่ะเป็นไอเดียของโชโกะจังนะ~"
211080-162 = "คุณครู ลองคิดดูสิ ตอนแรกการยิงปืนกับจุดระเบิดที่ไหนก็ได้ตามใจชอบเป็นเรื่องปกติใช่มั้ยล่ะ?"
211080-163 = "แต่ตอนนี้ทุกคนกลับอุตส่าห์มาถึงที่นี่เพื่อคลายความเครียด ก็แปลว่าคุ้นเคยกันแล้วไง!"
211080-164 = "ถ้างั้น ถ้านักเรียนที่ยอมใช้สถานที่ที่กำหนด หันมาเริ่มใช้งานตามเวลาที่กำหนดด้วย จะเกิดอะไรขึ้นล่ะ?"
211080-165 = ""
211080-167 = ""
211080-168 = "เกเฮนน่าจะมีกฎและระเบียบขึ้นมาไง!!"
211080-169 = "ถ้าเป็นแบบนั้น ทั้งจำนวนนักเรียนที่อาละวาดไม่เลือกที่และพฤติกรรมตามอำเภอใจก็จะลดลงเรื่อยๆ แล้วพวกเราก็จะก้าวไปสู่เกเฮนน่าที่ยิ่งใหญ่ได้อีกขั้น! เป็นไง เป็นไง?"
211080-170 = "ค่อยๆ ทำให้พวกเขาคุ้นชินกับระเบียบวินัยและการควบคุม... เหมือนกบในน้ำที่กำลังเดือดยังไงล่ะคะ"
211080-171 = "ยะฮ่า! พูดแบบนั้น พวกเราก็ดูเหมือนตัวร้ายน่ะสิ โชโกะจังนี่บางทีก็นิสัยไม่ดีเลยนะ"
211080-172 = "แต่ก็นะ ถ้ามองในแง่ของการค่อยๆ เปลี่ยนแปลง คำเปรียบเทียบนั้นก็อาจจะตรงอยู่เหมือนกันนะ?"
211080-173 = "เพราะถ้าไม่ใช่กรณีพิเศษจริงๆ ความคิดของคนเราก็ไม่มีทางเปลี่ยนได้ภายในชั่วข้ามคืนค่ะ"
211080-174 = "ถ้ามีอะไรอย่างการสะกดจิตหมู่ก็คงสะดวกดี แต่ของแบบนั้นจะไปมีอยู่ได้ยังไงกัน! วะฮะฮ่า!"
211080-175 = "นั่นสิคะ ฮุฮุ"
211080-176 = "ยังไงก็เถอะ ที่พวกเราพยายามทำกิจกรรมกันหนักขนาดนี้ก็คุ้มค่าอยู่นะ"
211080-177 = "ถึงเวลาบอกลาเกเฮนน่าที่ไร้ระเบียบและสับสนวุ่นวายในอดีตแล้ว"
211080-178 = "ที่ผ่านมา เพราะพวกนักเรียนที่เอาแต่ทำตามใจตัวเอง ศักยภาพอันมหาศาลของเกเฮนน่าเลยไม่#nเคยปรากฏออกมาอย่างเต็มที่!"
211080-179 = "แต่ถ้าพวกเราค่อยๆ สร้างความเปลี่ยนแปลงทีละอย่าง ให้ทุกคนอยู่ภายใต้การควบคุม#nและปฏิบัติตามระเบียบ ในอีกไม่นานเกเฮนน่าก็จะกลายเป็นโรงเรียนที่มีระเบียบเรียบร้อย สะอาด#nและน่าภาคภูมิใจกว่าโรงเรียนไหนๆ!"
211080-180 = "[s1] \"เกเฮนน่าที่เป็นแบบนั้น...\"\n[s2] \"ครูนึกภาพแบบนั้นไม่ค่อยออกเลย...\""
211080-183 = "เอ๋ ปฏิกิริยาดูจืดๆ ยังไงก็ไม่รู้"
211080-184 = "คุณครูไม่ชอบที่เกเฮนน่าจะยิ่งใหญ่ขึ้นเหรอ?"
211080-185 = "[s3] \"เปล่า ไม่ใช่แบบนั้นหรอก\"\n[s4] \"จะว่ายังไงดีล่ะ...\""
211080-188 = "อัตลักษณ์เหรอ?"
211080-189 = "ฉันคิดว่าอัตลักษณ์น่ะ จะเป็นแบบไหนก็ขึ้นอยู่กับว่าเราค่อยๆ สร้างมันขึ้นมายังไงนะ"
211080-190 = "แทนที่จะมองแต่ภาพรวม การเชื่อในศักยภาพของนักเรียนแต่ละคนก็ดีเหมือนกันงั้นเหรอ?"
211080-191 = "ก็นะ! คำพูดนั้นก็ฟังดูมีเหตุผลอยู่ แต่ว่า..."
211080-192 = ""
211080-194 = ""
211080-195 = "หมายถึงเหมือนกับที่คุณครูเชื่อในศักยภาพของพวกเราน่ะเหรอ...?"
211080-196 = "..."
211080-197 = "การที่ทุกคนเป็นเหมือนกันหมด ไม่ใช่หนทางสู่ความยิ่งใหญ่?"
211080-198 = "แต่ว่า ถ้าทุกคนร่วมกันมองไปยังจุดหมายเดียวกันได้มันก็เป็นเรื่องดีไม่ใช่เหรอ? ที่ผ่านมาเกเฮนน่าทำแบบนั้นไม่ได้นี่นา"
211080-199 = ""
211080-202 = ""
