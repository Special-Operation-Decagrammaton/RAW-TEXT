211080-12 = "ตรวจสอบเรียบร้อย! นี่ไง คิวที่ 1 เลย~ คิวแรกของวันนี้เลยนะ!"
211080-13 = ""
211080-15 = ""
211080-16 = "เดี๋ยวเราจะแจกบัตรคิวให้! ทุกคนเข้าแถวเรียงหนึ่งนะ!"
