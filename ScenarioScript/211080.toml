211080-44 = "เดินกันเป็นกลุ่มเลย ทำอะไรกันอยู่น่ะ?"
211080-45 = "อ๊ะ พวกเธอยังไม่ได้ข่าวสินะ? เอาโบรชัวร์นี่ไปดูสิ!"
211080-46 = ""
211080-48 = ""
211080-49 = "เอ๋? นี่มัน..."
