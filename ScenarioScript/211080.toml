211080-159 = "\"Why did we limit the time,\" you ask?"
211080-160 = "This place takes a lot of upkeep. We can't have it open constantly."
211080-161 = "The restricted hours were Shouko's idea."
211080-162 = "Sensei, think about it! Before, the students were just shooting guns and setting off bombs anytime and anywhere!"
211080-163 = "But NOW they know that they can come here, out of their way, to relieve that stress in a more structured way. They've already gotten used to it!"
211080-164 = "And since we trained them all to respect space... What if we also happened to train them to respect TIME?"
211080-165 = ""
211080-167 = ""
211080-168 = "A wave of discipline and order is cresting on Gehenna!"
211080-169 = "Students will grow less impulsive, which means we'll be taking another step towards the glorious, unified Gehenna! What do you think?"
211080-170 = "Slowly acclimating them to discipline and control... Just like a frog in a boiling pot."
211080-171 = "Yaha! When you say it like that, it sounds bad! Shouko, you've got a pretty twisted imagination, you know."
211080-172 = "But she's right, aside from the whole \"getting boiled alive\" thing. We're working on gradual, manageable change."
211080-173 = "After all, a person's mindset doesn't change overnight...normally."
211080-174 = "Yeah, it's not like we have a mind-control ray or anything! Hahaha!"
211080-175 = "Right. Fufu. How silly."
211080-176 = "More and more, I see that our hard work is paying off."
211080-177 = "Say goodbye to the disorderly, chaotic, \"hot mess\" Gehenna."
211080-178 = "All those wild, misbehaving students were overshadowing Gehenna's incredible potential!"
211080-179 = "If we continue to introduce changes, to painlessly teach them how to adhere to rules and order, then this will become the most glorious academy in Kivotos!"
211080-180 = "[s1] \"I can't really imagine...\"\n[s2] \"Such a Gehenna...\""
211080-183 = "Eh, what's with that reaction? I thought you'd be cheering!"
