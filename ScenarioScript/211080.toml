211080-1 = "ตอนที่ 8;ทริกเกอร์ แฮปปี้ โซน"
211080-3 = "(ดูเหมือนทางจัตุรัสจะมีเรื่องวุ่นวายเกิดขึ้น)"
211080-4 = "[ns] \"นั่นมัน...\""
211080-5 = ""
211080-7 = "ฉัน! ฉัน! ฉันมาก่อน! แล้วบัตรคิวล่ะ?"
