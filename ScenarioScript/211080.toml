[translation]
211080-1 = "第8話;Trigger Happy Zone"
211080-3 = "（廣場那邊好像有點吵鬧）"
211080-4 = "[ns] 「那是……」"
211080-5 = ""
211080-7 = "我我我！我先來的！號碼牌呢？"
211080-8 = ""
211080-10 = ""
211080-11 = ""
211080-12 = "確認完畢！來，是1號～今天的第1名！"
211080-13 = ""
211080-15 = ""
211080-16 = "要發號碼牌了！大家排成一列！"
211080-17 = ""
211080-19 = ""
211080-20 = "嗚，來晚了……那個，我是幾號？"
211080-21 = "請就這樣繼續排隊。您是27號呢。"
211080-22 = "我前面還有26個人？雖然早就覺得隊伍很長了……"
211080-23 = "很快就會輪到您了。#n那麼前30名已經額滿，我們先出發了。"
211080-24 = "請大家就這樣一起往前走。"
211080-25 = ""
211080-27 = ""
211080-28 = ""
211080-29 = ""
211080-30 = ""
211080-31 = ""
211080-32 = ""
211080-34 = ""
211080-36 = ""
211080-38 = "像這樣大家一起踩著同樣的步伐走，其實也挺好玩的耶。"
211080-39 = "對啊。一開始覺得很彆扭，現在卻不知不覺就跟著踩起步伐了。"
211080-40 = "我的點數已經累積不少了耶。你們集了多少點啊？"
211080-42 = ""
211080-43 = "那是什麼啊……"
211080-44 = "大家一起在移動耶。是在做什麼啊？"
211080-45 = "啊，你們還沒聽說嗎？來，這是手冊！"
211080-46 = ""
211080-48 = ""
211080-49 = "咦？這是……"
211080-50 = ""
211080-52 = ""
211080-53 = ""
211080-54 = "「開槍隨你開，炸彈隨你炸？什麼都能做的Trigger Happy Zone」？"
211080-55 = "「從風紀委員會手中獲得自由吧？」"
211080-56 = "這是什麼啊。竟然有這種地方？"
211080-57 = "我也去看看吧？"
211080-58 = "可以隨便開槍、隨便引爆，怎麼想都不吃虧吧？#n去了覺得不怎麼樣，再照平常那樣鬧就好了！"
211080-59 = ""
211080-61 = ""
211080-68 = ""
211080-69 = "哦，我喜歡這裡耶！？"
211080-70 = "直接就能用嗎？馬上就可以開槍嗎？"
211080-71 = "先到先用哦！來，請在這邊排成一列～！照先來後到的順序！"
211080-72 = ""
211080-73 = ""
211080-74 = ""
211080-75 = ""
211080-76 = ""
211080-77 = "啊，什麼啊！是我先來的耶！"
211080-78 = "那你就該先排隊啊，幹嘛在那邊發呆？#n是我先排的，你去後面啦！"
211080-79 = "什麼？哪有這麼不講理的！給我守規矩！"
211080-80 = "不是，什麼規矩？難道有什麼只有你自己在守的規矩嗎？#n真是傻眼！"
211080-81 = "喂，你們看這傢伙！明明是我先來的，他卻在耍賴！快想想辦法啊！"
211080-82 = ""
211080-84 = ""
211080-85 = "喂，那邊那個。禁止插隊，要乖乖照順序來。"
211080-86 = "你是要去最後面，還是按照順序排好？"
211080-87 = "嗚……知，知道了啦。按照順序排就是了嘛。"
211080-88 = ""
211080-90 = ""
211080-91 = "這就對了。大家一起守順序，反而比較快。"
211080-93 = "[ns] 「大家比想像中還要守規矩呢。」"
211080-94 = ""
211080-95 = "老師！原來你在看啊！"
211080-96 = ""
211080-100 = ""
211080-101 = "歡迎光臨，老師。"
211080-102 = "嗨～老師！"
211080-103 = "呀哈，大家在這裡都會自動自發地遵守我們訂的規則。很厲害吧？"
211080-104 = "啊，對了。今天還有件大事要宣布哦。"
211080-105 = "剛好老師來了，就趁現在宣布吧。這次你也會幫忙吧？"
211080-106 = "你問要做什麼？"
211080-107 = "跟之前一樣！只要待在我旁邊就好了！"
211080-108 = ""
211080-110 = ""
211080-111 = "好，各位！大家都玩得開心嗎？"
211080-112 = "開心～！"
211080-113 = "今天我們有重要的消息要告訴大家！"
211080-114 = "為了提供更好的環境，往後「Trigger Happy Zone」將只在規定的時間內營業！"
211080-115 = "什麼？不能隨時來了嗎？"
211080-116 = "是的，就是這樣！"
211080-117 = "怎麼會這樣！為什麼？為什麼啊？"
211080-118 = "那就沒必要特地跑來這裡了啊。要是還得配合時間才能來……"
211080-119 = "還有，為了感謝各位的支持，特別活動期間即將開始！#n這是可以累積2倍點數的好機會哦！"
211080-120 = "哦哦！真的嗎？"
211080-121 = "正好！我只差一點就能換新型瞄準鏡了！"
211080-122 = "啊，不過使用時間有限制還是有點可惜。"
211080-123 = "對啊。那要是突然想射個火箭怎麼辦？"
211080-124 = "來這裡的人應該都有感覺吧？是不是已經好一陣子沒碰到風紀委員會了？"
211080-125 = "這倒是。只在這裡開槍、引爆的話，就不會碰上麻煩的風紀委員會了嘛。"
211080-126 = "呵呵。再像以前那樣被追著跑、最後被逮捕，不是很無趣嗎？"
211080-127 = "這倒是沒錯……我可不想被送去反省室。"
211080-128 = ""
211080-130 = ""
211080-131 = ""
211080-132 = "我已經忘不了在這裡享受到的自由滋味了。"
211080-133 = "不過，那樣其實也不壞哦？"
211080-134 = ""
211080-136 = ""
211080-137 = "嗯？什麼不壞？"
211080-138 = "就是想做的時候先不做，忍耐著累積起來，之後再一口氣爆發。"
211080-139 = "唔嗯？"
211080-140 = "你知道的嘛，就是那種心癢癢的感覺。#n欲求不滿越積越多，快要爆開的時候再一口氣「砰～！！」地炸開來！"
211080-141 = "怎麼聽起來這麼危險？"
211080-142 = "……"
211080-143 = "可是好吸引人！好有魅力！！"
211080-144 = "呀哈！快感要是隨時都能得到，反而就沒價值了。"
211080-145 = "忍耐、等待、熬到最後才終於嚐到的果實，才會更加甜美。"
211080-146 = ""
211080-147 = "聽你這麼一說，還挺有說服力的。"
211080-148 = "忍耐一次看看，說不定也不錯。"
211080-149 = "那個，所以這裡什麼時候可以用？"
211080-150 = ""
211080-152 = ""
211080-153 = "詳細內容就由我來為各位解說吧。來，請往這邊走。"
211080-155 = "（不久之後……）"
211080-157 = "呼，比想像中還要順利呢！"
211080-158 = "辛苦了，老師！光是待在旁邊就幫了很大的忙呢。"
211080-159 = "你問為什麼要限制使用時間？"
211080-160 = "一來是管理也很費工夫嘛。我們也不可能一直守在這裡。"
211080-161 = "還有，限制時間是翔子醬的主意哦～"
211080-162 = "老師，你想想看。一開始隨處開槍、引爆炸彈都是家常便飯吧？"
211080-163 = "可是現在大家都會特地跑來這裡紓解壓力，已經漸漸習慣了！"
211080-164 = "那麼，這些開始乖乖待在指定場地的學生，要是連時間也能遵守會怎麼樣呢？"
211080-165 = ""
211080-167 = ""
211080-168 = "格黑娜就會誕生規則與秩序！！"
211080-169 = "這樣一來，胡作非為的學生和任性的行為都會不斷減少，#n朝偉大的格黑娜更進一步！怎麼樣怎麼樣？"
211080-170 = "像這樣慢慢讓人習慣規律與管控……就如同溫水煮青蛙一般。"
211080-171 = "呀哈！這樣我們不就像壞人一樣了嗎？翔子醬有時候還真壞心耶。"
211080-172 = "不過就慢慢改變這點來說，這個比喻或許挺貼切的？"
211080-173 = "畢竟除非是非常特殊的情況，否則人的想法不可能一夕之間改變。"
211080-174 = "要是有集體催眠之類的東西就輕鬆了，不過怎麼可能有嘛！哇哈哈！"
211080-175 = "是啊。呵呵。"
211080-176 = "看來我們這麼努力活動，還是很有價值的呢。"
211080-177 = "現在我們要跟以前那個無秩序又混亂的格黑娜說再見了。"
211080-178 = "雖然一直以來，因為那些任性的學生，格黑娜驚人的潛力都沒能好好展現出來！"
211080-179 = "只要像這樣一點一點改變大家，讓大家遵從管控與秩序，#n要不了多久，格黑娜就會成為比任何學園都更井然有序、乾淨又令人驕傲的學園！"
211080-180 = "[s1] 「那樣的格黑娜啊……」\n[s2] 「實在很難想像……」"
211080-183 = "什麼嘛，反應怎麼這麼冷淡。"
211080-184 = "老師不希望格黑娜變得更偉大嗎？"
211080-185 = "[s3] 「不，完全不是那樣。」\n[s4] 「該怎麼說呢……」"
211080-188 = "特色？"
211080-189 = "我覺得特色是可以靠自己打造的啊。"
211080-190 = "比起看整體，相信每個學生的可能性也不錯？"
211080-191 = "這個嘛！雖然聽起來也很有道理……"
211080-192 = ""
211080-194 = ""
211080-195 = "……就跟你相信我們的可能性一樣？"
211080-196 = "……"
211080-197 = "大家都變得一樣，並不是變偉大的唯一道路？"
211080-198 = "可是，如果大家能一起望向同一個地方不是很好嗎？#n現在的格黑娜就一直做不到這點。"
211080-199 = ""
211080-202 = ""
211080-203 = "協同精神與團體意識，是偉大的格黑娜必備的素養。"
211080-204 = "而且這裡的學生，沒有任何一個人是被強迫來的。"
211080-205 = "大家都是自己來的。因為覺得好玩、因為朋友要去、因為好奇等等。#n畢竟得先自己動心才行吧？"
211080-206 = "我們絕對不會強迫學生。強迫來的改變是沒有意義的。"
211080-208 = ""
211080-209 = ""
211080-210 = ""
211080-211 = ""
211080-212 = ""
211080-213 = "[ns] 「是啊。或許是我多操心了。」"
211080-214 = "耶嘿嘿，沒錯！老師只要像現在這樣替學生們加油就好了。"
211080-215 = ""
211080-217 = ""
211080-218 = "從今以後我願意為格黑娜奉獻生命，大家都不用擔心。"
211080-219 = "──老師是這麼想的。"
211080-220 = "[s] 「我才沒那樣想！」"
211080-221 = "呿。"
211080-222 = "總之，我們要做的事只有一件！"
211080-223 = "讓格黑娜再次偉大！！"
211080-224 = "為了團結一致的格黑娜！"
211080-225 = ""
211080-226 = ""
211080-227 = ""
211080-228 = ""
211080-229 = "（學生們想朝著更好的方向前進）"
211080-230 = "（身為大人，要支持他們的這份心意）"
211080-232 = "（決定現在要為此全力以赴）"
