211080-21 = "ไม่เป็นไรค่ะ ยืนรอตรงนั้นได้เลย ได้คิวที่ 27 ค่ะ"
211080-22 = "ก่อนหน้าฉันมีตั้ง 26 คนเลยเหรอ? ก็คิดอยู่หรอกว่าแถวยาว แต่ว่า..."
211080-23 = "เดี๋ยวก็ลดแล้วค่ะ เอาละ ครบ 30 คนแรกแล้ว ขอเริ่มก่อนเลยนะคะ"
211080-24 = "ทุกคน เดินตรงไปข้างหน้าเลยค่ะ"
