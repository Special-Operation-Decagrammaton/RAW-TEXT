211080-190 = "I should support the potential of \"each individual student rather than the whole academy\"? Uh..."
211080-191 = "Maybe! That sounds plausible, but..."
211080-192 = ""
211080-194 = ""
211080-195 = "...We're all part of a whole. It's \"our\" potential, isn't it?"
211080-196 = "..."
