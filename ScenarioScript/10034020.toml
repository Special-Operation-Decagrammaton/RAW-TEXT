[translation]
10034020-1 = "제2화;밴드에서 제일 중요한 것?"
10034020-4 = "\"Q. 밴드에 필요한 건 무엇일까요?\""
10034020-7 = "음……? 갑자기 무슨 소리야?"
10034020-8 = "밴드에 필요한 거? ……악기?"
10034020-9 = "우선 장소…… 아닐까요? 연습도 해야 하고, 사람도 모아야 하고……."
10034020-10 = "록(Rock)이지. ……그것이 록이니까."
10034020-11 = "관객……같은 소릴 하는 건 너무 유치하려나. 아무튼 그런 느낌이지만."
10034020-16 = "\"Q. 그럼 밴드에 <제일 중요한 건> 뭐라고 생각하나요?\""
10034020-19 = "음……. 그렇게 물으면……. 역시 보컬이려나. 개인적으론 그걸 중시해서."
10034020-20 = "의외로 디자인일 지도? 비주얼이 눈에 딱 띄어야 들으러 와주건 말건 할 테니까."
10034020-21 = "록이지. ……그것이 록이니까."
10034020-22 = "곡……이려나요? 그래도 역시 '밴드'니까……?"
10034020-28 = "[ns1] \"좋아. 방금 그 말들을 기억해 줘.\"\n[ns2] \"방금 전 스스로 중요하다고 한 것들…….\""
10034020-31 = "[ns3] \"축하합니다! 지금부터 그게 본인 담당이야!!\"\n[ns4] \"이제부터 각자가 해야 할 일이 바로 그거야.\""
10034020-39 = "뭐……."
10034020-40 = "뭐어어어어~~!?!?"
10034020-42 = "뭐, 뭐야!? 이렇게 갑자기!? 이렇게 막 그런 식으로 정해도 되는 거야, 이거!?"
10034020-43 = "어차피 밴드 하려면 누군가는 해야 할 것들 아니었냐고? 그, 그러네! 그건 그렇지만……!"
10034020-44 = "즉흥적인 선택으로 인한 즉흥적인 결말인가. 나쁘지 않아. 이 또한 록이지."
10034020-45 = "뭐가 록이야!! 넌 또 말투가 왜 그렇게 바뀐 건데!!"
10034020-51 = "평소랑 똑같지 않나. '로망'이 '록'으로 바뀌었을 뿐."
10034020-52 = "아하하……. 듣고 보니……."
10034020-53 = "……어라."
10034020-54 = "잠깐만요. 그러면 어떻게 되는 거죠? 각자 맡은 게……."
10034020-56 = "나는 비주얼……인가? 비주얼이 뭐지? 뭘 하면 되는 건데?"
10034020-57 = "……? 아아, 커버 이미지? 밴드 마크? 생각보다 뭐 많네?"
10034020-58 = "의상까지 고르는 거야? 아니, 뭐 싫다는 건 아니지만……."
10034020-59 = "그럼 내 취향대로 막 고를 테니까! 불만 가지지 않기다! 알겠지!? '담당 마음'이야!!"
10034020-64 = "후……. 벌써부터 괴악한 패션 센스의 미래가 걱정되는군."
10034020-68 = "……아니, 잠깐."
10034020-69 = "그럼 난 '보컬'이라고 했는데, 설마……."
10034020-70 = "밴드의 보컬이 되신 것을 축하합니다~."
10034020-71 = "아, 아니 잠깐!! 이건 아니잖아! 뭐 이딴 식으로 보컬을 정하는 그룹이 다 있어!?"
10034020-73 = "그, 그래도 카즈사 쨩 목소리 좋으니까……! 노래……. 하면 잘 할 수 있지 않을까?"
10034020-74 = "나는 엄청……. 듣고 싶을 것 같기도……!"
10034020-75 = "오……. 여기서 아이리가 그런 말을 하면……."
10034020-76 = "……!!! 그, 그런……!!"
10034020-77 = "아무리 그래도……! 아무리……! ……아이리라도……!"
10034020-81 = "크윽……!"
10034020-85 = "크아아아아악-!!"
10034020-93 = "이야, 효과 대박인데. 안 하겠다는 말은 쏙 들어간 거 봐. 미쳤다, 미쳤어."
10034020-94 = "후후, 그야말로 청춘이구만……. 청춘은 아름다운 거야……."
10034020-95 = "나는……. 록……. 록이라……."
10034020-96 = "'록'을 한다……. 이 또한 꽤 흥미로운 논제……."
10034020-97 = "……응? 선생님. 뭐라고 했어?"
10034020-98 = "밴드의 운영 관리……? 스케줄……?"
10034020-99 = "……청소……?"
10034020-100 = "그, 그게 무슨……? 그게 대체 록이랑 무슨 상관이……. 그건 그냥 고생이잖아."
10034020-101 = "[s5] \"몰랐어? 록은 고생이야.\"\n[s6] \"성공을 위한 열정과 노력. 그것이 '록'이니까.\""
10034020-106 = "아니, 어……. 그……."
10034020-107 = "잠시……. 그런 말장난은……."
10034020-108 = "이야~! 맞다, 맞아! 그게 록이지! 원래 록은 헝그리한 거라고도 하니까!!"
10034020-115 = "청춘은 아름다운 거라고, 그치!? 테스트까지 잘~ 부탁한다고! '록'!!!"
10034020-116 = "로……. 록……!? 청춘……!? 크윽……."
10034020-117 = "설마 여기까지 와서 갑자기 '나는 록이 아니야'라고 할 생각은 아니겠지? 응?"
10034020-118 = "……!!!"
10034020-119 = "처…… 처……!!"
10034020-120 = "청춘은……!"
10034020-121 = "……괴로운 거야……."
10034020-127 = "……아하하……."
10034020-131 = "……어라. 그럼 저는……. '곡'……인가요?"
10034020-132 = "어…… 으음……. 갑자기 곡이라니, 작곡 같은 건 해 본 적 없는데……."
10034020-133 = "아니, 뭐. 꼭 자작곡일 필요는 없을걸? 그냥 하고 싶은 곡 골라서 선정하면 되잖아."
10034020-134 = "애초에 '아마추어 학생 밴드의 축하공연'인데 곡까지 바랄 리가 없지. 걱정할 거 없어."
10034020-135 = " 기대하고 있다고~! 너무 어려운 곡 고르지는 말고! 하하!!"
10034020-136 = "으, 응!! 곡 선정이라……."
10034020-137 = "나라도 그 정도는 할 수 있을지도……! 응!"
10034020-141 = "[ns7] (……'나라도'……?)\n[ns8] (……'할 수 있을지도'……?)"
10034020-146 = "자, 자! 이러고 있을 시간이 없어! '비주얼 담당'인 나는 지금 당장 옷부터 구하러 갈 테니까 말이야!"
10034020-147 = "구해서 여기 연습실에 놔둘 테니까, 이후로는 들른 순서대로 잘 갈아입도록. 알았지?"
10034020-148 = "그리고 보자……. 내일 일정은……. 나츠?"
10034020-149 = "아니…… '록!' 우리의 일정을 알려줘!"
10034020-156 = "……아아. 일정인가. 잘 찾아왔네, 예언이 필요한 자여. 나는 록. 미래를 관장하는 자."
10034020-157 = "적응 빠르네."
10034020-158 = "우리의 미래……. 내일의 우리들은……."
10034020-159 = "……악기부터 구해야겠지?"
10034020-160 = "……라고 하신다!! 일정 담당께서!!"
10034020-161 = "이거 완전 편하네. 평소에 제일 일정 망치는 녀석에게 오히려 일정을 책임지게 하다니."
10034020-162 = "다시 봤어, 선생님. 이것이 어른의 관록……?"
10034020-163 = "[s9] \"후후후……! 그 말 대로!!\"\n[s10] 아니지만 일단 웃어 둔다."
10034020-166 = "오늘은 일단 여기서 끝!! 해산이다, 해산!!"
10034020-167 = "다들 내일 학교 끝나고 악기 상점가에서 보자고!!"
10034020-180 = "[ns] \"………….\""
10034020-186 = "(그 날의 늦은 저녁. 쌓인 저녁 업무를 이어가고 있었다.)"
10034020-193 = "[ns11] \"……아이리?\"\n[ns12] 샬레 현관문을 열어준다."
10034020-202 = "시, 실례합니다……. 늦은 시간인데 죄송해요. 선생님."
10034020-203 = "……네, 네? 옷이요? 아아. 이거……."
10034020-204 = "요시미가 연습실에 가져다 놓았더라고요. 그래서 본 김에……. 하하……."
10034020-205 = "……네?"
10034020-206 = "……올 거라고 생각하고 계셨……다고요? ……제가요?"
10034020-207 = "어, 어째서……?"
10034020-208 = "[s13] \"뭔가 상담이 필요할 것 같았거든.\"\n[s14] \"곡 선정에 관해 이야기해 볼까.\""
10034020-213 = "아, 아하하……. 역시 뭐든 알고 계시는군요, 선생님은."
10034020-214 = "네. 맞아요. 사실 그 일 때문에 선생님께 말씀을 듣고 싶어서 왔어요……."
10034020-215 = "사실 처음에는 스스로 선택을 해 보려고 하기도 했지만, 아무래도 잘 안돼서요."
10034020-216 = "그……. 곡을 선정한다는 게……. 생각보다 쉽지가 않네요. 하하……."
10034020-217 = "음……."
10034020-218 = "으음……."
10034020-219 = "선생님께서는 어떻게 생각하시나요? 어떤 곡을 골라야 할까요? 어떤 게 최선일까요……?"
10034020-220 = "……네? 찾고 있는 곡이 어째서 '최선의 곡'……이냐고요?"
10034020-221 = "그야 당연히……. 최선의 곡을 골라야, 결과가 좋으니까……? 가장 잘 될 테니까……?"
10034020-222 = "어라. 아닌 가요? 뭔가 좀 다른 가요?"
10034020-223 = "……'좋아하는 곡'으로 하면 안 되냐고요? 아, 안 돼요! 그런 건! 그런 식으로는……!!"
10034020-227 = "죄, 죄송해요. 저도 모르게 목소리가 커졌네요."
10034020-228 = "그렇지만……. 아무튼 이번에는 뭔가 최선의 것이었으면 좋겠어요. 가장 좋은 결과였으면 좋겠어요."
10034020-229 = "……잘 했으면 좋겠어요."
10034020-230 = "뭔가 설명은 잘 안되지만……. 그런 기분이에요."
10034020-234 = "[ns15] \"그럼 최근 들었던 것 중 제일 멋진 건 뭐야?\"\n[ns16] \"뭔가 딱 '이건 훌륭하다' 싶었던 곡은 없었어? 최근에.\""
10034020-235 = "……최근 제일 멋졌던……?"
10034020-236 = "……이건 훌륭하다……?"
10034020-237 = "으음……."
10034020-238 = "…………?"
10034020-239 = "어……."
10034020-245 = "[ns] \"……아이리?\""
10034020-246 = "아, 아……! 죄, 죄송해요! 순간 생각이……."
10034020-247 = "그게……. 그……. 있……기는 있었는데요……. 있었지만……."
10034020-248 = "제목도 모르고 부른 사람도 지나치며 잠깐 본 것뿐이라, 찾을 수 있을지는……."
10034020-249 = "애초에 트리니티 학생 같지도 않았거든요. 축제 준비 기간이라 둘러보며 버스킹을 하고 있었던 걸 본 것뿐이에요."
10034020-250 = "물론 이 기간대에는 다른 학교 학생들이 밤낮을 가리지 않고, 거리 이곳저곳에서 버스킹을 하고 있다지만……."
10034020-251 = "설령 지금 있다 해도, 수소문으로 찾으려면 트리니티 교내를 다 뒤져야 할 텐데……."
10034020-252 = "……네?"
10034020-253 = "뒤지면 되지 않느냐고요? ……같이 찾아보자고요?"
10034020-254 = "그, 그렇게 쉽게 말씀하실 일인가요? 트리니티 어디 있는 줄 알고……."
10034020-255 = "시간이 없냐고요? 아, 아뇨. 제 문제가 아니라 선생님께서 고작 그런 일에 얼마나 쓸지도 모를 시간을……!"
10034020-256 = "[s17] \"그건 아이리가 신경 쓰지 않아도 돼.\"\n[s18] \"걱정하지 마. 제대로 '업무'니까.\""
10034020-259 = "선생님……."
10034020-260 = "……아, 알겠어요. 그러면 그렇게 알고 있을 게요."
10034020-261 = "괜찮으신 시간은……."
10034020-265 = "……?"
10034020-266 = "…………네?"
10034020-268 = "……지금부터요?"
