[translation]
61010-1 = "제1화;굴레"
61010-4 = "헉…… 헉…… 헉…… 헉……."
61010-11 = "허억…… 헉…… 하앗…… 으윽……."
61010-16 = "큭……! 콜록, 콜록, 콜록, 콜록……!"
61010-21 = "……조금만, 쉬었다 갈까……."
61010-22 = "후우……. 후우……. 후우……."
61010-30 = "……헤헷."
61010-31 = "밖으로 나가면, 어떻게든 될 줄 알았는데."
61010-32 = "응. 맞아."
61010-33 = "바깥에서라면 무언가가 달라질 줄 알았어."
61010-35 = "그 아이들."
61010-36 = "스쿼드가 간 길이라면……"
61010-37 = "나라고 해도, 따라갈 수 있을 거라고 생각했어."
61010-39 = "……비, 내리기 시작했네."
61010-40 = "(추워…….)"
61010-41 = "(손끝의 감각이 느껴지지 않아…….)"
61010-42 = "계속, 가야지……."
61010-53 = "응? 5일을 일했으니, 급여를 달라고?"
61010-54 = "그건 안 되겠구만! 자네, 계약서도 안 썼잖아?"
61010-56 = "아리우스? 거긴 어디야? 들어 본 적도 없는데?"
61010-57 = "가만, 그렇다면 너 학적이 없는 거나 마찬가지구만? 이거 마음대로 써먹어도 되겠는데……?"
61010-59 = "가서 이 일을 하고 와."
61010-60 = "못 하겠다고? 어째서지? 실망이군. 너희는 그런 일을 전문적으로 교육받지 않았나?"
61010-61 = "어떻게 알았느냐고? 나도 나름 그런 쪽 이야기를 들을 수 있는 라인이 있어서 말이지."
61010-62 = "그런 일은 이제 하지 않을 생각이다? 더 이상 그쪽 방면에 손을 대고 싶지 않다?"
61010-63 = "우습지도 않군. 유일하게 할 줄 아는 일을 하지 않겠다니."
61010-64 = "그렇다고 제대로 된 일을 구할 수 있는 처지도 아니면서 말이지."
61010-65 = "꺼져라. 의뢰를 받지 않겠다면, 너 따위와 더 이상 말을 섞고 싶지도 않아."
61010-67 = "……모두, 착각이었어."
61010-68 = "그렇게 될 리가 없잖아."
61010-69 = "그렇게 일이 쉽게 풀릴 리가 없잖아."
61010-70 = "그렇게 모든 것이……. 생각대로 되어 줄 리가 없잖아."
61010-71 = "착각은 자유지만, 대가는 그렇지 않으니까."
61010-73 = "[log=마이아 언노운]도망친 곳에 낙원은 없다.[/log]"
61010-75 = "[log=마이아 언노운]그 정도는 알고 있었다.[/log]"
61010-77 = "[log=마이아 언노운]그렇지만 꿈을 꾸고 싶었다.[/log]"
61010-80 = "[log=마이아 언노운]희망이라는 게 있다는 걸…… 나도, 느껴 보고 싶었다.[/log]"
61010-82 = "[log=마이아 언노운][ff4444]……어쩌면 그 자체가 꿈이었던 것인지도 모른다.[-][/log]"
61010-85 = "아아……."
61010-86 = "그래도, 돌아왔어."
61010-87 = "무언가가 나아지지는 않겠지만, 마음은 편하네."
61010-88 = "아리우스 분교."
61010-90 = "내가 자란 곳."
61010-91 = "내가 겪어낸 곳."
61010-92 = "내가…… 교육받았던 곳."
61010-93 = "우리들의, '학교'."
61010-100 = "돌아왔군요."
61010-106 = "어……?"
61010-107 = "우선 쉬도록 해요. 물론 할 이야기가 많으리라는 것도, 알고 있습니다."
61010-108 = "선배……."
61010-109 = "스바루 선배……!"
61010-110 = "네. 저입니다. 카케하시 스바루입니다."
61010-111 = "타치기 마이아, 였지요? 괜찮습니다. 천천히 이야기해 주세요."
61010-112 = "세상이 당신을 버려도, 저와 아리우스는 아직 당신을 버리지 않았습니다."
61010-113 = "네……. 네!"
61010-115 = "[log=스바루]다시 돌아온 것을 환영합니다.[/log]"
61010-117 = "[log=스바루][ff4444]우리들의, 아리우스에.[-][/log]"
61010-121 = "다음화;학생의 본분!"
