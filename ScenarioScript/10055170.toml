[translation]
10055170-1 = "光と影が交差するアクロバティック"
10055170-2 = ""
10055170-3 = "夕焼け、綺麗だね～"
10055170-4 = "そうですね……。"
10055170-5 = "何の心配もせずにゆっくり過ごせるなんて、いつぶりだろ……。"
10055170-6 = ""
10055170-8 = ""
10055170-10 = ""
10055170-11 = "あなたたち、ここに居たのね。"
10055170-12 = "あ、サツキ先輩。"
10055170-13 = "……マコト先輩は？たしか一緒でしたよね。"
10055170-14 = "マコトちゃんは勝負相手を探し回ってるわ。#nクラブファイトが随分と気に入ったみたい。"
10055170-15 = "私はちょっと疲れたから、後のことはチアキに任せてきちゃった。"
10055170-16 = "……あの二人で大丈夫ですか？"
10055170-17 = "ん～、たしかに何か面倒事が起きちゃうかも。#nまあでも、私はここにいるから関係ないわ。"
10055170-18 = "……サツキ先輩がマコト先輩と長く付き合えてる理由、分かった気がします。"
10055170-19 = "……。"
10055170-20 = "はあ……本当に……ほんと～に面倒くさいけど……。"
10055170-21 = "マコト先輩が何かしでかしたらもっと面倒くさいから……。"
10055170-22 = "ちょっと様子を見に行ってきます。先生とサツキ先輩はイブキをお願いしますね。"
10055170-23 = ""
10055170-25 = ""
10055170-27 = "ええ。イブキちゃんはおとなしいもの。お安い御用よ。"
10055170-28 = ""
10055170-30 = ""
10055170-31 = ""
10055170-32 = ""
10055170-33 = "……。"
10055170-34 = "……えっと、どちらさま？"
10055170-35 = "あ、サツキ先輩！"
10055170-36 = "こっちはチセお姉ちゃん！イブキと友達になってくれたの！"
10055170-37 = "この一瞬で？"
10055170-38 = ""
10055170-40 = ""
10055170-41 = "……怪しいわ。"
10055170-42 = "そこのあなた、ちょっといいかしら？"
10055170-43 = "かいがら～。"
10055170-44 = "ん……？"
10055170-45 = "拾ってたらここに着いた。"
10055170-46 = ""
10055170-47 = "光と影が交差する#nアクロバティック"
10055170-50 = ""
10055170-52 = "誰が置いたんだろ？"
10055170-53 = "……誰も置いてないと思うけど。"
10055170-54 = "じゃあなんであるの？"
10055170-55 = "そうねぇ……この世には潮流とか、風とか、モノを動かすものがたくさんあるの。"
10055170-56 = "その内のどれかの仕業じゃない？"
10055170-57 = "海ってすごいね。"
10055170-58 = "へえ、やるじゃない。大自然の偉大さが分かるのね。#nじゃあ……危険性も分かるでしょう？"
10055170-59 = "危険？"
10055170-60 = "そうよ、海には危険がいっぱいなの。#n熱い太陽に荒れ狂う波、それに脱水症状だって……。"
10055170-61 = "太陽はあったかいから好き。"
10055170-62 = "……どうやら意見が分かれたようね。"
10055170-63 = "にゃは～"
10055170-64 = ""
10055170-66 = ""
10055170-69 = ""
10055170-70 = "これはこれは～うちのチセが世話になってるみたいで～"
10055170-71 = "あなたはたしか……百鬼夜行の陰陽部部長？"
10055170-72 = "んにゃ？あえて自己紹介しなかったんですが……。#nご存じなのでしたら説明が省けて助かります～"
10055170-73 = "では……挨拶はこれくらいにして、本題に移りましょか。"
10055170-74 = "ん……カホ、よろしく。"
10055170-75 = "ええっ！？そこまで言っておいて、私にパスですか！？"
10055170-76 = "私はあくまで見守る側だから～"
10055170-77 = "はあ……私たち陰陽部が、こうして訪ねた理由は――"
10055170-78 = "万魔殿に「[ruby=かいしょうせん]蟹承戦[/ruby]」を申し込むためです。"
10055170-80 = "蟹承戦……？クラブファイトじゃなくて？"
10055170-81 = "世間的にはそのように伝わっているようですね。#nですが、元々は百鬼夜行のとある地方に代々伝わる文化が広まったもので――"
10055170-82 = "カホ、長くなっちゃうから。"
10055170-83 = "そ、そうですね。#nそちらでいう、クラブファイトのようなものと思っていただいて問題ないです。"
10055170-84 = "まあ、私たちはただの見物客なんですけどね～"
10055170-85 = "できることなら、私が戦いたいくらいでしたが……。"
10055170-86 = "この大会の華は、蟹との絆を持つ「クラブ・ファイター」――"
10055170-87 = "――「和楽姫」の光る場所なのです！"
10055170-88 = "うん。私と勝負しよう。"
10055170-89 = "えっ！？正直、勝負とか興味ないんだけど……。"
10055170-90 = "ほうほう。"
10055170-91 = "ならば、今回の勝負は我々の不戦勝……ということでよろしいですか？"
10055170-92 = "ええ。そもそも私は天下一蟹とかいう大会に興味ないし。"
10055170-93 = "ふふ。でしたら万魔殿の星はこちらで……。"
10055170-95 = "ダメー！"
10055170-96 = "イブキちゃん？"
10055170-97 = "星がなくなったら、マコト先輩が悲しんじゃう！"
10055170-98 = "持っていくなら、まずイブキと勝負だよ！"
10055170-99 = "待って！イブキちゃんに、そんな危険なことさせられないわ！"
10055170-101 = "いえ、特に危険というわけでは……。"
10055170-102 = "よりによって、戦いが嫌いな私とイブキちゃんしかいない時に来るなんて……。"
10055170-103 = "……！？も、もしかして！わざとこのタイミングを狙ったの！？"
10055170-104 = "そんなまさかぁ～"
10055170-105 = "たしかに、マコト議長が対戦相手を探し回ってるのは見ましたけど～"
10055170-106 = "それで、「今の万魔殿は狙い目だ」とか～"
10055170-107 = "そんなことは思ってませんよ～"
10055170-108 = "くっ！まさか情報戦で押されるなんて……。"
10055170-109 = "わ、分かったわ！私が相手をしてあげる！"
10055170-110 = "ほお～？"
10055170-111 = "情報戦でやられたままなんて、万魔殿の情報部長として許せないわ！"
10055170-112 = "受けて立ってやろうじゃない！"
10055170-113 = "……これはちょ～っと予想外の展開になってきましたねぇ。"
10055170-114 = "まあ、これも一興ということで！"
10055170-116 = "名前。"
10055170-117 = "え？"
10055170-118 = "教えて。"
10055170-119 = "……京極サツキよ。#n誰にでも教えてるわけじゃないから、あまり言いふらさないでね。"
10055170-120 = "うん、じゃあ始めるよー"
10055170-121 = "万魔殿、京極サツキの挑戦を受けるー"
10055170-122 = "立会い人は先生。見届け人はニヤ部長とカホ副部長。"
10055170-123 = "な、なんだか本格的ね……。"
10055170-125 = "はい。先ほどお伝えしたように、蟹承戦は長い歴史を持つ伝統ですから。"
10055170-126 = "それじゃあ両者、両カニは、位置について……。"
10055170-127 = ""
10055170-129 = ""
10055170-130 = "いざ尋常に、勝負！！"
