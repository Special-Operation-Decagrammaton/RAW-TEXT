[translation]
10055170-1 = "กายกรรมเมื่อแสงและเงาบรรจบกัน"
10055170-2 = ""
10055170-3 = "แสงอาทิตย์ยามเย็นนี่สวยจัง~"
10055170-4 = "นั่นสินะคะ"
10055170-5 = "นานแค่ไหนแล้วนะ ที่ไม่ได้ใช้ชีวิตสบายๆ แบบนี้ โดยไม่ต้องห่วงว่าจะเอาตัวรอดยังไง..."
10055170-6 = ""
10055170-8 = ""
10055170-10 = ""
10055170-11 = "ทุกคนมารวมกันอยู่ที่นี่เองเหรอ?"
10055170-12 = "อ๊ะ รุ่นพี่ซัตสึกิ"
10055170-13 = "แล้วรุ่นพี่มาโคโตะล่ะคะ...? ไม่ได้อยู่ด้วยกันเหรอคะ?"
10055170-14 = "อื้อ~ มาโคโตะจังคงจะถูกใจแคร็บไฟต์พอตัวเลยละ ตอนนี้ก็เลยไปเดินหาคนมาประลองด้วย"
10055170-15 = "แต่ฉันปวดเท้าแล้วก็เหนื่อยๆ เลยฝากให้จิอากิดูแทนไปก่อนแล้วกลับมาก่อนน่ะ"
10055170-16 = "ปล่อยให้สองคนนั้นอยู่ด้วยกันตามลำพังจะไม่เป็นไรจริงๆ เหรอคะ...?"
10055170-17 = "ไม่รู้สิ? อาจจะก่อเรื่องกันก็ได้ละมั้ง? แต่ฉันหนีออกมาก่อนแล้วน่ะ มันไม่เกี่ยวกับฉันหรอก"
10055170-18 = "พอจะเข้าใจเคล็ดลับที่รุ่นพี่ซัตสึกิเป็นเพื่อนกับรุ่นพี่มาโคโตะมาได้นานแล้วละค่ะ..."
10055170-19 = "อืมมม..."
10055170-20 = "เฮ้อ ถึงจะน่ารำคาญ น่ารำคาญมากจริงๆ ก็เถอะ..."
10055170-21 = "แต่ถ้าเกิดเรื่องขึ้นมาจริงๆ แล้วต้องตามแก้ ก็ยิ่งยุ่งยากเข้าไปอีก..."
10055170-22 = "ฉันไปตามกลับมาก่อนนะคะ คุณครูกับรุ่นพี่ซัตสึกิช่วยดูแลอิบูกิอยู่ที่นี่หน่อยค่ะ"
10055170-23 = ""
10055170-25 = ""
10055170-27 = "เอาน่า~ อิบูกิจังเป็นเด็กเรียบร้อย แค่ดูแลน่ะไม่เป็นปัญหาเลย~"
10055170-28 = ""
10055170-30 = ""
10055170-31 = ""
10055170-32 = ""
10055170-33 = "......"
10055170-34 = "ใครน่ะ...?"
10055170-35 = "อ๊ะ รุ่นพี่ซัตสึกิ!"
10055170-36 = "นี่คือพี่ชิเซะ! พี่เค้ามาเป็นเพื่อนกับอิบูกิแล้วละ!"
10055170-37 = "แค่คลาดสายตาแป๊บเดียวเองเนี่ยนะ?"
10055170-38 = ""
10055170-40 = ""
10055170-41 = "สังหรณ์ใจไม่ดีเลย..."
10055170-42 = "นี่ เธอน่ะ ขอคุยด้วยหน่อยได้มั้ย?"
10055170-43 = "เปลือกหอย..."
10055170-44 = "หืม...?"
10055170-45 = "ตามมาเรื่อยๆ ก็เลยมาถึงที่นี่น่ะ"
10055170-46 = ""
10055170-47 = "กายกรรมเมื่อแสงและเงา#nบรรจบกัน"
10055170-50 = ""
10055170-52 = "ใครเอามาวางไว้นะ?"
10055170-53 = "คงไม่มีใครเอามาวางหรอกมั้ง...?"
10055170-54 = "แล้วทำไมมันถึงอยู่ตรงนั้นได้ล่ะ?"
10055170-55 = "ไม่รู้สิ? บนโลกนี้มีตั้งหลายอย่างที่ทำให้สิ่งของเคลื่อนที่ได้ อย่างกระแสน้ำหรือลมไงล่ะ"
10055170-56 = "ถึงจะเป็นฉัน ก็เดาเรื่องนั้นได้ไม่ง่ายเหมือนกันนะ"
10055170-57 = "ทะเลนี่สุดยอดเลยนะ"
10055170-58 = "โอ้โฮ ใช้ได้เลยนี่ เข้าใจความยิ่งใหญ่ของธรรมชาติด้วย ถ้าอย่างนั้นก็คงรู้สินะว่าธรรมชาติน่ะ#nอันตรายขนาดไหน?"
10055170-59 = "อันตรายเหรอ?"
10055170-60 = "ใช่แล้ว ทะเลมีปัจจัยอันตรายมากมาย ทั้งแดดร้อนจัด คลื่นแรง ความเสี่ยงที่จะทำให้อ่อนเพลีย#nและขาดน้ำ..."
10055170-61 = "แสงแดดอุ่นดี ชอบจังเลย"
10055170-62 = "ดูเหมือนว่าเราจะเห็นไม่ตรงกันซะแล้ว"
10055170-63 = "อะฮะฮะฮ่า~"
10055170-64 = ""
10055170-66 = ""
10055170-69 = ""
10055170-70 = "ขอโทษด้วยนะคะ~ ดูเหมือนชิเซะของเราจะรบกวนพวกคุณอยู่เลยค่ะ"
10055170-71 = "เอ๊ะ เธอคือหัวหน้าชมรมหยินหยางของเฮียกคิยาโคนี่?"
10055170-72 = "โอ้โฮ~ ไม่ทันได้แนะนำตัวก็จำกันได้แล้ว ช่างน่าปลื้มใจ น่าปลื้มใจจริงๆ ค่ะ"
10055170-73 = "เอาละ ทักทายกันพอหอมปากหอมคอแล้ว ขอเข้าเรื่องเลยนะคะ~"
10055170-74 = "อืม คาโฮะ ฝากด้วยนะ..."
10055170-75 = "คะ?! พูดมาถึงขนาดนี้แล้ว จู่ๆ ก็จะชิ่งไปงั้นเหรอคะ?"
10055170-76 = "ยังไงฉันก็เป็นแค่สมาชิกรับเชิญนี่นา~"
10055170-77 = "เฮ้อ... อะแฮ่ม เอาเป็นว่าที่พวกเราชมรมหยินหยางมาหาถึงที่แบบนี้..."
10055170-78 = "ก็เพื่อจะขอท้าประลอง <ศึกปูชิงชัย> กับแพนเดโมเนียม โซไซตี้ค่ะ"
10055170-80 = "ศึกปูชิงชัย...? ไม่ใช่แคร็บไฟต์เหรอ?"
10055170-81 = "ฮุฮุ ดูเหมือนคนทั่วไปจะรู้จักกันแบบนั้น แต่จริงๆ แล้วมีที่มาจากประเพณีเก่าแก่ของท้องถิ่นแห่งหนึ่ง#nในเฮียกคิยาโคต่างหากค่ะ"
10055170-82 = "คาโฮะๆ พูดยืดยาวไปแล้ว"
10055170-83 = "อ๊ะ จริงด้วยค่ะ เอาเป็นว่าถือว่าเป็นอย่างเดียวกันนั่นละค่ะ"
10055170-84 = "แต่พวกเราเป็นแค่คนดูนะคะ ฮ่าฮ่า~"
10055170-85 = "ก็ตามนั้นเลยค่ะ! ถ้าเลือกได้ ฉันก็อยากลงสู้เองเหมือนกัน...!"
10055170-86 = "แต่ดาวเด่นของการแข่งขันนี้คือ <แคร็บไฟต์เตอร์> ผู้มีสายสัมพันธ์กับปู...!"
10055170-87 = "กล่าวคือที่นี่เป็นเวทีที่องค์หญิงวาราคุจะเปล่งประกายได้มากที่สุดค่ะ!"
10055170-88 = "อื้ม~ มาประลองกับฉันได้นะ~"
10055170-89 = "ว่าไงนะ?! จะประลองหรืออะไรก็เถอะ ฉันไม่เอาด้วยหรอก..."
10055170-90 = "โอ้โฮ~ โอ้โฮ~"
10055170-91 = "ถ้าพูดอย่างนั้น ขอถือว่าการประลองครั้งนี้พวกเราลอยตัวชนะการแข่งเลย... จะได้รึเปล่าคะ?"
10055170-92 = "ตามสบาย ฉันไม่ได้สนใจการแข่งปูชิงชัยหรืออะไรนั่นอยู่แล้ว"
10055170-93 = "ฮุฮุ ถ้าอย่างนั้นก็ขอดาวของแพนเดโมเนียม โซไซตี้ด้วยนะคะ..."
10055170-95 = "อ๊ะ! ไม่ได้นะ!"
10055170-96 = "อิบูกิจัง?"
10055170-97 = "ถ้ารู้ว่าดาวหายไป รุ่นพี่มาโคโตะต้องเสียใจแน่ๆ เลย!"
10055170-98 = "ถ้าอยากได้ดาวก็มาประลองกับอิบูกิก่อนสิ!"
10055170-99 = "อะไรนะ? อิบูกิจังจะประลองเหรอ... จะให้ทำอะไรอันตรายแบบนั้นไม่ได้หรอก!"
10055170-101 = "เอ่อ มันก็ไม่ได้อันตรายขนาดนั้นนะคะ...?"
10055170-102 = "ทำไมต้องมาตอนที่มีแค่ฉันที่ไม่ชอบต่อสู้กับอิบูกิจังอยู่พอดีเลยด้วยเนี่ย..."
10055170-103 = "...?! เดี๋ยวนะ หรือว่าตั้งใจเล็งจังหวะนี้อยู่แล้ว?!"
10055170-104 = "แหม~ จะเป็นไปได้ยังไงกันล่ะคะ~"
10055170-105 = "แน่นอนว่าการที่ท่านประธานมาโคโตะไปเดินหาคนประลองด้วยก็สะดุดตาอยู่ไม่น้อย..."
10055170-106 = "พอเห็นแบบนั้นแล้วก็ทำให้คิดว่านี่เป็นช่วงเวลาที่แพนเดโมเนียม โซไซตี้จะอ่อนแอที่สุด~"
10055170-107 = "ใครจะไปวางแผนฉวยโอกาสแบบนั้นกันได้ล่ะคะ จริงมั้ยคะ~?"
10055170-108 = "อย่าบอกนะว่าพวกเราแพ้สงครามข้อมูลน่ะ...?"
10055170-109 = "ฮึ่ม...! ก็ได้! ฉันจะเป็นคู่ต่อสู้ให้เอง!"
10055170-110 = "โอ้โฮ?"
10055170-111 = "จะให้โดนเล่นงานฝ่ายเดียวในสงครามข้อมูลแล้วถอยกลับไปน่ะเหรอ หัวหน้าฝ่ายข่าวกรอง#nแพนเดโมเนียม โซไซตี้อย่างฉันยอมไม่ได้หรอก!"
10055170-112 = "ฉันรับคำท้าศึกปูชิงชัยอะไรนั่นก็ได้!"
10055170-113 = "เรื่องไหลไปในทิศทางที่คาดไม่ถึงนิดหน่อยแล้วนะคะ~"
10055170-114 = "แต่แบบนี้ก็สนุกไปอีกแบบนะ! มาสนุกกันเถอะค่ะ!"
10055170-116 = "ชื่อ"
10055170-117 = "อะ... อืม?"
10055170-118 = "ต้องบอกชื่อด้วยสิ"
10055170-119 = "เคียวโงคุ ซัตสึกิ อย่าเที่ยวเอาไปบอกใครล่ะ ไม่ใช่ชื่อที่ฉันจะบอกให้ใครก็ได้รู้หรอกนะ"
10055170-120 = "อื้ม ถ้าอย่างนั้นจะเริ่มแล้วนะ..."
10055170-121 = "ฉันรับคำท้าศึกปูชิงชัยจากผู้ท้าชิงเคียวโงคุ ซัตสึกิ..."
10055170-122 = "ผู้สังเกตการณ์คือคุณครู ผู้รับรองคือหัวหน้านิยะกับรองหัวหน้าคาโฮะ"
10055170-123 = "อะ... เอาจริงเอาจังน่าดูเลยนะ?"
10055170-125 = "อย่างที่บอกไป ศึกปูชิงชัยเป็นประเพณีอันเก่าแก่ที่สั่งสมประวัติศาสตร์มาอย่างยาวนานค่ะ"
10055170-126 = "ถ้าอย่างนั้น ทั้งสองคนกับปูทั้งสองตัว เข้าประจำที่..."
10055170-127 = ""
10055170-129 = ""
10055170-130 = "เริ่มการดวลกันอย่างสง่าผ่าเผย!!"
