[translation]
10055170-1 = "Acrobatics Where Light and Shadow Meet"
10055170-2 = ""
10055170-3 = "The sunset's so pretty!"
10055170-4 = "It is, isn't it?"
10055170-5 = "And we can finally just relax and enjoy it, without having to worry about survival."
10055170-6 = ""
10055170-8 = ""
10055170-10 = ""
10055170-11 = "THERE you are, you two."
10055170-12 = "Oh hey, Satsuki."
10055170-13 = "...Where's Makoto? Wasn't she with you?"
10055170-14 = "She's...really gotten into this crab fighting business, so she's out and about, challenging everybody."
10055170-15 = "I followed her until my feet felt sore. Chiaki remained behind with her."
10055170-16 = "...Are you sure it's okay to leave those two alone together?"
10055170-17 = "Hm... It's highly likely that they'll cause trouble. However, what I do not see, I do not know."
10055170-18 = "So THAT'S how you've stayed friends with Makoto all this time..."
10055170-19 = "Mmm..."
10055170-20 = "*sigh* I hate having to do this..."
10055170-21 = "...but if I don't, she'll make a mess, and I'll have to clean it up."
10055170-22 = "I'll go bring her back. Sensei, Satsuki, keep an eye on Ibuki, would you?"
10055170-23 = ""
10055170-25 = ""
10055170-27 = "Sure. Ibuki is well behaved, so looking after her is no trouble at all."
10055170-28 = ""
10055170-30 = ""
10055170-31 = ""
10055170-32 = ""
10055170-33 = "..."
10055170-34 = "...Who's this?"
10055170-35 = "Oh hey, Satsuki!"
10055170-36 = "This is Chise! We're friends now!"
10055170-37 = "Just like that, huh?"
10055170-38 = ""
10055170-40 = ""
10055170-41 = "...I have a bad feeling about this."
10055170-42 = "Hey, excuse me. Could I have a word with you?"
10055170-43 = "Seashells..."
10055170-44 = "Hm...?"
10055170-45 = "I'm here because I followed the seashells."
10055170-46 = ""
10055170-47 = "Acrobatics Where Light and Shadow Meet"
10055170-50 = ""
10055170-52 = "I wonder who put them here?"
10055170-53 = "...I don't think anyone did."
10055170-54 = "Why...are they here?"
10055170-55 = "Well, lots of things in this world move objects around. Wind, currents..."
10055170-56 = "Hard to say what brought them here specifically."
10055170-57 = "Wow. The sea. It's amazing."
10055170-58 = "Oh, yes, very much so. And it's dangerous."
10055170-59 = "Dangerous?"
10055170-60 = "Yes. The sea is FULL of dangers. Rough waves, exhaustion, dehydration, the blazing sun..."
10055170-61 = "I like the sun. It's warm."
10055170-62 = "...Let's agree to disagree on that."
10055170-63 = "Nyahaha!"
10055170-64 = ""
10055170-66 = ""
10055170-69 = ""
10055170-70 = "Well, hello there. You been looking after our Chise for us?"
10055170-71 = "Oh, you must be the Yin-Yang Club President, from Hyakkiyako?"
10055170-72 = "...Wow, and I didn't even have to say anything. I'm flattered. Nice to meet you."
10055170-73 = "And now that the pleasantries are over, let's get down to business."
10055170-74 = "...Take it away, Kaho."
10055170-75 = "You're leaving the hard work to me?! As usual!"
10055170-76 = "Well, I'm just a guest here, right?"
10055170-77 = "*sigh* Ahem. We of the Yin-Yang Club have come before you..."
10055170-78 = "...to challenge the Pandemonium Society to a \"Crab Succession Match.\""
10055170-80 = "\"Crab Succession Match\"? I thought they were called Crab Fights."
10055170-81 = "Ah, that may be the colloquial term, but the tradition itself originates from ancient history, passed down from a certain region of Hyakkiyako..."
10055170-82 = "Kaho, Kaho. Let's not drag this out."
10055170-83 = "Mm, yes. Well, they're the same in principle."
10055170-84 = "I should mention we're only here to watch. Nyaha!"
10055170-85 = "As she says. While I myself would rise to the challenge if I could..."
10055170-86 = "...the true champions here are those who share the greatest bond with their crabs!"
10055170-87 = "In other words, this is Princess Waraku's time to shine!"
10055170-88 = "Mhm. You'll be facing me."
10055170-89 = "Do I have to? I'm not really here to compete..."
10055170-90 = "Oh yeah? Is that right?"
10055170-91 = "Perfect. So do you want to call it a forfeit?"
10055170-92 = "Whatever you desire. I have no motivation to enter the fray."
10055170-93 = "Heehee. Understandable. Then I guess you won't miss that star..."
10055170-95 = "Uh-uh! No!"
10055170-96 = "Ibuki?"
10055170-97 = "Makoto would be all sad if we lost a star!"
10055170-98 = "You want it, you're gonna have to go through Ibuki first!"
10055170-99 = "Ibuki?! ...No, no, I can't put you in danger like that."
10055170-101 = "It's really not THAT dangerous..."
10055170-102 = "What unfortunate timing. To challenge me, who hates fighting, when only Ibuki is here..."
10055170-103 = "It can't be?! Have they been circling us all this time? Was this their strategy?"
10055170-104 = "Me? No, no. Of course not!"
10055170-105 = "I suppose Chairman Makoto is the more obvious target to challenge..."
10055170-106 = "And I suppose we could have purposefully found a softer target to land on..."
10055170-107 = "But that would be political scheming, and who would do that?"
10055170-108 = "I've been outplayed, and I didn't even know I was playing at all."
10055170-109 = "Ugh...! Fine, fine. I will be your opponent."
10055170-110 = "Oh?"
10055170-111 = "I'm the Pandemonium Society Intelligence Committee Director, and you bested me in strategy and intel. I can't stand idly by!"
10055170-112 = "I accept your Crab Succession Match!"
10055170-113 = "...I didn't quite see that coming."
10055170-114 = "But all right! This ought to be fun. Let's both enjoy it."
10055170-116 = "What was your name?"
10055170-117 = "H-Huh?"
10055170-118 = "I need to know your name."
10055170-119 = "...Kyougoku Satsuki. I would keep it close to your chest. I don't give it out easily."
10055170-120 = "Understood. Now let's begin."
10055170-121 = "I accept Kyougoku Satsuki's challenge to a Crab Succession Match."
10055170-122 = "Sensei will oversee the match. President Niya and Vice President Kaho will serve as witnesses."
10055170-123 = "W-Wow, this is serious business."
10055170-125 = "As I said, it's a time-honored tradition, with a long, long history."
10055170-126 = "Now, contestants, crabs, to your positions."
10055170-127 = ""
10055170-129 = ""
10055170-130 = "Let's have a clean fight!"
