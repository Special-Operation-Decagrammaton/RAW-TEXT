[translation]
10055170-1 = "빛과 그림자가 만나는 아크로바틱스"
10055170-3 = "노을, 예쁘다~"
10055170-4 = "그러게요."
10055170-5 = "이렇게 생존 걱정 없이 유유자적하게 지내는 시간이 얼마 만인지."
10055170-11 = "다들 여기 모여 있었네?"
10055170-12 = "아, 사츠키 선배."
10055170-13 = "……마코토 선배는요? 함께 있지 않았나요?"
10055170-14 = "응~ 마코토 쨩은 아무래도 크랩 파이트가 꽤 마음에 든 모양이라, 지금도 승부할 상대를 찾아다니고 있네."
10055170-15 = "나는 발 아프고 피곤해서, 적당히 치아키에게 맡기고 돌아왔지만."
10055170-16 = "……그 둘만 같이 둬도 괜찮은 거 맞나요?"
10055170-17 = "글쎄? 사고 치지 않을까? 그렇지만, 나는 그전에 빠져나왔으니까 관계없네."
10055170-18 = "사츠키 선배가, 마코토 선배랑 오랫동안 친분을 유지한 비결을 좀 알 것 같네요……."
10055170-19 = "으으으음……."
10055170-20 = "……하아, 진짜, 진짜로 귀찮지만……."
10055170-21 = "정말로 사고가 터지고 대처하는 건 더 귀찮고……."
10055170-22 = "잠깐 데리러 다녀올게요. 선생님이랑 사츠키 선배는, 여기서 이부키를 좀 봐주세요."
10055170-27 = "뭐어~ 이부키 쨩은 얌전하니까, 돌보는 것 정도야 전혀~"
10055170-33 = "……."
10055170-34 = "……누구?"
10055170-35 = "아, 사츠키 선배!"
10055170-36 = "이쪽은 치세 언니! 이부키랑 친구 해 줬어!"
10055170-37 = "그 잠깐 사이에?"
10055170-41 = "……꺼림칙해."
10055170-42 = "저기, 당신. 얘기 좀 할 수 있을까?"
10055170-43 = "조개껍질-"
10055170-44 = "응……?"
10055170-45 = "쫓다 보니, 도착했어."
10055170-47 = "빛과 그림자가#n만나는 아크로바틱스"
10055170-52 = "누가 놓은 걸까?"
10055170-53 = "……아무도 안 놓았을걸?"
10055170-54 = "그러면 왜 거기 있어?"
10055170-55 = "글쎄? 세상에는 조류나, 바람처럼, 물건을 움직이는 수많은 것들이 있는걸."
10055170-56 = "아무리 나라고 해도 그걸 예측하기는 쉽지 않네."
10055170-57 = "바다는 대단하네."
10055170-58 = "헤에, 제법이네. 대자연의 위대함을 이해하고 있다니. 그렇다면 얼마나 위험한지도 알고 있겠지?"
10055170-59 = "위험해?"
10055170-60 = "그래, 바다에는 무수한 위험 요소가 있지. 뜨거운 태양, 거친 파도, 탈진과 수분 부족의 위험……."
10055170-61 = "햇빛은 따뜻해서 좋아."
10055170-62 = "……아무래도 우리 사이에서 의견이 갈린 듯하네."
10055170-63 = "냐하하하~"
10055170-70 = "이거 실례~ 우리 치세가 신세를 지고 있는 듯하네요."
10055170-71 = "어라, 당신은, 백귀야행 음양부장?"
10055170-72 = "오호라~ 일부러 소개도 하지 않았는데, 이렇게 알아봐 주시니 감복, 또 감복이옵니다."
10055170-73 = "뭐, 시시한 인사는 이쯤으로 해두고~ 본론으로 들어가고자 하는데요~"
10055170-74 = "……음, 카호, 부탁할게."
10055170-75 = "네?! 여기까지 말하고 빠지는 건가요?!"
10055170-76 = "어차피 나는 객원이고~"
10055170-77 = "어휴…… 크흠. 일단, 저희 음양부가 이렇게 찾아온 이유는."
10055170-78 = "바로 만마전에 <게승전>을 신청하기 위함입니다."
10055170-80 = "게승전……? 크랩 파이트가 아니야?"
10055170-81 = "후후, 세간에는 그런 식으로 알려진 모양입니다만, 실은 이건 백귀야행 한 지방의 유서 깊은 전통문화에서 비롯하였는데요……."
10055170-82 = "카호, 카호. 너무 길어지니까."
10055170-83 = "아, 그렇네요. 아무튼, 같은 것이라 보시면 됩니다."
10055170-84 = "뭐, 저희는 구경꾼이지만요~ 냐핫~"
10055170-85 = "그 말 그대로! 마음 같아서는 제가 분투하고 싶습니다만……!"
10055170-86 = "이 대회의 꽃은, 게와의 유대감을 가진 <크랩 파이터>-!"
10055170-87 = "즉, 와라쿠 공주님이 가장 빛날 수 있는 장소입니다!"
10055170-88 = "응~ 나랑 승부하면 돼~"
10055170-89 = "뭐?! 승부니 뭐니, 나는 싫은데……."
10055170-90 = "호오~ 호오~"
10055170-91 = "그리 말씀하신다면, 이번 승부는 저희 부전승…… 이라는 형태로 정리해도 괜찮을까요?"
10055170-92 = "상관없어. 애초에 나는 천하게일인지 뭔지 그 대회에 별 관심 없고."
10055170-93 = "후후, 그렇게 말씀하신다면, 만마전의 별을 부디……."
10055170-95 = "앗! 안 돼!"
10055170-96 = "이부키 쨩?"
10055170-97 = "별이 없어진 걸 알면, 마코토 선배가 슬퍼할 거야!"
10055170-98 = "별을 가져가려면, 이부키랑 먼저 승부해!"
10055170-99 = "뭐? 이부키 쨩이 승부라니…… 그렇게 위험한 걸 시킬 수는 없어!"
10055170-101 = "아니, 별로 위험하지는 않은데요……?"
10055170-102 = "하필이면 싸움을 싫어하는 나와, 이부키 쨩만 있는 타이밍에 찾아올 줄이야……."
10055170-103 = "……?! 아니, 설마?! 오히려 이 타이밍을 노리고?!"
10055170-104 = "에이~ 설마요~"
10055170-105 = "물론, 마코토 의장님께서 승부할 상대를 찾는 모습이 제법 눈에 띄기는 했습니다만……."
10055170-106 = "그걸 보고서 이 타이밍의 만마전은 약할 거라든지~"
10055170-107 = "그런 노림수를 생각할 리는, 없죠~?"
10055170-108 = "……설마, 정보전에서 밀렸다고?"
10055170-109 = "으으……! 알았어! 내가 상대할게!"
10055170-110 = "오호라?"
10055170-111 = "정보전에서 일방적으로 당하고 물러나는 건, 만마전 정보부장의 자존심으로 허락 못 해!"
10055170-112 = "받아주겠어, 그 게승전!"
10055170-113 = "……이건, 조금 예상하지 못한 국면으로 흘러가네요~"
10055170-114 = "뭐, 이것도 일흥! 즐겨봅시다!"
10055170-116 = "이름."
10055170-117 = "으, 응?"
10055170-118 = "알려줘야 해."
10055170-119 = "……쿄고쿠 사츠키야. 말하고 다니지 마. 아무한테나 알려주는 이름이 아니니까."
10055170-120 = "응, 그러면 시작할게-"
10055170-121 = "도전자 쿄고쿠 사츠키의 게승전을 수락할게-"
10055170-122 = "참관인은 선생님. 보증인은 니야 부장이랑, 카호 부부장."
10055170-123 = "뭐, 뭔가 본격적이네?"
10055170-125 = "말씀드렸다시피 게승전은 기나긴 역사가 쌓인 유구한 전통이기 때문에."
10055170-126 = "그러면 두 사람과, 두 게 모두 자리로……."
10055170-130 = "정정당당히 승부!!"
