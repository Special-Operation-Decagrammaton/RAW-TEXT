[translation]
10055170-1 = "光與影交會的特技表演"
10055170-2 = ""
10055170-3 = "晚霞好漂亮～"
10055170-4 = "是啊。"
10055170-5 = "像這樣不用擔心生存、悠閒度日的時光，不知道時隔多久了呢。"
10055170-6 = ""
10055170-8 = ""
10055170-10 = ""
10055170-11 = "大家都聚在這裡啊？"
10055170-12 = "啊，皐月前輩。"
10055170-13 = "……真琴前輩呢？你們不是在一起嗎？"
10055170-14 = "嗯～真琴醬好像很喜歡蟹鬥，現在還在到處找人對決呢。"
10055170-15 = "我因為腳痛又有點累，所以就把後面的事交給千秋先回來了。"
10055170-16 = "……只讓他們兩個待在一起，真的沒問題嗎？"
10055170-17 = "誰知道呢？說不定會闖禍吧？#n不過我在那之前就溜了，所以出事了也跟我無關。"
10055170-18 = "我好像有點理解皐月前輩能跟真琴前輩維持這麼久交情的秘訣了……"
10055170-19 = "唔嗯……"
10055170-20 = "……唉，真是的，雖然真的真的很麻煩……"
10055170-21 = "但要是闖了禍才去收拾只會更麻煩……"
10055170-22 = "我去接他一下。#n老師和皐月前輩就在這裡幫忙看著伊吹吧。"
10055170-23 = ""
10055170-25 = ""
10055170-27 = "沒問題～伊吹醬很乖，照顧他根本不算什麼～"
10055170-28 = ""
10055170-30 = ""
10055170-31 = ""
10055170-32 = ""
10055170-33 = "……"
10055170-34 = "……你是誰？"
10055170-35 = "啊，皐月前輩！"
10055170-36 = "這位是知世姐姐！伊吹跟知世姐姐成為朋友了！"
10055170-37 = "就過了那麼一下子？"
10055170-38 = ""
10055170-40 = ""
10055170-41 = "……真可疑。"
10055170-42 = "那邊的你，可以跟你聊一下嗎？"
10055170-43 = "貝殼～"
10055170-44 = "嗯……？"
10055170-45 = "追著追著，就到這裡了。"
10055170-46 = ""
10055170-47 = "光與影交會的#n特技表演"
10055170-50 = ""
10055170-52 = "是誰放的呢？"
10055170-53 = "……應該沒有人放吧？"
10055170-54 = "那為什麼會在那裡？"
10055170-55 = "這個嘛……世界上有很多會讓東西移動的力量，像是潮流或風之類的。"
10055170-56 = "就算是我，也很難預測那些呢。"
10055170-57 = "大海好厲害呢。"
10055170-58 = "哎呀，還挺行的嘛，居然懂得大自然的偉大。#n那你應該也知道大海有多危險吧？"
10055170-59 = "危險？"
10055170-60 = "沒錯，大海裡潛藏著無數危險。#n炙熱的太陽、洶湧的海浪、虛脫和脫水的危險……"
10055170-61 = "陽光暖暖的，我喜歡。"
10055170-62 = "……看來我們的意見分歧了呢。"
10055170-63 = "喵哈～"
10055170-64 = ""
10055170-66 = ""
10055170-69 = ""
10055170-70 = "真是失禮了～我們知世好像受你們照顧了呢。"
10055170-71 = "哎呀，你是……百鬼夜行的陰陽部部長？"
10055170-72 = "哦～我刻意沒有自我介紹卻還是被認出來了……真是令人佩服。"
10055170-73 = "那麼，無聊的寒暄就到此為止～我們進入正題吧～"
10055170-74 = "……嗯，佳穗，拜託你了。"
10055170-75 = "咦！？都說到這裡了才要丟給我嗎！？"
10055170-76 = "畢竟我只是來客串的嘛～"
10055170-77 = "唉……咳咳。我們陰陽部這次前來拜訪的理由是……"
10055170-78 = "為了向萬魔殿提出「蟹承戰」的挑戰。"
10055170-80 = "蟹承戰……？不是蟹鬥嗎？"
10055170-81 = "呵呵，世間似乎是那樣流傳的，但這實際上是百鬼夜行某處流傳已久的傳統文化……"
10055170-82 = "佳穗，佳穗，再說下去就要沒完沒了了。"
10055170-83 = "啊，說的也是。#n總之，您可以把它們視為同一種東西。"
10055170-84 = "不過我們也只是看熱鬧的就是了～喵哈哈～"
10055170-85 = "正是如此！要是可以的話，我真想親自上場奮戰……！"
10055170-86 = "這場大會的焦點，正是與螃蟹心意相通的「蟹鬥士」！"
10055170-87 = "也就是和樂公主最能大放異彩的舞台！"
10055170-88 = "嗯～跟我對決就好了～"
10055170-89 = "什麼！？什麼對決不對決的，我才不要……"
10055170-90 = "哦～哦～"
10055170-91 = "既然您這麼說，那這次的對決就算我們不戰而勝……這樣可以嗎？"
10055170-92 = "無所謂。反正我本來就對什麼天下一蟹之類的大會沒興趣。"
10055170-93 = "呵呵，既然您這麼說，那萬魔殿的星星就麻煩您……"
10055170-95 = "啊！不行！"
10055170-96 = "伊吹醬？"
10055170-97 = "要是知道星星不見了，真琴前輩會難過的！"
10055170-98 = "想拿走星星的話，就先跟伊吹對決！"
10055170-99 = "什麼？讓伊吹醬去對決……我怎麼能讓他做那麼危險的事！"
10055170-101 = "不是，其實也沒有多危險吧……？"
10055170-102 = "偏偏挑只有討厭打架的我和伊吹醬在的時候找上門來……"
10055170-103 = "……！？等等，難道你們是故意選在這個時機！？"
10055170-104 = "哎呀～怎麼可能嘛～"
10055170-105 = "雖然真琴議長到處找人對決的模樣，確實挺引人注目的……"
10055170-106 = "看到之後就心想「現在的萬魔殿應該很弱」之類的～"
10055170-107 = "我們怎麼可能會打這種算盤嘛～對吧？"
10055170-108 = "……難道說，我在情報戰中落於下風了？"
10055170-109 = "唔……！好吧！就由我來當你的對手！"
10055170-110 = "哦？"
10055170-111 = "在情報戰中被單方面壓制後就這樣退縮，我身為萬魔殿情報部長的自尊可絕不允許！"
10055170-112 = "這場蟹承戰，我接受了！"
10055170-113 = "……這下局勢的發展變得有點出乎意料了呢～"
10055170-114 = "不過這也算是一種樂趣！我們就好好享受吧！"
10055170-116 = "名字。"
10055170-117 = "嗯？"
10055170-118 = "要告訴我才行。"
10055170-119 = "……我是京極皐月。#n別到處宣揚，這可不是隨便能告訴別人的名字。"
10055170-120 = "嗯，那麼要開始了～"
10055170-121 = "我接受挑戰者京極皐月的蟹承戰～"
10055170-122 = "見證人是老師。保證人是仁耶部長和佳穗副部長。"
10055170-123 = "感，感覺很正式呢？"
10055170-125 = "誠如我先前所說，蟹承戰是有著悠久歷史的傳統。"
10055170-126 = "那麼請雙方，還有雙方的螃蟹都就位……"
10055170-127 = ""
10055170-129 = ""
10055170-130 = "堂堂正正地一決勝負！！"
