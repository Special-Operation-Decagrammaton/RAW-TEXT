[translation]
84312101000-6 = "리오……!! 리오……!!!"
84312101000-7 = "상황은 이미 파악했어. 당장 움직여야 해."
84312101000-8 = "실화냐…… 마지막의 마지막까지……"
84312101000-9 = "네가 말했던 감이라는 게 이거였구만?"
84312101000-10 = "그랬던 거 같네요."
84312101000-11 = "어제 저녁까지만 해도 엑스포 시연장과 캠퍼스 근처에는 존재하지 않았어. 그렇다는 건 멀리 나갔다가 돌아왔다는 거겠지."
84312101000-12 = "저 정도의 크기가 그럴 수 있는…… 그게 가능한 루트는 하나뿐이야."
84312101000-13 = "……지하도."
84312101000-14 = "처음 저희가 만났던 곳이로군요."
84312101000-16 = "이런 식의 수미상관은 별로 원하지 않았는데 말이지."
84312101000-17 = "시간이 없어. 여기서 놓치면 또 언제 다시 돌아올지, 아니면 아예 다른 학교로 넘어가 버릴지 예측하기 어려워져."
84312101000-18 = "쫓아가서 붙잡도록 하자. 이번에야말로."
84312101000-19 = "후후, 마지막으로 받는 깜짝선물이네요."
84312101000-20 = "선물이라니……"
84312101000-21 = "하……! 뭐, 좋아. 솔직히 나도 아주 조금은 비슷한 느낌이었으니 차라리 잘 됐지."
84312101000-22 = "이번에는 나도 원격으로 지원하겠어. 상황이 상황이니만큼, 전투에서의 서포트도 필요할 거야."
84312101000-27 = "가 보자고! 최종전이다!!"
84312101000-28 = "네!"
