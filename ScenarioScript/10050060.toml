[translation]
10050060-1 = "제6화;아무도 없는 곳"
10050060-4 = "모두 모이셨나요, 여러분?"
10050060-5 = "네, 넷!"
10050060-6 = "아시다시피 우리는, 트리니티에 암암리 퍼져 나가고 있는 비인가 도서의 조사 및 추적 임무를 수행하고 있습니다."
10050060-7 = "하지만 며칠이 지나도록, 좀처럼 수사의 진척이 나가고 있지 않은 것도 사실이죠."
10050060-8 = "네……."
10050060-9 = "바로 어제, 나기사 님께서 이번 임무의 진행 상황에 대해 진심으로 우려를 표하셨습니다."
10050060-10 = "나, 나기사 님께서, 직접요?!"
10050060-11 = "그렇습니다……. 이것이 저 혼자만의 무능이라면, 달게 받아들일 수 있습니다."
10050060-12 = "그러나 이것이 우리 정의실현부의, 정의를 실현하고자 하는 의지에 대한 문제라면……."
10050060-13 = "그리고 나아가 트리니티의 정의 그 자체에 대한 근본적인 문제라면!"
10050060-15 = "우리는 마땅히! 우리의 존재 가치를 스스로 증명해야 할 것입니다!"
10050060-16 = "아, 알겠습니다!"
10050060-17 = "그런데…… 그러려면, 어떻게 해야 할까요?"
10050060-18 = "저에게, 한 가지 방안이 있습니다."
10050060-19 = "사실 누구나 생각할 수 있는 방안이겠습니다만, 현재 상황으로는 이보다 나은 대책도 쉽게 찾을 수 없을 것 같군요."
10050060-20 = "상황이 어려울수록, 기책보다는 상책을 되돌아보아야 한다고 하죠. 그러니, 지금부터……."
10050060-21 = "정의실현부가 사용할 수 있는 모든 색적 자원을, 트리니티 전역으로 확장하고자 합니다!"
10050060-22 = "언제, 부터요……?"
10050060-23 = "바로 지금, 이 순간부터입니다! 여러분, 무리한 부탁이라는 것은 알고 있습니다. 그렇지만 조금만 더 힘을 내주셨으면 합니다."
10050060-24 = "저 역시 누구보다 솔선해서, 먼저 현장을 돌보도록 하겠습니다!"
10050060-28 = "가, 같이 가요. 마시로 씨~!"
10050060-44 = "……오늘, 한 권도 못 팔았네요……."
10050060-45 = "그렇다고 할까, 판매 장소 자체를 찾을 수 없었죠……."
10050060-46 = "정의실현부라고 했던가요? 그 검은 교복 입은 학생들. 왜 오늘따라 이렇게 여기저기에 자주 보이는 걸까요?"
10050060-47 = "으음……. 붉은겨울에서 살아남아 온 원동력 중 하나인, 저의 출판부장 위험 센서가 강력하게 반응하고 있네요."
10050060-48 = "호, 혹시 우리 정말로 들킨 것은 아닐까요?!"
10050060-53 = "공녀님! 그리고 그 시녀분! 여기에 계셨군요!"
10050060-54 = "……! 네, 네에……. 평안, 하셨는지요."
10050060-55 = "……언제 시녀 취급이 된 건가요, 이거……."
10050060-56 = "평안하셨는지요. 두 분. 상황이 상황인지라, 다소 다급하게 말씀을 드려야 할 것 같아요. 무례를 용서해 주세요."
10050060-57 = "괘, 괜찮, 답니다. 무슨 일이신가요?"
10050060-58 = "네……. 결론부터 말씀드리자면, 지금 트리니티의 정의실현부 절반 정도가, 두 분을 찾고 있답니다."
10050060-59 = "……역시 그렇게 된 것이군요. 더불어 정의실현부 분들이 오늘따라 순찰을 강화하고 계신 것처럼 보이는 것도……."
10050060-60 = "네. 전부 그 연장선상에서 일어나는 일이죠. 그리고 그 때문인지…… 트리니티에 전반적으로, 공포 분위기가 약간 조성된 것 같아요……."
10050060-61 = "공포 분위기라니……! 저희, 때문이군요? 죄송합니다. 몸 둘 바를 모르겠네요……."
10050060-62 = "아뇨, 아니에요! 생각해 보니 공포까지는 아닌 것 같기도 하고……. 무엇보다 공녀님께서 잘못하신 것은 하나도 없어요!"
10050060-63 = "……지금 교과서 외의 다른 책을, 모두 숨기려고 하고 있는 것은 사실이지만요……."
10050060-64 = "죄송해요. 공녀님. 이 이상…… 적극적으로 도와드리는 것은 어려울 것 같아요."
10050060-65 = "아니어요. 지금까지 도와주신 것만으로도, 차고 넘칠 만큼 감사의 말씀을 드릴 수밖에 없을 것 같으니까요."
10050060-66 = "불쌍한 공녀님……. 트리니티까지 와서도 끝없이 고초를 겪으셔야 한다니……. 흑……."
10050060-68 = "저도 위로 좀 해 주셨으면 좋겠는데 말이에요……."
10050060-69 = "아무튼, 이제부터는 정의실현부 부원들이 없는 곳으로 피하시는 게 좋을 것 같아요."
10050060-70 = "거기가 어딘데요?"
10050060-71 = "죄송해요……. 저희도 거기까지는 잘 모르겠어요."
10050060-72 = "하지만 공녀님께서는 오히려 외부인이시니까, 외부인의 시선에서만 찾을 수 있는 안전한 곳이 있지 않을까요?"
10050060-73 = "부디 몸조심해 주세요. 공녀님. 다음에는 조금 더 마음 편하게 트리니티를 방문하셔서, 멋진 추억을 쌓을 기회가 있으셨으면 하네요."
10050060-74 = "아닙니다. 멋진 추억이라면 이미 충분히 쌓았으니까요. 배려에 다시 한번 감사드립니다."
10050060-75 = "천만의 말씀이세요!"
10050060-80 = "……어디에서부터 잘못된 걸까요……."
10050060-81 = "사실 처음부터가 아니었을까요……. 정말 이거 맞나요, 부장님?!"
10050060-82 = "……솔직히, 이젠 저도 잘 모르겠습니다……. 하지만, 끝까지 가는 게 중요하지 않을까요?!"
10050060-83 = "때와 상황에 따라서는, 끝까지 가는 게 중요하지 않을 수도 있지 않을까요……."
10050060-84 = "어쨌든! 아까 학생분이 말해 준 것처럼 정의실현부 부원들이 가지 않는 곳을 찾아봅시다."
10050060-94 = "일단, 몸을 좀 더 숨기고요……."
10050060-95 = "우으…… 이럴 때 선생님이 계셨더라면……."
10050060-99 = "부장님. 저곳은 그나마 괜찮아 보이는데요……?"
10050060-100 = "그러네요. 그나마 정의실현부 부원들이 적어요."
10050060-101 = "정의실현부 부원들이 적다기보다는, 학생들 자체가 없는 것 같은 느낌도 들지만요……."
10050060-102 = "지금은 오히려 그쪽이 잘 된 것 아닐까요?"
10050060-112 = "여긴…… 도서관인가요? 그런 것처럼 보이네요."
10050060-117 = "단순한 도서관이라고 보기에는 뭔가 다른 것 같은 느낌이 드는데요……?"
10050060-118 = "비치된 책들이 제법 오래된 것들이에요. 그렇지만 보관 상태가 상당히 좋은 편이군요."
10050060-119 = "그렇다면 누군가 아주 전문적인 관리자가 있다는 뜻인데……."
10050060-123 = "어라……?"
10050060-131 = "타카네? 무슨 일이라도 있나요?"
10050060-138 = "으아아아아악?!"
10050060-139 = "도서관에서는, 조용히."
10050060-145 = "하아……. 또 바깥사람들이……. 쯧."
10050060-146 = "……?? 음? 그런데 이 사람들, 트리니티 사람 같지는 않은데……?"
10050060-147 = "거기에 뭔가, 책 같은 걸 많이 들고 온 것처럼 보이고……."
10050060-149 = "어어, 그러니까…… 자세한 사정은 잘 모르겠고, 특별히 이해하고 싶지 않지만……."
10050060-150 = "아무튼, 출판과 유통에 관련 분들이라는 거죠……?"
10050060-151 = "네, 네에. 그렇답니다. 코제키 우이 씨. 소란을 피워서 죄송해요."
10050060-152 = "아뇨, 뭐……. 그런 부분은 잘 알고 계신 것 같고……. 거기에 '이쪽' 분들인 것도 같고……."
10050060-153 = "무엇보다 이렇게…… 아이들을 잔뜩 가지고 다니고 계시니까……."
10050060-154 = "아이들……??"
10050060-155 = "……아, 죄송……. 책들……. 말이었어요."
10050060-156 = "그러고 보니, 우이 씨는 이 고서관을 관리하시는 도서부의 부장이라고 하셨죠?"
10050060-157 = "트리니티의 중앙 도서관은 키보토스 최대 규모의 도서관이며, 세상에 존재하는 모든 장서가 전부 소장되어 있다고 하던데."
10050060-158 = "그런 곳을 직접 볼 수 있게 되다니, 영광이네요."
10050060-159 = "잘됐네요, 타카네. 여기에 한번 와 보고 싶어 했잖아요?"
10050060-160 = "어…… 음…… 그 소문은 약간, 과장이 섞인 것이기는 하지만요……. 그래도 가능한 한, 많은 아이들을 보호하려고 노력하는 것은 사실이긴 하죠……."
10050060-161 = "아하. 그렇군요. 그렇다면 역시 책을 연체하는 학생들을 응징하려다가, 건물 하나를 불태워 버렸다는 것도 과장된 소문이었겠네요."
10050060-162 = "아뇨. 그건 사실인데요."
10050060-163 = "?!"
10050060-164 = "아이들을 소중히 여길 줄도 모르는 바깥사람들에게는, 그 정도도 관대한 처분이에요."
10050060-165 = "아무튼, 두 분의 아이……책들은…… 잘 읽어 보았어요."
10050060-166 = "……잘, 만들었더군요. 개인적으로는 꽤 좋았어요."
10050060-167 = "네? 이, 일단 그거, 만화책인데요……?"
10050060-168 = "……? 그래서요? 만화책은 책 아니에요?"
10050060-170 = "그, 그리고 트리니티 분들의 반응에 따르면, 가령 수위 같은 부분에서 걸리는 부분이 있다고도 하시던데요……?"
10050060-171 = "그런가요? 뭐……. 바깥사람들이 보기에는, 조금 부끄러운 부분도 있을 수도 있겠네요."
10050060-172 = "그것도 평소에 책을 안 보니 내성이 없는 거겠지만요. 정말이지."
10050060-173 = "……그나저나 조금 전 이야기로는, 정의실현부가 두 분을 쫓고 있다고 하셨죠?"
10050060-174 = "네, 네에. 불미스럽게도……."
10050060-175 = "정의실현부가 단독으로…… 이런 사소한 일에 그 정도의 전력을 투입할 리는 없으니……."
10050060-176 = "……."
10050060-177 = "……티파티겠군요."
10050060-178 = "어, 어라? 그 부분은 말씀 안 드렸던 것 같은데……?!"
10050060-179 = "그 정도야, 뭐……."
10050060-180 = "이래서 높으신 분들이란…… 이게 어떤 가치를 가졌는지도 모르면서……. 쯧."
10050060-181 = "아무튼, 여기에서 당분간 지내도록 하세요. 어느 정도는 편의를 봐드리죠."
10050060-182 = "그, 그렇게 민폐를 끼쳐도…… 되는, 걸까요?"
10050060-183 = "……어디까지나 '이쪽' 분들인 것 같아서 하는 말이니까, 과대 해석은 하지 말아 주시고요……. 너무 오래 계셔도, 조금 곤란하기도 하고……."
10050060-184 = "이야, 이거 감사합니다. 우이 씨. 그러면 당분간이나마 신세 지도록 할게요!"
10050060-185 = "그리고, 또 하나."
10050060-186 = "네, 네?"
10050060-187 = "부담스러우니, 3m 정도 거리를 유지해 주세요……."
10050060-189 = "네……?"
10050060-190 = "아니면, 퇴거를 요청할 수밖에 없으니까요……."
10050060-191 = "음……. 네. 그것이 이곳의 룰이라면 어쩔 수 없죠."
10050060-192 = "룰 같은 것은 아니고, 그…… 엄밀히 따지자면 제 쪽 문제이기는 한데……."
10050060-193 = "네? 지금 뭔가 말씀하셨나요, 우이 씨?"
10050060-194 = "……3m."
10050060-195 = "네, 네에……."
10050060-199 = "우리, 이대로 괜찮은 걸까요. 부장님……?"
10050060-200 = "냉정하게 보자면…… 이대로는 안 되겠죠……."
10050060-201 = "하지만 당장 무언가를 시도할 형편조차 되지 않는다는 것 역시 사실이고요."
10050060-202 = "생각해 둔 방안이라도 있으세요……?"
10050060-203 = "일단 이곳에 있어도 좋다는 허락을 받았으니……. 쭉 숨어 있다가 잠잠해지면, 조용히 붉은겨울로 돌아갈 방법을 찾아보도록 하죠."
10050060-207 = "그런 눈으로 보지 말아요……. 저도 이게 최선은 아닐 거라는 것 정도는 알고 있으니까요."
10050060-208 = "하지만 살다 보면, 하나밖에 없는 선택지를 골라야 할 때가 있는 법이잖아요?"
10050060-209 = "그럼 저는 안쪽에서 조금 쉬고 있겠습니다. 무슨 일이 생기면 알려 줘요."
10050060-213 = "부장님은 그렇게 말씀하셨지만……."
10050060-214 = "우우. 이런 일보다는 좀 더, 무언가 근사하고 기특한 일로 연락드리고 싶었는데……."
10050060-220 = "[ns] \"어라? 이 번호는……?\""
10050060-222 = "아, 안녕하세요. 선생님. 평안하셨는지요?"
10050060-223 = "이렇게 갑작스럽게 연락드리게 된 것은, 다름이 아니라……."
10050060-224 = "으으, 어디에서부터 말씀드려야 하는 걸까요……."
10050060-225 = "[s] \"괜찮으니까, 일단 떠오르는 이야기부터 해 봐.\""
10050060-226 = "알겠습니다……. 일단 저희는 지금, 어쩌다 보니 트리니티에 와 있는데요……."
10050060-227 = "[s] \"어? 나도 지금 트리니티에 와 있는데?\""
10050060-228 = "네?! 선생님도요?!?!"
