[translation]
1600215-1 = "특이한 안경"
1600215-2 = "(혹시나 하는 마음에, 걱정이 되어 밀레니엄으로 찾아갔다.)"
1600215-3 = "아, 선생님!!"
1600215-7 = "어라, 밀레니엄에는 어쩐 일이신가요! 뭔가 업무라도 있으신 걸까요?"
1600215-8 = "아, 아니라고요? 그러면 그냥 개인적인 용무……로?"
1600215-9 = "……네? 저요?"
1600215-10 = "저를 보러 오셨다고요?"
1600215-11 = "……어째서?"
1600215-13 = "(코토리에게 간단히 찾아온 정황을 설명해 주었다.)"
1600215-15 = "어라……."
1600215-16 = "으, 으음……. 그렇군요……."
1600215-17 = "죄, 죄송해요. 본의 아니게 선생님께 신경 쓰이는 일을 만들어 버렸습니다……."
1600215-18 = "오히려 저 때문에 여기까지 찾아와 주실 거라고는 생각도 못 하고 있었던 지라……. 그동안 말이 너무 편하게 나갔나 봐요."
1600215-19 = "그치만 안경은 보시다시피 무사히 수리가 끝났고……. 지금은 다행히 아무 문제 없습니다!"
1600215-20 = "으, 으음. 아닌가? 다행이 아닐지도……."
1600215-21 = "선생님께서 굳이 와 주셨는데, 아무 보람도 없이 돌아가시게 된 거니 오히려 안 좋은 걸……까요?"
1600215-22 = "[s1] \"확인한 걸로도 기쁘니 괜찮아.\"\n[s2] \"오랜만에 코토리를 본 것만으로도 좋아.\""
1600215-25 = "으, 으으……."
1600215-26 = "그렇게 말씀해 주시다니…… 더 몸 둘 바를 모르겠네요……"
1600215-27 = "……네?"
1600215-28 = "그러고 보니 궁금한 게 생기셨다고요?"
1600215-32 = "……궁금한 것……!?"
1600215-33 = "그게 뭐죠, 선생님? 무엇이 궁금하신 거죠!?"
1600215-34 = "뭐든지 물어봐 주세요, 선생님! 이 토요미 코토리, 아는 거라면 반드시 설명해 드리겠습니다! 모르는 거라면, 모르는 것대로 알아봐서 말씀드릴게요!"
1600215-35 = "찾아와 주신 것에 대한 보답을 위해서라도, 반드시!!"
1600215-36 = "[s3] \"괜찮아?\"\n[s4] \"뭐든지?\""
1600215-39 = "네!! 물론이죠!!"
1600215-40 = "괜찮습니다!! 뭐든지!!"
1600215-44 = "[ns] \"……그럼…….\""
1600215-48 = "[ns5] \"그 안경은 특별히 의미가 있는 거야?\"\n[ns6] \"소중하게 쓰고 다니는 것 같아서.\""
1600215-51 = "아, 그렇군요! 이 안경 말씀이시죠! 이건……!!"
1600215-55 = "……에."
1600215-56 = "아, 안경……. 제 안경이요? 이건…… 어……."
1600215-61 = "어라, 질문의 방향이 생각지도 못했던 부분이라 순간 머릿속이……."
1600215-62 = "게다가 약간 이런 일이 전에도 몇 번 있었던 것 같은……. 데자뷰가……."
1600215-63 = "아하하……. 어쩐지 저에 대한 질문을 해주실 때에는 늘 이런 느낌이 드네요."
1600215-64 = "으으으……."
1600215-65 = "……아니지, 안 되죠. 안 돼!"
1600215-66 = "정신 차려야 합니다. 선생님께서 궁금해하시는 건, 뭐든지 설명 드리겠다고 했으니까요!"
1600215-67 = "음음, 후- 스읍-. 후우우우-."
1600215-68 = "[s7] \"대답하기 어려우면 안 해도 괜찮아.\"\n[s8] (심호흡까지 해야 할 일이었나…….)"
1600215-73 = "조금은 진정이 되네요. 그럼 약속대로, 설명해 드리겠습니다!"
1600215-74 = "……사실 그리 대단한 것도 아니지만요."
1600215-76 = "선생님. 이 안경의 이쪽을 봐주세요. 생긴 게 조금 특이한 안경이죠?"
1600215-77 = "이런 형태 탓에 한쪽은 알을 새로 맞추는 것도 꽤 어렵고 말이죠."
1600215-78 = "하지만 이 안경에는, 보통 안경에는 없는 효과가 있어요."
1600215-79 = "오히려 어느 정도는, 저 스스로가 의도한 안경이거든요!"
1600215-80 = "아시다시피 저는 이런저런 설명을 많이 하잖아요? 그리고 그 설명들은 가끔 조금 길어질 때도 있고 말이에요."
1600215-81 = "이 안경은 그런 때에 설명을 들으시는 분들의 시선을 붙잡을 수 있게……."
1600215-82 = "말하자면 눈을 둘 포인트? 같은 느낌으로 쓰고 다니는 거예요. 이래 봬도 생각보다 꽤 효과가 있답니다!"
1600215-83 = "[s9] \"……! 호오.\"\n[s10] \"의외로 실용적이었네?\""
1600215-87 = "후, 후, 후. 역시 알아주시는군요. 선생님."
1600215-88 = "이런 사소한 것 하나하나가 다른 분들께 뭔가를 설명할 때에, 집중력을 보조해 주고 정보 전달이 잘되도록 도와주는 법이랍니다!"
1600215-89 = "……요즘은 그마저도 너무 나갔는지, 이 안경만 보면 다들 도망치는 상황이 돼버렸지만요."
1600215-90 = "[s11] (……과연.)\n[s12] \"이제는 그냥 아이덴티티가 됐구나.\""
1600215-93 = "네. 그래도 가끔……. 처음 설명을 들으시는 분들께는 아직 효과가 있죠."
1600215-94 = "실은 이번에 안경이 부서졌을 때, 이왕 이렇게 된 거 관리도 쉬운 평범한 안경으로 돌아갈까……라는 생각을 하긴 했었는데요."
1600215-98 = "[ns13] \"……코토리?\"\n[ns14] \"말이 없어졌다?\""
1600215-101 = "……헤헤."
1600215-102 = "아무래도 역시, 계속 쓰고 다니는 게 좋은 거 같아요."
1600215-103 = "가끔은 이렇게, 설명 이외에도 좋은 일을 가져다주는 안경이었네요!"
1600215-105 = "(이후 코토리와 함께 잡담을 더 나눈 후, 가볍게 식사를 하고 샬레로 돌아왔다.)"
