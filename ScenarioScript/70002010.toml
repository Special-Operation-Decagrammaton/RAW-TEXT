[translation]
70002010-1 = "키라라와 에리카의 반짝반짝한 하루 1"
70002010-3 = "립밤, 오케이, 헤어롤, 오케이!"
70002010-4 = "내일 준비물도 다 챙겼고, 슬슬 잘 준비를 해 볼까나."
70002010-5 = "내일은 또 어떤 일이 기다리고 있을지—"
70002010-9 = "어라? 새 알림?"
70002010-10 = "어디……."
70002010-11 = "아, 구독 중인 웹 드라마 채널에…… 새 동영상?"
70002010-12 = "자려고 했지만 이건 못 참지!"
70002010-13 = "어디……."
70002010-14 = "우리 학창 시절의 추억을 만들어 가는 거야!"
70002010-19 = "청춘의 꽃은 역시……!"
70002010-25 = "……!"
70002010-31 = "키라라 쨩, 집에 가자!"
70002010-32 = "……."
70002010-34 = "뭐 해, 멍하니 앉아서?"
70002010-36 = "우앗? 에리 쨩? 언제 왔어?!"
70002010-37 = "온 것도 몰랐던 거야? 집에 가야지? 종 쳤잖아."
70002010-38 = "아, 응, 가야지."
70002010-39 = "키라라 쨩, 오늘따라 조금 멍한 느낌인데. 무슨 일 있어?"
70002010-40 = "으, 응? 딱히, 아무 일도 없는데?"
70002010-41 = "어제 늦게 자서 그런가~ 아하핫!"
70002010-46 = "……?"
70002010-49 = "응! 오늘 오후도 좋은 느낌이네!"
70002010-50 = "오늘 귀갓길에는 어떤 일이 일어날까나~"
70002010-51 = "앗! 저기 봐 에리 쨩!"
70002010-52 = "응?"
70002010-59 = "아, 저기 가는 학생……."
70002010-60 = "응응! 학교 앞 카페의 한정판 버블티를 들고 있잖아!"
70002010-61 = "저거 먹어보고 싶었는데, 어떻게 구했으려나?"
70002010-62 = "궁금하면 직접 물어보면 되지! 가서 말 걸어 보자!"
70002010-66 = "……또 시작됐네."
70002010-71 = "얏호! 안녕! 반가워!"
70002010-72 = "어, 어?! 누구?"
70002010-73 = "응! 나는 키라라고, 이쪽은 에리 쨩!"
70002010-74 = "에리카라고 해야지, 키라라 쨩."
70002010-75 = "아무튼, 집에 가는 길이야?"
70002010-76 = "아, 으, 응. 근데 왜?"
70002010-78 = "잠깐만 시간 괜찮아? 플리즈~!"
70002010-79 = "으, 응, 뭐, 안 되는 건 아닌데……."
70002010-80 = "땡큐땡큐! 별 건 아니고, 지금 마시고 있는 버블티 말야, 한정판이라 완전 구하기 어려운 거라고 알고 있거든!"
70002010-81 = "그런 걸 마시고 있는 걸 보니까 사실은 맛집의 은둔 고수?! 라는 생각이 들어서!"
70002010-82 = "가르침을 받으러 찾아왔습니다, 라는 느낌?"
70002010-83 = "오버하기는."
70002010-84 = "뭐, 그런 용건이야. 귀찮게 해서 미안해."
70002010-85 = "그거, 우리도 마셔보고 싶어서 오랫동안 찾아갔는데 매번 실패했거든."
70002010-86 = "아…… 그렇구나."
70002010-87 = "나도 구하기 어렵다는 소문은 들어서, 등교할 때 미리 예약해 놨었어."
70002010-88 = "그랬구나! 등교할 때 예약이라니, 생각도 못 했네! 그게 가능했구나!"
70002010-89 = "알려줘서 고마워! 답례로 내가 아는 크레이프 맛집도 알려줄게!"
70002010-90 = "친구 된 기념으로!"
70002010-91 = "치, 친구? 그치만 우리, 만난 지 5분도 안 됐고……."
70002010-92 = "이렇게 만났으니 친구지, 뭐!"
70002010-93 = "그, 그런가……?"
70002010-94 = "응응! 물론이지!"
70002010-96 = "참, 그리고 한 가지 말해 두고 싶은 게 있는데."
70002010-97 = "응? 뭔데?"
70002010-98 = "이 버블티, 생각보다 그렇게 맛있지는 않—"
70002010-104 = "어라?"
70002010-105 = "우왓! 디저트 카페가 터졌다!"
70002010-106 = "뭐? 식당이 폭파? 설마……!"
70002010-109 = "후후, SNS에서 유명하다길래 제법 기대를 하고 있었습니다만."
70002010-110 = "수준 이하의 재료. 단순히 SNS를 통한 바이럴 마케팅만을 노린 수법……"
70002010-111 = "이래서야 기대 이하로군요. 기본조차 되어 있지 않다면, 존속할 필요도, 이유도 없는 법이겠지요."
70002010-112 = "으음~ 그래도 자일리톨 오이 샌드위치는 쪼금 괜찮았는데?"
70002010-113 = "그걸 괜찮다고 생각하는 건 너뿐일걸?!"
70002010-114 = "저로선 무한 리필이 아닌 점이 다소 감점 요인이네요~☆"
70002010-115 = "디저트 카페에서 누가 무한 리필을 찾아?! 게다가 애초에 난 제대로 먹지도 못했다고!"
70002010-123 = "현장 적발이다, 미식연구회!"
70002010-125 = "어머."
70002010-126 = "우와앗! 선도부?! 아무리 그래도 출동이 너무 빠른 거 아냐?!"
70002010-128 = "그렇지 않아도 급양부로부터 네 녀석들이 저지른 불온 행동에 대해 신고를 받고 순찰을 돌던 참이다만……!"
70002010-129 = "현장에서 바로 발견할 줄이야!"
70002010-130 = "더구나 디저트 가게까지 폭파하다니! 용서할 수 없어!"
70002010-132 = "그 의견에는 마음껏 반론하고 싶은 기분입니다만. 지금 저희는 그렇게 한가하지 않기 때문에."
70002010-133 = "아카리."
70002010-134 = "네~☆ 그럼 어디, 트럭을 타고 도망쳐볼까요~☆"
70002010-135 = "후퇴라고! 후퇴!"
70002010-141 = "가, 같이 가~~~! 나만 두고 가지 말라구~!"
70002010-147 = "이 녀석들! 놓칠까 보냐……! 투항하지 않으면——"
70002010-155 = "콜록! 콜록! 케헥! 거기 안 서?!"
70002010-156 = "녀석들! 보란 듯이 급양부에서 탈취한 트럭을 타고 도망치다니……!"
70002010-157 = "어이! 거기 귀가부들!"
70002010-159 = "응? 우리?"
70002010-160 = "그래! 손 좀 빌려줘! 이번에야말로 미식연구회 녀석들을 잡아야겠어!"
70002010-161 = "으음, 그렇게 갑자기 부탁해도……."
70002010-163 = "그래! 좋아!"
70002010-164 = "즉답이네. 정말 괜찮아?"
70002010-165 = "트럭 쫓아서 달리는 거, 왠지 재밌어 보이니까! 도와주자!"
70002010-166 = "왠지 재밌어 보이다니, 키라라 쨩답네."
70002010-167 = "좋아, 따라갈게."
70002010-168 = "야호! 에리 쨩 최고!"
70002010-170 = "좋았어! 도와줘서 고마워!"
70002010-171 = "자자, 시간 없으니! 뛰자고!"
70002010-176 = "야호~!"
70002010-181 = "(약 10분 뒤…….)"
70002010-183 = "하아, 하아……."
70002010-184 = "아하핫! 트럭도 선도부 친구도 놓쳐 버렸네!"
70002010-185 = "평소 조금 운동 부족이었을지도?"
70002010-186 = "뭐어, 선도부야 평소 하는 일이겠지만, 달리는 차를 따라잡는 건 우리한테 무리겠지."
70002010-187 = "아하핫! 그래도 재밌었어! 오랜만에 땀 흘리니까 기분도 좋고!"
70002010-188 = "응, 나도 기분 좋은걸."
70002010-193 = "앗, 거기! 두 사람!"
70002010-195 = "응?"
70002010-201 = "뭐 좀 물어봐도 될까? 부활동 중에 길을 잃어버려서 말야!"
70002010-203 = "아, 새로운 친구다!"
70002010-204 = "응, 물론이지! 어디에 가고 싶은데?"
70002010-206 = "고마워! 대강당 건물 앞 사거리에 가고 싶은데, 여기서 어떻게 가나 싶어서!"
70002010-208 = "대강당 건물 앞이라면 그다지 멀지 않네."
70002010-209 = "응! 이쪽 계단을 내려가서 오른쪽으로 쭉 가다가……."
70002010-213 = "말로 하는 것보다 직접 데려다주는 게 좋겠다! 에리카, 어때?"
70002010-214 = "응, 그편이 좋겠네."
70002010-215 = "따라와! 대강당 앞까지 안내해 줄게!"
70002010-217 = "오오! 고마워! 든든한 친구를 만났네!"
70002010-218 = "자, 자, 모두 연장 챙기라구! 이동하자!"
70002010-223 = "이쪽이야!"
70002010-232 = "도착~!"
70002010-233 = "여기가 목적지 맞지? 대강당 앞."
70002010-235 = "그렇네! 부장이 찍어 준 좌표 그대로야!"
70002010-236 = "고마워! 그럼 우린 부활동하러 가 볼게!"
70002010-238 = "유어 웰컴! 잘 가~!"
70002010-245 = "친구를 도와주니 기분 좋은걸!"
70002010-246 = "응, 전에도 귀가하는 길에 이런 일이 몇 번인가 있었지."
70002010-253 = "이런 이벤트 덕분에 귀갓길이 심심하지 않은 거지."
70002010-254 = "늘 다른 일이 벌어지니까."
70002010-259 = "온천개발부다! 또 발파를 시작했어!"
70002010-260 = "다들 떨어져! 휘말리기 전에!"
70002010-264 = "응응! 매일매일이 두근두근, 이라는 거지!"
70002010-265 = "다만…… 조금…… 부족하달까."
70002010-266 = "응?"
70002010-267 = "으음……."
70002010-271 = "아하핫! 아무것도 아냐!"
70002010-272 = "이제 슬슬 돌아갈까나!"
70002010-277 = "자, 갈림길이네."
70002010-278 = "언제나처럼 여기서 헤어져야겠지?"
70002010-279 = "……."
70002010-280 = "키라라 쨩?"
70002010-281 = "……응, 역시 에리 쨩한테 털어놓는 게 좋겠어."
70002010-282 = "아까부터 고민하고 있던 거 말이지?"
70002010-283 = "어, 어라? 나, 그렇게 티를 냈을까나?"
70002010-284 = "함께 지낸 시간이 얼만데. 당연히 눈치채지."
70002010-285 = "머뭇거리는 것 같아서 말은 안 했지만."
70002010-286 = "아하핫! 역시 에리 쨩이야. 숨길 수가 없다니깐."
70002010-287 = "응, 솔직히 말하자면……."
70002010-288 = "이대로는, 뭔가 부족해~ 라는 느낌?"
70002010-289 = "부족해? 뭐가?"
70002010-291 = "청춘이!"
70002010-292 = "두근두근이!"
70002010-293 = "반짝반짝이!"
70002010-294 = "으, 으음……?"
70002010-295 = "조금 더 설명해 줄래? 아무리 나라도 살짝 알아듣기 힘들지도."
70002010-296 = "그러니까 말하자면—"
70002010-298 = "부활동을 하자~! 는 거야!"
70002010-299 = "부활동?"
70002010-300 = "갑자기 무슨 바람이 불어서?"
70002010-301 = "사실은 어젯밤에 <우리들의 청춘 이야기 ~최강의 동아리 활동 편~>을 봤거든!"
70002010-302 = "아, 요즘 재밌게 보고 있다던 웹 드라마?"
70002010-303 = "응응! 거기 주인공들이 동아리 활동을 하는 내용이었는데, 완~전 즐거워 보여서!"
70002010-304 = "나도 동아리 활동이라는 것을 해보고 싶어졌어!"
70002010-305 = "귀가부도 좋지만, 분명 동아리 활동에도 우리가 모르는 뭔가 즐거운 일이 있지 않을까?"
70002010-306 = "오늘 마주친 친구들도, 다들 동아리 활동에 열심이었잖아. 그치?"
70002010-307 = "그렇다면 그 즐거움을 느끼지 못하고 학창 시절을 보내는 건, 완전 손해일지도!"
70002010-309 = "우리, 사실은 학창 시절의 절반 정도는 손해를 보고 있었을지도!"
70002010-310 = "그, 그게 그렇게 되나……?"
70002010-311 = "물론이지! 청춘의 꽃은 동아리라고들 하잖아?"
70002010-312 = "키라라 쨩이 그렇게 생각한다면……."
70002010-313 = "뭐, 좋아. 그럼 방법을 찾아 볼까."
70002010-314 = "앗! 같이 해주는 거야?"
70002010-315 = "키라라 쨩이 같이 하자고 하는 거, 늘 있는 일이잖아?"
70002010-316 = "이번에도 어울려 줄게. 베스트 프렌드니까."
70002010-317 = "와아! 에리 쨩 최고! 고마워!"
70002010-318 = "그럼, 어떤 동아리에 들어가고 싶은데? 생각해 둔 곳 있어?"
70002010-319 = "아니! 이제부터 생각해 보려고!"
70002010-320 = "예상은 했지만, 즉답이네……."
70002010-325 = "그럼 이건 어때?"
70002010-326 = "일단 학교에 체험 입부라는 시스템이 있는 모양이니까……."
70002010-327 = "여러 가지 동아리를 체험해 보면서 들어가고 싶은 동아리를 찾아보는 거지."
70002010-331 = "좋아! 찬성이야!"
70002010-333 = "완전 반짝반짝하고 완전 두근두근한 동아리가 있으면 좋겠네!"
