[translation]
10058090-1 = "第9話;全力を尽くす"
10058090-2 = "もしもーし？183号の方たちですよね？"
10058090-4 = ""
10058090-5 = ""
10058090-6 = "……。"
10058090-8 = ""
10058090-9 = "突然変な顔して、どうしたの？まあ、元々変だけど。"
10058090-10 = "し～っ！し～っ！繋がらないフリしてんだから、空気読んでよ！"
10058090-11 = "運営から良い連絡が来るはずないでしょ！"
10058090-12 = "た、たしかに……！"
10058090-13 = "いえいえいえ！反則とか失格とかではありませんので、ご心配なく！"
10058090-14 = "えー、残りチームが少なくなってきましたので……#n大会ルールに従い、各チームの位置情報をお知らせします。"
10058090-15 = "183号特別クラスの子犬[ruby=パンデモニウム・ソサエティー]号と万魔殿の虎[/ruby]丸号の#n熱い勝負を楽しみにしています！"
10058090-16 = "では、私は再び中継席に戻ります！"
10058090-17 = "え？あ、はい……。"
10058090-19 = ""
10058090-20 = "残りチーム少ないの！？マジ！？"
10058090-21 = "しかもあの虎丸が相手って、やばっ！"
10058090-22 = "本当だ。大体だけど、地図にお互いの位置が記されてる……。"
10058090-23 = "うーん……。"
10058090-24 = "エリナ、これって……。"
10058090-25 = "んー……その……なんていうか……。"
10058090-26 = "チェックをかけられてる。"
10058090-27 = "そう！やっぱりラナが一番賢いね～！"
10058090-28 = "あっちは、私たちが今壊した的が最後のものみたいね。"
10058090-29 = "そうなると、当ててからゴールに近いのはイロハさんのほうか。"
10058090-30 = "スピードは私たちの方が上だから、追い越すことはできるけど……。"
10058090-31 = "下手に遠回りしてると、あっちが先にゴールしちゃうね。"
10058090-32 = "でも、まともに戦ったら一瞬でゲームオーバー。"
10058090-33 = "あっちもこの状況は把握してるはずだから……。"
10058090-34 = "結局、真っ向勝負になるわね。"
10058090-35 = "あっちがゴールしてから、安全に行くって方法もあるよ。"
10058090-36 = "確実に準優勝できるし……。"
10058090-37 = "それが、一番賢い選択かもね～"
10058090-39 = ""
10058090-40 = ""
10058090-41 = "分かってる。そんなことしないよ。#nここまで来るの、め～っちゃ大変だったし！"
10058090-43 = "みんな本気で戦ってたんだから……#n私たちだけ、逃げるわけにはいかないっしょ！"
10058090-45 = "そうね。私たちだけの力で来たわけじゃないもの。"
10058090-47 = "始めたからには、ちゃんとした終わりが見たい。"
10058090-49 = "行くわよ！子犬号が最高の戦車だって、証明するの！"
10058090-50 = "エリナ、一番貫通力が高い弾をお願い！"
10058090-51 = "毎晩、優勝カップでお湯を沸かしてお茶を飲もう！"
10058090-52 = "それなら、私は毎朝シリアル――"
10058090-54 = ""
10058090-55 = ""
10058090-56 = ""
10058090-57 = ""
10058090-58 = ""
10058090-59 = ""
10058090-60 = ""
10058090-61 = ""
10058090-62 = ""
10058090-63 = "183号、大成功しよー！"
10058090-65 = "「183号、大成功しよー！」だなんて、素敵な掛け声ですね！"
10058090-66 = "果たして！#nゲヘナが守り続けてきた優勝カップは、#nレッドウィンターの手に渡ってしまうのでしょうか？"
10058090-67 = "どうやって優勝カップでお湯を沸かすつもりなのかも気になるところです！"
10058090-68 = "では、いよいよ運命の決戦です！"
10058090-69 = "チアキ先輩ー！他の先輩がメモをくれたんだけど、「かざんばい」ってなあに？"
10058090-70 = "イブキちゃん。#n火山灰は火山が噴火した時に出てくるホコリみたいなものですよ！"
10058090-71 = "情報によると、コース終盤に位置する火山の活動が活発化しているとのことです！"
10058090-72 = "視界の悪化など、#n火山灰がレース展開にどう影響を及ぼすかも大きな見どころですね！"
10058090-73 = "ゲヘナ[ruby=パンデモニウム・ソサエティー]学園万魔殿所属[/ruby]、#n[ruby=なつめ]棗イ[/ruby]ロハさんの「虎丸号」が防衛に成功するのか！？"
10058090-74 = "レッドウィンター連邦学園183号特別クラス所属、#n[ruby=にき]仁木[/ruby]アンナさんの「子犬号」が初のタイトルを奪うのか！？"
10058090-75 = "猛虎と猛犬の対決をご覧いただきましょう！では、現場のカメラに繋ぎます！"
10058090-79 = "げほっ、げほっ。"
10058090-80 = "なんか、噴火が激しくなってるような……。"
10058090-81 = "たしかに……火砕流とかはないみたいだけど、火山灰がすごいね。"
10058090-82 = "ラナ、エンジンはどう？"
10058090-83 = "周囲の空気に比例して温度が上がってるけど、まだ大丈夫。"
10058090-84 = "ううっ、火山灰が積もってきた……屋根でも付ければ良かったかな。"
10058090-85 = "たぶん、それだといろいろ不便だったでしょうね。#nこんな環境だなんて予想できなかったし、仕方がないわ。"
10058090-86 = "183号特別クラス、子犬号のみなさん。共通チャンネルから失礼します。"
10058090-87 = "こちらは万魔殿の虎丸チーム。戦車長の棗イロハです。"
10058090-89 = ""
10058090-90 = "虎丸チームって言った！？"
10058090-91 = "ご、ご用件は何でしょうか……？"
10058090-92 = "今日はお互いに頑張ったので、休憩がてら話でもしましょう。"
10058090-93 = "いくつか確認したいこともありますし。#n安心してください。攻撃はしませんから。"
10058090-94 = "2時の方向に前進してください。こちらは砲塔を後ろに向けておきます。"
10058090-95 = "何を企んでるのかしら？"
10058090-96 = "う～ん、なんだろう？……あれ？#nさっきまであそこにいたのに、火山灰のせいで見えなくなっちゃった。"
10058090-97 = "先に見えたら、攻撃してもいいんじゃない？"
10058090-98 = "本当に話したいのかも。退屈なんだよ。"
10058090-99 = "まさか。いくら退屈でもそれはないでしょ。"
10058090-100 = "……分かりました。こちらは砲塔がないので何もできませんけど。"
10058090-101 = "撃ちたいなら撃っても構いませんよ。挑戦は拒みませんから。"
10058090-102 = "では、実際に会って話をしましょう。"
10058090-104 = ""
10058090-105 = ""
10058090-106 = "……舐められてるのかしら？"
10058090-107 = "とりあえず話を聞いてみよ～よ。仮説は検証しないと。"
10058090-108 = "ラナ、気を付けながら行って！"
10058090-116 = ""
10058090-117 = ""
10058090-118 = ""
10058090-119 = "到着しました。183号特別クラスの学級委員長、仁木アンナです。"
10058090-121 = ""
10058090-123 = ""
10058090-124 = "来ましたか。"
10058090-125 = "ふむ……。"
10058090-126 = "お、お話って何ですか……？"
10058090-127 = "私は選手であると同時に、この大会の進行係でもありまして。#nいくつか確認したいことがあります。"
10058090-128 = "戦車は正常に作動しますか？火器や走行に問題はありませんか？"
10058090-129 = "もちろんです！ここまで2両も撃破したんですから！"
10058090-130 = "分かりました。レース続行の能力アリと記録しておきます。"
10058090-131 = "火山灰が降っていますが、棄権する気はありますか？"
10058090-132 = "まさか！ぜ～ったいにしません！"
10058090-133 = "分かりました。別に挑発してるわけではないので、悪しからず。"
10058090-134 = "選手に重大な危険が及ぶおそれがある場合、#n残った選手の過半数が賛成すれば試合を中止にできます。"
10058090-135 = "みなさんの戦車には屋根が無いようですが、大丈夫ですか？#n火山灰はここからどんどん激しくなりますよ？"
10058090-136 = "私は中止に同意します。レースはこれからもたくさんありますし、#n優勝にこだわっているわけではないので。"
10058090-137 = "みなさんが同意すれば……#nレースはこのまま中止になり、我々は共に準優勝扱いになります。"
10058090-138 = "ふわふわさんは、私たちを脱落させて優勝しないんですか？"
10058090-139 = "ふ、ふわふわさん？"
10058090-140 = "さっき言いましたが……#nそちらから先に手を出してこない限り、戦うつもりはありません。"
10058090-141 = "まさか、私たちを侮っているんですか？"
10058090-142 = "いえ、そうではありません。#n好みというか、信念というか……癖と言ってもいいかもしれませんね。"
10058090-143 = "どうしますか？#n私は、みなさんがここで棄権しても臆病者だとは思いませんよ？"
10058090-145 = ""
10058090-146 = "エリナ。"
10058090-147 = "ラナ。"
10058090-148 = "アンナ。"
10058090-149 = "お断りします！"
10058090-150 = "私たち、全力でやるって決めたんです！"
10058090-151 = "たしかに、他にも大会はあるけど……#nこの大会で全力を尽くせるのは、今だけですから！"
10058090-152 = "最初は参加したいって想いだけで来ちゃったけど……#n今は、めーっちゃ優勝したくなっちゃいました！"
10058090-153 = "私たち3人で作った戦車がどこまでいけるのか知るためにも、#n最後まで戦いたいのです。"
10058090-154 = "だって、諦めない戦車はかっこいいから。"
10058090-155 = "それに……。"
10058090-156 = "きちんと勝って、過去の失敗に「ざまあみろ！」って言いたいんです！"
10058090-157 = "アンナ……！"
10058090-158 = "ブイ！"
10058090-159 = "そういうことなので、申し訳ありませんが単独優勝は譲れません！"
10058090-160 = "絶対に諦めない……いや、諦めるなんて無理です！"
10058090-161 = "ほう。"
10058090-162 = "みなさん、スタートの時とは目つきが変わりましたね。良い変化です。"
10058090-163 = "「こわい～やめて～」って言ってた人はどこに行ったのかしら？"
10058090-164 = "燃料浪費者は黙っててぇ……！"
10058090-165 = "ふふふっ！"
10058090-166 = "良いでしょう。#n今からこの火山をそれぞれ反対方向に回って、エンカウントしたら決闘です。"
10058090-167 = "虎丸チーム、総員乗車！エンジン始動！"
10058090-169 = ""
10058090-171 = ""
10058090-172 = "い、言ってしまった……。"
10058090-173 = "でっかい重戦車と絶対王者を相手に挑発しちゃった……。"
10058090-174 = "？"
10058090-175 = "今からでも撤回する？"
10058090-176 = "しない！！！"
