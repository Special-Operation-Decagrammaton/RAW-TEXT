[translation]
10058090-1 = "제9화;최선을 다해서"
10058090-2 = "여보세요-? 183호 분들 맞죠?"
10058090-6 = "……."
10058090-9 = "너 뭐해? 왜 갑자기 말없이 이상한 표정 하고 있어? 원래도 이상하긴 하지만."
10058090-10 = "쉬잇-! 영상통화 끊긴 척하고 있는 거잖아! 눈치 챙겨!"
10058090-11 = "주최 측에서 좋은 일로 불렀을 리가 없잖아!"
10058090-12 = "허, 헉……!"
10058090-13 = "아뇨아뇨아뇨, 반칙이라든지 실격이라든지 그런 게 아니니까 쫄지 말구, 쫄지 말구!"
10058090-14 = "다름이 아니라, 빠른 경기 진행을 위해 규칙대로 공동 1등의 위치를 서로 알려드릴게요!"
10058090-15 = "영광의 공동 1위인 183호 특별반과 만마전의 토라마루호, 명승부를 기대할게요!"
10058090-16 = "그러면 저는 다시 중계석으로-!"
10058090-17 = "아? 네, 네에……."
10058090-20 = "우리가 공동 1등이라고?!"
10058090-21 = "심지어 그 대단한 토라마루가 상대야? 죽이네!"
10058090-22 = "정말이네, 지도에 위치를 찍어줬어. 대략적인 위치만 알려주지만……."
10058090-23 = "으음……."
10058090-24 = "에리나, 이거……."
10058090-25 = "음……. 이거 되게……. 그러니까……."
10058090-26 = "외통수네."
10058090-27 = "그거지! 역시 라나가 제일 똑똑해!"
10058090-28 = "저쪽은 우리가 방금 부순 표적을 마지막으로 맞혀야 하나 봐."
10058090-29 = "그렇게 되면, 다 맞히고 나서 결승선에 더 가까운 건 저쪽의 이로하 씨고,"
10058090-30 = "우리는 대신 속도가 빠르니까 앞질러 나갈 수는 있겠는데……."
10058090-31 = "괜히 피해 간다고 돌아가는 순간 저쪽이 결승선으로 달려버리면 그대로 끝나는 거지."
10058090-32 = "맞서 싸우면 반주먹거리도 안 돼."
10058090-33 = "저쪽도 지금 못 움직이는 거 보니까, 비슷하게 상황 파악은 하고 있나 봐."
10058090-34 = "그러면 결국, 맞서 싸워야 하는 거네."
10058090-35 = "토라마루가 결승선으로 들어갈 때까지 기다렸다가, 안전하게 들어가는 방법도 있어."
10058090-36 = "이러면 적어도 2위는 확실하게 하는 거지."
10058090-37 = "그게, 제일 좋은 선택이네~"
10058090-41 = "알아. 그런 거 안 해. 여기까지 오느라 엄~청 고생했잖아!"
10058090-43 = "참가한 모두가 진심을 다하고 있는데, 우리가 도망치면 안 돼."
10058090-45 = "맞아. 우리만의 힘으로 온 게 아니기도 하고."
10058090-47 = "시작했으니까, 제대로 된 끝을 보고 싶어."
10058090-49 = "가자! 강아지호가 최고의 전차라는 거, 증명해주자!"
10058090-50 = "에리나, 관통력 제일 높은 탄 장전해!"
10058090-51 = "우승컵에 매일 저녁 차 끓여 마셔주마!"
10058090-52 = "나는 매일 아침 시리얼-"
10058090-63 = "183호, 가자!"
10058090-65 = "'183호, 가자!'라니, 멋진 구호군요!"
10058090-66 = "과연과연과연! 게헨나가 지켜온 우승 컵은, 이대로 붉은겨울에게 넘어갈 것인가!"
10058090-67 = "그리고, 트로피로 차를 끓이려면 어떻게 해야 할까요!"
10058090-68 = "그러면, 드디어 운명의 결전입니다!"
10058090-69 = "치아키 선배-! 화산재가 뭐야? 다른 선배가 방금 쪽지로 써줬어!"
10058090-70 = "앗, 그렇군요. 이부키 쨩. 화산재는 화산이 분화할 때 나오는 먼지예요!"
10058090-71 = "결승을 앞둔 지금, 게헨나 컵 트랙에 위치한 화산 활동이 격화되고 있다는 소식입니다!"
10058090-72 = "뜨거운 화산재가 전차에 미치는 영향도 있고, 시야가 짧아져서 경기의 전개도 달라지겠군요!"
10058090-73 = "게헨나 학원 만마전 소속, 나츠메 이로하 씨의 <토라마루호>가 수성에 성공하는가."
10058090-74 = "붉은겨울 연방학원 183호 특별반 소속, 니키 안나 씨의 <강아지호>가 타이틀을 뺏어오는가?!"
10058090-75 = "호랑이와 맹견의 대결! 곧 마주하시게 됩니다, 현장 카메라로 가시죠!"
10058090-79 = "콜록, 콜록."
10058090-80 = "화산, 점점 분화하고 있는 것 같지 않아?"
10058090-81 = "확실히……. 용암 분화는 없지만 화산재가 엄청 짙네."
10058090-82 = "라나, 엔진은 어때?"
10058090-83 = "공기가 더워져서 점점 온도가 오르는데, 아직은 괜찮아."
10058090-84 = "으윽, 화산재가 그대로 들이닥치네……. 지붕이라도 얹을걸 그랬나."
10058090-85 = "아마 그랬으면 여러 가지로 더 불편했을 거야. 이런 환경일 줄은 예상 못 했으니까 어쩔 수 없지."
10058090-86 = "183호 특별반, 강아지호 여러분들. 공용채널에서 호출합니다."
10058090-87 = "여기는 게헨나 만마전 토라마루 팀. 전차장 나츠메 이로하예요."
10058090-90 = "토라마루 팀이라고?!"
10058090-91 = "무슨 일이시죠……?"
10058090-92 = "각자 고생했으니, 잠시 쉬면서 대화라도 하시죠."
10058090-93 = "이래저래 확인하고 싶은 것도 있고요. 안심하세요. 공격하지 않을 테니까."
10058090-94 = "2시 방향으로 쭉 전진하세요. 이쪽은 포탑을 뒤로 돌려놨으니 안심하구요."
10058090-95 = "무슨 꿍꿍이지?"
10058090-96 = "진짜다……. 저 앞에 있었잖아. 화산재 때문에 잘 안 보였어."
10058090-97 = "저쪽이 먼저 봤으면 그냥 우리 격파해도 되는 거 아니야?"
10058090-98 = "정말 대화하고 싶은지도. 심심한가 봐."
10058090-99 = "아무리 심심해도 그렇지는 않겠지."
10058090-100 = "……알았어요. 우리는 포탑이 없어서 포를 돌리진 못해요."
10058090-101 = "쏘고 싶다면 쏴도 괜찮아요. 도전은 거부하지 않으니까."
10058090-102 = "그러면, 이다음은 직접 보고 이야기하죠."
10058090-106 = "……얕잡아 보는 건 아니겠지?"
10058090-107 = "들어나 보자~ 가설은 검증해야지."
10058090-108 = "라나, 그쪽으로 가자. 조심해서!"
10058090-119 = "왔어요. 183호 특별반의 반장. 니키 안나예요."
10058090-124 = "왔군요. 당신들."
10058090-125 = "흐음……."
10058090-126 = "무, 무슨 말이 하고 싶으신 거죠……?"
10058090-127 = "저는 선수인 동시에 주최인 만마전의 진행요원이기도 해서. 몇 가지 확인할 의무가 있거든요."
10058090-128 = "전차는 정상적으로 작동하나요? 화기도, 기동도 모두 멀쩡하죠?"
10058090-129 = "당연하죠! 지금까지 두 대나 격파했어요!"
10058090-130 = "네. 경기 진행 능력이 있는 걸로 기록할게요."
10058090-131 = "화산재가 내리고 있는데, 기권할 생각이 있나요?"
10058090-132 = "기권은 무슨! 그걸 왜 해요!"
10058090-133 = "네. 쓸데없이 도발하거나 그러는 게 아니에요. 오해는 마시길."
10058090-134 = "진행요원으로서, 선수의 안전에 중대한 위협이 있다면 잔여 선수 과반의 찬성으로 경기를 중지할 수 있어요."
10058090-135 = "여러분들, 전차에 지붕이 없고 밀폐도 안 되어 있잖아요? 화산재는 점점 더 뜨거워질 거예요."
10058090-136 = "저는 중지에 동의해요. 우승이 그렇게 중요한 것도 아니고. 대회는 앞으로도 많다구요."
10058090-137 = "여러분들만 동의하면, 이대로 경기는 중지되고 규칙상 공동 2위로 준우승도 될 거예요."
10058090-138 = "복슬복슬 씨가 우리를 탈락시키고 1등 하면 되는 거 아닌가요."
10058090-139 = "보, 복슬복슬 씨라고요?"
10058090-140 = "아까 말했잖아요. 먼저 건드리지 않으면 굳이 싸우지 않는다구요."
10058090-141 = "설마, 저희를 얕보시는 건가요?"
10058090-142 = "아뇨. 그렇지 않아요. 취향이죠. 신념인 거고. 버릇이기도 하고."
10058090-143 = "어떻게 하시겠어요? 저는 여러분들이 기권해도 겁쟁이라고 생각하지 않을 거라구요?"
10058090-146 = "에리나."
10058090-147 = "라나."
10058090-148 = "안나."
10058090-149 = "사양할게요!"
10058090-150 = "저희, 최선을 다하려고 하거든요!"
10058090-151 = "확실히, 다른 대회도 있지만…… 이 대회에서 최선을 다하는 건 지금밖에 못 하니까요!"
10058090-152 = "처음엔 참가만 하고 싶다고 생각하고 왔는데요…… 지금은 엄~청 우승하고 싶네요!"
10058090-153 = "우리가 직접 만든 전차, 어디까지 갈 수 있는지 알고 싶으니까 끝까지 싸우고 싶습니다."
10058090-154 = "왜냐면, 포기하지 않는 전차는 멋지니까요."
10058090-155 = "그리고요……."
10058090-156 = "확실히 이겨서, 지나간 실패에게 '꼴좋다!'라고 하고 싶어요!"
10058090-157 = "안나……!"
10058090-158 = "브잇-!"
10058090-159 = "그런 관계로 미안하지만, 단독 우승은 양보 못 하겠어요!"
10058090-160 = "포기 안 할 거예요…… 아니, 여기까지 왔으니까 못 해요!"
10058090-161 = "호오."
10058090-162 = "다들 눈빛이 아까 출발선에서 봤을 때하고 많이 달라졌군요. 좋은 변화입니다."
10058090-163 = "'위험홰~ 그만해좨~'라던 사람 어디 가셨나아-?"
10058090-164 = "연료 학살자는 닥치시지……!"
10058090-165 = "킥킥킥-!"
10058090-166 = "그렇다면 좋습니다. 이 화산을 각자 반대 방향으로 돌아서 마주치면 결투하죠."
10058090-167 = "토라마루, 전원 승차. 전차 기동!"
10058090-172 = "저, 저질렀다……."
10058090-173 = "엄청난 중전차에 엄청난 고수 상대로 싸우자고 시비 걸어버렸다……."
10058090-174 = "?"
10058090-175 = "지금이라도 가서 물러달라고 할까?"
10058090-176 = "당연히 안 되지!!!"
