[translation]
1001005-1 = "로드 싸이클"
1001005-2 = "쇼핑몰"
1001005-3 = "음."
1001005-4 = "나와줘서 고마워, 선생님."
1001005-5 = "최근 무선변속기의 시대가 열리면서 로드 싸이클 세계에 새로운 패러다임이 열리고 있어."
1001005-6 = "무선변속기의 디지털스러운 감각은 아직 잘 모르겠는데……. #n나는 와이어를 통해 느껴지는 무게가 좋거든."
1001005-7 = "하지만 새로운 기술이 나오면 일단은 체크해 둬야하니까."
1001005-10 = "음……. 내가 너무 혼자서 떠들었나……."
1001005-11 = "[s1] \"아니야, 재미있어.\"\n[s2] \"시로코가 이렇게 말 많이 하는 건 오랜만이네.\""
1001005-12 = "으, 으음……."
1001005-13 = "으, 으음……."
1001005-14 = "자전거 샵은 저쪽이야. 그럼 가볼까?"
1001005-17 = "(시로코와 함께 자전거샵에서 즐거운 시간을 보냈다.)"
