[translation]
31070-1 = "제7화;시험 준비"
31070-2 = "(방과후 자율학습 시간)"
31070-3 = "하나코. 이 문제를 모르겠는데."
31070-4 = "응? 이건 소인수분해 문제네요. 이때는 배수 판정법을 사용하면 돼요. 이건 이렇게 해서……."
31070-5 = "음. 과연."
31070-6 = "……."
31070-9 = "……."
31070-10 = "응? 코하루 쨩? 모르는 거라도 있어요?"
31070-11 = "아, 아니! 딱히!"
31070-12 = "참고로 지금 보고 있는 그 페이지는 저희 시험범위가 아니에요."
31070-13 = "뭐, 뭣?!"
31070-14 = "아, 알고 있었다고! 예, 예습하고 있었던 거야!"
31070-15 = "……."
31070-18 = "하나코. 이 문장의 의미를 모르겠어."
31070-19 = "고대 서사시의 첫 구절이네요. 해석하자면 <분노를 노래하소서, 시의 신성이여.>"
31070-20 = "아아. 그건가. 이해했어."
31070-25 = "……."
31070-28 = "하나코. 이건……."
31070-29 = "이건 고대어를 중역한 거네요. 원문을 이해하려면 사전이 있어야 할 거 같은데, 잠시만요."
31070-30 = "아아, 그런 거라면 이해했어. Gaudium et Spes. ……즉, 기쁨과 희망인가."
31070-31 = "네. 맞아요. 이건 2차 공의회의 슬로건으로…… 그것보다 아즈사 쨩, 고대어를 읽을 수 있었어요?"
31070-32 = "응. 옛날부터 배웠으니까."
31070-37 = "……."
31070-39 = "[ns] \"분위기가 좋은데.\""
31070-40 = "네! 맞아요! 하나코 쨩이 뭔가 굉장한 느낌이고……! 게다가 아즈사 쨩도 배우려는 의지가 가득하고……!"
31070-41 = "거기다 코하루 쨩은 힘을 숨기고 있었다고 하니……."
31070-42 = "앞으로 남은 시험도 간단할 거 같은 예감이……!!"
31070-43 = "아우우……. 다행이에요. 사실, 얼마나 걱정했었는데……."
31070-44 = "사실 첫 시험에서부터 낙제생이 생기면, 다음 시험부턴 합숙에 들어가라고 티파티에서 명령이 내려왔거든요……."
31070-45 = "[s] \"합숙?\""
31070-46 = "네. 그 정도로 민감한 부분이라…… 사실 3차 시험까지 모두 낙제하면…… 아우우……."
31070-47 = "[s] \"낙제하면……?\""
31070-48 = "아, 아무것도 아니에요! 그럴 일은 없을 것 같으니까, 불길한 소리는 접어두고……."
31070-49 = "시험은, 이대로라면 문제없을 것 같으니까요!"
31070-53 = "그런데 하나코 쨩도 저처럼 시험을 치지 못해서 낙제를 받은 걸까요……? 공부를 무척 잘하는 것 같은데 대체 왜……."
31070-55 = "제1차 특별 학업 능력 평가 시험 당일"
31070-58 = "……."
31070-59 = "아우……."
31070-63 = "후훗."
31070-64 = "……."
31070-67 = "[ns] \"첫번째 평가 시험, 모두 힘내주세요.\""
31070-68 = "에, 엘리트의 힘을 보여주겠어! 다들 각오하라고!"
31070-69 = "아, 아하하……."
31070-70 = "네에. 후후후."
31070-71 = "좋아. 준비는 완벽하니까."
31070-76 = "다음화;제1차 평가 시험"
