[translation]
90100080-1 = "第8話;於陽炎的彼端"
90100080-2 = ""
90100080-3 = "報告，這裡是FOX3。"
90100080-4 = "現在時間為奇普托斯標準時間1000。#n目前氣溫攝氏28度，風速約3節。"
90100080-5 = "正與FOX4一同在Point Romeo確認方位0-3-0方向的特異現象──#n通稱「白色稻草人」的發生狀況。"
90100080-6 = "日出後氣溫正順利上升，不過還看不出陽炎將要升起的跡象。"
90100080-7 = ""
90100080-9 = ""
90100080-10 = "要一直等著不知何時會出現的對手……總覺得有點無聊呢。"
90100080-11 = "啊，御伽……不對，FOX4！不要擅自插進通訊裡啦！"
90100080-12 = "何必在意那種小事啊。#n順便一起聊聊天不是很好嗎？"
90100080-13 = "這裡是FOX4。正如FOX3所說，現在地面還沒被曬熱，#n別說是異常現象了，就連普通的陽炎都沒有升起。"
90100080-14 = "……話說回來，今天就這樣在陰涼處待命沒關係嗎？"
90100080-15 = "和昨天不同可以避免陽光直射，雖然感覺舒服多了……#n不過我們究竟在對抗什麼，還是有點搞不清楚呢。"
90100080-16 = ""
90100080-18 = ""
90100080-19 = "這裡是FOX1。#n就像作戰開始前說的，現在請專注在陽炎上。"
90100080-20 = "雖然尚未發現有關嫌犯的直接證據，#n不過只要從與受害者相同的視角觀測現場，或許就能取得線索。"
90100080-21 = "意思是……只要一直盯著陽炎看，就會出現什麼東西嗎？"
90100080-22 = "比如會走出形狀扭曲得跟陽炎一樣的殭屍之類的～"
90100080-23 = "那，那怎麼可能啊！？"
90100080-24 = "在確認「白色稻草人」的真面目之前，不能說完全沒有可能性。"
90100080-25 = "……我是開玩笑的啦。#n我們的隊長果然對玩笑話免疫呢。"
90100080-26 = ""
90100080-28 = ""
90100080-29 = ""
90100080-30 = "這裡是FOX2。#n正在Point Romeo觀測方位2-1-0方向。這邊目前似乎也沒有異狀。"
90100080-31 = "話說回來……老師今天不來嗎？"
90100080-32 = "啊，老師說他今天去忙其他的公務了。"
90100080-33 = "怎麼，你有什麼話想單獨對老師說嗎？"
90100080-34 = "沒，沒有啦。倒也不是那樣……"
90100080-35 = "總覺得，有種不好的預感。"
90100080-36 = "突然要在沒有老師幫忙的情況下進行作戰，讓我有點不安。"
90100080-37 = "哎呀～我們什麼時候需要依賴別人了啊。#n以前不也都是靠我們自己解決的嗎？"
90100080-38 = "當然有老師在的話就能拿到很多零食，確實還挺不錯的。"
90100080-39 = "你是把老師當成補給員了嗎……？"
90100080-40 = "話說FOX4，你從矯正局出來之後好像變胖了耶。"
90100080-41 = "那是長肌肉了啦！"
90100080-42 = ""
90100080-43 = ""
90100080-44 = "FOX2。你發現了什麼新的異常現象嗎？"
90100080-45 = "沒有。剛才也說只是預感而已。不用太在意。"
90100080-46 = "不過仁子的直覺總是很準，實在很難完全無視。"
90100080-47 = "……真不像FOX1呢。居然會說出這種軟弱又感性的話。"
90100080-48 = "你昨天不是才說過，在情報完全齊備之前不能貿然下判斷嗎？"
90100080-49 = "在擬定階段是這樣沒錯，然而直覺在現場也可能成為重要的武器。"
90100080-50 = "再怎麼謹慎都不為過。"
90100080-51 = "執行幾次類似的作戰後，確實會有身體比腦袋更早記住的情況……這麼說也有道理。"
90100080-52 = "不過我所在意的，並不是防範敵人奇襲或狙擊這類的環境問題。"
90100080-53 = "而是這場作戰本身的方向是錯的，#n或者又在某個瞬間將槍口朝向了友軍──這種根本性的不安。"
90100080-54 = "比如說……對了。就像進行「獵兔行動」時一樣。"
90100080-55 = "…………"
90100080-56 = "……FOX1。向你下達作戰指示的那位聯邦學生會長，真的是本人嗎？"
90100080-57 = "……聯邦學生會長是本人沒錯。#n你不也透過照片和影像確認過了嗎？"
90100080-58 = "嗯。無論長相還是舉止，「他」都毫無疑問是我們記憶中那位真正的聯邦學生會長。"
90100080-59 = "可能是因為要對付的[ruby=怪談]敵人[/ruby]，是傳聞這種不確定的存在吧。#n在執行作戰的整個過程，不安的感覺始終揮之不去。"
90100080-60 = "如果老師能在身邊持續給我們建議的話，或許至少能稍微緩解一些不安也說不定。"
90100080-61 = "老師本來就為了夏萊的事忙得不可開交，我們總不能因為自己的事而每天把他請來。"
90100080-62 = ""
90100080-64 = ""
90100080-65 = "是啊。總之我會參考的。"
90100080-67 = "這裡是FOX4。#n外部氣溫已達31度。"
90100080-68 = "差不多可以觀測到陽炎升起了。"
90100080-69 = "有看到什麼像白色稻草人的東西嗎？"
90100080-70 = "完全沒有。啊，如果和玻璃窗反射的白色光束重疊來看，或許會有點像白色稻草人。"
90100080-72 = "唔嗯……"
90100080-73 = "怎麼了嗎，FOX4？"
90100080-74 = "沒有。只是看著地面搖來晃去的，總覺得有點頭暈。"
90100080-75 = "這麼說來，我之前聽去奧德賽學園作戰的其他小隊成員說過。"
90100080-76 = "在奧德賽學園一旦發現有學生默默低頭望著水面，就要立刻把對方拉開。"
90100080-77 = "……為什麼？"
90100080-79 = "具體的原因我沒聽說，不過好像是規律起伏的漣漪會對人施加催眠之類的。"
90100080-80 = "所以才要在對方自己跳進水裡之前把人拉開。"
90100080-82 = "哼嗯……類似童話裡的「賽蓮傳說」那種都市怪談嗎？"
90100080-83 = "不過比起在礁石上唱歌的半人半魚怪物，這個理由算是現實多了。"
90100080-84 = "所以FOX4你也要小心。#n搞不好會被陽炎迷惑，被拉到柏油地面的另一端去哦。"
90100080-85 = "哎唷，怎麼可能嘛。#n類似的作戰我都進行過那麼多次了耶。"
90100080-86 = "而且今天還有個健談的搭檔在我旁邊，對話應該不會中斷才對──"
90100080-87 = ""
90100080-91 = "……嗯？"
90100080-92 = "怎麼了。你發現什麼了嗎？"
90100080-93 = "那邊那個地方……本來有草地嗎？"
90100080-94 = "草地？在哪，幾點鐘方向？"
90100080-95 = "是海市蜃樓嗎……地圖上明明不存在，卻能在道路的另一頭看見一片藍天下的草原。"
90100080-96 = "茂密的草叢間立著一個破舊的稻草人，#n在那之後還有一個身穿白衣、露出某種詭異笑容的人──"
90100080-97 = "那不就是受害者們說的「白色稻草人」嗎？"
90100080-98 = "FOX4，回報座標！在哪個方向！？"
90100080-99 = ""
90100080-108 = ""
90100080-109 = ""
90100080-110 = "……在一陣令人毛骨悚然、悶熱的風吹來的地方。"
90100080-111 = ""
90100080-115 = "雖然受害者都把那東西稱作白色稻草人，但那並不是什麼稻草人。"
90100080-116 = "那個東西正憑藉自己的意志在移動。#n因為不跳舞就無法存在、不被觀測就無法干涉……#n才會身穿顯眼的白衣，像抽搐般地跳著舞。"
90100080-117 = "你在胡說些什麼啊，FOX4！振作一點！"
90100080-118 = "來了，它來了！巨大的灰色浪潮如抽搐般蠕動，如跳舞般搖擺──"
90100080-119 = "扭來扭去扭來扭去──"
90100080-120 = ""
90100080-129 = "……御伽！"
90100080-130 = ""
90100080-135 = "怎，怎麼了？剛才好像聽到了槍聲……"
90100080-136 = "Point Romeo，聽到請回答。#n發生什麼事了？"
90100080-139 = ""
90100080-140 = "痛痛痛……FOX1，FOX3好像發瘋了！#n他剛才突然衝過來狠狠往我頭上打了一下！"
90100080-141 = "發瘋的人是你才對吧？知道你面前的人是誰嗎？"
90100080-142 = ""
90100080-144 = ""
90100080-145 = "當然知道啊。你那片跟往常一樣平坦的胸部就在我眼前嘛。"
90100080-146 = "別開玩笑了！#n這樣看起來是幾根手指？"
90100080-147 = "兩根……？#n怎樣，是在做智力測驗嗎？"
90100080-148 = ""
90100080-150 = ""
90100080-151 = "太好了。我還以為你會像其他受害者一樣失去意識呢……"
90100080-152 = "FOX3，剛才發生什麼事了？"
90100080-153 = "這裡是FOX3。#n剛才正在觀察陽炎的FOX4……"
90100080-154 = "回答說他目擊到了「白色稻草人」。"
90100080-155 = "我！？"
90100080-156 = "嗯，你不記得了嗎？#n在那之後你還說了什麼藍天下的草原、灰色的浪潮這類奇怪的話。"
90100080-157 = "我完全沒印象。"
90100080-158 = "剛才我明明只是一邊聽你說著奧德賽學園的事，一邊持續隔著瞄準鏡望著陽炎而已。"
90100080-159 = "真奇怪。難道我剛才是在做白日夢嗎？"
90100080-160 = "總之你沒事就好。#n不過剛才發射的子彈沒有造成什麼損害吧？"
90100080-161 = "唔……我現在確認一下。"
90100080-162 = "希望沒有飛到什麼奇怪的地方去。"
90100080-163 = ""
90100080-165 = ""
90100080-166 = "……咦？"
90100080-167 = "怎，怎麼了？該不會打到市民了吧？"
90100080-168 = "沒有，不是那樣……而是根本沒有彈痕。#n明明不是啞彈才對。"
90100080-169 = "什麼？意思是那麼大一顆50口徑的子彈，在半空中蒸發了嗎？"
90100080-170 = "……難道真的遇到鬼了嗎。"
90100080-171 = ""
90100080-172 = ""
90100080-173 = "FOX1，你有想到什麼線索嗎？"
90100080-174 = "還沒。不過確實有必要整理一下狀況了。"
90100080-175 = ""
90100080-177 = ""
90100080-178 = "全體隊員立刻返回HQ。#n收拾好裝備回到會合點集合。"
90100080-180 = "收到！"
90100080-182 = "下一話;虛像追蹤"
