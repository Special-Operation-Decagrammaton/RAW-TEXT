[translation]
90100080-1 = "제8화;아지랑이 너머에서"
90100080-3 = "보고, 여기는 FOX 3."
90100080-4 = "현 시각은 키보토스 표준시로 1000시. 현재 기온은 섭씨 28도, 풍속은 약 3 노트."
90100080-5 = "현재 FOX 4와 함께 포인트 로미오에서 방위 0-3-0 방향으로 특이현상, 통칭 '하얀 허수아비'의 발생을 확인 중."
90100080-6 = "일출 후 기온은 순조롭게 상승 중이지만, 아직 아지랑이가 필 기미는 보이지 않아."
90100080-10 = "뭔가 따분하네. 언제 나타날지 모르는 상대를 기다리고 있으려니."
90100080-11 = "아앗, 오토기…… 아니, FOX 4! 멋대로 교신에 끼어들지 마!"
90100080-12 = "뭘 그런 사소한 걸 신경쓰고 그래. 겸사겸사 같이 이야기하면 좋지."
90100080-13 = "여기는 FOX 4. FOX 3의 말대로 지금은 땅이 충분히 달궈지지 않아서 그런지, 이상 현상은커녕 평범한 아지랑이조차 피어오르지 않고 있어."
90100080-14 = "……그나저나. 오늘은 이렇게 그늘에서 대기하고 있어도 괜찮은 거야?"
90100080-15 = "어제와 달리 직사광선을 피하고 있으니 조금은 살 것 같지만, 여전히 우리가 무얼 상대해야 하는지는 알기 어려운 걸."
90100080-19 = "여기는 FOX 1. 작전 개시 전에 말했듯이 지금은 아지랑이에 집중하도록."
90100080-20 = "용의자에 대한 뾰족한 증거는 여전히 없지만, 피해자와 같은 시야에서 현장을 관측하면 증거를 확보할 수도 있으니까."
90100080-21 = "그 말인즉…… 아지랑이를 계속 지켜보고 있으면 뭔가 나온다는 거야?"
90100080-22 = "구부러진 아지랑이 모양으로 일그러진 좀비가 걸어나온다거나~"
90100080-23 = "그, 그게 말이 되는 소리야?!"
90100080-24 = "'하얀 허수아비'의 정체를 확인하기 전까지는 가능성이 없다고 할 순 없지."
90100080-25 = "……농담이었어. 역시 우리 소대장은 농담이 안 먹힌다니까."
90100080-30 = "여기는 FOX 2. 포인트 시에라에서 방위 2-1-0 방향을 관측 중. 이쪽도 현재 특이사항은 없는 것 같아."
90100080-31 = "그나저나…… 선생님은 오늘 안 오시는거야?"
90100080-32 = "아, 선생님이시라면 오늘 다른 업무가 있다고 하셔서 따로 가셨어."
90100080-33 = "뭔가 선생님께 따로 할 말이라도 있었던 거야?"
90100080-34 = "아, 아니. 그런 건 아닌데……"
90100080-35 = "뭔가, 나쁜 예감이 들어서."
90100080-36 = "갑자기 선생님의 도움 없이 작전을 진행하려니 조금 불안해져서 말이야."
90100080-37 = "에이, 언제부터 우리가 다른 사람 도움을 받았다고. 그동안 우리끼리 잘 해결해 왔잖아?"
90100080-38 = "물론 선생님이랑 같이 있으면 이것저것 짭짤한 과자를 챙겨줘서 즐겁긴 하지만."
90100080-39 = "너는 선생님을 무슨 보급 계원처럼 생각하고 있는 거야……?"
90100080-40 = "그러고보니 FOX 4 너, 요새 교정국 나오고 나서 살찐 것 같아."
90100080-41 = "근육이 붙은 거거든!"
90100080-44 = "FOX 2. 뭔가 새로운 이상 현상이라도 발견했나?"
90100080-45 = "아니. 아까도 말했지만 예감에 불과하니까. 너무 신경 쓰지 마."
90100080-46 = "하지만 니코의 감은 늘 잘 맞았으니까. 아예 무시해 버리긴 어려운데."
90100080-47 = "……FOX 1 답지 않게 오늘은 나약하고 감성적인 말을 하네."
90100080-48 = "바로 어제만 하더라도 정보가 완전히 갖춰지기 전까지는 섣불리 판단해서는 안 된다고 말하지 않았던가?"
90100080-49 = "작전 수립 단계라면 몰라도, 현장에서는 직감도 중요한 무기가 될 수 있으니까."
90100080-50 = "신중은 아무리 기하더라도 부족해."
90100080-51 = "뭐, 비슷한 작전을 여러 번 수행하다 보면 머리보다 몸이 먼저 기억하는 상황도 있으니…… 그 말도 일리가 있네."
90100080-52 = "하지만 내가 신경 쓰인다고 했던 건, 적의 기습이나 저격이 예상된다— 같은 환경적인 문제가 아니었어."
90100080-53 = "어쩌면 이 작전 자체의 방향성이 잘못되었을지도 모른다, 어느 순간 아군에게 총구를 돌리고 있을지도 모른다— 는 근본적인 불안감."
90100080-54 = "예를 들자면…… 그래. 그 때 <토끼 사냥>을 진행할 때처럼 말이야."
90100080-55 = "………."
90100080-56 = "……FOX 1. 네게 이번 작전을 지시한 그 총학생회장은 정말 진짜였어?"
90100080-57 = "……총학생회장은 진짜였어. 너도 사진과 영상으로 확인했잖아?"
90100080-58 = "응. 그 얼굴이나 행동거지 모두 틀림없이, '그녀'는 우리가 기억하고 있는 진짜 총학생회장이었지."
90100080-59 = "하지만 상대하고 있는 [ruby=로어]적[/ruby]이 소문처럼 불확실한 존재라 그런가. 작전을 진행하는 내내 불안감이 가시질 않아."
90100080-60 = "최소한 선생님이 옆에서 계속 조언을 해주신다면 불안을 덜 수 있을텐데."
90100080-61 = "안 그래도 샬레의 일로 바쁜 선생님을 우리 때문에 매일 불러낼 수는 없으니까."
90100080-65 = "그래. 일단은 참고해 두지."
90100080-67 = "여기는 FOX 4. 외기 온도가 31도에 도달."
90100080-68 = "슬슬 아지랑이가 피어오르는 것이 관측된다."
90100080-69 = "뭔가 하얀 허수아비 같은 게 보여?"
90100080-70 = "전혀. 아, 유리창에 반사된 하얀 빛줄기랑 겹쳐보면 뭔가 하얀 허수아비처럼 보일지도."
90100080-72 = "으으음……"
90100080-73 = "왜 그래, FOX 4?"
90100080-74 = "아니. 뭔가 땅이 이리저리 흔들리는 걸 보고 있으니 현기증이 나는 것 같아서."
90100080-75 = "그러고보니 전에 오디세이아 학원에 작전을 나갔던 다른 소대원에게 들었는데."
90100080-76 = "오디세이아 학원에서는 수면을 말 없이 내려다 보고 있는 학생을 발견하면 바로 끌어내야 한대."
90100080-77 = "……왜?"
90100080-79 = "구체적인 이유는 못 들었지만, 규칙적으로 찰랑거리는 수면의 파문이 사람에게 최면을 건다나 뭐라나."
90100080-80 = "그래서 제 발로 물에 뛰어들기 전에 끌어내야 한다는 거야."
90100080-82 = "흐응. 동화 속에 나오는 <세이렌의 전설> 같은 도시괴담인가?"
90100080-83 = "뭐, 암초 위에서 노래하는 반인반수의 괴물보다는 현실적인 이유지."
90100080-84 = "그러니까 FOX 4도 주의해. 아지랑이에 홀려 아스팔트 바닥 너머로 끌려갈지도 모르잖아."
90100080-85 = "에이, 설마. 그동안 몇 번이나 작전을 진행했었는데."
90100080-86 = "게다가 오늘은 수다스러운 파트너가 바로 옆에 있으니, 대화가 끊길 것 같지는 않은데—"
90100080-91 = "……응?"
90100080-92 = "왜 그래. 뭐라도 발견했어?"
90100080-93 = "저기 저런 곳에…… 풀밭이 있었던가?"
90100080-94 = "풀밭? 어디, 몇 시 방향인데?"
90100080-95 = "신기루인가…… 지도에는 분명 존재하지 않는데, 도로 너머로 파란 하늘의 초원이 보이는데."
90100080-96 = "무성히 자라난 풀 사이로 허름한 허수아비 하나가 있고, 그 너머에 뭔가 묘한 웃음을 짓고 있는 하얀 옷의 사람이—"
90100080-97 = "그거, 피해자들이 봤다는 <하얀 허수아비> 아냐?"
90100080-98 = "FOX 4, 좌표를 말해! 어느 방향이야?!"
90100080-110 = "……섬뜩하고 후덥지근한 바람이 불어오는 곳."
90100080-115 = "피해자들은 모두 저걸 하얀 허수아비라고 불렀지만, 저건 허수아비 같은 게 아니야."
90100080-116 = "그것은 자신의 의지를 갖고 움직이고 있어. 왜냐하면 춤을 추지 않으면 존재할 수 없기에, 관측되지 않으면 간섭할 수 없기에, 눈에 띄는 하얀 옷을 입고 경련하듯 춤을 추는."
90100080-117 = "그게 무슨 헛소리야, FOX 4! 정신 차려!"
90100080-118 = "온다 다가온다 거대한 회색의 파도가 경련하듯 꿈틀거리며 춤을 추듯 꾸물거리며—"
90100080-119 = "꾸물꾸물꾸물꾸물꾸물—"
90100080-129 = "……오토기!"
90100080-135 = "뭐, 뭐야? 방금 총성이 들렸는데……"
90100080-136 = "응답하라, 포인트 로미오. 무슨 일이 일어난 거지?"
90100080-140 = "아야야…… FOX 1, FOX 3가 갑자기 미쳤나봐! 갑자기 달려와서 내 머리를 후려쳤다고!"
90100080-141 = "너야 말로 지금 제 정신이 맞아? 네 앞에 있는 사람이 누구인지 알겠어?"
90100080-145 = "알고 말고. 늘 보던 평탄한 가슴이 눈 앞에 보이는데."
90100080-146 = "농담하지 말고! 이 손가락, 몇 개로 보여?"
90100080-147 = "두 개……? 뭐야, 지능 테스트라도 하는 거야?"
90100080-151 = "다행이다. 나는 또 다른 피해자들처럼 정신을 잃은 줄 알고……"
90100080-152 = "FOX 3, 방금 무슨 일이 있었던 거지?"
90100080-153 = "여기는 FOX 3. 방금 아지랑이를 관찰하던 FOX 4가……"
90100080-154 = "'하얀 허수아비'를 목격했다고 답했어."
90100080-155 = "내가?!"
90100080-156 = "응. 기억안나? 그 이후로 뭔가 파란 하늘의 초원이라느니, 회색의 파도라느니 이상한 소리를 했잖아."
90100080-157 = "전혀 기억에 없는데."
90100080-158 = "나는 그저 네가 오디세이아 학원의 이야기를 하는 걸 들으며 계속 스코프 너머로 아지랑이를 바라보고 있었을 뿐인데."
90100080-159 = "이상하네. 백일몽이라도 꾸고 있었던 건가?"
90100080-160 = "무사하다면 다행이다. 다만 방금 발포된 유탄에 의한 피해는 없었나?"
90100080-161 = "으윽…… 지금 확인해 볼게."
90100080-162 = "뭔가 이상한 곳으로 날아가지만 않았으면 좋겠는데."
90100080-166 = "……어라?"
90100080-167 = "왜, 왜 그래? 혹시 시민이 맞은 건 아니지?"
90100080-168 = "아니, 그게 아니라…… 아예 탄흔이 없어. 분명 불발탄은 아닌데."
90100080-169 = "뭐? 그럼 그 큰 50구경 탄환이 허공에서 증발하기라도 했다는 말이야?"
90100080-170 = "……정말 귀신이 맞았나."
90100080-173 = "FOX 1, 뭔가 짚이는 부분이라도 있는 거야?"
90100080-174 = "아직은. 하지만 상황을 정리할 필요는 있겠군."
90100080-178 = "전 소대원, 바로 HQ로 복귀한다. 장비를 챙겨서 랑데부 포인트에 집결하도록."
90100080-180 = "확인!"
90100080-182 = "다음화;허상 추적"
