[translation]
90100080-1 = "ตอนที่ 8;เหนือไอแดดระอุ"
90100080-2 = ""
90100080-3 = "FOX 3 รายงาน"
90100080-4 = "ขณะนี้เวลา 10:00 น. ตามเวลาคิโวทอส อุณหภูมิปัจจุบันอยู่ที่ 28 องศาเซลเซียส ความเร็วลมประมาณ 3 นอต"
90100080-5 = "ตอนนี้ฉันกับ FOX 4 กำลังเฝ้าสังเกตการณ์ปรากฏการณ์ผิดปกติ หรือที่เรียกกันว่า \"หุ่นไล่กาสีขาว\" ที่จุดโรมิโอ ในทิศทาง 0-3-0"
90100080-6 = "หลังพระอาทิตย์ขึ้น อุณหภูมิก็เพิ่มสูงขึ้นต่อเนื่องตามคาด แต่ตอนนี้ยังไม่มีวี่แววว่าจะเกิดไอร้อนเลย"
90100080-7 = ""
90100080-9 = ""
90100080-10 = "ชักจะน่าเบื่อแล้วสิ ต้องมานั่งรอคู่ต่อสู้ที่ไม่รู้จะโผล่มาเมื่อไรแบบนี้"
90100080-11 = "อ๊ะ โอโทกิ... ไม่สิ FOX 4! อย่าแทรกเข้ามาในช่องสื่อสารตามใจชอบสิ!"
90100080-12 = "จะไปซีเรียสกับเรื่องแค่นั้นทำไม ถือโอกาสคุยกันไปพร้อมๆ กันก็ดีไม่ใช่เหรอ?"
90100080-13 = "FOX 4 รายงาน คงเป็นเพราะตอนนี้พื้นดินยังสะสมความร้อนไม่มากพออย่างที่ FOX 3 บอกไว้ อย่าว่าแต่ปรากฏการณ์ผิดปกติเลย แม้แต่ไอร้อนธรรมดาก็ยังไม่ลอยขึ้นมาสักที"
90100080-14 = "ว่าแต่... วันนี้ให้หลบอยู่ในร่มแบบนี้ จะไม่เป็นอะไรเหรอ?"
90100080-15 = "ถึงวันนี้จะหลบแดดตรงๆ ได้ต่างจากเมื่อวาน ก็เลยรู้สึกหายใจหายคอได้หน่อย แต่ฉันยังไม่รู้เลยว่าเราต้องรับมือกับอะไรกันแน่"
90100080-16 = ""
90100080-18 = ""
90100080-19 = "นี่คือ FOX 1 อย่างที่ฉันกำชับไว้ก่อนเริ่มปฏิบัติการ ตอนนี้ให้ทุกคนโฟกัสกับการสังเกตไอร้อนก่อน"
90100080-20 = "ถึงแม้ตอนนี้จะยังไม่มีหลักฐานแน่ชัดที่ชี้ไปถึงผู้ต้องสงสัย แต่ถ้าเราสังเกตการณ์จากมุมมองเดียวกับ#nผู้เสียหายละก็ เราอาจพบหลักฐานสำคัญก็ได้"
90100080-21 = "หมายความว่า... ถ้าเราเฝ้าสังเกตไอร้อนต่อไปเรื่อยๆ เดี๋ยวก็จะมีอะไรโผล่ออกมางั้นเหรอ?"
90100080-22 = "อย่างซอมบี้ไอร้อนที่เดินตัวบิดๆ เบี้ยวๆ ออกมางี้~"
90100080-23 = "พะ... พูดอะไรเหลวไหล?!"
90100080-24 = "ถ้ายังยืนยันไม่ได้ว่า \"หุ่นไล่กาสีขาว\" คืออะไร เราก็ตัดความเป็นไปได้ใดๆ ทิ้งไม่ได้หรอก"
90100080-25 = "ฉันพูดเล่นต่างหาก... หัวหน้ากองของเรานี่ไม่เข้าใจมุกตลกอะไรเลย"
90100080-26 = ""
90100080-28 = ""
90100080-29 = ""
90100080-30 = "FOX 2 รายงาน ฉันกำลังสังเกตการณ์จากจุดเซียร์รา ในทิศทาง 2-1-0 ตอนนี้ทางนี้ก็ไม่มีปรากฏการณ์ผิดปกติอะไร"
90100080-31 = "ว่าแต่... วันนี้คุณครูไม่มาเหรอ?"
90100080-32 = "อ้อ คุณครูบอกว่าวันนี้มีงานอื่น ก็เลยแยกไปทำงานน่ะ"
90100080-33 = "มีเรื่องอะไรอยากคุยกับคุณครูงั้นเหรอ?"
90100080-34 = "ปะ... เปล่าหรอก ไม่ใช่อย่างนั้น..."
90100080-35 = "ก็แค่... มีลางสังหรณ์ไม่ค่อยดีน่ะ"
90100080-36 = "พอต้องปฏิบัติการโดยไม่มีคุณครูคอยช่วยอยู่ด้วย ฉันก็ไม่ค่อยสบายใจขึ้นมานิดหน่อย"
90100080-37 = "อะไรกัน พวกเราเคยต้องพึ่งคนอื่นตั้งแต่เมื่อไรล่ะ? ที่ผ่านมาก็ผ่านทุกเรื่องกันมาได้ด้วยตัวเองอยู่แล้วนี่"
90100080-38 = "ก็จริงอยู่หรอกนะที่เวลาอยู่กับคุณครูแล้วสนุกกัน คุณครูมักจะเตรียมขนมรสเค็มต่างๆ มาให้ด้วยนี่นะ"
90100080-39 = "นี่เธอคิดว่าคุณครูเป็นเหมือนเจ้าหน้าที่ส่งเสบียงเหรอ...?"
90100080-40 = "แต่จะว่าไปนะ FOX 4 ตั้งแต่ออกมาจากสำนักควบคุม ตัวเธอก็หนาขึ้นอยู่นะ?"
90100080-41 = "เพราะฉันมีกล้ามเนื้อต่างหากล่ะ!"
90100080-42 = ""
90100080-43 = ""
90100080-44 = "FOX 2 เจอความผิดปกติอะไรใหม่ๆ งั้นเหรอ?"
90100080-45 = "เปล่าหรอก อย่างที่ฉันบอกก่อนหน้านี้ มันก็แค่ลางสังหรณ์เท่านั้นน่ะ ไม่ต้องคิดมากหรอก"
90100080-46 = "แต่ลางสังหรณ์ของนิโกะถูกต้องเสมอนะ จะให้มองข้ามเลยไม่ได้หรอก"
90100080-47 = "ไม่สมเป็น FOX 1 เลยนะ... วันนี้พูดอะไรอ่อนแอและอ่อนไหวจัง"
90100080-48 = "เมื่อวานยังพูดอยู่เลยไม่ใช่เหรอ ว่าห้ามด่วนสรุปอะไรก่อนที่ข้อมูลจะครบถ้วน"
90100080-49 = "ในขั้นวางแผนอาจเป็นอีกเรื่องหนึ่ง แต่เมื่ออยู่ในภาคสนาม สัญชาตญาณก็เป็นอาวุธสำคัญได้เหมือนกัน"
90100080-50 = "ความรอบคอบไม่มีคำว่ามากเกินไปหรอก"
90100080-51 = "ก็จริงนะ ถ้าทำปฏิบัติการลักษณะเดียวกันซ้ำๆ หลายครั้ง บางทีร่างกายก็จดจำได้ก่อนสมองเหมือนกัน... คำพูดนั้นก็มีเหตุผลอยู่"
90100080-52 = "แต่สิ่งที่ฉันกังวล ไม่ใช่ปัญหาแวดล้อมอย่างการคาดการณ์ว่าจะโดนซุ่มโจมตีหรือโดนศัตรูลอบยิงหรอก"
90100080-53 = "แต่เป็นความรู้สึกไม่สบายใจในระดับรากฐานว่า บางทีทิศทางของปฏิบัติการนี้อาจผิดมาตั้งแต่ต้น หรือในบางจังหวะพวกเราอาจกำลังหันปากกระบอกปืนใส่ฝ่ายเดียวกันอยู่ก็ได้"
90100080-54 = "ก็อย่างเช่น... ใช่แล้วละ เหมือนตอนที่เราไป <ล่ากระต่าย> กันตอนนั้น"
90100080-55 = "..."
90100080-56 = "FOX 1... ประธานองค์การนักเรียนที่สั่งการปฏิบัติการครั้งนี้ เป็นตัวจริงแน่เหรอ?"
90100080-57 = "ประธานองค์การนักเรียนเป็นตัวจริง... เธอก็ยืนยันจากรูปถ่ายกับวิดีโอไปแล้วไม่ใช่เหรอ?"
90100080-58 = "อื้อ ทั้งใบหน้า ท่าทาง ทุกอย่างไม่มีผิดเพี้ยน... 'เธอคนนั้น' คือประธานองค์การนักเรียนตัวจริง#nที่พวกเราจดจำได้"
90100080-59 = "แต่บางทีอาจเป็นเพราะ[ruby=ตำนาน]ศัตรู[/ruby]ที่เรากำลังเผชิญอยู่ เป็นตัวตนที่ยากจะเชื่อว่ามีอยู่จริงตามข่าวลือ ฉันก็เลยรู้สึกไม่สบายใจตลอดการปฏิบัติการเลยน่ะ"
90100080-60 = "อย่างน้อยถ้ามีคุณครูคอยให้คำแนะนำอยู่ข้างๆ ก็คงทำให้ฉันสบายใจขึ้นได้บ้างนะ"
90100080-61 = "แต่ยังไงเราก็เรียกคุณครูที่ยุ่งกับงานของชาเล่ต์ออกมาอยู่ด้วยทุกวันไม่ได้หรอก"
90100080-62 = ""
90100080-64 = ""
90100080-65 = "อื้อ เอาเป็นว่า ฉันรับรู้ถึงความกังวลนี้แล้ว"
90100080-67 = "FOX 4 รายงาน อุณหภูมิภายนอกแตะ 31 องศาแล้ว"
90100080-68 = "สังเกตพบไอร้อนลอยขึ้นมาจากพื้นถนน"
90100080-69 = "เห็นอะไรที่คล้ายหุ่นไล่กาสีขาวหรือเปล่า?"
90100080-70 = "ไม่เลย อ้อ ถ้าแสงสีขาวที่สะท้อนจากกระจกหน้าต่างไปซ้อนกับไอร้อน ก็คงดูคล้ายหุ่นไล่กาสีขาวได้เหมือนกัน"
90100080-72 = "อืมม..."
90100080-73 = "เป็นอะไรเหรอ FOX 4?"
90100080-74 = "เปล่าหรอก แค่พอมองพื้นที่บิดเบี้ยวเพราะไอร้อน ก็รู้สึกเหมือนจะเวียนหัวนิดหน่อยน่ะ"
90100080-75 = "จะว่าไป ก่อนหน้านี้ฉันเคยได้ยินสมาชิกคนอื่นที่เคยออกไปปฏิบัติการที่โรงเรียนโอดิสซีย์เล่าไว้ว่า"
90100080-76 = "ที่โรงเรียนโอดิสซีย์  ถ้าเห็นนักเรียนคนไหนเอาแต่มองผิวน้ำนิ่งๆ ก็ต้องลากตัวออกมาทันที"
90100080-77 = "ทำไมเหรอ...?"
90100080-79 = "ฉันไม่ได้ยินเหตุผลอย่างละเอียดหรอก แต่เห็นว่าระลอกคลื่นบนผิวน้ำที่กระเพื่อมเป็นจังหวะสม่ำเสมอ จะสะกดจิตคนได้หรืออะไรทำนองนั้น"
90100080-80 = "ก็เลยต้องรีบลากตัวออกมา ก่อนที่พวกเขาจะกระโดดลงน้ำเองน่ะ"
90100080-82 = "ฮืม เหมือนตำนานเมืองเรื่อง <ไซเรน> ที่อยู่ในนิทานใช่มั้ย?"
90100080-83 = "ก็ยังฟังดูมีเหตุผลกว่านางเงือกครึ่งคนครึ่งปลาที่นั่งร้องเพลงอยู่บนโขดหินละนะ"
90100080-84 = "เพราะงั้น FOX 4 เองก็ระวังตัวด้วยล่ะ เธออาจโดนไอร้อนล่อลวงจนเดินเลยออกไปจากถนนลาดยาง#nก็ได้นะ"
90100080-85 = "อะไรกัน ไม่หรอกน่า เราออกปฏิบัติการมาตั้งกี่ครั้งแล้ว"
90100080-86 = "อีกอย่าง วันนี้ก็มีคู่หูช่างพูดอยู่ข้างๆ แบบนี้ คงไม่มีทางที่บทสนทนาจะเงียบหรอก..."
90100080-87 = ""
90100080-91 = "หืม...?"
90100080-92 = "เป็นอะไรไป เจออะไรงั้นเหรอ?"
90100080-93 = "ตรงนั้น ในที่แบบนั้น... เคยมีทุ่งหญ้าอยู่ด้วยเหรอ?"
90100080-94 = "ทุ่งหญ้า? ตรงไหน ทิศทางกี่นาฬิกา?"
90100080-95 = "เป็นภาพลวงตาหรือเปล่านะ... ทั้งที่ในแผนที่ไม่มีอยู่แท้ๆ แต่ฉันกลับมองเห็นทุ่งหญ้าใต้ท้องฟ้าสีคราม#nอยู่เลยถนนออกไป"
90100080-96 = "กลางทุ่งหญ้าที่ขึ้นรก มีหุ่นไล่กาเก่าๆ ตัวหนึ่ง เลยออกไปก็มีคนในชุดสีขาวกำลังยิ้มอย่างประหลาด..."
90100080-97 = "นั่นคือ <หุ่นไล่กาสีขาว> ที่ผู้เสียหายเห็นกันหรือเปล่า?"
90100080-98 = "FOX 4 รายงานพิกัดเร็วเข้า! มันอยู่ทางไหนน่ะ?!"
90100080-99 = ""
90100080-108 = ""
90100080-109 = ""
90100080-110 = "สถานที่ที่สายลมน่าขนลุกและอบอ้าวพัดมา..."
90100080-111 = ""
90100080-115 = "ผู้เสียหายทุกคนเรียกสิ่งนั้นว่าหุ่นไล่กาสีขาว แต่สิ่งนั้นไม่ใช่หุ่นไล่กา"
90100080-116 = "มันกำลังเคลื่อนไหวด้วยเจตจำนงของตัวเอง เพราะถ้าไม่เต้นรำ มันก็ไม่อาจดำรงอยู่ได้ ถ้าไม่มีใครสังเกตเห็น มันก็ไม่อาจแทรกแซงได้ มันจึงสวมชุดสีขาวที่สะดุดตา แล้วเต้นรำอย่างบ้าคลั่ง"
90100080-117 = "นี่มันเรื่องไร้สาระอะไรกัน FOX 4! ตั้งสติหน่อยสิ!"
90100080-118 = "มาแล้ว มันกำลังใกล้เข้ามา คลื่นสีเทาขนาดมหึมาบิดตัวกระตุก ร่ายรำอย่างผิดธรรมชาติ ค่อยๆ คืบคลานเข้ามา..."
90100080-119 = "บิดไป บิดมา บิดไป บิดมา..."
90100080-120 = ""
90100080-129 = "โอโทกิ...!"
90100080-130 = ""
90100080-135 = "อะ... อะไรน่ะ? เมื่อกี้ฉันได้ยินเสียงปืน..."
90100080-136 = "ตอบด้วย จุดโรมิโอ  เกิดอะไรขึ้น?"
90100080-139 = ""
90100080-140 = "โอ๊ย... FOX 3 เป็นบ้าไปแล้วแน่ๆ! จู่ๆ ก็พุ่งเข้ามาฟาดหัวฉัน!"
90100080-141 = "เธอนั่นแหละ ยังมีสติดีอยู่หรือเปล่า? รู้มั้ยว่าคนที่ยืนอยู่ตรงหน้าเธอคือใคร?"
90100080-142 = ""
90100080-144 = ""
90100080-145 = "รู้สิ อกแบนๆ แบบนี้ฉันก็เห็นอยู่ทุกวี่ทุกวัน"
90100080-146 = "เลิกพูดเล่นได้แล้ว! เห็นนิ้วกี่นิ้ว?"
90100080-147 = "สอง...? อะไรเนี่ย จะทดสอบสติปัญญาฉันหรือไง?"
90100080-148 = ""
90100080-150 = ""
90100080-151 = "โล่งอกไปที ฉันนึกว่าเธอจะหมดสติไปเหมือนผู้เสียหายคนอื่นแล้วเสียอีก"
90100080-152 = "FOX 3 เมื่อกี้เกิดอะไรขึ้นกันแน่?"
90100080-153 = "FOX 3 รายงาน เมื่อกี้ FOX 4 ที่กำลังสังเกตไอร้อนอยู่..."
90100080-154 = "รายงานว่าตัวเองเห็น 'หุ่นไล่กาสีขาว'"
90100080-155 = "ฉันน่ะเหรอ?!"
90100080-156 = "อื้อ จำไม่ได้เหรอ? หลังจากนั้นเธอก็เริ่มพูดเรื่องแปลกๆ ทั้งทุ่งหญ้าใต้ท้องฟ้าสีคราม ทั้งคลื่นสีเทาอะไรนั่น"
90100080-157 = "ฉันไม่เห็นจำได้เลย"
90100080-158 = "ฉันก็แค่ฟังเธอเล่าเรื่องโรงเรียนโอดิสซีย์ แล้วก็มองไอร้อนผ่านกล้องเล็งไปด้วยเท่านั้นเอง"
