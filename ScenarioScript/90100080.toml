[translation]
90100080-1 = "Episode 8;Beyond the Haze"
90100080-2 = ""
90100080-3 = "FOX 3, reporting in."
90100080-4 = "Log. It is now 1000 KST. Current temperature is 28 degrees Celsius. Wind speed is approximately 3 knots."
90100080-5 = "We are currently verifying the emergence of an anomaly, tentatively referred to as the \"white scarecrow.\" FOX 4 stands at Point Romeo in the 0-3-0 bearing."
90100080-6 = "The temperature has been rising steadily since sunrise, but there is no sign of haze yet."
90100080-7 = ""
90100080-9 = ""
90100080-10 = "This is so boring. I never thought I'd have to be on the lookout for hot air."
90100080-11 = "Listen, Oto—NO... I mean, FOX 4! Keep the comm line clear!"
90100080-12 = "Don't get so heated. We might as well talk to each other while we're waiting."
90100080-13 = "This is FOX 4. As FOX 3 mentioned, there isn't even a trace of ordinary haze, let alone an anomalous variety. Perhaps the ground isn't hot enough yet."
90100080-14 = "...It's so much nicer today, right? Working in the actual shade?"
90100080-15 = "I feel so much better, and my head's clearer too. It's still hard to know what we're looking out for."
90100080-16 = ""
90100080-18 = ""
90100080-19 = "FOX 1, reporting in. Focus on the haze, as previously discussed. That is what you're looking for."
90100080-20 = "While we don't have a clear suspect, we could get a clue if we try to see things from the victims' points of view."
90100080-21 = "Does that mean you think staring at a non-existent haze is productive?"
90100080-22 = "All right. I'll keep both eyes wide open. We're looking for a ghostly figure made out of hot gas, ladies."
90100080-23 = "D-Do you ever think before you speak?"
90100080-24 = "We can't rule out any possibilities yet. We need to uncover the truth behind the \"white scarecrow.\""
90100080-25 = "...I was just kidding. Sorry, Squad Leader. I forgot that you're immune to humor."
90100080-26 = ""
90100080-28 = ""
90100080-29 = ""
90100080-30 = "FOX 2 here. Currently observing 2-1-0 from Point Sierra. Nothing unusual on this end, either."
90100080-31 = "Yeah... So, no Sensei today?"
90100080-32 = "Ah, Sensei mentioned that they had some other work to get to."
90100080-33 = "Did you want to tell them something?"
90100080-34 = "N-No. It's not like that..."
90100080-35 = "I just had a bad feeling. Like dread."
90100080-36 = "There's something about carrying out a mission without Sensei's help. I just hope it goes well."
90100080-37 = "Hey, since when do we need anyone else? We've always been capable, right?"
90100080-38 = "I miss Sensei. They always have new salty snacks."
90100080-39 = "What, you think Sensei is your personal gopher?"
90100080-40 = "Now that I think about it, FOX 4, you've been looking a little bloated ever since we left the Corrections Bureau."
90100080-41 = "That's muscle!"
90100080-42 = ""
90100080-43 = ""
90100080-44 = "FOX 2, do you see anything suspicious?"
90100080-45 = "No. Like I said, it's just a hunch. Don't worry about it."
90100080-46 = "Your instincts are almost always right. It's hard not to be concerned."
90100080-47 = "...You're acting surprisingly soft and sentimental today, FOX 1."
90100080-48 = "I thought you just told us not to jump to conclusions without supporting evidence."
90100080-49 = "Evidence is necessary to build a case. But in the field, you have to trust your intuition."
90100080-50 = "You can never be too careful."
90100080-51 = "Sometimes I find my instincts saving me in the heat of the moment, all without me even thinking. I see what you mean."
90100080-52 = "But that's not what was bothering me. It wasn't a present danger, like a suspected enemy ambush or a sniper attack."
90100080-53 = "It's more of a fundamental uneasiness. As if there's a fundamental flaw in our mission. Or that we might end up betraying each other."
90100080-54 = "Like in our old \"rabbit hunt\" from back in the day."
90100080-55 = "..."
90100080-56 = "...FOX 1. Are you certain you met with the genuine General Student Council President?"
90100080-57 = "...She was real. She was in front of me. You've all seen the photos and videos."
90100080-58 = "Right. Right face, right actions, and \"she\" was undoubtedly the General Student Council President that we all remember."
90100080-59 = "Maybe it's because we're not even sure this \"Lore\" enemy we're fighting actually exists. But this mission's made me nervous since the start."
90100080-60 = "If Sensei were here to give us advice, their guidance might help me feel less anxious, you know."
90100080-61 = "But we can't just ask Sensei to help us every day. They have an actual job."
90100080-62 = ""
90100080-64 = ""
90100080-65 = "Yes. Well noted."
90100080-67 = "FOX 4, reporting in. The temperature has reached 31 degrees Celsius."
90100080-68 = "Haze has begun rising off the asphalt."
90100080-69 = "Do you see anything resembling a white scarecrow?"
90100080-70 = "Negative. Let me try focusing on the glare reflected off the window."
90100080-72 = "Um..."
90100080-73 = "What's wrong, FOX 4?"
90100080-74 = "Nothing. I started to feel dizzy. It's disorienting, seeing the ground move like this."
90100080-75 = "I heard about this from another SRT member. She was on assignment at Odyssey."
90100080-76 = "They have a policy at Odyssey Academy. If you spot a student silently gazing down at the water's surface, you have to pull them away immediately."
90100080-77 = "...Why?"
90100080-79 = "I didn't catch the details, but they said that the ripples on the water have a way of hypnotizing people. It pulls them into a trance."
90100080-80 = "So you have to pull them away before they jump in!"
90100080-82 = "Huh. That reminds me of another myth. Have you all ever heard of sirens?"
90100080-83 = "Well, the water thing makes more sense than some half-human monster belting out songs!"
90100080-84 = "Watch out for the heat haze, FOX 4. You might get possessed and fly into the asphalt."
90100080-85 = "Get real. Just how many missions do you think I have under my belt?"
90100080-86 = "And with a chatterbox like you yammering on, there's no way I'll lose focus."
90100080-87 = ""
90100080-91 = "...Huh?"
90100080-92 = "What's wrong, did you see something?"
90100080-93 = "Was there always...a field of grass over there?"
90100080-94 = "A grass field? Where, which direction?"
90100080-95 = "Maybe it's a mirage... I know it wasn't on the map, but I see a field over the street."
90100080-96 = "There's a shabby scarecrow in the middle of overgrown grass, and a person in white clothes with a creepy smile..."
90100080-97 = "Wait, is that the \"white scarecrow\" that the victims saw?"
90100080-98 = "FOX 4, give us the coordinates! Where are you facing?"
90100080-99 = ""
90100080-108 = ""
90100080-109 = ""
90100080-110 = "...A place where chilling yet muggy wind blows."
90100080-111 = ""
90100080-115 = "The victims called it a white scarecrow, but it's not one at all."
90100080-116 = "It moves on its own volition. It cannot exist unless it dances. It cannot exert influence unless observed. So it dances in fits and starts. Always clad in white."
90100080-117 = "What are you saying, FOX 4?! Get a hold of yourself!"
90100080-118 = "It's here. It's coming. The grand gray wave, writhing as if it's spasming, squirming as if it's dancing..."
90100080-119 = "Squirm squirm squirm squirm squirm squirm..."
90100080-120 = ""
90100080-129 = "...OTOGI!"
90100080-130 = ""
90100080-135 = "Wh-What was that?!"
90100080-136 = "Point Romeo, come in. What happened?"
90100080-139 = ""
90100080-140 = "Oww... FOX 1, FOX 3's acting out! She charged me and smacked me square in the head!"
90100080-141 = "Speak for yourself! Are you insane? Listen up! Do you know who I am?"
90100080-142 = ""
90100080-144 = ""
90100080-145 = "Uh, yeah. You're the girl with the flat chest. Like an ironing board."
90100080-146 = "Shut it! How many fingers am I holding up?"
90100080-147 = "Two, genius. Do I pass?"
90100080-148 = ""
90100080-150 = ""
90100080-151 = "What a relief. I thought you got knocked out like the other victims."
90100080-152 = "FOX 3, status report."
90100080-153 = "This is FOX 3. FOX 4, who was just observing the haze..."
90100080-154 = "...said that she spotted the \"white scarecrow.\""
90100080-155 = "I did?!"
90100080-156 = "Yeah. You don't remember? You were waxing poetic about overgrown grass fields and waves."
90100080-157 = "...I really don't."
90100080-158 = "I was...watching the haze. You were talking about Odyssey."
90100080-159 = "Weird. What...was I hallucinating?"
90100080-160 = "What matters is that you're safe. Next, assess any damage. You fired a shot."
90100080-161 = "Ugh... Let me check."
90100080-162 = "I just hope I didn't hurt someone..."
90100080-163 = ""
90100080-165 = ""
90100080-166 = "...Huh?"
90100080-167 = "Wh-What's wrong? Please don't tell me you hit a civilian."
90100080-168 = "No, that's not it... There are no impact marks. Anywhere! But I wasn't working with duds..."
90100080-169 = "What? You're telling me that 50-caliber bullet just vanished into thin air?"
90100080-170 = "...Maybe it really was a ghost."
90100080-171 = ""
90100080-172 = ""
90100080-173 = "FOX 1, do you have a hunch?"
90100080-174 = "Not yet. We should review the situation first."
90100080-175 = ""
90100080-177 = ""
90100080-178 = "Squad, return to HQ. Gather your equipment and meet up at the rendezvous point."
90100080-180 = "Roger!"
90100080-182 = "Next Episode;Chasing Illusions"
