[translation]
13320-1 = "제32화;유일한 진실 2"
13320-3 = "저 뇌제의 병기는 상대하기가 까다롭겠지만…… 대책위원회와 선생님이라면 어떻게든 막아내겠지."
13320-4 = "스오우의 안전을 확보한 다음 선생님은 이쪽으로 올 거야. 그러니 너는 여기서 얌전히 기다리면 돼."
13320-5 = "너도 알고 있잖아. 이 문제들은 이렇게 해결될 거야. 타카나시 호시노."
13320-9 = "……."
13320-10 = "뭔가 모든 걸 다 알고 있다는 듯이 말하네, 선도부장 쨩."
13320-12 = "……그렇잖아."
13320-13 = "그렇게 잘난 듯이 말하고 있지만…… 이 세상엔 해결될 수 없는 것들도 있어."
13320-14 = "……."
13320-15 = "죽은 사람은 되살리지 못해."
13320-16 = "이미 벌어진 일을 없던 걸로 만들지 못해."
13320-17 = "유메 선배가 죽었다는 사실은, 절대로 변하지 않아."
13320-18 = "그건……."
13320-19 = "어째서……?"
13320-20 = "유메 선배는 어째서 죽어야만 했던 거야……?"
13320-21 = "대체 어디서부터 잘못되었던 거길래……? 선배는 그런 비참한 죽음을 맞은 거야……?"
13320-22 = "왜……?"
13320-23 = "(……상태가 이상해. 뭔가를…… 환영을 보고 있는 건가?)"
13320-24 = "……. 수첩은……?"
13320-25 = "수첩……?"
13320-30 = "그건 대체 어디에 있는 거야?"
13320-31 = "거기에 유메 선배는 무슨 말을 적어놓은 거야?"
13320-32 = "그걸 놔뒀다는 <거기>는 대체 어디인 거야……?"
13320-33 = "……?"
13320-34 = "나는 영원히 그 안에 뭐가 적혀 있는지 모른 채로 살아야 하는 거야……?"
13320-35 = "(호시노의 상태가 뭔가 이상해.)"
13320-37 = "오오. 조금만 더, 조금만 더……!!"
13320-38 = "선생은 없다. 방해자는 없다."
13320-39 = "우리는, 죽음이라는 절대적 진실에 대해서 아무것도 알지 못한다."
13320-40 = "타카나시 호시노는 쿠치나시 유메의 죽음의 진실에 대해서 영원히 알지 못한다."
13320-41 = "수첩? 그딴 건 말할 것도 없다!"
13320-42 = "이 세상의 그 누구도 쿠치나시 유메의 죽음에 대해 알 수 없다!"
13320-43 = "죽음은 그런 것이다!!"
13320-52 = "그리고 이 세계에서 거기에 가장 근접했던 자는 네가 유일하다. 키보토스 최고의 신비. 새벽의 호루스! 새벽에 발 묶인 태양의 신이여!"
13320-53 = "너는 여섯 번째 화두의 해답으로 이어진 실마리다!"
13320-54 = "너 정도의 신성이 죽음이라는 비의와 마주하게 되면 무슨 일이 벌어지는 건지 알려다오!"
13320-55 = "그것이 바로 나에게 주어지는 승리의 보상, 즉, 트로피인 것이다!"
13320-57 = "……. 하지만…… 딱 한 가지…… 내가 알고 있는 진실이 있어……."
13320-58 = "(그래…… 네가 유일하게 알고 있는 진실이 있지.)"
13320-59 = "그리고 아마도 그 수첩엔…… 그 진실이 쓰여져 있겠지."
13320-60 = "(그래. 네가 인정할 수밖에 없는 그 진실…… 네가 바라는 그 내용이 적혀 있겠지.)"
13320-61 = "……타카나시 호시노? 누구랑 얘기하고 있는 거야……?"
13320-64 = "이제 학생회 따위 끝이에요! 이런 소꿉장난 따위 때려치워 버릴 테니까!"
13320-65 = "내가 그때 화내지 않았었다면……."
13320-68 = "이것봐, 호시노 쨩. 등에 배낭처럼 메는 물통이래. 편해 보이지? 하나 살까?"
13320-69 = "아니…… 내가 그때 물통을 사는 걸 반대하지 않았었다면……."
13320-72 = "자…… 선배. 받으세요."
13320-74 = "응? 뭐야? 이거?"
13320-75 = "내가 그때 학생회에 가입하지 않았었다면……."
13320-78 = "기, 기다려! 도망가지 말고!! 잠깐만! 할 말이 있어!"
13320-82 = "후, 후엥……?!"
13320-90 = "차라리 내가 그때 유메 선배에게 손을 내밀지 않았었다면……."
13320-93 = "아비도스의 환경 개선을 위한 주민 서명입니다!"
13320-94 = "기업들에게 권고하기 위해서 여러분들의 도움이 필요해요."
13320-95 = "……."
13320-96 = "아니, 애초에 내가 유메 선배와 만나지 않았더라면……."
13320-97 = "선배는…… 죽지 않았을 거야."
13320-105 = "아아…… 그렇구나."
13320-106 = "이제야 알았어."
13320-107 = "유메 선배는"
13320-110 = "내가 죽인 게 맞았어."
13320-115 = "나였어."
13320-116 = "내가 죽였어……."
13320-125 = "내가."
