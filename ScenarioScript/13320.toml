13320-198 = "이, 이건……?"
13320-199 = "포, 폭발은 저쪽이야! 거기에 하늘이……?"
13320-200 = "……!!"
13320-201 = "대체……."
13320-205 = "으윽……."
13320-209 = "이봐, 정신 차려, 감독관! 지금 자고 있을 때가 아니라고!"
13320-210 = "무리야- 완전히 기절했어-"
13320-215 = "선생님…… 이건……."
13320-216 = "어떻게든 열차포는 멈추게 했지만……. 이번에는 또 뭐가……."
13320-217 = "아, 아니, 지금은 이제 열차포는 아무래도 상관없을 거 같은데……."
