[translation]
10055110-1 = "後日談その2;海賊、忍者、万魔殿"
10055110-4 = "よっほっほ！"
10055110-5 = "イブキはおそろしー海賊だー！"
10055110-6 = "イブキがキャプテンで、くまさんが副キャプテン……。"
10055110-7 = "そしてニンペロさんは忍者！"
10055110-8 = "[s1] \"忍者……？\"\n[s2] \"先生は？\""
10055110-11 = "あ、先生！"
10055110-12 = "海賊のこと、結構気に入ったようですねイブキ。"
10055110-13 = "うん！あのね、海賊はすごくカッコイイの！"
10055110-14 = "カッコイイのかは分からないですけど……イブキが好きならよかったです。"
10055110-19 = "忍者に続き今度は海賊か。"
10055110-20 = "もちろん、一番はマコト様だろうがな！キキキキッ！"
10055110-21 = "忍者……海賊……マコト先輩……？"
10055110-25 = "全部好きってことだ！！！"
10055110-26 = "「好き」に優劣などない！！！"
10055110-27 = "あ、今不安になって無理やりまとめましたね。"
10055110-28 = "あっ。"
10055110-29 = "いいこと思いついた！忍者海賊万魔殿はどう？"
10055110-30 = "よい！！！"
10055110-31 = "分かってないのに適当な返事しないでください。"
10055110-32 = "イブキの提案がよくないわけがないだろう！！"
10055110-33 = "いやまあ、そうですけど……。"
10055110-34 = "忍者海賊万魔殿って……怪しすぎませんか？"
10055110-36 = "[ns3] \"忍者に、海賊……？\"\n[ns4] \"イブキは天才だった？\""
10055110-39 = "……？"
10055110-40 = "私が世間についていけてないのでしょうか？"
10055110-41 = "あははっ！イロハちゃんは空気読まない派だもんね。"
10055110-42 = "その反対だと思ってますけど……？"
10055110-43 = "ん～そうかなあ？"
10055110-44 = "う……チアキ？"
10055110-45 = "あはは！ごめんごめん、でもイロハちゃんが不安そうな姿、珍しいからつい。"
10055110-50 = "あの……チアキ。"
10055110-51 = "え？"
10055110-52 = "すみませんでした。"
10055110-53 = "その、不安にさせましたよね。船でのこと。"
10055110-57 = "……！"
10055110-62 = "今の顔、今の顔もう一回だけ！"
10055110-63 = "ああっ、もう！今のなしです！"
10055110-64 = "もう一回だけ～～！お願い！撮らせて～～！！"
10055110-69 = "二度とするかっ！！"
