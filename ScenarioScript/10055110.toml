[translation]
10055110-1 = "ย้อนวันวาน;โจรสลัด นินจา และแพนเดโมเนียม โซไซตี้"
10055110-2 = ""
10055110-3 = ""
10055110-4 = "โฮ่ๆๆ"
10055110-5 = "อิบูกิเป็นโจรสลัดที่น่ากลัวมากนะ!"
10055110-6 = "อิบูกิเป็นกัปตัน คุณหมีเป็นรองกัปตัน..."
10055110-7 = "แล้วก็คุณนินเพโร่เป็นนินจา!"
10055110-8 = "[s1] \"นินจา...?\"\n[s2] \"แล้วครูล่ะ?\""
10055110-11 = "อ๊ะ คุณครู!"
10055110-12 = "ดูท่าจะชอบโจรสลัดเอามากๆ เลยนะคะ อิบูกิ"
10055110-13 = "อื้อ! ใช่แล้ว! ก็โจรสลัดเท่มากเลยนะ!"
10055110-14 = "เท่หรือเปล่า... ฉันก็ไม่แน่ใจ แต่ถ้าอิบูกิชอบก็ดีแล้วละค่ะ"
10055110-15 = ""
10055110-17 = ""
10055110-18 = ""
10055110-19 = "ต่อจากนินจา คราวนี้เป็นโจรสลัดงั้นหรือ"
10055110-20 = "แน่นอนว่าอันดับหนึ่งต้องเป็นท่านมาโคโตะผู้นี้อยู่แล้ว! คิกคิกคิก!"
10055110-21 = "นินจา... โจรสลัด... รุ่นพี่มาโคโตะ...?"
10055110-22 = ""
10055110-24 = ""
10055110-25 = "เอาเป็นว่าอิบูกิชอบทั้งหมดเลย!!!!"
10055110-26 = "สิ่งที่ชอบน่ะ ไม่มีอะไรเหนือกว่ากันหรอก!!!!"
10055110-27 = "อ่า กลัวโดนแย่งซีนก็เลยรีบสรุปไปแบบนั้นสินะคะ"
10055110-28 = "อ๊ะ"
10055110-29 = "นึกอะไรดีๆ ออกแล้ว! แพนเดโมเนียม โซไซตี้นินจาโจรสลัดเป็นไง~?"
10055110-30 = "สุดยอด!!!"
10055110-31 = "อย่าตอบทั้งที่ยังไม่รู้ว่าหมายถึงอะไรสิคะ"
10055110-32 = "ข้อเสนอของอิบูกิไม่มีทางไม่ดีอยู่แล้วไม่ใช่รึไง!!!"
10055110-33 = "ก็... อืม มันก็จริงค่ะ แต่ว่า..."
10055110-34 = "แพนเดโมเนียม โซไซตี้นินจาโจรสลัด... ฟังดูเป็นกลุ่มที่น่าสงสัยเกินไปรึเปล่าคะ?"
10055110-35 = ""
10055110-36 = "[ns3] \"ทั้งนินจา ทั้งโจรสลัดเลยเหรอ...? \"\n[ns4] \"อิบูกิเป็นอัจฉริยะหรือเปล่าเนี่ย...?\""
10055110-39 = "...?"
10055110-40 = "หรือเป็นฉันเองที่ตามโลกไม่ทันแล้วนะคะ?"
10055110-41 = "อะฮะฮ่า! อิโรฮะจังดูบรรยากาศไม่เป็นเลยนะ"
10055110-42 = "แต่ฉันคิดว่าตรงกันข้ามเลยนะคะ...?"
10055110-43 = "อืม~ จะเป็นแบบนั้นจริงเหรอ~?"
10055110-44 = "อืม... จิอากิ"
10055110-45 = "ฮะฮ่า! ขอโทษๆ! ไม่ค่อยได้เห็นอิโรฮะจังร้อนใจแบบนี้ ก็เลยเผลอแซวไปน่ะ"
10055110-46 = ""
10055110-48 = ""
10055110-49 = ""
10055110-50 = "นี่... จิอากิ"
10055110-51 = "หืม?"
10055110-52 = "ขอโทษนะคะ"
10055110-53 = "คือ... ฉันทำให้กังวลใช่มั้ยคะ? เพราะเรื่องหลายๆ อย่างที่เกิดขึ้นบนเรือน่ะ"
10055110-54 = ""
10055110-56 = ""
10055110-57 = "...!"
10055110-58 = ""
10055110-60 = ""
10055110-61 = ""
10055110-62 = "สีหน้าตอนนี้! ฉันขอถ่ายสีหน้าตอนนี้สักครั้งเถอะนะ!"
10055110-63 = "อ๊ะ พอแล้วค่ะ! พอแค่นี้แหละค่ะ!"
10055110-64 = "ขอแค่ครั้งเดียวเอง~!"
10055110-65 = ""
10055110-67 = ""
10055110-69 = "โธ่ จริงๆ เลย! ฉันจะไม่ขอโทษอีกแล้วค่ะ!"
