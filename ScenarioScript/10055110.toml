[translation]
10055110-1 = "後日談;海盜、忍者、萬魔殿"
10055110-2 = ""
10055110-3 = ""
10055110-4 = "喲呵呵！"
10055110-5 = "伊吹是超～可怕的海盜！"
10055110-6 = "伊吹是船長，熊熊先生是副船長……"
10055110-7 = "然後忍佩洛先生是忍者！"
10055110-8 = "[s1] 「忍者……？」\n[s2] 「那老師呢？」"
10055110-11 = "啊，老師！"
10055110-12 = "伊吹，看來你很喜歡海盜呢。"
10055110-13 = "嗯！跟你說！海盜超帥的！"
10055110-14 = "帥不帥……我是不太懂，不過伊吹喜歡就好。"
10055110-15 = ""
10055110-17 = ""
10055110-18 = ""
10055110-19 = "繼忍者之後，這次是海盜嗎？"
10055110-20 = "當然，第一名肯定是本大人！嘰嘻嘻！"
10055110-21 = "忍者……海盜……真琴前輩……？"
10055110-22 = ""
10055110-24 = ""
10055110-25 = "就當作全部都喜歡吧！！！！"
10055110-26 = "喜歡的東西沒有高下之分！！！！"
10055110-27 = "啊，你是怕被比下去，才硬湊出這個結論吧。"
10055110-28 = "啊。"
10055110-29 = "我想到好主意了！叫忍者海盜萬魔殿怎麼樣～？"
10055110-30 = "好！！！"
10055110-31 = "不知道在說什麼就不要隨便答應啦。"
10055110-32 = "伊吹的提議怎麼可能不好！！！"
10055110-33 = "話是這麼說沒錯啦……"
10055110-34 = "忍者海盜萬魔殿……這也太可疑了吧？"
10055110-35 = ""
10055110-36 = "[ns3] 「忍者加上海盜……？」\n[ns4] 「伊吹是天才嗎……？」"
10055110-39 = "……？"
10055110-40 = "難道是我跟不上時代了嗎？"
10055110-41 = "啊哈哈！因為伊呂波醬是不看氣氛的那一派嘛。"
10055110-42 = "我倒覺得正好相反……？"
10055110-43 = "唔嗯～是這樣嗎～？"
10055110-44 = "唔……千秋。"
10055110-45 = "啊哈！抱歉抱歉！可是很少看到伊呂波醬著急的樣子，我就忍不住了。"
10055110-46 = ""
10055110-48 = ""
10055110-49 = ""
10055110-50 = "……那個，千秋。"
10055110-51 = "嗯？"
10055110-52 = "對不起。"
10055110-53 = "那個……在船上發生的那些事，讓你擔心了吧？"
10055110-54 = ""
10055110-56 = ""
10055110-57 = "……！"
10055110-58 = ""
10055110-60 = ""
10055110-61 = ""
10055110-62 = "剛剛那個表情！剛剛那個表情再讓我拍一張就好！"
10055110-63 = "啊，夠了！到此為止！"
10055110-64 = "一張就好～！"
10055110-65 = ""
10055110-67 = ""
10055110-69 = "啊，真是的！我再也不會道歉了！"
