[translation]
10055110-1 = "후일담;해적, 닌자, 만마전"
10055110-4 = "요호호!"
10055110-5 = "이부키는 무시무시한 해적이다!"
10055110-6 = "이부키가 선장이고, 곰돌이 씨가 부선장……."
10055110-7 = "그리고 닌페로 씨는 닌자야!"
10055110-8 = "[s1] \"닌자……?\"\n[s2] \"선생님은?\""
10055110-11 = "아, 선생님!"
10055110-12 = "해적이 꽤 마음에 들었나 보네요, 이부키."
10055110-13 = "응! 있지! 해적은 되게 멋있다!"
10055110-14 = "멋있는지는…… 잘 모르겠지만, 이부키가 좋아하니 다행이네요."
10055110-19 = "닌자에 이어서, 이번에는 해적인가."
10055110-20 = "물론, 일등은 이 몸이겠지만 말이야! 키시싯!"
10055110-21 = "닌자…… 해적…… 마코토 선배……?"
10055110-25 = "전부 좋다는 걸로!!!!"
10055110-26 = "좋아하는 것에 우열은 없다!!!!"
10055110-27 = "아, 지금 밀려날까 봐 억지로 정리했네요."
10055110-28 = "아."
10055110-29 = "좋은 생각 났어! 닌자 해적 만마전은 어때~?"
10055110-30 = "좋다!!!"
10055110-31 = "무슨 말인지도 모르면서 대답하지 마세요."
10055110-32 = "이부키의 제안이 나쁜 것일 리 없지 않느냐!!!"
10055110-33 = "아니, 뭐, 그렇기는 하지만……."
10055110-34 = "닌자 해적 만마전이라니…… 너무 수상한 집단 아닌가요?"
10055110-36 = "[ns3] \"닌자에, 해적……? \"\n[ns4] \"이부키는 천재인가……?\""
10055110-39 = "……?"
10055110-40 = "혹시 제가 세상을 못 따라가는 건가요?"
10055110-41 = "아하하! 이로하 쨩은 분위기를 읽지 않으니까."
10055110-42 = "저는 그 반대라 생각했는데요……?"
10055110-43 = "으음~ 과연 그럴까~?"
10055110-44 = "으…… 치아키."
10055110-45 = "아핫! 미안! 그치만, 이로하 쨩이 초조해하는 건 보기 드물어서 무심코."
10055110-50 = "……저, 치아키."
10055110-51 = "응?"
10055110-52 = "미안해요."
10055110-53 = "그, 불안하게 했죠? 배에서 여러 일들 때문에."
10055110-57 = "……!"
10055110-62 = "지금 얼굴! 지금 얼굴 한 번만 찍게 해줘!"
10055110-63 = "아, 됐어요! 이걸로 끝이에요!"
10055110-64 = "한 번만~!"
10055110-69 = "아, 진짜! 다시는 사과 같은 거 안 할 거예요!"
