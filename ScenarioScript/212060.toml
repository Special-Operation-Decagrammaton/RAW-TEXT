[translation]
212060-1 = "第6話;溫泉開發部"
212060-3 = ""
212060-4 = "……以上就是議長的命令。"
212060-5 = "……哈哈。真是讓人無言。"
212060-6 = "什麼？"
212060-7 = "喂，我們什麼時候開始聽萬魔殿的命令了？#n就算是拜託，我們也不會聽吧。"
212060-8 = "而且內容也很奇怪。要我們在一週內蓋好8座M級軍需倉庫？"
212060-9 = "我們是挖溫泉的，又不是土木建設部？嗯？你怎麼看？"
212060-10 = "那種事無所謂。命令已經下達，你們就得執行。"
212060-11 = "哈……"
212060-12 = "在對奇普托斯的聖戰迫在眉睫之際，你們打算拒絕萬魔殿的指示嗎？"
212060-13 = "那麼一來，你們溫泉開發部就會成為格黑娜的叛徒。#n叛徒的下場，不用我特地說出口你們也知道吧。"
212060-14 = "什麼時候變得這麼會替人著想了……"
212060-15 = ""
212060-17 = ""
212060-19 = ""
212060-20 = "哦哦！是工作嗎？有事情可以做了嗎？"
212060-21 = ""
212060-24 = ""
212060-25 = "惠……！"
212060-26 = "沒錯。是偉大的格黑娜不可或缺的工作。"
212060-28 = "嗯！那就要做啊！哇啊～！我們終於也有事情可以做了！"
212060-29 = "惠，這種事不能這麼衝動地……"
212060-30 = "不是啦，佳澄部長！人家都說是不可或缺的工作了嘛！"
212060-31 = "所以說，那個……"
212060-32 = "佳澄部長很聰明，一定比我更懂！#n我們是為了偉大的格黑娜……呃，是什麼來著？"
212060-33 = "……"
212060-34 = "嗯嗯，反正不是說要征服奇普托斯嗎？#n說是要跟其他學園打仗！"
212060-35 = "那我們也要幫忙啊！#n雖然不太懂，但說不定比挖溫泉還重要！"
212060-36 = "惠……！"
212060-38 = "那我就當作你們答應，先回去了。"
212060-39 = "另外為了確認作業進度，每天下午都會派人過來。"
212060-40 = "嗯！我們很擅長建設，放心吧！耶嘿嘿～"
212060-41 = ""
212060-43 = ""
212060-45 = "……"
212060-46 = "咦？佳澄部長，你的臉色不太好耶。"
212060-47 = "我，我是不是做錯什麼了？嗯？"
212060-48 = "……不，沒有。"
212060-49 = "既然惠班長想做，那就只能做了！哈哈！對吧？"
212060-50 = "哇啊～！是平常的佳澄部長！謝謝你這麼說！"
212060-51 = "……嗯。"
212060-52 = "那我們回去準備材料……"
212060-53 = "惠。"
212060-54 = "嗯？怎麼了？"
212060-55 = ""
212060-57 = ""
212060-58 = "比起挖溫泉……你更想做這個嗎？"
212060-59 = "……"
212060-60 = "嗯！！現在是這樣！！"
212060-61 = "因為～我們要是把這個做出來，打仗也會更順利吧！"
212060-62 = "也能征服奇普托斯了吧？對不對？"
212060-63 = "……嗯，沒錯。"
212060-64 = "既然這是為了格黑娜，那我一定要做！"
212060-65 = "我知道了。好，那就來準備施工吧。"
212060-66 = "好～大家集合！"
212060-67 = ""
212060-69 = ""
212060-70 = ""
212060-71 = "…………"
212060-72 = ""
212060-76 = "[ns] 「佳澄。」"
212060-77 = ""
212060-79 = ""
212060-80 = "啊，老師。"
212060-81 = "哎呀哎呀，貴客來了我都沒發現呢。哈哈。"
212060-82 = "……等等。老師，你的黑眼圈好重！#n臉色也差了好多。"
212060-83 = "啊啊～是啊。最近格黑娜的樣子真是糟透了。"
212060-84 = "想必各方面都很忙吧……"
212060-85 = ""
212060-87 = ""
212060-88 = "……你說我看起來也心事重重？"
212060-89 = ""
212060-91 = ""
212060-92 = "哈哈，果然瞞不過老師的眼睛。"
212060-93 = "嗯……雖然也不是什麼大事啦……"
212060-94 = "老師看起來也很累，之後再聊吧！哈哈。那麼……"
212060-95 = "[s1] 「那可不行。」\n[s2] 「聽到佳澄的煩惱之前，我是不會走的。」"
212060-96 = ""
212060-97 = ""
212060-99 = ""
212060-100 = "……"
212060-101 = "真是的。現在明明是老師比較需要被擔心吧……"
212060-102 = ""
212060-104 = ""
212060-105 = "好吧，那就來說說我那無聊的煩惱吧。"
212060-109 = "（從佳澄那裡聽說了他目前的處境）"
212060-110 = ""
212060-112 = "[ns] 「唔嗯……」"
212060-113 = "……只要是惠想要的，我什麼都願意為他做。"
212060-114 = "是啊。就跟之前那個討人厭的……啊，失禮了。#n總之就跟那個叫什麼香子醬的說的一樣。"
212060-115 = "但是現在惠說的那些話……"
212060-116 = "我實在無法確定，那真的是惠想要的。"
212060-117 = "因為我認識的惠，不可能會說那種話。"
212060-118 = "但我又突然想到……"
212060-119 = ""
212060-121 = "我可以擅自判斷惠嗎？"
212060-122 = "我可以隨意揣測惠的心思，照我自己的想法去認定嗎？"
212060-123 = ""
212060-125 = "老師你應該也知道，惠是個對自己的心意極為坦率的人。"
212060-126 = "他的言行一致到近乎單純的地步。"
212060-127 = "所以惠現在說的，應該就是他最想做的事吧。"
212060-128 = "[s] 「但是佳澄卻從中感到不對勁啊。」"
212060-129 = "正是如此。"
212060-130 = "因為那不是平常的惠……我認識的惠不會說那種話。"
212060-131 = "……"
212060-132 = "所以啊～我現在可是相當混亂呢！哈哈。"
212060-133 = ""
212060-135 = ""
212060-136 = ""
212060-137 = "我該怎麼做才好呢，老師？"
212060-138 = "還是像以前一樣，照惠所希望的去做最好吧？#n是這樣吧？"
212060-139 = "[s3] 「我想那應該不是惠真正希望的事。」\n[s4] 「因為某個契機，惠的想法改變了。」"
212060-140 = ""
212060-141 = ""
212060-143 = ""
212060-144 = "……"
212060-145 = "惠改變了……？"
212060-146 = "不只是惠，幾乎所有3年級學生都……？"
212060-147 = "……你不是在開玩笑吧，老師？"
212060-150 = ""
212060-151 = "我就覺得有點不對勁。"
212060-152 = "不管是那個萬魔殿議長和風紀委員長聯手，說出荒唐的戰爭言論的時候……"
212060-153 = "還是有幾個傢伙像是早就在等這一刻似的，迅速推進戰爭準備的時候。"
212060-154 = "老師，你該不會知道造成這個狀況的原因吧？"
212060-155 = ""
212060-160 = "（向佳澄說明了格黑娜目前的狀況）"
212060-161 = "……原來如此。"
212060-162 = "現在這種現象本身，是那個雷帝的遺產所造成的……這樣就說得通了。"
212060-163 = "透過觸發詞對大規模個體進行認知改寫啊……真是駭人聽聞。"
212060-164 = ""
212060-166 = ""
212060-167 = "……老師，我不想看到那樣的惠。"
212060-168 = "而且再這樣下去……"
212060-169 = "整個學園恐怕會變成我最討厭的樣子。"
212060-170 = "不是依照自己的意志，而是被他人的意志擺布。#n那是我最討厭的事。"
212060-171 = "什麼都不想就服從命令，然後說自己只是服從命令罷了。"
212060-172 = "……我曾經也是那樣的人。#n而且還以為那是理所當然的事。"
212060-173 = "畢竟我一直把別人植入我腦中的聲音，誤以為是自己的聲音活著。"
212060-174 = "[s] 「佳澄……」"
212060-175 = "哈哈，以前也說過了，這件事說來話長。"
212060-176 = "如果真的很想聽的話……等事情解決之後，或許可以吧……"
212060-177 = "[s] 「等你想說的時候再告訴我吧。」"
212060-178 = "……是啊。就這麼辦吧。"
212060-179 = "這下我確定了。"
212060-180 = "我怎麼能接受重要的朋友，變成自己如此憎恨的空殼呢？"
212060-181 = "為了格黑娜？為了征服？哈哈！才不是。#n惠不是會想要那種東西的孩子。"
212060-182 = "惠想要的是挖開地面時噴湧而出的熱水的溫暖，而不是那種微不足道的暴力。"
212060-183 = ""
212060-185 = ""
212060-186 = "……我不會讓過去的亡靈玷污我珍貴的日常。"
212060-187 = ""
212060-189 = ""
212060-190 = ""
212060-191 = "老師，如果有我能幫忙的事儘管說。"
212060-193 = "（和佳澄討論了今後的方針）"
212060-195 = "下一話;搞不太懂"
