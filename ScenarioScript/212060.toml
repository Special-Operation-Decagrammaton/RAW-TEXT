[translation]
212060-1 = "ตอนที่ 6;ชมรมพัฒนาออนเซ็น"
212060-3 = ""
212060-4 = "นี่คือคำสั่งของท่านประธาน..."
212060-5 = "ฮ่าฮ่า เหลือเชื่อจริงๆ..."
212060-6 = "ว่าไงนะ?"
212060-7 = "นี่ พวกเราเชื่อฟังคำสั่งของแพนเดโมเนียม โซไซตี้ตั้งแต่เมื่อไรเหรอ? ต่อให้มาขอร้อง พวกเราก็ไม่คิดจะฟังอยู่แล้วแท้ๆ"
212060-8 = "แถมเนื้อหาก็ยังประหลาดชะมัด ให้สร้างคลังยุทโธปกรณ์ระดับ M ถึง 8 แห่งภายในหนึ่งสัปดาห์เนี่ยนะ?"
212060-9 = "พวกเราเป็นคนขุดออนเซ็น ไม่ใช่ชมรมก่อสร้างทางวิศวกรรมโยธานะ? หืม? คิดว่ายังไงล่ะ?"
212060-10 = "เรื่องนั้นไม่สำคัญหรอก มีคำสั่งลงมาแล้ว และพวกเธอต้องปฏิบัติตาม"
212060-11 = "เฮ้อ..."
212060-12 = "สงครามศักดิ์สิทธิ์กับคิโวทอสใกล้เข้ามาทุกทีแล้ว ยังคิดจะปฏิเสธคำสั่งของแพนเดโมเนียม โซไซตี้#nอีกเหรอ?"
212060-13 = "ถ้าทำแบบนั้น ชมรมพัฒนาออนเซ็นของพวกเธอก็จะกลายเป็นคนทรยศของเกเฮนน่า#nคงไม่ต้องให้ฉันพูดเองหรอกนะว่าจุดจบของคนทรยศจะเป็นยังไง"
212060-14 = "แหม คอยเป็นห่วงเป็นใยกันถึงขนาดนี้มาตั้งแต่เมื่อไรกัน..."
212060-15 = ""
212060-17 = ""
212060-19 = ""
212060-20 = "โอ้! งานเหรอ? หมายความว่ามีอะไรให้ทำแล้วใช่มั้ย?"
