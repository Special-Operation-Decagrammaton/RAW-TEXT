212060-47 = "ฉัน... ฉันทำอะไรผิดไปเหรอ? หืม?"
212060-48 = "เปล่า... ไม่ใช่หรอก"
212060-49 = "ถ้าหัวหน้าเมกุอยากทำ ก็ต้องทำสิ! ฮ่าฮ่า! ใช่มั้ย?"
212060-50 = "ว้าว~! หัวหน้าคาสุมิคนเดิมกลับมาแล้ว! ขอบคุณที่พูดแบบนั้นนะ!"
