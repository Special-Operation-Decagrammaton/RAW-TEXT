[translation]
212060-1 = "제6화;온천개발부"
212060-4 = "……라는 의장님의 명령이다."
212060-5 = "……하하. 어이가 없네."
212060-6 = "뭐?"
212060-7 = "이봐, 우리가 언제부터 만마전의 명령을 들었지? 부탁이라고 해도 듣지 않았을 텐데 말이야."
212060-8 = "그리고 내용조차 이상하지. 일주일 안에 M급 군수 창고 8개를 지으라고?"
212060-9 = "우리는 온천을 파는 사람들이지, 토목건설부가 아닌데? 응? 어떻게 생각하시나?"
212060-10 = "그런 건 상관없어. 명령이 내려왔고, 너희는 그걸 수행해야 한다."
212060-11 = "하……."
212060-12 = "키보토스를 상대로 한 성전이 코앞인 상황에서, 만마전의 지시를 거부할 셈인가?"
212060-13 = "그렇게 되면 너희 온천개발부는 게헨나의 배반자가 된다.#n배반자의 말로는 굳이 내 입으로 말하지 않아도 알겠지."
212060-14 = "언제부터 그렇게 잘 살펴주셨다고……"
212060-20 = "오옷! 일감이야? 할 일이 생긴 거지?"
212060-25 = "메구……!"
212060-26 = "그렇다. 위대한 게헨나에 반드시 필요한 일이지."
212060-28 = "응! 그럼 해야지! 와아~! 드디어 우리도 할 일이 생겼네!"
212060-29 = "메구, 이건 그렇게 즉흥적으로……"
212060-30 = "아니야, 카스미 부장! 반드시 필요한 일이래잖아!"
212060-31 = "그러니까, 그게……."
212060-32 = "카스미 부장은 똑똑하니까 나보다 잘 알 거야! 우리는 위대한 게헨나를 위해…… 어, 뭐였지?"
212060-33 = "……."
212060-34 = "응응, 아무튼 키보토스를 정복한다고 했잖아? 다른 학원들이랑 전쟁을 한대니까!"
212060-35 = "우리도 도와야지! 잘 모르지만 아마도 온천을 파는 것보다 중요할지도 몰라!"
212060-36 = "……메구……!"
212060-38 = "그럼 승낙한 것으로 알고 돌아가도록 하지."
212060-39 = "그리고 작업 진척 확인을 위해 매일 오후에 인원을 파견하겠다."
212060-40 = "응! 우리 건설 잘하니까 걱정 마! 헤헷~"
212060-45 = "……."
212060-46 = "어라? 카스미 부장, 표정이 안 좋아."
212060-47 = "……내, 내가 뭐 잘못한 걸까? 으응?"
212060-48 = "……아니, 아니야."
212060-49 = "메구 반장이 하고 싶다면 해야지! 하핫! 그렇지?"
212060-50 = "와아~! 평소의 카스미 부장이야! 그렇게 말해줘서 고마워!"
212060-51 = "……그래."
212060-52 = "그럼 돌아가서 자재를 준비해야……"
212060-53 = "메구."
212060-54 = "으응? 왜?"
212060-58 = "온천을 파는 것보다…… 이걸 만들고 싶은 거야?"
212060-59 = "……."
212060-60 = "응!! 지금은!!"
212060-61 = "왜냐면~ 우리가 이걸 만들어야 전쟁도 잘할 수 있을 거고!"
212060-62 = "키보토스도 정복할 수 있을 거잖아? 맞지?"
212060-63 = "……응. 맞아."
212060-64 = "그럼 이건 다른 무엇도 아닌 게헨나를 위한 일이니까, 나는 꼭 하고 싶어!"
212060-65 = "알겠어. 자, 그럼 공사를 준비하자."
212060-66 = "좋아~ 다들 모여봐!"
212060-71 = "…………."
212060-76 = "[ns] \"카스미.\""
212060-80 = "아, 선생님."
212060-81 = "이거 이거, 귀한 분이 온 줄도 모르고 있었구만. 하하."
212060-82 = "……잠깐. 선생님, 눈 밑이 퀭한데? 얼굴이 많이 안 좋아졌어."
212060-83 = "아아~ 그래. 요즘 게헨나 돌아가는 꼴이 말이 아니지."
212060-84 = "이래저래 많이 바쁘겠구만……."
212060-88 = "……나도 생각이 많아 보인다고?"
212060-92 = "하핫, 역시 선생님의 눈은 속일 수 없다니까."
212060-93 = "뭐…… 별건 아니긴 한데……."
212060-94 = "선생님도 피곤해 보이고, 나중에 이야기하자구! 하핫. 그럼……."
212060-95 = "[s1] \"그럴 수는 없지.\"\n[s2] \"카스미의 고민을 듣기 전에는 안 움직일래.\""
212060-100 = "……."
212060-101 = "나 참. 지금 선생님이 걱정을 받아야 할 상황 같은데……."
212060-105 = "뭐, 그럼 시시껄렁한 내 고민을 좀 털어놓아 보실까?"
212060-109 = "(카스미로부터 현재 처한 상황에 대한 이야기를 들었다.)"
212060-112 = "[ns] \"으음…….\""
212060-113 = "……나는 메구가 원하는 것이라면 뭐든지 해줄 생각이야."
212060-114 = "그래. 저번에 그 재수 없는…… 아, 실례. 아무튼 그 쇼킹 쨩이 말한 대로지."
212060-115 = "하지만 지금 메구가 말하는 것들은……"
212060-116 = "나로서는 그게 정말 메구가 원하는 것인지 확신이 들지 않아."
212060-117 = "내가 아는 메구라면 그런 말을 할 리가 없거든."
212060-118 = "……하지만 갑자기 또 이런 생각이 들었지."
212060-121 = "내가 함부로 메구를 판단해도 될까?"
212060-122 = "메구의 마음을 마음대로 넘겨짚고, 내 마음대로 생각해도 될까?"
212060-125 = "선생님도 알겠지만, 메구는 자신의 마음에 지극히 솔직한 사람이야."
212060-126 = "순수할 만큼 말과 행동이 일치한다고."
212060-127 = "그러니, 메구는 지금 자신이 가장 하고 싶은 일을 말한 거겠지."
212060-128 = "[s] \"하지만 카스미는 거기서 위화감을 느낀 거구나.\""
212060-129 = "그 말이 맞아."
212060-130 = "평소의 메구가 아니라서, 내가 아는 메구라면 그런 말을 하지 않을 거라서."
212060-131 = "……."
212060-132 = "그래서~ 지금 꽤 많이 혼란스럽단 말씀! 하하핫."
212060-137 = "내가 어떻게 해야 할까, 선생?"
212060-138 = "그냥 지금까지 했던 것처럼 메구가 바라는 대로 하는 게 제일이겠지? 그렇겠지?"
212060-139 = "[s3] \"그건 메구가 정말로 바라는 일이 아닐 거라고 생각해.\"\n[s4] \"어떤 계기로 인해, 메구의 생각이 변한 거야.\""
212060-144 = "……."
212060-145 = "메구가 변했다고……?"
212060-146 = "메구뿐만 아니라, 거의 모든 3학년 학생들이……?"
212060-147 = "……농담하는 건 아니지, 선생님?"
212060-151 = "뭔가 이상하다 싶긴 했어."
212060-152 = "저 만마전 의장과 선도부장이 손을 잡고, 말도 안 되는 전쟁 이야기를 했을 때에도."
212060-153 = "몇몇 녀석들이 마치 이 순간만을 기다려왔다는 것처럼 척척 전쟁 준비를 해나갈 때도."
212060-154 = "선생님, 혹시 이 상황의 원인을 알고 있는 거야?"
212060-160 = "(카스미에게 현재 게헨나의 상황을 말했다.)"
212060-161 = "……과연."
212060-162 = "지금의 현상 자체가 그 뇌제의 유산에 의해…… 그런 거라면 설명이 돼."
212060-163 = "트리거에 의한 대단위 개체의 인식 개변이라. 새삼 어마어마하군."
212060-167 = "……선생님, 나는 저런 모습의 메구를 보고 싶지 않아."
212060-168 = "그리고 이대로 가다간……"
212060-169 = "이 학원 전체가 내가 가장 싫어하는 모양이 되어버릴 것 같아서."
212060-170 = "자신의 의지가 아닌 다른 사람의 의지대로 휘둘리는 거. 내가 가장 싫어하는 일이거든."
212060-171 = "아무 생각 없이 명령에 따르고, 나는 그저 명령에 따랐을 뿐이라고 말하고."
212060-172 = "……한때는 나도 그런 사람이었지. 그게 당연한 줄 알았거든."
212060-173 = "누군가 내 머릿속에 심어놓은 목소리를 내 목소리라고 착각하면서 살았으니까."
212060-174 = "[s] \"카스미…….\""
212060-175 = "하핫, 예전에도 말했지만 이 얘기는 꽤 길어."
212060-176 = "정 듣고 싶다면…… 상황이 해결되었을 때는 가능하려나……."
212060-177 = "[s] \"말하고 싶을 때 말해줘.\""
212060-178 = "……그래. 그렇게 하도록 할게."
212060-179 = "아무튼, 이제 확실히 알았어."
212060-180 = "내 소중한 친구가, 내가 그토록 증오하던 껍데기가 되려는 걸 받아들일 수는 없잖아?"
212060-181 = "게헨나를 위해? 정복을 위해? 하하! 아니야. 메구는 저런 걸 바랄 아이가 아니지."
212060-182 = "메구가 원하는 건 땅을 팠을 때 솟구치는 뜨거운 물의 온기지, 그런 하찮은 폭력이 아니라고."
212060-186 = "……과거의 망령이 내 소중한 일상을 더럽히게 두지는 않겠어."
212060-191 = "선생님, 내가 도울 일이 있다면 뭐든 말해줘."
212060-193 = "(카스미와 앞으로의 방침에 대해 이야기를 나눴다.)"
212060-195 = "다음화;잘 모르겠어"
