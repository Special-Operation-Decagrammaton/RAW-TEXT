[translation]
212060-1 = "Episode 6;Hot Springs Department"
212060-3 = ""
212060-4 = "...are the chairman's orders. Understood?"
212060-5 = "...Haha. Ridiculous."
212060-6 = "What?"
212060-7 = "Since when have we listened to the Pandemonium Society? We never have, even if you all tried asking nicely for once."
212060-8 = "And then there's these funny little details. You want us to build EIGHT level-M military supply depots in a week?"
212060-9 = "We dig hot springs. We're not the, uh...Menial Civil Construction Club, or whatever. Hm? You get me?"
212060-10 = "That doesn't matter. You were given an order, so you must carry it out."
212060-11 = "Haah..."
212060-12 = "Do you intend on refusing the Pandemonium Society's decree while our crusade against Kivotos is imminent?"
212060-13 = "Such an action is verboten. You will be branded as traitors to Gehenna, and I think you already know what happens to traitors."
212060-14 = "Your kindness brings tears to my eyes."
212060-15 = ""
212060-17 = ""
212060-19 = ""
212060-20 = "Oh! Is it more work? Did we get a request?"
212060-21 = ""
212060-24 = ""
212060-25 = "Megu...!"
212060-26 = "Correct. This is an über essential job for the glorious Gehenna."
212060-28 = "Okay! Then we have to do it! Yay! Finally!"
212060-29 = "Megu, you shouldn't just—"
212060-30 = "Didn't you hear, President Kasumi?! She said it's an \"über essential\" job!"
212060-31 = "Well, um..."
212060-32 = "President Kasumi, you would know this better than me, since you're so brilliant! To restore glory to Gehenna, we must... Um, what was it again?"
212060-33 = "..."
212060-34 = "Yeah, you get it! The point is, we're conquering Kivotos, right? We're going to war against other academies!"
212060-35 = "So we should pitch in too, and everyone'll do their part! It might even be more important than digging hot springs!"
212060-36 = "...Megu...!"
212060-38 = "Then I will file that as \"enthusiastic acceptance\" and be on my way."
212060-39 = "Naturally, we will dispatch personnel every afternoon to audit your progress."
212060-40 = "Sure! We're good at construction, so don't even worry about it! Heehee."
212060-41 = ""
212060-43 = ""
212060-45 = "..."
212060-46 = "Huh? President Kasumi, you don't look really happy."
212060-47 = "...D-Did I do something wrong? Mmm?"
212060-48 = "...No, you're fine. Of course."
212060-49 = "And, hey! If Captain Megu wants to do it, then that's what we gotta do! Haha! Isn't that right?"
212060-50 = "Yay! There's that enthusiastic Kasumi I know! Thanks a lot!"
212060-51 = "...Yeah."
212060-52 = "Then we better head back and prep the materials..."
212060-53 = "Megu."
212060-54 = "Hm? What is it?"
212060-55 = ""
212060-57 = ""
212060-58 = "Would you seriously prefer building this...over digging hot springs?"
212060-59 = "..."
212060-60 = "Yeah!!! For now!!!"
212060-61 = "Because...we need all this to help with the war!"
212060-62 = "...And conquer Kivotos! Right?"
212060-63 = "...Yeah. That's right."
212060-64 = "That means this work is all for the glory of Gehenna, so I really want to do it!"
212060-65 = "I hear you. In that case, let's start prepping the site."
212060-66 = "Okay! Everyone, gather around!"
212060-67 = ""
212060-69 = ""
212060-70 = ""
212060-71 = "..."
212060-72 = ""
212060-76 = "[ns] \"Kasumi.\""
212060-77 = ""
212060-79 = ""
212060-80 = "Oh, Sensei."
212060-81 = "Look at me, I was so wrapped up that I didn't even notice a VERY important guest had arrived. Haha."
212060-82 = "...Wait. Sensei, should I call a bellhop to help with those bags under your eyes? Seriously, you look...bad."
212060-83 = "Ah... Well, why wouldn't you be losing sleep? Gehenna is a total mess these days. And NOT the good kind."
212060-84 = "I bet you really have your hands full..."
212060-85 = ""
212060-87 = ""
212060-88 = "...Oh, I seem to have a lot on my \"plate\" as well?"
212060-89 = ""
212060-91 = ""
212060-92 = "There never was any point in trying to hide things from you, Sensei..."
212060-93 = "Well... It's not that big of a deal..."
212060-94 = "And since you're so BEAT, we can talk about this later! Catch some z's. Haha. If you'd excuse—"
212060-95 = "[s1] \"That's not happening.\"\n[s2] \"I'm not moving until you share, Kasumi.\""
212060-96 = ""
212060-97 = ""
212060-99 = ""
212060-100 = "..."
212060-101 = "Honestly. YOU'RE the one people should be worried about..."
212060-102 = ""
212060-104 = ""
212060-105 = "But fine. If you INSIST, maybe I'll bore you with my trivial worries."
212060-109 = "Kasumi told me more about her current situation."
212060-110 = ""
212060-112 = "[ns] \"Well...\""
212060-113 = "...I'll do anything Megu asks, after all."
212060-114 = "It's like that despicable—ah, excuse me—as that brilliant little Miss Shocking said."
212060-115 = "But what Megu's saying right now..."
212060-116 = "It's her face and her voice, but I can look right in her eyes and still be unsure if this is what she wants."
212060-117 = "The Megu I know...MY Megu...wouldn't say these things."
212060-118 = "...But I also kept thinking."
212060-119 = ""
212060-121 = "\"Is it right for me to judge Megu so hastily?\""
212060-122 = "\"Is it right for me to assume what Megu believes and interpret that as I please?\""
212060-123 = ""
212060-125 = "You already know this, but Megu is extremely honest with her feelings."
212060-126 = "As such, her actions match her words."
212060-127 = "That means what she says, and what she intends to do, are truly what she wants."
212060-128 = "[s] \"But you said she felt off, Kasumi.\""
212060-129 = "Yeah."
212060-130 = "She wasn't her usual self. The Megu I knew wouldn't... I THINK she wouldn't..."
212060-131 = "..."
212060-132 = "And that's why I'm a little lost right now! Hahaha!"
212060-133 = ""
212060-135 = ""
212060-136 = ""
212060-137 = "So, what should I do, Sensei? I'm not known for my good judgment."
212060-138 = "It's best to do what Megu wants, just like I've been doing, right? Yeah?"
212060-139 = "[s3] \"I don't think this is what Megu really wants.\"\n[s4] \"For some reason, Megu's thoughts have changed.\""
212060-140 = ""
212060-141 = ""
212060-143 = ""
212060-144 = "..."
212060-145 = "Megu's changed...?"
212060-146 = "And \"not just Megu, but almost every third-year\" too...?"
212060-147 = "...Sensei. Is this a joke?"
212060-150 = ""
212060-151 = "UGH! I knew something was off!"
212060-152 = "First, there were Makoto and Hina squeezing hands and whispering sweet nothings about conquest..."
212060-153 = "And now the other students falling in line, going with it like they'd been wanting war for years."
212060-154 = "Sensei, do you know what caused this?"
212060-155 = ""
212060-160 = "I told Kasumi what I'd learned."
212060-161 = "...I see."
212060-162 = "All because of the Tyrant Emperor's reheated leftovers... Yeah, that explains a lot."
212060-163 = "Using a trigger to alter students' perceptions en masse. Quite incredible."
212060-164 = ""
212060-166 = ""
212060-167 = "...Sensei. I don't want to see Megu suffer like this."
212060-168 = "And, at this rate..."
212060-169 = "This academy is going to turn into something I despise."
212060-170 = "You know what I hate the most? Being coerced by someone else's will and not my own autonomy."
212060-171 = "Following commands without a second thought while cowardly whining, \"I was just following orders.\""
212060-172 = "...Believe it or not, I was once someone like that. I thought that was only natural."
212060-173 = "I lived mistaking the voice someone planted in me as my own."
212060-174 = "[s] \"Kasumi...\""
212060-175 = "Haha... You know, it's a long, dreary story."
212060-176 = "If you really want to hear it... Maybe I'll tell you after we save the day."
212060-177 = "[s] \"You can tell me when you want to.\""
212060-178 = "...Yeah. I'll keep that in mind."
212060-179 = "The important thing is that now I know."
212060-180 = "I can't just sit here and let my precious friend stay as some empty shell, right?"
212060-181 = "\"For Gehenna? For conquest?\" Haha! No way. Megu wouldn't want those stupid things."
212060-182 = "The real Megu only wants to feel the surge of hot water bursting from a dig site. She doesn't care about trivial violence."
212060-183 = ""
212060-185 = ""
212060-186 = "...I won't let the shadows of the past darken this precious life I've made for myself."
212060-187 = ""
212060-189 = ""
212060-190 = ""
212060-191 = "Sensei, let me know how I can help."
212060-193 = "I discussed the next course of action with Kasumi."
212060-195 = "Next Episode;I'm Not Sure"
