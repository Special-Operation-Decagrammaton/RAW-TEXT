212060-180 = "ฉันคงยอมรับไม่ได้หรอกเนอะ? ถ้าหากว่าเพื่อนคนสำคัญของฉันจะสูญเสียตัวตนไปเป็นสิ่งที่ฉัน#nเกลียดแสนเกลียด"
