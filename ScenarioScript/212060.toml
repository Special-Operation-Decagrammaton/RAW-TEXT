212060-24 = ""
212060-25 = "เมกุ...!"
212060-26 = "ใช่ เป็นงานที่จำเป็นอย่างยิ่งต่อเกเฮนน่าที่ยิ่งใหญ่"
212060-28 = "อื้ม! ถ้างั้นก็ต้องทำสิ! ว้าว~! ในที่สุดพวกเราก็มีงานทำแล้ว!"
212060-29 = "เมกุ เรื่องนี้จะตัดสินใจกันโดยพละการแบบนั้นไม่ได้..."
212060-30 = "ไม่หรอก หัวหน้าคาสุมิ! ทางนั้นบอกว่าเป็นงานที่จำเป็นไม่ใช่เหรอ!"
212060-31 = "คือว่า เรื่องนั้น..."
212060-32 = "หัวหน้าคาสุมิฉลาด ต้องรู้ดีกว่าฉันอยู่แล้ว! เพื่อเกเฮนน่าที่ยิ่งใหญ่... เอ่อ อะไรนะ?"
212060-33 = "..."
212060-34 = "อื้มๆ เอาเป็นว่า ทางนั้นบอกว่าจะพิชิตคิโวทอสไม่ใช่เหรอ? เห็นว่าจะทำสงครามกับโรงเรียนอื่นด้วย!"
212060-35 = "พวกเราก็ต้องช่วยสิ! ถึงฉันจะไม่ค่อยเข้าใจ แต่บางทีมันอาจสำคัญกว่าการขุดออนเซ็นก็ได้นะ!"
212060-36 = "เมกุ...!"
212060-38 = "งั้นถือว่าเป็นอันตกลงแล้ว ฉันขอกลับก่อนก็แล้วกัน"
212060-39 = "แล้วฉันจะคอยส่งคนมาตรวจสอบความคืบหน้าของงานตอนบ่ายของทุกวัน"
212060-40 = "อื้ม! พวกเราเก่งเรื่องก่อสร้างอยู่แล้ว ไม่ต้องห่วง! ฮิฮิ~"
