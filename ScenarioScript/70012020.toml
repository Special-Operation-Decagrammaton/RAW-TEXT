70012020-52 = "Ahem. Live from the studio..."
70012020-53 = "...and hosting today's special episode of \"ON AIR: Gehenna\" is me, Yozakura Kirara!"
70012020-54 = "And me, Hatami Erika!"
70012020-55 = "It's our first time, so apologies in advance for any mistakes. But let's get to it!"
70012020-57 = ""
70012020-58 = "Hm? Today's broadcast is a bit different."
70012020-59 = "The host is different, right?"
70012020-60 = "Wait, is that KIRARA?"
70012020-62 = "Time for the first segment! Club promotion time!"
70012020-63 = "We've got a lot of messages from people hoping to spread the word about their clubs."
70012020-64 = "Ooh, let's start with this one! It's so fancy-looking that it really jumps out."
70012020-65 = "They sure had a lot to say... That's dedication, if I've ever seen it."
70012020-66 = "Well, let's read what kind of club it is."
70012020-67 = "\"This letter first started in Trinity and gave luck to the recipient. If you do not send this letter to seven people within the next week, misfortune will follow your every move...\""
70012020-68 = "Eh?"
70012020-69 = "Wooow. That's an old, classic prank! I didn't know people still sent chain mail like this."
70012020-70 = "But it's definitely not talking about a club! So let's mooove on to the next one."
70012020-72 = ""
70012020-73 = "Hold up!! But we just heard the message too! Does that mean we have to send it to seven people, or we'll be unlucky?"
70012020-74 = "I don't think I even know seven people... How many people are in the Pandemonium Society again...?"
70012020-76 = "Okie dokie, we're opening the next message. Hopefully this one is actually about a club!"
70012020-77 = "Take it away, Erika!"
70012020-78 = "Ahem..."
70012020-79 = "\"The School Gate Border Philosophy Club needs YOU. Sit right at the border of campus and let the ambiguity fuel your philosophical perspectives! Indulge in the vague indecision of whether or not you're going to go to class!\""
70012020-80 = "Ah, ah! I've seen these people! They actually like to squat on TOP of the school gate!"
70012020-81 = "That...was an actual club activity? Not people pretending to be gargoyles?"
70012020-82 = "Whatever they are, if you want to join, they meet at the western gate every Tuesday and Thursday. Please show your support for the School Gate Border Philosophy Club!"
