70012020-43 = "We got it, Iroha!"
70012020-44 = "*phew*... I'm actually pretty nervous."
70012020-45 = "Don't worry, don't worry. Look, there's even descriptions for each segment, so it's not like we're going in totally blind."
70012020-46 = "You're right. Then, you ready?"
