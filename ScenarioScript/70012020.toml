[translation]
70012020-1 = "ON AIR: 게헨나 2"
70012020-2 = "키시싯, 이로하! 역시 제법이구나!!"
70012020-3 = "그새 꼭 맞는 인선을 구해오다니 말이야!"
70012020-4 = "제가 구했다기보다 알아서 찾아온 거지만요……."
70012020-5 = "저 둘, 하타미 에리카와 요자쿠라 키라라라면 이 방송을 만마전의 격에 어울리는 명품 방송으로 탈바꿈시키는 것도 가능할 터!!"
70012020-6 = "학생들 이름은 또 기가 막히게 기억한다니까……."
70012020-7 = "아무튼, 둘에게 맡기기로 한 겁니다. 뒤에 가서 딴 말 하시면 안 돼요."
70012020-8 = "사람을 쓰려면 믿어야 하고, 믿었으면 후회하지 않는다."
70012020-9 = "그것이 바로 만마전의 톱이 가져야 할 담대한 마음가짐! 안심하고 진행하도록 해라, 이로하!"
70012020-10 = "네네, 알겠습니다~ 그럼……."
70012020-12 = "음…… 아무튼 두 분이 진행한다고 해주셔서, 특별 방송 소식을 올려두긴 했는데요."
70012020-13 = "꽤 반응이 있더라고요."
70012020-14 = "앗, 정말? 다행이다! 헤헷."
70012020-15 = "두 분은 이래저래 교내에서 유명하시니…… 저로서는 다행이지만요."
70012020-16 = "우와, 좀 부담되는데. 혹시 가이드 같은 것도 있을까?"
70012020-17 = "교내 방송 들으신 적 있죠? 그냥 비슷하게만 해주셔도 돼요."
70012020-18 = "음…… 잘 기억 안 나는데…… 뭐였지?"
70012020-19 = "이부키 쨩이 나왔던 것만 기억나. 노래하지 않았었나?"
70012020-20 = "엑. 노래도 해야 하는 거야?"
70012020-21 = "아뇨, 굳이 그럴 필요는 없고요. 그냥 평범한 방송이에요. 라디오 진행 같은……"
70012020-22 = "맞다, 사연 읽어주는 코너가 있는데요. 이번에 뭐가 많이 왔다고 듣긴 했지만 굳이 안 읽어도 돼요. 그냥 넘겨도 괜찮으니까요."
70012020-23 = "그럴 수는 없지~! 자기 사연을 읽어달라고, 굳이 시간과 노력을 들여서 보낸 거잖아?"
70012020-24 = "언제 내 이야기가 나올까, 하고 기대할 텐데. 실망하게 만들면 안 되지."
70012020-25 = "음, 네. 그럼 마음 가는 대로 진행해 주세요."
70012020-26 = "오, 정말 그래도 돼? 완전 우리 마음대로?"
70012020-27 = "맡기기로 했으니까요."
70012020-28 = "그렇다고 두 분이 이상한 일을 할 것 같지도 않고……"
70012020-29 = "우와, 만마전 임원에게 받는 신뢰라니, 부담될지도."
70012020-30 = "그렇게 거창한 건 아니고요…… 그래도 두 분은 사고 치는 쪽은 아닌 것 같아서."
70012020-31 = "뭐, 사고 치셔도 상관없긴 하지만요."
70012020-32 = "아하하! 이로하 쨩이 믿고 맡겨줬으니까 최선을 다해볼게."
70012020-33 = "그래주시면 감사하지만, 급하게 투입된 거니까 너무 부담가지실 필요도 없고요."
70012020-38 = "이제 곧 시작 시간이네요."
70012020-39 = "그럼 잘 부탁드립니다."
70012020-43 = "걱정 마, 이로하 쨩!"
70012020-44 = "후…… 갑자기 긴장되네."
70012020-45 = "괜찮아, 괜찮아. 여기 각 코너의 설명도 있으니까. 대충 어떤 건지는 알겠네."
70012020-46 = "응. 가볼까?"
70012020-52 = "흠흠, 방송실에서 전해드립니다~!"
70012020-53 = "오늘 <ON AIR: 게헨나>의 깜짝 진행을 맡은 요자쿠라 키라라!"
70012020-54 = "하타미 에리카입니다~!"
70012020-55 = "다소 진행이 어설퍼도 부디 양해를 부탁드리며, 그럼 시작하겠습니다!"
70012020-58 = "음? 오늘 방송은 뭔가 다른데?"
70012020-59 = "진행자 바뀐 건가? 헤에~"
70012020-60 = "혹시 내가 아는 키라라 쨩……?"
70012020-62 = "그럼 첫 번째 코너! 동아리 홍보 타임~!"
70012020-63 = "오늘도 자신의 동아리를 알리고자 하는 분들이 많네요."
70012020-64 = "먼저 이 메시지를 열어볼까요? 알록달록해서 가장 눈에 띄는데요!"
70012020-65 = "엄청나게 빼곡한 글씨……! 정성이 가득한데요?"
70012020-66 = "과연 어떤 동아리일지, 읽어보겠습니다!"
70012020-67 = "<이 편지는 트리니티에서 최초로 시작되어 받는 사람에게 행운을 주었습니다. 이 편지를 일주일 안에 7명에게 보내지 않으면 그 반대되는 불행이 당신에게로……>"
70012020-68 = "엥?"
70012020-69 = "우와~ 클래식…… 요즘도 이런 게 돌아다닐 줄은 몰랐는데."
70012020-70 = "아무래도 동아리 홍보는 아닌 것 같네요! 여기까지만 읽어보고 다음 쪽지로 넘어갈까요?"
70012020-73 = "어이어이! 우리도 들어버렸다고! 7명한테 안 보내면 불행이 찾아온다니 너무하잖아!"
70012020-74 = "주변에 보낼 사람이 7명…… 큭, 모자란데? 만마전 임원이 몇 명이더라……"
70012020-76 = "다음 메시지! 열어보겠습니다~ 이번에는 동아리 홍보에 맞는 내용이길 바랄게요!"
70012020-77 = "그럼 읽어주세요, 에리카 씨!"
70012020-78 = "흠흠, 자……"
70012020-79 = "<교문 경계 철학부는 지금도 당신을 기다립니다. 안과 밖의 경계에 앉아 그 모호함을 즐겨보세요! 등교와 땡땡이 사이, 그 미묘한 맛을 당신도 느낄 수 있습니다!>"
70012020-80 = "아, 이거 맨날 교문 담장에 올라가서 쭈그리고 앉아 있는 사람들이구나!"
70012020-81 = "가고일 놀이인 줄 알았는데 동아리 활동이었어?"
70012020-82 = "아무튼 신청 의사가 있으신 분은 매주 화요일 목요일에 서문으로 찾아오면 된다고 하니, <교문 경계 철학부>에 많은 관심 부탁드리겠습니다~!"
70012020-89 = "(기대했던 것보다 매끄럽게 잘 진행되고 있네요. 역시 이 두 사람에게 맡긴 게 정답이었어요.)"
70012020-93 = "오늘 방송은 그럭저럭 들을 만한데?"
70012020-94 = "그러게. 맨날 만마전 찬가만 줄기차게 틀어대지 않았나?"
70012020-95 = "계속 이렇게 해준다면 점심시간이 나름 기대될지도……."
70012020-99 = "(반응도 괜찮은 것 같고요.)"
70012020-100 = "(아, 이렇게 되면 마코토 선배는 싫어하려나.)"
70012020-102 = "자~ 그럼 다음 코너로 넘어가 보겠습니다."
70012020-103 = "모두들 기다리셨죠? 반짝반짝, 시청자 사연을 읽어라! 시간이 돌아왔네요!"
70012020-104 = "그런 제목은 딱히 아니었던 것 같은데…… 뭐 상관없겠지?"
70012020-105 = "오늘은 사연 보내주신 분들이 상당히 많은데요. 시간 관계상 모두 읽어드리지 못할 수도 있다는 점, 부디 양해 부탁드리며-"
70012020-106 = "첫 번째 사연 읽어보겠습니다."
70012020-110 = "<2학년에 재학 중인 학생입니다. 저는 점심시간에 여유 있게 혼자 먹는 걸 좋아하는데요. 친구들이 자꾸 같이 먹자고 해서 조금 힘들 때도 있어요.>"
70012020-111 = "<하지만 거절하면 무리에서 멀어질 것 같고, 친구들을 싫어하는 것도 아니에요. 어떻게 하면 좋을까요?>"
70012020-112 = "아! 이런 타입 은근히 많지."
70012020-113 = "이거 확실히 고민되는 문제네. 내 선호를 우선할 것인가, 교우 관계를 우선할 것인가."
70012020-114 = "여기에 대해서는 저, 요자쿠라 키라라가 확실하게 말할 수 있어요!"
70012020-115 = "오? 그런가요?"
70012020-116 = "네에-!"
70012020-117 = "용기 내서 친구들에게 솔직하게 말해보세요. 나는 사실 혼자 먹는 것도 좋아한다고."
70012020-118 = "혹시라도 친구들과 멀어질까 고민될 수도 있겠지만, 오히려 솔직한 대화가 관계를 더 건강하게 만드는 경우도 많잖아요?"
70012020-122 = "……오……"
70012020-123 = "마음을 담아서 이야기하면 통할 거예요. 친구니까! 너무 불안해하지 마세요!"
70012020-124 = "하하, 맞네요. 서로의 취향이나 성격을 존중해주는 관계. 그게 친구겠죠?"
70012020-128 = "그럼, 다음 사연 읽어볼까요, 키라라 쨩?"
70012020-129 = "네에~ 그다음에도 익명의 메시지네요! 1학년에 재학 중인 누군가라고 합니다."
70012020-131 = "<어딜 가서 뭘 하든 불행이 따라다니는 게 고민입니다. 항상 넘어지기 일쑤, 당고라든가 과자라든가 떨어뜨리고, 가게에서 뭐라도 한입 먹으려고 하면 폭탄이 터지고, 식권 잃어버리고 자판기가 돈 먹는 건 일상입니다. 저는 뭐가 문제일까요?>"
70012020-133 = "우와~ 듣기만 했는데도 눈물이 핑 도네요."
70012020-134 = "항상 이런 일들을 당하면서도 계속 뭔가에 도전한다는 거네요. 대단한데?"
70012020-135 = "음, 그리고! 불행이 그만큼 자주 온다면 나중에 올 행운이 더 커지는 거 아닐까요? 운의 총량은 정해져 있다고 하니까?"
70012020-136 = "아니면 브이로그나 스트리밍 같은 쪽을 생각해 봐도 괜찮지 않을까 하네요."
70012020-137 = "찍는 와중 불행이 생긴다? 생각하기에 따라서 충분히 방송 소재로 삼을 수도 있지 않을까요?"
70012020-138 = "말하자면 위기를 기회로 바꾼다는 거네요! 일상 속의 소소한 불행이 오히려 시그니처가 된다는 느낌?"
70012020-139 = "네! 뭐, 불행이 생기지 않으면 그것대로 좋은 일이겠죠?"
70012020-140 = "사연자분, 꺾이지 말고 힘내요! 우리도 응원하고 있을 테니까요!"
70012020-141 = "네에~ 그럼, 다음 사연 가겠습……."
70012020-149 = "윽! 귀 아파!"
70012020-150 = "이런, 음향 설비에 문제가 있나 본데."
70012020-155 = "으악! 뭐야? 한참 재밌게 듣고 있었는데……"
70012020-157 = "……!!"
70012020-159 = "어떻게 하지? 방송을 멈춰야 되나?"
70012020-160 = "단순 접지나 케이블 간섭 문제라면……."
70012020-166 = "선을 고르게 풀어주고……."
70012020-172 = "오, 됐다."
70012020-173 = "와, 에리 쨩! 어떻게 한 거야?"
70012020-174 = "보통 방송실 케이블은 싸구려나 오래된 것들이 많아서 차폐가 잘 안 되니까, 뒤엉켜 있으면 저런 현상이 자주 발생하거든."
70012020-175 = "간단히 말하면 엉킨 선을 풀어준 것뿐이야."
70012020-176 = "오오, 역시. 이런 쪽으로 잘 아는구나. 대단해~"
70012020-177 = "뭐 금방 끝나니까."
70012020-181 = "아아- 고르지 못한 송신 상태에 죄송하다는 말씀드리며, 계속해서 방송 이어가도록 하겠습니다."
70012020-182 = "네에-!! 다음 사연, 읽어볼까요?"
70012020-188 = "(방금 노이즈 중간에 뭔가 이상한 음성이 들렸던 것 같은데……)"
70012020-189 = "(뭐, 기분 탓이려나.)"
70012020-191 = "으, 잘 나간다 싶더니 기기 문제가……"
70012020-192 = "마코토 선배, 앞으로 방송 계속할 생각이면 저거 교체할 필요가 있지 않을까요?"
70012020-193 = "……."
70012020-194 = "선배? 듣고 계세요?"
70012020-195 = "음? 아."
70012020-196 = "키시싯, 생각해보니 지금처럼 방송이 인기를 끌더라도 나쁘지 않겠군."
70012020-197 = "이몸의 위엄을 드러내는 찬양가나 선언문을 더더욱 많은 학생들이 들을 게 아니냐?"
70012020-198 = "이로하! 교내 방송을 부흥시킬 아이디어를 적극적으로 제출해보도록 해라!"
70012020-199 = "하아…… 그런 소리 할 줄 알았네요."
70012020-201 = "자, 그럼 이제 슬슬 마무리를……"
70012020-202 = "어?"
70012020-203 = "오, 누가 신청곡을 보내주셨네요!"
70012020-204 = "아, 그거 방송 끝나갈 때 딱 좋은 노래네."
70012020-205 = "……어요!!"
70012020-206 = "응? 뭐라고?"
70012020-207 = "어, 없어요…… 그런 최신 음악은……!"
70012020-208 = "엑? 핸드폰이라거나 연결하면 되지 않아?"
70012020-209 = "그런 시설도 없고…… 내부 장치에 저장된 건 만마전 찬가 정도밖에……."
70012020-210 = "신청곡이랑은 완전 다르잖아!"
70012020-211 = "으아, 어쩔 수 없네. 신청곡은 아쉽게도……."
70012020-215 = "에리 쨩, 에리 쨩!"
70012020-216 = "응?"
70012020-217 = "에리 쨩이 부르면 되잖아? 뒤에 기타도 있겠다."
70012020-218 = "으응? 내, 내가?"
70012020-219 = "응! 에리 쨩, 노래 잘하잖아? 이거 저번에 가라오케에서 부르지 않았어?"
70012020-220 = "아니, 잘하는 건 아니야. 그냥 할 수 있다 정도지……."
70012020-221 = "게다가 가라오케에서 노래하는 거랑 교내 방송에서 하는 건 완전 다르잖아?!"
70012020-222 = "헤헷, 뭐 어때. 부를 사람이 있고, 들을 사람이 있으면 비슷한 거지."
70012020-223 = "그리고 우리 방송을 듣고 신청곡을 보내준 방청자가 얼마나 섭섭해하겠어?"
70012020-224 = "그 사람도 굳이 내 노래를 듣고 싶은 건 아니었을 테지만……."
70012020-228 = "에휴, 뭐. 그래. 못 할 것도 없지."
70012020-229 = "와아~!! 에리 쨩의 라이브 공연이다~!!"
70012020-230 = "후우……."
70012020-236 = "그럼, 신청곡 갑니다."
70012020-237 = " -"
70012020-245 = " -"
70012020-250 = "(그렇게 반짝반짝부의 교내 방송은 성황리에 종료되었다.)"
70012020-252 = "이야…… 고생하셨습니다. 정말로……."
70012020-253 = "아하핫, 우리도 재미있었어! 방송이라는 거, 생각보다 잘 맞을지도?"
70012020-254 = "응. 불특정 다수와 소통하는 느낌, 꽤 신선하더라. 청취자 반응도 궁금하던데."
70012020-255 = "아, 좋았어요. 엄청."
70012020-256 = "오~ 다행! 이로하 쨩도 한시름 놓았겠네~"
70012020-257 = "그게, 너무 좋아서 문제였을지도……."
70012020-258 = "엥? 그, 그 정도야?"
70012020-259 = "좋아서 문제가 되는 경우도 있어?"
70012020-261 = "아, 청취자 반응이랑은 관계없이 귀찮은 사람이 하나 있어서요. 심술이 잔뜩 난 모양이던데……."
70012020-263 = "뭐, 마음 같아서는 두 분께 앞으로의 방송도 부탁드리고 싶지만……."
70012020-264 = "……."
70012020-265 = "두 분은 또 나름의 동아리 활동도 있고, 곤란하시겠죠."
70012020-266 = "그렇게 말해줘서 우리야말로 고마울지도!"
70012020-267 = "하하, 맞아. 과분한 칭찬이라고 생각해."
70012020-268 = "그리고, 원래 방송을 진행하던 학생이 있었다고 했지?"
70012020-269 = "예, 뭐. 일신상의 이유로 사퇴한다고 했지만요……."
70012020-270 = "뭐, 다시 돌아올지는 모르겠지만……."
70012020-271 = "우리가 방송 자리를 차지해 버리면, 그 학생이 돌아올 장소가 없어지는 거잖아. 그런 류의 상실감이 또 꽤 오래가거든."
70012020-272 = "아무튼, 그래서 말씀은 감사하지만-"
70012020-273 = "우리는 그냥 땜빵! 같은 느낌으로~ 라는 거지! 맞지?"
70012020-274 = "후후, 맞아. 역시 키라라 쨩."
70012020-279 = "네에, 무슨 말씀이신지 알겠어요. 상냥하시네요."
70012020-280 = "아무튼 그 학생이 복귀할지 안 할지는 모르겠지만, 그렇게 전해두겠습니다."
70012020-281 = "아아, 그렇지. 고생해 주신 두 분께 소정의 선물이라도 드리고 싶은데요."
70012020-282 = "원래 선물은 마코토 선배의 친필 사인이지만, 이건 그냥 냅두고 제가 따로……."
70012020-283 = "엣, 선물까지?"
70012020-284 = "에리 쨩, 어때?"
70012020-285 = "음…… 아마 우리 생각은 이번에도 비슷할 것 같은데?"
70012020-286 = "아하하, 맞지? 그럼……."
70012020-290 = "선물은 아껴둬, 이로하 쨩! 우리는 반짝반짝한 경험을 한 것만으로도 충분하니까!"
70012020-291 = "응. 새로운 경험이 재밌기도 했고. 도움이 됐다면 그걸로 족해."
70012020-292 = "……그런 건가요."
70012020-293 = "이로하 쨩의 모모톡 알려주면, 그게 선물일지도?"
70012020-294 = "……."
70012020-295 = "후후, 네. 좋아요. 오히려 제 쪽에서 물어보고 싶었거든요."
70012020-296 = "꺄아~☆ 이로하 쨩, 귀여워-!!"
70012020-297 = "종종 연락해도 될까? 아, 혹시 오늘 저녁에 별다른 일정 없으면……."
70012020-299 = "[log]반짝이는 나날은, 언제까지나.[/log]"
70012020-303 = "ON AIR: 게헨나"
