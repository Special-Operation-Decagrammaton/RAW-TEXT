70012020-100 = "(Ah. Makoto's probably not going to like that.)"
70012020-102 = "And next up we have..."
70012020-103 = "Oooh, I know you've all been waiting for this one. Twinkle, twinkle, listener's story submissions time is back!"
70012020-104 = "I don't think that was the title... Well, it probably doesn't matter."
70012020-105 = "We have a lot of stories to get through today, so please be understanding if we can't read yours."
70012020-106 = "Okay, here's our first story."
70012020-107 = ""
70012020-109 = ""
70012020-110 = "\"I'm a student in second-year. I like leisurely eating by myself alone during lunch time. But sometimes, my friends want to eat with me, which is a bit tough.\""
70012020-111 = "\"But if I refuse, I'm afraid I might drift away from the group, and I do like my friends. What should I do?\""
70012020-112 = "Ah! I actually know lots of people like this!"
70012020-113 = "It's definitely a conundrum... Do you put yourself first? Or prioritize your friendships?"
70012020-114 = "I, Yozakura Kirara, have a really good answer!"
70012020-115 = "Oh? Is that so?"
70012020-116 = "Yes, ma'am!"
70012020-117 = "I know it's hard, but you have to be honest with your friends! Tell them you like them, but you really like your alone time too!"
70012020-118 = "And don't worry about pushing them away! In fact, I think you'll feel even closer to them, since they'll have learned something new about you."
70012020-119 = ""
70012020-121 = ""
70012020-122 = "...Whoa."
70012020-123 = "As long as you speak from the heart, I'm sure they'll understand. You're friends! Don't worry about it too much!"
70012020-124 = "Haha. That's right. Friends understand each other's preferences and personalities. That's what they're for."
70012020-125 = ""
70012020-127 = ""
70012020-128 = "Should we move on to the next letter, Kirara?"
70012020-129 = "Yes. Next one is an anonymous letter as well. Someone in their first year."
70012020-130 = ""
70012020-131 = "\"My problem is that misfortune seems to follow me no matter where I go. I'm constantly tripping, and dropping things like dango or snacks. Bombs will go off at a restaurant right when I'm about to start eating, and losing meal tickets or having vending machines swallow my money is an everyday occurrence. Is there something wrong with me?\""
70012020-133 = "I seriously think I'm going to start crying!"
70012020-134 = "What I'm hearing is that, despite all that you've been through, you don't let it stop you from living your life! That's really admirable."
70012020-135 = "Yup, yup! And they say that your total amount of luck in life is predetermined. So I bet something really good is waiting for you around the corner."
70012020-136 = "Maybe she should try vlogging or livestreaming."
70012020-137 = "It's good content, if you think about it. People would tune in to see what unlucky thing is going to happen that day."
70012020-138 = "Like turning a crisis into an opportunity! Those little unlucky things will make you memorable. It can be your niche!"
70012020-139 = "And, if bad things don't happen, that's good too. It's a win-win!"
70012020-140 = "To the person who shared their story, don't give up and stay strong! We'll be rooting for you!"
70012020-141 = "Now, let's move on to the next stor—"
70012020-143 = ""
70012020-149 = "Ack! My ears!"
70012020-150 = "It looks like we're having some technical difficulties."
70012020-155 = "What the...?! What's going on? I was enjoying the broadcast..."
70012020-157 = "...!!"
70012020-159 = "What do we do? Should we cut the feed?"
70012020-160 = "It might just be a grounding or cable issue..."
70012020-161 = ""
70012020-163 = ""
70012020-166 = "Unwind the line, and..."
70012020-167 = ""
70012020-172 = "There. Fixed it."
70012020-173 = "That's amazing, Eri!"
70012020-174 = "The cables used in the broadcast studio tend to be cheap and lack proper wiring, so they don't react well to getting tangled up."
70012020-175 = "Basically, I just straightened out the lines."
70012020-176 = "You really can do anything, Eri! That's awesome."
70012020-177 = "Well, I think we're coming to the end."
70012020-178 = ""
70012020-180 = ""
70012020-181 = "Ahem. Apologies for the unstable transmission. Let's get back to it!"
70012020-182 = "We have more reader letters to read!"
