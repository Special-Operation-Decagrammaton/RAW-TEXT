[translation]
70012020-1 = "ON AIR: Gehenna 2"
70012020-2 = "Kihehe, I knew you could do it, Iroha!"
70012020-3 = "It took you no time at all to find the perfect replacements!"
70012020-4 = "They actually found me, to be honest..."
70012020-5 = "Hatami Erika and Yozakura Kirara will be the perfect vessels to transform our broadcast into something that truly embodies the dignity and prestige of the Pandemonium Society!"
70012020-6 = "Of course she knows their names..."
70012020-7 = "Well, that's what happened. They're going to take over. Don't change your mind later."
70012020-8 = "To use someone, you must trust them, and once you trust them, you cannot regret it!"
70012020-9 = "That's the bold mindset required of the leader of the Pandemonium Society! Don't worry and proceed, Iroha!"
70012020-10 = "Yes, yes. Sounds good, whatever you say..."
70012020-12 = "After you two agreed to host, we announced that our next broadcast episode will be a special one."
70012020-13 = "People were pretty excited."
70012020-14 = "Seriously? Whoa! That's awesome."
70012020-15 = "I mean, you two are pretty well-known across the school. It made my life easier, at least."
70012020-16 = "Ah, that's a lot of pressure. You have a starter's guide or tutorial for us?"
70012020-17 = "You've listened to the broadcast before, right? You just have to keep it more or less the same."
70012020-18 = "Um... Well, I'm sure I've listened before, but..."
70012020-19 = "There was one with Ibuki! The one where she sang!"
70012020-20 = "Eh? Do WE have to sing?"
70012020-21 = "No, no. That was just an Ibuki thing. Think of it as...a podcast, I guess."
70012020-22 = "Like the listeners' stories segment. Apparently we got a ton of submissions this time, but you can just skip that whole thing if you want."
70012020-23 = "Aw, that would be way too mean! It probs took them a lot of effort to write and submit them."
70012020-24 = "I'd totes be listening every time, hoping that my story gets read next. We can't let them down!"
70012020-25 = "I guess I get it... Point is, you can just do whatever you want."
70012020-26 = "You're seriously going to give us free rein?"
70012020-27 = "We said we'd trust you with it."
70012020-28 = "And you two do seem a lot less likely to muck it up than some other people at this school..."
70012020-29 = "Geez, from the mouth of a Pandemonium Society exec herself. You're making me a little nervous."
70012020-30 = "No pressure from me... I just don't peg you two as the type to cause trouble."
70012020-31 = "I don't really care either way, though."
70012020-32 = "Ahaha! Don't worry! We won't let you down."
70012020-33 = "I'm grateful for all the effort, but we're the ones who pulled you in last minute. So, again, no pressure."
