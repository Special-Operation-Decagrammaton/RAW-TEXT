70012020-250 = "So the Twinkle Twinkle Club's campus broadcast ended successfully."
70012020-252 = "Wow... Good work. Really..."
70012020-253 = "Haha, it was fun for us, too! Broadcasting might actually suit me better than I thought."
70012020-254 = "Yes. It was a new experience, communicating with an unspecified audience. How did people react?"
70012020-255 = "Well. REALLY well. The listeners loved it."
70012020-256 = "Oh, that's good! It must have been a relief for you too!"
70012020-257 = "Kind of... It might've been a little too positive."
