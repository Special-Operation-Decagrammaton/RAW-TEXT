70012020-185 = ""
70012020-186 = ""
70012020-188 = "(I think I just heard a strange sound amidst the noise...)"
70012020-189 = "(I'm sure I'm mistaken.)"
70012020-191 = "Ugh, just when things were going smoothly, of course we have technical issues..."
70012020-192 = "Makoto. If we're going to continue with the broadcast, shouldn't we switch out those cables?"
70012020-193 = "..."
70012020-194 = "Makoto? Are you listening?"
70012020-195 = "Hm? Ah."
70012020-196 = "Kihehe. Upon further reflection, a popular broadcast like this will benefit us greatly."
70012020-197 = "That way, even more students will listen to the songs and statements that praise me!"
70012020-198 = "Iroha! Actively submit ideas to revitalize the school broadcast!"
70012020-199 = "*sigh*... I knew you would say something like that."
70012020-201 = "Now, let's start wrapping things up..."
