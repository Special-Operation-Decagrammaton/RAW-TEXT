[translation]
13070-1 = "제7화;육체의 한계"
13070-6 = "시로코 쨩……"
13070-7 = "아까부터 계속 따라오고 있잖아? 이 아저씨에게 무슨 할 말이라도 있는 거야?"
13070-8 = "응. 할 말이 있는 게 아니라 미행."
13070-9 = "그건 그거대로 곤란하지 않을까…… 여고생이 아저씨를 미행한다니, 어디의 인외마경이야, 그거."
13070-10 = "그런데 여기는 왜 온 거야, 선배? 아무도 살지 않는 버려진 마을이잖아."
13070-11 = "……. 아아."
13070-12 = "여기는…… 그러네."
13070-13 = "여기는…… 유메 선배를 처음 만났던 곳이야……."
13070-14 = "유메 선배를 만난 곳……?"
13070-15 = "아…… 뭐 그런 느낌이랄까……. 나도 모르게 여기로 와버린 것 같네."
13070-19 = "호시노 선배. 나는 여기로 오기 전에 선배에게 무슨 일이 있었는지 몰라."
13070-20 = "……."
13070-21 = "다들 쉬쉬하지만, 더 이상 비밀로 두면 안 된다고 생각해."
13070-22 = "……."
13070-23 = "호시노 선배, 다들 말은 꺼내지 않지만 조금씩 불안해하고 있어. 유메 학생회장의 죽음이 지금 이 상황과 관계있는 거야?"
13070-28 = "앗! 저기 털어도 아무 문제 없는 악당들의 현금 수송 차량이!"
13070-38 = "호시노 선배!?"
13070-47 = "놓치지 않아."
13070-49 = "으, 으아아?! 쫓아오지 마! 시로코 쨩!?"
13070-50 = "이건 말하고 싶지 않다는 제스쳐잖아? 분위기를 읽어줘! 전력으로 달려오지 마!"
13070-51 = "응. 내가 붙잡으면 말해주는 거야."
13070-52 = "그러니까……! 조금만 혼자 있게 해달라고!"
13070-59 = "시로코 선배 늦네……."
13070-60 = "안 되겠어요. 역시 집사님에게 연락을 해봐야 할 것 같아요."
13070-61 = "집사님이라면…… 네프티스 말인가요?"
13070-62 = "네. 거기라면 <사막횡단철도>의 비밀을 알고 있을지도 몰라요……. 지금은 거기 말곤 딱히 방법이 떠오르지 않아요."
13070-63 = "괘, 괜찮나요, 선배? 그때 보니까 선배를 좀 불편하게 여기는 것 같던데……."
13070-64 = "네. 사실 제가 가문과는 연락을 끊었기 때문에…… 아마도 저를 좋게 생각하지는 않을 거예요."
13070-65 = "딱히 저는 상관없지만요. 연락처도 지워버렸는데. 어디……. 뭐였더라."
13070-66 = "……. 무리하지는 마세요, 노노미 선배."
13070-67 = "네에."
13070-75 = "놓쳤어."
13070-76 = "시로코 선배?!"
13070-77 = "네? 호, 호시노 선배를요?"
13070-78 = "응…… 아직 수행이 부족했던 거야. 유감이야."
13070-79 = "시로코 선배가 시무룩해져 버렸어……."
13070-80 = "그, 그치만 진심으로 도망가 버리는 호시노 선배라면 누구라도 무리였을 테니……."
13070-81 = "……. 호시노 선배, 나를 따돌려 놓고는, 걱정하지 말라고 내일 학교에서 보자고 했어."
13070-83 = "내일 학교에서……."
13070-84 = "……호시노 선배에겐 시간이 필요한 걸지도 몰라요."
13070-85 = "……."
13070-89 = "아, 집사님에게서 연락이……."
13070-93 = "……영애님."
13070-94 = "……. 집사님. 저기, 그……."
13070-95 = "연락하실 줄 알았습니다. <사막횡단철도>에 숨겨진 비밀이 궁금하신 거죠?"
13070-96 = "……. 네."
13070-97 = "네프티스는 알고 있나요? 그 비밀이라는 걸……?"
13070-98 = "……물론입니다."
13070-99 = "네프티스는 대체 지금 뭘 꾸미고 있는 거죠……? <사모펀드>의 목적은 뭐고요?"
13070-100 = "그리고 전 학생회장이 체결한 계약서와 관계된 일은……!"
13070-101 = "글쎄요. 이건 어디까지나 비즈니스의 일이라서요. 그걸 굳이 영애님이 신경 쓰실 필요는 없을 것 같습니다만."
13070-102 = "……그건."
13070-103 = "아비도스의 일이잖아요…… 집사님."
13070-107 = "……그러고 보니 이렇게 직접 전화를 주신 건 거의 2년 만이네요. 그동안 별일 없으셨습니까? 영애님?"
13070-108 = "……네."
13070-109 = "카드의 한도는 문제없으신가요? 필요하다면 그 카드를 반납하시고 새 카드로 교체해 드릴 수도 있습니다."
13070-110 = "아, 아뇨. 괜찮아요. 딱히 많이 쓸 일도 없고……."
13070-111 = "……."
13070-112 = "저는 별일 없이 잘 지내고 있어요…… 집사님. 그러니까…… 저……."
13070-114 = "별일 없으셔야죠. 저희에게 그렇게 큰 손해를 끼쳤으면."
13070-115 = "……."
13070-120 = "으음……."
13070-122 = "솔직히 말하자면 뻔뻔하다고 생각합니다. 영애님. 그렇게 저희를 비난해 놓고는 이제 자기가 필요한 일이 있으니 연락하는 겁니까?"
13070-123 = "그건……."
13070-124 = "……한마디로 설명하자면, 네프티스는 현재 위기입니다."
13070-125 = "네?"
13070-126 = "저희는 그 위기를 타파하기 위해 노력하고 있는 겁니다. 이틀 뒤에 개최되는 채권단 총회에 저희 기업의 존립이 달려 있습니다."
13070-127 = "채권단 총회에서…… 대체 무슨 일이……."
13070-128 = "……. 거기 아비도스 학생분들이 다 계십니까?"
13070-134 = "……."
13070-136 = "내일 제가 직접 아비도스로 찾아뵙겠습니다. 오늘은 늦었으니 자세한 이야기는 그때 나누시죠."
13070-137 = "아, 그리고 황금 카드도 가져오세요. 교체를 진행해 드릴 테니."
13070-138 = "네? 그건 괜찮……."
13070-142 = "……."
13070-143 = "우와…… 분위기 장난 아니네. 괜찮아, 노노미 선배?"
13070-144 = "……네. 이런 건 아무것도 아니에요. 그것보다 채권단 총회에 기업의 존립이 걸려있다니…… 이건 또 무슨……."
13070-145 = "점점 더 이야기가 복잡해지네요……."
13070-146 = "제가 정보를 좀 더 찾아볼게요."
13070-147 = "괜찮아? 아야네 쨩? 오늘 하루 종일 엄청 많은 일들이 있었는데……."
13070-148 = "응? 그치만……."
13070-149 = "[s] \"그래. 오늘은 이만 쉬자.\""
13070-150 = "선생님?"
13070-151 = "……네. 선생님 말씀이 맞아요. 아야네 쨩. 오늘 너무 많은 사건들이 있었어요. 저희 모두 지금은 휴식이 필요해요."
13070-152 = "시로코 쨩도, 세리카 쨩도, 그리고 선생님도……."
13070-154 = "난 괜찮은데."
13070-155 = "아니, 시로코 선배 지금 완전 다크서클 장난 아니거든? 돌아가서 좀 씻고 쉬어."
13070-156 = "으, 으응……."
13070-157 = "아하하…… 호시노 선배랑 전력 질주를 했으니……."
13070-158 = "[s1] \"나도 샬레에 돌아가서 정보를 좀 수집해 볼게.\"\n[s2] \"내일 다시 올 테니까, 기다려 줘.\""
13070-161 = "응. 알겠어."
13070-162 = "그럼 오늘은 여기까지. 모두 집으로 돌아가도록 해요."
13070-163 = "자- 각자 해산."
13070-168 = "……."
13070-169 = "뭐해? 가자, 아야네 쨩."
13070-170 = "……조금 이상한 기분이 들어요."
13070-171 = "아야네 쨩?"
13070-172 = "사막횡단철도…… 채권단 총회……. 학생회……."
13070-173 = "우연히 발견되었다는 계약서……. 그리고 유메 학생회장의 실종……. 그리고 그 날짜까지……."
13070-174 = "뭐랄까…… 여기엔 저희가 모르는 무언가가 더 있는 것 같아요……."
13070-175 = "그야…… 누가 봐도 평범한 상황은 아니잖아? 그러니까 내일 다시 모여서 같이 찾아보자는 거고."
13070-176 = "아니. 세리카 쨩. 음모나 비밀 같은 그런 게 아니라…… 좀 더……."
13070-177 = "뭐랄까…… 그 이전 단계의 위화감 같은 게……."
13070-178 = "[s] \"위화감?\""
13070-179 = "정확하게 말은 하기 힘들지만 그런 느낌이 들어요……. 뭐랄까……."
13070-181 = "우리의 가장 취약한 부분을…… [ruby=・]누[/ruby][ruby=・]군[/ruby][ruby=・]가[/ruby]가 공격해 오고 있는 느낌이랄까……."
13070-182 = "뭐? 공격? 누가?"
13070-183 = "[s] \"………………….\""
13070-184 = "그러게…… 생각해 보면 그럴 리가 없는데……."
13070-185 = "아니…… 제가 너무 복잡하게 생각하고 있는 걸지도요."
13070-186 = "조금 더 정보를 모아보면 윤곽이 보일지도 몰라요. 돌아가서 정보를 조금 더 수집해 보겠습니다."
13070-187 = "내일 네프티스의 간부와도 만날 예정이니…… 정보는 많을수록 좋으니까요."
13070-188 = "[s] \"알겠어. 아야네도 너무 무리하지는 마.\""
13070-189 = "네. 그럼……. 가자, 세리카 쨩."
13070-190 = "가, 같이 가, 아야네 쨩."
13070-195 = "[ns] 샬레로 복귀한다."
13070-199 = "공략법 첫 번째. <이미 벌어진 일은 되돌릴 수 없다.>"
13070-200 = "선생이 인과를 뒤틀어 자신의 의도대로 바꾸는 존재라면, 그가 바꿀 수 없는 것을 이용하면 됩니다."
13070-201 = "……네. 그 누구도 이미 벌어진 일을 없던 것으로 만들 수는 없습니다."
13070-207 = "즉, 선생의 공략법은…… 바로 <과거>에 있는 것이죠."
13070-216 = "저는……."
13070-219 = "자아, 선생이여…… 히히히……."
13070-221 = "준비된 공략법은 모두 네 개."
13070-222 = "소인이 이걸로 공략해 보겠습니다. 첫 번째는 이미 진행 중이고, 이제 곧 두 번째도 경험하실 수 있을 겁니다."
13070-223 = "과연 당신이 쓰러질 때까지 공략법 네 개가 다 필요할지, 아니면 두 개로 충분할지 궁금하군요. 히히…… 히히히."
13070-224 = "당신의 공략 난이도가 무엇일지…… 기대하고 있습니다."
13070-228 = "[ns] \"아로나, 프라나.\""
13070-230 = "네, 선생님!"
13070-231 = "확인. 명령 대기 중."
13070-232 = "[ns] \"지금부터 아침까지 철야를 해야 해.\""
13070-234 = "[ns5] \"날이 밝는 대로 바로 아비도스로 돌아갈 거니까,\"\n[ns6] \"내가 혹시라도 잠들면 아침에 꼭 깨워 줘.\""
13070-237 = "네? 철야요? 괘, 괜찮으시겠어요? 선생님?"
13070-238 = "으, 으아아…… 알겠습니다! 하지만 조금이라도 잠은 꼭 주무셔야 해요!"
13070-239 = "확인. 아침에 모닝콜입니다. 잊지 않고 깨워드리겠습니다."
13070-240 = "[ns] \"아…… 그리고.\""
13070-242 = "[ns] \"……게마트리아의 동향은 발견된 게 있어?\""
13070-243 = "게마트리아…… 말씀인가요? 그, 글쎄요. 그때 그 이후로는 특별한 움직임은 딱히……."
13070-244 = "어떤 것 때문에 그러시나요, 선생님?"
13070-245 = "[s] \"……………으음. 아무 것도 아니야.\""
13070-254 = "우리 왔어~"
13070-255 = "좋은 아침입니다."
13070-256 = "응응♧ 아야네 쨩, 세리카 쨩. 좋은 아침이에요."
13070-257 = "……노노미 선배? 잠을 안 주무셨어요?"
13070-258 = "어라…… 티가 많이 나나요? 조금 자긴 잤는데……."
13070-263 = "좋은 아침."
13070-264 = "시로코 선배는 문제없어 보이네."
13070-265 = "응?"
13070-266 = "아니, 아무것도 아니야. 호시노 선배는?"
13070-267 = "아직 연락이 없어. 그치만 온다고 했으니까 올 거야."
13070-268 = "선생님도 아직 연락 없으셨죠?"
13070-269 = "정보 수집에 시간이 걸리는 걸지도……."
13070-270 = "오늘 중으로 온다고 했으니까…… 설마 저녁에 오는 거 아냐?"
13070-271 = "그치만 내일이 채권단 총회가 열리는 날이라서……. 너무 늦으면 준비할 시간이 부족할 텐데……."
13070-275 = "음냐…… 음냐아……."
13070-276 = "……선배. 아로나 선배."
13070-277 = "하아암- 프라나 쨩……? 왜 그래요?"
13070-281 = "앗?! 아, 아침인가요? 선생님을 깨워드려야……?!"
13070-282 = "문제없습니다. 선생님은 주무시지 않았어요."
13070-283 = "아…… 그런가요. 그럼 다행……"
13070-284 = "이 아니라, 또 밤샘 철야를 하신 건가요, 선생님은?"
13070-285 = "질문. 아로나 선배. 지금 샬레 건물의 가스 시스템이 조정 중인가요?"
13070-286 = "네에? 가스 시스템요? 아, 아닐걸요? 그건 저희가 관여하는 게 아니라서……."
13070-287 = "보고. 현재 샬레 건물의 가스 배관 시스템에 이상 동향이 감지되었습니다……."
13070-288 = "네? 이, 이상 동향요……?"
13070-290 = "혼란. 처음 보는 현상입니다…… [ruby=・]아[/ruby][ruby=・]무[/ruby][ruby=・]런[/ruby] [ruby=・]원[/ruby][ruby=・]인[/ruby][ruby=・]도[/ruby] [ruby=・]없[/ruby][ruby=・]이[/ruby] 건물의 가스 배관이 바뀌고 있습니다."
13070-291 = "뭔가…… 마치, 누군가가 강제로 이 세계에 개입해서 억지로 뒤트는 것 같은…… 이질적인 감각이……."
13070-292 = "이질적인…… 어, 자, 잠깐만요?!"
13070-296 = "선생님!"
13070-305 = "……공략법 두 번째."
13070-306 = "아무리 기적을 행하는 자라도, <육체의 한계는 극복할 수 없다.>"
13070-307 = "그렇죠? 그게 약점이 맞죠? 위대하신 샬레의 선생님? 히히, 히히히……."
13070-308 = "히히히, 히히히힛-!"
13070-310 = "이히히히히히힛-!!"
13070-312 = "다음화;아비도스 학생회 1"
