[translation]
2600002-1 = "누군가는 해야만 하는 일"
2600002-2 = "하아……"
2600002-3 = "정말이지, 끝도 없군요. 이렇게나 일들이 쌓여 가는데 누구 하나 손 댈 생각도 안하고……"
2600002-5 = "영차. 으음, 확실히 무겁군요. 이정도 분량이니 당연하다면 당연하겠지만……"
2600002-6 = "……응?"
2600002-7 = "[s1] \"대신 들어줄까?\"\n[s2] \"무거워 보이는데.\""
2600002-8 = "……!?"
2600002-9 = "……!?"
2600002-10 = "서, 선생님!? 선생님께서 어째서 이런 곳에……!"
2600002-11 = "네? 연락 받고 오셨다고요? 아…… 제가 보낸 메시지요?"
2600002-12 = "무, 물론 제가 그렇게 연락 드리긴 했습니다만…… 그, 그렇다고 이렇게 곧바로……"
2600002-13 = "아, 아니! 그 이전에, 우선 괜찮습니다. 서, 서류는 그냥 제가 들면 되니까요."
2600002-14 = "네? 아, 아뇨. 정말로 괜찮은데……"
2600002-15 = "아…… 절반만이라도 달라고요?"
2600002-16 = "으, 으음…… 아무리 그래도 선생님께 이런 일을……"
2600002-17 = "……"
2600002-18 = "아닙니다. 그래도 일부러 말씀해 주신 건데, 거절하는 것도 예의가 아니겠죠."
2600002-19 = "그럼 부탁드리겠습니다. ……그리고 감사합니다."
2600002-20 = "여기……"
2600002-23 = "[s] (치나츠가 들고 있던 서류의 절반을 받는다.)"
2600002-24 = "……네?"
2600002-25 = "보기보다 무거우시다고요? 후훗. 그렇죠. 종이라는 건 생각보다 꽤 무거우니까요."
2600002-26 = "덕분에 저는 훨씬 편해졌습니다. 다시 한번 감사드려요."
2600002-27 = "……네? 어디로 가면 되냐고요? 아. 절 따라오시면 됩니다. 여기 계단으로 쭉 내려가서……"
2600002-28 = "그리 멀지는 않으니까, 따라와 주시면 감사하겠습니다."
2600002-29 = "네? 이렇게 한가득 서류철을 들고 계단까지 내려가려고 했냐고요?"
2600002-30 = "위험하지 않냐고요? 그, 그야 물론 조금 그럴 수도 있긴 하지만……"
2600002-31 = "……후후훗."
2600002-32 = "생각해 보니 그렇게 말씀해주신 분도 선생님이 처음이시군요. 감사합니다."
2600002-33 = "하지만 정말로 괜찮습니다. 익숙해져 있으니까요, 이 정도는."
2600002-34 = "선생님께서도 아시겠지만, 저희 게헨나 학생들은 특히나 자기만의 개성들이 강해서……"
2600002-35 = "이런 수수한 일을 하려는 사람들은 별로 없거든요. 어떻게든 회피하려고 하죠."
2600002-36 = "그래서 달리 하는 사람이 없다 보니, 제가 하게 됐고……"
2600002-37 = "계속 제가 하다 보니 조금은 익숙해졌다…… 그런 사소한 이야기입니다."
2600002-38 = "……네? 저요?"
2600002-39 = "서류 담당……? 아니요. 저는 보건담당이랍니다."
2600002-40 = "네? 보건담당이 왜 이런 일까지 하고 있냐고요? ……하아. 그러게나 말이에요."
2600002-41 = "이런 것도 따로 해주는 담당 인력이 더 많았으면 좋겠는데 말이죠."
2600002-42 = "뭐, 저도 딱히 좋아서 하는 건 아니니까요. 하지만 아까도 말씀드렸듯……"
2600002-43 = "누구라도 하지 않으면 이렇게 끊임없이 쌓여만 가니까요. 결국 누군가 해야만 하는 일."
2600002-44 = "……"
2600002-45 = "수수한 저한테는 꽤 어울리는 일이기도 하고 말이에요. 후후……"
2600002-46 = "[s3] \"수수하지 않아. 상냥하다고 생각해.\"\n[s4] \"안경 미소녀가 수수하다고? 참을 수 없군!!\""
2600002-47 = "……"
2600002-48 = "……"
2600002-49 = "……에?"
2600002-50 = "아, 네, 네? 죄, 죄송합니다. 순간 무슨 말씀인지…… 이해를……"
2600002-51 = "그, 그런 것보다……! 너, 너무 시간을 끌었네요. 죄송합니다. 기껏 와주셨는데……"
2600002-52 = "어, 얼른 가시죠……"
2600002-54 = "(치나츠는 그렇게 말하며 종종걸음으로 먼저 계단을 타고 내려갔다.)"
2600002-55 = "[s] (뒤를 따라간다.)"
2600002-58 = "……도착했습니다. 여기예요, 선생님."
2600002-59 = "도와주셔서 감사합니다. 여기 놔주시면, 나머진 제가 정리할 수 있어요."
2600002-60 = "네? 이왕 하는 거 마지막까지 도와주시겠다고요?"
2600002-61 = "왜, 왜 그렇게까지……"
2600002-62 = "그게…… 음……"
2600002-63 = "오히려 어떻게 해야 할 지 잘 모르겠네요. 누구도 이렇게 해 준 적이 없어서……"
2600002-64 = "……네?"
2600002-65 = "그냥 편하게……? 처음부터 두 명이서 일했던 것처럼 생각하면 된다고요?"
2600002-66 = "필요하다면 계속 도와주시겠다고요?"
2600002-67 = "……"
2600002-68 = "……후후훗."
2600002-69 = "말씀은 정말 감사하지만, 그럴 수는 없지요. 선생님께 폐를 끼치는 것만큼은 사양입니다."
2600002-70 = "하지만…… 네. 그렇네요."
2600002-71 = "덕분에 적어도 오늘은 따분하지 않다고 느끼고 있습니다. 선생님 덕분에요."
2600002-72 = "……그러니 매일까진 아니더라도, 언제든 내키실 때……"
2600002-73 = "바쁘지 않으실 때 정도로 부탁드려볼까요."
2600002-74 = "그럼 앞으로도 가끔 이렇게…… 같이……"
2600002-75 = "……"
2600002-77 = "……자, 잘 부탁드립니다. 선생님."
2600002-79 = "(수줍게 웃은 후, 치나츠는 남은 서류들을 정리하기 시작했다.)"
2600002-80 = "(치나츠와 함께 그날 해야 할 정리들을 모두 마친 후 교실을 빠져나왔다.)"
