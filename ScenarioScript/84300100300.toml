[translation]
84300100300-6 = "안녕-! 귀한 손님-!"
84300100300-11 = "귀한 손님? ……저 말씀이신가요?"
84300100300-12 = "응! 세미나에서 알아보기 쉬우라고 사진도 줬거든, 자! 이거 봐봐!"
84300100300-16 = "이건…… 확실히 제 사진이네요."
84300100300-18 = "아, 아니. 아스나 선배! 다짜고짜 그렇게……!"
84300100300-19 = "트리니티의 높으신 분이라고 했잖아, 조금은 더 예의를 차려서 말해야지!"
84300100300-25 = "실례지만 두 분……. 누구신지 여쭤봐도 괜찮을까요?"
84300100300-26 = "응? 우리? 우리는……."
84300100300-28 = "이번 밀레니엄 엑스포의 <가이드> 역할을 맡게 된, 카린이라고 해, 하……."
84300100300-32 = "……합니다. 잘 부탁드립니다."
84300100300-33 = "으음, 죄송합니다. 뭔가 존댓말은 익숙하지 않아서……."
84300100300-34 = "괜찮아요. 무리하실 필요 없습니다. 오히려 감사를 드려야지요. 두 분께선 저를 케어해 주러 오신 것이니까요."
84300100300-35 = "그리고 경어는 저희 쪽에서도 자유롭게 취사선택하는 부분입니다. 신경 쓰지 마시고, 부디 편하게 말씀해 주세요."
84300100300-36 = "어…… 그렇지만 분명 세미나의 회계가 예의를 차리라고……."
84300100300-37 = "예의와 존댓말이 꼭 엮여 있지는 않으니까요. 게다가 저는 이번 행사가 딱딱하지 않기를 바라고 있어요."
84300100300-38 = "애초에 두 학교가 가까워지기 위한 교류이기도 하니……. 편하게 부탁드립니다. 이건 저희 쪽의 정식 요청이라고 들으셔도 좋아요."
84300100300-39 = "저, 정식 요청? ……그, 그런가? 그렇게 될 수가 있나……?"
84300100300-41 = "응응! 그럼 나도 이제부터 편하게 말할게! 손님!"
84300100300-43 = "……'이제부터'?"
84300100300-44 = "그나저나……. 가이드라, 그렇군요. 저희 학우분들을 인솔하는 것은 제 일이라고 생각했습니다만……"
84300100300-45 = "뭐, '인솔'과 '가이드'는 조금의 차이가 있을 수 있으니까. 어차피 밀레니엄 안을 안내해 줘야 하는 건 우리 일이잖아."
84300100300-46 = "…………."
84300100300-50 = "……? 왜 그래?"
84300100300-51 = "……아니요. 과연, 맞는 말씀이네요. 밀레니엄 내의 안내는 밀레니엄 학우분들께서 하시는 게 맞겠지요."
84300100300-52 = "혹 다른 분들도 더 계신가요?"
84300100300-54 = "응! 다른 쪽에도 우리 말고 더 있어. 세 명이나!"
84300100300-55 = "연결해 줄까?"
84300100300-64 = "안녕하세요-. 같은 가이드의 <무로카사 아카네>라고 합니다. 잘 부탁드려요-."
84300100300-65 = "<아스마 토키>라고 합니다. 필요한 게 있으시면, 언제든 말씀 부탁드립니다."
84300100300-66 = "사실 '언제든'……은 조금 힘들 수도 있지만요."
84300100300-78 = "아, 여러분? 그쪽으로는 가시면 안 된답니다. 잠시만 기다려 주세요."
84300100300-83 = "……여러분?"
84300100300-87 = "죄송합니다. 이쪽에도 인원이 조금 있어서…… 잠시 자릴 비워야 할 것 같네요."
84300100300-88 = "모쪼록 즐거운 관람 되시길 바라겠습니다."
84300100300-92 = "저도 그럼 이만."
84300100300-98 = "……끊어졌다!"
84300100300-99 = "보다시피 현재 각자의 자리에서 트리니티 학생분들을 안내하고 있는 중이야. 참가한 학생들의 수가 꽤 많으니까 말이지."
84300100300-101 = "그렇군요. 알겠습니다."
84300100300-102 = "저 한 사람 때문에 두 분의 시간을 너무 많이 쓴 것 같네요. 바쁘실 텐데, 어서 출발하시죠."
84300100300-104 = "좋아-! 출발할게! 잘 따라오라고-!"
84300100300-109 = "아, 아니 선배……!"
84300100300-114 = "안내할 사람을 놔두고 먼저 가 버리면 이미 안내가 아니잖아……."
84300100300-118 = "……그럼 천천히 따라와 줘."
