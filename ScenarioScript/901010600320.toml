[translation]
901010600320-6 = "สวัสดีค่ะ คุณเจ้าของร้าน!"
901010600320-7 = "เชิญเลยครับ"
901010600320-8 = "อ๊ะ พนักงานส่งของที่ช่วงนี้เห็นแถวนี้บ่อยๆ นี่นา?"
901010600320-9 = "อืม สงสัยจะเข้าใจอะไรผิดนะ ร้านของฉันขายแต่ของสด ไม่ได้ให้บริการจัดส่งสินค้าหรอก"
901010600320-10 = "อะฮะฮ่า ไม่ต้องห่วงนะคะ ตอนนี้ฉันไม่ได้มาทำงานส่งของหรอกค่ะ"
901010600320-11 = "ฉันกำลังมองหาปลาสำหรับทำกับข้าวมื้อเย็นอยู่น่ะค่ะ ที่นี่มีปลาอาจิมั้ยคะ?"
901010600320-12 = "ถ้าเป็นปลาอาจิก็มีเยอะเลย จะเอาไปทำอะไรกินล่ะ?"
901010600320-13 = "คิดว่าจะเอาไปย่างหรือไม่ก็ทอดค่ะ... "
901010600320-14 = "ปลาอาจิทอดก็อร่อยนะ แต่ช่วงนี้ปลาอาจิไขมันกำลังดี กินเป็นซาชิมิก็อร่อยเหมือนกัน"
901010600320-15 = "ถ้าจะกินเป็นซาชิมิ ฉันแล่ให้ตรงนี้เลยก็ได้นะ เอามั้ยล่ะ?"
901010600320-16 = "อืม... เลือกยากจังเลยนะคะ ซาชิมิปลาอาจิก็น่าอร่อย แต่ฉันก็อยากลองปลาอาจิทอดเหมือนกัน..."
901010600320-17 = "ถ้าอย่างนั้น ช่วยแบ่งครึ่งให้หน่อยได้มั้ยคะ?"
901010600320-18 = "ได้อยู่แล้ว!"
901010600320-19 = "ครึ่งหนึ่งแล่เป็นซาชิมิ ส่วนอีกครึ่งหนึ่งจะเก็บไปทอดใช่มั้ย? ฉันจะรีบไปเตรียมมาให้เลย"
901010600320-20 = "ขอบคุณค่ะ!"
901010600320-21 = "ทุกคนในท่าเรือนี้ที่ฉันเจอ ใจดีกันทั้งนั้นเลยนะคะ"
901010600320-22 = "อ๊ะ อ้อ ยกเว้นคนที่ยืนตรวจตราอยู่ตรงประตูหน้า พวกเขาไม่ค่อยอ่อนโยนเท่าไร..."
901010600320-23 = "พวกที่คอยตรวจที่ประตูทางเข้าท่าเรือ... หมายถึงการ์ปัชโช่ แฟมิลี่ใช่มั้ย?"
901010600320-24 = "อืม ฉันก็ไม่อยากพูดถึงพวกนั้นเท่าไรหรอกนะ..."
901010600320-25 = "แม่หนู ถ้าเป็นไปได้อย่าไปข้องเกี่ยวกับการ์ปัชโช่ แฟมิลี่เลย พวกนั้นมีแต่ข่าวลือไม่ดีติดตัวตลอดละ"
901010600320-27 = "ข่าวลือที่ว่า... พวกเขาปล่อยเงินกู้ดอกเบี้ยแพงๆ น่ะเหรอคะ?"
901010600320-28 = "ไม่ นั่นไม่ใช่ข่าวลือ แต่เป็นเรื่องจริงที่รู้กันทั่วไปต่างหาก ปัญหาอยู่ที่อีกเรื่อง..."
901010600320-29 = ""
901010600320-31 = ""
901010600320-33 = ""
901010600320-34 = "ปัญหาคือเวลาที่จ่ายหนี้ไม่ได้น่ะ"
901010600320-35 = "ว่ากันว่า ถ้าจ่ายหนี้การ์ปัชโช่ แฟมิลี่ไม่ตรงเวลา จะต้องเจอเรื่องน่าสยดสยอง"
901010600320-36 = "เรื่อง... น่าสยดสยองเหรอคะ?"
901010600320-37 = "อื้อ การ์ปัชโช่ แฟมิลี่เป็นคนดูแลบันทึกการเข้าออกท่าเรือแห่งนี้"
901010600320-38 = "ก็เลยมีข่าวลือว่าการ์ปัชโช่ แฟมิลี่จะแอบพาลูกหนี้มาที่ท่าเรือตอนคนไม่พลุกพล่าน แล้วแอบจัดการอย่างลับๆ น่ะสิ"
901010600320-39 = "ทั้งติดทะเล ทั้งมีลังไม้กับถังเหล็กวางเกลื่อนเต็มไปหมด... ถ้าจะจัดการใครสักคนสองคน ก็ไม่มีที่ไหนเหมาะไปกว่าที่นี่แล้ว"
901010600320-40 = "มันก็มีข่าวลือแปลกๆ ว่าพวกนั้นจะจับลูกหนี้ยัดลงถังเหล็กที่เต็มไปด้วยปูเพื่อใช้เป็นอาหารปูอยู่หรอก... แต่นั่นมันเหลวไหลเกินไป"
901010600320-41 = "เป็นเรื่องที่น่ากลัวจังเลยนะคะ"
901010600320-42 = "แต่แทนที่จะลักพาตัวลูกหนี้ ถ้าไปทวงให้จ่ายหนี้ น่าจะได้เงินมากกว่าไม่ใช่เหรอคะ?"
901010600320-43 = "ต่อจากนี้เป็นเพียงการคาดเดาของฉันนะ แต่การทวงหนี้จากลูกหนี้ก็มีขีดจำกัดเหมือนกัน"
901010600320-44 = "ได้ยินว่าคนที่มีหนี้สินล้นพ้นตัวส่วนใหญ่มักไม่มีกะจิตกะใจจะทำงานหาเงิน แค่จะเอาเงินต้นคืนมาก็ไม่ง่ายแล้ว"
901010600320-45 = "เพราะงั้นถ้าเอาไปขายเป็นทหารรับจ้างให้ PMC อย่างน้อยก็คง..."
901010600320-46 = ""
901010600320-48 = ""
901010600320-49 = "อะแฮ่ม! เอาเถอะ ช่วงนี้บ้านเมืองไม่ค่อยสงบ หนูเองก็ควรระวังตัวไว้นะ "
901010600320-50 = "คนอื่นน่ะฉันไม่รู้หรอก แต่หนูน่ะดูไร้เดียงสาเกินไป... ฉันกลัวว่าจะหลงเชื่อใครง่ายๆ เพราะงั้นก็จำคำเตือนนี้ไว้ให้ดีล่ะ"
901010600320-51 = "ค่ะ ฉันจะระวังตัวค่ะ"
901010600320-52 = ""
901010600320-54 = ""
901010600320-55 = "เอ้า นี่ปลาอาจิสำหรับทำซาชิมิกับสำหรับทอด กินให้อร่อยนะ!"
901010600320-56 = "ขอบคุณค่ะ ขอให้ขายดีนะคะ!"
