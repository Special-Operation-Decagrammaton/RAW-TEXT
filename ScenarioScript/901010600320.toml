[translation]
901010600320-6 = "Hello!"
901010600320-7 = "Hello."
901010600320-8 = "Wait, aren't you that delivery student who's been floating around here lately?"
901010600320-9 = "There may be a bit of a misunderstanding. We only deal with live products here, so we don't do deliveries."
901010600320-10 = "Oh, haha, don't worry about that! I'm not here for a delivery."
901010600320-11 = "I was thinking about dinner, and your fish looks great. Do you have mackerel?"
901010600320-12 = "I've got lots of mackerel. What are you thinking of doing with it?"
901010600320-13 = "Grilling or frying, I think. "
901010600320-14 = "Fried mackerel is always a hit, but they're quite fatty this season. It makes some great sashimi."
901010600320-15 = "If you'd like, I can prepare some fresh sashimi for you right now."
901010600320-16 = "Hm, let me think. Cold mackerel sashimi sounds delicious, but I also want to try frying some up..."
901010600320-17 = "...Can I get half of each? Is that too crazy?"
901010600320-18 = "It's fantastic!"
901010600320-19 = "Slice half for sashimi and the other half for frying, right? Give me one second."
901010600320-20 = "Thank you!"
901010600320-21 = "Fufu. I love it here. Everyone I've met at this port is so nice."
901010600320-22 = "Oh, except the people running inspections at the gate. They were a little cold."
901010600320-23 = "The gatekeepers... You mean the Carpaccio Family?"
901010600320-24 = "I don't want to say more than I should..."
901010600320-25 = "But a good girl like you should stay clear of the Carpaccio Family. They... Well, let's just say I've heard a few nasty stories about them."
901010600320-27 = "By stories... You mean that they lend money at high interest rates?"
901010600320-28 = "No, that's not a story, that's just a plain fact. What you actually want to watch out for is..."
901010600320-29 = ""
901010600320-31 = ""
901010600320-33 = ""
901010600320-34 = "...what happens when you don't pay them back."
901010600320-35 = "Rumor has it that you're in for a VERY unhappy ending if you don't repay the Carpaccio Family on time."
901010600320-36 = "An unhappy...ending?"
901010600320-37 = "That's right. The Carpaccio Family is in charge of this port's entry and exit logs, see?"
901010600320-38 = "So there's a rumor that the Carpaccio Family sneaks in debtors to the port when there's no one around, and they leave no record. Then they dispose of their...\"problem\" quietly."
901010600320-39 = "On the open sea with lots of crates and drum barrels... There's no better place to get rid of a person or two."
901010600320-40 = "Well, there's also a rumor about them feeding people into a drum barrel filled with crabs... But that's just absurd."
901010600320-41 = "That's so scary."
901010600320-42 = "But wouldn't it be more profitable to collect the debt through intimidating the debtors? Instead of...you know?"
901010600320-43 = "I'm just guessing, but maybe threats and intimidation can only get you so far."
901010600320-44 = "Most people with heavy debt lose motivation to work. It'd be hard to even get the principal back."
901010600320-45 = "But if you kidnap them, then sell them over to somewhere like the PMC as a mercenary, then..."
901010600320-46 = ""
901010600320-48 = ""
901010600320-49 = "Ahem! I'm just saying it's a scary world out there. You should also be careful, kid. "
901010600320-50 = "I don't usually offer advice, but you look so naïve... Just remember what I said. Watch your back. You seem so quick to trust people."
901010600320-51 = "Yes, I'll be careful."
901010600320-52 = ""
901010600320-54 = ""
901010600320-55 = "Here's your mackerel. A packet for sashimi and another for frying. Enjoy your dinner!"
901010600320-56 = "Thank you! Have a nice day!"
