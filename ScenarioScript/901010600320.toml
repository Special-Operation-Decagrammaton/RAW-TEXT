[translation]
901010600320-6 = "您好，老闆！"
901010600320-7 = "歡迎光──"
901010600320-8 = "哎呀，這不是最近常在這附近出現的外送員同學嗎？"
901010600320-9 = "唔嗯……不過你可能是誤會了。#n我們店只賣生鮮產品，所以不做外送哦。"
901010600320-10 = "啊哈哈，請放心。#n我這次前來並不是為了外送的工作。"
901010600320-11 = "我在挑選今天晚上要當作配菜的魚，請問有竹筴魚嗎？"
901010600320-12 = "竹筴魚多得是呢。#n你打算怎麼吃？"
901010600320-13 = "我在想要用烤的還是炸的……"
901010600320-14 = "竹筴魚炸來吃雖然也很美味……#n但現在正是竹筴魚油脂肥美的季節，做成生魚片味道也很棒哦。"
901010600320-15 = "如果要做成生魚片，我可以在這裡幫你處理好，怎麼樣？"
901010600320-16 = "唔嗯……真讓人猶豫。#n竹筴魚生魚片好像很好吃，可是我也想嚐嚐炸竹筴魚……"
901010600320-17 = "……請問可以幫我各半處理嗎？"
901010600320-18 = "那當然沒問題！"
901010600320-19 = "一半切成生魚片，一半處理成油炸用的就行了吧？我馬上幫你準備。"
901010600320-20 = "謝謝您！"
901010600320-21 = "呵呵，在這個港口遇到的人都很親切呢。"
901010600320-22 = "啊，不過在正門盤查的那些人有點冷漠就是了……"
901010600320-23 = "你說在正門盤查的那些人……是指卡爾帕喬家族吧？"
901010600320-24 = "唔嗯……雖然我不太想對那些傢伙說三道四……"
901010600320-25 = "可以的話，學生最好別和卡爾帕喬家族扯上關係。#n畢竟那些傢伙的身邊，總是圍繞著不好的傳聞啊。"
901010600320-27 = "您所謂的傳聞……是指高利貸的事嗎？"
901010600320-28 = "不，那已經不是傳聞，而是眾所周知的事實了。#n問題並不出在那裡……"
901010600320-29 = ""
901010600320-31 = ""
901010600320-33 = ""
901010600320-34 = "而是還不出錢之後的事。"
901010600320-35 = "有個傳聞說，要是沒能準時還錢給卡爾帕喬家族，就會落得悽慘的下場。"
901010600320-36 = "悽慘的……下場？"
901010600320-37 = "是啊，你也知道這個港口的進出紀錄是由卡爾帕喬家族管理的吧？"
901010600320-38 = "因此有傳聞說卡爾帕喬家族會趁人煙稀少的時候……#n偷偷把債務人帶進港口處理掉。"
901010600320-39 = "這邊不僅靠海，箱子和鐵桶也堆得到處都是……#n要把一、兩個人處理掉簡直再適合不過了。"
901010600320-40 = "話說回來，還有那種把人塞進裝滿螃蟹的鐵桶裡，拿去當螃蟹飼料的離奇傳聞……#n不過那種傳聞，再怎麼說也太荒唐了。"
901010600320-41 = "聽起來真是個可怕的故事呢。"
901010600320-42 = "但是比起綁架債務人，持續將債務討回不是能獲得更多利益嗎？"
901010600320-43 = "雖然接下來都是我的推測……催討債務人也是有極限的。"
901010600320-44 = "很多人在背了一大筆債之後，早就失去了工作的意願……聽說要拿回本金都不容易。"
901010600320-45 = "所以如果把人當成傭兵賣給PMC之類的地方，多少還能──"
901010600320-46 = ""
901010600320-48 = ""
901010600320-49 = "咳哼！總之最近世道險惡，同學你也小心一點比較好。"
901010600320-50 = "別人就算了，同學你看起來實在太過老實……#n我是怕你隨便就相信別人、跟著人家走才這麼說的，你要好好聽進去啊。"
901010600320-51 = "是，我會小心的。"
901010600320-52 = ""
901010600320-54 = ""
901010600320-55 = "來，這是生魚片和油炸用的竹筴魚。好好享用吧！"
901010600320-56 = "謝謝您，祝您生意興隆！"
