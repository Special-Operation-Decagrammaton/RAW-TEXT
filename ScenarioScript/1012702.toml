[translation]
1012702-1 = "다이나믹 라이팅"
1012702-2 = "샬레 사무실"
1012702-3 = "(다음 날.)"
1012702-7 = "[ns]\"들어오세요.\""
1012702-10 = "안녕하세요……."
1012702-11 = "사쿠라이 미요, 금일 샬레 당번 업무를 위해 출근했습니다."
1012702-12 = "[s1]\"어서 와 미요 쨩.\"\n[s2]\"샬레에 온 걸 환영합니다!\""
1012702-15 = "아, 아니에요. 제가 오히려 감사드려요, 선생님."
1012702-16 = "저에게 귀한 외출의 기회를 주셔서……."
1012702-17 = "후으으…… 이게 얼마 만에 느껴보는, 아무런 거리낌 없는 자유인지……."
1012702-18 = "[s]\"맞아, 와일드헌트는 외출 허가 받는 게 어려웠지.\""
1012702-19 = "예. 특히 저처럼 문학 전공인 학생들은 외출 허가 받기가 좀 더 까다로워요."
1012702-20 = "소설 쓰는 것은 골방에 갇혀서도 가능한 일이니까……."
1012702-21 = "실제로 위대한 고전들 중에선 감옥에서 쓰인 것들도 많고……."
1012702-22 = "……차라리 저희 특수교역부의 밀수 내역을 자진신고 해 버리고 감옥에 들어가 버리는 게 더 나은 일일까요?"
1012702-23 = "[s3] \"그럴 거라면…….\"\n[s4] \"차라리 내가 가둬 줄게!\""
1012702-26 = "그, 그게 무슨……?"
1012702-27 = "서, 서, 선생님……?! 지금 뭐 하시는……!"
1012702-31 = "샬레 휴게실"
1012702-32 = "여기는…… 휴게실?"
1012702-33 = "예? 여기서 마음껏 쉬고 글 써도 된다고요?"
1012702-34 = "냉장고에 있는 음료수도 마음대로 먹어도 된다고요?! 간식도요?!"
1012702-35 = "그, 그런데 저는 오늘 당번으로 이곳에 온 건데…… 일도 안 하고 그러면……."
1012702-36 = "……소설가에게는 집필이 곧 일 아니냐고요?"
1012702-37 = "그…… 틀린 말씀은 아닌데……."
1012702-38 = "[s5] \"그러니까 달콤한 간식이나 먹으면서,\"\n[s6] \"유려한 문장이나 집필하라고!\""
1012702-43 = "……감사합니다, 선생님."
1012702-45 = "(그렇게 미요를 휴게실에 둔 채, 남은 업무를 처리하려 밖으로 나왔다.)"
1012702-47 = "흐으으음……."
1012702-48 = "그러니까…… 이 부분에서 주인공의 불치병이 드러나는 부분의 대사를 어떻게 처리해야 하지……."
1012702-49 = "또 이 때문에 둘을 갈라놓기 위해 시댁에서는 전차 부대를 동원하여 진격전을 펼치게 되고……."
1012702-50 = "그러니까, 해당 파트의 대사를 재현해 보자면……"
1012702-54 = "\"아아! 어찌 하늘은 그대를 낳고 나를 또 낳았던가!\""
1012702-55 = "\"아직 희망을 놓지 마셔요! 아직 저희에겐 200발의 대전차 포탄이 남아 있다고요!\""
1012702-56 = "후후, 그래, 바로 이런 전개야."
1012702-57 = "그리고 다음은……."
1012702-63 = "……선생님? 여기는 왜……?"
1012702-64 = "[s] \"아니…… 선물로 들어왔던 과자가 있어서 나눠주려고…….\""
1012702-65 = "……들었나요?"
1012702-66 = "[s] \"……저는 아무것도 모릅니다.\""
1012702-67 = "들었죠?"
1012702-68 = "[s] \"……조금밖에 못 들었어.\""
1012702-69 = "어디부터 들으셨는데요?"
1012702-70 = "[s] \"……불치병 부분부터?\""
1012702-71 = "그냥 다 들은 거잖아요……!"
1012702-72 = "흐아아아아아아아아아……!"
1012702-77 = "(그렇게 샬레를 뛰쳐나간 미요는, 어디론가 빠르게 사라졌다.)"
