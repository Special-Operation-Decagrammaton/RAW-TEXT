[translation]
205-1 = "카이텐져 본거지 습격!"
205-3 = "자아, 오랜만이야, 선생."
205-4 = "응? 어째서 그런 표정이야? 설마 이 내가 나와서 놀란 거야?"
205-5 = "다른 뭔가 대단한 거라도 나오길 기대했어? 후후후, 안됐지만 여기선 귀여운 모모카 님밖에 등장하지 않거든. (와작)"
205-6 = "자, 그러면 또 일이야, 선생."
205-7 = "키보토스의 지명수배 악당 카이텐져. 그 녀석들의 본거지를 발견했어."
205-8 = "그 녀석들, 무언가 위험한 음모를 꾸미고 있단 말이지."
205-9 = "카이텐져가 지금까지 강탈해 간 현금만 해도 불법 병기를 몇 개나 만들 수 있는 수준에다가,"
205-10 = "무기 설계 도면이나 최신 공학 기술이 적용된 금속 소재…… 이런 것들도 마구잡이로 훔치고 있었거든."
205-11 = "막대한 자본과 기술…… 그걸로 대체 뭘 하려는 걸까?"
205-12 = "아하하. 뭔진 몰라도 이 키보토스에 도움이 되는 일은 아니겠지."
205-13 = "그러니까 편리한…… 아니, 친절한 샬레가 나설 차례라는 거야."
205-14 = "카이텐져의 본거지로 가서 그 녀석들이 꾸미고 있는 음모를 분쇄해주면 좋겠어. 그게 뭔진 모르겠지만. (와작)"
205-19 = "후후후, 그럼 잘 부탁해. 선생."
