[translation]
10008055-2 = "크읏! 뭐야, 선생님까지 그쪽에 붙어서 선도부의 업무를 방해하다니!"
10008055-3 = "설마 문제아들의 편을 들 셈이야?!"
10008055-4 = "[s1] \"이쪽에 붙었다고 할지…….\"\n[s2] \"……여기엔 깊은 사정이 있다고 할지.\""
10008055-8 = "(이오리에게 이제까지 있던 일을 설명했다.)"
10008055-12 = "그러니까 즉. 흥신소나 거기의 아비도스 학생, 그리고 선생님은 원래부터 새전함의 내용물을 노리고 날뛰는 게 아니라."
10008055-13 = "어디까지나 정당하게 되찾기 위해 추격하는 거라고?"
10008055-14 = "……그걸 지금 나보고 믿으라고 하는 소리야?"
10008055-15 = "[s] \"네, 그렇겠죠!\""
10008055-16 = "이래서 선도부는 말로 설득하려고 생각하면 안 돼. 어차피 자기 좋을 대로만 생각하는 녀석들이니까."
10008055-17 = "뭐어? 너 뭘 멋대로……!"
10008055-26 = "이오리? 현장의 상황은 어떻죠? 새전함을 노리고 날뛰는 문제아들은 모두 정리했나요?"
10008055-27 = "앗, 아코 쨩! 그게……. 아직이라고 할까. 중간에 방해를 받는 바람에."
10008055-28 = "네? 방해꾼이라니, 설마 검은거북파가 끼어들기라도 한 건가요?!"
10008055-29 = "(……검은거북파?)"
10008055-30 = "아냐. 우릴 방해한 건 흥신소 녀석들이랑 선생님이야."
10008055-31 = "글쎄. 방해라니 우린 아무것도 안 했잖아! 갑자기 덤벼온 건 그쪽이면서!"
10008055-32 = "……흥신소? 그리고 선생님이라니요?"
10008055-33 = "[s] \"안녕. 아코.\""
10008055-34 = "네? 선생님이 어째서 이곳에……? 아, 새해 복 많이 받으세요."
10008055-35 = "가 아니라, 잠깐만요. 이건 대체……."
10008055-38 = "상황은……. 네, 잘 알았습니다. 흥신소 여러분은 새전함을 되찾기 위해 샬레와 협력……. 같은 편으로 끌어들였다는 건가요."
10008055-39 = "이걸 영악하다고 해야 할지. 약삭빠르다고 해야 할지."
10008055-40 = "여, 영악……?"
10008055-41 = "그러는 그쪽은? 문제아를 쫓는다면서 지나가는 사람에게 시비를 건다니, 새해 첫날부터 느긋한 거 아냐?"
10008055-42 = "어머나. 과연 평범하게 대화하는 척하면서도 말 한마디 지지 않겠다는 그 태도. 카요코 씨답군요."
10008055-43 = "글쎄, 당하는 입장으로선 꽤 짜증이 나서 말이야."
10008055-44 = "흐음……."
10008055-45 = "……."
10008055-49 = "쿠흐흣, 두근두근!"
10008055-50 = "으, 응?"
10008055-51 = "[s] \"저기…….\""
10008055-53 = "하아……."
10008055-54 = "뭐, 좋습니다."
10008055-55 = "이오리. 저는 문제아들을 해결하라고 했지, 이렇게 샬레와 마찰을 빚으라고는 안 했는데요."
10008055-56 = "쓸데없는 일로 시간을 잡아먹다니. 뭔가요."
10008055-57 = "혹시 이오리는 선도부의 일이 너무너무 즐거운 나머지, 새해 첫날부터 집에 돌아가기 싫다거나 그런 건가요?"
10008055-58 = "아코 쨩! 내 잘못이야?! 모처럼의 휴일에 끌려 나온 것도 억울한데!"
10008055-59 = "그러는 아코 쨩이야말로 내게만 맡겨 두고 너무 늦었잖아!"
10008055-60 = "저는 이번 사태의 정보를 수집하느라 늦었을 뿐이에요."
10008055-61 = "카이텐져가 새전함을 훔쳐 간 건 일련의 작은 소동일 뿐."
10008055-62 = "사실 이번 사태에서 중요한 건 그게 아니니까요."
10008055-63 = "[s] \"무슨 의미야?\""
10008055-64 = "결론부터 말씀드리자면 이번 <대길전>의 이벤트 자체가 검은거북파라는 조직이 얽혀 있는 사기극입니다."
10008055-65 = "뭐어?!"
10008055-66 = "[s] \"검은거북파……?\""
10008055-67 = "네. <대길전>은 범죄조직 검은거북파의 자금 세탁용 사업체입니다."
10008055-68 = "?!"
10008055-69 = "그곳에 비치되어 있던 새전함은 검은거북파가 불법 자금의 세탁을 위해 사용해온 것으로……."
10008055-70 = "노림수는 간단해요. 새전함에 세탁하고 싶은 불법 자금을 대량으로 세이브한다. 이렇게 하면 우선적으로 발키리 경찰학교 같은 치안 기관의 시선을 피할 수 있게 되겠죠."
10008055-71 = "새해라는 특수한 환경, 거기다 이벤트 회장의 새전함이라는 특수성까지 더해지면, 조금 의심스러운 정황이 있다고 해도 새전함을 열어보려고 드는 이는 없을 테니까요."
10008055-72 = "물론 너무 큰 규모의 자금이 움직였다가는 덜미를 잡힐 수도 있습니다만. 검은거북파는 그런 만약의 사태를 피하기위해 또 하나의 수단을 준비했죠."
10008055-73 = "[s] \"또 하나의 수단……?\""
10008055-74 = "네, 매스컴이나 SNS를 통한 바이럴 마케팅이 바로 그거예요."
10008055-75 = "'빌면 이루어진다.'……였던가요? 웃기지도 않는 캐치프레이즈입니다만."
10008055-76 = "실제로 효과는 확실했는지. ……덕분에 SNS에서도 제법 유명한 장소로 알려지게 된 거예요."
10008055-77 = "보시다시피 그 광고에 혹해 찾아온 바보들도 잔뜩인 모양이고요."
10008055-79 = "윽……?!"
10008055-80 = "홍보를 통해, 말 그대로 행사장에 새전을 넣으러 오는 사람의 숫자 자체를 늘린다."
10008055-81 = "……그렇게 하면 새전함에는 검은거북파의 불법 자금을 숨겨줄 거액이 모인다는 건가."
10008055-82 = "거기다 홍보로 모인 새전 자체도 동시에 불법 자금으로 흡수할 수 있을 테고."
10008055-83 = "[s] \"나무를 숨긴다면 숲에 숨긴다. 라는 거구나.\""
10008055-84 = "어머나. 과연 카요코 씨. 바로 꿰뚫어 보시는 거군요?"
10008055-85 = "……하아. 마음에도 없는 소리 하지 마."
10008055-86 = "흐응. 뭐, 애당초 <대길전>이라니 행사장으로는 이상한 이름이잖아요? 더군다나 '빌면 이루어진다.' 같은 형편 좋은 이야기가 있을 리도 없고요."
10008055-91 = "자, 잠깐! 그럼 빌면 이루어진다. 라는 것도……. 부정이 타면 소원이 뒤집혀 이루어진다는 것도……. 전부, 거짓말……?"
10008055-92 = "부정……? 뒤집혀……? 그런 얘기는 처음 듣지만요……?"
10008055-93 = "그, 그랬구나. 아하하하! 당연히 사기였다는 거지? 으, 응! 알고 있었다구!"
10008055-94 = "그럼 새전함을 되찾는 사람에게 그걸 전부 주겠다는 것도 사실은……."
10008055-95 = "도난 사건이 되면 필연적으로 여기엔 발키리 등의 기관이 개입하게 될 겁니다. 아마 일차적으로는 그걸 막고 싶은 생각이었겠죠."
10008055-96 = "'경찰의 도움은 필요 없습니다. 이건 새해의 이벤트이니까요.' 같은 식으로 말이죠?"
10008055-98 = "아하하핫! 뭐야!"
10008055-99 = "거기까지 생각해서 벌인 깜짝 이벤트였던 거야?"
10008055-100 = "게다가 아마, 검은거북파가 노리는 건 그것뿐만이 아니라……."
10008055-102 = "뭐야, 나. 사실은 범죄조직의 자금 세탁소에 무녀로 고용되어 있었던 거야?!"
10008055-103 = "근데 왜 하필 돈세탁을 한다는 놈들이 무녀를 고용해?! 무녀에게 실례잖아! 민폐잖아!"
10008055-104 = "검은거북파가 장악하기 전까진 원래는 평범한 행사장이었으니까. 무녀를 고용하는 게 이상한 건 아니었을 테지만……."
10008055-105 = "[s3] \"맞아, 상황이 어찌 되었든 세리카의 무녀복은 진짜라고 생각해!\"\n[s4] \"응! 그래도 무녀 세리카의 마음은 진짜라고 생각해!\""
10008055-106 = "따, 딱히 범죄조직에게 고용된 무녀가 되었다고 해서, 안타깝거나, 슬프다고 생각한 게 아니거든?!"
10008055-107 = "따, 딱히 범죄조직에게 고용된 무녀가 되었다고 해서, 안타깝거나, 슬프다고 생각한 게 아니거든?!"
10008055-108 = "나야 약속한 대로 알바비만 받으면 그만이고."
10008055-109 = "……뭐어, 선생님이 그렇게 말해주는 건 무, 물론 기쁘지만……."
10008055-110 = "[s5] \"근데 그러면 카이텐져는 정말로 정의를 위해……?\"\n[s6] \"……새전함을 훔쳤다는 거야?\""
10008055-111 = "으음. 해석에 따라서는 그렇게 볼 수도 있을까요? 카이텐져가 말하는 정의라는 게 정확히 뭔지는 모르겠지만."
10008055-112 = "으음. 해석에 따라서는 그렇게 볼 수도 있을까요? 카이텐져가 말하는 정의라는 게 정확히 뭔지는 모르겠지만."
10008055-113 = "어쩌면 의적 놀이를 하면서 돈이 없는 사람들에게 새전함의 내용물을 뿌린다던가……."
10008055-114 = "원체 정체를 알 수 없는 게 카이텐져다보니 의중이야 알 수는 없습니다마는."
10008055-115 = "그런 건 아무래도 좋습니다. 어쨌거나 우리 선도부로서 중요한 건 현재 게헨나 학원의 인근에서 일어나고 있는 이 혼란을 수습하는 것."
10008055-116 = "[s] \"그걸 위해 선도부는 움직이고 있는 거였구나.\""
10008055-117 = "네, 상대가 카이텐져건, 검은거북파건, 문제아들이건, 마침 부장님이 자리를 비우신 틈을 타 잘도 게헨나의 풍기를 어지럽혀주고 있단 말이죠."
10008055-118 = "여기서 이렇게 시간을 낭비할 때가 아닙니다. 이오리. 계속해서 문제아들을 쫓도록 하죠. 그리고 선생님."
10008055-119 = "여전히 새해 첫날부터 괜한 소동에 휘말려 계신 듯합니다만……. 사람이 좋은 것도 적당히 하시는 편이 좋으실 거예요."
10008055-120 = "그럼 이만."
10008055-126 = "하아. 아코 쨩은 쉴 틈을 안 준다니까."
10008055-127 = "자, 흥신소 녀석들. 너희도 이야기 잘 들었지?"
10008055-128 = "우리 선도부가 눈을 번뜩이고 있으니까. 더는 소동을 일으키지 말라고! 괜히 다치기 싫으면!"
10008055-132 = "선생님, 우린 가볼게. 올해도 잘 부탁해. ……그럼 모두 이동! 다음 문제아를 찾으러 가자!"
10008055-135 = "네!!"
10008055-140 = "(그렇게 선도부는 나타났을 때와 마찬가지로 바람처럼 퇴장했다.)"
