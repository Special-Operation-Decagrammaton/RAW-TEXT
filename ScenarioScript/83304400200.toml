[translation]
83304400200-6 = "이부키……? 네가 여기엔 왜?"
83304400200-7 = "아! 히나 선배!"
83304400200-8 = "이부키 상처 소독 받으러 왔어!"
83304400200-9 = "상처……?"
83304400200-10 = "만마전에서 벌어진 소동 때문에, 넘어져서 다친 모양이에요."
83304400200-11 = "소동이라니, 무슨 일이 있었길래."
83304400200-12 = "듣기로는 마코토 의장이 최면에 걸렸다느니, 뭐니 해서 사람이 바뀌었다고 하던가요."
83304400200-13 = "……최면?"
83304400200-14 = "응! 사츠키 선배가 말이야~ 마코토 선배한테 최면? 이란 걸 걸었는데~"
83304400200-15 = "그래서 마코토 선배가 또 새로운 마코토 선배가 되었거든~"
83304400200-16 = "……미안, 이야기를 따라가질 못하겠어."
83304400200-17 = "자, 치료는 이것으로 끝이에요. 이부키 쨩."
83304400200-18 = "와아! 고맙습니다~! 치나츠 선배!"
83304400200-19 = "별말씀을요. 다음에는 다치지 않도록 좀 더 조심해 주세요."
83304400200-20 = "어쨌거나 자세한 사항은 저쪽에 있는 이로하 씨에게 물어보는 게 빠를지도 모르겠네요."
83304400200-21 = "으음. 최면, 인가."
