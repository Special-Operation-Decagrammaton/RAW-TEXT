[translation]
10046190-3 = "이치카."
10046190-4 = "츠루기 선배?!"
10046190-5 = "교대할까?"
10046190-6 = "아뇨, 아뇨! 츠루기 선배께서 나설 정도의 일은 아닙니다!"
10046190-7 = "이 정도는 제 선에서 어떻게든……."
10046190-8 = "슬슬 한계잖아."
10046190-9 = "……하하. 뭔가, 츠루기 선배 상대로는 얼버무릴 수가 없네요."
10046190-10 = "분명, 벅차기는 하지만……."
10046190-11 = "…………."
10046190-12 = "……으음~ 평소라면 주저 없이, 네, 라고 말했겠습니다만."
10046190-13 = "명령 불복인가?"
10046190-14 = "천만에요! 그런 것은 아니지만……."
10046190-15 = "이번 바캉스는 제게도 꼭 성공시켜야 하는 이유가 있습니다."
10046190-16 = "최소한 옆에서 돕게라도 해주십쇼!"
10046190-17 = "그런가."
10046190-18 = "하스미가 말하던 예상 못 한 수확이 뭔가 했더니…… 과연, 키킥킥!"
10046190-19 = "킥킥킥킥……!!"
10046190-20 = "……나는 말리지 않아. 알고 있지?"
10046190-21 = "넵! 어디까지나 따라가겠슴다!"
10046190-22 = "……싫지 않아, 그런 고집."
10046190-26 = "좋아, 그러면 갈까."
10046190-27 = "킥킥킥……."
10046190-33 = "키히히히힛!!!"
