[translation]
10043070-1 = "제7화;경기장에 떨어져 있는 것"
10043070-9 = "……8회 말 공격도 득점 없이 종료……. 잔루는 1, 3루……."
10043070-10 = "도대체 어떻게 되어 먹은 게, 이 팀은 무사 1, 3루에서 단타 하나를 못 치냐!"
10043070-11 = "왜 자꾸 공을 땅바닥으로 보내는데!? 야구공 땅에 심으면 그라운드에서 나무가 자라기라도 해??!!"
10043070-18 = "진정해……. 이 팀 야구가 늘 그랬지……. 후우."
10043070-19 = "다행히 9회 초까지 마무리를 아낄 수는 있었어. 레이더스의 타선을 분석하면, 초구는 슬라이더를 선택해서……."
10043070-21 = "어째서냐…… 어째서 우리는 이길 수 없는 거냐!!!"
10043070-22 = "언제나 개막 때의 타순은 모르는 사이에 사라지고! 선발이었던 투수는 불펜을 하고 있고!"
10043070-23 = "언제까지나 각성하지 못하는 유망주! 의미불명의 지시를 반복하는 감독!"
10043070-24 = "3루에는 절대로 해고되지 않는, 3루 코치라는 이름의 망가진 신호기가 있고!"
10043070-25 = "응원가는 쓸데없이 뜨거워서, 어쨌든 팬들을 구장에 오도록 만들지!"
10043070-31 = "음, 저기. 너무 큰 소리를 내면 낌새를 들킬지도 모릅니다."
10043070-32 = "일단 저희는 일일 경호원으로 고용된 입장이기는 합니다만, 가능한 한 충돌할 일은 만들고 싶지 않기도 하고요……."
10043070-33 = "그래도 드링크를 전부 구입해서 나눠 주신 건 감사합니다. 잘 마셨어요."
10043070-35 = "뭐, 뭐어. 경기장에 사전 등록된 드링크 아르바이트생은, 전부 한 번씩 여기로 불렀던 것 같으니까 말이지."
10043070-36 = "후우, 하아, 후우, 하아, 후우……."
10043070-37 = "좋아……. 그래도 일단은 3점 차까지 따라오기는 했어. 이 정도면 아직 역전 가능한 범위야."
10043070-41 = "우선은 9회 초 수비를 넘기고, 9회 말 타순은 8번부터."
10043070-42 = "정말 모든 게 잘 이어진다면, 4번 타자까지 이어질 가능성이 남아 있는 타순이란 말이지. 그러니까……!"
10043070-43 = "우리의 노력이…… 물거품은 아니었다는 뜻이겠지. 그렇고말고."
10043070-44 = "(예전에도 2~3점 차까지는, 접전을 벌인 적이 제법 많았지만.)"
10043070-51 = "무, 무슨 소리지?! 지금 막 작전을 구상하는 중인데, 이렇게 중요한 때에……!"
10043070-55 = "큰일입니다! 지금 막–"
10043070-60 = "정말로 여기에서 뭔가가 일어나고 있긴 했네요!"
10043070-61 = "감독님! 여기입니다!"
10043070-67 = "드디어 찾았구나!"
10043070-72 = "어, 어어어어, 어떡하지? 들켰어!"
10043070-73 = "여, 여기에서 붙잡힐 수는 없어!"
10043070-77 = "거기 서세요!!!"
10043070-84 = "어어? 갑자기 어딜 그렇게 급히 가십니까?"
10043070-85 = "모두 모여! 호위 대상이 위치를 이동했다!"
10043070-92 = "[ns] \"따라잡았다!\""
10043070-98 = "관중 사이에 섞여 들 셈이었다면, 오산이었다고 말씀드릴 수 있겠습니다."
10043070-99 = "이 스타디움의 관중들에 대해서는, 저희는 대체로 파악이 끝났으니까요. 경기 내내 시간을 들여서 말이죠!"
10043070-100 = "왜 이런 일을 벌인 건지 제대로 말해 줘야겠어요!"
10043070-108 = "그래…… 너희들이었군. 우리 코기 브레이브스의 경기를 망치려고 한 것이!"
10043070-109 = "경기를…… 망쳐?"
10043070-114 = "웃기지 마! 경기를 애초부터 쭉 망치고 있었던 건 너희들이었잖아!"
10043070-115 = "모두 꼼짝하지 마! 섣불리 움직이면……!"
10043070-121 = "꺄아아아악?!"
10043070-122 = "이 인질의 쌀알 강정은…… 모두 없을 줄 알아!"
10043070-123 = "아, 안 돼요! 그 쌀알 강정은 올해 나온 햅쌀로 만든 건데……!"
10043070-128 = "그만둬! 팬 여러분께 이상한 짓은 하지 마!"
10043070-132 = "여기에서 4번 타자는 왜 끼어드는 거냐?!"
10043070-134 = "당연한 거잖아……. 팬이 없으면 우리는 그냥 공놀이하는 사람일 뿐이야!"
10043070-135 = "다른 건 몰라도 팬 여러분께 심한 짓을 하는 건, 선수로서 절대 두고 볼 수 없는 일이라고!"
10043070-137 = "제정신이냐?!"
10043070-143 = "호위 대상을 따라잡았다! 증원 요청!"
10043070-144 = "그러면 이제 어떻게 할까요?"
10043070-146 = "으윽……! 일단, 선수들이 다치지 않도록 조심해서 제압해 줘!"
10043070-147 = "감독은 모르겠지만, 선수들은 다치면 안 돼! 명심해!"
10043070-152 = "어려운 요구로군요……."
10043070-154 = "내 취급만 너무 심한 것 아닌가?!"
10043070-160 = "[ns] \"이거 말이야……. 어째 사정을 알 것도 같은데……?\""
10043070-161 = "그렇습니까, 트레이너? 저는 아직 잘……."
10043070-162 = "……."
10043070-164 = "뭐, 모든 일이 끝나면 다 같이 트레이닝에라도 몰두하면 되지 않을까요?"
10043070-165 = "선배는 마지막까지 그 말인가요?!"
