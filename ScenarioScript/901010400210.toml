[translation]
901010400210-6 = "不好意思，打擾了～"
901010400210-7 = "嗯？有什麼事嗎？"
901010400210-8 = "您好。我們是從便當外送到熱門餐廳的預約，全部都能為您代勞的「FOX EATS」！"
901010400210-9 = "這次「FOX EATS」在鐘崎港開始了外送服務，正在免費提供人氣便當作為宣傳。"
901010400210-10 = "要不要稍微休息一下，嚐嚐美味的豆皮壽司呢？"
901010400210-11 = "唔嗯……雖然是挺誘人的，但現在可不是休息的時候啊。"
901010400210-12 = "難道是有什麼需要急著處理的事情嗎？"
901010400210-13 = "那個……你有沒有在這附近看過類似裝著木屑的麻袋？"
901010400210-14 = "裝著木屑的麻袋……是嗎？"
901010400210-15 = "對，就是把處理木材時產生的碎屑收集起來的那種袋子。"
901010400210-16 = "要有那些木屑才能把螃蟹裝箱包裝……#n結果不知道是哪個傢伙把我們準備好的木屑袋全都清走了。"
901010400210-17 = "沒有那些木屑袋，我們根本就沒辦法工作啊……"
901010400210-18 = "如果你在這附近看到「被棄置的木屑袋」，可以告訴我們嗎？"
901010400210-19 = "這可是關係到螃蟹新鮮度的問題，拜託你了！"
901010400210-21 = "我明白了。如果在這附近看到「被棄置的木屑袋」，我一定會告訴您的。"
