[translation]
901010400210-6 = "Excuse me!"
901010400210-7 = "Yeah? What do you want?"
901010400210-8 = "Greetings! From bento delivery to restaurant reservations! FOX EATS is your one-stop service agency anytime YOU get the grumblies."
901010400210-9 = "We've just expanded our delivery service to include Kanesaki Port. To celebrate this, we're offering the local community complimentary bento boxes!"
901010400210-10 = "Would you like to take a short break and enjoy some delicious inarizushi?"
901010400210-11 = "Um... I am interested, but I can't afford to be taking a break right now."
901010400210-12 = "Oh, dear. Is something going on?"
901010400210-13 = "Well... Have you seen a loose sack of sawdust, by any chance?"
901010400210-14 = "A sack of sawdust?"
901010400210-15 = "Yeah. You see, it's bag-shaped. And it's filled with sand-like scraps you get after woodworking."
901010400210-16 = "I need it to stack the crabs in the boxes. We use the sawdust to pack 'em in, nice and secure... But I guess someone walked off with it."
901010400210-17 = "I can't work without it..."
901010400210-18 = "Just let me know if you find an \"abandoned sawdust sack,\" will ya?"
901010400210-19 = "It keeps the crabs fresh. It's really important!"
901010400210-21 = "Got it. If I see an \"abandoned sawdust sack,\" you'll be the first to know!"
