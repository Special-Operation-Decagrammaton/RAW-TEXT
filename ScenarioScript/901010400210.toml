[translation]
901010400210-6 = "ขอรบกวนหน่อยค่ะ~"
901010400210-7 = "หืม? จู่ๆ มีอะไรเหรอ?"
901010400210-8 = "สวัสดีค่ะ ฉันมาจาก <FOX EATS> ผู้ให้บริการครบวงจร ตั้งแต่จัดส่งข้าวกล่องจนถึงจองร้านอาหาร#nยอดนิยมค่ะ!"
901010400210-9 = "<FOX EATS> เพิ่งมาเปิดให้บริการจัดส่งภายในท่าเรือคาเนะซากิ เราเลยมีโปรโมชันแจกข้าวกล่อง#nยอดนิยมอยู่ค่ะ"
901010400210-10 = "พักเหนื่อยสักนิด แล้วลองชิมซูชิเต้าหู้หวานอร่อยๆ สักชิ้นมั้ยคะ?"
901010400210-11 = "อืม... ฟังดูก็น่าสนใจอยู่หรอก แต่ตอนนี้ยังไม่ใช่เวลาพักน่ะสิ"
901010400210-12 = "กำลังยุ่งกับอะไรอยู่เหรอคะ?"
901010400210-13 = "คือว่า... เห็นกระสอบขี้เลื่อยที่อยู่แถวนี้บ้างมั้ย?"
901010400210-14 = "กระสอบขี้เลื่อย... งั้นเหรอคะ?"
901010400210-15 = "อื้อ เป็นกระสอบที่ใส่เศษขี้เลื่อยจากการแปรรูปไม้น่ะ"
901010400210-16 = "พวกฉันต้องใช้ขี้เลื่อยพวกนั้นถึงจะแพ็กปูใส่ลังได้... แต่ไม่รู้ใครดันเก็บกระสอบขี้เลื่อยที่เตรียมไว้ไป#nจนเกลี้ยงเลยน่ะสิ"
901010400210-17 = "แบบนี้งานก็เดินต่อไม่ได้เลย..."
901010400210-18 = "ถ้าเห็น 'กระสอบขี้เลื่อยที่ถูกทิ้งไว้' แถวนี้เมื่อไร ก็ช่วยบอกพวกฉันหน่อยนะ"
901010400210-19 = "เรื่องนี้กระทบต่อความสดของปู ขอร้องละ ฝากด้วยนะ!"
901010400210-21 = "ได้ค่ะ ถ้าเจอ 'กระสอบขี้เลื่อยที่ถูกทิ้งไว้' แถวนี้ ฉันจะรีบมาบอกนะคะ"
