901010400420-7 = ""
901010400420-8 = "啊，老師。歡迎您。"
901010400420-9 = "今天也辛苦您了！"
901010400420-10 = "[s1] 「仁子今天一整天也辛苦了。」\n[s2] 「聽說你今天去了鐘崎港？」"
901010400420-13 = "是的。為了確認昨天向您提到的那個傳聞的真相，我們親自去了一趟港口。"
901010400420-14 = "我蒐集了各種關於傳聞和螃蟹的消息……可以請您幫我一起整理嗎？"
901010400420-15 = "[s3] 「當然可以。」\n[s4] 「好期待能聽到什麼有趣的事！」"
901010400420-16 = ""
901010400420-17 = ""
901010400420-19 = ""
901010400420-21 = "看來大家都歸隊了。"
901010400420-22 = "那麼從現在開始，各自報告今日的作戰成果。"
