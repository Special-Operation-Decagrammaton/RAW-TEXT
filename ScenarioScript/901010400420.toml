901010400420-7 = ""
901010400420-8 = "อ๊ะ คุณครู เชิญค่ะ"
901010400420-9 = "วันนี้ก็ทำได้ดีมากเลยค่ะ!"
901010400420-10 = "[s1] \"นิโกะก็ทำได้ดีเหมือนกันนะ\"\n[s2] \"ได้ยินว่าไปท่าเรือคาเนะซากิมาเหรอ?\""
901010400420-13 = "ค่ะ วันนี้ฉันไปที่ท่าเรือเพื่อสืบความจริงของข่าวลือที่เล่าให้คุณครูฟังเมื่อวานค่ะ"
901010400420-14 = "ฉันได้ยินข่าวลือและเรื่องของปูมาหลายอย่างเลย... คุณครูช่วยสรุปข้อมูลไปด้วยกันได้มั้ยคะ?"
901010400420-15 = "[s3] \"แน่นอนอยู่แล้ว\"\n[s4] \"อยากรู้แล้วสิว่าไปได้ยินเรื่องอะไรมาบ้าง!\""
901010400420-16 = ""
901010400420-17 = ""
901010400420-19 = ""
901010400420-21 = "ดูเหมือนว่าทุกคนจะกลับมากันครบแล้วสินะ"
901010400420-22 = "งั้นก็รายงานผลการปฏิบัติการของวันนี้กันเลย"
