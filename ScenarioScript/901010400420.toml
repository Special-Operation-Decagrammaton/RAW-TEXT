[translation]
901010400420-8 = "아, 선생님. 어서오세요."
901010400420-9 = "오늘도 수고 많으셨습니다!"
901010400420-10 = "[s1] \"니코도 오늘 하루 수고했어.\"\n[s2] \"오늘은 카네사키 항구에 다녀왔다며?\""
901010400420-13 = "네. 어제 말씀드린 소문의 진상을 확인하러 항만에 직접 다녀왔답니다."
901010400420-14 = "소문과 게에 대한 여러가지 이야기를 들었는데…… 정리하는 걸 함께 도와주시겠어요?"
901010400420-15 = "[s3] \"물론이야.\"\n[s4] \"어떤 이야기를 들었을지 기대되는걸!\""
901010400420-21 = "다들 복귀한 것 같군."
901010400420-22 = "그럼 지금부터 금일 작전 내용을 각자 보고하도록."
