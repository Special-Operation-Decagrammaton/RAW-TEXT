[translation]
1003406-1 = "마음을 담아 수놓는 자수"
1003406-2 = "백귀야행 여우 백화점"
1003406-6 = "선생님, 저것 보세요. 청소기 신제품이 나온 모양이에요."
1003406-7 = "와, 30분 충전만으로 5시간이나 쓸 수 있다니……!"
1003406-8 = "거기다 무선이에요!"
1003406-9 = "[s] \"응, 그러게.\""
1003406-11 = "앗, 선생님. 이 원피스, 무척 이쁘지 않나요?"
1003406-12 = "<따로 관리를 해주지 않아도, 세탁기에서 가볍게 빨 수 있는 것이 장점!> 이래요!"
1003406-13 = "후후, 요즘 신소재로 만들어지는 옷은 굉장하네요."
1003406-14 = "[s] \"응, 그러게.\""
1003406-15 = "어머, 저기 카운터 쪽에서는……."
1003406-16 = "개인 1명당 추첨권 10개로 추첨을 돌릴 수 있대요……!"
1003406-17 = "거기다 3등 상품이, 아까 보았던 무선 청소기가 상품으로 나와 있다니!"
1003406-18 = "선생님! 이건, 이건 놓칠 수 없겠어요!"
1003406-19 = "어서 줄을 서야……!"
1003406-20 = "[s1] \"잠깐 미모리, 감탄하는 건 좋은데.\"\n[s2] \"정작 뭘 사러 온 거야?\""
1003406-21 = "아……."
1003406-22 = "아……."
1003406-23 = "죄송해요. 제가 너무 흥분한 탓에……."
1003406-24 = "흠흠. 오늘은 손수건을 사러 왔어요."
1003406-25 = "[s] \"손수건?\""
1003406-26 = "네. 그럼 여기서 이러지 말고, 잡화 코너로 가실래요?"
1003406-27 = "…………으, 추첨권……."
1003406-28 = "[s] \"추첨은 돌아갈 때 하자!\""
1003406-29 = "후훗……, 네."
1003406-31 = "손수건도 무척 종류가 많네요."
1003406-32 = "으음, 가격대도 문제지만, 무턱대고 싼 걸 산다고 정답은 아니고."
1003406-33 = "또 재질도 신경 써야 할 거고……."
1003406-35 = "으으, 고르기가 너무 어려워요."
1003406-36 = "[s] \"그렇게 어려우면, 골라줄까?\""
1003406-37 = "선생님께서 직접요……?"
1003406-38 = "으응, 아니요. 이건 제가 직접 골라야 의미가 있으니까요."
1003406-39 = "[s] \"하긴, 취향도 아닌 물건을 골라줘도 곤란하겠지…….\""
1003406-40 = "아니, 그런 문제가 아니라……!"
1003406-41 = "[s] \"……응?\""
1003406-42 = "아, 아니에요!"
1003406-43 = "그, 그보다 손수건은 무엇으로 할까……."
1003406-48 = "……(반짝)"
1003406-51 = "저기, 종업원 씨, 이걸로 포장해주시겠어요?"
1003406-52 = "용도는……."
1003406-53 = "선물용이에요!"
1003406-55 = "후아……. 제법 시간이 오래 걸렸네요."
1003406-56 = "[s3] \"마음에 드는 물건을 살 수 있어서 다행이야.\"\n[s4] \"추첨권에서 나온 건 티슈뿐이라 좀 아쉽지만.\""
1003406-57 = "후훗, 네……. 오늘 산 건 제 마음에는 꼭 들지만,"
1003406-58 = "하나. 문제가……."
1003406-59 = "후훗, 네……. 오늘 산 건 제 마음에는 꼭 들지만,"
1003406-60 = "하나. 문제가……."
1003406-61 = "[s5] \"맞다, 선물용이라고 했었지.\"\n[s6] \"선물하려는 사람 마음에 들어야겠네.\""
1003406-62 = "네, 말씀대로예요."
1003406-63 = "네, 말씀대로예요."
1003406-64 = "저 뿐만 아니라, 이 손수건이 선생님의 마음에도 드셨으면 해요."
1003406-65 = "[s] \"……응?\""
1003406-66 = "후훗. 오늘 이렇게 선생님을 모시고 선물을 사러 온 이유는,"
1003406-67 = "선생님께 선물을 드리고 싶어서였어요."
1003406-68 = "그동안 제 수행에 계속해서 어울려주신 선생님께,"
1003406-69 = "작지만 보답을 해드리고 싶었거든요."
1003406-70 = "[s] \"굳이 그럴 것까진…….\""
1003406-71 = "아뇨. 제가 그러고 싶었던 거니까요!"
1003406-72 = "혹시, 제가 너무 억지를 부리는 걸까요?"
1003406-73 = "[s7] \"아니야. 기뻐.\"\n[s8] \"선물을 싫어하는 사람은 없으니까.\""
1003406-74 = "후훗, 그런가요~?"
1003406-75 = "후훗, 그런가요~?"
1003406-76 = "[s] \"그럼 어디, 받은 김에 바로 포장을…….\""
1003406-77 = "아! 그, 선생님. 잠시만요!"
1003406-78 = "모처럼 그, 선생님과 함께 열심히 고른 물건이니까."
1003406-79 = "그 자체로도 충분히 괜찮다고 생각하지만. 그게……."
1003406-80 = "한 가지, 부탁드리고 싶은 게 있는, 데요……."
1003406-81 = "[s] \"부탁?\""
1003406-82 = "이건 개인적인 욕심이지만, 그게, 저……."
1003406-83 = "수행부 활동을 하면서 바느질 연습도 열심히 했거든요!"
1003406-84 = "그래서 말인데, 그……."
1003406-85 = "신부수행의 결과를 보여 드리기 위해서……."
1003406-86 = "그 제가 손수건을 조금 만져봐도 괜찮을까요……?"
1003406-87 = "[s] \"만진다고?\""
1003406-88 = "만진다는 게, 다른 의미가 아니라……!"
1003406-89 = "그, 바느질, 연습했으니까요. 자수를 놓아 드릴 수 있겠다…… 싶어서."
1003406-90 = "무, 물론 혹시 괜찮으시다면……의 이야기니까요!"
1003406-91 = "미, 민폐라고 느껴지신다면 죄송스럽지만……!"
1003406-92 = "[s] \"아냐. 미모리가 그렇게 해준다면 좋지.\""
1003406-93 = "그, 그러신가요? 그럼……."
1003406-94 = "잠깐 시간을 내어주실래요, 선생님?"
1003406-97 = "제 곁에 앉아서 지켜봐 주세요."
1003406-100 = "[wa:300]― 후후, [wa:1250]선생님."
1003406-102 = "― 좀 더 [wa:450]가까이 [wa:1050]붙어주셔도 [wa:510]괜찮아요."
1003406-105 = "[wa:1000]― 제가 하는 신부수행……"
1003406-107 = "― 그리고[wa:1250] 요조숙녀가 [wa:800]되고 싶다는 [wa:500]저의 꿈까지. [wa:100]"
1003406-110 = "― 선생님께선 [wa:300]항상 이렇게"
1003406-112 = "[wa:300]― 곁에서 응원해주시고 [wa:1200]도와주셨죠."
1003406-115 = "[ns] \"선생님으로서 당연한 일을 했을 뿐이야.\""
1003406-116 = "[wa:900]― 감사합니다. [wa:800]"
1003406-118 = "― 그래서……. [wa:1100]저, [wa:1100]선생님과 [wa:1450]앞으로도 [wa:950]계속해서……. [wa:50]"
1003406-121 = "― 아, [wa:800]아무것도 아니에요!"
1003406-124 = "[wa:500]― 네, [wa:500]네에! [wa:850]자수, [wa:800]완성했습니다!"
1003406-127 = "― 저 나름대로 [wa:600]노력해 보았는데요,"
1003406-129 = "[wa:100]― 그, [wa:1500]어떠신가요……?"
1003406-132 = "그럼 손수건은 이걸로 완성이에요."
1003406-133 = "제 선물, 부디 앞으로도 소중히 간직해주세요. 후후."
1003406-135 = "(그 후, 미모리와 잠시나마 산책을 하며 잡담을 나눴다.)"
