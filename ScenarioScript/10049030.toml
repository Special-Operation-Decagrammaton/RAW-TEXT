[translation]
10049030-1 = "제3화;마법소녀를 너무 동경해서"
10049030-2 = "[log]3일 전, 도서부 휴게실[/log]"
10049030-4 = "바로 이겁니다!!"
10049030-5 = "이거…… 라뇨?"
10049030-6 = "네?"
10049030-10 = "마법소녀가 되어주세요!"
10049030-11 = "우…… 우헤헤…… 이 대사, 실제로 필요할 때 써볼 줄은 몰랐습니다."
10049030-12 = "<마법소녀 헤비캘리버 보더랜드 스페셜>……? 이게 뭔가요?"
10049030-13 = "마법소녀 헤비캘리버가 보더랜드 놀이공원에서 특별한 행사를 하는겁니다!"
10049030-14 = "그렇긴 해 보이는데요, 구체적으로 이게 어떤 건지……."
10049030-16 = "보더랜드 놀이공원에서 여러 캐스트들이 분장하고 돌아다니며 공연하는 행사군요."
10049030-17 = "'공원이 넓어서 복수의 팀이 있다'라고 하고요."
10049030-18 = "레이사 씨, 이게 이번 일과 어떤 상관이……?"
10049030-19 = "잠복할 때, 마법소녀로 변장해 보는 건 어떨까요!"
10049030-20 = "여러 팀이 있다고 하니까, 한 팀 정도는 더 끼어들어도 티가 안 날 겁니다!"
10049030-21 = "놀이공원 어디에 있어도 어색하지 않을 거예요!"
10049030-23 = "그리고, 이벤트 캐스트면 외부에서 초청된 인원들이라 직원들도 초면인 걸 의심하지 않을 테고요."
10049030-24 = "그렇군요……."
10049030-25 = "어렸을 때, 비슷한 애니메이션을 본 기억이 있습니다. 아마, 아침에 방송했었던 것 같은데…… 그건가요?"
10049030-26 = "아닙니다!! 아, 아니, 아침 TV 애니메이션이긴 한데요!"
10049030-27 = "마법소녀 헤비캘리버는 못된 악의 간부 에라의 침략에 맞서 키보토스를 지키는 선택받은 소녀들의 이야기입니다!"
10049030-28 = "그, 그렇군요……."
10049030-29 = "하지만 이런 캐릭터로 위장한다면, 옷이 전투할 때 불리할 듯합니다."
10049030-30 = "장비를 외부에 착용하기도 다소 어려울 듯하고……."
10049030-31 = "무엇보다, 저는 이런 류의 작품은 잘 모르기도 하니……."
10049030-32 = "저도, 마법소녀물을 한 번도 본 적이 없어서 잘……."
10049030-33 = "그리고…… 조금 부끄럽달까……."
10049030-34 = "앗, 그…… 그런가요."
10049030-35 = "알겠습니다. 그게, 혹시 도움이 될까 싶어서요. 간만에 좋은 생각인가 해서."
10049030-36 = "에헤헤, 그러면 다른 방법을 생각해 보겠습니다!"
10049030-40 = "아, 아뇨!! 그러니까 제가 드리고 싶은 말씀은……."
10049030-41 = "오히려 그런 의상일수록 상대방이 전투 의사가 없다고 방심하게 된달지,"
10049030-42 = "아, 아주 훌륭한 잠입 방침이라고 생각합니다!"
10049030-43 = "스즈미 씨……?"
10049030-45 = "그렇지만 마법소녀라는 거, 유치할 것 같아서 다시 생각해 보니 역시……."
10049030-46 = "그, 그렇지 않습니다! 마법소녀 해피걸리버? 무척 멋있다고 생각하고요!"
10049030-48 = "'헤비캘리버' 아닌가요?"
10049030-49 = "네, 무척 멋지다고 생각합니다!"
10049030-50 = "다만…… 변장하기 위해서는, 제반 지식이 필요합니다."
10049030-51 = "레이사 씨는 그 작품에 대해서 잘 알고 계신가요?"
10049030-52 = "네! 완전 좋아합니다!"
10049030-53 = "세계의 평화를 지키는 모습이 자경단 같다고 해야 할지,"
10049030-54 = "어릴 때부터 지금까지 최고로 좋아합니다!"
10049030-55 = "최근 공개된 극장판도 보고 왔습니다!"
10049030-56 = "누군가와 헤비캘리버 이야기를 하지…… 는 못하지만요……."
10049030-57 = "……."
10049030-62 = "그, 지금 당장 의상부터 수배해 주시겠어요?"
10049030-63 = "가급적 레이사 씨가 가장 좋아하는 것으로, 빨리."
10049030-65 = "스즈미 씨?!"
10049030-69 = "정말요?! 바로 의상 준비해 오겠습니다!"
10049030-74 = "(어째서, 그런 말을 해버렸던 걸까요…….)"
10049030-75 = "(레이사 씨가 의욕에 가득 차 있기도 하고, 잠입하기에 꽤 괜찮기는 합니다만…….)"
10049030-76 = "(이런 의상을 입는 건 부끄럽네요…….)"
10049030-77 = "역시 잘 어울리십니다! 부끄러워하지 마세요!"
10049030-78 = "주인공 역할을 양보하길 잘했습니다! 주인공다운 포스가 있으세요, 스즈미 씨……."
10049030-79 = "……아니, <테르밋 화이트>!"
10049030-80 = "테, 테르밋 화이트요……?"
10049030-81 = "사람들이 많은 곳에서 본명을 말하면 신원이 노출됩니다, 스즈미 씨가 맡은 주인공 배역의 이름이에요!"
10049030-82 = "저는 <테르밋 핑크>! <테르밋 화이트>를 돕는 절친 사이드킥입니다!"
10049030-83 = "그, 그렇군요. 레이……."
10049030-89 = "……테르밋 핑크 씨……."
10049030-93 = "그런데, 테르밋 '핑크'라고 하셨습니다만,"
10049030-94 = "레이사 씨의 의상은 보라색이니 '퍼플' 아닌가요?"
10049030-95 = "앗! 아주 좋은 질문입니다!"
10049030-101 = "[log=레이사 매지컬]그걸 설명해 드리기 위해서는 제가 어릴 때 <마법소녀 헤비캘리버>를 처음#n보았던 날부터 말씀드려야 하는데요, 원래 테르밋 핑크는 말 그대로 하트 쥬얼과[/log]"
10049030-102 = "[log=레이사 매지컬]핑크 드레스가 메인 디자인이지만요! 에라의 충실한 종, 실버플레이트와의 대결전을#n벌이던 <볼트 캐치! 헤비캘리버!>에서 위기에 처하자, 화이트와의 프렌드쉽 퓨전을[/log]"
10049030-103 = "[log=레이사 매지컬]하게 됩니다. 새로운 능력에 눈을 떴지만, 그래도 실버플레이트를 쓰러뜨리지 못하고#n그 둘은 당하고 맙니다, 숙적인 실버플레이트는…….[/log]"
10049030-107 = "자, 잠……."
10049030-109 = "[log=레이사 매지컬]……우정 에너지를 증오의 행성으로 보내려는 그 절묘한 찰나에 이 모습을 한 #n핑크가 나타나서 제압하게 됩니다. 그렇게 해서…….[/log]"
10049030-117 = "……라는 일이 있었습니다! 그때 핑크가 특수 변신한 모습이 바로 이건데요, 그 에피소드를 엄청 좋아해서 이걸로 골라봤습니다! 말하자면, 일반 형태의 핑크가 아니라 진정한 힘을 해방한 모습인 거죠!"
10049030-118 = "그, 그렇군요……. 도움이 되었습니다……."
10049030-119 = "그런데, 레…… 테르밋 핑크. 시미코 씨하고는 연락이 되셨나요?"
10049030-120 = "악의 간부, '에라'입니다!"
10049030-121 = "……'에라'는 혹시 어디에 있나요?"
10049030-122 = "그게, 사실 저도 연락이 되지 않습니다."
10049030-123 = "늦잠이라도 주무시는 걸까요……."
10049030-124 = "백업을 요청드린 것이라 현장의 저희 둘로도 일단 대응은 가능합니다만,"
10049030-125 = "무언가 큰일이 난 게 아니면 좋겠네요."
10049030-130 = "지원으로 온 정의실현부 마시로입니다. 자경단의 두 분, 연결 상태는 어떠신가요?"
10049030-132 = "잘 들립니다."
10049030-133 = "테르밋 핑크도 잘 들립니다!"
10049030-135 = "네, 당소 감도 양호. 지원이 필요하시면 이 채널로 말해주시면 됩니다."
10049030-136 = "트리니티 측 전망 탑에 있으니 참고하시면 됩니다."
10049030-138 = "알겠습니다. 사격 시야에 고려하겠습니다."
10049030-140 = "선생님도, 잘 들리시나요?"
10049030-141 = "[s] \"응, 잘 들려.\""
10049030-142 = "네. 확인했습니다. 필요할 때 불러주세요, 선생님."
10049030-144 = "일단 통신은 이걸로 확인되었군요."
10049030-145 = "마시로 씨. 지원에 감사드립니다."
10049030-150 = "서, 선생님?!"
10049030-151 = "선생님!"
10049030-152 = "[s1] \"안녕. 스즈미, 레이사.\"\n[s2] \"안녕. 테르밋 화이트, 핑크.\""
10049030-156 = "대, 대대대대, 대체 언제부터 계셨던 건가요?!"
10049030-160 = "아, 아앗, 그러니까 이 옷은 그러니까……!"
10049030-161 = "[s3] \"스즈미가 마음의 준비가 안 됐을 때부터.\"\n[s4] \"잘 어울리는 걸, 스즈미.\""
10049030-165 = "하스미 선배로부터 관련 정보는 전해 들었습니다."
10049030-166 = "당장의 현장 지원 가능한 인원은, 저와 선생님, 두 명입니다."
10049030-167 = "선생님께서 오신다고는 못 들었는데요?!"
10049030-168 = "어? 스즈미 씨는 알고 계셨던 것 아니었나요?"
10049030-169 = "알고 있었을 리가요!"
10049030-171 = "하스미 선배는 '가능한 최대한의 지원'으로써, 선생님께 협력을 요청했다고 하셨습니다."
10049030-172 = "자세한 사항에 대해서 잘은 모릅니다만……."
10049030-173 = "그, 그렇군요. 그래도 설마 샬레의 지원을 받게 될 줄이야……."
10049030-174 = "[s5] \"스즈미가 도움이 필요해 보여서!\"\n[s6] \"재밌어 보이기도 하고!\""
10049030-177 = "(간만에 선생님과 뵙게 되는 건 기쁩니다만…….)"
10049030-178 = "(그래도 이런 차림은, 역시…….)"
10049030-179 = "무선대기에 들어가기 전에 하나 말씀드리고 싶은 게 있습니다."
10049030-180 = "두 분, 옷이 참 독특하시군요."
10049030-181 = "그건, 자경단의 유니폼인가요?"
10049030-182 = "정의실현부와 다르게 화려해서 멋지다고 생각합니다."
10049030-183 = "그런 게 아닙니다. 자경단은 애초에 조직이 아니라서 별도의 유니폼은 없습니다만……."
10049030-184 = "그러니까, 이건…… 현장 정찰을 위한 작전용 의상인데요……."
10049030-186 = "<마법소녀 헤비캘리버>의 절친 주인공 듀오! 테르밋 화이트와 핑크입니다!"
10049030-187 = "세계의 평화를 지키고, 정의를 지키는 마법소녀의 옷입니다!"
10049030-188 = "……."
10049030-189 = "……."
10049030-193 = "무척, 멋집니다……!"
10049030-194 = "정의를 지키기 위한 전사의 복장…… 다시 보니 납득이 갑니다."
10049030-195 = "……."
10049030-196 = "콜사인 상 스즈미 씨는 '테르밋 화이트'라고 되어있습니다만, 혹시 '핑크'를 잘못 적으신 걸까요? 이쪽에서는 의상이 분홍색으로 보입니다만……."
10049030-197 = "아! 정말 좋은 질문입니다! 스즈미 씨가 화이트면서 분홍색 의상을 입고 계신 이유를 설명하려면요! 일단 3기 7화를 꼭 봐야 하는데요! 간략히 요약해 드리자면-"
10049030-199 = "코, 콜사인은 제대로 통보된 게 맞습니다. 확인 감사합니다!"
10049030-200 = "레이사 씨. 스포일러가 될 수 있으니, 나중에 다 같이 보는 건 어떨까요?"
10049030-201 = "아앗! 아주 좋습니다! DVD 다 들고 오겠습니다!"
10049030-202 = "그러면 현 시간부로 저는 무선 대기하겠습니다."
10049030-203 = "경계와 저격은 제게 맡겨주십시오."
10049030-204 = "단, 저격은 정의실현부의 발포 허가를 필요로 하는 점, 유의 바랍니다."
10049030-208 = "하아아……."
10049030-209 = "역시 지금이라도 평상복으로 감시하는 게 맞을까요……."
10049030-210 = "에엣, 모처럼 잘 어울리시는데!"
10049030-211 = "그렇지만, 역시 부끄러운 건……."
10049030-212 = "이봐요! 거기! 대기실에서 기다리고 있어야죠!"
10049030-213 = "빨리 준비하세요, 이미 늦었으니까!"
10049030-214 = "저, 저희요?"
10049030-215 = "네?"
10049030-216 = "아까는 열차에서 승무원들이 밖에 내던져서 못 온다고 하더니."
10049030-217 = "됐어요, 지금이라도 왔으니까. 얼른 시작합시다."
10049030-218 = "시작이라니, 무얼 말하시는 거죠?"
10049030-223 = "<마법소녀 헤비캘리버> 스테이지 쇼, 당연하잖아요!"
10049030-224 = "빨리 준비하세요, 캐스트 분들!"
10049030-225 = "캐, 캐스트요?!"
