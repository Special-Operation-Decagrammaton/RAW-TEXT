[translation]
2005602-1 = "이런 데에서 뭐 해?"
2005602-2 = "(……쓸데없는 소리일 것 같아 넘긴 후, 야식을 사러 편의점에 나왔다.)"
2005602-7 = "……? 어라? ……선생님?"
2005602-8 = "왜 선생님이 여기에??"
2005602-9 = "[ns1] \"이 목소리는…….\"\n[ns2] \"……음?\""
2005602-14 = "선생님! 선생님이다!!"
2005602-15 = "역시 제 눈이 맞았군요! 이런 시간에? 무슨 일이에요? 혹시 또 야근?"
2005602-16 = "……네? 저야말로 무슨 일이냐고요? 아니, 제가 먼저 물어봤는데요."
2005602-17 = "……아아. 역시 야근 맞군요. 하하, 뭔가 그런 느낌이더라니."
2005602-18 = "저는 뭐……. 자기 전에 심부름? 같은 걸로 나왔죠. 선배들이 뭐 좀 사 오라고 해서요."
2005602-19 = "선배들은 뭐 하냐고요? 음……."
2005602-20 = "……선생님이랑 같은 거?"
2005602-21 = "[s3] \"……고생이 많네, 세미나도.\"\n[s4] \"그래도 후배라고, 먼저 자라 챙겨주는구나.\""
2005602-24 = "아닛, 거기서 선배들 이야기가 왜 나와요!? 여기서는 제 이야기를 해 달라고요, 선생님!!"
2005602-25 = "……네?"
2005602-26 = "그러고 보니 아까 전에 보낸 모모톡은 뭐였냐고요?"
2005602-30 = "……뭔 모모톡?"
2005602-31 = "[s5] \"……역시 아무 내용 없었군.\"\n[s6] 모모톡 내용을 보내준다."
2005602-34 = "……아! 아아~, 이거~."
2005602-35 = "아니, 뭐. 별로 대단한 건 아닌데요."
2005602-36 = "그냥 대뜸 ‘ㅋㅋ’라고 보내면 뭐라고 대답하실지 선배들이랑 내기를 했을 뿐이고……."
2005602-40 = "……뭔가요, 그 표정."
2005602-41 = "딱히 나쁠 거 없잖아요. 위험하다거나 그런 말로 속인 것도 아니고."
2005602-42 = "뭐 걸거나 한 건 아니었다고요. 이런 시간까지 설교 타임 잡지는 마시죠!"
2005602-43 = "가뜩이나 오늘 하루 종일 고생이었다고요, 보이지 않으시는 건가요? 저에게 쌓여 있는 피로가!"
2005602-44 = "……뭐라고요?"
2005602-45 = "그 복장으로 그렇게 말해도 딱히 설득력이 없어……?"
2005602-46 = "세상에서 제일 편해 보이는 모습? ……아니! 그런 말이 어디 있어요!? 물론 옷이 편한 게 맞긴 하지만!!"
2005602-47 = "[s7] \"옷은 코유키가 직접 고른 거야?\"\n[s8] \"그나저나 의외의 센스네.\""
2005602-50 = "……? 아아."
2005602-51 = "아뇨. 이건 선배들이 골라 준 거예요. 집에서는 그냥 대충 아무거나 입고 잤었거든요."
2005602-52 = "귀여운 옷이라서 저도 마음에 들어요! 뭔가 색이나 모양새도 눈에 확 띄긴 하지만요!"
2005602-53 = "[s9] \"눈에 띈다……라, 과연…….\"\n[s10] (사실 그게 목적이었을지도…….)"
2005602-56 = "또 뭔가 묘한 생각을 하고 계신 표정이로군요."
2005602-57 = "……네?"
2005602-58 = "그나저나 파자마는 기본적으로 집에서 입는 거니까, 밖으로 입고 나가거나 하면 곤란하다고요?"
2005602-59 = "나갔다가 온 옷은 바로 빨아야 해……? 위생……?"
2005602-60 = "에~이, 뭐 어때요. 어차피 바로 요 앞인데 깐깐하게 구시기는."
2005602-61 = "그러는 선생님이야말로 몰골이 말이 아니잖아요! 낮에 보이는 단정한 모습은 어디 가신 거죠? 말씀과 행동이 다릅니다만?"
2005602-62 = "[s11] \"아니, 그것과 이건 다른 게…….\"\n[s12] \"……그렇게 나오시겠다?\""
2005602-65 = "자, 자! 그러니까 사소한 건 신경 쓰지 마시고!!"
2005602-66 = "이왕 이렇게 만난 것도 인연이니, 뭔가 드시고 싶으신 거라도 있으시면 말씀하시죠! 오늘은 제가 살 테니까요!"
2005602-67 = "괜찮으시다고요? 아이, 그런 말씀 마시고. 자, 자!!"
2005602-68 = "맨날 오는 기회가 아니라고요? 제가 누구한테 뭐 사줬다고 하면 선배들은 안 믿을 거라고요?"
2005602-69 = "골라 보세요, 가자~!!! 간식 코너로 전진~!!"
2005602-71 = "(이후 코유키와 함께 잡담 나눌 동안 먹을 간식거리를 구입했다.)"
2005602-72 = "(끝까지 다 사겠다고 고집을 부리는 코유키를 만류하고, 결국 반씩 나눠서 돈을 냈다.)"
2005602-75 = "음~. 오늘은 밤공기도 안 차갑고, 아주 좋네요!"
2005602-76 = "이런 데에서 시간을 보내며 간식을 까먹는 것도 무언가의 운치가 있다고 할 수 있죠."
2005602-77 = "그럼, 같이 드셔보실까요!"
2005602-82 = "……자! 아~ 하세요, 선생님! 아~!!"
2005602-86 = "……선생님? 왜 그러시죠?"
2005602-87 = "[s13] \"근데 너 뭐 심부름 있지 않았냐.\"\n[s14] \"뭔가 길을 많이 샌 거 같은데…….\""
2005602-90 = "……!"
2005602-91 = "에이~, 괜찮아요. 괜찮아. 저에게도 다 생각이 있다고요."
2005602-92 = "선생님과 함께 있었다고 하면 선배들도 어련히 봐 줄 거다~ 이 말입니다. 아시겠어요?"
2005602-93 = "거기다 평소에 늘 도움받는 선생님을 위해 이것저것 사드렸다고 하면~."
2005602-97 = "……크큭."
2005602-98 = "[s15] \"역시 수작이 있었잖아!!\"\n[s16] 휴대폰을 들어 세미나로 연락하려 한다."
2005602-101 = "아~!! 잠깐!! 잠깐잠깐잠깐잠깐잠깐잠깐잠깐잠깐!! 스톱! 스토옵-!!!"
2005602-102 = "너무하시네, 진짜!! 말이 그렇다는 거예요, 말이! 농담이 안 통하는 사람이야, 진짜!"
2005602-103 = "이 정도의 융통성도 없이 어떻게 세상을 살아가려고 그러시는 건가요, 대체!!"
2005602-104 = "……예?"
2005602-105 = "그럼 저는 융통성으로 이루어진 사람이냐고요? 아, 무슨 말끝마다 그렇게 꼬리를 물고!!"
2005602-106 = "아무튼 금방 돌아갈 테니까, 조금만 놀다 가자고요. 그냥 그것뿐!! 아시겠죠!!"
2005602-107 = "……그러니까 자!! 우선 아~!!"
2005602-108 = "……아아아~!!!"
2005602-110 = "(이후 코유키의 말대로, 잠깐이나마 놀이터에서 잡담을 나누며 시간을 보냈다.)"
2005602-111 = "(도중부터는 정말로 잠이 온 것인지, 졸려 하는 코유키를 방 앞까지 배웅해 주었다.)"
