[translation]
2005602-1 = "มาทำอะไรในที่แบบนี้น่ะ?"
2005602-2 = "(คุณครูคิดว่าเป็นเรื่องล้อเล่นเลยปล่อยไป และออกไปซื้อของกินที่ร้านสะดวกซื้อ)"
2005602-7 = "......? เอ๋? คุณครู...?"
2005602-8 = "ทำไมถึงอยู่ที่นี่ล่ะ??"
2005602-9 = "[ns1] \"เสียงนี่มัน...\"\n[ns2] \"หืม...?\""
2005602-10 = ""
2005602-11 = ""
2005602-13 = ""
2005602-14 = "คุณครู! คุณครูนี่นา!!"
2005602-15 = "ตาฉันนี่เฉียบคมจริงๆ แฮะ! ดึกดื่นแบบนี้มาทำอะไรเหรอคะ? หรือว่าทำงานดึกอีกแล้ว?"
2005602-16 = "คะ...? แล้วฉันมาทำอะไรงั้นเหรอคะ? เดี๋ยวสิ ฉันเป็นฝ่ายถามก่อนนะคะ"
2005602-17 = "อ่า... ทำงานล่วงเวลาอีกแล้วสินะคะ ฮ่าฮ่า... คิดแล้วว่าต้องเป็นแบบนั้น"
2005602-18 = "ฉันก็... มาทำธุระก่อนนอนน่ะค่ะ พวกรุ่นพี่สั่งให้ฉันมาซื้อของให้นิดหน่อย"
2005602-19 = "พวกรุ่นพี่ทำอะไรจนป่านนี้งั้นเหรอคะ? อืม..."
2005602-20 = "เหมือนกับคุณครูนั่นละ"
2005602-21 = "[s3] \"ทำงานหนักน่าดูเลยนะ เซมิน่าเนี่ย...\"\n[s4] \"แต่ถึงอย่างนั้นก็ควรให้รุ่นน้องเข้านอนได้แล้วนะ\""
2005602-24 = "เดี๋ยวสิ ทำไมจู่ๆ ถึงพูดถึงรุ่นพี่ล่ะคะ?! ตอนนี้ช่วยคุยเรื่องของฉันเถอะค่ะ คุณครู!!"
2005602-25 = "คะ...?"
2005602-26 = "ข้อความที่ส่งไปทาง MOMOTALK หมายความว่ายังไงน่ะเหรอคะ?"
2005602-27 = ""
2005602-29 = ""
2005602-30 = "ข้อความอะไร...?"
2005602-31 = "[s5] \"คิดแล้วเชียวว่าไม่มีอะไรสินะ...\"\n[s6] ยื่นข้อความ MOMOTALK ให้ดู"
2005602-34 = "อ้อ...! อ้อ~ นี่น่ะเอง~"
2005602-35 = "เปล่าหรอกค่ะ มันไม่ใช่เรื่องใหญ่อะไรหรอกค่ะ"
2005602-36 = "ฉันแค่พนันกับพวกรุ่นพี่ว่าถ้าส่งข้อความหัวเราะ 'คิกๆ' ไป คุณครูจะตอบกลับมาว่าอะไรก็แค่นั้นเอง..."
2005602-37 = ""
2005602-40 = "ทำไมทำหน้าแบบนั้นล่ะ..."
2005602-41 = "ฉันไม่ได้ทำอะไรแย่ๆ สักหน่อยนี่คะ ไม่ได้หลอกว่ากำลังตกอยู่ในอันตรายอะไรสักหน่อย"
2005602-42 = "ไม่ได้เดิมพันอะไรกันเลยด้วยค่ะ ดึกขนาดนี้แล้วอย่าคิดจะบ่นกันเลยค่ะ!"
2005602-43 = "วันนี้ฉันเหนื่อยมาทั้งวันแล้วนะคะ คุณครูไม่เห็นเหรอ? ความเหนื่อยล้าที่สะสมอยู่ของฉันเนี่ย!"
2005602-44 = "ว่าไงนะคะ...?"
2005602-45 = "พูดแบบนั้นตอนใส่ชุดนี้มันไม่ดูไม่ค่อยน่าเชื่อถือเท่าไร...?"
2005602-46 = "ทั้งที่อยู่ในลุคที่ดูสบายๆ ที่สุดในโลก...? เดี๋ยวสิคะ! พูดแบบนั้นได้ยังไงกันคะ?! ถึงชุดนี้มันจะใส่สบายมากๆ ก็เถอะค่ะ!!"
2005602-47 = "[s7] \"โคยูกิเลือกชุดเองเลยเหรอ?\"\n[s8] \"เซนส์เลือกเสื้อผ้าดีสุดๆ เลยนะ\""
2005602-50 = "......? อ่า"
2005602-51 = "เปล่าค่ะ พวกรุ่นพี่เป็นคนเลือกให้ค่ะ ปกติฉันมักจะใส่ชุดสบายๆ เข้านอน"
2005602-52 = "แต่ชุดนี้มันน่ารักถูกใจฉันมากเลย ถึงสีกับลักษณะชุดจะสะดุดตาเกินไปอยู่ก็เถอะค่ะ!"
2005602-53 = "[s9] \"ก็สะดุดตา... จริงๆ นั่นละ...\"\n[s10] (นั่นอาจเป็นจุดประสงค์ที่เลือกชุดนี้ก็ได้...)"
2005602-56 = "ทำสีหน้าเหมือนกำลังคิดอะไรแปลกๆ อยู่เลยนะคะ"
2005602-57 = "คะ...?"
2005602-58 = "ปกติชุดนอนมักจะใส่อยู่แค่ในบ้าน ถ้าใส่ออกมาข้างนอกมันจะลำบากงั้นเหรอคะ?"
2005602-59 = "แล้วพอกลับบ้านก็ต้องรีบเอาชุดไปซัก...? เพื่อสุขอนามัย...?"
2005602-60 = "โธ่เอ๊ย อะไรกันคะ ก็แค่ออกมาข้างนอกแป๊บเดียวเอง อย่าเคร่งเกินไปเลยค่ะ"
2005602-61 = "คุณครูต่างหากค่ะที่ดูไม่ได้เลย! ลุคที่ดูดีเรียบร้อยเมื่อตอนกลางวันหายไปไหนหมดแล้วคะ? คำพูดกับการกระทำต่างกันเลยนะคะ?"
2005602-62 = "[s11] \"นี่ เรื่องนั้นกับเรื่องนี้มันไม่เหมือนกันนะ...\"\n[s12]  \"จะเอาอย่างนั้นเหรอ...?\""
2005602-65 = "เอาละๆ เอาเป็นว่าไม่ต้องสนใจเรื่องเล็กๆ น้อยๆ หรอกค่ะ!!"
2005602-66 = "ไหนๆ ก็มาเจอกันแล้ว ถ้าอยากกินอะไรก็บอกฉันได้เลยนะคะ! วันนี้ฉันจะเลี้ยงเองค่ะ!"
2005602-67 = "ฉันจะไม่เป็นไรแน่งั้นเหรอคะ? โธ่เอ๊ย อย่าพูดแบบนั้นสิคะ มาค่ะๆ "
2005602-68 = "โอกาสแบบนี้ไม่ได้มีบ่อยๆ หรอกนะคะ ถ้าบอกว่าฉันซื้อของให้ใครละก็ พวกรุ่นพี่ไม่มีทางเชื่อแน่ๆ เลยค่ะ"
2005602-69 = "เลือกได้ตามใจชอบเลยค่ะ เอาละ ไปกันเลย~!!! ไปบุกโซนขนมกันเลย~!!"
2005602-71 = "(หลังจากนั้นคุณครูก็เดินเลือกขนมพลางพูดคุยกับโคยูกิไป)"
2005602-72 = "(คุณครูต้องห้ามโคยูกิไว้ เพราะเธอดื้อจะซื้อให้ทุกอย่าง และสุดท้ายก็ตกลงกันว่าจะหารกัน)"
2005602-75 = "อืม~ คืนนี้อากาศไม่หนาวด้วย ดีสุดๆ เลยค่ะ!"
2005602-76 = "ได้มานั่งเล่นและกินขนมในที่แบบนี้ ก็ถือว่าบรรยากาศดีไปอีกแบบเลยนะคะ"
2005602-77 = "มากินขนมกันเลยมั้ยคะ!"
2005602-79 = ""
2005602-82 = "เอ้า...! \"อ้าม~\" สิคะ คุณครู! อ้าม~!!"
2005602-83 = ""
2005602-85 = ""
2005602-86 = "เป็นอะไรเหรอคะ คุณครู...? "
2005602-87 = "[s13] \"เธอต้องไปทำธุระไม่ใช่เหรอ\"\n[s14] \"เหมือนจะโอ้เอ้อยู่นานแล้วนะ...\""
2005602-90 = "......!"
2005602-91 = "โธ่~ ไม่เป็นไรหรอกค่ะ ไม่เป็นไรเลย ฉันวางแผนทุกอย่างไว้แล้วค่ะ"
2005602-92 = "ถ้าบอกว่าอยู่กับคุณครูละก็ พวกรุ่นพี่ก็คงจะไม่ว่าอะไรหรอกค่ะ คุณครูก็รู้ไม่ใช่เหรอคะ?"
2005602-93 = "นอกจากนี้ ถ้าบอกว่าฉันซื้อโน่นซื้อนี่ให้คุณครูที่คอยช่วยเหลือฉันอยู่หลายๆ เรื่องละก็~"
2005602-94 = ""
2005602-96 = ""
2005602-97 = "คิกๆ..."
2005602-98 = "[s15] \"วางแผนอะไรไว้สินะ!!\"\n[s16] หยิบโทรศัพท์ขึ้นมากดโทรหาเซมิน่า"
2005602-101 = "อ๊าย~!! เดี๋ยวก่อนสิคะ!! เดี๋ยวก่อนๆๆๆๆ เดี๋ยวก๊อนนนนนน!! หยุดนะ หยุดดดดดด!!!! "
2005602-102 = "ทำเกินไปแล้วนะคะ!! ฉันก็แค่พูดไปแบบนั้นเองค่ะ เป็นคนที่ไม่เข้าใจเรื่องล้อเล่นเลยจริงๆ ให้ตายสิ!"
2005602-103 = "ใช้ชีวิตอยู่บนโลกโดยไม่มีความยืดหยุ่นเลยแบบนี้ได้ยังไงกันคะ!!"
2005602-104 = "คะ...?"
2005602-105 = "ถ้างั้นฉันก็เป็นพวกที่มีความยืดหยุ่นสูงอย่างงั้นรึเปล่าน่ะเหรอคะ? โธ่ ทำไมต้องคอยจับผิดกันทุกเรื่อง#nเลยละเนี่ย!!"
2005602-106 = "ช่างเถอะค่ะ ฉันจะกลับแล้วละ แค่ชวนเล่นด้วยนิดหน่อยเอง เข้าใจมั้ยคะ!!"
2005602-107 = "เพราะงั้น... เอ้า!! \"อ้าม~\" ก่อนสิคะ"
2005602-108 = "อ้ามมม~!!!"
2005602-110 = "(หลังจากนั้นทั้งสองคนก็ใช้เวลาพูดคุยกันที่สนามเด็กเล่นอยู่อีกครู่หนึ่ง)"
2005602-111 = "(แต่หลังจากคุยกันไปสักพักโคยูกิก็ดูง่วงขึ้นมา คุณครูจึงพาไปส่งที่หน้าห้องของโคยูกิให้)"
