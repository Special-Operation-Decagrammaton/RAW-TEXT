[translation]
2005602-1 = "在這種地方做什麼？"
2005602-2 = "（……覺得好像是廢話就先略過，出來便利商店買宵夜）"
2005602-7 = "……？咦？……老師？"
2005602-8 = "為什麼老師會在這裡？？"
2005602-9 = "[ns1]「這聲音是……」\n[ns2]「……嗯？」"
2005602-14 = "老師！是老師！！"
2005602-15 = "果然我的眼睛沒看錯！這種時間？有什麼事嗎？難道又是加班？"
2005602-16 = "……咦？你問我有什麼事？不是，明明是我先問的。"
2005602-17 = "……啊啊。果然是在加班呢。哈哈，總覺得有這種感覺。"
2005602-18 = "我嘛……睡前出來跑腿？之類的。前輩們讓我去買點東西。"
2005602-19 = "前輩們在做什麼？嗯……"
2005602-20 = "……跟老師一樣的事？"
2005602-21 = "[s3]「……真辛苦呢，研討會也是。」\n[s4]「不過還是會照顧後輩，讓你先去睡呢。」"
2005602-24 = "等一下，為什麼聊起前輩們的事了啊！？#n現在應該要聊我的事才對吧，老師！！"
2005602-25 = "……是嗎？"
2005602-26 = "話說回來，剛才發的MomoTalk是什麼意思？"
2005602-30 = "……什麼MomoTalk？"
2005602-31 = "[s5] 「……果然沒什麼特別的意思。」\n[s6] 把MomoTalk的內容發給他看。"
2005602-34 = "……啊！噢～，這個呀～"
2005602-35 = "不是啦，沒什麼大不了的。"
2005602-36 = "只是突然發個「XD」看老師會怎麼回覆，跟前輩們打賭而已……"
2005602-40 = "……那是什麼表情。"
2005602-41 = "又沒什麼不好的嘛。又不是用什麼危險的話騙你之類的。"
2005602-42 = "又沒有賭什麼東西啊。都這個時間了就別說教了吧！"
2005602-43 = "今天一整天都很累了，你看不出來嗎？我有多疲勞啊！"
2005602-44 = "……你說什麼？"
2005602-45 = "穿著那樣的衣服說這種話一點說服力都沒有……？"
2005602-46 = "看起來是全世界最舒適的樣子？……不是！怎麼能這樣說！雖然衣服確實很舒服！！"
2005602-47 = "[s7] 「這睡衣是小雪自己選的嗎？」\n[s8] 「很適合你呢。」"
2005602-50 = "……？噢噢。"
2005602-51 = "不是。這是前輩們幫我選的。在家裡我都是隨便穿什麼睡的。"
2005602-52 = "這件睡衣好可愛我也很喜歡！雖然顏色和樣式都很顯眼就是了！"
2005602-53 = "[s9] 「確實是滿顯眼的呢。」\n[s10] （說不定那才是目的……）"
2005602-56 = "又在想什麼奇怪的事情了吧。"
2005602-57 = "……唉。"
2005602-58 = "話說睡衣基本上是在家裡穿的，穿出去的話會很困擾的知道嗎？"
2005602-59 = "穿出去的衣服要馬上洗……？衛生……？"
2005602-60 = "哎呀～，沒關係啦。反正就在旁邊而已幹嘛這麼計較。"
2005602-61 = "老師你自己的樣子也很邋遢呢！白天那個端正的樣子跑哪去了？說一套做一套嘛？"
2005602-62 = "[s11] 「不，那個和這個是不一樣的……」\n[s12] 「……無言以對。」"
2005602-65 = "好！好！所以別在意那些小事了！！"
2005602-66 = "既然難得這樣碰面也是緣分，有什麼想吃的就說吧！今天我請客！"
2005602-67 = "你說不用嗎？別這麼客氣啦。來來來！！"
2005602-68 = "知道這機會有多難得嗎？如果我說我請客的話，前輩們肯定不會相信的吧？"
2005602-69 = "選吧，走～！！零食區出發～！！"
2005602-71 = "（之後和小雪一起邊聊天邊買了要吃的零食）"
2005602-72 = "（勸住了堅持要全部請客的小雪，最後各付了一半）"
2005602-75 = "嗯～今天晚上的風也不冷，真棒！"
2005602-76 = "在這種地方消磨時間吃零食，也算是一種情趣呢。"
2005602-77 = "那麼，一起吃吧！"
2005602-82 = "……來！啊～，老師！啊～！！"
2005602-86 = "……老師？你怎麼了？"
2005602-87 = "[s13] 「話說你不是有跑腿的事嗎。」\n[s14] 「好像繞路繞太多了吧……」"
2005602-90 = "……！"
2005602-91 = "哎呀～，沒關係啦沒關係。我有我的打算。"
2005602-92 = "說是跟老師在一起的話，前輩們也會體諒的～就是這個意思。你懂嗎？"
2005602-93 = "而且說是為了平常一直受照顧的老師買了這買了那的話～"
2005602-97 = "……呵呵。"
2005602-98 = "[s15] 「果然有在打什麼鬼主意！！」\n[s16] 拿起手機準備聯絡研討會"
2005602-101 = "啊～！！等等！！等等等等等等等等等等！！停！停～！！！"
2005602-102 = "太過分了，真是的！！我只是那樣說而已，開玩笑的！"
2005602-103 = "這點變通都沒有還怎麼活在這世上啊！！"
2005602-104 = "……咦？"
2005602-105 = "那我就是完全靠變通活著的人嗎？啊～真是的，每句話都要這樣找碴！！"
2005602-106 = "反正我會馬上回去的，就讓我玩一下嘛。就只是這樣！！你懂嗎！！"
2005602-107 = "……所以！首先啊～！！"
2005602-108 = "……啊～～～！！！"
2005602-110 = "（之後按照小雪說的，在遊樂場聊天度過了一小段時間）"
2005602-111 = "（後來他好像真的困了，我送了昏昏欲睡的小雪到房間門口）"
