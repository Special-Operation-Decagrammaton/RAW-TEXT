[translation]
2005602-1 = "在這種地方做什麼？"
2005602-2 = "（決定不對小雪的MomoTalk太過糾結，為了購買宵夜而前往便利商店）"
2005602-7 = "咦？老師……？"
2005602-8 = "為什麼老師會在這裡？"
2005602-9 = "[ns1]「這個聲音是……」\n[ns2]「嗯……？」"
2005602-10 = ""
2005602-11 = ""
2005602-13 = ""
2005602-14 = "老師！是老師耶！！"
2005602-15 = "我果然沒有看錯！#n怎麼這個時間跑來這裡？難道又在加班嗎？"
2005602-16 = "……咦，問我這麼晚有什麼事？#n不是，先提問的明明是我耶。"
2005602-17 = "啊啊……果然是在加班呢。#n尼哈哈，我就知道大概是這樣。"
2005602-18 = "我的話嘛……類似睡覺前出來跑腿？#n前輩們要我出來買點東西。"
2005602-19 = "前輩們在做什麼？#n唔嗯……"
2005602-20 = "跟老師差不多……？"
2005602-21 = "[s3]「研討會也很辛苦呢……」\n[s4]「不過還是會照顧後輩，讓你先去睡呢。」"
2005602-24 = "等一下，為什麼聊起前輩們的事了啊！？#n現在應該要聊我的事才對吧，老師！！"
2005602-25 = "……咦？"
2005602-26 = "剛才發的MomoTalk？"
2005602-27 = ""
2005602-29 = ""
2005602-30 = "什麼MomoTalk……？"
2005602-31 = "[s5] 「……果然沒有特別的意思啊。」\n[s6] 把MomoTalk的內容拿給他看"
2005602-34 = "哦～！原來你指的是這個呀～"
2005602-35 = "哎呀，其實也沒什麼大不了的啦。"
2005602-36 = "就只是跟前輩們賭說，要是突然發個「XD」給老師會怎麼回覆而已……"
2005602-37 = ""
2005602-40 = "……你那是什麼表情。"
2005602-41 = "這也沒什麼不好的吧？#n又不是用危險的話騙你之類的。"
2005602-42 = "而且我們也沒有真的賭什麼東西啊！#n這種時間就別說教了嘛！"
2005602-43 = "我今天已經勞累一整天了耶，你難道看不出來嗎！？"
2005602-44 = "……你說什麼？"
2005602-45 = "穿著這樣說那種話完全沒說服力……？"
2005602-46 = "看起來是全世界最舒服的樣子……？#n不是，怎麼能這麼說呢！雖然衣服確實很舒服沒錯啦！！"
2005602-47 = "[s7] 「這套睡衣是小雪自己選的嗎？」\n[s8] 「意外還挺有品味的呢。」"
2005602-50 = "……這個嗎？"
2005602-51 = "不是，這是前輩們幫我選的。#n之前我都是隨便穿件衣服就睡了。"
2005602-52 = "因為很可愛的關係，我也挺喜歡這套睡衣的！#n雖然顏色和樣式都很顯眼就是了！"
2005602-53 = "[s9] 「確實挺顯眼的呢。」\n[s10] （搞不好那才是他們的目的……）"
2005602-56 = "看你那個表情，八成又在想什麼奇怪的事情了吧……？"
2005602-57 = "……咦？"
2005602-58 = "你說睡衣基本上是在家裡穿的，要是穿到外面去有點不太好？"
2005602-59 = "穿出門的衣服要馬上洗……？衛生問題……？"
2005602-60 = "哎唷～沒關係啦。#n反正就在附近而已，何必這麼計較咧。"
2005602-61 = "而且老師你自己的樣子也很邋遢呀！#n白天那個端正的樣子跑哪去了？這樣不是說一套做一套嗎？"
2005602-62 = "[s11] 「不，那個和這個是兩回事……」\n[s12] 「……這是什麼意思？」"
2005602-65 = "好啦！別在意那些小事了！！"
2005602-66 = "難得像這樣碰面也是種緣分，有什麼想吃的就說吧！今天我請客！"
2005602-67 = "你說不用了？#n哎呀，別這麼客氣啦，來來來！！"
2005602-68 = "這種機會可不是天天都有的哦？#n要是我說我請客的話，前輩們肯定不會相信的哦？"
2005602-69 = "趕快去選零食吧，我們走～！！往零食區出發～！！"
2005602-71 = "（之後一邊和小雪閒聊，一邊購買了要吃的零食）"
2005602-72 = "（說服堅持要全部買單的小雪，最後兩人各付了一半）"
2005602-75 = "嗯～今天晚上的風也不冷，感覺真棒！"
2005602-76 = "在這種地方吃零食打發時間，也還挺有情調的呢。"
2005602-77 = "那麼，我們一起開動吧！"
2005602-79 = ""
2005602-82 = "……來，老師！嘴巴張開，啊～！！"
2005602-83 = ""
2005602-85 = ""
2005602-86 = "老師……？怎麼了嗎？"
2005602-87 = "[s13] 「你不是在幫忙跑腿嗎？」\n[s14] 「好像繞路繞得有點太多了吧……？」"
2005602-90 = "……！"
2005602-91 = "哎呀，沒事沒事～我自有打算。"
2005602-92 = "只要說是跟老師在一起，前輩們也會體諒的啦～這樣懂了吧？"
2005602-93 = "如果再加上一句「我為了報答平時照顧我們的老師，所以買了這些東西請他」的話～"
2005602-94 = ""
2005602-96 = ""
2005602-97 = "……尼哈。"
2005602-98 = "[s15] 「你果然在打什麼不好的主意！！」\n[s16] 拿起手機準備聯絡研討會"
2005602-101 = "啊～！！等等！！等一下等一下！！停停停～！！！"
2005602-102 = "未免太過分了吧，真是的！#n我只是開玩笑而已！！開開玩笑啦！！#n真的很沒有幽默感耶！"
2005602-103 = "連這點變通能力都沒有，要怎麼在這個世界上生活下去啊！？"
2005602-104 = "……咦？"
2005602-105 = "那我就是完全靠變通活著的人……？#n啊～真是的，每句話都要這樣針對我！！"
2005602-106 = "反正我馬上就會回去了，就讓我玩一下嘛！#n就只是這樣而已！！明白了嗎！！"
2005602-107 = "所以……來！啊～！！"
2005602-108 = "啊～～～！！！"
2005602-110 = "（按照小雪說的，在公園聊天度過了一小段時間）"
2005602-111 = "（後來他好像真的睏了，於是將昏昏欲睡的小雪送回了房間門口）"
