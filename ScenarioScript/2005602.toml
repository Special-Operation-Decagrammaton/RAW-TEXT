[translation]
2005602-1 = "What Are You Doing Here?"
2005602-2 = "...I figured Koyuki was probably just messing around, so I ignored her messages and went hunting for a late-night snack at the convenience store."
2005602-7 = "...? Huh? ...Sensei?"
2005602-8 = "What are you doing here, Sensei?"
2005602-9 = "[ns1] \"That voice...\"\n[ns2] \"...Hm?\""
2005602-10 = ""
2005602-11 = ""
2005602-13 = ""
2005602-14 = "It really is you! Hi, Sensei!"
2005602-15 = "I thought I was seeing things! Because why are you even out this late? Are you still working?"
2005602-16 = "...Huh? What am I doing here? No way! I asked first, so you go first!"
2005602-17 = "...Ah. So you ARE working late. Blah. I figured, but how boring."
2005602-18 = "Okay, fine, I guess it's my turn. I'm running a little errand! The upperclassmen asked me to pick some stuff up for them before I went to bed."
2005602-19 = "What are the upperclassmen all up to? Hmm..."
2005602-20 = "...Same as you. Working."
2005602-21 = "[s3] \"...I guess things are tough for Seminar too.\"\n[s4] \"It's nice they're trying to let you get some rest, though.\""
2005602-24 = "Huh? Why are you simpering over THEM? I'm literally right in front of you! Hellooo! Sensei!!"
2005602-25 = "...Huh?"
2005602-26 = "What was with the MomoTalks I sent earlier?"
2005602-27 = ""
2005602-29 = ""
2005602-30 = "...What MomoTalks?"
2005602-31 = "[s5] \"...I knew it was probably nothing.\"\n[s6] Show her the MomoTalk messages."
2005602-34 = "Ohhh. Those!"
2005602-35 = "Weeell, nothing special. Really!"
2005602-36 = "The upperclassmen and I were just making bets on what you'd say if I sent you \"lul\" for no reason."
2005602-37 = ""
2005602-40 = "...What's with that face?"
2005602-41 = "Hey, I didn't do anything wrong! Seriously! I didn't even lie to you! I could've been like, \"Ahhh! Sensei, help! I'm in PERIL!\""
2005602-42 = "And we didn't actually wager anything, okay?! So! No! Lectures!"
2005602-43 = "It's late at night after a long, terrible, difficult day! I'm suffering from sleep deprivation! SUFFERING!"
2005602-44 = "...What?"
2005602-45 = "It's hard to buy into \"my whole act\" when I'm dressed like this?"
2005602-46 = "...I look like the most comfortable, relaxed person in the whole world?#nSays who, huh?! I mean, yeah, this is comfy, but still!!"
2005602-47 = "[s7] \"Did you pick that out yourself, Koyuki?\"\n[s8] \"It's surprisingly stylish!\""
2005602-50 = "Huh? Oh."
2005602-51 = "Nah, I usually just sleep in whatever oversized stuff I have at home. Yuuka picked this out for me!"
2005602-52 = "The design's super cute, isn't it? And the color is so bright, you could see it from anywhere!"
2005602-53 = "[s9] \"You really can, actually...\"\n[s10] \"(That might've been the point.)\""
2005602-56 = "Hey! You just thought something weird, didn't you?!"
2005602-57 = "...Huh?"
2005602-58 = "...It's weird for me to be wearing this out, since they're pajamas?"
2005602-59 = "...And I'll have to wash it before I go to bed tonight? ...For hygiene?"
2005602-60 = "What the! No I don't! I live so close to here that it's like I'm still in my house!"
2005602-61 = "And you're one to talk, Sensei! You're a completely different person from the neat and tidy adult you normally are! So you can hardly chastise me for the way I'm dressed!"
2005602-62 = "[s11] \"This is different, though...\"\n[s12] \"...Is that how you want to play it?\""
2005602-65 = "Now, now! Don't sweat the small stuff!!"
2005602-66 = "Anyways, us meeting here has to have been fate! Let's celebrate with some snacks, on me!"
2005602-67 = "You're fine? Oh, don't be like that. Come on, come on!!"
2005602-68 = "...This kind of thing rarely happens, so if I take too long, the upperclassmen might not believe I was out buying things for someone?"
2005602-69 = "C'mon! I SAID to stop sweating the small stuff! Now then, to the snack aisle!"
2005602-71 = "I bought some snacks for later, all while chatting away with Koyuki."
2005602-72 = "She was insistent and persistent about buying everything, but I managed to convince her to at least split the bill with me in the end."
2005602-75 = "Wow! It's perfect out! Can you taste how crispy the air is, Sensei?"
2005602-76 = "I love hanging out and munching on snacks at this time of night."
2005602-77 = "All righty! Time to FEAST!"
2005602-79 = ""
2005602-82 = "...Okay! Say ahh, Sensei! Ahh!"
2005602-83 = ""
2005602-85 = ""
2005602-86 = "...Sensei? What's wrong?"
2005602-87 = "[s13] \"By the way, didn't you have an errand to run?\"\n[s14] \"Aren't they going to be waiting for you?\""
2005602-90 = "...!"
2005602-91 = "Nah, don't even worry about it. I have a plan already!"
2005602-92 = "If I tell everyone that I was with you, they'll totally understand!"
2005602-93 = "And I'll be like, \"I bought Sensei a bunch of snacks, as a thanks for always helping us out!\""
2005602-94 = ""
2005602-96 = ""
2005602-97 = "...Heehee."
2005602-98 = "[s15] \"I knew something was up!\"\n[s16] Start calling Seminar immediately."
2005602-101 = "Ah!! Wait!! Waitwaitwaitwaitwait!! STOP! STOOOP!"
2005602-102 = "C'mooon, Sensei! I didn't know you were such a stick in the mud! Can't you take a joke?"
2005602-103 = "Do you think you can get by in this cruel world with such an inflexible vibe?"
2005602-104 = "...Huh?"
2005602-105 = "...So am I supposed to be the embodiment of flexibility? Hey! Stop listening to everything I say, seriously!"
2005602-106 = "Ugh, I promise I'll head back soon, so please? Let's hang out for a little bit! That's all I mean!"
2005602-107 = "...So, come on!! Say \"aaah\"!!"
2005602-108 = "...Aaahhh!!"
2005602-110 = "Per Koyuki's request, we sat and chatted at the playground for a little while."
2005602-111 = "It was hard to know if she was actually sleepy, but I walked her back to her room to be safe."
