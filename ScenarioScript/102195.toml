[translation]
102195-4 = "핫핫핫핫! 이쪽도 무사히 완료했군!"
102195-5 = "그럼, 모두들! 다음에 또 기회가 되면 만나자고!"
102195-6 = "무한히 회전하는 레일은 이윽고 정의의 미래로 이어진다!"
102195-7 = "무한초밥전대 카이텐져 퇴-장!!!"
102195-12 = "……."
102195-13 = "정체가 뭐였던 걸까, 저들은."
102195-15 = "(치익) 이쪽도 전부 처리했습니다. 히마리 부장."
102195-16 = "토키……?"
102195-17 = "벌써……? 흐음, 과연 빠르네요. 다음 목표 좌표를 지정해 줄 테니 이동해 주시겠어요?"
102195-18 = "예스 맴."
102195-19 = "……토키. 괜찮은 거야? 너무 무리하는 거 아냐?"
102195-20 = "걱정해 주셔서 감사합니다. 에이미. 하지만 저는 괜찮습니다. 아직 <무장>의 에너지도 남아 있고……."
102195-22 = "토키. <아비 에슈흐>의 그 능력은…… <이름 없는 신들>의 기술이 일부 반영되었다고 가정해도, 결국 요새도시 <에리두>가 존재했기에 성립 가능했던 거예요."
102195-23 = "도시 하나를 통째로 파워드 슈트의 연산장치로 사용한다는 파격…… 아니, 악취미라고 해야 할까. 그랬기에 그런 성능을 낼 수 있었던 거죠."
102195-24 = "그걸로 <이름 없는 신들의 왕녀>를 상대하겠다는 리오의 자신감은 결코 허황된 게 아니었을 지도 몰라요……."
102195-25 = "하지만 <에리두>가 해체되어 껍데기만 남은 지금은, 그 무장은 더 이상 예전의 그 성능을 낼 수 없어요."
102195-26 = "지금은 그저 평범한 외골격이라고 생각해야 해요. 아셨죠?"
102195-27 = "……네."
102195-28 = "……아니, 평범한 건 아니겠네요. 초천재해커인 제가 여기저기 개조해 주었으니까…… 천재의 손길이 느껴지는…… 굉장한 마스터피스랄까. 치트급은 아니겠지만."
102195-29 = "네. 감사합니다. 히마리 부장."
102195-32 = "……괜찮아, 토키? 내가 도와줄까?"
102195-33 = "괜찮습니다. 에이미. 혼자 싸우는 건 익숙하니까요."
102195-38 = "목표 좌표에 도착하면 연락드리겠습니다. 그럼."
102195-42 = "뭔가 우중충하네……."
102195-43 = "토키는 원래 C&C니까요. 어쩌면 그녀는 에이전트들과 함께 싸우고 싶었을지도 모르겠네요."
102195-44 = "그럼 그렇게 하면 되잖아?"
102195-45 = "그러게요. ……자신에게 그럴 자격이 있을까 망설였을지도요."
102195-46 = "음……. 그치만 토키는 시키는 대로 한 거잖아?"
102195-47 = "맞아요. 가장 나쁜 건 그 빅 시스터죠."
102195-48 = "……하지만 그렇다고 해서, 정말 자신이 잘못이 없는 거라고 생각하지는 못하는 거죠."
102195-49 = "흐음……. 어렵네."
102195-50 = "……네. 정말이지, 서툰 사람들이네요. 리오도, 토키도."
102195-55 = "다음화;최후의 방어 작전 - 샬레"
