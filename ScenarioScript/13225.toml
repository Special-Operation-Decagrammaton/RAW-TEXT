[translation]
13225-5 = "크, 크아아악-! 이 녀석들이……!"
13225-6 = "기차가 대파되었습니다! 어, 어떡할까요?"
13225-7 = "큭…… 본대에 보고해라! 여기서 발이 묶이면 답이 없다!"
13225-9 = "하이랜더 녀석들을 찾았습니다!"
13225-11 = "우와아아- 항복! 항복!"
13225-12 = "쏘지 마- 교통사고-는 합의부터- 해야-지-"
13225-14 = "……이 녀석들은 목표가 아니다. 아비도스 녀석들은 어디로 갔지?"
13225-16 = "아비도스? 뭔 소린지 모르겠는데?"
13225-17 = "우리는 고독한 스피드 레이서- 승객 따윈 사치-일뿐-"
13225-19 = "안에도 보이지 않습니다!"
13225-20 = "혹시 처음부터 기차에 없었던 걸까요?"
13225-22 = "뭐라고……? 그럴 리가……?!"
13225-24 = "그런데 이렇게 세워둘 거야? 여긴 손님한테 차도 안 내주는 거야?"
13225-25 = "나는 과자-"
13225-27 = "무, 무슨 소릴……."
13225-33 = "[ns] \"모두 괜찮아?\""
13225-37 = "응. 다들 멀쩡해."
13225-38 = "……. 네. 어떻게든 들키지 않게 빠져나온 것 같아요."
13225-39 = "뛰어내리는 타이밍이 조금만 늦었어도 다칠 뻔 했어……."
13225-41 = "<폐쇄지구 섹터 35-9>까지는 여기서 약 한 시간 거리입니다. 제가 안내할게요!"
13225-42 = "응, 가요!"
13225-48 = "아비도스 사막 폐쇄 지구 섹터 35-9"
13225-50 = "……도착했어요. 이곳이에요."
13225-51 = "여기가…… 숨겨져 있던 정션 스테이션……."
13225-52 = "그런데 오래전에 폐쇄된 역이지? 그런데 어쩐지 인기척이 느껴지는데……."
13225-53 = "응, 저기에 문이 열려있어서 그래."
13225-58 = "들어가 봐요!"
13225-65 = "여기는……."
13225-66 = "정션 스테이션의 관제실이에요. 이미 누군가 다녀간 것 같네요……."
13225-72 = "그러네요. 여기서 아비도스의 다양한 지역으로 갈 수 있게 되어 있어요."
13225-77 = "아비도스 시내로 가는 길도 있고, 대 오아시스 역도 있고…… 게헨나 자치구로 가는 길도 있고……."
13225-78 = "관리자 권한도 이미 활성화되어 있어요……. 누군가가 노노미 선배의 카드로 해제했나 봐요."
13225-80 = "……네, 아마도 스오우 씨겠죠."
13225-81 = "……관제 기록에는 몇 시간 전에 두 대가 학생회장들의 계곡으로 출발했다고 해요."
13225-83 = "호시노 선배겠네. 바로 뒤쫓는다."
13225-84 = "그럼……"
13225-98 = "……됐어요. 이 기차예요."
13225-99 = "바로 탑승하면 되나요?"
13225-100 = "네. 자동으로 움직이는 시스템이라 별도의 운전은 필요 없을 거고…… 1시간 정도면 <학생회장들의 계곡>에 도착할 수 있다고 해요."
13225-102 = "1시간……. 그래도 해가 지기 전에 도착할 수 있겠네."
13225-103 = "학생회장들의 계곡…… 거기에 열차포가 숨겨져 있다는 거지?"
13225-104 = "응. 호시노 선배가 먼저 거기로 가고 있을 거야. 선배가 무슨 짓을 저지르기 전에 서둘러야 해."
13225-105 = "하아……, 무슨 물가에 내놓은 아이도 아니고. 여러모로 손이 많이 가는 선배란 말야."
13225-107 = "스오우 씨는 무슨 목적으로 호시노 선배를 그곳으로 부른 걸까요……. 대체 무슨 생각인지……."
13225-108 = "……응. 그것도 가보면 알게 되겠지."
13225-109 = "그럼 바로 탑승하겠습니다. 선생님!"
13225-110 = "[s] \"그래, 학생회장들의 계곡으로 출발하자.\""
13225-122 = "……여기가 학생회장들의 계곡?"
13225-126 = "그리고 저게 바로……."
13225-137 = "다음화;학생회장들의 계곡"
