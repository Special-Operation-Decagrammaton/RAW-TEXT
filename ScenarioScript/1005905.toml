[translation]
1005905-1 = "다락방의 공주님"
1005905-2 = "(생각보다 일이 늦게 끝나서 약속한 시간보다 늦게 도착해 버렸다.)"
1005905-5 = "와아-☆ 선생님이다!"
1005905-6 = "[s] \"너무 늦어버렸네. 기다렸지?\""
1005905-7 = "응? 아니아니, 괜찮아. 선생님은 원래 바쁘잖아. 오히려 나는 요즘 완전 한가하달까, 여유 있고."
1005905-8 = "[s] \"그런데 무슨 일이야? 미카?\""
1005905-11 = "응? 그러니까…… 음……."
1005905-12 = "……진짜 무슨 일 있는 건 아니었어."
1005905-13 = "괜찮으면 같이 홍차나 디저트라도 먹을까 한 거였고……."
1005905-14 = "그, 그치만 오늘은 휴일이라 가게들이 문을 일찍 닫거든."
1005905-15 = "지금 시간이 늦어서 주변에 문 연 곳도 없을 거고……."
1005905-16 = "어쩌지? 모처럼 와 주었는데……."
1005905-17 = "괜히 선생님의 시간만 더 뺏으면 안 되니…… 샬레로 돌아갈래? 바쁘잖아, 선생님."
1005905-18 = "게다가 선생님이 나처럼 평판 나쁜 애랑 같이 있는 모습을 자꾸 보이면 여러 문제가……."
1005905-19 = "[s] \"아니, 그런 건 신경 쓰지 마.\""
1005905-20 = "으, 으응……."
1005905-21 = "[s1] \"늦은 건 내 잘못이니까.\"\n[s2] \"그럼 잠깐 앉을 곳이라도 찾아볼까?\""
1005905-24 = "앉을 곳이라면……?"
1005905-29 = "아, 내 방은 어때?"
1005905-30 = "[s] \"미카의 방?\""
1005905-31 = "응?"
1005905-32 = "아, 이상하게 생각하진 마! 방이라고 해봤자 좁은 기숙사의 방이고……"
1005905-33 = "오늘은 휴일이라 통금 시간도 꽤 늦은 날이거든."
1005905-34 = "티파티에서 준 롤케이크와 홍차가 있는데, 나는 이제 롤케이크는 질려서…… 이대로 두면 상해버릴 지도……."
1005905-35 = "아, 아니면 선생님이 가져가서 먹어도 되고! 버리는 것보단 나으니까!"
1005905-36 = "[s3] (미카의 호의를 계속 거절하는 것도 그러니…….)\n[s4] \"그럼 잠깐 들려서 케이크만 가져갈게.\""
1005905-39 = "응! 시간을 오래 내진 못할 테니까……."
1005905-43 = "기숙사는 이쪽이야!"
1005905-52 = "[ns] (꽤 낡은 건물이다…….)"
1005905-53 = "미안, 좀 을씨년스럽지? 오래된 건물이라 인기가 없거든. 그래서 학생도 거의 없어."
1005905-54 = "저번엔 쥐도 봤었어…… 으으…… 예전에 있던 감옥 교실이 그리울 정도야……."
1005905-55 = "[s] \"고생이 많구나…….\""
1005905-56 = "아하하하☆ 아냐. 그래도 관리는 나름 철저하게 되고 있으니까."
1005905-57 = "내 방은 꼭대기 층이라서, 여기 비상계단을 타고 올라가면 돼."
1005905-58 = "[s5] \"비상계단……? 어쩐지 정상 루트가 아닌 거 같은데……?\"\n[s6] \"미카의 방만 이상한 곳에 있는 거야?\""
1005905-61 = "그렇지? 나는 사정상 특별 취급이니까."
1005905-65 = "자, 계단이 가파르니까 조심해."
1005905-73 = "자, 도착! 저쪽 끝에 있는 방이야."
1005905-74 = "[s] \"거의 다락방이네…….\""
1005905-75 = "응……"
1005905-76 = "그러네…… 다락……."
1005905-81 = "어디보자……."
1005905-82 = "……그러니까 슬슬……."
1005905-86 = "[ns] \"슬슬……?\""
1005905-90 = "점호시간입니다!!"
1005905-91 = "[ns] \"???!!!??\""
1005905-92 = "현 시간 부로 정문 폐쇄! 각 학생들은 자신의 방 문 앞에서 대기해 주세요!"
1005905-93 = "점호는 제일 먼저 최상층부터 시작하겠습니다!!"
1005905-94 = "우와, 큰일 났어, 선생님! 사감이 여기로 오고 있어!"
1005905-95 = "[s] \"미, 미카……?!\""
1005905-96 = "일단 내 방에 들어가서 이불 뒤집어쓰고 숨어 있어! 여고생의 기숙사에 들어왔다가 들키면 완전 아웃이잖아!!"
1005905-97 = "[s7] \"아…… 으아아……?!\"\n[s8] 일단 시키는 대로 한다."
1005905-105 = "(시키는 대로 미카의 방에 들어가서 침대의 이불을 뒤집어썼다.)"
1005905-110 = "미카 님? 위가 소란스럽던데 무슨 일 있었습니까?"
1005905-111 = "응? 아니. 별로?"
1005905-112 = "……. 말소리가 들린 것 같았는데요."
1005905-113 = "아하하☆ 뭐래. 잘못 들은 거 아닐까?"
1005905-119 = "잠시 비켜주시겠습니까? 방안을 확인하고 싶습니다만."
1005905-120 = "우와…… 신뢰받지 못하고 있는 걸까나……."
1005905-121 = "뭐, 마음대로 해."
1005905-123 = "그럼 실례."
1005905-128 = "[ns] (………!!!!)"
1005905-133 = "……."
1005905-134 = "흐음……. 잘못 들었나……."
1005905-140 = "너무 소란스럽게 하진 마십시오. 미카 님. 여기는 시설이 낡아서 말소리가 다 들리니까요."
1005905-141 = "그럼 푹 쉬십시오."
1005905-142 = "응, 수고해☆"
1005905-146 = "……우와. 성공?"
1005905-152 = "선생님. 이제 됐어. 나와도 돼."
1005905-153 = "[ns] \"미카……!! 너……!!\""
1005905-156 = "― 쉬잇-"
1005905-160 = "[wa:700]― ……선생님은 [wa:1600]속은 거야."
1005905-163 = "[wa:100]― 어떡하지?"
1005905-165 = "― 이제, [wa:930]아침까지 여기 있을 수 밖에 없는데?"
1005905-168 = "[wa:530]― 이렇게 [wa:600]간단히 나를 [wa:900]믿어버리다니,"
1005905-170 = "― 선생님도 [wa:600]정말이지……."
1005905-173 = "― 그렇게 [wa:400]나를 믿지 말라고 [wa:2700]말했는데도……."
1005905-176 = "[ns] \"너는……!!\""
1005905-177 = "[wa:400]― 응? [wa:1650]여기에서 소란 피웠다간……"
1005905-179 = "― 모두에게 [wa:450]들켜버릴 거야? [wa:1900]괜찮아?"
1005905-182 = "― ……나는 [wa:1950]딱히 [wa:850]상관없지만."
1005905-185 = "[ns] \"……………….\""
1005905-186 = "[wa:2000]― ……어라?"
1005905-188 = "[wa:60]― 혹시…… [wa:2100]화났어?"
1005905-191 = "― 내가 문제아라는 것 쯤,"
1005905-193 = "[wa:100]― 선생님도 [wa:580]알고 있었잖아……?"
1005905-196 = "[ns9] 미카의 장난에 어울려주지 않는다.\n[ns10] \"왜 이런 짓을 한 거야? 장난이 심하잖아.\""
1005905-197 = "[wa:600]― 저기……"
1005905-198 = "[wa:600]― 저기……"
1005905-200 = "― 곤란하게 만들려는 건 아니었어."
1005905-203 = "― ……선생님에게 [wa:1550]미움받는 건…… [wa:3100]싫어……."
1005905-205 = "― 하지만…… [wa:1850]조금만……."
1005905-208 = "― 아주 [wa:550]잠깐이라도 좋으니까……"
1005905-210 = "― 선생님과, [wa:2550]함께 있고 싶었어……."
1005905-213 = "(어쩔줄 몰라하는 미카와 함께 미카의 방에서 아침이 될 때까지 기다렸다.)"
1005905-214 = "(기숙사 문이 열리자마자 틈을 노려 아무도 모르게 기숙사를 빠져나갔다.)"
