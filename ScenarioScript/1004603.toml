[translation]
1004603-1 = "이즈나와 함께 모래 장난!"
1004603-2 = "흥흥흥~♪"
1004603-3 = "이즈나이즈나 캥캥~♪"
1004603-4 = "(이즈나와 또 한 번 바닷가를 찾게 되었다.)"
1004603-13 = "앗! 주군주군! 방금 파도가 철~써억! 하고 치면서 모래가~!"
1004603-14 = "파도가 친 뒤에 스르륵 빠져나가는 바닷물을 보고 있으면, 뭔가 눈이 빙글빙글 도는 거 같아요~!"
1004603-15 = "[s] \"맞아, 보고 있다 보면 그런 느낌이 든다니까.\""
1004603-16 = "에헤헷!"
1004603-17 = "여름의 바다라는 건, 이렇게나 눈이 빙글빙글 도는 걸로 가득하네요!"
1004603-18 = "음~! 그럼 오늘은 주군과 함께, 이즈나는 뭘 하면 좋을까요~?"
1004603-19 = "[s] \"아, 그런 거라면 이즈나. 모처럼이니까. 오늘이야말로 수영을…….\""
1004603-20 = "앗, 수, 수영 말씀이신가요?!"
1004603-21 = "그, 그게, 그러니까……."
1004603-22 = "그게."
1004603-28 = "앗!"
1004603-29 = "주, 주군! 그것도 좋지만! 모처럼 바닷가에 왔으니……."
1004603-30 = "이즈나, 하고 싶은 닌자 수련이 생각났어요!"
1004603-31 = "[s] \"아, 그래? 혹시 무슨 수련이야?\""
1004603-32 = "이런 여름 바다의, 그것도 모래사장에서밖에 할 수 없는 수련……."
1004603-33 = "그건 바로……!"
1004603-34 = "이 해변의 모래를 이용해, 닌자들만의 성을 구축하는 거예요! 주군!"
1004603-35 = "[s1] \"……으, 응?\"\n[s2] (그게 닌자 수련이랑 관련이 있나……?)"
1004603-38 = "이즈나가 어쩌다가 들은 이야기인데요."
1004603-39 = "예전에 어디 해변에서는 모래만으로 커다란 성을 짓고, 악당과 치열한 결투를 펼친 사람들도 있는 모양이에요!"
1004603-40 = "[s] (미묘하게 그런 일도 있었던 것 같은 느낌적 느낌이…….)"
1004603-41 = "무려 3일 밤낮을 공성과 수성을 반복한 끝에, 쳐들어온 불량배들을 물리쳤다던가!"
1004603-42 = "그 과정에서 수많은 부상자가 발생했지만, 그래도 그 누구도 쓰러지는 일 없이! 적을 격퇴했다던가!"
1004603-43 = "거기엔, 마침 바닷속에서 나온 캇파가 도움을 줬다던가……!"
1004603-44 = "[s3] \"뭔가…. 엄청나게 비약이 된 듯한…….\"\n[s4] (캇파가 바다생물이었던가?)"
1004603-47 = "으음! 그렇다면 이즈나도 닌자 된 몸으로서! 네! 질 수 없어요!"
1004603-48 = "아무도 침입할 수도…… 정복할 수도 없는……."
1004603-49 = "그런 굉장한 성을 만들어서! 완벽하게 주군을 지키겠습니다!"
1004603-50 = "그래서 말이지만……"
1004603-56 = "모래성 만들기. 도와주실……래요? 주군?"
1004603-57 = "[s] \"뭐, 어쩔 수 없지. 만들까. 모래성.\""
1004603-58 = "네……!"
1004603-60 = "(그리하여 야심을 한가득 품은 이즈나와 함께, 모래사장 한쪽에 모래성을 만들기 시작했다.)"
1004603-62 = "완벽한 모래성을 만들기 위해선 기반 공사가 중요하다고! 이즈나는 생각해요!"
1004603-63 = "우선, 여기서부터 여기까지 터를 만들고……."
1004603-69 = "에헤헷! 이 정도면 될까요?"
1004603-75 = "아앗! 모처럼 만든 성터의 귀퉁이가~~?!"
1004603-76 = "우우…… 파도 때문에 전부 무너져 버렸어요……."
1004603-77 = "[s] \"음, 아무래도 너무 바다 가까이 확장하는 건 안 되겠는데.\""
1004603-78 = "으으으! 에잇! 이, 이 정도로 이즈나는 포기하지 않아요!"
1004603-79 = "비록 처음에는, 잘 되지 않는다고 해도……!"
1004603-80 = "이즈나는, 실패에서도 무언가를 배우는 닌자니까요!"
1004603-81 = "[s] \"응! 이즈나는 하면 되는 아이니까!\""
1004603-82 = "네! 주군의 응원을 받아서! 이즈나 그럼 노력할게요……!"
1004603-86 = "다음엔 좀 더 바깥 부분부터 천천히! 쌓는 쪽으로 만들면……!"
1004603-91 = "앗! 주군! 그쪽 잡아주세요!"
1004603-95 = "캐앵?! 또, 후두둑! 무너져 버리다니?!"
1004603-96 = "[s] \"앗. 이번엔 무게를 못 견디고 무너졌나 봐. 아무래도 모래니까.\""
1004603-97 = "우, 우으……! 그래도 포기하지 않고! 이번엔……!"
1004603-98 = "주군! 도전이에요!"
1004603-100 = "으앙?! 이번엔 또 망루가 무너져 버리다니이?!"
1004603-101 = "무게 균형이라는 거……. 너무 어려워요~!"
1004603-103 = "이번엔 성벽 가운데로 꽃게 씨의 습격이?!"
1004603-104 = "아앗, 아, 안 돼요! 거긴 올라가면 안 되니까요?!"
1004603-105 = "우와아앙?!"
1004603-107 = "(몇 번이고 시도했지만, 처음 계획과 달리 모래성 만들기는 좀처럼 진도가 나가질 않았다.)"
1004603-109 = "[ns] \"이즈나, 이대로는 어렵겠는걸.\""
1004603-110 = "………네, 주군."
1004603-111 = "확실히…… 처음부터 이즈나가 너무 욕심을 부린 걸지도 모르겠어요……."
1004603-112 = "마음 같아선 주군을 지키기 위해,"
1004603-113 = "누구도 침범할 수 없는 가장 완벽한 모래성을 만들고 싶었지만……."
1004603-114 = "네! 그런 생각 끝에 아예 성을 만들지 못하면, 의미가 없으니까요!"
1004603-115 = "주군의 말씀 덕분에, 이즈나! 깨달았어요!"
1004603-116 = "[s] (딱히 대단한 말을 한 것 같진 않은데……?)"
1004603-117 = "여기에선 욕심을 조금 버리고…… 크기를 좀 더 줄여서."
1004603-118 = "원래 계획보다 작지만, 그래도 튼튼한 성을 만들도록 해요!"
1004603-119 = "[s] \"그래! 힘내자! 이즈나!\""
1004603-120 = "넵! 이즈나! 갑니다!"
1004603-128 = "(그렇게 포기하지 않고 이즈나와 함께 성을 만들다가…… 허물어지고,)"
1004603-140 = "(또 만들다가…… 무너지기를 몇 번이나 반복해왔을까.)"
1004603-153 = "주군…… 정말 수많은 역경이 있었어요."
1004603-154 = "[s] \"응. 그랬지.\""
1004603-155 = "파도는 그냥 멋지다고만 생각했는데, 바로 그 파도가 치면서 성벽을 무너트린다거나."
1004603-156 = "갑자기 날아온 비치발리볼 공에, 심혈을 기울여 만들고 있던 지붕이 무너진다거나……."
1004603-157 = "[s] \"공을 가지러 온 사람이 엄청나게 사과했지.\""
1004603-158 = "하지만 그때마다 포기하지 않고, 계획을 수정하거나……"
1004603-159 = "주군의 말씀을 따라, 새로운 방법을 생각해낸다거나……."
1004603-160 = "정말로 주군과 합심해서! 함께 만들 수 있었던 거네요!"
1004603-161 = "[s] \"응, 고생했어. 이즈나.\""
1004603-162 = "자! 마침내! 여기!"
1004603-163 = "주군과 이즈나가 함께 만든…… 저희만의 성이에요!"
1004603-168 = "어떠신가요!? 주군?!"
1004603-169 = "[s5] \"멋져! 멋지긴 한데 말이지…….\"\n[s6] \"어째 처음 목적과는 엄청나게 멀어진 듯한…….\""
1004603-172 = "에헤헷! 여러 가지로 큰일이 많았지만!"
1004603-173 = "그래도 주군과 함께 이렇게 모래성을 완성하다니! 이즈나! 엄청 즐거워요!"
1004603-174 = "모래성 만들기는……. 혼자서 하는 것보다, 이렇게 함께 하는 게 훨씬 즐거운 일이었네요!"
1004603-175 = "이즈나, 이제껏 몰랐어요! 오늘도 주군 덕분에 많은 걸 배웠습니다!"
1004603-176 = "[s] \"이즈나…….\""
1004603-181 = "아차……. 벌써 시간이 이렇게……."
1004603-182 = "에헤헷, 모래성도 이렇게 만들었고, 시간도 늦었으니까."
1004603-183 = "이제 숙소로 돌아가야겠죠……."
1004603-187 = "아쉽지만, 오늘 모래 장난은 여기까지 하고……"
1004603-188 = "주군, 같이……."
1004603-189 = "[s] \"아니, 이즈나. 아직 오늘은 끝나지 않았어!\""
1004603-190 = "……넷?"
1004603-191 = "[s7] \"성의 크기가 작아진 만큼, 여기서부터는 물량으로 승부하는 거야!\n[s8] \"그게 전통적인 닌자의 전술이니까!\""
1004603-194 = "[ns] \"어때, 같이 해줄 거지?\""
1004603-195 = "그 말씀은……"
1004603-196 = "주군이랑, 조금 더 모래 장난을 해도 된다는, 말씀이신가요……?"
1004603-200 = "그것이 주군의 명이시라면……"
1004603-201 = "네! 이즈나! 얼마든지! 따르겠습니다!"
1004603-202 = "에헤헷!"
1004603-204 = "(그렇게 해가 저물고 기다란 석양이 수평선 너머로 숨을 때까지.)"
1004603-205 = "(이즈나와 함께 모래 장난을 계속했다.)"
