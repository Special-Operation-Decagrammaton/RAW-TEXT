[translation]
1008006-1 = "까다로움"
1008006-2 = "(곤란에 처한 것 같아, 쇼쿠호가 있는 곳으로 찾아갔다.)"
1008006-8 = "……음? 선생님?"
1008006-9 = "과연……. 걱정이 돼서 찾아온 거네."
1008006-10 = "몇 번이고 생각한 거지만, 꽤 상냥한 사람이랄까."
1008006-11 = "그렇지만 음……. 그렇지."
1008006-12 = "아무리 선생님이라도, 무턱대고 부탁하기에는 조금 어려운 일이 있는 법이니까."
1008006-13 = "[s1] \"어려운 부탁이라고?\"\n[s2] \"음식점을 찾는 게 아니었어?\""
1008006-16 = "확실히 식당을 찾고 있는 것이긴 하지만……."
1008006-17 = "조금은 식당을 가리는 편이거든. 배가 고프더라도 그것은 달라지지 않아서."
1008006-18 = "아무거나 먹는 건……. 인간적으로 문제가 있다고 봐야 할까."
1008006-19 = "원래 있던 곳에서는 늘 먹던 가게도 몇 군데 알고 있고, 그게 아니더라도 쉽게 가게의 상태를 파악할 수 있었지만……."
1008006-20 = "여기서는 그리 쉽지가 않네. 어쩌면 지금이야말로, 조금 집중해서 생각을 읽어봐야 할 때이려나?"
1008006-21 = "[s3] \"그렇게까지……?\"\n[s4] \"이게 그런 안건이야?\""
1008006-24 = "당연하잖아? 자기 입에 들어가는 것보다 신중력을 써야 할 것도 별로 없다고."
1008006-25 = "나는 기본적으로 신선한 유기농 재료로 만든 것 외에는 입에 넣지 않아. 이 기준은 명확하지."
1008006-26 = "하지만 대부분의 가게들이 자기들 입으로 그렇게 말하는 것과 달리……. 실상은 어떨까?"
1008006-27 = "진짜로 유기농 재료를 썼다고 말할 수 있을까? 믿을 수 있는 가게라고 할 수 있을까?"
1008006-28 = "주인장의 생각, 주방장의 마음을 읽어보기 전까지는 확신할 수 없지."
1008006-29 = "그렇기 때문에 곤란한 거야, 지금 상황이."
1008006-30 = "여기서만큼은 타협 같은 걸 고려할 수 없어. 어중간한 음식을 먹을 바에야……."
1008006-31 = "차라리 굶는 게 나아. 이건 진심이야, 선생님."
1008006-35 = "[ns5] \"진심력-이라는 게 확 느껴지네.\"\n[ns6] \"과연, 그런 쪽의 미식가인가.\""
1008006-38 = "……흠?"
1008006-39 = "뭐야, 그 표정은? 뭔가 나름대로의 생각이 있다는 표정인데."
1008006-40 = "……응?"
1008006-41 = "선생님한테 한 번 맡겨 달라고? 무슨 이야기야? 선생님이 직접 만들어 주기라도 하게?"
1008006-42 = "……아니라고?"
1008006-43 = "가게를 소개해 줘……?"
1008006-44 = "선생님……. 방금까지 뭘 들은 거야? 나는 그렇게 대충 자리를 고르는 게……."
1008006-45 = "……응? 제대로 들었다고?"
1008006-46 = "……그럼에도 자신이 있다……?"
1008006-50 = "……호오."
1008006-51 = "그렇게까지 말하니 확실히 조금은 의문이 생겨날지도?"
1008006-52 = "그러면 한 번 따라는 가 보도록 할까? 하지만 선생님, 방금도 이야기했지?"
1008006-53 = "생각을 읽지 않아도, 음식이 나온 뒤에는 금방 알아차릴 수 있으니까."
1008006-54 = "만약 내 기준에 미치지 못한다면, 그대로 돌아 나올 거야. 그 점은 미리 기억해 주길 바라."
1008006-55 = "그럼……. 가볼까?"
1008006-58 = "……이곳이야?"
1008006-59 = "꽤 깔끔하긴 하네. 아직 확신은 없지만……."
1008006-60 = "그럼, 이왕 이렇게 됐으니, 메뉴도 선생님이 고르는 걸로 따라가 볼까."
1008006-61 = "……흐응……. 과연, 그렇게 시키겠다……."
1008006-62 = "확인했습니다. 그럼 함께 오신 분께서는……."
1008006-63 = "……나도 같은 거."
1008006-64 = "네. 확인했습니다. 조금만 기다려 주세요."
1008006-66 = "(잠시 후.)"
1008006-73 = "메뉴 나왔습니다. 맛있게 드세요-!"
1008006-77 = "……흐응. 이런 곳이구나."
1008006-78 = "꽤나 자신력 있는 것 같은데, 혹시 이곳 점장이나 주방장이랑 아는 사이라든가?"
1008006-79 = "그런 건 아니라고? 그러면 어떻게 그렇게 여유력 있는 얼굴일까?"
1008006-80 = "선생님이 먹기에는 괜찮았지만, 사실 재료는 적당히 아무거나 공수해 오는 곳일 수도 있지 않을까?"
1008006-81 = "……절대 그럴 리는 없다?"
1008006-82 = "'절대로'……라……."
1008006-83 = "……아. 이건 따지는 게 아니야. 그저 선생님의 태도가 평소와는 달라서, 조금 신기한 것뿐."
1008006-84 = "선생님, 늘 약간 신중하게 말하는 타입이잖아? 좋은 게 좋은 거라는 느낌?"
1008006-85 = "그런 선생님인데도, 확실하지 않은 것인데도 이렇게 단언한다는 게 신기한 거지."
1008006-86 = "뭐랄까……."
1008006-87 = "뭔가 믿을 만한 검증 수단이 있다……는 느낌?"
1008006-91 = "아예 틀린 말은 아니라고? 흐응……?"
1008006-92 = "[s7] \"사실 이곳에도 미식가들이 있거든.\"\n[s8] \"아니었으면 이 가게는 지금 여기 없었을 테니까.\""
1008006-95 = "뭔가 이해하기 어려운 이야기를……."
1008006-96 = "좋아. 말이 길어지는 것 같으니, 일단 한 입 먹어 보도록 할까……."
1008006-104 = "…………오?"
