[translation]
83303100200-7 = "………후우. 일단 연습은 이 정도까지 해둘까."
83303100200-8 = "조급함을 느낀다고 해도…… 그게 곧 제대로 된 연습으로 이어지진 않으니까."
83303100200-9 = "좀 더 차분하게 하지 않으면……"
83303100200-16 = "[ns] \"……라는 일이 있어서 일단 전해둘게. 반칙은 좋지 않으니까.\""
83303100200-17 = "그렇구나. 어쩐지…… 조금 조용하다 싶더라니."
83303100200-18 = "하긴 내가 잠시 자리를 비우기만 하면 만마전의 의장은 몇 번이고 이런 일을 벌이곤 하니까."
83303100200-19 = "딱히 새삼스러운 일도 아니지만 말이야."
83303100200-20 = "[ns] \"자주 있는 거구나……!\""
83303100200-21 = "어쨌거나 연락해 줘서 고마워. 선생님."
83303100200-22 = "이번 건은 선도부와 함께 대응해둘 테니까."
83303100200-23 = "[ns] \"응. 히나. 그럼…… 피아노 연습까지 포함해서 힘내.\""
83303100200-25 = "응."
