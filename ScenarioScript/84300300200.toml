[translation]
84300300200-5 = "상황은 파악했어. 유리조노 세이아."
84300300200-6 = "다행히도 우리가 당신을 경계해야 할 이유는 없다고 결론 내렸지."
84300300200-7 = "오히려……. 그렇지, 밀레니엄 내부의 일에 엮이게 만들어서 미안하다는 사과의 말을 전하는 게 맞겠네."
84300300200-8 = "아니요. 오히려 무리했던 제 행동이 폐를 끼친 것 같으니, 제가 사과를 드려야겠지요."
84300300200-9 = "하지만 역시 그 사람들……. 뭔가 수상한 일을 하고 있었던 모양이네요."
84300300200-10 = "세미나에는 알렸나요? 지금이라도 바로 공유돼야 할 일이라고 생각하는데."
84300300200-11 = "평상시라면 그렇겠지만……. 지금은 조금 상황이 복잡해."
84300300200-12 = "정확히 그들이 무슨 일을 하려는지도 모르는데, 준비하고 있는 규모만 굉장히 큰 것으로 판단되고 있거든."
84300300200-13 = "사실을 알려 준다면 세미나는 만약을 위해 밀레니엄 엑스포를 중단하겠지. 그리고 나는 그걸 원하는 게 아니야."
84300300200-14 = "마음은 이해하지만, 그렇다고 해도 어쩔 수 없는 일이라고 생각하는데요. 달리 방법이……."
84300300200-19 = "……과연,"
84300300200-20 = "그렇게 된 거군요."
84300300200-21 = "그래서 당신은 이곳에 숨어, 저 미카모 네루와 함께 사건을 조사하고 그림자 속에서 해결하려 하고 있다."
84300300200-22 = "츠카츠키 리오. 당신은 아직도 그런 태도를……."
84300300200-23 = "밀레니엄 엑스포는 우리 학교에서 가장 중요한 행사들 중 하나야. 다소의 무리수를 두더라도, 그 행사에 금이 가게 할 수는 없어."
84300300200-24 = "하지만 준비 기간 동안, 일련의 수상한 데이터 흐름을 발견한 것 또한 사실이지. 우리는 그게 뭔지 알아내야 해."
84300300200-25 = "아직은 그들이 뭘 원하는지조차 알 수 없지만……."
84300300200-27 = "……잠깐 기다려."
84300300200-28 = "네루?"
84300300200-29 = "그건 모르는 일이지. 이 녀석, 내가 구해주기 전에 분명 상자 속에 숨어 저쪽 말을 다 듣고 있었거든."
84300300200-30 = "정황상 우연도 아니고, 일부러 그 말을 확인하기 위해 접근했던 걸로 보이고 말이지. 안 그래?"
84300300200-32 = "예리하군요."
84300300200-33 = "맞습니다. 그리고 저들의 목적도 대략적인 부분은 확인했지요."
84300300200-34 = "그건 좋은 소식이네. 괜찮다면 그 목적이 뭔지 알려줄 수 있겠어?"
84300300200-35 = "네, 물론이지요."
84300300200-39 = "……하지만 그냥은 안 돼요."
84300300200-40 = "뭐?"
84300300200-42 = "뭐라고?"
84300300200-43 = "어이, 지금 좋은 말로 해 주니 상황 파악이 잘 안되는 모양인데……."
84300300200-44 = "그만둬, 네루. 아무리 지금 같은 상황이라고는 해도, 명색이 트리니티 종합학원의 티파티 소속 인사야. 상처라도 생겼다간 일이 커져."
84300300200-45 = "그래서?"
84300300200-46 = "아니, '그래서'가 아니고……."
84300300200-47 = "……우선 원하는 걸 들어보지."
84300300200-48 = "금전이나 학교 간의 거래를 원하는 것이라면, 그 거래가 합리적일 경우 어느 정도 성사되도록 유도할 수 있어."
84300300200-49 = "지금 협박을 들어주잔 거야?"
84300300200-50 = "아직 그렇게 결론 내린 건 아니야. 변수가 뭔지 알 수 있음에도 바로 내리는 결론이 적합하지 않다는 지적을 하고 있을 뿐."
84300300200-51 = "뭘 원하지? 유리조노 세이아."
84300300200-53 = "생각했던 것과 달리 협조적이군요. 감사드려요."
84300300200-54 = "하지만 제가 바라는 건 금전도 학교 간의 일도 아니에요. 지극히 개인적인 일이고, 지금 이 사태와 관련이 있는 일이죠."
84300300200-58 = "두 분만 괜찮으시다면, 저를 이 작전에 포함시켜 주세요."
84300300200-63 = "……? 뭐?"
84300300200-64 = "이건 또 무슨 소리야?"
84300300200-65 = "의도를 이해할 수 없는데. 나와 네루가 하고 있는 이 일에……. 협조하고 싶다는 뜻이야?"
84300300200-66 = "말씀대로에요. 그 이유는 지극히 사적인 문제인지라, 굳이 말씀드리지 않아도 될 것 같네요."
84300300200-68 = "뭐라는 거야? 지금 그게 말이 된다고 생각해?"
84300300200-69 = "어이, 리오. 안 되겠어. 지금 당장 이 녀석을 기절시키고, 적당히 다른 사람들 보이는 곳에 던져 놓고 올 테니……."
84300300200-71 = "안 돼, 네루. 그랬다가 우리와 학교의 지금 상황에 대해서 그녀가 발설할 경우, 우리에겐 대책이 없어."
84300300200-72 = "무엇보다 그녀는 지금 우리가 조사하는 대상이 뭘 하려는지 알고 있어. 그 패를 버리는 것은 너무 비합리적이야."
84300300200-73 = "그러면 대충 두들겨 패서 말하게 하는 쪽으로……."
84300300200-77 = "유리조노 세이아."
84300300200-78 = "……당신에겐 진 빚이 있지."
84300300200-82 = "알았어. 당신의 합류를 허가할게. 대신 무슨 일이 있어도 내 지시를 따라줘야 해."
84300300200-88 = "……!? 뭐!?"
84300300200-89 = "괜찮아, 네루. 그녀는 신뢰할 수 있어. 우리에게 해가 될 행동은 하지 않을 거야."
84300300200-90 = "……????"
84300300200-91 = "……하."
84300300200-92 = "이거 놀랍네. '신뢰'라니……. 네 입에서 그런 말도 다 나오고. 조금은 머리가 큰 거냐?"
84300300200-93 = "상대가 그만큼 신뢰할 수 있는 인물이라는 것뿐이야. 네루, 너도 그 점은 인지해 주었으면 해."
84300300200-94 = "흐응……."
84300300200-95 = "뭐, 좋을 대로 하라고. 하지만 딱히 챙겨주는 건 없을 거야. 거치적거리는 건 질색이거든."
84300300200-96 = "걱정하지 않아도 돼. 그러잖아도 네루 너와는 아예 다른 작전 루트로 짤 생각이거든."
84300300200-97 = "그녀는 우리와 달리 엑스포 회장, 즉 양지에서 편하게 다닐 수 있어. 의심을 사지 않으니, 딱히 위험에 노출시키지 않으면서도 상당량의 정보를 얻을 수 있지."
84300300200-98 = "원래도 행사에 초대받은 입장이니, 그곳을 돌며 수상해 보이는 것들을 확인하고 보고해 줘."
84300300200-99 = "그 사이 네루와 나는 뒤편에서, 데이터 센터 등을 조사하며 수면 아래 쪽을 조사할 거야."
84300300200-100 = "말하자면 양동작전. 이 정도면 원하는 바로 괜찮겠지?"
84300300200-105 = "……."
84300300200-106 = "왜, 불만이야? 별로 재미없을 거 같아?"
84300300200-107 = "말해 두지만, 지금 우린 딱히 장난치거나 놀러 다니는 게 아니거든?"
84300300200-108 = "아니요. 말씀 주신 대로, 저 또한 그게 가장 맞는 길이라는 생각이 드네요. 다소 과한 억지였는데, 들어 주셔서 감사합니다."
84300300200-110 = "좋아. 그럼 이쪽 안건은 그렇게 정리되었고, 그렇다면 이제 그쪽에서 약속을 지킬 차례네."
84300300200-111 = "박스에서 들었던, 그들의 목적에 대해서 말해주겠어?"
84300300200-112 = "네. 사실 저 또한 아직 그들이 누군지 모르고, 계획들을 자세하게 들은 건 아니지만……."
84300300200-113 = "최소한 목표와 수단에 대해서는 명확하게 들었으니까요."
84300300200-114 = "그들의 목적, 그것은 바로……."
84300300200-115 = "……."
84300300200-116 = "……."
84300300200-121 = "<밀레니엄 엑스포의 파국>입니다."
