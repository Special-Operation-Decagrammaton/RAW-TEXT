[translation]
1001902-1 = "비닉"
1001902-2 = "트리니티 시가지"
1001902-3 = "(좌표를 해석해서 찾아갔더니, 트리니티 학원의 번화한 거리였다.)"
1001902-4 = "……."
1001902-5 = "왔구나, 선생님."
1001902-6 = "……. 그 표정은 뭐야? 이렇게 사람많은 곳에서 보자고 해서?"
1001902-7 = "무슨 비밀 장소라도 기대한 거야? 아쉽지만 트리니티 학원 안에 비밀 장소라는 건 없어."
1001902-8 = "언제 어느 때라도 도청, 미행, 감시가 붙어 있다고 해도 과언이 아냐. 여긴 독사굴 같은 곳이니까."
1001902-9 = "[s1] \"독사굴…….\"\n[s2] \"너무 매정한 평가인데…….\""
1001902-10 = "선생이야 말로 너무 무른 거야."
1001902-11 = "선생이야 말로 너무 무른 거야."
1001902-12 = "안전한 곳이라면 이렇게 넓고 사람이 많고, 누구도 우리를 눈여겨 보지 않는 곳이 딱 적당해."
1001902-13 = "즉, 나무를 숨기려면 숲에. 그런 이야기야."
1001902-14 = "봐, 실제로 누구도 우리를 눈여겨 보지 않잖아?"
1001902-16 = "어? 그 귀여운 전학생이다?"
1001902-17 = "어른이야! 누구지?"
1001902-18 = "소문의 바로 그……?"
1001902-19 = "……."
1001902-20 = "……."
1001902-21 = "[s3] \"아즈사는 눈에 띄니까…….\"\n[s4] \"내가 눈에 띄니까…….\""
1001902-22 = "아냐…… 기도비닉하는 걸 잊었어……. 좀 더 인파에 녹아들 수 있는 방법을 시도했어야……."
1001902-23 = "아냐…… 기도비닉하는 걸 잊었어……. 좀 더 인파에 녹아들 수 있는 방법을 시도했어야……."
1001902-24 = "아니! 그렇다고 해도 지금 나나 선생이 딱히 눈에 띄는 복장은 아닌데……!"
1001902-25 = "……이 학원은 왜 이렇게 타인에게 관심이 많은 거야?!"
1001902-26 = "[s] \"나한테 화를 내도…….\""
1001902-27 = "이, 일단 이쪽으로 와!"
1001902-29 = "……이쯤이면 괜찮겠지."
1001902-30 = "저격이나 도청, 미행을 피할 수 있는 장소는 여기 정도……."
1001902-31 = "후우……. 그치만 잠시라도 긴장을 풀면 안 돼. 그랬다간 바로……."
1001902-32 = "[s] \"앗! 저기 길리슈트를 입고 은폐한 사람이!\""
1001902-37 = "(철컥)"
1001902-39 = "(타타타타타타타타타탕-!!)"
1001902-44 = "……."
1001902-45 = "[s] \"……….\""
1001902-46 = "……음."
1001902-47 = "아냐, 저건 그냥 수풀이 바람이 흔들린 거야. 선생님."
1001902-48 = "[s] \"죄송합니다. 농담이었습니다.\""
1001902-49 = "……."
1001902-51 = "……뭐, 선생님이 하고 싶었던 말이 뭔진 알아."
1001902-52 = "너무 무리하며 긴장할 필요는 없다, 요컨대 그런 말이겠지."
1001902-53 = "하지만 아까 같은 농담은 자제해 줘. 잘못했다가 선생님이 다칠 수도 있으니까."
1001902-54 = "[s] \"죄송합니다…….\""
1001902-55 = "……나는 이곳을 믿고 있지 않아."
1001902-56 = "낯선 곳. 낯선 사람들. 낯선 생활……. 긴장하는 것도 어쩔 수 없는 거야."
1001902-57 = "오히려 나에겐 여기 학생들이 너무 긴장이 없는 걸로 보여."
1001902-58 = "목숨은 하나일 텐데 어째서 이렇게까지 여유가 넘치지? 다들 바보 아냐? 솔직히 그런 감상이야."
1001902-59 = "하지만 분명 이 곳에선 내가 이상한 쪽이겠지…… 그 정도의 인식은 있어."
1001902-60 = "그러니까 선생님이 날 좀 도와주었으면 하는데."
1001902-61 = "……오늘 불러낸 것도 그런 이유니까."
1001902-62 = "[s] \"어떻게 도우면 될까?\""
1001902-63 = "일단은……"
1001902-64 = "이곳에 적응하고 싶어."
1001902-65 = "난 여기에 대해서는 아무것도 모르니까……."
1001902-66 = "[s5] \"트리니티 관광 안내 같은 거려나.\"\n[s6] \"그런 거라면 다른 학생들이……\""
1001902-67 = "다른 학생들은 안 돼! 부외자로서의 시선이 필요해."
1001902-68 = "다른 학생들은 안 돼! 부외자로서의 시선이 필요해."
1001902-69 = "다른 트리니티 학생들은 이미 이곳에 익숙해져 있어. 그런 관점으로는 안심할 수 없어."
1001902-70 = "맹점이라는 건 익숙함에서 나오니까. 그리고 그 맹점을 간과하는 것이야 말로……"
1001902-71 = "허점을 찔려 파멸하는, 가장 흔한 패턴이야."
1001902-72 = "그리고…… 선생님이라면 그래도……."
1001902-73 = "[s7] \"좋아, 약속할게.\"\n[s8] \"내일부터 관광 특훈이야.\""
1001902-74 = "……. 알았어."
1001902-75 = "……. 알았어."
1001902-76 = "그럼 다시 연락할게."
1001902-77 = "아, 그리고 통신에서의 비문은, 나는 <펭귄>이야."
1001902-78 = "그리고 선생님은 <오리>."
1001902-79 = "[s] \"오리……? 펭귄……?\""
1001902-80 = "이, 이유 같은 건 딱히 없어! 이유가 있으면 비문이 아니잖아!"
1001902-81 = "……그럼 연락을 기다려."
1001902-83 = "……안녕."
