[translation]
84305100200-11 = "……이거면 좋겠네요."
84305100200-12 = "사이즈도 딱 맞아요."
84305100200-13 = "그거, 챙겨가는 거야? 데이터 센터의 드론들은 열원 감지라 별로 의미 없을 거 같은데."
84305100200-15 = "아니. 그 정도는 이쪽에서 막아줄 수 있어. 카메라에 얼굴이 남지 않는 것만으로도 충분할 거야."
84305100200-16 = "게다가 내부로 진입한 뒤에는…… 거의 대부분의 시간을 따로 움직여야 해. 스스로 몸을 숨길 물건이 있는 편이 좋겠지."
84305100200-17 = "호오."
84305100200-21 = "……? 왜 그렇게 보시죠?"
84305100200-22 = "괜찮겠어? 말은 그렇게 했지만…… 진짜로 혼자 해야 되는 상황인 것 같은데."
84305100200-23 = "뭐…… 어떻게든 되겠죠."
84305100200-24 = "여기서 걱정하는 것보단, 가서 닥치는 상황을 보고 맞게 대응하면 될 거라는 생각이에요."
84305100200-25 = "하……!! 훌륭하잖아. 바로 그 자세야, 그게 필요했어."
84305100200-26 = "좋아, 그럼 가보자고!"
84305100200-27 = "……네."
