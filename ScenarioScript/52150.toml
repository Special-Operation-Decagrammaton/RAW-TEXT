[translation]
52150-1 = "제15화;달콤한 꿈의 끝"
52150-7 = "하아암………."
52150-12 = "피곤해 보이네, 아야메. 어제 잠을 설치기라도 한 거야?"
52150-13 = "응. 꿈을 꾸어서 그런지 잠을 좀 설쳤네."
52150-15 = "저런…… 표정이 안 좋은 걸 보니 나쁜 꿈을 꾼 모양이었나봐."
52150-16 = "아니, 오히려 좋은 꿈이었어."
52150-17 = "백화요란 동아리실에 잔뜩 쌓여 있는 의뢰와 문젯거리가 하나도 남아 있지 않은…… 평화로운 세상의 꿈."
52150-22 = "그런데 어째서 그렇게 괴로운 표정을 짓는 거야?"
52150-26 = "나쁜 꿈은 깨어난 순간 모든 괴로운 감정을 꿈으로 치부하고 잊어버릴 수 있지만……"
52150-27 = "행복한 꿈은 깨어난 순간부터 괴로운 현실을 계속 곱씹어야 하니까."
52150-28 = "오히려 꿈이 그리워 현실을 부정하고 싶어지니까……"
52150-29 = "……라고, 옛날의 어느 영화에서 말하는 걸 들었거든!"
52150-31 = "그때는 알아차리지 못했지만, 아야메의 말이 옳았다."
52150-32 = "나쁜 꿈을 꾸는 것보다 행복한 꿈을 꾸는 편이 더 괴롭게 느껴진다는 것을."
52150-33 = "이 꿈이 현실이 아니라면…… 영원히 깨어나지 않는 편이 더 행복했을 텐데."
52150-49 = "……일어났구나."
52150-55 = "……아야메?"
52150-56 = "[ruby=・]오[/ruby][ruby=・]랜[/ruby][ruby=・]만[/ruby]이야, 나구사."
52150-57 = "어째서 나는 이곳에……"
52150-61 = "그보다 다른 부원들은? [USERNAME] 선생님은?"
52150-62 = "안심해도 괜찮아. 다들 옆 방에 함께 있거든."
52150-63 = "모두 크게 다친 곳은 없는 것 같아. 샬레의 선생님도 잠들어 있긴 하지만 무사해."
52150-67 = "……그럼 지금까지 우리와 함께 있었던 아야메는 네가 아니었던 거야?"
52150-68 = "……오랜만이라니. 그럼 지금까지 나와 함께 있었던 그 아야메는……"
52150-69 = "응. 평범한 허상이었지. 공포를 먹고 사는 백물어가 만들어 낸 그림자."
52150-70 = "공포라니, 나는 그 모습에 공포를 느끼지 않았는데……"
52150-71 = "아니, 그건 그 누구도 아닌 '네가 만들어' 낸 허상이야."
52150-75 = "네가 바라는 완벽한 나를 보면서, 실은 마음속으로 깨닫고 있었을 텐데."
52150-76 = "이건 언제든 깨질 수 있는 달콤한 꿈이라는 걸.#n잔혹한 현실은 눈을 뜨면 바로 보일 거라는 걸."
52150-78 = "아니, 나는 정말로 몰랐어……"
52150-82 = "거짓말!"
52150-83 = "너는 언제나 그랬어! 무지를 핑계로 욕망을 숨긴 채 타인에게 계속 기대왔잖아!"
52150-84 = "언제까지 모른다는 핑계로 다른 사람에게 의지하려 할 셈이야?"
52150-87 = "……그래. 그림자가 한 말이 모두 거짓은 아니었지. 부장 업무를 하던 중 한계를 느끼고 쿠즈노하를 찾아갔다는 말 자체는 사실이야."
52150-88 = "그만큼 당시의 나는 타인의 욕망에 지쳐있었으니까."
52150-91 = "나구사, 나는 줄곧 웃는 표정을 짓고 있었지만 사실은 모두가 혐오스러웠어."
52150-92 = "스스로를 지킬 힘도 없으면서 끊임없이 타인에게 욕망을 발산하는 사람들이."
52150-93 = "입으로 뱉은 바를 행하지도 못하면서 앵무새처럼 대의를 외치는 부원들이."
52150-94 = "걸핏하면 우는 얼굴로 모든 것을 포기하는 네가……"
52150-98 = "……정말로 싫었어."
52150-102 = "그래도 백화요란의 부장으로서 이 현실을 지키기 위해, 내 한계를 넘어서기 위해 쿠즈노하 님을 찾았지만…… 결국 마주한 건 형체 없는 풍문뿐."
52150-103 = "그래서 결심했어. 모든 것을 살펴보는 백귀야행의 대 예언자가 현실에 존재하지 않는 풍문이라면, 괴서를 사용해서라도 이를 현실로 만들어주겠다고."
52150-104 = "내가 모든 곳에 머무를 수 없다면, 모두를 지켜볼 수 있는 눈을 가지게 해달라고."
52150-105 = "안 돼, 아야메…… 그건 누구도 행복해질 수 없는 결말이야. 분명 코쿠리코의 속임수에 넘어가 네가 잘못 생각한 거야."
52150-106 = "아니, 나구사. 너는 몰라."
52150-107 = "내가 어떤 사람이었는지. 내가 어떤 마음을 갖고 있었는지."
52150-108 = "그렇지 않아. 지금이라도 솔직하게 이야기를 나눈다면 서로를 이해할 수 있—"
52150-112 = "달콤한 말로 스스로를 속이는 건 그만둬 줄래?"
52150-113 = "내 진심이 두려워 시선을 돌리고, 제멋대로 상상한 편의주의적인 허상을 나라고 여겼으면서."
52150-114 = "아야메, 나는……"
52150-115 = "어차피 너도 이미 들어 알고 있잖아?"
52150-116 = "처음부터, 나는 너를—"
52150-121 = "[log=아야메 황혼 1]—단 한 번도 친구라고 생각한 적이 없었으니까.[/log]"
52150-126 = "다음화;조화"
