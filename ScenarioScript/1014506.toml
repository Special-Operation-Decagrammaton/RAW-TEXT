[translation]
1014506-1 = "青蝶"
1014506-2 = "[ns] 「適合穿泳裝的地方？」"
1014506-3 = "唔呣。"
1014506-4 = "畢竟特地購置了泳裝。"
1014506-5 = "心裡不免萌生想去其他適宜之地體驗的念頭。"
1014506-6 = "……不行嗎？"
1014506-7 = "[s] 「怎麼可能！」"
1014506-8 = ""
1014506-11 = "[ns] 「你想先去哪裡？儘管說！」"
1014506-12 = "呼呣。"
1014506-13 = "只可惜妾身對這方面的見識實在有限。"
1014506-14 = "老師想必會比妾身更加了解才是。"
1014506-15 = "因此本次的行程，就全權交由老師安排了。"
1014506-17 = "（聽完妃姬的話之後，把想得到的地點全部列了出來！）"
1014506-21 = "海邊……是嗎。"
1014506-22 = "確實僅在傳聞中聽過……"
1014506-23 = "也確實如傳聞所言呢。"
1014506-24 = "[s] 「如傳聞所言？」"
1014506-25 = "還真熱啊。"
1014506-26 = "鹽的氣味隨風而來，日光亦十分強烈。"
1014506-27 = "這異樣的黏滯感，想必是汗水與鹽分完美交融的產物吧。"
1014506-28 = "與江水截然不同的獨特氣息……這便是大海獨有的氣味嗎。"
1014506-29 = "被烈日曬得滾燙的白沙，若不慎以赤足踏入恐有燙傷之虞。"
1014506-30 = "此處著實令人印象深刻……應該會長久停留在妾身的記憶之中吧。"
1014506-31 = "[s] 「您似乎……相當不悅呢，門主大人？」"
1014506-32 = "唔呣。"
1014506-33 = "若汝親自為妾身塗抹那所謂的「防曬乳」，說不定便能釋懷許多吧？"
1014506-35 = "（只好細心地為妃姬塗上了防曬乳……）"
1014506-36 = ""
1014506-37 = "這便是海水……"
1014506-38 = ""
1014506-40 = ""
1014506-41 = "……確實相當鹹呢。"
1014506-42 = "與平日相比，身體似乎更易浮於水面。"
1014506-43 = "……"
1014506-44 = "那麼，老師。妾身已備妥雙人泳圈，與妾身一同乘坐如何？"
1014506-45 = "嗯？泳圈有可能隨浪而去，老師在外側穩住泳圈較為妥當？"
1014506-46 = "……"
1014506-47 = "這倒也是。那麼此事便有勞汝了。"
1014506-48 = "話雖如此……"
1014506-49 = "妾身本想與老師共乘泳圈的啊……"
1014506-52 = "哦哦……在搖晃呢。這便是海浪啊……"
1014506-53 = "確實有與江水不同的情致呢。#n大海……大海啊……呵呵。"
1014506-54 = "那是名為海鷗的鳥類對吧？#n自不久之前便在吾等頭頂盤旋不去……"
1014506-55 = "那是在向吾等索取糧食，然而絕不能如願奉上……？這又是為何？"
1014506-56 = "原，原來如此。#n海鷗生性兇悍……若給予其一，便會為欲奪其二而愈發殘暴嗎。"
1014506-57 = "這可真是……無論人和獸皆難以知足，實在教人憂心啊。"
1014506-59 = "此處便是久聞其名的「海之家」嗎。#n呼呣，呼呣。"
1014506-60 = "刨冰、炒麵、烤玉米以及各式汽水……"
1014506-61 = "……"
1014506-62 = "由於曾在玄武商會見過，妾身尚能理解觀光地物價稍高一事……"
1014506-63 = "……然而若是玄武商會的孩子造訪此處，恐怕會為了不符價格的品質而大發雷霆。"
1014506-64 = "不過就連這點在內，或許也是所謂「大海風情」的一部分吧。"
1014506-65 = "那麼老師，妾身就不客氣了。"
1014506-67 = "水上樂園……簡直是休閒建築工學的結晶啊！"
1014506-68 = "與之相關的傳聞，妾身亦早有耳聞。呼呣，呼呣……"
1014506-69 = "妾身最想先行嘗試的，果然還是所謂的「滑水道」吧！"
1014506-71 = ""
1014506-72 = ""
1014506-75 = "呀啊啊啊啊啊啊啊啊！？！？"
1014506-78 = "多謝汝接住妾身，老師……"
1014506-80 = ""
1014506-81 = "哦？竟還設有供人歇息的溫水池嗎？"
1014506-82 = "來得正是時候。妾身剛好覺得身體略有涼意呢。"
1014506-83 = "[s] 「去泡一下暖暖身體吧。」"
1014506-84 = "老師何出此言？"
1014506-85 = "汝應當與妾身同行才是。"
1014506-86 = "[ns]「！？！？」"
1014506-88 = "（就這樣被妃姬拉著，一同泡進了溫水池……）"
1014506-89 = "（不停喊冷的妃姬，將身體靠得比平時更近了一些……）"
1014506-91 = "哦哦，是造浪池呢。"
1014506-92 = "妾身雖已親身體會過海浪，但人工所造的巨浪啊……"
1014506-93 = "於可控環境之下刻意營造的危險要素，總是能產生名為刺激感的樂趣呢。"
1014506-94 = "各位來賓請看！海底火山就在剛才爆發了！"
1014506-95 = "在那爆發的餘波之下……海嘯即將席捲而來！"
1014506-96 = "本水上樂園的最大浪高為2.4m。請注意安全，避免發生意外。"
1014506-97 = "好……儘管來吧！"
1014506-98 = ""
1014506-100 = ""
1014506-102 = "哇啊啊啊！？"
1014506-103 = "（勉強抓住了被大浪捲走的妃姬！）"
1014506-104 = "多，多謝了，老師……"
1014506-105 = "問妾身有無大礙嗎？妾身自是無恙。#n畢竟老師不是已將妾身穩穩護住了嗎。"
1014506-106 = "且慢……？"
1014506-107 = "……"
1014506-108 = "呵呵。妾身想再體驗一回，老師不介意吧？"
1014506-109 = "[s1] 「也不是不行……」\n[s2] 「不過要小心點哦？」"
1014506-112 = "妾身自會多加留意。"
1014506-113 = "然而若是能被老師屢屢接住，倒也未嘗不是一樁樂事呢。"
1014506-114 = "──請注意安全，避免發生意外。"
1014506-115 = ""
1014506-117 = ""
1014506-118 = ""
1014506-120 = "（看起來妃姬似乎在造浪池玩得特別開心……）"
1014506-122 = "呼……"
1014506-123 = "[ns] 「玩得開心嗎？」"
1014506-124 = "是啊。確實……"
1014506-125 = "……確實是令人無比難忘的一日。"
1014506-126 = "老師的這番恩情，妾身實在感激不盡。"
1014506-127 = "即便下一刻便是終結……妾身似乎也了無遺憾。"
1014506-128 = "[s] 「咦……？」"
1014506-129 = "呵呵，老師為何露出那般神情。"
1014506-130 = "剛才那不過是隨口說說的玩笑罷了，無須如此掛心。"
1014506-131 = "只是細細回味起今日的種種……"
1014506-132 = "妾身不禁想起了山海經流傳的一則故事。"
1014506-133 = "[s] 「那是什麼樣的故事？」"
1014506-134 = "故事的內容是這樣的。"
1014506-135 = "從前有位少女以求學為志，然而卻受到了家族的反對。"
1014506-136 = "於是少女暗中「變裝」離家，進入了某間學堂……投身於朝思暮想的學問之中。"
1014506-137 = "在此期間，少女與一名同窗好友格外親近……"
1014506-138 = "二人立下誓言，約定無論未來的命運如何發展，都絕不辜負彼此的所學與回憶。"
1014506-139 = "然而……少女終究被家族尋獲，並在長輩的逼迫下放棄學業與人成婚。"
1014506-140 = "那位同窗之友則因過度思念而積鬱成疾……踏上了永遠無法歸來的道路。"
1014506-141 = "到了成婚之日，少女在迎親隊伍中發現了同窗的墳塚……不禁悲從中來，放聲慟哭。"
1014506-142 = "此時墳塚突然開啟……二人化作一對蝴蝶，雙雙飛向了無人知曉的遠方。"
1014506-143 = "[s3] 「真是意味深長的故事呢……」\n[s4] 「不過……為什麼會想起這個故事？」"
1014506-146 = "倒也沒什麼。只是「一對蝴蝶」在山海經別有幾分寓意罷了。"
1014506-147 = "比如此刻身穿「泳裝」的妾身，在老師的引領下造訪了「適合身穿泳裝的場所」。"
1014506-148 = "那麼某種意義上……如今的妾身不也進行了「變裝」嗎？"
1014506-149 = "既然學生以學習為本，視其以求學為志也未嘗不可。"
1014506-150 = "[s] 「這麼說好像也沒錯……？」"
1014506-151 = "呼呣，汝的反應竟是如此啊。"
1014506-152 = "也罷。對汝而言，這般程度或許恰到好處吧。"
1014506-153 = "不過，老師最好將此事銘記於心。"
1014506-154 = "青蝶在山海經之中，有時也象徵著不滅。"
1014506-155 = "換言之……青蝶亦帶有「永不言棄」之意。"
1014506-156 = ""
1014506-157 = "（雖然妃姬說的話依舊令人一頭霧水……）"
1014506-158 = ""
1014506-160 = ""
1014506-162 = "（不過訴說著這些話的妃姬，看起來似乎比平時多了幾分愉快與純真……）"
