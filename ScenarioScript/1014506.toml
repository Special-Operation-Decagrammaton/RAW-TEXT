[translation]
1014506-1 = "ผีเสื้อสีน้ำเงิน"
1014506-2 = "[ns] \"สถานที่ที่เหมาะกับชุดว่ายน้ำเหรอ?\""
1014506-3 = "ใช่"
1014506-4 = "ในเมื่อได้ซื้อชุดว่ายน้ำมาแล้ว"
1014506-5 = "เราเลยอยากลองไปยังสถานที่อื่น ที่สามารถใส่ชุดว่ายน้ำแล้วสนุกได้เช่นกัน"
1014506-6 = "ไม่ได้หรือ...?"
1014506-7 = "[s] \"ได้แน่นอนอยู่แล้ว!\""
1014506-8 = ""
1014506-11 = "[ns] \"อยากไปที่ไหนก่อนล่ะ? บอกมาได้เลย!\""
1014506-12 = "อืม"
1014506-13 = "น่าเสียดายที่เรื่องเช่นนั้น เรายังมีความรู้น้อยนัก"
1014506-14 = "หากเป็นครู คงรู้จักสถานที่ต่างๆ ดีกว่าเรา ใช่มั้ยเล่า?"
1014506-15 = "เช่นนั้นคราวนี้เราจะฝากทุกก้าวย่างไว้กับครู"
1014506-17 = "(เมื่อได้ยินคำพูดของคิซากิ สถานที่ต่างๆ ก็ผุดขึ้นมาในหัวของคุณครู!)"
1014506-21 = "ทะเล... อย่างนั้นหรือ "
1014506-22 = "นี่สินะ สถานที่ที่เราเคยได้ยินแต่คำร่ำลือ..."
1014506-23 = "เป็นอย่างที่ได้ยินมาจริงๆ ด้วย"
1014506-24 = "[s] \"อย่างที่ได้ยินมาเหรอ?\""
1014506-25 = "ช่างร้อนเสียจริง"
1014506-26 = "เราสัมผัสได้ถึงกลิ่นไอเค็มในสายลม และแสงแดดก็แรงกล้านัก "
1014506-27 = "ความรู้สึกเหนียวเหนอะหนะเป็นพิเศษนี้ คงเป็นผลลัพธ์จากเหงื่อและเกลือที่ผสมผสานกันอย่าง#nลงตัวสินะ"
1014506-28 = "กลิ่นคาวเฉพาะตัวที่ไม่เหมือนกับกลิ่นคาวน้ำทั่วไป... นี่คือกลิ่นของทะเลอย่างนั้นหรือ"
1014506-29 = "หาดทรายขาวที่ร้อนระอุถึงเพียงนี้ หากย่ำเท้าเปล่าลงไป ก็อาจถึงขั้นผิวไหม้ได้เลย"
1014506-30 = "หากถามว่าน่าประทับใจหรือไม่ ก็นับว่าน่าประทับใจอยู่ อย่างน้อยก็คงอยู่ในความทรงจำไปอีกนาน#nทีเดียว"
1014506-31 = "[s] \"ท่านประมุข... รู้สึกไม่สบอารมณ์หรือเปล่า?\""
1014506-32 = "อืม"
1014506-33 = "หากคุณช่วยทาสิ่งที่เรียกว่า 'ครีมกันแดด' ให้เรา อารมณ์ขุ่นมัวนี้อาจจะหายไปโดยง่ายก็เป็นได้"
1014506-35 = "(สุดท้ายคุณครูก็ทาครีมกันแดดให้คิซากิอย่างตั้งอกตั้งใจ...)"
1014506-36 = ""
1014506-37 = "นี่หรือน้ำทะเล..."
1014506-38 = ""
1014506-40 = ""
1014506-41 = "เค็มจริงๆ ด้วย..."
1014506-42 = "แต่ก็รู้สึกเหมือนร่างกายลอยขึ้นได้ง่ายกว่าปกติเลย"
1014506-43 = "..."
1014506-44 = "ถ้าเช่นนั้น ครู เราเตรียมห่วงยางสำหรับ 2 คนไว้แล้ว จะขึ้นด้วยกันหรือไม่?"
1014506-45 = "หืม? ห่วงยางอาจลอยออกไปได้ ครูก็เลยคิดว่าควรจับห่วงยางไว้จากด้านนอกอย่างนั้นหรือ?"
1014506-46 = "..."
1014506-47 = "ก็เป็นความเห็นที่สมเหตุสมผล ถ้าเช่นนั้น เราฝากด้วยนะ"
1014506-48 = "แต่ว่า..."
1014506-49 = "เราเองก็อยากขึ้นห่วงยางนี้ไปพร้อมกับครูเหมือนกัน..."
1014506-52 = "โอ้... โคลงเคลงจัง นี่คือสิ่งที่เรียกว่าคลื่นสินะ..."
1014506-53 = "ทะเล... ทะเล... บรรยากาศช่างต่างจากสายน้ำในแม่น้ำโดยสิ้นเชิงเลย"
1014506-54 = "นกตัวนั้น... เรียกว่านกนางนวลใช่หรือไม่? มันบินวนอยู่เหนือพวกเรามาตั้งแต่เมื่อครู่แล้ว..."
1014506-55 = "หืม? มันกำลังเรียกร้องของกินอย่างนั้นหรือ? แล้วก็... ห้ามให้อะไรเด็ดขาด? เหตุใดจึงเป็นเช่นนั้นเล่า?"
1014506-56 = "ขะ... เข้าใจแล้ว เพราะนกนางนวลค่อนข้างดุ หากให้ไปหนึ่งชิ้น มันก็จะยิ่งก้าวร้าวขึ้นเพื่อแย่ง#nชิ้นที่สองสินะ"
1014506-57 = "ช่างน่าห่วงเสียจริง ไม่ว่ามนุษย์หรือสัตว์ ต่างก็ไม่รู้จักวิธีที่จะพอใจเลย"
1014506-59 = "ที่นี่คือ 'ร้านริมทะเล' ที่เราเคยแต่ได้ยินมาสินะ โอ้ว"
1014506-60 = "น้ำแข็งไส ยากิโซบะ ข้าวโพดย่าง แล้วก็เครื่องดื่มโซดานานาชนิด อืม"
1014506-61 = "..."
1014506-62 = "เรื่องราคาในสถานที่ท่องเที่ยวที่ค่อนข้างแพงนั้น เราเองก็พบเห็นได้เป็นครั้งคราวในย่านการค้า#nเทพเต่าดำ เราเลยพอเข้าใจอยู่..."
1014506-63 = "แต่หากเด็กๆ จากย่านการค้าเทพเต่าดำมาอยู่ที่นี่ ก็คงหัวเสียแล้วบอกว่า \"ราคาแบบนี้กับคุณภาพระดับนี้ยอมรับไม่ได้\" ก็เป็นได้"
1014506-64 = "ทว่าแม้แต่เรื่องนั้น ก็คงนับเป็นรสชาติอย่างหนึ่งของทะเลสินะ "
1014506-65 = "เช่นนั้น ครู เราจะขอกินให้อร่อยเลย"
1014506-67 = "สวนน้ำ... นี่คือแก่นแท้แห่งการออกแบบสถาปัตยกรรมเพื่อการพักผ่อนอย่างแท้จริง!"
1014506-68 = "หากเป็นพวกข่าวลือ เราเองก็ได้ยินมามากอยู่ อืม... อืม..."
1014506-69 = "เห็นทีต้องเริ่มจากสิ่งที่เรียกว่า 'สไลเดอร์น้ำ' ก่อนสินะ!"
1014506-71 = ""
1014506-72 = ""
1014506-75 = "ว้ายยยยยยยยยย??!!"
1014506-78 = "ขอบคุณที่ช่วยรับเราไว้นะ ครู..."
1014506-80 = ""
1014506-81 = "โอ้? ที่นี่มีสระน้ำอุ่นสำหรับพักผ่อนด้วยหรือ?"
1014506-82 = "ประจวบเหมาะพอดี เรากำลังรู้สึกว่าร่างกายเย็นลงเล็กน้อยอยู่พอดี"
1014506-83 = "[s] \"ไปทำให้ร่างกายอุ่นขึ้นเถอะ ไม่ต้องรีบนะ\""
1014506-84 = "พูดอะไรเช่นนั้น ครู"
1014506-85 = "ครูเองก็ควรไปด้วยกันสิ"
1014506-86 = "[ns] \"??!!\""
1014506-88 = "(สุดท้ายคุณครูก็ถูกคิซากิพาไปแช่สระน้ำอุ่นด้วยกัน...)"
1014506-89 = "(คิซากิเอาแต่บอกว่าหนาว และขยับตัวเข้ามาแนบชิดกว่าปกติ...)"
1014506-91 = "โอ้ ส่วนนี่คือสระคลื่นสินะ"
1014506-92 = "คลื่นทะเลนั้นเราได้ลองสัมผัสมาแล้ว แต่นี่คือคลื่นลูกใหญ่ที่สร้างขึ้นด้วยฝีมือมนุษย์อย่างนั้นหรือ..."
1014506-93 = "ปัจจัยเสี่ยงที่จงใจสร้างขึ้นในสถานการณ์ที่ควบคุมได้ ย่อมนำมาซึ่งความสนุกที่เรียกว่าความตื่นเต้น#nเร้าใจสินะ"
1014506-94 = "เชิญชมครับ ทุกท่าน! ภูเขาไฟใต้ทะเลปะทุขึ้นมาแล้วครับ!"
1014506-95 = "และผลจากแรงปะทุนั้น... คลื่นยักษ์กำลังจะซัดเข้ามาในไม่ช้าครับ! "
1014506-96 = "คลื่นของสวนน้ำแห่งนี้สูงได้มากถึง 2.4 เมตร ระมัดระวังอุบัติเหตุด้วยนะครับ"
1014506-97 = "ดีละ... เข้ามาเลย!"
1014506-98 = ""
1014506-100 = ""
1014506-102 = "อ๊ายยย?!"
1014506-103 = "(คุณครูคว้าตัวคิซากิที่ถูกคลื่นซัดไปเต็มๆ ไว้ได้อย่างหวุดหวิด!)"
1014506-104 = "ขะ... ขอบคุณนะ ครู..."
1014506-105 = "เราเป็นเช่นไรบ้างน่ะหรือ? ไม่เป็นไรเลย ก็ครูช่วยคว้าเราไว้นี่นา"
1014506-106 = "เดี๋ยวก่อน...?"
1014506-107 = "..."
1014506-108 = "ฮุฮุ เราอยากลองโต้คลื่นอีกสักครั้ง จะได้หรือไม่?"
1014506-109 = "[s1] \"ก็ไม่ใช่ว่าไม่ได้หรอก...\"\n[s2] \"แต่ว่า ระวังหน่อยนะ?\""
1014506-112 = "อืม เราจะระมัดระวัง"
1014506-113 = "หากครูคอยคว้าเราไว้เช่นนี้ทุกครั้ง ก็อาจเป็นเรื่องน่ายินดีก็ได้"
1014506-114 = "กรุณาระมัดระวังอุบัติเหตุด้วยครับ"
1014506-115 = ""
1014506-117 = ""
1014506-118 = ""
1014506-120 = "(คิซากิดูเหมือนจะสนุกกับสระคลื่นจริงๆ...)"
1014506-122 = "ฮู่ว..."
1014506-123 = "[ns] \"สนุกมั้ย?\""
1014506-124 = "อืม สนุกจริงๆ..."
1014506-125 = "เป็นวันที่จะอยู่ในความทรงจำของเราไปอีกนานเลย"
1014506-126 = "ไม่ว่าเราจะขอบคุณครูมากเพียงใด ก็คงยังไม่เพียงพออยู่ดี"
1014506-127 = "ถึงขนาดที่ว่า ต่อให้ทุกสิ่งจบลงเช่นนี้ในทันที เราก็คงไม่เหลือสิ่งใดให้ค้างคาใจแล้ว"
1014506-128 = "[s] \"หืม...?\""
1014506-129 = "ฮุฮุ เหตุใดจึงทำสีหน้าเช่นนั้นเล่า ครู"
1014506-130 = "เราแค่หยอกเล่น อย่าใส่ใจถึงเพียงนั้นเลย"
1014506-131 = "แต่ว่า พอนึกถึงเรื่องราวที่เกิดขึ้นตลอดวันนี้แล้ว..."
1014506-132 = "เราก็นึกถึงเรื่องเล่าเรื่องหนึ่งที่สืบทอดกันในซานไห่จิงขึ้นมา"
1014506-133 = "[s] \"เรื่องเล่าแบบไหนเหรอ?\""
1014506-134 = "เรื่องเป็นเช่นนี้"
1014506-135 = "มีเด็กสาวผู้หนึ่ง เป็นเด็กผู้ใฝ่เรียน ทว่าคนในตระกูลกลับคัดค้านความฝันของเด็กสาวคนนั้น"
1014506-136 = "เด็กสาวจึงลอบ 'ปลอมตัว' แล้วออกเดินทาง เธอได้เข้าเรียนในสำนักแห่งหนึ่ง... และทุ่มเทให้กับการศึกษาที่ตนปรารถนามาโดยตลอด"
1014506-137 = "ระหว่างนั้น เด็กสาวก็สนิทสนมกับสหายร่วมสำนักคนหนึ่งเป็นพิเศษ..."
1014506-138 = "ทั้งสองให้คำมั่นสัญญากันว่า ไม่ว่าอนาคตแบบใดจะมาเยือน ก็จะไม่ทอดทิ้งการเรียน#nและความทรงจำของตน"
1014506-139 = "ทว่า... ในที่สุดตระกูลของเด็กสาวก็พบที่อยู่ของเธอจนได้ เด็กสาวจึงถูกบีบให้เลิกเรียน และแต่งงานตามความประสงค์ของผู้ใหญ่ในตระกูล"
1014506-140 = "ส่วนสหายร่วมสำนักผู้นั้นก็คิดถึงเด็กสาวมาก... มากเสียจนล้มป่วย... และจากไปสู่เส้นทางที่ไม่มีวันหวนกลับ"
1014506-141 = "และในวันแต่งงาน ระหว่างขบวนพิธี เด็กสาวก็พบหลุมศพของสหายผู้นั้น... เธอไม่อาจทนต่อความโศกเศร้า จึงร่ำไห้ออกมาอย่างสุดเสียง"
1014506-142 = "ในชั่วขณะนั้น หลุมศพก็เปิดออก และทั้งสองก็กลายเป็นผีเสื้อ โบยบินจากไปยังที่ใดสักแห่ง"
1014506-143 = "[s3] \"เป็นเรื่องที่มีความหมายลึกซึ้งจังเลยนะ...\"\n[s4] \"แต่ว่า... ทำไมถึงเล่าเรื่องนั้นขึ้นมาล่ะ?\""
1014506-146 = "ไม่ใช่เรื่องใหญ่อันใดหรอก เพียงแต่ในซานไห่จิงนั้น 'ผีเสื้อคู่' มีความหมายพิเศษกว่านั้นเล็กน้อย"
1014506-147 = "อย่างเช่น ตอนนี้เรากำลังใส่ 'ชุดว่ายน้ำ' อยู่ และอาจกล่าวได้ว่า เราตั้งใจมายัง 'สถานที่ที่เหมาะกับชุดว่ายน้ำ' ตามการแนะนำของครู"
1014506-148 = "ในแง่หนึ่ง นี่ก็ถือเป็นตัวเราที่ต่างจากยามปกติ... หรือก็คือ ตัวเราที่ปลอมตัวอยู่ไม่ใช่หรือ?"
1014506-149 = "อีกทั้งหน้าที่หลักของนักเรียนคือการเล่าเรียน หากมองอีกแง่ นักเรียนก็อาจตีความได้ว่าเป็น 'เด็กผู้ใฝ่เรียน' เช่นกัน"
1014506-150 = "[s] \"จะว่าอย่างนั้นก็ได้นะ...?\""
1014506-151 = "หืม ตอบสนองเช่นนั้นเองหรือ?"
1014506-152 = "เอาเถิด ไม่เป็นไร สำหรับครูแล้ว บางทีเข้าใจแค่นั้นก็อาจพอดีแล้วก็เป็นได้"
1014506-153 = "แต่ว่า เรื่องนี้ครูจดจำไว้สักหน่อยก็คงไม่เสียหาย"
1014506-154 = "ในซานไห่จิง ผีเสื้อสีน้ำเงินบางครั้งก็สื่อถึงความเป็นนิรันดร์"
1014506-155 = "นั่นหมายความว่า ผีเสื้อสีน้ำเงินนั้น... มีความหมายว่าไม่ยอมแพ้ง่ายๆ เช่นกัน"
1014506-156 = ""
1014506-157 = "(แม้คุณครูจะยังไม่ค่อยเข้าใจคำพูดของคิซากิ...)"
1014506-158 = ""
1014506-160 = ""
1014506-162 = "(แต่ก็รับรู้ได้ว่าคิซากิที่เล่าเรื่องแบบนั้น ดูสนุกและไร้เดียงสามากกว่าปกติอย่างเห็นได้ชัด...)"
