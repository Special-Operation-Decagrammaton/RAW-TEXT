[translation]
1014506-1 = "푸른 나비"
1014506-2 = "[ns] \"수영복이 어울리는 장소?\""
1014506-3 = "음."
1014506-4 = "이왕 수영복을 구매한 김에 말이다."
1014506-5 = "다른 수영복을 입고 즐길 수 있는 장소에도, 가 보고 싶다는 마음이 들었다."
1014506-6 = "……안 되는가?"
1014506-7 = "[s] \"그럴 리가 없잖아!\""
1014506-11 = "[ns] \"어디부터 갈래? 말만 해!\""
1014506-12 = "음."
1014506-13 = "아쉽게도 그런 부분에서는 나의 앎이 부족해서 말이다."
1014506-14 = "선생이라면, 분명 나보다도 그런 장소에 대해서는 잘 알고 있겠지?"
1014506-15 = "하여, 여기에서는 선생에게 모든 행보를 맡기도록 하겠다."
1014506-17 = "(키사키의 말을 듣고, 생각나는 행선지를 모조리 떠올렸다!)"
1014506-21 = "바다…… 로구나."
1014506-22 = "그야말로, 말로만 듣던……."
1014506-23 = "확실히, 듣던 대로."
1014506-24 = "[s] \"듣던 대로?\""
1014506-25 = "덥구나."
1014506-26 = "바람에 소금기가 느껴지고, 햇살도 강렬하다."
1014506-27 = "이 유달리 끈적끈적한 기분은, 분명 땀과 소금이 조화롭게 섞인 결과물일 테지."
1014506-28 = "물비린내와는 다른 특유의 비린내…… 이것이 바다 냄새라는 것인가."
1014506-29 = "달구어질 대로 달구어진 백사장은, 자칫 맨발로 디뎠다가는 화상을 입을 수도 있을 것 같구나."
1014506-30 = "확실히, 인상적이라면 인상적인 곳이다. 적어도 기억에는 오래도록 남을 듯하다."
1014506-31 = "[s] \"심기가 많이…… 불편하십니까, 문주님?\""
1014506-32 = "음."
1014506-33 = "그대가 '선크림' 이라는 것을 직접 발라 준다면, 쉽게 풀릴지도 모르겠다만?"
1014506-35 = "(결국 키사키에게 정성스럽게 선크림을 발라 주었다…….)"
1014506-37 = "이것이 바닷물……."
1014506-41 = "……확실히, 짜구나."
1014506-42 = "하지만 어딘가 몸이 더 쉽게 떠오르는 듯한 느낌도 든다."
1014506-43 = "……."
1014506-44 = "그렇다면, 선생. 여기 2인용 튜브를 준비하였으니, 함께 타지 않겠는가?"
1014506-45 = "음? 혹시 튜브가 떠내려가 버릴지도 모르니, 선생이 밖에서 튜브를 붙잡아주어야 할 것 같다고?"
1014506-46 = "……."
1014506-47 = "타당한 의견이구나. 그러면 부탁하겠다."
1014506-48 = "그래도……."
1014506-49 = "나는, 선생과 같이 이 튜브에 타고 싶었다만……."
1014506-52 = "오오……. 흔들리는구나. 이것이 파도……."
1014506-53 = "확실히, 강물과는 완전히 다른 정취가 있구나. 바다, 바다라……."
1014506-54 = "저 새, 갈매기라고 하였지? 조금 전부터 우리 머리 위를 빙빙 돌고 있다만……."
1014506-55 = "흐음? 무언가 먹을 것을 내놓으라는 것이라고? 그리고……. 절대 뭔가를 주면 안 된다? 그것은 어째서인가?"
1014506-56 = "그, 그렇구나. 갈매기는 난폭하니까, 하나를 주면 둘을 뺴앗으려고 더욱 폭력적으로 변한다는 것인가."
1014506-57 = "이것 참, 사람이나 동물이나 좀처럼 만족할 줄을 모르니, 참으로 걱정이다."
1014506-59 = "이곳이 말로만 듣던 '바다의 집'이구나. 호오, 호오."
1014506-60 = "빙수와 야키소바, 옥수수구이에 각종 소다 음료인가. 으흠."
1014506-61 = "……."
1014506-62 = "관광지 가격이 다소 비싼 것이야, 현무상회에서도 이따금 보이는 현상이니 이해하겠다만……."
1014506-63 = "……현무상회 아이들이 이곳에 와 있었다면, 이 가격에 이 퀄리티는 납득할 수 없다며 화를 냈을지도 모르겠구나."
1014506-64 = "하지만 그것까지도 포함하여, 바다의 정취라는 것이겠지."
1014506-65 = "그러면, 선생. 잘 먹도록 하겠다."
1014506-67 = "워터 파크…… 그야말로 휴양 건축 공학의 정수인가!"
1014506-68 = "소문 정도라면 나도 많이 들었다. 으음, 으음……."
1014506-69 = "역시, '워터 슬라이드'라는 것을 가장 먼저 즐겨 보고 싶구나!"
1014506-75 = "와아아아아아아아앗??!!"
1014506-78 = "……잡아 줘서 고맙구나, 선생……."
1014506-81 = "호오? 여기에는 휴식을 위한 온수 풀도 있다는 것인가?"
1014506-82 = "마침 잘 되었구나. 약간 몸이 식었다는 느낌을 받고 있었는데 말이지."
1014506-83 = "[s] \"천천히 몸을 덥히고 와.\""
1014506-84 = "무슨 말인가, 선생."
1014506-85 = "선생도 마땅히 같이 가야 하지 않겠는가."
1014506-86 = "[ns] \"??!!\""
1014506-88 = "(결국 키사키에게 이끌려 온수 풀에 같이 몸을 담갔다…….)"
1014506-89 = "(키사키는 자꾸만 쌀쌀하다며, 평소보다 더 가까이 몸을 붙여 왔다…….)"
1014506-91 = "오오, 파도 풀이로구나."
1014506-92 = "바다에서 파도는 이미 체험해 보았다만, 인공적으로 일으키는 커다란 파도라……."
1014506-93 = "통제된 상황에서의 의도적인 위험 요소는, 스릴이라는 재미 요소를 가져다주기 마련이지."
1014506-94 = "보십시오, 손님 여러분! 지금 막 해저 화산이 폭발했습니다!"
1014506-95 = "그리고 그 여파로…… 금방 해일이 몰려올 것입니다!"
1014506-96 = "본 워터 파크의 최대 파고는 2.4m입니다. 안전사고에 주의해 주십시오."
1014506-97 = "좋다……. 와 보거라!"
1014506-102 = "아아아앗?!"
1014506-103 = "(제대로 파도에 휩쓸린 키사키를, 가까스로 붙잡았다!)"
1014506-104 = "고, 고맙다. 선생……."
1014506-105 = "괜찮냐고? 문제없다. 무엇보다 선생이 이렇게 붙잡아주지 않았는가."
1014506-106 = "가만……?"
1014506-107 = "……."
1014506-108 = "후후. 한 번 더 파도를 타 보고 싶다만, 괜찮겠는가?"
1014506-109 = "[s1] \"안될 건 없긴 한데…….\"\n[s2] \"그래도, 조심하자?\""
1014506-112 = "그래. 선처해 보마."
1014506-113 = "선생이 매번 이렇게 나를 붙잡아준다면, 오히려 기쁜 일일지도 모르겠구나."
1014506-114 = "–안전사고에 주의해 주십시오."
1014506-120 = "(어째서인지 키사키는, 정말로 파도 풀을 즐기는 것 같았다…….)"
1014506-122 = "후우……."
1014506-123 = "[ns] \"잘 놀았어?\""
1014506-124 = "그래. 정말로……."
1014506-125 = "……정말로, 오래 기억에 남을 하루였다."
1014506-126 = "선생에게는 아무리 감사해도, 역시 모자라겠구나."
1014506-127 = "………다음 순간, 이대로 모든 것이 끝난다고 해도…… 여한이 없을 만큼 말이다."
1014506-128 = "[s] \"어……?\""
1014506-129 = "후후. 왜 그런 표정을 하고 있는가, 선생."
1014506-130 = "당연히 그저 해 본 농담이다. 그렇게 신경 쓰지 말거라."
1014506-131 = "하지만 오늘 하루 있었던 일을 생각해 보고 있자니……."
1014506-132 = "산해경에 전해지는, 어떤 이야기가 떠올라서 말이다."
1014506-133 = "[s] \"어떤 이야기?\""
1014506-134 = "그래. 이런 이야기다."
1014506-135 = "학문에 뜻을 둔 한 소녀가 있었다. 하지만 집안에서는 그 소녀의 꿈을 반대했지."
1014506-136 = "그래서 소녀는 몰래 '변장'하고 길을 떠나, 어떤 학당에 입학하여…… 그토록 하고 싶었던 공부에 전념했다."
1014506-137 = "그러던 중에, 같이 동문수학하던 한 명의 동기와도 유난히 가까워져……."
1014506-138 = "둘은 어떤 미래가 다가오더라도, 자신들의 학문과 추억을 저버리지 말자고, 깊은 약속을 맺었다."
1014506-139 = "그러나…… 마침내 소녀의 집에서, 소녀의 행방을 찾아내고야 말았다. 소녀는 문중 어른들의 뜻에 따라, 학문을 그만두고 혼인을 강요받았지."
1014506-140 = "그리고 같이 학습하던 동기는, 소녀가 너무 그리웠던 나머지, 건강을 잃고……. 두 번 다시 돌아올 수 없는 길로, 떠나고야 말았다."
1014506-141 = "그리고 소녀는 결혼식 날, 혼례 행렬에서 동기의 무덤을 발견하고…… 비통함을 이기지 못해 목 놓아 울고 말았다."
1014506-142 = "그 순간 무덤이 열리고, 두 사람은 나비가 되어 어딘가로 훨훨 날아갔다고 하더구나."
1014506-143 = "[s3] \"의미 깊은 이야기네…….\"\n[s4] \"그런데…… 그 이야기는 어째서?\""
1014506-146 = "대단한 것은 아니다. 단지 산해경에서 '한 쌍의 나비'에는, 조금 더 특별한 의미가 있어서 말이지."
1014506-147 = "가령 지금의 나는 '수영복'을 입고 있다. 그리고 '수영복한 장소'에 선생의 안내를 따라 특별히 와 있다고도 할 수 있겠지."
1014506-148 = "그것은 어떤 의미로 평소의 나와는 다른…… 변장한 나라고도 볼 수 있지 않겠는가?"
1014506-149 = "또한 학생의 본분은 공부이니, 학생이란 어떻게 보면 학문에 뜻을 둔 아이라고도 해석할 수 있을 것이고."
1014506-150 = "[s] \"그건 그럴 수도 있겠지……?\""
1014506-151 = "흐음. 그런 반응인 것인가."
1014506-152 = "뭐어, 좋다. 그대는 어쩌면 그 정도가 딱 좋은 것일지도 모르겠구나."
1014506-153 = "하지만, 이 정도는 기억해 둬도 좋을 것이다, 선생."
1014506-154 = "산해경에서 푸른 나비는, 때로 불멸을 뜻하기도 한다."
1014506-155 = "그 말은, 푸른 나비는…… 웬만해서는 포기를 모른다는 의미이기도 하다."
1014506-157 = "(여전히 키사키의 말은 잘 이해가 가지 않았지만…….)"
1014506-162 = "(그런 말을 하는 키사키는, 평소보다 훨씬 더 즐겁고 순수해 보였다…….)"
