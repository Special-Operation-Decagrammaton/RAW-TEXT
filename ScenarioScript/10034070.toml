[translation]
10034070-1 = "제7화;한 편의 청춘 만화"
10034070-3 = "……오셨군요, 선생님. 이쪽입니다."
10034070-4 = "이쪽 유치장에……. 네. ……네. 운영위원회를 야습한 현행범들입니다."
10034070-5 = "이유는 모르겠지만, 선생님께서 오시기 전까진 한마디도 안 하겠다고 해서요."
10034070-6 = "뭔가 귀중품이나 돈을 강탈한 건 아닌 것 같고요. 죄목은 저희도 아직……."
10034070-7 = "출동했을 땐 이미 경호 학생들과 한바탕 한 뒤더군요. 경계선은 다 뚫렸고요."
10034070-8 = "의외로 움직임이 노련해서, 저희조차도 하마터면 놓칠 뻔했습니다만……."
10034070-9 = "아무튼 저는 물러가겠습니다. 나머지는 조금 있다 이치카 선배와 논의하시면 될 거 같아요."
10034070-10 = "네. ……네. 감사합니다. 그럼 이만……."
10034070-16 = "유치장 철창을 사이에 두고 만나는 재회라……."
10034070-17 = "……그야말로 록이로군."
10034070-18 = "조금은 더 버틸 줄 알았더니, 카스팔루그도 퇴물 다 됐네."
10034070-19 = "그만 해라, 진짜 죽는다……."
10034070-20 = "후……. 뭐, 이렇게 될 거라고 각오한 거긴 하지만……."
10034070-21 = "[ns1] \"그래서 이게 무슨 상황이야……?\"\n[ns2] \"너희들 대체 뭐 한 거냐…….\""
10034070-24 = "……갔어? 정의실현부 사람……?"
10034070-25 = "진짜 간 거지? 간 거 맞지?"
10034070-26 = "[s3] \"뭐, 가긴 했는데…….\"\n[s4] \"뭔가 숨기는 거라도 있는 모양이지?\""
10034070-31 = "……선생님. 아이리 있지……?"
10034070-32 = "같이 있었을 거 아냐. 데려왔지? 그렇지?"
10034070-33 = "……근데 되게 당연하다는 듯이 묻는다, 너희."
10034070-34 = "[s5] \"……? 아이리는 또 왜……?\"\n[s6] \"아이리라면 여기 있어.\""
10034070-41 = "……으, 으응……? 나……?"
10034070-42 = "나 불렀어……? 갑자기 나를 왜……."
10034070-43 = "……가까이."
10034070-44 = "……?"
10034070-45 = "……좀 더."
10034070-46 = "……??"
10034070-47 = "……더."
10034070-48 = "……??????"
10034070-49 = "……좋아."
10034070-50 = "…………자."
10034070-56 = "……??????"
10034070-57 = "이, 이건……?"
10034070-58 = "[ns7] \"……프레데리카 셈라.\"\n[ns8] \"……너희들.\""
10034070-62 = "처음부터 이게 목적이었다……."
10034070-63 = "……라고 폼은 잡지만, 유감스럽게도 우리의 전력 수준엔 이 정도가 한계였어."
10034070-64 = "하지만 분명히 창고에서 확보한 '진품'의 일부니까, 맛은 확실하게 느낄 수 있을 테지."
10034070-65 = "진짜~. 필요하면 처음부터 이야기할 것이지, 사람 걱정하게 만들고 말이야!"
10034070-66 = "아니, 싸움은 거의 다 내가 했는데……."
10034070-67 = "그래도 먹고 나서 감상 정도는 알려줘. 우리도 아직 입은 못 대봤거든."
10034070-68 = "그리고 보다시피 우리가 이 꼴이라, 내일부터 동아리실은 못 쓰게 될 거야."
10034070-69 = "단톡방 팔 테니까 그건 내일 따로 이야기하자."
10034070-71 = "그, 그게……. 그게 무슨……."
10034070-72 = "……미안. 아이리. 말도 없이 저질러 버렸네."
10034070-73 = "너희들……. 설마 이걸……."
10034070-74 = "정말로 이거 하나 구하려고……. 이런 짓까지……?"
10034070-75 = "……?"
10034070-76 = "어째서……. 대체 왜……."
10034070-77 = "……뭐, 뭐야. 이 반응은……? 예상이랑 다른데?"
10034070-78 = "왜……. 왜 이런 짓을……?"
10034070-79 = "설마 나한테 주려고……?"
10034070-80 = "설마라니……? 먹고 싶은 거 아니었어? 이걸 그렇게나 먹고 싶어서 여태 그렇게 밴드를 하자느니 어쩌니……."
10034070-87 = "아니 뭐 이런……! 아니었다고?"
10034070-88 = "……어이, 잠깐만. 그럼 우린 뭐가 되는 거야."
10034070-89 = "이거 하자고 한 놈 누구야!! 처음에 누가 말했어!!!"
10034070-90 = "후후. 헛다리였나. 그것 또한 록……."
10034070-91 = "웃을 일이 아니라고, 이 자식아!!"
10034070-93 = "왜……. 왜 이렇게……."
10034070-94 = "……'나 같은 아이' 때문에……. 왜……."
10034070-96 = "……?"
10034070-97 = "……?????"
10034070-98 = "……뭐야? 왜, 왜 울어……?"
10034070-99 = "아, 아이리……!? 아이리. 왜 그래!? 무슨 일 있어?"
10034070-100 = "선생님!? 이게 무슨 상황이야? 아이리가 왜 우는데??"
10034070-106 = "[ns9] \"……자, 아이리.\"\n[ns10] \"이제 네가 직접 말해주면 돼.\""
10034070-109 = "네, 네……? 선생님……?"
10034070-110 = "……? 네? 직접……말하라고요……?"
10034070-111 = "아까 선생님께 드렸던 말들……이요? 어, 어떻게 그걸……!! 못해요, 저는!!"
10034070-112 = "저는 그런 말……. 여기서는……!!"
10034070-113 = "……?"
10034070-114 = "뭐, 뭔 소리야? 진짜 뭐냐, 둘이 뭐 우리 모르는 비밀 같은 거 생긴 거야?"
10034070-115 = "둘만의 야밤 밀회……. 이건 그다지 록하지 못하거든……."
10034070-116 = "……아니, 방금 선생님이 '직접 말하라'고 했잖아. 어떻게 거기서 그런 해석이 되는데."
10034070-117 = "아무튼 당장 말하지 못해!! 뭔지는 몰라도 들어야겠어! 덕분에 밤새 이 난리를 쳤는데!!"
10034070-118 = "사람을 화나게 하는 방법은 첫째로 말을 하다 마는 것이고……."
10034070-119 = "서, 선생님……!!"
10034070-123 = "[ns11] \"난 그동안 정의실현부 좀 만나고 올 게.\"\n[ns12] \"이번엔 무슨 변명거릴 지어내야 하나…….\""
10034070-126 = "서, 선생님……! 선생님……!!"
10034070-127 = "[ns13] \"괜찮아, 아이리. 할 수 있어.\"\n[ns14] 못 들은 척 밖으로 빠져나간다."
10034070-131 = "선생니이이임~!!!"
10034070-135 = "……네, 뭐. 대충 상황은 알겠네요. 일단 위로 올려보겠슴다."
10034070-136 = "으음. 그럴싸한 변명이긴 한데……. 뭐, 어떻게든 되겠죠."
10034070-137 = "중요한건 변명의 디테일이 아니라 의도니까요. 작은 해프닝 정도로 잘 덧붙여 보겠슴다."
10034070-138 = "[s15] \"정말 고마워, 이치카.\"\n[s16] \"큰 신세를 지게 됐네.\""
10034070-141 = "에이, 뭐. 이런 걸로 신세는 무슨 신세임까. 선생님이야말로 고생이 많으시죠."
10034070-142 = "일 있을 때 불러 주시기로 한 건 저희 '약속'이잖슴까!"
10034070-143 = "들어 보니 그렇게 나쁜 이야기도 아닌 거 같고요. 귀여운 친구들이네요. 하하!"
10034070-144 = "티파티 분들도 큰 행사 앞두고 시끄러워지는 건 싫으실 테니, 어떻게 유야무야 넘어가 주실 거고……."
10034070-145 = "그러니 이 건에 대해서는 더는 신경 쓰지 마십쇼. 잘 될 검다."
10034070-150 = "……아이고. 또 일이……."
10034070-151 = "좀 더 이야기하고 싶긴 하지만, 일단 오늘은 일이 우선이니 먼저 들어가보겠슴다, 선생님!"
10034070-152 = "그럼 다음에 또 봬요~!"
10034070-153 = "[s17] \"조심히 들어가~.\"\n[s18] 손을 흔들어 배웅해 준다."
10034070-161 = "……정말로 놀랍군요."
10034070-162 = "이렇게 되면 정말로 멋지겠다……라고 생각한, 한 편의 만화 같은 상상을 했었는데."
10034070-164 = "……설마 여기가 그 만화 속이었을 줄이야."
10034070-165 = "[s19] \"역시 있었구나, 츠무기.\"\n[s20] \"갑자기 불러내서 미안해.\""
10034070-170 = "아닙니다. 이럴 때에 연락을 주시라고, 전에 연락처를 드렸던 거였으니까요."
10034070-171 = "오히려 연락해 주신 걸 늦게 봐서, 합류가 살짝 늦었던 거 같군요. 죄송하게도……."
10034070-172 = "하지만……."
10034070-173 = "네. 우리의 주인공에겐 이미 조력자가 넘쳐서, 굳이 제 손까지 필요하지도 않았네요."
10034070-174 = "……스스로의 모자람에 좌절하는 주인공."
10034070-175 = "혼자만 진지하게 음악을 마주했지만, 그렇기에 그런 자에게만 다가오는 '불안감'이라는 시련과 홀로 마주해버린 주인공."
10034070-176 = "그로 인한 자신과의 갈등. 스스로에 대한 성찰과 경멸."
10034070-177 = "동료들과의 갈등, 탈주. 그리고 극적인 해후와 진심……."
10034070-178 = "이것으로 그것들을 모두 넘는다면, 이제야말로 그간의 연습과 경험치가 빛을 발하겠지요."
10034070-179 = "자신 속의 천장을 깨뜨리고, 전과는 차원이 다른 퍼포먼스로 거듭나게 될 거예요."
10034070-180 = "너무나 완벽하네요. 네. 이건 실로 아름다운……."
10034070-185 = "……'청춘'."
10034070-186 = "……스토리라고 할 수 있겠어요."
10034070-187 = "헌데 그런 멋진 광경. 보아하니 지금이 한창 '감동의 클라이맥스'일 텐데."
10034070-188 = "울고 불고, 소리치고, 학생의 눈물 섞인 웃음을 보는 기적 같은 장면일 텐데."
10034070-189 = "직접 보지 않으셔도 괜찮으신 건가요? 여기서 저랑 대화하며 날리는 것은 다소 아깝지 않으실지?"
10034070-190 = "[s21] \"괜찮지. 선생님이잖아.\"\n[s22] \"오히려 직접 하지 않아서 기쁜 거야.\""
10034070-193 = "과연……. 그렇군요."
10034070-194 = "그것이 어른의 관점인가요……. 그 잠깐 사이, 저도 한 가지 더 배웠습니다."
10034070-198 = "하지만 선생님. 그럼에도 아직 한 가지……. 회수하지 않은 떡밥이 남아 있군요."
10034070-199 = "결국 주인공에게 특별한 힘이나 재능이 없었다……는 점은 여전할까요?"
10034070-200 = "어쩌면 이 만화는, 겉만 예쁘게 덮어 두고 만족하는 그런 내용이었을까요?"
10034070-201 = "선생님께서는……. 어떻게 생각하시나요?"
10034070-202 = "……네?"
10034070-203 = "\"의외로 자신의 어떤 부분이 싫은 건 자연스러운 일\"……이라고요?"
10034070-204 = "그건 의외로군요. 다른 사람도 아닌 선생님께서, 그 점을 부정하지 않으시다니……."
10034070-205 = "[s23] \"하지만 자신이 비교해 온 그 '주변' 또한.\"\n[s24] \"그래도 내 주변이 나에게 소중하다면.\""
10034070-210 = "[ns25] \"그 또한 자신이 만들어온 결과야.\"\n[ns26] \"거기엔 내 영향이 들어가 있거든.\""
10034070-215 = "……호오"
10034070-216 = "……과연, 과연. 그녀가 자신의 주변을 사랑한다면……."
10034070-217 = "마땅히 그 사랑하는 광경을 만들어 온 것도 본인이라는 말씀이군요."
10034070-218 = "다만 본인에겐 너무나 당연한 것이라……. 그것을 인지하지 못하고 있었을 뿐."
10034070-219 = "……낭만적이네요. 아주 만족스럽습니다."
10034070-220 = "공짜로 즐기기에는 양심이 없을 정도의 만화였어요. 이런 걸 봐 버렸으니, 저도 그냥 넘어갈 순 없겠군요."
10034070-221 = "그러니, 선생님. 이것을……."
10034070-225 = "[ns27] \"……이건…….\"\n[ns28] \"악보잖아? 직접 작곡한 거야?\""
10034070-228 = "이런 결말을 상상하며……. 희망하며 쓴 곡이죠. 설마 본인에게 직접 주게 될 거라곤 예상하지 못했지만요."
10034070-229 = "저번에 선정해 드린 곡보다는 훨씬 어려운 곡이긴 하겠습니다만……."
10034070-230 = "……후후. 지금의 그들이라면, 지금의 흐름이라면 전혀 문제가 없을 겁니다."
10034070-231 = "관람료라고 생각해 주세요. 곡 밖에 없으니 가사 정도는 주인공에게 직접 맡겨주시면 됩니다."
10034070-232 = "……이런. 말씀드리는 사이에 시간이 너무 흘러버렸네요. 모두 한참 기다리고 있겠어요."
10034070-233 = "그럼 저는 여기서 이만. 다음번에는 저희 공연에서 뵙도록 하겠습니다."
10034070-234 = "미리 말씀드리지만 제가 리더라거나, 보컬이라거나, 그런 건 아니니 너무 기대치 말아 주시기를."
10034070-235 = "어쩌면 저희 밴드에 오셔도 저를 알아보시기도 힘들지 모르겠네요. 다른 멤버들이 저보다 훨씬 개성 넘치니까요."
10034070-236 = "그래도……. 네. 그런 건 상관없겠지요."
10034070-241 = "……음악이란, 같은 공간 안에 있는 것만으로도 충분한 거니까요."
10034070-244 = "무슨 말도 안 되는 소리야, 진짜! 아까부터 이상한 소리 하고 있어~!!"
10034070-245 = "아니, 그러니까. 요시미 쨩. 아무리 그래도 그건……."
10034070-246 = "……아, 선생님! 선생님이다!!"
10034070-247 = "들어봐, 좀!! 아이리가 자기가 하는 게 없다느니 아무것도 없다느니, 이상한 소릴 하잖아!!"
10034070-248 = "아니, 그러니까 내세울 게 없다고 했던 것뿐이……."
10034070-249 = "즉, 말하자면 '캐릭터 특성'이 가지고 싶다는 의미인가? '록'이 필요하다는 의미인가?"
10034070-250 = "어렵지 않지. 그렇다면 애초부터 원래 자신의 것이어야 했던 것. 왕좌이자 관, 타이틀을 다시 가져가면 그만인 것."
10034070-251 = "오오 드디어 이 견디기 힘들었던 천좌의 공백도 이젠 끝이다. 그녀가, 하늘에 서리라."
10034070-255 = "뭐, 여차저차해서. 동아리 부장 직함을 아이리에게 돌려주자고 이야기하고 있었던 것뿐이야."
10034070-256 = "……응? 부장 없는 거 아니었냐고? 어, 맞아. 우리 동아리는 딱히 부장이 없지."
10034070-257 = "동아리를 만든 당사자가, '부장같이 위아래가 있는 건 싫다'고 했었으니까."
10034070-258 = "[s29] \"……아.\"\n[s30] \"그럼 방과후 디저트부를 만든 게…….\""
