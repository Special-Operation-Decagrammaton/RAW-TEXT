[translation]
2003002-1 = "저도 이 정도는 가능하답니다."
2003002-3 = "여기, 여기요! 일사병 증상을 보이는 선수가 있습니다!"
2003002-4 = "[s] \"일사병, 일사병이면……!\""
2003002-5 = "우선 손바닥을 냉수로 적셔 주세요. 그리고 여기 얼음 수건이 있으니…… 목에 대주시면 됩니다!"
2003002-6 = "[s] \"알았어!\""
2003002-11 = "바빠 보이시네요. 선생님?"
2003002-12 = "[s] \"안녕. 하루나.\""
2003002-13 = "네. 안녕하세요. 선생님. 그런데 뭘 하고 계시는지요?"
2003002-14 = "[s] \"응…… 보는 대로 현장 의료 일을 돕고 있어.\""
2003002-15 = "하지만 선생님은 의료 스탭이 아니시잖아요?"
2003002-16 = "[s] \"그렇긴 한데, 일손이 부족하다고 해서.\""
2003002-20 = "……"
2003002-21 = "어쩔 수 없군요. 저도 지금부터 일정을 바꿔야 할 것 같습니다."
2003002-25 = "[ns] \"응……? 뭘 하려고……?\""
2003002-30 = "선생님의 일이 정리될 때까지, 저도 선생님과 동행하겠습니다."
2003002-31 = "[s] \"어……?\""
2003002-34 = "으윽…… 큰일이네. 먹은 게 얹혔는지 위가 아파……"
2003002-35 = "이대로는 오후의 경기에 참가할 수가……"
2003002-36 = "매실에는 소화를 돕는 효능이 있다고 하죠."
2003002-40 = "매실차입니다. 드세요. 조금 진하게 탔으니, 효과가 있으면 좋겠네요."
2003002-41 = "고, 고마워요. 어디……"
2003002-45 = "아……!"
2003002-46 = "아픈 게 가라앉고 있어요. 이대로라면 경기도 문제없겠네요!"
2003002-48 = "헉, 헉……"
2003002-49 = "중거리 달리기는 역시 힘들어…… 목이 마른데, 어디 물 없나……?"
2003002-51 = "자. 스포츠 드링크입니다. 물보다 흡수가 빠르다고 하죠."
2003002-52 = "설탕 대신 감미료를 사용한 것이어서, 마신 뒤의 끈적함도 없을 거예요."
2003002-53 = "어…… 잘 마실게!"
2003002-57 = "꿀꺽, 꿀꺽, 꿀꺽……"
2003002-58 = "후, 시원해! 이제 좀 살 것 같아!"
2003002-60 = "우우…… 갑자기 현기증이……!"
2003002-61 = "머리가 아프고 추워…… 손이 떨려…… 뭔가, 의식이 흐려지는 듯한……"
2003002-66 = "이건……! 저혈당 쇼크 증세로군요."
2003002-67 = "내버려 두면 뇌에 손상이 생길 수도 있습니다. 빨리 조치해야 해요!"
2003002-72 = "자, 포도당 캔디와 물입니다. 입 안에서 녹여 드세요."
2003002-77 = "후우…… 하아…… 훨씬 나아졌어요. 손 떨림도 멎었고……"
2003002-84 = "[ns1] \"대단해…… 하루나!\"\n[ns2] \"하루나에게 이런 면모가 있었다니……!\""
2003002-87 = "미식의 길을 걷는 몸으로서, 이 정도는 당연한 일입니다."
2003002-88 = "이것으로 응급 처치가 필요한 학생들은, 어느 정도 정리된 것 같네요."
2003002-89 = "[s3] \"그러네. 진행위원으로부터도 넘치도록 도움을 받았으니.\"\n[s4] \"감사하다는 말을 들었어.\""
2003002-92 = "후후후……"
2003002-93 = "그렇다면 드디어, 선생님과 진정한 대운동회의 미식을 탐구할 수 있게 되었군요."
2003002-97 = "[ns] \"설마…… 처음부터 그럴 생각으로 도와줬던 거야?\""
2003002-98 = "어떨까요. 선생님."
2003002-99 = "그렇지만 사심이 담겼어도, 남을 도운 것은 도운 것 아닐까요?"
2003002-100 = "적어도 저는, 저의 행동에 조금의 부끄러움도 없답니다?"
2003002-101 = "[s5] \"이런, 어쩔 수 없네.\"\n[s6] \"행동하는 선이야말로, 진짜 필요한 것이니까.\""
2003002-104 = "선생님께서 알아주시다니, 저도 기쁘네요."
2003002-105 = "[s] \"그런데…… 하루나는 뭘 하고 싶어?\""
2003002-106 = "그거야 당연히,"
2003002-107 = "노점부터 시작하는 미식 투어죠."
2003002-108 = "대운동회는, 평소에는 접할 수 없었던 다양한 음식을 즐길 수 있는 미식의 제전이니까요."
2003002-109 = "오늘, 제 시간의 절반을 선생님께 드렸으니, 선생님께 남은 시간의 절반을 가져가겠습니다."
2003002-110 = "물론, 승낙해 주시겠지요. 선생님?"
2003002-114 = "[ns7] \"그런 거라면 어쩔 수 없겠네.\"\n[ns8] \"노점의 안내는 맡겨도 되는 거지?\""
2003002-117 = "물론입니다. 이미 어디에서부터 무엇을 맛볼지, 경로도 계획해 두었으니까요."
2003002-118 = "오늘만큼은 선생님도…… 미식연구회의 명예 서포터시랍니다?"
2003002-119 = "[s] \"잘 부탁드립니다. 부장님.\""
2003002-124 = "(하루나와 함께 노점을 돌아다니며, 배가 꽉 찰 때까지 음식을 맛보았다……)"
