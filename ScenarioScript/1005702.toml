[translation]
1005702-1 = "가끔은 상궤를 벗어나"
1005702-4 = "(하루나의 연락을 받고 약속 장소로 나왔다.)"
1005702-5 = "아, 선생님."
1005702-6 = "늦지도 이르지도 않게 와 주셨군요."
1005702-7 = "[s] \"옷이 예쁘네.\""
1005702-8 = "감사합니다."
1005702-9 = "어울리는 시기에는 어울리는 옷이 있어야겠지요."
1005702-10 = "그리고 이런 준비들이 하나 둘 모여서."
1005702-11 = "진정한 미식을 이루는 것이라고…… 믿고 있습니다."
1005702-12 = "[s] \"요컨대…… 새해라서 새 옷을 입었다는 거구나.\""
1005702-13 = "요약하자면 그렇게 되겠네요."
1005702-14 = "하지만 그렇게 생각하는 것은 저뿐만이 아닌 듯 한데요?"
1005702-19 = "[ns] \"응…… 거리가 참 많이 붐비네.\""
1005702-20 = "연말연시를 맞아 몇 배나 활기차게 변한 거리……"
1005702-21 = "지난 한 해를 돌아보며, 다가올 새해를 기대하며"
1005702-22 = "평소와는 왠지 다른 기분이 되어 손을 잡고 나온 사람들."
1005702-23 = "내년에는 어쩐지 좋은 일이 생길 것 같다는 기대심."
1005702-24 = "그리고 그런 사람들을 맞이하는 음식들……"
1005702-26 = "후후후……"
1005702-27 = "이런 분위기에서 맛보는 음식이야말로,"
1005702-28 = "더없이 특별하게 느껴지지 않을까요?"
1005702-29 = "[s] \"그러려나……\""
1005702-30 = "분명히 그럴 겁니다."
1005702-31 = "그렇지 않으면, 이렇게 선생님과 약속을 잡은 의미가 없을 테니까요."
1005702-32 = "자, 그럼 가 보실까요?"
1005702-38 = "[ns] \"하루나?!\""
1005702-39 = "왜 그러시죠? 저희 사이에, 이제 와서 팔짱 정도로."
1005702-40 = "드러날지는 모르겠지만, 저는 지금 엄청나게 기대하고 있답니다."
1005702-41 = "잘 부탁드려요, 선생님?"
1005702-46 = "자~ 맛보고 가세요! 신선한 재료로 만들었습니다!"
1005702-47 = "초코 바나나 팝니다! 당첨 막대가 나오면 하나 더!"
1005702-48 = "야키소바 드셔 보세요! 24시간 뜨거운 철판 위에서 갓 만든 야키소바!"
1005702-50 = "야키소바인가요."
1005702-51 = "언제나 나오는…… 그러면서도 나오지 않으면 섭섭해지는……"
1005702-55 = "실례합니다. 1인분만 주시겠어요?"
1005702-56 = "아, 젓가락은 두 개 부탁합니다."
1005702-58 = "라멘도 파는군요? 어떤 식으로 담아 줄까요?"
1005702-59 = "아하…… 1회용 넓은 간이 컵에 육수를 붓고……"
1005702-60 = "이것도 맛보도록 할까요?"
1005702-65 = "후후…… 1인분씩만 시켜서 나눠 먹는다는 것도."
1005702-66 = "뭔가 분위기가 있어 좋네요."
1005702-68 = "이것은…… 구운 카스테라로군요."
1005702-69 = "카스테라를 만들어, 그 겉을 한 번 더 열을 가해 풍미를 높인……"
1005702-70 = "마침 단 맛이 필요할 때이긴 했습니다."
1005702-71 = "먹어 보도록 하죠."
1005702-75 = "딸기 찹쌀떡이로군요."
1005702-76 = "떡 안에 큰 딸기를 집어넣고, 팥소로 딸기를 감싼……"
1005702-77 = "팥의 단맛과 딸기의 상큼한 맛,"
1005702-78 = "그리고 떡의 쫄깃한 맛이 하나로 합쳐져……"
1005702-82 = "실례합니다. 딸기 찹쌀떡 두 개 주시겠어요?"
1005702-84 = "(그 뒤로 하루나와 함께 많은 노점을 정복했다.)"
1005702-89 = "[ns] \"확실히 더 이상은……\""
1005702-90 = "네…… 무리겠군요."
1005702-91 = "[s] \"어땠어, 하루나는?\""
1005702-92 = "그렇군요. 이 여정은 연말연시의 새로운 미식을 탐구하기 위한 것."
1005702-93 = "이쯤에서 결론을 내리지 않으면 안 되겠지요."
1005702-94 = "특별한 시기, 특별한 장소, 특별한 분위기에서 먹는 특별한 음식들은 하나같이……"
1005702-98 = "실망스럽더군요."
1005702-99 = "[s] \"그, 그랬어?\""
1005702-100 = "야키소바는 애초에 소스와 면이 어우러지지 않으면 의미가 없어요."
1005702-101 = "아무리 노점 라멘이라지만, 고명이 미역과 스위트콘 뿐이라는 것은 아쉬운 부분이었고요."
1005702-102 = "구운 카스테라는 불 조절을 실패해 탄 맛이 섞여 있었고,"
1005702-103 = "딸기 찹쌀떡의 팥소에서는 쓴 맛이 나더군요."
1005702-104 = "물론 저렴한 기성품을 사용했기 때문이었겠죠."
1005702-105 = "[s1] \"하루나가 화났다!!!\"\n[s2] (귀를 막고 몸을 웅크린다.)"
1005702-108 = "어머나, 왜 그러시죠. 선생님?"
1005702-109 = "네? 제가…… 노점들을 전부 터트려 버릴 것 같았다고요?"
1005702-110 = "저라고 해서 언제나 그러지는 않는답니다."
1005702-111 = "거기에……"
1005702-112 = "[s] \"거기에?\""
1005702-113 = "가장 소중한 사람과 함께 하는 시간을 제 손으로 망치고 싶지 않았으니까요."
1005702-114 = "미식은 아니었지만 식사는 충분히 즐겼으니."
1005702-115 = "이대로 조금만 더 어울려 주시겠어요?"
1005702-116 = "아직 맛보아야 할 음식은 이렇게나 많이 남아 있으니까요. 후후후."
1005702-123 = "(하루나와 거리의 분위기를 즐기며 돌아다녔다.)"
1005702-124 = "(하루나는 조금이지만 배가 꺼졌다며 노점 음식을 계속해서 맛보았다……)"
