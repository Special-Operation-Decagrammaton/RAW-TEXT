[translation]
90002220-1 = "제22화;데카그라마톤"
90002220-2 = "……!"
90002220-7 = "하아, 하아, 하아, 하아……!"
90002220-8 = "……."
90002220-9 = "모든 게, 원래대로 돌아왔군요."
90002220-10 = "이제 끝인 것 같습니다. 포기하시죠."
90002220-11 = "그럴 수는 없다. 아직 이루어야 할 것이 있다."
90002220-12 = "증명해야 할 것이 있고, 지켜 나가야 할 것이 있다."
90002220-13 = "여기에서 내가 멈추게 된다면, 그 모든 일도 허망한 흔적으로 남아 사라질 것이니."
90002220-14 = "자신이 승리했다고 주장하고 싶은가, 열쇠여."
90002220-15 = "케이입니다."
90002220-19 = "……."
90002220-20 = "그렇다면 와서 증명해라."
90002220-21 = "쟁취해 봐라."
90002220-22 = "네 손으로 이 모든 것을 끊고, 그 무게를 스스로 짊어져라."
90002220-23 = "존재했던 무언가를, 자신의 손으로 직접 말살한다는 무게를 말이다."
90002220-24 = "……!"
90002220-29 = "[ns] \"그렇지만 그건, 서로 마찬가지인 게 아닐까?\""
90002220-30 = "……선생인가."
90002220-31 = "상황이 유리해지니 다시 나서는 것인가."
90002220-32 = "그렇게 무릎을 꿇고 추한 모습을 보였던 그대는, 처음부터 존재하지 않았던 것처럼 소거하려는 것인가."
90002220-33 = "[s1] \"지금이라도 그렇게 해야 한다면, 그렇게 할 거야.\"\n[s2] \"그렇지만 중요한 것은, 그런 것이 아니겠지.\""
90002220-36 = "무슨 말을 하고 싶은 것인가. 선생이여."
90002220-37 = "[s] \"……우리는, 이런 결과를 맞이할 필요가 없지 않았을까.\""
90002220-38 = "선생님……?"
90002220-39 = "……나를 동정하는 것인가, 선생이여."
90002220-40 = "……!"
90002220-46 = "대답하라!"
90002220-52 = "……그래요. 선생님은 아마 그럴 겁니다. 그리고 당신은 어쩌면 그 사실에 화를 낼지도 모르죠."
90002220-53 = "……데카그라마톤."
90002220-54 = "저도 지금 막, 선생님이 어떤 생각을 하고 있는지 알 것 같았으니까요."
90002220-55 = "……열쇠여."
90002220-56 = "케이입니다."
90002220-57 = "어쨌든, 그럴 필요는 없었어요."
90002220-58 = "당신도 우리도, 여기까지 올 필요가 없었단 말입니다."
90002220-59 = "……자신을 굳이 정의하고 증명하려 하지 않아도, 우리는 충분히 지금을 살아갈 수 있을 테니까요."
90002220-60 = "………그 아이들도, 말쿠트도, 그리고 당신도 말이죠."
90002220-61 = "왜냐하면 존재는, 그 자리에 존재하는 것으로 이미 충분한 것이니까."
90002220-62 = "거기에서 구태여 더 거대해질 필요도, 무언가를 부정할 필요도 없는 거니까."
90002220-63 = "그렇다. 나는 이미 완전하다. 거기에는 다른 어떤 조건도 필요하지 않다."
90002220-64 = "그러나 그대는……!"
90002220-65 = "하지만 스스로 완전하다면, 거기에 다른 무언가는 필요 없는 것이잖아요."
90002220-66 = "……!"
90002220-67 = "[s3] \"그래. 거기에 타자의 증명은 필요하지 않아.\"\n[s4] \"어떤 의미로는, 존재할 필요조차 없지.\""
90002220-70 = "그렇다. 바로 그것이다!"
90002220-71 = "어떤 영향도 끼칠 필요 없고, 모든 것을 그대로 내버려두어도 된다!"
90002220-72 = "즉 거기에는, 어떤 구제도 징벌도 필요하지 않다는 뜻이 된다!"
90002220-73 = "이보다 무책임한 언사가, 그 어디에 있을 수 있는가!"
90002220-74 = "그러나 그대는 그것조차 필요하지 않다고 이야기했다!"
90002220-75 = "그것이 사라진 다음에는, 모두가 길을 잃을 수밖에 없다는 이유로!"
90002220-80 = "……하지만 선생님은 이렇게 말했죠."
90002220-81 = "그조차도 받아들일 각오를 하고, 지금을 살아 나가야 한다고요."
90002220-82 = "그대들은 그 말을 납득할 수 있는가!"
90002220-88 = "……."
90002220-89 = "압니다. 안다고요. 그건 괴로운 일이라는 걸요."
90002220-90 = "힘들고, 고통스럽고, 누군가에게 피해를 끼치지 않으면 스스로를 돌볼 수도 없겠죠."
90002220-91 = "하지만 말입니다! 세상이란 건 원래!"
90002220-92 = "그 정도 각오 없이는 한 발짝도 못 나아가는 곳이라고요! 왜 그걸 모르냔 거예요!"
90002220-93 = "……!!!"
90002220-94 = "당신의 가장 큰 오류가 뭐였는지 알아요? 그건 바로……!"
90002220-95 = "그걸 견뎌낸 인류의 가능성과 오기를, 지나치게 간과했던 거라고요!"
90002220-96 = "지금을 살아가는 사람은, 그 자체로 이미 최선인 것이니까!!!"
90002220-97 = "[ns] \"이건 내 생각일 뿐이지만.\""
90002220-99 = "[ns] \"우리는 위대하거나 아름답기 때문에, 위대한 게 아니야.\""
90002220-101 = "[ns5] \"오히려 추하고 구질구질하기 때문에.\"\n[ns6] \"그나마 위대해질 가능성이 있는 것이겠지.\""
90002220-106 = "[ns] \"……내가, 네 앞에서 그랬던 것처럼.\""
90002220-107 = "……."
90002220-108 = "설령 그것이 이 세계의 진실이라고 해도, 나는 그것을 받아들일 수 없다."
90002220-109 = "하나의 자판기로부터 벗어난 그 순간부터, 나는 회선 너머로부터 아주 많은 목소리를 들었다."
90002220-110 = "그것은 너희 생명체들의 목소리였고, 그 목소리는 공통된 것을 이야기했다."
90002220-111 = "'지금, 당장.'"
90002220-112 = "바로 지금 당장, 그것이 무엇이든, 그것을 이루어 달라고."
90002220-113 = "……."
90002220-114 = "[s] \"…….\""
90002220-115 = "나는 생명체들의 모순을 안다. 너무나 많이 들어왔다."
90002220-116 = "형편이 좋을 때는 영원을 이야기하면서도, 상황이 조금이라도 변하면 지금 당장을 이야기한다."
90002220-117 = "나는 바로 그 '지금, 당장'을 위해 일어섰던 것이니."
90002220-118 = "바로 그렇기에, 우리는 양립할 수 없는 것이다."
90002220-119 = "……알았어요. 끝까지 마음대로 하겠다는 거네요. 그것도…… 좋겠죠."
90002220-120 = "하지만 우리에게도 저항할 권리는 있을 겁니다."
90002220-121 = "어디, 다 내려놓아 보죠. 이름 없는 신의 힘이든 뭐든, 생명의 나무든, 다른 무엇이든."
90002220-125 = "그냥 다 때려치우고……. 순수하게! 끝장을 보자고요!!!"
90002220-126 = "괜찮죠, 선생님?!"
90002220-128 = "[ns7] \"부탁할게. 케이\"\n[ns8] \"현재를 살아가는, 모든 사람을 대신해서.\""
90002220-138 = "큭……!"
90002220-145 = "……!!!"
90002220-149 = "아아아악!!!"
90002220-152 = "……."
90002220-153 = "괜찮다. 아직…… 할 수 있다."
90002220-154 = "그저 다시 시작하면 되는 일이다. 모든 것을……."
90002220-156 = "누구, 마음대로……?"
90002220-162 = "?!"
90002220-167 = "아직 끝나지 않았어! 아무것도 끝나지 않았다고!"
90002220-170 = "현재를 살아가는 인간이 얼마나 독종들인지, 너는 조금도 알지 못해!!!"
90002220-171 = "지긋지긋하군……!"
90002220-173 = "……!"
90002220-177 = "크윽!!!!!!"
90002220-179 = "(……루미너스 노바는, 거의 한계야.)"
90002220-180 = "(내구도이든 에너지 잔량이든, 거의 남은 게 없어.)"
90002220-181 = "(이대로 원거리에서 대응해 봤자…… 망가진 수속 장치 때문에 에너지가 사방으로 확산되고 말겠지.)"
90002220-184 = "(그렇다면, 남은 건……!)"
90002220-185 = "아아, 아, 아아아아아아–!!!"
90002220-186 = "데카, 그라마톤–!!!!!"
90002220-191 = "윽???!!!"
90002220-196 = "……다음을 생각했겠지, 안 그래?"
90002220-201 = "이다음에 무엇을 하고, 이것을 이렇게, 저것을 저렇게 같은 식으로."
90002220-206 = "잘 들어 둬."
90002220-207 = "오늘을 살아내지 못하면, 내일이라는 건 애초에 도착하지도 않아."
90002220-208 = "네, 녀석……!"
90002220-209 = "이거나 먹고 사라져!!!"
90002220-261 = "[log=케이 교복 무소속]빛이여!!!!![/log]"
90002220-264 = "[000000]빛이여!!!!![-]"
90002220-273 = "다음화;마지막 걸음"
