[translation]
34250-1 = "제25화;소중한 사람"
34250-3 = "[ns] \"다들 괜찮아?\""
34250-4 = "그래……. 간신히 서 있을 정도는 돼."
34250-5 = "응……."
34250-6 = "이, 이제 진짜 끝인 거죠……?"
34250-7 = "베아트리체는……."
34250-8 = "[s] \"도망쳤어.\""
34250-12 = "도망쳤다고……?"
34250-13 = "[s] \"하지만 두 번 다시 너희를 괴롭히진 못할 거야.\""
34250-14 = "……."
34250-15 = "……."
34250-16 = "……."
34250-23 = "선생님. 우리를 도와줘서 고마워."
34250-24 = "[s] \"가면은 이제 안 써도 돼?\""
34250-25 = "……응. 괜찮을지도."
34250-26 = "마담이 어째서 나에게 가면을 씌운 건지 몰랐는데……."
34250-27 = "그때 아즈사의 폭탄에 휘말렸을 때 내 몸을 보호해 준 보호장치가 있었거든. 바로 그거의 작동 장치였던 거 같아."
34250-28 = "결국 마담은 내 몸을 보호하기 위해 이 가면을 씌웠던 거겠지."
34250-29 = "[s1] \"그럼 필요할 때 계속 쓰고 있어.\"\n[s2] \"아츠코가 다치면 슬퍼할 사람들이 많으니까.\""
34250-30 = "……."
34250-31 = "……."
34250-32 = "응. 그래. 더 이상 목소리를 숨길 필요는 없을 것 같지만……. 가면은 가끔 쓰고 있을게."
34250-33 = "……. 그래. 이제 됐어. 선생님."
34250-34 = "공주님을 구했으니까…… 이제 됐어. 이제 마음대로 해도 돼."
34250-35 = "[s] \"마음대로……?\""
34250-36 = "내가 모든 것의 원흉이야……. 에덴조약 사건도, 세이아 습격도, 나기사 습격도…… 미사키도, 히요리도, 아츠코도……. 모두 나 때문에 이렇게 된 거야."
34250-37 = "총학생회든, 트리니티든…… 아니면 교정국이든 뭐든 상관없어. 선생님이 생각할 때 가장 적절한 곳으로 날 보내 줘."
34250-39 = "뭐……!?"
34250-40 = "리, 리더……?!"
34250-41 = "……."
34250-42 = "우, 웃기지 마. 리더…… 혼자서만 그딴 수작을……!"
34250-44 = "아니. 난…… 오랫동안 책임져야 할 것을 책임지지 않고 살아왔어……."
34250-45 = "이제 됐어. 이제 그래야만 할 시간이 된 거야."
34250-46 = "리, 리더……."
34250-48 = "[ns3] \"………………….\"\n[ns4] \"……그러네. 너는 책임져야 할 것이 있어. 사오리.\""
34250-52 = "[ns] \"너는 오랫동안 주변 사람들을 지키기 위해 노력해 왔겠지.\""
34250-55 = "[ns5] \"넌 말하자면 남을 보살피고 지키고 감내하고\"\n[ns6] \"책임지는 일을 혼자 도맡아 온 거야.\""
34250-59 = "[ns7] \"그랬기 때문에 잘못된 환경에서\"\n[ns8] \"잘못된 가르침을 받고, 잘못된 선택을 해 온 거겠지.\""
34250-64 = "[ns] \"너희는 잘못을 저지른 나쁜 아이들이 맞아.\""
34250-65 = "……."
34250-66 = "……."
34250-67 = "……."
34250-69 = "[ns] \"하지만, 그렇다고 해서 너희가 고통받아 마땅하다는 건 절대 아냐.\""
34250-72 = "[ns9] \"아이들이 고통받았다면, 그건 그 아이의 탓이 아니야.\"\n[ns10] \"아이들이 고통받는 세계를 만든 책임은 어른인 내가 지어야 해.\""
34250-75 = "무, 무슨 소리야……! 그런……!!"
34250-76 = "그런…… 그럼 대체 나는…… 나는 무엇을 책임져야 하는 거지……?"
34250-78 = "……."
34250-79 = "리더……."
34250-80 = "……."
34250-86 = "[ns] \"네가 책임져야 하는 건 바로 너의 삶이야. 사오리.\""
34250-87 = "……무, 무슨 말인지 모르겠어."
34250-88 = "응. 나는 알 것 같아."
34250-89 = "공주님……?"
34250-90 = "사오리. 하고 싶은 게 있어?"
34250-94 = "아즈사는 배우는 게 즐겁다고 했어. 친구들과 같이 있는 게 행복하다고 했어."
34250-99 = "사오리가 좋아하는 건 뭐야? 하고 싶은 건 있어? 취미는 있어?"
34250-100 = "좋아하는 음식은 뭐야? 나는 그동안 하나도 그런 걸 들어본 적이 없어."
34250-101 = "사오리. 미래의 꿈이 있어? 되고 싶은 건 있어?"
34250-103 = "……그런. 그런 건……."
34250-104 = "모르겠어…… 한 번도 그런 걸 생각하며 살아오지 않았어……."
34250-105 = "내가 뭘 좋아하는지 뭘 하고 싶은지……. 나는 하나도 알지 못해……."
34250-107 = "사오리는, 책임감이 강하고…… 강단있고…… 음."
34250-108 = "가, 가르치는 것도 잘해요……. 이런 거 저런 거…… 알려줄 때는 무섭지만……."
34250-109 = "성실하긴 하지. 계획도 잘 세우고. 스스로 나서는 것도 잘하고."
34250-114 = "……."
34250-115 = "[ns] \"음, 그런가. 그렇다면…… 사오리는 나중에…….\""
34250-117 = "[ns] \"언젠가 좋은 선생님이 될 수 있을지도 모르겠네.\""
34250-118 = "……!!!"
34250-121 = "리더가 서, 선생님이……?!"
34250-122 = "뭐, 잘 상상은 안가지만."
34250-123 = "아니. 잘 어울릴 것 같아. 그치?"
34250-125 = "……모르겠어. 내가…… 그런……. 그런 미래가 정말……?"
34250-129 = "잘 모르겠어…… 삶을 책임진다는 말도, 내가 좋아하는 것도, 그런 미래들도…… 아무것도 모르겠어……."
34250-130 = "나는……."
34250-131 = "……나는 살아도 괜찮은 거야?"
34250-132 = "[s] \"그 질문의 답은 네가 스스로 찾도록 해. 사오리.\""
34250-133 = "……."
34250-136 = "……."
34250-137 = "……."
34250-138 = "……."
34250-142 = "[ns] \"그럼 여기서 작별이야, 아리우스 스쿼드.\""
34250-144 = "뭐, 뭐라고……? 자, 작별이라니, 잠깐만, 선생님?!"
34250-145 = "[s] \"도움이 필요한 다른 학생이 아직 있거든.\""
34250-147 = "기, 기다려……!!"
34250-148 = "나는…… 우리는……."
34250-152 = "아니, 그런가……"
34250-153 = "그걸 찾아내는 게 나의……."
34250-154 = "[s] \"어른인 내가 보증할게. 너희는 그 답을 찾아낼 수 있을 거야.\""
34250-155 = "……!!"
34250-161 = "가, 가버렸어요……?"
34250-162 = "도움이 필요한 학생…… 분명 그 미카를 구하러 돌아간 거겠지."
34250-163 = "호, 혼자서 괜찮으실까요……."
34250-165 = "……응. 괜찮을 거야. 그때도 그랬으니까."
34250-166 = "그때……?"
34250-167 = "응. 선생님은 어른이니까 분명 뭔가 준비해둔 방법이 있겠지."
34250-168 = "이제는 베아트리체도 사라졌고, 아리우스 자치구를 억압하는 건 전부 사라졌으니까."
34250-169 = "……."
34250-170 = "리더……."
34250-171 = "사오리. 괜찮아……?"
34250-172 = "응…… 나는……. 아직도…… 아무것도 모르겠지만……. 그래도……."
34250-178 = "처음으로…… 이 세상에 있어도 된다는 허락을 받은 기분이야……."
34250-193 = "쿨럭…… 쿨럭."
34250-196 = "……. 아아. 엉망진창이 되어버렸네……."
34250-197 = "그치만…… 해가 뜰 때까지 버텨냈어……. 응. 엄청 괴로웠지만……."
34250-198 = "아츠코를 구하는 건 성공한 거지?"
34250-199 = "사오리도, 다른 스쿼드도…… 모두…… 좋은 결말을 맞이했을 거야. 응, 선생님이 함께 있었을 거니까 분명히."
34250-203 = "응…… 그럼 됐어……."
34250-211 = "미안해, 선생님. 나는 여기까지야……."
34250-212 = "선생님과 함께 돌아가고 싶었는데……"
34250-230 = "[ns] \"기다려!!!\""
34250-232 = "서, 서, 서…… 선생님-?!"
34250-233 = "[s] \"늦어서 미안해, 미카. 기다렸지?\""
34250-234 = "서, 선생님…… 어째서 여기에……? 어, 어째서……?"
34250-235 = "[s] \"말했잖아. 난 언제나 네 편이라고.\""
34250-236 = "……!!"
34250-237 = "[s] \"미카가 위기에 처했을 땐 당연히 내가 구해줘야지.\""
34250-238 = "그, 그런……. 나, 나는…… 나쁜 아이에다가……"
34250-239 = "선생님이 구할 가치가 있는 사람이 아닌데……."
34250-246 = "하, 하지만…… 서, 선생님 혼자서 저 성도회를 어떻게 상대하겠다는 거야……?!"
34250-247 = "저, 저 존재는 차원이 달라, 선생님…… 나, 나도 꽤 강하지만…… 저건 사기야, 반칙 같은 거라고."
34250-248 = "선생님, 그러지 마! 나는 구할 가치가 있는 아이가 아냐…… 지금이라도 도망쳐……!!"
34250-249 = "[s] \"미카. 너는 문제아가 맞아.\""
34250-251 = "[ns11] \"하지만 아무리 문제투성이 불량 학생이라고 해도……\"\n[ns12] \"위험에 처한 학생을 외면하는 선생은 어디에도 없어!\""
34250-254 = "[ns] 어른의 카드를 꺼낸다."
34250-258 = "[ns] \"감히, 감히…… 내…….\""
34250-260 = "[ns13] \"감히 내 소중한 학생에게 무슨 짓이냐아아-!!\"\n[ns14] \"감히 내 소중한 공주님에게 무슨 짓이냐아아-!!\""
34250-261 = "?!"
34250-263 = "우와……."
