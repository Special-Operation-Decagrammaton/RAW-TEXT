[translation]
1300103-1 = "음양부의 아이돌"
1300103-5 = "(치세와 만나 함께 서점으로 가는 도중에, 갑작스럽게 사건은 벌어졌다.)"
1300103-6 = "호, 혹시 치세 님이신가요?!"
1300103-7 = "응……?"
1300103-8 = "지, 진짜다! 진짜 치세 님이야!"
1300103-9 = "뭐? 치세 님이라고?"
1300103-10 = "여기에 치세 공주님이 계신다고?! 어디?! 어디야?!"
1300103-13 = "[ns] \"이, 이게 대체?\""
1300103-14 = "으음~? (갸웃)"
1300103-15 = "꺄아악! 치세 님! 여기 좀 봐주세요!"
1300103-18 = "웃어주세요. 치세 님!"
1300103-19 = "음……."
1300103-21 = "이렇게……? (싱긋)"
1300103-23 = "허억! 허억! 천사다! 치세 님! 진짜천사!"
1300103-25 = "치세 님! 하이쿠! 하이쿠를 읊어주세요!"
1300103-26 = "으응…… 하이쿠."
1300103-27 = "모두들 안녕."
1300103-28 = "하루 세번 이닦기."
1300103-29 = "잘 하고 있어?"
1300103-31 = "꺄아아악! 치세 님의 리얼 하이쿠다!"
1300103-32 = "아아…. 혀, 현기증이……!"
1300103-33 = "치세 님! 치세 님! C H I S E! 아이 러브 치세 공주님!"
1300103-34 = "음, 선생님. 움직이질 못하겠어. 어쩌지."
1300103-35 = "[s] \"잠깐, 다들 진정 좀 하고…….\""
1300103-36 = "응? 당신은 누구죠? 누구길래 치세 님 곁에 딱 달라붙어 있는 건가요?!"
1300103-37 = "혹시 매니저?"
1300103-38 = "아니야! 어쩌면 악질 스토커일지도 몰라!"
1300103-39 = "바로 그거다!"
1300103-40 = "[s] \"전혀 아니야!\""
1300103-42 = "[s1] \"보다시피 난 치세의 매니저야!\"\n[s2] \"보다시피 난 치세의 선생님이야!\""
1300103-43 = "그렇게 안 보이는데? 정말?"
1300103-44 = "그렇게 안 보이는데? 정말?"
1300103-46 = "[s3] \"큭, 이러고 있을 수만은 없지.\"\n[s4] \"치세, 도망치자!\""
1300103-47 = "어? 응~ 알았어~"
1300103-48 = "어? 응~ 알았어~"
1300103-49 = "앗, 도망친다!"
1300103-52 = "[ns] \"하아, 하아. 큰일 나는 줄 알았네.\""
1300103-53 = "음~ 선생님, 재난?"
1300103-54 = "[s] \"아니, 재난이었던 건 내가 아니라 치세가…….\""
1300103-55 = "응? (갸웃)"
1300103-56 = "[s] \"평소에 자주 이래?\""
1300103-57 = "음~ 가끔 길을 걷다 보면 이럴 때가 종종 있어."
1300103-58 = "음양부 부원이라서, 다들 신기하게 보는 걸까?"
1300103-59 = "[s5] \"그러고 보니 음양부는 백귀야행 학원의 관광업을 홍보하기 위해\"\n[s6] \"대외 활동도 많이 한다고 했었지.\""
1300103-60 = "그래도 다들 응원해준다니까."
1300103-61 = "그래도 다들 응원해준다니까."
1300103-62 = "열심히 해야지-하고 생각하고 있어."
1300103-63 = "[s7] \"그, 그렇구나…….\"\n[s8] \"치세는 인기가 많네.\""
1300103-64 = "인기……? (갸웃)"
1300103-65 = "인기……? (갸웃)"
1300103-67 = "[s] \"모두가 치세를 좋아해주고 있다는 뜻이야.\""
1300103-68 = "으음……. 그렇구나……."
1300103-69 = "좋아해주는 건, 기쁜 일이니까."
1300103-70 = "앗! 찾았다! 치세 니임~!"
1300103-71 = "[s] \"이런, 따라 잡혔다!\""
1300103-72 = "치세 님~~!!! 악수를 한 번만~!~!"
1300103-73 = "[s9] \"크윽, 어쩔 수 없지! 치세 도망가!\"\n[s10] \"여긴 내가 막을 테니까!\""
1300103-74 = "응? 알았어~"
1300103-75 = "응? 알았어~"
1300103-78 = "아."
1300103-79 = "[s] \"응? 치세, 무슨 일이야?!\""
1300103-82 = "선생님 이거 봐. 개미가 일렬로 행진하고 있어."
1300103-83 = "[s] \"치, 치세! 그럴 때가 아니라니까……!\""
1300103-85 = "(여차저차 잔뜩 실랑이를 벌이다가, 치세와 함께 간신히 그 자리에서 도망칠 수 있었다.)"
