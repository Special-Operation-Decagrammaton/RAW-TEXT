[translation]
10018065-2 = "이런, 망할……!"
10018065-7 = "우앙~ 힘들었어!"
10018065-8 = "흐음……"
10018065-9 = "생각보다 냐오푸드가, 참새정을 심각하게 여기고 있는 것 같군요."
10018065-14 = "왜 그렇게 생각하지?"
10018065-15 = "[s] \"그렇지 않았다면, 가게 하나에 이렇게 많은 수고를 들일 이유가 없을 테니까.\""
10018065-19 = "……틀린 말은 아니야. 참새정은 이미 하나의 구심점이니까."
10018065-20 = "구심점이라뇨?"
10018065-21 = "냐오푸드 밑에 들어가고 싶지 않아 하는 사람들."
10018065-22 = "그 사람들을 하나로 모으는 역할을 하고 있다는 거지."
10018065-23 = "어? 주인분은 그냥 자기 가게를 지키고 싶어했을 뿐인데?"
10018065-24 = "그런 생각을 하는 사람이 그 주인 한 명뿐일 리가 없잖아."
10018065-25 = "그 주인이 원했든 원하지 않았든, 참새정이 버티고 있다는 사실 하나만으로도,"
10018065-26 = "냐오푸드 밑으로 순순히 들어가지 않겠다는 사람들이 남게 된다는 뜻이지."
10018065-27 = "회장은…… 극적인 방법을 좋아하지."
10018065-28 = "그러니까 모든 수단을 다해, 가장 인상적으로 참새정을 없애 버리려는 거야."
10018065-29 = "참새정이 있어서 아직도 버티고 있는 사람들에게, 본보기를 보여주려고."
10018065-30 = "[s] \"그 방식…… 정말 괜찮다고 생각하는 거야?\""
10018065-31 = "……문제가 없다고는 생각하지 않아."
10018065-33 = "그런데 왜 그런 사람을 따르는 거야? 이상하지 않아?"
10018065-35 = "우리에게, 일자리를 줬으니까."
10018065-36 = "[s] \"일자리?\""
10018065-37 = "누가 냐오푸드에서 일하고 있다고 생각해?"
10018065-38 = "식재료를 모으고, 가공하고, 포장해서 유통까지. 어쨌든 일손이 필요한 것 아니겠어?"
10018065-39 = "그 용역을 당신들, 구르메 헬멧단에게 제공했다는 거군요."
10018065-40 = "쳇. 우리도 이러고 싶어서 이런 모습이 된 건 아니야."
10018065-41 = "우리뿐만이 아니야. 여기 상권도 마찬가지다."
10018065-43 = "냐오푸드 밑에서 일하는 게, 오히려 더 나은 사람들도 분명 있을 거라고."
10018065-49 = "하지만…… 그런 게 싫은 사람들은요?"
10018065-50 = "내 알 바냐. 난 고용주의 입장을 따를 뿐이다."
10018065-51 = "[s] \"대화로 타협할 수 있는 부분이 없을까?\""
10018065-52 = "……난 몰라. 정 그렇다면 직접 가서 이야기해보든가."
10018065-53 = "너희들이 본사 위치를 알고 있을 때의 이야기이지만!"
10018065-60 = "아, 여기 홈페이지에 나와 있네요."
10018065-61 = "어디어디."
10018065-65 = "'오늘도 냐오푸드는 값싸고 맛있는 음식을 제공해 드리기 위해 밤낮없이 노력하고 있습니다. 찾아오시는 길은……'"
10018065-70 = "내가 못 살아……"
10018065-75 = "아, 도망갔다!"
10018065-76 = "왠지 이해가 가네요★"
10018065-81 = "그러면 저희도 움직여 볼까요?"
