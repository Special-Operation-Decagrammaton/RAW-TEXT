[translation]
90102105-2 = "여기는 FOX 3, 운전실에 있던 차장 비슷한 것— #n아니, 이걸 차장이라고 불러도 괜찮으려나?"
90102105-3 = "……하여튼 목표를 완전 제압했어. 이제 더는 움직이지 않는 것 같아."
90102105-4 = "뭔가 가까이서 보니 악몽 속에서나 볼 법한 열차의 심장 같은 외형이네."
90102105-5 = "열차 부품과 승무원 의상이 한 데 얽혀 있는 것이, 그동안 마주쳤던 로어와는 완전히 다른 종류 같아."
90102105-6 = "뭔가를 형성하려다 실패한 것처럼 보이는데…… 이 형태에 무슨 의미가 있으려나?"
90102105-7 = "……열차 내부에 대한 자세한 조사는 열차가 멈춘 뒤에 진행해도 늦지 않겠지."
90102105-8 = "모두 수고했다. 운전실의[ruby=비상제동스위치] EBS를[/ruby] 가동했으니, 곧 열차가 멈출 거야."
90102105-9 = "그럼 이걸로…… 모두 해치웠나?"
90102105-10 = "FOX 4, 작전 중에 그런 불길한 소리는 하지 말아줄래?"
90102105-11 = "어쩐지 그렇게 말하면 당장이라도 이 꾸물거리는 게 다시 살아나서 2 페이즈 보스전이 시작될 것 같잖아—"
90102105-17 = "어라? FOX 1, 열차의 속도가 오히려 더 빨라지는 것 같은데……"
90102105-18 = "제동 장치가 제대로 작동하고 있는 것 맞아?"
90102105-19 = "제동관 압력이 떨어지질 않아…… 뭔가 압력이 떨어지지 않도록 방해하고 있어!"
90102105-20 = "거 봐, 오토기! 네가 그런 말을 하는 바람에 부정 탔잖아!"
90102105-21 = "그게 무슨 상관이야? 말 한 마디로 작전의 성패를 결정할 수 있으면, 애초에 SRT가 나설 필요도 없었거든?"
90102105-23 = "[ns] \"열차를 멈출 다른 방법은 없는 거야?\""
90102105-24 = "이 방법은 최후의 수단으로 남겨두려 했지만…… 어쩔 수 없겠군요."
90102105-25 = "선생님. 지금부터 가지고 있는 집속 수류탄을 모조리 사용해서 기관부를 물리적으로 파괴하겠습니다."
90102105-26 = "열차가 탈선할 가능성이 있으니…… 몸을 웅크린 채 최대한 충격에 주의하십시오."
90102105-27 = "[s] \"아, 알겠어!\""
90102105-28 = "전원 파편 범위 뒤로 물러나도록."
90102105-32 = "집속탄 투입!"
90102105-37 = "셋, 둘, 하나—"
90102105-38 = "터진다!"
90102105-45 = "……하아."
90102105-46 = "이번 작전도 정말 최악이야. 앞으로도 열차는 가급적 이용하고 싶지 않아……"
90102105-47 = "이번엔 진짜로…… 해치웠나?"
90102105-48 = "그 말 좀 그만해! 또 되살아날까 봐 무서우니까!"
90102105-49 = "하하…… 이젠 되살아나고 싶어도 방법이 없지 않을까? 열차가 완전히 선로에서 탈선해 버렸으니까."
90102105-53 = "선생님, 괜찮으십니까?"
90102105-54 = "[s5] \"응. 긁힌 곳 하나 없이 무사해.\"\n[s6] \"다행히 기대고 있던 시트가 충격을 받아줬거든.\""
90102105-60 = "……다치지 않으셨다니, 다행입니다."
90102105-61 = "열차가 탈선하는 과정에서 선로가 통째로 뜯겨 나갔네. 이거 복구하려면 얼마나 들려나……?"
90102105-62 = "SRT 학원 시절이었으면 재무실장이 직접 찾아와서 한 소리 했겠는 걸."
90102105-63 = "이번 특수 작전은 총학생회도 모르는 비밀 작전이라 정말 다행이야……."
90102105-64 = "으음……"
90102105-70 = "여, 여긴 어디지……?"
90102105-71 = "분명 나는 카와니시 역에서 히아신스 학원으로 가는 열차를 탔었는데……"
90102105-72 = "어라, 그 열차에 우리 말고 다른 학생들도 타고 있었나 보네."
90102105-73 = "FOX 2, 민간인의 바이탈 체크를 부탁한다."
90102105-74 = "응. 맡겨줘."
90102105-77 = "몸은 괜찮으신가요? 어지럽거나 어디 아픈 곳은 없으신가요?"
90102105-78 = "으응. 아픈 곳은 없는데…… 그보다 너희는 누구야?"
90102105-79 = "그게 저희는……"
90102105-80 = "아, 혹시 네가 그 타카하시야?"
90102105-81 = "너희가 내 이름을 어떻게 알고 있어?"
90102105-82 = "네 친구의 부탁을 받고 찾으러 왔거든. 네가 열차를 탄 뒤로 갑자기 연락이 되지 않는다고 해서."
90102105-83 = "친구가 얼마나 걱정을 했는지 알아? 그러니까 앞으로는 모르는 열차에는 함부로 타지 마. 범죄의 가능성이 있으니까."
90102105-84 = "친구라면……"
90102105-88 = "그렇구나. 아직 나를 잊지 않았었구나."
90102105-89 = "그나저나 여기는 어디지?"
90102105-90 = "으음. 그건 우리도 방금 열차에서 퉁겨져 나온 상태라, 잘 모르겠는데."
90102105-91 = "지금 GPS 신호를 다시 잡고 있으니까 곧—"
90102105-95 = "아, 미안. 지금 다시 보니 알 것 같네."
90102105-96 = "이 선로, 내가 예전에 다니던 히아신스 학원으로 가는 길이야."
90102105-97 = "이렇게 꽃무릇이 흐드러지게 피어 있는 철길은 흔치 않거든."
90102105-103 = "꽃무릇이 가득 피어, 불 붙은 것처럼 일렁이던 통학길의 풍경."
90102105-104 = "확실히 아름다운 풍경이네."
90102105-105 = "이런 광경을 다시 보기 위해서 과거로 돌아가고 싶었다는 학생들의 마음도 조금은 이해가 가."
90102105-106 = "하지만 좋았던 시절은 다시 돌아오지 않고, 우리는 현재를 살아가야 하니까."
90102105-107 = "……이 아름다운 풍경을 우리는 앞으로도 잊지 못하겠지."
90102105-108 = "그래."
90102105-109 = "우리에게도 또 하나의 추억이 생겼네."
90102105-115 = "다음화;에키벤"
