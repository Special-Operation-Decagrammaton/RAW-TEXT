[translation]
90102105-2 = "こちらFOX3。運転室にいた車掌――いや、あれを車掌って呼んでいいのかな？"
90102105-3 = "……[ruby=・   ・]目標[/ruby]を完全制圧。もう動かないみたい。"
90102105-4 = "近くで見ると、悪夢に出てくる列車の心臓みたいな見た目だね。"
90102105-5 = "車両の部品と乗務員の制服がぐちゃぐちゃに絡み合ってて……#n今までのロアとはまるで別物だよ。"
90102105-6 = "何かになろうとして失敗したようにも見えるけど……どんな意味があったのかな？"
90102105-7 = "……詳しい調査は列車が止まってからでも遅くないだろう。"
90102105-8 = "運転[ruby=電子制御ブレーキシステム]室のEBSを作[/ruby]動させた。#nまもなく列車は停止する。"
90102105-9 = "じゃあ……これで解決？"
90102105-10 = "FOX4、作戦中にそういう不吉なこと言うのやめてくれる？"
90102105-11 = "急に復活して、第二形態のボス戦が始まりそう――"
90102105-12 = ""
90102105-14 = ""
90102105-15 = ""
90102105-16 = ""
90102105-17 = "あれ？#n列車の速度が上がってるような……。"
90102105-18 = "FOX1、ブレーキシステムを作動させたんだよね？"
90102105-19 = "ブレーキ管の圧力が下がらない……何かが減圧を妨害している！"
90102105-20 = "オトギがあんなこと言うから！"
90102105-21 = "えー、それ関係ある？#n言葉ひとつで作戦の成否が決まるならSRTなんて必要ないでしょ。"
90102105-22 = ""
90102105-23 = "[ns] \"別の方法はないの？\""
90102105-24 = "最後の手段として取っておくつもりでしたが……やむを得ません。"
90102105-25 = "これから、所持しているクラスターグレネードをすべて使用し、機関部を破壊します。"
90102105-26 = "脱線の可能性がありますので……身を低くし、衝撃に備えてください。"
90102105-27 = "[s] \"わ、分かった！\""
90102105-28 = "全員、有効範囲の外へ退避。"
90102105-29 = ""
90102105-31 = ""
90102105-32 = "クラスターグレネード投入！"
90102105-33 = ""
90102105-37 = "3、2、1――"
90102105-38 = "爆発するよ！"
90102105-39 = ""
90102105-45 = "……はあ。"
90102105-46 = "なんで毎回こんな感じなの……しばらくは列車に乗りたくないわ……。"
90102105-47 = "今回は本当に……やったか！？"
90102105-48 = "だからそれやめてってば！また復活したらどうするの！？"
90102105-49 = "あはは……流石に無理じゃないかな？#n完全に脱線しちゃったし。"
90102105-52 = ""
90102105-53 = "先生、ご無事ですか！？"
90102105-54 = "[s5] \"うん。かすり傷ひとつないよ。\"\n[s6] \"シートが衝撃を受け止めてくれたみたい。\""
90102105-57 = ""
90102105-59 = ""
90102105-60 = "……お怪我がなくて何よりです。"
90102105-61 = "おー……線路まで吹っ飛んでるね。#nこれ、復旧にいくらかかるんだろう……？"
90102105-62 = "SRTの時だったら、財務室長が直々に来てお説教だったかもね。"
90102105-63 = "連邦生徒会も知らない極秘作戦で本当に良かった……。"
90102105-64 = "う、ん……。"
90102105-65 = ""
90102105-67 = ""
90102105-68 = ""
90102105-69 = ""
90102105-70 = "こ、ここは……？"
90102105-71 = "あれ……？#n川西駅でヒヤシンス学園行きの列車に乗って……。"
90102105-72 = "私たち以外も乗ってたみたい。"
90102105-73 = "FOX2、民間人のバイタルチェックを頼む。"
90102105-74 = "うん、任せて。"
90102105-75 = ""
90102105-77 = "お体は大丈夫ですか？#n目眩がしたり、どこか痛むところは？"
90102105-78 = "ううん、特にはないけど……あなた達は？"
90102105-79 = "えっと、私たちは……。"
90102105-80 = "あ、もしかして君がタカハシ？"
90102105-81 = "どうして私の名前を？"
90102105-82 = "君の友達に頼まれて探してたんだ。#n列車に乗ってから連絡が取れなくなったって。"
90102105-83 = "すっごく心配してたわよ。#nだからこれからは、知らない列車には不用意に乗らないこと。#n犯罪に巻き込まれる可能性もあるんだから。"
90102105-84 = "友達って……。"
90102105-85 = ""
90102105-87 = ""
90102105-88 = "そっか。私のこと、まだ忘れてなかったんだ。"
90102105-89 = "それで……ここはどこなの？"
90102105-90 = "さあ？私たちもよく分かんないんだよね。"
90102105-91 = "今GPS拾い直してるから、もうすぐ――"
90102105-92 = ""
90102105-94 = ""
90102105-95 = "あ……分かった気がする。"
90102105-96 = "この線路、ヒヤシンス学園に向かう途中だ……。"
90102105-97 = "こんなふうに彼岸花が一面に咲いている線路なんて、そうそうないだろうし。"
90102105-102 = ""
90102105-103 = "彼岸花が一面に咲き、燃えるような赤が揺れる通学路の景色。"
90102105-104 = "綺麗……。"
90102105-105 = "過去に戻りたいと思った生徒の気持ちも……少しだけ、分かる気がする。"
90102105-106 = "だが、過去は戻らない。私たちは今を生きていかなければならないのだから。"
90102105-107 = "とはいえ……この美しい景色を忘れることはないだろうな。"
90102105-108 = "うん。"
90102105-109 = "私たちにも、また1つ思い出ができたね。"
90102105-110 = ""
90102105-112 = ""
90102105-115 = "次回;駅弁"
