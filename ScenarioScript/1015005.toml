[translation]
1015005-1 = "#title;표류하는 범고래"
1015005-3 = "#place;로도스 호"
1015005-4 = "#na;(트라이던트에서의 업무를 마치고, 코토네가 휴식을 취하고 있다는 <로도스 호>의 현측으로 향했다.)"
1015005-5 = "#na;(하지만 막상 도착한 현측에는 코토네는 물론이고, 지나다니는 학생의 모습도 거의 보이지 않았다.)"
1015005-6 = "[ns] \"……코토네?\""
1015005-8 = "3;트라이던트 부원;00\n#3;a\n#wait;1000"
1015005-9 = "3;트라이던트 부원;02;어라, 선생님? 아직 안 돌아가셨나요?\n#3;em;[반응]"
1015005-10 = "3;트라이던트 부원;01;혹시 누군가 찾고 있는 사람이라도……?"
1015005-11 = "[s] \"다이빙 부의 부부장을 찾고 있는데……\""
1015005-12 = "3;트라이던트 부원;03;다이빙 부의 부부장이라면…… 후치가미 양 말씀이시군요."
1015005-13 = "3;트라이던트 부원;02;후치가미 양이라면 아까 이 근처에 있긴 했었는데……\n#3;em;[…]"
1015005-14 = "3;트라이던트 부원;05;마지막으로 보았을 때는 물에 떠내려가고 있었어서, 지금은 어디에 있을지 잘 모르겠네요."
1015005-15 = "[s1] \"물에 떠내려가고 있었다고?!\"\n[s2] \"그거 큰일이잖아!\""
1015005-18 = "3;트라이던트 부원;04;아, 네 그렇긴 하지만……"
1015005-19 = "3;트라이던트 부원;02;아마 후치가미 양이라면 괜찮을 거예요."
1015005-20 = "3;트라이던트 부원;03;평소에도 그렇게 누워서 종종 휴식을 취하는 모양이니까—"
1015005-23 = "#na;트라이던트 부원;……가버리셨네."
1015005-25 = "#na;(잠시 후, 현측을 따라 10분 정도 달린 끝에……)"
1015005-26 = "#na;(잔잔한 바다 한 가운데 누워, 눈을 감고 있는 코토네를 볼 수 있었다.)"
1015005-27 = "[ns] \"코토네!\""
1015005-28 = "#na;(하지만 코토네는 내 목소리가 들리지 않는지 여전히 눈을 감은 채 물 위에 부유하고 있었다.)"
1015005-29 = "[ns] \"코토네—!\""
1015005-31 = "#na;코토네;누가 나를 부르나……?"
1015005-32 = "#na;코토네;어라…… 선생님?"
1015005-36 = "#st;[-1200,-530];serial;60;[wa:1740]― [log=코토네]아, [wa:1180]선생님. [/log]"
1015005-38 = "#st;[-1200,-630];serial;60;― [log=코토네]와 주었구나.[/log]"
1015005-41 = "#st;[-1200,-530];serial;60;― [log=코토네]미안. [/log]"
1015005-43 = "#st;[-1200,-630];serial;60;― [log=코토네]귀가 물 속에 잠겨 있어서 부르는 걸 미처 알아차리지 못했어.[/log]"
1015005-46 = "[ns] \"그렇게 있어도 괜찮은 거야?\""
1015005-47 = "#st;[-1200,-530];serial;60;[wa:1000]― [log=코토네]응? [wa:1440]이 책 [wa:1140]말하는 거야?[/log]"
1015005-49 = "#st;[-1200,-630];serial;60;― [log=코토네]괜찮아. 물에 젖지 않도록 [wa:1720]방수 처리된 책이거든.[/log]"
1015005-52 = "[ns] \"아니, 코토네의 이야기였어.\""
1015005-53 = "#st;[-1200,-530];serial;60;[wa:1370]― [log=코토네]그게 아니라고……?[/log]"
1015005-55 = "#st;[-1200,-630];serial;60;― [log=코토네]물 위에서 자면 위험하니까……?[/log]"
1015005-58 = "#st;[-1200,-530];serial;60;― [log=코토네]괜찮아, [wa:1890]자주 해봤으니까.[/log]"
1015005-60 = "#st;[-1200,-630];serial;60;― [log=코토네]게다가 [wa:1820]여기 누워 있는 거, [wa:1830]꽤 기분 좋거든.[wa:40] [/log]"
1015005-63 = "#st;[-1200,-530];serial;60;[wa:1080]― [log=코토네]따사로운 햇볕을 마주하며, [wa:1620]수면 아래의 소리에 귀를 기울일 수 있으니……[/log]"
1015005-66 = "#st;[-1200,-530];serial;60;― [log=코토네]침잠하는 것들의 [wa:2360]목소리를 듣는다는 [wa:2270]점에서,[wa:160] [/log]"
1015005-68 = "#st;[-1200,-630];serial;60;― [log=코토네]독서와 다이빙은 닮은 구석이 많은 것 같아.[/log]"
1015005-71 = "#st;[-1200,-530];serial;60;[wa:1500]― [log=코토네]선생님. [wa:1450]선생님도 나와 함께 이 위에 누워 보지 않을래?[/log]"
1015005-73 = "#st;[-1200,-630];serial;60;― [log=코토네]내가…… [wa:2170]수면 아래의 이야기를 [wa:3490]잔뜩 들려 줄게.[wa:120] [/log]"
1015005-77 = "[ns3] \"코토네가 그렇게 말한다면……\"\n[ns4] \"……그럼 나도 한 번 시도해볼까?\""
1015005-80 = "#na;(코토네를 따라 구명 조끼를 착용한 채 물 위에 착수했다.)"
1015005-81 = "#na;(약간의 시행착오를 거쳐, 물 위에서 눕는 자세를 취하는 데에는 성공했지만……)"
1015005-82 = "#st;[0,0];instant;1;"
1015005-85 = "3;코토네;00\n#3;a\n#wait;1000"
1015005-86 = "3;코토네;03;어때, 선생님?"
1015005-87 = "[s] \"으음……\""
1015005-88 = "#st;[0,0];instant;1;"
1015005-91 = "[ns5] \"자꾸 파도가 얼굴을 적셔서 불편한데……\"\n[ns6] \"조금만 균형을 잃어도 가라앉을 것 같아……\""
1015005-94 = "3;코토네;02;음, 선생님에게는 조금 어려웠으려나."
1015005-95 = "3;코토네;03;역시 선생님은 포식자보다는 피식자에 가까운 느낌이네."
1015005-96 = "3;코토네;02;그러니까 선생님, 다른 학생이 달콤한 말로 유혹하더라도 이렇게 쉽게 다가와서는 안 돼."
1015005-97 = "#st;[0,0];instant;1;"
1015005-99 = "3;코토네;02\n#3;d\n#wait;1000"
1015005-100 = "3;코토네;01\n#3;a\n#3;closeup\n#wait;1000"
1015005-101 = "3;코토네;01;미끼를 들어 사냥감을 물 속으로 유인하는 건 범고래의 전형적인 사냥법이니까.\n#3;closeup"
1015005-102 = "[s] \"설마…… 방금 나, 사냥당한 거야?\""
1015005-103 = "3;코토네;03;글쎄, 어떠려나.\n#3;closeup"
1015005-104 = "3;코토네;02;그러니까 선생님.\n#3;closeup"
1015005-105 = "3;코토네;09;먹잇감이 되고 싶지 않으면 열심히 발버둥 쳐 봐.\n#3;closeup\n#3;em;[하트]"
