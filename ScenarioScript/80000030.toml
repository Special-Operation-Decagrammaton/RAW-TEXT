[translation]
80000030-1 = "가짜 수갑"
80000030-2 = "발키리 생활안전국 사무실"
80000030-3 = "선생님, 선생님. 이걸 봐주세요!"
80000030-4 = "후후, 이게 무엇인지 알아보시겠나요?"
80000030-9 = "[ns] \"수갑…… 아니야?\""
80000030-10 = "네, 하지만 절반만 정답입니다!"
80000030-11 = "이건 사실 진짜 수갑이 아니라, 수갑 모양의 초콜릿입니다."
80000030-12 = "오늘 오전에 순찰을 나갔는데 발렌타인 데이를 기념하여 가게에서 이런 특이한 모양의 초콜릿을 팔고 있더라고요."
80000030-13 = "이 수갑 모양의 초콜릿을 보고 있노라니, 좋은 생각이 떠올라서 바로 구입했습니다!"
80000030-14 = "[s] \"좋은 생각?\""
80000030-15 = "네. 수갑은 범죄자를 구속하기 위해 사용하는 도구이니까요."
80000030-16 = "그래서 범죄자를 붙잡으면 멀리 도망가지 못하도록 제 손에 한쪽을, 범죄자의 손에 한쪽을 채우는데……."
80000030-17 = "저는 잔 실수가 잦다 보니, 가끔은 제 손만 결박된 채 범죄자를 놓칠 때가 자주 있었거든요……."
80000030-18 = "그래서 언제나 수갑을 잘못 찼을 때 부숴버릴 수 있는 괴력이 있으면 좋겠다고 늘 생각했습니다만……."
80000030-23 = "이 초콜릿 수갑만 있다면 그런 걱정을 할 필요는 없습니다!"
80000030-24 = "수갑을 잘못 차게 되더라도, 조금만 힘을 주면 산산조각을 낼 수 있으니까요."
80000030-25 = "게다가 잠복근무 중에 급하게 당분이 필요할 때 먹을 수도 있으니…… 일석이조의 물건이지요."
80000030-26 = "어떤가요, 선생님? 저의 완벽한 계획이!"
80000030-27 = "[s] \"하지만 그건 범죄자도 마찬가지 아냐?\""
80000030-31 = "그, 그렇네요. 제가 힘으로 부술 수 있는 수갑이라면, 그건 범죄자도 마찬가지일 테니……."
80000030-32 = "결국 구속의 의미가 없게 되어 버립니다……."
80000030-33 = "우으…… 어쩌죠, 선생님…… 공무에 도움이 될 거라 생각해서 경비 처리를 해버렸는데……."
80000030-34 = "이대로는 또 높으신 분들께 혼나 버리고 말 거예요……."
80000030-36 = "(결국 키리노는 엉뚱한 곳에 경비를 쓴 벌로 시말서를 쓰게 되었다…….)"
80000030-37 = "(사용할 수 없게 된 수갑 모양의 초콜릿은 선물로 받았다.)"
