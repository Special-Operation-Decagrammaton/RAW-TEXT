[translation]
212100-1 = "第10話;レジスタンス結成"
212100-7 = "[ns] \"みんな顔見知りだよね？\""
212100-9 = "……この組み合わせ、本気なのか？"
212100-11 = "力を合わせるって、風紀委員会と万魔殿だったの……？"
212100-12 = "ちょっと、ちょっと！信用していいの？"
212100-13 = "問題の中心にいるのって、この子らの先輩じゃん？"
212100-15 = "言い方はあれですが、反論の余地がありません……！"
212100-16 = "おい、ゲヘナ再興委員会、口の利き方には気をつけろ。"
212100-17 = "それに、怪しいのはお前らもだからな？"
212100-18 = "へぇ？何が怪しいっていうわけ？"
212100-19 = "いつも言ってたよな、「一つになったゲヘナ」って。"
212100-20 = "この状況、無関係なわけないだろ？"
212100-21 = "そ、れは私たちにも分からなくて……！こんなの望んでなかったってば！！"
212100-22 = "皆さん、落ち着いてください。"
212100-28 = "ここにいるのは先生が集めた生徒だけです。"
212100-29 = "信用する理由はそれで十分ではないでしょうか。"
212100-30 = "むぅ……。"
212100-32 = "……まあ、それはそう。"
212100-34 = "流石は先生。信頼が厚いですね。……まあ、私も同意見ですけど。"
212100-35 = "ともかく、現状に問題を感じる者が集まっている。そういうことでしょう。"
212100-36 = "というか……お前ら、もう1人いなかったか？"
212100-41 = "あ――"
212100-42 = "……ショウコちゃんは考えが違うみたい。"
212100-47 = "風紀委員会の中ですら意見が割れるくらいだしな……。"
212100-48 = "[s] \"大変な状況なのに集まってくれてありがとう。\""
212100-50 = "（分かっていることの全てを説明した）"
212100-54 = "洗脳って……そんなことできるの……？"
212100-55 = "3年生が変わったのも、それが原因……？"
212100-57 = "NKウルトラって本当にあったんですか！？なんで？何のために？"
212100-58 = "[s1] \"急に言われても混乱するとは思う。\"\n[s2] \"でも、何としても阻止しなきゃいけない。\""
212100-61 = "はい、必ず。"
212100-62 = "洗脳を解く方法ってあるの？"
212100-63 = "それは……別で研究中。"
212100-64 = "……できるのかな？"
212100-65 = "原理は不明でも、完全に不可能ではないと聞いています。"
212100-66 = "もしも洗脳が解けなかったら……？"
212100-67 = "……。"
212100-68 = "このまま進んで、キヴォトス全部がゲヘナになるなんて、私は嫌だよ！"
212100-69 = "そんなの誇れるゲヘナじゃないもん！"
212100-70 = "私が作りたかったのは、いつも堂々としていられて恥ずかしくないゲヘナなの。#n誰かを踏みにじるようなのじゃなかったんだから！"
212100-71 = "どれだけ強くたって、そんなのは絶対ヤダ！"
212100-72 = "やはっ！そういうこと！誰彼構わず撃つための銃じゃないんだからさ！"
212100-73 = "……嫌いじゃないよ、そういうの。"
212100-74 = "私も、マユミ委員長のお話には賛成です。"
212100-75 = "私たちは、越えてはならない線を守るために風紀委員会に入りました。"
212100-76 = "その線は必ずしも明文化されているわけではありません。#n時には自分で判断しなければならないものだと思っています。"
212100-77 = "今がその時なんだ。線を越えようとするのがゲヘナそのものでも、貫いてみせる。"
212100-78 = "……その相手が身内だとしても。"
212100-79 = "委員長……行政官……。"
212100-91 = "手掛かりが見つかったわ！"
212100-95 = "うわっ、万魔殿の議員！！"
212100-96 = "ねぇ、この人3年生じゃないの？"
212100-98 = "あら、あなた達もいたのね。呼ぶとは聞いていたけど。"
212100-99 = "3年生はみんなおかしくなったって話じゃなかった？"
212100-100 = "サツキ先輩は例外です。さっき言ったでしょう？NKウルトラを研究していたと。"
212100-101 = "あ、そっか。びっくりした。"
212100-107 = "ふーん、チアキも来たのね。"
212100-108 = "はい～！マコト先輩があんな風になっちゃったのに、じっとしてなんていられません！"
212100-109 = "サツキ先輩までこっち側だとは思ってませんでしたけど！"
212100-110 = "あっちとかこっちとか……間違ってはいない表現かもしれないわ。"
212100-114 = "じゃあ今、イブキは？"
212100-115 = "……。"
212100-116 = "ここに連れてくるには、さすがにまだ幼いものね。"
212100-117 = "なにせ「反逆者クラブ」なのだから。"
212100-119 = "反逆者って……。"
212100-121 = "イブキは何も知らないままの方がいいのかもしれません。"
212100-122 = "……それはそうと、サツキ先輩は手掛かりを見つけたのでは？"
212100-123 = "あ、そうそう。ふふ。聞いて驚きなさい。"
212100-124 = "[s] \"何か分かったの？\""
212100-125 = "ええ。ここからはよく聞いて頂戴。"
212100-126 = "人間の神経網にはそれぞれ固有の共振周波数がある。それは知っているわよね？"
212100-127 = "いや、全然。"
212100-128 = "そう……まぁ知らなくても構わないわ。"
212100-129 = "真なるNKウルトラ計画――つまり雷帝の洗脳は、この固有振動数を外部の周波数によって強制同期させた……と仮定してみたの。"
212100-130 = "すると、1つの仮説が浮かぶわ。"
212100-131 = "脳波を特定の状態に無理やり固定しているのだとしたら、#n波の打ち消し効果でその固定を解けるかしら？"
212100-132 = "……え、あの、何て？"
212100-133 = "それが可能なのよ！理論上は！"
212100-134 = "でも、本当の問題はここから。"
212100-135 = "この方法は、洗脳に使われた周波数が分かっていることが大前提。"
212100-136 = "どうやって割り出すのかが問題なのよね。#nもう1回洗脳してみろ、なんて言えるわけもないし。"
212100-137 = "……あ。言ってることはほとんど分からなかったですけど、#n最後のだけ心当たりあるかもです！"
212100-138 = "教えて頂戴。"
212100-139 = "それ、放送室にあるんじゃないですか？"
212100-143 = "マコト先輩の演説は放送室の機材を使っていました。"
212100-144 = "一緒にずっと流れてたノイズとか変な単語も同じなのかも？"
212100-145 = "放送室を探れば、何か出てくるんじゃないかなって……。"
212100-148 = "……。"
212100-149 = "あ、やっぱり的外れでしたかね？"
212100-151 = "違うわ、逆よ！大手柄！どうしてその発想に至らなかったのかしら！"
212100-153 = "鋭い着眼点だと思いますよ。"
212100-154 = "あはっ、記者としての勘ってやつですかね。"
212100-155 = "じゃあ放送室に行けば何とかできるの！？"
212100-156 = "まだ何とも言えないけれど、使われた機材を解析できれば手掛かりは得られるはずよ。"
212100-157 = "そのために必要なのは、キャリアウェーブを抽出できる装置と――"
212100-163 = "[ns] \"なんか、うまくいきそう……！\""
212100-165 = "（楽観は禁物だが、小さくとも希望が芽生えた気がした……）"
212100-167 = "次回;そばにいたい"
