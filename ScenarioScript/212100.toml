[translation]
212100-1 = "第10話;反抗軍成立"
212100-3 = ""
212100-4 = ""
212100-6 = ""
212100-7 = "[ns] 「大家都見過面了吧？」"
212100-9 = "真的假的？#n這種組合……？"
212100-11 = "說要聯手的對象，是風紀委員會和萬魔殿……？"
212100-12 = "等等，等等！#n這些傢伙可以信任嗎？"
212100-13 = "現在在鬧事的不就是他們的前輩嗎？"
212100-15 = "嗚哇，雖然說得很難聽卻沒說錯，完全無法反駁……！"
212100-16 = "喂，再興委員會。#n你們說話小心點。"
212100-17 = "而且你們也一樣可疑好嗎？"
212100-18 = "啊？哪裡可疑了？"
212100-19 = "你們老是掛在嘴邊的，不就是「合而為一的格黑娜」嗎？"
212100-20 = "想想現在的狀況，怎麼可能沒有關聯？"
212100-21 = "那個我們也不太清楚……！！#n但我們才不想要這種結果！"
212100-22 = "請大家先冷靜一下。"
212100-23 = ""
212100-25 = ""
212100-26 = ""
212100-27 = ""
212100-28 = "在場的各位，都是老師召集來的人。"
212100-29 = "我想光是這一點，應該就足以證明身分了……"
212100-30 = "……唔嗯。"
212100-32 = "……那倒是。"
212100-34 = "老師……你真是深受學生信賴呢。#n不過我也是這麼想的就是了。"
212100-35 = "在場的所有人，應該都意識到現在的狀況有問題了吧。"
212100-36 = "話說……你們原本不是還有一個人嗎？"
212100-37 = ""
212100-40 = ""
212100-41 = "啊……"
212100-42 = "……翔子醬的想法好像跟我們不一樣。"
212100-43 = ""
212100-46 = ""
212100-47 = "唔嗯……也是。#n就連我們風紀委員會內部，意見也有分歧……"
212100-48 = "[s] 「大家處境都很艱難，謝謝你們願意聚在這裡。」"
212100-50 = "（詳細說明了目前正在發生的一連串狀況及其原因）"
212100-53 = ""
212100-54 = "洗腦……？#n真的有那種東西……？"
212100-55 = "3年級生會突然改變，就是因為那個……？"
212100-57 = "等，等一下。#nNK-ULTRA真的存在嗎？那個？為什麼？怎麼會？"
212100-58 = "[s1] 「大家應該都很混亂……」\n[s2] 「但無論如何都得解決這個狀況。」"
212100-61 = "是的。一定要。"
212100-62 = "可是有辦法解除洗腦嗎？"
212100-63 = "這個……我們正在另外研究。"
212100-64 = "……做得到嗎？"
212100-65 = "雖然不太清楚機制，但聽說並非完全不可能。"
212100-66 = "如果解不開洗腦的話……會怎麼樣呢？"
212100-67 = "……"
212100-68 = "就算真的爆發戰爭，格黑娜真的征服了奇普托斯，我也不要！"
212100-69 = "因為那不是能讓人引以為傲的格黑娜！"
212100-70 = "我想打造的，是對誰都能抬頭挺胸、問心無愧的格黑娜──#n而不是用鐵與血踐踏他人！"
212100-71 = "不管再怎麼強大，我都絕不容許那種事發生！"
212100-72 = "呀哈！對嘛對嘛！#n槍又不是拿來隨便對人開的東西！"
212100-73 = "氣勢不錯嘛……我不討厭你們這一點。"
212100-74 = "我也同意真由美委員長的說法。"
212100-75 = "伊織和我都是為了守住必要的界線，才加入風紀委員會的。"
212100-76 = "那條界線也許是明文規定的紀律，但我認為有時候也必須自己判斷。"
212100-77 = "沒錯。如果格黑娜想越過那條界線，就算要戰鬥我也會貫徹到底。"
212100-78 = "就算渾身是血地倒下，我也要大喊「不准越過這條界線」！"
212100-79 = "委員長、首席行政官……"
212100-80 = ""
212100-84 = ""
212100-86 = ""
212100-87 = ""
212100-90 = ""
212100-91 = "我找到線索了！"
212100-92 = ""
212100-95 = "嗚哇，是萬魔殿的議員！！"
212100-96 = "等等，這個人不是3年級嗎？"
212100-98 = "啊，原來你們也在啊。#n我是有聽說會叫你們來。"
212100-99 = "不是說3年級生全都變得怪怪的嗎？"
212100-100 = "不，皐月前輩是例外。#n剛才不是說過了嗎？他是研究NK-ULTRA的人。"
212100-101 = "啊……對耶。#n嚇了我一跳。"
212100-102 = ""
212100-104 = ""
212100-106 = ""
212100-107 = "哼嗯，千秋也來了啊。"
212100-108 = "是～！真琴前輩都變成那樣了，我怎麼能坐視不管嘛。"
212100-109 = "雖然我也沒想到皐月前輩會是我們這邊的人！"
212100-110 = "我們這邊啊……這個說法或許也沒錯。"
212100-111 = ""
212100-113 = ""
212100-114 = "咦？那現在伊吹是一個人嗎？"
212100-115 = "……"
212100-116 = "哼嗯……要把伊吹帶來這裡，他終究還太小了。"
212100-117 = "反而可能會讓他更危險。#n這裡可是「叛徒俱樂部」不是嗎？"
212100-119 = "叛徒什麼的……"
212100-121 = "讓伊吹什麼都不知道，或許還比較好。"
212100-122 = "對了，皐月前輩，你不是找到線索了嗎？"
212100-123 = "啊，對了。呵呵。"
212100-124 = "[s] 「你查到什麼了嗎，皐月？」"
212100-125 = "嗯。我從頻率的角度思考了一下。#n好了，接下來要注意聽哦？"
212100-126 = "大家應該都知道，所有人類的神經網路都有各自固有的共振頻率吧？"
212100-127 = "……不知道耶？我完全沒聽過。"
212100-128 = "哎呀，不知道也沒關係。#n我繼續說明。"
212100-129 = "真正的NK-ULTRA計畫，也就是雷帝的洗腦──#n假設它是透過外部頻率，強制同步了這個固有振動頻率。"
212100-130 = "那麼問題來了。"
212100-131 = "如果是把腦波強制固定在特定狀態，能不能透過波的相消干涉來解除那個固定呢？"
212100-132 = "呃……你說什麼？"
212100-133 = "理論上是可行的！"
212100-134 = "不過真正的問題在後頭。"
212100-135 = "要使用剛才說的方法，就必須查出實際洗腦時所用的頻率……"
212100-136 = "問題是要怎麼查出來。#n總不能叫對方再洗腦一次吧。"
212100-137 = "哇，皐月前輩！#n雖然你說的我幾乎都聽不懂，但關於最後那個問題，我好像有點頭緒！"
212100-138 = "想到什麼就說說看吧，千秋。"
212100-139 = "那個，會不會在廣播室裡呢？"
212100-140 = ""
212100-142 = ""
212100-143 = "因為真琴前輩演講的時候，使用的是廣播室的設備吧？"
212100-144 = "而且透過廣播設備，一直傳出雜訊和奇怪的詞語之類的。"
212100-145 = "所以我在想，搜一搜廣播室會不會找到些什麼……"
212100-146 = ""
212100-148 = "……"
212100-149 = "呃，我說錯什麼了嗎？"
212100-151 = "不！完全沒有！#n我怎麼都沒想到呢？"
212100-153 = "千秋，真是太敏銳了……！"
212100-154 = "啊哈，算是記者的直覺吧。"
212100-155 = "那只要進到廣播室……就能解決這個狀況了嗎！？"
212100-156 = "雖然要去了才知道，但只要分析當時使用的設備，應該就能得到線索。"
212100-157 = "我要準備的是能提取載波的設備，還有……"
212100-163 = "[ns] 「總覺得會很順利……！」"
212100-165 = "（雖然不能妄下定論，但感覺心中萌生了能解決狀況的希望……）"
212100-167 = "下一話;想待在你身邊"
