[translation]
2006206-1 = "#title;우리 모두 화학!"
2006206-2 = "3;에리나;05\n#3;a\n#wait;1000"
2006206-3 = "3;에리나;07;으아, 이번에도 실패!!\n#3;stiff"
2006206-4 = "3;에리나;08;장비가 고물딱지라서 도저히 안 돼요! 끄아악-!\n#3;hophop"
2006206-5 = "[s] \"뭘 만들려는 거야……?\""
2006206-6 = "3;에리나;10;선물을 미리 알려드리면 안 되지만, 포기했으니 알려드릴게요…….\n#3;em;[한숨]"
2006206-7 = "3;에리나;05;인공 다이아몬드를 만들고 있었어요. 529캐럿까지 잘 되다가 1캐럿의 벽을 못 넘고 이번에도 불타버렸어요……."
2006206-8 = "3;에리나;08;이게 나의 한계인가……. 분하다……!!\n#3;em;[속상함]"
2006206-9 = "[s] \"한계라고 하기엔 충분히 대단하긴 한데?!\""
2006206-10 = "#st;[0,0];instant;1;"
2006206-13 = "[ns] \"그보다 다이아몬드는 왜…….\""
2006206-14 = "3;에리나;02;주워 온 잡지에서 선물 고르는 법에 대한 기사를 읽었거든요! 선물을 주면, 감사 인사도 할 수 있고 마음을 표현할 수 있다는 거예요.\n#3;jump"
2006206-15 = "3;에리나;01;선생님께는 이래저래 신세도 많이 졌고-? 그래서 선물을 드리고 싶었는데 뭘 드려야 할지 전혀 모르겠는 거예요. 선물이 부담될 수도 있다고도 해서요!"
2006206-16 = "3;에리나;06;너무 실용적이어도 정 없어 보이고, 그렇다고 쓸모가 전혀 없으면 받는 입장에서 필요 없으니, 마음이 안 가고. 너무 비싸거나 값이 싸도 문제고…… 엄청 복잡한 거예요."
2006206-17 = "3;에리나;11;그러다가 따-악! 떠올랐죠! 다이아몬드면 되겠구나!\n#3;em;[전구]"
2006206-18 = "3;에리나;00;필요하면 쪼개서 드릴 재료로 쓸 수도 있고, 쓸모없더라도 장식해도 되고, 직접 만드는 거라서 엄청 비싸지도 싸지도 않으니까 딱이잖아요!"
2006206-19 = "3;에리나;03;……뭐어, 형편없이 실패했지만요.\n#3;em;[땀]"
2006206-20 = "[s] \"기특한 마음이 가장 큰 선물이란다!\""
2006206-21 = "3;에리나;06;이거, '마음만 받을게!'잖아요! 그것도 잡지에서 알려줬어요!"
2006206-22 = "3;에리나;08;선생님, 이건 '내가 선물을 주고 싶다'의 문제이기도 해요! 마음먹었으면 끝장을 봐야 속이 시원하니까요! 으아아!\n#3;hophop"
2006206-23 = "3;에리나;05;한 번 더 해보면 될 것 같은데, 50시간만 기다려주시겠어요? 금방 만들어드릴 테니까요!"
2006206-24 = "3;에리나;02;아니면 갖고 싶은 선물을 말해주시면, 그대로 만들어드릴게요!"
2006206-25 = "[s] \"에리나가 주는 거라면 뭐든지 좋아!\""
2006206-26 = "3;에리나;09;으음~ 뭘 만들지. 다이아몬드로 만든 제 흉상……?\n#3;em;[...]"
2006206-27 = "3;에리나;10;으음……."
2006206-28 = "3;에리나;00;아! 이거다!\n#3;em;[전구]"
2006206-29 = "3;에리나;03;선생님! 여기서 조금만 기다려주세요! 금방 다녀올게요!"
2006206-30 = "#st;[0,0];instant;1;"
2006206-32 = "3;에리나;03\n#3;dr\n#wait;1000"
2006206-34 = "#na;3시간 후……."
2006206-37 = "#na;저녁이 되고 눈보라가 불기 시작했다."
2006206-38 = "[ns] \"안 되겠다, 찾으러 가야겠어……!\""
2006206-40 = "#na;에리나;콜록……! 에취-!\n#fontsize;50"
2006206-41 = "#na;에리나;으으-! 추워라! 콜록!"
2006206-42 = "#st;[0,0];instant;1;"
2006206-46 = "3;에리나;23\n#3;a"
2006206-47 = "3;에리나;24;다녀왔습니다! 콜록!\n#3;jump"
2006206-48 = "[s] \"괜찮아? 걱정했었어!\""
2006206-49 = "3;에리나;14;걱정 마세요! 혹시 몰라서, 돌아올 수 있게 줄 매달고 다녀왔으니까요!\n#3;em;[음표]"
2006206-50 = "3;에리나;11;자자, 추우니까 불 끄고 이불로 들어오세요!\n#3;greeting"
2006206-51 = "3;에리나;03;보여드릴 게 있어요!\n#3;em;[반짝]"
