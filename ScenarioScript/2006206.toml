[translation]
2006206-1 = "우리 모두 화학!"
2006206-3 = "으아, 이번에도 실패!!"
2006206-4 = "장비가 고물딱지라서 도저히 안 돼요! 끄아악-!"
2006206-5 = "[s] \"뭘 만들려는 거야……?\""
2006206-6 = "선물을 미리 알려드리면 안 되지만, 포기했으니 알려드릴게요……."
2006206-7 = "인공 다이아몬드를 만들고 있었어요. 529캐럿까지 잘 되다가 1캐럿의 벽을 못 넘고 이번에도 불타버렸어요……."
2006206-8 = "이게 나의 한계인가……. 분하다……!!"
2006206-9 = "[s] \"한계라고 하기엔 충분히 대단하긴 한데?!\""
2006206-13 = "[ns] \"그보다 다이아몬드는 왜…….\""
2006206-14 = "주워 온 잡지에서 선물 고르는 법에 대한 기사를 읽었거든요! 선물을 주면, 감사 인사도 할 수 있고 마음을 표현할 수 있다는 거예요."
2006206-15 = "선생님께는 이래저래 신세도 많이 졌고-? 그래서 선물을 드리고 싶었는데 뭘 드려야 할지 전혀 모르겠는 거예요. 선물이 부담될 수도 있다고도 해서요!"
2006206-16 = "너무 실용적이어도 정 없어 보이고, 그렇다고 쓸모가 전혀 없으면 받는 입장에서 필요 없으니, 마음이 안 가고. 너무 비싸거나 값이 싸도 문제고…… 엄청 복잡한 거예요."
2006206-17 = "그러다가 따-악! 떠올랐죠! 다이아몬드면 되겠구나!"
2006206-18 = "필요하면 쪼개서 드릴 재료로 쓸 수도 있고, 쓸모없더라도 장식해도 되고, 직접 만드는 거라서 엄청 비싸지도 싸지도 않으니까 딱이잖아요!"
2006206-19 = "……뭐어, 형편없이 실패했지만요."
2006206-20 = "[s] \"기특한 마음이 가장 큰 선물이란다!\""
2006206-21 = "이거, '마음만 받을게!'잖아요! 그것도 잡지에서 알려줬어요!"
2006206-22 = "선생님, 이건 '내가 선물을 주고 싶다'의 문제이기도 해요! 마음먹었으면 끝장을 봐야 속이 시원하니까요! 으아아!"
2006206-23 = "한 번 더 해보면 될 것 같은데, 50시간만 기다려주시겠어요? 금방 만들어드릴 테니까요!"
2006206-24 = "아니면 갖고 싶은 선물을 말해주시면, 그대로 만들어드릴게요!"
2006206-25 = "[s] \"에리나가 주는 거라면 뭐든지 좋아!\""
2006206-26 = "으음~ 뭘 만들지. 다이아몬드로 만든 제 흉상……?"
2006206-27 = "으음……."
2006206-28 = "아! 이거다!"
2006206-29 = "선생님! 여기서 조금만 기다려주세요! 금방 다녀올게요!"
2006206-34 = "3시간 후……."
2006206-37 = "저녁이 되고 눈보라가 불기 시작했다."
2006206-38 = "[ns] \"안 되겠다, 찾으러 가야겠어……!\""
2006206-40 = "콜록……! 에취-!"
2006206-41 = "으으-! 추워라! 콜록!"
2006206-47 = "다녀왔습니다! 콜록!"
2006206-48 = "[s] \"괜찮아? 걱정했었어!\""
2006206-49 = "걱정 마세요! 혹시 몰라서, 돌아올 수 있게 줄 매달고 다녀왔으니까요!"
2006206-50 = "자자, 추우니까 불 끄고 이불로 들어오세요!"
2006206-51 = "보여드릴 게 있어요!"
2006206-59 = "[wa:430]― [log=에리나]히힛, [wa:1040]예쁘죠? [wa:1740]콜록콜록.[/log]"
2006206-61 = "― [log=에리나]눈송이를[wa:1300] 폴리비닐아세탈수지용액으로 [wa:1040]보존한 거예요.[/log]"
2006206-64 = "― [log=에리나]시간이 지나도, [wa:1430]따듯한 곳에서도 영원히 녹지 않아요.[/log]"
2006206-67 = "[wa:1070]― [log=에리나]제일 [wa:1160]크고 예쁜 [wa:1010]눈송이를 고르다 보니……[wa:40] [/log]"
2006206-69 = "― [log=에리나]시간 가는 줄 몰랐어요. [/log]"
2006206-72 = "― [log=에리나]훌-쩍……[wa:2240] 기왕 만드는 거, [wa:1040]영구 야광 [wa:910]눈송이로 만들어봤어요.[/log]"
2006206-75 = "― [log=에리나]어때요?[wa:40] [/log]"
2006206-77 = "― [log=에리나]이걸 볼 때마다, [wa:1420]저를 떠올려 주시겠어요?[wa:80] [/log]"
2006206-80 = "[ns] \"물론이지! 아주 뜻깊은 선물이야!\""
2006206-82 = "[wa:600]― [log=에리나]후훗! [wa:850]아[wa:360]싸아![/log]"
2006206-84 = "― [log=에리나]좋아해주셔서 다행이에요. [/log]"
2006206-87 = "― [log=에리나]대단하죠……[wa:80] [/log]"
2006206-89 = "― [log=에리나]이것도, [wa:870]저것도, [wa:1100]모든 게[wa:610] [wa:260]다 화학이에요.[/log]"
2006206-92 = "― [log=에리나]선생님도, [wa:1790]저도……[/log]"
2006206-94 = "― [log=에리나]화학으로 설명할 수 있어요.[/log]"
2006206-97 = "[wa:1420]― [log=에리나]보이는 것도, [wa:1650]정보의 처리도, [wa:1430]전기신호일 뿐이에요.[wa:40] [/log]"
2006206-99 = "― [log=에리나]그런데도 서로 반응하는 거예요. [/log]"
2006206-102 = "― [log=에리나]다 그저 전기신호, 반응인데,[/log]"
2006206-104 = "― [log=에리나]감정이란 이름을 붙여버렸어요.[wa:40] [/log]"
2006206-107 = "― [log=에리나]아뇨, [wa:760]그게 [wa:660]싫다는 건 아니에요. 그냥……[/log]"
2006206-110 = "[wa:1420]― [log=에리나]일어나는 반응이, [wa:2880]서로 같으면 좋겠다, [wa:1090]라고 생각해서요.[/log]"
2006206-113 = "― [log=에리나]콜록, [wa:1100]내가 뭐래![/log]"
2006206-115 = "― [log=에리나]저, [wa:730]감기 걸려서 제정신이 아니네요![wa:160] [/log]"
2006206-118 = "― [log=에리나]아하하……! [wa:1260]하하…….[wa:40] [/log]"
2006206-121 = "코, 콜록! 콜록!"
2006206-122 = "[s] \"미안한걸, 선물 만드느라 감기에 걸렸다니…….\""
2006206-123 = "신경 쓰지 마요! 걱정 노노-"
2006206-124 = "진짜 미안하면, 눈에 잘 띄는 곳에 두고 항상 봐주기!"
2006206-125 = "약속이에요, 하-암……."
2006206-126 = "[s] \"물론!\""
2006206-127 = "에헤헤…… 따듯하다."
2006206-128 = "헤……."
2006206-129 = "……쿠울……."
2006206-131 = "에리나는 피곤했는지 깜빡 잠에 들어버렸다."
2006206-132 = "영구 야광 눈송이와 함께, 잠든 에리나를 돌봐주었다."
