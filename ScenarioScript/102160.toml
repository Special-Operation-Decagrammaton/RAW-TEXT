[translation]
102160-1 = "제16화;자치구 방어 작전 - 밀레니엄"
102160-2 = "자, 이번엔 우리 차례야."
102160-4 = "네! 준비되었어요!"
102160-5 = "밀레니엄 자치구의 방어, 저도 돕겠습니다."
102160-7 = "하아…… 성소 소재 분석에…… 데이터 분석…… 이젠 방어 작전까지…… 몸이 열 개라도 부족해……."
102160-14 = "……응? AMAS가?"
102160-16 = "저희를 도우러 온 건가요? 이건 베리타스가……?"
102160-17 = "응? 우리 아닌데? 저걸 해킹할 수 있는 건 히마리 부장 정도일 텐데……."
102160-18 = "어라…… 저도 아닌데요?"
102160-19 = "네? 그, 그럼 누가……. 서, 설마 유령이 움직이고 있는 건가요?!"
102160-24 = "……."
102160-25 = "……."
102160-26 = "……뭐, 상관없으려나요. 도움이라면 늘 부족한 법이기도 하고."
102160-27 = "……그렇네. 자, 그럼 가볼까."
102160-31 = "출발!"
