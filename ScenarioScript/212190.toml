212190-84 = "...Makoto? What are you...?"
212190-85 = ""
212190-87 = ""
212190-88 = "Ew. You look down in the dumps."
212190-89 = "If you try to take responsibility for all this and resign, did you even think about how that would make me look?"
212190-90 = "Because to the whole world, it's sending a message that the chairman of the Pandemonium Society can't even keep her Head Prefect in check!"
212190-91 = "Chairman Makoto! The Head Prefect is speaking with complete sincerity—!"
212190-92 = "Silence, Senior Administrator Amau Ako! It is my turn to speak!"
212190-93 = "Now then, soldiers of Gehenna! Attention!"
212190-94 = "Chairman of the Pandemonium Society...?"
212190-95 = "She was the one to start the war cry, wasn't she?"
212190-96 = "Exactly! It is I! Hanuma Makoto!"
212190-97 = "This whole Kivotos conquest and all the associated shenanigans..."
212190-98 = ""
212190-100 = ""
