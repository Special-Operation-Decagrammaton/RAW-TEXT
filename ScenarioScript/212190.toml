212190-58 = "โดยเฉพาะรุ่นน้องที่ยืนขวางอยู่เบื้องหน้าฉันและต่อต้านจนถึงที่สุด... รวมถึงนักเรียนทุกคนที่กล้าหาญ#nยืนหยัดต่อสู้กับพวกเรา ฉันมีสิ่งที่อยากจะบอก"
