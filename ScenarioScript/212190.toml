212190-128 = ""
212190-129 = "As for you, Sorasaki Hina! I never want to hear another pathetic speech about resignation from you again!"
212190-130 = "You're going to be spending the rest of your life serving under me and cleaning up Gehenna's messes to atone for your sins! Kihehe! Because I say so!"
212190-131 = ""
212190-133 = ""
212190-134 = ""
212190-135 = "...Geez. Selfish to the very end."
212190-136 = "Now! Enough apologies! Everyone, our mission for conquest ends here!"
