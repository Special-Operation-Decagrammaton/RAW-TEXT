212190-177 = "ชื่อนี้... โชโกะจังเป็นคนตั้งไม่ใช่เหรอ ดูเหมือนจะตั้งขึ้นด้วยความหมายว่าต้องการเรียกยุคของ#nผู้เหี้ยมโหดในอดีตกลับมาอีกครั้งนะ"
212190-178 = "ฉันคิดว่าตัวชื่อเองก็ไม่ได้แย่นะ มันมีความหมายว่า 'ฟื้นฟูขึ้นมาใหม่' ไม่ใช่เหรอ?"
212190-179 = "เกเฮนน่าเป็นสถานที่ที่มีอะไรพังหรือระเบิดอยู่ทุกวัน คนอย่างพวกเราก็ต้องคอยฟื้นฟูมันขึ้นมาใหม่#nต่อไปสิ"
