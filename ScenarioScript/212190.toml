212190-430 = "หมายถึง 'อิสรภาพของเกเฮนน่า' ที่ทุกคนร่วมกันสร้างมาตลอด 2 ปีไงล่ะ"
212190-431 = "อิสรภาพที่มาโคโตะจังสร้างขึ้น และพวกนักเรียนก็ยอมรับ จนตอนนี้กลายเป็นสิ่งที่พวกเราทุกคนคุ้นเคย"
