212190-129 = "แล้วก็ โซระซากิ ฮินะ! เลิกพูดเรื่องอ่อนแออย่างลาออกหรือสละอำนาจได้แล้ว!"
212190-130 = "เพราะจากนี้ไปเธอจะต้องทำงานอยู่ใต้บังคับบัญชาของเรา คอยเก็บกวาดเรื่องวุ่นวายของเกเฮนน่า#nไปตลอดชีวิตเพื่อชดใช้ความผิด! คิกคิกคิก! เราตัดสินใจแบบนั้นแล้ว!"
