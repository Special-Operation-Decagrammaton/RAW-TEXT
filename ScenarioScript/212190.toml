212190-119 = "ยัยนี่น่ะต่อสู้อย่างสุดกำลังจนถึงที่สุด เพื่อปกป้องเกเฮนน่าเอาไว้!"
212190-120 = "ถึงจะขวางทางพวกเธอไปชั่วขณะเพราะอิทธิพลของการล้างสมอง แต่นั่นเป็นเพราะประธานโง่ๆ อย่างเราตัดสินใจผิดพลาดต่างหาก!"
212190-121 = "มาโคโตะ เรื่องนั้นฉันเป็นคนเลือกเอง..."
212190-122 = "เงียบไปเลย! ความรับผิดชอบของเธอก็คือความรับผิดชอบของเรา!"
212190-123 = "เรา ฮานุมะ มาโคโตะ จะรับผิดชอบทุกอย่างของเกเฮนน่าเอง! เพราะงั้น นักเรียนทั้งหลาย!"
212190-124 = "ถ้าอยากขว้างก้อนหินใส่ประธานกรรมการวินัย ก็ขว้างมาที่เราให้หมด! เราจะรับไว้ทั้งหมดเอง!"
