[translation]
212190-1 = "제19화;남긴 것들"
212190-3 = "(사건이 일단락된 후……)"
212190-4 = "(게헨나의 모든 학생을 대상으로 발표가 예정되었다.)"
212190-11 = "그런데, 무슨 발표래?"
212190-12 = "몰라. 중요하니까 일단 모여보라던데?"
212190-13 = "……또 저번처럼 폭탄 발표하는 건 아니겠지?"
212190-14 = "아아. 키보토스 정복 말이지."
212190-15 = "……."
212190-16 = "진짜 이상한 일이었어. 그때는 나도 왠지 그래야겠다는 생각이 들었단 말이지?"
212190-17 = "어어. 나도. 그거 안 하면 안 될 것 같은, 뭐 그런 생각?"
212190-18 = "지금은 전혀 아니지. 전쟁은 무슨 놈의 전쟁이야?"
212190-19 = "그러고 보니 전쟁 준비하던 건 다 어떻게 됐지? 안 하기로 한 건가?"
212190-20 = "야야, 너네도 탄약 다 뺏겼었지?"
212190-21 = "어, 맞어. 그거 안 돌려주나? 마일리지로 받긴 했지만."
212190-22 = "아씨, 그거 한정판이었는데. 오늘 발표에서 뭐 얘기 안 나오나?"
212190-27 = "어씨, 나도 모르게 소름이……."
212190-28 = "너도? 나도. 저번에 이 고주파 소리 들은 다음부터 뭔가 이런 소리가 무서워졌달까……."
212190-32 = "[ns] \"…….\""
212190-34 = "야야, 저쪽에서 뭔가 시작 하나보다."
212190-35 = "응? 저건……."
212190-41 = "부장님……."
212190-42 = "……."
212190-44 = "선도부장……?"
212190-45 = "선도부장이 무슨 이야기를 하려고 하는 거지?"
212190-49 = "……게헨나의 학생 여러분."
212190-50 = "먼저, 지난 며칠간 벌어진 비극적인 사태에 대해 선도부장으로서 고개를 숙입니다."
212190-51 = "저는 하나의 주박에 사로잡혀, 그것이 게헨나를 위한 진정한 질서이자 평화라고 믿었습니다."
212190-52 = "여러분의 자유의지를 짓밟고, 키보토스의 정복이라는 허황된 꿈을 위해 총을 든 손은……#n분명 저의 것이었습니다."
212190-53 = "……."
212190-54 = "……으음."
212190-55 = "세뇌 때문이었다는 변명은 하지 않겠습니다."
212190-56 = "결과적으로 저는 제가 그토록 혐오하던 뇌제와 다를 바 없는 행동을 했습니다."
212190-57 = "여러분이 누려야 할 소란스럽고 제멋대로인 일상을, 저의 독단적인 판단으로 지워버리려 했습니다."
212190-58 = "특히, 끝까지 저항하며 제 앞을 가로막았던 후배들…… 그리고 용기 있게 우리에게 맞서주었던 모든 학생에게 말하고 싶습니다."
212190-61 = "부장……."
212190-67 = "여러분이 옳았습니다.#n여러분이 저희를 멈춰주지 않았다면, 게헨나는 돌이킬 수 없는 길을 걸었을지도 모릅니다."
212190-68 = "여러분이 저에게 던질 비난과 원망, 그 모든 것을 피하지 않고 짊어지겠습니다."
212190-69 = "부장님……."
212190-73 = "저는, 오늘부로 선도부장으로서의 모든 권한을 내려놓고……"
212190-74 = "아니!!!"
212190-82 = "마코토……?"
212190-83 = "기다려라, 소라사키 히나! 누구 마음대로 권한을 내려놓는다는 거지?!#n이 하누마 마코토 님은 허락한 적 없다!"
212190-84 = "……마코토? 지금 무슨 짓을……."
212190-88 = "흥, 평소답지 않게 죽상이군."
212190-89 = "일단, 네가 모든 책임을 지고 물러나면 이 몸은 뭐가 되는 거냐?"
212190-90 = "만마전의 의장이 선도부장 하나 단속 못 해서 이 난리가 났다고 광고라도 하라는 건가?!"
212190-91 = "마코토 의장! 지금 부장님은 진심으로……"
212190-92 = "시끄럽다, 아마우 아코 선임행정관! 지금은 이 몸의 차례니까!"
212190-93 = "자, 게헨나의 제군들이여! 똑똑히 들어라!"
212190-94 = "만마전 의장……?"
212190-95 = "전쟁하자고 제일 먼저 소리쳤던 사람이 왜 저기에……."
212190-96 = "그래! 이 몸이다! 하누마 마코토 님이다!"
212190-97 = "이번의 키보토스 정복이니 뭐니 하는 거창한 뻘짓거리……"
212190-101 = "솔직히 말하겠다! 이 몸이 멍청하게도 사라진 뇌제의 망령에게 속아 넘어가서 벌인 일이다!!"
212190-106 = "으, 으아…… 저걸 저렇게 지른다고?"
212190-108 = "……마코토……."
212190-109 = "부끄럽게도, 이 게헨나의 톱인 내가! 고작 사라진 녀석이 남긴 낡은 프로젝트 따위에 휘둘려 너희에게 총을 들라고 명령했다!"
212190-110 = "이 몸의 불찰이고, 이 몸의 패배다! 사과하마! 미안하게 됐다!!"
212190-116 = "정말이지…… 사과 한 번 참 요란하게 하시네요."
212190-117 = "후후…… 마코토 쨩다워."
212190-118 = "하지만! 이 소라사키 히나는 다르다!"
212190-119 = "이 녀석은 끝까지 게헨나를 지키기 위해 고군분투했다!"
212190-120 = "비록 잠시 세뇌의 영향으로 너희를 가로막긴 했지만, 그건 이 멍청한 의장이 제대로 판단하지 못한 탓이란 말이다!"
212190-121 = "마코토, 그건 내가 스스로……"
212190-122 = "닥쳐라! 네 책임은 곧 나의 책임이다!"
212190-123 = "게헨나의 모든 책임은 이 하누마 마코토가 짊어진다! 그러니 학생 제군들!"
212190-124 = "선도부장에게 돌을 던지고 싶다면, 전부 내게 던져라! 이 몸이 전부 받아주마!"
212190-126 = "……우와……."
212190-127 = "뭐야…… 의외로 화끈한 구석이 있잖아?"
212190-129 = "그리고 소라사키 히나! 사퇴니 권한 반납이니 하는 나약한 소리는 집어치워라!"
212190-130 = "너는 앞으로도 이 몸의 밑에서, 평생 게헨나의 뒤치다꺼리를 하며 죄값을 치러야 할 테니까!#n키시싯! 이 몸이 그렇게 정했다!"
212190-135 = "……정말이지. 끝까지 제멋대로네."
212190-136 = "자! 사과는 끝이다! 정복 전쟁은 전면 백지화다!"
212190-137 = "제군들에게 압류했던 탄약과 이것저것 등등은 조만간 만마전이 어떻게든 정산해 줄 거다!"
212190-138 = "모두 돌아가서 게헨나답게 제멋대로 놀도록 해라! 이상!!"
212190-144 = "우와아아아~~!! 멋진데!!"
212190-145 = "그래, 이게 게헨나지!!"
212190-146 = "[ns] \"정말 마코토다운 사과였어…….\""
212190-148 = "……뭐, 결과적으로는…… 분위기가 나쁘지 않네요."
212190-149 = "……응."
212190-150 = "……덕분에, 조금은 어깨가 가벼워진 것 같아."
212190-154 = "부장님."
212190-155 = "……무슨 말을 하려는 건지 알아, 아코."
212190-156 = "……."
212190-157 = "우리는 우리대로 계속해서 사과와 반성을 해나가야겠지."
212190-158 = "방금 마코토가 말한 대로, 책임에게서 도망치지 않고."
212190-159 = "……네. 그래야겠지요."
212190-160 = "일단…… 용감하고 자랑스러운 후배들에게 먼저……."
212190-161 = "응……."
212190-163 = "……."
212190-164 = "의장 선배가 선도부장을 감쌀 줄이야……."
212190-165 = "뭐, 말은 거칠었지만 무슨 생각인지는 잘 느껴지더라."
212190-166 = "카렌, 이거……."
212190-167 = "응."
212190-168 = "어떻게 보면, 이게 정말 게헨나가 하나 되는 순간이 아니었을까?"
212190-169 = "……야핫. 회장, 뭔가 후련한 얼굴인데."
212190-170 = "……우리가 꿈꾸는 위대한 게헨나는, 환상 속에 있는 게 아닐지도 몰라."
212190-171 = "당연하지. 그걸 우리 손으로 만들 테니까 말이야. 안 그래?"
212190-172 = "응! 우리는 게헨나재흥위원회니까!"
212190-176 = "그런데 그 이름, 그대로 쓸 거야?"
212190-177 = "쇼코…… 쨩이 만든 거잖아. 과거 뇌제 시대를 다시 불러오겠다는 뜻으로 지은 것 같은데."
212190-178 = "이름 자체는 나쁘지 않다고 생각해. '다시 일으켜 세운다'는 뜻이잖아?"
212190-179 = "게헨나는 매일 어딘가 부서지고 폭발하는 곳이니까, 우리 같은 사람들이 계속해서 다시 세워야지."
212190-180 = "흐응~ 과거의 영광 같은 거창한 게 아니라, 그냥 우리 일상을 고친다는 의미?"
212190-181 = "맞아. 뇌제가 어쨌든 상관없어. 우리는 우리 방식대로 포기하지 않고 매일매일 게헨나를 우리 손으로 다시 만들 거니까."
212190-182 = "그게 바로 게헨나재흥위원회가 될 거야."
212190-188 = "야하핫! 역시, 그래야 우리 회장이지!"
212190-196 = "……저기, 부장. 아까 광장에서 한 말이면 충분한데. 굳이 이렇게 또……."
212190-197 = "……부장님, 안색이 여전히 좋지 않으세요."
212190-201 = "……이오리. 치나츠. 내가 너희를 공격했던 그 순간의 감각이, 아직도 내 손에 남아있어."
212190-205 = "……너희가 나를 부르며 필사적으로 저항하던 그 눈빛도…… 전부 기억하고 있어."
212190-206 = "……!"
212190-207 = "선도부장으로서, 그리고 한 명의 선배로서…… 절대로 해서는 안 될 짓을 했어."
212190-208 = "너희를 지키겠다고 약속해 놓고, 오히려 내가 너희에게 가장 깊은 상처를 입혔어."
212190-209 = "……정말 미안해. 어떤 말로도 씻을 수 없는 잘못이라는 걸 알아."
212190-214 = "……저 역시 사죄드립니다.#n선배로서 후배들의 진심을 짓밟은 저를…… 부디 용서하지 말아주세요."
212190-218 = "……진짜, 진짜 아팠다고. 탄환도 아팠지만, 우리를 쳐다보던 그 차가운 눈이……"
212190-219 = "총알보다 몇십 배는 더 아팠다고. 가슴에 구멍이 난 것처럼……."
212190-220 = "…………."
212190-221 = "돌아와 달라고 그렇게 소리쳤는데…… 바보 부장! 멍청이 행정관!!"
212190-222 = "미안…… 미안해…… 정말, 진심으로……."
212190-223 = "……부장님. 아코 행정관…… 저도 많이 무서웠습니다."
212190-224 = "우리가 믿어왔던 것들이 무너져 내리는 것 같아서요."
212190-229 = "하지만…… 우리가 다시 총을 들 수 있었던 건, 선배들이 가르쳐준 정의가 우리 안에 살아있었기 때문입니다."
212190-230 = "그래서, 이번에는 선배들 대신 저희가 그 선을 지켰습니다."
212190-231 = "그러니 너무 자책하지 마세요. 저희는 선배들을 원망하기보다, 다시 우리 곁으로 돌아와 준 것에 감사하고 있으니까요."
212190-235 = "……응. 맞아. 돌아와서 정말, 정말 다행이야."
212190-239 = "……고마워. 그리고……"
212190-240 = "정말 대견해. 너희는 나보다 훨씬 더 훌륭한 선도부원이었어."
212190-241 = "헤헤……."
212190-242 = "……후후."
212190-243 = "미안하다는 말은 이제 그만할게. 대신, 내가 저지른 잘못에 대한 속죄는 행동으로 보여주겠어."
212190-244 = "동감입니다. 이번 사태로 인한 피해 복구와 징계 절차, 그리고 유실된 비품 목록 작성까지……#n할 일이 산더미군요."
212190-245 = "두 분, 쉴 틈을 주고 싶지만 상황이 이렇습니다. 바로 복귀할 수 있을까요?"
212190-246 = "하아?! 이렇게 바로 본색을 드러내는구나, 아코 쨩!"
212190-247 = "후후…… 아코 행정관님 나름의 사과 방식 아닐까요?#n'우리는 언제나 너희가 필요하다'는 뜻이겠죠?"
212190-248 = "네. 여러분이 없으면 이 산더미 같은 업무를 어떻게 다 할 수 있을까요."
212190-252 = "부탁드려요. 함께 이 시끄러운 게헨나의 선을…… 지켜주시겠어요?"
212190-256 = "……흥, 어쩔 수 없네!"
212190-262 = "고마워, 모두들……."
212190-265 = "영원한 투쟁…… 이라고 하면 너무 거창하겠지."
212190-266 = "허나 자유란 그런 것이다."
212190-267 = "자유는 결코 완성될 수 없고, 안전하지도 않으며, 끝나지 않으니."
212190-271 = "자유롭다는 것은,"
212190-272 = "계속해서 생각하고, 판단하고, 책임지는 것을 포기하지 않겠다는 선택이다."
212190-273 = "나의……"
212190-274 = "……."
212190-275 = "아니."
212190-276 = "우리의 게헨나는, 앞으로도 계속해서 자유로운 곳으로 남을 것이다."
212190-281 = "그러니 마음껏 즐기고, 누리도록 해라, 제군."
212190-282 = "모든 책임은 이 하누마 마코토 님이 지도록 할 테니."
212190-287 = "아~ 모처럼 분위기를 타서 좋은 연설이었는데요!"
212190-288 = "방송 청취율은 0.3%였네요~!"
212190-292 = "어째서!!!"
212190-297 = "뭐, 예전에도 이 정도였니까. 이게 평소의 게헨나라는 거겠지."
212190-298 = "예전과 같다는 거잖아요. 다행이네요, 어떻게 보면."
212190-299 = "그 난리를 쳤는데도, 크게 달라진 게 없다는 거니까."
212190-300 = "크윽……! 이 몸의 철학과 가치관을 담은, 게헨나 전무후무한 명연설이었거늘!"
212190-301 = "[s] \"나는 잘 들었어, 마코토.\""
212190-305 = "오오! 선생!"
212190-306 = "역시 선생만은 알아주는군. 이 몸이 평소 품고 있던 고결한 이상과 가치를!"
212190-307 = "내 입으로 말하기에는 조금 그렇지만, 어떤 리더가 나타나더라도 이보다 고결한 이상을 설파하기란 쉽지 않을 것이다. 기껏해야 저 극한의 땅, 붉은겨울의 회장 정도일까."
212190-308 = "[s] \"……?\""
212190-309 = "자, 선생. 사양할 것 없다. 이제는 그대도 알았을 터."
212190-310 = "게헨나에 드리운 과거의 사악한 손길은 이 몸의 벼락같은 일갈에 의해 산산조각 분해되어 그 흔적도 찾아볼 수 없게 되었다."
212190-311 = "따라서 게헨나는 영속적이며, 더없이 안전하고, 앞으로도 지금처럼 위대할 것이다."
212190-312 = "지금에야말로 우리가 영원한 동맹을 체결할 가장 좋은 순간이겠지. 안 그런가?"
212190-316 = "[ns] \"고마워, 마코토.\""
212190-318 = "[ns1] \"이번에, 마코토 덕분에 정말 큰 위험을 극복했어.\"\n[ns2] \"선생으로서, 어른으로서 고마워.\""
212190-321 = "……큭."
212190-322 = "그, 그건 반칙이다, 선생…… 그런 얼굴로……."
212190-327 = "나야말로, 선생에게 큰 폐를 끼쳤다."
212190-328 = "……사실, 어떤 식으로 이야기를 꺼내야 할지 몰라 평소처럼 말을 건넸지만……"
212190-329 = "이번에 선생에게 끼친 물리적, 정신적 피해는…… 나로서는 보상할 수 있는 방법이 마땅히 떠오르지 않더군."
212190-330 = "협박하고, 구금하고, 고생시키고…… 그 외 여러 가지 폐해를 종합해서 말이다."
212190-331 = "……어떻게 하면 좋겠나, 선생?"
212190-332 = "어떻게 해야 선생이 만족할 만한 사죄가 될까?"
212190-333 = "[s] \"마코토가, 그대로 마코토인 채 있어 주면 돼.\""
212190-334 = "……?!"
212190-335 = "그건…… 무슨 뜻인가?"
212190-336 = "말 그대로의……? 선생, 나는 그게 어떤 말인지 잘 이해할 수 없다만……."
212190-337 = "[s] \"그럼 그건 숙제야.\""
212190-341 = "[ns] \"내가 말한 뜻을 계속 깊이 생각해 줘.\""
212190-342 = "…………."
212190-343 = "내가 나인 채로 있는다면…… 그걸로 되는 것인가……?"
212190-344 = "나는…… 어떤 사람인가를 되짚어보라는 뜻인가?"
212190-345 = "……어렵구나. 선생의 말은 언제나 나 자신을 되돌아보게 하는군."
212190-349 = "선생이 내준 숙제는 항상 내 가슴속에 깊이 간직하도록 하겠다."
212190-350 = "그리고 나 개인이 아닌, 게헨나의 하누마 마코토로서 또 하나."
212190-351 = "앞으로 다시는 이런 일이 없을 거라 맹세하지."
212190-352 = "게헨나는, 괜찮을 것이다."
212190-353 = "[s] \"응. 믿어, 마코토.\""
212190-354 = "……그래."
212190-355 = "선생의 믿음이 있으니 더 힘내야겠지."
212190-360 = "……."
212190-364 = "그렇게 기운 빠진 모습 보기 싫어요, 선배."
212190-365 = "뭐라? 이 몸에게 하는 말이냐, 이로하?"
212190-366 = "네. 선배요. 바보 같고, 고집 세고, 자존감은 하늘을 찌를 것 같은 마코토 선배요."
212190-367 = "내가 기운이 빠졌다고?"
212190-368 = "다 보여요."
212190-369 = "그날 이후로 계속 잠도 제대로 못 자고 괜히 뒤척이는 거."
212190-370 = "……."
212190-371 = "잘못한 거 누가 몰라요? 실수였든, 피할 수 없는 재난이었든 간에 죄인처럼 있지 마세요."
212190-372 = "뇌제 같은 것도 그만 생각하라고요. '또 이런 일이 일어나면 어떻게 하지?' 전전긍긍."
212190-373 = "불안해하고 무서워하는 거 안 어울려요. 선배한테."
212190-374 = "지금까지 하던 것처럼 그냥 막 지르라고요."
212190-378 = "맨날 저한테 보여주는 것처럼, 자신감 있게 행동해요."
212190-379 = "그래도 된다고요. 마코토 선배는."
212190-386 = "……."
212190-387 = "……."
212190-392 = "……이거, 어지간히 얕보인 모양이군."
212190-393 = "이로하, 네 녀석의 건방진 직언은 잘 들었다. 키시싯."
212190-394 = "허나 고작 그 정도로 이 하누마 마코토 님의 기세가 꺾일 것 같으냐?"
212190-395 = "이 마코토 님께서 범부들과 비슷한 눈높이에서 고민하고 괴로워할 것 같으냐?"
212190-396 = "아니!! 오산이다!!"
212190-397 = "이 몸께서 잠에 들지 못한다면, 단순히 커피를 너무 많이 마셨을 뿐!"
212190-398 = "이 몸께서 죄책감에 몸서리친다면, 모르고 이부키의 푸딩을 먹었을 때뿐!!"
212190-402 = "마코토 선배, 또 이부키의 푸딩 먹었어?"
212190-403 = "아, 아니다! 이번에는 안 그랬다! 냉장고에 그대로 잘 있으니까……!"
212190-408 = "으이그, 또 시작이다."
212190-409 = "……뭐, 어제보단 훨씬 낫네요."
212190-410 = "마코토 쨩은 마코토 쨩이야."
212190-411 = "그러니까, 무슨 일이 있더라도 마코토 쨩이겠지."
212190-412 = "……그렇겠죠?"
212190-413 = "그런데 그때 마코토 선배, 진짜 멋있었던 거 알아요?"
212190-414 = "이렇게 딱~! 하면서! 기합으로 세뇌를 부수는 장면!"
212190-415 = "그때 그 모습에 너무 놀라서 셔터 누르는 걸 잊었지 뭐예요! 아~ 지금도 아깝다니까요!"
212190-416 = "……."
212190-417 = "글쎄…… 사실 그건 기합만으로는 설명이 안 된다."
212190-418 = "예?"
212190-419 = "뭔가, 알 수 없는 것들이 내게 모여드는 기분…… 모종의 기운 비슷한 것이 느껴졌었지."
212190-420 = "내가 행하는 바를 온전히 이룰 수 있도록 돕는 느낌이었다."
212190-428 = "그건 아마, 우리가 그동안 만들어온 게헨나의 힘이 아니었을까."
212190-429 = "응? 무슨 말이냐, 사츠키."
212190-430 = "2년간 모두가 구축해 왔던 '게헨나의 자유' 말이야."
212190-431 = "마코토 쨩이 만들고, 학생들이 받아들이고, 지금 와서는 우리 모두에게 익숙한 자유."
212190-432 = "……."
212190-433 = "뇌제의 사념에 저항하는 후배들의 의지와, 그간 쌓아왔던 시간들이 이뤄낸 결과 아닐까.#n후후, 나는 그렇게 생각해."
212190-434 = "……뭐, 실제로 그랬는지는 모르겠지만……."
212190-435 = "아무튼 선배들이 해왔던 일은 충분히 의미가 있었다는 걸로 할게요."
212190-436 = "후후, 그래. 앞으로도 그럴 거고."
212190-440 = "……키시싯. 누가 하는 일인데 의미가 없겠느냐."
212190-441 = "마코토 선배, 엄청 기분 좋은 얼굴!"
212190-442 = "자~! 딱 좋은 순간이네요! 다 같이, 치즈!"
212190-443 = "[s] \"내가 찍어줄게.\""
212190-444 = "헛! 선생님이요?"
212190-445 = "흐응, 좋은 제안이네. 모처럼이니 함께, 라는 걸까."
212190-446 = "우와~ 모두 다 같이!!"
212190-447 = "만마전, 재집결! 이라는 느낌이네요!"
212190-448 = "……뭐, 나쁘지 않네요."
212190-449 = "키시싯, 모두 이 몸의 곁에 모이도록."
212190-467 = "(아직 남은 이야기들이 많지만,)"
212190-468 = "(지금의 이 순간을 오래도록 기억해두고 싶었다.)"
212190-470 = "다음화;남은 것들"
