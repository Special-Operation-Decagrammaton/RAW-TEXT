212190-107 = ""
212190-108 = "มาโคโตะ..."
212190-109 = "น่าละอายจริงๆ เราเป็นผู้นำของเกเฮนน่าแท้ๆ แต่กลับถูกชักจูงด้วยโปรเจกต์เก่าๆ ที่ยัยคนนั้นทิ้งไว้ จนออกคำสั่งให้พวกเธอหยิบปืนขึ้นมา!"
212190-110 = "นี่คือความผิดและความพ่ายแพ้ของเรา! เราขอโทษ! ขอโทษด้วยจริงๆ!!"
