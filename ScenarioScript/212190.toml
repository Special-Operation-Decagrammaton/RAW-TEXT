212190-171 = "Precisely. Because we're going to build it together, brick by brick. Yes?"
212190-172 = "Yup! Because we're the Gehenna Heritage League!"
212190-173 = ""
212190-175 = ""
212190-176 = "...Do you want to keep that name?"
212190-177 = "Shouko... It was her idea. And yeah, her motivations were to bring back the Tyrant Emperor's era."
212190-178 = "But I don't think the meaning of the name itself is bad, is it? It's about being proud of who we are. It's about rebuilding."
212190-179 = "Gehenna is, and always will be, a place where things explode, buildings get demolished, and on and on. It's people like us who have to be there to rebuild it."
212190-180 = "So, we focus on building our lives right now, not the glory of an empire long past?"
212190-181 = "Exactly. Because I don't care what the Tyrant Emperor did or didn't do. I care about this Gehenna, the one we're going to rebuild, piece by piece."
212190-182 = "That's what the Gehenna Heritage League will be."
