212190-100 = ""
212190-101 = "เราจะพูดตามตรง! เรื่องทั้งหมดเกิดขึ้นเพราะเราโง่เขลาเอง เราถูกผีของผู้เหี้ยมโหดที่หายไป หลอกเข้าให้อย่างจัง!!"
