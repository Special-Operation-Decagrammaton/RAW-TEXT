212190-49 = "...Dear Gehenna students."
212190-50 = "To begin, as Head Prefect of the Prefect Team, I, Sorasaki Hina, would like to apologize for the tragic events of the past several days."
212190-51 = "Under a spell, I truly believed that the actions I was taking were for the good of Gehenna."
212190-52 = "It was these two hands...that trampled upon the free will Gehenna students are entitled to. I raised my gun for ridiculous dreams of conquest."
212190-53 = "..."
212190-54 = "...Hm."
212190-55 = "I won't try to hide behind the excuse of being brainwashed."
212190-56 = "Because ultimately, I'm the one who has to bear the burden of what I've done. And what I did was follow in the footsteps of my predecessor, the one I firmly stand against: the Tyrant Emperor."
212190-57 = "It wasn't my right to wake up one day and decide that the boisterous, free-spirited days we lived here at Gehenna were over."
212190-58 = "I'd like to take a moment to address my underclassmen, who stood up for what was right and resisted our tyranny. And to all the students who fought against us."
212190-60 = ""
212190-61 = "Head Prefect..."
212190-62 = ""
212190-64 = ""
212190-65 = ""
212190-66 = ""
212190-67 = "You were right to do what you did. It's thanks to each of you that Gehenna remains on the right path."
212190-68 = "I have no intention of hiding from any criticism or resentment you have against me."
212190-69 = "Head Prefect..."
212190-70 = ""
212190-72 = ""
212190-73 = "That is why, as of today, I am stepping down as Head Prefect and—"
