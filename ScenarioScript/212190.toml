212190-181 = "ใช่แล้ว ผู้เหี้ยมโหดจะเป็นยังไงก็ไม่สำคัญหรอก พวกเราจะไม่ยอมแพ้ และจะสร้างเกเฮนน่าขึ้นมาใหม่#nด้วยมือของตัวเองในแบบของพวกเราทุกวัน"
