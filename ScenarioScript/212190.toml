[translation]
212190-1 = "第19話;留下的事物"
212190-3 = "（事件告一段落之後……）"
212190-4 = "（預定要對格黑娜全體學生進行宣布）"
212190-5 = ""
212190-9 = ""
212190-10 = ""
212190-11 = "話說，到底要宣布什麼啊？"
212190-12 = "不知道。只說很重要，叫大家先集合。"
212190-13 = "該不會又像上次那樣發表什麼震撼消息吧？"
212190-14 = "啊啊，你是說征服奇普托斯那件事吧。"
212190-15 = "……"
212190-16 = "那時候真的很奇怪。#n連我也不知道為什麼，就覺得非那樣做不可。"
212190-17 = "嗯嗯，我也是。就是那種不做好像不行的感覺？"
212190-18 = "現在完全不會那樣想了。打什麼鬼仗啊？"
212190-19 = "這麼說來，之前準備打仗的那些東西都怎麼樣了？#n是決定不打了嗎？"
212190-20 = "喂喂，你們的彈藥也都被收走了吧？"
212190-21 = "對啊。那個不還給我們嗎？#n雖然有換成點數就是了。"
212190-22 = "可惡，那可是限定版耶。#n今天的宣布裡不會提到這件事嗎？"
212190-23 = ""
212190-25 = ""
212190-26 = ""
212190-27 = "唔哇，我突然起雞皮疙瘩了……"
212190-28 = "你也是？我也是。#n自從上次聽到那個高頻聲音之後，就變得有點怕這種聲音……"
212190-29 = ""
212190-30 = ""
212190-32 = "[ns] 「……」"
212190-33 = ""
212190-34 = "喂喂，那邊好像要開始了。"
212190-35 = "嗯？那是……"
212190-39 = ""
212190-40 = ""
212190-41 = "委員長……"
212190-42 = "……"
212190-43 = ""
212190-44 = "風紀委員長……？"
212190-45 = "風紀委員長要說什麼啊？"
212190-48 = ""
212190-49 = "……格黑娜的各位同學。"
212190-50 = "首先，對於過去幾天發生的悲劇性事態，我以風紀委員長的身分向各位低頭致歉。"
212190-51 = "我被咒縛所囚禁，深信那就是為了格黑娜的真正秩序與和平。"
212190-52 = "踐踏各位的自由意志，為了征服奇普托斯這個虛妄的夢想而拿起槍的那雙手……#n毫無疑問是我的。"
212190-53 = "……"
212190-54 = "唔嗯……"
212190-55 = "我不會用被洗腦當作藉口。"
212190-56 = "結果我做出的事，和我那麼厭惡的雷帝毫無分別。"
212190-57 = "我曾經想用自己獨斷的判斷，抹去各位理應享有的吵鬧又隨心所欲的日常。"
212190-58 = "特別是一直抵抗到最後、擋在我面前的後輩們……#n還有勇敢地與我們對抗的所有學生，我想對你們說。"
212190-60 = ""
212190-61 = "委員長……"
212190-62 = ""
212190-64 = ""
212190-65 = ""
212190-66 = ""
212190-67 = "你們是對的。#n如果你們沒有阻止我們，格黑娜或許已經走上了無法回頭的路。"
212190-68 = "我不會逃避各位對我的指責與怨恨，而是會全部承擔下來。"
212190-69 = "委員長……"
212190-70 = ""
212190-72 = ""
212190-73 = "從今天起，我將放下身為風紀委員長的一切權限……"
212190-74 = "不准！！！"
212190-75 = ""
212190-77 = ""
212190-78 = ""
212190-81 = ""
212190-82 = "真琴……？"
212190-83 = "給我慢著，空崎陽奈！是誰准你放下權限的！？#n我羽沼真琴大人可沒有允許過！"
212190-84 = "……真琴？你現在在做什麼……"
212190-85 = ""
212190-87 = ""
212190-88 = "哼，擺出一副哭喪的表情真不像你。"
212190-89 = "要是你扛下所有責任退出，那本大人又算什麼？"
212190-90 = "難道要本大人宣傳萬魔殿的議長連一個風紀委員長都管不住，才鬧出這場風波嗎！？"
212190-91 = "真琴議長！委員長現在是真心……"
212190-92 = "吵死了，天雨亞子首席行政官！現在輪到本大人說話！"
212190-93 = "好了，格黑娜的諸君！給我聽清楚！"
212190-94 = "萬魔殿議長……？"
212190-95 = "第一個嚷著要打仗的人，為什麼會在那裡……"
212190-96 = "沒錯！就是本大人！羽沼真琴大人！"
212190-97 = "這次什麼征服奇普托斯之類的大蠢事……"
212190-98 = ""
212190-100 = ""
212190-101 = "老實說吧！是本大人愚蠢地被消失的雷帝亡靈給騙了才搞出來的！！"
212190-103 = ""
212190-104 = ""
212190-105 = ""
212190-106 = "嗚，嗚哇……居然就這樣大聲喊出來？"
212190-107 = ""
212190-108 = "真琴……"
212190-109 = "說來慚愧，身為格黑娜頂點的我！#n居然被一個早已消失的傢伙留下的老舊計畫耍得團團轉，還命令你們拿起槍！"
212190-110 = "這是本大人的疏失，也是本大人的敗北！#n我向你們道歉！對不起了！！"
212190-111 = ""
212190-113 = ""
212190-115 = ""
212190-116 = "真是的……連道個歉都這麼轟轟烈烈呢。"
212190-117 = "呵呵……真有真琴醬的風格。"
212190-118 = "但是！這個空崎陽奈不一樣！"
212190-119 = "這傢伙直到最後都為了守護格黑娜而孤軍奮戰！"
212190-120 = "雖然受到洗腦影響而一度擋在你們面前，#n但那是因為這個愚蠢的議長沒能做出正確的判斷！"
212190-121 = "真琴，那是我自己……"
212190-122 = "閉嘴！你的責任就是我的責任！"
212190-123 = "格黑娜的所有責任，都由我羽沼真琴一肩扛起！#n所以，學生諸君！"
212190-124 = "如果想對風紀委員長丟石頭，就全部丟向我吧！#n本大人會全部接下！"
212190-125 = ""
212190-126 = "哇……"
212190-127 = "什麼啊……意外地也有很熱血的一面嘛？"
212190-128 = ""
212190-129 = "還有空崎陽奈！什麼辭職啦、交還權限啦這種軟弱的話就別再說了！"
212190-130 = "因為你今後也得在本大人底下，一輩子收拾格黑娜的爛攤子來贖罪！#n嘰嘻嘻！本大人就這麼決定了！"
212190-131 = ""
212190-133 = ""
212190-134 = ""
212190-135 = "……真是的。到最後都這麼任性。"
212190-136 = "好！道歉就到此為止！征服戰爭全面作廢！"
212190-137 = "從諸君那裡扣押的彈藥和其他有的沒的，萬魔殿近期內會想辦法結算給你們！"
212190-138 = "大家都回去，照格黑娜的作風隨心所欲地玩吧！以上！！"
212190-139 = ""
212190-141 = ""
212190-144 = "嗚哇啊啊啊～～！！好帥啊！！"
212190-145 = "對啊，這才是格黑娜！！"
212190-146 = "[ns] 「真是很有真琴風格的道歉啊……」"
212190-147 = ""
212190-148 = "從結果來看……氣氛倒是還不壞呢。"
212190-149 = "……嗯。"
212190-150 = "……多虧了他，肩上的擔子好像輕了一點。"
212190-151 = ""
212190-153 = ""
212190-154 = "委員長。"
212190-155 = "……我知道你想說什麼，亞子。"
212190-156 = "……"
212190-157 = "我們也得繼續以自己的方式道歉和反省吧。"
212190-158 = "就像剛才真琴說的，不逃避責任。"
212190-159 = "……是啊。說的也是。"
212190-160 = "就先……從那些勇敢又令人驕傲的後輩們開始吧……"
212190-161 = "嗯……"
212190-162 = ""
212190-163 = "……"
212190-164 = "沒想到議長前輩會袒護風紀委員長……"
212190-165 = "雖然話說得很粗魯，但我很清楚地感受到他在想什麼。"
212190-166 = "香蓮，這個……"
212190-167 = "嗯。"
212190-168 = "換個角度來看，這不就是格黑娜真正合而為一的瞬間嗎？"
212190-169 = "呀哈。委員長，你看起來一臉暢快耶。"
212190-170 = "……我們夢想中的偉大格黑娜，或許並不只存在於幻想之中。"
212190-171 = "那當然。因為我們會親手打造出來啊，不是嗎？"
212190-172 = "嗯！因為我們是格黑娜再興委員會！"
212190-173 = ""
212190-175 = ""
212190-176 = "不過那個名字，你要繼續用嗎？"
212190-177 = "那是翔子……醬取的吧。#n好像是取自要重新喚回過去雷帝時代的意思。"
212190-178 = "我覺得名字本身不壞。#n不就是「重新振興」的意思嗎？"
212190-179 = "格黑娜每天都有地方在爆炸、被破壞嘛。#n所以得由我們這樣的人不斷地重新建立起來。"
212190-180 = "哼嗯～不是過去的榮耀那種偉大的東西，而是修補我們日常的意思？"
212190-181 = "沒錯。雷帝怎樣都無所謂。#n因為我們會照自己的方式，永不放棄地每天親手重新打造格黑娜。"
212190-182 = "那就是格黑娜再興委員會今後的樣子。"
212190-183 = ""
212190-185 = ""
212190-186 = ""
212190-187 = ""
212190-188 = "呀哈哈！果然這樣才是我們的委員長！"
212190-193 = ""
212190-194 = ""
212190-195 = ""
212190-196 = "……那個，委員長。剛才在廣場上說的就夠了。不用特地又這樣……"
212190-197 = "……委員長，您的臉色還是很差。"
212190-198 = ""
212190-200 = ""
212190-201 = "……伊織、千夏。#n我攻擊你們那瞬間的感覺，到現在都還留在我手上。"
212190-202 = ""
212190-204 = ""
212190-205 = "你們呼喚著我、拚命抵抗時的眼神……我也全都記得。"
212190-206 = "……！"
212190-207 = "身為風紀委員長，也身為一個前輩……我做了絕對不該做的事。"
212190-208 = "明明答應過要保護你們，結果反而是我讓你們受了最深的傷。"
212190-209 = "……真的很對不起。#n我知道這是無論說什麼都無法抹去的錯誤。"
212190-210 = ""
212190-212 = ""
212190-213 = ""
212190-214 = "……我也向你們謝罪。#n身為前輩卻踐踏了後輩們真心的我……請你們千萬不要原諒。"
212190-215 = ""
212190-217 = ""
212190-218 = "……真的，真的很痛啊。#n子彈也很痛，但你們看著我們的那種冰冷眼神……"
212190-219 = "比子彈還要痛上幾十倍啊。#n就像胸口被開了個洞一樣……"
212190-220 = "…………"
212190-221 = "我們那樣大喊著要你們回來……笨蛋委員長！傻瓜行政官！！"
212190-222 = "對不起……對不起……真的，打從心底……"
212190-223 = "委員長、亞子行政官……我也非常害怕。"
212190-224 = "感覺我們一直以來相信的東西都要崩塌了。"
212190-225 = ""
212190-227 = ""
212190-228 = ""
212190-229 = "但是……我們之所以能再次拿起槍，是因為前輩們教給我們的正義還活在我們心中。"
212190-230 = "所以這一次，換我們代替前輩們守住了那條界線。"
212190-231 = "所以請不要太自責。#n比起怨恨前輩們，我們更感謝前輩願意回到我們身邊。"
212190-232 = ""
212190-234 = ""
212190-235 = "……嗯，沒錯。你們能回來，真的真的太好了。"
212190-236 = ""
212190-238 = ""
212190-239 = "……謝謝你們。還有……"
212190-240 = "我真的以你們為傲。#n你們是比我優秀太多的風紀委員。"
212190-241 = "嘿嘿……"
212190-242 = "呵呵。"
212190-243 = "道歉的話我就說到這裡。#n今後我會用行動來為自己犯下的錯誤贖罪。"
212190-244 = "我也有同感。#n這次事態的損害修復、懲戒程序和遺失備品清單的製作……要做的事堆積如山呢。"
212190-245 = "雖然很想讓兩位休息，但情況就是這樣。#n你們能馬上歸隊嗎？"
212190-246 = "哈啊！？居然這麼快就露出本性了啊，亞子醬！"
212190-247 = "呵呵……這或許是亞子行政官自己的道歉方式吧？#n意思是「我們隨時都需要你們」。"
212190-248 = "沒錯。要是沒有你們的話，這堆積如山的業務怎麼處理得完呢？"
212190-249 = ""
212190-251 = ""
212190-252 = "拜託你們了。#n能和我們一起……守護這吵鬧的格黑娜的界線嗎？"
212190-253 = ""
212190-255 = ""
212190-256 = "哼，真拿你沒辦法！"
212190-257 = ""
212190-259 = ""
212190-260 = ""
212190-261 = ""
212190-262 = "大家……謝謝你們。"
212190-264 = ""
212190-265 = "永恆的鬥爭……這樣說或許太誇張了。"
212190-266 = "但所謂的自由，就是這麼一回事。"
212190-267 = "自由永遠無法完成，也不安全，更不會結束。"
212190-268 = ""
212190-270 = ""
212190-271 = "所謂的自由……"
212190-272 = "就是選擇不放棄持續思考、判斷與承擔責任。"
212190-273 = "我的……"
212190-274 = "……"
212190-275 = "不。"
212190-276 = "我們的格黑娜，今後也會一直是個自由的學園。"
212190-277 = ""
212190-279 = ""
212190-280 = ""
212190-281 = "所以盡情享受、盡情揮灑吧，諸君。"
212190-282 = "因為所有的責任，都將由我羽沼真琴大人來承擔。"
212190-283 = ""
212190-286 = ""
212190-287 = "啊～明明是場很有氣氛的好演講！"
212190-288 = "廣播收聽率是0.3%呢～！"
212190-289 = ""
212190-291 = ""
212190-292 = "為什麼！！！"
212190-293 = ""
212190-295 = ""
212190-296 = ""
212190-297 = "以前也差不多是這樣。#n這就是平常的格黑娜吧。"
212190-298 = "就是跟以前一樣嘛。換個角度看，也算是件好事。"
212190-299 = "畢竟鬧出那麼大的風波，卻沒什麼太大的改變。"
212190-300 = "唔……！這可是蘊含本大人哲學與價值觀、格黑娜空前絕後的名演說啊！"
212190-301 = "[s] 「我有好好聽哦，真琴。」"
212190-302 = ""
212190-304 = ""
212190-305 = "哦哦！老師！"
212190-306 = "果然只有老師懂啊。#n懂得本大人平時懷抱的高潔理想與價值！"
212190-307 = "雖然由我來說有點那個，但不管出現什麼樣的領袖，都很難宣揚比這更高潔的理想。#n頂多也只有那片極寒之地、赤冬的書記長吧。"
212190-308 = "[s] 「……？」"
212190-309 = "來吧，老師。不必客氣。現在你應該也明白了。"
212190-310 = "過去籠罩格黑娜的邪惡之手，已經被本大人雷霆般的一喝給粉碎殆盡，#n連痕跡都找不到了。"
212190-311 = "因此格黑娜將會永續存在、無比安全，今後也會像現在一樣偉大。"
212190-312 = "現在正是我們締結永恆同盟的最佳時機，不是嗎？"
212190-313 = ""
212190-316 = "[ns] 「謝謝你，真琴。」"
212190-317 = ""
212190-318 = "[ns1] 「這次多虧了真琴，才克服了非常大的危機。」\n[ns2] 「身為老師，身為大人，我很感謝你。」"
212190-321 = "……唔。"
212190-322 = "那，那是犯規啊，老師……用那種表情……"
212190-323 = ""
212190-325 = ""
212190-326 = ""
212190-327 = "該道歉的是我，給老師添了很大的麻煩。"
212190-328 = "其實我不知道該怎麼開口，才像平常那樣跟你搭話……"
212190-329 = "這次對老師造成的身體上和精神上的傷害……我實在想不到適當的補償方法。"
212190-330 = "威脅、拘禁、讓你吃苦……再加上其他種種危害。"
212190-331 = "……我該怎麼做才好，老師？"
212190-332 = "要怎麼做，才能算是讓老師滿意的道歉？"
212190-333 = "[s] 「只要真琴一直保持真琴原本的樣子就好。」"
212190-334 = "……！？"
212190-335 = "那是……什麼意思？"
212190-336 = "你說是字面上的意思……？#n老師，我有點不太理解……"
212190-337 = "[s] 「那這件事就當作是功課吧。」"
212190-338 = ""
212190-341 = "[ns] 「請你繼續深入思考我話中的意思。」"
212190-342 = "…………"
212190-343 = "只要我一直是我……這樣就行了嗎……？"
212190-344 = "是要我重新審視……自己是個什麼樣的人嗎？"
212190-345 = "……真難啊。老師的話總是讓我回頭審視自己。"
212190-346 = ""
212190-348 = ""
212190-349 = "老師出的功課，我會一直深深地放在心上。"
212190-350 = "另外我想撇開個人的身分，作為格黑娜的羽沼真琴再說一件事。"
212190-351 = "我發誓，今後絕不會再發生這種事。"
212190-352 = "格黑娜會沒事的。"
212190-353 = "[s] 「嗯。我相信你，真琴。」"
212190-354 = "……嗯。"
212190-355 = "既然有老師的信任，我就得更加努力了。"
212190-356 = ""
212190-358 = ""
212190-359 = ""
212190-360 = "……"
212190-361 = ""
212190-363 = ""
212190-364 = "我不想看到你那副無精打采的樣子，前輩。"
212190-365 = "什麼？你是在對本大人說話嗎，伊呂波？"
212190-366 = "對，就是前輩你。#n那個愚蠢、固執、自尊心高到快突破天際的真琴前輩。"
