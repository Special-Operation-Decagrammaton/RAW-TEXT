212190-9 = ""
212190-10 = ""
212190-11 = "ว่าแต่จะแถลงเรื่องอะไรเหรอ?"
212190-12 = "ไม่รู้สิ เห็นบอกว่าเป็นเรื่องสำคัญ ให้มารวมตัวกันไว้ก่อนน่ะ"
212190-13 = "คงไม่ประกาศเรื่องชวนตกตะลึงเหมือนครั้งก่อนอีกเนอะ...?"
212190-14 = "อ๋อ เรื่องพิชิตคิโวทอสน่ะเหรอ"
212190-15 = "..."
212190-16 = "เป็นเรื่องแปลกจริงๆ ตอนนั้นฉันเองก็รู้สึกว่าต้องทำแบบนั้น ทำไมก็ไม่รู้เนอะ"
212190-17 = "อื้ม ฉันก็ด้วย รู้สึกเหมือนถ้าไม่ทำจะไม่ได้ อะไรประมาณนั้นน่ะ"
212190-18 = "แต่ตอนนี้ไม่รู้สึกแบบนั้นเลย สงครามอะไรกัน? ไร้สาระจะตาย"
212190-19 = "จะว่าไปแล้ว การเตรียมสงครามทั้งหมดเป็นยังไงบ้างนะ? ตกลงว่าจะไม่ทำแล้วใช่มั้ย?"
212190-20 = "นี่ๆ กระสุนของพวกเธอก็ถูกยึดไปหมดเหมือนกันใช่มั้ย?"
212190-21 = "อื้ม ใช่ จะได้คืนมั้ยนะ? ถึงจะได้ไมล์มาแทนแล้วก็เถอะ"
212190-22 = "ฮึ่ย กระสุนพวกนั้นเป็นรุ่นลิมิเต็ดนะ วันนี้จะพูดถึงเรื่องนี้ในแถลงการณ์หรือเปล่านะ?"
