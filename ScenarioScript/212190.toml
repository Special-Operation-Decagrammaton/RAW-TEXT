212190-103 = ""
212190-104 = ""
212190-105 = ""
212190-106 = "W-Wow... She actually just said that out loud?"
212190-107 = ""
212190-108 = "Makoto..."
212190-109 = "I am ashamed to admit that your esteemed ruler found herself under the influence of one of the Emperor's old projects! That is why I ordered you to pick up your guns!"
212190-110 = "It was my fault! I lose! I'm sorry! My bad!"
212190-111 = ""
212190-113 = ""
212190-115 = ""
212190-116 = "Seriously... What a dramatic apology..."
212190-117 = "Fufu, I'd expect nothing less from Makoto."
212190-118 = "However! Sorasaki Hina here is different!"
212190-119 = "Despite everything, she gave everything she had to protecting Gehenna until the end!"
212190-120 = "Yes, the brainwashing caused her to do bad things, but that was because of me! Because of my bad judgment!"
212190-121 = "Makoto, I did that out of my own—"
212190-122 = "Shut up! Your responsibility is my responsibility!"
