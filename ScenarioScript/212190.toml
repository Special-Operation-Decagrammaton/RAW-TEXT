212190-83 = "เดี๋ยวก่อน โซระซากิ ฮินะ! ใครอนุญาตให้เธอสละอำนาจตามใจชอบไม่ทราบ?!#nท่านฮานุมะ มาโคโตะผู้นี้ไม่เคยอนุญาต!"
