212190-90 = "จะให้เราป่าวประกาศหรือไงว่าประธานแพนเดโมเนียม โซไซตี้ควบคุมดูแลประธานกรรมการวินัย#nเพียงคนเดียวยังไม่ได้ จนเกิดเรื่องวุ่นวายขนาดนี้ขึ้น?!"
212190-91 = "ท่านประธานมาโคโตะ! ตอนนี้ท่านประธานฮินะกำลังพูดอย่างจริงใจ..."
212190-92 = "เงียบไปเลย เจ้าหน้าที่อาวุโสอามาอุ อาโกะ! ตอนนี้ถึงตาของเราแล้ว!"
212190-93 = "เอาละ เหล่าสหายแห่งเกเฮนน่า! จงตั้งใจฟังให้ดี!"
212190-94 = "ประธานแพนเดโมเนียม โซไซตี้...?"
212190-95 = "ทำไมคนที่ตะโกนให้ทำสงครามเป็นคนแรกถึงไปอยู่ตรงนั้นล่ะ..."
