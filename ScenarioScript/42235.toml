[translation]
42235-2 = "그러니까 지금 무장한 테러리스트들이 총학생회 건물로 향하고 있다고 몇 번이나 말했잖아!"
42235-3 = "공안국이든 경비국이든 가용 가능한 병력은 전부 이쪽으로 보내!"
42235-7 = "공안국은 대부분의 학생이 근신 중이고…… 경비국은 신규 행정 명령 때문에 자리를 비웠다고……?"
42235-8 = "그럼 생활안전국이라도 보내! 누구라도 좋으니까 이 녀석들을 막아!"
42235-9 = "당장 지원 병력을 보내지 않으면 발키리 경찰학교 자체를 없애 버릴—"
42235-18 = "SRT다! 모두 무기를 내려놓고 물러서!"
42235-20 = "여기는 RABBIT 1. 확보 용의자, 시라누이 카야의 신원을 확인."
42235-24 = "시라누이 카야. 당신이 코우사기 역 폭파 미수 사건의 배후에 관여했다는 증언을 관계자로부터 확보했습니다."
42235-25 = "당신은 사익을 편취하기 위해 테러를 조장하고, 총학생회의 운영에 필수적인 정보 및 권한을 기업에 사사로이 제공했습니다."
42235-26 = "이는 형사상 불체포특권의 예외 조항에 해당하는바."
42235-27 = "당신을 내란 및 직무유기, 직권남용, 뇌물공여 혐의로 긴급 체포합니다."
42235-33 = "감히…… SRT의 대원 나부랭이들이 방위실장이자 총학생회장 대행인 나를 체포한다고……?"
42235-34 = "[s1] \"SRT는 이런 문제를 해결하기 위해 존재하는 치안 기관이니까.\"\n[s2] \"카야. 이만 순순히 네 잘못을 받아들여.\""
42235-39 = "[USERNAME] 선생님……"
42235-40 = "자, 잠깐 이야기 좀 하시지 않겠어요……?"
42235-41 = "지난번에 선생님께 드린 제안은 확실히 조금 미흡했을지도 모릅니다……"
42235-42 = "키보토스의 여러 문제들을 책임지고 해결해 오신 선생님을 저희가 관리해 드리겠다니…… 확실히 무례한 제안이었지요."
42235-43 = "그 일에 대해서는 사과드리겠습니다…… 제안은 없었던 것으로 하겠습니다!"
42235-53 = "대신 약속드렸던 지원은 모두 예외 없이 제공해 드리지요."
42235-54 = "샬레의 운영에 필요한 비용도, 인력도…… 무엇이든 제공해 드리겠습니다."
42235-55 = "피, 필요하시다면 제가 직접 샬레에 가서 선생님을 도와드릴 수도 있으니까요!"
42235-56 = "선생님이 시키시는 일이라면 무엇이든 할 테니까—"
42235-60 = "[ns] \"……카야.\""
42235-64 = "네, 네……?"
42235-65 = "[s3] \"네가 용서를 구해야 할 사람은 내가 아니야.\"\n[s4] \"제대로 반성하고 폐를 끼친 학생들에게 사과하도록 해.\""
42235-68 = "무, 물론이지요. 선생님께서 사과하라고 말씀하신다면 상대가 누구든 사과하겠습니다."
42235-69 = "누, 누구에게 먼저 사과를 할까요……? 린 행정관……?"
42235-70 = "[s] \"아무래도 아직 이해를 못 한 모양인데……\""
42235-77 = "총학생회장 대행! 무사해?"
42235-82 = "체육실장, 마침 제때 도착해 주었군요……!"
42235-83 = "안 그래도 총학생회 내의 지지파가 저를 도와주러 올 거라고 믿고 있었답니다!"
42235-85 = "……응? 샬레의 선생님이랑 SRT의 1학년생들이잖아?"
42235-86 = "선생님. 무슨 이야기를 들었는지는 모르겠지만, SRT 학생들의 말은 믿지 않는 게 좋을 거야."
42235-87 = "그 녀석들은 린 행정관의 사주를 받고 카야 실장을 음해하려는 질 나쁜 녀석들이거든."
42235-88 = "마, 맞아요! 이 모든 건 린 행정관과 그 지지파의 음해라고요!"
42235-89 = "그 일당 녀석들은 하나 같이 마음에 들지 않았어…… 가슴만 무식하게 큰 주제에!"
42235-91 = "뭐어? 그, 그게 무슨 상관인데……?"
42235-92 = "……고작 그런 걸로 열등감을 불태우고 있었던 거야?"
42235-93 = "아아, 어쩐지…… 그쪽 파벌의 인선 사이에 묘한 공통점이 있다 싶더니만."
42235-95 = "어이, 거기 안경. 지금 그게 무슨 소리야……?"
42235-96 = "[s] \"……미야코. FOX 소대에게 받아 온 녹음 파일을 재생해 줘.\""
42235-97 = "네."
42235-105 = "수고 많으셨습니다. 유키노 소대장. 이번 습격으로 총학생회의 분위기도 크게 반전되겠네요."
42235-106 = "SRT 학원에 대한 부정적인 견해가 다소 늘긴 하겠지만…… 신경 쓰지 마시길."
42235-107 = "제가 총학생회장 대행이 된다면 그 누구도 당신들에 대해 함부로 말을 할 수 없을 테니까요."
42235-111 = "……체육실장이 다쳤다고요? 아…… 그 바보 말인가요."
42235-112 = "쯧, 그러기에 왜 나서서 사고를 자초하는 건지."
42235-113 = "대의를 위한 어쩔 수 없는 희생이라 생각해야지요. 신경 쓰지 마시길."
42235-120 = "……응? 이게 무슨 소리야."
42235-121 = "카야 실장. 지난번에 있었던 FOX 소대의 습격에 대해 실장은 모르는 일이라고 하지 않았어?"
42235-122 = "이, 이건…… 그게 그러니까……"
42235-127 = "키보토스 대운동회의 상설 개최……? 이 바보는 또 무얼 요구하고 있는 건지."
42235-128 = "쿠데타가 끝나면 체육실도 적당히 정리해서 문화실의 분과로 넣어 버려야겠어요."
42235-129 = "……네, 비서관. 무슨 일인가요?"
42235-130 = "회의 참가자들에게 돌릴 주먹밥의 개수가 모자라다고요?"
42235-131 = "주먹밥 같은 거 알게 뭔가요. 그런 사소한 건 제게 묻지 마세요."
42235-133 = "그, 그러니까 이 통신은……"
42235-134 = "맞아요! 모두 조작된 것입니다! 이 모든 건 린 행정관의 음모—"
42235-136 = "설마 우리를 그렇게 생각하고 있었다니……"
42235-137 = "나는 지난번 습격 때 팔을 다쳐서 게이트볼 대회 출전도 고사했는데……"
42235-142 = "체육의 가치도 모르는 대행은 필요 없어!"
42235-148 = "탄핵이다!"
42235-159 = "다음화;에필로그"
