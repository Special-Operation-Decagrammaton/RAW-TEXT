[translation]
10025110-1 = "에필로그;어촌에서 온 택배"
10025110-4 = "안녕하세요, 시청자 여러분! 크로노스 보도부의 카자마키 마이입니다!"
10025110-5 = "오늘 시사교양 <굿모닝 키보토스>에서는 카네사키 항구 외곽에 있는 작은 어촌, 야토우라 마을을 찾아왔습니다."
10025110-6 = "맛있는 새우가 잡힌다는 것 이외에는 거의 알려지지 않았던 이 작은 마을이 최근 SNS상에서 핫 플레이스로 큰 인기를 끌고 있는데요!"
10025110-7 = "이 마을이 갑자기 조명받게 된 이유는 최근 급성장한 인터넷 낚시 채널, <백곰의 낚시 TV>에서 이 야토우라 마을을 촬영한 동영상이 천만 뷰를 달성했기 때문입니다!"
10025110-8 = "동영상을 통해 아름다운 자연을 즐길 수 있는 경승지와 초보자도 쉽게 접근할 수 있는 낚시 포인트가 많다는 사실이 알려지며, 야토우라 마을은 새로운 관광 명소로 손꼽히게 되었는데요."
10025110-9 = "더욱이 이곳 마을에서 만드는 쿠사야 구이가 일부 미식가들에게 큰 호평을 받으며, 이를 맛보기 위한 식객들의 발길도 이어지고 있다고 하네요."
10025110-10 = "그나저나 천만 뷰라니, 부럽다…… 우리 채널도 업로드는 꾸준히 하고 있는데, 언제쯤 천만 뷰를 달성하려나?"
10025110-11 = "……가짜 뉴스 때문에 연속 정지만 먹지 않았어도 진작 달성했을 것 같은데……"
10025110-12 = "시끄러워!"
10025110-13 = "흠흠…… 그리고 낯선 휴양지를 방문했다가 불친절한 사람들 때문에 즐거운 바캉스 기분을 망치고 돌아온 경험, 흔히들 있으실 텐데요."
10025110-14 = "이곳 야토우라 마을은 마을 주민 여러분 모두가 친절하고 밝은 분위기로 외지인들을 대하기 때문에, 즐겁게 휴양을 즐기고 돌아왔다는 관광객들의 체험담이 SNS에 이어지고 있습니다."
10025110-19 = "아…… 시선을 돌려보니 저쪽 부둣가에 배를 정박시키는 어부 여러분의 모습이 보이네요."
10025110-20 = "바로 모시고 마을에 관한 인터뷰를 진행하도록 하겠습니다!"
10025110-34 = "안녕하세요, <굿모닝 키보토스> 입니다!"
10025110-35 = "……뭔데?"
10025110-36 = "(어라? 생각했던 것보다 반응이 뭔가 사나운데……)"
10025110-37 = "아, 다름이 아니라 인터뷰를 조금……"
10025110-38 = "이 앞에서 어슬렁거리지 말고 저리 비켜! 그렇지 않으면 크게 다칠 수도 있으니—"
10025110-44 = "쿠마가이, 외지인에게 좀 더 친절하게 굴지 못하겠냐."
10025110-45 = "으읏, 죄송합니다……"
10025110-51 = "……미안하군. 계선주에 홋줄을 매는 위험한 작업을 하는 중이라, 다소 예민해진 것뿐이니 이해해 주게."
10025110-53 = "아, 아뇨…… 오히려 작업하시는 중에 방해해서 죄송합니다."
10025110-54 = "어르신, 혹시 괜찮으시다면 이 마을의 매력에 대해 짧게 소개해 주실 수 있으실까요?"
10025110-56 = "글쎄…… 마을에 사는 내가 보기에는 새우나 잡아 파는 시시껄렁한 마을로 밖에 보이지 않는데."
10025110-58 = "그, 그런가요……?"
10025110-60 = "하지만 이런 마을이라도 일부러 찾아오는 손님이 있다면, 가능한 좋은 기억만을 갖고 돌아가기를 바랄 뿐이지."
10025110-61 = "그래야 나중에 다른 지역에 가서 새우를 고를 때에도, 우리 마을에서 잡은 새우를 한 번 더 눈여겨 봐주지 않겠어? 하하!"
10025110-63 = "……그렇군요. 어째서 사람들이 이 마을을 찾아오는지 알 것 같네요!"
10025110-64 = "그런데 말이죠…… 사실 이 마을과 관련된 소문이 하나 더 있는데요."
10025110-65 = "혹시…… <깊은 곳의 존재들>에 대해서 알고 계시나요?"
10025110-71 = "인터넷에 퍼진 소문에 따르면 도깨비의 암초 위에서 제물을 바치고 주문을 외우면 깊은 곳에 사는 신비한 존재가 물고기를 몰아와 준다는데……"
10025110-72 = "실제로 그 광경을 보았다거나, 이에 대해 자세히 아시는 분은 없을까요?"
10025110-74 = "글쎄…… 마을에 전해 내려오는 설화 속에 그런 이야기가 있기는 하지만, 설화는 설화에 불과하지 않을까."
10025110-75 = "물고기를 몰아와 주는 신비한 존재가 따로 있다면, 우리 어부들이 이를 모를 수는 없으니까."
10025110-77 = "그건 그렇긴 하네요……"
10025110-78 = "그럼 이건 최근에 퍼지고 있는 소문입니다만…… <쿠사야 창고의 비명>이라는 괴담에 대해서도 알고 계신가요?"
10025110-79 = "<쿠사야 창고의 비명>……?"
10025110-80 = "네. 익명의 목격담에 의하면 야토우라 마을의 쿠사야 창고에서는 가끔씩 '새우는 싫어~ 쿠사야는 더 싫어~' 라고 울부짖는 남성의 목소리가 새어 나온다고 하던데……"
10025110-85 = "……금시초문이로군."
10025110-86 = "아마 새벽바람이 낡은 기둥 사이로 지나가며 우는 소리를 잘못 들은 게 아닐까?"
10025110-87 = "오래된 나무가 삐걱거리면 가끔 사람 비명 소리처럼 들릴 때가 있거든."
10025110-89 = "그, 그런가요……"
10025110-94 = "(소근) 어르신, 해운업자 녀석이 또 도망친 것 같은데요."
10025110-95 = "쳇, 귀찮게 하기는……"
10025110-96 = "어부들을 풀어 마을을 수색하고 마을 어귀의 CCTV를 확인해 봐."
10025110-97 = "어차피 이 마을에서 빠져나가려면 다른 수는 없을 테니까."
10025110-99 = "저…… 방금 무슨 이야기를 하신 건가요……?"
10025110-101 = "아무것도 아니야."
10025110-102 = "그럼 부디 마을을 편히 즐기고 돌아가게나. 생업이 바빠 우리는 이만……"
10025110-109 = "……이 마을, 괜찮은 거 맞아?"
10025110-113 = "코우사기 공원"
10025110-116 = "덥다……."
10025110-117 = "덥네요……."
10025110-118 = "더워……."
10025110-119 = "……시원한 물 속에서 수영이나 했으면."
10025110-120 = "바다에 다녀왔던 게 벌써 오래전 일 같아……"
10025110-121 = "……그러게요. 야토우라 마을에 다녀온 지 아직 며칠밖에 지나지 않았는데, 벌써부터 오래된 추억처럼 느껴지네요."
10025110-125 = "……재미있었지."
10025110-126 = "처음에는 무서운 소문 때문에 잔뜩 긴장하긴 했지만, 마을 사람들 모두 좋은 사람뿐이었고……"
10025110-127 = "시원한 밤바다에서 물고기도 낚고, 맛있는 해산물도 잔뜩 먹고……"
10025110-128 = "……이런 즐거운 기분은 정말 오랜만에 느껴보는 것 같아."
10025110-129 = "그러게. SRT 특수학원이 폐쇄된 이후로는 여러 가지 사건이 겹쳐 좀처럼 쉴 시간이 없었으니까."
10025110-130 = "이번 작전도 SRT의 임무 차 다녀온 것이지만, 결과적으로는 즐거운 바캉스를 즐기고 돌아온 기분이야."
10025110-131 = "……그러게요. 결국은 선생님께서 말씀하신 대로 되었네요."
10025110-132 = "목적을 확실하게 인지하고 집중하는 것도 중요하지만, 마음의 여유가 없으면 무지에서 오는 공포로 인해 오판을 할 가능성이 높아지니……"
10025110-133 = "RABBIT 소대의 소대장으로서 이번 작전을 통해 적절한 휴식이 갖는 중요성에 대해 다시 한 번 깨닫는 계기가 되었습니다."
10025110-134 = "하지만 SRT 특수학원이 부활하기 전까지 우리가 머무르기로 약속한 곳은 이곳 코우사기 공원뿐이니까."
10025110-135 = "다시 한번 심기일전하고 SRT 학원의 부활을 위해 최선을 다하자고!"
10025110-139 = "그나저나 슬슬 점심시간인데, 폐기 도시락을 찾으러 간 모에는 어디까지 간 거야?"
10025110-145 = "……대박! 다들 이것 좀 봐!"
10025110-146 = "야, 모에. 넌 도시락 찾으러 간지가 언제인데 이제야—"
10025110-147 = "후후…… 아무리 사키 너라도 내가 가져온 물건을 보면 아무 말도 하지 못할걸?"
10025110-148 = "잘 봐! 엔젤 24의 <기간 한정 프리미엄 소나무 도시락>이야! 무려 종류별로 네 개나 구해왔다고!"
10025110-149 = "대나무나 매화가 아니라, 소나무 스티커가 붙은 도시락이라고……? 그거 엄청나게 비싼 도시락 아냐……?"
10025110-150 = "응. 지역 특산품을 사용해서 만드는 고급 도시락으로 보통은 폐기는 커녕 발주도 거의 이루어지지 않는 고급품인데……"
10025110-151 = "오늘 편의점 물류 전산망을 살펴보니, 이 근처에 소나무 도시락이 폐기 처리된 지점이 있다고 뜨는 게 아니겠어? 그래서 다른 사람이 가져가기 전에 서둘러 가져 왔지!"
10025110-153 = "그래서 오늘은 평소보다 더 멀리 다녀온 모양이군요."
10025110-154 = "점심부터 이렇게 호화로운 도시락을 먹을 수 있다니…… 수고 많았어, 모에!"
10025110-155 = "자, 그럼 무슨 메뉴가 있는지 어디 한 번 살펴볼까?"
10025110-160 = "연어에, 소고기, 닭고기 가라아게…… 아, 새우튀김도 있네!"
10025110-161 = "……편의점에 납품되는 새우 물류도 이제는 회복된 모양이네요."
10025110-162 = "그러게, 후후. D.U.에서 이렇게 새우 도시락을 다시 보게 되다니, 어쩐지 감회가 새로운걸."
10025110-164 = "그럼 어부들의 노고에 감사하는 마음을 가지며, 이 새우튀김 도시락은 내가—"
10025110-165 = "……잠깐. 사키, 동작 중지."
10025110-166 = "어째서 네가 먼저 도시락을 고르는 거야?"
10025110-168 = "응? 하지만 모에 너, 평소에는 해산물보다 소고기나 닭고기가 더 좋다고 말했었잖아?"
10025110-169 = "게다가 내 입으로 이런 소리를 하기도 뭣하지만…… 지난 수중 폭파 작전에서는 제법 활약했는데, 기념으로 새우 도시락 정도는 내가 가져가도—"
10025110-170 = "안 돼. 오늘은 나도 새우가 먹고 싶었단 말이야!"
10025110-171 = "게다가 애초에 이 폐기 도시락을 발견한 건 나라고!"
10025110-172 = "나도…… 오늘은 소고기보다는 새우가 먹고 싶어……"
10025110-174 = "……저도 동감입니다."
10025110-175 = "……오늘따라 경쟁이 꽤 치열한걸."
10025110-177 = "그럼 하는 수 없지. 여기서는 가위바위보로—"
10025110-187 = "안녕하세요. 이 공원에 츠키유키 미야코 씨 계신가요?"
10025110-188 = "네. 제가 츠키유키 미야코입니다만……?"
10025110-189 = "고객님 앞으로 택배가 도착해서요."
10025110-190 = "영차…… 여기에 사인 부탁드립니다!"
10025110-196 = "저…… 그 택배가 정말 제게 온 게 맞나요? 이 공원 앞으로……?"
10025110-197 = "네, 분명 배송 주소에 이 공원 주소가 적여 있었는 걸요."
10025110-198 = "<D.U. 코우사기 타운, 근린공원, 수돗가 앞, 1호 A형 텐트의 츠키유키 미야코 씨 앞.> 이 주소 맞으시죠?"
10025110-200 = "텐트 위치까지 쓸데없이 구체적이네……"
10025110-202 = "그렇다면 틀림없습니다만, 누가 저희에게 택배를……?"
10025110-203 = "야토우라 마을의 어촌계에서 발송한 택배입니다!"
10025110-204 = "냉장 처리가 필요한 상품이라, 당일 특급으로 아침에 발송된 택배거든요."
10025110-205 = "내용물은 상온에서는 상할 수도 있으니 가급적 개봉 즉시 처리하시고, 남은 제품은 냉동하여 보존 부탁드립니다."
10025110-206 = "그럼 좋은 하루 되세요!"
10025110-213 = "야토우라 마을에서 어째서 택배를……?"
10025110-214 = "게다가 내용물이 상할 수 있다니, 도대체 뭘 보낸 거야?"
10025110-215 = "뭔가 상자 밖으로 옅은 비린 냄새가 흘러나오고 있는데……"
10025110-217 = "……내가 한 번 열어볼게."
10025110-225 = "이건……"
10025110-226 = "……새우잖아? 그것도 엄청난 고급품이야!"
10025110-227 = "이, 이렇게 비싸 보이는 새우가 상자에 한가득……"
10025110-228 = "상자 안쪽에 무언가 글귀가 적혀 있네요."
10025110-234 = "<우연히 지나가던 친절한 관광객 여러분께. 깊은 감사를 담아, 야토우라 어촌계 일동.>"
10025110-235 = "……잘못 온 택배는 아닌 것 같네요."
10025110-237 = " '우연히 지나가던 친절한 관광객'이라, 우리에게 딱 어울리는 칭호인 걸."
10025110-238 = "……분에 넘치는 표현이지."
10025110-239 = "그건 그렇지만 범죄자를 단속하는 것은 SRT의 당연한 책무인데, 이렇게 귀한 보답을 받으려니 어쩐지 조금 부담스러운 걸……"
10025110-240 = "그래도 택배로 온 선물을 거절할 수는 없으니까요. 이 새우는 감사히 받도록 합시다."
10025110-241 = "아, 맞다. 사키. 아까 말한 새우튀김 도시락은 네가 가져가도 괜찮아. 난 이거면 충분하니까."
10025110-242 = "치사하게 말을 바꾸기는……!"
10025110-244 = "그나저나 이 새우, 양이 족히 10인분은 넘어 보이는데…… 이걸 우리끼리 다 먹을 수 있을까?"
10025110-245 = "우리에겐 냉장고도 없으니 내버려 두었다간 귀한 새우가 상할지도 모르고……"
10025110-247 = "그건 그렇네요. 새우가 상해서 버리게 된다면 그것도 보내주신 분들에 대한 실례이고……"
