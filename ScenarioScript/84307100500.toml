[translation]
84307100500-6 = "순식간이네. 하지만 계산대로야. 예상한 시간보다 빠르지도, 늦지도 않았어."
84307100500-7 = "칭찬이야, 욕이야? 일하고 온 사람한테는 칭찬 말고 하지 말라는 이야기 들은 적 없어?"
84307100500-8 = "……칭찬이었는데……"
84307100500-9 = "정확히는 아주 빠른 속도로 처리했지만, 너의 그런 일 처리 속도는 나 또한 이미 알고 있었기에 신뢰하고 있었다는 뜻이었어."
84307100500-13 = "……쏘리."
84307100500-14 = "알았어. 그런 거라면 순순히 받아 줘야지."
84307100500-15 = "아무튼 붙잡은 녀석들은 모두 신고해서 넘겼고…… \"어째서 그 시간에 거길 찾아갔냐\"는 질문을 받아 버렸는데 말이야."
84307100500-16 = "……그래서 뭐라고 대답했어?"
84307100500-17 = "혹시 그것으로 인해 곤란한 상황에 처했다면, 내가 지금이라도 바로 절대 뚫을 수 없는 알리바이를 만들어서……."
84307100500-18 = "……? 내 맘인데 무슨 불만 있냐고 했지."
84307100500-19 = "그래서?"
84307100500-20 = "그래서, 뭐? 내가 그렇다는데. 그냥 그렇게 넘어갔지."
84307100500-24 = "……그렇구나."
84307100500-25 = "그나저나 이 장비, 뭐 지금 당장 반납해야 한다거나 그런 건 아니지? 몇 번 써 봤는데, 솔직히 꽤 마음에 들어서 말이지."
84307100500-26 = "이번 일 끝날 때까지는 내가 쓰고 있을 테니까, 그렇게 알고 있으라고. 불만 없지?"
84307100500-27 = "바라던 바야. 효용성이 있었다니, 나로서도 다행스러운 일이네."
84307100500-28 = "그러면 앞으로도 계속해서 잘 부탁할게, 네루."
84307100500-29 = "이야…… 말투 봐라, 진짜 장족의 발전이네."
84307100500-33 = "……그, 그건……."
84307100500-34 = "칭찬이야. 칭찬이라고."
