[translation]
10038005-1 = "프롤로그;축제를 준비합시다!"
10038005-4 = "<지금까지의 이야기>"
10038005-8 = "(산해경 고급중학교와 붉은겨울 연방학원 사이의 교류회가 개최되었다.)"
10038005-9 = "우리 산해경은, 근시일 내에 붉은겨울과의 교류회를 개최하려 한다."
10038005-12 = "아무튼 현룡문으로서는…… 솔직하게, 이 교류회에 부담을 느끼고 있다."
10038005-13 = "경험이 없기 때문이라는 것이 가장 큰 이유이겠지. 물론 교류회 자체를 경원시하고픈 마음 역시 무시할 수 없는 이유일 것이고."
10038005-16 = "(불안 속에서도 교류회는 개최되었고, 붉은겨울 연방학원의 사무국 학생들은 무사히 산해경에 도착했다.)"
10038005-19 = "오오……. 여기가……!"
10038005-21 = "산해경이군요!"
10038005-22 = "과연. 조사해 두었던 대로의 느낌이네요."
10038005-23 = "토모에, 토모에! 저기 봐! 저 지붕! 뭔가 신기하게 생겼어!"
10038005-29 = "(저 학생들이 요즘 소문이 자자한……!)"
10038005-30 = "(말로만 들었는데, 정말로 와 버렸을 줄이야……!)"
10038005-33 = "(산해경의 보수적인 분위기를 대변하는 경극부의 부장인 카구야는, 불안함 속에서 신타니 카이와 연락을 주고받는다.)"
10038005-37 = "……?! 무, 무슨 말을 하는 거냐, 신타니 카이! 애초에 그럴 수 있는 권한이 나와 경극부에게 있을 리가……!"
10038005-39 = "재미있는 말을 해 주는군. 경극부장. 산해경의 전통의 이름으로, 지금까지 그 전통을 가장 진지하게 지켜 왔던 경극부에게 자격이 없다면, 도대체 누구에게 있다는 것인가."
10038005-40 = "……!"
10038005-41 = "뭐, 이것도 결국 따지고 보면, 산해경에서 쫓겨난 자의 헛소리에 지나지 않을지도 모르지만 말이다?"
10038005-42 = "우리가, 새로운 경극을 하게 된다면……. 그것이 실패한다면……."
10038005-43 = "흥미롭군. 성공과 실패를 논하는 것이, 충의(忠義)의 길인가?"
10038005-46 = "(신타니 카이의 사주를 받은 카구야는, 새로운 경극을 공연하며, 문주인 키사키에게 상소를 올린다.)"
10038005-50 = "산해경과 그 전통의 이름으로, 현 현룡문의 문주, 류우게 키사키를 논핵(論劾)한다!"
10038005-52 = "(그러나 붉은겨울 사무국의 활약으로, 경극부가 벌인 소동은 진압되었고.)"
10038005-55 = "확실하게 말해 두지! 모든 학생에게는 물론 쿠데타를 일으킬 권리가 있다!"
10038005-56 = "그리고 모든 학생회장에게는…… 그 쿠데타를 진압하고, 학교를 이끌 권리가 있다!"
10038005-59 = "(교류회는 무사히 성공적으로 종료되었다.)"
10038005-62 = "우후후. 이번 교류회가 상당히 마음에 드셨던 것 같네요. 체리노 서기장님."
10038005-63 = "음, 산해경은……. 대모험이었다!"
10038005-65 = "경극부의 일로 고초를 겪게 한 것 같아 면목이 없구나."
10038005-66 = "나, 붉은겨울의 서기장은 그런 하찮은 것에 연연하지 않는 몸인 것이야!"
10038005-67 = "그렇습니다. 문주님. 체리노 회장님께서는 관대하시니까요!"
10038005-69 = "(그러나 신타니 카이라는 불씨는, 여전히 남은 채.)"
10038005-72 = "긴 시간이었지. 교정국에 신세를 지는 수모를 겪기도 했고."
10038005-73 = "그럼에도 시기를 기다렸고, 세력을 모았다. 이제 때가 되었다."
10038005-74 = "나는 나의 것을 되찾을 것이며, 누구도 그것을 방해하게 두지 않을 것이다."
10038005-76 = "(드러나지 않는 불안이, 산해경을 감싸고 있었다…….)"
10038005-84 = "슬슬 시간이 된 것 같은데……."
10038005-88 = "아, 여기야. 여기!"
10038005-93 = "뭐 이렇게 빨리 와 있었어……."
10038005-94 = "아니, 뭐. 강의가 조금 빨리 끝나서. 특별히 할 일도 없었고."
10038005-95 = "그러냐. 할 일이 없다니 그거 조금 부럽네. 우리는……."
10038005-96 = "……아니, 아니야. 아무것도."
10038005-100 = "……."
10038005-101 = "요즘 현룡문, 괜찮아?"
10038005-105 = "어…… 음……. 괘, 괜찮지. 그야."
10038005-106 = "최소한 거짓말이라는 거 티는 안 나게 해라……."
10038005-107 = "하……. 그래. 나도 모르겠다. 요즘은 뭐가 뭔지."
10038005-108 = "그, 붉은겨울이었나. 그쪽 애들 왔다 간 다음부터, 모든 게 다 어수선하다니까."
10038005-109 = "……어수선한 건 현룡문뿐이 아닌 것 같지만 말이지."
10038005-110 = "응……. 대충 알 것 같네. 그거."
10038005-111 = "있잖아. 이건 그러니까, 그냥 애들 사이에서 도는 소문 같은 거긴 한데……."
10038005-112 = "……문주님, 결국 현무상회 편을 들어서 산해경의 문을 열어버리려는 거야?"
10038005-116 = "무슨 소리야! ……주변에 아무도 없지? 그런 소리 함부로 하지 말라고."
10038005-117 = "그렇지만 너도 말했던 것처럼, 얼마 전에 붉은겨울 학생들이 산해경을 마음대로 돌아다녔잖아."
10038005-118 = "끄으응……. 그건 그렇긴 했는데……."
10038005-119 = "이제 곧 월영제가 열릴 텐데, 신경 쓰이네……."
10038005-120 = "……아무래도 월영제가 열리면, 현무상회 쪽으로 외부 학생들이 더 많이 들어올 테니까……."
10038005-122 = "모르겠다, 진짜로. 난 그냥 내 할 일이나 해야지……."
10038005-123 = "현룡문 일 하고 있다는 애가 그런 말을 하면 어쩌란 거야."
10038005-124 = "나라고 뭐 뾰족한 수가 있겠냐! 난 그냥 1학년 말단이라고!"
10038005-128 = "에휴……. 그래. 우리가 뭘 알겠어. 도원향에나 가자."
10038005-143 = "그러니까, 월영제다!"
10038005-144 = "[s] \"그게 뭔데?!\""
10038005-148 = "으음……. 그렇지. 선생님은 산해경 외부의 사람이었지."
10038005-149 = "어느 사이엔가 너무 익숙해져 버린 탓인가……. 이따금 그 사실을 잊곤 해. 주의해야겠군."
10038005-150 = "[s] \"미나가 친근하게 생각해 주는 건 기쁜데 말이야……. \""
10038005-154 = "월영제란, 1년에 한 번. 이 시기에 열리는 산해경의 전통 축제다."
10038005-157 = "월영제의 행사가 중점적으로 열리는 것은 현무상회 거리이지만, 축제 자체는 산해경 전체적으로 이루어지지."
10038005-158 = "이 월영제를 즐기기 위해, 현무상회에 많은 외부 학생들이 몰리곤 하지만……."
10038005-159 = "현무상회 외의 거리는, 언제나처럼 외부 학생들에게 개방하지 않는다. 그것이 원칙이니까."
10038005-160 = "[s] \"축제를 그렇게 진행하면, 번거롭지 않아?\""
10038005-163 = "그렇더라도 지켜야 할 것이 있는 법이다!"
10038005-164 = "본디 월영제라는 것이, 산해경 내부에서 풍요를 기원하고 먹을 것을 나누는 절기였으니까!"
10038005-165 = "……그것이 언젠가부터, 현무상회를 기점으로 일부나마 외부에 노출되게 된 것뿐이고."
10038005-166 = "하여튼 현무상회 녀석들, 돈이 된다면 항상 멋대로 일을 크게 벌인단 말이지."
10038005-167 = "그 뒤처리를 누가 떠맡게 된다고 생각하는 건가! 결국 우리 현룡문이 나서게 된단 말이다!"
10038005-168 = "[s] \"자, 자. 일단 진정하자…….\""
10038005-169 = "아무튼, 지금의 월영제는…… 그렇군. 낮에는 달 모양으로 빚은 월병을 서로 나누고."
10038005-170 = "밤에는 경극이나 용춤 등의 공연을 하며, 불꽃놀이를 바라보면서 좋은 운수를 비는 행사가 되었지."
10038005-171 = "그래서 이 시기를 전후로, 우리 현룡문은 현무상회에 대한 규율 집행을 조금 느슨하게 적용하고."
10038005-172 = "순찰이나 야경 활동 같은 것도 강도를 줄여, 외부 학생들에 대한 경계를 거두곤 했는데……."
10038005-173 = "……그, 선생님도 알고 있지 않나. 예전에 있었던 붉은겨울 교류회."
10038005-174 = "그때 이후로 외부 학생들에 대한 불안감이 조금 높아지고 있어서 말이지……. 이대로 월영제를 여는 게 맞나, 하고."
10038005-175 = "[s] \"흐음……. 미나는 어떻게 생각해?\""
10038005-179 = "나 말인가? 나는 언제나 문주님의 명을 따른다. 그것만큼은 변함이 없어."
10038005-180 = "훗. 스스로 이야기한 것이지만, 나 자신의 올곧음에는 언제나 감탄만이 나오는군."
10038005-181 = "……하지만 집행부장으로서, 현룡문 부원들의 의견도 들어 보기는 해야 하는 입장이어서 말이지……."
10038005-182 = "우리 부원들이 어떤 생각을 하고 있느냐고? 그건……."
10038005-185 = "일단, 월영제를 여는 것에는 특별히 다른 의견이 없다. 월영제는 산해경의 자랑스러운 전통이니까."
10038005-186 = "하지만 이번만큼은, 외부 학생과 현무상회에 대한 규율 집행을 엄정하게 유지해야 한다고 생각하는 듯하더군……."
10038005-189 = "아무래도…… 조금 전에 이야기한 것처럼, 외부 학생들에 대한 불안감이 높아지고 있는 상황이어서 말이야."
10038005-190 = "애초에 월영제에 외부인을 들인다는 것 자체가, 현무상회 녀석들이 멋대로 정한 일이기도 하고."
10038005-191 = "이대로는 현무상회의 활동에 우리 현룡문이 끌려다닌다는 인상을 줄 수도 있을 것이고……."
10038005-192 = "아무튼, 현룡문 내부에서는 그런 의견이 있다."
10038005-193 = "그리고 그런 의견을 문주님께 전달드리는 것이 옳은 것인지, 그리고 전달드린다면 어떻게 해야 하는 것인지……."
10038005-194 = "[s] \"그래서 도움이 필요하다고 했던 거구나.\""
10038005-195 = "……미안하다, 선생. 말하기 어려운 이야기를 전달한다는 것이, 아무래도 내게는 쉽지 않은 일이어서……."
10038005-196 = "그런 것은 어른에게도 쉽지 않은 일이라고? 그런가……. 그건 조금 안심이 되는군."
10038005-197 = "……근본적인 문제는 해결되고 있지 않은 듯하지만 말이야……."
10038005-202 = "그렇군. 그런 이야기가 오가고 있는가."
10038005-206 = "?!"
10038005-207 = "[s] \"이 목소리는?!?!\""
10038005-212 = "오랜만…… 은 아니로구나. 선생. 이렇게 빨리 다시 얼굴을 마주할 수 있게 되다니, 그야말로 거자필반(去者必返)이라 해야겠구나. 후후."
10038005-213 = "무, 무무무무무무, 문주님?!"
10038005-214 = "그리 놀라지 말거라. 그리고 현룡문 내부에서 그런 의견이 있다는 것 역시 익히 알고 있었다."
10038005-215 = "저, 저는! 그게! 그러니까!"
10038005-216 = "되었다. 그대는 이미 충분히 잘해 주고 있으니. 허나, 문주로서 월영제에 대한 의견을 이야기하지 않을 수 없겠구나."
10038005-217 = "네, 넷!"
10038005-218 = "학생들의 불안감은 이해하고 있다. 현룡문 부원들의 우려와, 순찰의 강도를 유지하고자 하는 뜻도 알고 있고."
10038005-219 = "허나 그렇기에 더더욱 월영제는 평소와 같이 이루어져야 한다고 고하는 바이다."
10038005-221 = "그 말씀은……?!"
10038005-223 = "잡음은 분명히 존재한다. 바람이 불고 있는 것 역시 마찬가지이고."
10038005-228 = "그러나, 그럼에도 산해경은 굳건하다. 혹은 그러해야 한다. 그렇지 않은가, 미나?"
10038005-229 = "……!"
10038005-230 = "그렇습니다! 지당하신 말씀입니다! 이런 때일수록 오히려……!"
10038005-231 = "그래. 이해가 빠르구나. 그렇다면 무엇을 해야 하는지도 알 수 있겠지?"
10038005-232 = "예, 문주님! 맡겨만 주십시오!"
10038005-239 = "후우……. 선생의 방문이 있었다는 것을 알았다면, 조금 더 다른 형태의 재회를 준비했을 텐데 말이다."
10038005-240 = "[s] \"그래도 다시 보니 좋네. 키사키.\""
10038005-241 = "후후. 그대는 여전하구나. 어떤 의미로는 안심까지 될 정도로다."
10038005-242 = "산해경 역시 그대와 같이 부동(不動)일 수 있다면, 편한 마음으로 월영제를 기대해 달라고 말할 수 있으련만……."
10038005-243 = "그렇게 말하지 않아도, 이미 월영제가 기대되고 있다고?"
10038005-244 = "이것 참, 마지막까지 방심할 수 없게 하는구나. 선생. 좋다. 그대의 기대가 그러하다면, 현룡문 역시 그 기대에 부응해야 하겠지."
10038005-245 = "산해경의 자랑 중 하나인 경극…… 은, 지금은 여러 가지 이유로 시연하기 어려울지 모르나."
10038005-246 = "등놀이나 불꽃놀이, 연주회 같은 것들은 얼마든지 할 수 있을 테니 말이다."
10038005-250 = "그러면, 가 보도록 할까. 선생."
10038005-251 = "[s] \"엥? 어디로?\""
10038005-252 = "그야 당연히, 월영제의 준비와 지원을 위한 자리이겠지."
10038005-253 = "후후. 너무 걱정하지 않아도 좋다. 선생은 그저 내 곁에 있어 주는 것만으로 충분할 터이니."
10038005-254 = "과일도 월병도, 넉넉하게 준비해 둘 터이니 말이다?"
10038005-255 = "[s] \"아아. 소화력이, 당과 지방이……!\""
10038005-256 = "그런 것을 신경 쓰고 있었는가? 호오. 어른이라면 어쩔 수 없다?"
