[translation]
10035095-3 = "헉, 헉……."
10035095-4 = "적 메카 악어, 행동 불능 확인!"
10035095-5 = "기능 정지했습니다!"
10035095-6 = "응, 엔진에서 연기가 나는 걸 보니, 이번에야말로 제압 완료네."
10035095-12 = "후……후!"
10035095-13 = "하하하!"
10035095-14 = "뭐야! 악어 자식, 벌써 퍼진 거냐! 좀 더 근성을 보이라고! 푸하핫!"
10035095-16 = "수류탄 던지고서는 계속 도망 다녔으면서……."
10035095-19 = "[ns] \"모두 수고했어.\""
10035095-20 = "선생님의 지휘 덕분입니다."
10035095-21 = "수고 많으셨습니다."
10035095-25 = "아, 악어 녀석이 저기 있다! 쏴라, 쏴!"
10035095-26 = "사장님, 이미 쓰러졌습니다."
10035095-27 = "……응?"
10035095-28 = "그런가. 파괴된 건가……."
10035095-30 = "네, 메카 악어는 제압 완료했습니다."
10035095-31 = "후속 조치를 부탁드리겠습니다."
10035095-33 = "그, 그렇죠!"
10035095-34 = "이쪽이다, 이쪽! 빨리 와!"
10035095-40 = "부상자들부터 의무실로 이송해! 손님들의 편의를 최우선으로 해라!"
10035095-43 = "네!"
10035095-47 = "아야야……도망치다가 발목을 삐었어요……."
10035095-48 = "제가 의무실로 데려다 드리겠습니다."
10035095-51 = "도, 도망치다가 친구를 잃어버렸어요!"
10035095-52 = "인상착의를 말씀해 주시면 찾아 드리겠습니다."
10035095-55 = "[ns1] \"조금 늦었지만 할 일은 확실하게 하네…….\"\n[ns2] \"그래도, 어찌저찌 해결된 건가.\""
10035095-58 = "불행 중 다행이구만."
10035095-59 = "조금만 더 오래 끌었다간 실내도 쑥대밭이 될 뻔했어."
10035095-60 = "네, 다행히 크게 다친 분들도 없는 것 같습니다."
10035095-61 = "이걸로 한 건 해결이네요!"
10035095-67 = "뭐, 메카 악어를 쓰러뜨린 건 좋은데 말이야."
10035095-68 = "이걸로 끝이라 하기엔 석연찮은 구석이 있지 않아?"
10035095-70 = "네?"
10035095-72 = "아까 악어가 미친개한테 달려들었을 때……."
10035095-77 = "악어 녀석, 갑자기 움직임을 멈췄었잖아."
10035095-78 = "덕분에 수류탄을 던질 수 있었지만……어째서 그랬던 거지?"
10035095-80 = "우연의 일치 아닐까? 딱 그 순간에 에러가 생겼다거나."
10035095-81 = "국장님이 있는 것을 보고 피한 게 아닐까요?"
10035095-83 = "말이 되냐? 암만 봐도 그대로 깔아뭉개는 타이밍이었잖아."
10035095-87 = "미친개, 무슨 수작을 부린 거냐?"
10035095-89 = "수작이라니. 그런 거 부린 적 없다."
10035095-90 = "그럼 아까 그건 어떻게 설명할 건데?"
10035095-91 = "글쎄…… 나도 모르겠군."
10035095-92 = "[s] \"메카 악어를 살펴보면 알 수 있지 않을까?\""
10035095-94 = "그렇네. 어차피 저렇게 놔둘 수도 없으니 잠깐 확인해 보도록 할까."
10035095-95 = "마음대로 손대도 괜찮을까요?"
10035095-97 = "우리가 쓰러뜨렸는데 뭐 어때? 게다가 어차피 이젠 고철 덩어리인 걸."
10035095-102 = "어디보자……싸울 땐 몰랐는데, 꽤나 만듦새가 좋은 물건인걸."
10035095-103 = "네, 마감처리나 이음새도, 상당한 장인이 만든 것 같습니다……."
10035095-105 = "어떤 장인이 이런 물건을 만들어?"
10035095-106 = "어쨌든 열어보기나 하라구."
10035095-115 = "[ns3] \"엄청나게 복잡해서…….\"\n[ns4] \"봐도 모르겠는걸.\""
10035095-118 = "이야, 처음 보는 전선에 처음 보는 회로……아마추어가 판단하기는 어려울 것 같네."
10035095-119 = "보, 보는 것만으로도 눈이 빙글빙글 도는 느낌입니다……"
10035095-120 = "뭐야, 이러면 더 모르겠잖아! 적어도 만든 녀석 이름 정도는 써 두라고!"
10035095-125 = "앗, 저기 있다!"
10035095-129 = "[ns5] \"……?\"\n[ns6] \"이 목소리는……?\""
