[translation]
1602008-1 = "某位狙擊手的秘密基地"
1602008-2 = "（結束外部的會議，正要返回夏萊的途中……）"
1602008-3 = ""
1602008-6 = ""
1602008-7 = "[ns] 「你好！你在做什麼呢？」"
1602008-8 = "啊，[USERNAME]老師！"
1602008-9 = "您辛苦了。"
1602008-10 = "因為收到通報，所以我正在搜索這一帶。"
1602008-11 = "[s] 「是發生了什麼事件嗎？」"
1602008-12 = "不。倒也不是發生了什麼事件……"
1602008-13 = "老師，您有看過這樣的紋樣嗎？"
1602008-14 = ""
1602008-16 = ""
1602008-18 = "[ns1] 「這是什麼塗鴉嗎……？」\n[ns2] 「還是詛咒的咒文……」"
1602008-20 = "請，請別說那種不吉利的話！"
1602008-21 = "最近有通報說D.U.各處都被畫上了像這樣的奇特紋樣，所以我們正在進行調查……"
1602008-22 = "不過該怎麼說呢……紋樣的地點幾乎沒有什麼能稱得上共通點的地方。"
1602008-23 = "既沒有犯罪的痕跡，看起來也不像是想傳達什麼訊息……"
1602008-24 = "但很可疑這一點是無庸置疑的，所以警備局正在加強這一帶的巡邏。"
1602008-25 = "[s] 「真是辛苦你了……」"
1602008-26 = "不會。這是女武神警察學園理應執行的職責。"
1602008-27 = "日後老師您要是也發現了這種紋樣，還請務必通報！"
1602008-28 = "[s] 「嗯。我會記住的。」"
1602008-29 = "謝謝您！"
1602008-30 = ""
1602008-32 = ""
1602008-34 = "（過了一會……）"
1602008-36 = "[ns3] 「咦，天氣預報沒有說會下雨啊……」\n[ns4] 「附近有能躲雨的地方嗎？」"
1602008-39 = "[ns] 跑向高架橋下的陰影處"
1602008-42 = "（下雨天的高架橋下只能偶爾聽見經過的車聲，杳無人跡、一片寂靜）"
1602008-43 = "（似乎有人將建築廢材丟棄在這裡，橋下雜亂地散落著垃圾）"
1602008-44 = "（察看被垃圾遮擋住的柱子時……）"
1602008-45 = "[ns] 「這是……？」"
1602008-47 = "（從女武神學生手上看過的紋樣，就畫在與橋樑下部棧橋相連的梯子上）"
1602008-48 = ""
1602008-51 = "（豎耳傾聽後，感覺到棧橋上有微小的動靜）"
1602008-52 = "[ns5] 「是野生動物嗎……？」\n[ns6] 「但也有可能是不良學生的據點……」"
1602008-55 = "[ns] 順著梯子往上爬"
1602008-59 = "……是誰！"
1602008-60 = "[ns7] 「別，別開槍！」\n[ns8] 「我只是剛好路過而已！」"
1602008-62 = "如果只是路過，為什麼要特地爬上梯子？"
1602008-63 = "……咦，老師？"
1602008-64 = ""
1602008-66 = ""
1602008-67 = "[ns] 「御伽？」"
1602008-68 = "啊啊，被發現了呢。#n明明是才剛做好沒多久的秘密基地。"
1602008-69 = ""
1602008-71 = ""
1602008-72 = ""
1602008-73 = "你是怎麼知道我在這裡的？"
1602008-74 = "[s] 「因為梯子上畫著奇怪的紋樣。」"
1602008-75 = "啊，你是說Hobo Code吧。"
1602008-76 = "這個紋樣是街頭的流浪者們使用的一種暗號。"
1602008-77 = "用紋樣來告知這裡有誰在，是不是安全地帶之類的。"
1602008-78 = "因為執行狙擊任務經常需要進入流浪者的地盤，#n所以我才會用紋樣做了標示，以免和其他人的區域重疊……"
1602008-79 = "沒想到那反而引起了老師的注意啊……看來下次得改用別的方法才行。"
1602008-80 = "[s] 「這裡是御伽的秘密基地嗎？」"
1602008-81 = "嗯。比想像中還要舒適吧？"
1602008-82 = "別看它這樣，不管是彈藥、電池，還是其他作戰所需的物品都有好好備齊哦。"
1602008-83 = "而且為了在作戰中喘口氣……我也準備了咖啡壺！"
1602008-84 = ""
1602008-86 = ""
1602008-87 = "嗯……看來這場雨暫時是不會停了……"
1602008-88 = "怎麼樣，要不要喝杯咖啡再走？"
1602008-93 = "― [log=오토기]嗚……好苦……[/log][wa:2920] "
1602008-95 = "― [log=오토기]陳年的豆子為什麼總是這麼不好喝呢。[/log]"
1602008-98 = "[ns9] 「我倒覺得沒那麼糟。」\n[ns10] 「在這樣的雨天，在外面喝著咖啡也別有一番浪漫。」"
1602008-101 = "― [log=오토기]浪漫……是嗎。[/log][wa:1716] "
1602008-103 = "― [log=오토기]……說的也是。 [/log][wa:10] "
1602008-106 = "― [log=오토기]要是沒有那份浪漫，[/log]"
1602008-108 = "― [log=오토기]我大概也走不到今天這一步吧。[/log][wa:394] "
1602008-111 = "― [log=오토기]小時候，[/log][wa:970] "
1602008-113 = "― [log=오토기]你有沒有對秘密基地有過憧憬？[/log]"
1602008-116 = "― [log=오토기]可是，[/log]"
1602008-118 = "― [log=오토기]實際做出來之後卻跟想像中完全不一樣……[/log]"
1602008-121 = "― [log=오토기]不只空間狹窄，[/log]"
1602008-123 = "― [log=오토기]能做的事也不多。[/log]"
1602008-127 = "― [log=오토기]總覺得……[/log][wa:2500] "
1602008-129 = "― [log=오토기]像是被迫面對了夢想與現實呢。[/log]"
1602008-132 = "― [log=오토기]無論是理想的大人，[/log]"
1602008-134 = "― [log=오토기]還是SRT的生活。[/log]"
1602008-137 = "― [log=오토기]不過……[/log][wa:1590] "
1602008-139 = "― [log=오토기]或許正因為如此吧。[/log]"
1602008-142 = "― [log=오토기]無論現實是什麼模樣， [/log][wa:10] "
1602008-144 = "― [log=오토기]我都開始覺得別有一番風味。[/log][wa:280] "
1602008-147 = "― [log=오토기]老師你……對乘載著浪漫的陳年咖啡，[/log][wa:3510] "
1602008-149 = "― [log=오토기]是怎麼想的呢？[/log]"
1602008-152 = "― [log=오토기]呵呵……[/log]"
1602008-154 = "― [log=오토기]重新向你介紹一次，歡迎來到我的世界。[/log][wa:1700] "
1602008-157 = "（之後在下著雨的高架橋下和御伽一起喝著咖啡，度過了愉快的時光）"
