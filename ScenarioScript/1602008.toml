[translation]
1602008-1 = "A Certain Sniper's Secret Base"
1602008-2 = "I was on my way back to Schale after a business meeting..."
1602008-3 = ""
1602008-6 = ""
1602008-7 = "[ns] \"Hello! Is something going on here?\""
1602008-8 = "Ah, [USERNAME] Sensei!"
1602008-9 = "Hello! Thanks for all your service, Sensei."
1602008-10 = "We were searching the area due to a report that came into Valkyrie."
1602008-11 = "[s] \"Did something happen?\""
1602008-12 = "No, it's more of just a strange occurrence."
1602008-13 = "Sensei, have you seen this pattern before?"
1602008-14 = ""
1602008-16 = ""
1602008-18 = "[ns1] \"A doodle...?\"\n[ns2] \"Is it some kind of curse...?\""
1602008-20 = "D-Don't say something so ominous!"
1602008-21 = "We have recently received reports of such mysterious patterns appearing in various locations across D.U. and are currently investigating the matter..."
1602008-22 = "We haven't been able to find anything to connect the locations."
1602008-23 = "No crimes have been committed, and symbol analysis didn't come up with anything either."
1602008-24 = "But it still seems suspicious, so the Security Bureau has been stepping up patrols in this area."
1602008-25 = "[s] \"You've got a lot on your plate...\""
1602008-26 = "It's just standard duty for Valkyrie Police School."
1602008-27 = "If you happen to see this pattern anywhere, please report it, Sensei!"
1602008-28 = "[s] \"I'll keep it in mind.\""
1602008-29 = "Thank you!"
1602008-30 = ""
1602008-32 = ""
1602008-34 = "A while later..."
1602008-36 = "[ns3] \"Ah, the forecast didn't say anything about rain...\"\n[ns4] \"Where can I take shelter?\""
1602008-39 = "[ns] Head towards the shade beneath the overpass."
1602008-42 = "There was no one around, and the only thing I could hear from under the overpass was the pitter patter of the rain and rush of cars passing by."
1602008-43 = "Someone must have been illegally dumping construction waste here, as there was trash scattered haphazardly everywhere."
1602008-44 = "I noticed something strange on one of the pillars."
1602008-45 = "[ns] \"This is...?\""
1602008-47 = "Looking more closely, I saw the mark that the Valkyrie students had shown me, drawn on top of a ladder that connected to a second, makeshift bridge."
1602008-48 = ""
1602008-51 = "I thought I heard someone on top of it."
1602008-52 = "[ns5] \"A wild animal...?\"\n[ns6] \"I should check this out...\""
1602008-55 = "[ns] Climb up the ladder."
1602008-59 = "...Who's there?!"
1602008-60 = "[ns7] \"D-Don't shoot!\"\n[ns8] \"I was just passing by!\""
1602008-62 = "Why would a random passerby decide to climb the ladder?!"
1602008-63 = "...Oh, Sensei?"
1602008-64 = ""
1602008-66 = ""
1602008-67 = "[ns] \"Otogi?\""
1602008-68 = "Ack. You found me. I just made this base too."
1602008-69 = ""
1602008-71 = ""
1602008-72 = ""
1602008-73 = "How did you know I was here?"
1602008-74 = "[s] \"I just followed the weird symbol on the ladder.\""
1602008-75 = "Oh, the Shelter Code."
1602008-76 = "Unhoused people use symbols like this to communicate."
1602008-77 = "The symbols say who's here and if the area is safe."
1602008-78 = "My missions often cause me to encroach on their territory, so I mark the areas I use..."
1602008-79 = "I didn't expect it to be what drew you in. I'll have to rethink my methods."
1602008-80 = "[s] \"Is this your secret base?\""
1602008-81 = "Yes. Pretty comfy, right?"
1602008-82 = "It may not look like it, but it also has essential supplies for missions, like bullets or batteries."
1602008-83 = "And a coffee pot! For if I ever need to take a breather."
1602008-84 = ""
1602008-86 = ""
1602008-87 = "Hm. It doesn't seem like the rain's going to stop any time soon..."
1602008-88 = "What do you think? Want a cup of coffee?"
1602008-93 = "― [log=오토기]Ugh... It's bitter and dry...[/log][wa:2040] "
1602008-95 = "― [log=오토기]It's seriously awful. Maybe the beans have gone bad.[/log]"
1602008-98 = "[ns9] \"I didn't think it was that bad.\"\n[ns10] \"It's like a dream, drinking coffee outdoors in the rain.\""
1602008-101 = "― [log=오토기]My dream...[/log][wa:1556] "
1602008-103 = "― [log=오토기]Yeah. [/log][wa:40] "
1602008-106 = "― [log=오토기]Without that dream,[/log]"
1602008-108 = "― [log=오토기]I would never have made it as far as I did.[/log][wa:10] "
1602008-111 = "― [log=오토기]Did you[/log][wa:850] "
1602008-113 = "― [log=오토기]ever want to make a secret base when you were young?[/log]"
1602008-116 = "― [log=오토기]The reality of it[/log]"
1602008-118 = "― [log=오토기]ended up being pretty different from my imagination when I did finally make one.[/log]"
1602008-121 = "― [log=오토기]They're cramped, uncomfortable, [/log]"
1602008-123 = "― [log=오토기]and pretty boring.[/log]"
1602008-127 = "― [log=오토기]I guess [/log][wa:2380] "
1602008-129 = "― [log=오토기]that's how it always is with dreams. Reality never lives up to them. [/log]"
1602008-132 = "― [log=오토기]Things like an ideal adult,[/log]"
1602008-134 = "― [log=오토기]life in SRT...[/log]"
1602008-137 = "― [log=오토기]But at the same time,[/log]"
1602008-139 = "― [log=오토기]because of that dream...[/log]"
1602008-142 = "― [log=오토기]The disappointments of reality [/log][wa:10] "
1602008-144 = "― [log=오토기]have become an acquired taste for me. [/log][wa:10] "
1602008-147 = "― [log=오토기]Sensei. What does cheap coffee steeped in my dreams[/log][wa:2150] "
1602008-149 = "― [log=오토기]taste like?[/log]"
1602008-152 = "― [log=오토기]Fufu.[/log]"
1602008-154 = "― [log=오토기]Once again, welcome to my world.[/log][wa:1140] "
1602008-157 = "Otogi and I waited out the rain beneath the overpass, sipping her bitter coffee together."
