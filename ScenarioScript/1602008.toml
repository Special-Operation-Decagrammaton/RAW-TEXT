[translation]
1602008-1 = "ฐานลับของสไนเปอร์"
1602008-2 = "(ขณะเดินทางกลับชาเล่ต์หลังจากเสร็จการประชุมนอกสถานที่...)"
1602008-3 = ""
1602008-6 = ""
1602008-7 = "[ns] \"ไง! กำลังทำอะไรอยู่เหรอ?\""
1602008-8 = "อ๊ะ คุณครู [USERNAME]!"
1602008-9 = "ทำความเคารพ! ไปทำงานมาเหนื่อยเลยสินะคะ"
1602008-10 = "มีการแจ้งเหตุเข้ามายังวัลคิรี่ พวกฉันก็เลยมาตรวจค้นพื้นที่บริเวณนี้อยู่ค่ะ"
1602008-11 = "[s] \"เกิดคดีอะไรขึ้นงั้นเหรอ?\""
1602008-12 = "เปล่าค่ะ มันไม่ใช่เรื่องใหญ่จนเรียกว่าเป็นคดีได้หรอก..."
1602008-13 = "ว่าแต่ คุณครูเคยเห็นเครื่องหมายลวดลายแบบนี้มาก่อนมั้ยคะ?"
1602008-14 = ""
1602008-16 = ""
1602008-18 = "[ns1] \"นี่มันรอยเขียนเล่นที่แฝงความหมายอะไรหรือเปล่า...?\"\n[ns2] \"เป็นตราคำสาปอะไรงั้นเหรอ...?\""
1602008-20 = "ยะ... อย่าพูดอะไรลางไม่ดีแบบนั้นสิคะ!"
1602008-21 = "ช่วงนี้ยิ่งมีแจ้งเหตุเข้ามาว่าพบเครื่องหมายปริศนาคล้ายๆ กันนี้ถูกวาดไว้ตามจุดต่างๆ ทั่วทั้งเขต D.U. อยู่ด้วย..."
1602008-22 = "แต่จะว่ายังไงดีล่ะคะ จากที่สืบหามา สถานที่ที่พบเครื่องหมายนั้นแทบไม่มีจุดร่วม#nหรือความเหมือนกันเลยค่ะ"
1602008-23 = "ไม่มีร่องรอยของอาชญากรรม และดูไม่ได้พยายามสื่ออะไรเป็นพิเศษด้วย..."
1602008-24 = "แต่ในเมื่อมันน่าสงสัยไปทุกที่ ทางสำนักความมั่นคงก็เลยเพิ่มกำลังลาดตระเวนอยู่ค่ะ"
1602008-25 = "[s] \"เหนื่อยกันน่าดูเลยนะ...\""
1602008-26 = "ไม่หรอกค่ะ นี่คือหน้าที่ของสถาบันฝึกตำรวจวัลคิรี่อยู่แล้วค่ะ"
1602008-27 = "ถ้าคุณครูไปเจอเครื่องหมายแบบนี้เข้า ก็ช่วยแจ้งเข้ามาด้วยนะคะ!"
1602008-28 = "[s] \"อื้อ ถ้าเจอครูจะแจ้งไปนะ\""
1602008-29 = "ขอบคุณค่ะ!"
1602008-30 = ""
1602008-32 = ""
1602008-34 = "(ครู่ต่อมา...)"
1602008-36 = "[ns3] \"อะไรกัน พยากรณ์อากาศไม่ได้บอกว่าฝนจะตกนี่นา...\"\n[ns4] \"แถวนี้มีที่ไหนให้หลบฝนได้บ้างมั้ยนะ?\""
1602008-39 = "[ns] เดินไปใต้ร่มทางยกระดับ"
1602008-42 = "(ใต้ทางยกระดับในวันที่ฝนตกนั้นปราศจากผู้คน จะได้ยินก็แค่เสียงรถยนต์วิ่งผ่านเป็นครั้งคราว)"
1602008-43 = "(ขยะกระจัดกระจายอยู่เกลื่อนกลาด ราวกับว่ามีคนนำเศษวัสดุก่อสร้างที่ไม่ได้ใช้แล้วมาทิ้งไว้)"
1602008-44 = "(คุณครูมองไปยังเสาต้นหนึ่งที่อยู่หลังกองขยะ...)"
1602008-45 = "[ns] \"นี่มัน...?\""
1602008-47 = "(เครื่องหมายที่นักเรียนโรงเรียนวัลคิรี่เอาให้ดูเมื่อสักครู่ถูกวาดไว้ตรงบันไดที่เชื่อมต่อกับ#nสะพานด้านล่าง)"
1602008-48 = ""
1602008-51 = "(เมื่อเงี่ยหูฟัง ก็รู้สึกได้ลางๆ ว่าอาจมีอะไรอยู่)"
1602008-52 = "[ns5] \"สัตว์ป่างั้นเหรอ...?\"\n[ns6] \"แต่อาจจะเป็นที่หลบซ่อนของพวกนักเรียนเกเรก็ได้...\""
1602008-55 = "[ns] เดินขึ้นบันไดไป"
1602008-59 = "ใครน่ะ...!"
1602008-60 = "[ns7] \"ยะ... อย่ายิงนะ แค่เดินผ่านมาเฉยๆ!\"\n[ns8] \"ยะ... อย่ายิงนะ แค่ผ่านมาเฉยๆ น่ะ!\""
1602008-62 = "อะไรกัน ถ้าแค่ผ่านมาทางนี้เฉยๆ แล้วทำไมต้องเดินขึ้นบันไดมาด้วย?"
1602008-63 = "เอ๋... คุณครูเหรอ?"
1602008-64 = ""
1602008-66 = ""
1602008-67 = "[ns] \"โอโทกิ?\""
1602008-68 = "อ่า โดนจับได้ซะแล้ว ฐานลับนี้ฉันเพิ่งสร้างเสร็จได้ไม่นานแท้ๆ"
1602008-69 = ""
1602008-71 = ""
1602008-72 = ""
1602008-73 = "รู้ได้ยังไงน่ะว่าฉันอยู่ที่นี่?"
1602008-74 = "[s] \"เห็นว่ามีสัญลักษณ์แปลกๆ วาดอยู่ที่บันไดน่ะ\""
1602008-75 = "อ๋อ หมายถึงโฮโบโค้ดสินะ"
1602008-76 = "เครื่องหมายนี้เป็นโค้ดลับประเภทหนึ่งที่พวกคนพเนจรตามท้องถนนใช้กันน่ะ"
1602008-77 = "มันใช้เพื่อบอกว่าใครอยู่ที่นี่ สถานที่นั้นปลอดภัยหรือเปล่า ประมาณนี้น่ะ"
1602008-78 = "ระหว่างทำภารกิจซุ่มยิง มีบ่อยครั้งที่เราต้องเข้าไปใช้พื้นที่ในเขตของพวกคนพเนจร ที่ฉันทำเครื่องหมายทิ้งไว้ ก็เพื่อป้องกันไม่ให้ตำแหน่งซุ่มยิงไปซ้ำซ้อนกับคนอื่นน่ะ..."
1602008-79 = "คิดไม่ถึงเลยนะว่ามันจะไปสะดุดตาคุณครูเข้าให้ ต่อไปฉันคงต้องใช้วิธีอื่นแล้วละ"
1602008-80 = "[s] \"ที่นี่คือฐานลับของโอโทกิเหรอ?\""
1602008-81 = "อื้อ ดูอยู่สบายมากกว่าที่คิดใช่มั้ยล่ะ?"
1602008-82 = "เห็นแบบนี้ก็เถอะ แต่ฉันก็เตรียมของจำเป็นสำหรับภารกิจอย่างกระสุนหรือแบตเตอรี่ไว้#nพร้อมสรรพเลย"
1602008-83 = "แถมยังมีหม้อต้มกาแฟด้วย... ไว้สำหรับพักหายใจระหว่างทำปฏิบัติการยังไงล่ะ!"
1602008-84 = ""
1602008-86 = ""
1602008-87 = "อืม ฉันว่าฝนไม่น่าจะหยุดตกในเร็วๆ นี้นะ"
1602008-88 = "คุณครูอยู่ดื่มกาแฟสักแก้วก่อนมั้ย?"
1602008-93 = "― [log=오토기]อึก... ทั้งขมทั้งฝาดคอ...[/log][wa:2200] "
1602008-95 = "― [log=오토기]คงเพราะปล่อยเมล็ดกาแฟทิ้งไว้นาน รสชาติเลยไม่ได้เรื่องเลย[/log]"
1602008-98 = "[ns9] \"ครูว่ามันก็ไม่ได้แย่ขนาดนั้นนะ\"\n[ns10] \"ได้ดื่มกาแฟข้างนอกในวันฝนตก ครูว่ามันชวนเพ้อฝันดีนะ\""
1602008-101 = "― [log=오토기]ชวนเพ้อฝันงั้นเหรอ...[/log][wa:1156] "
1602008-103 = "― [log=오토기]นั่นสินะ [/log][wa:10] "
1602008-106 = "― [log=오토기]ถ้าไม่ใช่เพราะความเพ้อฝันนั่นแล้วละก็[/log]"
1602008-108 = "― [log=오토기]ฉันก็คงมาไม่ถึงจุดนี้หรอก[/log][wa:10] "
1602008-111 = "― [log=오토기]ตอนเด็กๆ[/log][wa:810] "
1602008-113 = "― [log=오토기]ไม่เคยอยากมีฐานลับบ้างเหรอ?[/log]"
1602008-116 = "― [log=오토기]แต่พอได้[/log]"
1602008-118 = "― [log=오토기]มีเข้าจริงๆ มันก็ต่างจากที่คิดไว้เยอะเลยละ[/log]"
1602008-121 = "― [log=오토기]ทั้งแคบ ไม่สะดวก[/log]"
1602008-123 = "― [log=오토기]แล้วก็ทำอะไรไม่ได้มาก...[/log]"
1602008-127 = "― [log=오토기]ชีวิตจริง[/log][wa:2340] "
1602008-129 = "― [log=오토기]ที่ฉันเคยเฝ้าฝัน คงเป็นแบบนั้นมาตลอดสินะ[/log]"
1602008-132 = "― [log=오토기]ทั้งภาพลักษณ์ของผู้ใหญ่ในอุดมคติ[/log]"
1602008-134 = "― [log=오토기]และชีวิตใน SRT[/log]"
1602008-137 = "― [log=오토기]แต่ก็คง[/log][wa:1470] "
1602008-139 = "― [log=오토기]เป็นเพราะความเพ้อฝันนั่นละมั้ง[/log]"
1602008-142 = "― [log=오토기]ความไม่สะดวกสบายในชีวิตจริง [/log][wa:10] "
1602008-144 = "― [log=오토기]ตอนนี้เลยกลายเป็นรสชาติที่แปลกของฉันไปแล้ว [/log][wa:10] "
1602008-147 = "― [log=오토기]คุณครู กาแฟราคาถูกที่ชงมาด้วยความเพ้อฝัน[/log][wa:2590] "
1602008-149 = "― [log=오토기]รสชาติเป็นยังไงบ้าง?[/log]"
1602008-152 = "― [log=오토기]ฮุฮุ [/log]"
1602008-154 = "― [log=오토기]ยินดีต้อนรับสู่โลกของฉันอีกครั้งนะ[/log][wa:1060] "
1602008-157 = "(หลังจากนั้นคุณครูกับโอโทกิก็ดื่มกาแฟที่ใต้ทางยกระดับในวันฝนตกต่อ และได้ใช้เวลาร่วมกันอย่างสนุกสนาน)"
