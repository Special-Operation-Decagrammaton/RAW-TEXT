[translation]
10038100-1 = "제10화;같은 하늘을 머리에 이고"
10038100-9 = "생각보다는 늦었구나. 키사키. 이미 날이 저물고 있다."
10038100-10 = "어딘가의 누군가가 워낙 화려하게 저질러 주어서 말이지. 이것 참, 수습하는 쪽의 입장도 생각해 주었으면 한다만."
10038100-11 = "누가 그런 것을 바랐다고 그러는 것이냐. 여전히 중심을 잡지 못하고 있구나."
10038100-12 = "강물 속의 목소리를 듣지 못하는 너에게는 알 수 없는 일이겠지."
10038100-13 = "들리지 않는 소리에게는 그만한 이유가 있는 법이다. 한 번 패배하고 도망간 문주에게, 무슨 할 말이 남아 있다는 것인지 궁금하구나."
10038100-14 = "후후. 아무래도 너에게 할 말이 있는 것은 나뿐만이 아닌 것 같아서 말이다."
10038100-15 = "흐음?"
10038100-23 = "……오랜만인 것이다. 카이 선배."
10038100-24 = "이거야 원, 누구인가 했더니 후배님 아니신가. 쿡쿡쿡……. 내가 없는 동안 연단방을 멋대로 운영하느라 수고가 많았던 모양이던데?"
10038100-25 = "나님에게 있어서 선배는, 여전히 알 수 없는 사람인 것이다."
10038100-26 = "다시 만날 일이 생긴다면, 선배에 대한 나님의 생각이 변할 수 있기를 바랐지만……."
10038100-27 = "……역시나 그건, 무리인 것 같은 것이다……."
10038100-28 = "무슨 말을 하려나 했더니, 고작 그 정도인가."
10038100-29 = "쿡쿡쿡……. 우습구나. 애초에 너와 나 사이에, 그 정도의 차이점이랄 게 있었을까?"
10038100-30 = "……?"
10038100-34 = "너의 조제 기록 또한 전부 살펴보았다. 단약의 개발을 빌미 삼아, 온갖 실험을 하고 다녔던 것은 너 역시 마찬가지이지 않았느냐."
10038100-38 = "그건 다르다. 나님이 만든 단약은……!"
10038100-39 = "[s] \"사야의 단약은, 사야의 행복을 위한 물건이 아니었으니까.\""
10038100-43 = "……선생인가."
10038100-44 = "선생도 제법 사야의 실험 대상이 되었던 모양이던데."
10038100-45 = "그런데도 사야를 굳이 비호하려는 것인가. 흥미로운 일이로군."
10038100-46 = "[s] \"……확실히, 이런저런 곤란한 일도 있었지만…….\""
10038100-48 = "서, 선생?!"
10038100-49 = "[s] \"그래도, 사야의 시선은 언제나 타인을 향하고 있었어.\""
10038100-52 = "[ns1] \"단약을 대가로 부귀를 취하려 하지도 않았고.\"\n[ns2] \"사람들이 불행해지는 것을 막기 위해 손해도 감내해 왔어.\""
10038100-57 = "그래……. 바로 그것이 문제였지. 그렇게 생각하지 않나, 선생?"
10038100-58 = "실패와 부작용을 두려워한다면 성취를 거둘 수 없다."
10038100-59 = "아무리 과정에서 수많은 실패와 부작용이 따르더라도, 그 피해를 상회하는 성취만 거둔다면 누구도 이를 문제 삼지는 못할 것이다."
10038100-63 = "오히려 겁을 내어 도중에 도망친다면, 어줍잖은 실패만 거듭한 패배자로 기록될 뿐이지."
10038100-64 = "선배가…… 그 누구보다 불로불사의 영약에 가깝게 다가간 사람이라는 것은, 나님 역시 알고 있는 것이다."
10038100-65 = "그렇지만 역시, 선배의 방식은 모두를 불행하게 만드는 것이다……!"
10038100-66 = "쿡쿡쿡……. 이미 전에 한 번 나누었던 대화이지만, 궤변이로군."
10038100-67 = "네가 말하는 그 행복은 누가 정의한 것이지?"
10038100-68 = "설마. 자신에게 부족한 것이 무엇인지조차 알지 못하는 범부들이, 스스로 행복의 방향을 결정할 수 있다고 생각하는 건 아니겠지?"
10038100-69 = "………."
10038100-70 = "대답하지 못하는구나. 그때와 같이."
10038100-71 = "그렇겠지. 대부분의 사람들은 무지하고 탐욕스러우니까."
10038100-72 = "모자란 부분을 채워주면, 오히려 그 때문에 불행해졌다고 불평하는 배은망덕한 자들이 대부분이니 말이다."
10038100-73 = "……누가 뭐라고 하든 나는 선단(仙丹)을 만들 것이다."
10038100-74 = "우리를 선인(仙人)으로 이끌어 줄, 범부들의 끝없는 욕망을 채워줄 수 있는 궁극의 영약을 말이다."
10038100-80 = "기억해 내라. 야쿠시 사야. 선인(仙人)에 도달하려는 시도야말로 우리 [ruby=연단방]연구자[/ruby]들의 시초이자 궁극적인 목적이었음을."
10038100-81 = "하지만 우리는……!"
10038100-86 = "그러니 우리는, 결과에 대한 이야기를 할 수밖에 없는지도 모르지."
10038100-90 = "아, 키사키인가. 반갑구나. 너무나 말이 없기에 깜빡 실종된 줄 알았지 뭐냐."
10038100-91 = "너의 단약으로 몸을 망가뜨린 학생들을 기억하는가? 아니면 그런 사소한 문제들은 기억할 가치조차 없었기에 잊었다고 할 테냐?"
10038100-92 = "쿡쿡쿡……. 기억하고 있지. 기억하고 있다마다. 그 모두가 소중한 하나의 증례들인데, 어찌 기억하지 않을 수 있겠는가."
10038100-93 = "그렇다면 사야가 그 학생들을 치료하느라 정작 자신의 연구에 매진하지 못한 것도 알고 있겠구나."
10038100-94 = "한 가지만 확실하게 해 두지. 그것은 모두 그 학생들이 스스로 원한 일이었다."
10038100-95 = "사람은 대개, 자기가 정확히 무엇을 원하는지 모르는 법이다."
10038100-96 = "자신의 선택이 어떤 결과를 불러오게 될지 알지 못하고, 그 결과를 감당하기 어려워하는 일도 부지기수다."
10038100-97 = "범부(凡夫)들의 무지에 대한 책임마저 우리가 져야 하는가? 그 관점에는 어떻게 해도 찬성할 수 없구나."
10038100-98 = "아니. 우리 모두가 어떤 부분에서는 범부(凡夫)이기에, 서로를 관대하게 대해야 한다는 이야기를 하고 있는 것이다."
10038100-99 = "그것은 너와 같은 자들에게나 해당하는 일일 것이다만?"
10038100-100 = "네가 그런 시각으로 나를 바라본다면, 얼마든지 그렇게 하도록 해라."
10038100-107 = "그 숱한 범부(凡夫) 중의 한 사람으로서, 그때와 같이, 산해경에 네가 있을 자리는 없다는 것을 다시 한번 고하겠다."
10038100-112 = "결국 스스로 자신의 가치를 낮추려 하는가……. 실망이구나. 키사키."
10038100-113 = "이만한 시간이 지났으니, 조금은 이야기를 나눌 수 있는 상대가 되었으리라고 기대하고 있었는데."
10038100-114 = "후후. 나에게 앙갚음하겠다는 자의 말치고는, 상당히 독기가 빠져 있는 것처럼 들리는데 말이다?"
10038100-115 = "……그런 것은, 지금에 와서는 내가 결심만 하면 언제든 이뤄낼 수 있는 일에 불과하다."
10038100-116 = "잊었는가? 날 이렇게 만든 것은 너였다는 것을 말이다."
10038100-117 = "그래……. 너는 분명히 그런 말을 했지. 그렇다면 이 자리에서 확실하게 이야기해 두도록 하지."
10038100-122 = "지금의 널 만든 것은, 다른 누구도 아닌 너다."
10038100-127 = "뭐라……?!"
10038100-128 = "네가 선택했다. 네가 초래했고, 네가 결정했다."
10038100-129 = "타인을 범부(凡夫)로 정의한 것도 너였고, 그렇기에 자신은 범부(凡夫)들과 다르다고 선언한 것도 너였다."
10038100-130 = "그럼에도 불구하고 나를 끝끝내 원망하겠다면, 그렇게 해라."
10038100-131 = "산해경의 문주라는 것은, 애초부터 이런저런 귀찮은 것들을 짊어지기 위해 존재하는 자리이니."
10038100-132 = "뚫린 입이라고 잘도 떠드는구나……."
10038100-137 = "결정했다. 다음 단약의 시험은, 다른 누구도 아닌 너로 하겠다."
10038100-138 = "호오, 네가? 정말로 그렇게 할 수 있겠느냐?"
10038100-139 = "오히려 그렇게 여유를 부릴 수 있다는 점이 신기하기까지 하구나. 키사키."
10038100-144 = "사야의 신변이 구속되고, 그러고 나서도 이만한 시간이 지났다."
10038100-145 = "슬슬, 제 자리에 서 있기도 힘든 때가 되지 않았느냐?"
10038100-146 = "후후……. 그렇게 생각하고 있었구나. 과연, 그렇겠지."
10038100-151 = "그렇다면 너의 눈으로 직접 확인해 보거라. 네 앞에 서 있는 현룡문의 문주가, 과연 누구인지를 말이다."
