[translation]
42230-1 = "제23화;실패한 쿠데타"
42230-4 = "총학생회장 대행 집무실"
42230-6 = "후후…… 늦은 브런치를 즐기고 나서 마시는 에스메랄다의 향기는 각별하군요."
42230-7 = "조금 비싼 원두라 구하는 데 조금 애를 먹긴 했지만, 오늘을 기념하는 한 잔으로 이 정도의 사치는 나쁘지 않겠지요."
42230-11 = "어디 보자. 코우사기 역의 폭발 소식이 들려올 때가 되었는데……"
42230-18 = "네, 총학생회장 대행직을 맡고 있는 시라누이 카야입니다."
42230-19 = "아, 제너럴. 안 그래도 연락을 기다리고 있었답니다."
42230-20 = "코우사기 역에서의 일은 무사히 잘 끝내셨는지요?"
42230-24 = "……네? FOX 소대가 작전에 실패……?"
42230-25 = "그리고 무장한 RABBIT 소대가 샬레의 선생님과 함께 총학생회 건물로 향하고 있다고요……?"
42230-26 = "그, 그게 무슨 소리인가요, 제너럴. 다시 한번 천천히 설명해 주세요."
42230-30 = "선생이 지휘하는 SRT 대원들을 막을 수가 없었다니, 그게 무슨 소리인가요……"
42230-37 = "돈을 받았으면……"
42230-39 = "무슨 수를 써서라도 막아야 할 거 아냐!"
42230-51 = "여기는 RABBIT 1, 상행선로에 도착했습니다."
42230-52 = "여기는 RABBIT 2, 현장 수색 완료. 추가로 파악된 위협 없음."
42230-54 = "여기는 RABBIT 3. 방금 하이랜더 철도학원에 사고 소식을 전파하여 총학생회 건물까지 향하는 노선을 봉쇄했어."
42230-55 = "앞으로 1시간 동안 철로의 운행 예정은 없을 테니 안심하고 직진해도 좋아!"
42230-56 = "확인."
42230-57 = "RABBIT 2, RABBIT 4. 목표가 도주할 수 있으니 총학생회 건물까지 신속하게 돌입합시다!"
42230-59 = "아, 알겠어……!"
42230-60 = "맡겨줘!"
42230-66 = "SRT의 여우 녀석들이 당해버린 모양이군……"
42230-67 = "제대로 훈련도 받지 못한 애송이들에게 당하다니, 녀석들은 특수부대의 수치야."
42230-73 = "카이저 SOF를 이곳에 미리 대기시켜 두길 잘했군."
42230-74 = "원래는 여우를 상대하기 위해 준비한 카드이지만, 토끼를 상대로도 그 역할은 다할 수 있을 터."
42230-76 = "나는 방심하다가 실패하는 머저리들과는 다르지—"
42230-90 = "탱고, 다운!"
42230-95 = "확인. 계속해서 쉬지 않고 전진합니다."
42230-100 = "죄, 죄송합니다……!"
42230-110 = "[ns] \"미안, 먼저 지나간다.\""
42230-114 = "뭐야, 저 녀석들……"
42230-115 = "사람을 바보 취급해도 유분수지……"
42230-116 = "……절대로 용서 못 한다, SRT!"
