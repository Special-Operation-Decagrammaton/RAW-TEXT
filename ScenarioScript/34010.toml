[translation]
34010-1 = "제1화;프롤로그"
34010-4 = "저쪽이다!!"
34010-5 = "쫓아라!!"
34010-10 = "트, 틀렸어요…… 이쪽은 막다른 길……."
34010-11 = "……반대쪽도 마찬가지야. 완벽하게 포위되었어."
34010-12 = "크윽……."
34010-19 = "포기해라, 스쿼드. 더 이상 도망칠 수 없을 거다."
34010-23 = "……."
34010-24 = "히, 히익……."
34010-25 = "(휘익, 휘릭-)"
34010-26 = "……탄약도 거의 다 떨어졌고, 마지막 식사와 수면을 취한지는 80시간이 넘었어. 이제 체력도 한계……."
34010-27 = "게다가 리더의 상처가 커. 이대로라면 도피는커녕 리더의 생명이 위태로울지도 몰라."
34010-33 = "……아니, 최후의 수단이라면 아직 하나 남아 있어. 이거라면……."
34010-34 = "네?! 서, 설마."
34010-35 = "……헤일로를 파괴하는 폭탄."
34010-36 = "미사키, 히요리. 내가 시간을 끄는 사이에 공주님을 데리고…… 이곳을 빠져나가는 거야."
34010-37 = "……사오리."
34010-38 = "이곳을 빠져나가서……. 그다음엔…… 그다음엔……."
34010-39 = "그…… 다음엔……."
34010-40 = "사오리."
34010-41 = "……?!"
34010-46 = "이제 됐어. 우리는 할 만큼 했어."
34010-47 = "……."
34010-48 = "고, 공주님……."
34010-53 = "<그녀>가 원하는 건 나잖아. 그렇지?"
34010-54 = "내가 갈게. 그러니까 다른 아이들은 눈감아줬으면 해."
34010-55 = "……."
34010-57 = "아츠코! 무슨 소리야! 안 돼!!"
34010-59 = "……. 이제 됐어. 사오리. 무의미해."
34010-60 = "여기를 빠져나가면? 그다음에는? 다음 방법은 있어? 도망칠 곳은 있을까?"
34010-61 = "……."
34010-62 = "트리니티, 게헨나, 그리고 아리우스에서도 우리를 쫓고 있어."
34010-63 = "이 키보토스에 우리가 도망칠 곳은 없어. 죽을 때까지 쫓기는 삶이 이어질 뿐이야."
34010-64 = "생각해보면 사오리도, 미사키도, 히요리도. 모두 나 때문에 이렇게 된 거니까."
34010-66 = "그러니까, 내가 마무리 지을게."
34010-68 = "고, 공주님……."
34010-69 = "……공주."
34010-70 = "안 돼……. 아츠코. 살해당해. 그녀에게 돌아가면 살해당할 거야……. 알고 있잖아……."
34010-72 = "……지금까진 나는 아무것도 결정하지도 판단하지도 않았어. 그러니까 이제 처음으로 내 의지대로 결정하고 싶어."
34010-76 = "약속해주겠어? 모두를 자유롭게 놓아주겠다고?"
34010-77 = "……."
34010-78 = "……. 잠시 기다려라. 마담에게 확인을 받겠다."
34010-82 = "(치익) 흐음."
34010-83 = "(치익) ……그렇군요. 알겠습니다. 약속하죠."
34010-84 = "이름을 걸어줘."
34010-85 = "(치익) 이름을? 거기에 무슨 의미가 있다고?"
34010-86 = "이름을 걸고 약속을 꼭 지켜달라는 뜻이야."
34010-87 = "(치익) ……. 모든 순례하는 자들의 환상인 나 <베아트리체>의 이름으로 약속하지요."
34010-88 = "……. 응. 됐어."
34010-93 = "가면을 쓰십시오, 공주님. 마담의 지시입니다. 함부로 가면을 벗으면 안 됩니다."
34010-98 = "(치익) 상처 하나 없이 데려오세요. 의식은 내일 해가 뜰 때 시작하겠습니다."
34010-100 = "……. 잘 지내. 사오리, 모두들. 안녕."
34010-101 = "공주……."
34010-102 = "공주님……."
34010-107 = "안 돼……. 아츠코……."
34010-108 = "나는…… 너마저도 지키지 못한다면……"
34010-109 = "내가 믿던 것도…… 내가 지켜야 하는 것도…… 모두 없어져 버리면……."
34010-110 = "나는……."
34010-113 = "아츠코, 나는……."
34010-114 = "나는 대체 무엇을 위해서 지금까지……."
34010-118 = "무얼 위해서…… 살아있는 거야……?"
34010-119 = "(치익) ……남은 스쿼드는 어떡합니까?"
34010-120 = "(치익) 모두 처리하세요."
34010-121 = "알겠습니다."
34010-126 = "쏴라."
34010-128 = "……."
34010-129 = "……."
34010-130 = "……."
34010-135 = "다음화;불편한 다과회"
