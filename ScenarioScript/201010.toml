201010-120 = "ถ้างั้นก็โล่งอกไปทีค่ะ..."
201010-121 = "ยังไงก็ตาม ถ้าคุณครูไม่มีตารางงานอื่น เช้าวันเสาร์นี้มาพบกันที่หน้าอาคารองค์การนักเรียนนะคะ"
