[translation]
201010-1 = "第1話;首席行政官的假日"
201010-4 = ""
201010-5 = "老師，好久不見。"
201010-6 = "不對……應該也不算好久不見吧。#n畢竟我昨天才為了確認要向聯邦學生會報告的內容而去了一趟夏萊。"
201010-7 = "[s1] 「好久不見，碧醬！」\n[s2] 「我一直正襟危坐地等候著碧大人的聯絡呢。」"
201010-10 = ""
201010-12 = ""
201010-13 = "……老師對待學生還真是毫無距離感呢。#n還是應該說完全不在意周遭的目光呢？"
201010-14 = "總之，今天聯絡你並不是為了聯邦學生會的事。"
201010-15 = "嚴格來說，這更接近於私人委託……"
201010-16 = "我就長話短說了──這個週末你有空嗎？"
201010-17 = "[s] 「這該不會是……約會的邀請吧？」"
201010-18 = "…………"
201010-19 = "…………"
201010-20 = "…………"
201010-21 = "……失禮了。#n看來我還是去找別人吧。"
201010-22 = "[s3] 「先，先等一下！」\n[s4] 「至少可以告訴我是什麼事吧？」"
201010-25 = "唉……下不為例，請你仔細聽。"
201010-26 = "是關於琳前輩……不對，是首席行政官的事。"
201010-27 = "他最近好像有點太勉強自己了。"
201010-28 = "自從聯邦學生會長失蹤之後，首席行政官就一直處於極度繁忙的狀態……#n儘管如此，最近他在精神方面似乎顯得更加疲憊了。"
201010-29 = "平常絕對不會犯的格式錯誤頻繁出現，皮膚也明顯變得粗糙……"
201010-30 = "就算撇開健康問題不談，為了聯邦學生會能順利運作，我也不能放任他不管。"
201010-31 = "[s] 「最近聯邦學生會的工作很多嗎？」"
201010-32 = "不，聯邦學生會的業務相比過去反而減少了。"
201010-33 = "以財務指標來看，已經恢復到聯邦學生會長還在位時的70%左右。"
201010-34 = "……只是，行政官似乎對此不夠滿意。"
201010-35 = "自從那場政變之後，他似乎認為「如果無法拿出足以媲美[ruby=超　　人]聯邦學生會長[/ruby]的成果，#n隨時都有可能再次面臨相同的危機」而遲遲不肯休息。"
201010-36 = "他已經連續好幾個星期，即便是假日也一直在辦公室處理工作。#n就算其他幹部勸他去休息也始終聽不進去。"
201010-37 = "所以我想拜託[USERNAME]老師。"
201010-38 = "就算動用夏萊的職權也好，這週末請帶前輩去個能放鬆休息的地方吧。"
201010-41 = "聯邦學生會首席行政官辦公室"
201010-42 = "[ns5] 「也就是說……」\n[ns6] 「該休息囉，琳醬！」"
201010-43 = "休息……是嗎？"
201010-44 = "誰是琳醬啊。"
201010-45 = "先不提這個，您是說……休息嗎？"
201010-46 = "如果是的話還請不必擔心。#n我每天都有維持6小時以上的睡眠，三餐也都有按時攝取。"
201010-47 = "為了避免影響業務，我在健康管理方面做了萬全的應對。#n所以請您不用擔心我的行程安排。"
201010-48 = ""
201010-50 = ""
201010-51 = "但是實際上，業務確實受到了影響哦。"
201010-52 = "以昨天首席行政官發送的事後安全管理報告為例──#n目錄編號的順序就出現了問題，本應排在前面的圓括號被排到了方括號後面。"
201010-53 = "這應該是平常的行政官絕對不會發生的失誤才對……你的身體狀況是不是變差了？"
201010-54 = "[s] 「……那是這麼嚴重的問題嗎？」"
201010-55 = "當然。目錄的格式一旦顛倒，範疇的定義也可能隨之改變。"
201010-56 = "無論形式為何，遵守格式都是撰寫公文的基本要求。"
201010-57 = "……非常抱歉。#n看來是我在發送文件之前沒有仔細確認。"
201010-58 = "為了不再發生這種事，下次我會更加縝密地審閱報告書。"
201010-59 = "不，行政官現在需要的是休息。"
201010-60 = "你已經將近一個月沒有休假，一直埋首於工作了。#n每天重複處理相同的業務，注意力會下降也是難免的。"
201010-61 = "我會幫你將這一季財務報告書的繳交期限延到下週，這個週末你就好好休息吧。"
201010-62 = "……剛才也說過了，我不需要休息。"
201010-63 = "多虧大家日以繼夜的努力，遭到破壞的基礎設施大部分都已修復完成。#n即便如此，仍然有許多市民對於聯邦學生會的行政能力抱持著懷疑的眼光。"
201010-64 = "在這種時期只要稍有鬆懈，企圖引發社會動亂的人就有可能趁虛而入。"
201010-65 = "[s] 「但是琳沒有必要一個人背負所有事情吧。」"
201010-66 = "……如果是聯邦學生會長，他一定會這麼做的。"
201010-67 = "我在身為首席行政官之前，是受聯邦學生會長委任其職權的代理人。#n在他缺席期間所發生的一切問題，都是我的責任。"
201010-68 = "然而我只是個不具備特殊才能的凡人。#n凡人想要[ruby=聯邦學生會長]追上天才的方[/ruby]法，就只有持之以恆、腳踏實地的努力。"
201010-69 = "前輩……"
201010-70 = "而且這個週末我已經有約了。#n我要在三一自治區和茶會的主要幹部們進行──"
201010-71 = "那，那件事請交給我吧！"
201010-72 = ""
201010-74 = ""
201010-75 = "步……？"
201010-76 = ""
201010-79 = ""
201010-80 = "正好這個週末，我因為調停室的業務需要去一趟三一自治區。"
201010-81 = "那個……這次會議的主要議題，#n是關於在三一自治區內被逮捕的格黑娜學生們該如何處置對吧？"
201010-82 = "這件事我已經從格黑娜風紀委員長那裡獲得了代理權限，#n所以前輩您就安心地享受假日吧！"
201010-83 = "這樣確實是不用親自跑一趟三一自治區沒錯……"
201010-84 = "不過除此之外，我還有其他必須處理的業務。#n像是通往鐘崎港的物流壅塞，導致民生物資的運送出現──"
201010-86 = "前輩指的是三天前的列車出軌事故造成的問題對吧？#n那件事我已經透過調整列車班表解決了，所以不用擔心。"
201010-87 = "聽說這週六有新口味的洋芋片要發售……#n可不能因為平日的工作沒處理完，導致假日必須得來加班呢。"
201010-88 = ""
201010-90 = ""
201010-91 = "……各位簡直像是約好了一樣，同時幫我分擔了工作呢。"
201010-92 = "既然各位如此替我著想，繼續堅持不肯休息多少有點過意不去……"
201010-93 = "我明白了。這個週末我就悠閒地度過假日吧。"
201010-94 = "可是……您上次也這麼說，結果還是在宿舍裡處理文書工作對吧？"
201010-95 = "我可不能眼睜睜看著你把難得的假日這樣浪費掉。"
201010-96 = ""
201010-97 = "[ns] 「所以這個週末就一起去約會吧，琳醬！」"
201010-98 = "誰是琳醬啊。還有什麼耶──"
201010-99 = ""
201010-101 = ""
201010-102 = "……失禮了。想同時指出兩個問題，結果舌頭打結了。"
201010-103 = "真是的，為什麼[USERNAME]老師可以面不改色地說出那種令人害臊的話呢？"
201010-104 = "您該不會對其他學生也都是這麼說的吧？"
201010-105 = "[s7] 「雖然對待每個學生的方式略有不同……」\n[s8] 「但我覺得琳最好稍微放鬆一下。」"
201010-108 = ""
201010-110 = ""
201010-111 = "……唉。"
201010-112 = "我明白了。那麼這次的假日，我就和老師一起度過吧。"
201010-113 = "反正我原本就想確認一下，老師在假日是怎麼度過閒暇時光的。"
201010-114 = "[s] 「我的閒暇時光……？」"
201010-115 = "根據我聽到的傳聞，有學生在假日看到老師翻找自動販賣機底下……#n還有躺在馬路正中央曬太陽的模樣……"
201010-116 = "不知道您有沒有什麼頭緒呢？"
201010-117 = "[s9] 「這，這個嘛……」\n[s10] 「應該只是被誇大的傳聞吧……」"
201010-120 = "如果真的是那樣就好了……"
201010-121 = "總之，如果老師您也沒有其他的行程，這週六早上就在聯邦學生會大樓前會合吧。"
201010-122 = ""
201010-124 = ""
201010-125 = ""
201010-126 = "還有，最後再補充一點。"
201010-127 = "……這不是約會。"
201010-129 = "下一話;首席行政官的假日（２）"
