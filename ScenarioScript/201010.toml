201010-115 = "มีข่าวลือว่านักเรียนบางคนเห็นคุณครูไปคุ้ยหาของอยู่ใต้ตู้ขายของอัตโนมัติบ้าง ไม่ก็ไปนอนอาบแดดอยู่กลางถนนในวันหยุดบ้าง..."
201010-116 = "พอจะนึกอะไรออกบ้างมั้ยคะ"
