[translation]
201010-1 = "ตอนที่ 1;วันหยุดของหัวหน้าฝ่ายบริหาร"
201010-4 = ""
201010-5 = "ไม่ได้คุยกันนานเลยนะ คุณครู"
201010-6 = "ไม่สิ... จะเรียกว่านานก็ไม่ถูก เพราะเมื่อวานฉันเพิ่งไปตรวจสอบงานเบ็ดเตล็ดต่างๆ ที่ต้องรายงาน#nองค์การนักเรียนที่ชาเล่ต์มาเอง"
201010-7 = "[s1] \"ไม่เจอกันนานเลยนะ อาโออิจัง!\"\n[s2] \"ครูใจจดใจจ่อรอให้อาโออิติดต่อมาตลอดเลยนะ\""
201010-10 = ""
201010-12 = ""
201010-13 = "คุณครูนี่สนิทกับนักเรียนจนไม่ถือเนื้อถือตัวเลยนะ หรือจะพูดว่าไม่สนใจสายตาคนรอบข้างเลยดีล่ะ"
201010-14 = "แต่ก็เอาเถอะ เหตุผลที่ฉันติดต่อมาวันนี้ไม่ใช่เรื่องงานขององค์การนักเรียนหรอก"
201010-15 = "พูดตามตรง... มันค่อนข้างเป็นคำขอร้องส่วนตัวน่ะ..."
201010-16 = "ขอเข้าเรื่องเลยก็แล้วกัน สุดสัปดาห์นี้คุณครูพอจะมีเวลาบ้างหรือเปล่า?"
201010-17 = "[s] \"หรือว่า... จะชวนครูไปเดตเหรอ?\""
201010-18 = "......"
201010-19 = "........."
201010-20 = "............."
201010-21 = "ขอโทษนะ... พอมาคิดอีกทีแล้ว ฉันน่าจะลองหาคนอื่นดูดีกว่า"
201010-22 = "[s3] \"ดะ... เดี๋ยวสิ รอเดี๋ยวก่อน!\"\n[s4] \"พอจะบอกได้มั้ยว่าเป็นเรื่องอะไร?\""
201010-25 = "เฮ้อ... แค่ครั้งนี้เท่านั้นนะ ตั้งใจฟังด้วยล่ะ"
201010-26 = "รุ่นพี่ริน... ไม่สิ หัวหน้าฝ่ายบริหารน่ะ"
201010-27 = "ช่วงนี้เธอดูเหมือนฝืนตัวเองอยู่นิดหน่อยน่ะ"
201010-28 = "แน่นอนว่าตั้งแต่ประธานหายไป หัวหน้าฝ่ายบริหารก็ต้องรับงานหนักมาตลอด#nแต่ระยะนี้ดูเหมือนจะเหนื่อยล้าทางจิตใจมากขึ้นกว่าเดิมน่ะ"
201010-29 = "จากที่ไม่เคยทำรายงานผิดพลาดก็เริ่มมีข้อผิดพลาดให้เห็นบ่อยขึ้น#nผิวและดวงตาก็ดูคล้ำขึ้นอย่างเห็นได้ชัด"
201010-30 = "ต่อให้ไม่นับว่าเป็นห่วงเรื่องปัญหาสุขภาพ แต่ถ้าเพื่อให้งานขององค์การนักเรียนดำเนินไปได้อย่าง#nราบรื่นแล้ว ก็คงปล่อยเธอไว้แบบนั้นไม่ได้"
201010-31 = "[s] \"ช่วงนี้งานขององค์การนักเรียนยุ่งมากเลยเหรอ?\""
201010-32 = "ไม่หรอก งานลดลงกว่าเมื่อก่อนเยอะด้วยซ้ำ"
201010-33 = "ถ้าในแง่ของตัวชี้วัดทางการเงินก็ฟื้นกลับมาอยู่ที่ 70% ของช่วงที่ประธานองค์การนักเรียนยังอยู่แล้วละ"
201010-34 = "แต่ว่า... ดูเหมือนแค่นั้นจะยังทำให้เจ้าหน้าที่ฝ่ายบริหารพอใจไม่ได้น่ะ"
201010-35 = "ตั้งแต่เหตุปฏิวัติครั้งก่อน ดูเหมือนเจ้าตัวจะคิดว่าถ้าทำผลงานได้ไม่ทัดเทียมกับ <ยอดคน> อย่าง#nประธานองค์การนักเรียนละก็ วิกฤตก็อาจจะย้อนกลับมาอีกเมื่อไรก็ได้... เลยแทบไม่ยอมหยุดพักเลยน่ะสิ"
201010-36 = "หลายสัปดาห์มานี้ แม้แต่วันหยุดก็ยังมาทำงาน แถมคนอื่นบอกให้ไปพักผ่อนก็ไม่ฟังเลยด้วย"
201010-37 = "เพราะงั้นคงต้องขอให้คุณครู [USERNAME] ช่วยแล้วละ"
201010-38 = "ต่อให้ต้องใช้อำนาจของชาเล่ต์... สุดสัปดาห์นี้ช่วยพารุ่นพี่ไปพักผ่อนที่ไหนสักที่หน่อยเถอะ"
201010-41 = "สำนักงานรักษาการแทนประธานองค์การนักเรียน"
201010-42 = "[ns5] \"เพราะงั้นไปพักกันเถอะ...\"\n[ns6] \"ถึงเวลาไปพักผ่อนแล้วละ รินจัง!\""
201010-43 = "ไปพักผ่อน... เหรอคะ?"
201010-44 = "เรียกใครว่ารินจังคะ"
201010-45 = "ว่าแต่ว่าเมื่อกี้พูดว่าพักผ่อน... เหรอคะ"
201010-46 = "ถ้าหมายถึงการหลับพักผ่อนละก็ไม่เป็นไรหรอกค่ะ ฉันนอนหลับมากกว่า 6 ชั่วโมง#nและไม่ได้อดอาหารด้วย"
201010-47 = "ฉันดูแลสุขภาพอย่างดีเพื่อไม่ให้ส่งผลกระทบต่องาน เพราะงั้นไม่ต้องเป็นห่วงเรื่องกำหนดการทำงาน#nของฉันก็ได้ค่ะ"
201010-48 = ""
201010-50 = ""
201010-51 = "แต่ความจริงมันเริ่มส่งผลกระทบกับงานแล้วนะ"
201010-52 = "ดูอย่างรายงานการจัดการความปลอดภัยหลังเกิดเหตุที่หัวหน้าฝ่ายบริหารส่งมาเมื่อวานสิ ขนาดลำดับสารบัญยังจัดให้วงเล็บปิดข้างเดียวอยู่หลังวงเล็บคู่เลย"
201010-53 = "ปกติเรื่องแบบนี้ไม่มีทางทำพลาดแน่ๆ... ไม่ใช่เพราะมีปัญหาสุขภาพร่างกายหรอกเหรอ?"
201010-54 = "[s] \"เรื่องวงเล็บนี่มันเป็นปัญหาขนาดนั้นเลยเหรอ...?\""
201010-55 = "แน่นอนสิ ถ้ารูปแบบสารบัญสลับกัน คำจำกัดความของหมวดหมู่ก็อาจจะเปลี่ยนแปลงได้"
201010-56 = "ไม่ว่าจะรูปแบบไหน การทำตามแบบฟอร์มก็คือพื้นฐานของการจัดทำเอกสารทางการ"
201010-57 = "ต้องขออภัยด้วยนะคะ... ฉันไม่ได้ตรวจทานให้ละเอียดก่อนส่งเอกสารต่อเอง"
201010-58 = "เพื่อไม่ให้เกิดเรื่องแบบนี้อีก ครั้งหน้าฉันจะตรวจทานให้ละเอียดขึ้นค่ะ"
201010-59 = "ไม่หรอก สิ่งที่หัวหน้าฝ่ายบริหารต้องการตอนนี้คือการพักผ่อนน่ะ"
201010-60 = "รุ่นพี่หมกมุ่นทำงานมาโดยไม่มีวันหยุดมาเป็นเดือนแล้วนะ ทำงานเดิมซ้ำไปมาทุกวัน สมาธิจะลดลงก็ไม่แปลกหรอก"
201010-61 = "ฉันจะเลื่อนกำหนดส่งรายงานการเงินประจำไตรมาสไปเป็นสัปดาห์หน้าให้เอง#nเพราะงั้นสุดสัปดาห์นี้ก็พักผ่อนให้เต็มที่เถอะ"
201010-62 = "อย่างที่ฉันบอกไปก่อนหน้านี้... ฉันไม่ได้ต้องการจะพักผ่อนค่ะ"
201010-63 = "ด้วยความพยายามอย่างหนักทั้งวันทั้งคืนของทุกคน ทำให้โครงสร้างพื้นฐานที่เสียหายส่วนใหญ่ได้รับ#nการฟื้นฟูแล้ว แต่ถึงอย่างนั้น พลเมืองจำนวนมากก็ยังคงเคลือบแคลงใจกับศักยภาพการบริหารของ#nองค์การนักเรียนอยู่ค่ะ"
201010-64 = "ในสถานการณ์เช่นนี้ หากชะล่าใจไปแม้เพียงนิดเดียว พวกที่จ้องจะสร้างความวุ่นวายในสังคม#nอาจฉวยโอกาสใช้ช่องโหว่นั้นได้ค่ะ"
201010-65 = "[s] \"แต่รินไม่จำเป็นต้องแบกรับทุกอย่างไว้คนเดียวนะ\""
201010-66 = "ถ้าเป็นประธานองค์การนักเรียนก็คงจะทำอย่างนั้นค่ะ..."
201010-67 = "ก่อนที่จะเป็นหัวหน้าฝ่ายบริหาร ฉันคือผู้รักษาการที่ได้รับมอบอำนาจจากประธานองค์การนักเรียน ปัญหาทั้งหมดที่เกิดขึ้นระหว่างที่เธอไม่อยู่ เป็นความรับผิดชอบของฉันค่ะ"
201010-68 = "แต่ฉันก็เป็นแค่คนธรรมดาที่ไม่ได้มีพรสวรรค์พิเศษอะไร วิธีเดียวที่คนธรรมดาจะไล่ตามอัจฉริยะ อย่างประธานองค์การนักเรียนได้ทัน ก็คงมีแค่การพยายามอย่างสม่ำเสมอและความตั้งใจค่ะ"
201010-69 = "รุ่นพี่..."
201010-70 = "นอกจากนี้ สุดสัปดาห์นี้ฉันมีนัดประชุมกับกรรมการสภาน้ำชาของเขตปกครองตนเองทรีนิตี้..."
201010-71 = "ระ... เรื่องนั้นให้ฉันจัดการเองค่ะ!"
201010-72 = ""
201010-74 = ""
201010-75 = "อายูมุ...?"
201010-76 = ""
201010-79 = ""
201010-80 = "พอดีว่าสุดสัปดาห์นี้ ฉันมีกำหนดการจะไปเขตปกครองตนเองทรีนิตี้ด้วยเรื่องงานของฝ่ายกำกับดูแล#nอยู่แล้วน่ะค่ะ"
201010-81 = "เอ่อ... วาระสำคัญในการประชุมครั้งนี้ คือเรื่องการจัดการนักเรียนเกเฮนน่าที่ถูกจับกุมใน#nเขตปกครองตนเองทรีนิตี้ใช่มั้ยคะ?"
201010-82 = "ฉันได้รับมอบหมายเรื่องนี้จากประธานคณะกรรมการวินัยของเกเฮนน่าแล้ว เพราะงั้นรุ่นพี่วางใจและไปสนุกกับวันหยุดเถอะค่ะ!"
201010-83 = "ถึงจะไม่จำเป็นต้องไปที่เขตปกครองตนเองทรีนิตี้แล้ว..."
201010-84 = "แต่ฉันก็ยังมีงานอื่นที่ต้องจัดการอยู่ค่ะ โลจิสติกส์สายที่มุ่งไปยังคาเนะซากิมีปัญหาภาวะคอขวด จนการส่งมอบสินค้าอุปโภคบริโภคมีปัญหา..."
201010-86 = "เรื่องนั้นเป็นปัญหาจากอุบัติเหตุรถไฟตกรางเมื่อสามวันก่อนใช่มั้ย? เรื่องนั้นฉันปรับตารางเดินรถไฟแก้ไขเรียบร้อยแล้ว ไม่ต้องเป็นห่วงหรอกนะ"
201010-87 = "ได้ยินว่ามันฝรั่งทอดรสชาติใหม่จะวางขายวันเสาร์นี้... เพราะงั้นจะมาทำงานวันหยุดเพราะเคลียร์งาน#nระหว่างสัปดาห์ไม่เสร็จไม่ได้เด็ดขาด"
