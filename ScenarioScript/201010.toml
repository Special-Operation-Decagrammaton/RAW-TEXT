201010-112 = "เข้าใจแล้วค่ะ ถ้างั้นวันหยุดนี้ ฉันจะไปกับคุณครูค่ะ"
201010-113 = "ที่จริงฉันก็คิดจะตรวจสอบอยู่พอดีค่ะว่าคุณครูทำอะไรในวันหยุดบ้าง"
