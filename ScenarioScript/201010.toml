201010-90 = ""
201010-91 = "ทุกคนช่วยแบ่งงานกันไปเหมือนนัดกันไว้ก่อนแล้วเลยนะคะ"
201010-92 = "ในเมื่อทุกคนใส่ใจกันถึงขนาดนี้ ถ้าฉันไม่ยอมหยุดพักก็คงจะไม่สบายใจกัน..."
201010-93 = "เข้าใจแล้วค่ะ ฉันจะใช้เวลาพักผ่อนสบายๆ ในสุดสัปดาห์นี้ค่ะ"
201010-94 = "แต่ว่า... ครั้งก่อนก็พูดแบบนี้ แล้วหอบเอกสารกลับไปทำที่ห้องพักต่อไม่ใช่เหรอคะ?"
201010-95 = "อุตส่าห์เป็นวันหยุดทั้งที จะมาปล่อยให้เสียเปล่าแบบนั้นไม่ได้นะ"
