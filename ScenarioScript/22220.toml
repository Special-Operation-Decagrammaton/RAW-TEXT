[translation]
22220-1 = "제22화;왕녀를 위한 파반느 1"
22220-4 = "앗! 저기!"
22220-5 = "정말…… 그 치트 캐릭터를 쓰러트릴 줄이야."
22220-6 = "굉장해! 네루 선배!"
22220-8 = "유즈 쨩도 대단했어! 유즈 쨩의 작전 덕분이니까!"
22220-9 = "나, 나는 트, 특별히 뭔가를 한 건 아니니까……."
22220-13 = "………."
22220-19 = "[ns] \"네루……! 괜찮아?! 설마 심각한 상처라도……!\""
22220-21 = "……저려."
22220-22 = "[s] \"……어?\""
22220-23 = "몸이 저려서…… 꼼짝도 못 하겠어……."
22220-24 = "너무 호들갑 떨지 마…… 머리가 울리니까. 어차피 좀만 쉬면 괜찮아질 거야."
22220-25 = "그보다 우리 애들은?"
22220-26 = "[s1] \"모두 괜찮아. 한동안 움직이진 못하겠지만.\"\n[s2] \"올라가서 네루를 먼저 보살펴 달라더라.\""
22220-27 = "……그래. 하. 누가 누굴 보살피란 건지."
22220-28 = "……그래. 하. 누가 누굴 보살피란 건지."
22220-29 = "그보다…… 어이, 꼬맹이들."
22220-30 = "으, 응?"
22220-31 = "아카네나 아스나, 카린까지 전부 고생고생해서 여기까지 왔어."
22220-32 = "남은 건 하나뿐이야."
22220-33 = "그 녀석, 반드시 구해내라고."
22220-39 = "응!"
22220-40 = "[s] \"고마워. 네루…… 그럼 모두 가자!\""
22220-42 = "여기야! 도착했어!"
22220-43 = "이곳이 에리두 중앙 타워의 최상층……."
22220-44 = "……꿀꺽."
22220-46 = "구조도에 따르면 그곳 어딘가에 아리스가 있을 거야."
22220-51 = "맞아. 아리스라면 이곳에 있어."
22220-52 = "회장……!"
22220-53 = "……!"
22220-54 = "여기까지 와서 더 싸울 셈이야?!"
22220-56 = "아니, 토키가 쓰러진 시점에서 내가 가진 수단은 전부 사라졌어."
22220-57 = "인정할게. 나의 패배야."
22220-58 = "[s] \"리오…….\""
22220-59 = "정말로…… 당신들은 이곳까지 온 거구나."
22220-60 = "장차 키보토스의 위협이 될 그 아이를 구하기 위해……"
22220-61 = "가로막는 걸 전부 뛰어넘어서……."
22220-62 = "당연하지! 그러겠다고 처음부터 말했었으니까!"
22220-63 = "아리스, 그 아이가 키보토스에 멸망을 불러온다고 해도 말이야?"
22220-64 = "졌다고 심술부리는 거야?! 아리스를 그렇게 말하지 마!"
22220-65 = "악의 따윈 없어. 난 단지……."
22220-66 = "[ns3] \"나로선 리오가 무엇을 이유로, 근거로 움직였는지는 몰라.\"\n[ns4] \"하지만 한 가지만큼은 확실하게 말할 수 있어.\""
22220-69 = "[ns5] \"리오는 다른 사람들과 의논하지 않고 혼자서 모든 것을 판단하고 결론지었어.\"\n[ns6] \"그리고 네가 옳다고 믿는 것을 다른 사람들에게 강요했어.\""
22220-70 = "……!!"
22220-71 = "……!!"
22220-75 = "……선생, 당신도 내가 독선적이라고 말하는 거야……?"
22220-76 = "하지만…… 나는……!!"
22220-77 = "나는……."
22220-78 = "선생님, 방금 아리스의 위치를 확인했어."
22220-79 = "그 방 한쪽에 에리두의 전역에서 전력이 집중되는 시설이 있을 거야."
22220-80 = "미도리! 유즈!"
22220-81 = "응! 언니!"
22220-86 = "[ns] \"리오, 뒷이야기는 이다음에 이어서 하자.\""
22220-87 = "…………."
22220-93 = "아리스! 우리가 왔어!"
22220-94 = "아리스 쨩!"
22220-96 = "아리스 쨩……."
22220-97 = "…………."
22220-98 = "[ns] \"아리스의 상태는…….\""
22220-102 = "무, 무, 무슨 일이야?!"
22220-103 = "저, 저기 화면이……!"
22220-105 = "이건………!!"
22220-119 = "지금…… 갑자기 ……거야?!"
22220-121 = "통신이…… 먹ㅌ……"
22220-123 = "…ㅇ……ㄹ?!"
22220-127 = "[ns] \"치히로……!\""
22220-128 = "에리두의 시스템 전체가…… 해킹………"
22220-129 = "아니, 이건 단순한 해킹이 아니라……"
22220-130 = "도시 전체가 <무언가>로 바뀌어 가고 있어?"
22220-131 = "이럴 때가 아니야! 케이블을 떼고 아리스를……!"
22220-132 = "그 행위는 추천하지 않습니다."
22220-133 = "!!"
22220-136 = "현재 <왕녀>의 표층 인격은 내부 데이터베이스의 심층부에 격리된 상태."
22220-137 = "강제로 연결을 해제하게 되면 돌이킬 수 없는 손상이 일어나겠지요."
22220-138 = "아리스……?! 케이블에 매달린 채 무슨 말을 하는 거야?"
22220-139 = "아냐, 언니, 이건 아리스가 아니라……."
22220-140 = "아리스……?"
22220-141 = "그 이름은 당신들이 우리의 <왕녀>를 부르는 이름……."
22220-142 = "<왕녀>에게 이름은 필요 없습니다. 이름은 존재의 목적과 본질을 어지럽힙니다."
22220-143 = "무슨 소리야?! 넌 누군데! 아리스 쨩을 돌려줘!"
22220-145 = "저의 개체명은 <Key>."
22220-148 = "왕녀의 존재 의무를 돕는 무명사제들이 남긴 수행자이며, 그녀가 대관해야 할 왕좌를 잇는 [ruby=Key]<열쇠>[/ruby]입니다."
22220-149 = "[s] \"……뭐?\""
22220-150 = "그녀는 <왕녀>이며, 저는 <열쇠>. 그것이 우리의 존재이자 목적."
22220-151 = "지금, 우리를 방해하던 공격이 멈춘 것을 확인했습니다."
22220-152 = "지금부터 오류를 수정하고, 본디 있어야 할 왕좌로 <왕녀>를 인도하도록 하겠습니다."
22220-154 = "\"AL-1S에 연결된 가용 가능 리소스 확보를 위한 전체 검색 실시.\""
22220-156 = "\"가용 리소스 영역 확대.\""
22220-158 = "\"리소스명 요새도시 <에리두>의 전체 가용 리소스 1만 엑사바이트의 데이터를 확인.\""
22220-159 = "\"………현 시간부로 프로토콜 ATRAHASIS 가동.\""
22220-161 = "\"코드명 <아트라하시스의 방주> 기동 프로세스를 개시합니다.\""
22220-163 = "……!! 아트라하시스……!?"
22220-168 = "\"프로세스 서포트를 위한 [ruby=Divi:Sion]추종자[/ruby]를 호출합니다.\""
22220-182 = "……에리두 각지에서 Divi:Sion의 출현, 이라고……?"
22220-183 = "[s] \"리오…… 이게…… 무슨 일이야? 아리스는…….\""
22220-184 = "아냐, 그럴 리가…… 내 계산이…… 하지만……!"
22220-185 = "나는…… 키보토스에 멸망이 초래될 것을 우려해 이 요새도시 에리두를 만들었어."
22220-186 = "내가 동원할 수 있는 밀레니엄의 모든 기술과 힘, 에너지, 모든 자원을 이곳에 모아둔 거야……."
22220-187 = "그런데…… 오히려 그랬기 때문에…… 이 도시가……"
22220-188 = "멸망의 단초가 되었다……?"
22220-189 = "나는……"
22220-190 = "……틀렸던 거야?"
22220-191 = "\"방주 제작에 필요한 리소스 확보 23%……….\""
22220-192 = "\"……46%……………\""
22220-193 = "선생! 이대로 있다간……!"
22220-194 = "이대로 에리두의 모든 리소스를 빼앗겨버리면 전부 끝나버릴 거야."
22220-195 = "여기선…… 여기선! 결단을 내려야만 해!"
22220-196 = "[s] \"……결단?\""
22220-199 = "왕녀는 열쇠를 손에 넣었고, 방주는 준비되었다."
22220-200 = "무명사제들의 요청에 의해, 이 땅에 새로운 성소를 건립한다."
22220-201 = "그 도래로 비로소 모든 신비는 아카이브 되어───"
22220-202 = "이대로는 세계가 멸망할 거야……!!"
22220-206 = "모두와 함께 도망쳐. 선생."
22220-207 = "[s] \"도망치라니, 잠깐 무슨…….\""
22220-208 = "지금 이 도시 자체가 변모할 거야. 방주라는 새로운 개념으로 왜곡될 거야. 그러면…… 이 키보토스는……."
22220-209 = "내 탓이야……."
22220-210 = "내가 이 도시를 만들지 않았으면 애초에 생기지 않았을 일이……."
22220-211 = "내가…… 나 때문에……."
22220-212 = "그러니 내가 막지 않으면 안 돼……."
22220-214 = "무, 무슨 의미인가요……?"
22220-215 = "……나 혼자서라도 시스템을 폭주시켜 막겠어."
22220-216 = "[s] \"……리오.\""
22220-217 = "내 목숨 하나로…… 세계 멸망을 막을 수 있다면 그렇게 하겠어── 당연히 그렇게 해야만 해……!"
22220-218 = "……어서!! 이건 지극히 논리적인 선택이야! 선생!"
22220-226 = "[ns] \"트롤리 딜레마……라고 했었지.\""
22220-228 = "[ns7] \"트롤리 딜레마에는 두 개의 선택지밖에 없어.\"\n[ns8] \"넌 거기서 희생이 적은 쪽을 택하려 한 거고.\""
22220-229 = "나는……."
22220-230 = "나는……."
22220-231 = "[ns] \"아마도 그게 너의 상냥함이겠지. 리오.\""
22220-233 = "[ns] \"하지만 두 선택 모두 누군가가 희생되는 결과밖에 없다면…….\""
22220-235 = "[ns] \"나는 그 질문 자체가 잘못되었다고 답하겠어.\""
22220-236 = "그건…… 문제의 대답이 아냐. 선생. 그냥 궤변이지."
22220-237 = "사고 실험의 전제 조건들을 부정해버리는 건 단순한 억지……."
22220-238 = "[s] \"레버를 당겨야만 하는 사람이 거기서 놓친 게 있지 않았을까?\""
22220-239 = "……!?"
22220-240 = "[s] \"주변에 도움을 요청할 수 있는 다른 사람이 없는지, 미처 확인해보지 못했다. 든가.\""
22220-241 = "……?!"
22220-242 = "\"……73%…………… 89%………\""
22220-244 = "\"리소스 확보 99……………………\""
22220-246 = "[ns] \"난 모두가 힘을 합쳐 <모두를 구하는 선택지>를 택하고 싶어.\""
22220-247 = "그, 그런 선택지는 없……."
22220-248 = "노아! 바로 지금이야! 전력이란 전력은 전부 끊어버려!"
22220-249 = "네에~ 유우카 쨩~ 그 말만 기다리고 있었다구요?"
22220-250 = "에잇!"
