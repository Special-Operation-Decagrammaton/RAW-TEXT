[translation]
84311100100-6 = "세이아……?"
84311100100-7 = "……??? 뭐야, 왜 온 거야? 아직 하루밖에 안 지났잖아?"
84311100100-9 = "배려해주신 건 감사하지만, 아무래도 역시 조금은 몸이 쑤셔서 말이에요."
84311100100-10 = "오랜만의 외출이라 그런 건지…… 솔직히 힘이 넘쳐서 계속 신경이 쓰이네요."
84311100100-11 = "말씀 주신 대로 낮에는 충분히 엑스포를 즐기고 있으니…… 저녁에라도 일이 있으면, 혹시 말씀해 주시겠어요?"
84311100100-13 = "완전 재미 들렸네. 노는 거 아니라고, 이거……"
84311100100-14 = "체력적으로 무리하는 게 아닐까 우려되는데. 늦은 시간에는 잘 자야 성장할 수 있다."
84311100100-15 = "늦은 시간의 활동량이 너무 많으면 체중이나…… 키가 안 클 수도 있어."
84311100100-16 = "……?"
84311100100-17 = "뭐? 지금 뭐라고 했냐."
84311100100-18 = "……? 뭐가?"
84311100100-19 = "지금 내가 늦게까지 돌아다니는 습관 때문에 키가 이렇게 작다고 말했지, 너?"
84311100100-20 = "??? 아니."
84311100100-21 = "갑자기 왜 그런 말을 하는 거지? 뭔가 신경 쓰이는 게 있나, 키에 대해서?"
84311100100-22 = "이 자식이 진짜! 역시 일부러 한 소리 맞잖아!! 어!! 맞지!? 그런 거지!?"
84311100100-23 = "아니. 이미 대답했지만 나는 의도한 적 없어."
84311100100-24 = "만약 그 말이 신경 쓰인다면 그건 순수하게 너의 자격지심인 것으로……"
84311100100-29 = "뭐어어어어어-!? 너 말 다했냐!?"
84311100100-30 = "아직 다 안 했어. 그리고 부연 설명을 붙이자면 신장과 관련된 부분은 습관도 중요하지만 유전적, 선천적인 부분 또한……"
84311100100-32 = "그만하라고!!!"
84311100100-33 = "대체 왜 화를 내는 거야. 다 했냐고 물어 본 건 너잖아……"
84311100100-37 = "(……역린인 모양이네요. 저 부분은 조심해야겠어요.)"
84311100100-39 = "사, 상황……! 상황은 발생한 부분이 없나요? 뭐라도 있으면, 지금 바로 출발하죠!"
84311100100-44 = "아, 상황이라면 있어. 마침 두 사람 모두가 필요할 만큼…… 다소 난이도가 있는 상황이지."
84311100100-45 = "시연장 내에, 새로운 시제품이 추가됐어. 폐장 이후 추가된 것이라 아직은 아무도 본 적이 없지만……"
84311100100-46 = "의도적일 정도로 수상한 느낌이 드는 물건이야. 가능하다면, 가져 와서 확인을 하고 싶어."
84311100100-47 = "뭔지도 모르지만 우선 확인을 하는 거야? 괜찮으면 다시 돌려놓고?"
84311100100-48 = "문제가 있을까?"
84311100100-49 = "딱히."
84311100100-50 = "잘 됐네, 이 녀석도 어차피 몸이 근질근질했던 것 같고."
84311100100-52 = "후후. 바라던 바네요."
84311100100-53 = "아무튼 다녀오겠어. 키에 대한 이야기는…… 나중에 다시 하도록 하자고."
84311100100-54 = "나중에 언제? 정확한 시간을 정해 주면 나도 일정을 비워 놓도록 할게."
84311100100-58 = "……하아"
84311100100-60 = "……그…… 음……"
84311100100-61 = "아닙니다. 두 분께서 알아서 하실 일이겠죠, 이런 건."
