[translation]
11140-2 = "제14화;출동! 수영복 복면단 2"
11140-3 = "은행"
11140-7 = "오래 기다리셨습니다. 아루, 씨입니까?"
11140-8 = "뭐가 오래 기다리셨어야! 6시간을 기다렸다고! 여기서!!"
11140-9 = "무슨 대출 심사가 반나절이나 걸리는 거야?! 딱히 앞에 다른 사람이 있는 것 같지도 않았는데!"
11140-10 = "기다리다가 내 동료들은 저기 쇼파에서 뻗어버렸다고!"
11140-11 = "내부의 사정입니다. 양해 부탁드립니다."
11140-12 = "……그런데 아루 씨가 지금 큰 소리칠 상황은 아니지 않습니까?"
11140-13 = "아, 으으……."
11140-14 = "저희 은행의 도움이 필요하시면서 기다리는 것 정도도 못하면 안되죠. #n……아, 그리고 저기서 잠자면 안됩니다."
11140-15 = "(따악) 가드. 저 부랑자…… 아니, 손님들을 깨우세요."
11140-17 = "자, 자! 일어나! 일어나!"
11140-18 = "음냐……"
11140-19 = "크핫?! 뭐야?!"
11140-20 = "(깜빡) ……!!"
11140-21 = "우왓…… 죄, 죄송합니다. 졸아서 죄송합니다!!"
11140-23 = "……."
11140-24 = "(팔락) 자, 어디 한번 보시죠. 고객 이름은 ……리쿠하치마 아루 씨. #n소속은 게헨나 학원 2학년."
11140-25 = "현재 흥신소 68 사장이라……. #n이거, 유령 회사 아닙니까? 서류상으로는 재정이 파탄인데요?"
11140-26 = "제, 제대로 벌고 있다고! 아직 의뢰비가 들어오지 않아서……."
11140-27 = "게다가 이 직원들, 4명 밖에 없는데 실장, 과장, 사원……. #n직책을 남발하고 있는 것 아닙니까? 회사 놀이라도 하는 건가요?"
11140-28 = "그, 그건……. 지, 직책이 있어야 의뢰를……."
11140-29 = "게다가 필요 이상으로 높은 사무소 임대료는 뭡니까? #n재정에 맞게 구입하셔야죠."
11140-30 = "버, 번듯한 사무실이 있어야…… 의뢰를……."
11140-31 = "……."
11140-32 = "아루 씨. 이대로라면 대출이 나오기 힘듭니다."
11140-33 = "뭐, 뭐?!"
11140-34 = "일단 좀 더 제대로 된 직업을 구하시는 게 낫지 않겠습니까? #n새벽의 인력 시장 같은 것도 있습니다만."
11140-35 = "뭐, 뭐라고?!"
11140-38 = "(부들부들)"
11140-39 = "(짜증나……. 차라리 다 때려부셔버리고 이 은행 털어버릴까?)"
11140-40 = "(……아니, 안되지. 여기는 털 수 있어도 블랙 마켓을 빠져나가는 게 힘들 거야. #n마켓 가드가 곳곳에 순찰돌고 있으니…….)"
11140-41 = "(……정말로? 사실은 이 녀석들 별거 아닐지도 모르잖아. #n우리 4명으로 충분히 다 쓰러트리고 도망칠 수 있을 거 같은데…….)"
11140-42 = "(……하아, 역시 무리야. 블랙 마켓을 적으로 돌릴 용기가 없어…….)"
11140-43 = "(제길. 이게 뭐야, 한심하게……. 키보토스 최고의 무법자가 되겠다는 다짐을 했는데 나는 고작…….)"
11140-44 = "(대출이니 사업이니…… 머리 아프고 귀찮은 일들만 잔뜩 있고…….)"
11140-45 = "(내가 원하는 건 사실 그런 게 아닌데……. #n그 어떤 것도 두려워하지 않고 어떤 것에도 얽매이지 않는 하드보일드 무법자…….)"
11140-47 = "(나는 그런 사람이 되고 싶었는데……)"
11140-48 = "……루 씨. 아루 씨!!"
11140-49 = "와, 와앗?! 네, 넵?! ……뭐, 뭐라고 했습니까?"
11140-50 = "대출 승인 거부라고 했습니다. 돌아가세요."
11140-51 = "뭐, 뭐?! 자, 잠깐만!"
11140-52 = "(팟-!)"
11140-53 = "뭐, 뭡니까? 정전?!"
11140-54 = "누가 불을 끈 겁니까? 컴퓨터 전원이 다 나가버렸어!"
11140-55 = "(투타타타타타타-! 투타타타타타타-!)"
11140-56 = "총소리?!"
11140-59 = "크, 크아아아아-!"
11140-60 = "으아아아아악-!"
11140-63 = "무, 무슨 일이…… 으아악!"
11140-65 = "(팟-!)"
11140-67 = "(두-둥-!)"
11140-70 = "모두 엎드려! 들고 있는 무기를 다 바닥에 내려 놔!!"
11140-71 = "말 안듣는 사람은 혼나는 거예요☆"
11140-72 = "아, 아하하…… 여러분 다치면 안되니…… 엎드려 주세요……."
11140-74 = "으, 은행 강도?!"
11140-75 = "(삐익- 삐이익-) 비상! 비상!"
11140-76 = "으헤~ 소용 없다고. 이미 외부로 통하는 경비 시스템은 전원을 끊어뒀으니까."
11140-77 = "히, 히익!"
11140-78 = "어이, 거기!! 엎드리라고! 허튼짓하면 죽인다?"
11140-79 = "여러분 제발 가만히 계셔주세요…… 아우우……."
11140-80 = "으헤~ 계획대로 되고 있어! 그러니 다음 스텝으로 가자고! #n리더 파우스트 씨, 지휘를!"
11140-81 = "네?! 네?! 저, 저요? 리더요? 제가요?!"
11140-82 = "두목이에요! 보스예요! 참고로 저는……"
11140-83 = "수영복 복면단의 크리스티나~다롱♧"
11140-84 = "뭐야, 그게! 언제 복면단이 된거야?! 그리고 센스 구려!!"
11140-85 = "……."
11140-86 = "으헤, 이 파우스트 씨는 엄청 무섭다고. 말 안들으면 혼난다고."
11140-87 = "아, 우아……. 두목이 되어버렸어요……. 이래서는 티파티의 임원 분들을 뵐 면목이……."
11140-89 = "어라…… 얘네들……."
11140-90 = "아……아비도스……?"
11140-91 = "맞네. 걔네들이야. 처음 보는 애도 있긴 하지만. #n……뭐하는 거지, 여기서? 저 복면은 또 뭐고?"
11140-92 = "저, 저희를 노리고 온 건가요?! 제가 다 없애버릴까요?"
11140-93 = "아니…… 우리 때문에 온 건 아닌 거 같은데……. 저 녀석들 무슨 속셈이지? 여기를 턴다고?"
11140-94 = "아루 쨩은 뭐하고 있는 거야?"
11140-96 = "CCTV의 사각, 경비원의 동선, 은행의 내부 구조 전부 다 머릿속에 있다. #n허튼짓은 용납하지 않는다."
11140-97 = "자, 거기 너. 이 가방에 넣어. 좀 전에 도착한 현금 수송 트럭의……."
11140-98 = "드, 드리겠습니다! 드리겠어요! #n현금이든, 채권이든, 금괴든 모두 다 꽉꽉 채워드리겠습니다!!"
11140-99 = "아, 아니…… 내가 원하는 건 운행 기록부인데……."
11140-102 = "(샥) 여, 여기 있습니다! 빵빵하게 채웠습니다! 살려주세요!"
11140-103 = "어 으, 으음……."
11140-106 = "……."
11140-107 = "(쩌, 쩐다아-! 이 녀석들은 대체 뭐지?! 블랙 마켓의 은행을 턴다고?)"
11140-108 = "(어떻게 도망치려고? 아니, 그 전에 이런 과감한 생각을 하는 무법자들이 아직 존재하고 있었던 거야?!)"
11140-109 = "(엄청 능숙하고 프로패셔널해. 마치 은행을 털기 위해 태어난 사람 같아. 5분 만에 다 털어버렸잖아!)"
11140-110 = "(머, 멋있어-! 짱이야! 이 사람들이야 말로 진정한 무법자……! 우와아- 눈물 날 거 같아.)"
11140-112 = "전혀 눈치채지 못하고 있는데……."
11140-113 = "심지어 눈을 반짝반짝 빛내고 있는데?"
11140-114 = "하아……."
11140-115 = "저, 저희는 여기서 가만히 있는 건가요?"
11140-116 = "……저 녀석들을 도울 이유도 없고 은행을 도울 이유도 없지. #n게다가 아루가 지금 저 상태니…… 일단 조용히 숨어 있자."
11140-117 = "네, 네에……."
11140-120 = "어이, 시로…… 아, 아니. 블루 선배! 물건은 확보했어?"
11140-121 = "어, 으, 으음. 확보했어."
11140-122 = "그럼 튀자고! 자, 모두 퇴각!"
11140-123 = "아디오스~☆"
11140-124 = "다, 다치신 분은 없는 것 같으니…… 죄송합니다……. 안녕히 계세요!"
11140-125 = "(휘이이잉---)"
11140-127 = "노, 놓치지 마라!! 도로를 봉쇄해! 마켓 가드에 연락해!!"
11140-129 = "반드시 잡아야 한다!!"
