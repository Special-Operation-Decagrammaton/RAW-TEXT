[translation]
1002106-1 = "해변의 사치"
1002106-2 = "어서 와, 선생님. 생각보다 빨리 왔네."
1002106-3 = "[s] \"……? 아무도 없네?\""
1002106-4 = "응. 혼자야. 아무도 없어."
1002106-5 = "조금 전까지는 그나마 주변에 관광객들이 있었지만…… 모두 돌아갔어."
1002106-6 = "응? 무슨 일로 불렀냐고? 딱히…… 아무 일도."
1002106-7 = "……응. 그러네."
1002106-8 = "아무 일도 없다는 게 일이라면 일이겠네. 그것 때문에 부른 거니까."
1002106-9 = "[s1] \"아무 일도 없는 일?\"\n[s2] \"그게 무슨 이야기야?\""
1002106-10 = "말 그대로의 이야기지."
1002106-11 = "말 그대로의 이야기지."
1002106-12 = "계속 이렇게 넓은 곳에…… 아무 대비도 없이 앉아 있잖아."
1002106-13 = "그저 아무 일도 일어나지 않는 상황."
1002106-14 = "그냥 그걸 느끼고 있었어."
1002106-15 = "[s3] \"편안함을 즐기고 있다는 거야?\"\n[s4] \"사치스럽다고 느끼고 있는 거야?\""
1002106-16 = "음…… 맞아."
1002106-17 = "음…… 맞아."
1002106-18 = "역시 선생님이야. 그걸 어떻게 설명해야 할지 잘 모르고 있었어."
1002106-19 = "지원이 필요하다고 생각한 거라면 그 부분이었을지도 모르지."
1002106-20 = "선생님은 뭐든지 명확하게 설명해줄 수 있으니까. 바로 지금처럼."
1002106-21 = "……그렇지. 어떻게 보면 사치스러운 거지."
1002106-22 = "……"
1002106-23 = "여기 오길 잘했어. 짧은 시간이었지만, 꽤 많은 걸 배웠어."
1002106-24 = "항상 좋은 일이 일어나네. 선생님이랑 있으면."
1002106-25 = "마치……"
1002106-26 = "……아니."
1002106-27 = "역시 아무 것도 아니야."
1002106-28 = "괜히 불러내서 미안해. 선생님의 시간을 낭비하게 한 것 같아."
1002106-29 = "그냥 이 상황에 대해서 이야기해주고 싶었던 것뿐."
1002106-30 = "[s] \"아즈사가 즐기고 있다면 그걸로 충분해.\""
1002106-31 = "……응."
1002106-32 = "……충분히."
1002106-35 = "충분히, 즐기고 있어."
