[translation]
22070-1 = "제7화;이상한 기계 2"
22070-13 = "콜록콜록………"
22070-14 = "무, 무슨 일이 벌어진 거야?!"
22070-15 = "갑자기 잠들어 있던 로봇들이 작동하고……"
22070-17 = "뒤이어 이어진 폭발…… 저건, 명백한 공격입니다!"
22070-18 = "방금 그 공격의 주체는 분명……."
22070-29 = "\"……유기체의 생존 반응 확인.\""
22070-30 = "\"케이스 해결의 실패를 확인하였습니다.\""
22070-31 = "[s] \"아리스……!\""
22070-32 = "아, 아리스 쨩?!"
22070-33 = "\"……프로토콜의 재실행에 들어갑니다. 보유 무장의 재장전 시퀀스 개시.\""
22070-39 = "또다시…… 레일건, 충전을 시작했습니다!"
22070-43 = "[ns] \"또…… 발사되기 전에 막아야 해!\""
22070-45 = "[ns] \"모두 부탁해! 아리스를……!\""
22070-47 = "이야아압!! 미안! 아리스 쨩!"
22070-59 = "\"방해 요소를 확인, 충전 실패.\""
22070-60 = "좋았어! 막았다!"
22070-61 = "\"……방해 요소를 우선 배제합니다.\""
22070-62 = "……엉?"
22070-70 = "마키! 위험해!"
22070-76 = "……!!"
22070-82 = "마키!!"
22070-87 = "\"프로토콜을 재실행합니다. 보유 무장의 재장전 시퀀스 개시.\""
22070-93 = "아, 아아……."
22070-94 = "대, 대체…… 아리스 쨩! 아리스 쨩!"
22070-96 = "[ns] \"크윽! 아리스……!\""
22070-103 = "[ns] (아리스를 막으려면……. 어떻게 해야……!)"
22070-104 = "\"발ㅍ───\""
22070-106 = "어이, 꼬맹이. 거기까지다."
22070-113 = "\"………!!\""
22070-119 = "거기서 잠자코 얌전히 자고 있으라고."
22070-126 = "……이 자식들, 여기에도……."
22070-127 = "하아. 됐어. 정리해버리면 그만이니까."
22070-128 = "어이, 간다."
22070-130 = "응! 부장!"
22070-132 = "지원하겠어."
22070-134 = "네, 뒤는 맡겨만 주세요."
22070-146 = "이걸로 끝!"
22070-147 = "작전 종료."
22070-148 = "수고하셨습니다."
22070-150 = "……해서 상황은 정리했다만, 선생."
22070-151 = "[s] \"네루랑 모두! 고마워!\""
22070-152 = "대체 무슨 일이 있었던 거야?"
22070-153 = "다른 녀석들은 찌그러진 캔처럼 굴러다니지. 거기다 동아리 건물은 완전히 박살이 나버렸고."
22070-154 = "아까 꼬맹이의 그 수상한 모습은 대체……."
22070-155 = "[s] \"잠깐! 답변은 나중에! 그보다 다들 괜찮아?!\""
22070-157 = "으읏…… 어, 어떻게든……"
22070-158 = "우에엑…… 내장이 튀어나오는 줄 알았어어어어어……."
22070-159 = "이런 말을 하는 거 보니, 일단 무사한 모양이에요."
22070-160 = "[s] \"그렇다면 다행…….\""
22070-166 = "선생님……! 선생님!"
22070-167 = "아, 아아, 모모이………"
22070-168 = "[s] \"미도리……? 유즈? 왜 그래……?\""
22070-169 = "언니가…… 언니가………!"
22070-171 = "……."
22070-173 = "다음화;무너진 일상"
