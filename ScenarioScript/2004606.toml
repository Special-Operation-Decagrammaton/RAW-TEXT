[translation]
2004606-1 = "소녀는 주사위를 던진다"
2004606-2 = "(음양부실로 향하는 길, 거리는 전보다 훨씬 깨끗해져 있었다)"
2004606-3 = "(단지 깨끗해진 정도가 아니라, 축제 전보다 화려하고 알록달록해 예쁜 인상을 준다.)"
2004606-7 = "[ns] \"이건…… 종이 공예?\""
2004606-8 = "어이~ 이쪽 설치 다 끝났어~ 이렇게 두면 되는 거지?"
2004606-10 = "네, 네! 근데 정말 괜찮나요?"
2004606-11 = "사람들이 다니는 거리에 저희 전시물을 둬도 된다니…… 괜히 걸리적거리거나 방해되는 건……."
2004606-12 = "아니, 아니, 괜찮다마다요! 안 그래도 망가진 거리를 어떻게 복구하나 막막했는데."
2004606-13 = "오늘부터 이 거리는 종이접기 거리로 재탄생할 겁니다! 입소문을 타서 유명해진다면 종이접기 축제도 열 수 있겠죠!"
2004606-14 = "종이접기 축제라니…… 헤헤, 이렇게 인정받는 건 처음이에요."
2004606-18 = "이야기 중에 미안한데, 우리 보수는……."
2004606-19 = "아, 물론 지급하지요. 저번 축제에 이어, 이번 거리 미화까지 한꺼번에 말이죠."
2004606-20 = "그나저나, 우리 애들이 실례가 많았습니다. 망량즈가 트집 잡으러 온 줄만 알았다고…… 설마 정식 동아리일 줄은."
2004606-21 = "얼마 전까지 망량즈였으니까 틀린 말은 아니긴 하지."
2004606-22 = "물론! 이제는 엑스트라 동아리지만 말이야! 상인회에서 저번 축제 때 활약을 증언해 준 덕이지!"
2004606-23 = "대금을 밀렸는데, 그깟 증언 정도야 얼마든지 하지요~"
2004606-24 = "다음 공연도 모쪼록 잘 부탁합니다~"
2004606-25 = "물론이지!"
2004606-27 = "(화기애애한 거리를 지나서…….)"
2004606-29 = "저, 정말 우리랑 부실을 바꿔도 괜찮아?"
2004606-30 = "이렇게 외진 데다가 귀신이 나온다는 소문까지 있는데……."
2004606-31 = "우는 아이도 그치는 우리 망량즈가 귀신 같은 걸 무서워할 리가 없잖아! 아, 이제는 망량즈가 아닌가? 아무튼!"
2004606-32 = "우리도 연습할 때마다 시끄럽다고 민원이 들어오는 곳보다, 떠들썩하게 지낼 수 있는 아지트가 좋아!"
2004606-34 = "(외진 종이접기 동아리의 부실을 지나서…….)"
2004606-36 = "그런 일들이 있었군요~"
2004606-37 = "잘된 일 아닌가요? 전부 원만하게 해결되었으니~"
2004606-38 = "[s] \"니야가 꾸민 일이지?\""
2004606-39 = "설마요~ 저번에도 말했지만, 제게 미래를 보는 능력이 있는 것도 아닌데요~"
2004606-40 = "무엇보다 선생님께서 옆에서 보셨듯이, 말 그대로 저는 아무것도 하지 않았답니다."
2004606-41 = "모든 일이 좋게 해결된 이유라면~ 그렇네요, 우연이겠죠."
2004606-42 = "우연히 적재적소에, 시의적절하게 요소들이 갖춰져서 만사가 저절로 해결되었을 뿐."
2004606-43 = "이런 게 바로 음양의 조화라 할까요, 냐하하~"
2004606-44 = "……음~ 뭔가 석연치 못한 표정이시네요?"
2004606-48 = "저번에 했던 질문인데요, 선생님은 백귀야행을 어떻게 생각하시나요?"
2004606-49 = "[s1] \"아름다운 곳이지.\"\n[s2] \"늘 평화롭지는 않지만.\""
2004606-52 = "그렇죠, 그렇죠~ 백귀야행은 멋스럽죠~"
2004606-53 = "사시사철 아름다운 자연과 함께, 즐거운 축제는 연일 계속되고, 학생은 자신들이 하고 싶은 일에 전념하는 그런 학원……."
2004606-54 = "이런 멋진 학원이 존재할 수 있는 건……."
2004606-55 = "역시 운이 좋기 때문이겠죠, 냐하핫~!"
2004606-56 = "이번 일처럼 절묘한 우연이 쌓이고 쌓여, 우리 학원은 유지되고 있답니다~"
2004606-57 = "……흐음~ 이것도 원하는 대답은 아니신가요?"
2004606-58 = "그러면 이렇게 할까요? 꼭 누군가에게 공로를 돌려야 한다면……."
2004606-59 = "보이지 않는 곳에서 묵묵히 자기 일을 다한 모두의 공로라는 걸로~♪"
2004606-60 = "[ns] \"…….\""
2004606-61 = "……이렇게 좋은 느낌으로 끝~ 은 안 되나요?"
2004606-62 = "냐하하…… 그~나저나~ 말이죠~?"
2004606-63 = "이번 소동도 전부 해결되었고, 다들 어찌저찌 행복해진 모양인데~"
2004606-64 = "오늘 설교는 어떻게~ 한 번 재고해 주심이~"
2004606-65 = "[ns] \"니야.\""
2004606-68 = "냐하……?"
2004606-69 = "[ns] \"오늘은 쓰다듬을 거니까.\""
2004606-70 = "냐핫?!"
2004606-78 = "(이후 엉망진창 쓰다듬어줬다.)"
