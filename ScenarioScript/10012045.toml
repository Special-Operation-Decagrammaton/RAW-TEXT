[translation]
10012045-5 = "……후우."
10012045-6 = "다녀왔어, 이번에도 많이……."
10012045-7 = "……모두들?"
10012045-8 = "[s1] \"……어서 와, 시로코.\"\n[s2] \"응. 좋은 타이밍이네.\""
10012045-9 = "……무슨 일이야?"
10012045-10 = "……무슨 일이야?"
10012045-12 = "……아, 오셨군요. 시로코 선배."
10012045-13 = "하하하……. 잘 다녀왔어요, 시로코 쨩……?"
10012045-14 = "마, 말 걸지 마……. 아직……. 체력……. 회복 중이니까……."
10012045-15 = "으으……. 죽을 것 같다……."
10012045-16 = "……음냐……. 음냐……."
10012045-21 = "…………?"
10012045-23 = "(이후 조금의 휴식 후, 시로코에게 그사이 일어났던 일들에 대해 설명해 주었다.)"
10012045-27 = "(……그리고 시로코의 표정을 보며, 더더욱 와카모와 대면시키면 안 되겠다는 의견이 힘을 얻었다.)"
10012045-32 = "하아, 하아……. 하아……."
10012045-33 = "으으, 이젠 진짜 한계야……. 더는 무리……."
10012045-34 = "……큭……. 전 병력으로 붙었는데도 지다니……."
10012045-35 = "……그게 무슨 소리죠?"
10012045-36 = "히, 히익……!?"
10012045-37 = "무, 무슨 소리냐니……!? 전 병력이었잖아"
10012045-38 = "……요!?"
10012045-39 = "이 정도 붙어 봤으면 알 수 있는 거잖아"
10012045-40 = "……요!?"
10012045-41 = "이 전력으로는 못 이긴다고……!"
10012045-43 = "아까부터 무슨 말씀이신지 모르겠군요. 겨우 이 정도로 '전 병력'이라니……."
10012045-44 = "아직 여러분께는……. 하나가 남아 있지 않나요?"
10012045-45 = "더 크고……."
10012045-49 = "확실한 걸로……?"
10012045-51 = "음……? 그게 무슨 말……."
10012045-52 = "크고 확실한 거……?"
10012045-53 = "……!! 설마!"
10012045-54 = "안 돼, 안 돼! 그건 안 돼!! 그건 우리가 여기까지 타고 온 거잖아!!"
10012045-55 = "대장! 대장도 뭐라고 말 좀 해봐요! 이대로라면 저 녀석이 우리 배까지……!"
10012045-57 = "그, 그것만은 안 돼! 우리한테 그 배는 집이라고!"
10012045-58 = "아무리 네 녀석이라도, 그 배에 손을 대는 것만큼은 용서할 수……!"
10012045-64 = "……!! 히이이익-!?"
10012045-65 = "대, 대장을……. 한 방에……!"
10012045-67 = "……후후."
10012045-68 = "후후후……. 여러분……. 뭔가 오해가 있으신 모양이군요."
10012045-69 = "저는 지금 여러분께 허락을 구하고 있는 게 아니었는데……."
10012045-70 = "그럼 이해력이 부족한 분들이신 것 같으니, 좀 더 단도직입적으로 말씀드리겠습니다."
10012045-71 = "지금 바로 가져오도록 하세요. 그리고 전투용으로 개조하세요."
10012045-72 = "당신들의……."
10012045-77 = "……그 '집'이라는 것을."
