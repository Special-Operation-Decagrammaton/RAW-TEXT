[translation]
51100-1 = "제10화;붉어진 뺨"
51100-6 = "[ns] \"유카리, 피곤하면 잠시 쉬었다 갈까?\""
51100-10 = "아……."
51100-11 = "네…… 제가 엄청 피곤해 보였다고요……?"
51100-12 = "아, 그게…… 저……."
51100-13 = "……단지, 오늘 있었던 일이 조금 신경 쓰여서……."
51100-14 = "……."
51100-15 = "………렌게 선배는, 백화요란 내에서도 누구보다 책임감이 강한 분이셨사와요."
51100-16 = "그랬던 렌게 선배가 백화요란은 더는 없다고, 끝났다고. 그런 말씀을 하시니까……."
51100-17 = "네…… 그래서 조금 당황했을 뿐이어요."
51100-21 = "………에잇!"
51100-26 = "[ns] \"자, 잠깐! 유카리! 갑자기 왜 자기 뺨을…….\""
51100-29 = "잡스러운 생각은 이것으로 끝!"
51100-30 = "네! 저 유카리, 백화요란의 엘리~트로서 겨우 이 정도로 풀이 죽는 사람이 아니어요!"
51100-31 = "흠흠……. 렌게 선배는 아직 혼란스러워서 그러셨던 게 분명한 것이어요!"
51100-32 = "지나간 과거를 생각하며 어물쩍거리기보다는 앞으로 다가올 내일을 생각해야 진정한 엘리~트라 할 수 있는 법!"
51100-33 = "비록 렌게 선배의 도움을 받겠다는 계획은 실패했지만……."
51100-34 = "그래도 아직 저희에겐 또 다른 백화요란의 간부 부원이 남아 있으니까요!"
51100-35 = "[s] \"키쿄…… 백화요란의 작전참모라고 했었지?\""
51100-36 = "네! 키쿄 선배라면 이번 <계승전>에 대해서도 필시 이해해주시고, 흔쾌히 도움을 주실 것이 분명하답니다!"
51100-37 = "그리고…… 키쿄 선배는 렌게 선배와 소꿉친구 사이이기도 하니까."
51100-38 = "분명 렌게 선배를 설득하는 데도 힘이 되어주실 것이어요!"
51100-39 = "음음! 네, 저 유카리가 생각한 것이지만…… 그야말로 퍼어~펙투한 계획!"
51100-40 = "그러니 [USERNAME] 선생님! 부디 계속해서 도와주시지 않겠나요?"
51100-41 = "[s] \"응. 원래부터 그러기로 한 약속이었으니까.\""
51100-42 = "……!"
51100-43 = "후후후! 네!"
51100-47 = "그럼 곧바로……!"
51100-54 = "아가씨. 모시러 왔습니다."
51100-60 = "아……."
51100-61 = "오늘 하루 종일 볼일이 있으신 듯하여 이제까지 기다리고 있었습니다만."
51100-62 = "시간이 늦었습니다. 집으로 돌아가셔야 할 시간입니다."
51100-63 = "하지만 저에겐 아직 해야 할 일이……."
51100-64 = "이 시간이 되도록 아직도 말씀이신가요?"
51100-65 = "혹시…… 그쪽에 있는 분과 관계된 일이신가요?"
51100-66 = "당신은 누구시죠? 아침부터 아가씨와 함께 계신 걸 보았는데."
51100-67 = "만약 음험한 의도를 가지고 접근하신 것이라면 저 카데노코지의 사용인으로서 가만히 있지 않겠어요!"
51100-68 = "[s] \"아, 전 샬레의 선생님입니다.\""
51100-69 = "샬레의 선생님이라면, 그 유명한……?"
51100-70 = "네! 맞아요! 그러니 오해는 금물이어요!"
51100-71 = "선생님께선 오히려 저의 고집에…… 제 의지 때문에 어울려 주셨을 뿐이니까!"
51100-75 = "……아가씨께서 그렇게 말씀하신다면 알겠습니다."
51100-76 = "감히 실례를 범해 죄송합니다."
51100-80 = "자, 그보다 아가씨. 벌써 해가 저물었습니다."
51100-81 = "하지만…… 소녀는 아직 해야 할 일이……."
51100-82 = "아가씨. 아직도 억지를 부리시는 건가요?"
51100-83 = "…………"
51100-84 = "[s1] \"오늘은 늦었으니까. 이만 돌아갈까?\"\n[s2] \"대신 내일 만나자. 손가락 걸고 약속이야.\""
51100-89 = "아가씨, 설마 아직도……"
51100-90 = "그렇군요! 이는 헤어짐이 아니라…… 후일을 도모하기 위한 약속!"
51100-91 = "네, 알겠사와요!"
51100-92 = "그럼 내일……!"
51100-93 = "………알겠습니다. 그럼."
51100-101 = "[ns] \"오늘 하루는 니야가 부르고…… 유카리와 만나고…….\""
51100-103 = "(그 후엔 정말 많은 일들이 있었다.)"
51100-112 = "그딴 거 알 게 뭐야! 애당초 우리들은 버림받은 거야."
51100-114 = "(렌게가 했던 말과……)"
51100-117 = "떠나기 전에 한 마디만 말씀드리겠습니다."
51100-118 = "아가씨께서는 카데노코지의 업무로 바쁘신 몸입니다."
51100-119 = "부디 내일은 별일 없이 빨리 돌아오실 수 있도록 협조해 주셨으면 감사하겠습니다. 그럼."
51100-124 = "(여러 가지로 뒤엉킨 일들로 상념에 잠겨 있을 때였다.)"
51100-128 = "[log=???]<────이쪽이야.>[/log]"
51100-133 = "[ns] \"…………?\""
51100-138 = "뭐야? 무슨 일이야? 하필이면 지금처럼 한창 바쁠 때."
51100-142 = "서쪽 지구에서 망량즈 녀석들이 어떤 사람이랑 시비가 붙었대!"
51100-144 = "또인가요?"
51100-145 = "왜 축제 때마다 난리를 피우는지! 차암! 또 누구랑 싸우고 있는 건가요?"
51100-146 = "그게…… 하오리를 걸치고 있는 게…… 백화요란의 학생이라는 모양이야!"
51100-150 = "[ns] \"……응?\""
51100-154 = "오늘 하루 종일 네놈을 찾아다녔다고!"
51100-156 = "낮에는 착각하고 딴 녀석과 붙어버렸지만, 이번에야말로 놓치지 않겠어!"
51100-161 = "[ns] \"………저건?\""
51100-164 = "다음화;백화요란의 부원"
