[translation]
80000107-1 = "과정, 퍼포먼스, 그리고 결과"
80000107-2 = "중요한 건 퍼포먼스다!!!"
80000107-3 = "[s] \"갑자기 무슨 말이야?!\""
80000107-4 = "이런 거야. 선생."
80000107-5 = "결과가 비슷하게 정해져 있다면, 그래서 실질적으로 결과에 큰 감흥을 느끼지 못할 것이 뻔하다면……."
80000107-6 = "그 결과에 도달하는 과정이야말로, 차별화를 둘 수 있는 포인트가 아닐까?"
80000107-7 = "[s] \"네. 여전히 맥락을 하나도 모르겠습니다.\""
80000107-8 = "후. 백 번 듣는 것보다 한번 보는 게 더 낫다고 하지……."
80000107-9 = "그러면 지금부터! 선생에게 퍼포먼스를 보여 주도록 하겠다!"
80000107-13 = "(그렇게 말하면서 메루가 꺼낸 것은…….)"
80000107-14 = "(왠지 달콤한 냄새가 나는 대량의 얇은 흰색 판이었다……!)"
80000107-15 = "[ns] \"이것은……?!\""
80000107-17 = "훗. 훗. 훗……."
80000107-18 = "이것은 말하자면 초콜릿으로 만든 도화지……."
80000107-19 = "화이트 초콜릿판이다!"
80000107-20 = "좋아, 좋아. 이걸로 종이는 준비되었고. 남은 것은 펜인데……."
80000107-21 = "여기에서, 이 다크 초콜릿 펜이 등장할 차례라는 말씀!"
80000107-22 = "[s] \"초콜릿 위에, 초콜릿으로 그림을 그리는 것인가!\""
80000107-23 = "그런 거야. 선생."
80000107-24 = "뭐, 오늘은 그런 날이니까. 설마 내가 모를 거라고 생각하고 있었던 건 아니지?"
80000107-25 = "……이쪽 영역에서는 닳고 닳을 정도로 우려먹는 날이니까, 모르고 싶어도 모를 수가 없단 말이지……."
80000107-26 = "[s] \"그건 확실히 그렇겠네…….\""
80000107-27 = "아무튼! 이제부터 초콜릿 드로잉 쇼를 시작할 테니까, 확실하게 봐 두라고!"
80000107-28 = "동인 작가 메루리의 친필 그림이라는 거……. 크흠. 아직은 그렇게까지 가치를 인정받지 못하고 있지만……."
80000107-29 = "언젠가는 분명, 이른바, '뜰 테니까!'"
80000107-35 = "(그렇게 말하며, 메루는 초콜릿 그림을 그려 내기 시작했다.)"
80000107-40 = "[ns1] \"오, 뭔가 느낌이 오는데?\"\n[ns2] \"순식간에 완성됐네…… 이거, 메루의 얼굴이지?\""
80000107-45 = "……."
80000107-46 = "이게 아니야!"
80000107-47 = "[s] \"왜, 왜 그래? 내가 보기엔 잘 그려진 것 같은데?"
80000107-48 = "아니, 아니야! 아직 부족해! 일단 여기 눈썹이 뭉개졌잖아!"
80000107-49 = "크윽……. 초콜릿 드로잉은 수정이 거의 불가능하다는 게 문제란 말이지."
80000107-50 = "하지만 나 히메키 메루, 이 정도로 포기하지 않는다!"
80000107-51 = "애초에 이런 일이 있을 줄 알고 초콜릿 도화지를 잔뜩 준비해 왔으니까!"
80000107-53 = "(그렇게 말하며, 메루는 다시 초콜릿 그림을 그려 내기 시작했다.)"
80000107-55 = "……."
80000107-56 = "선이 균일하지 않아!"
80000107-58 = "(그렇게 말하며, 메루는 다시 초콜릿 그림을 그려 내기 시작했다.)"
80000107-60 = "……."
80000107-61 = "드로잉이 비뚤어졌잖아!"
80000107-63 = "(그렇게 말하며, 메루는 다시…….)"
80000107-65 = "일필휘지가 되지 않았어!"
80000107-70 = "……."
80000107-71 = "[s3] \"저기, 메루……?\"\n[s4] \"초콜릿 도화지, 다 써버린 것 같은데……?\""
80000107-74 = "이럴 수가……. 이렇게 많은 자원을 소비하고도, 제대로 된 걸 하나도 그려내지 못했다니……."
80000107-75 = "이게…… 내 한계인가? 아무리 태블릿이나 종이와는, 그리는 감각이 완전히 달랐다고 해도……"
80000107-76 = "윽…… 으읏……."
80000107-80 = "(조용히 메루의 결과물들에게 다가가)"
80000107-81 = "(가장 잘 그려진 것을 집어 들었다.)"
80000107-87 = "……?! 뭐, 뭐 하는 거야. 선생! 그건…… 실패작이야! 내 최고가 아니라고!"
80000107-88 = "[s] \"내가 보기엔 충분히 최고인데?\""
80000107-89 = "서, 선생이 그렇게 말한다 해도…… 역시 안 돼! 이 정도의 완성도로는……!"
80000107-90 = "[s] \"중요한 건 과정이잖아? 퍼포먼스 말이야.\""
80000107-91 = "……!"
80000107-92 = "와…… 이건 좀 당했는데. 거기에서 그 말을 꺼낸다 이거지……?"
80000107-93 = "……."
80000107-94 = "에잇……!"
80000107-99 = "(갑자기 메루에게 초콜릿 그림을 빼앗기고 말았다!)"
80000107-100 = "[ns] \"왜, 왜 그래. 메루?!\""
80000107-102 = "왜냐니. 주는 건 적어도 내가 직접 줘야지!"
80000107-103 = "아무튼, 오늘은 그거잖아? 발렌타인이니까!"
80000107-104 = "뭐…… 초콜릿에 담긴 의미에는, 어차피 여러 가지가 있는 법이지만……."
80000107-105 = "아무튼 중요한 건! 내가 선생에게 초콜릿을 건네줘야 한다는 거라고!"
80000107-106 = "[s] \"듣고 보니 확실히 그렇구만!\""
80000107-107 = "그렇지?"
80000107-108 = "그러면……. 내 마음에는 안 들지만."
80000107-114 = "자, 받아. 초콜릿. 맛있게 먹으라구."
80000107-115 = "응? 그런데, 얼굴의 어디에서부터 먹어야 그나마 나에게 덜 실례일 것 같냐고?"
80000107-116 = "뭘 그런 걸 가지고 그래. 그거야……."
80000107-117 = "……그거야……."
80000107-118 = "……."
80000107-119 = "이거 좀 생각해 봐야 할 문제 같은데?!"
80000107-121 = "(그 뒤로, 메루의 얼굴 드로잉 초콜릿을 어디에서부터 먹어야 괜찮을지, 한참이나 토론을 나눴다…….)"
