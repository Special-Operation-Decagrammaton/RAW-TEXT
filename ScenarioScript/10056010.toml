[translation]
10056010-1 = "第1話;イワシアイス"
10056010-2 = "浮体式港湾・第3ターミナル東側の埠頭"
10056010-4 = "（第3ターミナルは活気に満ちていた）"
10056010-5 = "（釣りをする生徒、魚を運ぶ生徒、船を整備する生徒――）"
10056010-6 = "（みんな忙しそうだったが、ダイビング部らしき生徒は見当たらなかった）"
10056010-8 = "（その時、埠頭の端でしゃがみ込んでいる少女が目に入った）"
10056010-10 = "（白い水着の少女は海面を見ながら数を数えていた）"
10056010-11 = "101、102、103……。"
10056010-12 = "[s1] \"あの……。\"\n[s2] \"ちょっといいかな？\""
10056010-15 = "111、112、113……。"
10056010-16 = "[s3] \"白い水着の生徒さん……？\"\n[s4] \"何を数えてるの？\""
10056010-19 = "……「白い水着の生徒」じゃない。"
10056010-20 = "ちゃんと名前がある。"
10056010-25 = "コール・ミー、サユリ――"
10056010-29 = "[ns5] \"サユリ、だね。\"\n[ns6] \"よろしく。私はシャーレの先生だよ。\""
10056010-33 = "[ns] \"何を見てるの？\""
10056010-37 = "……海。"
10056010-41 = "気泡を見てる――ブクブク。"
10056010-42 = "[s] \"ブクブク。\""
10056010-43 = "海を見るの、楽しい。"
10056010-44 = "イワシもアカザエビもクジラも……みんな、水の中。"
10056010-45 = "水の上は鳥しかいない。"
10056010-49 = "水の中はもっと楽しいのに……。"
10056010-50 = "[s] \"サユリはクジラを見たことがあるの？\""
10056010-51 = "ある。少し沖に出るとたくさん会えるよ。港の近くは無理。"
10056010-52 = "クジラは好奇心旺盛だから、船と一緒に泳ぐのが好き。#n興奮すると大きくジャンプすることもあるの。"
10056010-53 = "船が近すぎるとひっくり返っちゃうかもしれないから、要注意。"
10056010-54 = "[s7] \"クジラのジャンプか……。\"\n[s8] \"いつか見てみたいな。\""
10056010-57 = "先生もクジラ、好き？"
10056010-58 = "そっか、嬉しい。#nでも、オデュッセイアの生徒はあんまり好きじゃないみたい……。"
10056010-59 = "[s] \"かっこいいし、可愛いところもあるし――\""
10056010-63 = "[ns9] \"――って、忘れてた。\"\n[ns10] \"1つ聞いてもいい？\""
10056010-67 = "何くれる？"
10056010-71 = "前にネネちゃんが言ってた。"
10056010-72 = "大人に何か頼まれる時は、対価をもらわないと痛い目に遭うって。"
10056010-73 = "[s11] \"……それもそうだね。\"\n[s12] \"それなら、おやつでどう？\""
10056010-76 = "……おやつ！"
10056010-77 = "じゃあ、「アクアシール」のアイスクリーム。"
10056010-78 = "サユリはイワシアイスが一番好き～"
10056010-79 = "[s13] （生臭そうだ……）\n[s14] \"いいよ。どこで買える？\""
10056010-82 = "一番近いお店は2番デッキにあるけど――"
10056010-83 = "プハーッ！"
10056010-88 = "見てた？見てたよね？私も素潜りできたよ！"
10056010-89 = "ね、ね、何秒だった？#n私の勝ちなら、約束どおり「アクアシール」でアイスを奢って――"
10056010-93 = "……誰？"
10056010-94 = "マキナ、早くおいで。"
10056010-95 = "シャーレの先生がアイス買ってくれるって。"
10056010-96 = "え、なんで？すっごく怪しいんだけど……。"
10056010-97 = "[s15] \"こんにちは。怪しくないよ。\"\n[s16] \"実は聞きたいことがあって――\""
10056010-100 = "それより！私、何秒潜ってた？#n180秒は越えてると思うんだけど。"
10056010-104 = "……あ。"
10056010-105 = "……え？"
10056010-106 = "先生と話してて忘れちゃった。"
10056010-107 = "こっちは必死で潜ってたんだよ！？"
10056010-108 = "今回はあんたのミスだから、私の勝ちね！"
10056010-109 = "あり得ない。マキナはウエイトがないと10メートルも潜れないへなちょこ。"
10056010-110 = "悔しいなら、やり直せば？"
10056010-111 = "なにぃ……！？"
10056010-112 = "[s17] \"二人とも、それくらいで。\"\n[s18] \"私のせいだから、アイスをご馳走するよ。\""
10056010-118 = "んー……なんか怪しそうだけど……。"
10056010-119 = "ま、いっか。この辺は知り尽くしてるし、先生弱そうだし。"
10056010-120 = "いいよ。「アクアシール」だよね？私も行く。"
10056010-121 = "[s] \"……マキナもイワシアイス？\""
10056010-122 = "そんなわけないじゃん！"
10056010-124 = "第3ターミナル、2番デッキ前の商店街"
10056010-125 = "（ベンチに座ってアイスを食べることにした）"
10056010-126 = "（サユリはイワシアイスで、マキナはダブルチョコアイスを選んでいた）"
10056010-127 = "（気になって、自分のもイワシアイスにしてみたが……#nイワシそのものが入っていて塩辛く生臭かった）"
10056010-132 = "やっぱりイワシアイスは至高。甘じょっぱくて、やみつき～"
10056010-136 = "それ以前に香りがアイスじゃないでしょ。"
10056010-137 = "やっぱ王道のチョコが一番。"
10056010-138 = "泳ぎ終わってから食べるおやつには、甘～いチョコアイスしかないよ。"
10056010-139 = "[s19] \"二人とも泳ぐのが上手なんだね。\"\n[s20] \"オデュッセイアの生徒はみんなそうなの？\""
10056010-142 = "いや？ここの生徒だからって、みんながみんなうまいわけじゃないさ。"
10056010-143 = "クルーズ運営部とか、水に入るのすら嫌がる生徒が結構いるらしいし。"
10056010-144 = "まあ、私とサユリは上手いほうじゃないかな。"
10056010-145 = "サユリのほうが、レベチでうまい。"
10056010-146 = "なぁっ！？勝負で白黒ハッキリさせてあげるよ！"
10056010-147 = "でもね、先生……他の人が相手なら、そもそも話にならない。"
10056010-148 = "だってサユリたちは普通の生徒じゃなくて、特殊――"
10056010-149 = "わーっ！わーっ！"
10056010-150 = "[s] \"特殊……？\""
10056010-151 = "な、何でもないよ！"
10056010-152 = "それより、話の続きだけど……何が聞きたいの？#n知ってることなら答えてあげる。アイスのお礼。"
10056010-153 = "[s] \"それじゃあ、改めて。\""
10056010-157 = "[ns] \"ダイビング部の生徒がどこにいるか知らない？\""
10056010-159 = "だ、ダイビング部？"
10056010-160 = "どうしてそんなこと聞くの……？"
10056010-161 = "[s21] \"さっき艦長に言われたんだ。\"\n[s22] \"ダイビング部の財源が気になるって。\""
10056010-167 = "[ns23] \"だから1度会って話をしたいんだよね。\"\n[ns24] \"周りとの交流は避けてるらしいけど……。\""
10056010-170 = "そ、そりゃそうさ。ダイビング部は秘密主義の生徒が多いから……。"
10056010-171 = "ステルスモード～"
10056010-175 = "私たちも……最後に見たのは先月だと思う。"
10056010-176 = "この近くにはいないんじゃない？#n他のターミナルに行ってみたら？"
10056010-177 = "[s] \"そっか……。\""
10056010-181 = "ダイビング部！"
10056010-185 = "やっと見つけた……！"
10056010-186 = "先週、第3エリアで網を破ったのはお前たちだよな？#n鋭い刃物で切った痕跡があったぞ。"
10056010-187 = "他人の作業場で勝手に潜っちゃダメだろ？"
10056010-188 = "あいつら、共用エリアに網を仕掛けてたのにブイを設置してなかったんだよ？"
10056010-189 = "気づけなくてフィンが絡まって大変だったんだから！"
10056010-190 = "他にも聞きたいことは山ほどある！"
10056010-191 = "お前たちの水中スクーターのせいで魚の群れが逃げるって苦情が来てんだ。"
10056010-192 = "きちんと説明しなきゃ、今度という今度はただじゃおかないから――"
10056010-197 = "[ns] \"……ダイビング部？\""
10056010-198 = "……あ。"
10056010-199 = "バレちゃった。"
10056010-200 = "くっそー、うまくいってたのに……。"
10056010-201 = "こういう時は[ruby=・]あ[/ruby][ruby=・]の[/ruby][ruby=・]作[/ruby][ruby=・]戦[/ruby]しかないか。"
10056010-202 = "サユリ、プランDだよ。覚えてる？"
10056010-203 = "がってん。"
10056010-207 = "ダッシュだ！"
10056010-211 = "[ns] \"ちょ、ちょっと待って！\""
