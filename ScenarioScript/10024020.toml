[translation]
10024020-1 = "2화;자금위시: 지금부터 시작하다."
10024020-6 = "육화각 거리"
10024020-7 = "[ns] \"여기가……?\""
10024020-9 = "응. 현룡문이 자리한, [ruby=六和閣]육화각[/ruby]이지."
10024020-10 = "오랜만이라면 오랜만인데, 그다지 변한 건 없어 보이네."
10024020-11 = "자, 그러면 슬슬 시끄러워져야 할 타이밍인데……"
10024020-17 = "누구냐! 걸음을 멈춰라!"
10024020-18 = "현무상회의 루미 회장님과 경호원 레이죠, 그리고 샬레의 선생님입니다."
10024020-19 = "선생님이 키사키를 만나고 싶다고 하셔서 모시고 왔어. 괜찮겠지?"
10024020-20 = "현무상회! 문주님께 예의를 갖춰라! 그, 그런데, 샬레의 선생님……?!"
10024020-21 = "비열한 녀석들! 선생님을 방패로 삼은 거냐?"
10024020-22 = "뭐, 그런 것으로 하지."
10024020-23 = "그래서, 어떻게 할 거야? 이대로 샬레의 선생님을 돌려보낼 건가?"
10024020-24 = "그렇게 된다면 '샬레의 선생님마저도 문전 박대한 산해경의 현룡문' 이라는 위업이 추가되겠군요."
10024020-25 = "현룡문의 비밀주의는 한층 더 유명해질 테지요. 대단합니다."
10024020-26 = "[s] \"그거 칭찬이야, 비꼬는 거야……?\""
10024020-27 = "저도 모르겠습니다."
10024020-28 = "말을 꺼낸 사람이 모르면 어떡하라고?!"
10024020-29 = "이럴 수가……! 레이죠의 말에 태클을 거는 것은 내 역할이었는데……!"
10024020-30 = "당신은 갑자기 또 왜 그래!?"
10024020-31 = "[s] \"아무튼…… 이야기만이라도 좀 전해 줄래?\""
10024020-32 = "크, 크흠. 기다려 주십시오. 문주님께 말씀을 올리겠습니다."
10024020-37 = "뭐, 결과적으로 이야기가 빨라졌네."
10024020-38 = "확실히 그렇군요. 역시 선생님이십니다."
10024020-39 = "[s] \"……이래도 되는 걸까, 산해경……\""
10024020-40 = "자, 자. 너무 사소한 것까지 신경 쓰면 장사 못 해 먹는다고."
10024020-49 = "괜찮으십니까, 선생님?"
10024020-50 = "[s1] \"뭔가 비밀스런 조직의 한가운데로 들어가고 있는 것 같은 느낌이……\"\n[s2] \"마피아 영화 같은 곳에 나오는 조직에 '초대' 받은 것 같아……\""
10024020-53 = "그렇게 틀린 감상은 아닐지도 모르지."
10024020-54 = "키사키 녀석…… 이런 면에서는 참 한결같단 말이야."
10024020-62 = "문주님 행차하십니다!"
10024020-63 = "문주님 행차하십니다!"
10024020-69 = "……"
10024020-70 = "이야기는 들었노라, 선생."
10024020-71 = "만나서 반갑다……고 해야 할 것 같군. 이런 식으로 첫 만남을 갖고 싶지는 않았지만."
10024020-72 = "[s] \"어…… 키사키 쨩, 이라고 불러도 돼?\""
10024020-73 = "무엄하다! 제아무리 샬레의 선생님이라고 해도!"
10024020-74 = "지켜야 할 예의가 있고, 상황에 따른 법도가 있을 터!"
10024020-75 = "그만. 먼 길을 온 산해경의 손님이다. 우리가 먼저 소란을 벌여서야 되겠느냐."
10024020-76 = "네, 넷! 자중하겠습니다. 문주님!"
10024020-77 = "용서하십시오! 저희가 분수를 몰랐습니다!"
10024020-78 = "내가 듣기로, 샬레의 선생은 성정이 자유분방하면서도 수완에 능해,"
10024020-79 = "앞을 가로막는 것들은 근원부터 모조리 분쇄해 버리는…… 희대의 권모술수가라고 들었는데 말이다."
10024020-83 = "[ns] \"어디서 그런 헛소문을 들은 거야?!\""
10024020-84 = "걱정 말거라. 선생. 내가 보아도 선생이 그런 부류처럼 보이지는 않으니."
10024020-85 = "오히려 너무 사람이 좋아서, 이용당하기 딱 좋은 성격처럼 보이기도 하는구나."
10024020-86 = "[s] \"놀리든 칭찬하든, 둘 중 하나만 해 주었으면 하는데……\""
10024020-87 = "또 혹시 모르지. 사람 속은 알 수 없는 법이니."
10024020-88 = "선생이 그 안에 무엇을 숨기고 있을지 내심 기대가 되기도 하는구나."
10024020-94 = "이쪽은 미나 집행부장이다. 현룡문의 선봉(先鋒)이자, 내 직속 경호원이지."
10024020-95 = "……"
10024020-97 = "……"
10024020-99 = "그러면 이야기를 되돌리지, 선생."
10024020-100 = "문제가 되는 것으로 들은 것은…… 산해경 외부에서 유통되는 만년삼의 존재다."
10024020-101 = "[s] \"응. 그거 말인데, 확실한 증거가 있어서 현무상회를 의심하는 거야?\""
10024020-102 = "그 물건을 가져오도록."
10024020-111 = "이건……?"
10024020-112 = "그대라면 몰라볼 수 없겠지. 그렇지 않은가?"
10024020-113 = "확실히…… 우리 현무상회가 발주한 식재료 상자로군. 확인했어."
10024020-114 = "회장님……!"
10024020-115 = "증거가 있느냐고 물었던가? 우리 현룡문은 이 상자를 증거로 제시하겠노라."
10024020-116 = "만년삼은 산해경에서도 희귀한 식물이라, 무단 채집이 금지되어 있지."
10024020-117 = "그런 특산물이 산해경 밖에서, 그것도 현룡문의 지시 없이 유통되고 있다는 것은 큰 문제이니라."
10024020-118 = "현룡문으로서는 이를 좌시할 수 없도다. 현무상회는 이 문제에 대해 응당 답을 내어야 할 것이야."
10024020-123 = "자랑은 아니지만, 현무상회의 조직들이라면 내가 파악하고 있어."
10024020-124 = "그중 어떤 유통 조직에서도 만년삼을 취급하고 있었다는 이야기는 들은 적이 없어."
10024020-125 = "약속드리겠습니다. 만일 현무상회 내부에서 불법적인 일이 이루어지고 있었다면,"
10024020-126 = "누구보다도 먼저, 제가 그들을 일망타진할 것입니다."
10024020-130 = "그게 해명의 전부라면, 조금 실망스럽도다."
10024020-131 = "현룡문은 증거를 보였다. 그렇다면 현무상회 측에서도 반례를 내놓는 게 순리이지 않겠는가?"
10024020-132 = "[s3] \"지금 당장 반례를 내놓으라고 해도……\"\n[s4] \"그 말도 맞기는 한데, 시간을 조금 줄 수 없을까?\""
10024020-141 = "더 볼 것도 없을 것입니다. 문주님!"
10024020-142 = "그렇습니다! 현무상회는 평상시에도 요리에 이상한 시도를 하는 것으로 유명합니다!"
10024020-143 = "분명 만년삼도 요리에 쓰기 위해 반출했을 겁니다!"
10024020-144 = "지켜져 온 것들에게는 그만한 가치가 남아있기 마련인 것을!"
10024020-145 = "전통과 보존의 가치도 모르는 녀석들이니, 그런 일을 저지르고도 남았겠지!"
10024020-146 = "어서 머리를 조아리고 사죄하지 못할까, 현무상회!"
10024020-151 = "하하하…… 그런 일이 없다고는 못 하겠는데 말이야."
10024020-152 = "하지만, 성공은 도전 없이 이루어지지 않는다고?"
10024020-153 = "한 가지 틀에 갇혀 있으면, 시도할 줄 모르는 겁쟁이가 되기 십상이고."
10024020-154 = "그만. 거기까지. 이 자리에서 필요 이상의 상호 비방을 금하노라."
10024020-155 = "이 자리는 현무상회의 혐의를 묻는 자리이자, 동시에 현무상회의 탄원을 듣는 자리이기도 한 것이니."
10024020-157 = "탄원이라고 하셨습니까? 너무 관대하십니다, 문주님!"
10024020-158 = "그렇습니다! 현무상회는 만년삼 반출범들입니다!"
10024020-160 = "모든 산해경의 학생들은 자신의 뜻을 이야기할 수 있노라. 그것이 산해경에 해가 되지 않는다는 조건하에서."
10024020-161 = "현무상회는 지금 명백히 산해경에 해를 끼치고 있습니다!"
10024020-162 = "그것과 이 자리에서 현무상회에게 과도한 비방을 행하는 것은 다른 이야기이겠지."
10024020-167 = "듣거라. 의혹이 있는 한 현무상회에 대한 감시를 풀 수는 없도다."
10024020-168 = "그렇다고 해서 지금 당장 여기에서 증거에 대한 반례를 내놓으라는 것도 이치에 맞지 않는 지시일 터."
10024020-170 = "하여, 현무상회에게 일정 기간의 유예를 주겠다."
10024020-171 = "그 기간 안에 현룡문을 납득시킬 만한 다른 증거를 찾아온다면, 현무상회에 대한 처분을 다시 검토하겠다."
10024020-173 = "허나 명심하거라. 상황이 악화된다면 현룡문으로서도……"
10024020-174 = "현무상회의 활동을 정지시키는 것을 고려할 수밖에 없도다."
10024020-175 = "이것이 현룡문의 문주인 류우게 키사키의 뜻이다."
10024020-177 = "기다려 주십시오, 문주! 이것은 분명 모함이며……!"
10024020-178 = "거기까지 해 둬, 레이죠. 이러니저러니 해도 저건 분명 우리들 현무상회의 상자야."
10024020-179 = "이렇게 된 이상…… 억울하지만, 우리가 직접 범인을 잡는 수밖에 없겠어."
10024020-181 = "그거면 만족하겠지, 키사키 문주?"
10024020-182 = "그리하지 않을 이유가 없지. 루미 상인회장."
10024020-187 = "[ns] \"뭔가 생각이라도 있어?\""
10024020-189 = "우선은 만년삼에 대한 정보가 필요하겠는데……"
10024020-195 = "거기 서라, 현무상회!"
10024020-196 = "……선생님, 제 뒤로!"
10024020-197 = "현룡문에 들어올 때는 마음대로였지만, 나갈 때는 그럴 수 없을 것이다!"
10024020-198 = "키사키 문주님은 애초에 너무 무르단 말이지……!"
10024020-199 = "가장 유력한 용의자들이 제 발로 걸어 들어왔는데 그냥 내보내다니."
10024020-200 = "응당 보다 명확한 증거가 나올 때까지 신병을 구속해야 할 터!"
10024020-201 = "그 말은, 우리를 까닭 없이 체포하겠다는 뜻인가?"
10024020-202 = "죄인들을 처단하는 데에 이유 같은 것은 불필요!"
10024020-204 = "모두, 나와라!"
10024020-212 = "선생님, 부디 조심하셔야 합니다!"
10024020-213 = "그러고 보니 선생님의 지휘를 받은 학생들은, 어떤 경우에서도 패배를 모른다고 하던데."
10024020-214 = "[s] \"……어쩌다 그런 번거로운 소문이 나 버렸을까……\""
10024020-215 = "하하하. 사람이 살다 보면 별별 소문에 다 휘말리는 법이더라."
10024020-216 = "그러면 지휘 잘 부탁해, 선생님. 우리에게도 그 능력, 한번 보여 달라고!"
