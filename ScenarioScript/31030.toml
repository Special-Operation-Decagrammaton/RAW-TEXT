[translation]
31030-1 = "제3화;티파티"
31030-2 = "헤에~ 선생님이란 건 이렇게 생겼구나. 별로 우리랑 다르지도 않은데?"
31030-3 = "어느 쪽이냐면, 나는 좋다고 생각해!! 나기 쨩은? 어때?"
31030-4 = "……미카 씨. 선생님 앞에서 그런 걸 묻는 건 예의가 아닌 것 같네요."
31030-5 = "사랑이 넘치는 건 좋지만 때와 장소라는 게 있으니까요."
31030-6 = "아아…… 그, 그런가?"
31030-7 = "미안해. 선생님. 너무 격식 없었을까나……. 그치만 잘 부탁해! 그런 느낌으로!"
31030-8 = "[s] \"잘 부탁해.\""
31030-9 = "……."
31030-10 = "……우훗."
31030-11 = "……. 티파티에 트리니티 외의 사람이 초대되어 온 건 제가 기억하기로 선생님이 처음입니다."
31030-12 = "보통은 일반 학생들도 쉽게 초대받지 못하는 자리이지만……."
31030-13 = "우와- 생색! 나기 쨩 생색!"
31030-14 = "……."
31030-15 = "생색내려는 의도는 아니었고…… 하아. 미카 씨."
31030-16 = "……응. 미안. 가만히 있을게."
31030-17 = "……."
31030-18 = "이렇게 선생님을 모신 건 사소한 부탁을 드리려고 한 것입니다만."
31030-19 = "[s] \"부탁?\""
31030-21 = "아아. 나기 쨩. 그치만, 다짜고짜 본론부터?!"
31030-22 = "좀 더, 뭐랄까. 아이스브레이킹 같은 건 없는 거야? 어색함을 깨려는 잡담 같은 거."
31030-23 = "오늘은 날씨가 좋다, 어제 뭘 먹었다. 그런 거. 그런 게 필요한 거 아냐?"
31030-24 = "티파티라는 건 기본적으로 사교 모임이니까."
31030-25 = "……."
31030-26 = "그렇게 예쁜 눈으로 노려봐도 이건 티파티의 에티튜드에 대한 얘기니까. 분명히 해야 해!"
31030-27 = "그런 건 미카 씨, 당신이 호스트일 때 추구하면 됩니다. 지금은 제가 호스트니 제 방식을 따라주셔야죠."
31030-28 = "……."
31030-29 = "……."
31030-30 = "뭐, 손님을 불러놓고 이렇게 논쟁하는 것도 별로 보여줄 만한 장면은 아니니……."
31030-31 = "……알겠어요. 미카 씨의 말대로 조금 말을 돌려볼까요."
31030-32 = "[s] \"너희들이 바로 트리니티의 학생회장들이지?\""
31030-33 = "우와, 분위기를 잘 읽어주는 선생님! 응, 잘 봐! 나기 쨩. 이게 바로 어른의 화술! 자연스럽게 대화를 유도하는 능숙함!"
31030-34 = "……네. 맞습니다. 저희가 바로 트리니티 종합학원의 학생회장들입니다."
31030-35 = "왜 학생회장들, 이냐고 물어보실 수 있겠지만…… 기본적으로 트리니티의 학생회장은 여러 명으로 존재해 왔습니다."
31030-36 = "어라…… 나기 쨩……? 무시?"
31030-37 = "과거 트리니티가 연합을 이루기 전, 각 분파 학원들의 대표들이 분쟁을 해결하기 위해 티파티를 열었던 것에서부터 이 역사가 시작되었는데……."
31030-38 = "진짜로? 너무해…… 나 조금 상처……."
31030-39 = "파테르, 필리우스, 상투스 세 학원의 대표가 나서서 티파티를 열어서 화해 무드를 만들었고 그 이후부터……"
31030-40 = "나기 쨩…… 이젠 막 무시하고…… 이거 완전 괴롭힘이잖아. 응? 너무하잖아. 십년 넘게 알고 지내온 소꿉친구를 이렇게 막……."
31030-41 = "……그 이후부터 트리니티의 학생회는 티파티라는 명칭으로 불리며 각 분파 대표들이 호스트를……."
31030-42 = "시끄러워요!"
31030-43 = "……."
31030-44 = "아까부터 자꾸! 어! 시끄럽잖아요!"
31030-46 = "미카 씨!"
31030-47 = "쨍알쨍알!"
31030-48 = "그 작은 입을 다물지 않으면"
31030-49 = "거기다 롤케이크를 쑤셔넣어버릴 거예요!"
31030-51 = "……."
31030-54 = "……."
31030-55 = "[s] \"…….\""
31030-56 = "……."
31030-57 = "……죄, 죄송합니다. 제가 무슨 망발을……."
31030-58 = "하…… 하아. 사과드립니다. 미카 씨…… 선생님……."
31030-59 = "무…… 무서웠어……."
31030-60 = "[s] (본론은 언제 얘기하게 되는 걸까…….)"
31030-63 = "……저희가 선생님께 요청드리고 싶은 것은, 간단한 일입니다."
31030-64 = "응. 그치만 중요한 일이기도 해."
31030-65 = "중요하기도 하죠."
31030-66 = "즉, 보충수업부를 맡아주실 수 있습니까?"
31030-67 = "[s] \"보충수업부?\""
31030-68 = "네. 결론부터 말씀드리자면, 낙제 위기에 처한 학생들을 구제하는 특별반을 운용해주시길 바라는 것입니다."
31030-69 = "저희 트리니티 학원은 예로부터 키보토스에서 문무를 겸비하고 있는 역사와 전통이 숨쉬는 학원."
31030-70 = "하지만 어쩐 일인지 이런 시국에 낙제생들이 무려 4명이나 생겨버려서……."
31030-71 = "응. 대외적으로는 우리는 지금 최악의 시기를 보내고 있달까."
31030-72 = "에덴조약 때문에 여러 가지로 어수선하거든."
31030-73 = "이런 상태에서 낙제생들의 처우를 빨리 해결해야 하는데, 인력도, 시간도 부족한 상황이고……."
31030-74 = "때마침 보인 게 바로 이거! 신문에 난 샬레의 활약상!"
31030-75 = "고양이 찾아주기, 동네 청소, 택배 배달 등등 편리한 심부름센터 샬레의 대활약!"
31030-76 = "그래, 이거라면! 귀찮은 일을 떠넘길 수 있겠다 싶어서!"
31030-77 = "[s] \"…….\""
31030-78 = "귀찮은 일을 떠넘긴다…… 는 아니죠. 미카 씨."
31030-79 = "어라, 그, 그런가……. 그치만 어떤 부분에 있어선 사실이기도 하고……."
31030-80 = "게다가, 선생님이잖아. 선생님."
31030-81 = "지금이야 다들 BD로 학습하는 시대이고, 교직원, 교무원, 강사, 교수 등은 있지만, <선생님> 이라는 개념은 흔치 않으니까."
31030-82 = "응. 선생. 이것은 삶을 앞서간 사람, 즉, 이끌어주는 사람이라는 뜻이잖아?"
31030-83 = "그런 의미에서 선생님은 존경과 삶의 기준이 되는 사람, 이라는 뜻이기도 하고. 보충수업부에 딱 맞는 느낌이잖아."
31030-84 = "들리는 소문에 의하면……. 존경이나 닮고 싶다, 라는 느낌은 아닙니다만……."
31030-85 = "아하하, 응. 그건 인정. 여기 저기서 들려오는 보고서에는……. 음, 이건 선생님의 명예를 위해 굳이 말하진 않을게."
31030-86 = "[s1] (대체 무슨 보고가 올라오는 거지……?!)\n[s2] (묻지 않는 게 좋을 것 같다…….)"
31030-87 = "하여튼! 나는 선생님이 얘네들을 맡아줬으면 좋겠어. 지금처럼 곤란한 시국에는 더욱!"
31030-88 = "하여튼! 나는 선생님이 얘네들을 맡아줬으면 좋겠어. 지금처럼 곤란한 시국에는 더욱!"
31030-89 = "보충수업부, 라는 평상시에는 없는 특별 동아리를 창설해서 구제가 필요한 학생들을 가입시킨다."
31030-90 = "특별 한정으로 만들어지는 것이기에 여기서 샬레의 초법적 권한을 빌려온다- 이런 형태입니다."
31030-91 = "본질은 어디까지나 낙제생들의 구제이기에 이런 편법을 사용하는 것을 허용한 것이지만……."
31030-92 = "어떻습니까? 선생님. 부디 도움이 필요한 학생들을 외면하지 않았으면 합니다만……."
31030-93 = "[s] \"내 도움이 필요한 아이들이 있다면 사양하지 않을게.\""
31030-94 = "……! 응, 해냈다! 땡큐! 선생님!"
31030-95 = "……."
31030-96 = "과연. 그렇군요. 거절하지 않으실 거라고는 예측하고 있었지만……."
31030-97 = "알겠습니다. 그럼, 이 서류를."
31030-98 = "[ns] 학생 명부를 받는다."
31030-100 = "이 학생들입니다."
31030-102 = "응. 말하자면, 트리니티의 골칫덩이들."
31030-103 = "그 표현은 사랑이 부족하니 이렇게 표현하죠. 트리니티의 사랑이 필요한 학생들."
31030-104 = "응. 뭐든."
31030-107 = "[ns] (이 아이는……!)"
31030-108 = "응? 아는 학생이라도 있는 거야, 선생님?"
31030-109 = "[s3] \"아니, 뭐…….\"\n[s4] (얼버무린다.)"
31030-110 = "자세한 사항은 서류를 통해 전달드리겠습니다. 다른 궁금한 점은 없으신가요?"
31030-111 = "자세한 사항은 서류를 통해 전달드리겠습니다. 다른 궁금한 점은 없으신가요?"
31030-113 = "[s] \"에덴조약이라는 게 뭐지?\""
31030-114 = "……."
31030-115 = "……."
31030-116 = "음…… 뭐라고 해야 할까……."
31030-117 = "그걸 설명하는 건 꽤 많은 시간이 필요하니 나중에 따로 시간을 마련하겠습니다. 일단 저희 내부의 기밀인지라……."
31030-118 = "게다가 지금의 보충수업부 업무와는 큰 관계가 없는 일이기도 하니……."
31030-119 = "[s] \"그리고 티파티의 학생회장은 세명 아니었어?\""
31030-120 = "……."
31030-121 = "그건……."
31030-122 = "세이아 쨩은 지금 트리니티에 없어. 그 아이는 현재 투병 중이거든."
31030-123 = "네. 원래 현재 파티 호스트는 세이아 씨여야 하지만…… 부재중인 관계로 제가 호스트를 맡고 있는 중입니다."
31030-124 = "티파티의 호스트는 돌아가면서 하거든. 뭐, 이것도 큰 상관은 없는 이야기지만."
31030-125 = "[s] \"뭐, 그 정도이려나…….\""
31030-126 = "네."
31030-127 = "그럼 준비를 마치는 대로 선생님이 트리니티 학원에 파견와주시는 걸로 하겠습니다."
31030-128 = "다시금 선생님의 협조에 감사드립니다. 이걸로 한시름 놓았네요."
31030-129 = "안녕~ 선생님. 다음에 또 봐. 볼 수 있을지는 모르겠지만."
31030-130 = "티파티 호스트가 한 자리에 모이는 것도 사실 쉬운 일은 아니니까요."
31030-131 = "바쁜척? 뭐, 그치만 선생님 덕분에 나기 쨩 얼굴도 오랜만에 보고. 좋았어."
31030-132 = "네. 저도 동감입니다. 미카 씨."
31030-133 = "후후훗."
31030-134 = "그럼, 앞으로 잘 부탁드립니다, 선생님. 앞으로 티파티 호스트인 제가 선생님을 에스코트하겠습니다."
31030-135 = "[s] \"잘 부탁해.\""
31030-141 = "(보충수업부의 명단에 있던, 이름이 익숙한 학생을 보기로 했다.)"
31030-145 = "[ns] \"역시. 너였나!!\""
31030-146 = "아, 아하하…… 안녕하세요. 선생님."
31030-147 = "아우우…… 그러니까 여, 여기에는 피치못할 사정이……."
31030-148 = "아우……."
31030-150 = "다음화;낙제생들 1"
