[translation]
1001206-1 = "트레이너와 데이트"
1001206-2 = "밀레니엄 근교 쇼핑몰"
1001206-3 = "……."
1001206-4 = "앗, 오셨군요. 트레이너."
1001206-5 = "기다리고 있었습니다."
1001206-6 = "네? 또 헬스 용품을 사러 온 거냐고요?"
1001206-7 = "아, 아뇨! 그렇지 않습니다."
1001206-8 = "그냥, 마땅히 좋은 약속 장소가 떠오르지 않았습니다."
1001206-9 = "뭔가, 트레이너와는 매번 운동에 대한 얘기만 했던 것 같아서요."
1001206-10 = "오늘은, 운동과는 관계없는 다른 얘기를 하고 싶어서……."
1001206-11 = "……."
1001206-13 = "아, 아앗! 죄송합니다! 트레이너!"
1001206-14 = "그렇지 않아도 바쁘실 텐데, 제가 괜히 연락을 드렸습니다! 죄송합니다!"
1001206-15 = "[s1] \"아냐. 가끔씩은 그런 것도 필요하니까.\"\n[s2] \"말하자면 데이트 같은 거려나…….\""
1001206-16 = "저, 정말 괜찮으신가요?"
1001206-17 = "감사합니다, 트레이너!"
1001206-18 = "!?"
1001206-19 = "네? 데, 데이트요? 아니, 전 그런……."
1001206-20 = "아니, 좋지만. 그래도……."
1001206-21 = "으으으으으……."
1001206-22 = "[s] \"그럼, 어디부터 가볼까?\""
1001206-23 = "마침, 오늘은 당분과 지방을 섭취해도 문제가 없는 날입니다."
1001206-24 = "일종의 치팅 데이, 라고 할 수 있겠네요."
1001206-25 = "트레이너만 괜찮다면, 먹는 쪽은 어떠실까요?"
1001206-26 = "[s] \"그럼 달콤한 걸 먹으러 가자!\""
1001206-27 = "네, 트레이너!"
1001206-30 = "와아, 이런 곳은 오랜만이네요."
1001206-31 = "다른 학우들에게 이야기를 듣거나, 밖에서 사람들이 드나드는 것만 보다보니."
1001206-32 = "저랑은 관계없는 장소라고 생각했었는데……."
1001206-33 = "막상, 이렇게 들어와보니 귀여운 것들도 많고 좋네요."
1001206-34 = "이곳에 오길 잘한 것 같습니다. 트레이너."
1001206-35 = "주문은 어떻게 하시겠습니까?"
1001206-36 = "앗, 잠시만요."
1001206-38 = "음……."
1001206-39 = "앗, 이 케이크."
1001206-40 = "엄청 귀엽네요……."
1001206-41 = "[s] \"그 아이로 주문할래?\""
1001206-42 = "네, 트레이너."
1001206-43 = "아, 주문 전에 잠시만요."
1001206-44 = "저기, 점원님? 질문이 있습니다."
1001206-45 = "네, 말씀하세요."
1001206-46 = "여기 있는 이 귀여운 마스코트로 데코 된 케이크에 관해서입니다만."
1001206-47 = "이 디저트의 성분 함량은 어디서 확인할 수 있습니까?"
1001206-48 = "네, 네?"
1001206-49 = "전체 칼로리가 얼마인지, 함유된 당분과 지방은 어느정도 인지."
1001206-50 = "참, 크게 기대하긴 어렵겠지만 단백질 함유량도 궁금합니다."
1001206-51 = "아, 그…… 그것이……."
1001206-52 = "[s] \"저기, 스미레…….\""
1001206-53 = "네, 트레이너?"
1001206-55 = "아……."
1001206-56 = "아앗, 제가 또…… 정말 죄송합니다."
1001206-57 = "점원님, 제가 한 말은 잊어주세요. 죄송합니다."
1001206-59 = "(이후, 스미레와 내가 주문한 디저트를 받아 카페 안의 자리에 앉았다.)"
1001206-60 = "후우, 죄송합니다. 트레이너."
1001206-61 = "제가 다이어트를 하고 있는 것은 아니지만, 음식에 포함된 성분을 아는 것은 운동을 하는데 있어 여러모로 도움이 되거든요."
1001206-62 = "근육을 키우는 것을 포함해서, 몸의 건강을 유지하는 데에는 올바른 식생활을 지키는 것이 매우 중요합니다."
1001206-63 = "참, 그러고보니 전에 제가 드렸던 단백질 보충제는 챙겨 드시고 계시죠?"
1001206-64 = "아시겠지만, 일반적인 음식을 통해 얻을 수 있는 단백질에는 한계가 명확합니다."
1001206-65 = "하지만, 단백질 보충제를 드신다면 정말 간편하게, 생물가가 아주 높은 단백질을 챙기실 수 있죠."
1001206-66 = "여기서 생물가란, 섭취한 영양소 중 신체의 유지와 성장에……."
1001206-67 = "[s3] \"저어…… 스미레.\"\n[s4] \"디저트가 우릴 기다리고 있어.\""
1001206-68 = "……아."
1001206-69 = "……아."
1001206-70 = "아아아앗!"
1001206-71 = "죄송합니다, 트레이너."
1001206-72 = "제가 또, 흥분했군요."
1001206-73 = "운동 이야기만 나오면 저도 모르게 그만……."
1001206-74 = "면목이 없습니다. 트레이너."
1001206-75 = "[s] \"괜찮아, 맛있게 먹자.\""
1001206-76 = "……네, 트레이너."
1001206-78 = "(이후, 스미레와 함께 맛있게 디저트를 먹었다.)"
1001206-80 = "[ns] \"자, 그럼 돌아갈까?\""
1001206-81 = "……네."
1001206-82 = "네? 제 기분이 안 좋아 보인다고요?"
1001206-83 = "그, 그게……."
1001206-84 = "저도 모르게, 운동에 대한 대화를 계속 하는 것 같아서…… 그렇습니다."
1001206-85 = "오늘만큼은, 평범한 대화를 나누고 싶었는데."
1001206-86 = "[s5] \"스미레와 평범한 대화를 나눈 거 같은데.\"\n[s6] \"스미레와의 평범한 일상이었어.\""
1001206-87 = "……."
1001206-88 = "……."
1001206-89 = "후훗, 네."
1001206-90 = "저기, 고객님! 잠시만요."
1001206-91 = "응?"
1001206-92 = "고객님께서 구매하신 케이크가 현재 이벤트 중인 케이크라서요. 선착순으로 인형을 드리고 있는데."
1001206-93 = "마침, 재고를 확인해보니 하나가 남아 있어서요. 자, 여기!"
1001206-95 = "귀, 귀여워……."
1001206-96 = "그럼, 좋은 하루 되세요~"
1001206-97 = "와아, 트레이너."
1001206-98 = "엄청 귀여운 아이입니다."
1001206-99 = "[s] \"잘됐네, 스미레.\""
1001206-100 = "후훗, 네."
1001206-101 = "트레이너와 함께하는 건 무엇이든, 그 끝은 항상 즐겁고 행복한 것 같습니다."
1001206-103 = "저기, 트레이너."
1001206-104 = "앞으로도, 많은 것을 함께해 주셨으면 합니다."
1001206-105 = "다시 한번, 잘 부탁드립니다!"
1001206-106 = "트레이너."
