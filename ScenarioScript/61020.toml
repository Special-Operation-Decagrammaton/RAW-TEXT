[translation]
61020-1 = "제2화;학생의 본분!"
61020-2 = "뭔가 오랜만이라는 느낌이네요, 선생님!"
61020-3 = "더 자주 뵐 수 있었으면 좋겠어요. 이러다 서로 얼굴 잊어버릴지도 모르겠어요……."
61020-4 = "음? 그런가? 나는 선생님의 얼굴과 귀는 결코 잊어버리지 않을 거야."
61020-5 = "타겟의 외형적 특징을 놓치지 않아야, 임무 수행에 지장이 없으니까."
61020-9 = "……무슨 소리 하는 거야. 선생님을 무슨 암살 대상 그런 걸로 생각하는 거야?"
61020-10 = "우후후. 그런 무서운 것은 아니겠지만, 밤의…… 보충수업을 받기 위해 찾아뵙는 대상일 수는 있겠네요."
61020-11 = "넌 또 왜 그러는데! 왜 항상 무슨 대화만 이어지면 그런 쪽으로 이야기를 몰아가는 거야!"
61020-12 = "하루에 한 번 그런 화제가 나오지 않으면, 입안에 가시라도 돋고 그러는 거야? 사형–!!!"
61020-13 = "아잉♡"
61020-14 = "이상한 감탄사도 금지야–!!!"
61020-16 = "아하하……. 다음 주부터 저희도 바빠질 테니까요, 이럴 때라도 선생님과 자주 만나 뵈어야죠."
61020-17 = "[s] \"다음 주? 무슨 일 있어?\""
61020-18 = "아, 그런가. 선생님은 모를 수도 있겠네."
61020-19 = "네. 이제 곧, 트리니티 종합고사 시즌이 돌아오거든요."
61020-20 = "슬슬 본격적으로 그 준비를 해야 해서 말이죠. 아우우……."
61020-21 = "[s] \"트리니티 종합고사?\""
61020-23 = "우후후. 그것은 모든 트리니티 재학생들을 대상으로 하여……."
61020-24 = "말 그대로, 언어 능력부터 보건 교육이나 보건 교육, 보건 교육까지…… 전 과목, 전 범위에 걸쳐 이루어지는."
61020-25 = "말 그대로의, 종합시험이랍니다"
61020-26 = "왜 보건 교육만 세 번 강조하는 거야…… 아니, 말하지 마. 알 것 같으니까."
61020-27 = "[s] \"그건 보통 시험과는 다른 거야?\""
61020-28 = "으음. 그건 나도 궁금하군. 시험이라면 이미, 그때의 보충 수업을 통해 어떤 것인지 확실히 알게 되었지만……."
61020-29 = "네. 트리니티 종합고사의 시험 문제는, 트리니티 내부가 아니라 외부에서 출제되거든요."
61020-30 = "그렇게 대단한 이유는 아니야. 뭐랬더라…… 공신력? 객관성? 으으, 뭐 그런 단어들이 있었는데……."
61020-34 = "아무래도 트리니티 내부에서만 시험 문제를 만들게 되면 편향적이거나 객관적이지 않은 문제가 출제될 가능성이 있으니까요."
61020-35 = "거기에 이런 의문도 제기해 볼 수 있겠죠."
61020-36 = "'시험 문제를 만드는 사람들의 시험은, 어떻게 치러야 하는가?' 같은 문제요."
61020-37 = "그 반대급부라고 해야 할까요? 채플 과목은 들어가지 않는다는 사소한 장점도 있기는 하네요."
61020-38 = "[s] \"아하…… 이해했어. 전국 모의고사구나…….\""
61020-39 = "전국…… 모의고사? 그게 뭐야?"
61020-40 = "그런 게 있었다고? 으음……. 애매하게 알 것 같기도 하고, 모를 것 같기도 하고."
61020-42 = "음. 그 표정을 보니, 선생님도 시험을 별로 좋아하지는 않는 모양이군."
61020-44 = "후후. 그렇군요. 시험을 좋아하는 사람은 애초에 별로 없을 것이라는 말씀이시네요. 물론 저도 그렇고요."
61020-45 = "의외라고요? 선생님도 참. 저도 평범한 고등학생이랍니다?"
61020-46 = "평범한……?"
61020-47 = "하지만 선생님과의 '밤의 시험'이라면…… 후후후…… 조금 좋아지는 것을 넘어, 기대가 되어 버릴지도요?"
61020-48 = "넌! 좀! 제발!!!"
61020-49 = "어머나, 어머나. 코하루 쨩. 어서, 어서 그다음 단어를–"
61020-54 = "사형–!!!!!"
61020-55 = "꺄앙♡"
61020-56 = "아하하하……."
61020-58 = "이해했어. 히후미. 그렇다면 이번 종합시험은 특별히 낙제생 같은 것은 나오지 않는다는 거네."
61020-59 = "네. 아무래도 시험 출제 주체가 외부 기관이다 보니까요. 하지만 그렇기 때문에 더 열심히 공부해야 하는 부분도 있어요."
61020-60 = "트리니티는 최고의 학원이니까 말이지! 함부로 얕보일 수 없다고!"
61020-61 = "그리고 낙제생을 특별히 지정하지는 않는다지만…… 지나치게 성적이 낮은 학생들은, 방과 후에 특별 보충 학습 자리를 만들어 주기도 하고요……."
61020-62 = "음? 낙제생을 지정하지 않지만, 낮은 성적자들에게는 보충 공부를 시킨다니, 그건 모순처럼 들리는데?"
61020-63 = "으음…… 그러니까 성적이 낮은 학생들에게, 특별히 과도한 책임은 묻지 않는다는 거예요."
61020-64 = "……예전 우리들의 보충수업부 활동처럼 말이죠……."
61020-65 = "보충 공부라고 해도, 기본적으로는 정해진 시간을 채우면 되는 것이기도 하고요."
61020-66 = "후후. 그렇지만 소중한 방과 후 자유시간을 빼앗긴다는 것만으로도, 아쉽다는 이야기가 나오기에는 충분하겠지만요?"
61020-68 = "[ns] \"그러네! 이번에는 보충 학습 안 받게 잘 하자!\""
61020-69 = "아우우……."
61020-70 = "우후후. 물론 가능할 리 없겠지만, 모두가 종합고사를 잘 치렀는데 저 혼자만 보충 학습 대상이 된다면……."
61020-71 = "그 보충 학습의 관리 교사를, 선생님께 부탁드리고 싶기도 하네요."
61020-72 = "아무도 없는 빈 교실. 노을이 지는 하늘. 반쯤 열린 창문으로 불어오는 저녁 바람. 흩날리는 커튼……."
61020-73 = "저는 딴짓이 하고 싶어진 나머지 잠시 창밖을 멍하니 바라보고, 선생님께서는 그런 저에게 집중하라면서 가까이 다가오시고……."
61020-74 = "그때 마침 바람이 약간 강하게 불어, 저와 선생님을 둘만의 공간으로 데려가–"
61020-80 = "서로 얼굴을 마주 본 채 말이 없어진 두 사람의 거리는, 무의식중에 조금씩 가까워져 가고–"
61020-81 = "아, 아와와와와?!"
61020-82 = "???"
61020-83 = "!?!?!!!!!"
61020-84 = "넌 당분간 아무 말도 하지 마!!!!!"
61020-85 = "아까워라~"
61020-90 = "[ns1] (그러고 보니…….)\n[ns2] (다른 아이들은 어떻게 하고 있나 보러 갈까…….)"
61020-94 = "[ns] \"시험기간인데도, 자경단 활동은 계속하는 거야?\""
61020-95 = "그럼요! 당연하죠! 학업도 거리의 질서 수호도, 어느 쪽 하나 소홀히 해서는 안 됩니다!"
61020-96 = "어느 것 하나 놓치지 않는 것이야말로, 자경단의 꺾이지 않는 의지이자 행동 원칙이라고 할 수 있겠죠!"
61020-97 = "그렇지 않나요, 스즈미 씨!"
61020-101 = "그, 자경단에 특별한 행동 원칙 같은 것은 없습니다만……."
61020-102 = "그래도 공부는 학생의 본분이니까요. 레이사 씨의 말도, 틀린 것은 아니라고 생각합니다."
61020-103 = "네? 저만 보면 든든해지는 기분이라고요? 그, 그건 무슨 말씀이신가요, 선생님……?"
61020-104 = "잘 모르겠지만, 아무튼 좋은 것이 아닐까요!"
61020-108 = "으에에?! 누, 누구인가 했더니 시미코와 선생님이셨군요……. 저는 또, 다른 외부 사람들인 줄 알고……."
61020-109 = "트리니티 종합고사 시즌을 맞이해서, 도서부가 어떻게 준비하고 있는지 보러 오셨다고 해요. 부장님."
61020-110 = "그런 시험, 언어 영역 정도는 특별히 공부할 필요도……."
61020-111 = "하지만 이건 '종합'고사잖아요? 언어 영역 말고도, 모든 과목을 다 준비해야 한다고요."
61020-112 = "……책에는 모든 분야가 담겨 있으니까, 난 특별히 문제없어……."
61020-114 = "수학도요?"
61020-115 = "으에?!"
61020-116 = "그러면 안 돼요, 부장님. 편식이 좋지 않은 것처럼, 편독도 좋지 않답니다?"
61020-117 = "으으으으……."
61020-119 = "[ns] \"그런데 시미코는 수학 괜찮아?\""
61020-120 = "저요?"
61020-121 = "저는 1학년이니까, 3학년인 부장님보다는 상대적으로 공부할 분량이 적으니까요."
61020-122 = "으우우…… 치사해……."
61020-125 = "안녕, 선생님. 어서 와. 응……. 그래. 종합고사 시즌이라고 하더라. 그래서 다 같이 모여서 공부하기로 했는데……."
61020-129 = "듣거라, 모험자들이여. 자고로 두뇌 회전에는 당분이 무엇보다도 필요한 법."
61020-130 = "우리의 뇌는 포도당이라는 고급 연료 말고는 받아들이지 않는다고 한다."
61020-131 = "그렇기에 지금 이 순간 우리가 디저트를 먹으려는 행위는, 그야말로 정당한 것임을 선포한다!"
61020-132 = "맞아, 맞아! 나츠도 가끔 쓸 만한 소리를 한다니까! 역시 디저트가 들어가야 공부가 되는 법이지!"
61020-134 = "……이 모양이라서 말이야……."
61020-135 = "죄, 죄송해요. 선생님. 신경 써서 와 주셨는데……."
61020-137 = "[ns] \"어떤 의미로는 안심이 되는구나…….\""
61020-139 = "당연한 일입니다. 선생님. 시험도 구호도, 어느 것 하나 소홀히 하지 않는 것이야말로, 구호기사단의 기본적인 자세라고 할 수 있겠죠."
61020-140 = "특히 지금과 같은 종합시험의 경우에는, 시험이야말로 또 다른 의미의 구호라고 할 수 있을 것입니다!"
61020-141 = "[s] \"저기…… 그건 무슨 논리……?\""
61020-142 = "구호도 시험도, 모두 사람을 널리 이롭게 하는 것이기 때문입니다."
61020-143 = "그 본질을 지나치지 않고 충실히 행하며 임하는 것으로, 저희의 구호심을 증명할 수 있는 길이 아닐까 합니다."
61020-144 = "가령 대가 없이 선의로써 남을 돕는 것 역시, 구호입니다."
61020-145 = "불의가 행해지는 곳에, 물리적인 수단을 동원해서라도 기준을 세우는 것 역시, 구호입니다."
61020-146 = "고의로 원가를 절감하여, 소독 및 상처 치료를 저해하는 의료용품을 만들어내는 악덕 회사를 응징하는 것 역시, 구호입니다."
61020-147 = "모든 길은 그야말로, 구호로 통한다고 할 수 있겠지요."
61020-148 = "따라서 시험은, 곧 구호입니다."
61020-150 = "네? 구호란 무엇일까…… 라고요? 아하하하……."
61020-151 = "저, 저희 구호기사단에게 있어서는, 가장 중요한 가치인 것이겠죠?"
61020-152 = "그렇지만, 어째서 시험 범위에 트리니티 고유의 의료술은, 포함되지 않는 걸까요……."
61020-153 = "그, 그건 그러니까…… 여러 가지로, 지나치게 혁신적이기 때문이 아닐까 하는데요, 하나에 쨩?"
61020-155 = "서, 서서서서서, 선생, 님?! 어, 어어어, 어째서 이런 누추한 곳까지……?"
61020-156 = "고, 공부가 잘되는지 보러 오셨다고요? 그, 그건 기쁩, 니다. 그렇기는 한데……!"
61020-157 = "크으…… 윽……."
61020-158 = "츠루기? 괜찮아요. 긴장 풀어요. 선생님이시잖아요?"
61020-159 = "으, 응……."
61020-160 = "감사, 합니다. 선생님……. 이렇게, 신경 써 주셔서……."
61020-162 = "[ns] \"뭔가 공부를 방해한 것 같아 미안하네…….\""
61020-163 = "아닙니다. 선생님. 저희도 약간 숨을 돌릴 시간이 필요했으니까요."
61020-164 = "이래 봬도 며칠 전부터, 수업이 끝나고서도, 식사를 하거나 현장 업무를 처리할 때를 제외하고는, 모두 공부에 시간을 들이고 있었거든요."
61020-165 = "아무래도 저희 정의실현부는, 다른 동아리에 비해서, 개인 시간이 약간 아쉽게 주어지다 보니 말이죠……."
61020-170 = "너무 걱정하실 필요 없슴다, 선생님. 분명히 그런 부분은 있습니다만, 다들 어느 정도 감안한 다음에 이 활동을 하고 있으니 말임다."
61020-171 = "네. 어떠한 난관이 주어지더라도, 흔들리지 않고 자신이 옳다고 믿는 길을 가는 것……."
61020-172 = "그것이야말로 정의실현부의 본질이 아닐까 합니다."
61020-173 = "오, 좋은 말을 해 주었네요! 그러면 다시, 이 대목으로 돌아가죠. 도덕과 윤리의 상대성 파트입니다만–"
61020-174 = "……역시 이 부분은 너무 어렵습니다, 이치카 선배. 상대적이라면 결국 조건에 따라 변화한다는 것인데…… 그럴 리가 없는데……."
61020-175 = "그게 항상 말처럼 딱딱 떨어지는 게 아님다……. 이해가 어렵다면, 일단 암기부터 해 보도록 하죠……."
61020-177 = "……그래서 저희 시스터후드는, 모두가 대강당에 모여, 정숙을 지키며, 다 함께 공부하는 자리를 갖고자 한답니다."
61020-178 = "[s3] \"호, 혼자 공부하는 게 좋은 사람도 있지 않을까?!\"\n[s4] \"부끄러워서라든가, 부담스러워서라든가!\""
61020-181 = "그럴 리가요. 무릇 하늘 아래 부끄러움이 없도록 노력해야 하는 것이, 저희 시스터후드의 마음가짐 중 하나."
61020-182 = "그리고 공부라는…… 학생이 해야 할 본분 중 하나를 행하는 데에, 어떤 부끄러움이 뒤따를 수 있을까요?"
61020-183 = "저는 트리니티의 그 누구보다도, 저희 자매님들을 깊게 신뢰하고 있답니다!"
61020-184 = "만에 하나 그런 감정이 든다고 해도, 언제든지 저에게 '편하게' 상담을 해 주신다면."
61020-185 = "저는 충분히 그분을 위해, 편의를 봐 드릴 수 있다고 말씀을 드리기도 했고요."
61020-186 = "사, 사쿠라코님께 1대 1 상담…… 이군요."
61020-191 = "그렇습니다. 시스터 히나타. 이 또한 세상에 널리 퍼트려야 할, 자비와 사랑의 마음가짐이 아닐까요?"
61020-193 = "네, 네에……. 그런 부분도, 분명히 있을 수 있겠네요……!"
61020-195 = "(사쿠라코를 잘 타일러서, 대강당에서 함께 공부하고 싶은 학생은 대강당에서.)"
61020-196 = "(개인 자습을 하고 싶은 학생은, 기숙사 방에서 공부하는 것으로, 타협안을 만들었다.)"
61020-197 = "(히나타와 마리가…… 고생이 참 많았다…….)"
61020-202 = "아! 선생님! 안녕하세요!"
61020-203 = "시험이요? 네에~ 잘 봐야죠오~"
61020-204 = "정말요? 공부 열심히 하면 맛있는 거 사 주신다고요? 꼭이에요? 기억했으니까요?"
61020-205 = "좋아! 그럼 간만에 공부라는 걸 좀 해 볼까!"
61020-206 = "저번처럼 딱 한 장 공부하고 엎드려 자려고?"
61020-207 = "그거 너도 같이 잤잖아!"
61020-213 = "(흐뭇하게 학생들이 떠들며 돌아가는 모습을 지켜보고 있으려니…….)"
61020-214 = "(또 다른 두 명의 학생이, 눈치를 살피며 조심스럽게 다가왔다.)"
61020-220 = "저, 선생님……?"
61020-221 = "잠시, 시간 괜찮으실까요……?"
