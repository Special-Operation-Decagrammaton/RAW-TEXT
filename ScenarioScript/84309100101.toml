[translation]
84309100101-6 = "두 사람, 꽤 친해 보여."
84309100101-7 = "갑자기 무슨 소리야. 무슨 의미로 그런 소릴 하는 건데?"
84309100101-8 = "……아무것도 아냐."
84309100101-10 = "나중에 기회가 된다면, 리오도 함께 하도록 하죠. 비슷한 느낌이라면, 방탈출 카페라든가 많으니까요."
84309100101-11 = "밀레니엄 안에서는 무리겠지만, 다른 지역이라면 가능하지 않겠어요? 트리니티라거나."
84309100101-13 = "방탈출 카페라니, 완전히 노는 감각이잖아, 어이."
84309100101-14 = "나, 나는…… 아직 그렇게 여유를 즐길 자격이…"
84309100101-15 = "가고 싶은 거야, 말고 싶은 거야."
84309100101-16 = "……"
84309100101-17 = "……해야 할 것들이 모두 끝나면, 그때에는 이야기할게."
84309100101-18 = "후후, 좋아요. 약속입니다. 네루도 함께요."
84309100101-22 = "……? 나도??"
84309100101-23 = "네. ……셋이 모두요."
