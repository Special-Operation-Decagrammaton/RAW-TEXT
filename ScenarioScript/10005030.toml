[translation]
10005030-1 = "제3화;무자비한 심문"
10005030-2 = "(멤버들과 다시 객실로 돌아와, 아직 묶인 채로 기절해 있던 바니걸 가드에게 다가갔다.)"
10005030-7 = "으, 으읍……. 으으읍……?"
10005030-9 = "……!! 아야!!!"
10005030-10 = "뭐, 뭐야……? 뭐야?"
10005030-12 = "뭐야. 생각보다 금방 일어나네?"
10005030-13 = "어라, 다행이네요. 보기보다 튼튼하신 것 같으니, 심문 결과도 기대해 볼 수 있겠어요."
10005030-14 = "아니, 왜 시작하기 전부터 그런 말들을……."
10005030-15 = "너무 걱정할 거 없다. 묻는 말에 빨리 대답해 주기만 하면, 아무 짓도 하지 않을 테니."
10005030-17 = "이미 무슨 짓 했거든!? 사람 기절시켜 놓고 묶어서 가둬 놨잖아!?"
10005030-18 = "대체 너희 뭐야? 왜 이런 짓을 하는 거지? 돈이냐? 돈 때문이냐?"
10005030-19 = "이런 짓을 하고도 무사할 줄……."
10005030-20 = "……아앙?"
10005030-21 = "무사하지 않으면? 아니면 뭐 어쩔 건데?"
10005030-22 = "히, 히익……!?"
10005030-23 = "도, 돈이라면 몰라요! 전 일개 가드라고요! 그런 것에 접근할 수 있을 리 없잖아요!"
10005030-25 = "후훗. 그야 그렇겠지요. 저희도 잘 알고 있답니다."
10005030-26 = "하지만 그거라면 걱정마세요. 저흰 그런 것 때문에 온 게 아니니까요."
10005030-27 = "저희는 그저 사람을 한 명 찾으러 왔을 뿐."
10005030-29 = "……사람? 무슨 사람?"
10005030-30 = "백……"
10005030-31 = "아니, 쿠로사키 코유키라고 하는 사람이다. 온 지는 며칠 안 됐지. 혹시 알고 있나?"
10005030-32 = "으, 으응? 그게 무슨……."
10005030-33 = "발뺌하는 건 아니겠지?"
10005030-34 = "그러다가 걸리면 진짜……."
10005030-35 = "자, 잠깐! 잠깐 스톱!!"
10005030-36 = "너, 너희들 이거 소용없는 짓이야. 난 모른다고. 정말로 몰라!"
10005030-37 = "여기 뽑기 돌리러 온 승객들이 몇 명인 줄 알아!? 수천 명이 넘어!"
10005030-38 = "하나하나 기억하고 있을 리가 없잖아!? 게다가 이름이라니? 그런 걸 어떻게 알아?"
10005030-39 = "이 녀석이 진짜……."
10005030-40 = "히, 히익!"
10005030-41 = "지, 진짜라니까……요!!"
10005030-42 = "[s1] \"정말로 모르는 거 같아.\"\n[s2] \"네루. 폭력은 안 돼.\""
10005030-43 = "……크, 크윽……!"
10005030-44 = "……크, 크윽……!"
10005030-45 = "후……. 넌 오늘 운 좋은 줄 알아, 진짜."
10005030-46 = "어떻게 이 상황에서 운이 좋을 줄 알라는 거야……."
10005030-48 = "음……. 그렇지만 듣고 보니 맞는 말씀이시네요. 이분이 관리자는 아니니까요."
10005030-49 = "그리고 관리자라고 한들, 승객들의 이름을 하나하나 다 알고 있을 거 같지도 않고요."
10005030-50 = "……심문해 봐야 정말로 아는 바가 없을 거란 뜻인가. 그건 난처하게 됐군."
10005030-51 = "[s3] \"인상착의 같은 걸 물어보는 건 어때?\"\n[s4] \"사고뭉치인 친구라면, 그만큼 튀는 것도 있지 않을까?\""
10005030-52 = "과연! 맞다. 일리가 있는 이야기야."
10005030-53 = "과연! 맞다. 일리가 있는 이야기야."
10005030-54 = "역시 선생님이군. 좋은 발상이다. 이름은 몰라도 짐작 정도는 할 수 있겠지."
10005030-55 = "뭐라 해도……. 백토 녀석은 꽤 튀는 녀석이니까 말이지."
10005030-56 = "어이, 들었지? 지금부터 인상착의에 대해 알려줄 테니 똑바로 들으라고."
10005030-57 = "허튼수작 부리거나 하기만 해봐. 알았어!?"
10005030-59 = "흐이익……!"
10005030-60 = "말로 설명하는 것보다 직접 보여드리는 편이 낫겠지요. 여기……."
10005030-64 = "보이시나요? 이렇게 생긴 아이입니다만……."
10005030-65 = "꽤 시끄럽고 요란한 아이라, 기억에 있으실 거예요. 한 번 기억해 주시겠어요?"
10005030-66 = "언행도 상당히 경박하고, 말에도 예의가 없는 편이다. 무례한 기억이 있다면 더듬어 보도록."
10005030-70 = "음……. 이런 사람……?"
10005030-71 = "경박하고……. 예의가 없고 무례한……?"
10005030-75 = "……아."
10005030-76 = "……'아'?"
10005030-77 = "……! 헉."
10005030-78 = "지금 '아'라고 했지?"
10005030-79 = "크하하. 딱 걸렸어."
10005030-80 = "아, 아냐. 아니야! 난 몰라. 모른다고! 안다고 해도 고객의 정보를 내뱉을 순 없다!!"
10005030-81 = "크하하하! 역시 알고 있네, 이 녀석. 알고 있어."
10005030-82 = "네. 반응을 보아하니, 확실히 생각이 나신 모양이네요."
10005030-83 = "그럼 이제 알아내기만 하면 되는데……."
10005030-88 = "……!! 헉!!"
10005030-89 = "그, 그만! 그만 둬! 폭력 반대, 폭력 반대!!"
10005030-90 = "아~. 그동안 계속 답답했다고. 이제야 손 좀 풀겠는걸."
10005030-91 = "너무 빨리 불진 마라, 서운하니까."
10005030-92 = "그리고 원망할 거면. 괜히 버티고 있는 네 자신을 원망해. 알았냐?"
10005030-97 = "……선생님."
10005030-98 = "[s5] \"응. 네루. 그래도 폭력은 안 돼.\"\n[s6] \"다르게 설득할 방법이 있을 거야.\""
10005030-99 = "……앙?"
10005030-100 = "……앙?"
10005030-101 = "선생, 여기까지 와서 말리는 거야? 이 녀석에게 이야기를 들어보자고 한 건 선생이라고?"
10005030-102 = "그리고 이런 일에서, 이 정도는 아주 '평화로운 대화'에 속한단 말이야."
10005030-103 = "아니면 달리 방법이라도 있나? 이 녀석, 어지간해선 불 거 같지가 않은데."
10005030-104 = "우린 시간도 얼마 없다고. 선생도 그건 동의하잖아?"
10005030-105 = "……잠깐."
10005030-106 = "그렇다면 그 심문……. 혹시 내가 해봐도 괜찮겠어?"
10005030-107 = "……뭐?"
10005030-108 = "……네?"
10005030-109 = "[s7] \"카린이?\"\n[s8] \"뭔가 방법이라도 있어?\""
10005030-110 = "응. 나름대로 생각해 둔 방법이 있으니까."
10005030-111 = "응. 나름대로 생각해 둔 방법이 있으니까."
10005030-112 = "나한테 맡겨 줘. 서로 다치지 않고 웃으면서 해결할 수 있는 방법을 알고 있다."
10005030-113 = "엉? 웃으면서 해결한다고? ……어떻게?"
10005030-114 = "이런 상황에서 그렇게 좋은 방법이 있을 수 있나요?"
10005030-115 = "……괜찮겠지? 선생님."
10005030-116 = "[s9] \"웃으면서 해결할 수 있다면 베스트지.\"\n[s10] \"물론이지. 서로 웃으면서 해결하자.\""
10005030-117 = "알겠다. 그럼……."
10005030-118 = "알겠다. 그럼……."
10005030-123 = "……! 뭐, 뭐야. 넌 또 뭐 하는 녀석이야……?"
10005030-125 = "저, 저리 안 가?"
10005030-126 = "무슨 짓을 해도 나는 절대 고객의 정보를……."
10005030-127 = "불 수는……!?"
10005030-128 = "……."
10005030-129 = "……힉!?"
10005030-132 = "무, 무슨 짓이……야……! 푸훕!!"
10005030-133 = "그, 그만……! 간지럽힘이라니……! 그만!!"
10005030-134 = "그만둬! 제발……! 푸훕! 푸흐흐흡! 풉큽……! 푸하하……!!"
10005030-135 = "푸하하하하하하! 아, 안돼! 안돼 거긴 안 돼!! 멈춰! 멈……! 푸하하하하!!"
10005030-136 = "……아직이야."
10005030-137 = "으, 으하! 으하하하! 아, 아니! 거긴, 거기는……! 어하흐허허흐흑……!!"
10005030-142 = "……어머나."
10005030-143 = "과연. 이거라면 확실하게 효과가 있겠네요. 카린, 대단한 걸요."
10005030-144 = "그렇지만 '웃으면서 해결한다'는 말이 이런 뜻이었을 줄은……."
10005030-145 = "……."
10005030-147 = "으아아아! 그, 그만!! 그마아아안! 으하하하!!"
10005030-148 = "……! 이런. 웃음소리가 너무 커지고 있다."
10005030-149 = "이대로라면 들킬 염려가 있어. 조치를 취해야겠군."
10005030-153 = "……!? 뭐, 뭐웁! 우웁!! 웁!!"
10005030-154 = "음. 이제 조용해졌군. 그럼 다시 심문을 시작……."
10005030-155 = "……? 엉?"
10005030-156 = "어라, 카린……?"
10005030-157 = "웁! 우웁! 웁! 우우웁! 웁웁……!"
10005030-158 = "……우웁!?"
10005030-159 = "우우우웁! 웁우우부부웁부붑!!"
10005030-160 = "우웁……!!"
10005030-165 = "……잠깐만."
10005030-166 = "아무리 그래도 이건 이상하잖아. 심문인데 왜 입을 막는 거야?"
10005030-167 = "확실히 폭력은 아니지만, 이 정도면 폭력이나 다름없는 게 아닌가 하는 생각도……."
10005030-168 = "……어이."
10005030-169 = "이거 진짜 위험한 거 아냐? 저러다 그냥 기절할 거 같은데?"
10005030-171 = "듣고 보니 그렇네요. 지금이라도 말려야겠어요."
10005030-172 = "카린. 카린……? 이제 슬슬 그만해야 할 것 같은데……."
10005030-176 = "카린……?"
10005030-177 = "집중하느라 안 들리는 것 같네. 내가 가서 말려야겠다."
10005030-181 = "어이, 카린. 그만해. 그러다가 기절하겠어."
10005030-182 = "우웁! 우우우우웁! 우푸웁훕푸우흐흐훕!!"
10005030-187 = "우우우우우우웁~~~!!!!"
10005030-188 = "어이, 카린!"
10005030-189 = "……야!!!"
10005030-190 = "……!? 으, 으응!? 뭐, 뭐지?"
10005030-191 = "불렀나, 선배……?"
10005030-192 = "그래. 불렀다. 몇 번이나 불렀잖아."
10005030-193 = "시끄럽다고 입을 막으면 어떻게 하냐? 애초에 심문할 수가 없잖아?"
10005030-194 = "그러다가 애가 기절하기라도 하면……."
10005030-195 = "어……. 어어……?"
10005030-199 = "……어라라……."
10005030-200 = "[s] \"…….\""
10005030-204 = "……아."
10005030-205 = "……기절했다……."
