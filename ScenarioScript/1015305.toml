[translation]
1015305-1 = "평범한 인기?"
1015305-2 = "게헨나컵 경기장"
1015305-3 = "(다른 행정 사무의 일이 있어 경기 사무처에 들렀다 오는 길이었다.)"
1015305-6 = "(저 멀리, 히후미가 보였다.)"
1015305-12 = "저, 저기…… 이만 돌아가야 하는데요오……."
1015305-13 = "그치만 그치만! 이런 곳에서 만나다니 운명이잖아! 저 완전 팬이에요!"
1015305-14 = "저번 경기에서도 대단했어요! 숲에서 아무도 못 나가게 한 거요!"
1015305-15 = "사인해줄 수 있어요? 공격적인 플레이, 저 진짜 팬이에요!"
1015305-16 = "일부러 공격적으로 한 건 아닌데요, 아우우……."
1015305-17 = "아니에요, 명경기였다고 엄청 화제였어요!"
1015305-18 = "그런데, 지금까지 별로 경기에 안 나왔던 건 왜 그런 거예요?"
1015305-19 = "아, 아우우……."
1015305-21 = "실례하겠습니다!! 이만 가 볼게요!!"
1015305-25 = "앗…… 도망갔다."
1015305-26 = "같이 사진 찍고 싶었는데, 체엣-"
1015305-27 = "신비주의 콘셉트라고 하잖아. 사진도 잘 안 찍히려고 하고, 인터뷰도 매번 피하고."
1015305-28 = "엄청난 재능이 있으면서 겸손하다니, 더 멋있어……!"
1015305-30 = "[ns] \"히후미!! 기다려!\""
1015305-32 = "(이후, 히후미를 쫓아갔지만…….)"
1015305-33 = "(인파 속으로 허둥지둥 도망친 히후미를 결국 놓치고 말았다.)"
1015305-39 = "(히후미를 찾으러 다니다가, 잠시 숨을 돌리기로 했다.)"
1015305-46 = "[ns] \"히후미?\""
1015305-47 = "앗, 선생님. 여기서 뵙네요?"
1015305-48 = "……산책 중이세요? 아하하, 우연이네요. 저도 기분 전환하고 있었어요."
1015305-49 = "[s] \"히치하이킹도 받니?\""
1015305-50 = "아하하! 물론이죠, 선생님!"
1015305-51 = "자아! 얼른 타세요!"
1015305-55 = "저녁이라 추우시면, 따듯한 페로로님 담요도 있어요!"
1015305-56 = "그러면, 어디로 갈까요?"
1015305-57 = "[s] \"히후미가 가고 싶은 곳으로!\""
1015305-58 = "제가 가고 싶은 곳……."
1015305-61 = "……네, 그러면 한 곳, 가려던 곳이 있었어요."
1015305-62 = "출발할게요!"
1015305-67 = "불 꺼진 게헨나컵 경기장"
1015305-69 = "도착했어요, 선생님."
1015305-70 = "서킷이에요."
1015305-71 = "……밤이 되니까 조금 쌀쌀하네요, 크루세이더 쨩에 있는 온수기로 차를 끓일 수 있는데, 어떠세요?"
1015305-72 = "밤의 서킷을 보면서 즐기는 티타임도, 꽤 좋아요."
1015305-73 = "[s] \"그럼 한 잔 부탁할게.\""
1015305-74 = "네, 잠시만 기다려 주세요!"
1015305-79 = "음…… 선생님."
1015305-80 = "저…… 특별한 사람은 대단하다고 생각해요. 저는 평범하니까요."
1015305-81 = "그래서…… 만약에, 만약에 말인데요. 제게 '특별'한 게 있다는 걸 알았는데…… 그게 제가 바라던 특별함하고 다르다고 한다면…… 어떨 것 같으세요?"
1015305-82 = "[s1] \"특별하게 예쁜 거?\"\n[s2] \"특별하게 귀여운 거?\"\n[s3] \"특별하게 착한 거?\""
1015305-86 = "아, 아우우! 말씀은 감사합니다만, 그런 게 아니라요……!"
1015305-90 = "전차…… 관련된 고민이에요."
1015305-92 = "운전을 좋아해서, 어쩌다 보니 흥미를 가지고 관심을 가졌어요."
1015305-93 = "……어느샌가, 조금 유명해져 있던 것 같아요. 그래서 가끔 말을 걸어오시는 경우도 있고요……."
1015305-94 = "그런데, 이런 식으로 눈에 띄는 건 부담이 된다고 해야 하나……."
1015305-96 = "제가…… 이런 형태로 누군가의 '특별'이 될 거라곤 생각하지 못했어요."
1015305-99 = "[ns] \"……괴롭니?\""
1015305-100 = "앗, 아니에요! 그걸로 기뻐하는 분이 있다면, 저도 기뻐요."
1015305-101 = "그런데…… 아무래도 소문이 와전되어서 무서운 이미지가 붙어버린 것 같아요."
1015305-102 = "저는 그저 진지하게 임했던 것뿐인데요, 아우우……."
1015305-103 = "……그래서, 경기가 끝나면 이렇게 조용해진 경기장을 꼭 보러 와요."
1015305-104 = "특별한 하루가 지나가고, 다시 평범한 일상으로 돌아가는 거다, 라고 마음을 다잡을 수 있어서요."
1015305-105 = "이상하죠. 특별함을 부러워했으면서, 평범함으로 돌아가고 싶다고 생각하고……."
1015305-106 = "[s4] \"특별하다는 건 멋지다고 생각해.\"\n[s5] \"그리고 그만큼, 평소의 히후미도 멋지다고 생각하고.\""
1015305-109 = "저의 특별한 부분과, 평소의 저……."
1015305-112 = "……감사합니다. 선생님."
1015305-113 = "에헤헤, 기운 났어요!"
1015305-114 = "차, 한 잔 더 하실래요?"
1015305-115 = "[s] \"좋지! 이번엔 특별하게 따라줘!\""
1015305-116 = "네!"
1015305-118 = "(이후, 달빛이 어린 빈 경기장을 바라보며 히후미와 함께 느긋이 홍차를 즐겼다.)"
