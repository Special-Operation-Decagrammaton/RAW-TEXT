[translation]
1009105-1 = "제 담당이 맞습니다."
1009105-2 = "(늦은 오후, 근처의 건널목에서 카즈사를 기다렸다.)"
1009105-3 = "……요! 선생님."
1009105-8 = "[ns1] \"오, 왔네. 카즈사.\"\n[ns2] \"시간 정말 칼 같이 맞춰 오네.\""
1009105-11 = "오래 기다린 거 아니지? 나름대로 연습 빨리 끝내고 온다고 온 거긴 한데……."
1009105-12 = "선생님은 가끔씩 너무 일찍 나와 있을 때가 있으니까 말이야."
1009105-13 = "이제 한두 번 보는 것도 아닌데……. 내 패턴을 숙지했을 테니, 괜히 더 기다리지 말라고."
1009105-14 = "[s] \"카즈사를 기다리는 거라면…….\""
1009105-15 = "자, 자~. 스톱. 스톱."
1009105-16 = "전부 예상했거든. 절대 반응하지 않을 거라고. 이번에는 컷입니다."
1009105-17 = "그런 소리 할 시간 있으면 먹고 싶은 거라도 미리 골라 놓고 있으란 말이야."
1009105-18 = "……응? 나름대로 골라 놓은 게 있다고?"
1009105-19 = "오……? 웬일이야. 평소랑은 좀 다르네?"
1009105-20 = "그럼 그 리스트 한 번 보여줄 수 있어? 동선은 내가 짤 테니까."
1009105-21 = "이곳 주변 가게는 폐점 시간이 다 달라서, 그냥 가까운 대로만 동선을 짜다가는 놓치는 게 생기기 마련이거든."
1009105-22 = "여기서는 전문가의 말씀을 따르라-이런 이야기지. 후후."
1009105-27 = "어디 보자……."
1009105-28 = "음음. 오……. 과연……."
1009105-29 = "뭐야, 꽤 괜찮은 픽이잖아. 이쯤 되면 선생님도 정말 방과후 디저트부 다 됐는걸. 그만 하산해도 좋다고 말할 뻔했어."
1009105-30 = "[s] \"누구 씨에게 잘 배운 덕이지.\""
1009105-31 = "치켜세워도 더 나올 건 없다고. 싫다는 건 아니지만."
1009105-32 = "……후후."
1009105-33 = "좋아. 그럼 괜히 시간 끄는 것도 싫으니, 어디 바로……."
1009105-34 = "……출발해 볼까!"
1009105-36 = "(이후 카즈사와 함께 주변을 돌며 디저트 탐방을 시작했다.)"
1009105-37 = "(다소 특이한 동선이었지만, 카즈사의 말대로 폐점 시간을 아슬아슬하게 피하는 '최적의 루트'였다.)"
1009105-39 = "(어느덧 저녁이 되어, 리스트의 마지막 가게 앞에 도착했다.)"
1009105-44 = "……음. 좋아. 늦지 않았네."
1009105-45 = "여기가 끝. 리스트는 이걸로 모두 클리어라 할 수 있지."
1009105-46 = "……응?"
1009105-47 = "대단하다고? 하하. 뭔가 순수하게 뿌듯하네. 나쁘지 않은걸."
1009105-48 = "뭐, 다른 녀석들에 비하면 오히려 조금 부족한 실력이지만……."
1009105-49 = "그래도 선생님 상대로 리드하는 것 정도는 문제없는 것 같아."
1009105-50 = "앞으로도 언제든지 땡기면……."
1009105-54 = "……이 누님에게 맡기시라고요. 알았지?"
1009105-55 = "[s3] \"오늘따라 정말 의기양양하네.\"\n[s4] \"하하. 그럼 또 기대해 볼까.\""
1009105-58 = "후후. 뭐, 그런 거지. 좋은 건 좋은 거니까 말이야."
1009105-59 = "그럼……."
1009105-61 = "오, 안녕하세요. 오늘의 마지막 손님이시군요."
1009105-66 = "……어라. 이거 이거, 마지막 물량은 꽤 특별한 손님들께 돌아가겠군요."
1009105-67 = "뭔가 가수……? 밴드……? 같은 거 하시는 분이실까요?"
1009105-68 = "……?"
1009105-72 = "……어, 어? 이거 설마 내 이야기야, 선생님?"
1009105-73 = "[s5] \"외견상 누가 봐도 그렇긴 하지.\"\n[s6] \"뭐, 여긴 우리밖에 없으니까.\""
1009105-76 = "요새는 학생 때부터 데뷔하는 가수나 밴드 분들도 많으니까요."
1009105-77 = "어린 나이부터 꿈을 가지고 노력하는 모습이라니……. 멋지지 않습니까! 저도 응원하고 있답니다."
1009105-78 = "그럼 옆에 분은 보아하니……."
1009105-79 = "아, 그러니까 이 사람은 그……."
1009105-80 = "……선ㅅ……."
1009105-82 = "……담당 매니저시겠군요?"
1009105-86 = "…….!?"
1009105-90 = "[ns7] \"……네?\"\n[ns8] \"아. 당연히 그래 보이겠구나.\""
1009105-94 = "아, 어……. 그……."
1009105-95 = "그……. 어……."
1009105-96 = "……?"
1009105-97 = "……?? 으, 으음?"
1009105-98 = "어, 어라. 죄송합니다……. 이거 제가 뭔가 말실수를 한 모양이네요."
1009105-99 = "마지막 손님이라고 저도 모르게 오지랖을 부려 버린 게……. 아이고, 또 이런 실수를……."
1009105-100 = "……."
1009105-101 = "…………."
1009105-102 = "그럼 이 분은……."
1009105-103 = "[s9] \"아뇨. 괜찮습니다. 저는…….\"\n[s10] \"이 학생의…….\""
1009105-106 = "……담당이에요."
1009105-108 = "[ns11] \"……?\"\n[ns12] \"카즈사?\""
1009105-111 = "네. 담당이에요. 제 담당 매니저입니다."
1009105-112 = "알아보는 사람이 있을지 몰라서, 순간 당황했던 것뿐이에요."
1009105-116 = "……그렇지?"
1009105-121 = "내 담당. ……맞지?"
1009105-126 = "(……일단 그렇다고 대답한 뒤, 가게에서 마지막 디저트를 구입했다.)"
1009105-127 = "(가게를 나온 후 잠시 한눈을 파는 사이, 카즈사는 이미 어딘가로 사라져 버렸다.)"
