[translation]
10040050-1 = "제5화;덜컹거리는 캐비닛"
10040050-10 = "하아, 하아……. 하아……. 어떻게든 도착하긴 했군요……."
10040050-11 = "진짜 드론을 부수지 않고 제압할 수 있을 거라고는 생각 못 했는데, 역시 선생님의 지휘!!"
10040050-13 = "고생하셨습니다, 두 사람. 걱정했던 것보다 훨씬 순조로웠습니다."
10040050-14 = "여긴 잘 사용되지 않는 후문 쪽이야. '후문'이라고는 해도, 건물이 커서 몇 개나 되지만……."
10040050-15 = "현재까지 사용된 적이 없는 문들 중에서 고른 것입니다. 아마 들킬 일은 없겠지요."
10040050-16 = "이제 이 문을 열기만 하면……."
10040050-22 = "……?"
10040050-23 = "……음?"
10040050-24 = "문을……. 열면……?"
10040050-32 = "……어라……."
10040050-33 = "……안 됩니다."
10040050-34 = "그게 무슨 말이야, 선배? 안 되다니."
10040050-35 = "잠시만, 나도 해 볼게. 음……."
10040050-41 = "……? 뭐지? 어째서……."
10040050-47 = "……!? 뭐, 뭐야. 코드가 역으로……."
10040050-48 = "……! 추적되고 있습니다, 하레! 당장 끊지 않으면 위치가 특정되고 맙니다!!"
10040050-49 = "그럴 수가……! 안 되겠어. 너무 빨라! 우리보다 위야, 이 사람!!"
10040050-50 = "[s1] \"해킹을 역으로……!?\"\n[s2] \"코타마와 하레보다 실력이 좋다고!?\""
10040050-53 = "선생님, 일단 거기서 빠져나와! 이대로라면 머지않아 그쪽 CCTV까지 복구될 거야!"
10040050-54 = "다른 방법을 찾아봐야 하겠습니다. 정면승부는 무리입니다. 이건 마치……."
10040050-55 = "잠깐. 이 스타일, 이 방식. 분명 전에도 비슷한 기억이……."
10040050-60 = "……! 부부장……이라고!?"
10040050-61 = "두 분 모두, 우선 거기서 나오세요!!"
10040050-63 = "그럴 수가……! 그런 말도 안 되는……!!"
10040050-64 = "어떻게 여기까지 왔는데!! 여기서 돌아가라고요!? 두 분이서 어떻게든 못 하는 건가요!?"
10040050-65 = "분하지만 안 되는 건 안 되는 겁니다!"
10040050-75 = "……빨리!!"
10040050-79 = "[ns3] 코유키의 손을 잡고 빠져나간다.\n[ns4] \"일단 나가자, 코유키!!\""
10040050-82 = "으아아아아아!! 말도 안 돼애애애애-!!!"
10040050-103 = "하아, 하아……. 오늘 대체 얼마나 뛰어야 하는 거예요."
10040050-105 = "방심했어. 생각해 보면 당연한 일이었는데 말이야."
10040050-106 = "네. 치히로는 여러 곳……. 세미나의 보안 시스템도 함께 점검해 주고 있었죠."
10040050-107 = "이슈가 발생했으니, 당연히 원격으로라도 지원할 것이었는데……."
10040050-108 = "……이러면 계획과는 달리, 일이 꽤 복잡해졌습니다."
10040050-109 = "응. 일단 상대방이 부부장인 이상, 해킹으로 정면 승부는 자충수나 마찬가지야."
10040050-111 = "그럼 이제 어떻게 하죠? 이대로 그냥 아침이 될 때까지 꼼짝없이 숨어 있어야 하나요?"
10040050-112 = "아니, 아침이 된다 해도 뭔가 뾰족한 수가 나오는 건 아니잖아요……!? 이대로라면!!"
10040050-114 = "……아니."
10040050-115 = "아예 불가능한 건 아니야. 물론 당장 우리가 부부장과 정면으로 싸울 수는 없겠지만……."
10040050-116 = "정면 승부만이 능사는 아니니까요. 역설적이지만, 여기서는 조금 더 아날로그하게 가야죠."
10040050-117 = "[s5] \"아날로그하게……?\"\n[s6] \"무슨 뜻이야?"
10040050-120 = "부부장이 우리의 상대인 것은 어디까지나 온라인상으로의 이야기야. 원격으로 보안 시스템을 돌리고 있을 터."
10040050-121 = "하지만 아무리 부부장이라도 컴퓨터 시스템이 설치돼 있지 않은 부분까지 제어할 순 없어."
10040050-122 = "예를 들자면 지금처럼 프라이빗한 공간이라 시스템 설치가 안 된 부분이라거나……."
10040050-124 = "……혹은 오래돼서 첨단 설비가 설치되지 않은 구식 시설. 낡고 방치된 길 등이 있겠죠."
10040050-125 = "낡고 방치된 길……? 구식 시설……?"
10040050-126 = "밀레니엄의 중심이라고 할 수 있는 세미나 건물이지만, 역설적으로 그만큼 밀레니엄 내에서는 크고 오래된 건물입니다."
10040050-128 = "계속되는 증축 공사와 확장, 리모델링을 반복한 건물이니만큼 미처 신경 쓰지 못한 초창기의 설비들도 존재한다는 거지."
10040050-129 = "이제는 아무도 안 쓰고 있는 곳이지만……. 그래도 세미나 건물 안에 있는 명백한 '길'."
10040050-130 = "안 그래도 두 사람을 유도하며 루트를 찾고 있었어. 예상대로 몇 개의 길이 존재해."
10040050-131 = "[ns7] \"짧은 사이에 잘도 찾아냈구나.\"\n[ns8] \"대단한걸, 두 사람 모두.\""
10040050-134 = "조금 어둡고 스산한 느낌은 들 수 있겠습니다만……. 지금은 가릴 때가 아니니까요."
10040050-135 = "엑, 더러운 곳은 싫은데. 다른 데는 없어요? 좀 깨끗한 길은?"
10040050-136 = "이왕이면 저 지금 잠옷이니까, 춥지도 않았으면 좋겠고……."
10040050-137 = "아, 중간에 자판기라든가 좀 있으면 더 좋을 거 같네요! 슬슬 출출하기도 하고요!"
10040050-143 = "선생님……."
10040050-144 = "……그 아이, 꼭 데려가야 해?"
10040050-146 = "네에에에에-!?!? 갑자기 그게 무슨 말이에요!? 제가 뭘 했다고!?!?"
10040050-147 = "[s9] \"뭔가 미안. 원래 이런 애라…….\"\n[s10] \"아직 어려서 그래. 양해를…….\""
10040050-150 = "앞으로 마키에게 조금 더 잘 해줘야겠네."
10040050-151 = "아무튼 다른 길은 없어. 오히려 이런 길이 있다는 사실만으로도 감사해야 할 일이잖아."
10040050-152 = "우선……."
10040050-153 = "……잠깐만요."
10040050-154 = "모두 잠시. ……복도 반대쪽에서 소리가 감지되었습니다."
10040050-155 = "이 소리……."
10040050-162 = "……!!! 발소리……!!"
10040050-163 = "모두 숨어요! 누가 다가옵니다!!"
10040050-167 = "바, 발소리!? 발소리라!? 누가 오는 건가요!? 대체 누가……!?"
10040050-168 = "이 상황에서 누구겠어……! 일단 숨으라고!!"
10040050-170 = "어, 어디 숨어요!? 여기 숨을 데가 어딨다고!?"
10040050-171 = "……벽!? 벽!? 벽에 붙을까요!? 이렇게……!?"
10040050-172 = "어림도 없어 보입니다. 그 상태라면 걸리는 건 시간문제예요."
10040050-177 = "으윽……!! 이대로라면……!!"
10040050-178 = "[ns11] \"옆쪽에 뭔가 문이 있어.\"\n[ns12] \"일단 이곳으로 들어가자.\""
10040050-181 = "네, 네!? ……네!!"
10040050-182 = "서둘러야 해요, 시간이 없습니다!"
10040050-183 = "빨리……!!"
10040050-191 = "[ns] 여기는……."
10040050-192 = "아, 탈의실이네요."
10040050-193 = "여기라면 안전하게……."
10040050-198 = "……조용히."
10040050-199 = "문 앞까지 다가왔습니다."
10040050-201 = "……노아? 왜 그래?"
10040050-202 = "……음. 아니요. 별거 아니에요."
10040050-203 = "이상하네요, 이 문……."
10040050-207 = "분명 이 록커룸은 사용한 지 꽤 돼서, 먼지가 쌓여 있었던 거 같은데 말이에요."
10040050-208 = "……!!!"
10040050-209 = "!!!!!!!!"
10040050-210 = "……? 그런가? 나는 잘 모르겠지만……."
10040050-211 = "……후후. 괜한 생각일 수도 있겠네요. 그래도 혹시 모르니……."
10040050-212 = "저는 여기부터, 잠깐 확인하고 갈까요?"
10040050-213 = "이런."
10040050-214 = "뭣……!!"
10040050-215 = "[ns13] 서둘러 빈 캐비닛을 연다.\n[ns14] 코유키를 캐비닛 안으로 끌어당긴다."
10040050-222 = "저 혼자면 될 것 같으니, 유우카 쨩은 다른 곳을 계속 살펴줘요."
10040050-223 = "알았어. 혹시라도 뭐 보면 말해줘, 곧바로 달려올 테니까!"
10040050-224 = "네~. 유우카 쨩도 마찬가지예요."
10040050-228 = "서, 선생님……!? 이건……! 우웁-!!!"
10040050-229 = "[ns15] \"……쉿.\"\n[ns16] 황급히 코유키 입을 막는다."
10040050-240 = "…………!!!"
10040050-241 = "[ns17] (……노아!)\n[ns18] (절대 소릴 내선 안 돼…….)"
10040050-244 = "…………."
10040050-255 = "……아야!"
10040050-256 = "서, 선생님……. 아읏……!"
10040050-257 = "아, 아니……. 잠깐만요, 조금……!"
10040050-258 = "……윽!"
10040050-259 = "자, 잠깐만요……. 너무 좁아……."
10040050-265 = "우웁!? 우우우웁-!?"
10040050-266 = "어, 어쩌다……. 어쩌다 이렇게 된 거죠, 저희……."
10040050-267 = "[ns19] \"……쉿.\"\n[ns20] \"조용히…….\""
10040050-274 = "…………."
10040050-275 = "……음……? ……이상하네요."
10040050-276 = "분명히 제가……."
10040050-277 = "11일 2시간 31분 전에 왔을 때, 마지막으로 본 의자 배치는 이 정도로 붙지 않았었는데."
10040050-278 = "[ns] (어떻게 그걸 기억하는 거야…….)"
10040050-279 = "문고리도 이 정도로 올라가 있지 않았었고 말이죠. 그사이에 온 사람도 없을 건데……."
10040050-284 = "……아하."
10040050-285 = "역시 그사이에 사람이 온 거겠죠, 이건? 분명 그런 거라고밖에는 설명이 안 되겠네요."
10040050-286 = "후후. 재미있어졌네요. 그럼……."
10040050-290 = "조금 살펴볼까요?"
10040050-291 = "[ns] (……!!!!!!!!!)"
10040050-306 = "후후……."
10040050-307 = "……아닌가? 이미 나가셨으려나요?"
10040050-313 = "[ns21] (……갔, 갔나……?)\n[ns22] (노아는……?)"
10040050-322 = "[ns23] (소리가 점점 가까워지고 있어……!?)\n[ns24] (설마 했던 하나씩 확인……!!)"
10040050-329 = "으, 으아아아……!? 이건……! 이건……!!"
10040050-336 = "이건 진짜 망했……!!!"
10040050-349 = "[ns25] (……!!!!!!)\n[ns26] (이제 곧 우리……!!)"
10040050-361 = "[ns27] (……진짜 갔나?)\n[ns28] (……진짜 끝났나?)"
10040050-368 = "……하아아아아아아-!!!"
10040050-369 = "진짜 죽는 줄 알았어요, 여러모로……!!"
10040050-370 = "공포 게임의 한 장면이라고 봐도 무방한 상황이었어. 연출된 순간이라 해도 믿었을 거야."
10040050-371 = "저도 이 정도로 민감하게 귀를 곤두세워 본 적은 없었습니다. 엄청난 경험이었습니다."
10040050-372 = "그래도……. 어떻게든 상황을 넘겼군요."
10040050-373 = "반대로 말하자면 이곳은 이미 한 번 확인한 곳이니, 지금 바로 이동하면 이 주변은 안전하다는 이야기가 됩니다."
10040050-374 = "연락을 받고 떠났으니까. 누가 부른 거라면 아무래도 이 주변에 바로 있지는 않겠지."
10040050-375 = "마음 같아선 해킹으로 정확한 저쪽 상황도 파악하고 싶지만……."
10040050-376 = "역효과일 겁니다. 치히로에게 정면으로 도전하는 거나 다름없는 행동입니다."
10040050-377 = "선배 말대로야. 여기서는 일단 우리 스스로 판단하는 수밖에 없어."
10040050-378 = "……어떻게 할 거야, 선생님?"
10040050-379 = "[s29] \"지금 바로 이동하자.\"\n[s30] \"시간 끌어서 좋을 건 없어.\""
10040050-382 = "역시 그렇겠지. 그래도 길 안내 정도는 해줄 수 있으니까, 우리 지원을 따라 줘."
10040050-383 = "맞습니다. 마지막까지 선생님의 편에서 지원하겠습니다."
10040050-384 = "일단 문을 열고 나가서……."
10040050-386 = "…………."
10040050-387 = "……응?"
10040050-388 = "[s31] \"……코유키?\"\n[s32] \"왜 그래, 갑자기?\""
10040050-391 = "……에? 네?"
10040050-392 = "아, 아뇨. 그냥……. 어……."
10040050-393 = "아무것도 아니에요. 잘 못 봤나 봐요."
10040050-394 = "그냥 뭔가……."
10040050-399 = "뭔가 시선 같은 게 느껴져서 그랬을 뿐이에요……."
