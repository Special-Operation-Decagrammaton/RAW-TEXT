[translation]
10037115-2 = "예"
10037115-4 = "고"
10037115-6 = "편"
10037115-15 = "경극 공연장에서 정확히 무슨 일이 일어난 걸까요? 회장님은 알고 계십니까?"
10037115-19 = "음……. 역시 이 화제는 여기까지!"
10037115-23 = "자, 잠깐만! 억울한 것이다! 연단방은 이번 사태와는 무관한 것이다!"
10037115-24 = "일단은 참고인 조사니까, 동행을 부탁합니다. 야쿠시 사야 부장."
10037115-27 = "'원숭이 손'에 대한 이야기를 알고 있는가, 선생?"
10037115-30 = "[ns1] \"단순하게 이야기하기 어려운 것들이 분명히 있지.\"\n[ns2] \"산해경의 과거들이 그런 것처럼 말이야.\""
10037115-35 = "경극부는 경극을 공연하기 위해 존재하는 동아리입니다."
10037115-38 = "걱정하지 마시라고는 말씀드리지 않겠습니다. 문주님께서는 그러기 어려워하시는 분이니까요."
10037115-39 = "하지만 문주님께서 저를 저버리시는 일은 있을 수 있어도, 제가 문주님을 떠나는 일은 없을 겁니다."
10037115-42 = "나라면 널 낫게 할 수 있다. 키사키."
10037115-43 = "그것도 당연하지. 너를 그렇게 만든 것은."
10037115-47 = "나였으니 말이다?"
10037115-50 = "많은 학생들이 괴로워했고, 많은 학생들이 몸부림쳤다."
10037115-51 = "그런 너를, 나 한 몸의 안식을 위해, 아무런 책임도 없이 다시 받아들여야 하는가?"
10037115-56 = "안녕하세요, 선생님!"
