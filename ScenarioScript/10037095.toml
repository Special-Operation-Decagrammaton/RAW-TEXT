[translation]
10037095-3 = "윽……!"
10037095-9 = "중과부적인가……. 기세에서 밀리는군……!"
10037095-10 = "[s] (미나와 마리나를 따라 몸을 일으킨다.)"
10037095-15 = "[ns] (키사키의 앞을 막아선다.)"
10037095-21 = "……선생?"
10037095-22 = "선생님……?"
10037095-23 = "뭐, 뭘 하려는 것인가, 선생님?"
10037095-24 = "[s1] \"학생들 사이의 의견 충돌에, 지나치게 끼어들면 안 되겠지만.\"\n[s2] \"그래도 지금은, 키사키를 너무 몰아세우지 말았으면 해.\""
10037095-27 = "……그것은 어째서입니까?"
10037095-28 = "[s] (진짜 이유는, 키사키의 상태가 좋지 않기 때문이지만…….)"
10037095-30 = "[ns] \"키사키는, 산해경을 위해 최선을 다하고 있다고 생각하니까.\""
10037095-31 = "관점의 차이라고 말씀하시기에는, 이미 너무 많은 일들이 일어났습니다."
10037095-32 = "이번 사태에 불안함을 보이는 학생도 많았고, 찬성하지 못하겠다는 의견 역시 많았습니다."
10037095-33 = "무엇보다 저희는, 문주님께 올바른 길을 말씀드리고자 하고 있습니다."
10037095-34 = "그러니 선생님. 길을 비켜 주십시오."
10037095-35 = "……아무리 저희라고 해도, '샬레와 적대하는 동아리'라는 오명을 쓰고 싶지는 않으니까요."
10037095-36 = "[s] \"…….\""
10037095-38 = "그 아이들의 말대로 해 주거라. 선생."
10037095-39 = "[s] \"하지만…….\""
10037095-40 = "괜찮다. 저 아이들이 원하는 것은 나이고, 현룡문의 아이들도…… 혼란을 느끼고 있는 것 같구나."
10037095-41 = "후후……. 부원들의 신망을 잃은 문주가, 무엇을 할 수 있겠느냐."
10037095-42 = "자고로 천명은 천심에서 나오는 것. 그리고 천심이란 곧 민심이니."
10037095-43 = "그것을 잃은 나에게…… 이 길 이외에 다른 길은 없을 것이야."
10037095-49 = "듣자 듣자 하니, 못 들어 주겠구나. 정말로!"
10037095-53 = "뭐지?!"
