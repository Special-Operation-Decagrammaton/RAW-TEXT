[translation]
1601002-1 = "마이스터의 은밀한 취미"
1601002-2 = "시바타운 외곽 원단 시장"
1601002-4 = "(샬레 근처의 시장에서 우연히 히비키와 마주쳤다.)"
1601002-8 = "……안녕, 선생님."
1601002-9 = "휴일에 이런 외진 곳에서 선생님을 만나게 되다니 의외네."
1601002-10 = "원단 시장에는 무슨 일로 찾아온 거야?"
1601002-11 = "……샬레의 사무실에 걸어 둔 커튼이 상해서 새 원단을 구입하러 왔다고?"
1601002-12 = "……하긴. 커튼으로 쓸 만큼 커다란 원단을 구할 수 있는 곳은 D.U. 근처에 몇 없으니까."
1601002-13 = "혹시 카모플라쥬 기능이 들어간 원단이 필요하다면 다른 곳을 추천해 줄 수도 있는데……."
1601002-14 = "[s] \"평범한 원단이면 돼.\""
1601002-16 = "[ns] \"히비키는 무슨 일로 온 거야?\""
1601002-17 = "……나 말이야?"
1601002-18 = "나는 새 옷에 쓸 옷감을 구입하기 위해 왔어."
1601002-19 = "색이나 재질만 확인하는 거라면 인터넷으로도 구입할 수 있지만……"
1601002-20 = "몸에 닿는 것이니 촉감도 직접 확인해 보고 싶어서."
1601002-21 = "[s1] \"마이스터는 옷도 직접 만드는 거야?\"\n[s2] \"대단하네, 히비키는.\""
1601002-24 = "물론 평상시에 입는 기성복을 만들려는 건 아니고……."
1601002-25 = "내가 만들려는 건 코스프레용 코스튬이야."
1601002-26 = "[s] \"코스프레……?\""
1601002-27 = "응. 선생님도 코스프레, 좋아해?"
1601002-28 = "[s3] \"코스프레라면 잘 알고 있지.\"\n[s4] \"잘 모르겠는데…….\""
1601002-29 = "……다행이네. 설명을 덜 수 있어서."
1601002-30 = "코스프레는 가상의 캐릭터처럼 의상을 입고 행동을 흉내 내는 일종의 놀이야."
1601002-31 = "가상의 캐릭터가 입는 의상이다 보니 기성품과는 디자인이 크게 다른 경우가 많아서 플레이어가 직접 만드는 경우가 잦거든."
1601002-32 = "처음에는 보행용 더미에 입힐 옷을 만들기 위해 의류 제작 영상을 참고한 것뿐이었는데……"
1601002-33 = "몇 차례 옷을 시험 삼아 만들다 보니, 어느새 푹 빠지게 되었어."
1601002-34 = "[s] \"옷을 만드는 게 즐거운 거야?\""
1601002-35 = "……엄밀히 말하자면 다른 사람이 되어 생각해보는 경험이 즐거운 것이려나."
1601002-36 = "코스프레를 하기 위해서는 옷을 입는 데 그치지 않고, 연기하는 캐릭터처럼 생각하고 행동해야 하거든."
1601002-37 = "평범한 인생을 사는 사람이라면 이세계를 여행하는 모험가나, 복잡한 주문을 연구하는 마법사의 기분 같은 건 생각해 볼 일이 거의 없을 테니까."
1601002-38 = "이런 코스프레 활동은 다양한 가능성을 염두에 두고 실험을 반복하는 엔지니어식 사고에도 도움이 되거든."
1601002-39 = "게다가 평소에 관심이 있었던 직업을 가볍게 대리 체험해 볼 수도 있고……."
1601002-40 = "[s5] \"지난 대운동회 때처럼 말이지?\"\n[s6] \"……치어리더라든가?\""
1601002-45 = "……놀리지 말아줘, 선생님."
1601002-46 = "그때는 시간이 없어서 '치어리더의 기분'을 충분히 상상해보지 못했던 것뿐이야."
1601002-47 = "게다가 그 치어리더 의상은 코스프레를 막 시작했을 때 어설프게 만든 시제품이라, 남들에게 보여주기엔 조금 부끄러워서……."
1601002-48 = "다음번에 다시 치어리더 코스프레를 한다면 분명 더 잘할 수 있을 거야."
1601002-49 = "[s7] \"그 말인즉……\"\n[s8] \"다음번에 또 치어리더 의상을 입을 계획이 있는 거야?\""
1601002-50 = "언제라고 확실히 정해둔 건 아니지만……."
1601002-51 = "언제라고 확실히 정해둔 건 아니지만……."
1601002-52 = "누군가를 응원해야 할 일이 생긴다면…… 다시 입을 수도 있지 않을까?"
1601002-53 = "코스프레에 중요한 건 의상보다 캐릭터에 몰입할 수 있는 적절한 상황이니까."
1601002-54 = "[s] \"그래서 오늘은 어떤 옷을 만들 예정이었어?\""
1601002-55 = "……좋은 질문이야, 선생님."
1601002-56 = "오늘은 인기 애니메이션 <이세계 군수공장>에 등장하는 히로인 캐릭터의 의상을 만들어볼까 하는데……"
1601002-64 = "이 캐릭터는 현대 세계에서 과학자로 일했었기 때문에, 중세풍의 이세계 환경에서도 흰 실험 가운을 입고 다니는 게 특징이야."
1601002-65 = "물론 이세계에는 고분자 합성 기술이 개발되지 않았기 때문에 폴리에스터 혼방 소재의 실험 가운을 입지는 못했을 거야."
1601002-66 = "중세 시대의 기술로 만들 수 있는 섬유라면 아마포로 만든 린넨 원단으로 만들었을 가능성이 높은데……"
1601002-67 = "이곳에서 취급하는 원단은 키 비주얼 일러스트에 비하면 지나치게 표면이 거칠고 가벼운 느낌이 강해."
1601002-68 = "……어떻게 생각해, 선생님? 어떤 소재의 원단을 사용해야 이 캐릭터의 느낌을 더 잘 살릴 수 있을까?"
1601002-72 = "[ns] \"……적당히 비슷한 색을 고르면 되지 않을까?\""
1601002-73 = "안 돼, 선생님. 정확한 고증이야말로 코스프레의 몰입감을 위한 중요한 요소 중 하나니까."
1601002-74 = "게다가 밀레니엄의 마이스터로서 작품을 만드는 데 적당히 타협한다는 건 있을 수 없는 일이야."
1601002-75 = "[s] \"언제나의 히비키 답네.\""
1601002-76 = "음…… 저쪽에 천연 섬유를 전문으로 취급하는 매장이 있는 것 같아."
1601002-77 = "차광이 잘 되는 차분한 색감의 원단도 많으니, 커튼 소재를 찾기에도 좋을 거야."
1601002-81 = "……그럼, 같이 한번 둘러볼까?"
1601002-83 = "(이후, 한동안 히비키와 원단을 고르며 즐거운 시간을 보냈다.)"
