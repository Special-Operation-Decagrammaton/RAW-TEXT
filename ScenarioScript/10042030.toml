[translation]
10042030-1 = "제3화;바이오 해저드"
10042030-3 = "이송 준비 끝났습니다. 부장님."
10042030-4 = "수고하셨습니다."
10042030-5 = "저…… 부장님? 저기, 이런 말씀을 드려도 괜찮을지 모르겠는데요……."
10042030-6 = "저, 오늘 카페에서…… 아까 말씀하셨던…… '그것'을, 본 것 같아요."
10042030-7 = "그것……?"
10042030-11 = "……아. 그 문제의 괴물체 말씀이시군요."
10042030-12 = "?!"
10042030-13 = "(그러고 보니 저분, 기억에 있어……!)"
10042030-14 = "상황을 자세히 들을 수 있겠습니까?"
10042030-15 = "네, 팬케이크 카페에서 친구와 이것저것 주문했었는데요……."
10042030-16 = "갑자기 초록색 점액이 뿌려진 보라색 팬케이크 같은 것이 나타났어요."
10042030-17 = "초록색과 보라색…… 그렇군요."
10042030-18 = "너무 빨라서 자세히 관찰할 수는 없었지만, 지금 생각해 보니 뭔가 촉수 같은 것도 붙어 있었던 것 같기도 한데……. 어쨌든요."
10042030-19 = "총체적으로는 제멋대로 꾸물거리며 튀어 다니다 사라져버렸다는 느낌이었는데요."
10042030-20 = "아무튼 뭔가 이상하고 기분 나쁜 그런 거였어요!"
10042030-21 = "그렇군요. 그 이후의 행선지에 대해서는 아는 바가 없습니까?"
10042030-22 = "네. 이런 곳까지 왔을 거라고는, 예상하지도 못했으니까요."
10042030-23 = "알겠습니다. 지금은 우선 시체…… 부상자를 이송하고, 경과를 지켜봐 주도록 하세요."
10042030-24 = "예, 부장님."
10042030-28 = "아직 알게 된 것보다 모르는 것이 더 많은 상황이기는 합니다만."
10042030-29 = "한 가지는 확실하게 결론을 내릴 수 있을 것 같습니다."
10042030-30 = "저는 이 현상을 이대로 두고 볼 수 없습니다."
10042030-31 = "[s1] \"뭔가 SF영화의 박사 같은 말이네.\"\n[s2] \"닥터 세나……입니까? 지금은?\""
10042030-34 = "닥터……?"
10042030-35 = "닥터라는 표현은 여러 의미를 내포하고 있습니다만, 여기서는 저의 판단을 신뢰해 주신다는 의미이겠군요."
10042030-36 = "감사합니다. 기쁘게 받아들이겠습니다."
10042030-37 = "덧붙여서, 개인적으로 이 현상에서 약간이지만 호기심을 느끼고 있습니다."
10042030-38 = "적어도 불량배들을 응급의학부 차량에 던져 넣는 것보다는, 조금 더 그렇군요."
10042030-39 = "그러면…… 어떻게 하실 생각인가요. 선배님?"
10042030-40 = "이 흔적을 추적하겠습니다."
10042030-41 = "괘, 괜찮으시겠어요……? 이미 한 분이 당했는데……."
10042030-42 = "네. 재미있을 것 같습니다."
10042030-44 = "재미……?"
10042030-45 = "이게 재미있는 일인가요……."
10042030-46 = "그러게 말입니다. 저 역시 웬만해서는 그 표현을 사용할 일이 없다고 생각했습니다만."
10042030-47 = "지금은 그 표현 외에는 제 기분을 나타낼 단어가 없을 것 같습니다."
10042030-48 = "[s3] \"그렇지만 이오리도 당했는데…….\"\n[s4] \"우리도 조금 진지해져 보는 게…….\""
10042030-51 = "안심하세요. 저는 이미 충분히 재미있…… 실례. 진지합니다."
10042030-52 = "(어디가…….)"
10042030-53 = "그러면 추적을 시작하도록 하죠. 앞장서겠습니다."
10042030-56 = "[ns] \"뭔가…… 엄청난 광경이네.\""
10042030-57 = "복도 여기저기에, 초록색 점액이 묻어 있어……."
10042030-58 = "거기에 나아갈수록 그 양이 많아져 가는 느낌입니다."
10042030-59 = "느낌이 아니에요. 치나츠. 명백하게 늘어나고 있습니다."
10042030-60 = "그, 그럼 어떻게 되는 거죠?! 그게…… 뭘 의미하는 건가요!?"
10042030-61 = "지금으로서는 아무것도 알 수 없습니다. 주리. 우리는 그저 나아갈 뿐이죠."
10042030-62 = "그렇지만, 점점 더 흥미로워지는군요."
10042030-63 = "그러니까 흥미 같은 단어가 나올 일이 아니라고……."
10042030-64 = "으…… 으으……."
10042030-65 = "……! 신음 소리가……?"
10042030-66 = "그렇군요. 다음번 시체…… 단서…… 아니, 희생자일 것 같군요."
10042030-71 = "세, 세나 씨?! 같이 가요~!"
10042030-81 = "으으으, 으으……."
10042030-85 = "[ns] \"괘, 괜찮아? 어떻게 된 거야!\""
10042030-86 = "저쪽…… 교실에…… 있었는데……. 뭔가, 이상한 소리가 들려서……."
10042030-87 = "잠시, 상황을 보고 오려고…… 별일 있겠냐고…… 그래서……."
10042030-93 = "[ns5] \"정말 완벽한 플래그다…….\"\n[ns6] \"놀랄 만큼 복선에 충실하네…….\""
10042030-96 = "선생님, 또 아까처럼 이해할 수 없는 말씀을……."
10042030-97 = "정해진 수순이라는 겁니다. 다른 말로 클리셰라고도 하죠."
10042030-98 = "……아시겠습니까?"
10042030-99 = "일단 요만큼도 진지하지 않다는 건 알겠어."
10042030-100 = "뭔가, 죄송합니다. 저의 전 선배라서……."
10042030-101 = "일단은 이 경우 역시, 이오리의 증례와 유사해 보입니다. 차이점이 하나 있다면……."
10042030-102 = "그때와 비교해서, 점액의 양이 두 배는 늘어나 있다는 것 정도로군요."
10042030-104 = "두, 두 배요?"
10042030-105 = "흔적이 저쪽으로 이어지고 있어."
10042030-106 = "갑시다. 흔적이 가리키는 방향은 교실입니다."
10042030-113 = "이, 이건 뭐지!?"
10042030-114 = "우와아……."
10042030-118 = "점액의 강도가 증가했군요. 사람 한 명을 벽에 붙여 고정시킬 수 있을 정도로요."
10042030-119 = "물론 그 양도 더더욱 증가했습니다."
10042030-123 = "여기에서 한 가지 확인해 두고 싶은 것이 있습니다. 그것의 처음 크기는 어느 정도였나요?"
10042030-124 = "네……? 그, 그야. 일반적인 팬케이크 정도의, 크기였는데요……?"
10042030-125 = "그렇군요. 일반적인 팬케이크. 알겠습니다. 그렇다면 여러분."
10042030-126 = "이것이 일반적인 크기의 팬케이크에서 흘러나온 소스의 양으로 보이십니까?"
10042030-127 = "[s] \"그건 확실히 아닌 것 같아.\""
10042030-128 = "네. 조금 전 복도에서 발견한 시체…… 증례…… 희생자도, 이오리에 비해서는 더욱 많은 점액으로 뒤덮여 있었습니다."
10042030-129 = "즉, 이 시점에서 내릴 수 있는 결론은 하나뿐입니다."
10042030-130 = "……'그것'은 스스로 점점 커지고 있습니다."
10042030-131 = "!!!"
10042030-132 = "[ns7] \"이렇게 짧은 시간에……?\"\n[ns8] \"질량 보존의 법칙은 어디로……?\""
10042030-135 = "……."
10042030-136 = "선생님. 애초에 지금 이 사태 자체가 말이 된다고 생각하십니까?"
10042030-137 = "[s9] \"그, 그건……\"\n[s10] \"반박할 수 없네…….\""
10042030-140 = "네. 이런 경우에 중요한 것은, 정합성을 따지는 일이 아닙니다."
10042030-141 = "규칙과 법칙, 일반적으로 그렇게 될 것이라고 보여지는 상식을 따지는 일이 아니죠."
10042030-142 = "중요한 것은, 일어나고 있는 현상을 있는 그대로 인정하고."
10042030-143 = "이 뒤에 무슨 일이 이어질지를 호기심 넘치는 마음으로 관찰…… 이 아니라 추적하고 대비하는 것입니다."
10042030-147 = "!!!"
10042030-148 = "근처 교실입니다. 서두르죠."
10042030-157 = "[ns] \"이, 이건……!?\""
10042030-158 = "어, 어떻게 이런 일이……."
10042030-159 = "여러 의미로 굉장하네, 정말."
10042030-163 = "이로써 확실해졌습니다. 그것은 습격을 거듭할수록 거대해지고 있으며."
10042030-164 = "그걸 이대로 두었다가는, 게헨나 전체가……."
10042030-165 = "어딘가의 '너구리 시티'처럼 되어 버릴 수도 있을 겁니다."
10042030-166 = "너구리…… 시티요?"
10042030-170 = "[ns11] \"너구리 시티……? 그게 뭐야?\"\n[ns12] \"……아. 거기라면…….\""
10042030-171 = "……모르고 계시는 건가요. 알겠습니다."
10042030-172 = "정체불명의 실험으로 괴물들이 창궐하게 된 도시……"
10042030-173 = "……가 나오는 게임 이름입니다."
10042030-174 = "알고 계시는군요. 선생님."
10042030-175 = "그렇다면 이 전개가 무엇을 의미하는지도, 충분히 짐작할 수 있으실 테죠."
10042030-176 = "이야기를 꺼내는 타이밍이 어긋난 것 같기는 합니다만."
10042030-177 = "사실 이 현상에 대해서는 사실 어느 정도 들은 바가 있었습니다. 개체의 출현 자체는 처음도 아니었고 말이죠."
10042030-178 = "물론 그것이 이렇게까지 흥미로운…… 실례. 엄청난 것이라고는 생각하지 못했습니다만."
10042030-179 = "네?! 아, 알고 계셨다고요? 그걸요!?"
10042030-180 = "물론 지나가는 소문이나 괴담, 낭설 같은 것이었습니다만."
10042030-181 = "암암리에 떠도는 이야기가 있었죠. '그 급양부에는 괴물이 살고 있다!' 라는 이야기가요."
10042030-182 = "무슨 소리야! 영문을 모르겠어!"
10042030-183 = "저는 그런 소식들을 그냥 지나칠 수 없는 성격이었으므로, 기억하고 있었습니다만……."
10042030-184 = "그러한 저의 기억에 기초해 볼 때, 작금의 현 상황은."
10042030-185 = "일반적으로 발생한 상황 때보다, 월등히 치명적이고 대규모인 사태일 것으로 추정됩니다."
10042030-186 = "네에?!"
10042030-187 = "[ns13] \"대규모……!?\"\n[ns14] \"치명적……!?\""
10042030-190 = "네. 그렇지 않다면 이렇게나 흥미……"
10042030-191 = "……무서운 일을, 저지르고 돌아다닐 리 없을 테니까요."
10042030-192 = "그, 그런……!"
10042030-193 = "그러면 저 때문에 게헨나의 모두가……!!"
10042030-194 = "……? 음? 아뇨. 그건 아닙니다. 사실 전체적으로 보면 별것 아닌 일이죠."
10042030-195 = "기껏해야 다들 소스가 너무 맛없어서 정신을 잃은 것뿐이니까요."
10042030-196 = "통계적으로 두세 달에 한 번쯤은 생기는 수준이겠군요. 이 정도의 사고는."
10042030-197 = "온천개발부나 다른 테러 단체의 문제에 비하면……. 그다지 큰일이라 보기 어렵습니다."
10042030-198 = "그건 정말 다행이긴 하지만, 저에게는 왠지 아주 약간 슬픈 말씀이네요~!"
10042030-199 = "온천개발부가 언급된 시점에서 보통 일은 아닌 것 같지만……."
10042030-200 = "……하아."
10042030-201 = "어쩔 수 없네요. 이 방법만은, 정말로 최후의 최후까지 아껴 두려고 했는데."
10042030-202 = "[s15] \"뭔가 방법이 있는 거야?\"\n[s16] \"최후의 최후……?\""
10042030-205 = "계획…… 이라고 할까요. 달리 말하면 브로큰 애로우라고 할까요."
10042030-206 = "하지만, 네. 사태는 해결해야겠지요. 더군다나 이 일이 만마전의 귀에도 들어가기라도 한다면……"
10042030-207 = "그때야말로 저희 선도부에게 있어서…… 크나큰 문제가 생기는 것일 테니까요."
10042030-209 = "게헨나 선도부실"
10042030-212 = "네. 무슨 일이죠? 지금 바쁘니까 용건은 간단히."
10042030-217 = "……네?"
10042030-218 = "아니, 그건 또 뭔……."
