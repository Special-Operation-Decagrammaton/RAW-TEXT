[translation]
1002602-1 = "도움 요청"
1002602-2 = "(일단은 부탁대로 네루의 방을 찾아갔다.)"
1002602-8 = "(네루는 여전히 입는 방법을 몰라 이상한 상태로 옷을 걸치고 있었다.)"
1002602-9 = "아이, 대체 뭘 어떻게 하는 거야. 거의 다 된 거 같긴 한데……."
1002602-10 = "……아. 왔냐. 한참 늦었잖……."
1002602-11 = "……응?"
1002602-12 = "[s] \"……?\""
1002602-13 = "……? 뭐야, 선생……?"
1002602-17 = "뭐, 뭐야!? 선생!?"
1002602-18 = "언제 왔어!? 아니, 그 이전에 왜 선생이 여기 있어!?"
1002602-19 = "이게 뭐 하는 짓이야!? 말도 없이 갑자기 찾아오다니!!"
1002602-20 = "……뭐?"
1002602-21 = "내가 불러서 왔다고? 그게 무슨 소리야? 난 그런 적 없는데!?"
1002602-22 = "[s1] \"사진까지 보냈는 걸. 여기…….\"\n[s2] 모모톡 대화를 보내준다."
1002602-28 = "으, 으응? 이건 또 무슨……."
1002602-30 = "……아."
1002602-31 = "잘못 보냈다."
1002602-32 = "잘못 보냈잖아?"
1002602-33 = "이게 왜 선생한테 간 거야!!"
1002602-34 = "사, 사진! 사진 지워! 빨리 이 사진 지워, 선생!!!"
1002602-35 = "으, 으응? 괜찮다고? 아니, 이쪽이 안 괜찮은데?"
1002602-36 = "사진은 또 왜 이렇게 우스꽝스럽게 찍힌 거야? 크윽……. 진짜……."
1002602-37 = "……응? 뭐라고?"
1002602-38 = "바니걸 입는 법……. 가르쳐 줄 수 있다고? 선생이?"
1002602-39 = "……?"
1002602-40 = "어……. 어어? 진짜? ……왜?"
1002602-41 = "왜 선생이 그런 걸 알고 있는 거야? 혹시 입어 본 적이 있는 거야, 선생?"
1002602-42 = "[s3] \"필요할 거 같아서 좀 찾아 봤어.\"\n[s4] \"이런 게 바로 교양 아니겠습니까.\""
1002602-43 = "으, 으응……? 그, 그런 걸로 대답이 되는 건가, 이거……?"
1002602-44 = "으, 으응……? 그, 그런 걸로 대답이 되는 건가, 이거……?"
1002602-45 = "크하하. 아무려면 어때. 좋아. 결과적으로는 잘 된 것 같군."
1002602-46 = "그럼 좀 부탁하지. 우선 다시 입어야 되니까 벗고……."
1002602-47 = "……? 응? 선생, 왜 그래?"
1002602-48 = "뭐? 아직 벗지 말라고? 방법만 가르쳐 줄 테니 알아서 하라고?"
1002602-49 = "……왜?"
1002602-50 = "뭐, 상관이야 없지만 왜 굳이……."
1002602-52 = "……아."
1002602-53 = "…….흐, 흠흠. 알았어."
1002602-54 = "밖에서 기다려, 선생. 다 갈아입으면 부를 테니까."
1002602-55 = "[s] 방법을 알려준 후, 잠시 밖으로 나간다."
1002602-61 = "(그렇게 잠시 방 밖에서 네루의 대답을 기다렸다.)"
1002602-65 = "……다 됐어, 선생. 이제 다시 들어와."
1002602-72 = "음. 확실히 괜찮네. 원래는 이렇게 입는 옷이었구만!"
1002602-73 = "생긴 게 좀 이상해도 활동성은 좋고……. 오히려 평상시에 입던 메이드복보다 나은 거 같기도 한데."
1002602-74 = "결과적으로 선생을 부르는 게 정답이었나 보군. 크하하."
1002602-75 = "으음. 그런데 뭔가 좀……. 아직도 신발 쪽은 영 불편한데……."
1002602-76 = "하이힐이라고? 원래 이런 신발인가?"
1002602-81 = "아야, 아야야……."
1002602-82 = "이거 이대로는 못 신겠는데, 원래 이런 건가?"
1002602-83 = "……응? 맞다고? 진짜 이런 거라고?"
1002602-84 = "참 나. 대단들하구만. 잘도 이런 걸 신고……."
1002602-85 = "뭐, 그래도 덕분에 방법은 정확하게 알았네. 감사를 표해야겠지."
1002602-91 = "고마워, 선생."
1002602-92 = "……응?"
1002602-93 = "필요하면 언제든지 또 이야기 하라고?"
1002602-94 = "……가능하면 사진도 첨부하고?"
1002602-95 = "……풋."
1002602-96 = "크하하."
1002602-97 = "뭐, 도움도 받았으니 이번엔 그냥 넘어가도록 하지."
