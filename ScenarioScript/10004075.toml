[translation]
10004075-1 = "제7화;교관의 책임"
10004075-2 = "우으…… 재난이었던 것이다……."
10004075-3 = "설마 거기서 발키리 경찰학교의 학생이 나타날 줄이야……."
10004075-4 = "건방진 꼬맹이 녀석, 변명도 해주지 않고 시치미를 떼다니! 그 때문에 나님과 선생이 어린 소녀를 힘으로 억누르려 했다는 엉뚱한 오해를 사고 말았잖아!"
10004075-5 = "[s] \"힘으로 억누르려 했던 건 사실이지만…….\""
10004075-6 = "안 되겠어. 이대로 가다가는 정말 슌이 통제할 수 없는 천방지축의 꼬마가 되어버릴 것이다."
10004075-7 = "이렇게 된 이상 더 강력한 마비약을 준비해야……."
10004075-8 = "[s1] \"마비약은 이제 괜찮아.\"\n[s2] \"내가 슌과 직접 이야기 해볼게.\""
10004075-9 = "말로 설득하려고? 지금의 어려진 슌은 제대로 이야기를 들으려 하지도 않을 텐데."
10004075-10 = "말로 설득하려고? 지금의 어려진 슌은 제대로 이야기를 들으려 하지도 않을 텐데."
10004075-11 = "게다가 선생 혼자 갔다가는 또 슌의 장난에 휘말리고 말게 분명한데……"
10004075-12 = "……애초에, 오늘은 나님과 어울려 주기로 약속한 날이었으면서."
10004075-13 = "[s3] \"오늘은 이해해줘, 사야.\"\n[s4] \"계획했던 외출은 다음번에 벌충할게.\""
10004075-21 = "……하는 수 없지. 선생과의 외출을 기대하고 있었던 건 나님 뿐이 아닌 것 같으니까."
10004075-22 = "대신 다음 번 외출 때에는 홍유를 잔뜩 넣은 도삭면을 곱배기로 사줘야 해!"
10004075-23 = "[s] \"약속할게.\""
10004075-24 = "후-후-후. 그럼 오늘의 실험은 여기서 종료하도록 할까."
10004075-25 = "……부디 우리 산해경의 못미더운 교관을 잘 부탁하는 것이다."
10004075-29 = "[ns] 사라진 슌을 찾아 이동한다."
10004075-34 = "……모두 다 미워요."
10004075-35 = "말 안 듣는 매화원 아이들도 밉고, 자기 일을 남에게 떠맡기는 코코나 쨩도 밉고…… 저에게 억지로 약을 먹이려는 선생님도 미워요!"
10004075-36 = "왜 다들 저를 괴롭히지 못해서 안달인 건가요!"
10004075-37 = "[s] \"슌을 괴롭힐 생각은 아니었어.\""
10004075-39 = "서, 선생님?!"
10004075-40 = "또 어느 틈에 오신 건가요?"
10004075-42 = "말하지 않아도 알아요. 어차피 제게 그 해독제를 먹이러 오신 거죠?"
10004075-43 = "선생님이 무어라 말해도 듣지 않을 거예요. 원래의 모습으로는 절대로 돌아가지 않을테니까요!"
10004075-44 = "[s] \"어째서 원래의 모습으로 돌아가고 싶지 않은 거야?\""
10004075-45 = "그야 당연하죠! 나이 든 몸은 거추장스럽기만 하니까요!"
10004075-46 = "피부는 거칠고, 조금만 뛰어도 숨이 차고, 움직일 때마다 어깨가 결리고……."
10004075-47 = "……다들 책임을 지우려 하고."
10004075-48 = "매화원의 교관들에게는 현룡문의 간부들도 함부로 대할 수 없을 정도의 막대한 특권이 주어지지만, 또 그만큼의 책임이 따르기도 해요."
10004075-49 = "아이들이 깨어나서 잠들 때까지 한시도 눈을 떼지 못하는 것은 물론이고, 사고라도 터지면 뒷수습을 하느라 정작 제 수업을 듣지 못하는 때도 있으니까요."
10004075-50 = "……저는 이 책임에 지쳤어요. 아이들을 돌보는 건 조금도 즐겁지 않아요."
10004075-51 = "[s] \"정말로 그렇게 생각해?\""
10004075-52 = "물론이에요. 오늘 하루 어린 아이처럼 살아보니 얼마나 편했는 지 몰라요."
10004075-53 = "선생님도 어른이니 아시지 않나요? 아이를 돌본다는 것이 얼마나 힘든 일인지를."
10004075-54 = "예를 들것도 없이, 선생님께서도 오늘 하루, 저를 돌보시느라 아주 성가셨겠지요. 책임을 진다는 건 언제나 그래요."
10004075-55 = "[s] \"나는 오늘 슌이 나를 의지해줘서 굉장히 기뻤어.\""
10004075-56 = "네? 성가신 게 아니라…… 기쁘셨다고요?"
10004075-57 = "입에 발린 소리는 그만두세요. 공연한 말썽에 휘말리는 게 즐거울 리가 없잖아요!"
10004075-58 = "사야 양과 계획했던 약속도 지키지 못하고, 예상외의 비용을 잔뜩 쓰고…… 심지어 경찰에게 오해를 사 심한 일까지 당할 뻔 하셨으면서……."
10004075-59 = "그런데 뭐가 즐거우셨단 말인가요?"
10004075-60 = "[s] \"슌의 미소를 볼 수 있었으니까.\""
10004075-61 = "미소……."
10004075-62 = "미소가 무슨 상관인가요? 미소가 문제를 해결하는 데 도움이 되는 것도 아니잖아요!"
10004075-63 = "어린아이의 미소 같은 건 일 하는 데 조금도 도움이 되지 않는다고요!"
10004075-64 = "조금도, 조금도……."
10004075-65 = "[s5] \"슌도 사실은 알고 있었던 거지?\"\n[s6] \"어린 아이의 천진한 미소는 그 무엇과도 바꿀 수 없는 보물이라는 것을.\""
10004075-66 = "……."
10004075-67 = "……."
10004075-68 = "……약의 부작용 탓이라지만, 저는 아이들을 귀찮다고 생각했어요."
10004075-69 = "언제나 저를 믿고 따르는 천사 같은 아이들을 내버리고 교관의 의무에서 도망쳤어요."
10004075-70 = "그런 저에게…… 이런 부족한 저에게……"
10004075-71 = "아직도 아이들을 책임질 기회가 남아있을까요?"
10004075-72 = "[s] \"매화원 원생들에게는 아직도 슌이 필요해.\""
10004075-73 = "……어째서 그렇게 확신하시는 건가요?"
10004075-74 = "[s] \"저기를 봐.\""
10004075-75 = "……네?"
10004075-80 = "코코나 쨩~ 슌 언니는 어디에 간 거야~"
10004075-81 = "코코나 쨩이 해주는 저녁밥은 먹기 싫어! 이상한 맛이 난단 말이야!"
10004075-82 = "그러니까, 코코나 쨩이 아니라 코코나 교관이라고 부르라니까!"
10004075-83 = "저녁밥은…… 어쩔 수 없잖아! 나는 슌 언니만큼 요리에 익숙하지 않으니까……."
10004075-84 = "오늘은 조금 맛이 없더라도 그냥 참고 먹어주면 안될까?"
10004075-85 = "싫어! 나는 슌 언니가 해주는 밥이 먹고 싶단 말이야!"
10004075-86 = "빨리 가서 슌 언니를 데려와~ 으앙~"
10004075-87 = "자, 잠깐. 울지 마! 그렇게 떼를 써도 안되는 건 안되는 거라고!"
10004075-88 = "정말이지. 울고 싶은 건 나인데……."
10004075-89 = "언니는 언제 돌아오는 거야…… 으앙……."
10004075-95 = "……하아."
10004075-96 = "정말 내버려둘 수 없는 아이들이네요."
10004075-97 = "선생님, 죄송하지만 지금이라도 약을 받을 수 있을까요?"
10004075-103 = "[ns] 슌에게 해독제를 건네준다."
10004075-104 = "감사합니다."
10004075-105 = "……오늘은 정말 폐만 끼쳤네요."
10004075-115 = "우으…… 언니, 돌아오기만 해봐. 가만두지 않을 테니까!"
10004075-120 = "어머나? 우리 코코나 쨩이 언니에게 무슨 짓을 저지르려고 하는 걸까요?"
10004075-121 = "어, 언니? 어느 틈에 돌아온 거야?"
10004075-122 = "네, 네~ 슌 언니랍니다~ ♥"
10004075-123 = "아무리 괴로운 일이 있다고는 하지만 매화원의 교관이 아이들 앞에서 눈물을 보이다니. 코코나 쨩도 아직 한참 멀었네요."
10004075-124 = "우, 울지 않았거든!"
10004075-125 = "그보다 오늘은 어디에 갔었던 거야! 언니가 없어지는 바람에 내가 아이들 간식도 준비하고, 저녁 준비도 해야 했잖아!"
10004075-126 = "간식 준비는 원래부터 코코나 쨩의 일이었던 것 같지만……."
10004075-127 = "……그래도 갑자기 사라져서 정말 미안해요."
10004075-128 = "대신 다음에 코코나 쨩이 좋아하는 바겐다즈의 캐러멜 모찌 아이스크림을 사줄게요!"
10004075-129 = "씨이…… 아이스크림 한 개로는 모자란 것 같지만……."
10004075-130 = "……특별히 언니니까. 이번은 봐줄게."
10004075-131 = "슌 언니, 어디에 갔었던 거야!"
10004075-132 = "코코나 쨩의 저녁밥은 맛없다구~ 빨리 새로 만들어줘~"
10004075-133 = "어허! 아무리 그래도 코코나 쨩이 열심히 만들어 준 저녁밥인데, 그렇게 말하면 안 되죠!"
10004075-134 = "하지만 오늘은 제가 늦은 탓도 있으니, 후식으로 맛있는 팬케이크를 만들어 드릴게요!"
10004075-135 = "와아! 슌 언니, 최고!"
10004075-136 = "자, 여러분. 그럼 지금부터 다같이 저녁을 먹으러 갈까요?"
10004075-137 = "네에~!"
10004075-145 = "……생각해보니 작별 인사를 깜박한 것 같아서요."
10004075-146 = "오늘은 감사했습니다."
10004075-147 = "[s] \"잘 가, 슈에링.\""
10004075-151 = "……네, 선생님."
10004075-153 = "(이후, 공원의 벤치에 앉아 슌의 모습이 보이지 않을 때까지 계속 지켜보았다.)"
