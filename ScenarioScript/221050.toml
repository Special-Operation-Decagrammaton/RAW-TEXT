221050-1 = "#title;제5화;나이 든 고양이, 새미"
221050-2 = "1;가짜 총학생회장;01\n5;미나토;01\n#5;a\n#1;a\n#1;h\n#5;h\n#wait;1500"
221050-3 = "[ns] \"장난감……?!\""
221050-4 = "5;미나토;03;네, 고양이들은 움직이는 물건을 좋아하니까요.\n#5;em;[반응]"
221050-5 = "5;미나토;02;하지만 천이나 고무로 된 공을 주면 발톱이나 이빨로 찢을 수도 있으니까, 잘 끊어지지 않는 로프로 공을 만들어 주었지요."
221050-6 = "#st;[0,0];instant;1;"
