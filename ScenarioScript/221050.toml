221050-9 = "3;아미;18\n#3;em;[한숨]\n#3;greeting\n#3;a\n#wait;1500"
221050-10 = "3;아미;05;이 말썽꾸러기…… 벌써 오늘만 해도 몇 번이나 손님 앞에서 흉한 모습을 보이는 거야?"
221050-11 = "4;투명;01\n#4;hide\n#4;h\n#na;새미;냐아~"
221050-12 = "#st;[0,0];instant;1;"
221050-14 = "3;아미;05\n#3;d\n#wait;1000"
221050-15 = "1;가짜 총학생회장;01\n5;미나토;02\n#5;a\n#1;a\n#1;h\n#5;h\n#wait;1500"
221050-16 = "1;가짜 총학생회장;99;……그렇군요. 구조 신호가 아니라 단순한 장난감이라니 다행입니다만."
221050-17 = "1;가짜 총학생회장;04;그럼 이 공에 적힌 S.O.S. 라는 글자는 무슨 뜻인가요?"
221050-18 = "1;가짜 총학생회장;04\n3;아미;00;Sammy, O Spoudeios…… 즉, '나이 든 고양이, 새미' 라는 새미의 애칭입니다.\n#3;em;[반응]\n#3;a"
221050-19 = "5;미나토;02\n3;아미;02;보통 함내에서 쓰이는 물건에 오해를 살 수 있도록 <S.O.S> 라는 표기를 하는 경우는 거의 없습니다만, 고양이의 장난감이기도 했고……"
221050-20 = "5;미나토;02\n3;아미;07;또 우연히 바다에 빠진 그 공이 누군가의 손에 들어갈 거라고는 생각지도 못해서……\n#3;em;[땀]"
221050-21 = "5;미나토;02\n3;아미;00;의도치 않게 심려를 끼쳐드려 대단히 죄송합니다."
221050-22 = "1;가짜 총학생회장;01\n5;미나토;02\n3;아미;00\n#1;h\n#3;h\n#5;h"
221050-23 = "[ns] \"아냐. 표류된 사람이 없다면 좋은 일이지.\""
221050-24 = "#st;[0,0];instant;1;"
221050-26 = "1;가짜 총학생회장;01\n5;미나토;02\n3;아미;00\n#1;h\n#3;h\n#5;h\n#1;d\n#3;d\n#5;d\n#wait;1500"
221050-27 = "[ns1] \"이 아이가 그 공의 주인이란 말이지.\"\n[ns2] \"귀여운 말썽꾸러기네.\""
221050-32 = "4;투명;01\n#na;새미;그릉, 그르릉……"
221050-33 = "#st;[0,0];instant;1;"
221050-35 = "5;아미;02;처음 본 사람에게 이렇게 턱을 내어주다니, 배알도 없는 녀석이라니까요.\n#5;a"
221050-36 = "5;아미;99;……하지만 그 덕분에 오디세이아의 학생들에게 두루 사랑받는 것이겠지만.\n#fontsize;50"
221050-37 = "1;가짜 총학생회장;09;후후, 귀여워라……\n#1;a\n#1;em;[음표]"
221050-38 = "1;가짜 총학생회장;02;그나저나 애칭을 나이 든 고양이— 라고 지을 정도면, 꽤 나이가 있는 고양이인가 보네요?"
221050-39 = "1;가짜 총학생회장;02\n5;미나토;99;예. 정확한 나이는 알 수 없습니다만……"
221050-40 = "5;미나토;02;최소한 기록에 나온 것만 따져보더라도 최소 15살은 넘지 않았을까요?\n#5;em;[?]"
221050-41 = "1;가짜 총학생회장;02\n5;미나토;02\n#1;h\n#5;h"
221050-42 = "[ns] \"고양이 치고는 꽤 나이가 많네.\""
221050-43 = "5;미나토;01;네. 사람 나이로 치면 일흔에 가까운 노령묘입니다."
221050-44 = "5;미나토;03;여전히 학생들 앞에서는 아기처럼 굴고 있지만요."
221050-45 = "4;투명;01\n#4;hide\n#4;h\n#na;새미;야옹……"
221050-46 = "1;가짜 총학생회장;02;어쩐지 학원을 돌아보는 내내 학생들이 모두 이 고양이를 알아보는 것 같더니, 기분 탓이 아니었군요."
221050-47 = "1;가짜 총학생회장;01;혹시 배에서 고양이를 키우는 것도 오디세이아의 전통 중 하나인가요?"
221050-48 = "5;미나토;01;네. 오디세이아 학원에서는 [ruby=Ship Cat]'함재묘'[/ruby]라 해서 일종의 마스코트 애완묘를 기르는 풍습이 있답니다.\n#5;em;[반응]"
221050-49 = "5;미나토;99;유래는 먼 옛날, 방역 시설이 제대로 갖춰지지 않아 선내에 쥐가 돌아다녔을 때. 쥐 잡이 용 고양이를 들인 게 유래라고 하는데……"
221050-50 = "5;미나토;01;배 안에서 고양이를 만나는 건 선원들에게 길조로 여겨지기 때문에, 학생들의 사기나 스트레스 관리 등을 위해 학원에서는 여전히 고양이를 키우고 있습니다."
221050-51 = "4;투명;01\n#4;h\n#4;hide\n#na;새미;그릉, 그르릉……"
221050-52 = "5;미나토;03;마침 이야기가 나왔으니, 아까 들려드리지 못했던 새미의 이야기를 계속할까요."
221050-54 = "3;미나토;01;방금 말씀드린 것처럼 새미는 15살에 가까운 노령묘입니다.\n#3;a"
221050-55 = "3;미나토;99;듣기로는 전전 함장이 학원에 막 입학했을 때도 올림포스 호의 갑판을 뛰어다니고 있었다 하니, 사실상 이 학원에서 가장 경험이 많은 선원인 셈이지요."
221050-56 = "3;미나토;16;사실…… 총학생회장님이 회항 요청을 하기 전부터 저희는 새미 때문에 D.U.로 돌아가야 할 지 고민하고 있었답니다."
221050-57 = "3;미나토;16\n1;가짜 총학생회장;04;새미에게 무슨 문제가 있나요?\n#3;m5\n#1;a\n#1;em;[?]"
221050-58 = "3;미나토;17;여전히 새미는 기운이 넘치긴 하지만, 최근 노화로 인한 이상 증세를 보이기 시작했거든요."
221050-59 = "5;미나토;17\n3;아미;02;함 내 의무실장인 후나모리 양의 진단에 의하면 혈압도 꽤 높아졌고, 관절염 증상도 있다고 합니다.\n#3;a"
221050-60 = "3;아미;00;지금도 왼쪽 뒷다리가 불편한지, 걸을 때 마다 다리를 어색하게 절고 있거든요."
221050-61 = "5;미나토;06;워낙 건강해 보여서 그동안은 걱정을 하지 않았는데, 최근 몇 달 전부터 자꾸 갑판에서 넘어지거나 기침을 하는 일이 많아서……"
221050-62 = "1;가짜 총학생회장;04\n3;아미;00\n5;미나토;06\n#1;h\n#3;h\n#5;h"
221050-63 = "[ns] \"고양이를 치료하기 위해서 D.U.로 오려고 했던 거야?\""
221050-64 = "5;미나토;02;아뇨. 아무리 그래도 고양이 때문에 학원 선단 전체를 돌릴 필요는 없었습니다.\n#5;m3\n#3;dl\n#1;dl"
221050-65 = "5;미나토;01;정 문제가 있다면 새미만 트라이던트의 고속정에 태워 돌아오는 것도 가능했고요."
221050-66 = "5;미나토;99;다만 고양이의 건강, 그 이상으로 신경 쓰이는 부분이 있었다면……"
221050-68 = "#st;[0,0];instant;1;"
221050-70 = "#na;가짜 총학생회장;바다의 금기, 때문인가요?"
221050-71 = "3;가짜 총학생회장;07\n#3;a"
221050-72 = "3;가짜 총학생회장;07\n#wait;1000"
221050-73 = "3;미나토;02\n#3;em;[…]\n#wait;2500"
221050-74 = "3;미나토;14;……네."
221050-75 = "3;미나토;02;뱃사람의 미신 중에는 고양이와 관련된 이야기가 많습니다."
221050-76 = "3;미나토;15;고양이가 기분이 좋을 때는 길한 일이 생기지만, 반대로 고양이의 상태가 나쁠 때는 불운한 일이 생긴다고 하지요."
221050-77 = "3;미나토;15;예를 들어 고양이가 넘어지는 것을 목격하면 불운한 일이 생긴다든지, 고양이가 재채기를 하면 폭풍이 몰려온다든지……"
221050-78 = "3;미나토;16;그 때문에 새미의 건강이 악화될 때마다 학생들이 동요하는 일이 많아서, 새미를 하선 시킬까 고민하던 참이었습니다."
221050-79 = "3;미나토;17;하지만……"
221050-80 = "[s] \"뭔가 하선 시킬 수 없는 이유가 생겼구나.\""
221050-81 = "3;미나토;16;네. 새미의 건강을 이유로, 육지에 보내는 게 어떻냐는 제안을 꺼내자……"
221050-82 = "3;미나토;16\n1;아미;13;새미의 처우를 두고 오디세이아 학원 내의 여론이 두 파벌로 나뉘어 버렸습니다.\n#1;a\n#3;m5"
221050-83 = "1;아미;02;일부 학생들은 방금 말씀드린 것처럼 뱃사람의 금기를 이유로 들어 새미를 내보내자고 했습니다."
221050-85 = "2;오디세이아 학생 A;05\n#2;a\n#2;h\n#wait;500"
221050-86 = "2;오디세이아 학생 A;05\n4;오디세이아 학생 B;05\n#4;a\n#2;h\n#4;h\n#wait;1500"
221050-87 = "2;오디세이아 학생 A;05;벌써 폭풍이 세 차례나 지나갔다고. 더 나쁜 일이 생기기 전에 새미를 배에서 내리게 해야 해."
221050-88 = "4;오디세이아 학생 B;04;상상하고 싶진 않지만…… 이러다가 새미의 상태가 더 악화되면 어쩌려고?\n#4;em;[속상함]"
221050-89 = "2;오디세이아 학생 A;06;그래. 좀 더 시설 좋은 육지에서 치료를 받는 게 새미에게도 더 좋은 일일거야."
221050-91 = "3;아미;07;……하고 말이지요.\n#3;em;[…]\n#3;a"
221050-92 = "3;아미;00;하지만 또 다른 학생들은 오랫동안 쌓아 온 유대를 이유로, 새미를 내보내지 말자고 주장했습니다."
221050-94 = "2;트라이던트 오디세이아 학생 C;05\n#2;a\n#2;h\n#wait;500"
221050-95 = "4;트라이던트 오디세이아 학생 D;05\n2;트라이던트 오디세이아 학생 C;05\n#4;a\n#2;h\n#4;h\n#wait;1500"
221050-96 = "2;트라이던트 오디세이아 학생 C;05;오디세이아 학원은 단순한 배가 아니라고. 육지가 아닌 학원에서도 치료는 충분히 할 수 있어!\n#2;em;[!]"
221050-97 = "4;트라이던트 오디세이아 학생 D;05;게다가 평생을 바다에서 살아 온 새미가 육지의 환경에 제대로 적응할 수 있을까?"
221050-98 = "4;트라이던트 오디세이아 학생 D;04;고작 불운 때문에 수년간 가족처럼 함께 지내 온 새미를 다른 사람의 손에 맡길 순 없어!\n#4;jump"
221050-100 = "3;아미;00;……라고 말입니다.\n#3;a"
221050-101 = "3;가짜 총학생회장;07;양 측 모두 충분한 명분을 갖고 있기에 물러서지 않는 상황이군요."
221050-102 = "3;아미;07;네."
221050-103 = "#st;[0,0];instant;1;"
221050-105 = "3;미나토;15\n#3;em;[…]\n#wait;2500"
221050-106 = "[ns] \"미나토는 어떻게 생각해?\""
221050-107 = "3;미나토;02;저는……"
221050-108 = "3;미나토;17;사실 D.U.로 돌아와 총학생회장님을 뵈려 했던 이유도 이 때문이었습니다."
221050-109 = "3;미나토;16;앞서 말씀드렸듯이 오디세이아 학원의 금기는 오랜 세월 동안 걸쳐 축적되어 온만큼, 거의 대부분의 상황에서 학생들을 통제할 수 있는 지표가 되어왔습니다."
221050-110 = "3;미나토;14;그간 오디세이아 학생들 사이에서 발생한 갈등은, 이 전례와 규칙 만으로도 충분히 해결할 수 있었지요. "
221050-111 = "3;미나토;17;하지만 새미에 관한 일만큼은…… 그 어떤 규칙으로도 끊어낼 수 없었습니다."
221050-112 = "3;미나토;16;무엇이 새미를 위한 일인지, 학생들을 위한 일인지, 학원을 위한 일인지. 아무리 논의해도 해답에 도달하지 못했습니다."
221050-113 = "3;미나토;06;하지만 무작정 시간이 해결해 주기를 기다릴 수도 없는 문제인지라……\n#3;em;[한숨]"
221050-114 = "3;미나토;16;……이번 일에 대해서는 총학생회장님과 선생님의 의견을 구하고 싶습니다."
221050-115 = "#st;[0,0];instant;1;"
221050-117 = "3;가짜 총학생회장;08\n#3;em;[…]\n#wait;2500"
221050-118 = "#na;가짜 총학생회장;얻는 것이 있으면, 잃는 것도 있는 법이지요.\n#3;hide"
221050-119 = "3;가짜 총학생회장;08\n#3;a"
221050-120 = "3;가짜 총학생회장;08\n#wait;1000"
221050-121 = "3;가짜 총학생회장;05;무슨 선택을 내린다 하더라도 아무것도 잃지 않을 수는 없습니다."
221050-122 = "3;가짜 총학생회장;07;당신의 선택으로 학생들이 무언가를 영구히 잃게 된다면, 이는 당신이 책임져야 합니다."
221050-123 = "3;가짜 총학생회장;04;이를 책임지기 위해, 그 상실을 달래주기 위해 당신이 그 자리에 있는 게 아닌가요?"
221050-124 = "#st;[0,0];instant;1;"
