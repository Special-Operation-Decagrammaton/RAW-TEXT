[translation]
10054040-1 = "Episode 4;Water Fun, Audits, and a Summer Getaway 2"
10054040-2 = "Now then, does everyone understand?"
10054040-3 = "Just because we stretched, that doesn't mean we're immune to accidents. Please still be careful."
10054040-4 = "And if anything does happen, call for me or Sensei right away."
10054040-5 = "We're all here to have fun, but please remember these two rules, okay?"
10054040-6 = "Yes, ma'am!"
10054040-7 = ""
10054040-9 = ""
10054040-11 = ""
10054040-12 = "Are you not going in, Kisaki?"
10054040-13 = "I'll enjoy from the sidelines a while longer. "
10054040-14 = "Just being near the water is cooling me down. Fufu."
10054040-15 = "If you say so... Just let us know when you are!"
10054040-16 = ""
10054040-18 = ""
10054040-19 = ""
10054040-20 = "It's nice, and rare, to see everyone so carefree."
10054040-21 = "..."
10054040-23 = "The river flows like green silk ribbons."
10054040-24 = "And mountains rise like pure jade hairpins."
10054040-26 = "For this is far better than ascending to the heavens."
10054040-27 = "It calls no need to fly on a crane..."
10054040-29 = ""
10054040-30 = "Fufu. Perhaps I've put this off for too long."
10054040-31 = "Actually, I suppose something like this..."
10054040-33 = "I owe it to everyone gathered here."
10054040-34 = "And Sensei—"
10054040-35 = ""
10054040-38 = "B-But I'm tiiired!"
10054040-40 = "Kokona?!"
10054040-42 = "You can do it, Kokona! Kick your legs a little harder!"
10054040-43 = "Don't worry, we're right here!"
10054040-44 = ""
10054040-49 = "I-I can't kick any harder!"
10054040-50 = "Swimming is an essential skill for any proper lady, you know."
10054040-51 = "...Really?"
10054040-52 = "A lady must be prepared for any situation, at any time. Including being in water."
10054040-53 = "Uwaaah... Shun, you're always so...so...so specious!"
10054040-55 = "O-Oh, that is the situation. Those two will ensure her safety."
10054040-56 = "While this is hardly a groundbreaking statement...being on vacation truly does bring out a different side in people. Fufu."
10054040-57 = "[ns] \"Should we try something new too, then?\""
10054040-58 = "Wh-What?!"
10054040-59 = "It's no different from being at home if we are just sitting here..?"
10054040-60 = "While I cannot argue your point... I already..."
10054040-61 = "Fine, I'll acquiesce. What would you like to do?"
10054040-62 = "Hm? To enter the water with the others?"
10054040-63 = "..."
10054040-64 = "Very well."
10054040-65 = ""
10054040-67 = ""
10054040-68 = ""
10054040-69 = "With one stipulation, however. You shall hold tight to my hand the entire time."
10054040-70 = "[s] \"Gah?!\""
10054040-71 = ""
10054040-73 = ""
10054040-75 = "Accepting her deal, I took hold of Kisaki, who was glued to my side as we made our way to the water."
10054040-78 = "I was surprised to see that Kisaki seemed to be shaking slightly."
10054040-79 = "Cold...!"
10054040-80 = "Do not look at me like that, Sensei. I am not scared, and I am completely, utterly calm. I was simply taken aback by the water's temperature."
10054040-81 = "..."
