10054040-93 = "...Just a fish? They thrive here because of the clear waters?"
10054040-94 = "..."
10054040-95 = "You appear to be correct. Looking down, I can perceive both your legs and mine, and even the gravel making up the bed of the river."
10054040-96 = "Fufu, look, Sensei. Our legs are blue, and half their usual length."
10054040-97 = "Regardless... I am enjoying this."
10054040-98 = ""
10054040-100 = ""
10054040-101 = "Ugh?!"
10054040-102 = ""
10054040-104 = ""
