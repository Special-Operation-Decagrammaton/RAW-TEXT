[translation]
10054040-1 = "第4話;戲水，查核，總歸是避暑（２）"
10054040-2 = "──那麼，大家都明白了嗎？"
10054040-3 = "雖然已經做過充分的暖身，還是要小心可能發生的意外。"
10054040-4 = "還有萬一發生任何狀況，都要立刻來找我或是老師。"
10054040-5 = "其他事情就算忘記了也沒關係，但是這兩件事一定要記住哦？"
10054040-6 = "好～！"
10054040-7 = ""
10054040-9 = ""
10054040-11 = ""
10054040-12 = "咦，你不下水嗎？妃姬？"
10054040-13 = "妾身……想再這樣坐一會。"
10054040-14 = "呵呵。光是望著水面，感覺心神都變得舒暢了呢。"
10054040-15 = "這樣啊……等你想下水的時候就來找我們吧。等你哦！"
10054040-16 = ""
10054040-18 = ""
10054040-19 = ""
10054040-20 = "大家都朝氣滿滿呢。真令人欣慰。"
10054040-21 = "……"
10054040-23 = "江作青羅帶，"
10054040-24 = "山如碧玉篸。"
10054040-26 = "遠勝登仙去，"
10054040-27 = "飛鸞不假驂……"
10054040-29 = ""
10054040-30 = "呵呵，若是能早些度過這樣的時光該有多好。"
10054040-31 = "不。哪怕是此刻，能夠像這樣……"
10054040-33 = "是啊，這一切也都是因為有大家……"
10054040-34 = "還有……老師的幫助──"
10054040-35 = ""
10054040-38 = "我快不行了！"
10054040-40 = "嗯！？"
10054040-42 = "來，加油！雙腿再更用力地打水，心菜醬！"
10054040-43 = "心菜醬，放輕鬆！姐姐們會好好輔助你的！"
10054040-44 = ""
10054040-49 = "還，還要更用力嗎？"
10054040-50 = "那當然！游泳對淑女來說也是很重要的素養哦？"
10054040-51 = "……那是真的嗎？"
10054040-52 = "姐姐我認為，隨時為各種情況做好準備，正是淑女應有的姿態呢。"
10054040-53 = "唔唔……旬姐姐總是說一些聽起來很有道理的話……"
10054040-55 = "唔呣，原來如此。#n畢竟是那兩個人，大可不必擔心吧。"
10054040-56 = "雖然早有預料……不過渡假還真是會讓人有所改變呢。呵呵……"
10054040-57 = "[ns] 「既然如此，我們也來做點不一樣的事吧。」"
10054040-58 = "老師！？"
10054040-59 = "若是一直在這裡坐著，豈不是與平日無異？"
10054040-60 = "雖然汝說得有理……不過妾身光是如此就已經很滿足了……"
10054040-61 = "知道了，知道了。#n那麼，妾身該做些什麼呢？"
10054040-62 = "嗯？要妾身與大家一同下水？"
10054040-63 = "……"
10054040-64 = "也好，就這麼辦吧。"
10054040-65 = ""
10054040-67 = ""
10054040-68 = ""
10054040-69 = "只要老師在下水期間始終牽著妾身的手，妾身就依汝所願。"
10054040-70 = "[s]「！？」"
10054040-71 = ""
10054040-73 = ""
10054040-75 = "（牽起徹底緊貼過來的妃姬的手，慢慢走向水邊）"
10054040-78 = "（不知為何，妃姬似乎在微微發抖）"
10054040-79 = "好冰……！"
10054040-80 = "怎麼了，老師？妾身沒事。#n妾身並不是感到恐懼……單純是未料溪水竟如此冰冷。"
10054040-81 = "……"
10054040-82 = "別，別走那麼快。#n一點一點……慢慢來……"
10054040-83 = ""
10054040-85 = ""
10054040-87 = "（依照妃姬所說的放慢腳步，一點一點地往深處前進）"
10054040-88 = ""
10054040-90 = ""
10054040-91 = "唔──！？"
10054040-92 = "剛，剛才有什麼滑滑的東西掠過了妾身的小腿！？！？"
10054040-93 = "只是棲息於此處的魚？因為此地是水質清澈的溪谷？"
10054040-94 = "……"
10054040-95 = "是嗎，原來如此。#n水質清澈得連老師和妾身的雙腿，甚至河床上的卵石都清晰可見……"
10054040-96 = "呵呵。所有人的腿皆染上了青色，看起來甚至比平時少了半截呢。"
10054040-97 = "無論何事……都是寶貴的經驗……"
10054040-98 = ""
10054040-100 = ""
10054040-101 = "唔！？"
10054040-102 = ""
10054040-104 = ""
10054040-106 = "（妃姬突然沒踩穩腳步！）"
10054040-107 = "（所幸因為緊緊牽著手才沒有跌倒）"
10054040-108 = ""
10054040-110 = ""
10054040-111 = "[ns] 「沒事吧？」"
10054040-112 = "唔呣，沒有大礙。#n畢竟有老師牽著妾身的手……"
10054040-113 = ""
10054040-115 = ""
10054040-116 = "……"
10054040-117 = "不，果然情況並不樂觀呢。"
10054040-118 = "[s] 「咦……！？」"
10054040-119 = "所以……老師……"
10054040-120 = "接下來，揹著妾身走吧。"
