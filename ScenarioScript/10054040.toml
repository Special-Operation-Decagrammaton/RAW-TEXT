10054040-166 = "不該是這樣的……為什麼……？"
10054040-167 = "……"
10054040-168 = "不，不對。僅憑知識……果然還是有所不足吧。"
10054040-169 = "若要知行合一，尚需相應之力方可成之……"
10054040-171 = "那就讓我來幫你吧！"
