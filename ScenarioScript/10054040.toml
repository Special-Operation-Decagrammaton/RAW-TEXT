10054040-172 = ""
10054040-173 = ""
10054040-174 = ""
10054040-175 = ""
10054040-177 = "Pwah?!"
10054040-178 = ""
10054040-180 = ""
10054040-181 = "Hahaha! You have to become one with the water if you want to learn how to swim!"
10054040-182 = "Rumi! You caught me off guard!"
