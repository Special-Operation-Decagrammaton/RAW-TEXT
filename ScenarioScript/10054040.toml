10054040-189 = ""
10054040-191 = ""
10054040-192 = ""
10054040-193 = ""
10054040-195 = "Unhand me! You...miscreant! Did you wish to indulge in this childish behavior so badly?!"
10054040-196 = ""
10054040-200 = "Ahaha! Come now, you'll never catch up like that. You have to pump your arms and legs!"
10054040-201 = "Well, I apologize that I do not have the same brutish strength as you!"
10054040-202 = ""
10054040-205 = "Eek! Stop! I demand you stop!"
10054040-206 = "You have to catch me first! Maybe when the sun sets in the east! Hahaha!"
10054040-207 = "Mark your words!"
