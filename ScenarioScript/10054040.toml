10054040-141 = "是啊。"
10054040-142 = "老師背上的觸感，妾身也感受得差不多了。"
10054040-144 = ""
10054040-145 = "那麼就來稍微嘗試所謂的游泳吧。"
10054040-146 = "汝問妾身會不會游泳？#n唔呣，倒是沒有親自試過。"
10054040-147 = "不過理論方面妾身早已充分理解，想必不成問題。"
10054040-149 = "（妃姬這麼說著，信心滿滿地跳進了水裡）"
10054040-150 = ""
10054040-154 = "（接著理所當然地，開始在水裡掙扎了起來！）"
10054040-155 = ""
10054040-157 = ""
