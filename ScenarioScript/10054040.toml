10054040-125 = "（就這樣，終究還是落入圈套了！）"
10054040-126 = ""
10054040-129 = "妾身姑且問一句……不重嗎？"
10054040-130 = "完全感覺不到重量？#n呵呵，汝會不會太過客套了？"
10054040-131 = "總覺得……令人回想起過去的事了呢。"
10054040-132 = "……"
10054040-133 = "承蒙關照了，老師。"
