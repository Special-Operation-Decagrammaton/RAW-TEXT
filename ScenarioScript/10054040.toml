10054040-108 = ""
10054040-110 = ""
10054040-111 = "[ns] \"Are you okay?\""
10054040-112 = "Y-Yes. Thank you for catching me."
10054040-113 = ""
10054040-115 = ""
10054040-116 = "..."
10054040-117 = "Actually, I amend my statement. I'm horribly injured."
