[translation]
10054040-1 = "4화;물놀이, 감사, 종합적으로 피서 2"
10054040-2 = "–그래서, 모두 아셨죠?"
10054040-3 = "충분히 몸을 풀었지만, 그래도 만일의 사태에는 조심할 것."
10054040-4 = "그리고 무슨 일이 있으면, 꼭 저나 선생님을 부를 것."
10054040-5 = "다른 것은 모두 괜찮지만, 이 두 가지는 꼭 기억해 주세요?"
10054040-6 = "네~에!"
10054040-12 = "어라, 안 들어가? 키사키?"
10054040-13 = "나는…… 조금만 더 이대로 앉아 있고 싶구나."
10054040-14 = "후후. 물을 보고 있는 것만으로, 이미 머리가 시원해지는 듯하니 말이다."
10054040-15 = "그런가……. 뭐, 내키면 놀러 오라구. 기다리고 있을 테니까!"
10054040-20 = "다들 기운이 넘치는구나. 좋은 일이지."
10054040-21 = "……."
10054040-23 = "강은 푸르른 비단 띠와 같고."
10054040-24 = "산은 맑은 옥비녀와 같구나."
10054040-26 = "선계에 오르는 것보다도 나을 것이니."
10054040-27 = "학을 타고 날 까닭이 어디에 있겠는가……."
10054040-30 = "후후. 조금 더 일찍 이런 시간을 보냈더라면 좋았을 것을."
10054040-31 = "아닌가. 지금이라도, 이렇게……."
10054040-33 = "그래, 이것도 모두 다른 모두와."
10054040-34 = "그리고…… 선생의 덕이 있었기에–"
10054040-38 = "이제 슬슬 힘들어지기 시작했는데요!?"
10054040-40 = "으, 으음?!"
10054040-42 = "자, 자! 다리를 더 힘껏 차는 거야, 코코나 쨩!"
10054040-43 = "너무 걱정하지 말아요, 코코나 쨩! 언니들이 잘 도와 줄게요!"
10054040-49 = "여, 여기서 더 힘껏요?"
10054040-50 = "그럼, 그럼! 수영도 레이디의 소양일 수 있다구?"
10054040-51 = "……그 말 진짜인가요?"
10054040-52 = "이 언니는 항상 모든 일에 대비하는 것이, 숙녀의 자세가 아닐까 생각하는데 말이죠?"
10054040-53 = "으우우…… 슌 언니는 항상 그럴듯한 말만 한다니까……."
10054040-55 = "으, 음. 그런 것이었군. 저 두 사람이니, 큰 문제는 없겠지."
10054040-56 = "어느 정도는 알고 있었지만…… 휴양지라는 곳은 참으로, 사람을 변하게 하는구나. 후후……."
10054040-57 = "[ns] \"그러니까 우리도 조금 다른 일을 해 보자.\""
10054040-58 = "선생?!"
10054040-59 = "언제까지나 이렇게 앉아만 있으면, 평소와 다를 것이 없지 않으냐고?"
10054040-60 = "그것은 그렇다만…… 나는 이대로도 충분히……."
10054040-61 = "알겠다, 알겠다. 그래서, 무엇을 하면 되겠느냐?"
10054040-62 = "음? 모두와 같이, 물속으로 들어가 보자고?"
10054040-63 = "……."
10054040-64 = "좋다."
10054040-69 = "물로 들어가는 내내, 선생이 내 손을 놓지 않아 준다면 그렇게 하지."
10054040-70 = "[s] \"?!\""
10054040-75 = "(완전히 바싹 달라붙는 키사키의 손을 잡고, 천천히 물가로 내려갔다.)"
10054040-78 = "(어째서인지 키사키는, 조금 떨고 있는 것 같았다.)"
10054040-79 = "차가……!"
10054040-80 = "왜 그러는가, 선생. 나는 괜찮다. 무섭거나…… 그런 것은 아니다. 그저 생각보다 물이 더 차가워서 말이지."
10054040-81 = "……."
10054040-82 = "너, 너무 앞서 가지 말아 다오. 조금씩, 천천히……."
10054040-87 = "(키사키의 말대로 서두르지 않으며 조금씩 깊은 곳으로 나아갔다.)"
10054040-91 = "흐읏?!"
10054040-92 = "바, 방금 종아리를, 뭔가 미끌미끌한 것이 스치고 지나갔다만??!!"
10054040-93 = "여기 사는 물고기일 뿐이라고? 이곳은 물이 깨끗한 계곡이니까?"
10054040-94 = "……."
10054040-95 = "그래. 그렇구나. 선생과 나의 다리와, 계곡 바닥의 자갈까지 보일 정도로……."
10054040-96 = "후후. 우리 모두 다리가 푸르게 물들었구나. 평소의 절반 정도로 짧아지기도 했고."
10054040-97 = "어떤 것이라고 해도……. 좋은 경험이다……."
10054040-101 = "으읏?!"
10054040-106 = "(키사키가 걸음을 헛디뎠다!)"
10054040-107 = "(손을 꼭 잡고 있었기에 넘어지지 않았다!)"
10054040-111 = "[ns] \"괜찮아?\""
10054040-112 = "으, 음. 괜찮다. 선생이 손을 잡아 주고 있었으니……."
10054040-116 = "……."
10054040-117 = "아니다. 역시 괜찮지 않구나."
10054040-118 = "[s] \"어……?!\""
10054040-119 = "그러니, 선생."
10054040-120 = "이제부터, 나를 업거라."
10054040-125 = "(그렇게, 함정에 걸리고야 말았다!)"
10054040-129 = "혹시나 하여 묻는 것이지만, 무겁지 않은가?"
10054040-130 = "아무 무게도 느껴지지 않는다고? 후후. 입에 발린 말이 지나치지 않은가."
10054040-131 = "뭔가…… 예전 일이 생각나는구나."
10054040-132 = "……."
10054040-133 = "고맙다, 선생."
10054040-134 = "진심으로, 감사를 표한다."
10054040-135 = "……."
10054040-136 = "이제, 슬슬 내려 주지 않겠는가."
10054040-140 = "[ns] \"괜찮겠어?\""
10054040-141 = "그래."
10054040-142 = "선생 등의 감촉은, 어느 정도 느낀 듯하니 말이다."
10054040-145 = "그러면 어디, 수영이라는 것을 조금 해 볼까."
10054040-146 = "수영을 할 줄 아느냐고? 흐음. 직접 해 본 적은 없다."
10054040-147 = "하지만 이론이라면 충분히 알고 있으니, 어렵지 않을 게다."
10054040-149 = "(키사키는 그렇게 이야기하며, 자신만만하게 물속으로 뛰어들었다.)"
10054040-154 = "(그리고 당연하게도 물에서 허우적거리기 시작했다!)"
10054040-158 = "[ns] \"키사키! 키사키?!?!\""
10054040-159 = "……괜찮다. 발을 헛디뎠을 뿐이다."
10054040-160 = "다시 한번……."
10054040-165 = "[ns] \"키사키–!!!\""
10054040-166 = "이럴 리가, 없을 텐데……. 어째서……."
10054040-167 = "……."
10054040-168 = "아니, 아니다. 알고 있는 것만으로는……. 확실히 부족하겠지."
10054040-169 = "자고로 지와 행을 일치시키기 위해서는, 그만큼의 역(力)이 필요한 법이라 하였지……."
10054040-171 = "그런 거라면 내가 도와줘야겠네!"
10054040-177 = "푸왓?!?!"
10054040-181 = "하하하! 물과 친해지려면, 물에 많이 빠져 봐야 한다고?"
10054040-182 = "루미……! 놀랐지 않은가!"
10054040-183 = "흐음~? 하지만 나도 놀랐단 말이지~?"
10054040-184 = "우리 키사키가 언제 그렇게, 선생님을 몰래 데리고 가서, 둘이서만 놀려고 했던 건지 말야~?"
10054040-185 = "그, 그건……!"
10054040-186 = "……."
10054040-187 = "옛날부터 하여튼, 눈치는 빨랐단 말이지……."
10054040-188 = "아무튼, 수영을 빠르게 배우고 싶다면…… 실전에서 배우는 게 최고인 법이니까!"
10054040-195 = "노, 놓아라! 이 녀석…… 그렇게 장난이 치고 싶은 것이냐!"
10054040-200 = "하하하! 더 빨리! 물장구를 치고 팔을 저으라구! 그러다 평생 못 따라올걸~?"
10054040-201 = "그 체형으로 그런 말을 하는 것은 반칙이지 않은가!"
10054040-205 = "에에잇! 거기 서라! 서란 말이다!"
10054040-206 = "붙잡으면 얌전히 있어 줄 테니까! 아직은 아니라구!"
10054040-207 = "그 말, 기억했다!"
10054040-212 = "[ns1] \"어라? 그러고 보니……!\"\n[ns2] \"어느새 수영이 엄청나게 능숙해졌네?\""
10054040-215 = "???"
10054040-216 = "그러게. 잘됐네, 키사키."
10054040-217 = "……."
10054040-218 = "설마, 이걸 노리고 있었던 것인가……?"
10054040-219 = "글쎄에~? 나는 잘 모르겠는데~?"
10054040-220 = "하지만 키사키가 선생님을 몰래 데리고 나가는 걸 보니까, 뭔가 샘이 나서 말이지."
10054040-221 = "그, 그건, 그러니까……."
10054040-222 = "그러니까, 선생님! 나도 어부바!"
10054040-223 = "[s] \"어?!\""
10054040-228 = "[ns] \"좋아…… 와라!\""
10054040-231 = "(그렇게 루미가 등에 업혀 왔다!)"
10054040-232 = "(물 덕분에 그렇게 무겁지는 않았다……!)"
10054040-233 = "으, 으음……!"
10054040-234 = "뭐어, 이번은 봐 주기로 하마……."
10054040-235 = "어때, 선생님? 내 몸…… 따듯해?"
10054040-236 = "거의 주방에만 있었다 보니까 말이지……. 이런 시간도 신선하고 좋네."
10054040-237 = "[ns] \"루, 루미? 귀가, 귀가……!\""
10054040-238 = "응? 귀? 아하……."
10054040-239 = "……."
10054040-240 = "호오~"
10054040-241 = "[ns] \"#@!$^#!@#!???\""
10054040-242 = "그, 그만두거라! 그래서는……!"
10054040-243 = "왜애~? 너도 조금 전에 이랬잖아~?"
10054040-244 = "선생이 위험할 수도 있지 않은가!"
10054040-250 = "우왓?! 괜찮아, 선생님? 미안!"
10054040-251 = "……? 아니, 아니다. 이것은……!"
10054040-256 = "에헤헤! 선생님 놀라게 하기 작전 성공이에요!"
10054040-257 = "어, 어어……? 괘, 괜찮으세요?! 제가 너무 장난이 심했나요……?"
10054040-258 = "죄, 죄송해요. 선생님! 으아앙~"
10054040-259 = "[s3] \"뭐야, 코코나 쨩이었구나. 괜찮아, 괜찮아.\"\n[s4] \"그 대신 말이지……!\""
10054040-262 = "네?"
10054040-264 = "(그대로 잠수한 다음, 코코나를 안아 올려 목말을 태웠다!)"
10054040-268 = "꺄아아앗?! 서, 선생님! 치사해요!"
10054040-269 = "(코코나가 작은 손으로 목을 꼭 끌어안아 왔다!)"
10054040-270 = "(그대로 코코나를 붙들고, 물속으로 주저앉았다!!!)"
10054040-274 = "흐이아악?!?! 선생님 장난꾸러기!!!"
10054040-275 = "좋아요……. 그러면 저도……!"
10054040-278 = "(코코나가 다시 잠수하더니, 이번에는 앞에서 꼭 안겨 왔다!!!)"
10054040-282 = "에헤헤! 이러면 선생님도 아무것도 못 하겠죠?"
10054040-284 = "어머나. 그러면 저도 도울까요?"
10054040-285 = "[ns5] \"???!!!\"\n[ns6] (등 뒤에서, 엄청나게 부드러운 감촉이……!)"
10054040-289 = "우후후……. 잡았답니다, 선생님."
10054040-290 = "잘했어, 언니! 그대로 선생님을 꽉 붙잡아 버리는 거야! 어디 못 도망가게!"
10054040-291 = "[ns] \"이럴 수가……. 스노하라 자매에게 앞뒤로 협공당하다니!\""
10054040-293 = "어머나, 그러게요. 이걸로 선생님은…… 당분간 저희의 것이 되어 버리신 거네요?"
10054040-294 = "흐음……. 뭔가 치사하구나. 그러면 나도 끼어들도록 할까."
10054040-295 = "[s] \"키사키까지?!\""
10054040-300 = "오, 이거 그건가? 신 산해경 명물 선생님 육화각인가? 그러면 나도 가만히 있을 수 없지!"
10054040-306 = "(결국 신 산해경 명물은…… 무게를 이겨내지 못하고, 그대로 붕괴하고 말았다!)"
10054040-311 = "아하하하하! 그 꼴이 뭐야, 선생님!"
10054040-312 = "우후후. 즐겁네요. 네, 정말로요."
10054040-318 = "으음, 뭔가 모두 즐거워 보이는군……. 나도 수영복을……."
10054040-319 = "아니, 아니다! 무슨 생각을 하는 건가, 코노에 미나! 나는 저분들의 즐거움을 지키기 위해, 이렇게 있는 것!"
10054040-320 = "……."
10054040-321 = "…………그냥 수영복 입을걸……."
10054040-325 = "어머나. 배가 고프군요, 코코나 쨩?"
10054040-326 = "아, 아냐! 이건 그러니까, 그러니까……!"
10054040-327 = "그러고 보니 벌써 이런 시간이네. 점심이라도 먹으러 갈까?"
10054040-328 = "호오. 나는 그대가 마련할 것이라고 생각했다만."
10054040-329 = "아무리 내가 요리를 좋아한다지만, 휴양지까지 왔는데 일을 하고 싶지는 않다고."
10054040-330 = "거기에, 이곳의 요리는 어떨지 조사해 보고 싶기도 하고 말이지?"
10054040-331 = "음. 어떤 의미로는 드디어, 우리의 본 임무로 들어가게 되었다고도 할 수 있겠군."
10054040-332 = "이제부터, 정말로 비밀 감사의 시간이다!"
10054040-333 = "그래도 그 단어는 가능한 한 꺼내지 않는 것으로 해 줬으면 좋겠네……."
10054040-334 = "뭐, 투자자로서 자금이 잘 사용되고 있는지는 봐 둬야 하니까!"
10054040-335 = "[ns] \"맛있는 거 먹자!\""
10054040-336 = "좋아요! 선생님도 뭘 좀 아시네요!"
10054040-337 = "그래도 선생님께 너무 투정 부리면 안 된답니다, 코코나 쨩."
10054040-338 = "코코나 쨩은, 참을 수 있는 레이디지요?"
10054040-339 = "그, 그럼! 당연하지!"
10054040-341 = "……."
10054040-342 = "………."
10054040-343 = "…………."
10054040-344 = "?"
10054040-345 = "……."
10054040-346 = "흐음……?"
10054040-347 = "어? 언니들 모두 왜 그래요?"
10054040-348 = "아니다. 일단 거리를 좀 더 둘러보자꾸나."
10054040-349 = "……어서 오십쇼……. 있는 건 있고, 없는 건 없습니다……."
10054040-350 = "계곡 래프팅이나 배 투어도 가능합니다……."
10054040-351 = "쌀국수…… 보리 생선 전골…… 찻잎을 기름에 튀긴 기름차…… 이것저것 있습니다……."
10054040-352 = "내가 그다지 견문이 넓은 것은 아니다만, 휴양지나 관광지의 상점 거리 치고는 뭔가 이상한데?"
10054040-353 = "차라리 산해경 상점 거리가, 열 배 정도 활기차고 시끄러울 지경이다."
10054040-359 = "저기, 여쭤 보고 싶은 것이 있는데요……?"
10054040-360 = "응……?"
10054040-361 = "???!!!"
10054040-362 = "죄, 죄송합니다! 잘못했습니다! 그러니, 그러니 제발 이 좌판만은……!"
10054040-363 = "이 좌판마저 없어진다면, 저는 더 이상 여기에서 장사를 해 오셨던 선배님들을 뵐 면목이 없습니다!!!"
