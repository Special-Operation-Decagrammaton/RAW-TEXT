[translation]
52260-1 = "제26화;어둠 속의 본심"
52260-2 = "백물어의 원래 의미는 말 그대로 백가지의 이야기."
52260-3 = "깊은 밤, 기묘한 이야기를 나누며 촛불을 하나씩 꺼트리는 백화요란의 오랜 놀이에서 비롯된 괴담."
52260-4 = "이야기가 진행될 때마다 촛불은 줄어들고, 사방은 어두워져, 점점 앞이 보이지 않게 되지."
52260-5 = "대신 눈이 흐려질수록 선명하게 보이는 것은 스스로의 내면."
52260-6 = "기묘한 이야기만큼이나 불가해한 사람의 마음."
52260-7 = "세상에 떠도는 풍문과 소문, 괴담과 낭설은 결국 자신의 욕망을 비추는 거울에 불과하니."
52260-9 = "[log][ff4444]어둠을 마주하고 고하거라.[-][/log]"
52260-12 = "[log][ff4444]그대는 어떤 거짓을 뒤집어쓰고 있는가.[-][/log]"
52260-15 = "[log][ff4444]그대는 어떤 헛된 욕망을 갖고 있는가.[-][/log]"
52260-18 = "[log][ff4444]그대는 무엇으로부터 시선을 돌리고 있는가.[-][/log]"
52260-22 = "나는……"
52260-23 = "순정 만화 속의 등장인물들은 언제나 행복해 보였어."
52260-24 = "백화요란의 정의를 바로 세우기 위해 훈련에 매진하면서도 한 편으로는 불안했었지."
52260-25 = "지나간 시간은 되돌릴 수 없기에, 청춘을 낭비하고 있을지도 모른다고."
52260-29 = "……하지만 사실 너도 알고 있었잖아?"
52260-30 = "초연과 땀방울로 가득 물든 너의 인생은 청춘과 언제나 거리가 멀었다는 사실을."
52260-33 = "나는……"
52260-34 = "백화요란의 작전참모로서 모든 것을 바로 세워야 할 의무가 있다고 생각했어."
52260-35 = "부원들을 바로 세운다는 미명 하에 마음에도 없는 심한 소리를 줄곧 했었지."
52260-36 = "떠나간 선배들을 책망하고, 뜻대로 되지 않는 현실을 원망했지만……"
52260-40 = "사실은…… 그래, 백화요란은 내가 망쳐 버린 거야."
52260-43 = "소녀는……"
52260-44 = "모두가 소녀를 필요로 한다고 했지만, 언제나 누군가를 대신하고 있을 뿐이었어요."
52260-45 = " 카데노코지의 여식으로서도, 백화요란의 부원으로서도."
52260-49 = "아무도 신경 쓰지 않는, 언제나 대체될 수 있는 가짜의 삶."
52260-50 = "……차라리 인형으로 태어났더라면 좋았을 텐데."
52260-53 = "[ns] \"……아이들에게 무슨 짓을 한 거지?\""
52260-55 = "역시 샬레의 선생에게는 괴서의 신비도 닿지 않는 건가."
52260-56 = "……아무것도. 나는 아무것도 하지 않았다."
52260-57 = "그저 스스로를 되돌아볼 수 있도록 눈을 가려준 것뿐."
52260-58 = "하지만 그 단순한 성찰만으로도 사람은 쉬이 무너지는 법이지."
52260-59 = "사람은 사람의 마음을 이해할 수 없으니까."
52260-60 = "그것이 설령 자신의 마음이라 할지라도."
52260-61 = "[s] \"이해하지 못한다 한들…… 그게 무슨 문제지?\""
52260-65 = "[ns1] \"이해할 때까지 묻고 답하기를 끊임없이 반복하면 되잖아.\"\n[ns2] \"그러기 위해 사람은 사람과 함께 살아가는 거니까.\"\n[ns3] \"그러기 위해 사람을 배움을 그만두지 않는 거니까.\""
52260-69 = "과연. 이들이 품고 있는 헛된 희망은 그대가 불어넣은 것인가."
52260-70 = "그럼 그 자리에서 지켜보거라."
52260-74 = "그대가 초래한 헛된 희망의 결과를—"
52260-76 = "……나는."
52260-77 = "혼자서는 아무것도 할 수 없는 부족하고 열등한 사람이야."
52260-80 = "손을 뻗어도 아무것도 지킬 수 없었고, 망가지는 걸 지켜보기만 했어."
52260-82 = "나는 결국, 아야메가 되지 못했어."
52260-86 = "……나는 고료 나구사니까."
52260-106 = "한심하고, 무능하고, 쉽게 한계에 부딪히고, 가짜를 연기하는 것밖에 재주가 없지만."
52260-110 = "그것이 포기해야 할 이유가 되지는 않아."
52260-116 = "코쿠리코, 네가 몇 번이고 현실을 일깨워 주더라도 내 생각은 바뀌지 않아."
52260-123 = "나는 고료 나구사."
52260-127 = "누가 뭐라 해도…… 아야메의 제일 가는 친구니까!"
52260-132 = "……그래. 이미 알고 있었구나."
52260-133 = "스스로가 얼마나 나약한지, 모두를 구하겠다는 그 마음이 얼마나 헛된 것인지 알면서도."
52260-134 = "이 가혹한 현실을 바꾸어 보겠다고 [ruby=괴서]책[/ruby]을 덮고 일어섰구나."
52260-135 = "정말…… 불가해한 광경이야."
52260-136 = "……당신이 아야메에게 보여준 풍경도 이와 같았겠지?"
52260-137 = "한치 앞이 보이지 않는 새까만 어둠. 그 어둠 사이로 귓가를 속삭이는 부정적인 내면."
52260-138 = "그렇기에 아야메도 절망하고 도망치려 했었던 거야."
52260-139 = "그래. 모두가 우러러보는 백화요란의 위원장도 하지 못한 일이다. 그런데 너는 해낼 수 있다고 믿는 것이냐?"
52260-140 = "그녀보다 훨씬 못한 네가, 감히 아야메를 구원할 수 있다고 믿는 게냐?"
52260-141 = "아니. 나는 아야메를 구원할 수 없어. 아야메가 아니니까."
52260-142 = "하지만…… 아야메가 스스로 일어날 때까지, 이 팔을 내밀어 이끌어줄 수는 있어."
52260-150 = "황혼에 잡아먹혔던 팔이…… 다시 돌아왔다고?"
52260-151 = "거짓말…… 그런 눈속임 따위로 괴서의 신비를 다루는 우리를 능멸하려 했다면—"
52260-158 = "다시 한번 묻겠어."
52260-159 = "아야메는 지금, 어디에 있지?"
52260-160 = "마, 말도 안 돼……"
52260-161 = "죽은 나뭇가지에 꽃이 필 수 없는 것처럼, 황혼에 떨어진 존재는 되돌릴 수 없을 터인데."
52260-162 = "코, 코쿠리코 님. 이게 대체……"
52260-167 = "필연은 이야기의 당위성을 부여하지만, 우연은 이야기의 흥미를 불러일으키는 법이지."
52260-168 = "설마 괴서의 황혼 속에서 스스로의 그림자뿐만 아니라, 타인을 향해 내뻗은 손까지 쥘 수 있었다니…… 그대는 언제나 예상치 못한 방법으로 극을 휘어잡는구나."
52260-172 = "어쩌면 그대에게도 이야기꾼의 자질이 있을지도 모르겠어."
52260-176 = "아야메는 지금도 천수각 위에서 너희를 지켜보고 있다."
52260-177 = "만일, 그대가 진실로 아야메를 구하는 데 성공한다면."
52260-181 = "……나 또한, 다음 이야기의 전개를 조금 더 고려해 보마."
52260-192 = "[ns] \"……기다려!\""
52260-196 = "놓쳐버렸나."
52260-204 = "우, 우왓……?! 바, 방금 그 기억은 뭐였었지?"
52260-205 = "무척이나 기분 나쁜 꿈을 꾸고 일어난 기분이와요……"
52260-206 = "코쿠리코…… 화조풍월부는 어떻게 된 거야?"
52260-207 = "……돌아갔어. 아쉽게도 붙잡지는 못했지만."
52260-208 = "하지만 지금은 아야메를 찾는 게 우선이야."
52260-214 = "[USERNAME] 선생님, 마지막으로 하나 더 부탁을 해도 괜찮을까?"
52260-215 = "위험할지도 모르겠지만…… 나와 아야메의 대련을 끝까지 지켜봐 주었으면 좋겠어."
52260-216 = "[s] \"무슨 일이 있어도 절대로 눈을 떼지 않을게.\""
52260-217 = "……고마워."
52260-218 = "그럼, 가자.#n아야메를 구하러."
