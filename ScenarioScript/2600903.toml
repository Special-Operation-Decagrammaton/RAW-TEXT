[translation]
2600903-1 = "새로운 아르바이트"
2600903-2 = "샬레 집무실"
2600903-3 = "(다음 날, 아침. 집무실에서 업무를 보던 중에……)"
2600903-10 = "무리예요……!"
2600903-11 = "손님이 많지 않은, 상냥한 컨셉의 카페라는 이야기는 들었지만……"
2600903-12 = "메이드 카페라는 이야기는 듣지 못했다고요!"
2600903-13 = "선생님을 믿었는데…… 믿었었는데……!"
2600903-14 = "[s1] \"일단 진정해, 유즈.\"\n[s2] \"그보다 아르바이트 중에 나온 거야?\""
2600903-17 = "아니요. 가게를 오픈하기 전에 접객 교육을 받던 중이었는데……."
2600903-18 = "점장님이 '메이드 카페에서는 음식을 건넬 때 귀여운 포즈를 취해야 한다'고 하셔서……"
2600903-19 = "……도망쳐 버리고 말았어요."
2600903-23 = "어, 어쩌죠? 연수 중에 갑자기 사라졌으니 점장님이 걱정하고 계실 텐데……"
2600903-24 = "[s] \"가게엔 내가 대신 사정을 말해둘게.\""
2600903-25 = "우으으…… 감사합니다."
2600903-27 = "[ns3] \"그렇게 곤란해할 거라고는 생각지 못했는데……\"\n[ns4] \"미리 설명해 주지 못해서 미안해.\""
2600903-30 = "아뇨…… 일단은 낯을 많이 가리는 제 성격이 가장 큰 문제니까요……"
2600903-31 = "선생님께서 말씀해 주신 대로 카페의 점원 여러분은 모두 상냥하시기는 했지만, 어쩐지 다들 텐션이 높아서……"
2600903-32 = "자기소개를 마치기도 전에 어느새 메이드복 차림이 되어버리고, 저도 모르는 사이에 연수가 시작되어서……"
2600903-33 = "이대로 모르는 사람 앞에 메이드복 차림으로 나서야 한다는 말을 들었을 때는 이미 눈앞이 캄캄해져서—"
2600903-34 = "[s] \"일단 진정해, 유즈.\""
2600903-35 = "네, 네에……"
2600903-36 = "하지만 어쩌죠…… 선생님이 소개해 주신 자리이기도 하고, 제게 상냥하게 말을 걸어 주신 카페의 점원분들을 실망시키고 싶지는 않은데……"
2600903-37 = "낯선 사람에게 말을 거는 것만이라면 몰라도, 귀여운 포즈는……"
2600903-38 = "[s] \"충분히 연습하면 괜찮지 않을까?\""
2600903-39 = "여, 연습이요……?"
2600903-40 = "[s5] \"우선은 익숙한 상대를 상대로 메이드 특훈을 해보자.\"\n[s6] \"지금부터 나를 메이드 카페의 주인님이라고 생각해!\""
2600903-43 = "선생님을 상대로 메이드 특훈을요……?"
2600903-44 = "……그거라면, 괜찮을지도 모르겠어요. 선생님은 아는 사람이니, 긴장도 덜 하고……"
2600903-45 = "……조금은 부끄러운 모습을 보여도 상관없고."
2600903-46 = "그럼…… 하나오카 유즈, 노력하겠습니다!"
2600903-48 = "(이후, 유즈와 함께 메이드 특훈을 시작하였다.)"
2600903-50 = "어, 어, 어, 어서 오세요…… 주, 주인님!"
2600903-51 = "[s] \"틀렸어!\""
2600903-52 = "네, 네? 인사부터 잘못된 건가요……?"
2600903-53 = "[s7] \"주인님에게는 메이드가 있는 곳이 집이니까……\"\n[s8] \"'어서 오세요'가 아니라, '다녀오셨어요' 야!\""
2600903-56 = "그, 그렇군요…… 그런 디테일이 있었을 줄이야……"
2600903-57 = "그럼…… 다녀오셨어요, 주인님?"
2600903-60 = "주, 주문하신 오므라이스 나왔습니다……"
2600903-61 = "[s] \"어라, 그걸로 끝이야?\""
2600903-62 = "네, 네……? 방금 뭔가 빠트렸나요?"
2600903-63 = "[s] \"음식이 맛있어지는 주문을 빠트렸어.\""
2600903-64 = "으, 음식이 맛있어지는 주문이요……?"
2600903-65 = "<맛있어져라, 모에모에 큥큥>……?"
2600903-66 = "이, 이렇게 말씀드린다고 정말로 음식이 맛있어질까요……"
2600903-67 = "[s9] \"물론이야.\"\n[s10] \"음식에 유즈의 진심이 듬뿍 들어갈 테니까!\""
2600903-70 = "선생님께서 그렇게 말씀하신다면……"
2600903-71 = "마, 맛있어져라~ 모, 모에모에 큐큥, 큥!"
2600903-80 = "우, 우앗?! 죄, 죄송해요……! 실수로 넘어져서……"
2600903-81 = "옷을 버리지는 않으셨나요? 정말 죄송해요……"
2600903-82 = "……네? 오히려 방금 그 행동은 좋았다고요……?"
2600903-83 = "덜렁이 메이드 특유의 모에 포인트가 잘 살아나서 최고였다고요……?"
2600903-84 = "메이드의 세계는…… 심오하네요."
2600903-90 = "생각했던 것보다 훨씬 지치네요……"
2600903-91 = "그래도 선생님 앞에서 연습을 반복한 덕분에 이제는 낯선 손님 앞에서도 조금은 용기를 낼 수 있을 것 같아요……"
2600903-92 = "실제로는 어떨지 모르겠지만……"
2600903-93 = "오늘은 여러모로 도와주셔서 정말 감사합니다."
2600903-94 = "그리고, 선생님…… 지금은 무리지만, 언젠가 나중에 시간이 되신다면……"
2600903-95 = "제가 아르바이트를 하는 가게에 꼭 한 번 방문해 주세요."
2600903-96 = "그때는 꼭…… 최고의 접객으로 보답할게요."
