[translation]
10055180-1 = "ไตรภาคีจอมอวดดีแห่งทะเลยามเย็น"
10055180-2 = ""
10055180-3 = "ทุกคน เราได้ตระหนักถึงข้อเท็จจริงที่สำคัญมากแล้วละ"
10055180-4 = "อ่า ค่ะ อิบูกิ ตอนนี้มืดแล้ว ระวังเท้าด้วยนะคะ"
10055180-5 = "อื้อ! รุ่นพี่อิโรฮะก็เดินระวังๆ นะ!"
10055180-6 = ""
10055180-8 = ""
10055180-10 = "ตั้งแต่มาถึงเกาะนี้ คนที่พวกเราเจอก็มีรูปแบบบางอย่างอยู่ยังไงล่ะ!"
10055180-11 = "ทำไมคนถึงชอบทะเลตอนกลางคืนกันนะ? น่าขนลุกจะตาย... เดี๋ยวสิ จิอากิ! อย่าเดินห่างฉันสิ!"
10055180-12 = "อ๊ะ ได้ค่ะ! แต่ถ้าเลี้ยวตรงนี้ก็จะถึงย่านร้านริมทางแล้วนะคะ"
10055180-13 = ""
10055180-15 = ""
10055180-17 = "คงอยากรู้สินะ คงอยากรู้แทบคลั่งเลยละสิ"
10055180-18 = "ใช่มั้ยล่ะ...?!"
10055180-19 = "[s1] \"อะ... อื้ม!\"\n[s2] \"ครูอยากรู้สุดๆ เลยละ!\""
10055180-22 = "คิกคิกคิก! พูดได้ดี!"
10055180-23 = "นั่นก็คือ! ลำดับที่ศัตรูปรากฏตัวถูกกำหนดไว้แล้วไงล่ะ!"
10055180-24 = "ลองนึกดูสิ ตอนแรกพวกเราเจอกับใคร?"
10055180-25 = "ถ้าจำไม่ผิดก็... อะบิดอสค่ะ"
10055180-26 = "ใช่ โรงเรียนเล็กๆ ที่แม้แต่ชื่อก็แทบถูกลืมไปแล้ว และพวกที่ปรากฏตัวต่อมาก็คือ..."
10055180-27 = "สถาบันฝึกตำรวจวัลคิรี่ค่ะ... คนที่เป็นหัวหน้ากรมฯ ทำหน้าเหมือนอารมณ์บูดอยู่ตลอดเลย หงุดหงิดอะไรอยู่รึเปล่าคะ...?"
10055180-28 = "อืม ถึงจะเป็นสุนัขรับใช้ขององค์การนักเรียน แต่ก็เหนือชั้นกว่าโรงเรียนตกอับอย่างพวกอะบิดอสอยู่แล้ว และคนที่เราเจอก่อนหน้านี้ก็คือ..."
10055180-29 = "สหพันธ์เฮียกคิยาโคสินะ ฉันเข้าใจแล้วว่ามาโคโตะจังจะสื่อว่าอะไร"
10055180-30 = "หัวไวจริงๆ ซัตสึกิ! ถูกต้อง! ถึงเฮียกคิยาโคจะเทียบกับเกเฮนน่าของเราไม่ได้ แต่ก็เป็นโรงเรียนที่ใหญ่โตทีเดียว!"
10055180-31 = "นั่นหมายความว่าคู่ต่อสู้ของเราแข็งแกร่งขึ้นเรื่อยๆ ยังไงล่ะ! ถ้าเป็นแบบนี้ต่อไป ก็คงได้เจอศัตรูที่#nแข็งแกร่งกว่าเฮียกคิยาโค และสูสีกับเกเฮนน่าของเรา..."
10055180-32 = "คงอีกไม่นานที่จะได้เจอกับ <โรงเรียนนั้น> ที่เราเรียกได้เต็มปากว่าเป็นศัตรูตัวฉกาจของเรา!"
10055180-33 = "ศัตรูตัวฉกาจ...?"
10055180-34 = "โอะโฮะๆๆ~! ดูเหมือนจะชนะรวดได้อย่างราบรื่นเลยนะคะ~!"
10055180-35 = "แต่ชัยชนะต่อเนื่องของพวกคุณจะจบลงตรงนี้ค่ะ~!"
10055180-36 = ""
10055180-37 = "มาแล้วสินะ?!"
10055180-38 = "อะไรกัน ทำไมเรื่องมันดูจัดฉากขนาดนี้ล่ะคะ...?"
10055180-39 = ""
10055180-41 = ""
10055180-42 = ""
10055180-43 = "ดูเหมือนพวกปูพันธุ์ทางของเกเฮนน่าจะหาญกล้าก่อความวุ่นวายขึ้นนะคะ ทั้งที่เป็นแค่ปูเสฉวนแท้ๆ"
10055180-44 = ""
10055180-45 = "ไตรภาคีจอมอวดดี#nแห่งทะเลยามเย็น"
10055180-48 = ""
10055180-50 = "<แคร็บไฟต์> เป็นกีฬาที่วัดกันด้วยสายเลือด ฉันจะทำให้คุณรู้ซึ้งถึงความจริงข้อนี้เองค่ะ"
10055180-51 = "อึก! มีปากก็พูดใหญ่เลยนะ!"
10055180-52 = "ฝ่ายที่ไม่รู้จักเจียมตัวคือพวกคุณต่างหากค่ะ คิดว่าปูเสฉวนต่ำต้อยจะชนะปูสายพันธุ์ชั้นเลิศของทรีนิตี้#nได้เหรอคะ?"
10055180-53 = "ฝันไกลกันจริงๆ เลยนะคะ โฮะๆ!"
10055180-54 = "หวา นางิจัง... เป็นอะไรไปเนี่ย?"
10055180-55 = "เครียดสะสมเหรอ? หรือว่ากินแยมโรลบูดเข้าไป?"
10055180-56 = ""
10055180-58 = ""
10055180-59 = "......"
10055180-60 = ""
10055180-62 = ""
10055180-63 = "...!"
10055180-64 = "ไม่ใช่หรอกค่ะ มิกะ"
10055180-65 = "หืม?"
10055180-66 = "ถ้าเป็นเพื่อนกันจริงๆ ก็ไม่ควรทำท่าทีแบบนั้นในเวลานี้นะคะ"
10055180-67 = "หมายความว่ายังไงน่ะ...?"
10055180-68 = "นั่นก็หมายความว่า..."
10055180-69 = "ชาเสียรสชาติหมดแล้วค่ะ! รีบไปไล่ปูพันธุ์ผสมต่ำต้อยนั่นออกไปทีเถอะค่ะ!"
10055180-70 = "เซอาจัง?!"
10055180-71 = "โฮะๆๆ!"
10055180-72 = "นางิจังก็ด้วยเหรอ?!"
10055180-73 = ""
10055180-75 = ""
10055180-76 = "โอ๊ย... จริงๆ เลย!! ฉันไม่รู้ด้วยแล้ว!!"
10055180-77 = "ดาหน้าเข้ามาเลย!! ฉันจะสอนให้ปูพันธุ์ผสมที่ไม่เจียมตัวให้รู้เองว่าใครเหนือกว่า!!"
10055180-78 = "ในที่สุดก็เผยตัวตนที่แท้จริงออกมาแล้วสินะ พวกสภาน้ำชา!!"
10055180-79 = "สามต่อหนึ่ง ขี้ขลาดจริงๆ!"
10055180-80 = "สามต่อหนึ่ง? ฮุฮุ..."
10055180-81 = "มีอะไรน่าขำงั้นเหรอ?"
10055180-82 = "อย่างที่บอกไป แคร็บไฟต์เป็นกีฬาที่วัดกันด้วยสายเลือด..."
10055180-83 = "นั่นหมายความว่าต้องส่งตัวที่มีศักยภาพลงแข่งเท่านั้น ถึงจะคว้าชัยชนะได้ค่ะ"
10055180-84 = "ขอแนะนำผู้เข้าแข่งขันที่ดีที่สุดที่ทรีนิตี้ของเราค่ะ!"
10055180-85 = ""
10055180-87 = ""
10055180-88 = ""
10055180-90 = ""
10055180-91 = "เอ๊ะ... เอ๋... อะไรกันคะ? แล้วที่นี่ที่ไหน?"
10055180-92 = "ยะ... ยัยนั่น?!"
10055180-93 = ""
10055180-95 = ""
10055180-96 = "ใครน่ะ...?"
10055180-97 = "คุณฮิฟุมิค่ะ"
10055180-98 = "ฮิฟุมิคือใครกันล่ะ...?"
10055180-99 = "คนที่ไม่เข้าใจถึงความรักอันลึกซึ้งของคุณฮิฟุมิเลยนี่มันช่าง..."
10055180-100 = "เอาละ ฝากด้วยนะคะ! คุณฮิฟุมิ!"
10055180-102 = "คะ?! คุณนางิสะ?! นี่มันเรื่องอะไรกันคะ?! อะ... เอ๋?!"
10055180-103 = "เอ๋~~~?!?!"
