[translation]
10055180-1 = "저녁 바다의 우쭐한 트리움비라투스"
10055180-3 = "제군, 이 몸은 몹시 중대한 사실을 깨달았다."
10055180-4 = "아, 네. 이부키, 어두우니까 발밑 조심해요."
10055180-5 = "응! 이로하 선배도 조심해서 걷자!"
10055180-10 = "이 섬에도 도착하고 나서, 만나는 상대에는 어떠한 패턴이 있다는 것이다!"
10055180-11 = "왜 사람들은 밤바다를 좋아하는 거야? 으스스하기만 한데…… 잠깐, 치아키! 떨어지지 마!"
10055180-12 = "앗, 네! 그치만, 여기서 돌아가면 바로 노점가니까요."
10055180-17 = "아마 궁금하겠지. 궁금해서 미칠 지경일 거야."
10055180-18 = "……그렇지 않나?!"
10055180-19 = "[s1] \"으, 응!\"\n[s2] \"되, 되게 궁금해!\""
10055180-22 = "키시싯! 잘 물어보았다!"
10055180-23 = "그건 바로! 적들이 나타나는 순서는 정해져 있다는 거다!"
10055180-24 = "떠올려 봐라. 우리가 처음 마주친 녀석들이 누구였지?"
10055180-25 = "……분명, 아비도스였죠."
10055180-26 = "그래, 이름조차 거의 잊힌 군소 학원이지. 그다음에 나타난 것은……."
10055180-27 = "발키리 경찰학원이었죠…… 공안국장이란 분, 계속 화난 표정이었는데, 기분이 나빴던 걸까요……?"
10055180-28 = "음, 비록 총학생회의 개지만, 아비도스 같은 영락한 학원에 비할 바는 아니지. 그리고 직전에 만났던 것이 바로……."
10055180-29 = "백귀야행 연합학원이었네. 마코토 쨩이 하고 싶은 말은 알겠어."
10055180-30 = "과연 명석하군, 사츠키! 그렇다! 백귀야행은 우리 게헨나에 비할 바는 못되지만, 상당한 규모의 학원!"
10055180-31 = "즉, 우리의 상대는 점점 강해지고 있다는 거다! 이 추세라면, 백귀야행보다 강하면서, 우리 게헨나에 필적하는 강적……."
10055180-32 = "숙적이라 불러 마지 못할 <그 학원>과 마주치는 것도 시간문제겠지!"
10055180-33 = "숙적-?"
10055180-34 = "오호호호~! 꽤 승승장구하고 있는 듯하군요~!"
10055180-35 = "하지만, 그 연승도 거기까집니다~!"
10055180-37 = "역시, 나타났나?!"
10055180-38 = "뭔가요, 이 작위적인 전개……?"
10055180-43 = "감히 품종도 모를 게헨나의 잡종 따위가, 하물며 소라게 따위가 풍파를 일으키고 있는 모양입니다만."
10055180-45 = "저녁 바다의#n우쭐한 트리움비라투스"
10055180-50 = "<크랩 파이트>는 혈통의 스포츠. 그 사실을 뼈저리게 느끼게 해주죠."
10055180-51 = "크으읏! 뚫린 입이라고 잘도 말하는구나!"
10055180-52 = "분수를 모르는 것은 그쪽이죠. 천한 소라게 따위로 트리니티의 명名게를 이기겠다고요?"
10055180-53 = "꿈도 크군요! 오호호호!"
10055180-54 = "우왓, 나기 쨩…… 무슨 일이야?"
10055180-55 = "스트레스 쌓인 거야? 상한 롤케이크라도 먹었어?"
10055180-59 = "……."
10055180-63 = "……!"
10055180-64 = "……틀려요, 미카."
10055180-65 = "응?"
10055180-66 = "진정한 친구라면, 여기서 그렇게 반응해서는 안 됩니다."
10055180-67 = "무슨 말……?"
10055180-68 = "즉……."
10055180-69 = "차 맛이 떨어집니다! 그 천박한 잡종을 내쫓으시죠!"
10055180-70 = "세이아 쨩?!"
10055180-71 = "오호호호홋!"
10055180-72 = "나기 쨩까지?!"
10055180-76 = "……아아!! 진짜!! 이젠 나도 모르니까!!"
10055180-77 = "덤벼!! 분수도 모르는 잡종에게, 위아래를 알려주겠어!!"
10055180-78 = "드디어 본색을 드러냈군, 티파티!!"
10055180-79 = "비겁하게 삼 대 일이라!"
10055180-80 = "삼 대 일? 훗……"
10055180-81 = "뭐가 웃기지?"
10055180-82 = "앞서 말했듯이, 크랩 파이트는 혈통의 스포츠……."
10055180-83 = "즉, 우수한 자원을 배치하는 것만이 승리로 이어지죠."
10055180-84 = "저희 트리니티가 내놓을 수 있는, 최고의 선수를 소개하죠!"
10055180-91 = "엣…… 뭐, 뭐죠? 여기는 어디고?"
10055180-92 = "그, 그 녀석은?!"
10055180-96 = "……누구냐?"
10055180-97 = "히후미 씨입니다."
10055180-98 = "……히후미가 누구냐?"
10055180-99 = "이래서 히후미 씨가 가진 각별한 사랑을 이해하지 못하는 사람이란……."
10055180-100 = "자, 그러면 부탁드립니다! 히후미 씨!"
10055180-102 = "네?! 나기사 님?! 지금 이게 무슨 상황이죠?! 어, 어어?!"
10055180-103 = "에에에엣?!?!"
