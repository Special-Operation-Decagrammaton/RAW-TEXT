10055180-6 = ""
10055180-8 = ""
10055180-10 = "Ever since we arrived on this island, there has been a certain pattern to the opponents we encounter!"
10055180-11 = "...Why does anyone like the beach at night? It's so scary... Chiaki, wait! Don't wander off!"
10055180-12 = "Ah, sorry! I just wanted to check out the food stalls!"
10055180-13 = ""
10055180-15 = ""
10055180-17 = "You must be curious. You're probably dying to know."
