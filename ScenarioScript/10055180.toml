[translation]
10055180-1 = "傍晚海上得意的三巨頭"
10055180-2 = ""
10055180-3 = "諸位，本大人察覺到一個極為重大的事實。"
10055180-4 = "哦是哦。伊吹，天很暗要小心腳下哦。"
10055180-5 = "嗯！伊呂波前輩也要小心哦！"
10055180-6 = ""
10055180-8 = ""
10055180-10 = "抵達這座島之後，我們遇到的對手都有某種規律！"
10055180-11 = "為什麼大家都喜歡夜晚的海啊？#n我只覺得陰森森的……等等，千秋！不要離開我！"
10055180-12 = "啊，好的！不過從這裡折返就是攤販街了。"
10055180-13 = ""
10055180-15 = ""
10055180-17 = "你們想必很好奇吧？好奇得快要發瘋了吧？"
10055180-18 = "……難道不是嗎！？"
10055180-19 = "[s1] 「嗯，嗯！」\n[s2] 「超，超好奇的！」"
10055180-22 = "嘰嘻嘻！問得好！"
10055180-23 = "那就是！敵人出現的順序是固定的！"
10055180-24 = "回想一下吧。我們最先遇到的是誰？"
10055180-25 = "……我記得是阿拜多斯吧。"
10055180-26 = "沒錯，一所名字幾乎要被遺忘的弱小學園。#n接下來出現的是……"
10055180-27 = "是女武神警察學園吧……那位公安局長一直板著臉，是心情不好嗎……？"
10055180-28 = "嗯，雖然是聯邦學生會的走狗，但也不是阿拜多斯那種沒落學園能比的。#n而上一個遇到的則是……"
10055180-29 = "是百鬼夜行聯合學園呢。我懂真琴醬想說什麼了。"
10055180-30 = "果然聰明啊，皐月！沒錯！#n百鬼夜行雖然比不上我們格黑娜，但也是相當有規模的學園！"
10055180-31 = "也就是說，我們的對手越來越強了！#n按照這個趨勢，跟比百鬼夜行更強、足以匹敵我們格黑娜的強敵……"
10055180-32 = "堪稱宿敵的「那所學園」交鋒也只是時間的問題！"
10055180-33 = "宿敵～？"
10055180-34 = "哦～呵呵呵～！看來你們一路過關斬將呢～！"
10055180-35 = "不過，你們的連勝也就到此為止了～！"
10055180-36 = ""
10055180-37 = "果然出現了！？"
10055180-38 = "這個劇情發展也太刻意了吧……？"
10055180-39 = ""
10055180-41 = ""
10055180-42 = ""
10055180-43 = "區區不知品種的格黑娜雜種，而且還是寄居蟹，似乎掀起了一陣風波呢。"
10055180-44 = ""
10055180-45 = "傍晚海上得意的#n三巨頭"
10055180-48 = ""
10055180-50 = "「蟹鬥」是講究血統的運動。#n就讓你們切身體會這個事實吧。"
10055180-51 = "哼！還真敢大放厥詞啊！"
10055180-52 = "不知天高地厚的是你們吧。#n就憑卑賤的寄居蟹，也想贏過三一的名蟹？"
10055180-53 = "簡直是痴心妄想！哦～呵呵呵！"
10055180-54 = "嗚哇，渚醬……你怎麼了？"
10055180-55 = "壓力太大了嗎？還是吃到壞掉的蛋糕捲了？"
10055180-56 = ""
10055180-58 = ""
10055180-59 = "……"
10055180-60 = ""
10055180-62 = ""
10055180-63 = "……！"
10055180-64 = "……不對哦，彌香。"
10055180-65 = "嗯？"
10055180-66 = "如果是真正的朋友，這時候就不該是那種反應。"
10055180-67 = "什麼意思……？"
10055180-68 = "也就是說……"
10055180-69 = "茶都變難喝了！快把那下賤的雜種趕走吧！"
10055180-70 = "聖亞醬！？"
10055180-71 = "哦～呵呵呵！"
10055180-72 = "連渚醬也是！？"
10055180-73 = ""
10055180-75 = ""
10055180-76 = "……啊啊！！真是的！！我不管了啦！！"
10055180-77 = "放馬過來！！就讓我來教教不知天高地厚的雜種，什麼叫做尊卑有別吧！！"
10055180-78 = "終於露出真面目了啊，茶會！！"
10055180-79 = "三對一還真卑鄙啊！"
10055180-80 = "三對一？哼……"
10055180-81 = "有什麼好笑的？"
10055180-82 = "誠如我先前所說，蟹鬥是講究血統的運動……"
10055180-83 = "換言之，唯有派出優秀的選手才能贏得勝利。"
10055180-84 = "就讓我來介紹我們三一所能派出的最強選手吧！"
10055180-85 = ""
10055180-87 = ""
10055180-88 = ""
10055180-90 = ""
10055180-91 = "咦……怎，怎麼了？這裡是哪裡？"
10055180-92 = "那，那傢伙是！？"
10055180-93 = ""
10055180-95 = ""
10055180-96 = "……誰啊？"
10055180-97 = "是日步美同學。"
10055180-98 = "……日步美是誰？"
10055180-99 = "所以我才說不懂日步美同學那份獨特愛好的人就是這樣……"
10055180-100 = "那麼就拜託你了！日步美同學！"
10055180-102 = "咦！？渚大人！？現在這是什麼情況！？#n咦，咦咦！？"
10055180-103 = "咦咦咦咦！？"
