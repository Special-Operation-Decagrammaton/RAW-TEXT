10055180-19 = "[s1] \"Y-Yeah!\"\n[s2] \"I-I'm super curious, yeah!\""
10055180-22 = "Kihehe! Glad you asked!"
10055180-23 = "The answer is this! Our opponents are appearing in a set order!"
10055180-24 = "Think back. Whom did we encounter first?"
10055180-25 = "...Abydos, wasn't it?"
10055180-26 = "Right. A minor academy, nearly forgotten. And after them came...?"
10055180-27 = "Valkyrie Police School. With the angry director lady. Was she in a bad mood, or what...?"
10055180-28 = "Hmm. Dogs of the General Student Council though they are, they're leagues above the likes of Abydos. And then, just a short while ago, we met..."
10055180-29 = "Allied Hyakkiyako Academy. I see what you're getting at, Makoto."
10055180-30 = "Sharp as ever, Satsuki! That's right! Hyakkiyako may not compare to our Gehenna, but it is still a rather large academy."
10055180-31 = "In other words, each opponent has been stronger than the last! I predict our next foe will be stronger than Hyakkiyako, one whose strength might even compare to ours."
10055180-32 = "And soon enough, we'll face \"that academy\"...our greatest rival!"
10055180-33 = "Rival?"
10055180-34 = "Ohohoho! It seems you've been enjoying quite the winning streak!"
10055180-35 = "But I'm afraid that ends here."
10055180-36 = ""
10055180-37 = "Just as I thought! Here you are."
10055180-38 = "That is a ridiculously convenient turn of events..."
10055180-39 = ""
10055180-41 = ""
10055180-42 = ""
10055180-43 = "Rumor has it a mongrel from Gehenna, of dubious pedigree, has been causing a stir. And with nothing but a hermit crab, no less."
10055180-44 = ""
10055180-45 = "The Proud Triumvirate of the Evening Sea"
