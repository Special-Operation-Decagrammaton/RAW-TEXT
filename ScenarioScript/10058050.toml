[translation]
10058050-1 = "第5話;弱い者の話は聞かない"
10058050-2 = "おおーっと！これはどういうことでしょう！#nヴァルキューレ警察学校チーム、派手な爆発と共に脱落です～！"
10058050-3 = "優勝なんて朝飯前って感じだったんですけどね～"
10058050-4 = "イブキは朝ごはん食べたよー！"
10058050-5 = "戦車戦の基本はヒットアンドアウェイ！#nスタート地点付近で得点を重ねていましたが、#n奇襲攻撃を許してしまいましたね！"
10058050-6 = "今回初出場の183号特別クラスは、これが初撃破です！#nおめでとうございます～！！"
10058050-7 = "それでは、再び現場の様子を見る前に――"
10058050-8 = "先生、締めをお願いします！"
10058050-10 = ""
10058050-11 = "[ns] \"チャンネルは、そのままだよ！\""
10058050-12 = "ありがとうございます！！"
10058050-16 = ""
10058050-17 = "ぐはっ！！！"
10058050-19 = ""
10058050-22 = ""
10058050-23 = "イオリ！戦車をもう少し近くに寄せてください！この銃で直接殴ってやります！"
10058050-24 = "興奮しすぎだって……。チナツも止めてよ。"
10058050-25 = "無理です。さっきから、#n「万魔殿主催の大会で優勝カップを奪い取るのが風紀委員会の宿命だ」#nなんて言い出してますし……。"
10058050-26 = "一度スイッチが入った行政官を止められるのは、委員長だけです。"
10058050-27 = "ほら、もっと撃ち込みなさい！優勝の栄光は、委員長のものです！"
10058050-28 = "……ん？なんだ、あの光？"
10058050-29 = "光なんてどうでもいいでしょう！？目の前の敵にもうちょっと集中し――"
10058050-35 = "きゃあああっ！！！"
10058050-37 = ""
10058050-38 = "あの人、戦車の上で銃を振り回してた。"
10058050-39 = "変な不良みてぇな奴だな……。"
10058050-40 = "アスナ、プリズム砲は問題なかったか？"
10058050-41 = "だいじょーぶ！問題なしだよ～！"
10058050-42 = "まさか、ゲーム開発部のチビどもにやられるとはな……#nまあ、直せたから良かったけどよ。"
10058050-43 = "しっかし、やっぱ4人だときちーな……。#nトキは昨日からどこに行っちまったんだ？"
10058050-44 = "連絡も取れないから心配だ。"
10058050-45 = "トラブルに巻き込まれていなければ良いのですが……。"
10058050-46 = "そう簡単にやられる奴じゃないだろ？ 心配すんなって。#nつーか……なんでどいつもこいつも、うちの戦車を見るなりすげー勢いで噛みついてくるんだ！？"
10058050-47 = "もしかして、一番変だからー？あははっ！"
10058050-48 = "まあ、エンジニア部の奴らが作ったからな……。"
10058050-49 = "こんなヘンテコ戦車、他には一台もな……。"
10058050-50 = ""
10058050-51 = ""
10058050-52 = ""
10058050-53 = ""
10058050-54 = ""
10058050-55 = "……はあ？"
10058050-56 = "これは、私たちのと同じプリズム砲……？"
10058050-58 = ""
10058050-60 = "プリズムではありません。プリティメイドです。"
10058050-61 = "お前、どこほっつき歩いてたんだよ！！んで、何だその戦車は！！！"
10058050-62 = "私も同じものをエンジニア部の方にお願いしました。"
10058050-63 = "ネル先輩に、一度勝ちたいと思いまして。"
10058050-64 = "あいつら、それを引き受けたのか！？"
10058050-66 = ""
10058050-67 = ""
10058050-68 = "ミラーマッチはロマンだからね。"
10058050-69 = "設計図も、一度しか使わないのはもったいないです！"
10058050-70 = "面白そうだし。"
10058050-71 = "あいつら、ったく……！"
10058050-72 = "いいぜ、かかってこい！！ぶっ壊してやる！！"
10058050-74 = ""
10058050-75 = "[ns] \"ミラーマッチ！ミラーマッチ！ミラーマッチ！\""
10058050-76 = "これは予想外の展開ですね！#n行方をくらましていた部員が同じ型の戦車に乗ってくるとは！"
10058050-77 = "どっちが勝つんだろう？楽しみ～！"
10058050-78 = "同じ戦車同士なら、後は乗組員の腕で決まります！#nあっ！そんなことを言っている内に始まりました！"
10058050-79 = "カメラが追いつきません！防御も回避も一切ない、ノーガードの殴り合いです！"
