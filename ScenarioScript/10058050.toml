10058050-115 = "何かという質問に答えますと……スーパープリティメイドです。"
10058050-116 = "ピース、ピース。"
10058050-117 = "んなこと聞いてねぇよ！！！！"
10058050-118 = "今回の勝負は、私の勝ちです。"
