[translation]
10058050-1 = "제5화;약자의 말은 듣지 않는다"
10058050-2 = "아아앗-! 이게 웬일이죠! 발키리 경찰학교 팀, 화려한 폭발과 함께 탈~~~~락입니다!"
10058050-3 = "우승까지 식은 죽 먹기라는 느낌이었는데 말이죠~"
10058050-4 = "이부키는 식은 죽이 더 먹기 힘들던데!"
10058050-5 = "포사격의 기본은 쏘고 도망치는 거죠! 제자리에서 오랫동안 점수 이득을 보다가 그만 기습을 허용해 버렸군요!"
10058050-6 = "이번이 첫 출전인 183호 특별반, 이걸로 첫 격파를 달성했습니다. 축하축하축하!"
10058050-7 = "자, 다시 현장으로 가기 전에—"
10058050-8 = "선생님! 마무리 부탁드립니닷!"
10058050-11 = "[ns] \"채널 고정이래!\""
10058050-12 = "감사합니다앙-!!"
10058050-17 = "끄악!!!"
10058050-23 = "이오리! 전차를 좀 더 가까이 대주세요! 제 총으로 직접 때리고 싶군요!"
10058050-24 = "너무 신난 거 아니야? 치나츠도 좀 말려봐."
10058050-25 = "무리예요. 아까부터 만마전이 주최한 행사에서 우승컵을 가져오는 게 선도부의 숙명이라고 하질 않나……."
10058050-26 = "선임 행정관님이 한번 스위치 들어가면 히나 부장님이 오셔야 진정할 수 있을 거예요."
10058050-27 = "맹렬하게 공격하세요! 이 영광은 선도부장님의 것이에요!"
10058050-28 = "……응? 뭐지, 저 빛은?"
10058050-29 = "그런 사소한 거에 신경 쓸 시간에 눈앞의 적에 더 집중을 하—"
10058050-35 = "꺄아아악!!!"
10058050-38 = "저 사람, 전차 위에서 총을 휘두르고 있었어."
10058050-39 = "뭔가 이상한 깡패 같은 녀석이네……."
10058050-40 = "아스나, 프리즘 포에는 이상 없었어?"
10058050-41 = "응! 문제없이 잘 나갔어!"
10058050-42 = "게임개발부 꼬맹이들한테 그렇게 당할 줄이야……. 다행히 현장에서 고칠 수 있었네."
10058050-43 = "네 명이서 고치기 힘들었다구. 토키 녀석은 어제부터 어디로 간 거야?"
10058050-44 = "응. 연락도 되지 않아서 걱정이야."
10058050-45 = "뭔가, 곤란한 일을 겪고 있는 게 아니라면 좋겠는데 말이죠……."
10058050-46 = "쉽게 당할 녀석이 아니잖아? 걱정 말자구. 그보다, 왜 다들 우리만 보면 못 잡아먹어서 안달이야?!"
10058050-47 = "우리 전차가 제일 이상하게 생겨서 그런 거 아닐까? 아하핫!"
10058050-48 = "하기야, 엔지니어부 녀석들이 특이하게도 만들긴 했지……."
10058050-49 = "이런 괴상한 전차, 다른 팀은 끌고 나올 리가……."
10058050-55 = "……에?"
10058050-56 = "우리 것과 같은 프리즘 포……?"
10058050-60 = "프리즘보다는 프리티 메이드입니다."
10058050-61 = "넌 어디 갔다가 온 거야!! 그 탱크는 뭔데!!!"
10058050-62 = "저도 똑같은 걸로 엔지니어부의 분들께 주문했습니다."
10058050-63 = "네루 선배를 한번 이겨보고 싶었습니다."
10058050-64 = "엔지니어부 이 자식들, 그걸 또 들어준 거야?!"
10058050-68 = "미러 매치는 로망이니까."
10058050-69 = "설계도를 한 번만 쓰는 건 아깝잖아요!"
10058050-70 = "재밌어 보이기도 하고."
10058050-71 = "이, 이것들이 진짜……!"
10058050-72 = "다 덤벼!!! 박살 내주마!!!"
10058050-75 = "[ns] \"미러전! 미러전! 미러전!\""
10058050-76 = "이건 예상 밖의 전개군요! 배신한 부원이 같은 전차를 타고 오다니!"
10058050-77 = "어느 쪽이 이길까? 재밌겠다~!"
10058050-78 = "똑같은 전차의 대결이면, 나머지는 순수 실력으로 결판나겠죠! 아! 말씀드리는 순간 바로 격전이 시작됩니다!!"
10058050-79 = "카메라가 따라가지 못할 정도의 호각! 방어와 회피 모두 하지 않는 순수한 노가드 난타전이네요!"
10058050-105 = "헹. 토키와 엔지니어부 녀석들, 완전 약골이잖아!"
10058050-106 = "어떠냐! 전차도 다 부서졌으니 항복하시지!"
10058050-107 = "……."
10058050-110 = "뭐, 뭐야!!!"
10058050-115 = "누구냐고 물으신다면, 슈퍼 프리티 메이드입니다."
10058050-116 = "피스피스."
10058050-117 = "그걸 물었겠냐고!!!!"
10058050-118 = "이번 승부는, 제가 승리하겠습니다."
10058050-121 = "야, 얌마!!!"
10058050-126 = "거기, 로봇 메이드 씨! 실격입니다! 내려오세요!"
10058050-131 = "실격?"
10058050-132 = "저는 슈퍼 프리티 메이드입니다만."
10058050-133 = "그건 모르겠구요, 지금 변신하신 거 규정상 전차 판정이에요."
10058050-134 = "1팀 1전차 출전이 원칙이어서, 몰수패 처리합니다."
10058050-135 = "크하하! 꼴좋다!"
10058050-136 = "그리고, C&C 팀 분들도 탈락입니다. 차체 손상으로 기동 완전 불가능이에요."
10058050-137 = "뭐라고?!"
10058050-138 = "아하하! 재밌었다!"
10058050-139 = "그래도 예상보다 더 오래 남았었네."
10058050-140 = "게헨나가 온천이 많다던데, 씻고 노래방이라도 갈까요?"
10058050-141 = "너희들 뭐 이렇게 미련이 없어?!"
10058050-142 = "그치만 참가해서 재밌게 즐겼으면 된 거 아냐?"
10058050-143 = "야! 토키!! 너 이리 와!! 다시 붙어!! 반칙이잖아!"
10058050-144 = "싫습니다."
10058050-145 = "선배, 허접이잖아요."
10058050-146 = "저는 허접하고는 겨루지 않습니다."
10058050-147 = "넌 진짜 죽었어!!!"
10058050-153 = "둘 다 엄청 빠르네! 아하하!"
10058050-154 = "후훗. 힘이 남아도는 모양이야."
10058050-157 = "이야아……. 뭔가 대단한 걸 봤네……. 변신 외골격이라니, 대단해!"
10058050-158 = "됐으니까! 이쪽 오솔길로 쭉 가면 세 번째 표적이야. 빨리 가자!"
10058050-159 = "지금 가도 괜찮으려나? 갔다가 아까처럼 또 누구 마주치면 어떡해!"
10058050-160 = "그러니까 최대한 트랙은 피해서 샛길로 빠지는 거잖아!"
10058050-161 = "그러다가 변속기에 무리 가면 어쩌려고 그래?"
10058050-162 = "그럼 어쩔 건데?!"
10058050-163 = "아."
10058050-164 = "앞에, 전차."
10058050-165 = "여기로 와도 적이 있잖아!!"
10058050-166 = "장전!! 빨리빨리빨리!!"
10058050-167 = "크아악!! 포탄이 얼마나 무거운지 알아?! 양탄기는 왜 빼자고 해서 진짜!!"
10058050-168 = "표적 이외에는 포를 쏠 일 없을 줄 알았지! 레이싱이라고 들었으니까!!"
10058050-172 = "대, 대탄 장전! 표적 정보나 알려줘!"
10058050-183 = "1시 방향! 거리 130!"
10058050-184 = "현재 적 전차……."
10058050-189 = "……히치하이킹 중……?"
