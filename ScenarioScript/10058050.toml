10058050-131 = "失格なの？"
10058050-132 = "私はスーパープリティメイドです。"
10058050-133 = "そんなことはどうでもいいです。変身した選手は、ルール上戦車と判定します。"
10058050-134 = "戦車は1チーム当たり1台が原則なので、2台ですと反則になります。"
10058050-135 = "ははは！ざまあみろ！"
10058050-136 = "それと……車体の損傷で走行不能のため、C&Cチームも脱落となります。"
10058050-137 = "んだと！？"
10058050-138 = "あはは！あ～面白かった～！"
10058050-139 = "予想よりは長く残った。"
10058050-140 = "ゲヘナは温泉が多いようなので、#nそれを堪能してからカラオケにでも行きましょうか？"
10058050-141 = "お前たち、なんでそんなにあっさりしてんだよ！？"
10058050-142 = "みんなで十分楽しんだし、それでいいんじゃない？"
10058050-143 = "トキ、お前はこっちに来い！！もう一度勝負だ！！さっきのは反則だろ！！"
10058050-144 = "嫌です。"
10058050-145 = "先輩は下手なので。"
10058050-146 = "雑魚は相手にしません。"
10058050-147 = "誰が雑魚だゴルァ！！！"
10058050-148 = ""
10058050-153 = "二人とも、はっや～い！あはは！"
10058050-154 = "ふふっ、まだ力が有り余っているようだな。"
10058050-156 = ""
10058050-157 = "あれって、パワードスーツとかいうやつ！？すごい！！"
10058050-158 = "それより、こっちの細い道を行ったら3つ目の的だよ！早く行こう！"
10058050-159 = "さっきみたいに、また誰かに会ったらどうしよう……！"
10058050-160 = "そうならないために脇道使うんだって！"
10058050-161 = "それで変速機に負担がかかったら？"
10058050-162 = "も～！じゃあどうするの！？"
10058050-163 = "あ。"
10058050-164 = "前に、戦車。"
10058050-165 = "ここにも敵が！！"
10058050-166 = "装填！装填！早く早く早く！！"
10058050-167 = "ぐぎぎぎぃ～！砲弾、重すぎるって～！なんで揚弾機外すかなぁ！？"
10058050-168 = "的以外を砲撃するなんて思ってなかったもの！レースだって聞いてたし！"
