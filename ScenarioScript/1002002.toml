[translation]
1002002-1 = "무슨 생각을 하는 거야?"
1002002-2 = "(코하루가 부른 장소는 도서관이나 교실이 아닌 쇼핑몰이었다.)"
1002002-3 = "(분명 공부를 위해서 불렀다고 들었는데……)"
1002002-4 = "……와, 왔구나. 선생님."
1002002-5 = "기, 기다리고 있었어. 제시간에 맞춰 왔네?"
1002002-6 = "……응? 뭐라고?"
1002002-7 = "왜 공부를 하는데 이렇게 시끄러운 쇼핑몰에 왔냐고?"
1002002-8 = "그, 그야…… 그건……!"
1002002-9 = "응? 겸사겸사 놀러 온 거냐고……?"
1002002-10 = "아냐, 그런 거……."
1002002-11 = "보충수업…… 이번에도 솔직히 조금 간당간당해서……"
1002002-12 = "이왕 물어볼 거면 그래도 선생님이 좀 더 알기 쉽게 설명해주지 않을까 해서……"
1002002-13 = "서, 선생님이 이런 건 도와줘야하는 거니까……. 그치?"
1002002-14 = "……응? 그런 이야기가 아니라고?"
1002002-15 = "장소……?"
1002002-16 = "교실이나 도서관……!?"
1002002-17 = "좀 더 조용하고 사람 없는 곳으로……?"
1002002-18 = "……."
1002002-20 = "무, 무무 무슨 소릴 하는 거야!? 안 돼! 못 가! 거긴 절대로 안 돼!!"
1002002-21 = "그런 불결한 짓을 내가 할 거 같아?!"
1002002-22 = "[s1] \"……예?\"\n[s2] \"불결한 짓……?\""
1002002-23 = "여, 역시 사람 많은 번화가로 불러낸 게 답이었어!"
1002002-24 = "여, 역시 사람 많은 번화가로 불러낸 게 답이었어!"
1002002-25 = "다른 애들이라면 그랬을지도 모르지. 하지만 난 다 알고 있다고. 이미 수도 없이 책에서 읽었으니까!"
1002002-26 = "사람 없는 교실에서의…… 책상 위에서……창틀에서의 이렇고 그런……!"
1002002-27 = "도, 도서관도 마찬가지야! 책장과 책장 사이에서 그렇고 그런……!"
1002002-28 = "전부 다 알고 있으니까! 나는 그런 이벤트 따위에 걸리지 않거든!"
1002002-29 = "[s3] \"…………네??\"\n[s4] 우선 그 읽은 책들을 보여 달라고 한다."
1002002-30 = "……."
1002002-31 = "……."
1002002-32 = "예상은 하고 있었지만 그 이상이잖아……?"
1002002-33 = "[s5] \"………………네???\"\n[s6] \"보여줄 수 없는 책이라는 뜻……?\""
1002002-34 = "그, 그, 그그, 그런 게 아니라……."
1002002-35 = "그, 그, 그그, 그런 게 아니라……."
1002002-36 = "……."
1002002-37 = "……시, 시끄러워!!"
1002002-38 = "저질! 왕변태!!!"
1002002-40 = "(……)"
1002002-41 = "(그렇게 코하루는 반대 방향으로 뒤도 돌아보지 않은 채 달려 나가 사라졌다.)"
1002002-42 = "[s] \"……????\""
1002002-44 = "(……그리고 결국 그 '읽은 책'들이란 게 뭔지는 끝내 알려주지 않았다.)"
