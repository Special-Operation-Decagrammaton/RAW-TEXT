[translation]
13380-1 = "제38화;약속"
13380-4 = "유메…… 선배……?"
13380-7 = "응, 왜냐면 그건 내가 보지 못하는 모습이니까."
13380-8 = "그래서 늘 궁금했었어. 3학년이 된 호시노 쨩의 모습."
13380-9 = "그러니까, 미래의 호시노 쨩에게 보내는 편지 같은 느낌으로……. 이렇게 짠~ 이랄까."
13380-12 = "………………………………………………. 선배……."
13380-19 = "어때? 호시노 쨩? 훌륭한 선배는 되었어?"
13380-20 = "후배들을 잘 챙겨주고, 보살펴주고 모두를 지켜주는 믿음직한 선배가 되었어?"
13380-21 = "또 어려울 때 도와주러 오는 그런 소중한 친구는 생겼어?"
13380-22 = "후배들과 함께 씩씩하게 미래로 나아가고 있어?"
13380-23 = "또 그러면서 가끔씩은 으헤~ 하고 웃고 있을까?"
13380-27 = "유메 선배!!"
13380-28 = "선배……!! 선배……!!"
13380-29 = "선배, 저는…… 저는……, 늘, 언제나, 계속……."
13380-30 = "선배에게…… 저는……. 선배를…… 저는……."
13380-31 = "유메 선배…… 선배……. 저는……."
13380-32 = "으…… 으아아아아아아아아아-!!"
13380-33 = "으아아아아아아아아------!"
13380-34 = "아니요, 아니에요…… 저는……."
13380-35 = "걱정만 끼치고 사고만 치고 속만 썩이는 선배가 되었어요."
13380-36 = "저는…… 저는 쓸모없는…… 바보에다가…… 멍청이……."
13380-37 = "저는……. 모두에게…… 후배들에게 민폐만 끼치고 걱정만 끼치는…… 그런 바보 같은 선배일 뿐이에요."
13380-39 = "우웅…… 그거 왠지…… 나 같은데……?"
13380-40 = "네……. 선배처럼요."
13380-41 = "에헤헤…… 드디어 웃었다, 호시노 쨩."
13380-42 = "……그치만 그렇게 말해도 난 알 수 있어."
13380-43 = "호시노 쨩은 분명 후배들을 잘 지켜주고, 어려울 때 힘이 되어주고, 또 믿음직한…… 그런 멋진 사람이 되어 있을 거야!"
13380-44 = "난 바보지만, 내가 소중하게 생각하는 어떤 성격 나쁜 후배에 대해서는, 누구보다 잘 알고 있어! 분명해!"
13380-45 = "아니에요. 저는……."
13380-46 = "쉿."
13380-47 = "……?"
13380-48 = "그런 말 하지 마. 호시노 쨩은 언제나 노력해 왔으니까, 좋은 선배인 거야."
13380-49 = "……."
13380-50 = "수고 많았어. 호시노 쨩."
13380-51 = "고생했지? 힘들었지? 혼자서 노력한다고 말야."
13380-52 = "……네."
13380-53 = "……노력, 했어요. 언제나…… 힘이 되려고…… 늘……"
13380-54 = "네…… 그래왔어요. 선배. 늘…… 노력하려고 했어요……."
13380-55 = "힘들었지만…… 선배가 없어서 힘들었지만…… 노력해 왔어요……."
13380-64 = "그렇구나. 착하다, 아이 착해. 호시노 쨩. 쓰담쓰담~"
13380-65 = "……."
13380-66 = "으응? 이젠 숨 막힌다고 하지 않는 거야? 괜찮은 거야? 적응해 버렸어……?"
13380-67 = "유메 선배……."
13380-68 = "선배가 보고 싶어요."
13380-69 = "너무너무 보고 싶어요……."
13380-73 = "응, 나도 알고 있어. 호시노 쨩."
13380-74 = "그치만 아직 호시노 쨩에겐 해야 할 일이 남아 있잖아?"
13380-75 = "할 일……."
13380-76 = "응."
13380-78 = "가서 후배들을 지켜줘야지."
13380-84 = "호시노"
