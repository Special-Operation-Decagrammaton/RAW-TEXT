[translation]
1300402-1 = "우연한 만남이에요"
1300402-2 = "아비도스 변경의 외곽 시내"
1300402-3 = "(외부에서 볼일을 마치고 슬슬 샬레로 돌아가려고 하는 중…….)"
1300402-5 = "(스윽)"
1300402-7 = "얍!"
1300402-8 = "(깜짝)"
1300402-9 = "아하하~☆ 짜잔~ 놀라셨죠?"
1300402-10 = "[s] \"안녕, 노노미.\""
1300402-11 = "길을 걷다 선생님을 발견해서, 반가운 마음에 달려왔어요."
1300402-12 = "응? 여기에는 어쩐 일이냐고요? 아. 좀 사야할게 있어서요."
1300402-13 = "아시다시피 아비도스는 많은 가게들이 문을 닫아서……."
1300402-14 = "생필품을 사기 위해서는 꽤 멀리까지 나와야 하거든요."
1300402-15 = "그치만 괜찮아요. 이렇게 우연한 만남이 일어나기도 하니까요☆"
1300402-16 = "응응! 정말 기쁜 우연!"
1300402-17 = "그럼 저랑 같이 파르페 먹으러 갈래요? 이 근처에 잘 아는, 유명한 집이 있어요☆"
1300402-18 = "[s] \"그치만 다른 약속이…….\""
1300402-19 = "잡았다~☆"
1300402-20 = "선생님 이제 돌아가는 길이라는 거 알아요."
1300402-21 = "응? 어떻게 아냐고요? 그건 비.밀♡"
1300402-22 = "자, 그럼 출발~"
1300402-24 = "(노노미에게 붙잡혀서 근처의 파르페 카페로 들어갔다.)"
1300402-25 = "(1미터짜리 파르페를 각자 하나씩 시켜서 배부르게 먹었고,)"
1300402-26 = "(노노미가 계산하려고 하는 걸 말리고, 어른의 카드로 사주었다.)"
