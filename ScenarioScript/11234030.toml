[translation]
11234030-1 = "팀워크;최고의 프로그램 1"
11234030-2 = "으음……."
11234030-3 = "음……."
11234030-4 = "……카즈사 쨩? 왜 그래? 뭔가 고민에 빠진 얼굴인데."
11234030-5 = "아, 아니. 뭐 큰일은 아니고……."
11234030-6 = "뭔가 열심히 하는 거랑은 별개로, 손발이 좀 안 맞는달까, 조율이 안 되는 것 같은 느낌을 지울 수가 없네."
11234030-7 = "그래? 그럭저럭 맞춰져 가고 있다고 생각했는데? 그 정도로는 부족하려나?"
11234030-8 = "확실히……. 개인 연주 자체만 보자면 꽤 늘은 것 같지만……."
11234030-9 = "모인 요소들이 하나가 되지 못하면 무너지게 마련. 그것은 무엇이든 만고의 진리겠지."
11234030-10 = "다시 협동심을 키울 때로군. 합동 훈련이다."
11234030-11 = "아니, 지금이 이미 합동 훈련이거든."
11234030-12 = "나는 그냥 좀 더 맞춰보자는 느낌으로……."
11234030-13 = "갈-!!!!"
11234030-14 = "그런 나약한 마인드로는 천하제일 연주대회에서 살아남을 수 없다!!"
11234030-15 = "그런 대회였냐, 우리?"
11234030-16 = "서로 눈빛만 봐도, 아니 눈빛 교환조차 필요 없을 만큼 척하면 척이어야 해. 모두 하나의 음에 다 같이 몸을 실어야 해!"
11234030-17 = "하나의 음에 몸을 싣는다……. 그래. 바로 그런 훈련이 따로 병행돼야 한다!!"
11234030-19 = "……하나의 음……?"
11234030-20 = "다 같이 몸을……. 싣는다……?"
11234030-22 = "후훗. 이럴 수도 있겠다 싶어서 챙겨 왔지. 이제부터 우리가 해야 할 일은……."
11234030-23 = "……바로 \"합동 체조\"!!"
11234030-24 = "그건 또 뭐야."
11234030-25 = "보나마나 또 이상한 거겠지. 이 패턴도 이제 익숙하잖아."
11234030-26 = "후후후……. 여긴 내게 맡겨."
11234030-27 = "최고의 프로그램을 선사해 주지!!"
