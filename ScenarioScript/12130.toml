[translation]
12130-1 = "제13화;놓쳐버린 것"
12130-4 = "아비도스 대책위원회에게"
12130-5 = "아아. 이렇게 편지로 작별인사하는 걸 용서해줘. 아무래도 이 아저씨는 이런 구식이 편하니까 말야."
12130-6 = "모두에게 말하지 않은 게 있었어."
12130-7 = "사실 나는 오래 전부터 누군가에게 스카웃 요청을 받고 있었어."
12130-8 = "종신으로 카이저 PMC의 용병으로 일하는 조건으로 아비도스가 진 빚을 갚는다. ……그런 이야기야."
12130-9 = "……으헤~ 생각보다 괜찮은 조건이지? 아저씨는 꽤 능력을 인정받고 있으니까."
12130-10 = "빚은 내가 어떻게든 해결할게. 전부는 아니지만 이걸로 꽤 부담이 덜어질 거야."
12130-11 = "블랙 마켓에서는 건방진 말을 했지만 말야. 그 말을 내가 지키지 못하게 되어서 미안해."
12130-13 = "(스윽 스윽)"
12130-14 = "이걸로 됐지?"
12130-15 = "……. 네. 계약서에 싸인. 확인했습니다. 호시노 씨."
12130-16 = "호시노 씨가 가진 학생으로서의 모든 권리는 저희에게 이관되었습니다."
12130-19 = "이걸로 아비도스 학교가 지고 있던 빚은 대부분 상환이 됩니다."
12130-21 = "그러니까, 이걸로 대책위원회는 괜찮을 거야."
12130-22 = "아비도스 학교도, 키보토스도 떠나게 되었지만, 그러니까 괜찮아."
12130-23 = "이 아저씨를 원망해도 좋아."
12130-24 = "그치만 이 모든 건 내가 책임져야만 할 일이야."
12130-25 = "나는 아비도스의 마지막 학생회니까."
12130-26 = "그러니까 여기서 안녕이야."
12130-28 = "선생님께."
12130-29 = "있지- 사실 나는 어른을 싫어했거든. 별로 믿지 않았어."
12130-30 = "그치만 시로코 쨩이 선생을 업고 왔다고 했을 때부터 이야, 이런 글러먹은 어른도 있는건가. 싶었어. 으헤헤~ 그치만 그렇잖아?"
12130-31 = "당신같은 어른을 마지막으로 만날 수 있었다는 게 나한테는……. 아니, 간지러운 말은 하지 않는게 좋겠지?"
12130-32 = "선생님."
12130-33 = "염치없지만 부탁할게. 시로코 쨩은 근본은 착하지만 옆에서 받쳐주지 않으면 어디로 튈지 모르는 아이야."
12130-34 = "그 녀석이 나쁜 길로 빠지지 않게 다잡아줬으면 해."
12130-35 = "부탁드립니다."
12130-38 = "자아, 이 차를 타라."
12130-39 = "……. 이제 어디로 가는 거지?"
12130-40 = "아비도스 사막."
12130-45 = "모두에게."
12130-46 = "우리의 학교를 지켜줘."
12130-47 = "사막뿐인 곳이지만 나한테 남은 의미라곤 이것 밖에 없으니까."
12130-48 = "그리고 어딘가에서 혹시라도 적으로 마주치게 된다면,"
12130-49 = "그땐 내 헤일로를 파괴해 줘."
12130-50 = "부탁할게."
12130-52 = "호시노 선배!!!!!!"
12130-54 = "뭐야, 뭐가 잘난척 이야기해놓고!! 위급할 때 어쩔 수 없다는 핑계를, 선배가 대고 있잖아!!"
12130-55 = "이런 걸 용납할 수 있을 거 같아?"
12130-56 = "호시노 선배는 어디로 간 거지? 당장 구하러 가야 해."
12130-57 = "필요하면 나 혼자라도 가겠어. 대책위에 폐를 끼친다면 나도……."
12130-58 = "다들 조용히 해요!! 지금은 이렇게 서로 싸울 때가 아니라……."
12130-59 = "콰콰콰콰아아아아앙---!!!"
12130-60 = "우, 우와앗-?!"
12130-61 = "폭발 소리다! 뭐지?!"
12130-62 = "가, 가까워요…… 이건……."
12130-63 = "……."
12130-64 = "어, 어어-?!"
12130-66 = "콰아아아아아아앙--!!"
12130-68 = "진격하라."
12130-69 = "진격하라."
12130-71 = "으, 으아아-!"
12130-72 = "도망쳐!!"
12130-74 = "이 자치구의 퇴거 명령이 떨어졌다."
12130-77 = "후후후. 후후후후후."
12130-78 = "드디어, 드디어 마지막 조건이 완성되었다."
12130-79 = "마지막 학생회가 아비도스를 자퇴했고, 이걸로 아비도스 학교는 사라졌다!!"
12130-80 = "남은 건 우리 카이저가 아비도스를 흡수 합병하는 것!"
12130-82 = "아비도스 학교를 점령해라!"
12130-84 = "아비도스 학교를 향해 수, 수백의 PMC병력이 진격 중!"
12130-85 = "대체…… 뭐야?! 어째서 카이저가?! 자, 잘 이해를 못하겠어……."
12130-86 = "마, 막아야 해요!! 지금 이게 무슨 의미이든, 멋대로 우리 아비도스를 공격하는 걸 두고 보면……."
12130-87 = "맞아. 생각할 시간이 없어. 당장 움직여야 해!"
12130-88 = "하, 하지만 병력이 너무 많아요! 이런 병력을 우리들끼리만 상대할 수는 없어요!"
12130-89 = "게다가 저 도시를 향한 무차별 공격을…… 일단 시민들을 대피시켜야……!"
12130-93 = "이, 이런 규모의 전투…… 대체……. 갑자기…… 또…… 이런……."
12130-98 = "대책위원회 발견했다! 이쪽이다!!"
12130-100 = "크윽?!"
12130-104 = "적의 척후다. 벌써 여기까지……."
12130-105 = "아비도스 학교에 카이저 PMC의 척후병 다수 접근! 이미 교내로 침입했어요!"
12130-106 = "일단 학교 내에 침입한 적들부터 해치워야 해!! 아야네 쨩! 부탁해!"
12130-107 = "네! 선생님의 안전을 최우선으로, 학교에 침입한 적들을 퇴치합니다!"
12130-109 = "학교의 안전을 확보한 뒤에는 시민 여러분을 피난시킵니다!"
