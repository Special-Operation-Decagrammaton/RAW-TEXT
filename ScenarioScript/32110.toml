[translation]
32110-1 = "제11화;제2차 평가 시험 2"
32110-2 = "게헨나 자치구 거리"
32110-5 = "어찌어찌 게헨나 자치구에 도착하긴 했는데……."
32110-6 = "그런데 왜 이렇게 거리에 인적이 없죠? 아무리 새벽이라지만……."
32110-10 = "총소리야. 어디선가 전투가 벌어지고 있어."
32110-11 = "으응…… 이 주소로 가려면 이쪽으로 한참을 가야해요. 자, 다시 움직이죠."
32110-15 = "어라……. 검문소가……."
32110-16 = "멈춰! 여기는 출입금지다!"
32110-17 = "오늘은 이쪽 거리 전체가 외출 금지령이 내려졌어! 학교로 돌아가지 않으면……."
32110-18 = "……어? 너, 너희는 트리니티 학생들?"
32110-19 = "트리니티가 여긴 웬일이냐! 설마…… 습격을……. 네녀석들, 게헨나에는 웬일이냐! 목적이 뭐냐!"
32110-20 = "네?! 아, 아니에요! 저희는 그냥 여기를 지나갔으면 해서……."
32110-21 = "트리니티 녀석들이 게헨나에 목적없이 왔을 리가 없잖아! 트리니티 녀석들에게 '그냥' 이라는 건 없어!"
32110-22 = "어머나…… 저희는 그냥 시험을 치려고 온 거예요. 문제를 일으키러 온 게 아니라……."
32110-23 = "트리니티가 시험을 치러 왜 게헨나 자치구에 와!! 거짓말도 최소한 말이 되게 해야지!!"
32110-24 = "여, 역시 그렇죠…… 아우……."
32110-25 = "자, 잠깐만? 저기 저 녀석, 정의실현부 유니폼이잖아……?!"
32110-31 = "뭐?! 지, 진짜다! 습격이다! 정의실현부의 습격이야!"
32110-33 = "상부에 보고해! 정의실현부의 대규모 공격이다!!"
32110-35 = "뭐?! 자, 잠깐만……?! 오, 오해야! 이, 이건……."
32110-36 = "별 수 없군. 해치운다."
32110-37 = "네?! 오해를 더 가중시키는 방법이잖아요?!"
32110-43 = "크, 크아아악?!"
32110-44 = "스, 습격이……."
32110-48 = "아즈사 쨔아아아앙?!"
32110-49 = "……아니, 내가 아냐."
32110-50 = "네. 유탄은 저희 뒤편에서 날아왔어요. 누가 우릴 도와준 건지……."
32110-54 = "어머나★ 역시나 선생님이 맞네요."
32110-55 = "후후후. 그렇네요. 선생님, 여기서 뭘 하고 계신 거죠?"
32110-56 = "[s] \"미식연구회!\""
32110-58 = "어, 얼마 전에 싸웠던……!"
32110-59 = "어머나…… 그 수족관을 습격했던……."
32110-60 = "아, 아우……."
32110-62 = "……그렇군요. 상황은 이해했습니다. 요컨대, 이 주소로 가야 한다는 말씀이군요?"
32110-63 = "[s] \"매우 중요하고 급한 일이야.\""
32110-64 = "흐음, 사정은 알겠지만 여기는 지금 상당히 큰 소요가 발생해서 위험한 상태입니다. 모르셨나 보네요."
32110-65 = "온천개발부가 시가지 한가운데를 뻥★ 하고 터트렸거든요. 아무튼 와장창인 상황이에요."
32110-66 = "지금 그것 때문에 선도부에 비상이 걸렸습니다. 덕분에 저희도 선도부 감옥에서 탈출할 수 있었지만. 후후."
32110-67 = "네, 그러네요. 위급한 순간에 급양부가 급식 트럭을 흔쾌히 빌려줘서 다행이었어요★"
32110-68 = "읍!! 읍읍읍!!"
32110-69 = "아아, 정말이지 새로 산 지 얼마 안 된 트럭까지 이렇게…… 후우카 씨의 우정은 잊지 않을게요."
32110-70 = "읍!!!!! 으읍!!!"
32110-72 = "어…… 저기…… 저분은 묶인 채로 트렁크에 실려있는데……."
32110-74 = "문제없습니다. 후우카 씨도 몇 번이나 해본 거라 익숙할 거예요."
32110-75 = "누구보다 전문가죠★"
32110-76 = "(치익) 하루나! 아카리! 어디야! 이쪽도 포위망을 뚫었다고! 랑데뷰 포인트에서 만나!!"
32110-77 = "(치익) 으아아! 쫓아오고 있어! 선도부가 쫓아오고 있어!!"
32110-78 = "준코 씨, 탈출작전은 취소입니다."
32110-79 = "(치익) 뭐?! 무슨 소리야?"
32110-80 = "후후, 얼마전에 있었던 신세도 갚을 겸해서요. 선생님과 트리니티 학생들을 목적지까지 안내합니다."
32110-81 = "네★ 자세한 건 만나서 얘기해요. 그럼 타세요, 출발합니다!"
32110-82 = "[s] \"부탁할게.\""
32110-84 = "아, 아우……. 그럼 신세지는 걸로……."
32110-85 = "급양……? 정말 급식 트럭인가 보네."
32110-89 = "자아, 꽉 잡으세요★ 출발합니다."
32110-91 = "(2시간 뒤…….)"
32110-95 = "으아아아아아아-!!"
32110-99 = "뭐, 뭐죠?! 뭐가 어떻게 된 거죠?! 어, 어쩌다 이런 상황이 된 거죠?!"
32110-100 = "히후미! 흔들지 마! 조준이 힘들잖아!"
32110-101 = "제, 제가 흔드는 게 아니에요! 따, 땅이 흔들리는……."
32110-105 = "우와아아아, 또 터졌어요!!"
32110-108 = "오, 트리니티 아가씨 바이크 운전 굉장해!"
32110-109 = "파이팅-!"
32110-110 = "네?! 파, 파이팅이 아니라구요오-!"
32110-111 = "아카리 씨, 다음 8초 뒤에 다시 폭격입니다."
32110-112 = "네★ 문제없어요."
32110-117 = "그만둬어어--!! 하루나아아!!"
32110-118 = "후우카 씨도 응원해주시는군요. 좋습니다, 여기선 조금 더 흥을 돋우도록 하죠."
32110-119 = "좋은 생각이에요, 하루나★"
32110-125 = "포, 포크레인?! 불도저도 쫓아오고 있어!!"
32110-126 = "여, 영문을 모르겠어요! 어째서 게헨나의 온천부에게 쫓기고 있는 거죠?"
32110-127 = "선도부도 쫓아오고 있어!"
32110-128 = "(치익) 여기는 브라보팀. 알파팀 응답하라."
32110-129 = "아, 아즈사 쨩?!"
32110-130 = "음어 사용 요망. 아니, 그건 됐고. 양동작전은 실패했다. 이쪽은 포위당했어."
32110-131 = "네?! 뭐라고요?"
32110-132 = "앞은 화염방사기를 든 온천부가 가로막고 있고 뒤로는 트윈테일의 선도부에게 퇴로가 막혔어."
32110-133 = "하나코와 나는 어떻게든 자력으로 도망칠 테니 랑데뷰 포인트에서 만나자. 그럼 행운을 빌어."
32110-134 = "(딸깍)"
32110-135 = "네?! 영문을 모르겠어요-!!"
32110-136 = "저희는 보충수업부의 평가시험을 보려는 것뿐인데……!!"
32110-137 = "대체 이게 뭐죠?! 으아아아아-?!"
32110-150 = "아, 아우……."
32110-151 = "여, 여기야……? 시험장소가……?!"
32110-152 = "[s] \"둘 다 무사했구나.\""
32110-153 = "선생님! 괜찮아?!"
32110-154 = "서, 선생님……. 무사하셨군요. 아우우……."
32110-155 = "급양부 트럭이 강물로 점프했을 때는 이제 전부 다 끝났다고 생각했었는데……."
32110-156 = "[s] \"물에 잠기면서 엄지손가락을 치켜올려준 하루나는 굉장했지…….\""
32110-157 = "아! 지, 지금 몇 시야? 아즈사랑 하나코는?!"
32110-158 = "네♡ 저희도 도착했어요."
32110-162 = "(후욱- 후욱-) 2시 45분. 제시간에 도착했군. 다행이야."
32110-164 = "……."
32110-165 = "……."
32110-166 = "[s] (무슨 일이 있었는지…… 묻지 않기로 한다.)"
32110-168 = "시험 장소가 여기야……?"
32110-169 = "게헨나 자치구 15-77구역 폐건물 1층…… 네, 제대로 찾아온 게 맞아요. 이 판자 건물 이네요."
32110-170 = "아우…… 여기서 대체 어떻게 시험을 친다는 걸까요……. 누가 와 있나……?"
32110-171 = "아니. 그렇진 않은 거 같아. 하지만 연락할 수단 같은 건 준비해 뒀겠지."
32110-179 = "……과연. 이걸 발견했어."
32110-180 = "응? 이게 뭐죠? 포탄 같은데…… 불발탄인가요?"
32110-181 = "L118 견인포의 탄두야. 선전문구 살포용인데…… 뇌관과 폭약을 제거해서 폭발하지 않게 한 거겠지."
32110-182 = "……과연. L118이라면 티파티의…… 즉, 이건 나기사 씨가 보낸 거군요."
32110-183 = "응. 이 안에 뭔가 있을거야……."
32110-184 = "열어보겠어."
32110-188 = "(딸칵)"
32110-189 = "……탄두 안에 종이가…… 이게 저희의 시험지인가 보네요!"
32110-190 = "과연……. 훼손된 부분도 없어. 그리고 이건…… 통신기 같은데."
32110-191 = "(치익) 무사히 잘 도착하셨나 보네요."
32110-192 = "나, 나기사 님?!"
32110-193 = "……."
32110-194 = "저, 저분이 티파티의……?"
32110-195 = "[s] \"나기사! 너는--!!\""
32110-196 = "후후……. 원망의 소리가 들리는 것 같군요. 참고로 이건 녹화 영상이니 저에게 말을 걸어봤자 소용없습니다."
32110-197 = "[s] \"…….\""
32110-198 = "좋습니다. 그럼 약속한 시간까지 시험을 진행해서 돌아오시면 됩니다."
32110-199 = "참고로 여기서도 계속 모니터링하고 있으니 다른 생각은 하지 마시고……. 그럼 행운을 빌겠습니다. <보충수업부> 여러분."
32110-200 = "우연한 사고도 조심하시길."
32110-202 = "(찰칵)"
32110-203 = "아우우……."
32110-204 = "우연한 사고……?"
32110-205 = "자, 시간이 없어. 빨리 시작하자."
32110-206 = "네, 네! 모두들 들어가요. 제2차 평가 시험, 시작합니다!"
32110-207 = "네. 그래요."
32110-208 = "으, 응!"
32110-209 = "[s] \"그래! 시작하자!\""
32110-215 = "여기야?"
32110-216 = "음. 주소를 보니 여기가 맞네. 여기서부터 저쪽까지야."
32110-217 = "헤헤, 어디서 온 정보인지는 모르겠지만, 온천이 있는 장소를 친절하게 알려주다니, 고맙게도 말야."
32110-218 = "자, 발파 준비!"
