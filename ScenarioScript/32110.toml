32110-228 = "하나코 - [FF6666]시험지 분실 (낙제)[-]"
32110-230 = "아즈사 - [FF6666]시험지 분실 (낙제)[-]"
32110-232 = "코하루 - [FF6666]시험지 분실 (낙제)[-]"
32110-234 = "히후미 - [FF6666]시험지 분실 (낙제)[-]"
32110-236 = "시, 시험지가……! 시험지가……!!"
32110-237 = "흔적도 없이 날아가버렸어……."
32110-238 = "……선생님. 괜찮으세요?"
32110-239 = "[ns] \"응. 괜찮아…….\""
32110-240 = "과연……. 이렇게까지 해버린다는 거네요……. 후후후……. 재밌네요. 후후후후♡"
