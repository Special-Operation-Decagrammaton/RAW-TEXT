[translation]
1601005-1 = "마이스터의 살벌한 독촉"
1601005-5 = "샬레 업무관"
1601005-8 = "왔구나, 선생님."
1601005-9 = "기다리고 있었어."
1601005-10 = "[s1] \"……다녀왔습니다?\"\n[s2] \"그 차림, 무슨 일이라도 있어?\""
1601005-11 = "그야 오늘의 업무는 '응원'이니까."
1601005-12 = "그야 오늘의 업무는 '응원'이니까."
1601005-13 = "전에도 말했지만, 세상의 모든 일에는 최적의 작업복이 존재하니까……"
1601005-14 = "오늘도 선생님을 응원하기 위해 치어리더 의상을 입어보았어."
1601005-15 = "……어때. 의욕이 생겨나는 것 같아?"
1601005-19 = "[ns3] \"……잘 모르겠어.\"\n[ns4] \"여전히 일하고 싶지는 않은데…….\""
1601005-22 = "괜찮아. 내가 가져온 발명품을 사용하면 선생님도 금방 의욕이 돋아날 테니까."
1601005-23 = "지난번에는 서류 업무의 특성을 제대로 이해하지 못해서 응원을 하기는커녕 오히려 선생님의 집중력을 흩트려버린 것 같지만……"
1601005-24 = "……이번에는 괜찮아. 최소한 응원술은 흔들지 않을 테니까."
1601005-32 = "……자, 이게 내가 준비한 궁극의 응원 도구야."
1601005-33 = "[s] \"……워드프로세서?\""
1601005-34 = "응. 문서 작성에 특화된 PC. 대부분의 기능은 기존의 워드프로세서 기기와 크게 다르지 않아."
1601005-35 = "……하지만 이 워드프로세서에는 특별한 기능이 하나 추가되어 있지."
1601005-41 = "선생님. 한번 이 워드프로세서 기기를 사용해서 업무를 진행해 볼래?"
1601005-42 = "마감이 급한 업무일수록 효과적이야."
1601005-43 = "[s] 마감이 얼마 남지 않은 보고서를 작성한다."
1601005-51 = "[ns] \"큰 효과가 없는 것 같은데…….\""
1601005-52 = "후훗. 걱정하지 마."
1601005-53 = "이 기기의 진가는 집중력이 흐트러졌을 때 발휘되니까."
1601005-54 = "……지금은 평소에 일을 하는 것처럼 계속 업무를 진행해줘."
1601005-57 = "(약 10분 뒤…….)"
1601005-63 = "[ns] \"좋은 문장이 더 이상 떠오르지 않는데…….\""
1601005-67 = "<알림. 1분 이상 새로운 문장이 입력되지 않았습니다.>"
1601005-68 = "<새로운 문장을 지속하여 입력하지 않으면…… 2분 뒤 '소거 절차'가 시행됩니다.>"
1601005-69 = "[s] \"……소거 절차?\""
1601005-70 = "응. 이 워드프로세서에는 타이머가 설정되어 있거든."
1601005-71 = "그래서 업무를 시작하고 3분 동안 아무런 조작 없이 워드프로세서를 방치하면……"
1601005-72 = "……기기가 자폭하게 돼."
1601005-73 = "[s5] \"자폭?!!\"\n[s6] \"어째서 그런 기능을 넣은 거야?\""
1601005-74 = "흔히 마감을 앞두면 평소보다 집중력이 높아지고, 작업의 능률도 높아진다고 하잖아?"
1601005-75 = "흔히 마감을 앞두면 평소보다 집중력이 높아지고, 작업의 능률도 높아진다고 하잖아?"
1601005-76 = "같은 업무라도 사람의 두뇌는 환경에 따라 다른 효율을 내기도 하지."
1601005-77 = "이 기기는 사용자에게 마감과 같은 환경을 항시 제공해주는 데 목적을 두고 있어."
1601005-78 = "공들여 작업한 보고서가 통째로 날아갈지도 모른다는 압박이 가해지면…… 아무리 일이 하기 싫어도 억지로 손을 움직이게 되겠지."
1601005-79 = "[s] \"악마적 발상……!\""
1601005-83 = "아, 선생님. '작업물 소거'까지 앞으로 1분 남았어."
1601005-87 = "[ns] \"무엇이라도 적지 않으면…….\""
1601005-90 = "<주의. 방금 작성한 문장은 현재 작성 중인 보고서와는 관계없는 문장으로 파악됩니다.>"
1601005-91 = "<해당 문장은 보고서를 작성한 시간에 포함되지 않습니다.>"
1601005-92 = "[s] \"……어째서?!\""
1601005-93 = "이 워드프로세서에는 문장의 순서와 맥락을 판단하는 간단한 AI가 포함되어 있거든."
1601005-94 = "시간을 때우기 위해 적당히 채워 넣는 문장은 업무로 판단하지 않아."
1601005-95 = "자, 선생님. 공들여 작성한 보고서가 날아가는 게 싫다면……"
1601005-101 = "좀 더 의욕을 내서 키보드를 누르는 게 좋을 거야."
1601005-102 = "[s] \"……순 억지야…….\""
1601005-103 = "힘내라~ 힘내라~"
1601005-105 = "(히비키의 발명품 덕분에 엄청나게 빠른 시간 내에 보고서를 완성할 수 있었지만……)"
1601005-106 = "(악용되는 일을 막기 위해, 자폭 기능이 포함된 워드프로세서 기기는 압수했다…….)"
