[translation]
1300903-1 = "츠바키의 수행법 : 도구편"
1300903-3 = "[ns1] \"그런 문자를 받고 찾아왔다만.\"\n[ns2] \"수행도구가 망가졌다니, 무슨 일이야?\""
1300903-4 = "이게 망가졌어……."
1300903-5 = "이게 망가졌어……."
1300903-8 = "(츠바키가 보여준 건 너덜너덜해져서 쿠션이 전부 빠져버린 베개였다.)"
1300903-9 = "[s] \"……베개?\""
1300903-10 = "아니야. 선생님. 베개가 아니라 우리 수행부의 비품. 수행 도구야."
1300903-11 = "지금까지 잘 써온 물건이었는데. 어젯밤에 야간 순찰을 하면서 조금 격하게 돌아다녔더니만……."
1300903-12 = "방패 안에 넣어 놨던 수행 도구가 이렇게 너덜너덜……."
1300903-13 = "[s] \"평소엔 거기에 보관하는 구나…….\""
1300903-14 = "수행 도구는 몸에서 떨어트릴 수 없으니까?"
1300903-15 = "그래서 말인데, 선생님. 새로운 수행 도구를 마련하고 싶은데."
1300903-16 = "같이 사러 가줄래? 응?"
1300903-17 = "[s] \"뭐, 어쩔 수 없지. 좋아.\""
1300903-18 = "으응, 후후후, 고마워~ 선생님~"
1300903-20 = "백귀야행 대형마트 너굴너굴"
1300903-22 = "[ns] \"결국 어떤 베개를 살 생각이야?\""
1300903-23 = "선생님. 베개가 아니라. 수행 도구."
1300903-24 = "기왕 새로 마련하는 거, 뭐가 좋을지 선생님의 의견도 듣고 싶어."
1300903-25 = "아무래도 수행 도구의 세계는 심오해~"
1300903-26 = "목침은 딱딱해서 호불호가 갈리지만. 이게 또 익숙해지면 엄청 편안해서 벗어날 수가 없는걸~"
1300903-27 = "오리털을 채워 넣은 수행 도구는 베기만 하면 바로 꿈나라로 갈 수 있어~"
1300903-28 = "메모리폼으로 만든 건, 또 어떤 상황, 어떤 순간이라도 날 받쳐준다는 안정감 때문에 포기하기 어려워~"
1300903-29 = "[s] \"평소 느긋하던 츠바키가 이런 데서는 무척 의욕적으로…….\""
1300903-30 = "수행부의 부장이니까……?"
1300903-31 = "좀 더 수행에 정진하기 위해서라도 도구를 고르는 것도 허투루 할 순 없는걸~"
1300903-32 = "자, 그럼 매장을 돌아보자."
1300903-34 = "(한동안 츠바키와 함께 매장을 돌며 어떤 베개……가 아니라.)"
1300903-35 = "(수행 도구가 수행에 쓰기 좋을지 탐색을 계속했다.)"
1300903-38 = "[ns3] \"이건 어때? 목의 피로를 줄여주는,\"\n[ns4] \"지금까지 없었던 저반발 라텍스 베개래.\""
1300903-39 = "우음. 나쁘지 않은 선택이지만……."
1300903-40 = "우음. 나쁘지 않은 선택이지만……."
1300903-41 = "[s] \"선택이지만?\""
1300903-42 = "너무…… 무난한 느낌?"
1300903-43 = "선생님 생각은 어때? 이걸로 괜찮을까?"
1300903-44 = "[s] \"츠바키. 그럴 때는 우선순위를 정하자.\""
1300903-45 = "우선순위~?"
1300903-46 = "[s5] \"츠바키의 수행에 있어 가장 중요한 게 무엇인지.\"\n[s6] \"그리고 츠바키가 가장 먼저 바라는 것이 무엇인지.\""
1300903-47 = "중요한 것과 내가 바라는 것……."
1300903-48 = "중요한 것과 내가 바라는 것……."
1300903-49 = "……(끄덕)"
1300903-50 = "……선생님의 말을 듣고 나니, 좀 알 것 같아."
1300903-51 = "그……, 나는 수행부의 부장이니까."
1300903-52 = "부원들에게 모범이 되기 위해서라도, 좀 더 열심히 수행을 해야 한다고, 생각해……."
1300903-53 = "그러니까 스스로에게 부끄럽지 않은 수행을 하고 싶어."
1300903-54 = "[s] \"그게 중요하다고 생각하는구나.\""
1300903-55 = "응, 그러니까 이대로 안일하게 안주하기보다……."
1300903-56 = "좀 더 도전 의식을 가지고, 그동안 시도하지 않았던 과감한 시도를 해볼 필요가 있을지도……?"
1300903-57 = "[s] \"과감한 시도라면?\""
1300903-58 = "단순히 평범한 도구에 의존할 게 아니라……."
1300903-62 = "자, 선생님. 이건 어떨까? 껴안고 자는 수행 도구래."
1300903-63 = "[s] \"껴안고 자는 수행 도구?\""
1300903-64 = "음, 부피가 큰 건 조금 걸리지만."
1300903-65 = "여기, 주문 특이사항에 <원하시는 전신 일러스트를 넣을 수 있다고>……."
1300903-66 = "응? 베개, 가 아니라 수행 도구에 그런 게 왜 필요해……? (갸웃)"
1300903-67 = "[s] \"다, 다른 걸로 하자!\""
1300903-68 = "별로일까~?"
1300903-69 = "아, 이런 것도 있어. 선생님."
1300903-70 = "앞면엔 YES, 뒷면엔 NO가 그려진 수행 도구래."
1300903-71 = "[s] \"앗, 츠바키 그 물건은……!\""
1300903-73 = "짠, 자, 선생님. 선생님은 수행을 열심히 하고 있나요?"
1300903-74 = "[s7] \"예……예스!\"\n[s8] \"노, 노우!\""
1300903-75 = "응? 선생님 엄청 식은땀을 흘리고 있는데, 괜찮아?"
1300903-76 = "응? 선생님 엄청 식은땀을 흘리고 있는데, 괜찮아?"
1300903-77 = "신혼부부 사이에서 유명한 베개라고? 신기하네~"
1300903-79 = "아하하, 선생님. 선생님. 이 베개 봐봐. 위기상황에 투척하기 좋은 유인용 페로로 베개래."
1300903-80 = "[s] \"이제는 수행 도구가 아니라 베개라고 부르는 거구나?!\""
1300903-82 = "선생님. 이거."
1300903-84 = "그리고, 선생님 이것도."
1300903-86 = "(한동안 그렇게 츠바키와 갖은 수행 도구……가 아니라 베개를 찾아다니면서 돌아다녔다.)"
1300903-88 = "[ns] \"결국 별다른 소득 없이 해가 저물어버렸네.\""
1300903-89 = "으응, 그러게. 하아암……."
1300903-90 = "[s9] \"츠바키, 많이 졸린가 봐.\"\n[s10] \"어때, 여기서 잠깐 쉬다 갈까?\""
1300903-91 = "으, 응. 그럼. 잠깐만 실례-"
1300903-92 = "으, 응. 그럼. 잠깐만 실례-"
1300903-93 = "[s] \"엇? 어어, 츠, 츠바키?\""
1300903-97 = "[s] \"저기……. 츠바키 쨩?\""
1300903-98 = "으응. 흠냐흠냐."
1300903-99 = "이렇게……. 선생님한테 무릎 베개를 받고 있으니까."
1300903-100 = "알 거 같아……."
1300903-101 = "최고의 베개는 멀리 있지, 않았, 네……."
1300903-103 = "[s] \"저, 저기요?\""
1300903-104 = "……."
1300903-105 = "[s] \"츠바키 쨩……?\""
1300903-107 = "쿠울……."
1300903-109 = "(그 뒤로 해가 저물고, 양다리에 쥐가 날 때까지 일어나지 못했다.)"
