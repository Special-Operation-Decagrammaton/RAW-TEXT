[translation]
10031010-1 = "제1화;협력 요청"
10031010-12 = "(그렇게 잠깐의 소란이 지나간 뒤.)"
10031010-14 = "키키킷. 뭐, 이 몸의 제안에 대해 이 자리에서 확답을 받지 못한 건 물론 아쉬운 일이다마는, 어차피 그것도 시간문제일 뿐."
10031010-15 = "……실은 아직 말은 안 했지만, 이미 후회하고 있지는 않나?"
10031010-16 = "뭐, 안심하도록. 제안에 대한 대답이라면 이 마코토 님께서 계획하고 있는 초, 초, 초, 초거대 이벤트 이후라도 상관없으니 말이야!"
10031010-17 = "[s] \"초, 초, 초, 초거대 이벤트………?\""
10031010-18 = "아, 여기서 그 건을 꺼내 드는 건가요! 시의적절한 판단! 역시 마코토 선배네요!"
10031010-19 = "………헉! 혹시 앞에서 나누었던 얼토당토않던 만담은…… 전부 이곳으로 이어지기 위한 복선이었던 건가요?!"
10031010-20 = "응……?"
10031010-21 = "……아아, 그래. 치아키, 바로 그거다!"
10031010-22 = "아니, 어디로 보나 그런 생각은 해본 적도 없다는 표정이잖아요."
10031010-23 = "그보다…… 정말 하는 건가요. 그거."
10031010-24 = "당연하지 않느냐! 이로하! 이미 모든 준비는 착실히 진행되고 있단 말이다!"
10031010-25 = "모처럼 이 마코토 님께서 준비한 백년대계다. 이번에야말로 만마전의 이름을 드높이고 이 마코토 님의 명성을 키보토스 전역에 알릴 좋은 기회인 게지!"
10031010-26 = "응~ 이부키도 엄청 기대하고 있어~"
10031010-27 = "[ns] \"저기…… 뭘 준비하고 있길래. 그래?\""
10031010-28 = "크크큭…… 다름이 아니라 앞으로 5일 뒤. 우리 만마전은 조만간 완공을 앞두고 있는 만마전 신 의사당에서 <게헨나 특별 파티>를 개최할 예정이다."
10031010-29 = "이 파티를 통해 비로소 게헨나의 모든 학생은 알게 되겠지. 우리 만마전이……"
10031010-33 = "판데모니움 소사이어티가 이 게헨나에서 얼마나 대단한 조직인지! 나아가 그 멍청하고 굼뜨기 그지없는 선도부 녀석들과 얼마나 배포의 차이가 큰지도 말이야! 키키키킷!!"
10031010-36 = "뭐어, 보충해서 설명해 드리자면……."
10031010-37 = "저희 만마전은 매년 발렌타인 데이를 맞이할 때마다 키보토스나 게헨나 등지에서 각종 유력자를 초청하는 파티를 열어왔거든요."
10031010-38 = "그런데 올해 열리는 파티는 작년이나 재작년보다도 좀 더 규모가 크다고 할지. 좀 더 특별한 느낌이라고 할지……. 마코토 선배의 욕심이 담겨 있다고 할지……."
10031010-39 = "그간 정례적으로 열려온 파티와 이번 파티는 그 궤부터가 다르다!"
10031010-40 = "무엇보다 올해, 이 자리엔 샬레의 선생이 있지 않느냐! 이로하!"
10031010-44 = "[ns] \"………나?\""
10031010-45 = "그래. 선생의 협력을 받을 수만 있다면, 이번 발렌타인 데이 파티는 지난 그 어느 파티보다도 더욱 풍성하고…… 또한 강력해지겠지!"
10031010-46 = "이 마코토 님의 치세가 얼마나 강대하고 위대한지! 만인에게 알릴 수 있는 기회란 거다!"
10031010-48 = "휘유~ 선생님의 은덕을 보고자 하는 사심이 그야말로 가감 없이 뿜뿜! 마코토 선배다워요!"
10031010-49 = "흐응, 마코토 쨩. 파티가 더 강해지면 어떻게 되는 거야?"
10031010-51 = "그 부분을 신경 쓰시는 건가요……."
10031010-52 = "키킥, 선생이여. 안심하도록."
10031010-53 = "선생이 도와주는 이상, 파티의 성공은 보장된 것이나 다름없다!"
10031010-54 = "파티가 대성공한다면…… 게헨나 학생들은 이 몸을 우러러보고! 선생 또한 이 마코토 님을 다시 보았다며…… 이 몸의 제안을 적극 수용! 만마전과 샬레의 동맹이 극적으로 타결!"
10031010-55 = "그야말로 탄탄대로만이 펼쳐질 게 분명하니까 말이야! 키키키킷!"
10031010-56 = "[s] \"……설득하고 싶은 사람에게 그런 속내까지 말해줘도 되는 거야?\""
10031010-57 = "……그쵸. 보통은 그쪽을 지적하겠죠. 마코토 선배, 역시 그런 말까지 한다면 제아무리 선생님일지라도 질려서……."
10031010-58 = "[s] \"뭐, 도와줄게.\""
10031010-59 = "호오……!"
10031010-60 = "……?! 진짜요? 그래도 괜찮나요?!"
10031010-61 = "[s9] \"학생이 도움을 필요로 한다면…… 도와주고 싶으니까.\"\n[s10] \"게헨나의 파티라니, 조금 관심이 가는 것도 있고 해서 말이야.\""
10031010-64 = "그러신……가요."
10031010-66 = "잘됐네~ 이로하 쨩!"
10031010-67 = "흐응……."
10031010-69 = "와아~ 선생님이 도와주는 거야~? 신난다~!"
10031010-70 = "이부키도 선생님이랑 같이 파티 준비 열심히 할게!"
10031010-71 = "크크큭. 잘되었군."
10031010-72 = "좋다! [USERNAME] 선생! 앞으로 5일간…… 잘 부탁하도록 하마! 키키키키킷!!"
10031010-74 = "(그리하여 만마전과 함께하는 발렌타인 데이 파티 준비가 시작되었다.)"
