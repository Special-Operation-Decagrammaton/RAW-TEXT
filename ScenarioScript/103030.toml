[translation]
103030-1 = "제3화;방법과 도구"
103030-2 = "……고도 75,000m라. 이건 난이도가 높네요."
103030-3 = "저 고도에 어떻게 떠 있는 거지……?"
103030-4 = "어찌 됐든 현재 우리의 기술력으로는 저 고도까지 공격할 수 있는 방법은 존재하지 않아."
103030-8 = "뭔가 생각해 둔 거라도 있어, 부장?"
103030-9 = "글쎄요…… 저 정도 높이라면 이미 제 영역 밖이에요. 우리는 어디까지나 해커이지 엔지니어가 아니니까요."
103030-10 = "게다가 구조를 확인하려고 해도 구체의 방어막으로 둘러싸여 있어서 안쪽이 확인되지 않아요."
103030-14 = "……그러니 여기서는 빅 시스터가 남긴 유산들을 사용해 보죠."
103030-16 = "회장의 유산?"
103030-17 = "네. 그 여자가 세상의 파멸을 막기 위해 준비한 <대비책> 중에는…… 하늘 위의 위협을 상정한 것들도 있으니까요."
103030-18 = "치 쨩, 에리두에서 찾아낸 무기를 사용 가능하게 해킹해 주시겠어요? 준비는 제가 할 테니."
103030-19 = "……그 미사일 말이지? 별로 내키지 않지만……."
103030-20 = "알겠어. 그거라면 가능할지도 모르겠네."
103030-21 = "부원들에게 말해둘게."
103030-23 = "그리고 엔지니어부의 도움도 필요해."
103030-25 = "응. 알겠어. 이쪽도 준비해 둘게."
103030-26 = "네. 일단 할 수 있는 건 다 해보도록 하죠."
103030-28 = "크윽……!! 닿아라!"
103030-31 = "거리 2,000m……"
103030-34 = "거리 1,000m…… 500m……"
103030-38 = "타깃 좌표에 도달! 어떤가요?! 명중했나요?!"
103030-40 = "엔지니어부 부실"
103030-42 = "……아니. 통과해서 지나가 버렸어."
103030-43 = "아앗……!! 이번에도?!"
103030-44 = "타깃과의 거리…… 1,000m…… 1,500m……"
103030-45 = "점점 멀어져 가고 있어."
103030-46 = "하아…… 이게 마지막 방법이었는데……. 마치 실체가 없는 그림자를 쏘고 있는 것 같아."
103030-48 = "……."
103030-49 = "뭐야? 회장이 남긴 대비책도 소용없는 거야?"
103030-50 = "네. 저 구조체에는 마치, 물리적인 간섭이 불가능한 것처럼 보여요."
103030-51 = "하아…… 저 정도의 순항 미사일이라면 이미 밀레니엄의 기술력을 넘어선 성능 같은데…… 이것마저도 안 되면……."
103030-52 = "그런데 회장은 어디서 저런 걸 구한 거야?"
103030-54 = "……. 더 이상 진행하는 건 무의미해."
103030-55 = "물리적인 영향을 받지 않는다면, 저건 이미 <자연현상>을 넘어선 무언가야. 그렇다면 우리 엔지니어부가 할 수 있는 방법은 없어."
103030-56 = "……우리도 마찬가지야. 저게 에리두에서 찾아낸 마지막 히든 카드였으니까."
103030-57 = "히마리? 남은 방법은 있어?"
103030-59 = "아뇨, 없어요. ……지금은요."
103030-60 = "하아……."
103030-61 = "……. 역시 빅 시스터답네요."
103030-62 = "세상에 도움도 안 되는 주제에 남긴 유산도 쓸모없다니."
103030-63 = "저기 그러니까…… 죽은 사람 취급하는 그거 괴롭힘이거든……?"
103030-64 = "그 여자는 그래도 싸요!"
103030-65 = "뭐, 회장이 잘못한 게 많긴 하지만……."
103030-66 = "그렇다면 다음 방법은…… 으음."
103030-68 = "다른 방법은…… 없는 걸까요?"
103030-69 = "하아…… 있을 리가 없잖아."
103030-70 = "사방이 꽉 막힌 상태라고."
103030-77 = "(치익) 밀레니엄에서 분석해 준 성소의 소재에 대한 데이터를 확인해 봤는데요."
103030-82 = "저 구조체가 보여주는 현상…… 그게 뭔지 알 것 같아요."
103030-87 = "그게 뭐죠? 이해할 수 있다면 그것을 상대하는 법도 알 수 있어요."
103030-100 = "시스터후드의 학사들과 고서관의 사서들…… 그리고 티파티의 도움으로 전방위적으로 정보를 끌어모았어요."
103030-101 = "다만 이것은 어디까지나 가설일 뿐, 검증되진 않았어요."
103030-102 = "상관없어요. 어차피 검증도 불가능하니……."
103030-103 = "결론부터 말하자면…… 키보토스에 다시 나타나고 있는 성소들과, 키보토스 상공의 구조체 모두……"
103030-107 = "……일종의 <확률적 중첩 상태>를 유지하고 있는 것 같아요."
103030-112 = "과연……! 그거라면……."
103030-113 = "뭐어? 이거, 양자역학 얘기……?"
103030-115 = "아뇨, 어디까지나 저 현상을 이해할 수 있는 가장 비슷한 이론으로 대입한 거예요."
103030-116 = "그러니까 그걸 전제하고 들어주세요."
103030-117 = "저건 다세계해석…… 아니, 다차원해석이라는 표현이 정확하겠네요. 그 이론에 기반한 확률적 존재예요."
103030-118 = "다차원해석이면……."
103030-119 = "……어, 그러니까. 다세계해석이 전 우주의 모든 확률적 가능성마다 우주가 분기된다는 가설이니까……"
103030-120 = "그런데 다차원해석이라면……."
103030-121 = "즉, 동전을 던져서 앞면이 나오는 가능성과 뒷면이 나오는 가능성이 있다면, 이 세계에는 그중 하나의 결과만 나타나겠죠."
103030-122 = "하지만 여기 현현하지 않은 다른 가능성의 우주도 실재한다고 보는 이론, 아닌가요?"
103030-124 = "와하하하, 뭐야?"
103030-125 = "그럼 평행우주, 뭐 그런 거야? 사이언스 픽션? 동전을 던질 때마다 세계가 분기한다는 얘기? (와그작)"
103030-126 = "그 이론 자체는 과학적인 게 맞거든?"
103030-128 = "하지만 저 공간은 그 모든 확률적 가능성이 분기되지 않고 중첩된 채로 뒤섞여 있는 거예요."
103030-129 = "……즉, 무한한 다차원 속의 존재와 비존재가 그저 확률로 뒤섞여 있는 혼돈의 공간."
103030-130 = "그렇기에 이미 존재가 확정된 세계에서는 물리적으로 개입할 수 없는 거겠죠."
103030-131 = "보이지만 만질 수는 없다……."
103030-132 = "그럼 지금으로선 방법이 아예 없는 건가……."
103030-135 = "다만 저 구조체를 감싸고 있는 외부만 그런 상태를 유지하고 있다고 생각해요."
103030-136 = "그 내부도 존재가 불안정하다면, 지금처럼 이렇게 에너지를 각 성소에 전달하는 건 불가능할 테니까요."
103030-137 = "……말하자면, 저것은 배리어네요."
103030-138 = "<확률적 중첩 상태>라는 무적의 다차원을 마치 배리어처럼 전개해서 모든 물리법칙에서 보호받고 있는 거군요."
103030-140 = "과감한 이론이지만 이해했어요. 중첩된 다차원을 방어에 사용한다……. 그런 것이라면 말이 되네요."
103030-141 = "네. 저 배리어를 해결할 수 있다면……"
103030-142 = "그 내부의 본체를 공격하는 것도 가능해질 거예요."
103030-144 = "그런데 그런 방법이 있는 거야……? 배리어를 해결할 방법이?"
103030-145 = "……. 네. 있긴 해요."
103030-146 = "저 배리어와 똑같은 <확률적 중첩 상태>를 구현할 수 있다면, 배리어의 영향을 받지 않고 내부로 진입할 수 있겠죠."
103030-147 = "똑같은 상태……?"
103030-148 = "……. 아아, 그렇네요. 저 다차원의 공간에서 벌어지고 있는 <확률적 중첩 상태>를 일종의 진동값으로 본다면……."
103030-149 = "상대의 진동 패턴과 똑같은 진동 값을 가진 물체는, 그 진동에 영향을 받지 않게 되는 거겠네요?"
103030-150 = "……. 네, 그렇게 되면 저 다차원 내부의 확률이나 중첩 상태와 관계없이, 서로가 <같은 공간>에 있게 되는 것이니까요."
103030-151 = "노이즈캔슬링처럼 말이지?"
103030-152 = "네, 조금 다르지만…… 그 비슷한 느낌이겠네요."
103030-154 = "저 다차원을 분석해서, 그것과 똑같은 상태를 구현해 낼 수 있다면……. 배리어를 무력화시킬 수 있다……."
103030-155 = "하지만 어떻게 그걸……."
103030-156 = "그런게 가능하려면 <다차원해석>을 우리가 계산할 수 있어야 하잖아."
103030-157 = "그런 걸 할 수 있는 거야?"
103030-158 = "그건……."
103030-160 = "……불가능하죠."
103030-161 = "다차원해석이라니, 그런 걸 계산하려면 이론으로만 존재하는 양자컴퓨터라도 있어야 할 거예요."
103030-162 = "그, 그러면? 저걸 그대로 두고만 봐야 하는 거야?"
103030-163 = "저게 거짓된 성소를 또다시 현현시키려고 하는데, 우리는 구경만 할 수밖에 없다는 거잖아!"
103030-169 = "……."
103030-170 = "설령 다시 나타난 성소를 저희가 어떻게든 처리한다고 해도……."
103030-171 = "하늘 위의 저 구조체를 그대로 둔다면, 또다시 다차원에 중첩된 성소의 존재 확률을 계산해서 성소를 이곳에 현현시키겠죠."
103030-173 = "……네에?!"
103030-174 = "그, 그런 거라면, 저희가 아무리 성소를 파괴한다고 해도……."
103030-176 = "우주에 존재하는 무한한 차원의 수만큼 성소를 다시 만들어 낼 수 있다, ……그런 얘기군요?"
103030-177 = "무, 무슨……"
103030-178 = "말이 안 되잖아! 열역학 제1 법칙은 어딜 간 거야?!"
103030-179 = "……하아. 다차원을 꺼내든 순간 뭐든 말이 되어버리니까."
103030-181 = "……."
103030-182 = "뭐야, 그럼. 어, 어떻게 해야 하는 거야? 방법을 알아도 해결할 수 없는 거야?"
103030-183 = "……."
103030-184 = "……응?"
103030-185 = "그런데…… 아까부터 선생이 안 보이지 않아?"
103030-189 = "어, 어라……? 그러네요? 어딜 가셨지……?"
103030-196 = "……방법은 있습니다."
103030-197 = "[s] \"검은 양복.\""
103030-198 = "그 방법이라면 [ruby=색채의 인도자]프레나파테스[/ruby]에게 도달할 수 있을지도 모릅니다."
103030-199 = "[s] \"……그 방법이 뭐지?\""
103030-200 = "후후후후……."
103030-201 = "그걸 가르쳐주는 대신 선생이여, 당신은 저에게 어떤 <대가>를 지불할 수 있습니까?"
103030-202 = "……하긴, 그렇군요."
103030-203 = "이렇게 저에게 방법을 물어보는 것 자체가 이미 어떤 대가라도 상관하지 않겠다는 뜻이겠군요."
103030-204 = "필요하다면 <게마트리아>와의 협력도 하겠다는 그런 각오……"
103030-205 = "[s] \"………….\""
103030-206 = "큭큭큭. 그렇다면 저는 어떤 대가를 요구하면 될까요. ……그래, <게마트리아>에 가입하는 조건은 어떻습니까?"
103030-207 = "……큭큭큭큭큭. 농담입니다."
103030-208 = "게마트리아는 지금 해산했으니까 그건 무리겠군요. 이번에는 그냥 가르쳐 드리도록 하죠."
103030-214 = "……하지만 그 전에 한가지 경고하겠습니다."
103030-215 = "이것을 사용하는 순간 [USERNAME] 선생, 당신의 육체는 돌이킬 수 없는 피해를 입을 겁니다."
103030-216 = "두 번 다시 이것을 사용하기 전의 상태로 돌아갈 수 없을 겁니다. ……어쩌면 죽을 수도 있겠죠."
103030-217 = "그럼에도 상관없습니까?"
103030-219 = "[ns] \"상관없어.\""
103030-221 = "그 결말이 뻔히 보이더라도, 말입니까?"
103030-222 = "……."
103030-223 = "그렇군요. 알겠습니다."
103030-229 = "선생이여……. 당신이 찾는 그 방법은 바로……"
103030-231 = "……아비도스에 있습니다."
103030-233 = "다음화;아비도스에 있는 것 1"
