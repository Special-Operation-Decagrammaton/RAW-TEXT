[translation]
10042005-1 = "프롤로그;누군가의 휴일, 누군가의 아르바이트"
10042005-2 = "게헨나 중앙교정"
10042005-3 = "……."
10042005-4 = "휴일이다!!!!!"
10042005-5 = "세상에, 정말로? 믿을 수 없어! 급양부의 휴일이라니!"
10042005-6 = "어떡하지? 이거 정말 현실일까? 내가 무슨 꿈 같은 걸 꾸고 있는 건 아닐까?"
10042005-7 = "여, 여기에서는 엄청나게 고전적인 방법이지만, 머리를 주먹으로……!"
10042005-11 = "아야야……. 아프네. 그러면 정말 현실이라는 뜻이고…… 진짜?!"
10042005-15 = "선생님! 어딘가에서 듣고 계세요? 저, 휴일 받았어요!"
10042005-16 = "마침 어제 이 문제로 선생님께 모모톡으로 상담을 드렸으니까."
10042005-17 = "다시 모모톡을 꺼내 볼까……."
10042005-18 = "<급양부의 휴일이라니, 축하해! 주리에게도 그렇게 전해줘!>"
10042005-19 = "<오늘 하루만이라도 요리와 관계없는 일을 즐겨 보는 것은 어떨까?>"
10042005-20 = "<세상에는, 찾아보면, 정말 멋지고 신나는 일들이 많이 숨어 있을 테니까!>"
10042005-21 = "에헤헤……. 역시 선생님은 상냥하셔……."
10042005-22 = "그렇지만 정작 뭘 하면 좋지……? 지금까지 요리 말고는 거의 생각해 본 적이 없었는데……."
10042005-23 = "……."
10042005-24 = "응! 일단 무조건 어디든 나가서 찾아보기로 하자!"
10042005-25 = "걸음 가는 대로, 생각 가는 대로, 뭔가 재미있어 보이는 곳으로!"
10042005-26 = "어? 선배! 안녕하세요!"
10042005-27 = "주리! 그거 알아? 선생님이 급양부 휴일 축하해 주셨어!"
10042005-28 = "정말요? 와! 뭔가 정말로 기쁘네요!"
10042005-29 = "그런데 그 복장은 어떻게 된 거야? 물론 잘 어울리고, 정말 귀여운데……."
10042005-30 = "이거요? 사실은 오늘 일일 아르바이트로, 근처 팬케이크 카페에서 웨이트리스를 하기로 했거든요."
10042005-31 = "아르바이트? 모처럼 맞는 휴일인데……?"
10042005-32 = "주리도 쉬어야 하지 않을까? 나는 그렇게 생각하는데……."
10042005-33 = "괜찮아요, 선배. 제가 하기로 했던 일이고, 무엇보다 웨이트리스 아르바이트를 하며 음식을 서빙해 주는 것도……."
10042005-34 = "약간이지만 제가 요리를 해서, 누군가에게 대접해 주는 것 같은 느낌이 들거든요!"
10042005-35 = "오히려 정말로 해 보고 싶어요!"
10042005-36 = "주리……."
10042005-37 = "그래. 그렇구나. 그러면 내가 뭐라고 할 수는 없겠네."
10042005-38 = "선배는 오늘 어떻게 보내실 생각이세요?"
10042005-39 = "사실 잘 모르겠어. 이런 날이 우리에게 거의 없었잖아? 그렇지만, 그래도……."
10042005-40 = "일단 나가 볼 거야!"
10042005-41 = "나가서 쇼핑몰이든, 스타디움이든, 전시장이든, 노래방이나 게임 센터, 전통 시장……."
10042005-42 = "무, 물론 그렇게까지 멀리 나갈 수는 없겠지만."
10042005-43 = "그래도, 발 닿는 데까지 최대한 이것저것 해 보고 올 생각이니까!"
10042005-44 = "……."
10042005-49 = "(선배는, 그동안 정말로 이런 시간을 전혀 보내지 못하셨지…….)"
10042005-54 = "좋네요! 저, 선배의 하루를 응원할게요! 후회 없이 최고의 시간을 보내셨으면 좋겠어요!"
10042005-55 = "응. 주리도 아르바이트 힘내. 그렇다고 너무 지나치게 힘내지는 말고. 나도 주리가 아르바이트, 잘 즐겼으면 좋겠어."
10042005-56 = "네, 선배! 그러면 잘 다녀오세요!"
10042005-57 = "고마워. 나 갈게!"
10042005-61 = "그러면 나도 슬슬 카페로 가 볼까? 오늘은…… 절대로 선배의 손을 빌리지 않도록 해야지."
10042005-62 = "무슨 일이 일어나도! 내 손으로 해결해서! 선배를 쉬게 해 드려야겠어!"
10042005-64 = "게헨나 근교 팬케이크 카페"
10042005-66 = "여기, 생크림 딸기 시럽 팬케이크 주문할게. 버터 추가해서!"
10042005-67 = "네. 생크림 딸기 시럽 팬케이크 버터 추가, 주문받았습니다."
10042005-68 = "나는 커피 크림을 얹은 초콜릿 팬케이크로."
10042005-69 = "초콜릿 팬케이크, 크림 선택은 커피 크림이시군요. 마실 것도 필요하신가요?"
10042005-70 = "마실 것, 마실 것…… 필요하려나? 물이면 되지 않아?"
10042005-71 = "그건 그렇긴 한데…… 미묘하게 아쉽다는 느낌도 들고 말이지?"
10042005-72 = "(좋아. 여기에서는 교육받은 대로…….)"
10042005-73 = "주문해 주신 팬케이크는, 모두 정말 달콤하고 맛있지만, 약간 꾸덕한 느낌이 드시거나, 단맛이 지나쳐 입맛이 무뎌지실 수도 있어요."
10042005-74 = "그러니 여기에서는 혀를 씻어내실 수 있도록, 홍차나 커피를 곁들이시는 게 어떨까요?"
10042005-75 = "음…… 그럴까?"
10042005-76 = "하긴 크림에 버터, 시럽까지 곁들인 것이니까. 그 말도 일리가 있어 보여."
10042005-77 = "그러면 나는 홍차로 할까?"
10042005-78 = "나는 아이스 커피."
10042005-79 = "네. 홍차와 아이스 커피, 각각 추가로 주문받았습니다. 또 저희 카페에서는 파르페도 팔고 있는데, 그건 어떠신가요?"
10042005-80 = "파르페, 파르페……."
10042005-81 = "분명 실망시켜 드리지 않을 거예요!"
10042005-82 = "에이, 모르겠다. 파르페 두 개 추가!"
10042005-83 = "감사합니다! 조금만 기다려 주세요."
10042005-86 = "아, 주리 양. 고마워. 정말 잘해 주고 있네."
10042005-87 = "정말인가요? 고맙습니다. 에헤헤……."
10042005-88 = "정말이고말고! 마음 같아서는 이대로 우리 카페의 정식 웨이트리스로 일해 달라고 부탁하고 싶을 정도야!"
10042005-89 = "마, 말씀은 감사합니다만, 저는 역시 급양부 일로 충분히 바빠서요……."
10042005-90 = "그러고 보니 급양부라고 했었지? 역시 게헨나의 급양부는 대단하네. 나름대로 알려져 있을 만해."
10042005-91 = "그, 그랬었나요……?"
10042005-92 = "그렇다마다! 매일같이 그 많은 급식을 빠짐없이 준비하는 것도 모자라서, 모두가 성실하기까지 하다니 말이야."
10042005-93 = "그렇게 알려져 있다니 다행이네요!"
10042005-94 = "그리고 나는 전혀 믿지 않지만, 가끔씩 정체불명의 음식으로 만들어진 생명체가 출몰하기도 한다던데……. 역시 헛소문이겠지?"
10042005-95 = "네, 네?! 그, 그그그그그, 그럼요. 그렇고말고요!"
10042005-96 = "아무튼 오후도 잘 부탁해, 주리 양. 덕분에 일손도 편해졌고, 매출도 평소보다 더 많이 늘어났어."
10042005-97 = "이대로만 해 주면, 시급에 충분한 보너스를–"
10042005-102 = "?!"
10042005-103 = "!?"
10042005-104 = "무, 무슨 일이죠?!"
10042005-105 = "카페 창고 쪽 같은데……!"
10042005-107 = "카페 창고"
10042005-108 = "무, 무슨 일이 일어난 거죠?! 정신 차리세요!"
10042005-109 = "으, 으으……."
10042005-110 = "창고에서…… 백색 화약 포대를 밀가루 포대로 착각해 버려서……"
10042005-111 = "꼴까닥."
10042005-112 = "기절하셨어요!"
10042005-116 = "그, 그렇게 된 거였구나! 이거 큰일인데……!"
10042005-117 = "그런데 왜 카페 창고에 백색 화약 포대가 있었던 거야?!"
10042005-118 = "어? 그러면 안 되는 거였나? 내가 그냥 가져다 놨는데."
10042005-119 = "백색 화약 포대를…… 그것도 그냥 지나가던 사람이 가져다 놓았다고? 그게 말이 돼?"
10042005-120 = "어……. 안 되나?"
10042005-121 = "안 되잖아!!"
10042005-122 = "하하, 미안합니다~."
10042005-123 = "에휴. 칠칠치 못하기는……. 다들 주리 양을 보고 조금이라도 배웠으면 좋으련만."
10042005-124 = "그, 그 정도는 아니겠지만……."
10042005-128 = "(그렇지만 카페 요리사분이 정신을 잃었으니까, 그렇게 되면……?)"
10042005-130 = "내가 주문한 팬케이크는 언제 오는 거야? 왜 이렇게 오래 걸려?"
10042005-131 = "팬케이크는 그럴 수 있다고 생각하는데……. 내 주문은 그냥 자몽 에이드 한 잔이었잖아? 그게 이렇게 걸릴 일이야?"
10042005-132 = "물론 여기 팬케이크는, 겉면도 적당히 구워져 있으면서도 속은 촉촉해서, 시럽에 푹 적셔 먹으면 그만한 별미도 없기는 하지만……."
10042005-133 = "그거 믿고 너무 불친절하게 장사하는 거 아냐? 이렇게 서비스가 안 좋아서야……."
10042005-136 = "저, 점장님? 어떡하죠?! 손님들이 점점 항의하기 시작했어요……!"
10042005-137 = "그, 그러게. 어떡하지……."
10042005-138 = "부탁해, 주리 양. 시급을 더 줄 수도 있고, 아니면 다른 뭐든 간에 원하는 것이라면 가능한 범위 안에서 들어줄 테니까……."
10042005-139 = "제발, 팬케이크를 만들어 줘!"
10042005-140 = "네에?!"
10042005-141 = "(팬케이크…… 요리…… 내가?!)"
10042005-142 = "아, 안 돼요! 못 해요! 전 요리를……."
10042005-143 = "지금의 저는 요리를 잘 못 한단 말이에요!"
10042005-144 = "그게 무슨 말이야? 주리 양은 급양부잖아? 매일같이 요리와 함께 하는 동아리잖아?"
10042005-145 = "……!"
10042005-146 = "그, 그건 분명히, 그렇기는 하지만……."
10042005-147 = "팬케이크는 비교적 쉬운 요리라고. 반죽은 다 배합되어 있으니까, 굽기에만 충분히 주의하면 누구나 괜찮은 결과물을 만들 수 있어."
10042005-148 = "주의할 점은 불을 너무 강하게 사용하지 않는 것 정도지. 그렇게 구워 낸 다음, 토핑을 잘 뿌려서 완성시키면 되는 거야!"
10042005-149 = "네, 네에. 저도 그걸 모르는 건 아니지만요, 이건……."
10042005-150 = "어쩌면, 그런 문제가 아닌 것이 될 수도 있겠다는 생각이…… 들어서요……."
10042005-151 = "그, 그래……? 그렇다면 어쩔 수 없긴 하겠는데……."
10042005-155 = "아, 그래! 급양부! 급양부 부장의 이름이 분명…… '아이키요 후우카' 양이라고 했었지?"
10042005-157 = "?!?!?!"
10042005-158 = "그래, 생각해 보니 그 방법이 있었네! 분명 주리 양이 오늘 아르바이트를 신청했을 때, 오늘이 급양부의 휴일이라고 했었으니까……."
10042005-159 = "후우카 양도 분명, 오늘은 일정이 비어 있을 게 틀림없겠네!"
10042005-160 = "시급을 두 배, 아니 세 배로 계산해 줄 테니까, 오늘 남은 시간만이라도 도와달라고 한다면……!"
10042005-161 = "!!!!!"
10042005-162 = "(여기에서, 선배를?)"
10042005-164 = "(선배, 그렇게 즐거워 보였는데…….)"
10042005-165 = "(안 돼. 선배의 휴일을 방해하게 둘 수는 없어.)"
10042005-166 = "(그걸 망치거나 부수고 싶지 않아. 선배가 평소에…… 얼마나 급양부를 위해 노력하고 있는데…….)"
10042005-168 = "(절대로 그렇게 둘 수 없어! 무엇보다 무슨 일이 일어나도 내 손으로 해결하겠다고 했으니까!)"
10042005-169 = "어디 보자, 후우카 양의 전화번호가……."
10042005-170 = "점장님! 제가 할게요!"
10042005-171 = "어, 어어……?"
10042005-173 = "물론 나야 주리 양이 주방에 서 준다면 고마운 일이지만……."
10042005-174 = "뭔가, 조금 전과 말이 달라지지 않았어?"
10042005-175 = "그, 그건…… 생각이 바뀌었어요!"
10042005-176 = "후우카 선배한테 연락이 가는 건 안 돼요! 오늘은 선배에게 중요한 날이니까요! 아무튼, 아무튼 제가 해보겠습니다!"
10042005-177 = "아무리 저라도, 정말로 간절하게 모든 것을 담아서 열심히 하면, 어쩌면……!"
10042005-178 = "마음가짐은 좋은데…… 팬케이크는 정말로 그렇게까지 필사적으로 매달릴 요리가 아니니 말이지……?"
10042005-179 = "어쨌든 고마워. 잘 부탁할게. 주리 양."
10042005-181 = "카페 주방"
10042005-182 = "후우, 하아, 후우, 하아……."
10042005-188 = "(……조금 무섭네…….)"
10042005-189 = "(요리 연습이라면 얼마든지 할 수 있어. 그건 망쳐도 되는 거니까. 나 혼자 책임지면 되니까.)"
10042005-190 = "(하지만 이건 달라. 내가 만든 팬케이크가 손님들에게 서빙 되는 거잖아?)"
10042005-191 = "(물론 언젠가, 내 요리를 사람들에게, 정말로 맛있게 먹여 드리고 싶기는 했지만……!)"
10042005-192 = "팬케이크~ 아직도야~?"
10042005-196 = "재료는, 전부 준비되어 있어……."
10042005-197 = "……."
10042005-198 = "……역시 자신은 없어. 그렇지만……. 오늘의 선배를 방해하게 둬서는 안 돼."
10042005-203 = "(부탁드려요.)"
10042005-204 = "(누구라도 좋아요. 무엇이라도 좋아요.)"
10042005-205 = "(저를…… 도와주세요. 제발 아무 일도 일어나지 않게 해 주세요.)"
10042005-206 = "(이번 한 번만, 이다음에 무슨 일이 일어나도 괜찮으니까.)"
10042005-207 = "(그러니까 제가…… 선배의 휴일을 지킬 수 있게 해 주세요……!)"
10042005-208 = "우, 우시마키 주리!"
10042005-209 = "가, 가가가가, 가겠습니다!!!"
10042005-214 = "어……?"
10042005-215 = "지금 뭔가, 나쁘지 않게 보이는 게 만들어진 것 같은데……?"
