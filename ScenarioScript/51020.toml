[translation]
51020-1 = "제2화;느닷없는 조우 1"
51020-4 = "[ns] \"……이건 제등, 인가?\""
51020-5 = "(그리하여 도착한 백귀야행 학원의 자치구 거리. 거리 곳곳에 수놓인 제등을 바라보며 상점가 대로를 걷고 있을 때였다.)"
51020-10 = "제가 똑똑히 보았사와요!!"
51020-15 = "[ns] \"……응?\""
51020-21 = "아니, 그러니까 난데없이 생사람 잡지 말고……."
51020-22 = "내가 정말 저 사람의 <지갑>을 훔쳤다는 직접적인 증거가 있냐고 묻는 거야."
51020-25 = "직접적인 증거는 없지만…… 그래도 소녀는 분명……!"
51020-26 = "됐네. 아가씨. 이만하면 충분허이."
51020-27 = "그렇지 않아도 축제 준비로 바쁜 와중에 괜히 신경 쓰게 만들어서 미안하구먼."
51020-28 = "잃어버린 건 잃어버린 대로 어쩔 수 없는 일이것지."
51020-30 = "봐봐, 노인네는 이미 잘 알고 있네. 당사자가 납득하는데 괜한 분란을 만들어서 되겠어?"
51020-31 = "좋은 게 좋은 거라고. 그냥 넘어가는 게 서로에게 좋지 않겠냐고. 하하!"
51020-32 = "괜히 봤다고 거짓말까지 해가면서 일부러 싸우고 싶은 건 아닐 테고 말이야."
51020-37 = "……! 하지만…… 하지만."
51020-42 = "………"
51020-44 = "그래도 소녀 유카리! 이대로 그냥 넘어갈 수 없사와요!"
51020-45 = "올바르지 않은 일을 가리켜, 다들 괜찮다고 말한다 한들…… 정말로 그런 게 괜찮을 리가 없는 것이어요!"
51020-47 = "뭐, 뭐야. 해보자는 거냐?"
51020-48 = "정 말귀를 못 알아듣겠다면, 이쪽도 참지 않고……!"
51020-52 = "[ns] \"그 이상의 난폭한 행동은 그만둬 주세요.\""
51020-56 = "넌 또 뭐야?!"
51020-57 = "우릴 방해할 생각이라면 호된 꼴을……."
51020-61 = "빈틈!"
51020-67 = "우, 우어어엇?!"
51020-74 = "역시나 여기! 훔쳐 간 지갑! 찾았사와요!"
51020-75 = "……허어, 정말로 저 젊은이들이……."
51020-77 = "어, 어이! 그걸 떨어트리면 어떡해!"
51020-78 = "이렇게 된 거! 다들 모여!"
51020-86 = "……어라?"
51020-89 = "쓸데없이 시간을 낭비할 바에, 힘으로 해결해 주마……!"
51020-94 = "꺅?! 사각에서 갑작스럽게 습격을……!"
51020-100 = "어, 어라. 당신은……?"
51020-101 = "[s] \"위험한 상황인 것 같아서, 도와줄게.\""
51020-104 = "……!"
51020-105 = "네!"
