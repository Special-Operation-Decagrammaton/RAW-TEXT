[translation]
10037005-1 = "프롤로그;먼 곳으로부터의 편지"
10037005-4 = "<지금까지의 이야기>"
10037005-8 = "(산해경의 특산물인 만년삼이 외부로 유출되었다.)"
10037005-9 = "산해경만의 희귀 식물인 만년삼이라는 것이 있습니다."
10037005-10 = "생산량이 한정적이기에, 외부 반출이 엄격하게 제한되어 있죠."
10037005-11 = "그런데 그 만년삼을, 저희 현무상회가 식재료에 섞어 학원 외부로 반출하고 있다는 소문입니다."
10037005-14 = "(산해경의 학생회에 해당하는 현룡문. 그 현룡문의 문주인 류우게 키사키는, 현무상회를 만년삼 유출의 범인으로 지목했다.)"
10037005-15 = "만년삼은 산해경에서도 희귀한 식물이라, 무단 채집이 금지되어 있지."
10037005-16 = "그런 특산물이 산해경 밖에서, 그것도 현룡문의 지시 없이 유통되고 있다는 것은 큰 문제이니라."
10037005-17 = "현룡문으로서는 이를 좌시할 수 없도다. 현무상회는 이 문제에 대해 응당 답을 내어야 할 것이야."
10037005-20 = "(현무상회의 상회장인 아케시로 루미는, 누명을 풀기 위해 샬레의 선생님에게 도움의 손길을 요청했다.)"
10037005-21 = "부탁…… 이라고 할까, 의뢰라고 할까."
10037005-22 = "우리 현무상회에서, 샬레에게 도움을 좀 요청하고 싶은 일이 있어서."
10037005-25 = "(그러나 만년삼을 유출시킨 것은, 정작 현룡문의 간부 중 한 명이었으며.)"
10037005-26 = "그래. 당신. 나는…… 당신의 위치가 필요했어. 그러려면 돈이 좀 있어야 했고."
10037005-27 = "마침 만년삼의 약효를 원하는 사람이 있었어. 산해경 바깥에."
10037005-29 = "(현룡문의 간부와 만년삼을 거래한 것은, 금지된 약물과 비약 유통에 손을 대다가 산해경에서 추방된.)"
10037005-30 = "(일곱 죄수 중 한 명인, 신타니 카이였다.)"
10037005-33 = "상관없다. 만년삼으로 할 수 있는 신약의 실험은 대부분 끝난 상태."
10037005-34 = "하지만 아쉬움이 남는 것은 어쩔 수 없군. 아직 임상 시험의 자료는 충분히 축적되지 않았거늘."
10037005-42 = "쿨……. 쿨……."
10037005-43 = "그건 안 돼, 토모에……. 푸딩 강에 푸딩 댐을 건설하면, 푸딩이 막혀서 더 이상 먹을 수 없게 되어 버리잖아……."
10037005-44 = "우웅……. 하지만 카스텔라도, 딸기 우유도, 바나나 에클레어도……."
10037005-48 = "체리노 쨩? 아직 자고 있나요?"
10037005-49 = "음냐……. 음냐……."
10037005-50 = "후훗. 체리노 쨩이 자고 있는 모습은 언제나 귀엽다니까요."
10037005-54 = "하지만 체리노 쨩? 이제 일어날 시간이에요."
10037005-59 = "우웅……? 토모에……? 왜 그래. 낮잠 시간에는 깨우지 말라고 매번 말하잖아……."
10037005-60 = "하지만 그 낮잠 시간은 지금 막 끝났는걸요?"
10037005-61 = "어? 벌써? 우웅……."
10037005-62 = "안 되겠어. 오늘은 낮잠 시간을 연장할 거야. 그러니까 5분만 더 잘게, 토모에……."
10037005-63 = "하지만 체리노 쨩, 아니, 체리노 서기장님께서 지금 처리해 주셔야 할 문서가 도착했습니다."
10037005-64 = "문서……? 그런 건 토모에가 적당히 처리해 두면 되잖아……. 또 누가 쿠데타라도 일으킨 거야?"
10037005-65 = "아닙니다. 산해경 고급중학교의 학생회, 현룡문으로부터의 공문입니다."
10037005-66 = "산해경 고급중학교……?"
10037005-72 = "아하, 그렇군. 교류회 요청 소식인가."
10037005-73 = "못 할 것도 없지. 여기에서는 이 몸의 관대함을 보여야 할 시간이겠군!"
10037005-74 = "그렇지만 그 산해경이라는 곳에서 붉은겨울까지 오려면, 그것도 제법 큰일이겠는걸."
10037005-75 = "아닙니다. 체리노 서기장님. 그 반대입니다. 저희가…… 초대받은 것이에요."
10037005-76 = "어엉? 그러면 우리가 붉은겨울 밖으로 나가, 산해경까지 가야 하는 거야?"
10037005-77 = "그런 것이지요."
10037005-78 = "귀찮은데……."
10037005-79 = "생각해 보세요, 체리노 쨩. 여행이라구요?"
10037005-80 = "여, 여행?!"
10037005-81 = "흐, 흠! 그런 것이군. 좋다! 내 직접 그 요청을 받아들여, 산해경과의 교류회를 성공적으로 이어가도록 하지!"
10037005-82 = "역시 서기장님이십니다. 그 의연한 모습, 모두의 모범이 될 것이라 믿어 의심치 않습니다."
10037005-83 = "당연하지! 이 몸은 아무튼 붉은 겨울의 학생회장이자, 미화부장이자, 서기장이자 청소부장이자, 체육부장, 청소부장, 선도부장, 급식부장."
10037005-85 = "그리고 이달의 최우수 푸딩 시식가로 선정된 데다 카스텔라 생산 공정을 직접 지휘하는 체리노 님이니까!"
10037005-86 = "그 말씀대로이십니다. 체리노 서기장님!"
10037005-88 = "음……. 그런데, 토모에. 지금 궁금한 게 하나 생겼는데."
10037005-89 = "네. 무엇인가요?"
10037005-93 = "그 산해경이라는 곳…… 어디에 있는 거야?"
