[translation]
70004030-1 = "주인 잃은 선물 3"
70004030-3 = "하아아……"
70004030-4 = "결국 이 선물의 주인은 끝까지 밝혀내지 못했네."
70004030-5 = "단순한 분실물이라면 상관없겠지만, 이 선물 때문에 키보토스에 대혼란이 일어나지 않았으면 좋겠는데……"
70004030-7 = "……키보토스에 대혼란이 일어난다고요?"
70004030-8 = "으햑?!"
70004030-9 = "미, 미야코 씨? 어, 언제 오셨었나요?"
70004030-10 = "방금 왔습니다만…… 놀라게 해드렸다면 죄송합니다."
70004030-11 = "그보다 키보토스의 대혼란이라니, 뭔가 위험한 사건의 낌새라도 발견하신 건가요?"
70004030-12 = "아, 아뇨! 그렇게 대단한 건 아니지만……"
70004030-13 = "마, 맞아. 이번 주에 새로 발매된 <폭렬 갓 치킨>! 이 치킨이 엄청나게 맵다고 했거든요!"
70004030-14 = "상품 정보에 의하면 키보토스 전역에 센세이션을 일으킬 정도의 매운맛이라고 했는데…… 이 매운맛 때문에 혼란이 일어나면 큰일이겠다— 싶어서요."
70004030-15 = "아, 편의점 신제품에 관한 이야기였군요."
70004030-16 = "다행이네요. 저는 혹시라도 누군가가 선생님을 노리고 있는 게 아닐까, 걱정했었습니다."
70004030-17 = "하하…… 그런 일은, 없지 않을까요……?"
70004030-18 = "그보다 미야코 씨는 무슨 일로 오셨나요? 폐기 도시락이라면 아직 정리가 덜 끝났는데."
70004030-19 = "아…… 오늘은 폐기물 처리와 관련된 일로 온 건 아니고요."
70004030-20 = "자, 이걸 받아주세요."
70004030-21 = "아, 좋은 냄새…… 이게 뭔가요?"
70004030-22 = "칠면조구이에요. 근처의 주민 여러분께 칠면조를 선물 받았는데, 굽고 보니 생각보다 양이 많은 것 같아서."
70004030-23 = "늘 신세를 지고 있는 소라 양에게 나누어 드리고 싶어서요."
70004030-24 = "아, 아뇨. 폐기 도시락 일이라면 오히려 제가 도움을 받고 있는걸요. 챙겨주셔서 감사해요."
70004030-25 = "참. 괜찮으시면 미야코 씨도 가게에서 함께 드시고 가셔도 괜찮아요. 이 시간대는 손님도 거의 없으니, 편하게 쉬다 가세요."
70004030-27 = "아뇨. 사실은 그게…… 선생님께도 칠면조를 나누어 드릴까 해서."
70004030-28 = "이 이후에 잠깐 선생님을 뵈러 갈까 해서요. 모처럼 권해주셨는데, 죄송합니다."
70004030-29 = "그런가요……"
70004030-31 = "……후후. 선생님이라면 그렇게 말할 줄 알았어."
70004030-35 = "물론 선생님과 디저트를 나누어 먹는 경우도…… 없진 않지만."
70004030-39 = "어디까지나 학생과 선생님의 관계니까."
70004030-42 = "키보토스의 학생들은 모두 [USERNAME] 선생님을 정말 좋아하는 것 같네요."
70004030-43 = "네. 모두에게나 친절하고 상냥한 분이시니까요."
70004030-44 = "하지만 가끔 이상한 소문이 돌기도 하는걸요. 선생님이 불량한 학생들과 어울리는 모습을 보았다던가, 늦은 밤에 수상한 차림으로 공원을 돌아다니고 있었다던가……"
70004030-45 = "아하하, 설마요."
70004030-46 = "게다가 어릴 적부터 대가 없이 친절을 베푸는 사람은 피하라고 들었었는데."
70004030-47 = "다들 어떻게 그렇게 선생님을 신뢰할 수 있는지, 저는 이해하기가 조금 어려워요."
70004030-51 = "……믿을 수 없는 어른이기에 오히려 신뢰할 수 있는 게 아닐까요."
70004030-52 = "믿을 수 없는…… 어른이라서요?"
70004030-53 = "[USERNAME] 선생님은 어딘가 위태로워 보이고, 가끔 이해할 수 없는 행동을 하는, 못 미더운 어른의 전형 같은 사람이지만."
70004030-54 = "그럼에도 언제나 학생의 편에 서서 올곧은 자세로 저희의 이야기를 경청해 주려 하시니까요."
70004030-55 = "그렇기에 선생님의 앞에서는 부담 없이 허물을 드러내고 속내를 나눌 수 있는 것 같아요."
70004030-59 = "……미야코 씨."
70004030-60 = "혹시 선생님께 수상한 요구 같은 걸 받으신 적은 없으시죠?"
70004030-61 = "다, 당연하죠!"
70004030-62 = "그렇다면 다행이지만…… 혹시 모르니 마지막으로 미야코 씨에게도 여쭈어볼게요."
70004030-63 = "혹시 최근에 잊어버린 물건은 없으신가요?"
70004030-64 = "글쎄요…… 잃어버린 것이라면 모르겠지만, 잊어버린 물건은 없는 것 같네요."
70004030-65 = "이런, 너무 시간을 오래 끌었네요. #n그럼 즐거운 연말 되시길."
70004030-69 = "………."
70004030-70 = "[ns] \"소라, 좋은 저녁이야.\""
70004030-71 = "우, 우왓?! 어, 언제 오셨나요. 선생님?!"
70004030-72 = "[s1] \"……방금?\"\n[s2] \"집중이 잘 안돼서 에너지 드링크라도 사 마시러 왔어.\""
70004030-73 = "그, 그렇군요…… 엔젤 24에 어서 오세요!"
70004030-74 = "그, 그렇군요…… 엔젤 24에 어서 오세요!"
70004030-75 = "[s3] \"뭔가 생각이 많아 보이는 표정이던데.\"\n[s4] \"무슨 고민이라도 있어?\""
70004030-76 = "아니요. 특별한 고민 같은 건 없지만……"
70004030-77 = "아니요. 특별한 고민 같은 건 없지만……"
70004030-81 = "……아니, 사실은 고민이 하나 있기는 한데요."
70004030-82 = "실은 편의점에서 주운 이 선물 상자의 주인을 찾고 있었어요."
70004030-83 = "[s] \"응? 소라, 그 선물 아직도 안 열어본 거야?\""
70004030-84 = "네? 제가요……?"
70004030-85 = "혹시 이거, 선생님께서 준비하신 선물이었나요?"
70004030-86 = "[s5] \"그러고 보니 그때 말하는 걸 깜박했네.\"\n[s6] \"응. 내가 주는 크리스마스 선물이야.\""
70004030-87 = "가, 갑자기 크리스마스 선물이라니…… 저, 그동안 선생님께 드린 게 아무것도 없는데요?"
70004030-88 = "가, 갑자기 크리스마스 선물이라니…… 저, 그동안 선생님께 드린 게 아무것도 없는데요?"
70004030-89 = "이렇게 선물을 받더라도 선생님께 보답해 드릴 방법이 조금도 없는데……"
70004030-90 = "아, 혹시 괜찮으시면 직원용 도시락 할인 쿠폰이라도—"
70004030-91 = "[s] \"괜찮아. 이미 소라에게는 충분히 많은 도움을 받았으니까.\""
70004030-92 = "제가 선생님께요?"
70004030-93 = "[s7] \"소라는 어느 때나 편의점의 카운터에서 손님을 기다리고 있잖아?\"\n[s8] \"늦은 밤에도 편의점은 열려 있다는 사실이 업무 중에 큰 위안이 되는걸.\""
70004030-94 = "하지만 그건 특별히 제가 선의로 한 것도 아니고……"
70004030-95 = "하지만 그건 특별히 제가 선의로 한 것도 아니고……"
70004030-96 = "아르바이트 비용을 벌기 위해 당연히 해야 하는 일인걸요?"
70004030-97 = "[ns] \"그 당연함을 지키는 것이 생각보다 쉽지 않거든.\""
70004030-99 = "[ns9] \"모두가 맡은 자리에서 최선을 다할 거라는 신뢰가 있어야.\"\n[ns10] \"다들 안심하고 일상을 즐길 수 있는 법이니까.\""
70004030-100 = "……그런가요."
70004030-101 = "……그런가요."
70004030-102 = "이 평범한 일상이 선생님께는 그렇게 느껴지실 수도 있었군요."
70004030-103 = "그보다 이 선물의 내용물은 뭔가요?"
70004030-107 = "……장갑?"
70004030-108 = "[s11] \"응. 추운 겨울에 밖에서 작업을 하려면 손이 시리잖아?\"\n[s12] \"장갑이라도 끼면 좀 더 따듯하고 안전할 것 같아서.\""
70004030-109 = "후후…… 귀여운 디자인의 장갑이네요."
70004030-110 = "후후…… 귀여운 디자인의 장갑이네요."
70004030-111 = "말씀대로 가볍고 따듯해서, 야외 작업을 할 때 큰 도움이 될 것 같아요. 크기도 맞춘 것처럼 손에 딱 맞아서—"
70004030-112 = "……그런데 선생님, 제 손 크기는 어떻게 알고 계셨던 건가요?"
70004030-113 = "[s13] \"소라의 사이즈라면 완벽하게 파악하고 있지.\"\n[s14] \"매번 거스름돈을 받을 때마다 소라의 손을 보고 있으니까!\""
70004030-114 = "역시 수상한 어른……"
70004030-115 = "역시 수상한 어른……"
70004030-119 = "그래도 이번만큼은 덕분에 선생님께 멋진 선물을 받았네요."
70004030-120 = "언제나 저를, 아니 <엔젤 24>를 신뢰해 주셔서 감사합니다."
70004030-125 = "저희 <엔젤 24>는 언제나 선생님을 위해 24시간 열려있으니까요!"
70004030-127 = "주인 잃은 선물"
