[translation]
84310100702-5 = "이, 이 녀석……! 너……!! 여기 있었어!!"
84310100702-6 = "……!!"
84310100702-7 = "살아 있었구나! 어떻게 그래도 잘 도망쳤네!!"
84310100702-8 = "……! 네, 네……?"
84310100702-10 = "이야~ 아까는 미안했어. 우리도 살기 위해서 어쩔 수 없었다고."
84310100702-11 = "이렇게 다 같이 탈출에 성공했으니 다행이지. 안 그래?"
84310100702-13 = "아, 아. 네……. 뭐……"
84310100702-14 = "그래도 조심하라고! 그 녀석, 아직 이 주변 어딘가를 배회하고 있을지 모르니까 말이야."
84310100702-16 = "맞아, 맞아. 역으로 먼저 발견하면 우리한테도 좀 알려주고! 미리 도망치게, 하하!!"
84310100702-21 = "네에…… 뭐……"
