[translation]
10051100-1 = "제10화;쇼의 종막"
10051100-4 = "패션쇼 대기실"
10051100-5 = "이제 무대에 오르기까지 얼마 남지 않았군."
10051100-6 = "준비는 됐나?"
10051100-7 = "……."
10051100-8 = "긴장은 말되, 마음의 준비는 해라."
10051100-9 = "오늘이 사실상 네 진짜 데뷔 무대가 될 테니까."
10051100-10 = "진짜 데뷔라뇨?"
10051100-11 = "일전에 네가 올랐던 쇼들의 규모는 그리 크지 않았다. 그래서 너의 엉성한 워킹도 그리 큰 문제가 되지 않았지."
10051100-12 = "물론 그것만으로도 유명세를 얻긴 했다만…… 그것은 어디까지나 '신인으로서의' 유명세."
10051100-13 = "하지만 오늘은 다가올 새해를 기념하는 패션쇼다. 이전보다 몇 배나 더 많은 사람이 이 쇼를 지켜보게 되겠지."
10051100-14 = "그래서 오늘이 지나면 너의 이름은 훨씬 더 널리 알려지게 될 것이고."
10051100-19 = "오늘로써…… 너는 비로소 진정한 프로 모델로 거듭나는 거다."
10051100-20 = "프로 모델……."
10051100-21 = "정말로…… 제가요……?"
10051100-22 = "그래. 감격스럽나?"
10051100-23 = "……."
10051100-24 = "아니면, 아직도 미련이 남았나? 아직도 돌아가고 싶은가?"
10051100-25 = "저, 저는……."
10051100-26 = "그……."
10051100-27 = "그럴 때는 네가 지금까지 해온 노력을 떠올려라."
10051100-28 = "그 가혹한 식단 관리와 운동, 훈련……."
10051100-30 = "네가 가진 재능과, 네가 해온 노력을 헛되이 하지 마. 알겠나?"
10051100-31 = "아, 알겠습니다……."
10051100-35 = "시간 다 됐습니다. 준비하세요."
10051100-36 = "좋아. 다녀오도록."
10051100-37 = "……예."
10051100-44 = "저번 패션쇼 때보다 훨씬 더 사람이 많습니다, 부장!"
10051100-45 = "그러게…… 규모도 훨씬 더 커졌네……."
10051100-46 = "……이제 곧 이곳에서 츠쿠요가 워킹을 하게 되는 거지?"
10051100-47 = "네, 부장."
10051100-48 = "……그리고 행사가 마무리되면, 츠쿠요와 직접 만날 수도 있습니다."
10051100-49 = "마지막에 퇴장할 때, 모델들과 경호원들은 같은 통로를 쓴다고 하니까요."
10051100-50 = "츠쿠요……."
10051100-51 = "그런데 말이야, 이즈나 쨩."
10051100-52 = "네, 부장?"
10051100-56 = "나…… 츠쿠요를 꼭 만나야 할까?"
10051100-57 = "네?!"
10051100-62 = "……아."
10051100-63 = "……시작입니다."
10051100-74 = "……츠쿠요다."
10051100-75 = "……츠쿠요입니다."
10051100-76 = "……사람이 빛날 수도 있다는 게, 저런 거구나."
10051100-77 = "걷는 모습도 전보다 훨씬 더 자연스러워졌습니다."
10051100-78 = "이제는 정말로…… 모델이네……."
10051100-79 = "멋진 옷을 입고, 무대 위에 서서……."
10051100-80 = "스포트라이트를 한 몸에 받으며…… 온 힘을 다해 달리는……"
10051100-81 = "달리는……."
10051100-85 = "잠깐만, 달린다고?"
10051100-87 = "츠쿠요?! 왜 갑자기 달리는 거야?!"
10051100-88 = "에에에?!"
10051100-89 = "부장! 츠쿠요 공이 갑자기 무대 아래로 뛰어내렸습니다!!"
10051100-90 = "왜?!!!"
10051100-93 = "[log]1분 전.[/log]"
10051100-96 = "(사람들이 이렇게 많다니……)"
10051100-97 = "(후우…….)"
10051100-98 = "(괜찮아요, 그냥 연습한 대로만 나아가면 돼요.)"
10051100-99 = "(그래, 이렇게 걸어서 나아가면…….)"
10051100-100 = "(그러고 나면…… 저는 뭐가 되는 거죠?)"
10051100-103 = "(앗, 시작……!)"
10051100-107 = "(응?)"
10051100-108 = "(잠깐, 관객석의 저 사람, 지금 뭘 하는 거죠……?!)"
10051100-113 = "(뭐, 뭐, 뭐, 뭐죠?!)"
10051100-114 = "(저 사람, 왜 핸드백 안에 폭탄이 들어있는 거죠?!)"
10051100-115 = "(거기다 지금 여기서 폭탄의 핀을 뽑으려 하고 있어요……!)"
10051100-116 = "(그런데 주변 사람들은 왜 가만히 있는 거죠?!)"
10051100-117 = "(설마, 제가 있는 이 무대 위에서만 저게 보이는 건가요?!)"
10051100-118 = "(흐아아아……!)"
10051100-119 = "(왜죠? 왜 갑자기 저런 짓을 하는 거죠?!)"
10051100-120 = "(아니지, 지금 중요한 건 이유가 아니에요!)"
10051100-121 = "(어서 폭발부터 막아야 해요!)"
10051100-122 = "(소리를 지를까요? 아냐, 그러면 혼란만 가중될 텐데……!)"
10051100-123 = "(대체 어떻게 해야……!)"
10051100-128 = "[log]닌자란, [wa:1000]자고로[/log]"
10051100-130 = "[log]어떤 궁지에 몰리더라도…….[/log]"
10051100-133 = "불의함 앞에서, 물러나지 않는 법……!"
10051100-134 = "에잇……!"
10051100-138 = "타다다닷!"
10051100-139 = "츠쿠요?! 왜 갑자기 달리는 거야?!"
10051100-140 = "에에에?!"
10051100-151 = "부장! 츠쿠요 공이 갑자기 무대 아래로 뛰어내렸습니다!!"
10051100-160 = "쿠당탕!!"
10051100-163 = "자, 잡았어요!"
10051100-167 = "쟤, 쟤 지금 뭐 하는 거야?!"
10051100-168 = "흐이익……!"
10051100-173 = "츠쿠요!"
10051100-174 = "츠쿠요 공!"
10051100-175 = "뭐 하는 거야?! 드레스가 다 찢어졌잖아?!"
10051100-176 = "그리고…… 패션쇼가……!"
10051100-177 = "부장님! 일단 이 사람 가방부터 뺏어요!"
10051100-178 = "가방 안에 폭탄이 들어 있어요!!"
10051100-184 = "가방 뺏었습니다! 정말로 안에 폭탄이 있습니다!"
10051100-185 = "히익……!"
10051100-186 = "이 폭탄, 폭발력이 지나치게 강해서 편의점이랑 마트에서도 판매가 금지된 물건이잖아?!"
10051100-187 = "아니 그보다…… 츠쿠요! 괜찮아?!"
10051100-188 = "예, 저는 다친 데 없어요."
10051100-189 = "드레스가 조금 찢어지긴 했지만……."
10051100-190 = "헤헤, 조금 흉하죠?"
10051100-191 = "그, 그게 아니잖아! 모델이 옷을 찢으면 어떡해?!"
10051100-192 = "뭣보다 그 드레스, 엄청 비싼 거 아니야?!"
10051100-193 = "신경 쓰지 마세요, 부장님."
10051100-194 = "아니, 어떻게 신경을 안 써?!"
10051100-195 = "츠쿠요 넌……."
10051100-197 = "……모델이잖아."
10051100-202 = "……네?"
10051100-203 = "……응?"
10051100-204 = "아니야?"
10051100-205 = "저는 츠쿠요인데요?"
10051100-206 = "아니, 그런 얘기가 아니라……."
10051100-207 = "아뇨, 그런 얘기가 맞아요."
10051100-208 = "저는 오노 츠쿠요에요. 덩치 크고, 소심하고, 닌자를 좋아하는 키 큰 학생. 그게 저예요."
10051100-209 = "……모델은?"
10051100-210 = "사실 잘 모르겠어요."
10051100-211 = "분명 주변에선 저보고 최고의 모델이라고 추켜세워 줘요."
10051100-212 = "하지만 그런 이야기를 들을 때마다, 그리고 모델이라면 당연히 감내해야 할 과정들을 겪다 보면……."
10051100-213 = "……맞지 않는 옷을 입은 것처럼 불편하고 힘들었어요."
10051100-214 = "맞지 않는 옷……."
10051100-215 = "하지만 부장님도 보셨잖아요. 맞지 않는 옷, 억지로 입은 옷은……"
10051100-216 = "……이렇게, 언젠가 찢어지고 만다는 걸."
10051100-217 = "츠쿠요……."
10051100-218 = "부장님, 저 돌아갈래요."
10051100-222 = "인법연구부로."
10051100-226 = "……."
10051100-227 = "우…… 으우……."
10051100-228 = "부, 부장님?!"
10051100-229 = "왜 울고 그래요?!"
10051100-230 = "나…… 나는 츠쿠요가 돌아오지 않을 줄 알았어……."
10051100-231 = "나와는 달리, 너무나 확실한 재능이 있으니까……."
10051100-232 = "그래서 잡아서는 안 된다고 생각했어."
10051100-234 = "괜히 나 때문에 애써 찾은 재능을 썩힐지도 모르니까……."
10051100-235 = "그렇기에 돌아오지 않는 게 더 낫다고도 생각했어. 그리고 정말로 응원 했어. 츠쿠요는 무대 위에서 정말 빛났으니까."
10051100-236 = "……그런데."
10051100-239 = "그런데, 그렇게 생각하면서도, 난 잡고 싶었어!"
10051100-240 = "츠쿠요와 함께 했던 인법연구부의 활동은, 정말로 즐거웠으니까!"
10051100-241 = "그래서, 그래서……."
10051100-245 = "부장님……."
10051100-250 = "저기 그런데, 츠쿠요 공."
10051100-251 = "지금 깔고 앉은 사람이 꿈틀거리고 있습니다!"
10051100-254 = "헛……!"
10051100-255 = "이, 잊고 있었어요……!"
10051100-259 = "저기 그런데, 이 사람……. 어디서 본 것 같지 않나요……?"
10051100-263 = "아!"
10051100-264 = "저번 패션쇼 때! 전투 중에 뛰어들었다가 실려 나간 그 모델이잖아!"
10051100-265 = "이즈나도 기억났습니다! 이분이 실려 나가서 츠쿠요 공이 대신 모델로 서게 됐었고……."
10051100-266 = "이…… 이분이 대체 왜……?"
10051100-271 = "끄으으으……. 머리야……."
10051100-275 = "자, 잠깐, 내 폭탄 어디 갔어?!"
10051100-276 = "폭탄은 벌써 저희가 압수했어요."
10051100-277 = "대체 왜 이런 일을 벌이신 거죠?"
10051100-278 = "왜냐고? 너 말 잘했다."
10051100-280 = "이건 다 너 때문이야!"
10051100-281 = "네?!"
10051100-282 = "그날, 네가 내 자리를 빼앗아 갔어!"
10051100-283 = "네가 서 있는 무대, 입고 있는 옷, 스포트라이트, 사람들의 찬사……"
10051100-284 = "그 모든 것들이! 원래 내 것이었어야 했다고!"
10051100-285 = "뭐라는 거야. 츠쿠요도 그때 원치 않게 무대에 선 건데."
10051100-286 = "시, 시끄러워……!"
10051100-287 = "어쨌든…… 폭탄 하나쯤 뺏긴 걸로 나는 꺾이지 않는다!"
10051100-288 = "다 끝이야! 내가 다 망칠 거야! 이 패션쇼를!"
10051100-289 = "이 정도면 충분히 망친 것 같은데?"
10051100-290 = "시끄러! 이쪽이다, 망량즈!!"
10051100-301 = "바, 밖에서 망량즈가 몰려들어 옵니다!"
10051100-302 = "설마 저것들 다 이 녀석이 고용한 거야……?"
10051100-303 = "잠깐만요, 그럼 설마 포목점에서 난동을 피우던 망량즈들도 그럼……"
10051100-304 = "샤인캣의 배달 기사를 공격하던 망량즈들도……?"
10051100-305 = "[s1] \"그러고 보니 니야도 그런 말을 했지.\"\n[s2] \"최근 망량즈들의 난동이 심해졌다고…….\""
10051100-308 = "푸하하! 정답이다!"
10051100-309 = "그래! 전부 다 내가 벌인 일이다! 내가 망량즈들을 고용해서 이 모든 일을 벌였지!"
10051100-310 = "차근차근 밖에서부터 이 쇼를 무너뜨리기 위해서!!"
10051100-311 = "부, 부장님, 망량즈들의 수가 너무 많아요……!"
10051100-312 = "아냐, 괜찮아 츠쿠요."
10051100-316 = "지휘 부탁해도 되겠지, 선생 공?"
10051100-317 = "[s] \"물론이지!\""
10051100-318 = "좋아, 인법연구부!"
10051100-323 = "간다!!"
