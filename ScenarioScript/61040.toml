[translation]
61040-1 = "제4화;강물이 모이는 자리"
61040-2 = "[ns] \"좋아……. 다른 준비는 어떻게든 됐고…….\""
61040-5 = "지금 거신 번호는 없는 번호이오니, 삐~ 소리가 나면 용건을 말해 주세요."
61040-6 = "[s] \"……농담이 많이 늘었네. 아츠코.\""
61040-7 = "후후. 알아줘서 고마워. 선생님."
61040-8 = "하지만 모르는 번호로 전화가 걸려 오면, 이런 식으로 대답해야 할 때도 있었어."
61040-9 = "물론 내가 선생님의 번호를 모를 리는 없지만 말이야."
61040-10 = "그러면, 다시 한번. 안녕하세요, 선생님."
61040-11 = "[s] \"잘 지냈어? 인사는 중요하지?\""
61040-12 = "응. 기억해 줘서 기뻐."
61040-13 = "별일 없냐고? 으응……. 일단은?"
61040-14 = "여전히 숨어 다니고, 주위를 조심하는 식이지만."
61040-15 = "그래도 나름 재미있어. 여유가 생기면 여기저기 조심스럽게 놀러 다니기도 하고."
61040-16 = "그러니까, 응. 전반적으로 괜찮아."
61040-17 = "그런데, 무슨 일이야?"
61040-18 = "[s1] \"많이 갑작스럽겠지만 말이야.\"\n[s2] \"시험이란 것에 대해, 어떻게 생각해?\""
61040-21 = "시험?"
61040-22 = "후후. 그건 정말 교사다운 질문이네."
61040-23 = "아니야, 선생님. 사과하지 마. 선생님스러워서 좋았어."
61040-24 = "시험…… 공부한 것을 평가받는 거지?"
61040-25 = "지금까지는 말로만 들은 개념이기는 한데……. 그런데, 어째서?"
61040-26 = "[s3] \"또다시, 갑작스럽겠지만.\"\n[s4] \"만일 그걸 볼 수 있게 된다면, 어쩌고 싶어?\""
61040-29 = "음……."
61040-30 = "가령 아이를 만드는 방법에 대해 확인하는 시험이라든가?"
61040-31 = "그런 거라면, 재미있을지도."
61040-32 = "[s] \"그거 말고!\""
61040-33 = "미안, 미안."
61040-34 = "솔직히, 잘은 모르겠어."
61040-35 = "말 그대로 생각해 본 적도 없고, 겪어 본 적도 없으니까."
61040-36 = "하지만 만일 무언가를 배우고, 그걸 잘 공부했다는 인정을 받을 수 있다면……."
61040-37 = "……응."
61040-38 = "마치, '평범한 학생'들처럼…… 말이지."
61040-39 = "다른 모두에게는 물어봐야겠지만, 나는 조금 기대될지도?"
61040-40 = "낙제할 수도 있다고?"
61040-41 = "후훗. 그러면 선생님이 보충수업 같은 걸 해 주는 걸까? 그것까지 포함해서, 나는 나쁘지 않을 것 같아."
61040-42 = "그런데 왜?"
61040-43 = "[s] \"트리니티에서…… 아리우스 출신 편입생들을 만났어.\""
61040-44 = "응?"
61040-48 = "……응. 이해했어."
61040-49 = "[s] \"그 아이들, 너희들을 걱정하고 있었는데…….\""
61040-54 = "그랬구나."
61040-55 = "으음."
61040-56 = "있잖아, 선생님?"
61040-57 = "이런 이야기는 전화로 하기에는 조금 아쉽지 않을까 하는데, 어떻게 생각해?"
61040-58 = "[s5] \"그건 그렇겠네.\"\n[s6] \"만에 하나 누군가에게 도청당할지도 모르고.\""
61040-61 = "으음."
61040-62 = "난 위험성에 대해 이야기하고 있는 게 아닌데?"
61040-63 = "[s] \"그, 그럼?\""
61040-64 = "말했잖아."
61040-65 = "'아쉽다'고."
61040-66 = "이런 일은 가능하면 선생님의 얼굴을 보면서 이야기하고 싶어."
61040-67 = "다른 모두와 같이, 말이야."
61040-68 = "[s7] \"그러면 장소는 내가 알아볼게.\"\n[s8] \"나를 포함해서 네 명이려나.\""
61040-71 = "다섯 명이야."
61040-72 = "[s] \"다섯……?\""
61040-76 = "[ns9] \"그렇구나……. 무슨 말인지 알았어.\"\n[ns10] \"하지만, 괜찮겠어?\""
61040-79 = "괜찮아."
61040-80 = "삿 쨩과는 가끔 만나기도 하고, 연락이 없는 것도 아니고."
61040-81 = "슬슬 삿 쨩의 자아 찾기도 마무리되고 있는 것이 아닐까, 멋대로 생각도 해 보고 있으니까."
61040-82 = "[s] \"멋대로라고 말해 버리는구나…….\""
61040-83 = "후후."
61040-84 = "미사키가 삿 쨩 이야기만 나오면 표정이 복잡해지거든."
61040-85 = "그러면서도 가장 많이 삿 쨩 이야기를 하고 있기도 하지만 말이야."
61040-86 = "물론, 또다시 자아 찾기를 떠날지도 모르지만."
61040-87 = "그래도, 이런 자리에는 우리들 모두가 같이 있었으면 해."
61040-88 = "[s] \"아츠코.\""
61040-89 = "응?"
61040-90 = "[s] \"남에게 부탁하는 방법이…… 아주 능숙해졌구나!\""
61040-91 = "그건…… 내가 잘못하고 있다는 뜻……?"
61040-92 = "아니라고? 오히려 이 장점을 더욱 잘 갈고 닦으면, 정말 멋진 사람이 될 수 있을 거라고?"
61040-93 = "후훗. 고마워. 선생님."
61040-94 = "그래도 선을 넘지 않는 선에서 자중하도록 할게."
61040-95 = "스스로 아무것도 하지 않으려는 사람은, 미움받기 마련일 테니까."
61040-96 = "그러면 삿 쨩에 대한 일, 부탁해도 되는 거지?"
61040-97 = "[s] \"학생의 부탁인데, 당연하지!\""
61040-98 = "응. 기브 앤드 테이크. 세상이 돌아가는 방법이네."
61040-99 = "……고마워, 선생님."
61040-100 = "선생님이 있어 줘서, 정말로 좋아."
61040-106 = "……어어?"
61040-107 = "뭐야, 이거……."
61040-108 = "엄청나게…… 큰 배네?"
61040-110 = "[ns] \"……그러, 게?\""
61040-111 = "그 반응은 뭐야, 선생님! 이건, 도대체……!"
61040-112 = "자, 잡지에서 본 적 있어요. 크루즈라고 하는 배…… 맞죠?"
61040-113 = "크루즈?"
61040-114 = "그, 그게…… 그러니까……."
61040-115 = "엄청나게 고급스럽고 비싼, 관광…… 만을 위해 만든 배인데요……."
61040-116 = "배 안에 레스토랑이나 이런저런 놀이기구라든가……."
61040-117 = "심지어는 인공 온천이나 수영장 같은 것도 있어서, 마음대로 뭐든 할 수 있는 배라고……."
61040-118 = "그래서, 정확한 것은, 모, 모르겠지만…… 푯값만 해도, 상상을 초월할 정도로 비싸다고, 해요……."
61040-122 = "물 위를 다니는 배에 수영장이 있다고? 그것참…… 여러 가지로 역설적이네……."
61040-123 = "아니, 그런 건 아무래도 좋아. 우리가 대체 왜 이런 곳에……."
61040-124 = "선생님! 뭔가 알고 있지? 설명해!"
61040-125 = "[s] \"나, 나도 잘 몰라! 스폰서가 도와주겠다고 했어서!\""
61040-129 = "[ns] \"너희들처럼 안내받은 곳으로 온 것뿐이야!!\""
61040-130 = "네? 스폰서요?!"
61040-131 = "저…… 알아요. 무슨 말인지 알 것 같아요……. 이것도 잡지에서 봤어요……."
61040-135 = "우리는 이제부터 '문어 게임'에 끌려가는 거군요. 그렇죠?!"
61040-136 = "마지막 한 명에게…… 45억 엔의 상금을 준다는 이유로 서로를 죽이고……."
61040-137 = "부자들이 그걸 보면서 재미있어하는 거죠? 망했어요……. 끝났어요……. 이제…… 정말로 꿈도 희망도 없는 거예요! 우애애앵~!"
61040-138 = "정말이야, 선생님?!"
61040-139 = "진정해, 모두. 선생님이 그럴 리가 없잖아. 그리고 만에 하나 그런 일이 생기면, 가장 먼저 탈락하는 건 선생님일걸?"
61040-140 = "뭐라고……? 그런, 것이었나?!"
61040-147 = "……?!"
61040-149 = "……!?"
61040-150 = "사, 사오리 언니?!"
61040-152 = "……."
61040-153 = "어머나."
61040-154 = "스폰서가 설마 리더였던 거야?!"
61040-155 = "아, 아니다. 미사키. 나는 그냥…… 나 역시……."
61040-156 = "아니야. 생각해 보니까 그건 불가능해."
61040-157 = "……그래. 그건 그냥 불가능한 일이야. 리더에게 그럴 능력이 있을 리 없어."
61040-158 = "?! 어, 어떤 의미로는 틀리지 않은 말이겠지만, 왠지 모르게 마음이 쓰리군……."
61040-159 = "아무래도 좋으니까 리더 자리 반납이야! 일시적이라도 좋으니까!"
61040-160 = "기다려, 미사키! 나도 아직 뭐가 뭔지……!"
61040-162 = "우애애앵~ 사오리 언니~! 우리, 적어도 죽을 때는 함께인 거죠?"
61040-164 = "일단, 선생님? 왜 우리 넷과 만나자고 했는지, 그 부분부터 말해 줄 수 있을까?"
61040-165 = "영문을 알 수 없을 때는, 그나마 확실한 것부터 이야기를 하는 게 좋을 것 같아서."
61040-166 = "[s] \"그러니까, 이런 이야기야…….\""
61040-168 = "그렇군. 시험, 인가."
61040-169 = "……."
61040-170 = "선생님은 우리가 어쩌면 좋겠어?"
61040-171 = "우리 의견을 존중한다는 하나 마나 한 말 말고."
61040-172 = "그래, 맞아. 서로 솔직하게 이야기하자는 거야. 그 편이 합의에 다다르기 좋으니까."
61040-173 = "[ns] \"좋아, 그렇다면…….\""
61040-175 = "[ns] \"나는 너희도, '시험'이라는 걸 경험했으면 해.\""
61040-178 = "……."
61040-179 = "……."
61040-181 = "어, 어어……? 갑자기 다들 왜 그러세요……?"
61040-182 = "으, 으음. 여러 가지 있겠지만…… 우선."
61040-183 = "왜 갑자기 그런 이야기를 꺼낸 것인지. 그리고 거기에 어떤 의미가 담겨 있는지를 묻고 싶군."
61040-184 = "응? 시험으로 대표되는 학창생활의 단면을, 모두가 누려 봤으면 한다?"
61040-185 = "우리와…… 아리우스에 남은 아이들까지도?"
61040-186 = "아리우스에 남은 아이들? 그건 무슨 의미지, 선생?"
61040-188 = "(트리니티에 편입한 아이들로부터 들은 이야기를 해 주었다.)"
61040-190 = "……."
61040-191 = "트리니티에 편입했다는 아이들, 마냥 편한 심정은 아닐 거다."
61040-192 = "모두가 잘 대해 준다고 해도, 스스로 주눅 드는 부분이 있겠지."
61040-193 = "지레 겁을 먹는다거나, 일반적 세상의 방식으로 문제를 해결할 줄 모른다거나."
61040-194 = "[s11] \"……그 비슷한 느낌을 받기는 했어.\"\n[s12] \"잘 아는구나, 사오리.\""
61040-197 = "……그런 부분은, 남의 이야기가 아니니까."
61040-198 = "저기, 선생님은 어떻게 생각해?"
61040-199 = "학생의 본분이 공부라는 말, 다들 자주 하지만."
61040-200 = "애초에 왜 그래야 하는 걸까?"
61040-201 = "……어떤 의미로, 아리우스에서도 공부와 시험은 있긴 했어."
61040-202 = "따지고 보면 결국 그건, 어떻게 하면 사람을 더 잘 죽일 수 있는가……."
61040-203 = "어떻게 아무렇지도 않게 살의를 기를 수 있는가의 문제였지만."
61040-204 = "히, 히이이익……."
61040-205 = "이제는, 그런 거 싫어요……. 더 이상은……."
61040-206 = "응. 그래. 우리 모두 마찬가지야, 히요리. 그렇지?"
61040-207 = "하지만 말이야, 선생님. 선생님은 어떤 대답을 갖고 있어? 공부를 해야 하는 이유에 대해서."
61040-208 = "가령 공부를 하고 시험을 잘 보면, 언젠가 더 좋은 직업을 구할 가능성이 올라가니까?"
61040-209 = "나아가, 돈을 더 많이 벌 수 있으니까?"
61040-210 = "하지만 그런 건, 적어도 우리에게 있어서는 확실한 대답이 되지 않아."
61040-211 = "그거 알아, 선생님?"
61040-212 = "단순히 돈을 버는 것이라면, 아리우스에서 배운 것들로도, 충분한 돈을 벌 수도 있어."
61040-213 = "[s] \"그건, 어떻게……?\""
61040-215 = "그, 그게요……."
61040-216 = "누군가를 죽여 달라는 의뢰 같은 거, 어떻게 알았는지는 모르지만……."
61040-217 = "저희에게도 가끔, 들어오거든요."
61040-218 = "무, 물론 그 자리에서 거절하고, 다시는 그런 말 하지 말아 달라고 이야기하긴 하는데요!"
61040-219 = "헤일로를 파괴한다는 표현은, 비유적이고 은유적이지."
61040-220 = "그래서 오히려 아리우스에서는 잘 사용하지 않았어."
61040-221 = "사용한다면…… 그건 어쩌다가 '바깥'에 대한 이야기를 할 때."
61040-222 = "'바깥' 사람들과 이야기해야 할 때."
61040-223 = "아니면 우리들끼리…… 무언가를 놀리려고 할 때 쓰곤 했지."
61040-225 = "응."
61040-226 = "예전 아리우스에서는, 그 부분을 참 간단하게 표현했어."
61040-230 = "'죽인다' 고."
61040-231 = "물론 '바깥'에서도 그 표현을 생각보다 자주 쓴다는 걸, 아리우스를 나오고 나서야 알게 되긴 했는데."
61040-232 = "용법은…… 조금, 달랐던 것 같아."
61040-233 = "네, 네에……. 그런 일은 일어나지 않을 테니까, 모두 안심하고 하는 농담…… 이었죠……."
61040-234 = "……하지만 우리는 그 의미 그대로, 담담하게 사용하는 편이었어."
61040-235 = "예전의 아리우스는, 어쩌면, 키보토스에서 가장 죽음에 가까이 맞닿아 있는 곳이 아니었을까 해."
61040-236 = "그러니까, 선생님. 가르쳐 주세요."
61040-237 = "왜 학생은 공부를 해야 할까."
61040-238 = "더 나은 숫자에 도달하기 위해서라면, 다른 방법도…… 어떤 것을 포기하기만 하면, 얼마든지 있는데."
61040-240 = "[ns] \"그건 말이지.\""
61040-243 = "[ns] \"학생은 언젠가, 세상과 싸우는 방법을 알아야 하기 때문이야.\""
61040-245 = "네……?"
61040-246 = "그건 생각해 본 적 없는 대답이네."
61040-247 = "조금 더 가르쳐 주세요. 선생님."
61040-248 = "[s13] \"공부라는 건 결국, 내가 '모르는 것'을 배워 가는 것이고.\"\n[s14] \"그 '모르는 것'에는, 세상 자체도 포함되어 있으니까.\""
61040-254 = "음? 가령 계약서라는 개념에 대해 모른다면, 그것에 이용당할 가능성이 올라가는 것처럼…… 말인가?"
61040-255 = "……할 말이 없군. 정확한 지적이다. 선생님."
61040-256 = "그리고 계약서에 대해 공부하고 있었다면, 거꾸로 그럴 가능성은 낮아지거나 없어지게 되겠지."
61040-257 = "그렇군. 그것이 공부를 통해 세상과 싸우는 법을 알아 간다는 것인가……."
61040-258 = "세상이 어떤 식으로 만들어져 왔는지, 그리고 지금의 세상은 어떻게 구성되어 있는지."
61040-259 = "나와 다른 생각을 하는 사람은 왜 그러는 것인지. 그리고 그 사람을…… 납득시키는 것까지는 아니더라도."
61040-260 = "어떻게 하면 어느 정도 이해하면서, 합의점을 찾을 수 있을지, 알 수 있을 거고……?"
61040-261 = "그리고, 그렇게 모르는 것에 대한 지식을 쌓아 가는 것으로, 세상으로부터 받게 될지도 모르는 위험을 줄일 수 있다는 것인가……."
61040-262 = "요컨대 지식으로서의 자기 방위 수단, 이라는 것이겠군."
61040-263 = "그렇게 이야기하니까, 어느 정도 납득이 되네."
61040-264 = "그리고 그런 거라면……."
61040-265 = "……하아."
61040-267 = "그, 그렇네요……. 저희 역시 당연히 그런 게 필요할 거고……."
61040-268 = "아리우스에 남은 아이들이야말로…… 무엇보다, 그런 것이 필요하겠네요……."
61040-269 = "[ns15] \"그렇기 때문에, 내가 조금 욕심을 부려서…….\"\n[ns16] \"이 자리에 데려오려고 한, 또 다른 학생이 있어.\""
61040-272 = "응?"
61040-273 = "가만…… 그렇다면 혹시 그 학생이, 이 자리의 스폰서인 건가?"
61040-277 = "아하. 알 것 같아. 일이 그렇게 된 거였구나."
61040-278 = "그, 그런 건가…… 요?"
61040-279 = "그렇지만 그럴 거라면 애초에 언질이라도……."
61040-280 = "……아니야. 됐어. 하아……."
61040-281 = "그래서, 그 학생이 누구야?"
61040-282 = "평안하셨는지요. 아리우스 스쿼드 여러분."
61040-293 = "현재 티파티의 호스트이자, 이 모임의 스폰서를 담당한 키리후지 나기사라고 합니다."
61040-294 = "뭣……?!?!"
61040-298 = "어머나."
