[translation]
10017085-1 = "제8화;한겨울 밤의 꿈"
10017085-2 = "카페 <화이트&메이슨> 입구"
10017085-4 = "끄악!"
10017085-5 = "또 졌어……!"
10017085-6 = "어, 어떻게 된 거지?"
10017085-7 = "분명히 이 녀석들의 전력은 절반 이하로 줄어들었을 텐데……?"
10017085-8 = "인정할 수 없어! 우리가 이렇게 쉽게 박살 나다니……!"
10017085-10 = "키에에에에엑!"
10017085-11 = "현실을 파악하는 능력이 떨어지는군요."
10017085-13 = "아무리 저희가 약해져 있었다고 해도, 당신들이 강해진 것은 아니지 않습니까."
10017085-18 = "다른 누구도 아니고 너한테 그런 말 듣고 싶지 않거든?!"
10017085-19 = "맞아, 맞아! 뭐가 구호기사단 단장이냐! 부수는 것밖에 못 하는 주제에!"
10017085-21 = "들으십시오. 크리스마스는 즐기는 날로 알려져 있고, 실제로 그렇게 행해지고 있기도 합니다."
10017085-22 = "그러나 그 본질은, 어디까지나 감사와 돌아봄, 베풂과 기념이었습니다."
10017085-23 = "주위를 돌아보고, 너그러워진 마음으로 낮은 곳을 돌아보며 스스로를 가다듬는 것 말이죠."
10017085-24 = "그런 날에! 사람의 호의를 악용하고 속여, 분란을 일으키려 한 당신들이!"
10017085-25 = "제대로 된 결말을 맞이하게 될 리가 없지 않습니까!"
10017085-30 = "우, 웃기지 마! 어디, 다음에 두고 보자!"
10017085-31 = "애초에 속는 쪽이 문제인 거라고! 거의 다 됐었는데!"
10017085-44 = "놓치고 말았군요."
10017085-45 = "분하네요. 우리들의 몸 상태만 만전이었어도……!"
10017085-46 = "……누구 덕분에 이렇게 되었나 싶네요……"
10017085-48 = "모두, 괜찮으세요?"
10017085-49 = "치료해 드릴게요! 맡겨만 주세요."
10017085-51 = "아…… 감사합니다. 하지만 다른 정의부원들의 치료를 우선해 주시면 고맙겠어요."
10017085-53 = "괜찮답니다. 다른 분들은 조금 전 모두 응급처치를 끝냈거든요."
10017085-54 = "저희는 늘 준비되어 있으니까요!"
10017085-56 = "벌써요? 역시……"
10017085-57 = "평소에도 자주 신세를 지는 처지이다 보니, 죄송스럽네요."
10017085-62 = "그런 말씀 마세요. 거기에 오늘은…… 그…… 저희에게도 잘못이……"
10017085-63 = "죄송해요, 하스미 님. 어떻게 용서받을 수 있을지 모르겠지만, 최선을 다할게요……"
10017085-70 = "(미네가 부수고 기사단이 치료한다……)"
10017085-71 = "(너무 오랜만에 겪는 일이라 낯설기까지 하지만, 원래 이랬었죠. 하아……)"
10017085-73 = "……그래서, 이번 사태에 대해 할 말씀이라도 있으신가요. 미네 단장님?"
10017085-74 = "변명도, 핑계도 대지 않겠습니다."
10017085-79 = "단장님? 갑자기 방패는 왜 내려놓으시는지……? 거기에 외투를 벗고, 총을…… 저에게……?"
10017085-80 = "이 죄, 죽음으로밖에는 사죄할 수 없으니!"
10017085-81 = "저의 모든 처분을, 하스미 부부장님께 맡기도록 하겠습니다!"
10017085-82 = "네……?"
10017085-87 = "다, 단장님……"
10017085-91 = "으아앙, 단장니임~"
10017085-93 = "울지 마세요, 세리나. 하나에. 책임을 지는 것 또한 우리의 '구호'."
10017085-94 = "아무도 책임을 지려 하지 않는다면, 그 자리에는 더 큰 슬픔이 생겨나고 맙니다."
10017085-95 = "제 모든 무장을 해제하고 무기를 건네 드리겠으니, 부디 저에 대한 처분을!"
10017085-96 = "하아……"
10017085-97 = "오해가 풀렸으면, 그것으로 저는 만족합니다."
10017085-98 = "저도, 부상당한 정의실현부 부원들도…… 구호기사단의 도움으로 회복되었고요."
10017085-99 = "츠루기도, 이 정도로 괜찮지요?"
10017085-100 = "……크에에에에……"
10017085-101 = "그렇다고 합니다. 네. 이것으로 이 사건은 일단락."
10017085-102 = "여러모로 감사드립니다. 세리나 씨, 하나에 씨."
10017085-107 = "옛?! 아, 아뇨. 저희는 단지 구호기사단으로서 해야 할 일을……"
10017085-108 = "오히려 감사드려야 할 것은 저희죠. 구호기사단의 실수를 너그러이 용서해 주셨으니까요."
10017085-110 = "그것은……"
10017085-111 = "아닙니다. 여기서는 그런 것으로 해 두죠."
10017085-112 = "일어나세요, 미네 단장님. 계속 이러시면 저도 난처해집니다."
10017085-113 = "[s] \"정의실현부는 그렇다고 말하는 것 같은데?\""
10017085-114 = "……하지만, 선생님……"
10017085-115 = "[s1] \"그리고, 불량배들이 속이려 했던 거지만,\"\n[s2] \"약한 사람들의 말을 들어주려 했던 자세만큼은 훌륭했다고 생각해.\""
10017085-118 = "……"
10017085-119 = "선생님께서도 그리 말씀해 주신다면, 염치를 무릅쓰고……"
10017085-124 = "저…… 그러면 저희는, 여기에서 이만……"
10017085-125 = "정말 실례했어요…… 죄송합니다! 파티 중이셨을 텐데!"
10017085-127 = "그렇군요. 그 파티 말입니다만……"
10017085-128 = "이렇게 된 거, 구호기사단도 저희와 같이하시는 것은 어떨까요?"
10017085-130 = "네? 저희가요……?"
10017085-131 = "그래도 되나요?!"
10017085-133 = "네, 소동도 정리된 듯하고. 본디 파티란 건, 사람이 많을수록 즐거운 법이니까요."
10017085-134 = "괜찮을까요? 츠루기?"
10017085-135 = "힛? 윽, 그, 으에에에……"
10017085-140 = "조금 놀랍고 부끄럽지만, 환영이라고 하네요."
10017085-141 = "선생님께서는 어떠신가요?"
10017085-142 = "[s3] \"대 찬성!\"\n[s4] \"파티를 열자!\""
