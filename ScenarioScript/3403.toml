[translation]
3403-1 = "산해경의 조금 특별한 아침 3"
3403-3 = "……."
3403-4 = "……."
3403-5 = "[ns] \"이건…… 도대체……?\""
3403-6 = "분명 나는, 코코나 교관을 비롯한 매화원 아이들과, 아침 체조를 하면 되는 것으로 알고 있었는데 말이다……?"
3403-7 = "코코나 쨩……? 문주님……? 뭐가 어떻게 된 건가요……?"
3403-24 = "카구야 부장……? 경극부가 여기에는 무슨 일로……?"
3403-25 = "제 쪽이야말로, 현무상회의 레이죠 님과 무술연구부가 어쩐 일로……?"
3403-26 = "우연이라면 참으로 신기한 우연이로군요."
3403-27 = "저 역시 그렇게 생각합니다. 부평초처럼 세상을 떠돌다, 돌아와 이렇게 만났으니, 그것을 일컬어 우연이라 하도다……."
3403-28 = "아무튼, 좋습니다. 저와 무술연구부 여러분은 이 자리에서 할 일이 있으니 말이죠."
3403-29 = "저와 경극부원들 역시 마찬가지입니다. 참으로 공교로운 일이라 아니할 수 없겠군요."
3403-34 = "저 카야마 레이죠와 무술연구부 여러분들은! 오늘부터 문주님의 쿵후 수련을 함께하겠습니다!"
3403-35 = "저희 경극부는! 오늘부터 문주님의 경극 연습을 전심전력으로 보좌하겠습니다!"
3403-36 = "네?"
3403-37 = "예?"
3403-42 = "……뭐라?"
3403-44 = "아니죠, 아니죠. 뭔가 잘못 알고 계신 모양입니다만, 문주님께서는 매일 아침 새벽같이 이곳 백호공원에서 쿵후를 수련하고 계십니다."
3403-45 = "잘못 알고 계신 것은 레이죠 님인 듯하군요. 문주님께서 하고 계신 것은 경극 연습…… 보다 정확히는 경극 무용이십니다."
3403-47 = "아니, 그러니까 나는……."
3403-49 = "어디에서 그런 뜬소문을 들으셨는지는 모르겠습니다만, 쿵후가 맞습니다. 이렇게 무술연구부 여러분도 함께하고 계시고요."
3403-50 = "허문(虛聞)을 논하고 계신 것은 오히려 레이죠 님인 것 같습니다. 분명히 경극 무용입니다. 그렇지 않다면 무엇 때문에 저희 경극부가 전원 이 자리에 모여 있겠습니까?"
3403-52 = "선생님……? 문주님……?"
3403-54 = "헛된 소문이라뇨. 정말로 잘못 알고 계신 것 같네요. 틀릴 리가 없습니다. 왜냐하면 제가……"
3403-55 = "이 두 눈으로 똑똑히 보았기 때문이죠!"
3403-57 = "낭설(浪說)이라 하셨습니까? 당연히 그럴 리가 없습니다. 오히려 저야말로 같은 말씀을 드리고 싶군요."
3403-58 = "문주님의 경극 무용 연습을 직접 목격한 것은, 다름 아닌 저라고 말입니다!"
3403-60 = "[ns] \"아, 그렇게 된 건가.\""
3403-61 = "잘못 보아도 한참을 잘못 보셨군요! 그건 분명히 쿵후였습니다!"
3403-62 = "상대의 공격을 받아 흘리는 그 투로(套路)! 물 흐르듯 이어지는 다음을 위한 동작! 그리고 예상치 못한 기습에 대비하여 몸을 뒤로 물리는 동작까지!"
3403-67 = "그것이 쿵후가 아니라고 하신다면, 지금까지 무예를 수련해 온 저와, 여기 계신 무술연구부 여러분들이."
3403-68 = "지금껏 무의미한 노력을 해 왔다는 말씀으로 이해하겠습니다!"
3403-76 = "(위험했습니다……. 자칫하면 '그런 것 같군요.'라고 답할 뻔했어요……!)"
3403-77 = "이것은 대단한 우연이군요. 아뇨, 우연도 이 정도라면 필연이라고 이야기할 수밖에 없을 터. 저 역시 같은 말을 레이죠 님께 돌려 드릴 수 있을 것 같습니다."
3403-78 = "경극에 몸을 바쳐 온 세월. 한 가지만을 바라보고 단련해 왔던 나날들. 거기에서 자연스럽게 얻어지는 그 어떤 것을, 우리는 안목이라 일컬을 수 있겠지요."
3403-79 = "그것이 경극 무용이 아니라고 하신다면, 지금까지 경극만을 바라보고 왔던 저와, 여기 모인 경극부원 전원은."
3403-80 = "그저 허송세월하고 있었던 것일 테지요!"
3403-86 = "(……! 위험했다. 하마터면 '맞지 않습니까?' 라고 대답할 뻔했어…….)"
3403-93 = "눈이 있으면 똑똑히 보세요! 그게 어디가 경극입니까!"
3403-96 = "돌이켜 개안(開眼)해야 하는 것은 그 쪽입니다! 그게 어디가 쿵후인가요!"
3403-98 = "쿵후 맞습니다!"
3403-99 = "경극이라니까요!"
3403-103 = "아니, 어느 쪽도 아니다만……."
3403-104 = "어? 문주님, 저기 또 다른 분들이……?"
3403-105 = "뭐라?"
3403-117 = "와, 정말 문주님이셔! 문주님, 여기요! 여기 봐주세요!"
3403-118 = "평소에는 문주님의 모습을 뵙기 어려웠는데, 진짜로 여기 와 계셨네."
3403-119 = "그런데 이거, 현룡문에게 뭔가 혼나는 거 아냐?"
3403-120 = "그런 것 치고는, 현룡문도 그냥 와 본 것처럼 보이기도 하고?"
3403-122 = "아침에 해가 뜨고 질 때면, 무수히 많은 사람이 쓰러져 가겠지만. 오늘은 그게 우리 차례일 뿐이겠지……."
3403-123 = "문주님께서 무엇을 하시든, 어디에 계시든. 이 코노에 미나…… 끝까지 따르겠습니다!"
3403-128 = "……쓰러진 사람 같은 거 없지 않아……?"
3403-129 = "쉿. 그런 거 지적하면 진짜로 쓰러진 사람을 만들 거라구……."
3403-131 = "저희 현룡문! 문주님을 위하여 이 자리에 왔습니다!"
3403-132 = "문주님께서 무엇을 하시든…… 그것이 쿵후든, 경극이든, 아니면 다른 무엇이든 간에!"
3403-133 = "현룡문은 문주님을 보위하며, 끝까지 함께 할 것입니다!"
3403-138 = "집행부장이 뭐라고 하든 잘 모르겠고, 이 틈에 문주님의 사진을……."
3403-147 = "나중에 공유 좀 해 줘."
3403-148 = "5000엔."
3403-149 = "비싸!"
3403-150 = "달갑지 않은 바람의 소리가 들리는군……. 정숙해라!"
3403-151 = "네, 넷!"
3403-153 = "이것 참, 정말로 키사키가 아침에…… 쿵후든 경극이든 그런 걸 하고 있었다니."
3403-154 = "좋아! 나중에 정말로 영양 만점 간식을 따로 만들어 줘야겠네!"
3403-155 = "이것은, 도대체……."
3403-162 = "고맙다, 선생. 잠시 아찔해졌구나."
3403-163 = "[s] \"여기까지 온 이상 어쩔 수 없어, 키사키.\""
3403-164 = "……그것은 무슨 뜻인가?"
3403-165 = "[s] \"이 많은 학생들의 기대를…… 저버릴 수는 없잖아!\""
3403-166 = "……!"
3403-167 = "그것은, 확실히 그런 것 같구나."
3403-170 = "쿵후!"
3403-171 = "경극!"
3403-173 = "문주님~"
3403-175 = "아니, 저 셋은 조금 저버려 주어도 좋을 것 같기는 하다만……."
3403-176 = "……이런 방법을 사용하고 싶지는 않았습니다만, 단순한 말만으로는 안 될 것 같군요. 카구야 부장."
3403-182 = "참으로 시의적절한 말씀이라 사료됩니다. 레이죠 님. 싸우지 않고 이기는 것이 최상이나, 싸울 수밖에 없다면 미리 이기고 싸우는 것이 차상이라 하였지요……."
3403-188 = "각오는 되셨습니까?"
3403-189 = "저희를 걱정하실 필요는 없을 것 같습니다."
3403-190 = "음? 지금 어디선가 분쟁의 향기가……."
3403-192 = "그, 듣거라. 나는 그저 매화원 아이들과 아침…… 튼튼 체조를 하러 왔을 뿐이다만……?"
3403-193 = "네? 체조…… 요? 쿵후가 아니라요?"
3403-194 = "체조라…… 하셨습니까? 경극이 아니고, 말씀이십니까?"
3403-196 = "체조셨군요! 사실 이젠 아무래도 상관없는 것 같습니다!"
3403-197 = "그러하다. 그러니 그대들도 이만 대립을 거두고……."
3403-198 = "괘, 괜찮습니다. 문주님! 체조 역시 응용하기에 따라서 얼마든지 쿵후의 투로(套路)와 이어질 수 있으니까요!"
3403-199 = "이제부터 차근차근히 해 나가시면 됩니다! 지금 당장 시작하도록 하죠!"
3403-200 = "그렇고말고요! 애초에 경극 무용이라는 것 자체가 경극을 무용화시킨 것, 나아가 체조로 승화시킨 것입니다!"
3403-201 = "아뇨, 오히려 문주님께 저희의 경극을 감히 선보여 드릴 기회를, 직접 하사하여 주신다면……!"
3403-202 = "그러니까 경극 아니라고요!"
3403-203 = "쿵후 아니라고 말하고 있지 않습니까!"
3403-205 = "문주님…… 훌쩍……. 우리 무서워요……."
3403-206 = "너, 너희들! 그렇게 울면 안 돼! 그리고 무서운 건, 무서운 건……."
3403-210 = "우우우…… 나도 마찬가지란 말이야……."
3403-215 = "보자 보자 하니……."
3403-216 = "삼가라! 아이들이 울고 있지 않느냐!"
3403-219 = "?!"
3403-220 = "?!"
3403-221 = "?"
3403-222 = "너희들의 뜻이 무엇이든, 그것이 이 아이들보다 중하다는 것이냐?"
3403-223 = "너희들이 바라보고 있는 것이 어떤 것이든, 그것이 산해경의 미래보다 높을 수 있다는 것이냐?"
3403-224 = "그리하다면 이 자리에서 이야기해 보거라. 그것이 무엇이든 좋으니…… 내가 아니라, 이 아이들의 앞에서 고하란 말이다."
3403-226 = "무, 문주님. 저희는 그게 아니라……!"
3403-227 = "소, 송구하옵니다! 저희는 단지……!"
3403-229 = "너희들의 말이 이 아이들을 능히 움직일 수 있고, 나아가 되돌이킬 수 있다면, 나 역시 현룡문의 이름으로 너희들의 말을 보장할 것이다."
3403-230 = "단지."
3403-236 = "그 말이 혹여나 무의미한 요설(饒舌)이나 참언(讒言)이라면, 응당 그에 해당하는 대가를 치러야 할 것이야……!"
3403-239 = "[ns] \"맞아! 문주님을 화나게 하다니, 그러면 안 되지!\""
3403-240 = "자, 자자자자, 잘못했습니다. 문주님! 부디 용서를……!"
3403-241 = "저희가 주제를 몰랐습니다! 분수를 모르는 것들이 감히 자비를 청합니다……!"
3403-242 = "자, 자. 거기까지 하자. 아이들이 오히려 더 겁먹을지도 모른다고?"
3403-243 = "루미? 와 있었던 것인가……?"
3403-244 = "히잉……."
3403-246 = "문주님……."
3403-251 = "……괜찮다. 미안하구나. 저 무서운 언니들은 내가 야단쳐 두었다. 이제 아무렇지도 않을 것이야."
3403-252 = "네, 네에……."
3403-253 = "[ns] \"코 풀래, 코코나 쨩? 손수건 빌려줄까?\""
3403-254 = "……! 돼, 됐거든요?! 전 이미 어엿한 숙녀라구요! 그러니까 괜찮아요!"
3403-255 = "그리고 코코나 쨩이 아니에요! 교관이니까요!"
3403-256 = "[s] \"그래, 그래.\""
3403-257 = "그러면 다 같이, 아침 체조라도 시작해 볼까?"
3403-258 = "다, 다 같이……?"
3403-260 = "문주님께서 함께 하시는 체조로군요! 저희는 항상 모든 일에 준비되어 있습니다!"
3403-261 = "무슨 일이든 분부만 내려 주십시오! 현룡문, 체조 준비!"
3403-262 = "중간쯤부터 대충 예상은 갔지만, 이렇게 되는 건가……."
3403-263 = "집합 명령에는 익숙해져 있지만, 체조 명령이라니……."
3403-264 = "……결국, 모두의 앞에서 아침 체조를 하게 되는 것인가……."
3403-265 = "뭐, 알잖아?"
3403-266 = "가끔은 이런 일도 해야, 뭐가 좀 돌아간다는 걸 말이야."
3403-267 = "……."
3403-268 = "그렇구나. 그대의 말이 옳다."
3403-269 = "그러면, 이제 하루를 시작하도록 하자."
3403-274 = "[ns] \"저는 이쯤에서 슬슬…….\""
3403-276 = "어딜 가려 하는가, 선생."
3403-277 = "그대도, 함께이니라."
3403-278 = "[s] \"역시 그렇게 되는 건가요!\""
3403-280 = "(그렇게, 조금 소란스러웠지만 건강한 산해경의 하루가, 힘차게 시작되었다.)"
3403-281 = "(이것은 아마도 여담에 해당하는 것이겠지만…….)"
3403-282 = "(그 뒤로 백호 공원에서, 아침 체조를 시작하는 학생들의 수가, 조금 더 늘었다는 것 같기도, 아닌 것 같기도…….)"
3403-283 = "산해경의 조금 특별한 아침"
