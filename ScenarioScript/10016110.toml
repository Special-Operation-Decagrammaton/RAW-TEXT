[translation]
10016110-1 = "후일담;미식연구회 편"
10016110-3 = "여기, 벚꽃 소다 한 잔 더 주시겠어요?"
10016110-4 = "나는 오징어 먹물 빙수랑 땅콩버터에 버무린 말린 해삼무침 한 접시 더!"
10016110-5 = "저는 계란 볶음밥이랑, 라멘, 군만두, 그리고 중화 덮밥 한 그릇씩 더 주시고요…… 아, 그리고 밑반찬으로 나온 풋콩도 한 접시 더 주세요."
10016110-9 = "……다들 공짜라고 너무 무리해서 먹는 거 아냐?"
10016110-10 = "1등 상으로 받은 <만능 식권> 덕분에 음식값은 무료라지만, 너무 과식은 하지 마."
10016110-11 = "이 근처에 소화제를 팔고 있는 곳은 없는 것 같으니까."
10016110-12 = "무리해서 음식을 먹는다니요. 미식을 추구하는 사람으로서 그런 품위 없는 일은 하지 않는답니다."
10016110-13 = "……다만 대회를 끝마치고 식사를 하려니 평소보다 훨씬 입맛이 도는 것 같아서요."
10016110-15 = "역시 입맛을 돋우는 최고의 전채는 가벼운 운동이라는 옛말이 틀리지는 않은 모양이네요."
10016110-16 = "가벼운 운동이라……"
10016110-17 = "그러고 보니 하루나도 오늘 경기에 참가했었어?"
10016110-18 = "네. 게헨나 학원의 일원으로서 몇 가지 육상 종목에 참여했답니다."
10016110-19 = "유의미한 성적은 거두지 못했지만요."
10016110-20 = "뭐야, 그게 그렇게 으스대면서 할 법한 이야기야?"
10016110-21 = "물론이지요. 폐회식 때 그 밀레니엄의 서기가 말했던 것처럼, 황륜대제의 목적은 성과를 내는 데 그치지 않고 학생 개개인이 체육을 즐길 수 있는 계기를 만들어 주는 데 있으니까요."
10016110-22 = "……저는 이번 대운동회를 정말 즐겁게 만끽했답니다."
10016110-23 = "게다가 저와는 달리 다른 부원 여러분들은 참가한 종목에서 좋은 성과를 거두었으니, 게헨나의 선도부라 하더라도 오늘만큼은 저희를 어찌하지 못하겠지요."
10016110-24 = "저도 오늘은 즐거웠어요!"
10016110-25 = "평소에 사람이 만드는 완코소바는 나오는 속도가 조금 느려서, 답답한 부분이 없잖아 있었었는데……"
10016110-26 = "제가 먹는 속도에 맞추어 국수를 뽑아줄 수 있는 자동 기계는 처음 본 것 같아요. 역시 밀레니엄의 기술력은 우수하네요. ☆"
10016110-28 = "다만 중간에 기계가 고장 나지 않았다면 조금 더 즐길 수 있었을 텐데…… 후훗."
10016110-29 = "응, 해삼 소다도 정말 맛있었어!"
10016110-30 = "이렇게 해삼의 향을 극대화한 음료는 처음 맛본 것 같아."
10016110-31 = "밀레니엄에서 새롭게 개발한 분자요리 기법을 사용했다는데…… 이거, 게헨나 급식실에서도 재현해 볼 수 있으려나?"
10016110-33 = "그리고 마지막 계주에서 준코 씨가 대역전극을 펼치며 게헨나를 승리로 이끈 것도 빼놓을 수 없지요."
10016110-34 = "후후. 준코 씨가 아비도스의 주자를 제쳤을 때, 표정이 놀라움으로 뒤바뀌던 선도부원들의 표정을 찍어 두지 못한 게 아쉽네요."
10016110-35 = "응응! 그때의 준코는 진짜 멋있었어!"
10016110-36 = "하하…… 그렇게 말해주니 뭔가 잔뜩 활약한 기분이네."
10016110-42 = "준코 씨."
10016110-43 = "오늘 대운동회, 즐거우셨나요?"
10016110-44 = "으음…… 글쎄."
10016110-45 = "지갑을 잃어버리는 바람에 먹고 싶었던 노점 요리를 놓치기도 하고, 오해를 사서 다른 학원의 선도부원 같아 보이는 학생들에게 뒤쫓기기도 하고……"
10016110-46 = "미식연구회의 모두와 보내던 평소의 일상과 크게 다르지 않아서……"
10016110-54 = "……즐거웠어."
10016110-55 = "그렇다니 다행이네요."
10016110-56 = "흔히 매일 먹는 쌀밥이나 된장국 같은 평범한 음식은, 너무 익숙한 탓에 낮게 평가되기도 하지만…… 저는 그 생각에 동의하지 않습니다."
10016110-57 = "질리지 않고 매일 먹을 수 있는 음식이야말로, [ruby=미식]가장 맛있는 음식[/ruby]이라는 뜻일 테니까요."
10016110-58 = "그러게 말이야. 이런 기름진 축제 음식은 한 번은 맛있지만, 여러 번은 먹지 못할 것 같아."
10016110-62 = "킁킁…… 그보다 어디서 타는 냄새 나지 않아?"
10016110-63 = "뭔가 훈연을 할 때 쓰는 것 같은 진한 나무 타는 냄새가……"
10016110-64 = "아, <후야제>에서 진행하는 '캠프파이어'와 '포크 댄스'를 준비하는 모양이군요."
10016110-65 = "……포크 댄스? 그게 뭔데?"
10016110-66 = "아, 포크 댄스는 말이죠…… 캠프파이어를 할 때 모닥불 주위를 돌며 추는 춤이랍니다."
10016110-70 = "보통은 모닥불과 함께 커다란 통돼지 바비큐를 하기 때문에 포크(Pork) 댄스라는 이름이 붙었어요."
10016110-77 = "……그렇네요. 모닥불과 고기, 수렵 시대부터 이어져 오는 유서 깊은 미식 중 하나이지요."
10016110-78 = "우와, 엄청 맛있을 것 같아!"
10016110-79 = "그럼 모닥불에 다른 것을 구워도 괜찮을까? 해삼이라던가…… 문어라던가!"
10016110-80 = "물론이지요. 황륜대제의 캠프파이어는 분명 규모도 거대할 테니, 다른 걸 구울 수 있는 자리도 충분히 남아있을 거예요."
10016110-81 = "응응, 좋아! 소다를 만들고 남은 해삼도 문어도 잔뜩 가져가자!"
10016110-83 = "다른 학생들이 '포크 댄스'를 추고 있을 때, 우리는 문어를 구우면서 '타코 댄스'를 추는 거야!"
10016110-90 = "……저기, 아카리. 후야제는 그런 축제가 아니잖아."
10016110-91 = "이대로 이즈미가 오해를 하게 놔둬도 괜찮은 거야?"
10016110-92 = "후훗, 뭐 어떤가요."
10016110-93 = "한껏 들뜬 축제의 분위기 속에서 이 정도는 오히려 '평범한' 축에 속한다고요."
10016110-94 = "[ruby=Eat or Die]맛있는 것을 위해서라면 무엇이든 한다.[/ruby] 그게 저희 미식연구회의 모토잖아요?"
10016110-98 = "준코 씨도 정리가 끝나면 어서 따라오세요. 모닥불에 문어를 구워 먹는 진귀한 미식 경험을 놓칠 수는 없으니까요."
10016110-105 = "……그러게. 우리의 평범함이라면 역시 이쪽이겠지."
