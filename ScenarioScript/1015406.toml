[translation]
1015406-1 = "이어지는 의지"
1015406-2 = "(마나미의 연락을 받고 곧바로 현장으로 향했다.)"
1015406-4 = "D.U.의 어느 오피스텔 복도"
1015406-5 = "어서 오세요, 선생님. 기다리고 있었습니다."
1015406-6 = "[s] \"여기에 범인이……?\""
1015406-7 = "그럴 확률이 높은 것으로 추정됩니다."
1015406-8 = "현재 다른 평의회 임원들도 범인의 은신처로 예상되는 장소에서 대기 중이죠."
1015406-9 = "이제 선생님의 허가만 남았습니다."
1015406-10 = "[s1] \"아아, 그래서 나를 부른 거였구나.\"\n[s2] \"자치구 밖에서 정식으로 무력 행동을 하려면…….\""
1015406-15 = "[ns] \"허가할게! 검거 작전을 개시해 줘!\""
1015406-16 = "그 말씀을 기다리고 있었답니다."
1015406-17 = "드디어 지난 10년의 설욕을 갚아줄 때가 왔군요."
1015406-18 = "모두, 시작해 주세요!"
1015406-21 = "출입문 강제 개방 개시……!"
1015406-22 = "개시……!!"
1015406-27 = "코, 콜록! 콜록, 콜록……!"
1015406-28 = "역시 여기에 숨어 있었군요."
1015406-29 = "저자를 제 앞으로 끌고 오세요."
1015406-30 = "뭐, 뭐야?! 이 무슨 행패야……!!"
1015406-34 = "당신은 묵비권을 행사할 수 있으며, 당신이 한 발언은 법정에서 불리하게 적용될 수 있습니다!"
1015406-35 = "이하 생략!"
1015406-39 = "뭐, 뭐냐고! 이거 놔!!"
1015406-44 = "[ns] \"당신이 10년 전 도난 사건의 범인……?\""
1015406-45 = "무, 무슨 소리냐! 10년 전 도난 사건?"
1015406-46 = "나는 그저 D.U.에서 개인 사업을 하는 선량한 시민이라고!"
1015406-47 = "그렇군요? 그럼 설명해 주시겠어요?"
1015406-48 = "10년 전. 현장에 남아 있던 털이 어째서 선량한 시민이라는 당신의 털과 일치하는 걸까요?"
1015406-49 = "뭐, 뭣……?"
1015406-51 = "당신은 분명 현장에 아무런 단서를 남기지 않았다고 생각했을 거예요."
1015406-52 = "실제로, 당시의 수사로는 뾰족한 단서를 찾을 수가 없었죠."
1015406-54 = "하지만 세월이 흐르며 감식 기법이 발달했어요."
1015406-55 = "그 결과 10년이 지난 지금, 드디어 발견해 냈답니다."
1015406-56 = "범인에 대한 단서를…… 단 한 개의 털로부터."
1015406-57 = "……!!"
1015406-58 = "다른 곳은 깨끗하게 닦여 있었습니다만, 부서진 액자 사이에 끼어 있던 털이 있었죠. #n현장에 남은, 가장 크고 유일한 단서입니다."
1015406-59 = "당신은 도망가기에 바빠 그 증거까진 인멸하지 못했던 거고요."
1015406-60 = "그, 그건……!"
1015406-61 = "평범한 시민으로 위장하는 것도 여기까지입니다."
1015406-62 = "자. 끌고 가세요."
1015406-67 = "제, 제길! 이, 이렇게 어이없게……!!"
1015406-68 = "[ns] \"오오, 드디어 잡았구나!\""
1015406-69 = "아직 끝이 아닙니다."
1015406-70 = "남은 인원은 수색을 진행해 주세요."
1015406-71 = "사라진 학원의 명화를 원래의 자리에 되돌려 놓는 겁니다."
1015406-76 = "(이후 늦은 시간까지 수색이 이어졌다.)"
1015406-84 = "(결국 모두의 노력 끝에 사라진 작품을 찾아냈다.)"
1015406-85 = "(하지만 보관 상태가 좋지 못해…… 심각하게 훼손된 상태였다.)"
1015406-86 = "(……일단 모두와 와일드헌트로 복귀했다.)"
1015406-88 = "밤이 깊었으니 선생님도 그만 돌아가시지요. 사고 후처리는 저 혼자면 충분합니다."
1015406-89 = "[s] \"일이 남았다면 끝까지 힘이 되고 싶어.\""
1015406-90 = "……그렇군요."
1015406-91 = "좋습니다. 그럼 잠시 저의 혼잣말이나 들어주시죠."
1015406-94 = "범인은 10년이나 작품을 가지고 있었습니다."
1015406-95 = "계속 처분하려 했지만, 우리 학원의 삼엄한 감시 때문에 쉽지 않았죠."
1015406-96 = "그래서 복수의 의미를 담아 처박아두듯 작품을 관리했던 것으로 보입니다."
1015406-97 = "덕분에…… 학원의 명화가 심각하게 훼손되고 말았죠."
1015406-98 = "이건 찾았다고 말하는 게 부끄러울 정도예요."
1015406-99 = "하지만 이대로 포기하진 않을 겁니다."
1015406-100 = "날이 밝는 대로 학원의 뛰어난 실력자들을 모아, 명화의 복원 작업을 개시할 겁니다."
1015406-101 = "선대의 노력으로 증거들이 보존되었고, 대를 이어온 의지가 작품의 밀매를 막았습니다."
1015406-102 = "그리고, 작품을 되찾고자 하는 모두의 염원이 범인을 검거해 냈죠."
1015406-103 = "저는 10년간 이어져 온 그 마음을, 절대 무의미한 것으로 만들지 않을 거예요."
1015406-104 = "[s3] \"세대를 초월한 마음…….\"\n[s4] \"이것도 마나미가 소중히 하는 감각의 예술인 거구나.\""
1015406-111 = "네. 그렇답니다."
1015406-112 = "이제 선생님도 저를 잘 이해하시는 것 같군요."
1015406-115 = "[wa:1120]― [log=마나미]우리 와일드헌트 예술학원은,[/log]"
1015406-117 = "― [log=마나미]역사가 깊은 학원입니다.[/log]"
1015406-120 = "― [log=마나미]역대 뛰어난 평의회장의 위업이[/log]"
1015406-122 = "― [log=마나미]지금도 [wa:1480]전해 내려오고 있죠.[/log]"
1015406-125 = "[wa:2250]― [log=마나미]하지만, [wa:1840]저는 그곳에[wa:1980] 이름을 올리진 못할 겁니다.[/log]"
1015406-127 = "― [log=마나미]사정이 있다고는 하나, [wa:2180]전공 활동도 하지 못하고……[/log]"
1015406-130 = "― [log=마나미]학원 운영도 [wa:1800]독재적이라는 평을 받고 있죠.[/log]"
1015406-133 = "[wa:930]― [log=마나미]그것이 부당하다 [wa:840]생각하진 않습니다.[/log]"
1015406-135 = "― [log=마나미]예술이란, [wa:1980]시간을 뛰어넘는 법.[/log]"
1015406-138 = "― [log=마나미]제가 지켜낸 예술은,[/log]"
1015406-140 = "― [log=마나미]후세에도[wa:1920] 계속해서 전해지겠죠.[wa:80] [/log]"
1015406-143 = "[wa:1260]― [log=마나미]이 학원과, [wa:2090]학원의 예술을 지키는 것…….[/log]"
1015406-145 = "― [log=마나미]그것이야말로, [wa:1790]제가 평의회장을 [wa:1090]계속하고 있는 이유입니다.[/log]"
1015406-148 = "― [log=마나미]그러니까 [wa:1320]선생님. [wa:2430]앞으로도…….[/log]"
1015406-150 = "― [log=마나미]이런 저를, [wa:2240]지켜봐 주실 거죠?[wa:80] [/log]"
1015406-153 = "후후, 혼잣말이 너무 길었네요. 다시 일로 돌아가 볼까요?"
1015406-154 = "이번 사건은 어떻게든 해결했지만, 우리 학원엔 여전히 찾지 못한 작품이 많으니까요."
1015406-155 = "이 기세로 그 작품들도 되찾았으면 좋겠네요."
1015406-156 = "[s] \"또 어떤 작품이 도난당한 거야?\""
1015406-157 = "이번처럼 학원의 명화 정도까지는 아닙니다만, 가치 있는 예술품이 몇 점 사라졌죠."
1015406-158 = "범인을 붙잡아 사건을 해결하고 싶지만, #n용의주도한 그 <도둑고양이>는 저를 비웃듯이 달아나 버렸답니다."
1015406-159 = "후후…… 하지만 두고 보시죠."
1015406-160 = "언젠가 그 녀석을 붙잡아, 평생 동결건조 닭가슴살 간식만 먹는 형벌을 내릴 테니."
1015406-161 = "[s] \"으, 응원할게!\""
1015406-163 = "(이후 마나미를 도와 이번 사건의 정리를 이어나갔다.)"
1015406-164 = "(언젠가, 모두가 마나미의 마음을 이해해 주길 바라면서.)"
