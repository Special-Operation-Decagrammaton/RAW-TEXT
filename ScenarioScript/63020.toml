[translation]
63020-1 = "제2화;그럼에도 불구하고"
63020-3 = "그 앞에는, 무엇이 있지?"
63020-4 = "……!"
63020-5 = "이왕 과거라는 것을 이야기한 김에, 조금 더 그 이야기를 해 보도록 하지."
63020-6 = "……지나간 추억에 집착하는 것은 노쇠와 약화의 증거라고 하던데, 이미 그렇게 된 건가요?"
63020-7 = "그럴지도 모르지. 확실히 예전에 비해 무뎌졌다는 감각은 있다."
63020-8 = " ……이것도 저것도, 선생 앞에서 우리가 함부로 꺼낼 이야기는 아닌 것 같긴 하지만."
63020-9 = "하지만 그것을 대가로 얻게 된 것도, 분명히 있었다."
63020-10 = "예전이 기억나는군. 가혹한 교관과 친절한 백부장의 이야기, 알고 있나?"
63020-11 = "모를 리가요. 조직 운영에는 거의 필수적인 요소들이죠."
63020-12 = "그런데 설마 자신이 친절한 백부장이었다는 말을 하고 싶은 것은 아니겠지요?"
63020-16 = "그럴 리가. 나는 어떻게 봐도 가혹한 교관이었다. 친절한 백부장이라고 하면, 네 쪽이었지."
63020-17 = "사람은 살아온 대로 살아갈 수밖에 없는 법이니까요."
63020-19 = "그래. 이제 와서는 아무래도 상관없는 일이 되었지만, 스쿼드는 나름 선발을 거친 인원들이었다."
63020-20 = "그리고 그 리더에게는 당연히, 다른 아이들보다 더 가혹한 훈련이 주어져야 했고."
63020-22 = "……나는 결국 내 과거를 넘어서지 못했어. 배우고 경험한 대로밖에, 다른 모두를 대할 수 없었지."
63020-24 = "………다시 생각해 봐도, 정말 멍청한 짓이야."
63020-25 = "그 부분을 굳이 비하할 필요는 없습니다. 이것 참, 제가 여기에서 당신을 위로하게 될 줄은 몰랐네요."
63020-26 = "말씀드렸듯이, 사람은 살아온 대로 살아가기 마련이잖아요?"
63020-27 = "그래. 나도 그렇게 생각했어."
63020-32 = "아리우스에 있었을 때는 말이지."
63020-36 = "……뭐라고요?"
63020-37 = "확률적인 이야기이지만, 사람은 사는 대로 생각하게 된다. 적지 않은 사람이 그래. 그리고 그 생각이 다시 자신의 삶을 재생산하지."
63020-38 = "그런 관점에서 네 의견 역시, 틀린 것은 아닐 거다."
63020-39 = "그러나 동시에…… 생각하는 대로 살아갈 가능성 역시 가지고 있는 것이, 사람이기도 하다."
63020-40 = "아리우스를 나간 뒤 내가 배운 것이라면, 그 정도였을 거야."
63020-44 = "무슨 말을 하고 싶은 겁니까?"
63020-45 = "네가 느끼고 있는 것이 무엇인지 나는 안다. 나도 같았으니까."
63020-46 = "길을 잃은 아이들에게 나아갈 길을 제시하고, 그 아이들에게 살아갈 의지를 불어넣어 주며."
63020-47 = "거기에서부터 너 역시 살아갈 의미와 의지를 얻고 있었겠지."
63020-48 = "하지만 그다음에는 무엇이 있지? 네가 이야기한 <아리우스의 방식>, 그 마지막에는?"
63020-52 = "대답할 필요 없어. 우리 둘 다 알고 있으니까. 거기에는 오직…… 증오와 분노가 전부지."
63020-53 = "그 외에는 아무것도 없다. 무의미해. 어떤 것도 남지 않지. 그건 그런 방식이니까."
63020-54 = "나 역시 계속 아리우스에 남은 채, 다른 세상이 있다는 것을 알지 못하고."
63020-55 = "……'선생님'을 만나지 못했다면…… 너와 조금도 다르지 않은 방식으로 살아가고 있었겠지."
63020-56 = "계속해서 가혹한 교관을 연기하며, 내가 아는 것 이외의 모든 것을 부정하고."
63020-57 = "우리의 것이라고 여긴 증오를, 끝없이 가슴 속에 품은 채 말이야."
63020-58 = "……그 방식이 틀린 것이라고, 이제 와서 아리우스를 비난할 생각입니까?"
63020-59 = "천만에. 그건 틀리거나 맞다고 판단을 내릴 수 있는 영역이 아니야. 그때에도 지금도, 그 생각에는 변함이 없어."
63020-60 = "다만 자기가 알고 있는 테두리 바깥의 세상에 대해서, 조금이라도 좋으니 '공부'를 한 다음."
63020-61 = "다시 한번 생각해 보는 것도, 때로는 도움이 될 수 있다는 이야기야."
63020-62 = "……관점이란 건, 생각보다 더 자주 바뀌고 흔들릴 수 있는 것이니까."
63020-63 = "아무것도 모르는 녀석들, 가령 네 표현으로는 트리니티의 아가씨들이 이런 말을 한다면."
63020-64 = "그거야말로 가식과 위선에 가득 찬, 낙관주의자의 대책 없는 소리처럼 들릴지도 모르지."
63020-65 = "하지만…… 최소한 나와 스쿼드는, 조금이지만, 이런 의견을 낼 수도 있을 거라고 생각한다."
63020-66 = "……이 밑바닥에서 굴러먹은 것은, 너나 스쿼드나 모두 마찬가지였으니까."
63020-68 = "그래. 대책 없는 낙관주의자 같은 거, 나도 좋아하지 않았다."
63020-69 = "솔직히 말하자면, 싫어했지. 증오스러웠고, 미움밖에 가질 것이 없었어."
63020-70 = "세상의 어떤 면은 이렇게나 끔찍한데, 그런 것들은 알아보려고도 하지 않고."
63020-71 = "무작정 자기들만의 관점을 강요하는 것이 정말로 보기 싫었다."
63020-72 = "하지만 어떤 낙관주의자들은 그렇지 않았어. 오히려……."
63020-75 = "[log]\"학생이 선생에게 무릎을 꿇어선 안 돼.\"[/log]"
63020-77 = "[log]\"없다면 만들어 내면 돼.\"[/log]"
63020-79 = "[log]\"만약 그것도 실패하면 그다음 기회를 만들면 돼.\"[/log]"
63020-82 = "세상의 어떤 부분은 끔찍하다는 것을 알면서도."
63020-83 = "어쩌면 세상은, 원래 끔찍하고 추할 수밖에 없다는 것을 인정하면서도."
63020-85 = "그럼에도 불구하고, 결코 포기하지 않으려는 사람들이 있더군."
63020-86 = "……너는 어떨지 모르지만, 나는 결국…… 설득당할 수밖에 없었다. 그리고."
63020-87 = "이제 일상적으로는 그다지 쓰이지 않는 표현이지만."
63020-89 = "'그럼에도 불구하고'라는 말을, 그다지 싫어하지 않게 되었어."
63020-90 = "뭘 그렇게 잘난 것처럼 말하고 있습니까. 당신도 결국 대단할 건 없는 몸이잖아요."
63020-91 = "당장 아리우스를 나가면, 체포를 피해 숨어 다녀야 하는 도망자 신세이면서!"
63020-96 = "그래. 그것도 맞아."
63020-97 = "그러니까, 이제 그만두려고."
63020-98 = "네!?"
63020-102 = "[ns] \"뭐?!\""
63020-103 = "다른 세 명과도 이야기는 끝났어."
63020-107 = "……뭐, 그렇지."
63020-108 = "헤, 헤헤. 사오리 언니가 그렇게 생각한다면야……."
63020-109 = "응. 우리 자신을 위해서라도, 언제까지 이렇게 살 수는 없으니까."
63020-110 = "선생에게는 미안하군. 때를 봐서 이야기하려 했는데, 좀처럼 시간이 맞지 않았다."
63020-111 = "[s1] \"그, 그런 건 상관없는데……!\"\n[s2] \"모두, 정말로 괜찮겠어?!\""
63020-117 = "그래. 이 일이 끝나는 대로, 우리는 자수할 거야."
63020-118 = "무엇보다 이제 지쳤어. 지긋지긋해."
63020-119 = "계속해서 어두운 곳만 찾아다니는 것도, 하늘 아래 당당히 서기 힘든 신세인 것도."
63020-120 = "잊었나요? 당신들은 테러리스트입니다."
63020-121 = "그것도 분명히, 악의를 가지고 저지른 테러였죠."
63020-122 = "어떤 형량이 어떻게 주어질지, 예상도 안 될 지경이라고요?"
63020-123 = "맞아. 분명 그럴 거야. 그래도 그편이 나아."
63020-124 = "애초에 자기가 저지른 일에 대한 대가는, 자기가 치러야 해."
63020-125 = "나는 더 이상 나 자신으로부터 도망치고 싶지 않아."
63020-126 = "남은 아리우스의 아이들에 대한 처분은, 걱정하지 않아도 돼."
63020-127 = "모든 것은 내가 주도했고, 내가 실행한 것으로 할 테니까."
63020-128 = "……사실 어느 정도는, 정말로 그랬던 부분도 있었고."
63020-129 = "그러니까, 분명 너도–"
63020-134 = "[log=니코 스바루][FF6666]무슨 말을 하고 싶은 거야, 조마에 사오리.[-][/log]"
63020-137 = "뭐라고……?"
63020-138 = "무슨 말을 하고 싶은 거냐고 물었어. 아니, 어차피 대답하지 않아도 좋아."
63020-139 = "굳이 네 마음을 힘들여 읽어내지 않으려고 해도, 너무 뻔하게 예상이 되니까."
63020-140 = "자수하겠다고? 더 이상 도망치고 싶지 않아?"
63020-141 = "이제 와서 좋은 사람인 척하고 싶어? 모든 것을 없던 것으로 묻어 버리고 싶은 거야?"
63020-142 = "아니면 진리를 깨달은 현자인 척이라도 할 작정이야?"
63020-143 = "세상만사를 가엾게 여기면서, 아무것도 아니라는 것처럼?"
63020-147 = "웃기지 마. 네가 세상의 모든 지식과 지혜를 얻었다고 자부할 수 있는 것이 아니라면, 집어치워."
63020-148 = "모든 것을 알고 있다는 것처럼 관조하면서, 아리우스를 네 것인 것 마냥 내려다보려고 하지 마."
63020-149 = "그건 그야말로 그 트리니티 자식들과 하나도 다를 것 없는 짓거리니까……!"
63020-150 = "웃기지 마! 웃기지 말라고! 아무것도 변하지 않았어! 모든 것은 현재진행형이야!"
63020-151 = "눈이 있다[ruby=아리우스]면 여기를 [/ruby]봐! 네가 떠났던 때와 뭐가 달라졌지?"
63020-152 = "겉보기만으로는 폐허인 채 그대로이고, 안으로는 오히려 그때보다 더욱 끔찍해진 부분도 있어!"
63020-153 = "마담이 떠난 후의 아리우스에 대해서, 네가 뭘 알고 있다고 함부로 이야기하는 거야!"
63020-154 = "그 이후로, 너희 스쿼드 역시, 선생님과 마찬가지로 어떤 신경도 쓰고 있지 않았던 주제에!"
63020-155 = "그럼에도 쭉 [ruby=아리우스]여기[/ruby]를 지키고 있었던 것은 나다! 우리들이라고!"
63020-159 = "할 수 있는 기회가 있었는데도, 모든 책임을 방기하고 도망[ruby=스쿼드]친 너희들이 [/ruby]아니라!"
63020-160 = "아니야, 스바루. 그렇게 대단한 것을 이야기하자고 하는 게 아니야."
63020-161 = "진리를 깨달은 현자라니, 나는 그런 대단한 걸 자칭할 생각도 없고, 그럴 자격도 없어."
63020-162 = "나는 그저, 단지."
63020-163 = "단지……."
63020-166 = "(그날 이후, 처음으로 올려다본 하늘은 그저 푸르기만 했다.)"
63020-167 = "(그래서, 새삼스럽게 실감할 수 있었다.)"
63020-168 = "(아아. 어쩌면 세상은 이전부터 계속해서, 그 모습으로 쭉 그곳에 있었던 것이었다고.)"
63020-169 = "(눈은 보아도 족함이 없고 귀는 들어도 가득 차지 아니하도다.)"
63020-170 = "(이미 있던 것이 후에 다시 있겠고.)"
63020-171 = "(이미 한 일을 후에 다시 할지라도 해 아래에는 새것이 없나니.)"
63020-172 = "(행복도, 고통도, 오만과 겸손, 분노. 그리고 증오까지.)"
63020-173 = "(참으로.)"
63020-175 = "헛되고 헛되니, 모든 것이 헛된 것이었구나."
63020-178 = "나의 남은 삶이…… 아깝다고 느끼기 시작했을 뿐이야."
63020-179 = "……!"
63020-185 = "[log=니코 스바루]그런 식으로[/log]"
63020-186 = "[log=니코 스바루]이야기하지 마.[/log]"
63020-187 = "[log=니코 스바루]배신하고[/log]"
63020-188 = "[log=니코 스바루]도망친 주제에,[/log]"
63020-189 = "[log=니코 스바루]그렇게[/log]"
63020-190 = "[log=니코 스바루]이야기하지 마.[/log]"
63020-193 = "[log=니코 스바루][FF6666]너희들의 남은 삶이 아깝다면,[-][/log]"
63020-195 = "[log=니코 스바루][FF6666]여기에 있는 [-][ruby=[FF6666]아리우스[-]][FF6666]우리[-][/ruby][FF6666]는?[-][/log]"
63020-198 = "[log=니코 스바루][FF6666]뭐가 있더라도 돌아올 아이들을 위해,[-][/log]"
63020-200 = "[log=니코 스바루][FF6666]이 둥지를 지키려고 했던 나는?[-][/log]"
63020-203 = "과거는! 사라지지 않아!!!"
63020-204 = "스바루?!"
63020-205 = "과거는 사라지지 않는다! 오히려 끈질기게 살아남아 현재를 증거하지!"
63020-206 = "이게! 이 포르타 파시스가! 여기에 얽혀 있는 모든 아리우스 분교의 과거가 바로 나다!"
63020-207 = "결국 이 세상에서 가장 중요한 건 자기 자신이다! 자신이 죽으면 세계도 죽어!"
63020-208 = "그렇다면 각자의 삶과 존재 방식이야말로 세계 그 자체야!"
63020-209 = "누구도 삶을 대신 책임져주지도, 살아가 주지도 않는다! 그래서 나는 아이들로부터 의심을 제거했어!"
63020-210 = "어떤 일이 닥치더라도, 굳세게 살아갈 수 있도록!"
63020-216 = "당신은 틀렸어요. 마담. 그건 변하지 않는 사실이겠죠."
63020-217 = "하지만 당신이 남긴 모든 것이…… 완전히 틀렸던 것은, 아니었어요."
63020-218 = "의미 없는 일은 일어나지 않으니까. 사건은 일어나는 것으로 의미를 획득하니까."
63020-219 = "그러니, 의미 없는 고통은 없는 것이겠죠."
63020-220 = "의미 없는 과거가 없는 것처럼."
63020-225 = "……뭐, 뭔가 조금, 이상하지 않나요……?"
63020-241 = "……! 선생! 우리 뒤로 피해라!"
63020-247 = "너무 도발했어. 리더."
63020-248 = "아, 아니다. 도발이라니, 나는 그런 걸 하려고 한 게……."
63020-249 = "응, 응. 그런 이야기는 조금 나중에 하자. 삿 쨩."
