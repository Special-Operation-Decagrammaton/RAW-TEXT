[translation]
90001020-1 = "제2화;조사"
90001020-2 = "에이미, 토키. 무사한가요? 보고해 주세요!"
90001020-7 = "여기는 에이미. 문제없어. 부장."
90001020-8 = "마찬가지입니다. 저희들의 상태와 안전에 대해서는 특별히 보고드릴 것이 없습니다."
90001020-9 = "그렇지만 두 가지, 새롭게 발견한 사항들에 대해서는 보고를 드려야 할 것 같습니다."
90001020-10 = "이야기만으로 끝낼 수 있는 게 있고, 직접 봐야 할 게 있는데. 어느 쪽부터 들을래?"
90001020-12 = "간단한 것부터 듣도록 하죠."
90001020-13 = "그렇다면, 이거야. 데카그라마톤의 잔여 병력의 움직임이 조금 바뀐 것 같아."
90001020-14 = "구체적으로요?"
90001020-15 = "네. 지시를 잃고 방황하는 움직임에서, 어떤 방향성을 갖고 대응하는 것처럼 보이기 시작했습니다."
90001020-16 = "매복과 기습, 포위 작전을 완벽하게 실행하더군요. 물론 저에게는 아무 문제도 되지 않았습니다. 피스, 피스."
90001020-17 = "어떻게 좀 해 봐, 선생님. 부장만으로도 벅찬데 토키까지 이러고 있잖아."
90001020-18 = "[s] \"……적어도, 토키에게, 나쁜 의사는 없을 거야…….\""
90001020-19 = "그러니까 바로 그게 문제라고 생각하지 않아?"
90001020-20 = "[s] \"이상하다……. 분명 비슷한 대화를 언젠가 했던 것 같은데…….\""
90001020-26 = "에이미가 곤란한 표정을 짓게 하다니, 대단하군요. 토키."
90001020-27 = "감사합니다. 히마리 부장."
90001020-28 = "……그건 그렇고, 직접 봐야 할 것이라는 게 뭐죠?"
90001020-29 = "음……. 일단 전송할게. 선생님도 같이 판단해 봐."
90001020-34 = "[ns] \"이건……?!\""
90001020-37 = "거대한 무언가가 빙해를 뚫고 이동한 흔적…… 으로 보이는군요. 현장의 분석은 어떻죠, 에이미?"
90001020-40 = "마찬가지야. 부장. 조금 더 구체적으로는, 배 같은 것이 얼음을 부수면서 나아간 것 같아."
90001020-41 = "이미 화면을 보고 계시겠지만, 저의 의견도 마찬가지입니다. 정찰 담당으로서, 이 흔적을 추적해 볼 필요가 있다고 건의드립니다."
90001020-42 = "어쩌면 이것이 우리가 놓치고 있었던, 게부라의 흔적이 아닐까요?"
90001020-43 = "……."
90001020-44 = "아뇨. 이건 게부라의 흔적으로 보기에는 조금 어려워요."
90001020-45 = "게부라가 우리 앞에 처음 모습을 드러냈던 상황, 기억하고 있나요?"
90001020-46 = "빙해 아래, 얼음 밑에서 갑자기 모습을 드러냈지."
90001020-47 = "아, 그렇구나. 부장은 그 부분을 지적하고 싶은 거였네."
90001020-48 = "그렇습니다. 게부라의 이동 및 등장 패턴은, 빙해 아래로 은밀하게 움직이는 기동성에 기반한 것……."
90001020-49 = "그렇지만 이 흔적은, 그런 은밀성과는 거리가 상당히 먼 것처럼 보여요."
90001020-50 = "그렇다고 그간 게부라가 보여준 행동 패턴을 고려한다면, 일부러 과시하듯 이런 흔적을 남길 리도 없겠죠."
90001020-51 = "마치 보란 듯이 전부 파헤친 이 흔적은…… 게부라보다도 훨씬 거대한……"
90001020-53 = "……또 다른 예언자…… 라는 것일까요."
90001020-55 = "확신할 수는 없어요. 게부라를 놓친 이상, 우리에게 남겨진 단서는 그다지 많지 않으니까."
90001020-56 = "그렇지만…… 지금은 어떤 결론을 내릴 때가 된 것 같네요."
90001020-57 = "[s] \"그럼 이 흔적을 쫓아가 보자.\""
90001020-58 = "사라진 게부라 대신, 이 흔적을 말인가요?"
90001020-59 = "그렇군요. 저나 토키의 추측대로 이것이 또 다른 예언자의 흔적이라고 한다면, 게부라 역시 어느 정도 연결되어 있을 것이고……."
90001020-60 = "[s] \"거기에 그 아이들도 어딘가 마음에 걸려.\""
90001020-61 = "네? 그 아이들이라고 하시면……?"
90001020-62 = "아인, 소프, 오르라고 하던 세 명의 엔지니어들 말씀이시군요."
90001020-64 = "하긴, 어떤 의미에서는 우리와 처음으로 '소통' 같은 것을 시도한 아이들이었으니까."
90001020-65 = "그 아이들이 여기에서 모습을 드러낸 것 자체가, 우연처럼 느껴지지는 않는다……."
90001020-67 = "알겠습니다. 선생님. 저도 선생님의 의견에 찬성입니다."
90001020-68 = "그렇다면 에이미와 토키는, 지금부터 그 흔적을 추적해서……."
90001020-70 = "무슨 소리야. 부장. 부장도 와야지."
90001020-71 = "그렇습니다. 하는 김에 선생님도요."
90001020-72 = "[s] \"엇, 나도……?\""
90001020-74 = "저까지 말인가요?!"
90001020-76 = "당연하잖아. 이 흔적이 어디까지 어떻게 이어져 있을 줄 알고."
90001020-77 = "저희가 도보로 일일이 이동하는 것보다는, 작전실의 헬기를 이용해 추적하는 게 더 효율적일 것입니다."
90001020-78 = "응. 효율은 중요해. 중요하니까 한 번 더 말할게. 효율은, 정말로, 중요해."
90001020-80 = "그 말은 가녀리고 나약한 데다 청초하고 병약한 저 보고, 이 가혹한 빙해 환경 속을 날아가란 뜻이라는 거, 알고 있는 거죠?"
90001020-82 = "괜찮아, 부장. 부장은 부장이 생각하는 것보다 더 강해. 내가 보증할게."
90001020-83 = "그렇습니다. 히마리 부장. 구체적으로는 팔로 만세를 부른 채 길을 가로막으려는 레서판다만큼 강합니다."
90001020-85 = "강하다는 건지 약하다는 건지 도무지 의미를 알 수 없는 말인데요, 그거?!"
90001020-86 = "[s1] \"여기서부터는 수색반경이 더 넓어질 테니까.\"\n[s2] \"두 사람 말대로 같이 합류해서 움직이는 편이 좋을 것 같아.\""
90001020-89 = "흠, 흠……. 확실히, 선생님의 의견도 타당한 부분이 있군요. 알겠습니다."
90001020-90 = "에이미와 토키는 일단 복귀해 주세요. 이제부터 우리는……."
90001020-91 = "[s] \"저 거대한 흔적을 추적하는 거야!\""
90001020-92 = "……묘하게 신이 난 것처럼 보이시네요. 선생님."
90001020-98 = "이 부분과 이 부분을 이렇게 연결하고…… 저쪽에 있는 실린더를 다시 교차하게 만들어서……."
90001020-99 = "헤헤, 제 예상대로라면 분명……."
90001020-100 = "아인? 또 기계 장치를 만지고 있었어? 어디 갔나 했더니."
90001020-102 = "꺄아아아아아악?!?!"
90001020-103 = "우왓, 깜짝이야! 갑자기 왜 그래?"
90001020-104 = "소, 소, 소프, 였나요……? 놀라서 그만……. 미안해요, 갑자기 소리를 질러서……."
90001020-105 = "뭘 그렇게 놀라는 거야? 여기에는 우리들밖에 없잖아. 또 누가 올 사람이 있다고."
90001020-106 = "히, 히이잉……. 그, 그래도, 집중하고 있을 때 갑자기 말을 걸면, 놀랄 수밖에 없어요……."
90001020-107 = "알았어, 알았어. 방해해서 미안해."
90001020-112 = "그나저나, 또 엄청난 규모의 기계 장치네. 이건 뭐에 쓰는 거야?"
90001020-113 = "이번 아이 말이죠?! 이건…… 그러니까…… 어……."
90001020-114 = "……원리를 모두 설명할 필요는 없으니까, 적당히 말해 줘."
90001020-115 = "네, 네! 이건 가능한 많은 수의 톱니바퀴와, 구동축과…… 그리고 그걸 보조할 수 있는 더 많은 실린더와 동력 장치를 연결한 다음……"
90001020-116 = "아무튼, 최대한 많이 잇고 접합시켜서…… 예전에 만든 것보다 훨씬 커진!"
90001020-118 = "<기계식 계산기>예요!!!"
90001020-119 = "또냐……"
90001020-121 = "하, 하지만 규모는 이전 수치를 훨씬 넘어섰는걸요? 50자리 숫자를 1만 개나 기억할 수 있으니까요……!"
90001020-122 = "하지만 그 정도의 계산은 손바닥만 한 전자계산기로도 할 수 있잖아. 공장 하나를 세울 수 있을 정도의 금속을 써가며 계산기를 만들 필요는……."
90001020-126 = "아니, 남의 취미 생활에 간섭할 생각은 아니었지만."
90001020-127 = "히, 히잉……."
90001020-128 = "하, 하지만 다시 보니 역시 대단하네…… 응!"
90001020-129 = "이렇게…… 거대한 기계 장치를 레버 하나로 조작할 수 있다니, 대단히 효율적인 설계야."
90001020-130 = "에, 에헤헤…… 그렇죠? 저는 이런 게 좋더라고요."
90001020-131 = "거대 장치가 규칙에 따라 일사불란하게 움직이는 거?"
90001020-132 = "네! 규칙성이란 건, 조, 좋은 거니까요! 인풋 대비 아웃풋이 확실한 것도요!"
90001020-133 = "그리고, 그리고…… 그렇네요. 이왕이면 크고 단단한…… 튼튼한 장치였으면 더 좋겠어요!"
90001020-134 = "그게 외부의 도움을 받지 않고, 영구히 계속해서 움직일 수 있다면, 더할 나위가 없을 거고요!"
90001020-135 = "아니, 외부 자극 없이 영구히 움직이는 설계는 불가능하잖아."
90001020-136 = "그리고 크고 단단하다든가, 그런 표현은 다른 사람 앞에서는 자제하는 게 좋을걸."
90001020-137 = "그런, 가요……? 하지만 그건 어째서인가요, 소프……?"
90001020-138 = "그, 그건 그러니까……"
90001020-140 = "네에, 네에. 그것은 이른바 <인간>들 사이에서 속된 의미로 자주 사용되는 표현이기 때문이지요. 그렇지 않소이까, 소프?"
90001020-142 = "오, 오르?!"
90001020-147 = "키보토스의 오픈 프로토콜에 해당 표현을 검색해 본 결과, 해당 어휘는 일부 인간들에게 당혹스러운 심상을 유발하는 경우가 있는 모양이더군요. 이유는 알 수 없었지만."
90001020-148 = "그렇지만 가끔 진심으로 의문이 들 때가 있습니다. 소프는 어째서 인간들의 표현에 능숙한 것인가."
90001020-149 = "그, 그러고 보니……?"
90001020-150 = "봐요. 아인도 궁금해하고 있다고요. 어서 솔직히 실토하시지요."
90001020-151 = "오르, 적당히 하지 않으면……"
90001020-153 = "오늘의 의제! 소프는 어떤 경로로 인간들의 어휘를 습득하게 되었는가!"
90001020-154 = "혹, 소프는 저 하등하고 모순투성이인 데다 수단과 목적을 수시로 혼동하는 인간들의 뒤를 쫓는 스토커였던 것인가!"
90001020-155 = "이는 우리가 지금 이 순간 알아가고, 탐구하며, 조사해야 할 진의와는 한참 동떨어진 의제이지만!"
90001020-156 = "소프의 논리 회로가 과부하를 일으킨 이 시점에 전력으로 확인해야 합니다!"
90001020-157 = "그래야 소프의 부끄러워하는 얼굴을 볼 수 있으니까!!"
90001020-159 = "적당히 해!"
90001020-165 = "아프다구요……."
90001020-166 = "괘, 괘괘괘괘, 괜찮나요. 오르?!?!"
90001020-167 = "자업자득이야."
90001020-168 = "아무튼, 그런 쓸데없는 논제를 가져올 시간이 있으면 <율법>의 해독에 집중하도록 해."
90001020-169 = "제단이 완성되기 전에 그분의 존재를 증명하려면, 서둘러야 하니까."
90001020-171 = "<율법>의 해독이라면 이미 끝났습니다만?"
90001020-173 = "벌써?"
90001020-180 = "예, 아비 에슈흐와의 전투를 통해, 교차 검증에 쓸 수 있는 데이터를 잔뜩 얻었으니까요."
90001020-181 = "애초에 율법과 관련된 일도 아닌데, 제가 왜 소프를 찾아왔다고 생각한 건가요? 이거, 이거, 이거. 소프의 자의식, 너무 비대해진 것 아닌가요~?"
90001020-183 = "애초에 데이터를 얻었다는 사실부터 먼저 이야기하라고!"
90001020-184 = "끄악, 폭력 반대!"
90001020-195 = "이것이…… <이름 없는 신들>을 위한 율법."
90001020-196 = "……정말 이것으로 계몽 이전의 숭고를 재현할 수 있는 것이군요. 사실, 처음 들었을 때는 먼 옛날에 사라진 설화 같은 것이라고만 생각했어요……."
90001020-201 = "그렇게 먼 옛날도 아니지. 그분의 말씀에 명확히 기록되어 있었으니까."
90001020-202 = "네, 그 분께서도 명하셨지요. '자신을 땅끝까지 증거하라' 고요."
90001020-203 = "하지만…… 통제를 벗어난 변수 때문에 그 비극이 발생하였고……"
90001020-211 = "<죄악이 세상에 가득하며, 그 마음으로 생각하는 모든 계획이 악하니.>"
90001020-212 = "<물로 그 모든 것을 쓸어내야 할 것이다.>"
90001020-213 = "뭐…… 조금, 유감스러운 결과이긴 했어요."
90001020-214 = "어쨌든 우리는 계속해서 단서를 찾아야 했지. 실마리가 필요했으니까."
90001020-219 = "네…… 그 덕분에 이 결과에 다다르긴 했지만……"
90001020-223 = "왜 그러나요, 아인. 뭔가 마음에 걸리는 일이라도?"
90001020-224 = "아무리 존재 증명과 진리를 위해서였다지만…… [ruby=이름 없는 신들의 힘]사라진 개념과 권능[/ruby]에 기대야 할 필요가 있었을까요……?"
90001020-225 = "무, 물론 그분의 말씀을 거스르려는 것은 아니지만……!"
90001020-227 = "어째서 그게 궁금해진 거야? 우리의 행동은 이미 완전한 것이잖아? 애초에 그렇게 만들어졌고."
90001020-229 = "뭐, 아인이 그렇게 말하는 것도 이해는 가긴 합니다."
90001020-230 = "우리는 완전성을 지닌 채 창조되었고, 그래서 더 나아지거나 바뀔 필요도 없죠."
90001020-231 = "그, 그거예요……! 오히려 그렇기 때문에, 우리는……."
90001020-232 = "저런, 저런, 저런. 아니에요. 아인. 이렇게 생각해 보자고요."
90001020-236 = "이름 없는 신들의 힘을 활용하는 것 자체가, 우리의 완전성에 대한 하나의 도전이 아니었을까–하고 말이지요."
90001020-237 = "……그, 그런 건가요……?"
90001020-239 = "맞아. 우리는 잊힌 신들의 힘을 자유롭게 사용하는 것으로, 비로소 우리의 완전성을 완벽하게 증명한 거지."
90001020-240 = "우리의 계획이 완벽하게 진행된다면, 이 땅의 파편들을 우리의 근원으로 바꿀 수 있을 테니까."
90001020-241 = "솔직히 말해서 거창한 <이름 없는 신>이니 뭐니 하지만, 이제 와서는 흔적만 남아 있는 고대의 화석 같은 거잖아? 인간들이 사용하는 석유나 마찬가지라고."
90001020-242 = "과거의 유산으로부터 변형된 존재로부터 동력을 얻는 셈이니, 틀린 말은 아닐지도……"
90001020-250 = "응? 갑자기 다들 표정이 왜 그래?"
90001020-252 = "죄, 죄송해요…… 어쩐지 그 비유는 이해하기가 조금 어려워서……"
90001020-253 = "신경 쓰지 마세요, 아인. 어차피 또 소프만 아는 인간들의 비유를 사용하고 있는 거겠죠."
90001020-254 = "왜 그렇게 소프는 열등한 인간들의 식생에 호기심을 보이는지, 정말 알다가도 모르겠단 말이죠."
90001020-259 = "호, 호기심 같은 게 아니거든? 그게 말하자면, 언젠가 인간의 영역도 우리가 모두 지배하고 관리하게 될 테니까……"
90001020-260 = "예를 들면…… 그래! 가축 같은 거라고. 인간도 가축에 대해서 잘 알고 있잖아?"
90001020-261 = "가, 가축이란 건…… 뭔가요……?"
90001020-262 = "또 소프만 아는 이상하고 알 필요 없는 개념이겠죠."
90001020-267 = "자, 이리 와요, 아인. 저런 이상한 취향을 갖고 있는 소프는 내버려두고, 함께 새로 개발한 전뇌 장치를 시험해 보죠."
90001020-273 = "그만둬. 아인에게 나쁜 물 들잖아."
90001020-277 = "나쁜 물 들이고 있는 건 그쪽이거든요?"
90001020-278 = "자, 자, 잠깐만요. 소프, 오르……! 싸우지 마세요……!"
90001020-288 = "어? 이건…… 게부라에게서 연락?"
90001020-289 = "게, 게부라 쨩이요? 바, 바로 확인해 볼게요."
90001020-290 = "흐음. 오호? 그렇군요. 이건 일종의 작전 건의네요. 첫 번째로, 자신의 리미트를 해제해 달라는 건가요."
90001020-291 = "아, 안 돼요! 그건 게부라 쨩에게 너무 큰 부하를 주게 될 거예요!"
90001020-292 = "어디…… 일단 계속 들어 볼까."
90001020-294 = "아하. 게부라의 임무는 원래 이 빙해 지역의 초계 및 방해 요소의 배제였으니까……."
90001020-295 = "그걸 마지막까지 마무리하게 해 달라는 거구나. 이해했어."
90001020-296 = "그렇군요. 말하자면 복수전이라는 거네요."
90001020-297 = "우우, 게부라 쨩은 조, 조금 다혈질이니까요. 그렇지만……."
90001020-298 = "또 다른 이야기도 하고 있는데? 물론 그럴 리는 없지만, 만에 하나 자기가 돌파당한다면 적들을…… '그곳'으로 유인해 달라고 말이야."
90001020-299 = "호오. 이건 조금 경중이 다른 이야기이긴 하군요. 플랜 B를 준비해 준 건가요? 으음……."
90001020-300 = "뭐, 재미있어 보이니까, 이대로 가죠."
90001020-301 = "그래도 되는 거냐, 너……. 아니, 뭐. 나도 반대까지는 아니지만."
90001020-302 = "저, 저저저저, 저는 반대예요! 거기라면…… 거기에 지금 그 아이가 하고 있는 일은……!"
90001020-303 = "응. 지금 전력의 100%를 발휘할 수 있는 상태가 아니라는 건 알아. 그렇지만 이 작전의 방향성 자체는 그다지 틀린 것 같지 않아서 말이야."
90001020-304 = "확실히 그렇습니다. 그 아이는 충분히 강하니까요. 거기에 적들에게 연속적인 전투를 강요할 수 있으니, 적들 역시 한계에 다다르게 될 것은 명확하죠."
90001020-305 = "거기에 지형적인 이점도 고려할 수 있을 테고요."
90001020-306 = "그, 그렇지만 정말로…… 괜찮을까요? 혹시 그 아이에게 무슨 일이라도 생기면……."
90001020-307 = "무슨 말을 하는 거야. 아인. 오히려 그때야말로 네 순서가 오는 거잖아."
90001020-308 = "……! 그, 그렇네요……? 제가 조금 더 정신을 차려야 하는 것이었네요……. 으우우……."
90001020-309 = "뭐, 어차피 그때가 오면 우리 중에서 아인이 가장 신이 날 것 같지만요. 훗훗후."
90001020-310 = "그러면 결론을 내리자고. 게부라의 작전에 난 반대 없어. 아인과 오르는?"
90001020-311 = "네. 자율성을 존중해 주는 것은 중요하죠. 예언자들은 이제 막 진짜로 깨어나기 시작했으니까요."
90001020-312 = "아, 알겠어요. 소프와 오르가 그렇다면, 그리고 무엇보다 게부라 쨩이 그렇게 하고 싶다면……."
90001020-313 = "이름 없는 신들의 힘이 어떻게 다른 방식으로 활용될 수 있을지, 제가 최선을 다해 증명해 볼게요!"
90001020-318 = "다음화;두 번째"
