[translation]
10041080-1 = "후일담;스폰서"
10041080-4 = "하아……. 결국 이렇게 되는 건가."
10041080-5 = "우린 어디로 가는 거야? 교정국이겠지?"
10041080-6 = "뭐, 아무래도 그렇지 않을까. 아까 전 얼핏 들은 말론 그랬던 거 같은데."
10041080-13 = "하아아-."
10041080-15 = "땅 꺼지겠다, 야."
10041080-16 = "너무 낙심하지 마. 어쩔 수 없었잖아, 상대는 그 C&C였다고. 우리가 어쩔 수 있는 게 아니었어."
10041080-21 = "아뇨, 뭐. 그런 의미는 아니었지만……."
10041080-22 = "그나저나 다시 봤어. 솔직히 미카모 네루한테 걸렸을 때, 우릴 모른 척 버려버릴 줄 알았거든."
10041080-23 = "……네?"
10041080-24 = "맞아, 맞아! 솔직히 진짜 놀랐다니까!"
10041080-25 = "고용주한테 뒤통수 안 맞는 게 얼마 만인지 몰라. 다음에라도 일 있으면 언제든지 불러 달라고!"
10041080-26 = "그렇……습니까. 하하. 그래도 좋은 이미지였다니 다행이네요."
10041080-27 = "반면 제 고용주는……."
10041080-28 = "에? 고용주?"
10041080-30 = "아아. 그러고 보니 그쪽도 스폰서가 있다던가 했었지? 결국 우리랑 별반 다를 바 없는 처지였구나."
10041080-31 = "그렇죠. 사실 저도 어떤 사람인지는 잘 몰라요. 그저 제 목적을 도와준다기에 시키는 대로 한 것일 뿐."
10041080-32 = "하지만 지금 상황을 보니……. 아무래도 버려진 모양이네요."
10041080-33 = "어…… 음……."
10041080-34 = "저런……."
10041080-35 = "괜찮아요. 다 이해하고 있는 일이에요. 세상사 서로 일 시키는 관계라는 게 그렇죠, 뭐."
10041080-36 = "그리고 저도 맡은 일을 실패했으니……. 따질 처지는 아니고요."
10041080-41 = "누가 누굴 버렸단 말씀이시죠?"
10041080-46 = "……? 응?"
10041080-48 = "어라……? 방금 뭐지? 무슨 소리 들리지 않았어?"
10041080-49 = "확실히……."
10041080-60 = "문이 열리는데……!?"
10041080-66 = "여긴……."
10041080-67 = "……지하?"
10041080-72 = "\"안전한 장소\"지요. 여러분들을 빼내기 위해 특별히 마련된 곳이랍니다."
10041080-76 = "……!? 이 목소리는……."
10041080-77 = "……고용주."
10041080-78 = "뭐……!?"
10041080-85 = "서운하네요. 설마하니 제가 계약한 상대를 그런 식으로 버릴 거라 생각 하시다니."
10041080-86 = "물론 제가 필요에 따라 다른 분들을 유도하긴 합니다만……. 나름의 '책임'은 진답니다?"
10041080-87 = "……당신이……."
10041080-88 = "네, <히죽히죽 교수>입니다."
10041080-89 = "실제로 보는 건 처음이네요."
10041080-90 = "어라. 긴장하고 계시군요. 교정국으로 갈 걸 구해주었는데, 조금은 믿으셔도 괜찮지 않을까요?"
10041080-91 = "맞는 말씀이지만……. 오히려 그래서 더 의아한 면도 없지는 않거든요. 저는 맡은 일을 실패했잖아요?"
10041080-92 = "실패……?"
10041080-96 = "아아~. 과연, 거기서 서로 간의 인식 차이가 있었던 모양이네요."
10041080-97 = "인식 차이……?"
10041080-98 = "네. 걱정하지 마세요. 당신은 충분히 맡은 바 일을 잘 해주셨답니다. 지금 이 구출 계획 또한 그에 대한 보상이기도 하니까요."
10041080-99 = "……??"
10041080-100 = "그게 무슨……? 처음부터 다른 노림수가 있었단 이야긴가요?"
10041080-101 = "……후후. 유감스럽지만 그 부분은 비밀입니다. 지금 여러분이 하신 일과는 무관한 일이거든요."
10041080-106 = "아무튼 즐거운 거래였답니다. 좋은 하루 되시고, 조심히들 들어가세요."
10041080-107 = "저는 또 저 나름대로 일이 있어서 이만……."
10041080-118 = "……뭐……."
10041080-120 = "뭐야, 저 녀석은……?"
