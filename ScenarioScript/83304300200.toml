[translation]
83304300200-9 = "으으음~! 정말 여기고 저기고! 이런 쓰레기가 한 가득이잖아!"
83304300200-15 = "이오리? 뭘 하고 있는 거야?"
83304300200-16 = "아, 부장! 딴 게 아니라. 바닥에 잔뜩 널려 있는 이 전단지들 좀 봐!"
83304300200-17 = "만마전 녀석들…… 별 해괴한 내용이 적힌 전단지를 여기저기 뿌려댄 거 있지!"
83304300200-18 = "훈련 직전이긴 하지만 내버려둘 수 없어서 회수하고 있었어. 쓰레기 줍기란 거야."
83304300200-19 = "……듣기로는 전단지를 뿌리는 과정에서 뭔가 소동이 있었다는 모양이던데."
83304300200-20 = "마코토 의장이 날뛰려고 드는 걸 만마전 내부 인원과 선생님이 말렸다던가 뭐라던가."
83304300200-21 = "……잘은 모르겠지만, 선생님 쪽도 그쪽 나름대로 고생이라는 거네."
83304300200-22 = "흠. 이오리, 네 말대로 확실히 선도부로서 이것들을 그냥 내버려둘 수는 없겠어."
83304300200-26 = "……아직 훈련 전까진 시간이 조금 남아 있으니까."
83304300200-31 = "줍는 일, 나도 도와줄게."
83304300200-33 = "좋았어. 그럼 팍팍 가보자고!"
