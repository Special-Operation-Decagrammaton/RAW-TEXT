[translation]
2001606-1 = "가끔은 미소 짓는 프로일라인"
2001606-2 = "(이로하에게서 모모톡이 도착한 뒤로, 언제 이로하가 찾아와도 대응할 수 있도록 만반의 준비를 하였다.)"
2001606-3 = "[ns1] \"커피도 준비했고, 과자도 일단 채워 놨고…….\"\n[ns2] \"그럼 오기 전까지, 일이나 조금 더 하고 있을까.\""
2001606-14 = "[ns] \"후우, 이걸로 하나 끝났고……. 슬슬 이로하가 올 시간인데…….\""
2001606-15 = "(그렇게 잠시 마음의 준비를 했지만, 평소 이로하가 샬레를 자주 찾는 오전 시간을 지나 점심시간이 지날 때까지.)"
2001606-16 = "(이로하는 결국 샬레를 찾아오지 않았다.)"
2001606-19 = "(오후 3시가 지났을 때까지도 이로하는 샬레를 방문하지 않았다.)"
2001606-20 = "(평소 모모톡을 보낸 뒤로는 틈만 나면 샬레를 찾아오는 이로하였기에, 아무래도 오늘은 무언가 일이 있는 게 아닐까 우려가 되었다.)"
2001606-21 = "(평소와 사뭇 다른 느낌에 잠시 고민했지만, 결정은 바로 내릴 수 있었다.)"
2001606-22 = "[ns] \"……가볼까. 만마전에.\""
2001606-26 = "(그리하여 찾은 게헨나 학원 만마전 앞은 꽤 부산스러운 분위기가 감돌고 있었다.)"
2001606-27 = "전차의 이동이 끝났으면 그다음은 점검을 끝낸 분대 화기를 운반하겠습니다. 꾸물거리지 말고 빠르게 움직여주세요."
2001606-28 = "넵!"
2001606-29 = "다음 훈련이 있기 전까지 모든 장비는 보관에 각별히 신경 써주세요. 했던 일을 두 번 하고 싶진 않으니까."
2001606-30 = "……아니, 그냥 하는 말이 아니라. 진짜 싫거든요. 그런 거……."
2001606-31 = "네! 알겠습니다! 이로하 님!"
2001606-32 = "그리고 다음으로 진행해야 할 일은……."
2001606-33 = "네, 지시사항 전달은 여기까지입니다. 부디 다음 주에 있을 만마전의 전투 지휘검열에 차질이 없도록. 모두 분발해주세요."
2001606-34 = "예스-맴!"
2001606-35 = "하아……. 귀찮아."
2001606-36 = "[s] \"이로하?\""
2001606-37 = "응……? 이 목소리는……. 선생님?"
2001606-38 = "어라, 잠깐……. 선생님께서 여긴 어쩐 일로……."
2001606-39 = "[s] \"아, 그게 말이지…….\""
2001606-40 = "(이로하에게 직접 만마전까지 찾아온 경위를 이야기했다.)"
2001606-41 = "네? 평소 잘만 샬레에 찾아오던 제가 오늘따라 모습을 보이지 않으니까……."
2001606-42 = "무슨 일이 벌어진 건 아닐까. 걱정되어서 여기까지 행차하신 거라고요……?"
2001606-43 = "……푸훗."
2001606-44 = "[s] \"푸훗?\""
2001606-45 = "푸훗, 아핫, 아하하하! 그런 이유로 직접 만마전까지 찾아오신 거라니."
2001606-46 = "아니, 정말, 선생님……. 너무 방심하신 거 아니신가요?"
2001606-47 = "저, 매일 같이 선생님을 꾀어내기 위해 샬레로 찾아뵈었던 거라고요?"
2001606-48 = "만약 오늘 제가 찾아뵙지 않은 게, 역으로 선생님을 꾀어내기 위한 함정……. 계략이었으면 어쩌려고 그러셨나요?"
2001606-49 = "조심성이 너무 부족하신 거 아닌가요?"
2001606-50 = "[s] \"뭐, 뭐야?! 그랬던 거야?!\""
2001606-51 = "아니, 그럴 리가 없잖아요……."
2001606-52 = "오늘은 정말 보셨던 대로 바빴을 뿐이에요."
2001606-53 = "[s] \"아, 그래서 이로하가 이렇게 열심히 일을……. 놀랐어.\""
2001606-54 = "아니, 저, 아무리 그래도 이 정도 일은 한다구요……? 일단은 만마전의 전차장이고."
2001606-55 = "후후……. 어쨌거나 선생님의 반응을 보고 있자니, 어떠신가요? 제 우수한 모습에 조금 놀라셨나요? 지금보다 더욱 놀라셔도 상관없는데요."
2001606-56 = "[s] \"아냐, 방해해서 미안해, 바로 돌아가볼 테니까……\""
2001606-57 = "앗, 아뇨. 그러실 거 없어요."
2001606-58 = "그래도 모처럼 여기까지 찾아오신 거잖아요? 마침 잘 됐어요. 슬슬 일도 대강 마무리가 된 참이고."
2001606-59 = "남은 건 오늘 점검 결과를 의장에게 보고하는 것뿐이지만……."
2001606-60 = "네, <자의가 아닌 사정으로 보고가 늦어지는 일>은 언제나 있기 마련이잖아요?"
2001606-66 = "[ns] \"앗, 저기. 이로하…….\""
2001606-67 = "선생님만 괜찮으시다면, 저번에 이야기했던 제 아지트로 안내할까 하는데."
2001606-68 = "어떠신가요? 관심, 없으신가요?"
2001606-70 = "[ns] \"여긴…… 차고지?\""
2001606-71 = "네, 보시다시피 만마전의 전차를 들여놓는 장소예요. 요컨대 저의 주무대. 저의 공간, 저만의 아지트라고 할까요?"
2001606-72 = "자, 긴말 않고 선생님. 이쪽으로."
2001606-76 = "자, 이곳, 여기예요. 선생님."
2001606-79 = "[wa:100]― 후후,"
2001606-81 = "― 제법 나쁘지 않은 곳이지요? [wa:1300]"
2001606-84 = "[wa:600]― 이 푹신푹신한 방석,"
2001606-86 = "― 가지런히 놓인 [wa:1100]여러 간식들. [wa:50]"
2001606-89 = "― 거기다 [wa:1300]책과 게임까지 [wa:900]잔뜩."
2001606-92 = "[wa:400]― 저만의, [wa:1500]제가 자랑하는 쉼터라구요."
2001606-94 = "― 어떠신가요?"
2001606-97 = "[ns3] \"꽤 공들여 준비한 곳이네.\"\n[ns4] \"이로하가 자랑하는 이유도 잘 알겠어.\""
2001606-98 = "[wa:200]― 후후, [wa:1600]좀 더 감탄하고,"
2001606-99 = "[wa:200]― 후후, [wa:1600]좀 더 감탄하고,"
2001606-101 = "― 칭찬하셔도 [wa:550]좋다구요?"
2001606-104 = "[wa:500]― 그럼 [wa:1500]공범도 있겠다. [wa:200]"
2001606-106 = "― 늘 그랬듯이 오늘도 [wa:600]땡땡이 쳐볼까요? [wa:100]"
2001606-109 = "― 네~? [wa:800]선생님?"
2001606-113 = "자, 뭐, 결과론이긴 하지마는……."
2001606-114 = "이것으로 또 제 꾀임에 당해 버리셨네요. 선생님."
2001606-115 = "[s] \"그러게…….\""
2001606-116 = "후후후. 앞으로도 조심하시는 게 좋다구요?"
2001606-117 = "선생님이 방심한 틈을 노려, 다음번엔 정말로 앗 하는 사이에 제가 꾀어낼지도 모르니까요."
2001606-118 = "[s] \"노력하겠습니다.\""
2001606-119 = "이거, 앞으로도 제법 기대가 되네요. 선생님과의 승부~♪"
2001606-121 = "(이로하의 미소를 바라보며, 그렇게 샬레로 돌아오기 전까지 둘이서 함께 아지트에서 시간을 보냈다.)"
