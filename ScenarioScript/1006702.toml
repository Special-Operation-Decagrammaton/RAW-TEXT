[translation]
1006702-1 = "문제의 원인"
1006702-4 = "[ns] \"알았어…… 상황은 대충 이해했어. 토키.\""
1006702-5 = "이해해 주셔서 감사합니다. 선생님."
1006702-6 = "제 모든 것을 걸고, 마지막까지 선생님을 지키겠습니다."
1006702-7 = "[ns] \"그건 고마워. 토키를 믿고 있기도 하고. 그런데……\""
1006702-8 = "선생님. 말씀드렸듯이 이것은 임무입니다."
1006702-9 = "호화 크루즈에서 열리는, 2인 1조로만 들어갈 수 있는 비밀 파티."
1006702-10 = "그 파티에 잠입해서 정찰을 수행하기 위해서는, 선생님의 조력이 반드시 필요합니다."
1006702-11 = "[ns] \"그래. 토키에게 도움이 될 수 있다면야……\""
1006702-14 = "[ns] \"그런데…… 왜 그런 복장이야……?\""
1006702-17 = "너무나 당연한 것을 물으시는군요. 선생님."
1006702-18 = "바니걸 복장이야말로, C&C의 잠입 임무 정복이기 때문입니다!"
1006702-19 = "어디에서 그런 사실을 배웠냐고요? 저희 C&C에게는 지극히 당연한 상식이자, 기본입니다만."
1006702-20 = "확실히, 일반인에 속하시는 선생님께는 익숙하지 않은 사실일지도 모르겠군요. 거기까지 고려하지 못한 것은 확실히 제 불찰입니다."
1006702-21 = "[s] \"아니…… 꼭 그런 건 아닌데 말이지……\""
1006702-22 = "그렇다면 더더욱 문제는 없겠군요. 다행입니다."
1006702-23 = "그러면, 빠르게 목표 크루즈로 이동하도록 하지요. 한시도 지체할 수 없는 사안입니다."
1006702-24 = "[s3] \"조금 더, 주위의 시선이라든가 사회적인 드레스 코드라든가……\"\n[s4] \"그런 걸 고려해 주지 않을래……?\""
1006702-27 = "그런 것들이, 임무 수행에 반드시 필요한 사항들인가요?"
1006702-28 = "그런 것 같지는 않다고요? 좋습니다. 제가 고려할 필요는 없는 것들이군요."
1006702-32 = "어서 가시죠. 저희에게는 시간이 없습니다."
1006702-34 = "(어딘가 흥분하고 있는 것처럼 보이기까지 하는 토키와 함께, 목표인 크루즈선으로 향했다……)"
1006702-40 = "호화 크루즈선"
1006702-48 = "파티 현장까지는 무사히 도착했군요."
1006702-49 = "저에게서 떨어지지 마십시오. 선생님. 확실히 에스코트해 드리겠습니다."
1006702-50 = "음? 주위의 시선이 저희들에게 몰리는 것이 느껴지는군요. 설마…… 눈치챈 것일까요……?"
1006702-51 = "그렇다면 작전의 기초부터 다시 재고할 필요가 있겠습니다…… 큰일이군요."
1006702-54 = "허어…… 저기 좀 보세요. 파트너에게 저런 복장을 입히고 이 파티에 참가하다니……"
1006702-55 = "개인의 취향에 대해서는 다른 사람이 이래라저래라 할 게 아니겠지만, 그래도 저건 조금……"
1006702-56 = "그러게 말입니다. 저런 바니걸 같은 복장은 좀 더…… 개인적이거나 은밀한 공간에서 입어야 하는 것이 아닐까요?"
1006702-57 = "키보토스가 어찌 되려는지…… 쯧쯧."
1006702-60 = "[ns] \"……적어도, 눈치챈 것 같지는 않아……\""
1006702-61 = "정말인가요? 단언할 수 있으시죠, 선생님?"
1006702-62 = "[s] \"……그 대신 내 사회적 수명이…… 반으로 줄어들 것 같지만……\""
1006702-63 = "괜찮습니다. 선생님. 사회적 수명이란 줄었다가 늘었다가 하는 것이니까요."
1006702-64 = "지금의 저희가 고려할 요소로는 보이지 않습니다. 적어도 저에게는요."
1006702-65 = "물리적으로 지켜 주는 것은 고맙지만, 정신적으로도 지켜 주었으면 한다고요?"
1006702-66 = "잘 이해가 가지 않는 말씀을 하시는군요. 뭐, 선생님께서는 가끔씩 그러시니까요."
1006702-75 = "(토키는 당당하게, 팔짱까지 끼고 파티장 이곳저곳을 마음대로 활보했다.)"
1006702-76 = "(주위로부터 뜨겁게 쏟아지는 의혹의 눈초리에 토키는 아무렇지도 않은 듯이 보였지만, 이쪽은…… 정신적으로…… 한계를 맞이할 것 같았다……)"
1006702-78 = "?! 선생님, 조심하십시오."
1006702-79 = "무슨 일이냐고요? 저기에…… 타깃이 모습을 드러냈습니다."
1006702-87 = "본디 이 임무는 저 타깃의 심복들이 모습을 드러낼지 정찰하는 것……이었습니다만."
1006702-88 = "이렇게 타깃이 대놓고 모습을 드러낼 줄은…… 이것은 예상 밖의 전개로군요."
1006702-89 = "원래의 작전대로 정찰 임무만을 수행해야 할까요, 아니면 이 기회를 놓치지 말고 후환을 제거해야 할까요?"
1006702-90 = "……"
1006702-91 = "선생님."
1006702-97 = "지금부터 절대로, 제가 괜찮다고 말씀드리기 전까지, 모습을 드러내셔서는 안 됩니다."
1006702-98 = "반드시입니다. 저와 약속해 주세요."
1006702-100 = "(토키는 그 말을 남기고, 빠르게 손님들 속으로 모습을 감췄다.)"
1006702-101 = "(그리고……)"
1006702-103 = "콰아아앙-!!"
1006702-106 = "뭐, 뭐야?! 경호원, 경호원!"
1006702-122 = "조금 앞질러 간 듯한 기분은 있지만, 무사히 임무를 달성했습니다."
1006702-123 = "저희가 C&C라는 것을 밝혔을 때에도, 큰 오해 없이 넘어갈 수 있었던 것 같고요."
1006702-127 = "그런데 저의 착각일지도 모르겠습니다만."
1006702-128 = "저희를 향한 수군거림은, 어째 더 커진 것 같았던 기분이 듭니다."
1006702-129 = "어째서일까요, 선생님?"
1006702-130 = "[s] \"이러니저러니 해도…… 복장 때문이 아닐까……?\""
1006702-131 = "그런…… 가요?"
1006702-132 = "……"
1006702-133 = "제 복장, 그렇게 어울리지 않았습니까……?"
1006702-134 = "(토키는 겁먹은 토끼 같은 눈동자를 이쪽으로 향했다.)"
1006702-135 = "(달리 할 수 있는 말이…… 떠오르지 않았다.)"
1006702-136 = "[ns] \"오히려 너무 잘 어울려서 문제가 발생했던 것 같아.\""
1006702-137 = "네? 너무 잘 어울려서 문제가 발생했다고요?"
1006702-138 = "……"
1006702-139 = "이해했습니다. 그런 것이었군요."
1006702-140 = "[s] \"뭘 어떻게 이해했다는 건지 조금 무서운데?!\""
1006702-141 = "간단한 것입니다. 제 복장이 너무 잘 들어맞은 나머지, 주위로부터 선망을 산 것이라는 말씀이시잖습니까."
1006702-146 = "왜 침묵하시죠? 아하, 말을 덧붙일 필요도 없을 만큼 긍정하신다는 의미로군요."
1006702-147 = "이 또한 당연한 결과입니다. 저는 완벽한 메이드이자 최고의 요원이기에. 뿅."
1006702-152 = "그러면 선생님, 가실까요."
1006702-153 = "[s] \"어디로……?\""
1006702-154 = "그야 임무를 끝냈으니, 저희도 복귀해야 하겠지요."
1006702-155 = "아니면 혹시, 다른 상상이라도 하신 건가요?"
1006702-156 = "그건 아니라고요? 다행입니다."
1006702-165 = "가시죠. 제가 에스코트해 드리겠습니다."
1006702-167 = "(왠지 자신만만한 표정이 된 토키와 팔짱을 낀 채, 샬레로 돌아왔다……)"
