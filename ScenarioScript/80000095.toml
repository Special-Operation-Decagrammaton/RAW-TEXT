[translation]
80000095-1 = "진실은 저 너머에"
80000095-2 = "(카스미의 연락을 받고, 인적이라곤 보이지 않는 밤의 다리 위로 향했다.)"
80000095-3 = "(잠시간 기다리니, 저 멀리서 손을 흔들며 저벅저벅 걸어오던 카스미의 모습이 보였다.)"
80000095-4 = "오오~. 선생님~!! 일찍부터 나와 있었네~?"
80000095-5 = "와핫핫핫핫! 기다렸어? 미안, 미안. 원래는 좀 더 일찍 나와서 내가 선생님을 기다릴 계획이었지만……."
80000095-6 = "알다시피 내가 좀, 여기저기서 찾는 사람이 많아서 말이야. 쫓아오는 녀석들 눈을 피해 오느라 시간이 좀 걸렸지."
80000095-7 = "애초에 이런 오밤중에, 이런 썰렁한 다리 위에서 보자고 한 것도 그런 이유고 말이야."
80000095-8 = "……응? 그래서 무슨 일이냐고?"
80000095-9 = "어허~. 왜 이러시나, 이 사람. 아무리 나라도 이런 날 정도는 챙길 줄 안다고~."
80000095-10 = "당연하잖아? 오늘은 발렌타인 데이고……."
80000095-11 = "그게 아니라면……. 역시 나한테서 받는 초콜릿은 그다지 바라던 게 아니었던 걸까?"
80000095-12 = "만약 그런 거라면 미리 사과해야겠는걸. 괜히 소중한 시간 잡아먹게 해서. 와하하핫!!"
80000095-13 = "……절대 그런 게 아니라고? 그거 정말 다행이군! 덕분에 나도 맘 편하게 줄 수 있겠어."
80000095-14 = "그럼……."
80000095-15 = "자……. 여기! 두둥!!"
80000095-20 = "[ns1] \"슬……리퍼?\"\n[ns2] \"초콜릿……인가?\""
80000095-23 = "그렇지, 그렇지! 어때, 좀 그럴싸해 보여?"
80000095-24 = "기억하고 있어? 전에 숲에서 내 슬리퍼가 끊어졌을 때, 선생님이 새 슬리퍼 사 줬잖아."
80000095-25 = "물론 사 준 선생님이야 그러고 바로 잊어버렸을 거라고 생각하긴 하지만……. 나는 빚 진 채로 넘어가는 주의가 아니거든."
80000095-26 = "그렇지만 똑같은 슬리퍼를 사 줘 봐야 당장 선생님에게는 큰 의미가 없을 거 같고……. 그래서 이번 기회로 만들어 온 거지!"
80000095-27 = "어때. 꽤 그럴싸하지? 선생님이 보기에도 진짜 슬리퍼 같지?"
80000095-28 = "……응?"
80000095-29 = "직접 만들었냐고? ……글쎄? 어떨 거 같아?"
80000095-30 = "후후후. 일단 확실히 나의 흔적은 담겨 있어. 그건 약속하지."
80000095-31 = "어쩌면 그게 손이 아니라……."
80000095-32 = "……발 쪽일 수도 있긴 해도 말이야."
80000095-36 = "[ns3] \"…………예?\"\n[ns4] \"……발……?\""
80000095-39 = "자~, 사소한 이야기. 자잘한 이야기는 넘어가도록 하고!"
80000095-40 = "그러면 이제……."
80000095-44 = "……어이쿠."
80000095-45 = "선생님? 미안하지만 이만 들어가 봐야겠어. 아무래도 위치가 발각된 모양이라."
80000095-46 = "나랑 같이 있는 게 선도부나 다른 녀석들에게 들키면 선생님도 살짝 곤란할 테니……."
80000095-47 = "여기선 재빨리 사라지도록 하지!! 남은 시간도 좋은 밤 되라고~!"
80000095-48 = "슝~!!"
80000095-56 = "……아!!"
80000095-57 = "정 찝찝하면 먹지 말고 신고 다녀도 되니까 말이야~! 그런 재질이니까~!!"
80000095-58 = "맘대로 하라고~!! 와하하하핫!!"
80000095-66 = "(이후 샬레로 돌아가, 카스미가 준 초콜릿을 천천히 확인해 보았다.)"
80000095-67 = "(……딱딱한 바닥 부분과 달리, 위쪽은 부드럽고 달콤한 맛이었기에 잘 먹었다.)"
