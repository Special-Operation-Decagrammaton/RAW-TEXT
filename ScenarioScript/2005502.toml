[translation]
2005502-1 = "캐비닛 포비아"
2005502-4 = "게임개발부 부실"
2005502-5 = "[ns]\"유즈! 괜찮아?! 무슨 일이야?!\""
2005502-6 = "서, 선생님?!"
2005502-7 = "그, 그렇게 심각한 일은 아닌데……!"
2005502-8 = "예? 평소에 절대로 안 보여주던 모습을 갑자기 보여주는 것은……."
2005502-9 = "그 자체로 큰일인 거라고요……?"
2005502-10 = "……."
2005502-11 = "……사, 사실, 그, 맞아요, 선생님."
2005502-12 = "저, 더 이상 캐비닛이 편안하지 않아요……."
2005502-13 = "[s1]\"거 봐, 심각한 일이잖아.\"\n[s2]\"스테이터스에 대격변이 일어났잖니.\""
2005502-16 = "그, 그렇게 말씀하시니 한층 더 와닿긴 하는데……!"
2005502-17 = "[s]\"언제부터 캐비닛이 불편해진 거야?\""
2005502-18 = "그…… 그게……."
2005502-19 = "강철대륙에서 돌아온 직후부터인 것 같아요……."
2005502-20 = "[s3]\"혹시 어두운 곳에 들어가면…….\"\n[s4]\"그때의 기억들이 떠오르는 걸까?\""
2005502-23 = "아, 아뇨. 어두운 것과는 아무 관계 없어요."
2005502-24 = "그때의 기억 때문인 것은 맞지만……."
2005502-25 = "……."
2005502-26 = "그게, 캐비닛처럼 좁은 공간에 들어가면 어쩐지, 바닥이 그대로 푹 꺼질 것 같은 기분이 들어서요……."
2005502-27 = "[s]\"바닥이 꺼질 것 같다고?\""
2005502-28 = "네, 구체적으로 말하자면…… 수송선의 사출 포트에 들어갔을 때의 기억이 떠올라서요."
2005502-29 = "좌우가 막힌 좁은 공간에 앉아 있노라면, 예고도 없이 바닥이 열리고 그대로 지상으로 사출된 뒤 갑자기 전투가 시작될 것 같아서……."
2005502-30 = "불안한 마음에 이전처럼 캐비닛에서 안락하게 쉴 수 없게 되어버렸어요."
2005502-31 = "[s]\"그건 곤란한 일이네.\""
2005502-32 = "……그, 그런데요, 선생님."
2005502-33 = "어, 어쩌면, 차라리 잘된 일…… 일 수도 있지 않을까요……?"
2005502-34 = "[s]\"잘된 일이라고……?\""
2005502-35 = "네. 이제는 캐비닛에서 시간을 보낼 수 없게 되었으니까……."
2005502-36 = "차라리 이걸 계기로…… 남들처럼 더 많이 밖으로 돌아다니고……."
2005502-37 = "더 많은 사람들을 만나고……."
2005502-38 = "그래서 더 평범한 사람이 되는 것이, 어쩌면 더 좋은 게 아닐까…… 그런 생각이……."
2005502-39 = "[s]\"그건 진심으로 하는 이야기야?\""
2005502-40 = "……."
2005502-41 = "……선생님이 생각하시기엔 좋은 변화가 아닌가요?"
2005502-42 = "[s5]\"변화하고 나아가려 하는 자세는 좋다고 생각해.\"\n[s6]\"하지만 그 계기가 불안이나 도망치는 것에서 시작되는 건 좋지 않아.\""
2005502-45 = "……맞아요, 선생님."
2005502-46 = "저는…… 아직 나갈 준비가 충분히 되지 않은 것 같아요."
2005502-47 = "무엇보다도 낯선 학생들이나 유우카 선배가 갑자기 부실에 들이닥쳤을 때 숨을 곳이 필요하기도 하고……."
2005502-48 = "[s]\"그럼 어쩔 수 없네.\""
2005502-52 = "[ns]\"그렇다면 다시 캐비닛에 들어가는 훈련을 하도록 할까?\""
2005502-53 = "예? 후, 훈련이요…… 그게 무슨……?"
2005502-54 = "……서, 선생님?!"
2005502-60 = "어, 어째서 다시 이 복장인가요?!"
2005502-61 = "[ns]\"나왔다! UZQueen 무장 모드!\""
2005502-62 = "어째서 해설처럼 말하고 계신 건가요?! 선생님께서 입으라고 하셨잖아요?!"
2005502-63 = "……네? 이 상태로 캐비닛 안에 들어가 보라고요?"
2005502-64 = "잠깐, 그, 그건……!"
2005502-65 = "오, 오히려 더 무서워지는데요……!"
2005502-66 = "이 복장 때문에 오히려 그때의 기억이 더 생생하게 떠올라 버려요……!"
2005502-67 = "으우우…… 이제는 네오 아방가르드의 콕핏에서 비상탈출 될 때의 기억까지 떠오르기 시작해서……!"
2005502-72 = "……어라?"
2005502-74 = "(불안해하는 유즈의 두 손을 꼭 잡아주었다.)"
2005502-75 = "서…… 선생님? 어째서……"
2005502-76 = "다시 캐비닛 안에, 앉아 보라고요……?"
2005502-77 = "이, 이대로……?"
2005502-83 = "그, 그렇다, 면 잠깐……."
2005502-89 = "[ns]\"어때?\""
2005502-90 = "자, 잘, 모르겠어요."
2005502-91 = "조, 조금은 안심이 되는 것 같기도 하고……."
2005502-92 = "어째서일까요, 같은 공간에 앉아 있는 것뿐인데."
2005502-93 = "아까보다는 훨씬 나아진 기분이에요."
2005502-94 = "[ns]\"그야 내가 계속 유즈를 잡아주고 있으니까.\""
2005502-96 = "[ns7]\"이제는 바닥이 꺼지더라도, 혹은 갑자기 솟구치더라도 괜찮아.\"\n[ns8]\"유즈가 멀리 날아가지 않도록 내가 꼭 붙잡아 줄 테니까.\""
2005502-99 = "끝까지…… 저를…… 잡고……."
2005502-100 = "……."
2005502-101 = "가……"
2005502-102 = "감사합니다, 선생님."
2005502-107 = "(그렇게, 한참 동안 캐비닛 안에 앉은 유즈의 손을 붙잡고 느긋한 시간을 보냈다.)"
