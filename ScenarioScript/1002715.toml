1002715-187 = "[s] \"Karin! That's really sweet!\""
1002715-188 = ""
1002715-190 = ""
1002715-191 = ""
1002715-192 = "Well, those are just my honest feelings. Since I'm always counting on you."
1002715-193 = "...Thank you, as always, Sensei."
