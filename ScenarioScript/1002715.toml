[translation]
1002715-1 = "意想不到的禮物"
1002715-2 = ""
1002715-3 = "……嗯，我明白了。"
1002715-4 = "也就是說，有個偽裝成動物保護團體的黑心商人……"
1002715-5 = "把向學生們募來的錢用在了奇怪的地方，所以想盡快抓住他對吧？"
1002715-6 = "[s] 「嗯！沒錯！」"
1002715-7 = "……"
1002715-8 = "我同意這是個很重要的任務。"
1002715-9 = "但是我有個疑問。"
1002715-10 = "為什麼非得穿上兔女郎的服裝呢？"
1002715-11 = "[ns1] 「因為對方也是兔女郎？」\n[ns2] 「萬一有突發狀況，方便混入敵人之間？」"
1002715-17 = ""
1002715-18 = ""
1002715-19 = ""
1002715-21 = ""
1002715-22 = "這，這樣啊。"
1002715-23 = "雖然警衛的服裝是兔女郎相當讓人在意……"
1002715-24 = "不過想必不是什麼正常的理由吧。"
1002715-25 = "總之，我會迅速將他們制伏。"
1002715-26 = "在老師擔心的突發狀況發生之前。"
1002715-27 = ""
1002715-29 = ""
1002715-31 = "（不久後……）"
1002715-32 = ""
1002715-39 = "（……只花費幾發子彈就俐落地把事態收拾乾淨了）"
1002715-42 = ""
1002715-43 = ""
1002715-44 = ""
1002715-45 = "唔，唔啊啊啊！怎，怎麼可以就這樣結束！"
1002715-46 = "我那打造專屬兔女郎帝國的遠大野心……！"
1002715-47 = "少囉嗦，你這個罪犯！快給我乖乖上車！"
1002715-49 = ""
1002715-50 = ""
1002715-51 = "兔女郎……帝國？"
1002715-52 = "[s3] 「總，總之今天辛苦了！」\n[s4] 「差不多到吃飯時間了，我們去吃點好吃的吧！」"
1002715-55 = "嗯。但是……穿著這身服裝有點困擾。"
1002715-56 = "因為絲襪稍微破了。"
1002715-57 = "[s] 「咦？你沒事吧？」"
1002715-58 = "沒什麼大不了的。"
1002715-59 = "絲襪的耐用度本來就不高，光是碰到地面就經常會損壞。"
1002715-60 = "不能穿著破掉的絲襪到處走來走去，得趕快換掉才行……"
1002715-61 = ""
1002715-63 = ""
1002715-64 = "……嗯？你的眼神怎麼好像有點惋惜的感覺。"
1002715-65 = "莫非老師你……更喜歡破掉的那種嗎？"
1002715-66 = "[s5] 「才，才沒有呢！」\n[s6] 「呵呵呵……就當作是我們之間的祕密吧。」"
1002715-69 = "這，這樣啊。"
1002715-70 = "總之我去先換一下。麻煩你稍等。"
1002715-71 = ""
1002715-73 = ""
1002715-75 = "（不久後……）"
1002715-76 = ""
1002715-80 = ""
1002715-81 = "我回來了。"
1002715-82 = "接下來要去哪裡呢？"
1002715-83 = "嗯？我想去的地方……是嗎？"
1002715-84 = "那麼……就去家常菜的專賣店吧。"
1002715-85 = "我認為家常菜是優秀女僕的必備條件。"
1002715-86 = "光是體驗專賣店的菜色，也能成為很好的學習。"
1002715-87 = "[s7] 「家常菜的學習啊……」\n[s8] 「花凜好像會成為很愛家的人呢。」"
1002715-90 = "唔，唔嗯……！"
1002715-91 = "總之目的地已經決定好了，我們趕快出發吧。"
1002715-95 = "（於是抵達的地方是……）"
1002715-96 = ""
1002715-97 = "購物中心時尚專區"
1002715-98 = "……？"
1002715-99 = "為什麼會來這裡？我們不是要去家常菜店嗎？"
1002715-100 = "[s9] 「剛好在路上看到了這家店。」\n[s10] 「先來挑絲襪吧！」"
1002715-101 = ""
1002715-103 = ""
1002715-106 = "[ns] 「你是為了幫我才把絲襪弄破的，當然要我來買才行！」"
1002715-107 = "老師買給我的絲襪……？"
1002715-108 = "嗯……倒也不是不行……"
1002715-109 = ""
1002715-112 = ""
1002715-113 = "歡迎光臨。請問在找什麼商品嗎？"
1002715-114 = "啊……那個……"
1002715-115 = "兔女郎服裝一直都是搭配網狀絲襪，買一樣的應該就可以了。"
1002715-116 = "[s] 「花凜喜歡網狀的嗎？」"
1002715-117 = ""
1002715-119 = ""
1002715-120 = ""
1002715-121 = "我並沒有特別偏好某種樣式。"
1002715-122 = "只是一開始配發的是那種設計，所以就這麼穿下去了而已……"
1002715-123 = "[s11] 「如果一直找同樣的款式來穿……」\n[s12] 「會不會就代表你還挺喜歡的呢？」"
1002715-126 = "咦，是嗎？"
1002715-127 = "難道是我在無意之間……覺得兔女郎就該搭配網狀絲襪嗎？"
1002715-128 = ""
1002715-130 = ""
1002715-131 = "老師你怎麼看呢？"
1002715-132 = "那個設計……適合我嗎？"
1002715-133 = "[s] 「嗯！花凜的兔女郎就是要搭配網狀絲襪！！」"
1002715-134 = "……！"
1002715-135 = "這，這樣啊。"
1002715-136 = "老師喜歡的話……我也覺得那樣好。"
1002715-138 = ""
1002715-139 = ""
1002715-140 = "（要放閃的話能不能去其他地方啊……）"
1002715-142 = ""
1002715-143 = "[ns] 「那就馬上買下來穿穿看吧！」"
1002715-144 = ""
1002715-146 = ""
1002715-148 = "現在馬上嗎？"
1002715-149 = "嗯……好，在這裡的話應該沒問題吧。"
1002715-150 = "您決定要這個了嗎？我馬上為您結帳。"
1002715-151 = ""
1002715-153 = ""
1002715-154 = "……"
1002715-155 = "那麼……我去一趟更衣室。"
1002715-156 = ""
1002715-160 = "（幾分鐘後……）"
1002715-161 = ""
1002715-165 = ""
1002715-166 = "怎，怎麼樣？"
1002715-167 = "果然兔女郎就該搭配這款絲襪嗎？"
1002715-168 = "[s] 「嗯！棒極了！」"
1002715-169 = "這，這樣啊。"
1002715-170 = "那麼……今後穿上兔女郎服裝的時候，我都會穿上這款絲襪的。"
1002715-171 = "畢竟老師也說這樣很好嘛。"
1002715-172 = "[s] 「那麼……要不要再多買個十雙左右？」"
1002715-173 = "需要買那麼多嗎？"
1002715-174 = ""
1002715-176 = ""
1002715-177 = "難道說……老師你的目的也是打造兔女郎帝國嗎？"
1002715-178 = "[s] 「絲襪是消耗品，多準備一些也沒關係吧？」"
1002715-179 = "嗯……雖然是這樣沒錯……"
1002715-180 = "……我明白了。這也代表老師對我的關心吧。"
1002715-181 = "而且留一雙下來作為收藏好像也不錯。"
1002715-182 = "[s] 「嗯？要把絲襪當成紀念品嗎？」"
1002715-183 = "因為老師也說了很適合。"
1002715-184 = "不過這終究是消耗品……遲早會有用完的一天吧。"
1002715-185 = "那樣會讓我覺得非常可惜。"
1002715-186 = "所以……留一雙一直保存著應該也無妨吧。"
1002715-187 = "[s] 「啊啊……謝謝你，花凜！」"
1002715-188 = ""
1002715-190 = ""
1002715-191 = ""
1002715-192 = "該說那句話的是我才對。我一直受你照顧呢。"
1002715-193 = "……一直以來都很謝謝你，老師。"
1002715-194 = ""
1002715-196 = ""
1002715-197 = ""
1002715-198 = "（就說了要放閃去其他地方嘛……）"
1002715-200 = "（於是買了絲襪之後，在花凜想去的家常菜店用了餐）"
1002715-201 = ""
1002715-202 = ""
1002715-204 = "（那是對彼此都成為愉快回憶的一天）"
