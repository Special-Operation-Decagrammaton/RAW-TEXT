1002715-52 = "[s3] \"วะ... วันนี้เหนื่อยมากแล้วละ ไปกินข้าวกันเถอะ!\"\n[s4] \"ได้เวลากินข้าวพอดี ไปหาอะไรอร่อยๆ กินกันเถอะ!\""
1002715-55 = "อื้อ แต่ว่า... ชุดนี้ไม่ค่อยเหมาะเท่าไร"
1002715-56 = "พอดีถุงน่องมันขาดนิดหน่อยน่ะ"
