1002715-123 = "[s11] \"If you've stuck with it, even when you had other options...\"\n[s12] \"Doesn't that mean you do actually like them?\""
1002715-126 = "Hm, I didn't think about it that way."
1002715-127 = "Maybe I'd grown attached to them without realizing."
1002715-128 = ""
1002715-130 = ""
1002715-131 = "What do you think, Sensei?"
