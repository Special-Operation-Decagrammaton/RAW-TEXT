[translation]
1002715-1 = "생각지 못한 선물"
1002715-3 = "……으음, 이해했어."
1002715-4 = "그러니까 동물 보호단체로 위장한 악덕 사업가가 있는데……."
1002715-5 = "학생들에게 모금한 돈을 엉뚱한 곳에 쓰고 있어서 빨리 붙잡고 싶다, 이거지?"
1002715-6 = "[s] \"응! 맞아!\""
1002715-7 = "……."
1002715-8 = "중요한 임무라고 생각해."
1002715-9 = "하지만 의문이 생기는데."
1002715-10 = "왜 이 일에 바니걸 의상을 입어야 했던 거야?"
1002715-11 = "[ns1] \"저쪽도 바니걸이라서?\"\n[ns2] \"돌발 상황이 일어나면 적들 사이에 숨기 좋아서?\""
1002715-22 = "그, 그렇군."
1002715-23 = "가드들 복장이 바니걸인 점이 상당히 신경 쓰인다만……."
1002715-24 = "보나 마나 정상적인 이유는 아니겠지."
1002715-25 = "아무튼 신속하게 제압하겠어."
1002715-26 = "선생님이 걱정한 돌발 상황이 일어나기 전에 말이야."
1002715-31 = "(그렇게 잠시 후…….)"
1002715-39 = "(……단 몇 발로 깔끔하게 사태가 정리되었다.)"
1002715-45 = "크, 크아아악! 이, 이렇게 끝날 수는 없어!"
1002715-46 = "나만의 바니걸 제국을 만들겠다는 원대한 야망이……!"
1002715-47 = "시끄러워, 이 범죄자 녀석! 얌전히 호송차에 타!"
1002715-51 = "바니걸…… 제국?"
1002715-52 = "[s3] \"아, 아무튼 오늘 고생 많았어!\"\n[s4] \"슬슬 밥시간이니 맛있는 거라도 먹으러 가자!\""
1002715-55 = "응. 하지만…… 이 복장으로는 곤란해."
1002715-56 = "스타킹이 조금 찢어졌거든."
1002715-57 = "[s] \"어? 괜찮은 거야?\""
1002715-58 = "별거 아니야."
1002715-59 = "스타킹은 내구도가 약하다 보니, 땅에 닿는 것만으로도 망가지곤 하니까."
1002715-60 = "아무튼 망가진 스타킹을 신고 돌아다닐 수는 없으니, 어서 갈아입어야……."
1002715-64 = "……응? 뭔가 아쉬워하는 눈빛인데."
1002715-65 = "설마 선생님은 찢어진 쪽을 더 좋아하는 건가?"
1002715-66 = "[s5] \"그, 그런 거 아니야!\"\n[s6] \"후후후…… 비밀로 해둘게.\""
1002715-69 = "으, 으으음."
1002715-70 = "아무튼 갈아입고 오지. 조금만 기다려줘."
1002715-75 = "(그렇게 잠시 후…….)"
1002715-81 = "다녀왔다."
1002715-82 = "이제 어디로 갈 거지?"
1002715-83 = "응? 내가 가고 싶은 곳…… 이라고?"
1002715-84 = "그렇다면…… 가정식 전문점이 좋겠어."
1002715-85 = "가정식은 훌륭한 메이드의 필수 조건이라 생각하거든."
1002715-86 = "전문점의 메뉴를 경험하는 것만으로도 좋은 공부가 될 거야."
1002715-87 = "[s7] \"가정식 공부라…….\"\n[s8] \"카린은 가정적인 사람이 될 것 같네.\""
1002715-90 = "으, 으으음……!"
1002715-91 = "아무튼 목표를 정했으니 어서 출발하자."
1002715-95 = "(그렇게 우리가 도착한 곳은…….)"
1002715-97 = "쇼핑몰 패션 코너"
1002715-98 = "……?"
1002715-99 = "왜 여기로 온 거지? 가정식집에 가는 것 아니었나?"
1002715-100 = "[s9] \"가는 길에 가게가 보여서.\"\n[s10] \"우선 스타킹부터 고르자!\""
1002715-106 = "[ns] \"나를 돕다가 스타킹이 망가졌으니까, 내가 사줘야지!\""
1002715-107 = "선생님이 사주는 스타킹이라고……?"
1002715-108 = "뭐…… 안 될 건 없지만……."
1002715-113 = "어서 오세요. 찾고 계신 제품이 있나요?"
1002715-114 = "아…… 그게……."
1002715-115 = "바니걸 의상엔 항상 그물 모양 스타킹을 신었으니, 똑같은 거면 될 것 같은데."
1002715-116 = "[s] \"카린은 그물 모양이 좋은 거야?\""
1002715-121 = "딱히 그 모양을 선호하는 건 아니다."
1002715-122 = "처음에 보급받았던 디자인을 계속 구해서 신었을 뿐……."
1002715-123 = "[s11] \"지금까지 계속 같은 걸 구해서 신었다면…….\"\n[s12] \"그만큼 마음에 들었다는 게 아닐까?\""
1002715-126 = "응? 그런가……?"
1002715-127 = "나도 모르는 사이에…… 바니걸엔 그물 모양 스타킹이 좋다고 생각한 건가?"
1002715-131 = "선생님이 보기엔 어떻지?"
1002715-132 = "그 디자인이…… 나랑 잘 어울려?"
1002715-133 = "[s] \"응! 카린의 바니걸엔 그물 모양이 좋아!!\""
1002715-134 = "……!"
1002715-135 = "그, 그렇군."
1002715-136 = "선생님이 좋다면…… 나도 좋다."
1002715-140 = "(꽁냥거리는 건 안 보이는 곳에서 해줬으면…….)"
1002715-143 = "[ns] \"그럼 바로 사서 착용해 보자!\""
1002715-148 = "지금 바로 말인가?"
1002715-149 = "으음…… 뭐, 여기서라면 괜찮겠지."
1002715-150 = "그걸로 정하셨군요? 바로 결제 도와드리겠습니다."
1002715-154 = "……."
1002715-155 = "그럼…… 탈의실에 다녀오겠다."
1002715-160 = "(몇 분 뒤…….)"
1002715-166 = "어, 어떻지?"
1002715-167 = "역시 바니걸엔 이 스타킹이 좋은가?"
1002715-168 = "[s] \"응! 최고야!\""
1002715-169 = "그, 그렇군."
1002715-170 = "그렇다면…… 앞으로도 바니걸엔 이 스타킹을 신겠어."
1002715-171 = "선생님이 좋다고 해줬으니까."
1002715-172 = "[s] \"그럼…… 한 10개 정도 더 살까?\""
1002715-173 = "그렇게나 많이?"
1002715-177 = "혹시…… 선생님도 바니걸 제국을 만드는 것이 목적인가?"
1002715-178 = "[s] \"스타킹은 소모품이니까 넉넉하게 있는 편이 좋잖아?\""
1002715-179 = "음…… 그렇긴 한데……."
1002715-180 = "……알겠다. 그만큼 날 신경 써준다는 뜻이니까."
1002715-181 = "하나 정도는 남겨둬서, 계속 간직해도 좋을 것 같고."
1002715-182 = "[s] \"응? 스타킹을 기념품으로?\""
1002715-183 = "선생님이 잘 어울린다고 해줬으니까."
1002715-184 = "하지만 이건 소모품……. 언젠간 다 써버리고 말겠지."
1002715-185 = "그건, 매우 안타깝다고 생각해."
1002715-186 = "그러니…… 하나 정도는 계속 가지고 있어도 괜찮겠지."
1002715-187 = "[s] \"아아……. 고마워, 카린!\""
1002715-192 = "그런 말을 해야 하는 건 나다. 항상 신세 지고 있으니까."
1002715-193 = "……언제나 고마워, 선생님."
1002715-198 = "(그러니까 제발 안 보이는 곳에서…….)"
1002715-200 = "(그렇게 스타킹을 구매한 뒤, 카린이 원하는 가정식 가게에서 식사를 했다.)"
1002715-204 = "(서로에게 즐거운 추억이 된 날이었다.)"
