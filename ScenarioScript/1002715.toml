1002715-149 = "Um, well, I guess it'd make sense to."
1002715-150 = "Are those the ones you'd like to go with? I can ring you up whenever you're ready."
1002715-151 = ""
1002715-153 = ""
1002715-154 = "..."
1002715-155 = "If you don't mind directing me to the changing room, I'll try them on first."
1002715-156 = ""
1002715-160 = "A few minutes later..."
1002715-161 = ""
1002715-165 = ""
1002715-166 = "H-How do I look?"
1002715-167 = "Do they pair well with the suit?"
1002715-168 = "[s] \"Yes, they're perfect!\""
1002715-169 = "...I see."
1002715-170 = "Then I'll stick with fishnets."
1002715-171 = "Since you liked them."
