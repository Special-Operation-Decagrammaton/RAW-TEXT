1002715-96 = ""
1002715-97 = "Shopping Mall Fashion Corner"
1002715-98 = "...?"
1002715-99 = "Why are we here? I thought we were going to a restaurant?"
1002715-100 = "[s9] \"It caught my eye as we were walking by.\"\n[s10] \"So let's replace your torn stockings!\""
1002715-101 = ""
1002715-103 = ""
1002715-106 = "[ns] \"I feel responsible, since it happened while you were helping me!\""
1002715-107 = "You want to buy me stockings...?"
1002715-108 = "Well... I guess I can see where you're coming from."
1002715-109 = ""
1002715-112 = ""
1002715-113 = "Welcome! Can I help you find anything today?"
1002715-114 = "Right. About that..."
1002715-115 = "I've always worn the fishnet stockings with my bunny suit, so I'd like to stick to that."
