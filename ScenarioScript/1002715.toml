1002715-60 = "I don't want to be out and about with torn stockings. I'll take a moment to go change."
1002715-61 = ""
1002715-63 = ""
1002715-64 = "...Huh? You look a bit disappointed."
1002715-65 = "By chance, do you have a preference for torn-up stockings, Sensei?"
1002715-66 = "[s5] \"Th-That's not it!\"\n[s6] \"Fufufu... That's for me to know...\""
1002715-69 = "Um..."
1002715-70 = "I'm going to go change now. Please meet me in the front."
1002715-71 = ""
1002715-73 = ""
1002715-75 = "A little bit later..."
1002715-76 = ""
1002715-80 = ""
1002715-81 = "I'm back."
