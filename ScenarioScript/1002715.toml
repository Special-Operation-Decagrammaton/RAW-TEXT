1002715-83 = "Hmm? Anywhere I want to?"
1002715-84 = "I'd like to go somewhere with comfort food, in that case."
1002715-85 = "Any competent maid should be well-versed in making home-cooked meals, shouldn't they?"
1002715-86 = "So it'd help me to try out a restaurant that specializes in that kind of menu."
