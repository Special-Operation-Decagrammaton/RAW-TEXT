1002715-178 = "[s] \"You said they rip easily! Wouldn't it be good to have extra?\""
1002715-179 = "I suppose I can't argue with that."
1002715-180 = "...Fine. I'll consider it a token of your affection."
1002715-181 = "And I'll set one aside...as a souvenir of sorts."
