1002715-17 = ""
1002715-18 = ""
1002715-19 = ""
1002715-21 = ""
1002715-22 = "...U-Understood."
1002715-23 = "It bothers me that the guards are all required to wear bunny suits."
1002715-24 = "There's not a single reasonable explanation for it."
1002715-25 = "Anyways, I'll subdue them quickly."
1002715-26 = "So you won't need to worry about any emergencies."
1002715-27 = ""
1002715-29 = ""
1002715-31 = "A short while later..."
1002715-32 = ""
