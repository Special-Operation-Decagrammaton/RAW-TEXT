1002715-29 = ""
1002715-31 = "(หลังจากนั้นไม่นาน...)"
1002715-32 = ""
1002715-39 = "(สถานการณ์ก็คลี่คลายลงได้ด้วยกระสุนเพียงไม่กี่นัด...)"
1002715-42 = ""
1002715-43 = ""
1002715-44 = ""
1002715-45 = "อะ... อ๊ากกก! จะ... จะจบแบบนี้ไม่ได้นะ!"
1002715-46 = "ความทะเยอทะยานอันยิ่งใหญ่ที่จะสร้างอาณาจักรบันนี่เกิร์ลของฉัน...!"
1002715-47 = "หนวกหูน่า เจ้าคนชั่ว! ขึ้นรถควบคุมตัวมาเดี๋ยวนี้เลย!"
