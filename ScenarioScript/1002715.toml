[translation]
1002715-1 = "ของขวัญที่คาดไม่ถึง"
1002715-2 = ""
1002715-3 = "อืม... เข้าใจแล้ว"
1002715-4 = "สรุปก็คือ มีนักธุรกิจชั่วร้ายที่ปลอมตัวเป็นองค์กรคุ้มครองสัตว์..."
1002715-5 = "เขาเอาเงินที่นักเรียนบริจาคไปใช้ผิดวัตถุประสงค์ ก็เลยอยากจับตัวให้เร็วที่สุด ถูกต้องมั้ย?"
1002715-6 = "[s] \"อื้อ! ถูกต้อง!\""
1002715-7 = "..."
1002715-8 = "ฉันว่านี่เป็นภารกิจสำคัญเลย"
1002715-9 = "แต่ฉันมีข้อสงสัยอยู่ข้อหนึ่ง"
1002715-10 = "ทำไมถึงต้องให้ใส่ชุดบันนี่เกิร์ลมาทำภารกิจครั้งนี้ด้วยล่ะ?"
1002715-11 = "[ns1] \"เพื่อความกลมกลืนน่ะ พอดีอีกฝ่ายใส่ชุดบันนี่เกิร์ลเหมือนกัน\"\n[ns2] \"ถ้ามีเหตุการณ์ไม่คาดคิด จะได้แฝงตัวท่ามกลางศัตรูได้ง่ายไง\""
1002715-17 = ""
1002715-18 = ""
1002715-19 = ""
1002715-21 = ""
1002715-22 = "ปะ... เป็นอย่างนี้เองสินะ"
1002715-23 = "ถึงฉันจะยังระคายใจอยู่มากที่พวกการ์ดก็ใส่ชุดบันนี่เกิร์ล..."
1002715-24 = "แต่ก็คงไม่ใช่เหตุผลปกติทั่วไปหรอก"
1002715-25 = "เอาเป็นว่าฉันจะรีบจัดการให้เร็วที่สุด"
1002715-26 = "ก่อนที่เหตุการณ์ไม่คาดฝันที่คุณครูเป็นห่วงจะเกิดขึ้น"
