[translation]
51010-1 = "제1화;프롤로그"
51010-6 = "어, 어디야?! 그 녀석은 어디에……!"
51010-13 = "……!"
51010-19 = "리더! 뒤입니다……!"
51010-20 = "에잇! 놓치지 않는다고!"
51010-26 = "헤헹! 맛이 어떠냐!"
51010-27 = "굉장해! 리더! 이거라면 놈도 꼼짝없이……!"
51010-28 = "아닙니다…… 놈은 저기에……!"
51010-41 = "끄, 끄아악?!"
51010-51 = "자, 횡포는 거기까지 해두도록 해. 망량즈."
51010-52 = "회, 횡포라니, 우리가 뭘 했다고……"
51010-53 = "뭘 했냐니……."
51010-54 = "방금까지만 해도 거리를 돌아다니며 상점가 사람들에게 이리저리 시비 걸고 있었잖아?"
51010-56 = "시비라니! 실례구만!"
51010-57 = "우리는 어디까지나 리더의 위대한 계획에 따라 일사불란하게 움직이고 있었을 뿐이라고요!"
51010-62 = "리더! 그 대단한 계획을 설명해 주시죠!"
51010-64 = "듣기만 해도 깜짝 놀랄걸요!"
51010-70 = "……?"
51010-71 = "아니, 뭐, 그 대, 대단하다고 할 정도까진 아니고……"
51010-72 = "그냥 <다음 주에 있을 축제가 시작되기 전에 마구 난동을 부려서 우리 입맛대로 축제를 주무르자! 계획>을 시작했을 뿐이라고 할까……!"
51010-73 = "…………."
51010-74 = "모두가 영 아니다. 싶으면 바로 그만둘 생각이었달까……."
51010-76 = "리더의 완벽한 계획!"
51010-77 = "우리가 방해하게 두지 않겠습니다!"
51010-79 = "그, 그 정도로 대단한가 역시……?"
51010-81 = "오랜만에 돌아왔지만, 여전하구나. 너희들은."
51010-82 = "……미안하지만, 우연이라고는 해도 내 눈에 띈 이상."
51010-86 = "이 이상의 난동은 내버려 두지 않아."
51010-88 = "으읏……!"
51010-89 = "자, 잠깐!"
51010-90 = "그보다 갑자기 나타나서 우리를 방해하는 넌 대체 뭐야?! 생각해 보니 억울해!"
51010-91 = "……응?"
51010-92 = "리더. 저 옷…… 저 특징적인 물빛깔의 하오리라면 혹시……"
51010-93 = "아, 맞아요! 저 녀석! 백화요란이 틀림없어요!"
51010-94 = "뭐어?!"
51010-95 = "백화요란이라면 그거잖아! 백귀야행의 그──!"
51010-97 = "아냐."
51010-99 = "아직 내가 결정적인 대사를 말하기 전인데요?!"
51010-101 = "너희가 생각하는 것과 달라."
51010-102 = "이건……"
51010-104 = "……코스프레야."
51010-108 = "……그래. <그걸> 반납하러 온 이상, 나는 더는……."
51010-115 = "백화요란이 아니니까."
51010-121 = "샬레 집무실"
51010-124 = "(평소와 마찬가지로 샬레의 업무를 처리하던 어느 날 오후.)"
51010-130 = "[ns] \"아, 네. 전화 받았습니다.\""
51010-132 = "냐하핫. 안녕하세요. 선생님. 오랜만이네요."
51010-133 = "오늘 같은 날, 무엇을 하고 계셨나요?"
51010-134 = "[s] \"서류 작업 중이었어.\""
51010-137 = "(지금 마침 처리하고 있는 서류는 <각 학원 자치구의 피해 보고 및 지원 예산운용지침보고서> 같은 것처럼, 지난날 벌어진 사건과 관련 있는 것이 대부분이었다.)"
51010-139 = "아항~ 과연, 그때의 뒤처리로군요. 마침 저희 백귀야행에서도 보낸 적이 있었죠."
51010-140 = "이러니저러니 해도 여러 일이 있었으니까요."
51010-145 = "[ns] \"그건 그렇고 니야는 갑자기 어쩐 일이야?\""
51010-146 = "아, 맞다~ 그러고 보니 마침 좋을 때다 싶어서요."
51010-147 = "선생님도 최근엔 자안~뜩 업무에 치이면서 쉴 시간도 없이 고생을 하는 모양이고~?"
51010-148 = "이런 날, 불철주야 고생하고 노력하시는 선생님을 위해 불초 저 같은 소녀가 선생님을 위해 무언가를 해줄 수 있지 않을까? 그런 게 필요하지 않을까아~? 하고 고민한 결과."
51010-149 = "[s] \"……고민한 결과?\""
51010-150 = "후후, 괜찮으시다면 이번 기회에 백귀야행을 찾아와 주시지 않겠나요?"
51010-151 = "조만간 백귀야행에서는 축제가 개최될 예정이랍니다. 일만 하는 게 아니라 숨을 돌리는 것도 중요하니."
51010-152 = "부디 오셔서 즐기시다 가시는 게 어떨까~? 하고 생각해서 말이지요."
51010-153 = "거기에 백귀야행 학원의 근황 보고라거나, 사알짝. 개인적인 부탁도 있다고나 할까~?"
51010-154 = "[s] \"니야의 부탁……?\""
51010-155 = "아, 참고로 오시면 우리 음양부의 귀여~~운 치세냥도 쓰다듬을 수 있답니다?"
51010-160 = "냐앙~?"
51010-162 = "냐하하핫~~ 네에~"
51010-163 = "그럼 기다리고 있겠습니다아~"
51010-169 = "[ns] \"………백귀야행, 이라.\""
51010-173 = "색채로 완전히 반전된 존재를 원래대로 되돌릴 수 있는 방법 같은 건 이 세상엔 존재하지 않아."
51010-174 = "그건 죽은 사람을 되살리지 못하는 것과 마찬가지로 당연한 이 세상의 법칙이라네."
51010-175 = "허나……. 그럼에도 불구하고 누군가를 구하고 싶은 것이라면……"
51010-179 = "……나를 찾아주게나. 선생."
51010-182 = "[ns] \"어쩌면 쿠즈노하의 단서를 잡을 수 있을지도…….\""
51010-185 = "다음화;느닷없는 조우 1"
