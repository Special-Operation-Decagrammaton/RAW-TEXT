[translation]
2600702-1 = "논다는 것의 의미"
2600702-3 = "아, 선생님. 여기예요!"
2600702-4 = "죄송해요. 이렇게 나오시게 할 생각은 아니었는데……."
2600702-5 = "[s1] \"괜찮아. 신경 쓰지 마.\"\n[s2] \"여긴 어디야?\""
2600702-6 = "감사합니다……."
2600702-7 = "……네? 여기요?"
2600702-8 = "리조트 뒤편이에요. 작은 비품창고가 있더라고요."
2600702-9 = "리조트 뒤편이에요. 작은 비품창고가 있더라고요."
2600702-10 = "처음에는 청소나 정비 도구 정도를 꺼낼 생각으로 열었는데, 생각보다 엄청난 것들이 많아서 그만……."
2600702-11 = "뭔가 값비싼 것들이 버려져 있는 걸 보니 저도 모르게 신경 쓰여서……. 아하하……."
2600702-12 = "[s3] \"여기까지 와서도 성실하네.\"\n[s4] \"……아야네는 늘 한결같구나.\""
2600702-15 = "여, 역시 조금 뜬금없었죠? 죄송해요……."
2600702-16 = "뭔가 스스로 생각해도 좀 이상하다고 생각하긴 하는데, 잘 안 고쳐지네요."
2600702-17 = "사실 여기까지 왔으면, 일부러라도 아비도스의 일들은 좀 잊어야 할 텐데……."
2600702-18 = "으음……. 리조트에 오면서까지 놀기로 마음먹은 건데, 와서도 창고를 뒤지고 있는 모습이라니……."
2600702-19 = "다시 생각해 보니 역시 모양새가 좀 그러네요. 이러다가 놀 시간도 다 잃어버리겠어요."
2600702-20 = "……네?"
2600702-21 = "충분히 잘 놀고 있는 것 같다고요? ……제가요?"
2600702-22 = "어……. 그치만 저, 온 뒤로 자유시간에도 계속 창고만 뒤지고 있었는데……."
2600702-23 = "[s5] \"논다는 건 하고 싶어 하는 걸 하는 거니까.\"\n[s6] \"훌륭한 보물찾기 놀이라고 생각하는데.\""
2600702-24 = "……!!"
2600702-25 = "……!!"
2600702-26 = "그, 그럴까요? 역시 그런 거겠죠?"
2600702-27 = "뭔가 선생님께서 그렇게 말씀해 주시니 좀 마음이 놓이는 거 같기도 하고……!"
2600702-33 = "저, 저……. 실은 이러는 도중에도 뭔가 계속 신경이 쓰였었거든요."
2600702-34 = "뭔가 그……. 모처럼이니까, 여기선 여기서 해야 할 게 있다는 그런 느낌……?"
2600702-35 = "바다에 왔으니 수영을 해야 하고, 리조트에 왔으니 거기에 맞는 시설을 써봐야 하고……."
2600702-36 = "그런 걸 하지 않으면 뭔가 잘 못 하고 있는 거 같은 느낌이 쭉 들어서……."
2600702-37 = "그래서……!"
2600702-38 = "[s7] \"응. 대충 그럴 거라 생각하고 있었어.\"\n[s8] \"괜찮아. 그래서 나도 직접 온 거니까.\""
2600702-39 = "……아."
2600702-40 = "……아."
2600702-41 = "역시 모모톡 보내 드렸던 그때부터 생각하고 계셨던 거군요."
2600702-42 = "뭔가 또 도움을 구해 버린 느낌이……. 아하하……."
2600702-43 = "……네?"
2600702-44 = "그런 게 아니라 선생님도 놀러 오신 거라고요?"
2600702-45 = "그건 무슨……."
2600702-46 = "……혼자 노는 거보다 둘이서 노는 게 더 재밌을 거 같아서……?"
2600702-50 = "선생님……."
2600702-51 = "으음. 정말 뭐라고 말씀드려야 할지 모르겠네요. 제가 사실 말재주가 없는 편이라……."
2600702-52 = "그……. 음……."
2600702-53 = "……."
2600702-54 = "……감사합니다."
2600702-58 = "좋아요! 그럼 그렇게 되었으니, 지금부터 같이 보물찾기를 재개해 볼까요?"
2600702-59 = "대결이에요! 누가 더 쓸 만한 거 찾는지 경쟁하는 게임입니다!"
2600702-60 = "[s9] \"그 도전 받아주지.\"\n[s10] \"제한 시간은 라운드 당 5분이야.\""
2600702-61 = "후후. 만만하진 않을 걸요! 이래 봬도 지금까지 대책위원회를 굴려온 경험이 있다고요!"
2600702-62 = "후후. 만만하진 않을 걸요! 이래 봬도 지금까지 대책위원회를 굴려온 경험이 있다고요!"
2600702-63 = "그럼 준비~."
2600702-67 = "……땅!!"
2600702-72 = "(이후 아야네와 함께 주변을 뒤지기 시작했다.)"
2600702-73 = "(막상 경쟁이 시작되자 둘 다 땀을 뻘뻘 흘리며 별의별 것들을 다 찾아냈지만…….)"
2600702-74 = "(생각해 보니, 대부분 헬기에 실을 수 없을 만큼 큰 것들뿐이었다.)"
