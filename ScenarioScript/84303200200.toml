[translation]
84303200200-6 = "뽜밤뽜밤-! 아리스는 새로운 사람과 조우하였습니다!"
84303200200-10 = "뽜밤뽜밤……? 조우……?"
84303200200-11 = "안녕하세요, 저는 유리조노 세이아라고 해요. 아리스 씨도 게임개발부의 일원이신가요?"
84303200200-12 = "그 말대로입니다! 오늘의 아리스는 안내원으로, 방문하신 게스트 여러분들을 안내하고 있습니다!"
84303200200-13 = "그렇군요……."
84303200200-14 = "도움이 필요하신 분들께 도움을 드리는 것이 오늘의 아리스가 가진 사명! 뭐든 물어봐 주십시오!"
84303200200-15 = "뭐, 뭐든지라니……."
84303200200-21 = "(분위기를 보아하니, 특별히 이상한 점은 없어 보이는군요.)"
84303200200-22 = "(이곳은 괜찮은 듯하니, 그럼 시연장 쪽으로…….)"
84303200200-26 = "……!!?"
84303200200-27 = "(뭐, 뭐죠, 방금? 누군가의 시선이……?)"
84303200200-32 = "(기분 탓? ……아니요. 명백히 느껴집니다. 감시의 시선…… 그것도 꽤 경계하는 시선이네요.)"
84303200200-33 = "(아리스 씨 이외에…… 이 방에는 아무도 없을 텐데……!)"
84303200200-37 = "……아리스 씨. 외람된 질문일 수도 있습니다만, 혹시 이 방에 아리스 씨와 저 말고 다른 누군가가 계신가요?"
84303200200-38 = "네? 그게 무슨 말인가요? 저와 세이아 씨 말고 다른 분……?"
84303200200-39 = "네. 시선이…… 느껴져서 말이에요."
84303200200-40 = "아니, 역시 괜한 질문이었네요. 괜찮습니다, 아리스 씨. 여기선 제가 찾아내도록 하겠습니다."
84303200200-41 = "이런 쪽의 직감은…… 스스로도 꽤 믿는 편이니까요."
84303200200-42 = "아무래도 이곳에는……"
84303200200-43 = "네! 있습니다! 세이아 씨, 굉장한 육감입니다!"
84303200200-44 = "그렇겠지요. 역시 저와 아리스 씨 말고는……."
84303200200-48 = "……네?"
84303200200-49 = "세이아 씨와 저 말고도, 이 방에는 저희 파티원이 한 명 더 있었습니다! 그것을 알아차리다니, 정말로 놀랍습니다!"
84303200200-50 = "보세요, 유즈! 유즈의 기척을 알아차렸습니다! 굉장합니다. 마치 도적 같습니다!!"
84303200200-51 = "도적……!?"
84303200200-55 = "아, 아니에요! 죄송해요! 그런 뜻이 아니에요!"
84303200200-56 = "아리스 쨩이 한 말은 절대 도둑이라거나 그런 의미가 아니라, 그게 게임에서의 직업 명이라서……!"
84303200200-65 = "캐, 캐비닛에서 사람이……!?"
84303200200-66 = "아, 안녕……하세요…… 유즈라고 합니다……"
84303200200-67 = "아, 아리스 씨!? 이분은……"
84303200200-69 = "저희 게임개발부의 부장이자 최고의 게임 마스터, 그리고 파티의 리더인 유즈입니다!!"
84303200200-70 = "유즈는 자신만의 공간에서 대기하는 것을 좋아하기에 캐비닛 안을 전용 대기실로 사용하고 있습니다!"
84303200200-71 = "아…… 그, 그렇군요. ……이곳 부원이셨군요."
84303200200-72 = "(어째서 자신의 부실 안인데도 캐비닛 속으로 들어가 계신 건지는 모르겠지만…….)"
84303200200-73 = "세이아 씨는 유즈를 찾아온 게 아니었습니까? 저는 분명 그런 것인 줄 알았는데, 반응이 생각과 다릅니다."
84303200200-74 = "아, 저는 그저 게임개발부 분들과 엑스포에 출품하셨다던 게임을 확인하러 온 것뿐이라……."
84303200200-75 = "……! 그렇군요. 그렇다면 이곳이 아닙니다! 시연장으로 가야 합니다!"
84303200200-76 = "이쪽입니다, 제가 앞잡이가 될 테니, 따라와 주십시오!!"
84303200200-77 = "아, 알겠습니다. 그럼…… 유즈 씨는……?"
84303200200-79 = "히, 힉!? 저, 저요? 저, 저는 괜찮……습니다……"
84303200200-80 = "오늘의 유즈는 지휘관이기 때문에 전선에 나가지 않습니다. 전선으로 나가는 것은 모모이와 미도리, 그리고 저입니다!"
84303200200-81 = "……그리고 세이아 씨도!"
84303200200-82 = "아…… 네. 알겠습니다. 그럼 따라가도록 할게요."
84303200200-83 = "……실례했습니다, 유즈 씨."
84303200200-84 = "아, 아니에요. 반가웠어요……."
84303200200-85 = "자, 새로운 퀘스트가 발생!! 출발입니다!!"
