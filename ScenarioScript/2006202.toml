[translation]
2006202-1 = "#title;요리는 화학!"
2006202-2 = "3;에리나;01\n#3;a\n#wait;1000"
2006202-3 = "3;에리나;03;어서옵쇼!\n#3;greeting\n#3;em;[반짝]"
2006202-4 = "3;에리나;00;183호 레스토랑에!"
2006202-5 = "[s] \"설마 했던 업종 변경?!\""
2006202-6 = "3;에리나;19;리액션 대박이네요!\n#3;em;[재잘]\n#3;hophop"
2006202-7 = "3;에리나;11;농담이긴 한데 식당이건 연구소건 그게 그거죠, 뭐! 원래 식품이야말로 현대 화학의 총아거든요!"
2006202-8 = "3;에리나;00;주방도 일종의 화학 연구실이랄까? 그런 셈이죠!\n#3;jump"
2006202-9 = "[s] \"여기는 그냥 연구실 아니야?\""
2006202-10 = "3;에리나;03;켁, 맞긴 하죠. 주방이 가스폭발로 날아가서 다 얼어붙는 바람에…….\n#3;em;[땀]"
2006202-11 = "3;에리나;13;그래도, 주방이 연구실이라면 연구실도 주방이 될 수 있겠죠! 역이 성립한다랄까?"
2006202-12 = "3;에리나;00;오늘은 주방의 화학을 소개하면서, 시식을 부탁드릴 거예요!"
2006202-13 = "3;에리나;11;183호 셰프, 니키 에리나에게 맡겨보세요!\n#3;em;[반짝]"
2006202-14 = "[s] \"183호의 셰프?\""
2006202-15 = "3;에리나;00;네! 특별반에서 제가 요리 담당이거든요.\n#3;jump"
2006202-16 = "3;에리나;11;화학 주임이기도 하고, 간 맞추는 데 자신 있기도 하고요!"
2006202-17 = "3;에리나;03;그럼 사양 않고, 자! 시작합니다! 닥터 에리나의 쿠킹 타임!\n#3;hophop"
2006202-18 = "3;에리나;00;오늘은- 냉장고에 있는 재료로 멋진 요리를 만들어 볼 거예요!"
2006202-19 = "3;에리나;19;냉장고에 있는 재료는- 두구두구두구!\n#3;greeting"
2006202-20 = "3;에리나;03;감자, 고기, 그리고…… 또 감자하고…… 오옷-! 산더미 같은! 냉장고 성에!"
2006202-21 = "#st;[0,0];instant;1;"
2006202-23 = "3;에리나;03\n#3;em;[...]\n#wait;2500"
2006202-24 = "3;에리나;03;……."
2006202-25 = "3;에리나;20;……이, 이야아! 산해진미가 잔뜩! 일단 고기감자조림을 만들어볼 건데요-!\n#3;em;[땀]"
2006202-26 = "[s] \"고기감자조림?\""
2006202-27 = "3;에리나;20;네, 요새 눈보라가 심해서 남은 재료로 만들 수 있는 게 그것뿐이라…… 에헤헤……."
2006202-28 = "3;에리나;00;중요한 건 아니고, 그럼 다시 재료부터! 고기 있고, 감자 있고, 간장도 있고, 설탕 있고…….\n#3;greeting"
2006202-29 = "3;에리나;04;그런데, 에엥?! 소금이 없네…… 간장만으로 맛 내면 조금 아까운데!\n#3;em;[?!]\n#3;shake"
2006202-30 = "3;에리나;11;까짓거 만들면 되죠! 문제없음!"
2006202-31 = "3;에리나;00;어디 보자, 염산하고 수산화나트륨이- 여기 있네요! 웃차!\n#3;greeting"
2006202-32 = "[s1] \"염…… 뭐?!\"\n[s2] \"수산화…… 뭐?!\""
2006202-35 = "3;에리나;04;까, 깜짝이야! 놀라서 쏟으면 위험해요!\n#3;hophop"
2006202-36 = "3;에리나;09;혹시 처음 보세요? 그렇게 희귀한 약품은 아닐 텐데, 붉은겨울 밖에서는 희귀한가?"
2006202-37 = "[s3] \"그 문제가 아니라!\n[s4] \"어째서 염산과 수산화나트륨을……?\""
2006202-40 = "3;에리나;00;소금이 필요해서요! 소금은 염화나트륨이잖아요?"
2006202-41 = "3;에리나;01;둘을 섞으면 중화반응을 일으켜서 염산의 염화이온하고 수산화나트륨의 나트륨이 결합해서 소금을 만들 수 있거든요. 수소와 수산화 이온은 물이 되고요."
2006202-42 = "3;에리나;03;발열반응이 있어서 따듯한 건 덤이에요!\n#3;em;[음표]"
2006202-43 = "[s] \"이거 연구실…… 아니, 주방에서 해도 되는 거야?\""
2006202-44 = "3;에리나;02;보통은 안 되죠? 비율이 잘못되면 잔류 이온 때문에 큰일 나니까요!"
2006202-45 = "3;에리나;13;하지만 저는 전문가고~? 여기는 주방이 아니라 연구실이니까, 문제없다는 거!\n#3;em;[반짝]"
2006202-46 = "3;에리나;19;그럼 얼른 소금 만들어드릴게요!"
2006202-47 = "[s] (전문가를 믿기로 한다.)"
2006202-48 = "3;에리나;99\n#3;a"
2006202-49 = "3;에리나;99\n#3;greeting\n#wait;1000"
2006202-50 = "3;에리나;03;음! 짭짤하다! 좋아, 좋아! 순조롭네요～♪\n#3;em;[음표]"
2006202-51 = "3;에리나;02;다음은 미림인데…… 이것도 다 떨어졌네요."
2006202-52 = "3;에리나;11;까짓거 이것도 지금 만들죠!\n#3;jump"
2006202-53 = "[s] \"굳이 만들지 않아도 어떻게 안 되려나?!\""
2006202-54 = "3;에리나;06;안 돼요! 요리 초보들이 그런 식으로 '없으니 빼자', '비슷한 거로 대체하자'라면서 음식의 절묘한 화학을 망치는 거예요!\n#3;em;[속상함]"
2006202-55 = "3;에리나;02;미림의 에탄올이 고기 단백질을 변성시켜서 양념이 잘 들게도 하고, 누린내의 원인이 되는 물질을 용해해서 잡내도 잡아준다구요. 화학적으로 아주 중요해요!"
2006202-56 = "3;에리나;00;이건 에틸렌을 반응시키면 뚝딱이에요! 금방 만들게요!"
2006202-57 = "[s] \"안전한 거 맞지?!\""
2006202-58 = "3;에리나;05;물론이죠! 이래 봬도 이런 건 진지하다구요! 다른 누구도 아닌 선생님인데 당연히 안전 챙겨야죠!\n#3;jump\n#3;em;[!]"
2006202-59 = "3;에리나;03;자, 그럼! 바로 만들어볼게요-"
2006202-60 = "#st;[0,0];instant;1;"
2006202-62 = "3;에리나;01\n#3;greeting\n#wait;1000"
2006202-63 = "3;에리나;02;아, 맞다. 혹시 스웨터 입고 계시면 가만히 있으셔야 해요.\n#3;em;[반응]"
2006202-64 = "3;에리나;04;흔히 일어나는 일은 아닌데, 에틸렌 가스가 정전기 불꽃하고 그……. 아, 단어가 뭐더라……!"
2006202-65 = "3;에리나;21;아무튼! 선생님, 움직이시면 안 돼요!\n#3;jump"
2006202-66 = "[s] (비명을 지르려다 겨우 참는다.)"
2006202-67 = "3;에리나;03;기다리세요! 화학의 힘으로 진짜 맛있게 만들어드릴 테니까!\n#3;em;[반짝]"
2006202-69 = "#na;(그 이후로도 에리나는 없는 조미료를 즉석에서 만들어냈다.)"
2006202-70 = "#na;(완성된 요리는 아주 맛있었고, 칭찬을 아끼지 않았다.)"
2006202-71 = "#na;(긴장한 탓인지 다리에 힘이 풀려서 한참 뒤에 샬레로 돌아갔다.)"
