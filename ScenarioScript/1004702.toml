[translation]
1004702-1 = "반짝임을 찾고 싶어"
1004702-2 = "(그리하여 갑작스럽지만 치세의 호출을 받고 바닷가에 나오게 되었다.)"
1004702-6 = "[ns] \"아, 안녕, 치세.\""
1004702-7 = "응- 안녕. 선생님."
1004702-8 = "[s1] \"일단 치세가 불러줘서 나오긴 했는데…….\"\n[s2] \"정확히 무슨 일 때문에 부른 거야?\""
1004702-11 = "그건……."
1004702-12 = "[s] \"그건……?\""
1004702-21 = "무슨 일 때문일까~?"
1004702-25 = "[ns] \"……그렇구나.\""
1004702-26 = "아, 생각났어. 선생님."
1004702-27 = "응……. 반짝임-"
1004702-28 = "반짝임을 찾으러 가야 해."
1004702-29 = "[s] \"반짝임……?\""
1004702-30 = "응, 나, 오늘부터 여름 휴가니까."
1004702-31 = "휴가 동안 뭘 하면 좋을까- 고민하다가."
1004702-32 = "어제 인터넷에 <여름에 하면 좋을 거>를 검색해봤는데-"
1004702-33 = "[s3] \"아, 치세도 하는구나! 인터넷 검색!\"\n[s4] \"치세는 계획적인 아이구나!\""
1004702-36 = "칭찬 고마워~ 선생님~"
1004702-37 = "음- 그래서 말이야~ 인터넷에서 말이야."
1004702-38 = "이런 걸 찾았어. 선생님."
1004702-39 = "선생님한테도 보여줄게-"
1004702-47 = "여기, 선생님, 이거 봐~ 여기에-"
1004702-55 = "[ns] \"자, 잠깐! 치세 양! 그렇게 밀어붙이면 아무것도 안 보이는데요……?!\""
1004702-56 = "아, 그럼."
1004702-60 = "영차. 이렇게 해서-"
1004702-62 = "(일방적으로 밀어붙여 오는 치세를 진정시킨 뒤 확인할 수 있었던 건)"
1004702-63 = "(마침 인터넷에 게재된 여름 특집 기사의 일부였다.)"
1004702-64 = "(그 타이틀에 적혀 있는 문구의 내용은 무려……)"
1004702-65 = "[ns5] \"<이번 여름, 나만의 어른스러운 반짝임을 쟁취해서……\"\n[ns6] \"단숨에 한 꺼풀 벗고 성장해보자! 여름 완전 해부 공략 매뉴얼!>……이라고?!\""
1004702-68 = "응. 선생님. 이번 여름 휴가 때, 반짝임을 찾아-"
1004702-69 = "성장하는 거야-"
1004702-70 = "[s] \"아니, 잠깐?! 치세 양?!\""
1004702-71 = "나 생각했어. 이번 여름 휴가 때 무얼 하면 좋을까."
1004702-72 = "모처럼 얻은 휴가니까-"
1004702-73 = "귀중한 시간-"
1004702-74 = "어떤 걸 해야 음양부원으로서, 그리고 하이쿠를 짓는 사람……"
1004702-75 = "하이커로서 성장할 수 있을까~하고."
1004702-76 = "[s] \"그걸 <하이커>라고 부르면 조금 다른 의미가 되지 않나……?\""
1004702-77 = "그러다 이걸 발견한 거야."
1004702-78 = "응, 역시 반짝임을 발견하면 성장할 수 있는 거구나~?"
1004702-79 = "그런 거였구나~ 하고 생각해서."
1004702-80 = "그러니까 찾고 싶어. 반짝반짝. 나만의 반짝임을."
1004702-81 = "[s7] \"휴가중에도 공부하려는 치세의 자세는 물론 기특하긴 하지만……!\"\n[s8] \"아마 여기서 말하는 건 치세의 생각하고 다르다고 할까……\""
1004702-84 = "……?"
1004702-85 = "달라?"
1004702-86 = "그럼 반짝임을 찾는 건 안 돼?"
1004702-90 = "선생님하고 찾는 거…… 기대하고 있었는데……."
1004702-91 = "[s] \"크윽?!\""
1004702-93 = "[ns] \"아니! 치세가 찾고 싶다면 물론 협력해야지! 얼마든지!\""
1004702-94 = "그래? 다행이다-"
1004702-95 = "응, 가자. 선생님."
1004702-96 = "힘내서 같이 반짝임을 잔뜩 찾고-"
1004702-97 = "한 꺼풀 벗고 성장하는 거야~"
1004702-98 = "[s] \"치세와, 한 꺼풀 벗고, 성장을…….\""
1004702-99 = "선생님과 나. 둘이서"
1004702-100 = "전차만큼 성장할 수 있으면 좋겠네~"
1004702-101 = "[s] \"전차만큼……은, 아무래도 난이도가 높지만, 응. 힘내자……!\""
1004702-102 = "(그렇게 치세와 함께 나름의 반짝임 찾기가 시작되었다.)"
1004702-108 = "[ns] \"그런데 치세, 반짝임이라고 해도, 정확히 뭘 찾을 생각이야?\""
1004702-109 = "아, 그게. 그러니까 말이야."
1004702-110 = "반짝임은- 반짝이는 걸 말해."
1004702-111 = "그러니 반짝이는 걸 찾아야 해."
1004702-112 = "[s] \"그야말로 명쾌한 대답이지만! 오히려 그래서 더욱 모르겠어!\""
1004702-113 = "좀 더 여름 바다에 어울리는 반짝임……."
1004702-114 = "바닷가에서만 찾을 수 있는 반짝임은-"
1004702-115 = "아, 저기 봐. 선생님."
1004702-116 = "바닷가에서 반짝이는 게 있어."
1004702-120 = "[ns] \"응? 자, 잠깐 치세……!\""
1004702-125 = "해변에서 반짝거리는 이건."
1004702-130 = "……해파리 씨?"
1004702-131 = "[s] \"아, 치세, 잘 보니까, 이건 쓰레기봉투야. 햇살 때문에 반짝였나 봐.\""
1004702-132 = "그으래? 쓰레기봉투……."
1004702-133 = "하지만 이렇게나 반짝이고 있었던 거구나-"
1004702-134 = "영-차."
1004702-135 = "[s] \"응? 치세? 그걸 가방에 넣는 거야?!\""
1004702-136 = "응. 내버려 두면- 또 바다로 쓸려갈지 모르니까-"
1004702-137 = "봉투의 해파리 씨는, 이렇게 가져가는 거야~"
1004702-138 = "아, 선생님, 저기-"
1004702-139 = "또 반짝이는 게 있어-"
1004702-143 = "[ns] \"가, 같이 가. 치세~!\""
1004702-149 = "여기서 반짝반짝거리는 건…… 조약돌?"
1004702-150 = "[s] \"아, 그건 <말차맛 라무네> 병이네. 누가 마시고 나서 버린 건가 봐.\""
1004702-151 = "그렇구나- 이것도 찾던 게 아니네~"
1004702-152 = "영-차. 그럼 이것도 챙기고"
1004702-153 = "다음, 다음이야. 선생님."
1004702-154 = "다른 반짝임을 찾으러 출발 신호야-"
1004702-161 = "이건, 조개 씨?"
1004702-162 = "[s] \"아, 다 쓰고 버린 화장품, 파우더 케이스인가 본데……\""
1004702-163 = "응~ 그렇구나~"
1004702-169 = "그럼 이건? 미역?"
1004702-170 = "[s] \"그건 아마도 떠밀려온 그물 더미가 아닐까……?\""
1004702-174 = "아, 선생님 그럼 이건?"
1004702-175 = "이건?"
1004702-180 = "……이건 뭘까?"
1004702-182 = "(그런 느낌으로 반짝임을 찾아 치세와 함께 정처 없이 모래사장 이곳저곳을 기웃거리며)"
1004702-183 = "(여러 가지를 찾고, 발견하고, 수집하기를 얼마나 계속했을까)"
1004702-185 = "뭔가- 엄청 발견해버렸네-"
1004702-186 = "[s] \"그러게, 대부분 쓰레기들이긴 했지만…….\""
1004702-190 = "(약 3시간 동안 해변을 돌아다니며 치세와 함께 발견한 물건은 다음과 같았다.)"
1004702-191 = "(누군가 마시고 버린 음료수병, 쓰레기봉투, 금이 간 BD 조각, 그물 더미)"
1004702-192 = "(미역과 엉켜서 자칫 물에 빠진 사람으로 오해할 뻔했던 부표, 잔뜩 구겨서 버린 페트병 등등.)"
1004702-193 = "[s] \"으음, 졸지에 하루 종일 해변 청소만 한 느낌이…….\""
1004702-195 = "……굉장해."
1004702-196 = "[s] \"응? 치세? 굉장하다니?\""
1004702-197 = "오늘 하루, 바닷가를 돌아다니면서 발견했던 것들."
1004702-198 = "전부 반짝이고 있었어."
1004702-199 = "해파리처럼. 조약돌처럼. 산호초처럼- 조개처럼."
1004702-200 = "바닷가에는, 이렇게나 반짝임이 가득했구나-"
1004702-201 = "[s] \"……응, 뭐, 치세가 그렇게 생각했다면 그런 거겠지.\""
1004702-202 = "음. 하지만 역시 조금 부족해."
1004702-203 = "눈을 감으면 조금씩 떠오르는 게 있어-"
1004702-204 = "내가 발견하고 싶은, 만나고 싶은 반짝임은 이렇게 좀 더……."
1004702-205 = "하지만 어렴풋하기만 하고- 안 보여-"
1004702-206 = "어째서일까-? 선생님."
1004702-207 = "[s] \"음, 어째서일까…….\""
1004702-208 = "……."
1004702-209 = "뭐어- 그래도 선생님이 이렇게 같이 찾아주는 것만으로도-"
1004702-210 = "그것만으로도 나는-"
1004702-214 = "아, 슬슬 돌아가야겠다. 저녁 시간이야- 선생님."
1004702-215 = "[s] \"저기 치세 님, 하시던 말씀의 뒤 내용이 신경 쓰이는데요?!\""
1004702-216 = "아, 응……."
1004702-217 = "……하지만 역시……."
1004702-218 = "이렇게 하루 종일 선생님하고 돌아다녔는데도-"
1004702-219 = "결국 찾지 못했다는 건."
1004702-220 = "……역시 전차-는 될 수 없는 걸까-?"
1004702-221 = "[s] \"뭐, 괜찮아. 치세. 아직 휴가는 잔뜩 남아 있잖아?\""
1004702-222 = "선생님?"
1004702-223 = "[s9] \"치세가 찾고 싶은 걸 찾을 때까지, 얼마든지 함께 찾아줄게.\"\n[s10] \"그러니 너무 걱정할 거 없어.\""
1004702-226 = "……."
1004702-227 = "……그렇구나."
1004702-228 = "선생님과 얼마든지……"
1004702-229 = "아."
1004702-233 = "[ns] \"응? 치세? 왜 그래?\""
1004702-234 = "선생님, 지금 막-"
1004702-235 = "……으응, 아무것도 아니야."
1004702-237 = "응. 휴가는 이제 막 시작됐으니까. 가자. 선생님."
1004702-238 = "집으로 돌아가는, 귀가 신호~~"
1004702-239 = "먼저 집에 도착하는 사람이-"
1004702-240 = "토마토가 되는 거야~"
1004702-241 = "[s] \"으, 으응?! 토마토?! 갑자기 왜 토마토?!\""
1004702-246 = "(그렇게 치세와 함께 조용히 저녁놀이 지는 바닷가를 걸어 숙소로 복귀했다.)"
