[translation]
1602003-1 = "某位狙擊手的無線通訊"
1602003-2 = "夏萊辦公室"
1602003-3 = "（某個平凡的午後時光）"
1602003-4 = "（與前來執行值日業務的御伽一起，一邊查看SRT的作戰記錄，一邊撰寫報告書）"
1602003-5 = ""
1602003-7 = ""
1602003-8 = ""
1602003-9 = ""
1602003-10 = ""
1602003-11 = "「切換到無線電3號頻道。」"
1602003-12 = "「這裡是FOX4。那邊通訊是否良好？」"
1602003-13 = "「任務編號是M-X-9-2……不對，不是S，是X光的X。」"
1602003-14 = "「……確認。作戰中止暗號是November，Kilo──」"
1602003-15 = ""
1602003-16 = "[ns] 「報告書寫得還順利嗎？」"
1602003-17 = "唔嗯，不是很順利……通訊靈敏度太差了，聽不太清楚說了什麼。"
1602003-18 = "就算是因為裝了干擾裝置進行作戰，這個雜訊也太嚴重了吧。"
1602003-19 = "下次為了寫報告書，得說得更大聲、更清楚才行了。"
1602003-20 = "[s1] 「那段錄音記錄是御伽的聲音吧？」\n[s2] 「感覺好像交流了一大堆很複雜的內容呢。」"
1602003-23 = "也沒說什麼複雜的內容啦。"
1602003-24 = "只不過是重新確認作戰位置、共享作戰所需的暗號而已。#n並沒有多少只有SRT才懂的專業內容……"
1602003-25 = "啊，只是無線通訊中會夾雜著語音字母，所以一般人聽起來或許會很難懂。"
1602003-26 = "[s] 「語音字母？」"
1602003-27 = "嗯。就是Alpha、Charlie、Mike那些單字。"
1602003-28 = "平常講話的時候，某些發音接近的字不是會有點難分辨嗎？#n像是數字1和字母E之類的。"
1602003-29 = "但如果在雜訊嚴重的無線通訊中傳達錯誤，就可能轟炸到完全不一樣的地方……"
1602003-30 = "為了讓發音清晰明瞭，才會用單字來代替字母。"
1602003-31 = "舉例來說，FOX小隊的FOX就是[ruby=F]Foxtrot[/ruby]-[ruby=O]Oscar[/ruby]-[ruby=X]X-ray[/ruby]這樣的方式。"
1602003-32 = "[ns] 「真是有趣的知識呢。」"
1602003-34 = "[ns3]「不過，要是像那樣把單字拉長……」\n[ns4]「傳達內容不是會很花時間嗎？」"
1602003-37 = "當然我們也不會把所有通訊內容都轉換成語音字母啦。#n只有像「Tango」Down、Point「Alpha」這種不能搞混的重點才會進行強調。"
1602003-38 = "老師也要用無線電試試看嗎？"
1602003-39 = "[s] 「我做得來嗎……」"
1602003-40 = "沒問題的。#n反正又不是真正作戰中的通訊，只是試試看而已。"
1602003-41 = ""
1602003-43 = ""
1602003-45 = ""
1602003-46 = "這裡是FOX4。聽到請回答。"
1602003-47 = "[s] 「這，這裡是夏萊──更正，Sierra1。收訊完畢。」"
1602003-48 = "FOX4，收到。"
1602003-49 = "Sierra1，今天下午預定配給的點心是什麼？"
1602003-50 = "[s5] 「……點心？」\n[s6] 「冰箱裡有買好的[ruby=Cake]蛋糕[/ruby]，那個怎麼樣？」"
1602003-53 = "什麼～？聽不太清楚～"
1602003-54 = "雜訊太嚴重了，聽不清楚是[ruby=Cake]蛋糕[/ruby]還是[ruby=Shake]奶昔[/ruby]。Over──"
1602003-55 = "[ns] 「再傳達一次，FOX4。」"
1602003-57 = "[ns] 「今天的點心是Charlie-Alpha-Kilo-Echo。Over。」"
1602003-58 = "呵呵，今天的點心是[ruby=Cake]蛋糕[/ruby]對吧。"
1602003-59 = "Sierra1，可以確認一下有哪幾種蛋糕嗎？"
1602003-60 = "[s] 「[ruby=Chocolate]Charlie[/ruby]和[ruby=Strawberry]Sierra[/ruby]，你想要哪一種？」"
1602003-61 = "那當然是草莓──Sierra囉！"
1602003-63 = ""
1602003-64 = "[ns7] 「哈哈，親自試過之後還挺有趣的呢。」\n[ns8] 「或許沒想像中那麼難。」"
1602003-67 = "沒錯。只是夾雜了平常不太會用到的術語罷了。#n說到底，這也和特殊部隊使用的暗號沒什麼兩樣。"
1602003-68 = "習慣之後，說不定老師也會覺得用語音字母來說話比較方便呢。"
1602003-69 = "[s] 「不過我覺得我還是不要用比較好。」"
1602003-70 = "為什麼？既有利於保密，傳達意圖時也很方便啊。"
1602003-71 = "[ns] 「因為我是老師啊。」"
1602003-73 = "[ns9] 「為了獲得信任，就得使用容易理解的話語。」\n[ns10] 「就算得多花一點時間，不失去信任才是最重要的。」"
1602003-76 = "哇，剛才那句話真是Sierra Hotel呢。"
1602003-77 = "[s11] 「……S，H？」\n[s12] 「那是什麼的縮寫？」"
1602003-80 = ""
1602003-82 = ""
1602003-83 = "啊，就是……"
1602003-84 = "就，就是很有夏萊老師風格的意思啦！"
1602003-85 = "啊，這麼說來，光顧著聊天結果耗掉太多時間了呢。"
1602003-86 = "那我差不多該回座位繼續寫報告書了。"
1602003-87 = ""
1602003-89 = ""
1602003-90 = ""
1602003-92 = "（在那之後，御伽感覺像是要掩飾什麼難為情的事，手忙腳亂地埋首於撰寫報告書）"
