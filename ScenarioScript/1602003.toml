[translation]
1602003-1 = "การสื่อสารทางวิทยุของสไนเปอร์"
1602003-2 = "สำนักงานชาเล่ต์"
1602003-3 = "(ในช่วงบ่ายที่แสนธรรมดาเช่นเคย...)"
1602003-4 = "(คุณครูกำลังตรวจสอบบันทึกปฏิบัติการของ SRT และเขียนรายงานร่วมกับโอโทกิที่มาเข้าเวรวันนี้)"
1602003-5 = ""
1602003-7 = ""
1602003-8 = ""
1602003-9 = ""
1602003-10 = ""
1602003-11 = "<เปลี่ยนไปใช้สัญญาณวิทยุช่อง 3>"
1602003-12 = "<นี่คือ FOX 4 สัญญาณทางนั้นชัดเจนดีมั้ย?>"
1602003-13 = "<รหัสภารกิจคือ M-X-9-2... ไม่ ไม่ใช่ S แต่เป็น X ในคำว่าเอกซเรย์>"
1602003-14 = "<รับทราบ... รหัสลับในการระงับปฏิบัติการคือ โนเวมเบอร์ กิโล...>"
1602003-15 = ""
1602003-16 = "[ns] \"เขียนรายงานราบรื่นดีมั้ย?\""
1602003-17 = "อืม ไม่ค่อยเลย... สัญญาณสื่อสารแย่มากจนฉันฟังไม่ค่อยออกเลยว่าทางนั้นพูดว่าอะไร"
1602003-18 = "ถึงจะเป็นเพราะเราเปิดเครื่องรบกวนสัญญาณก่อนเริ่มปฏิบัติการ แต่สัญญาณแทรกก็ไม่ควรจะ#nรุนแรงขนาดนี้สิ"
1602003-19 = "ถ้าจะเอามาใช้เขียนรายงาน ต่อไปฉันต้องพูดให้ดังและชัดเจนกว่านี้แล้วละ"
1602003-20 = "[s1] \"เมื่อกี้คือบันทึกเสียงของโอโทกิเหรอ?\"\n[s2] \"เหมือนเป็นบทสนทนาเรื่องอะไรที่สำคัญเลยนะ\""
1602003-23 = "ไม่ใช่การคุยที่ซับซ้อนอะไรหรอก"
1602003-24 = "เราก็แค่ยืนยันตำแหน่งปฏิบัติการกันอีกครั้ง แล้วก็แจ้งรหัสที่จำเป็นสำหรับการปฏิบัติการกันน่ะ แทบจะไม่มีข้อมูลเฉพาะทางที่มีแต่ SRT เท่านั้นที่จะเข้าใจด้วย..."
1602003-25 = "อ๊ะ แต่ยังไงก็มีการใช้รหัสอักษรระหว่างการสื่อสารทางวิทยุด้วย งั้นคนทั่วไปก็อาจเข้าใจยากก็ได้นะ"
1602003-26 = "[s] \"รหัสอักษรงั้นเหรอ?\""
1602003-27 = "อื้อ ก็อย่างเช่นคำว่าอัลฟา ชาร์ลี ไมค์ อะไรพวกนี้น่ะ"
1602003-28 = "ก็ปกติแล้วมีคำหลายคำที่ใช้ในชีวิตประจำวันที่ออกเสียงคล้ายกันนี่นา?#nอย่างเช่นเลข 4 กับตัว C ไง"
1602003-29 = "ในการสื่อสารทางวิทยุที่มีสัญญาณรบกวนแล้วละก็ ถ้าเราส่งสัญญาณผิดพลาด ก็อาจทำให้ทิ้งระเบิดผิดพิกัดเลยก็ได้"
1602003-30 = "เพราะงั้นเราเลยใช้เป็นคำศัพท์เต็มๆ แทน เพื่อให้ออกเสียงได้แม่นยำที่สุดน่ะ"
1602003-31 = "อย่างคำว่า FOX ในกองทหาร FOX ก็จะใช้รหัสอักษรว่า [ruby=F]ฟอกซ์ทรอท[/ruby] - [ruby=O]ออสการ์[/ruby] - [ruby=X]เอ็กซเรย์[/ruby] แบบนี้น่ะ"
1602003-32 = "[ns] \"เป็นความรู้ที่น่าสนใจเลยนะ\""
1602003-34 = "[ns3] \"แต่ถ้าใช้คำศัพท์หลายคำ ก็น่าจะใช้เวลามากหรือเปล่า?\"\n[ns4] \"งั้นกว่าจะสื่อสารกันจบ ก็น่าจะกินเวลามากเลยหรือเปล่า?\""
1602003-37 = "ทุกการสื่อสารไม่ได้ใช้แต่รหัสอักษรเสมอไปหรอก เราจะเลือกใช้เน้นย้ำเฉพาะส่วนสำคัญที่#nห้ามเกิดความสับสนเด็ดขาด อย่างเช่น 'แทงโก้' ดาวน์ หรือจุด 'อัลฟา' อะไรทำนองนี้น่ะ"
1602003-38 = "คุณครูลองมาสื่อสารทางวิทยุกับฉันดูมั้ยล่ะ?"
1602003-39 = "[s] \"ครูจะทำได้เหรอ...\""
1602003-40 = "ไม่เป็นไรน่า ถึงยังไงมันก็ไม่ใช่การสื่อสารระหว่างปฏิบัติการจริงๆ แค่พูดเอาฟีลลิ่งเท่ๆ ก็เท่านั้น"
1602003-41 = ""
1602003-43 = ""
1602003-45 = ""
1602003-46 = "นี่คือ FOX 4 ตอบรับด้วย"
1602003-47 = "[s] \"นะ... นี่คือชาเล่ต์... ไม่สิ เซียร์รา 1 ได้รับข้อความแล้ว เปลี่ยน\""
1602003-48 = "FOX 4 รับทราบ"
1602003-49 = "เซียร์รา 1 ของว่างบ่ายนี้คืออะไรเหรอ?"
1602003-50 = "[s5] \"ของว่าง...? มีเค้กอยู่นะ?\"\n[s6] \"ในตู้เย็นมีเค้กอยู่นะ อยากกินมั้ยล่ะ?\""
1602003-53 = "ว่ายังไงนะ~?! ได้ยินไม่ค่อยชัดเลย~"
1602003-54 = "คลื่นมันแทรกจนฟังไม่ออกเลยว่าของว่างที่จะได้กินคือเค้กหรือมิลค์เชคกันแน่ เปลี่ยน"
1602003-55 = "[ns] \"ขอแจ้งอีกครั้ง FOX 4\""
1602003-57 = "[ns] \"ของว่างวันนี้คือ ชาร์ลี-อัลฟา-กิโล-เอคโค เปลี่ยน\""
1602003-58 = "ฮุฮุ ของว่างวันนี้คือเค้กสินะ"
1602003-59 = "เซียร์รา 1 ว่าแต่มีเค้กแบบไหนบ้างเหรอ?"
1602003-60 = "[s] \"อยากกินรส[ruby=Chocolate]ชาร์ลี [/ruby]หรือรส[ruby=Strawberry]เซียร์รา[/ruby]ล่ะ?\""
1602003-61 = "ก็ต้องเป็นสตรอว์เบอร์รี่... ไม่สิ เซียร์ราอยู่แล้ว!"
1602003-63 = ""
1602003-64 = "[ns7] \"ฮุฮุ พอได้ลองใช้เองก็สนุกดีนะเนี่ย\"\n[ns8] \"นี่อาจจะไม่ยากเท่าที่คิดก็ได้นะ\""
1602003-67 = "ใช่แล้วละ มันก็แค่มีพวกคำศัพท์ที่ไม่ค่อยได้ใช้ในชีวิตประจำวันผสมอยู่ด้วยน่ะ สุดท้ายแล้วมันก็ไม่ต่างกับภาษาสแลงที่หน่วยรบพิเศษใช้กันหรอก"
1602003-68 = "ถ้าเริ่มคุ้นเคยแล้ว ต่อไปคุณครูก็อาจใช้รหัสอักษรในการสื่อสารอย่างสบายใจมากขึ้นก็ได้"
1602003-69 = "[s] \"แต่ครูว่าไม่ใช้น่าจะดีกว่านะ\""
1602003-70 = "ทำไมล่ะ? แต่มันดีในแง่การรักษาความปลอดภัย แล้วยังส่งต่อความหมายที่ถูกต้องชัดเจนได้#nด้วยนะ"
1602003-71 = "[ns] \"แต่ครูเป็นครูนี่นา\""
1602003-73 = "[ns9] \"ครูควรใช้คำที่เข้าใจง่าย เพื่อให้ได้รับความไว้วางใจสิ\"\n[ns10] \"ถึงจะใช้เวลานาน แต่สิ่งสำคัญคือการไม่สูญเสียความไว้วางใจนะ\""
1602003-76 = "ว้าว ที่พูดมาเมื่อกี้มันเซียร์ราโฮเทลสุดๆ ไปเลยนะ"
1602003-77 = "[s11] \"S, H...?\"\n[s12] \"หมายความว่ายังไงเหรอ?\""
1602003-80 = ""
1602003-82 = ""
1602003-83 = "อ่า... คือว่า เรื่องนั้น..."
1602003-84 = "ฉะ... ฉันหมายถึง สมกับที่เป็นคุณครูของชาเล่ต์เลยน่ะ!"
1602003-85 = "อ่า ฉันว่าเราคุยกันนานเกินไปแล้วละ"
1602003-86 = "งั้นฉันขอกลับไปเขียนรายงานต่อนะ"
1602003-87 = ""
1602003-89 = ""
1602003-90 = ""
1602003-92 = "(หลังจากนั้นโอโทกิก็จมอยู่กับการเขียนรายงานอย่างเร่งรีบ ราวกับพยายามปกปิดเรื่องน่าอาย#nบางอย่างเอาไว้)"
