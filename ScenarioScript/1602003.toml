[translation]
1602003-1 = "A Certain Sniper's Wireless Transmission"
1602003-2 = "Schale Executive Office"
1602003-3 = "It was a normal afternoon..."
1602003-4 = "Otogi had come over for her Student Rep shift, and we were going over the SRT Mission Log together."
1602003-5 = ""
1602003-7 = ""
1602003-8 = ""
1602003-9 = ""
1602003-10 = ""
1602003-11 = "\"Switch to radio channel 3.\""
1602003-12 = "\"This is FOX 4. Are comms clear?\""
1602003-13 = "\"Mission number is M-X-9-2... Not S, X for x-ray.\""
1602003-14 = "Confirmed. Code for ceasing operation is November, Kilo..."
1602003-15 = ""
1602003-16 = "[ns] \"Is the report going well?\""
1602003-17 = "Not really. The signal was really bad on this mission, so it's hard to hear what's being said."
1602003-18 = "We did install a jamming device before the operation, but the interference is still pretty extreme."
1602003-19 = "I need to speak more loudly, even if only to make writing reports easier."
1602003-20 = "[s1] \"This is your voice we're listening to, right?\"\n[s2] \"You all sound really impressive.\""
1602003-23 = "It sounds more complicated than it actually is."
1602003-24 = "First, we're reconfirming the target location and the mission code. That's standard procedure, so really anyone could figure it out."
1602003-25 = "Ah, the phonetic code might make things a little difficult if you haven't studied it."
1602003-26 = "[s] \"'Phonetic code'?\""
1602003-27 = "Yes. Like Alpha, Charlie, Mike."
1602003-28 = "There's a lot of words we use every day that sound similar, right? Like the number two, or the preposition \"to.\""
1602003-29 = "Imagine if someone messed up just one letter or number because of that. We could end up bombing the wrong place."
1602003-30 = "So we spell using words, so there can't be any mistakes like that."
1602003-31 = "For example, FOX from FOX Squad would be Foxtrot-Oscar-X-ray."
1602003-32 = "[ns] \"That's interesting.\""
1602003-34 = "[ns3] \"But when you list all the letters like that...\"\n[ns4]\"Isn't it pretty tedious to relay a message?\""
1602003-37 = "We only use it when there's something we can't afford to confuse, like Tango down, or point Alpha. It'd take way too long if we use phonetic code for everything."
1602003-38 = "Do you want to try, Sensei?"
1602003-39 = "[s] \"I wouldn't be able to keep up.\""
1602003-40 = "Here, just follow the alphabet. And there's no stakes anyway. It's not like it's a real mission."
1602003-41 = ""
1602003-43 = ""
1602003-45 = ""
1602003-46 = "This is FOX 4. Headquarters, respond."
1602003-47 = "[s] \"Th-This is Schale... I mean Sierra 1. Message received.\""
1602003-48 = "FOX 4. Confirmed."
1602003-49 = "Sierra 1. What are the contents of the afternoon snack delivery?"
1602003-50 = "[s5] \"...The snack delivery?\"\n[s6] \"If you want, I have some cake in the fridge.\""
1602003-53 = "What? I can't hear you!"
1602003-54 = "Crackle, crackle! Too much interference! Did you say cake or shake?"
1602003-55 = "[ns] \"Relaying once more, FOX 4.\""
1602003-57 = "[ns] \"Today's snack is Charlie-Alpha-Kilo-Echo. Over.\""
1602003-58 = "Fufu. Then cake it is."
1602003-59 = "Sierra 1, please check what flavors there are."
1602003-60 = "[s] \"Do you prefer Charlie or Sierra?\""
1602003-61 = "Chocolate or strawberry... Sierra, of course!"
1602003-63 = ""
1602003-64 = "[ns7] \"It's actually pretty fun now that I've tried it.\"\n[ns8] \"Maybe it's not that hard after all.\""
1602003-67 = "Yeah. Some of the terms are a little obscure, but it's no different from military jargon."
1602003-68 = "You might find that using phonetic code comes more naturally with some practice."
1602003-69 = "[s] \"I actually think I shouldn't use it.\""
1602003-70 = "Huh? Why not? It's good for security and communication."
1602003-71 = "[ns] \"But I'm a teacher.\""
1602003-73 = "[ns9] \"I want to speak to my students as honestly as possible, without codes.\"\n[ns10] \"I want them to trust that I'm never trying to hide anything.\""
1602003-76 = "Wow, what you said is Sierra Hotel."
1602003-77 = "[s11] \"...S, H?\"\n[s12] \"What's that the abbreviation of?\""
1602003-80 = ""
1602003-82 = ""
1602003-83 = "Ah, w-well..."
1602003-84 = "I mean it's fitting as Schale's S-Sensei!"
1602003-85 = "Oh, come to think of it... We used too much time chatting."
1602003-86 = "I'll go back to my seat to write the report."
1602003-87 = ""
1602003-89 = ""
1602003-90 = ""
1602003-92 = "Otogi awkwardly changed the topic to the report, clearly embarrassed by something."
