[translation]
10041040-1 = "제4화;분노의 게임장"
10041040-4 = "피트니스 센터……. 다음으로 문제가 생길 장소라는 말씀이시죠."
10041040-5 = "알겠어요, 금방 가도록 하죠."
10041040-9 = "……아니, 조금 달라."
10041040-10 = "당신에게는 다른 일을 맡기고자 해. 이번에는……. 피트니스 센터는 네루가 갈 거야."
10041040-14 = "……네?"
10041040-19 = "엉? 나? 쟤가 아니라?"
10041040-21 = "어째서죠? 두 사람은 은밀하게 행동해야 한다고 하지 않았던가요."
10041040-22 = "그렇게 공개적이고 사람이 많은 장소를 살피는 건, 제 쪽의 일인 걸로 알고 있었는데요."
10041040-26 = "굳이 제가 아니라 네루 씨를 보내는 이유가 있나요? 이유가 있다면, 들어볼 수 있을까요?"
10041040-27 = "이쪽이 합당한 방법이야."
10041040-29 = "……리오?"
10041040-31 = "간단해. 안전상의 이슈야."
10041040-32 = "안전상의 이유?"
10041040-36 = "계산이 틀리지 않다면 피트니스 센터는 아직 대상의 공작이 완료되지 않았어, 즉 아직 일을 진행시키고 있는 중이라는 거지."
10041040-37 = "그 말은 잔당이 남아 있다는 뜻이고……. 필요할 경우 전투도 불사할 수 있다는 뜻이야."
10041040-38 = "따라서 문자 그대로 '안전상의 이유'가 있어. 가뜩이나 밀레니엄의 학생도 아닌, 그것도 일반 학생조차 아닌 사람을 보낼 순 없어."
10041040-39 = "오히려 이슈 발생 시 그 자리에 유리조노 세이아, 당신은 그 상황에서 도움이 안 돼."
10041040-40 = "아니, 엄밀히 말해 당신은 없는 편이 좋다는 거지."
10041040-46 = "……없는 편이 좋다……."
10041040-47 = "어이, 리오. 말이 좀 지나치잖아."
10041040-48 = "도움이 안 된다……. 그렇습니까……."
10041040-49 = "결국 저는 여기서도, 그런 취급을 벗어나지 못하는 거군요."
10041040-50 = "(……'여기서도'?)"
10041040-52 = "유감스럽게 생각하지만 안 되는 건 안 되는 거야. 이쪽도 물러설 수 없는 부분이 존재해."
10041040-53 = "그 상황에서 만에 하나 그쪽이 다치기라도 한다면 이건 밀레니엄 전체의 이슈로 확산돼."
10041040-54 = "우리를 돕겠다고 했으니, 그 부분에 대한 입장은 그쪽도 감수해야 하지 않겠어?"
10041040-59 = "…………."
10041040-60 = "수상한 곳을 찾으라고 해 놓고, 수상해 보이는 부분은 위험하니까 가지 말라……."
10041040-61 = "말이 모순된다고 생각하지 않으시나요?"
10041040-62 = "수상과 위험은 별개의 개념으로 진행하고 있어. 엄밀히 따지면 다른 이야기지."
10041040-63 = "애초에 '수상한 것'을 찾는다고 해서 그것과 대치하거나 싸우라고 한 적도 없어. '발견하면 말해 달라'라고 했을 뿐."
10041040-64 = "……틀린 말은 아니네요."
10041040-65 = "협조에는 감사하고 있어. 하지만 이 일의 궁극적인 목표는 애초부터 그쪽을 위한 게 아니야."
10041040-66 = "그 부분은 납득하고 있을 줄 알았는데. 그걸 받아들일 수 없다면, 미안하지만 우리 협력 관계는 여기까지야."
10041040-71 = "……아닙니다, 이해했어요."
10041040-72 = "미안해요. 또 제가 선을 넘었었네요."
10041040-73 = "그러네요. 고집부릴 부분이 아닌데, 어째서인지 제 일의 일부를 뺏긴다는 생각이 들어 실언을 했어요."
10041040-78 = "회장의 다른 부분을 찾으며, 수상한 점을 발견해 줬으면 해."
10041040-79 = "그리고 이미 말했듯, 발견한 경우 모두 나에게 말해 주고, 어떤 경우에도 내 지시 외의 행동은 하지 말아줘. 이게 우리의 협력 조건이야."
10041040-80 = "……네. 이해했어요."
10041040-86 = "…………."
10041040-88 = "……다른 부분을 찾아볼게요. 무슨 일이 생기면 연락할게요."
10041040-89 = "고마워. 나도 이곳에서 나름대로 분석하고 있는 것들이 있으니, 무언가 나온다면 바로 연락할게."
10041040-90 = "……네. 감사합니다."
10041040-91 = "그러면 이만 먼저……."
10041040-96 = "…………."
10041040-97 = "……서둘러야겠네."
10041040-106 = "뭐 하는 거야?"
10041040-107 = "데이터 센터에서 얻어온 칩을 분석하고 있어."
10041040-108 = "막연하게 회장을 탐색하게 하는 것보다, 뭐라도 단서를 찾아 목표를 제시해 주는 쪽이 저쪽도 좋을 거 같아서."
10041040-109 = "……?"
10041040-110 = "뭐야, 너답지 않네. 따로 신경 써주는 거냐?"
10041040-111 = "딱히 그런 건 아니야."
10041040-112 = "칭찬을 하면 그냥 좀 들어라, 제발."
10041040-116 = "칭찬이었어?"
10041040-117 = "아이 씨……."
