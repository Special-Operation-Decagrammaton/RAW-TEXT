[translation]
1012505-1 = "마나 충전"
1012505-6 = "안녕하십니까, 마스터."
1012505-7 = "이야, 오랜만에 학원 밖을 나와보네요."
1012505-8 = "와아, 신난다……."
1012505-9 = "[s] \"별로 신나 보이는 표정이 아닌데요…….\""
1012505-10 = "아니에요."
1012505-11 = "최근 상태 치고는 정말로 신난 거예요."
1012505-12 = "아직도 눈을 감으면 떠올라요. 시험장에서 제가 만들어낸 사악한 마물이……."
1012505-16 = "아아아! 말을 하니까 또 떠올라 버렸어요! 이럴 때는 기억을 지우는 마법을 사용해야……!"
1012505-23 = "[ns] \"아, 알겠으니까 책으로 머리 때리는 건 그만둬!\""
1012505-26 = "휴우우우……."
1012505-27 = "아무래도 다른 마법으로 이 상황을 타개해야겠어요."
1012505-28 = "그런 이유로, 마스터. 어떻게 해야 저의 고갈된 마나가 회복될까요?"
1012505-29 = "[s] \"허기진 영혼을 채워주는 마법은 어때?\""
1012505-30 = "오호, 듣기만 해도 호기심이 생기는 마법이군요."
1012505-31 = "좋습니다. 당장 시험해 보죠."
1012505-39 = "오호, 이곳은……?"
1012505-40 = "[s1] \"평소에 자주 찾는 라멘집이야.\"\n[s2] \"사무실에서 가깝고 맛도 훌륭해.\""
1012505-43 = "마스터가 자주 찾는 장소라……."
1012505-44 = "……그렇군요. #n코끝으로 전해지는 마나의 잔재만으로도 알 수 있습니다."
1012505-45 = "여기라면 확실히 허기진 영혼을 채울 수 있겠군요."
1012505-46 = "마침 배도 고픈 참이니 어서 자리에 앉도록 하죠."
1012505-53 = "음, 혹시 마스터가 추천하는 메뉴가 있을까요?"
1012505-54 = "[s] \"난 돈코츠 라멘을 추천해.\""
1012505-55 = "오호. 마력을 가득 머금은 뼈로 마나를 진하게 추출한 라멘이군요."
1012505-56 = "과연. 허기진 영혼을 채우는 마법이라 할 수 있어요."
1012505-57 = "그럼 마스터의 추천대로 돈코츠 라멘으로 하겠습니다."
1012505-59 = "(이후 에리와 함께 허기진 영혼을 열심히 채웠다.)"
1012505-69 = "후아아, 확실히 마나가 차오르는 느낌이군요."
1012505-70 = "[s3] \"배도 채웠으니, 다음엔 도서관에 가보자.\"\n[s4] \"에리가 좋아할 만한 오컬트 서적이 많은 곳을 알아.\""
1012505-73 = "오호, 도서관이라."
1012505-74 = "오컬트 관련도 좋지만, 저희 학원에서 금서로 지정된 책이 궁금합니다."
1012505-75 = "그 금서를 읽을 수 있다면 제 마법은 더욱 진화하겠죠. 뉴후후."
1012505-76 = "[s] \"와, 와일드헌트의 금서? 어떤 책인데?\""
1012505-77 = "실용 밧줄 매듭법이요."
1012505-78 = "다양한 매듭법을 알면, 위기의 순간 사감대의 추적을 따돌릴 방법도 늘어나겠죠."
1012505-79 = "[s] \"설마 그런 이유 때문에 금서가 된 거야?\""
1012505-80 = "아뇨. 듣자 하니 이상한 이유던데……."
1012505-81 = "어떤 행위 예술가가 그 책에 나온 매듭법으로 자기 몸을 묶고 거리를 활보했다더라고요."
1012505-82 = "거북이 모양? 의 매듭이라던데, 어떤 모양이길래 금서가 됐을까요?"
1012505-83 = "마스터는 알고 계세요?"
1012505-84 = "[s] \"모릅니다!!\""
1012505-85 = "뭐, 정확한 건 그 책을 확인해 보면 알 수 있겠죠."
1012505-86 = "뉴후후후, 기대가 됩니다요."
1012505-88 = "(이후로 에리와 서점을 돌며 다양한 책을 탐독했다.)"
1012505-97 = "(계속해서 여러 장소를 돌아다니며, 에리의 고갈된 마나 회복을 도왔다.)"
1012505-120 = "후아아, 정말 실컷 놀았네요."
1012505-121 = "감사해요, 마스터. 오늘 정말 즐거웠어요."
1012505-122 = "[s] \"나도 덕분에 즐거웠어.\""
1012505-123 = "뭔가 이 순간을 기념할 만한 것이 있으면 좋겠다는 생각이 드네요."
1012505-124 = "같이 사진이라도 찍을까요?"
1012505-125 = "[s] \"좋아!\""
1012505-130 = "뉴후후, 그럼 제가 찍겠습니다요. 자, 이쪽을 보시고……."
1012505-131 = "하나, 둘, 셋~!"
1012505-136 = "어디 보자……."
1012505-137 = "오호, 정말 잘 나왔군요."
1012505-138 = "……."
1012505-139 = "새삼 느끼지만, 사진은 참 편리하단 말이죠."
1012505-140 = "버튼 하나로 눈앞의 경치를 그대로 잘라낼 수 있으니까요."
1012505-141 = "그래서일까요……? #n사진이라는 강적의 등장에 많은 화가들이 절망했다고 해요."
1012505-142 = "한순간에 찍어낸 사진이, 오랫동안 고생해서 그린 그림보다 좋은 평가를 받기도 했으니까."
1012505-143 = "하지만 화가들은 포기하지 않았어요."
1012505-144 = "각자 화가들만이 알 수 있는 <마음의 풍경>이나 <감각>을, #n캔버스에 그려나간 것이죠."
1012505-145 = "분명, 당시의 분들은 <보이지 않는 것>을 그리는 것이야말로, #n그림의 장점이라고 생각했을 거예요."
1012505-146 = "그런 작품에 담긴 화가들의 마음을 보면서…… #n저도 보이지 않는 것을 그리고 싶다 생각했어요."
1012505-147 = "[s] \"그 마음은 여전한 거지?\""
1012505-148 = "물론이죠! 저는 오컬트만큼이나 그림을 좋아하니까요!"
1012505-149 = "두고 보라죠! 언젠간 초 유명한 작가가 되어서 제 그림이 집집마다 걸리는 날이 올 테니까!"
1012505-150 = "[s5] \"나는 지금 하나 걸어두고 싶은데.\"\n[s6] \"미리 신청 해둬도 될까?\""
1012505-153 = "네? 지금요?"
1012505-154 = "지, 지금은 무리지만…… 기다려 주세요! 꼭 멋진 그림을 선물할 테니까!"
1012505-155 = "……그래요. 이렇게 주저앉아 있을 수는 없어."
1012505-156 = "감사합니다, 마스터. 덕분에 제가 미술을 하게 된 계기를 떠올릴 수 있었어요."
1012505-157 = "힘내겠습니다! 저를 믿어 주시는 마스터를 위해서라도!"
1012505-158 = "[s] \"그래! 응원하고 있을게.\""
1012505-159 = "에헤헤헤……."
1012505-160 = "정말 신기하네요."
1012505-161 = "오늘 마스터와 만나기 전까지만 해도 기분이 안 좋았는데, 이렇게나 큰 힘을 얻다니."
1012505-162 = "역시 마스터는 언령 마법을 익히신 것 같아요."
1012505-164 = "(한층 밝은 표정이 된 에리와 계속 꿈에 대한 이야기를 나누었다.)"
1012505-165 = "(이후 밤이 늦기 전에 학교까지 바래다주었다.)"
