[translation]
90100060-1 = "ตอนที่ 6;ความจริงและความเท็จ"
90100060-2 = "กองบัญชาการของกองทหาร FOX"
90100060-4 = ""
90100060-5 = ""
90100060-6 = "กลับมาแล้วค่ะ~"
90100060-7 = "ฉันจัดอุปกรณ์ที่เอาไปใช้ในปฏิบัติการ แล้วเอาไปเก็บไว้ที่เดิมแล้ว"
90100060-8 = "กองทหาร FOX กลับมายังกองบัญชาการเรียบร้อยค่ะ"
90100060-9 = "[s1] \"ทุกคนทำได้ดีมาก! เหนื่อยน่าดูเลยนะ\"\n[s2] \"ไปทำงานกลางอากาศร้อนๆ ลำบากน่าดูเลยนะ\""
90100060-12 = "ไม่หรอกค่ะ คุณครูเองก็ลำบากที่ต้องมาร่วมสังเกตการณ์ด้วย ขอบคุณมากนะคะ"
90100060-13 = "ในเมื่อปฏิบัติการเสร็จสิ้นและทุกคนกลับมากันครบแล้ว งั้นเรามาสรุปข้อมูลที่รวบรวมมาได้กันต่อเลย..."
90100060-14 = "เดี๋ยวๆๆ"
90100060-15 = "ฉันรู้ว่าพูดแบบนี้มันดูเป็นการบ่นเกินเหตุ แต่ก่อนจะเริ่มอะไร ขอพักก่อนสักหน่อยไม่ได้เหรอ?"
90100060-16 = "วันนี้ต้องอยู่กลางแดดเปรี้ยงทั้งวันจนเหงื่อท่วมตัวหมดแล้ว อย่างน้อยก็ขออาบน้ำก่อนนะ..."
90100060-17 = "[s] \"อ่า เรื่องนั้น...\""
90100060-18 = "ขอโทษนะ แต่ถ้าจะใช้ห้องพักผ่อน ฉันว่าน่าจะต้องรออีกหน่อย"
90100060-19 = "นักเรียนเวรของชาเล่ต์ยังไม่กลับไปกันเลยน่ะ"
90100060-20 = "ถ้าเป็นแถวๆ ห้องพักผ่อนที่มีนักเรียนเดินผ่านก็คงต้องหลีกเลี่ยง แต่เราไปใช้ห้องอาบน้ำที่อยู่ข้างนอกไม่ได้เหรอ?"
90100060-21 = "ไม่ได้... กับห้องอาบน้ำก็จะประมาทไม่ได้ บางครั้งนักเรียนคนอื่นก็มาใช้ห้องนั้นเหมือนกันนะ"
90100060-22 = "ไม่กี่วันก่อนหลังซ้อมช่วงเย็นเสร็จ ฉันขึ้นไปที่ห้องอาบน้ำและเกือบจะเจอกับหัวหน้ากองสึคิยูกิเลยละ"
90100060-23 = "มิยาโกะจังน่ะเหรอ?! ทำไมถึงเป็นอย่างนั้นล่ะ?!"
90100060-24 = "ฉันก็ไม่รู้เหตุผลเหมือนกัน... แต่ถ้าตอนนั้นไม่รีบหันหลังแล้ววิ่งหนีมาทันที มีหวังพวกรุ่นน้องคงได้รู้แน่#nว่ากองทหาร FOX แอบเข้ามาใช้ห้องใต้ดินของชาเล่ต์"
90100060-25 = "คุณครู นี่มันเรื่องอะไรกันน่ะ? ทำไมกองทหาร RABBIT ถึงมาใช้ห้องอาบน้ำของชาเล่ต์ล่ะ?"
90100060-26 = "อย่าบอกนะ ว่าใช้ข้ออ้างเรื่องที่กุมจุดอ่อนของเด็กพวกนั้นไว้ ก็เพื่อที่จะทำเรื่องคิดไม่ซื่อ..."
90100060-27 = "[s3] \"ขะ... เข้าใจผิดแล้ว!\"\n[s4] \"ระ... เรื่องนั้นน่ะ คือว่า...\""
90100060-30 = "โคะอุซางิ การ์เด้นที่เป็นที่ตั้งฐานปัจจุบันของกองทหาร RABBIT ยังขาดแคลนสาธารณูปโภคพื้นฐาน คุณครูก็เลยเช่าสิ่งอำนวยความสะดวกบางอย่างให้ใช้สินะ"
90100060-31 = "งะ... งั้นเหรอ...?"
90100060-32 = "การรักษาร่างกายให้สะอาดส่งผลโดยตรงต่อขีดความสามารถในการปฏิบัติการ ในมุมมองของหัวหน้ากองสึคิยูกิ ก็ถือเป็นการตัดสินใจที่สมเหตุสมผล"
90100060-33 = "ไม่ต้องกังวลให้มากไปหรอก คุรุมิจัง"
90100060-34 = "คุรุมิจังก็น่าจะรู้แล้วนี่นา ว่ามิยาโกะจังไม่ใช่คนที่จะยอมอ่อนข้อให้คำขู่หรือคำหว่านล้อมของใครง่ายๆ อยู่แล้ว"
90100060-35 = "มันก็... จริงอยู่หรอกนะ ฉันคงกังวลมากเกินไปน่ะ"
90100060-36 = "ขอโทษนะ คุณครู ช่วยลืมที่ฉันพูดไปเถอะนะ"
90100060-37 = "จะว่าไป เมื่อกี้เธอจินตนาการถึงอะไรอยู่ ถึงได้เอ่ยคำว่า 'คิดไม่ซื่อ' ออกมางั้นเหรอ?"
90100060-38 = "เงียบน่า..."
90100060-39 = "คำนึงถึง 'ความเป็นไปได้' ทุกรูปแบบอยู่เสมอเลย สมกับเป็นพ็อยนต์แมนของกองทหาร FOX เลยนะ"
90100060-40 = "เงียบไปเลยนะ!"
90100060-42 = "งั้นเรามาสรุปเหตุการณ์จากข้อมูลที่รวบรวมได้กับผลการสืบสวนในพื้นที่กัน"
90100060-43 = "อย่างแรกเลย จนถึงตอนนี้มีผู้เสียหายที่ถูกพบในสภาพหมดสติบริเวณรอบสถานีชิโระอุนางิทั้งหมด 10 คน"
90100060-44 = "ผู้เสียหายมีอายุตั้งแต่ 15-30 ปี และส่วนใหญ่จนถึงตอนนี้ก็ยังไม่ฟื้นคืนสติ อีกทั้งยังมีอาการชักคล้ายผู้ป่วยโรคลมชักด้วย"
90100060-46 = "ผู้เสียหายทั้งหมดถูกพบในวันที่ฟ้าโปร่ง ไม่มีเมฆ และมีแสงแดดจัด และช่วงเวลาที่พบก็อยู่ระหว่าง#n10:00-15:00 น. ซึ่งเป็นช่วงที่อุณหภูมิสูงที่สุดของวัน"
90100060-47 = "ในช่วงแรกของการสืบสวนจึงสงสัยว่าเป็นอาการอ่อนเพลียจากอากาศร้อน แต่เมื่อตรวจสอบแล้วก็#nไม่พบความผิดปกติทั้งในด้านอุณหภูมิร่างกายและองค์ประกอบของร่างกาย..."
90100060-48 = "สิ่งที่ผู้เสียหายส่วนใหญ่มีเหมือนกันคือ พวกเขาเห็น 'หุ่นไล่กาสีขาว' ก่อนหมดสติไป"
90100060-49 = ""
90100060-50 = "แล้วหุ่นไล่กาสีขาวนั่นคืออะไรกันแน่? เกี่ยวข้องกับรูปพรรณสัณฐานของคนร้ายหรือเปล่า?"
90100060-51 = "อีกเรื่องที่น่าแปลกใจก็คือ นอกจากผู้เสียหายก็ไม่มีใครเห็นหุ่นไล่กาตัวนั้นเลย..."
90100060-52 = "ที่จริงแล้ว ฉันเริ่มไม่แน่ใจด้วยซ้ำว่านี่เป็นอาชญากรรมที่เกิดจากฝีมือของใครคนหนึ่งจริงหรือเปล่า การทำให้คนจำนวนมากหมดสติไปโดยไม่มีบาดแผลแม้แต่นิดเดียว มันเป็นไปได้จริงเหรอ?"
90100060-53 = "เราจะตีกรอบว่าคนร้ายต้องเป็นแค่ชาวเมืองธรรมดาอย่างเดียวไม่ได้"
90100060-54 = "อันที่จริงท่านประธานองค์การนักเรียนก็เคยบอกฉันไว้ว่า เหตุการณ์นี้อาจเป็นปรากฏการณ์ผิดปกติที่#nเกิดจากเรื่องเล่าสยองขวัญในเมือง หรือก็คือ 'ตำนาน' ก็ได้..."
90100060-55 = ""
90100060-57 = ""
90100060-58 = "หมายความว่ายังไงน่ะ...? แบบนี้คู่ต่อสู้ของเราก็คือพวกปีศาจหรือผีงั้นเหรอ?"
90100060-59 = "ถ้าเป็นสัตว์ประหลาดขนาดยักษ์ที่ไม่รู้ว่าเป็นตัวอะไรก็ว่าไปอย่าง แต่จะให้ไปต่อสู้กับภาพลวงตาที่#nมองไม่เห็นเนี่ยนะ"
90100060-60 = "ถ้าพูดว่าเป็นเรื่องผีหลอกคนให้ตกใจก็ยังพอว่า... แต่ฉันไม่เคยได้ยินเลยว่าผีจะสร้างความเสียหาย#nทางกายภาพได้"
90100060-61 = ""
90100060-62 = ""
90100060-63 = ""
90100060-64 = "[ns5] \"นั่นสินะ...\"\n[ns6] \"จะบอกว่าไม่มีอยู่จริงก็ไม่ได้...\""
90100060-67 = "อะ... อะไรน่ะ? ทำไมทำหน้าแบบนั้นล่ะ คุณครู?!"
90100060-68 = "คุณครูเคยต่อสู้กับผีหรือวิญญาณในคิโวทอสมาเหรอ? "
90100060-69 = "เหวอ... จริงเหรอ..."
90100060-70 = "ทุกคนใจเย็นๆ ก่อน ตอนนี้ยังไม่มีข้อสรุปแน่ชัดว่าเหตุการณ์นี้มีสาเหตุมาจากตำนานนะ"
90100060-71 = "ยิ่งไปกว่านั้น พวกเราก็เป็น[ruby=SRT]หน่วยรบพิเศษ[/ruby]ที่ถูกส่งเข้าปฏิบัติการเป็นลำดับแรกเพื่อความปลอดภัยของ#nคิโวทอส พวกเราจะถอยไม่ได้ ไม่ว่าศัตรูจะเป็นอะไรก็ตาม"
90100060-72 = "อีกอย่าง ถ้าไม่คลี่คลายปัญหานี้ให้เรียบร้อย พวกเราก็ต้องกลับไปที่สำนักควบคุมอยู่ดี"
90100060-73 = "แต่พวกเราเป็นหน่วยรบพิเศษนะ ไม่ใช่มิโกะหรือนักปราบผีสักหน่อย..."
90100060-74 = ""
90100060-76 = ""
90100060-77 = ""
90100060-78 = "ถึงจะเป็นปรากฏการณ์เหนือความเข้าใจของมนุษย์ แต่ผลลัพธ์ทุกอย่างก็ย่อมมีสาเหตุของมัน"
90100060-79 = ""
90100060-81 = ""
90100060-82 = "จำ <เหตุการณ์วิญญาณอาละวาด> ที่เกิดเมื่อฤดูร้อนปีที่แล้วได้หรือเปล่า?"
90100060-83 = "หมายถึงเหตุการณ์ที่นายหน้าอสังหาริมทรัพย์สร้างวิญญาณปลอมขึ้นมาด้วยเครื่องฉายโฮโลแกรม เพื่อกดราคาที่ดินน่ะเหรอ?"
90100060-84 = "วิญญาณปลอมที่ปรากฏตัวตอนนั้นก็เป็นสิ่งลึกลับที่รับมือด้วยปืนหรือระเบิดไม่ได้ แต่นายหน้าอสังหาริมทรัพย์ที่อยู่เบื้องหลังการสร้างเหตุการณ์ขึ้นมาเป็นคนจริงๆ ที่สามารถจัดการได้"
90100060-85 = "ถ้าแก้ปัญหาไม่ได้ ก็แค่หาสาเหตุแล้วกำจัดมันออกไป"
90100060-86 = "หมายความว่าเราควรจับกุมทุกคนที่ปล่อยข่าวลือเหรอ?"
90100060-87 = "พูดอะไรเหลวไหล ในความเป็นจริงมันจะเป็นไปได้ยังไง?"
90100060-88 = "ถึงจะเป็นไปได้ ฉันก็ไม่อยากเลือกวิธีนั้นอยู่ดี..."
90100060-89 = "[s] \"มีความคิดอะไรดีๆ หรือเปล่า?\""
90100060-90 = "อย่างแรกเลย ฉันว่าเราต้องวิเคราะห์เงื่อนไขที่ทำให้ 'หุ่นไล่กาสีขาว' ที่ผู้เสียหายพบเห็นปรากฏตัว#nออกมาก่อนค่ะ"
90100060-91 = "ถึงจะยังไม่รู้ว่า 'หุ่นไล่กาสีขาว' เป็นสาเหตุของเหตุการณ์นี้หรือไม่ แต่ก็ชัดเจนแล้วว่ามันเกี่ยวข้องกับ#nเหตุการณ์นี้"
90100060-92 = "ถ้าเราลองย้อนรอยไปตามจุดที่พบผู้เสียหาย ก็อาจจะเจอหลักฐานชิ้นใหม่ หรือบางทีพวกเราอาจได้#nเผชิญหน้ากับ 'หุ่นไล่กาสีขาว' นั่นด้วยตัวเองก็ได้ค่ะ"
90100060-93 = "หมายความว่าเราต้องไปสืบสวนนอกสถานที่กันต่ออีกสักพักสินะ"
90100060-94 = "ช่วยไม่ได้นะ พรุ่งนี้เราคงต้องไปสืบสวนให้ไกลกว่าเดิมแล้วละ"
90100060-95 = "ในนิยายสืบสวนสอบสวนก็มีคำพูดแบบนี้ไม่ใช่เหรอ? การตั้งข้อสันนิษฐานโดยที่ยังมีข้อมูลไม่เพียงพอ ก็ไม่ต่างอะไรกับการเผาอิฐโดยไม่มีดินเหนียว"
90100060-96 = ""
90100060-98 = ""
90100060-100 = "ถ้าพรุ่งนี้ยังหาเบาะแสไม่เจอ มีหวังพวกเราคงได้กลายเป็นอิฐกันแน่..."
90100060-102 = "ตอนต่อไป;วิญญาณร้ายยามเที่ยงวัน"
