[translation]
90100060-1 = "제6화;진실과 거짓"
90100060-2 = "FOX 소대 HQ"
90100060-6 = "다녀왔습니다~"
90100060-7 = "작전에 쓴 기재도 정리해서 제 자리에 가져다 놓았어."
90100060-8 = "FOX 소대, 복귀 완료하였습니다."
90100060-9 = "[s1] \"다들 수고 많았어!\"\n[s2] \"더운 날 밖에서 일하느라 힘들었지?\""
90100060-12 = "아닙니다. 선생님께서도 참관하시느라 수고 많으셨습니다."
90100060-13 = "작전도 끝나고 모두 복귀했으니 바로 이어서 취득한 데이터의 정리를……"
90100060-14 = "잠깐, 잠깐, 잠깐."
90100060-15 = "배부른 불평이라는 건 알지만, 그 전에 잠깐 휴식 시간을 가질 수는 없을까?"
90100060-16 = "하루 종일 뙤약볕에 있느라 땀투성이가 되었는데, 샤워만이라도 하고 싶어……"
90100060-17 = "[s] \"아, 그건……\""
90100060-18 = "미안하지만 휴게실을 이용하려면 좀 더 기다리는 게 좋을 것 같은데."
90100060-19 = "아직 샬레의 당번 학생들이 돌아가지 않았거든."
90100060-20 = "학생들이 지나다니는 휴게실 근처에 가는 건 피해야겠지만, 외부의 샤워실을 사용하는 건 괜찮지 않아?"
90100060-21 = "아니…… 샤워실도 방심할 수는 없어. 그곳에도 학생들이 가끔 들락거리니까."
90100060-22 = "며칠 전에도 저녁 트레이닝 후에 샤워실에 올라갔다가 츠키유키 소대장과 마주칠 뻔한 적이 있었지."
90100060-23 = "미야코 쨩이?! 어째서?!"
90100060-24 = "그 이유는 알 수 없지만…… 즉시 뒤돌아 도망치지 않았더라면, 분명 FOX 소대가 샬레의 지하실에 잠입해 있다는 사실을 후배들에게 들키고 말았을 거야."
90100060-25 = "선생님, 이게 어떻게 된 일이야? RABBIT 소대 애들이 어째서 샬레의 샤워실을 사용하고 있는 건데?"
90100060-26 = "설마 그 아이들의 약점을 잡았다는 핑계로 엉큼한 짓을—"
90100060-27 = "[s3] \"오, 오해야!\"\n[s4] \"그, 그건 그러니까—\""
90100060-30 = "RABBIT 소대가 현재 주둔하고 있는 코우사기 공원은 생활 인프라가 부족하니, 선생님께서 편의 시설을 임대해 주신 모양이군."
90100060-31 = "그, 그런가……?"
90100060-32 = "청결한 상태를 유지하는 것은 소대의 전투력과도 직결되니, 츠키유키 소대장의 입장에서도 합리적인 판단이라 사료된다."
90100060-33 = "너무 걱정하지 마, 쿠루미 쨩."
90100060-34 = "쿠루미 쨩도 이미 알고 있겠지만 미야코 쨩도 누군가의 협박이나 유혹에 쉽게 굴하는 무른 아이가 아니잖아."
90100060-35 = "그건…… 그렇네. 내가 너무 걱정을 했나 봐."
90100060-36 = "미안, 선생님. 방금 한 말은 잊어줘."
90100060-37 = "그나저나 너는 무슨 상상을 했기에 엉큼하다는 표현이 튀어나온 거야?"
90100060-38 = "……시끄러워."
90100060-39 = "역시 FOX 소대의 포인트맨 답군. 언제나 온갖 '가능성'을 언제나 염두에 두고—"
90100060-40 = "시끄러워!"
90100060-42 = "그럼 지금까지 모은 데이터와 탐문 조사 결과를 바탕으로 사건을 정리하지."
90100060-43 = "우선 현재까지 시로우나기 역 일대에서 정신을 잃고 발견된 피해자는 총 10명."
90100060-44 = "피해자의 연령은 15세부터 30세까지 다양하였으며, 대부분이 현재까지 의식을 회복하지 못하고 뇌전증 환자와 같은 경련 증상을 보이고 있다."
90100060-46 = "피해자가 발견된 때는 구름 없이 직사광선이 강한 날이었으며, 발견 시각도 1000시에서 1500시 사이로 하루 중 기온이 가장 높은 시기였지."
90100060-47 = "때문에 초기 수사에서는 높은 기온으로 인한 탈진을 의심하였지만, 피해자들의 체온과 체성분에는 문제가 없었고……"
90100060-48 = "사건이 일어나기 전, 다수의 피해자가 '흰색 허수아비'를 목격했다는 공통점이 있다."
90100060-50 = "그 흰색 허수아비는 도대체 뭐지? 범인의 인상착의와 관련이 있는 건가?"
90100060-51 = "하지만 피해자를 제외한 다른 사람들은 그 허수아비를 보지 못했다는 것도 신경 쓰이고……"
90100060-52 = "사실 나는 이 사건이 특정인에 의한 범죄인지 조차도 의심스러워. 외상을 입히지 않고 다수의 사람을 기절시키는 게 가능하기나 한가?"
90100060-53 = "그 말처럼 범인을 평범한 시민만으로 한정 지을 수는 없다."
90100060-54 = "사실 총학생회장께서는 이 사건이 도시 괴담, 즉 로어에 의해 발생한 이상현상일지도 모른다고 말씀하셨지만……"
90100060-58 = "그게 무슨 소리야……? 그럼 우리 상대는 악마나 유령이라는 거야?"
90100060-59 = "정체를 알 수 없는 거대한 괴물이라면 몰라도, 보이지도 않는 허상과 싸울 수는 없다고."
90100060-60 = "애초에 유령이 사람을 놀라게 했다는 이야기라면 몰라도, 물리적인 피해를 입혔다는 이야기는 들은 적이 없는데."
90100060-64 = "[ns5] \"글쎄……\"\n[ns6] \"없다고 말하기는 어려울지도……\""
90100060-67 = "뭐, 뭐야. 그 표정은 뭔데, 선생님?!"
90100060-68 = "설마 선생님은 키보토스에서 유령과 싸운 적이 있었던 거야?"
90100060-69 = "으엑, 진짜냐……"
90100060-70 = "잠깐, 다들 진정해. 아직 이번 사건의 원인이 괴담이라고 확정된 건 아니니까."
90100060-71 = "게다가 우리는 키보토스의 안전을 위해 가장 빠르게 투입되는 [ruby=SRT]특수부대[/ruby]. 상대가 무엇이든 물러설 수는 없어."
90100060-72 = "애초에 이 문제를 해결하지 않으면 교정국으로 다시 돌아가야 할 처지기도 하고."
90100060-73 = "하지만 우린 특수부대지, 무녀나 퇴마사가 아닌데……"
90100060-78 = "설령 사람이 이해할 수 없는 불가해한 현상이라 하더라도, 모든 결과에는 원인이 존재하는 법이지."
90100060-82 = "혹시 작년 여름에 있었던 <유령 소동>, 기억해?"
90100060-83 = "부동산 업자가 땅 값을 낮추려고 홀로그램 장치로 가짜 유령을 만들어 낸 사건 말이야?"
90100060-84 = "그 때 나타났던 가짜 유령도 총과 폭탄으로 상대할 수 없는 불가해한 존재였지만, 유령 소동을 꾸며 내는 부동산 업자는 물리칠 수 있는 현실의 존재였지."
90100060-85 = "문제를 해결할 수 없다면, 원인을 찾아 제거하면 되는 거야."
90100060-86 = "그 말인 즉, 소문을 퍼트리는 사람들을 모두 체포하자는 건가?"
90100060-87 = "바보 같은 소리 하지 마. 현실적으로 그게 가능할 리가 없잖아?"
90100060-88 = "……가능하더라도 그 방법은 택하고 싶지 않지만."
90100060-89 = "[s] \"무슨 좋은 생각이라도 있는 거야?\""
90100060-90 = "우선은 피해자들이 목격했다는 '하얀 허수아비'가 나타나는 조건을 파악해야 할 것 같습니다."
90100060-91 = "'하얀 허수아비'가 이번 사건을 일으킨 원인인지는 알 수 없지만, 사건과 관계가 있다는 것만큼은 분명하니까요."
90100060-92 = "피해자들이 발견된 장소를 되짚어 가보면 새로운 증거를 찾을 수 있을지도 모르고, 어쩌면 저희가 직접 그 '하얀 허수아비'를 마주할 수 있을지도 모릅니다."
90100060-93 = "그러니까 당분간은 야외 조사를 더 해야 한다는 소리네."
90100060-94 = "어쩔 수 없네. 내일은 조금 더 멀리 나가보는 수밖에."
90100060-95 = "추리 소설에도 그런 말이 나오잖아? 충분한 데이터 없이 추론하는 건, 점토 없이 벽돌을 굽는 것과 같다고."
90100060-100 = "내일도 단서를 찾지 못하면, 우리가 벽돌이 되어버리겠어……"
90100060-102 = "다음화;정오의 악령"
