[translation]
90100060-1 = "第6話;真實與謊言"
90100060-2 = "FOX小隊HQ"
90100060-4 = ""
90100060-5 = ""
90100060-6 = "我回來了～"
90100060-7 = "作戰用的器材我也整理好放回原位了。"
90100060-8 = "FOX小隊，歸隊完畢。"
90100060-9 = "[s1] 「大家辛苦了！」\n[s2] 「大熱天在外面工作一定很累吧？」"
90100060-12 = "不會。老師在一旁監督也辛苦了。"
90100060-13 = "既然大家都已結束作戰順利歸隊，就緊接著整理取得的資料……"
90100060-14 = "慢著慢著，先等一下。"
90100060-15 = "我知道這種抱怨很奢侈，不過能不能先讓我們稍微休息一下？"
90100060-16 = "整天待在大太陽底下被曬得汗流浹背的，我想至少先沖個澡……"
90100060-17 = "[s] 「啊，那個……」"
90100060-18 = "不好意思，休息室恐怕得再等一下才能使用。"
90100060-19 = "因為在夏萊值班的學生們還沒回去。"
90100060-20 = "避開學生會經過的休息室附近，用外面的淋浴間應該沒關係吧？"
90100060-21 = "不……淋浴間也不能大意。那裡也偶爾會有學生進出。"
90100060-22 = "前幾天我做完晚間訓練到淋浴間的時候，就差點跟月雪小隊長撞個正著呢。"
90100060-23 = "跟都子醬！？為什麼！？"
90100060-24 = "雖然不清楚原因……不過要是我沒有立刻轉身逃走的話，#nFOX小隊潛伏在夏萊地下室的事肯定會被後輩們發現的。"
90100060-25 = "老師，這是怎麼回事？#nRABBIT小隊的孩子們為什麼在使用夏萊的淋浴間？"
90100060-26 = "難道你抓住那些孩子的把柄，做了什麼下流的事──"
90100060-27 = "[s3] 「誤，誤會啊！」\n[s4] 「這，這是因為──」"
90100060-30 = "RABBIT小隊目前駐紮的兔寶寶公園缺乏生活基礎設施，#n所以老師才會將設施租借給他們吧。"
90100060-31 = "是，是嗎……？"
90100060-32 = "衛生問題會直接影響小隊的戰鬥力。#n站在月雪小隊長的立場，這也是合理的判斷。"
90100060-33 = "不用太擔心的，胡桃醬。"
90100060-34 = "胡桃醬應該也知道，都子醬可不是那種會輕易屈服於威脅或誘惑的軟弱孩子。"
90100060-35 = "這……說的也是。看來是我過度擔心了。"
90100060-36 = "抱歉，老師。剛才說的話你就忘了吧。"
90100060-37 = "話說你到底想像了什麼，才會冒出下流這個詞啊？"
90100060-38 = "……少囉嗦。"
90100060-39 = "不愧是FOX小隊的尖兵。#n總是把各種「可能性」放在心上──"
90100060-40 = "就叫你少囉嗦了！"
90100060-42 = "那麼就根據目前蒐集到的資料和訪查結果，對案情進行整理吧。"
90100060-43 = "首先，至今為止在白鰻車站一帶被發現失去意識的受害者一共有10名。"
90100060-44 = "年齡從15歲到30歲不等，大多尚未恢復意識，並出現類似癲癇患者的痙攣症狀。"
90100060-46 = "受害者被發現時多為萬里無雲、直射陽光強烈的日子。#n發現時間在1000至1500之間，也就是一天當中氣溫最高的時段。"
90100060-47 = "因此初期調查曾懷疑是高溫導致的虛脫症狀，#n然而受害者的體溫和身體成分都沒有問題……"
90100060-48 = "在案件發生前，多數受害者都有目擊到「白色稻草人」這個共通點。"
90100060-49 = ""
90100060-50 = "那個白色稻草人到底是什麼？#n會跟犯人的特徵有關嗎？"
90100060-51 = "而且除了受害者之外的其他人都沒有見過，這點也挺令人在意的……"
90100060-52 = "其實我連這起事件是否屬於個人犯罪都有點懷疑。#n真的有可能在不造成外傷的情況下，讓這麼多人陷入昏迷嗎？"
90100060-53 = "就像你說的一樣，我們不能將犯人的身分侷限於普通市民之中。"
90100060-54 = "其實聯邦學生會長也曾經表示這起事件可能是都市傳說──#n也就是怪談所引發的特異現象……"
90100060-55 = ""
90100060-57 = ""
90100060-58 = "那是什麼意思……？#n所以我們的對手是惡魔或幽靈嗎？"
90100060-59 = "如果是來歷不明的巨大怪物也就罷了，我們可沒辦法跟看不見的幻影戰鬥啊。"
90100060-60 = "況且我雖然聽過幽靈嚇人的故事，實際造成物理傷害的可從來沒聽過啊。"
90100060-61 = ""
90100060-62 = ""
90100060-63 = ""
90100060-64 = "[ns5] 「這個嘛……」\n[ns6] 「要說完全沒有好像也有點困難……」"
90100060-67 = "什，什麼啦，老師那個表情是什麼意思！？"
90100060-68 = "難道老師有在奇普托斯和幽靈戰鬥過嗎？"
90100060-69 = "嗚哇，真的假的……"
90100060-70 = "等等，大家先冷靜。#n這次事件的原因還不一定就是怪談。"
90100060-71 = "而且我們是為了奇普托斯的安全而最快投入的[ruby=SRT]特殊部隊[/ruby]。#n無論面對什麼樣的對手都不能退縮。"
90100060-72 = "況且要是無法解決這個問題，我們可是會落得再次回到矯正局的下場。"
90100060-73 = "可是我們是特殊部隊，又不是巫女或驅魔師……"
90100060-74 = ""
90100060-76 = ""
90100060-77 = ""
90100060-78 = "就算是人類無法理解的不可解現象，一切結果的背後依然存在著原因。"
90100060-79 = ""
90100060-81 = ""
90100060-82 = "還記得去年夏天那起「幽靈騷動」嗎？"
90100060-83 = "是有房地產業者為了壓低地價，用全息投影裝置製造假幽靈的那起事件對吧？"
90100060-84 = "當時出現的假幽靈也是無法用槍砲炸彈對付的不可解存在，#n然而捏造幽靈騷動的房地產業者卻是能被擊退的現實存在。"
90100060-85 = "如果問題無法解決，只要找出原因並加以排除即可。"
90100060-86 = "所以你的意思是，要把散播謠言的人全部逮捕嗎？"
90100060-87 = "別說傻話了。現實中怎麼可能辦得到嘛？"
90100060-88 = "……就算辦得到，我也不想採用那種方法。"
90100060-89 = "[s] 「你有什麼好主意嗎？」"
90100060-90 = "首先，我認為必須先掌握受害者們所目擊到的「白色稻草人」出現的條件。"
90100060-91 = "雖然「白色稻草人」是不是原因還無法確認，不過至少可以肯定它和事件有關。"
90100060-92 = "沿著受害者被發現的地點重新調查，說不定能找到新的證據。#n我們甚至有機會能親眼見到那個「白色稻草人」。"
90100060-93 = "也就是說，這陣子還得繼續進行戶外調查囉。"
90100060-94 = "這也沒辦法。#n明天再試著到更遠的地方看看吧。"
90100060-95 = "推理小說裡不是也有這種說法嗎？#n沒有充分的資料就進行推論，就跟沒有黏土卻想燒出磚頭一樣。"
90100060-96 = ""
90100060-98 = ""
90100060-100 = "要是明天還找不到線索，我們就要變成磚頭了啦……"
90100060-102 = "下一話;正午的惡靈"
