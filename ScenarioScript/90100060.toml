[translation]
90100060-1 = "Episode 6;Truth and Lies"
90100060-2 = "FOX Squad HQ"
90100060-4 = ""
90100060-5 = ""
90100060-6 = "I'm back!"
90100060-7 = "Great. I've tidied up the equipment and re-racked everything."
90100060-8 = "FOX Squad, reporting in."
90100060-9 = "[s1] \"Good work, everyone!\"\n[s2] \"Must've been tough out in the heat.\""
90100060-12 = "Not at all. Thank you for watching over us, Sensei."
90100060-13 = "Since we've all returned, let's organize our data right away..."
90100060-14 = "Wait, wait, wait."
90100060-15 = "Is a break too much to ask for?"
90100060-16 = "I'm soaked in sweat, and I feel gross. Can I at least hit the shower?"
90100060-17 = "[s] \"Ah, well...\""
90100060-18 = "Sorry, but you might have to wait a little longer. The lounge is occupied."
90100060-19 = "The Student Reps are still wandering around."
90100060-20 = "Fine, fine. I can avoid the lounge. But what about the shower room?"
90100060-21 = "No... You can't let your guard down there either. It's still a public space, and you could be spotted."
90100060-22 = "I almost ran into Squad Leader Tsukiyuki there a few days ago."
90100060-23 = "Miyako?! Why was she here?!"
90100060-24 = "You know, I didn't ask her... But if I didn't turn around immediately, she would have recognized me in a second."
90100060-25 = "Sensei, what's going on here? Why is the RABBIT Squad using Schale's showers?"
90100060-26 = "Oh, are you MAKING them? Is it blackmail, for PERVERT reasons?"
90100060-27 = "[s3] \"I-It's a misunderstanding!\"\n[s4] \"Th-They're here because...\""
90100060-30 = "It seems that Sensei grants them some amenities because Kousagi Park, where the RABBIT Squad is currently stationed, lacks basic infrastructure."
90100060-31 = "I-Is that so?"
90100060-32 = "Good hygiene is directly linked to a squad's combat capabilities. Squad Leader Tsukiyuki made a logical decision. She's using her resources well."
90100060-33 = "You don't need to be so concerned, Kurumi."
90100060-34 = "Miyako has a level head and a strong will. She wouldn't easily cave into threat or temptation."
90100060-35 = "That's... Yeah, that tracks. Maybe I was worrying too much."
90100060-36 = "Sorry, Sensei. Please forget what I said earlier. About you being a pervert."
90100060-37 = "By the way, just what were you imagining Sensei was doing with RABBIT down here?"
90100060-38 = "...Shut up."
90100060-39 = "A true point woman, isn't she? Always keeping realms of \"possibilities\" in mind..."
90100060-40 = "Shut UP!"
90100060-42 = "Let's begin reviewing the data. We had several observations on the area and one successful interview."
90100060-43 = "First off, there have been ten victims found unconscious near Shiro Unagi Station."
90100060-44 = "Their ages vary from 15 to 30, and most of them have yet to regain consciousness. They display seizure-like convulsions."
90100060-46 = "All victims were found on cloudless, sunny days under intense sunlight. They were discovered between the hours of 1000 and 1500, the hottest part of the day."
90100060-47 = "Initial investigations concluded that these falls were due to exhaustion or heatstroke. However, the victims did not present with elevated heart rates or abnormal temperatures."
90100060-48 = "Multiple victims allegedly witnessed a \"white scarecrow\" before their medical incidents occurred."
90100060-49 = ""
90100060-50 = "What's with the white scarecrow? Is it the culprit, or a coincidence?"
90100060-51 = "I can only guess. It seems that no one besides the victims got close enough to the scarecrow to figure that out."
90100060-52 = "I think we need to step back. Is this even a criminal investigation? How can you knock out multiple people without leaving physical evidence?"
90100060-53 = "We're here to find that out. We know an ordinary person could not do that."
90100060-54 = "The General Student Council President said that this case may be an anomaly spurred on by the belief in urban legends. \"Lore,\" in other words..."
90100060-55 = ""
90100060-57 = ""
90100060-58 = "What does that even mean...? We're fighting ghosts and demons now?"
90100060-59 = "We can handle monsters, but ideas? How do you fight an illusion?"
90100060-60 = "Ghosts are said to scare people, sure. But they don't inflict physical injuries."
90100060-61 = ""
90100060-62 = ""
90100060-63 = ""
90100060-64 = "[ns5] \"Well...\"\n[ns6] \"We don't know that for sure...\""
90100060-67 = "Wh-What the...? What's with that look, Sensei?!"
90100060-68 = "Have you been ghost hunting in Kivotos? "
90100060-69 = "Come on. Seriously...?"
90100060-70 = "Everyone, please relax. We haven't confirmed that urban legends are somehow causing this."
90100060-71 = "What we do know is that we're a special unit serving as Kivotos' first line of defense. We don't retreat, no matter the enemy."
90100060-72 = "More importantly, if we don't solve this case, they'll throw us back in the Corrections Bureau."
90100060-73 = "We're a special unit, not mikos or exorcists..."
90100060-74 = ""
90100060-76 = ""
90100060-77 = ""
90100060-78 = "Nothing happens without a cause. Even mysterious phenomena must follow certain rules."
90100060-79 = ""
90100060-81 = ""
90100060-82 = "Do you remember the \"ghost commotion\" case from last summer?"
90100060-83 = "Yeah. Some developer used holograms and glass to manufacture a ghost. It was all for some land grab, right?"
90100060-84 = "While we couldn't fight the alleged ghost with explosives, we COULD easily defeat the real estate developer."
90100060-85 = "If we can't deal with the problem, then we can find and remove the cause. Do you understand?"
90100060-86 = "So you want us to arrest everyone spreading the rumors?"
90100060-87 = "Don't be stupid. That's impossible."
90100060-88 = "...Even if it WERE possible, we should avoid that approach."
90100060-89 = "[s] \"What's your idea?\""
90100060-90 = "I propose we look more closely into the conditions that caused the \"white scarecrow\" to appear."
90100060-91 = "While we don't know if the scarecrow is causing the incidents, it is clearly related."
90100060-92 = "If we sweep the places where the victims were found, we could uncover more clues. Or, better yet, we could fight this scarecrow ourselves."
90100060-93 = "So you're saying we need to go outside again?"
90100060-94 = "Very well. Sounds like we'll need to go more in-depth tomorrow."
90100060-95 = "I read this in a mystery novel once. \"Drawing inferences without sufficient data is like baking bricks without clay.\""
90100060-96 = ""
90100060-98 = ""
90100060-100 = "Yeah, if we don't find a lead tomorrow, we'll bake into bricks too..."
90100060-102 = "Next Episode;High Noon and the Revenant"
