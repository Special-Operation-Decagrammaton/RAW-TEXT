70013030-78 = ""
70013030-79 = ""
70013030-80 = "ฮุฮุ ยอมแพ้ไปเถอะน่า ฝืนสู้ต่อไปจะลำบากเปล่าๆ นะ"
70013030-81 = "ฮุฮุฮุ คราวนี้จะยอมปล่อยไปก็ได้ แต่ขอถ่ายรูปเก็บไว้สักหน่อยก็แล้วกัน!"
70013030-83 = ""
70013030-84 = "บะ... บ้าเอ๊ย...! ฉันไม่ยอมโดนทำแบบนี้อีกแล้ว...!!"
70013030-85 = "ไม่ว่ายังไงก็ต้องชนะให้ได้"
