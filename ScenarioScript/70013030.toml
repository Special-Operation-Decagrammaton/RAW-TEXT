70013030-136 = "คะ? จะ... จู่ๆ จะไปไหนเหรอคะ?!"
70013030-137 = "ตามมาก่อนเถอะน่า! นี่เป็นวิธีที่ดีที่สุดในตอนนี้แล้ว!"
70013030-138 = "ทะ... ท่านอารุ...!"
70013030-140 = "ชะ... ใช่แล้ว! ที่นี่ให้พวกเราจัดการเอง พวกเธอรีบหนีไปซะ!"
70013030-141 = "นี่! ฉันจะทิ้งปืนตามที่บอก! เพราะงั้นปล่อยพนักงานของฉันออกไปซะ!"
