70013030-59 = "ขะ... ขวางไว้! อย่าให้เข้ามาตรงนี้ได้!"
70013030-60 = ""
70013030-62 = ""
70013030-64 = ""
70013030-65 = "ดื้อด้านกันจริงๆ เลยนะ..."
70013030-66 = "ประธาน ดูเหมือนจะทำข้าวของเสียหายนิดหน่อยน่ะ ไม่เป็นไรใช่มั้ย?"
70013030-67 = "ไม่ต้องห่วง! ขอแค่พวกเราชนะก็พอ!"
70013030-68 = "เพราะประวัติศาสตร์ถูกเขียนโดยผู้ชนะยังไงล่ะ!"
