70013030-125 = "ใช้ทางนั้นหนีออกไปกับฮารุกะซะ"
70013030-126 = "เอ๋? แล้วอารุจังกับคาโยโกะจังล่ะ?"
70013030-127 = "ตอนนี้มีแต่ต้องยอมแพ้ก่อน"
70013030-128 = "เธอก็รู้นิสัยประธานนี่? คงไม่ปล่อยให้ตัวประกันบาดเจ็บหรอก"
70013030-129 = "นี่เป็นวิธีที่ดีที่สุดแล้ว รู้ใช่มั้ยว่าหมายความว่ายังไง?"
70013030-130 = "ให้หาทางกลับมาแก้แค้นใช่มั้ยล่ะ? อื้อ เข้าใจแล้ว!"
