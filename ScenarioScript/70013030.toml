[translation]
70013030-1 = "วัชพืชมิอาจเติบโตเพียงลำพัง 3"
70013030-2 = "ตั้งแต่วันนั้น ฉันก็รอโอกาสที่จะแก้แค้นมาตลอด"
70013030-3 = "คิดไม่ถึงเลยว่าโชคชะตาจะพาเรามาเจอกันแบบนี้! ฉันจะใช้โอกาสนี้เอาคืนแบบทบต้นทบดอกเลย คอยดู!!"
70013030-4 = ""
70013030-8 = ""
70013030-9 = "ฮุฮุฮุ ตอนนั้นโดนไปขนาดนั้นยังไม่สำนึกอีกเหรอ?"
70013030-10 = "ถ้ายังทำแบบนี้อีก ฉันจะเล่าเรื่องขายหน้าของนายให้ลูกน้องนายฟังให้หมดเลย"
70013030-11 = "หะ... หุบปาก! ตอนนั้นฉันปล่อยพวกเธอไปก็ดีแค่ไหนแล้ว...!"
70013030-12 = ""
70013030-14 = ""
70013030-15 = ""
70013030-16 = "ไม่ใช่เพราะกลัวฉันเอาข้อมูลน่าอายของนายไปเผยแพร่บนเว็บไซต์หรอกเหรอ?"
70013030-17 = "ถ้าจะเอาแบบนั้น ฉันโพสต์ให้ตอนนี้เลยก็ได้นะ"
70013030-18 = "อะ... อึกก...!"
70013030-19 = "เด็กๆ! จัดการให้หมด! อย่าปล่อยให้เจ้าพวกนั้นทำเรื่องไม่เป็นเรื่องได้เด็ดขาด...!"
70013030-20 = ""
70013030-24 = ""
70013030-30 = ""
70013030-31 = "ฮุฮุ ดี ดีมากเลย"
70013030-32 = "ได้พบศัตรูคู่แค้นในอดีตและจัดการปิดฉากได้อย่างสวยงาม แบบนี้สิถึงจะสมกับเป็นวายร้าย...!"
70013030-33 = "ทุกคน มาเอาจริงกันเถอะ!"
70013030-34 = "ค่ะ ท่านอารุ! คราวนี้ฉันจะชดเชยส่วนของเมื่อครั้งก่อนไปด้วยเลย...!!"
70013030-35 = "อ๊าาาา...! ตายไปซะเถอะค่ะ! ตายไปให้หมดทุกคนเลยค่ะ...!!"
70013030-36 = ""
70013030-42 = "อึก! ถะ... ถอยก่อน! ถ้าเข้าไปใกล้เกินไปจะอันตราย!"
70013030-43 = ""
70013030-44 = "ฮุฮุฮุ มารวมตัวกันเองเลยเหรอเนี่ย"
70013030-45 = "ทุกคนพร้อมระเบิดตู้มต้ามรึยังน้า?"
