70013030-157 = "ฉะ... ฉันสมควรตายจริงๆ ค่ะ! คนอย่างฉันตายไปตั้งแต่ตอนนี้คงจะดีซะกว่า...!!"
70013030-158 = "พูดอะไรของเธอน่ะ! พวกเราต้องหาทางช่วยอารุจังกับคาโยโกะจังออกมาสิ!"
70013030-159 = "เจ้าบอสอ้วนตุ๊ต๊ะนั่น คราวก่อนเราก็โค่นมาแล้ว เพราะงั้นคราวนี้ก็ไม่ต้องห่วงหรอก!"
