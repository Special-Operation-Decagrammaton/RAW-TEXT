70013030-192 = "อะ... อึก...!"
70013030-193 = "ขะ... ขอโทษค่ะ! พวกเราจะไม่โผล่หน้ามาให้คุณฮารุกะเห็นอีกเลยค่ะ!!"
70013030-194 = "ตะ... ต่อจากนี้ไปจะใช้ชีวิตอย่างสำนึกผิดค่ะ...!!"
70013030-196 = "อ่า... อ่า..."
70013030-197 = "ฮุฮุฮุ เห็นมั้ยล่ะ? นี่แหละพลังของพวกเราละ"
70013030-198 = "มะ... ไม่มีทางที่พวกคุณจะทำแบบนี้ให้โดยไม่หวังอะไรแน่..."
70013030-199 = "ฉะ... ฉันจะต้องทำอะไรเพื่อเป็นการตอบแทนคะ?!"
70013030-200 = "ยะ... อยากได้เงินเหรอคะ? ตะ... แต่ว่าตอนนี้ฉัน...!"
70013030-201 = "พวกเราไม่ต้องการค่าตอบแทนหรอก แบบนั้นมันไม่สมกับเป็นวายร้ายนะ"
70013030-202 = "วะ... วายร้าย?"
70013030-203 = "ใช่ คนนอกกฎหมาย วายร้ายที่ไร้หัวใจและเหี้ยมโหด ก่อความชั่วร้ายวันละหนึ่งครั้ง นั่นละคือคติของพวกเรา"
70013030-204 = "การช่วยเธอก็เป็นเพียงส่วนหนึ่งของคติพจน์ของพวกเรา ไม่ได้อยากได้อะไรตอบแทนหรอก"
70013030-205 = "เพราะงั้น... ลุกขึ้นมาเถอะ"
