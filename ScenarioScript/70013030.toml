[translation]
70013030-1 = "잡초는 홀로 피지 않는다 3"
70013030-2 = "그때부터 복수의 날을 기다려 왔다."
70013030-3 = "이렇게 이곳에서 만난 건 필연! 이 기회에 전부 정리해 주겠어!!"
70013030-9 = "쿠후후, 그때 그렇게 당해놓고 정신을 못 차렸네?"
70013030-10 = "자꾸 그러면 부하들 앞에서 그날 어떤 창피를 당했는지 다 말해버린다?"
70013030-11 = "다, 닥쳐! 지금까지 봐줬던 은혜도 모르고……!"
70013030-16 = "내가 당신의 부끄러운 정보를 웹에 퍼트리는 게 두려웠던 게 아니라?"
70013030-17 = "원한다면 지금도 해줄 수 있는데."
70013030-18 = "크, 크아아아……!"
70013030-19 = "얘들아! 공격해! 저 녀석들이 허튼짓 못 하도록……!!"
70013030-31 = "후후, 좋아. 아주 좋아."
70013030-32 = "예전의 숙적을 다시 만나 멋지게 해치운다. 이것 또한 하드보일드……!"
70013030-33 = "다들, 진지하게 가자!"
70013030-34 = "네, 아루 님! 이번엔 그때 못했던 몫까지……!!"
70013030-35 = "으아아아……! 죽어주세요! 전부 죽어주세요……!!"
70013030-42 = "크윽! 이, 일단 떨어져! 가까이 가면 위험해!"
70013030-44 = "쿠후후, 알아서 예쁘게 모여줬네?"
70013030-45 = "모두 터질 준비 됐어?"
70013030-46 = "……!"
70013030-56 = "크아아악……!"
70013030-58 = "꺄하하핫! 팝콘 같아!"
70013030-59 = "마, 막아! 이쪽으로 오지 못하게 해!"
70013030-65 = "……끈질기네."
70013030-66 = "사장. 집기가 좀 더 부서질 것 같은데, 괜찮겠지?"
70013030-67 = "상관없어! 우리가 이기면 돼!"
70013030-68 = "역사는 승자가 쓰는 법이니까!"
70013030-69 = "뭔가 다른 말인 것 같긴 하지만……."
70013030-70 = "어찌 됐든 이겨야 한다는 건 동감이야."
70013030-80 = "후후, 슬슬 포기하시지. 계속 싸웠다간 그쪽만 손해야."
70013030-81 = "쿠후후, 이번에도 굴욕 사진 몇 장 남기는 정도로 넘어가 줄게!"
70013030-84 = "제, 제길……! 이렇게 또 당할 수는……!!"
70013030-85 = "어떻게든 이겨야 해."
70013030-86 = "그래……! 어떻게든……!!"
70013030-94 = "히, 히이이익! 사, 살려주세요……!"
70013030-95 = "너희들! 항복해! 아니면 이 인질의 목숨은 없어!!"
70013030-103 = "하, 항복해……! 이 녀석들이 무사하길 바란다면!!"
70013030-104 = "비겁한! 인질을 잡다니……!"
70013030-106 = "어서 총 버려! 장난으로 하는 말 아니야!!"
70013030-113 = "(으, 으으으으……!)"
70013030-114 = "(하지만 여기서 총을 버리면…… 우리 사원들이 위험해져!)"
70013030-115 = "(그렇다고 계속 싸우면 인질이……!)"
70013030-116 = "(아, 으아아아아……!)"
70013030-123 = "……."
70013030-124 = "무츠키. 이쪽 옆의 주방에 음식용 소형 리프트가 있어."
70013030-125 = "그쪽으로 하루카와 빠져나가."
70013030-126 = "에에? 그럼 아루 쨩이랑 카요코 쨩은?"
70013030-127 = "일단 항복하는 수밖에."
70013030-128 = "사장 성격 알잖아? 인질을 다치게 할 수는 없어."
70013030-129 = "이게 최선이야. 무슨 뜻인지 알지?"
70013030-130 = "……돌아와서 복수를 해달라는 거지? 응. 알겠어!"
70013030-131 = "하루카 쨩! 가자!"
70013030-136 = "네? 가, 갑자기 어디로요?!"
70013030-137 = "일단 따라와! 지금은 이게 최선이니까!"
70013030-138 = "아, 아루 님……!"
70013030-140 = "그, 그래! 여긴 우리에게 맡기고 빠져나가!"
70013030-141 = "당신! 원하는 대로 총을 버리겠어! 그러니까 우리 사원들은 보내 줘!"
70013030-142 = "이, 이놈들이 잔꾀를……!"
70013030-143 = "이때야! 어서 가……!"
70013030-154 = "하아, 하아……."
70013030-155 = "하루카 쨩. 괜찮아?"
70013030-156 = "아, 아루 님…… 죄송합니다. 정말 죄송합니다. 아루 님을 두고 도망치다니……."
70013030-157 = "여, 역시 죽어야겠어요! 저 같은 거, 지금이라도 당장 죽는 게 낫겠어요……!!"
70013030-158 = "무슨 소리야! 우리가 힘내서 아루 쨩이랑 카요코 쨩을 구해야지!"
70013030-159 = "그 뚱보 보스 녀석, 저번에도 쓰러뜨렸으니까 이번에도 문제없어!"
70013030-160 = "하, 하지만 그때 저는……."
70013030-163 = "아……! 찾았다!"
70013030-168 = "히, 히이익……!"
70013030-169 = "왜 계속 도망가는 거야? 내가 멈추라고 했잖아!"
70013030-170 = "하, 하지만 괘, 괜히 저 같은 녀석이랑 엮였다간……!"
70013030-171 = "괜찮아……!"
70013030-172 = "네, 네……?"
70013030-176 = "괜찮아! 널 괴롭히던 녀석들, 내가 전부 혼내줬으니까!"
70013030-177 = "그 마피아 녀석들도 다시는 까불지 못할 거야."
70013030-179 = "어, 어떻게……."
70013030-184 = "쿠후후, 붙잡아서 부끄러운 사진을 잔뜩 찍어줬거든!"
70013030-185 = "각서까지 받았어. 확실한 거니까 안심해."
70013030-186 = "자! 너도 어서 나와서 사과해!"
70013030-192 = "크, 으으윽……!"
70013030-193 = "죄, 죄송했습니다! 다시는 하루카 님 앞에 얼씬도 하지 않겠습니다!!"
70013030-194 = "아, 앞으로 정말 깊이 반성하면서 살겠습니다……!!"
70013030-196 = "아…… 아아……."
70013030-197 = "후후후, 봤지? 이게 우리의 힘이야."
70013030-198 = "이, 이런 일을 그냥 해주실 리가 없는데……."
70013030-199 = "제, 제가 여러분에게 뭘 해드리면 될까요?!"
70013030-200 = "도, 돈을 원하시나요? 하, 하지만 지금은……!"
70013030-201 = "보수 따윈 필요 없어. 그건 하드보일드하지 않거든."
70013030-202 = "하드……보일드?"
70013030-203 = "그래. 일일일악을 행하는 비정하고 냉혹한 하드보일드 무법자. 그것이 우리의 모토."
70013030-204 = "널 도와준 것도 그런 모토의 일환이었을 뿐. 보수를 바라고 한 건 아니었으니까."
70013030-205 = "그러니까…… 일어나."
70013030-206 = "이제 넌 자유야!"
70013030-207 = "……!!"
70013030-209 = "그때는 그저…… 도움을 받는 것밖에 하지 못했어요."
70013030-210 = "그래서 아루 님에게 제 모든 걸 바치기로 결심했는데……."
70013030-211 = "아루 님을 위해서라면…… 뭐든 하겠다고 다짐했는데……."
70013030-216 = "그래! 지금이 바로 그때야!"
70013030-217 = "뭐든 해보자고! 우리가 아루 쨩과 카요코 쨩을 구하는 거야!"
70013030-221 = "……."
70013030-222 = "……그러네요."
70013030-223 = "제가 구해드릴게요, 아루 님."
70013030-224 = "그때 아루 님이…… 저를 구해주셨던 것처럼……!"
