[translation]
90002170-1 = "제17화;인간의 대답, 인간의 대답"
90002170-3 = "[ns] \"그것은, 대답이 될 수 없어.\""
90002170-4 = "……무슨 뜻인가, 선생이여."
90002170-5 = "[s] \"인간의 대답이 될 수는 있겠지만, 신의 대답이 될 수는 없어.\""
90002170-9 = "[ns] \"그것은, 자기증명이 아니야.\""
90002170-10 = "……!"
90002170-11 = "[ns] \"슬픔을 우리에게서 가져가려 할 필요는 없어.\""
90002170-13 = "[ns1] \"일어난 일은 일어난 일이고.\"\n[ns2] \"그걸 되돌이킬 방법 같은 건 없으니까.\""
90002170-16 = "이제부터는 다르다. 내가 그것을 바로잡을 것이다."
90002170-17 = "[s] \"그래도 안 돼. 그렇게 할 수 없어.\""
90002170-18 = "어째서 그렇게 생각하지?"
90002170-19 = "[s3] \"왜냐하면, 그 모든 것이 나니까.\"\n[s4] \"……[ruby=죄]슬픔[/ruby] 없이 타인을 이해할 방법은, 존재하지 않으니까.\""
90002170-22 = "……!"
90002170-23 = "[ns5] \"무엇보다 내가 그렇게 도망쳐 버린다면.\"\n[ns6] \"내 학생들을 볼 낯이 없어지고 말잖아?\""
90002170-28 = "……!"
90002170-29 = "그런가……. 그런, 건가……"
90002170-30 = "……."
90002170-31 = "……에헤헤."
90002170-32 = "부럽, 네요."
90002170-33 = "네……? 뭐가요?"
90002170-34 = "여, 여러분의 선생님이, 저런 분이라는 게, 말이에요. 에헤헤."
90002170-35 = "……후후. 여기에서 조금만 정정하도록 할까요."
90002170-36 = "어라, 뭔가요. 그건?"
90002170-41 = "'우리들'의 선생님이에요."
90002170-42 = "네. 이제부터는 말이죠."
90002170-43 = "……!"
90002170-45 = "……여기에서도 끝내 학생인 것인가. 실로 어리석구나. 선생이여."
90002170-46 = "[s] \"그럴지도 모르지.\""
90002170-47 = "그대라면 좀 더 나은 선택을 할 것이라고 여겼다."
90002170-48 = "[s] \"나는 처음부터 아무것도 아닌 사람이었어.\""
90002170-49 = "누구도 그대를 탓하지 않는다. 여기에 있는 것은 나와 그대뿐이다."
90002170-50 = "단 한 번 스스로의 마음에서 눈을 돌린다고 해도, 그것을 지켜볼 자는 아무도 없다."
90002170-54 = "[ns] \"그렇게 생각할 수도 있겠지.\""
90002170-56 = "그렇지만 선생님. 아리스는 선생님의 동료입니다. 마찬가지로 선생님도 아리스의 동료이고요."
90002170-58 = "선생님이 학생을 돕는 것이 당연하다면, 학생이 선생님을 돕고 싶어 하는 것도 당연한 일이니까."
90002170-60 = "여기에서는 모모이와 미도리를 최대한 믿어야 한다고 생각합니다."
90002170-62 = "그러니 분명 앞으로도 그 사이에서 이랬다저랬다 하며, 여기저기 있는 대로 부딪힌 끝에……."
90002170-63 = "우리는, 결국 길을 찾게 될 겁니다."
90002170-77 = "[ns] \"그렇지만 역시 안 돼.\""
90002170-79 = "[ns7] \"선생이 선생으로 있지 못하면.\"\n[ns8] \"학생들 역시 학생으로 있을 수 없을 테니까.\""
90002170-82 = "누구 하나 지켜보는 자가 없다고 해도?"
90002170-85 = "[ns9] \"……그래.\"\n[ns10] \"내가 나를 속일 수는, 없는 일이니까.\""
90002170-90 = "……."
90002170-91 = "그러한가."
90002170-92 = "신으로 설 자로서, 나는 그대의 선택을 존중한다."
90002170-93 = "그러나 그대의 선택을 존중하는 것과, 그대를 내버려두는 것은 다른 이야기다."
90002170-94 = "그렇다면 돌아가라. 그대의 학생들에게. 그대의 의지로. 그대의 오래된 세계를 향해."
90002170-98 = "[ns] \"……?\""
90002170-99 = "모든 것을 허용한다."
90002170-100 = "싯딤의 상자도, 어른의 카드도. 그리고 그대의 학생들이 가진 모든 힘도."
90002170-101 = "그러나 이것만은 이야기해 두겠다."
90002170-102 = "그대와 그대의 학생들이 진심으로 나에게 거역하고자 한다면, 그대들에게 돌아갈 것은 완전한 절멸밖에는 없을 것이다."
90002170-103 = "이것은 곧 나의 말이니, 그 자리에서 듣고 있는 너희들 역시 마찬가지다."
90002170-104 = "이는 나의 분노이자 경고이니, 귀 있는 자는 들을지어다."
90002170-111 = "으엑?! 지, 진작에 들키고 있었나……!"
90002170-112 = "언니, 그런 것보다……. 어어?"
90002170-113 = "모두! 선생님이 내려오고 있어요!"
90002170-116 = "(몸이 떠오른 채 천천히 허공에서 지상으로 내려가고 있었다.)"
90002170-117 = "(보기에 따라서는 신의 권능, 자비, 은혜…… 같은 것이라고도 볼 수 있는 현상이었겠지만.)"
90002170-118 = "(우리를 기다리고 있는 것은, 결코 그런 것이 아닐 터였다.)"
90002170-122 = "선생님!"
90002170-123 = "선생님, 괜찮으십니까?"
90002170-124 = "[s] \"나는 괜찮아! 그것보다 지금…….\""
90002170-129 = "어……."
90002170-130 = "으에……."
90002170-131 = "아, 안녕……. 하세요. 또…… 뵙네요."
90002170-132 = "[USERNAME] 선생님."
90002170-133 = "[s] \"……그래. 다들 잘 지냈지? 금방 다시 만났네.\""
90002170-134 = "으, 응……."
90002170-135 = "그보다 이제부터…… 괜찮은 건가요? 선생님도, 다른 여러분도……."
90002170-136 = "[s] \"그러게. 그 이야기부터 해야겠네.\""
90002170-138 = "(빠르게, 아이들에게 모든 상황을 설명했다.)"
90002170-140 = "……그렇게 된 거구나. 그렇다면……."
90002170-141 = "이해했습니다. 못미덥지만 용기만은 잃지 않는 모모이의 표현을 빌리자면."
90002170-142 = "최종 보스인 마왕과, 정말로 싸워야 할 순간이 온 것이로군요."
90002170-147 = "히, 히이이……. 차라리 이 상황이 게임이었다면, 어떻게든 해 볼 텐데……."
90002170-148 = "여기까지 온 이상, 돌아갈 길은 어차피 없었다고 봐야겠죠."
90002170-149 = "괜찮아, 선생님. 사실 어느 정도는 우리도 알고 있었으니까."
90002170-150 = "응? 어떻게 알았느냐고? 그건–"
90002170-151 = "자, 잠깐만! 그건 아직 함부로 이야기하지 않는 게 좋지 않을까……?"
90002170-152 = "어째서?"
90002170-156 = "이거 인간들의 표현대로라면, 그, '도청'이었나 그런 일에 해당되는 거 아냐……?"
90002170-157 = "그게 왜? 어차피 선생님의 샬레 오피스에 상습적으로 도청을 시도하는 선배도 있는걸."
90002170-163 = "……그 동네, 괜찮은 거 맞죠? 여러 가지 의미로요."
90002170-165 = "저, 저희는 어떻게 하면 좋죠……?"
90002170-166 = "[s] \"너희들은 쉬고 있어도 괜찮아.\""
90002170-167 = "그, 그렇지만……."
90002170-168 = "그래요. 당신들은 입장이 애매한 상황이기도 하고요."
90002170-169 = "만에 하나 우리를 돕고 싶다면, 다음을 기대하도록 하죠."
90002170-173 = "……미안해요. 지금 한 말, 취소해야 할 것 같네요."
90002170-174 = "네, 네에……? 어, 어째서요……?"
90002170-175 = "당신들은 일단, 잠시만이라도 몸을 숨기는 게 좋아 보이니까요."
90002170-176 = "뭐……?"
90002170-178 = "지금 막 그 잘나신 '신'께서, 직접 이 하계로 강림하셨거든요."
90002170-186 = "으, 으아아……!"
90002170-190 = "자. 어서."
90002170-191 = "아, 알겠어요……!"
90002170-196 = "선생님. 아리스는 준비됐습니다."
90002170-197 = "괜찮습니다. 미안하다고 하지 말아 주세요."
90002170-198 = "어떻게 보면 아리스는…… 이 순간, 이렇게 하기 위해 다시 이름을 받은 것인지도 모르겠으니까요."
90002170-202 = "부탁드리겠습니다. 선생님! 하는 김에, 기운 넘치게요!"
90002170-204 = "네, 선생님! 저희도 최선을 다할게요!"
90002170-205 = "싯딤의 상자 프로세스 최적화 완료. 무엇이든 지시를 부탁드립니다."
90002170-208 = "[ns] \"그래. 해 보자!\""
90002170-218 = "네!!!"
90002170-220 = "다음화;너를 위한 이야기"
