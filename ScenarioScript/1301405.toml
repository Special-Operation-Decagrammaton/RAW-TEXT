[translation]
1301405-1 = "수영복과 캠프파이어"
1301405-3 = "(약속 시간에 맞춰 렌게가 기다리는 해변으로 나갔다.)"
1301405-8 = "오, 스승님. 어서 와."
1301405-9 = "그럼 바로 캠프파이어를 시작하자."
1301405-13 = "응? 장작이 안 보인다고?"
1301405-14 = "당연하지. 이건 수련이라고. 장작을 쌓는 것부터 캠프파이어의 시작인 거야."
1301405-18 = "자, 같이 저쪽에 있는 장작을 쌓자!"
1301405-19 = "[s] \"으, 응! 땀을 흘려야 청춘이지!\""
1301405-20 = "오, 역시 스승님! 잘 알고 있잖아?"
1301405-21 = "그런 의미에서 조금 특별한 모양으로 장작을 쌓을 거야."
1301405-22 = "그쪽이 기억에도 오래 남을 테니까."
1301405-23 = "[s] \"특별한 모양이라……. 생각해 둔 거라도 있어?\""
1301405-24 = "물론이지. 설계도도 그려왔다고."
1301405-25 = "그럼 시작하자! 우리의 청춘을 위해!"
1301405-26 = "[s] \"처, 청춘을 위해……!\""
1301405-32 = "(의욕적인 렌게를 따라 열심히 캠프파이어 장작을 쌓았다.)"
1301405-34 = "(그렇게 잠시 후…….)"
1301405-38 = "좋았, 어…… 용 완성이다!"
1301405-43 = "원래 생각했던 것보다 더 크게 쌓여버렸네."
1301405-44 = "후후, 스승님과 같이 있으니까 나도 모르게 더 힘을 내버린 걸지도……."
1301405-45 = "[s] \"이거…… 왠지 불붙이기 아깝지 않아?\""
1301405-46 = "아니야. 캠프파이어에 불이 없으면 무슨 의미가 있겠어."
1301405-47 = "불을 지켜보는 것도 묘미지."
1301405-48 = "[s] \"착화제가 좀 많은 것 같기도 하고…….\""
1301405-50 = "[ns] \"……뭐, 상관없겠지.\""
1301405-51 = "그럼 같이 불을 붙이는 거다?"
1301405-57 = "하나, 둘, 셋……!"
1301405-63 = "[log](……우리는 그 순간까지 알지 못했다.)[/log]"
1301405-67 = "[log](분노에 찬 용이, 무엇이든)[/log]"
1301405-68 = "[log](태울 기세로 불꽃을 내뿜을 거라는 걸…….)[/log]"
1301405-74 = "[ns] \"이, 이건 큰일일지도…….\""
1301405-75 = "새, 생각한 것보다 큰데?!"
1301405-82 = "뭐, 뭐야 저거?!"
1301405-83 = "앗 뜨거~! 위험해!"
1301405-88 = "이건…… 큰일일지도."
1301405-89 = "[s] \"너, 너무 타올랐어……!\""
1301405-93 = "빨리 불을 끄자!"
1301405-105 = "[ns] \"불이 꺼지기는커녕, 타오르고 있어!?\""
1301405-108 = "여, 역시 용의 불꽃…… 하지만 질 순 없지!"
1301405-112 = "자…… 승부다!"
1301405-116 = "반드시 꺼트리겠어!"
1301405-132 = "(……이후 렌게와 어떻게든 장작의 불을 껐다.)"
1301405-136 = "(예상보다 너무나도 강렬했던 캠프파이어였다…….)"
1301405-140 = "휴우우, 이제 불길이 잡혔네."
1301405-141 = "……깜짝 놀랐어. 다음부터는 조심할게."
1301405-142 = "[s] \"불도 제대로 껐고, 청춘의 교훈……이라는 걸로!\""
1301405-146 = "응? 잠깐만. 스승님 그 얼굴……."
1301405-147 = "……풋."
1301405-148 = "푸, 후후후훗……! 검댕 때문에 얼굴이 판다가 됐잖아?"
1301405-149 = "이쪽으로 와. 내가 지워줄게."
1301405-150 = "[s] \"부, 부탁해.\""
1301405-156 = "얼굴이 새까매……"
1301405-157 = "잠깐 눈 감고 있어봐."
1301405-167 = "……"
1301405-168 = "(……이렇게 가까이서, 스승님의 얼굴을 본 적이 있던가?)"
1301405-169 = "(스승님이 눈앞에…….)"
1301405-170 = "(……이, 이것도 청춘?)"
1301405-171 = "[s] \"렌게? 갑자기 왜 멈추는 거야?\""
1301405-175 = "아, 아무것도 아니야! 내가 참 무슨 생각을 하는 거람……."
1301405-176 = "아무튼 어서 다시 눈 감아! 눈 주변을 닦아야 하니까!"
1301405-178 = "(렌게는 당황한 듯한 모습으로, 내 얼굴의 검댕을 지워주었다.)"
1301405-182 = "(이 순간이야말로 청춘……일지도 모른다)"
