[translation]
1006105-1 = "내부 회랑 산책"
1006105-2 = "(사쿠라코의 안내를 받아 대성당의 내부 회랑으로 향했다.)"
1006105-3 = "(아주 늦은 시간이었기에 불도 모두 꺼져 있었고, 인기척도 전혀 느껴지지 않았다.)"
1006105-4 = "오셨군요, 선생님."
1006105-5 = "쭉, 기다리고 있었답니다."
1006105-10 = "이렇게 늦은 시간인데도 부름에 응해 주시다니……."
1006105-11 = "감사하고, 동시에 죄송할 따름입니다."
1006105-12 = "굳이 이런 시간, 이런 곳으로 부탁드린 이유는, 다른 사람들이 없는 곳이 필요했기 때문이지요."
1006105-13 = "……그렇습니다. 이것은 저의 지극히 개인적인 용무."
1006105-14 = "즉, 제 고백의 장소가 되겠군요."
1006105-15 = "평상시에는 늘 다른 분들의 비밀을 들어 드리고, 또 함께 기도해 드리는 게 저의 일입니다만."
1006105-16 = "오늘만큼은, 지금만큼은……."
1006105-22 = "선생님께서 저의 비밀을, 들어주셨으면 합니다."
1006105-23 = "[s1] \"비밀이라니? 무슨 일 있어?\"\n[s2] \"고백이라니? 무슨 일 있어?\""
1006105-26 = "후후. 그렇지 않다고도, 그렇다고도 할 수 있는 이야기겠네요."
1006105-27 = "그리고 어쩌면, 사실 선생님이라면, 어느 정도 예상하고 계시는 일일 수도 있습니다."
1006105-28 = "하지만……. 사실 지금도 꽤 망설이고 있답니다."
1006105-29 = "선생님께 폐가 되지는 않도록 하겠지만, 어쩌면 선생님께 또 하나의 근심거리를 얹어드릴 수도 있는 일이니까요."
1006105-30 = "언급하는 것 자체만으로도……. 말이죠."
1006105-34 = "지금이라도 괜찮습니다. 선생님, 원치 않으신다면 돌아서서 샬레로 돌아가셔도 좋아요."
1006105-35 = "저는 전혀 그것에 대해 실망하거나, 서운해하지 않을 것을 맹세하겠습니다."
1006105-36 = "[s3] \"선생으로서 그럴 수 없어.\"\n[s4] \"오히려 더 궁금해지는걸.\""
1006105-39 = "후후. 그렇습니까. 역시……."
1006105-40 = "왠지 그러실 것 같아서, 나름대로 용기를 내어 본 것이었는데……. 다행이군요."
1006105-41 = "그럼 우선……."
1006105-45 = "바람도 쐴 겸 잠시, 함께 걸으실까요?"
1006105-52 = "실은 저도 그렇고, 저희 시스터후드도 그렇고……."
1006105-53 = "세간에는 말하기 어려운 것들을 알고 있는 것은 사실입니다. 때때로 그에 대응하기도 하죠."
1006105-54 = "네. 어느 정도는 사실이랍니다."
1006105-55 = "시스터후드 정도 되는 규모와 역사를 가진 곳이라면 으레 비밀이 있게 마련이니까요."
1006105-56 = "결국, 그것은 필연적인 일."
1006105-57 = "물론 이 이야기는 다른 자매님들도 대부분 모르시는 이야기. 혹은 경전의 공부 같은 느낌으로만 알고 계시는 일들이죠."
1006105-58 = "그것이 어느 방향, 어떤 형태로든……. 혹은 어떤 이유로든, 다른 분들께 말씀드리기 어려운 것도 많고요."
1006105-59 = "그리고 아무리 선생님이라 할지라도."
1006105-60 = "죄송하게도, 그 내용들에 관해서는 말씀드릴 수 없답니다. 제 고민의 방향 또한 그 부분."
1006105-65 = "으음. 역시……."
1006105-66 = "비밀이 있다고 말씀드려 놓고, 정작 그 비밀들에 대해서는 말씀드리지 않는 것이 죄송스럽기 그지없습니다만."
1006105-67 = "[s5] \"중요한 건 그게 아니니까.\"\n[s6] \"내가 관심 있는 건 사쿠라코의 이야기야.\""
1006105-70 = "선생님……."
1006105-71 = "……후후."
1006105-72 = "이런. 벌써 대답을 다 들어버린 것 같은 느낌이네요."
1006105-73 = "……네."
1006105-79 = "실은 그게……. 오늘의 목적이었거든요."
1006105-82 = "[wa:1480]― 선생님께는 [wa:2200]가급적"
1006105-84 = "― 숨기고 [wa:400]싶지 않았습니다만……."
1006105-87 = "― 제 입장상,"
1006105-89 = "― 모든 걸 밝히기는 [wa:1200]어렵고……."
1006105-92 = "[wa:1400]― 그래도"
1006105-94 = "― 저에게 [wa:500]'비밀이 있다는 사실'[wa:1700]만이라도"
1006105-97 = "― 전할 수 있어서 [wa:2250]다행입니다."
1006105-100 = "[wa:1280]― 이해해 주실 거라고는"
1006105-102 = "[wa:50]― 생각하지 않습니다."
1006105-105 = "― 그것을 바라는 일도……"
1006105-108 = "― 그럼에도, [wa:1650]제 본모습을"
1006105-110 = "― 보여드리고픈 마음이…… [wa:1960]있답니다."
1006105-113 = "[wa:1050]― 그……."
1006105-116 = "― 그런 저라도 괜찮을지……."
1006105-118 = "― 불안함이 [wa:700]있었는데……."
1006105-121 = "[wa:1400]― 생각보다 빨리,"
1006105-123 = "[wa:200]― 대답을 받아버렸군요."
1006105-126 = "― 진심으로……. [wa:2050]감사드립니다, [wa:1600]선생님."
1006105-129 = "선생님을 위해 올리는 기도 또한, 전보다 더 진솔할 수 있을 거 같아 기쁩니다."
1006105-130 = "선생님께서 하시는 모든 일과 그 앞날에, 항상 기쁨과 행운이 함께하시기를."
1006105-131 = "한결 더 가볍고 진실된 마음으로, 진심을 담아."
1006105-135 = "기도하겠습니다. 깨어 있는 매시간, 매 순간."
1006105-136 = "……선생님을 위해서."
1006105-138 = "(이후 사쿠라코와 성당 주변을 좀 더 돌며 잡담을 나눈 후, 샬레로 돌아왔다.)"
