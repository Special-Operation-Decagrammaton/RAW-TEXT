[translation]
10019060-6 = "자, 이걸로 5개의 성소 공략이 모두 성공했어!"
10019060-7 = "이제 남은 건 하나뿐이야. D.U. 중앙의 제6 성소!!"
10019060-8 = "좋습니다. 그럼 모든 <샬레>의 전력을 제6 성소로 집중하겠습니다!"
10019060-9 = "저 성소만 파괴하면 지금 이 사태는 모두 해결될 수 있습니다!!"
10019060-10 = "최후의 싸움을 준비하시죠……!!"
10019060-16 = "자, 잠깐만요……!! D.U. 시라토리구에서 강력한 에너지가 포착되었어요……!!"
10019060-27 = "이, 이건……."
10019060-28 = "……!? 마침내 제6 성소의 <수호자>가 나타난 건가요……?"
10019060-29 = "어……? 리, 린 선배! 잠깐만…… 이쪽도 큰일 났는데?"
10019060-30 = "파괴된 성소가 있던 좌표에서 다시 고위급 에너지 반응이 나타나기 시작했어……!!"
10019060-32 = "!!"
10019060-37 = "파괴되었던 모든 성소가……."
10019060-47 = "……성소가 다시 나타났어……?"
10019060-48 = "……큭."
10019060-49 = "이…… 이건……"
10019060-50 = "지금까지의 공격이 아무 소용없었던 건가요……?"
10019060-54 = "아뇨, 그건 아니에요."
10019060-61 = "성소가 부활하면서 제6 성소에 있던 에너지가 소멸했어요. 즉, 이것은 제6 성소가 다른 성소들의 백업 시스템이었다는 뜻이겠죠."
10019060-62 = "이제 제6 성소는 무방비 상태가 되었어요. 제6 성소의 <수호자>가 이 타이밍에 등장한 것이 그 증거예요!"
10019060-63 = "……그럼 방법은 간단하군요."
10019060-64 = "부활한 다섯 개의 성소…… 그리고 제6 성소의 공략을 다시 이어 나갑니다!!"
10019060-65 = "선생님, 다시 한번 지휘를 부탁드립니다!"
