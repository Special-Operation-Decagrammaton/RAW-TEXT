[translation]
901010600450-6 = ""
901010600450-7 = "我整理了在鐘崎港正門負責警備業務的「卡爾帕喬家族」的情報……"
901010600450-8 = "卡爾帕喬家族在這附近引發過各種事件，是個惡名昭彰的組織。"
901010600450-9 = "就像我們以前交手過一次的里沃利塔家族一樣……#n他們是個憑藉嚴密的階級制度，染指各種非法勾當的組織。"
901010600450-10 = "話雖如此，本質上其實和規模較大的太妹集團沒什麼不同。"
901010600450-11 = "不過，在這附近活動[ruby=組織成員們]的家族，[/ruby]似乎只是老老實實地以警備工作謀生而已。"
901010600450-12 = "不是說他們有在放高利貸給別人？那樣不是違法的嗎？"
901010600450-13 = ""
901010600450-15 = ""
901010600450-16 = "我確認過了，實際上好像並沒有超過聯邦學生會制定的利率上限。#n雖然有很多可疑的部分，但至少算是合法的。"
901010600450-17 = "問題在於討債的方式……"
901010600450-18 = ""
901010600450-20 = ""
901010600450-21 = ""
901010600450-22 = "有傳聞指出……#n這附近向卡爾帕喬家族借過錢的人當中，有不少人在飽受催債的折磨後突然消失了。"
901010600450-23 = "雖然沒有聽說曾經發生過暴力行為，但似乎是在無形之中受到了施壓吧。"
901010600450-24 = "總覺得好像抓住了一點線索。"
901010600450-25 = "這一帶消失的人之所以那麼多，原因恐怕是……"
901010600450-26 = ""
901010600450-28 = ""
901010600450-29 = ""
901010600450-32 = ""
901010600450-33 = "#Q;오토기;這一帶消失的人之所以那麼多，原因恐怕是……\n[as1] 遭到怪物螃蟹的襲擊。\n[as2] 發現了與異世界相連的大門。\n[as3] 無法償還卡爾帕喬家族的債務。"
901010600450-34 = ""
901010600450-36 = ""
901010600450-37 = "關於怪物螃蟹的事，剛才好像連一句都沒提到吧。"
901010600450-38 = "老師，你有認真在聽嗎？"
901010600450-39 = "再想一想吧。"
901010600450-40 = ""
901010600450-42 = ""
901010600450-43 = ""
901010600450-47 = "啊，我以前看過那種設定的漫畫。"
901010600450-48 = "就是只要穿過通往異世界的大門就能轉生的──"
901010600450-49 = ""
901010600450-51 = ""
901010600450-52 = "不是啦！現在不是說這個的時候吧！？"
901010600450-53 = ""
901010600450-55 = ""
901010600450-57 = ""
901010600450-58 = ""
901010600450-62 = "……確實有道理。"
901010600450-63 = "卡爾帕喬家族在港口周邊，用高額利息借錢給手頭拮据的人，並進行債務催討。#n會因此出現無法承擔而逃跑的人也是情有可原。"
901010600450-64 = "實際上，鐘崎港一帶的人們開始失蹤的時間點，#n似乎與卡爾帕喬家族正式投入金融業的時期相差不遠。"
901010600450-65 = "也難怪有句話說「人心比鬼怪更可怕」啊。"
