[translation]
901010600450-6 = ""
901010600450-7 = "ต่อไปฉันจะสรุปเกี่ยวกับการ์ปัชโช่ แฟมิลี่ ผู้รับหน้าที่รักษาความปลอดภัยตรงประตูหน้าท่าเรือ#nคาเนะซากิ..."
901010600450-8 = "แต่การ์ปัชโช่ แฟมิลี่เป็นแก๊งอันธพาลที่มีชื่อเสียงในทางเสียหาย เพราะก่อคดีและเหตุวุ่นวายสารพัด#nในละแวกนี้ "
901010600450-9 = "แก๊งอันธพาลนี้อาศัยโครงสร้างลำดับชั้นอันเข้มงวด แล้วเข้าไปพัวพันกับงานสกปรกทุกชนิด เหมือนกับริโบลลิต้า แฟมิลี่ที่พวกเราเคยรับมือมาเมื่อก่อน"
901010600450-10 = "ถึงจะใช้ชื่อหรูหราแบบนั้น แต่ก็ไม่ต่างจากกลุ่มแยงกี้สาวขนาดใหญ่หรอก"
901010600450-11 = "แต่ดูเหมือนว่า[ruby=สมาชิก]แฟมิลี่[/ruby]ที่ทำงานอยู่แถวนี้จะหารายได้จากการรับงานรักษาความปลอดภัยอย่างสุจริตนะ"
901010600450-12 = "แต่ได้ข่าวว่าปล่อยเงินกู้ดอกเบี้ยแพงๆ ด้วยนี่นา? แบบนั้นไม่ผิดกฎหมายเหรอ?"
901010600450-13 = ""
901010600450-15 = ""
901010600450-16 = "ฉันตรวจสอบแล้ว ดูเหมือนว่าจะไม่ได้เกินเพดานอัตราดอกเบี้ยที่องค์การนักเรียนกำหนด ถึงจะมีหลายจุดที่น่ากังขา แต่ก็ยังถือว่าถูกกฎหมายอยู่ดี"
901010600450-17 = "ปัญหาอยู่ที่วิธีการทวงหนี้นี่แหละ..."
901010600450-18 = ""
901010600450-20 = ""
901010600450-21 = ""
901010600450-22 = "มีข่าวลือว่ามีหลายคนในละแวกนี้ที่กู้เงินจากการ์ปัชโช่ แฟมิลี่ แล้วก็ถูกตามทวงหนี้#nจนจู่ๆ ก็หายตัวไปเลย"
901010600450-23 = "ถึงจะไม่เคยได้ยินว่ามีการใช้ความรุนแรง แต่ดูเหมือนว่าพวกเขาจะถูกกดดันทั้งแบบเปิดเผยและลับๆ"
901010600450-24 = "ชักจะเริ่มมองเห็นเบาะแสแล้วสิ "
901010600450-25 = "สาเหตุที่มีคนหายตัวไปมากมายในละแวกนี้ อาจเป็นเพราะ..."
901010600450-26 = ""
901010600450-28 = ""
901010600450-29 = ""
901010600450-32 = ""
901010600450-33 = "#Q;오토기;สาเหตุที่มีคนหายตัวไปมากมายในละแวกนี้ อาจเป็นเพราะ...\n[as1] ถูกปูปีศาจโจมตี\n[as2] พบประตูที่เชื่อมไปยังอีกโลกหนึ่ง\n[as3] ใช้หนี้ของการ์ปัชโช่ แฟมิลี่ไม่ไหว"
901010600450-34 = ""
901010600450-36 = ""
901010600450-37 = "เมื่อกี้เราไม่ได้พูดเรื่องปูปีศาจสักคำเลยนะ"
901010600450-38 = "คุณครู เมื่อกี้ตั้งใจฟังจริงๆ หรือเปล่า?"
901010600450-39 = "ลองคิดใหม่อีกทีนะ"
901010600450-40 = ""
901010600450-42 = ""
901010600450-43 = ""
901010600450-47 = "อ๊ะ ฉันเคยอ่านการ์ตูนที่มีพล็อตแบบนั้นมาก่อน"
901010600450-48 = "พล็อตที่ว่าถ้าผ่านประตูไปต่างโลก ก็จะได้เกิดใหม่..."
901010600450-49 = ""
901010600450-51 = ""
901010600450-52 = "ไม่สิ ตอนนี้มันใช่เวลามาพูดเรื่องนั้นที่ไหนกันล่ะ?!"
901010600450-53 = ""
901010600450-55 = ""
901010600450-57 = ""
901010600450-58 = ""
901010600450-62 = "ก็มีเหตุผลอยู่ค่ะ..."
901010600450-63 = "การ์ปัชโช่ แฟมิลี่ปล่อยเงินกู้ดอกเบี้ยสูงให้คนแถวท่าเรือที่ไม่มีเงิน และคอยทวงหนี้ งั้นก็ย่อมเป็นไปได้ว่าจะมีลูกหนี้ที่ทนไม่ไหวจนหนีไป"
901010600450-64 = "อันที่จริง ช่วงเวลาที่ผู้คนแถวท่าเรือคาเนะซากิเริ่มหายตัวไป ก็ตรงกับช่วงที่การ์ปัชโช่ แฟมิลี่ เริ่มทำธุรกิจการเงินอย่างจริงจังเลยด้วย"
901010600450-65 = "อย่างนี้สินะ ถึงได้พูดกันว่าคนน่ากลัวกว่าผีน่ะ"
