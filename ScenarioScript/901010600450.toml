[translation]
901010600450-6 = ""
901010600450-7 = "To summarize what we know about the Carpaccio Family, who are in charge of security at Kanesaki Port's main entrance..."
901010600450-8 = "The Carpaccio Family is a notorious gang, known for dominating and terrorizing the area. "
901010600450-9 = "Their organization engages in an array of illicit activities. They're managed with a strict hierarchical structure, much like the Ribollita Family we dealt with a while back."
901010600450-10 = "Hmm. No matter what they call themselves or how big they are, they're just a bunch of thugs."
901010600450-11 = "The \"family\" members I've encountered seem to be making an honest living doing security work."
901010600450-12 = "But aren't they lending money with exorbitant interest rates? Isn't that illegal?"
901010600450-13 = ""
901010600450-15 = ""
901010600450-16 = "I looked into that. It doesn't surpass the interest rate limit set by the General Student Council. While it feels fishy, it's technically legal."
901010600450-17 = "The real problem is in their collections department..."
901010600450-18 = ""
901010600450-20 = ""
901010600450-21 = ""
901010600450-22 = "There are several stories about how debtors suddenly vanished after the Carpaccio Family pressured them to pay back their money."
901010600450-23 = "I didn't hear anything about specific acts of violence, but I suppose most of the threats were done in secret."
901010600450-24 = "It feels like we're getting somewhere. "
901010600450-25 = "The reason so many people disappeared in this area is because..."
901010600450-26 = ""
901010600450-28 = ""
901010600450-29 = ""
901010600450-32 = ""
901010600450-33 = "#Q;오토기;The reason so many people disappeared in this area is because...\n[as1] \"They were attacked by monster crabs.\"\n[as2] \"They found a gate to another world.\"\n[as3] \"They couldn't repay their debts to the Carpaccio Family.\""
901010600450-34 = ""
901010600450-36 = ""
901010600450-37 = "When did we say there were \"monster crabs\"?"
901010600450-38 = "Sensei, were you even listening?"
901010600450-39 = "Think harder."
901010600450-40 = ""
901010600450-42 = ""
901010600450-43 = ""
901010600450-47 = "Ah, I read a manga like that."
901010600450-48 = "Something about reincarnating when you walk through a door to another world..."
901010600450-49 = ""
901010600450-51 = ""
901010600450-52 = "Wait, how is this remotely related to what we were talking about?!"
901010600450-53 = ""
901010600450-55 = ""
901010600450-57 = ""
901010600450-58 = ""
901010600450-62 = "...You have a point."
901010600450-63 = "The Carpaccio Family lent money with high interest rates to people working at the port, then they shook them down for repayment. Running away from them makes sense."
901010600450-64 = "With regards to the timeline, people only started going missing in Kanesaki Port after the Carpaccio Family started providing loan services."
901010600450-65 = "There's a reason why people say humans are scarier than ghosts."
