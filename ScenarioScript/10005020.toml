[translation]
10005020-1 = "제2화;사고방식이 다릅니다"
10005020-2 = "(30여 분 후.)"
10005020-9 = "……윽!?"
10005020-10 = "으윽!?"
10005020-15 = "……클리어."
10005020-16 = "이쪽도 클리어했습니다. 순탄하네요."
10005020-21 = "……뭐야……."
10005020-22 = "진짜 이게 끝? ……이게 전부란 말이야?"
10005020-23 = "이게 전부냐니? 선배. 여기 들어오기 전에도 벌써 몇명 더 기절시켰잖아."
10005020-24 = "남는 힘을 주체하지 못해 아직도 욕구불만인 상태로군요, 우리 부장님은."
10005020-25 = "하……."
10005020-26 = "대체 뭐가 이렇게 쉬운 거야……?"
10005020-27 = "가드라는 녀석들도 하나같이 얼빠져서는……."
10005020-29 = "작전이 수월하게 진행되는 건 우리에게 좋은 일이다. 왜 기분 나빠 하는 거지?"
10005020-30 = "그 이전에 위장한 복장의 상태도 좀……."
10005020-31 = "어이. 스카잔에 대해 이야기할 거면 그만해라. 벌써 두 번이나 이야기했다."
10005020-32 = "이건 안 돼. 이것만큼은 절대로 양보할 수 없다고. 알겠어?"
10005020-33 = "흥. 그리고 좋긴 뭐가 좋아? 도망친 꼬맹이 잡으러 남의 집에 숨어든 꼴인데……."
10005020-34 = "아……. 갑갑하네, 진짜. 이제라도 그냥 다 밀어버리면 안 돼?"
10005020-35 = "얘네 다 해도 별로 안 셀 거 같은데?"
10005020-36 = "[s1] \"응. 당연히 안 되지. 참아.\"\n[s2] \"참는 것도 실력이야, 네루.\""
10005020-37 = "크윽……! 선생, 또……!"
10005020-38 = "크윽……! 선생, 또……!"
10005020-39 = "……후. 알았다고. 그냥 해 본 소리야, 해 본 소리."
10005020-41 = "어이, 너네들은 지금 선생 있어서 다행인 줄 알아라. 아니었으면 진작 내 손에 그냥……."
10005020-42 = "기절한 사람들한테 그렇게 말한들 들을 수 없다."
10005020-43 = "아무튼 이왕 수월하게 확보한 공간이니까 신속하게 행동하는 게 좋겠군."
10005020-44 = "아카네, 시스템 장악 쪽은 괜찮겠어?"
10005020-46 = "후훗. 물론이죠. 이미 설치중인 걸요."
10005020-47 = "[s3] \"든든한걸. 역시 아카네야.\"\n[s4] \"빠르네. 믿음직스러워.\""
10005020-48 = "어머나……. 감사합니다, 선생님."
10005020-49 = "어머나……. 감사합니다, 선생님."
10005020-50 = "임무 도중에 선생님께 칭찬도 들을 수 있다니……. 확실히 이번 일은 여러모로 색다르네요."
10005020-52 = "하여간 백토 녀석……. 잡히기만 해봐. 펑펑 울게 만들어줄 테니까."
10005020-53 = "우리가 손 안 대도 세미나 회계가 먼저 그렇게 할 것 같지만……."
10005020-54 = "……응? 선생님? 뭐라고?"
10005020-55 = "우리가 왠지 백토를 친근하게 대하는 것 같다고?"
10005020-56 = "뭐, 그야 그렇지."
10005020-57 = "사실 녀석은 그저 골치가 아픈 녀석일 뿐, 천성이 악하거나 위험한 녀석은 아니거든."
10005020-59 = "아예 백토 씨도 저희를 '선배'라고 부를 정도로 서로 자주 본 얼굴이기도 하고요."
10005020-60 = "\"네루 선배 그만 좀 쫓아오세요!\", \"네루 선배. 때리지 마세요!\""
10005020-61 = "……어이가 없어서. 그럼 사고를 치지 말았어야지."
10005020-62 = "그냥 세상 물정 모르고 생떼 쓰는 꼬맹이야. 수준도 딱 그렇고."
10005020-63 = "………?"
10005020-64 = "아. 지금 이야기한 건 백토에 관한 이야기다. 네루 선배가 아니고."
10005020-65 = "………?"
10005020-66 = "어이, 지금 뭐라고………"
10005020-67 = "자, 자. 여러분. 잡담은 거기까지~. 이제 다시 작전으로 돌아갈 시간이에요."
10005020-68 = "아카네의 시스템 장악이 끝난 모양이군. 생각보다도 훨씬 빠른걸."
10005020-69 = "후훗. 고마워요. 이제 설치도 다 끝났으니 모여 주시겠어요?"
10005020-70 = "구조상, 그쪽은 조금 위험하답니다~."
10005020-71 = "모두 이쪽으로 와 주시고……."
10005020-73 = "그럼 이쯤에서 버튼을 꾹-."
10005020-77 = "휴-! 이제 다 됐습니다. 이제 정확히 30초만 기다리시면 돼요."
10005020-78 = "………?"
10005020-79 = "잠깐. 아카네?"
10005020-80 = "30초를 기다려? 그게 무슨 뜻이지?"
10005020-87 = "………?"
10005020-88 = "………?"
10005020-89 = "[s5] \"이 소리는……?\"\n[s6] \"아카네. 지금 설치한 게 뭐야?\""
10005020-90 = "음? 이거요? 그야 늘 사용하던 거지요."
10005020-91 = "음? 이거요? 그야 늘 사용하던 거지요."
10005020-92 = " 적당히 위장해서 들키지 않게 가져온……."
10005020-93 = "C4입니다만……?"
10005020-94 = "아아. 그렇군. C4인가. 난 또 뭐라고……."
10005020-98 = "……C4?"
10005020-99 = "아, 아카네? 왜 시스템실인 여기에 C4를……?"
10005020-100 = "……? 그야 당연히 여길 폭파하기 위해서지요?"
10005020-101 = "그, 그야 그렇겠지? 내 질문은 굳이 여기를 날려버릴 필요가 있냐는 건데……?"
10005020-102 = "……네?"
10005020-103 = "어라. 혹시 저, 뭔가 실수를 한……?"
10005020-104 = "그렇지만 여기가 없어져야 가드들이 저희를 감시할 수 없잖아요? 아닌가요……?"
10005020-105 = "그, 그 말이 틀렸다고는 안 하겠지만……! 보통 여기서는 감시 시스템을 탈취해서 역으로 이용하는 게……?"
10005020-110 = "그래서, 아카네? 앞으로 몇 초 남은 거지?"
10005020-111 = "음. 그게, 사실은……."
10005020-112 = "……."
10005020-113 = "……방금 막 0이 됐어요."
