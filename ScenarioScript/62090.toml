[translation]
62090-1 = "9화;Apocrypha"
62090-6 = "정말로, 있었네요."
62090-7 = "트리니티에서 위경이라고 단정 지은……."
62090-8 = "그러나 그들이 언제나 피해 왔고, 없던 것으로 만들려 했던 [ruby=Apocrypha]외경[/ruby]이……!"
62090-10 = "당신의 종들의 피에 대한 복수를 위해 일어서기까지 얼마나 기다려야 하나이까."
62090-11 = "언제까지 그들의 진리가 어디 있느냐며 조롱하는 질문을 들어야 하나이까."
62090-12 = "으……. 첫 문장부터 강렬하네요. <피에 대한 복수> 라니……."
62090-14 = "이는 모든 악인과 경건하지 못한 자들이 추방되는 환난의 날."
62090-15 = "택함을 받은 사람들과 의로운 사람들을 위한 말이니."
62090-16 = "어라? 외경의 내용이 여기에서 한번 끊어졌군요. 그리고 이건……?"
62090-17 = "그렇군요."
62090-18 = "외경의 내용과 나란히, 아리우스의 역사 역시 기록되어 있었네요."
62090-23 = "트리니티는 우리에게 파문을 선고하였지만, 그들은 알지 못할 것이다."
62090-24 = "우리를 파문한 것으로, 그들이 오히려 그들 자신에게 파문을 선고한 것이나 마찬가지라는 사실을."
62090-25 = "자기 안의 자매를 품지 못하는 자들이, 어찌 자기 밖의 타인을 품을 수 있을까."
62090-26 = "그들은 우리를 [ruby=니코메디아]이 땅[/ruby]으로 추방하였으나."
62090-27 = "우리는 이 자리에 아리우스의 반석을 세울 것이다."
62090-28 = "니코메디아……?"
62090-29 = "그것이, 이곳의 원래 지명이었던 것일까요?"
62090-31 = "트리니티가 가장 먼저 그 총구를 돌린 것은, 우리 아리우스였다."
62090-32 = "무기를 가진 아이는, 무엇보다도 그 힘을 시험하고 싶어 하는 법이니."
62090-33 = "이단으로 판정받은 아리우스가, 그 대상에 가장 합당했을 것이다."
62090-34 = "이건…… 우리도 자주 들었던 내용이네요."
62090-35 = "그리고…… 여기에서부터는 다시 외경이……."
62090-37 = "예언된 징표들이 나타나는 그날이 오면."
62090-38 = "지금은 보이지 않는 도시가 나타나고 숨어 있던 땅이 드러날 것이다."
62090-39 = "진리가 사람들과 더불어 드러날 것이니, 그날까지 남아 있던 사람들은 영원토록 기뻐할 것이다."
62090-40 = "이 내용은, 계시록……?"
62090-41 = "하지만 공통 경전에 기록된 계시록과는, 그 내용이 조금 다르군요."
62090-42 = "하긴, 외경이라는 단어의 뜻을 생각해 보면 당연한 것이겠지만요……."
62090-44 = "잠을 깨지 않았던 세상이 눈을 뜨고, 썩어버릴 것들은 사라질 것이다."
62090-45 = "정의로운 사람은 매우 적고, 불경스러운 사람들은 매우 많으니."
62090-46 = "너는 구원을 받는 소수로 인해 기뻐할 것이며."
62090-47 = "멸망하는 다수를 위해 슬퍼하지 않을지어다."
62090-51 = "<멸망하는 다수를 위해 슬퍼하지 않을지어다>."
62090-52 = "……."
62090-60 = "여러분? 무슨 일인가요?"
62090-62 = "네! 선배가 말씀하신 대로, 진지 구축을 완료했다는 보고를 드리려고요!"
62090-64 = "그렇군요. 수고하셨습니다."
62090-66 = "선배는 진전이 있으셨나요?"
62090-68 = "단서…… 까지는 아닐지도 모르겠습니다만, 숨겨져 있던 경전을 찾았습니다."
62090-69 = "트리니티에서도 아마 다루지 않을, 아리우스만의 경전이에요."
62090-71 = "그럼 분명 뭔가가 쓰여 있겠네요!"
62090-75 = "그보다, 선배. 그, 다들 조금씩 하는 이야기인데요……."
62090-76 = "이걸 지금 선배에게 부탁드려도 되나 싶은데."
62090-77 = "선배 말고는 특별히 부탁드리거나, 결정할 수 있는 사람도 없을 것 같기도 하고……."
62090-79 = "무슨 일인가요? 이야기해 보세요."
62090-81 = "네. 그러니까……."
62090-82 = "지금, 여기에 모인 우리 아이들 있잖아요."
62090-83 = "숫자로 치면 대충 소대…… 보다는 많고, 중대보다는 살짝 적은 정도인데……."
62090-84 = "물론 여기 말고 다른 곳에서 자기들끼리 모여 있는 애들도 있는데, 어쨌든요."
62090-85 = "슬슬 우리만의 이름을 지어야 하는 것이 아닌가, 하는 이야기가 나와서요."
62090-86 = "그, <아리우스 스쿼드> 처럼 말이죠."
62090-87 = "……정작 스쿼드 이야기가 나오니까, 기분이 좀 나빠지긴 하는데, 아무튼요."
62090-89 = "아하. 그런 이야기였군요. 그렇지만 그걸 지금 꼭……."
62090-90 = "……."
62090-91 = "아닙니다. 이름짓기는 중요하죠."
62090-93 = "네! 알아주셔서 감사해요!"
62090-94 = "혹시, 좋은 생각 있으신가요……?"
62090-99 = "……."
62090-100 = "………<니코메디아>."
62090-102 = "니코…… 메디아?"
62090-104 = "네. <니코메디아 트룹>."
62090-105 = "그걸, 지금 여기 모인 모두의 소속으로 하도록 하죠."
62090-107 = "알겠습니다!"
62090-108 = "뜻은 잘 모르겠지만, 저는 좋아요!"
62090-112 = "정말로, 괜찮을까요……? 선생님께서 직접 가자고 하실 줄은……."
62090-113 = "[s1] \"괜찮든 안 괜찮든, 가야지.\"\n[s2] \"적어도 이야기는 나눠 봐야 하니까.\""
62090-116 = "저, 선생님?"
62090-117 = "혹시, 스바루 선배가 우리를……."
62090-118 = "선생님을 끝까지 용납하지 못하겠다고 하면……."
62090-119 = "지금 이렇게, 선생님이 포르타 파시스로 가시는 것 자체가."
62090-120 = "무의미해지는 것…… 아닌가요……?"
62090-121 = "[s3] \"그래도 할 건 해야지…….\"\n[s4] \"마지막에 그 아이들이 나를 용서하지 못하겠다고 해도.\""
62090-126 = "[ns] \"아무 말도 하지 않고 끝나는 것만은, 해선 안 돼.\""
62090-127 = "그래야, 나중을 위한 여지……. 미래를 위한 씨앗을, 심어 둘 수 있는 거라고요……?"
62090-128 = "……."
62090-129 = "선생님은 역시, 대단하시네요. 저도."
62090-130 = "저도……."
62090-131 = "선생님, 처럼……. 그리고, 스바루 선배, 처럼……."
62090-132 = "괜찮은 사람이, 되고 싶어요……."
62090-133 = "물론, 스바루 선배는 저를……."
62090-134 = "……흑."
62090-139 = "그런 일을 당하고도, 아직 스바루의 편을 드는 건가……."
62090-140 = "스바루 선배라는 사람, 그런 타입이었으니까. 사람을…… 자기에게 따르도록 하지."
62090-141 = "더 질이 안 좋은 건, 자기가 그러고 있다는 자각도 없었다는 거고."
62090-142 = "……그래. 그랬지."
62090-143 = "헤, 헤헤……. 저는 그래도, 사오리 언니가 있어 줬어서, 다행이었다고, 생각해요……."
62090-144 = "응. 사오리는 좋은 리더니까."
62090-145 = "……."
62090-146 = "그래도, 스바루도 그 나름대로 최선을 다하고 있다고는 생각해."
62090-147 = "……최선을 다하는 것만으로는 모자라. 알잖아."
62090-148 = "……그렇지."
62090-149 = "[s] \"어라? 다들 무슨 일 있어? 조금 천천히 갈까?\""
62090-150 = "아니야, 선생님. 미안. 금방 따라갈게."
62090-151 = "그래. 우리가 선생의 걸음을 붙잡게 되다니, 면목 없군."
62090-152 = "무슨 일이 일어날지 알 수 없다. 서두르자."
62090-154 = "(다음 페이지는…….)"
62090-158 = "게헨나와 공존할 수 있다는 생각이야말로 오히려 이단이다."
62090-159 = "그리고 그 생각을 강요하기 위해"
62090-160 = "다른 모든 분파를 탄압하고 흡수하려는 트리니티 역시 이단이다."
62090-161 = "너희 영광되었다고 스스로 주장하는 자들아."
62090-162 = "세상의 모든 것들을 알고 있다고 자신을 내세우는 자들아."
62090-163 = "겸손은 처음부터 너희들의 덕목이 아니었으니."
62090-164 = "헛되고 헛되니 모든 것이 헛되도다."
62090-165 = "(무수히 바뀐 아리우스의 지배 계층에 대한 기록과, 트리니티와 게헨나에 대한 저주에 가까운 말들…….)"
62090-166 = "(그런 건 됐어. 충분해. 우리도 지겹도록 느껴 왔던 것들이니까."
62090-167 = "(필요한 것은 무엇을 해야 하는가, 그리고 무엇을 할 수 있는가…….)"
62090-168 = "(지금 아리우스에 나타나고 있는 천사는, 도대체 무엇인가에 관한 것인데…….)"
62090-170 = "눈은 보아도 족함이 없고 귀는 들어도 가득 차지 아니하도다."
62090-171 = "이미 있던 것이 후에 다시 있겠고."
62090-172 = "이미 한 일을 후에 다시 할지라도 해 아래에는 새것이 없나니."
62090-173 = "[log]이르되,[wa:500] 헛되고 헛되니 모든 것이 헛되도다.[/log]"
62090-176 = "(다시 경전으로 돌아왔어.)"
62090-177 = "(<헛되고 헛되니 모든 것이 헛되도다>.)"
62090-178 = "(우연이겠지만, 그 경구가 일치하고 있는데……?)"
62090-180 = "이 세상은 시체를 먹는 자이니, 그 속에서 먹힌 모든 것도 죽으리라."
62090-181 = "그러나 진리는 생명을 먹는 자이니, 진리에 의해 양육된 자는 아무도 죽지 않으리라."
62090-182 = "이르되, 천사는 다만 너희들을 나타내는 상징일 뿐이니."
62090-183 = "(가만……?)"
62090-184 = "(천사는 다만, 우리를 나타내는 상징……?)"
62090-185 = "(이건…… 지금까지 본 적 없었던 해석인데……?)"
62090-187 = "(뭐, 뭐지?!)"
62090-196 = "이 공의회의 결과를 여기에 선포하노니."
62090-197 = "아리우스에게 이제로부터 영원토록 파문을 선고하노라."
62090-198 = "거룩하신 부모와, 거룩하신 자녀와, 거룩하신 영혼의 이름으로."
62090-199 = "길은 존재하지 않았으니, 우리의 곱은 손으로 그것을 열어야 했다."
62090-200 = "빛은 우리에게서 자취를 감췄고, 우리는 썩은 쥐처럼 울부짖으며 하수를 뒤집어써야 했다."
62090-201 = "가장 높은 하늘로부터 가장 낮은 땅에 이르기까지."
62090-202 = "[ruby=트리니티]그들[/ruby]은 우리를 존재하지 않았던 것으로 만들고자 했다."
62090-203 = "많은 자들이 사라졌다."
62090-204 = "사라질 필요가 없는 자들이 사라졌다."
62090-205 = "서로를 미워할 필요가 없는 자들이 서로를 미워했다."
62090-206 = "그렇기에."
62090-207 = "헛되고 헛되니, 모든 것이 헛되도다."
62090-210 = "……?!?! 이 목소리는……?"
62090-214 = "현재는 과거라는 기반 위에 만들어진 건축물이다. 모든 과거는 현재와 무관하지 않다."
62090-215 = "공의회에서 조금 다른 결론이 내려졌다면, 해석 차이라는 [ruby=우리]이유로 아리우스[/ruby]가 추방당하지 않았다면."
62090-216 = "그랬다면, [ruby=아리우스]우리[/ruby]는 어떻게 살아가고 있었을까."
62090-217 = "아리우스는 언제나, 그런 것을 생각해야 했다."
62090-221 = "당신은, 누구……죠?"
62090-222 = "[ruby=아리우스]우리[/ruby]는 [ruby=우리]아리우스[/ruby]에 남겨졌던–"
62090-228 = "다음화;둥지"
