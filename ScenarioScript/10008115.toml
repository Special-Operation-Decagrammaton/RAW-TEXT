[translation]
10008115-7 = "(그렇게 검은거북파와의 사투 끝에 마침내.)"
10008115-8 = "크, 크윽……. 우, 우리가 패배하다니……!"
10008115-15 = "이……. 이겼다!!"
10008115-16 = "아, 아루 님! 대단해요!"
10008115-17 = "하아……."
10008115-18 = "드디어 끝났나."
10008115-25 = "앗, 여기 새전함도 찾았어~!"
10008115-26 = "[s] \"모두 수고했어.\""
10008115-27 = "응~ 선생님도 고생했어~ 그밖에 흥신소도 그렇고 다들 모두 수고수고~"
10008115-28 = "모두 고생하셨어요!"
10008115-29 = "이걸로 소동도 겨우 끝난 거네……."
10008115-33 = "……새전함……."
10008115-34 = "시로코 쨩~ 아쉬워해도 안 돼요~ 이건 돌려줘야 할 물건이니까요?"
10008115-35 = "……알고 있어."
10008115-36 = "……시로코 선배, 정말 손대면 안 되니까요?!"
10008115-38 = "그럼 사건도 마무리됐고, 우리들은 이만 돌아가 볼까?"
10008115-39 = "세리카 쨩은 마지막까지 고생해~"
10008115-40 = "선생님, 그럼 먼저 돌아가 볼게요!"
10008115-41 = "[s] \"응, 모두 잘 가.\""
10008115-47 = "자, 그럼 새전함을 제자리에 돌려놓도록 하자."
10008115-48 = "흐, 흥! 그래! 원래부터 그게 목적이었으니까! 응, 그, 그래야지!"
10008115-49 = "아루 쨩~ 이제 와서 아깝다거나 그런 건 아니지?"
10008115-50 = "후훗. 무츠키. 이 내가 그럴 리가 없잖아?"
10008115-51 = "처음 약속한 게 있다면……."
10008115-59 = "저, 저기! 새전함 자물쇠가……!"
10008115-60 = "응? 설마 소동 속에서 버티지 못하고 자물쇠가 부서져 버린……."
10008115-64 = "……잠깐. 새전함의 내용물……은?"
10008115-65 = "[s] \"텅…… 비어있는데?\""
10008115-67 = "내용물이 없다고?"
10008115-68 = "아하핫? 뭐야뭐야?"
10008115-69 = "뭐, 뭐어어엇?!"
10008115-73 = "[ns] \"앗, 이 소리는?!\""
10008115-75 = "차아아앗!!"
10008115-81 = "정의의 히어로, 카이텐져……… 등장!!"
10008115-86 = "……하?"
