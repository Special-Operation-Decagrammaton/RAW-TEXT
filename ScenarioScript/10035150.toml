[translation]
10035150-1 = "후일담;코마카제 라브의 시크릿 바캉스 2"
10035150-4 = "여, 여기는 워터파크……?"
10035150-5 = "최근에 개장한 곳이잖아요? 설마 물놀이라는 게 이곳에서……?!"
10035150-7 = "당연하지!"
10035150-8 = "본부 자식들, 사람 차별하고 말이야."
10035150-9 = "됐어! 나도 안 갈 거야!"
10035150-10 = "대신 여기서 해변 따위 생각도 안 날 정도로 신나게 놀아제끼자고."
10035150-11 = "내 부하들이 여름을 즐기지 못하는 건 나도 싫으니까!"
10035150-16 = "대장……!"
10035150-17 = "우리를 위해서……!"
10035150-19 = "뭐, 뭐어, 나도 워터파크라는 데를 한번 와보고 싶었기도 하고!"
10035150-20 = "몰라! 아무튼 들어가기나 하자고!"
10035150-23 = "네! 대장!"
10035150-31 = "어서 오세요! 몇 분이신가요?"
10035150-33 = "세 명!"
10035150-35 = "네, 손님 세 분, 18000엔입니다."
10035150-39 = "으, 응?!"
10035150-40 = "뭐가 그리 비싸?"
10035150-42 = "아, 이건 정가 기준이고요."
10035150-43 = "할인 혜택이 적용됩니다."
10035150-44 = "그럼 그렇지."
10035150-45 = "우선 학생 할인이 있습니다."
10035150-46 = "어떤 학원이든 학생증을 제시해 주시면 정가의 50%를 할인해 드리고 있습니다!"
10035150-47 = "어, 어어……."
10035150-49 = "대, 대장, 우리는 자퇴생이라 학생증이 없잖아요."
10035150-51 = "다, 다른 할인은?"
10035150-52 = "으음, 봉사활동 증명서를 제시해 주시면 30%를 할인해 드리고 있습니다."
10035150-53 = "우리한테 봉사활동 증명서 같은 건 없는데……."
10035150-54 = "그것도 아니면……"
10035150-55 = "오후 4시부터 입장하는 이용권은 20% 할인해 드리고 있는데요."
10035150-57 = "아직 아침 개장하기도 전이잖아!"
10035150-58 = "여기서 4시까지 기다리라고?"
10035150-64 = "하아……."
10035150-65 = "예산이 얼마신데요?"
10035150-66 = "그러니까, 지금 있는 돈이……."
10035150-70 = "1500엔 뿐인데……."
10035150-71 = "인당 500엔에 해 주면 안 돼?"
10035150-73 = "죄송하지만 손님, 규정에 없는 할인은 불가능합니다."
10035150-77 = "그럼 다음 분!"
10035150-78 = "잠깐잠깐잠깐!"
10035150-79 = "여, 여기까지 왔는데 입구에서 돌아갈 수는 없는 거잖아!"
10035150-81 = "맞아요!"
10035150-82 = "대장이 기껏 데려와 주신 워터파크인데……!"
10035150-84 = "사정을 좀 봐주면 안 될까?"
10035150-85 = "뭣하면 부족한 돈은 몸으로라도 때우겠어!"
10035150-86 = "흐음, 그것도 규정상으로 NG인데……."
10035150-90 = "그러면, 마침 인력이 부족한 곳이 있는데 한 번 연락해 보죠."
10035150-92 = "고, 고마워!"
10035150-93 = "무슨 일이든 열심히 할게!"
10035150-101 = "뭐어, 수영장 청소 정도야 가뿐하지!"
10035150-102 = "이 라브 님이 솔을 들고 타일이나 닦고 있다는 건 마음에 안 들지만……."
10035150-103 = "살다 보면 이런 날도 있는 거겠지."
10035150-109 = "대장, 이쪽 구역은 끝났습니다!"
10035150-110 = "이쪽도요!"
10035150-112 = "그래? 그러면 슬슬—"
10035150-119 = "안내말씀 드립니다."
10035150-120 = "현시간부로 파크 개장을 시작하겠습니다. 대기 중이신 이용객분들은 게이트로 입장해 주시기 바랍니다."
10035150-121 = "드, 드디어!"
10035150-122 = "들어갈 시간이에요, 대장!"
10035150-124 = "좋았어!"
10035150-125 = "부족한 입장권 값도 청소로 확실하게 때웠고, 이제 즐길 일만 남았잖냐!"
10035150-126 = "너희들!"
10035150-129 = "네, 대장!"
10035150-131 = "실컷 놀지 않으면 내가 용서하지 않을 테니까 말야!"
10035150-132 = "오늘만큼은 다 잊고 즐기는 거다!"
10035150-133 = "정말 괜찮은 거겠죠?"
10035150-134 = "걱정할 건 아무것도 없다고!"
10035150-136 = "파크에 악어라도 나타나지 않는 한은 말야!"
