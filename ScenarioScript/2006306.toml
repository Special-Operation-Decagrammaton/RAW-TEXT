[translation]
2006306-1 = "소녀를 스친 바람"
2006306-3 = "왔구나 선생님. 준비는 다 되었어."
2006306-4 = "PSR의 IMINT를 획득하자."
2006306-5 = "[s1] \"아까도 물어보려고 했는데…….\"\n[s2] \"PSR하고 IMINT가 뭐야?\""
2006306-8 = "아, 버릇이 되어서 줄여 말했어. 설명하는 걸 잊어서 미안해."
2006306-9 = "PSR은 <타격 후 정찰>, IMINT는 <화상 자료>란 뜻이야."
2006306-10 = "선생님의 도움이 절실했어."
2006306-11 = "[s] \"잘 모르겠지만 내가 뭘 하면 좋을까?\""
2006306-12 = "알기 쉽게 말하자면 사진 촬영이야."
2006306-13 = "낙제과목 대체로 대회에 참여한 증거 사진을 찍어야 해."
2006306-14 = "소감문은 내가 어떻게든 써보려고 했는데, 사진이 어려워서……."
2006306-15 = "[s] \"현장학습 사진인가, 내 전문이지!\""
2006306-16 = "역시, 선생님이 있으면 항상 든든해."
2006306-17 = "어떻게 찍어야 할지 잘 모르겠으니, 리드 부탁해."
2006306-21 = "일단 이동하자. 빛이 잘 들면 좋다고 들었어."
2006306-22 = "오늘은 예보대로 좋은 날씨네."
2006306-23 = "그래서 덥긴 하지만, 이 정도라면 익숙하니 지장은 없을 거라 생각해."
2006306-36 = "후우…… 선생님. 전력을 다해 찍어줘서 고마워."
2006306-37 = "약간 지친 것 같아. 잠시 쉬어야……."
2006306-42 = "어? 그 귀여운 선수네?"
2006306-46 = "어른이다! 선생님이네?"
2006306-52 = "소문의 바로 그……!"
2006306-57 = "……."
2006306-58 = "……."
2006306-59 = "[s] \"아즈사가 역시 귀엽긴 하지!\""
2006306-64 = "저기 저기! 같이 사진 한 장 찍어줄 수 있어?"
2006306-67 = "나도, 나도!"
2006306-68 = "이 학교도 타인에게 관심이 많네……."
2006306-69 = "……그러고 보니, 다른 사람과 교류하는 사진도 필요하긴 했어."
2006306-70 = "선생님. 부탁할게."
2006306-71 = "[s] \"맡겨줘! 자, 다들 모이자!\""
2006306-79 = "으…… 음……."
2006306-80 = "햇볕, 생각보다…… 세……."
2006306-84 = "다음은 나하고도 같이 찍……."
2006306-85 = "하아, 하아……."
2006306-86 = "눈이, 핑 돌아……."
2006306-90 = "[ns] \"아즈사?!\""
2006306-91 = "쓰러졌잖아?! 괜찮아?!"
2006306-92 = "[s] \"그늘 쪽으로 가자!\""
2006306-93 = "선, 생님……."
2006306-100 = "[wa:2510]― [log=아즈사 레이싱]아아…… [wa:178]선생님. [wa:1852]미안. [/log]"
2006306-103 = "― [log=아즈사 레이싱]햇볕이 예상보다 강해서, [wa:2330]핑 돌아버렸어.[/log]"
2006306-105 = "― [log=아즈사 레이싱]조금만…… [wa:730]쉴게…….[/log]"
2006306-108 = "[ns] \"열사병? 괜찮아?\""
2006306-109 = "[wa:640]―  [log=아즈사 레이싱]……으응, [wa:396]괜찮아. [wa:1144]쉬면 나아질 거야.[/log]"
2006306-111 = "― [log=아즈사 레이싱]최근에 너무 [wa:1684]편하게 지냈던 모양이야. [wa:1747]훈련 부족이 심하네.[/log]"
2006306-114 = "― [log=아즈사 레이싱]앞으로는 선생님을 [wa:1517]실망시키지 않을 테니까. [/log]"
2006306-116 = "― [log=아즈사 레이싱]……정말, [wa:1345]미안해.[/log]"
2006306-119 = "[ns3] \"선생님은 이런 일로 실망하지 않을 거야.\"\n[ns4] \"이런 일로 선생님에게 미안해하지 말아줘.\""
2006306-122 = "[wa:730]― [log=아즈사 레이싱]아……. [/log]"
2006306-124 = "― [log=아즈사 레이싱]사과할 일이 아닌 거구나…… [wa:3140]그런가.[/log]"
2006306-127 = "― [log=아즈사 레이싱]예전이라면…… [wa:1050]호되게 혼났을 테니까.[wa:40] [/log]"
2006306-129 = "― [log=아즈사 레이싱]무심코 [wa:520]그랬어.[/log]"
2006306-132 = "[wa:3680]― [log=아즈사 레이싱]바람…… 불어오는구나.[/log]"
2006306-135 = "― [log=아즈사 레이싱]예전엔, 바람을 맞으면 [wa:1310]탄도에 영향이라든지……[/log]"
2006306-137 = "― [log=아즈사 레이싱]이런저런 걸 신경 썼어.[/log]"
2006306-140 = "― [log=아즈사 레이싱]하지만, 지금은 달라.[/log]"
2006306-143 = "[wa:2850]― [log=아즈사 레이싱]그냥, 시원하고 [wa:1210]행복하고…….[/log]"
2006306-145 = "― [log=아즈사 레이싱]그런 것들을 선생님과 함께 느낄 수 있어서…… [wa:2640]행복해.[/log]"
2006306-149 = "후우, 잠깐 쉬니까 괜찮아졌어."
2006306-150 = "사진도 충분히 찍었고, 이제 돌아가자 선생님."
2006306-151 = "[s] \"수분 보충도 하고 시원한 곳에 있자!\""
2006306-152 = "응, 좋아."
2006306-153 = "……선생님이 같이 있어주면, 도움이 될 것 같아."
2006306-154 = "그러니까, 선생님…… 조금만 더, 곁에 있어줘."
2006306-156 = "(이후, 아즈사를 시원한 곳으로 데려갔다.)"
2006306-157 = "(지쳐 있었는지, 아즈사는 곧 잠이 들었다.)"
2006306-158 = "(잠에서 깰 때까지, 아즈사의 곁을 계속 지켜주었다.)"
