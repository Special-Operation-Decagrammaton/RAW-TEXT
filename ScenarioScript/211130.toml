211130-107 = "Hm? What do you mean? There is no ceiling to our potential. We're going to make Gehenna the most glorious school in Kivotos!"
211130-108 = "Well... That might be a bit too much for me."
211130-109 = "Oh, I'm not saying there's anything wrong with that. I just like to keep things low-key."
211130-110 = "Yeah, tell me! What will this glorious Gehenna look like?"
211130-111 = ""
211130-113 = ""
211130-114 = "Ahem. I'm glad you asked. The GLORIOUS GEHENNA!"
