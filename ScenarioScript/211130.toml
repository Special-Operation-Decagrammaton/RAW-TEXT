[translation]
211130-1 = "第13話;森の中の木"
211130-2 = ""
211130-3 = ""
211130-6 = ""
211130-7 = "こんにちは、[ruby=はたみ]旗見[/ruby]エリカさん、[ruby=よざくら]夜桜[/ruby]キララさん。"
211130-8 = ""
211130-11 = ""
211130-12 = "あれ、あたしたちのこと知ってるの？"
211130-13 = "そっちは最近話題の委員会だよね？"
211130-14 = "名前はたしか――"
211130-16 = "ゲヘナ再興委員会。私は[ruby=いがらし]五十嵐[/ruby]ショウコです。"
211130-17 = "あたしたちタメなんだよね。知ってた？"
211130-18 = "ええ、ある程度は。"
211130-19 = "そっかそっか、よろしくね！#nそれで、何か用？"
211130-20 = ""
211130-25 = ""
211130-26 = "ちょっと聞きたいことがあるんだ。"
211130-27 = "あ、無理にとは言わないよ。"
211130-29 = "……あれ？先生も一緒だったんだ！"
211130-30 = "[s] \"やぁ、キララ、エリカ！\""
211130-31 = "もしかして意外と大事？"
211130-32 = "いえ、お手間は取らせませんので。"
211130-33 = "もう帰ろうとしてたとこだから。なんでも聞いて。"
211130-34 = "では、お言葉に甘えて。"
211130-36 = "おっけおっけ、新しい友だちはいつでも歓迎だし。"
211130-40 = "ん～！やっぱここのホワイトチョコが一番だよね！"
211130-41 = "奢ってもらっちゃって悪いね。ここまでしてもらわなくてもいいのに。"
211130-43 = "私が払うから遠慮せず食べてね。お代わりもどんとこいだよ。"
211130-44 = "――と、先生は考えました。"
211130-45 = "[s] \"またそれか……！\""
211130-46 = "あはは、二人はそういうノリなんだ。#nさすが、先生は誰とでも馴染むね。"
211130-47 = "それで、話って？"
211130-48 = "えっと……。"
211130-49 = "前に校内放送やってたよね？"
211130-50 = "ああ、あれね。"
211130-51 = "1回だけだったけどすっごく楽しかったよ！ああいうの初めてだったし！"
211130-52 = "校内放送に興味あるの？"
211130-53 = "なくはないんだけど、今は調べたいことがあってさ。"
211130-54 = "最近、校内放送やってないじゃん？たぶん、二人の放送の後から。#n……何かあった？"
211130-55 = "言われてみればそうだね。"
211130-56 = "失敗したわけでもないし、機材壊したりもしてないし……なんでだろ。"
211130-57 = "あたしたちが上手すぎて、次の人がプレッシャー感じちゃったとか？"
211130-58 = "ないない。"
211130-59 = "あ、でも……放送部長が戻ってきたって話は聞いてないね。"
211130-60 = "実はあの時、あたしたちが放送を続けるって話もあったんだ。"
211130-61 = "元からやってた人のほうがいいと思って断っちゃったけど。"
211130-62 = ""
211130-65 = ""
211130-66 = "それから放送は止まったまま……。"
211130-67 = "お二人が放送していたとき、何かおかしな点はありませんでしたか？"
211130-68 = "例えば？"
211130-69 = "何かトラブルが起きたとか、聞こえないはずの音が混ざっていたとか……。"
211130-70 = "そういえば、一瞬だけピーッって音が鳴ってたかも。#nすっごい高いキーン！ってやつ。分かるでしょ？"
211130-71 = "……そうでしたか。"
211130-72 = "うん。でもエリカちゃんがすぐ何とかしてくれたんだ！"
211130-74 = "ケーブルが絡まってただけだったから。ちょっと配線を直したらすぐ収まったよ。"
211130-75 = "あとは特に何も？"
211130-76 = ""
211130-78 = ""
211130-79 = "えっと……あ。"
211130-80 = "何か変な声を聞いた気もするんだよね。"
211130-81 = "そんなのあったっけ？"
211130-82 = "聞き間違いかもしれないから、誰にも言ってなかったんだけど。"
211130-84 = "どんな声でしたか？"
211130-85 = "うーん……女の人の声で……。"
211130-86 = "何か……単語を言ってたかな。"
211130-87 = "[ruby=・]て[/ruby][ruby=・]っ[/ruby][ruby=・]け[/ruby][ruby=・]つ[/ruby]？とか、[ruby=・]ち[/ruby][ruby=・]つ[/ruby][ruby=・]じ[/ruby][ruby=・]ょ[/ruby]とか……#nそんなのだったと思うけど、細かくは覚えてないや。"
211130-88 = ""
211130-90 = ""
211130-91 = "あ、エリカちゃんって呼んじゃっていい？"
211130-92 = "もちろん。エリカでもいいよ。"
211130-93 = "エリカちゃんには、はっきり聞こえてたってこと？#nうちらが聞いたのはもうちょっと曖昧だったんだけど。"
211130-94 = "いや、私も細かく聞き取れたわけじゃないよ。だいたいのニュアンスってくらい。"
211130-95 = "そっか……不思議だねぇ。"
211130-96 = "でも、どうして気になってるの？"
211130-97 = "うちら、その「幽霊騒ぎ」を解決してるところでさ。"
211130-98 = "わーっ、何それ！すっごく楽しそう！キラキラしてる～！"
211130-99 = "生徒のお悩み解決みたいなことをやってるんだ。成り行きでね。"
211130-100 = "そういうのもやってるんだ？あははっ！絶対面白いじゃん！"
211130-102 = "どう？興味あるなら入らない？"
211130-103 = "残念。私たち、キラキラ部なんだ。"
211130-104 = "二人にはピッタリだと思うんだけどな！一緒にゲヘナを偉大にしようよ！"
211130-105 = "ゲヘナを偉大に、か……。"
211130-106 = "偉大になりすぎてもちょっと困るかも？"
211130-107 = "どうして？キヴォトスで一番がよくない？"
211130-108 = "うーん……私には、ちょっと看板が重すぎるかなって。"
211130-109 = "別に、否定するわけじゃないよ。#n私はもっとこじんまりしてるほうが性に合うってだけだから。"
211130-110 = "ねえ、偉大なゲヘナってどんなの？"
211130-111 = ""
211130-113 = ""
211130-114 = "ふふん、偉大なゲヘナとは！"
211130-115 = "秩序だった規則と統制のもと、みんなが一つになって――"
211130-117 = "心を一つに同じ目標へ向かって突き進んでいく！"
211130-118 = "絵に描いたみたいに理想的な学園だよ！#nまさに、昔のゲヘナみたいに！"
211130-119 = ""
211130-121 = ""
211130-123 = ""
211130-124 = "みんなが同じだったらつまんなくない？"
211130-125 = ""
211130-128 = ""
211130-129 = "そんなことないよ！長く険しい道の先にあるから、偉大でワクワクするんだよ！"
211130-130 = "でも……ドラマも音楽も、同じようなのばっかりになっちゃうよね。"
211130-131 = "バラバラだからこそ面白くなるんじゃないかな……。"
211130-132 = "……。"
211130-134 = "あ、マユミちゃんフリーズしちゃった。"
211130-136 = "ち、違くて！コンテンツと……その、なんだっけ？全体の方向性は！別だから！"
211130-137 = "ふーん……？"
211130-138 = ""
211130-140 = ""
211130-141 = "……ショ……！"
211130-143 = "ショウコ！！"
211130-144 = ""
211130-146 = ""
211130-148 = ""
211130-149 = "……ショウコ？考え込んでないで助けてよ！"
211130-150 = ""
211130-152 = ""
211130-153 = "……あ。"
211130-154 = "どしたん？なんかあった？"
211130-155 = "いえ。ちょっと考えさせられることがあって。"
211130-156 = "なになに？"
211130-157 = "……。"
211130-158 = "どうやら、放送室に入る必要がありそうです。"
211130-160 = "あっ、そっち？まあ決着はつけないとだよね。"
211130-162 = "でも、どうやって入るつもり？"
211130-163 = "万魔殿と……正面から交渉する他ないでしょうね。"
211130-164 = "か～っこいい～！"
211130-165 = "活動の甲斐もあって、私たちの格はそれなりに上がりました。#n今なら正面から話しても、そう簡単には押し切られないはずです。"
211130-167 = "急に話がヘビーになってきたね……応援してるよ。"
211130-168 = "うん！これもキラキラかも！"
211130-169 = "……その前に。"
211130-170 = ""
211130-172 = ""
211130-174 = ""
211130-175 = "ホワイトチョコチップフラペチーノ……もう一杯頼んでもいいですか？"
211130-176 = ""
211130-179 = "[ns] \"お代わりもどんとこいだよ。\""
211130-184 = "次回;揺れる炎の影"
