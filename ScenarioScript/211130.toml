[translation]
211130-1 = "第13話;林中之樹"
211130-2 = ""
211130-3 = ""
211130-6 = ""
211130-7 = "您好，旗見繪里香同學、夜櫻綺羅羅同學。"
211130-8 = ""
211130-11 = ""
211130-12 = "哎呀，你認識我們？"
211130-13 = "你是……"
211130-14 = "啊，你是最近很紅的那個社團的成員吧？名字是～"
211130-16 = "我是五十嵐翔子。"
211130-17 = "啊！對耶～！我們是同一個年級吧。你知道嗎？"
211130-18 = "略知一二。"
211130-19 = "嘿嘿，很高興認識你！不過你找我們有什麼事嗎？"
211130-20 = ""
211130-25 = ""
211130-26 = "你好～！有事想問你們，現在方便占用一點時間嗎？"
211130-27 = "啊啊，不是要強迫你們哦。不行的話也沒關係。"
211130-29 = "哎呀，都是熟面孔呢。"
211130-30 = "[s] 「嗨，綺羅羅、繪里香。」"
211130-31 = "連老師也來了？哇，發生什麼事了？"
211130-32 = "只是個簡單的問題，請問現在方便嗎？"
211130-33 = "啊啊，當然可以。我們正打算要回家呢。"
211130-34 = "這樣啊。那麼，方便的話想跟兩位聊一下。"
211130-36 = "好啊好啊，新朋友我們隨時都歡迎。"
211130-40 = "果然～這家店的白巧克力最好吃了。"
211130-41 = "其實不用這樣的，不過既然要請客，我就心懷感激地吃囉。"
211130-43 = "我請客，盡情吃吧。想再點多少都可以。"
211130-44 = "──老師是這麼想的。"
211130-45 = "[s] 「又變成這樣了嗎……！」"
211130-46 = "啊哈哈。原來是這種氣氛啊。老師果然不管到哪裡都很融入呢。"
211130-47 = "所以，是什麼事？"
211130-48 = "OK，那我就開門見山地問了。"
211130-49 = "上次你們兩個不是有做過校內廣播嗎？"
211130-50 = "啊，那個啊。"
211130-51 = "雖然只有一次，但還挺好玩的！因為那是我們第一次做那種事。"
211130-52 = "再興委員會也對廣播有興趣嗎？"
211130-53 = "呃，有一點？不過現在是有別的事要調查。"
211130-54 = "自從你們兩個廣播之後，校內廣播就中斷了……難道發生了什麼事嗎？"
211130-55 = "啊，對耶。在我們之後就沒有廣播了。"
211130-56 = "我們沒有出錯，也沒弄壞什麼東西。為什麼呢？"
211130-57 = "是不是我們太厲害，讓下一個人有壓力了？"
211130-58 = "不會啦，怎麼可能。"
211130-59 = "不過在那之後，好像也沒聽說之前的廣播部長回來了。"
211130-60 = "那時候還有人問我們要不要繼續做廣播呢。"
211130-61 = "我們覺得還是由原本在做的人來做比較好，所以就拒絕了。"
211130-62 = ""
211130-65 = ""
211130-66 = "在那之後廣播就中斷了……"
211130-67 = "請問兩位在廣播的時候，有沒有發現什麼奇怪的地方？"
211130-68 = "奇怪的地方……？"
211130-69 = "像是發生了什麼意外，或是聽到了不該聽到的聲音……"
211130-70 = "啊，是有短暫聽到一聲嗶～#n很高很高的高頻音？就是那種嘛。"
211130-71 = "……是嗎？"
211130-72 = "嗯。不過繪里醬馬上就解決了！"
211130-74 = "只是線纏在一起而已，把線好好解開就解決了。沒什麼大不了的。"
211130-75 = "就只有這樣嗎？"
211130-76 = ""
211130-78 = ""
211130-79 = "呃……啊。"
211130-80 = "這麼說來，那時候我好像聽到了什麼奇怪的聲音。"
211130-81 = "嗯？有那種事嗎？"
211130-82 = "嗯。好像只有我聽到，所以我沒跟任何人說。"
211130-84 = "是什麼樣的聲音呢……？"
211130-85 = "這個嘛……是女生的聲音……"
211130-86 = "好像在說某些詞？"
211130-87 = "是什麼來著。鐵血、秩序……之類的吧。我記不太清楚了。"
211130-88 = ""
211130-90 = ""
211130-91 = "呃，繪里醬？可以這樣叫你嗎？"
211130-92 = "當然！叫我繪里香也可以。"
211130-93 = "繪里香醬，你有清楚聽到那些詞嗎？我們聽到的聲音很模糊耶。"
211130-94 = "呃，我也沒聽得很仔細。大概是那種感覺？"
211130-95 = "嘿～……真神奇呢。"
211130-96 = "不過你們為什麼要問那個？"
211130-97 = "啊，我們現在正在解決鬧鬼事件。"
211130-98 = "哇～那是什麼啊！看起來超好玩的！閃亮亮的！"
211130-99 = "不知不覺就開始做解決煩惱之類的事了。呀哈。"
211130-100 = "再興委員會也做那種事啊？啊哈哈！好像很好玩！"
211130-102 = "怎麼樣，有興趣嗎？要加入再興委員會嗎？"
211130-103 = "啊，很可惜我們也有社團了。我們是閃亮亮部。"
211130-104 = "你們的話一定沒問題的！一起讓格黑娜變得偉大吧！如何？"
211130-105 = "偉大的格黑娜啊……"
211130-106 = "變得太偉大也很傷腦筋吧？哈哈。"
211130-107 = "嗯？為什麼？我們可是要讓格黑娜成為奇普托斯最偉大的學園耶。"
211130-108 = "這個嘛……對我來說，這個頭銜或許太沉重了。"
211130-109 = "啊，我不是說你們不對。只是我的格局比較小而已。"
211130-110 = "那個，偉大的格黑娜是什麼樣子的？"
211130-111 = ""
211130-113 = ""
211130-114 = "哼哼，所謂偉大的格黑娜！"
211130-115 = "就是在井然有序的規則與管控下，所有人團結一致……"
211130-117 = "同心同德地朝著同一個目標奔跑！"
211130-118 = "宛如畫中般理想的學園！就像過去的格黑娜一樣！"
211130-119 = ""
211130-121 = ""
211130-123 = ""
211130-124 = "呃，大家都一條心的話，不是有點無聊嗎？"
211130-125 = ""
211130-128 = ""
211130-129 = "才不是！正因為那並不容易，所以才偉大又有趣啊！"
211130-130 = "如果大家的想法都一樣，連電視劇和音樂也全都會變成一模一樣的吧？"
211130-131 = "我覺得就是因為想法各不相同，才會變得有趣……"
211130-132 = "……"
211130-134 = "呃，真由美醬說不出話來了。"
211130-136 = "那，那個不一樣啦！內容跟那個……叫什麼來著？#n跟整體方向性是不一樣的！"
211130-137 = "唔嗯……"
211130-138 = ""
211130-140 = ""
211130-141 = "翔……！"
211130-143 = "翔子！！"
211130-144 = ""
211130-146 = ""
211130-148 = ""
211130-149 = "翔子！你在想什麼想得那麼入神？快點說明細節啦！"
211130-150 = ""
211130-152 = ""
211130-153 = "啊……"
211130-154 = "翔子醬，怎麼了？發生什麼事了嗎？"
211130-155 = "沒什麼。只是有些事需要想一想。"
211130-156 = "什麼事？"
211130-157 = "……"
211130-158 = "看來我們必須進入廣播室才行了。"
211130-160 = "啊，原來是鬼的事啊。#n也對，那件事也得查個水落石出才行。"
211130-162 = "不過要怎麼進去？"
211130-163 = "……得跟萬魔殿談判了吧。"
211130-164 = "哇，好帥的宣言！"
211130-165 = "這段時間我們也提升了自己的分量，現在就算正面交涉，應該也不會落於下風。"
211130-167 = "突然變成很沉重的話題了呢……不過我會為你們加油的。"
211130-168 = "嗯！這說不定也算是一種閃亮亮～呢！"
211130-169 = "在那之前……"
211130-170 = ""
211130-172 = ""
211130-174 = ""
211130-175 = "老師，可以再點一杯白巧克力碎片星冰樂嗎？"
211130-176 = ""
211130-179 = "[ns] 「想再點多少都可以……」"
211130-184 = "下一話;烈焰下的陰影"
