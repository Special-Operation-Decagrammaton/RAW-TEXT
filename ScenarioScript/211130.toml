[translation]
211130-1 = "ตอนที่ 13;ต้นไม้ในป่า"
211130-2 = ""
211130-3 = ""
211130-6 = ""
211130-7 = "สวัสดีค่ะ คุณฮาทามิ เอริกะ คุณโยซากุระ คิราระ"
211130-8 = ""
211130-11 = ""
211130-12 = "เอ๋ รู้จักพวกเราด้วยเหรอ?"
211130-13 = "เธอคือ..."
211130-14 = "อ๋อ เป็นสมาชิกชมรมที่กำลังดังช่วงนี้ใช่มั้ย? ชื่อว่า~"
211130-16 = "อิการาชิ โชโกะค่ะ"
211130-17 = "อ๊ะ! จริงด้วย~! พวกเราอยู่ชั้นปีเดียวกันนะ รู้หรือเปล่า?"
211130-18 = "พอรู้อยู่บ้างค่ะ"
211130-19 = "ฮิฮิ ยินดีที่ได้รู้จักนะ! ว่าแต่มีเรื่องอะไรกับพวกเราเหรอ?"
211130-20 = ""
211130-25 = ""
211130-26 = "สวัสดี~! เรามีเรื่องอยากถามน่ะ ขอเวลาเดี๋ยวหนึ่งได้มั้ย?"
211130-27 = "อ้อ ไม่ได้บังคับหรอกนะ ถ้าไม่สะดวกก็ไม่เป็นไร"
211130-29 = "อ้าว มีแต่คนหน้าคุ้นๆ ทั้งนั้นเลยนี่นา"
211130-30 = "[s] \"สวัสดี คิราระ เอริกะ\""
211130-31 = "คุณครูก็มาด้วยเหรอ? ว้าว นี่มันเรื่องอะไรกัน?"
211130-32 = "เราแค่จะถามคำถามง่ายๆ ค่ะ ไม่ทราบว่าพอจะมีเวลามั้ยคะ?"
211130-33 = "อื้อ ได้สิ พวกเรากำลังจะกลับบ้านพอดีเลย"
211130-34 = "อย่างนั้นเหรอคะ ถ้าไม่ติดอะไรละก็ ขอคุยด้วยสักครู่นะคะ"
211130-36 = "ได้เลยๆ พวกเรายินดีต้อนรับเพื่อนใหม่เสมออยู่แล้ว"
211130-40 = "ว้าว~ ไวท์ช็อกโกแลตของร้านนี้อร่อยที่สุดเลยนะ"
211130-41 = "ไม่เห็นต้องทำถึงขนาดนี้เลย แต่ในเมื่ออุตส่าห์เลี้ยง ฉันก็ไม่เกรงใจละนะ"
211130-43 = "ครูเป็นคนเลี้ยงเอง กินให้เต็มที่เลย จะสั่งเพิ่มอีกก็ได้นะ"
211130-44 = "คุณครูคิดแบบนี้สินะคะ"
211130-45 = "[s] \"เป็นแบบนี้อีกแล้วเหรอ...!\""
211130-46 = "อะฮะฮ่า บรรยากาศเป็นแบบนี้เองสินะ สมกับที่เป็นคุณครูเลย ไม่ว่าจะไปที่ไหนก็เข้ากับคนอื่นได้ดีจริงๆ"
211130-47 = "ว่าแต่ จะคุยเรื่องอะไรเหรอ?"
211130-48 = "โอเค งั้นจะถามตรงๆ เลยนะ"
211130-49 = "คราวก่อนพวกเธอสองคนเคยจัดรายการกระจายเสียงในโรงเรียนใช่มั้ย?"
211130-50 = "อ๋อ เรื่องนั้น"
211130-51 = "พวกฉันเคยทำแค่ครั้งเดียว แต่ก็สนุกมากเลยนะ! เพิ่งจะเคยทำอะไรแบบนั้นเป็นครั้งแรกเลยละ"
211130-52 = "คณะกรรมการฟื้นฟูก็สนใจงานกระจายเสียงเหมือนกันเหรอ?"
211130-53 = "เอ่อ ก็นิดหน่อย? แต่ตอนนี้มีเรื่องอื่นที่ต้องตรวจสอบน่ะ"
211130-54 = "หลังจากที่พวกเธอสองคนจัดรายการครั้งนั้น การกระจายเสียงในโรงเรียนก็ถูกระงับไป... มีเรื่องอะไรเกิดขึ้นหรือเปล่า?"
211130-55 = "อ๊ะ จริงด้วย ตั้งแต่รอบถัดจากพวกเรา ก็ไม่มีการกระจายเสียงอีกเลย"
211130-56 = "พวกเราก็ไม่ได้ทำพลาดหรือทำอะไรพังนี่นา ทำไมกันนะ?"
211130-57 = "หรือว่าพวกเราทำได้ดีเกินไป คนถัดไปก็เลยรู้สึกกดดันหรือเปล่า?"
211130-58 = "เอ๋ ไม่น่าจะเป็นงั้นนะ"
211130-59 = "แต่หลังจากนั้นก็ไม่มีข่าวว่าหัวหน้าชมรมกระจายเสียงคนก่อนกลับมาเลยนะ"
211130-60 = "ตอนนั้นก็มีคนเสนอให้พวกเราจัดรายการต่อไปเรื่อยๆ ด้วย"
211130-61 = "แต่พวกเราปฏิเสธไป เพราะคิดว่าให้คนที่ทำหน้าที่นี้อยู่เดิมทำต่อคงดีกว่า"
211130-62 = ""
211130-65 = ""
211130-66 = "หลังจากนั้นการกระจายเสียงก็ถูกระงับไป..."
211130-67 = "ตอนที่ทั้งสองคนจัดรายการ มีอะไรผิดปกติหรือเปล่าคะ?"
211130-68 = "ผิดปกติเหรอ...?"
211130-69 = "อย่างเช่น เกิดเหตุอะไรขึ้น หรือได้ยินเสียงที่ไม่ควรได้ยิน..."
211130-70 = "อ๊ะ เคยได้ยินนะ เสียงแหลมความถี่สูงเสียงปี๊ด~ อยู่แป๊บหนึ่งน่ะ พอนึกออกมั้ย?"
211130-71 = "งั้นเหรอคะ...?"
211130-72 = "อื้ม แต่เอริจังแก้ได้ในทันทีเลยนะ!"
211130-74 = "ก็แค่สายพันกัน พอคลายสายออกให้เรียบร้อยก็แก้ได้แล้ว ไม่ใช่เรื่องใหญ่อะไรหรอก"
211130-75 = "แล้วสถานการณ์ก็จบลงแค่นั้นเหรอคะ?"
211130-76 = ""
211130-78 = ""
211130-79 = "อ่า... อ๊ะ"
211130-80 = "จะว่าไปแล้วตอนนั้นก็เหมือนจะได้ยินเสียงอะไรแปลกๆ อยู่นะ"
211130-81 = "หืม? มีเรื่องแบบนั้นด้วยเหรอ?"
211130-82 = "อื้ม เหมือนมีแค่ฉันที่ได้ยิน ก็เลยไม่ได้เล่าให้ใครฟังน่ะ"
211130-84 = "เป็นเสียงอะไรเหรอคะ...?"
211130-85 = "อืม... เป็นเสียงผู้หญิง..."
211130-86 = "เหมือนกำลังพูดคำอะไรสักอย่าง?"
211130-87 = "อะไรนะ เหล็กและเลือด ระเบียบ... อะไรประมาณนั้น จำไม่ค่อยได้แล้ว"
211130-88 = ""
211130-90 = ""
211130-91 = "เอ่อ เอริจัง? ฉันขอเรียกอย่างนี้ได้มั้ย?"
211130-92 = "ได้สิ! เรียกเอริกะก็ได้"
211130-93 = "เอริกะจังได้ยินคำนั้นชัดเจนเลยเหรอ? เสียงที่พวกเราได้ยินมันไม่ค่อยชัดเท่าไรน่ะ"
211130-94 = "เอ่อ ฉันก็ไม่ได้ยินรายละเอียดชัดเจนทั้งหมดหรอก แต่ก็ประมาณนั้น?"
211130-95 = "หืม... แปลกดีนะ"
211130-96 = "ว่าแต่ทำไมถึงถามเรื่องพวกนั้นกันล่ะ?"
211130-97 = "อ๋อ ตอนนี้พวกเรากำลังจัดการเรื่องวุ่นวายเกี่ยวกับผีอยู่น่ะ"
211130-98 = "ว้าว เรื่องผีเหรอ! ดูน่าสนุกสุดๆ เลย! เป็นอะไรที่เปล่งประกายมาก!"
211130-99 = "พอดีว่าพวกเรารับแก้ปัญหากลุ้มใจกันน่ะ ยะฮ่า"
211130-100 = "คณะกรรมการฟื้นฟูทำเรื่องแบบนั้นด้วยเหรอ? อะฮะฮ่า! น่าสนุกจัง!"
211130-102 = "เป็นไง สนใจมั้ย? อยากเข้าคณะกรรมการฟื้นฟูหรือเปล่า?"
211130-103 = "อ๊ะ น่าเสียดายที่พวกเราก็มีชมรมอยู่แล้วน่ะ พวกเราอยู่ชมรมเปล่งประกาย"
211130-104 = "แต่ถ้าเป็นพวกเธอน่าจะไม่มีปัญหานะ! มาร่วมกันทำให้เกเฮนน่ายิ่งใหญ่กันเถอะ! สนใจมั้ย?"
211130-105 = "เกเฮนน่าที่ยิ่งใหญ่..."
211130-106 = "ถ้ายิ่งใหญ่เกินไป ก็น่าจะลำบากไม่ใช่เหรอ? ฮ่าฮ่า"
211130-107 = "หืม? ทำไมล่ะ? พวกเราจะทำให้เกเฮนน่ายิ่งใหญ่ที่สุดในคิโวทอสเลยนะ"
211130-108 = "ไม่รู้สิ... สำหรับฉัน ตำแหน่งแบบนั้นออกจะกดดันเกินไปหน่อย"
211130-109 = "อ๊ะ ฉันไม่ได้หมายความว่าพวกเธอผิดนะ แค่ฉันค่อนข้างเหมาะกับงานสเกลเล็กๆ มากกว่าน่ะ"
211130-110 = "นี่ เกเฮนน่าที่ยิ่งใหญ่น่ะ เป็นแบบไหนเหรอ?"
211130-111 = ""
211130-113 = ""
211130-114 = "อะแฮ่มๆ เกเฮนน่าที่ยิ่งใหญ่ก็คือ!"
211130-115 = "ที่ที่ทุกคนรวมเป็นหนึ่ง ภายใต้กฎระเบียบและการควบคุมที่เป็นระบบ"
211130-117 = "ทุกคนเป็นอันหนึ่งอันเดียว มุ่งหน้าไปสู่เป้าหมายเดียวกัน!"
211130-118 = "เป็นโรงเรียนในอุดมคติที่สมบูรณ์แบบราวกับภาพวาด! เหมือนเกเฮนน่าในอดีตยังไงล่ะ!"
211130-119 = ""
211130-121 = ""
211130-123 = ""
211130-124 = "อืม... ถ้าทุกคนเป็นอันหนึ่งอันเดียวกันหมด มันจะไม่น่าเบื่อเกินไปหน่อยเหรอ?"
211130-125 = ""
211130-128 = ""
211130-129 = "ไม่หรอก! เพราะมันไม่ใช่เรื่องง่ายต่างหากล่ะ ถึงได้ทั้งยิ่งใหญ่และน่าสนุกไง!"
211130-130 = "ถ้าทุกคนคิดเหมือนกันหมด ละครกับเพลงก็คงมีแต่แบบเดียวกันไปหมดไม่ใช่เหรอ?"
211130-131 = "ฉันว่าการมีความคิดที่หลากหลายต่างหาก ถึงจะทำให้มันน่าสนุก..."
211130-132 = "..."
211130-134 = "อ๊ะ มายูมิจังพูดไม่ออกแล้ว"
211130-136 = "นะ... นั่นมันคนละเรื่องกัน! เนื้อหากับ เอ่อ อะไรนะ? ทิศทางโดยรวมน่ะ! มันคนละเรื่องกัน!"
211130-137 = "หืม..."
211130-138 = ""
211130-140 = ""
211130-141 = "โช...!"
211130-143 = "โชโกะ!!"
211130-144 = ""
211130-146 = ""
211130-148 = ""
211130-149 = "โชโกะ! มัวคิดอะไรอยู่ตั้งนาน? รีบอธิบายรายละเอียดให้ฟังเร็วเข้า!"
211130-150 = ""
211130-152 = ""
211130-153 = "อ่า..."
211130-154 = "โชโกะจัง เป็นอะไรไป? มีเรื่องอะไรเหรอ?"
211130-155 = "เปล่าค่ะ แค่มีเรื่องให้คิดน่ะค่ะ"
211130-156 = "อะไรเหรอ?"
211130-157 = "..."
211130-158 = "เห็นทีคงต้องลองเข้าไปในห้องกระจายเสียงกันดูแล้วละค่ะ"
211130-160 = "อ๋อ เรื่องผีนั่นเอง ก็จริงนะ เรื่องนั้นก็คงต้องสืบให้รู้เรื่องจนถึงที่สุดเหมือนกัน"
211130-162 = "แต่จะเข้าไปได้ยังไงล่ะ?"
211130-163 = "คงต้องไปเจรจากับแพนเดโมเนียม โซไซตี้ให้รู้เรื่องไปเลยค่ะ..."
211130-164 = "ว้าว ประกาศได้เท่มาก!"
211130-165 = "ช่วงที่ผ่านมา พวกเราก็ขยายกำลังขึ้นมากแล้ว ต่อให้เข้าไปพูดคุยกันซึ่งๆ หน้า ตอนนี้ก็คงไม่เป็นรองใครแล้วละค่ะ"
211130-167 = "จู่ๆ เรื่องก็จริงจังขึ้นมาเลยแฮะ... แต่ยังไงก็เอาใจช่วยนะ"
211130-168 = "อื้ม! เรื่องนี้ก็อาจเปล่งประกาย~ ในแบบของมันเหมือนกัน!"
211130-169 = "แต่ก่อนอื่น..."
211130-170 = ""
211130-172 = ""
211130-174 = ""
211130-175 = "ขอสั่งไวท์ช็อกโกแลตชิปแฟรบปูชิโน่เพิ่มอีกแก้วได้มั้ยคะ คุณครู"
211130-176 = ""
211130-179 = "[ns] \"สั่งเพิ่มอีกกี่แก้วก็ได้เลย...\""
211130-184 = "ตอนต่อไป;เงาใต้เปลวไฟ"
