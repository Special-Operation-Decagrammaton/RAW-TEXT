[translation]
211130-1 = "제13화;숲속의 나무"
211130-7 = "안녕하십니까, 하타미 에리카 씨. 요자쿠라 키라라 씨."
211130-12 = "어라, 우리를 알아?"
211130-13 = "그쪽은……"
211130-14 = "아, 요즘 흥한 동아리의 구성원이지? 이름이~"
211130-16 = "이가라시 쇼코입니다."
211130-17 = "아! 그러네~! 우리 같은 학년이잖아. 알고 있었어?"
211130-18 = "어느 정도는요."
211130-19 = "헤헤, 반가워! 그런데 우리한테 뭔가 볼일이 있었던 거야?"
211130-26 = "안녕~! 물어볼 게 있는데 잠깐 시간 괜찮을까?"
211130-27 = "아아, 강요하는 건 아니야. 안 되면 어쩔 수 없고."
211130-29 = "어라, 많이 보던 얼굴들이네."
211130-30 = "[s] \"안녕. 키라라, 에리카.\""
211130-31 = "선생님까지? 우와, 무슨 일이야?"
211130-32 = "간단한 질문입니다만, 혹시 시간 괜찮으실까요?"
211130-33 = "아아, 얼마든지. 이제 집에 가려고 하고 있었걸랑."
211130-34 = "그렇습니까. 괜찮으시다면 잠시 이야기를."
211130-36 = "좋아좋아, 새로운 친구는 언제나 환영이니까."
211130-40 = "역시~ 이 가게의 화이트 초코가 제일 맛있단 말야."
211130-41 = "이럴 것까진 없지만, 사준다니 고맙게 먹을게."
211130-43 = "내가 사는 거니까, 마음껏 먹도록 해. 얼마든지 더 시켜도 좋아."
211130-44 = "-라고 선생님은 생각했습니다."
211130-45 = "[s] \"또 이렇게 된 거냐……!\""
211130-46 = "아하하. 이런 분위기구나. 역시 선생님은 어딜 가도 잘 어울리네."
211130-47 = "그래서, 무슨 이야기인데?"
211130-48 = "오케이, 그럼 단도직입적으로 물어볼게."
211130-49 = "저번에 둘이서 교내 방송했던 적 있었잖아?"
211130-50 = "아, 그거."
211130-51 = "한 번이었지만 꽤 재미있었지! 그런 거 처음 해봤거든."
211130-52 = "재흥위원회도 방송에 관심이 있는 거야?"
211130-53 = "어, 조금? 그런데 지금은 그거 말고 조사할 내용이 있어서."
211130-54 = "그때 둘이 방송한 이후부터 교내 방송이 중단되었는데…… 혹시 무슨 일이라도 있었어?"
211130-55 = "아, 그러게. 우리 다음부터 방송 안 나오더라."
211130-56 = "실수하거나 뭘 망가뜨린 건 없었는데. 왤까?"
211130-57 = "우리가 너무 잘해서, 그 다음 사람이 부담됐으려나?"
211130-58 = "에이, 그럴 리가."
211130-59 = "그런데 그 후로 딱히 예전 방송부장이 복귀했다거나 하는 얘기도 없었구나."
211130-60 = "그때 우리한테 계속 방송을 진행해 보면 어떻겠냐는 이야기도 있었는데."
211130-61 = "원래 하던 사람이 하는 게 좋을 것 같아서 거절했지."
211130-66 = "그 후로 방송이 중단되었고……"
211130-67 = "혹시, 두 분께서 방송을 진행하던 때 뭔가 이상한 점은 없으셨나요?"
211130-68 = "이상한 점……?"
211130-69 = "뭔가 사고가 있었다거나, 들리지 말아야 할 소리가 들렸다거나……."
211130-70 = "아, 잠깐 삐이- 하는 소리가 들리긴 했었어. 엄청 높은 고주파음? 그런 거 있잖아."
211130-71 = "……그렇습니까?"
211130-72 = "응. 에리 쨩이 금방 해결했지만!"
211130-74 = "단순히 선이 꼬인 거라서, 그냥 선을 잘 풀어주는 걸로 해결했었지. 별거 아니었어."
211130-75 = "상황은 그걸로 끝인가요?"
211130-79 = "어…… 아."
211130-80 = "그러고 보니 그때 뭔가 이상한 소리를 들은 것 같거든."
211130-81 = "응? 그런 게 있었어?"
211130-82 = "어. 나만 들은 것 같아서 아무한테도 얘기하지는 않았지만 말이야."
211130-84 = "무슨 소리였죠……?"
211130-85 = "글쎄…… 여자 목소리였고……"
211130-86 = "어떤 단어를 말하는 것 같은?"
211130-87 = "뭐였더라. 철혈, 질서…… 뭐 그런 거였는데. 잘은 기억 안 나네."
211130-91 = "어, 에리 쨩? 이렇게 불러도 되나?"
211130-92 = "물론! 에리카라고 해도 돼."
211130-93 = "에리카 쨩은, 단어가 명확하게 들렸던 거야? 우리가 들은 건 정확하지 않은 소리였는데."
211130-94 = "어, 나도 완전 자세히 들은 건 아니야. 대략 저런 느낌?"
211130-95 = "헤에…… 신기하네."
211130-96 = "그런데 그건 왜 물어보는 거야?"
211130-97 = "아, 우리 지금 귀신 소동을 해결하고 있거든."
211130-98 = "와앗- 뭐야, 그거! 엄청 재미있어 보이는데! 반짝반짝해!"
211130-99 = "어쩌다 보니 고민해결 같은 걸 하게 돼서. 야핫."
211130-100 = "재흥위원회는 그런 것도 하는 거야? 아하핫! 재밌겠다!"
211130-102 = "어때, 관심 있어? 재흥위원회 가입할래?"
211130-103 = "아, 아쉽게도 우리도 동아리가 있어서. 우린 반짝반짝부거든."
211130-104 = "너희라면 괜찮을 거 같은데! 함께 게헨나를 위대하게 만드는 거야! 어때?"
211130-105 = "위대한 게헨나라……."
211130-106 = "너무 위대해져도 곤란하지 않나? 하핫."
211130-107 = "응? 그게 왜? 우리는 키보토스에서 게헨나를 가장 위대하게 만들 건데."
211130-108 = "글쎄…… 나한테는 너무 부담스러운 타이틀일지도."
211130-109 = "아, 너희가 잘못되었다는 건 아니야. 그냥 나는 좀 스케일이 작은 편이라."
211130-110 = "있지, 위대한 게헨나는 어떤 거야?"
211130-114 = "흠흠, 위대한 게헨나란!"
211130-115 = "질서정연한 규칙과 통제 아래 모두가 하나되어,"
211130-117 = "한마음 한뜻으로 하나의 목표를 향해 달려가는!"
211130-118 = "그림으로 그린 듯 이상적인 학원이야! 마치 과거의 게헨나처럼 말이지!"
211130-124 = "어, 모두가 한마음이면 좀 재미없는 거 아니야?"
211130-129 = "아니지! 그거야말로 쉬운 일이 아니기 때문에 위대하고 재미있는 거야!"
211130-130 = "만약 모두 같은 생각이라면, 드라마나 음악도 전부 다 똑같은 것만 나오지 않을까?"
211130-131 = "이런 생각도 있고, 저런 생각도 있어서 비로소 재미있는 게 아닌가 하는데……."
211130-132 = "……."
211130-134 = "어, 마유미 쨩 말문 막혔다."
211130-136 = "그, 그거랑은 다르지! 컨텐츠랑, 그, 뭐야? 전체 방향성이랑은! 다른 거니까!"
211130-137 = "흐음……."
211130-141 = "……쇼……!"
211130-143 = "쇼코!!"
211130-149 = "쇼코! 무슨 생각을 그렇게 하고 있어? 빨리 디테일을 설명해 줘!"
211130-153 = "아……."
211130-154 = "쇼코 쨩, 왜 그래? 무슨 일 있어?"
211130-155 = "아닙니다. 생각할 거리가 있어서요."
211130-156 = "뭔데?"
211130-157 = "……."
211130-158 = "아무래도 방송실에 들어가 봐야 할 것 같군요."
211130-160 = "아, 귀신 얘기였구나. 하긴. 그거도 끝장을 보긴 해야지."
211130-162 = "그런데 어떻게 들어가게?"
211130-163 = "……만마전과 담판을 지어야겠죠."
211130-164 = "우와, 멋진 선언!"
211130-165 = "그동안 저희도 체급을 키웠으니, 이제는 정면에서 이야기해도 밀리지는 않을 겁니다."
211130-167 = "갑자기 묵직한 이야기가 됐네…… 아무튼 응원할게."
211130-168 = "응! 이것도 나름 반짝반짝~ 할지도!"
211130-169 = "……그전에……"
211130-175 = "화이트 초코칩 프라푸치노 하나만 더 시켜도 될까요? 선생님."
211130-179 = "[ns] \"얼마든지 더 시켜도 좋아…….\""
211130-184 = "다음화;불꽃 아래의 그림자"
