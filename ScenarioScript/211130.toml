211130-94 = "Um, I'm not sure I'm such a reliable source. It was something about blood and stuff, but don't quote me."
211130-95 = "Huh... Interesting."
211130-96 = "By the way, why are you asking us about all this?"
211130-97 = "Oh, we're trying to solve a ghostly mystery."
211130-98 = "Wow, how cool! That sounds so fun! There's a certain \"twinkle\" to it!"
211130-99 = "We somehow ended up being student counselors...and paranormal investigators. Yaha!"
