211130-43 = "\"I'm buying, so enjoy to your heart's content. Order as much as you like!\""
211130-44 = "...That's what you were about to say, isn't it, Sensei?"
211130-45 = "[s] \"Oh, this again...!\""
211130-46 = "Ahaha. I assume that's an inside joke. You really hit it off with everyone, Sensei."
211130-47 = "So, what did you want to talk about?"
211130-48 = "Great! Then I'll get straight to the point."
211130-49 = "You two hosted a school broadcast together, right?"
211130-50 = "Ah, yeah. We did."
211130-51 = "One night only, but it was a blast! I'd never done one before, and then Erika got to sing!"
211130-52 = "Is the Heritage League looking into broadcasting?"
211130-53 = "Um, we wouldn't rule it out. But there's something else we need to figure out first."
211130-54 = "During your last school broadcast... Did something happen?"
211130-55 = "Ah, right. That whole program shut down after our episode."
211130-56 = "I wonder why. Iroha said people loved it, and we didn't misbehave. Hmm..."
211130-57 = "Maybe we were just SO GOOD that no one can take the pressure of following us?"
211130-58 = "Haha. Yeah, right."
211130-59 = "I figured the former Broadcasting Club president would have returned by now."
211130-60 = "We were even asked if we wanted to continue! So we weren't fired, or anything!"
211130-61 = "But we declined because we thought it would be more respectful. Someone in the actual Broadcasting Club should have had a chance..."
