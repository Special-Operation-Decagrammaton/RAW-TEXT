211130-69 = "Like an accident or a strange sound..."
211130-70 = "Yeah, there was this quick beep. It was really high-pitched. Almost like a test tone, super annoying."
211130-71 = "...Is that so?"
211130-72 = "Yup. But Eri fixed it on the spot!"
