211130-102 = "Oh, are you interested? Do you want to join the Heritage League?"
211130-103 = "Ah, sorry, but we're already in a club. In fact, we ARE the Twinkle Twinkle Club."
211130-104 = "I think you'd both be perfect fits! Let's restore glory to Gehenna together! What do you say?"
