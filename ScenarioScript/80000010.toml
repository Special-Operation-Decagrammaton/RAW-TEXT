[translation]
80000010-1 = "불행한 미식가"
80000010-2 = "백귀야행 학원 인근의 화과자집"
80000010-5 = "선생님이 말한 화과자집이 바로 여기야? 초콜릿을 묻힌 경단을 판다는 그 가게가?"
80000010-6 = "선생이 내가 모르는 경단 맛집을 알고 있다고 했을 때는 조금 의심스러웠는데……"
80000010-7 = "이렇게 외진 곳에 있다면 다른 학생들이 모르는 이유를 알 것 같기도 하네. 새로운 맛집을 소개시켜 줘서 고마워."
80000010-8 = "어디 보자. 선생의 말처럼 신기한 맛의 경단이 가득 있네."
80000010-9 = "이건 블루베리 가루를 쓴 것 같고……"
80000010-10 = "저건 커스타드 크림인가?"
80000010-11 = "모든 메뉴가 하나같이 흥미로워 보여서, 전부 먹어보고 싶을 정도야!"
80000010-12 = "[s] \"그럼 모두 먹어보면 되잖아?\""
80000010-13 = "그건 안 돼! 이번 달에는 비싼 요리를 자주 먹으러 다녀서 지갑 사정이 아슬아슬하다고!"
80000010-14 = "게다가 나는 아카리가 아니니까. 먹을 수 있는 음식의 개수에도 한계가 있으니……"
80000010-15 = "아아— 나도 선생님처럼 지갑도 위장도 튼튼한 어른이 되고 싶어—"
80000010-16 = "[s] \"어른이라고 해서 다 그런 건 아니지만.\""
80000010-17 = "그런가? 여하튼 먹을 수 있는 경단의 수에는 한계가 있으니 신중하게 선택을 하는 게 좋겠어."
80000010-18 = "일단은 이곳의 시그니처 메뉴라는 초콜릿 경단을 먹어볼까?"
80000010-19 = "단맛과 쓴맛이 섞인 소스라고 생각하면, 미타라시 당고에 가까울지도…… 어쨌든 먹어 보면 알겠지."
80000010-21 = "여기, 초콜릿 경단 2인분 주세요!"
80000010-22 = "[s] \"다른 메뉴를 섞어서 주문하는 게 좋지 않겠어?\""
80000010-23 = "응? 나 혼자 다 먹으려고 주문한 거 아닌데?"
80000010-24 = "다른 하나는 선생님을 위해 내가 특별히 주문하는 거야."
80000010-25 = "선생님이 아니었더라면 이곳에 맛집이 있다는 것도 몰랐을 테고, 여기까지 안내해 준 답례를 하고 싶기도 하고……"
80000010-26 = "또 마침 오늘이 발렌타인 데이이기도 하고……"
80000010-27 = "여하튼 내가 특별히 한턱 내는 거니, 감사히 여기라고!"
80000010-32 = "주문하신 초콜릿 경단 2인분 나왔습니다."
80000010-33 = "아, 드디어 나왔다."
80000010-34 = "자, 그럼 잘 먹겠습니다—"
80000010-42 = "여기가 그 초콜릿 경단을 판다는 그 괘씸한 화과자집이냐?"
80000010-43 = "경단에 그런 사도를 행하다니…… 우리 모찌모찌 헬멧단이 가만두지 않겠다!"
80000010-44 = "맞아! 경단에 뿌려도 좋은 건 콩가루와 간장 정도밖에 없다고!"
80000010-45 = "우선은 여기에 있는 경단을 몽땅 내다 버려야—"
80000010-47 = "내 경단……"
80000010-48 = "내 경단이 바닥에 떨어졌잖아…… 한 입도 먹지 못한 건데……."
80000010-49 = "너, 너, 넌 누구야?"
80000010-50 = "나는 그저…… 느긋하게 경단을 즐기고 싶었을 뿐인데……"
80000010-51 = "왜 다들 내가 경단을 먹을 때만 나타나서 방해하는 건데!"
80000010-52 = "뭐, 뭔가 오해를 한 것 같은데 우리는 너를 처음 본다고!"
80000010-53 = "이제 초콜릿 경단은 아무래도 상관없어……."
80000010-54 = "너희들 전부 가만두지 않겠어!"
80000010-61 = "(이후, 화과자집을 습격한 헬멧단 학생들은 분노한 준코에 의해 모두 체포되었다.)"
80000010-62 = "(다만 소동으로 인해 음식이 모두 불타버린 탓에, 준코는 끝끝내 경단을 맛보지 못했다…….)"
