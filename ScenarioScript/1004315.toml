[translation]
1004315-1 = "새겨진 것은 순정"
1004315-4 = "(시간에 맞춰 와카모와 약속한 해변에 나왔다.)"
1004315-8 = "아아, 도착하셨군요."
1004315-9 = "기대하던 둘만의 해변. 이 순간을 얼마나 기대했던지."
1004315-10 = "[s1] \"깨끗하고 예쁜 해변이네.\"\n[s2] \"주변에 사람도 없고.\""
1004315-13 = "우후훗, 당신과의 만남이 방해받는 건 용납할 수 없었기에."
1004315-14 = "이 와카모, 먼저 도착해 주변을 정리하고 있었답니다."
1004315-15 = "작은 벌레 한 마리 없도록 말이죠."
1004315-16 = "[s3] \"어…… 그 정리라는 거…….\"\n[s4] \"의미 그대로의 정리겠지?\""
1004315-19 = "정리에 다른 뜻이 있는지요?"
1004315-20 = "벌레 외에도 모래사장의 날카로운 조개껍질이라거나, 해변으로 떠밀려온 쓰레기를 열심히 치웠습니다만."
1004315-24 = "혹시…… 상태가 마음에 안 드시는 건가요?"
1004315-25 = "[s] \"아니야! 오해해서 미안해! 정말 마음에 들어!\""
1004315-26 = "우후훗, 그렇다면 다행이군요."
1004315-27 = "겸사겸사 품행이 불량한 인원도 같이 정리한 보람이 있어요."
1004315-28 = "[s] \"오해한 게 아니었잖아?!\""
1004315-29 = "걱정 마시길."
1004315-30 = "이곳에서 싸움이 일어나면 당신이 불편해할 것을 알기에, 조용히 말로 설득을 했답니다."
1004315-31 = "다들 제 뜻을 이해했는지 서둘러 자리를 피하더군요."
1004315-32 = "[s] \"그, 그렇다면 다행이네.\""
1004315-33 = "자, 그럼 어서 둘만의 해변을 즐기도록 하죠."
1004315-34 = "[s] \"와카모는 해변에서 뭘 하고 싶어?\""
1004315-35 = "와카모는……. 당신과 해변을 걷고 싶습니다."
1004315-36 = "파도 소리를 들으면서 소소한 대화를 나눌 수 있다면 그것만으로도……."
1004315-37 = "[s] \"그거면 충분해?\""
1004315-38 = "네. 충분합니다."
1004315-39 = "평소 격무에 시달리는 당신에게도 여유로운 시간이 필요하겠죠."
1004315-40 = "해변을 걷는 것 정도면 좋은 안식이 될 터."
1004315-41 = "그런 시간을 함께 즐길 수만 있다면…… 이 와카모, 더 이상 바랄 게 없습니다."
1004315-42 = "[s] \"응. 그렇다면…….\""
1004315-44 = "(와카모와 함께 해변을 걷기 시작했다.)"
1004315-50 = "우후훗, 이런 평온한 시간이 영원했으면 좋으련만."
1004315-51 = "[s5] \"와카모의 일상이 평화로워진다면—\"\n[s6] \"이렇게 지낼 기회도, 더 늘어날 텐데.\""
1004315-57 = "……그럴 수는 없습니다."
1004315-58 = "저에게 있어, 일상은 평온과 거리가 멀었기에."
1004315-59 = "그리고…… 저는 그 누구도 신용하지 않습니다."
1004315-60 = "제가 신뢰하는 사람은 오직 당신, 선생님뿐."
1004315-61 = "[s] \"와카모는 어째서 나를 믿는 거야?\""
1004315-62 = "……당신을 보는 순간, 마음을 빼앗겨 버렸기 때문입니다."
1004315-63 = "저는 그런 자신을 이해할 수 없었습니다."
1004315-64 = "아무도 믿지 않기로 했던 제가, 어째서 당신에게 빠지고 말았던 것인지."
1004315-65 = "그래서 계속 먼발치에서 당신을 바라보았습니다."
1004315-66 = "정말로…… 신뢰할 수 있는 분인지 아닌지……"
1004315-67 = "당신을 더 알고 싶어서."
1004315-68 = "그 결과 한 가지 사실을 알 수 있었죠."
1004315-69 = "당신은 정말로 좋은 사람이라는 것을."
1004315-70 = "언제, 어느 때라도 상대방을 진중하게 대하는 분이라는 것을 알았습니다."
1004315-71 = "그렇기에 저는 믿어 보기로 했답니다."
1004315-72 = "이 사람이라면, 나를 이해해 줄 거라고요."
1004315-73 = "……답변이 되었을까요?"
1004315-74 = "언젠가, 그동안 하지 못했던 저의 모든 이야기를 들려드릴 터이니."
1004315-75 = "[s] \"응. 믿고 있을게.\""
1004315-76 = "우후훗, 감사합니다. 당신이 선생님이어서 저는 정말로 행복하답니다."
1004315-77 = "[s] \"나도 와카모가 내 학생이라 다행이야.\""
1004315-78 = "아앗…… 이토록 거짓 없는, 이런 감미로운 말씀을……!"
1004315-79 = "그런 의미에서……."
1004315-80 = "다, 당신도…… 양산 아래로…… 들어오지 않으시겠어요……?"
1004315-81 = "딱히 다른 의도가 있다기보다는……."
1004315-82 = "그저 햇빛에 당신의 피부가 상할 것이 염려되어 그런 것이니……."
1004315-86 = "[ns] \"……와카모는 같이 우산을 쓰고 싶었구나?\""
1004315-87 = "윽, 역시 눈치채고 계셨는지요."
1004315-88 = "제 마음을 다 꿰뚫어 보고 계셨다니. 이 와카모, 굴을 파고서라도 숨고 싶은 기분입니다."
1004315-89 = "아아, 안 되겠어요. 더 이상 당신을 바라볼 면목이……!"
1004315-93 = "[ns7] \"엇, 와카모?!\"\n[ns8] \"괜찮아! 솔직해져도 괜찮으니까!\""
1004315-96 = "……!!"
1004315-97 = "마, 말씀대로입니다. 자신에게 솔직해져야……."
1004315-98 = "부끄럽다고 해서 도망쳐서는……."
1004315-99 = "알겠습니다. 저 와카모, 도망치지 않겠어요!"
1004315-103 = "에잇……!"
1004315-107 = "아아, 가까이에서 느껴지는 당신의 체온. 마치 꿈과 같군요."
1004315-108 = "……용기를 내길 잘했어요."
1004315-113 = "저 와카모. 오늘을 기념해 이 양산을 저의 보물로 삼겠습니다."
1004315-114 = "서로의 마음을 확인한 중요한 날에 쓴 우산.#n사랑의 징표로 이 이상의 물건은 없습니다."
1004315-115 = "그래요. 이쪽의 대나무살에 서로의 이름을 적는 거예요."
1004315-116 = "이걸로 우리의 사랑이 영원히 기록될……."
1004315-121 = "앗, 저쪽에 있는 저 녀석은 설마……!"
1004315-122 = "……하필이면 이런 좋을 때에."
1004315-123 = "우후훗, 당신의 앞에서 소란을 피울 순 없으니 오늘의 여흥은 여기까지 하도록 하죠."
1004315-124 = "실례지만 먼저 자리를 피하겠습니다."
1004315-128 = "[ns9] \"아니. 도망칠 거면 같이 가자.\"\n[ns10] \"와카모는 내 학생이니까.\""
1004315-131 = "저와 선생님이 함께……?"
1004315-132 = "……아아!"
1004315-133 = "전에 못다 한, \"아하하, 나 잡아봐라~\" 맞죠?!"
1004315-134 = "[s] \"조, 조금 다른 것 같지만 말이야.\""
1004315-135 = "거, 거기 서라아아아……!!"
1004315-142 = "우후훗, 그럼 술래가 출발했으니 당신의 바람대로 함께 도망치도록 하죠."
1004315-143 = "이 키보토스의 끝. 까. 지."
1004315-145 = "(……그렇게 와카모와 오랜 시간 둘만의 도피를 즐겼다.)"
