[translation]
10044080-1 = "제8화;할 일은 변하지 않아"
10044080-2 = "……"
10044080-3 = "저…… 그…… 괜찮은 거 맞나요……?"
10044080-4 = "뭐가-?"
10044080-5 = "화물 말이에요, 화물…… 우, 우리가 운송하고 있는 거요……!"
10044080-6 = "그러니까 그게 뭐-?"
10044080-7 = "아, 아니…… 문제라고 생각해서 문제인 것 같기도 한데……"
10044080-8 = "아오, 답답해! 속 시원하게 그냥 말해봐!"
10044080-12 = "……보통 저런 고가의 귀중품을 이런 화물 열차로 운송하는 일이 많나요?"
10044080-13 = "글쎄? 별로 없지 않을까?"
10044080-14 = "그, 그러니까요! 왜 하필 산업 자재 운송용으로 쓰이는 화물 열차에, 저렇게 비싼 것들을……??"
10044080-15 = "그것도 내용물을 알려주지 않은 상태로……? 이상하다구요……"
10044080-16 = "알려주긴 했지만 안 들었던 것뿐인데-?"
10044080-17 = "어, 어쩌면 간부님들의 그런 무신경함까지 고려한……?"
10044080-19 = "……저는 이게 어떤 음모가 아닐까, 하는 생각이 들거든요……"
10044080-24 = "파햐햐! 만화 너무 보는 거 아냐?"
10044080-26 = "이씨, 그렇게 웃어넘기지 말고요! 무, 물론 많이 보긴 했지만!"
10044080-27 = "하필 이 열차를 운송하게 되었을 때 발차 시스템이 고장 나고, 크로노스에서 이 열차를 노리고 보도를 때리고, 각종 문제아들한테 쫓기고……!"
10044080-28 = "이, 이 모든 과정이 과연 우연일까요?"
10044080-29 = "발차 시스템 고장이야 그렇다 쳐도 뒤에 일어난 일은 우리가 실수한 거잖아."
10044080-30 = "그, 그게 누군가의 의도였다면?"
10044080-36 = "뭔가…… 어떤 어두운 세력이…… 아무것도 모르는 우리를 이용하고 있는 거라면요?"
10044080-37 = "워, 원래 저런 고가의 미술품? 예술품? 같은 걸로 도, 돈세탁을 한다고 들었어요."
10044080-38 = "아, 히카리도 들어본 거 같아-"
10044080-39 = "우, 우리가 키보토스를 뒤흔들 거대한 음모에 휘말린 거라면……!!"
10044080-40 = "서, 선생님은 어떻게 생각하세요? 수상하지 않으세요……?"
10044080-41 = "[s1] \"듣고 보니 조금은……\"\n[s2] \"글쎄……\""
10044080-44 = "그 폭주족! 폭주족들도 이상해요……! 계속 우리를 따라오잖아요?"
10044080-45 = "피자의 원한이라기엔 부, 분명 뭔가 더 있어요……!!"
10044080-46 = "우리- 팬일지도-?"
10044080-47 = "그럴 리 없잖아요……"
10044080-48 = "[ns] \"아오바는 어떻게 하고 싶은 거야?\""
10044080-49 = "……"
10044080-50 = "뭐, 뭘 어떻게 하고 싶다는 건 아니에요. 그냥, 그냥……"
10044080-51 = "걱정이 돼서요. 이 물건이 어떤…… 안 좋은 일에 쓰일 수도 있으니까?"
10044080-52 = "그렇게 될 경우에 그걸 운송한 우리에게도 책임이 있지 않나……? 싶은……"
10044080-53 = "만약 우리가 운송하는 화물이 나쁜 용도로 쓰인다면…… 그런 경우에는 이걸 그대로 운송하는 게 맞는지……"
10044080-54 = "그, 그냥 그런 생각들을 좀 했어요……"
10044080-58 = "뭐, 어디가 걱정되는지는 알겠어. 실제로 그런 경우도 있고 말야."
10044080-59 = "하지만 중요한 건 우리가 할 일이 변하지 않았다는 사실이지."
10044080-60 = "우리가 할 일……?"
10044080-61 = "누군가의 니즈가 있었고, 우리는 그걸 받아들였고, 목적지까지 화물을 운송한다. 끝."
10044080-62 = "간단하잖아?"
10044080-63 = "그, 그건 맞지만……"
10044080-65 = "생각 없이 움직이자는 게 아냐- 시킨 일이니까 한다는 것도 아니고-"
10044080-66 = "하기로 한 일은 확-실하게 하자는 거지-"
10044080-67 = "그게 철도를 관할하는 하이랜더 학생으로서 우선 가져야 할 책임감이고."
10044080-69 = "책임감……"
10044080-70 = "그리고- 우리가 잘 모르는 일에 너무 신경 쓸 필요 없어-"
10044080-71 = "모르는 건 모르는 거니까- 생각하는 것만으로도 스트레스-"
10044080-72 = "제 스트레스의 원흉에게 듣고 싶은 말은 아니네요……"
10044080-73 = "……"
10044080-74 = "그, 그래도…… 조금은 불안함이 줄어든 것 같아요……"
10044080-75 = "파햐햐, 그렇지? 너무 걱정할 필요 없어. 어떻게든 되겠지!!"
10044080-76 = "그 대책 없이 즐거운 마음가짐은 좀 본받고 싶을 정도네요……"
10044080-78 = "[ns3] \"개인적으로 의무와 책임은 어른의 몫이라고 생각하지만\"\n[ns4] \"학생들에게도 그런 마음이 있다는 건 잘 알아.\""
10044080-82 = "[ns5] \"그리고 그 결정이 본인의 생각에 따른 거라면,\"\n[ns6] \"나는 선생님으로서 전력으로 응원할게.\""
10044080-85 = "파햐햣! 그래, 나쁠 거 없다고. 선생님의 응원이나 실컷 받아볼까?"
10044080-86 = "선생님, 치어리더 옷 입어줘-"
10044080-87 = "……학생 스스로의 결정을 존중한다는 말씀이군요……"
10044080-91 = "하아…… 그렇네요. 지금은 걱정해 봤자 아무 의미도 없을 거고……"
10044080-92 = "일단, 지금은 운송 임무를 완수하는 게 중요하네요……"
10044080-93 = "[s] \"응. 이 화물이 어디에 쓰일지는 그 뒤에 알아보도록 하자.\""
10044080-94 = "네, 네에……"
10044080-95 = "……쓰, 쓸데없는 소리였으니까 너무 진지하게 생각해 주지 않으셔도 돼요……"
10044080-96 = "[s] \"쓸데없다고 생각하지 않으니까.\""
10044080-97 = "……네, 네에……"
10044080-98 = "감사합니다, 선생님……"
10044080-99 = "……"
10044080-103 = "왜 또 그렇게 심각한 표정을 짓고 계신가요……"
10044080-104 = "지금 열차 속도가 계속 빨라지고 있지 않아?"
10044080-105 = "엑……? 확인해 볼게요."
10044080-112 = "……"
10044080-113 = "어? 왜 최고 제한 속도보다 더 빠르게 달리고 있지……?"
10044080-115 = "리미터 해제- 진심 열차-?"
10044080-116 = "이, 이상한데요. 잠깐 늦춰볼게요……"
10044080-121 = "어?"
10044080-126 = "……어어??"
10044080-128 = "왜-?"
10044080-130 = "……제동 장치가 작동을 안 하는데요?"
10044080-131 = "응?"
10044080-132 = "응?"
10044080-134 = "[ns] \"……으응??\""
