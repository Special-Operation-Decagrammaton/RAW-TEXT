[translation]
1006315-1 = "속일 권리"
1006315-2 = "(코유키의 연락을 받은 뒤, 반성실로 향했다.)"
1006315-8 = "(문을 열자마자 보인 것은…….)"
1006315-9 = "(책상 가운데에 놓인 큼직한 유리구슬이었다.)"
1006315-10 = "(……가운데에 네잎클로버가 박혀 있는.)"
1006315-11 = "[ns] \"이, 이건…….\""
1006315-14 = "보셨군요, 선생님!"
1006315-15 = "어때요? 저번에 선생님이 찾아 주신 네잎클로버가, 유리 공예품으로 승화되었다고요?"
1006315-16 = "이렇게만 해두면 말라서 부스러질 일도 없고……."
1006315-17 = "잃어버릴 일도 없다고요!"
1006315-18 = "이대로 가보로 영원히 보관할 수 있답니다! 니하하하!"
1006315-19 = "[ns] \"감동……!\""
1006315-21 = "[ns] \"그나저나 혹시 뭐 잃어버렸다고 하지 않았니……?\""
1006315-22 = "맞습니다!"
1006315-23 = "이 네잎클로버를 찾아 주신 그 능력으로……!"
1006315-24 = "제 동전 좀 찾아주세요, 선생님!"
1006315-25 = "[s1] \"동전?\"\n[s2] \"……정 급하면 일단 내가 빌려줄까?\""
1006315-28 = "아니! 그냥 평범한 동전이 아니라고요?"
1006315-29 = "한구석에 작은 구멍이 뚫려 있는…… 아주 특별한 동전이에요."
1006315-30 = "[s] \"혹시…… 이거?\""
1006315-31 = "……예?"
1006315-36 = "(주머니에 넣어두었던 것을 꺼내어 내밀었다.)"
1006315-42 = "헉?! 어째서 선생님이 이 동전을 갖고 있는 거죠?!"
1006315-43 = "설마 저번에 저한테 그 얇은 책……들을 들킨 것에 대한 복수……?!"
1006315-44 = "[s] \"무슨 소리니. 오다 주운 거거든.\""
1006315-45 = "에-에! 괜히 겸연쩍을 때 둘러대는 예의 그 상투적인 표현!"
1006315-46 = "예? 진짜로 반성실 앞 복도에서 주운 거라고요?"
1006315-47 = "어…… 그…… 진짜로요?"
1006315-48 = "죄송합니다……."
1006315-49 = "아까 수업 다녀올 때 흘렸었나……."
1006315-56 = "(구멍 난 동전을 코유키의 손에 쥐여 주었다.)"
1006315-57 = "니하! 역시 선생님을 부른 게 정답이었어!"
1006315-58 = "감사합니다, 선생님!"
1006315-59 = "후후 이 녀석, 드디어 다시 내 손안에 들어왔구나, 니하하하……."
1006315-60 = "[s3] \"그런데 그 동전은 뭐야?\"\n[s4] \"에러 화폐…… 같은 건가?\""
1006315-63 = "에러 화폐? 그게 뭔데요?"
1006315-64 = "아, 생산 과정에서 오류가 있어서 비싸게 거래되는 화폐요?"
1006315-65 = "아니거든요! 이건 제가 손수 뚫은 구멍이거든요! 공장제가 아니라 코유키 특제 수제품이거든요?!"
1006315-66 = "[s] \"다시 보니 진짜 동전도 아니네.\""
1006315-67 = "맞습니다! 오락실 전용 코인이에요."
1006315-68 = "[s5] \"어쨌거나…… 왜 뚫으신 거죠?\"\n[s6] \"학교 책상에 괜히 구멍 뚫어보는 그런 심리?\""
1006315-71 = "책상 굴착…… 확실히 즐거운 일이죠……."
1006315-72 = "하지만 말이죠. 후. 후. 후. 이건 그런 유치한 짓이 아니랍니다?"
1006315-73 = "이건 말이죠…… 제가 어릴 적 직접 만든 <승부 동전>이니까요!"
1006315-74 = "[s] \"승부 동전?\""
1006315-75 = "예! 이렇게 동전에 구멍을 뚫고, 거기에 실을 묶은 다음……."
1006315-76 = "실의 끝을 잡은 채로, 게임기에 넣어요. 그리고……."
1006315-77 = "[s7] \"오락이 끝나면, 실을 당겨서……\"\n[s8] \"다시 동전을 회수하는 거지?\""
1006315-80 = "맞아요! 선생님도 잘 아시는군요!"
1006315-84 = "[ns] \"그건 승부가 아니라 치트 동전이잖아……!\""
1006315-85 = "예? 그게 무슨 말씀이죠 선생님?"
1006315-86 = "이건 엄연히 정당한 승부를 위한 동전이었다고요?"
1006315-87 = "선생님도 인형 뽑기 해 보셨죠? 분명히 제대로 집었는데 집게가 인형을 툭 놔 버리는 거 본 적 있죠?"
1006315-88 = "그리고 저번에 <찻집등반> 할 때 저희한테만 자꾸 어려운 패턴 나오던 것도 봤죠?!"
1006315-89 = "이거 봐요, 오락기는 저희를 속인다고요!"
1006315-90 = "그러니까 우리에게도 오락기를 속일 권리가 있는 거예요!"
1006315-91 = "[s] \"세간에서는 보통 그런 걸 범죄라고 부른단다, 코유키 양.\""
1006315-92 = "큿……!"
1006315-93 = "선생님만은 저를 이해해 주실 줄 알았는데……!"
1006315-94 = "그, 그래도 이 동전은 안 드릴 거예요!"
1006315-95 = "애초에 이젠 쓸 수도 없다고요! 한두 번 썼더니 동네 오락기들이 전부 보안 업데이트를 해 버려서!"
1006315-96 = "[s] \"그런데 그걸 왜 그렇게 소중히 여기는 거야?\""
1006315-97 = "예? 그, 그건……."
1006315-101 = "……글쎄요?"
1006315-102 = "왜일까요, 으음……."
1006315-103 = "그냥 뭐…… 버리고 싶지 않다, 정도의 느낌?"
1006315-104 = "자, 자! 아무튼! 이왕 오셨으니 놀다 가시죠!"
1006315-105 = "마침 새로 나온 보드게임 확장팩까지 침대 밑에 숨겨 놨다고요?"
1006315-107 = "(이후 반성실에서 코유키와 보드게임을 즐겼다.)"
1006315-108 = "(그리고 나오자마자 발키리에서 진행하는 일일 공중도덕 교육에 코유키를 등록시켰다.)"
