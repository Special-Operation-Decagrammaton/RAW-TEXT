[translation]
10039040-1 = "제4화;아이돌의 길: 곡"
10039040-2 = "음음……. 어디 보자……. 체크……."
10039040-3 = "의상……안무 교육…… 다 됐고……."
10039040-4 = "감사해요, 선생님. 덕분에 순조롭게 진행되고 있네요."
10039040-5 = "이제 곡만 정하면 이 일도 끝……."
10039040-6 = "이제……. 끝……이네요. 이것도……."
10039040-10 = "[ns1] \"……마리?\"\n[ns2] \"뭔가 생각하고 있어?\""
10039040-13 = "……!? 으, 으응!? 아뇨! 아무것도 아니에요."
10039040-14 = "그냥 좀……. 저도 모르게 정리한 것들을 멍하니 보고 있었네요. 약간은 피곤했나 봐요. 헤헤."
10039040-15 = "이러고 있을 시간이 없는데 말이에요. 어서 곡을……."
10039040-16 = "역시 여기 있었구나, 선생님. 마침 좋은 타이밍이었군."
10039040-17 = "……? 응……?"
10039040-18 = "누가 오셨나요……?"
10039040-19 = "[ns3] \"……? 우타하?\"\n[ns4] \"어라, 이 목소리는…….\""
10039040-24 = "……후후. 이야기는 충분히 전해 듣고 왔다고."
10039040-25 = "서운할 뻔했잖아, 선생님. 아이돌이라니, 그런 재미있는……."
10039040-29 = "……중요한 걸 앞두고 나에게는 말 한마디 안 했다니."
10039040-30 = "[s5] \"……방금 전의 그 간극은 뭐야!?\"\n[s6] \"재미있는……! 지금 재미있는-이라고 했어!!\""
10039040-33 = "사소한 건 신경 쓰지 마. 아무튼 도움이 필요한 거지?"
10039040-34 = "뭐가 필요해? 의상? 안무……?"
10039040-35 = "……곡?"
10039040-36 = "곡이라. 마침 잘 되었네. 그러잖아도 준비해 둔 곡이 몇 가지 더 있었는데 말이야."
10039040-37 = "……응? 어째서 곡이 준비돼 있냐고?"
10039040-38 = "그야 당연히……."
10039040-39 = "……나도 출전할 예정이니까 말이지."
10039040-40 = "[s7] \"우타하가!?\"\n[s8] \"엔지니어부가!?\""
10039040-43 = "후후. 역시나 놀라는 표정이네."
10039040-44 = "아쉽지만 참여하는 건 나뿐이야. 이건 그룹 참여가 아니라 개인 참여니까."
10039040-45 = "히비키와 코토리에게도 이야기는 해 보았지만, 아쉽게도 음악의 방향성에서 차이가 있었거든."
10039040-46 = "두 사람에게는……. 조금 이른 장르였을지도 모르지."
10039040-47 = "하지만 그런 이들에게 자신이 사랑하는 것을 전파하는 것 또한 아이돌로서의 가치."
10039040-48 = "공연을 보고 나면, 두 사람도 생각이 달라질 거라고 믿고 있어."
10039040-49 = "아이돌의……가치……?"
10039040-50 = "그렇지. 누구든 아이돌 공연에 나가려는 이유가 있을 거 아냐?"
10039040-51 = "전하고픈 마음, 하고 싶은 말, 부르고 싶은 이름……."
10039040-52 = "혹은 회심작인 <미러볼 천둥이>의 진면목을 모두에게 보여주고 싶다든가. 이른바 무대에 선 사람의 '진심'이라는 거지."
10039040-53 = "많은 사람들 앞에서 그것을 드러내고 소통한다는 점에서, 아이돌은 마이스터와도 일맥상통한다고 할 수 있지."
10039040-54 = "그러고 보니 그쪽 분은……."
10039040-55 = "시스터후드의 시스터 님이라고? 아아. 그렇군."
10039040-56 = "……어라."
10039040-57 = "그렇군. 아이돌은 선생님이 아니라 시스터 님 쪽에서 준비하고 있었던 거구나."
10039040-58 = "[s9] \"무슨 생각을 하고 있던 거니…….\"\n[s10] \"학생 행사라고, 학생 행사.\""
10039040-61 = "농담이야, 농담."
10039040-62 = "아무튼 멋지네. 그런 거라면 더더욱 도와주고 싶은걸."
10039040-63 = "시스터님은 분명 멋진 아이돌이 될 테니까. 원석의 가능성을 보는 마이스터의 눈은 틀림이 없거든."
10039040-64 = "앗, 네, 네! 감사합니다!"
10039040-69 = "……? 어, 어라……?"
10039040-70 = "……저요? 혹시 방금 제 이야기셨나요?"
10039040-71 = "……? 응? 그런데?"
10039040-72 = "뭐야, 시스터 님이 아이돌 하려던 게 아니야? 그럼……."
10039040-73 = "역시 선생님이……?"
10039040-74 = "[s11] \"아니, 그럴 리 있겠냐고.\"\n[s12] \"방금 아니라고 했잖아.\""
10039040-77 = "아하하……. 말씀은 감사하지만, 저는 그냥 도와드리기만 하는 거라서요."
10039040-78 = "아이돌은 저 말고 다른 분들이 하시는 거예요. 저는 그분들을 위한 걸 찾았을 뿐이에요."
10039040-79 = "……?"
10039040-83 = "……흠……."
10039040-84 = "그렇구나. 이해했어."
10039040-85 = "아깝네. 정말 훌륭한 원석이라고 생각했는데 말이지."
10039040-86 = "그, 그럴 리가요! 말씀은 정말 감사하지만 저는 그런 사람이 아니에요……!"
10039040-87 = "그보다 방금 전에, 곡을 찾아 준다고 하셨던 거 같은데……. 정말이실까요?"
10039040-88 = "물론이지. 처음부터 그럴 생각으로 왔는걸."
10039040-89 = "괜찮지, 선생님? 내가 도와줘도, 문제없겠지?"
10039040-93 = "[ns13] \"응. 그럼 부탁할게, 우타하.\"\n[ns14] \"우타하라면 괜찮을 거야. 믿고 있다고.\""
10039040-96 = "후후. 기대받고 있네. 항상 이런 느낌이 나를 고양시킨다니까."
10039040-97 = "그럼 시스터 님은 먼저 이쪽으로 좀 가 주겠어? 나는 선생님에게 따로 할 이야기도 있어서."
10039040-98 = "여기는……?"
10039040-99 = "근처의 노래방이지. 곡의 선정은 직접 부르고 들어보는 것이 필수니까."
10039040-100 = "먼저 가 있으면 나도 금방 따라갈게. 혼자서도 갈 수 있지?"
10039040-101 = "네, 물론이죠!"
10039040-102 = "감사합니다, 우타하 씨! 그러면 저……. 먼저 가 있을게요!!"
10039040-108 = "……흠……."
10039040-109 = "……흐음……."
10039040-113 = "[ns15] \"……우타하.\"\n[ns16] \"할 말이라는 거, 마리에 대한 거지?\""
10039040-116 = "뭐, 길게 이야기할 건 아니야. 그냥 잠깐 하나만 확인할까- 해서."
10039040-117 = "아까 전의 그 아이……."
10039040-118 = "정말로 본인이 안 하는 거 맞아? 아이돌."
10039040-119 = "왜 그걸 또 묻냐고? 그야……."
10039040-120 = "……선생님도 알고 있잖아? 그 아이, 사실 꽤 하고 싶어 하는 상태라는 거."
10039040-121 = "본인만 본인에 대해 잘 모르고 있던 것 같은데 말이지. 어째서 말해주지 않는가 싶어서."
10039040-122 = "그냥 그게 궁금해서……. 물어보기 전에 돌아가면 잠을 못 잘 것 같았단 말이지."
10039040-123 = "……응?"
10039040-124 = "생각해 둔 게 있다고? 상황을 좀 보고 있어……?"
10039040-125 = "후후. 역시 그런 거였나……. 뭐, 선생님이니까. 어련히 알아서 하기야 하겠지만 말이지."
10039040-126 = "꽤 기대되네. 저 아이의 스테이지도."
10039040-130 = "그러고 보니, 선생님. 역시 선생님이라면 알아줄 거라고 생각하는데 말이야. 이번에 부를 노래 한 번 들어볼……."
10039040-131 = "[s] \"역시 그쪽이었잖아!!\""
10039040-133 = "(이후 우타하와 함께 노래방으로 돌아가, 마리의 곡 선정을 도와주었다.)"
10039040-140 = "- 곡 클리어 -"
10039040-145 = "(……다음 날.)"
10039040-146 = "세, 세상에, 이런……. 이런 정리를……."
10039040-147 = "이렇게까지……?"
10039040-148 = "으, 으음……. 뭔가 의도치 않게 대단히 죄송스러운 일을 하고 말았군요, 저희는."
10039040-149 = "이렇게까지 해주시는 걸 부탁드리려던 게 아니었는데……. 단지 저희 안들 중 적당히 골라 주시는 것 정도를 생각해서……."
10039040-150 = "역시 마리의 입장에선 그냥 두고 볼 수 없었겠지요. 보십시오, 미네 단장님. 이게 저희들의 현주소입니다."
10039040-151 = "……?"
10039040-152 = "아니, 그러니까 자꾸 '저희들'로 같이 묶으시는……."
10039040-157 = "후우……. 아닙니다. 결국 여기서는 저도 변명하기 힘드네요."
10039040-158 = "말씀하신 대로, 어쨌거나 마리 씨에게 폐를 끼쳤다는 사실은 변하지 않으니까요. 지금도 눈 밑에 다크서클이 훤하시고 말이에요."
10039040-159 = "정말 죄송합니다, 마리 씨."
10039040-161 = "아, 아뇨! 폐라니……! 당치도 않아요! 절대로 그런 건……!!"
10039040-162 = "저도 나름대로 즐거웠는걸요. 이, 이건 그냥……. 어제 즐겁게 곡을 고르느라 늦게 자서……."
10039040-163 = "네. 마리 말대로, 여기서는 사과하는 것보다 감사를 전하는 게 좋은 방향이겠지요."
10039040-164 = "정말로 고마워요, 마리. 덕분에 방향성과 해야 할 일들이 확실해진 것 같아요."
10039040-165 = "사쿠라코 님……!!"
10039040-166 = "그러니……."
10039040-167 = "이미 너무 늦은 이야기이긴 하지만, 마리는 이제 그만 쉬도록 해요."
10039040-174 = "……네, 네……?"
10039040-175 = "음……? 많이 피곤하잖아요? 자료만 봐도 얼마나 힘들었을지 훤히 보이는걸요."
10039040-176 = "여기서부터는 저와 미네 단장님이 마리가 준 것들로 열심히 연습하도록 할게요."
10039040-177 = "맞습니다. 주신 것들이 허투루 되지 않도록, 최선을 다해서 결과를 내겠습니다."
10039040-179 = "……아, 네. 네……."
10039040-181 = "……? 마리……?"
10039040-182 = "마리 씨……? 왜 그러시는지……. 뭔가 신경 쓰이시는 것이라도?"
10039040-184 = "……!? 으, 으응!? 네!? 아, 아뇨! 아무것도 아니에요! 말씀대로 조금 피곤한가 봐요. 하하……."
10039040-185 = "그, 그럼 두 분 힘내세요!! 저는 들어가 보겠습니다!"
10039040-190 = "……? 마리……?"
10039040-191 = "방금 뭔가, 묘한 분위기가……."
10039040-192 = "무슨 말씀을 하시는 겁니까, 사쿠라코 님?"
10039040-193 = "자! 그렇게 멍하니 있을 때가 아닙니다! 마리 씨가 주신 이 자료들을 보세요."
10039040-194 = "지금 저희가 입고 있는 의상뿐만 아니라, 노래의 레퍼런스며 댄스 강습 일정이며……."
10039040-195 = "당장 실행에 옮겨야 합니다!! 그녀의 희생이 헛되지 않게 하기 위해서라도!!"
10039040-197 = "희, 희생!? 희생까지나……!? 그런 이야기가 돼 버리는 건가요, 이거……!?"
10039040-198 = "……사쿠라코 님!!!"
10039040-199 = "아, 알았어요. 알았다고요!! 지금 바로 가시죠! 바로 시작하겠습니다!!"
10039040-206 = "…………."
10039040-212 = "네, 이오치 마리입니다."
10039040-213 = "……아, 히나타 자매님……?"
10039040-214 = "아! 그러고 보니 같이 하던 일들이……!!"
10039040-215 = "……네?"
10039040-216 = "그쪽은 거의 다 마무리됐다고요……? 그럼 오늘 일정은……."
10039040-217 = "……끝이요? 그, 그렇군요. 감사합니다. 히나타 자매님 덕분에 훨씬 더 빠르게……."
10039040-218 = "……네. 네. 알겠어요."
10039040-219 = "네. ……또 연락드릴게요."
10039040-224 = "……갑자기 여유가 생겨버렸네요. 덕분에 오랜만에 쉴 수 있을지도 모르겠어요."
10039040-225 = "……음……."
10039040-226 = "그런데……. 뭘까요."
10039040-228 = "이 알 수 없는 기분은……."
