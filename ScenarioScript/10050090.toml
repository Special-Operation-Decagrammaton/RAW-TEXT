[translation]
10050090-1 = "제9화;흐르는 강물처럼"
10050090-2 = "……그리하여, 체리노 회장. 이것이 저희가 제안드리고자 하는, 트리니티와 붉은겨울 사이의 문화 교류 협정의 내용입니다."
10050090-3 = "이 협정은 샬레의 선생님께서 보증하셨으며, 도서부가 인가하는 형태로 진행될 것입니다. 그리고 저희 티파티는 그 결정에 이견 없습니다."
10050090-4 = "다만 앞으로는 이번 일처럼 협의가 이뤄지지 않은 상태에서 책을 비롯한 문화 매체를 유통하는 것은 삼가 주셨으면 합니다."
10050090-5 = "괜찮으시겠지요? 야쿠모 씨의 말대로, 문화는 흘러야 하는 것이니까요."
10050090-6 = "으, 으음……."
10050090-7 = "귀찮은데……. 애초에 출판부 녀석들이 멋대로 일을 벌인 거고."
10050090-8 = "잠깐. 지금 콤라드가 거기에 있다고 했지? 그래…… 그렇다면!"
10050090-9 = "이해했다. 이 건에 한해서, 붉은겨울의 의견은 샬레의 의견으로 대신하도록 하지."
10050090-10 = "[s] \"어? 나?\""
10050090-11 = "네? 그러니까 그 말씀은…… 샬레의 선생님께?"
10050090-12 = "그렇다. 마찬가지로 이 건 한정으로, 샬레는 붉은겨울의 대리인이 될 것이야. 붉은겨울은 샬레에 모든 결정을 일임하도록 하겠다."
10050090-13 = "무엇보다, 지금부터 이 몸은 결코 피할 수 없는 일정을 수행하러 가야 하니까!"
10050090-14 = "겨, 결코 피할 수 없는 일정이라뇨……?"
10050090-16 = "그것은 바로…… 낮잠이다!"
10050090-17 = "낮잠, 이요? 그건 무언가의 은유인가요?!"
10050090-18 = "[s] (아마 아닐 걸…….)"
10050090-19 = "그, 그리고 샬레를 이번 문화 협정의 대리인으로 내세운다는 것은……?"
10050090-23 = "(그것인가요?! 만에 하나 협정이 잘못되면, 붉은겨울의 대리인이 된 샬레가 일정 부분 책임을 지게 될 것이고…….)"
10050090-24 = "(마찬가지로, 협정에 합의한 트리니티에도 책임이 돌아올 수밖에 없으며……!)"
10050090-25 = "(그렇게 되면 샬레, 선생님께서는…… 실무적으로든, 감정적으로든, 트리니티에 좋지 않은 태도를 보일 수도 있으니…….)"
10050090-26 = "(결과적으로는 우리 트리니티에게 처신에 주의하라는 경고를 주면서.)"
10050090-27 = "(동시에 자신들의 붉은겨울은, 그 모든 책임으로부터 자유로워질 수 있다는 것인가요? 이것이 붉은겨울의 외교력?!)"
10050090-28 = "체, 체리노 회장! 잠시만요!"
10050090-33 = "[ns] \"왜 그래, 나기사? 표정이 안 좋아 보이는데……?\""
10050090-34 = "아, 아뇨! 아무것도 아니에요, 선생님! 저희가 잘하면 되는 일이죠. 네, 그럼요!"
10050090-35 = "이제 다 끝났어, 나기 쨩? 엄청 지루했다구~!"
10050090-36 = "미카. 선생님도 계시는데 경우를 좀 지키세요."
10050090-37 = "그, 그렇지. 미안해, 선생님……."
10050090-38 = "응? 나는 이대로도 괜찮다고……? 고마워, 선생님! 정말 좋아!"
10050090-39 = "다시 한번 인사드립니다. 티파티 여러분. 그리고 관대한 처분에 감사드립니다."
10050090-40 = "안녕하세요, 출판부 여러분. 이렇게 정식으로 만나 뵐 수 있게 되어서 기쁩니다."
10050090-41 = "저희 트리니티로서는 이번 일을 계기로, 앞으로도 붉은겨울과 더욱 좋은 관계를 쌓아 갔으면 하는 마음이 있습니다."
10050090-42 = "좋은 책이 있다면, 트리니티 학우분들께도 더욱 많이 소개해 주시고요?"
10050090-43 = "네. 그렇게 하도록 하겠습니다. 이런 자리를 마련해 주신 것, 무한한 영광으로 생각하겠습니다."
10050090-45 = "저기저기, 야쿠모 쨩이라고 했지? 반가워! 나는 티파티의 미카라고 해!"
10050090-46 = "그래서 말인데, 잠시 우리 둘이서만…… 이야기 좀 할 수 있을까?"
10050090-47 = "아, 안녕하세요. 아라마키 야쿠모입니다."
10050090-48 = "(이 사람이 티파티의 세 명 중 한 명…….)"
10050090-49 = "(그러니까 지금 저는, 체리노 회장을 앞에 두고 있는 거나 마찬가지란 거군요.)"
10050090-50 = "(……차라리 진짜 체리노 회장이라면, 대처 방법이 100가지는 있겠지만…….)"
10050090-51 = "이번에 야쿠모 쨩이 가져온 책 잘 봤어. 고마워!"
10050090-52 = "아, 네."
10050090-53 = "저기, 근데 말이지. 이건 그냥 내 생각일 뿐인데……."
10050090-54 = "그, 주인공이, 뭐라고 할까. 내가 보기에는 어딘가 선생님을 닮은 부분이 좀 있었던 것 같았거든? 그래서 특히 좋았던 것 같아."
10050090-55 = "그러니까 말이야. 이건 어디까지나 내 개인적인 부탁? 희망? 같은 거긴 한데……."
10050090-56 = "파트너의 캐릭터성이나 디자인을 조금 바꾸면, 더 좋은 이야기가 되지 않을까 해서!"
10050090-57 = "……?"
10050090-58 = "호오……. 호오, 호오. 힛. 힛. 히."
10050090-59 = "좋은 의견 진심으로 감사드립니다. 미카 님."
10050090-60 = "하는 김에 조금 더 구체적으로 말씀해 주신다면 큰 도움이 될 것 같네요. 어떻게 바꿔드리기를 희망하시나요?"
10050090-61 = "응응! 가령 말이야, 예를 들자면…… 머리색을 약간 더 분홍빛 계열로 바꾼다거나? 머릿결에 웨이브도 넣으면 조금 더 귀여울 것 같구?"
10050090-62 = "조금 촐싹대고 장난기가 많지만, 할 때는 하는 아이이면 좋지 않을까?"
10050090-63 = "평소에는 주위 분위기를 막 띄우는 성격에, 머리 한쪽은 올려 묶어도 좋지만 아니어도 좋구……."
10050090-64 = "제일 좋아하는 건 점보 파르페! 그리고 그다음으로는 BB크림과 사무엘라 더 비욘드 향수!"
10050090-65 = "아, 롤케이크는 됐어. 그건 이제 충분해……."
10050090-66 = "아무튼 아무튼! 그런 식이면 어떨까 해서!"
10050090-67 = "그럼요, 그럼요. 무슨 말씀인지 잘 알겠습니다."
10050090-68 = "그런데 미카 님의 말씀을 종합해 보니까, 이 정도면 거의 책을 처음부터 만들어야 하는 수준인데 말이지요?"
10050090-69 = "그, 그래……?"
10050090-70 = "그리고 한층 더 나아가, 이건 아마도 미카 님만을 위한 책이 될 것 같네요."
10050090-71 = "어? 나, 나만을 위한 책……?"
10050090-72 = "응! 그런 거 완전 좋아!"
10050090-73 = "그렇죠, 그렇죠. 저도 그편이 미카 님의 품격에 보다 어울릴 것 같습니다. 그런데…… 여기에는 한 가지 문제가 있을 것 같아서요."
10050090-74 = "뭐, 뭔데?"
10050090-75 = "출판이라는 건 기본적으로, 규모의 경제가 적용되는 분야다 보니까 말이에요."
10050090-76 = "소수만을 위한 작품은, 그만큼 단가가 많이 올라가게 되는 경향이 있거든요."
10050090-77 = "특히 이렇게 한 사람만을 위한 책을 만든다는 것은, 그 희소성으로 인해 가격 책정이 조금 어려워질 수도 있고요."
10050090-78 = "더 솔직하게 말씀드리자면, 제법 비싸질 수도 있다는 뜻이죠."
10050090-79 = "음……? 얼마면 돼?"
10050090-83 = "……이 정도면 괜찮을까?"
10050090-84 = "?!?!"
10050090-85 = "아, 아뇨! 그 금액의 반으로도 충분한데요……?"
10050090-86 = "에이, 비싸다길래 긴장했더니, 별거 아니네. 그러면–"
10050090-87 = "미카 씨?"
10050090-92 = "왜, 왜 그래. 나기 쨩?"
10050090-93 = "꼭 제가, 마지막까지 모든 것을 말씀드려야 할까요?"
10050090-94 = "으, 으으…… 알았어. 히잉~ 나기 쨩 미워~!"
10050090-96 = "고생 많으셨어요. 출판부 여러분."
10050090-97 = "아뇨……. 오히려 저희가 죄송하죠. 도서부 여러분과 정의실현부 여러분께 폐만 끼쳤고……."
10050090-99 = "그렇지만도 않습니다. 도서부 여러분 덕분에, 저희 정의실현부도 도서관을 찾는 비중이 많이 늘어났으니까요."
10050090-100 = "도서부 여러분이 가지고 와 주신 책 덕분에, 책 그 자체에 대한 관심이 다들 늘어난 모양입니다."
10050090-101 = "저만 해도, 정의에 관련된 책 이외의 다른 영역에도 흥미가 생기기 시작했고요."
10050090-102 = "네. 그건 감사하지만, 반납 기한은 잘 지켜주세요?"
10050090-103 = "며, 명심하겠습니다……. 그래서 말인데요. 타카네 씨."
10050090-104 = "네. 무엇인가요?"
10050090-105 = "이번 이야기, 아직 완결은 아니잖아요?"
10050090-106 = "그건…… 그렇죠?"
10050090-107 = "그러니까 다음 권 나오면, 저한테 살짝 연락이라도……."
10050090-108 = "후훗. 마음에 드셨나요?"
10050090-109 = "상당히요."
10050090-110 = "알겠습니다. 이야기를 사랑하는 분은, 언제나 환영이니까요."
10050090-111 = "그리고 이건 트리니티 학생분들의 건의 사항입니다만, 사실 저는 영문을 잘 모르겠고……."
10050090-112 = "언젠가 꼭, 붉은겨울 공녀님의 평론집을 출간해 달라고 하는 이야기가 있었습니다."
10050090-113 = "……."
10050090-114 = "긍정적으로, 검토해 보도록, 할게요……."
10050090-115 = "감사합니다. 타카네 씨. 앞으로도 잘 부탁드리겠습니다."
10050090-121 = "부~장~님–!!!"
10050090-122 = "어라, 왜 그러나요. 타카네?"
10050090-123 = "다 들으셨죠? 이거 어떻게 책임지실 거예요–!!!"
10050090-124 = "아니, 그러니까 그게 다……."
10050090-126 = "아무튼! 마케팅인 겁니다!"
10050090-127 = "그걸 지금 말이라고 하시는 건가요–!!!"
10050090-139 = "[ns] \"만족했어, 야쿠모?\""
10050090-140 = "네. 제법요."
10050090-141 = "[s1] \"그렇다면 다행이지만.\"\n[s2] \"선생님은 야쿠모 학생을 지켜볼 거예요~\""
10050090-144 = "어라. 그건 어째서인가요?"
10050090-145 = "네? 제가 오히려, 이런저런 것들을 너무 잘 알고 있기 때문이라고요?"
10050090-146 = "가령 계약이라는 것의 무게에 대해 알고 있고, 사업을 위해 자기 자신을 숙일 수 있는 학생이니까……?"
10050090-147 = "[s3] \"맞아. 그건 대단한 능력이고, 잘 쓰면 멋진 능력이지만.\"\n[s4] \"그러다 선 넘으면, 나도 어떻게 못 해 줄 수도 있어.\""
10050090-150 = "……."
10050090-151 = "압니다, 알아요."
10050090-152 = "전 인정하기 싫지만, 다들 저보고 배배 꼬인 사람이라니, 그런가 보다 해야죠."
10050090-153 = "그리고 선생님이 절 지켜본다는 것은, 어떻게 해석하면."
10050090-154 = "저에게 지속적으로 관심을 보여 준다는 뜻일 수도 있으니까, 꼭 나쁜 것은 아닐 수도 있고요?"
10050090-155 = "[s] \"말이라도 못하면~ 얄밉지라도 않겠네요~\""
10050090-156 = "맞아요, 부장님! 선생님께서 그런 뜻으로 하신 말씀이 아니잖아요! 이번 일만 해도, 정말이지……! 하아."
10050090-157 = "정말 고생 많으셨습니다, 선생님. 진심으로 감사드려요."
10050090-158 = "[s] \"난 오히려 타카네가 있어 줘서, 그나마 살았어…….\""
10050090-159 = "그, 그렇게 생각해 주시면, 저는 감사하죠……."
10050090-160 = "하아. 이럴 줄 알았으면, 처음부터 선생님께 말씀드리고 도움을 구하면 좋았을 텐데……."
10050090-161 = "그러고 보니 왜 안 그랬나요, 부장님. 항상 모든 가능성을 생각하시는 분이."
10050090-162 = "아~ 네. 뭐. 저도 처음에 그 생각을 안 해 본 건 아니긴 한데요."
10050090-163 = "한데요?"
10050090-168 = "……혼날까 봐서?"
10050090-169 = "부~장~님~!!!"
10050090-170 = "[s] \"야~쿠~모~!!!\""
10050090-178 = "[ns] \"뭐어.\""
10050090-180 = "[ns] \"오늘도 공기가 좋구나~\""
10050090-182 = "겨울 하늘의 르네상스 ~문화 및 교류에 관한 실천적 테제~"
