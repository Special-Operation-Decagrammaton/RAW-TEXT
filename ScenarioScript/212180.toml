[translation]
212180-1 = "제18화;우리는 불꽃이 되어"
212180-3 = "지금…… 누구 이야기를 하는 건가요?"
212180-4 = "……설마……."
212180-9 = "뇌제."
212180-13 = "천재적인 발명가, 전략가, 최고의 정치가, 위대한 폭군. 공포의 절대자."
212180-14 = "네, 저는 그분의 추종자입니다."
212180-19 = "뭐……?"
212180-20 = "당신…… 뇌제의 추종자라고요?"
212180-21 = "그럼…… 이 모든 상황을…… 쇼코, 네가 일으킨 거라고?"
212180-22 = "이, 세뇌가, 키보토스 정복이라는 광기 속으로 게헨나를 던져넣은 게 너라고?"
212180-23 = "네. 접니다."
212180-24 = "이 학원 전체가 위대한 선각자의 발자취를 따라가도록."
212180-25 = "그분께서 못다 이룬 꿈을 늦게나마 제 손으로 이뤄드리도록."
212180-26 = "너……!! 너!! 네가……!!"
212180-30 = "쇼코 쨩…… 네가 정말 원흉이야?"
212180-35 = "이건…… 그래. 뇌제의 사상이었어."
212180-36 = "공포에 의한 통제. 개인에 우선하는 전체. 키보토스 정복."
212180-37 = "한 명의 절대자에 의해 철저하게 통치되는 사회……."
212180-38 = "어째서…… 이것을 우리가……?"
212180-55 = "크윽!!"
212180-56 = "아…… 아악!!"
212180-57 = "크큭…… 그분을 끌어내린 반역자들이 이렇듯 꼭두각시가 된 모습, 보이시나요?"
212180-58 = "선배……!!"
212180-59 = "부장!!"
212180-60 = "이건, 있어야 할 곳을 빼앗긴 분을 위한 복수입니다."
212180-61 = "마땅히 받아야 했을 찬사와 칭송을 이제야 드리는 거죠. 반역자에게서 직접!"
212180-62 = "위대한 그분께, 폐위된 황제에게……!"
212180-63 = "쇼코…… 네가 말하던 것들, 모두 이걸 위해서였던 거야?"
212180-64 = "게헨나를 '다시금' 위대하게 라는 말, 뇌제 시대를 뜻하는 거였어?"
212180-65 = "쇼코 쨩…… 우리에게 했던 말들은 모두 거짓이었던 거야?"
212180-66 = "위대한 게헨나? 어차피 결론은 같았을 거예요!!"
212180-67 = "게헨나가 더욱 위대해지는 길은 오직 뇌제의 사상을 따르는 것뿐이었으니까요!"
212180-68 = "알량한 자유보다 통제된 질서가 훨씬 더 위대하고 강하다는 것을 보여주고 싶었으니까요!"
212180-73 = "세뇌라는 수단을 사용하면서 말이죠…… 의미 없잖아요, 그거."
212180-77 = "그분께서 남긴 위대한 유산을 활용해 설득 과정을 생략했을 뿐입니다."
212180-78 = "어떤 주장이 옳은지, 그에 따르는 귀찮은 논쟁과 설득의 과정을 생략한 거죠."
212180-79 = "결과적으로 모두가 올바른 길을 걷게 되었고요."
212180-83 = "당신들 같은 일부 불순분자를 제외하면 말이죠."
212180-88 = "너…… 제정신이 아니구나."
212180-89 = "선배들을…… 돌려줘요!!"
212180-90 = "아하하! 그분이 남긴 위대한 유산, <진정한 NK 울트라 프로젝트>를 벗어날 수 있는 방법은 없어요!"
212180-91 = "당신들이 할 수 있는 건 하나뿐입니다!"
212180-92 = "과거의 반역을 뼈저리게 되새기면서, 그분의 사상과 가치관에 따라 키보토스를 정복하는 것!"
212180-96 = "전쟁, 결코 다시 전쟁!! 곧 키보토스 전역에 그분께서 남긴 유산이 폭발할 겁니다!"
212180-101 = "잿더미 위에 쌓아 올리는, 진정한 질서! 온 세상에 게헨나의 깃발이 휘날리게 될 테고요!"
212180-103 = "그때야 비로소…… 그분께 바치는 진혼곡이 완성되는 거죠."
212180-107 = "……그래. 위대한 게헨나를 위하여."
212180-112 = "제군, 키보토스를 향해 총칼을 높이 들어라!!"
212180-124 = "하아…… 하아……."
212180-125 = "……."
