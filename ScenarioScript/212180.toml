212180-152 = "ええ、貴方のような大層ご立派な大人からすれば、私は子供に過ぎないのでしょう。"
212180-153 = "ですが、私こそ……！！"
212180-154 = "……。"
212180-155 = "その目――"
212180-156 = "どうして……どうしてそんな目で私を見るんですか！この前も……今も！"
212180-157 = "見るな……。"
212180-158 = "そんな目で私を見るな！！！"
