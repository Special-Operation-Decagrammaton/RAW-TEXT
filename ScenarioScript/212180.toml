[translation]
212180-1 = "第18話;炎となる私たち"
212180-3 = "彼女……？誰の話をしてるんですか？"
212180-4 = "……まさか。"
212180-9 = "雷帝。"
212180-13 = "天才的な発明家にして戦略家、最高の政治家、偉大なる暴君。恐怖の絶対者。"
212180-14 = "私は、あのお方の追従者です。"
212180-19 = "何だと……？"
212180-20 = "雷帝の追従者……？"
212180-21 = "じゃあ……事件の黒幕はショウコだったってこと？"
212180-22 = "みんなを洗脳して、ゲヘナを狂気の中に叩き込んだのもショウコなの……？"
212180-23 = "ええ。"
212180-24 = "この学園が、偉大なる先覚者の足跡を辿れるように手助けしたまでです。"
212180-25 = "あのお方が果たせなかった夢を、遅ればせながらこの手で成し遂げるために。"
212180-26 = "お前が……お前のせいで……！！"
212180-30 = "ショウコちゃん……それ、ガチ？"
212180-35 = "これは……そうか。雷帝の思想だったのか。"
212180-36 = "恐怖による統制。個より全体を優先すること。ゲヘナによる統一。"
212180-37 = "ただ1人の絶対者によって支配される社会……。"
212180-38 = "どうして……それを、私たちが……？"
212180-55 = "くっ！！"
212180-56 = "うっ……うああっ！！"
212180-57 = "ああ、ご覧になっていますでしょうか……#nかつて貴女様を引きずり下ろした反逆者たちが操り人形になった姿を……！"
212180-58 = "先輩……！！"
212180-59 = "委員長！！"
212180-60 = "これは、在るべき座を追われた方のための復讐なんです。"
212180-61 = "本来捧げられるはずだった賛辞と称揚……やっとお返しできます。反逆者自らの手で！"
212180-62 = "偉大なるあの方へ、廃された皇帝へ――！"
212180-63 = "ショウコが言ってたことは全部これのためだったの？"
212180-64 = "偉大なゲヘナは「雷帝時代」のこと……？"
212180-65 = "……ずっとうちらに嘘ついてたってことでいい？"
212180-66 = "どうせ結論は同じだったんですよ！！"
212180-67 = "ゲヘナが偉大になるためには、雷帝の思想に従うほかないのですから！"
212180-68 = "安っぽい自由より、統制された秩序の方が偉大で強い……それを示したかったんです！"
212180-73 = "どんな理想を掲げたって……その手段が洗脳じゃ意味ないじゃないですか。"
212180-77 = "そうは思いません。説得の過程を省略しただけです。"
212180-78 = "主張の是非を問う。煩わしい議論は手間ですからね。"
212180-79 = "なにより結果として、皆が正しい道を歩けるようになりました。"
212180-83 = "貴女方のような不穏分子を除けば、ですが。"
212180-88 = "お前……狂ってるよ。"
212180-89 = "先輩たちを……返してください！！"
212180-90 = "あははっ！負け惜しみにしか聞こえませんね。#nあの方の偉大な遺産「真のNKウルトラ計画」から逃れる術などありません！"
212180-91 = "貴女方にできることは、1つだけ！"
212180-92 = "反逆を骨の髄まで悔いながら、あのお方の思想と価値観に従って戦列に加わること！"
212180-96 = "戦って、戦って、戦って……キヴォトス全土で、あのお方の遺産が炸裂するのです！"
212180-101 = "灰の上に築かれる真の秩序！世界の果てまでゲヘナの旗が翻ることになるでしょう！"
212180-103 = "その時ようやく……あのお方へ捧げる[ruby=レクイエム]鎮魂歌[/ruby]が完成するのです。"
212180-107 = "……そう。偉大なるゲヘナのために。"
212180-112 = "諸君、キヴォトスへ向けて銃剣を高く掲げよ！！"
212180-124 = "はぁ……はぁ……。"
212180-125 = "……。"
212180-131 = "Long Live The Emperor."
