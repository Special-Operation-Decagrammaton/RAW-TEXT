[translation]
11200-2 = "제20화;선도부, 참전!"
11200-3 = "파괴된 아비도스 시내"
11200-4 = "사장, 무츠키! 하루카! 피해야 한다! 그 녀석들이야!"
11200-5 = "그 녀석들……?"
11200-6 = "게헨나 선도부 녀석들이야! 여기까지 쫓아온 건가! 하필 이런 타이밍에……!"
11200-7 = "아니, 이런 타이밍이기 때문에?!"
11200-8 = "(콰아아아아아아앙---!!)"
11200-9 = "큭!"
11200-10 = "젠자아앙……."
11200-12 = "(콰당탕-!)"
11200-14 = "타겟, 침묵입니다."
11200-15 = "좋아. 보병, 2소대까지 투입."
11200-16 = "…….이오리, 저들은 어떡하죠?"
11200-17 = "응? 저쪽 학교 학생들? 뭐였더라…… 아비도스?"
11200-18 = "당연한 거 아냐? 공무 집행에 방해를 하면 전부 적이다."
11200-19 = "그렇다면 얌전히 있어 주기를 바라는 수 밖엔…….#n하지만 이쪽도 사정을 설명하는 게 순서……."
11200-20 = "설명? 꼭 필요해, 그게?"
11200-21 = "……."
11200-22 = "우리 학원의 골칫덩이를 잡아가두는데 쓰는 노력만 해도 아깝다고. #n만약 우리를 방해한다면 저 녀석들이라도 당장 해치워버리겠어."
11200-23 = "……."
11200-25 = "뭐, 뭐야? 선도부가 흥신소 녀석들을 잡아가려고 온 거야?!"
11200-26 = "아직은 몰라요……. 하지만 딱히 우리에게 우호적인 시그널을 보내는 것도 아니에요."
11200-27 = "맞아. 포격 범위 안에 우리도 들어 있었어. 대놓고 노린 건 아니지만."
11200-28 = "그런……."
11200-29 = "웃기지 마! 흥신소 녀석들은 우리 꺼라고! 뭐하자는 거야, 대체!"
11200-30 = "하지만 선도부라면 다른 학원의 공식적인 무력집단, 흥신소 같은 동아리와는 성격이 달라요!"
11200-31 = "잘못하면 이건 정치적 분쟁이 생겨버릴 수도……."
11200-32 = "아야네 쨩, 호시노 부장님은 아직 연락이 닿지 않나요?"
11200-33 = "……네. 그래도 이렇게 오래 연락이 끊긴 적은 없는데……."
11200-34 = "이 상황…… 우리는 어떻게 해야 하죠?"
11200-35 = "……."
11200-36 = "……."
11200-37 = "[s] \"그럼 흥신소를 이대로 선도부에게 인도할 거야?\""
11200-38 = "그, 그치만……. 그렇다고 저들과 싸울 수는……."
11200-39 = "선생님, 그럼 어떻게 하자는 거야?"
11200-42 = "이건 이견이 있을 수 없어. 선도부를 저지한다."
11200-43 = "시로코 쨩……?!"
11200-44 = "……."
11200-45 = "……네. 맞아요."
11200-46 = "선도부가 저희 자치구에서 전술행동을 벌였다는 것부터가 #n이미 정치적 분쟁이 생겼다는 얘기……."
11200-47 = "분명 흥신소 여러분들이 문제를 일으킨 건 사실이에요……."
11200-48 = "하지만 그렇다고 해서 다른 학원의 선도부가 우리 허락도 없이 여기서 이런 폭거를 감행해도 괜찮다는 뜻은 아니에요."
11200-49 = "그 말도 맞아! 어디서 감히! 이건 우리 학교를 무시하는 처사잖아!"
11200-50 = "흥신소를 벌주는 건 우리라고! #n시바세키 라멘을 부순 대가는 우리가 치르게 해줄 거야!"
11200-52 = "……."
11200-53 = "아비도스 학생들, 임전태세로 돌입했습니다."
11200-54 = "하아. 귀찮게 구는구만. 그래봤자 4명이잖아. 우리는 중대 병력이라고."
11200-55 = "하지만 걸어오는 싸움을 피하는 것도 선도부로선 할 일이 아니니. 전원, 전투 준비!"
11200-56 = "……자, 잠시만요. 이오리."
11200-57 = "응?"
11200-58 = "아비도스 쪽에 민간인이 포착되었어요. 확인 중이니 기다려주세요……."
11200-59 = "어……?!"
11200-60 = "……저 저분은 ……설마 샬레의 [USERNAME] 선생님?!"
11200-61 = "응? 샬레? 그게 뭐야?"
11200-62 = "……. 자, 잠시만요. 샬레의 선생님이 저곳에 있다면……"
11200-63 = "……이 싸움, 해선 안됩니다!"
11200-64 = "무슨 소리야?"
11200-66 = "아비도스, 우리 쪽으로 접근합니다. 발포하겠습니다!"
11200-67 = "(타타타타타타앙--!!)"
11200-68 = "칫, 어쩔 수 없지! 간다-!"
11200-70 = "아……."
