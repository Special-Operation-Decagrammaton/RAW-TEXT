[translation]
10039100-1 = "후일담;우타하와 아이들"
10039100-2 = "아이돌 콘테스트의 예선 무대"
10039100-4 = "이번에는 또 어떤 컨셉의 아이돌들이 나올까?"
10039100-5 = "의상들의 퀄리티도 대단한 것 같은데, 기대가 되네요."
10039100-6 = "이번에는 가창도 다들 훌륭하다던데……"
10039100-11 = "후우…… 왜 우리가 긴장되는 거야."
10039100-15 = "우리가 직접 무대에 참가하지는 않지만, 어찌 보면 엔지니어부의 트리니티 데뷔라고 볼 수 있으니 긴장되는 것도 당연해요."
10039100-16 = "으응…… 부장은 어떠려나. 떨지 말아야 할 텐데."
10039100-21 = "아, 선생님. 안녕. 무대를 보러 온 거야?"
10039100-22 = "안녕하세요, 선생님!"
10039100-23 = "[s1] \"안녕!\"\n[s2] \"엔지니어부도 구경하러 왔구나.\""
10039100-26 = "으응. 부장을 응원하러 왔어."
10039100-30 = "[ns] \"우타하도 출전한 거야?\""
10039100-31 = "후후후! 말하자면 이번 아이돌 콘테스트는 저희에게 있어 일종의 기회라는 거죠!"
10039100-32 = "부장의 무대를 기대해 줘, 선생님."
10039100-38 = "아, 이제 시작한다……"
10039100-39 = "그럼 더 이상의 설명은 필요 없겠군요. 즐겁게 감상하시길!"
10039100-43 = "(여러 학생들의 열정 넘치는 무대가 이어지고, 정신없이 감상했다.)"
10039100-48 = "자, 다음 순서는~~!!"
10039100-52 = "밀레니엄 사이언스 스쿨에서 신청해 주셨습니다!"
10039100-58 = "번뜩이는 발명품으로 명망 높은, 엔지니어부의 시라이시 우타하 양입니다~!!"
10039100-69 = "어머, 저 복장은……?"
10039100-70 = "평범한 아이돌 코스튬이 아니네요. 콘테스트에서 선보이기에는 다소 전통적인 느낌의……"
10039100-71 = "옆의 저 기계? 비슷한 장치는 뭘까요? 엔지니어부라니 가창 보조장치 같은 것일까요?"
10039100-72 = "그러게요. 어떤 공연을 보여줄지 기대가 되는데요?"
10039100-77 = "그럼, 무대를 시작합니다~!!"
10039100-82 = "드디어 시작하는군요……!"
10039100-83 = "부장…… 힘내……"
10039100-98 = "으응……?"
10039100-99 = "이건……"
10039100-100 = "에, 엔카?"
10039100-101 = "엣?! 이, 이거 뭐야? 아이돌 공연 아니었어……?"
10039100-102 = "으으으응??"
10039100-108 = "[ns] \"이, 이건……\""
10039100-114 = "음정, 박자 모두 완벽해……!"
10039100-115 = "이 노래는 부장의 18번…… 가라오케에서도 눈 감고 부르는 곡이니 실수 따위는 할 리 없죠!"
10039100-116 = "좋아요, 히비키! 이제 우리의 불타는 응원이 더해질 차례네요!!"
10039100-117 = "응! 전심전력으로 부장을 서포트하는 거야……!"
10039100-121 = "[ns] \"자, 잠깐……. 그 서포트라는 건……\""
10039100-122 = "그것에 대해서는 제가 설명을 드리겠습니다! 저희가 선택한 응원 방식은……"
10039100-123 = "일단은 지켜봐 줘, 선생님. 부장의 무대를 있는 그대로 즐겨준다면, 분명 기뻐할 테니까."
10039100-124 = "[s] \"괜찮은 거 맞지?!\""
10039100-125 = "자, 간다……"
10039100-130 = "삐- 삐빅-"
10039100-134 = "미, 미러볼?! 미러볼이 돌아가고 있어요……!"
10039100-135 = "저 기기의 정체는…… 가라오케에서 볼법한 미러볼이었던 건가요?!"
10039100-136 = "하지만 평범한 미러볼이 아니에요! 공연장 전체를 뒤덮어버리는 저 출력……!"
10039100-138 = "일단 시선 집중은 확실히 성공했습니다!"
10039100-140 = "아, 아이돌 콘테스트에서 이런 무대를 기대하지는 않았는데……!"
10039100-141 = "추, 충격적이야…… 엔카에 가라오케에……"
10039100-142 = "[s] \"괜찮은 걸까……! 트리니티 학생들, 동요하고 있는데!\""
10039100-144 = "아니야, 선생님. 잘 봐."
10039100-149 = "……으응?"
10039100-150 = "뭐, 뭐지? 내 몸이……"
10039100-151 = "나도 모르게 리듬에 맞춰 발을 구르고 있어……?"
10039100-152 = "왠지 고개를 까닥거리게 되네요……"
10039100-153 = "그리고 가사도 요즘의 음악과는 사뭇 다른 느낌……"
10039100-154 = "이 구슬픈 감정…… 어, 어째서인지 마음이 조금 젖어 드는 듯한……"
10039100-155 = "[s3] \"이, 이건……\"\n[s4] \"먹혔다?!\""
10039100-159 = "후후, 장르의 선정에서부터 예고된 결과입니다! 트리니티의 교양 있는 학생들에게는 상당히 신선한 충격이었겠죠!"
10039100-160 = "게다가 부장의 가창 실력은 객관적으로 봐도 상당하죠. 목소리에 감정을 담아낼 수 있는 경지에 이르렀다고요!"
10039100-161 = "좋아, 곧 클라이맥스야……! 세컨드 임팩트, 가동!"
10039100-172 = "꺄악!! 이, 이건……"
10039100-173 = "뭐, 뭐야? 무대장치??"
10039100-174 = "화, 화려하긴 하지만 왠지 뜨거워……!"
10039100-176 = "그건 제가 설명드리죠! 전반적으로 어두운 무대에서 확실히 임팩트를 주기 위해서는 불꽃의 선명도와 절대적인 밝기가 중요합니다! 따라서 일반 불꽃 장치에 네이팜을 적당량 배합한 것이 바로 비결……"
10039100-177 = "[s] \"위험한 거 아냐?!\""
10039100-178 = "안심해, 선생님. 연소 시간을 극단적으로 줄였으니까 사람에게 불꽃이 닿을 걱정은 하지 않아도 돼."
10039100-179 = "[s] \"그, 그렇다면 다행이지만……\""
10039100-180 = "그리고 만에 하나를 대비해 준비한 또 하나의 장치가 있지."
10039100-181 = "마침 후렴구가 시작될 즈음이니 타이밍도 적절하네. 바로……"
10039100-185 = "지금이야!"
10039100-196 = "으응? 이건…… 비…… 인가요?"
10039100-197 = "실내에 비가?!"
10039100-199 = "천장 근처에 띄워 둔 스프링쿨러 드론들이 신호에 맞춰 물을 뿜어냄으로써, 네이팜으로 인한 실내 온도를 낮추고 동시에 비가 내리는 연출을 시도……"
10039100-200 = "좋아, 가사도 마침 흐르는 비에 대한 부분이야!"
10039100-202 = "이것도 무대 연출의 일부분인가요……?"
10039100-203 = "스쳐간 사랑이 담겨 흐르는 빗방울…… 과거에 대한 아릿한 추억……"
10039100-207 = "이건 비가 아니라…… 눈물……?"
10039100-209 = "초반에는 당황했지만, 중반부터는 나도 모르게 즐겼고…… 후반에는 나도 모르게 눈물짓게 되는……"
10039100-210 = "아…… 이런 무대가 있었다니……"
10039100-215 = "감사합니다."
10039100-220 = "이, 이렇게 시라이시 우타하 출전자의 무대가 종료되었습니다~! 모두 큰 박수 부탁드립니다!!"
10039100-229 = "[ns5] \"이거 생각보다……\"\n[ns6] \"반응이 좋네!\""
10039100-233 = "약 절반 정도는."
10039100-234 = "모두를 만족시키기란 역시 무리였겠지."
10039100-239 = "[ns7] \"……관객들이 술렁거리는 소리가……\"\n[ns8] \"기대와는 다르다는 반응도 있구나……\""
10039100-242 = "응! 어쨌거나 우리는 최선을 다했어요. 부장도 연습 때보다 훨씬 더 잘 불렀고요."
10039100-243 = "맞아. 우리가 할 수 있는 일은 다 했어. 후회는 없어."
10039100-245 = "(시간이 흘러, 예선 결과가 발표되었다.)"
10039100-248 = "(엔지니어부는 높은 호응 점수를 받았지만, 아쉽게 본선 진출에는 실패했다.)"
10039100-252 = "[ns] \"……\""
10039100-253 = "……"
10039100-254 = "후후, 이거 다행이네."
10039100-255 = "그러게 말이야."
10039100-256 = "[s] \"응?\""
10039100-257 = "애초에 준비한 노래가 한 곡밖에 없었거든."
10039100-258 = "만약 우리가 본선에 진출했다면 또 같은 노래를 불렀을 테고, 임팩트가 부족했겠지."
10039100-259 = "그리고 본선 무대가 훨씬 넓은 만큼 무대 장치의 배리에이션을 늘려야 하는데, 그러기엔 재료와 설비도 부족하고요!"
10039100-260 = "훗, 결과는 중요하지 않아."
10039100-261 = "오늘 우리는 트리니티의 한복판에서 엔카의 멋짐을 보여줬으니까."
10039100-262 = "밀레니엄 엔지니어부의 존재도 널리 알렸지."
10039100-266 = "[ns] \"다들,\""
10039100-268 = "[ns] \"그걸로 충분한 거야?\""
10039100-272 = "뭐, 아쉽지 않다면 거짓말이겠지만."
10039100-274 = "그래도 꽤 즐거운 경험이었다고 생각해. 그렇지?"
10039100-276 = "물론! 어디 가서도 할 수 없는 경험이었어요. 설명이라면 자신 있지만, 무대에 나가 노래를 하는 건 또 다른 차원의 일이니까요. 부장 덕분에 함께 무대에 있는 듯한 기분을 느낄 수 있었다구요!"
10039100-277 = "나도 재미있었어. 관객들의 반응도 생생하게 느낄 수 있었고."
10039100-278 = "[s9] \"그렇다면 다행이야.\"\n[s10] \"모두 고생 많았어. 자랑스러워.\""
10039100-281 = "후후, 이제 우리는 축제를 좀 더 부담 없이 즐길까 하는데……"
10039100-287 = "선생님, 괜찮으면 같이 갈래?"
10039100-289 = "(나중에 알게 된 사실이지만, 사육제 이후 트리니티에 엔카 동호회가 신설되었다는 이야기가 들려왔다……)"
