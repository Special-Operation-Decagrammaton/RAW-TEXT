[translation]
10054030-1 = "3화;물놀이, 감사, 종합적으로 피서 1"
10054030-5 = "강이라는 곳은 어떤 곳일까요?"
10054030-6 = "아주 오래전부터 농사와 교통, 생활 터전으로 가장 많이 활용되어 왔던, 문명의 요람이라고도 하는 지형이죠."
10054030-7 = "그렇지. 산해경에서도 큰 의미를 갖는 지형이기도 하다."
10054030-8 = "가령 '다스리다'란 뜻의 글자(治)는. 본래 '물(水)을 조절한다'는 뜻이었다."
10054030-9 = "특히 홍수가 난 다음 경계선이 애매해진 토지를 다시 정확하게 분배하는 것이 중요했다고 하지."
10054030-10 = "네. '물을 다스린다'는 뜻이, 곧 모든 것을 다스린다는 개념 자체로 확장된 것이죠."
10054030-11 = "그런 의미에서, 이번 우리의 피서…… 감사 활동이 계곡으로 결정된 것도, 나름 뜻깊은 일이 아닐까 싶네요."
10054030-18 = "[ns] \"우와…….\""
10054030-23 = "어때, 정말로 좋은 곳이지?"
10054030-24 = "그러면 선생님. 우리, 수영복으로 갈아입고 올 테니까…… 마음껏 기대해도 좋다구?"
10054030-29 = "(신이 나서 뛰어가는 학생들의 뒷모습을 바라보며.)"
10054030-30 = "(마찬가지로 피서…… 감사 활동을 진행하기 위해, 나름의 준비를 하기로 했다!)"
10054030-32 = "코코나 쨩? 너무 흥분해서 폐를 끼치면 안 되니까요?"
10054030-33 = "걱정하지 마, 슌 언니! 나는 여기에선 한층 더 어엿한 레이디니까!"
10054030-40 = "선생님-!!!"
10054030-41 = "[s] \"코코나 쨩!\""
10054030-42 = "또, 또. 코코나 쨩이라고 하시고~"
10054030-43 = "하지만 오늘은 괜찮아요! 이번에야말로 꼭, 선생님께 제가 얼마나 레이디인지를 보여 드릴 테니까요!"
10054030-44 = "[s] \"정말 어른스러워 보이려고 노력했구나!\""
10054030-45 = "그럼요! 당연하죠!"
10054030-46 = "그리고 어른스러워 보이려고 노력한 게 아니에요! 저는 이미 어엿한 레이디니까요!"
10054030-47 = "그저 그 사실에 어울리는 수영복을 준비했을 뿐인 거죠. 엣헴!"
10054030-48 = "[ns] (그러면서도 살짝 어설퍼 보이는 게, 코코나 쨩 답구나!)"
10054030-50 = "(그렇게 기쁨을 숨기지 못하는 코코나 쨩에게…….)"
10054030-52 = "(양팔을 들어 올려, 높이높이를 해 주었다!)"
10054030-58 = "와아! 와아!"
10054030-59 = "선생님 정말 좋아요!"
10054030-63 = "하하하. 정말 신난 모양이네, 코코나 쨩."
10054030-64 = "으우~ 루미 언니까지 코코나 쨩이라고~!"
10054030-65 = "하지만 어쩔 수 없잖아? 우리는 지금 비밀리에…… '감사'를 온 거니까."
10054030-66 = "최대한 '보통 학생들'인 척해야 하지 않겠어?"
10054030-67 = "아……! 그러고 보니!"
10054030-68 = "어쩔 수 없네요! 여기에서만 특별히 그렇게 부르도록 허락해 드리죠!"
10054030-69 = "그래, 그래. 역시 코코나 쨩은 성숙하다니까."
10054030-70 = "당연하죠! 루미 언니도 뭔가를 아신다니까요!"
10054030-76 = "그래서…… 어때?"
10054030-77 = "[s] \"뭐, 뭐가?\""
10054030-82 = "너무 시치미 떼면, 나 조금 서운할지도~?"
10054030-83 = "선생님의 리퀘스트, 반영해 보려고 했는데 말이야……?"
10054030-84 = "[s] \"나 그런 거 한 적 없는데……?\""
10054030-85 = "하하하. 그건 그랬지. 하지만 우리가 알고 지낸 지가 얼마인데!"
10054030-86 = "분명 선생님이라면 이런 리퀘스트를 할 거라고 예상하고, 최대한 신경 써 봤거든."
10054030-87 = "[s1] \"말씀하신 그대로입니다. 황송합니다.\"\n[s2] \"뭔가 신선합니다. 그저 감읍합니다.\""
10054030-88 = "어, 응. 솔직한 반응, 고마워."
10054030-93 = "내 생각과 선생님 생각이 일치했다는 것은 기쁘지만…… 너무 진솔한 대답이다 보니, 오히려 내가 살짝 부끄러워졌네."
10054030-94 = "하여튼 선생님, 방심할 수 없다니까……."
10054030-95 = "그러면 이렇게 서로 파장이 맞는다는 걸 확인했으니, 잘 부탁해. 선생님?"
10054030-96 = "앗차, 조금 빗나갔나. 이거 아쉬운걸."
10054030-101 = "뭐, 우리 사이에 아직 모르는 부분이 약간 남아 있다는 뜻이니, 이 기회에 더 가까워지면 되겠네."
10054030-102 = "응? 오히려 신선한 모습을 보여 줘서, 한층 더 좋았다고? 그, 그건……."
10054030-103 = "고, 고마워."
10054030-104 = "흐음. 뭔가 둘이서 좋은 분위기를 만들고 있구나. 이거 조금 심술을 부려 보고 싶어지는데."
10054030-105 = "문주님?"
10054030-106 = "자, 자. 코코나. 여기에서는 그렇게 부르면 안 된다고 하지 않았느냐."
10054030-107 = "아, 그랬죠! 죄송해요. 키사키 언니!"
10054030-108 = "후후. 코코나에게 언니라고 불리는 날이 올 줄이야. 이것은 또한 새로운 즐거움이로구나."
10054030-111 = "[ns] \"키사키? 스타일이……?\""
10054030-114 = "뭐야, 키사키! 생각했던 것보다 훨씬 힘을 줬잖아?"
10054030-115 = "무얼. 지금의 나는 그저 한 명의 여고생 류우게 키사키일 뿐이니 말이지."
10054030-116 = "필요 이상으로 무게를 잡거나, 점잔을 뺄 필요도 없을 듯하여 말이다."
10054030-121 = "그래서, 어떤가?"
10054030-122 = "선생의 감상, 듣고 싶다만?"
10054030-123 = "[s] \"여러 가지로, 꿈만 같아…….\""
10054030-124 = "흐음. 진의를 흐리고 상대로 하여금 그것을 짐작하게 하면서도, 호의를 드러내는 표현이었는가."
10054030-125 = "좋다. 합격점을 주도록 하지."
10054030-126 = "몸의 상태 말인가? 흐음……."
10054030-131 = "(키사키와 루미의 시선이 살짝 마주쳤다.)"
10054030-134 = "확실히, 한층 가벼워지고 개운한 기분이로구나. 모두에게 감사할 일이다."
10054030-136 = "잘 되었네요. 문주…… 아뇨, 키사키 씨."
10054030-140 = "어머나, 이것 참. 빨리 이 새로운 호칭에 익숙해져야 할 텐데, 뭔가 무엄하게 느껴지기도 하고요?"
10054030-141 = "슌인가. 호오, 이것은 확실히, 또한."
10054030-146 = "안녕하세요, 선생님. 어떤가요?"
10054030-147 = "틀에 박힌 표면적인 말이라도 좋으니, 듣고 싶어지는 것이 여고생의 마음이기도 하답니다?"
10054030-148 = "[s3] \"……그렇게 말하니까, 무슨 말을 해도 그렇게 들릴지 모르지만.\"\n[s4] \"정말로 잘 어울려. 진심이야.\""
10054030-151 = "어머나. 감사합니다. 역시 기쁘네요."
10054030-152 = "그러고 보니, 저, 이 말도 꼭 해보고 싶었어요."
10054030-153 = "뭔데?"
10054030-154 = "모두, 집에 돌아갈 때까지가 여행이랍니다?"
10054030-155 = "슌 언니는 정말 슌 언니라니까……."
10054030-156 = "후후. 그것은 확실히 그대다운 말이로군."
10054030-157 = "음! 모두 준비가 된 듯하군! 호위…… 아니, 안전 보장은 맡겨 다오!"
10054030-161 = "[ns] \"그러면, 가자!\""
10054030-162 = "와아~!!!"
10054030-163 = "자, 잠깐! 우리는 신을 내며 놀러 가는 게 아니라……!"
10054030-165 = "[ns] \"가자!!!\""
10054030-168 = "어쩔 수 없나……. 일단은 휴양객으로 보여야 하는 것도 맞으니……."
10054030-171 = "와앗?! 차가워요……. 생각했던 것보다 훨씬 물이 차갑네요?"
10054030-172 = "코코나 쨩? 신난 것도 좋지만, 준비 운동도 확실하게 해야 한답니다?"
10054030-173 = "그렇고말고! 어라? 그러고 보니…… 수영하기 전에 하는 체조는, 또 다른 방식이 있었던가?"
10054030-174 = "으, 으음……. 그런 부분은 나도 자세하지 않은데 말이지……."
10054030-175 = "흐음."
10054030-181 = "(키사키와 눈빛을 교환했다!)"
10054030-182 = "어쩔 수 없구나. 여기에서는 내가 시범을 보이도록 하지."
10054030-183 = "무, 문ㅈ……. 키사키 님?!"
10054030-184 = "어머나."
10054030-185 = "어라? 하지만……."
10054030-186 = "그러면 안심이지. 잘 부탁해!"
10054030-188 = "(그렇게 키사키의 시범으로, 다 같이 '물가의 튼튼 체조'로 몸을 풀었다.)"
10054030-189 = "(우리의 물놀이…… 감사…… 피서는, 그렇게 시작되는 것이었다……!)"
