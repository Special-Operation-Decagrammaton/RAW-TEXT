10054030-42 = "Again? How many times do I have to tell you to use my full title?"
10054030-43 = "But I guess I did say you can have a pass during our vacation! I'll prove to you just how much of a lady I am, Sensei!"
10054030-44 = "[s] \"You really worked hard to look like a grown-up!\""
10054030-45 = "Duh! Of course I did!"
10054030-46 = "And I didn't work hard to LOOK LIKE a grown-up! I already am! "
10054030-47 = "I simply wore a swimsuit befuddling that! Heh, heh!"
10054030-48 = "[ns] \"(The way she messed that up is just too cute.)\""
10054030-49 = ""
