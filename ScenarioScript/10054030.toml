10054030-78 = ""
10054030-80 = ""
10054030-81 = ""
10054030-82 = "I'm going to be disappointed in you if you try to play dumb."
10054030-83 = "After all the work I put in to meet your requests!"
10054030-84 = "[s] \"I didn't make any requests...\""
10054030-85 = "Hahaha. You caught me. But our relationship goes way back at this point."
10054030-86 = "I tried my best to pick out something I thought you'd like."
10054030-87 = "[s1] \"You sure know me well, Rumi. Thank you!\"\n[s2] \"It's a fresh look. I appreciate it!\""
10054030-88 = "O-Oh. Ahaha, thanks for your honesty."
10054030-89 = ""
10054030-91 = ""
10054030-92 = ""
10054030-93 = "I'm happy that we're on the same wavelength...but I wasn't expecting you to be so upfront about it."
10054030-94 = "I really can't let my guard down around you, can I?"
10054030-95 = "Since we're so in sync, I'm sure the rest of this job will be a breeze."
10054030-96 = "Ah, I didn't get it right, did I?"
10054030-97 = ""
10054030-99 = ""
10054030-100 = ""
10054030-101 = "Hm, I'll just take this as an opportunity to get to know you better, then. I'm sure I'll get it next time."
10054030-102 = "Eh? You like being able to see new sides of me regardless?"
10054030-103 = "Th-Thank you."
10054030-104 = "Hm, I sense a budding chemistry here. I am all too tempted to incite strife between the two of you."
10054030-105 = "Madam?"
