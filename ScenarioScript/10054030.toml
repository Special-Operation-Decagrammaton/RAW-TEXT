[translation]
10054030-1 = "第3話;戲水，查核，總歸是避暑（１）"
10054030-5 = "所謂的河川，究竟是什麼樣的地方呢？"
10054030-6 = "河川自古以來便經常作為農耕、交通和聚居之地，因此也經常被稱為文明的搖籃。"
10054030-7 = "是啊。對於山海經而言，河川亦有著重要的象徵意義。"
10054030-8 = "比如「治」字的原意即為「治理水流」。"
10054030-9 = "尤以洪水過後重新丈量並分配界線模糊的土地，實為治世安民之大事。"
10054030-10 = "是的。因此「治理水流」的概念，後來逐漸演變成了「治理天下」的意思。"
10054030-11 = "從這個角度來看，我們這次的避暑……查核活動選定在溪谷，或許也別具深意呢。"
10054030-18 = "[ns]「哇啊……」"
10054030-22 = ""
10054030-23 = "怎麼樣？真的是個很棒的地方吧？"
10054030-24 = "那麼老師，我們去換上泳裝就回來……你就好好期待吧？"
10054030-25 = ""
10054030-27 = ""
10054030-29 = "（望著興奮奔去的學生們的背影）"
10054030-30 = "（與此同時，為了進行避暑……查核活動，決定先做好自己的準備工作！）"
10054030-31 = ""
10054030-32 = "心菜醬？可不能因為太興奮造成別人的困擾哦？"
10054030-33 = "別擔心，旬姐姐！我現在可是出色的淑女呢！"
10054030-34 = ""
10054030-36 = ""
10054030-37 = ""
10054030-39 = ""
10054030-40 = "老師──！！！"
10054030-41 = "[s] 「心菜醬！」"
10054030-42 = "又，又來了！老師又叫我心菜醬～！"
10054030-43 = "不過今天可不一樣哦！#n這次我一定要讓老師見識到，自己有多麼像個出色的淑女！"
10054030-44 = "[s] 「你真的很努力讓自己看起來很成熟呢！」"
10054030-45 = "那當然囉！"
10054030-46 = "而且我才不是努力讓自己看起來成熟！我本來就是個出色的淑女！"
10054030-47 = "哼哼，這純粹只是準備了與事實相符的泳裝而已！"
10054030-48 = "[ns] （以略帶稚嫩感這點來說，真有心菜醬的風格呢！）"
10054030-49 = ""
10054030-50 = "（面對無法掩飾喜悅的心菜醬……）"
10054030-51 = ""
10054030-52 = "（決定伸出雙臂，給他一個舉高高！）"
10054030-53 = ""
10054030-55 = ""
10054030-58 = "哇，哇啊……！"
10054030-59 = "老師最棒了！"
10054030-60 = ""
10054030-61 = ""
10054030-62 = ""
10054030-63 = "哈哈哈。你看起來很開心呢，心菜醬。"
10054030-64 = "唔～怎麼連瑠美姐姐也叫我心菜醬～！"
10054030-65 = "這也沒辦法嘛？畢竟我們現在可是在暗中進行「查核」。"
10054030-66 = "所以得盡量表現得像是「普通學生」不是嗎？"
10054030-67 = "啊……！說的也是！"
10054030-68 = "那就沒辦法了呢！就特別允許你們在這種場合那樣叫我吧！"
10054030-69 = "嗯嗯，心菜醬果然很成熟呢。"
10054030-70 = "那當然！瑠美姐姐也很有眼光呢！"
10054030-71 = ""
10054030-73 = ""
10054030-74 = ""
10054030-75 = ""
10054030-76 = "話說回來……怎麼樣呢？"
10054030-77 = "[s]「什，什麼怎麼樣？」"
10054030-78 = ""
10054030-80 = ""
10054030-81 = ""
10054030-82 = "要是一直裝傻下去的話，我可能會有點難過哦～？"
10054030-83 = "我可是有試著配合老師的要求呢……？"
10054030-84 = "[s] 「我有提過那種要求嗎……？」"
10054030-85 = "啊哈哈，那倒也是。#n不過我們都認識這麼久了……"
10054030-86 = "我猜老師一定會喜歡這種風格，所以特地用心做了準備哦。"
10054030-87 = "[s1] 「一切如您所言，在下實在受寵若驚。」\n[s2] 「感覺挺新鮮的，在下實在感動不已。」"
10054030-88 = "啊……嗯。謝謝你這麼坦率的反應。"
10054030-89 = ""
10054030-91 = ""
10054030-92 = ""
10054030-93 = "能夠和老師的想法一致，這點確實讓我很開心……#n不過回答得太過真摯，反倒讓我有點害羞了呢。"
10054030-94 = "真是的，果然不能對老師掉以輕心呢……"
10054030-95 = "既然已經確認我們這麼有默契，接下也請老師多多關照囉？"
10054030-96 = "哎呀，看來沒有完全猜中呢。真是可惜。"
10054030-97 = ""
10054030-99 = ""
10054030-100 = ""
10054030-101 = "沒關係，這也代表我們彼此之間還有尚未了解的部分，就趁這個機會變得更親近吧。"
10054030-102 = "嗯？因為展現了新鮮的一面反而更喜歡了？那，那個……"
10054030-103 = "謝，謝謝你。"
10054030-104 = "汝等的氣氛似乎相當融洽呢……不禁令妾身想從中作亂啊。"
10054030-105 = "門主大人？"
10054030-106 = "且慢，心菜。不是說過在此地不可如此稱呼妾身嗎？"
10054030-107 = "啊，對哦！對不起，妃姬姐姐！"
10054030-108 = "呵呵。沒想到竟有被心菜稱作姐姐的一日，這也是一番雅趣呢。"
10054030-109 = ""
10054030-110 = ""
10054030-111 = "[ns] 「妃姬？你這身打扮……」"
10054030-112 = ""
10054030-113 = ""
10054030-114 = "哎呀，妃姬！你打扮得比我想像中還要用心嘛？"
10054030-115 = "何必大驚小怪。此刻的妾身，不過是名為龍華妃姬的女高中生。"
10054030-116 = "因此似乎也沒必要再故作莊重了。"
10054030-117 = ""
10054030-119 = ""
10054030-120 = ""
10054030-121 = "所以……如何？"
10054030-122 = "妾身想聽聽老師的感想。"
10054030-123 = "[s] 「各方面來說，都像是在作夢一樣……」"
10054030-124 = "不明確表達心意，而是令對方自行領會，同時又能傳達好感的方式啊……"
10054030-125 = "不錯，給予汝合格吧。"
10054030-126 = "妾身的身體狀況？唔呣……"
10054030-127 = ""
10054030-129 = ""
10054030-130 = ""
10054030-131 = "（妃姬和瑠美的視線稍稍交會了一下）"
10054030-132 = ""
10054030-134 = "確實感覺比以往舒暢許多。這都要感謝各位。"
10054030-136 = "那真是太好了呢，門──不對，妃姬同學。"
10054030-137 = ""
10054030-138 = ""
10054030-139 = ""
10054030-140 = "哎呀，真是的。看來得盡快習慣這個新稱呼才行……不過又覺得有點失禮呢。"
10054030-141 = "是旬啊。哦？這還真是……"
10054030-142 = ""
10054030-144 = ""
10054030-145 = ""
10054030-146 = "您好，老師。您覺得如何呢？"
10054030-147 = "就算只是常見的客套話，女高中生還是想要被稱讚的哦？"
10054030-148 = "[s3] 「……被你這麼一說，感覺無論我說什麼都像在敷衍了。」\n[s4] 「不過真的很適合你。這是我的真心話。」"
10054030-151 = "哎呀，謝謝您。果然很令人開心呢。"
10054030-152 = "對了，我一直很想親口說說看這句話。"
10054030-153 = "什麼？"
10054030-154 = "大家，直到平安回家為止都算是旅行哦？"
10054030-155 = "果然是旬姐姐呢……"
10054030-156 = "呵呵，確實很像汝會說的話呢。"
10054030-157 = "好！看來各位都準備就緒了！護衛……不對，安全保障就放心交給我吧！"
10054030-158 = ""
10054030-160 = ""
10054030-161 = "[ns] 「那就走吧！」"
10054030-162 = "哇啊～！！！"
10054030-163 = "等，等一下！我們可不是來玩的……！"
10054030-164 = ""
10054030-165 = "[ns] 「出發！！！」"
10054030-166 = ""
10054030-167 = ""
10054030-168 = "算了……畢竟得先偽裝成普通遊客也是事實……"
10054030-170 = ""
10054030-171 = "哇啊！？好冰……水比想像中還要冰呢！"
10054030-172 = "心菜醬？開心歸開心，暖身運動也要做確實哦？"
10054030-173 = "沒錯！咦？這麼說來……下水前做的暖身運動，是不是還有另一種方式？"
10054030-174 = "唔嗯……我也不太了解那方面的事……"
10054030-175 = "唔呣。"
10054030-176 = ""
10054030-178 = ""
10054030-179 = ""
10054030-180 = ""
10054030-181 = "（和妃姬交換了眼神！）"
10054030-182 = "既然如此，這裡就由妾身來示範吧。"
10054030-183 = "門──妃姬大人！？"
10054030-184 = "哎呀。"
10054030-185 = "咦？但是……"
10054030-186 = "那我就放心了，拜託你囉！"
10054030-188 = "（於是在妃姬的示範之下，大家一起做了「水邊暖身操」舒展身體）"
10054030-189 = "（我們的戲水……查核……避暑之旅，就這麼揭開了序幕……！）"
