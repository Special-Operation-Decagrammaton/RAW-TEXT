[translation]
10054030-1 = "Episode 3;Water Fun, Audits, and a Summer Getaway 1"
10054030-5 = "What is a river?"
10054030-6 = "A river is a hydrological feature of a terrain that is typically utilized for agriculture, transportation, and settlement. Due to this, it is also called the \"cradle of civilization.\""
10054030-7 = "Rivers also carry significant cultural meaning in Shanhaijing."
10054030-8 = "For example, the character that means \"to govern (治)\" originally meant \"to regulate water (水).\""
10054030-9 = "After floods, it was an essential role of leadership to allocate land fairly and accurately amongst civilians."
10054030-10 = "And so, the meaning of \"regulating water\" expanded to encapsulate the government as a whole."
10054030-11 = "Perhaps there is a certain symbolic meaning here, this audit taking place in the valley."
10054030-18 = "[ns] \"Wow...\""
10054030-22 = ""
10054030-23 = "What do you think? Isn't it great?"
10054030-24 = "We're going to go change into our swimsuits. Look forward to the big reveal, okay?"
10054030-25 = ""
10054030-27 = ""
10054030-29 = "I watched the students run off in excitement."
10054030-30 = "In the meantime, I decided to make my own preparations to enjoy our vaca...begin our audit."
10054030-31 = ""
10054030-32 = "Kokona dear, do you remember what I said? I know you're excited, but remember to mind your manners."
10054030-33 = "You worry too much, Sis! I'm the most proper lady of all when I'm on vacation!"
10054030-34 = ""
10054030-36 = ""
10054030-37 = ""
