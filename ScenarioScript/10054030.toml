10054030-45 = "แน่นอนสิคะ!"
10054030-46 = "แล้วฉันก็ไม่ได้พยายามทำให้ตัวเองดูเป็นผู้ใหญ่หรอกนะคะ! เพราะฉันเป็นกุลสตรีเต็มตัวอยู่แล้วค่ะ! "
10054030-47 = "ฉันแค่เตรียมชุดว่ายน้ำให้เหมาะกับความเป็นจริงก็เท่านั้นค่ะ อะแฮ่ม!"
10054030-48 = "[ns] (แต่ก็ยังดูเปิ่นๆ อยู่นิดหน่อย สมกับเป็นโคโคน่าจังจริงๆ เลยนะ!)"
10054030-49 = ""
10054030-50 = "(จากนั้นคุณครูก็เข้าไปหาโคโคน่าจังที่กำลังเก็บความดีใจไว้ไม่อยู่...)"
10054030-51 = ""
10054030-52 = "(แล้วอุ้มโคโคน่าด้วยแขนทั้งสองข้าง แล้วชูขึ้นสูงๆ!)"
