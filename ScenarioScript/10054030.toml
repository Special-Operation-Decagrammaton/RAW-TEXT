10054030-142 = ""
10054030-144 = ""
10054030-145 = ""
10054030-146 = "Hello, Sensei. How do I look?"
10054030-147 = "Even if it's a bit superficial, a high school girl needs to hear it said aloud, do you understand?"
10054030-148 = "[s3] \"You're setting me up for failure here.\"\n[s4] \"But you look good. Really, you do.\""
10054030-151 = "Oh my, thank you. It's thrilling to hear that from you."
