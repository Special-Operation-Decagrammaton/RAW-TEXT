10054030-51 = ""
10054030-52 = "..a big upsy-daisy!"
10054030-53 = ""
10054030-55 = ""
10054030-58 = "Yay! Yay!"
10054030-59 = "I like you sooo much!"
10054030-60 = ""
10054030-61 = ""
10054030-62 = ""
10054030-63 = "Hahaha, well aren't you all pumped up, Kokona!"
10054030-64 = "Ehhh?! Et tu, Rumi?!"
10054030-65 = "I can't use your proper title, remember? We have to conduct this audit secretly."
10054030-66 = "While we're undercover, we should act like regular students, right?"
10054030-67 = "Ah! That makes sense!"
10054030-68 = "Fine, fine. Then I'll give you special permission to call me that while we're here. And only here!"
10054030-69 = "Yes, yes. Thanks for being so mature about it, Kokona."
10054030-70 = "Of course! I'm glad you get it, Rumi!"
