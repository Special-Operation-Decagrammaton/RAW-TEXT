10054030-36 = ""
10054030-37 = ""
10054030-39 = ""
10054030-40 = "คุณครู!!!"
10054030-41 = "[s] \"โคโคน่าจัง!\""
10054030-42 = "อีกแล้วๆ เรียกฉันว่าโคโคน่าจังอีกแล้วนะคะ~"
10054030-43 = "แต่วันนี้ไม่เป็นไรค่ะ! คราวนี้ฉันจะแสดงให้คุณครูเห็นให้ได้ว่าฉันเป็นกุลสตรีเต็มตัวขนาดไหนค่ะ!"
