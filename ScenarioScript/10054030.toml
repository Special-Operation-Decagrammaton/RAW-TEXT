[translation]
10054030-1 = "ตอนที่ 3;เล่นน้ำ ทำงาน รวมๆ แล้วคือไปพักร้อน 1"
10054030-5 = "แม่น้ำเป็นสถานที่แบบไหนกันนะคะ?"
10054030-6 = "เป็นภูมิประเทศที่เรียกได้ว่าเป็นแหล่งกำเนิดอารยธรรม ถูกใช้ประโยชน์มากที่สุดในฐานะพื้นที่#nทำการเกษตร การคมนาคม และที่อยู่อาศัยมาตั้งแต่สมัยโบราณค่ะ"
10054030-7 = "ใช่แล้ว แม่น้ำมีความหมายสำคัญต่อซานไห่จิงเช่นกัน"
10054030-8 = "ยกตัวอย่างเช่น ตัวอักษรที่มีความหมายว่า 'ปกครอง' เดิมทีแล้วมีความหมายว่า 'ควบคุมน้ำ'"
10054030-9 = "โดยเฉพาะหลังเกิดน้ำท่วม ว่ากันว่าการแบ่งสรรที่ดินที่เส้นเขตแดนเลือนรางให้ถูกต้องอีกครั้งนั้น#nเป็นเรื่องสำคัญเลยละ"
10054030-10 = "ใช่ค่ะ ความหมายของคำว่า 'ควบคุมน้ำ' จึงขยายไปเป็นแนวคิดเรื่อง 'การปกครองทุกสิ่ง' นั่นเองค่ะ"
10054030-11 = "ถ้ามองในแง่นั้น การที่กิจกรรมพักร้อน... ไม่สิ กิจกรรมตรวจสอบของพวกเราในครั้งนี้ถูกกำหนดให้จัด#nในหุบเขาที่มีแม่น้ำ ก็ถือว่าเป็นเรื่องที่มีความหมายไม่น้อยเลยนะคะ"
10054030-18 = "[ns] \"ว้าว...\""
10054030-22 = ""
10054030-23 = "เป็นสถานที่ที่ดีจริงๆ ใช่มั้ยล่ะ?"
10054030-24 = "เอาละ คุณครู พวกฉันจะไปเปลี่ยนเป็นชุดว่ายน้ำมา... ตั้งตารอให้เต็มที่เลยนะ"
10054030-25 = ""
10054030-27 = ""
10054030-29 = "(ระหว่างมองตามเหล่านักเรียนที่วิ่งออกไปอย่างตื่นเต้น)"
10054030-30 = "(คุณครูก็ตัดสินใจเตรียมตัวสำหรับกิจกรรมพักร้อน... ไม่สิ กิจกรรมตรวจสอบในแบบของตัวเอง!)"
10054030-31 = ""
10054030-32 = "โคโคน่าจัง? อย่าตื่นเต้นมากเกินจนไปรบกวนคนอื่นนะคะ"
10054030-33 = "ไม่ต้องห่วงค่ะ พี่ชุน! พอมาอยู่ที่นี่ ฉันเป็นกุลสตรีเต็มตัวกว่าเดิมอีกค่ะ!"
