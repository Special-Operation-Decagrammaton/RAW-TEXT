[translation]
41180-1 = "제18화;클로버 작전 2"
41180-2 = "그으으읏…… 그으으읏……!"
41180-5 = "……틀렸어. 조금도 꿈쩍하질 않아."
41180-6 = "증거도 다 확보했다면서 그 안에서 무얼 하고 있는 거야?"
41180-7 = "내가 벌어줄 수 있는 시간도 얼마 남지 않았다고! 빨리 그 보관실에서 나와!"
41180-8 = "나가고 싶어도 그럴 수가 없어. 문이 닫혀버렸거든."
41180-9 = "뭐? 어째서 문을 닫은 거야?"
41180-10 = "금고 형태의 시설 문은 닫히면 오토락이 발동하는 게 상식이잖아?!"
41180-11 = "그, 그게…… 문을 열어 두면 밖에서 혹시라도 이쪽을 볼까 봐 무서워서……."
41180-12 = "밖의 상황은 내가 CCTV로 감시하고 있다고 했잖아?"
41180-13 = "뭐가 불안해서 그런 시키지도 않은 짓을 한 거야?"
41180-14 = "미, 미안……"
41180-16 = "최소한 진입하기 전에 도어 스토퍼라도 끼워 두었다면 좋았을 것을……"
41180-17 = "우으, 우으으……"
41180-18 = "역시 나 같은 건 처음부터 SRT에 들어오지 말았어야 했어……"
41180-19 = "겁만 많고, 다른 소대원들의 발목이나 잡고……"
41180-20 = "아니, 내가 이 세상에 태어난 것부터가 잘못이야……."
41180-21 = "너무 자책하지 마세요, 미유. 저격수가 실내전에 익숙지 못한 건 어쩔 수 없는 일이니까요."
41180-22 = "후위의 상황을 고려하지 못한 제 실책입니다."
41180-23 = "……미야코의 실책일리가 없잖아."
41180-24 = "그렇게 말 흐리지 마. 이건 명백한 미유의 실책이니까."
41180-26 = "지금이 누구 탓을 하고 있을 때야? 보안 시스템이 정상화되기 전에 나갈 방법을 찾아야지!"
41180-27 = "그럼 어떻게 하라고? 아까 내가 말한 것처럼 철문에 대고 도어 브리칭이라도 할까?"
41180-28 = "그나저나 아까처럼 해킹으로 전자자물쇠를 해제할 수는 없는 거야?"
41180-29 = "전자자물쇠를 해제하면 뭐 해. 기계식 잠금쇠가 따로 걸려있는데!"
41180-30 = "실패했다…… 죽고 싶어…… 도망치고 싶어……."
41180-32 = "여, 여러분. 일단 진정을……."
41180-34 = "미야코, 뭔가 좋은 생각 없어? 앞으로 5분도 남지 않았다고!"
41180-35 = "그래. 지금은 네가 소대장이니까."
41180-36 = "미야코 쨩……"
41180-41 = "제, 제가요?"
41180-42 = "빨리 결정해, 미야코. 시간이 없어!"
41180-43 = "미야코……!"
41180-44 = "저는……."
41180-50 = "(……그러고 보면 SRT를 떠난 이후로 내 지휘가 성공한 적은 단 한 번도 없었어.)"
41180-51 = "(첫날의 공원에서도, 캠프가 물에 잠겼을 때도……)"
41180-52 = "(……어쩌면 당연한 일인지도 몰라. 내게는 선생님과 같은 지략도 통솔력도 없으니까.)"
41180-53 = "(그런데 이 절체절명의 상황에서……)"
41180-54 = "(과연 내가 이 작전을 성공시킬 수 있을까……?)"
41180-55 = "[s1] \"정신 차려, 미야코!\"\n[s2] \"아직 작전 중이야!\""
41180-56 = "……선생님?"
41180-57 = "……선생님?"
41180-58 = "저는…… 이 상황을 지휘할 수 없습니다. 현장의 상황은 비관적입니다."
41180-59 = "선생님께서 여기 계셨더라면 이 난관을 헤쳐나갈 수 있는 묘안을 떠올리셨을지도 모르겠지만……"
41180-60 = "……제게는 선생님과 같은 능력이 없습니다."
41180-61 = "설령 제게 숨겨진 능력이 있다고 한들……"
41180-62 = "모르겠어요. 저 혼자서는 아무것도 할 수가 없어요!"
41180-63 = "저는…… 저 자신을 믿을 수가 없어요……."
41180-64 = "[s] \"혼자서 모든 걸 짊어지려 하지 마.\""
41180-68 = "[ns] \"너를 의지하는 소대원들을 믿어!\""
41180-69 = "저를 의지하는…… 소대원들이요?"
41180-74 = "그래, 이 상황에서 네가 아니면 누가 RABBIT 소대를 지휘하겠어?"
41180-75 = "경찰서를 습격하러 왔다가 금고에 갇히는 경우는 SRT의 교범에도 없는 상황이라고."
41180-76 = "저격 임무는 언제나 고독하고 두려운 상황뿐이지만……"
41180-77 = "그래도 미야코 쨩이 지켜보고 있다고 생각하면 조금은 안심이 돼."
41180-78 = "설마 나한테 의지할 생각은 아니지? 이쪽은 오퍼레이팅 만으로도 머리가 터질 것 같다고."
41180-80 = "그러니까 지금은 우리 모두……"
41180-82 = "[s] \"미야코를 믿을게!\""
41180-88 = "……알겠습니다."
41180-89 = "그럼 지금부터 전 대원의 행동은 현장 지휘관인 제가 직접 통제하겠습니다."
41180-90 = "……급변하는 현장의 특성상 질문을 받기 어려울 수도 있습니다. 이해할 수 없는 지시가 내려오더라도 질문 대신 양해를 부탁드립니다."
41180-91 = "그리고 작전이 끝나면 모두 이 <클로버>를 들고…… [ruby=코우사기 공원]우리들의 집[/ruby]으로 돌아가는 겁니다."
41180-92 = "……이해하셨지요?"
41180-95 = "알겠어!"
41180-97 = "(그로부터 약 5분 뒤……)"
41180-102 = "기, 기록 보관실의 경보가 울렸어! 침입자인가?"
41180-103 = "에이. CCTV에는 흔적도 남아 있지 않은데 침입자일 리가 있겠어?"
41180-104 = "근처를 돌아다니던 길고양이나 쥐가 경보기를 건드린 모양이지."
41180-105 = "하지만 고양이가 기록 보관실의 철문을 어떻게 통과해서 들어간 거지?"
41180-106 = "글쎄. 어딘가에 굴이라도 판 게 아닐까?"
41180-118 = "고양아, 고양아~ 이리 온~"
41180-121 = "어라? 당신은 누구—"
41180-135 = "경계에 이상이 생겼으면 언제나 최악의 상황을 가정해야지."
41180-136 = "그런 느긋한 마음가짐으로 경비를 하니 키보토스에 말썽이 끊이질 않는 거야."
41180-141 = "치, 침입자다!"
41180-153 = "미야코의 말처럼 고의로 경보 장치를 작동시켰더니, 경비국 학생들이 제 발로 문을 열어주러 찾아왔네."
41180-154 = "키보토스의 치안을 함께 책임져야 할 동료가 이렇게 얼빠진 걸 다행으로 생각해야 할지, 안타까워해야 할지……."
41180-155 = "그, 그나저나 지금 이 상황 괜찮은 거야?"
41180-156 = "조금 전부터 경보가 엄청나게 울리고 있는데……."
41180-161 = "네. 경보를 들은 경찰학교의 다른 학생들이 곧 이쪽으로 몰려올 겁니다."
41180-162 = "상대의 의표를 찔러 정면 승부를 하되, 개활지에서 다수를 한 번에 상대하는 상황은 피합시다."
41180-163 = "……엄폐물이 많은 동쪽 복도가 적합하겠군요."
41180-167 = "모두 매복에 주의[ruby=목표 상 재집결지]하며 ORP까지 [/ruby]이동합니다!"
