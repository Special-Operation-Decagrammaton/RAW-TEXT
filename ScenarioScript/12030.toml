[translation]
12030-1 = "제3화;안녕, 흥신소 68"
12030-2 = "흥신소 68의 사무실"
12030-3 = "하아……."
12030-4 = "아루 쨩~ 거기서 한숨만 쉬고 있으면 어떡해. 짐 안 옮길 거야?"
12030-5 = "……하아아."
12030-7 = "저, 저기 이건 어디로 옮기면 될까요?"
12030-8 = "응? 이야, 이거? 아루 쨩이 모처럼 실력발휘한 서예 말이지? 저쪽 타는 쓰레기에."
12030-11 = "버리면 안 되지!! 가지고 가야 하잖아!"
12030-12 = "그치만 서예 시간에 숙제로 쓴 거잖아. 이것봐, 일일일악? 뜻도 이상하고."
12030-13 = "그, 그치만 10년 후에는 분명 1억엔 정도의 가치가……."
12030-14 = "……하아."
12030-16 = "시무룩하네…… 아루 쨩."
12030-17 = "왜 그래, 사장."
12030-18 = "아루 쨩은 사무실을 정리하고 이사가는 게 영 못마땅한가 봐."
12030-19 = "그치만 선도부에게 위치가 알려져버린 것도 곤란하고, 임무 실패로 클라이언트한테서도 노려질 거고. 어쩔 수 없잖아?"
12030-20 = "아비도스와의 싸움도 찝찝하게 끝나버렸고."
12030-21 = "그, 그렇잖아! 같이 등을 맞대고 싸운 녀석들을 노린다니…… 시, 시시하다고, 그런거!"
12030-22 = "……하아."
12030-23 = "돈가방의 남은 돈도 전부 그 라멘집 수리비로 두고 왔고. 아루 사장. 너는……."
12030-24 = "시, 시끄러! 시끄러!"
12030-25 = "나도 안다고!"
12030-26 = "……."
12030-27 = "하드보일드한 무법자는…… 나랑은……. 그런……."
12030-29 = "……하아."
12030-30 = "정말이지 손이 많이 가는 사장님이야."
12030-31 = "그치만 그게 바로 우리의 아루 쨩이잖아? 같이 있으면 엄청 재미있으니까."
12030-32 = "네! 맞아요, 아루 님! 저, 저도 아루 님이 없었더라면 분명 살아있지 못했을 테니까……."
12030-35 = "제가 제일 존경하는 건 아루 님이에요!"
12030-36 = "시, 시끄럽다고오-!"
12030-38 = "끄응-차!"
12030-39 = "이걸로 끝이에요! 짐을 다 실었어요!"
12030-40 = "이제 어디로 가지?"
12030-41 = "흠……."
12030-42 = "뭐- 딱히 계획이 없다면 게헨나로 다시 돌아갈까?"
12030-43 = "[s] \"모두들 안녕~\""
12030-45 = "!!"
12030-46 = "다, 당신은?!"
12030-47 = "샤, 샬레의 선생?!"
12030-48 = "우와? 선생님이다! 와줬구나?"
12030-49 = "뭐, 뭐 때문에 온 거야! 아비도스 녀석들의 조력자잖아!"
12030-51 = "응- 그치만 선생님은 사이 좋게 지내 달라고 얘기했었는 걸?"
12030-52 = "네. 맞아요. 선도부와 싸울 때도 신세를 졌었고……."
12030-53 = "악의가 있어보이진 않으니……. 게다가 우리도 이제 떠날 거고. 굳이 적대할 필요는 없겠지."
12030-54 = "[s] \"떠나는 거야?\""
12030-56 = "떠난다기 보단 또 다른 의뢰를 찾아서 이동하는 거야! 이동!"
12030-57 = "[s] \"다음에 또 만나자. 아루 쨩.\""
12030-58 = "……."
12030-59 = "아, 아하하하! 당연하지! 선생님, 당신과는 사업 파트너로서 협업하는 것도 나쁘지 않을 거 같고."
12030-60 = "비록 지금은 우리가 바빠서 곤란하지만 말야. 나중에 말야, 나중에."
12030-61 = "응, 그치만 아비도스에 두번 다시 오지 않는 것도 아니니까. 여기 마음에 들었거든."
12030-62 = "뭐…… 그렇지."
12030-63 = "네, 맞아요."
12030-64 = "무, 물론 라멘은 먹으러 올 거야!!"
12030-68 = "……맛있었으니까."
12030-71 = "(그렇게 흥신소 68의 짐을 실은 트럭이 골목길을 빠져나갔다.)"
12030-73 = "안녕하세요, 마스터. 병문안 왔어요."
12030-74 = "괜찮아? 마스터?"
12030-75 = "여- 세리카 씨. 그리고 세리카 씨의 친구 아야네 씨. 이른 시간인데 와줬네."
12030-76 = "[s] \"몸은 괜찮으십니까.\""
12030-77 = "그리고 선생님까지. 괜찮아, 괜찮아. 살짝 긁힌 것뿐이니까."
12030-78 = "그치만…… 마스터의 가게가……."
12030-79 = "뭐, 알바를 그만두게 해서 미안하네. 세리카 씨."
12030-80 = "무슨 소리야. 건물이 없어졌는데 당연하지, 그런 건."
12030-81 = "그리고 조만간 가게도 접고 그만 둘 예정이었으니까. 그 예정이 생각보다 빨라진 것뿐이야."
12030-82 = "네? 그만둔다고요?"
12030-83 = "그래. 얼마 전부터 건물 주인이 퇴거통보를 해 왔었거든."
12030-84 = "거, 건물 주인이요? 무슨 얘기죠? 아비도스 자치구 건물의 소유주는 아비도스 학교잖아요. 분명 마스터의 가게도……."
12030-85 = "……."
12030-87 = "아니. 몇 년 전에 아비도스 학생회가 빚을 갚지 못해서 건물의 소유권이 바뀌었었어. 오래된 일이라 너희는 몰랐었나 보네."
12030-88 = "네?!"
12030-89 = "저, 정말이야?! 자치구의 땅을?! 누구한테?!"
12030-90 = "[s1] \"……카이저 론입니까?\"\n[s2] \"……카이저 코퍼레이션입니까?\""
12030-91 = "음…… 그런 이름이었던 거 같은데……. 미안, 난 서류나 계약 같은 걸 잘 몰라서."
12030-92 = "음…… 그런 이름이었던 거 같은데……. 미안, 난 서류나 계약 같은 걸 잘 몰라서."
12030-93 = "……. 그런. 그런 거라면……."
12030-95 = "세리카 쨩. 선생님, 먼저 학교로 돌아가 계세요. 저는 확인해봐야 할 게 있어요."
12030-96 = "으, 응? 뭔데? 같이 가, 아야네 쨩!"
12030-97 = "그, 그럼 선생님은 먼저 동아리실에 가 계세요! 저희는 곧 뒤따라갈게요!"
12030-98 = "[s] \"그래. 나도 모두에게 알려야 할 말이 있으니까.\""
12030-99 = "마스터! 은퇴 같은 건 생각하지 마! 알았지?"
12030-100 = "아, 그리고 세리카 씨. 이상한 돈가방이 가게에 있던데 이건……."
12030-102 = "[s] \"가게 재건에 사용하십시오.\""
12030-103 = "으, 으응?"
12030-106 = "가자, 세리카 쨩!"
12030-107 = "응, 어딘진 모르겠지만…… 선생님, 조금 이따가 봐!"
12030-110 = "다음화;각자의 이야기들 1"
