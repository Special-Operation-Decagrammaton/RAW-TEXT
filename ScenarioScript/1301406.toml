[translation]
1301406-1 = "수영복과 청춘"
1301406-6 = "(해변에 도착하니 렌게가 먼저 와서 기다리고 있었다.)"
1301406-11 = "아, 이쪽이야."
1301406-12 = "와줘서 고마워."
1301406-13 = "해변에서 해보고 싶은 청춘 활동이 있어서."
1301406-14 = "……뭐라고 생각해?"
1301406-15 = "[s1] \"손잡고 해변 걷기?\"\n[s2] \"달빛이 비치는 바다 같이 보기?\""
1301406-20 = "무, 물론 그런 것도 해보고 싶어……!"
1301406-21 = "하지만, 지금 가장 해보고 싶은 건……."
1301406-22 = "뭐라 해도……."
1301406-28 = "불꽃놀이야!"
1301406-34 = "[wa:1650]― [log=렌게 수영복]청춘은, [wa:1180]빨리 지나가는 것 같아.[/log]"
1301406-37 = "― [log=렌게 수영복]격렬하게 타오르다가, [wa:1220]금방 꺼지는……[wa:40] [/log]"
1301406-39 = "― [log=렌게 수영복]이 불꽃처럼.[/log]"
1301406-42 = "[wa:1200]― [log=렌게 수영복]나도 처음엔[wa:1260] 그렇게 생각했어.[/log]"
1301406-45 = "― [log=렌게 수영복]……단련만 하다가,[wa:920] 청춘이 끝나버리겠지[wa:1460]하고.[/log]"
1301406-48 = "[wa:560]― [log=렌게 수영복]하지만[wa:1730] 이젠 아니야.[/log]"
1301406-50 = "― [log=렌게 수영복]스승님과 만나고[wa:620] 많은 게 바뀌었으니까.[/log]"
1301406-53 = "― [log=렌게 수영복]매일이 즐겁고 [wa:1580]충실한 느낌이야.[/log]"
1301406-56 = "[wa:800]― [log=렌게 수영복]물론, [wa:670]시간은 돌이킬 수 없지만……[/log]"
1301406-59 = "― [log=렌게 수영복]앞으로도,[wa:80] [/log]"
1301406-61 = "― [log=렌게 수영복]충분히 청춘을 즐길 수 있다 생각해.[/log]"
1301406-64 = "[wa:1000]― [log=렌게 수영복]불꽃이 꺼질 것 같으면,[/log]"
1301406-66 = "[wa:340]― [log=렌게 수영복]새로운 장작을 [wa:630]태우면 되니까.[wa:80] [/log]"
1301406-69 = "[wa:2450]― [log=렌게 수영복]그러니까[wa:780] 스승님……[/log]"
1301406-72 = "― [log=렌게 수영복]계속 함께 [wa:1200]청춘, 해줄……[wa:2060]거지?[/log]"
1301406-76 = "하핫! 나답지 않았으려나."
1301406-77 = "그게, 캠프파이어 때는 좀 과했었잖아?"
1301406-78 = "청춘의 불꽃은 타오르면 타오를수록 좋은 거라고 생각했는데…… 그렇지 않았어."
1301406-79 = "그래서 이번에는, 작은 불꽃으로, 조용히 즐겼으면 해서…… 자."
1301406-80 = "[s] \"오……. 선향불꽃을 엄청 많이 가져왔네?\""
1301406-81 = "응. 반짝반짝 빛나는 걸 보면서, 느긋하게 보내고 싶어서."
1301406-82 = "해변이니까 불이 날 위험도 없어."
1301406-83 = "[s3] \"마침 오늘은 주변에 사람이 없네.\"\n[s4] \"운치 있는 밤바다도 실컷 볼 수 있겠다!\""
1301406-88 = "그, 그래. 이것도 청춘 활동이니까 어울려 달라고."
1301406-96 = "자…… 같이 불을 붙이자."
1301406-100 = "(……이후로 오랫동안 렌게와 둘만의 해변에서 불꽃놀이를 즐겼다.)"
1301406-102 = "(정말 충실한 청춘 활동이었다.)"
