[translation]
90100100-1 = "第10話;進入黑暗之中"
90100100-4 = "[ns1] 「好熱……」\n[ns2] 「而且好暗……」"
90100100-7 = ""
90100100-8 = "抱歉給您添麻煩了，老師。"
90100100-9 = "這次作戰必須維持燈火管制狀態，所以正在限制照明。"
90100100-10 = "本來想把多出來的夜視裝備借給您，可惜我們連備用品都沒有……"
90100100-11 = "[s3] 「沒關係。我多少還能隱約看見一點。」\n[s4] 「話說回來，這裡是……？」"
90100100-14 = "這是與白鰻車站的空調室相連的地下道。"
90100100-15 = "由於是地下設施排熱的通道而有些悶熱，#n不過這是為了[ruby=扭來扭去]引出目標而選[/ruby]定的地點，還請見諒。"
90100100-16 = "[s] 「不會。你們才是辛苦了。」"
90100100-17 = ""
90100100-20 = "[ns5] 「話說回來，扭來扭去在這麼暗的地方也會出現嗎？」\n[ns6] 「扭來扭去不是只有晴天才能觀測到的怪談嗎？」"
90100100-23 = "以一般的認知來說是這樣沒錯。"
90100100-24 = "……不過在比對了本次事件的記錄後，#n我開始認為天氣或許並不是認知到「扭來扭去」的關鍵因素。"
90100100-25 = "上次作戰時，隔著瞄準鏡目擊到陽炎的FOX4認知到了扭來扭去並受其影響，#n而沒看見陽炎的FOX3則平安無事。"
90100100-26 = "如果扭來扭去的原型是警惕中暑的「正午惡靈」──#n那麼只要是悶熱且會升起陽炎的地方，就算並不開闊應該也能認知到才對。"
90100100-27 = "最重要的是，在這個地點就不會發生讓市民捲入作戰而受害的情況了。"
90100100-28 = "[s] 「那確實會有幫助呢。」"
90100100-29 = ""
90100100-32 = "[ns7] 「不過雪乃，或許是我多心了……」\n[ns8] 「你是不是有意識地在避免和市民有所牽連？」"
90100100-35 = "這個嘛……如果您指的是造成市民的困擾……"
90100100-36 = "身為SRT的一員，理應避免做出任何可能讓市民陷入危險的判斷。"
90100100-37 = ""
90100100-40 = "作戰，總是伴隨著附帶的傷害。"
90100100-41 = ""
90100100-44 = "我們是負責守護奇普托斯市民安全的特殊部隊──SRT。"
90100100-45 = "如果無法擔保市民的安全，那麼任何作戰都毫無意義。"
90100100-46 = ""
90100100-49 = "現在要是放走那傢伙，將來會招致更大的損害！"
90100100-50 = "那個判斷，你有辦法負起責任嗎？"
90100100-51 = ""
90100100-54 = "更何況我們曾經的過錯帶給了市民莫大的困擾，絕對不能再加深對他們的虧欠了。"
90100100-55 = ""
90100100-58 = "明明只是個連為自己負責的膽量都沒有的小毛頭。"
90100100-59 = ""
90100100-60 = "無論伴隨著什麼樣的大義名分。"
90100100-61 = ""
90100100-64 = "[ns] （不知為何，似乎聽見了層層重疊的奇妙幻聽……）"
90100100-66 = "[ns9] 「……我知道了。」\n[ns10] 「但是無論如何，你們的安全都是最優先的。」"
90100100-69 = "我會銘記在心。"
90100100-70 = ""
90100100-72 = ""
90100100-73 = "這裡是FOX2。#n已抵達Point Charlie。"
90100100-74 = "目前氣溫攝氏34度……雖然暗得看不太清楚，不過空調配管上肯定升起了陽炎。"
90100100-75 = "確認。所有人務必留意，不要在配戴裝備之前用肉眼直視陽炎。"
90100100-76 = "[s] 「難道昨天說的那個裝備就是……」"
90100100-77 = ""
90100100-79 = ""
90100100-80 = "嗯，是夜視鏡！"
90100100-81 = "雖然不知道扭來扭去是怎麼迷惑人的……#n但是如果它是干涉視神經的話，我想原理應該和我的閃光盾很接近才對。"
90100100-82 = ""
90100100-84 = ""
90100100-85 = "夜視鏡要是遇到閃光彈的話，不也一樣會失靈嗎？"
90100100-86 = "但是至少能防止眼睛被弄瞎。"
90100100-87 = "因為夜視鏡是由能對光產生反應的數位感測器，將重組成電子訊號的畫面顯示出來，#n所以一旦接收到對眼睛有害程度的進光量，感測器就會自動切斷。"
90100100-88 = "可是這樣真的沒問題嗎？#n也不能保證隔著夜視鏡就不會被扭來扭去迷惑啊……"
90100100-89 = "如果我們不嘗試的話，不就得由其他人來嘗試了嗎？"
90100100-90 = "既然如此，倒不如就由我們來試試看。"
90100100-91 = "早知道會這樣，當初就該把小隊的名字取成金絲雀而不是狐狸了。"
90100100-92 = "什麼嘛，FOX4。#n還沒開始嘗試就已經害怕了嗎？"
90100100-93 = "是因為高興啦……！#n總之快點下令吧，我隨時可以開始！"
90100100-94 = ""
90100100-96 = ""
90100100-97 = ""
90100100-98 = ""
90100100-99 = "那麼，我們這邊也準備突入吧。"
90100100-100 = "FOX4，請求確認目標的座標。"
90100100-101 = "收到，交給我吧！"
90100100-102 = ""
90100100-104 = ""
90100100-108 = "確認到來自Point Romeo方位0-8-5方向的熱源。"
90100100-109 = ""
90100100-112 = "已確認空調配管上發生了多道陽炎。#n座標是……"
90100100-113 = "咦？距離倍率怪怪的。#n成像的位置比看起來要遠得多。"
90100100-114 = ""
90100100-117 = ""
90100100-118 = ""
90100100-119 = "果然……"
90100100-120 = ""
90100100-122 = ""
90100100-123 = "……FOX3，待命。"
90100100-126 = "我看見了這間空調室裡不可能存在的草地。#n而在那之後，還有不規則晃動的──"
90100100-127 = ""
90100100-131 = ""
90100100-132 = ""
90100100-133 = ""
90100100-135 = "……確認到「白色稻草人」的出現。"
90100100-137 = "FOX4！聽得到我說話嗎？記得我是誰吧！？"
90100100-138 = "哎唷喂，嚇我一跳。#n不用那麼大聲我也記得你是誰啦，小不點。"
90100100-139 = "什麼？你說誰是小不點啊？"
90100100-140 = "FOX1，這傢伙現在神智不清了！作戰果然失敗了！"
90100100-141 = ""
90100100-142 = "幸好FOX4沒有失去意識，看來是確認到目標的位置了。"
90100100-143 = "全員，配戴夜視裝備。切換到IR模式後確認焦點。"
90100100-144 = ""
90100100-146 = ""
90100100-148 = ""
90100100-149 = ""
90100100-150 = ""
90100100-152 = ""
90100100-153 = ""
90100100-154 = "從現在起，[ruby=FOX]「狐狸」[/ruby]將掌控黑夜。"
