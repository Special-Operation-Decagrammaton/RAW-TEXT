90100100-123 = "FOX 3 รอคำสั่ง..."
90100100-126 = "ฉันเห็นทุ่งหญ้าที่ไม่มีทางจะมีอยู่ในห้องระบบปรับอากาศแห่งนี้ และถัดออกไป ฉันพบการปรากฏตัวของ..."
