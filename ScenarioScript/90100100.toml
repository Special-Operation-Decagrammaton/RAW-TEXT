[translation]
90100100-1 = "ตอนที่ 10;สู่ความมืดมิด"
90100100-4 = "[ns1] \"ร้อนจัง มืดด้วย...\"\n[ns2] \"มืดจัง ร้อนด้วย...\""
90100100-7 = ""
90100100-8 = "ขอโทษที่ทำให้ลำบากค่ะ คุณครู"
90100100-9 = "ปฏิบัติการนี้ต้องอยู่ในสภาวะพรางแสง เลยต้องจำกัดการใช้แสงสว่างค่ะ "
90100100-10 = "ถ้าเป็นไปได้ฉันก็อยากเอาอุปกรณ์มองกลางคืนให้คุณครูยืมใช้ แต่พวกเราก็ไม่มีสำรองเหมือนกันค่ะ"
90100100-11 = "[s3] \"ไม่เป็นไร ครูพอมองเห็นรางๆ อยู่ ว่าแต่ที่นี่...\"\n[s4] \"ไม่เป็นไรหรอก ว่าแต่ที่นี่ที่ไหนเหรอ?\""
90100100-14 = "ทางเดินนี้เชื่อมไปยังห้องระบบปรับอากาศของสถานีชิโระอุนางิค่ะ"
90100100-15 = "ที่นี่เป็นทางระบายความร้อนของอาคารใต้ดิน ก็เลยค่อนข้างอบอ้าว แต่นี่เป็นสถานที่ที่เราเลือกใช้เพื่อ#nล่อ[ruby=คุเนะคุเนะ]เป้าหมาย[/ruby] ต้องขอโทษที่ทำให้ลำบากด้วยค่ะ"
90100100-16 = "[s] \"ไม่หรอก กองทหาร FOX ต่างหากที่ต้องมาลำบากกัน\""
90100100-17 = ""
90100100-20 = "[ns5] \"แต่ในที่มืดๆ แบบนี้ คุเนะคุเนะจะโผล่มาเหรอ?\"\n[ns6] \"แต่คุเนะคุเนะไม่ได้เป็นตำนานที่เห็นได้เฉพาะที่ที่ฟ้าโปร่งหรอกเหรอ?\""
90100100-23 = "โดยทั่วไปแล้วก็เข้าใจกันแบบนั้นค่ะ"
90100100-24 = "ฉันเอาบันทึกข้อมูลเหตุการณ์นี้มาเปรียบเทียบกันแล้ว... และคิดว่าสภาพอากาศอาจไม่ใช่ปัจจัยสำคัญ#nในการพบเห็น 'คุเนะคุเนะ' ค่ะ"
90100100-25 = "ในปฏิบัติการครั้งก่อน FOX 4 มองเห็นไอร้อนผ่านกล้องเล็ง จึงรับรู้การมีอยู่ของคุเนะคุเนะจนโดนมัน#nครอบงำ แต่ FOX 3 ที่ไม่เห็นไอร้อนกลับไม่เป็นอะไรค่ะ"
90100100-26 = "ถ้าต้นกำเนิดของคุเนะคุเนะมาจาก 'วิญญาณร้ายยามเที่ยงวัน' ตำนานเตือนภัยโรคลมแดด ต่อให้ที่ที่นั้น#nไม่ใช่พื้นที่เปิดโล่ง ขอเพียงร้อนอบอ้าวกับมีไอร้อนลอยขึ้นมา ก็อาจรับรู้การมีอยู่ของคุเนะคุเนะได้ค่ะ"
90100100-27 = "ที่สำคัญ ถ้าเป็นที่นี่ก็ไม่ต้องกังวลว่าชาวเมืองจะพลอยโดนลูกหลงจากปฏิบัติการด้วยค่ะ"
90100100-28 = "[s] \"แบบนั้นก็น่าจะช่วยได้มากเลยนะ\""
90100100-29 = ""
90100100-32 = "[ns7] \"แต่ครูว่ายูกิโนะจงใจเว้นระยะห่างจากชาวเมืองหรือเปล่า?\"\n[ns8] \"แต่ยูกิโนะตั้งใจหลีกเลี่ยงการเข้าไปข้องเกี่ยวกับชาวเมืองหรือเปล่า?\""
90100100-35 = "นั่นสินะคะ... ถ้าจะหมายถึงเรื่องการสร้างความเดือดร้อนให้ชาวเมืองแล้วละก็"
90100100-36 = "ในฐานะของ SRT แล้ว การหลีกเลี่ยงการตัดสินใจที่อาจทำให้ชาวเมืองตกอยู่ในอันตราย ย่อมเป็นสิ่งที่ถูกต้องค่ะ"
90100100-37 = ""
90100100-40 = "ทุกปฏิบัติการย่อมมีความเสียหายข้างเคียงตามมาเสมอ"
90100100-41 = ""
90100100-44 = "แต่พวกฉันเป็นหน่วยรบพิเศษ SRT ผู้มีหน้าที่ปกป้องความปลอดภัยของชาวเมืองคิโวทอส"
90100100-45 = "ถ้าไม่อาจรับประกันความปลอดภัยของชาวเมืองได้ ไม่ว่าปฏิบัติการใดก็ไร้ความหมายค่ะ"
90100100-46 = ""
90100100-49 = "ถ้าปล่อยยัยนั่นไปตอนนี้ จะยิ่งเกิดความเสียหายมากกว่าเดิมนะ!"
90100100-50 = "เธอจะรับผิดชอบการตัดสินใจนั้นไหวแน่เหรอ?"
90100100-51 = ""
90100100-54 = "ก่อนหน้านี้พวกฉันเคยสร้างความเดือดร้อนให้ชาวเมืองมาแล้ว เพราะงั้นก็เลยไม่ควรจะก่อหนี้เพิ่มอีกค่ะ"
90100100-55 = ""
90100100-58 = "เธอมันก็แค่เด็กที่ไม่มีแม้แต่ความกล้าจะรับผิดชอบการกระทำของตัวเอง"
90100100-59 = ""
90100100-60 = "ต่อให้มีเหตุผลหรืออุดมการณ์อันชอบธรรมแค่ไหนก็ตาม"
90100100-61 = ""
90100100-64 = "[ns] (เหมือนได้ยินเสียงแว่วแปลกๆ ซ้อนกันเลย...)"
90100100-66 = "[ns9] \"เข้าใจแล้ว แต่ความปลอดภัยของพวกเธอต้องมาก่อนเสมอนะ\"\n[ns10] \"ไม่ว่าจะเกิดอะไรขึ้น ความปลอดภัยของพวกเธอต้องมาก่อนนะ\""
90100100-69 = "ฉันจะจำให้ขึ้นใจค่ะ"
90100100-70 = ""
90100100-72 = ""
90100100-73 = "FOX 2 รายงาน ฉันมาถึงจุดชาร์ลีเรียบร้อย"
90100100-74 = "ขณะนี้อุณหภูมิอยู่ที่ 34 องศาเซลเซียส... ถึงจะมืดจนมองเห็นไม่ชัด แต่เหนือท่อระบบปรับอากาศ#nน่าจะมีไอร้อนลอยขึ้นมาแน่"
90100100-75 = "รับทราบ ถ้ายังไม่ได้สวมอุปกรณ์ให้เรียบร้อย ให้ทุกคนระวังด้วย อย่ามองไอร้อนด้วยตาเปล่า"
90100100-76 = "[s] \"นี่คืออุปกรณ์ที่พูดถึงเมื่อวานเหรอ...?\""
90100100-77 = ""
90100100-79 = ""
90100100-80 = "อื้อ กล้องมองกลางคืนยังไงล่ะ!"
90100100-81 = "ถึงจะยังไม่รู้ว่าคุเนะคุเนะครอบงำคนได้ยังไง แต่ถ้ามันส่งผลต่อประสาทการมองเห็น ก็น่าจะมีหลักการคล้ายกับโล่แฟลชของฉันน่ะ"
90100100-82 = ""
90100100-84 = ""
90100100-85 = "ถ้าโดนระเบิดแสง กล้องมองกลางคืนก็จะใช้งานไม่ได้เหมือนกันนี่นา"
90100100-86 = "แต่อย่างน้อยก็ช่วยป้องกันไม่ให้ตาพร่าได้ละนะ"
90100100-87 = "กล้องมองกลางคืนใช้เซนเซอร์ดิจิทัลตรวจจับแสงแล้วแปลงเป็นภาพ ดังนั้นถ้ามีแสงจ้าในระดับที่#nเป็นอันตรายต่อดวงตา เซนเซอร์ก็จะตัดการทำงานโดยอัตโนมัติน่ะ"
90100100-88 = "แต่วิธีนี้จะได้ผลจริงเหรอ? ถึงจะมองผ่านกล้องมองกลางคืน ก็ไม่มีอะไรรับประกันว่าจะไม่ถูกคุเนะคุเนะ#nครอบงำนะ..."
90100100-89 = "แต่ถ้าพวกเราไม่ลองทำละก็ ยังไงคนอื่นก็ต้องทำอยู่ดีไม่ใช่เหรอ?"
90100100-90 = "ถ้าเป็นแบบนั้น ให้พวกเราทำเองยังจะดีเสียกว่า"
90100100-91 = "ถ้ารู้อย่างนี้ เปลี่ยนชื่อกองจาก \"FOX\" เป็น \"CANARY\" เสียก็ดี"
90100100-92 = "อะไรกัน FOX 4 กลัวตั้งแต่ยังไม่ทันเริ่มเลยเหรอ?"
90100100-93 = "ฉันดีใจต่างหาก...! ออกคำสั่งมาได้เลย เดี๋ยวนี้เลย!"
