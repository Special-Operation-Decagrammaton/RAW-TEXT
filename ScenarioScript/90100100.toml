90100100-99 = "งั้นฝั่งเราก็เตรียมบุกได้"
90100100-100 = "FOX 4 ยืนยันพิกัดเป้าหมายด้วย"
90100100-101 = "รับทราบ ให้เป็นหน้าที่ฉันเอง!"
