[translation]
90100100-1 = "Episode 10;Into Darkness"
90100100-4 = "[ns1] \"It's hot...\"\n[ns2] \"And dark...\""
90100100-7 = ""
90100100-8 = "Sorry for the trouble, Sensei."
90100100-9 = "We are operating under restricted lighting for this mission. We must maintain a blackout environment."
90100100-10 = "While we would have liked to lend you night-vision goggles, we don't have any spares."
90100100-11 = "[s3] \"It's okay. I can still see a little.\"\n[s4] \"So, where are we?\""
90100100-14 = "This is the underground passage that leads to Shiro Unagi Station's HVAC room."
90100100-15 = "It's muggy because this is sort of a ventilation passage. It's meant to dissipate heat from the nearby buildings. Most importantly, it should be a good lure."
90100100-16 = "[s] \"I'll survive the heat. You all have it much worse.\""
90100100-17 = ""
90100100-20 = "[ns5] \"How will the kunekune show up here?\"\n[ns6] \"I thought it only came out on clear days.\""
90100100-23 = "That's very understandable."
90100100-24 = "...However, after poring through the incident records, I theorize that perhaps the weather isn't a vital factor."
90100100-25 = "After all, during our last mission, we observed something odd. FOX 4 saw the haze, then the kunekune, and was impacted. FOX 3, who did not see the haze, turned out to be fine."
90100100-26 = "If the kunekune legend was intended to warn people against heat-related illnesses, then we should be able to find it as long as the area is hot and heat-related haze is observed."
90100100-27 = "And, most importantly, this location is far away from any civilians."
90100100-28 = "[s] \"That's reassuring.\""
90100100-29 = ""
90100100-32 = "[ns7] \"By the way, Yukino. I could be imagining it...\"\n[ns8] \"But you seem very concerned about civilian impact.\""
90100100-35 = "...Perhaps. I certainly do not want to inconvenience innocent people."
90100100-36 = "In SRT, we're trained to avoid decisions that could put citizens at risk."
90100100-37 = ""
90100100-40 = "Every mission has consequences and collateral damage, after all."
90100100-41 = ""
90100100-44 = "And SRT consists of special units responsible for the safety of the citizens of Kivotos."
90100100-45 = "If we cannot guarantee the safety of citizens, then there is no point to our work."
90100100-46 = ""
90100100-49 = "If you let 'em go now, they'll come back and it'll be even worse!"
90100100-50 = "You want that on your conscience? It's YOUR responsibility!"
90100100-51 = ""
90100100-54 = "We've...inconvenienced the civilians enough. We've failed our duties and must not increase our debt to the citizens."
90100100-55 = ""
90100100-58 = "You're just a kid! A coward! You don't have the guts to own up to what you did!"
90100100-59 = ""
90100100-60 = "...Even if we think we have a noble cause."
90100100-61 = ""
90100100-64 = "[ns] \"(I thought I heard something strange...)\""
90100100-66 = "[ns9] \"...Very well.\"\n[ns10] \"But no matter what, your safety comes first.\""
90100100-69 = "I will keep that in mind."
90100100-70 = ""
90100100-72 = ""
90100100-73 = "This is FOX 2. I've arrived at Point Charlie."
90100100-74 = "The current temperature is 34 degrees Celsius... I can't see clearly because it's dark, but I feel the haze rising above the HVAC pipes."
90100100-75 = "Confirmed. Everyone, get your gear on. Do NOT look at the haze without protection."
90100100-76 = "[s] \"Could this gear you mentioned yesterday be...?\""
90100100-77 = ""
90100100-79 = ""
90100100-80 = "Night-vision goggles!"
90100100-81 = "We don't know how the kunekune enchants people, but we figured the principle might be similar to my flash shield. It overwhelms the optic nerve."
90100100-82 = ""
90100100-84 = ""
90100100-85 = "Okay. But don't night-vision goggles also get whited-out by flashbangs?"
90100100-86 = "We'll take what we can get."
90100100-87 = "Night-vision goggles are digital. They have limiters, so if they detect a harmful amount of light, they'll automatically shut off."
90100100-88 = "But you're so sure it will be fine? The goggles will keep us from being enthralled by the kunekune?"
90100100-89 = "Someone has to be brave enough to try it."
90100100-90 = "It might as well be us."
90100100-91 = "Oh, funny. Maybe we should have been called the \"CANARY\" Squad instead. How about \"GUINEA PIG\"?"
90100100-92 = "What's the matter, FOX 4? Are you already scared?"
90100100-93 = "No, I'm ecstatic! Awaiting orders!"
90100100-94 = ""
90100100-96 = ""
90100100-97 = ""
90100100-98 = ""
90100100-99 = "Let's secure an entry point."
90100100-100 = "FOX 4, requesting target's coordinates."
90100100-101 = "Got it, right away!"
90100100-102 = ""
90100100-104 = ""
90100100-108 = "Confirming heat source at bearing 0-8-5 from Point Romeo."
90100100-109 = ""
90100100-112 = "Multiple hazes clocked above the HVAC piping. Coordinates are..."
90100100-113 = "What? Adjust your distance scaling. The target should be way further away."
90100100-114 = ""
90100100-117 = ""
90100100-118 = ""
90100100-119 = "Sounds about right..."
90100100-120 = ""
90100100-122 = ""
90100100-123 = "...FOX 2, standing by."
90100100-126 = "I'm seeing a grass field that can't possibly exist in this HVAC room. And beyond the field, I can confirm irregular swaying..."
90100100-127 = ""
90100100-131 = ""
90100100-132 = ""
90100100-133 = ""
90100100-135 = "...and the appearance of the \"white scarecrow.\""
90100100-137 = "FOX 4! Do you read? Are you coherent? Do you know who I am?"
90100100-138 = "Ah! Don't scream like that. Of course I know you...brat."
90100100-139 = "Excuse me?! I am not—"
90100100-140 = "FOX 1, she's lost it! Mission failed!"
90100100-141 = ""
90100100-142 = "It appears that FOX 4 is her usual self. She has located the target."
90100100-143 = "Night vision, everyone. Switch to IR mode and check the focus."
