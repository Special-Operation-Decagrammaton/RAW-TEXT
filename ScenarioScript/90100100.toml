90100100-108 = "ตรวจพบแหล่งความร้อนที่ทิศทาง 0-8-5 จากจุดโรมิโอ"
90100100-109 = ""
90100100-112 = "พบไอร้อนจำนวนมากเหนือท่อระบบปรับอากาศ ส่วนพิกัดคือ..."
90100100-113 = "เอ๋? ระยะที่ประเมินได้มันผิดปกติแฮะ ตำแหน่งจริงอยู่ไกลกว่าที่เห็นมากเลย"
