90100100-133 = ""
90100100-135 = "'หุ่นไล่กาสีขาว' ที่กำลังไหวเอนอย่างผิดธรรมชาติ"
90100100-137 = "FOX 4! ได้ยินที่ฉันพูดมั้ย? จำได้หรือเปล่าว่าฉันเป็นใคร?!"
90100100-138 = "อ๊ะ ตกใจหมดเลย ไม่ต้องเสียงดังขนาดนั้นก็ได้ ฉันยังจำได้ดีว่าเธอเป็นใคร... ยัยเด็กน้อยตัวติดแจ"
90100100-139 = "ว่าไงนะ? ใครว่าใครเป็นเด็กน้อยนะ?"
90100100-140 = "FOX 1 ฉันว่ายัยนี่เป็นบ้าไปแล้วละ! ปฏิบัติการล้มเหลวแล้ว!"
90100100-141 = ""
90100100-142 = "FOX 4 ยังมีสติดี และยืนยันตำแหน่งของเป้าหมายได้แล้วสินะ"
