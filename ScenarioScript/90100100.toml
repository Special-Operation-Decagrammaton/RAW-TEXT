[translation]
90100100-1 = "제10화;어둠 속으로"
90100100-4 = "[ns1] \"더워……\"\n[ns2] \"그리고 어두워……\""
90100100-8 = "폐를 끼쳐 죄송합니다, 선생님."
90100100-9 = "이번 작전은 등화관제 상태를 유지해야 해서 조명을 제한하고 있습니다."
90100100-10 = "가능하다면 남는 야간투시장비를 빌려드리고 싶지만, 저희도 여분은 갖고 있지 않은지라."
90100100-11 = "[s3] \"괜찮아. 희미하게 조금은 보이니까.\"\n[s4] \"그나저나 이곳은?\""
90100100-14 = "이 통로는 시로우나기 역의 공조실과 이어진 지하도입니다."
90100100-15 = "지하 시설의 열이 배출되는 통로라 다소 후덥지근하지만, [ruby=쿠네쿠네]타겟[/ruby]을 유인하기 위해 결정한 장소니 양해 부탁드립니다."
90100100-16 = "[s] \"아니야. 오히려 너희들이 고생이지.\""
90100100-20 = "[ns5] \"그보다 이런 어두운 곳에서도 쿠네쿠네가 나오는 거야?\"\n[ns6] \"쿠네쿠네는 맑은 날에만 관찰할 수 있는 로어가 아니었던가?\""
90100100-23 = "일반적인 인식으로는 그렇습니다만"
90100100-24 = "……이번 사건의 기록을 대조해 본 결과, '쿠네쿠네'를 인지하는 데 날씨는 그리 중요한 요인이 아닐지도 모르겠다는 생각이 들었습니다."
90100100-25 = "지난 작전 때, 스코프 너머로 아지랑이를 목격한 FOX 4는 쿠네쿠네를 인지하고 그 영향을 받게 되었지만, 아지랑이를 보지 못한 FOX 3는 무사했었지요."
90100100-26 = "쿠네쿠네의 원전이 일사병을 경계하는 '정오의 악령'에서 유래했다면, 무덥고 아지랑이가 피어오르는 장소라면 굳이 탁 트여있지 않더라도 쿠네쿠네를 인지할 수 있을 겁니다."
90100100-27 = "무엇보다 이 장소라면, 작전에 시민들이 휘말려 피해를 입는 일은 없을 테니까요."
90100100-28 = "[s] \"그건 확실히 도움이 되겠네.\""
90100100-32 = "[ns7] \"그런데, 유키노. 기분 탓일지도 모르겠지만……\"\n[ns8] \"의식적으로 시민들과 엮이는 걸 피하고 있지 않아?\""
90100100-35 = "……글쎄요. #n 시민들에게 폐를 끼치는 것에 대한 말씀이라면."
90100100-36 = "SRT에 몸을 담고 있는 사람으로서 시민들을 위험에 빠트릴 수 있는 판단은 당연히 피하는 것이 옳습니다."
90100100-40 = "작전에는 언제나 부수적인 피해가 뒤따르기 마련이야."
90100100-44 = "저희는 키보토스 시민들의 안전을 책임지는 특수부대— SRT."
90100100-45 = "시민의 안전을 담보할 수 없다면 그 어떤 작전도 의미가 없습니다."
90100100-49 = "지금 그녀석을 보내준다면 더 큰 피해로 돌아올 거라고!"
90100100-50 = "그 판단, 책임질 수 있겠나?"
90100100-54 = "더욱이 저희는 지난 과오로 시민들에게 큰 폐를 끼친 만큼, 이 이상 빚을 늘려서는 안 됩니다."
90100100-58 = "스스로 책임질 배짱도 없는 어린아이 주제에."
90100100-60 = "그 어떤 대의명분이 뒤따른다 하더라도."
90100100-64 = "[ns] (어째서인지 이상한 환청이 겹쳐 들린 것 같다……)"
90100100-66 = "[ns9] \"……알겠어.\"\n[ns10] \"다만 무슨 일이 있더라도, 너희들의 안전이 최우선이야.\""
90100100-69 = "명심하겠습니다."
90100100-73 = "여기는 FOX 2. 현 시각을 기하여 포인트 찰리에 도달."
90100100-74 = "현재 기온은 섭씨 34도…… 어두워서 잘 보이진 않지만, 공조 배관 위로 분명 아지랑이가 피어오르고 있을 거야."
90100100-75 = "확인. 모두 장비를 착용하기 전까지 아지랑이를 맨눈으로 보지 않도록 주의하도록."
90100100-76 = "[s] \"혹시 어제 말한 그 장비라는 게……\""
90100100-80 = "응, 야간투시경이야!"
90100100-81 = "쿠네쿠네가 사람을 어떻게 홀리는 지는 알 수 없지만, 시신경에 영향을 준다면 내 섬광 방패와 원리가 비슷하지 않을까 해서."
90100100-85 = "야간투시경도 섬광탄을 맞으면 먹통이 되어버리는 건 마찬가지잖아?"
90100100-86 = "하지만 최소한 눈이 머는 건 막을 수 있지."
90100100-87 = "야간투시경은 빛에 반응한 디지털 센서가 전자 신호로 재구성한 화면을 보여주기 때문에, 눈에 해로운 수준의 광량이 들어오면 자동으로 센서가 차단되거든."
90100100-88 = "하지만 이걸로 정말 괜찮을까? 야간투시경 너머로 본다고 해서 쿠네쿠네에 홀리지 않는다는 보장도 없는데……"
90100100-89 = "그래도 우리가 시도하지 않는다면, 다른 누군가가 시도해야 할 거 아냐?"
90100100-90 = "그럴 거라면 차라리 우리 선에서 시도해 보는 게 낫지."
90100100-91 = "이럴 줄 알았으면 소대 이름을 여우가 아니라 카나리아로 지을 걸 그랬네."
90100100-92 = "뭐야, FOX 4. 벌써 시도하기도 전에 겁 먹은 거야?"
90100100-93 = "기뻐서 그래……! 명령만 내려줘. 지금 당장!"
90100100-99 = "그럼 이쪽도 돌입을 준비하지."
90100100-100 = "FOX 4, 타겟의 좌표 확인을 요청한다."
90100100-101 = "확인, 맡겨줘!"
90100100-108 = "포인트 로미오로부터 0-8-5 방향의 열원을 확인."
90100100-112 = "공조 배관 위에서 발생한 다수의 아지랑이를 확인. 좌표는……"
90100100-113 = "어라? 거리 배율이 이상한데. 상에 맺힌 위치가 보이는 것보다 훨씬 멀어."
90100100-119 = "역시……"
90100100-123 = "……FOX 3, 대기."
90100100-126 = "이 공조실에는 있을리가 없는 초지가 보인다. 그리고 그 너머에 불규칙하게 흔들리는—"
90100100-135 = "……'하얀 허수아비'의 발생을 확인."
90100100-137 = "FOX 4! 내 말 들려? 내가 누군지 기억나지?!"
90100100-138 = "앗, 깜짝이야. 그렇게 시끄럽게 떠들지 않아도 네가 누군지는 제대로 기억하고 있다고, 꼬맹이."
90100100-139 = "뭐? 누가 누구더러 꼬맹이래?"
90100100-140 = "FOX 1, 이 녀석 지금 제 정신이 아니야! 역시 작전은 실패했어!"
90100100-142 = "다행히 FOX 4가 정신을 잃지 않고, 타겟의 위치를 확인한 모양이군."
90100100-143 = "전원, 야간투시장비 착용. IR 모드로 전환 후, 초점 확인할 것."
90100100-154 = "현 시간부로, [ruby=FOX]'여우'[/ruby]가 밤을 통제한다."
