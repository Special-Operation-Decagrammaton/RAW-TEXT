[translation]
13350-1 = "제35화;테러 vs 테러"
13350-4 = "……."
13350-5 = "이 느낌은……?"
13350-6 = "무슨 일이 벌어지고 있는 거지……?"
13350-7 = "……설마, 호시노 선배?"
13350-15 = "색채까지……!?"
13350-16 = "이건…… 설마 나를……?"
13350-17 = "쫓아온 건가…… 결국 나 때문에…… 다시 이렇게 모든 것들이……?"
13350-24 = "아닙니다. 스나오오카미 시로코. 색채는 당신을 쫓아 온 것이 아닙니다."
13350-25 = "A.R.O.N.A……?! 어떻게?!"
13350-26 = "지금 발현한 <색채>의 힘을 이용해 메시지를 전달하는 것입니다. 긴급. 시간이 없습니다."
13350-27 = "A.R.O.N.A.……, 아니, 이제 이름으로 불러야겠지,"
13350-28 = "프라나……, 상황은?"
13350-29 = "감사. 질문에 대해서는 일부 긍정. 이 색채는 현재 스나오오카미 시로코가 불러들인 것입니다."
13350-30 = "나를 쫓아온 것이 아니지만, 스나오오카미 시로코가 불러들인 것이다……."
13350-35 = "그 바보가……."
13350-36 = "긍정. 스나오오카미 시로코, [ruby=.]다[/ruby][ruby=.]른[/ruby] [ruby=.]시[/ruby][ruby=.]간[/ruby][ruby=.]대[/ruby]의 동일 존재가 위험합니다."
13350-37 = "호시노 선배 때문에……."
13350-38 = "……응. 이해했어."
13350-42 = "[ns] \"시로코!! 시로코를 막아줘-----!!!\""
13350-44 = "물론."
13350-50 = "!!"
13350-53 = "다, 당신은……!!"
13350-54 = "다, 다른 세계선의 시로코……쨩……?"
13350-55 = "우와! 도우러 와줬구나!!"
13350-59 = "시로코 씨! 성공이에요!! 방금 전에 발현된 색채의 힘을 이용해서……."
13350-60 = "현재 색채는 소멸되었습니다. 강제 도약 시퀀스는 재현 불가."
13350-61 = "하지만 이것으로……."
