[translation]
10059090-1 = "제9화;협상 결렬"
10059090-5 = "흥, 학원의 무력 조직이라 대단할 줄 알았더니 별거 아니군."
10059090-6 = "자만하지 마. 너의 안 좋은 버릇이야."
10059090-7 = "자만하지 마. 너의 안 좋은 버릇이야."
10059090-8 = "알았으니까 둘이 똑같이 말하지 말라고!"
10059090-11 = "저 녀석들, 우리를 앞에 두고 농담하고 있잖아……!"
10059090-12 = "어디선가 들어본 적이 있어요. 브로커의 직속 부하들은 모두가 정예라고."
10059090-13 = "이쪽 세계에서도 엄청난 보수를 받는 뛰어난 자들만을 모았다고요."
10059090-14 = "키킥…… 너희들, 왜 우리가 얼굴을 가리고 있는지 알아?"
10059090-15 = "다들 엄청난 현상금이 걸려 있거든. 이 바닥에 관심이 있다면 한눈에 알아보는 강자들이지."
10059090-16 = "그런 우리 실력에 걸맞은 몸값을 맞춰준 사람은 보스뿐이었어."
10059090-17 = "여긴 아무나 올 수 없다고. 이쪽 세계의 엘리트 기업이라고 할까. 크크큭."
10059090-18 = "너희 보수는 어때? 우리 절반은 되냐?"
10059090-19 = "시끄러, 이 범죄자 놈들아! 누가 보수를 원해서 사감대에 온 줄 알아?!"
10059090-20 = "아무래도, 좀 더 진지하게 싸워야겠네요."
10059090-21 = "그래. 대충 싸우는 건 그만둘래."
10059090-29 = "……으으, 사감대 쪽의 전투가 생각보다 길게 이어지고 있네요."
10059090-30 = "이상하군요. 계산대로라면 벌써 끝나야 했는데."
10059090-31 = "아무래도 평범한 조무래기들이 아닌 모양입니다."
10059090-32 = "……."
10059090-33 = "후후후, 우리 병력은 다들 거물급이죠."
10059090-34 = "평균적인 전투력은 대형 학원의 무력 집단과 대등한 정도입니다."
10059090-35 = "그 정도의 실력이 없으면 이 바닥에서 오래 못 버티거든요."
10059090-36 = "그런 병력이 따르는 우리 보스입니다! 당신들은 절대 못 이겨요!"
10059090-37 = "자, 지금이라도 늦지 않았습니다. #n바닥에 납작 엎드리고 우리의 조건을 순순히 받아들이신다면……!"
10059090-38 = "야. 꺼져."
10059090-43 = "꾸엣……!"
10059090-48 = "부하 놈이 말이 많군."
10059090-49 = "시간은 돈인데 말이야."
10059090-50 = "[s] \"넌…… 모든 걸 돈으로 비유하는구나?\""
10059090-51 = "그렇게 살아왔으니까."
10059090-52 = "[s] \"이 세상엔 돈으로 해결할 수 없는 것도 있어.\""
10059090-53 = "……."
10059090-57 = "제법이군."
10059090-58 = "오늘 들었던 것 중에서 제일 짜증 나는 이야기였어."
10059090-59 = "그 보답으로 최대한 빨리 끝내주지."
10059090-60 = "얘들아. 퇴로를 막아라."
10059090-61 = "날 화나게 한 대가를 치르게 해주마."
