[translation]
10059090-1 = "第9話;交渉決裂"
10059090-5 = "学院の武装組織と聞いて少しは期待したが……大したことねぇな。"
10059090-6 = "油断するな。お前の悪い癖だ。"
10059090-7 = "油断するな。お前の悪い癖だ。"
10059090-8 = "二人して同じこと言うな！"
10059090-11 = "あいつら……私たちを前にして、舐めた口を利いてくれるじゃないか……！"
10059090-12 = "以前、耳にしたことがあります。#nブローカーの直属の部下は、いずれも選りすぐりの精鋭だと。"
10059090-13 = "破格の報酬を受け取るほどの実力者ばかりを集めているそうです。"
10059090-14 = "なあ？私たちがどうして顔を隠してるか分かるか？"
10059090-15 = "全員、とんでもない懸賞金がかかってるんだ。#n裏に詳しけりゃ、顔を見ただけで分かるような猛者ばかり。"
10059090-16 = "そんな私たちに、実力相応の値をつけたのはボスだけだった。"
10059090-17 = "ボスのとこは誰でも入れるような組織じゃねぇんだ。#n言ってみれば裏社会の一流企業ってところかな。"
10059090-18 = "で、お前らの給料はどうなんだ？#nこっちの半分くらいは貰ってんのか？"
10059090-19 = "うるさい！金目当てで寮監隊にいるとは思わないことだ！"
10059090-20 = "……エスコートされたとあれば、こちらも、少し本気でお相手しましょうか。"
10059090-21 = "そうだね。手加減するのはもう十分かな。"
10059090-29 = "……寮監隊の方は思っていた以上に長引いていますね。"
10059090-30 = "予測では、とうに決着がついているはずなのですが……。"
10059090-31 = "どうやら、ただの雑兵ではないようです。"
10059090-32 = "……。"
10059090-33 = "ふふふ、我々は一騎当千の猛者ばかり！"
10059090-34 = "大規模学園の武装組織と互角に渡り合えるほどなのですよ。"
10059090-35 = "強くなければ生き残れない。この世界は弱肉強食……！"
10059090-36 = "皆様が歯向かっているのは、そんな精鋭を従える――我らがボス！#n勝ち目などありませんよ！"
10059090-37 = "さあ、今ならまだ遅くありません。#n大人しくひれ伏して、こちらの条件を受け入れるというのなら――！"
10059090-38 = "邪魔。"
10059090-43 = "くぁっ……！"
10059090-48 = "喋りすぎ。"
10059090-49 = "時は金なり、だからね。"
10059090-50 = "[s] \"本当に、何でもお金で考えるんだね。\""
10059090-51 = "そうやって生きてきたから。"
10059090-52 = "[s] \"この世には、お金じゃ解決できないこともあるよ。\""
10059090-53 = "……。"
10059090-57 = "だから？"
10059090-58 = "それ、今日聞いた中で、一番ムカつくんだけど。"
10059090-59 = "お礼に、すぐ楽にしてあげる。"
10059090-60 = "アンタたち、逃げ道を塞いで。"
10059090-61 = "私を怒らせた分、利子つけて払ってもらうよ。"
