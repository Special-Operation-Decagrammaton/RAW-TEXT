[translation]
80000099-1 = "온천 달걀"
80000099-2 = "(메구가 부른 곳으로 찾아가니, 번화가로부터 꽤 떨어진 골목가가 나타났다.)"
80000099-3 = "흐흥~. 왔어, 선생님? 그러잖아도 기다리고 있었지."
80000099-4 = "[s1] \"메구?\"\n[s2] \"이런 곳에서 뭐 하는 거야?\""
80000099-9 = "후후~. 그렇게 물어볼 줄 알았지!"
80000099-10 = "선생님, 그거 알아? 오늘은 말이야, 아주 특별한 날이라고!"
80000099-11 = "아니, 물론 선생님은 알고 있겠지? 나랑 달리 똑똑한 사람이니까!"
80000099-12 = "아무튼 그게 이유야! 나는 평소에도 선생님의 도움을 많이 받으니까, 오늘 같은 날만이라도 뭔가 갚고 싶었거든!"
80000099-13 = "하지만 내가 할 줄 아는 거라고는 작업밖에 없잖아?"
80000099-14 = "뭐든지 파내거나, 밀어버리거나, 터뜨리거나, 불을 지르거나……."
80000099-15 = "아. 물론 건설도 할 수 있긴 하지만, 어쨌거나 오늘 일이랑은 상관없다는 게 마찬가지지!"
80000099-16 = "그래서 어떻게 할까 고민하다가, 내가 할 수 있는 선에서 줄 수 있는 걸 줘야겠다고 생각했어."
80000099-17 = "바로 그런 이유에서! 나온 게!"
80000099-21 = "두근두근~!!"
80000099-26 = "[ns3] \"이건 온천 달걀?\"\n[ns4] \"훈제 달걀……이야?\""
80000099-29 = "헤헤~. 글쎄? 어떨까나?"
80000099-30 = "맞았다면 맞았고 틀렸다면 틀린 이야기네!"
80000099-31 = "실제로 그나마 할 줄 아는 게 온천 달걀 만드는 거였으니까 말이야."
80000099-32 = "하지만 오늘의 온천 달걀은 조금 다르다고? 평소보다 좀 더 달달할 걸?"
80000099-33 = "자, 선생님! 한번 까봐! 제대로 됐는지, 나도 직접 확인해 보고 싶으니까 말이야!"
80000099-34 = "으으으~. 괜히 나까지 두근두근해지는데!"
80000099-35 = "[ns] 받은 달걀을 뜯어본다."
80000099-38 = "[ns5] \"안에 초콜릿이……!\"\n[ns6] \"달걀이 아니었다!? 달걀처럼 생긴 초콜릿!?\""
80000099-41 = "쨔아아아아안-!!!"
80000099-42 = "온천달걀 만드는 방법으로 만들어 본, 온천초콜릿이었습니다~!!!"
80000099-43 = "와~!! 짝짝짝짝~!!"
80000099-44 = "선생님! 먹어봐, 먹어봐! 빨리! 맛이 어떤지도 확인해 봐야지!!"
80000099-45 = "얼른~!!"
80000099-50 = "[ns7] \"오, 달아.\"\n[ns8] \"이거 진짜로 맛있는데.\""
80000099-53 = "……!"
80000099-54 = "……!!!!"
80000099-55 = "오오오오오오오오-!!! 대성공~!!"
80000099-56 = "히히. 솔직히 이상하게 나오면 어쩌지 되게 걱정했는데……. 잘 돼서 다행이다."
80000099-57 = "……응? 테스트 같은 건 해보지 않았었냐고?"
80000099-58 = "응. 그게 처음 만든 건데?"
80000099-59 = "……어."
80000099-60 = "……!! 맞네! 미리 만들어봤으면 더 좋았겠다!!"
80000099-61 = "역시 선생님, 똑똑하다니까!! 히히……."
80000099-65 = "자, 그럼……."
80000099-66 = "……잔뜩 더 만들어서, 어떤 맛인지 나도 먹어볼까?"
80000099-68 = "(이후 메구와 함께 엄청난 양의 '온천 달걀 초콜릿'을 만들었다.)"
80000099-69 = "(그러고는 또 엄청난 양을 선물 받아, 샬레의 냉장고에 넣어 두었다.)"
