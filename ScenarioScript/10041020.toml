[translation]
10041020-1 = "제2화;자연스러운 분담"
10041020-9 = "……후우."
10041020-10 = "자연스럽게 복귀했네요. 늦지는 않은 모양이에요."
10041020-11 = "마침 저기 트리니티 학우분들도 계시고, 이대로 대열에 합류하면 아무 일 없었다는 듯 넘어갈 수 있겠죠."
10041020-12 = "내막을 조사하는 것과 학우분들을 인솔하는 것, 두 가지를 모두 하는 것은 솔직히 조금 버거울 거라고 생각되지만……."
10041020-16 = "그 부분은 저 스스로 선택한 고생이니, 감수하도록 할까요."
10041020-17 = "그럼……."
10041020-22 = "어라? 여기 있었네! 한참 찾았잖아!!"
10041020-31 = "어디 있었어? 티파티 손님!"
10041020-32 = "이동과 관람은 어디까지나 자유지만, 우리도 일단은 그쪽의 호위 역이야. 갑자기 시야에서 사라지면 곤란해."
10041020-33 = "물론 밀레니엄, 특히 엑스포 회장 근처에서 치안 문제가 발생할 거라고는 생각하지 않지만……."
10041020-34 = "그래도 입장이라는 게 있으니, 어디 가거나 할 때는 언질을 주면 고맙겠어."
10041020-36 = "아, 죄송해요. 잠시 길을 좀 헤맨 것뿐이었어요."
10041020-40 = "그러고 보니 선생님은……?"
10041020-45 = "주인님? 주인님은 지금……."
10041020-47 = "(……주인님……?)"
10041020-50 = "서, 선배……!! 지금은 주인님이 아니라 '선생님'……!!"
10041020-52 = "(……????)"
10041020-53 = "(선생님……. 여기선 또 무슨 행동을 하고 다니시기에…….)"
10041020-58 = "아, 맞아! 선생님! 선생님은 지금 한창 다른 학생들 인솔하느라 바쁘다고 하던데?"
10041020-59 = "이번 교류회에서, 트리니티 종합학원의 학생들을 인솔하는 역할을 맡으셨다고 들었어."
10041020-60 = "의외네. 알고 있을 거라 생각했는데."
10041020-66 = "……? 인솔의 역할……이요?"
10041020-70 = "아아, 네. 그런 이야기가……있긴 했지요. 그게 그런 의미였군요."
10041020-75 = "학생 인솔……? 선생님께서……?"
10041020-76 = "어째서 그걸 대신 해주시는 걸까요……. 그건 원래 제가……."
10041020-81 = "아니죠. 뭔가 생각이 있으시겠지요. 다른 분도 아니고 선생님이시니."
10041020-82 = "응? 왜 그래?"
10041020-83 = "고민에 빠진 얼굴이잖아, 뭔가 안 좋은 데라도 있어?"
10041020-84 = "아닙니다. 그 반대……. 오히려 조금 발걸음이 가벼워진 느낌이네요."
10041020-85 = "그러면 저도 이왕 이렇게 '자유로운 몸'이 되었으니……."
10041020-89 = "사양 않고 이곳저곳 즐거운 일정을 만들어 볼까요? 두 분께서는 저와 함께하시는 걸로 이해하면 되겠지요."
10041020-91 = "응! 잘 부탁해~!"
10041020-92 = "잘 부탁해. 다른 멤버들도 당장 눈에 보이진 않겠지만, 각자의 자리에서 일정을 서포트하고 있어."
10041020-98 = "부르셨습니까? 마침 대기 중이었습니다."
10041020-99 = "아니에요~, 토키양. 인솔에 집중해 주세요."
10041020-100 = "아……."
10041020-109 = "……아무튼 그런 상황이니, 우리만 믿고 엑스포를 즐기도록 해."
10041020-111 = "여러분 명성에 대해서는 저도 익히 알고 있으니까요. 든든합니다."
10041020-112 = "그러면……."
