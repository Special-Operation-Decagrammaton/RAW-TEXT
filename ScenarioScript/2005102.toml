[translation]
2005102-1 = "또 만났네 레이사"
2005102-2 = "(날이 좋아서 샬레 앞으로 산책을 나섰다.)"
2005102-3 = "[ns] \"정말 좋은 날이다.\""
2005102-4 = "저, 저기…… 선생님……."
2005102-5 = "[s]\"응?\""
2005102-9 = "으, 으으……."
2005102-13 = "아, 안녕하십니까, 선생님……!"
2005102-14 = "[s1]\"와, 와우…….\"\n[s2]\"나타났구나, 테르밋 핑크!!!\""
2005102-17 = "이거, 백 퍼센트 놀리시는 겁니다!!"
2005102-18 = "정말 많은 일이 있었습니다. 힘들다……."
2005102-19 = "[s]\"마스코트가 계약해달라고 했던 거야?\""
2005102-20 = "어, 어엇. 진지하게 믿고 계신 건 아니……죠?"
2005102-21 = "사실은 이거, 앞서 보여드렸던 중고 코스튬인데요."
2005102-22 = "배송이 왔길래 집에서 사이즈가 맞나 입어봤습니다."
2005102-23 = "그런데, 뚝! 하고 지퍼 손잡이가 빠졌습니다!!"
2005102-24 = "그래서 강제로 변신하고, 옷에 갇혀버렸네요……."
2005102-25 = "혼자서는 잘 보이지도 않고, 공구도 없어서…… 그래서 샬레까지 왔습니다……!"
2005102-26 = "선생님이라면 왠지 쉽게 도와주실 수 있을 것 같아서요."
2005102-27 = "[s3]\"사무실에 비품 공구 세트가 있을 거야.\"\n[s4]\"그래서 여기까지 입고 온 거야?\""
2005102-30 = "네. 하하, 하……."
2005102-31 = "정말 슈퍼스타가 된 것 같았달까요,"
2005102-32 = "버스를 타고 왔는데 아이들이 사진 찍어달라고 하고,"
2005102-33 = "어떤 이벤트 현장 앞을 지나가는데, 배역으로 오해하…… 셔서……."
2005102-34 = "이것이 슈퍼, 스타…… 하, 하하……."
2005102-35 = "[s5]\"레이사가 망가졌다!\"\n[s6]\"마법소녀, 좋아하는 거 아니었어?\""
2005102-38 = "물론, 당연히 좋아합니다!"
2005102-39 = "사이즈도 딱 맞고, 옷도 엄청 맘에 들지만, 그렇지만……"
2005102-40 = "마음의 준비 없이 강제 변신 당한 겁니다!!"
2005102-41 = "로봇을 좋아하는 사람이어도, 로봇이 자기 집 침대 위에 있는 건 무서운 거예요!"
2005102-42 = "변신, 풀어주세요……."
2005102-43 = "[s7]\"평생 살면서 한번 듣기도 힘든 말!\"\n[s8]\"샬레에 올라가서 도와줄게!\""
2005102-46 = "감사합니다아……."
2005102-49 = "[ns]\"오, 내려갔다.\""
2005102-51 = "'릴리즈-폼'!…… 이랄까요!"
2005102-52 = "와, 이거 진짜 마법소녀 같은 대사네요!"
2005102-53 = "[s]\"평생 살면서 한번 듣기 힘든 말, 그 2위!\""
2005102-54 = "에헤헤, 어쨌든 잘 되어서 다행입니다."
2005102-55 = "역시 선생님이라면 해결해 주실 거라 믿고 있었습니다!"
2005102-56 = "선생님은 항상 제 고민을 해결해 주시니까요!"
2005102-57 = "[s]\"봉인 해제는 힘들군, 후우-!\""
2005102-58 = "아하하! 맞는 말씀입니다!"
2005102-59 = "그러면 이제 돌아가 보겠습니다!"
2005102-60 = "다음에 뵙겠습니다!"
2005102-61 = "[s9]\"잠깐, 레이사. 그대로 가려는 거야?\"\n[s10]\"등에 지퍼, 열려있는데?\""
2005102-64 = "켁, 그, 그렇군요!"
2005102-65 = "생각해 보니, 갈아입을 옷을 들고 와야 했는데!!"
2005102-66 = "저는…… 정말 바보입니다."
2005102-67 = "[s]\"타, 타락한다!!\""
2005102-71 = "(레이사가 걸칠 수 있게 외투를 빌려주었다.)"
2005102-72 = "(레이사가 기운을 차린 것 같아서 다행이었다.)"
