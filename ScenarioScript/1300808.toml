[translation]
1300808-1 = "뜻밖의 횡재"
1300808-2 = "(새벽까지 예정되어 있던 야시장 알바가 생각보다 일찍 끝나버렸다.)"
1300808-4 = "이야, 횡재했어. 그치? 선생님?"
1300808-5 = "거의 철야를 각오하고 있었는데 생각보다 호황이라 재료 소진으로 영업 끝."
1300808-6 = "알바비는 약속대로 다 받고, 일찍 끝나기까지!"
1300808-7 = "가끔씩 이런 날도 있는 법이지, 그치 선생님?"
1300808-8 = "[s] \"잘됐네.\""
1300808-9 = "흐음. 이쪽 마을은 꽤 활기차구나. 아비도스에는 없는 물건들도 꽤 많아 보이고……."
1300808-10 = "저기 봐, 타코야키야! 오징어 구이도 있어!"
1300808-11 = "저쪽은 웃기게 생긴 가면도 파나 본데?"
1300808-12 = "[s] \"잠깐 구경다녀 볼까?\""
1300808-13 = "으, 으응?"
1300808-14 = "구, 구경? 둘이서?"
1300808-15 = "……."
1300808-16 = "[s] \"아니면 집으로 돌아가고.\""
1300808-17 = "누, 누가 싫댔어?!"
1300808-18 = "모, 모처럼 일찍 끝났으니까! 이대로 돌아가긴 아쉽기도 하고……."
1300808-19 = "가끔씩은 휴식도 중요한 법이잖아?"
1300808-20 = "자, 그러면……."
1300808-23 = "(세리카가 팔짱을 껴 왔다.)"
1300808-24 = "……."
1300808-25 = "……뭐, 뭐야? ……싫다는 거야?"
1300808-26 = "[s1] \"그건…….\"\n[s2] \"그러니까…….\""
1300808-27 = "됐어, 대답하지 마!"
1300808-28 = "됐어, 대답하지 마!"
1300808-29 = "……헤헤."
1300808-30 = "자~♪ 저쪽부터 구경하러 가보자!"
1300808-32 = "(세리카와 함께 구운 오징어와 간장 바른 옥수수, 감자 구이, 타코야키를 사먹고, 노점 여기저기를 구경다니다가,)"
1300808-33 = "(새벽이 다되어서 간신히 집으로 돌아갔다.)"
