[translation]
2000002-1 = "마이스터라 불러줘."
2000002-2 = "샬레 집무실"
2000002-7 = "(핸드폰이 고장 나버렸다.)"
2000002-8 = "[s1] 전문업체로 간다.\n[s2] 통신을 포기한다."
2000002-9 = "…………어느 쪽이든 좋은 선택은 아니야."
2000002-10 = "…………어느 쪽이든 좋은 선택은 아니야."
2000002-11 = "안녕. 선생님. #n총학생회에서 요청이 와서, 도우러 왔다가 들렀어."
2000002-12 = "무슨 요청이냐고? 기계들의 수리 및 정비지."
2000002-13 = "현재 총학생회에서 사용하는 기재 중 일부는 밀레니엄에서 지원한 것들이거든."
2000002-14 = "물론 총학생회의 더 많은 기계는, 그 정체조차 알 수 없는 것들이지만……"
2000002-15 = "어쨌든, 선생님의 스마트폰은 다행히 일반적인 기종인 것 같네."
2000002-16 = "그럼 내가 도와줄게."
2000002-18 = "핸드폰 이상의 그 무언가가 되게 해줄게."
2000002-20 = "내가 소속된 엔지니어부는, 밀레니엄에서 기계에 가장 특화된 학생들이 모이는 곳이야."
2000002-21 = "우리는 그러한 자신들을 자랑스럽게 생각하고, 마이스터라 부르지."
2000002-22 = "선생님의 스마트폰의 문제도 확인했어."
2000002-23 = "아무래도 전력 공급 과정에서 메인보드에 부하가 생긴 모양이야."
2000002-24 = "콘덴서를 교체하는 것만으로 충분하지만……"
2000002-25 = "그 이상의 시술이 필요하다고 생각해."
2000002-28 = "일단 간단하게…… 자폭 기능을 추가해보는 건 어떨까?"
2000002-29 = "[s3] \"멋진데?\"\n[s4] \"대체 왜?\""
2000002-30 = "그렇지? 그럼 바로 준비할게."
2000002-31 = "……아. 맞다."
2000002-32 = "그러고 보니 선배들에게 당분간 자폭 기능을 함부로 추가하는 건 금지 당했지."
2000002-33 = "하아. 우리 부는 전통 있는 동아리다 보니, 아직 보수적인 사람들이 많아."
2000002-34 = "하지만, 오랜 시행착오와 검증을 통해 확인된 사실일 수 있으니"
2000002-35 = "미안하지만 자폭 기능은 다음에 선배들의 허락을 받고 작업해줄게."
2000002-36 = "선생님. #n기껏 핸드폰을 고쳐놓고 무슨 짓이냐고 생각하는 모양인데."
2000002-37 = "그렇지 않아."
2000002-38 = "핸드폰은 다른 기기와 달리, 특별한 것을 담고 있어."
2000002-39 = "바로 개인정보지."
2000002-40 = "그러한 것들을 지키기 위해서라면, 자폭 기능이 설치되는 건 지극히 합리적이야."
2000002-41 = "음. 그래도 자폭은 지키는 게 아니라고?"
2000002-42 = "상황에 따라선 휴대용 수류탄이나 시한폭탄으로 사용할 수 있는데……"
2000002-43 = "아쉽네. 어쩔 수 없지."
2000002-45 = "수리는 완료되었어."
2000002-46 = "……"
2000002-47 = "그…… 당분간은 문제없겠지만."
2000002-48 = "선생님의 핸드폰이나 전자기기가 고장 났을 때라면…… 나를 불러줘."
2000002-49 = "언제든 도와줄게."
