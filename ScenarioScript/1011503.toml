[translation]
1011503-1 = "특별한 훈련 2"
1011503-3 = "그래서 이번에는 투구 훈련을 해 볼까 합니다!!!"
1011503-4 = "[ns1] \"잠깐잠깐잠깐.\"\n[ns2] \"이야기를 따라가게 해 줘.\""
1011503-7 = "네? 저, 투수 포지션도 하냐고요?"
1011503-8 = "그건 아니에요. 정말 대단한 선수들 중에는, 투타를 모두 소화해 내는."
1011503-9 = "이른바, '이도류'인 선수도 분명히 있긴 하지만요……."
1011503-10 = "어떻게 봐도 저는 아직, 그 정도의 선수는 아니라고밖에 할 수 없으니……."
1011503-11 = "물론 언젠가는 그렇게 되고 싶다고 생각하기는 합니다만!"
1011503-12 = "그렇지만 공을 잘 치려면, 투수 입장에서 타자를 바라보는 것도 필요하다고 생각했습니다."
1011503-13 = "그러면 다음에 어떤 타구를 던질지도 더 쉽게 예측할 수 있을 것이고."
1011503-14 = "그러다 보면 이른바, 타자가 투수의 어떤 코스의 볼을 어떻게 맞출 것인지 예측해서, 정한 코스대로 스윙하는……."
1011503-15 = "'게스 히팅'에도 보다 능숙해질 수 있을 테니까요!"
1011503-16 = "그러면 자연히 타율도 올라갈 것이고, 장타율도 올라갈 것이고, 그러다보면 당연히……."
1011503-17 = "당연히! 홈런도 치게 될 수 있지 않을까요?!"
1011503-18 = "[s] \"듣고 보니 정말로 그럴 것 같네!\""
1011503-19 = "그렇죠? 그러니까 아무튼 그런 거예요!"
1011503-20 = "그런 의미에서 저, 오늘은 투수 훈련을 시작하겠습니다!"
1011503-22 = "(그렇게 레이는 오늘도 힘차게 훈련장으로 들어섰다…….)"
1011503-28 = "<데드 볼! 주자 진루!>"
1011503-29 = "윽……! 구속에만 너무 신경을 쓴 나머지, 어깨에 힘이 과하게 들어갔나?"
1011503-30 = "하지만 다음에야말로!"
1011503-35 = "<포볼! 주자 진루!>"
1011503-36 = "분명 가운데를 노리고 던졌단 말야!"
1011503-41 = "아냐, 아니지. 냉정함이야말로 투수의 덕목……. 정신 차려야 해!"
1011503-48 = "<클린 히트! 홈런입니다!>"
1011503-49 = "홈런은 나도 못 쳐 봤는데–!?"
1011503-50 = "공이 몰려서 그래. 공이 몰려서……. 카운트를 길게 끌고 가는 게 아니었어!"
1011503-58 = "<데드 볼. 타자 훈련 로봇의 왼팔이 파손되었습니다.>"
1011503-59 = "윽……!"
1011503-64 = "<데드 볼. 타자 훈련 로봇의 복부가 파손되었습니다.>"
1011503-65 = "제발 좀……!"
1011503-69 = "<데드 볼. 타자 훈련 로봇의 머리에 명중했습니다. 괜찮습니다. 단지 메인 카메라가 망가졌을 뿐입니다.>"
1011503-78 = "<더 이상 사용 가능한 타자 훈련 로봇이 남아 있지 않습니다. 오늘의 훈련을 종료하시겠습니까?>"
1011503-79 = "이익……!"
1011503-84 = "왜 안 되는 걸까요–?!"
1011503-85 = "[ns] \"지, 진정해. 레이! 애초에 투수는 익숙하지 않았던 거니까!\""
1011503-86 = "……훌쩍."
1011503-87 = "선생님. 뭔가 좋은 훈련 아이디어 없으세요……?"
1011503-88 = "지금의 제 머리로는 잘 떠오르지 않아서, 선생님께서 뭔가 발상의 전환을 해 주시면 좋을 것 같아서요……."
1011503-89 = "[ns] \"음…… 투수의 덕목은 뭐라고 생각해?\""
1011503-90 = "그거야 당연히 제구력이죠."
1011503-91 = "홈 플레이트는 움직이지 않으니, 스트라이크를 던지라는 말도 있고."
1011503-92 = "커브는 직구의 제구력을 잡은 뒤에나 배우라는 말도 있을 정도니까요."
1011503-93 = "[s3] \"제구력, 제구력이라…….\"\n[s4] \"그러면, 제구력 훈련을 해 보자!\""
1011503-96 = "네?!"
1011503-97 = "이, 이번엔 또 뭐죠……?"
1011503-101 = "또다시 게임 센터잖아요!?"
1011503-102 = "타이밍 훈련은 분명히 예전에……."
1011503-103 = "네? 여기에서는 타이밍 훈련 말고 다른 훈련도 가능할 거라고요? 그건 도대체……."
1011503-108 = "이것은…… 다트, 라는 게임인가요?"
1011503-109 = "아하. 이 화살 모양의 다트 핀이라는 것을 던져서, 다트보드를 맞혀서 더 높은 점수를 내는 게임이군요."
1011503-110 = "뭔가, 집중도와 제구력…… 손의 컨트롤을 익히는 데에는 도움이 될 것 같기도 해요! 그러면 해 보겠습니다!"
1011503-112 = "에잇!"
1011503-113 = "또다시 한가운데 명중! 이것으로 5회 연속입니다! 그리고 남은 다트 핀은 1개입니다!"
1011503-114 = "이거…… 뭔가 정말로 집중되는 느낌이 드네요. 앞으로 한 번만 더……!"
1011503-116 = "저기 봐. 저기! 지금 저 학생 한가운데에 연속으로 다섯 번이나 맞췄어!"
1011503-117 = "저 정도면 거의 더 이상 맞출 자리가 안 남아 있는 거 아냐……?"
1011503-118 = "후우……."
1011503-119 = "얍!"
1011503-123 = "또다시 한가운데에 명중! 축하합니다! 오늘의 최고 점수입니다!"
1011503-127 = "[ns5] \"대단해, 레이!\"\n[ns6] \"혹시 마이크로 컨트롤에 엄청난 재능이 있는 거 아냐?\""
1011503-130 = "……."
1011503-131 = "아뇨, 이것만으로는 안 돼요!"
1011503-132 = "[s] \"어, 어째서……?\""
1011503-133 = "무엇보다, 다트 핀은 야구공에 비해 너무 가볍다구요!"
1011503-135 = "제구 훈련을 위해서 필요한 것…… 필요한 요소는……."
1011503-136 = "적당히 질량이 있고, 던지기 어려우며, 그러면서도 컨트롤이 가능한 던질 것이란……."
1011503-137 = "!"
1011503-138 = "선생님, 알았어요!"
1011503-139 = "[s] \"응! 뭔데?\""
1011503-140 = "우리에게 필요한 것은, 프리스비에요!"
1011503-141 = "[s] \"어……?\""
1011503-144 = "큰 원을 그리며 돌아오도록 던지기!"
1011503-148 = "[ns] \"이건 부메랑이 아닐 텐데?!\""
1011503-151 = "가능해요! 제구력만 있다면!"
1011503-153 = "직선으로 날아가다가, 갑자기 위로 솟구치도록 던지기!"
1011503-157 = "[ns] \"옛날 만화의 마구야!?\""
1011503-159 = "가능하다구요! 제구력만 있다면!"
1011503-168 = "자, 선생님도요!"
1011503-169 = "네? 선생님까지 할 필요가 있냐고요? 무슨 소리세요. 이것도 보기에 따라서는……."
1011503-170 = "야수 훈련으로까지 이어질 수 있는, 중요한 연습이라구요!"
1011503-171 = "(레이의 성화를 이기지 못하고, 적당히 프리스비를 던져 보았다.)"
1011503-175 = "네! 그러면 잡아 오겠습니다!"
1011503-179 = "이야아아아아아앗–!!!"
1011503-183 = "잡았어요, 선생님! 하지만 아직이에요…… 더 높이 던져 주세요!"
1011503-184 = "[s] \"그러면 머리 위로 날아가 버릴 텐데?\""
1011503-185 = "괜찮아요! 플라이 볼은 보통 그러니까요!"
1011503-190 = "감사합니다! 그러면…… 어디……"
1011503-194 = "에잇!"
1011503-195 = "보세요, 선생님! 점프해서 잡으니까 됐어요! 그러면 이번에는……."
1011503-196 = "방향을 살짝 바꿔서, 가능한 한 멀리 던져 주세요!"
1011503-197 = "[s] \"그러면 못 잡을지도 모르는데?!\""
1011503-198 = "타구는 제가 생각해 준 대로 날아와 주지 않아요! 자, 어서요!!!"
1011503-202 = "좋아, 이번에도 잡아 주겠다고–!!!"
1011503-206 = "저거 말이에요……. 샬레의 선생님이 마치, 학생을 강아지처럼 다루고 있는 것 같지 않아요?"
1011503-207 = "원반을 던져서 잡아 오게 하거나, 일부러 다른 곳으로 던져서 고생시키거나……."
1011503-208 = "선생님에 대해서는 많은 소문이 돌고 있지만, 이제는 저런 일까지 하고 있었을 줄이야……."
1011503-212 = "[ns] \"……내 명예 회복은, 언제쯤 가능할까……?\""
1011503-214 = "네? 무슨 말씀이신가요, 선생님?"
