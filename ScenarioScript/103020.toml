[translation]
103020-1 = "제2화;다음 목표"
103020-5 = "……!!"
103020-7 = "정신이 들었습니까, 마에스트로."
103020-13 = "……무슨 일이 벌어진 거지?"
103020-14 = "아니, 설명하지 않아도 된다. 육체가 변경되어…… 잠깐 혼란스러운 것이니……."
103020-15 = "큭큭큭…… 급한 김에 일단 아무거나 주워서 끼워보았습니다만, 불편하진 않습니까? 어떠신지요?"
103020-16 = "개의치 않는다. 육체는 원래 소모품에 지나지 않지."
103020-17 = "……그렇군, <색채>가 습격해 온 건가."
103020-18 = "그렇습니다. 저희의 예측보다도 더 빨리. 색채의 인도자 프레나파테스가 공격해 왔습니다."
103020-19 = "……우리들의 위치, 약점, 공격할 최적의 타이밍까지 전부 속속들이 알고 있었다."
103020-20 = "인도자는 처음부터 우리 머리 위에 있었던 것이다. 이래서야 <게마트리아>의 이름도 땅에 떨어져 버린 꼴이군."
103020-21 = "큭큭큭…… 애초에 저희는 목표조차도 아니었을 겁니다."
103020-22 = "우리를 가장 먼저 습격한 이유는, 그저 목표를 위한 도구를 확보하기 위해서였을 뿐이겠죠."
103020-23 = "……키보토스를 멸망시키기 위한 도구."
103020-24 = "그렇습니다. 공포로 반전된 저승의 신을 움직여서 <게마트리아>가 소유한 모든 비의들을 강탈해 갔습니다."
103020-39 = "미메시스, 콤뮤니오 상토룸, 데카그라마톤, 이름 없는 신들, 라이브러리 오브 로어, 그리고…… 우리가 확보하지 못했던 아트라하시스의 방주까지도."
103020-40 = "색채의 인도자가 [ruby=저승의 신]아누비스[/ruby]의 공포를 확보한 이상, 키보토스는 더 이상 우리가 활동하기 좋은 장소가 아니게 되었습니다."
103020-41 = "<광기>는 모든 것을 집어삼켜 자신의 색으로 덧칠합니다. 그것이 아마 <색채>의 본질."
103020-42 = "이곳에서 우리가 각자의 가치를 추구해봤자, 우리들의 성취는 곧 프레나파테스의 도구가 늘어나는 결과로 이어질 뿐이겠죠."
103020-43 = "그럼 키보토스는 끝나는 건가?"
103020-44 = "……아뇨. 아직 [USERNAME] 선생이 있습니다. 그는 자신의 [ruby=샬레]학생들[/ruby]과 함께 아직 싸우고 있죠."
103020-45 = "……그런가. 과연, 그 사람이라면."
103020-46 = "하지만 그것도 곧 한계에 봉착합니다. 과연 불가해한 <색채>를 상대로 그 불가해한 선생이 어디까지 견딜 수 있을지……. 큭큭큭큭……."
103020-50 = "모든 것이 파탄 난 지금도 아직 흥미로운 것들이 남아있습니다. 재미있지 않습니까?"
103020-54 = "……게마트리아는 여기서 일시 해산합니다."
103020-59 = "상황을 봐서 다시 소집하도록 하죠. 그때까진 좋을 대로 하십시오, 마에스트로."
103020-60 = "그러고 보니 골콩트는? 그는 어떻게 되었지?"
103020-61 = "본체인 데칼코마니는 죽을 수 없는 존재이니 문제없을 겁니다. 다만 골콩트는 아마도 프랜시스로 교체된 것 같더군요."
103020-62 = "……. 프랜시스, 하필 그자인가."
103020-63 = "그는 어떤 의미로 베아트리체보다 더 위험한 존재다. 골콩트가 그리워지겠군."
103020-67 = "검은 양복, 그럼 그대는 이제부터 뭘 할거지?"
103020-68 = "큭큭큭……."
103020-71 = "어떻게 된 거죠? 상황은요?"
103020-72 = "어…… 그러니까…… 초고위급 에너지를 띠는 질량체가…… 키보토스 전역에 관측되었어……."
103020-78 = "또다시…… 말야."
103020-80 = "그, 그럴 수가……."
103020-81 = "……큭."
103020-83 = "대책위원회 동아리실"
103020-84 = "……."
103020-85 = "……흐음."
103020-86 = "그렇다는 건……."
103020-91 = "……네. 제가 알고 있는 것은 이게 전부입니다. 아비도스 대책위원회 여러분."
103020-92 = "……."
103020-94 = "즉, 시로코 쨩은 <색채>와 접촉해서…… 자신을 잃어버렸다…… 라는 거죠……?"
103020-95 = "그리고 이 모든 사태에 시로코 선배가 개입되어 있다고……?"
103020-101 = "시로코 선배가……. 어째서…… 왜 이런……."
103020-102 = "시로코 선배에게 무슨 일이 벌어진 거죠? 왜 세계를 멸망시키려고 하는 거예요? 어째서 그런 표정을 짓는 거예요?"
103020-103 = "아야네 쨩……."
103020-104 = "저, 저는 잘 모르겠어요……. <색채>라는 것도 설명은 들었지만…… 그런다고 저렇게 전혀 다른 사람이 된 것처럼……."
103020-105 = "왜 이런 일이 벌어졌는지 이게 무슨 의미인지 하나도 모르겠고……. 선배가 무슨 생각인지도 전혀……."
103020-106 = "……."
103020-107 = "아야네 쨩……."
103020-109 = "……지금 그녀에게 무슨 일이 벌어졌든, 그것은 스나오오카미 시로코의 탓이 아닙니다."
103020-110 = "그녀 자신의 의지나 노력으로 해결할 수 없는, 그런 사고에 휘말린 거라고 봐야 합니다."
103020-112 = "맞아! 아야네 쨩. 들어보면 나쁜 건 그 <색채>라는 거잖아, 시로코 선배가 아니라!"
103020-113 = "……."
103020-114 = "시로코 쨩을 되돌릴 수 있는 방법은…… 있는 건가요?"
103020-119 = "현재로선 그런 게 있는지 알지 못합니다……."
103020-120 = "그, 그런……."
103020-122 = "다만, 그 당시에 유일하게 <색채>와 조우했던 저도 이렇게 무사히 돌아올 수 있었습니다."
103020-127 = "선생님도 색채에 대항할 방법을 찾으러 사람을 백귀야행 자치구로 보낸 상태이기도 하고요……."
103020-128 = "선생님이……."
103020-130 = "저희 역시 시스터후드와 함께 <색채>의 정보를 분석하고 있으니……. 스나오오카미 시로코를 되돌릴 방법은 분명히 있을 겁니다."
103020-132 = "뭐라고 적혀 있나요? 부장?"
103020-133 = "모, 몰래 봐도 되는 걸까요……."
103020-138 = "어디 보자……."
103020-144 = "<……[USERNAME] 선생.>"
103020-145 = "<색채로 완전히 반전된 존재를 원래대로 되돌릴 수 있는 방법 같은 건 이 세상엔 존재하지 않아.>"
103020-149 = "<그건 죽은 사람을 되살리지 못하는 것과 마찬가지로 당연한 이 세상의 법칙이야.>"
103020-155 = "이, 이렇게 되면…… 성소가 다시 출현한다는 뜻……이죠?"
103020-156 = "그럼 지금까지 우리가 싸운 건 아무 소용없었다는 거잖아……."
103020-158 = "……그때와는 상황이 조금 다릅니다."
103020-159 = "어, 맞아. 에너지가 나타난 위치가 조금 다르긴 해……."
103020-163 = "붉은겨울의 빙해, 버려진 유원지의 지하 구역, 게헨나의 힌놈 화산, 트리니티의 지하 카타콤……."
103020-164 = "아유무, 저번에는 이 현상 이후 얼마 만에 성소가 출현했죠?"
103020-165 = "어…… 대략…… 24시간 정도였어요."
103020-167 = "그렇다면 우리에게 남은 시간도 그 정도라는 건가……."
103020-168 = "아뇨, 더 빠를지도 모릅니다."
103020-169 = "저번보다 에너지 수치가 평균 38% 정도 더 많아요."
103020-171 = "……응?"
103020-177 = "어라, 그러네? 흐에엑, 린 선배, 그때 그 숫자를 전부 외우고 있었던 거야?"
103020-179 = "그렇다는 건 남은 시간은 하루…… 아니, 어쩌면 그보다 더 빨리……."
103020-180 = "지금 각 자치구들은 전투 후의 상황을 정비하고 있어. 성소는 사라졌지만 남아 있는 적들도 있으니까."
103020-181 = "거기에다가 이 새로운 성소까지 다시 대비한다는 건 불가능해요. 다들 쉬지도 못한 상태인데……."
103020-182 = "맞아. 그렇게 되면 더 이상 방법이 없거든. 성소의 두 번째 출현은 무조건 막아야 해."
103020-183 = "……그런데 어떻게?"
103020-189 = "……."
103020-190 = "지금 상대는 보이지도 않고 존재하지도 않는다구. 관측되는 건 에너지뿐이고. 그러다가 갑자기 쾅! 하고 나타나는 식이잖아."
103020-191 = "이걸 어떻게 막을 수 있는 거야? 방법 같은 게 있긴 한 거야?"
103020-192 = "[s] \"………….\""
103020-193 = "선생님……."
103020-194 = "[s] \"상황이 이렇게까지 된 건 내 책임이야. 다들 미안해.\""
103020-199 = "네……?"
103020-200 = "네, 네?! 서, 선생님? 어째서……?!"
103020-201 = "[s] \"나는 이런 일이 생길지도 모른다는 걸 어렴풋이 알고 있었어.\""
103020-204 = "[ns] \"시로코에게 위험한 일이 생길지도 모른다는 예감도,\""
103020-207 = "[ns] \"키보토스가 위험에 처할 것이라는 예언도,\""
103020-210 = "[ns] \"우리가 상대해야 하는 적에 대한 경고도,\""
103020-213 = "[ns] \"이미 다 알고 있었는데도…….\""
103020-216 = "[ns] \"내가 너무 상대를 안일하게 생각했던 걸지도 몰라.\""
103020-218 = "아닙니다! 선생님은 그 당시에 할 수 있는 건 전부 다 했어요……!"
103020-219 = "린 선배……?"
103020-220 = "근거 없는 예언일지라도 저를 찾아와서 경고하기도 하셨고요. 대비할 수 있는 건 전부 다 했습니다."
103020-221 = "그런 대비가 있었기에 거짓된 성소 공략을 성공적으로 수행해 낼 수 있었던 겁니다."
103020-222 = "그 이상은…… 저의 문제입니다."
103020-223 = "제가 부족했기 때문에……. 제가, 총학생회장이 아니기 때문에……."
103020-225 = "……."
103020-227 = "린 선배……."
103020-230 = "[ns1] \"그런 건 변명이 되지 않아.\"\n[ns2] \"나는 시로코를 지켰어야 했어.\"\n[ns3] \"그게 어른인 내 책임이니까.\""
103020-234 = "……."
103020-236 = "자아, 자아. 너무 열 내지 말자고. 선생."
103020-237 = "[s] \"으, 으응? 호시노?\""
103020-240 = "이건 심플한 이야기야."
103020-241 = "시로코 쨩이 이상해졌어? 그럼 쥐어패서라도 붙잡아서 데려오면 되는 거야. 뒷일은 나중에 생각하면 돼."
103020-242 = "네……?! 호시노 선배……?"
103020-243 = "흐음~ 이 아저씨도 시로코 쨩이 어쩐지 위험한 길로 빠질지도 모른다는 나쁜 예감은 예전부터 있었어."
103020-244 = "그래서 혹시라도 지금 이 사태가 사라진 시로코 쨩과 관계가 있는 거라면……"
103020-245 = "그러면 나는 어떻게 해야 하나……. 그런 고민을 안 했다면 거짓말이지만 말야……."
103020-250 = "그치만 이건 이야기가 전혀 다르다구!"
103020-251 = "이건 어디까지나 <색채> 때문이지, 시로코 쨩 잘못이 아니잖아! 선생 잘못도 아니야!! 누구 잘못도 아닌 거야!"
103020-252 = "우리가 싸울 상대는 시로코 쨩이 아니라 따로 있으니까!"
103020-253 = "[s] \"………….\""
103020-254 = "게다가 지금 이 사태를 해결하지 못하면 키보토스에 시로코 쨩 같은 피해자가 더 많이 생길지도 몰라."
103020-255 = "그렇다면 간단한 이야기야."
103020-256 = "선생과 우리는 시로코 쨩 같은 다른 피해자가 생기지 않게 막아야 해. 그게 가장 중요하니까!"
103020-257 = "만약 시로코 쨩이 우릴 방해하러 온다면? 그럼 그때 포획해서 붙잡아 두면 돼."
103020-258 = "되돌릴 방법은 선생과 다른 사람들이 노력해 줄 거니 어떻게든 될 거라고!"
103020-259 = "호시노 선배……."
103020-261 = "아니, 시로코 선배가 무슨 야생동물이야? 뭐, 비슷한 부분이 좀 있긴 하지만……."
103020-262 = "으헤~ 그런 거라구. 야생의 시로코 쨩을 포획하는 건 이 아저씨가 완전 전문이거든? 한두 번 해본 게 아니거든?"
103020-263 = "그렇지, 노노미 쨩?"
103020-264 = "응응! 사실 한 번뿐이지만, 그래도 키보토스에서 유일한 경험자인 건 맞으니까요☆"
103020-265 = "으헤~ 그러니까 말야. 선생은 늘 그렇듯이 어떻게든 될 거라고 태평스럽게 얘기해주는 게 더 어울려."
103020-269 = "[ns4] \"……응.\"\n[ns5] \"고마워, 호시노.\""
103020-272 = "[ns] \"시로코를 되찾아 오자. 반드시 그렇게 하는 거야. 무슨 방법을 써서라도.\""
103020-273 = "으헤~ 그렇지 그게 역시 선생이지~"
103020-275 = "맞아! 시로코 선배는 원래 좀 이상했으니까, 거기서 좀 더 이상해진다고 딱히 놀랄 것도 없고! 시로코 선배 포획이라, 재미있겠는데?"
103020-276 = "응응, 맞아요. 야생의 시로코 쨩은 사나우니까, 꽁꽁 묶어서 목줄을 채워 데려오는 거예요☆"
103020-281 = "……네. 알겠어요."
103020-282 = "저도 이러고 있을 게 아니라, 이 사태를 막을 방법을…… 그리고 시로코 선배를 찾을 방법을 찾아 보겠어요!"
103020-287 = "[ns] \"응. 그럼 모두들 부탁할게.\""
103020-289 = "……그러네요. 어쩌면."
103020-290 = "모모카. 현재 키보토스 전역에 탐지된 고위급 에너지, 그 흐름을 탐지할 수 있나요?"
103020-291 = "흐름?"
103020-292 = "저희는 최후의 성소를 공략할 때 모든 성소의 에너지가 한곳으로 모이는 걸 직접 목격했습니다."
103020-293 = "아! 그러네요. 저 고위급 에너지가 이리저리 전달이 가능한 유동적인 것이라고 가정하면……."
103020-295 = "……흐음. 무슨 말인지 알겠어. 한번 해볼게."
103020-304 = "으음……."
103020-305 = "……선배의 말이 맞는 것 같아. 각 좌표마다 공통된 에너지 흐름이 있어."
103020-306 = "모모카 쨩! 그럼 그 흐름을 역추적하면……!!"
103020-308 = "알고 있다구, 잠깐만 기다려 봐."
103020-317 = "찾은 것 같아."
103020-318 = "모모카 쨩!"
103020-321 = "모든 고위급 에너지의 흐름은 하나의 장소로 이어지고 있어. 여기가 에너지의 시작점이야."
103020-322 = "즉, 여기가 거짓된 성소를 생성하고 있는 중심이란 얘기네."
103020-323 = "그 장소는요?"
103020-326 = "하늘 위. 키보토스 고도 75,000m 상공."
103020-327 = "네?! 이 고도라면 성층권…… 아니, 그보다 더 높은 곳이지 않나요……?!"
103020-328 = "……하늘 위였던 거군요."
103020-330 = "맞아. 여기서 지금까지 포착된 성소를 전부 합한 것보다 더 많은 고위급 에너지가 탐지되고 있어."
103020-331 = "그렇다는 건…… 바로 저기가 이 모든 사태의 배후……."
103020-332 = "정말이지…… 설마 깜찍하게 하늘 위에 숨어 있었을 줄은."
103020-334 = "그렇군요……. 그렇다면, 저기에 키보토스를 멸망으로 이끄는 자가 있을 겁니다."
103020-341 = "[ns] \"색채의 인도자 프레나파테스.\""
103020-344 = "다음화;방법과 도구"
