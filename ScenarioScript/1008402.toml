[translation]
1008402-1 = "은밀한 산행"
1008402-6 = "(주말에 휴일을 맞아 가벼운 마음으로 근처의 산에 등산을 갔다가……)"
1008402-12 = "(……입구에서 코타마와 마주쳤다.)"
1008402-13 = "[s] \"……코타마?\""
1008402-17 = "아."
1008402-18 = "서, 선생님께서 어째서 이곳에……"
1008402-19 = "아니, 그보다…… 제가 여기에 온 건……"
1008402-25 = "……좋은 휴일입니다, 선생님."
1008402-26 = "[s] \"좋은 휴일이야, 코타마.\""
1008402-28 = "[ns1] \"그보다 산에는 무슨 일로 온 거야?\"\n[ns2] \"평소에는 부실 밖으로 나가는 것도 꺼리면서……\""
1008402-31 = "그게 그러니까……"
1008402-32 = "새해가 되었으니 건강한 생활 습관을 붙여볼까 싶어서—"
1008402-33 = "오랜만에 등산을 하기 위해 산을 찾았습니다!"
1008402-34 = "[s] \"……커다란 녹음기를 들고서?\""
1008402-35 = "이, 이건 녹음기가 아닙니다!"
1008402-36 = "그저…… 주변의 소리를 집음하는 다용도 전자 기록 장치일 뿐입니다."
1008402-37 = "[s] \"그게 녹음기잖아……\""
1008402-42 = "……역시 선생님을 속일 수는 없겠군요."
1008402-43 = "사실, 이 산에 방문한 이유는 산에 오는 연인들의 밀담을 녹음하기 위해서였습니다."
1008402-44 = "[s] \"……밀담?\""
1008402-48 = "네. 전에 한 번 말씀드렸지만, 산은 연인들의 데이트 장소로도 종종 애용되니까요."
1008402-49 = "인적이 드물어 은밀한 이야기를 나누기에도 좋고, 산행 중에는 육체적, 정신적으로 지치는 일도 많이 생기니……"
1008402-50 = "상대를 의지하다 보면 평소에는 하기 어려운 달콤한 말도 쉽게 할 수 있을 겁니다."
1008402-51 = "그래서 등산로에 숨어 기다리고 있노라면 재미있는 대화를 잔뜩 녹음할 수 있을 거라고 생각했는데……"
1008402-52 = "[s] \"타인의 대화를 엿듣는 것은 나쁜 일이야.\""
1008402-53 = "……선생님이라면 그렇게 말씀하실 거라고 생각했습니다."
1008402-54 = "하지만 여기까지 와서 아무런 성과 없이 돌아가는 것도 그렇고……"
1008402-55 = "이렇게 된 이상 선생님의 목소리라도 녹음해야—"
1008402-56 = "[s] (……대놓고 선언하면 도청의 의미가 있나?)"
1008402-58 = "[ns] \"여하튼, 모처럼 산에 왔으니 같이 등산이라도 하자.\""
1008402-59 = "으음…… 등산 자체는 내키지 않지만……"
1008402-60 = "확실히 탁 트인 등산로 입구에서는 그다지 괜찮은 대화를 녹음할 수 없을 것 같군요."
1008402-61 = "연인들이 달콤한 말을 나눌 만큼 분위기가 좋은 곳을 찾으려면 산을 좀 더 올라야 할 것 같습니다."
1008402-62 = "게다가 운이 좋다면 등산으로 인해 거칠어진 선생님의 목소리를 녹음할 수 있을지도 모르니까요."
1008402-63 = "[s] \"그런 목소리는 어디에 쓰려는 거야?!\""
1008402-64 = "후후, 그건 비밀입니다."
1008402-68 = "그럼 지금부터 함께 산을 올라볼까요?"
1008402-74 = "(그로부터 약 30분 뒤……)"
1008402-79 = "헉, 헉…… 이상하군요……"
1008402-80 = "분명 등산로 입구에는 초보자도 쉽게 오를 수 있는 가벼운 산길이라고 쓰여 있었는데……"
1008402-81 = "절반도 오르기 전에 체력이 모두 바닥나고 말다니……"
1008402-82 = "공식 산림 정보 안내 문구의 정정을 요청하는 바입니다."
1008402-83 = "[s] \"코타마의 체력이 부족한 거 아니야?\""
1008402-84 = "그럴 수가……"
1008402-85 = "솔직히 체력만큼은 평범한 수준이라고 자신하고 있었는데."
1008402-86 = "[s] \"그 상태로 계속 산을 오르는 건 어려워 보이네.\""
1008402-90 = "[ns] \"자, 손을 이리 줘. 내가 끌어줄게.\""
1008402-94 = "헉, 헉…… 그럼, 부탁드리겠습니다……"
1008402-101 = "……선생님의 손, 생각했던 것보다 따듯하군요."
1008402-102 = "게다가 뭔가…… 좋은 향기가 나는 것 같습니다."
1008402-103 = "[s] \"그런가? 잘 모르겠는데……\""
1008402-104 = "네. 선생님을 이렇게 가까이에서 마주하는 건 처음이라, 조금 신기한 느낌이군요."
1008402-105 = "평소에는 멀리서 선생님의 목소리에만 집중하느라, 향이나 체온 같은 요소는 신경 쓰지 않았으니……"
1008402-106 = "이런 종류의 자극도 나쁘지 않—"
1008402-112 = "……산행 중에는 육체적, 정신적으로 지치는 일도 많이 생기니……"
1008402-113 = "상대를 의지하다 보면 평소에는 하기 어려운 달콤한 말도 쉽게 할 수 있을 겁니다."
1008402-118 = "………!"
1008402-119 = "[s] \"갑자기 왜 그래?\""
1008402-120 = "연인들이 방심한 틈에 하는 달콤한 말을 녹음하러 와 놓고서, 정작 똑같은 함정에 빠져 버리다니……"
1008402-121 = "산행에 지쳐 무의식적으로 부끄러운 말을 해버리고 말았습니다……"
1008402-125 = "바, 방금 이야기는 못 들은 것으로 부탁드립니다!"
1008402-132 = "(그리고 코타마는 산을 오를 때보다 두 배는 빠른 속도로 시야에서 황급히 사라져 버렸다……)"
