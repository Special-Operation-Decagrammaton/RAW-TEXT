[translation]
10017065-11 = "카페 <화이트&메이슨> 입구"
10017065-17 = "(이럴 때, 이치카가 있었다면……!)"
10017065-18 = "(하지만 지금은 우리들 만의 힘으로 사태를 해결하는 수밖에 없겠군요……)"
10017065-25 = "큭!"
10017065-26 = "으윽……!"
10017065-27 = "훌륭하군요, 하스미 부부장님."
10017065-28 = "과찬의…… 말씀입니다. 미네 단장님."
10017065-29 = "하지만 슬픕니다. 그런 뛰어난 실력을 가지고 한다는 일이."
10017065-30 = "선의를 가진 자들의 치킨을 빼앗는 행위였다니요!"
10017065-32 = "!!"
10017065-33 = "치킨, 이요……?"
10017065-34 = "그것이…… 구호기사단이 정의실현부를 습격한…… 이유인가요?"
10017065-35 = "그 밖에 무엇이 있겠습니까!"
10017065-36 = "저는 뭔가, 엄청나게 대단한 이유가 있을 것이라고 생각했는데……"
10017065-37 = "가령 정의실현부를 전부 적으로 돌려도 이상하지 않을 정도로 심각한 사안이……"
10017065-38 = "정치적인 문제로까지 비화될 수 있음을 알면서도, 굳이 그런 위험을 감수해야 했을 정도로 대단한 무언가가 있어서……"
10017065-39 = "그래서! 크리스마스인데도! 저희 정의실현부를 습격했다고 생각했는데!"
10017065-40 = "치킨이라고요? 치킨??"
10017065-41 = "모르시는 것 같은데 말이죠! 그 치킨은-"
10017065-46 = "꼴 좋구나, 정의실현부!"
10017065-47 = "악한 사람, 아니, 약한 사람을 괴롭히니까 대가를 받는 거다!"
10017065-48 = "그동안 우리를 괴롭혀 댄 것, 이 자리에서 갚아 주지!"
10017065-49 = "이용당한 기분이 어떠냐? 이번엔 너희가 당할 차례라고!"
10017065-50 = "크케케케! 우리들의 시간이다!"
10017065-52 = "네……? 이용, 이요?"
