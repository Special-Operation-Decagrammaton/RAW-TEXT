[translation]
1013008-1 = "아낌없이 주는 언니"
1013008-3 = "안녕하세요, 스바루 선배! 아, 선생님도요!"
1013008-4 = "네. 안녕하세요. 별일 없죠?"
1013008-8 = "어? 그런데, 선배. 그거 소문으로만 듣던……."
1013008-10 = "전설의 운메에봉 바비큐 치즈 맛 아닌가요?!"
1013008-11 = "네, 네?!"
1013008-12 = "그건, 그런데요……."
1013008-16 = "……."
1013008-17 = "먹고 싶나요?"
1013008-22 = "네! 당연하죠!"
1013008-23 = "하하. 알았어요. 여기요."
1013008-24 = "정말요? 감사합니다!"
1013008-28 = "……."
1013008-29 = "(나름 아껴 먹으려고 갖고 있었던 운메에봉이었는데…….)"
1013008-30 = "[s] \"괜찮아, 스바루?\""
1013008-31 = "네? 네! 그야 물론이죠! 아무렇지도 않아요!"
1013008-32 = "예? 그런 표정이 아니었다고요……?"
1013008-33 = "아니에요, 아니에요! 서, 선생님이 너무 과하게 생각하시는 거겠죠!"
1013008-36 = "네? 커스터드푸딩 맛 주스요?"
1013008-37 = "커스터드푸딩이라고만 해도, 환상 속의 간식 같은 건데…… 그 맛이 나는 주스라고요……?"
1013008-38 = "네, 네에. 이거랍니다."
1013008-39 = "……."
1013008-40 = "저, 선배……?"
1013008-41 = "죄송하지만, 저도 한 입만…… 마셔 보면, 안 될까요……?"
1013008-42 = "……."
1013008-43 = "자요. 가져가서 마셔요."
1013008-44 = "괜찮으시겠어요?!"
1013008-45 = "물론이죠. 그래도 혼자 마시지 말고, 다른 분과 함께 나눠 마시면 더 좋을 것 같아요."
1013008-46 = "감사합니다, 선배!"
1013008-51 = "(구하기 어려운 거였는데…….)"
1013008-52 = "[s] \"……괜찮아?\""
1013008-53 = "네?!"
1013008-54 = "……."
1013008-55 = "네! 그럼요! 물론이죠!"
1013008-58 = "고마워요!"
1013008-59 = "다행이네요."
1013008-61 = "잘 쓸게요! 역시 선배가 최고예요!"
1013008-62 = "네, 네에……."
1013008-64 = "(스바루를 위해서라도 자세한 설명은 생략하겠지만…….)"
1013008-65 = "(모든 것이 끝난 스바루에게는, 거의 아무것도 남지 않았다 …….)"
1013008-67 = "……."
1013008-68 = "[s] \"…….\""
1013008-69 = "……."
1013008-70 = "[s] \"…….\""
1013008-71 = "왜, 왜 그렇게 보고 계세요……?"
1013008-72 = "[s] \"선생님 앞에서는 숨기지 않아도 돼…….\""
1013008-73 = "그런 거 아니니까요, 정말로!"
1013008-77 = "하지만, 역시……."
1013008-78 = "조금 전 그건…… 약간, 아깝긴 하네요."
1013008-79 = "[s1] \"이거 안 되겠군요, 스바루 학생.\"\n[s2] \"선생님한테 납치 좀 당합시다.\""
1013008-82 = "……네?"
1013008-84 = "서, 선생님? 갑자기 이런 곳은 어째서……?"
1013008-85 = "네? 일단 먹고 생각하자고요?"
1013008-86 = "……."
1013008-87 = "싫거든요~? 선생님이 무슨 생각 하시는지, 대충 보이거든요~? 저는 절대로–"
1013008-89 = "주문 나왔습니다. 천천히 즐겨 주세요."
1013008-94 = "[ns] \"……괜찮겠어?\""
1013008-95 = "그, 그럼요! 저는 아무렇지도 않으니까요!"
1013008-96 = "그런데…… 그, 그냥 말만 해 보는 건데요!"
1013008-97 = "……제가 좋아하는 것만…… 어떻게, 시키셨네요……?"
1013008-98 = "[s3] \"선생님이 딱 봐 놨어, 요 녀석!\"\n[s4] \"저번에 샬레 당번했을 때 말이지! 어? 이것저것!\""
1013008-101 = "!!!!!"
1013008-102 = "마, 마음만 받을 거니까요! 물론 그때는 감사했지만요!"
1013008-104 = "(고집이 세구만…… 하는 생각을 하며 잠시 시선을 돌리고 있자.)"
1013008-108 = "(테이블 위의 음식이…… 일부 사라져 있다는 것을 알아차렸다!)"
1013008-110 = "(그 뒤로도 일부러 여기저기 다른 곳으로 시선을 주었고……!)"
1013008-114 = "(그때마다 분명히! 테이블 위의 음식이 조금씩 사라지곤 했다!)"
1013008-116 = "[ns] \"이상하다아~?\""
1013008-117 = "뭐, 뭐가요. 왜요. 어째서요."
1013008-118 = "[s] \"왜 음식들이 사라지고 있을까~?\""
1013008-119 = "서, 선생님이 드신 거 아닐까요……?"
1013008-120 = "변명은 좀 더 그럴싸하게 해야 하는 법이라고요?"
1013008-121 = "조, 좋은 거 가르치시네요, 진짜!"
1013008-122 = "……."
1013008-123 = "그래요! 죄송해요! 제가 먹었어요!"
1013008-124 = "……어차피 선생님도 이렇게 막 먹어대는 여고생 싫으시죠?"
1013008-125 = "[s] \"……!\""
1013008-129 = "[ns5] \"아니야! 너희는 잘 먹고 잘 커야 해!\"\n[ns6] \"잘 먹는 학생만큼 보기 좋은 것도 없단다!\""
1013008-132 = "그, 그런가요……?"
1013008-133 = "……."
1013008-134 = "감사, 합니다……."
1013008-135 = "네? 그것 말고도 제가…… 특별히 서투른 부분이 있다고요? 그건 또 뭔가요?"
1013008-136 = "욕망을…… 해소하는 방식……?"
1013008-137 = "……혹시 선생님, 그런 식의 말, 다른 학생에게 막 하고 다니시는 거 아니죠……?"
1013008-141 = "왜 눈을 피하시나요. 저기요. 제 눈을 바라보고 말씀해 주시죠."
1013008-143 = "(스바루의 따가운 시선을 피하며, 일부러 스바루를 여기저기 끌고 다녔다!)"
1013008-151 = "[ns] \"어때?\""
1013008-152 = "어떠냐고 물으셔도요……. 뭔가 얼떨떨하네요."
1013008-153 = "잘 모르겠다기보다는, 역시……."
1013008-154 = "경험이 많지 않아, 낯설다는 느낌일까요."
1013008-155 = "예전에도 아리우스 바깥에서, 이런저런 일을 해결해 보기는 했지만…… 이런……."
1013008-159 = "이른바, '양지'에서."
1013008-160 = "이런 시간을 보낸 적은 없어서 말이죠……."
1013008-161 = "……?!"
1013008-162 = "이 음악은 뭔가요, 선생님?!"
1013008-163 = "인간이 죽는 것이 친환경이다아아아–!!!"
1013008-165 = "(눈을 빛내기 시작한 스바루를 데리고, 음반 가게로 들어갔다!)"
1013008-167 = "헤비…… 메탈? 헤비메탈이라고 하는군요!"
1013008-168 = "마음에 드냐고요? 으, 어, 뭐라고 말씀드려야 할까요……. 그러니까……."
1013008-169 = "강렬해요!"
1013008-170 = "[ns] \"그야 그렇겠지!\""
1013008-171 = "뭔가 에너지 넘치고, 빠르고, 터져 나오는 것 같고……!"
1013008-172 = "무엇보다 이딴 세상 박살 나 버리라는 가사가 마음에 드네요!!!"
1013008-173 = "[ns] \"진심으로 실행은 하지 말아 줘!\""
1013008-175 = "후아, 엄청났어요. 선생님."
1013008-176 = "아직도 귀와 가슴 속이 쿵쿵 울리는 것 같네요……."
1013008-177 = "네? 메탈을 한 번에 좋아하게 되다니, 어떤 영역의 '소양'이 있는 것 같다고요?"
1013008-178 = "그런 건 잘 모르겠네요. 그저 강렬하게 마음에 들어온 것뿐이어서……."
1013008-179 = "……특히, 가사가요."
1013008-180 = "[s] \"……역시, 아직 세상이 좀 망해 봤으면 좋겠니……?\""
1013008-181 = "……."
1013008-182 = "어떨까요. 저도 잘 모르겠어요."
1013008-183 = "그랬으면 좋겠다는 생각이 들면서도, 그래도 그 정도까지는 아닌 것 같기도 하고요."
1013008-184 = "하지만 선생님도 말씀하셨잖아요? 사람 마음은 단수가 아니라고요. 그러니까……."
1013008-185 = "……."
1013008-186 = "선생님이 제게, 세상이 그래도 아직은 살 만한 곳이라는 걸, 확신시켜 주시면 되는 거 아닐까요?"
1013008-187 = "[ns] \"아닛. 거기서 이쪽으로 화살을 돌리다니.\""
1013008-188 = "에이, 왜 그러세요. 어른이시잖아요?"
1013008-189 = "[s] \"그건 무적의 단어가 아니란다…….\""
1013008-190 = "하지만 이런저런 핑계로 많이 쓰셨죠?"
1013008-191 = "[s] \"그 사실을 부정하지는 못하겠는데…….\""
1013008-193 = "(그렇게, 스바루와 시답잖은 농담을 나누며 돌아가는 길에 올랐다.)"
