221020-82 = "3;가짜 총학생회장;06;저도 참. 제 자리가 갖는 부담감을 미리 고려 했어야 했는데…… 선생님께 의도치 않게 부담을 드린 모양이네요.\n#3;em;[땀]"
221020-83 = "[s] \"그, 그런 게 아니야!\""
221020-84 = "#st;[0,0];instant;1;"
