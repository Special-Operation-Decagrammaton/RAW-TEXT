221020-90 = "3;가짜 총학생회장;01;물론 총학생회의 업무가 항시 바쁜 건 부인하지 않겠습니다만, 언제나 책상 앞에 앉아만 있으면 건강을 해칠 수도 있으니까요."
221020-91 = "3;가짜 총학생회장;03;가끔은 순행을 핑계로 밖에 나와서 바깥 공기를 맡는 것도 꽤 기분 전환이 된답니다."
221020-92 = "3;가짜 총학생회장;09;특히 오디세이아 학원의 청량한 풍경에는 다른 학원에서 쉽게 느끼기 어려운, 해양 학원만의 풍취가 있어서 보는 것만으로도 꽤 즐거워요.\n#3;em;[음표]"
