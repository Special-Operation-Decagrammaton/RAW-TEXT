221020-76 = "3;가짜 총학생회장;02;아닙니다. 안 그래도 최근 크로노스 학원 보도부의 여러분들이 의욕이 지나친 나머지, 조정실장이 개인적으로 어려움을 호소하고 있었거든요."
221020-77 = "3;가짜 총학생회장;09;덕분에 크로노스 학원의 학생들과 느긋하게 이야기할 기회가 생겼네요.\n#3;em;[…]"
221020-78 = "[ns5] \"그런데 이렇게 같이 와도 괜찮은 거였어?\"\n[ns6] \"공의 출처를 묻는 거라면 나 혼자도 괜찮았는데.\""
