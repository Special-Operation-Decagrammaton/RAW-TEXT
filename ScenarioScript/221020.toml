[translation]
221020-1 = "第2話;オリュンポス号の帰還"
221020-3 = ""
221020-4 = "D.U.アオハマ港入口"
221020-5 = "クロノスチャンネルをご覧の皆さん、こんにちは！#nクロノス報道部の[ruby=かざまき]風巻[/ruby]マイです！"
221020-6 = "本日の『風巻マイの時事分析』チャンネルはアオハマ港からお送りしています。"
221020-7 = "遠洋航海から帰ってきたオデュッセイア海洋高等学校！#n4ヶ月ぶりの帰港を一目見ようと、すでに多くの市民がやってきています！"
221020-8 = "港湾管理局のお偉方に……あっ、連邦生徒会の役員もいますね！"
221020-9 = ""
221020-11 = ""
221020-13 = ""
221020-14 = "すみません！クロノスチャンネルです！#n少しインタビューを――"
221020-15 = ""
221020-17 = ""
221020-18 = ""
221020-19 = "ちっ……一言くらい答えたって減るもんじゃないでしょ。"
221020-20 = "コホン、ともあれ。"
221020-21 = "皆さんもご存じの通り、オデュッセイア海洋高等学校は海洋活動に特化した学園です。#n一度航海に出れば、最低でも1年は海の上で生活することでも有名なのですが――"
221020-22 = "出航してまだ半年も経っていないタイミングでの電撃帰港！#n残りの航海日程を突然取りやめてD.U.へ戻ってきたそうです！"
221020-23 = "オデュッセイアが航海を中断し、陸へ引き返した理由とはいったい何なのか？"
221020-24 = "未だ学園側からの発表がなく詳細は不明ですが、#nシャーレの先生が訪問を要請したという噂もあります！"
221020-25 = "つまり……シャーレが捜査しなければならないほどの事件が#nオデュッセイアで発生したということなのでしょうか！？"
221020-26 = "それともただの先生の気まぐれなのか！？"
221020-27 = ""
221020-29 = ""
221020-30 = "おっと、噂をすれば[USERNAME]先生です！"
221020-31 = ""
221020-33 = ""
221020-34 = ""
221020-35 = "こんにちは、先生！クロノスチャンネルです！"
221020-36 = "[s1] \"こんにちは。\"\n[s2] \"さすが、いい嗅覚してるね……。\""
221020-39 = "もちろんです！キヴォトス各地の話題を誰よりも早くお届けする！#nそれがクロノススクール報道部ですから。"
221020-40 = "それはそうと先生。#n今回の件に先生が関わっているという噂は本当なんですか？"
221020-41 = "[s] \"関係あると言うべきか、ないと言うべきか……。\""
221020-42 = "ほほう？スクープの香りがしますね……。"
221020-43 = "シャーレの先生が直々に動くとなれば、#nオデュッセイアに何かあるということですよね？"
221020-44 = "悩み相談ですか？それとも部活同士の揉め事？#nあるいは[ruby=アイランド]オデュッセイア生徒会[/ruby]との極秘会談――"
221020-45 = "まさかまさか、最近ネットで話題の[ruby=ロア]都市伝説[/ruby]に関わる件だったり？"
221020-46 = "[s] \"えっと、それが……。\""
221020-47 = "先生をあまり困らせないでいただけますか、[ruby=かざまき]風巻[/ruby]さん？"
221020-48 = ""
221020-49 = ""
221020-50 = "先生は様々な相談を受けていらっしゃいます。#n口に出せないこともその分たくさんあるのですよ。"
221020-51 = "取材熱心なのは結構ですが、相手を困らせるのは本末転倒ではありませんか？"
221020-52 = "れ、連邦生徒会長！？"
221020-53 = "まさか……歓迎式に連邦生徒会長も参加されるんですか！？"
221020-54 = "ええ。何か問題でも？"
221020-55 = "いえ、ただ……ほとんど外出されない連邦生徒会長が、#n一学園の行事に足を運ぶだなんて――"
221020-56 = "スクープどころの騒ぎじゃないですよ！"
221020-57 = "ふふ。聞きたいことがたくさんあるようですね。"
221020-58 = "……よろしければ行事の後に、インタビューの場を設けましょうか？"
221020-59 = "気分次第では……#nまだ話したことのないプライベートなことまでお答えするかもしれませんよ。"
221020-60 = "いいんですか！？ぜひ、なにとぞ……！"
221020-61 = "では……今は、先生との先約がありますので、これで。"
221020-62 = ""
221020-64 = ""
221020-65 = ""
221020-66 = "マイ先輩、追わなくていいんですか？"
221020-67 = "連邦生徒会長の視察なんて、特ダネも特ダネ――"
221020-68 = "うるさい！絶好のチャンスを潰す気！？#n下手に追って機嫌を損ねられる方が困るの！"
221020-69 = "連邦生徒会長の単独インタビューなんて、#n1年前から申請しても通るかどうかなのよ！？"
221020-70 = "この案件でクロノスチャンネルの最高再生数を更新できるかも……！"
221020-72 = "……これで一息つけましたね。"
221020-73 = "[s3] \"助けてくれてありがとう。\"\n[s4] \"おかげで窮地を抜けられたよ……。\""
221020-76 = "いえいえ。#nクロノススクールの皆さんの熱意には、調停室長も頭を抱えていましたから。"
221020-77 = "良い機会ですし、ゆっくりお話しできそうですね。"
221020-78 = "[ns5] \"それはそうと、一緒に来て大丈夫だったの？\"\n[ns6] \"玉について聞くだけなら、私一人でもよかったのに。\""
221020-81 = "あら、私と一緒では居心地が悪かったですか？"
221020-82 = "自分の立場をもっと考えるべきでしたね……#n先生に負担をかけてしまい――"
221020-83 = "[s] \"そうじゃなくって！\""
221020-84 = ""
221020-87 = "[ns7] \"仕事がいつも忙しいでしょ？\"\n[ns8] \"無理やり時間を作らせちゃったかなって。\""
221020-90 = "常に忙しいのは否定しませんが、座りっぱなしでは健康に悪いですから。"
221020-91 = "こうやって外の空気を吸うための「口実」があると、気分転換がしやすいんです。"
221020-92 = "それに、オデュッセイアは海洋学園ならではの趣があって、#n見ているだけでも楽しいんですよ？"
221020-93 = "[s] \"前にもオデュッセイアに来たことがあるの？\""
221020-94 = "いえ、こうしてオデュッセイアに来るのは初めて――"
221020-95 = ""
221020-106 = "――2度目ですね。"
221020-107 = ""
221020-108 = "[ns] （なんだろう……この妙な感じ、前にも……）"
221020-109 = ""
221020-111 = ""
221020-112 = "先生。あちらをご覧ください。"
221020-113 = "まもなく、オデュッセイアの生徒会「アイランド」の旗艦、#nオリュンポス号が接岸するようです。"
221020-114 = "綱取り作業のために、陸上作業員が[ruby=がんぺき]岸壁[/ruby]で待機しています。"
221020-115 = ""
221020-116 = "接岸準備！艦内常時閉鎖！"
221020-117 = ""
221020-118 = "陸上作業員配置確認！"
221020-119 = "[ruby=げんもん]舷門[/ruby]位置、前へならえ！"
221020-120 = ""
221020-121 = "前部ブレストライン！引いて保持！そのままだと持ってかれるぞ！"
221020-122 = ""
221020-124 = ""
221020-125 = ""
221020-126 = "[ns] \"ずいぶん緊張感があるね。\""
221020-127 = "あれが最適化されたやり方なのではないでしょうか？"
221020-128 = "巨大な船を動かすには、寸分の狂いもない動きが求められますから。"
221020-129 = "なにせ、船を繋いでいる係留索の張力は数十トンに及びます。#n切れてしまえば大事故になりかねません。"
221020-130 = "[s] \"そう、だよね……。\""
221020-131 = "……先生が懸念されていることも分かります。#nあれだけ人数がいれば、空気に馴染めない生徒がいるかもしれない――"
221020-132 = "ですが、それは学園の領分です。#n連邦生徒会長であっても安易に介入はできません。"
221020-133 = ""
221020-135 = ""
221020-136 = ""
221020-137 = "シャーレの先生なら、可能かもしれませんが。"
221020-140 = ""
221020-141 = "オリュンポス号、着岸！"
221020-142 = "作業完了。陸上作業員、配置解除。"
221020-143 = "配置解除！お疲れさまでした！"
221020-145 = ""
221020-146 = ""
221020-147 = ""
221020-148 = "は、初めまして、連邦生徒会長！#n本日、会長の警護を担当させていただく、トライデントの[ruby=こもり]小森[/ruby]スミカであります！"
221020-149 = "こ、このたびは我が校へご来訪くださり、大変なご負担――#nじゃなくて、光栄であります！"
221020-150 = "下船されるその時まで、身辺警護は我らトライデントにお任せください！"
221020-151 = "小森さん、ありがとうございます。"
221020-152 = "[USERNAME]先生も、ご一緒してよろしいでしょうか。"
221020-153 = "え、あっ、そちらは……シャーレの[USERNAME]先生ですね！"
221020-154 = ""
221020-156 = ""
221020-157 = "……[USERNAME]先生！？"
221020-158 = "[ns9] \"また会ったね。\"\n[ns10] \"前に万魔殿と一緒の時に会ったよね？\""
221020-161 = "あっ、あう、ああっ……！"
221020-162 = "どっ、どうして先生がオデュッセイアに……？"
221020-163 = "ま、まさか……先生の乗っていた船を海賊船だと勘違いして攻撃した件ですか……？#nそれで直々に抗議を――"
221020-164 = "[s] \"あの時のことは大丈夫だって……。\""
221020-165 = "はいっ、それは承知しています！#n承知していますが……。"
221020-166 = ""
221020-168 = ""
221020-169 = ""
221020-170 = "……ほんと～に、あの件では……ないですよね？"
221020-171 = "[s] \"本当に本当だよ。\""
221020-172 = ""
221020-174 = ""
221020-175 = ""
221020-176 = ""
221020-177 = "そ、それなら良かったです……。"
221020-178 = "あの件については、存在しない敵船に発砲して砲弾を無駄にした、と#n副部長に大目玉を食らったばかりでして。"
221020-179 = "いま以上に減点を重ねると、ひじょ～にマズくて――"
221020-180 = "――はっ！これは良い機会なのでは……？"
221020-181 = "本日の当直である、この小森スミカが！お二人を全力でエスコートいたします！#nそ、それで、その……別に見返りというわけじゃないんですが……#nお帰りになる前に「今日の当直はとても親切だった」と一言いただけると～……えへっ！"
221020-182 = "小森さん、タラップを昇る時に注意すべきことはありますか？"
221020-183 = "特にありません！どうぞお進みください！"
221020-184 = ""
221020-186 = ""
221020-187 = "連邦生徒会長、ならびにシャーレの先生が乗船されます！"
221020-193 = "（初めて目にしたオデュッセイアの姿は、#n船というよりも巨大な海上都市のように感じられた）"
221020-194 = "（幾層もの艦橋が高層ビルのようにそびえ立ち、#n長期間の航海を終えた後にも関わらず、すべてが白く輝いていた）"
221020-195 = ""
221020-196 = "[ns11] \"これが……船なの？\"\n[ns12] \"数千人が住めそうな規模だけど……。\""
221020-199 = "もちろんですとも！#n速度はあまり出ませんが、はるか昔からキヴォトスの大海原を航海してきた、#nオデュッセイアの旗艦であります！"
221020-200 = "実は私も乗るのは初めてですけど……。"
221020-201 = ""
221020-204 = ""
221020-205 = ""
221020-206 = ""
221020-207 = ""
221020-208 = "……あれ？"
221020-209 = "これはこれは。"
221020-210 = "この仰々しい[ruby=かんえつしき]観閲式[/ruby]も歓迎行事の一つですか？"
221020-211 = "そ、その……私もオリュンポスに乗船するのは初めてで勝手が分からないのですが……。"
221020-212 = "皆さん下がってください！#nお二人の警護は私たちトライデントの担当です！"
221020-216 = "艦長、入校。"
221020-217 = ""
221020-220 = "艦長、入校！"
221020-222 = "[ns] \"艦長……？\""
221020-227 = "[ns] \"あの2人が……。\""
221020-228 = "会長職、副会長職に相当する「艦長」と「副長」なのでしょう。"
221020-229 = "ふふっ……想像以上に、優秀そうですね。"
221020-230 = ""
221020-233 = "前方に対し、[ruby=ささげつつ]捧げ銃[/ruby]！"
221020-234 = ""
221020-240 = ""
221020-241 = ""
221020-242 = "お会いできて光栄です、連邦生徒会長。#n……そして、[USERNAME]先生。"
221020-243 = "私はアイランドの部長を務める、#n[ruby=うみじ]海路[/ruby]ミナトと申します。"
221020-244 = "船まで、ご足労をおかけしました。"
221020-245 = "いえ、無理な要請をしたのはこちらですから。"
221020-246 = "お会いできて嬉しいです、海路艦長。"
221020-247 = "そちらは――"
221020-248 = "アイランドの副部長を務めます、#n[ruby=ともした]灯下[/ruby]アミです。"
221020-249 = "ご多忙にも関わらず、貴重なお時間をいただきありがとうございます。"
221020-250 = "……なるほど、そうでしたか。"
221020-251 = "初めまして、灯下副長。本日はどうぞよろしくお願いいたします。"
221020-252 = "そして、こちらは――"
221020-253 = ""
221020-255 = ""
221020-256 = ""
221020-257 = "[ns13] \"シャーレの先生です。\"\n[ns14] \"これからよろしく！\""
221020-260 = ""
221020-261 = "……あなたが。"
221020-262 = "噂には聞いていますよ。#n連邦生徒会長直属の超法規的組織――シャーレの[ruby=・]大[/ruby][ruby=・]人[/ruby]。"
221020-263 = ""
221020-265 = ""
221020-266 = ""
221020-267 = "初めまして、[USERNAME]先生。"
221020-268 = "オデュッセイア海洋高等学校へのご来校を心より歓迎いたします。"
221020-270 = "次回;海の禁忌"
