[translation]
221020-1 = "제2화;올림포스 호의 귀환"
221020-4 = "D.U. 아오하마 항 입구"
221020-5 = "안녕하세요, 크로노스 채널의 시청자 여러분! 크로노스 보도부의 카자마키 마이입니다."
221020-6 = "오늘 <카자마키 마이의 시사 분석> 채널에서는 4개월 간의 원양 항해를 마치고 D.U.로 복귀한 오디세이아 해양학원의 선단을 취재하기 위해 직접 현장에 나왔는데요!"
221020-7 = "선단의 입항이 예고된 아오하마 항에는, 오랜만에 모습을 드러낸 오디세이아의 학생들을 보기 위해 많은 시민들이 몰려들어 있습니다."
221020-8 = "그리고 항만관리국의 높으신 분들과…… 아, 총학생회 임원들의 모습도 보이네요!"
221020-14 = "저기, 저기요! 크로노스 채널입니다! 잠깐 인터뷰 좀—"
221020-19 = "치잇…… 말 한 번 걸어주면 어디 덧나나?"
221020-20 = "흠, 흠. 여하튼."
221020-21 = "여러분도 알고 계시겠지만, 오디세이아 해양학원은 해양 활동에 특화된 학원이기 때문에, 한 번 항해를 떠나면 최소 1년 간은 육지로 돌아오지 않고 바다 위에서 학사 일정을 소화하는 것으로도 유명한데요."
221020-22 = "그런데 이번에는 어째서인지 출항한지 반년 밖에 지나지 않았는데, 남은 항해 일정을 갑자기 취소하고 D.U.로 돌아왔다고 합니다!"
221020-23 = "오디세이아 학원이 갑작스럽게 항해를 중단하고 육지로 돌아온 이유는 무엇일까요?"
221020-24 = "아직까지 학원의 공식 입장 발표는 없었기에 자세한 내막은 알 수 없지만, 소문에 의하면 샬레의 선생님이 오디세이아 학원의 방문을 공식적으로 요청했다고 합니다."
221020-25 = "그 말인 즉, 오디세이아 학원에 샬레가 수사해야 할 만큼 심각한 사건이 발생했다는 뜻일까요?"
221020-26 = "그도 아니라면 단순히 선생님의 변덕으로 일어난 해프닝에 불과한 걸까요?"
221020-30 = "앗. 말씀드리는 순간, [USERNAME] 선생님이 모습을 드러냈습니다!"
221020-35 = "안녕하세요, [USERNAME] 선생님! 크로노스 보도부의 카자마키 마이입니다!"
221020-36 = "[s1] \"안녕, 마이.\"\n[s2] \"역시 소란스러운 장소에는 빠지지 않는구나……\""
221020-39 = "물론이죠! 키보토스 각지의 화제와 소문을 그 누구보다도 빠르게 전달해 드리는 크로노스 학원 보도부니까요."
221020-40 = "그나저나 선생님. 이번 오디세이아 학원의 귀환에 선생님이 관여하셨다는 소문이 정말 사실인가요?"
221020-41 = "[s] \"관련이 있다고 해야 하나, 없다고 해야 하나……\""
221020-42 = "역시! 특종의 예감은 빗나가는 법이 없네요!"
221020-43 = "샬레의 선생님께서 직접 관여하실 정도라면, 오디세이아 학원에 뭔가 신경 쓰이는 문제가 있다는 뜻이겠죠?"
221020-44 = "일반 학생의 고민 상담 요청인가요? 아니면 동아리 간의 다툼? 그도 아니라면 오디세이아 [ruby=아일랜드]학생회[/ruby]와의 비밀스러운 정치적 회합이라던가—"
221020-45 = "설마, 요새 인터넷에서 소문이 자자한 도시 [ruby=로어]괴담[/ruby]과 관련된 일은 아니겠지요?"
221020-46 = "[s] \"저, 그게 그러니까……\""
221020-47 = "[USERNAME] 선생님을 너무 곤란하게 만들지 말아주시겠어요, 카자마키 양?"
221020-50 = "선생님께서는 여러 학생의 고민 상담을 들어주고 계신만큼, 많은 비밀도 함께 품고 계시니까요."
221020-51 = "취재에 열정적인 것은 좋지만, 자칫 다른 사람을 곤란하게 한다면 본말이 전도되지 않겠어요?"
221020-52 = "켁…… 초, 총학생회장?!"
221020-53 = "서, 설마…… 오늘 오디세이아의 환영 행사에는 총학생회장께서도 참가하실 예정이었나요?"
221020-54 = "네. 무슨 문제라도 있나요?"
221020-55 = "그, 그건 아니지만…… 평소에는 업무 때문에 총학생회 건물 밖으로도 잘 나오지 않는 총학생회장님이, 이런 학원 행사에 직접 참여하신다니."
221020-56 = "이건 특종 이상의 사건이라……"
221020-57 = "후후. 뭔가 묻고 싶은 게 잔뜩 있는 표정이네요."
221020-58 = "혹시 괜찮으시다면 행사가 끝난 뒤에, 간단한 인터뷰 자리라도 마련해 드릴까요?"
221020-59 = "……혹시 또 모르죠. 기분이 내킨다면, 다른 곳에서는 이야기한 적 없는 아주 사적인 이야기를 들려드릴 수도 있을지도. 후훗."
221020-60 = "네, 네! 물론이죠! 부디……!"
221020-61 = "그럼 지금은 선생님과 나눌 이야기가 있어, 잠시 실례하겠습니다."
221020-66 = "마이 선배. 저거 안 쫓아가도 괜찮겠어요?"
221020-67 = "총학생회장의 순행이라면 어지간한 기사보다 더 특종감일텐데—"
221020-68 = "시끄러워! 괜히 총학생회장의 심기를 그르쳐서 단독 인터뷰 기회를 잃을 셈이야?"
221020-69 = "총학생회장의 단독 인터뷰는 1년 전에 신청해도 허가가 날까 말까 한 엄청난 기회라고!"
221020-70 = "어쩌면 이번 인터뷰로 크로노스 채널의 최다 조회수 기록을 갱신할 수 있을지도……"
221020-72 = "후후…… 이걸로 한시름 놓았네요."
221020-73 = "[s3] \"도와줘서 고마워.\"\n[s4] \"덕분에 곤경을 면할 수 있었네……\""
221020-76 = "아닙니다. 안 그래도 최근 크로노스 학원 보도부의 여러분들이 의욕이 지나친 나머지, 조정실장이 개인적으로 어려움을 호소하고 있었거든요."
221020-77 = "덕분에 크로노스 학원의 학생들과 느긋하게 이야기할 기회가 생겼네요."
221020-78 = "[ns5] \"그런데 이렇게 같이 와도 괜찮은 거였어?\"\n[ns6] \"공의 출처를 묻는 거라면 나 혼자도 괜찮았는데.\""
221020-81 = "어머, 역시 저와 함께 있는 건 불편하셨나요?"
221020-82 = "저도 참. 제 자리가 갖는 부담감을 미리 고려 했어야 했는데…… 선생님께 의도치 않게 부담을 드린 모양이네요."
221020-83 = "[s] \"그, 그런 게 아니야!\""
221020-87 = "[ns7] \"다만 총학생회장은 언제나 업무로 바쁜 자리이니까.\"\n[ns8] \"나 때문에 바쁜 중에 일부러 시간을 낸 건 아닌가 해서.\""
221020-90 = "물론 총학생회의 업무가 항시 바쁜 건 부인하지 않겠습니다만, 언제나 책상 앞에 앉아만 있으면 건강을 해칠 수도 있으니까요."
221020-91 = "가끔은 순행을 핑계로 밖에 나와서 바깥 공기를 맡는 것도 꽤 기분 전환이 된답니다."
221020-92 = "특히 오디세이아 학원의 청량한 풍경에는 다른 학원에서 쉽게 느끼기 어려운, 해양 학원만의 풍취가 있어서 보는 것만으로도 꽤 즐거워요."
221020-93 = "[s] \"이전에도 오디세이아 학원에 온 적이 있어?\""
221020-94 = "아뇨. 저도 이렇게 오디세이아 학원에 직접 온 건 처음—"
221020-106 = "아니, 총학생회장이 된 이후로는 두 번째네요."
221020-108 = "[ns] (또 그 묘한 기시감이다……)"
221020-112 = "아, 저기 보세요. 선생님."
221020-113 = "곧 오디세이아의 학생회인 <아일랜드>의 기함, 올림포스 호가 정박할 예정인가 보네요."
221020-114 = "육상 요원들이 입항 절차를 밟기 위해 부두에 대기 하고 있군요."
221020-116 = "각 부서 입항 준비!"
221020-118 = "입항 요원 배치. 기재 태세 y태세에서 x태세로 전환!"
221020-119 = "현문 위치 앞으로 둘!"
221020-121 = "2호줄! 당겨 잡아! 그대로 끌려간다!"
221020-126 = "[ns] \"뭔가 기합이 바짝 들어 있네……\""
221020-127 = "그렇습니다만…… 뱃일의 특성 상 어쩔 수 없지 않을까요?"
221020-128 = "거대한 배를 동시에 움직이려면 모든 학생이 한 치의 오차도 없이 정확히 움직여야 하니까요."
221020-129 = "배를 묶고 있는 저 계류삭의 장력만 하더라도 수십 톤에 이르는지라. 실수로 줄이 끊어지는 것 만으로도 큰 사고가 발생할 수 있답니다."
221020-130 = "[s] \"그렇게 생각하니 이해가 가긴 하지만……\""
221020-131 = "물론 그 경직된 분위기에 적응하지 못하고 겉도는 학생도 존재할 수 있겠지요."
221020-132 = "하지만 이는 어디까지나 각 학원의 자치와 관련된 일이니까요. 총학생회장이라도 쉬이 간섭할 순 없습니다."
221020-137 = "하지만 샬레의 선생님이라면 가능할지도 모르겠네요."
221020-141 = "<올림포스>, 입항!"
221020-142 = "상황 끝. 입항 요원 배치 해제."
221020-143 = "배치 해제! 수고하셨습니다!"
221020-148 = "처, 처음 뵙겠습니다, 총학생회장님! #n오늘 회장님의 경호를 담당하게 된 트라이던트 당직 부원, 코모리 스미카입니다!"
221020-149 = "초, 총학생회장님께서 저희 학원을 방문해 주셔서 대단히 부담…… 아니, 영광입니다!"
221020-150 = "하선하실 때까지 총학생회장님의 신변은 저희 트라이던트가 전력을 다해 모시겠습니다!"
221020-151 = "고마워요, 코모리 양."
221020-152 = "[USERNAME] 선생님도, 함께 가시지요."
221020-153 = "에, 그리고 이쪽은…… 샬레의 [USERNAME] 선생님이시군요!"
221020-157 = "응……? [USERNAME] 선생님?!"
221020-158 = "[ns9] \"여기서 또 보네, 스미카.\"\n[ns10] \"전에 만마전과 함께 있을 때 만났었지?\""
221020-161 = "앗, 앗, 아앗……!"
221020-162 = "[USERNAME] 선생님?! 어째서 오디세이아 학원에……?"
221020-163 = "서, 설마 전에 저희가 해적인 줄 알고 선생님이 타고 계시던 배를 공격했던 일 때문에 직접 항의 차 찾아오신 건……"
221020-164 = "[s] \"그 때의 일은 괜찮다니까……\""
221020-165 = "네, 넵. 물론 선생님께서 분명 괜찮다고 말씀하셨지만요……"
221020-170 = "……정말로 그 일 때문에 방문하신 거, 아니시죠?"
221020-171 = "[s] \"정말 아니니까 안심해.\""
221020-177 = "그, 그렇다면 다행이지만요……"
221020-178 = "안 그래도 존재하지도 않는 적선과 교전하느라 포탄을 낭비했다고, 부부장에게 크게 혼이 난 터라."
221020-179 = "여기서 벌점을 조금이라도 더 받으면 정말로 위험했습니다만……"
221020-180 = "마, 마침 좋은 기회네요! 이렇게 된 이상 오늘 당직 부원인 저, 코모리 스미카가 전력을 다해 선생님과 총학생회장님을 에스코트해 드리겠습니다!"
221020-181 = "따, 딱히 대가를 바라는 것은 아닙니다만…… 돌아가시기 전에 오늘 당직 부원이 매우 친절했다고 한 말씀만 부탁드립니다…… 헤헤."
221020-182 = "코모리 양? 혹시 잔교를 건너기 전에 더 들어야 할 주의사항이 있을까요?"
221020-183 = "아, 아닙니다! 어서 들어가시지요."
221020-187 = "키보토스의 총학생회장님, 그리고 샬레의 선생님께서 승선하십니다!"
221020-193 = "(잔교를 올라 처음으로 마주한 오디세이아 학원의 풍경은 선박이라기 보다는, 움직이는 거대한 해양 도시처럼 느껴졌다.)"
221020-194 = "(여러 층으로 구성된 함교는 고층 빌딩처럼 높게 솟아 있었으며, 장기간의 항해에도 불구하고 모든 것이 흰색으로 반짝이고 있었다.)"
221020-196 = "[ns11] \"이게 진짜 움직이는 배야?\"\n[ns12] \"족히 수천명은 거주할 수 있을 것 같은 규모인데……\""
221020-199 = "물론이고 말고요. 속도는 빠르지 않지만, 먼 옛날부터 키보토스의 대양을 항해해 온 오디세이아의 기함이랍니다!"
221020-200 = "물론 저도 다른 배에서만 올려다봤을 뿐, 실제로 승선하는 건 오늘이 처음이긴 하지만……"
221020-208 = "……어, 어라?"
221020-209 = "어머나."
221020-210 = "혹시 이 위압적인 사열도 환영 행사의 일부인가요?"
221020-211 = "그, 그게…… 저도 <올림포스>에 직접 승선한 건 오늘이 처음이라 잘 모르는데……"
221020-212 = "자, 잠깐만요. 모두 물러나 주세요! #n오늘 두 분의 경호를 맡은 건 저희 트라이던트라고요!"
221020-216 = "함장 입교."
221020-220 = "함장 입교!"
221020-222 = "[ns] \"함장, 이라고……?\""
221020-227 = "[ns] \"저기 걸어오는 두 학생이……\""
221020-228 = "아마 오디세이아의 회장과 부회장에 해당하는, '함장'과 '부장'인 모양이네요."
221020-229 = "후후, 어떤 사람일지 얼굴을 봐 두고 싶었는데. 생각보다 우수해 보이는 인상이군요."
221020-233 = "전방에 대하여, 받들어 총!"
221020-242 = "만나게 되어 반갑습니다, 총학생회장님. #n……그리고 [USERNAME] 선생님."
