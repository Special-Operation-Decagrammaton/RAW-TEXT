[translation]
221020-1 = "#title;제2화;올림포스 호의 귀환"
221020-3 = "3;마이;01\n#3;a\n#wait;1000"
221020-4 = "#place;D.U. 아오하마 항 입구"
221020-5 = "3;마이;03;안녕하세요, 크로노스 채널의 시청자 여러분! 크로노스 보도부의 카자마키 마이입니다.\n#3;em;[재잘]"
221020-6 = "3;마이;00;오늘 <카자마키 마이의 시사 분석> 채널에서는 4개월 간의 원양 항해를 마치고 D.U.로 복귀한 오디세이아 해양학원의 선단을 취재하기 위해 직접 현장에 나왔는데요!"
221020-7 = "3;마이;01;선단의 입항이 예고된 아오하마 항에는, 오랜만에 모습을 드러낸 오디세이아의 학생들을 보기 위해 많은 시민들이 몰려들어 있습니다."
221020-8 = "3;마이;02;그리고 항만관리국의 높으신 분들과…… 아, 총학생회 임원들의 모습도 보이네요!\n#3;em;[반응]"
221020-9 = "#st;[0,0];instant;1;"
221020-11 = "3;마이;02\n#3;dr\n#wait;1000"
221020-13 = "2;마이;02\n4;총학생회 행정원 A;01\n#2;ar\n#2;h\n#4;h\n#wait;1000"
221020-14 = "2;마이;00;저기, 저기요! 크로노스 채널입니다! 잠깐 인터뷰 좀—\n#2;em;[!]"
221020-15 = "#st;[0,0];instant;1;"
221020-17 = "2;마이;00\n4;총학생회 행정원 A;01\n#4;em;[...]\n#2;h\n#4;h\n#wait;2500"
221020-18 = "2;마이;00\n4;총학생회 행정원 A;01\n#4;dl\n#2;h\n#4;h\n#wait;1000"
221020-19 = "2;마이;05;치잇…… 말 한 번 걸어주면 어디 덧나나?\n#2;em;[속상함]\n#fontsize;50"
221020-20 = "2;마이;99;흠, 흠. 여하튼.\n#2;m3"
221020-21 = "2;마이;00;여러분도 알고 계시겠지만, 오디세이아 해양학원은 해양 활동에 특화된 학원이기 때문에, 한 번 항해를 떠나면 최소 1년 간은 육지로 돌아오지 않고 바다 위에서 학사 일정을 소화하는 것으로도 유명한데요.\n#2;em;[재잘]"
221020-22 = "2;마이;01;그런데 이번에는 어째서인지 출항한지 반년 밖에 지나지 않았는데, 남은 항해 일정을 갑자기 취소하고 D.U.로 돌아왔다고 합니다!"
221020-23 = "2;마이;02;오디세이아 학원이 갑작스럽게 항해를 중단하고 육지로 돌아온 이유는 무엇일까요?\n#2;em;[?]"
221020-24 = "2;마이;01;아직까지 학원의 공식 입장 발표는 없었기에 자세한 내막은 알 수 없지만, 소문에 의하면 샬레의 선생님이 오디세이아 학원의 방문을 공식적으로 요청했다고 합니다."
221020-25 = "2;마이;02;그 말인 즉, 오디세이아 학원에 샬레가 수사해야 할 만큼 심각한 사건이 발생했다는 뜻일까요?"
221020-26 = "2;마이;00;그도 아니라면 단순히 선생님의 변덕으로 일어난 해프닝에 불과한 걸까요?"
221020-27 = "#st;[0,0];instant;1;"
221020-29 = "2;마이;02\n#2;em;[반응]\n#wait;1500"
221020-30 = "2;마이;00;앗. 말씀드리는 순간, [USERNAME] 선생님이 모습을 드러냈습니다!"
221020-31 = "#st;[0,0];instant;1;"
221020-33 = "2;마이;00\n#2;d\n#wait;1000"
221020-34 = "3;마이;03\n#3;a\n#3;closeup\n#wait;1000"
221020-35 = "3;마이;03;안녕하세요, [USERNAME] 선생님! 크로노스 보도부의 카자마키 마이입니다!\n#3;jump\n#3;closeup"
221020-36 = "[s1] \"안녕, 마이.\"\n[s2] \"역시 소란스러운 장소에는 빠지지 않는구나……\""
221020-39 = "3;마이;00;물론이죠! 키보토스 각지의 화제와 소문을 그 누구보다도 빠르게 전달해 드리는 크로노스 학원 보도부니까요.\n#3;em;[!]\n#3;closeup"
221020-40 = "3;마이;02;그나저나 선생님. 이번 오디세이아 학원의 귀환에 선생님이 관여하셨다는 소문이 정말 사실인가요?\n#3;closeup"
221020-41 = "[s] \"관련이 있다고 해야 하나, 없다고 해야 하나……\""
221020-42 = "3;마이;03;역시! 특종의 예감은 빗나가는 법이 없네요!\n#3;em;[재잘]\n#3;closeup"
221020-43 = "3;마이;01;샬레의 선생님께서 직접 관여하실 정도라면, 오디세이아 학원에 뭔가 신경 쓰이는 문제가 있다는 뜻이겠죠?\n#3;closeup"
221020-44 = "3;마이;02;일반 학생의 고민 상담 요청인가요? 아니면 동아리 간의 다툼? 그도 아니라면 오디세이아 [ruby=아일랜드]학생회[/ruby]와의 비밀스러운 정치적 회합이라던가—\n#3;em;[?]\n#3;closeup"
221020-45 = "3;마이;00;설마, 요새 인터넷에서 소문이 자자한 도시 [ruby=로어]괴담[/ruby]과 관련된 일은 아니겠지요?\n#3;closeup\n#3;hophop"
221020-46 = "[s] \"저, 그게 그러니까……\""
221020-47 = "#na;???;[USERNAME] 선생님을 너무 곤란하게 만들지 말아주시겠어요, 카자마키 양?\n#3;hide"
221020-48 = "3;가짜 총학생회장;01\n#3;black"
221020-49 = "3;가짜 총학생회장;01\n#3;a\n#wait;1500"
221020-50 = "3;가짜 총학생회장;01;선생님께서는 여러 학생의 고민 상담을 들어주고 계신만큼, 많은 비밀도 함께 품고 계시니까요."
221020-51 = "3;가짜 총학생회장;04;취재에 열정적인 것은 좋지만, 자칫 다른 사람을 곤란하게 한다면 본말이 전도되지 않겠어요?\n#3;em;[?]"
221020-52 = "3;마이;04;켁…… 초, 총학생회장?!\n#3;em;[?!]\n#3;shake"
221020-53 = "3;마이;06;서, 설마…… 오늘 오디세이아의 환영 행사에는 총학생회장께서도 참가하실 예정이었나요?"
221020-54 = "3;마이;06\n5;가짜 총학생회장;01;네. 무슨 문제라도 있나요?\n#3;m1\n#5;a"
221020-55 = "3;마이;06;그, 그건 아니지만…… 평소에는 업무 때문에 총학생회 건물 밖으로도 잘 나오지 않는 총학생회장님이, 이런 학원 행사에 직접 참여하신다니.\n#3;em;[땀]"
221020-56 = "3;마이;02;이건 특종 이상의 사건이라……"
221020-57 = "5;가짜 총학생회장;02;후후. 뭔가 묻고 싶은 게 잔뜩 있는 표정이네요."
221020-58 = "5;가짜 총학생회장;01;혹시 괜찮으시다면 행사가 끝난 뒤에, 간단한 인터뷰 자리라도 마련해 드릴까요?\n#fontsize;50\n#5;m4"
221020-59 = "5;가짜 총학생회장;99;……혹시 또 모르죠. 기분이 내킨다면, 다른 곳에서는 이야기한 적 없는 아주 사적인 이야기를 들려드릴 수도 있을지도. 후훗.\n#fontsize;50\n#5;em;[…]"
221020-60 = "3;마이;00;네, 네! 물론이죠! 부디……!\n#3;m2\n#3;jump"
221020-61 = "5;가짜 총학생회장;01;그럼 지금은 선생님과 나눌 이야기가 있어, 잠시 실례하겠습니다."
221020-62 = "#st;[0,0];instant;1;"
221020-64 = "5;가짜 총학생회장;01\n3;마이;00\n#5;d\n#3;h\n#5;h\n#wait;2500"
221020-65 = "3;마이;01\n#3;m3\n#3;h\n#wait;1000"
221020-66 = "3;마이;01\n5;투명;01\n#5;h\n#5;hide\n#na;크로노스 보도부원;마이 선배. 저거 안 쫓아가도 괜찮겠어요?"
221020-67 = "3;마이;01\n5;투명;01\n#5;h\n#5;hide\n#na;크로노스 보도부원;총학생회장의 순행이라면 어지간한 기사보다 더 특종감일텐데—"
221020-68 = "3;마이;05;시끄러워! 괜히 총학생회장의 심기를 그르쳐서 단독 인터뷰 기회를 잃을 셈이야?\n#3;em;[!]\n#3;jump"
221020-69 = "3;마이;06;총학생회장의 단독 인터뷰는 1년 전에 신청해도 허가가 날까 말까 한 엄청난 기회라고!"
221020-70 = "3;마이;03;어쩌면 이번 인터뷰로 크로노스 채널의 최다 조회수 기록을 갱신할 수 있을지도……"
221020-72 = "3;가짜 총학생회장;01;후후…… 이걸로 한시름 놓았네요.\n#3;a\n#3;em;[음표]"
