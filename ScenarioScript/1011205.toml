[translation]
1011205-1 = "우연한 만남"
1011205-3 = "(밖에서 일을 처리하고 돌아가는 길……)"
1011205-10 = "[ns] \"……\""
1011205-14 = "(왠지 아스나와의 모모톡이 떠올라 주위를 둘러보게 된다.)"
1011205-18 = "[ns] \"없군……\""
1011205-24 = "[ns] \"……\""
1011205-34 = "[ns] \"하긴, 그렇게 쉽게 마주칠 리 없지.\""
1011205-39 = "아앗!! 선생님이다!!!"
1011205-40 = "[s] \"바로 나오는 거냐!!\""
1011205-41 = "와, 진짜 선생님이네? 또 만났어!"
1011205-42 = "아하하! 뭐야, 이거? 운명? 그런 거?"
1011205-43 = "아스나 그냥 돌아다니고 있었는데, 왠지 이쪽으로 가면 선생님을 만날 수 있을 것 같은 느낌이 드는 거야!"
1011205-44 = "그래서 와보니, 정말 선생님이 짠!!"
1011205-45 = "[s] \"신출귀몰하구만……\""
1011205-46 = "하핫, 선생님도 깜짝 놀랐지?"
1011205-47 = "응? 아스나가 어디 있는지 알려면 줄이라도 매둬야 한다고?"
1011205-48 = "아하하! 뭐야? 줄이 있으면 좋겠어?"
1011205-49 = "[ns1] \"아니, 그냥 비유적으로……\"\n[ns2] \"농담한 거야. 농담.\""
1011205-53 = "줄이라면 여기 있으니까!!"
1011205-58 = "[ns] \"리, 리본은 왜 푸는 거야? 아스나……?\""
1011205-66 = "[wa:540]― [log=아스나 교복]쨔안-!! [wa:1000]선생님과 아스나, [wa:1170]연결되어 버렸습니다![/log]"
1011205-69 = "― [log=아스나 교복]어때?[/log]"
1011205-71 = "― [log=아스나 교복]이거라면 [wa:190]어디 있는지, [wa:750]금방 알 수 있겠지?[/log]"
1011205-74 = "[wa:1900]― [log=아스나 교복]……왜 그래? [wa:1000]그런 얼굴 하고.[/log]"
1011205-77 = "― [log=아스나 교복]응? [wa:1000]아닌……[wa:790]가? [wa:1210]반대로 했어야 [wa:730]하는 걸까?[/log]"
1011205-80 = "[ns3] \"그런 문제가 아닌 것 같은데……\"\n[ns4] \"이거 완전 산책 가는 강아지……\""
1011205-81 = "[wa:830]― [log=아스나 교복]……어라? [wa:1390]아, [wa:970]아아! [wa:790]그러네!?[/log]"
1011205-82 = "[wa:830]― [log=아스나 교복]……어라? [wa:1390]아, [wa:970]아아! [wa:790]그러네!?[/log]"
1011205-85 = "― [log=아스나 교복]……아핫, [wa:780]아하하! [wa:1190]이상해졌어![/log]"
1011205-88 = "[wa:430]― [log=아스나 교복]이거, [wa:290]정말로……[/log]"
1011205-91 = "[wa:160]― [log=아스나 교복]강아지랑 [wa:540]산책하는 것 같아![/log]"
1011205-94 = "[wa:650]― [log=아스나 교복]그럼…… [wa:1130]지금 선생님은, [wa:1610]아스나의 강아지야?[/log]"
1011205-97 = "― [log=아스나 교복]아스나의 강아지는, [/log]"
1011205-99 = "― [log=아스나 교복]멍멍- [wa:880]할 수 있을까?[/log]"
1011205-102 = "― [log=아스나 교복]후훗! [/log]"
1011205-104 = "― [log=아스나 교복]제대로 하면 [wa:620]상을 줄 테니까, [wa:1380]응?[/log]"
1011205-109 = "하하, 강아지~ 강아지 산책~"
1011205-113 = "[ns5] \"그, 아스나……\"\n[ns6] \"이게 나쁘다거나 하는 건 아닌데……\""
1011205-116 = "[ns] \"혹시 다른 학생들이 보게 되면 문제가 될 수도……\""
1011205-117 = "아, 그러려나? 흠."
1011205-121 = "하긴, 선생님을 오해할 수도 있겠다."
1011205-122 = "[s] \"이, 이해해 주는 거야?\""
1011205-123 = "응! 선생님은 강아지가 아니니까."
1011205-124 = "자, 풀어줄게~"
1011205-128 = "후후~ 재미있었다."
1011205-129 = "자, 이제 리본을 다시 매야……"
1011205-133 = "[ns] \"아스나……?\""
1011205-137 = "음…… 리본을…… 어떻게 매더라?"
1011205-138 = "아하하! 아스나 까먹었어!"
1011205-139 = "선생님 리본 맬 줄 알지?"
1011205-140 = "[s] \"그럼. 알지.\""
1011205-141 = "그럼 선생님이 대신 매주라! 자, 여기!"
1011205-142 = "[s] \"응? 내, 내가?\""
1011205-146 = "응!! 선생님이 매줘!"
1011205-147 = "어서, 어서!!"
1011205-150 = "[ns] (손이 떨려온다……)"
1011205-153 = "(아스나에게 리본 매는 법을 차근차근 가르쳐주었다……)"
