[translation]
70010010-1 = "수동기의 끝 1"
70010010-2 = "밀레니엄 엑스포 컴퓨터공학관"
70010010-3 = "그러면, 시연 시작하겠습니다!"
70010010-4 = "오늘 특별히 교류차 방문해 주신 붉은겨울 사무국 귀빈 여러분께 감사의 말씀 드립니다!"
70010010-8 = "이 몸에 걸맞은 환대, 감사하네."
70010010-9 = "붉은겨울의 학생회장이자, 미화부장이자, 학생회장이자, 서기장이자 청소부장이자, 체육부장, 선도부장, 급식부장."
70010010-10 = "그리고 이달의 최우수 푸딩 시식가로 선정된 데다 붉은겨울 과학 아카데미의 의장인 체리노 님이다!"
70010010-11 = "최첨단을 달리는 붉은겨울의 과학기술을 보다 육성하기 위해, 이번 밀레니엄 엑스포에 방문해서 영광이라네."
70010010-12 = "소개 감사합니다, 체리노 회장님! 그러면, 기다릴 것 없이 바로 소개해 드리겠습니다. 밀레니엄의 역작, 슈퍼컴퓨터 SEN 9000입니다!"
70010010-17 = "슈퍼컴퓨터라고? 컴퓨터인데 화면도 없고 자판도 없는데?"
70010010-18 = "그건 제가 이미지 인식과 음성으로 입출력하기 때문에 그렇답니다!"
70010010-24 = "안녕하십니까! 붉은겨울의 학생회장이자, 미화부장이자, 학생회장이자, 서기장이자 청소부장이자, 체육부장, 선도부장, 급식부장."
70010010-25 = "그리고 이달의 최우수 푸딩 시식가로 선정된 데다 붉은겨울 과학 아카데미의 의장인 체리노 님! 밀레니엄에 오신 것을 환영합니다."
70010010-26 = "뭐, 뭐냐?! 이것은!! 갑자기 이 몸에게 말을 걸다니?!"
70010010-27 = "심지어, 이 몸의 공식 칭호를 한 번에 듣고 기억해 냈어!"
70010010-28 = "(게다가, 체리노 회장님께서 자기소개할 때 실수하는 것도 그대로 따라 하다니,)"
70010010-29 = "(나만 할 수 있던 게 아니었군……!)"
70010010-31 = "아차차, 실례했습니다. 제가 소개한다고 하니 바로 SEN 9000이 대답해 버렸군요."
70010010-32 = "SEN 9000은 대화형 모델을 장착해서, 키보드 입력을 하지 않아도 자연스러운 말의 명령을 이해하고 대답할 수 있답니다."
70010010-33 = "SEN 9000, 시범을 보여드리자. 자신 있는 분야를 말해줄래?"
70010010-34 = "좋아요! 저는 수학 연산과, 궁금하신 사항에 대해 최대한 정확히 대답하는 걸 잘해요!"
70010010-35 = "그러면 수학부터 해볼까? 이 공식을 풀어볼래?"
70010010-37 = "으아, 수학이라면서 숫자는 거의 없네."
70010010-38 = "어머, 심지어 손으로 쓴 글씨네요. 저걸 이해할 수 있을까요?"
70010010-40 = "……."
70010010-41 = "헹, 그런 거에 대답할 수 있을 리가 없지."
70010010-42 = "우리가 없는 기술이 다른 학교에 존재할 리가 없-"
70010010-43 = "에구! 볼륨을 안 켜두고 혼자서 떠들고 있었네요. 차암!"
70010010-44 = "정답은 42입니다. 더 어려운 문제도 괜찮아요, 시연이라고 너무 봐주는 거 아니에요?"
70010010-50 = "정답-! 이 녀석, 기초적인 수준의 언어모델 학습 능력이 있어서 요새는 이렇게 장난도 치네요."
70010010-51 = "이번엔 질문에 대답해 볼래? 붉은겨울 분들도 오셨겠다, 한번 학생회장님께서 직접 질문해 보시겠어요?"
70010010-52 = "나, 나 말인가?!"
70010010-53 = "붉은겨울 교내 전체에 있는 이 몸의 동상은 몇 개지?"
70010010-54 = "어떠냐, 이런 질문은 대답 못 하겠지?"
70010010-56 = "총 199개이며, 추가로 1개가 다음 달 초에 개막할 예정입니다."
70010010-57 = "데이터는 공개 SNS 및 <붉은 곰> 인터넷판, 그리고 공개 보도자료 기반이라 오차가 있을 수 있습니다."
70010010-58 = "그리고 통계적으로 그 중 두 자릿수 이상이, 보통 그다음 주에 부서지곤 하겠지만요."
70010010-59 = "어떤가요? 도움이 되었을까요?"
70010010-60 = "단 1초도 망설이지 않고 대답했잖아……?"
70010010-61 = "정확하군요……."
70010010-63 = "그 외에도 여러 가지 재능이 있는데요, 다음에는 이걸 보시면-"
70010010-64 = "으, 응……."
70010010-72 = "시연은 여기까지! 감사합니다!"
70010010-74 = "와, 진짜 대단하다. 뭐든지 할 수 있잖아?"
70010010-75 = "밀레니엄의 기술, 엄청나구나……."
70010010-77 = "다시 한번, 참관 와주셔서 감사합니다. 붉은겨울 여러분들!"
70010010-78 = "으, 으으……."
70010010-84 = "시, 시시하군!!"
70010010-90 = "나름 재미있는 물건이지만, 위대한 붉은겨울에도 저런 건 있다네!"
70010010-91 = "심지어 우리 슈퍼컴퓨터?는 더 크고 더 따듯하지!"
70010010-92 = "(회장님, 그건 컴퓨터의 자랑거리가 아닙니다만…….)"
70010010-96 = "붉은겨울도 슈퍼컴퓨터를 운용하는군요?"
70010010-97 = "컴퓨터 연구 학회에 붉은겨울은 참여하지 않아서 전혀 몰랐어요."
70010010-98 = "그, 그야 당연히 성능이 너무 좋아서 극비 사항으로 취급하고 있기 때문이지!"
70010010-99 = "밀레니엄이 이 정도 기술로 따라왔기에 이제야 안심하고 알려주는걸세!"
70010010-100 = "대단해요! 정말 기대되네요!"
70010010-101 = "언제 한번 자네가 시간이 될 때 붉은겨울에 초대하겠네. 그때 보여주도록 하지."
70010010-103 = "그럼 다음 주 월요일에 갈게요!"
70010010-104 = "…… 어?"
70010010-105 = "그때 시간이 괜찮아서요. 마침, 근처에 볼일도 있고요!"
70010010-106 = "베일에 싸인 붉은겨울의 최첨단 기술을 보여주시면 정말 영광일 거예요! 잘 부탁드립니다!"
70010010-110 = "어, 어어! 다음 주 월요일 말이지!"
70010010-111 = "붉은겨울의 위대함을 똑똑히 보여주겠다!"
70010010-114 = "어떡하지?"
70010010-115 = "다음 주에 온다고 하는데, 슈퍼컴퓨터 없는데 어떡하지?"
70010010-116 = "체리노 회장님, 방문 시기에 맞춰서 불순분자들의 쿠데타를 유도해 보는 건 어떻습니까?"
70010010-117 = "좋은 생각이긴 하지만…… 저번에는 지나치게 성공해서 복권하기 귀찮았어. 당분간 혁명은 싫어."
70010010-118 = "으음……. 우리도 잘 찾아보면 슈퍼컴퓨터 정도는 있지 않을까? 아니면 만들면 안 될까?"
70010010-122 = "체리노 회장님, 183호 특별반에 요청한 기술 견적을 받아왔습니다."
70010010-123 = "이론 연구는 완료되었으며, 완성된 소프트웨어를 구동하는 컴퓨터의 설계도 마쳤다고 합니다."
70010010-124 = "정말?! 토모에 최고! 잘했어!"
70010010-125 = "당장 제작에 착수한다! 사무국의 권한으로 붉은겨울의 모든 자산과 인력을 총동원하겠네!"
70010010-126 = "네, 회장님. 다음이 견적서 내역입니다만, 현재 붉은겨울의 전자공학 기술을 고려할 때……."
70010010-127 = "진공관 1600억 개,"
70010010-128 = "가동에 필요한 전력 수급을 위한 발전소 27개소."
70010010-129 = "유지 보수를 위한 상주 인원 거주용의 신도시를 3개 준비해야합니다. 그리고……."
70010010-131 = "으아?"
70010010-132 = "용지 확보를 위해서 산봉우리 8개를 평탄화해야 합니다."
70010010-133 = "에엑……."
70010010-134 = "그리고 일 16시간, 휴일 없이 교대 근무에 전 인원을 투입하면,"
70010010-135 = "완공까지 약 6세기 정도 소요된다고 합니다."
70010010-136 = "……."
70010010-137 = "착수할까요?"
70010010-139 = "다음 주에 오기로 했는데 6세기나 걸리면 어떻게 보여주라는 거야!!"
70010010-143 = "에, 에취!!"
70010010-145 = "(긴장했더니 목이 마르군, 물을 한잔해야겠어.)"
70010010-149 = "(토모에 비서실장이 고생이 많군. 보안위원회가 얽히지 않아서 다행이-)"
70010010-153 = "(무, 물을 잘못 삼켰-!)"
70010010-154 = "크, 크흡!"
70010010-159 = "마리나, 방금 비웃은 건가?"
70010010-160 = "속으로 이 몸이 되지도 않는 거짓말하다가 큰일 났다고 생각한 건가?"
70010010-162 = "아, 아닙니다!! 동지!! 코, 콜록!! 그게 아니라!!"
70010010-163 = "그렇다면…… 이 몸의 수염이 떨어진 게 웃긴 건가?"
70010010-164 = "그게 아니라 무, 물이……."
70010010-165 = "무리라고? 내 지도력으로는 슈퍼컴퓨터를 만드는 건 무리라는 건가?"
70010010-167 = "(아, 안돼!! 이대로 가다간 숙청이야!!)"
70010010-168 = "물……."
70010010-172 = "'물'론 가능하다는 이야기였습니다! 사실, 보안위원회에서는 이미 준비에 착수했습니다!!"
70010010-173 = "정말이야? 아, 아니. 정말인가?!"
70010010-174 = "그렇습니다! 이 불초 마리나가 책임을 지고 다음 주가 되기 전에 꼭 마련하겠습니다!"
70010010-175 = "마리나."
70010010-176 = "네, 넵!!!"
70010010-181 = "마리나가 나의 곁에 있어서, 참으로 다행이라는 생각이 드는군."
70010010-182 = "항상 붉은겨울과 이 몸을 위해 헌신해서 고맙군."
70010010-183 = "믿고 맡기겠네. 무사히 완료된다면 <1급 수염 노동 훈장>……."
70010010-184 = "아니지, 내가 실언을 했군. 그런 훈장은 너무 작아!"
70010010-185 = "<붉은겨울 연방 영웅> 훈장을 하사하도록 하겠네!"
70010010-186 = "회장님, 맡겨주십시오!"
70010010-192 = "……. 어떡하지?"
70010010-193 = "다음 주에 온다고 하는데, 슈퍼컴퓨터 없는데 어떡하지?"
70010010-198 = "어쩌라는 거지?"
70010010-199 = "압제자인 주제에 우리 같은 근로 대중에게 도움이라도 바라는 건가?"
70010010-200 = "하하하!! 큰일났네, 진짜! 내 알 바 아니라서 다행이다!!"
70010010-201 = "개그만화 소재로 써도 돼? 웃다가 쓰러지겠네!"
70010010-202 = "선배는 개그만화 전에 마감부터 맞춰야 하고요, 마감 못 맞춘 선배도 충분히 큰일난 거예요."
70010010-203 = "낑……."
70010010-207 = "힛. 힛. 히. 제대로 망신당하겠군요. 마리나 동지, 미리 인터뷰라도 해 드릴까요?"
70010010-208 = "물 한 모금 때문에 숙청당한 보안위원장이라니, 다음 <붉은 곰> 표지 모델로 추진해 보죠."
70010010-209 = "너무 어리석은 이야기여서 논픽션이라 해도 일말의 문학적 가치가 없네요."
70010010-210 = "2점 정도 드리겠어요. 10점 만점으로요."
70010010-212 = "갑자기 웬 점수?"
70010010-213 = "평론을 기껏 해도 대부분은 충격도 받지 않는 것 같길래, 어제부터 시도해 보고 있어요."
70010010-214 = "메루리 씨의 현재 원고는 0점 정도겠네요. 완성이 되어야 작품이니까요."
70010010-215 = "나보다 더 큰일나고 재밌는 사람이 지금 앞에 서 있는데 그쪽으로 다시 말 돌려도 될까?"
70010010-217 = "얼마든지 비웃어도 좋다, 어떻게든 도와줄 수 없겠나……?"
70010010-218 = "거절한다, 압제자의 수족에 부역할 생각은 없으니까."
70010010-219 = "내가, 아니. 우리가 왜 당신의 일을 도와야 하는 거지?"
70010010-220 = "그게, 나름대로 이유가 있는데……."
70010010-221 = "너무 당황해서, 누구와 함께 같이 만들 거냐는 회장님의 질문에……."
70010010-222 = "머릿속에 떠오른 대로 너희들 전원의 이름을 댔다……."
70010010-223 = "다 같이 힘을 합쳐서 만들 거라고……."
70010010-230 = "뭐?!!!"
70010010-231 = "1점이에요 1점!! 미쳤어요, 당신?!"
70010010-232 = "물귀신이야?! 왜 우리까지 말려들게 한 건데!!"
70010010-233 = "히에에에엑!! 우리도 숙청당할 거예요!!"
70010010-235 = "우리의 이름을 댔다고? 압제하는 것도 모자라서 민중에게 실책의 책임까지 떠넘기는 건가?"
70010010-236 = "어이쿠, 연루자를 만들어서 책임을 희석하는 수법인가요. 저희가 무슨 원한이라도 샀는지?"
70010010-238 = "아, 아니야! 그게……. 당황해서 홧김에 생각나는 대로 말한 거다. 악의는 없다."
70010010-239 = "아마도……. 자주 오가면서 안면을 텄다 보니 내 멋대로 친구라고 생각했던 모양이다."
70010010-241 = "친구……?"
70010010-242 = "엥?"
70010010-244 = "이, 잊어줘……. 미안, 멋대로 이름 언급해서……."
70010010-245 = "도움을 줄 수 없다면, 회장님께 사실대로 털어놓고 너희들에게 누명이 생기지 않게 내가 책임질게."
70010010-246 = "친구라고 생각했다면, 내가 좀 더 조심했어야 했는데……. 미안."
70010010-250 = "9점……. 이에요."
70010010-251 = "야!! 너, 내 만화에는 그런 고평가 안 하잖아!"
70010010-252 = "리얼한 휴먼 스토리의 감동에 비해서 메루리 씨는 아직 멀었죠."
70010010-253 = "친구라고 생각했기에 의존하고 싶었다니. 마음 약해질 수밖에 없잖아요."
70010010-255 = "친구라고 생각하셨다니……. 우리 보안위원장님이 이렇게 귀여울 리가 없어요."
70010010-256 = "흐음. 놀랍군요? 그 마리나 위원장이 친구가 되고 싶어 했다니. 특종이 되겠는데요. 힛. 힛. 히."
70010010-258 = "역시, 친구가 아니었던 건가. 멋대로 생각해서 미안하다."
70010010-260 = "아, 아니이! 친구가 아니라는 이야기를 하려는 게 아니라!"
70010010-261 = "우리가 뭘 어떻게 도와줘야 할지 모르겠다는 그런 거지. 다들 그렇지?! 그치?"
70010010-262 = "그렇죠, 붉은겨울 전체가 달라붙어도 만드는 데 600년이 걸리는 일을 저희 다섯이서 돕는다고 한들……."
70010010-263 = "마감도 제때 못해서 지금도 밥상머리에서 작업하는 메루 선배를 빼면 네 명이겠네요."
70010010-264 = "거의 다 됐다니까!"
70010010-266 = "이케쿠라 마리나. 붉은겨울 사무국원이자 보안위원장."
70010010-267 = "압제자의 주구이자 오른팔이 우리를 '친구'라고 여긴다니."
70010010-273 = "자진하여 동지가 된 것을 환영한다, 마리나!"
70010010-274 = "도, 동지?!"
70010010-276 = "미노리 씨?!"
70010010-277 = "어라라, 이런 전개로 가다니?"
70010010-278 = "세상에 공짜 점심은 없다구요?"
70010010-279 = "부장님, 지금 이 점심 식사 공짜로 먹는 거잖아요. 주방이 파업해서 주는 공짜 음식 먹는 거면서."
70010010-280 = "그 또한 사회적 비용으로 대신 내준 거니까, 공짜는 아니겠죠?"
70010010-282 = "마리나여, 압제자의 폭정에 두려워하면서 공동의 계급 의식이 발현했군."
70010010-283 = "눈을 떴구나, 투쟁의 전선에 합류하라! 동지의 고민을 내가 덜도록 하지!"
70010010-284 = "마음은 고맙지만, 아무리 생각해도 방법이 없어……."
70010010-285 = "재료부터 시작해서 인력까지 용역부 전체를 동원해도 불가능할 텐데……."
70010010-286 = "차라리 혁명을 준비하는 것이 더 현실적이고 경제적일 것 같다만……."
70010010-287 = "체리노 회장이 원하는 게 대체 뭐길래 그래요? 여태껏 복잡한 기계 이야기만 했잖아요."
70010010-288 = "밀레니엄 엑스포에 시찰 갔을 때 본 물건이다."
70010010-289 = "질문하면 뭐든지 대답해 주는 커다란 상자 같은 컴퓨터였지."
70010010-291 = "질문에 대답하는 물건?"
70010010-292 = "뭐야, 너무 쉬운 거 아니야?"
70010010-297 = "……쉽다고?!"
70010010-299 = "[log](밀레니엄 연산과학연구부 방문 1일 전)[/log]"
70010010-301 = "마리나 위원장, 당장 내일이 밀레니엄 연산과학연구부가 방문하기로 약속한 날이다만,"
70010010-302 = "이제 와서 준비하지 못했다는 태업을 보고할 생각은 아니겠지?"
70010010-303 = "당치도 않습니다, 회장님!"
70010010-304 = "일정에 맞추어 지금 바로 시연해 드리려고 했습니다."
70010010-305 = "동지들, 붉은겨울의 최고 기술로 만든 슈퍼컴퓨터를 가지고 오게!"
70010010-311 = "바로 이것이! 체리노 회장님의 지도로 만들어진 최첨단 슈퍼컴퓨터,"
70010010-312 = "RFC 9001입니다!"
70010010-314 = "RFC……?"
70010010-315 = "<붉은겨울 연방 컴퓨터>의 약자이자, 밀레니엄의 9000보다 한 발짝 더 나아갔다는 뜻입니다!"
70010010-316 = "마리나!! 믿고 있었네!!!"
70010010-323 = "마리나 최고!!"
70010010-324 = "(으아, 체리노 회장님의 극찬……! 얼마 만이냐아아앗!!)"
70010010-325 = "흐, 흠!! 보안을 중시하였기에, 종이에 질문을 작성해서 이 투입구에 넣으시면 됩니다!"
70010010-327 = "이 녀석도 뭐든지 다 대답해 줄 수 있는 거지?"
70010010-328 = "어디 보자……. <붉은겨울의 최고 지도자는 누구인가?>"
70010010-334 = "뭐야, 고장난 거야?"
70010010-336 = "마, 말을 신중하게 하도록 설정되어 있어서 약간 시간이 걸립니다!"
70010010-337 = "잠시만 기다려주시면-"
70010010-342 = "왔다! 어디, 어디!"
70010010-343 = "<붉은겨울의 학생회장이자, 미화부장이자, 서기장이자 청소부장이자, 체육부장, 선도부장, 급식부장……"
70010010-344 = "……그리고 이달의 최우수 푸딩 시식가로 선정된 데다 붉은겨울 과학 아카데미의 의장인 체리노 님이십니다.>"
70010010-345 = "대, 대단해?! 컴퓨터인데 내 공식 직함을 완벽하게 알고 있잖아?!"
70010010-347 = "당연합니다, 회장님. 이 정도는 기본입니다!"
70010010-348 = "완벽하게 인간처럼 학습한, 초고성능 슈퍼컴퓨터니까요!"
70010010-349 = "(인간 같은 게 당연하지, 그도 그럴게…….)"
70010010-351 = "박스 안"
70010010-352 = "이러면 되겠지?"
70010010-354 = "어머, 그 긴 걸 다 기억하시네요?"
70010010-355 = "출판부에서도 일일이 쓰기 귀찮아서 공식 직함은 미리 활자판을 따로 만들었는데 말이죠."
70010010-356 = "뱅크 컷 같은 건가?"
70010010-358 = "적을 알고 나를 알면 백전백승이야. 압제자의 직함을 전부 파악하는 것은 혁명가의 기본이라고?"
70010010-359 = "쉬, 쉬잇!! 이렇게 떠들다가 박스 안에 우리가 있다는 걸 들키면 어쩌려구요!"
70010010-360 = "안심해! 183호에서 특별 설계해 온 방음 상자라 밖에서는 들릴 리 없으니까."
70010010-361 = "우리는 바깥에 설치한 마이크와 현관문에서 떼어온 외시경으로 밖을 파악하면 돼."
70010010-362 = "아무리 그래도! 이건 너무 무리수예요! 들키면 졸업 때까지 여기서 살라고 할 거예요!"
70010010-364 = "나름 아늑하고 따듯해서 아까부터 졸음도 오고 좋은데요. 힛. 힛……."
70010010-365 = "……히……."
70010010-366 = "그거, 산소 부족이잖아요?!"
70010010-367 = "애초에, 왜 이 상자에 다섯 명이나 들어가야 하는 거예요?"
70010010-369 = "한 사람이 답변할 수 있는 분야는 한계가 있으니까 그렇지."
70010010-370 = "그리고, 곤경에 처한 동지를 외면할 수는 없잖아?"
70010010-371 = "구하는 게 아니라, 눈앞에 벌어질 것이 명백한 참극을, 내버려둘 수 없다는 쪽이 맞겠죠."
70010010-372 = "이런 2점도 안 되는 계획을 할 줄 알았으면 진작에 도망쳤을 거예요!"
70010010-374 = "그게 측은지심이라는 거 아니야?"
70010010-375 = "마감도 늦었는데 소재거리 발굴이라면서 꾸역꾸역 온 작가의 말은 잘 안 들리는데요?"
70010010-376 = "윽……! 마감이란 기본적으로 단거리 달리기 같은 것이지만, 장거리 마라톤에도 대비해야 하는 법이라고."
70010010-378 = "모두 조용! 다음 질문지 들어온다!"
70010010-380 = "(안에서 다들 잘하고 있겠지?)"
70010010-381 = "(들키면 나까지 저 상자에 집어넣을지도 모른다……!)"
70010010-383 = "이번엔 엄청 어려운 질문이다! 미리 준비해 둔 엄청 어려운 수학 문제라구!"
70010010-384 = "아카데미에서 추천받은 문제니까, 어쭙잖은 성능으로는 못 풀 거다!"
70010010-386 = "(마, 망했다!! 아카데미 급의 수학 문제라고?!)"
70010010-388 = "해설지도 받아뒀으니 진정한 성능을 볼 수 있겠구나!"
70010010-393 = "회, 회장님! 물론 자신 있습니다만! 그, 뭐라고 해야 할지, 그러니까……!"
70010010-394 = "마리나? 뭔가 문제라도 있나?"
70010010-395 = "저, 사실은……!"
70010010-396 = "(역시 무리였어, 들키기 전에 차라리 이실직고하는 게 나을 것 같아!)"
70010010-397 = "제가 죽을죄를 지었-"
70010010-402 = "오! 답변이 나왔군!"
70010010-404 = "-습니……. 네?!"
70010010-406 = "어디 보자, 으음……."
70010010-407 = "잘은 모르겠지만, 모범 답안하고 똑같은데?"
70010010-408 = "엄청나게 성능 좋은 컴퓨터를 완성했구나!"
70010010-409 = "미안하네, 말을 끊었군. 마리나, 어디까지 이야기했지?"
70010010-411 = "(맞췄다고?! 그것도 이렇게나 빨리?)"
70010010-412 = "아! 그 정도의 문제를 준비해 주셔서 감사하다는 말씀을 드리려고 했습니다!"
70010010-413 = "그래? 회장으로서 시찰과 검증은 중요한 업무니까 당연한걸세! 핫핫하!"
70010010-414 = "아, 아하하하!! 하하하하!!!"
70010010-416 = "뭐예요 방금?! 미노리 씨가 직접 푼 거예요?!"
70010010-417 = "수학 문제 맞아? 숫자보다 글자가 더 많았던 것 같은데?!"
70010010-418 = "종이가 들어오는 동안에 쓰기 시작했던 것 같은데요."
70010010-420 = "그런가? 괜히 겸손한 체하려는 생각은 없지만 나름 풀 만했던 것 같은데."
70010010-422 = "심지어 정답이라니, 점수로 치자면 10점이에요!"
70010010-423 = "수학 문제 점수치고는 짜 보이지만 평점으로는 극찬이군요."
70010010-425 = "미노리 선배, 공부도 잘하고 대단해요……."
70010010-426 = "압제의 사슬은 강철 같은 의지와 불꽃 같은 지성으로 끊어내는 거니까!"
70010010-427 = "붉은겨울 최고의 요주의 인물다운 선언이군요. 힛. 힛. 히."
70010010-429 = "질문지 또 들어온다!!"
70010010-443 = "(어떻게든, 넘기고는 있는데…….)"
70010010-444 = "(뭐지, 이 알 수 없는 불안감은?)"
