[translation]
212080-1 = "第8話;千秋"
212080-3 = ""
212080-4 = "……"
212080-5 = "呼……伊呂波那傢伙……"
212080-6 = "之前麻煩事全都交給那傢伙處理，他一不在就變成我得親自處理實務了啊。"
212080-7 = "嘖，偏偏這種時候皐月又跑哪去了……！！#n最近不在位置上的次數也太多了吧！"
212080-8 = ""
212080-12 = ""
212080-13 = ""
212080-14 = "哇，居然能看到真琴前輩處理實務的樣子！"
212080-15 = "這可是獨家……"
212080-16 = "……"
212080-17 = "不過就算拍了，真的能寫成報導嗎？"
212080-18 = "因為要準備戰爭，連週刊萬魔殿都停刊了。"
212080-19 = "嗯，不知道！#n先拍下來的話，總有一天會用得到吧！"
212080-20 = ""
212080-22 = ""
212080-26 = ""
212080-28 = ""
212080-30 = ""
212080-34 = "真琴前輩，總覺得看起來好寂寞。"
212080-35 = "伊呂波醬不在，皐月前輩也不知道跑去哪裡了。"
212080-36 = "伊吹醬最近也很安靜……"
212080-37 = "唉……那個吵吵鬧鬧的萬魔殿，怎麼會變成這樣呢。"
212080-41 = ""
212080-42 = ""
212080-43 = "嗯？那是……"
212080-46 = "……是的。"
212080-47 = "……的……是。"
212080-48 = "……麻煩了。"
212080-51 = ""
212080-52 = ""
212080-55 = ""
212080-57 = ""
212080-61 = "再興委員會的書記……現在是作戰參謀了嗎。"
212080-62 = "在這種狀況下也毫不動搖呢。"
212080-63 = "不對，他好像還是最賣力的那一個……"
212080-64 = ""
212080-66 = ""
212080-67 = ""
212080-68 = "啊，你好～啊哈哈。"
212080-69 = "……千秋同學。"
212080-70 = "是～我是千秋。#n你好像講了很久的電話呢。"
212080-71 = "……啊，是的。"
212080-72 = "讓人很難開口搭話呢？哈哈。"
212080-73 = "找我有什麼事嗎？"
212080-74 = "呃，也不是特別有什麼事……"
212080-75 = ""
212080-77 = ""
212080-78 = "啊！那我可以問你一個問題嗎？#n就當作是採訪，輕鬆聊聊！"
212080-79 = "……請說。"
212080-80 = "這麼說來，我是萬魔殿的書記，翔子同學是再興委員會的書記呢！#n哇！書記組！"
212080-81 = "……"
212080-82 = "咳咳……那麼，問題來了！"
212080-83 = "翔子同學覺得現在的格黑娜怎麼樣？"
212080-84 = "……我的回答很重要嗎？"
212080-85 = "就是有種好像很重要的感覺！#n算是記者的直覺吧？"
212080-86 = "翔子同學給人一種很縝密的印象。#n像是有計畫的人？感覺很聰明！"
212080-87 = "……"
212080-88 = "你是問我怎麼看現在的格黑娜嗎？#n我的回答是這樣的。"
212080-89 = ""
212080-91 = ""
212080-92 = "再次變得偉大的格黑娜。"
212080-93 = "大家在同一個目的下前進與思考，明確知道槍口該對準何處。#n這樣的地方，才是真正偉大的格黑娜。"
212080-94 = "哦……"
212080-95 = "大家都在為了實現過去未能達成的夢想而竭盡全力。"
212080-96 = "過去的夢想……有過那種夢想嗎？"
212080-97 = "是的。聽說過去曾有征服奇普托斯的夢想。"
212080-98 = "有那種事嗎？我是第一次聽說耶。"
212080-99 = "呵呵……你不知道也沒關係。"
212080-100 = "不過我其實覺得現在的氣氛不太好耶。#n太安靜了。"
212080-101 = "本來就是要砰砰作響、到處闖點禍，才有格黑娜的樣子嘛。"
212080-102 = "你是指「不完全的自由」支配一切的那個時期吧。"
212080-103 = "是～那樣才有題材可以寫報導，也才會有獨家嘛。"
212080-104 = "千秋同學認為現在的格黑娜不如當時嗎？"
212080-105 = "呃……要說實話嗎？"
212080-106 = "……"
212080-107 = ""
212080-109 = ""
212080-110 = "現在的氣氛本身就有點僵硬，有種一切都被壓制住的感覺。"
212080-111 = "大家都看人臉色，只是服從控管……你不覺得這樣不太有趣嗎？"
212080-112 = "有趣啊……"
212080-113 = "千秋同學，你知道過去2年來，格黑娜因為那份「有趣」錯失了多少機會嗎？"
212080-114 = "咦？是這樣嗎？"
212080-115 = "那些追求「有趣」這種空洞價值的人，至今成就了什麼？"
212080-116 = "有人挖溫泉、有人破壞餐廳、有人浪費彈藥和炸彈的時候……#n格黑娜只是一直在空轉而已。"
212080-117 = "但是現在呢？#n大家已經合而為一，開始向前邁進了。"
212080-118 = "唔嗯……如果目的是戰爭的話，好像也不是什麼好事……"
212080-119 = "真琴議長應該也說過了。#n戰爭是絕對必要的。"
212080-120 = "打破腐朽的舊時代秩序，讓奇普托斯所有學園都歸屬於格黑娜旗下。#n從那一刻起，由格黑娜主導的真正秩序就會開始。"
212080-121 = "唔嗯～～～"
212080-122 = "所以說，我就是不懂為什麼需要那麼做。"
212080-123 = "彼此不同才有趣，不是嗎？#n就算三一、千年都變成格黑娜，我也不覺得會有多有趣。"
212080-124 = "所謂各學園的個性或多樣性，終究意味著力量的分散。"
212080-125 = "因為發出不同的聲音才會產生衝突。#n為了解決那些衝突，又會浪費不必要的資源。"
212080-126 = "唉唷，就是要有那些摩擦才會擦出火花、才會有獨家啊？"
212080-127 = "翔子同學真的覺得所有學園都變成格黑娜比較好嗎？#n制服也會全都變成黑色耶！"
212080-128 = "是的。因為征服奇普托斯本身就是格黑娜存在的證明──#n也是我們必須抵達的最終目標。"
212080-129 = "嗯……雖然我不這麼認為，不過最後再問一個問題吧。"
212080-130 = "翔子同學在那樣的世界裡，想做些什麼呢？"
212080-131 = "什麼？"
212080-132 = "既然你的目的這麼明確，之後應該也有想做的事吧？"
212080-133 = "我……"
212080-134 = "我要在完美的格黑娜裡，鞏固新的秩序……"
212080-135 = ""
212080-137 = ""
212080-138 = "……你沒想過嗎？"
212080-139 = "要特地解釋理所當然的事，真令人頭痛。#n採訪就到此為止吧。"
212080-140 = "啊，是嗎？好的～辛苦了！"
212080-141 = ""
212080-143 = ""
212080-144 = "哼嗯……他沒想過啊。"
212080-145 = "目的只到征服為止？#n還是說，戰爭本身才是目的……？"
212080-146 = "記者的直覺在嗶嗶作響，他好像在隱瞞些什麼？"
212080-147 = "唔嗯～～～～"
212080-148 = "我就是討厭那種無聊的世界啦。#n我投反對票。"
212080-149 = ""
212080-151 = ""
212080-152 = "前輩們……真的想打造那樣的世界嗎？"
212080-153 = ""
212080-156 = "像以前那樣傻傻地有說有笑就不行嗎……？"
212080-158 = "下一話;皐月"
