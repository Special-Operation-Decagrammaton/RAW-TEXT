212080-61 = "The Heritage League's Secretary... No, I suppose \"Operations Officer\" is a more apt title."
212080-62 = "She seems to be holding up fine."
212080-63 = "...Even though it seems like she's working the hardest..."
212080-64 = ""
212080-66 = ""
212080-67 = ""
212080-68 = "Ah, hello! Ahaha..."
212080-69 = "...Chiaki."
212080-70 = "Yup, that's me. Looks like you were on a pretty long call, huh?"
212080-71 = "...Ah, right."
212080-72 = "I didn't mean to linger around. I didn't want to interrupt your important business. Haha."
212080-73 = "Do YOU have business with me?"
212080-74 = "Um. Not in particular..."
212080-75 = ""
212080-77 = ""
212080-78 = "But actually, can I ask you one thing? Think of it as a short interview! A sound bite!"
212080-79 = "...Please do."
212080-80 = "It's kind of funny. I'm the Pandemonium Society Secretary, and you're the Heritage League Secretary! Yay! Secretary besties! Twins..."
212080-81 = "..."
212080-82 = "Ahem... Here's my question!"
212080-83 = "What is your opinion on the current state of Gehenna, Shouko?"
212080-84 = "...Does my answer matter?"
212080-85 = "Mm, I had a feeling it might! Call it...a reporter's instinct."
212080-86 = "Shouko, you seem like someone who's not only thorough, but prudent. Like a good planner—you know, a real mastermind!"
212080-87 = "..."
212080-88 = "You asked for my opinion on the current state of Gehenna, correct? Here is my answer."
212080-89 = ""
212080-91 = ""
212080-92 = "Gehenna is glorious once more."
212080-93 = "Here is a place where everyone walks, thinks, and knows where to aim their barrel, united under one goal. Glory to Gehenna."
212080-94 = "Oh..."
212080-95 = "Everyone is doing their best to fulfill a dream that we couldn't realize in the past."
212080-96 = "A past dream... Oh, we had one?"
212080-97 = "...Indeed. The old Gehenna dreamed of a full Kivotos conquest."
212080-98 = "Is that so? This is my first time hearing it."
212080-99 = "Fufu... It's not necessary for you to understand."
212080-100 = "Right, right... But lately I feel that the academy's vibe has changed. It's almost too quiet."
212080-101 = "It's almost like you need some surprise explosions and brawls for it to feel like Gehenna."
212080-102 = "You speak of a bygone era ruled by imperfect freedom."
212080-103 = "Yeah. I suppose all that ruckus made for good stories! It's hard to find a scoop nowadays."
212080-104 = "Chiaki, do you think that our glorious Gehenna is worse than the one you yearn for?"
212080-105 = "Um... Honestly?"
212080-106 = "..."
212080-107 = ""
212080-109 = ""
212080-110 = "Things feel a little too heavy now. It's like a suppressive weight's fallen on everyone's shoulders."
212080-111 = "Students are just walking on eggshells and following orders... Don't you think that lacks a certain...fun?"
212080-112 = "\"Fun\"..."
212080-113 = "Oh, Chiaki. Are you aware of how many opportunities Gehenna missed out on in the childish pursuit of \"fun\"?"
212080-114 = "Eh? I'm not sure I am..."
212080-115 = "What have those who chased the meaningless value of \"fun\" actually accomplished?"
212080-116 = "Gehenna was running in circles. We had girls digging up hot springs, blowing up restaurants, and needlessly wasting valuable ordnance."
212080-117 = "But what about now? Everyone is united and marching forward. Gehenna comes first."
212080-118 = "Hmm... That said, is attacking Kivotos really the right move?"
212080-119 = "Chairman Makoto was clear. A war is essential."
212080-120 = "Gehenna's reign of true order will begin once the old era is shattered. All academies shall fall under Gehenna's glorious flag."
212080-121 = "...Hmm... Yeah, about that..."
212080-122 = "To rephrase the question, why is that necessary, though?"
212080-123 = "Aren't things enriching because they're varied? I don't think it would be all that fun if Trinity turned into Gehenna, or if Millennium adopted our aesthetics."
212080-124 = "Retaining an individual academy's personality and diversity will only lead to a dispersion of power."
212080-125 = "Conflict arises when people are able to speak in different voices. Unnecessary resources get wasted to resolve the conflicts inherent in miscommunication."
212080-126 = "But a little conflict is how things stay interesting. Sparks pop and people like me might catch a hot scoop!"
212080-127 = "Shouko, do you really want all academies to be part of Gehenna? Everyone would be wearing the same black uniforms!"
212080-128 = "Precisely. Conquering Kivotos is Gehenna's purpose and its final destination."
212080-129 = "Hmm... Agree to disagree, but let me shoot you one more question."
212080-130 = "Shouko, where do you see yourself in this \"fully-realized\" Gehenna?"
212080-131 = "What do you mean?"
212080-132 = "You have such a strong sense of purpose. There must be something you want to do after accomplishing your dream, right?"
212080-133 = "I..."
212080-134 = "...only want to solidify a new order in the perfect, glorious Gehenna..."
212080-135 = ""
212080-137 = ""
212080-138 = "...Have you never thought about what comes after?"
212080-139 = "...My head aches from trying to explain something so obvious. No more questions. This interview is over."
212080-140 = "Ah, is that so? Okay, thank you! Feel better soon!"
212080-141 = ""
212080-143 = ""
212080-144 = "Hmm... I guess she never thought about it."
212080-145 = "...Is a final conquest the goal? Or is constant war the goal...?"
212080-146 = "My reporter sense is tingling! Maybe she's hiding something..."
212080-147 = "Hmm..."
212080-148 = "All I know is that I don't want to live in the drab, boring world she dreams of."
212080-149 = ""
212080-151 = ""
212080-152 = "...But do my upperclassmen...? Is this really what they want?"
212080-153 = ""
212080-156 = "Was laughing and gabbing with each other so bad...?"
212080-158 = "Next Episode;Satsuki"
