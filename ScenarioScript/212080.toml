212080-6 = "ที่ผ่านมาเรายกงานน่ารำคาญให้ยัยนั่นจัดการทั้งหมด แต่พอยัยนั่นหายตัวไป เราเลยต้องมาลงมือ#nทำงานภาคปฏิบัติเสียเอง"
