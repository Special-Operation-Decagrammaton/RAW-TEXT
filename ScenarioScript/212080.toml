212080-82 = "อะแฮ่ม... ถ้างั้นเริ่มคำถามเลยนะคะ!"
212080-83 = "คุณโชโกะคิดยังไงกับเกเฮนน่าในตอนนี้คะ?"
212080-84 = "คำตอบของฉันสำคัญด้วยเหรอคะ...?"
212080-85 = "อืม ฉันว่าน่าจะสำคัญนะคะ! จะเรียกว่าสัญชาตญาณนักข่าวดีมั้ยคะ?"
212080-86 = "ก็คุณโชโกะดูเป็นคนละเอียดละออและก็รอบคอบด้วย เหมือนคนที่มีแผนอยู่ในหัว? ให้ความรู้สึกว่าเป็นคนฉลาดน่ะค่ะ!"
212080-87 = "..."
212080-88 = "ถามว่าฉันคิดยังไงกับเกเฮนน่าในตอนนี้สินะคะ? คำตอบของฉันเป็นแบบนี้ค่ะ"
212080-89 = ""
212080-91 = ""
212080-92 = "เกเฮนน่าที่กลับมายิ่งใหญ่อีกครั้ง"
212080-93 = "สถานที่ที่ทุกคนเดินและคิดภายใต้เป้าหมายเดียวกัน และตระหนักอย่างชัดเจนว่าปากกระบอกปืนควร#nหันไปทางไหน นี่ละค่ะคือเกเฮนน่าอันยิ่งใหญ่อย่างแท้จริง"
212080-94 = "โอ้..."
212080-95 = "ทุกคนกำลังทำอย่างสุดกำลัง เพื่อทำให้ความฝันในอดีตที่ไม่อาจเป็นจริงกลายเป็นความจริงค่ะ"
212080-96 = "ความฝันในอดีต... เคยมีความฝันแบบนั้นด้วยเหรอคะ?"
212080-97 = "ค่ะ ได้ยินมาว่าเคยมีความฝันที่จะพิชิตคิโวทอสค่ะ..."
212080-98 = "มีเรื่องแบบนั้นด้วยเหรอคะ? ฉันเพิ่งเคยได้ยินเป็นครั้งแรกเลย"
212080-99 = "ฮุฮุ... ไม่รู้ก็ไม่เป็นไรค่ะ"
212080-100 = "อืม แต่พูดตามตรง ฉันไม่ค่อยชอบบรรยากาศตอนนี้เท่าไรค่ะ เพราะว่ามันเงียบเกินไป"
212080-101 = "ปกติต้องมีอะไรระเบิดตูมตาม แล้วก่อเรื่องกันไปทั่วบ้างถึงจะสมเป็นเกเฮนน่านี่นา"
212080-102 = "หมายถึงยุคที่ถูกปกครองด้วยอิสรภาพอันไม่สมบูรณ์สินะคะ"
212080-103 = "ค่า แบบนั้นถึงจะมีเรื่องให้เขียนข่าว แล้วก็มีสกู๊ปพิเศษออกมาบ้างค่ะ"
212080-104 = "คุณจิอากิคิดว่าเกเฮนน่าตอนนี้ด้อยกว่าตอนนั้นเหรอคะ?"
212080-105 = "เอ่อ... ให้ตอบตามตรงเหรอคะ?"
212080-106 = "..."
212080-107 = ""
212080-109 = ""
212080-110 = "ตอนนี้บรรยากาศค่อนข้างบีบบังคับ เหมือนทุกอย่างถูกกดเอาไว้"
212080-111 = "ทุกคนเอาแต่ระวังสายตาคนอื่นแล้วทำตามการควบคุม... มันไม่น่าสนุกเท่าไรเลยนี่คะ?"
212080-112 = "พูดถึงความสนุกสินะคะ..."
212080-113 = "คุณจิอากิ รู้หรือเปล่าคะว่าเพราะ 'ความสนุก' นั่นน่ะ เกเฮนน่าถึงได้พลาดโอกาสไปมากแค่ไหนตลอด#n2 ปีที่ผ่านมา"
212080-114 = "เอ๋? เป็นอย่างนั้นเหรอคะ?"
212080-115 = "คนที่ไล่ตามคุณค่าอันว่างเปล่าอย่างความสนุก ตลอดเวลาที่ผ่านมาทำอะไรสำเร็จบ้างเหรอคะ?"
212080-116 = "ระหว่างที่บางคนขุดออนเซ็น บางคนทำลายร้านอาหาร และบางคนผลาญกระสุนกับระเบิดเล่น เกเฮนน่าก็เลยได้แต่ย่ำอยู่กับที่ค่ะ"
212080-117 = "แต่ตอนนี้เป็นยังไงคะ? ทุกคนรวมเป็นหนึ่งและเริ่มก้าวไปข้างหน้าแล้ว"
212080-118 = "อืม... แต่ถ้าเป้าหมายนั้นคือสงคราม ฉันก็ไม่คิดว่าจะเป็นเรื่องดีเท่าไร..."
212080-119 = "ท่านประธานมาโคโตะคงพูดไว้แล้วนี่คะ ว่าสงครามเป็นสิ่งจำเป็นอย่างยิ่ง"
212080-120 = "เมื่อโค่นล้มระเบียบของยุคเก่าอันเน่าเฟะ และทุกโรงเรียนในคิโวทอสตกอยู่ภายใต้ธงของเกเฮนน่า เมื่อนั้นระเบียบที่แท้จริงที่นำโดยเกเฮนน่าก็จะเริ่มต้นขึ้นค่ะ"
212080-121 = "อืมมมม~~~"
212080-122 = "คือฉันไม่เข้าใจว่าทำไมถึงต้องทำแบบนั้นน่ะค่ะ"
212080-123 = "ต้องมีความแตกต่างกันมันถึงจะสนุกไม่ใช่เหรอคะ? ต่อให้ทรีนิตี้กลายเป็นเกเฮนน่า หรือต่อให้มิลเลเนียมกลายเป็นเกเฮนน่า ฉันก็ไม่คิดว่ามันจะสนุกเท่าไรเลย"
212080-124 = "สิ่งที่เรียกว่าเอกลักษณ์หรือความหลากหลายของแต่ละโรงเรียน ท้ายที่สุดก็หมายถึงการกระจายอำนาจค่ะ"
212080-125 = "เพราะต่างฝ่ายต่างส่งเสียงไม่เหมือนกัน ก็เลยเกิดความขัดแย้ง และต้องสิ้นเปลืองทรัพยากรที่ไม่จำเป็น#nอีกครั้งเพื่อแก้ความขัดแย้งนั้น"
212080-126 = "โธ่ ก็ต้องมีการปะทะเสียดสีกันบ้าง ถึงจะเกิดเปลวไฟและมีสกู๊ปพิเศษไม่ใช่เหรอคะ?"
212080-127 = "คุณโชโกะชอบจริงๆ เหรอคะ ถ้าทุกโรงเรียนกลายเป็นเกเฮนน่า? งั้นชุดนักเรียนคงเป็นสีดำกันหมดเลยนะ!"
212080-128 = "ค่ะ เพราะการพิชิตคิโวทอสคือเครื่องพิสูจน์การมีอยู่ของเกเฮนน่าในตัวมันเอง และเป็นจุดหมายสูงสุดที่พวกเราต้องไปให้ถึง"
212080-129 = "อืม... ยังไงก็ไม่ใช่ความคิดของฉันอยู่ดี แต่ถ้างั้นขอถามอีกข้อค่ะ"
212080-130 = "คุณโชโกะ ถ้าโลกกลายเป็นแบบนั้นแล้ว คุณอยากทำอะไรเหรอคะ?"
212080-131 = "คะ?"
212080-132 = "ก็ในเมื่อมีเป้าหมายแรงกล้าขนาดนั้น หลังจากบรรลุแล้วก็น่าจะมีสิ่งที่อยากทำต่อไม่ใช่เหรอคะ?"
212080-133 = "ฉัน..."
212080-134 = "ฉันจะทำให้ระเบียบใหม่ในเกเฮนน่าอันสมบูรณ์แบบมั่นคงยิ่งขึ้น แล้วก็..."
212080-135 = ""
212080-137 = ""
212080-138 = "ไม่เคยคิดไว้เหรอคะ...?"
212080-139 = "การพยายามอธิบายสิ่งที่แน่นอนอยู่แล้วมันน่าปวดหัวนะคะ จบการสัมภาษณ์ไว้เท่านี้เถอะค่ะ..."
212080-140 = "อ๊ะ เอาอย่างนั้นเหรอคะ? ค่า~ ขอบคุณที่สละเวลาค่ะ!"
212080-141 = ""
212080-143 = ""
212080-144 = "อืม... ยังไม่เคยคิดไว้สินะ"
212080-145 = "เป้าหมายมีแค่การพิชิต...? หรือว่าเป้าหมายคือตัวสงครามเอง...?"
212080-146 = "สัญชาตญาณนักข่าวกำลังส่งเสียงปิ๊งๆ เลย รู้สึกเหมือนกำลังปิดบังอะไรอยู่ด้วย?"
212080-147 = "อืม~~~~"
212080-148 = "เอาเป็นว่า ฉันไม่ชอบโลกน่าเบื่อแบบนั้นหรอกนะคะ ขอเห็นต่างค่ะ"
