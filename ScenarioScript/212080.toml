[translation]
212080-1 = "第8話;チアキ"
212080-4 = "……。"
212080-5 = "ふぅ……。"
212080-6 = "イロハがいなくなったせいで私自ら実務をやる羽目になるとは。"
212080-7 = "それでまたサツキはどこをほっつき歩いているのだ……！#n居ないことがあまりにも多すぎる！"
212080-14 = "わあーっ！マコト先輩が実務してる！"
212080-15 = "これは特ダネ――"
212080-16 = "……。"
212080-17 = "でも、撮ったところで記事に使えるのかな？"
212080-18 = "週刊万魔殿は休刊になっちゃったし……。"
212080-19 = "うーん、分かんない！とりあえず撮っとけば、いつか使えるでしょ！"
212080-34 = "……なんか、寂しそう？"
212080-35 = "イロハちゃんは出ていっちゃうし、サツキ先輩もあんまりいないし。"
212080-36 = "イブキちゃんも元気ないし……。"
212080-37 = "はあ……あんなに騒がしかった万魔殿が、どうしてこんなことに。"
212080-43 = "ん？あれは……。"
212080-46 = "――はい。"
212080-47 = "～で、……ます。"
212080-48 = "――ください。"
212080-61 = "ゲヘナ再興委員会の書記……いえ、今や作戦参謀、ですか。"
212080-62 = "この状況でもまるで動じてませんね。"
212080-63 = "むしろ一番張り切ってるような……。"
212080-68 = "あ、こんにちは～あはは。"
212080-69 = "……チアキさん。"
212080-70 = "何か、大事なお電話だったんですか？"
212080-71 = "……そうですね。"
212080-72 = "ちょ～っと、途中で声かけにくい雰囲気でしたよ？"
212080-73 = "何かご用でしょうか？"
212080-74 = "いえいえ、別にそういうわけじゃないんですけど……。"
212080-78 = "せっかくですから、1つ、聞いてもいいですか？#n軽く雑談！みたいな？"
212080-79 = "……どうぞ。"
212080-80 = "あ。そういえば私たち「書記ーズ」ですよね！#n万魔殿と、ゲヘナ再興委員会の書記で！"
212080-81 = "……。"
212080-82 = "こほん……では質問です！"
212080-83 = "ショウコさんは、今のゲヘナをどう思いますか？"
212080-84 = "……なぜ、そんなことを？"
212080-85 = "な～んか重要そうな気がするんですよね。記者の勘ってやつですかね！"
212080-86 = "ほら、ショウコさんって何と言うか、計画的な人……頭の切れる人？って感じなので！"
212080-87 = "……。"
212080-88 = "今のゲヘナをどう思うか、でしたね。"
212080-92 = "偉大になったと思います。再び。"
212080-93 = "皆の考えが1つに束ねられ、同じ目的に向けて歩いている。#n銃口を向ける相手を確かに認識している今こそ、真に偉大なゲヘナです。"
212080-94 = "おお……。"
212080-95 = "かつて到達しえなかった夢を現実にするため、皆が全力を尽くしていますから。"
212080-96 = "……ん？そんな夢ありましたっけ？"
212080-97 = "ええ。キヴォトスをゲヘナに染め上げるという夢があったと聞いています。"
212080-98 = "へぇ……初耳ですね。"
212080-99 = "ご存じでなくとも結構です。"
212080-100 = "うーん……でも、私の意見はちょっと違うと言いますか……。#n正直、この空気はあんまり好きじゃないんですよね。静かすぎて。"
212080-101 = "そこら中でドッカンドッカンして、あっちこっちで事件が起きてる！#nそれでこそゲヘナって感じしません？"
212080-102 = "「不完全な自由」が支配していた頃の話ですね。"
212080-103 = "それはちょっと分かんないですけど……前の方が記事のネタに困らなかったので。"
212080-104 = "チアキさんは、今のゲヘナに反対なのですか？"
212080-105 = "それは……えっと……。"
212080-106 = "……。"
212080-110 = "重い空気が全部を押さえつけてる感じがします。"
212080-111 = "みんな周りの顔色をうかがって、言われるままに統制に従って……#nこういうの、あんまり面白くなくないですか？"
212080-112 = "面白さ、ですか……。"
212080-113 = "ご存じですか？#nその「面白さ」のせいで、ゲヘナは2年もの間、機会損失を生み続けてきたんです。"
212080-114 = "えっ？そうなんですか？"
212080-115 = "「面白さ」などという空虚な価値を追い求めた者は、何を成し遂げましたか？"
212080-116 = "あるいは温泉を掘り、あるいは食堂を壊し、あるいは弾薬や爆弾を浪費している間。#nゲヘナという巨大なエンジンは空転していただけです。"
212080-117 = "ですがようやく全ての歯車が嚙み合いました。#n動力は余すことなくゲヘナの端々まで伝わり、その一歩を踏み出すのです。"
212080-118 = "だからって、キヴォトスに攻撃するってのはどうなんでしょう……？"
212080-119 = "必要不可欠な事です。マコト議長も仰っていたでしょう。"
212080-120 = "全ての学園がゲヘナの旗を掲げる時、ゲヘナ主導の真なる秩序が始まるのだと。"
212080-121 = "う～～ん……。"
212080-122 = "それ、やらなきゃダメなんです？"
212080-123 = "みんな違うから良いんだと思うんです。#nトリニティやミレニアムがゲヘナになっても面白くないと思いますよ。"
212080-124 = "個性や多様性とは、力の分散に帰結します。"
212080-125 = "異なる声は摩擦を生み、衝突の解消にはコストがかかります。#n何かを生むためにではなく、マイナスをゼロに戻すためにエネルギーが使われる。"
212080-126 = "いやいや、摩擦があるから特ダネが生まれるんですよ！"
212080-127 = "ショウコさん、本当に全部の学園をゲヘナにしたいんですか？"
212080-128 = "もちろん。それがゲヘナの存在証明であり、私たちの到達すべき最終目標ですから。"
212080-129 = "私の考えとは異なりますけど……じゃあ、最後にもう1つだけ質問。"
212080-130 = "ゲヘナ一色にして、ショウコさんは何がしたいんですか？"
212080-131 = "……はい？"
212080-132 = "そこまで目的意識が強いなら、その先にやりたいことがあるんじゃないですか？"
212080-133 = "私は……。"
212080-134 = "完璧なゲヘナで、新たな秩序を盤石なものにして……。"
212080-138 = "……まさか、考えてないんですか？"
212080-139 = "……インタビューはここまでにしましょう。#n当然のことをわざわざ説明しているほど暇ではないので。"
212080-140 = "それは残念。ご協力ありがとうございました～"
212080-144 = "……考えてなかったのかな。"
212080-145 = "ってことは……手段と目的が逆転してる？#nそれとも、攻撃すること自体が目的……？"
212080-146 = "なんか怪しいんですよね……記者としての勘がビリビリしっぱなしです。"
212080-147 = "うーーーん……。"
212080-148 = "まあ何にせよ、私の好みじゃなさそうだなぁ。"
212080-152 = "先輩たちは……本当に……？"
212080-156 = "前みたいな万魔殿じゃダメだったのかな……。"
212080-158 = "次回;サツキ"
