212080-78 = "อ๊ะ ถ้างั้นขอถามอะไรสักข้อได้มั้ยคะ? จะเรียกว่าสัมภาษณ์ก็ได้ แบบสบายๆ ค่ะ!"
212080-79 = "เชิญพูดมาได้เลยค่ะ..."
212080-80 = "จะว่าไปแล้ว ฉันเป็นเลขาของแพนเดโมเนียม โซไซตี้ ส่วนคุณโชโกะก็เป็นเลขาของคณะกรรมการฟื้นฟู#nนี่คะ! ว้าว! แก๊งเลขา!"
