[translation]
212080-1 = "제8화;치아키"
212080-4 = "……."
212080-5 = "후…… 이로하 녀석……."
212080-6 = "그간 귀찮은 일은 모두 녀석에게 일임했었는데, 사라지니 이제 이 몸이 직접 실무를 해야 하는 상황이 발생하는군."
212080-7 = "큭, 하필 이럴 때 사츠키는 또 어딜 간 것이냐……!! 최근 자리를 비우는 경우가 너무 많지 않나!"
212080-14 = "와, 마코토 선배가 실무를 하는 모습이라니!"
212080-15 = "이건 특종……"
212080-16 = "……."
212080-17 = "그런데, 찍어도 기사로 쓸 수는 있으려나?"
212080-18 = "전쟁 준비로 주간 만마전도 휴간인데."
212080-19 = "……음, 모르겠다! 일단 찍어두면 언젠가라도 쓸 일이 있겠지!"
212080-34 = "……마코토 선배, 왠지 외로워 보이네요."
212080-35 = "이로하 쨩도 없고, 사츠키 선배도 어딘가로 가버렸고."
212080-36 = "이부키 쨩도 요즘 조용하고……."
212080-37 = "하아…… 그 시끄럽던 만마전이 어쩌다가 이렇게 되었담."
212080-43 = "응? 저건……"
212080-46 = "……네."
212080-47 = "……습니다. ……니다."
212080-48 = "……십시오."
212080-61 = "재흥위의 서기…… 이제는 작전참모인가."
212080-62 = "이 상황에도 끄떡없네요."
212080-63 = "아니, 뭔가 제일 열심히 하는 것 같은……."
212080-68 = "아, 안녕하세요~ 아하하."
212080-69 = "……치아키 씨."
212080-70 = "네에, 치아키입니다. 뭔가 통화를 길게 하고 계시더라구요."
212080-71 = "……아, 네."
212080-72 = "말 걸기가 어려웠달까? 하핫."
212080-73 = "제게 용무가 있으신가요?"
212080-74 = "어. 딱히 그렇지는 않은데요……."
212080-78 = "아! 그럼 하나 여쭤봐도 될까요? 인터뷰랄까, 가볍게요!"
212080-79 = "……말씀하십시오."
212080-80 = "그러고 보니 저는 만마전의 서기, 쇼코 씨는 재흥위의 서기네요! 와! 서기즈!"
212080-81 = "……."
212080-82 = "흠흠…… 그럼 질문 들어갑니다!"
212080-83 = "쇼코 씨는 지금의 게헨나를 어떻게 생각하세요?"
212080-84 = "……제 대답이 중요한가요?"
212080-85 = "음, 뭔가 그럴 것 같은 느낌이 들어서요! 기자의 감이랄까요?"
212080-86 = "쇼코 씨, 뭔가 철저한 분위기고. 계획이 있는 사람? 똑똑한 사람 느낌 있어서요!"
212080-87 = "……."
212080-88 = "지금의 게헨나를 어떻게 생각하냐고 물으셨나요? 제 대답은 이렇습니다."
212080-92 = "다시금, 위대해진 게헨나."
212080-93 = "모두가 하나의 목적 아래 걷고 생각하며, 총구가 향해야 할 곳을 명확하게 인지하고 있는 이곳이, 진정 위대한 게헨나입니다."
212080-94 = "오……."
212080-95 = "과거에 이루지 못한 꿈을 현실화하기 위해 모두 최선을 다하고 있죠."
212080-96 = "과거의 꿈이라…… 그런 꿈이 있었던가요?"
212080-97 = "……네. 키보토스 정복이라는 꿈이 있었다고 들었습니다."
212080-98 = "그런 게 있었나요? 금시초문인데."
212080-99 = "후후…… 모르셔도 됩니다."
212080-100 = "음, 그런데 저는 사실 지금의 분위기는 좀 별로인 것 같긴 해요. 너무 조용해서."
212080-101 = "원래 좀 펑펑 터지는 맛도 있고, 여기저기서 사고 좀 쳐야 게헨나다운데."
212080-102 = "불완전한 자유가 지배하던 때를 말씀하시는군요."
212080-103 = "네에. 그래야 기사 쓸 것도 좀 생기고, 특종도 나오고 하니까요."
212080-104 = "치아키 씨는 지금의 게헨나가 그때보다 못하다고 생각하시는 건가요?"
212080-105 = "어…… 솔직하게요?"
212080-106 = "……."
212080-110 = "지금은 좀 분위기 자체가 강압적이기도 하고, 다 찍어 누르는 느낌이라."
212080-111 = "다들 눈치 보면서 통제만 따르는데…… 별로 재미없지 않나요?"
212080-112 = "재미라……."
212080-113 = "치아키 씨, 그 '재미'로 인해 게헨나가 지난 2년 동안 얼마나 많은 기회를 놓쳤는지 알고 계십니까?"
212080-114 = "엥? 그런가요?"
212080-115 = "재미라는 헛된 가치를 추구하는 이들이 그동안 무엇을 이뤘나요?"
212080-116 = "누군가 온천을 파고, 누군가 식당을 부수고, 누군가 탄약과 폭탄을 낭비하는 동안 게헨나는 그저 헛바퀴만 돌고 있었을 뿐이죠."
212080-117 = "하지만 지금은 어떤가요? 모두가 하나 되어 앞으로 나아가기 시작했습니다."
212080-118 = "으음…… 그 목적이 전쟁이라면 딱히 좋은 것 같지는 않은……."
212080-119 = "마코토 의장님도 말씀하셨을 텐데요. 전쟁은 반드시 필요하다고."
212080-120 = "썩어빠진 구시대의 질서를 타파하고, 키보토스의 모든 학원이 게헨나의 깃발 아래 귀속되는 순간부터 게헨나가 주도하는 진정한 질서가 시작될 거라고요."
212080-121 = "……으으으으음~~~"
212080-122 = "그러니까, 저는 그게 왜 필요한지 모르겠어서요."
212080-123 = "서로 달라야 재미있는 거 아니에요? 저는 트리니티가 게헨나가 되고, 밀레니엄이 게헨나가 된다고 해도 그닥 재미있을 것 같지는 않은데."
212080-124 = "각 학원의 개성이니 다양성이니 하는 것들은 결국 힘의 분산을 뜻합니다."
212080-125 = "서로 다른 목소리를 내기 때문에 충돌이 발생하고, 그 충돌을 해결하기 위해 또다시 불필요한 자원이 낭비되죠."
212080-126 = "에이, 그 마찰이 있어야 불꽃도 튀고 특종도 나오는 법이라니까요?"
212080-127 = "쇼코 씨는 정말로 모든 학원이 게헨나가 되는 게 좋아요? 교복도 다 검은색일 텐데!"
212080-128 = "네. 키보토스의 정복은 그 자체로 게헨나의 존재 증명이자, 우리가 도달해야 할 최종 지향점이기 때문입니다."
212080-129 = "흠…… 일단 제 생각은 아니긴 한데, 그럼 질문 하나만 더."
212080-130 = "쇼코 씨는, 그렇게 된 세상에서 뭘 하고 싶어요?"
212080-131 = "네?"
212080-132 = "뭔가 그렇게 목적이 강한데, 그 후에 하고 싶은 게 있을 거 아니에요?"
212080-133 = "저는……"
212080-134 = "저는 완벽한 게헨나에서, 새로운 질서를 공고하게 다지고……."
212080-138 = "……생각 안 해보셨나요?"
212080-139 = "……당연한 것을 굳이 설명하려니 머리가 아프군요. 인터뷰는 여기까지 하죠."
212080-140 = "아, 그럴까요? 네에~ 고생하셨습니다!"
212080-144 = "흐음…… 생각 안 해보셨나."
212080-145 = "……정복까지가 목적? 아니면 전쟁이 목적……?"
212080-146 = "기자로서의 감이 삐링삐링하고 오는데, 뭔가 숨기고 있는 것 같기도 하고?"
212080-147 = "흠~~~~"
212080-148 = "아무튼, 저는 그런 재미없는 세상은 싫거든욧. 반대입니다."
212080-152 = "……선배들은…… 정말 그런 세상을 만들고 싶은 건가요?"
212080-156 = "예전처럼 그렇게, 바보같이 웃고 떠드는 것만으로는 안 될까요……?"
212080-158 = "다음화;사츠키"
