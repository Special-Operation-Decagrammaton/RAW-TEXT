[translation]
10058120-1 = "제12화;그곳에 가면 편지를 띄우세요"
10058120-4 = "저기! 우승자들 온다!"
10058120-5 = "수고했어! 첫 출전에 우승이라니 대단해!"
10058120-6 = "멋있다!! 너무너무 잘했어!"
10058120-7 = "그러면, 붉은겨울 연방학원의 게헨나컵 우승 축하 행사가 있겠습니다."
10058120-8 = "먼저, 체리노 회장님의 표창식이 있겠습니다."
10058120-9 = "게헨나컵 우승을 거머쥔 183호. 앞으로."
10058120-13 = "183호 특별반 반장. 니키 안나."
10058120-16 = "183호 특별반 부반장. 니키 에리나."
10058120-19 = "그리고, 183호 특별반 부부반장. 후루하타 라나."
10058120-20 = "본 회장의 염원이던, 게헨나 컵에서 우승컵을 가져온 것. 아주 크게 칭찬하지."
10058120-21 = "게헨나의 거대한 전차에, 정면으로 맞서 싸운 용기."
10058120-22 = "그리고 끝까지 포기하지 않은 붉은겨울의 정신 그 자체."
10058120-23 = "제군들의 활약은, 우리 모두에게 큰 감동을 주었어."
10058120-24 = "이에, 붉은겨울 사무국의 권한으로 183호 특별반에게 노력수염훈장을 수여한다!"
10058120-28 = "가, 감사합니다……!"
10058120-29 = "해냈다……! 이거 꿈 아니지……?!"
10058120-30 = "사무국, 그리고 이 몸은……. 붉은겨울의 모두가, 이렇게 업적에 합당한 보상이 있어야 한다고 생각한다."
10058120-31 = "그런 점에서, 누가 이 일을 하자고 했지?"
10058120-32 = "어, 그게……."
10058120-33 = "부반장, 에리나가 하자고 했어요! 에리나가 응원하지 않았다면 참가도 못 했을 거예요!"
10058120-34 = "야, 여기서 괜히 겸손하게 굴려는 거야?!"
10058120-35 = "저는 제안한 것에 불과하고요, 반장인 안나가 가장 열심히 해줬어요!"
10058120-36 = "그리고 라나도, 선생님도…… 모두 힘을 합쳐서 만들었어요!"
10058120-37 = "브이."
10058120-40 = "그렇군, 반장인 니키 안나가 주도하고, 너희들은 그것에 따랐던 것이군."
10058120-41 = "즉—"
10058120-42 = "니키 안나의 지시로, 사무국을 습격하고 이 몸의 동상을 깎아냈다……."
10058120-43 = "거기에 유리창을 훔쳐 간 것도 모자라서 광장에 포격까지 했다. 맞나?"
10058120-44 = "우, 우헤헤……. 별거 아니에요, 회장님."
10058120-47 = "네?!"
10058120-48 = "사무국이 끝까지 모를 줄 알았어?! 이 반동 녀석들!!"
10058120-49 = "그, 그게요!! 그러니까!!"
10058120-52 = "상은 상이고 벌은 벌!"
10058120-53 = "183호 전원, 특별반 무기한 복귀다!!!!"
10058120-55 = "끄아앙-!"
10058120-57 = "……이렇게 해서, 저희 183호는 다시 원래대로 복귀했습니다."
10058120-59 = "모두들 잘 지내고 있습니다. 선생님께서 오시기 전에 비해 확실히 달라진 기분이 듭니다."
10058120-60 = "안나는 더 거만해졌고, 에리나는 그에 맞게 더 잘 놀리고 있습니다."
10058120-61 = "'전차대회는 임팩트가 부족하긴 했지! 더 큰 한 방을 보여주자!'라며 열중하곤 있습니다만……."
10058120-64 = "연구 주제를 무엇으로 해야 할지의 단계부터 RWWE를 하고 있어서, 고르는 데 시간이 좀 걸릴 것 같습니다."
10058120-65 = "모두 선생님을 그리워하기에, 조만간 연구 주제가 정해질 때 다시 한번 더 놀러 와주시면 감사하겠습니다."
10058120-66 = "추신. 약속드린 대로, 동상과 유리창은 원래대로 되돌려주었습니다."
10058120-69 = "두 친한 친구들과 함께. 후루하타 라나 올림."
10058120-71 = "[ns] \"……그렇구나.\""
10058120-74 = "[ns1] \"그런데, 이 편지를 직접 들고 왔다는 건…….\"\n[ns2] \"벌써 연구 주제가 정해진 거니?\""
10058120-77 = "그건 아닙니다. 편지를 부치려는데 우표가 부족해서 직접 찾아왔습니다."
10058120-78 = "역시, 두 번 와도 쉽지는 않군요."
10058120-84 = "쿠울…… 쿨……."
10058120-99 = "Start Your Engines! ~183호여, 영원하라!~"
