10057120-242 = "야, 뭐 하는 거야~?"
10057120-244 = "왜? 허가증 안 잃어버리게 클립으로 엮었는데?"
10057120-245 = "그렇게 세게 끼우면, 뺄 때 힘들잖아."
10057120-247 = "하나."
10057120-248 = "그러면 어떻게 하는데?"
10057120-249 = "자~, 이렇게 해야지."
