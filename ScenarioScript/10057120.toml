[translation]
10057120-1 = "제12화;제각각의 평화"
10057120-14 = "아무거나 규탄한다! 이것저것 보장하라!"
10057120-22 = "막아!"
10057120-30 = "압제자를 끌어내자! 주 2일제 쟁취하자!!"
10057120-31 = "모두 돌격!!!"
10057120-35 = "낮에 오는 건 간만이라 헷갈리네. 이쪽이 사무국 맞던가?"
10057120-36 = "뭐라고~? 총소리 때문에~! 잘 안 들려~!"
10057120-37 = "맞겠지, 뭐! 라나도 잘 따라와!"
10057120-38 = "역시. 산 밑은 기압이 너무 높아……."
10057120-39 = "히잉…… 기껏 낮에 왔는데 이번엔 혁명 때문에 즈나먀 카페가 문 닫았잖아……."
10057120-40 = "저기~ 집단 사격 중에 실례합니다~ 지나갈게요~"
10057120-45 = "네~ 길 다 건넜어요~ 마저 일들 보세요~"
10057120-46 = "사격 개시!!"
10057120-56 = "오늘은 좀 따듯한 것 같지 않아?"
10057120-57 = "요 며칠 눈보라에 난리도 아니었는데, 일이 잘 풀리려나 보다~"
10057120-62 = "아, 수류탄이다."
10057120-65 = "스읍- 음~ 달큰한 TNT냄새- 이거, 누구 거예요~?"
10057120-66 = "미안해요! 제가 던진 건데 손이 미끄러졌어요!"
10057120-67 = "네에- 그럼 저기로 드릴게요- 요잇-!"
10057120-71 = "끄악!!"
10057120-75 = "본선에 간 건 좋은데, 뭔가 좀 김빠지네."
10057120-76 = "갑자기 쿠데타가 나서 예선에 우리밖에 안 올 줄은 몰랐어."
10057120-77 = "그래서 나중에 한 번 더 예선전 한다더라~ 우리는 진출 확정이구."
10057120-78 = "덕분에 예선장에서 공짜 기름 가득 넣어줘서 좋았어."
10057120-79 = "공짜 기름은 좋은데, 너무 많이 받았나 봐, 기름 냄새 나……."
10057120-82 = "정지! 정지! 누구냐!"
10057120-83 = "안녕하세요, 183호에서 왔어요. 도장 받아야 해서요."
10057120-84 = "아, 집무실 올라가시는 거군요. 지금 좀 혼잡하실 텐데."
10057120-85 = "2층에서 다시 검문하면 1층에서 보냈다고 하시면 됩니다."
10057120-86 = "바쁘시네요. 점심식사는 하셨어요?"
10057120-87 = "그게, 교대가 안 와서 아직……."
10057120-88 = "이따가 올라가서 말해드릴게요."
10057120-89 = "감사합니다!"
10057120-91 = "사무국 실내"
10057120-96 = "우리…… 옷도 없네. 셋이 가진 옷이 캐리어 하나에 다 들어갔어."
10057120-97 = "가서 쇼핑도 하자! 게헨나는 따듯하다니까 어차피 새 옷 사긴 해야 할 거야!"
10057120-98 = "게헨나면 화산이 있어서 왠지 더울 것 같아."
10057120-99 = "수영복 사야 할지도! 많이 비싸겠지?"
10057120-100 = "돈은 없지만 외상 안 되나? 어차피 우승 상금은 우리 건데!"
10057120-103 = "앗, 1층에서 점심 교대해 달라고 했어요."
10057120-104 = "아앗, 벌써 시간이 이렇게……. 감사합니다!"
10057120-107 = "상금 받으면 노트북 사고 싶어."
10057120-108 = "얼마든지! 라나는 컴퓨터 한 대쯤은 있어야지."
10057120-109 = "천공카드 리더기 있는 걸로 살래."
10057120-110 = "그런 게 있으면 말야."
10057120-113 = "학생회장실을 지켜! 아무도 못 들어오게 막아!"
10057120-118 = "동지들! 체리노를 몰아내자! 모두 진입! 혁명의 끝이 보인다!"
10057120-124 = "저기요~ 지금 이거 사무국 대기 줄이에요?"
10057120-125 = "아뇨, 앞사람이 쓰러지면 총 주우려고 기다리는 줄이에요."
10057120-126 = "그럼 딱히 줄 안 서도 되겠네. 감사합니다!"
10057120-130 = "잠시만요- 쿠데타 말고 다른 일로 왔어요. 지나갈게요-"
10057120-139 = "실례합니다. 183호 외출증 도장 찍으러 왔는데요."
10057120-142 = "어차피 문이 없구나. 실례하겠습니다-"
10057120-143 = "아, 안녕하세요……."
10057120-144 = "안녕하세요! 체리노 회장님은요?"
10057120-145 = "잠시 친위대를 규합하러 간다고 하셔서 지금 자리엔 안 계세요."
10057120-146 = "저도 도장 받으러 오긴 했는데, 마침 자리를 비우셔서요……."
10057120-147 = "그래서, 그냥 제가 학생회장 하기로 했어요."
10057120-148 = "도장이, 어디 보자……."
10057120-152 = "이건 아니고, 이건 보안위원회 도장, 이건 훈장이고, 음……."
10057120-153 = "호오. 도장들, 저렇게 생겼구나."
10057120-156 = "여기 있네요! 서류 주세요."
10057120-157 = "게헨나 컵이군요. 잘 다녀오세요."
10057120-158 = "다음 분, 오세요-"
10057120-162 = "시구레 쨩! 우리 차례야!"
10057120-163 = "학생회장이 바뀐 지금이 기회야, 우리 복학 서류에 도장 받아내자!"
10057120-164 = "이렇게 간단하게 정학이 풀리게 될 줄은 몰랐는데 말이야."
10057120-165 = "혁명이 도움 될 때도 있네! 여기요! 복학 승인받으러 왔는데요!"
10057120-166 = "아, 네네. 어디 보자……."
10057120-170 = "전산에 227호라는 동아리는 없는데요?"
10057120-171 = "네?!! 그럴 리가!!!"
10057120-172 = "뭐지? 인수인계가 안 된 건가?"
10057120-179 = "드디어 외출 허가 받았어!"
10057120-180 = "진짜 우리가 게헨나 컵에 나가는구나!"
10057120-181 = "……응? 라나, 뭘 낙서하고 있는 거야?"
10057120-183 = "기억이 흐려지기 전에 스케치해 두는 거야."
10057120-184 = "붉은겨울에서 프로토콜에 사용되는 물리 토큰 인증키의 사본 설계도."
10057120-185 = "인증기 관리 취약점을 이용해서 권한상승 해보려고."
10057120-187 = "뭔 말인지 하나도 모르겠지만, 재밌어보이네~!"
10057120-188 = "응? 그런데, 선생님은?"
10057120-190 = "일이 있으셔서 먼저 가셨어. 본선 경기장에서 다시 보자고 하셨어."
10057120-191 = "그리고 쿠데타는 별로 안 좋아한다고 하시더라구."
10057120-193 = "그렇구나…… 그럼, 선생님께 꼭 본선에서 대활약하는 거 보여드리자!"
10057120-194 = "목표는 우승이야!"
10057120-195 = "좋아, 183호. 만세!!"
10057120-199 = "만세!!"
