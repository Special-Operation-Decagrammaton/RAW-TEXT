[translation]
10058010-1 = "제1화;기념품은 우승컵으로"
10058010-3 = "대박 사건!"
10058010-4 = "베개에 솜이 들어있어!"
10058010-5 = "진짜다! 게다가, 화학솜도 아니라 정말 목화솜이잖아?"
10058010-6 = "숙소가 공짜……라는 건, 이런 베개도 포함해서 공짜인 걸까?"
10058010-7 = "그야 그렇겠지! 이따 기념품으로 가져가도 되냐고 물어보자~"
10058010-8 = "수도꼭지도, 돌리니까 바로 물이 나왔어."
10058010-9 = "밤새 틀어두지 않아도 물이 멀쩡하게 나오는 거야? 대단해~!"
10058010-10 = "게헨나는, 부르주아 학원이구나……."
10058010-11 = "앗! 그렇지, 사진 찍어두자! 말로만 말하면 다들 못 믿을 거야!"
10058010-20 = "안나 대장님, 창밖에 보고 대상 발견했습니다."
10058010-21 = "좋아, 라나 대원! 보고할 수 있도록!"
10058010-22 = "12시 방향…… 리조트 안뜰에서 야외 뷔페 준비 중임을 확인."
10058010-23 = "뷔페?! 진짜로?"
10058010-24 = "총원 돌격이야, 돌격!!!"
10058010-25 = "뛰어서 가자! 가는 동안 더 소화되게!!"
10058010-30 = "후후, 제법이군요. 대량의 뷔페인데도 어느 정도 신선하고 만족스러웠답니다."
10058010-31 = "수고했어요, 후우카 씨."
10058010-32 = "새로 산 급양차 덕분에 할 만했어. 힘이 세서 트레일러도 견인할 수 있었거든."
10058010-33 = "……미리 말해두는데, 이번에도 급양차에 손대면 진짜 화낼 거야."
10058010-34 = "어머, 디저트도 준비되어 있군요?"
10058010-35 = "말 돌리지 말고!! 진짜 손대지 마!!"
10058010-39 = "본선 선수들만 모여있나 봐. 다들 엄청 강해 보이는데……."
10058010-40 = "뭘 기죽고 그래! 우리도 출전자잖아, 당당하게 굴자구!"
10058010-41 = "어라? 라나는 어디에 간 거야? 사람이 많아서 떨어지면 미아가 될 텐데……."
10058010-42 = "이렇게 하면 간단하네. 대단한걸."
10058010-43 = "회로 부품을 더 줄일 수는 있는데, 그러면 불이 날 수도 있습니다."
10058010-44 = "……라나 목소리다!"
10058010-51 = "어디 갔던 거야. 사람이 이렇게 많은데 미아라도 되면 어쩌려고."
10058010-52 = "내가 할 말이야!!"
10058010-53 = "소개할게. 밀레니엄 사이언스 스쿨의 엔지니어부 분들이야."
10058010-54 = "부장, 시라이시 우타하야."
10058010-55 = "부원인 토요미 코토리입니다! 설명이나 해설이 필요하다면 맡겨주세요!"
10058010-56 = "네코즈카 히비키. 좋아하는 건 자폭 기능이야."
10058010-57 = "붉은겨울의 니키 안나입니다. 이쪽은 니키 에리나. 그리고 후루하타 라나예요."
10058010-58 = "그런데……. 자폭을 좋아하신다고요……?"
10058010-59 = "앗, 나도 모르게 그런 소개를……."
10058010-62 = "폭발볼트로 분리되는 자폭인가요? 아니면 준비해 둔 자폭용 폭약이 터지는 쪽인가요?"
10058010-63 = "아니면, 구동 계통의 연료가 화학적으로 폭주해서 자폭하는 쪽?"
10058010-64 = "비유적으로, 데이터가 소거되는 쪽의 자폭인가요."
10058010-68 = "어디서부터 이야기할까 (요) !"
10058010-71 = "……이렇게 하면 됩니다."
10058010-72 = "메도빅 먹기보다 간단한 소프트웨어 해킹으로 발전소를 자폭시킬 수 있죠."
10058010-73 = "후후, 역시 우리 라나!"
10058010-74 = "'우리'는 무슨, 네가 왜 뿌듯해하는데?"
10058010-75 = "자폭을 이런 예술적인 경지까지 끌어올릴 수 있구나. 감동했어."
10058010-76 = "천공카드로 OS를 덮어씌우는 데 3달 정도 걸리는 것 이외에는 기술적으로 흠잡을 곳이 없군요!"
10058010-77 = "그것도 보완은 가능합니다. 카드 리더기를 병렬로 바꾸면 한 달이면 충분합니다."
10058010-78 = "엔지니어부의 신소재 폴리머로 종이를 대체하면 무게를 절반으로 줄일 수 있을 거야."
10058010-85 = "30분 가까이 낯선 분과 대화를 나눴는데도……."
10058010-86 = "아무도 별종 취급하거나 기겁하지 않는다니……."
10058010-87 = "게다가, 설명도 끝까지 들어주시다니……. 여, 연락처 교환 어떠신가요!! 연구 협력입니다!!"
10058010-88 = "모모톡은 날씨가 좋지 않으면 잘 못 받습니다. VHF 주파수도 연락처에 해당될까요."
10058010-89 = "괜찮다면 또 이런 이야기, 하고 싶어."
10058010-90 = "야, 우타하. 잠깐 괜찮겠냐?"
10058010-92 = "너희들이 만들어준 전차 말인데, 크고 빨간 버튼은 자폭 버튼이라서 누르지 말라고 했지?"
10058010-93 = "그놈의 빨간 버튼, 30개 정도 있는데 뭘 누르면 안 된다는 거냐?!"
10058010-94 = "직경 6.2cm에 R 155, G 17, B 30 정도 되는 빨간색의 버튼이야."
10058010-95 = "알 백오십오…… 뭔 소리야 그게?! 그런 거 말고 위치로 알려줘!"
10058010-96 = "시동 버튼 옆에 있는 버튼이야. 시동 버튼보다 더 큰 거."
10058010-97 = "잘도 그런 데다가 달아놨네! 멋모르고 시동 걸었다가 큰일 나겠구먼!"
10058010-100 = "……음? 얘들은 누구야?"
10058010-101 = "붉은겨울의 연구 동아리 분들이야."
10058010-102 = "이번 전차대회에 직접 전차를 만들어서 참가했대."
10058010-103 = "직접 전차를 만들어서……? 하, 이거 재미있는 녀석들이네."
10058010-104 = "미카모 네루다. 메이드부 부장이야. ……나도 이번 레이스에 나간다."
10058010-105 = "다른 선수분이시군요! 잘 부탁드립니다!"
10058010-106 = "다른 녀석들이 꼭 나가보자고 난리도 아니어서…… 뭐, 잘 부탁해."
10058010-107 = "그럼! 경쟁자네요! 우리, 꼭 우승할 거예요!"
10058010-108 = "에, 에리나!! 갑자기 무슨 무례야!"
10058010-109 = "크하하하! 너, 좋은 눈 하고 있네! 그렇지. 기왕 하는 거 우승을 노려야지!"
10058010-110 = "헤헹~♪ 물론이죠!"
10058010-111 = "싸움 나는 줄 알고 깜짝 놀랐잖아……."
10058010-112 = "그리고, 내가 자폭 버튼 필요 없다고 빼달라고 분명 말했지? 버튼 그냥 뽑아버린다?"
10058010-113 = "그 버튼, 당겨도 작동되니까 조심하세요!"
10058010-114 = "대체 왜 그렇게까지 정성스럽게 자폭하려는 건데?!"
10058010-115 = "아무튼. 붉은겨울이라고 했지? 내일은 진심으로 겨뤄보자."
10058010-116 = "각오들 하라구!"
10058010-120 = "만나서 반가웠어. 내일 경기, 힘내."
10058010-126 = "그렇지…… 이건, 경쟁인 거네……."
10058010-127 = "레이스니까…… 어쩔 수 없긴, 하지만……."
10058010-130 = "……누군가 1등이라는 건, 다른 누군가는 2등이 되는 거니까……."
10058010-131 = "그러게, 예선 통과했으니 이젠 본선이 문제네."
10058010-132 = "여기까지 왔는데 떨어지면 너무 속상할 것 같구……."
10058010-133 = "특별반은 포격으로 폭삭 무너졌으니까, 복귀하면 덜덜 떨면서 살아야 해~!"
10058010-134 = "히잉……."
10058010-135 = "흠……."
10058010-136 = "안나, 에리나. 왜 갑자기 걱정하는 거야."
10058010-137 = "그치만, 떨리고 걱정되는걸……."
10058010-138 = "다들 여유 있어 보이잖아? 우리 전차는 포탑도 없다구?"
10058010-139 = "그러니까, 포 구경을 좀 줄이더라도 회전 포탑을 달자고 했잖아……."
10058010-140 = "이걸로, 의견 교환이 1……."
10058010-141 = "그러게……. 내 잘못이야……. 과녁 맞힐 때 차체를 돌려야 할 텐데……."
10058010-142 = "?"
10058010-143 = "아, 그때 나도 동의했었고…… 이제 와서 뭐라 해도 어쩔 수 없지, 미안……."
10058010-144 = "히잉……."
10058010-149 = "(원래대로라면 이쯤에서 바로 RWWE를 했을 텐데.)"
10058010-150 = "(두 사람 다 힘이 없어서 다투지도 않아.)"
10058010-151 = "(너무 평화로우니까 조금……. 징그러워.)"
10058010-156 = "하아……. 이렇게 생각이 복잡할 때는 사우나라도 했는데……."
10058010-157 = "여기서 붉은겨울식 사우나를 어떻게 하겠어~"
10058010-158 = "하아……."
10058010-159 = "(사우나……!)"
10058010-160 = "(그렇지. 뜨거운 물에 적신 나뭇가지로 몸을 두들기면 개운해질 거야.)"
10058010-161 = "(다들 기운 차릴 수 있게 도와줘야 해.)"
10058010-165 = "183호 복귀하라고 하면, 전차에 천막 치고 살까……?"
10058010-166 = "상상만 해도 춥다……."
10058010-167 = "끼잉……."
10058010-172 = "이건 잎이 붙어있지 않아서 안 돼."
10058010-176 = "이건……. 끌리질 않아."
10058010-180 = "……이거다!"
10058010-183 = "수풀 너머에서 소리……."
10058010-188 = "코하루 쨩, 하얀색 페인트 캔 갖다주실래요?"
10058010-189 = "응, 맡겨달라구!"
10058010-190 = "이 남색 페인트로, 수영복을 입은 것처럼 몸에 칠하면 시원할 것 같네요."
10058010-191 = "페인트 냄새 맡아서 머리가 어떻게 된 거야?!"
10058010-192 = "이 초록색 페인트를 칠하면 수목 환경에서 탁월한 위장이 될 거야."
10058010-193 = "아하하……. 유성 페인트라서 다시 지우기가 힘들 거예요."
10058010-194 = "그럼 다음은……."
10058010-199 = "……."
10058010-200 = "어라?"
10058010-201 = "저런. 길을 잃으셨나요."
10058010-202 = "우리가 할 말이거든!"
10058010-203 = "어머, 미아인가요?"
10058010-204 = "자주 그렇게 불리긴 합니다만, 본명은 라나입니다."
10058010-205 = "시라스 아즈사야."
10058010-206 = "그렇군요. 성씨는 어떻게 되시나요?"
10058010-207 = "끝이 없네, 진짜!"
10058010-209 = "……그래서, 사우나를 할 때 몸을 두드리는 용도의 나뭇가지를 찾고 있었습니다."
10058010-210 = "방금 찾은 이 나뭇가지면 충분할 것 같군요."
10058010-211 = "다 같이 발가벗고 그런 걸 한다고……! 야한 거 안 돼! 사형!!"
10058010-212 = "붉은겨울에서 사우나가 이제는 합법이라, 사형당하지는 않을 겁니다."
10058010-213 = "그런 나뭇가지로 서로를 두드린다니, 붉은겨울의 풍습은 흥미롭네요."
10058010-214 = "어떻게든 친구들의 긴장을 풀어주고, 걱정을 잊게 하고 싶습니다."
10058010-215 = "정말 훌륭하네요! 코하루 쨩도 긴장하면 똑같이 해드릴게요♡ 서로 때리기 놀이해요♡"
10058010-216 = "싫어!"
10058010-217 = "라나-! 여기에 있니-?"
10058010-218 = "라나-!"
10058010-220 = "제 친구들 목소립니다."
10058010-221 = "길을 잃은 모양이군요."
10058010-222 = "아하하…… 아마 라나 씨를 찾으러 온 것 아닐까요?"
10058010-228 = "라나! 한참 찾았잖니!"
10058010-229 = "다행이다, 누가 훔쳐 간 줄 알았잖아!"
10058010-230 = "두 사람이 힘이 없어 보여서, 사우나 시켜주려고 준비하고 있었어."
10058010-234 = "몸을 두들길 나뭇가지는 이 정도면 되겠지?"
10058010-235 = "이걸로 몸을 두들기면…… 긴장이 풀리긴커녕 당분간 걷지도 못할걸……."
10058010-236 = "찜질보다는 몽둥이 찜질이네……."
10058010-237 = "그런데, 이분들은?"
10058010-240 = "내일 레이스에 참가하는 트리니티의 보충수업부 분들."
10058010-241 = "지금은 전차 정비 중."
10058010-242 = "반가워요. 전해주신 대로, 트리니티 보충수업부예요."
10058010-243 = "안녕하세요. 아지타니 히후미예요."
10058010-244 = "라나 씨가 방금 말씀해주신 안나 씨와 에리나 씨, 맞으실까요?"
10058010-245 = "네! 183호팀의 니키 안나예요. 여기는 에리나고요."
10058010-246 = "그런데…… 라나가 무슨 이야기를 했었나요?"
10058010-247 = "지금까지 있던 이야기를 해드렸어. 방금 전까지 기운 쭉 빠진 것도."
10058010-248 = "안심해. 눈밭에서 눈물 콧물 흘리면서 운 이야기는 사생활이라서 말 안 했어."
10058010-249 = "방금 말했잖니!!"
10058010-250 = "부끄럽지만, 사실이니까 할 말이 없네."
10058010-251 = "힘든 환경에서 직접 전차를 만드셨다니, 대단해요!"
10058010-252 = "급조 부비트랩은 종종 만들어봤지만, 전차를 만들다니. 훌륭한 실력이야."
10058010-253 = "다 같이 땀범벅이 되면서 부드러운 살갗을 맞대고 열중한다니…… 좋네요♡"
10058010-254 = "일부러 그렇게 말한 거지?!"
10058010-255 = "동의해 하나코. 땀 흘려 고생하면 보람이 있는 법이야."
10058010-256 = "그런 일이 지금까지 있었고, 이번에 만약 우승하지 못한다면 계속 특별반에 있게 될 겁니다."
10058010-257 = "라나가 말해준 게 맞아요. 그렇게 지금까지 왔는데, 막상 본선대회에 오게 되니 실감이 난달지……."
10058010-258 = "이미 극복했다고 생각했는데…… 또 실패하게 될까 봐, 무서워졌어요……."
10058010-259 = "다른 선수들을 보니 더더욱……. 자신이 없기도 하고……."
10058010-260 = "히잉……."
10058010-261 = "그래서, 이런 상태입니다."
10058010-262 = "기, 기운 내! 잘은 모르지만 괜찮을 거야!"
10058010-265 = "으음……."
10058010-266 = "이런 말씀을 함부로 드려도 괜찮을지 몰라서, 순전히 제 생각으로 들어주셨으면 해요."
10058010-267 = "같은 일을 겪었다곤 할 수 없지만요. 저는 시련도 좌절도 좋을 거라고 생각해요."
10058010-268 = "으윽…… 실패해도 괜찮을 것 같다는 건가요?"
10058010-269 = "결과가 나쁠 수도 있겠지만, 그리고 힘들었던 기억이 남을지도 모르지만……."
10058010-270 = "친구들과 함께 노력한 과정은 사라지지 않거든요."
10058010-271 = "과정……."
10058010-272 = "그런 소중한 과정이야말로, 좋은 결과라고…… 생각해요."
10058010-273 = "아하하……. 즐겁잖아요? 모두와 함께하는, 친구들과의 추억 만들기는요!"
10058010-274 = "미래가 어떻게 되어도, 그 어떤 결과도 소중한 추억을 덮어버릴 수는 없을 거예요."
10058010-275 = "그러니까, 그…… '지금을 즐기는 것에 집중합시다!'는 거예요."
10058010-276 = "아하하…… 그냥 제 생각이에요. 너무 깊이 생각하지는 마세요!"
10058010-279 = "후훗, 어떠실까요? 여러분께 도움이 되었을까요?"
10058010-280 = "음."
10058010-281 = "42억 9496만 7296점!"
10058010-282 = "뭐, 뭐야?! 뭔가 엄청 긴 숫자가……?!"
10058010-283 = "라나보다 1점 더 높구나, 아하하……."
10058010-284 = "이 아이 나름의 극찬이야."
10058010-285 = "그렇네요, 처음에는 전차를 완성하는 것만으로도 충분했는데…… 예선 참가, 본선 우승으로…… 어느새인가 목표가 높아져 있었어요."
10058010-286 = "눈앞의 계단을 오르면서, 무의식적으로 계속 문턱을 높이고 있었던 것 같아요."
10058010-287 = "목표에 너무 사로잡혀있었는데, 덕분에 다시 생각하게 되었어요. 감사합니다."
10058010-288 = "뭐어, 특별반에 있어도 썩 나쁘지는 않으니까. 너랑 같이 지낸다는 게 싫은 거지."
10058010-289 = "너랑 있으면 특별반이 썩 나빠! 누가 할 소리를!"
10058010-290 = "흠. 싸우기 시작한 걸 보니, 다들 기운을 차린 모양입니다."
10058010-291 = "좋은 이야기에 보답으로 드릴 게 없습니다만, 괜찮다면 이 나뭇가지를 받아주실 수 있을까요."
10058010-292 = "긴장을 푸는 사우나는 이제 필요 없게 되었지만, 버리기에는 아까운 좋은 모양새에……."
10058010-293 = "그립감도 좋고, 타격감과 내구도 역시 좋아 보입니다."
10058010-294 = "몽둥이 맞았잖아!!"
10058010-295 = "동의해. 총기를 사용하기 곤란한 침투 상황에서 쓰기 좋아 보여."
10058010-296 = "괜찮다면 내가 맡아둘게."
10058010-297 = "뭔가, 산뜻해진 기분이에요! 밑져야 본전이었다는 걸 잊었어요!"
10058010-298 = "좋은 이야기 고마워. 내일 꼭 최선을 다하고 즐길 거야~!"
10058010-299 = "좋은 마음가짐이에요. 어쩐지 몸이 뜨거워져서…… 저까지 이상한 기분이 들어버렸어요♡"
10058010-300 = "평범하게 말해!"
10058010-301 = "그리고 우리는 즐기기만 하면 안 돼! 대회 성적 따라서 낙제과목 재시험 면제해준다고 했잖아!"
10058010-302 = "재시험은 싫단 말야!"
10058010-303 = "재, 재시험 대신에 전차대회를요……?"
10058010-304 = "아하하……. 아앗, 시간이 벌써……! 주최 측에 차량 검사받으러 갈 시간이네요!"
10058010-305 = "저희는 이만 가볼게요, 내일 뵈어요!"
10058010-306 = "다음에 만날 때는……. 적입니다."
10058010-307 = "얘, 라나?! 무슨 말을……!"
10058010-308 = "아아, 물론이지……. 서로 최선을 다하자."
10058010-312 = "두 사람, 왠지 죽이 잘 맞네요. 아하하……."
10058010-313 = "우리도 얼른 돌아가서 자야지! 풀 컨디션으로 가자구!"
10058010-314 = "내일 봐용~!"
10058010-321 = "그렇게 해서 어제……."
10058010-322 = "분명, 좋은 이야기도 많이 들었고……."
10058010-323 = "이젠 정말 걱정이 없다고 생각했는데……."
10058010-326 = "……너도 잠 못 잤어……?"
10058010-327 = "어제는 '지금을 잘 즐기는 방법'을 고민하다가 못 잤어……. 라나는 잘 자더라……."
10058010-328 = "하아……."
10058010-329 = "히이잉……. 떨려서 죽겠어……!"
10058010-330 = "쿠울, 쿨……."
