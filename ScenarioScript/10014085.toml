[translation]
10014085-2 = "아, 출출하다……."
10014085-3 = "심심한데 뭐라도 주문해서 먹을래?"
10014085-4 = "요, 요시미 쨩? 냉장고에 아직 많이 있지 않아……?"
10014085-5 = "그건 안 돼. 다 먹을 때가 정해져 있는 거라고. 그건 그거고 이건 이거."
10014085-6 = "주문 앱으로 주문할 건데……. 일단 다들 먹긴 할 거지?"
10014085-7 = "뭐 먹을래? 아이리 너는?"
10014085-8 = "음~. 그럼 오늘은……"
10014085-9 = "민트초코 파르페로?"
10014085-10 = "오늘'은'……?"
10014085-11 = "아무튼 알았어……. 그럼 아이리는 그걸로 하고……."
10014085-12 = "나츠, 너는?"
10014085-19 = "나는……. <나츠>."
10014085-20 = "……유토리……. 나츠."
10014085-21 = "니 자아 정체성을 물은 게 아니고 뭐 먹을 거냐고."
10014085-22 = "정말이지……."
10014085-23 = "에휴, 됐어. 내가 알아서 시킬 테니까 주는 대로 먹도록."
10014085-24 = "나츠랑 나는……. 각각 이렇게 하고……."
10014085-25 = "그럼 마지막으로……."
10014085-26 = "……넌 뭐 먹을 거……."
10014085-30 = "……어라? 누가 왔나?"
10014085-31 = "[s1] \"여기들 모여 있었네.\"\n[s2] \"안녕.\""
10014085-32 = "어? 선생님……?"
10014085-33 = "어? 선생님……?"
10014085-34 = "보아하니 딱 뭔가 시키는 타이밍인 것 같네. 운이 좋은걸."
10014085-35 = "하는 김에 우리 것도……."
10014085-36 = "하하!! 역시 돌아왔군요, 기다리고 있었습니다! 쿄야마 카즈사!!"
