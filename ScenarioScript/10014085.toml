10014085-40 = "……어. 잠깐. ……뭐야."
10014085-41 = "아니, 잠깐. 저거 뭐야?"
10014085-42 = "저게 왜 여기 있……."
10014085-43 = "정말로 이곳이 당신의 '소굴'이었군요!?"
10014085-44 = "이야기는 다 들었습니다! 혼자서 일대의 스케반 모두를 쓸어버렸다고……! 또 전설을 써버렸다고!!"
10014085-45 = "카스팔루그! 이 트리니티에 봉인된 마수!!"
