10014085-47 = "아니, 애초에 무슨 소리야? 스케반들을 모두 쓸어버렸다니? 누가 그래? 어디서 들었어!?"
10014085-48 = "후후. 첩보가 있었습니다. 당신을 봉인하고 있다는 기사들……."
10014085-49 = "용감하고 숭고한 <방과후 디저트단>에게서 말이죠."
