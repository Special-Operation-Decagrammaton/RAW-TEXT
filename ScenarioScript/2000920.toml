[translation]
2000920-1 = "목욕 보좌관"
2000920-3 = "(체리노의 연락을 받고 그녀가 머무르고 있는 온천장으로 향했다.)"
2000920-6 = "(그리고 온천장 입구에서 마주친 것은……)"
2000920-7 = "어서 오게, 콤라드!"
2000920-8 = "그리고…… 으음. 직접 보게나."
2000920-13 = "[ns] \"이건…… 오리 인형?\""
2000920-14 = "오리 인형이라니! 여기에는 좀 더 그럴듯한 이름이 있다네!"
2000920-15 = "<러버덕>이라는 이름이지!"
2000920-16 = "[s] \"그런 것치고는 수염이 붙어 있는데……?\""
2000920-17 = "으음, 그게 말이지…… 설명하자면 조금 길어지는데……"
2000920-23 = "……그래서 이렇게 되었다네."
2000920-24 = "[s1] \"그러니까, 수기에 의존하는 붉은겨울 학원의 전산 착오로 인해……\"\n[s2] \"사무국이 대량의 러버덕 재고를 떠안게 되었는데……\""
2000920-25 = "전산국 녀석들을 숙청하려는 찰나, 토모에가 마치 이 러버덕이 나처럼 귀여워 보인다며-"
2000920-26 = "전산국 녀석들을 숙청하려는 찰나, 토모에가 마치 이 러버덕이 나처럼 귀여워 보인다며-"
2000920-27 = "……아니, 위엄 있어 보인다며 수염을 붙여 기념품으로 만드는 것이 어떠냐고 제안했다네."
2000920-28 = "어찌 된 영문인지 꽤나 인기가 있어 제법 팔린 덕분에 전산 착오로 인한 손해는 모두 메울 수 있었지만……"
2000920-29 = "[s] \"뭔가 마음에 들지 않는 거라도 있는 거야?\""
2000920-30 = "으음…… 그게 말이지."
2000920-31 = "물에 뜨는 것 이외에는 하등 쓸모도 없는 이 러버덕에게, 권위의 상징이라 할 수 있는 수염을 붙여도 되는 것인지 의문이 들어서 말이지."
2000920-32 = "[s] \"……귀여우니까 괜찮지 않을까?\""
2000920-33 = "귀여운 것만으로는 부족해! 붉은겨울 학원의 수염은 아무에게나 하사하는 것이 아니라고!"
2000920-34 = "수염이란 세월이 가져다주는 권위의 상징…… 오랫동안 경험을 갈고 닦은 성인에게만 주어지는 훈장과도 같은 것이네."
2000920-35 = "어떤 의미에서는 훈장 그 자체라고도 볼 수 있지!"
2000920-36 = "그런데 이런 맹해 보이는 오리에게 수염을 하사하다니…… 붉은겨울 학원의 재정에 도움이 된다고 하더라도 용납할 수 없는 일이야!"
2000920-37 = "[s3] \"자, 자. 일단 진정해.\"\n[s4] \"그렇게 의심스러우면 함께 목욕을 하며 시험해 보면 되지 않을까?\""
2000920-42 = "으음…… 어딘가 못미더운 제안이지만."
2000920-43 = "콤라드의 제안이기도 하고, 가볍게 흘려들을 수는 없겠군."
2000920-44 = "좋아. 그렇게 하지. 그 대신 이 러버덕에 그만한 가치가 없다면……"
2000920-48 = "전산국의 학생들과 함께 이 러버덕을 숙청하겠어!"
2000920-52 = "하아아……"
2000920-53 = "최근 조금씩이지만 온천욕이라는 것이 조금씩 좋아지려고 한단 말이지."
2000920-54 = "격무를 잊은 채 즐기는 이 여유가 아주 마음에 들어……"
2000920-55 = "다만 이 러버덕이 온천욕에 어떤 도움을 주는지는 아직 모르겠다만……"
2000920-56 = "………"
2000920-61 = "뒤뚱, 뒤뚱…… 흔들, 흔들……"
2000920-66 = "흠, 흠."
2000920-67 = "여봐라, 러버덕. 그렇게 흔들거리고 있어도 괜찮은 것인가?"
2000920-68 = "이 몸이 보기에는 제법 어지러워 보이는데, 정말로 괜찮은 것인가?"
2000920-73 = "응? 이 체리노 님의 권위와 영광의 상징인 수염을 받았으니, 이 정도는 능히 극복할 수 있다고?"
2000920-74 = "후후, 후후후……"
2000920-76 = "그 용맹함, 마음에 들었어! 그대에게 특별히 3급 용맹 훈장을 수여하지!"
2000920-80 = "[ns] \"러버덕은 마음에 들었어?\""
2000920-84 = "무, 무슨 일인가. 콤라드!"
2000920-85 = "다른 사람이 씻고 있는 탕에 들어올 거라면 적어도 기척을 내라고, 기척을!"
2000920-86 = "[s5] \"미안. 방해할 생각은 아니었어.\"\n[s6] \"어쩐지 체리노가 즐겁게 놀고 있는 것 같아서……\""
2000920-87 = "즐겁게 놀고 있다고? 고작 이 러버덕 하나를 가지고?"
2000920-88 = "즐겁게 놀고 있다고? 고작 이 러버덕 하나를 가지고?"
2000920-89 = "이 몸은 어린아이가 아닐세!"
2000920-90 = "수염 러버덕에게 말을 걸며 혼자 즐거워하는 일 따위는 전혀 일어나지도 않았으니 말이지!"
2000920-91 = "[s7] \"응! 그런 것으로 하자!\"\n[s8] (이미 다 봤다고는 말하지 않는 게 좋겠지……)"
2000920-92 = "하지만 이 수염 러버덕은…… 그다지 나쁘지 않군."
2000920-93 = "하지만 이 수염 러버덕은…… 그다지 나쁘지 않군."
2000920-94 = "이 몸의 목욕을 시중들기에 충분한 용맹성을 갖추고 있어."
2000920-99 = "결정했네! 이 러버덕에게 목욕 보좌관이라는 직책을 수여하지!"
2000920-100 = "목욕 보좌관은 앞으로, 목욕을 할 때마다 빠지지 않고 이 몸을 보좌하게 될 것이야!"
2000920-101 = "전산국의 실수도…… 이번만큼은 눈 감아 줘도 될 것 같군."
2000920-106 = "그렇지 않느냐, 목욕 보좌관?"
2000920-108 = "(이후, 체리노는 러버덕과 함께 오랫동안 목욕을 즐겼다.)"
