[translation]
10054080-1 = "ตอนที่ 8;ผู้ที่ก้าวนำหน้า"
10054080-3 = ""
10054080-4 = "สวัสดีค่ะ คุณครู กำลังเดินเล่นยามค่ำคืนอยู่เหรอคะ?"
10054080-5 = "[ns] \"ชุนเหรอ...?\""
10054080-6 = "ฮุฮุ ใช่ค่ะ พอดีเห็นคุณครูออกมาข้างนอกคนเดียวน่ะค่ะ "
10054080-7 = "[s] \"ครูอยากออกมารับลมกลางคืนน่ะ\""
10054080-8 = "อุ๊ย บังเอิญจังเลยค่ะ ฉันเองก็กำลังคิดแบบนั้นพอดีเลย"
10054080-10 = "(คุณครูเดินเคียงข้างชุนไปตามริมน้ำในยามค่ำคืน)"
10054080-12 = "[ns] \"จะว่าไปแล้ว...\""
10054080-13 = ""
10054080-14 = "ค่ะ คุณครู"
10054080-15 = "ทำไมฉันถึงกลับมาเป็น 'ชุนหลิง' ได้อีกครั้งเหรอคะ?"
10054080-16 = "ฮุฮุ ฉันไปขอ 'ยาคืนวัยเยาว์' สำรองจากคุณซายะมาเผื่อไว้ แล้วเอาติดตัวมาด้วยน่ะค่ะ"
10054080-17 = "เห็นว่าครั้งนี้ปรับปรุงให้ดีขึ้นอีกขั้นแล้วก็เลยไม่มีผลข้างเคียง แถมขั้นตอนการถอนพิษก็ปลอดภัย#nด้วยค่ะ"
10054080-18 = "ถึงคุณซายะจะไม่ค่อยชอบคำว่า 'ถอนพิษ' สักเท่าไรนักก็เถอะค่ะ"
10054080-19 = "[s] \"ปะ... เป็นอย่างนั้นเองสินะ\""
10054080-20 = ""
10054080-23 = "[ns] \"ได้ไปพบเด็กๆ กลุ่มนั้นมาแล้วใช่มั้ย...?\""
10054080-24 = "ค่ะ ได้พบมาแล้วค่ะ"
10054080-25 = "แล้วเป็นยังไงบ้างน่ะเหรอคะ?"
10054080-26 = "..."
10054080-27 = "ไม่ว่าจะมองในแง่ไหน ก็ให้ความรู้สึกว่าพวกนั้นเป็นเด็กจริงๆ ค่ะ"
10054080-28 = "หมายความว่ายังไงน่ะเหรอคะ? อืม... ก็หมายความตามที่พูดเลยค่ะ"
10054080-29 = "ถ้าเด็กพวกนั้นมีเจตนาแอบแฝงหรือปิดบังอะไรอยู่ ฉันก็ยิ่งเป็นห่วงมากกว่านี้..."
10054080-30 = "แต่เด็กๆ พวกนั้นก็แค่ \"ทำแบบนั้นเพราะอยากทำ\" เท่านั้นเองค่ะ "
10054080-31 = "ต้องบอกว่าเป็นเด็กที่สมกับเป็นเด็กจริงๆ เวลาคิดอะไรก็แสดงออกมาตรงๆ ไม่มีอะไรซ่อนเร้นเลยค่ะ"
10054080-32 = "ถึงความคิดจะผิดเพี้ยนและบิดเบี้ยวไปบ้างก็ตามเถอะค่ะ..."
10054080-33 = "..."
10054080-34 = ""
10054080-36 = ""
10054080-37 = "ปกติแล้วเรามักจะพูดกันว่าเด็กๆ บริสุทธิ์ใช่มั้ยคะ? คุณครู"
10054080-38 = "[s] \"อืม เป็นคำพูดที่ได้ยินบ่อยเลยละ\""
10054080-39 = "ค่ะ เป็นคำพูดที่ถูกต้องเลยค่ะ"
10054080-40 = "แต่ความบริสุทธิ์และไร้เดียงสา ก็ไม่ได้ส่งผลดีเสมอไปหรอกค่ะ"
10054080-41 = "[s] \"ช่วยเล่าให้ละเอียดกว่านี้ได้มั้ย...?\""
10054080-42 = "..."
10054080-43 = ""
10054080-45 = ""
10054080-46 = "น่าแปลกที่บางครั้งเด็กๆ ก็โกหกเหมือนกันค่ะ"
10054080-47 = "เรื่องนี้เกิดขึ้นเพราะพวกเขายังตระหนักไม่ค่อยได้ว่าการโกหกเป็นเรื่องไม่ดีค่ะ"
10054080-48 = "ความบริสุทธิ์ก็มีส่วนคล้ายกับการที่ยังไม่รู้จักใช้เล่ห์เหลี่ยมอยู่เหมือนกันค่ะ"
10054080-49 = "เด็กๆ น่ะยังไม่รู้อะไรมาก ก็เลยไม่รู้ว่าคนอื่นจะมองการกระทำของตัวเองว่ายังไงค่ะ"
10054080-50 = ""
10054080-52 = ""
10054080-53 = ""
10054080-54 = "เพราะแบบนั้น เด็กๆ ถึงได้แสดงสิ่งที่คิดอยู่ในใจออกมาตรงๆ แถมยังไม่เก่งในเรื่องการเสแสร้ง#nหรือปิดบังด้วยค่ะ"
10054080-55 = "และนั่นก็เป็นเพียงลักษณะอย่างหนึ่งเท่านั้น จริงๆ แล้วไม่ได้เกี่ยวอะไรกับความดีหรือความเลวเลยค่ะ"
10054080-57 = ""
10054080-58 = "ด้วยความใสซื่อนี้... บางครั้งพวกเขาก็เลยทำเรื่องใหญ่โตลงไปโดยไม่คิดหน้าคิดหลัง"
10054080-60 = ""
10054080-61 = "แน่นอนว่าเด็กๆ ทั้งน่ารักและน่าเอ็นดู แถมใบหน้าตอนยิ้มก็ดูราวกับนางฟ้าจริงๆ..."
10054080-62 = ""
10054080-64 = ""
10054080-65 = "เพราะงั้นฉันถึงยิ่งอยากปกป้องเด็กๆ มากขึ้น..."
10054080-66 = ""
10054080-68 = ""
10054080-69 = "แต่ก็เพราะแบบนั้นละค่ะ... เราถึงต้องคอยชี้นำให้ดีว่าอะไรทำได้ถึงแค่ไหน และอะไรคือสิ่งที่ห้ามทำ"
10054080-70 = "เหตุผลก็คือ หลายครั้งเด็กๆ จะเชื่อสิ่งที่เราแสดงให้เห็นตามนั้นเลยค่ะ"
10054080-71 = "และเพราะอย่างนั้น... บางครั้งฉันเองก็รู้สึกกลัวการรับมือกับเด็กๆ ค่ะ"
10054080-72 = "[s] \"เหมือนจะเข้าใจอยู่ แต่ก็... น่าประหลาดใจเหมือนกันนะ\""
10054080-73 = "ฮุฮุ ฉันเองก็ยังเป็นนักเรียนอยู่นะคะ"
10054080-74 = "แต่เวลาที่รู้สึกกลัวขึ้นมา มักจะเป็นกรณีแบบนี้ค่ะ"
10054080-75 = "เวลาที่อดคิดไม่ได้ว่าการกระทำของตัวฉันในตอนนี้ จะไปทำให้อนาคตของเด็กที่ยังไม่รู้อะไรเลย... บิดเบี้ยวไปในทางที่ไม่ควรหรือเปล่า"
10054080-76 = "ยังไงฉันก็เป็นผู้ฝึกสอนของสวนต้นบ๊วยนี่คะ"
10054080-77 = "คุณครูก็คงทราบอยู่แล้ว ว่าเด็กมัธยมปลาย... มัธยมต้น... หรือแม้แต่อายุประมาณสิบขวบก็ไม่ค่อย#nยอมเชื่อฟังกันแล้วใช่มั้ยล่ะคะ?"
10054080-78 = "เพราะเป็นวัยที่เริ่มมีความดื้อรั้นเป็นของตัวเองน่ะค่ะ"
10054080-79 = "ที่จริงแล้วนั่นเป็นเรื่องดีค่ะ เพราะนั่นคือหลักฐานว่าตัวตนของพวกเขากำลังเติบโตอย่างแข็งแรง"
10054080-80 = "แต่ในขณะที่รู้สึกชื่นใจเมื่อเห็นภาพนั้น ก็มีส่วนที่ทำให้ฉันรู้สึกเสียดายอยู่เหมือนกันค่ะ"
10054080-81 = "ทั้งๆ ที่ยังมีเรื่องที่อยากสอนอีกมากแท้ๆ และสิ่งที่ต้องคอยชี้นำ... ก็ยังมีอีกมากเหลือเกิน"
10054080-82 = "[ns] \"นั่นสินะ...\""
10054080-84 = "..."
10054080-85 = "คุณครูคะ คุณครูคิดยังไงกับ \"เรื่องที่ยังไงก็ห้ามทำ\" เหรอคะ?"
10054080-86 = "ที่จริงแล้ว เรื่องที่ \"ห้ามก็คือห้าม\" นั้นมีอยู่น้อยมาก แต่บางครั้งก็จำเป็นต้องสอนเด็กๆ แบบนั้นค่ะ"
10054080-87 = "พวกเด็กๆ ยังเล็กเกินกว่าจะเข้าใจเหตุผลที่แท้จริง หรือไม่ก็มักจะคิดโดยยึดตัวเองเป็นหลัก "
10054080-88 = "เพราะอย่างนั้น ตอนนี้จึงต้องสอนไปก่อนว่า \"ห้ามก็คือห้าม\" หรือ \"ให้ทำแบบนั้นไปก่อน\" "
10054080-89 = "ก็ได้แต่หวังว่า เมื่อเด็กคนนั้นค่อยๆ เติบโตและสร้างตัวตนของตัวเองขึ้นมาแล้ว สักวันจะเข้าใจเหตุผลที่แท้จริง แม้จะช้าไปสักหน่อยก็ตามค่ะ"
10054080-90 = "ฉันคิดว่าการสอนเด็กๆ ก็คือการทำแบบนั้นค่ะ"
10054080-91 = ""
10054080-93 = ""
10054080-94 = "ขีดเส้นและกำหนดขอบเขตให้ แล้วบอกว่าถึงตรงนี้ยังไม่เป็นไร แต่ถ้าวิ่งเลยไปกว่านั้นจะเป็นอันตราย"
10054080-95 = "แต่ในกระบวนการนั้น... บ่อยครั้งก็ทำให้ปวดใจเหมือนกันค่ะ"
10054080-96 = "คนที่ต้องเป็นฝ่ายบอกว่า \"อย่าทำ\" หลายครั้งก็ไม่ได้อยากพูดแบบนั้นนี่คะ"
10054080-97 = "[s] \"อืม...\""
10054080-98 = "แต่ฉันคิดว่ามันเป็นเรื่องที่ต้องทำค่ะ"
10054080-99 = "เพราะถ้าไม่ทำแบบนั้น สุดท้ายก็จะทำลายอนาคตของเด็กค่ะ"
10054080-100 = "[s] \"หมายถึงการอบรมสั่งสอนสินะ\""
10054080-101 = "ใช่ค่ะ"
10054080-102 = "มันเป็นสิ่งที่สำคัญจริงๆ ค่ะ"
10054080-103 = "แต่คนส่วนใหญ่ก็มักไม่ค่อยอยากเป็นฝ่ายอบรมสั่งสอนกันค่ะ"
10054080-104 = "เพราะถ้ามองเผินๆ ก็อาจดูเหมือนเป็นคนใจร้ายได้ง่ายๆ เลย ใช่มั้ยล่ะคะ?"
10054080-105 = "แต่ถึงอย่างนั้น ถ้าต้องมีใครสักคนที่ทำ... ฉันคิดว่า... อย่างน้อยให้ฉันเป็นคนทำเรื่องนั้นน่าจะดีกว่า"
10054080-106 = "นั่นก็เพราะว่าฉันชอบเด็กๆ ค่ะ"
10054080-107 = "[s] \"ชุนชอบเด็กๆ... จริงๆ สินะ...\""
10054080-108 = "ฮุฮุ ใช่ค่ะ แน่นอนอยู่แล้วค่ะ"
10054080-109 = "ฉันไม่อยากเห็นเด็กๆ เดินผิดทาง หรือถูกคนอื่นเกลียดในภายหลังค่ะ..."
10054080-110 = "อย่างน้อยภายในขอบเขตที่ฉันทำได้ ฉันก็อยากให้เด็กๆ เติบโตขึ้นเป็น 'คนดี' ในที่สุดค่ะ"
10054080-111 = "เพราะอย่างนั้น หลังจากเด็กคนนั้นเติบโตขึ้น และได้คิดขึ้นมาว่า \"ที่ผู้ฝึกสอนเคยพูดแบบนั้นตอนเด็กๆ ก็เพราะเหตุผลนี้เองสินะ\""
10054080-112 = "ต่อให้ความคิดนั้นจะแวบผ่านเข้ามาเพียงแค่ครู่เดียว... แต่แค่นั้นก็คงพอใจแล้วค่ะ"
10054080-113 = "ฮุฮุ... พอได้พูดมาถึงขนาดนี้ ฉันก็รู้สึกนับถือคุณครูขึ้นมาอีกครั้งเลยค่ะ"
10054080-114 = "[s] \"ทะ... ทำไมจู่ๆ ถึงเข้าเรื่องครูล่ะ?!\""
10054080-115 = "ก็ตอนนี้คุณครูคอยชี้แนะเด็กมัธยมปลายที่คิดว่าตัวเองโตเป็นผู้ใหญ่เต็มตัวแล้วนี่คะ"
10054080-116 = "มันจะเป็นงานที่ยากขนาดไหนกันนะ... ไม่ใช่แค่จินตนาการไม่ออก แต่แค่นึกถึงฉันก็รู้สึกกลัวขึ้นมานิดๆ ด้วยซ้ำค่ะ"
10054080-117 = "[s] \"แต่พอลองทำ ก็มักจะทำได้เองนั่นแหละ\""
10054080-118 = "ฮุฮุ... อย่างนั้นเองสินะคะ"
10054080-119 = "เพราะอย่างนั้น บางครั้งฉันถึงได้เคยคิดเรื่องแบบนี้เหมือนกันค่ะ"
10054080-120 = ""
10054080-122 = ""
10054080-123 = ""
10054080-124 = "สักวันหนึ่งถ้าฉันได้ดูแลเด็กสักคนร่วมกับคุณครู และเฝ้ามองเด็กคนนั้นเติบโตขึ้น..."
10054080-125 = "นั่นคงเป็นเรื่องที่มีความสุขมากแน่ๆ..."
10054080-126 = "[s] \"นะ... นั่นหมายความตามที่พูดเท่านั้นใช่มั้ย?!\""
10054080-127 = "ตายจริง ตายจริง จะเป็นยังไงกันนะคะ?"
10054080-128 = "คำตอบนั้น ฉันขอไม่ตอบให้ชัดเจนดีกว่าค่ะ"
10054080-129 = "นักเรียนหญิงมัธยมปลายก็ควรมีความลับอยู่บ้างไม่ใช่เหรอคะ?"
10054080-131 = "ใช่ และเพราะเหตุนั้น เราเองถึงได้เชื่อมั่นในตัวผู้ฝึกสอนชุนด้วยเช่นกัน"
10054080-132 = ""
10054080-135 = ""
10054080-136 = ""
10054080-137 = "อุ๊ย?"
10054080-138 = "สวัสดีค่ะ ท่านประมุข"
10054080-139 = "อืม จะเรียกเราเช่นนั้นได้หรือ?"
10054080-140 = "ที่นี่มีเพียงพวกเราเท่านั้นนี่คะ"
10054080-141 = "เรื่องนั้นก็จริงอยู่หรอก..."
10054080-142 = ""
10054080-143 = "[ns] \"ได้ยินว่าเด็กกลุ่มนั้นจะก่อเรื่องพรุ่งนี้เหรอ?\""
10054080-144 = "ใช่... พวกนั้นพูดไว้เช่นนั้น"
10054080-145 = "ช่างเป็นเด็กเมื่อวานซืนที่ไม่รู้จักฟ้าสูงแผ่นดินต่ำเสียเลย"
10054080-146 = "เอาเถอะ ในเมื่อได้ข้อมูลมาแล้วว่าอีกฝ่ายจะทำเช่นนั้น ก็เพียงเตรียมรับมือไว้ก็พอ เราแจ้งรูมิกับผู้คนในย่านร้านค้าไว้ล่วงหน้าแล้วด้วย"
10054080-147 = "พอมาคิดดูอีกครั้ง เราเองก็ไปลองนึกว่าเมื่อตอนอายุประมาณนั้น เราเคยซุกซนไม่รู้จักยั้งคิด#nถึงเพียงนั้นหรือไม่..."
10054080-148 = "อืม แม้เราจะคึกคะนองตามวัยอยู่บ้าง แต่ก็คงต้องบอกว่า อย่างน้อยเราก็ยังรู้จักยับยั้งชั่งใจ"
10054080-149 = "แต่โดยเนื้อแท้แล้ว... เราเองก็อาจไม่ได้แตกต่างกันนักก็เป็นได้"
10054080-150 = "ตายจริง ท่านประมุขเองก็ด้วยเหรอคะ?"
10054080-151 = "[ns] \"นั่นสินะ เรื่องนั้นครูจินตนาการไม่ออกเลย\""
10054080-152 = "ฮุฮุ มันมีคำกล่าวที่ว่า \"น้ำลึกหยั่งได้ แต่ใจคนหยั่งยาก\" อยู่ไม่ใช่หรือ"
10054080-153 = "หากคิดว่าความซุกซนของสาวมัธยมปลายเป็นเรื่องเล่นๆ ละก็ สักวันอาจได้เจ็บตัวหนักแน่ ครู"
