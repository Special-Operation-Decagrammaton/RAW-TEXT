[translation]
10054080-1 = "第8話;走在前方之人"
10054080-3 = ""
10054080-4 = "老師晚安，您正在散步嗎？"
10054080-5 = "[ns] 「旬……？」"
10054080-6 = "呵呵，是的。因為我剛好看見老師一個人往外走的身影。"
10054080-7 = "[s] 「不知道為什麼，突然想吹吹晚風。」"
10054080-8 = "哎呀，真巧呢。我也是這麼想的。"
10054080-10 = "（和旬並肩走在夜晚的溪邊）"
10054080-12 = "[ns] 「話說……」"
10054080-13 = ""
10054080-14 = "是，老師。"
10054080-15 = "我是怎麼再次變成「小旬」的……是嗎？"
10054080-16 = "呵呵。為了以防萬一，我事先拜託沙耶同學準備了備用的「祕藥」。"
10054080-17 = "聽說這次是改良過的版本。除了沒有副作用之外，解毒過程也很安全。"
10054080-18 = "雖然沙耶同學不太喜歡「解毒」這個說法就是了。"
10054080-19 = "[s]「這，這樣啊。」"
10054080-20 = ""
10054080-23 = "[ns] 「你說你見過那些孩子了對吧？」"
10054080-24 = "是的，沒錯。"
10054080-25 = "想知道我對他們的看法？"
10054080-26 = "……"
10054080-27 = "從各種意義上來說，感覺就是一群名副其實的孩子。"
10054080-28 = "您問這是什麼意思？#n唔嗯……應該就是字面上的意思吧？"
10054080-29 = "如果那些孩子有其他隱藏的意圖，或者刻意隱瞞什麼事的話，我反而還比較擔心……"
10054080-30 = "然而他們只是單純「因為想要而那麼做」……"
10054080-31 = "可以說是一群能輕易看穿心思，非常符合孩子本性的孩子。"
10054080-32 = "……不過他們發展的方向，在某種程度上確實有點偏差就是了。"
10054080-33 = "……"
10054080-34 = ""
10054080-36 = ""
10054080-37 = "老師，人們不是常說小孩子是純真的存在嗎？"
10054080-38 = "[s] 「是啊，確實很常聽見這種說法。」"
10054080-39 = "沒錯，這句話我也非常同意。"
10054080-40 = "但是所謂的純真，未必總是會往好的方向發展。"
10054080-41 = "[s] 「……可以再說得詳細一點嗎？」"
10054080-42 = "……"
10054080-43 = ""
10054080-45 = ""
10054080-46 = "其實孩子們有時也是會撒謊的。"
10054080-47 = "因為他們對於「說謊是不對的」這件事的認知還不夠成熟。"
10054080-48 = "所謂的純真，其實也意味著處事不夠圓滑。"
10054080-49 = "因為還不懂事，不知道自己的行為會被如何看待。"
10054080-50 = ""
10054080-52 = ""
10054080-53 = ""
10054080-54 = "所以會把內心的想法毫無掩飾地表現出來，同時也不善於偽裝或隱瞞。"
10054080-55 = "但是那其實只是一種特質，與善惡的概念相距甚遠。"
10054080-57 = ""
10054080-58 = "……正因為純真，有時才會不加思索地做出非常驚人的行為。"
10054080-60 = ""
10054080-61 = "當然孩子們既可愛又討人喜歡，還有著天使般的笑容。"
10054080-62 = ""
10054080-64 = ""
10054080-65 = "所以才讓人更想守護他們……"
10054080-66 = ""
10054080-68 = ""
10054080-69 = "……不過也正是因為這樣，才必須有人引導他們，教導他們該如何分辨對與錯。"
10054080-70 = "因為孩子們往往會將所見的一切，原封不動地全盤接收。"
10054080-71 = "……所以我有時也會覺得，面對孩子們是件可怕的事呢。"
10054080-72 = "[s] 「那種心情我好像能理解……但也有點意外。」"
10054080-73 = "呵呵，畢竟我也還是個學生嘛。"
10054080-74 = "不過會讓我感到害怕的……"
10054080-75 = "往往是在思考自己當下的言行，是否會將懵懂孩子的未來……帶往錯誤方向的時候。"
10054080-76 = "畢竟我終究是梅花園的教官。"
10054080-77 = "老師您應該也清楚，小孩在高中、國中……#n甚至是十歲左右的時候，往往都會變得不肯乖乖聽話。"
10054080-78 = "因為那正好是開始形成自身主見的時期。"
10054080-79 = "這其實是件值得高興的事。#n因為這代表他們的自我意識正在成長茁壯。"
10054080-80 = "不過在令人欣慰的同時，也或多或少會感到惋惜。"
10054080-81 = "明明還有好多事情想要教導他們……明明還有那麼多需要引導他們的事情……"
10054080-82 = "[ns] 「……就是說啊。」"
10054080-84 = "……"
10054080-85 = "老師，您對於「就是不行」這句話有什麼看法呢？"
10054080-86 = "雖然「就是不行」的情況其實並不常見，不過有時候也只能先用那種方式教導孩子。"
10054080-87 = "因為年幼的孩子們很難理解真正的理由，也容易只以自己的角度思考事情。"
10054080-88 = "所以當下只能先教導他們「就是不行」、「就是該這麼做」。"
10054080-89 = "期望孩子們將來能逐漸建立自己的價值觀，並自行領悟背後真正的原因。"
10054080-90 = "我認為教育孩子就是這麼一回事。"
10054080-91 = ""
10054080-93 = ""
10054080-94 = "替他們劃出界線、設立邊界，告訴他們什麼程度是安全的，超過的話就會有危險。"
10054080-95 = "不過那個過程……往往也很令人心痛呢。"
10054080-96 = "畢竟很多時候之所以出言制止，也不是因為喜歡才那麼做的。"
10054080-97 = "[s]「嗯……」"
10054080-98 = "即便如此，我還是認為這是必須要做的事。"
10054080-99 = "因為要是不這麼做的話，最終受害的反而會是孩子們。"
10054080-100 = "[s] 「這就是教育呢。」"
10054080-101 = "是的。"
10054080-102 = "這是一件非常重要的事情。"
10054080-103 = "然而大多數人卻往往不願意這麼做。"
10054080-104 = "因為那乍看之下，很容易被孩子們當作壞人。"
10054080-105 = "然而如果必須有人扮演那個角色……由我來承擔或許會比較好吧。"
10054080-106 = "畢竟我打從心底地喜歡孩子們呀。"
10054080-107 = "[s] 「你真的……很喜歡小孩子呢。」"
10054080-108 = "呵呵，那是當然的。"
10054080-109 = "……我不願看見孩子們誤入歧途，或是日後被人厭惡的模樣。"
10054080-110 = "至少在自己能力所及的範圍內，我希望孩子們最終都能成為「心地善良的人」。"
10054080-111 = "只要在那孩子長大之後，哪怕只是在腦海裡一閃而過也好……"
10054080-112 = "要是能夠明白「原來教官當年說的是這個意思啊」……我就心滿意足了。"
10054080-113 = "呵呵……這麼一想，我又再次對老師感到敬佩了呢。"
10054080-114 = "[s] 「怎，怎麼突然提到我！？」"
10054080-115 = "因為老師您正在指導的，是那些自認已經長大的高中生啊。"
10054080-116 = "那究竟是一件多麼困難的事……我不僅無法想像，甚至感到敬畏呢。"
10054080-117 = "[s] 「船到橋頭自然直嘛。」"
10054080-118 = "呵呵……這麼說也對。"
10054080-119 = "所以，我偶爾也會這麼想。"
10054080-120 = ""
10054080-122 = ""
10054080-123 = ""
10054080-124 = "如果有朝一日能跟老師一同養育孩子，見證他一步一步成長的身影。"
10054080-125 = "將會是件多麼幸福的事啊……"
10054080-126 = "[s] 「你，你說的應該是字面上的意思吧！？」"
10054080-127 = "哎呀哎呀，您覺得呢？"
10054080-128 = "那個問題的答案，我想先暫時保密。"
10054080-129 = "身為女高中生，還是保留一點神祕感比較好對吧？"
10054080-131 = "是啊。正因如此，妾身對於旬教官始終保持信任呢。"
10054080-132 = ""
10054080-135 = ""
10054080-136 = ""
10054080-137 = "哎呀？"
10054080-138 = "門主大人，晚安。"
10054080-139 = "唔，那個稱呼沒問題嗎？"
10054080-140 = "這裡只有我們而已呀。"
10054080-141 = "那倒是沒錯……"
10054080-142 = ""
10054080-143 = "[ns] 「聽說那些孩子明天打算要惹事？」"
10054080-144 = "是啊……的確是這麼說的。"
10054080-145 = "真是一群不知天高地厚的小鬼呢。"
10054080-146 = "既然已提前得知那群小鬼的計謀，只要加以防範便是。#n妾身也已知會瑠美與商店街的眾人。"
10054080-147 = "如今妾身也不禁回想，昔日的自己是否也和他們一樣恣意妄為……"
10054080-148 = "唔呣。儘管當時也有幾分血氣，多少還是明白最基本的分寸吧。"
10054080-149 = "……不過，或許本質上並無二致也說不定。"
10054080-150 = "哎呀，門主大人也會那樣嗎？"
10054080-151 = "[ns] 「是啊，總覺得難以想像呢。」"
10054080-152 = "呵呵，所謂「知人知面不知心」不是嗎。"
10054080-153 = "若是輕視了女高中生的玩心，終有一日會吃大虧的哦，老師。"
10054080-154 = "尤其在初生之犢不畏虎的懵懂時期，更是毋庸置疑。"
10054080-155 = ""
10054080-157 = ""
10054080-159 = "……如今想來倒也神奇。"
10054080-160 = "妾身明明仍有許多不足，根本談不上有資格引導或教導他人。"
10054080-161 = "然而卻被要求坐在門主或會長的位置上，扮演著那樣的角色。"
10054080-162 = ""
10054080-163 = "[ns] 「我會盡可能協助你的。」"
10054080-164 = "……呵呵。汝僅僅是存在於此，便是莫大的助力了……"
10054080-165 = "不，不對。刻意疏遠汝的善意，似乎也不合情理呢。"
10054080-166 = "[s] 「嗯，儘管交給我吧。」"
10054080-167 = "汝那句話，妾身可牢牢記住囉。"
10054080-168 = "那麼老師，不妨於此思索一番吧。"
10054080-169 = "若想幫助他人，不是應該先深入地了解彼此嗎？"
10054080-170 = "[s] 「好像還挺有道理的……？」"
10054080-171 = "沒錯，正是如此。"
10054080-172 = "身為門主，發言時往往必須時刻依循道理。"
10054080-173 = "在此之上，若想進一步加深對彼此的了解……"
10054080-174 = "難道不該花費更多時日朝夕相偕嗎？#n汝對此有何見解？"
10054080-175 = "[ns] 「咦，咦……？」"
10054080-176 = ""
10054080-178 = ""
10054080-179 = ""
10054080-180 = "怎麼了嗎，老師。"
10054080-181 = "妾身並沒有說錯什麼吧？"
10054080-182 = "因此，這番論述的結論應當如下。"
10054080-183 = "若老師有意助妾身……助山海經一臂之力。"
10054080-184 = "那麼往後於山海經多留些時日，豈不是更加合情合理嗎？"
10054080-185 = "[ns] 「中，中計了……！！！」"
10054080-186 = "哎呀，確實是這樣呢。"
10054080-187 = "而且每個人都曾經有過身為孩子的時光……"
10054080-188 = "要是老師能更常來梅花園看看，那就更好了呢？"
10054080-189 = ""
10054080-191 = ""
10054080-192 = ""
10054080-193 = "……旬教官，汝看似想自然地將老師的時間佔為己有呢。"
10054080-194 = "畢竟在某種意義上，老師的時間是屬於老師自己的吧？"
10054080-195 = "所以如果容我稍微任性一下的話，也可以說那是屬於我們全體學生的時間呢。"
10054080-196 = "唉，真是的。#n以口才而言，妾身總是勝不過旬教官啊。"
10054080-197 = "呵呵，那番話也是我想對您說的呢。"
10054080-198 = "罷了，真拿汝沒辦法。"
10054080-199 = "對了，老師。"
10054080-200 = "[s]「嗯？」"
10054080-201 = "您和心菜醬約好的夜間散步，可不能忘了哦？"
10054080-202 = "[s1] 「我當然記得。」\n[s2] 「對耶！差點忘了！」"
10054080-203 = "好的，謝謝您。"
10054080-204 = "呵呵。要是我沒提醒您，差點就要出大事了呢。"
10054080-206 = "（於是我們一邊輕聲交談，一邊繼續在夜色中漫步）"
10054080-207 = "（……回到住處的時候，已經是就寢的時間了）"
10054080-208 = ""
10054080-209 = "[ns] 「那麼，你們兩個都好好休息吧。」"
10054080-210 = "好的，老師您也是。"
10054080-211 = "畢竟明日將是有些繁忙的日子呢。"
10054080-214 = "……咳，咳。"
10054080-215 = ""
10054080-219 = "呼……"
10054080-220 = "……"
10054080-221 = "咳咳……"
