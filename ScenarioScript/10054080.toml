[translation]
10054080-1 = "Episode 8;One Who Walks Ahead"
10054080-3 = ""
10054080-4 = "Hello, Sensei. Were you taking a late-night stroll?"
10054080-5 = "[ns] \"Shun?\""
10054080-6 = "It's me. I happened to see you leaving your room. "
10054080-7 = "[s] \"I thought the fresh air would help clear my head.\""
10054080-8 = "What a coincidence. I was thinking the same thing."
10054080-10 = "Shun and I walked quietly along the riverbank for a while."
10054080-12 = "[ns] \"Random question...\""
10054080-13 = ""
10054080-14 = "Yes, Sensei?"
10054080-15 = "How did I become Shunling again?"
10054080-16 = "Haha. I'd asked Saya to make me some extra elixir, just in case. And it ended up coming in handy."
10054080-17 = "She's improved the formula, so there shouldn't be any side effects during the detoxification process."
10054080-18 = "Oops, but don't tell Saya. She didn't like me calling it \"detoxification.\""
10054080-19 = "[s] \"R-Right.\""
10054080-20 = ""
10054080-23 = "[ns] \"...So, you met with those kids?\""
10054080-24 = "Yes. I did."
10054080-25 = "...You're wondering how it went?"
10054080-26 = "..."
10054080-27 = "It felt like they were children, through and through."
10054080-28 = "I mean that as literally as I possibly could."
10054080-29 = "The situation would be more dire if they were operating from some sort of malicious intent..."
10054080-30 = "But they truly are simply acting exactly as pleases them. "
10054080-31 = "They were honest and straightforward. Simply put, they were children."
10054080-32 = "...Although their general mindsets could use some correction."
10054080-33 = "..."
10054080-34 = ""
10054080-36 = ""
10054080-37 = "People often think of children as \"pure.\""
10054080-38 = "[s] \"Yes, it's a common sentiment.\""
10054080-39 = "And it is true. They are."
10054080-40 = "However, purity isn't necessarily always a positive thing."
10054080-41 = "[s] \"...How so?\""
10054080-42 = "..."
10054080-43 = ""
10054080-45 = ""
10054080-46 = "You'd be surprised at how often kids will lie."
10054080-47 = "Because, even with lying, they have to be taught that bad things are bad."
10054080-48 = "They may lie, but that purity of theirs keeps it from becoming an act of cunning."
10054080-49 = "They fail to understand the effects of their actions on others, because they haven't experienced or learned that yet."
10054080-50 = ""
10054080-52 = ""
10054080-53 = ""
10054080-54 = "That's why it's so difficult for them to hide their feelings, or why they make for very bad liars."
10054080-55 = "It's simply how they are. Not good, not bad, just pure."
10054080-57 = ""
10054080-58 = "...Sometimes, that purity leads them to do terrible things, without considering the far-reaching consequences of their actions."
10054080-60 = ""
10054080-61 = "Of course, that doesn't make them any less adorable. Who can resist their cute, angelic little smiles?"
10054080-62 = ""
10054080-64 = ""
10054080-65 = "That's all the more reason why I wish to protect them as much as I can."
10054080-66 = ""
10054080-68 = ""
10054080-69 = "...And also why they require our guidance. They need someone to teach them what is acceptable within the bounds of society, not just their own feelings."
10054080-70 = "Children are better than anyone at accepting things exactly as they see them."
10054080-71 = "...It can make handling the little ones a daunting task at times."
10054080-72 = "[s] \"While I understand, I'm surprised to hear that from you.\""
10054080-73 = "Fufu. I am still a student, you know."
10054080-74 = "Hm, to elaborate, when I say \"daunting\"..."
10054080-75 = "It's because of the far-reaching effects of my own actions. One misstep on my part could accidentally lead an innocent child down the wrong path."
10054080-76 = "That's what comes with being an instructor at the Plum Blossom Garden."
10054080-77 = "You're well aware of how rebellious middle and high schoolers can be. It's actually not so different with ten year olds."
10054080-78 = "I would say that is around the age children start putting their feet down."
10054080-79 = "Not that I'm complaining. It's an important benchmark and shows us that their egos are developing."
10054080-80 = "It's a bittersweet feeling. I don't want them to leave the nest quite yet."
10054080-81 = "There's still so much I have to teach them, after all. I want to make sure they don't stray from the correct path."
10054080-82 = "[ns] \"...That, I can sympathize with.\""
10054080-84 = "..."
10054080-85 = "Sometimes, things just are the way they are, right, Sensei?"
10054080-86 = "It's rare, but it happens sometimes. That's when we have to tell children, \"Because I say so!\""
10054080-87 = "All the while, the real reason is that they're too young or selfish to understand."
10054080-88 = "That's why it instead becomes \"you just can't\" or \"you just have to.\""
10054080-89 = "Then we hope that, as they learn more about themselves and the world around them, they'll understand why we said that one day."
10054080-90 = "That's my philosophy when it comes to teaching children."
10054080-91 = ""
10054080-93 = ""
10054080-94 = "It's our job to draw boundaries where they don't know how to and to keep them from running headlong into danger."
10054080-95 = "But that process is hard on both parties...and heartbreaking at times."
10054080-96 = "They don't understand that we don't want to tell them no, or even why we are."
10054080-97 = "[s] \"That's true...\""
10054080-98 = "But sometimes guiding children means being the bad guy."
10054080-99 = "Too much leniency will only hurt them in the long run."
10054080-100 = "[s] \"They need proper discipline.\""
10054080-101 = "Yes."
10054080-102 = "It's very, very important."
10054080-103 = "At the same time, people tend to be hesitant to dole out discipline when it's needed most."
10054080-104 = "No one wants to take on the \"bad guy\" role."
10054080-105 = "If someone must do it... I don't mind it being me."
10054080-106 = "Because that's what's best for their growth."
10054080-107 = "[s] \"You really care about the children, don't you?\""
10054080-108 = "Fufu. Yes. Of course."
10054080-109 = "The last thing I want is for them to be led astray and become outcasts."
10054080-110 = "I hope that all of the children I teach can grow up to be good people."
10054080-111 = "And maybe one day, when they're all grown up..."
10054080-112 = "They'll have the small fleeting thought: \"That's what she meant when she said that.\" Wouldn't that be wonderful?"
10054080-113 = "Fufu... You know, Sensei, I respect you immensely."
10054080-114 = "[s] \"Wh-Where did that come from?\""
10054080-115 = "You teach high school students, who believe they know everything there is to know about the world."
10054080-116 = "I get shivers thinking about trying to do your job."
10054080-117 = "[s] \"You just feel your way through it.\""
10054080-118 = "Fufu... I see."
10054080-119 = "It makes me think..."
10054080-120 = ""
10054080-122 = ""
10054080-123 = ""
10054080-124 = "I'd love to raise a child with you one day... We could guide them to adulthood together."
10054080-125 = "That would be a dream come true."
10054080-126 = "[s] \"Y-You mean that in the literal-teacher sense, right?!\""
10054080-127 = "Oh my, my. Do I?"
10054080-128 = "Hm, I don't believe I need to answer that right now."
10054080-129 = "High school girls need to have their secrets, don't they?"
10054080-131 = "Which is precisely why I trust you as well, Instructor Shun."
10054080-132 = ""
10054080-135 = ""
10054080-136 = ""
10054080-137 = "Oh my?"
10054080-138 = "Welcome, Madam Kisaki."
10054080-139 = "Are we not to refrain from using my title here?"
10054080-140 = "It's just us at this moment."
10054080-141 = "I suppose so..."
10054080-142 = ""
10054080-143 = "[ns] \"So those kids intend on causing more trouble tomorrow?\""
10054080-144 = "Yes, that is their plan."
10054080-145 = "They seem to have no understanding of consequences or the effects of their actions."
10054080-146 = "However, knowing what their plans are, we need only prepare to subvert them. Rumi and the shopping street merchants have been made aware."
10054080-147 = "I cannot help but wonder if I was as insufferable at their age."
10054080-148 = "While I suppose I had the same childlike spirit, I still possessed a certain level of restraint."
10054080-149 = "...Although, in many ways, I was but a stone's throw from their kind of recklessness."
10054080-150 = "You, of all people, Madam?"
10054080-151 = "[ns] \"I can't picture that at all.\""
10054080-152 = "Fufu. You cannot judge a book by its cover, no?"
10054080-153 = "You really mustn't underestimate a scheming high school girl, Sensei. Lest you fall victim to her mischief."
10054080-154 = "And a mischievous child who knows no fear is far worse, by leaps and bounds."
10054080-155 = ""
10054080-157 = ""
10054080-159 = "...What a strange position I am in."
10054080-160 = "I am still but a bud, yet to blossom. I know nothing of guiding others."
10054080-161 = "Yet I must retain this facetious position and lead my academy."
10054080-162 = ""
10054080-163 = "[ns] \"I'll help you however I can, every step of the way.\""
10054080-164 = "Fufu. Your presence is more than enough."
10054080-165 = "...My apologies. I do not mean to, and should not, make light of your kind offer."
10054080-166 = "[s] \"You know where to find me, whenever you need.\""
10054080-167 = "And I shall not forget it."
10054080-168 = "I must pose a thought to you, merely for consideration."
10054080-169 = "A type of mutual understanding is required for people to effectively lend aid to one another, correct?"
10054080-170 = "[s] \"A textbook argument, yes...\""
10054080-171 = "Precisely."
10054080-172 = "To be in a position of power is to respect the established principles, yes?"
10054080-173 = "Therefore, if we two were to follow this line of reasoning..."
10054080-174 = "We must endeavor to increase our time spent together, must we not?"
10054080-175 = "[ns] \"H-Huh...?\""
10054080-176 = ""
10054080-178 = ""
10054080-179 = ""
10054080-180 = "Do you find issue with my proposal, Sensei?"
10054080-181 = "Was there any fault in my logic?"
10054080-182 = "No, there was not. There is only one conclusion to be drawn."
10054080-183 = "If you desire to help me—and all of Shanhaijing..."
10054080-184 = "You must spend more of your time in the Shanhaijing district."
10054080-185 = "[ns] \"I-I don't have any good rebuttals.\""
10054080-186 = "Because there are none. She makes an excellent point."
10054080-187 = "And seeing as all the students you teach used to be children at one point..."
10054080-188 = "Should you not also come by the Plum Blossom Garden to check on their progress more often, Sensei?"
10054080-189 = ""
10054080-191 = ""
10054080-192 = ""
10054080-193 = "...A very discreet way to claim Sensei's time for yourself, Instructor Shun."
10054080-194 = "Sensei's time is their own."
10054080-195 = "From a certain perspective, considering they are a teacher, it is also all of ours."
10054080-196 = "I must, as usual, acquiesce to you in this debate."
10054080-197 = "Fufu, I hardly feel like the winning party here."
10054080-198 = "That is up for debate as well."
10054080-199 = "Oh, Sensei."
10054080-200 = "[s] \"Hm?\""
10054080-201 = "Please don't forget to fulfill your promise to take Kokona out on a late-night walk together."
10054080-202 = "[s1] \"Of course I remember.\"\n[s2] \"Oh! Right!\""
10054080-203 = "As expected. Thank you, Sensei."
10054080-204 = "Fufu. That was a disaster waiting to happen."
10054080-206 = "We continued to walk in the quiet of the night, making conversation here and there as we went."
10054080-207 = "It was well past bedtime by the time we returned."
10054080-208 = ""
10054080-209 = "[ns] \"Get some sleep, you two.\""
10054080-210 = "You as well, Sensei."
10054080-211 = "I expect tomorrow to be quite eventful."
10054080-214 = "*cough* *cough*"
10054080-215 = ""
10054080-219 = "*inhale*"
10054080-220 = "..."
10054080-221 = "*cough*"
