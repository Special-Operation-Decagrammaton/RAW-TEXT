[translation]
80000011-1 = "로커의 러브송"
80000011-2 = "상점가의 음반 매장"
80000011-9 = "어라. <블랙 데스 포이즌>의 한정판 앨범이 나왔네."
80000011-10 = "이 시즌에는 신곡을 내는 일이 거의 없었는데. 한 번 볼까……"
80000011-14 = "발렌타인 데이를 겨냥한 러브송이라고?"
80000011-15 = "헤비메탈 그룹인 블랙 데스 포이즌이 어째서 그런 장르의 음악을 시도한 거지?"
80000011-16 = "으음…… 우선은 좋아하는 가수의 신곡이니 시험 삼아 구매해볼까."
80000011-17 = "저기, 이 음반을 사고 싶은데."
80000011-18 = "아. 블랙 데스 포이즌의 한정판 앨범, <사랑은 심장을 뽑아 쟁취하는 거야> 말씀이시군요."
80000011-19 = "해당 앨범은 발렌타인 데이를 맞아 발매된 한정판인 만큼, 앨범을 구매하시는 손님들께 특별한 경품을 증정하고 있습니다."
80000011-20 = "특별한 경품?"
80000011-21 = "네, 이 앨범을 구매하신 고객님에게는……"
80000011-26 = "이 소 해골 모양의 초콜릿을 사은품으로 증정해 드립니다!"
80000011-27 = "……."
80000011-28 = "어, 어라? 무슨 문제라도 있으신가요?"
80000011-29 = "아니, 너무 커서 당황한 것뿐이야."
80000011-30 = "네. 그럼 블랙 데스 포이즌의 신곡과 함께 즐거운 발렌타인 데이가 되시길 바라겠습니다."
80000011-35 = "일단은 엉겁결에 초콜릿을 받기는 했지만, 이걸 어떻게 처리하지?"
80000011-36 = "먹기에는 너무 양이 많고, 이걸 흥신소 사무실까지 들고 가져갈 수도 없고……."
80000011-37 = "[s] \"안녕, 카요코.\""
80000011-38 = "아, 선생님. 우연이네."
80000011-39 = "선생님도 이곳에 음반을 구매하러 온 거야?"
80000011-40 = "[s] \"응, 그런 셈이지.\""
80000011-42 = "[s] \"그나저나 엄청난 크기의 초콜릿이네.\""
80000011-43 = "그게…… 좋아하던 그룹의 앨범을 샀는데, 사은품으로 받아버려서."
80000011-44 = "나나 다른 흥신소 사원들이 먹기에는 양이 너무 많고. 그렇다고 버리자니 좋아하는 밴드의 사은품인지라, 어딘가 내키지가 않고……."
80000011-48 = "저…… 괜찮다면, 선생이 가져갈래?"
80000011-49 = "[s] \"좋아.\""
80000011-50 = "다행이다. 선생이 이 초콜릿을 받아주지 않으면 어떻게 하나 걱정했거든."
80000011-52 = "그…… 오늘이 발렌타인 데이이기는 하지만, 특별한 의미는 없으니까……."
80000011-53 = "다른 뜻으로 받아들이면 안 된다고, 선생?"
80000011-55 = "(이후 카요코가 준 거대한 소 해골 모양의 초콜릿을 받아 샬레로 돌아왔다.)"
80000011-56 = "(정교하게 조각된 초콜릿은 어쩐지 먹기가 아까워 장식용으로 벽에 걸어두었다.)"
