[translation]
1007903-1 = "천성적 분위기"
1007903-2 = "(싸움이 났다는 소리에 황급히 근교 공원의 뒤편으로 향했다.)"
1007903-3 = "(알려준 곳에 도착하니, 멀리서부터 곤란해하던 미사카의 목소리가 들려왔다.)"
1007903-5 = "아, 아니……. 그만들 하라고, 좀."
1007903-6 = "곤란하다니까……."
1007903-7 = "아까부터 이야기하잖아. 계속 이런 식으로 나오면 나로서도……."
1007903-10 = "[ns1] \"미사카!!\"\n[ns2] \"거기 멈춰! 무슨 일이야!!\""
1007903-17 = "……응? 선생님……?"
1007903-18 = "아아. 마침 잘 왔어, 그러잖아도 곤란하던 참이었거든."
1007903-19 = "선생님이 뭐라도 한마디 해 줘. 이 사람들 아까부터 계속 나를……."
1007903-20 = "[s3] \"그래. 우선 모두 진정해.\"\n[s4] \"무슨 일인지 모르지만 사이좋게…….\""
1007903-24 = "……'누님'이……라고 불러서……."
1007903-29 = "[ns5] \"……네?\"\n[ns6] \"지금 뭐라고…….\""
1007903-33 = "……어, 으음……. 보는 대로……."
1007903-34 = "그, 그렇지만……! 누가 봐도 '누님'이잖아요, 그 분위기는!"
1007903-35 = "맞아, 맞아. 나이가 무슨 상관이에요? 어차피 주요한 건 사람의 본질이지!"
1007903-36 = "게다가 방금 선생님한테…… 어른한테 그렇게 편한 말투를……!!"
1007903-37 = "그건 또 무슨 소리야……. 으으……."
1007903-38 = "……응? 선생님? 어떻게 된 거냐고?"
1007903-39 = "그게……. 말하자면 좀 긴데……."
1007903-40 = "간단하게 말하면 길 가다 좀 곤란해 보이길래 도와줬거든. ……전기로."
1007903-41 = "진짜 일 날뻔했지! 갑자기 공사하던 곳에서 철근이 떨어졌다고."
1007903-42 = "누님이 이상한 전기 능력으로 쏴 주지 않았으면, 이 녀석 크게 다쳤을걸!?"
1007903-43 = "그걸 누님께서……!! 콰앙!! 하고!!"
1007903-47 = "……아무튼."
1007903-48 = "그 뒤로 계속 이 모양이야. 왜 도와주냐고 묻길래 곤란한 사람 도와주는 데에 이유가 어디 있냐고 대답했더니……."
1007903-49 = "엄청 쉽게 말하시네요! 그게 그렇게 쉬운 일이 아니거든요!?"
1007903-50 = "더군다나 우리 같이 불량배로 낙인찍힌 사람을……. 오히려 일부러 그런 함정에 빠뜨리지나 않으면 다행이지!"
1007903-51 = "그러니까 내가 대체 그런 짓을 왜 하냐고……."
1007903-52 = "복장은 좀 특이하다고 생각했지만, 딱히 불량배일 거라고는 생각도 안 했고. 그냥 여기는 여기 나름대로의 특이한 복장이 있겠거니 했어."
1007903-53 = "그런 시선! 그런 취급도 처음이야! 편견 없는 시선!"
1007903-54 = "역시 누님으로 삼을 만한 분……!!"
1007903-58 = "[ns7] \"실랑이라도 생긴 줄 알았더니, 오해였구나.\"\n[ns8] \"나쁜 일 생긴 줄 알고 걱정했는데, 다행이야.\""
1007903-64 = "아니, 나빠. 충분히 나쁜 상황이라고!"
1007903-65 = "난 아직 중학생이란 말이야. 고등학생 상대로 누님 소리를 듣고 싶지 않아!!"
1007903-66 = "그러니까 나이는 중요하지 않대도요?"
1007903-67 = "괜찮으시면 다른 녀석들도 소개해 드릴까요? 누님만 원하시면……. 아니, 아까 전 그 신기한 능력으로 주변 일대를 콱……!!"
1007903-68 = "아아-! 그만!! 누가 들으면 주변 조직을 점거한 불량배 리더라도 되는 줄 알겠네!!"
1007903-69 = "더 이상 따라오지 마. 이건 경고야. 정말로 이 이상은 가만히 안 있을 테니까!!"
1007903-70 = "헉……. 역시 누님……. 그야말로 고독한 늑대……."
1007903-71 = "하, 하긴. 몰려다니는 건 저희같이 나약한 애들이나 하는 거니까……."
1007903-72 = "저희가 또 생각이 짧았군요……."
1007903-73 = "그러니까 그런 게 아니라고-!!"
1007903-74 = "선생님!! 역시 선생님이 한마디 해 줘! 선생님의 말이라면 듣겠지!"
1007903-78 = "……선생님?"
1007903-82 = "[ns9] 휴대전화 앱으로 밀린 업무를 본다.\n[ns10] \"미안. 잠시 일을 좀 하느라. 뭐라고 했어?\""
1007903-85 = "딴청 피우지 마-!!"
1007903-87 = "(이후 불량배들을 잘 설득해 돌려보냈다.)"
1007903-88 = "(겸사겸사 주변에서 섣부른 행동을 하지 않도록 약간의 훈계도 곁들였다.)"
