[translation]
2001306-1 = "블랙 앤 화이트"
2001306-2 = "(치히로의 보안 컨설팅 업무를 돕기 위해 함께 업무 지구의 한 개발 업체를 찾았다.)"
2001306-3 = "안녕하세요. <베리타스>의 카가미 치히로입니다."
2001306-4 = "서버 점검 대행 업무로 부르셨죠?"
2001306-5 = "……늦었잖아! 지금 시간이 몇 시인 줄 알아?!"
2001306-6 = "네? 하지만 점검은 분명 오후 10시에 시작한다고 들었습니다만……"
2001306-7 = "작업이 오후 10시에 시작한다고 해서, 이 바쁜 몸이 늦은 시간까지 너희를 상대해야 한다는 게 말이나 돼?"
2001306-8 = "고객이 불편하지 않도록 미리 사무실에 와서 기다리고 있었어야지!"
2001306-9 = "……실례했습니다. 다음번에는 불편하시지 않도록, 꼭 참고하겠습니다."
2001306-10 = "흥, 이래서 근본도 알 수 없는 해커 집단에게 일을 맡기기 싫은 거라니까."
2001306-11 = "실력은 어떨지 몰라도 비즈니스 매너라고는 조금도 찾아볼 수가 없으니……."
2001306-12 = "확인해야 할 내역은 책상 위의 서류에 모두 정리되어 있으니까 알아서 확인해."
2001306-13 = "혹시라도 허튼수작을 부릴까 하는 소린데…… 우리 회사의 서버실에는 실시간으로 로그를 발송하는 최첨단 감시 시스템이 설치되어 있거든?"
2001306-14 = "조금이라도 수상한 낌새가 보이면 바로 경고가 울릴 테니, 너희가 자주 치는 그 허튼 장난은 시도조차 하지 마."
2001306-15 = "물론입니다. 그럼 바로 작업 시작하겠습니다."
2001306-19 = "[ns] \"……괜찮아?\""
2001306-20 = "뭐 어쩔 수 없지. 손님을 상대하다 보면 별의별 사람이 다 있으니까."
2001306-21 = "게다가 '베리타스'라는 이름을 들으면 이유 없이 사나워지는 사람도 있거든."
2001306-22 = "……그 점에 대해서는 우리도 저지른 업보가 있으니 어쩔 수 없으려나."
2001306-23 = "여하튼 신경 쓰지 말고 일부터 하자. 밤은 짧으니까."
2001306-26 = "역시 웹 설정에는 큰 문제가 없네."
2001306-27 = "이제 남은 건 백업용 데이터를 복사하기만 하면……."
2001306-28 = "응? 이게 무슨 데이터지……?"
2001306-29 = "[s] \"무슨 문제라도 있어?\""
2001306-30 = "문제라기보다는…… DB에 예상치 못한 데이터가 잔뜩 들어 있어서."
2001306-31 = "이건…… 이 기업의 어플리케이션을 설치한 고객들의 개인 정보인데. 이걸 어떻게 수집한 거지?"
2001306-32 = "게다가 이쪽에는 장부에 기재되지 않은 수상한 거래 기록도 남아있고……."
2001306-33 = "잠깐 실례 좀 할까……."
2001306-37 = "……아하, 그렇군. 배포 중인 어플에 백도어를 심어서 몰래 정보를 수집한 거네."
2001306-38 = "그리고 이렇게 수집한 정보를 보험사에 팔아서 검은돈을 뒤로 챙겼군. 뻔한 수법이야."
2001306-39 = "[s1] \"그건 범죄 아냐?\"\n[s2] \"그럼 빨리 경찰에 신고해야지!\""
2001306-40 = "범죄는 맞긴 하지만…… 이걸 신고하는 건 또 다른 문제야."
2001306-41 = "범죄는 맞긴 하지만…… 이걸 신고하는 건 또 다른 문제야."
2001306-42 = "보안담당자가 클라이언트의 허가 없이 멋대로 서버를 뜯어 데이터를 얻어내는 건 똑같은 위법 행위니까. 경찰에 신고를 해도 증거로 채택되지는 못할 거야."
2001306-43 = "게다가 아무리 정의로운 행동이었다지만, 베리타스의 보안전문가가 멋대로 회사의 정보를 유출했다는 소문이 퍼져버린다면……"
2001306-44 = "우리를 믿고 일감을 맡기는 회사도 크게 줄어들겠지."
2001306-45 = "[s] \"그것 참……\""
2001306-46 = "……곤란한 일이네."
2001306-47 = "정말, 정말 곤란한 일이야……."
2001306-48 = "…………."
2001306-51 = "(다음 날 아침.)"
2001306-52 = "<속보입니다. 유명 앱 개발 업체의 사장 A 씨가 자사의 어플리케이션 코드 안에 몰래 백도어를 심어 사용자의 개인 정보를 수집하고 있었다고 합니다.>"
2001306-53 = "<이 사실은 익명의 해커가 온라인에서 해당 코드를 공개하며 밝혀졌고, 이로 인해 A 씨가 운영하는 기업의 주가는 크게 떨어져 파산 위기에 이르렀습니다.>"
2001306-54 = "<A 씨는 현재도 이 사실을 부정하고 있지만, 부정적으로 변한 여론을 되돌리기는 쉽지 않을 것 같습니다…….>"
2001306-58 = "[ns] \"……….\""
2001306-59 = "………."
2001306-60 = "[s3] \"……치히로?\"\n[s4] \"저거 네가 한 거야?\""
2001306-63 = "그, 그럴 리가 없잖아? 어제도 '최첨단 감시 시스템' 아래서 서버를 점검하느라 얼마나 애를 먹었는데."
2001306-64 = "키보토스 어딘가에 정의감에 불타는 실력 좋은 해커가 또 있었나 보지."
2001306-65 = "누군가 나 말고……."
2001306-69 = "[ns] \"……….\""
2001306-70 = "……미안. 내가 한 거 맞아."
2001306-71 = "범죄를 묵인하고 싶지도 않았고, 베리타스의 신용이 손상되는 것도 피하고 싶었지만…… 어쩐지 열이 뻗쳐서…… 이 방법밖에 생각나지가 않았어."
2001306-72 = "평소에는 해커 윤리를 지키라고 부원들에게 그렇게 잔소리를 해댔으면서. 정작 스스로는 사사로운 감정에 사로잡혀 담당 업체의 정보를 유출하기나 하다니……"
2001306-73 = "……나는 해커 실격이야."
2001306-74 = "……선생님. 혹시 실망했어?"
2001306-75 = "[s] \"……다음에는 제대로 할 거지?\""
2001306-79 = "[ns] \"치히로는 베리타스의 부부장이니까.\""
2001306-81 = "……어른이란 치사하네."
2001306-82 = "피는 못 속인다고…… 결국 나도 '베리타스'의 일원이었던 걸까."
2001306-83 = "결과적으로는 실패한 모양새가 되었고…… 앞으로는 후배들에게 부끄럽지 않도록 열심히 노력하는 수밖에."
2001306-87 = "……그러니까 이 사실은, 부원들에게는 비밀이야?"
