[translation]
901-1 = "세트의 분노"
901-3 = "괴로워…… 괴로워……."
901-4 = "……으, 으으……."
901-8 = "……."
901-9 = "만신의 성좌(Celestial pantheon)……?"
901-10 = "그것은……"
901-11 = "그것은 소인이 속해 있던 세계…… 그 판본에 기록되어 있는…… 초월적인 존재들입니다……."
901-12 = "지금 이곳의 개념과는 이질적인…… 히히히…… 네에. 초월적인 신격의 현현 그 자체."
901-13 = "이 존재들은 <신비>라던가 <공포> 따위로 표현하는 건 불가능합니다……."
901-14 = "……그래요. 굳이 말하자면 <숭고> 이전, 아니, 그 너머의 관념일까요…… 그것을 무엇이라고 불러야 할지는 모르겠지만……."
901-18 = "……."
901-19 = "그 성좌 중 하나인 <세트의 분노>…… 네에. 그래요."
901-20 = "잘 아시겠지만…… 이것은…… 사막과 폭풍과 번개 그 자체이기도 하며, 그 힘이 뜻하는 분노이기도 합니다……."
901-21 = "답변이…… 되셨을지……?"
901-22 = "그렇다면…… 이제 저를 내버려두세요……."
901-23 = "제 고행을 방해하지 말아 주세요……."
901-24 = "그럼……."
901-26 = "괴로워……."
901-27 = "괴로워…… 괴로워……. 으으……."
