[translation]
84312101301-5 = "그러고보니 정작 우리끼리는 제대로 인사 같은 걸 안 했네."
84312101301-6 = "작별인사 말인가요? 그다지 내키지는 않는데……"
84312101301-7 = "그리고 네루 당신이라면, 얼마든지 제 방 정도는 잠입해 들어올 수 있겠지요."
84312101301-8 = "뭐야, 대놓고 허락하는 거야? 티파티의 임원이 그래도 돼?"
84312101301-9 = "당연히 안 되죠. 그래서 \"잠입해 들어올 수 있다\"라고 표현한 거고요. 걸려도 모르는 척할 거예요."
84312101301-10 = "물론 이건…… 천하의 C&C 부장이 걸릴 거라고는 생각하지 않으니까 하는 말이지만요."
84312101301-11 = "하…… 참 나, 정말 사람 피곤하게 만드는 타입이네."
84312101301-12 = "이렇게 당돌한데 어째서 싫지는 않을까?"
84312101301-13 = "칭찬 감사해요."
84312101301-14 = "칭찬 아니거든."
84312101301-15 = "아무튼 뭐, 그래. 필요하면 부르라고. 네 말대로 그 정도 숨어들어 가는 건 일도 아니고."
84312101301-16 = "……후후. 좋아요."
84312101301-17 = "그 대답을 듣고 싶었어요."
