[translation]
2003105-1 = "따듯하게"
2003105-2 = "(시구레가 말한 우유 바텐딩이 궁금해서 그녀가 일하는 온천장으로 직접 찾아가 보았다.)"
2003105-8 = "아, 어서 와. 선생님."
2003105-9 = "안 그래도 방금 막 바텐딩 영업을 개시하려던 참이었어."
2003105-10 = "탕에 첫 손님이 들어간 지 1시간 정도 지났으니, 슬슬 후르츠 밀크를 찾는 손님이 찾아오지 않을까 싶어서."
2003105-11 = "[s] \"우유 바텐딩이라니…… 도대체 무얼 어떻게 하는 거야?\""
2003105-12 = "말 그대로야, 선생님."
2003105-13 = "목욕을 마치고 나온 손님이 후르츠 밀크를 주문하면 손님의 취향을 듣고 즉석에서 재료를 블렌딩해 최고의 후르츠 밀크를 내오는 거지."
2003105-14 = "다소 번거로운 방식이라 처음에는 이 온천장에서도 난색을 표했지만……"
2003105-15 = "내가 급여는 필요 없으니, 마음대로 음료를 만들 수만 있게 해 달라고 하니 며칠간 시험 삼아 허가를 해주었어."
2003105-16 = "나는 새로운 레시피를 잔뜩 시험해 볼 수 있고, 손님들은 최고의 후르츠 밀크를 마실 수 있으니…… 서로 이득 아니겠어?"
2003105-17 = "[s1] \"시구레가 즐겁다면 상관없지만……\"\n[s2] \"혹시 이상한 재료를 넣지는 않을까 조금 불안한 걸……\""
2003105-20 = "후후, 정 불안하면 그쪽에 앉아서 내가 일하는 걸 지켜봐."
2003105-21 = "우유의 준비도 끝났고, 믹싱 글라스와 머들러도 챙겼으니……"
2003105-26 = "자, 그럼…… 우유를 섞고 목욕물을 바꿔 줄 시간이군."
2003105-33 = "후우…… 좋은 탕이었어……"
2003105-34 = "다만 오랫동안 탕에 있었더니 조금 목이 마른 걸……"
2003105-35 = "저기, 혹시 후르츠 밀크 있나요?"
2003105-36 = "응, 있어. 어떤 맛의 후르츠 밀크로 줄까?"
2003105-37 = "여, 여러 가지 맛이 있는 건가요? 갑자기 그렇게 말씀하시니 조금 고민되는데……"
2003105-38 = "잘은 모르겠지만, 너무 달지 않은 맛으로 부탁드려요."
2003105-39 = "너무 달지 않은 맛이라…… 알겠어."
2003105-49 = "자, 세 가지 종류의 열매를 섞어서 만든 트리플 베리 밀크야."
2003105-50 = "단맛이 강하지 않은 링곤베리와 크랜베리를 섞어 블렌딩 한 뒤에 라즈베리로 식감을 살렸어. 어서 마셔봐."
2003105-51 = "어디……"
2003105-57 = "정말로 많이 달지 않네요. 열매의 산미도 우유의 고소한 맛과 섞여 자극적이지 않고……"
2003105-58 = "이런 고급스러운 맛의 후르츠 밀크는 처음 먹어보는 것 같아요!"
2003105-59 = "후후, 마음에 든 것 같아서 다행이네."
2003105-67 = "저기, 저는 위장이 좋지 않아서 우유를 마시면 언제나 배앓이를 하는데……"
2003105-68 = "혹시 제가 마실 수 있을 만한 후르츠 밀크도 있을까요?"
2003105-69 = "물론이지. 잠시만 기다려 줘."
2003105-80 = "자, 우유 대신 두유를 써서 만든 트로피컬 소이 밀크야."
2003105-81 = "거기에 소화에 도움이 되는 열대 과일을 넣어 부드러운 맛을 더했지."
2003105-87 = "정말이다…… 기름진 맛이 덜해서 이거라면 얼마든지 마실 수 있겠어요."
2003105-88 = "위장이 약한 저도 온천욕을 마치고 후르츠 밀크를 즐길 수 있다니, 꿈만 같네요……!"
2003105-89 = "아무리 맛있어도 너무 많이 마시면 배탈이 날 수 있으니까. 오늘은 이 한 잔으로 만족하도록 해."
2003105-97 = "피곤해…… 선도부 일로 지쳐서 그런지, 온천에 들어갔다 나왔는데도 피로가 여전한 것 같아……"
2003105-98 = "뭔가 마실 만한 것 좀 받을 수 있을까?"
2003105-99 = "음, 몸 상태가 그렇다면……"
2003105-106 = "자, 요괴 MAX 후르츠 맛이야."
2003105-110 = "[ns] \"이건 후르츠 밀크도 아니잖아……?\""
2003105-111 = "훌륭한 바텐더라면 손님의 상태에 맞추어 어떤 음료라도 제공할 줄 알아야 하니까."
2003105-112 = "단기간에 피로를 가시게 하려면 역시 후르츠 밀크보다는 에너지 드링크지!"
2003105-118 = "예상과는 다른 게 나오긴 했지만…… 마시고 나니 조금은 기운이 돋는 것 같네."
2003105-119 = "지금의 내게 가장 필요했던 거였어. 신경 써줘서 고마워."
2003105-120 = "별말씀을."
2003105-122 = "(시구레의 바텐딩은 큰 호평을 받아, 많은 손님들이 다양한 종류의 후르츠 밀크를 주문하기 위해 계속해서 휴게실을 찾았다.)"
2003105-123 = "(시구레의 바텐딩을 지켜보느라 시간 가는 줄 모르고 계속 온천장에 머물렀다……)"
2003105-126 = "[ns] \"이런, 큰일인 걸……\""
2003105-128 = "왜 그래, 선생님?"
2003105-129 = "……응? 내가 일하는 모습을 지켜보다가 샬레로 돌아가는 막차 시간을 놓치고 말았다고?"
2003105-130 = "뭘 그렇게 고민하는 거야? 여기는 온천장이잖아."
2003105-131 = "객실이라면 충분히 있으니까, 하루 묵었다가 내일 돌아가면—"
2003105-135 = "저기…… 미안하지만, 시구레. 오늘은 남은 방이 없어."
2003105-136 = "오늘 바텐딩을 경험한 손님들이 내일도 시구레의 후르츠 밀크를 맛보고 싶다고 숙박을 연장하셔서 말이야……"
2003105-137 = "이런…… 생각한 것 이상으로 의욕을 내버렸나."
2003105-141 = "어쩌지, 선생님? 추가로 묵을 수 있는 객실이 없다고 하는데."
2003105-142 = "하지만 오늘처럼 추운 날씨에 선생님을 밖에서 자도록 놔둘 수는 없고……"
2003105-147 = "아, 그럼 내 숙소에서 자고 가는 건 어때?"
2003105-148 = "[s] \"시구레의 숙소……?\""
2003105-149 = "응. 온천장에서 일하는 종업원들에게 제공되는 직원용 숙소가 따로 있거든."
2003105-150 = "조금 좁기는 하지만 밖에서 새우잠을 자는 것보다는 훨씬 괜찮을 거야."
2003105-151 = "[s3] \"다른 방법은 없는 것 같으니……\"\n[s4] \"그럼 하룻밤만 실례할게.\""
2003105-154 = "후후, 잠시만 기다려 줘. 금방 치우고 방으로 안내해 줄게."
2003105-157 = "후후, 작지만 생각했던 것보다 훨씬 아늑하지?"
2003105-158 = "침구는 이쪽에 미리 깔아 두었어. 여기서 자면 돼."
2003105-161 = "[ns5] \"저기…… 시구레 양?\"\n[ns6] \"어쩐지 이불이 한 장뿐인 것 같은데……\""
2003105-164 = "응? 그야 당연하잖아. 애초에 한 사람을 위해 준비된 침실이니까."
2003105-165 = "이불이 조금 작긴 하지만, 사이좋게 붙어서 누우면 두 사람은 충분히 덮을 수 있고……"
2003105-168 = "……그러니까 이제 선생님에게 남은 선택지는 딱 하나뿐이야."
2003105-173 = "[wa:650]― [log=시구레 온천ND]자, [wa:130]선생님.[/log]"
2003105-174 = "[wa:1000]― [log=시구레 온천ND]이불 바깥은 [wa:660]춥지?[/log]"
2003105-177 = "[wa:200]― [log=시구레 온천ND]고집부리지 말고 [wa:900]이리로 와.[/log] [wa:100]"
2003105-180 = "[wa:700]― [log=시구레 온천ND]이불도 [wa:480]푹신푹신하고, [wa:1380]따듯하다구?[/log]"
2003105-183 = "― [log=시구레 온천ND]이 안이라면 [wa:450]금방 잠들 수 있을 거야.[/log]"
2003105-186 = "[wa:900]― [log=시구레 온천ND]혹시 [wa:700]이불을 덮어도 [wa:850]춥다면……[wa:280] [/log]"
2003105-189 = "― [log=시구레 온천ND]내가 대신 탕파가 되어줄 테니까.[/log] [wa:860]"
2003105-192 = "[wa:450]― [log=시구레 온천ND]응? [wa:1000]원래 있던 [wa:660]탕파……?[/log]"
2003105-195 = "[wa:300]― [log=시구레 온천ND]그러니까…… [wa:1650]전부, [wa:1520]마셔버렸어.[/log]"
2003105-198 = "[wa:680]― [log=시구레 온천ND]그게, [wa:1060]이불 안이 말이야,[/log]"
2003105-199 = "[wa:1520]― [log=시구레 온천ND]모르스를 덥히기에 [wa:1160]딱 좋은 온도여서.[/log]"
2003105-202 = "[wa:100]― [log=시구레 온천ND]아까 일하던 중에[/log]"
2003105-203 = "[wa:1800]― [log=시구레 온천ND]탕파의 내용물을 [wa:870]특제 모르스로 [wa:630]바꾸어 두었거든.[/log]"
2003105-206 = "[wa:480]― [log=시구레 온천ND]그래도 [wa:560]어쩔 수 없잖아?[/log]"
2003105-209 = "― [log=시구레 온천ND]이렇게 되었으니[/log]"
2003105-210 = "[wa:1320]― [log=시구레 온천ND]몸을 덥힐 만한 [wa:2020]다른 수단도 없고.[/log]"
2003105-213 = "― [log=시구레 온천ND]그러니까 오늘 밤은[/log]"
2003105-214 = "[wa:1300]― [log=시구레 온천ND]선생님이 [wa:980]탕파가 되어줘.[/log][wa:520]"
2003105-219 = "[ns] 탕파 속의 모르스를 마신다."
2003105-222 = "……응? 갑자기 뭐 하는 거야, 선생님?"
2003105-223 = "갑자기 모르스를 들이키다니…… 혹시 목이 말랐었던 거야?"
2003105-224 = "[s7] \"……이 모르스, 아무래도 발효된 것 같아.\"\n[s8] \"묘하게 옅은 술 냄새가 나는걸.\""
2003105-227 = "뭐? 그럴 리가 없어."
2003105-228 = "이 모르스에는 발효에 필요한 효모도 설탕도 넣지 않았는걸."
2003105-229 = "게다가 담근 지 하루밖에 지나지 않았는데 알코올이 만들어질 리가……"
2003105-230 = "[s9] \"아니, 몸에 열이 나는 걸 보니 확실해……\"\n[s10] \"이 음료는 술이 분명해!\""
2003105-236 = "[ns11] \"술기운 탓인지 열이 나서 이불은 필요 없겠어.\"\n[ns12] \"이불은 시구레 혼자 덮고 자도록 해.\""
2003105-239 = "호오, 그렇게 빠져나가겠다는 건가……"
2003105-240 = "뭐, 알겠어. 선생님이 덥다는데, 내가 억지로 이불 안으로 끌어당길 수는 없으니까."
2003105-241 = "대신, 이불 한쪽은 밤새도록 계속 비워둘 테니까…… 추워지면 언제든 들어와야 해?"
2003105-243 = "(이후, 차가운 다다미 위에서 몸을 웅크린 채 간신히 밤을 지새웠다……)"
2003105-244 = "(다행히 아무 일도 없었지만, 추운 곳에서 잠이 든 탓인지 이후 가벼운 감기에 걸리고 말았다.)"
