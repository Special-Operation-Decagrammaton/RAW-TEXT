[translation]
10018030-1 = "제3화;이걸로 끝이라고 생각하지 마라!"
10018030-2 = "헉, 헉……! 너희들, 대체 뭐야!"
10018030-3 = "거기에 대해서는, 제가 대답을 드려야겠군요."
10018030-4 = "미식의 극의를 찾아 떠나는 외로운 순례자들. EAT or DIE."
10018030-6 = "맛있는 것을 먹기 위해서라면 어떤 고난도 두려워하지 않는다. 게헨나의 미식연구회입니다."
10018030-12 = "미식연구회?! 진짜냐?!"
10018030-13 = "먹기 위해서라면 불바다에 뛰어드는 것도 불사한다는?"
10018030-15 = "?!"
10018030-17 = "아니야."
10018030-18 = "내가 듣기로는 이미 불바다쯤은 극복했다고 들었어. 다 먹어 치워서."
10018030-25 = "아, 그래서인가. 아무리 많은 음식도 먹어 없앨 수 있다는 소문이 도는 게."
10018030-27 = "?!"
10018030-29 = "그러다 저주받은 나머지 중요할 때마다 아무것도 먹을 수 없게 되었다는 말도 있던데?"
10018030-35 = "아, 아무튼!"
10018030-36 = "그 우리보다 지독하다는 테러리스트 미식연구회가 왜 여기에 있는 거지?"
10018030-37 = "뭐야, 테러리스트라니!"
10018030-38 = "우린 그냥 맛집 순례를 하는 거야! 그 과정에서 약간 사소한 문제들이 발생할 뿐이고!"
10018030-39 = "미식연구회는 양심이 없다더니, 진짜였던 모양이군. 무서운 것들……"
10018030-40 = "아무튼! 너희가 여기에서 우리를 방해할 권리는 없어!"
10018030-41 = "맞아, 맞아! 법과 계약은 우리 편이니까!"
10018030-42 = "여기 주인장이 가게를 비우기로 한 기간이 다 돼 간다고!"
10018030-43 = "약속을 지키라고 알려 주는 게 문제 되는 건 아니잖아?"
10018030-44 = "그래, 그래! 우린 그저 잊기 쉬운 사항을 일깨워 주러 온…… 친절한 이웃 같은 거라고!"
10018030-46 = "재미있는 말을 하는군요."
10018030-47 = "요즘 친절한 이웃은 헬멧을 쓰고 주인을 협박하는 모양이죠?"
10018030-48 = "그, 그게 뭐 어때서! 살다 보면 그런 방법을 쓸 수도 있지!"
10018030-49 = "그보다, 어째서 냐오푸드와의 문제에 당신들 구르메 헬멧단이 끼어드는 거죠?"
10018030-50 = "이건 냐오푸드와 구르메 헬멧단 사이에 모종의 관계가 있다고 봐도 되는 건가요?"
10018030-54 = "어……? 이거, 우리가 나서면 안 되는 일이었던 거 아냐?"
10018030-55 = "윽?! 마, 망했다! 이게 윗선에 보고가 들어가면, 우린……!"
10018030-56 = "아니, 잘 생각해 봐. 목격자가 없으면 완전범죄야."
10018030-57 = "그래, 그렇군! 아무도 무언가를 못 본 것으로 만들면 되겠네!"
10018030-58 = "이젠 현실을 인식하는 능력까지 떨어진 것 같군요."
10018030-59 = "조금 전까지 저희들에게 손끝 하나 대지 못했던 분들이, 뭐라고요?"
10018030-60 = "헷헷헷…… 우리 같은 사람들이 태도를 바꿀 때는, 그럴 만한 이유가 있기 때문이지."
10018030-61 = "이유……?"
10018030-62 = "그래! 너희들도 이제 무사하지 못할 거다!"
10018030-71 = "무슨 일이야! 왜 갑자기 긴급 호출하고 그래?"
10018030-72 = "부르니까 오긴 왔다만, 빨리 처리하고 들어가 쉬자고."
10018030-74 = "증원인가요?"
10018030-75 = "그렇군요. 이해했습니다."
10018030-77 = "이제 알았냐?"
10018030-78 = "함부로 우리 구르메 헬멧단에게 덤볐다간, 험한 꼴을 당하게 될 거라는 걸!"
10018030-80 = "아뇨……"
10018030-81 = "이해한 것은 당신들도 맛없는 요리를 내세우는 식당 같은 사람들이란 것입니다."
