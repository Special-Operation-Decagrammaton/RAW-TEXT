[translation]
10050050-1 = "제5화;겨울왕국의 공녀님"
10050050-2 = "어딘가의 체육관"
10050050-4 = "자, 자. 줄 서 주세요! 아직 재고는 많이 남아 있으니까요!"
10050050-8 = "너무 큰소리를 내시면 안 된답니다? 질서를 지킬수록 더욱 빠르게 구매할 수 있어요. 기밀에도 주의해 주시고요."
10050050-11 = "트리니티 분들이 판매원을 자처해 주신다니, 이것이 문화의 힘이 아닐까요? 힛. 힛. 히."
10050050-12 = "그렇지요. 문화…… 소프트파워의 가장 큰 위력은, 자발적인 행동을 이끌어내는 매력에 있으니까요."
10050050-13 = "……이왕 트리니티까지 온 김에, 키보토스 최대 규모를 자랑한다는 중앙 도서관이나, 그 안에 숨겨져 있다는 고서관도 가 보고 싶지만요."
10050050-14 = "뭐, 언젠가 또 기회가 있겠죠. 확실히 타카네는 평론가로서 트리니티의 장서에도 관심이 많겠군요."
10050050-15 = "부장님은 안 그러신가요?"
10050050-16 = "전혀요. 그걸 제가 마음대로 거래해서 매출을 올릴 수 있다면 이야기는 또 달라지겠지만……."
10050050-17 = "저는 가능성 없는 것들에게 그렇게까지 관심을 할애하고 싶지는 않아서요."
10050050-18 = "……그런 것 치고는 편집과 수정 활동은 열심히 하시면서……."
10050050-19 = "편집과 수정이 아니에요. 원석을 깎아서 보석을 만드는 거라고요. 상품 가치의 재발견이라 이겁니다."
10050050-20 = "그리고 그 연장선상에서…… 타카네 역시 제 몫을 해 주길 기대하고 있고요!"
10050050-21 = "으, 윽……! 그걸, 또 해야 하나요……?"
10050050-22 = "정 하고 싶지 않다면, 저도 강요할 방법은 없습니다만……. 이미 충분히 소문나지 않았던가요?"
10050050-23 = "공. 녀. 님?"
10050050-24 = "햐읏?!?!"
10050050-26 = "아, 맞아요. 타카네 공녀님! 이번 3권과 4권에 대한 관점을 들려주실 수 있나요?"
10050050-27 = "네, 네네네네네네에? 아, 알겠어요. 제 미천한 의견이 도움이 되신다면……."
10050050-28 = "되고 말고요! 애초에 이 작품 자체가 트리니티에서는 좀처럼 찾아보기 힘든……."
10050050-29 = "붉은겨울 특유의, 뭔가 끈끈하고 야성적이며 현실 그 자체를 그려내면서도."
10050050-30 = "마침내 아름다움을 놓지 않으려는, 그 어떤 의지 같은 것이 느껴지기에 모두가 이렇게 좋아하는 것인걸요!"
10050050-31 = "그리고 그 '낯선 부분'에 대해, 가장 공신력을 갖고 이야기를 나눠 주실 수 있는 분이야말로, 타카네 공녀님뿐이고요!"
10050050-32 = "그, 그그그그, 그렇게 봐주시면, 저는 황송한 나머지 몸 둘 바를 모르겠습니다만……."
10050050-33 = "어쩜. 사용하는 어휘까지도 이렇게 고상하신지! 역시 붉은겨울…… 아뇨, 겨울 왕국의 공녀님은 몸과 마음가짐부터 다르신 것 같아요!"
10050050-35 = "도대체 어떻게 할 거예요, 부장님! 전 그냥 붉은겨울의 평범한 학생 중 한 명일 뿐이라고요?!"
10050050-36 = "도대체 어쩌다가 제가, '붉은겨울의 몰락한 가문의 막내 영애'라는 설정으로 활동해야 하는 거죠?"
10050050-37 = "간단한 것을 묻는군요, 타카네. 그거야 당연히……."
10050050-38 = "그러는 편이 판촉에 도움이 되기 때문입니다!"
10050050-39 = "듣기로는 공녀님께선 붉은겨울의 유력한 가문의 4녀 중 막내였다고 하셨죠?"
10050050-40 = "설명하기 어려운 일에 휘말려 가문이 몰락하고……"
10050050-41 = "모두가 퇴학 선고를 받고 붉은겨울 밖으로 추방당하셨다니…… 듣는 저도 가슴이 아플 지경이에요……"
10050050-42 = "네, 네에. 그렇게 생각해 주신다면, 저로서도 감사하다고밖에 말씀드릴 수, 없겠네요……."
10050050-43 = "하지만 충성스러운 수행원의 도움으로, 타카네 공녀님만 신분을 위장하고 남는 데에 성공하셨다니…… 대단하셔요!"
10050050-44 = "책에서나 볼 수 있었던 파란만장한 인생사를 직접 겪으셨고, 그런 분과 이야기를 나눌 수 있다니……."
10050050-45 = "진심으로 영광이에요!"
10050050-46 = "(그거야 당연히 책에서 본 이야기를 바탕으로 꾸며낸 것이니까 그렇죠!)"
10050050-47 = "세 언니분의 일은 정말로 유감이에요……. 이름의 머릿글자만 따서 'OAMT'라고 일기장에 쓰셨을 정도로 사이가 좋으셨는데, 결국은……."
10050050-48 = "사진도 취미라고 하셨죠? 다음에 보여 주세요!"
10050050-49 = "(다른 건 다 엉망이지만, 그거 하나는 진실이긴 하죠……. 하아…….)"
10050050-50 = "사실 전문적인 평론을 들은 것은 처음이에요. 그런데 그걸 공녀님의 세련된 말로 현장에서 들을 수 있다니……."
10050050-51 = "저희는 정말로 행운이네요! 혹시 나중에 공녀님의 평론집 같은 것이라도, 출간해 보실 생각 없으신가요?"
10050050-52 = "호오, 이것은 또 비즈니스의 예감이……?"
10050050-53 = "정말 하지 마세요!!!"
10050050-55 = "저, 저기…… 친구에게 비밀리에 소식을 듣고 왔는데……. 괜찮, 을까요……?"
10050050-56 = "괜찮고말고요. 자, 자. 이런 건 원래 처음부터 시작해 보는 겁니다. 한 권, 어떠세요?"
10050050-57 = "그, 그러면 감사히……."
10050050-58 = "……!"
10050050-59 = "파, 파, 파, 파렴치해요–!!!"
10050050-64 = "어, 어떡하죠, 부장님?! 괜찮은 걸까요?"
10050050-65 = "아~ 괜찮아요. 괜찮아. 저거 분명 저러다 돌아와요. 이건 출판부장으로서의 직감입니다."
10050050-66 = "정말, 그러려나요……."
10050050-73 = "세상에……."
10050050-74 = "힛. 힛. 히."
10050050-75 = "저기, 제가 딱히, 정말로 다음 내용이 궁금하다거나 신경쓰인다거나 그래서 이러는 건 아닌데요……."
10050050-76 = "그냥, 한번 시작했으니까 끝까지 가 봐야 하지 않을까, 하는 어떤 사명감 같은 게 들어서 그러는 건데요……."
10050050-77 = "네, 네. 물론이죠. 다 이해합니다. 손님."
10050050-78 = "네……. 이해해 주셔서 감사해요. 다음 내용도…… 있나요?"
10050050-79 = "물론이죠. 모든 이야기는 이어져야 하는 법이잖아요? 쇼가 계속되어야 하는 것처럼요."
10050050-80 = "오히려 저희로서도 이렇게 직접 찾아와 주셔서, 사명감을 보여주시는 것에 감사드려야 할 것 같고요."
10050050-81 = "그, 그렇게 생각해 주시니 감사해요."
10050050-82 = "뭘요. 이 책이 그저 붉은겨울에 남겨져 있었다면, 거의 누구에게도 숨은 가치를 평가받지 못하고 잊혔겠죠."
10050050-83 = "……시장이라는 링에 올라서, 제대로 펀치 한번 날려 보지 못하고요."
10050050-84 = "시합이라도 해 보고 패배하면 속이라도 시원하지, 첫 기회조차 받지 못하는 것은 조금 슬픈 일이 아닐까요."
10050050-85 = "그건 확실히 그럴 것 같아요……."
10050050-86 = "네! 그런 손님께는 세 권이 아니라, 두 권 사시는 걸 권유해 드리겠습니다. 어떠실까요?"
10050050-87 = "하, 하지만 여기에서는 세 권을 사는 게 암묵적인 약속이라고……."
10050050-88 = "그렇지만 포교는 조금 쑥스러워서 하기 힘들잖아요? 두 권으로 충분하지 않으시겠어요?"
10050050-89 = "그, 그러면 그렇게 해도 될까요……?"
10050050-91 = "……그리하여, 삶의 어떤 부분은 배척하고, 어떤 부분은 받아들인다는 것은 그 자체로 모순을 낳을 수밖에 없습니다."
10050050-92 = "오히려 어딘가 부끄러운 느낌이 들고, 드러내어 이야기하기 어려운 것이야말로 우리의 본질을 더욱 잘 설명하고 있는 것이 아닐까요?"
10050050-93 = "가령 사랑은 드러내놓고 이야기하기 어려운 무엇인가로 흔히 이야기됩니다. 그렇지만 모두에게 필요한 감정이라는 것은 주지의 사실이죠."
10050050-94 = "사랑이 없었다면…… 여기에 계신 모두는 애초에 존재할 수 없었을 테니까요."
10050050-95 = "또한 우리의 몸에 관한 것도 마찬가지입니다. 옷 아래의 이야기에 대해서는 적나라하게 이야기하지 않는 것이 숙녀의 소양이라고도 하지만……."
10050050-96 = "그럼에도 불구하고, 우리는 분명 몸을 가지고 살아가는 존재들이니까요."
10050050-97 = "따라서 이 책은, 그런 모순되었지만 어쩔 수 없이 우리가 이끌리게 되는 대상들에 대해, 차라리 진솔하면서도 적극적인 대화를 시도하는 것으로."
10050050-98 = "우리를…… 보다 나은 인식의 지평으로 인도하고자 하는, 순수하기까지 한 의지가 담긴 결정체라고도 할 수 있겠죠."
10050050-99 = "꺄아아아아악!"
10050050-100 = "멋져요, 공녀님!"
10050050-101 = "역시 고귀하신 분은 다르세요!"
10050050-102 = "우리는 조금 더 스스로에게 솔직해져도 되는 거군요?"
10050050-103 = "(속이 쓰려서 죽을 것 같아요…….)"
10050050-108 = "호황이로군요……."
10050050-109 = "하지만 어딘가 모자란다는 느낌이 든단 말이죠? 뭔가 더 확실한 건수가 없으려나……."
10050050-110 = "저기, 혹시 이런 내용의 책 없나요?"
10050050-111 = "어떤 내용 말씀이시죠?"
10050050-112 = "그러니까……."
10050050-116 = "으음. 아쉽게도 그 내용과 딱 들어맞는 책은 아직 없는데 말입니다……."
10050050-117 = "그런가요……."
10050050-118 = "가만, 아직 없다. 아직 없다……. '아직'은……?"
10050050-119 = "잠시만 기다려 주세요. 어떻게든 될 것 같거든요!"
10050050-120 = "정말인가요?!"
10050050-121 = "그 전에, 작품 기획서를 좀 써 주시겠어요?"
10050050-122 = "기획서요……? 저 그런 거 써 본 적 없는데……."
10050050-123 = "괜찮아요. 오히려 좋아요. 두 줄 정도면 됩니다. 이런 캐릭터가 있으면 좋겠고, 거기에 이런 내용이 있으면 좋겠다 정도로요."
10050050-124 = "아, 알겠어요."
10050050-129 = "뭐야, 야쿠모. 갑자기 또 안 팔리게 됐다거나 그런 건 아니겠지?"
10050050-130 = "뭐…… 사실 어제까지의 판매 대금으로도 어느 정도 살 만하게 됐지만 말이야. 일단 고맙다는 말을 해 둘게."
10050050-131 = "메루가 스스럼없이 감사 인사를 하다니, 이건 또 드문 일이군요. 그리고 판매 상황은 여전히 호조 상태니까 걱정하지 않아도 돼요."
10050050-132 = "그보다, 들어 봐요. 지금부터 기획서 간단하게 하나 보낼 겁니다. 그러니까 그걸 적당히 만들어 줘요. 빠를수록 좋아요."
10050050-133 = "어? 내가 왜. 너 또 이상하게 돈벌이하려고 그러지?"
10050050-134 = "잘 들어 봐요. 지금 현장에서 작품 리퀘스트를 받고 있거든요? 그걸 빠르게 만들어서 공급하면, 부르는 대로 값이 나갈 거라고요!"
10050050-135 = "……결국 커미션 같은 거잖아. 그거 엄청 귀찮거든? 이래라저래라 요구사항은 많고, 겨우 완성하면 이게 아니라고 그러고……."
10050050-136 = "아뇨. 반대입니다. 오히려 그렇기 때문에 기획서를 두 줄 정도로 러프하게 받았다고요. 물론 당연히 이런저런 부분이 모자라겠죠."
10050050-137 = "그리고 그 빈 부분은 모두…… 메루가 하고 싶은 대로 채워 넣으면 되는 겁니다!"
10050050-138 = "그래서 고객이 만족하겠냐!"
10050050-139 = "할 걸요? 왜냐하면 타카네가 전부 말로 그럴듯하게 설득…… 아뇨, 평론해 줄 테니까요."
10050050-141 = "제가요?!"
10050050-142 = "생각해 봐요, 메루. 이거 어떤 의미로는 오리지널이라고요? 언제나 오리지널 작품, 만들고 싶어 하지 않았나요?"
10050050-143 = "!!!"
10050050-144 = "그, 그건. 그런데……."
10050050-145 = "물론 100% 오리지널은 아니긴 하죠. 저도 압니다. 하지만 요구 사항은 두세 줄 정도고, 그 나머지를 메루가 자기 의지대로 채울 수 있다면……."
10050050-146 = "그건 이미 어느 정도 오리지널에 가까운 작품이 아닐까요? 그보다, 왜, 첫술부터 배부를 수는 없다고 하지 않습니까."
10050050-147 = "메루의 진정한 목표를 향한 첫걸음을, 이렇게 시작하는 것도 나쁘지 않을 것 같은데요?"
10050050-152 = "할래!"
10050050-153 = "좋아요. 성립이군요. 가능한 한 빠른 진행 부탁할게요."
10050050-154 = "날 뭐로 보는 거냐! 지금부터 작업하러 갈 거니까 끊어!"
10050050-158 = "이걸로 또 한 건 해결이군요. 힛. 힛. 히."
10050050-159 = "……다시금 부장님을 적으로 돌리면 안 될 것 같다는 생각만 드네요……."
10050050-160 = "음? 의미를 전~혀 모르겠는데요?"
10050050-162 = "트리니티 외곽 카페"
10050050-163 = "수고 많으셨어요, 선생님."
10050050-164 = "[s] \"고생하는 건 시미코지…….\""
10050050-165 = "그렇게 말씀해 주시니 감사하네요. 하지만 진척이 거의 없는 것은 아쉬운 일이고요."
10050050-166 = "[s] \"문제가 뭘까?\""
10050050-167 = "선생님은 어떻게 생각하세요?"
10050050-168 = "……."
10050050-169 = "그렇군요. 선생님께서 보시기에는, 트리니티의 학생들이 이번 비인가 서적의 판매자를, 오히려 보호하고 있는 것처럼 느껴지신다는 거군요?"
10050050-170 = "여기에서만 드리는 말씀이지만, 저도 같은 생각이에요. 그것 때문에…… 정의실현부 쪽에서도 추적에 어려움을 겪고 있는 것 같고요."
10050050-171 = "그래서 선생님을 굳이 이런 트리니티의 외곽 카페에 모신 것이기도 하지만요."
10050050-172 = "[s] \"이번 일을 도와줄 사람이 있다는 뜻이야?\""
10050050-173 = "어쩌면요? 그리고 아마도 선생님께서도 잘 알고 계신 사람일 거예요. 아, 마침 오셨네요."
10050050-178 = "안녕하세요, 코하루 씨?"
10050050-179 = "서, 서서서서, 선생님?!?! 선생님이 왜 여기에 있어??!!"
10050050-180 = "[s] \"어, 코하루다.\""
10050050-181 = "가만, 선생님이 여기에 있다는 건……."
10050050-182 = "……역시."
10050050-183 = "역시! 그럴 줄 알았어! 내 눈은 못 속이거든? 모든 게 선생님 때문이었던 거네! 사형–!"
10050050-184 = "[s] \"아니야! 이번엔 진짜 나 아니야! 억울해!\""
10050050-185 = "이, 이이이이, 이번엔?! 그럼 다른 때에는 다른 변태 짓을 하고 다녔다는 거야?!?! 사형–!!!"
10050050-187 = "[ns] \"그렇구나. 코하루가…….\""
10050050-188 = "네. 코하루 씨가 저에게 샘플을 건네주셨어요. 덕분에 단서 같은 것을 얻은 상황이고요."
10050050-189 = "[s] \"그런데 왜 정의실현부가 아니라, 도서부에 협력하는 거야?\""
10050050-190 = "그, 그건. 그러니까……!!"
10050050-191 = "그건……."
10050050-192 = "왠지, 그냥……. 다른 학생들이, 슬퍼할 것 같아서……."
10050050-193 = "다른 뜻은 아니니까?! 다들 이 일을 숨기려고 하고 있고, 없는 일인 척하고 있고!"
10050050-194 = "그렇지만 그러면서도, 이 책을 좋아하고 있고……."
10050050-195 = "저, 절대로 우리 정의실현부가 나쁘다는 것은 아니니까 말이지!! 애초에 할 일을 하고 있는 것뿐이고!!"
10050050-196 = "……그치만 그것과는 별개로, 이렇게 많은 학생이 좋아하는 책을, 학생들로부터 빼앗아 가는 것은, 조금 슬픈 일인 것 같아서……."
10050050-197 = "[s] \"코하루도 이 책 좋아해?\""
10050050-198 = "왜 거기에서 내가 나오는데?! 선생님 바보, 변태, 사형–!!!"
10050050-199 = "나, 나나나나, 나는 이런 거 절대, 절대, 절대 관심 없으니까!!!!!"
10050050-200 = "그러면 코하루 씨. 혹시 도서부가 이번 책의 전집을 구하게 되면, 보러 올 생각이 있나요?"
10050050-201 = "장차 정의실현부의 '엘리트'로서, 어떤 내용인지 확인은 해 봐야 하지 않을까 해서요."
10050050-202 = "……!"
10050050-203 = "뭘 좀 아네! 그런 거라면 어쩔 수 없지. 내가 특별히 확인해 줄게."
10050050-204 = "뭘요. 책을 소중히 다루어 주어서 고마워요."
10050050-205 = "아, 아니. 딱히 그런 건……. 그보다, 도서부 학생들은 전부 그렇게 책을 아끼는 거야?"
10050050-206 = "당연한 거예요. 책은 일종의, 타임머신 같은 거니까요."
10050050-207 = "[s] \"타임머신?\""
10050050-208 = "네. 타임머신……. 어디까지나 비유적인 의미지만요."
10050050-209 = "무슨 뜻이야?"
10050050-210 = "가령 이런 거죠. 세상에는 참 많은 매체가 있잖아요? 책 이외에도 말이에요."
10050050-211 = "인터넷 영상이나 영화, 게임, 음악…… 종류를 다 댈 수 없을 만큼, 많은 그런 것들."
10050050-212 = "그런 매체들 역시, 우리에게 다양한 정보나 감상, 감정, 느낌 같은 것들을 전해주죠."
10050050-213 = "하지만 제가 특별히 책을 사랑하는 이유는, 책은 우리에게 어느 정도의 여유를 가져다주기 때문이에요."
10050050-214 = "점점 더 잘 모르겠는데……."
10050050-215 = "이렇게 생각해 보죠. 영화나 게임, 인터넷 영상 같은 것들은, 그것을 관람하는 도중에는 다른 생각을 좀처럼 하기 힘들죠."
10050050-217 = "시각과 청각, 방식에 따라서는 촉각까지도 활용해서, 우리에게 정보를 전달하려 하니까요."
10050050-218 = "그래서 강한 몰입감을 가져다주고, 우리를 그 세계 안으로 깊이 데려가 주기는 하지만……."
10050050-219 = "그렇기에, 우리에게 다른 여유를 허락하지 않기도 해요."
10050050-220 = "하지만 책은 그렇지 않아요. 많은 전달 매체 중 가장 제한적이죠. 당연한 거예요. 책은 약간의 그림과 문자로만 모든 것을 나타내야 하니까."
10050050-222 = "그건, 확실히……."
10050050-223 = "네. 그렇지만 오히려 그렇기 때문에, 우리 스스로 그 내용에 대해 생각할 수 있는 여유를 주는 것이기도 하죠. 관대한 매체라고나 할까요."
10050050-224 = "그리고 그건, 어떤 의미로는 저에게 있어 과거와의 대화처럼 느껴진답니다."
10050050-225 = "왜냐하면 모든 저자는, 과거로부터 현재로 건너온 사람들이니까요. 그런 의미에서 타임머신이라고 한 것이고요."
10050050-226 = "[s] \"하긴, 책은 쓴 다음 출판되는 물건이지.\""
10050050-227 = "네. 문장을 읽다 보면, 과거의 저자가 나에게 말을 거는 것처럼 느껴질 때가 있어요."
10050050-228 = "말씀드렸듯이, 책은 '스스로 생각할 수 있는 여유'를 우리에게 허락하니까요."
10050050-229 = "그리고…… 그 저자의 말에, 나름의 생각과 대답을 되돌려주려고 하는 저 자신이 있죠."
10050050-230 = "그건 정말로, 경험해 보면 멋진 일이랍니다."
10050050-231 = "[s] \"그래서 시미코는 책을 소중히 여기는 거구나.\""
10050050-232 = "네. 그래서 그런지, 지금 트리니티에서 벌어지고 있는 이 비인가 서적 사건에 대해서도."
10050050-233 = "저는 무의식중에라도, 호의적으로 바라보게 되는 것 같아요."
10050050-234 = "……수사관으로서는, 여러모로 실격이네요."
10050050-235 = "나, 나는…… 그래도, 괜찮을 거라고 생각해."
10050050-236 = "코하루 씨?"
10050050-237 = "그, 엄격한 부분은 이미 정의실현부 쪽에서 담당하고 있으니까. 한 명 정도는 책의 편을 들어주어도 좋지 않을까, 해서……."
10050050-238 = "[s] \"맞아. 좋은 경찰과 나쁜 경찰이네.\""
10050050-239 = "응! 맞아, 그거! 역시 선생님은 말이 통하네!"
10050050-240 = "감사합니다. 선생님. 코하루 씨."
10050050-241 = "그런데, 근본적으로 이 문제, 어떻게 해결하죠? 코하루 씨, 뭔가 그 뒤로 단서 같은 거 더 추적하신 게 있나요?"
10050050-242 = "없는…… 데?"
10050050-243 = "네……. 역시 그렇겠죠. 죄송해요. 괜히 부담을 드린 것 같네요."
10050050-244 = "아, 아니. 나는 괜찮지만……."
10050050-245 = "[s] \"흐음, 학생들로부터 탐문이 어려운 상황이라면…….\""
10050050-246 = "왜 그래, 선생님? 뭔가 생각나는 것이라도 있어?"
10050050-247 = "[s] \"코하루. 부탁 하나 해도 될까?\""
10050050-248 = "부탁? 나야 상관없지만……."
10050050-249 = "그, 그래도 야한 건 안 되니까! 그런 건 절대로 안 할 거니까!"
10050050-250 = "문맥상 선생님께서 그런 걸 부탁할 것 같지는 않지만요……."
10050050-251 = "어쨌든!"
10050050-252 = "어? 혹시 앞으로 정의실현부의 활동이 눈에 띄게 활발해진다면, 정의실현부 아이들과 조금 더 가까이 지내보라고?"
10050050-253 = "그, 그치만 지금의 나는 정의실현부 소속이…… 당장은, 아닌데?"
10050050-254 = "[s] \"괜찮아. 모두가 코하루를 아껴 줄 거야.\""
10050050-255 = "아, 알았어. 선생님이 그렇게 말한다면……."
10050050-257 = "안녕하세요. 마시로 씨. 조사는 어떻게 되어 가고 있나요?"
10050050-258 = "그게…… 죄송합니다. 좀처럼 진척이 나가지 않네요……."
10050050-259 = "네. 고생하고 계시다는 것, 저도 익히 알고 있어요."
10050050-260 = "정말로 추적이 어렵다면, 저희 티파티 쪽에서 보다 적극적으로 나서는 것도 가능할 테니, 너무 부담 갖지 말아 주세요."
10050050-261 = "(……?!)"
10050050-262 = "죄송합니다, 나기사 님! 역시 불안감을 느끼고 계신 거군요!"
10050050-264 = "더욱 열심히 조사해서, 반드시 찾아내겠습니다! 그럼, 이만……!!"
10050050-268 = "마, 마시로 씨? 마시로 씨?!?!"
10050050-272 = "저는 그저, 순수하게 격려의 말씀을 드리려고 한 것뿐인데……."
