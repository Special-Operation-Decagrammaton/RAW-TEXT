[translation]
10036040-1 = "제4화;야끼소바 한 그릇"
10036040-3 = "젠장! 뭐야 그 녀석들! 갑자기 튀어나와서 방해하고!"
10036040-4 = "그것들만 없었어도 DJ 납치 작전은 성공이었는데!"
10036040-5 = "아냐, 역시 우리의 분노에 비해 너무 쩨쩨하고 작은 작전이었어."
10036040-6 = "그런가?"
10036040-7 = "당연하지! 납치로 만족하다니, 겨우 그 정도로는 우리의 복수를 이룰 수 없어!"
10036040-8 = "이런 아이디어를 준 녀석은 얼마나 속이 좁은 거야!"
10036040-9 = "그치만 아까는 완벽한 계획이라고 했잖아."
10036040-10 = "시끄러! 그 교수라는 녀석한테 다시 연락해 봐!"
10036040-11 = "좋아, 그러자고."
10036040-17 = "스케반 여러분이군요. 계획은 성공하셨나요??"
10036040-18 = "성공은 무슨! 실컷 얻어맞고 쫓겨났단 말야! 헬멧단도 아니고 정체불명 녀석들에게!"
10036040-19 = "네 좀생이 아이디어로는 부족해! 더 크고 확실한 계획을 줘!"
10036040-20 = "네……? 으음, 전 어디까지나 여러분이 제공해 준 정보를 토대로……."
10036040-21 = "주어진 상황과 적들의 동태, 그 전부를 말로 삼는다면 오프닝 게임만으로도 충분히 체크메이트가 가능하리라 판단했습니다만."
10036040-22 = "그럼에도 실패했다는 말씀이시라면……. 결론은 하나."
10036040-24 = "'이쪽에서 파악하지 못한 말이 게임판 위로 올라섰다'."
10036040-25 = "……뭐, 좋습니다. 하는 수 없지요. 하지만 차라리 잘된 일일지도 몰라요."
10036040-26 = "이쪽은 정보를 얻었습니다. DJ에게 추정 이상의 경호가 붙어있다는 사실을 말이죠."
10036040-27 = "그리고 방금 전의 납치 미수로 더 많은 병력이 경호에 나설 것은 분명한 사실……."
10036040-28 = "판을 다시 세팅하도록 하지요. 말을 늘어놓고 새로운 게임을 짜는 것은 특기이거든요."
10036040-30 = "게임, 뭐……?"
10036040-32 = "말하자면—— 네, 애프터서비스란 이야기예요."
10036040-34 = "그, 그래? 좋아, 처음부터 그렇게 나왔어야지!"
10036040-35 = "어떤 계획인데? 또 납치 같은 시원찮은 건 아니겠지?"
10036040-37 = "물론 아니지요."
10036040-38 = "범죄의 일류 컨설턴트, 히죽히죽 교수의 이름을 걸고,"
10036040-43 = "당신들이 원하는 대로 크고 화려한 게임을 준비해 드리겠습니다."
10036040-46 = "휴우, 이걸로 무대 위 세팅은 모두 끝났다."
10036040-47 = "도와줘서 고맙다, 선생. 신세를 졌어."
10036040-48 = "[s1] \"처음 보는 물건이 많아서 재미있었는걸.\"\n[s2] \"신기한 물건이 많아서 재미있었는걸.\""
10036040-51 = "그렇군. DJ 장비는 평소에는 접하기 힘든 물건이니까."
10036040-52 = "여기 이 턴테이블만 해도, 상당한 고가의 물건으로 알고 있다."
10036040-53 = "DJ B.o.B정도 되는 사람이니 사용할 수 있을 테지."
10036040-54 = "[s] \"사오리, DJ 관련해서 잘 알고 있나 봐?\""
10036040-55 = "이번 임무는 DJ B.o.B의 보조 및 경호 임무니까. 미리 여러모로 조사했을 뿐이다."
10036040-56 = "임무에 필요할 것 같아서 공부했을 뿐, 잘 안다고는 할 수 없겠지."
10036040-57 = "[s3] \"좀 더 이야기해 줄 수 있어?\"\n[s4] \"나는 아무것도 모르니까, 관심이 가는걸.\""
10036040-60 = "내가 아는 만큼이라면 가능하지만, 지금은 업무 중이라 일을 해야 한다. 지금이라도 DJ B.o.B가 나를 찾을지도 모르니……."
10036040-61 = "[s] \"아, 그쪽은 괜찮을 거야.\""
10036040-62 = "그런가……? 잘은 모르겠지만, 선생님이 그렇다고 말하면 그런 거겠지."
10036040-63 = "그럼, 조금 더 이야기해 보겠다."
10036040-64 = "DJ는 디스크자키(Disc Jockey)의 약자로, 사람들이 모인 파티와 같은 장소에서 음악을 선곡하고 분위기를 선도하는 역할을 한다."
10036040-65 = "두 개 이상의 음악을 믹싱하거나, 기교를 부려서 원래 음악과 전혀 다른 형태의 음악을 만들어내는 것도 가능한 만큼, DJ의 영역은 무궁무진하다고 할 수 있지."
10036040-66 = "그리고 그 작업에 가장 중요한 것이 이 턴테이블이다."
10036040-67 = "음악이 담긴 LP, 혹은 CD를 재생하면서 BPM을 조정하거나, 스크래치 기법을 사용할 수도 있지."
10036040-68 = "이렇게……."
10036040-72 = "……대충 이런 느낌이다."
10036040-73 = "[s5] \"생각보다 그럴듯한데?\"\n[s6] \"잘하잖아? 혹시 현역?\""
10036040-76 = "……미숙한 실력이다만, 고맙다, 선생."
10036040-77 = "임무 준비할 때 폐기된 턴테이블을 몇 개 주워서 연습했었다."
10036040-78 = "장비가 좋으니 확실히 매끄럽군. 손가락 끝에 닿는 촉감부터, 피치 페이더의 움직임……."
10036040-79 = "잠깐, 그럼 BPM을 내리고, 피치를 올리면……."
10036040-83 = "그렇군. 이렇게 되는 건가."
10036040-84 = "스크래치까지 더한다면……."
10036040-88 = "……읏?!"
10036040-89 = "미, 미안하다. 나도 모르게 잠깐 한눈을 팔고 말았군."
10036040-90 = "자, 잡담은 이 정도로 하고, 관객석 정리라도 해 두도록 하지."
10036040-91 = "우선 앞쪽 구역부터……."
10036040-95 = "……."
10036040-96 = "[s] \"사오리, 점심 먹으러 갈까?\""
10036040-97 = "하지만 업무가 남아 있다."
10036040-98 = "[s] \"아츠코와 미사키, 히요리도 지금쯤 포장마차 구역에 갔을 거야.\""
10036040-99 = "그런가. 이왕 축제에 왔으니 맛있는 걸 먹을 수 있으면 좋으련만……."
10036040-100 = "[s] \"걱정되면 직접 가서 보는 건 어때?\""
10036040-101 = "……그렇다면 고용주에게 허락을 받고 오겠다."
10036040-105 = "[ns] \"…….\""
10036040-108 = "다녀왔다."
10036040-109 = "영문은 모르겠지만, '맛있게 먹고 와! 느긋하게 쉬어도 OK!' 라는군."
10036040-110 = "아까와는 너무 다른 태도라서 조금 위화감이 들기는 하다만……."
10036040-111 = "뭐, 허락은 받았으니 괜찮겠지."
10036040-112 = "그럼 선생, 포장마차 구역으로 가도록 하자."
10036040-115 = "포장마차 구역도 공연 무대 못지않게 힘을 줘서 준비한 것 같더군."
10036040-116 = "먹고 싶은 건 무엇이든 먹을 수 있을 거다."
10036040-117 = "그러고 보니 히요리…… 전에 야끼소바가 어떤 맛인지 내게 물어봤던 적이 있었지."
10036040-118 = "나도 먹어본 적 없지만, 간신히 상상력을 발휘해 대답해 준 기억이 있다."
10036040-124 = "선생, 이쪽으로!"
10036040-131 = "헤, 헤헤, 먹을 게 잔뜩이네요…… 이렇게 행복해도 되는 걸까요? 어딜 가든 문전박대당해서 해변에서 게라도 잡아먹어야 하는 건 아니겠죠?"
10036040-132 = "물론이지. 오늘을 위해 용돈도 모아 뒀으니까 걱정 마."
10036040-133 = "두 사람, 가장 먹고 싶은 게 뭐야?"
10036040-134 = "난 그다지 생각 없어. 사람도 많고 더워서 뭘 먹고 싶지가 않아."
10036040-135 = "전 야끼소바가 먹고 싶어요!"
10036040-136 = "옛날에 사오리 언니한테 야끼소바가 어떤 맛인지 물어봤었는데, 완전 천상의 맛이라고 했거든요, 헤헤."
10036040-137 = "정확히는 배급 설탕의 세 배 정도로 맛있다고 그랬어요!"
10036040-138 = "사오리 언니가 말했으니 틀림없을 거예요……!"
10036040-139 = "……."
10036040-141 = "그럼, 이왕 시키는 거 두 그릇 시켜."
10036040-147 = "이 식당은 어떨까요, 헤헤. 사람도 그리 많지 않고……."
10036040-148 = "응, 그럼 이곳으로 할까."
10036040-153 = "어서 오세요! 세 분이신가요? 이쪽으로 안내하겠습니다!"
10036040-154 = "헤, 헤헤, 드, 드디어 천상의 맛을 맛볼 수 있는 건가요!"
10036040-162 = "환영합니다. 자, 여기 메뉴가 있으니 천천히 골라 주세요."
10036040-167 = "그럼, 어디……."
10036040-169 = "잠깐, 아이스바 하나에 3000엔, 야끼소바 한 그릇이 7000엔……이라고?"
10036040-174 = "이건 완전……."
10036040-176 = "완전 고급 음식점이었나 봐요!"
10036040-178 = "아니, 아니, 이런 임시 포장마차가 그럴 리 없잖아."
10036040-179 = "단순한 바가지야."
10036040-181 = "이런, 무슨 그런 말씀을."
10036040-182 = "가격은 수요와 공급에 따라 결정되는 법이지 않습니까?"
10036040-183 = "축제 때문에 사 먹고 싶은 사람은 많고,"
10036040-184 = "하지만 이런 외진 해변까지 식자재를 가져오려면 운송비에, 유지비에, 또 인건비까지 들어갈 돈은 많고."
10036040-185 = "그러니 음식값이 시중에서보다 비싸지는 건 당연한 이치 아닌가요?"
10036040-186 = "하지만 이건 정도가 심하잖아. 두세 배 정도가 아닌걸!"
10036040-187 = "나 참, 싫으면 먹지 마."
10036040-188 = "참고로, 다른 곳에 가 봤자 소용없을걸. 우리 가게가 이 주변 가게들 중 가장 저렴한 곳이니까."
10036040-190 = "그런……."
10036040-191 = "와, 완전 파멸이네요…… 종말이네요…… 여기서 한 끼 먹고 나면 돈을 갚기 위해 위험한 일이라도 할 수밖에 없겠네요……."
10036040-192 = "아슬아슬한 수영복을 입고 호객을 한다거나…… 사진을 찍힌다거나…… 잡지에서 본 <해변의 멋쟁이> 특집 기사가 그대로……!"
10036040-193 = "진정해, 히요리. 그래도 우리한테 돈이 없는 건 아니니까."
10036040-194 = "예상외의 큰 지출이 되겠지만……바닷가까지 왔는데, 아무것도 못 먹고 갈 수는 없잖아?"
10036040-195 = "……하지만 아츠코, 예산이."
10036040-196 = "돈은 또 생기겠지만, 바닷가에서의 추억은 또 만들 수 있을지 없을지 모르니까."
10036040-197 = "어디, 하나, 둘, 셋…… 여기, 7000엔. 야끼소바 하나 주세요."
10036040-198 = "킥킥! 예이! 주문받았습니다요!"
10036040-203 = "저런 터무니없는……!"
10036040-204 = "저 정도면 블랙마켓에서조차 비싸다고 외면받을 가격이다."
10036040-205 = "저 정도로 후려치다니, 말도 안 돼!"
10036040-206 = "[s] \"사오리, 진정해. 내가 대신 사주는 걸로 하면 되잖아?\""
10036040-207 = "아니, 그럴 수는 없다."
10036040-208 = "잘못한 건 포장마차 쪽이니까. 선생이 부담할 필요는 없어."
10036040-209 = "……대신, 이렇게 하지. 조심히 따라와라."
10036040-214 = "포장마차 주방 뒤쪽"
10036040-216 = "'한 녀석만 걸려라' 작전, 성공이야, 성공!"
10036040-217 = "푸하하! 정말 그 가격에 야끼소바 따위를 사 먹는 녀석들이 있었다니."
10036040-218 = "뭐, 어디 거대 기업의 영애라도 되나?"
10036040-219 = "아니, 꼬질꼬질한 쌈짓돈을 모아서 내던데?"
10036040-220 = "형편이 불쌍하긴 하지만, <무법자 해변>이란 그런 곳이니까! 돈이 전부야!"
10036040-221 = "뭐어, 들리는 소문으로는 불량배 4인조 집단이 라멘 하나를 나눠 먹고, 불만에 가득 찬 나머지 가게를 날려버린 적도 있다고 들었어."
10036040-222 = "그 정도 각오는 되어 있어야 이 바닥에서 살아남는 거지!"
10036040-223 = "그럼, 그럼!"
10036040-227 = "이야기는 들었다."
10036040-235 = "넌 뭐야?!"
10036040-237 = "야끼소바가 얼마라고 했지?"
10036040-239 = "야끼소바는 7000엔이야! 싫으면 먹지 마!"
10036040-241 = "비싸군."
10036040-243 = "그, 그럼 어쩔 건데? 정당한 거래였다고! 저기 앉은 손님들도 동의했어!"
10036040-244 = "정당한 거래? 하지만 이번 축제를 시작하기 전에, 이곳에서 판매하는 메뉴를 정리하여 제출한 건을 확인해 보니, 원래 정가는 700엔이라고 쓰여 있다."
10036040-245 = "신고를 할 때는 그렇게 제출하고서, 여기에선 따로 만든 가짜 메뉴판을 이용해 사기를 치고 있었다니."
10036040-246 = "……그건 정당하지 못해. 불공정 계약이다."
10036040-247 = "헹! 당한 놈이 바보라고!"
10036040-248 = "……아니. 당한 자에겐 잘못은 없다. 잘못은 속인 자들의 것이지."
10036040-249 = "당장 속인 사람들에게 가서 사과하고 잘못을 바로잡도록."
10036040-250 = "나 참, 이 녀석! 사과니, 잘못이니 멋대로 지껄이는데? 얘들아! 다들 나와 봐!"
10036040-259 = "축제 날에 얻어맞기 싫으면 얼른 꺼져버려!"
10036040-261 = "……."
10036040-262 = "선생, 아무래도 이 녀석들을 가만 놔둘 수는 없을 것 같다."
10036040-263 = "아이들에게 들키지 않도록, 최대한 빠르게 처리하도록 하지."
