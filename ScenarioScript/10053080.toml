[translation]
10053080-1 = "第8話;外星人小灰人出沒"
10053080-3 = "大家久等了。鑑定結果出來囉。"
10053080-4 = "……咦？木乃香君呢？"
10053080-5 = "說是有幽靈就躲在房間裡了。"
10053080-6 = "能把他帶出來嗎？#n總之先說結論──那並不是幽靈。"
10053080-7 = "都聽到了吧！？快點下來啦！！"
10053080-8 = "你也別太逼迫他了……#n木乃香君是個很纖細的孩子，我們得好好保護他才行。"
10053080-9 = "……你認真？"
10053080-14 = "……真的不是幽靈嗎？"
10053080-15 = "詳細情況我們邊看照片邊說吧。#n你們看看這個。"
10053080-20 = "…………"
10053080-21 = "…………"
10053080-22 = "要看什麼？照片裡什麼都沒有啊。"
10053080-27 = "沒錯，我一開始也是這麼想的。"
10053080-28 = "不過如果把角落的這個草叢放大來看的話……"
10053080-29 = "這坨白白的東西是什麼啊……？"
10053080-33 = "是相機在木乃香君開窗後捕捉到的物體。#n雖然因為有點失焦的關係，導致形體不太完整……"
10053080-34 = "但是我確信！這個殘影就是所有事件的幕後黑手……也就是監視著我們的神祕X！"
10053080-35 = "而且根據我的推測，對方的真實身分很有可能……"
10053080-37 = "就是「Grey」！"
10053080-43 = "硬要說的話，那應該更接近白色吧？"
10053080-44 = "他說的「Grey」指的並不是顏色……而是一種名叫「小灰人」的外星人。"
10053080-45 = "所以呢，你說那是小灰人是什麼意思？"
10053080-50 = "我知道這聽起來很荒謬，不過希望你們先聽我說完。"
10053080-51 = "首先，大家都知道剛才睡覺的時候，有人在窗外窺視我們對吧？#n這是外星人綁架事件最典型的前兆現象之一。"
10053080-52 = "大部分的受害者都有產生被人監視的感覺，然而實際上卻沒有發現任何人……#n不覺得跟我們現在的情況非常類似嗎？"
10053080-53 = "不是，那純粹只是被害妄想吧……"
10053080-54 = "但是我們確實看見了。#n包含老師在內的三個人同時產生相同的被害妄想……這種事情不可能發生。"
10053080-55 = "老師，是真的嗎……？"
10053080-56 = "[s1] 「是否真的是外星人還無法確定……」\n[s2] 「不過確實有人在那裡。」"
10053080-59 = "可是……也有集體歇斯底里的案例啊。"
10053080-60 = "因此重點就在於這張照片。這是無可否認的物證。#n以鏡頭眩光或圖像雜訊而言，照片中的形體實在過於清晰了。"
10053080-61 = "不僅如此，我還建立了一個假設。"
10053080-62 = "那就是外星人擁有無聲超高速移動的技術。#n事實上，這種不自然的無聲狀態，也是在UFO目擊事件中被共同提到的特徵之一。"
10053080-63 = "也就是說……有外星人在監視我們，然後在窗戶打開的瞬間以極快的速度逃跑了？"
10053080-64 = "沒有發出任何聲音，是因為運用了外星科技？"
10053080-65 = "……目前沒有其他方式能夠解釋了。"
10053080-67 = "不是，明明還有很多好不好！？#n你的想法未免跳得太遠了吧！？"
10053080-68 = "而且一開始不是說槌之子是外星人的偵察無人機嗎！？#n有無人機直接用不就好了，為什麼還要親自監視啊！！敢不敢先統一一下世界觀！！"
10053080-73 = "這麼說來，那並不是鬼之類的東西對吧？#n呼～我還以為真的撞鬼了呢～"
10053080-77 = "你還真的只要不是鬼就什麼都無所謂耶……"
10053080-78 = "不過你仔細想想……#n我們來到這裡後經歷的所有事情，全都是難以用常理說明的超自然現象。"
10053080-79 = "與其認為每件事都有不同的原因，判斷背後存在共同的源頭反而更加現實吧？"
10053080-80 = "雖然這麼說也有道理……"
10053080-84 = "不行！我還是不信！在親眼看到外星人之前絕對不信！"
10053080-85 = "老師是站在我這邊的對吧！？"
10053080-86 = "[ns3] 「總之，如果山莊附近有人的話……」\n[ns4] 「是不是應該先向女武神通報？」"
10053080-90 = "也對。無論對方是誰，現在的情況都還挺危險的。"
10053080-91 = "先等一下。要是貿然報警的話……#n聯邦學生會搞不好會像之前一樣，試圖銷毀所有與UFO有關的證據。"
10053080-92 = "陰謀論什麼的已經夠了！算了，我來打電話！"
10053080-96 = "…………"
10053080-101 = "電話打不通耶……？#n電線有插好嗎？"
10053080-102 = "都有插好啊？"
10053080-103 = "那為什麼會……？"
10053080-109 = "該不會……！？"
10053080-116 = "果然和我想的一樣……情況正朝著最壞的劇本發展。"
10053080-121 = "所長，怎麼了嗎？你手裡拿的是什麼？"
10053080-122 = "是電話線。"
10053080-123 = "不，準確來說……是被切斷的電話線。"
10053080-124 = "……咦？"
10053080-125 = "如果切斷電話線是最後一步的話，那麼也就是說……！"
10053080-135 = "果然已經太遲了嗎……！"
10053080-140 = "怎麼會？傍晚的時候不是還好好的嗎！？"
10053080-141 = "為什麼橋會斷掉啊！？"
10053080-145 = "大家冷靜下來聽我說。"
10053080-146 = "根據我的推測，這座橋是有人故意弄斷的。"
10053080-147 = "有可能跟切斷電話線和監視我們的人是同夥，或者是同一個人。"
10053080-148 = "毫無疑問，他們正試圖孤立我們。"
10053080-149 = "為什麼！？#n對方到底是誰！？又是為了什麼目的！？"
10053080-150 = "……大概是因為我們在尋找槌之子吧。"
10053080-151 = "如果槌之子是外星人的偵察無人機……#n那麼試圖查明真相的我們探險班X，就是對外星人最大的威脅！"
10053080-152 = "也許我們現在，比人類歷史上的任何時刻都更加接近槌之子的真相！"
10053080-153 = "拜託別再說那種莫名其妙的話了……"
10053080-155 = "這，這道光是什麼！？"
10053080-156 = "是UFO！UFO出現了！"
10053080-157 = "真，真的是外星人嗎……？"
10053080-160 = "不對……那個東西好像在哪裡見過……"
10053080-161 = "啊，我想到了。是照明彈。"
10053080-162 = "嗯？"
10053080-165 = "看來公安局副局長很迷信的傳聞是真的呢！"
10053080-166 = "上吧！大家！給他們一點顏色瞧瞧！"
10053080-171 = "怎麼回事？這是什麼情況？"
10053080-172 = "他們……看起來不像外星人呢。"
10053080-173 = "那還用說！現在該怎麼辦啦！？"
10053080-178 = "……啊哈，事情總算變得容易理解了。"
10053080-182 = "你們全都死定了！！！！！"
