[translation]
10053080-1 = "ตอนที่ 8;การปรากฏตัวของมนุษย์ต่างดาวเกรย์"
10053080-2 = ""
10053080-3 = "ทุกคนรอนานเลยใช่มั้ย? ได้ผลออกมาแล้วละ"
10053080-4 = "เอ๋... แล้วโคโนกะล่ะ?"
10053080-5 = "พอบอกว่ามันเป็นวิญญาณ ก็เลยขังตัวเองอยู่ในห้องไปแล้วน่ะ"
10053080-6 = "ไปพาออกมาหน่อยได้มั้ย? ถ้าจะให้สรุปเลยก็คือ เมื่อกี้ไม่ใช่วิญญาณหรอก"
10053080-7 = "ได้ยินหมดแล้วใช่มั้ย?! รีบลงมาได้แล้ว!!"
10053080-8 = "อย่าเร่งจนเกินไปเลยน่า... โคโนกะเป็นคนอ่อนไหว เราต้องคอยปกป้องให้ดีสิ"
10053080-9 = "พูดจริงใช่มั้ยเนี่ย...?"
10053080-10 = ""
10053080-12 = ""
10053080-13 = ""
10053080-14 = "ไม่ใช่จริงๆ เหรอ...?"
10053080-15 = "มาดูรูปก่อนแล้วค่อยคุยรายละเอียดก็แล้วกัน ทุกคนดูรูปนี้สิ"
10053080-16 = ""
10053080-18 = ""
10053080-19 = ""
10053080-20 = "..."
10053080-21 = "..."
10053080-22 = "ให้ดูอะไรเหรอ? ไม่เห็นจะมีอะไรเลยนี่นา"
10053080-23 = ""
10053080-25 = ""
10053080-26 = ""
10053080-27 = "อื้อ ตอนแรกฉันก็คิดแบบนั้นเหมือนกัน"
10053080-28 = "แต่ถ้าลองดูใกล้ๆ มุมภาพ ตรงระหว่างพุ่มไม้นี้ละก็"
10053080-29 = "อะไรน่ะ ที่เป็นสีขาวๆ มัวๆ มันคืออะไร...?"
10053080-30 = ""
10053080-32 = ""
10053080-33 = "มันคือวัตถุที่จับภาพได้ทันทีหลังจากโคโนกะเปิดหน้าต่างออกไป ถึงกล้องจะไม่โฟกัสและได้ภาพที่#nเบลอจนมองเห็นรูปร่างไม่ชัดก็เถอะ"
10053080-34 = "แต่ฉันก็มั่นใจ! เงาลางๆ นี่แหละคือผู้อยู่เบื้องหลังเหตุการณ์ทั้งหมด#nและเป็น X ปริศนาที่คอยจับตาดูพวกเราอยู่!"
10053080-35 = "และจากการคาดเดาของฉัน มีความเป็นไปได้สูงที่มันจะเป็น..."
10053080-37 = "<เกรย์> ยังไงล่ะ!"
10053080-38 = ""
10053080-40 = ""
10053080-41 = ""
10053080-42 = ""
10053080-43 = "เดี๋ยวนะ แต่มันสีขาวไม่ใช่เหรอ?"
10053080-44 = "เกรย์ไม่ได้หมายถึงสี... แต่เป็นมนุษย์ต่างดาวชนิดหนึ่งต่างหาก"
10053080-45 = "แล้วที่บอกว่านั่นคือเกรย์ มันหมายความว่าไงเหรอ?"
10053080-46 = ""
10053080-48 = ""
10053080-49 = ""
10053080-50 = "ฉันรู้ว่ามันอาจฟังดูไร้สาระ แต่ลองฟังให้จบก่อนนะ"
10053080-51 = "อย่างแรกเลยนะ ระหว่างที่เรานอนหลับกันอยู่ รู้กันใช่มั้ยว่ามีใครบางคนแอบมองเข้ามาทางหน้าต่าง? นี่คือหนึ่งในปรากฏการณ์เตือนก่อนโดนมนุษย์ต่างดาวลักพาตัวที่เจอบ่อยที่สุดเลยละ"
10053080-52 = "เหยื่อส่วนใหญ่รู้สึกว่ามีใครกำลังจับตาดูตัวเองอยู่ แต่ก็บอกว่ายังไม่พบใครที่เป็นคนทำอย่างนั้นจริงๆ ไม่คิดกันเหรอว่าสถานการณ์แบบนี้มันคล้ายกับที่เราเจอกันเลยน่ะ?"
10053080-53 = "ไม่หรอก นั่นมันอาการหวาดระแวงไปเองต่างหาก..."
10053080-54 = "แต่ว่าพวกเราเห็นกับตากันจริงๆ นะ เป็นไปไม่ได้ที่คนสามคนรวมถึงคุณครูด้วยจะมีอาการหวาดระแวง#nแบบเดียวกันในเวลาเดียวกันหรอก"
10053080-55 = "จริงเหรอ... คุณครู?"
10053080-56 = "[s1] \"ครูแน่ใจว่ามีใครอยู่ตรงนั้นจริงๆ\"\n[s2] \"ครูแน่ใจว่ามีใครอยู่ข้างนอกจริงๆ\""
10053080-59 = "แต่ว่า... มันก็เคยมีเคสอุปาทานหมู่เหมือนกันนะ"
10053080-60 = "ถ้าเรื่องนั้นน่ะ ให้รูปนี้พิสูจน์ได้ นี่คือหลักฐานชั้นดีที่ไม่มีทางปฏิเสธได้เลยนะ รูปร่างที่เห็นมันชัดเจนเกินกว่าจะมองว่าเป็นแค่แสงวาบหรือสัญญาณรบกวนเท่านั้น"
10053080-61 = "แล้วฉันก็ตั้งสมมติฐานเพิ่มมาอีกข้อหนึ่งด้วย"
10053080-62 = "ว่ากันว่ามนุษย์ต่างดาวมีเทคโนโลยีในการเคลื่อนที่ด้วยความเร็วสูงแบบไร้เสียง อันที่จริง ความเงียบเชียบแบบผิดธรรมชาตินี่ละคือหนึ่งในลักษณะร่วมที่เจอได้บ่อยในเคสพยานผู้พบเห็น UFO"
10053080-63 = "ถ้างั้นก็สรุปว่า... มนุษย์ต่างดาวกำลังเฝ้าดูพวกเราอยู่ และทันทีที่เราเปิดหน้าต่าง มันก็หนีไปด้วยความเร็วที่เหลือเชื่อ?"
10053080-64 = "และการที่ไม่มีเสียงอะไรเลยก็เป็นเทคโนโลยีจากต่างดาว?"
10053080-65 = "ตอนนี้คงไม่มีคำอธิบายอื่นนอกจากที่ว่ามาแล้วละ..."
10053080-67 = "ไม่นะ มันมีสิ?! นั่นมันไม่เห็นจะสมเหตุสมผลเลยนี่นา?!"
10053080-68 = "ไหนว่าที่จริงแล้วสึจิโนโกะคือโดรนสอดแนมของมนุษย์ต่างดาวไง!! ถ้างั้นก็แค่ใช้โดรนสอดแนมสิ ทำไมต้องมายืนสอดส่องกันด้วย!! จะมาสอดแนมมนุษย์ งั้นก็ปรับโลกทัศน์ให้เข้ากับมนุษย์สิ!!"
10053080-69 = ""
10053080-71 = ""
10053080-72 = ""
10053080-73 = "สรุปว่าไม่ใช่ผีหรืออะไรทำนองนั้นใช่มั้ย? เฮ้อ~ ฉันก็กลัวไปได้~"
10053080-74 = ""
10053080-76 = ""
10053080-77 = "เธอนี่นะ ขอแค่ไม่ใช่ผีก็พอแล้วสินะ..."
10053080-78 = "แต่ลองคิดดูดีๆ นะ เรื่องทั้งหมดที่พวกเราเผชิญหลังจากมาที่นี่ แต่ละเรื่องล้วนเป็นปรากฏการณ์#nเหนือธรรมชาติเกินกว่าจะใช้สามัญสำนึกทั่วไปมาอธิบายได้ทั้งนั้นเลย"
10053080-79 = "แทนที่จะคิดว่าทุกเรื่องเกิดขึ้นจากคนละสาเหตุ การมองว่าทุกเรื่องมีต้นตอมาจากสาเหตุเดียวกัน#nมันดูเป็นไปได้มากกว่าไม่ใช่เหรอ?"
10053080-80 = "ที่พูดมันก็ไม่ได้ผิดหรอก..."
10053080-81 = ""
10053080-83 = ""
10053080-84 = "ไม่สิ! แต่ยังไงฉันก็ไม่ปักใจเชื่อ! ฉันจะไม่เชื่อเรื่องมนุษย์ต่างดาวจนกว่าจะได้เห็นกับตาตัวเองหรอก!"
10053080-85 = "คุณครูคิดเหมือนฉันใช่มั้ย?!"
10053080-86 = "[ns3] \"ครูว่าเราแจ้งวัลคิรี่ว่ามีใครมาอยู่แถวบ้านพักดีมั้ย?\"\n[ns4] \"ถ้ามีใครมาอยู่แถวบ้านพัก ครูว่าเราแจ้งวัลคิรี่ดีมั้ย?\""
10053080-89 = ""
10053080-90 = "นั่นสิเนอะ ไม่ว่าคนคนนั้นจะเป็นใคร แต่นี่ก็เป็นสถานการณ์อันตรายอยู่ดีนี่นา?"
10053080-91 = "เดี๋ยวก่อน ถ้าเราด่วนรายงานเรื่องนี้ไป ทางองค์การนักเรียนอาจพยายามทำลายหลักฐาน อย่างที่เคยทำกับหลักฐานเรื่อง UFO ทั้งหมดที่ผ่านมาก็ได้"
10053080-92 = "พอเลย เรื่องทฤษฎีสมคบคิดน่ะพอได้แล้ว! ฉันจะเป็นคนโทรไปแจ้งเอง!"
10053080-93 = ""
