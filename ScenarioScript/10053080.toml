10053080-96 = "..."
10053080-97 = ""
10053080-99 = ""
10053080-100 = ""
10053080-101 = "โทรไม่ได้แฮะ? เสียบสายไฟอยู่ใช่มั้ย?"
10053080-102 = "ตัวปลั๊กก็เสียบเข้าที่เรียบร้อยดีนี่นา?"
10053080-103 = "ถ้างั้นทำไม...?"
10053080-104 = ""
10053080-106 = ""
