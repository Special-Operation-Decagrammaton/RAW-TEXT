[translation]
10053080-1 = "第8話;外星人灰人出沒"
10053080-3 = "大家久等了，鑑定結果出來了。"
10053080-4 = "咦？木乃香君呢？"
10053080-5 = "說是幽靈就躲在房間裡了。"
10053080-6 = "能把他帶出來嗎？總之先說結論，那不是幽靈。"
10053080-7 = "都聽到了吧！？快下來！！"
10053080-8 = "別逼太緊……木乃香君是個敏感的孩子，我們要好好保護他。"
10053080-9 = "……你認真？"
10053080-14 = "……真的不是幽靈嗎？"
10053080-15 = "詳細的先看照片再說吧，你們看看這個。"
10053080-20 = "…………"
10053080-21 = "…………"
10053080-22 = "要看什麼？什麼都沒有啊。"
10053080-27 = "沒錯，一開始我也這麼想。"
10053080-28 = "但是這裡，照片的角落，把草叢放大看的話……"
10053080-29 = "這白白的是什麼……？"
10053080-33 = "這是木乃香君開窗後相機捕捉到的物體，雖然因為有點失焦所以形體不完整。"
10053080-34 = "但是我確信！這個殘影就是所有事件的幕後黑手，是監視我們的身份不明的X！"
10053080-35 = "而且根據我的推測那個真實身分很有可能……"
10053080-37 = "就是「灰人」！"
10053080-43 = "硬要說的話那不是白色的嗎？"
10053080-44 = "灰人不是指顏色……而是一種外星人。"
10053080-45 = "你說那個是灰人是什麼意思？"
10053080-50 = "我知道這聽起來很荒謬，但先聽我說完。"
10053080-51 = "首先，你們知道我們睡覺的時候有人在窗外窺視吧？#n這是最典型的外星人綁架前兆現象之一。"
10053080-52 = "大多數受害者感覺到被某人監視，但實際上卻沒有發現任何人，#n這種情況跟我們現在不是很像嗎！？"
10053080-53 = "不，那只是被害妄想吧……"
10053080-54 = "但我們實際上確實看到了，包括老師在內不可能三個人同時產生相同的被害妄想。"
10053080-55 = "老師，是真的嗎……？"
10053080-56 = "[s1] 「不知道是不是真的是外星人……」\n[s2] 「但確實有人在。」"
10053080-59 = "但是也有集體歇斯底里的案例啊。"
10053080-60 = "重點就在這張照片，這是無可否認的物證，形體太明確了不能當作反射眩光或是圖像雜訊。"
10053080-61 = "另外，我還建立了一個假設。"
10053080-62 = "外星人有無聲超高速移動的技術，#n實際上，這種不自然的無聲是UFO目擊事件中共同提到的特徵之一。"
10053080-63 = "也就是說……外星人在監視我們，在窗戶打開的瞬間以極快的速度逃跑了？"
10053080-64 = "沒有任何聲音是因為外星技術？"
10053080-65 = "……現在除此之外沒有別的解釋了。"
10053080-67 = "有吧！？你這也跳太多了吧！？"
10053080-68 = "一開始不是說槌之子是外星人的偵察無人機嗎！？#n那用無人機不就好了，為什麼要親自監視！！先統一世界觀啊！！"
10053080-73 = "所以不是鬼之類的東西對吧？#n呼～我還以為真的撞鬼了呢～"
10053080-77 = "你真的只要不是鬼就什麼都無所謂耶……"
10053080-78 = "但仔細想想，我們來到這裡經歷的所有事，每一件都是用一般常識難以評斷的超自然現象。"
10053080-79 = "與其認為每件事都有不同的原因，不如認為背後有一個共同的原因，這樣不是更現實嗎？"
10053080-80 = "是這樣說沒錯……"
10053080-84 = "不！我還是不信！在親眼看到外星人之前絕對不信！"
10053080-85 = "老師是站在我這邊的對吧！？"
10053080-86 = "[ns3] 「總之，如果山莊附近有人……」\n[ns4] 「是不是應該先報警給女武神？」"
10053080-90 = "也是，無論如何這不是很危險的情況嗎？"
10053080-91 = "等等，貿然報警的話可能會像迄今為止的所有UFO證據一樣被聯邦學生會銷毀證據。"
10053080-92 = "陰謀論已經夠了！算了，我來打電話！"
10053080-96 = "…………"
10053080-101 = "打不通？電線有插好嗎？"
10053080-102 = "線有接好啊？"
10053080-103 = "那為什麼……？"
10053080-109 = "該不會！？"
10053080-116 = "果然和我想的一樣……朝著最壞的情況發展了。"
10053080-121 = "所長，怎麼回事？你手裡拿的是什麼？"
10053080-122 = "電話線。"
10053080-123 = "不，準確地說……是被切斷的電話線。"
10053080-124 = "……咦？"
10053080-125 = "如果電話線是最後一步……也就是說，如果真的是這樣的話……！"
10053080-135 = "果然已經太遲了嗎……！"
10053080-140 = "怎麼會？剛才不是都還好好的嗎！？"
10053080-141 = "為什麼橋斷了！？"
10053080-145 = "大家冷靜聽我說。"
10053080-146 = "根據我的推測，這座橋是有人故意弄斷的。"
10053080-147 = "大概是切斷電話線的人以及監視我們的人是同夥或同一人。"
10053080-148 = "毫無疑問，他們正試圖孤立我們。"
10053080-149 = "為什麼！？誰啊！？是有什麼目的！？"
10053080-150 = "……因為我們在找槌之子吧。"
10053080-151 = "如果槌之子是外星人的偵察無人機，#n那麼試圖查明其真相的我們探險班X現在對外星人來說是最大的風險因素！"
10053080-152 = "也許我們比人類歷史上任何時候都更接近槌之子的真相！"
10053080-153 = "別再說那種莫名其妙的話了……"
10053080-155 = "剛，剛才那道光是什麼！？"
10053080-156 = "UFO！UFO出現了！"
10053080-157 = "真，真的是外星人……？"
10053080-160 = "不對……那個好像在哪裡見過……"
10053080-161 = "啊，那是照明彈。"
10053080-162 = "嗯？"
10053080-165 = "看來公安局副局長很相信迷信的傳聞是真的啊！"
10053080-166 = "走！大家！給他們點顏色瞧瞧！"
10053080-171 = "這是怎樣，怎麼回事？"
10053080-172 = "他們……看起來不像外星人。"
10053080-173 = "當然啊！現在怎麼辦！？"
10053080-178 = "……啊哈，這下好理解了。"
10053080-182 = "你們都死定了！！！！！"
