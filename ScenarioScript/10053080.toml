[translation]
10053080-1 = "제8화;외계인 그레이 출몰"
10053080-3 = "다들, 오래 기다렸지? 감정 결과가 나왔어."
10053080-4 = "……어라, 코노카 군은?"
10053080-5 = "유령이라면서 방에 틀어박혔어."
10053080-6 = "가서 데리고 와 줄래? 일단, 결론부터 말하면, 그건 유령이 아니야."
10053080-7 = "다 들었지?! 빨리 내려와!!"
10053080-8 = "너무 다그치지 마……. 코노카 군은 섬세한 아이니까, 우리가 제대로 지켜줘야지."
10053080-9 = "……진심?"
10053080-14 = "……진짜 아니야?"
10053080-15 = "자세한 것은, 사진을 보면서 이야기하자. 다들 이걸 봐주겠어?"
10053080-20 = "…………."
10053080-21 = "…………."
10053080-22 = "뭘 보라는 거야? 아무것도 없잖아."
10053080-27 = "그래, 처음에는 나도 똑같이 생각했지."
10053080-28 = "하지만 여기, 사진의 구석 부분, 수풀 사이를 확대해서 보면."
10053080-29 = "뭐야, 이 희끄무레한 건……?"
10053080-33 = "코노카 군이 창문을 연 직후, 촬영된 사진에 포착된 오브젝트야. 비록 초점이 잡히지 않아서, 형체가 온전하지 못한 형태로 찍혔지만."
10053080-34 = "나는 확신해! 이 잔상이 바로 모든 사건의 배후이자, 우릴 감시하고 있던 정체불명의 X라고!"
10053080-35 = "그리고, 내 추측에 따르면 그 정체는 높은 확률로……."
10053080-37 = "바로 <그레이>다!"
10053080-43 = "아니, 굳이 따지면, 화이트 아닌가?"
10053080-44 = "그레이라는 건, 색깔 얘기가 아니라…… 외계인의 일종이야."
10053080-45 = "그래서, 저게 그레이라는 건 무슨 말이야?"
10053080-50 = "알아. 허무맹랑하게 들리겠지. 하지만 끝까지 들어봐."
10053080-51 = "일단, 우리가 잠든 사이, 누군가 창밖에서 엿보고 있었다는 것은 알고 있지? 이는, 가장 대표적인 외계인 납치 전조 현상 중 하나야."
10053080-52 = "피해자 대부분이 누군가에게 감시당한다는 느낌을 받지만, 실제로는 발견하지 못했다고 해. 이런 상황은 우리와 아주 비슷하다 생각하지 않아?"
10053080-53 = "아니, 그건 그냥 피해망상이잖아……."
10053080-54 = "하지만, 우리는 실제로 목격했지. 선생님을 포함해 3명이나, 동시에 같은 피해망상을 일으킬 수는 없어."
10053080-55 = "……사실이야, 선생님?"
10053080-56 = "[s1] \"진짜 외계인인지는 모르겠지만…….\"\n[s2] \"누군가 있던 건 확실해.\""
10053080-59 = "하지만……. 집단 히스테리 같은 사례도 있고."
10053080-60 = "거기서, 바로 이 사진이야. 이것은 부정할 수 없는 물증이지. 플레어 현상이나, 노이즈로 치부하기에는 형체가 너무나도 명확해."
10053080-61 = "거기에, 추가로 나는 한 가지 가설을 세웠어."
10053080-62 = "외계인에게는 무음으로 초고속 이동을 하는 기술이 있다고. 실제로 이런 부자연스러운 무소음은 UFO 목격 사례에서 공통적으로 언급되는 특징 중 하나야."
10053080-63 = "……즉, 정리하자면, 외계인이 우리를 감시하고 있었다가, 창문을 연 순간, 엄청나게 빠른 속도로 도망쳤다?"
10053080-64 = "아무 소리가 안 난 건, 외계 기술 때문이다?"
10053080-65 = "……이제는 그것 외에 설명할 수 있는 수단이 달리 없어."
10053080-67 = "아니, 있거든?! 엄청 비약했잖아?!"
10053080-68 = "애초에 츠치노코가 외계인의 정찰 드론이라며!! 그러면 정찰 드론을 쓰면 되지, 왜 직접 감시하는 건데!! 세계관부터 통일하라고!!"
10053080-73 = "그러니까, 귀신 같은 건 아니라는 거지? 휴~ 난 또~"
10053080-77 = "너는 진짜 귀신만 아니면 뭐든 상관없구나……."
10053080-78 = "하지만 잘 생각해 봐. 우리가 여기 와서 겪은 모든 일화들, 하나하나가 일반 상식으로 재단하기 어려운 초자연 현상들이었어."
10053080-79 = "그 모든 것에 각기 다른 이유가 있다고 생각하기보다, 하나의 공통된 원인이 있다고 판단하는 편이 현실적이지 않아?"
10053080-80 = "그 말은 틀리지 않는데……."
10053080-84 = "아니! 그래도 나는 못 믿어! 외계인이란 걸 직접 보기 전까지는 절대 안 믿어!"
10053080-85 = "선생님은 내 편이지?!"
10053080-86 = "[ns3] \"일단, 산장 근처에 누군가 있다면…….\"\n[ns4] \"발키리에 신고부터 해야 하지 않을까?\""
10053080-90 = "그것도 그러네. 누가 있든지 간에, 위험한 상황이란 거 아니야?"
10053080-91 = "잠깐, 섣부르게 신고했다가는, 지금까지의 모든 UFO 증거물처럼 총학생회에서 증거 인멸을 시도할지도 몰라."
10053080-92 = "아니, 음모론은 이제 됐거든! 됐어, 내가 전화할 테니까!"
10053080-96 = "…………."
10053080-101 = "통화가 안 되는데? 전선 꽂혀 있는 거 맞아?"
10053080-102 = "코드는 제대로 붙어 있는데?"
10053080-103 = "그러면 왜……?"
10053080-109 = "설마?!"
10053080-116 = "……역시나. 내가 예상한 최악의 시나리오대로 흘러가는군."
10053080-121 = "소장, 뭐야? 손에 든 그거는?"
10053080-122 = "전화선이야."
10053080-123 = "아니, 정확히 말하면, ……절단된 전화선이지."
10053080-124 = "……뭐?"
10053080-125 = "전화선은 마지막 단계…… 아마도, 그렇다면……!"
10053080-135 = "역시, 이미 늦었나……!"
10053080-140 = "뭐야? 아까 저녁까지만 해도 멀쩡했잖아?"
10053080-141 = "왜 다리가 끊겨 있는 거야?"
10053080-145 = "다들 침착하고 내 얘기를 들어줘."
10053080-146 = "내 추측에 따르면, 이 다리는 누군가 의도적으로 끊은 거야."
10053080-147 = "아마도 전화선을 끊은 인물, 그리고 우릴 감시하고 있던 인물과 한패이거나 동일인일 테지."
10053080-148 = "틀림없이, 그들은 우리를 고립시키려고 하고 있어."
10053080-149 = "어째서?! 누가, 왜?!"
10053080-150 = "……우리가, 츠치노코를 찾고 있기 때문이겠지."
10053080-151 = "츠치노코가 외계인의 정찰 드론이라면, 그 정체를 규명하려는 우리 탐사반 X는 현재 외계인들에게 최대의 위험 요소니까!"
10053080-152 = "어쩌면, 우리는 인류 역사상 어느 때보다 츠치노코의 실체에 근접해 있을지도 몰라!"
10053080-153 = "아니, 그런 말도 안 되는 소리는 됐으니까……."
10053080-155 = "바, 방금, 뭐야, 그 빛은?!"
10053080-156 = "UFO다! UFO가 나타난 거야!"
10053080-157 = "지, 진짜로 외계인이야……?"
10053080-160 = "……아니, 저거 어디서 많이 봤는데……."
10053080-161 = "아, 저거. 조명탄이다."
10053080-162 = "응?"
10053080-165 = "공안국 부국장이 미신을 잘 믿는다는 소문이 사실이었군!"
10053080-166 = "가자! 애들아! 본때를 보여주자고!"
10053080-171 = "뭐야, 어떻게 된 거야?"
10053080-172 = "저들은…… 외계인처럼 보이지는 않는데."
10053080-173 = "당연하지! 어떻게 해?!"
10053080-178 = "……아항. 이제야 좀 알기 쉽게 돌아가네."
10053080-182 = "니들 다 죽었어!!!!!"
