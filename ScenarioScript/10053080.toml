10053080-112 = ""
10053080-114 = ""
10053080-115 = ""
10053080-116 = "จริงด้วยสินะ... เป็นไปตามสถานการณ์เลวร้ายที่สุดที่ฉันคาดไว้เลย"
10053080-117 = ""
10053080-120 = ""
10053080-121 = "ทำไมเหรอ หัวหน้า? แล้วที่ถือไว้ในมือคืออะไรเหรอ?"
10053080-122 = "สายโทรศัพท์ยังไงล่ะ"
10053080-123 = "ไม่สิ ถ้าจะพูดให้มันชัดเจน... ก็ต้องบอกว่าเป็นสายโทรศัพท์ที่ถูกตัดไป"
10053080-124 = "ว่าไงนะ...?"
10053080-125 = "สายโทรศัพท์คือขั้นตอนสุดท้าย... ถ้างั้นก็อาจเป็นไปได้ว่า...!"
10053080-126 = ""
10053080-128 = ""
10053080-133 = ""
10053080-134 = ""
10053080-135 = "อะไรกัน ไม่ทันแล้วงั้นเหรอ...!"
10053080-136 = ""
10053080-139 = ""
10053080-140 = "อะไรน่ะ? จนถึงตอนเย็นยังปกติดีอยู่เลยไม่ใช่เหรอ?"
10053080-141 = "ทำไมสะพานถึงขาดได้ล่ะ?"
10053080-142 = ""
10053080-144 = ""
10053080-145 = "ทุกคนใจเย็นๆ แล้วฟังฉันก่อนนะ"
10053080-146 = "ถ้าเป็นไปตามที่ฉันคาดเดาละก็ ต้องมีใครบางคนจงใจตัดสะพานนี้"
10053080-147 = "บางทีคนที่ตัดสายโทรศัพท์กับคนที่คอยจับตาดูพวกเราอยู่ อาจเป็นกลุ่มเดียวกันหรือคนเดียวกันก็ได้"
10053080-148 = "พวกนั้นต้องพยายามตัดขาดเราจากโลกภายนอกแน่ๆ"
10053080-149 = "ทำไมล่ะ?! พวกนั้นเป็นใคร แล้วจะทำแบบนั้นไปทำไม?!"
10053080-150 = "คงเป็นเพราะพวกเรากำลังตามหาสึจิโนโกะอยู่น่ะ..."
10053080-151 = "ถ้าสึจิโนโกะเป็นโดรนสอดแนมของมนุษย์ต่างดาวละก็ ทีมสำรวจ X ของเราที่พยายามสืบหาตัวตน#nที่แท้จริงของมันก็คือภัยคุกคามที่ยิ่งใหญ่ที่สุดต่อมนุษย์ต่างดาวในขณะนี้!"
10053080-152 = "บางทีตอนนี้เราอาจเข้าใกล้ตัวตนที่แท้จริงของสึจิโนโกะมากกว่าตอนไหนในประวัติศาสตร์ก็ได้!"
10053080-153 = "อะไรกัน เลิกพูดอะไรเหลวไหลแบบนั้นได้แล้ว..."
10053080-155 = "สะ... แสงเมื่อกี้มันอะไรกันน่ะ?!"
10053080-156 = "UFO! UFO โผล่มาแล้ว!"
10053080-157 = "ปะ... เป็นมนุษย์ต่างดาวจริงๆ เหรอ...?"
10053080-159 = ""
10053080-160 = "เดี๋ยวนะ... ฉันเคยเห็นของแบบนั้นบ่อยๆ จากที่ไหนนี่นา..."
10053080-161 = "อ้อ นั่นมันพลุแฟลร์ยังไงล่ะ"
10053080-162 = "หืม?"
10053080-164 = ""
10053080-165 = "ข่าวลือที่ว่ารองหัวหน้ากรมความมั่นคงสาธารณะเป็นสายมูและเชื่อเรื่องโชคลางเป็นความจริงสินะ!"
10053080-166 = "ไปกันเลย! พวกเรา! ไปสั่งสอนพวกนั้นเลย!"
10053080-167 = ""
10053080-170 = ""
10053080-171 = "อะไรกัน นี่มันเกิดอะไรขึ้นกันเนี่ย?"
10053080-172 = "คนพวกนั้น... ดูไม่เหมือนมนุษย์ต่างดาวเลยนะ"
10053080-173 = "มันก็แน่อยู่แล้ว! ทำยังไงดีล่ะทีนี้!!"
10053080-174 = ""
10053080-176 = ""
10053080-177 = ""
10053080-178 = "อ้อ... ค่อยเข้าใจง่ายขึ้นมาหน่อยแล้วละ"
10053080-179 = ""
10053080-181 = ""
10053080-182 = "พวกเธอไม่รอดแน่!!!!!"
