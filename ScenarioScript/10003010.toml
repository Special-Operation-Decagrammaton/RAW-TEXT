[translation]
10003010-1 = "제1화;이게 아닌데……?"
10003010-8 = "(그렇게 선도부원들은 합숙 훈련을 위해 호텔에 모여들었다.)"
10003010-11 = "멀뚱히들 있지만 말고! 작전부와 정보부는 기자재를 호텔방 5층으로 옮겨! 이번 훈련의 지휘통제실은 그쪽에 만들 예정이니까!"
10003010-12 = "빨랑빨랑 움직이라고! 훈련 시작까지 얼마 안남았으니까!"
10003010-13 = "넵!!"
10003010-14 = "보급부는 보급 물자의 반입을 서둘러주세요. 그리고 의료부는 이번 훈련에서 사용될 의약품의 물품리스트부터 정리를-"
10003010-15 = "……네, 당장 훈련에 사용할 물건이라면 저쪽으로 옮겨주세요."
10003010-16 = "알겠습니다!"
10003010-20 = "[ns] \"다들 어째 익숙한 거 같네.\""
10003010-21 = "응? 그야 당연하지. 선도부원이잖아. 이 정도도 하지 않으면, 게헨나의 풍기는 못 지킨다구."
10003010-22 = "매달까지는 아니더라도, 이런 식으로 정기적으로 하는 훈련에는 익숙해져 있으니까요."
10003010-23 = "뭐……. 이번 훈련은 다른 때와는 조금 다른 느낌이지만요."
10003010-27 = "여러분, 여기 계셨나요. 임시 지휘통제실의 설치가 끝났답니다. 그쪽에 모이도록 하죠."
10003010-29 = "하계 합숙 훈련 지휘통제실"
10003010-30 = "훈련 준비는 어떻게 되어가나요?"
10003010-31 = "문제없이 진행되고 있어. 우선적으로 준비가 끝난 선도부원들은 숙소에서 대기하도록 시켰고."
10003010-32 = "네, 의료부도 물건은 전부 옮겼어요."
10003010-33 = "그렇군요. 준비에 차질은 없다. 좋았어요. 체크했습니다."
10003010-34 = "그럼 상황을 정리할게요. 현재 저희는 선도부원 100명을 동원해 이곳 아라바 해변으로 훈련을 왔습니다."
10003010-35 = "[s] \"특별히 여기를 선택한 이유가 있어?\""
10003010-36 = "네. 이곳 아라바 해변은 게헨나 내에서도 무척이나 조용한 장소."
10003010-37 = "지난 1년간 발생한 사고 건수도 100건 이하. 문제아들이 주로 저지른 범죄라고 해봐야, 바다의 집 무전취식, 해변가에서의 고성방가. 해변 무허가 건축물 건설 정도였던가요?"
10003010-38 = "[s] \"이미 충분히 시끄러운 거 아냐……?\""
10003010-39 = "게헨나에선 저런 건 어린아이 장난 수준이야."
10003010-40 = "뭐, 이렇게 조용한 곳이라면 마침 이번 저희 계획에 딱 맞겠다 싶었죠. 표면적으로는 하계 합숙 훈련이지만, 저희의 본 목적을 잊어선 안 됩니다."
10003010-41 = "바로……. 이런 조용한 장소에서 부장님을 쉬게 하는 것이라는 걸!"
10003010-42 = "선도부의 훈련도 어디까지나 부장님 없이, 저희끼리만, 제 지시로만 이루어지면 충분합니다."
10003010-43 = "네…… 뭐어."
10003010-44 = "알았다고, 아코 쨩."
10003010-45 = "……하고 말하고 있는 중입니다만, 정작 이오리의 그 차림은 뭔가요! 수영복? 벌써부터 놀 생각으로 가득인 건가요?!"
10003010-46 = "응……?"
10003010-47 = "[s1] \"그러고 보니 아까부터 말하는 걸 깜빡했는데.\"\n[s2] \"무척 멋진 수영복이네. 이오리.\""
10003010-48 = "……?!"
10003010-49 = "……?!"
10003010-50 = "아, 아니거든?! 이건 어디까지나 이번 훈련이 여름 해변에서 벌어지는 거니까. 거기에 맞추려고……."
10003010-51 = "그, 여름 바다에 어울리는 모습이 아니면, 오히려 문제아들이 경계한달까……!"
10003010-52 = "[s] \"이오리라면 어느 쪽이든 눈길을 끌 거라고 생각하지만…….\""
10003010-53 = "거기 잡담은 스토오옵!! 중요한 건 여러분의 여름 휴가가 아니에요!"
10003010-54 = "그러니까 그런 생각 안했다구?! 아코 쨩?!"
10003010-55 = "어디까지나 히나 부장님의 안식과 휴식을 위해. 여러분은 그걸 성립시키기 위한 장기말일 뿐! 이번 계획에서는 의지도, 말도, 아무것도 필요 없어요!"
10003010-56 = "그야말로 부장님을 위한 톱니바퀴로서 기능해주면 됩니다!"
10003010-57 = "……아니, 그렇게까지 말할 건 없잖아……."
10003010-58 = "(뭐, 처음부터 그럴 줄 알고, 전 수영복도 준비를 안했지만요.)"
10003010-60 = "아시겠지요? 여기선 조금의 분란도, 조금의 소음도, 조금의 문제도 허용하지 않겠어요!"
10003010-61 = "[s] \"그런데 정작 히나는?\""
10003010-62 = "아, 부장님이라면 현재 숙소에서 앞으로 4시간 동안의 자유시간을 가지실 예정이예요."
10003010-63 = "응? 4시간?"
10003010-64 = "네, 오후 전술훈련이 끝난 뒤, 저녁식사를 하기 전에 가볍게 선도부의 구보 훈련이 일정에 들어가 있습니다. 부장님은 그때만 호출하기로 했어요."
10003010-65 = "다만 이는 어디까지나 명목상의 훈련. 구보 훈련의 진짜 목적은 부장님의 휴식을 위한 해변가 산책이랍니다."
10003010-66 = "……부장이 그런 걸로 납득을 해?"
10003010-67 = "산책도 훈련의 일종이라고 주장해두었으니까요! 그러니 그때가 오기 전까지 얼른 해변을 정리하고, 훈련도 빠르게 후딱 마쳐 두도록 하죠!"
10003010-68 = "으으음……. 그게 말처럼 쉬울까……."
10003010-69 = "그보다 선임행정관, 한 가지 의문이."
10003010-70 = "네? 무슨 일이죠?"
10003010-71 = "여기 오는 사이, 조금 이상할 정도로 해변이 조용했습니다."
10003010-72 = "더구나 훈련 준비를 하면서 호텔 측이나, 손님 측으로부터 몇 가지 클레임을 받을 각오도 했습니다만, 어째선지 그런 경우가 한 번도 없던 것이 이상하달까……."
10003010-73 = "에이, 그냥 때가 안 맞았던 거 아냐? 우연히 손이 한가한 날 찾았던 거지. 우리가 운이 좋았던 거라고."
10003010-74 = "하아, 이오리. 쓸데없는 말은 화를 불러들인다구요?"
10003010-75 = "그래도……."
10003010-78 = "응? 갑자기 연락이……."
10003010-81 = "네, 선임행정관 아코 받았습니다. 무슨 일인가요?"
10003010-82 = "선임행정관, 보충물자의 구입을 위해 현재 호텔근처의 시장으로 나왔지만. 문을 연 곳이 하나도 없습니다. 어떻게 대응할까요?"
10003010-83 = "……네? 그게 무슨……."
10003010-86 = "안녕하십니까? 당 호텔의 지배인입니다. 잠시 들어가도 괜찮겠습니까?"
10003010-87 = "……네. 무슨 일이시죠?"
10003010-91 = "아아……. 프런트에서 전해 들었을 땐 귀를 의심했지만, 정말로 와주셨군요! 게헨나의 선도부 여러분!"
10003010-92 = "무슨 소리야?"
10003010-93 = "……뭔가 싸한 느낌이 드는데요."
10003010-94 = "네? 여러분께서는 제 도움 요청을 듣고 여기까지 찾아와 주신 거 아니십니까?"
10003010-95 = "[s] \"저기, 그게 무슨 뜻인지?\""
10003010-96 = "아이고! 지금 이 근처가 난리도 아닙니다! 원래부터 슬럼가를 차지하고 있던 헬멧단과 근래 들어 갑자기 나타난 불량배들이 정면으로 충돌하더니!"
10003010-97 = "그 갈등의 골이 깊어지다 못해, 결국 4시간 뒤에 누가 이 해변가와 슬럼가의 진정한 주인인지 전면전으로 그 자웅을 겨루겠다지 뭡니까!"
10003010-98 = "전면전이라고……?"
10003010-99 = "그게 인터넷에서 난리가 나서, 여기저기서 구경을 온다느니, 누가 이길지 내기를 한다느니 소란이 나서는……! 그걸 들은 이 부근의 상인들이 전부 가게를 닫고 도망가버렸습니다요!"
10003010-100 = "이대로 가다간 단순히 싸움만 붙고 끝나는 게 아니라, 저희 호텔이고, 이 근처의 상권이고 그냥 싸그리 망하게 생겼습니다요!"
10003010-101 = "모처럼 새롭게 단장하기 위해, 온천 개발도 시작한 참인데!!"
10003010-102 = "하지만 바로 이때 기다렸다는 듯이 방문해주신 선도부 여러분이라니! 제발 부탁드립니다! 4시간 뒤의 대규모 전면전을 막아주십쇼!"
10003010-110 = "대규모 전면전……?!"
10003010-111 = "[s3] \"음, 그러니까. 그게…….\"\n[s4] \"이오리의 입이 화를 불러들였다?\""
10003010-112 = "억울해! 이게 내 잘못이야?!"
10003010-113 = "억울해! 이게 내 잘못이야?!"
10003010-114 = "자, 자, 잠깐. 그게 무슨 소리인가요?!"
10003010-115 = "애당초 아코 쨩, 여기가……. 게헨나에서도 가장 조용한 해변이라며?!"
10003010-116 = "아니, 그건 제가 되묻고 싶은 말이라고요?!"
10003010-117 = "……방금 인터넷을 확인해보니 지배인의 말이 사실입니다."
10003010-118 = "현재진행형으로 게헨나 SNS 사이트에서 4시간 후에 있을 대규모 전면전이 엄청 화제가 되고 있는 모양이에요."
10003010-120 = "<GehEricha0201>: 그러고 보면 오늘이라고 하지 않았어?"
10003010-121 = "<#Nyanko&>: 해변가에서 세력 다툼이 있다며?"
10003010-122 = "<akusi-girl>: 이번 여름 행사 중에 가장 큰 이벤트 아님? ㅋㅋ?"
10003010-123 = "<EATorDIEOfficial>: 어머, 이건 어쩌면 새로운 기회일지도 모르겠군요."
10003010-124 = "……등등. 이미 이곳저곳 할 거 없이 뜨겁게 불타오르고 있어요."
10003010-125 = "네엣?!"
10003010-128 = "앗?! 부장님으로부터 연락이?!"
10003010-131 = "저기, 아코……. 합숙계획표가 조금 이상한데? 아무것도 하지 않고 4시간 동안 방에서 대기? 의미를 모르겠어. 당장 내 방으로 와줘."
10003010-134 = "하필 이런 순간에, 부장님께서 호출을?!"
10003010-135 = "아니, 당연히 훈련에 오자마자 4시간의 자유시간을 보내라고 하면 의심부터 하겠지……."
10003010-138 = "아아아! 진짜! 이럴 때 또 누가 전화를?!"
10003010-139 = "응? 만마전이라고요?!"
10003010-142 = "아코 선임행정관? 이전번에 제출해주신 결재요청문서를 읽어보았습니다만. 세부항목에서 미스를 발견했습니다. 잠시 이곳에 와주셔야 할 것 같군요."
10003010-143 = "네?! 자, 잠깐! 갑자기요?!"
10003010-146 = "아, 아아……."
10003010-152 = "아코 행정관, 급히 보고 드립니다!"
10003010-153 = "현재 해변에서 정체불명의 소규모 집단이 충돌을 시작했습니다. 대응이 필요합니다!"
10003010-159 = "케헤헤! 이 해변은 지금부터 우리가 접수한다! 4시간 뒤를 기다릴 것도 없지! 자, 헬멧단 녀석들 쓸어버려주마!"
10003010-160 = "감히 여기가 어디라고! 외부에서 찾아온 어중이떠중이들에게, 이 구역을 넘길 수 있겠냐!"
10003010-166 = "이, 이 무, 무슨……."
10003010-167 = "아코, 지금 어디야? 방금 밖에서 총성이 들린 것 같은데, 훈련 예정이 바뀌기라도 했어?"
10003010-168 = "아, 아코 쨩 어떡해?!"
10003010-169 = "……언제나 안 좋은 일은 한꺼번에 찾아온다고 했던가요. 선임행정관. 대응을."
10003010-175 = "읏……!"
10003010-177 = "후우……. 후우……."
10003010-178 = "……좋아요. 좋다구요."
10003010-179 = "[ns] \"아코……?\""
10003010-180 = "어디 마음껏 와보라 이겁니다! 제가 이 정도의 장애물도 뛰어넘지 못할 것 같나요?!"
10003010-181 = "일단 선생님! 히나 부장님께 가서, 이번 사태가 별 것 아니라고 말씀 전달 부탁드립니다! 합숙 훈련 계획은 예정대로 진행중이며, 현재 상태에선 아무런 문제도 없다구요!"
10003010-182 = "다만 아직 선도부장으로서 할 일이 없기에 대기명령이 떨어진 거라고 전해주시면, 어떻게든 얼버무릴 수 있을 거예요!"
10003010-183 = "중요한 건 부장님께서 절대로……. 저어어어얼대로! 방 밖으로 나오지 못하게 하는 겁니다! 아시겠죠?!"
10003010-184 = "[s] \"네, 넵.\""
10003010-185 = "그리고 이오리, 치나츠. 두 사람은 선도부원들을 데리고 함께 해변가의 소동을 해결하세요."
10003010-186 = "으, 응!"
10003010-187 = "알겠습니다."
10003010-188 = "그리고 저는……. 게헨나로 복귀합니다! 귀찮은 만마전 녀석들을 해결하고 올 테니까요! 상황은 꼬이고 있지만, 저희의 목표는 단 하나!"
10003010-189 = "반드시 부장님의 휴가를……"
10003010-190 = "쟁취하는 겁니다!"
10003010-191 = "[s] \"오, 오우!\""
