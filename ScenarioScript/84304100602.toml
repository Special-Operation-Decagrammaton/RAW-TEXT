[translation]
84304100602-6 = "괘, 괜찮으세요. 선배……? 다치신 데는 없어요?"
84304100602-7 = "괜찮아요, 코하루. 신경 써줘서 고마워요."
84304100602-8 = "역시 코하루는 상냥하군요."
84304100602-10 = "죄송합니다. 기계 페이스는 분명 시연 전에 한 차례 맞췄었는데……"
84304100602-11 = "다른 기기들도 같은 문제가 있는지 알아볼게요!"
84304100602-12 = "후후, 부탁드려요. 이왕 왔으니, 목표한 양만큼은 하고 싶거든요."
84304100602-13 = "그렇지, 코하루도 어떤가요? 가볍게 조금 정도는 괜찮을지도 모르겠어요. 저라도 괜찮다면 봐 드릴 게요."
84304100602-14 = "저, 저요!? 선배가…… 저를!?"
84304100602-15 = "네, 네……!!"
