[translation]
10049020-1 = "제2화;스즈미 & 레이사 with 시미코"
10049020-2 = "그렇다면, 서로 이해한 사항이 맞는지 검토차 정리해 보겠습니다."
10049020-3 = "도서부 부원이신 엔도우 시미코 양께서 야간작업 중, 우연히 헬멧단원들의 대화를 들으셨고요."
10049020-4 = "네, 네! 맞습니다."
10049020-5 = "시미코 양의 말씀에 따르면, <보더랜드 놀이공원>에서 코마카제 라브가 이끄는 퐁당퐁당 헬멧단이 모종의 사건을 일으키는 듯하군요."
10049020-6 = "그리고, 자경단의 모리즈키 스즈미 씨께 즉시 해당 정보를 알려주셨고요."
10049020-7 = "스즈미 씨, 그 두 사람은 구호기사단에 이송된 상태인가요?"
10049020-8 = "의식이 돌아오는 대로 정의실현부 측에서 환자를 취조해 보겠습니다."
10049020-9 = "아닙니다."
10049020-10 = "이송하지 않으셨다는 건가요? 현장에 그대로 방치를 하셨다는……."
10049020-11 = "그게 아니라, 개입하지 않고 바로 신고하러 왔다는 겁니다."
10049020-12 = "무력으로 제압하지도 않았고 그 두 사람은 저희의 존재를 모릅니다."
10049020-13 = "……?"
10049020-14 = "혹시 오늘따라 몸이 편찮으시다면 구호기사단을 불러 드릴까요."
10049020-15 = "제게는 육체적으로는 아무 문제 없습니다."
10049020-16 = "……이건 정의실현부의 소관 사항이니, 신고했을 뿐입니다."
10049020-17 = "네?"
10049020-22 = "달력은 왜 보시는 건가요?"
10049020-23 = "아, 아닙니다. 실례했습니다."
10049020-24 = "(만우절은 아니었군요…….)"
10049020-25 = "상황은 이해했습니다. 다만……."
10049020-26 = "송구합니다만, 본 건에 대한 정의실현부의 출동이나 공식적 대응은 불가능합니다."
10049020-27 = "네? 어째서죠……?"
10049020-28 = "……."
10049020-29 = "두 분의 적극적인 대응에는 감사합니다. 다만…… 장소의 문제가 있습니다."
10049020-30 = "<보더랜드 놀이공원>은, 다소 까다로운 위치에 있습니다."
10049020-31 = "일단 트리니티 자치구의 영역이니, 정의실현부의 관할 아닌가요?"
10049020-32 = "그 놀이공원의 정문은 트리니티에 있지만, 후문을 포함한 절반가량의 시설은 게헨나에 자리 잡고 있습니다."
10049020-33 = "즉, 그 놀이공원은 트리니티와 게헨나의 경계선상에 존재하는 것이지요."
10049020-34 = "트리니티의 집행기관인 정의실현부가 개입해도, 놀이공원 안의 게헨나 지역으로 넘어가 버리면 권한도, 방법도 없습니다."
10049020-35 = "그런 점을 악용해서, 좋지 않은 일을 저지르는 자들이 있다고도 합니다."
10049020-36 = "……저희들의 정보 자체를 의심하는 것은 아니신가요?"
10049020-37 = "전혀요. 사실 유사한 첩보는 몇 차례 들어온 바가 있습니다."
10049020-38 = "특히, 그 '코마카제 라브'가 개입한 것이 유의미하다고 생각됩니다. 트리니티 입장에서는 다소 신경 쓰이는 인물이니까요."
10049020-39 = "정의실현부가 군소 규모 헬멧단의 대장을 신경 쓰는 건 놀라운 일이군요."
10049020-40 = "어떻게 덧날지 걱정되는, 아픈 손가락이라 해두겠습니다."
10049020-41 = "……."
10049020-43 = "……?"
10049020-44 = "종합하자면, 두 분이 제보 주신 사안에 대해서는 겉치레가 아니라 실제로 깊게 우려하고 있습니다."
10049020-45 = "트리니티 쪽 관할구역은 어떻게 대처가 가능하다고 해도……."
10049020-46 = "현재 정의실현부의 업무 과중으로 인해 인력이 부족한 실정입니다. 많은 인력을 동원하기도 힘들고요."
10049020-47 = "그래서, 제가 제안드릴 수 있는 사항은 다음과 같습니다."
10049020-48 = "목격자이신 시미코 씨는 해당 헬멧단원의 인상착의와 목소리를 기억하실 테고요."
10049020-49 = "네, 네!"
10049020-50 = "다행입니다. 그리고, 스즈미 씨의 무력은 깊이 신뢰하고 있습니다."
10049020-51 = "……."
10049020-53 = "그러니, 두 분께서 그곳에서 상황을 지켜봐 주시겠어요?"
10049020-54 = "네?"
10049020-55 = "가셔서 적극적으로 교전하시거나 제압하진 마시고…… 부득이한 상황이다 보니 현지에서 상황 확인만을 부탁드리려 합니다."
10049020-56 = "목격하신 바가 확인되고, 목표가 특정되어 즉각적인 대응이 불가피한 경우에 최대한 빨리 개입하겠습니다."
10049020-57 = "……즉, 정의실현부는 전면에 나서지 않는다, 라는 건가요?"
10049020-58 = "네. 정의실현부가 순찰하게 된다면, 타겟이 도주할 수 있으니까요."
10049020-59 = "또한, 그렇게 된다면 게헨나와의 불필요한 충돌이 발생할 수도 있습니다."
10049020-60 = "그렇기에, 두 분의 힘을 빌리고자 합니다."
10049020-61 = "보안 유지만 담보된다면, 다른 분과 협조를 구하셔도 좋습니다."
10049020-63 = "갑자기 그렇게 말씀하셔도……."
10049020-64 = "……그렇군요."
10049020-65 = "물론, 정의실현부 측에서도 최대한의 협조와 지원을 하겠습니다."
10049020-66 = "어디까지나 상황의 확인이니만큼, 여러분의 안전도 고려해 직접 개입은 자제 바랍니다."
10049020-71 = "앗!! 스즈미 씨!"
10049020-76 = "시미코 씨도!"
10049020-77 = "우와아!! 정의실현부 회의실에서 나오시다니!! 뭔가 멋진 일을 상의하고 오셨나요?!"
10049020-79 = "……."
10049020-80 = "……."
10049020-82 = "어, 어라……?"
10049020-88 = "도서부 휴게실"
10049020-89 = "에엑- 그런 억지가-!"
10049020-90 = "아뇨 레이사 씨. 충분히 이해는 됩니다."
10049020-91 = "정의실현부 입장에서도 무척 곤란한 일이었을 테고,"
10049020-92 = "자잘한 협조는 종종 있었지만, 이런 요청은 이례적이긴 합니다."
10049020-93 = "그만큼 중요한 사안이겠지요."
10049020-94 = "그치만, 갑자기 싸우게라도 된다면 어떡하죠?"
10049020-95 = "저와 스즈미 씨 둘이서는 몇 명이나 될지 모르는 헬멧단을 상대할 수 있을지……."
10049020-97 = "세 명입니다!"
10049020-98 = "네?"
10049020-99 = "우리 자경단의 슈퍼스타, 필살의 히어로인 제가 있잖아요!"
10049020-100 = "우리……? 자경단이 원래 조직이었던가요?"
10049020-101 = "딱히 그런 것은 아닙니다. 정의실현부와 달리 자경단은 어디까지나 자칭이니까요."
10049020-102 = "그렇지만, 레이사 씨 정도의 우수한 전력이 함께 있다면 큰 도움이 될 거라고 생각합니다."
10049020-103 = "함께 해 주시면 감사하겠습니다."
10049020-104 = "물론입니다!!!!!!!"
10049020-105 = "시미코 씨도 도서부의 일로 바쁘실 텐데 도와주셔서 감사합니다."
10049020-106 = "아뇨, 아뇨! 당치도 않아요!"
10049020-107 = "오히려 제가 말씀드린 것을 진지하게 들어주셔서 감사한걸요!"
10049020-108 = "저도 최선을 다해볼게요!"
10049020-109 = "그러면 바로 작전계획 수립인가요!"
10049020-111 = "먼저, 현시점에서 파악된 정보입니다만……."
10049020-112 = "정의실현부의 정보 공유에 의하면 퐁당퐁당 헬멧단은 그 수장, 코마카제 라브를 필두로 모인 소규모 조직입니다."
10049020-113 = "시미코 씨의 정보를 종합하면. 이번 <보더랜드 놀이공원>에서 여러 헬멧단이 동원되는 것으로 보입니다."
10049020-114 = "그래서 정확한 규모를 파악하기는 힘들겠구요."
10049020-115 = "누가, 얼마나 숨어있을지 모르는 거군요!"
10049020-116 = "네. 또한, 정의실현부는 어디까지나 정보의 확인만을 요청했습니다. 직접적인 교전은 최대한 피해야 하겠지요."
10049020-117 = "그러려면 잠복하는 것이 가장 좋겠지만……."
10049020-118 = "손님으로 위장한다면 주말인지라 방문객이 많아 저희 간에 식별이 어려울 것 같군요."
10049020-120 = "그렇다면 직원으로 위장하면 안 되나요?"
10049020-121 = "오히려 직원의 경우에는 못 보던 얼굴이라 다른 직원들의 눈에 띄게 될 수도 있습니다."
10049020-122 = "좀 더 고민을 해봐야겠지만, 준비에 드는 시간이 많지 않아서 빨리 결정해야겠습니다."
10049020-123 = "일단, 참고차 받은 놀이공원 팜플렛입니다. 뒤에 지도가 있으니 숙지하도록 하지요."
10049020-124 = "감사합니다. 근처에 동물원하고…… 호수도 있네요. 성벽으로 둘러싸여 있고, 출입구는 정해진 곳뿐이고요."
10049020-125 = "후훗, 마치 동화 속 세상 같네요."
10049020-127 = "오…… 오오……!"
10049020-131 = "레이사 씨? 지도는 팜플렛의 그 뒷면에 있는데요?"
10049020-132 = "바로 이겁니다!!"
10049020-133 = "이거…… 라뇨?"
10049020-134 = "네?"
10049020-138 = "보더랜드 놀이공원 트리니티 구역"
10049020-140 = "이 풍선, 아까 샀는데 벌써 바람이 다 빠져버렸어!"
10049020-141 = "팝콘 통 뚜껑이 떨어졌어! 우애앵-"
10049020-142 = "우애애앵-"
10049020-143 = "이거 바꿔주세요! 바꿔줘-!"
10049020-146 = "우와!!"
10049020-147 = "스즈미 씨! 사람들이 엄청 많습니다!"
10049020-148 = "어서 나오세요!"
10049020-149 = "아…… 아직 마음의 준비가……."
10049020-150 = "더 늦으면 놓쳐버릴지도 몰라요!"
10049020-151 = "자! 출동입니다!"
10049020-158 = "스즈미 씨! 잘 어울리니까, 부끄러워하지 않으셔도 됩니다!"
10049020-159 = "(우으…….)"
10049020-160 = "(어쩌다 이렇게…….)"
