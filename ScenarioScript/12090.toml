[translation]
12090-1 = "제9화;카이저 PMC 1"
12090-2 = "으아, 이, 이녀석들 뭐야. 대체?"
12090-3 = "딱히 세진 않은데 거슬린달까, 번거롭달까…… 지금까지 겪어본 녀석들 중에 제일 까다로운 느낌이야."
12090-4 = "으, 으음……. 어쩌면 선도부, 혹은 그 이상……."
12090-5 = "뭐죠, 이 사람들은……. 여기서 뭘 하고 있는 거죠?"
12090-6 = "시설의 식별 마크를 찾았어요!"
12090-8 = "이건……."
12090-9 = "잠시만요. 확인 중입니다……."
12090-10 = "……확인됐어요, 이건, 이 집단은……"
12090-11 = "카이저 PMC야……."
12090-13 = "……?! 네. 맞아요. 카이저 PMC라는 곳입니다."
12090-14 = "카, 카이저……? 이 녀석들도 카이저 코퍼레이션이야?"
12090-15 = "네. 명부에 등록되어 있진 않지만…… 카이저 코퍼레이션의 계열사로……."
12090-16 = "진짜 징글징글하잖아, 어딜 가도 카이저, 카이저, 카이저야?! 뭐야, 대체!!"
12090-18 = "하지만 PMC라면……."
12090-19 = "그게 뭐야, 선배?"
12090-20 = "사설 용병 기업(Private Military Company)을 뜻하는 거예요……"
12090-21 = "용병……?!"
12090-22 = "……."
12090-23 = "헬멧단 같은 불량배들과는 질적으로 달라요. 정말 조직화된…… 그러니까 말하자면, 군대 같은 거예요!"
12090-24 = "……!"
12090-25 = "구, 군대?! 하, 학생들이 아니라?!"
12090-26 = "기업이 자퇴생이나 퇴학생, 불량 학생 등을 모아서 사설 병력으로 만든다는 소문이 있었는데…… 그게 설마……."
12090-28 = "(위이이이이이이이이잉-!!)"
12090-30 = "겨, 경보음이……?!"
12090-31 = "사방에서 들려오고 있어……. 이거 뭔가 큰일나는 분위기인데……."
12090-33 = "이건…… 헬기 소리……?"
12090-34 = "그리고 이 땅의 진동은…… 전차야."
12090-35 = "대규모 병력이 접근 중! 이쪽을 포위하고 있습니다!"
12090-36 = "전차와 장갑차, 헬기까지 확인되었어요……! 어, 엄청난 병력이에요!"
12090-37 = "모두들, 거기 있으면 위험합니다! 포위되기 전에 퇴각해야 해요! 포위망을 뚫고 탈출해야 해요!"
12090-38 = "선생님! 지시를 부탁드립니다!"
