[translation]
32030-1 = "제3화;비밀 모임"
32030-2 = "……그렇군요. 히후미 쨩은 선생님과 함께 앞으로의 일들에 대한 논의를……."
32030-3 = "하나코 쨩은 선생님에게 상담할 게 있어서…… 잠옷 차림으로……."
32030-4 = "……가 아니잖아요! 어째서 수영복을 잠옷으로 쓰는 거예요……!!"
32030-5 = "어머? 저는 채플도 수영복 입고 참석했었답니다? 다들 고정관념에 너무 사로잡혀 있다니까요."
32030-6 = "아우우……."
32030-7 = "[s] \"하나코. 아즈사에 대해 상담할 게 있다고 했지?\""
32030-8 = "네. 맞아요."
32030-9 = "……."
32030-10 = "……그러네요. 히후미 쨩도 같이 들어주셔야 할 거 같네요."
32030-11 = "아즈사 쨩, 매일 밤마다 어디로 나가서 새벽까지 돌아오지 않고 있어요."
32030-12 = "……아즈사 쨩이."
32030-13 = "처음엔 단순히 낯선 곳에 와서 잠을 잘 못 자나 싶었지만, 그런 게 아닌 거 같아요."
32030-14 = "더 신경쓰이는 건…… 전 아즈사 쨩이 제대로 잠들어 있는 모습을 본 적이 없다는 거예요."
32030-15 = "그러고 보니…… 저도…… 아즈사 쨩은 늘 먼저 일어나있거나 늦게까지 잠들지 않았던 거 같은 기분이……."
32030-16 = "아즈사 쨩이 뭘하고 있는지는 모르겠지만…… 슬슬 억지로라도 잠을 재워야하는게 아닐까 싶어요."
32030-17 = "저는 아즈사 쨩이…… 어딘가 불안해하고 있는 걸로 보였어요."
32030-18 = "……."
32030-19 = "무슨 이유인지는 모르겠지만, 그 불안을 어떻게든 진정시키지 않으면 안 돼요. 사람은 자지 않으면 안 되니까요."
32030-20 = "이대로라면 건강을 해치게 될 거예요."
32030-21 = "그건 아즈사 쨩 뿐만 아니라, 선생님과 히후미 쨩도 마찬가지예요. 좀 더 몸을 챙기지 않으면 안 돼요."
32030-22 = "보충수업도 중요하지만 기껏해야 낙제가 될 뿐이잖아요? 건강과 비교할 게 아니에요."
32030-23 = "[s] \"그건…….\""
32030-27 = "……."
32030-28 = "……. 아니에요. 하나코 쨩. 그게 아니에요……."
32030-29 = "히후미 쨩……?"
32030-30 = "기껏해야 낙제 같은 게 아니라구요……!! 남은 두번의 시험에 모두 실패하면……"
32030-31 = "저희는 퇴학이라고요!! 트리니티를 떠나야 한다고요!"
32030-35 = "네?! 퇴학……? 히후미 쨩, 무슨 소리를……."
32030-36 = "그, 그런 건 교칙상 성립되지 않아요, 히후미 쨩. 퇴학이라는 게 그렇게 간단하게 되는 게 아닌데……."
32030-37 = "[s] \"사실이야. 하나코.\""
32030-38 = "……선생님?"
32030-39 = "……."
32030-44 = "[ns] 보충수업부의 진실에 대해서 이야기한다."
32030-47 = "……."
32030-48 = "……."
32030-49 = "……. 과연. 그랬군요. 3번의 낙제 이후 전원 퇴학이라."
32030-50 = "이런 연좌제 자체가 애초에 성립되지 못하지만, 샬레가 가진 초법적 권한을 그렇게 해석하면…… 이해했어요."
32030-51 = "이해했어요, 가 아니에요. 하나코 쨩……."
32030-52 = "하나코 쨩, 사실은 공부 잘 했잖아요? 3학년 심화과정까지 모조리 만점 맞았잖아요? 그것도 1학년 때!"
32030-53 = "……."
32030-54 = "옛날 시험지를 찾아보다가 알게 되었다구요…… 성적을 훔쳐본 건 미안하지만……."
32030-55 = "어째서 시험을 망치고 있었던 거예요? 하나코 쨩이 시험을 망쳐버리면 저희 모두가……."
32030-56 = "……저는 전혀 몰랐어요. 보충수업의 결과가 연좌제로 인한 퇴학이라니, 설마 그런 걸……."
32030-57 = "……."
32030-58 = "……미안해요. 몰랐다는 핑계로 용서받을 수 있는 건 아니겠죠……."
32030-59 = "선생님에게도, 히후미 쨩에게도, 아즈사 쨩과 코하루 쨩에게도 심한 폐를 끼쳤었네요."
32030-60 = "죄송합니다. 선생님."
32030-61 = "미안해요, 히후미 쨩."
32030-62 = "아, 아우…… 아, 아니에요. 하나코 쨩……."
32030-67 = "……. 네. 맞아요. 저는 일부러 시험을 망치고 있었어요."
32030-68 = "여, 역시……!! 어째서 그런 짓을…… 하나코 쨩? 이유가 뭐예요?"
32030-69 = "……그건 알려드릴 수 없어요."
32030-70 = "……?!"
32030-71 = "제 개인적인 이유라서……. 그치만 그걸로 모두가 피해를 보는 것도 말도 안 되죠."
32030-72 = "장난은 여기까지 할게요."
32030-73 = "최소한, 보충수업부의 모두가 무사할 때까지 시험에 최선을 다할게요."
32030-74 = "[s] \"고마워, 하나코.\""
32030-75 = "네? 아, 아니에요. 선생님이 저에게 감사할 일은……."
32030-76 = "오히려 제가 알몸으로 사죄해야 할 일이잖아요? 지금이라도 사과를 하게 해주시겠어요?"
32030-77 = "아, 아우…… 사과는 충분히 했고! 이제 진심을 다한다고 했으니…… 괘, 괜찮아요. 하나코 쨩."
32030-78 = "……. 그런데 이 사실을 알고 있는 건…… 히후미 쨩과 선생님뿐인가요?"
32030-79 = "네? 네…… 저희 말곤 아직 아무도……."
32030-80 = "그렇군요……. 아즈사 쨩의 불안은 시험 때문은 아니었나 보네요. 거기엔 아직 제가 모르는 게 더 있는 것 같지만……."
32030-81 = "지금은 그것보다는……. 이 보충수업부의 존재가 신경 쓰이는데……."
32030-82 = "……."
32030-83 = "미카 씨……는 무리겠고, 나기사 씨겠네요. 이런 짓을 꾸밀 사람은."
32030-84 = "[s] \"……!\""
32030-85 = "어째서……? 에덴조약이 코앞인데 어째서 이런 짓을……?"
32030-86 = "……아니, 오히려 그렇기 때문에……?"
32030-87 = "……."
32030-88 = "…………."
32030-89 = "……알겠네요. 보충수업부는 에덴조약을 방해하려는 혐의를 받고 있는 용의자들의 모임이군요."
32030-90 = "[s] \"……?!?!\""
32030-91 = "네, 네?!"
32030-92 = "나기사 씨답네요. 그 교활한 암고양이는 늘 그런식이었죠."
32030-93 = "아, 암고양이……?"
32030-94 = "바구니에 모아서 한꺼번에 처리하는 게 효율적이다…… 아마 그런 논리겠죠. 저희는 빨랫감 취급을 받고 있었나 보네요."
32030-95 = "[s] \"빨랫감보다는 쓰레기 취급이었지만…….\""
32030-96 = "……그렇다면 선생님도 나기사 씨에게 당한 거네요."
32030-97 = "아마 낙제생들을 구해준다는 선의로 이 역할을 맡으셨지만, 사실은 샬레의 초법적 권한만 이용당한 거고."
32030-98 = "그래도 저희를 위해 이렇게 노력해주고 계셨군요……."
32030-99 = "선생님은 역시…… 좋은 분이네요. 우후후♡"
32030-100 = "탐정 같아요, 하나코 쨩……."
32030-101 = "네…… <트리니티의 배신자>, 나기사 님은 그걸 저에게 찾아내라고 했었어요."
32030-102 = "……후후. 트리니티의 배신자라니. 정말 그 사람다운 표현이네요. 자신의 계획에 방해가 되는 것은 모두 다 배신자라는 논리니까요."
32030-103 = "……아즈사 쨩은 아무래도 서류가 수상하니 그렇다고는 해도……"
32030-104 = "코하루 쨩이라면…… 아니, 정의실현부의 인질이라는 관점으로 보면 억지긴 해도 납득은 되지만……."
32030-105 = "히후미 쨩……? 히후미 쨩은 어째서 용의자가 된 거죠? 나기사 씨랑 친분이 있는 거 아니었어요?"
32030-106 = "네?! 네? 저, 저도 용의자였어요?"
32030-107 = "아, 아우우……. 그건…… 그, 그렇군요…… 어, 어째서 저도 의심받고 있었던 거죠……."
32030-108 = "[s] \"…………….\""
32030-111 = "……. 아즈사 쨩에 대해서는 나중에 좀 더 얘기를 나눠볼 필요는 있겠네요. 저도 이것저것 더 확인해볼게요."
32030-112 = "네…… 하나코 쨩도 좀 더 알아낸 게 있다면 저와 선생님께 알려주세요."
32030-113 = "그럼 저도 이 심야의 비밀 모임에 끼워주시는 건가요? 우후후. 기뻐라♡"
32030-114 = "심야의 밀실에서 셋 만의 비밀 장난…… 생각만으로도 두근두근하네요♡"
32030-115 = "아우……. 비밀 장난은 아니지만……."
32030-116 = "[s] \"그럼 밤이 늦었으니까 오늘은 여기까지 하는 걸로…….\""
32030-117 = "네. 그럼 내일 뵐게요, 선생님."
32030-118 = "안녕히 주무세요."
32030-121 = "으응…… 화장실……."
32030-125 = "……선생님 방? 이 늦은 시간에도 아직 안자고……."
32030-129 = "수고하셨습니다, 선생님……어라?"
32030-130 = "……?!"
32030-131 = "히, 히후미?! 서, 선생님 방에서……?!"
32030-132 = "네, 그럼 다음에도 셋이서 같이 금지된 비밀 장난을……."
32030-133 = "……어머나?"
32030-134 = "……."
32030-139 = "부, 불결해!! 사형!! 사형이야!!!"
32030-141 = "(그렇게 또 하루가 지나고 있었다.)"
32030-143 = "다음화;수영복 좌담회"
