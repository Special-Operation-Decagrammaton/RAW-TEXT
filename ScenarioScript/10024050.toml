[translation]
10024050-1 = "5화;거일반삼: 한 가지를 가르치면 세 가지를 알다."
10024050-2 = "매화원 내부"
10024050-4 = "72점, 53점, 81점, 48점……"
10024050-5 = "휴우, 오늘 분 채점은 이것으로 끝! 기지개라도 좀 켤까……"
10024050-6 = "끄응…… 아이들은 왜 이렇게 공부하기를 싫어할까?"
10024050-7 = "그렇게 어려운 문제를 내지도 않았는데, 항상 보충 학습이 필요한 아이들이 생겨나니."
10024050-8 = "슌 언니가 또 너무 어렵게 시험문제 내지 말라고 잔소리하겠네……"
10024050-15 = "안녕, 교관 쨩. 매화원에서 만나는 건 오랜만이네."
10024050-16 = "루미 회장님? 안녕하세요!"
10024050-17 = "그보다 교관 쨩이라뇨! 제게는 코코나라는 어엿한 이름이 있다구요!"
10024050-18 = "그래, 그래. 코코나 쨩. 잘 지냈어? 교관 일은 힘들지 않고?"
10024050-25 = "(코코나 쨩이라고 불리는 것도 어린애 취급받는 것 같아서 조금 아쉽지만……)"
10024050-26 = "(저는 어엿한 숙녀니까요! 이 정도는 부드럽게 넘길 수 있다구요!)"
10024050-29 = "끄떡없어요! 저도 한 명의 교관이니까요!"
10024050-30 = "수고가 많군. 코코나 쨩. 뭐 필요한 거 없는가?"
10024050-31 = "바쁜데 실례하는 것은 아닌지 모르겠습니다. 코코나 교관."
10024050-32 = "시, 실례라뇨. 천만에요! 어서 오세요!"
10024050-33 = "그런데…… 현무상회분들과 현룡문분이 함께 계시다니, 드문 일이네요?"
10024050-34 = "여기에는 그럴 만한 사정이……"
10024050-36 = "그래. 잘 말해 주었다. 저런 나쁜 언니들이랑 놀면 안 된단다. 전통의 가치도 모른 채 겉멋만 들어서, 허구한 날 뒤로 무언가를 꾸미는 언니들이랑은."
10024050-37 = "그렇습니다. 저런 심보 고약한 사람들과 어울려서는 안 됩니다. 한 장소에 갇혀 발전할 줄도 모르고 남을 억압하기만 하는 사람들과는 말이죠."
10024050-43 = "……말 다 했나, 현무상회? 조심하라고. 나는 적어도 내 것은 되찾는 인간이야."
10024050-44 = "현룡문이야말로 말을 삼가시죠. 이곳은 당신들의 구역이 아닙니다."
10024050-46 = "아, 아하하……"
10024050-47 = "[s] \"자, 자. 둘 다 거기까지. 코코나 쨩 앞이잖아.\""
10024050-48 = "쳇."
10024050-49 = "흥."
10024050-51 = "고마워, 선생님. 나이스 중재."
10024050-52 = "그래서, 우리가 여기에 온 이유 말인데. 코코나 쨩……"
10024050-58 = "[ns] \"혹시 최근 산해경 밖으로, 내용물을 모르는 물건을 옮겨 준 적 있어?\""
10024050-59 = "내용물을 모르는 물건을, 산해경 밖으로요? 그런 건……"
10024050-60 = "아! 그러고 보니……!"
10024050-61 = "짚이는 게 있는 모양이지?"
10024050-63 = "네! 어떤 학생분에게, 현무상회의 식재료 박스를 학원 밖의 아는 사람에게 전달해 달라고 부탁받은 적이 있어요!"
10024050-64 = "……역시 현무상회의 식재료 박스라 이거군."
10024050-65 = "섣부른 판단은 삼가 주시죠. 그 학생의 인상착의를 기억합니까?"
10024050-67 = "아뇨…… 어딘가 몸이 좋지 않았는지, 마스크를 쓰고 있었어서 거기까지는 모르겠어요."
10024050-68 = "인상착의를 숨긴 건가. 좋아. 이걸로 더더욱 현무상회 쪽에 수상함이 실리기 시작했군."
10024050-69 = "무슨 근거로 그렇게 단정하는 겁니까."
10024050-70 = "현무상회는 식재료를 위해서라면 뭐든지 하잖나. 안 그런가?"
10024050-71 = "……그런 면이 없다고는 하지 못하겠지만,"
10024050-73 = "하부 유통 조직 중 누군가가 얼굴을 숨길 정도로 불법적인 걸 다루고 있었다면, 누구보다 저에게 먼저 연락이 들어왔을 겁니다."
10024050-74 = "호오, 그건 흥미롭군. 루미 회장이 아니라?"
10024050-75 = "뭐…… '그런 쪽'의 일은 레이죠에게 어느 정도 맡겨 두었으니까 말이지……"
10024050-76 = "아직까지 레이죠가 날 실망시킨 적은 없어. 그건 내가 보증하지."
10024050-78 = "아! 그리고 매화원 원생들에게 조금 이상한 심부름 의뢰가 들어오기도 했어요."
10024050-80 = "원생들에게?!"
10024050-82 = "아이들에게…… 말입니까?!"
10024050-83 = "……조금 더 자세히 이야기해 주지 않겠나?"
10024050-84 = "으음…… 그러니까, 매화원에서는 원아들의 심부름 연습을 위해서 가벼운 물건 전달 같은 걸 의뢰받기도 해요."
10024050-85 = "그런데 최근…… 학원 밖의 사람들에게 물건을 전해 달라는 의뢰가 몇 건 들어와서요."
10024050-86 = "그 의뢰를 받아들였습니까, 코코나 교관?"
10024050-87 = "네? 네에…… 절대 위험하지 않은 일이라고도 했었고, 여차하면 자기들이 아이들을 지켜 주겠다고도 했었고……"
10024050-88 = "한 번은 저도 같이 갔다 왔거든요. 큰 문제는 없었어요."
10024050-90 = "애초에 산해경의 원아들을 함부로 건드릴 만큼 겁 없는 무리가, 키보토스 안에 얼마나 있겠어요?"
10024050-95 = "……이용당했군."
10024050-96 = "네? 무슨 말씀이시죠?"
10024050-97 = "아뇨. 아닙니다. 코코나 교관. 저희는 이만 실례하겠습니다. 선생님?"
10024050-98 = "[s] \"아, 응. 그래. 그렇지! 오늘 고마웠어, 코코나 쨩!"
10024050-104 = "네, 네? 뭐가요? 다들 어디 가시는 거죠? 저기요?"
10024050-110 = "산해경 거리"
10024050-112 = "좋은 대처였어. 레이죠. 아이 앞에서 할 이야기는 아니었지."
10024050-113 = "……아니면 아이들 앞에서 보일 얼굴이 아니었다, 겠지요. 미나 집행부장."
10024050-114 = "아무것도 모르는 아이들의 호의를 이용하다니……"
10024050-120 = "세상에는 어떻게 해도 용서받을 수 없는 일이 있는 법이다!"
10024050-121 = "당장 그 녀석들을 찾아내 박살내 버리겠어! 현룡문의 모든 힘을 써서라도!"
10024050-126 = "[ns] \"진정해.\""
10024050-127 = "선생님은 이런 일을 그냥 넘어갈 수 있다는 건가?"
10024050-129 = "그렇다기보다는 가능성의 문제겠지."
10024050-130 = "정말로 네게 현룡문의 모든 힘을 사용할 권한이 있다면야 모르겠지만."
10024050-131 = "내가 알기로, 그 키사키도 그렇게까지는 할 수 없는 것으로 아는데."
10024050-132 = "……문주님에 대해, 당신이 뭘 알고 있다는 거지?"
10024050-133 = "뭐, 서로 알 만큼은 아는 사이라고만 해 두지."
10024050-134 = "뭐라고……?"
10024050-135 = "[s] \"내가 하고 싶은 말은, 꼬리부터 쫓다가는 머리를 놓치기 십상이라는 거야.\""
10024050-137 = "지당하신 말씀이십니다. 선생님."
10024050-138 = "하위 조직에게 꼬리 자르기를 해 버리고, 모든 책임을 떠넘기는 것도 흔히 일어나는 일이죠."
10024050-139 = "현무상회의 조직을 관리할 때도…… 이따금 일어났던 일입니다."
10024050-140 = "하부 조직에 자율성을 부여하니까 그런 일이 일어나는 거다."
10024050-141 = "조직 관리에는 엄정함이 필요하다고. 예외 없이, 규칙에 따라서."
10024050-142 = "그 방식은 필연적으로 비효율을 불러오게 됩니다."
10024050-143 = "시시각각 변하는 상황에 유연하게 대처하기도 힘들어지고요."
10024050-144 = "그래서 매화원 아이들에게까지 피해를 끼치게 된 건가?"
10024050-145 = "아직도 현무상회를 의심하고 있다니, 정말이지 머리가 딱딱하시군요."
10024050-146 = "말씀드렸지만, 밝혀진 것은 아직 아무것도 없습니다."
10024050-147 = "그래. 그렇지. 그러니까 그걸 지금부터 밝혀 보자는 거야."
10024050-148 = "매화원에게까지 영향이 가게 된 것에는 우리도 충분히 화가 나."
10024050-150 = "이게 다 현무상회와 관련된 일이라면, 그때는 어떻게 할 거지?"
10024050-151 = "내 이름을 걸고 책임을 지지. 상회를 폐쇄시키든 해체시키든, 마음대로 해."
10024050-152 = "회장님!"
10024050-154 = "걱정 마. 만에 하나 그렇게 된다 하더라도, 다시 처음부터 시작하면 돼."
10024050-155 = "그리고 그 정도 각오도 없이, 현룡문을 납득시킬 수 있을 것 같지도 않고."
10024050-156 = "그래서, 선생님. 뭔가 좋은 생각이라도 있어?"
10024050-162 = "[ns] \"덫을 놓자.\""
10024050-163 = "덫?"
