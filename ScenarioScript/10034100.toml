[translation]
10034100-1 = "후일담 2;배신자들"
10034100-2 = "[ns1] \"그러고 보니, 운영위원회 급습할 때…….\"\n[ns2] \"처음엔 정의실현부가 없었던 거지?\""
10034100-5 = "……뭐, 뭐야. 갑자기 왜 그런 걸 물어보고 그래."
10034100-6 = "처음에는 없었어. 운영위원회에서 뽑은 당직 학생들과 자경단 정도가 고작이었지."
10034100-7 = "뭐, 정의실현부는 정의실현부 대로 신청해서 하려던 행사가 있었다고 들었고……."
10034100-8 = "뭣보다 애초에 예상하지 못 했던 거지. '천하의 티파티가 주관하는 행사에 야습을 하는 미친 아이들'이 있을 거라고는."
10034100-9 = "……참 남 일처럼 말하시네요? 미친 아이 A 씨……?"
10034100-10 = "아직도 기억한다고. 카스팔루그님께서 가르쳐준……."
10034100-11 = "하지 마라 진짜. 몇 번이고 말하게 하지 말라 했다."
10034100-15 = "……쿄야마 카즈사께서 가르쳐준 '싸움 초짜가 싸움에서 이기는 법'이라든가."
10034100-17 = "정면으로 붙으면 승산이 없으니, 최대한 방심을 유도해 혼란스럽게 만들라……였던가."
10034100-18 = "굉장히 효과적이었지."
10034100-19 = "……뭐, 그렇다고 대뜸 치마를 벗고 달려서 기겁하게 만들 거라곤 상상도 못 했지만."
10034100-20 = "안에 스패츠를 입었으니까. 치밀한 계산의 전술이었던 거지."
10034100-21 = "……오해 생길까 봐 하는 말이지만 난 절대 그런 방식을 말한 게 아니다."
10034100-22 = "하지만 이겼잖아? 덕분에 파죽지세로 중심부까지 밀고 들어가지 않았던가?"
10034100-23 = "그러니까 싸움은 거의 내가 다 했는데, 왜 네가 잘난 척을 하는 거냐고……."
10034100-24 = "정의실현부가 투입된 뒤로는 일방적으로 얻어맞으며 빠져나오는 구도였지만 말이지."
10034100-25 = "그건 덤비려는 것 자체가 무리수래도, 거기는. 덤볐으면 그 정도로 안 끝났을 거라고."
10034100-26 = "아무튼 뭐, 결과적으로는 잘 됐으니 다행이고."
10034100-27 = "나도 뭐, 굳이 좋게 말하자면 간만에 몸을……."
10034100-29 = "이야기는 다 들었습니다!! 쿄야마 카즈사!!!"
10034100-30 = "제가 없는 사이에 또 엄청난 일을 벌였더군요!!"
10034100-34 = "……아."
10034100-35 = "크윽……. 하필 저놈 귀에 들어간 건가……. 이건 피곤한데……."
10034100-37 = "[ns] \"………….\""
10034100-41 = "[ns3] \"그럼 난 이만 가볼게.\"\n[ns4] \"모두 좋은 하루~.\""
10034100-44 = "……!? 뭐야, 선생님!?"
10034100-45 = "간다고!? 지금!? 하필 이 타이밍에……!?"
10034100-50 = "……아! 그러고 보니 나도 해야 할 일이 생각났네?"
10034100-54 = "과연. 그렇군. 그럼 나도 기대를 저버릴 수 없으니……."
10034100-62 = "아하하하……."
10034100-64 = "다 가는 분위기!? 진짜로!? 이대로 나만 놔두고!? 지, 진심이야!? 아니지!? 장난이지!?"
10034100-65 = "이건 너무하잖아!! 다 같이 털러 가 놓고 나만 이러는 게 말이 되냐고!? 어!?!"
10034100-66 = "모두……!"
10034100-72 = "이 배신자들아아아아-!!!"
