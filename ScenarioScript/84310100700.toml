[translation]
84310100700-6 = "……???? 뭐야, 무슨 일이야?"
84310100700-7 = "그 표정…… 생사의 기로를 다녀온 표정인데."
84310100700-11 = "설마……! 상황이라도 발생했던 거야?"
84310100700-12 = "일이 있으면 말하라고 했잖아! 그래서, 대체 무슨 일인데!?"
84310100700-14 = "아, 아뇨. 진정들 하세요. 그런 게 아닙니다."
84310100700-15 = "아니, 그런 게 아닌 건 아니지만 생각하시는 그런 일들은 아닙니다. 그저……"
84310100700-18 = "(네루와 리오에게, 엑스포 회장에서 있었던 일들을 설명해 주었다.)"
84310100700-21 = "어…… 음…… 그래……"
84310100700-22 = "여전하다는 건 알고 있지만……"
84310100700-23 = "정말이지 대단하군. 오토하나 스미레."
84310100700-24 = "아니, 오히려 나는 이 녀석이 그 녀석한테서 도망쳐 나왔다는 사실이 더 대단한데. 역시 굉장한 재능이랄까."
84310100700-26 = "표정들이 어두우시군요. 잡혔더라면 저도 그 두려운 트레이닝을 함께했을까요? 그랬다면 많이 힘들었을까요?"
84310100700-27 = "많이 힘들어? 아니. 그렇다기보다는……"
84310100700-29 = "(네루는 감이 좋다며 스미레에게 붙잡히지 않아서 천만다행이라고 일러준다.)"
84310100700-32 = "오토하나 스미레의 트레이닝 스케쥴에 참여한 학생의 무사 완주율은 2% 이하야. 제 다리로 집에 돌아간 비율은 1% 이하지."
84310100700-33 = "……? 그럼 나머지 98%는요?"
84310100700-34 = "……그건……"
84310100700-36 = "(이어지는 두 사람의 설명을 듣던 세이아는, 트레이닝을 하지 않았음에도 전신으로 식은땀을 흘렸다.)"
