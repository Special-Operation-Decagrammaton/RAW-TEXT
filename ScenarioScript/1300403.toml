[translation]
1300403-1 = "청소할 시간이에요"
1300403-2 = "대책위원회 동아리실"
1300403-11 = "(열심히 동아리실을 청소하고 있는 노노미를 발견했다.)"
1300403-12 = "어라? 선생님?"
1300403-13 = "와아! 정말로 와주셨군요!"
1300403-14 = "응…… 그치만 너무 일찍 오셨달까…… 지금 막 청소를 시작했거든요."
1300403-15 = "깨끗해진 동아리실을 보시려면 3시간 뒤에 찾아오셔야 할 거 같은데……. 어쩌죠?"
1300403-16 = "[s] \"대청소인데 어째서 혼자 있는 거야?\""
1300403-17 = "으응? 어쩔 수 없는게 다들 주말에는 아르바이트다, 도서관이다, 바쁘거든요."
1300403-18 = "학원의 빚을 갚아나갈 시간도 부족한데 개인 공부까지 하려면 다들 몸이 두개라도 모자랄 지경이라……."
1300403-19 = "그래서, 대청소는 제가 계속 해 오고 있어요."
1300403-20 = "응응! 당연히 해야 할 일이니까, 괜찮아요. 모두가 함께 하는 공간인걸요!"
1300403-21 = "위생이 깨끗해야 모두 건강하게 학교에 다닐 수 있을테니까!"
1300403-22 = "그럼 선생님, 3시간 뒤에 다시 오시겠어요? 그땐 청소가 끝나 있을 거 같은데."
1300403-23 = "[s1] \"내가 도와줄게.\"\n[s2] \"같이 청소하자.\""
1300403-24 = "어라…… 그치만…… 어른에게 청소를 부탁드려도 되는 걸까요?"
1300403-25 = "어라…… 그치만…… 어른에게 청소를 부탁드려도 되는 걸까요?"
1300403-27 = "……응응! 선생님이니까."
1300403-29 = "고마워요! 여기 먼지 털이예요!"
1300403-31 = "(노노미와 함께 열심히 청소를 했다.)"
1300403-33 = "와! 정말 깨끗해졌어요!"
1300403-34 = "응응! 둘이서 하니까 훨씬 더 일찍 끝났어요."
1300403-35 = "평소의 청소 때와는 다른 뭔가 더 뿌듯한 느낌……"
1300403-36 = "선생님이랑 같이 있어서 그런 걸까요?"
1300403-38 = "(깨끗해진 동아리실에서 노노미와 잡담을 나누다가, 날이 어두워질 쯤에 돌아왔다.)"
