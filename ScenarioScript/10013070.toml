[translation]
10013070-1 = "제7화;마지막 싸움을 앞두고"
10013070-2 = "(다음으로 향하기 전, 잠시 시간이 났을 무렵.)"
10013070-6 = "[s1] \"그나저나 시즈코, 이번엔 냥텐마루와는 계약하지 않았네.\"\n[s2] \"검은거북파의 병력이라면, 일이 좀 더 쉬워졌을지도 모르잖아.\""
10013070-9 = "네? 쉬워진다는 건, <리조트 사냥>의 일 말인가요-?"
10013070-10 = "……확실히, 물론 그건 그럴지도 몰라요."
10013070-11 = "하지만 계약은 할 수 없어요!"
10013070-12 = "[s] \"왜?\""
10013070-13 = "그야…… 당연하잖아요? 냥텐마루가 저지른 짓은 단순한 민폐에, 사기, 악덕 행위였으니까"
10013070-14 = "장사를 어그러트리고, 모두가 즐거워할 한때를 엉망으로 만드는 그 행위는! 절대로 용납 못 한다구요!"
10013070-15 = "그런 녀석이랑 계약을 하느니 차라리-! 포기하는 편이 나을 정도라고나 할까!"
10013070-19 = "흐, 흠흠! 네! 그런 거예요!"
10013070-20 = "[s] \"응, 역시 시즈코다워.\""
10013070-21 = "윽?! 또, 또 그런 말을……!"
10013070-22 = "하, 하여간!"
10013070-23 = "하아……. 어쨌거나 이제 <리조트 사냥>의 진행도 막바지-라고 생각해요."
10013070-24 = "그러니 마지막에 맞춰 아비도스 학생들과 작전 회의를 하겠어요!"
10013070-26 = "과연~ 카이저PMC의 이름이 나왔단 말이지~"
10013070-27 = "역시 우리의 조사가 틀린 건 아니었네"
10013070-28 = "[s] \"응? 무슨 소리야?\""
10013070-29 = "그게…… 저희가 움직이면서 알게 된 정보인데 아무래도 마지막으로 남은 거대 세력……"
10013070-31 = "헬멧단은 카이저PMC와 그 연이 닿아 있는 것 같아요."
10013070-32 = "[s] \"처음 아비도스를 습격했던, 라브네 헬멧단이…….\""
10013070-33 = "냥텐마루도, 헬멧단도 전부 카이저PMC의 지원을 받고 있다는 건……."
10013070-34 = "즉 우리에게 <리조트 사용권>을 팔아 치운 문어 은행이, 뒤에서는 아예 <리조트 사냥>을 부추기고 있단 말이렷다?!"
10013070-35 = "진짜 뭐야?! 그 녀석들!"
10013070-37 = "으헤~ 정말 그림에 그린 듯한 악당이네~"
10013070-38 = "덕분에 우리가 해야 할 일은 확실해졌어."
10013070-39 = "네! 다음은 저희도 헬멧단이 있는 곳으로 향하려고 해요!"
10013070-40 = "[s] \"이번엔 아비도스와 백귀야행의 합동 작전이 되겠네.\""
10013070-41 = "마침 우리 쪽에서도 나름 헬멧단을 공략하기 위한 작전을 세웠거든~"
10013070-42 = "[s] \"작전?\""
10013070-43 = "저기, 호시노 선배! 정말! 괜찮을까요! 그, 자, 작전 말인데요!"
10013070-44 = "나는 좋다고 생각해. 호시노 선배의 작전이니까."
10013070-46 = "재미있을 것 같은 작전이었죠~"
10013070-47 = "뭐야? 대체 무슨 작전이길래……."
10013070-48 = "후후~ 비밀이야~ 그 왜, 속일 거라면 아군부터 속여라- 라는 말도 있잖아~?"
10013070-49 = "[s] \"뭐, 호시노가 그렇게 판단했다면 이견 없지만.\""
10013070-50 = "오오~ 믿어주는 건가~ 이 아저씨, 조금 기쁠지도~?"
10013070-51 = "전 역시 조금 걱정이 된다고 할까……."
10013070-52 = "……아니아니, 다시 생각해봐도 뭔가 이상하다니까! 그 작전, 다시 고민해보는 게……!"
10013070-53 = "그럼~ 서로 마지막까지 힘내 보자고~"
10013070-57 = "[ns] \"으음, 저쪽도 나름 큰 준비를 하나 봐.\""
10013070-58 = "네…… 이제 남은 건 정말로 얼마 남지 않았으니,"
10013070-59 = "후딱 해결해버리자구요!"
