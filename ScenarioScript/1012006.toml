[translation]
1012006-1 = "새벽의 북소리"
1012006-2 = "(밤을 새우며 새벽까지 밀린 업무를 처리하던 중……)"
1012006-3 = "(이대로 가다간 그대로 잠에 들 것 같아 바람을 쐬러 강변으로 나갔다.)"
1012006-11 = "(그렇게 강가를 서성이며 잠을 깨우던 중…….)"
1012006-12 = "음? 선생님?"
1012006-16 = "이 시간에 강변에는 어쩐 일이야?"
1012006-17 = "뭐? 밤을 새우면서 서류 작업 중이었다고?"
1012006-18 = "……역시 어른이 된다는 건 쉬운 일이 아니구나."
1012006-19 = "[s] \"그런데 나츠는 어쩐 일이야?\""
1012006-20 = "나는 조깅 중이었지."
1012006-21 = "밴드 연습을 시작하고 나서부터 매일 새벽에 강변을 뛰고 있어."
1012006-22 = "드럼 연주는 보기보다 체력 소모가 꽤 큰 작업이거든."
1012006-23 = "그래서 체력을 기르기 위해 이렇게 운동을 하는 거야."
1012006-24 = "요컨대…… 무대에서 힘을 내기 위해서 무대 밖에선 힘을 빼고 있는 것이지."
1012006-25 = "[s] \"나츠는 노력가구나.\""
1012006-26 = "……후후."
1012006-27 = "칭찬 고마워, 선생님."
1012006-28 = "[s1] \"그럼 노력하는 학생에게는…….\"\n[s2] \"상을 줘야지.\""
1012006-36 = "(근처 자판기로 가서, 블랙커피 두 캔을 뽑아 하나를 나츠에게 내밀었다.)"
1012006-38 = "오오, 감사, 선생님."
1012006-39 = "제로칼로리의 커피라, 운동 후의 디저트로는 최고네."
1012006-40 = "(나츠와 함께 벤치에 앉았다.)"
1012006-44 = "연습하면서 느낀 건데, 드럼은 안티노미라는 말이 딱 맞는 악기인 것 같아."
1012006-45 = "드럼은 무대의 가장 뒤에 있어서, 제일 눈에 띄지 않아."
1012006-46 = "그렇지만 연주를 가장 앞서서 끌고 나가는 건 드럼의 소리지."
1012006-47 = "모든 악기들이 드럼의 박자를 따라오니까."
1012006-48 = "그래서 다른 멤버들이 흥에 겨워 템포를 높여도, 드럼만은 그래서는 안 돼."
1012006-49 = "냉정히 자신의 박자를 지켜야 하지."
1012006-50 = "가장 큰 소리를 내는 악기지만, 최대한 침착하게 가라앉은 마음으로 연주해야 하는 거야."
1012006-51 = "물론 그렇다고 드럼이 다른 악기들보다 우월하다거나, 그렇다는 이야기는 절대 아니야."
1012006-52 = "그저 각자의 역할이 다를 뿐이지."
1012006-53 = "뭐 그래서, 꽤 보람이 느껴지는 악기라는 거야."
1012006-54 = "그래서……"
1012006-61 = "(그렇게 나츠의 말을 듣는 사이……)"
1012006-62 = "(커피로도 막지 못한 졸음이 쏟아져왔다.)"
1012006-72 = "(점점 눈꺼풀이 무거워지고, 의식은 멀어져갔다…….)"
1012006-76 = "서, 선생님……?"
1012006-77 = "어깨, 에……."
1012006-78 = "…………."
1012006-79 = "………………!"
1012006-80 = "쿵, 쿵, 쿵, 쿵."
1012006-81 = "그……"
1012006-82 = "선생님……?"
1012006-83 = "우으……."
1012006-84 = "……."
1012006-85 = "안 되는데……."
1012006-86 = "박자가 이렇게 빠르면… 안 되는데……."
1012006-93 = "(몇 분 뒤 눈을 뜨자, 나츠가 샬레까지 바래다 주었다.)"
1012006-94 = "(……그 직후 나츠는 말도 없이 엄청난 속도로 새벽 어스름 속으로 사라졌다.)"
