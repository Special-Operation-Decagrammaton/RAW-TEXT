[translation]
80000016-1 = "위장 속의 도청장치"
80000016-2 = "샬레 업무관"
80000016-3 = "기다리고 있었습니다, 선생님."
80000016-4 = "오늘은 발렌타인 데이. 사랑에 빠진 소녀들이 상대에게 초콜릿을 건네며 그동안 숨겨왔던 본심을 전달하는 날……."
80000016-5 = "오늘을 맞아 저도 선생님께 드리고 싶은 선물이 있습니다."
80000016-11 = "……선생님을 위해 특별히 준비한 초콜릿입니다."
80000016-12 = "받아…… 주시겠습니까?"
80000016-13 = "(초콜릿 위에 도청장치가 설치되어 있다.)"
80000016-14 = "[s] \"선물은 기쁘지만…… 이건……?\""
80000016-15 = "어, 그건 그러니까……."
80000016-16 = "초콜릿 위에 올려져 있는 금속 장치는 단순한 토핑입니다."
80000016-17 = "저, 절대로 주변의 소리를 녹음하는 도청장치가 아닙니다."
80000016-18 = "[s] \"어째서 자꾸 음식에 도청장치를 설치하는 거야?\""
80000016-19 = "그, 그건 선생님이 자꾸 도청장치가 설치된 선물을 받지 않으시니까……."
80000016-20 = "아니. 선생님께서 음식 외의 선물은 받지 않으려 하시는 것 같아서……."
80000016-21 = "[s1] \"그래도 음식에 기계 장치를 넣는 건 위험하잖아.\"\n[s2] \"실수로 도청장치를 삼키면 어떻게 해?\""
80000016-22 = "그렇군요. 만약 선생님이 도청장치를 삼키게 된다면 선생님의 말소리는커녕, 위장에서 나는 소리밖에 들을 수가 없으니……."
80000016-23 = "그렇군요. 만약 선생님이 도청장치를 삼키게 된다면 선생님의 말소리는커녕, 위장에서 나는 소리밖에 들을 수가 없으니……."
80000016-24 = "선생님의 위장 소리……?"
80000016-25 = "그건 또 나름 괜찮을지도……."
80000016-29 = "선생님, 잠시 입을 벌려주시겠습니까?"
80000016-30 = "[s] \"무, 무얼 하려는 거야?\""
80000016-31 = "별것 아닙니다. 선생님에게 도청장치를 먹이려는 것뿐입니다."
80000016-32 = "건강 문제라면 걱정하지 않으셔도 좋습니다."
80000016-33 = "음식에 넣기 위해 제가 특수 제작한 이 도청장치는 녹이 스는 일은 물론이고 몸에 해로운 성분도 배어 나오지 않으니까요."
80000016-34 = "게다가 크기도 작으니 물과 함께 삼키면 금세 뱃속으로 들어갈 겁니다."
80000016-35 = "그러니 이제 순순히…… 입을 벌려주세요!"
80000016-36 = "[s] \"싫어, 안 돼, 이러지 마!\""
80000016-38 = "(이후, 도청장치를 삼키지 않기 위해 코타마와 한동안 실랑이를 했다.)"
