[translation]
2003015-1 = "기분 전환 같은 것이라고 해 두죠."
2003015-3 = "아, 선생님. 여기랍니다."
2003015-4 = "[s] \"피곤하지 않아?\""
2003015-5 = "……."
2003015-6 = "평소였다면 그렇게 느낄 수도 있었겠지만."
2003015-7 = "신기하네요. 지금 선생님의 얼굴을 봤더니 그런 느낌들이 싹 사라졌어요."
2003015-8 = "[s] \"내 얼굴을 봐도 재미있는 건 없을 텐데…….\""
2003015-9 = "후훗. 그건 또 어떨까요?"
2003015-10 = "그런데, 선생님?"
2003015-11 = "저 오늘, 뭐 달라진 거 없나요?"
2003015-13 = "(하루나가 그렇게 말한 순간……!)"
2003015-14 = "(싸늘한 소름이, 등줄기를 빠르게 훑고 내려갔다!)"
2003015-15 = "(이것은 그야말로 드라마나 영화에서 많이 나오는, 그런 상황!)"
2003015-17 = "[ns] \"그, 글쎄? 역시 옷일까?\""
2003015-18 = "후훗. 너무나 당연한 부분입니다만."
2003015-19 = "그렇게 지나치게 뻔한 것 말고요?"
2003015-20 = "(하루나는 웃고 있었지만, 어딘가에서 '하나'라고 숫자를 세는 소리가 들린 듯했다!)"
2003015-22 = "[ns] \"그, 그그그그, 그러면 머리 모양?!\""
2003015-23 = "확실히 단골 미용실에서 손질을 부탁드렸습니다만."
2003015-24 = "그것 역시 너무나 확연히 드러나는 부분이 아닐까요?"
2003015-25 = "같은 이유로, 선글라스 역시 마찬가지랍니다?"
2003015-26 = "(하루나는 웃고 있었지만, 어딘가에서 '둘'이라고 숫자를 세는 소리가 들린 듯했다!)"
2003015-27 = "후후후……."
2003015-28 = "물론 이건 제 멋대로인, 약간 심술궂기까지 한 장난이라는 사실은 저 역시 잘 알고 있습니다."
2003015-29 = "그래도, 혹시나 해서 말이죠? 선생님이라면, 어떨까 해서요?"
2003015-30 = "맞추지 못하셔도 상관은 없지만, 만에 하나라는 부분이 있을지도 모르니까요?"
2003015-31 = "자, 선생님. 다시 한번 여쭙겠습니다."
2003015-32 = "저 오늘, 뭐 달라진 거 없나요?"
2003015-33 = "(이것으로 남은 기회는…… 아마도 마지막……!)"
2003015-35 = "[ns] \"그거다! 날개 장식!!!\""
2003015-37 = "?!?!"
2003015-38 = "[ns] (어……?)"
2003015-39 = "여, 역시……. 선생님……."
2003015-40 = "제가, 마음속으로…… 고른 분……"
2003015-41 = "마치, 극상의 미식과도 같이……"
2003015-43 = "(어딘가 분위기가 심상치 않아, 하루나에게 괜찮냐고 말을 걸었다.)"
2003015-44 = "(하루나는 부자연스러울 정도로 당황해하며, 약간 어색하게까지 보이는 미소를 지었다…….)"
2003015-46 = "흠, 흠……."
2003015-47 = "사실 저는, 그때그때 다른 날개 장식을 착용한답니다."
2003015-48 = "평상복일 때는 주로 리본이 달린 펜듈럼이죠."
2003015-49 = "격식을 갖춰야 할 때는 둥그스름한 형태의 하트 모양이고요."
2003015-50 = "꼭 정해진 것은 아닙니다. 그 밖에도 기분이나 환경에 따라 바꿔 달곤 하죠."
2003015-51 = "[s] \"그렇, 구나?\""
2003015-52 = "네. 그런 식이에요."
2003015-53 = "그리고 오늘은…… 특별히 귀하게 여기는 나비 모양 장식을, 달아 보았어요."
2003015-58 = "다시 한번, 알아봐 주셔서 감사합니다. 선생님."
2003015-59 = "[ns] \"그, 그래…….\""
2003015-60 = "사실 잘 보시면, 이 나비 장식은 반반으로 되어 있죠."
2003015-61 = "노란 나비와 유리날개 나비, 두 종류랍니다."
2003015-62 = "혹시 그 각각이 뜻하는 의미를 알고 계신가요?"
2003015-63 = "[s] \"모르겠는데…….\""
2003015-64 = "후후. 맛을 미리 알고 먹으면 미식의 기쁨이 줄어드는 법이죠. 그것은 또한 후일의 즐거움으로 놓아두도록 할까요."
2003015-65 = "하지만 선생님? 절반과 절반이라는 것에는, 그 자체로 또 다른 의미가 있는 법이랍니다."
2003015-66 = "바로, 한 쌍의 나비를 뜻하죠."
2003015-67 = "그리고 한 쌍의 나비란……."
2003015-71 = "……."
2003015-72 = "죄, 죄송합니다. 이 화제는 여기까지만 하도록 하죠."
2003015-73 = "[s] \"왜 그래, 하루나?\""
2003015-74 = "아, 아무것도 아니랍니다! 네, 그럼요!"
2003015-75 = "[s] \"잘 모르겠지만, 하루나가 그렇다면야…….\""
2003015-79 = "[ns1] \"그런데, 특별히 귀하게 여기는 거였다고 했지?\"\n[ns2] \"운동회장인데, 잘못하면 상할지도 모르는데 괜찮아?\""
2003015-82 = "?!?!?!"
2003015-83 = "그, 그건……."
2003015-84 = "물론, 그런 위험성도 있겠습니다만……."
2003015-85 = "오늘, 반드시 이 자리에 와 주실 분이, 계실 것이라고 생각했으니까요."
2003015-86 = "[s] \"그렇, 구나?\""
2003015-87 = "……물론 그분은, 이런 부분에서는 약간 둔감하신 편이어서. 거기까지는 눈치채 주지 못하실 것 같습니다만……."
2003015-88 = "……."
2003015-89 = "참 신기하지 않나요, 선생님?"
2003015-90 = "가령 귀걸이와도 같이, 작은 장식의 변화에 눈치채 주시는 분이."
2003015-91 = "바로 그다음, 한 발자국 너머에 자리한 무언가에 대해서는……."
2003015-92 = "참……. 일부러라고 생각해도 좋을 만큼, 시선을 주지 않으신다는 것은요."
2003015-93 = "[s] \"하루나? 혹시…… 화났어?\""
2003015-94 = "아, 아아아아, 아뇨! 그럴 리가요! 당치도 않답니다?"
2003015-95 = "단지……."
2003015-96 = "……단지."
2003015-97 = "……."
2003015-98 = "후훗. 아무것도 아니에요."
2003015-99 = "저는 분명, 선생님의 그런 부분마저……."
2003015-100 = "자, 선생님? 그러면 오늘의 미식……."
2003015-101 = "아니군요."
2003015-102 = "오늘의 남은 즐거움을, 위해 저에게 시간을 내어주실 수 있으신가요?"
2003015-103 = "저의 '변화'를 눈치채어 주신, '포상'을 드리고 싶기도 하고요."
2003015-104 = "선생님은 언제나 저희에게 맛있는 것을 많이 사 주시니까, 오늘은 제가 선생님께 '맛있는 것'을 드리고 싶네요."
2003015-105 = "스승의 은혜란, 하늘과 같은 것이라는 말도 있잖아요?"
2003015-106 = "[s3] \"하루나가 그렇게 기특한 마음을 먹다니…….\"\n[s4] \"이 선생님, 감격스러워서 눈물이 다 나는구나…….\""
2003015-109 = "그러면 괜찮으신 거죠?"
2003015-110 = "함께 가시죠. 제가 안내하겠습니다."
2003015-118 = "(하루나는 가까이 다가와 자연스럽게 팔짱을 꼈다.)"
2003015-119 = "(우리는 같이 대회장의 이곳저곳을 빠짐없이 돌아다녔다.)"
