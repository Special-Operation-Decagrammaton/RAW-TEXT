[translation]
1010203-1 = "자외선 차단은 확실히"
1010203-2 = "(히요리가 있는 해변가로 향했다.)"
1010203-4 = "아야야…… 쓰라려…… 아파요……."
1010203-5 = "앗? 선생님? 여, 여긴 어떻게?"
1010203-6 = "아야얏……!"
1010203-7 = "[s1] \"괜찮아, 히요리?\"\n[s2] \"내가 봐 줄게, 이리 와 봐.\""
1010203-10 = "으으…… 이것 보세요, 선생님…… 피부가 빨갛게 변했어요……."
1010203-11 = "바닷물로 씻으려 했는데 소금기가 닿으니 완전 아파서……!"
1010203-12 = "우와아아앙! 결국 이렇게 여름이 끝나버리는 거네요! 기껏 수영복도 입었는데 바다에는 한 발짝도 못 들어가고!"
1010203-13 = "결국 저한테 남은 거라곤 어두침침한 은신처를 전전하는 떠돌이 생활뿐인 거네요……!"
1010203-14 = "[s] \"자, 자, 진정하고, 여기 그늘로 와.\""
1010203-15 = "훌쩍, 네에."
1010203-18 = "……네? 어디선가 고소한 냄새가 난다고요?"
1010203-19 = "아, 선생님, 후각이 좋으시네요."
1010203-20 = "[s] \"이건…… 참기름?\""
1010203-21 = "마, 맞아요. 자외선 차단제를 살 돈이 없어서 근처 가게에서 얻은 참기름을 발랐거든요."
1010203-22 = "잡지에서 본 건데, 해변에서는 몸에 기름을 바르는 것 같더라고요. 헤헤."
1010203-23 = "그치만 양이 적어서 배랑 가슴에만 좀 바르니까 다 떨어져서……."
1010203-24 = "괜찮겠지 싶어서 그냥 누웠는데요……."
1010203-25 = "[s] \"그럼 자외선 차단이 안 되잖아!\""
1010203-26 = "그렇죠? 역시 망했네요…… 살도 완전히 타 버려서, 해변 같은 건 즐기지도 못하게 됐네요……!"
1010203-27 = "어두컴컴한 동굴 속에 들어가서 여름이 끝날 때까지 기다려야겠죠…… 햇빛도 보지 못한 채 박쥐와 함께 살아가야겠죠……!"
1010203-28 = "망했어요! 우아아아앙!"
1010203-30 = "(우는 히요리를 가까스로 진정시키고, 근처에 있던 바다의 집으로 들어왔다.)"
1010203-32 = "훌쩍, 얼음찜질을 하니 조금 낫네요……."
1010203-33 = "빨개졌던 피부가 스르르 원래대로…… 그래도 아직 아프긴 하지만……."
1010203-34 = "헤, 헤헤, 선생님, 앞쪽도 조금 부탁드려도 될까요……."
1010203-35 = "시원해애……."
1010203-36 = "[s] \"다음부터는 꼭 제대로 된 자외선 차단제를 꼼꼼히 발라야 해. 알았지?\""
1010203-37 = "헤, 헤헤, 네에."
1010203-38 = "하지만 선생님한테 얼음찜질을 받을 수 있다니, 조금은 보람이 있었을지도 모르겠네요. 헤헤……."
1010203-44 = "모리모리군 아이스바 하나 주세요!"
1010203-45 = "나는 콘포타주 맛으로!"
1010203-46 = "네, 여기 있습니다!"
1010203-48 = "……."
1010203-49 = "헤, 헤헤, 선생님, 이왕 시원하게 해주시는 거, 아이스바도 사주시면 안 될까요……?"
1010203-50 = "몸 바깥쪽도 안쪽도 시원하면 완전 회복될 것 같은데요오……!"
1010203-51 = "[s] \"그래, 그러자.\""
1010203-52 = "헤헤, 감사합니다……!"
1010203-56 = "마, 맛있어요! 더위가 싹 가시는 맛……!"
1010203-57 = "이거면 이제 완전 회복이에요……!"
1010203-58 = "[s] \"그래도 무리하지는 말고.\""
1010203-59 = "네, 네……!"
1010203-60 = "햇빛으로 살짝만 나가볼래요……!"
1010203-66 = "어, 어……?!"
1010203-72 = "[wa:700]― [log=히요리 수영복]아야야야…… [wa:2890]아파요오……. [/log]"
1010203-75 = "[wa:700]― [log=히요리 수영복]히엑?! [wa:1000]제 아이스바가?![/log]"
1010203-78 = "― [log=히요리 수영복]망했어요! [wa:1550]완전 망했어요![/log]"
1010203-79 = "[wa:2350]― [log=히요리 수영복]한 입밖에 못 먹었는데 [wa:1520]모래투성이가 되다니……![wa:120] [/log]"
1010203-82 = "[wa:1600]― [log=히요리 수영복]역시 [wa:1540]저한테는 아이스바조차 [wa:1660]허락되지 않는 거네요……![/log]"
1010203-83 = "[wa:2420]― [log=히요리 수영복]완전히 버림받았어요……![/log]"
1010203-86 = "― [log=히요리 수영복]제 인생은 [wa:1860]왜 이렇게 [wa:980]고난으로 가득 차 있을까요?[/log]"
1010203-87 = "[wa:2300]― [log=히요리 수영복]다른 사람은 [wa:880]여름을 즐기고 있는데…….[/log]"
1010203-90 = "[wa:570]― [log=히요리 수영복]아무리 노력해도,[/log]"
1010203-91 = "[wa:1990]― [log=히요리 수영복]제게 있어서는 [wa:1520]도달할 수 없는 꿈 같은 거라니…….[/log]"
1010203-94 = "― [log=히요리 수영복]……네? [wa:1410]하나 더 [wa:760]사 주신다고요?[wa:120] [/log]"
1010203-97 = "[wa:1200]― [log=히요리 수영복]그럼 [wa:3220]떨어뜨린 아이스바가 멀쩡했다면[/log]"
1010203-98 = "[wa:1420]― [log=히요리 수영복]두 배로 먹을 수 있었겠네요……?[/log]"
1010203-101 = "― [log=히요리 수영복]우아아앙! [wa:2100]역시 망했어요![/log]"
1010203-104 = "……훌쩍."
1010203-105 = "감사합니다, 선생님. 빙수까지 사 주셔서……."
1010203-106 = "얼떨결에 얻어먹게 되어버렸네요…… 헤헤. 잘 먹겠습니다."
1010203-107 = "[s] \"이제 기운 좀 났어?\""
1010203-108 = "네, 네에."
1010203-109 = "매번 선생님께는 이렇게 받기만 하고…… 감사하지만 어딘가 염치없는 게 아닐까 싶은 느낌이……."
1010203-110 = "왜, 왜 그렇게 보시나요? 저, 저도 자각은 있다구요……!"
1010203-111 = "그러니까 다음번엔, 제가 뭔가 해드릴게요……."
1010203-112 = "재활용품 수거함에서 잡지라도 가져다드릴까요?"
1010203-113 = "어떤 잡지를 좋아하시나요? 여, 역시 야한 쪽이려나요……."
1010203-114 = "[s3] \"아니, 아니, 그런 건 괜찮으니까.\"\n[s4] \"보답을 바라고 한 일은 아니니까, 괜찮아.\""
1010203-117 = "그, 그런가요……."
1010203-118 = "하지만…… 받았던 마음에는 보답하라고 배웠으니까……."
1010203-119 = "기, 기대하셔도 좋아요…… 헤헤."
