[translation]
1008203-1 = "청춘의 정석: 전학생"
1008203-3 = "[ns] \"막상 청춘 활동이라고 해도…… 구체적으로 뭘 하면 되는 거야?\""
1008203-4 = "으음, 스승님의 의문은 지당해."
1008203-5 = "확실히 갑작스럽게 <청춘 활동>을 하자! 라고 해도 정작 어디서부터 시작하면 좋을지. 뭘 어떻게 하면 좋을지."
1008203-6 = "우리 같은 <청춘 초심자>에겐 모든 것이 오리무중에 알송달쏭……. 쉬이 답을 내릴 수 있는 게 아니니까."
1008203-7 = "뭐, 애당초 <청춘 활동>이란 것 자체부터가 명확하게 정의하기 어려운…… 비유하자면 마치 이른 새벽녘에 피어오른 안개와도 같은 것이니 어쩔 수 없는 면도 있지만."
1008203-8 = "[s1] \"청춘 활동에도 초심자가 있구나…….\"\n[s2] \"으음, 그렇게 어렵게 생각할 문제인 거야?\""
1008203-13 = "아니아니, 스승님. 청춘 활동을 우습게 보면 안 된다고?"
1008203-14 = "우리 같이 청춘 활동을 제대로 해본 적 없는, 이름 그대로의 <청춘 초심자>가 준비도 없이 청춘 활동에 달려들었다간……."
1008203-15 = "[s] \"……달려들었다간?\""
1008203-16 = "미처 준비되지 못한 몸과 마음이 갑작스러운 청춘 활동으로 인해……."
1008203-20 = "<급성 청추니움 알레르기 쇼크> 증상으로 탈이 날지도 모른다구."
1008203-24 = "[ns] \"미안, 렌게. 지금 우리 청춘 활동 이야기하는 거 맞지?!\""
1008203-25 = "그만큼 여기에선 주의를 기울이며 차근차근 접근할 필요가 있겠다는 이야기야."
1008203-26 = "역시 이런 점은 운동과 크게 다르지 않아. 걷기 전부터 뛰려고 하면 금방 부상을 입는 법이잖아?"
1008203-27 = "……뭐, 앞서 여러 이야기를 하긴 했지만, 그래도 걱정 마."
1008203-28 = "딱 오늘 같은 날이 올 때를 대비해서, 평소 <청춘 활동>을 하려면 무엇을 주안점으로 삼으면 좋을지. 다 계획을 세워 둔 참이니까."
1008203-29 = "[s] \"렌게는 평소에도 그런 계획을 세워 두고 있었구나…….\""
1008203-33 = "그, 그야!"
1008203-34 = "평생의 꿈이었으니까 어쩔 수 없잖아!"
1008203-35 = "하여간! 청춘에 대해 여러모로 조사해 온 결과, 나는 한 가지 깨달았어."
1008203-36 = "청춘이란 기본적으로 <관계성>으로부터 시작되고 성립되는 개념이야."
1008203-37 = "[s] \"으음, 구체적으로 예를 들면……?\""
1008203-41 = "예를 들어…… 세간에서 말하는 <라이벌>이라는 관계."
1008203-42 = "서로가 절차탁마하며 싸우고, 화해하고, 또 어깨를 나란히 하며 앞으로 나아가는 그 관계처럼……."
1008203-43 = "그 사이에서 태어나는 갈등과 우정이라는 시퀀스들은 그야말로……."
1008203-44 = "이게 바로 청춘이지! 하는 느낌이지 않아?!"
1008203-45 = "[s] \"그렇게 말하니 조금은 알 것 같기도…… 아닌 것 같기도…….\""
1008203-46 = "물론 관계성은 라이벌만 있는 게 아니야!"
1008203-47 = "세상에는 그 밖에도 다양한 관계성이 있고, 관계성의 수만큼이나 정말로 많은 청춘 이야기가 있기 마련이니까."
1008203-48 = "그런고로 기념비적인 이번 제1회 <청춘 활동>에서 내가 가장 먼저 준비해 온 관계성은 바로……."
1008203-52 = "<전학생>이야!"
1008203-53 = "[ns] \"전학…… 뭐?\""
1008203-55 = "자, 지금부터 전학생이 되는 거야! 선생……"
1008203-56 = "아니 스승님!"
1008203-62 = "('전학생과 관련된 청춘 활동이라면 역시 이것부터지!' 라고 외친 렌게를 따라…….)"
1008203-63 = "(우리는 백화요란 부실에서 그리 멀지 않은 골목거리로 나왔다.)"
1008203-67 = "[ns] \"렌게, 이곳이 전학생이랑 무슨 연관이…….\""
1008203-68 = "스승님, 저번에도 내가 말했었지?"
1008203-69 = "청춘 활동이란…… 요컨대 <사랑은 잉어> 작가님의 작품에 나올 법한 내용들이지 않느냐고."
1008203-70 = "참고로 스승님도 이미 잘 알고 있다시피 사랑은 잉어 작가님의 첫 작품도 갑작스럽게 찾아온 전학생 주인공과 히로인이 우당탕탕 소동극을 벌이는 멋진 청춘 소설이었잖아?"
1008203-71 = "[s3] \"아, 으응. 그랬지.\"\n[s4] \"……그랬나?\""
1008203-74 = "외지에서 찾아온 예상치 못한 방문자…… 전혀 생각지 못한 조우…… 예측할 수 없는 매일이 반복되는 가슴 두근두근한 파격적인 전개!"
1008203-75 = "오늘의 청춘 활동은 바로 그 도입부부터 시작해 보는 거야."
1008203-76 = "이른바 <전학생과 관련된 에피소드를 체험하자!> 라는 거지."
1008203-77 = "[s] \"……즉 그 작품에 나온 내용을 따라 해 본다. 이거야?\""
1008203-78 = "으히힛! 정답이야!"
1008203-79 = "척하면 척! 나의 마음을 한순간에 간파하고 이해해 주는 모습! 역시 스승님이네!"
1008203-80 = "잊지 않고 여기 준비도 해왔다고."
1008203-84 = "[ns] \"이건……… 식빵……? 설마, 렌게…….\""
1008203-85 = "자아, 그럼 나는 스타팅 포인트로 이동할 테니까. 신호하면! 알지?"
1008203-89 = "[ns] \"자, 잠깐! 렌게……?!\""
1008203-94 = "좋았어……. 이 정도면 되겠지."
1008203-98 = "식빵 준비 완료, 땅의 단단한 정도도…… 응. 달리기 딱 좋아."
1008203-102 = "햇볕은 알맞게 따사롭고, 온도와 습도도 불쾌하지 않을 정도로 쾌적한 상황. 거기다 바람은 순풍……"
1008203-105 = "응. 바람이 속삭이고 있어……. 지금이 바로 <청춘 활동>을 시작할 때라고!"
1008203-106 = "전학생 하면 빼놓을 수 없는 그 첫 번째 에피소드……!"
1008203-111 = "<하필 전학 첫날부터 지각할 위기에 빠진 나머지, 식빵을 입에 물고 내달리다 골목 모퉁이에서 그 아이와 꽝!> 이벤트 시작이야!"
1008203-116 = "(신호와 함께 렌게가 달려오기 시작했다.)"
1008203-121 = "자아! 자아! 입엔 식빵을 물고! 전력을 다해! 달린다!"
1008203-122 = "여기에선 회심의 대사까지……!"
1008203-123 = "\"아! 지각이야. 지각!\""
1008203-127 = "후후! 각오해……! 스승님!"
1008203-133 = "[ns] \"렌게가 엄청나게 무서운 기세로……?! 이대로 있다간……!\""
1008203-137 = "하아아압!"
1008203-138 = "(그렇게 충돌하기 직전.)"
1008203-143 = "[ns] \"으헉! 긴급 회피 기동!\""
1008203-150 = "잠깐! 선생님! 클라이맥스에서 피하면 어떡해?!"
1008203-151 = "여기서 전학생과 부딪치는 것으로, 도입부부터 서로에게 도저히 잊을 수 없는 인상을 남기는 게 포인트인데!"
1008203-152 = "[s5] \"거기서 부딪쳐서 서로에게 남게 되는 건 인상 같은 게 아니라…….\"\n[s6] \"그냥 단순한 부상 아닐까?!\""
1008203-157 = "으, 으음……. 그, 그런가?"
1008203-158 = "[s] \"위험하니까 기각! 다음으로 갑시다! 렌게 양!\""
1008203-159 = "뭐……. 선생님이 그렇게까지 말한다면야……."
1008203-160 = "선생님…… 즉 스승님의 말을 따르는 것이 제자로서의 본분이니까!"
1008203-161 = "응, 다음으로 가자!"
1008203-163 = "(그 뒤로도 렌게가 이야기하는 <전학생> 에피소드는 대강 그런 느낌이었다.)"
1008203-165 = "잊을 수 없는 식빵의 퍼스트 컨택트 이후로 중요한 건 역시 그거지……."
1008203-166 = "내가 교실에서 얌전히 기다리고 있을 때……."
1008203-171 = "[ns] \"안녕하세요…… 이번에 새롭게 전학 온…….\""
1008203-175 = "아니……! 넌! 아까 골목에서 부딪……치지는 않았지만, 일단은 얼굴은 봤던……!"
1008203-176 = "저번엔 그렇게 운 좋게 넘어갔지만. 다음번엔 절대로 그냥 보내주지 않겠다!"
1008203-177 = "[s] \"그거 전학생에게 하는 말이라기보단 적에게 하는 경고 아냐?!\""
1008203-179 = "교실 창가 구석 자리에서 우연히 마주친 전학생과의 세컨드 대면……."
1008203-180 = "나아가 그다음은……."
1008203-182 = "뭐?!"
1008203-183 = "전학 첫날이라 교과서를 가져오지 않았다고?"
1008203-184 = "헤…… 헹! 어쩔 수 없구만!"
1008203-185 = "자, 이쪽으로 책상을 붙이라고."
1008203-191 = "오, 오늘 하루만 내 교과서를 보여줄 테니까 말이야!"
1008203-192 = "아, 차, 참고로 그 책상 선을 넘어오면……."
1008203-196 = "전력을 다해 박살 내 줄 테니까 말이야. 어디 간덩이가 부어 있으면 시도해 보라고."
1008203-197 = "[s] \"보통 이런 시추에이션이면 좀 더 부드러운 뉘앙스가 어울리지 않아?!\""
1008203-199 = "어? 그, 그래? 경험해 본 적 없어서 잘 모, 모르겠지만."
1008203-200 = "그래도…… 처음 보는 전학생이 내 영역을 침범하다니. 솔직히 진심을 말하라면 허용하기 힘들지 않을까, 랄까."
1008203-201 = "그렇게 급작스럽게 거리를 좁혀 오는 녀석이 있다면…… 뭔가 좀 짜증이 난다고 할까……."
1008203-202 = "[s] \"렌게스럽다고는 생각하지만?!\""
1008203-208 = "(그렇게 전학생 에피소드가 맞는 건지, 혹은 살짝 아닌 건 아닌지. 다소 의문을 품어가며 여러 시추에이션들을 얼마나 함께했을까.)"
1008203-210 = "(시간은 빠르게도 해 질 녘 무렵이 되었다.)"
1008203-216 = "[ns7] \"……해서 이런 시간이 되었는데. 어때 렌게.\"\n[ns8] \"이 정도면 원하는 느낌으로 청춘 활동을 한 거 같아?\""
1008203-221 = "으으음…… 솔직히 말하자면……."
1008203-222 = "미묘, 하달까."
1008203-226 = "아, 아니. 물론 스승님에게 불만이 있다거나 그런 건 아니야!"
1008203-227 = "다만…… 오늘 했던 활동들…… 내가 계속해서 계획하고 생각하면서 꿈꿔왔던 것들과는 미묘하게 달랐다고 할까……."
1008203-228 = "머릿속으로 생각하기만 했던 걸 실제로 하려니…… 뭔가 다소 아쉽다고 할까……."
1008203-229 = "단적으로 말해서……… 응……."
1008203-230 = "나도 스스로 뭘 하고 싶었던 건지, 조금…… 알 수 없어진 느낌이야."
1008203-231 = "[s] \"그렇구나…….\""
1008203-232 = "상황을 밀어붙이기만 하고 정작 그 디테일은 선생님 말대로 어설프기 짝이 없고……."
1008203-233 = "모처럼 이렇게 스승님까지 협력해 주기로 한 만큼……. 좀 더 제대로…… 확실히 해야 했을 텐데……"
1008203-234 = "미안, 역시 너무 안일하게 생각했나 봐…… 다 내 탓이야."
1008203-235 = "……아, 감상적인 이야기는 이걸로 끝! 시간도 늦었으니까."
1008203-239 = "오늘은 아쉽지만 이대로 돌아가는 걸로……."
1008203-240 = "[s] \"이제 갓 전학 온 전학생이라면 역시 근처가 익숙하진 않을 거 아냐?\""
1008203-244 = "……어?"
1008203-245 = "[s] \"그러니 렌게가 전학생에게 알려주고 싶은 장소들을 소개해 주는 건 어때?\""
1008203-249 = "아…… 그렇구나……."
1008203-250 = "이제 막 전학을 온 터라 모든 것이 낯설기만 한 곳에서……"
1008203-251 = "어디에 무엇이 있는지. 놀 곳은 있는지. 책을 사고 싶으면 어디로 가야 하는지. 신작 영화를 보기 위해 영화관에 가려면 어떤 버스를 타야 하는지……."
1008203-252 = "전학생에게는 모든 것이 익숙지 않은 경험일 테니까……"
1008203-253 = "[s] \"그걸 도와주면 아마 전학생도 기뻐하지 않을까?\""
1008203-254 = "……그렇, 네."
1008203-255 = "응, 선생님 말이 맞아!"
1008203-256 = "역시…… 선생님, 아니 청춘의 스승님이야!"
1008203-260 = "그럼 좋았어! 아직 시간 괜찮아? 괜찮지?"
1008203-261 = "지금부터 내가 평소에 자주 들리고는 하는 배팅센터라든지…… 오락실이라든가……."
1008203-265 = "아! 이 근처에 시즌 한정 메뉴가 엄청나게 맛있는 정식집이 있는데 말이야……!"
1008203-267 = "(그렇게 기운을 되찾은 렌게와 함께, 우리들은 조금은 더 이 거리를 함께 돌아다녔다.)"
