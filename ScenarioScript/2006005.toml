[translation]
2006005-1 = "이부키와 함께 식사를!"
2006005-2 = "해변 상점가"
2006005-3 = "(이부키의 말대로, 못 보던 상점가가 해변에 생겨나 있었다.)"
2006005-4 = "[ns] \"갑자기 웬 상점가가……?\""
2006005-6 = "여름에만 열리는 가게들이라고 들었어."
2006005-7 = "원래는 다른 시장에서 장사하던 가게들인데, 사람들이 바다로 많이 오는 때에만 여기서 음식을 판대!"
2006005-8 = "[s] \"여름맞이 임시 분점 같은 거구나.\""
2006005-12 = "어? 선생님 선생님!"
2006005-13 = "저기서 참돔 야키소바를 팔고 있어!"
2006005-14 = "그리고 저기에는 빅 토핑 옥수수구이도 있고, 솔티드 솔티 빙수도 있고, 바지락 라멘도 있고……."
2006005-15 = "으으음, 뭐를 골라야 하지……?"
2006005-16 = "이부키가 가진 돈이…… 그러니까……."
2006005-17 = "[s] \"이부키.\""
2006005-18 = "응? 왜, 선생님?"
2006005-19 = "[s] 어른의 지갑을 꺼낸다."
2006005-23 = "[ns] \"고민은 구매만 늦출 뿐이야, 이부키.\""
2006005-24 = "……!"
2006005-25 = "서, 선생님이 사주는 거야?!"
2006005-26 = "그렇지만 이부키, 그렇게 선생님한테 받기만 하면……."
2006005-27 = "[s] \"빅 토핑 옥수수구이부터 가볼까, 이부키?\""
2006005-28 = "응!!"
2006005-30 = "(그렇게 이부키와 음식을 사러 출발했다.)"
2006005-32 = "옥수수구이 가게"
2006005-33 = "안녕하세요!"
2006005-34 = "어서 오십시오! 무엇을 드릴까요?"
2006005-35 = "으으으음……."
2006005-36 = "이부키는 '감칠맛 폭발 콰트로 치즈 옥수수구이'로 할래!"
2006005-37 = "하하! 좋은 선택이야! 우리 가게에서 제일 잘 나가는 메뉴거든!"
2006005-38 = "그 메뉴 덕분에 가게도 더 큰 곳으로 이전할 수 있었고, 시장에서 입지도 더 탄탄하게 다질 수 있었지."
2006005-39 = "내가 그 메뉴를 구상한 것은 다름 아닌 5년 전 가을…… 음? 손님 아직 주문 안 하셨나?"
2006005-40 = "[s] \"저…… 저도 같은 것으로 주세요.\""
2006005-41 = "하하, 좋아! 잠시만 기다리게!"
2006005-46 = "자! 받으시게!"
2006005-48 = "와! 감사합니다!"
2006005-52 = "(토핑이 풍성하게 올라간 먹음직스러운 옥수수였다.)"
2006005-53 = "(……어쩐지 이부키 것의 토핑이 두 배쯤 더 많아 보이긴 했지만.)"
2006005-55 = "음? 왜 그러십니까, 손님?"
2006005-56 = "저희는 정가 판매 정량 제공이 원칙입니다만?"
2006005-57 = "[s] \"아닌 것 같은데요……!\""
2006005-59 = "(이후 다른 가게에서도 음식을 샀다.)"
2006005-61 = "자! 웰던 참돔 야키소바 2개 나왔답니다!"
2006005-62 = "와! 감사합니다!!"
2006005-63 = "귀여운 아가씨가 씩씩하기까지 하네. 맛있게 먹어요!"
2006005-65 = "레인보우 아이싱 캔디 애플 두 개 나왔습니다!"
2006005-66 = "잘 먹겠습니다!"
2006005-68 = "(그런데 어쩐지.)"
2006005-69 = "(상인들은 무의식적으로 이부키에게 음식을 더 많이 챙겨 주었다.)"
2006005-71 = "헤헤, 잘 먹겠습니다, 선생님!"
2006005-72 = "[s] \"충분하겠어, 이부키?\""
2006005-73 = "엄청 엄청 충분해, 선생님!"
2006005-74 = "오히려 이부키, 들떠서 너무 많이 사 버린 것 같고……."
2006005-79 = "응?"
2006005-86 = "가, 갈매기가……."
2006005-87 = "선생님 음식을 채갔어……!"
2006005-88 = "[s] \"흐아악……!\""
2006005-89 = "어, 어떡하지, 선생님……."
2006005-93 = "아니, 괜찮아, 선생님!"
2006005-94 = "이부키가 받은 음식 엄청 많으니까, 같이 나눠 먹으면 돼!"
2006005-95 = "[s] \"이부키……!\""
2006005-97 = "(이후, 이부키와 함께 이부키의 음식을 나눠 먹었다.)"
2006005-98 = "(이부키가 덤으로 받은 음식이 워낙 많아서, 둘이서 먹기에도 충분했다.)"
