[translation]
2006005-1 = "和伊吹一起吃飯！"
2006005-2 = "海邊商店街"
2006005-3 = "（正如伊吹所說，海邊多了一條以前沒看過的商店街）"
2006005-4 = "[ns] 「怎麼突然多了個商店街……？」"
2006005-5 = ""
2006005-6 = "伊吹聽說這些是只有夏天才會開的店。"
2006005-7 = "這些原本是在其他市場做生意的店家，#n聽說只有很多人來海邊的時候，才會在這裡賣吃的！"
2006005-8 = "[s] 「就像是夏季限定的臨時分店吧。」"
2006005-9 = ""
2006005-11 = ""
2006005-12 = "啊！老師老師！"
2006005-13 = "那邊在賣真鯛炒麵！"
2006005-14 = "那邊還有大份配料烤玉米、鹹鹹鹽味刨冰、蛤蜊拉麵……"
2006005-15 = "唔嗯，要選哪一個才好呢……？"
2006005-16 = "伊吹身上的錢……那個……"
2006005-17 = "[s] 「伊吹。」"
2006005-18 = "嗯？怎麼了，老師？"
2006005-19 = "[s] 拿出大人的錢包"
2006005-20 = ""
2006005-23 = "[ns] 「猶豫只會讓你晚點買到而已哦，伊吹。」"
2006005-24 = "……！"
2006005-25 = "老，老師要請伊吹嗎！？"
2006005-26 = "可是伊吹一直讓老師請客的話……"
2006005-27 = "[s] 「先從大份配料烤玉米開始吧，伊吹？」"
2006005-28 = "嗯！！"
2006005-30 = "（就這樣和伊吹出發去買吃的了）"
2006005-31 = ""
2006005-32 = "烤玉米店"
2006005-33 = "您好！"
2006005-34 = "歡迎光臨！要點什麼呢？"
2006005-35 = "唔嗯……"
2006005-36 = "伊吹要「鮮味爆發四重起司烤玉米」！"
2006005-37 = "哈哈！好眼光！這可是我們店裡賣得最好的菜色哦！"
2006005-38 = "多虧了這道菜，店面才能搬到更大的地方，在市場的地位也更穩固了。"
2006005-39 = "還記得我想出這道菜的時候，那時正是5年前的秋天……嗯？客人還沒點餐嗎？"
2006005-40 = "[s] 「我……我也要一樣的。」"
2006005-41 = "哈哈，好！稍等一下！"
2006005-42 = ""
2006005-44 = ""
2006005-45 = ""
2006005-46 = "來！拿好囉！"
2006005-48 = "哇！謝謝！"
2006005-52 = "（是一根鋪滿配料、看起來很好吃的玉米）"
2006005-53 = "（……不過總覺得伊吹那根的配料好像多了兩倍左右）"
2006005-54 = ""
2006005-55 = "嗯？怎麼了，客人？"
2006005-56 = "我們的原則是照定價販售、份量一致哦？"
2006005-57 = "[s] 「好像不是這樣吧……！」"
2006005-59 = "（之後也在其他店家買了吃的）"
2006005-60 = ""
2006005-61 = "來！2份全熟真鯛炒麵好囉！"
2006005-62 = "哇！謝謝！！"
2006005-63 = "可愛的小姑娘還這麼有精神呢。慢慢吃哦！"
2006005-64 = ""
2006005-65 = "兩份彩虹糖霜糖蘋果好了！"
2006005-66 = "我要開動了！"
2006005-68 = "（不過不知為何）"
2006005-69 = "（店家們都不自覺地多給了伊吹一些）"
2006005-70 = ""
2006005-71 = "耶嘿嘿，我要開動了，老師！"
2006005-72 = "[s] 「這樣夠嗎，伊吹？」"
2006005-73 = "超級超級夠了，老師！"
2006005-74 = "伊吹好像太興奮，反而買太多了……"
2006005-75 = ""
2006005-79 = "嗯？"
2006005-80 = ""
2006005-84 = ""
2006005-85 = ""
2006005-86 = "海，海鷗……"
2006005-87 = "把老師的食物叼走了……！"
2006005-88 = "[s] 「嗚啊啊……！」"
2006005-89 = "怎，怎麼辦，老師……"
2006005-90 = ""
2006005-92 = ""
2006005-93 = "不對，沒關係的，老師！"
2006005-94 = "伊吹拿到的食物超多，一起分著吃就好了！"
2006005-95 = "[s] 「伊吹……！」"
2006005-97 = "（之後和伊吹一起分著吃了他的食物）"
2006005-98 = "（伊吹額外拿到的食物實在太多，兩個人吃也綽綽有餘）"
