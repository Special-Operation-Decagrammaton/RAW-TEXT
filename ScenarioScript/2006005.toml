[translation]
2006005-1 = "กินข้าวกับอิบูกิ!"
2006005-2 = "ย่านร้านค้าริมชายหาด"
2006005-3 = "(มีย่านร้านค้าที่ไม่เคยเห็นมาก่อนผุดขึ้นริมชายหาดอย่างที่อิบูกิบอก)"
2006005-4 = "[ns] \"จู่ๆ มีย่านร้านค้าขึ้นมาได้ยังไงเนี่ย...?\""
2006005-5 = ""
2006005-6 = "ได้ยินว่าเป็นร้านที่เปิดเฉพาะหน้าร้อนละ"
2006005-7 = "ปกติร้านพวกนี้ตั้งอยู่ที่ตลาดอื่น แต่ช่วงที่คนมาเที่ยวทะเลเยอะๆ ก็จะมาขายอาหารที่นี่น่ะ!"
2006005-8 = "[s] \"เหมือนเปิดสาขาชั่วคราวรับหน้าร้อนสินะ\""
2006005-9 = ""
2006005-11 = ""
2006005-12 = "อ๊ะ? คุณครู คุณครู!"
2006005-13 = "ตรงโน้นขายยากิโซบะปลาไทด้วย!"
2006005-14 = "แล้วตรงโน้นก็มีข้าวโพดย่างท็อปปิ้งจัดเต็ม น้ำแข็งไสซอลเต็ด ซอลตี้ แล้วก็ราเม็งหอยลายด้วย..."
2006005-15 = "อืมมม จะเลือกอะไรดีนะ...?"
2006005-16 = "เงินที่อิบูกิมี... ก็..."
2006005-17 = "[s] \"อิบูกิ\""
2006005-18 = "หืม? มีอะไรเหรอ คุณครู?"
2006005-19 = "[s] หยิบกระเป๋าสตางค์ของผู้ใหญ่ออกมา"
2006005-20 = ""
2006005-23 = "[ns] \"มัวแต่ลังเลก็ยิ่งได้ซื้อช้าลงนะ อิบูกิ\""
2006005-24 = "...!"
2006005-25 = "คะ... คุณครูจะซื้อให้เหรอ?!"
2006005-26 = "แต่อิบูกิจะเอาแต่รับจากคุณครูแบบนั้นก็..."
2006005-27 = "[s] \"เริ่มจากข้าวโพดย่างท็อปปิ้งจัดเต็มก่อนดีมั้ย อิบูกิ?\""
2006005-28 = "อื้ม!!"
2006005-30 = "(แล้วคุณครูก็เริ่มไปซื้ออาหารกับอิบูกิ)"
2006005-31 = ""
2006005-32 = "ร้านข้าวโพดย่าง"
2006005-33 = "สวัสดีค่ะ!"
2006005-34 = "ยินดีต้อนรับ! รับอะไรดี?"
2006005-35 = "อืมมมม..."
2006005-36 = "อิบูกิเอา 'ข้าวโพดย่างชีสสี่ชนิด อูมามิระเบิด'!"
2006005-37 = "ฮ่าฮ่า! เลือกได้ดีเลย! นั่นเมนูขายดีที่สุดของร้านเราเลยนะ!"
2006005-38 = "เมนูนี้ทำให้ร้านเราย้ายไปที่ใหญ่กว่าเดิมได้ แล้วก็มีฐานที่มั่นคงขึ้นในตลาดด้วย"
2006005-39 = "ฉันคิดเมนูนั้นขึ้นมาในฤดูใบไม้ร่วงเมื่อ 5 ปีก่อนนี่เอง... หืม? แล้วคุณลูกค้ายังไม่ได้สั่งเหรอ?"
2006005-40 = "[s] \"อะ... เอาเหมือนกันแล้วกัน\""
2006005-41 = "ฮ่าฮ่า ได้เลย! รอสักครู่นะ!"
2006005-42 = ""
2006005-44 = ""
2006005-45 = ""
2006005-46 = "เอ้า! ข้าวโพดย่างที่สั่งได้แล้ว!"
2006005-48 = "ว้าว! ขอบคุณค่ะ!"
2006005-52 = "(เป็นข้าวโพดหน้าตาน่ากินที่ใส่ท็อปปิ้งมาอย่างจัดเต็ม)"
2006005-53 = "(แต่ไม่รู้ทำไม ของอิบูกิดูเหมือนจะมีท็อปปิ้งเยอะกว่าราวสองเท่า...)"
2006005-54 = ""
2006005-55 = "หืม? มีอะไรเหรอ คุณลูกค้า?"
2006005-56 = "ร้านเรายึดหลักขายตามราคาที่กำหนด และให้ปริมาณตามมาตรฐานนะ?"
2006005-57 = "[s] \"ดูไม่ใช่แบบนั้นเลยนะ...!\""
2006005-59 = "(หลังจากนั้นทั้งสองก็ซื้ออาหารจากร้านอื่นๆ ด้วย)"
2006005-60 = ""
2006005-61 = "เอ้า! ยากิโซบะปลาไทแบบเวลดัน 2 ที่ ได้แล้วจ้ะ!"
2006005-62 = "ว้าว! ขอบคุณค่ะ!!"
2006005-63 = "แม่หนูน่ารักแล้วยังร่าเริงอีกนะ กินให้อร่อยล่ะ!"
2006005-64 = ""
2006005-65 = "แอปเปิลเคลือบน้ำตาลไอซิงสีรุ้งสองลูกได้แล้ว!"
2006005-66 = "จะทานแล้วนะคะ!"
2006005-68 = "(แต่ไม่รู้ทำไม)"
2006005-69 = "(พ่อค้าแม่ค้าต่างก็แถมอาหารให้อิบูกิโดยไม่รู้ตัว)"
2006005-70 = ""
2006005-71 = "ฮิฮิ อิบูกิจะทานแล้วนะ คุณครู!"
2006005-72 = "[s] \"พอมั้ย อิบูกิ?\""
2006005-73 = "เกินจะพออีกนะ คุณครู!"
2006005-74 = "อิบูกิเผลอตื่นเต้นจนซื้อมาเยอะเกินไปด้วยซ้ำ..."
2006005-75 = ""
2006005-79 = "หืม?"
2006005-80 = ""
2006005-84 = ""
2006005-85 = ""
2006005-86 = "นะ... นกนางนวล..."
2006005-87 = "โฉบอาหารของคุณครูไปแล้ว...!"
2006005-88 = "[s] \"เฮือกก...!\""
2006005-89 = "ทะ... ทำยังไงดี คุณครู..."
2006005-90 = ""
2006005-92 = ""
2006005-93 = "ไม่สิ ไม่เป็นไรนะ คุณครู!"
2006005-94 = "อิบูกิได้ของกินมาเยอะมาก แบ่งกินด้วยกันก็ได้!"
2006005-95 = "[s] \"อิบูกิ...!\""
2006005-97 = "(หลังจากนั้นทั้งคู่ก็แบ่งอาหารของอิบูกิกินด้วยกัน)"
2006005-98 = "(อิบูกิได้ของแถมมาเยอะมาก จึงมีพอให้กินกันสองคน)"
