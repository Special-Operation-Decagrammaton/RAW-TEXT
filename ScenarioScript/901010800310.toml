[translation]
901010800310-9 = "FOX 2, 복귀했습니다."
901010800310-13 = "아, 돌아왔구나."
901010800310-14 = "오늘도 수고 많았어."
901010800310-15 = "그나저나 뭘 그렇게 심각한 표정으로 보고 있었던 거야?"
901010800310-16 = "D.U. 일대에서 벌어진 실종 사건의 현황을 정리하고 있었어."
901010800310-17 = "다행히 카네사키 항구 일대에서 사라진 사람들의 행방은 밝혀졌지만……"
901010800310-18 = "여전히 이 도시에는 행방을 찾지 못한 사람들이 잔뜩 남아 있어."
901010800310-19 = "일이 너무 많아서 그러는 거야?"
901010800310-20 = "아니, 그보다는……"
901010800310-25 = "내가 이 모든 사건을 책임질 수 있을지, 여전히 확신이 들지 않아."
901010800310-26 = "언제나 그랬듯, 진실은 모두를 만족시키지 못하겠지."
901010800310-27 = "또다시 선택을 하고, 그 선택에 대한 책임을 져야 하는 순간이 왔을 때……"
901010800310-28 = "나는 무너지지 않고 그 책임을 홀로 감당해 낼 수 있을까?"
901010800310-32 = "홀로 감당할 필요가 뭐가 있겠어?"
901010800310-33 = "하지만 또 타인에게 내 행동의 책임을 지울 수는—"
901010800310-41 = "너의 책임이 아니야. 우리의 책임이지."
901010800310-45 = "……그렇네."
901010800310-46 = "일단은 눈앞에 있는 일부터 차근차근 해결해 나가자."
901010800310-47 = "우리 소대장님은 생각이 많은 게 장점이지만, 단점이기도 하니까."
901010800310-48 = "그래."
901010800310-49 = "일단 눈앞의 문제부터 해결해야지."
