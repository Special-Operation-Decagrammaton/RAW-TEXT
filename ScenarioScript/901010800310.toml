[translation]
901010800310-6 = ""
901010800310-8 = ""
901010800310-9 = "FOX2，已順利歸隊。"
901010800310-10 = ""
901010800310-12 = ""
901010800310-13 = "啊啊，你回來啦。"
901010800310-14 = "今天也辛苦了。"
901010800310-15 = "表情這麼嚴肅……你剛才在看什麼？"
901010800310-16 = "我在整理D.U.一帶發生的失蹤事件的現況。"
901010800310-17 = "幸好已經查明了鐘崎港一帶失蹤者的去向，不過……"
901010800310-18 = "這座城市裡，依然存在許多下落不明的人。"
901010800310-19 = "是因為工作太多了嗎？"
901010800310-20 = "不，與其說是工作太多……"
901010800310-21 = ""
901010800310-23 = ""
901010800310-24 = ""
901010800310-25 = "我依然無法確信，自己是否能對這一切的事件負起責任。"
901010800310-26 = "如同過去那樣，真相恐怕無法讓所有人都滿意。"
901010800310-27 = "當我必須再次做出選擇，並且為此承擔責任的時刻到來……"
901010800310-28 = "我真的能夠堅持下去，獨自承受那份責任嗎？"
901010800310-29 = ""
901010800310-31 = ""
901010800310-32 = "有必要一個人承擔嗎？"
901010800310-33 = "可是我不能把自身行動所帶來的責任推卸給別──"
901010800310-34 = ""
901010800310-39 = ""
901010800310-41 = "那不是你一個人的責任，而是我們大家的責任哦。"
901010800310-42 = ""
901010800310-44 = ""
901010800310-45 = "……說的也是呢。"
901010800310-46 = "現在必須先從眼前的問題逐步解決才行。"
901010800310-47 = "心思細膩雖然是我們小隊長的優點，但同時也是缺點呢。"
901010800310-48 = "是啊。"
901010800310-49 = "總之先專注在當下面臨的問題吧。"
