901010800310-6 = ""
901010800310-8 = ""
901010800310-9 = "FOX 2 กลับมาแล้วค่ะ"
901010800310-10 = ""
901010800310-12 = ""
901010800310-13 = "อ้อ กลับมาแล้วเหรอ?"
901010800310-14 = "วันนี้ก็เหนื่อยเลยนะ"
901010800310-15 = "กำลังดูอะไรอยู่เหรอ ถึงได้ทำหน้าจริงจังขนาดนั้น?"
901010800310-16 = "ฉันกำลังสรุปสถานการณ์คดีคนหายในเขต D.U. อยู่น่ะ"
901010800310-17 = "โชคดีที่เรารู้ชะตากรรมของผู้คนที่หายตัวไปบริเวณท่าเรือคาเนะซากิแล้ว..."
901010800310-18 = "แต่ก็ยังมีชาวเมืองอีกหลายคนที่ยังเราไม่รู้ชะตากรรม"
901010800310-19 = "มีงานต้องจัดการอีกเยอะเลยเหรอ?"
901010800310-20 = "ก็ไม่เชิงหรอก ที่สำคัญกว่านั้นคือ..."
901010800310-21 = ""
901010800310-23 = ""
901010800310-24 = ""
901010800310-25 = "ฉันยังไม่มั่นใจว่าจะรับผิดชอบทั้งหมดทุกคดีได้หรือเปล่า"
901010800310-26 = "ก็อย่างที่เป็นมาตลอดนั่นละ ความจริงไม่อาจทำให้ทุกคนพึงพอใจได้"
901010800310-27 = "เมื่อถึงเวลาที่ต้องเลือกอีกครั้ง และต้องรับผิดชอบต่อการตัดสินใจนั้น..."
901010800310-28 = "ฉันจะไม่พังทลาย และแบกรับความรับผิดชอบนั้นเพียงลำพังได้หรือเปล่า?"
901010800310-29 = ""
901010800310-31 = ""
901010800310-32 = "แล้วจะต้องแบกรับไว้คนเดียวไปทำไมล่ะ?"
901010800310-33 = "แต่ฉันจะผลักภาระความรับผิดชอบจากการกระทำของตัวเองไปให้คนอื่นอีกไม่ได้..."
901010800310-34 = ""
901010800310-39 = ""
901010800310-41 = "นี่ไม่ใช่ความรับผิดชอบของเธอคนเดียว แต่เป็นของพวกเราทุกคนต่างหาก"
901010800310-42 = ""
901010800310-44 = ""
901010800310-45 = "นั่นสินะ..."
901010800310-46 = "เอาเป็นว่ามาเริ่มจัดการเรื่องตรงหน้าทีละอย่างก่อนเถอะ"
901010800310-47 = "การที่หัวหน้ากองของเราเป็นคนคิดมาก ก็เป็นทั้งข้อดีและข้อเสียเลยนะ"
901010800310-48 = "อืม"
901010800310-49 = "ตอนนี้ต้องแก้ปัญหาที่อยู่ตรงหน้าก่อน"
