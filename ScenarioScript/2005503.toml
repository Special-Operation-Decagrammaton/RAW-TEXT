[translation]
2005503-1 = "UZQueen의 슬럼프"
2005503-2 = "게임개발부 가는 길"
2005503-3 = "(유즈에게서 게임이 힘들다는 말이 나오다니.)"
2005503-4 = "(이 말도 안 되는 상황에, 다급히 밀레니엄으로 향했다.)"
2005503-9 = "야, 지난달에 나온 게임 해봤어?"
2005503-11 = "[ns](음? 게임?)"
2005503-12 = "아, 신작 격투 게임- <시뮬리온 퀘스트>  말이지?"
2005503-13 = "사이버펑크풍의 근미래를 무대로 한 세계관의 완성도가 상당하더라. 상호작용도 굉장히 세밀하게 구현되어 있고, 모션도 상당히 부드럽고."
2005503-14 = "그런데 뭔가 이상하지 않아?"
2005503-15 = "이상하다고? 아, 그 최적화 문제라면 제작사가 얼마 전에 공지로……."
2005503-16 = "아니, 그거 말고. 순위권에 UZQueen이 안 보이잖아."
2005503-17 = "랭킹 시스템이 열린 지 벌써 일주일째인데."
2005503-19 = "(UZQueen……?)"
2005503-20 = "그, 그러네?! 격투 게임의 랭킹에서 UZQueen이 모습을 보이지 않은 적은 그동안 한 번도 없었는데……."
2005503-21 = "혹시 UZQueen에게 무슨 일이 있는 건 아니겠지?"
2005503-23 = "(이 대화를 듣는 순간, 어쩐지 발걸음이 빨라졌다.)"
2005503-27 = "게임개발부 부실"
2005503-28 = "[ns]\"유즈! 괜찮아?!\""
2005503-29 = "서, 선생님?!"
2005503-33 = "무, 무슨 일이세요?!"
2005503-34 = "왜 그렇게 다급하게……."
2005503-35 = "[s]\"무슨 일 있는 거 아니지, 유즈?\""
2005503-36 = "예? 그, 그럼요, 선생님."
2005503-37 = "보, 보세요, 이제는 캐비닛에도 잘 들어간다고요."
2005503-42 = "서, 설마 아까 그 모모톡 때문에 이렇게 오신 거예요?!"
2005503-43 = "고작 게임이 어렵다는 그 한마디 때문에……?!"
2005503-44 = "평소에 절대로 안 보여주던 모습이라 걱정되어서……라고요?"
2005503-48 = "새, 생각해 보니 그렇긴 하네요……."
2005503-49 = "그동안 게임을 하면서 난이도 때문에 고민을 한 적은 거의 없었으니……."
2005503-50 = "[s1]\"그런데 혹시 그 게임의 이름이…….\"\n[s2]\"<시뮬리온 퀘스트>일까?\""
2005503-53 = "어, 어떻게 아셨어요?!"
2005503-55 = "(오다가 들었던 이야기를 전해주었다.)"
2005503-56 = "아, 그, 그래서……."
2005503-57 = "……들으신 대로, 저는 아직 그 게임에 제대로 도전하지도 못했어요."
2005503-58 = "그게, 왜냐하면……."
2005503-59 = "……한번 직접 보실래요?"
2005503-61 = "(유즈가 <시뮬리온 퀘스트>를 실행시켰다.)"
2005503-62 = "(그리고 게임을 켜자마자, 왜 유즈가 이 게임을 힘들어하는지 알 것 같았다.)"
2005503-64 = "[ns3]\"이 게임, 직접 손을 움직여서 싸우는 방식의……\"\n[ns4]\"……VR 게임이었구나!\""
2005503-67 = "네. 단순히 패드만 조작해야 하는 게 아니라, 전신을 움직여서 직접 피하고 공격을 해야 하거든요."
2005503-68 = "그런데 저는…… 손의 움직임만이라면 몰라도 뛰거나 몸을 움직이는 건 어려워서……."
2005503-69 = "제대로 플레이해 보고 싶었지만, 튜토리얼조차도 쉽지가 않았어요……."
2005503-70 = "네? 선생님도 함께해 보고 싶으시다고요?"
2005503-71 = "그…… 보시다시피 2인 합동 플레이 모드가 있기는 한데……."
2005503-72 = "좋은, 생각이요……?"
2005503-77 = "왜, 또 이 복장인가요……!"
2005503-78 = "게임 내의 주인공과 비슷한 복장이라 플레이가 편할 거라고요? 트, 틀린 말은 아니긴 한데……!"
2005503-79 = "[s5]\"자, 그럼 이제…….\"\n[s6]\"내 어깨 위에 타라, 유즈.\""
2005503-82 = "네?!"
2005503-83 = "히엑?!"
2005503-88 = "(유즈를 들어서 목말을 태웠다.)"
2005503-91 = "흐, 흐에에에, 높아요……!"
2005503-92 = "서, 선생님, 2인 합동 모드는 이렇게 하는 게 아닌……."
2005503-93 = "[s7]\"하지만 제대로 게임에 반영되고 있잖아?\"\n[s8]\"봐, 유즈의 캐릭터가 게임 내에서도 목말을 타고 있어.\""
2005503-96 = "그, 그건 확실히 그렇긴 한데……!"
2005503-97 = "[s9]\"몸을 쓰는 것은 제가 대신 하겠습니다, 파일럿님.\"\n[s10]\"유즈는 유즈가 할 수 있는 일에 집중해!\""
2005503-100 = "……!"
2005503-101 = "……그러면 제가 색적과 브리핑을 할 테니, 그리고 선생님은 이동과 공격을 부탁드리겠습니다."
2005503-102 = "[s]\"좋아, 가자!\""
2005503-107 = "(그렇게 유즈와 2인 모드로 게임을 시작한 뒤…….)"
2005503-108 = "(최상위 랭킹 리스트에 진입하기까지는 단 하루도 걸리지 않았다.)"
2005503-109 = "(그리고…….)"
2005503-111 = "(<시뮬리온 퀘스트>의 게임 커뮤니티에는 목말을 탄 채로 보스를 공략하는 2인 파티에 대한 목격담이 셀 수 없이 쏟아지기 시작했다.)"
2005503-112 = "(……다만 수많은 목격담에도 불구하고, 이를 직접 따라 할 수 있는 유저는 UZQueen 이외에는 없다고 한다……)"
