[translation]
2005206-1 = "경영의 심리학"
2005206-2 = "선생님은 매출을 위해서라면 뭐든 할 수 있으십니까?"
2005206-3 = "[s1] \"또 영문 모를 질문이구나, 야쿠모야.\"\n[s2] \"무슨 일이라도 있니?\""
2005206-6 = "뭔가, 요즘 위기여서요……."
2005206-7 = "사실 출판업은 늘 위기이긴 합니다만."
2005206-8 = "아, 그거 아십니까."
2005206-9 = "경영자는 언제나 위기라고 주장할 수 있다는 것 말이죠."
2005206-10 = "매출이 오르면 미래가 불확실하니 위기라고 우길 수 있고."
2005206-11 = "매출이 떨어지면 그건 그냥 위기죠."
2005206-12 = "역대급 매출을 찍은 다음에는, 반드시 상대적인 실적 저하가 오기 마련인데."
2005206-13 = "그걸 단순하게 해석해서 매출 비율 하락이 발생했으니, 이거야말로 위기라고 말할 수 있는 근거가 되는 거죠."
2005206-14 = "정말이지, 경영자란 믿을 게 못 된다니까요. 힛. 힛. 히."
2005206-15 = "[s] \"그러면 야쿠모도 믿을 게 못 되겠네~\""
2005206-16 = "엑."
2005206-17 = "그게, 그렇게…… 되네, 요?"
2005206-18 = "노, 농담이었습니다. 그렇고말고요. 헤헤. 헤……."
2005206-19 = "아무튼요."
2005206-20 = "오프라인 서적은 이제 사실상 기념품 비슷한 게 되어 가고 있고."
2005206-21 = "온라인 서적은 그야말로 미래 예측이 안 될 정도로 혼돈 속이고."
2005206-22 = "뭔가…… 뾰족한 수가 없을까 해서요."
2005206-23 = "그런 거 생각해 낸다 한들, 결국 당장의 이슈를 덮는 임시방편이 되겠지만."
2005206-24 = "거 왜, 임시방편도 계속 쌓아가다 보면, 문제 해결책이 되고 그러는 거 아니겠습니까."
2005206-25 = "[s] \"일단 책을 많이 읽히도록 해야겠네?\""
2005206-26 = "네. 그게 기본적인 방침이죠."
2005206-27 = "그래서 눈이 왕창 내렸으면 좋겠네요."
2005206-28 = "갑자기 눈은 어째서냐고요? 그래야 하교 후에는 빨리 방으로 돌아가, 컨텐츠를 소비하는 게 최고라고 프로파간다를……."
2005206-29 = "실례. '공익적인 권장'을 할 수 있기 때문이죠."
2005206-30 = "[s] \"이젠 숨기지도 않는구나…….\""
2005206-31 = "……최후의 선은 아직 넘지 않았다고 생각하는데요……."
2005206-32 = "어쨌든, 여기에서 문제가 되는 게 하나 있습니다."
2005206-33 = "붉은겨울은 언제나 눈으로 덮여 있다는 거죠……."
2005206-34 = "이미 눈이 쌓여 있는데, 거기에 한층 더 눈이 쏟아진다고 이야기를 해 봤자, 얼마나 설득력이 있을지……."
2005206-35 = "[s] \"흠……. 그러니까 눈이 엄청나게 왔다는 어필을 하면 되는 거지?\""
2005206-36 = "결론적으로는 그렇죠?"
2005206-37 = "네? 좋은 생각이 있으시다고요?"
2005206-41 = "……선생님?"
2005206-42 = "저, 잘 이해가 안 가는데, 다시 한번만 설명 부탁드려도 될까요……?"
2005206-43 = "[s3] \"학생의 질문은 언제나 환영이지!\"\n[s4] \"말했던 대로, 야쿠모의 스노우 엔젤 사진을 표지로 쓰는 것이다!\""
2005206-46 = "왜죠."
2005206-47 = "[s] \"스노우 엔젤은, 눈이 상당히 쌓이지 않으면 못 찍으니까.\""
2005206-48 = "그건 아는데, 왜 제가 하느냐는 겁니다만……?"
2005206-49 = "저는 보통 앞에 나서는 거 안 좋아하고."
2005206-50 = "솔직히, 이쁨받는 타입은 아닌데요……."
2005206-51 = "[s5] \"바로 그렇기 때문이야.\"\n[s6] \"야쿠모가 눈 속에 파묻힌 모습을 보여주면.\"\n[s7] \"다들, 정말로 눈이 많이 왔다고 생각할 테니까.\""
2005206-57 = "네에? 그리고, 평소에 그렇게 편하게 사는 출판부 부장이 파묻혀 버릴 정도로 눈이 왔다면."
2005206-58 = "다들 그거야말로 보통 상황이 아닐 거라고 생각할 테고……."
2005206-59 = "무엇보다 선생님께서 생각하기에, 그 장면 자체가…… 재미있을 것 같으니까요?"
2005206-60 = "……그쪽이 진심이셨구만요……."
2005206-61 = "[s] \"매출을 위해서라면, 뭐든 할 수 있다고 하지 않았던가?\""
2005206-62 = "으윽, 여기에서 자기 말에 스스로 걸려 넘어지게 되다니……!"
2005206-63 = "어쩔 수 없죠…… 말과 글은, 한 번 나가면 돌이킬 수 없으니까요……."
2005206-71 = "[wa:470]― [log=야쿠모]오오…… [wa:1550]왠지 포근하네요.[/log]"
2005206-74 = "― [log=야쿠모]나름 [wa:840]기분이 좋은 것 [wa:1260]같기도……[wa:80] [/log]"
2005206-77 = "[wa:330]― [log=야쿠모]그렇게[wa:560] 말하자마자 [wa:2550]추워졌습니다. [wa:780] [/log]"
2005206-80 = "― [log=야쿠모]엣취![wa:80] [/log]"
2005206-83 = "[ns] \"자, 자 표정 펴고, 찍는다~\""
2005206-84 = "[wa:1870]― [log=야쿠모]다 되었나요?[/log]"
2005206-86 = "― [log=야쿠모]그러면 [wa:320]이제, [wa:290]선생님도 하시죠.[/log]"
2005206-89 = "― [log=야쿠모]어라,[/log]"
2005206-91 = "― [log=야쿠모]이거 [wa:610]저에게만 [wa:680]시킬 생각이셨나요?[wa:40] [/log]"
2005206-94 = "[wa:650]― [log=야쿠모]저런, 저런. [wa:1450]그건 너무[wa:80] [/log]"
2005206-96 = "― [log=야쿠모]안일하다고 [wa:310]생각하는데요, [wa:1770]선생님?[/log]"
2005206-99 = "[wa:980]― [log=야쿠모]붉은겨울의 [wa:970]추위는, [/log]"
2005206-101 = "― [log=야쿠모]모두에게 [wa:640]공평한 법이니까 말이죠?  [wa:1640]힛. 힛. 히.[/log]"
