[translation]
1000502-1 = "잠자는 고래"
1000502-2 = "대책위원회 동아리실"
1000502-3 = "그러니까 고래는 잘 때도 숨을 참고 있다는 얘기잖아. 굉장하지 않아?"
1000502-4 = "[s1] \"갑자기 웬 고래 얘기?\"\n[s2] \"도움이 필요하다는 건 뭐야?\""
1000502-5 = "아아. 낭만이 없구만, 선생도."
1000502-6 = "아아. 낭만이 없구만, 선생도."
1000502-7 = "으헤~ 사실은 힘쓰는 일이 필요해서 말이지. 도저히 혼자서는 옮길 수가 없는 물건이 있어서."
1000502-8 = "역시 한가해 보이는 선생말고는 부탁할 사람도 딱히 없었고, 뭐 그렇게 된 거야."
1000502-9 = "그래도 와주다니 역시 선생밖에 없다니까."
1000502-10 = "[s] \"힘을 쓰는 거라면 다른 부원들을 부르는게……?\""
1000502-11 = "섭섭한 소리 하지 말라고. 이 일은 다른 부원들에게는 비밀로 해야 한단 말야."
1000502-12 = "자, 그럼 가보자고. 학교가 비어있는 지금이 기회야."
1000502-15 = "사용하지 않는 창고"
1000502-16 = "(드르르륵-)"
1000502-17 = "콜록, 콜록. 자, 여기야. 먼지가 엄청……."
1000502-18 = "아, 거기 조심해, 선생. 발 밑을 잘 봐야 해."
1000502-19 = "[s3] \"여기는……?\"\n[s4] \"……창고?\""
1000502-20 = "응. 사용하지 않고 방치된 자재 창고야. 우리 학교엔 이런 게 몇 개나 있거든."
1000502-21 = "응. 사용하지 않고 방치된 자재 창고야. 우리 학교엔 이런 게 몇 개나 있거든."
1000502-22 = "뭐, 이미 쓸만한 물건들은 전부 내다 팔아서 대부분은 잡동사니밖엔 없지만."
1000502-24 = "그래도 가끔씩은 뒤져보면…… 이렇게……."
1000502-25 = "콜록, 콜록. 짜안!"
1000502-26 = "이렇게 굉장한 물건이 발굴되기도 한다니까. 어때, 굉장하지?"
1000502-27 = "[s5] \"체육 매트……?\"\n[s6] \"이걸로 뭘 하게?\""
1000502-28 = "어허. 그냥 체육 매트가 아냐. 이거야말로 우리 학교의 과거의 영광, 돈이 풍족할 때의 상징 같은 물건!"
1000502-29 = "어허. 그냥 체육 매트가 아냐. 이거야말로 우리 학교의 과거의 영광, 돈이 풍족할 때의 상징 같은 물건!"
1000502-30 = "무려, 오리털 매트!"
1000502-31 = "부직포 같은 싸구려 충전재가 아닌 진짜 오리털을 꽉 채운 사치스러운 물건이지!"
1000502-32 = "덮고 자는 이불도 아니고 학생들이 밟고 다니는 체육 매트에 오리털이라니 무슨 질나쁜 농담도 아니고 말야."
1000502-33 = "으헤, 하지만 세상에는 별별 일이 다 있는 법이니까, 이런 괴상한 물건도 존재할 수도 있는 법이지."
1000502-34 = "깊이 생각하면 지는 거라고?"
1000502-35 = "뭐, 이제부터 이 아저씨가 잘 써줄 거니까♪"
1000502-36 = "자, 선생. 그쪽 좀 잡아줘."
1000502-39 = "영차~ ……그럼 가자고."
1000502-41 = "사용하지 않는 빈 교실"
1000502-42 = "(드르륵)"
1000502-43 = "자, 여기쯤이면 됐어. 놔줘."
1000502-44 = "(풀썩-)"
1000502-45 = "음, 각도가 조금 애매한데…… 조금만 더 이렇게……."
1000502-47 = "……됐다. 딱 좋아. 완벽해!"
1000502-48 = "[s] \"여기로 매트를 옮겨서 뭐하려고?\""
1000502-49 = "으헤. 선생은 당연한 걸 묻고 그래."
1000502-50 = "(폴짝)"
1000502-52 = "(풀썩)"
1000502-53 = "[s7] \"누워버렸다?!\"\n[s8] \"편안한 취침 모드?!\""
1000502-54 = "이걸로 낮잠자기 딱 좋은 비밀 기지 완성!"
1000502-55 = "이걸로 낮잠자기 딱 좋은 비밀 기지 완성!"
1000502-56 = "아무도 알아차릴 수 없는 나만의 비밀 휴식 핫스팟이 완성된 거지. #n아, 선생 설마 이 장소를 다른 애들한테 밀고할 생각은 아니겠지?"
1000502-57 = "[s9] \"먼지는 좀 털고 쓰는게 좋을 거 같은데.\"\n[s10] \"이대로 잠들면 감기 걸려.\""
1000502-58 = "자아, 잔소리는 됐고. 그럼 땡큐 땡큐. 으헤~ 덕분에 엄청 좋은 잠자리가 생겼다니까."
1000502-59 = "자아, 잔소리는 됐고. 그럼 땡큐 땡큐. 으헤~ 덕분에 엄청 좋은 잠자리가 생겼다니까."
1000502-60 = "으헤…… 푹신푹신……. 이것이 오리털의 감촉인가아……."
1000502-61 = "아아…… 잠이 그냥 막 쏟아지는 거 같아…… 선생……."
1000502-62 = "후아아암- 그럼 안녕히 주무세요……."
1000502-63 = "……고래가 아니라서…… 다행……"
1000502-64 = "……쿨."
1000502-66 = "[s11] \"………………….\"\n[s12] \"……진짜 잠들어버렸네.\""
1000502-67 = "(잠들어 있는 호시노를 잠깐 동안 구경하다가, 다음 스케쥴이 생각나 슬슬 돌아가기로 했다.)"
1000502-68 = "(잠들어 있는 호시노를 잠깐 동안 구경하다가, 다음 스케쥴이 생각나 슬슬 돌아가기로 했다.)"
1000502-70 = "(조심히 교실을 빠져나왔다.)"
