[translation]
1300405-1 = "보답할 시간이에요"
1300405-2 = "쇼핑몰"
1300405-5 = "아 선생님! 여기예요~ 여기~"
1300405-7 = "기다리고 있었어요☆"
1300405-8 = "네? 오래 기다렸냐고요? 아니요. 30분 정도?"
1300405-9 = "응? 아니에요. 선생님은 시간 맞춰 오셨고, 제가 멋대로 먼저 기다리고 있었던 것뿐이니까요☆"
1300405-10 = "자. 그럼, 출발~☆"
1300405-11 = "즐거운 데이트…… 아니, 쇼핑 시간이에요!"
1300405-13 = "앗! 선생님! 저기도 보고 가요!"
1300405-14 = "으음. 역시 디퓨저도 사야겠죠? 동아리실에 놔두면 좋을 거 같아요."
1300405-15 = "어머. 오셀로 세트? 역시 이런 것도 하나쯤 있으면……"
1300405-16 = "[s1] \"자, 잠깐만.\"\n[s2] \"너무 많이 사는거 아냐?\""
1300405-18 = "아비도스 학원에서 이 쇼핑몰까지가 얼마나 먼 거리인데요!"
1300405-19 = "아비도스 학원에서 이 쇼핑몰까지가 얼마나 먼 거리인데요!"
1300405-20 = "자주 나오기 힘드니, 이 정도는 사줘야 해요."
1300405-21 = "그리고…… 다들 자기 아르바이트 비용을 학교 빚갚는데 쓰고 있으니……"
1300405-22 = "이래서야 학교 동아리실이 아니라 아르바이트 센터 같아서 불쌍하단 말이에요……."
1300405-23 = "자아! 쇼핑을 계속 하죠!"
1300405-24 = "제 카드의 한도초과 까지는 한참 남았다고요!"
1300405-27 = "(이후 엄청나게 쇼핑했다.)"
1300405-29 = "대책위원회 동아리실"
1300405-30 = "(아비도스까지 배송은 안해준다고 해서 엄청나게 무거운 짐을 메고 돌아왔다)"
1300405-31 = "(털썩!!)"
1300405-32 = "서, 선생님."
1300405-33 = "괘, 괜찮으세요? 고생하셨어요!"
1300405-34 = "…… 죄송해요. 너무 많이 산 것 같네요."
1300405-35 = "평소에는 이렇게까지 사진 않는데……"
1300405-36 = "오늘은 조금……. 신났던 것 같네요."
1300405-39 = "(툭)"
1300405-40 = "(…… 아령이 떨어진다.)"
1300405-41 = "……."
1300405-42 = "시로코 쨩에게 선물할 아령…… 이것도 있었구나……."
1300405-43 = "(툭, 툭)"
1300405-44 = "그건 세리카 쨩에게 줄 화분이고……."
1300405-45 = "앗. 선생님! 그만 떨어트려 주세요! 깨지는 것도 있다고요!"
1300405-46 = "어라… 이건……."
1300405-47 = "아하. 이걸 여기에 넣어놨었군요. 네 맞아요. 귀이개예요."
1300405-48 = "짜잔~☆ 사실 이건 선생님을 위해 산 거랍니다."
1300405-49 = "[s] \"나를 위해서?\""
1300405-50 = "네! 물론이죠! 잠시만요!"
1300405-52 = "(스윽 스윽)"
1300405-53 = "바닥에다 돗자리를 깔고,"
1300405-54 = "자아, 선생님."
1300405-55 = "여기, 제 무릎에 누우세요."
1300405-56 = "[s] \"누우라고?\""
1300405-57 = "자아, 착하다, 착해. 어서요~"
1300405-58 = "[s] 눕는다."
1300405-62 = "― 자아, [wa:1300]귀청소 시간이에요."
1300405-64 = "― 얌전히 있어야 해요, [wa:1800]선생님?"
1300405-67 = "― 꼼지락거리면 안돼요. [wa:3000]지금부터 이걸 넣을 거라구요?"
1300405-70 = "― 간지러우면 얘기해야해요?"
1300405-72 = "― 응응. [wa:1500]착하다, [wa:1000]착해."
1300405-75 = "― 어…… [wa:3000]생각해보니까 이거 조금…… [wa:3500]부끄러운데요?"
1300405-78 = "― 뭔가 [wa:1500]선생님 얼굴이 [wa:1500]엄청 가까워서......[wa:80]"
1300405-80 = "― 저기......"
1300405-83 = "― 이건 선생님한테만 해주는 서비스니까, [wa:3500]우리 둘만의 [wa:1000]비.[wa:1000]이.[wa:660]밀.[wa:960]이에요?"
1300405-87 = "― 응? [wa:1000]그렇게 누우면 [wa:2500]선생님 뒷통수 밖에 안보이는데......"
1300405-89 = "― 어…… [wa:1500]게다가…… [wa:1500]콧바람이……"
1300405-93 = "― 안돼요, 선생님! [wa:2000]똑바로 누우셔야죠!"
1300405-96 = "자아, 깨끗해졌어요."
1300405-97 = "어때요? 좋은 느낌인가요?"
1300405-98 = "[s] \"잘 모르겠고 조금 부끄러워.\""
1300405-99 = "……아, 아하하."
1300405-100 = "그러고보니…… 사실 저도…… 엄청 부끄러운 기분이었어요……."
1300405-101 = "하지만…… 후훗♡"
1300405-102 = "응, 아무 것도 아니에요"
