[translation]
90000150-1 = "제16화;빙해 2"
90000150-3 = "수고하셨습니다. 에이미, 토키. 뭔가 찾으셨나요?"
90000150-9 = "응. 데카그라마톤의 수하들이 얼어붙은 바다 곳곳에 출몰하고 있었어. 하지만 딱히 뭔가 명령을 수행한다거나 목적을 가지고 움직이는 걸로 보이진 않았어."
90000150-10 = "명령 체계를 잃고 방황하는 느낌에 가까웠달까."
90000150-16 = "그리고 신호가 포착되는 좌표 위엔 얼어붙은 바다 말곤 아무것도 없었습니다."
90000150-17 = "흐음……. 그렇다는 건……."
90000150-22 = "……, 메이데이, 메이데이…… 아, 아아……. 들리나요?"
90000150-23 = "통신이……?!"
90000150-24 = "조난 신호……?!"
90000150-25 = "그게 아니잖아!! 메이데이는 구조요청이잖아! 여기서는 이렇게 해야지!!"
90000150-26 = "여러분 여기까지 오시느라 고생하셨습니다. 그럼 죽어주세요."
90000150-27 = "무, 무슨-?! 당신들은……?!"
90000150-32 = "?!"
90000150-33 = "지진인가요?!"
90000150-40 = "아니에요!! 파동의 형질이 지진파와는 달라요. 이건……."
90000150-46 = "부장! 지하 15m 아래에서 강력한 에너지가 탐지되었어! 지금 이쪽으로 접근 중!"
90000150-48 = "……얼음 아래입니다! 바닷속이에요!"
90000150-49 = "이 신호는…… 예언자예요! 새로운 데카그라마톤의 예언자가 오고 있어요!!"
90000150-50 = "……어라? 얘네들 생각보다 덜 멍청한 거 같아!!"
90000150-51 = "평가를 상향 조정할게요. 완전 허접에서 약간 허접으로……."
90000150-52 = "뭐든 상관없지만. 그럼 수고하세요. 작별 인사는 죽고 난 뒤에 하겠습니다. 바이바이~"
90000150-53 = "네, 지금 저들이 무엇인지는 일단 나중에 확인합니다. 지금은 우리 쪽으로 접근해 오는 예언자를 저지해야 해요!"
90000150-54 = "[s] \"모두 싸울 준비를 해!!\""
90000150-61 = "알겠습니다."
90000150-62 = "응!"
