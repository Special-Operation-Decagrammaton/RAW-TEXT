[translation]
10002070-1 = "제7화;바다의 집 1"
10002070-2 = "하우우……"
10002070-3 = "어떻게든 두 번째 것까지 어떻게든 끝냈네요. 다행이라면 다행이랄까……."
10002070-4 = "응 생각보다 빠르게 리스트를 수행하고 있어. 이건 꽤 고무적인 상황이지."
10002070-5 = "최대한 빨리 끝내고, 처음의 목적이었던 '바다 즐기기'를 시작하도록 하자."
10002070-6 = "네. 그래야겠어요……"
10002070-7 = "[s1] (아니, 이미 충분히 즐기고들 있는 것 같은데……)\n[s2] (그 리스트의 내용들이 바로 '바다 즐기기'인데……)"
10002070-8 = "그래서 다음 목표는 뭐지? 히후미. 지체할 시간이 없다. 빨리 해치우자고."
10002070-9 = "그래서 다음 목표는 뭐지? 히후미. 지체할 시간이 없다. 빨리 해치우자고."
10002070-14 = "어디 보자……'바다의 집'이네요. 별다른 조건은 없고, 그냥 가서 편하게 먹으면 되나 봐요."
10002070-15 = "이런 데 오면 바다의 집의 먹거리를 즐기는 것도 재미 중 하나니까요. 당장 여기도 가게가 하나 있고……"
10002070-16 = "사실, 그렇잖아도 여기 꽤 맛집으로 소문 난 가게가 하나 있거든요."
10002070-17 = "이왕이면 여기서……"
10002070-19 = "바다의 집"
10002070-21 = "저기, 계세요?"
10002070-27 = "어어, 선생님이잖아!? 안녕! 선생님!"
10002070-28 = "[s3] \"……이즈미!?\"\n[s4] \"왜 가게를 보고 있는 거야?\""
10002070-29 = "응! 사정이 있어서 내가 지금은 여기 지배인이야!"
10002070-30 = "응! 사정이 있어서 내가 지금은 여기 지배인이야!"
10002070-31 = "여기 원래 있던 주인아저씨가 몸져누워서, 대신 오늘 하루만 내가 보기로 했거든!"
10002070-32 = "설마 이런 데에서 선생님을 만날 거라곤 생각 못 했는데 말이지! 마침 잘 됐어!"
10002070-34 = "어라, 선생님 아는 학생인가요?"
10002070-35 = "저 외모는 게헨나……?"
10002070-36 = "……?"
10002070-37 = "[s] 이즈미에 대해서 적당히 얼버무린다."
10002070-40 = "아아. 선생님의 지인이셨군요. 실례했습니다."
10002070-41 = "자아- 내 회심의 신작 레시피로 만든 음식을 줄게. 자아- 자리에 앉아!"
10002070-42 = "[s5] \"'이즈미가 만든' 신작이라고!?\"\n[s6] \"설마 주인 아저씨가 몸 져 누운 이유가……!\""
10002070-43 = "같이 온 친구들도 다들 앉아서 골라! 이 메뉴들은 정말로 기대해도 좋다고!"
10002070-44 = "같이 온 친구들도 다들 앉아서 골라! 이 메뉴들은 정말로 기대해도 좋다고!"
10002070-45 = "내가 특별히 싸게 내줄 테니까 말이야!"
10002070-49 = "덕분에 일이 수월해졌군."
10002070-50 = "감사히 받도록 하지."
10002070-51 = "호의를 거절하는 것도 예의가 아니겠죠."
10002070-52 = "저도 자리에 앉겠습니다. 선배님도 앉으시죠."
10002070-58 = "[ns] \"잠깐, 모두들 잠시만……!\""
10002070-59 = "와아- 이런 일도 다 있네요! 정말 다행이에요!"
10002070-60 = "[s] \"우선 내 말을 들어줘.\""
10002070-61 = "음? 선생님? 왜 그러세요? 무슨 일 있으신가요?"
10002070-62 = "응? 메뉴 이름들도 되게 신기하네요."
10002070-63 = "<바닷물 굴빙수>에 <초코민트 야키소바>에 <연유중화냉면>, <초코맛 해삼 주스>……"
10002070-64 = "하나같이 재치 있는 메뉴명이네요. 좋은 센스입니다."
10002070-65 = "[s] \"아니…… 그건 아마 말 그대로라고 생각해.\""
10002070-66 = "네……? 그게 무슨 말씀이세요?"
10002070-67 = "자아- 다들 골랐어?"
10002070-68 = "주문 받을게-!"
10002070-72 = "그럼 그 바닷물 굴빙수를 주문해보도록 할까요."
10002070-73 = "선배님께선 뭘 드시겠어요?"
10002070-75 = "……초코민트 야키소바."
10002070-76 = "그럼 저는 초코맛 해삼 주스로……!"
10002070-81 = "연유중화냉면."
10002070-83 = "주문 받았어-!"
10002070-84 = "바닷물 굴빙수, 초코맛 해삼 주스, 초코민트 야키소바, 연유중화냉면 하나씩이야!"
10002070-85 = "[s] \"기, 기다려……!\""
10002070-86 = "선생님은? 선생님은 뭐 먹을 거야? 뭐 만들어줄까?"
10002070-87 = "응? 선생님은?"
10002070-88 = "……응? 뭐 먹을래? 응?"
10002070-89 = "[s] \"나는……!!\""
10002070-90 = "(타아앙-!!)"
10002070-91 = "……에?"
10002070-93 = "(타타타탕-! 타타타타타타탕-!!)"
10002070-94 = "후, 후에에에-!? 뭐야, 뭐야!?"
10002070-95 = "누가 가게를 노리는 거야!? 어째서!? 왜!?"
10002070-96 = "어째서!? 왜!? 냐니……!!!"
10002070-97 = "정말 모르겠다는 거냐, 이 생화학 테러리스트!!"
10002070-98 = "[s] \"이 목소리는?\""
10002070-102 = "용서 못 해……"
10002070-103 = "용서 못 한다고! 우리가 이런 걸 그냥 넘어갈 줄 알았어!?"
10002070-104 = "보스는…… 보스는 지금도 변기를 끌어안고 있어! 이미 사람 몰골이 아니라고!"
10002070-106 = "으아아아아……! 또 불량배 분들인가요……!?"
10002070-107 = "이 가게에서 만든……! 네 녀석의 음식을 먹고……! 사경을 헤매고 있단 말이야!"
10002070-108 = "이런 망할 가게!! 가만둘 수 없어! 부숴버릴 거야!!"
10002070-109 = "……? 이건 또 무슨 이야기죠……?"
10002070-110 = "문답무용!!"
10002070-112 = "얘들아, 공격이다!!"
10002070-113 = "(타타타탕! 타탕! 퍼어어엉!!)"
10002070-114 = "으아아아아!! 가게가……! 내 가게도 아닌 가게가……!?!?"
10002070-115 = "그, 그만둬! 주인아저씨 일어나면 돌려줘야 한단 말이야!! 으아아아앙!!"
10002070-116 = "정확히는 모르겠지만, 정말 처음부터 끝까지 방해하는군. 불량배 놈들."
10002070-117 = "정말이지 용납할 수 없습니다! 먹는 것은 중대사! 이런 큰 불의를 두고볼 순 없어요!"
10002070-118 = "정의의 심판을 내려야겠군요! 가시죠!!"
10002070-124 = "왜, 왜 또오오오~~!!"
