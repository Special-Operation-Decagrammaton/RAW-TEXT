[translation]
21160-1 = "제16화;앞으로 단 한 걸음!"
21160-2 = "밀레니엄 학생회 압류품 보관소"
21160-5 = "헥헥. 돌파 성공?!"
21160-6 = "선생님! 미도리! 아리스?! 무사해?"
21160-7 = "HP는 충분합니다."
21160-8 = "나, 나도 선생님도 괜찮아."
21160-9 = "으으. 다행이다. 여기가 압류품 보관소인가? 엉망이네."
21160-10 = "유리도 깨지고, 서랍장도 쓰러지고……"
21160-11 = "카린 선배의 도탄이라던가…… 아까 전투나 폭발 때 여기까지 피해가 온 걸지도."
21160-12 = "유우카는 이미 아리스가 거울을 챙겨서 게임개발부 부실로 도망간 줄 알겠지만…… 후후! 우리가 여기로 온 줄은 모르겠지."
21160-13 = "일단 여기서 거울만 챙겨가면 나머지는 베리타스가 해줄 거야."
21160-15 = "오케이. 거울 발견! 이것만 있으면……."
21160-16 = "우후후. 설렌다. 자 어서 돌아갈……"
21160-17 = "……?"
21160-18 = "……쉿. 음소거 바랍니다."
21160-19 = "응?"
21160-21 = "누군가, 이쪽으로 오고 있습니다. 발걸음 소리를 볼 때 한 명으로 예상."
21160-22 = "에이. 여기 오래 있다가 유우카나 메이드부가 되돌아오면 어쩔려고 그래. 한 명 정도면 무시하거나 후딱 돌파하자."
21160-23 = "……."
21160-24 = "자, 잠깐."
21160-25 = "하레 선배에게서 연락이야."
21160-27 = "(무.조.건 도주 아니 숨어! 제발! 어떻게든 $!#^&!@#)"
21160-28 = "응? 대체 무슨 말을……?"
21160-29 = "늘 침착한 하레 선배가 왜 이러지. 베리타스 부실에 쥐라도 나타났나."
21160-30 = "접근 대상 확인. 밀레니엄 학생부 검색, 대상 확인."
21160-31 = "키 146 cm…… 더블 SMG…… 메이드복 위에 용무늬 야구 잠바……."
21160-32 = "어……?"
21160-33 = "서…… 설마……?!"
21160-35 = "숨어!"
21160-38 = "선생님! 머리만 숨고 엉덩이가 드러났습니다!"
21160-39 = "빠, 빨리! 서둘러요!"
21160-43 = "……."
21160-44 = "흐음. 아주 엉망이구만."
21160-45 = "(네, 네, 네루 선배다!!)"
21160-46 = "(어, 어째서! 어째서 저 사람이 여기에!)"
21160-47 = "아앙……?"
21160-48 = "뭔가 속삭이는 소리가 들린 것 같은데……."
21160-49 = "(?!)"
21160-50 = "(히이익……!)"
21160-51 = "(……)"
21160-52 = "(이 사람…… 다르다…….)"
21160-53 = "(두려움…… 처음 느끼는 감정…….)"
21160-54 = "(현재 상황에서 전투 발생 시 승리 확률…… 한없이 0%……!)"
21160-56 = "흐음……."
21160-57 = "책상 밑인가…… 분명 인기척이……."
21160-59 = "(또각……)"
21160-61 = "(또각…………)"
21160-62 = "(미, 미치겠네)"
21160-63 = "(이제…… 끝이야……)"
21160-64 = "(서, 선생님! 어떡해?!)"
21160-65 = "(바로 앞…… 이제 그녀가 고개를 숙이면……!)"
21160-68 = "저, 저기!"
21160-69 = "응?"
21160-71 = "네, 네루 선배! 큰일이에요!"
21160-72 = "(?!)"
21160-73 = "(유, 유즈 쨩?!)"
21160-74 = "너는……?"
21160-75 = "세, 세미나 소속 유즈키라고 합니다."
21160-76 = "전투로봇들이 폭주해서, 지금 엉망입니다!"
21160-77 = "아카네 선배와 카린 선배가 고군분투하고 있지만……."
21160-78 = "아앙? 그것들은 차압해 온 게 언젠데 아직도 정비가 안 끝난 거야."
21160-79 = "도, 도움이 필요해서…… 여기 계시다는 소식을 듣고……"
21160-80 = "하아. 할 수 없지."
21160-81 = "저, 저는 이곳을 정리하고 있겠습니다. #n그, 그, 싸, 싸움엔 너무 겁이 나서…… 탄약도 없고, 경험도 부족해서……"
21160-82 = "뭐, 상관없지만. 그보다 너……"
21160-83 = "기억해 둬. 싸움에서 제일 중요한 건 무기나 경험이 아니야."
21160-84 = "네?"
21160-85 = "깡다구라구."
21160-86 = "너라면 제법 괜찮아 보여."
21160-87 = "이런 수상한 상황에, 나에게 말을 거는 건 꽤 용기가 필요한 일이거든."
21160-88 = "네, 네, 네?! 가, 감사합니다."
21160-89 = "나중에 보자."
21160-91 = "흐에에에……."
21160-93 = "(털썩)"
21160-95 = "주, 죽는 줄 알았어."
21160-96 = "유즈으으으으으~"
21160-97 = "유즈 쨩! 굉장해! 덕분에 살았어!"
21160-98 = "도움이 돼서 다행이야."
21160-99 = "그, 그보다 지금 아리스 쨩이 들고 있는 게……."
21160-102 = "넵."
21160-103 = "이것이 바로, 인류와 세계를 구원할 우리들의 새로운 무기."
21160-104 = "'거울'입니다."
21160-105 = "……!"
21160-106 = "축하는 나중이야! 서둘러! 네루 선배가 돌아오면 그대로 끝이라고!"
21160-107 = "이 앞에는 전투형 로봇이 잔뜩 있었어! 조심해야 해!"
21160-108 = "그, 그래! 아직 임무는 끝나지 않았어!"
21160-109 = "우리의 목적은 '거울'이 아니라…… G.Bible이니까! 베리타스 부실까지 가야 해!"
21160-110 = "돌아갑니다. 후방은 제가 맡겠습니다. 선생님! 지시를!"
21160-113 = "[ns1] \"돌아가자. 우리들의 부실로!\"\n[ns2] \"전원 전투태세!\""
21160-116 = "넵!"
21160-117 = "반드시 돌아가고 말 테다!"
21160-118 = "아리스, 전투를 시작합니다!"
