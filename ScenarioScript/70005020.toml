[translation]
70005020-1 = "어느 2월 19일의 기록 (1)"
70005020-3 = "[log]2월 19일[/log]"
70005020-6 = "게헨나 학원 선도부실"
70005020-8 = "……."
70005020-9 = "……."
70005020-10 = "……."
70005020-11 = "자, 누가 이 상황에 대해 적합한 설명을 해 주겠어요?"
70005020-12 = "……단도직입적으로 결론만 말씀드리자면…… 택배가 바뀌어서 온 것 같습니다."
70005020-13 = "그것도 산해경 고급중학교의, 현룡문이라는 곳과 말이지……."
70005020-14 = "지금 그렇게 냉정하게 상황을 분석하고 있을 때인가요?!?!"
70005020-15 = "사, 상황에 대한 적합한 설명을 해 달라며!"
70005020-16 = "당장 제가 산해경의 현룡문에 연락해서, 이 택배 발송 사고에 대해 적절한 조치를 요구하겠어요!"
70005020-17 = "기다려 주세요, 아코 행정관! 그래도…… 되는 것일까요?"
70005020-18 = "무슨 말을 하고 싶은 거죠, 치나츠?!"
70005020-19 = "현룡문은, 산해경 고급중학교의 학생회를 일컫는 명칭입니다. 우리 게헨나 학원으로 치면, 만마전에 해당하는 조직이죠."
70005020-20 = "그런데요?"
70005020-21 = "우리 선도부는 기본적으로 게헨나 내의 풍기 선도 및 치안을 담당하는 조직입니다만."
70005020-22 = "상황과 여지에 따라 학원 외부의 일을 처리하는 경우도 분명히 존재하기는 합니다. 그렇지만……."
70005020-23 = "……그것이, 타 학원의 '학생회', 다시 말씀드리는 것이 되겠습니다만 만마전에 해당하는 조직과 직접적인 교류를 한다는 것은……."
70005020-24 = "아."
70005020-25 = "네……. 제가 무슨 말씀을 드리려 하는지, 아실 것이라고 믿어요……."
70005020-26 = "응. 이거 해석하기에 따라서는 외교 행위라고 볼 수 있을 것이고……."
70005020-27 = "그걸 만마전 녀석들이 듣기라도 하면……."
70005020-32 = "상상도 하기 싫네. 무슨 트집을 잡아 댈지……."
70005020-33 = "아, 진짜! 누구 개인적으로 그쪽이랑 알고 지내는 사람 없어요?!"
70005020-34 = "……."
70005020-35 = "뭐예요, 둘 다! 다른 학교에 친구도 없는 건가요?!?!"
70005020-36 = "아, 아코 행정관? 저기, 제가 친구…… 까지는 아닙니다만, 산해경의 연단방이라는 곳과 약간 라인이 있기는 한데요……?"
70005020-37 = "연단방? 거긴 뭐 하는 곳이죠?"
70005020-38 = "조금 복잡합니다만……. 굳이 비유하자면, 응급의학부 같은 곳이라고 할 수 있을 겁니다."
70005020-39 = "아, 그래서……."
70005020-40 = "……."
70005020-42 = "아무튼 좋아요. 그렇다면 그 방향으로, 산해경 쪽과 '사적으로' 연락을 해 보죠."
70005020-47 = "……."
70005020-48 = "……."
70005020-49 = "이거…… 어떡하지?"
70005020-50 = "저에게 물으셔도 말이죠……."
70005020-51 = "일단, 이거 어디 쪽 케이크야?"
70005020-55 = "게헨나라고 쓰여 있네요. 어디 보죠…… 소라사키 히나 부장님께, 마음을 담아?"
70005020-56 = "소라사키 히나? 어딘가에서 들어 본 적이 있는 것 같은데……."
70005020-60 = "아, 기억났다! 게헨나 학원의 선도부장이라고 했던가? 학원을 지탱하는 완벽 초인이라든가 뭐라든가……."
70005020-61 = "흥, 그래도 우리 문주님이 분명 더 귀엽고 멋질 거라고!"
70005020-62 = "아뇨, 여기에서 갑자기 그런 말씀을 하셔도 말이죠……."
70005020-64 = "그러면 말이지……. 우리 케이크가 거기로 가고, 거기 케이크가 여기로 온 건가?"
70005020-65 = "그렇다고 봐야죠…… 그럼 이거 일종의 외교 안건인 건가요?"
70005020-66 = "……그러고 보니, 그러네?"
70005020-67 = "그러면…… 원칙적으로 이런 안건을 담당하는 건……."
70005020-68 = "……홍보부장, 쪽이겠지?"
70005020-69 = "………향주 님께 맡기시게요?"
70005020-70 = "…………원칙적, 으로는?"
70005020-71 = "자신 있으십니까."
70005020-72 = "그 이상 아무 말도 하지 말아 다오……."
70005020-79 = "응? 연단방으로부터 연락이라고?"
70005020-83 = "자, 잘 들어주길 바라는 것이다, 미나 집행부장!"
70005020-84 = "게헨나의 응급의학부를 통해, '사적인' 연락이 들어온 것이다!"
70005020-85 = "'사적인' 연락……?"
70005020-90 = "안녕하십니까, 코노에 미나 집행부…… 아뇨, 미나 씨. 저는 게헨나 선도부의 히노미야 치나츠…… 아뇨, 그냥 치나츠라고 합니다."
70005020-91 = "으, 으응……."
70005020-92 = "혹시, 오늘 저희 쪽으로 배송되었어야 할 케이크가, 그쪽으로 잘못 배송되지 않았나요?"
70005020-93 = "!!!"
70005020-99 = "감사합니다. 미나 씨. 케이크가 바뀐 점, 확실히 확인했습니다. 그러면 추후 대응 방안은……."
70005020-100 = "죄송합니다. 저희 쪽에서 나름의 토의…… 담소를 나눈 뒤에 또 연락드리기로 하겠습니다."
70005020-105 = "어쩌죠……."
70005020-106 = "으, 으으……. 하필이면 결국 또 그 녀석들에게……."
70005020-107 = "그 녀석들요?"
70005020-108 = "아, 아니다. 아무것도."
70005020-109 = "아무튼 이 일은, 내가 책임지고 어떻게든 해 볼 테니까! 음. 개인 근무 시간을 빼앗아서 미안하군."
70005020-110 = "알겠습니다, 집행부장님. 그러면 너무 무리는 하지 마시고……."
70005020-115 = "하아……."
70005020-119 = "……혹시 무슨 일이라도 생기면, 연락해 주세요."
70005020-120 = "냉정하게 이야기해서, 현룡문이 문주님의 결정과 수완 없이, 이런 외부 이슈를 드러나지 않게 처리할 것 같지도 않으니 말입니다."
70005020-122 = "하아아아아아……."
70005020-123 = "……어쩔 수 없지. 자신의 한계를 인정하는 것도, 내일로 나아가기 위한 일 보 후퇴."
70005020-124 = "그렇지만 하필이면……."
70005020-125 = "아니, 결심했으면 그 즉시 행하는 것이야말로, 하드보일드의 진수!"
70005020-127 = "현무상회"
70005020-128 = "음, 음. 뭔 말인지 알겠어. 마침 잘됐네! 좋은 생각이 딱 맞게 떠올랐거든!"
70005020-129 = "저, 정말인가?"
70005020-130 = "어떻게 하실 생각이신가요, 회장님? 아직 저희 현무상회의 라인이, 게헨나까지는 닿지 않은 상황인데요."
70005020-131 = "응. 그 부분도 포함해서, 이 기회에 라인을 이어 두는 것도 좋지 싶기도 하고!"
70005020-132 = "그런데 말이야. 다들 노래 좋아해?"
70005020-133 = "노래?"
70005020-134 = "요?"
