[translation]
1011903-1 = "마음을 전하는 방법"
1011903-2 = "(……백귀야행에서 열린 골목 상가 축제를 방문했다.)"
1011903-6 = "자자, 저희 가게 특제 소스로 볶은 야끼소바는 어떠신가요? 오코노미야끼도 있답니다!"
1011903-7 = "에비스 산 진짜 멜론 크림이 듬뿍 들어간 멜론빵 팝니다!"
1011903-8 = "치세 님이 맛보시고 극찬한 저희 가게 특제 솜사탕, 한 번 맛보고 가세요!"
1011903-12 = "잠시 후, 광장에서 피트니스 라쿠고 부의 공연이 있을 예정이니 모두 함께해 주세요."
1011903-13 = "라쿠고 한 편에 500칼로리를 소모할 수 있는 절호의 기회! 다이어트에도 효과적이랍니다."
1011903-17 = "(여러가지 길거리 음식과 공연을 감상하다 보니 어느새 훌쩍 저녁이 되어버리고 말았다.)"
1011903-18 = "(축제가 거의 끝났을 무렵, 골목 뒤편에서 자재를 정리하던 나구사와 마주쳤다.)"
1011903-23 = "아, [USERNAME] 선생님. 와주었구나."
1011903-24 = "오늘 축제는 즐겁게 즐겼어?"
1011903-25 = "[s] \"응, 덕분에 즐거운 시간을 보냈어.\""
1011903-29 = "[ns] \"그나저나 나구사는 축제장에서 얼굴을 보지 못한 것 같네.\""
1011903-30 = "응. 나는 가게 안쪽에서 꼬치를 굽고 짐을 나르느라 가게 밖으로는 거의 나가지 않았거든."
1011903-31 = "그래도 손님들이 내가 만든 요리를 맛있게 즐겨줘서 나름 보람찬 하루였어."
1011903-32 = "이렇게 보이지 않는 곳에서도 모두가 노력해 준 덕분에 이번 축제도 성공적으로 마무리할 수 있었겠지."
1011903-33 = "[s] \"하지만 나구사도 함께 축제를 즐겼으면 좋았을 텐데……\""
1011903-37 = "이야~ 오늘 정말 수고 많았어, 백화요란의 부장님!"
1011903-38 = "저기, 나는 백화요란의……"
1011903-39 = "응? 부장이 아니라 부부장이었던가? 아무래도 상관없어. 하하, 어쨌든! 나구사 쨩이 없었더라면 큰일 날 뻔했다니까……!"
1011903-40 = "축제를 앞두고 고기 굽기 당번이 독감에 걸려 드러누웠을 때는 이번 장사는 접어야 하나 걱정을 했었는데……"
1011903-41 = "나구사 양이 도와준 덕분에 멀리서 온 손님들을 실망시키지 않고 대접할 수 있었어."
1011903-42 = "게다가 이런 일이 처음이라고는 믿기지 않을 정도로 꼬치 굽는 솜씨가 능숙하던데. 어디서 전수를 받기라도 한 거야?"
1011903-44 = "글쎄. 평소에 꼬치구이를 자주 먹어본 덕분이려나."
1011903-45 = "전에 가게에서 먹어본 것만큼 잘 굽지는 못해서 오히려 부끄러운걸."
1011903-46 = "하하! 그 겸손한 태도까지…… 정말 마음에 든다니까!"
1011903-50 = "아 참, 내 정신 좀 봐. 그러고 보니 그 말을 전한다는 걸 깜빡했었네."
1011903-51 = "잠시 후에 축제를 마무리한 기념으로 가게에서 뒤풀이 모임을 가질 예정인데, 특별한 일정이 없다면 참가하는 게 어때?"
1011903-52 = "오랫동안 준비한 축제가 성공적으로 끝나서 그런지, 다들 잔뜩 들떠 있으니까!"
1011903-53 = "나구사 양이 와 준다면 분위기가 한층 더 달아오를 거야."
1011903-54 = "그렇다면…… 나는……"
1011903-58 = "……미안해. 오늘은 선약이 있어서 뒤풀이에는 가지 못할 것 같아."
1011903-59 = "그래? 그럼 아쉽지만 어쩔 수 없지."
1011903-60 = "대신 다음번에 시간이 나면 가게에 들려줘. 공짜 닭 꼬치를 잔뜩 준비해 놓을 테니까!"
1011903-61 = "응, 기대하고 있을게."
1011903-66 = "[ns] \"이후에 무슨 선약이 있었어?\""
1011903-67 = "그게 사실…… 약속 같은 건 없었어."
1011903-68 = "그냥 뒤풀이 장소에 가는 게 꺼려져서 거짓말을 한 것뿐이야."
1011903-69 = "[s] \"왜? 무슨 불편한 일이라도 있었던 거야?\""
1011903-70 = "아니, 전혀 그렇지 않아. 오히려 모임의 떠들썩한 분위기는 좋아하는걸."
1011903-71 = "다만…… 내 차가운 분위기는 화려한 모임에 어울리지는 않으니까."
1011903-72 = "나는 원래부터 말재간도 그리 좋지 못하고, 표정도 차가운 편이라 오해를 받는 일이 많았거든."
1011903-73 = "나는 사람을 즐겁게 하는 데 미숙하니까."
1011903-74 = "모두가 따듯한 분위기에 젖어 즐거운 시간을 보내고 있는데, 눈치 없이 내가 어울려서 자리를 망쳐버릴까 봐…… 그래서 거절한 거야."
1011903-75 = "[s1] \"글쎄, 다들 그렇게 생각하진 않을 것 같은데.\"\n[s2] \"나는 나구사와 함께 있으면 즐거운데?\""
1011903-77 = "?!!"
1011903-78 = "하, 하지만……"
1011903-79 = "[s] \"마음을 전하는 데에는 별다른 재주가 필요 없어.\""
1011903-83 = "[ns3] \"다소 말이 어눌하고, 표정이 차갑고, 오해가 있더라도……\"\n[ns4] \"같은 마음을 갖고 있다면 누구와도 즐거운 시간을 보낼 수 있을 거야.\""
1011903-88 = "……알겠어."
1011903-89 = "선생님, 미안하지만 먼저 자리를 비워도 괜찮을까?"
1011903-90 = "다시 상점가 사람들에게 가서 뒷풀이에 참가해도 좋을지 물어보고 올게."
1011903-91 = "[s] \"응, 조심히 다녀와.\""
1011903-94 = "(……나구사는 한결 가벼워진 발걸음으로 소란스러운 거리를 향해 달려갔다.)"
