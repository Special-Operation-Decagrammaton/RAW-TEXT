[translation]
10043020-1 = "제2화;역전하면 깨워주세요."
10043020-3 = "어쩐지 시작했을 때보다 더욱…… 여러 가지로, 많은 것이 뜨거워진 것 같습니다. 트레이너."
10043020-4 = "응원 열기라든가 분위기라든가, 환성, 환호…… 그런 것들이 말이죠."
10043020-5 = "[s] \"스포츠 경기니까 말이지.\""
10043020-6 = "……그렇군요."
10043020-7 = "어딘가, 조금 신기한 기분입니다."
10043020-11 = "[ns] \"어떤 게?\""
10043020-12 = "음…… 이런 것입니다."
10043020-15 = "평소에 저희 트레이닝부가 하는 것은, 일종의 훈련이나 단련 같은 것이죠."
10043020-16 = "유산소와 웨이트 트레이닝, 식단 관리를 중점으로, 최상의 결과를 도출하기 위해 생활 습관을 분석하고, 최적화된 스케줄을 확립하여……."
10043020-17 = "마침내는 자신이 원하는 목표, 바라는 신체 상태에 도달하는 것을 최종 목적으로 합니다."
10043020-20 = "거기에는 그야말로, 타인이 끼어들 여지가 없죠. 분석과 개인의 의지가 전부입니다."
10043020-21 = "물론 그 과정에서 다른 사람에게 도움을 요청하거나 도움을 받을 수는 있습니다만, 그것은 어디까지나 조언과 충고의 영역."
10043020-22 = "저희가 하고 있는 것은 어쩌면…… 현대 사회의 수도(修道) 같은 것인지도 모르지요."
10043020-23 = "어디까지나, 자기 자신과의 싸움입니다."
10043020-24 = "[s] \"심오하네…….\""
10043020-25 = "그런가요? 꽤 흔한 이야기라고 생각됩니다만."
10043020-29 = "화제를 되돌려서…… 하지만 팀 스포츠, 특히 이 야구는 그렇지 않군요."
10043020-30 = "규칙은 어느 정도 이해했습니다. 공을 쳐서 점수를 내고, 그 결과를 겨루는 경기라는 것도요."
10043020-31 = "그리고 그 과정에서 팀원들과의 적극적인 협동과 협력, 작전 수행, 지시 이행, 그러면서도 각 팀원의 개인기까지 발휘되어야 합니다."
10043020-32 = "……조화로운 광경이라고도 볼 수 있을 것 같습니다."
10043020-33 = "사람들이 왜 이 스포츠에 한마음이 되어서 열광하는지도, 알 것 같고요."
10043020-34 = "다만…… 그…… 뭐라고 말씀드려야 할까요."
10043020-35 = "이 현상을, '열광'이라는 단어로 한정 짓는 것이 과연 맞는지, 조금 의심이 들기 시작하기도 했습니다."
10043020-36 = "음. 일단 저희의 임무는 수상한 거동을 보이는 사람이 있는지 탐색하고."
10043020-37 = "그 사람이 혹시 범인과 관계가 있는지를 조사하는 것이겠습니다만……."
10043020-38 = "이래서야……. 그, 이런 말씀을 드리는 것도 조금 그렇습니다만."
10043020-39 = "……모든 사람이 수상해 보일 지경입니다……."
10043020-44 = "오늘도 저희 브레이브스를 응원해 주시기 위해 경기장을 몸소 방문해 주신 팬 여러분!"
10043020-45 = "진심으로 고맙습니다. 사랑합니다!"
10043020-52 = "사랑한다면 증거를 좀 보여 봐라!"
10043020-53 = "고마운 줄 알면 보답을 해 봐라!"
10043020-60 = "너 공 한 번 반으로 갈라 봐! 그게 야구공일 리가 없어!"
10043020-61 = "분명 테니스공이나 고무공이나 뭐 그런 걸 거야! 그렇지 않고서야 이렇게 얻어맞을 리가 없다고!"
10043020-67 = "어떻게 이 팀은 하라는 야구는 안 하고, 매일 새롭게 지는 법만 연구하냐!"
10043020-72 = "너희들이 응원해라! 우리가 야구할게!"
10043020-73 = "제발 해체해라! 오늘 지면 같이 죽자!"
10043020-79 = "……."
10043020-80 = "트, 특별히 심한 편은 아니에요……. 보통 이러기도 합니다……."
10043020-81 = "[s] \"야구라, 야구…….\""
10043020-82 = "트레이너. 이것은 정말로 응원이라는 단어의 정의에 부합하는 것일까요?"
10043020-83 = "아니면 제가 모르는 사이에, 응원이라는 단어에 새로운 뜻이 추가된 걸까요?"
10043020-84 = "[s1] \"아끼는 만큼 화를 내는 것이 아닐까…….\"\n[s2] \"소중하지 않으면, 화도 안 날 테니까…….\""
10043020-87 = "그렇다고는 해도 모든 일에는 정도가 있는 법인데……."
10043020-91 = "팬 여러분들의 성원에 보답하기 위하여, 경기 종료 후 사인회를 준비하였으며–"
10043020-93 = "사인 필요 없어! 그보다 이기기나 해! 그러고도 밥이 넘어가?"
10043020-94 = "이 경기에는 경고문을 붙여야 해! 허약자 및 심신미약자는 관람을 삼가라고! 근데 내가 그렇게 되게 생겼네!"
10043020-100 = "야! 투수! 그냥 가운데 던지라고, 가운데! 시원하게 던지고 안타 맞아! 그리고 다 같이 멸망하자!"
10043020-101 = "내가 정말 99도 아니고 100으로 장담한다! 이 팀은 솔직히 세상이 끝날 때까지 안 될 거야!"
10043020-102 = "진짜 내가 이렇게 자신 있고 확신하게 말한 적은 처음인 거 같은데, 아무튼 그래!"
10043020-108 = "죄송합니다. 조금, 지나가겠습니다……."
10043020-113 = "아앙? 넌 뭐야! 경기도 이 지경이라 화나는데! 마실 거나 줘 봐!"
10043020-114 = "하아…… 속만 터지는데 시원한 음료로 달래기라도 해야지……."
10043020-119 = "음료가 필요하시군요. 여기 있습니다."
10043020-126 = "푸헵?! 뭐야, 이거! 이 걸쭉하고 텁텁한 데다 살짝 계란 흰자 같은 맛까지 나는 이 음료는?!"
10043020-127 = "으윽, 속이 개운해지기는커녕 더 답답해졌어! 뭔가 부글거리면서 더부룩한 느낌까지 들어!"
10043020-129 = "정확한 평가 시군요. 바로 단백질 음료입니다."
10043020-130 = "유당과 지방을 제거해, 혹시 모를 유당불내증 및 칼로리 과다를 예방하고."
10043020-131 = "자극된 근육에 빠르게 아미노산을 공급할 수 있도록 흡수가 빠른 분리 유청단백질을 사용했답니다."
10043020-132 = "그렇다고는 해도 기본적으로는 단백질 위주의 음료이기에, 천천히 드시는 것을 추천해 드립니다."
10043020-133 = "너무 급하게 드시면, 아무리 유당과 지방을 제거했다고 해도, 약간의 소화 장애는 일으킬 가능성이 있거든요."
10043020-138 = "지금 시비 거는 거냐?! 누가 야구장에서 프로틴 음료를 찾아!!"
10043020-139 = "차라리 잘됐네! 공 던지는 것도 저 지경인데, 스트레스나 풀자고!"
10043020-144 = "……."
10043020-145 = "그렇지 않아도 흥분하고 있는 관객 중에서, 유독 더욱 흥분한 관객들……."
10043020-146 = "자기 팀 투수에게 차라리 직구를 던져 안타를 맞으라고 요구하는, 명백히 패배를 원하는 듯한 외침……."
10043020-147 = "몸에 좋은 단백질 음료를 제공해 드렸는데도, 호전적으로 나오는 태도……."
10043020-152 = "……뭐야, 이 녀석? 자기 혼자 뭐라고 중얼거리는데?"
10043020-157 = "트레이너."
10043020-158 = "이것은 분명, 범인이군요?"
10043020-162 = "[ns] \"왜 그런 결론인데?!\""
10043020-163 = "물론 이곳은 명백히 비정상적인 공간이 되어 가고 있습니다만."
10043020-164 = "이 사람들은 그중에서도 특별히 더욱 비정상적인 언행을 보여 주고 있었죠."
10043020-165 = "저희가 들었던 범인의 언행은 분명히 비정상적인 면모가 아주 강했고."
10043020-166 = "그렇다면 이 사람들이야말로, 범인임이 틀림없다는 결론이 나지 않을까요?!"
10043020-171 = "뭐라고 떠드는지는 하나도 모르겠다만."
10043020-172 = "너 오늘 잘 걸렸다! 진짜 다 날려버리겠어!"
10043020-177 = "그러면, 트레이너."
10043020-178 = "범인의 신변 확보로 들어가도록 하죠."
10043020-179 = "[s] \"괜찮을까? 이래도 정말 괜찮을까?!\""
10043020-180 = "저만 믿으십시오."
10043020-181 = "그리고 이 범인분들의 스트레스가 확실히 해소되도록……."
10043020-182 = "모든 것이 끝난 후에, 확실하게 1대1 개인 교습 트레이닝 코스를 플래닝해 드리도록 하겠습니다!"
10043020-183 = "[s] \"아니, 거기서 그건 또 왜.\""
10043020-187 = "네? 그야 한껏 운동하면서 땀을 흘리고 나면, 머릿속이 시원해지면서 스트레스가 풀리지 않나요?"
10043020-188 = "스트레스에 트레이닝보다 더 확실한 해결 방법은 없을 것 같은데요."
10043020-190 = "쫑알쫑알 떠들지 말고, 각오해라!"
10043020-191 = "화난 팬을 건드리면 어떻게 되는지, 확실하게 보여 주마!"
