[translation]
80000105-1 = "서로 간의 인식 차이"
80000105-3 = "……아, 찾았다."
80000105-7 = "여기 있었네, 선생님. 그러잖아도 찾고 있었어."
80000105-8 = "……응?"
80000105-9 = "아니, 뭐 대단한 일은 아니고. 중요한 일이긴 하지만."
80000105-10 = "……그럼 길게 이야기할 것도 없으니 본론으로 들어갈까."
80000105-19 = "[ns1] \"……혹시 이거 초콜릿?\"\n[ns2] \"발렌타인 데이……?\""
80000105-22 = "……역시 의외라는 표정이네. 예상은 했지만."
80000105-23 = "뭐, 선생님이 날 어떻게 생각할지는 대충 예상하고 있었으니까."
80000105-24 = "오히려 그렇기 때문에, 이 기회를 빌어 조금은 그 부분을 개선하고 싶었거든."
80000105-25 = "지금까지 이런저런 일로 감사해야 할 케이스도 많았고……."
80000105-26 = "그리고 나도……."
80000105-27 = "나도 뭐 딱히……. 선생님을 경계한다거나 싫어하는 건 아니니까……."
80000105-31 = "……쓸데없는 소리를 했네. 방금 건 넘어가 줘."
80000105-32 = "아무튼 말했던 대로 이건 우리 간의 인식 개선의 일환이니까, 나로서는 선생님이 기뻐해 주지 않으면 의미가 없어서 신경을 꽤 썼어."
80000105-33 = "마음에 들었으면 좋겠네."
80000105-34 = "[s3] \"물론이지. 굉장히 기쁜걸.\"\n[s4] \"와! 아오이의 발렌타인 초콜릿!!\""
80000105-40 = "그렇게 곧바로 대답을……."
80000105-41 = "……음? 답례로 커피라도 한 잔 사겠다고?"
80000105-42 = "거절할 이유는 없지만……. 뭐랄까, 생각보다 훨씬 더 흔쾌하네."
80000105-43 = "방금 전 초콜릿이 그렇게까지 효과가 있었던 거야? 아직 열어 보지도 않았는데."
80000105-44 = "우리 사이의 거리감은……."
80000105-45 = "[s5] \"……응? 무슨 거리감?\"\n[s6] \"그런 생각은 딱히 해 본 적 없는데?\""
80000105-48 = "…………?"
80000105-49 = "……음."
80000105-50 = "……으음……."
80000105-51 = "……후……."
80000105-52 = "그런 거였나……. 음……. 선생님……."
80000105-53 = "당신이란 사람은……."
80000105-54 = "[s7] \"……아오이? 괜찮아?\"\n[s8] \"무슨 고민이라도 있어?\""
80000105-57 = "…………."
80000105-58 = "뭔가……. 아주 조금이지만, 뭔가 나만 손해본 것 같은 기분이 들었어."
80000105-59 = "……응?"
80000105-60 = "고민이 있으면 말하라고? 얼마든지 들어줄 수 있다고……?"
80000105-65 = "……이제 알겠어."
80000105-66 = "내가 아니라 선생님이 나쁜 거였어."
80000105-67 = "[s] \"……네?\""
80000105-72 = "아, 아니, 혼잣말이야. 신경 쓰지 마. 그럼 난 다른 일이 있으니까……. 그, 그럼……."
80000105-79 = "(아오이는 어째서인지 우물쭈물하다가 급하게 돌아가 버렸다.)"
80000105-84 = "(……그와 별개로, 초콜릿은 굉장히 맛있었다.)"
