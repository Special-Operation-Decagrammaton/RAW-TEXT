[translation]
2004206-1 = "연하장"
2004206-2 = "밀레니엄 학습관 내 카페"
2004206-4 = "(연말 정산 업무차 밀레니엄을 방문하고 돌아가던 중……)"
2004206-8 = "(카페테라스에 앉아 무언가를 골똘히 생각하고 있는 마키를 발견했다.)"
2004206-9 = "으음, 으으음……"
2004206-10 = "[s1] \"안녕, 마키. 무슨 고민이라도 있어?\"\n[s2] \"빈 종이를 앞에 두고 무슨 생각을 그렇게 해?\""
2004206-13 = "아, 선생님. 밀레니엄에는 무슨 일이야?"
2004206-14 = "안 그래도 마침 잘 왔어!"
2004206-15 = "음…… 선생님은 어른이니까 연하장도 많이 받아봤겠지?"
2004206-16 = "[s3] \"꼭 어른이라고 연하장을 많이 받는 건 아니지만……\"\n[s4] \"샬레는 업무상 받는 연하장이 꽤 있지.\""
2004206-19 = "그거면 충분해!"
2004206-20 = "그동안 선생님이 받았던 수많은 연하장 중에……"
2004206-21 = "가장 인상적이었던 연하장은 어떤 거였어?"
2004206-22 = "[s] \"글쎄……\""
2004206-24 = "[ns] \"그런데 연하장은 갑자기 왜?\""
2004206-25 = "그게, 치히로 선배가 고등학생이 되었으니 올해부터는 한 해 동안 신세를 졌던 사람들에게 연하장을 직접 보내라고 이야기해서 말이야."
2004206-26 = "자주 가는 전자제품 가게의 사장님이라던가, 다른 동아리의 부장들이라던가……"
2004206-27 = "그런데 아무리 생각해도 안부를 전하기 위해 직접 손으로 편지를 써서 전하는 건 너무 비효율적이지 않아?"
2004206-28 = "평소에도 거의 메일로 안부를 주고받는데, 연하장은 굳이 손으로 써야 한다니."
2004206-29 = "[s5] \"물론 그렇게 생각할 수도 있겠지만……\"\n[s6] \"온라인으로는 전달할 수 없는 본심도 있는 법이니까.\""
2004206-32 = "어쨌든 그래서 나도 연하장을 쓰기 위해서 표지를 디자인하고 있는데."
2004206-33 = "뭔가 이렇다 할 예쁜 디자인이 좀처럼 떠오르질 않아서 말이야."
2004206-34 = "[s] \"예쁜 디자인의 연하장이라면 상점에서 많이 팔고 있던데.\""
2004206-35 = "그건 안 돼!"
2004206-36 = "그런 평범한 디자인으로는 다른 연하장에 묻혀 조금도 주목받지 못할 게 분명하잖아."
2004206-37 = "내키지는 않지만 연하장을 직접 쓰기로 한 이상 최고의 연하장을 써서 읽어보지 않고선 견디지 못하게 만들고 싶어!"
2004206-38 = "[s] \"훌륭한 의욕인걸.\""
2004206-39 = "그런데 연하장은 기본적으로 한 해에 있었던 일과 자신을 드러낼 수 있는 상징을 넣어야 한다고 하던데……"
2004206-40 = "올 한 해에 무슨 일이 있었는지 돌이켜 봐도 너무 많은 일이 있었어서 무엇을 꼽아도 올해를 대표하는 그림처럼 느껴지지가 않아."
2004206-41 = "선생님, 한 해에 있었던 일 중 어떤 것을 그려 넣어야 멋진 연하장이 될 수 있을까?"
2004206-42 = "[s7] \"연하장 디자인에 답은 없지만……\"\n[s8] \"연하장은 한 해의 안부와 추억을 공유하는 편지니까.\""
2004206-45 = "[ns] \"마키가 올해 겪은 일 중 가장 인상적이었던 추억을 그리면 어떨까?\""
2004206-46 = "가장 인상적이었던 추억이라면……"
2004206-47 = "으음…… 뭔가 떠오를지도."
2004206-52 = "잠깐만 기다려 봐, 선생님!"
2004206-61 = "완성이다!"
2004206-62 = "선생님, 어때? 이 연하장 디자인, 완전 인상적이지 않아?"
2004206-63 = "[s] \"멋진 디자인인걸.\""
2004206-65 = "[ns] \"그런데 어쩐지 어디서 본 것 같은 느낌이……\""
2004206-66 = "아, 그게 말이지……"
2004206-67 = "사실 이 문양은 선생님과 처음으로 그래피티를 했을 때 벽에 그린 문양이야. 기억나?"
2004206-68 = "올해 수많은 그래피티를 그렸지만, 역시 제일 인상적인 순간은 선생님과 함께 그래피티를 그렸을 때더라고."
2004206-69 = "그리 특별한 장소도, 특별한 디자인도 아니었지만 선생님과 함께했던 그 순간이 너무 즐거웠어서……"
2004206-70 = "그, 그러니까 특별히 선생님과의 추억을 과시하고 싶다는 뜻은 아니었지만!"
2004206-71 = "올해 선생님과 함께했던 모든 순간이 내게는 제일 인상적이었던 것 같아."
2004206-76 = "자, 선생님. 내 첫 번째 종이 연하장이야."
2004206-77 = "내년에도 잘 부탁할게!"
