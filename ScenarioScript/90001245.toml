[translation]
90001245-3 = "[ns] \"전원이 돌아왔어!\""
90001245-4 = "우왓, 눈부셔!"
90001245-5 = "[ns] \"누구 다친 사람 없어?\""
90001245-6 = "우린 괜찮아! 선생은?"
90001245-7 = "그래……. 다행이네."
90001245-10 = "아, 이 녀석! 거기 서라고~!"
90001245-11 = "으으, 뭔가 기분 나쁜 기계들이었어요……."
90001245-13 = "지금까지 상대해 왔던 데카그라마톤의 병력들과는, 어딘가 근본적으로 다르군요."
90001245-14 = "소체의 파편 같은 것이라도 남아 있다면, 분석을 시도해 볼 수도 있겠지만……."
90001245-15 = "그건 무리인 것 같아. 자기들끼리 모두 회수해서, 돌아가 버렸어."
90001245-16 = "그러고보니 어째서인지 승리했지만 승리한 것 같지 않다는 기분이 드는군요."
90001245-18 = "네……. 마치 게임에서, 적이 일부러 패배하고 돌아가는 튜토리얼 스테이지를 클리어한 느낌……."
90001245-19 = "그렇다면 경험치도 얼마 되지 않겠군요……. 획득 아이템이 없는 것도 그 때문일 거고요……."
90001245-21 = "저…… 아리스? 지금 이건 그런 문제가 아닌 것 같은데요……."
90001245-24 = "(그렇지만 그렇다는 것은……?)"
90001245-25 = "(이건, 일종의 탐색전 같은 것이었다는 뜻……?)"
90001245-28 = "……."
90001245-29 = "……!"
90001245-30 = "……!!!"
90001245-34 = "아인, 소프, 오르. 갑자기 왜 그러나요?"
90001245-35 = "저, 저, 저저저저, 저건, 방금 저건, 혹시……?!"
90001245-36 = "그, 그래……! 나 혼자 뭐 잘못 봤나 했지만, 아니었나 보네……!"
90001245-42 = "왜 저 둘이 여기에 있는 건가요–?!?!"
90001245-44 = "다음화;예측할 수 없었던 것"
