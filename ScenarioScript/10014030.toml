[translation]
10014030-1 = "제3화;재료는 모두 제각각이라도"
10014030-5 = "……어라? 선생님?"
10014030-6 = "[s] \"안녕, 아이리.\""
10014030-7 = "안녕하세요, 선생님! 여긴 어쩐 일로 오셨어요?"
10014030-8 = "뭐? 선생님?"
10014030-9 = "진짜네? 뭐야, 말도 없이 갑자기 무슨 일로 찾아온 거야?"
10014030-10 = "[s1] \"딱히 큰 이유는 없어.\"\n[s2] \"그냥 한번 들러 봤어.\""
10014030-11 = "흐응……. 그 거짓말 진짜야? 아무래도 믿기 어려운걸."
10014030-12 = "흐응……. 그 거짓말 진짜야? 아무래도 믿기 어려운걸."
10014030-13 = "용건이 있으면 그냥 바로 말하라고. 아무리 봐도 그냥 찾아온 분위기가 아니잖아."
10014030-14 = "……응? 뭐라고?"
10014030-15 = "우리야말로 무슨 일 없었느냐고……?"
10014030-16 = "……? 무슨 일? 그게 무슨 소리야, 갑자기? 뭐 일이라도 있어?"
10014030-17 = "저, 저희요!? 저희가 왜요!? 아, 아무 일도 없는데요……!?"
10014030-18 = "아, 아이리!? 왜 갑자기 화들짝 놀라고 그래?"
10014030-19 = "뭐, 뭔데? 무슨 일이야? 진짜 무슨 일이 있는 거야?"
10014030-20 = "……아무래도 서로의 주제가 일치하는 모양이네."
10014030-22 = "……나츠?"
10014030-24 = "보아하니 서로 간의 불필요한 뜸들이기는 그만둬도 될 거 같아."
10014030-25 = "우리가 걱정하는 것, 그리고 선생님이 걱정하는 것."
10014030-26 = "모든 걱정이 하나의 이정표를 향하고 있어. 우리의 사고가 도달하는 종착역은 다르지 않아."
10014030-27 = "……쿄야마 카즈사. 바로 그 이름 아래로 말이지."
10014030-28 = "나츠 쨩……."
10014030-29 = "……????"
10014030-30 = "뭐야? 무슨 소리야? 갑자기 카즈사가 왜??"
10014030-31 = "요, 요시미 쨩……. 어제도 있었던 일 있잖아. 그……. 혹시 기억 안 나는 거야?"
10014030-32 = "……어제?"
10014030-33 = "……아아. 그 싸움 난 거? 이상한 녀석이 찾아와서 결투니 선빵이니 해댔던 거?"
10014030-34 = "[s3] \"역시 그랬었구나.\"\n[s4] \"이미 다들 레이사와 만났구나.\""
10014030-35 = "……그래서 뭐? 그게 어쨌다고? 싸움이야 맨날 있는 일 아냐?"
10014030-36 = "……그래서 뭐? 그게 어쨌다고? 싸움이야 맨날 있는 일 아냐?"
10014030-37 = "성격도 불같은 녀석이니까. 분명 여기저기 싸울 애들도 많겠지. 자업자득이라고, 자업자득."
10014030-38 = "그러니 평소에 다른 친구들한테 잘 좀 하지 그랬냐고~."
10014030-39 = "[s5] \"……과연. 그런 분위기로 보였구나.\"\n[s6] \"다른 친구인가. ……대충 이해했어.\""
10014030-40 = "……? 뭐야. 또 왜 혼잣말이야?"
10014030-41 = "……? 뭐야. 또 왜 혼잣말이야?"
10014030-42 = "아니, 그게……. 요시미 쨩……."
10014030-43 = "아무래도 뭔가 좀 다른 느낌이었다고 해야 할까, 그걸 모르니까 걱정을……."
10014030-44 = "그러니까……."
10014030-48 = "……으으응. 아무것도 아니야, 요시미 쨩."
10014030-49 = "요시미 쨩은 지금 그대로가 더 좋은 거 같아."
10014030-50 = "……???"
10014030-51 = "……뭐지? 갑자기 열 받네?"
10014030-55 = "선생님이 이렇게 직접 찾아와서 우리에게 묻는다……. 혹시 이건 정보 교환을 원하는 것일까?"
10014030-56 = "평소와 다른 분위기, 뭔가 느껴지는 상황들……. 어쩌면 건드리면 안 되는 것을 건드리게 될지도 모른다는 느낌의 불안감."
10014030-57 = "아니. 나는 선생님이 그런 의도로는 이 일에 대해 접근하진 않을 거라고 생각해."
10014030-58 = "어쩌면 그것이……. 본인 스스로 원하지 않는, 불탄 동전의 뒷면일 수도 있고 말이지."
10014030-59 = "그렇다면 선생님은 어째서 우리를 찾아와 굳이 이렇게 떠 보고 있는 것일까."
10014030-60 = "어쩌면 그건……."
10014030-61 = "……역시 카즈사가 아니라 '우리' 쪽을 확인하고 싶었던 거야. 선생님은 그런 사람이니까."
10014030-62 = "[s7] \"그리고 문제없다.\"\n[s8] \"괜찮아 보여서 다행이야.\""
10014030-63 = "아하하……. 그야, 카즈사 쨩은 어떤 일이 있어도 카즈사 쨩이니까요."
10014030-64 = "아하하……. 그야, 카즈사 쨩은 어떤 일이 있어도 카즈사 쨩이니까요."
10014030-65 = "저희는 그 우자와 레이사 라는 사람이 누군지 잘 모르지만……."
10014030-66 = "그, 뭔가 두 사람 사이에 저희가 모르는 일들이 조금 있다 해도……. 달라질 건 없다고 생각해요."
10014030-67 = "그렇고말고. 우리의 결속이 흔들리는 일 같은 건 없었고, 앞으로도 없을 테니까."
10014030-68 = "재료 간의 다른 질감, 원산지 정도로 다른 길을 가야 한다면 '디저트'는 영원히 완성되지 않는다고."
10014030-69 = "그걸 다른 곳도 아닌……. 방과후 디저트부인 우리가 그걸 모를 리는 없다는 거지."
10014030-70 = "오히려……. 혹시 저희가 카즈사 쨩에게 해줄 수 있는 게 있다면, 언제든 연락해 주세요."
10014030-71 = "저희도 선생님만큼이나 카즈사에 대해 걱정하고 있으니까요!"
10014030-74 = "……뭐지? 아까부터 분위기가 왜들이래?"
10014030-75 = "요 며칠 그거 싸움 좀 했다고 되게 유난들 떠는 것 같은데……."
10014030-76 = "살다 보면 좀 그럴 수도 있지. 애들은 원래 싸우면서 크는 거야. 싸우면서."
10014030-77 = "[s9] \"실례지만 두 분은 같은 나이신데요.\"\n[s10] \"요시미가 말하니 감회가 새롭네.\""
10014030-78 = "뭘 또 거기다가 태클을 걸고 앉았어!! 말이 그렇다는 거잖아, 말이!!"
10014030-79 = "뭘 또 거기다가 태클을 걸고 앉았어!! 말이 그렇다는 거잖아, 말이!!"
10014030-80 = "참, 나. 누가 들으면 카즈사가 대단한 싸움꾼이라도 되시는 줄 알겠네."
10014030-81 = "하여간! 선생님도 선생님이야!"
10014030-82 = "별것도 아닌 걸로 그렇게 호들갑을 떠니까……."
10014030-86 = "……? 응? 뭐야, 이게?"
10014030-87 = "선생님. 무슨 사진 떨어졌는데."
10014030-88 = "[s] \"아, 그거…….\""
10014030-90 = "[ns11] \"잠깐 멈춰-!!\"\n[ns12] \"보면 안 돼!\""
10014030-91 = "??? 뭐? 보면 안 된다고? 뭔데?"
10014030-92 = "??? 뭐? 보면 안 된다고? 뭔데?"
10014030-93 = "어라……. 이 사진……. 여기 이 사람……."
10014030-95 = "롱코트에 내리깐 눈빛. 턱으로 내린 마스크까지……. 영락없는 '조직' 사람이로군."
10014030-96 = "……? 잠깐. ……얼굴이……."
10014030-97 = "얼굴? 무슨 얼굴? ……어."
10014030-98 = "……어……."
10014030-105 = "어어어어어엉-!?!?"
