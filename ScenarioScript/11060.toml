[translation]
11060-2 = "제6화;구출 작전!"
11060-3 = "세리카의 방"
11060-4 = "(딩동-)"
11060-5 = "세리카 쨩? 세리카 쨩 있어?"
11060-7 = "(딩동- 딩동-)"
11060-8 = "세리카 쨩-? 왜 전화도 안받고……."
11060-9 = "비상 열쇠가 어디 있더라……."
11060-11 = "(철컥)"
11060-12 = "세리카 쨩……? 아직 안돌아 온 거야?"
11060-13 = "……한번도 이런 일은 없었는데."
11060-14 = "서, 설마……!!"
11060-16 = "세리카 쨩 전화는요?"
11060-17 = "……안돼요. 몇 시간 전부터 계속 끊겨 있어요."
11060-18 = "라멘집에서는 정시에 퇴근했다고 했고 그 이후에 집에 돌아오지 않았다는 건가."
11060-19 = "이렇게 늦게까지 집에 돌아오지 않은 적은 없었는데……."
11060-20 = "설마…… 헬멧단 놈들인가."
11060-21 = "네?! 헬멧단이 세리카 쨩을……?!"
11060-22 = "일단은 기다려보자. 호시노 선배와 선생님이 알아보러 갔으니까."
11060-23 = "……."
11060-25 = "(덜컥)"
11060-26 = "자아, 기다렸지?"
11060-27 = "호시노 선배! 선생님!"
11060-28 = "[s] \"다녀왔어.\""
11060-29 = "어떻게 된 거야, 선배?"
11060-30 = "선생의 권한으로 총학생회가 관리하는 중앙 통신망에 접속할 수 있었어."
11060-31 = "중앙 통신망에……. #n선생님의 권한은 그런 것까지 가능하구나……."
11060-32 = "으헤~ 물론 몰래 접근한 거야. 들키면 시말서 써야 할걸?"
11060-33 = " 네?! 괘, 괜찮은 거예요, 선생님?"
11060-34 = "[s1] \"괜찮아. 세리카의 안전을 위해서라면.\"\n[s2] \"안들키면 돼.\""
11060-35 = "선생님……."
11060-36 = "그, 그렇긴 하지만……"
11060-37 = "……"
11060-38 = "……네."
11060-39 = "감사합니다. 선생님."
11060-40 = "통신이 끊기기 전의 세리카 쨩의 휴대폰 위치는 여기로 나오고 있어."
11060-41 = "여기는……. 사막화가 진행되고 있는 시내 변경이잖아요?"
11060-42 = "아무도 살고 있지 않은 폐허 구역……. #n치안을 포기한 지역이라 온갖 무법자들이 몰려 있는 곳이야."
11060-43 = "이 지역, 저번에 학교 위험요소 연구분석 때 #n카타카타 헬멧단의 주력이 머물고 있는 곳으로 확인되었어요."
11060-44 = "그렇다는 건…… 역시 카타카타 헬멧단의 짓……!!"
11060-45 = "과연, 퇴근 길의 세리카를 납치해서 자신들의 아지트로 끌고 간 거로군."
11060-46 = "학교 습격 정도로는 성에 차지 않으니 인질을 확보해서 협박하겠다는 건가."
11060-47 = "그런 계획 같은 건 아무래도 좋아요! 지금 당장 세리카 쨩을 구하러 가야죠!!"
11060-48 = "아아. 물론이야."
11060-49 = "자아, 그럼 가볼까."
11060-50 = "[s] \"출발!\""
11060-53 = "(덜컹, 덜컹)"
11060-54 = "으, 으응……."
11060-55 = "…… 으?"
11060-56 = "(벌떡) ?!"
11060-57 = "여, 여긴 어디야?! 나, 납치당한 거야?!"
11060-58 = "아, 으……. 머리가……."
11060-59 = "(덜컹, 덜컹)"
11060-60 = "여기는…… 트럭 안……?"
11060-61 = "헬멧단 녀석들, 날 어디로 데려가고 있는 거지……."
11060-62 = "캄캄하지만 문틈 사이로 약간 빛이 새어나오고 있어."
11060-63 = "어디…… 밖을 볼 수 있으려나."
11060-64 = "……사막…… 철길?!"
11060-65 = "철길이 있는 곳이라면…… 서, 설마 여기는 아비도스 외곽의 사막?"
11060-66 = "……아, 안돼. 여기라면 어떠한 연락도 닿지 않는 황무지잖아! #n여기서 탈출해도 대책위원회에 연락할 방법이 없어……."
11060-67 = "어떡하지. 분명 모두들 걱정할 텐데……."
11060-68 = "……."
11060-69 = "……이대로 황무지 어딘가에 파묻으려는 계획인가. 아무도 나를 찾을 수 없게?"
11060-70 = "연락이 끊기고…… 나도 다른 학생처럼 마을을 떠났다고 생각하겠지……"
11060-71 = "배신했다고 생각하려나……."
11060-72 = "그런 오해를 풀지도 못하고, 모두를 보지 못한채 죽는다니……."
11060-73 = "싫어, 그런 건……."
11060-74 = "………."
11060-75 = "으…… 으그으……"
11060-76 = "흐흑……."
11060-77 = "(콰아아아아아아앙--!!)"
11060-78 = "우, 우와아아앗?!"
11060-80 = "(콰당탕-!)"
11060-81 = "켁, 쿨럭…… 쿨럭……."
11060-83 = "뭐, 뭐야?! 폭발?! 달리던 트럭이 폭발했다?!"
11060-84 = "포탄이라도 날아온 거야? 어, 어디서?"
11060-85 = "세리카 쨩 확인되었습니다! 찾았어요!!"
11060-86 = "아, 아야네?!"
11060-87 = "나도 확인했어!! 울고 있는 세리카를 찾았어!"
11060-88 = "?!"
11060-89 = "뭐?! 우리 아가씨가 울고 있었어? 우리가 보고싶어서 운 거야? #n이 엄마는 그런 줄도 모르고!!"
11060-90 = "으, 으아아?! 시끄러!! 안 울었어, 안 울었다고!!"
11060-91 = "거짓말이야! 내가 울고 있는 거 똑똑히 봤어!"
11060-92 = "울지 마요, 세리카 쨩! 우리가 왔으니까, 그 눈물을 닦아줄 테니-!"
11060-93 = "아 진짜 시끄럽네!! 아니라면 아닌 줄 알아! 좀!! 닥쳐-!!"
11060-94 = "[s] 다행이라고 말한다."
11060-95 = "뭐야, 서, 선생님까지?! 어떻게 여기까지 찾아온 거야?!"
11060-96 = "[s3] \"스토커니까.\"\n[s4] \"납치된 공주님을 구하는 건 용사의 역할이니까-!\""
11060-97 = "무, 무슨 소릴 하는거야! 변태 선생이!!"
11060-98 = "바……, 바……!"
11060-99 = "바보 아냐?!"
11060-100 = "뭐라는 거야!! 제 정신 아니지?! 죽여버린다? 누, 누가 공주라는 거야!!"
11060-101 = "으헤, 건강한 거 같네. 무사히 확보 완료했어."
11060-102 = "다행이야……. 세리카 쨩…… 난 세리카 쨩이 어떻게 되는 줄 알고……."
11060-103 = "아야네 쨩……."
11060-104 = "아직 안심하긴 일러. 전술지원시스템으로 트럭을 제압하긴 했지만 #n여전히 여기는 적진 한가운데야."
11060-105 = "그렇지. 인질 수송 차량이 파괴되었으니 이제 파리떼들이 몰려들거야."
11060-106 = "전방에 카타카타 헬멧단 병력 다수 확인!!"
11060-107 = "그리고 거대한 중화기도 다수 확인되었습니다! #n조금씩 포위망을 구축하고 있어요!"
11060-108 = "나이스 타이밍……은 아니지만. #n자, 그럼 저 녀석들을 뚫고 돌아가 볼까?"
11060-109 = "……조심해, 저 녀석들, 개조된 중전차를 가지고 있어."
11060-110 = "그래. 알고 있어. Flak 41 개량형이지."
11060-113 = "자……."
11060-117 = "가볼까."
