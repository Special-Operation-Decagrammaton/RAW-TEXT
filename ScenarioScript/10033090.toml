[translation]
10033090-1 = "제9화;이 축제는 우리의 것이다!"
10033090-3 = "지금 뭘 하려는 건가요!!!!!"
10033090-9 = "뻔하잖아! 이 신목제를…… 우리 망량즈의 손으로 되찾을 거야!"
10033090-10 = "신목제는 1년에 한 번만 이루어지는 축제이자, 백귀야행의 평화와 안녕을 비는 축제……."
10033090-11 = "그런 축제에! 아무리 초대받았다고는 해도 외부인이 끼어드는 건 싫어!"
10033090-12 = "[ns] \"……구체적으로 뭘 어떻게 하려는 거야?\""
10033090-13 = "후후후……. 듣고 놀라지나 말라고. 우는 아이도 놀라 울음을 그칠 만큼, 무시무시한 데다 치밀하고 위대하기까지 한 계획을 세워 왔으니까……."
10033090-14 = "그건 바로!"
10033090-16 = "바, 바로……?"
10033090-17 = "신목제의 최대 클라이맥스라고 할 수 있는! 저녁 불꽃놀이에 사용될 초대형 폭죽들을……!"
10033090-19 = "밝은 대낮에! 전부 터트려 버릴 거야!"
10033090-21 = "네에……?"
10033090-22 = "후후후……. 이거야말로 <저녁의 어두운 하늘에서 터져야 가장 예쁘게 보이는 불꽃을, 밝은 대낮에 터트려서 아무 감흥도 느끼지 못하게 만들자! 계획>……."
10033090-23 = "어때? 무섭지? 엄청나지? 대단하지? 이 무시무시한 데다 치밀하고 위대하기까지 한 계획 앞에, 겁먹어서 말도 안 나오지???"
10033090-30 = "……."
10033090-31 = "……."
10033090-32 = "[ns] \"…….\""
10033090-33 = "뭐야! 그 뜨뜻미지근한 시선은!"
10033090-37 = "서, 설마 우리가 지레 겁먹어서 이 무시무시한 계획을 차마 실행하지 못할 거라고 무시하는 거야? 그런 거라면 잘못 봤어! 우리 망량즈는 말이지! 망량즈는……!"
10033090-41 = "……어쨌거나 엄청 대단하고 무서운 문제아들이니까 말이야! 얕보지 말라고!"
10033090-42 = "[s] \"오히려 그런 대사야말로 얕보이기 딱 좋지 않을까?!\""
10033090-43 = "그냥 그렇다면 그런 줄로 알라구웃!!"
10033090-45 = "뭔가 갑자기 시끄러워졌는데?"
10033090-47 = "잘 모르겠지만, 이것도 공연인가?"
10033090-48 = "그러고 보니 백귀야행에는 와라쿠 공주님이었나? 관객이 직접 참여하는 공연이 있다고도 들었는데. 이것도 그 비슷한 거 아닐까?"
10033090-49 = "의외로 자세하네, 너."
10033090-50 = "아무튼 뭐, 기다려 보자고. 뭔가 하겠지."
10033090-52 = "……."
10033090-59 = "에리카 쨩. 에리카 쨩."
10033090-60 = "음……. 역시 이거, 그런 거겠지?"
10033090-61 = "응, 아마. 그런 거겠지."
10033090-62 = "어떡할래? 선생님 쪽으로?"
10033090-63 = "응. 우미카 쨩에게 가 보자."
10033090-70 = "그만! 멈춰 주세요! 예정에서 벗어나는 일은, 더 이상 용납할 수 없습니다!"
10033090-71 = "불꽃놀이는 때와 시간에 맞춰, 정확히 저녁에 이루어져야 해요!"
10033090-72 = "그래서 바로 그 불꽃을! 우리가 지금 여기에서 터트려 버리겠다는 거라고!"
10033090-74 = "훗훗훗……. 그야말로 하나만 알고 둘은 모르는 발언이네!"
10033090-75 = "그렇습니다! 이번 불꽃놀이에 쓸 불꽃은! 보통의 신목제와는 다르게! 미리 준비해 두지 않고 저녁 시간에 맞춰 운반해 오기로 했답니다!"
10033090-77 = "뭐, 뭐라고?! 그건 약속이, 아니 원래 형식과 다르잖아! 치사하다!"
10033090-78 = "?!?!"
10033090-80 = "어라? 우미카? 표정이 왜 그런가요?"
10033090-81 = "그게…… 그게……!"
10033090-83 = "어라, 리더? 저기 왠지 모르게 불꽃 더미가 놓여 있는데요……?"
10033090-85 = "어떻게 된 거야–?"
10033090-86 = "(그런……! 내가, 내가 멋대로, 이번에야말로 일정을 맞추겠다는 생각에, 불꽃 더미를 미리 옮겨온 것이 이렇게……?)"
10033090-90 = "절대로! 안 됩니다, 망량즈!"
10033090-91 = "게헨나 학생분들을 위해서라도, 선생님을 위해서라도…… 저는 신목제를 지키겠습니다!"
10033090-92 = "절대로, 절대로 불꽃에는 손끝 하나 대지 못하게 할 테니까요!"
10033090-93 = "지, 진정하는 겁니다, 우미카!"
10033090-94 = "으, 어, 저기. 괜찮을까? 여기에서 우당탕 와당탕 해도 되는 걸까? 신목제인데? 광장인데?"
10033090-96 = "……할 때는 해야 해. 그러지 않으면…… 더 큰 일이 생겨."
