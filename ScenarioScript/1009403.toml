[translation]
1009403-1 = "메이드의 요리!"
1009403-2 = "어서 와, 선생님! 기다렸어!"
1009403-3 = "후후후…… 기대하시라. 이번에야말로 메이드 사이바 모모이의 진가를 보여 줄 테니까!"
1009403-4 = "[ns1] \"그런 모모이에게 질문!\"\n[ns2] \"기대되면서 불안하다고 하면 어쩔 생각입니까!\""
1009403-7 = "여행자여. 이런 말이 있지."
1009403-8 = "미지에 대한 공포와 기대야말로…… 모험의 꽃인 거라고!"
1009403-9 = "어, 어? 또 어디에서 적당히 그럴듯한 말 가져다 붙인 것 같다고? 아니거든!? 맞는데 아무튼 아니거든?!"
1009403-10 = "아무튼…… 앞서 말한 대로, 메이드의 중요한 임무 중 하나는 식사 준비!"
1009403-11 = "그리고 메이드가 준비한 식사라면 역시 코스 요리지!"
1009403-12 = "그러니까 오늘은 내가 선생님에게 코스 요리를 대접해 줄게."
1009403-13 = "우선 가장 먼저 준비한 것은…… 이거야!"
1009403-14 = "[s] \"보라색…… 주스?\""
1009403-15 = "그러하다. 무엇을 숨기랴. 이것이야말로 '식전 주스'라 불리는 음료!"
1009403-16 = "들어 봐, 선생님. 코스 요리에는 식전 주스라는 게 있대. 입맛을 북돋워 주는 역할을 한다더라!"
1009403-17 = "그 조건은 정확히는 모르겠지만……."
1009403-18 = "아무튼 뭔가 달콤한 것이라는 것 같아!"
1009403-19 = "그래서 <리자드맨의 포도주스>를 준비해 왔어!"
1009403-20 = "[s3] \"아니, 포도주스면 포도주스지…….\"\n[s4] \"리자드맨의 포도주스는 뭐야?\""
1009403-23 = "훗. 훗. 훗……. 그렇게 물어볼 줄 알았어."
1009403-24 = "이건 보통의 포도주스와는 달라!"
1009403-25 = "무엇보다 독 저항을 증가시키고 물속에서 숨을 쉴 수 있게 해 주거든!"
1009403-26 = "[s] \"정말이야?!\""
1009403-27 = "……그렇다고 게임 스크립트에 쓰여 있었어."
1009403-28 = "뭐, 뭐야! 그 실망하면서도 그럴 줄 알았다는 표정은!"
1009403-29 = "덧붙여 리자드맨의 생활사(?)를 다룬, <믿음직한 리자드맨 메이드>가 그렇게 수작이래."
1009403-30 = "나는 아직 읽어 본 적도, 구한 적도 없지만!"
1009403-34 = "(모모이의 거창한 소개와는 대조적으로, 그럭저럭 평범한 포도 주스였다…….)"
1009403-36 = "다음은 수프야! 소화기관을 깨우고, 위에 신호를 준대!"
1009403-37 = "그래서…… 쇠고기 수프 통조림을 준비했어!"
1009403-38 = "[s] \"다 좋은데 왜 통조림이야?\""
1009403-39 = "그건 말이지…… 우선 이건 보통 쇠고기 수프 통조림이 아니야."
1009403-40 = "장기간 보관이 가능하기에 여행자의 식량 공급원으로, 연유와 비견될 만큼 중요하게 여겨지는 것이니까!"
1009403-41 = "덧붙여서 에너지를 회복시키는 대신 수분량을 감소시키는 효과가 있다고 해!"
1009403-42 = "[s] \"에너지는 또 뭐고, 수분량은 왜 감소시키는 건데…….\""
1009403-43 = "어, 그, 그건 그러니까……."
1009403-44 = "세상이 대충 망한 다음 찾아오는 포스트 아포칼립스 세계관 작품에서 장기적으로 먹을 수 있는 게 통조림뿐이어서?"
1009403-45 = "그런 게임 스크립트냐고? 마, 맞긴 하지만 그래도 말이지!"
1009403-46 = "아직 이 쇠고기 수프 통조림의 대단한 점은 끝나지 않았거든? 설정적 고증을 확실하게 하기 위해서……."
1009403-47 = "수프를 있는 힘껏 졸여서, 수분량을 최대한 감소시켜 뻑뻑하게 만들었으니까!"
1009403-50 = "(수프의 맛은 그럭저럭이었지만.)"
1009403-51 = "(너무 뻑뻑해지고 소금 맛이 강해진 나머지, 진짜로 목이 말랐다…….)"
1009403-53 = "다음은, 드디어 고대하던 메인 디시야!"
1009403-54 = "이번에 준비한 것은…… 놀라지 마시라."
1009403-58 = "바로, 엄청난 오야코동이야!"
1009403-59 = "이 오야코동으로 말할 것 같으면…… 최대 HP와 획득 경험치가 증가하고, 아이템 습득 확률이 두 배가 되는 요리거든?"
1009403-60 = "심지어 히든 레시피여서, 전망 공원에서 사람들이 식사하는 모습을 관찰해야 한다는 조건을 클리어해야 해!"
1009403-61 = "훗. 훗. 훗. 여기에서 가장 중요한 것은 아이템 습득 확률 두 배 버프라고 할 수 있지."
1009403-62 = "이 버프를 받지 않고 파밍을 한다는 것은, 그야말로–"
1009403-63 = "[s5] \"그럼 이걸 먹고 복권이라도 사면…….\"\n[s6] \"당첨 확률이 올라가기라도 하는 거야……?\""
1009403-66 = "……거기까지는 모르겠지만, 한 번 시도해 봐도 좋지 않을까?"
1009403-67 = "어? 안 되면 내 책임으로 하겠다고? 선생님이 학생에게 책임을 전가할 셈이냐–!"
1009403-70 = "(다행히도 부드럽고 맛이 좋은 오야코동이었다.)"
1009403-72 = "이제 드디어 디저트야!"
1009403-73 = "마지막 디저트로 준비한 것은…… 음! 이거야말로 기대해도 좋아!"
1009403-74 = "정말로 잊을 수 없는 디저트를 준비했거든."
1009403-75 = "그것은 바로…… 뒤틀린 황천의 타락한 석탄케이크!"
1009403-76 = "[s7] \"이름이 뒤숭숭해!\"\n[s8] \"애초에 뒤틀린 황천이란 게 뭔데?\""
1009403-79 = "어? 그, 그건 나도 잘 모르겠는데……?"
1009403-80 = "하지만 뭔가 엄청나 보이지 않아?"
1009403-81 = "특히 이 새까맣고 뒤틀린 것 같은 디저트의 외관에 뭔가 어울리는 느낌이……."
1009403-82 = "[s] \"세상에는 보기 좋은 떡이 맛도 좋다는 말도 있어…….\""
1009403-83 = "그, 그건 그렇지만!"
1009403-84 = "맛만 좋다면 어떻게든 되는 게 아닐까?"
1009403-87 = "(그 불길한 이름에 뭔가 불안한 느낌이 들었지만…….)"
1009403-88 = "(의외로, 평범한 다크 초콜릿 케이크였다.)"
1009403-90 = "어때, 어때. 선생님? 다 먹은 감상을 들려줘!"
1009403-91 = "뭔가 버프가 걸리거나, 강해졌거나, 레벨이 올라간 것 같은 느낌이 들지 않아?"
1009403-92 = "어? 그건 잘 모르겠지만, 여러 가지로 내 수완을 본 것 같았다고?"
1009403-93 = "헤헹! 뭘 좀 아는구나, 선생님! 사람 보는 눈이 있네!"
1009403-97 = "우왓, 비닐봉지가 쓰러져서 안에 담은 것들이……."
1009403-98 = "이게 뭐냐고? 그, 그러니까 이건."
1009403-99 = "너무 많이 사 와서 남아 버린 편의점 음식들이야……"
1009403-100 = "어떡하지, 선생님? 게임개발부에는 냉장고가 없는데……."
1009403-101 = "아, 맞아! 오늘 만든 코스요리 메뉴를 정식으로 특허 출원해서 특허료를 받고, 그걸로 냉장고를 구입하는 건–"
1009403-102 = "[s] \"네. 기각.\""
1009403-103 = "어째서–?!"
1009403-105 = "(그 뒤로 모모이와 함께, 남은 편의점 음식의 뒤처리 방안을 고민해 보았다.)"
1009403-106 = "(결국 어떻게든 전부 처리하는 데 성공하기는 했지만.)"
1009403-107 = "(양이 너무 많았던 나머지, 둘 다 한참이나 고생을 하고 말았다…….)"
