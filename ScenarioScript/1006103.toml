[translation]
1006103-1 = "트렌드 따라잡기"
1006103-3 = "(샬레의 업무용품을 구입하기 위해 잠시 상점가로 나왔다.)"
1006103-4 = "(여러 가게들이 늘어선 가운데, 액세서리 가게 앞에서 쇼윈도를 보고 있던 사쿠라코를 발견했다.)"
1006103-8 = "으음……. 음……."
1006103-12 = "흐음. 이건……. 음. 아니에요, 역시……."
1006103-13 = "……끄응."
1006103-14 = "[s1] \"안녕, 사쿠라코.\"\n[s2] \"여기서 뭐 하고 있어?\""
1006103-19 = "……!? 으, 으음!? 아. 서, 선생님!? 펴, 평안하신지요……!!"
1006103-20 = "……네? 저 말인가요?"
1006103-21 = "저, 저는 그저 이 주변을 마침 지나던 길……에……."
1006103-22 = "조금 신경 쓰이는 게 있어, 가게 안의 물건들을 살펴보고 있었습니다. 네."
1006103-23 = "실은 이 베일이라든가……. 쓰고 있는 액세서리를 좀 교체해 볼까 해서요."
1006103-27 = "아. 딱히 그런 쪽에 취미가 있다던가, 그런 것은 아닙니다."
1006103-28 = "그보다는 뭐랄까……."
1006103-29 = "그……. 어떻게 들리실지는 모르겠지만……."
1006103-36 = "그, 그런 거 있지 않나요? 다들 하는데 저만 안 하면……."
1006103-37 = "좀 뒤떨어진다고 해야 하나……. 그런 느낌……."
1006103-38 = "[s3] \"아아. 알지, 알지.\"\n[s4] \"트렌드의 이야기?\""
1006103-41 = "저는 평상시에 늘 성당 안에 있고, 바깥으로 나가는 일들은 주로 다른 자매님들이 해 주십니다."
1006103-42 = "저도 함께하고 싶을 때가 많지만,"
1006103-43 = "아무래도 누군가는 계속 남아서 관리 업무를 해야 하니까요."
1006103-44 = "그러다 보니 자연스레 바깥세상이 돌아가는 것에 대해서 조금 둔해지고."
1006103-45 = "다른 자매님들이 해주시는 말씀을 토대로, 나름대로 상상해서 이해하는 수밖에 없답니다."
1006103-46 = "물론 가끔은, 그 상상이 조금 사실과 다르게 되는 경우도 있는 거 같지만 말이에요."
1006103-50 = "그……."
1006103-51 = "아침에 보내 드렸던 모모톡처럼……."
1006103-52 = "[s5] \"그, 그렇군. 그럴 수도 있지…….\"\n[s6] \"괜찮아. 나름대로 신선했어.\""
1006103-55 = "후. 말씀에서 배려심이 느껴지는군요."
1006103-56 = "감사합니다, 선생님."
1006103-57 = "아무튼 그래서, 뭐라도 좋으니 액세서리를 하나 골라보려고 하는데……."
1006103-58 = "혹 선생님께서는 요즘 유행하는 디자인이라든가, 알고 계시나요?"
1006103-59 = "알고 계시다면 부디 저에게 가르침을 주실 수 있을까요?"
1006103-63 = "아. 그렇습니까."
1006103-64 = "하긴, 선생님도 업무로 바쁘신 몸이시니."
1006103-68 = "실례했습니다."
1006103-69 = "선생님의 귀하신 시간을 이 이상 뺏을 수는 없으니, 여기선 제가 스스로……."
1006103-76 = "손님? 아까부터 계속 쇼윈도를 보고 계신데, 혹시 찾으시는 거라도 있으실까요?"
1006103-77 = "아, 아아. 방해가 됐다면 죄송합니다."
1006103-78 = "단지, 잘 고르지 못하고 있었을 뿐이라……."
1006103-79 = "보다시피 이런 쪽에는 조예가 좀 부족해서요."
1006103-83 = "……아하!"
1006103-85 = "그런 거라면 걱정하지 마십시오!"
1006103-90 = "제가 손님께 완벽히 어울리는 상품을 찾아드리겠습니다!"
1006103-95 = "우선 안으로 드실까요? 뭐든 잘 어울리시겠지만, 손님을 보니 특별히 떠오르는 물건이 많네요!!"
1006103-96 = "예? 예? ……어, 자, 잠시만요? 으음……!?"
1006103-101 = "으, 으에……!? 으에에에에-!?!?"
1006103-106 = "[ns7] 혼자 두면 안 될 것 같으니 따라간다.\n[ns8] 귀여울 것 같지만 곤란해하니 따라간다."
1006103-114 = "(사쿠라코와 가게 주인을 따라 안으로 들어갔다.)"
1006103-121 = "(주인에게 여러 가지 물건을 제안받아 곤란해하며 울상 짓던 사쿠라코를 데리고 나왔다.)"
1006103-126 = "후우. 정말 굉장한 하루였군요……."
1006103-127 = "오늘은 정말, 여러모로 감사했습니다, 선생님."
1006103-128 = "선생님께서 안 계셨다면……. 상상만 해도 무섭군요."
1006103-129 = "역시 세상을 따라잡는다는 건, 보통 일이 아닌 모양입니다. 굉장히 어렵습니다."
1006103-130 = "……네? 굳이 따라갈 필요는 없지 않겠느냐고요?"
1006103-131 = "그, 그런……. 그치만 저는 시스터인데, 다른 분들을 이해하려면 충분히 숙지하는 게……."
1006103-132 = "[s9] \"한결같은 쪽이 좋을 때도 있어.\"\n[s10] \"위안과 의지가 되는 곳은 그런 곳이니까.\""
1006103-135 = "선생님……."
1006103-136 = "후후. 후후후."
1006103-137 = "알겠습니다. 그렇게 말씀해 주시니 저도 조금은 마음이 편해지는 것 같네요."
1006103-138 = "이것 참, 마지막까지 도움만 받는군요. 시스터가 돼서는 다른 분께 도움받기만 하고……. 부끄러운 일입니다."
1006103-139 = "…………."
1006103-140 = "하지만……. 동시에 그렇게 썩 싫지만은 않은 느낌입니다."
1006103-141 = "어째서일까요? 분명 스스로의 부족함이 거듭 드러나는 하루인데도……."
1006103-142 = "어쩌면……."
1006103-143 = "선생님도, 선생님께서 말씀해 주셨듯 저에게 있어서……."
1006103-147 = "그런 '한 결 같은 사람'……이라서 일지도 모르겠네요."
1006103-149 = "(이후 미소 짓는 사쿠라코를 대성당 문 앞까지 배웅해 준 후, 샬레로 돌아왔다.)"
