211010-24 = "[ns] \"เกเฮนน่าสงบสุขเหมือนเคยเลยนะ...\""
211010-28 = ""
211010-29 = ""
211010-31 = ""
211010-32 = "นี่! หยุดทำแบบนั้นเดี๋ยวนี้เลยนะ!"
211010-33 = ""
211010-35 = ""
211010-36 = "คะ... คณะกรรมการวินัยมาแล้ว!"
211010-37 = "เดี๋ยวก่อน ฟังก่อนสิ! เรื่องนี้ฉันเป็นฝ่ายเสียหายนะ!"
211010-38 = "เสียหายยังไงไม่ทราบ...?"
211010-39 = "ก็นั่นไง เห็นถังเหล็กที่กองไว้ตรงนั้นมั้ย? นั่นน่ะผลงานที่ฉันตั้งใจจะสร้างเลยนะ!"
211010-40 = "แล้วไง?"
211010-41 = "ถ้ากองไว้แบบนั้นแล้วจุดระเบิด หอคอยเปลวไฟสุดเจ๋งก็จะเสร็จสมบูรณ์ไงล่ะ!"
211010-42 = "แต่ยัยนั่นมายิงใส่ก่อนที่ฉันจะจุดระเบิดน่ะสิ! ทำอะไรไม่เข้าเรื่องจริงๆ!"
211010-43 = "ก็มันดูน่ายิงซะขนาดนั้น จะให้ดูอยู่เฉยๆ ได้ไงล่ะ! ถ้าเป็นเธอก็คงยิงเหมือนกันนั่นละ"
211010-44 = "เพราะงั้นฉันถึงต้องเป็นคนยิงไง! ทำไมเธอถึงโผล่มาทำลายความสนุกของฉันล่ะ!"
211010-45 = ""
211010-47 = ""
211010-48 = "ตรงจัตุรัสห้ามกองถังเหล็กไว้และก็ห้ามจุดระเบิดด้วย! พวกเธอทั้งสองคนเลย หยุดก่อความวุ่นวายในที่สาธารณะสักที!"
211010-49 = ""
211010-51 = ""
211010-52 = ""
211010-53 = "ฮึ่ย คณะกรรมการวินัยเนี่ย! เข้มงวดเกินไปแล้วนะ!"
211010-54 = "อย่างน้อยก็ควรปล่อยให้พวกเราหายใจหายคอบ้างสิ?"
211010-55 = "ไม่ต้องทำลายข้าวของก็หายใจหายคอกันได้ไม่ใช่เหรอ?"
211010-56 = "ให้หายใจหายคออุดอู้อยู่แบบนั้น ฉันไม่เอาด้วยหรอก!!"
211010-57 = ""
211010-59 = ""
211010-60 = "พูดบ้าอะไรของเธอเนี่ย..."
211010-61 = ""
211010-63 = ""
211010-66 = ""
211010-67 = "จริงๆ เลย วุ่นวายอะไรกันอีกแล้วคะ!"
211010-68 = "ลำพังแค่แพนเดโมเนียม โซไซตี้ส่งหนังสือราชการแปลกๆ มาให้อีกก็ปวดหัวจะแย่อยู่แล้ว..."
211010-69 = "มีอะไรอีกเหรอ?"
211010-70 = "ทางนั้นบอกว่าอุปกรณ์ส่วนใหญ่ที่คณะกรรมการวินัยใช้มีอานุภาพสูงเกินจำเป็น ให้ตรวจสอบทั้งหมด#nภายในพรุ่งนี้ แล้วส่งคืนกระสุนที่มีอานุภาพสูงกว่าขนาด 9 มม. ทั้งหมดค่ะ"
211010-71 = "ฟังไม่ขึ้นเลยค่ะ! นี่ไม่ใช่ของเล่นเด็กนะคะ!!"
211010-72 = "ไร้สาระสิ้นดี..."
211010-73 = ""
211010-75 = ""
211010-76 = ""
211010-77 = "ว่าแต่..."
211010-78 = ""
211010-80 = ""
211010-81 = "ทำไมพวกเธอถึงโดนแพนเดโมเนียม โซไซตี้เล่นงานทุกทีเลยล่ะ?"
211010-82 = "เล่นงานอะไรกันคะ!! พูดแบบนั้นได้ยังไงกัน!!"
211010-83 = "แต่ประธานกรรมการวินัยก็ชนะตลอดไม่ใช่เหรอ? บางทีดูเหมือนจะแกล้งเออออให้พวกนั้นด้วยซ้ำ..."
211010-84 = "เฮ้อ เรื่องนั้นน่ะ..."
211010-85 = ""
211010-87 = ""
211010-88 = "ถ้าชนะล่ะคะ?"
211010-89 = ""
211010-91 = ""
211010-92 = "หืม?"
211010-93 = "ถ้าชนะ แล้วต่อจากนั้นล่ะคะ?"
211010-94 = "จากนั้นงั้นเหรอ..."
211010-95 = "ถ้าชนะแล้วก็คือชนะไง? งั้นก็ทำตามใจตัวเองกันได้ไม่ใช่เหรอ?"
211010-96 = "ใช่เลย! การได้ทำตามใจตัวเองมันเจ๋งดีออก"
211010-97 = ""
211010-99 = ""
211010-100 = "งั้นถ้าพวกฉันอ้างว่ามีอำนาจ แล้วทำทุกอย่างตามใจบ้างล่ะคะ?"
211010-101 = "ถ้าคณะกรรมการวินัยกุมเกเฮนน่าไว้ในกำมือแล้วทำตามใจชอบ พวกคุณอาจเดือดร้อนก็ได้นะคะ?"
211010-102 = "เอ๋?"
211010-103 = "ถ้าท่านประธานของพวกฉันสั่งว่าตั้งแต่นี้ไปนักเรียนเกเฮนน่าทุกคนต้องใส่ชุดนักเรียนตามที่กำหนด#nเท่านั้นล่ะคะ? แน่นอนว่าท่านไม่ใช่คนแบบนั้นหรอกนะคะ"
211010-104 = "แต่ถ้าสั่งว่าต้องผูกเนกไทให้เรียบร้อย เสื้อก็ต้องเก็บชายให้หมด และต้องใส่เสื้อคลุมตลอดเวลาด้วย"
211010-105 = "ตอนนั้นการทำตามใจตัวเองจะยังเป็นเรื่องเจ๋งอยู่มั้ยคะ? แต่แน่นอนว่าท่านไม่ใช่คนแบบนั้นหรอกค่ะ"
211010-106 = "พอฟังดูแล้วก็รู้สึกว่าความคิดนั้นไม่ค่อยดีเท่าไรแฮะ..."
211010-107 = "มันก็สนุกอยู่หรอกนะที่ตัวเองได้ทำตามใจชอบ แต่ถ้าต้องทำตามใจคนอื่นละก็ ฉันรับไม่ได้หรอก"
211010-108 = "แม้จะมีอำนาจ แต่ก็ไม่ทำตามอำเภอใจ..."
211010-109 = "ต่อให้มีอำนาจ ก็รักษาขอบเขตที่ต้องรักษาเอาไว้"
211010-110 = "เพราะมีอำนาจ จึงรักษาขอบเขตที่ต้องรักษาเอาไว้"
211010-111 = "นี่คือหลักการของคณะกรรมการวินัยของเราค่ะ"
211010-112 = "ชินัตสึพูดถูกแล้ว"
211010-113 = ""
211010-115 = ""
211010-116 = ""
211010-118 = ""
211010-119 = "ปะ... ประธาน...!"
211010-120 = "อ่า คือว่า... ขอโทษที่ฉันพูดไปตามอำเภอใจค่ะ"
211010-121 = "ไม่หรอก นั่นเป็นสิ่งที่ฉันกับอาโกะพูดกันบ่อยๆ อยู่แล้วด้วย"
211010-122 = "ที่เธอยังจำได้ก็ถือว่าน่าขอบคุณแล้วละ"
211010-123 = "ไม่ขนาดนั้นหรอกค่ะ..."
211010-124 = "ขะ... ขอบคุณค่ะ ท่านประธาน..."
211010-125 = "ยังไงก็เถอะ..."
211010-126 = "ฉันยอมไม่ได้ ถ้าจะทำตามอำเภอใจเพียงเพราะมีอำนาจ"
211010-127 = "แต่ฉันก็ไม่ได้คิดจะควบคุมนักเรียนจนเกินไปเหมือนกัน"
211010-128 = "เพียงแต่..."
211010-129 = "การเฝ้าดูไม่ให้เกเฮนน่าที่เสรีและจะเสรีต่อไปในอนาคต ทำอะไรเกินขอบเขต#nนั่นแหละคือหน้าที่ของคณะกรรมการวินัยของเรา"
211010-130 = ""
211010-132 = ""
211010-133 = "และก็เป็นสัญญาที่ฉันเคยให้ไว้ด้วย..."
211010-134 = ""
211010-136 = ""
211010-137 = ""
211010-138 = "ขะ... เข้าใจแล้ว..."
211010-139 = "ดูเท่จัง ฉันก็ไปเข้าคณะกรรมการวินัยดีมั้ยนะ?"
211010-140 = "หา? เธอเนี่ยนะ? คนชอบอู้งานอย่างเธอจะเข้ากรรมการวินัยได้ยังไง?"
211010-141 = "ว่าไงนะ? คิดว่าฉันเป็นไม่ได้งั้นเหรอ?"
211010-142 = "เอาละๆ ประตูของคณะกรรมการวินัยเปิดต้อนรับเสมอ เขียนใบสมัครแล้วมาหาได้เลย"
211010-143 = "อ่า พอมาคิดดูแล้วก็ขี้เกียจแฮะ"
211010-144 = "งั้นก็ไม่ต้องมาเป็น!!"
211010-145 = "คิกคิกคิก เป็นภาพที่ชวนขบขันเหมือนเคยเลยนะ"
211010-146 = ""
211010-148 = ""
211010-149 = "นี่คุณ...!"
211010-150 = ""
211010-152 = ""
211010-155 = ""
211010-156 = "เฮอะ ไม่มีทางเดินผ่านไปเฉยๆ ได้เลยสินะคะ"
211010-157 = "คิกคิก ทำเป็นพูดจาเชิดหยิ่ง แต่สุดท้ายพวกเธอก็มีขีดจำกัดที่ชัดเจนอยู่ดี"
211010-158 = "ต่อให้กดขี่ด้วยอำนาจหรือความรุนแรง ก็หักหาญจิตใจของทุกคนไม่ได้หรอก"
211010-159 = "พวกคณะกรรมการวินัยที่เอะอะก็ใช้ความรุนแรงอย่างพวกเธอน่ะ โอบอุ้มทุกคนด้วยความใจกว้าง#nดั่งมหาสมุทรแบบท่านมาโคโตะผู้นี้ไม่ได้หรอก"
211010-160 = "ก็สงสัยอยู่ว่าจะพูดอะไร สรุปก็แค่มาหาเรื่องกันอีกตามเคยสินะคะ..."
211010-161 = "เอาเถอะค่ะ ประธานมาโคโตะ ยังไงคุณก็ไม่ใช่คนที่จะมาพูดเรื่องความใจกว้างได้หรอกค่ะ!"
211010-162 = "หนังสือราชการแปลกๆ ที่ส่งมาคราวนี้ก็ด้วย! ไหนจะตัดงบประจำไตรมาสของคณะกรรมการวินัย#nด้วยเหตุผลสารพัด แล้วก็ถ่วงเวลาอนุมัติค่าดำเนินงานไปเรื่อยๆ อีก!"
211010-163 = "เราไม่มีเวลามาสนใจเรื่องต่ำต้อยพวกนั้นหรอก!!"
211010-164 = "ทำไมถึงบอกว่าเป็นเรื่องต่ำต้อยล่ะคะ! ถ้าสภานักเรียนอย่างพวกคุณไม่ทำ แล้วใครจะทำกันคะ?"
211010-165 = "นี่ เรื่องที่เป็นประโยชน์กับคณะกรรมการวินัยน่ะ อยู่ในความสำคัญลำดับท้ายๆ ของงานมากมาย#nมหาศาลของแพนเดโมเนียม โซไซตี้! แล้วก็อยู่ในลำดับท้ายสุดไปเลยด้วย!"
