[translation]
211010-1 = "第1話;格黑娜今天也很和平"
211010-3 = "[ns] 「今天也很和平……」"
211010-4 = "所～以～說～！！"
211010-5 = ""
211010-6 = "格黑娜廣場"
211010-7 = ""
211010-8 = ""
211010-9 = ""
211010-10 = ""
211010-11 = "這樣下去沒完沒了！只能用火藥解決了！"
211010-12 = ""
211010-14 = ""
211010-15 = ""
211010-16 = ""
211010-24 = "[ns] 「……格黑娜真是一如既往啊。」"
211010-28 = ""
211010-29 = ""
211010-31 = ""
211010-32 = "那邊的，別再做那種事了！"
211010-33 = ""
211010-35 = ""
211010-36 = "風，風紀委員會！"
211010-37 = "等一下，聽我說！這件事我可是很冤枉的耶？"
211010-38 = "怎麼了……？"
211010-39 = "你看，那邊堆著的汽油桶看到了吧？那是我本來要做的作品！"
211010-40 = "所以呢？"
211010-41 = "像那樣堆起來再一口氣引爆的話，就能完成超讚的火焰之塔了！"
211010-42 = "結果這傢伙在我點火之前就先開槍了！這算什麼啊！"
211010-43 = "不是啊，長得那麼好射，怎麼可能乾看著不動手！#n換作是你也會射吧？"
211010-44 = "所以說應該由我來射啊！你幹嘛跑出來破壞我的樂趣啦！"
211010-45 = ""
211010-47 = ""
211010-48 = "在廣場上不准堆汽油桶，也不准爆破！#n兩個都給我克制點，別在公共場所鬧事！"
211010-49 = ""
211010-51 = ""
211010-52 = ""
211010-53 = "呿，風紀委員會也太嚴格了吧！"
211010-54 = "至少也該給人一點喘息的空間吧？"
211010-55 = "就算不破壞公物，也能喘口氣吧？"
211010-56 = "我才不要那麼憋屈地喘氣！！"
211010-57 = ""
211010-59 = ""
211010-60 = "你到底在說什麼啊……"
211010-61 = ""
211010-63 = ""
211010-66 = ""
211010-67 = "真是的，又在吵什麼了！"
211010-68 = "光是萬魔殿又發來奇怪的公文，要操心的事就已經夠多了……"
211010-69 = "這次又發了什麼？"
211010-70 = "說風紀委員會使用的裝備大多火力過高，#n要在明天之前全數清查，並把威力超過9mm子彈的彈藥全部繳回。"
211010-71 = "這像話嗎！又不是小孩子的玩具！！"
211010-72 = "真是無言……"
211010-73 = ""
211010-75 = ""
211010-76 = ""
211010-77 = "話說……"
211010-78 = ""
211010-80 = ""
211010-81 = "你們為什麼每次都被萬魔殿欺負啊？"
211010-82 = "什麼叫被欺負！！你怎麼能說這種話！！"
211010-83 = "不是啊，風紀委員長不是什麼都贏得了嗎？#n有時候看起來像是在配合他們無理取鬧……"
211010-84 = "唉，那是因為……"
211010-85 = ""
211010-87 = ""
211010-88 = "贏了又如何？"
211010-89 = ""
211010-91 = ""
211010-92 = "嗯？"
211010-93 = "贏了之後，接下來呢？"
211010-94 = "什麼接下來……"
211010-95 = "嗯，贏了就是贏了吧？那不就能隨心所欲了嗎？"
211010-96 = "沒錯！能照我們的意思來，那可是超棒的事耶？"
211010-97 = ""
211010-99 = ""
211010-100 = "那麼，如果我們仗著有力量就為所欲為呢？"
211010-101 = "如果我們風紀委員會隨心所欲地掌控格黑娜，說不定會對各位造成損害哦？"
211010-102 = "咦？"
211010-103 = "假如我們委員長說從現在起，所有格黑娜學生們都只能穿規定的制服呢？#n當然，委員長不是那種人就是了。"
211010-104 = "領帶要繫好，上衣要全部紮進去，連外套都得隨時穿著的話。"
211010-105 = "那時候，能隨心所欲還算是很棒的事嗎？#n當然，委員長不是那種人就是了。"
211010-106 = "聽你這麼一說，好像確實不太好……"
211010-107 = "要照自己的意思來才好玩，被別人擺佈我可不要。"
211010-108 = "即使擁有力量，也不為所欲為……"
211010-109 = "即使擁有力量，也要守住該守的底線。"
211010-110 = "正因為擁有力量，才要守住該守的底線。"
211010-111 = "這就是我們風紀委員會的方針。"
211010-112 = "千夏說的沒錯。"
211010-113 = ""
211010-115 = ""
211010-116 = ""
211010-118 = ""
211010-119 = "委，委員長……！"
211010-120 = "啊，這個……我擅自說了那麼多，對不起。"
211010-121 = "沒關係。這也是我和亞子常說的話。"
211010-122 = "你還記得這些，我很感謝。"
211010-123 = "您客氣了……"
211010-124 = "謝，謝謝您。委員長……"
211010-125 = "總之……"
211010-126 = "我不會容許有人仗著力量為所欲為。"
211010-127 = "但我也不打算過度管制學生們。"
211010-128 = "只是……"
211010-129 = "守望這個自由，並且今後也將自由的格黑娜不越線。#n這就是我們風紀委員會該做的事。"
211010-130 = ""
211010-132 = ""
211010-133 = "……同時也是我許下的承諾。"
211010-134 = ""
211010-136 = ""
211010-137 = ""
211010-138 = "知，知道了……"
211010-139 = "感覺好帥哦。我也加入風紀委員會好了？"
211010-140 = "咦，你嗎？像你這種愛偷懶的傢伙，怎麼可能進得了風紀委員會？"
211010-141 = "什麼？你以為我做不到嗎？"
211010-142 = "好了好了。風紀委員會的大門隨時都是敞開的。#n先填好申請書再過來吧。"
211010-143 = "啊，仔細想想好麻煩哦。"
211010-144 = "那就別加入啊！！"
211010-145 = "嘰嘻嘻，還是一如既往的滑稽景象啊。"
211010-146 = ""
211010-148 = ""
211010-149 = "你是……！"
211010-150 = ""
211010-152 = ""
211010-155 = ""
211010-156 = "唉，果然不會就這樣直接路過呢。"
211010-157 = "嘻嘻，說得那麼自以為是，但你們終究有著明確的極限。"
211010-158 = "就算用權威或暴力強行壓制，也無法讓人心服。"
211010-159 = "不管什麼事都馬上訴諸暴力的你們風紀委員會，#n是無法像我真琴大人一樣，以偉大的胸襟包容所有人的。"
211010-160 = "我還以為要說什麼，果然只是來找碴的……"
211010-161 = "而且真琴議長，你可沒資格談論什麼胸襟吧！"
211010-162 = "這次發來的奇怪公文也是！#n不只找各種理由削減風紀委員會的季度預算，營運費的簽核又一拖再拖！"
211010-163 = "本大人可沒空理會那種微不足道的小事！！"
211010-164 = "那哪裡是微不足道的小事了！#n身為學生會的你們不做的話，還有誰會做？"
211010-165 = "哎呀，對風紀委員會有利的事，在我們萬魔殿極其繁多的業務中只是次要的！#n而且還是極其次要的！"
211010-166 = ""
211010-168 = ""
211010-169 = ""
211010-170 = ""
211010-171 = "真琴……如果真的是因為這種理由，我可能沒辦法就這樣放過。"
211010-172 = ""
211010-174 = ""
211010-175 = ""
211010-176 = ""
211010-179 = ""
211010-180 = ""
211010-181 = "哇，又吵起來了。"
211010-182 = "反正每次都這樣嘛。"
211010-183 = ""
211010-185 = ""
211010-186 = ""
211010-187 = ""
211010-188 = ""
211010-189 = ""
211010-190 = "等一下！！"
211010-191 = ""
211010-193 = ""
211010-194 = "[ns] 「？？？」"
211010-197 = ""
211010-199 = "下一話;格黑娜再興委員會"
