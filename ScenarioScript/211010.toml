211010-156 = "*sigh* Can't have one quiet day."
211010-157 = "Kihe, for all your posturing, there are clear limits to your capabilities."
211010-158 = "While you can suppress the will of the people through threats and violence, you cannot break their spirits."
211010-159 = "In short, you, the Prefect Team, so quick to resort to violence, simply lack the generosity to embrace all, the way I, the Great and Magnanimous Makoto, do."
211010-160 = "And here I was wondering what you were getting at. You're just trying to pick a fight..."
211010-161 = "You have no right to be lecturing us on generosity, Chairman Makoto!"
211010-162 = "You just issued this absurd order! You slashed the Prefect Team's quarterly budget, and you constantly delay approving our operational expenses!"
211010-163 = "I have no time for such trivial matters!!"
211010-164 = "How is that \"trivial\"?! If you, the acting student council, don't approve it, then who will?!"
211010-165 = "The Prefect Team's matters take low priority in the mountain of work plaguing the Pandemonium Society! The lowest! Subterranean!"
