211010-36 = "I-It's the Prefect Team!"
211010-37 = "Wait, chill out. I'm the innocent, reasonable, peaceful one. SHE started it!"
211010-38 = "What's the problem here...?"
211010-39 = "You see that curated pile of drum barrels over there? I put them together...for my art project!"
211010-40 = "And?"
211010-41 = "It doesn't look like much now, but I was going to set them all off at once. It was going to be a towering inferno! Think of the symbolism!"
211010-42 = "But SHE waltzed in here and started blasting before I even properly set the charges! Yeah, I'm talking about YOU. What's your problem?"
211010-43 = "I was just supposed to stand here? It was lined up perfectly. I saw a perfect shot, so I took it. Like you wouldn't!"
211010-44 = "Of course I WOULD. That's why I spent weeks planning it. And then you had to ruin all the fun!"
211010-45 = ""
211010-47 = ""
211010-48 = "Listen! No one should stack or blow up drum barrels in the plaza! Where do you think we are, Wildhunt?"
211010-49 = ""
211010-51 = ""
211010-52 = ""
211010-53 = "Sure feels like it. The Prefect Team is such a drag..."
211010-54 = "Tell me about it. They're always on our asses. It's like we can't even breathe without getting reprimanded."
211010-55 = "You can breathe just fine without committing vandalism!"
211010-56 = "I can't live on such petty, stifling wisps of air!"
211010-57 = ""
211010-59 = ""
211010-60 = "What are you even talking about...?"
211010-61 = ""
211010-63 = ""
211010-66 = ""
211010-67 = "Honestly, what's all this fuss?!"
211010-68 = "As if we didn't have enough of a headache. Did you see this new order from the Pandemonium Society?"
211010-69 = "What is it this time?"
211010-70 = "They assert that the Prefect Team needs to be audited. They want us to conduct a full equipment inspection and surrender every round larger than 9mm by tomorrow."
211010-71 = "What gives them the right?! I feel like we're dealing with children... "
211010-72 = "Ridiculous..."
211010-73 = ""
211010-75 = ""
211010-76 = ""
211010-77 = "By the way..."
211010-78 = ""
211010-80 = ""
211010-81 = "Why do you always let the Pandemonium Society boss you around?"
211010-82 = "Boss US around?! You can't be serious!"
211010-83 = "I mean, doesn't the Head Prefect always get what she wants anyway? Sometimes it feels like she's just humoring all the chairman's demands..."
211010-84 = "*sigh* About that..."
211010-85 = ""
211010-87 = ""
211010-88 = "What if she won?"
211010-89 = ""
211010-91 = ""
211010-92 = "Huh?"
211010-93 = "What if Hina won? What if she overrode the Pandemonium Society? Then what?"
211010-94 = "What do you mean \"then what\"...?"
211010-95 = "Well, I guess if Hina won, then she'd be the boss and could do whatever she liked?"
211010-96 = "Yeah! That'd be so cool. Who wouldn't want that?"
211010-97 = ""
211010-99 = ""
211010-100 = "Let's say WE had all the power and could do whatever we wanted..."
211010-101 = "If the Prefect Team were running Gehenna, then you'd probably have a problem with us, no matter how we governed."
211010-102 = "Huh?"
211010-103 = "What if our Head Prefect said that every Gehenna student had to wear the same uniform? Not that she would, of course."
211010-104 = "And she forced you to tighten your tie, tuck your shirt, wear a jacket, and keep your hemlines low?"
211010-105 = "Would you still think that it was so \"cool\" that she's the boss and could declare whatever she wanted unimpeded?"
211010-106 = "Well, when you put it that way..."
211010-107 = "I mean, yeah, it's only fun when I'M free to do whatever I please. Of course I don't want someone else bossing me around."
211010-108 = "\"Though I have the power to do so, I don't act arbitrarily...\""
211010-109 = "\"Even if I have the power to push, I know where to draw the line.\""
211010-110 = "\"Precisely because I possess power, I know which boundaries must be upheld.\""
211010-111 = "This is the Prefect Team's motto."
211010-112 = "Well said, Chinatsu."
211010-113 = ""
211010-115 = ""
211010-116 = ""
211010-118 = ""
211010-119 = "H-Head Prefect...!"
211010-120 = "Ah, about all this... Please forgive my dramatics."
211010-121 = "Don't apologize. Ako and I frequently recite the motto too."
211010-122 = "I'm pleased that you hold it so dearly."
211010-123 = "That's..."
211010-124 = "Th-Thank you, Head Prefect..."
211010-125 = "Furthermore..."
211010-126 = "I cannot tolerate people acting as they please simply because they have the power."
211010-127 = "Nor do I intend to ever exercise excessive control over students."
211010-128 = "It's only..."
211010-129 = "The Prefect Team's role is to keep a watchful eye on a free Gehenna, to keep it free, and to ensure that it does not cross the line."
211010-130 = ""
211010-132 = ""
211010-133 = "...That's also my personal vow."
211010-134 = ""
211010-136 = ""
211010-137 = ""
211010-138 = "G-Got it..."
211010-139 = "That sounds pretty cool. Should I sign up for the Prefect Team too?"
211010-140 = "Please, you? How could a slacker like you survive the Prefect Team?"
211010-141 = "What? You don't think I could do it?!"
211010-142 = "Now, now. The Prefect Team's doors are always open. Just visit and fill out an application. We even have pamphlets."
211010-143 = "Ah, you know what? That sounds like a lot of work. Pass."
211010-144 = "Then don't! See if I care!"
211010-145 = "Kihehe, as ludicrous as ever."
211010-146 = ""
211010-148 = ""
211010-149 = "You're...!"
211010-150 = ""
211010-152 = ""
