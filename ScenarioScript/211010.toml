[translation]
211010-1 = "第1話;ゲヘナは今日も平和なり"
211010-3 = "[ns] \"今日も今日とて――\""
211010-4 = "だ～か～ら～さ～！！"
211010-6 = "ゲヘナ広場"
211010-11 = "も～、埒が明かない！#nやっぱ解決するならこれでしょ！"
211010-24 = "[ns] \"――ゲヘナだなぁ。\""
211010-32 = "そこまでだ！"
211010-36 = "風紀委員会！？"
211010-37 = "ちょっちょっちょ、待って待って！#nこれには理由があって……！"
211010-38 = "……何だ？"
211010-39 = "あそこにドラム缶あるでしょ？#nあれ、私の作品[ruby=・]だ[/ruby][ruby=・]っ[/ruby][ruby=・]た[/ruby]の！"
211010-40 = "それで？"
211010-41 = "私は、最高にイカした「爆炎の塔」を作ろうとしてたわけよ。#nドラム缶を1個ずつ積み上げて、一気に爆発させるの。"
211010-42 = "なのに、こいつ何したと思う！？#n私より先に撃っちゃったんだよ！？ありえなくない！？"
211010-43 = "つい撃ちたくなっちゃって……。#nってか、あんな「撃ってください」って標的作るほうが悪いじゃん。"
211010-44 = "だ、か、ら！私が！撃とうとしてたの！#nなんで私の楽しみ奪うのさ！"
211010-48 = "そもそも、広場にドラム缶を積むのも、爆破するのも禁止だ。#n公共の場で騒ぎ起こすのは控えろと言ってるだろ！"
211010-53 = "ちぇっ、厳しすぎなんだよ。"
211010-54 = "なんか息苦しいっていうか……。"
211010-55 = "暴れなくたって息はできるだろ？"
211010-56 = "こんな窮屈な空気じゃ窒息するっての！"
211010-60 = "何を言ってるんだ……。"
211010-67 = "いったい何の騒ぎですか！"
211010-68 = "[ruby=パンデモニウム・ソサエティー]万魔殿の対応だ[/ruby]けでも面倒なのに、揉め事を起こさないでください。"
211010-69 = "また何か言われたの？"
211010-70 = "風紀委員会の装備を明日までに全数調査することになりました。#n過剰戦力だから、9mm弾を超える威力の弾薬は返納しろ、と。"
211010-71 = "今に始まったことではないですが……まったく、話になりません。"
211010-72 = "呆れた……。"
211010-77 = "気になってたんだけどさ。"
211010-81 = "なんで万魔殿の言いなりなの？"
211010-82 = "言いなり！？なんてことを言うんですか！！"
211010-83 = "やろうと思えば、風紀委員長がどうとでもできるでしょ？#nなのに、どうして従ってるのかな、って。"
211010-84 = "はぁ……。"
211010-88 = "力で覆して、どうするんですか？"
211010-92 = "え？"
211010-93 = "倒して、[ruby=・]そ[/ruby][ruby=・]の[/ruby][ruby=・]後[/ruby]は？"
211010-94 = "その後って……。"
211010-95 = "勝ったら勝ちでしょ？#n好き放題できるってことじゃないの？"
211010-96 = "そうそう！めっちゃ最高じゃん？"
211010-100 = "では……力に任せて、何でも好き放題にして良いと？"
211010-101 = "ゲヘナを風紀委員会の思うままにしたら、皆さんにも影響が及ぶかもしれませんよ？"
211010-102 = "ど、どういうこと？"
211010-103 = "例えば……委員長が「制服の着崩し禁止」と仰ったら？"
211010-104 = "ネクタイをきちんと締めて、シャツは全部入れて、上着を必ず羽織らなければならなくなります。"
211010-105 = "これも、力ある者が好き放題した結果です。それでも素晴らしいと思えますか？#nもちろん、委員長はそんな方ではありませんけど。"
211010-106 = "あんま良くないかも……。"
211010-107 = "それは嫌だなぁ……。"
211010-108 = "力があっても、勝手はしない。"
211010-109 = "力があっても、守るべき一線を守る。"
211010-110 = "――力があるからこそ、守るべき一線を守る。"
211010-111 = "それが風紀委員会の方針です。"
211010-112 = "チナツの言う通り。"
211010-119 = "委員長……！"
211010-120 = "すみません……出過ぎた真似を……。"
211010-121 = "なぜ？私とアコがいつも言っていることじゃない。"
211010-122 = "覚えていてくれて嬉しいわ。"
211010-123 = "委員長……。"
211010-124 = "ありがとうございます。"
211010-125 = "とにかく。"
211010-126 = "力があるからって好き放題するのは許さない。"
211010-127 = "でも、過剰に規制するつもりもない。"
211010-128 = "自由な――"
211010-129 = "これからも自由であるはずのゲヘナが、一線を越えないように見守ること。#nそれが風紀委員会の役割。"
211010-133 = "……私の約束でもあるから。"
211010-138 = "わ、分かった……。"
211010-139 = "カッコいい……私も入ろっかな？"
211010-140 = "えっ、あんたみたいなサボり魔が？"
211010-141 = "はぁ！？出来ないって言いたいの！？"
211010-142 = "風紀委員会はいつでも歓迎してる。#n申請書を書いて持ってこい。"
211010-143 = "えー、やっぱめんどくさいからいいや……。"
211010-144 = "じゃあ最初から言うな！！"
211010-145 = "キシシッ、相変わらず滑稽だな。"
211010-149 = "あなたは……！"
211010-156 = "はぁ……やっぱり素通りはできないんですね。"
211010-157 = "どれほど格好つけようと、お前たちには限界がある。"
211010-158 = "すぐ暴力に頼るからな。それでは心まで従わせることはできない。"
211010-159 = "このマコト様とは器の広さが違うのだ！"
211010-160 = "いつもの言いがかりでしたか……。"
211010-161 = "そもそも、あなたに「器」を語る資格はないでしょう？"
211010-162 = "今回の命令だってそうです。#nあれこれと理由をつけて、風紀委員会の予算を削減する。#nそのくせ、活動費の決裁は先延ばしじゃないですか！"
211010-163 = "そんなことに構っている暇などない！！"
211010-164 = "あなた達がやらないで誰がやるんですか！？"
211010-165 = "ええい！万魔殿は忙しいんだ！風紀委員会のことなど後回しだ！"
211010-171 = "……本当にそれが理由なら、見過ごすわけにはいかない。"
211010-181 = "うわ、ケンカしてら。"
211010-182 = "いつものことじゃん。"
211010-190 = "待った！！"
211010-194 = "[ns] \"？？？\""
211010-199 = "次回;ゲヘナ再興委員会"
