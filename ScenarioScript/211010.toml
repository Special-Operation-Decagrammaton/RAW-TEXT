[translation]
211010-1 = "제1화;오늘도 평화로운 게헨나"
211010-3 = "[ns] \"오늘도 평화로운……\""
211010-4 = "그~러~니~까~!!"
211010-6 = "게헨나 광장"
211010-11 = "이건 별수 없네! 화약으로 해결할 수밖에!"
211010-24 = "[ns] \"……평소의 게헨나다.\""
211010-32 = "거기, 그런 짓은 그만둬!"
211010-36 = "서, 선도부다!"
211010-37 = "잠깐, 들어봐! 이건 내가 억울한 사연이라고?"
211010-38 = "뭔데 그래……?"
211010-39 = "아니, 저기 드럼통 쌓아둔 거 보여? 내가 만들려고 한 작품이거든!"
211010-40 = "그런데?"
211010-41 = "저렇게 쌓아두고 한 번에 폭발시키면 그야말로 끝내주는 불꽃의 탑이 완성될 거란 말이지!"
211010-42 = "그런데 이 녀석이 내가 불을 붙이기 전에 먼저 쏴버렸다고! 이게 무슨 짓이냔 말이야!"
211010-43 = "아니, 저렇게 쏘기 좋게 생겼는데 어떻게 가만히 보고만 있냐고! 너 같았어도 쐈을걸?"
211010-44 = "그러니까 내가 쏴야지! 왜 네가 튀어나와서 내 즐거움을 망치는 건데!"
211010-48 = "광장에서는 드럼통을 쌓는 것도 폭파시키는 것도 안 돼!#n둘 다 공공장소에서 소란을 피우는 건 자제하라고!"
211010-53 = "에잇, 너무 빡빡하단 말이야! 선도부는!"
211010-54 = "숨 쉴 여유 정도는 줘야 하는 거 아냐?"
211010-55 = "그렇게 기물을 파손하지 않고도 숨은 쉴 수 있잖아?"
211010-56 = "그렇게 쪼잔한 숨, 쉬고 싶지 않다고!!"
211010-60 = "이게 무슨 소리야……."
211010-67 = "정말, 또 무슨 소란인가요!"
211010-68 = "안 그래도 만마전에서 또 이상한 공문이 내려오는 바람에 신경 쓸 것도 많은데……."
211010-69 = "또 뭐가 왔어?"
211010-70 = "선도부에서 사용하는 장비 대부분이 필요 이상의 고화력이라고, 내일까지 전수 조사 후 9mm 탄환을 초과하는 위력의 탄약은 모두 반납하라는 이야기예요."
211010-71 = "말이 되는 소린가요! 어린아이들 장난감도 아니고!!"
211010-72 = "어이가 없네……."
211010-77 = "그런데……"
211010-81 = "너희는 왜 매번 만마전한테 당하고 있는 거야?"
211010-82 = "당하다뇨!! 무슨 그런 말씀을!!"
211010-83 = "아니, 선도부장이 다 이기는 거 아니야? 가끔 보면 억지에 어울려주는 느낌이던데……."
211010-84 = "하아, 그건……"
211010-88 = "이기면요?"
211010-92 = "응?"
211010-93 = "이기면, 그다음은요?"
211010-94 = "그다음이라니……."
211010-95 = "뭐, 이기면 이기는 거지? 그럼 자기 마음대로 할 수 있는 거 아냐?"
211010-96 = "맞아! 우리 마음대로 할 수 있다는 게 얼마나 멋진 일이야?"
211010-100 = "그럼, 저희가 힘이 있다고 무엇이든 마음대로 한다면요?"
211010-101 = "저희 선도부 마음대로 게헨나를 쥐락펴락한다면, 여러분에게 피해가 갈지도 모르는데요?"
211010-102 = "어?"
211010-103 = "만약 저희 부장님이 지금부터 모든 게헨나 학생들은 정해진 교복만 입어야 한다고 하신다면요? 물론 그럴 분은 아니지만요."
211010-104 = "넥타이도 똑바로 하고, 상의도 모두 넣어서 입어야 하고, 외투까지 항상 걸쳐야 한다면."
211010-105 = "그때도 마음대로 할 수 있는 게 멋진 일일까요? 물론 그럴 분은 아니지만요."
211010-106 = "듣고 보니 그 생각은 별로 안 좋은 것 같아……"
211010-107 = "내 마음대로 해야 재미있는 건데, 다른 사람 마음대로 되는 건 환영할 수 없네."
211010-108 = "힘이 있더라도 마음대로 하지 않는다……"
211010-109 = "힘이 있음에도, 지켜야 할 선을 지킨다."
211010-110 = "힘이 있으니, 지켜야 할 선을 지킨다."
211010-111 = "이것이 저희 선도부의 방침입니다."
211010-112 = "치나츠의 말이 맞아."
211010-119 = "부, 부장……!"
211010-120 = "아, 이건…… 제멋대로 떠들어서 죄송해요."
211010-121 = "아냐. 나와 아코가 항상 하는 말이기도 했고."
211010-122 = "기억하고 있어 줬다니 고마운 일이지."
211010-123 = "그런……"
211010-124 = "가, 감사합니다. 부장님……."
211010-125 = "아무튼……"
211010-126 = "힘이 있다고 해서 제멋대로 구는 건 용납할 수 없어."
211010-127 = "그렇다고 해서 학생들을 지나치게 통제할 생각도 없고."
211010-128 = "단지……"
211010-129 = "이 자유로운, 그리고 앞으로도 자유로울 게헨나가 선을 넘지 않도록 지켜보는 것.#n그게 우리 선도부가 할 일이야."
211010-133 = "……내가 했던 약속이기도 하고."
211010-138 = "아, 알았어……."
211010-139 = "왠지 멋진걸. 나도 선도부에 가입할까?"
211010-140 = "엑, 네가? 너처럼 뺀질거리는 애가 어떻게 선도부가 되겠어?"
211010-141 = "뭐라고? 내가 못 할 줄 알아?"
211010-142 = "자, 자. 선도부의 문은 언제나 열려 있으니까. 신청서부터 작성해서 방문해 줘."
211010-143 = "아, 생각해 보니 귀찮네."
211010-144 = "그럼 하지 말든가!!"
211010-145 = "키시싯, 여전히 골계스러운 풍경이군."
211010-149 = "당신은……!"
211010-156 = "하아, 역시 그냥 지나가는 법이 없네요."
211010-157 = "키킥, 잘난 척 말했지만, 결국 너희들에게는 명확한 한계가 존재한다."
211010-158 = "권위나 폭력으로 찍어 눌러봐야 결국 마음마저 꺾지는 못하지."
211010-159 = "무슨 일이든 금세 폭력에 기대곤 하는 너희 선도부 녀석들은, 이 마코토 님처럼 위대한 도량으로 모두를 품을 수 없다는 이야기다."
211010-160 = "무슨 소리를 하나 했더니, 역시나 그냥 시비일 뿐이군요……."
211010-161 = "아무튼, 마코토 의장 당신이 도량 운운할 수 있는 사람은 아닐 텐데요!"
211010-162 = "이번에 보낸 이상한 공문도 그렇고! 선도부의 분기 예산을 별별 이유를 들어가며 삭감하고, 영업비 결재는 차일피일 미루고!"
211010-163 = "그런 하찮은 일 따위에 신경 쓸 여유는 없다!!"
211010-164 = "그게 왜 하찮은 일이냐고요! 학생회인 당신들이 안 하면 누가 하나요?"
211010-165 = "에이잇, 선도부에게 이득이 되는 일은 우리 만마전의 지극히 많은 업무 중에서도 후순위!#n그중에서도 지극히 후순위니까 말이다!"
211010-171 = "마코토…… 정말 그 이유 때문이라면, 그냥은 넘어갈 수 없을지도 몰라."
211010-181 = "우와, 또 싸운다."
211010-182 = "뭐 매번 있는 일이잖아."
211010-190 = "잠깐!!"
211010-194 = "[ns] \"???\""
211010-199 = "다음화;게헨나재흥위원회"
