[translation]
10026045-9 = "……!? 무, 무슨 소리지!? 갑자기 총소리가!?"
10026045-10 = "유적 안쪽에서 나는 소리 같은데……. 선생님과 우이 씨는 아직이실까요?"
10026045-18 = "히, 히나타 씨! 히나타 씨!!!"
10026045-19 = "우, 우이 씨!? 왜 그러세요?"
10026045-20 = "선생님까지 그렇게 땀에 흠뻑 젖으셔서는……!"
10026045-21 = "어머나……. 두 분 그렇게 거친 숨소리로 땀에 흠뻑……."
10026045-22 = "아 됐고!! 저, 저기 안에……. 저기 안에!!"
10026045-23 = "……응? 안에……? 유적 안 말씀이신가요?"
10026045-24 = "설마 아까 선생님께서 보셨다던……."
10026045-30 = "미메시스다!! 나, 나온다. 나온다고!!"
10026045-31 = "아무래도 대처가 필요해 보이네요!!"
10026045-36 = "……!? 뭐, 뭐야!? 유탄 발사기!? 저 가방에 저런 게 들어 있었어!?"
10026045-37 = "어라……. 잠시만요. 히나타 씨. 그걸 지금 쏘시면 약간의 문제가……."
10026045-39 = "왜 그리 화가 나셨는지는 모르겠지만……. 두 분을 위협하는 건 용납할 수 없어요!!"
10026045-40 = "얌전히 원래 있던 곳으로 돌아가세요!!"
10026045-49 = "어라라……. 역시……. 유적이 폭삭……."
10026045-50 = "이거 참……. 나중에 사쿠라코 씨에게 말씀드리면 재밌는 광경을 볼 수 있겠네요……."
10026045-51 = "……!? 으, 으응!? 뭐, 뭐죠!? 방금 전 소리는!? 무슨 일이에요?"
10026045-52 = "……네?? 유적이요? 무너져 내렸다고요? 그게 무슨……?"
10026045-53 = "…………."
10026045-58 = "우, 우이 씨!? 우이 씨가 쓰러졌어요!!"
10026045-59 = "우이 씨! 왜 그러시는 건가요! 정신 차리세요! 우이 씨!!"
