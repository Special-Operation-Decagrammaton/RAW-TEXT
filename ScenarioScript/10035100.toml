[translation]
10035100-1 = "제10화;라이프가드, 해냈습니다!"
10035100-3 = "어라? 선생님, 어째서 여기 있는 거야?"
10035100-4 = "[s1] \"치히로야말로 어째서 여기를?\"\n[s2] \"치히로야말로 어째서 수영복도 안 입고 워터파크를?\""
10035100-7 = "이 녀석들이 또 말썽을 부려서 해결하러 왔지."
10035100-12 = "안녕, 선생님. 이런 데서 만나다니 반가워."
10035100-13 = "좀 더 평화로운 상황이었다면 더 좋았을 텐데."
10035100-15 = "그 교복은……밀레니엄 분들이신가요?"
10035100-16 = "그보다 말썽……이라면?"
10035100-17 = "어째, 대충 짐작이 가는데."
10035100-23 = "발키리 경찰학교 공안국 국장 오가타 칸나다."
10035100-24 = "메카 악어가 밀레니엄 사이언스 스쿨과 관련이 있나?"
10035100-26 = "휴우, 맞아."
10035100-27 = "우타하, 네 입으로 말해."
10035100-28 = "음, 참으로 유감스러운 말이지만, 그 말대로야."
10035100-29 = "이 악어는 우리 밀레니엄 엔지니어부에서 만들어진 물건이니까."
10035100-36 = "어째서 이런 물건을 만든 거죠!"
10035100-37 = "메카 악어 때문에 많은 시민분들이 놀라고 두려워했다고요!"
10035100-39 = "면목이 없다."
10035100-40 = "하지만 방금 말했듯, 이 악어는 엔지니어부에서 '만들어진' 물건이지, '만든' 물건은 아니야."
10035100-41 = "그거나 그거나 똑같은 게?"
10035100-43 = "아니야!"
10035100-49 = "원래는 해양 레저용으로 만들고 있던 악어 로봇에, 개발 중이던 건물 철거 알고리즘이 실수로 들어간 것뿐이다!"
10035100-50 = "어쩐지, 그래서 사람 대신 놀이기구만 노렸던 거군요……."
10035100-55 = "잠깐만! 어째서 해양 레저용 로봇에 공격 기능이 탑재되어 있습니까!"
10035100-56 = "본관의 눈을 속일 수는 없습니다!"
10035100-57 = "화염방사 기능과 이빨 미사일이 왜 필요한가요!"
10035100-62 = "그야……로망이니까."
10035100-67 = "네?"
10035100-68 = "아무튼, 이상을 알아차렸을 때는 이미 바다로 도망쳐버린 후……."
10035100-69 = "그래서 뒤늦게 수색을 시작했지만, 행방을 찾을 수가 없었지."
10035100-70 = "다행히 녀석의 행동 로그가 서버에 기록되고 있었기에, 치히로의 도움을 받아 뒤를 쫓은 거야."
10035100-71 = "그런데 맙소사, 설마 워터파크로 흘러 들어왔을 줄이야."
10035100-72 = "이번 사태로 발생한 피해에 대해서는 엔지니어부가 확실히 책임을 지도록 하겠어."
10035100-73 = "죄송합니다……."
10035100-75 = "거 봐!"
10035100-76 = "우리 아니었지?"
10035100-77 = "덮어놓고 의심하지 말란 말이야!"
10035100-78 = "그러니까 평소 행실 문제라고."
10035100-79 = "닥쳐! 어쨌든, 만든 사람까지 왔으니 이제 알아낼 수 있겠지?"
10035100-80 = "아, 그렇네요!"
10035100-82 = "무슨 말이야?"
10035100-83 = "칸나 국장이랑 마주친 순간 악어가 이상 반응을 일으켰거든."
10035100-84 = "중요한 건 아니지만, 다들 궁금해해서 말이야."
10035100-85 = "이상 반응이라……."
10035100-86 = "관심이 가는데. 한 번 뜯어봐야겠어."
10035100-96 = "보안 설정을 풀고……"
10035100-100 = "자, 됐어."
10035100-101 = "음, 역시 치히로야. 든든해."
10035100-105 = "여기, 악어의 행동 로그야. 고장 나기 직전까지 수행한 모든 활동 데이터가 기록되어 있지."
10035100-106 = "너희가 말한 악어의 이상행동은……여기군."
10035100-110 = "에러 코드 4885, 생물 모방 본능 알고리즘에 의한 피식 자각, 그리고 회피 행동."
10035100-111 = "모방 어쩌구가 뭔데?"
10035100-112 = "설명은 해줘야 할 거 아냐?"
10035100-113 = "……쉽게 말하자면."
10035100-117 = "악어가 상대를 마주한 순간, 자신보다 상위에 있는 포식자로 인지했다."
10035100-118 = "그래서 행동하는 데 이상이 생겼다는 거야."
10035100-119 = "……이거 정말 사람을 보고 그런 거 맞아?"
10035100-125 = "[ns] \"…….\""
10035100-126 = "그, 그게 가능한 일인가요?!"
10035100-128 = "메카 악어의 행동 알고리즘은 실제 악어의 것을 본따 만들었으니까."
10035100-129 = "실제 악어에게도 상위 포식자로 인식될 만한 대상이라면 이런 일이 일어나는 것도 무리가 아니긴 한데……."
10035100-130 = "아니, 아니, 국장은 사람이잖아."
10035100-131 = "아무리 표정이 무섭다지만 이게 말이 되는 일이냐고."
10035100-137 = "……후후."
10035100-138 = "국장?"
10035100-139 = "후후후후……."
10035100-140 = "그래, 뭐, 이런 일도 있을 수 있겠지."
10035100-141 = "국장님……괜찮으세요?"
10035100-142 = "괜찮고 말고가 있겠나, 키리노 경관? 내 인상이 안 좋다는 건 내가 제일 잘 알고 있다."
10035100-143 = "이번에는 특수한 상황이라 다행히 도움이 되었지만, 다음에 또 대민 업무가 있다면 역시 사양해야겠군."
10035100-144 = "시민들을 겁먹게 만들어서는 안 되니 말이야. 후후."
10035100-150 = "얼굴 펴라, 키리노, 후부키. 사람에게는 각자 어울리는 자리가 있는 법이다. 각자의 자리에서 각자의 역할을 다하면 되는 것 아니겠나."
10035100-151 = "내게는 워터파크보다는 취조실이 어울릴 뿐이다."
10035100-152 = "결론을 내고 나니 후련하군."
10035100-153 = "……."
10035100-154 = "미친개, 후련한 사람치고는 표정이 안 좋잖냐."
10035100-155 = "조용히 해."
10035100-156 = "그럼 마지막 뒷정리를 돕도록 하지."
10035100-157 = "나는 부서진 잔해들을 치울 테니, 키리노와 후부키는 사람들을—"
10035100-162 = "저기……."
10035100-167 = "어라?"
10035100-168 = "응? 아까 국장이 구해준 아이잖아? 무슨 볼일이라도?"
10035100-172 = "라이프가드 언니……."
10035100-175 = "음?"
10035100-176 = "나 말인가?"
10035100-177 = "(끄덕끄덕)"
10035100-178 = "무슨 일이지? 혹시 나 때문에 부상이라도 당했나?"
10035100-179 = "(도리도리)"
10035100-180 = "그러면?"
10035100-181 = "저어……."
10035100-186 = "구해주셔서 고마워요!"
10035100-190 = "저, 저 아까 악어가 너무 무서워서, 그래서……."
10035100-191 = "아무것도 못 하고 서 있었는데……."
10035100-192 = "언니가 뛰, 뛰어와서 구해주셨어요! 그래서……고마워요! 감사합니다, 언니!"
10035100-196 = "그런가."
10035100-201 = "안 다쳤으면 됐다."
10035100-202 = "다행이다."
10035100-211 = "선생님? 지금 뭘 하신……?"
10035100-212 = "[s3] \"칸나의 미소를 담았어.\"\n[s4] \"칸나의 마음을 찍었어.\""
10035100-215 = "……무슨 말씀이신지 모르겠습니다."
10035100-216 = "[s] \"자, 직접 봐.\""
10035100-217 = "그건 무슨……."
10035100-222 = "[ns] \"어때, 잘 나왔지?\""
10035100-224 = "[ns5] \"칸나에게도 훌륭한 라이프가드의 자질이 있어.\"\n[ns6] \"칸나에게도 훌륭한 생활안전국 요원의 자질이 있어.\""
10035100-229 = "……후후."
10035100-230 = "선생님, 또 그런 말씀을 하시는군요."
10035100-231 = "말씀드렸다시피, 제가 시민 대응에 소질이 없다는 건 잘 알고 있습니다."
10035100-232 = "오늘도 상당히 부족했고 말입니다."
10035100-233 = "다만……."
10035100-234 = "만에 하나, 제가 그래도 된다면……."
10035100-235 = "라이프가드 임무, 조금 더…… 조금만 더 노력해 보고 싶습니다."
10035100-236 = "네, 그런 마음이 들었습니다."
