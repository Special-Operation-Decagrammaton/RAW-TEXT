[translation]
12015-2 = "으응……."
12015-3 = "1중대 전투불능입니다! 퇴각 후 재정비하겠습니다!"
12015-4 = "3중대 반파! 보급을 위해 일단 퇴각합니다!"
12015-5 = "……."
12015-6 = "흐음. 대충 알겠네요. 샬레와는 어느 정도의 병력교환비를 상정해야 할지……."
12015-7 = "예상을 상회하는 힘…… 대단하네요."
12015-8 = "얕본 건 아니지만, 더 신중하게 접근해야 했었어요."
12015-9 = "하지만 결코 무적은 아닙니다. 약점도 보였고요. 어떻게 해야 이길 수 있을지 ……알 것 같아요."
12015-10 = "여기서 조금만 더 밀어붙인다면 분명……. 꺾을 수 있을 것 같아요."
12015-13 = "자아, 후방 대기 8중대, 돌입입니다."
12015-15 = "선도부 병력, 3차 충원입니다!"
12015-16 = "하아…… 하아…… 또?!"
12015-17 = "여기서 더?!"
12015-18 = "이, 이 정도야 아무 것도 아니야! 더 싸울 수 있다고!"
12015-19 = "그건 그렇지만……. 아코의 권한으로 움직일 수 있는 숫자를 넘어섰어. 그렇다는 건 이 습격은 아코의 독단이 아니라……."
12015-20 = "……선도부장이?"
12015-21 = "뭐?! 히나가 여기 온다고?! 도, 도망쳐, 얼른!!"
12015-22 = "아니, 그런 말은 하지 않았어, 사장……. 진정해……."
12015-26 = "(저벅- 저벅- 저벅- 저벅- 저벅- 저벅-)"
12015-28 = "후후…… 여기서부터는 저도 아직 가보지 못한 영역……."
12015-29 = "부장님께 걸리면 이오리와 함께 사이좋게 반성문 작성이겠네요……."
12015-30 = "자아, 그럼…… 세 번째 교전이겠네요. 선도부, 공격하……."
12015-31 = "(치익)"
12015-33 = "아코."
12015-34 = "……응?"
12015-35 = "히, 히, 히나 부장님?!"
12015-37 = "부장?"
12015-38 = "저, 저 녀석이……? 부장이라면 선도부장……?"
12015-39 = "부, 부, 부장님이 지금 이 시간에 왜……?"
12015-40 = "아코. 지금 어디야?"
12015-41 = "저, 저요? 저는…… 그, 그러니까…… 그게…… 네! 게, 게헨나 근교에 있는 시내예요! 네, 선도부원들과 함께 정기 순시를……."
12015-42 = "거짓말이잖아!!"
12015-43 = "역시 행정관 독단의 행동이었나보네요……."
12015-44 = "그, 그건 그렇고 부장님은 이 시간에 왜…… 추, 출장가신다는 건 어떻게 되셨어요?"
12015-45 = "음. 이제 막 도착했어."
12015-46 = "아, 그렇군요, 부장님! 제가 지금 처리해야 할 일이 있어서……. 조금 뒤에 연락드릴게요! 바, 바빠서, 지금은!"
12015-47 = "바쁜 일……? 정기 순시 중에 바쁘다니 별일이 다 있군. 무슨 일이지?"
12015-48 = "네? 그, 그러니까……. 그게……."
12015-49 = "타 자치구에서 부원을 멋대로 운용하는 일…… 같은 건가?"
12015-50 = "……네?"
12015-56 = "……어라?"
12015-57 = "?!"
12015-58 = "우, 우와!?"
12015-59 = "?!"
12015-60 = "부, 부, 부, 부장?! 어, 언제?!"
12015-61 = "!!"
12015-62 = "……."
12015-64 = "푸에훙-?!"
12015-66 = "……."
12015-67 = "……잘 설명해야 할 거야. 아코. 이 상황을."
12015-69 = "다음화;게헨나의 선도부장"
