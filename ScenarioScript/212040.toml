212040-1 = "#title;제4화;하나 된 게헨나"
212040-2 = "#place;만마전 작전회의실"
212040-3 = "3;마코토;99\n#3;a\n#wait;1200"
212040-4 = "3;마코토;00;자유라는 명목으로 낭비되던 자원들을 전부 회수한다.\n#3;em;[반응]"
212040-5 = "3;마코토;01;이제 모든 물자는 게헨나의 성전을 위해서만 존재할 것이다."
212040-6 = "#all;hide"
212040-7 = "#wait;500"
212040-8 = "#wait;1200"
212040-9 = "#wait;1000"
212040-10 = "5;만마전 3학년 학생;01\n3;만마전 3학년 학생;01\n1;만마전 3학년 학생;01\n#3;a\n#1;a\n#5;a\n#1;h\n#3;h\n#5;h\n#wait;1500"
212040-11 = "#1;hide\n#5;hide\n3;게헨나 학생;04\n#3;em;[?!]\n#3;shake\n#wait;1000"
212040-12 = "#all;hide"
212040-13 = "#wait;500"
212040-14 = "3;마코토;00;자치구의 모든 상권을 폐쇄하고, 모든 식량과 탄약을 군수 창고로 집결시키도록.\n#3;em;[반응]\n#3;a"
212040-15 = "3;마코토;01;현재로서는 저장 공간이 부족할 테니, 온천개발부에게 지시해서 8개의 신규 창고를 건설한다."
212040-16 = "3;마코토;99;부지는 학원 동편의 학생 공원이 적절할 터다. 이 몸이 설립한 곳이지만, 무제한 총력전의 상황에 근린 시설 따위는 필요 없으니."
212040-17 = "3;마코토;02;또한 전쟁이 시작되기 직전까지 학원 전역의 출입을 통제하고, 외부 기지국으로 향하는 신호에 패러데이 차폐를 즉각적으로 실시하도록."
212040-18 = "3;만마전 부원;07;네, 빈틈없이 수행하겠습니다!\n#3;greeting\n#fontsize;80"
212040-19 = "#st;[0,0];instant;1;"
212040-20 = "#clearST"
212040-21 = "3;만마전 부원;01\n#3;dl\n#wait;2000"
212040-22 = "#all;hide"
212040-23 = "3;마코토;99;키보토스 전체를 상대로 벌이는 전쟁은 분명 쉬운 일은 아니다.\n#3;em;…\n#3;a"
212040-24 = "3;마코토;23;하지만 불가능한 것도 아니지."
212040-25 = "#st;[0,0];instant;1;"
212040-26 = "#clearST"
212040-27 = "3;마코토;10\n#3;m4\n#wait;1200"
212040-28 = "3;마코토;17;히나, 준비는?\n#3;em;[반응]"
212040-29 = "#st;[0,0];instant;1;"
212040-30 = "#clearST"
212040-31 = "3;마코토;17\n#3;d\n#wait;1200"
212040-32 = "#all;hide"
212040-33 = "5;히나;01\n1;아코;00\n#1;a\n#5;a\n#1;h\n#5;h\n#wait;1200"
212040-34 = "5;히나;02;각 학원의 지휘부 타격 작전은 설립 완료. 성공적으로 기습할 시 모두 30분 안에 궤멸 가능해.\n#5;em;[반응]"
212040-35 = "1;아코;08;탄약 소모율 시뮬레이션 결과, 현재 비축량으로 각 학원 중심부에 대해 총 48시간의 초토화 포격이 가능합니다.\n#1;em;[반짝]"
212040-36 = "1;아코;07;자치구 전역의 탄약을 징발할 경우에는 훨씬 더 오랫동안 전투를 지속할 수 있겠지만, 애초에 그런 상황까지 가지도 않을 테니까요."
212040-37 = "5;히나;99;강자라 불리는 이들은 그냥 내버려둔다.#n포화를 퍼부어 약해진 상태에서는 내가 나서서 처리하면 될 테고."
212040-38 = "5;히나;01;어차피 전쟁 자체가 빠르게 결착 난다면, 개인으로서의 저항은 의미 없는 일이야."
212040-39 = "#all;hide"
212040-40 = "3;마코토;03;키시싯, 역시 소라사키 히나다. 평소엔 그토록 귀찮아하더니, 정복이라는 목표가 덧씌워지니 잔인할 정도로 유능해지는군.\n#3;em;[재잘]"
212040-41 = "5;히나;01;올바른 목적의식이라는 거겠지.\n#5;al\n#3;m1"
212040-42 = "5;히나;99;지금 내 머릿속엔 오직 키보토스의 지도를 게헨나의 깃발로 물들일 생각뿐이니까."
212040-43 = "3;마코토;10;키킥. 훌륭하다."
212040-44 = "#st;[0,0];instant;1;"
212040-45 = "#clearST"
212040-46 = "#all;hide"
212040-47 = "#wait;1500"
212040-48 = "3;쇼코;S2_01\n#3;a\n#wait;1500"
212040-49 = "3;쇼코;S2_02;외람되지만 한 말씀 올려도 되겠습니까?\n#3;em;[?]"
212040-50 = "#all;hide"
212040-51 = "3;마코토;03;이가라시 쇼코, 우리의 작전 참모가 아닌가. 얼마든지 말하도록.\n#3;em;[반응]"
212040-52 = "1;쇼코;S2_02;현재 게헨나가 준비할 수 있는 무력만으로는 키보토스 전역에서 발생할 수 있는 의외의 상황에 대응하기가 어렵겠다는 생각도 듭니다.\n#1;ar\n#3;m5"
212040-53 = "1;쇼코;S2_01;한 번의 공격으로 적들의 전의를 상실시킬 수 있는, 강력한 전략 병기가 있으면 수월할 것입니다."
212040-54 = "3;마코토;99;아아, 안 그래도 고려하고 있었다."
212040-55 = "3;마코토;03;천재적인 공학자이자 발명가인 뇌제가 만든 전쟁 병기들. 이번에는 더욱 발전한 형태로 제작하도록 하지."
212040-56 = "1;히나;02;가능한가? 뇌제의 유산은 모조리 파괴했을 텐데. 그 누구도 아닌 너와 내가.\n#1;em;[?]"
212040-57 = "3;마코토;10;키킥…… 나를 누구라고 생각하는 거냐, 소라사키 히나.\n#3;em;[재잘]"
212040-58 = "3;마코토;17;게헨나의 누구보다 그에 대해 잘 알고 있는 자가 바로 이 몸이다. 하나하나 철저하게 분석했지."
212040-59 = "3;마코토;23;뇌제와 맞서기 위해 기울였던 노력이 이제는 역으로 우리의 힘이 되어준다니, 아이러니하군.#n키시싯."
212040-60 = "1;히나;99;……그렇다면 다행이고."
212040-61 = "#all;hide"
212040-62 = "3;쇼코;S2_07;역시 마코토 의장님께서는 빈틈이 없으십니다.#n그렇다면, 저 위대한 뇌제의 불꽃이 다시 살아나겠군요."
212040-63 = "#all;hide"
212040-64 = "1;히나;01\n5;마코토;03;키킥, 사용할 수 있는 것을 상황에 맞춰 사용할 뿐이다.\n#5;em;[반응]"
212040-65 = "5;마코토;01;그나저나 선도부와 재흥위조차 이토록 게헨나를 위해 노력하고 있는데, 만마전의 임원들은 모두 어디를 갔는지 모르겠군."
212040-66 = "1;히나;02;각자의 역할을 하느라 바쁘지 않겠어?"
212040-67 = "5;마코토;99;아아…… 어째서인지는 모르겠지만, 이번 선언에 대해 후배들 쪽에서 반발이 있어서 말이다.\n#5;em;…"
212040-68 = "1;히나;99;……우리도 마찬가지야. 의견이 하나로 모이지 않더군."
212040-69 = "5;마코토;05;쯧. 대체 왜 큰 뜻을 깨닫지 못하냐는 말이다."
212040-70 = "5;마코토;01;전쟁은 안 된다느니 하는 약한 소리만 늘어놓고. 요즘 녀석들은……."
212040-71 = "#all;hide"
212040-72 = "3;아코;99;상황이 바뀌었으니 입장도 바뀌는 것이 당연한데, 답답한 일이에요.\n#3;em;[한숨]"
212040-73 = "3;쇼코;S2_00;깨달음을 얻지 못한 이들은 큰 그림을 볼 수 없으니, 당연히 혼란스러워할 것입니다.\n#3;em;[반응]"
212040-74 = "3;쇼코;S2_01;투쟁에 앞서 내부 단속을 진행하는 것도 고려해 볼 필요가 있습니다."
212040-75 = "3;마코토;10;키시싯. 옳은 생각이다. 모두가 하나로 뭉쳐야 진정으로 강해질 터.\n#3;em;[재잘]"
212040-76 = "#all;hide"
212040-77 = "#wait;2000"
212040-78 = "3;게헨나 학생;04\n#3;em;…\n#3;a\n#wait;2500"
212040-79 = "5;만마전 부원;00;그러니, 지금부터 모든 탄약을 제1 군수 창고로 징발한다.\n#5;em;[반응]\n#5;al\n#3;m1"
212040-80 = "3;게헨나 학생;06;에, 나 이거 어제 산 건데?\n#3;stiff"
212040-81 = "5;만마전 부원;01;언제 샀든 상관없어. 설마 지금이 얼마나 중요한 상황인지 이해하지 못하고 있나?"
212040-82 = "3;게헨나 학생;04;뭐, 뭔데? 중요한 상황이든 뭐든 내 탄약을 왜 가져가는 건데?\n#3;em;[땀]"
212040-83 = "5;만마전 부원;07;전시 상황이니까! 곧 게헨나의 총력전이 펼쳐질 거라고!\n#5;hophop"
212040-84 = "3;게헨나 학생;05;그러니까 그게 나랑 무슨 상관이냐고~?\n#3;em;[빠직]"
212040-85 = "#st;[0,0];instant;1;"
212040-86 = "#clearST"
212040-87 = "#all;hide"
212040-88 = "#wait;1000"
212040-89 = "1;선도부원;00\n5;선도부원;00\n3;선도부원;00\n#1;a\n#3;a\n#5;a\n#1;h\n#3;h\n#5;h\n#wait;1500"
212040-90 = "3;선도부원;02;거기까지. 그 이상의 저항은 전시 비상 규정 위반으로 간주하겠어.\n#3;em;[반응]"
212040-91 = "#st;[0,0];instant;1;"
212040-92 = "#clearST"
212040-93 = "#1;hide\n#5;hide\n3;게헨나 학생;02\n#3;em;[!]\n#3;h\n#wait;1000"
212040-94 = "3;게헨나 학생;03;어? 선도부? 잘됐다! 이거 봐, 갑자기 내 탄약을 뺏으려고 한다니까? 어떻게 좀 해줘!\n#3;hophop"
212040-95 = "1;선도부원;02;게헨나 전시 비상 계엄법 제8조. <학원의 존립이 걸린 성전(聖戰) 상황 시, 가용 가능한 모든 탄약은 게헨나 통합 군수 사령부로 귀속된다.> 예외는 없어.\n#1;ar\n#3;m5"
212040-96 = "3;게헨나 학생;04;……뭐? 아니, 언제 그런 조항이 생겼어……? 원래 그런 거 없었잖아?\n#3;em;[?!]\n#3;shake"
212040-97 = "1;선도부원;01;과거의 무질서와 지금을 비교하지 마. 지금 게헨나의 목표는 키보토스를 상대로 한 온전한 총력전이니까. 당연히 사적인 소유권보다 우선되어야 하고."
212040-98 = "5;만마전 부원;00;들었지? 선도부장과 우리 의장님이 합의하신 사항이라고. 자, 순순히 내놓으시지?\n#5;em;[반응]\n#5;al\n#3;m3"
212040-99 = "5;만마전 부원;01;아니면 배반자로 낙인찍혀서 저 무시무시한 선도부 감옥에 입소하고 싶어?"
212040-100 = "3;게헨나 학생;06;배, 배반자라니…… 그냥 내 탄약인데…….\n#3;em;[속상함]\n#3;stiff"
212040-101 = "#st;[0,0];instant;1;"
212040-102 = "#clearST"
212040-103 = "1;선도부원;02\n5;만마전 부원;01\n3;게헨나 학생;06\n#1;m2\n#3;h\n#5;h\n#1;h\n#wait;1200"
212040-104 = "#1;hide\n#5;hide\n3;선도부원;02;자진해서 탄약을 반납하는 학생에게는 '전시 공헌 마일리지'가 지급될 예정이야.#n마일리지는 익숙하겠지?\n#3;em;[반응]\n#3;closeup"
212040-105 = "3;선도부원;08;하지만 거부한다면…… 지금 이 자리에서 전략 물자 은닉죄로 즉결 처분할 수도 있어.\n#3;closeup"
212040-106 = "#st;[0,0];instant;1;"
