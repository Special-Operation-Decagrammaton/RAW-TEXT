[translation]
212040-1 = "第4話;合而為一的格黑娜"
212040-2 = "萬魔殿．作戰會議室"
212040-3 = ""
212040-4 = "將以自由為名浪費掉的資源全部回收。"
212040-5 = "今後所有物資都只為格黑娜的聖戰而存在。"
212040-10 = ""
212040-11 = ""
212040-14 = "封鎖自治區的所有商圈，將所有糧食和彈藥集中到軍需倉庫。"
212040-15 = "目前的儲存空間應該不夠，命令溫泉開發部新建8座倉庫。"
212040-16 = "用地就選學園東側的學生公園吧。#n雖然那是本大人設立的地方，但在無限制總力戰之下，根本不需要什麼鄰里設施。"
212040-17 = "此外，在戰爭開始前管制整個學園的出入，#n並對傳往外部基地台的訊號立即實施法拉第屏蔽。"
212040-18 = "是，我們會確實執行的！"
212040-19 = ""
212040-21 = ""
212040-23 = "以整個奇普托斯為對手的戰爭，確實不是件容易的事。"
212040-24 = "但也並非不可能。"
212040-25 = ""
212040-27 = ""
212040-28 = "陽奈，準備得如何？"
212040-29 = ""
212040-31 = ""
212040-33 = ""
212040-34 = "各學園指揮部的打擊作戰已擬定完成。#n奇襲成功的話，全部都能在30分鐘內殲滅。"
212040-35 = "彈藥消耗率的模擬結果顯示，#n以目前的儲備量，可以對各學園中樞進行總計48小時的焦土砲擊。"
212040-36 = "若徵收整個自治區的彈藥，就能讓戰鬥持續更久。#n不過，我想應該不會演變到那種地步吧。"
212040-37 = "被稱為強者的那些人就先不管。#n等砲火削弱他們之後，再由我出手處理就行了。"
212040-38 = "反正如果戰爭本身很快就能分出勝負，個人的抵抗是沒有意義的。"
212040-40 = "嘰嘻嘻，不愧是空崎陽奈。#n平常明明那麼嫌麻煩，一旦套上征服這個目標，就變得能幹到近乎殘酷了啊。"
212040-41 = "這就是所謂正確的目標意識吧。"
212040-42 = "因為現在我腦中想的，只有用格黑娜的旗幟染遍奇普托斯的地圖。"
212040-43 = "嘻嘻。很好。"
212040-44 = ""
212040-48 = ""
212040-49 = "恕我冒昧，可以容我說一句嗎？"
212040-51 = "五十嵐翔子，你可是我們的作戰參謀啊。儘管說吧。"
212040-52 = "我認為僅憑格黑娜目前能準備的武力，#n恐怕難以應對奇普托斯各地可能發生的意外狀況。"
212040-53 = "如果有能一擊就讓敵人喪失戰意的強力戰略兵器，事情就會輕鬆許多。"
212040-54 = "啊啊，這點我早就考慮過了。"
212040-55 = "身為天才工程師兼發明家的雷帝所打造的戰爭兵器。#n這次就讓它們以更進化的形式製造出來吧。"
212040-56 = "做得到嗎？雷帝的遺產應該已經全部被你跟我親手摧毀了才對。"
212040-57 = "嘻嘻……你以為我是誰啊，空崎陽奈。"
212040-58 = "在格黑娜比任何人都更了解那些東西的，正是本大人。#n我可是一樣一樣徹底分析過了。"
212040-59 = "為了對抗雷帝所付出的努力，如今反而成了我們的力量，真是諷刺啊。嘰嘻嘻。"
212040-60 = "……那就好。"
212040-62 = "真琴議長果然滴水不漏。#n這麼一來，那偉大的雷帝之火就要再次復燃了呢。"
212040-64 = "嘰嘻嘻，只不過是依照情況使用能用的東西罷了。"
212040-65 = "連風紀委員會和再興委員會都這樣為格黑娜努力了，#n萬魔殿的幹部們到底都跑哪去了。"
212040-66 = "不是都忙著各自的工作嗎？"
212040-67 = "啊啊……雖然不知道為什麼，但後輩們對這次的宣言有所反彈。"
212040-68 = "……我們也一樣。意見沒辦法統一。"
212040-69 = "嘖。到底為什麼不能理解這遠大的志向。"
212040-70 = "淨說些不能打仗之類的喪氣話。#n現在的年輕人真是……"
212040-72 = "情況改變了，立場自然也該跟著改變……真是令人著急。"
212040-73 = "未能覺悟的人看不見大局，自然會感到混亂。"
212040-74 = "在鬥爭之前，也有必要考慮整頓內部。"
212040-75 = "嘰嘻嘻。說得對。大家團結一心，才能真正變得強大。"
212040-78 = ""
212040-79 = "所以從現在開始，所有彈藥都要徵收到第1軍需倉庫。"
212040-80 = "咦，這是我昨天才買的耶？"
212040-81 = "什麼時候買的都無所謂。#n你該不會不明白現在是多麼重要的狀況吧？"
212040-82 = "什，什麼啊？管它重不重要，為什麼要拿走我的彈藥啦？"
212040-83 = "因為現在是戰爭時期！格黑娜的總力戰馬上就要展開了！"
212040-84 = "所以說那跟我有什麼關係啦～？"
212040-85 = ""
212040-89 = ""
212040-90 = "到此為止。再繼續抵抗，就視為違反戰時緊急規定。"
212040-91 = ""
212040-93 = ""
212040-94 = "咦？風紀委員會？太好了！#n你看，他們突然要搶我的彈藥耶！快想想辦法啦！"
212040-95 = "格黑娜戰時緊急戒嚴法第8條。#n「在攸關學園存亡的聖戰狀況下，所有可用彈藥皆歸屬格黑娜統合司令部」。"
212040-96 = "什麼？等等，什麼時候有那種條文了……？#n以前根本沒有吧？"
212040-97 = "別拿過去的無秩序和現在比較。#n現在格黑娜的目標，是對奇普托斯發動全面總力戰，當然要優先於私人所有權。"
212040-98 = "聽到了吧？這是風紀委員長和我們議長大人協議好的。#n來，乖乖交出來吧？"
212040-99 = "還是你想被烙上叛徒的印記，然後關進那座可怕的風紀委員會監獄？"
212040-100 = "叛，叛徒什麼的……我只是想留著自己的彈藥而已……"
212040-101 = ""
212040-103 = ""
212040-104 = "主動繳回彈藥的學生，將會獲得「戰時貢獻里程」。#n里程你應該很熟悉吧？"
212040-105 = "但你如果選擇拒絕……我也可以當場以隱匿戰略物資罪即刻處分。"
212040-106 = ""
212040-108 = ""
212040-109 = "知，知道了啦。交出來就行了吧。"
212040-110 = "真是的，大家好像都瘋了……"
212040-111 = ""
212040-113 = ""
212040-114 = "貢獻度受理完成。下一位，保持隊列，動作快。"
212040-115 = ""
212040-117 = ""
212040-119 = ""
212040-120 = "……"
212040-124 = "喂，你看到了嗎？風紀委員會和萬魔殿前輩們的眼神……很不尋常。"
212040-126 = "就是說啊。#n剛才被搶彈藥的時候要是多說一句，大概馬上就會挨子彈了吧？"
212040-127 = "不過……老實說雖然有點可怕，但你不覺得某種意義上有點厲害嗎？"
212040-128 = ""
212040-131 = ""
212040-132 = "嗯？什麼？"
212040-133 = "萬魔殿和風紀委員會一起做事啊。#n我入學以來第一次看到。"
212040-134 = "啊，那倒是。大概是格黑娜史上頭一遭吧。#n感情很好的萬魔殿和風紀委員會耶。"
212040-136 = "喂，不過啊。征服奇普托斯這件事……說不定真的辦得到吧？"
212040-137 = "那兩個人要是真的聯手下定決心，說不定有可能……？"
212040-139 = "也是……剛才你有看到練兵場上停的那些戰車嗎？#n學園本來有那麼多戰車嗎……？"
212040-140 = "不過……我們為什麼突然要打仗啊？#n我只是喜歡隨心所欲地玩而已……"
212040-142 = "我一開始也是那樣想的。#n不過就算說是戰爭，好像也沒有多可怕吧？"
212040-143 = "不就是把平常那樣開槍、引爆的事，拿到其他學園去做而已嗎？"
212040-144 = ""
212040-147 = ""
212040-148 = "就是說啊。總覺得好像身處某種驚人的歷史現場……"
212040-149 = "而，而且總比被當成叛徒好吧。"
212040-150 = "……好像也是？#n大家都那麼拚命地在準備，只有我唱反調的話，不知道之後會怎麼樣……"
212040-152 = "而且我一直都想用迫擊砲轟轟看三一的建築。"
212040-154 = "啊。我也是。"
212040-155 = "我的話，就是之前去百鬼夜行時看到的那棵神木。#n有點好奇把它燒掉會怎樣。"
212040-156 = "戰爭……說不定意外地還不錯……？"
212040-158 = "就是說啊。只要照吩咐去做，應該就沒問題了吧？"
212040-160 = "沒錯。前輩們會那樣做，一定有什麼想法吧。"
212040-161 = ""
212040-168 = ""
212040-169 = "……"
212040-170 = "……"
212040-171 = "我說，委員長。"
212040-172 = "嗯。"
212040-173 = "我們……一直想打造一個合而為一的格黑娜吧。"
212040-174 = "萬魔殿和風紀委員會不再爭吵，學生們一起朝著學園目標前進的那種樣子。"
212040-175 = "……嗯，是啊。"
212040-176 = "讓留級生、問題學生，大家都能在格黑娜的旗幟下感到驕傲……#n我們夢想的是那樣偉大的學園。"
212040-177 = "這就是那個偉大的格黑娜……嗎？"
212040-178 = "我……"
212040-179 = "我已經搞不懂了……"
212040-180 = "……"
212040-181 = ""
212040-183 = ""
212040-185 = "那就只能去問問看了。"
212040-186 = ""
212040-188 = ""
212040-190 = "下一話;我要退出"
