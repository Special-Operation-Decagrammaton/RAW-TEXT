212040-131 = "3;게헨나 2학년 학생 A;01\n#3;em;[?]\n#3;h\n#wait;1000"
212040-132 = "3;게헨나 2학년 학생 A;02;응? 뭐가?"
212040-133 = "5;게헨나 2학년 학생 C;01;만마전이랑 선도부가 같이 뭐 하는 거. 나 입학하고 처음 봐.\n#5;al\n#3;m1"
212040-134 = "3;게헨나 2학년 학생 A;08;아, 그건 그렇지. 아마 게헨나 역사상 처음 있는 일일 걸. 사이 좋은 만마전이랑 선도부라니."
