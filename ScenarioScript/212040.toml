212040-108 = "3;게헨나 학생;04\n#3;em;[?!]\n#3;shake\n#3;closeup\n#wait;1000"
212040-109 = "3;게헨나 학생;04;……아, 알았어. 주면 될 거 아냐.\n#3;stiff\n#3;closeup"
212040-110 = "3;게헨나 학생;06;진짜, 다들 미친 거 같아…….\n#3;em;[속상함]\n#3;closeup\n#fontsize;50"
212040-111 = "#st;[0,0];instant;1;"
212040-112 = "#clearST"
212040-113 = "3;선도부원;01\n#3;greeting\n#3;h\n#wait;1300"
212040-114 = "3;선도부원;02;공헌도 접수 완료. 자, 다음, 신속하게 대열을 유지하도록.\n#3;em;[반응]"
212040-115 = "#st;[0,0];instant;1;"
