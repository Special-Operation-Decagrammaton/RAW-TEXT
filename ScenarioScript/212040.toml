[translation]
212040-1 = "ตอนที่ 4;เกเฮนน่าที่รวมเป็นหนึ่ง"
212040-2 = "ห้องประชุมปฏิบัติการ แพนเดโมเนียม โซไซตี้"
212040-3 = ""
212040-4 = "เรียกคืนทรัพยากรทั้งหมดที่ถูกใช้อย่างสูญเปล่าในนามของเสรีภาพ"
212040-5 = "นับจากนี้ ทรัพยากรทั้งหมดจะมีไว้เพื่อสงครามศักดิ์สิทธิ์ของเกเฮนน่าเท่านั้น"
212040-10 = ""
212040-11 = ""
212040-14 = "สั่งปิดเขตการค้าทั้งหมดในเขตปกครองตนเอง รวบรวมอาหารกับกระสุนทั้งหมดไปไว้ที่คลังยุทโธปกรณ์"
212040-15 = "ในตอนนี้พื้นที่จัดเก็บคงไม่เพียงพอ จงสั่งให้ชมรมพัฒนาออนเซ็นสร้างคลังแห่งใหม่ 8 แห่ง"
212040-16 = "ใช้ที่ดินตรงสวนสาธารณะนักเรียนทางตะวันออกของโรงเรียนก็น่าจะเหมาะ ถึงจะเป็นที่ที่เราสร้างขึ้นเอง แต่ในสถานการณ์สงครามเต็มรูปแบบที่ไร้ขีดจำกัดนี้ เราไม่ต้องมีสิ่งอำนวยความสะดวกสาธารณะหรอก"
212040-17 = "นอกจากนี้ ให้ควบคุมการเข้าออกทั่วทั้งโรงเรียนจนถึงก่อนสงครามเริ่มต้น และปิดกั้นสัญญาณที่ส่งไป#nยังสถานีฐานภายนอกด้วยเกราะป้องกันแบบฟาราเดย์ทันที"
212040-18 = "ค่ะ จะดำเนินการอย่างรัดกุมเลยค่ะ!"
212040-19 = ""
212040-21 = ""
212040-23 = "สงครามที่เปิดฉากกับทั้งคิโวทอส ย่อมไม่ใช่เรื่องง่ายแน่นอน"
212040-24 = "แต่ก็ไม่ใช่ว่าจะเป็นไปไม่ได้"
212040-25 = ""
212040-27 = ""
212040-28 = "ฮินะ เตรียมการไปถึงไหนแล้ว?"
212040-29 = ""
212040-31 = ""
212040-33 = ""
212040-34 = "วางแผนปฏิบัติการโจมตีศูนย์บัญชาการของแต่ละโรงเรียนเรียบร้อย ถ้าจู่โจมสำเร็จ ทุกแห่งสามารถถูกทำลายได้ภายใน 30 นาที"
212040-35 = "จากผลจำลองอัตราการใช้กระสุน ด้วยปริมาณสำรองในปัจจุบัน เราสามารถระดมยิงถล่มพื้นที่#nศูนย์กลางของแต่ละโรงเรียนได้นานรวม 48 ชั่วโมงค่ะ"
212040-36 = "ถ้าใช้กระสุนจากทั่วทั้งเขตปกครองตนเอง ก็จะต่อสู้ได้นานกว่านั้นมาก แต่เราคงไม่ไปถึงจุดนั้นตั้งแต่แรกอยู่แล้วค่ะ"
212040-37 = "ส่วนพวกที่ถูกเรียกว่าผู้แข็งแกร่งก็ปล่อยไว้ก่อน พออ่อนกำลังลงจากการถูกระดมยิง ฉันค่อยออกไปจัดการเอง"
212040-38 = "ยังไงเสีย ถ้าสงครามตัดสินผลได้อย่างรวดเร็วละก็ การต่อต้านในระดับบุคคลก็ไร้ความหมาย"
212040-40 = "คิกคิกคิก สมกับเป็นโซระซากิ ฮินะ ปกติเห็นรำคาญไปเสียทุกอย่าง แต่พอถูกครอบด้วยเป้าหมายแห่ง#nการพิชิต ก็มีความสามารถจนถึงขั้นโหดเหี้ยมเลยนะ"
212040-41 = "คงเรียกว่ามีสำนึกต่อเป้าหมายที่ถูกต้องละมั้ง"
212040-42 = "ตอนนี้ในหัวฉันมีเพียงความคิดที่จะย้อมแผนที่คิโวทอสด้วยธงของเกเฮนน่าเท่านั้น"
212040-43 = "คิกคิก ยอดเยี่ยมมาก"
212040-44 = ""
212040-48 = ""
212040-49 = "ขออภัยที่เสียมารยาท แต่ฉันขอเสนอความเห็นสักข้อได้มั้ยคะ?"
212040-51 = "อิการาชิ โชโกะ เธอคือที่ปรึกษายุทธศาสตร์ของเรานี่ พูดมาได้เต็มที่เลย"
212040-52 = "ฉันคิดว่าลำพังกำลังรบที่เกเฮนน่าจัดเตรียมได้ในตอนนี้ อาจรับมือกับสถานการณ์ไม่คาดฝันที่อาจ#nเกิดขึ้นทั่วคิโวทอสลำบากอยู่ค่ะ"
212040-53 = "ถ้ามีอาวุธยุทธศาสตร์ทรงพลังที่ทำให้ศัตรูสูญเสียขวัญกำลังใจในการรบได้ด้วยการโจมตีในครั้งเดียว ทุกอย่างคงง่ายขึ้นค่ะ"
212040-54 = "อ้อ เรื่องนั้นเราก็กำลังพิจารณาอยู่พอดี"
212040-55 = "อาวุธสงครามที่ผู้เหี้ยมโหด ผู้เป็นทั้งวิศวกรและนักประดิษฐ์อัจฉริยะสร้างไว้ คราวนี้เราจะสร้างพวกมันขึ้นใหม่ในรูปแบบที่พัฒนากว่าเดิม"
212040-56 = "ทำได้เหรอ? มรดกของผู้เหี้ยมโหดน่าจะถูกทำลายไปจนหมดแล้วนี่ ด้วยมือของเธอกับฉันเอง"
212040-57 = "คิกคิก... คิดว่าเราเป็นใครกัน โซระซากิ ฮินะ"
212040-58 = "คนที่รู้เรื่องของผู้นั้นดีกว่าใครในเกเฮนน่าก็คือเราคนนี้ เราวิเคราะห์ทุกอย่างไว้อย่างละเอียดแล้ว"
212040-59 = "ความพยายามที่ทุ่มเทเพื่อต่อกรกับผู้เหี้ยมโหด กลับกลายมาเป็นพลังให้พวกเราในตอนนี้ ช่างย้อนแย้งเสียจริง คิกคิกคิก"
212040-60 = "ถ้างั้นก็ดี..."
212040-62 = "สมกับเป็นท่านประธานมาโคโตะ ไม่มีช่องโหว่เลยค่ะ ถ้างั้นเปลวเพลิงอันยิ่งใหญ่ของผู้เหี้ยมโหด#nก็จะกลับมาลุกโชนอีกครั้งสินะคะ"
212040-64 = "คิกคิก เราแค่หยิบสิ่งที่ใช้ได้มาใช้ให้เหมาะกับสถานการณ์ก็เท่านั้น"
212040-65 = "ว่าแต่ ทั้งคณะกรรมการวินัยกับคณะกรรมการฟื้นฟูยังทุ่มเทเพื่อเกเฮนน่าถึงเพียงนี้ แต่เหล่ากรรมการของแพนเดโมเนียม โซไซตี้กลับหายไปไหนกันหมดก็ไม่รู้"
212040-66 = "คงกำลังยุ่งกับหน้าที่ของตัวเองกันอยู่หรือเปล่า?"
212040-67 = "อ่า... ไม่รู้เหมือนกันว่าทำไม แต่ดูเหมือนพวกรุ่นน้องจะคัดค้านคำประกาศครั้งนี้น่ะ"
212040-68 = "ทางพวกเราก็เหมือนกัน... ความคิดเห็นไม่เป็นอันหนึ่งอันเดียวกันเลย"
212040-69 = "ชิ ทำไมถึงไม่เข้าใจอุดมการณ์อันยิ่งใหญ่กันเสียที"
212040-70 = "เอาแต่พูดอะไรอ่อนแออย่างห้ามทำสงครามอยู่ได้ เด็กรุ่นนี้นี่มัน..."
212040-72 = "เป็นเรื่องธรรมดาที่จุดยืนจะเปลี่ยนเมื่อสถานการณ์เปลี่ยนไป ช่างน่าอึดอัดจริงๆ ค่ะ"
212040-73 = "ผู้ที่ยังไม่ตระหนักถึงความจริงย่อมมองไม่เห็นภาพใหญ่ และเป็นธรรมดาที่จะรู้สึกสับสนค่ะ"
212040-74 = "ก่อนเริ่มการต่อสู้ เราควรพิจารณาเรื่องการจัดระเบียบภายในด้วยค่ะ"
212040-75 = "คิกคิกคิก เป็นความคิดที่ถูกต้อง ทุกคนต้องรวมเป็นหนึ่ง ถึงจะแข็งแกร่งอย่างแท้จริง"
212040-78 = ""
212040-79 = "เพราะงั้น ตั้งแต่นี้ไปเราจะเกณฑ์ยึดกระสุนทั้งหมดไปยังคลังยุทโธปกรณ์ที่ 1"
212040-80 = "หืม แต่นี่ฉันเพิ่งซื้อมาเมื่อวานเองนะ?"
212040-81 = "จะซื้อมาเมื่อไรก็ไม่เกี่ยว หรือว่าไม่เข้าใจว่าสถานการณ์ตอนนี้สำคัญแค่ไหน?"
212040-82 = "อะ... อะไรกัน? ต่อให้เป็นสถานการณ์สำคัญ แล้วทำไมต้องเอากระสุนของฉันไปด้วยล่ะ?"
212040-83 = "ก็เพราะตอนนี้อยู่ในภาวะสงครามไง! อีกไม่นานเกเฮนน่าจะเปิดฉากสงครามเต็มรูปแบบแล้ว!"
212040-84 = "แล้วมันเกี่ยวอะไรกับฉันด้วยล่ะ~?"
212040-85 = ""
212040-89 = ""
212040-90 = "พอแค่นั้น ถ้าขัดขืนมากกว่านี้จะถือว่าฝ่าฝืนข้อบังคับฉุกเฉินในภาวะสงครามนะ"
212040-91 = ""
212040-93 = ""
212040-94 = "เอ๋? นั่นคณะกรรมการวินัยเหรอ? มาพอดีเลย! ดูสิ อยู่ดีๆ พวกนี้ก็จะมาแย่งกระสุนของฉันไป ช่วยทำอะไรหน่อยสิ!"
212040-95 = "กฎอัยการศึกฉุกเฉินของเกเฮนน่า มาตรา 8 <ในสถานการณ์สงครามศักดิ์สิทธิ์ที่มีความอยู่รอดของ#nโรงเรียนเป็นเดิมพัน กระสุนทั้งหมดที่นำมาใช้ได้จะตกเป็นของกองบัญชาการยุทโธปกรณ์รวมของเกเฮนน่า> โดยไม่มีข้อยกเว้น"
212040-96 = "ว่าไงนะ...? เดี๋ยวก่อน มาตราแบบนั้นเกิดขึ้นตั้งแต่เมื่อไร...? เมื่อก่อนไม่เคยมีไม่ใช่เหรอ?"
212040-97 = "อย่าเอาความไร้ระเบียบในอดีตมาเทียบกับตอนนี้ เป้าหมายของเกเฮนน่าในเวลานี้คือการทำสงคราม#nเต็มรูปแบบกับคิโวทอส สิ่งนี้ย่อมต้องมาก่อนกรรมสิทธิ์ส่วนบุคคลอยู่แล้ว"
212040-98 = "ได้ยินแล้วใช่มั้ย? นี่เป็นเรื่องที่ประธานกรรมการวินัยกับท่านประธานของพวกเราตกลงกันแล้ว เอาละ ส่งมาซะดีๆ"
212040-99 = "หรือว่าอยากถูกตราหน้าว่าเป็นคนทรยศ แล้วเข้าไปอยู่ในคุกที่น่ากลัวของคณะกรรมการวินัยกันล่ะ?"
212040-100 = "คะ... คนทรยศอะไรกัน... มันก็แค่กระสุนของฉันเอง..."
212040-101 = ""
212040-103 = ""
212040-104 = "นักเรียนที่ส่งคืนกระสุนด้วยความสมัครใจจะได้รับ 'ไมล์สนับสนุนภาวะสงคราม'#nคุ้นเคยกับระบบไมล์อยู่แล้วใช่มั้ยล่ะ?"
212040-105 = "แต่ถ้าปฏิเสธ... ก็อาจถูกลงโทษตรงนี้ทันที ในข้อหาซุกซ่อนยุทธปัจจัยได้"
212040-106 = ""
212040-108 = ""
212040-109 = "ขะ... เข้าใจแล้วน่า ให้ก็ได้"
212040-110 = "จริงๆ เลย ทุกคนดูเหมือนจะเป็นบ้าไปกันหมดแล้ว..."
212040-111 = ""
212040-113 = ""
212040-114 = "บันทึกไมล์สนับสนุนเรียบร้อย เอาละ คนต่อไป รีบรักษาแถวให้เป็นระเบียบด้วยล่ะ"
212040-115 = ""
212040-117 = ""
212040-119 = ""
212040-120 = "..."
212040-124 = "นี่... เห็นสายตาของรุ่นพี่คณะกรรมการวินัยกับแพนเดโมเนียม โซไซตี้มั้ย? ดูท่าไม่ดีเลย"
212040-126 = "นั่นสิ ตอนมายึดกระสุน ถ้าพูดอีกแค่คำเดียวคงโดนยิงตรงนั้นแล้วมั้ง?"
212040-127 = "แต่ว่านะ... พูดตามตรงก็ดูน่ากลัวอยู่นิดหน่อย แต่ในอีกมุมหนึ่งก็ดูสุดยอดไปเลยนะ?"
212040-128 = ""
212040-131 = ""
212040-132 = "หืม? ตรงไหนกัน?"
212040-133 = "ก็การที่แพนเดโมเนียม โซไซตี้กับคณะกรรมการวินัยทำอะไรร่วมกันไง ตั้งแต่เข้าเรียนมา ฉันเพิ่งเคยเห็นเป็นครั้งแรกเลย"
212040-134 = "อ๊ะ เรื่องนั้นก็จริง คงเป็นครั้งแรกในประวัติศาสตร์เกเฮนน่าเลยมั้ง ที่แพนเดโมเนียม โซไซตี้ กับคณะกรรมการวินัยสนิทกันเนี่ย"
212040-136 = "นี่ ว่าแต่นะ เรื่องพิชิตคิโวทอสน่ะ... บางทีอาจทำได้จริงก็ได้นะ?"
212040-137 = "ถ้าทั้งสองฝ่ายจับมือกันแล้วเอาจริงขึ้นมา มันอาจจะเป็นไปได้ก็ได้...?"
212040-139 = "ก็จริง... เห็นรถถังที่จอดกองอยู่ในสนามฝึกเมื่อกี้มั้ย? ปกติโรงเรียนเรามีรถถังเยอะขนาดนั้นเลยเหรอ...?"
212040-140 = "แต่ว่า... ทำไมจู่ๆ พวกเราต้องไปทำสงครามด้วยล่ะ? ฉันแค่ชอบเที่ยวเล่นตามใจตัวเองเท่านั้นเอง..."
212040-142 = "ตอนแรกฉันก็คิดแบบนั้นนะ แต่ถึงจะเรียกว่าสงคราม มันก็คงไม่ได้น่ากลัวขนาดนั้นหรือเปล่า?"
212040-143 = "ก็แค่ยิงแล้วก็ระเบิดเหมือนทุกวัน แต่แค่เปลี่ยนไปทำกับโรงเรียนอื่นไม่ใช่เหรอ?"
212040-144 = ""
212040-147 = ""
212040-148 = "นั่นสิ รู้สึกเหมือนกำลังอยู่ในเหตุการณ์สำคัญทางประวัติศาสตร์เลยด้วย..."
212040-149 = "ละ... แล้วก็ดีกว่าถูกตราหน้าว่าเป็นคนทรยศนี่นา"
212040-150 = "คงงั้นมั้ง...? ทุกคนเตรียมตัวกันอย่างเอาเป็นเอาตายขนาดนั้น ถ้ามีแค่ฉันพูดขัดขึ้นมา ก็ไม่รู้ว่าทีหลังจะเจออะไรบ้าง..."
212040-152 = "แล้วฉันก็เคยอยากลองยิงปืนครกใส่อาคารทรีนิตี้ดูสักครั้งด้วย"
212040-154 = "อ๊ะ ฉันก็เหมือนกัน"
212040-155 = "ส่วนฉันสงสัยว่า ถ้าเผาต้นไม้ศักดิ์สิทธิ์ที่เราเห็นตอนไปเฮียกคิยาโคดูแล้วมันจะเป็นยังไง"
