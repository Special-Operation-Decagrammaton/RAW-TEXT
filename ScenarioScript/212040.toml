[translation]
212040-1 = "제4화;하나 된 게헨나"
212040-2 = "만마전 작전회의실"
212040-4 = "자유라는 명목으로 낭비되던 자원들을 전부 회수한다."
212040-5 = "이제 모든 물자는 게헨나의 성전을 위해서만 존재할 것이다."
212040-14 = "자치구의 모든 상권을 폐쇄하고, 모든 식량과 탄약을 군수 창고로 집결시키도록."
212040-15 = "현재로서는 저장 공간이 부족할 테니, 온천개발부에게 지시해서 8개의 신규 창고를 건설한다."
212040-16 = "부지는 학원 동편의 학생 공원이 적절할 터다. 이 몸이 설립한 곳이지만, 무제한 총력전의 상황에 근린 시설 따위는 필요 없으니."
212040-17 = "또한 전쟁이 시작되기 직전까지 학원 전역의 출입을 통제하고, 외부 기지국으로 향하는 신호에 패러데이 차폐를 즉각적으로 실시하도록."
212040-18 = "네, 빈틈없이 수행하겠습니다!"
212040-23 = "키보토스 전체를 상대로 벌이는 전쟁은 분명 쉬운 일은 아니다."
212040-24 = "하지만 불가능한 것도 아니지."
212040-28 = "히나, 준비는?"
212040-34 = "각 학원의 지휘부 타격 작전은 설립 완료. 성공적으로 기습할 시 모두 30분 안에 궤멸 가능해."
212040-35 = "탄약 소모율 시뮬레이션 결과, 현재 비축량으로 각 학원 중심부에 대해 총 48시간의 초토화 포격이 가능합니다."
212040-36 = "자치구 전역의 탄약을 징발할 경우에는 훨씬 더 오랫동안 전투를 지속할 수 있겠지만, 애초에 그런 상황까지 가지도 않을 테니까요."
212040-37 = "강자라 불리는 이들은 그냥 내버려둔다.#n포화를 퍼부어 약해진 상태에서는 내가 나서서 처리하면 될 테고."
212040-38 = "어차피 전쟁 자체가 빠르게 결착 난다면, 개인으로서의 저항은 의미 없는 일이야."
212040-40 = "키시싯, 역시 소라사키 히나다. 평소엔 그토록 귀찮아하더니, 정복이라는 목표가 덧씌워지니 잔인할 정도로 유능해지는군."
212040-41 = "올바른 목적의식이라는 거겠지."
212040-42 = "지금 내 머릿속엔 오직 키보토스의 지도를 게헨나의 깃발로 물들일 생각뿐이니까."
212040-43 = "키킥. 훌륭하다."
212040-49 = "외람되지만 한 말씀 올려도 되겠습니까?"
212040-51 = "이가라시 쇼코, 우리의 작전 참모가 아닌가. 얼마든지 말하도록."
212040-52 = "현재 게헨나가 준비할 수 있는 무력만으로는 키보토스 전역에서 발생할 수 있는 의외의 상황에 대응하기가 어렵겠다는 생각도 듭니다."
212040-53 = "한 번의 공격으로 적들의 전의를 상실시킬 수 있는, 강력한 전략 병기가 있으면 수월할 것입니다."
212040-54 = "아아, 안 그래도 고려하고 있었다."
212040-55 = "천재적인 공학자이자 발명가인 뇌제가 만든 전쟁 병기들. 이번에는 더욱 발전한 형태로 제작하도록 하지."
212040-56 = "가능한가? 뇌제의 유산은 모조리 파괴했을 텐데. 그 누구도 아닌 너와 내가."
212040-57 = "키킥…… 나를 누구라고 생각하는 거냐, 소라사키 히나."
212040-58 = "게헨나의 누구보다 그에 대해 잘 알고 있는 자가 바로 이 몸이다. 하나하나 철저하게 분석했지."
212040-59 = "뇌제와 맞서기 위해 기울였던 노력이 이제는 역으로 우리의 힘이 되어준다니, 아이러니하군.#n키시싯."
212040-60 = "……그렇다면 다행이고."
212040-62 = "역시 마코토 의장님께서는 빈틈이 없으십니다.#n그렇다면, 저 위대한 뇌제의 불꽃이 다시 살아나겠군요."
212040-64 = "키킥, 사용할 수 있는 것을 상황에 맞춰 사용할 뿐이다."
212040-65 = "그나저나 선도부와 재흥위조차 이토록 게헨나를 위해 노력하고 있는데, 만마전의 임원들은 모두 어디를 갔는지 모르겠군."
212040-66 = "각자의 역할을 하느라 바쁘지 않겠어?"
212040-67 = "아아…… 어째서인지는 모르겠지만, 이번 선언에 대해 후배들 쪽에서 반발이 있어서 말이다."
212040-68 = "……우리도 마찬가지야. 의견이 하나로 모이지 않더군."
212040-69 = "쯧. 대체 왜 큰 뜻을 깨닫지 못하냐는 말이다."
212040-70 = "전쟁은 안 된다느니 하는 약한 소리만 늘어놓고. 요즘 녀석들은……."
212040-72 = "상황이 바뀌었으니 입장도 바뀌는 것이 당연한데, 답답한 일이에요."
212040-73 = "깨달음을 얻지 못한 이들은 큰 그림을 볼 수 없으니, 당연히 혼란스러워할 것입니다."
212040-74 = "투쟁에 앞서 내부 단속을 진행하는 것도 고려해 볼 필요가 있습니다."
212040-75 = "키시싯. 옳은 생각이다. 모두가 하나로 뭉쳐야 진정으로 강해질 터."
212040-79 = "그러니, 지금부터 모든 탄약을 제1 군수 창고로 징발한다."
212040-80 = "에, 나 이거 어제 산 건데?"
212040-81 = "언제 샀든 상관없어. 설마 지금이 얼마나 중요한 상황인지 이해하지 못하고 있나?"
212040-82 = "뭐, 뭔데? 중요한 상황이든 뭐든 내 탄약을 왜 가져가는 건데?"
212040-83 = "전시 상황이니까! 곧 게헨나의 총력전이 펼쳐질 거라고!"
212040-84 = "그러니까 그게 나랑 무슨 상관이냐고~?"
212040-90 = "거기까지. 그 이상의 저항은 전시 비상 규정 위반으로 간주하겠어."
212040-94 = "어? 선도부? 잘됐다! 이거 봐, 갑자기 내 탄약을 뺏으려고 한다니까? 어떻게 좀 해줘!"
212040-95 = "게헨나 전시 비상 계엄법 제8조. <학원의 존립이 걸린 성전(聖戰) 상황 시, 가용 가능한 모든 탄약은 게헨나 통합 군수 사령부로 귀속된다.> 예외는 없어."
212040-96 = "……뭐? 아니, 언제 그런 조항이 생겼어……? 원래 그런 거 없었잖아?"
212040-97 = "과거의 무질서와 지금을 비교하지 마. 지금 게헨나의 목표는 키보토스를 상대로 한 온전한 총력전이니까. 당연히 사적인 소유권보다 우선되어야 하고."
212040-98 = "들었지? 선도부장과 우리 의장님이 합의하신 사항이라고. 자, 순순히 내놓으시지?"
212040-99 = "아니면 배반자로 낙인찍혀서 저 무시무시한 선도부 감옥에 입소하고 싶어?"
212040-100 = "배, 배반자라니…… 그냥 내 탄약인데……."
212040-104 = "자진해서 탄약을 반납하는 학생에게는 '전시 공헌 마일리지'가 지급될 예정이야.#n마일리지는 익숙하겠지?"
212040-105 = "하지만 거부한다면…… 지금 이 자리에서 전략 물자 은닉죄로 즉결 처분할 수도 있어."
212040-109 = "……아, 알았어. 주면 될 거 아냐."
212040-110 = "진짜, 다들 미친 거 같아……."
212040-114 = "공헌도 접수 완료. 자, 다음, 신속하게 대열을 유지하도록."
212040-120 = "……."
212040-124 = "……야, 봤어? 선도부랑 만마전 선배들 눈빛. 심상치 않아."
212040-126 = "그러게. 아까 탄약 뺏어갈 때 한마디만 더 했으면 바로 총 맞았을걸?"
212040-127 = "근데…… 솔직히 좀 무섭긴 한데, 한편으론 좀 대단하지 않아?"
212040-132 = "응? 뭐가?"
212040-133 = "만마전이랑 선도부가 같이 뭐 하는 거. 나 입학하고 처음 봐."
212040-134 = "아, 그건 그렇지. 아마 게헨나 역사상 처음 있는 일일 걸. 사이 좋은 만마전이랑 선도부라니."
212040-136 = "야, 근데 말이야. 키보토스 정복이라는 거…… 어쩌면 할 수 있는 거 아냐?"
212040-137 = "저 둘이 진짜로 손잡고 작정하면 가능할지도……?"
212040-139 = "하긴…… 아까 연병장에 쌓아둔 전차들 봤어? 원래 저렇게 학원에 전차가 많았나……?"
212040-140 = "그런데…… 우리가 왜 갑자기 전쟁을 해야 하는 건데?#n난 그냥 제멋대로 노는 게 좋았을 뿐인데……."
212040-142 = "나도 처음엔 그렇게 생각했거든? 근데 뭐, 전쟁이라고 해도 막 엄청 무서운 건 아니지 않나?"
212040-143 = "그냥 평소처럼 쏘고 터뜨리는 걸 다른 학원에 하는 거 아냐?"
212040-148 = "그러게. 뭔가 엄청난 역사의 현장에 있는 것 같기도 하고……."
212040-149 = "그, 그리고 배반자로 찍히는 것보단 낫잖아."
212040-150 = "……그렇겠지? 다들 저렇게 눈에 불을 켜고 준비하는데 나만 딴소리하면 나중에 어떻게 될지 모르니까……."
212040-152 = "그리고, 나 평소에 트리니티 건물에 박격포 한번 쏴보고 싶었거든."
212040-154 = "아. 나도."
212040-155 = "나는 그 우리 백귀야행 갔을 때 신목 있잖아. 그거 태우면 어떻게 될지 좀 궁금하더라."
212040-156 = "전쟁…… 의외로 괜찮을지도……?"
212040-158 = "그러니까. 그냥 시키는 대로 하면 괜찮지 않을까?"
212040-160 = "맞아. 선배들도 무슨 생각이 있으니까 저러겠지."
212040-169 = "……."
212040-170 = "……."
212040-171 = "있지, 회장."
212040-172 = "으응."
212040-173 = "우리…… 하나 된 게헨나를 만들고 싶어했잖아."
212040-174 = "만마전이랑 선도부가 싸우지 않고, 학생들이 학교의 목표를 향해 다 같이 나아가는 그런 모습 말이야."
212040-175 = "……응, 그랬지."
212040-176 = "낙제생도, 문제아도, 다 같이 게헨나의 깃발 아래서 자부심을 느끼는…… 그런 위대한 학교를 꿈꿨지."
212040-177 = "……이게 그 위대한 게헨나…… 맞을까?"
212040-178 = "나는……."
212040-179 = "나는 잘 모르겠어……."
212040-180 = "……."
212040-185 = "그럼, 가서 물어봐야지."
212040-190 = "다음화;그만둘래요"
