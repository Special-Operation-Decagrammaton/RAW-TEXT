212040-124 = "3;게헨나 2학년 학생 A;02;……야, 봤어? 선도부랑 만마전 선배들 눈빛. 심상치 않아. \n#3;em;[반응]\n#3;a"
212040-125 = "#all;hide"
212040-126 = "4;게헨나 2학년 학생 C;02\n2;게헨나 2학년 학생 B;04;그러게. 아까 탄약 뺏어갈 때 한마디만 더 했으면 바로 총 맞았을걸?\n#2;em;[속상함]"
212040-127 = "4;게헨나 2학년 학생 C;01;근데…… 솔직히 좀 무섭긴 한데, 한편으론 좀 대단하지 않아?"
