212040-118 = "#all;hide"
212040-119 = "1;게헨나 학생;04\n5;게헨나 학생;04\n3;게헨나 학생;04\n#1;em;…\n#5;em;…\n#3;em;…\n#1;a\n#3;a\n#5;a\n#1;h\n#3;h\n#5;h\n#wait;2500"
