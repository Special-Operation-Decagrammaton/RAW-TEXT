[translation]
212040-1 = "Episode 4;Gehenna United"
212040-2 = "Pandemonium Society Strategy Room"
212040-3 = ""
212040-4 = "Reclaim all supplies that were being wasted under the paltry excuse of \"freedom.\""
212040-5 = "From here on, all resources will exist solely for Gehenna's crusade."
212040-10 = ""
212040-11 = ""
212040-14 = "Shut down all commercial districts in Gehenna and focus all food and ammunition into military supply depots."
212040-15 = "Since we currently lack sufficient storage, we will order the Hot Springs Department to construct eight new warehouses."
212040-16 = "The student park located east of the academy should suffice. Since I originally built the park, I also deem the facility unnecessary for our war efforts."
212040-17 = "And until we publicly declare war, restrict access to all academies. Deploy Faraday shields over any outward-reaching signals, effective immediately."
212040-18 = "Understood!"
212040-19 = ""
212040-21 = ""
212040-23 = "Waging a war against all of Kivotos is no easy task."
212040-24 = "However, it is also not impossible."
212040-25 = ""
212040-27 = ""
212040-28 = "Hina, how are the preparations coming?"
212040-29 = ""
212040-31 = ""
212040-33 = ""
212040-34 = "Operational plans to strike each academy's command centers are complete. A successful blitzkrieg should result in total annihilation within 30 minutes."
212040-35 = "Ammunition consumption simulations suggest that current stockpiles should fuel a 48-hour total assault targeted at each academy's center."
212040-36 = "If needed, we can prolong the battles via ammunition requisitions from across the entire district, but I do not anticipate that being necessary."
212040-37 = "Leave the \"elites\" alone for now. Once they've been weakened by the barrage, I can step in and finish them off myself."
212040-38 = "In any case, if the war itself is quickly resolved, then individual resistance will be meaningless."
212040-40 = "Kihehe. Well done, Sorasaki Hina. You normally make everything into a hassle, yet you've become ruthlessly competent when it comes to war."
212040-41 = "I at last have a proper sense of purpose."
212040-42 = "All that matters to me is claiming our living space. Soon, all of Kivotos will wave Gehenna's flag."
212040-43 = "Kihe. Excellent."
212040-44 = ""
212040-48 = ""
212040-49 = "Excuse me, but may I contribute a few words?"
212040-51 = "Igarashi Shouko, our operations officer. You may speak freely."
212040-52 = "With Gehenna's current forces, I believe that we could find it difficult to manage all of Kivotos after our conquest."
212040-53 = "It may be effective to invest in...a powerful strategic weapon, one capable of shattering our enemy's will with a single strike."
212040-54 = "Ah, I was already considering that."
212040-55 = "The Tyrant Emperor was a genius engineer and inventor. We will advance her war machine research and immediately begin manufacturing."
212040-56 = "Is that possible? I seem to remember that it was none other than us who purged the Emperor's legacy."
212040-57 = "Kihe... Sorasaki Hina, who do you take me for?"
212040-58 = "I know the Tyrant Emperor better than anyone else in Gehenna. I have analyzed her work down to the last detail."
212040-59 = "And now the very efforts made to defeat the Tyrant Emperor have become our strength. How ironic. Kihehe."
212040-60 = "...That's a relief."
212040-62 = "You've thought of everything, Chairman Makoto. I suppose this means the Tyrant Emperor's storm will rage once more."
212040-64 = "Kihe, I am merely being resourceful."
212040-65 = "Speaking of resources, where's the rest of the Pandemonium Society? The Prefect Team and the Heritage League are working this hard for Gehenna, and I can't find my own council?"
212040-66 = "I suppose they're fulfilling their duties."
212040-67 = "Ah... Truthfully, there has recently been some pushback from my underclassmen."
212040-68 = "...Mine have also voiced grievances. Our opinions failed to align."
212040-69 = "Tsk. I don't understand why they fail to see the bigger picture."
212040-70 = "All they do is whine about \"morality\" and \"diplomacy.\" Kids these days..."
212040-72 = "The circumstances have changed, and so should their positions. It's all been quite frustrating."
212040-73 = "Those who have yet to be enlightened cannot see the greater, more glorious picture. So naturally, they are confused."
212040-74 = "...It may be worth considering an internal audit before we begin the war."
212040-75 = "Kihehe. Excellent idea. Only by uniting as one can we become truly strong."
212040-78 = ""
212040-79 = "...And so, ALL AMMUNITION will be requisitioned to Military Supply Depot 1, effective immediately. IMMEDIATELY!"
212040-80 = "Come on, I just bought this yesterday! I still have the receipt!"
212040-81 = "I don't care when you bought it, little sister. Do you not understand how critical the situation is?"
212040-82 = "Wh-What? \"Critical\" about what? Why are you stealing my ammo?"
212040-83 = "This is wartime! Gehenna will soon enter an all-out conquest!"
212040-84 = "And I already told you, what's that got to do with me?"
212040-85 = ""
212040-89 = ""
212040-90 = "That's enough. Any further resistance is verboten and will be considered a violation of wartime emergency regulations."
212040-91 = ""
212040-93 = ""
212040-94 = "Huh? Hey, is that the Prefect Team? Perfect! Look, they're trying to take my ammo! Do something!"
212040-95 = "Gehenna Wartime Emergency Martial Law Act, Article 8—\"During times of crusade, all available ammunition belongs to the Gehenna Logistics High Command.\" No exceptions."
212040-96 = "...What? Wait, what does that even mean...? That wasn't a thing before!"
212040-97 = "Don't compare the disorder of the past with the alignment of the present. Gehenna's current objective is an all-out war against Kivotos. Naturally, that takes precedence over private ownership."
212040-98 = "Did you hear that? It's what the Head Prefect and our chairman aligned on. Contribute your supplies."
212040-99 = "Or would you prefer to be branded as a traitor and be thrown into the Prefect Team's prison?"
212040-100 = "\"T-Traitor\"...? It's just my ammo..."
212040-101 = ""
212040-103 = ""
212040-104 = "Students who voluntarily contribute their ammunition will be awarded with \"Wartime Contribution Mileage.\" You're familiar with the mileage system, aren't you?"
212040-105 = "But if you refuse... We could punish you right here and now for the concealment of strategic resources."
212040-106 = ""
212040-108 = ""
212040-109 = "...F-Fine. Just take it."
212040-110 = "Seriously, you've all lost your minds..."
212040-111 = ""
212040-113 = ""
212040-114 = "Contribution submission complete. Now, next. Remain in an orderly line."
212040-115 = ""
212040-117 = ""
212040-119 = ""
212040-120 = "..."
212040-124 = "...Did you see that? The Prefect Team and Pandemonium Society upperclassmen looked SO serious. "
212040-126 = "They probably would've shot us if we uttered one more peep while they were emptying our ammo pouches."
212040-127 = "Honestly... I know it's scary, but isn't it also kind of amazing?"
212040-128 = ""
212040-131 = ""
212040-132 = "Hm? What do you mean?"
212040-133 = "The Pandemonium Society and Prefect Team working together. I never thought I'd see it."
212040-134 = "Right. It's probably the first time in the history of Gehenna. Even those two managed to work it out."
212040-136 = "Ah, by the way. I've been thinking...maybe conquering Kivotos isn't so far-fetched."
212040-137 = "If those two clubs could manage to work together..."
212040-139 = "Yeah... And did you see all those tanks lined up around the training grounds? Did we always have so many?"
212040-140 = "I just don't get it. Why do we have to suddenly go to war? I was having a good time doing my own thing..."
212040-142 = "I thought that too, at first. But maybe war's not as bad as everyone says."
212040-143 = "Isn't it just shooting and blowing stuff up, but at a different academy?"
212040-144 = ""
212040-147 = ""
212040-148 = "I guess. It feels like we're on the verge of something big."
212040-149 = "A-And playing along is better than being branded a traitor."
212040-150 = "...Probably. I mean, who knows what will happen if I speak up? Everyone's preparing so eagerly and going on about \"glory\"..."
212040-152 = "Besides, I've always wanted to shoot a mortar at a Trinity building. They got those FANCY windows..."
212040-154 = "Ah. Yeah, that'd be pretty sick."
212040-155 = "And remember the Tree of Deities from our Hyakkiyako trip? Wouldn't it be so cool to see it all flamey?"
212040-156 = "You know what? Maybe war...isn't such a bad idea."
212040-158 = "We'll be fine as long as we keep our heads down and do what we're told."
212040-160 = "Yeah. I'm sure our upperclassmen have a plan. We're just not smart enough to get it."
212040-161 = ""
212040-168 = ""
212040-169 = "..."
212040-170 = "..."
212040-171 = "You know, President."
212040-172 = "Mm?"
212040-173 = "We...wanted to make a united Gehenna."
212040-174 = "One where the Pandemonium Society and the Prefect Team didn't fight. One where the students marched together for the academy."
212040-175 = "...Yeah, we sure did."
212040-176 = "A great school...where even the slackers and troublemakers could proudly unite under the Gehennan flag."
212040-177 = "...Is this...the glorious Gehenna we dreamed of?"
212040-178 = "I..."
212040-179 = "I don't know..."
212040-180 = "..."
212040-181 = ""
212040-183 = ""
212040-185 = "So let's find out."
212040-186 = ""
212040-188 = ""
212040-190 = "Next Episode;I Quit"
