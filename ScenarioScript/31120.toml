[translation]
31120-1 = "제12화;합숙의 첫날 밤"
31120-2 = "……."
31120-3 = "결국 놀지 못했네요……"
31120-4 = "으응. 미안해요…… 물이 채워지는 시간을 생각 못해서……. 이렇게 오래 걸릴 줄은……."
31120-5 = "괜찮아. 충분히 즐거웠으니까."
31120-6 = "……. 예쁘다."
31120-7 = "그러네요……. 한밤의 수영장이라…… 확실히 자주 볼 수 있는 광경은 아니고……."
31120-12 = "(꾸벅, 꾸벅)"
31120-13 = "어머나, 졸려요? 코하루 쨩?"
31120-14 = "아, 아니……. 피곤해서……."
31120-15 = "그렇죠……. 아침부터 대청소에, 이것 저것 많이 했으니까……."
31120-16 = "그럼, 들어가서 이만 쉬도록 할까요?"
31120-17 = "내일부터 합숙 공부의 시작이니까……. 슬슬 휴식을 취하지 않으면 내일의 계획이……."
31120-18 = "응."
31120-19 = "들어가요."
31120-21 = "오늘도 수고하셨습니다."
31120-22 = "수고하셨습니다."
31120-23 = "수고하셨어요."
31120-24 = "수고하셨어요……."
31120-25 = "[s] \"나는 다른 방에 묵을 테니까, 무슨 일이 있으면 불러줘.\""
31120-26 = "우후후. 네. 그 말, 기억해둘게요."
31120-27 = "아, 안 돼……. 정의실현부로서 그런 불건전한 건……. 우우……."
31120-31 = "아하하…… 다들 오늘은 피곤하니까, 일찍 쉬는 걸로……."
31120-32 = "그럼, 안녕히 주무세요."
31120-37 = "[ns] 방으로 돌아간다."
31120-40 = "선생님의 개인실"
31120-42 = "[ns1] \"……….\"\n[ns2] \"힘든 하루였어.\""
31120-47 = "애초에 보충수업부는……"
31120-48 = "학생들을 퇴학시키기 위해 만든 것이니까요."
31120-51 = "[ns] (나기사는 무슨 계획인 걸까…….)"
31120-59 = "(노크소리가 들렸다……?)"
31120-60 = "[ns3] \"누구……?\"\n[ns4] \"밖에 누구 있어요?\""
31120-63 = "선생님…… 계신가요?"
31120-64 = "[s] 문을 연다."
31120-69 = "……아하하. 한밤 중에 죄송해요……."
31120-70 = "[s] \"히후미였구나.\""
31120-71 = "그게…… 잠들려고 해도 도무지 잠이 안 와서……."
31120-72 = "……게다가, 뭔가 이것저것 생각이 많아져서……. 아우……."
31120-74 = "히후미와 잠깐 이야기를 나누기로 했다."
31120-76 = "오늘 수고하셨습니다. 선생님."
31120-77 = "[s] \"히후미도 수고했어.\""
31120-78 = "내일부터 본격적인 합숙인데…… 아우…… 이대로 괜찮을까요…… 저희……."
31120-79 = "일주일 뒤에 있을 2차 평가 시험…… 거기서도 떨어지면 3차 평가 시험이고……."
31120-80 = "거기서도 떨어지면……."
31120-81 = "[s] \"전원 퇴학이지.\""
31120-82 = "……네. 역시 선생님도 알고 계셨군요."
31120-83 = "아직 다른 분들께는 이런 사실을 말씀드리지 못했지만……. 말하는 게 맞는지도 잘 모르겠고…… 아우우……."
31120-84 = "학습 평가 시험인데 이런 이상한 연좌제 시스템인 것도 그렇고, 그리고 시험을 위해 이런 합숙 시설까지 제공하는 것도 그렇고……."
31120-85 = "게다가……."
31120-86 = "……. 아우……."
31120-87 = "[s] \"히후미. 나기사에게 뭔가 들은 게 있어?\""
31120-88 = "네?! 네네?!"
31120-89 = "나, 나기사 님께요……?"
31120-90 = "……. 아우우……."
31120-91 = "……네. 있었어요."
31120-92 = "나기사 님이 아무에게도 말하지 말라고 했지만……. 저로선 감당하기 힘든 이야기라……."
31120-93 = "그건 그러니까…… 아우우……."
31120-94 = "[s] \"트리니티의 배신자를 찾으라는 이야기야?\""
31120-95 = "……네? 서, 선생님도 알고 계셨나요?!"
31120-96 = "아, 아우우…… 그, 그게……."
31120-97 = "……."
31120-98 = "……네. 맞아요. 나기사 님이 그런 얘기를 저에게 하셨어요……."
31120-100 = "히후미 씨. 배신자를 찾아내세요."
31120-101 = "네? 네?! 그, 그런……."
31120-102 = "시험 성적은 아무래도 상관없습니다. 세번의 시험 이후 퇴학은 말하자면 최후의 수단."
31120-103 = "히후미 씨는 최대한 용의자들의 많은 정보를 수집해서 최대한 빨리 배신자를 색출해내는 것이 임무입니다."
31120-104 = "그걸 위해 히후미 씨가 보충수업부에 있는 거예요."
31120-105 = "아, 아우우…… 어, 어째서 제가…… 그런……. 저, 저는……."
31120-106 = "왜 히후미 씨냐고요?"
31120-107 = "샬레를 이용할 수 있는 사람이기 때문입니다."
31120-108 = "제3세력인 샬레의 선생님이 함께 있는 한, 이 배신자 세력들은 함부로 움직이지 못할 거예요."
31120-109 = "말하자면, 바구니에 담긴 쓰레기들이 함부로 날뛰지 못하게 하기 위한 뚜껑 같은 거죠."
31120-110 = "……네? 쓰레기 통……?"
31120-111 = "……아아. 잊어주세요. 혼잣말이니까. 아무튼."
31120-112 = "나, 나기사 님……! 저, 저는…… 이런 건……."
31120-113 = "……. 히후미 씨."
31120-119 = "다른 선택지는 없습니다. 히후미 씨도 낙제생이라는 걸 잊지 말아주세요. 이 미션이 실패하면, 그 결말이 어찌될지는 누구보다 잘 아시겠죠?"
31120-120 = "……."
31120-122 = "[ns] (역시 나기사는 히후미를…….)"
31120-123 = "저, 저는 도무지…… 배신자라니, 그런 무시무시한 얘기를……."
31120-124 = "게다가, 같은 학원의 학생들이잖아요? 오늘도 다 같이 청소하고, 다 함께 식사도 하고 그랬잖아요?"
31120-125 = "그런 사람들을 의심의 눈으로 지켜보라니…… 그런 건…… 그런 건…… 너무해요……."
31120-126 = "저, 저는…… 그런 건 도무지……."
31120-127 = "[s] \"………….\""
31120-128 = "……."
31120-129 = "[s] \"히후미는 좋은 아이구나.\""
31120-130 = "……네? 네네?!"
31120-131 = "[s] \"배신자니 뭐니, 그런 건 히후미가 신경쓰지 않아도 돼.\""
31120-132 = "……선생님?"
31120-133 = "[s] \"그건 내가 해결할 테니까.\""
31120-134 = "……."
31120-135 = "[s] \"히후미는 히후미가 할 수 있는 일을 하면 돼.\""
31120-136 = "제가 할 수 있는 일……."
31120-137 = "……."
31120-138 = "……네! 그게 뭔지, 제가 뭘 할 수 있는지 고민해볼게요!"
31120-139 = "감사합니다, 선생님. 어쩐지 마음이 조금 가벼워진 것 같아요!"
31120-142 = "(한편, 같은 시각)"
31120-144 = "별관 중앙 로비"
31120-145 = "……."
31120-146 = "하나코? 여기서 뭐해?"
31120-147 = "어머, 아즈사 쨩? 안 자고 있었어요? 게다가 옷도 갈아입고……."
31120-148 = "응. 잠은 충분히 잤어. 지금은 불침번을 돌까 해서."
31120-149 = "불침번요……? 여기서요? 게다가 아즈사 쨩, 잠을 한숨도 자지도 않았잖아요……?"
31120-150 = "……응. 잠은……. 낯선 곳에선 잘 못 자서……."
31120-151 = "……."
31120-152 = "걱정하진 마. 이래봬도 불면 훈련도 꽤 받았으니까. 닷새 정도는 수면없이 단독행동이 가능해."
31120-153 = "으응…… 그런 얘기는 아니지만……."
31120-154 = "하나코도 산책인가. 히후미도 산책을 간 것 같고. 다들 낯선 곳에서 불안할 거니까, 나라도 불침번을 돌아야지."
31120-155 = "그럼."
31120-156 = "네. 아즈사 쨩. 너무 무리하지 마세요."
31120-161 = "……."
31120-163 = "(그렇게 합숙의 첫날밤이 지나고 있었다…….)"
31120-165 = "다음화;제1차 모의시험"
