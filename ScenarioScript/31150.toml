[translation]
31150-1 = "제15화;정의실현부의 부부장 2"
31150-4 = "……."
31150-5 = "마, 말해두겠지만! 그냥 실수였으니까!"
31150-6 = "[s] \"……? 뭐가?\""
31150-7 = "야, 야한 책…… 원래는 잘 숨겨…… 아니, 안 가지고 다니니까."
31150-8 = "[s] \"다음부터 들키지 마.\""
31150-9 = "?!"
31150-10 = "무, 무슨 소리야! 그럼 안 들키면 가지고 다녀도 된다는 얘기야?!"
31150-11 = "뭘 생각하는 거야?! 선생님이잖아! 야한 건 안 된다구!! 사형이야! 사형!!"
31150-12 = "[s] \"……코하루도 사형?\""
31150-13 = "?!"
31150-14 = "나, 나는……"
31150-15 = "시, 실수니까 괜찮아! 노카운트야! 노카운트! 무효!"
31150-16 = "[s] \"흐음.\""
31150-17 = "뭐, 뭐야? 그 반응은?! 비웃는 거야?!"
31150-18 = "[s] \"코하루는 코하루인 걸로 괜찮다고 생각해.\""
31150-19 = "으, 으응……?"
31150-20 = "[s] \"딱히 다른 사람처럼 보이려고 노력하지 않아도 괜찮아.\""
31150-21 = "……."
31150-22 = "무, 무슨 뜻인지 잘 모르겠어……."
31150-23 = "……그치만."
31150-24 = "신경 써주고 있는…… 거라는 건…… 아, 알겠어……."
31150-25 = "……."
31150-26 = "흐, 흐응!"
31150-27 = "좋아! 그러니까, 보답으로 중요한 비밀 하나를 알려줄게."
31150-28 = "[s] \"비밀?\""
31150-29 = "……."
31150-34 = "사실 나는……."
31150-35 = "……보충수업부가 잘 돌아가는지를 감시하기 위해 위장 가입한 첩보원이야."
31150-36 = "[s] \"…………?\""
31150-37 = "말하자면 비밀 임무를 수행하고 있는 거지. 그러니까, 이렇게 내가 바보처럼 보이는 건, 말하자면 페이크라는 거지!"
31150-38 = "[s] \"누가 시킨 거야?\""
31150-39 = "으, 으응? 누, 누구냐면……."
31150-40 = "……어 그, 그러니까…… 하, 하스미 선배야!"
31150-41 = "그래! 하스미 선배는 트리니티에서 가장 강력한 정의실현부의 부부장님이시고,"
31150-46 = "어…… 그, 그리고 그 배후에는…… 그러니까…… 츠, 츠루기 부장님도 있는 거야!"
31150-47 = "[s] \"……과연.\""
31150-48 = "츠, 츠루기 부장님은 엄청 멀리까지 내다보시는 두뇌파…… 문무겸비인 분이니까!"
31150-49 = "어, 나도 몇 번 본 적은 없지만……. 아무튼 그래!"
31150-50 = "그러니까, 알겠지? 내가 진짜로 공부를 못해서 보충수업부에 들어온 게 아니라는 걸 알아둬!"
31150-51 = "실은 나는 엄청 중요한 첩보 임무를 띄고 있는 대단한 분이니까!"
31150-52 = "[s] \"……응. 그래.\""
31150-53 = "……."
31150-54 = "[s] \"그런데 첩보 임무인데 이런 걸 마음대로 알려줘도 되는 거야?\""
31150-55 = "……?!"
31150-56 = "……서, 선생님은 비밀을 지킬 거잖아? ……그러니 괜찮아!"
31150-61 = "정의실현부 압류품 관리실"
31150-63 = "……하아. 됐어. 무사히 가져다 놨어."
31150-64 = "다행이야. 이걸로 안심……."
31150-70 = "코하루……?"
31150-71 = "하, 하스미 선배……?!"
31150-72 = "그리고 선생님도…… 분명 합숙을 위해 별관에 머물고 있는 거 아니었어요?"
31150-73 = "낙제에 벗어나기 전까지 이곳에 출입은 금지되었을 텐데요."
31150-74 = "그, 그게……. 그러니까……. 그게……."
31150-75 = "[s] 적당히 얼버무린다."
31150-77 = "……아아. 수업에 사용할 책을 가지러 온 거였다고요."
31150-78 = "그래요……. 그런 거면 어쩔 수 없겠죠."
31150-79 = "……네에."
31150-80 = "마침 잘됐네요. 안 그래도 코하루에게 할 말이 있었는데……."
31150-81 = "네? 나, 나한테……?"
31150-82 = "……선생님. 죄송하지만 잠시만 자리를 좀 비켜주실 수 있을까요? 이건 아무래도 정의실현부원에게만 해야 하는 중요한 일이라……."
31150-83 = "[s] \"응. 그래.\""
31150-84 = "……죄송합니다. 선생님."
31150-86 = "(옆방의 대기실에서 기다리기로 했다.)"
31150-91 = "……해 주세요. ……코하루."
31150-92 = "……의 목표를……. ……말아주……."
31150-94 = "[ns] \"………….\""
31150-96 = "그치만……. 그런 거……에게는 ……무리……"
31150-97 = "……그런…… ……에게 너무 ……려운 임무……."
31150-98 = "아뇨! 할 수 있어요! 하지 않으면 안 돼요!"
31150-99 = "[ns] (하스미의 고함소리가……)"
31150-101 = "……안해요. ……하지만 ……계속……위해선……"
31150-102 = "그리고 선생……을……. ……아시겠……"
31150-103 = "……네. 노력…… 게요……."
31150-107 = "기다렸어? 선생님."
31150-108 = "이제 돌아가자."
31150-109 = "[s] \"무슨 일 있었어?\""
31150-110 = "응? 아니. 별 건 아니야."
31150-112 = "(코하루와 함께 돌아가기로 했다.)"
31150-113 = "(이렇게, 두 번째 날의 일과가 종료되었다.)"
31150-115 = "다음화;작은 틈새"
