[translation]
201090-1 = "ตอนที่ 9;Good Evening Mister Orwell"
201090-2 = "บาร์นั่งดื่ม <ไทรแอต>"
201090-6 = ""
201090-7 = "มีใครอยู่มั้ยคะ...?"
201090-8 = ""
201090-10 = ""
201090-11 = "[ns] \"เหมือนไม่มีคนเลย...\""
201090-12 = "ค่ะ นอกจากไม่มีลูกค้าแล้ว ยังไม่มีวี่แววของพนักงานเลยด้วย"
201090-13 = "หรือว่าร้านปิดแล้ว..."
201090-15 = "เปล่าหรอก เดิมทีบาร์แห่งนี้ก็ไม่ได้เปิดรับลูกค้าอยู่แล้วน่ะ"
201090-16 = ""
201090-19 = "ผู้คนรู้จัก 'บาร์นั่งดื่ม' ว่าเป็น <สถานที่> สำหรับมาดื่มเครื่องดื่ม แต่ถ้าแค่อยากดื่มเครื่องดื่มละก็ ไม่จำเป็นต้องดั้นด้นมาถึงบาร์ก็ได้นี่"
201090-20 = "ผู้คนต่างมาพบปะพูดคุยกับผู้อื่นที่นี่ เพลิดเพลินไปกับบรรยากาศสลัวๆ หรือไม่ก็ดื่มด่ำกับคุณค่าของ#nตัวเองที่สามารถจ่ายเงินแพงๆ ให้กับเครื่องดื่มสำเร็จรูปได้"
201090-21 = "เรียกได้ว่าเป็นตรรกะแห่ง <สัญลักษณ์> ที่ใช้ได้เฉพาะในสังคมบริโภคนิยมอย่างแท้จริง"
201090-22 = "แล้วพวกเจ้าล่ะ มาที่นี่เพื่อดื่มด่ำสถานที่แห่งนี้ในฐานะ <เครื่องมือ> กันหรือเปล่า หรือมาดื่มด่ำในฐานะ <สัญลักษณ์> กัน?"
201090-23 = "หากจุดประสงค์ของพวกเจ้าคืออย่างหลังละก็ ถึงแม้ตัวกระผมจะเป็นเพียงผู้ที่มายังสถานที่แห่งนี้#nก่อนก็ตาม แต่ก็คิดว่าพอจะมอบความบันเทิงเล็กๆ น้อยๆ ให้ได้"
201090-24 = ""
201090-28 = "ไม่ได้พบกันเสียนานเลยนะ คุณครู"
201090-29 = "ใช่แล้ว!"
201090-30 = ""
201090-33 = "[ns1] \"โกลคอนดา...?\"\n[ns2] \"ฟรานซิส...?\""
201090-36 = "อ้อ จริงสิ กระผมยังไม่ได้นิยามตัวเองใหม่เลยนี่#nเข้าใจแล้วว่าทำไมคุณถึงสับสนว่าจะเรียกกระผมว่าอะไร"
201090-37 = "ใช่แล้ว!"
201090-38 = "ควรเริ่มเรื่องราวจากตรงไหนดีล่ะ... ย้อนทบทวนการพบกันครั้งสุดท้ายของ 'พวกเรา' ก็คงไม่เลวสินะ"
201090-40 = "เมื่อโกลคอนดาแปรเปลี่ยนเป็นแฟรนซิสจากการรุกรานของสีสัน เขาจึงมองโลกใบนี้ในฐานะศิลปะที่ถูกทำลาย"
201090-41 = "ในโลกที่ปรุงแต่งขึ้นโดยไร้บริบท โครงสร้าง และความสมเหตุสมผล"
201090-42 = "เขาคิดว่าท้ายที่สุดเจ้าจะไม่ใช่ทั้งคุณครูหรือสิ่งใด และจะร่วงหล่นสู่หุบเหวแห่งความว่างเปล่า"
201090-43 = "ใช่แล้ว!"
201090-45 = "แต่เจ้ากลับแสดงบทบาทของตัวเอกได้อย่างยอดเยี่ยม"
201090-46 = "ไม่สิ... คุณก้าวข้ามบทบาทของตัวเอก และใช้สัญลักษณ์คำว่าคุณครูได้อย่างชาญฉลาด จนเปลี่ยนเรื่องราวของโลกใบนี้ให้กลับมาเป็นเรื่องราวที่สดใสของชีวิตในโรงเรียนได้"
201090-47 = "เมื่อเห็นเช่นนั้น เดคาโคมาเนียจึงเริ่มทำการวิเคราะห์ใหม่"
201090-48 = ""
201090-51 = "นี่เป็นการตัดสินว่าโลกใบนี้อาจมีคุณค่าที่มากกว่าแค่ 'แนวเรื่อง' แตกต่างจากการประเมินของฟรานซิส"
201090-52 = "แน่นอนว่า ฟรานซิสเองก็เป็นเพียงปรากฏการณ์ชั่วครู่เท่านั้น"
201090-53 = "เพื่อที่จะนิยามระเบียบอันว่างเปล่า และสถาปนาอำนาจขึ้นมาใหม่ จึงจำเป็นต้องช่วยส่งเสริมเสียง#nของเดคาโคมาเนียให้เด่นชัดขึ้น"
201090-54 = "ใช่แล้ว!"
201090-55 = "ดังนั้น เดคาโคมาเนียจึงอนุมานแบบอุปนัยซ้ำแล้วซ้ำเล่า และเริ่มดูดกลืนข้อเสนอต่างๆ เข้าไป"
201090-56 = "อาจดูเหมือนเรื่องไร้สาระที่ชื่อผลงานของเขา ซึ่งเป็นการยกย่องศิลปินผู้ยิ่งใหญ่ กลับไปตรงกับชื่อของนักคิดค้นข้อโต้แย้ง ที่นำไปสู่การปฏิเสธการมีอยู่ของเขาก็ตาม หึหึ..."
201090-57 = "[s] \"......\""
201090-58 = "ขออภัย ดันไปนึกถึงเรื่องที่น่าขำเสียได้"
201090-59 = "พวกเราทราบดีว่าคุณครูเคยได้พบกับอดีตสหายแห่งเกมาเทรียแล้ว"
201090-61 = "ผู้อาศัยอยู่ใต้พิภพ... ผู้หมิ่นหยามความเป็นจริงและปฏิบัติต่อโลกราวกับเป็น[ruby=หนังสือแห่งกฎ]โคเด็กซ์[/ruby] ได้กลายเป็น#nแบบจำลองที่ดีสำหรับเรา"
201090-62 = "แต่คุณครูก็ทำการแทรกแซงระดับเมต้าได้อีกครั้งผ่านทางความงดงามสูงส่ง และท้ายที่สุด ความพยายามที่จะตีกรอบโลกใบนี้ให้เป็นเพียงแนวเรื่องก็ล้มเหลวลงอีกครั้ง"
201090-63 = "เดคาโคมาเนียสังเกตเห็นความล้มเหลวของผู้อาศัยใต้พิภพ จึงก้าวข้ามภาพลวงตา และเริ่มสังเกตโลกโดยตรง"
201090-65 = "สถานที่ที่เสพสัญลักษณ์ ข้อความ และรูปภาพอันประกอบขึ้นเป็นโลกใบนี้ คือที่ใด สถานที่ที่ไม่มีสิ่งใดเกิดขึ้น ทว่าทุกสิ่งกลับดำรงอยู่ คือที่ไหนกัน..."
201090-66 = ""
201090-104 = "นั่นก็คือ 'สื่อ' นั่นเอง"
201090-105 = "สื่อที่โยงใยดั่งใยแมงมุมในโลกใบนี้ เป็นทั้งศูนย์รวมขององค์ประกอบที่มีอยู่จริงบนโลก และเป็นเสมือนครรภ์แห่งมารดาที่ให้กำเนิดปริศนาลี้ลับใหม่ เรียกได้ว่าเป็น 'อำนาจแห่งการนิยาม' ของยุคสมัยใหม่อย่างแท้จริง"
201090-107 = "ในฐานะจิตสำนึกใหม่ที่ทำหน้าที่แทนร่างของตน กระผมตั้งตารอเป็นอย่างยิ่งว่าคุณจะสามารถมอบ#nสัญลักษณ์แบบไหนให้"
201090-109 = "[ns] \"นายคือเดคาโคมาเนียตัวจริงเหรอ?\""
201090-110 = "ช่างไร้แก่นสารเสียจริง พวกเราคือสัญลักษณ์ในตัวเอง ก่อนที่จะกลายเป็นตัวตนหนึ่งเสียอีก "
201090-111 = "กระผมคือ[ruby=จอแห่งการรับรู้]เอพิสเตเม[/ruby] และเงาของเดคาโคมาเนีย กระผมมองโลกใบนี้ในฐานะสิ่งที่ดำรงอยู่จริง"
201090-112 = "ในโลกที่ทุกสิ่งถูกครอบงำด้วยความปรารถนา กระผมจะบิดเบือนผลงานของศิลปินผู้ยิ่งใหญ่อีกครั้ง และมอบชื่อให้กับตัวเอง"
201090-113 = "[ruby=Good Evening]สายัณห์สวัสดิ์[/ruby]นะครับ คุณครู"
201090-115 = "โปรดเรียกกระผมว่า มิสเตอร์ 'ออร์เวลล์'"
201090-117 = "ตอนต่อไป;งานเต้นรำสวมหน้ากาก"
