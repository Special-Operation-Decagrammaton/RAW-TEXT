[translation]
201090-1 = "Episode 9;Good Evening, Mr. Orwell"
201090-2 = "Triad Drink Bar"
201090-6 = ""
201090-7 = "...Anyone here?"
201090-8 = ""
201090-10 = ""
201090-11 = "[ns] \"It looks deserted.\""
201090-12 = "I don't see any customers, or even a bartender."
201090-13 = "Maybe they're closed?"
201090-15 = "No, no. For this place is not a bar for customers."
201090-16 = ""
201090-19 = "A bar is a place to enjoy a drink, yes? And yet, beverages can be enjoyed nearly anywhere. Not simply at a bar."
201090-20 = "The real intention behind this place is to revel in the social hierarchy, in a dark atmosphere with over-priced drinks that encourage a false sense of self-worth."
201090-21 = "The logic of Signs that thrive within a consumer society."
201090-22 = "So tell me? Do you wish this place to be a Tool? Or a Sign?"
201090-23 = "Perhaps you choose Sign. Then allow me, a mere customer whose entrance was mere moments before your own, to provide entertainment."
201090-24 = ""
201090-28 = "...It has been some time, has it not, dear Sensei?"
201090-29 = "But of course!"
201090-30 = ""
201090-33 = "[ns1] \"Golconde...?\"\n[ns2] \"No, Francis...?\""
201090-36 = "Ah, yes. I must redefine myself to you. That is why you find the manner in which you must address me a point of confusion."
201090-37 = "But of course!"
201090-38 = "Where can one begin in such an endeavor? Perhaps, if you are so willing, we may travel back to when we last met."
201090-40 = "The Chroma's touch metamorphosed Golconde into Francis. And so it did transform his perception as well. He saw the world for what it was: a deconstructed genre."
201090-41 = "In a contrived reality in which the composition of your lives no longer holds any meaning. Context, probability, all moot points."
201090-42 = "He believed this teacher before him would sink deep into the abyss as an identity-less soul. As nothing at all."
201090-43 = "But of course!"
201090-45 = "However, a story has never seen a protagonist quite like this one. Like you."
201090-46 = "Perhaps even \"protagonist\" is an insult to what you become. The Sign, \"Sensei\"... You utilized it to its utmost capabilities, restoring the battered Text of this world into a story of academy life and youth."
201090-47 = "And once the story shifted, so did Decalcomania's very way of thinking."
201090-48 = ""
201090-51 = "This world is more than a mere, singular genre. It holds a value much more inherent."
201090-52 = "Of course, Francis himself was a mere momentary phenomenon."
201090-53 = "For Decalcomania's voice itself was an essential component to the story! It was necessary to fill this hollow order, to create Authority!"
201090-54 = "But of course!"
201090-55 = "And thus, Decalcomania, enmeshed deep in the mires of inductive reasoning, absorbed propositions to its name."
201090-56 = "Perhaps that concept is nonsense in itself. His name is homage to a great artist. Yet, it is now one developing the very argument which refutes his own existence."
201090-57 = "[s] \"...\""
201090-58 = "Pardon. I've been reminded of an amusing story."
201090-59 = "Some time ago, you had a meeting with a former colleague of ours, yes? From Gematria?"
201090-61 = "The Underground Dweller. The one who would spit on reality in favor of the codex, a rule book naught but he knew the machinations of. It was quite the simulation for us, one might say."
201090-62 = "And yet, AND YET, the sublime again was but a Tool in your hands, Sensei. Yet another intervention of the meta, and another failed attempt to define that which we call our world."
201090-63 = "The Underground Dweller's failure informed Decalcomania's reasoning. What power does illusion have, against the proper gravitas of reality?"
201090-65 = "And in this world, this reality, what is it that consumes Signs? Where the messages and writings of this world collide? Where both reality and illusion dance in tandem?"
201090-66 = ""
201090-104 = "...Media. The answer to all is media."
201090-105 = "The menagerie of media has spread the intricate threads of its webs throughout society's nervous system. A resting place for all that is, was, and will be—and a host that births Mystics. In this world, it is the power to define."
201090-107 = "We need no longer search for correct labels to shakily impose upon society. I am the new consciousness, and I eagerly await the Signs you offer me."
201090-109 = "[ns] \"Are you Decalcomania?\""
201090-110 = "You speak of nonsense. Before a single existence, we are the Sign itself. "
201090-111 = "I am Decalcomania's episteme. All that he perceives and all that remains in his wake. I am the observer of reality for the existence it has become."
201090-112 = "Desire! Art! Magnificence! A society of consumption inherently is one of desire. I, who may define, shall define myself again. Art can be art again, once twisted to one's purposes."
201090-113 = "Good evening, Sensei."
201090-115 = "Please call me Mr. Orwell."
201090-117 = "Next Episode;Masquerade"
