[translation]
201090-1 = "제9화;굿 이브닝 미스터 오웰"
201090-2 = "드링크 바, <트라이어드>"
201090-7 = "……계신가요?"
201090-11 = "[ns] \"아무도 없는 것 같네……\""
201090-12 = "네. 손님은 물론이고 점원의 인기척도 느껴지지 않는군요."
201090-13 = "혹시 이미 영업 시간이 끝나버린 건—"
201090-15 = "그렇지 않습니다. 이 바는 원래부터 손님을 받는 가게가 아니었으니까요."
201090-19 = "'드링크 바'는 본래 음료를 마시는 <장소>로 알려져 있지만, 사실 단순히 음료를 마시기 위해서라면 구태여 바를 찾을 필요가 없지요."
201090-20 = "사람들은 이곳에서 다른 사람과 교류를 하고, 어두운 분위기를 즐기고, 혹은 공산품 드링크에 비싼 값을 지불할 수 있는 스스로의 가치를 즐기기도 합니다."
201090-21 = "그야말로 소비 사회에서만 통용되는 <기호>의 논리이지요."
201090-22 = "어떠신가요. 여러분은 이 장소를 <도구>로 소비하기 위해 오셨습니까. 혹은 <기호>로 소비하기 위해 오셨습니까?"
201090-23 = "여러분의 목적이 후자라면 이 장소의 선객에 불과한 저일지라도 조금의 여흥 정도는 제공해 드릴 수 있을 것 같군요."
201090-28 = "……오랜만에 뵙겠습니다, 선생."
201090-29 = "그렇다!"
201090-33 = "[ns1] \"너는 골콩트……?\"\n[ns2] \"아니, 프랜시스……?\""
201090-36 = "아, 그러고 보니 저를 새롭게 정의하지 않았군요. #n선생께서 호칭을 혼란스러워 하시는 것도 이해가 갑니다."
201090-37 = "그렇다!"
201090-38 = "어디서부터 이야기를 시작할까요…… '우리'의 마지막 만남을 반추하는 것도 나쁘지 않겠군요."
201090-40 = "색채의 침공으로 골콩트가 프랜시스로 변모하였을 때, 그는 이 세계를 해체된 장르로 인지하였습니다."
201090-41 = "맥락도, 구성도, 개연성도 없는 작위의 세계에서."
201090-42 = "당신이 끝내 선생도, 무엇도 아닌 존재로서 심연에 떨어지리라고 생각했습니다."
201090-43 = "그렇다!"
201090-45 = "하지만 당신은 주인공으로서 그 역할을 훌륭히 수행하였습니다."
201090-46 = "……아니. 당신은 주인공이라는 역할을 넘어, 선생이라는 기호를 훌륭하게 소비하여 이 세계의 텍스트를 학원과 청춘의 이야기로 복원해 냈습니다."
201090-47 = "그 모습을 본 데칼코마니는 또 다른 추론을 시작했습니다."
201090-51 = "프랜시스의 평가와는 달리 이 세계에 장르 이상의 가치가 있을지도 모른다는 판단이었지요."
201090-52 = "물론, 프랜시스는 아주 일시적인 현상일 뿐이었습니다."
201090-53 = "텅 빈 질서를 새롭게 정의하고, 권위를 세우기 위해서는 데칼코마니의 목소리를 북돋아 주어야 할 필요가 있었으니까요."
201090-54 = "그렇다!"
201090-55 = "그리하여 데칼코마니는 귀납추론을 반복하며 명제를 흡수하기 시작했습니다."
201090-56 = "위대한 예술가를 오마주한 그의 호칭이, 그 존재를 부정하게 된 논증의 발명가의 이름과 똑같다는 사실은 일종의 넌센스라 할 수 있겠지만요. 큭큭……"
201090-57 = "[s] \"……….\""
201090-58 = "실례. 너무나도 우스운 이야기를 떠올리는 바람에."
201090-59 = "선생께서 지난 번에 게마트리아의 옛 동료를 마주하셨다는 것을 우리는 알고 있습니다."
201090-61 = "지하생활자— 현실을 모독하고 세계를 [ruby=룰 북]코덱스[/ruby]로 취급하려 했던 그는 우리에게 좋은 시뮬라시옹이 되어 주었습니다."
201090-62 = "하지만 선생은 숭고를 통해 또다른 메타적 개입을 이루어 냈고, 결국 이 세계를 하나의 장르로서 재단하려는 시도는 다시 한 번 실패로 돌아갔습니다."
201090-63 = "지하생활자의 실패를 관찰한 데칼코마니는 허상을 딛고 세계를 직접 관찰하기 시작했습니다."
201090-65 = "이 세계를 구성하는 기호, 메시지, 이미지를 소비하는 장소는 어디인가. 아무것도 일어나지 않지만 모든 것이 존재하는 그 장소는 어디인가—"
201090-104 = "……바로 미디어입니다."
201090-105 = "이 세계에 거미줄처럼 깔린 미디어는 세상에 실재하는 파노플리의 집합이자 새로운 신비를 잉태하는 모체. 그야 말로 새로운 시대의 '정의하는 권력'이라 할 수 있지요."
201090-107 = "본인의 신체를 대행하는 새로운 의식으로서 귀하가 어떤 기호를 제공해 줄 수 있을지, 저는 무척이나 기대를 하고 있답니다."
201090-109 = "[ns] \"너는 데칼코마니 본인인가?\""
201090-110 = "넌센스로군요. 저희는 하나의 존재이기 전에 기호 그 자체니까요."
201090-111 = "저는 데칼코마니의 [ruby=인식의 스크린]에피스테메[/ruby]이자 그림자. 실재로서 이 세계를 인지합니다."
201090-112 = "모든 것이 욕망에 의해 소비되는 이 세계에서, 저는 위대한 예술가의 작품을 다시 한 번 뒤틀어 스스로를 명명하려 합니다."
201090-113 = "[ruby=Good Evening]좋은 저녁입니다[/ruby], 선생."
201090-115 = "부디 미스터 '오웰'이라고 불러주시길."
201090-117 = "다음화;[ruby=페르소나]가면[/ruby]무도회"
