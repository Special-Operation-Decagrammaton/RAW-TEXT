[translation]
201090-1 = "第9話;Good Evening, Mr. Orwell"
201090-2 = "飲料吧・「三合會」"
201090-6 = ""
201090-7 = "……請問有人在嗎？"
201090-8 = ""
201090-10 = ""
201090-11 = "[ns] 「好像沒有人呢……」"
201090-12 = "是的。別說是客人了，就連店員的動靜都感覺不到呢。"
201090-13 = "該不會是已經過了營業時間──"
201090-15 = "並非如此。這間飲料吧原本就不是用來招待客人的。"
201090-16 = ""
201090-19 = "「飲料吧」被普遍認為是喝飲料的「場所」。#n然而假如只是單純為了喝飲料，根本沒必要特地多此一舉吧。"
201090-20 = "人們在此與他人交流，享受昏暗的氛圍……#n或是陶醉於自身那能為工業製品的飲料支付高昂價格的餘裕。"
201090-21 = "這正是唯有在消費社會中才得以成立的「符號」邏輯。"
201090-22 = "那麼我想詢問兩位──#n你們來到這裡是為了將其視為「工具」進行消費，還是作為「符號」享受呢？"
201090-23 = "如果是後者的話，即便是身為先客的我，或許也能為你們提供幾分餘興。"
201090-24 = ""
201090-28 = "……好久不見了，老師。"
201090-29 = "沒錯！"
201090-30 = ""
201090-33 = "[ns1] 「你是戈爾孔特……？」\n[ns2] 「不對，是法蘭西斯……？」"
201090-36 = "啊，這麼說來，我還沒重新定義我自己呢。#n老師會對我的稱呼感到混亂也無可厚非。"
201090-37 = "沒錯！"
201090-38 = "該從何說起呢……重新回味「我們」最後一次的相遇，倒也未嘗不可呢。"
201090-40 = "當色彩的入侵使戈爾孔特蛻變為法蘭西斯之時……#n他將這個世界視為了被解構的類型。"
201090-41 = "在既無脈絡、無結構也無蓋然性的造作世界裡……"
201090-42 = "我曾以為您最終會作為既非老師，也非任何事物的存在墜入深淵。"
201090-43 = "沒錯！"
201090-45 = "然而您卻作為主角，確實地完成了那份職責。"
201090-46 = "……不。您顯然已超越了主角這個身分。#n出色地消費了老師這個符號，將這個世界的文本復原成了學園與青春的故事。"
201090-47 = "目睹那一幕之後，轉印開始了另一番推論。"
201090-48 = ""
201090-51 = "那是與法蘭西斯的評價相反，認為這個世界或許具有超越類型之價值的判斷。"
201090-52 = "當然，法蘭西斯不過是一個極為短暫的現象罷了。"
201090-53 = "因為要重新定義空洞的秩序並樹立權威，就有必要使轉印的話語獲得應有的力量。"
201090-54 = "沒錯！"
201090-55 = "於是轉印反覆進行歸納推論，開始吸收命題。"
201090-56 = "他那向偉大藝術家致敬而來的稱呼，#n竟與那套最終導致其存在遭到否定之論證的創始者同名……#n這可真是一種滑稽的巧合呢。呵呵……"
201090-57 = "[s] 「……」"
201090-58 = "失禮了。一時回憶起了過於滑稽的往事。"
201090-59 = "我們知道，老師先前邂逅了蓋瑪特利亞的舊友。"
201090-61 = "地下生活者──那個褻瀆現實，企圖將世界作為[ruby=規則書]法典[/ruby]看待的他，#n對我們而言成了絕佳[ruby=Simulation]的擬象。[/ruby]"
201090-62 = "然而老師透[ruby=Sublime]過崇高完[/ruby]成了另一層次的後設介入。#n企圖將這個世界作為單一[ruby=Genre]類型[/ruby]加以裁定的嘗試，再一次以失敗告終。"
201090-63 = "見證地下生活者的失敗後的轉印跨越虛像，開始直接觀測這個世界。"
201090-65 = "消費著構成這個世界的符號、訊息、影像的場所位於何處。#n那個什麼都沒有發生，卻存在一切事物的場所又位於何處……"
201090-66 = ""
201090-104 = "……答案就[ruby=Media]是媒體。[/ruby]"
201090-105 = "如蜘蛛網般佈滿整個世界的媒體，既是實存於世的萬象，亦是孕育嶄新神祕的母體。#n正可謂是新時代的「定義的權力」呢。"
201090-107 = "身為代行這副身體的嶄新意識……您將為我提供什麼樣的符號，我可是萬分期待啊。"
201090-109 = "[ns] 「你是轉印本人嗎？」"
201090-110 = "真是荒謬。我們在作為獨立個體存在之前，本身就是純粹的符號。"
201090-111 = "我是轉印的[ruby=認知之幕]知識型[/ruby]，也是其影子。#n作為真實的存在認知著這個世界。"
201090-112 = "在一切皆由慾望所消費的這個世界裡……#n我要將偉大藝術家的作品再次扭曲，藉此完成對自身的命名。"
201090-113 = "[ruby=Good Evening　　]晚安，老師[/ruby]。"
201090-115 = "還請務必稱呼我為「歐威爾」先生。"
201090-117 = "下一話;[ruby=Persona]假面[/ruby]舞會"
