1014708-101 = "Absolutely!"
1014708-102 = "Why? Do you dislike it?"
1014708-103 = "[s] \"Well, no...\""
1014708-104 = "Being like this makes me feel full inside."
1014708-105 = ""
1014708-107 = ""
1014708-108 = "You said you'd always stay. It was a promise of a thousand years, so you can't renege on it now."
