[translation]
1014708-1 = "Kyougoku Satsuki"
1014708-3 = ""
1014708-4 = "When I look at you..."
1014708-5 = "I feel happy. Relieved."
1014708-6 = "I wonder why that is? Previously, you would fail to even cross my mind."
1014708-7 = "However, lately, I've caught myself up at night, wondering where you are... If you are safe..."
1014708-8 = "[s1] \"To be honest, that's a valid concern with me...\"\n[s2] \"But thank you for worrying about me, Satsuki.\""
1014708-11 = "Hmm... Sensei, you have a tendency to subtly neglect yourself. You need to prioritize yourself more."
1014708-12 = "As the foremost partner of the magnificent Pandemonium Society..."
1014708-13 = ""
1014708-15 = ""
1014708-16 = "No, as Kyougoku Satsuki's finest companion."
1014708-17 = "[s] Nod."
1014708-18 = "...Fufu."
1014708-21 = "Satsuki and I walked the beach at night, chatting."
1014708-22 = ""
1014708-23 = "[ns] \"Now that I think about it, you hate the dark.\""
1014708-24 = "Correct."
1014708-25 = "Your vision is impaired in the dark, and ambush could come from any direction."
1014708-26 = "It's truly terrifying... And I truly hate it."
1014708-27 = "[s] \"It's nighttime now... Are you all right?\""
1014708-28 = "Huh?"
1014708-29 = "Ah. I normally only stay under man-made lights or indoors at night."
1014708-30 = "This kind of darkness...would normally terrify me."
1014708-31 = "However, right now, it's not even a concern. I don't quite know the reason why."
1014708-32 = ""
1014708-34 = ""
1014708-35 = "I should look around, j-just in case. To ensure there's no lurking dangers."
1014708-36 = ""
1014708-38 = ""
1014708-39 = ""
1014708-40 = ""
1014708-41 = ""
1014708-42 = "These traces..."
1014708-43 = ""
1014708-45 = ""
1014708-46 = "Ah, they're our footprints."
1014708-47 = "Our footprints are side by side in the sand."
1014708-48 = "[s] \"Yes. Since we were walking together.\""
1014708-49 = "..."
1014708-50 = "Ah."
1014708-51 = "I get it."
1014708-52 = "Why it's not scary right now, and the dark holds no power over me."
1014708-53 = ""
1014708-55 = ""
1014708-56 = ""
1014708-57 = "...It's because you're here."
1014708-58 = ""
1014708-60 = ""
1014708-62 = "[ns] Satsuki's scent filled my senses."
1014708-66 = "― [log=사츠키 수영복]Come to think of it, it's always been that way.[/log][wa:2640] "
1014708-67 = "― [log=사츠키 수영복]You've always stayed by my side.[/log][wa:4780] "
1014708-70 = "― [log=사츠키 수영복]Even when I acted as I pleased.[/log][wa:10] "
1014708-71 = "― [log=사츠키 수영복]Even when I tortured you and hypnotized you. [/log][wa:7470] "
1014708-73 = "― [log=사츠키 수영복]Thank you... [/log][wa:10] "
1014708-74 = "― [log=사츠키 수영복]For always staying with me.[/log][wa:1940] "
1014708-77 = "― [log=사츠키 수영복]Thank you for saying you'll protect me. [/log][wa:770] "
1014708-78 = "― [log=사츠키 수영복]you'll protect me. [/log][wa:2990] "
1014708-80 = "― [log=사츠키 수영복]Thank you [/log][wa:10] "
1014708-81 = "― [log=사츠키 수영복]Thank you for holding my hand when I was scared. [/log][wa:5130] "
1014708-83 = "― [log=사츠키 수영복]Thank you for being there [/log][wa:10] "
1014708-84 = "― [log=사츠키 수영복]whenever I needed you. [/log][wa:1270] "
1014708-87 = "― [log=사츠키 수영복]So...[/log]"
1014708-88 = "― [log=사츠키 수영복]I will continue...to be in your care.[/log][wa:5680] "
1014708-91 = "Fufu. I've figured it out."
1014708-92 = "That's what I wished to tell you, all this time."
1014708-93 = "While there will always be more to be said, I also feel a weight lifted off my chest."
1014708-94 = ""
1014708-96 = ""
