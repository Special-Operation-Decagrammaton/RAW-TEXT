1014708-101 = "อื้ม!!"
1014708-102 = "ทำไม? ไม่ชอบเหรอ?"
1014708-103 = "[s] \"ก็ไม่ใช่แบบนั้นหรอก แต่ว่า...\""
1014708-104 = "พออยู่แบบนี้แล้ว รู้สึกเหมือนได้รับการเติมเต็มยังไงก็ไม่รู้"
