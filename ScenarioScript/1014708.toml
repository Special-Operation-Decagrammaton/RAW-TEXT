1014708-91 = "ฮุฮุ แบบนี้นี่เอง"
1014708-92 = "ดูเหมือนฉันจะอยากพูดคำนี้กับครูมาตลอดเลย"
1014708-93 = "รู้สึกโล่งอกยังไงก็ไม่รู้ แต่ก็เหมือนยังมีอะไรอยากพูดอีก..."
