1014708-66 = "― [log=사츠키 수영복]พอลองคิดดูแล้ว เหมือนจะเป็นแบบนั้นมาตลอดเลย[/log][wa:2800] "
1014708-67 = "― [log=사츠키 수영복]ครูคอยเดินเคียงข้างฉันอยู่เสมอ[/log][wa:4860] "
1014708-70 = "― [log=사츠키 수영복]ต่อให้ฉันจะเอาแต่ใจอยู่ทุกครั้ง[/log][wa:10] "
1014708-71 = "― [log=사츠키 수영복]จะทรมานคุณ หรือสะกดจิตใส่คุณ [/log][wa:8110] "
1014708-73 = "― [log=사츠키 수영복]ไม่ว่าจะเรื่องอะไร [/log][wa:10] "
1014708-74 = "― [log=사츠키 수영복]คุณก็ไม่บ่น และอยู่ด้วยกันเสมอ[/log][wa:1820] "
