[translation]
1014708-1 = "京極皐月"
1014708-3 = ""
1014708-4 = "確實，一看到老師……"
1014708-5 = "就覺得好安心，也很開心。"
1014708-6 = "為什麼呢？以前就算見不到你，我也不怎麼擔心的。"
1014708-7 = "不知從什麼時候開始，我總是不安地想著老師在哪裡做什麼，會不會遇到危險。"
1014708-8 = "[s1] 「雖然偶爾會被捲入危險的事……」\n[s2] 「謝謝你擔心我，皐月。」"
1014708-11 = "哼嗯～老師總是不太把自己當一回事。要好好照顧自己才行。"
1014708-12 = "身為偉大萬魔殿的頭號協力者……"
1014708-13 = ""
1014708-15 = ""
1014708-16 = "不，是身為我京極皐月最出色的夥伴。"
1014708-17 = "[s] 點頭"
1014708-18 = "……呵呵。"
1014708-21 = "（和皐月一邊閒聊，一邊漫步在夜晚的海邊）"
1014708-22 = ""
1014708-23 = "[ns] 「話說，皐月不是討厭暗的地方嗎？」"
1014708-24 = "沒錯。"
1014708-25 = "在暗處視野受限，會讓人不安。#n也不知道什麼東西會從哪裡跑出來……"
1014708-26 = "黑暗很可怕……超～討厭的。"
1014708-27 = "[s] 「不過現在是晚上……你還好嗎？」"
1014708-28 = "嗯？"
1014708-29 = "這麼說也對。我晚上通常只會走在明亮的地方，或者乾脆就不出門了。"
1014708-30 = "這邊沒有燈光又很暗……照理說我應該會很討厭才對。"
1014708-31 = "但我卻不怎麼害怕，也不討厭。究竟是為什麼呢……"
1014708-32 = ""
1014708-34 = ""
1014708-35 = "以，以防萬一，我得看看四周有沒有危險……"
1014708-36 = ""
1014708-38 = ""
1014708-39 = ""
1014708-40 = ""
1014708-41 = ""
1014708-42 = "這個痕跡是……"
1014708-43 = ""
1014708-45 = ""
1014708-46 = "啊，是我們的腳印啊。"
1014708-47 = "老師和我的腳印並排在一起呢。"
1014708-48 = "[s] 「嗯，因為我們一起走過來的嘛。」"
1014708-49 = "……"
1014708-50 = "啊。"
1014708-51 = "我知道了。"
1014708-52 = "為什麼現在不害怕，就算很暗也不討厭。"
1014708-53 = ""
1014708-55 = ""
1014708-56 = ""
1014708-57 = "……是因為有老師陪著我。"
1014708-58 = ""
1014708-60 = ""
1014708-62 = "[ns] （皐月的香氣充滿了腦海）"
1014708-66 = "― [log=사츠키 수영복]回想起來，好像一直都是這樣呢。[/log][wa:3920] "
1014708-67 = "― [log=사츠키 수영복]老師總是走在我的身旁。[/log][wa:5620] "
1014708-70 = "― [log=사츠키 수영복]不管提出多麼任性的要求──[/log][wa:690] "
1014708-71 = "― [log=사츠키 수영복]就算拷問你、試著對你施加催眠。[/log][wa:8670] "
1014708-73 = "― [log=사츠키 수영복]無論什麼事，[/log][wa:120] "
1014708-74 = "― [log=사츠키 수영복]你都毫無怨言地陪著我。[/log][wa:2580] "
1014708-77 = "― [log=사츠키 수영복]……謝謝你說[/log][wa:2130] "
1014708-78 = "― [log=사츠키 수영복]會保護我。[/log][wa:3550] "
1014708-80 = "― [log=사츠키 수영복]謝謝你在我害怕的時候，[/log][wa:10] "
1014708-81 = "― [log=사츠키 수영복]握住我的手。[/log][wa:6850] "
1014708-83 = "― [log=사츠키 수영복]謝謝你無論何時，[/log][wa:690] "
1014708-84 = "― [log=사츠키 수영복]都會趕來我身邊。[/log][wa:1870] "
1014708-87 = "― [log=사츠키 수영복]所以──[/log][wa:480] "
1014708-88 = "― [log=사츠키 수영복]今後也請你……多多指教囉，老師。[/log][wa:6520] "
1014708-91 = "呵呵，原來是這樣。"
1014708-92 = "看來我一直很想對老師說這句話。"
1014708-93 = "感覺心裡變得比較舒暢，又好像還有話沒說完……"
1014708-94 = ""
1014708-96 = ""
1014708-97 = "嗯，今天就先這樣吧！"
1014708-98 = "[ns] 「話說……」"
1014708-99 = ""
1014708-100 = "[ns] 「你打算一直維持這樣嗎？」"
1014708-101 = "嗯！！"
1014708-102 = "怎麼了？你不願意嗎？"
1014708-103 = "[s] 「是沒有不願意啦……」"
1014708-104 = "像這樣待著，就有種被填滿的感覺。"
1014708-105 = ""
1014708-107 = ""
1014708-108 = "你說過會一直陪著我對吧？這可是千年的約定，不准反悔哦。"
1014708-109 = ""
1014708-111 = ""
1014708-113 = ""
1014708-116 = "（就這樣和緊貼著的皐月，一起沿著海邊走了回去）"
