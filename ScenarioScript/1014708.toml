[translation]
1014708-1 = "쿄고쿠 사츠키"
1014708-4 = "확실히 선생을 보니……"
1014708-5 = "뭔가 안심되네. 기쁘고."
1014708-6 = "왤까? 그전에는 보이지 않아도 딱히 걱정 같은 거 안 했는데."
1014708-7 = "언젠가부터 선생이 어디 가서 뭘 하고 있을지, 혹시 위험에 처한 건 아닌지 불안했거든."
1014708-8 = "[s1] \"가끔 위험한 일에 휘말리곤 하지만……\"\n[s2] \"걱정해 줘서 고마워, 사츠키.\""
1014708-11 = "흐응~ 선생은 은근히 자신을 등한시하는 경향이 있으니까.#n스스로를 잘 돌볼 필요가 있어."
1014708-12 = "위대한 만마전의 첫째가는 협력자로서……"
1014708-16 = "아니, 이 쿄고쿠 사츠키의 가장 훌륭한 동반자로서."
1014708-17 = "[s] 끄덕인다."
1014708-18 = "……후후."
1014708-21 = "(사츠키와 함께 이런저런 이야기를 하며 밤바다를 걸었다.)"
1014708-23 = "[ns] \"그러고 보니, 사츠키는 어두운 곳을 싫어했는데.\""
1014708-24 = "맞아."
1014708-25 = "어두운 곳에서는 시야가 제한되니까, 불안해진다구.#n어디서 뭐가 튀어나올지 모르고……"
1014708-26 = "어둠은 무서워…… 엄~청 싫어."
1014708-27 = "[s] \"지금은 밤인데…… 괜찮아?\""
1014708-28 = "응?"
1014708-29 = "생각해 보니 그러네. 원래 밤에는 밝은 곳으로만 다니거나, 잘 나가지 않거든."
1014708-30 = "이쪽에는 조명도 없고 어두워서…… 원래대로라면 싫어했을 텐데."
1014708-31 = "별로 무섭거나 싫지 않은데, 왤까……."
1014708-35 = "호, 혹시 모르니 주변을 좀 둘러봐야겠어.#n위험 요소가 있지는 않은지……."
1014708-42 = "이 흔적은……."
1014708-46 = "아, 우리의 발자국이구나."
1014708-47 = "선생과 내 발자국이 나란히 있네."
1014708-48 = "[s] \"응. 함께 걸었으니까.\""
1014708-49 = "……."
1014708-50 = "아."
1014708-51 = "알았다."
1014708-52 = "왜 지금은 무섭지 않고, 어두워도 싫지 않은지."
1014708-57 = "……선생이 함께 있어서야."
1014708-62 = "[ns] (사츠키의 향기가 머릿속을 가득 채운다.)"
1014708-66 = "[wa:2270]― [log=사츠키 수영복]생각해 보니, [wa:1490]늘 그랬던 것 같아.[/log]"
1014708-67 = "[wa:3410]― [log=사츠키 수영복]선생은 [wa:1150]항상 내 옆에서 [wa:660]함께 걸어줬어.[/log]"
1014708-70 = "[wa:610]― [log=사츠키 수영복]내가 매번 제멋대로 굴어도,[/log]"
1014708-71 = "[wa:2690]― [log=사츠키 수영복]당신을 고문하거나, [wa:2010]최면을 걸어도,[wa:3770] [/log]"
1014708-73 = "― [log=사츠키 수영복]무슨 일이든,[wa:40] [/log]"
1014708-74 = "[wa:1440]― [log=사츠키 수영복]불평하지 않고 [wa:940]함께 해주었어.[/log]"
1014708-77 = "[wa:560]― [log=사츠키 수영복]……나를 지켜준다고 [wa:1050]말해줘서,[wa:80] [/log]"
1014708-78 = "[wa:1040]― [log=사츠키 수영복]고마워.[wa:2510] [/log]"
1014708-80 = "― [log=사츠키 수영복]무서워할 때[wa:80] [/log]"
1014708-81 = "[wa:1640]― [log=사츠키 수영복]손을 잡아줘서 [wa:990]고마워.[wa:3940] [/log]"
1014708-83 = "― [log=사츠키 수영복]언제든 [wa:410]달려와줘서[wa:200] [/log]"
1014708-84 = "[wa:1950]― [log=사츠키 수영복]고마워.[wa:40] [/log]"
1014708-87 = "[wa:440]― [log=사츠키 수영복]그러니까,[/log]"
1014708-88 = "[wa:3550]― [log=사츠키 수영복]앞으로도…… [wa:1560]부탁할게, [wa:1410]선생.[/log]"
1014708-91 = "후후, 이거였어."
1014708-92 = "선생에게 계속 이 말을 하고 싶었던 것 같아."
1014708-93 = "뭔가 속이 시원하기도 하고, 좀 더 말할 게 있었던 것 같기도 하고……"
1014708-97 = "뭐, 지금은 이 정도로 해둘까!"
1014708-98 = "[ns] \"그런데……\""
1014708-100 = "[ns] \"계속 이러고 있을 거야?\""
1014708-101 = "응!!"
1014708-102 = "왜? 싫어?"
1014708-103 = "[s] \"그건 아니지만…….\""
1014708-104 = "이러고 있으니까, 뭔가 채워지는 느낌이 들어."
1014708-108 = "계속 함께 있어 준다고 했잖아?#n천 년의 약속을 했으니까, 무르기 없기야."
1014708-116 = "(그렇게 딱 붙은 사츠키와 함께 해변을 걸어 돌아왔다.)"
