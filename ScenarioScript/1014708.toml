[translation]
1014708-1 = "เคียวโงคุ ซัตสึกิ"
1014708-3 = ""
1014708-4 = "พอได้เห็นครูแล้วก็..."
1014708-5 = "รู้สึกโล่งใจยังไงก็ไม่รู้นะ แล้วก็ดีใจด้วย"
1014708-6 = "ทำไมกันนะ? ก่อนหน้านี้ต่อให้มองไม่เห็นครู ฉันก็ไม่เคยห่วงอะไรเป็นพิเศษเลย"
1014708-7 = "แต่จู่ๆ ฉันเริ่มกังวลว่าครูไปทำอะไรที่ไหน หรือกำลังเจอเรื่องอันตรายอยู่หรือเปล่า"
1014708-8 = "[s1] \"ก็มีบ้างที่ครูโดนลากเข้าไปพัวพันกับเรื่องอันตราย...\"\n[s2] \"ขอบใจที่เป็นห่วงนะ ซัตสึกิ\""
1014708-11 = "ฮึ่ม~ ก็ครูน่ะ มีแนวโน้มจะละเลยตัวเองแบบไม่รู้ตัวอยู่นะ ต้องดูแลตัวเองให้ดีด้วย"
1014708-12 = "ในฐานะผู้ร่วมมืออันดับหนึ่งของแพนเดโมเนียม โซไซตี้ผู้ยิ่งใหญ่..."
1014708-13 = ""
1014708-15 = ""
1014708-16 = "ไม่สิ ในฐานะคู่หูที่ยอดเยี่ยมที่สุดของเคียวโงคุ ซัตสึกิคนนี้ต่างหาก"
1014708-17 = "[s] พยักหน้า"
1014708-18 = "ฮุฮุ..."
1014708-21 = "(แล้วคุณครูกับซัตสึกิก็เดินเล่นริมทะเลยามค่ำคืนพร้อมกับพูดคุยเรื่องต่างๆ ด้วยกัน)"
1014708-22 = ""
1014708-23 = "[ns] \"ว่าแต่ ซัตสึกิไม่ชอบที่มืดนี่นา\""
1014708-24 = "ใช่"
1014708-25 = "ในที่มืดๆ มันมองเห็นได้จำกัด ก็เลยรู้สึกไม่สบายใจน่ะ ไม่รู้ว่าจะมีอะไรโผล่ออกมาจากตรงไหน..."
1014708-26 = "ความมืดมันน่ากลัว... ฉันไม่ชอบเอามากๆ~ เลย"
1014708-27 = "[s] \"ตอนนี้กลางคืนแล้วนะ... ไม่เป็นไรเหรอ?\""
1014708-28 = "หืม?"
1014708-29 = "พอคิดดูแล้วก็จริงแฮะ ปกติตอนกลางคืน ฉันจะอยู่แต่ที่ที่สว่าง ไม่ก็แทบไม่ออกไปไหนเลย"
1014708-30 = "แถวนี้ก็ไม่มีไฟ แถมยังมืดด้วย... ถ้าเป็นปกติคงไม่ชอบแน่ๆ"
1014708-31 = "แต่ไม่ได้รู้สึกกลัวหรือไม่ชอบเลยแฮะ ทำไมกันนะ..."
1014708-32 = ""
1014708-34 = ""
1014708-35 = "ละ... ลองสำรวจรอบๆ เผื่อไว้หน่อยดีกว่า เผื่อมีปัจจัยเสี่ยงอะไร..."
1014708-36 = ""
1014708-38 = ""
1014708-39 = ""
1014708-40 = ""
1014708-41 = ""
1014708-42 = "รอยนี้มัน..."
1014708-43 = ""
1014708-45 = ""
1014708-46 = "อ๊ะ รอยเท้าของพวกเรานี่เอง"
1014708-47 = "รอยเท้าของครูกับฉันเรียงคู่กันเลย"
1014708-48 = "[s] \"อื้ม ก็เดินมาด้วยกันนี่นา\""
1014708-49 = "..."
1014708-50 = "อ๊ะ"
1014708-51 = "รู้แล้ว"
1014708-52 = "ว่าทำไมตอนนี้ฉันถึงไม่กลัว แล้วต่อให้มืดก็ไม่รู้สึกไม่ชอบ"
1014708-53 = ""
1014708-55 = ""
1014708-56 = ""
1014708-57 = "เพราะมีครูอยู่ด้วยไงล่ะ..."
1014708-58 = ""
