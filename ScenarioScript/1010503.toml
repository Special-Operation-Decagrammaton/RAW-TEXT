[translation]
1010503-1 = "호들갑 떠는 경호원들(?)"
1010503-2 = "(마리의 말이 신경 쓰여, 학원제가 한창인 트리니티로 향했다.)"
1010503-4 = "선생님……?"
1010503-5 = "[s1] \"……마리?\"\n[s2] 소리가 난 쪽으로 돌아본다."
1010503-10 = "[ns3] \"……마리!?\"\n[ns4] \"뒤, 뒤에 두 사람(?)은……!?\""
1010503-13 = "그, 그게……. 사실은 저도 잘은……."
1010503-14 = "리허설이나 추가 공연 때마다 와서 응원해 주시는 분들인데……."
1010503-15 = "어째서인지 말씀도 꼭 팻말에 글로 적어서 하시고요."
1010503-16 = "\"당신은 누구?\""
1010503-17 = "[s5] \"저는 선생님입니다.\"\n[s6] \"마리를 격려하러 왔습니다.\""
1010503-20 = "\"이해했다. 좋은 사람.\""
1010503-21 = "\"응원을 부탁해.\""
1010503-22 = "\"방해가 되면 안 되니 우린 물러간다.\""
1010503-23 = "\"공연 마지막까지 파이팅!!\""
1010503-32 = "……가셨네요."
1010503-33 = "……네?"
1010503-34 = "아아. 괜찮아요, 사쿠라코 님과 미네 단장님도 알고 계시거든요."
1010503-35 = "오히려 사쿠라코 님께서 경호를 부탁하셨다는 말씀도……."
1010503-39 = "뭔가, 말씀드리고 나니 혹시 시스터후드 분들이 아닌가 하는 생각이……."
1010503-40 = "[s7] \"……고생이 많네, 마리.\"\n[s8] \"뭔가 상상이 가는구나…….\""
1010503-43 = "다들 걱정이 많으시다니까요. 괜찮다고 말씀드렸는데도, 계속 저를 걱정해 주셔서……."
1010503-44 = "아무튼 선생님께서 염려하실 일은 아니에요! 혹시라도 신경 쓰이실까봐 미리 말씀드리는 거예요."
1010503-45 = "그, 그보다 어쩐 일로 오셨는지……."
1010503-46 = "……네?"
1010503-47 = "신경 쓰여서 오셨다고요……? ……제가요?"
1010503-48 = "……선생님……."
1010503-49 = "[s9] \"미, 미안. 나도 다를 바 없었네.\"\n[s10] \"뭔가 타이밍이 안 좋았네, 이번엔.\""
1010503-52 = "……후우……."
1010503-53 = "제가 부족하고 어설픈 건 사실이지만, 그렇다고 이렇게 과보호를 받아야 할 만큼 어리진 않다고요."
1010503-54 = "그렇게나 제가 불안해 보이는 걸까요? 다른 분들이 보시기에……."
1010503-55 = "……네?"
1010503-56 = "그런 뜻은 아니라고요? 그렇지만……."
1010503-57 = "[s11] \"괜한 노파심인 거라고 생각해줘.\"\n[s12] \"다들 그만큼 마리를 아끼는 거니까.\""
1010503-60 = "선생님……."
1010503-61 = "지금은 그렇게 말씀하셔도, 안 되는 건 안 되는 느낌이네요……."
1010503-62 = "……네?"
1010503-63 = "그나저나 저는 여기서 뭐 하고 있었냐고요? 그건……."
1010503-64 = "……아, 아니요. 이번에는 추가 공연이나 리허설과는 관계없는 일이었어요. 그런 거라면 다른 두 분도 함께 계셨겠지요."
1010503-65 = "이번에 온 건 그저 미팅……이라고 해야 하나, 그런 느낌이라고 하시더라고요."
1010503-66 = "평소에 성당에서 상담이라든가, 자주 뵙던 분들이 이번에 제 복장 이야기를 들으셔서……."
1010503-67 = "한 번 자리를 잡고 꼭 한번 뵙고 싶다고 하셔서, 그에 응하기 위해 가는 중이었거든요."
1010503-68 = "[s13] \"그건 말하자면……. 팬 미팅?\"\n[s14] \"마리는 진짜 모두의 아이돌이구나.\""
1010503-71 = "아, 아뇨! 말도 안 돼요! 절대로 그런 건……!!"
1010503-72 = "정말……. 놀리지 말아 주세요, 선생님! 저에 대해서는 제가 누구보다 잘 알고 있다고요."
1010503-73 = "그냥 이전에 인사하고 지냈던 분들이 계신다기에 가서 인사 좀 나누는 것 정도니까요."
1010503-74 = "……어라."
1010503-75 = "그러고 보니, 아까 두 분은 거기에 갈 때 같이 가신다고 와 주신 것 같았는데……. 가 버리셨네요."
1010503-76 = "[s15] \"나한테 맡긴 것 같아.\"\n[s16] \"그럼 이제 내가 그 역할이지.\""
1010503-79 = "서, 선생님께서……!?"
1010503-80 = "아, 아니. 그……. 어……. 뭔가……. 이렇게 되면……."
1010503-81 = "……그……. 선생님께서……."
1010503-82 = "……저를……. 에스코트……해 주시는……. 게……. 돼 버리는……."
1010503-83 = "느낌……이라……."
1010503-87 = "……자……."
1010503-88 = "……잘 부탁드립니다……. 선생님……."
1010503-90 = " (이후 마리를 '에스코트'하며 사람들이 기다리고 있다는 장소로 향했다.)"
1010503-94 = " (……자리는 굉장히 많은 사람들로 가득 차 있었고, 당황한 마리는 잘 못 찾아온 것 같다며 울상을 지었다.)"
