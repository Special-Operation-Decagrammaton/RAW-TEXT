[translation]
2601105-1 = "배팅 내기"
2601105-2 = "(사텐이 부른 곳은 근교의 어느 야구 배팅장이었다.)"
2601105-10 = "후우……! 여기도 꽤 설비가 좋네?"
2601105-11 = "학교마다 분위기가 많이 다르다더니……. 여기는 우리 쪽 학원 도시랑 특히 닮았달까."
2601105-12 = "[s1] \"야구 배팅장?\"\n[s2] 손을 흔들며 인사한다."
2601105-15 = "……아! 선생님! 여기에요, 여기!"
2601105-16 = "생각보다 금방 오셨네요? 오래 걸릴 줄 알고 먼저 좀 치고 있었는데."
2601105-17 = "……네? 쉰다더니 왜 야구 배팅을 하고 있냐고요?"
2601105-18 = "어라……. 쉬고 있는 건데요? 학원도시에서 곧잘 했던 거기도 하니까요."
2601105-22 = "……무슨 문제라도……?"
2601105-23 = "[s3] \"아니. 사텐이 편하다면야.\"\n[s4] \"역시 에너지가 넘친달까…….\""
2601105-26 = "……아. 그러고 보니 선생님. 저, 한 가지 궁금한 게 생겼는데요."
2601105-27 = "여기 시설들, 정말로 다 좋기는 한데……."
2601105-28 = "저기 저쪽에 말이죠……. 유독 이상한 타석 하나가 있단 말이죠."
2601105-29 = "……네. 저쪽이요. 보이세요? 저거."
2601105-33 = "[ns5] \"……뭔지는 모르지만 살벌하구나.\"\n[ns6] \"대체 뭐길래 저렇게…….\""
2601105-36 = "선생님 오시기 전에 조금 읽어 봤는데, 뭔가 밀레니엄의 어떤 학생이 만든 초 강속구 기계라서 위험할 수 있다……라고 돼 있더라고요."
2601105-37 = "저렇게까지 적어 둔 걸 보면 오히려 좀 호기심이 들기도 하고……."
2601105-38 = "……네? 위험하니까 치지 않는 게 좋을 것 같다고요? 흐음……."
2601105-39 = "……흐음……."
2601105-40 = "[s7] \"……저기, 사텐 씨?\"\n[s8] \"혹시 나, 괜한 말한 거야?\""
2601105-43 = "아뇨, 뭐. 그렇다기보다는……. 사실 오시기 전부터 생각은 하고 있었던 거니까요."
2601105-44 = "위험하다고 하면 오히려 좀 더 도전 욕구가 들잖아요? 얼마나 대단하길래……하고."
2601105-45 = "음……."
2601105-46 = "……역시 쳐 봐야겠어요. 선생님, 한 번 봐 주세요!"
2601105-51 = "(결국 사텐은 의기양양한 얼굴로 타석에 들어섰다.)"
2601105-54 = "[wa:500]― [log=사텐]음…….[wa:1220] [/log]"
2601105-55 = "― [log=사텐]특별히 다른 점은 [wa:1740]없는 것 같고…….[/log]"
2601105-58 = "[wa:1000]― [log=사텐]……[wa:100]선생님, [wa:1460]얼굴 너무 굳은 거 아니에요?[wa:1520] [/log]"
2601105-59 = "― [log=사텐]겨우 [wa:290]배팅 머신인데.[wa:620] [/log]"
2601105-62 = "[ns] \"위험하다 싶으면 바로 그만둬야 해.\""
2601105-65 = "[wa:700]― [log=사텐]네! [wa:680]그래도, [wa:300]아마 괜찮을 거예요.[/log]"
2601105-68 = "[wa:850]― [log=사텐]배팅에는[wa:780] [/log]"
2601105-69 = "― [log=사텐]나름대로 [wa:520]자신이 있으니까요.[/log]"
2601105-72 = "[wa:400]― [log=사텐]……[wa:250]뭔가요,[wa:1260] [/log]"
2601105-73 = "― [log=사텐]그 의심의 눈초리는.[/log]"
2601105-76 = "― [log=사텐]그럼 [wa:740]내기 하나 하실래요?[/log]"
2601105-79 = "[wa:600]― [log=사텐]3구 안에 [wa:760]못 치면,[wa:960] [/log]"
2601105-80 = "― [log=사텐]얌전히 타석에서 [wa:700]내려갈게요.[/log]"
2601105-83 = "[wa:500]― [log=사텐]대신 [wa:1000]만약 1구라도 치게 된다면[wa:1850] [/log]"
2601105-84 = "― [log=사텐]거기 자판기에서 [wa:720]음료수 뽑아주세요![/log]"
2601105-87 = "[wa:700]― [log=사텐]어때요?[wa:1070] [/log]"
2601105-88 = "― [log=사텐]선생님께도 [wa:1060]나쁜 이야긴 아니죠?[/log]"
2601105-91 = "― [log=사텐]……[wa:400]히히.[/log]"
2601105-94 = "자-. 그러면 사텐 선수, 타석에서 준비를 마쳤습니다!"
2601105-95 = "우선 첫 번째 공-!"
2601105-99 = "준비하시고-!"
2601105-103 = "……하아압!!"
2601105-111 = "(……음료수를 세 캔 사 주었다.)"
