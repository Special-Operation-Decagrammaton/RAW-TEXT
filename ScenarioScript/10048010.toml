[translation]
10048010-1 = "제1화;하늘에서 교역품이 내린다면"
10048010-2 = "[log]두 시간 전……[/log]"
10048010-4 = "와일드헌트 예술학원 정문"
10048010-5 = "(얼마 뒤 와일드헌트에서 개최될 전시회, <베로니카 특별전>.)"
10048010-6 = "(그것은 명품 브랜드 '베로니카'의 재단이 소유한 회화 컬렉션의 특별 전시회.)"
10048010-7 = "(이와 관련하여 처리할 행정 업무가 있어 와일드헌트 예술학원을 방문했다.)"
10048010-8 = "(그리고, 특유의 빡빡한 검문검색이 기다리고 있었다.)"
10048010-11 = "자자, 빨리 통과하고 싶으면 가방 열어서 여기에 올리고, 두 팔은 위로 번쩍 들어 올리라고."
10048010-12 = "아니, 가방 안에 든 건 물감밖에 없는데, 굳이 그렇게 하나하나 확인해 봐야겠어?"
10048010-13 = "이번에 업데이트된 교칙에 따르면, 지나친 고카페인 음료도 반입 금지 품목에 추가됐거든."
10048010-14 = "그게 무슨 상관이야? 내 가방 안에는 물감밖에 없다니까?"
10048010-15 = "……물감에 고농도 카페인을 섞어 놨을 수도 있잖아."
10048010-16 = "아하."
10048010-17 = "……가 아니라 지금 무슨 소리를 하는 거야?! 누가 물감을 마신다고?!"
10048010-18 = "옛 화가 중에 그랬던 사람이 있었지……."
10048010-19 = "그걸 왜 먹어……!"
10048010-20 = "아무튼! 그…… 우리 사감대장님 특별 지시 사항이야! 협조 좀 해줘!"
10048010-21 = "사, 사감대 부장님?!"
10048010-22 = "그분의 말이라면 어쩔 수 없지……."
10048010-26 = "어디 보자, 이 물감은……."
10048010-27 = "음, 전부 교칙에서 허가한 브랜드군. 포장을 뜯은 흔적도 없는 신품이고."
10048010-28 = "좋아, 통과."
10048010-33 = "자, 그럼 다음 사람…… 응?"
10048010-34 = "어라, 샬레의 선생님 맞으시죠?"
10048010-35 = "[s] \"안녕, 고생이 많네.\""
10048010-36 = "하하, 그럼요. 많은 편이죠."
10048010-37 = "그래도 위에서 뭐 하라고 하니까……."
10048010-38 = "자, 어쨌든 검문에 협조해 주시겠어요?"
10048010-39 = "[s] \"물론이지. 편하게 해.\""
10048010-40 = "자, 그럼 가방 좀 확인하겠습니다."
10048010-44 = "헛……."
10048010-45 = "[s] \"무슨 문제라도……?\""
10048010-46 = "선생님, 이 도기 머그잔은 압수하도록 하겠습니다."
10048010-47 = "이제 모든 도기 제품은 교내 반입이 금지되었거든요."
10048010-48 = "[s] \"어째서?!\""
10048010-49 = "지난달에 금지된 안료를 도기 형태로 굳혀 위장하여 밀반입한 사례가 적발되어서 그만……."
10048010-50 = "[s] \"…….\""
10048010-52 = "(그렇게 꼼꼼한 검문검색은 계속되었다.)"
10048010-54 = "자, 끝났습니다."
10048010-55 = "그리고 압수된 물품은 나갈 때 말씀해 주시면 다시 돌려드리겠습니다."
10048010-56 = "와일드헌트에 오신 것을 환영합니다, 선생님."
10048010-57 = "[s] \"응, 고마워. 수고 많았어.\""
10048010-59 = "(그렇게 와일드헌트 안으로 들어가고 한 시간 뒤.)"
10048010-60 = "(업무를 완료했다.)"
10048010-62 = "와일드헌트 공터"
10048010-64 = "(업무를 마치고 와일드헌트의 교정을 걷던 중, 사람 하나 없는 공터를 발견했다.)"
10048010-65 = "(정문까지는 아직 거리가 조금 남은 상황…….)"
10048010-66 = "[ns] \"여기서 잠깐 쉬었다 갈까.\""
10048010-67 = "(그렇게 잠깐 벤치에 앉으려던 그때.)"
10048010-68 = "저기요! 거기! 피해요!"
10048010-69 = "[ns] \"응?\""
10048010-71 = "(그 순간, 하늘 위에서 떨어지는 무언가를 보았다.)"
10048010-72 = "(둥글고, 녹색이고, 큼지막한……)"
10048010-74 = "[ns] \"……보따리?\""
10048010-78 = "(……바로 다음 순간, 나는 정신을 잃었다.)"
10048010-80 = "[ns] \"……그리고 여기서 깨어난 거구나.\""
10048010-81 = "이, 이제 기억이 나세요?"
10048010-82 = "맞아요. 기절한 선생님을 저희가 기숙사로 들고 온 거예요."
10048010-83 = "[s] \"그런데…… 그 보따리는 대체……?\""
10048010-84 = "아, 그거……."
10048010-85 = "……밀수품이에요."
10048010-86 = "[s] \"밀수품?!\""
10048010-87 = "예. 교내로 들여오기 위해 학원 밖에서 투석기로 쏘아 날린 밀수품인데……."
10048010-88 = "[s] \"투석기요?\""
10048010-89 = "하필 착탄 지점에 서 계시다가…… 그대로 얻어맞으신……"
10048010-90 = "흐우우우…… 죄송해요……."
10048010-91 = "특수교역부를 대표해서 사죄드릴게요……."
10048010-92 = "이런 동아리 대표 같은 거 하고 싶지는 않지만……"
10048010-93 = "[s] \"괜찮아, 크게 다친 것도 아니고.\""
10048010-94 = "그나저나 후유 이 녀석……."
10048010-95 = "이런 일이 있을까 봐 되도록이면 투석기는 쓰지 말라고 했는데……."
10048010-97 = "아니, 쓸 수밖에 없는 상황이었다."
10048010-101 = "뭐야, 언제 왔어요?"
10048010-102 = "투석기를 쓸 수밖에 없는 타당한 이유가 있었다고, 부장."
10048010-103 = "헛소리겠지만 들어는 드릴게요. 말해 보시죠."
10048010-104 = "후후, 그것은 바로……."
10048010-106 = "멋있기 때문이다!"
10048010-107 = "……앞으로 쭉 입 닫고 계셔주세요."
10048010-108 = "왜?!"
10048010-109 = "왜긴 왜겠어요?! 투석기 때문에 사람이 다쳤다고요!"
10048010-110 = "그래서 보따리 안에 완충제 잔뜩 넣어 놨잖아!"
10048010-111 = "그게 밀수품 보호하려고 채운 거죠! 지나가다 맞을 사람 생각해서 채운 건가요!"
10048010-112 = "[s] \"저기, 일단 다들 진정 좀 하고…….\""
10048010-116 = "아, 깨어나셨군요, 선생님."
10048010-117 = "지금 말 돌리는 건가요?!"
10048010-118 = "처음 뵙겠습니다, 선생님. 저는 특수교역부의 영업 실장, 와카사 후유라고 합니다. 기술 관련 업무도 총괄하고 있죠."
10048010-119 = "누구 마음대로 실장인가요…… 난 그런 직위 준 적도 없는데……."
10048010-123 = "일단 이건 제가 보건실에서 받아온 연고인데, 멍든 곳에 바르시고……."
10048010-124 = "그리고 이건 제 명함입니다. 부디."
10048010-125 = "명함은 또 언제 만들었어?!"
10048010-126 = "명함은 비즈니스맨의 기본이지."
10048010-127 = "저기…… 우리 동아리가 불법이라는 사실은 인지하고 있죠?"
10048010-128 = "그리고 너는 그 불법 조직의 수장이고 말이지."
10048010-129 = "내가! 부장이! 되고 싶어서! 된 건가요?!"
10048010-130 = "흥분하지 마, 부장. 그래도 별일 없이 잘 마무리됐잖아."
10048010-131 = "그래도 어쨌든 저희가 선생님께 피해를 입힌 것은 사실이니……."
10048010-132 = "선생님께서 '도움'이 필요하시다면 첫 의뢰는 무료로 모시겠습니다."
10048010-133 = "어떻게 이런 상황에서도 영업을……."
10048010-134 = "[ns1] \"저기 그런데, 근본적인 궁금증이긴 한데…….\"\n[ns2] \"특수교역부가 정확히 하는 일이 뭐야……?\""
10048010-137 = "좋은 질문입니다, 선생님."
10048010-138 = "지금부터 차근차근 설명해 드리죠."
10048010-139 = "차근차근 설명할 게 뭐가 있나요…… 그냥 교칙에 금지된 물품들 몰래 밀수해 들여와서 파는 동아리인데."
10048010-140 = "선생님도 와일드헌트에 들어오실 때 보셨겠죠."
10048010-141 = "후유 씨? 제 말 무시하시나요?"
10048010-142 = "엄격하다 못해 끈질긴 검문과 검색, 그리고 부조리한 통제……."
10048010-143 = "그 때문에 와일드헌트의 학생들은 정말로 갖고 싶은 것이 있어도 금지 품목이라는 부당한 이유로 교내에 들여오지 못하는 것이 수두룩하답니다."
10048010-144 = "바로 그때 저희가 나서는 거죠."
10048010-145 = "의뢰인이 원하는 물건을 교내로 반입해 주고, 저희 특수교역부는 수수료를 받는 식으로요."
10048010-146 = "그것도 아주 합리적인 가격으로 말이죠."
10048010-147 = "조금 '특수'한 방법으로 '교역'을 하는 것. 그것이 저희 '특수교역부'의 일이랍니다."
10048010-148 = "[s] \"그래도 결국 교칙 위반이잖아……!\""
10048010-149 = "후후, 그렇게 생각하시는 것도 이해합니다."
10048010-150 = "그렇다면 어때요, 선생님?"
10048010-151 = "저희의 부 활동을 직접 참관해 보시는 겁니다."
10048010-152 = "그러면 저희가 하는 일이 교칙과 무관하게 정말로 나쁜 일인지 판단하실 수 있으실 테니까요."
10048010-153 = "어때요, 일단 한 번 참관을 해보시는 건?"
10048010-154 = "[s3] \"시켜만 준다면, 기꺼이.\"\n[s4] \"사실 궁금하기도 했고.\""
10048010-157 = "우리 부장님은 어떻게 생각해?"
10048010-158 = "선생님하고 내가 동의는 했다고 해도, 이런 일의 최종 결정 권한은 부장의 몫이잖아."
10048010-159 = "……."
10048010-160 = "……예. 일단 있는 그대로 보여 드리는 편이 좋겠죠."
10048010-161 = "좋아, 그러면……"
10048010-168 = "미요 쨩! 전부 다 묻어 버리고 왔어!"
10048010-172 = "[ns] \"……뭘 묻어요?\""
