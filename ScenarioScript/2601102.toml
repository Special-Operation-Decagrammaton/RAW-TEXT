[translation]
2601102-1 = "나는 전설이다"
2601102-2 = "(사텐의 연락을 받고 상점가로 향했다.)"
2601102-7 = "(거리에서 눈을 초롱초롱 빛내고 있던 사텐의 모습이 멀리서부터 눈에 띄었다.)"
2601102-15 = "이, 이런……. 이런 일이……. 이런 현실이……!"
2601102-16 = "정말이겠지? 뭔가의 테마파크라든가, 몰래카메라라든가……."
2601102-17 = "아니면 영화 세트장이라든가……. 그런 건 아니겠지?"
2601102-18 = "날개를 단 사람도 있고 뿔을 단 사람도 있고, 동물 귀와 꼬리를 한 사람도 있고……."
2601102-19 = "아니, 아예 동물 모습을 한 사람들도……."
2601102-20 = "[s1] \"……사텐?\"\n[s2] \"여기서 뭐 하고 있어?\""
2601102-28 = "하늘에, 하늘에 정체를 알 수 없는 빛의 기둥과 원이……!!"
2601102-29 = "[s3] \"흥분하고 있어…….\"\n[s4] \"저, 저기. 사텐 씨……?\""
2601102-32 = "……!? 으헉!?"
2601102-33 = "아, 아. 선생님……? 선생님이셨군요!"
2601102-34 = "깜짝 놀랐다……. 그러잖아도 아까 전에 말하는 강아지 아저씨가 다가와서 도망쳤는데……."
2601102-35 = "사, 사실 조금 귀엽다고 생각하기도 했지……만요."
2601102-36 = "……네?"
2601102-37 = "걱정하지 않으셔도 된다고요? 나쁜 사람들이 아니라고요?"
2601102-38 = "어라……. 응?"
2601102-42 = "……딱히 겁먹었던 건 아닌데요?"
2601102-43 = "[s5] \"……응? 걱정하던 게 아니었어?\"\n[s6] \"그럼 그 반응은…….\""
2601102-46 = "그야 뭐, 놀라기는 했지만……."
2601102-47 = "아. 오히려 본의 아니게 걱정 끼쳐 드린 거려나요. 으으. 죄송해요. 그럴 의도는 아니었는데."
2601102-48 = "그냥 제가 원래 있던 곳에서는 못 보던 광경들이 너무 한꺼번에 많이 보여서요."
2601102-49 = "얼핏 비슷하게 생긴 학원도시라고 생각했는데, 막상 자세히 보니 전혀 다르고……."
2601102-50 = "뭐랄까……."
2601102-51 = "예전부터 찾아다니던 도시 전설들이 전부 한 번에 모여서 살아가는 세계 같달까……."
2601102-52 = "제게는 그저 신기한 거죠! 이곳의 모든 게!!"
2601102-53 = "그런데……. 으음……."
2601102-57 = "……이상하네요……. 뭔가 기분이……. 기대했던 거랑은 다르달까요."
2601102-58 = "다들 너무 당연하다는 듯 양지에서 활동하고 있으니, 막상 도시 전설 같은 느낌이 안 드는 거 같기도 하고……."
2601102-59 = "[s7] \"그, 그야 여기서는 당연하니까…….\"\n[s8] \"도시 전설이라는 것도 상대적인 거니까.\""
2601102-62 = "그렇……겠지요? 역시."
2601102-66 = "……어라."
2601102-67 = "……헉!? 그렇다면 오히려 여기서는……. 제가 도시 전설인 게……!?"
2601102-68 = "[s9] \"……다른 세계에서 온 사람이라는 의미로?\"\n[s10] \"뭐, 굳이 따지자면 그렇게 되려나…….\""
2601102-71 = "……!!!"
2601102-72 = "듣고 보니 정말 그러네요! 이런 쪽으로는 한 번도 생각해 보지 못했어요!"
2601102-73 = "도시 전설……. 오히려 내가 도시 전설……."
2601102-74 = "……오, 오오오……."
2601102-75 = "선생님……? 혹시……."
2601102-81 = "……제가 신기하신가요?"
2601102-82 = "[s11] \"어떤 대답을 원하는 거니…….\"\n[s12] \"그, 글쎄……. 어느 쪽일까…….\""
2601102-85 = "전혀 그런 얼굴이 아니시네요. 조금 아쉽다."
2601102-86 = "뭐, 좋아요. 저에게 신기한 것은 둘째 치고, 일단 여기서는 제가 본 것들이 그다지 신기하지 않은 거라는 건 이해했어요."
2601102-87 = "그래도 여기는 여기 나름대로의 도시 전설 같은 게 있겠죠? 괴담이라든가……. 오컬트라든가……."
2601102-88 = "[s13] \"자연스럽게 넘어가네.\"\n[s14] \"포기를 모르는 아이구나.\""
2601102-91 = "당연하죠! 중요한 건 포기하지 않고 계속해서 가능성을 찾아가는 거니까요!"
2601102-92 = "자, 선생님! 같이 찾으러 가 보시죠! 이 세계의, 이 세계에 맞는 도시 전설을!!"
2601102-96 = "[ns] \"………….\""
2601102-98 = "[ns] 일단 사텐을 따라간다."
2601102-100 = "(이후 무작정 달려 나가는 사텐을 따라 키보토스 시내를 한 바퀴 빙 둘러보았다.)"
2601102-101 = "(당연한 이야기지만, '도시 전설'이라 할 만한 것들은 딱히 찾아내지 못했다.)"
