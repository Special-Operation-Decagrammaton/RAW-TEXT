[translation]
70014030-1 = "เส้นทางอันสับสนของหมอยา 3"
70014030-2 = ""
70014030-3 = "ตลาดมืด... เหรอคะ? แล้วคุณครูจะไปด้วยตัวเองด้วยเหรอคะ?"
70014030-4 = "ทะ... ทำไมล่ะคะ คุณครู?! หรือว่ากำลังถูกใครข่มขู่อยู่หรือเปล่าคะ?"
70014030-5 = ""
70014030-7 = ""
70014030-8 = "ลงพื้นที่... เพื่อศึกษา? "
70014030-9 = "ถะ... ถ้าเป็นเรื่องแบบนั้น ให้ขอนักเรียนคนอื่นช่วย หรือจ้างบริษัทภายนอกมาทำแทนน่าจะดีกว่า..."
70014030-10 = "[s1] \"ขอบใจในความหวังดีนะ แต่แบบนั้นครูคงไม่ได้เห็นสภาพจริง\"\n[s2] \"ครูตั้งใจไว้แล้วน่ะ เชื่อใจครูหน่อยนะ\""
70014030-13 = "..."
70014030-14 = "..."
70014030-15 = ""
70014030-16 = "ฮึ"
70014030-17 = "[s] \"เดี๋ยวเหอะ ไค...! เมื่อกี้หัวเราะใช่มั้ย?! ครูเห็นนะ!?!\""
70014030-18 = "ขอถามเผื่อไว้หน่อยนะ ครู ในตัวครูมียีนของแมวปนอยู่ด้วยหรือเปล่า?"
70014030-19 = "[s] \"แมวเหรอ...?\""
70014030-20 = "ก็... ว่ากันว่าแมวมีเก้าชีวิตไม่ใช่เหรอ?"
70014030-21 = "[s] \"ไม่มีเถอะนะ!\""
70014030-22 = "ให้ตายสิ สำหรับฉันยังไงก็รับไม่ได้อยู่ดี แต่ก็ใช่ว่าจะไม่เข้าใจเสียทีเดียว โดยเฉพาะถ้าเป็นครูน่ะนะ"
70014030-23 = "แต่กับเรื่องนี้ ฉันถึงขั้นอยากเห็นใจยัยพวกองค์การนักเรียนขึ้นมาบ้างเลยละ"
70014030-24 = "หืม? ทำไมฉันถึงรู้สึกเห็นใจคนอื่นเป็นด้วยน่ะเหรอ?"
70014030-25 = "แน่นอนว่าไม่ได้ถึงขนาดนั้นหรอก หึหึหึ..."
70014030-26 = "แต่ฉันก็พอเข้าใจว่ามันเป็นความรู้สึกแบบไหน และถูกกระตุ้นให้เกิดขึ้นในสถานการณ์แบบใด... "
70014030-27 = "อย่างน้อยฉันก็ยังพอเข้าใจเรื่องนั้นในเชิงเหตุผลอยู่บ้างน่ะนะ"
70014030-28 = "พูดในทางกลับกันนะ ครู... "
70014030-29 = "พูดอีกอย่างก็คือ ตอนนี้ครูกำลังทำอะไรเสี่ยงมาก จนแม้แต่คนอย่างฉันยังต้องคิดไปไกลถึงขนาดนั้นได้"
70014030-30 = "[s] \"เป็นคำทักท้วงที่แทงใจดำอยู่เหมือนกันนะ...\""
70014030-31 = "นี่ ครู การที่ผู้มีอำนาจตัดสินใจสูงสุดต้องลงพื้นที่ด้วยตัวเองทุกเรื่อง มันไม่ใช่เรื่องดีต่อองค์กรหรอก"
70014030-32 = "หึหึ... แต่พอลองมาคิดดูว่าพวกองค์การนักเรียนทำงานอืดอาดกันแค่ไหน ในบางแง่มันก็คงช่วยไม่ได้#nเหมือนกันนะ"
70014030-33 = "แล้วครูคิดจะทำอะไรกันแน่? อยากรู้สภาพจริงของตลาดมืดงั้นเหรอ ครูนี่เป็นคนประหลาดที่อยากรู้#nแม้กระทั่งเรื่องแบบนั้นจริงๆ นะ"
70014030-34 = "ดีละ ฉันชักจะสนใจขึ้นมาแล้ว ออกเดินทางกันเถอะ"
70014030-35 = "[s] \"จะไปด้วยกันเหรอ?\""
70014030-36 = "ก็ตอนนี้ครูทำให้ฉันสนใจขึ้นมาแล้วนี่..."
70014030-37 = "โลกนี้เต็มไปด้วยความน่าเบื่อ อย่างน้อยก็สำหรับฉันน่ะนะ เพราะงั้น..."
70014030-38 = "ถ้าครูยอมเป็น 'ของแก้เบื่อ' ให้ฉัน ฉันก็ยินดีจ่ายค่าตอบแทนให้อย่างสมน้ำสมเนื้อเลย"
70014030-39 = "ก็ในโลกแบบนี้ คำมั่นเป็นสิ่งสำคัญนี่นะ"
70014030-46 = "อย่าถอยเด็ดขาด!!!"
