70014030-90 = "ถึงจะเพิ่งเข้ามาในตลาดมืด ก็ไม่มีการผ่อนผันให้หรอก!"
70014030-91 = "ยืมเงินไปแล้วก็ต้องคืนสิ! ใช่... รวมดอกเบี้ยให้ครบด้วยล่ะ!"
70014030-92 = "แต่เงินนั่น พวกคุณเป็นฝ่ายยัดเยียดมาให้เองตามใจชอบไม่ใช่หรือไง!!!"
70014030-93 = "งั้นเหรอ? แล้วเอาเงินนั่นไปใช้หรือเปล่าล่ะ?"
70014030-94 = "กะ... ก็เอาไปใช้อยู่ แต่ว่า...!"
70014030-95 = "สุดท้ายพวกคุณก็บังคับให้เอาเงินทั้งหมดไปใช้ที่ร้านของตัวเองไม่ใช่หรือไง! แถมยังคิดราคาแพงกว่าตั้งหลายเท่าด้วย!!!"
70014030-96 = "อุตส่าห์ช่วยแล้วแท้ๆ ยังไม่รู้จักสำนึกบุญคุณอีก... ถ้าไม่มีเงินก็เอาร่างกายชดใช้ซะ!"
70014030-98 = "เธอผิดเองที่เข้ามาในตลาดมืดโดยไม่เตรียมใจไว้ให้พร้อม!"
70014030-99 = ""
70014030-100 = "ไร้สาระสิ้นดี"
70014030-101 = "คนที่ก้าวเข้ามาในที่แบบนี้โดยไม่คิดหน้าคิดหลังก็ทำให้ไม่สบอารมณ์อยู่แล้ว..."
70014030-102 = "แต่เจ้าพวกที่ไม่รู้ว่าเหนือฟ้ายังมีฟ้า แล้วยังเที่ยวทำตัวกร่างไปทั่ว ยิ่งทำให้ฉันหงุดหงิดกว่าเดิมเสียอีก"
