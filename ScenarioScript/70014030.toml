70014030-66 = "ถือโอกาสนี้บอกไว้เลยก็แล้วกัน ฉันไม่ชอบทั้งสามอย่างนี้เลย"
70014030-67 = "เพราะทั้งหมดนั่น... ล้วนเป็นสิ่งรบกวนร้ายแรงต่อกระบวนการผลิตยา"
