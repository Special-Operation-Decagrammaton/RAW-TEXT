[translation]
70014030-1 = "薬屋の彷徨い（３）"
70014030-3 = "ブラックマーケットに……先生自ら、ですか？"
70014030-4 = "なぜ！？まさか、誰かに脅されているとか……！？"
70014030-8 = "はい？現場研究のため？"
70014030-9 = "であれば生徒に依頼するか、業者に委託すれば……！"
70014030-10 = "[s1] \"気持ちは嬉しいけど、自分の目で確認したいんだ。\"\n[s2] \"私のことを信じてほしい。\""
70014030-13 = "……。"
70014030-14 = "……。"
70014030-16 = "はっ。"
70014030-17 = "[s] \"いま笑ったよね！？\""
70014030-18 = "もしや先生は猫なのか？"
70014030-19 = "[s] \"……どういう意味？\""
70014030-20 = "猫には9つの命があると言うじゃないか。#n同時に……好奇心は猫をも殺す、とも。"
70014030-21 = "[s] \"猫じゃないよ！\""
70014030-22 = "まぁその行動も、理解はできるさ。納得はできないがね。"
70014030-23 = "ただ、連邦生徒会の連中には同情を禁じ得ないな。"
70014030-24 = "うむ？他人に同情の気持ちを覚えられるのか？"
70014030-25 = "もちろん、そこまでではない。"
70014030-26 = "だが、それがどんな感情で、どのような状況で湧くものなのか……。"
70014030-27 = "理解はしている。"
70014030-28 = "……言い換えると。"
70014030-29 = "今の先生は、私ですらそこまで考えが至るほど、無謀なことをしているのだよ。"
70014030-30 = "[s] \"ごもっともです……。\""
70014030-31 = "そもそもだ。頭がいちいち現場に出るのは、組織のためにも望ましくはない。"
70014030-32 = "だが、尻重の連邦生徒会を思えば……仕方のないことではあるか。"
70014030-33 = "まあいいさ。私も興味が湧いてきた。"
70014030-34 = "行こうか。"
70014030-35 = "[s] \"一緒に来てくれるの？\""
70014030-36 = "……今の先生は、私の興味を搔き立ててくれた。"
70014030-37 = "この世は実に退屈だ。少なくとも私はそう思っている。"
70014030-38 = "ゆえに、「暇つぶし」足りうるものには、相応の対価を払うつもりはあるのさ。"
70014030-39 = "なんであれ、一度した約束は大事だからな。"
70014030-46 = "退くな！！！"
70014030-53 = "ここさえ掌握すれば、このエリアはうちらのもんだ！！"
70014030-57 = "大目に見てればつけあがりやがって！"
70014030-58 = "ここに暮らす連中も問題だ！#n裏切るとか、後でどうなるか分かってんのか？"
70014030-59 = "騒ぎが終わったら保護費を倍にするからな！"
70014030-64 = "……騒がしいな。"
70014030-65 = "揺れるし、埃が舞う。"
70014030-66 = "どれも不快で仕方ない。"
70014030-67 = "……調剤の邪魔だ。"
70014030-73 = "ぐはっ！？"
70014030-74 = "な、なんだ？甘い匂い……？"
70014030-78 = "なに。"
70014030-79 = "命は無事だ。"
70014030-80 = "命だけは、な。"
70014030-83 = "はぁっ、はぁっ、しつけぇんだよ……！"
70014030-90 = "あぁ？新入りだからって容赦しねぇぞ！"
70014030-91 = "借りた金は返す！当然のことだろ？#nおっと、利子も忘れんなよ？"
70014030-92 = "いや、あんたらが押し付けてきたんだろ！？"
70014030-93 = "んじゃ、あの金はそっくりそのまま残ってるんだな？"
70014030-94 = "使ったけど……。"
70014030-95 = "だからって、ありゃ暴利だ！返せるわけがねぇ！"
70014030-96 = "金に困ってんのを助けてやったんだぞ？#n金がねぇなら身体で払わせてやる！！"
70014030-98 = "ブラックマーケットじゃあ泣いて謝ったって無駄だからなぁ！"
70014030-100 = "くだらない。"
70014030-101 = "のんきな者は取るに足らぬが……。"
70014030-102 = "傲慢で怖いもの知らずは、なお腹立たしい。"
70014030-105 = "そこ。"
70014030-106 = "あぁん？おめぇも金が要んのか？"
70014030-107 = "用がねぇならとっとと失せろ！"
70014030-113 = "ん？"
70014030-114 = "は？"
70014030-116 = "か、体が――？？？"
70014030-121 = "2日はゆっくり眠れるさ。"
70014030-122 = "その間に何があっても――私の知るところではないがな。"
70014030-123 = "それと……。"
70014030-127 = "な、なんだ……！？"
70014030-128 = "はぁ……。"
70014030-129 = "覚えておけ。"
70014030-130 = "自分の身を守れないなら、いずれ喰われる。"
70014030-131 = "それが世の理だ。"
70014030-133 = "てめぇら！気合い入れろ！！"
70014030-134 = "和解なんてありえん！生きるのは片方のみ！！"
70014030-144 = "なっ、なんだっ！？ぐはっ！"
70014030-150 = "騒ぐな。服が汚れたらどうする。"
70014030-151 = "たかが……そんな理由で――"
70014030-152 = "――きゅう。"
70014030-156 = "[ns] \"あのさ……みんな、無事なんだよね？\""
70014030-157 = "そんなことを気にしていたのか。"
70014030-158 = "案ずることはない。#n症例の観察には、生きていてくれた方が都合がいいんだ。"
70014030-166 = "それで？"
70014030-167 = "ブラックマーケットを見て回った感想は？"
70014030-168 = "[s] \"まだよく分からないかも……。\""
70014030-169 = "だろうな。ここはそういうところだ。"
70014030-170 = "言うなれば――不治の病と、難病の狭間。"
70014030-171 = "ある者は諦め、またある者は微かな希望に縋りつく。"
70014030-172 = "私にとっては、どちらも関係のないことだ。"
70014030-173 = "……薬の効かぬ壊れた体と、なんら変わらない。"
70014030-174 = "[s] \"でも、もうちょっと知りたい。\""
70014030-175 = "……すべての物事に可能性を信じる、純粋な莫迦の道を選ぶのか。"
70014030-176 = "……。"
70014030-177 = "まあ、良いだろう。それもまた一興だ。"
70014030-184 = "おい、ババァ！困っちゃうなぁ……。#n治ったんなら保護費を払ってくれねぇと。"
70014030-185 = "散々便宜はかってやったよな？忘れちゃったのか？"
70014030-186 = "ここは穏便に済ませようぜ？な？"
70014030-187 = "こ、この……！"
70014030-191 = "[ns] \"あれ……？\""
