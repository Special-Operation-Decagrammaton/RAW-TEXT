70014030-129 = "ฉันจะบอกอะไรให้อย่างหนึ่งนะ"
70014030-130 = "ถ้าเอาแต่ยอมให้คนอื่นรังแก สุดท้ายเธอก็จะถูกกินทั้งเป็น คอยปกป้องตัวเองให้ดีล่ะ"
70014030-131 = "โลกมันก็เป็นแบบนี้แหละ"
70014030-133 = "ทุกคน! เตรียมอาวุธ! ไปยื่นข้อเสนอที่เจ้าพวกนั้นปฏิเสธไม่ได้กัน!"
70014030-134 = "ข้อเสนอแบบนั้นพวกแกเก็บไว้เองเถอะ! ถ้ามีใครเสนอให้สงบศึก ไอ้หมอนั่นคือคนทรยศ!"
