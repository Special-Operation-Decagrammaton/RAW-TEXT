70014030-156 = "[ns] \"เอ่อ... คนที่เจอวันนี้... ไม่เป็นอะไรใช่มั้ย?\""
70014030-157 = "หืม? อ้อ กำลังกังวลเรื่องนั้นอยู่สินะ"
70014030-158 = "ไม่ต้องกังวลหรอก ไม่ว่ากรณีไหน เคสที่ยังมีชีวิตอยู่ย่อมมีประโยชน์กว่า"
70014030-166 = "เป็นยังไงล่ะ ครู"
70014030-167 = "ได้เห็นตลาดมืดเต็มๆ ตาแล้วหรือยังล่ะ?"
70014030-168 = "[s] \"ครูก็ยังรู้สึกไม่ค่อยเข้าใจอยู่ดี...\""
70014030-169 = "ก็คงเป็นอย่างนั้น ที่นี่มันเป็นสถานที่แบบนั้นนี่นะ"
70014030-170 = "ถ้าจะเปรียบเทียบละก็ ที่นี่ก็คือสถานที่อยู่ระหว่างโรคที่รักษาไม่หายกับโรคที่รักษาได้ยาก"
70014030-171 = "บางคนอาจนิยามว่าที่นี่เป็นโรคที่รักษาไม่หายแล้วเลือกยอมแพ้ ส่วนบางคนจะมองว่าอาจมีทางรักษา#nได้อยู่ ก็เลยไม่ยอมปล่อยความหวังให้หลุดมือไป"
70014030-172 = "สำหรับฉันแล้ว ไม่ว่าจะเป็นอย่างไหนมันก็ไม่สำคัญหรอก"
70014030-173 = "เพราะยังไงที่นี่ก็เป็นสถานที่ที่ไม่ต่างอะไรจากศพ ที่ต่อให้ใช้ยาไปก็ไม่ตอบสนอง..."
70014030-174 = "[s] \"แต่ยังไง ครูก็ยังอยากรู้ให้มากกว่านี้อีกสักหน่อย\""
70014030-175 = "โฮ่ คิดจะเลือกเดินบนเส้นทางของคนโง่ไร้เดียงสา ที่เชื่อว่าทุกๆ เรื่องยังมีความเป็นไปได้หลงเหลืออยู่#nงั้นเหรอ?"
70014030-176 = "..."
70014030-177 = "เอาเถอะ แบบนั้นก็ไม่ได้แย่ สำหรับฉันแล้ว นั่นก็เป็นความบันเทิงอย่างหนึ่งเหมือนกัน"
70014030-178 = ""
