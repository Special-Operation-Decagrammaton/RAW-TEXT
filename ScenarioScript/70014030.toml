70014030-31 = "To start with, Sensei, an organization would be unwise to allow its top-level decision-makers to involve themselves in field minutiae."
70014030-32 = "Keh heh... But at the same time, when you think about how slow the General Student Council is to act, I suppose a hands-on approach is best."
