[translation]
70014030-1 = "약사의 방황길 3"
70014030-3 = "블랙…… 마켓이요? 선생님이 직접요?"
70014030-4 = "왜, 왜 그러세요. 선생님?! 혹시 누군가에게 협박 같은 거라도 당하셨나요?"
70014030-8 = "현장, 연구요?"
70014030-9 = "그, 그런 거라면 차라리 다른 학생에게 부탁하시든가, 외부 업체에 하청을 주시는 편이……"
70014030-10 = "[s1] \"마음은 고마운데, 그러면 오히려 제대로 볼 수 없을 것 같아.\"\n[s2] \"그러니까 조금만 나를 믿어 줬으면 해.\""
70014030-13 = "……."
70014030-14 = "……."
70014030-16 = "핫."
70014030-17 = "[s] \"카이, 이 녀석……! 지금 웃었지?! 똑똑히 봤어?!?!\""
70014030-18 = "혹시나 해서 묻는 것이다만, 선생. 혹시 유전자 중에 고양이라도 섞여 있는 것인가?"
70014030-19 = "[s] \"……고양이?\""
70014030-20 = "그, 왜, 고양이는 목숨이 아홉 개라는 말이 있지 않던가."
70014030-21 = "[s] \"없어!\""
70014030-22 = "이것 참, 나로서는 결코 납득할 수 없지만, 이해가 가는 부분이 없지는 않군. 특히 선생이라면 말이지."
70014030-23 = "하지만 이 건에 한해서, 나는 총학생회 녀석들에게 조금 동정을 하고 싶어질 지경이야."
70014030-24 = "음? 타인에 대한 동정이라는 것을 느낄 수 있었냐고?"
70014030-25 = "물론, 그렇게까지는 아니다. 쿡쿡쿡……."
70014030-26 = "하지만 그것이 어떤 감정인지, 어떤 상황에서 불러일으켜지는 것인지……."
70014030-27 = "그 정도는 머리로나마 알고 있는 것이 있어서 말이야."
70014030-28 = "……반대로 이야기하자면, 선생."
70014030-29 = "지금의 선생은 그런 나조차도 거기까지 생각하게 할 수 있을 만큼, 무모한 행동을 하고 있다는 뜻이 되기도 한다."
70014030-30 = "[s] \"……확실히 그건 조금, 뼈아픈 지적이군…….\""
70014030-31 = "애초에 말이다, 선생. 최상위 결정자가 하나하나 현장에 나서는 건, 조직을 위해서도 좋은 일이 아니다."
70014030-32 = "쿡쿡…… 하지만 동시에, 총학생회 녀석들의 엉덩이가 얼마나 무거운지 생각해 보면, 어쩔 수 없는 부분도 있을 것 같군."
70014030-33 = "그래서, 구체적으로 뭘 할 생각인가? 블랙마켓의 진짜 실상이라니, 선생은 참으로 그런 것을 다 궁금해하는 별종이로군."
70014030-34 = "좋다. 흥미가 생겼으니, 출발하지."
70014030-35 = "[s] \"같이 가 주는 거야?\""
70014030-36 = "……지금의 선생은, 내 흥미를 끌었으니 말이다."
70014030-37 = "세상은 지루함으로 가득하다. 적어도 내게는 그렇지. 그러니……."
70014030-38 = "선생이 내 '심심풀이'가 되어 준다면, 나도 그에 상응하는 대가를 지불할 의향 정도는 있다는 것이다."
70014030-39 = "이런 세계에서, 약조는 중요한 것이니까."
70014030-46 = "물러서지 마라!!!"
70014030-53 = "이것만 차지하면, 이 지역은 우리 거다!!!"
70014030-57 = "가만히 참아 줬더니, 뭐가 어째?!"
70014030-58 = "여기 사는 녀석들도 문제다! 감히 우리를 배신하려 하다니!"
70014030-59 = "이 난리만 끝나면 보호세를 두 배로 받아내겠어!"
70014030-64 = "……시끄럽군."
70014030-65 = "소란스럽고, 흔들리고, 먼지를 일으켜."
70014030-66 = "이 기회에 이야기해 두지. 나는 셋 다 좋아하지 않는다."
70014030-67 = "하나같이…… 제약 과정에 치명적인 노이즈니까."
70014030-73 = "으헉?!?!"
70014030-74 = "뭐지……? 뭔가 달콤한 냄새가 나는 것 같더니……!"
70014030-78 = "뭐."
70014030-79 = "목숨에는 지장이 없을 거다."
70014030-80 = "목숨에는, 말이지."
70014030-83 = "헉, 헉, 헉……!"
70014030-90 = "블랙마켓에 막 들어왔다고 봐주는 건 없다고!"
70014030-91 = "돈을 빌렸으면 갚아야 할 것 아냐! 그래…… 이자까지 확실하게 말이지!"
70014030-92 = "하지만, 그건 당신들이 멋대로 떠넘긴 거잖아!!!"
70014030-93 = "그래? 그러면 그 돈 안 썼냐?"
70014030-94 = "쓰, 쓰기는 했지만……!"
70014030-95 = "결국 모두, 당신들 가게에서 쓰게 했잖아! 그것도 몇 배나 비싼 가격으로!!!"
70014030-96 = "도와줬더니 고마운 줄도 모르고 말이야……. 돈이 없으면 몸으로 갚아!"
70014030-98 = "그 정도 각오도 없이 블랙마켓에 들어온 네가 잘못이다!"
70014030-100 = "시시하군."
70014030-101 = "생각 없이 이런 곳에 발을 들인 녀석도 유쾌하지 않지만……."
70014030-102 = "하늘 위에 하늘이 있다는 것도 모르는 것들이 설치는 것은, 더 짜증만 날 뿐이다."
70014030-105 = "이봐."
70014030-106 = "뭐냐? 너도 돈이 필요해?"
70014030-107 = "아니라면 썩 꺼져!"
70014030-113 = "응?"
70014030-114 = "어?"
70014030-116 = "몸이……???"
70014030-121 = "뭐, 이틀 정도 그대로 자고 있어라."
70014030-122 = "그러다 무슨 일을 당하든, 나는 신경 쓰지 않겠지만."
70014030-123 = "그리고……."
70014030-127 = "뭐, 뭐야……?!"
70014030-128 = "쯧."
70014030-129 = "한마디만 하지."
70014030-130 = "당하고만 살면 잡아먹힌다. 자기 몸은 알아서 지켜."
70014030-131 = "세상 이치가 그런 법이니까."
70014030-133 = "얘들아! 연장 챙겨라! 저 자식들에게 거절할 수 없는 제안을 하러 가자!"
70014030-134 = "그런 건 네놈들이나 가져! 화해를 권유하는 자식이 있다면, 그 놈이 배신자다!"
70014030-144 = "어, 어째서…… 누가…… 왜……."
70014030-150 = "정숙해라. 옷이 더러워지지 않나."
70014030-151 = "겨우…… 그런 이유로……?"
70014030-152 = "꼴까닥."
70014030-156 = "[ns] \"저기, 오늘 만난 사람들…… 괜찮은 거, 맞지?\""
70014030-157 = "음? 아하, 그렇군. 그런 것을 걱정하고 있었나."
70014030-158 = "신경 쓰지 않아도 좋다. 어떤 경우든, 살아 있는 증례가 더 쓸모 있는 법이니."
70014030-166 = "어떤가, 선생."
70014030-167 = "블랙마켓은, 잘 돌아보았나?"
70014030-168 = "[s] \"아직은 잘 모르겠다는 느낌이네…….\""
70014030-169 = "그야 그렇겠지. 여기는 그런 곳이니까."
70014030-170 = "비유하자면 불치병과 난치병 사이에 있는, 그 어떤 곳이다."
70014030-171 = "어떤 자는 불치병이라고 정의하고 포기할 것이고, 어떤 자는 난치병이라고 여기며 희망의 끈을 놓지 않겠지."
70014030-172 = "나에게는 어느 쪽이든 상관없는 일이다."
70014030-173 = "……어차피, 약도 듣지 않는 시체나 다름없는 곳이니 말이다."
70014030-174 = "[s] \"그래도, 조금만 더 알아보고 싶어.\""
70014030-175 = "호오. 모든 일에 가능성은 남아 있다고 믿는, 순진한 바보의 길을 가려는가."
70014030-176 = "……."
70014030-177 = "뭐, 그것도 좋겠지. 나에게는 그 역시 여흥이니."
70014030-184 = "뭐야, 할망구! 몸이 좀 나았으면, 보호비를 내야 할 것 아니야!"
70014030-185 = "우리가 그동안 많이 참아 줬다고! 잘 알 거 아냐!"
70014030-186 = "서로 쉽게 가자고, 쉽게. 나쁜 일 하겠다는 게 아니잖아?"
70014030-187 = "이…… 녀석들……!"
70014030-191 = "[ns] \"어……?\""
