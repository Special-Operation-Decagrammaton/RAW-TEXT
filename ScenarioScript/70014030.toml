70014030-184 = "นี่ ยายแก่! ถ้าอาการดีขึ้นแล้วก็ต้องจ่ายค่าคุ้มครองไม่ใช่หรือไง!"
70014030-185 = "ที่ผ่านมา พวกฉันอุตส่าห์ยอมผ่อนผันให้ตั้งเยอะแล้วนะ! รู้ดีไม่ใช่เหรอ!"
70014030-186 = "เอาแบบง่ายๆ กันทั้งสองฝ่ายดีกว่า พวกฉันไม่ได้จะทำเรื่องไม่ดีสักหน่อย จริงมั้ย?"
