[translation]
70014030-1 = "藥師的徬徨（３）"
70014030-2 = ""
70014030-3 = "黑市……是嗎？老師您要親自去？"
70014030-4 = "為，為什麼呢老師！？難道是被什麼人威脅了嗎？"
70014030-5 = ""
70014030-7 = ""
70014030-8 = "實地研究……？"
70014030-9 = "那，那麼不如拜託其他學生，或者外包給民間的業者……"
70014030-10 = "[s1] 「你們的心意我很感激，但是那樣反而看不到真實的一面。」\n[s2] 「所以希望你們能稍微相信我一下。」"
70014030-13 = "……"
70014030-14 = "……"
70014030-15 = ""
70014030-16 = "哈。"
70014030-17 = "[s] 「誡，你剛才笑了吧……！？我看得一清二楚哦！？！？」"
70014030-18 = "我姑且問一句……老師的基因裡該不會混入了貓吧？"
70014030-19 = "[s] 「……貓？」"
70014030-20 = "就是……俗話不是說貓有九條命嗎。"
70014030-21 = "[s] 「才沒有！」"
70014030-22 = "真是的。雖然我完全無法認同，倒也不是不能理解……#n尤其是發生在老師身上的時候。"
70014030-23 = "不過就這件事而言，我甚至有點想對聯邦學生會那幫傢伙寄予一絲同情了。"
70014030-24 = "嗯？你說我居然能感受到對他人的同情？"
70014030-25 = "當然還不到那個地步。咯咯咯……"
70014030-26 = "不過那是什麼樣的情感，又會在什麼樣的情況下產生……"
70014030-27 = "這種程度的事，我的腦袋還是能夠理解的。"
70014030-28 = "……反過來說，老師。"
70014030-29 = "這也意味著如今老師的行為，已經莽撞到連我這種人都不得不產生那種想法了。"
70014030-30 = "[s] 「那確實戳中了我的痛處呢……」"
70014030-31 = "說到底，老師。#n身為最高決策者卻事事親臨現場，對組織而言可不是什麼好事。"
70014030-32 = "咯咯……不過一想到聯邦學生會那群人的屁股有多重，這似乎也是無可奈何的事。"
70014030-33 = "那麼，你具體打算做什麼？#n居然想見識黑市的真實樣貌……老師還真是個什麼都好奇的怪人呢。"
70014030-34 = "很好。既然來了興致，我們就出發吧。"
70014030-35 = "[s] 「你願意陪我一起去嗎？」"
70014030-36 = "……因為現在的老師，引起了我的興趣。"
70014030-37 = "這個世界充斥著無聊的事物。至少對我而言是如此。所以……"
70014030-38 = "如果老師願意成為我的「消遣」，我也有意付出相應的代價。"
70014030-39 = "畢竟在這樣的世界裡，約定是很重要的。"
70014030-46 = "別後退！！！"
70014030-47 = ""
70014030-49 = ""
70014030-50 = ""
70014030-51 = ""
70014030-52 = ""
70014030-53 = "只要拿下這裡，這一帶就是我們的了！！！"
70014030-54 = ""
70014030-55 = ""
70014030-56 = ""
70014030-57 = "我們一直忍著不吭聲，結果你們竟敢這樣！？"
70014030-58 = "住在這裡的傢伙也有問題！竟敢背叛我們！"
70014030-59 = "等這場騷動結束之後，我要收兩倍的保護費！"
70014030-63 = ""
70014030-64 = "……真吵。"
70014030-65 = "吵鬧、搖晃，還揚起灰塵。"
70014030-66 = "趁這機會說清楚。這三樣我全都不喜歡。"
70014030-67 = "每一樣……都是製藥過程中致命的雜訊。"
70014030-68 = ""
70014030-70 = ""
70014030-73 = "呃啊！？"
70014030-74 = "怎麼回事……？好像聞到一股甜甜的味道……！"
70014030-75 = ""
70014030-76 = ""
70014030-77 = ""
70014030-78 = "放心。"
70014030-79 = "這不會危及性命。"
70014030-80 = "但也僅限於性命而已。"
70014030-82 = ""
70014030-83 = "哈啊，哈啊，哈啊……！"
70014030-84 = ""
70014030-86 = ""
70014030-87 = ""
70014030-88 = ""
70014030-89 = ""
70014030-90 = "別以為剛進黑市就會對你手下留情！"
70014030-91 = "借了錢就得還錢！#n沒錯……連本帶利，一分都不能少！"
70014030-92 = "可是，那是你們硬塞給我的吧！！！"
70014030-93 = "是又怎樣？難道你沒把那筆錢花掉嗎？"
70014030-94 = "花，花是花了沒錯……！"
70014030-95 = "但全都是在你們店裡被強迫消費的啊！而且價格還貴了好幾倍！！！"
70014030-96 = "好心幫你還不知感恩……沒錢就用身體來還！"
70014030-98 = "連這點覺悟都沒有就闖進黑市是你的問題！"
70014030-99 = ""
70014030-100 = "真無聊。"
70014030-101 = "不經思考就踏進這種地方的傢伙固然令人不快……"
70014030-102 = "但不知天高地厚的傢伙在那裡叫囂更讓人煩躁。"
70014030-103 = ""
70014030-104 = ""
70014030-105 = "喂。"
70014030-106 = "怎樣？你也缺錢是不是？"
70014030-107 = "不是的話就快滾！"
70014030-108 = ""
70014030-110 = ""
70014030-111 = ""
70014030-113 = "嗯？"
70014030-114 = "啊？"
70014030-116 = "身體怎麼……？？？"
70014030-117 = ""
70014030-119 = ""
70014030-120 = ""
70014030-121 = "你們就這樣睡上兩天左右吧。"
70014030-122 = "不過在此期間會遇到什麼，我可就管不著了。"
70014030-123 = "還有……"
70014030-124 = ""
70014030-126 = ""
70014030-127 = "怎，怎樣……！？"
70014030-128 = "嘖。"
70014030-129 = "我只說一句話。"
70014030-130 = "一味挨打只會被生吞活剝，自己的安全自己顧好。"
70014030-131 = "世間的道理就是如此。"
70014030-133 = "小的們！把傢伙都帶上！去向那幫渾蛋提一項無法拒絕的提議吧！"
70014030-134 = "那種東西你們自己留著吧！#n要是有人勸和，那傢伙就是叛徒！"
70014030-135 = ""
70014030-144 = "為，為什麼……是誰……為何……"
70014030-145 = ""
70014030-150 = "安靜點。衣服都要弄髒了。"
70014030-151 = "就為了……那種理由……？"
70014030-152 = "呃啊。"
70014030-153 = ""
70014030-155 = ""
70014030-156 = "[ns] 「那個，今天遇到的那些人……不會有事吧？」"
70014030-157 = "嗯？啊哈，原來你在擔心那種事啊。"
70014030-158 = "不必擔心。在任何情況之下，活著的病例都更有用處。"
70014030-166 = "感受如何呢，老師？"
70014030-167 = "在黑市逛得還盡興嗎？"
70014030-168 = "[s] 「感覺還是不太明白呢……」"
70014030-169 = "那也很正常。因為這裡就是這樣的地方。"
70014030-170 = "如果要打個比方，就是介於不治之症與難治之症之間。"
70014030-171 = "有人會將其定義為不治之症而選擇放棄，也有人會視為難治之症而不願放棄希望。"
70014030-172 = "對我來說，是哪一邊都無所謂。"
70014030-173 = "……反正這裡只是個藥石罔效、形同屍體的地方而已。"
70014030-174 = "[s] 「即便如此，我還是想再多了解一些。」"
70014030-175 = "哦？你打算走上相信凡事皆有可能的天真傻瓜之路嗎？"
70014030-176 = "……"
70014030-177 = "也罷，那樣對我來說也是一種餘興。"
70014030-178 = ""
70014030-181 = ""
70014030-182 = ""
70014030-183 = ""
70014030-184 = "喂，老太婆！既然身體好多了，那保護費也該交了吧！"
70014030-185 = "這段期間我們已經夠寬容了！你自己應該心裡有數吧！"
70014030-186 = "大家都放輕鬆嘛，放輕鬆。#n我們又不是要做什麼壞事，對吧？"
70014030-187 = "你……你們這些傢伙……！"
70014030-188 = ""
70014030-190 = ""
70014030-191 = "[ns] 「咦……？」"
