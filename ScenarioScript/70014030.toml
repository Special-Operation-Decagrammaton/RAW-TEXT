70014030-17 = "[s] \"카이, 이 녀석……! 지금 웃었지?! 똑똑히 봤어?!?!\""
70014030-18 = "3;카이;07;혹시나 해서 묻는 것이다만, 선생. 혹시 유전자 중에 고양이라도 섞여 있는 것인가?"
70014030-19 = "[s] \"……고양이?\""
70014030-20 = "3;카이;03;그, 왜, 고양이는 목숨이 아홉 개라는 말이 있지 않던가."
70014030-21 = "[s] \"없어!\""
70014030-22 = "3;카이;00;이것 참, 나로서는 결코 납득할 수 없지만, 이해가 가는 부분이 없지는 않군. 특히 선생이라면 말이지."
70014030-23 = "3;카이;99;하지만 이 건에 한해서, 나는 총학생회 녀석들에게 조금 동정을 하고 싶어질 지경이야."
70014030-24 = "3;카이;01;음? 타인에 대한 동정이라는 것을 느낄 수 있었냐고?\n#3;em;[?]"
70014030-25 = "3;카이;08;물론, 그렇게까지는 아니다. 쿡쿡쿡……."
70014030-26 = "3;카이;07;하지만 그것이 어떤 감정인지, 어떤 상황에서 불러일으켜지는 것인지……. "
70014030-27 = "3;카이;00;그 정도는 머리로나마 알고 있는 것이 있어서 말이야."
70014030-28 = "3;카이;05;……반대로 이야기하자면, 선생. "
70014030-29 = "3;카이;99;지금의 선생은 그런 나조차도 거기까지 생각하게 할 수 있을 만큼, 무모한 행동을 하고 있다는 뜻이 되기도 한다. \n#3;em;[한숨]"
70014030-30 = "[s] \"……확실히 그건 조금, 뼈아픈 지적이군…….\""
70014030-31 = "3;카이;02;애초에 말이다, 선생. 최상위 결정자가 하나하나 현장에 나서는 건, 조직을 위해서도 좋은 일이 아니다."
70014030-32 = "3;카이;08;쿡쿡…… 하지만 동시에, 총학생회 녀석들의 엉덩이가 얼마나 무거운지 생각해 보면, 어쩔 수 없는 부분도 있을 것 같군.\n#3;em;[재잘]"
70014030-33 = "3;카이;07;그래서, 구체적으로 뭘 할 생각인가? 블랙마켓의 진짜 실상이라니, 선생은 참으로 그런 것을 다 궁금해하는 별종이로군."
70014030-34 = "3;카이;03;좋다. 흥미가 생겼으니, 출발하지.\n#3;em;[음표]"
70014030-35 = "[s] \"같이 가 주는 거야?\""
70014030-36 = "3;카이;00;……지금의 선생은, 내 흥미를 끌었으니 말이다."
70014030-37 = "3;카이;01;세상은 지루함으로 가득하다. 적어도 내게는 그렇지. 그러니……."
70014030-38 = "3;카이;08;선생이 내 '심심풀이'가 되어 준다면, 나도 그에 상응하는 대가를 지불할 의향 정도는 있다는 것이다."
70014030-39 = "3;카이;07;이런 세계에서, 약조는 중요한 것이니까."
