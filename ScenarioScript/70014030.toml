70014030-58 = "เจ้าพวกที่อยู่ที่นี่ก็เป็นตัวปัญหาเหมือนกัน! กล้าคิดทรยศพวกเรางั้นเหรอ!"
70014030-59 = "ถ้าเรื่องวุ่นวายนี่จบเมื่อไร จะรีดค่าคุ้มครองเป็นสองเท่าเลยคอยดู!"
