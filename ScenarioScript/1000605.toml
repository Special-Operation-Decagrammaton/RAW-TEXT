[translation]
1000605-1 = "비밀스러운 거래"
1000605-2 = "블랙마켓"
1000605-4 = "오, 드디어 와주었군."
1000605-5 = "샬레의 선생님이 갑자기 우리 블랙마켓에 접근을 해왔을 때는 무슨 일인가 의심했었는데……"
1000605-6 = "쿡쿡, 설마 선생님도 이런 일에 흥미가 있을 줄이야. #n다시 봤다구."
1000605-7 = "[s] \"물건은 확실하겠지?\""
1000605-8 = "물론, 우리 블랙마켓의 일처리는 확실하거든."
1000605-9 = "돈만 제대로 준다면 무엇이라도 구해준다는 게 우리 블랙마켓의 모토야."
1000605-10 = "[s] 블랙마켓 상인과 물건을 주고받는다."
1000605-12 = "그럼, 어디 금액부터 확인해볼까……"
1000605-16 = "거기 까지다, 이 악당들!"
1000605-17 = "으앗? 어째서 게헨나 선도부가 이곳에……!"
1000605-18 = "거래는 완료되었으니…… 그럼 이만!"
1000605-20 = "아앗! 거기 서라, 이 밀수범!"
1000605-24 = "쳇…… 놓쳤나. 그래도 다른 하나는 붙잡았으니……."
1000605-27 = "……선생님?"
1000605-28 = "어째서 이 곳에…… #n아니, 그보다 방금 저 밀수범과 무슨 물건을 주고받은 거야?"
1000605-29 = "[s1] \"오해야.\"\n[s2] \"말할 수 없어. \""
1000605-30 = "……또 무언가 말하기 어려운 일에 손을 댔나 보네."
1000605-31 = "……또 무언가 말하기 어려운 일에 손을 댔나 보네."
1000605-32 = "한심스러워……."
1000605-33 = "어찌되었든 현행범을 그대로 돌려보낼 수는 없지. #n거래한 물건을 내놔."
1000605-34 = "[s3] 줄 수 없다며 떼를 쓴다.\n[s4] 모른척한다."
1000605-35 = "어린아이처럼 굴지 말고, 어서 내놔!"
1000605-36 = "모른체하지 말고, 어서 내놔!"
1000605-38 = "이오리에게 거래한 물건을 빼앗겼다."
1000605-39 = "이건…… 사진집? #n심지어 내 초등학교 졸업 앨범이잖아?"
1000605-40 = "……선생님이 어째서 이런 걸?"
1000605-41 = "[s5] \"이오리의 졸업 앨범이 유출되는 걸 막고 싶어서…….\"\n[s6] \"샬레의 업무에 꼭 필요한 자료라…….\""
1000605-42 = "거짓말 하지 마! 분명 음흉한 일에 쓰려는 거잖아!"
1000605-43 = "거짓말 하지 마! 분명 음흉한 일에 쓰려는 거잖아!"
1000605-44 = "이…… 변태!"
1000605-46 = "이후, 이오리에게 엄청나게 야단맞았지만, 다행히 앨범은 돌려받을 수 있었다."
