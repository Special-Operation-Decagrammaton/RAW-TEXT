1015106-16 = "2;안나;03;지금, 183호 기록물을 정리하고 있었어요."
1015106-17 = "2;안나;24;제가 반장이어서, 183호의 모든 기록물을 관리하거든요."
1015106-18 = "2;안나;22;그런데, 막상 해보려고 하니까 이런 정리에 재능이 별로 없었어요.\n#2;em;[땀]\n#2;stiff"
1015106-19 = "2;안나;03;처음에는 서류의 제목을 자음 순서대로 정리할까 했는데, 용지의 크기가 들쭉날쭉이어서 보기 흉했고요,"
1015106-20 = "2;안나;24;용지 크기순으로 했더니 이번엔 두께가 신경 쓰여서 마이크로미터로 종이 두께를 재고 있었어요……."
1015106-21 = "2;안나;22;진짜 바보인 것 같아서 스스로가 걱정될 정도로 정리에 재주가 없어요.\n#2;em;[세로선]"
1015106-22 = "[s3] \"일단 손 가는 대로 같이 해보자!\"\n[s4] \"선생님이 옆에서 도와줄게!\""
