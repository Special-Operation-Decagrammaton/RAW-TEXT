1015106-104 = "3;안나;01;……제가 스스로 쓴, 상장이에요.\n#3;stiff"
1015106-105 = "3;안나;99;11살 때, 아카데미에서 연 경연대회에서 대상을 탔었어요.\n#3;m3"
1015106-106 = "3;안나;05;그런데, 여러 가지 사정이 있어서 시상식이 취소됐고…… 상 받은 기록은 있지만 상장은 못 받았어요.\n#3;em;…"
1015106-107 = "3;안나;07;시상식에서 뽐내기도 하고, 꽃다발도 받고, 칭찬도 받을 걸 기대했다 보니, 속상해서 한참 울다가 직접 만들었어요."
1015106-108 = "3;안나;33;그렇지만, 막상 스스로 상장을 만들고 나니까, 스스로가 한심하게 느껴졌어요. 인정에 목마르다는 거, 얼마나 구차한 일인지 스스로도 잘 알아요.\n#3;em;[한숨]"
1015106-109 = "3;안나;03;철없고 고집도 많고, 인정받고 싶은 욕구만 잔뜩. 누구라도 귀찮을 테니까요."
1015106-110 = "3;안나;00;그래서 벽에 걸지도 못하고, 부끄러워서 여기 넣어두고 잊어버렸어요. 지금까지, 계속."
