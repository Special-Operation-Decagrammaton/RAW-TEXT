[translation]
1015106-1 = "天才とこれからも"
1015106-2 = "よいしょー！"
1015106-3 = ""
1015106-5 = ""
1015106-6 = "うっ、重っ……早くシステム化しないと……。"
1015106-7 = "[s] \"こんにちは、アンナ！\""
1015106-8 = ""
1015106-10 = ""
1015106-11 = "あっ、先生！お待ちしてました！"
1015106-12 = "もう一人ではお手上げでして……。"
1015106-13 = "[s1] \"アンナのためなら、いつでも駆けつけるよ！\"\n[s2] \"何を手伝えばいい？\""
1015106-16 = "今、183号の資料を整理をしていまして。"
1015106-17 = "私は学級委員長なので、183号の全ての記録を管理しています。"
1015106-18 = "けどいざやろうと思ったら、私には整理の才能がありませんでした。"
1015106-19 = "書類を五十音順に並べようと思ったら、#n用紙のサイズがバラバラで見栄えが悪く――"
1015106-20 = "用紙のサイズごとにまとめたら、#n今度は厚さが気になってマイクロメータで測り始めてしまい……。"
1015106-21 = "ほんと、バカみたいですよね。#n自分でも笑っちゃうくらい整理が苦手なんです。"
1015106-22 = "[s3] \"もう一度一緒にやってみよう！\"\n[s4] \"私も手伝うから！\""
1015106-23 = ""
1015106-24 = ""
1015106-26 = ""
1015106-27 = "お願いします！"
1015106-35 = "何度見ても、とんでもない量ですね……！"
1015106-36 = "183号の先代の記録をはじめ……#n研究や特許の書類、更には生徒個人の資料までありますから。"
1015106-37 = ""
1015106-39 = ""
1015106-40 = "よしっ！覚悟を決めて、始めましょう！"
1015106-41 = "[s] \"うん！頑張ろう！\""
1015106-44 = ""
1015106-47 = ""
1015106-56 = ""
1015106-57 = "やっぱり先生と一緒だとスムーズに進みますね。"
1015106-58 = "次は……。"
1015106-59 = ""
1015106-61 = ""
1015106-62 = "……これは後回しにしましょう。……あはは。"
1015106-63 = "[s] \"何の資料なの？\""
1015106-64 = "えっと……大したものではありません。私がここに来る前の記録です。"
1015106-65 = "見ると辛くなるので、ここに放置して忘れていました。"
1015106-66 = "えへへ……。"
1015106-67 = "[s] \"……少し気分転換でもしようか？\""
1015106-68 = ""
1015106-70 = ""
1015106-71 = "お気遣い、ありがとうございます。"
1015106-72 = "……よろしければ、一緒に見ていただけますか？"
1015106-73 = "先生と一緒なら……ちゃんと向き合えそうです。"
1015106-74 = "[s] \"アンナの力になれるなら、もちろん。\""
1015106-75 = "……ありがとうございます！"
1015106-78 = ""
1015106-79 = "まず、箱を開けることは成功ですね。"
1015106-80 = "意外とラクにできました。えへへ。"
1015106-81 = "わあ、幼稚園の頃に描いたものもありますね。なつかし～"
1015106-82 = "[s5] \"これ、アンナが描いたの？すごい！！\"\n[s6] \"アンナ博士の説明が聞きたいです！\""
1015106-85 = "わ、分かりました！任せてください！"
1015106-86 = "これは粒子加速器の一種……サイクロトロンの設計図で、#n電磁石で荷電粒子を加速する装置です。#n園児が入手できるもので設計したので、機能自体はシンプルですね。"
1015106-87 = "この頃は物理学に興味があったようです。#nそういえば、幼い時は毎日のように将来の夢が変わっていました。"
1015106-88 = "[s7] \"サイクロ……すごいね！\"\n[s8] \"園児で物理学を……さすが！\""
1015106-91 = "えへへ……そんな、すごいってほどでも～"
1015106-92 = ""
1015106-94 = ""
1015106-95 = "ここには設計図がまとめられていますね！#n9歳の時にはレーザージャイロスコープを作ろうとしていたし、#n本当にいろんなものに興味を持っていました。"
1015106-96 = ""
1015106-98 = ""
1015106-99 = ""
1015106-100 = "それとこれは……。"
1015106-101 = ""
1015106-103 = ""
1015106-104 = "……自分で作った賞状ですね。"
1015106-105 = "11歳の時、アカデミーの大会で大賞を取ったんです。"
1015106-106 = "しかし諸事情で授賞式の開催は中止になり……#n受賞記録は残りましたが、賞状はもらえませんでした。"
1015106-107 = "授賞式で威張りたかったし、#n花束をもらって褒められるのを楽しみにしていたので、#nしばらく泣いてから自分で作ったんです。"
1015106-108 = "でもいざ作ってみると、情けなくなってきて……#n承認欲求の塊は、傍から見たらどれほど見苦しいか#n自分でも分かっていましたから。"
1015106-109 = "意地っ張りで、認められたいという欲求ばかり。#n誰だってめんどくさい人だと思います。"
1015106-110 = "だから壁にかけることもできず、#n恥ずかしくてここに入れっぱなしだったんです。今までずーっと。"
1015106-111 = ""
1015106-113 = ""
1015106-114 = "……あっ！これは恥ずかしいので、二人の秘密ですよ！"
1015106-115 = "[s9] \"ちょっと遅くなったけど、今から授賞式をしようか？\"\n[s10] \"ここには……賞を受け取る人も、渡す人もいるから！\""
1015106-116 = ""
1015106-117 = ""
1015106-119 = ""
1015106-120 = "ほ、本当ですか？"
1015106-121 = "すごく嬉しいです！それならちょっと準備しますね！！"
1015106-122 = "外に行ってくるので、少し待っててください！！"
1015106-123 = ""
1015106-125 = ""
1015106-132 = "[wa:1250]― [log=안나]本当に、[wa:1950]飾って、[wa:730]しまいました……。[/log]"
1015106-135 = "― [log=안나]……そんな勇気、[/log]"
1015106-137 = "―  [log=안나]私には[wa:950]ないと思っていたのに。[/log]"
1015106-140 = "[ns11] \"大賞、[ruby=にき]仁木[/ruby]アンナ！\"\n[ns12] \"誠実で素晴らしいアンナに、この賞を授与します。\""
1015106-143 = "[wa:1000]― [log=안나]先生が、[wa:2600]私に……。[/log]"
1015106-146 = "― [log=안나]……ふふっ、[/log]"
1015106-148 = "― [log=안나]そんな表彰コメント、[wa:2220]初めて[wa:620]聞きました。[/log]"
1015106-151 = "― [log=안나]ありがとうございます、 [/log]"
1015106-154 = "― [log=안나]このような賞を[wa:810]いただくことができて、[/log]"
1015106-156 = "― [log=안나]本当に[wa:610]光栄です。[/log]"
1015106-159 = "[wa:2370]― [log=안나]……もっと、[/log]"
1015106-162 = "― [log=안나]自慢話や[wa:840]苦労話が出てくるかと思ったのですが。[/log]"
1015106-165 = "― [log=안나]今はもう、[wa:2600]感極まって[wa:1060]しまって……[/log]"
1015106-167 = "― [log=안나]何がなんだか。[/log]"
1015106-170 = "[wa:560]― [log=안나]ありがとうございます、[wa:1720]先生。[/log]"
1015106-173 = "― [log=안나]こんな日が[wa:544]来るだなんて、[/log]"
1015106-175 = "― [log=안나]本当に思っていなくて……。[/log]"
1015106-178 = "― [log=안나]夢が一気に、[/log]"
1015106-180 = "― [log=안나]全て叶ってしまったような……[/log]"
1015106-183 = "― [log=안나]そんな[wa:580]気持ちです。[/log]"
1015106-186 = "[ns13] \"私は、これからもずっとアンナの夢を応援しているよ。\"\n[ns14] \"これからも夢に向かって、精一杯挑戦してくれるかな？\""
1015106-189 = "[wa:680]― [log=안나]これからも、[wa:1700]ずっと……[/log]"
1015106-192 = "― [log=안나]ええ！[wa:1490]ずっと……。[/log]"
1015106-194 = "― [log=안나]ふふっ……！[/log]"
1015106-197 = "（元気を取り戻したアンナと一緒に、最後まで記録を整理した）"
1015106-198 = "（楽しんでもらえたのか、アンナはずっと笑顔だった）"
