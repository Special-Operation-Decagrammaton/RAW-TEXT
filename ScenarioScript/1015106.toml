1015106-79 = "3;안나;02;자, 일단 상자를 여는 건 성공했네요."
1015106-80 = "3;안나;03;생각보다 쉬웠네요. 헤헤."
1015106-81 = "3;안나;22;와아, 유치원 때 스케치북에 그린 것도 있어요. 귀여워라-"
1015106-82 = "[s5] \"꼬마 안나가 그린 그림! 멋진걸!\"\n[s6] \"안나 박사님의 설명이 듣고 싶습니다!\""
1015106-85 = "3;안나;34;그, 그럴까요? 엣헴!\n#3;em;[///]\n#3;stiff"
1015106-86 = "3;안나;03;이건 입자가속기의 일종인 사이클로트론 설계도예요. 전자석을 이용해서 이온을 가속하는 연구 장치인데요, 유치원생이 문구점에서 구할 수 있는 재료로만 설계하다 보니 기능 자체는 단순하네요, 후훗."
1015106-87 = "3;안나;33;이때는 물리학에 관심이 많았나 보네요, 생각해 보니 어릴 때는 매일매일 장래 희망이 바뀌었던 기억이 나요."
1015106-88 = "[s7] \"사이클로…… 멋있네!\"\n[s8] \"유치원생이 물리학을…… 멋있네!\""
