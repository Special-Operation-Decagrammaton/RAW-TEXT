[translation]
1001602-1 = "마감이에요. 선생님."
1001602-2 = "밀레니엄 게임개발부"
1001602-3 = "(미도리의 연락을 받고 게임개발부를 찾았다.)"
1001602-4 = "(부실에 도착하자, 방 한가운데에서 미도리가 스케치북을 든 채 집중하고 있는 모습이 보였다.)"
1001602-5 = "(그런데)"
1001602-6 = "[ns] \"미도리?\""
1001602-8 = "으음. 이건 아냐."
1001602-9 = "[s] \"저기요~?\""
1001602-11 = "으으으음. 이것도 아니야……."
1001602-12 = "[s] \"들리십니까~?\""
1001602-14 = "으으으으으으으음……. 전부 아니야……."
1001602-15 = "[s] \"반응이 없다. 그냥 미도리인 것 같다.\""
1001602-16 = "앗. 선생님? 어, 언제 오셨어요?!"
1001602-17 = "[s] \"그보다 상담할 게 있다고 했는데, 무슨 일이야?\""
1001602-18 = "아, 맞다. 상담. 그거 때문에 제가 선생님께 문자를 드렸었죠."
1001602-19 = "……."
1001602-20 = "우와아아앙. 선생님, 크, 큰일 났어요!"
1001602-21 = "[s] \"큰일?\""
1001602-22 = "마감일이 코앞인데 저, 아무것도 안 떠올라요……!"
1001602-24 = "[ns] \"어때, 조금 진정 됐어?\""
1001602-25 = "네에, 부끄러운 모습을 보였네요. 죄송해요."
1001602-26 = "요 며칠 간 계속 이걸로 고민하고 있던 터라……."
1001602-27 = "[s] \"그럼 미도리가 상담하고 싶다는 게?\""
1001602-28 = "그게……. 저희는 게임개발부잖아요?"
1001602-29 = "언제 어떤 식으로 신작을 만들게 될지 모르니까."
1001602-30 = "평소에도 이런저런 뱅크 아이디어를 모아두고는 해요."
1001602-31 = "마침 다음 아이디어 회의 마감이 얼마 남지 않아서, 그때까지 어떻게든 뭔가 새로운 걸 떠올려 보려고 했는데……."
1001602-32 = "[s] \"결국 밤새도록 아무것도 안 떠올랐다는 거지?\""
1001602-33 = "네……. 마감이 코앞인데, 아무것도……."
1001602-34 = "[s] \"정 힘들다면 마감을 늘려 달라고 하면 되는 거 아냐?\""
1001602-35 = "마감을……, 늘린다고요?"
1001602-37 = "선생님. 마감이라는 건 일종의 약속이에요. 지키기 어려우니 미루어 달라고 하면, 그건 너무 무책임하지 않나요?"
1001602-38 = "그건 게임개발부에서 일러스트레이터이자 게임 비쥬얼에 관련된 전반적인 부분을 담당한 입장으로서 절대 불허합니다!"
1001602-39 = "[s1] \"미도리는 자신한테 엄격하구나.\"\n[s2] \"책임감 넘치는 미도리, 멋져!\""
1001602-40 = "으, 으음. 저도 모르게 흥분했네요."
1001602-41 = "으, 으음. 저도 모르게 흥분했네요."
1001602-42 = "어쨌거나, 네. 그래요. 역시 마감을 늘린다니 그건 절대로 안 될 일이에요."
1001602-43 = "그러니 선생님에게 조언을 받고 싶어 문자를 보낸 거예요."
1001602-44 = "혹시 뭔가 방법이 없을까요?"
1001602-45 = "[s] \"미도리가 평소 했던 게임이 뭐야?\""
1001602-46 = " 저는 주로 퍼즐이나 캐주얼 게임을 좋아했어요. 테트니스나 포요포요 같은 거요."
1001602-47 = "[s3] \"그럼 평소 해보지 못한 장르의 게임을 해보면서\"\n[s4] \"아이디어를 얻어보는 건 어때?\""
1001602-48 = "앗, 과연……, 발상의 전환이네요. 평소 자주 안 해본 장르의 게임을 하면서 자극을 받는다는 거군요."
1001602-49 = "앗, 과연……, 발상의 전환이네요. 평소 자주 안 해본 장르의 게임을 하면서 자극을 받는다는 거군요."
1001602-50 = "으음~"
1001602-51 = "좋은 생각인 거 같아요!"
1001602-52 = "저기……. 그렇다면……."
1001602-53 = "혹시 선생님도, 어울려 주실 수 있을까요?"
1001602-64 = "(그리하여 미도리는 평소 해본 적 없다던 대전 게임을 가져왔다.)"
1001602-66 = "(그때는 아직 알지 못했다.)"
1001602-67 = "(그 선택이 어떤 파국을 불러오게 될지.)"
1001602-70 = "아앗! 또, 폭탄으로 길이 막혀서 갈 수가 없어요!"
1001602-71 = "이잇……! 다시! 다시 해요. 선생님!"
1001602-73 = "어?! 방금은 또 왜 죽은 거죠?!"
1001602-74 = "내가 설치한 폭탄인데, 왜 죽은 거죠?!"
1001602-75 = "아직, 아직이에요! 선생님! 아직 끝나지 않았어요!"
1001602-78 = "[ns] \"미도리 님, 슬슬 시간이…….\""
1001602-79 = "방금 판도 선생님이 이긴 판이잖아요!"
1001602-80 = "설마 선생님은 이기고 도망치는 그런 치사한 어른이신가요?!"
1001602-81 = "[s] \"아니, 그건 아닌데…….\""
1001602-82 = "아직 끝나지 않았어요."
1001602-83 = "게임이란 포기한 바로 그 순간이 게임 오버인 거니까!"
1001602-84 = "각오하세요. 선생님. 제가 이길 때까진 돌아갈 수 없으니까요."
1001602-86 = "(그렇게 아이디어는 뒷전으로 한 채, 밤새도록 미도리와 대전 게임을 즐겼다.)"
