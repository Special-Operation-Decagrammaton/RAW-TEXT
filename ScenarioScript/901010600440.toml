[translation]
901010600440-6 = ""
901010600440-7 = "And to summarize the access routes into and leaving Kanesaki Port..."
901010600440-8 = "The only \"official\" way to enter and exit the port is through the main gate guarded by the Carpaccio Family."
901010600440-9 = "\"Official\"? What about \"unofficial\"? Are there other routes?"
901010600440-10 = "Since it's a port, you could enter on a boat."
901010600440-11 = "Kanesaki Port isn't a passenger port. Cruises and civilians don't dock here."
901010600440-13 = "You could hide inside a crate and jump on a cargo ship, like smuggled goods. But I've heard it's super dangerous to be a stowaway."
901010600440-14 = "Where'd you hear that?"
901010600440-15 = "One of the dockhands was talking about it this morning."
901010600440-16 = "After stealing some valuables, a thief tried to make their getaway by sneaking onto a cargo ship."
901010600440-17 = "And they were found months later, suffering from malnutrition because the ship was out at sea so long."
901010600440-18 = "Wow... That's pretty scary."
901010600440-19 = "Alternatively, one could use the port's railroad platform."
901010600440-20 = "It's primarily a freight station, but apparently it also accommodates a commuter train in the early morning. It's meant for port workers."
901010600440-21 = "Ordinary tourists rarely use this train since the line only goes to the train depot, but it's an option if one needs to leave the port in a hurry."
901010600440-22 = "Given that, the only way Miyaguchi willingly left the port is..."
901010600440-23 = ""
901010600440-25 = ""
901010600440-26 = ""
901010600440-29 = ""
901010600440-30 = "#Q;쿠루미;Given that, the only way Miyaguchi willingly left the port is...\n[as2] \"Via the main entrance.\"\n[as3] \"Via swimming out to sea.\"\n[as1] \"Via the commuter train.\""
901010600440-31 = "By taking the early morning commuter train, he could've left the port without being noticed."
901010600440-32 = "And since the platform is managed by Highlander Academy, he would've been able to avoid the Carpaccio Family."
901010600440-33 = "I reached out to the General Student Council to check the boarding records at the platform..."
901010600440-35 = "...That would be difficult."
901010600440-36 = "Kanesaki Port's main entrance is guarded by the Carpaccio Family, who Miyaguchi is indebted to."
901010600440-37 = "While I'm not a member, I doubt the Carpaccio Family would let a major debtor just waltz out their main entrance."
901010600440-38 = ""
901010600440-40 = ""
901010600440-41 = ""
901010600440-42 = ""
901010600440-46 = "Swimming out to sea in the middle of the night... That sounds like an incredibly perilous plan."
901010600440-47 = "Surely there's a safer way to flee the port?"
901010600440-48 = ""
901010600440-50 = ""
