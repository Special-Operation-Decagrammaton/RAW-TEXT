901010600440-59 = ""
901010600440-60 = "The General Student Council Transportation Office finally replied to me."
901010600440-61 = ""
901010600440-63 = ""
901010600440-64 = "What did they say? Did Miyaguchi really take the train that day?"
901010600440-65 = "...Yes. The record says Miyaguchi purchased a train ticket AND left the port."
901010600440-66 = "Huh. Well so much for a brutal crab attack. The guy just ran off."
901010600440-67 = "I was worried for nothing. I thought he had an accident."
901010600440-69 = "I'm just happy to hear that no one's actually missing."
