[translation]
901010600440-7 = "카네사키 항구로 드나들 수 있는 통로에 대해 정리하자면……"
901010600440-8 = "현재 '공식적으로 확인된' 항구를 출입할 수 있는 유일한 통로는, 카르파초 패밀리가 지키고 있는 정문 도로뿐이었어."
901010600440-9 = "공식적으로? 그럼 또 다른 출입 통로가 있단 말이야?"
901010600440-10 = "일단은 항구니까, 배를 타고 들어오는 건 가능하지."
901010600440-11 = "다만 카네사키 항구는 여객항이 아니니까, 평범한 여객선은 기항하지 않아."
901010600440-13 = "밀수품처럼 화물에 섞여 들어가 화물선을 타고 빠져나가는 수도 있다고 하지만, 그 방법은 위험해서 추천하지 않는다 하더라고."
901010600440-14 = "누가 그런 걸 추천하는데?"
901010600440-15 = "오전에 항만에서 만난 인부가 알려줬어."
901010600440-16 = "옛날에 항구에 숨어 들어온 도둑이 귀중품을 훔친 뒤에 화물선에 숨어 들어갔다가……"
901010600440-17 = "화물선이 몇 개월 동안 항해를 계속하는 바람에 쫄쫄 굶어서, 영양실조에 걸린 상태로 발견된 적이 있다 하더라고."
901010600440-18 = "우와…… 근래에 들은 괴담 중에 제일 소름 끼치는데."
901010600440-19 = "여하튼, 그 외에 다른 수단으로는 항구의 철도 승강장을 이용하는 방법이 있어."
901010600440-20 = "이쪽도 여객 열차가 다니지 않는 화물역이지만, 이른 새벽에 한해서는 항만 노동자들을 위해 일시적으로 통근 열차를 운영한다나 봐."
901010600440-21 = "열차 차고지와 연결된 노선이라, 평범한 승객은 거의 이용하지 않지만 항구에서 급하게 나가야 할 일이 있다면 이쪽도 고려해 볼 순 있겠지."
901010600440-22 = "이렇게 된 이상, 미야구치가 자의로 항구를 벗어날 수 있는 방법은……"
901010600440-30 = "이렇게 된 이상, 미야구치가 자의로 항구를 벗어날 수 있는 방법은……\n[as2] 정문을 통해 빠져나갔다.\n[as3] 바다를 헤엄쳐 빠져나갔다.\n[as1] 통근 열차를 타고 빠져나갔다."
901010600440-31 = "확실히 이른 새벽에 차고지로 회차하는 통근 열차를 탔다면 다른 사람들의 눈에 띄지 않게 항구를 벗어나는 게 가능했겠네."
901010600440-32 = "승강장의 관리는 하이랜더 학원에서 하고 있으니 카르파초 패밀리의 눈에도 띄지 않았을 테고."
901010600440-33 = "안 그래도 승강장의 승차 기록을 확인해달라고 총학생회의 담당자에게 연락을 해두었는데—"
901010600440-35 = "……그건 어려울 것 같습니다."
901010600440-36 = "카네사키 항구의 정문은 미야구치가 빚을 지고 있는 카르파초 패밀리가 지키고 있으니까요."
901010600440-37 = "다른 조직이라면 몰라도, 카르파초 패밀리가 채무자를 정문으로 순순히 보내주지는 않았을 것 같습니다."
901010600440-46 = "어두운 새벽에 바다를 헤엄쳐 도망친다니…… 너무 위험한 방법 같은데."
901010600440-47 = "그 방법 말고도 항구를 빠져나갈 수 있는 다른 안전한 수단이 있지 않겠어?"
901010600440-60 = "아, 총학생회 교통실에서 답변 왔다."
901010600440-64 = "뭐래? 정말로 그 날짜에 미야구치가 열차에 탄 게 맞대?"
901010600440-65 = "……응. 확인해 보니 확실히 그날, 그 시간에 미야구치가 열차표를 발권하고 항구를 빠져나간 기록이 있어."
901010600440-66 = "뭐야. 괴물 게의 습격이니 뭐니 했지만, 실제로는 몰래 떠난 것뿐이잖아."
901010600440-67 = "무슨 사고가 있지는 않았을까 괜히 걱정했었네."
901010600440-69 = "그래도 실제로 실종된 사람이 없었다는 건 다행이야."
