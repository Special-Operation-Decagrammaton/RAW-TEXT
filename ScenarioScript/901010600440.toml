[translation]
901010600440-6 = ""
901010600440-7 = "ถ้าสรุปเส้นทางที่ใช้เข้าออกท่าเรือคาเนะซากิ..."
901010600440-8 = "ปัจจุบัน เส้นทางเดียวที่ 'ตรวจสอบได้อย่างเป็นทางการ' ว่าสามารถใช้เข้าออกท่าเรือได้ ก็คือถนนตรงประตูหน้าที่การ์ปัชโช่ แฟมิลี่เฝ้าอยู่"
901010600440-9 = "อย่างเป็นทางการ? หมายความว่ายังมีเส้นทางเข้าออกอื่นอีกงั้นเหรอ?"
901010600440-10 = "ปกติถ้าเป็นท่าเรือ อย่างน้อยก็สามารถนั่งเรือเข้ามาได้"
901010600440-11 = "แต่ท่าเรือคาเนะซากิไม่ใช่ท่าเรือโดยสาร เรือโดยสารทั่วไปจึงไม่แวะจอด"
901010600440-13 = "แต่ฉันได้ยินว่าคนสามารถปะปนไปกับสินค้าได้เหมือนของเถื่อน แล้วขึ้นเรือขนส่งสินค้าเพื่อหลบหนี#nออกไปได้ แต่วิธีนั้นอันตรายก็เลยไม่แนะนำ"
901010600440-14 = "ใครเป็นคนแนะนำเรื่องแบบนั้นกัน?"
901010600440-15 = "คนงานที่เจอในท่าเรือตอนเช้าบอกฉันมาว่า"
901010600440-16 = "เมื่อก่อนมีโจรคนหนึ่งแอบเข้ามาในท่าเรือ หลังจากขโมยของมีค่าแล้วก็เข้าไปซ่อนตัวในเรือขนส่งสินค้า"
901010600440-17 = "แต่เรือขนส่งสินค้าออกเดินทางต่อเนื่องนานหลายเดือน โจรคนนั้นก็เลยอดอยากจนถูกพบในสภาพ#nขาดสารอาหารน่ะ"
901010600440-18 = "อึ๋ย... นี่เป็นเรื่องสยองขวัญที่ชวนขนลุกที่สุดในบรรดาเรื่องที่ได้ยินช่วงนี้เลย"
901010600440-19 = "นอกจากนี้ก็ยังมีวิธีใช้ชานชาลารถไฟของท่าเรือด้วยนะ"
901010600440-20 = "ที่นี่ก็เป็นสถานีขนส่งสินค้าที่ไม่มีรถไฟโดยสารวิ่งผ่าน แต่ดูเหมือนว่าเฉพาะช่วงเช้ามืดจะมีการเดินรถไฟ#nชั่วคราวเพื่อคนงานท่าเรือน่ะ"
901010600440-21 = "แต่มันเป็นเส้นทางที่เชื่อมต่อกับโรงเก็บรถไฟ ผู้โดยสารทั่วไปจึงแทบไม่ใช้กัน แต่ถ้าจำเป็นต้องรีบออกจากท่าเรือ ก็อาจพิจารณาวิธีนี้ได้"
901010600440-22 = "เมื่อเป็นแบบนี้ วิธีที่มิยากุจิจะออกจากท่าเรือไปได้ด้วยตัวเองก็คือ..."
901010600440-23 = ""
901010600440-25 = ""
901010600440-26 = ""
901010600440-29 = ""
901010600440-30 = "#Q;쿠루미;เมื่อเป็นแบบนี้ วิธีที่มิยากุจิจะออกจากท่าเรือไปได้ด้วยตัวเองก็คือ...\n[as2] ออกไปทางประตูหน้า\n[as3] ว่ายน้ำออกไปทางทะเล\n[as1] นั่งรถไฟสำหรับคนงานออกไป"
901010600440-31 = "จริงด้วย ถ้าขึ้นรถไฟรับส่งที่วิ่งกลับไปยังโรงเก็บรถไฟในตอนเช้ามืด ก็คงออกจากท่าเรือไปได้#nโดยไม่สะดุดตาคนอื่น"
901010600440-32 = "ชานชาลาก็อยู่ภายใต้การดูแลของสถาบันไฮแลนเดอร์ ทางการ์ปัชโช่ แฟมิลี่ก็คงไม่ทันสังเกตด้วย"
901010600440-33 = "และฉันก็ติดต่อเจ้าหน้าที่ขององค์การนักเรียน และขอให้ช่วยตรวจสอบบันทึกการขึ้นรถจากชานชาลา#nเอาไว้แล้ว..."
901010600440-35 = "วิธีนั้นคงเป็นไปได้ยากค่ะ..."
901010600440-36 = "เพราะประตูหน้าของท่าเรือคาเนะซากิถูกเฝ้าโดยการ์ปัชโช่ แฟมิลี่ที่เป็นเจ้าหนี้ของมิยากุจิค่ะ"
901010600440-37 = "ถ้าเป็นองค์กรอื่นก็ไม่แน่ แต่การ์ปัชโช่ แฟมิลี่คงไม่ยอมปล่อยลูกหนี้ผ่านประตูหน้าไปง่ายๆ หรอกค่ะ"
901010600440-38 = ""
901010600440-40 = ""
901010600440-41 = ""
901010600440-42 = ""
901010600440-46 = "ว่ายน้ำหนีออกไปทางทะเลในตอนเช้ามืดที่มืดสนิท... ดูเป็นวิธีที่อันตรายเกินไปนะ"
901010600440-47 = "นอกจากวิธีนั้น น่าจะยังมีวิธีอื่นที่ปลอดภัยกว่าสำหรับออกจากท่าเรือไม่ใช่เหรอ?"
901010600440-48 = ""
901010600440-50 = ""
901010600440-51 = ""
901010600440-52 = ""
901010600440-55 = ""
901010600440-59 = ""
901010600440-60 = "อ๊ะ ฝ่ายคมนาคมขององค์การนักเรียนตอบกลับมาแล้ว"
901010600440-61 = ""
901010600440-63 = ""
901010600440-64 = "ว่ายังไงบ้าง? วันนั้นมิยากุจิขึ้นรถไฟไปจริงๆ หรือเปล่า?"
901010600440-65 = "อื้อ... ตรวจสอบแล้วพบว่า ในวันและเวลานั้นมีบันทึกว่ามิยากุจิซื้อตั๋วและออกจากท่าเรือไปจริงๆ"
901010600440-66 = "อะไรกัน คนอื่นถึงกับพูดว่าโดนปูปีศาจโจมตี แต่ที่จริงก็แค่แอบหนีไปเท่านั้นเองนี่นา"
901010600440-67 = "กลายเป็นว่าเรากังวลโดยเปล่าประโยชน์ว่าอาจมีอะไรเกิดขึ้นกับเขาสินะ"
901010600440-69 = "แต่ก็ดีแล้วละที่ไม่ได้มีใครหายตัวไปจริงๆ"
