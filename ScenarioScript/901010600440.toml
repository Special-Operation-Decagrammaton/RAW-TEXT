[translation]
901010600440-6 = ""
901010600440-7 = "我整理了關於能夠進出鐘崎港的路線……"
901010600440-8 = "目前經過「官方確認」能出入港口的唯一通道，只有卡爾帕喬家族看守的正門而已。"
901010600440-9 = "官方確認？意思是還有其他的出入口嗎？"
901010600440-10 = "畢竟是港口，所以搭船進入是可行的。"
901010600440-11 = "只不過鐘崎港不是客運港，因此一般的客船不會停靠。"
901010600440-13 = "聽說也有像走私品那樣混在貨物之中，搭乘貨船離開的方法。#n但是那個方法太危險了，所以並不推薦。"
901010600440-14 = "誰會推薦那種事啊？"
901010600440-15 = "這是上午在港口遇到的工人告訴我的。"
901010600440-16 = "以前有個潛入港口的小偷，把貴重品偷走之後躲進了貨船裡……"
901010600440-17 = "結果貨船連續航行了好幾個月，他也因此長時間挨餓……#n等到被發現的時候，那個小偷已經處於營養失調的狀態了。"
901010600440-18 = "唔哇……這是我最近聽過的怪談裡最令人毛骨悚然的了。"
901010600440-19 = "總之，除此之外還有利用港口鐵路月臺的方法。"
901010600440-20 = "那邊也是沒有客運列車行駛的貨運站。#n不過聽說只有在清晨，會為了港口工人暫時運行通勤列車。"
901010600440-21 = "因為是和鐵道車庫相連的路線，所以一般乘客幾乎不會使用。#n但是如果有必須緊急離開的情況，這條路線同樣可以列入考慮。"
901010600440-22 = "如此一來，宮口能自行離開港口的方法是……"
901010600440-23 = ""
901010600440-25 = ""
901010600440-26 = ""
901010600440-29 = ""
901010600440-30 = "#Q;쿠루미;如此一來，宮口能自行離開港口的方法是……\n[as2] 從正門溜出去。\n[as3] 游泳橫渡大海。\n[as1] 搭乘通勤列車。"
901010600440-31 = "如果搭上清晨返回車庫的通勤列車，確實有可能在不被發現的情況下離開港口呢。"
901010600440-32 = "月臺是由高地人學園負責管理，所以應該也不會被卡爾帕喬家族發現。"
901010600440-33 = "正好我已經有事先拜託聯邦學生會的負責人，請他確認月臺的乘車記錄──"
901010600440-35 = "……那恐怕有困難。"
901010600440-36 = "因為鐘崎港的正門，是由宮口欠下債務的卡爾帕喬家族看守。"
901010600440-37 = "如果是其他組織還有可能，但是卡爾帕喬家族應該不會輕易讓債務人從正門離開。"
901010600440-38 = ""
901010600440-40 = ""
901010600440-41 = ""
901010600440-42 = ""
901010600440-46 = "要在還沒完全天亮的清晨游渡大海逃跑……感覺太危險了。"
901010600440-47 = "除了這個方法之外，應該還有其他能安全離開港口的手段吧？"
901010600440-48 = ""
901010600440-50 = ""
901010600440-51 = ""
901010600440-52 = ""
901010600440-55 = ""
901010600440-59 = ""
901010600440-60 = "啊，聯邦學生會交通室有回覆了。"
901010600440-61 = ""
901010600440-63 = ""
901010600440-64 = "對方怎麼說？宮口真的有在那天搭乘列車嗎？"
901010600440-65 = "……嗯。確認之後發現，當天那個時間確實有宮口購票離開港口的記錄。"
901010600440-66 = "搞什麼，還說是什麼遭到怪物螃蟹襲擊之類的，實際上只是偷偷離開而已嘛。"
901010600440-67 = "我還擔心是不是發生了什麼意外，結果只是虛驚一場啊。"
901010600440-69 = "不過實際上沒有人失蹤，真的是太好了。"
