[translation]
10026080-1 = "제8화;조사 포인트 E. 폭포 뒤의 아지트"
10026080-4 = "……저기 저 폭포인가 봐요! 거의 다 도착한 거 같네요!"
10026080-5 = "그런데 생각보다 거리가 꽤 되는군요? 게다가 상당히 고지대이고……."
10026080-6 = "폭포 뒤에 숨은 동굴이라……."
10026080-7 = "확실히, 밖에서는 전혀 안 보이네요. 성도회의 비밀장소답달까."
10026080-8 = "그럼 들어가기 전에 인원 체크를……. 여러분, 다들 잘 올라오셨나요?"
10026080-9 = "네~."
10026080-10 = "네, 네……. 그럭저럭……."
10026080-11 = "다들 무사히……. 어라, 선생님? 좀 피곤해 보이시는데……."
10026080-12 = "[s1] \"나, 나는……. 괜찮아…….\"\n[s2] \"운동량을 좀 늘려야겠어…….\""
10026080-15 = "하하……. 오는 길도 꽤 험하긴 했으니까요. 좀 더 천천히 올 걸 그랬나 봐요."
10026080-16 = "그러고 보니 우이 씨는……. 방금 전까지만 해도 분명 제 곁에……."
10026080-17 = "……우이 씨……?"
10026080-21 = "어윽……. 윽……. 헉……. 헉헉……. 허억……."
10026080-22 = "진짜……. 어으…… 이런……. 망ㅎ……."
10026080-23 = "아니……. 안 돼……. 좋은 말……. 크윽……. 허으억……. 흑……."
10026080-24 = "네…… 어떻게든……. 도착……했……습니다……."
10026080-29 = "우이 씨!?!?"
10026080-31 = "후우……. 하아……. 좀 낫군요……. 기다려 주셔서 감사합니다……."
10026080-32 = "정말이지……. 올라오는 것부터가……. 고문이군요, 여긴……. 길도 제대로 안 만들어져 있고……."
10026080-33 = "하지만……. 그만큼 더더욱 확신이 들고 있습니다. 그만큼 '숨겨야 할 곳'이라는 뜻이겠지요."
10026080-34 = "어쩌면 우리가 지금까지 본 것들은 모두 연막……."
10026080-37 = "지금부터 나올……. 무시무시하고 끔찍한 무언가를 가리기 위한 연막일 가능성도……."
10026080-38 = "혹시나 했던 고문실이라던가……. 처형장……. 끔찍한 종교의식……. 그런 것일지도……!!"
10026080-39 = "그리고 마침내……. 숨겨왔던 시스터후드의 진상 또한……!!"
10026080-43 = "[ns3] \"우이. 스톱, 스톱.\"\n[ns4] \"또, 또 이상한 소리 한다.\""
10026080-46 = "……아."
10026080-47 = "죄송해요. 또 정신을 못 차리고 입에서 나오는 대로 말해버렸군요."
10026080-48 = "뭐, 실상은 봐야 아는 거니까요. 일단은 네……. 저도 그런 게 아니길 바라……겠습니다."
10026080-49 = "네. 뭐, 아니기를……."
10026080-53 = "……으흐……."
10026080-54 = "미안해요. 역시 거짓말은 입에 안 붙네요. 자기가 말하면서도 어색한 게……."
10026080-55 = "[s5] \"그건 좀 더 노력해 보렴…….\"\n[s6] \"일단 조사를 시작해 볼까?\""
10026080-58 = "네……."
10026080-60 = "폭포 동굴 안"
10026080-62 = "여기가……. 지도의 그 폭포…… 안이로군요. 설마 폭포 안에 동굴이 있었을 줄이야……."
10026080-63 = "밖에선 전혀 볼 수 없겠네요. 하긴 그래야 '비밀장소'로 의미가 있겠죠?"
10026080-68 = "으으……. 쯧……."
10026080-69 = "[s7] \"……우이?\"\n[s8] \"왜 그래? 안색이 안 좋아.\""
10026080-72 = "물소리가 시끄러워서……. 말소리도 잘 안 들리는 거 같고……."
10026080-73 = "……아. 죄송해요, 선생님. 혼잣말이었어요……. 신경 쓰지 말아주세요……."
10026080-74 = "어라……. 확실히 그럴지도……."
10026080-75 = "……■■■ ■■ ■■■ ■■■■■-."
10026080-76 = "■■■■■■■■……♡♡♡"
10026080-77 = "[s] \"……?\""
10026080-78 = "정말이네요? 작게 말하면 잘 안 들려요. 코하루 쨩도 해볼래요?"
10026080-79 = "안 해! 안 한다고!!"
10026080-80 = "[s9] \"이, 일단 주변을 둘러볼까.\"\n[s10] \"자, 자! 조사하자. 조사……!!\""
10026080-85 = "(동굴의 좀 더 깊은 곳으로 들어가 보았다.)"
10026080-86 = "(깊은 곳 안쪽에서, 나무로 만든 기다란 상자들이 여럿 모습을 드러냈다.)"
10026080-87 = "[ns11] \"어라, 이건…….\"\n[ns12] \"나무로 된 상자들……?\""
10026080-90 = "……뭐, 뭐죠!? 왜 이런 곳에 상자들이……."
10026080-91 = "그것도 사람 키만 한 사이즈의 큰 상자들이네요. 뭐랄까, 생긴 게 마치……."
10026080-95 = "……관……?"
10026080-101 = "조금 특이한 형태이긴 하지만, 이런 상황이라면 보통 그렇게 생각할 수밖에 없군요."
10026080-102 = "과, 관이요……!? 관이라니, 어째서 이런 곳에 관이……!!"
10026080-103 = "……히나타 씨. 그리고……. 으음……. 코하루? 씨? 였던가요……?"
10026080-104 = "네, 네!? 저……. 저요……? 저 부르셨……나요……?"
10026080-105 = "네. 죄송하지만 두 분은 잠시 조금 떨어진 곳에서 뒤로 봐 주고 계실 수 있을까요?"
10026080-106 = "만에 하나를 위해서……말이죠."
10026080-107 = "마, 만에 하나……? 무슨 말씀을……."
10026080-108 = "혹시라도……. 네."
10026080-109 = "……이게 진짜 관일 수도 있으니까. 확인을 위해 지금 하나 열어보려고요."
10026080-110 = "고인께는 실례일 수 있지만……. 살짝 확인하는 것 정도는 어쩔 수 없겠죠. 조사를 위해."
10026080-111 = "그, 그렇군요! 그렇다면 더더욱 힘쓰는 일이니, 제가 거들어서……."
10026080-112 = "아뇨. 히나타 씨."
10026080-113 = "……!?"
10026080-114 = "말씀드렸듯 두 분은 그냥 돌아보고 계셨으면 해요."
10026080-115 = "그냥 제가 마음이 불편해서 그런 거예요. 히나타 씨에게는, 혹시라도 가급적, 위험한 걸 보여드리고 싶지 않아요."
10026080-116 = "……그러니 지금은 그냥 시키는 대로 해줘요. 부탁이에요."
10026080-118 = "아……. 어……."
10026080-119 = "으음……. 네, 네……. 그럼 일단 돌아서 있을게요……."
10026080-125 = "……어라."
10026080-126 = "저는요……? 저는 돌아서 있지 않아도 되나요……?"
10026080-127 = "……???"
10026080-128 = "아……. 죄송합니다. 저도 모르게 그냥……. 분위기가……. 뭔가 내성이 있는 분이실 줄……."
10026080-129 = "보고 싶지 않으시면 당연히 돌아서 계셔도 좋아요. 이건 저 혼자 봐도 괜찮으니까요."
10026080-130 = "……뭔가 우이 씨에게 제 이미지란……. 좀……."
10026080-131 = "……그치만 맞으니까 넘어가죠. 함께 확인해 볼까요?"
10026080-132 = "선생님도……. 괜찮으시죠?"
10026080-133 = "[s13] \"혹시라도 실례가 되지 않도록 조심해서 하자.\"\n[s14] \"응. 괜찮아.\""
10026080-136 = "……네."
10026080-137 = "그럼, 조금만 열어보겠습니다."
10026080-138 = "……읏……."
10026080-142 = "음……. 아직 어두워서 안이……. 잘……."
10026080-143 = "……음? 어……어……?"
10026080-144 = "어라라……. 이건……."
10026080-148 = "……!? 뭐, 뭐죠!? 방금 소리……?"
10026080-149 = "뭐, 뭐야 이거!? 언제 들어왔지……!?"
10026080-155 = "으음……. 또 이렇게 되는 건가요……."
10026080-156 = "아무래도 손님이 오신 것 같은 느낌이네요. 슬슬 익숙해질 때도 된 거 같고……."
10026080-157 = "……사실 따지고 보면 이쪽이 '손님'이겠지만요."
10026080-159 = "그렇게 농담할 때는 아니지 않나요?"
10026080-165 = "[ns15] \"일단 여길 빠져나가자.\"\n[ns16] \"뚫고 나간다!\""
10026080-168 = "아, 왜 계속 이렇게 되는 건데!?"
10026080-169 = "……선생님, 그럼 지휘 부탁드리겠습니다."
10026080-170 = "갑니다!!"
