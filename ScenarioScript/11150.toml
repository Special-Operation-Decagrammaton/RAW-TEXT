[translation]
11150-2 = "제15화;가자, 석양을 향해!"
11150-3 = "시내"
11150-8 = "후아, 답답해. 이제 벗어도 되지?"
11150-9 = "머뭇거리면 안돼. 계속 서둘러. 곧 추격대가 올 거야."
11150-10 = "최대한 빨리 벗어나야 해요……. 곧 도로 봉쇄가 시작될 거예요……."
11150-11 = "다 준비해 뒀으니까 괜찮아요☆"
11150-12 = "이쪽이다. 서두르자."
11150-13 = "아니, 시로코 선배…… 왜 안벗는 거야? 안 답답해?"
11150-14 = "자신의 천직이랄까 영혼의 일부 같은 거라서 벗기 싫은 거 아냐?"
11150-15 = "시로코 선배가 아비도스에 와서 다행이야……. #n다른 학교 갔으면 엄청난 범죄자가 되었을 거야."
11150-18 = "(스윽) 으, 으음……."
11150-20 = "……?!"
11150-23 = "……."
11150-25 = "봉쇄를 뚫었습니다. 이제 여기부터는 안전해요."
11150-26 = "좋았어! 성공이야!"
11150-27 = "정말로 블랙 마켓의 범죄 은행을 털어버릴 줄은……. 하아……."
11150-28 = "시로코 쨩. 운행 기록 서류는 잘 챙겼지?"
11150-29 = "으, 으음……. 가방에 있어."
11150-31 = "(찰칵-)"
11150-32 = "……엥? 이건?! 가방 속에 뭐가 있는…… 지폐 다발……?!"
11150-33 = "우, 우와아아아앗-?! 시로코 선배 현금을 털어버린 거야?!"
11150-34 = "아, 아니……. 목표인 서류는 제대로 챙겼어. #n이 돈은 은행 직원이 멋대로 착각하고 집어넣은 거야……."
11150-35 = "어디…… 헤에, 1억은 되어보이는데. 정말로 5분 만에 1억을 털어버렸잖아."
11150-36 = "좋았어!! 뭘 멀뚱멀뚱 보고 있어? 가져가자고!"
11150-37 = "……."
11150-39 = "자, 잠깐만요! 그 돈을 쓰겠다고요?!"
11150-40 = "아야네 쨩? 왜 그래? 빚을 상환해야지!"
11150-41 = "그래서야…… 정말로 범죄잖아, 세리카 쨩!!"
11150-42 = "뭐, 뭐가 범죄야! 이 돈은 애초에 우리가 피땀흘려서 번 돈이었어! #n그게 저 범죄 은행으로 흘러들어간 거잖아!"
11150-43 = "게다가 어차피 놔뒀으면 범죄자들의 무기나 탄약으로 바뀌게 될 거였다고! #n범죄자들의 돈을 터는게 무슨 죄야!"
11150-44 = "……."
11150-45 = "저는 세리카 쨩의 의견에 동의해요. #n범죄자들의 범죄 자금이니 우리가 좀 더 좋은 곳에 쓰는게 좋을 거 같아요."
11150-46 = "그치, 거 봐! 이거면 우리 아비도스 학교의 빚을 줄이는데 큰 도움이 된다고!"
11150-47 = "흐응…… 그렇긴 한데…… 시로코 쨩은 어떻게 생각해?"
11150-48 = "……호시노 선배가 반대하겠지. 그러니 논할 필요도 없어."
11150-49 = "엥?!"
11150-50 = "역시 시로코 쨩. 내 마음을 잘 안다니까."
11150-51 = "우리한테 필요한 건 저 서류들이지, 돈이 아니야."
11150-52 = "지금은 악당 녀석들의 범죄 자금이니까 괜찮다고 해도, 다음 번엔? 그다음 번엔?"
11150-53 = "……."
11150-54 = "우리가 이런 방식에 조금씩 익숙해지기 시작하면…… #n나중엔 아무렇지도 않게 되어버릴 거야."
11150-55 = "……."
11150-56 = "그러다 언젠가 우리한테 엄청 위급한 사건이 터지면…… #n그땐 어쩔 수 없다는 핑계를 대면서 해선 안될 행동을 저지르겠지."
11150-57 = "으헤~ 이 아저씨는 귀여운 후배들이 그렇게 되는 건 싫다고."
11150-58 = "그런 식으로 지켜낸 학교가 무슨 의미가 있겠어."
11150-59 = "……."
11150-60 = "애초에 이런 방식을 쓸 거였다면 노노미 쨩의 그 황금 카드로 빚을 갚아달라고 했겠지."
11150-61 = "……. 저도 그 의견을 냈지만 호시노 선배가 반대해서……."
11150-62 = "저도 이해하고 있어요. 우리들이 적법한 방법으로 노력한 게 아니면, 아비도스 학교의 빚을 상환해도 그건 아비도스 학교가 아니다……."
11150-63 = "으헤, 그런 거야."
11150-64 = "그러니까, 이 가방은 두고 간다. 우리한테 필요한 서류만 챙겨. #n부장의 명령이야."
11150-67 = "으아아!! 답답해! 진짜 뭐야!! 이 큰돈을 버리자고?! 진짜 이상한 데서 고지식해!!"
11150-68 = "음. 부장의 명령이라면……."
11150-69 = "저는 아비도스의 사정을 잘은 모르지만…… #n이 돈을 가져갔다간 다른 트러블에 휘말릴 수도 있었을 거예요."
11150-70 = "어떻게보면 재앙의 씨앗 같은 거니……."
11150-71 = "하하…… 어쩔 수 없죠, 그럼. 이 가방은 제가 적당히 버릴게요."
11150-72 = "이야, 부탁해."
11150-73 = "……!! 잠깐만요! 누군가가 그쪽으로 접근하고 있습니다!"
11150-74 = "……!! 마켓 가드의 추격인가!!"
11150-75 = "……아, 아뇨. 적의는 없어 보입니다."
11150-77 = "어디 보자…… 저건……"
11150-78 = "흐, 흥신소의 아루?!"
11150-81 = "하아, 하아…… 자, 잠깐 기다려!!"
11150-82 = "(휘익) ……!!"
11150-84 = "아, 진정해. 나는 적이 아니니까……."
11150-85 = "(뭐야, 저 녀석이 왜…….)"
11150-86 = "(공격할까?)"
11150-87 = "(글쎄다. 적의가 없는 녀석을 공격하기도 그렇고…….)"
11150-88 = "(아시는 분인가요……?)"
11150-89 = "(으헤~ 인연이 깊지.)"
11150-90 = "저, 저기…… 다, 다른 건 아니고……."
11150-91 = "은행 터는 거 잘 봤어. ……블랙 마켓의 은행을 5분 만에 털고 유유히 탈출이라니. #n이 시대에 흔치 않은 무법자잖아, 당신들?"
11150-92 = "……?!"
11150-93 = "솔직히 엄청 인상적이었달까, 이 시대에 저런 과감함이 아직 존재한다니…… #n감동적이랄까."
11150-94 = "나, 나도 힘내겠어! 법칙과 규율에 얽매이지 않는 진정한 자유로운 영혼! #n그런 무법자가 될 거니까!"
11150-95 = "(무슨 소릴 하는 거야, 이 녀석은…….)"
11150-96 = "그, 그러니까……. 이, 이름을 알려줘!!"
11150-97 = "이름……?!"
11150-98 = "집단? 세력? 동아리? 그런 게 있을 거 아냐? #n본명까지는 아니더라도…… 내가 너희들의 모습을 가슴 속에 깊이 새겨두고 있을 테니까!!"
11150-99 = "(으헤…… 이 친구 뭔가 이상한 오해를 하고 있는 것 같은데…….)"
11150-100 = "……네! 무슨 얘기인지 알겠어요!"
11150-101 = "(노, 노노미 선배?!)"
11150-102 = "저희는 바로…… 수영복 복면단!"
11150-103 = "……수영복 복면단?!"
11150-104 = "네, 네이밍 센스 쩔어……!! 완전 쿨해!! 짱이야!!"
11150-105 = "(…….)"
11150-106 = "으헤~ 원래는 학교 수영복에 복면이 정식 복장인데 지금은 급해서 복면만 쓴 거야."
11150-107 = "(무슨 이상한 설정 붙이고 있어!?)"
11150-108 = "맞아요! 평상시에는 아이돌로 활동하다가 밤이 되면 악당들을 물리치는 정의의 괴도로 변신하는 거예요!"
11150-109 = "저는 크리스티나다롱~♧"
11150-110 = "다, 다롱♧……?! 캐릭터도 이미 잡아 둔 거야?!"
11150-111 = "으헤, 눈에는 눈. 이에는 이. 인정사정 보지 않고 고고하게 인외마경의 길을 걷는다. #n이게 바로 우리 모토지!!"
11150-112 = "마, 맙소사!!"
11150-114 = "……저 녀석들 뭐하고 있는 거야, 대체……."
11150-115 = "우와, 아루 쨩 완전 몰입했어. 특촬물 행사에 구경 간 아이 표정이야!"
11150-118 = "(이제 됐지? 적당히 도망치자-!)"
11150-119 = "자, 그럼 아디오스~☆"
11150-120 = "가자고! 석양을 향해!"
11150-121 = "석양은 없지만요……."
11150-122 = "(후다닥)"
11150-123 = "……"
11150-124 = "알겠어! 인외마경…… 그 모토, 내 영혼에 새기겠어! 나도 힘내겠어!"
11150-127 = "……."
11150-128 = "……."
11150-129 = "(말을 해줘야 할 거 같은데. 언제 하지…….)"
11150-130 = "(재미 있으니까 좀 더 놔두자.)"
11150-133 = "저, 저기……."
11150-134 = "이 가방은 어떡할까요? 저 사람들이 두고 간 거 같은데……."
11150-135 = "엉? 이건 설마…… 수영복 복면단이 나한테 남기고 간 선물인가……?"
11150-136 = "아니, 그건 아닌 것 같지만……. 그냥 유실물 아냐?"
11150-137 = "묵직한데? 뭐 들었나 봐봐."
11150-138 = "(딸칵)"
11150-139 = "……!!"
11150-140 = "헤에에!?"
11150-141 = "!! 이, 이건……!!"
11150-143 = "……아, 맞다. 현금 가방…… 두고 왔네요."
11150-144 = "뭐어?!"
11150-145 = "으헤~ 어차피 버릴 거였잖아. 신경쓰지 마, 신경 쓰지 마."
11150-146 = "그래. 필요한 사람이 주워 가겠지."
11150-147 = "그러게요☆ 돈이 없어서 곤란에 처한 분이 가져갔으면 좋겠네요."
11150-148 = "아하하…… 좋은 일 한거라고 생각하세요. #n어딘가에서 식사도 못하는 분들이 그걸로 배부른 한끼를 드신다고 생각하면……."
11150-149 = "으으…… 아까워, 아무리 생각해도 아깝다고!! 이 답답이들, 진짜!"
11150-151 = "에에에에에-?!"
11150-152 = "우와아아아-?!"
11150-153 = "이 무슨……."
11150-156 = "……?"
11150-157 = "……이제 우리 안 굶어도 되나요?"
11150-159 = "(흥신소 사무실)"
11150-160 = "뭐어어어어어어---?!?!"
11150-161 = "수영복 복면단이 아비도스였다고?!!"
11150-162 = "아하하하- 아루 쨩, 산타 잃은 표정이야, 완전 웃겨."
11150-163 = "하아……."
11150-164 = "(결국 알려주었다.)"
11150-166 = "다음화;밝혀지는 진실"
