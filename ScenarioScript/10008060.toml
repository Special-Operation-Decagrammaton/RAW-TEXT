[translation]
10008060-1 = "제6화;되찾아야 하는 이유"
10008060-3 = "[ns] \"어쨌거나 상황을 정리해볼까?\""
10008060-4 = "음, 새전함은 검은거북파라고 부르는 범죄조직의 대규모 사기극이었고……."
10008060-5 = "카, 카이텐져는 정의를 위해, 그, 그걸 훔쳤다고 했어요."
10008060-6 = "쿠흐흣. 덕분에 다른 문제아는 물론 선도부까지~! 여기저기 잔뜩 난리 통에 우당탕탕인 거네!"
10008060-7 = "아핫~! 재밌어~!"
10008060-8 = "……어째서 새해 첫날부터 이런 소동에 휘말려야 하는 건지. 나 참."
10008060-14 = "후후후."
10008060-15 = "응! 어찌됐든 잘됐네! 다행이야."
10008060-16 = "……사장?"
10008060-17 = "흐응~ 아루 쨩……? 안심했어?"
10008060-18 = "으, 으응?!"
10008060-19 = "쿠흐흣……. 아루 쨩이 빈 소원이 뒤집힐 일이 없으니까?"
10008060-20 = "?!"
10008060-21 = "……사장, 혹시나 해서 묻는 거지만, 지금까지 우리가 새전함을 쫓았던 건……. 전부 그런 이유로……?"
10008060-25 = "아, 아니야!"
10008060-26 = "어, 어디까지나 시, 신경이 쓰이는 정도로……."
10008060-27 = "새해 첫날을 찝찝하게 시작할 수는 없어서……."
10008060-28 = "아하하하!"
10008060-29 = "그치만 아루 쨩. 엄청 절실하게 소원 빌었었고!"
10008060-30 = "아, 아니……. 그건 그러니까……."
10008060-32 = "하아……. 무츠키……."
10008060-33 = "저, 전 아루 님의 마음도 이해가 되어요! 네!"
10008060-34 = "아하하핫!"
10008060-35 = "후아~ 그치만 이제 아무래도 상관없어졌으니까……. 슬슬 집으로 돌아가도 괜찮은 거 아냐?"
10008060-36 = "아니면 애초에 처음부터 전부 사기였으니까. 그냥 새전함의 내용물을 우리가 빼앗아버린다던가?"
10008060-43 = "뭐, 어느 쪽이든 나도 이견은 없어. 사장이 결정하도록 해."
10008060-44 = "……아니, 그래도 추격은 계속할 거야."
10008060-45 = "으응?"
10008060-46 = "다들 각자가 소원을 빌었잖아?"
10008060-47 = "분명 올해에 이루고 싶은 것이나……. 바라는 게 있었겠지."
10008060-48 = "응. 그게 이루어졌으면 좋겠다고 생각하면서 소원을 빌었을 거야."
10008060-49 = "누구는 취미를 참아가면서."
10008060-51 = "……."
10008060-53 = "또 누군가는 공사장에서 육체노동을 해서 번 소중한 돈으로……!!"
10008060-54 = "아루 님……."
10008060-55 = "(아니, 하루카는 별로 신경 쓰지 않는 것 같지만…….)"
10008060-56 = "(나는 장난감 돈을 넣었는데……?)"
10008060-58 = "결국 폭력배 녀석들의 사기와 이상한 녀석들의 도주극에 놀아나고 있는 건 사실이지만……."
10008060-59 = "그 소원은, 누가 뭐래도 진짜였잖아!"
10008060-60 = "그 모든 걸 없던 걸로 할 수는 없다고!!"
10008060-65 = "……아, 아루 님! 그 정도로 저희를……!"
10008060-66 = "으응~ 뭐라고 할까~"
10008060-67 = "……하아. 가끔씩 저렇게 불쑥 무방비할 때 찔러온다니까."
10008060-72 = "뭐, 너희들의 사장이 하는 말, 제법이잖아?"
10008060-73 = "[s] \"응. 역시 아루야.\""
10008060-74 = "흥! 우리들의 목적은 달라지지 않았어."
10008060-75 = "새전함을 되찾아 행사장에 돌려놓는다. 이 내가 그렇게 결정한 거야."
10008060-76 = "자아, 그렇게 된 이상 또 나의 억지에 어울려주겠어?"
10008060-78 = "……뭐, 어쩔 수 없지."
10008060-79 = "흐응~ 뭐, 그쪽이 더 재밌어 보이기도 하고!"
10008060-80 = "네!"
10008060-82 = "하아. 그래. 알았다고."
10008060-83 = "[s] \"다 같이! 가자!\""
10008060-87 = "……어, 근데 저기……. 카이텐져를 잡으려면 어디로 가야 하지?"
10008060-88 = "아하하핫!!"
10008060-89 = "여기서 그런 걸 질문하면 어떡해. 아루 쨩!"
10008060-90 = "……하아."
10008060-91 = "뭐. 단서라면 있어."
10008060-92 = "카, 카요코! 역시 우리의 믿음직한 흥신소 과장……!"
10008060-93 = "호들갑은……."
10008060-94 = "어쨌거나 선도부가 말했던 검은거북파의 불법 자금 세탁 건. 나아가 새전함의 용도랑 카이텐져의 의도를 종합해보면."
10008060-95 = "아마 지금쯤 녀석들은……."
10008060-97 = "블랙마켓 뒷골목"
10008060-100 = "후우후우……."
10008060-101 = "이쯤 왔으면 적당히 우릴 쫓는 녀석들도 떨쳐 냈으리라 생각……."
10008060-108 = "거기! 멈춰어어!!"
10008060-109 = "아닛?!"
10008060-110 = "어떻게 우리의 위치를 알아낸 거지?! 도주는 완벽했을 텐데?!"
10008060-112 = "와-오! 진짜 여기 있었네! 카요코 쨩. 굉장해!"
10008060-113 = "간단한 답 맞히기야. 합법적이지 못한 물건을 탈취했고, 처음부터 카이텐져가 그걸 알고 있으리라고 가정한다면."
10008060-114 = "내용물을 처분하기 위해 합법적이지 않은 루트. 즉 블랙마켓을 통해야만 할 테니까."
10008060-115 = "뭐, 이 정도는 선도부도 금방 깨닫게 될 테지만."
10008060-117 = "카요코! 선도부보다 선수를 쳤다는 것만으로도 높은 점수를 주겠어!"
10008060-121 = "자아! 이 녀석들! 새전함을 돌려받겠어! 얌전히 내놔!"
10008060-122 = "하하! 무슨 소리를 하는가 했더니! 아니 될 소리로군!"
10008060-123 = "뭐어?!"
10008060-124 = "빼앗은 시점에서 이 새전함은 이미 우리의 것! 우리 카이텐져의 자금이다! 돌려줄 리가 없지!"
10008060-125 = "[s] \"아무리 봐도 히어로가 할 대사는 아니지 않아?\""
10008060-126 = "그럴 리가-! 우리가 곧 정의! 정의가 곧 우리다!"
10008060-127 = "이렇게 된 거 붙잡히기 전에 모두 총공세다! 모든 건 우리의 원대한 꿈을 위해……!"
10008060-133 = "어째 새전함을 노리는 애들은 다 똑같은 말을 하네~ 새전함 효과인 걸까~?"
10008060-134 = "하아……."
10008060-136 = "말이 통하지 않는다면, 이쪽도 실력행사로 나갈 수밖에 없지……!"
10008060-137 = "간닷!"
