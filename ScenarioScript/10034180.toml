[translation]
10034180-1 = "2일 전: 난입"
10034180-10 = "쿄야마 카즈사아-!!"
10034180-11 = "카즈사, 네 친구 왔다. 상대 좀 해 줘라."
10034180-12 = "어허, 요시미. '우리' 친구지."
10034180-13 = "아하하. 레이사 쨩. 여기 와서 앉아."
10034180-14 = "……? 음? 그런데 이 녀석 어디 갔어? 안 보이는데?"
10034180-15 = "응? 어라. 방금 전까지만 해도 있었는데……."
10034180-16 = "……에, 없습니까? 쿄야마 카즈사?"
10034180-20 = "어, 어으……. 음……. 그……."
10034180-21 = "죄송합니다……."
10034180-23 = "그게 무슨 말이야. 죄송할 일 같은 게 아니잖아? 일단 여기 와서 앉아."
10034180-24 = "그래, 뭐 보나마나 먹을거리 좀 사러 갔거나 그런 거겠지. 기다리면 되고."
10034180-26 = "그, 그런가요? 말씀은 감사하지만……. 그, 그래도 저는 방과후 디저트부도 아니고……."
10034180-27 = "하지만 방과후 디저트'단'이지. 그렇다. 마치 어딘가의 비밀 결사와도 같은……."
10034180-28 = "뒤쪽은 사족이니까 못 들은 걸로 해줘."
10034180-29 = "아무튼, 뭐. 신경 쓸 필요 없다는 말은 맞아. 사람 나고 동아리 났지, 동아리 나고 사람 났겠어."
10034180-31 = "……!!"
10034180-32 = "응! 혹시나 해서 하는 이야기지만, 카즈사 쨩 없을 때라도 언제든 와도 좋으니까!"
10034180-33 = "자경단 일이 중요해도, 가끔 쉬어 갈 곳이 있으면 좋잖아?"
10034180-37 = "…………."
10034180-38 = "……네!!"
10034180-43 = "나 왔어-. 앞에서 아이스크림 사 왔……."
10034180-47 = "……너도 왔냐."
10034180-49 = "……하, 뭔가 싸해서 하나 더 샀는데, 정답이었네."
