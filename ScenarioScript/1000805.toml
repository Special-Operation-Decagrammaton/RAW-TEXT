[translation]
1000805-1 = "네루의 병문안"
1000805-2 = "샬레, 선생님의 방."
1000805-3 = "(감기에 걸려서 꼼짝할 수 없다.)"
1000805-4 = "(아무래도 당번 학생이나 병원에 연락해야겠다고…… 생각할 때)"
1000805-5 = "(띵~ 동)"
1000805-6 = "……?"
1000805-7 = "[s1] \"누구세요?\"\n[s2] 무시한다."
1000805-8 = "(콰앙-!)"
1000805-9 = "(콰앙-!)"
1000805-10 = "……?!"
1000805-11 = "(문이 폭발했다.)"
1000805-15 = "헤에. 여기에 있었나."
1000805-17 = "여어. 선생."
1000805-18 = "아프다며? 소식 듣고 왔다구!"
1000805-20 = "[ns3] \"대체 어떻게 알고 온 거야?\"\n[ns4] \"학교는 어쩌고 온 거야? 출결이 위험하다며?\""
1000805-21 = "아아. 그런 사소한 건 신경 쓰지 마."
1000805-22 = "아아. 그런 사소한 건 신경 쓰지 마."
1000805-23 = "출석이 좀 위험하긴 한데……"
1000805-24 = "선생이 아프다는데, 학교나 갈 순 없잖아."
1000805-25 = "그보다, 자. 약과 식재료야."
1000805-26 = "말했지. 빚은 갚아주겠다고!"
1000805-27 = "오늘이 바로 그날이야!"
1000805-29 = "하하. 선생. 감기 따위에나 걸리다니, 기합이 부족하네."
1000805-30 = "……뭐? 얼마전에 나도 감기 걸리지 않았냐고?"
1000805-31 = "글쎄, 기억나지 않는걸?"
1000805-32 = "뭐 어쨌든, 안심해."
1000805-33 = "부족한 기합은 내가 팍팍 채워줄 테니까!"
1000805-34 = "[s5] \"불안한데.\"\n[s6] \"부탁이야. 제발 병원에 가게 해줘.\""
1000805-35 = "아앙? 불안해 하지 마. 날 믿어."
1000805-36 = "아앙? 불안해 하지 마. 날 믿어."
1000805-37 = "나는 메이드부 부장이야. 그 말이 의미하는 바가 뭐겠어?"
1000805-38 = "메이드로서 내 능력은, 밀레니엄 최강이라고."
1000805-39 = "간병 또한 메이드의 소양 중 하나지."
1000805-40 = "걱정하지 마. 간병은 익숙…… 한건 아니고 머릿속에서 이미지 훈련으로 한번 해봤으니까."
1000805-41 = "[s7] \"이미지 훈련……?\"\n[s8] \"……한번?\""
1000805-42 = "자, 일단 그러면 죽을 만들어 볼까."
1000805-43 = "자, 일단 그러면 죽을 만들어 볼까."
1000805-44 = "[s] 불안하다……."
1000805-46 = "(30분 후)"
1000805-47 = "자아! 완성!"
1000805-48 = "오래 기다렸지?"
1000805-49 = "미카모 네루 특제 '기합충전죽'이다!"
1000805-50 = "이거만 있으면 감기 따위는 끝장이야!"
1000805-51 = "[s] \"붉은 기름이 끓고 있는데?\""
1000805-52 = "크하하! 특제 고추 기름을 잔뜩 넣었다고!"
1000805-53 = "걱정 하지 마. 다른 건 몰라도 칼로리는 보장할게."
1000805-54 = "[s] \"맛이랑 건강 부분도 보장해 줘……\""
1000805-55 = "아앙?! 불평하지 마! 반찬 투정은 어린애나 하는 거라고! #n선생은 어른이잖아!"
1000805-56 = "똑같은 걸 먹은 우리 부원도 한 숟가락 먹더니 기뻐서 엄청난 춤을 출 정도였으니까."
1000805-57 = "[s9] 먹는다.\n[s10] 먹는다!\n[s11] 먹는…… 다……?"
1000805-58 = "(다른 선택지는 존재하지 않았다.)"
1000805-59 = "(다른 선택지는 존재하지 않았다.)"
1000805-60 = "(다른 선택지는 존재하지 않았다.)"
1000805-61 = "(꿀꺽)"
1000805-62 = "……?"
1000805-63 = "[s12] \"맛있어!?\"\n[s13] 춤을 춘다."
1000805-64 = "하하! 어때! 그렇지?! 맛있지?!"
1000805-65 = "하하! 어때! 그렇지?! 맛있지?!"
1000805-66 = "괜히 내가 메이드부의 부장이 아니라고."
1000805-68 = "매운 죽을 먹으며 땀을 잔뜩 흘렸더니 감기는 금세 나았다."
