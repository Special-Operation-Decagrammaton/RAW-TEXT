[translation]
90001170-1 = "제17화;재회"
90001170-3 = "……그렇게 해서, 우리는 너를 다시 깨우게 된 거야."
90001170-4 = "그렇습니다. 특히 리오 님의 공이 컸습니다. 그것만큼은 케이도 인정해야 할 겁니다."
90001170-5 = "그리고 물론 두 번째로 열심히 한 건 리오 님의 말을 따른 저이고요."
90001170-10 = "……토키? 당신이 여기에서 그렇게 말해 버리면, 모두의 입장이 어떻게 될지 조금 걱정이 되는데요……."
90001170-11 = "통계적으로 수치에 입각해서 분석하자면, 내가 이번에 많은 일을 한 것은 사실인 것 같은데? 로그를 다시 분석해 볼까?"
90001170-17 = "……어쩐지 당신은 제가 눈을 감았을 때와 크게 달라지지 않은 것 같은데요……."
90001170-18 = "[s1] \"어…… 안녕, 케이 쨩?\"\n[s2] \"우리 그때 이후 만나는 건, 처음이지?\""
90001170-21 = "케이 쨩 아니거든요?!"
90001170-22 = "그러고보니, 여긴 어디죠? 제가 키보토스의 환경에 대해 모두 이해하고 있는 것은 아닙니다만……."
90001170-23 = "이곳은 뭔가 근본적으로 낯설다는 느낌이 드는데요?"
90001170-24 = "좋은 질문이네. 여기는 빙해야."
90001170-25 = "빙해라고요? 제가 알고 있는 그 빙해? 그런데 제가 왜 이런 곳에……?"
90001170-26 = "그 부분에 대한 것은 천천히 이야기해 드리도록 하죠."
90001170-27 = "우선은 서로 자기소개부터 할까요? 저와 리오에 대해서는 이미 잘 알고 있으리라고 생각해요. 케이."
90001170-28 = "네, 네에……."
90001170-29 = "안녕하세요. 케이. 저는 아스마 토키입니다."
90001170-30 = "한 때 당신과 아리스를 한 번에 납치하기도 했었죠. 피스, 피스."
90001170-31 = "당신은 또 그걸 지금 자기소개라고 하는 건가요."
90001170-32 = "나는 이즈미모토 에이미. 잘 부탁해."
90001170-33 = "……안녕하세요. 음, 그, 저기. 그러니까…… 처음 뵙겠습니다. 케이, 입니다."
90001170-34 = "사실은 잘못 읽어버린 이름입니다만……."
90001170-35 = "하아. 왕녀께서는 그편이 마음에 든다고 하셨으니……."
90001170-38 = "저의 데이터를 일부나마 보관해 준 것에 대해서는 감사를 표하겠습니다."
90001170-39 = "하필이면 그걸 열쇠 인형에 이식해서, 조금 이리저리 흔들렸던 것 같기도 하지만요."
90001170-40 = "윽……! 기억이……! 뭔가, 대걸레 같은 곳에 매달려서 마구 다루어졌던 것 같은 느낌이 드는 듯, 아닌 듯……?!"
90001170-41 = "[s] \"어…… 그러니까 그건, 다른 대안이 없었어서……?\""
90001170-42 = "그걸 지금 말이라고 하시는 건가요……."
90001170-43 = "음…… 이렇게 이야기하는 것도 이상하게 들릴 수 있겠지만, 저는 당신들에 대해서는 어느 정도 알고 있습니다."
90001170-44 = "왕녀를 통해 당신들에 대한 정보를 공유하고 있었으니까요. 하지만 그 반대로는……."
90001170-45 = "지금부터 알아 가면 되는 거겠죠. 그렇지 않나요, 케이? 앞으로 잘 부탁해요."
90001170-46 = "……일단은, 알겠습니다."
90001170-47 = "그러고 보니, 왕녀께서는 어디에서 뭘 하고 있습니까?"
90001170-48 = "[s3] \"그래! 그거 말인데!\"\n[s4] \"케이 쨩에게 소개해 주고 싶은 아이들이 있어!\""
90001170-51 = "그러니까 케이 쨩이……!"
90001170-55 = "……아뇨. 됐습니다. 분명 그런 부탁을 들어주는 사람이 아니었죠, [USERNAME] 선생님은."
90001170-56 = "그렇다고 그렇게 '잘 이해하고 있구나' 라는 기분 나쁜 웃음도 짓지 마시고요........"
90001170-57 = "그래서, 제게 소개해 주고 싶은 분들은 누구인가요?"
90001170-59 = "[ns] \"그건 바로……\""
90001170-65 = "어라? 모모톡? 그것도 선생님이네?"
90001170-69 = "……."
90001170-70 = "다들! 이제 슬슬 들어가자!"
90001170-71 = "어? 벌써?"
90001170-72 = "그렇습니다, 모모이! 아리스는 더 놀고 싶습니다!"
90001170-73 = "나, 나는 이제 지쳤어……."
90001170-74 = "자, 자. 유즈도 지쳤다고 하잖아. 선생님이 코코아 만들어 주신대!"
90001170-75 = "선생님의 코코아……? 그것은 정말로 레어 회복 아이템이군요! 놓칠 수 없습니다!"
90001170-76 = "그렇지? 빨리 가자!"
90001170-80 = "어, 어어? 치사해, 언니! 같이 가! 자, 유즈 쨩도 어서!"
90001170-81 = "코코아…… 확실히 좋겠네. 응."
90001170-87 = "선생님! 우리 왔어!"
90001170-88 = "네! 더 놀고 싶었지만 회복도 중요하니까요!"
90001170-89 = "[s] \"어서 와, 어서 와. 자. 여기 코코아 네 잔.\""
90001170-90 = "감사합니다. 선생님. 와아, 따듯하네요."
90001170-91 = "저, 선생님은…… 안 드시나요? 아…… 이미 커피를 드셨다고요? 네, 네에……."
90001170-96 = "하아~ 좋다. 몸이 녹아내리는 기분이야."
90001170-102 = "그러면…… 자. 아리스 먼저 안으로 들어갈래?"
90001170-103 = "베이스 안쪽으로 말인가요? 그렇지만 왜 굳이 아리스가 먼저……?"
90001170-104 = "그건 말이지……. 누구보다 아리스가 먼저 만나야 할 사람이 있을 거거든."
90001170-106 = "아리스 쨩이 먼저 만나야 할 사람……?"
90001170-107 = "설마……!"
90001170-108 = "……."
90001170-110 = "그렇지만 아리스를 콕 집어서 말할 필요가……?"
90001170-111 = "……!"
90001170-112 = "서, 설마. 설마……!"
90001170-113 = "[s] \"자, 어서 가자. 아리스.\""
90001170-114 = "……네. 알겠습니다. 선생님. 그렇지만 선생님도 같이 가 주셨으면 합니다. 괜찮으실까요?"
90001170-115 = "감사합니다. 선생님. 그리고 하나만 더……."
90001170-120 = "아리스의 손을, 꼭 잡아 주세요."
90001170-121 = "아리스는 지금, 온몸이 너무 떨려서…… 똑바로 서 있기 힘들 것 같습니다."
90001170-124 = "감사합니다. 선생님. 정말로…… 감사합니다."
90001170-138 = "……!"
90001170-139 = "……!"
90001170-140 = "………."
90001170-141 = "…………."
90001170-142 = "케이……. 케이, 맞지요?"
90001170-143 = "와, 왕녀여……."
90001170-144 = "정말로……. 정말로, 케이로군요……."
90001170-145 = "왕녀여, 저는……."
90001170-149 = "케이!"
90001170-150 = "사라지는 건, 자신이어야 한다는 말, 다시는 하지 말아 주세요."
90001170-151 = "그게 맞다는 말도, 그렇게 되어야 한다는 말도, 다시는 하지 말아 주세요."
90001170-152 = "그건……."
90001170-153 = "부탁입니다. 케이. 아리스는 지금 아리스가 얼마나 기쁜지…… 제대로 설명할 수 없을 지경이에요."
90001170-154 = "케이와 이렇게 다시 볼 수 있어서 좋아요."
90001170-155 = "케이가, 다시, 아리스의 눈앞에 있다는 사실이, 믿기지 않을 정도예요."
90001170-156 = "고맙습니다. 케이. 정말로 고맙습니다."
90001170-157 = "이렇게 돌아와 줘서, 진심으로…… 고마워요."
90001170-158 = "그러니까 다시는, 다시는……."
90001170-159 = "흑……. 흐윽……."
90001170-160 = "네…… 알겠습니다. 왕녀여."
90001170-161 = "이제, 다 괜찮을 겁니다."
90001170-163 = "감사합니다. 히마리 선배. 리오 선배. 에이미와 토키와 선생님도. 정말로 감사합니다."
90001170-164 = "아리스는 용사 실격이었는데, 이렇게…… 케이를 다시 볼 수 있게 해 주셔서…… 어떻게 은혜를 갚아야 할지 모르겠습니다……."
90001170-166 = "괜찮아요. 아리스. 저는 아리스가 기뻐하는 것으로 이미 보상받은 것 같으니까요."
90001170-167 = "그래. 지금의 케이는 내 이론이 맞았다는 증거이니까, 그걸로 충분하지."
90001170-168 = "리오. 제발……."
90001170-169 = "내가 무언가를 또 잘못 말한 거야?"
90001170-170 = "……아뇨. 케이를 되살린 건 확실히 당신이 맞으니까…… 그렇지만……. 하아……."
90001170-175 = "충분히 감동적이고 좋은 분위기에, 모모이 난입!"
90001170-176 = "아. 당신은."
90001170-177 = "어, 언니?!"
90001170-178 = "죄, 죄송해요, 여러분. 말리려고 했는데……."
90001170-180 = "너! 그때 잘도 날 때려눕혔지?! 너는 잊어버렸다고 주장할지 모르겠지만, 나는 확실하게 기억하고 있다고!"
90001170-182 = "……공교롭게도 저 역시 잘 기억하고 있습니다. 물론 여기에서는 도의적으로 사과를 해야 하는 부분이겠지만……."
90001170-183 = "……어째서인지 당신에게는 조금, 사과하고 싶지 않아지는군요. 사이바 모모이."
90001170-184 = "[s] \"케이 쨩?!\""
90001170-185 = "케, 케이?!?!"
90001170-186 = "호오. 기세만큼은 마음에 드는군. 옛 숙적이여. 그 이유는 무엇인가?"
90001170-188 = "왜냐하면 당신이 왕녀에게 나쁜 물을 잔뜩 들여놨기 때문입니다!"
90001170-189 = "[s] \"아.\""
90001170-190 = "앗……."
90001170-191 = "잘도 왕녀에게 밤샘 게임을 시키고 먼저 잠들어 버리지를 않나!"
90001170-192 = "그, 그거야 우리는 게임개발부니까……!"
90001170-193 = "밤 늦게 콜라를 먹이고, 양치질도 안 시키지를 않나!"
90001170-194 = "하, 하지만 제로콜라였는데……. 아마도."
90001170-195 = "식생활은 또 그게 뭔가요?! 왕녀의 건강을 위해서는 충분한 섬유질과 식물성 영양소를 섭취하게 해 드려야 할 것 아닌가요!"
90001170-196 = "우으으……. 틀린 말은 아니지만, 사실 나도 야채는 별로 안 좋아하는걸……."
90001170-197 = "꼭 왕녀에게만 한정된 것이 아닙니다! 당신들 스스로를 위해서도 생활 습관은 중요한 거라고요!"
90001170-198 = "제발, 좀! 다들 알아서 자기 몸을 돌보란 말입니다! 내가 진짜……! 하아, 하아……!"
90001170-199 = "지금의 네 상태, 호흡 같은 건 필요 없지 않아? 정 그런 게 필요하다면, 냉각 장치의 출력을 올려 줄까?"
90001170-204 = "좀! 관용적인 표현이잖습니까! 데이터 플로우인 저보다 상황 이해도가 떨어져서 어쩌겠다는 건가요, 리오!"
90001170-205 = "케, 케이?!"
90001170-206 = "끄앙! 죄송합니다, 리오 선배! 아리스가 모두 잘못한 겁니다! 케이는 아무것도 잘못하지 않았습니다! 그러니까 용서해 주세요!"
90001170-208 = "윽, 왕녀여. 그러니까 이건……."
90001170-209 = "괜찮아, 아리스. 나는 잘 모르겠지만, 케이의 사고 회로에 분노 노이즈가 다량으로 발생한 모양이야."
90001170-211 = "……어떤 의미로는 회장이 이런 성격이어서 다행이네……."
90001170-213 = "그래서, 무슨 일로 저를…… 아뇨, 왕녀와 친구분들을 이런 자리까지 부른 건가요?"
90001170-214 = "그렇구나. 곧바로 본제로 들어가자는 거네. 합리적이어서 마음에 들어."
90001170-218 = "케이. 우리는 너와 아리스가 다시 다차원 배리어를 파괴해 주었으면 해."
90001170-219 = "리오? 리오? 잠시만요. 적어도 앞뒤 사정 설명을 거친 다음에……!"
90001170-220 = "잠깐만요. 지금 그냥 흘려들을 수 없는 단어가 나왔던 것 같은데요."
90001170-221 = "다차원 배리어라고요……? 설마 우리 모두가 알고 있는 그게 맞나요?"
90001170-222 = "[s5] \"자아……. 지금부터 조금 긴 이야기를 해 줄게.\"\n[s6] \"아리스도 다른 모두도, 다시 정리하는 느낌으로 들어 줘.\""
90001170-225 = "알겠습니다. 선생님. 그러면 저는 잠시 자고 있을 테니 이야기가 끝나면 불러 주십시오."
90001170-226 = "토키. 여기에서는 그러면 안 될 거라고 생각하는데……."
90001170-227 = "괜찮습니다. 저와 선생님 사이인걸요. 아무 문제없습니다."
90001170-228 = "저와 선생님 사이…… 요? 저기, 토키 씨?! 그건 도대체 무슨 뜻이시죠?!?!"
90001170-230 = "(또다시 왁자지껄해진 분위기를 어떻게든 다독여 가며…….)"
90001170-231 = "(차근차근, 지금까지 있었던 일들을 케이에게 설명해 주었다.)"
90001170-236 = "그러니까, 결국, 결론은……."
90001170-237 = "그래. 조금 전 했던 이야기의 반복이 되겠지만, 우리는 너와 아리스가 그 다차원 배리어를 파괴해 주기를 바라."
90001170-238 = "그 배리어가 다시 모습을 드러냈다는 것만으로, 키보토스는–"
90001170-239 = "일언지하에, 거절합니다."
90001170-240 = "?!"
90001170-241 = "!?"
90001170-242 = "……."
90001170-250 = "이 맛은, 무언가 이야기하지 않은 것이 있다고 주장하는 맛이로군요."
90001170-251 = "그건 또 대체 무슨 맛인데요……. 그렇다고 할까, 당신이 지금 제 어딘가를 맛보는 것 자체가 불가능하지 않나요……?"
90001170-252 = "이것 역시 C&C 부실에 비치되어 있었던 교양 자료로부터 얻은 표현이기에."
90001170-253 = "……역시나, 불필요한 질문이었군요."
90001170-254 = "그렇지만, 뭐. 당신의 말처럼 이 이야기에는 가장 중요한 정보가 누락되어 있습니다."
90001170-255 = "결론부터 말씀드리자면, 다차원 배리어의 파괴는 왕녀의 목숨을 담보로 한 도박수에 가깝기 때문입니다."
90001170-256 = "그때에는 어떻게 된 것이냐고 묻고 싶으시겠지만, 그저 운이 좋았을 뿐이라고밖에는 대답드릴 수 없을 것 같네요."
90001170-257 = "……그나마 저 혼자 정도로 마무리 되었어서 다행이었지만요."
90001170-259 = "어?!"
90001170-260 = "뭐라고요!?"
90001170-261 = "아, 아리스 쨩과 케이 쨩이……?!"
90001170-263 = "이제는 당신까지 케이 쨩이라고 부르는 겁니까……."
90001170-264 = "……정확한 사정을 설명해 줄 수 있을까?"
90001170-265 = "네. 그래야겠네요. 언젠가 한 번은 설명해야 할 이야기였고, 모두가 모여 있는 지금이 가장 좋은 시기겠죠."
90001170-267 = "(케이는 차분히 그날, 우트나피쉬팀의 배에서 자신과 아리스에게 일어났던 일에 대해 이야기했다.)"
90001170-268 = "(그리고, 모두는…….)"
90001170-270 = "우와아아앙~ 아리스, 미안해! 우린 그런 줄도 모르고……!"
90001170-271 = "아리스 쨩……. 케이 쨩……!"
90001170-272 = "흑…… 흐윽……."
90001170-274 = "이건……. 확실히, 우리가 반성할 일이었네요. 죄송해요, 케이. 진작 그런 줄 알았더라면……."
90001170-275 = "……아뇨, 괜찮습니다. 당신들은 알 방법이 없었을 테니까요."
90001170-277 = "그런 의미에서, 하아. 왕녀여……."
90001170-278 = "네, 네?!"
90001170-279 = "어째서 그 모든 조건들을 흔쾌히 받아들이신 겁니까? 지금의 당신이라면……"
90001170-280 = "다차원 배리어를 파괴한다는 것이, 당신과 저에게 무엇을 의미하는 것인지, 충분히 이해하고 계셨을 텐데요."
90001170-281 = "……그렇네요. 그 부분은 미안합니다. 케이."
90001170-282 = "확실히, 아리스는 알고 있습니다. 하지만 이 사실을 다른 분들께 이야기하지 않은 것은, 이 이상 걱정을 끼쳐 드리고 싶지 않아서였습니다."
90001170-283 = "하지만 그 과정에서 당신이 잘못되기라도 한다면–"
90001170-284 = "그건 걱정하지 않아도 괜찮습니다, 케이."
90001170-289 = "우정과 용기만 있다면 이겨낼 수 있으니까요!"
90001170-290 = "리오 선배도, 히마리 선배도, 에이미와 토키, 게임개발부의 모두……"
90001170-291 = "그리고 무엇보다 선생님께서 함께해 주시니까요!"
90001170-292 = "아니, 왕녀여. 그러니까 그건……."
90001170-293 = "……아뇨. 아닙니다. 왕녀께서는 그렇게 생각하실 수 있습니다. 왕녀는 잘못이 없습니다. 단지……."
90001170-294 = "선생님께서 잘못하신 겁니다!"
90001170-295 = "[s] \"잠깐! 나는 억울하다! 도대체 어째서?!\""
90001170-296 = "왕녀에게 허황된 희망을 심어주셨으니까요!"
90001170-297 = "[s] \"설마 여기에서 희망은 질 나쁜 병이라는 말을 하려는 건 아니겠지?!\""
90001170-301 = "왕녀께 해를 끼치는 건 모두 나쁜 겁니다!"
90001170-302 = "케이?! 진정해 주세요, 케이! 저를 봐서라도 제발!"
90001170-304 = "아리스와 케이에게 다차원 배리어의 파괴를 부탁하는 것은 무리라는 걸 알았어요."
90001170-305 = "그렇지만 문제는 여전히 남아 있는 상황이군요."
90001170-306 = "그래…… 그렇다면 무엇을 해야 하는가, 라는 문제 말이지."
90001170-308 = "그거 말인데요. 그 다차원 배리어와 예언자들이라는 거 말인데, 정확히 뭐가 문제인가요?"
90001170-310 = "네? 그거야……."
90001170-314 = "……어라?"
90001170-315 = "……!"
90001170-317 = "네. 뭐. 다들 슬슬 눈치채신 것 같은데, 지금 예언자들이 하고 있는 것은."
90001170-318 = "결국 구석에 틀어박혀서, 다차원 배리어로 자기들을 감싼 채 암약하고 있는 것 아닌가요?"
90001170-319 = "어…… 껍질 속에 숨은, 겁먹은 달팽이나 거북이처럼?"
90001170-320 = "좋은 비유였네요. 모모이. 물론 그 껍질 속에서 무엇을 하고 있는지는 확실히 신경 쓰이는 요소이지만."
90001170-321 = "그렇다고 하더라도 지금은, 현상을 유지하며 추적, 관찰하는 것으로 충분하지 않은가 해서요."
90001170-322 = "……확실히, 그게 효율적이겠네. 어쩌다 이런 간단한 부분을 놓친 걸까……."
90001170-323 = "뭐…… 이해는 갑니다. 다차원 배리어라는 개념이 처음 관측되었던 그때는 분명, 키보토스의 일대 위기였으니까요."
90001170-324 = "그러니 그것이 다시 나타났다는 사실만으로, 여러분이 상당한 위기감을 느끼는 것은 매우 자연스러운 일이라고 할 수 있을 것입니다."
90001170-325 = "인간은 과거의 경험으로 미래를 재단하기 마련이니까요."
90001170-327 = "그렇군요. 좋은 말이라고 생각합니다. 케이. 그런데 그렇다면……."
90001170-328 = "……이제, 뭘 해야 할까요?"
90001170-333 = "……."
90001170-334 = "……."
90001170-336 = "……테일즈 사가 크로니클이라도, 다 같이 하시겠습니까. 여러분?"
90001170-337 = "저는 죽어도 싫습니다, 왕녀여!"
90001170-338 = "케, 케이. 다시 해 보면 조금 다를지도 모릅니다……. 추억이라든가, 좋았던 옛날이라든가……."
90001170-339 = "그건 그럴 수 있는 종류의 물건이 아닙니다! 왕녀께서도 잘 알고 계시지 않습니까!"
90001170-340 = "그, 그건 그렇기는 합니다만……."
90001170-342 = "아무튼, 지금 무엇을 해야 할지 결정하는 건 중요하다고 생각해."
90001170-343 = "그러니까 여기에서는, 케이의 몸을 만들기로 하자."
90001170-348 = "……네?"
90001170-349 = "네……?"
90001170-350 = "아뇨, 잠깐. 잠깐만요! 이야기가 또 왜 그렇게 흘러가는 거죠?!"
90001170-351 = "케이의 지금 상태는, 목 아래가 죽어 버린 식물인간이나 다름없어. 따라서 안 그래도 쌓인 불만이 한층 더 쌓이게 되겠지."
90001170-352 = "아하. 그리고 그것이 케이의 폭력성을 한층 더 부채질해, 결과적으로 대화를 나아가지 못하게 한다…… 당신치고는 합리적인 분석이네요. 리오."
90001170-353 = "[s] \"오. 듣고 보니 확실히.\""
90001170-354 = "빠르게 이해해 줘서 고마워. 히마리, 선생."
90001170-356 = "아뇨. 저기, 잠시만요. 저 내버려두고 멋대로 이야기 진행시키지 말아 주실래요?"
90001170-357 = "거기에 이 화제에, 리오가 참여하고 있다는 것 자체가, 왠지 모르게 엄청난 불길함과 불안함을 가져다주고 있는데요……?"
90001170-359 = "그렇다면 케이의 몸을 누가, 어떻게 만들면 좋을까요?"
90001170-360 = "나에게 맡겨. 마침 AMAS들을 가능한 한 많이 데려오기도 했고, 예비 부품과 소체는 충분할 거야."
90001170-362 = "잠깐만요. 지금 제 말 안 들었죠? 전 분명 리오가 이런 이야기를 하고 있다는 것에서, 참기 힘든 위기의식을 느끼고 있다고 말씀드렸는데요?!"
90001170-364 = "어떤 AMAS부터 어떻게 사용할 생각이야, 회장? 뭐, 이럴 때의 나는 보통 지시를 받는 쪽이 되겠지만."
90001170-365 = "걱정 마십시오. 리오 님의 센스는 언제나 그렇듯이 독보적이니까요."
90001170-367 = "그러니까 잠깐만요?! 독보적이라는 표현이 늘 긍정성을 내포하고 있지는 않아요?!"
90001170-368 = "그렇다고 할까, 다들 그 정도는 판단할 수 있고 인지할 수 있는 지성 아닌가요? 여보세요?"
90001170-373 = "히, 히익……?!"
90001170-375 = "……정말로, 케이의 몸을 만들어 주시는 건가요. 리오 선배?"
90001170-376 = "아리스는, 아리스는…… 케이를 다시 느낄 수 있고, 서로를 만질 수 있게 되는 건가요……?"
90001170-377 = "와, 왕녀여?!?!"
90001170-379 = "그래. 내가 이런 말을 하는 게 어울리는 것인지는 모르겠지만……."
90001170-385 = "나만 믿으렴. 아리스."
90001170-386 = "감사합니다. 리오 선배! 히마리 선배도요!"
90001170-387 = "그래요. 아리스. 우리가 최선을 다해 볼게요."
90001170-388 = "사람 말을 좀 들어요! 지금 제가 도와달라고 말하고 있잖아요!"
90001170-389 = "[s] \"진정해, 케이. 모두 케이를 도와주려 하고 있는 거야.\""
90001170-390 = "거기에서 도움받는 쪽의 의사는 완전 무시인가요?!"
90001170-391 = "일단 저 합리성을 추구한다면서 자기만의 미적 감각을 내세우는 어떤 분을 좀 말려 주었으면 하는 건데요?!"
90001170-395 = "[ns] \"진정해, 케이. 이미 공정에 들어갔어.\""
90001170-399 = "으아아아아아!"
90001170-403 = "다음화;여명"
