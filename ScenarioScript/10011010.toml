[translation]
10011010-1 = "제1화;교류회의 시작"
10011010-4 = "[ns] \"약속 장소가 아마 이 근처였는데.\""
10011010-5 = "앗! 주군! 발견했습니다! 부장!"
10011010-9 = "여기 있었구나. 선생 공."
10011010-10 = "아, 아, 안녕하세요오……"
10011010-11 = "[s] \"응, 모두 안녕. 준비는 다 했어?\""
10011010-12 = "물론이지! 완벽해!"
10011010-13 = "이즈나도 열심히 준비했어요! 구체적으로는 마음가짐의 단련 같은걸!"
10011010-14 = "네, 네엣…… 저, 저도, 아침에 우황청심환을, 머, 먹고 나와서……."
10011010-15 = "우냐핫, 츠쿠요도 참! 늘 걱정이 많다니까!"
10011010-16 = "[s] \"뭔가 미치루는, 전에 만났을 때보다 더 기운이 넘치는 것 같네.\""
10011010-17 = "응? 그런가? 아니, 뭐 별 건 아니고-"
10011010-18 = "설마하니 교류회를 돕는 조건으로 정식 동아리가 될 수 있는 기회라니."
10011010-19 = "그렇게 생각했더니, 그만 텐션이 올라버려서…… 응! 열심히 해야지!"
10011010-20 = "저, 저도 교류회…… 그것도 백귀야행과 게헨나 학원 간의 교류회라니……."
10011010-21 = "저, 이, 이런 일은 좀처럼 없는 일이라, 두, 두근거려요……."
10011010-22 = "[s] \"그러게, 설마 이런 일이 될 줄이야.\""
10011010-26 = "(일주일 전, 카호와 함께 음양부를 찾았을 때의 이야기다.)"
10011010-30 = "[ns] \"뭔가 으리으리하네.\""
10011010-31 = "바, 방심하지 마. 선생 공! 상대는 누가 뭐라고 해도 으, 음양부의 부장이니까!"
10011010-32 = "저, 저, 저도, 소, 소, 소문으로 들은 적 있어요……! 음양부의 부장은, 마, 말솜씨만으로, 혼을 빼놓는 괴, 괴물이라고……."
10011010-33 = "주군의 안전은! 저 이즈나가 지켜드릴게요!"
10011010-34 = "……정말 다들 무슨 말도 안 되는 오해를 하고 계신 건가요……."
10011010-38 = "어~ 손님?"
10011010-43 = "어머나, 치세 쨩."
10011010-44 = "……어?"
10011010-48 = "[ns] \"……치세?\""
10011010-52 = "멍하니 있다"
10011010-53 = "갑작스러운 만남"
10011010-54 = "깜짝 놀랐어."
10011010-55 = "응, 모두, 안녕이야?"
10011010-56 = "[s] \"아, 안녕. 치세.\""
10011010-57 = "………크, 크으읏……! 이것이, 치, 치세 님의 리, 리얼 하이쿠……!"
10011010-58 = "귀, 귀여워……. 치세 쨩……"
10011010-59 = "[s] \"치세는…… 인기가 많구나.\""
10011010-60 = "크흠흠, 이, 이럴 때가 아니지요."
10011010-61 = "니야 님. 손님이 방문하셨습니다."
10011010-70 = "어머, 어머나-"
10011010-77 = "호오, 호오."
10011010-85 = "흐음 흐음."
10011010-86 = "얼굴은 꽤나 내 취향…… 오히려 스트라이크? 아니, 역으로 아슬아슬하게 아웃이려나?"
10011010-88 = "그래도 재미라면…… 음~ 제법 있는 쪽일지도?"
10011010-89 = "[s] \"저기…….\""
10011010-90 = "니야 님. 너무 그렇게 행동하시면 선생님께 실례가 됩니다만."
10011010-91 = "냐하- 카호는 여전히 딱딱하네~"
10011010-92 = "엣-헴."
10011010-97 = "제 이름은 아마치 니야. 전혀 과분하지 않고, 네에, 뭐, 오히려 이 자리가 내 그릇에는 조금 부족하지 않나~? 싶은 느낌으로."
10011010-98 = "음양부의 부장을 맡은 몸입니다. 만나서 반갑습니다. 샬레의 선생님~♪"
10011010-99 = "[s] \"응. 만나서 반가워.\""
10011010-100 = "냐하하~ 딱딱한 반응~ 재미없어라~"
10011010-101 = "흐응흐응~ 그나저나 당신이 샬레의 선생님이로군요."
10011010-102 = "네, 소문이라면 귀가 따갑게 들어왔답니다~ 총학생회장의 실종 이후. 정말 다양한 곳에서, 다양한 방면으로 활약을 해주고 계시다고."
10011010-103 = "[s] \"일단은 그렇긴 한데…….\""
10011010-104 = "후후. 그럼 마침 딱이로군요."
10011010-105 = "본론에 앞서, 혹시 선생님께서는 저희 음양부가 백귀야행에서 어떤 역할을 맡고 있는지 알고 계시온지?"
10011010-106 = "[s1] \"백귀야행 학원에서 학생회 같은 역할을 맡고 있다고……\"\n[s2] \"백귀야행 학원에서 행정적인 업무를 맡고 있다고…….\""
10011010-109 = "후후~ 뭐어, 틀린 건 아니지만. 그 인식에는 조금 얄팍함이 있사옵군요."
10011010-110 = "저희 백귀야행 연합학원은 수많은 연합으로 이루어진 학교."
10011010-111 = "……즉 백귀야행에는 타 학교에서 학생회라고 부르는, 누군가의 머리 위에 서는 조직은 존재하지 않습니다."
10011010-112 = "[s] \"그럼 음양부는……\""
10011010-113 = "냐하하. 머리 위엔 서지 않는다. 대신 한 걸음 물러나, 백귀야행의 역사와 전통을 지탱하는 역할을 존중받는다~라고 할까요~?"
10011010-119 = "아니면 보다 노골적으로 말하면, 거대 조직에 있어 누군가는 반드시 해야만 하는 얼굴마담을 맡고 있다고나 할까~"
10011010-120 = "[s] \"얼굴마담…….\""
10011010-121 = "덕분에 일종의 아이돌이라고나 할까~ 공연을 한다든가~ 전시를 한다든가~ 음양부 오늘의 운세 방송도 한다든가~"
10011010-122 = "응. 그럴 때마다 치세의 인기가 엄청나지~ 그치~?"
10011010-123 = "그치~?"
10011010-124 = "……그랬나?"
10011010-125 = "니야 님. 본론을."
10011010-126 = "에이~ 카호도 질투하기는, 물론 카호도 숨은 팬이 많다구~?"
10011010-127 = "니, 니야 님……!"
10011010-128 = "냐하하~ 네에네에."
10011010-129 = "하여간 단도직입적으로 말하겠습니다."
10011010-131 = "앞으로 일주일 후. 저희 백귀야행 학원과 게헨나 학원 간에 교류회가 예정되어 있답니다."
10011010-132 = "[s] \"……게헨나 학원이랑 백귀야행 학원이?\""
10011010-134 = "후후, 네에."
10011010-136 = "게헨나 학원의 톱. 만마전 여러분께서 적극적으로 협조해주신 덕에 성사된, 기념비적인 행사이지요."
10011010-138 = "교류회 당일. 게헨나 여러분을 저희 백귀야행의 자랑거리 중 하나인 <백귀야행 소용돌이 영화촌>으로 초대하게 되었는데……."
10011010-139 = "마침 이번엔 특별히 게헨나 여러분을 위해, 백귀야행에서도 멋진 이벤트도 준비 중이거든요~♪"
10011010-140 = "<와라쿠 공주님>이라는, 저희 음양부가 자랑하는-"
10011010-141 = "[s] \"와라쿠 공주님……?\""
10011010-143 = "아니, 선생 공?! 와라쿠 공주님을 모른단 말이야?!"
10011010-144 = "소용돌이 영화촌엔 여러 어트랙션이 있고, 갖은 기획 상영물이 있지만! 그중에서도 최고로 치는 건 역시 <와라쿠 공주님>이라구!"
10011010-145 = "무엇보다 그 공연의 주인공은 백귀야행에서도 둘째가라면 서러워할 아이돌! 치세 님이니까! 치세 님의 사랑스러움이 그야말로……!"
10011010-146 = "……?"
10011010-147 = "미치루 양, 지금은 잠시 조용히……."
10011010-148 = "호오~? 알아봐 주시는 분이 계셨을 줄이야~ 저희 공연을 좋아해 주셔서 감사해요."
10011010-149 = "음, 그러니까~ 이름이…… 미치룽룽 양?"
10011010-150 = "내 이름은 미치루야!"
10011010-154 = "(저, 저질렀다아……!)"
10011010-155 = "(으, 음양부의 부장 앞에서 나도 모르게 소리쳤어……!)"
10011010-157 = "네에, 어쨌거나 이번 교류회의 <와라쿠 공주님>은 특히나 더욱더 야심 차게 준비한 이벤트입니다만……."
10011010-158 = "한 가지, 우려가 되는 것이……."
10011010-159 = "[s] \"우려가 되는 것이라니……?\""
10011010-164 = "네에, 선생님께서도 아시다시피 게헨나 학생분들은 무척이나 자유분방한 분들. 때문에 종잡을 수 없는 그분들과 혹시라도……"
10011010-171 = "네에- 정말정말 만약에- 혹시라도 마찰이 빚어지면서 <와라쿠 공주님>의 공연 중에 원치 않은 사고가 일어나 버린다면……"
10011010-172 = "……후후, 그건 무척이나 재미-가 아니라."
10011010-173 = "흠흠~ 다소 곤란한 일이 될 수도 있겠다 싶어서~"
10011010-175 = "부디 샬레의 선생님께서 공연이 성공할 수 있도록, 도와주셨으면 하는 데에- 어떨까요?"
10011010-176 = "[s] \"좋아, 그런 거라면 협력할게.\""
10011010-177 = "……앗! 서, 선생 공……!"
10011010-178 = "[s] \"대신 한 가지, 내 쪽에서도 제안이 있어.\""
10011010-179 = "……어머나?"
10011010-180 = "[s3] \"이번 공연에서 인법연구부의 도움을 받고자 해.\"\n[s4] \"공연이 성공한다면 인법연구부의 공로를 인정해 줘.\""
10011010-183 = "……인법연구부?"
10011010-184 = "어……? 자, 자, 잠깐! 선생 공, 가, 갑자기 그런 말을 해도……!"
10011010-185 = "선생님. 애당초 그건 정식 절차를……."
10011010-187 = "[ns] \"어때, 내 제안. 받아들일 수 있겠어?\""
10011010-191 = "어머나, 인법연구부라니, 처음 듣네요. 그게 뭔가요?"
10011010-192 = "호오- 닌자를 연구하는 동아리……? 아직 정식 인가를 받지 못한 분들, 이라고요?"
10011010-193 = "어째서-일까요?"
10011010-194 = "인법연구부 여러분께서는 이제껏 <정식 동아리 신청서>를 내주신 적이 없습니다."
10011010-198 = "동아리 신청서에 필요한 서류는 <동아리의 실적 증명 보고서> 1부, 그리고 <활동에 거짓이 없다는 걸 보증해주는 다른 동아리의 보증서> 3부."
10011010-202 = "인법연구부 여러분의 경우. 전자는 평소 운영하는 <소녀인법첩 미치룻치> 채널이나, 지난번 <코미센>에서도 제출한 자작 인법 동인지 등으로 충족이 되고 있습니다만."
10011010-204 = "카호가 그걸 어떻게 알고 있는 거야?!"
10011010-205 = "다만 다른 동아리로부터 받는 보증서가 아직……."
10011010-206 = "그것만 있으면 신청해 주셔도 될 텐데요."
10011010-207 = "[s] \"미치루, 정말이야?\""
10011010-208 = "……그, 그게 어쩌다 보니……. 다른 사람들은 닌자의 고고함을 몰라 본다고나 할까."
10011010-209 = "키, 키보토스에서 닌자라는 문명이 뿌리내리는 건 준비가 필요하다고나 할까……."
10011010-210 = "개, 개인적인 사정으로…… 그게……."
10011010-211 = "………"
10011010-212 = "냐하핫, 뭐, 상관없겠죠. 응. 좋다고 생각해요. 정식 동아리 인정."
10011010-213 = "니야 님?! 절차도 거치지 않고 또 그런 식으로……!"
10011010-214 = "……어? 저, 정말로?"
10011010-215 = "카호도 차암~ 이 정도는 괜찮다구~?"
10011010-216 = "공연이 성공하고 교류회가 무사히 끝나기만 한다면- 그 정도의 배려 정도는……"
10011010-217 = "네, 얼마든지."
10011010-218 = "[s] \"고마워.\""
10011010-219 = "그렇게 되었으니, 이번 공연. 잘 부탁드린다고요? 인법연구부 여러분~♪"
10011010-220 = "부장……!"
10011010-221 = "부, 부장님……!"
10011010-222 = "아, 으응……"
10011010-228 = "물론! 맡겨만 달라고……! 저, 전력을 다해 성공으로 이끌어줄 테니까!"
10011010-229 = "……하아. 정말."
10011010-230 = "~~♪"
10011010-231 = "냐하핫- 정말 기대되네요."
10011010-233 = "뭐, 그렇게 되었으니까. 자, 공연을 돕기 위해 얼른 현장으로 향하자구!"
10011010-238 = "네!"
10011010-239 = "[s] \"응. 갈까.\""
