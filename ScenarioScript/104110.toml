[translation]
104110-1 = "제11화;후일담 1"
104110-2 = "안녕하세요. 선생님."
104110-3 = "[s] \"잘 지내고 있어, 프라나?\""
104110-4 = "……네. 아로나 선배가 잘 챙겨주고 있습니다."
104110-5 = "헤헤…… 딸기 우유에는…… 역시……."
104110-6 = "……아직 자고 있지만요."
104110-7 = "[s] \"으, 으응…….\""
104110-8 = "일어나십시오. 아로나 선배. 선생님이 오셨습니다."
104110-9 = "자고 있을 때가 아니에요."
104110-10 = "우헤……. 음냐……."
104110-11 = "아로나 선배. 안 일어나면 볼을 찌르겠습니다."
104110-17 = "(부스스-)"
104110-18 = "음냐…… 뭐가 자꾸…… 어?"
104110-19 = "어라, 어라라……?"
104110-20 = "어, 어라? 어라라?"
104110-21 = "[s] \"좋은 아침 아로나.\""
104110-22 = "우, 우와아아?! 어, 어느새 아침이……?!"
104110-23 = "아침이 아니라 점심시간입니다. 아로나 선배. 늦잠을 자면 안 됩니다. 기본입니다."
104110-24 = "어, 어라라……. 제가 선배로서 모범이 되는 모습을 보여야 하는데……."
104110-25 = "그전에 일찍 일어나는 것부터 하셔야 합니다. 모범을 보이는 건 그 후에."
104110-26 = "히잉…… 어쩌다가 이렇게……."
104110-27 = "[s] \"……고생이 많겠네, 프라나.\""
104110-28 = "……괜찮습니다. 아로나 선배를 챙기는 것이 슬슬 익숙해지기 시작했으니까요."
104110-29 = "뭔가 제가 혼나는 분위기가 되어버렸어요……."
104110-30 = "그렇지만 괜찮아요. 프라나 쨩과 제가 함께라면, 앞으로 싯딤의 상자는 더 큰 활약을 할 수 있을 테니까요!"
104110-31 = "긍정. 저도 도울 겁니다. 선생님."
104110-32 = "[s] \"……그러네. 앞으로도 잘 부탁해. 프라나, 아로나.\""
104110-34 = "……네. 잘 부탁드립니다. [USERNAME] 선생님."
104110-35 = "헤헤…… 네! 선생님!"
104110-39 = "……음냐. 헤헤헤……."
104110-40 = "아로나 선배가 최근 잠이 많아진 것은……."
104110-41 = "그것은…… 제가 여기에 있기 때문입니다. 저 때문에 싯딤의 상자가 과부하 상태가 되었기 때문에."
104110-42 = "……."
104110-43 = "그리고 이해했습니다. 이곳에도…… 이곳에도 총학생회장은 행방불명된 상태였군요."
104110-49 = "……. 이 세계에도 없는 것이군요. 총학생회장은."
104110-51 = "다음화;후일담 2"
