[translation]
2003505-1 = "좋은 잠, 좋은 꿈."
2003505-5 = "(백귀야행에서의 업무가, 생각보다 늦어졌다…….)"
2003505-6 = "(간신히 해방되었을 때는, 이미 날이 저물고 있었다.)"
2003505-9 = "[ns] \"그러고 보니, 츠바키에게 연락하기로 했는데…….\""
2003505-13 = "여보세요, 선생님?"
2003505-14 = "아……. 지금 끝났구나. 응. 알았어."
2003505-15 = "기다리게 해서 미안하다고? 아니야. 괜찮아. 조금 전까지 자고 있었는걸."
2003505-16 = "그러면 선생님, 조금만 기다려. 내가 마중 나갈게."
2003505-22 = "(그렇게 5분 정도를 기다리자…….)"
2003505-24 = "여기야, 선생님."
2003505-25 = "후후. 선생님과 이 시간에 만나게 되다니, 뭔가 신선하네."
2003505-26 = "[s] \"나도 졸리지 않은 츠바키를 만나는 게, 뭔가 신선해.\""
2003505-27 = "그래? 그러면 오늘은 우리의 신선한 만남이 일어난 날이네."
2003505-28 = "그러면 가자. 선생님."
2003505-29 = "지금의 나는 수행부이자 가이드니까, 선생님을 안전하게 안내해 줄게."
2003505-30 = "[s] \"응. 잘 부탁해.\""
2003505-42 = "[ns] \"뭔가, 생기가 넘치는구나. 지금의 츠바키는.\""
2003505-43 = "응……? 그렇게 보여?"
2003505-44 = "후후. 나는 오히려 지금이 적기? 전성기? 그렇게 말할 수 있는 시간이니까."
2003505-48 = "밤의 백귀야행은…… 어딘가, 신기하지?"
2003505-49 = "그렇게 떠들썩했던 낮 동안의 분위기는 전부 어디론가 사라지고…… 모든 것이 멈춰 버린 것처럼 조용해."
2003505-50 = "이 대조적인 분위기가 낯설다며, 밤에는 좀처럼 밖으로 나오지 않으려는 학생들도 있지만……."
2003505-51 = "나는 좋아해. 이것도 백귀야행인걸."
2003505-52 = "[s] \"그래……. 이것도, 백귀야행……. 확실히 그러네…….\""
2003505-53 = "어라, 선생님? 조금 숨이 가빠 보이네."
2003505-54 = "걸음걸이도 약간 느려졌고, 땀방울도 조금 맺혔어."
2003505-55 = "혹시…… 벌써 지친 거야?"
2003505-56 = "[s] \"면목 없습니다…….\""
2003505-57 = "사과할 일은 아니지만……. 건강은 조심하자?"
2003505-58 = "선생님이 쓰러지기라도 하면, 슬퍼할 학생들이 많은걸."
2003505-59 = "나도 분명, 그중 한 명이고……."
2003505-60 = "[s] \"운동을 할 시간과 여유를 주세요!\""
2003505-61 = "……미안, 선생님. 거기까지는 내가 도와줄 수 있는 부분이 아니네."
2003505-62 = "하지만…… 그래. 여기에서는 조금 쉬었다 가자."
2003505-63 = "관광객의 체력을 안배하는 것도, 좋은 가이드가 해야 할 일일 테니까."
2003505-65 = "(그렇게, 츠바키를 따라 근처의 쉼터로 걸음을 옮겼다…….)"
2003505-74 = "[wa:800]― [log=츠바키 가이드]후우……. [wa:2830]다리가 [wa:1800]조금 아프네.[/log]"
2003505-77 = "― [log=츠바키 가이드]이 신발은 [wa:2000]아직 익숙하지 않아서. [wa:3590]응.[/log]"
2003505-80 = "[wa:800]― [log=츠바키 가이드]왜 그래, [wa:1300]선생님?[/log]"
2003505-81 = "[wa:2110]― [log=츠바키 가이드]그렇게 날 바라보고…….[/log]"
2003505-84 = "[wa:800]― [log=츠바키 가이드]어? [wa:2160]내가 뭔가…… [wa:3050]평소와 [wa:1090]다른 느낌으로 보인다고……?[/log]"
2003505-87 = "[wa:630]― [log=츠바키 가이드]……[wa:2870]이상하네.[/log]"
2003505-90 = "― [log=츠바키 가이드]후훗. [wa:1960]하지만 [wa:1600]선생님이 그렇게 [wa:2880]날 봐준다고 한다면…….[/log]"
2003505-91 = "[wa:3580]― [log=츠바키 가이드]그것도 [wa:1680]나쁘지 않을지도?[/log]"
2003505-94 = "[wa:800]― [log=츠바키 가이드]있잖아, [wa:1370]선생님.[/log]"
2003505-95 = "[wa:2110]― [log=츠바키 가이드]오늘은 우리 둘 다…… [wa:4360]좋은 꿈을 꾸면, [wa:2680]좋겠네.[/log]"
2003505-99 = "[ns1] \"가끔은 말이지, 츠바키가.\"\n[ns2] \"꿈속의 등장인물처럼 느껴질 때가 있어. 좋은 의미에서.\""
2003505-102 = "후후. 그건 어떤 의미일까?"
2003505-103 = "선생님도 잘 모르겠다고? 오늘의 선생님은 재미있는 말을 많이 하네."
2003505-104 = "그렇지만, 좋은 잠을 자야 좋은 꿈을 꿀 수 있는 법이야."
2003505-105 = "그리고…… 좋은 잠을 자고 싶으면, 언제든 나한테 이야기해 줘."
2003505-106 = "선생님이 잠들 때까지, 내가 쭉 곁에 있어 줄 테니까."
2003505-107 = "[ns] \"그래……. 그건 고맙네…….\""
2003505-117 = "선생님?"
2003505-121 = "정말로 피곤했나 보구나. 응."
2003505-125 = "그러면 잘 자, 선생님. 좋은 꿈을 꾸길 바랄게."
2003505-126 = "그리고 가능하다면…… 그 꿈에서는."
2003505-127 = "내가, 나왔으면 좋겠어."
2003505-132 = "[ns3] \"……핫!?\"\n[ns4] \"밖에서 잠을 자 버렸다! 지각, 지각!\""
2003505-135 = "(옆에서 나란히 잠들어 있던 츠바키를 흔들어 깨웠다.)"
2003505-140 = "우웅……. 조금만 더 자게 해 줘……."
2003505-144 = "……어라아? 미모리가 아니라, 선생님……?"
2003505-145 = "……."
2003505-149 = "안녕, 선생님. 좋은 아침이야."
2003505-150 = "[s5] \"……응. 좋은 아침이네, 츠바키.\"\n[s6] \"하지만 우리는 하루의 생활을 준비해야 해!\""
2003505-153 = "……그건, 맞지."
2003505-154 = "그래도 좀 더, 같이 자고 싶었는데……."
2003505-158 = "(묘하게 아쉬워하는 츠바키를 달래며, 샬레로 출근했다.)"
