[translation]
901010600310-8 = "안녕하세요! 항구 정문에서 경비 업무를 담당하던 분들이시죠?"
901010600310-12 = "……"
901010600310-13 = "오늘은 날이 참 무덥네요."
901010600310-14 = "이런 날 밖에서 하루 종일 서 있으면 저라도 지칠 것 같아요."
901010600310-15 = "……귀찮게시리."
901010600310-16 = "혹시 SNS에서 이 로고를 보신 적이 있으신가요?"
901010600310-17 = "잠깐 시간 되시면, 저희 FOX EATS의 신규 이벤트에 대해 간단히—"
901010600310-21 = "시끄러워! 관심 없으니까, 저리 꺼져."
901010600310-22 = "아…… 네. 실례했습니다."
901010600310-23 = "(어쩌지? 이야기를 들어줄 것처럼 보이지 않는데.)"
901010600310-28 = "괜찮아, FOX 2?"
901010600310-29 = "그 불량해 보이는 녀석들이 네게 소리치는 것처럼 보였는데."
901010600310-33 = "괜찮아. 아무래도 내가 너무 가볍게 생각했나 봐."
901010600310-34 = "하지만 곤란하네. 뭔가 대화로 해결될 것 같은 인상은 아니라서."
901010600310-35 = "저 사람들이 실종된 어부에 대해서 알고 있을 것 같은데…… 좋은 방법이 없으려나?"
901010600310-37 = "일단 '카르파초 패밀리'에게 직접 말을 거는 건 다음으로 미루도록 하지."
901010600310-38 = "다만 그들과 매일 마주치는 주변의 상인들이라면 뭔가를 알고 있을지도 몰라."
901010600310-39 = "FOX 2, 남은 시간은 항만 내에서 카르파초 패밀리의 평판에 대해 조사하도록."
901010600310-40 = "이후, 전 소대 HQ로 복귀한다."
901010600310-41 = "확인!"
