[translation]
901010600310-7 = ""
901010600310-8 = "สวัสดีค่ะ! พวกคุณคือผู้รับผิดชอบด้านความปลอดภัยที่ประตูหลักของท่าเรือใช่มั้ยคะ?"
901010600310-9 = ""
901010600310-11 = ""
901010600310-12 = "..."
901010600310-13 = "วันนี้อากาศร้อนมากเลยนะคะ"
901010600310-14 = "อากาศแบบนี้ ถ้าต้องยืนอยู่ข้างนอกทั้งวัน เป็นฉันก็คงเหนื่อยเหมือนกันค่ะ"
901010600310-15 = "มาชวนคุยอะไรน่ารำคาญชะมัด..."
901010600310-16 = "เคยเห็นโลโก้นี้ในโซเชียลมีเดียมั้ยคะ?"
901010600310-17 = "ถ้าพอมีเวลาสักครู่ ฉันขอแนะนำกิจกรรมใหม่ของ FOX EATS แบบสั้น..."
901010600310-18 = ""
901010600310-20 = ""
901010600310-21 = "หนวกหู! ฉันไม่สนใจหรอก ไปให้พ้น"
901010600310-22 = "อ่า... ค่ะ ขอโทษที่มารบกวนค่ะ"
901010600310-23 = "(ทำยังไงดีนะ? ดูท่าจะไม่ยอมคุยด้วยเลย)"
901010600310-24 = ""
901010600310-28 = "เป็นอะไรหรือเปล่า FOX 2? "
901010600310-29 = "เมื่อกี้เหมือนพวกนักเลงพวกนั้นจะตะคอกใส่เธอเลยนะ"
901010600310-30 = ""
901010600310-32 = ""
901010600310-33 = "ไม่เป็นไร ฉันคงประมาทไปหน่อยน่ะ"
901010600310-34 = "แต่ก็ยุ่งแล้วละ ดูแล้วไม่น่าจะเป็นคนที่คุยกันได้เลย"
901010600310-35 = "ดูเหมือนว่าคนพวกนั้นจะรู้อะไรบางอย่างเกี่ยวกับชาวประมงที่หายตัวไป... จะไม่มีวิธีดีๆ บ้างเหรอ?"
901010600310-37 = "ตอนนี้เลื่อนการเข้าไปคุยกับ 'การ์ปัชโช่ แฟมิลี่' ไปก่อน"
901010600310-38 = "แต่ถ้าเป็นพวกพ่อค้าที่ต้องเจอพวกนั้นทุกวัน อาจจะรู้อะไรบางอย่างก็ได้"
901010600310-39 = "FOX 2 เวลาที่เหลือให้สืบเรื่องชื่อเสียงของการ์ปัชโช่ แฟมิลี่ในท่าเรือ "
901010600310-40 = "หลังจากนั้น ขอให้ทุกคนกลับมาที่กองบัญชาการ"
901010600310-41 = "รับทราบ!"
