[translation]
2101-1 = "호명하는 사람들만 남는다 1"
2101-2 = "아비도스 변경 어딘가"
2101-6 = "하아, 하아……"
2101-7 = "더워……! 대체 얼마나 걸은 거야? 제대로 가고 있는 게 맞긴 하지?"
2101-8 = "지도에서 봤을 땐 그럭저럭 갈 만한 거리라고 생각했는데……"
2101-9 = "지도에선 이쪽이 맞는데…… 30km정도 걸었는데도 아직 안보이네요."
2101-10 = "뭐?! 거의 마라톤 거리잖아!!"
2101-11 = "음. 하지만 마음먹고 가기엔 30km는……."
2101-12 = "시로코 선배는 조용히 해 줘……"
2101-13 = "으음……."
2101-14 = "으헤~ 이 아저씨는 허리가 안좋아서 말야. 이런 강행군을 할 나이는 아닌데……."
2101-15 = "아니, 나이 차이도 별로 안 나잖아!!"
2101-16 = "그러니까, 왜 우리가 이런 곳을 헤매고 있는지 생각 안해봤어?"
2101-17 = "당초에 말이야, 다 선배들 때문이잖아! 선배들 때문!"
2101-18 = "으음……."
2101-19 = "으헤~"
2101-20 = "와아-☆"
2101-21 = "딴청 부리지들 말고!!"
2101-22 = "설마 이제 와서 기억 안 난다고는 안 하겠지?"
2101-23 = "정말……! 어제 선배들이 아야네 쨩을 그렇게 만들지만 않았어도……!"
2101-25 = "(……전 날. 대책위원회 동아리실.)"
2101-26 = "……"
2101-27 = "……"
2101-28 = "……"
2101-29 = "……"
2101-30 = "……"
2101-31 = "그러니까 음……."
2101-32 = "<남은 자금 모두 복권 구입, 인생은 한방이야 으헤~ 작전> 제출하신 분?"
2101-33 = "이 아저씨야!"
2101-34 = "……."
2101-35 = "<작전 브리핑. 대량의 학생을 인질을 잡고 강제 전학을 시키는 15가지 방법> 제출하신 분?"
2101-36 = "나다."
2101-37 = "………………."
2101-38 = "으, 으음……. 충분히 실현 가능한 제안인데. 옆마을 학원의 조회 시간을 노려 대강당을 습격하면……."
2101-39 = "으, 으음……."
2101-40 = "<여행 계획표. 와아-! 이번주 주말에 다같이 야외에 피크닉 가요☆> 제출하신 분?"
2101-41 = "네~ 저예요!"
2101-42 = "…………………………………."
2101-43 = "어라……. 이게 아니었던 거려나……."
2101-44 = "이거…… 이 아저씨가 보기에는 조금 위기인 느낌인 걸. 그렇지?"
2101-45 = "다들 뭐하는 거야!"
2101-46 = "앞으로의 위원회 활동 방안을 가져오라니까 복권에, 범죄에, 여행 계획 같은 걸 왜 가져온 거냐고!!"
2101-47 = "진지하게 하란 말이야! 지금 아야네 쨩 이마에 주름이 사라지지 않고 있잖아!!"
2101-48 = "……아아. 괜찮습니다. 쿠로미 세리카 씨. 아직 하나가 더 남았거든요."
2101-49 = "으, 으응? 아야네 쨩……? 갑자기 존댓말을……."
2101-50 = "마지막……. <재생 석유 농장 사업 투자 유치 사업 설명서> 를 가져오신 분?"
2101-51 = "나, 난데……."
2101-52 = "……."
2101-53 = "그, 그치만 아야네 쨩! 누가 봐도 확실한 사업이고…… 설명회에서 받은 팸플릿에도 확실한 수익이……."
2101-54 = "세리카 쨩…… 석유는 땅 밑에서 나는 거야……."
2101-55 = "그, 그건 나도 알아! 그치만 최근에 발견된 폰지 석유라는 건……."
2101-56 = "……."
2101-59 = "적당히들 하라고요-!!!"
2101-66 = "……"
2101-67 = "……뭐."
2101-68 = "……이렇게 되는 거겠지. 그래~"
2101-70 = "이야~ 정말로 무서웠지, 아야네 쨩."
2101-71 = "음……. 시뮬레이션까지 끝마친 작전이었는데……."
2101-72 = "저는 조금 마음의 여유를 찾았으면 해서……."
2101-73 = "뭘 남 이야기처럼 말하는 거야!! 덕분에 우리가 이렇게 된 거잖아!"
2101-74 = "으헤, 그치만 트리거가 된 건 세리카 쨩이라구? 아야네 쨩에게 최후의 방아쇠를 당긴 건 본인이었다구?"
2101-75 = "……?!"
2101-76 = "믿었던 세리카 너마저…… 하는 절망스러운 얼굴이었다구?"
2101-77 = "그, 그건……?!"
2101-78 = "아야네 쨩은 세리카 쨩에겐 무르니까~ 충격이 더 컸던 걸까나~"
2101-79 = "……!!"
2101-81 = "하아…… 하아……."
2101-82 = "모두들……"
2101-83 = "한 번만이라도 좋으니 제대로 된 일을 해주세요……."
2101-85 = "그러곤 마치 몇 년째 놀고 있는 자식에게 하는 대사 같은 걸 해버렸지 뭐야~"
2101-86 = "그리고 다른 마을의 체육관 청소 알바를 구해왔었지."
2101-87 = "내일 있을 학예회를 위해 체육관에 쌓여 있는 쓰레기들을 청소해달라……라는 일이었죠?"
2101-88 = "언제 그런 아르바이트를 구해 놨던 거려나~ 아야네 쨩은 계획적이라니까."
2101-89 = "그치만…… 아야네 쨩 늘 혼자서 무리하는 느낌이라 걱정이 되어서……."
2101-90 = "그러니까, 그래서 아야네가 스트레스로 몸 져 누운 거잖아, 오늘도!!"
2101-91 = "원래라면 다 같이 왔을 테고, 우리가 이렇게 헤매고 있지도 않았을 거라고!"
2101-92 = "괜찮아, 괜찮아~ 오늘 같은 날만이라도 아야네쨩은 집에서 푹 쉬라고 해~"
2101-93 = "오히려 모처럼 아야네 쨩에게 점수를 딸 좋은 기회잖아, 이건?"
2101-94 = "가끔은 우리들끼리 알아서 하는 모습도 보여줘야하니까."
2101-95 = "그래서 다 좋은데 말이야, 멀다고 정말~ 누구라도 좋으니 이 아저씨를 좀 업어줘~"
2101-96 = "우리도 힘들다고! 벌써 몇시간 째 헤매고 있는데……."
2101-97 = "앗! 저기, 저기 보세요!"
2101-98 = "……!"
2101-100 = "불법 개조된 체육관"
2101-101 = "……"
2101-102 = "?"
2101-103 = "……?"
2101-104 = "(뭐, 뭐야, 이거? 이게 체육관……? 이런 체육관이 있었어?)"
2101-105 = "흐음…… 체육관…… 맞아? 누가 봐도……."
2101-106 = "뭐야, 너희들! 뭐 하는 놈들이야!!"
2101-108 = "……!!"
2101-109 = "여긴 뭐 하러 왔어!? 엉? 체육관 주인이냐? 그런 거냐!?"
2101-110 = "여긴 우리가 점령했다고, 험한 꼴 당하기 싫으면 얼른 포기하고 꺼지시지!"
2101-111 = "말해두지만, 우리들은 만만치 않으니까 말이야!! 케헤헤헤헷-!"
2101-112 = "……뭐, 뭐야 저 녀석들? 갑자기 어디서 튀어나온 거야?"
2101-117 = "……."
2101-118 = "아아~ 그런 건가~"
2101-119 = "……과연, 그렇군. 그런 뜻이었나. 이해했어."
2101-120 = "시, 시로코 선배? 지금 뭘 꺼내는 거야!? 그건 고폭탄이잖아!?"
2101-121 = "……아하☆ 저도 이해했어요."
2101-122 = "응?"
2101-124 = "위원회 여러분들에게 성실하고 제대로 된 일을 맡기겠어요."
2101-125 = "체육관에 있는 쓰레기를 청소하는 아르바이트예요. 정직하고 간단하고, 상식적인 일이죠……."
2101-127 = "\"……체육관에 쌓여 있는 쓰레기들을 청소해달라.\" 아야네는 그렇게 얘기했었지."
2101-128 = "……쓰레기?"
2101-129 = "과연~ 제법 하잖아, 아야네 쨩도. 이런 일이라면 신나게 할 수 있겠는걸?"
2101-130 = "……!? 자, 잠깐? 잠깐만, 선배들……?"
2101-131 = "잠ㄲ……!!"
2101-135 = "시간 없으니 빨리 시작하지."
2101-136 = "[ruby=악당]쓰레기[/ruby] 청소."
2101-137 = "응~! 혼날 시간이에요~☆"
2101-139 = "휘익-!"
2101-140 = "콰아아앙-☆"
