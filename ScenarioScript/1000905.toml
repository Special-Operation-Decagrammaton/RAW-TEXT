[translation]
1000905-1 = "나도 모르게 한 입!"
1000905-4 = "(사전에 약속한대로 이즈미와 함께 만나, 라멘 가게로 향하는 도중이었다.)"
1000905-5 = "오늘은~ 어떤~ 메뉴를~ 골라볼까~"
1000905-6 = "딸기잼은 어디~든지~ 잘 어울~려~"
1000905-7 = "돈코츠~ 쇼유~ 버터도 빠질 수 없지~! 흥흥~♪"
1000905-9 = "야옹~"
1000905-11 = "어, 고양이다."
1000905-12 = "야오옹~"
1000905-13 = "와~ 귀엽다~"
1000905-14 = "으응~? 이 아이, 자꾸 뺨을 비비는데? 왜 이런 거지?"
1000905-15 = "[s] \"음, 아마 배가 고픈 모양이야.\""
1000905-16 = "아하, 너도 배가 고픈 거니~? 하지만 나, 지금 가진 게 아무것도 없는데……."
1000905-17 = "[s] \"마침 나한테 좋은 게 있어.\""
1000905-19 = "……고양이 간식 <뉴~루>?"
1000905-20 = "야옹, 야오옹, 야옹!"
1000905-21 = "[s] \"봐봐, 바로 가까이 오지? 자, 고양아. 여기 줄게.\""
1000905-24 = "챱챱챱챱."
1000905-27 = "오, 먹는다. 먹어. 와, 엄청 맛있게 먹네?"
1000905-28 = "냐앙."
1000905-29 = "냐오오옹."
1000905-30 = "다른 고양이들도 몰려들고 있어! 굉장해. 선생님!"
1000905-31 = "[s] \"이 고양이 간식이 아무래도 고양이가 좋아하기로 유명한 모양이야.\""
1000905-32 = "와……."
1000905-33 = "챱챱."
1000905-34 = "챱챱챱"
1000905-35 = "챱챱챱챱!"
1000905-36 = "……(지그-시)"
1000905-37 = "[s] \"응? 이즈미, 왜 그래?"
1000905-38 = "챱챱챱챱!"
1000905-39 = "……츄릅."
1000905-40 = "[s] \"저기, 이즈미? 잠깐. 설마…….\""
1000905-41 = "으웁?!"
1000905-42 = "[s1] \"자, 잠깐. 기다려 이즈미?!\"\n[s2] \"갑자기 고양이 간식을 뺏어 먹다니, 뭐 하는 거야?!\""
1000905-43 = "아, 그, 그러니까. 이건……!"
1000905-44 = "아, 그, 그러니까. 이건……!"
1000905-50 = "― 고, [wa:500]고양이들이 [wa:50]"
1000905-52 = "― 하도 [wa:550]맛있게 [wa:550]먹고 있다 보니, [wa:600]나도 모르게……! [wa:50]"
1000905-55 = "[wa:400]― 후에에엥?! [wa:550]자, [wa:250]잠깐만"
1000905-57 = "― 할퀴지 마아! [wa:100]"
1000905-60 = "― 왜애~!? [wa:700]고양이들이 [wa:600]습격해온다~!"
1000905-63 = "[ns3] \"그야 간식을 빼앗겼으니 화내는 게 당연하지!\"\n[ns4] \"애당초 사람이 먹는 물건도 아니고!\""
1000905-64 = "― 하, [wa:500]하지만! [wa:500]엄청 [wa:250]맛있어 보였는걸!"
1000905-65 = "― 하, [wa:500]하지만! [wa:500]엄청 [wa:250]맛있어 보였는걸!"
1000905-68 = "― 그, [wa:300]그리고! [wa:850]나, [wa:450]미식연구회의 [wa:750]일원이니까!"
1000905-70 = "[wa:50]― 신경 쓰인 건 [wa:750]일단 먹어보지 않으면……!"
1000905-73 = "[ns]  \"그래서 고양이 간식까지 커버하는 거냐…….\""
1000905-74 = "[wa:650]― 더군다나 이거 [wa:1300]<참치맛>, [wa:850]<고급> 이라고 [wa:650]쓰여 있었고……!"
1000905-77 = "― 이런 좋은 걸"
1000905-79 = "[wa:50]― 너희들끼리만 [wa:550]먹다니 [wa:500]용서 못 해!"
1000905-82 = "― 맛있는 건 [wa:1000]같이 나눠 먹어야지!"
1000905-85 = "― 아얏! [wa:850]그, [wa:300]그러니까 [wa:350]미안하다니까!"
1000905-87 = "― 하지만, [wa:900]이미 [wa:300]먹어버린 건 [wa:950]어쩔 수 없지……?"
1000905-90 = "― 후에에! [wa:650]깨물지 마아~!"
1000905-93 = "(그 뒤로도 한동안 이즈미와 함께 길거리 고양이들과 실랑이를 벌였다. 다행히 고양이 간식 3개를 더 바치는 것으로 용서받을 수 있었다.)"
