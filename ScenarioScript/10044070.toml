[translation]
10044070-1 = "제7화;열차는 홀로 달리지 않는다"
10044070-2 = "거기, 열차!"
10044070-3 = "[ns] \"이 목소리는……\""
10044070-7 = "이곳은 게헨나의 자치 구역이야! 계속 소란을 일으킨다면 좌시하지 않겠어!!"
10044070-8 = "[ns] \"이오리!!!\""
10044070-9 = "……?"
10044070-10 = "어? 이게 무슨……"
10044070-11 = "선생님?? 뭐, 뭐야! 왜 여기 있어?!"
10044070-12 = "[s1] \"말하자면 긴데……!\"\n[s2] \"나중에 다 설명할 테니, 이곳을 벗어나게 도와줄 수 있을까?\""
10044070-18 = "아니!! 또 이 조합이냐고! 선생님과 열차!!"
10044070-19 = "분명 뭔가 이상한 일에 얽혔겠지? 오해가 쌓여서 이렇게 됐을 테고??"
10044070-20 = "[s3] \"역시 이오리야! 바로 파악하다니!\"\n[s4] \"도와준다면 발이라도 핥을게!!\""
10044070-23 = "무, 무슨 헛소리야!! 이상한 말 하지 마!!"
10044070-24 = "나중에 설명할 테니 제발 도와달라고?"
10044070-25 = "……"
10044070-26 = "으…… 으으……"
10044070-27 = "하아…… 이런 일에 엮여서 좋을 리가 없는데……!"
10044070-29 = "여, 역시 선생님…… 게헨나 학생들도 잘 알고 계시네요……"
10044070-30 = "선생님- 발 핥아본 적 있어-?"
10044070-31 = "혹시 우리 것도 핥고 싶어? 파햐햐!"
10044070-34 = "훗, 지붕을 통해 내부로 진입한다!"
10044070-35 = "크하핫, 이 열차를 고스란히 탈취해 주마!!"
10044070-43 = "아앗……! 열차에까지……!"
10044070-44 = "지붕 위로 올라왔어- 역시 우승 유력 팀-"
10044070-49 = "파햐햐! 장난 없네! 이러다 화물이 터지기라도 하면 곤란한데?"
10044070-50 = "어, 어떻게 하죠~!!"
10044070-57 = "커헉! 뭐, 뭐냐!"
10044070-58 = "게, 게헨나 선도부 녀석들이 공격을……!!"
10044070-64 = "하아…… 진짜……"
10044070-65 = "선생님, 나중에 제대로 설명해야 할 거야!!"
10044070-66 = "[ns5] \"고마워!!!\"\n[ns6] \"역시 이오리야!!\""
10044070-70 = "파햐햐! 솜씨 좋은데!!"
10044070-71 = "왕 멋짐- 게헨나 히어로-"
10044070-73 = "뭐, 뭐야……"
10044070-74 = "좋아, 우리도 올라가자! 이대로 지붕 위를 싹 청소하자고!!"
10044070-75 = "으, 으아아! 이 망할 세상……!!"
10044070-77 = "일단 지휘해 줘, 선생님!!"
