[translation]
1000503-1 = "게으름뱅이의 아침"
1000503-2 = "대책위원회 동아리실"
1000503-3 = "(호시노를 찾으러 왔지만 아무도 없다.)"
1000503-4 = "음냐……. 쿨……."
1000503-5 = "(옆 교실에서 목소리가 들린다.)"
1000503-6 = "[s] 옆 교실로 가본다."
1000503-8 = "아비도스 부실"
1000503-9 = "………."
1000503-10 = "………음냐. 쿨."
1000503-11 = "(책상을 한데 모아서 만든 간이 침대 위에 호시노가 누워 있다.)"
1000503-12 = "[s] 흔들어 깨운다."
1000503-15 = "……으, 응?"
1000503-18 = "우, 우왓?! 깜짝이야!"
1000503-19 = "선생?! 여긴 웬일이야?"
1000503-20 = "[s] 자초지종을 설명한다."
1000503-21 = "……내가 문자를 보내서 도와주러 왔다고?"
1000503-22 = "……으헤. 그랬었나? 잠결에 보냈나 봐. 미안 미안."
1000503-23 = "어떻게든 일어나 등교를 하긴 했지만 그 뒤에 기억이 잘 안나는데……"
1000503-24 = "정신을 차려보니 이런 곳에서 잠들어 있었던 건가. 으헤, 이건 또 굉장하네."
1000503-25 = "걱정되어서 찾아 왔다니, 이 아저씨도 그런 대사를 들을 때가 다 있고. 감격인데."
1000503-26 = "겸사겸사 온 김에 보물찾기나 하고 갈래, 선생?"
1000503-27 = "자아, 사양하지 말고. 이번엔 운동장 쪽 잡초 더미들을 뒤져보자고!"
1000503-29 = "(그 후 운동장 잡초 더미를 세 시간이나 뒤지고 다녔지만, 큰 성과는 없었다.)"
1000503-30 = "(먼지투성이가 된 채 배웅하는 호시노를 뒤로 하고 샬레로 돌아갔다.)"
