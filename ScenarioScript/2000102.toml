[translation]
2000102-1 = " 도움이 필요하다면, C&C에!"
2000102-2 = "밀레니엄 근교 도심가"
2000102-4 = "……."
2000102-5 = "여기는 콜사인 제로투, 인질과 파일이 있는 빌딩 앞에 도착."
2000102-6 = " 현재 범인들은 컴퓨터를 사용 중, 아마도 암호를 해독 중인 것으로 보인다."
2000102-7 = "그나마 아직 파일이 전송되지 않았다는 점에서 다행인가."
2000102-8 = "아, 지금 내 시야에서 인질들의 위치를 확인했다."
2000102-9 = "아마도 파일을 보호하려다 붙잡힌 학생회 보안부 소속으로 추정되는군."
2000102-10 = "우선 인질들은 밀레니엄 여학생들을 구출하고 또 다른 인질…… 응?"
2000102-11 = "서, 선생님?"
2000102-12 = "선생님이 어째서 여기에……?"
2000102-13 = " 휘말린 밀레니엄 여학생들을 보호하려다 같이 잡혀온 것이라는 보고가……!"
2000102-14 = "하여간…… 저 사람은!"
2000102-15 = "사태는 긴급! 02! 먼저 진입한다!"
2000102-17 = "자, 잠깐만!"
2000102-19 = "건물 내부"
2000102-20 = "헤헤. 슬슬 파일 전송을 시작한다."
2000102-21 = "이 파일만 의뢰주에게 보내면 우리도 돈방석에……"
2000102-22 = "(콰앙!)"
2000102-23 = "뭐, 뭐, 뭐야!"
2000102-24 = "스, 습격이다! 메이드부가 쳐들어왔다!"
2000102-25 = "이런 젠장! 벌써 냄새를 맡은 건가!"
2000102-26 = "어떻게든 이 파일만……."
2000102-28 = "(타앙!)"
2000102-30 = "꾸엑!"
2000102-31 = "어, 엄청난 화력이다!"
2000102-32 = "도, 도망쳐!"
2000102-35 = "선생님!"
2000102-36 = "괜찮은 거야? 어째서 이런 곳에 있는 거지?"
2000102-37 = "뭐? 밀레니엄 여학생들이 위험해 보였는데 구할 수가 없어서……"
2000102-38 = "그냥 같이 잡혀 왔다고?"
2000102-39 = "……어이가 없군."
2000102-40 = "선생님의 선량한 의지나 지휘 능력은 존중하지만……."
2000102-41 = "탄환 하나만으로 위험할 수 있는…… 약한 선생님으로선, 현명한 선택이 아니었던 것 같다."
2000102-42 = "만약 내가 오지 않았다면 선생님은 이놈들에게……."
2000102-43 = "쏴라!"
2000102-45 = "이런! 잔당이 남아 있었나!"
2000102-46 = "포기를 모르는 놈들이군……."
2000102-47 = "쿠헬헬. 포기?!"
2000102-48 = "포기는 너희가 해야지!"
2000102-49 = "어이 메이드. #n네 임무는 인질을 구출하고, 파일이 전송되기 전에 회수하는 거겠지?"
2000102-50 = "그게 아니라면 컴퓨터 앞에 있던 녀석을 가장 먼저 쏘진 않았을 테니까."
2000102-51 = "……!"
2000102-52 = "하지만 끝났다! #n암호 해독도, 그리고 파일 전송도! 넌 실패했어!"
2000102-53 = "뭐, 뭐라고?!"
2000102-54 = "크하하! 아까 네가 공격해오기 직전, 파일전송 완료는 이미 10초도 안남아 있었다! #n지금쯤이면 파일이 의뢰주에게로 전송 완료가……"
2000102-55 = "어라?"
2000102-56 = "뭐, 뭐, 뭐야?!"
2000102-57 = "……?"
2000102-58 = "파일 전송이 1초 남기고 멈춰 있잖아! 대체 어떻게……"
2000102-59 = "……응?"
2000102-60 = "서, 선생?! 당신 손에 있는 건……!"
2000102-61 = "[s1] \"내가…… 시간을 멈추었다. 나 참.\"\n[s2] \"인터넷 선을 뽑았다.\""
2000102-62 = "자, 잘했어 선생님! 훌륭해!"
2000102-63 = "자, 잘했어 선생님! 훌륭해!"
2000102-64 = "크윽! 그 선 이리 내!"
2000102-65 = "[s3] 선을 돌려준다.\n[s4] 카린에게 어떻게 할지 물어본다."
2000102-66 = "선? 돌려줘도 상관없어."
2000102-67 = "선? 돌려줘도 상관없어."
2000102-68 = "어차피……"
2000102-69 = "(탕!)"
2000102-71 = "(콰앙!)"
2000102-72 = "끄아아악! PC가!"
2000102-73 = "두, 두, 두고 보자!"
2000102-76 = "휴우……."
2000102-77 = "간신히…… 임무 완료인가?"
2000102-78 = "응? 쫓지 않아. 잔당이 있을지도 모르고."
2000102-79 = "내 역할은 저들을 때려잡는 게 아니라, 이곳에 있는 사람들을 지키는 거니까."
2000102-80 = "선생님도……"
2000102-81 = "아, 그러고 보니 이 말을 하는 게 늦었네."
2000102-82 = "고마워 선생님. 덕분에 임무를 완수할 수 있었다."
2000102-83 = "설마 그 상황에…… 인터넷 선을 뽑을 줄이야."
2000102-84 = "……"
2000102-85 = "아까, 약하다고 했던 말, 취소하겠어."
2000102-86 = "선생님은 용기 있는 사람이야."
2000102-89 = "아, 통신이 들어왔다. #n잔당은 우리 메이드부 부원들이 청소하는 중이야."
2000102-90 = "이만 돌아가야겠어."
2000102-91 = "……그, 선생님."
2000102-92 = "앞으로도, 잘 부탁해."
