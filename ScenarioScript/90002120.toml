[translation]
90002120-1 = "제12화;사라진 자"
90002120-5 = "무슨 일이 일어나고 있는 거지?"
90002120-6 = "저 아이들, 그리고 말쿠트…… 모두 같은 편 아니었어? 조금 전까지만 해도 언니라고 부르면서, 서로 도왔잖아."
90002120-11 = "예. 이건 확실히…… 알 수 없군요. 처음부터 계획된 것이었을까요? 그렇다고 하기에는 저 세 명의 반응이 이상합니다."
90002120-16 = "어떤 의식 같아 보인다는 것은 확실하네요. 그렇지만 의미를 알 수가 없군요. 뭘 하려는 거죠……?"
90002120-17 = "말쿠트에게 엄청난 속도로 모여들던 에너지가 안정화됐어. 그리고…… 강철대륙까지도. 그렇지만……."
90002120-18 = "케이. 무슨 일이 일어날지 알 수 있겠어?"
90002120-23 = "……알 게 뭔가요. 광신이란 건 원래 이해할 수 없는 거예요. 그런 것보다……."
90002120-25 = "우리에게서 언니를 빼앗아 가지 말아 주세요!!!"
90002120-26 = "누군가 죽어야 한다면, 언니 대신에 제가 죽을 테니까!!!!!"
90002120-30 = "(도대체, 왜 그런 말을……?)"
90002120-35 = "선생님?!"
90002120-36 = "……!? 선생님! 위험합니다!"
90002120-41 = "[ns] \"우왓?!\""
90002120-43 = "(케이와 아리스, 리오에게 밀려 어딘가로 넘어졌다.)"
90002120-44 = "선생님! 괜찮으십니까?!"
90002120-45 = "[s] \"어떻게 된 거야?!\""
90002120-46 = "발밑을 조심하세요! 또 솟아납니다!"
90002120-53 = "[ns] \"벽이……!\""
90002120-54 = "읏……!?"
90002120-55 = "리오!"
90002120-60 = "미, 미안……. 순간적으로 균형을 잃었어."
90002120-68 = "벽이 마구잡이로 생겨나서 공간을 분할하고 있어요. 좋아요……. 잠시 흔들림이 멈췄군요."
90002120-69 = "……뭔가, 그때가 생각나네요. 리오."
90002120-74 = "그때?"
90002120-75 = "그때라뇨, 케이?"
90002120-76 = "당신이 '에리두'를 만들었을 때 말이에요. 이런 식으로 격벽을 작동시켜서…… C&C 분들을 격리시켰잖아요?"
90002120-77 = "아……!"
90002120-78 = "네……. 어째서인지, 그 기억이 아리스에게도 남아 있습니다."
90002120-79 = "조금 먼 꿈을 보는 것 같은, 흐릿하고 막연한 느낌이지만요."
90002120-80 = "생각해 보니 그것도 당연합니다. 그때의 아리스는 케이와…… 하나였으니까요."
90002120-81 = "……."
90002120-82 = "……."
90002120-83 = "혹시 말이야, 케이. 만일 내가……."
90002120-84 = "나 때문에 이렇게 됐다거나, 내가 좀 더 잘했더라면 뭔가가 더 나았을 거라는 생각을 하고 있는 거라면, 지금 당장 집어치워요."
90002120-85 = "케, 케이?"
90002120-86 = "케이?!"
90002120-87 = "어떤 일은 그냥 일어나요. 왜 그런지는 아무도 모르지만, 하여튼 그렇게 된다구요. 그냥 그런 일이 있다는 걸, 때로는 받아들여야 해요."
90002120-88 = "이미 일어난 일의 잘잘못을 따져 봤자 쓸모도 없고, 특히 이렇게 자기가 연관되지도 않은 일이라면 더더욱 그래요. 중요한 건 그런 게 아니에요."
90002120-89 = "네! 중요한 건 그런 게 아니에요! 그런 것보다!"
90002120-90 = "으, 응?"
90002120-91 = "제가 알고 싶은 건! 어떻게 해야 이 상황에서 벗어날 수 있고, 무사히 돌아갈 수 있느냐 예요!"
90002120-92 = "알겠어요? 전 돌아갈 거예요! 무슨 일이 있어도 돌아갈 거라구요!"
90002120-93 = "어떻게든 살아남아서, 아무리 말도 안 되는 일을 겪더라도, 마지막까지 발버둥 치면서!"
90002120-94 = "……!"
90002120-95 = "맞습니다, 케이! 케이의 말 그대로입니다!"
90002120-96 = "[s] \"응. 나도 아리스가 한 말에 찬성이야.\""
90002120-101 = "[ns1] \"그리고 케이는 무슨 일이 있어도.\"\n[ns2] \"돌아가야 하는 게 맞아.\""
90002120-104 = "……제 말을 제대로 이해하지 못하신 것 같은데요, 선생님."
90002120-109 = "돌아간다는 건, 여기 있는 모두를 포함한 거거든요? 애초에, 저 혼자 돌아가서 뭘 어쩔 수 있다는 건가요?"
90002120-113 = "[ns] \"……그래.\""
90002120-114 = "……웃. 뭘 그렇게 흐뭇한 표정으로 바라보고 있는 건가요……."
90002120-116 = "[ns] \"그러면, 어서 움직이자.\""
90002120-117 = "그렇지만, 어디로?"
90002120-118 = "어디든 여기에 가만히 웅크리고 있는 것보다는 낫지 않을까요? 주변을 돌아다니면서, 최소한의 정보라도 모아 보죠."
90002120-119 = "뭐, 그러다 히마리나 에이미…… 토키를 만나게 된다면, 더 좋을 거고요."
90002120-120 = "네! 아리스는 용사니까, 앞장서겠습니다!"
90002120-121 = "그래요, 아리스. 믿음직스럽네요."
90002120-127 = "……? 잠깐만. 저기, 저쪽…… 뭐지?"
90002120-128 = "네……?"
90002120-130 = "(리오가 가리키는 쪽을 향해 시선을 돌렸다.)"
90002120-131 = "(벽 너머, 멀리 보이는 것은.)"
90002120-135 = "(한때 말쿠트라는 이름으로 불렸던, '무언가'의 모습이었다…….)"
90002120-137 = "다음화;아이들"
