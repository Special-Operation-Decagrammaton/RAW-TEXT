[translation]
2601205-1 = "종합 구조 실습"
2601205-3 = "와주셨군요, 선생님!"
2601205-4 = "라이프가드의 자격을 위해 달려온 기나긴 노력과 고통의 시간……."
2601205-5 = "그 성과를 선생님께 보여드릴 수 있어서 영광입니다!"
2601205-6 = "[s1] \"응, 기대하고 있어.\"\n[s2] \"얼른 보고 싶은데!\""
2601205-9 = "기대하셔도 좋습니다!"
2601205-10 = "자, 그럼 여기 익수자를 상정한 5kg 무게추를 물로 던져 주세요!"
2601205-11 = "힘껏 던져도 괜찮습니다!"
2601205-15 = "[ns] \"이얏!\""
2601205-19 = "사람이 물에 빠졌습니다! 라이프가드 키리노, 출동하겠습니다!"
2601205-25 = "[ns] (빠르게 무게추를 회수해서……!)"
2601205-26 = "어푸어푸!"
2601205-27 = "콜록!"
2601205-28 = "[s3] (뭔가……)\n[s4] (여전히 불안한 느낌이……)"
2601205-32 = "푸헥!"
2601205-33 = "모, 몸이 마음대로 안 움직이네요……."
2601205-35 = "심폐소생술은 제대로 하겠습니다!"
2601205-36 = "하앗!"
2601205-44 = "[ns5] \"자, 잠깐만…… 압박이 너무 거칠지 않아?\"\n[ns6] \"훈련용 모형이 엉망이 됐는데…….\""
2601205-48 = "아뇨, 심장 압박은 피가 제대로 통할 수 있게 확실히 해야 하니까요!"
2601205-49 = "핫! 핫! 핫! 핫!"
2601205-50 = "[s] \"키리노, 잠시 훈련은 멈추고…….\""
2601205-55 = "[ns] \"앗?!\""
2601205-58 = "선생님!!"
2601205-64 = "[wa:730]― [log=키리노 수영복]선생님![/log]"
2601205-65 = "[wa:1070]― [log=키리노 수영복]괜찮으세요?![/log]"
2601205-68 = "[wa:730]― [log=키리노 수영복]다행이다……[wa:1870]눈을 뜨셨군요.[/log]"
2601205-69 = "[wa:1870]― [log=키리노 수영복]큰일난 줄 알았습니다.[wa:1560] [/log]"
2601205-72 = "― [log=키리노 수영복]심폐소생술은……[/log]"
2601205-73 = "[wa:1840]― [log=키리노 수영복]필요 없을 것 같네요.[/log]"
2601205-76 = "[ns7] \"잠깐 발을 헛디뎠을 뿐이야.\"\n[ns8] \"살짝 실수했을 뿐이야.\""
2601205-79 = "[wa:730]― [log=키리노 수영복]물가에서는 [wa:890]언제나 주변 상황에 [wa:1580]주의를 기울여야 해요![/log]"
2601205-82 = "― [log=키리노 수영복]아무리 수영에 자신 있는 사람이라도,[/log]"
2601205-83 = "[wa:1850]― [log=키리노 수영복]불의의 사태는 언제든 [wa:750]발생할 수 있으니까요.[/log]"
2601205-86 = "[wa:900]― [log=키리노 수영복]물론, [wa:790]본관과 같은 라이프가드가 있다면 [wa:1970]문제없지만요![/log]"
2601205-89 = "[wa:630]― [log=키리노 수영복]본관이 언제나 지켜보고 있을 테니 [wa:1610]안심해 주세요![/log]"
2601205-93 = "휴우, 그래도 선생님의 상태가 심각하지 않아서 다행이었습니다."
2601205-94 = "그 와중에 훈련이 엉망이 되었지만 말이죠……."
2601205-95 = "무게추는 아직도 수영장 바닥에 있고……훈련용 모형도 망가지고 말았습니다."
2601205-96 = "훈련의 성과를 보여드릴 모처럼의 기회였는데, 망쳐 버렸네요……."
2601205-97 = "[s] \"아냐, 훈련의 성과는 충분히 보았어.\""
2601205-98 = "네? 그게 무슨 말씀이신가요?"
2601205-99 = "[s] \"실제로 물에 빠진 사람을 완벽하게 구해냈잖아?\""
2601205-103 = "[ns] \"라이프가드로서 성장했다는 증거야.\""
2601205-104 = "보, 본관은 선생님이 빠진 것을 보자마자 아무 생각 없이 물에 뛰어들었을 뿐인데요!"
2601205-105 = "하지만 확실히, 무게추보다 무거운 선생님을 물 밖으로 옮겨드렸고……."
2601205-109 = "네, 어쩌면 선생님 말씀이 맞을지도 모르겠네요"
2601205-110 = "본관도 모르는 사이에 라이프가드로서 한 걸음 나아갔나 봅니다."
2601205-111 = "감사합니다, 선생님! 덕분에 훈련을 완수할 수 있었습니다!"
2601205-116 = "이제부터는! 라이프가드 키리노라고 불러주세요!"
