[translation]
1014305-1 = "Rewinding Memories"
1014305-2 = ""
1014305-3 = "[ns] \"...\""
1014305-4 = ""
1014305-5 = "W-What's wrong, Sensei?"
1014305-6 = "[s] \"We're really...going to do the same thing as yesterday?\""
1014305-7 = "W-Would...that be...too much...?"
1014305-8 = "I was thinking that we could simply...revisit all the places we went to so we can erase yesterday's memories and...replace them."
1014305-9 = "[s1] \"It's not that!\"\n[s2] \"Won't it be boring for you?\""
1014305-12 = "No. That won't be a problem."
1014305-13 = "As you know, Sensei, even in the same environment, experiences you've had while \"young\" never feel the same as when you revisit them while \"grown.\""
1014305-14 = "Oh...but now that I consider it... Would it be boring for you, Sensei...?"
1014305-15 = "[s3] \"I-I'll be fine!\"\n[s4] \"Because today's a new experience with 'Shun'!\""
1014305-18 = "..."
1014305-19 = "Thank you for saying that, Sensei. "
1014305-20 = "Then, I look forward to another special day with you."
1014305-24 = ""
1014305-25 = "I know we're all excited about rafting, but what's more fun is being SAFE!"
1014305-27 = ""
1014305-28 = ""
1014305-29 = "Now then, let's get out there!"
1014305-30 = "I look forward to working alongside you."
1014305-32 = ""
1014305-33 = ""
1014305-34 = "If you look to the right, you'll see a large rock with a cave-like opening."
1014305-35 = "Oh my. It strongly resembles a water buffalo. Is that \"Water Buffalo Rock\"?"
1014305-36 = ""
1014305-37 = "Oho, you have a keen eye! Or did you just do your research? Either way, we're happy to have you here!"
1014305-38 = "Your companion must be happy about it too!"
1014305-39 = "H-Huh?! W-Well... That's...!"
1014305-40 = ""
1014305-41 = ""
1014305-42 = "Oh, the current is extra strong today. Hold on tight!"
1014305-43 = ""
1014305-44 = "[ns] \"H-Huh?!\""
1014305-45 = "Sensei?!"
1014305-55 = ""
1014305-56 = ""
1014305-57 = "Nicely done! Just hold onto each other real closely until we get out of these rapids!"
1014305-58 = "T-That's right... Sensei."
1014305-59 = "..."
1014305-60 = "Just trust me. Okay?"
1014305-61 = "[s] \"Y-Yeah...!\""
1014305-63 = "That's all for rafting today! Nice work, team!"
1014305-64 = ""
1014305-66 = ""
1014305-67 = "Thank you. Great work."
1014305-68 = "..."
1014305-69 = "H-How was it, Sensei?"
1014305-70 = "Compared to yesterday... Did it feel new to you?"
1014305-71 = "I think it was...for me."
1014305-72 = "[s] \"M-Me too...the same!\""
1014305-73 = "That's a relief..."
1014305-74 = "Well, then! Would you like to stroll the shopping district now?"
1014305-75 = ""
1014305-77 = "I remember that the first thing we ate yesterday was the barbecue skewer. Then, today..."
1014305-78 = "..."
1014305-79 = "Uh, Sensei?"
1014305-80 = "It's pretty empty... Would it be all right if we took a stroll together?"
1014305-81 = "[s] \"Huh? Sure. Let's do that.\""
1014305-82 = "Okay... Thank you. Then, Sensei..."
1014305-83 = ""
1014305-85 = ""
1014305-86 = ""
1014305-87 = "Shun suddenly linked her arm with mine...!"
1014305-88 = "...This is okay, isn't it? Since we're...grouped together?"
1014305-89 = "Heehee..."
1014305-90 = "Thank you again, Sensei."
1014305-92 = "I leisurely walked along the street with Shun."
1014305-93 = "We got hungry along the way, so we stopped by a restaurant."
1014305-94 = ""
1014305-95 = ""
1014305-96 = ""
1014305-99 = ""
1014305-100 = "Thank you for putting up with my childishness for two days, Sensei."
1014305-101 = "[s] \"I'm the grateful one...\""
1014305-102 = "Oh my. I never imagined you'd think that."
1014305-103 = "..."
1014305-104 = "I know it's a funny thing for me to say, but it was kind of an interesting experience. "
1014305-105 = "[s] \"In what way?\""
1014305-106 = "Yesterday and today... We're practically reliving the day, you know?"
1014305-107 = "But even going through the same situations... I think I acted and responded in a slightly different manner."
1014305-108 = "It's kind of embarrassing to admit, but my actions...were somehow more 'mature' than yesterday's."
1014305-109 = "It reminded me of when I was little, and how I behaved back then..."
1014305-110 = "Something about all of that..."
1014305-111 = "To think that the mountain and river remain the same. ...And I'm the only one who's changed."
1014305-112 = "[s] \"Mountains and rivers change too, just slowly.\""
1014305-113 = "That's true. But the time we spent together was different."
1014305-114 = "Someday, like you, I'll learn to live my life to the fullest. I'll become the adult I'm meant to be."
1014305-115 = "But even then, I get the feeling that I won't be as complete an \"adult\" as you are, Sensei."
1014305-116 = "Huh? You think I'm holding you in \"too high esteem\"?"
1014305-117 = "[s] \"Even adults...hide at least three children in their hearts...\""
1014305-118 = "N-Not just one or two, but three. That specific number really resonates..."
1014305-119 = "You mean, \"people always grow, but a part of them stays a child forever\"?"
1014305-120 = "Heehee..."
1014305-121 = "Does that mean there's a hidden rascal somewhere inside you too, Sensei?"
1014305-122 = "[s5] \"Shun! Play with me!\"\n[s6] \"Shun! Let's have fun!\""
1014305-125 = "S-Sensei?!"
1014305-126 = "..."
1014305-127 = "Now, now. Come here, little [USERNAME]. Shall we play together?"
1014305-128 = "[s7] \"Wow! You're the best, Shun!\"\n[s8] \"Yippee! Thanks, Shun!!\""
1014305-131 = "Yes, yes. Everything's okay now. I'll keep everything scary and mean far, far away."
1014305-132 = ""
1014305-134 = "And then, Shun's gentle touch filled my every sense...!"
1014305-135 = ""
1014305-138 = "[ns] \"?!?!\""
1014305-140 = "Shh. You're fine, little [USERNAME]."
1014305-141 = "It's okay if you just trust me."
1014305-142 = "At least for now."
1014305-146 = "[ns] \"...\""
1014305-147 = "..."
1014305-148 = "[s] \"...\""
1014305-149 = "..."
1014305-150 = "...S-Sensei...? Say something..."
1014305-151 = "..."
1014305-152 = "[s] \"...Sorry. I was lost in the moment.\""
1014305-153 = "N-No! I'm the one who..."
1014305-154 = "It wasn't bad for me... In fact, it was quite nice... If possible, I would've liked to stay like that a little longer..."
1014305-155 = "A-Ahem!"
1014305-156 = "Summer valleys are dangerous!"
1014305-157 = "[s] \"T-That's right! They really are!\""
1014305-158 = "Right?! So let's just say that what just happened was because of this...treacherous valley!"
1014305-159 = ""
1014305-160 = "I nodded vigorously in agreement!"
1014305-161 = ""
1014305-163 = ""
1014305-164 = ""
1014305-165 = "..."
1014305-166 = "Ha... Haha... Hahahaha...!"
1014305-167 = "W-Why are you making that face, Sensei?! "
1014305-168 = "Huh? I look awkward, too?"
1014305-169 = "..."
1014305-170 = "No one can resist the power of a summer valley sunset!"
1014305-172 = "Shun and I stared at each other for a while, then laughed until the discomfort disappeared."
1014305-173 = ""
1014305-174 = "Still, Sensei?"
1014305-175 = "Regarding yesterday and today..."
1014305-176 = "Between the current \"me\" and the younger \"me,\" who do you prefer?"
1014305-177 = "[ns] \"...!\""
1014305-179 = "[ns] \"B-Both versions of you are the same to me, Shun...!\""
1014305-180 = "No."
1014305-181 = ""
1014305-183 = ""
1014305-184 = ""
1014305-185 = "I won't accept such a \"Sensei-like\" answer this time!"
1014305-187 = "I managed to brush off Shun's persistent interrogation, and barely made it back to my room..."
