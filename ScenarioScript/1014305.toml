[translation]
1014305-1 = "回憶倒帶"
1014305-2 = ""
1014305-3 = "[ns] 「……」"
1014305-4 = ""
1014305-5 = "怎，怎麼了嗎？老師？"
1014305-6 = "[s] 「真的……要做和昨天一樣的事嗎？」"
1014305-7 = "果，果然……會讓您覺得有負擔嗎……？"
1014305-8 = "為了覆蓋昨天的回憶，所以想再去一次昨天去過的地方……這樣的想法……"
1014305-9 = "[s1] 「我不是那個意思！」\n[s2] 「只是因為都已經體驗過了，我擔心你會覺得無聊……」"
1014305-12 = "不。不會有那種事的。"
1014305-13 = "誠如老師所知，相同的環境在「年幼時」和「長大後」的體驗也是不一樣的吧？"
1014305-14 = "啊……不過仔細想想，對老師來說……果然會覺得有點無聊對吧……？"
1014305-15 = "[s3] 「我，我沒問題哦！」\n[s4] 「因為今天是和『旬』一起體驗嘛！」"
1014305-18 = "……"
1014305-19 = "謝謝您願意這麼說，老師。"
1014305-20 = "那麼，今天也請您多多關照了。"
1014305-24 = ""
1014305-25 = "泛舟真的很有趣哦！我來為各位說明安全須知。"
1014305-27 = ""
1014305-28 = ""
1014305-29 = "那麼我們就出發吧！"
1014305-30 = "麻煩您了。"
1014305-32 = ""
1014305-33 = ""
1014305-34 = "來，現在大家的右手邊，可以看見一塊有著巨大孔洞的岩石哦。"
1014305-35 = "哎呀，長得很像水牛呢。難道是叫水牛岩嗎？"
1014305-36 = ""
1014305-37 = "哦哦，觀察力真敏銳！還是說你有事先做功課嗎？#n這對我們來說真是令人感激啊。"
1014305-38 = "同行的這位一定也會很開心吧！"
1014305-39 = "咦！？那，那個……該怎麼說呢……！"
1014305-40 = ""
1014305-41 = ""
1014305-42 = "哎呀，今天的水流特別湍急呢。抓緊囉！"
1014305-43 = ""
1014305-44 = "[ns]「咦，咦咦！？」"
1014305-45 = "老師！？"
1014305-55 = ""
1014305-56 = ""
1014305-57 = "做得很好！在通過這段急流之前，請兩位緊緊抓住彼此哦！"
1014305-58 = "好，好像只能照做了呢，老師。"
1014305-59 = "……"
1014305-60 = "請您相信我，好嗎？"
1014305-61 = "[s] 「嗯，嗯……！」"
1014305-63 = "今天的泛舟就到此結束！"
1014305-64 = ""
1014305-66 = ""
1014305-67 = "非常感謝！"
1014305-68 = "……"
1014305-69 = "感，感覺如何呢，老師？"
1014305-70 = "與昨天相比……今天有沒有成為一次全新的體驗呢？"
1014305-71 = "我個人感覺……是有的。"
1014305-72 = "[s] 「我，我的想法……也和旬一樣！」"
1014305-73 = "太好了……"
1014305-74 = "那麼！接下來要不要去商店街看看呢？"
1014305-75 = ""
1014305-77 = "我記得昨天最先吃的東西是烤肉串，那麼今天就……"
1014305-78 = "……"
1014305-79 = "那個……老師。"
1014305-80 = "我今天想悠閒地……像同行的伴侶一樣，跟老師一起散步……可以嗎？"
1014305-81 = "[s] 「嗯？好啊。就這麼辦吧。」"
1014305-82 = "好的……謝謝您，老師。#n那麼……"
1014305-83 = ""
1014305-85 = ""
1014305-86 = ""
1014305-87 = "（旬突然靠了過來，並自然而然地挽住了手臂……！）"
1014305-88 = "……您應該，不會介意吧？畢竟是同行的……伴侶嘛。"
1014305-89 = "呵呵……"
1014305-90 = "再次謝謝您，老師。"
1014305-92 = "（與旬一起悠閒地在街上四處散步）"
1014305-93 = "（結果途中還是因為肚子餓，找了一間餐廳用餐）"
1014305-94 = ""
1014305-95 = ""
1014305-96 = ""
1014305-99 = ""
1014305-100 = "老師，謝謝您連續兩天陪我撒嬌。"
1014305-101 = "[s] 「該道謝的反而是我才對……」"
1014305-102 = "哎呀，沒想到您會這麼想呢。"
1014305-103 = "……"
1014305-104 = "自己這麼說或許有點奇怪，但這真是一次不可思議的體驗呢。"
1014305-105 = "[s] 「怎麼說？」"
1014305-106 = "昨天和今天……幾乎是相同的情況，對吧？"
1014305-107 = "然而我卻覺得自己的行動與反應……似乎和昨天有些區別。"
1014305-108 = "雖然自己這麼說有點難為情，但我的行為……好像比昨天更加「成熟」了一些。"
1014305-109 = "年幼時的記憶也浮上心頭，讓我想起了當時的自己是如何行動的……"
1014305-110 = "那些事情，總覺得……"
1014305-111 = "即使不局限於這兩天，山河依然維持著原本的樣貌……似乎只有我正在不斷改變。"
1014305-112 = "[s] 「其實山河也是有在慢慢改變哦。」"
1014305-113 = "您說的沒錯。不過，或許是經歷的時間尺度有所不同吧。"
1014305-114 = "我總有一天也會像老師一樣走過屬於我的歲月，成為一名成熟的大人……"
1014305-115 = "可是我有時會覺得……即使那一天來臨，我也無法成為跟老師一樣成熟的「大人」。"
1014305-116 = "咦？或許是我太抬舉老師了？"
1014305-117 = "[s] 「其實大人的心裡啊……至少藏著三個小孩子呢……」"
1014305-118 = "不，不是一兩個，而是三個啊。#n這麼具體的數字反而很有說服力呢……"
1014305-119 = "意思是人無論怎麼成長，終究會有某個部分仍然保有孩子的一面嗎？"
1014305-120 = "呵呵……"
1014305-121 = "也就是說，在老師內心的某個角落也藏著一個調皮鬼囉？"
1014305-122 = "[s5] 「旬姊姊～陪我玩嘛～」\n[s6] 「旬姐姐～陪我玩嘛～」"
1014305-125 = "老，老師！？"
1014305-126 = "……"
1014305-127 = "來，到這邊來。[USERNAME]小朋友，我們一起玩吧？"
1014305-128 = "[s7] 「哇～旬姊姊最棒了～」\n[s8] 「哇～旬姐姐最棒了～」"
1014305-131 = "現在已經沒事了。#n那些可怕的東西和困難的事情，我已經通通趕跑了哦。"
1014305-132 = ""
1014305-134 = "（下個瞬間，所有的感官都被旬那柔軟的觸感給填滿了……！）"
1014305-135 = ""
1014305-138 = "[ns]「！？！？」"
1014305-140 = "噓……[USERNAME]小朋友是個乖孩子呢。"
1014305-141 = "只要相信我就可以囉。"
1014305-142 = "至少……在現在這個時刻。"
1014305-146 = "[ns] 「……」"
1014305-147 = "……"
1014305-148 = "[s]「……」"
1014305-149 = "…………"
1014305-150 = "老，老師……？麻煩您說點什麼……"
1014305-151 = "……"
1014305-152 = "[s] 「……抱歉。我太沉醉在氣氛裡了。」"
1014305-153 = "不，不會！反而是我……"
1014305-154 = "其實我並不討厭這樣……不如說還挺喜歡的……#n如果可以的話，我甚至想再維持久一點……"
1014305-155 = "咳，咳哼！"
1014305-156 = "夏季的溪谷真可怕呢！"
1014305-157 = "[s] 「就，就是說啊！真的太可怕了！」"
1014305-158 = "對吧！？所以就把剛才發生的一切，全都當作是夏季溪谷的錯吧！"
1014305-159 = ""
1014305-160 = "（激動地點頭表示贊成！）"
1014305-161 = ""
1014305-163 = ""
1014305-164 = ""
1014305-165 = "……"
1014305-166 = "噗……呵呵呵……啊哈哈哈……！"
1014305-167 = "老，老師，您那是什麼表情！"
1014305-168 = "咦？我看起來也有點不自然嗎？"
1014305-169 = "……"
1014305-170 = "真是拿夏季的溪谷沒辦法呢！"
1014305-172 = "（就這樣與旬看著彼此笑了好一段時間，直到所有的尷尬都消散為止）"
1014305-173 = ""
1014305-174 = "話說回來……老師？"
1014305-175 = "關於這兩天的事……"
1014305-176 = "現在的我與年幼的我，您比較喜歡哪一個呢？"
1014305-177 = "[ns]「……！」"
1014305-179 = "[ns] 「無，無論哪一個，對老師來說都是同一個旬啊……！」"
1014305-180 = "這樣不行哦。"
1014305-181 = ""
1014305-183 = ""
1014305-184 = ""
1014305-185 = "那種「很有老師風格」的回答，這次我可是不會接受的！"
1014305-187 = "（想方設法地含糊帶過緊緊追問的旬，好不容易才回到了住處……）"
