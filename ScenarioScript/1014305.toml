[translation]
1014305-1 = "ย้อนวันแห่งความทรงจำ"
1014305-2 = ""
1014305-3 = "[ns] \"...\""
1014305-4 = ""
1014305-5 = "ทะ... ทำไมเหรอคะ คุณครู?"
1014305-6 = "[s] \"จะ... ทำเหมือนเมื่อวานจริงๆ เหรอ?\""
1014305-7 = "มะ... มันทำให้รู้สึก... ลำบากใจ... สินะคะ...?"
1014305-8 = "ความคิดของฉัน... ที่จะไปสถานที่เมื่อวานอีกครั้ง เพื่อใช้ความทรงจำของวันนี้เขียนทับความทรงจำ#nของเมื่อวาน..."
1014305-9 = "[s1] \"ไม่ใช่แบบนั้นนะ! ครูแค่กลัวว่าจะเบื่อที่เดิมน่ะ...\" \n[s2] \"แค่คิดว่าเคยทำไปแล้วครั้งหนึ่ง ก็เลยกลัวว่าจะเบื่อน่ะ...\""
1014305-12 = "ไม่ค่ะ ไม่มีทางเป็นแบบนั้นหรอกค่ะ"
1014305-13 = "อย่างที่คุณครูทราบ ต่อให้สภาพแวดล้อมจะยังเหมือนเดิม แต่ประสบการณ์ตอนที่ 'ยังเด็ก' #nกับตอนที่ 'โตแล้ว' ย่อมให้ความรู้สึกต่างกันนี่คะ?"
1014305-14 = "อ่า... แต่พอมาคิดดูแล้ว สำหรับคุณครูแล้ว... การไปที่เดิมอาจจะน่าเบื่อจริงๆ ก็ได้ใช่มั้ยคะ...?"
1014305-15 = "[s3] \"คะ... ครูไม่เบื่อหรอก! ได้อยู่กับ 'ชุน' ทั้งที!\"\n[s4] \"ไม่หรอก วันนี้เป็นประสบการณ์ที่ได้ทำร่วมกับ 'ชุน' นี่นา!\""
1014305-18 = "..."
1014305-19 = "ขอบคุณที่พูดแบบนั้นนะคะ คุณครู "
1014305-20 = "ถ้างั้น วันนี้ขอรบกวนด้วยนะคะ"
1014305-24 = ""
1014305-25 = "การล่องแก่งเป็นกิจกรรมที่สนุกมากจริงๆ ครับ ผมจะอธิบายข้อควรระวังให้ฟังนะครับ"
1014305-27 = ""
1014305-28 = ""
1014305-29 = "เอาละ ถ้างั้นก็ออกเดินทางกันเลยครับ!"
1014305-30 = "รบกวนด้วยนะคะ"
1014305-32 = ""
1014305-33 = ""
1014305-34 = "เอาละครับ ถ้ามองไปทางขวาจากตรงนี้ จะเห็นโขดหินใหญ่ที่มีช่องคล้ายถ้ำอยู่ครับ"
1014305-35 = "ตายจริง ดูเหมือนควายเลยนะคะ หรือว่าจะเป็นโขดหินควายคะ?"
1014305-36 = ""
1014305-37 = "โอ้โห สายตาเฉียบแหลมมากเลยครับ! หรือว่าศึกษาเกี่ยวกับหุบเขาแห่งนี้มาก่อนแล้ว? เป็นเรื่องที่น่าขอบคุณมากเลยล่ะครับ"
1014305-38 = "คนที่มาด้วยคงดีใจแน่เลยครับ!"
1014305-39 = "คะ... คะ?! คะ... คือว่า... เรื่องนั้น...!"
1014305-40 = ""
1014305-41 = ""
1014305-42 = "ตายจริง วันนี้กระแสน้ำแรงเป็นพิเศษเลย จับไว้ให้แน่นนะครับ!"
1014305-43 = ""
1014305-44 = "[ns] \"หะ... หา?!\""
1014305-45 = "คุณครู?!"
1014305-54 = ""
1014305-55 = ""
1014305-56 = "ทำได้ดีมากครับ! ช่วยกอดกันไว้แน่นๆ อีกสักพัก จนกว่าจะพ้นกระแสน้ำช่วงนี้ไปนะครับ!"
1014305-57 = "ผะ... ผู้ฝึกสอนบอกว่าให้กอดไว้ค่ะ คุณครู"
1014305-58 = "..."
1014305-59 = "เชื่อใจฉันนะคะ เข้าใจมั้ยคะ?"
1014305-60 = "[s] \"อะ... อื้อ...!\""
1014305-62 = "การล่องแก่งในวันนี้สิ้นสุดแค่เท่านี้ครับ!"
1014305-63 = ""
1014305-65 = ""
1014305-66 = "ขอบคุณค่ะ เหนื่อยหน่อยนะคะ"
1014305-67 = "..."
1014305-68 = "ปะ... เป็นอย่างไรบ้างคะ คุณครู?"
1014305-69 = "เทียบกับเมื่อวานแล้ว... ถือว่าเป็นประสบการณ์ใหม่หรือเปล่าคะ?"
1014305-70 = "สำหรับฉัน... คิดว่าเป็นแบบนั้นค่ะ"
1014305-71 = "[s] \"คะ... ครูก็... เหมือนกัน!\""
1014305-72 = "โล่งอกไปทีนะคะ..."
1014305-73 = "ถ้างั้น! จากนี้ไป เราไปเดินย่านการค้ากันมั้ยคะ?"
1014305-74 = ""
1014305-76 = "ฉันจำได้ค่ะ อาหารอย่างแรกที่กินเมื่อวานคือบาร์บีคิวค่ะ ถ้างั้น วันนี้..."
1014305-77 = "..."
1014305-78 = "เอ่อ คุณครูคะ?"
1014305-79 = "วันนี้ฉันอยากเดินเล่นสบายๆ กับคุณครู... เหมือนเป็นคนที่มาเที่ยวด้วยกัน... จะได้มั้ยคะ?"
1014305-80 = "[s] \"หืม? ได้สิ ได้เลย\""
1014305-81 = "ค่ะ... ขอบคุณค่ะ คุณครู ถ้างั้นก็..."
1014305-82 = ""
1014305-84 = ""
1014305-85 = ""
1014305-86 = "(จู่ๆ ชุนก็เข้ามาควงแขนอย่างเป็นธรรมชาติ...!)"
1014305-87 = "ไม่เป็น... ไรใช่มั้ยคะ? ก็เราเป็นคนที่มาเที่ยวด้วยกัน... นี่คะ"
1014305-88 = "ฮุฮุ..."
1014305-89 = "ขอบคุณอีกครั้งนะคะ คุณครู"
1014305-91 = "(แล้วคุณครูก็เดินเล่นไปตามถนนอย่างสบายๆ พร้อมกับชุน)"
1014305-92 = "(สุดท้ายระหว่างทางก็เริ่มหิว จนต้องมองหาร้านอาหารอยู่ดี)"
1014305-93 = ""
1014305-94 = ""
1014305-95 = ""
1014305-98 = ""
1014305-99 = "ขอบคุณที่ตามใจฉันถึงสองวันติดเลยนะคะ คุณครู"
1014305-100 = "[s] \"ครูต่างหากล่ะที่ต้องขอบใจ...\""
1014305-101 = "ตายจริง ไม่คิดเลยค่ะว่าคุณครูจะคิดแบบนั้น"
1014305-102 = "..."
1014305-103 = "อาจฟังดูตลกถ้าฉันจะพูดแบบนี้ออกมาเอง แต่นี่ก็เป็นประสบการณ์ที่น่าอัศจรรย์นะคะ "
1014305-104 = "[s] \"ตรงไหนเหรอ?\""
1014305-105 = "เมื่อวานกับวันนี้... เป็นสถานการณ์ที่แทบจะเหมือนกันเลยใช่มั้ยล่ะคะ?"
1014305-106 = "แต่ในสถานการณ์เดียวกันนั้น... ฉันรู้สึกว่าตัวเองทำตัวและรับมือแตกต่างกันเล็กน้อยค่ะ"
1014305-107 = "พูดจากปากตัวเองก็เขินนิดหน่อยนะคะ แต่การกระทำของฉันในวันนี้... รู้สึกว่า 'เป็นผู้ใหญ่' กว่าเมื่อวานขึ้นมาหน่อยค่ะ"
1014305-108 = "ทั้งนึกถึงความทรงจำในวัยเด็ก และจำได้ด้วยว่าตอนนั้นฉันทำตัวแบบไหน..."
1014305-109 = "เรื่องพวกนั้น มันเหมือนกับว่า..."
1014305-110 = "ต่อให้ไม่ใช่แค่เมื่อวานกับวันนี้ ภูเขาและแม่น้ำก็ยังคงเหมือนเดิมทุกอย่าง แต่ดูเหมือนว่ามีเพียงแค่... คนที่อยู่ตรงนั้นเท่านั้นที่เปลี่ยนไปน่ะค่ะ"
1014305-111 = "[s] \"ที่จริงภูเขากับแม่น้ำก็ค่อยๆ เปลี่ยนไปเหมือนกันนะ\""
1014305-112 = "เรื่องนั้นก็จริงค่ะ แต่คงต้องบอกว่าเวลาที่ใช้ร่วมกันนั้นต่างออกไป"
1014305-113 = "สักวันหนึ่ง ฉันเองก็คงใช้ชีวิตผ่านช่วงเวลาของตัวเอง และกลายเป็นผู้ใหญ่ในแบบที่ต้องเป็น เหมือนอย่างคุณครู..."
1014305-114 = "แต่ถึงจะเป็นแบบนั้น ฉันก็ยังรู้สึกว่าตัวเองคงไม่อาจเป็น 'ผู้ใหญ่' ได้มากเท่าคุณครูค่ะ"
1014305-115 = "คะ? นั่นอาจเป็นเพราะฉันประเมินคุณครูสูงเกินไปเหรอคะ?"
1014305-116 = "[s] \"ผู้ใหญ่น่ะนะ... มีเด็กๆ ซ่อนไว้ในใจอย่างน้อยสามคนเลยละ...\""
1014305-117 = "มะ... ไม่ใช่แค่หนึ่งหรือสอง แต่มีถึงสามคนเลยเหรอ ตัวเลขที่เจาะจงแบบนั้น ทำไมฉันถึงรู้สึกเข้าใจก็ไม่รู้นะคะ..."
1014305-118 = "คุณครูจะบอกว่าสุดท้ายแล้ว ไม่ว่าคนเราจะโตขึ้นแค่ไหน ก็ต้องมีมุมหนึ่งที่ยังเป็นเด็กอยู่งั้นเหรอคะ?"
1014305-119 = "ฮุฮุ..."
1014305-120 = "ถ้างั้น ในตัวคุณครูก็มีเด็กจอมซนซ่อนอยู่ที่ไหนสักแห่งเหมือนกันสินะคะ?"
1014305-121 = "[s5] \"พี่ชุน~ มาเล่นกันเถอะ~\"\n[s6] \"มาเล่นกันเถอะ~ พี่ชุน~\""
1014305-124 = "คะ... คุณครู?!"
1014305-125 = "..."
1014305-126 = "เอาละๆ มาทางนี้สิคะ เด็กน้อย [USERNAME] เรามาเล่นด้วยกันดีมั้ยคะ?"
1014305-127 = "[s7] \"เย้~ พี่ชุนสุดยอด~\"\n[s8] \"ว้าว~ พี่ชุนสุดยอด~\""
