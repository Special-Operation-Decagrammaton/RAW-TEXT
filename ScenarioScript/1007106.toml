[translation]
1007106-1 = "SRT, 보고합니다."
1007106-5 = "(……평소보다 이른 시간에 우연히 잠에서 깨어났다.)"
1007106-6 = "(다시 잠을 청하기에도 애매한 시간이라, 가볍게 잠을 깨울 겸 산책을 하기로 했다.)"
1007106-11 = "[ns] 옷을 챙겨 입고 숙소 밖으로 향한다."
1007106-18 = "……어라, 선생님?"
1007106-19 = "[ns] \"이 목소리는……\""
1007106-22 = "[wa:450]― [log=미야코 수영복]좋은 아침입니다.[/log]"
1007106-25 = "― [log=미야코 수영복]선생님께서도 [wa:1100]아침 산책을 나오셨나요?[/log]"
1007106-28 = "[wa:1100]― [log=미야코 수영복]저는 평소에 하던 [wa:750]조깅의 대신으로[/log]"
1007106-30 = "― [log=미야코 수영복]수영을 하러 [wa:700]나왔답니다.[/log]"
1007106-33 = "― [log=미야코 수영복]모처럼 바닷가에 왔으니 [/log]"
1007106-35 = "― [log=미야코 수영복]평소와는 [wa:500]다른 운동을 하는 것도 [wa:900]나쁘지 않겠다 싶어서요.[/log]"
1007106-38 = "[wa:1400]― [log=미야코 수영복]……이른 아침부터 [wa:670]이런 흐트러진 모습을 [wa:750]보여드려서[/log]"
1007106-40 = "― [log=미야코 수영복]조금 [wa:500]부끄럽네요.[/log]"
1007106-43 = "[wa:1800]― [log=미야코 수영복]………에취.[/log]"
1007106-46 = "― [log=미야코 수영복]조금, [wa:550]너무 오래 머물러 [wa:870]버린 것 같네요……[/log]"
1007106-48 = "― [log=미야코 수영복]몸이 [wa:380]차가워지기 시작했어요.[/log]"
1007106-51 = "[ns] \"이렇게 이른 아침부터 물에 들어가도 괜찮은 거야?\""
1007106-52 = "[wa:2100]― [log=미야코 수영복]……그렇네요.[/log]"
1007106-54 = "― [log=미야코 수영복]토끼는 [wa:470]물에 들어가면 위험하다고들 [wa:1180]하지만……[/log]"
1007106-57 = "[wa:300]― [log=미야코 수영복]저는 [wa:1250]토끼가 아니니까요.[/log]"
1007106-60 = "[ns] \"RABBIT 소대의 학생들은 모두 수영을 잘하는 편이야?\""
1007106-61 = "네, SRT 특수학원의 학생이라면 어떤 환경에서라도 작전을 수행할 수 있어야 하니까요."
1007106-62 = "완벽하지는 않아도 기본적인 영법이라면 모두 익히고 있답니다."
1007106-63 = "게다가 수영은 몸 전체의 근육을 모두 활용할 수 있는 전신운동이기도 하니……"
1007106-64 = "체력 단련을 위해서라면 이만한 훈련도 없—"
1007106-69 = "그, 그게 그러니까……"
1007106-70 = "아까도 말씀드렸듯이 수영은 체력 소모가 큰 전신 운동이니까요……"
1007106-71 = "……식전의 운동으로는 조금 과했을지도 모르겠네요."
1007106-72 = "[s] \"이 근처에 이른 아침부터 영업을 하는 가게를 보았는데……\""
1007106-76 = "[ns] \"괜찮다면 같이 아침을 먹으러 가지 않을래?\""
1007106-80 = "네, 선생님!"
1007106-82 = "(이후, 미야코와 함께 식당에 가서 이른 아침을 먹었다.)"
