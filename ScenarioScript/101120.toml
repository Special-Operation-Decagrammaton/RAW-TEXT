[translation]
101120-1 = "제12화;탈출 2"
101120-3 = "이쪽이에요!"
101120-5 = "[ns] \"아로나. 지금 당장 다른 학생들에게 연락을 취할 수 있어?\""
101120-6 = "그건 곤란해요…… 지금 통신망을 셧다운시킨 건 생텀 타워라서……."
101120-7 = "하지만 슈퍼 아로나 쨩이 생텀 타워보다 못할 건 또 없어요! 일단 해보겠습니다……!!"
101120-8 = "으으응……."
101120-9 = "끄으으응……."
101120-10 = "하아…… 하아…… 무리예요. 일단 물리적으로 거리가 가까운 곳이라면 어떻게든…… 될 것 같은데……."
101120-11 = "지금 상황으로는…… 끄으으응……."
101120-12 = "앗! 연결됐다!"
101120-13 = "1초……!! 정도라도……!! 괜찮으니……. 어떻게든……!!"
101120-17 = "……하아. 끊겨버렸어요."
101120-18 = "여기서 가장 가까운 사람들에게라면 간신히 닿았을지도 모르겠지만……."
101120-19 = "도움이 못 되어서 죄송해요, 선생님……."
101120-20 = "[s1] \"아냐, 그거면 충분해.\"\n[s2] \"고마워. 큰 도움이 되었어. 아로나.\""
101120-23 = "네? 그, 그런가요……?"
101120-31 = "으, 으아아아……!! 이, 이쪽에도……!!"
101120-32 = "어, 엄청나게 몰려왔는데……."
101120-33 = "이제 끝인가……."
101120-38 = "순순히 투항하지 않으면 지금 당장 벌집을 만들어주마!"
101120-42 = "……으응? 이건 뭐야. 웬 드론이……."
101120-43 = "드론 가동 중. 소대, 폭발에 주의하세요."
101120-45 = "크, 크으으으윽-?! 뭐, 뭐야……?!"
101120-46 = "으라차차아—!!!"
101120-56 = "이 연막은 조금 아플 거다! RABBIT 2, 현장에 도착!"
101120-57 = "RABBIT 1, 선생님과 요인들을 확보. RABBIT 3, 적 타깃의 위치를 체크해주세요."
101120-59 = "무, 뭐냐?! 네놈들?!"
101120-60 = "RABBIT 3, 수신 완료! 지금 바로 포인터로 좌표 전송할게. RABBIT 4, 적 지휘관부터 처리 부탁해!"
101120-61 = "전 부대 지금……!!"
101120-66 = "탱고 다운……. 다, 다들 괜찮아?"
101120-67 = "[s] \"RABBIT 소대!! 와주었구나!\""
101120-68 = "흥, 착각하지 마. 딱히 선생님이 도움을 요청해서 바로 달려온 게 아니거든?"
101120-69 = "맞아. 우리는 그저 식사 후에 우연히 선생님의 연락이 도착해서, 식후 산책이나 할 겸 온 거라고."
101120-70 = "그런 것 치고는 다들 엄청나게 서두르는 것 같았는데……."
101120-74 = "RABBIT 소대, 선생님의 도움 요청 연락을 받고 지금 이곳에 도착했습니다."
101120-75 = "헤에. 여기서 지원군의 등장인가. 꽤 하잖아."
101120-76 = "SRT 분들이 합류해주신다면 두려울 게 없습니다!"
101120-81 = "네놈들! 여기서 빠져나갈 수 있을 거라 생각하지 마라!"
101120-82 = "헬기까지 대동한 건가요……. 게다가 이 병력…… 선생님, 대체 무슨 일이 있었던 겁니까?"
101120-83 = "뭐, 또 평소처럼 이상한 트러블에 휘말린 거겠지."
101120-84 = "후후…… 또 뭔가 저질러 버린 거야? 엄청나게 위험한 냄새가 나는데…… 쿠히히."
101120-85 = "……그렇네요. 납득했습니다. [USERNAME] 선생님이니까."
101120-86 = "응…… 선생님이면 분명……."
101120-87 = "[s] \"어쩐지 상처 되는 반응들인데…….\""
101120-88 = "칸나 국장님."
101120-89 = "RABBIT 소대……."
101120-90 = "저번엔 신세를 졌습니다. 다시 뵐 수 있어서 다행이네요."
101120-91 = "……지금 계엄령 때문에 행정 병력은 움직일 수 없을 텐데……."
101120-92 = "그게…… 저희는 공원에서 노숙 중이어서……"
101120-93 = "어차피 정식 지휘체계도 없고……."
101120-94 = "계엄령? 그랬어? 어쩐지 일부 사이트가 회선이 접속 불가 상태더니만."
101120-95 = "모, 몰랐을 수도 있지! 아무도 우리에게 알려주지 않았잖아!"
101120-96 = "연락해주는 건 선생님뿐이고……. (훌쩍)"
101120-97 = "일단 저 병력을 뚫고 선생님과 공안국장님을 안전한 곳까지 호위합니다. RABBIT 소대, 전투 준비."
101120-98 = "오케이!"
101120-99 = "으, 으응……. 나도 준비 끝났어."
101120-100 = "하아, 하아…… 공중 화력지원 준비 완료. 이걸로 좀 더…… 좀 더 화려한 불꽃놀이를 벌일 수 있겠어!"
101120-101 = "죄송하지만 생활안전국의 발키리 여러분들도 우선은 제 지시에 따라주셨으면 합니다."
101120-102 = "네! 알겠습니다!"
101120-103 = "뭐, 저번에 신세 진 것도 있고 하니."
101120-104 = "그럼 교전, 시작합니다."
