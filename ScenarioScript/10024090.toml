[translation]
10024090-1 = "9화;사필귀정: 모든 것이 순리대로 돌아가다."
10024090-2 = "현룡문 내부"
10024090-4 = "……"
10024090-5 = "……"
10024090-10 = "자, 그렇게 된 건데 말이야."
10024090-11 = "해당 간부에 대한 처벌은 현룡문 내부의 규율에 따라 행해졌을 것이라고 믿겠습니다."
10024090-12 = "그, 그럼 다 끝난 것 아닌가? 진범이 누구인지는 밝혀졌고,"
10024090-13 = "이번 일이 현무상회와 무관하다는 것도 확실시되었으니……"
10024090-14 = "할 말은 정말 그걸로 끝인가?"
10024090-15 = "그렇다면 저희로서도 실망이라는 말씀을 드릴 수밖에 없겠군요."
10024090-16 = "[s] \"애초에 현무상회를 확증 없이 몰아붙인 게 현룡문이었고 말이지……?\""
10024090-17 = "에에이, 이건 어디까지나 개인의 일탈일 뿐이다! 현룡문 전체와는 관계없어!"
10024090-18 = "개인의 모든 행동에 집단 전체가 책임을 질 필요가 어디에 있나!"
10024090-19 = "그랬다가는 관리 비용으로 현룡문 전체의 업무가 마비되고 말 거다!"
10024090-21 = "하아…… 말이 안 통하네, 이거."
10024090-22 = "편견이 사실로 드러나는 순간에서는…… 슬픔밖에 느껴지지 않는군요."
10024090-28 = "무, 문주님 행차하십니다!"
10024090-29 = "문주님 행차하십니다!"
10024090-35 = "소란스럽기에 나와 보았더니, 예상대로구나."
10024090-40 = "무, 문주님! 이 소란은 어디까지나 저들이……!"
10024090-42 = "되었다. 이미 다 알고 왔노라."
10024090-43 = "문주님……!"
10024090-54 = "문주님께서?!"
10024090-55 = "허리를…… 굽혔다고요?"
10024090-56 = "녀석……"
10024090-60 = "현룡문은 공식적으로 사과의 뜻을 밝힌다."
10024090-61 = "확실한 증거도 없이 현무상회를 범인으로 몰아붙인 것, 그 과정에서 현무상회의 명예를 실추시킨 것."
10024090-62 = "나아가 산해경의 치안을 결과적으로 어지럽힌 것, 그리고 조직의 관리에 소홀했던 것."
10024090-63 = "나 키사키는 현룡문의 명예를 걸고, 이와 같은 일이 두 번 다시 재발하지 않을 것을 약속하노라."
10024090-64 = "이것이 현룡문의 문주인 류우게 키사키의 뜻이다."
10024090-67 = "하, 하지만 문주님……"
10024090-68 = "물러가거라."
10024090-69 = "저희는 어디까지나……"
10024090-71 = "물러가라고 말하였다."
10024090-73 = "네, 넷!"
10024090-79 = "자, 자아. 됐지? 현룡문이 공식적으로 유감의 뜻을 밝혔으니까!"
10024090-80 = "뭐야, 그 눈빛들은…… 그…… 나도 미안하다고 말했잖아……!"
10024090-81 = "아무튼 문주님은 너무 무르다니까. 수사를 하다 보면 잠깐 실수할 수도 있는 거지, 뭘 그런 일에 하나하나……"
10024090-87 = "역시 납득이 안 됩니다, 회장님!"
10024090-88 = "뭐…… 난 대충 알 것 같은데 말이야."
10024090-89 = "회장님은 그걸로 괜찮으신 겁니까?!"
10024090-90 = "괜찮지 않지만, 괜찮다는 느낌이네."
10024090-91 = "또 영문 모를 말씀을……!"
10024090-92 = "[s1] \"나도 왠지 알 것 같은데……\"\n[s2] \"있지, 있어. 괜찮지 않은데 괜찮은 그런 거……\""
10024090-95 = "자, 자. 됐어. 딱딱하고 어두운 이야기는 거기까지."
10024090-96 = "현룡문의 뜻은 알았고, 현무상회로서는 다시 손님들이 찾아오면 그것만으로 충분해."
10024090-97 = "현룡문도 뭐, 학생회로서 해야 할 일을 한 것뿐이니까."
10024090-98 = "으으음…… 알겠습니다. 여기서는 일단 회장님의 뜻을 따르기로 하겠습니다."
10024090-99 = "그렇다고 해서 제가 이 결과에 만족한 것은 아니니까요!"
10024090-100 = "그래, 그래. 맛있는 거 해 줄 테니까 화 풀어."
10024090-106 = "일이 일단락된 듯하니, 제안을 하나 하도록 하지."
10024090-107 = "[s] \"제안?\""
10024090-108 = "그러하다. 이번 일로 산해경의 분위기가 가라앉았으니,"
10024090-109 = "그것을 관리하는 것 역시 현룡문의 일이라 아니 할 수 없겠지."
10024090-110 = "하여, 정식으로 현무상회에 의뢰를 남기고 싶노라."
10024090-111 = "무, 문주님?!"
10024090-112 = "야단을 삼가거라, 미나. 현무상회도 산해경이다."
10024090-113 = "그렇……지요. 알겠습니다. 문주님."
10024090-114 = "그래서, 의뢰라는 게 뭐야? 뭐든 받아들여 주지."
10024090-115 = "자신이 넘치는 것처럼 보이는구나. 아직 내용을 꺼내지도 않았거늘."
10024090-116 = "현무상회가 받아들이지 못하는 의뢰는 없어. 불가능한 것은 빼고 말이지."
10024090-117 = "그 발언, 믿어도 되겠느냐?"
10024090-118 = "보수만 충분하다면야. 현무상회를 우습게 보지 말라고."
10024090-119 = "좋다. 그렇다면 지금부터 열 수 있는 가장 큰 연회를 준비하거라."
10024090-120 = "산해경 전원과…… 그렇구나. 선생까지 참여할 수 있을 정도의 연회를."
10024090-121 = "[s] \"나?\""
10024090-123 = "그러하다. 그대 역시 이번 사건의 해결에 공을 세우지 않았는가."
10024090-124 = "이 기회에 산해경의 접대가 어떤 것인지, 몸으로 체험해 보는 것도 좋겠지."
10024090-125 = "산해경 전원에, 선생님까지 참여하는 연회라고……?"
10024090-127 = "비용은 걱정 말거라. 현룡문 측에서 전부 부담할 테니."
10024090-128 = "아, 내가 너무 무리한 의뢰를 한 것인가?"
10024090-129 = "그럴 리가. 재미있겠는데?"
10024090-130 = "간만에 상회원들 전원을 대기시켜야겠어!"
10024090-132 = "충분하겠느냐?"
10024090-133 = "충분하다마다. 우리 상회원들은 상인이기 이전에 모두가 한 명의 요리사들이라고."
