[translation]
10051030-1 = "제3화;재능과의 조우"
10051030-2 = "음양부 부실"
10051030-3 = "……라는 일이 어제 있으셨다고요?"
10051030-4 = "어…… 어쩌다 보니 그렇게 됐어……."
10051030-5 = "뭐, 찢어진 드레스는 잘 수선해서 돌려주셨으니 문제는 없는데……."
10051030-6 = "그런데…… 음양부에는 이것보다 더 큰 드레스가 없어요."
10051030-7 = "에엣?!"
10051030-8 = "[s] \"혹시 근처 옷 가게에서 구매할 수는 없을까?\""
10051030-9 = "안 그래도 근처 의상실들에 연락을 해봤습니다만……."
10051030-10 = "……츠쿠요 씨 정도 사이즈의 드레스는 따로 주문 제작을 해야 한다고 하더라고요."
10051030-11 = "그럼 일단 지금이라도 주문을……!"
10051030-12 = "……행사장 집결 시작이 한 시간 뒤인 건 기억하고 계시죠?"
10051030-13 = "헛……!"
10051030-14 = "뭐 어쩔 수 없지요."
10051030-15 = "이렇게 된 이상, 방법은 하나뿐이네요."
10051030-16 = "방법이 있어?"
10051030-17 = "물론이죠."
10051030-18 = "다만…… 조금은 가슴 아플지도 모를 방법이긴 하지만……."
10051030-19 = "응……?"
10051030-21 = "(한 시간 뒤.)"
10051030-22 = "(드디어, 인법연구부의 경호 임무가 시작됐다.)"
10051030-24 = "패션쇼 연회장 내부"
10051030-26 = "와, 진짜 사람 많네. 정신이 하나도 없어……."
10051030-27 = "자 자, 정신 차리자 미치룻치! 그래도 할 일은 해야지!"
10051030-28 = "자, 아아, 언더커버02? 무전 잘 들리나?"
10051030-32 = "넵! 언더커버02 여기! 잘 들립니다 부장!"
10051030-33 = "현재 위치는?"
10051030-34 = "지시받은 대로 연회장 동편에서 대기 중입니다!"
10051030-35 = "좋아, 수고해 줘."
10051030-39 = "자, 그럼 이즈나의 위치는 확인됐고……."
10051030-40 = "……그럼 언더커버03, 무전 잘 들리나?"
10051030-42 = "패션쇼 연회장 정문"
10051030-44 = "예, 언더커버03, 여기, 잘 들려요오오……."
10051030-45 = "언더커버03, 행사장 정문에 위치 했습니다아아……."
10051030-46 = "미, 미안해 츠쿠요……."
10051030-47 = "혼자만 행사장 외부 경비로 보내서……."
10051030-48 = "주최 측 녀석들, 끝까지 드레스를 입지 않으면 절대로 연회장 내부로 들어올 수 없다고 해서……."
10051030-49 = "부, 부장님이 미안해하실 것 없어요!"
10051030-50 = "제가 쓸데없이 몸이 커서 드레스를 못 입은 탓이니까요……."
10051030-51 = "오, 오히려 평소 입던 옷을 입으니까 마음이 더 편한 것 같기도 하고요!"
10051030-52 = "고마워 츠쿠요, 이해해 줘서……."
10051030-53 = "좋아! 오늘 임무만 잘 마치면, 다 같이 라멘이나 먹으러 가자!"
10051030-54 = "저번에 못 찍었던 영상을 다시 찍는 거야!"
10051030-55 = "좋, 좋아요, 부장님!"
10051030-56 = "면은 극태면으로, 거기에 돼지비계를 추가하고, 그리고 마무리는 고추기름으로……."
10051030-57 = "앗?!"
10051030-58 = "무슨 일이야?!"
10051030-59 = "부장님! 샤, 샤인캣 디자이너가 도착했어요!"
10051030-67 = "좋아, VIP 도착했다! 다들 위치로!"
10051030-68 = "……이렇게 하는 거 맞지?"
10051030-72 = "(침착해요, 침착해요……!)"
10051030-73 = "(그냥 수상한 사람이 있는지만 잘 살펴보면 되는 거예요……!)"
10051030-79 = "어이, 거기."
10051030-80 = "네, 네엣?!"
10051030-81 = "자네 지금 여기서 뭐 하는 거야?"
10051030-82 = "네에……?! 저, 저는 겨, 경비를……."
10051030-83 = "패션쇼 시작까지 시간이 얼마 남지도 않았는데, 모델이 왜 행사장 바깥에서 서성이고 있는 거지?!"
10051030-84 = "네에?!"
10051030-85 = "뭘 놀라고 그래? 후딱 대기실로 뛰어 들어가지 못해!"
10051030-86 = "저, 저, 저……!"
10051030-88 = "저는 모델이 아닌데요!"
10051030-93 = "어? 자네, 오늘 패션쇼에 참가하는 모델이 아니었나?"
10051030-94 = "누가 봐도 모델인데……."
10051030-95 = "에에…… 저는 그냥 경비인데요오오……."
10051030-96 = "허어, 거 참."
10051030-97 = "이거 내가 오해를 했군. 미안하네."
10051030-98 = "그런데 말이야…… 흐으음……."
10051030-105 = "아깝군, 아까워."
10051030-106 = "그런 몸을, 그런 재능을 타고났는데 고작 경비나 서고 있다니……."
10051030-107 = "네……?"
10051030-108 = "아, 아닐세. 신경 쓰지 말게."
10051030-109 = "그저 안타까움에 절로 흘러나온 넋두리였으니."
10051030-110 = "재능을 타고났다고 해서 반드시 그 길로 가야 한다는 법은 없으니 말이야."
10051030-111 = "그래도 말이지…… 흐음……."
10051030-112 = "……?"
10051030-113 = "역시 그냥 지나치기에는 아깝단 말이야."
10051030-114 = "그러니 자네, 이름을 알려주겠나?"
10051030-115 = "네?!"
10051030-116 = "오, 오노 츠쿠요인데요……."
10051030-117 = "인법연구부 소속이고, 나이는……."
10051030-118 = "됐어, 어디 소속인지는 궁금하지도 않아."
10051030-119 = "오노 츠쿠요라…… 좋아, 기억해 두도록 하지."
10051030-120 = "그러니 자네도 나를 기억해 두도록 해."
10051030-121 = "자."
10051030-122 = "며, 명함……!"
10051030-123 = "그럼 난 바빠서 이만."
10051030-127 = "(바, 방금 무슨 일이 일어났던 거죠?!)"
10051030-128 = "(저런 분이 왜 내 이름을……? 거기다 명함까지 주시고……?)"
10051030-129 = "(대체 무슨 생각이신 거죠?)"
10051030-130 = "(후으으…….)"
10051030-131 = "(아냐 아냐, 신경 쓰지 말아요.)"
10051030-132 = "(저는 제가 맡은 임무만 잘하면 되는 거니까요……!)"
10051030-133 = "자, 츠쿠요의 외부 경비 작전, 시작합니다!"
10051030-135 = "패션쇼 대기실"
10051030-136 = "좋아, 준비들은 잘 되고 있나?"
10051030-137 = "물론입니다, 샤인캣 님!"
10051030-138 = "내가 미리 보내둔 옷들도 잘 보관되어 있겠지?"
10051030-139 = "그 옷들, 세상에 딱 한 벌밖에 없는 것들이야. 여벌 따위 만들지도 않았다고."
10051030-140 = "예! 안 그래도 저 안쪽 방에 잘 걸어 두었습니다!"
10051030-141 = "직사광선도 들지 않고, 제습과 탈취 상태도 완벽한 방이고요!"
10051030-142 = "한번 직접 확인해 보시겠습니까?"
10051030-143 = "그러도록 하지."
10051030-144 = "슬슬 모델들도 옷을 착용해야 할 시간이니 말이야."
10051030-145 = "그래서, 내 옷이 보관된 방이 어디라고?"
10051030-146 = "제가 안내해 드리겠습니다."
10051030-147 = "이쪽으로 오시죠!"
10051030-151 = "자, 이곳이 바로…… 엣."
10051030-152 = "어…… 왜…… 자물쇠가 풀려 있지?"
10051030-153 = "무슨 일이지?"
10051030-154 = "아, 아무것도 아닙니다!"
10051030-155 = "그, 옷들은 분명 이 방 안에 걸어 두었는데……."
10051030-159 = "흐, 흐에엑……!"
10051030-160 = "뭔가? 무슨 일이야?"
10051030-161 = "이, 이, 이럴 리가 없어……!"
10051030-162 = "샤, 샤, 샤인캣 님……."
10051030-163 = "죄, 죄, 죄, 죄송합니다……!"
10051030-164 = "아니, 이게 아니지, 그게 크, 큰일 났습니다!"
10051030-165 = "뭐야? 말을 하려면 제대로 해!"
10051030-166 = "그, 그게……."
10051030-167 = "샤, 샤인캣 님의 작품들이…… 전부 다……!"
10051030-168 = "아니야, 이건 꾸……꿈일 거야……!"
10051030-169 = "대체 뭐라고 중얼거리는 거야? 비켜!"
10051030-173 = "내, 내 작품들이……!"
10051030-174 = "나의 옷들이 사라졌다고……?!"
10051030-175 = "죄, 죄송합니다, 분명 조금 전까지만 해도 있었는데……!"
10051030-176 = "이…… 이잇……!"
10051030-178 = "다, 당장 잡아서 이리로 끌고 와!!"
10051030-179 = "예?!"
10051030-180 = "말귀 못 알아들어?! 내 옷들 훔쳐 간 놈! 당장 내 앞으로 끌고 오라고!!"
10051030-181 = "그 도둑놈 잡지 못하면 네 녀석들 전부 다 해고야! 알겠어?!"
10051030-182 = "히, 히익! 알겠습니다!!"
