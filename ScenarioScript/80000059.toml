[translation]
80000059-1 = "가장 귀한 한정판"
80000059-2 = "……."
80000059-6 = "(벌써 15분째 말이 없다…….)"
80000059-7 = "[s1] \"저기……. 역시 발렌타인 때문이지?\"\n[s2] \"……일단 초콜릿 때문에 부른 거지?\""
80000059-8 = "……!!"
80000059-9 = "……!!"
80000059-10 = "캬, 캬악……! 말했어, 말해버렸어! 결국 말해버렸어, 이 선생님!!"
80000059-11 = "그래, 맞아! 맞다고! 어차피 선생님도 예상하고 있었잖아!? 맞긴 맞는데 말이야!"
80000059-12 = "그, 그게……! 조, 조금만 더 기다려 보라고! 일단 지금 한창 고민 중이니까 말이야!"
80000059-13 = "……응? 무슨 고민이냐고?"
80000059-14 = "뭘 태연하게 물어보고 있는 거야!? 말할 수 있을 리가 없잖아! 말할 수 있는 거라면 처음부터 말했겠지!"
80000059-15 = "그치만……."
80000059-19 = "하아……."
80000059-20 = "……모르겠다. 어차피 이렇게 앉아서 더 고민하고 있다고 답이 나올 거 같지도 않고."
80000059-21 = "차라리 그냥 꺼내 버리고, 빨리 비웃음당한 다음에 치우는 편이 낫겠어."
80000059-30 = "……뭐라고 말이라도 해."
80000059-31 = "하!! 역시 그 표정! 알아! 나도 안다고! 지금 '이게 뭐야'라고 생각했지!?"
80000059-32 = "어쩔 수 없잖아! 노리고 있던 한정판들은 죄다 동나버렸는걸! 거의 밤새듯이 기다렸는데도 말이야!"
80000059-33 = "인터넷 주문 이벤트도 선착순이라 페이지 켜자마자 대기열이 3천이 넘게 떠 있더라! 당연히 실패했지!"
80000059-34 = "그렇다고 그냥 통상으로 팔고 있는 거 사서 주자니 뭔가 좀 그래서……."
80000059-35 = "그래도 수제면 그것보다는 낫지 않을까? 하면서 만들었는데 꼴이 이렇게 돼 버린 거라고!"
80000059-36 = "아주 미안하게 됐수다, 손재주가 없어서! 남들은 예쁘고 귀여운 건 잘만 만드는데 내 건 이런 식이라서!"
80000059-37 = "……크흡……. 역시 티켓팅에 성공했어야 했는데……. 망할……."
80000059-42 = "……선생님?"
80000059-43 = "뭐, 뭐 하는 거야? 뭘 그리 성큼성큼 주워 먹는 거야……?"
80000059-44 = "[s3] \"완전 맛있다 이거.\"\n[s4] \"맛만 좋은데 뭘 그리 속상해?\""
80000059-45 = "그, 그래……? 진짜야? 진짜 괜찮은 거 맞아?"
80000059-46 = "그, 그래……? 진짜야? 진짜 괜찮은 거 맞아?"
80000059-47 = "맨날 좋다 좋다 하니까 진짜 좋은 건지 립 서비스인지 구분이 안 가네……."
80000059-48 = "뭐, 그래도 잘 먹는 거 같아 좀 안심했어. 그래도 한정판만큼 맛있는 건 아니겠지만……."
80000059-49 = "[s5] \"무슨 소리야? 이게 진짜 한정판이지.\"\n[s6] \"요시미 특제, 하나뿐인 발렌타인 한정판.\""
80000059-50 = "……!! 윽……! 또, 또! 또 그런 소리!"
80000059-51 = "……!! 윽……! 또, 또! 또 그런 소리!"
80000059-52 = "아주 그런 능청맞은 말을 아예 금지하든지 해야지, 이 능구렁이 선생님……!!"
80000059-53 = "진짜 짜증 나……. 맨날 이렇게 똑같은 패턴……."
80000059-55 = "똑같이 맨날 히죽거리는……. 나도……."
