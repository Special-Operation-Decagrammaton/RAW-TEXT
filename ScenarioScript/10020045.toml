[translation]
10020045-5 = "해냈어!!"
10020045-6 = "차원엔진 4개를 모두 다 파괴했어!"
10020045-12 = "<아트라하시스의 방주>의 모든 구역 해킹 완료. 점유율 100% 달성 확인."
10020045-13 = "응 이제부터 방주의 <자폭 시퀀스>를 기동할 수 있어."
10020045-17 = "모두들, 준비되면 말해줘!"
10020045-18 = "자폭 시퀀스는 한번 기동하면 취소할 수 없어. 모두들 지금 당장 우트나피쉬팀의 배로 돌아가!"
10020045-28 = "네! 저희도 통제실 파괴, 완료했어요!"
10020045-29 = "시로코 쨩은?"
10020045-30 = "시로코 선배가 갇혀있는 섹터는…… 선생님이 가 계세요!"
10020045-34 = "[ns] 시로코가 갇혀 있는 문을 연다."
10020045-37 = "……선생님."
10020045-38 = "[s] \"시로코……. 괜찮은 거지?\""
10020045-39 = "응. 할 말이 많지만…… 지금은 일단 움직여야겠네."
10020045-40 = "[s] \"그래. 움직이자. 자세한 이야기는 나중에.\""
10020045-41 = "시로코 선배?! 괜찮아요?"
10020045-42 = "괜찮아. 이대로 선생님을 에스코트해서 갈게."
10020045-43 = "네, 네……! 그러니까……. 우트나피쉬팀이 있는 1구역으로 오시면 돼요!! 제가 길을 알려드릴게요!"
10020045-44 = "응, 부탁해."
10020045-45 = "가자, 선생님."
10020045-46 = "[ns] \"그래.\""
