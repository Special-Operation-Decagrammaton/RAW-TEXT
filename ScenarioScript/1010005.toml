[translation]
1010005-1 = "복면 라이더"
1010005-3 = "(시로코와 만나기로 한 장소에서 기다리고 있는 중…….)"
1010005-9 = "비켜, 비켜어어-!!"
1010005-12 = "[ns1] \"우와, 트럭이?!\"\n[ns2] 얼른 안전한 곳으로 피한다."
1010005-19 = "저, 저 트럭을 잡아주세요!! 강도야! 트럭 탈취야!!"
1010005-20 = "트럭 안에 요즘 엄청 가격이 올라가고 있는 양배추가!!"
1010005-21 = "[s3] (요즘 아비도스의 치안이 점점 더 낮아지는 느낌이……)\n[s4] (아니, 그것보다 지금은…….)"
1010005-27 = "선생님, 잠깐 비켜줘."
1010005-34 = "자, 자전거를 탄 괴인이?!"
1010005-35 = "저건…… 복면 라이더다!!"
1010005-37 = "으, 으아아아앗-!?"
1010005-38 = "자전거로 트럭을 추월했다고?!"
1010005-52 = "[ns] \"……………………….\""
1010005-55 = "[ns] \"……….\""
1010005-60 = "고맙습니다, 복면 라이더!"
1010005-61 = "난 처음 만나봤어! 전설 속의 존재인 줄 알았는데!"
1010005-66 = "선생님, 자리를 옮길까……."
1010005-67 = "[s] \"그래…….\""
1010005-74 = "응. 이쯤이면 괜찮을 거 같아."
1010005-75 = "[s5] \"아니, 전혀 괜찮지 않은데요?\"\n[s6] \"엄청 눈에 띄고 있거든요?\""
1010005-81 = "으음……."
1010005-82 = "[ns] \"복면 라이더입니까…….\""
1010005-83 = "으응…… 이상한 소문이 날지도 몰라서 얼굴을 가렸는데……"
1010005-84 = "[s] \"오히려 더 엄청난 소문이 생기고 있는 거 같은데요…….\""
1010005-85 = "응. 역효과였던 것 같아……."
1010005-86 = "[s] \"그런데 새 자전거가 그거야?\""
1010005-87 = "응. 블랙 에디션이야. 그치만 아직은 개조가 덜 끝난 미완성품이라…… 라이딩 슈트도 아직 준비가 안 됐고……."
1010005-88 = "그래서 나중에 제대로 준비가 끝나면 보여 줄게."
1010005-89 = "[s] \"그런데 고민이라는 건 뭐야?\""
1010005-90 = "응."
1010005-91 = "대책위원회에서 나에게 <아비도스 학생회>의 이름을 이어받아 줬으면 좋겠다고 요청해 와서……."
1010005-92 = "비록 이름뿐이라고 해도 이 학생회의 이름이 어떤 의미인지 잘 알고 있어서…… 어떻게 답해야 할까 고민이 되어서……."
1010005-93 = "[s] \"흐으음…….\""
1010005-94 = "어떻게 답하는 게 좋을까. 선생님……?"
1010005-95 = "[s7] \"수영복 복면단과…….\"\n[s8] \"복면 라이더라…….\""
1010005-100 = "[ns9] \"어느 쪽이든 미래는 없군.\"\n[ns10] \"아비도스의 미래는 괜찮은 건가…….\""
1010005-103 = "[ns] \"이건 내가 결정할 수 있는 문제는 아닌 것 같아.\""
1010005-104 = "응……."
1010005-105 = "[ns] \"하지만 분명한 건, 모두 너를 걱정해 주고 있다는 거네.\""
1010005-109 = "……."
1010005-110 = "응…… 알고 있어."
1010005-111 = "역시 그렇다면 이건 받아들이는 수밖엔 없겠지?"
1010005-112 = "바로 메시지를 보내둘게."
1010005-117 = "음……."
1010005-118 = "[ns] \"뭐라고 보냈어?\""
1010005-119 = "응…… 그건 비밀. 나중에 알려줄게."
1010005-120 = "[s] \"비밀인 건가……!\""
1010005-125 = "빠르네."
1010005-130 = "[ns] \"뭐라고 왔어?\""
1010005-137 = "\"응. 도전을 받아줄게. 덤벼, 복면 라이더. <수영복 복면단이>\""
1010005-141 = "[ns] \"……누가 보냈는지 알 것 같은데.\""
1010005-142 = "……응."
1010005-143 = "그러게."
