[translation]
10012050-1 = "제5화;초대받지 않은 손님"
10012050-4 = "……도착했어요."
10012050-5 = "여기가 리조트 전기실……. 전기, 가스를 비롯한 모든 동력원이 모여 있는 곳이군요."
10012050-7 = "청소 끝내고 먹을 거 좀 구했더니, 이제는 이런 전기실 한가운데로 들어오다니……."
10012050-8 = "이야-. 정말이지 멋진 여름 휴양이네-. 그치, 세리카 쨩?"
10012050-9 = "멋지긴 뭐가 멋져!! 계속되는 노동의 연장선이잖아!!"
10012050-11 = "그치만 이게 가장 빠르고 확실한 방법이야, 세리카 쨩."
10012050-12 = "우리의 안전을 위해서도, 앞으로의 '휴양'을 위해서도……."
10012050-13 = "……음. 설비는 문제없어."
10012050-14 = "낡고 방치된 거긴 하지만 파손된 곳은 없어. 먼지가 조금 쌓였을 뿐이야."
10012050-15 = "그리고 도면을 보면……."
10012050-16 = "시설 격납고 겸 창고도 있어."
10012050-17 = "……! 격납고라면……?"
10012050-19 = "아야네 쨩이 계속 신경 쓰고 있는 헬기의 부품들도 찾아볼 수 있을지 모른다-그런 말이지."
10012050-20 = "잘 됐네요, 잘 됐어~☆"
10012050-21 = "그치만 격납고 철문은 수동으로 열 수 없어. 제어실에서 전기를 살리는 게 먼저야."
10012050-23 = "……건물 청소부터 시작해서 뭔가 점점 시공업자가 돼 가는 느낌인데."
10012050-24 = "자, 자. 원래 여름 휴양이라는 건 그런 준비과정까지도 즐기는 것에 포함되는 법이니까."
10012050-25 = "하나하나 신경 쓸수록 본인들만 손해라고."
10012050-26 = "그럼 슬슬 출발해 볼까?"
10012050-29 = "……아무도 없는 거 같죠?"
10012050-30 = "누가 있는 게 이상하지. 버려진 지가 언제인지도 모르는 곳인데……."
10012050-31 = "모르지. 또 예의 그 친구들이 기다리고 있었을지……."
10012050-33 = "확실히……."
10012050-34 = "아니. 먼저 장악하고 있다면 구태여 감시 시스템 등을 이용하지 않을 이유가 없어."
10012050-35 = "여긴 우리가 처음 온 것 같아. 먼지들도 오래된 상태야."
10012050-36 = "이거 진짜 켜지긴 하는 거야? 완전히 죽은 건 아니겠지?"
10012050-44 = "……된다."
10012050-45 = "뭐야, 진짜 되네? 그냥 이렇게 버튼을 누르면 켜지는 거라고?"
10012050-46 = "세리카 쨩~. 컴퓨터는 버튼을 누르면 켜지는 거란다~."
10012050-47 = "누, 누가 그걸 몰라!? 그런 의미로 한 말이 아니잖아!?"
10012050-48 = "그치만 저도 꽤 놀랐어요. 분명 몇 군데는 더 손을 보고 켜 봐야 작동할 줄 알았는데……."
10012050-49 = "상태가 양호했다고는 해도 설마 이 정도일 줄은……."
10012050-50 = "……응? 이건 뭐죠?"
10012050-54 = "<리조트 방어 시스템>……?"
10012050-56 = "우와~! 리조트 방어 시스템이 있군요!"
10012050-57 = "알아서 지켜준다는 거야? 오~. 여기도 꽤 하잖아?"
10012050-58 = "잘 됐네! 이걸로 그 녀석들도 쉽사리 다가오지 못할 거고."
10012050-59 = "뭘 고민하고 있어, 아야네? 바로 눌러버려!"
10012050-61 = "그, 그럴까요? 하긴. 나쁠 건 없어 보이니……."
10012050-66 = "……켜졌나요?"
10012050-68 = "오, 오오. 뭔가 돌아가는 것 같은데?"
10012050-69 = "모니터에 CCTV들 화면이 출력되기 시작했어요. 리조트 전경이 한눈에 들어오네요!"
10012050-70 = "이걸로 한숨 놓은 건가~."
10012050-75 = "<System Message>"
10012050-77 = "리조트 경비 시스템."
10012050-79 = "리조트 경비 시스템. 활성화."
10012050-81 = "자체 감시. 모드로 들어갑니다."
10012050-84 = "<System Message>"
10012050-86 = "스캐닝"
10012050-88 = "스캐닝…"
10012050-90 = "스캐닝……."
10012050-92 = "리조트 전체를 검색하고 있나 봐요."
10012050-93 = "굉장해……. 대기업에서나 사용할 만큼 최첨단인 방어 시스템이에요."
10012050-94 = "말하자면 카이저 쪽 같은……?"
10012050-95 = "……아뇨. 어쩌면 그 이상으로 고급 관리 시스템일지도……."
10012050-97 = "<System Message>"
10012050-98 = "……스캐닝을 종료합니다."
10012050-101 = "<System Message>"
10012050-102 = "리조트 내. 허가받지 않은 인원."
10012050-104 = "다수."
10012050-106 = "가."
10012050-108 = "가. 발견."
10012050-110 = "가. 발견. 되었습니다."
10012050-112 = "오오. 벌써 찾아냈다니. 대단한 걸~."
10012050-113 = "……응? 뭘 찾아냈다고? '허가받지 않은 인원'……?"
10012050-114 = "어라……."
10012050-116 = "<System Message>"
10012050-117 = "체포를 위해. 자율 방범기를."
10012050-119 = "투입합니다."
10012050-122 = "……잠깐만요!"
10012050-123 = "잠들어 있던 경비 로봇들이 움직이기 시작했어요! ……엄청난 숫자입니다!"
10012050-125 = "뭐, 뭐야? 쟤네 뭔가 방향이 좀 이상하지 않아? 이건 마치……."
10012050-126 = "확실히……. 이쪽으로 오고 있는 거 같……죠?"
10012050-127 = "……아. 그런 건가."
10012050-128 = "[s1] \"……역시 그렇게 되는 흐름이군.\"\n[s2] \"뭐, 우리도 딱히 허가받진 않았으니까.\""
10012050-129 = "무, 무슨 소리야!? 말도 안 돼! 이런 게 어디 있어? 우린 제대로 허가받았잖아!? 티켓도 있다고!!"
10012050-130 = "무, 무슨 소리야!? 말도 안 돼! 이런 게 어디 있어? 우린 제대로 허가받았잖아!? 티켓도 있다고!!"
10012050-131 = "그렇다고 해서 뭔가 인증 절차를 거치거나 시스템에 신원을 등록한 건 아니니까……."
10012050-132 = "설령 신원이 있다 해도 여긴 시스템실이라구, 세리카 쨩. 숙박객이 올 곳은 아니잖아?"
10012050-134 = "…… 보이기 시작했어. 수십,"
10012050-135 = "아니 수백 기 이상."
10012050-137 = "으, 으아아!? 어떻게 해!? 어떻게 하냐고 이제!!"
10012050-138 = "지, 진정해. 세리카 쨩! 여긴 시스템 제어실이야. 신원이야 등록하면 되니까!!"
10012050-139 = "문제는 아야네가 등록하는 동안 저 녀석들로부터 여길 잘 지켜내냐~라는 거지."
10012050-140 = "아~!! 진짜 여기 와서 별의별 짓을 다 해 보네!!"
10012050-142 = "……선생님?"
10012050-143 = "[s3] \"응. 같이 막아보자.\"\n[s4] \"지휘는 맡겨줘.\""
10012050-148 = "……온다."
