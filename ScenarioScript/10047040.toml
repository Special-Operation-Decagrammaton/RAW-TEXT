[translation]
10047040-1 = "제4화;목소리의 주인은……"
10047040-4 = "(한참을 달려 도착한 학원의 중심가.)"
10047040-5 = "[ns] \"후우…… 꽤 뛰었네…….\""
10047040-6 = "네. 여기라면 안전한 것 같네요."
10047040-7 = "뉴후후. <험한 것>도, 우릴 놓쳤을 테죠."
10047040-8 = "아, 진짜! 자꾸 그런 식으로 말하면 선생님이 오해하잖아!"
10047040-9 = "[ns1] \"그러고 보니…… 미술관에서 내가 봤던 건 대체 뭐였어?\"\n[ns2] \"어떻게 악마상이 혼자서 움직인 거야?\""
10047040-12 = "그건 바로 심령 현상…… 폴터가이스트."
10047040-13 = "히히…… 조심해……#n악마상의 주인은…… 선생님을 기억했어."
10047040-14 = "무슨 폴터가이스트야! 소리 때문에 전시대가 진동해서 악마상이 움직인 거잖아!"
10047040-15 = "[s] \"어? 그런 거였어?\""
10047040-16 = "후후…… 어떻게 생각하실지는 맡겨둘게요."
10047040-20 = "저 뻔뻔한 얼굴을 보라고! 이건 사기야, 사기!"
10047040-21 = "악마니 마법이니 하는 건 이 세상에 없다구!"
10047040-22 = "[s] \"레나는 정말로 오컬트를 믿지 않는 모양이네.\""
10047040-26 = "하아…… 하지만 오컬트를 맹신하는 선배들과 같이 지내야 하는 불쌍한 신세지."
10047040-27 = "내가 정말 어쩌다가 이런 괴짜들을 만나서……."
10047040-28 = "[s] \"어떻게 만나게 됐는데?\""
10047040-29 = "기숙사 방 번호가 404호가 되어버린 것뿐이야.#n정말 그뿐."
10047040-30 = "우리 같은 일반 학생에겐 선택권이 없어. 전부 평의회의 결정에 따라야 해."
10047040-34 = "아, 평의회라는 건―"
10047040-36 = "정식 명칭은 <예술 평의회>."
10047040-37 = "엄격한 기준으로 작품의 예술적 가치를 판단하고 분류하는 조직이야. 다른 학원의 학생회 느낌이랄까."
10047040-38 = "검문소에 있던 <사감대>도 평의회의 지휘하에 있어.#n그러니까, 압도적인 권력을 가진 거지."
10047040-40 = "그런 녀석들이 기숙사 방을 정하고 있는 거야.#n<룸메이트가 싫으니까 바꿔주세요>같은 건 말할 수 없다고."
10047040-41 = "이런 상황에서 내가 할 수 있는 건 한 가지뿐이야."
10047040-42 = "정상이 아닌 룸메들을 정상으로 만드는 거지.#n그래야 내 생활도 정상이 될 테니까!"
10047040-43 = "[s] \"아하, 레나는 친구를 잘 챙기는 성격이구나!\""
10047040-47 = "왜 그렇게 되는 거야?!"
10047040-48 = "두고 보라구! 오컬트에 빠진 모두의 눈을 뜨게 해줄 테니까!"
10047040-49 = "그 패기…… 마음에 들어……."
10047040-50 = "레나 쨩 같은 아이에게 오컬트를 전도하는 것이 나의 기쁨……."
10047040-51 = "흥, 누가 속을 줄 알고? 나한테 사기는 안 통해!"
10047040-52 = "히히…… 좋아…… 바로 그 자세야……."
10047040-58 = "자, 그럼 바로 다음 장소로 이동하죠. 아르카나의 인도에 따라 우리가 향할 곳은……."
10047040-63 = "오호, 이 장소는?"
10047040-68 = "거기로 가라는 거네……."
10047040-69 = "다들 날 따라와. 히히……."
10047040-71 = "와일드헌트 예술의 거리"
10047040-73 = "이곳은, <예술>의 메인스트리트……."
10047040-74 = "와일드헌트에서 가장 오래된 조각들이 전시된 공간이야……."
10047040-75 = "모두 전설이라 불리는…… 예술가들의 작품이지……."
10047040-76 = "네!#n특히 저 분수는, 거장 '레오파르드・더・핀치'의 작품으로, 와일드헌트와 비슷할 정도의 역사가 있어요!"
10047040-77 = "[s] \"오…… 저건 나도 카탈로그 같은 곳에서 본 적이 있어.\""
10047040-78 = "뉴후후후.#n전설이 숨 쉬는 곳이니…… 당연히 오컬트에 관한 이야기도 있답니다!"
10047040-79 = "없어도 된다고……!"
10047040-83 = "[ns] \"여기에는 어떤 이야기가 있어?\""
10047040-84 = "먼 옛날, 일부 부도덕한 예술가들이 작품에 생명을 더하고자 금기를 저질렀어요."
10047040-85 = "바로……생명이 있는 자를, 석상에 묻어 넣은 거예요……!"
10047040-86 = "그 석상 중 일부가 이 거리에 숨어있죠. 그래서…… 가끔씩 원혼들의 속삭임이 들려온다고 해요."
10047040-87 = "무슨 소리야! 석상은 대리석을 깎아서 만든다고! 뭘 넣는 건 불가능해!"
10047040-88 = "그러면, 누군가를 시멘트로 굳혀 만든 걸까요?"
10047040-89 = "그런 걸 누가 한다고!"
10047040-90 = "그럼 원혼들의 속삭임은요?"
10047040-91 = "시험을 망친 누군가가 몰래 숨어서 우는 소리였겠지!"
10047040-92 = "히히…… 그러면 직접 확인해 보자고……."
10047040-93 = "이게 단순한 괴담인지……"
10047040-97 = "진짜, 원령이 있는지."
10047040-102 = "그럼 석상 주변에서 정말로 소리가 나는지 각자 확인해 보죠."
10047040-103 = "10분 후에 여기서 다시 만나는 거예요."
10047040-104 = "좋습니다! 그러면 바로 출발하죠!!"
10047040-111 = "흐, 흥! 누가 겁먹을 줄 알고?"
10047040-115 = "……뭐야? 선생님은 왜 안 가고 여기에 있어?"
10047040-116 = "[s3] \"사실은 나도 겁이 나서…….\"\n[s4] \"여기 지리는 잘 모르기도 하고.\""
10047040-119 = "흥, 겁쟁이."
10047040-120 = "조, 좋아. 그럼 나랑 같이 다니자."
10047040-121 = "어떤 일이 있어도 놀라지 마. 전부 다 사기니까. 알겠지?"
10047040-122 = "[s] \"레나도 내 옆에 꼭 붙어 있어.\""
10047040-123 = "어, 어린애 취급하지 마! 난 정말로 겁 안 나니까!"
10047040-125 = "(그렇게 레나와 함께 석상 근처를 둘러보기 시작했다.)"
10047040-132 = "흥, 바람 소리뿐이잖아? 뭐가 원혼들의 속삭임이라는……"
10047040-134 = "[log=???][ff4444]꺼내 줘…… 여기서…… 나가고 싶어…….[-][/log]"
10047040-138 = "뭐, 뭐야? 방금 선생님이 낸 소리야?"
10047040-139 = "[s] \"히익! 나도 몰라!\""
10047040-140 = "분명 소리가 났다구! 그것도 뭔가 이상한 목소리가……!!"
10047040-141 = "[ns] \"무, 무슨 일이 일어나는 거야……?!\""
10047040-143 = "[log=???][ff4444]저주할 테다……[-][/log]"
10047040-144 = "[log=???][ff4444]날 이렇게 만든 녀석들…… 저주할 테다…….[-][/log]"
10047040-147 = "히, 히이익?!"
10047040-148 = "카, 카노에 선배! 선배 맞지?! 선배 말고 이런 장난칠 사람 없어……!!"
10047040-158 = "……히히. 들켰네."
10047040-159 = "아 진짜! 내가 그럴 줄 알았다니까!"
10047040-161 = "[log=???][ff4444]꺼내 줘…… 제발…… 꺼내 줘…….[-][/log]"
10047040-164 = "……어라? 이건 내가 아닌데?"
10047040-166 = "히이익?!"
10047040-167 = "하, 하지만 분명 선배가 있는 방향에서 소리가 들렸는데……!"
10047040-168 = "난 입도 뻥긋 안 했어……."
10047040-170 = "[log=???][ff4444]맞아…… 쟤는 아니야…….[-][/log]"
10047040-173 = "누, 누구야! 누가 장난치는 거야?!"
10047040-175 = "[log=???][ff4444]못 찾겠지? 메롱…… 메로오옹…….[-][/log]"
10047040-178 = "샤아아악! 누굴 놀리고 있어!!"
10047040-183 = "여긴가? 으으, 여기도 아니고……!"
10047040-188 = "어, 어, 어서 안 나와?!"
10047040-192 = "까악! 까아아악!"
10047040-193 = "까, 까마귀……?"
10047040-194 = "어쩌면…… 까마귀가 했을지도."
10047040-195 = "까마귀도 훈련시키면 사람 말을 하거든……."
10047040-196 = "내가 까마귀 소리도 구별 못 할까 봐?!"
10047040-198 = "(……이후 한참을 찾아봤지만 목소리의 정체를 알 수는 없었다.)"
10047040-200 = "네? 정말로 원령의 목소리를 들은 건가요……?"
10047040-201 = "후후, 메롱이라니. 귀여운 악령이네요."
10047040-202 = "누가 장난친 거라니까!"
10047040-203 = "히히…… 이히히……."
10047040-204 = "[s] \"……계속 카노에가 한 거였지?\""
10047040-205 = "글쎄……."
10047040-206 = "[s5] \"복화술에 자유자재로 바뀌는 목소리라…….\"\n[s6] \"그러면, 카노에의 전공은…….\""
10047040-209 = "그건, 비밀…… 언젠가 알려줄게."
10047040-210 = "히히, 이히히……!"
10047040-211 = "[s] \"그, 그렇구나…….\""
10047040-212 = "그럼 이제 다른 곳으로 이동하자……. 선생에겐 보여주고 싶은 게 많아……."
10047040-217 = "(이후 모두와 와일드헌트 학원의 곳곳을 견학했다.)"
10047040-219 = "와일드헌트 교실"
10047040-222 = "와일드헌트 정원"
10047040-225 = "와일드헌트 예술정보관"
10047040-228 = "와일드헌트 대강당"
10047040-231 = "(이 외에도 많은 장소를 견학했다.)"
10047040-233 = "자, 선생님. 어떠셨나요? 즐거운 시간 되셨나요?"
10047040-234 = "[s] \"응! 즐거워서 시간 가는 줄도 몰랐어!\""
10047040-235 = "뉴후후, 이걸로 만족하긴 일러요. 아직 하이라이트가 남아 있으니까요."
10047040-236 = "아르카나가 인도하는 이번 견학의 최종 이벤트는 바로……."
10047040-237 = "마법진을 이용한 악마의 소환입니다!"
10047040-238 = "[s] \"그거…… 진짜 악마를 말하는 거야?\""
10047040-239 = "물론…… 진짜지."
10047040-240 = " 애옹! 애오오옹!"
10047040-241 = "까악! 까아아악!"
10047040-242 = "봐봐…… 얘들도 진짜라고 말하고 있어."
10047040-243 = "선배의 사역마들이 하는 말이니 틀림없겠죠."
10047040-244 = "이것은 이미 운명으로 결정된 사항. 피할 수 없어요."
10047040-246 = "히히, 이히히……."
10047040-247 = "뉴후, 뉴후후후!"
10047040-248 = "부탁이니까 난 빼줘……."
10047040-250 = "(즐거워 보이는 오컬연의 모두를 보며, 다음 장난을 생각했다.)"
