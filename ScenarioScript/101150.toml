[translation]
101150-1 = "제15화;이야기의 전복"
101150-2 = "됐어! 그럼 행정 제어권에 이쪽에서 강제로 개입해서 일단 통신망부터 연결할게!!"
101150-3 = "D.U. 전역에 봉쇄된 모든 통신망과 행정 시스템부터 복구하는 거야!"
101150-4 = "모, 모모카 쨩……."
101150-13 = "됐어!!"
101150-17 = "……으응?"
101150-21 = "선생님, 통신이 연결되었습니다!!"
101150-22 = "으, 으아아아?! 어, 엄청난 부재중 메시지가……?!"
101150-23 = "부재중 전화 250통?!"
101150-25 = "선생님, 지금 어디신가요? 논의 드려야 할 부분이 있습니다. 그 예언에 대해서……."
101150-26 = "선생님. 아리우스 자치구에서 발견한 것에 대해 말씀드릴 게 있습니다."
101150-27 = "선생님? 어디 있어? 오늘 비대위는 왜 안 온 거야? 선생님?"
101150-28 = "선생님? 괜찮으신가요?"
101150-29 = "선생님! 비대위가 있었는지 이제 알았어요. 회장이 사라져서…… 일단 기다려주세요, 지금 갈 테니까. 저 없이 시작하지 마세요!"
101150-30 = "……뭐, 뭐야?! 계엄령? 봉쇄? 무슨 일이 있는 거예요, 선생님?"
101150-31 = "선생님…… 뭔가 수상쩍은 일들이 벌어지고 있는 것 같은데, 혹시 괜찮으신가요?"
101150-32 = "응? 전원이 왜 꺼져있죠, 선생님? 무슨 일이 생긴 거라면……."
101150-33 = "선생님……. 어디 계신 거죠?"
101150-34 = "설마 저 때문에 무슨 일이라도 생긴 거라면……."
101150-35 = "선생님…… 시로코 선배가……."
101150-36 = "시로코 쨩이 사라졌어……. 어째서……. 다시 이렇게……."
101150-37 = "시로코 쨩이……. 선생님…… 저희는 이제 어떻게……."
101150-38 = "시로코 선배가 행방불명됐어!! 자전거만 놔두고……!! 이거 보는 즉시 빨리 연락 좀 부탁해!"
101150-41 = "……이건."
101150-44 = "뭐, 뭐야?! 이거?! 키보토스 전역에……."
101150-46 = "……저건."
101150-47 = "일단 발을 뺀다. 무슨 일이 벌어지고 있는지 확인부터 해라."
101150-48 = "네, 넵!"
101150-49 = "……."
101150-51 = "크…… 크윽…… 네놈들……"
101150-55 = "FOX 1. 이쪽은 모두 처리했다."
101150-56 = "FOX 2, 방위실장도 확보했어. FOX 3 쪽은?"
101150-57 = "이쪽도 목표로 한 물건을 확보. 지금 샬레 건물 빠져나가는 중."
101150-58 = "그런데 후배들 잘 싸우더라. 카이저의 SOF랑 거의 대등하게 싸우던데."
101150-59 = "샬레의 도움을 받아서겠지."
101150-60 = "그런데 이게 뭐야? 샬레의 지하에서 가져오라고는 했지만, 내용물은 듣지 못했는걸."
101150-61 = "방위실장이 알고 있을 거야. 깨어나면 물어볼게."
101150-62 = "그럼 우리 계획은 어떻게 되는 거야? 뭐가 어떻게 돌아가는 거지?"
101150-63 = "일단은 후퇴해. 카이저에게 기습당하는 바람에 일정이 꼬여버렸어."
101150-64 = "알겠어. 수고~"
101150-68 = "……우리도 일단 퇴각하자."
101150-73 = "선생님…… 이건……."
101150-81 = "이제서야 이해했다."
101150-84 = "선생이여, 이제 더 이상 너의 힘은 동작하지 않는다."
101150-85 = "[s] \"너는……. 골콩트……?\""
101150-86 = "아니, 골콩트는 이제 없다. 나는 프랜시스. 데칼코마니와 함께 새롭게 너를 지켜볼 자다. 그러니 경청해라. 이 최후의 선고를."
101150-87 = "이 이야기가 하나의 장르를 표방하였기에, 선생이여. 너는 주인공이 될 수 있었다."
101150-88 = "이것이 이야기이기에, 너는 무적이었다. 그래, 이건 그런 이야기였으니까."
101150-89 = "하지만…… 이제……"
101150-90 = "이 이야기는 전복되었다."
101150-91 = "맥락도, 구성도, 장르도, 의도도, 해석도 모두 파괴되었다."
101150-92 = "의미는 이제 뒤엉키고 뒤섞여 통제되지 못하게 퇴색되었다."
101150-97 = "선생이여."
101150-98 = "지금까지의 이야기는 모두 잊어라."
101150-99 = "지금부터 너에게 벌어질 일은 이제 더 이상 그런 것이 아니다."
101150-100 = "주인공도, 악당도, 사건도, 갈등도 없는 세계."
101150-101 = "해체되어 모든 것이 뒤엉킨 세계."
101150-102 = "맥락도, 구성도, 개연성도, 없는 어떤 작위의 세계."
101150-103 = "마침내 의미를 잃고 제멋대로 날뛰는 이해 불가능한 부조리의 세계."
101150-104 = "아아, 그렇다. 이 세계는 그저 그렇게 존재할 뿐이었다."
101150-105 = "우리는 모두 그것을 망각하고 있었을 뿐."
101150-107 = "이것이 더 이상 이야기가 아니라면, 선생이여, 너는 이제 아무 것도 아니다."
101150-108 = "학원과 청춘의 이야기는 이제 끝났다."
101150-109 = "전복되어 해체된 장르에서, 네 의미는 절하되고 축소되어 마침내 아무것도 아닌 것이 될 것이다!"
101150-110 = "그러니 드디어 시작하자. 이야기가 아닌……."
101150-111 = "[ns] \"아니.\""
101150-113 = "[ns1] \"이리저리 충돌하고, 날뛰고, 배신하고, 뒤엎고, 전복하는 이야기일지라도,\"\n[ns2] \"이야기라고 부를 수 없는 망가진 이야기일지라도.\""
101150-116 = "[ns] \"그런 건 아무 상관 없어.\""
101150-118 = "[ns3] \"장르가 해체되는 것 따위 내 관심사가 아냐.\"\n[ns4] \"우주 전함이 나오거나 슈퍼 로봇이 나오더라도 상관없어.\""
101150-123 = "[ns] \"그저 어떤 미래라도 우리는 함께 힘을 합쳐 이겨낼 거니까.\""
101150-125 = "……."
101150-126 = "그렇다면 그걸 지켜보겠다! 선생…… 아니, 주인공이여!"
101150-127 = "이 절망을, 이 파국을, 이 결말을 향해 나아가는 엔딩을!"
101150-132 = "지, 지금 그건…… 선생님……."
101150-133 = "[s] \"아로나. 모두에게 연락해줘.\""
101150-134 = "네? 네! 모두라면 정확히 누구에게……."
101150-135 = "[s] \"응. 모두에게.\""
101150-155 = "……과연."
101150-156 = "색채가 이미 이름 없는 신과 접촉한 뒤였다니…… 제 실책이었습니다."
101150-157 = "게다가 늑대신의 이면은…… 그런 것이었군요."
101150-158 = "모든 살아있는 자들을 저승으로 데려가는 [ruby=아누비스]죽음의 신[/ruby]……"
101150-162 = "그게 당신의 신비 이면의 [ruby=terror]공포[/ruby]였군요."
101150-166 = "선생님!! 통신이 끊기기 전에 선생님이 알고 계시는 모든 학생들에게 연락을 보냈어요!"
101150-167 = "간신히…… 해냈어요. 그치만…… 이제부터……."
101150-168 = "[s5] \"응. 고마워 아로나.\"\n[s6] \"늘 그렇듯, 함께 이 문제를 해결해 나가면 돼.\""
101150-172 = "……이것으로 이야기의 최종 무대가 완성되었습니다."
101150-173 = "지금부터 상대해야 하는 대적자는…… [ruby=아누비스]죽음의 신[/ruby]이 데려온 ……색채의 인도자."
101150-178 = "[ns] \"그럼 지금부터는 샬레의 턴이야.\""
101150-180 = "최종편;To be Continued in Chapter 2"
