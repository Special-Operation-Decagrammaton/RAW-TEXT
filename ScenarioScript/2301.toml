[translation]
2301-1 = "일단은! 마츠리부 정례회의!"
2301-2 = "(한가로운 어느 휴일 오후, 백야당의 구석에 마츠리운영관리부의 부원들이 모였다.)"
2301-3 = "화이트 보드 준비 OK, 마카도 새 것으로 마련했고. 이걸로 준비는 완벽해."
2301-4 = "그럼 피나."
2301-5 = "네엡!"
2301-6 = "그럼 부장의 명을 받들어서엇!"
2301-10 = "지금부터 마츠리운영관리부의 정례회의르으으을, 시작합니다앗! 아쵸옷!"
2301-12 = "으음……."
2301-13 = "매번 정례회의 때마다 생각하는 거지만, 정말 우리, 매번 이렇게 회의를 시작해야 하는 거야……?"
2301-14 = "No-No-No! 언제나 예법은 중요한 겁니다! 부장!"
2301-15 = "저희 마츠리부의 정례회의는 정숙하고 섬세한 의식!"
2301-16 = "그만큼 공을 들일 필요가 있습니다!"
2301-17 = "뭐, 피나가 그렇게 말한다면 나도 할 말은 없지만……."
2301-18 = "뭐어, 어쨌거나 본론으로 들어가서, 오늘 이렇게 우리가 모인 이유는 간단해."
2301-19 = "이제 곧 다음 달에 까마귀까악까악 상점가에서 축제를 개최할 예정이야."
2301-20 = "상점가 축제의 프로듀스를 의뢰를 받은 만큼, 우리 마츠리부는 최선을 다할 의무가 있어."
2301-21 = "우미카……는 아쉽게도 게헨나 지역의 축제 현지 조사를 위해 자리를 비웠으니까."
2301-22 = "이번엔 피나와 나, 우리 둘만으로 어떻게든 이 축제를 성공시켜야만 해."
2301-23 = "넵!"
2301-24 = "그럼 단도직입적으로 말해서, 이번 축제를 성공으로 이끌 좋은 아이디어, 혹시 있어?"
2301-25 = "아무거라도 좋으니까. 사소한 것 같아도, 거기서 이야기가 시작될지도 모르니까."
2301-26 = "으음……!"
2301-29 = "두-둥! 나요! 나! 나! 나 있습니다! 좋은 아이디어!"
2301-30 = "후아암."
2301-31 = "어머나……."
2301-33 = "아핫."
2301-34 = "애써 사람이 무시하고 있었는데 난입하지 마~!"
2301-35 = "그보다 왜, 수행부 부원들이……, 외부인이 여기 있는 거야?!"
2301-36 = "가뜩이나 오늘은 백야당이 쉬는 날이라고?!"
2301-37 = "흐아암, 그러니까 그게……."
2301-38 = "이번에 수행부가 피크닉을 갈 예정이라, 그 간식을 사기 위해 들렸던 건데."
2301-39 = "하필 오늘이 백야당의 휴일인지 미처 알지 못했어요. 죄송해요. 시즈코 쨩."
2301-40 = "정문에서 곤란한 얼굴로 서 있길래! 피나가 초대했습니다! 부장!"
2301-41 = "피나?!"
2301-42 = "어려울 땐 서로 돕는 법이니까요!"
2301-43 = "정론! 피나의 승리네!"
2301-44 = "아니, 정론이지만. 분명 정론이 맞긴 한데 말이지……!"
2301-45 = "그래서 이건 죄송하지만, 마침 점심으로 먹으려고 싸왔던 도시락이에요. 시즈코 쨩. 같이 드실래요?"
2301-46 = "응? 아, 고마워. 와아. 캐릭터 주먹밥 도시락이야?"
2301-47 = "맛있겠다! 그럼 어디 한 개……"
2301-48 = "가 아니라!"
2301-49 = "지금은 우리 마츠리부의 정기 부활동 중이라고! 외부인이 있으면 곤란하단 말이야!"
2301-51 = "부장! 아닙니다!"
2301-52 = "피, 피나……?"
2301-53 = "축제 아이디어라는 건, 저희만이 아니라. 외인의 의견도 받을 필요가 있다고! 피나는 생각합니다!"
2301-54 = "으윽……."
2301-55 = "고인 물은 언젠가 썩는 법!"
2301-56 = "조직을 키워나가기 위해선, 외부의 시선을 적극 수용할 필요가 있습니다!"
2301-57 = "<의리 없는 냥냥 펀치>에 나왔던 것처럼……!"
2301-58 = "뭐, 영화 이야기일 줄 알았지만!"
2301-59 = "그래도……. 하아."
2301-61 = "그래, 피나, 네 말이 맞아."
2301-62 = "가끔은 외부인의 시선으로 바라본 색다른 의견도, 확실히 고려할 가치는 있어."
2301-63 = "그걸 통해, 우리가 놓치고 있는 중요한 걸 발견할 수 있을지도 모르고……."
2301-64 = "음, 좋아! 허가 하겠어!"
2301-65 = "수행부. 좋은 의견이 있다면 말해줘."
2301-66 = "어? 진짜루? 말해도 돼?"
2301-67 = "이제 와서 그런 말을 하는 거야?!"
2301-68 = "축제 의견? 나는……. 잠만 잘 수 있으면, 좋아……. 쿠울."
2301-69 = "그래선 축제가 아니잖아!"
2301-70 = "으음, 저는 잘 모르겠네요. 카에데 쨩은 어떤가요?"
2301-71 = "흐-흥. 뭐, 나라면?"
2301-72 = "멋진 레이디를 지망하면서 오늘 하루도 잔뜩 단련과 수행을 게을리하지 않는 내 생각이라면 말이야~!"
2301-73 = "(……당장 수행이 아니라 놀러왔으면서 그런 말을 하기야?)"
2301-74 = "손님을 한 방에 모을, 어른의 계획이 있지!"
2301-75 = "자, 잠깐! 어른스러운 계획이라니? 무, 무슨 계획을 생각하는 거야?"
2301-76 = "어른의 계획이라니, 피나, 두근거립니다! 두근두근!"
2301-77 = "아마, 이걸 시도만 하면 단숨에 여기저기서 사람이 구름처럼 몰려들걸?!"
2301-78 = "어른스럽게, 구름처럼……."
2301-79 = "서, 설마, 파렴치한 걸 하려는 생각이야?!"
2301-81 = "파렴, 파렴치?"
2301-82 = "카에데 쨩. 수치를 모른다. 라는 뜻이에요."
2301-83 = "아! 으음~! 확실히 파렴치한 짓일지도?"
2301-84 = "어머?"
2301-87 = "아, 안돼! 아무리 축제의 성공을 위해서라도 우리 마츠리부는 절도와 윤리를 지킬 필요가……."
2301-88 = "하, 하지만 이번에 의뢰가 들어온 상점가는, 최근 들어 손님 수가 줄면서 폐점을 앞둔 가게도 많아졌다고."
2301-89 = "특히 꼭 좀 잘 부탁한다면서 상인회장님이 눈물까지 흘리시던 모습을 생각하면……."
2301-90 = "나, 나도 어떻게든 해주고 싶은 마음은 굴뚝 같지만!"
2301-91 = "흐흥, 여기서 망설이다니, 마츠리부 부장은 어린애구나……."
2301-92 = "그, 그치만……!"
2301-94 = "어린애처럼 망설이지 말고, 그대로 저질러버리는 거야!"
2301-95 = "금단의 이벤트……."
2301-96 = "인기 트레이딩 카드게임 <무시퀸>의 1인당 1박스 판매 이벤트를 말이야!"
2301-97 = "……뭐? 금단? 뭐?"
2301-98 = "아닛?! 한정 판매로 인해 물량수급이 어려워서. 개인당 2팩 구매가 원칙인 무시퀸 카드를."
2301-99 = "1인당 1박스로 팔아버리는 겁니까!"
2301-100 = "그랬다간 키보토스 전역의 무시퀸 게이머들이 구름처럼 몰려들 겁니다!"
2301-101 = "……응?"
2301-102 = "맞아! 그리고 그걸 노려서, 특별히 무시퀸 배틀 대회를 개최하는 거야!"
2301-103 = "핫?! 잠깐. 그랬다간 분명 백귀야행뿐만 아니라, 게헨나나 트리니티처럼 다른 학교에서도 학생들이 찾아올 텐데?!"
2301-104 = "그렇게 되면 키보토스 최강의 무시퀸 게이머를 결정하는, 엄청난 대회가 열릴지도?!"
2301-106 = "와아. 멋진 축제가 되겠네요?"
2301-107 = "한바탕…… 쿠울……. 대소동……."
2301-109 = "꿀꺽……. 학교 간, 대규모 항쟁으로 비화……!"
2301-110 = "네! 피나도 지지 않겠습니다!"
2301-111 = "시즈코 부장! 설사 항쟁이 벌어지더라도, 그 자리는 이 피나에게 맡겨만 주세요!"
2301-117 = "아니……. 시중에서도 구할 수 없는 그 카드는 대체 어디서 구할……."
2301-118 = "아, 아니. 그게 아니라……."
2301-119 = "축제를 위한 회의가……. 그 진행이……."
2301-122 = "으으윽……."
2301-125 = "도와줘! 우미카! 대체 언제 돌아오는 거야~!"
2301-126 = "일단은! 마츠리부 정례회의!"
