[translation]
10027100-1 = "10화;용역부의 건의"
10027100-9 = "붉은겨울 설원"
10027100-10 = " 하아, 하아……."
10027100-11 = " 이겼…… 나?"
10027100-12 = "사무국을 물리치기는 했지만, 이걸로 밉보이게 되지 않을까 걱정이네요……."
10027100-13 = "괜찮아. <지식해방전선>은 원래 사무국에게 밉보이고 있었으니까."
10027100-14 = "그건 확실히 그렇긴 한데요……."
10027100-18 = "[ns] \"동인의 앞길을 막는 자, 파멸이 기다리고 있을 것이다……!\""
10027100-19 = " 서, 선생님?"
10027100-20 = "일단 전진이다! 시간이 없어!"
10027100-23 = "그것에 대하여, 노동과 혁명의 이름으로 이야기하고 싶은 것이 있어."
10027100-25 = "또 뭐야?!"
10027100-34 = "어……? 용역부원분들과, 미노리 부장……?"
10027100-36 = "마침 이곳에 있었군. 다행이야."
10027100-37 = "<루나>라는 작품의 관련 서적 제작을, <지식해방전선>에서 대대적으로 진행하고 있다는 소식을 듣고 찾아왔어."
10027100-39 = "어……. 대대적이라고 할 것까지는 아니지만, 뭐, 그런 일을 하기는 했지……?"
10027100-40 = "그런데……. 저희 동인지와 용역부 사이에, 무언가 상관관계가 있는 걸까요?"
10027100-42 = "우선, 우리는 과거의 유산을 되짚어, 그것을 현대에 되살려 보자는 <지식해방전선>의 발상과 정신을 존중해."
10027100-43 = "노동의 역사를 되짚어갈수록, 혁명에 대한 투지는 넘쳐흐르고, 기득 세력에 대한 투쟁 의지는 더더욱 고취되기 마련이니까."
10027100-45 = "(<루나>가 그런 내용이었나……?)"
10027100-46 = "(절대로 아니죠……?)"
10027100-48 = "그런 의미에서! 우리 용역부는 <지식해방전선>에게 제안하고자 한다!"
10027100-49 = "<지식해방전선>이 현재 만들어 나가고 있는 서적의 내용을, 보다 혁명적이고 진취적인 내용으로 바꿀 것을 건의한다!"
10027100-51 = "건의한다! 건의한다!"
10027100-53 = "나아가, 노동 계급의 계몽과 해방을 위해, 자본가들에게 고통받는 노동자들과 그들의 투쟁을 주요 소재로 다루어 줄 것을 제의하는 바이다!"
10027100-55 = "제의한다! 제의한다!"
10027100-61 = "[ns] \"그런 내용은 또 어디서 들었길래…….\""
10027100-63 = "……무슨 말을 하나 했더니……"
10027100-64 = "용역부원분들에게는 신세 지는 부분도 있고, 저희 도서관을 찾아 주시는 분도 계셔서 감사하는 마음도 있기는 한데요……."
10027100-66 = "그래도 이번은 안 돼요!"
10027100-67 = "그래! 시간이 없다고!"
10027100-73 = "……실망인걸. <지식해방전선>. 평상시 <지식해방전선>의 사서들이 엄선한 문학 작품들에게 많은 도움을 받고 있었는데."
10027100-74 = "이번에야말로 함께 손을 잡고 <요거트 뚜껑을 핥지 않고 버리는 가증스러운 수염 꼬맹이>에게 따끔한 맛을 보여줄 수 있으리라 기대했는데!"
10027100-75 = "[s] \"역시 그거, 용역부였구나!\""
10027100-76 = "어쩔 수 없군. 이 방법만은 사용하고 싶지 않았지만……."
10027100-77 = "동지들! 지금부터 우리는, 흐려져 버린 <지식해방전선>의 시야를, 다시 명징하게 띄우기 위해, 가열찬 투쟁으로 이행한다!"
10027100-79 = "와아아아아!"
