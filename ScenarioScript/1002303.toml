[translation]
1002303-1 = "선도부원의 약점"
1002303-2 = "(이오리의 모모톡이 신경 쓰여 몰래 뒤를 밟았다.)"
1002303-7 = "……아무도 못 봤겠지?"
1002303-8 = "실수라지만 하필이면 선생님에게 그 메시지를 들키고 말다니……."
1002303-10 = "이런, 약속 시간에 늦겠어. 어서 약속 장소로 가자."
1002303-15 = "[ns] 이오리를 따라간다."
1002303-19 = "후후, 드디어 오셨군요. 기다리고 있었습니다."
1002303-20 = "……물건은 약속대로 준비했겠지?"
1002303-21 = "물론이죠."
1002303-22 = "하지만 이거 정말 의외로군요. 피도 눈물도 없다는 그 게헨나 선도부의 스페셜리스트께서 이런 은밀한 방법으로 거래를 요청해 오실 줄이야. 후후……."
1002303-23 = "어쩔 수 없잖아! 평범한 방법으로 '그 물건'을 사려고 했다가는 다른 학생들에게 들키게 되니까……."
1002303-24 = "……어쨌든, 비밀은 확실히 보장해주는 거겠지?"
1002303-25 = "물론입니다. 고객의 비밀엄수는 저희의 신용과도 직결되는 문제니까요."
1002303-26 = "그럼 준비한 물건부터 보시죠."
1002303-31 = "나쁘지 않네. 이거라면 문제없겠어."
1002303-32 = "그럼 대금을……."
1002303-33 = "[s] \"……방금 무얼 산 거야?\""
1002303-34 = "으엑? 서, 서, 선생님?!"
1002303-35 = "어, 어째서 이런 외진 장소에……?"
1002303-36 = "[s] \"이오리의 메시지가 신경 쓰여서 쫓아와 봤어.\""
1002303-38 = "뭐, 뭐야! 그럼 여태까지 날 쭉 미행해 왔다는 거야?"
1002303-39 = "최악이야! 변태! 죽어!"
1002303-40 = "[s] \"하지만 수상한 메시지를 먼저 보낸 건 이오리잖아?\""
1002303-41 = "이, 이건 수상한 물건이 아니에요."
1002303-42 = "제가 판매한 건 다름 아닌—"
1002303-43 = "잠깐—! 방금 전까지 고객의 비밀 엄수는 신용과 직결되는 문제라고 하지 않았어?"
1002303-44 = "어째서 바로 실토하려는 거야?"
1002303-45 = "하지만 수상한 물건을 거래한다는 소문이 퍼지면 곤란한 건 이오리 씨도 마찬가지잖아요?"
1002303-46 = "……어차피 금세 들키게 될 텐데, 그냥 말해버리죠."
1002303-47 = "그건 그렇지만……."
1002303-48 = "[s] \"탓하지 않을 테니까 솔직하게 말해줘.\""
1002303-52 = "…………튜브야."
1002303-53 = "[s] \"뭐라고?\""
1002303-54 = "……내가 구입한 건 튜브라고."
1002303-55 = "[s] \"뭐라고?\""
1002303-59 = "튜브라고 했잖아! 수영할 때 팔다리에 차는 보조 튜브!"
1002303-60 = "으으, 정말! 이래서 선생님에게는 들키고 싶지 않았는데! 놀리기만 하고!"
1002303-61 = "[s] \"어째서 튜브를 구입한 거야?\""
1002303-62 = "그야 수영에는 익숙하지 않으니까 그렇지!"
1002303-63 = "선도부 활동 때문에 수영 강습을 자주 건너뛰어서 헤엄에는 익숙지 않단 말이야."
1002303-64 = "하지만 규칙 위반자가 바다로 도망쳤을 때 수영을 할 수 없으면 곤란하잖아?"
1002303-65 = "그래서 다른 학생들 몰래 튜브를 사서 수영 연습을 하려고 했는데……."
1002303-66 = "하필이면 [USERNAME] 선생님께 들켜버리다니……."
1002303-67 = "[s] \"내가 수영 연습을 도와줄게.\""
1002303-68 = "뭐? 어째서 선생님이……?"
1002303-69 = "……어차피 속으로는 음흉한 생각을 하고 있는 거지? 안 속을 거야."
1002303-70 = "[s] \"혼자보다는 같이 연습하는 게 더 빨리 익힐 수 있을 거야.\""
1002303-71 = "확실히 그건 그렇지만……."
1002303-74 = "(생각해 보니 선생님께는 수영을 못한다는 사실을 숨길 필요도 없고…….)"
1002303-75 = "(나중에 학생들 앞에서 망신을 당하는 것보다는 이 편이 더 좋을지도…….)"
1002303-78 = "……알겠어. 그럼 부탁할게."
1002303-79 = "……하지만 이상한 곳 만지면 죽여버릴 거야."
1002303-80 = "[s] \"노력해볼게.\""
1002303-81 = "뭐가 '노력해볼게', 야! 절대 만지지 마!"
1002303-83 = "(이후, 이오리와 함께 심야의 해변에서 열심히 수영 연습을 했다.)"
