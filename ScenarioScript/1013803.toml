[translation]
1013803-1 = "인정 못 해!"
1013803-2 = "(늦은 밤. 시간에 맞춰 약속 장소에 나갔다.)"
1013803-5 = "여, 여기야! 선생님!"
1013803-6 = "[s1] \"이런 시간에 버스 정류장?\"\n[s2] \"어디 가려고?\""
1013803-9 = "으음, 그게 말이지……."
1013803-10 = "지금부터……."
1013803-11 = "유령이 나온다는 폐교에 갈 거야."
1013803-12 = "[s] \"가, 갑자기 폐교?!\""
1013803-13 = "어, 어쩔 수 없었어!"
1013803-14 = "선배들에게 유령이 없다는 걸 증명하기로 했단 말이야!"
1013803-15 = "[s] \"그런 거라면 그 아이들도 재밌다며 따라올 것 같은데.\""
1013803-16 = "내가 오지 말라고 했어."
1013803-17 = "선배들이라면 또 이상한 장난을 칠 게 뻔하니까."
1013803-18 = "외출증이 있는 것도 나뿐이었고."
1013803-19 = "하지만 그게…… 역시 혼자 가는 건 조금 그래서……."
1013803-20 = "[s] \"날 부른 거구나?\""
1013803-21 = "뭐, 진짜 유령이 나올 리는 없을 테니 별일이야 있겠냐만……."
1013803-22 = "아무튼 이걸로 빚진 거 없애줄 테니까 같이 가는 거다?"
1013803-23 = "[s] \"응! 내가 지켜줄게!\""
1013803-24 = "하아…… 내가 진짜 어쩌다가……."
1013803-25 = "아. 저기 버스 왔다."
1013803-30 = "(그렇게 도착한 어느 인적 없는 곳…….)"
1013803-31 = "여기서 조금만 더 걸어가면 오래된 폐교가 나와."
1013803-32 = "건물터가 이상했던 건지, 지어질 때부터 수상한 비명이 끊이지 않았다고 하더라."
1013803-33 = "그 비명은 폐교된 지금까지 들리고 있대."
1013803-34 = "담력 시험을 하러 갔다가 기절한 아이들도 많아서 지금은 아무도 접근하지 않는다고 해."
1013803-35 = "[s] \"사전 조사 열심히 했네.\""
1013803-36 = "가, 가는 곳이 어딘지는 알아야 할 거 아냐!"
1013803-37 = "아무튼 가자. 유령 따위 없다는 걸 증명하는 거야!"
1013803-42 = "(그리하여 도착한 폐교 내부…….)"
1013803-43 = "[ns] \"오…… 뭔가 으스스한데?\""
1013803-44 = "이 폐교에는 7대 불가사의가 있대."
1013803-45 = "첫째. 심야에, 복도의 창문을 쿵쿵 두드리는 소리."
1013803-46 = "둘째. 존재하지 않는 열세 번째 계단."
1013803-47 = "셋째. 수상한 그림자가 돌아다니는 교직원 복도."
1013803-48 = "넷째. 교실 창문 너머로 보이는 피에 물든 벚나무."
1013803-49 = "다섯째. 교실의 망가진 스피커에서 울리는 종소리."
1013803-50 = "여섯째. 지하 기계실에서 울리는 수상한 비명."
1013803-51 = "마지막 일곱째는……."
1013803-52 = "아직 아무도 모르는 숨겨진 전설."
1013803-53 = "그 숨겨진 전설까지 알면 엄청난 저주가 내린다고……."
1013803-54 = "[s] \"전부 어디선가 들어봤을 법한 이야기네.\""
1013803-55 = "그, 그렇지? 뻔한 괴담이지?"
1013803-56 = "아무튼 이 괴담을 확인한 뒤에 사진을 찍어서 선배들에게 보여줄 거야."
1013803-57 = "분명 아무 일도 없을 테니까, 유령이 없다는 걸 증명할 수 있을……."
1013803-61 = "……?!"
1013803-62 = "뭐, 뭐, 뭐야……?"
1013803-66 = "히익……!!"
1013803-70 = "[ns] \"심야에, 복도의 창문을 쿵쿵 두드리는 소리……!\""
1013803-71 = "부, 분명 우리 말곤 아무도 없을 텐데 누가 두드린다는 거야!"
1013803-72 = "[s] \"가서 확인해 보자.\""
1013803-73 = "……!!"
1013803-74 = "[s3] \"걱정하지 마.\"\n[s4] \"절대로 손 놓지 않을게.\""
1013803-77 = "누, 누가 걱정했다고!"
1013803-82 = "아, 아무튼 가, 가서 확인해 보자!"
1013803-91 = "까악! 까아아악……!"
1013803-95 = "아, 뭐야? 까마귀였어?"
1013803-96 = "창문은 왜 쪼고 있었던 거야? 여긴 먹을 것도 없어 보이는데."
1013803-97 = "[s] \"혹시 까마귀가 아니라 진짜 유령이 있던 건……?\""
1013803-98 = "샤아아악! 그럴 리가 없잖아!"
1013803-99 = "일단 사진부터 찍어두자. 복도의 쿵쿵 소리가 까마귀였다는 증거를 남겨야 해."
1013803-106 = "자. 여기 까마귀 사진 잘 찍혔지? 주변에 이상한 것도 없고."
1013803-107 = "이대로 계속 7대 불가사의를 확인해 보는 거야!"
1013803-109 = "(레나는 자신 있게 외쳤지만, 꼭 잡은 내 손을 절대 놓지 않았다…….)"
1013803-111 = "[ns] (나도 놓지 말아야지…….)"
1013803-113 = "(그렇게 레나와 폐교의 불가사의를 확인해 보기 시작했다.)"
1013803-115 = "수상한 그림자가 보인다는 복도"
1013803-122 = "피에 물든 벚나무가 보인다는 교실"
1013803-127 = "수상한 비명이 들린다는 지하 기계실"
1013803-137 = "(7대 불가사의에 해당하는 장소를 전부 확인해 사진으로 남겼다.)"
1013803-138 = "(역시나 유령은 나타나지 않았다…….)"
1013803-140 = "후우, 그래. 유령 따윈 없었어."
1013803-141 = "전부 야생 동물이거나 낡은 시설 때문에 오해받은 거였잖아."
1013803-142 = "자! 증거도 남겼으니까 이제 돌아가자. 얼른 선배들한테 보여줘야지."
1013803-143 = "[s5] \"유령이 없는 걸 증명했지만…….\"\n[s6] \"손은 계속 잡고 가는 게 좋겠지?\""
1013803-146 = "그, 그건……."
1013803-147 = "무, 무서워서 잡는 게 아니야!"
1013803-148 = "어, 어두워서 혹시라도 넘어지면 안 되니까 그런 거지!"
1013803-149 = "[s] \"응. 넘어지면 위험하니까.\""
1013803-151 = "(이후 와일드헌트 학원까지 안전하게 레나를 바래다주었다.)"
1013803-157 = "(이렇게 잘 끝나는가 했는데…….)"
