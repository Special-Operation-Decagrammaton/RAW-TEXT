[translation]
1013803-1 = "ไม่เชื่อหรอก!"
1013803-2 = "(กลางดึกคืนหนึ่ง คุณครูไปถึงสถานที่นัดหมายตรงตามเวลา)"
1013803-5 = "ทะ... ทางนี้! คุณครู!"
1013803-6 = "[s1] \"ที่นี่มันป้ายรถบัสนี่นา?\"\n[s2] \"จะนั่งรถไปไหนเหรอ?\""
1013803-9 = "อืม คือว่า..."
1013803-10 = "จากนี้ไป..."
1013803-11 = "ฉันจะไปโรงเรียนร้างที่มีข่าวว่ามีวิญญาณออกมา"
1013803-12 = "[s] \"ทะ... ทำไมจู่ๆ ถึงจะไปโรงเรียนร้างล่ะ?!\""
1013803-13 = "กะ... ก็มันช่วยไม่ได้นี่นา!"
1013803-14 = "ฉันตั้งใจไว้แล้วว่าจะพิสูจน์ให้พวกรุ่นพี่เห็นว่าผีหรือวิญญาณน่ะไม่มีอยู่จริง!"
1013803-15 = "[s] \"ถ้างั้นคนอื่นคงคิดว่าน่าสนุกและตามมาด้วยนะ\""
1013803-16 = "ฉันบอกไปแล้วละว่าไม่ต้องตามมาด้วย"
1013803-17 = "ก็พวกรุ่นพี่น่ะ ถ้ามาแล้วต้องแกล้งกันด้วยวิธีแปลกๆ แน่นอน"
1013803-18 = "แล้วฉันก็เป็นคนเดียวที่มีบัตรออกนอกโรงเรียน"
1013803-19 = "แต่ปัญหาคือ... ถ้าฉันไปคนเดียวมันก็กระไรอยู่..."
1013803-20 = "[s] \"ก็เลยจะขอให้ครูไปด้วยสินะ?\""
1013803-21 = "แต่ก็... ยังไงก็ไม่มีทางที่วิญญาณจะโผล่ออกมาอยู่แล้ว งั้นก็ไม่น่ามีอะไรหรอก..."
1013803-22 = "คุณครูเคยติดหนี้ฉันไว้ งั้นก็ถือว่าไปกับฉันเพื่อเป็นการใช้หนี้แล้วกันนะ?"
1013803-23 = "[s] \"อื้อ! ครูจะคอยปกป้องเรนะให้เอง!\""
1013803-24 = "เฮ้อ... ฉันได้มาทำอะไรแบบนี้ได้ยังไงนะ..."
1013803-25 = "อ๊ะ รถมาแล้ว"
1013803-30 = "(แล้วทั้งสองก็มาถึงสถานที่แห่งหนึ่งที่ไม่มีผู้คนสัญจรผ่าน...)"
1013803-31 = "ถ้าเดินต่ออีกหน่อย ก็จะเจอโรงเรียนร้างเก่าๆ แห่งหนึ่ง"
1013803-32 = "ไม่รู้ว่าเพราะทำเลมันแปลกๆ หรือเปล่า ว่ากันว่าตั้งแต่เริ่มก่อสร้างก็มีเสียงกรีดร้องแปลกๆ ให้ได้ยินตลอดเลยละ"
1013803-33 = "ต่อให้ปิดโรงเรียนนั้นไปแล้ว เสียงกรีดร้องนั้นก็ยังอยู่เลยด้วย"
1013803-34 = "ได้ยินมาว่ามีเด็กหลายคนเข้ามาล่าท้าผีเพื่อทดสอบความกล้าหาญ และก็เป็นลมกลับไป จนตอนนี้ไม่มีใครกล้าเข้าไปใกล้โรงเรียนแห่งนั้นเลยละ"
1013803-35 = "[s] \"ค้นคว้าข้อมูลมาเยอะเลยนะเนี่ย\""
1013803-36 = "กะ... ก็ฉันต้องรู้ก่อนสิว่าที่ที่จะไปมันเป็นสถานที่แบบไหน!"
1013803-37 = "เอาเถอะ ฉันจะพิสูจน์ให้เห็นเองว่าผีหรือวิญญาณน่ะไม่มีอยู่จริง!"
1013803-42 = "(แล้วทั้งสองคนก็มาถึงด้านในโรงเรียนร้าง...)"
1013803-43 = "[ns] \"โอ้... รู้สึกขนลุกแปลกๆ นะ?\""
1013803-44 = "มีข่าวลือว่าที่นี่มีเรื่องลึกลับเจ็ดอย่างซ่อนอยู่"
1013803-45 = "อย่างแรกก็คือ เสียงเคาะหน้าต่างตรงทางเดินในยามดึก"
1013803-46 = "อย่างที่สอง บันไดขั้นที่สิบสามที่ไม่มีอยู่จริง"
1013803-47 = "อย่างที่สาม ทางเดินบนอาคารของครูที่มีเงาปริศนาวนเวียนอยู่"
1013803-48 = "อย่างที่สี่ ต้นซากุระเปื้อนเลือดที่เห็นได้จากนอกหน้าต่างห้องเรียน"
1013803-49 = "อย่างที่ห้า เสียงระฆังที่ดังออกมาจากลำโพงที่เสียในห้องเรียน"
1013803-50 = "อย่างที่หก เสียงกรีดร้องน่าสงสัยที่ดังมาจากห้องควบคุมระบบใต้ดิน"
1013803-51 = "อย่างที่เจ็ด อย่างสุดท้าย..."
1013803-52 = "ตำนานลึกลับที่ยังไม่มีใครล่วงรู้มาก่อน"
1013803-53 = "ว่ากันว่าถ้าล่วงรู้ไปถึงตำนานที่ถูกซ่อนไว้ ก็จะต้องเจอคำสาปน่าสะพรึงกลัว..."
1013803-54 = "[s] \"เหมือนจะเคยได้ยินเรื่องแบบนี้มาก่อนเลยนะ\""
1013803-55 = "ชะ... ใช่มั้ยล่ะ? ฟังดูเหมือนเรื่องลึกลับหลอกเด็กทั่วไปเลยใช่มั้ย?"
1013803-56 = "ฉันจะตรวจสอบเรื่องลึกลับนี้แล้วถ่ายรูปไปให้พวกรุ่นพี่ดูให้ได้เลย"
1013803-57 = "ในเมื่อไม่มีเรื่องอะไรเกิดขึ้น งั้นก็พิสูจน์ได้ว่าผีไม่มีอยู่จริง..."
1013803-61 = "...?!"
1013803-62 = "อะ... อะ... อะไรน่ะ...?"
1013803-66 = "เฮือก...!!"
1013803-70 = "[ns] \"เสียงเคาะหน้าต่างตรงทางเดินในยามดึก...!\""
1013803-71 = "ทะ... ที่นี่มีแค่พวกเราสองคนเท่านั้น แล้วใครไปเคาะหน้าต่างล่ะ!"
1013803-72 = "[s] \"เราไปดูกันเถอะ\""
1013803-73 = "...!!"
1013803-74 = "[s3] \"ไม่ต้องกลัวนะ ครูอยู่ตรงนี้แล้ว\"\n[s4] \"ไม่ต้องกลัวนะ ครูจะไม่ปล่อยมือเรนะเด็ดขาดเลย\""
1013803-77 = "คะ... ใครบอกว่ากลัวกันล่ะ!"
1013803-82 = "อะ... เอาเถอะ ระ... เราไปดูกันดีกว่า!"
1013803-91 = "กาา! กาาาา...!"
1013803-95 = "อ่า อะไรกัน? นกกาหรอกเหรอ?"
1013803-96 = "ทำไมถึงมาจิกหน้าต่างอยู่ล่ะ? ตรงนี้ก็ไม่เห็นจะมีของกินนี่นา"
1013803-97 = "[s] \"หรือว่าจะไม่ใช่ฝีมืออีกา แต่เป็นผีจริงๆ...?\""
1013803-98 = "ว้ากกก! จะเป็นแบบนั้นไปได้ยังไง!"
1013803-99 = "เอาเป็นว่าถ่ายรูปไว้ก่อนแล้วกัน ต้องบันทึกหลักฐานไว้ให้ได้ว่าเสียงเคาะหน้าต่างมาจากอีกาพวกนี้"
1013803-106 = "เอาละ ถ่ายรูปอีกาไว้เรียบร้อย แล้วรอบๆ นี้ก็ไม่มีอะไรผิดปกติด้วย"
1013803-107 = "งั้นก็ไปตรวจสอบเรื่องลึกลับทั้งเจ็ดต่อกันเลย!"
1013803-109 = "(เรนะตะโกนอย่างมั่นใจ แต่ก็ยังจับมือของคุณครูไว้แน่นและไม่คิดจะปล่อยมือ...)"
1013803-111 = "[ns] (เราก็ห้ามปล่อยมือเด็ดขาดเลย...)"
1013803-113 = "(แล้วคุณครูกับเรนะก็เริ่มสำรวจโรงเรียนร้างเพื่อตรวจสอบเรื่องลึกลับด้วยกัน)"
1013803-115 = "ทางเดินที่ว่ากันว่ามีเงาปริศนา"
1013803-122 = "ห้องเรียนที่ว่ากันว่ามีต้นซากุระเปื้อนเลือดให้เห็น"
1013803-127 = "ห้องควบคุมใต้ดินที่ว่ากันว่ามีเสียงกรีดร้องน่าสงสัย"
1013803-137 = "(ทั้งสองคนไปตรวจสอบและถ่ายรูปจุดเกิดเหตุของเรื่องลึกลับ)"
1013803-138 = "(และไม่เจอผีอย่างที่คาดไว้...)"
1013803-140 = "ฮู่ว เห็นมั้ยล่ะ? ผีเผออะไรไม่มีจริงหรอก"
1013803-141 = "ทุกอย่างเป็นฝีมือของสัตว์ หรือไม่ก็ความเก่าแก่ของตัวอาคารเองต่างหาก เข้าใจผิดกันไปทั้งนั้น"
1013803-142 = "เอาละ! ในเมื่อได้รูปหลักฐานแล้ว งั้นเราก็กลับกันเถอะ ต้องรีบเอาไปให้พวกรุ่นพี่ดูให้ได้เลย"
1013803-143 = "[s5] \"พิสูจน์ได้แล้วว่าไม่มีผี แต่ยังจับมือครูแน่นเลยนะ\"\n[s6] \"พิสูจน์ได้แล้วว่าไม่มีผี แต่ยังไม่ปล่อยมือครูเลยนะ\""
1013803-146 = "ระ... เรื่องนั้น..."
1013803-147 = "ฉะ... ฉันไม่ได้จับมือไว้เพราะกลัวสักหน่อย!"
1013803-148 = "กะ... ก็ทางมันมืด ฉันกลัวว่าเดินไม่ดีแล้วจะสะดุดล้มต่างหากล่ะ!"
1013803-149 = "[s] \"อื้อ ถ้าหกล้มไปเดี๋ยวจะอันตรายเนอะ\""
1013803-151 = "(แล้วคุณครูก็พาเรนะไปส่งที่ไวลด์ฮันต์อย่างปลอดภัย)"
1013803-157 = "(และคิดว่าทุกอย่างจบลงด้วยดีแล้ว...)"
