[translation]
1013803-1 = "無法認同！"
1013803-2 = "（深夜，準時來到了約定的地方）"
1013803-5 = "這，這裡！老師！"
1013803-6 = "[s1] 「這種時間在公車站？」\n[s2] 「要去哪裡？」"
1013803-9 = "呃，那個……"
1013803-10 = "現在……"
1013803-11 = "要去據說有幽靈出沒的廢校。"
1013803-12 = "[s] 「突，突然要去廢校！？」"
1013803-13 = "沒，沒辦法啊！"
1013803-14 = "我答應了前輩們要證明沒有幽靈！"
1013803-15 = "[s] 「那樣的話，他們也會覺得有趣而跟來吧。」"
1013803-16 = "我叫他們不要來。"
1013803-17 = "畢竟前輩們肯定又會搞什麼奇怪的惡作劇。"
1013803-18 = "而且有外出證的也只有我。"
1013803-19 = "但是……一個人去果然有點……"
1013803-20 = "[s] 「所以就叫上我了？」"
1013803-21 = "嗯，雖然我不認為會有真的幽靈出現……"
1013803-22 = "總之這樣就抵消了欠我的人情，所以就跟我一起去吧？"
1013803-23 = "[s] 「嗯！我會保護你的！」"
1013803-24 = "唉……我到底為什麼……"
1013803-25 = "啊，公車來了。"
1013803-30 = "（就這樣到達了某個人煙稀少的地方……）"
1013803-31 = "從這裡再走一下就會有一所廢校。"
1013803-32 = "不知道是不是建築位置有問題，據說從建造的時候開始就不斷傳出可疑的尖叫聲。"
1013803-33 = "那個尖叫聲據說到現在還能聽到。"
1013803-34 = "去試膽的人很多都昏倒了，所以現在沒人敢靠近。"
1013803-35 = "[s] 「事前調查做得很認真呢。」"
1013803-36 = "要，要去的是什麼樣地方當然要查清楚啊！"
1013803-37 = "總之走吧！我們要證明沒有什麼幽靈！"
1013803-42 = "（就這樣進入了廢校內部……）"
1013803-43 = "[ns] 「哦……有點陰森呢？」"
1013803-44 = "這個廢校據說有七大不可思議。"
1013803-45 = "第一。在深夜，敲打走廊窗戶的聲音。"
1013803-46 = "第二。不存在的第十三階階梯。"
1013803-47 = "第三。有可疑影子走動的教職員走廊。"
1013803-48 = "第四。從教室窗戶看到的染血的櫻花樹。"
1013803-49 = "第五。從教室壞掉的喇叭響起的鐘聲。"
1013803-50 = "第六。從地下機房傳來的可疑尖叫聲。"
1013803-51 = "最後第七是……"
1013803-52 = "還沒有人知道的隱藏傳說。"
1013803-53 = "據說知道那個隱藏傳說就會受到可怕的詛咒……"
1013803-54 = "[s] 「全都是在哪裡聽過的故事呢。」"
1013803-55 = "是，是吧？是老套的怪談吧？"
1013803-56 = "總之，確認這些怪談之後拍照給前輩們看。"
1013803-57 = "反正什麼事都不會發生，肯定能證明沒有幽──"
1013803-61 = "……！？\n\n"
1013803-62 = "什，什，什麼……？"
1013803-66 = "咿咿……！！"
1013803-70 = "[ns] 「在深夜，敲打走廊窗戶的聲音……！」"
1013803-71 = "明，明明除了我們應該沒有人才對，是誰在敲！？"
1013803-72 = "[s] 「去確認一下吧。」"
1013803-73 = "……！！"
1013803-74 = "[s3] 「別擔心。」\n[s4] 「我絕對不會放開手的。」"
1013803-77 = "誰，誰擔心了！"
1013803-82 = "總，總之去，去確認一下吧！"
1013803-91 = "嘎！嘎！嘎！嘎……！"
1013803-95 = "什麼啊？是烏鴉啊……"
1013803-96 = "為什麼在啄窗戶？這裡看起來也沒有吃的。"
1013803-97 = "[s] 「難道不是烏鴉而是真的有幽靈……？」"
1013803-98 = "嚇啊啊……！怎麼可能！"
1013803-99 = "先拍照吧！要留下走廊的敲擊聲是烏鴉的證據。"
1013803-106 = "你看，拍得很清楚吧？周圍也沒有奇怪的東西。"
1013803-107 = "就這樣繼續確認七大不可思議吧！"
1013803-109 = "（雖然玲奈自信滿滿地說著，但緊握著我的手完全沒有放開……）"
1013803-111 = "[ns] （我也得注意不能放開……）"
1013803-113 = "（就這樣和玲奈確認廢校的七大不可思議）"
1013803-115 = "據說能看到可疑影子的走廊"
1013803-122 = "據說能看到染血櫻花樹的教室"
1013803-127 = "據說能聽到可疑尖叫聲的地下機房"
1013803-137 = "（就這樣，確認了所有七大不可思議的地方並拍照留證）"
1013803-138 = "（果然幽靈沒有出現……）"
1013803-140 = "呼……就說吧。沒有什麼幽靈。"
1013803-141 = "全部都是野生動物或者設施老舊造成的誤會。"
1013803-142 = "好！證據也有了，我們回去吧。趕快給前輩們看。"
1013803-143 = "[s5] 「雖然證明了沒有幽靈……」\n[s6] 「但還是繼續牽著手比較好吧？」"
1013803-146 = "那，那個……"
1013803-147 = "才，才不是因為害怕才牽的！"
1013803-148 = "是，是因為太暗，萬一摔倒就不好了！"
1013803-149 = "[s] 「嗯。摔倒會很危險。」"
1013803-151 = "（之後安全地把玲奈送到了狂獵學院）"
1013803-157 = "（以為就這樣順利結束了……）"
