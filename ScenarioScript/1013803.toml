[translation]
1013803-1 = "無法認同！"
1013803-2 = "（深夜，準時來到了約好的地點）"
1013803-5 = "這，這裡！老師！"
1013803-6 = "[s1] 「這種時間在公車站？」\n[s2] 「要去哪裡？」"
1013803-9 = "唔嗯，那個……"
1013803-10 = "現在……"
1013803-11 = "要去據說有幽靈出沒的廢校。"
1013803-12 = "[s] 「突，突然要去廢校！？」"
1013803-13 = "我，我也沒辦法啊！"
1013803-14 = "誰叫我已經答應前輩們要證明沒有幽靈了！"
1013803-15 = "[s] 「那樣的話，他們也會覺得有趣而跟來吧。」"
1013803-16 = "是我叫他們不要跟過來的。"
1013803-17 = "畢竟前輩們肯定又會做一些奇怪的惡作劇。"
1013803-18 = "而且有外出證的也只有我而已。"
1013803-19 = "但是……一個人去果然有點……"
1013803-20 = "[s] 「所以就找我來了嗎？」"
1013803-21 = "嗯，雖然我不認為會有真的幽靈出現……"
1013803-22 = "總之，這樣就算是還了欠我的人情，你就跟我一起去吧？"
1013803-23 = "[s] 「嗯！我會保護你的！」"
1013803-24 = "唉……我到底為什麼……"
1013803-25 = "啊，公車來了。"
1013803-30 = "（就這樣到達了某個人煙稀少的地方……）"
1013803-31 = "從這裡再往前一點，就會看到那間老舊的廢校了。"
1013803-32 = "聽說可能是因為位置的關係，從建造的時候開始就一直會傳出詭異的慘叫聲。"
1013803-33 = "而且就連廢校之後的現在也還能聽見。"
1013803-34 = "很多去試膽的人都被嚇到昏倒，所以現在已經沒有人敢靠近了。"
1013803-35 = "[s] 「事前調查做得很認真呢。」"
1013803-36 = "要，要去的地方是什麼情況，當然得查清楚啊！"
1013803-37 = "總之走吧！我們要證明根本沒有什麼幽靈！"
1013803-42 = "（就這樣進入了廢校內部……）"
1013803-43 = "[ns] 「哦……有點陰森呢？」"
1013803-44 = "據說這間廢校有七大不可思議。"
1013803-45 = "第一。在深夜敲打走廊窗戶的聲音。"
1013803-46 = "第二。不存在的第十三階階梯。"
1013803-47 = "第三。有可疑影子走動的教職員走廊。"
1013803-48 = "第四。從教室窗戶看到的染血的櫻花樹。"
1013803-49 = "第五。從教室壞掉的音響響起的鐘聲。"
1013803-50 = "第六。從地下機房傳來的可疑慘叫聲。"
1013803-51 = "最後第七是……"
1013803-52 = "還沒有人知道的隱藏傳說。"
1013803-53 = "聽說只要知道那個隱藏傳說，就會受到可怕的詛咒……"
1013803-54 = "[s] 「都是一些好像在哪裡聽過的故事呢。」"
1013803-55 = "對，對吧？就是那種很老套的怪談嘛？"
1013803-56 = "總之，我打算確認那些怪談之後，把照片拍給前輩們看。"
1013803-57 = "反正什麼事都不會發生，肯定能證明沒有幽──"
1013803-61 = "……！？\n\n"
1013803-62 = "什，什，什麼……？"
1013803-66 = "噫噫……！！"
1013803-70 = "[ns] 「在深夜敲打走廊窗戶的聲音……！」"
1013803-71 = "除，除了我們之外應該沒有其他人才對，到底是誰在敲啊！？"
1013803-72 = "[s] 「去確認一下吧。」"
1013803-73 = "……！！"
1013803-74 = "[s3] 「別擔心。」\n[s4] 「我絕對不會放開手的。」"
1013803-77 = "誰，誰擔心了啊！"
1013803-82 = "總，總之，去確認一下吧！"
1013803-91 = "嘎！嘎！嘎！嘎……！"
1013803-95 = "什麼嘛，原來是烏鴉啊……"
1013803-96 = "為什麼會啄窗戶呢？這裡看起來也沒有吃的啊。"
1013803-97 = "[s] 「難道不是烏鴉，而是真的有幽靈……？」"
1013803-98 = "嚇啊──！怎麼可能！"
1013803-99 = "總之先拍照吧！#n得留下走廊的敲擊聲是烏鴉的證據才行。"
1013803-106 = "你看，拍得很清楚吧？周圍也沒有奇怪的東西。"
1013803-107 = "就這樣繼續確認七大不可思議吧！"
1013803-109 = "（雖然玲奈說得自信滿滿，緊握著的手卻完全沒有放開……）"
1013803-111 = "[ns] （我也得注意不能放開手呢……）"
1013803-113 = "（就這樣繼續和玲奈確認廢校的七大不可思議）"
1013803-115 = "據說能看到可疑影子的走廊"
1013803-122 = "據說能看到染血櫻花樹的教室"
1013803-127 = "據說能聽到可疑慘叫聲的地下機房"
1013803-137 = "（確認了所有七大不可思議提及的地點，並拍下照片留證）"
1013803-138 = "（果然幽靈並沒有出現……）"
1013803-140 = "呼……我就說沒有什麼幽靈吧。"
1013803-141 = "全部都只是野生動物或設施老舊引發的誤會而已。"
1013803-142 = "好！既然證據都蒐集好了，我們就回去吧。#n得趕快拿給前輩們看才行。"
1013803-143 = "[s5] 「雖然已經證明沒有幽靈……」\n[s6] 「還是繼續牽著手比較好吧？」"
1013803-146 = "那，那個……"
1013803-147 = "才，才不是因為害怕才牽的！"
1013803-148 = "是，是因為這裡太暗的關係，萬一跌倒就糟糕了！"
1013803-149 = "[s] 「嗯。跌倒會很危險。」"
1013803-151 = "（之後安全地把玲奈送到了狂獵學院）"
1013803-157 = "（本以為事情會就這樣順利結束，然而……）"
