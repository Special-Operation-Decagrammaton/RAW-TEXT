[translation]
1013803-1 = "I Won't Accept It!"
1013803-2 = "I went to the meeting spot late at night."
1013803-4 = ""
1013803-5 = "O-Over here! Sensei!"
1013803-6 = "[s1] \"We're taking a bus? This late?\"\n[s2] \"Where are we going?\""
1013803-9 = "Well, the thing is..."
1013803-10 = "Starting now...we're going to..."
1013803-11 = "...investigate a school. An abandoned one. And people say it has ghosts."
1013803-12 = "[s] \"A haunted school?!\""
1013803-13 = "I-I have to!"
1013803-14 = "I told my seniors, the Occult Society, that I would prove that ghosts don't exist."
1013803-15 = "[s] \"That sounds up their alley. Why didn't they tag along?\""
1013803-16 = "I told them not to."
1013803-17 = "I'm sure they would pull some stupid prank again and try to scare me."
1013803-18 = "Also... I'm the only one with an approved outing pass."
1013803-19 = "But well... It's so late. And it's a little sketchy, you know. So I figured I shouldn't go alone..."
1013803-20 = "[s] \"So you called me?\""
1013803-21 = "Well, I doubt anything will happen, but still. No ghosts will show up."
1013803-22 = "If you want to pay me back for your...\"pants incident,\" this would help."
1013803-23 = "[s] \"Sure! I'll protect you!\""
1013803-24 = "*sigh* How did it come to this...?"
1013803-25 = "Ah. There's the bus."
1013803-30 = "It dropped us off in a secluded area."
1013803-31 = "The abandoned school is down this street."
1013803-32 = "It could be a coincidence, but the rumors say that its halls are plagued with mysterious screaming...and have been since the day the school opened."
1013803-33 = "...They say you can still hear the screams, even though there are no more students."
1013803-34 = "A few kids have even passed out while exploring it. That's why no one goes over here anymore."
1013803-35 = "[s] \"Such diligent research.\""
1013803-36 = "N-Naturally! You should always research where you're going."
1013803-37 = "We should get to it. Come on, let's prove that there's no such thing as ghosts!"
1013803-42 = "We entered the abandoned school."
1013803-43 = "[ns] \"Huh... Isn't this place a little creepy?\""
1013803-44 = "This school is said to house the \"Seven Mysteries.\""
1013803-45 = "First is loud knocking on the window in the middle of the night."
1013803-46 = "Second: there's a thirteenth stair that...also doesn't exist."
1013803-47 = "Third is an eerie shadow wandering around the faculty hallway."
1013803-48 = "A bloodstained cherry blossom pressed against a classroom window—that's the fourth mystery."
1013803-49 = "Fifth: the broken classroom speakers play the sound of a ringing bell."
1013803-50 = "Sixth, which we've already talked about—is general suspicious screaming originating from the basement's mechanical room."
1013803-51 = "And the seventh mystery..."
1013803-52 = "It's so mysterious that no one knows what it is."
1013803-53 = "They say that if you so much as LEARN what this mystery is, you'll be inflicted with a terrible curse."
1013803-54 = "[s] \"These sound like pretty typical ghost stories.\""
1013803-55 = "R-Right? Just...everyday ghost stories, right?"
1013803-56 = "And that's why I'll investigate all these silly rumors, take some photos, and show the others."
1013803-57 = "And, because NOTHING will happen, I'll finally prove that ghosts don't—"
1013803-58 = ""
