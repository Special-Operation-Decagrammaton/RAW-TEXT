[translation]
1007703-1 = "대단할 거 없는 일임다"
1007703-2 = "(업무차 이동하던 도중, 빠른 길을 가로지르려 쇼핑몰 안으로 들어왔다.)"
1007703-6 = "(쇼핑몰 한쪽 악기 상점의 쇼윈도 앞에서, 뭔가를 보고 있던 이치카와 마주쳤다.)"
1007703-7 = "……응?"
1007703-8 = "어? 선생님……? 무슨 일이심까? 이런 곳까지."
1007703-9 = "으음. 아닌가? 반대로 제가 왜 여기 있는지를 지금 설명해야 하는 타이밍일까……요?"
1007703-10 = "뭐, 아무려면 어때요. 이런 곳에서 또 보니 좋네요~."
1007703-11 = "……예?"
1007703-12 = "아아. 뭐 보고 있었느냐고요? 뭐, 그렇게 물어보실 거라고 생각하긴 했는데……."
1007703-13 = "그냥 뭐, 별건 아니고요. 그냥 기타를 좀 보고 있었달까……."
1007703-14 = "……? 기타에 관심이 있냐고요? 아뇨? 오늘 아침까지는 전혀 생각도 안 하고 있었는데요."
1007703-15 = "쳐 보기는커녕 만져 본 적도 없는걸요."
1007703-19 = "아하하. 뭐, 그런 표정 지으실 것 같긴 했지만서도."
1007703-20 = "진짜 그냥……. 뭐랄까, 오는 길에 거리에서 기타를 연주하고 있던 사람들을 좀 봐서요."
1007703-21 = "그렇게 막 대단한 관심을 받고 있었던 건 아니지만, 그래도……."
1007703-22 = "꽤 멋있지 않나요? 남들이 뭐라 하건 스스로 하고 싶은 게 있고. 그걸 위해서 열중하는 모습."
1007703-23 = "보다 보니 뭔가 저도 '한 번 해봐야 하나'라는 생각이 들어서요. 그래서 보고 있었어요."
1007703-24 = "그런데 이렇게 막상 와서 보니……."
1007703-25 = "……하하."
1007703-26 = "역시 잘 모르겠네요. 별로 치고 있다고 해서 대단히 즐거울 것 같지도 않고, 엄청 열심히 할 것 같지도 않고……."
1007703-27 = "그렇지만 혹시 모르지 않겠슴까? 한번 해보면 전에 없던 흥미가 팍! 하고 생겨서!"
1007703-28 = "…………."
1007703-29 = "농담이에요. 그런 일은 웬만해선 없겠죠. 여태 없었으니까요."
1007703-30 = "어쩌면……."
1007703-31 = "그런 걸 찾는 것도, 재능이 필요한 일인지 모르겠네요."
1007703-35 = "……네?"
1007703-36 = "그래도 한 번 쳐 보는 게 어떠냐고요? ……어째서죠?"
1007703-37 = "……듣고 싶으시다고요? ……뭘요?"
1007703-38 = "……기타 연주를?"
1007703-39 = "제가……?"
1007703-40 = "……선생님께?"
1007703-41 = "어……."
1007703-45 = "으에엑-!! 됐슴다! 무슨 생각지도 않은 말씀을……! 갑자기 그렇게 들어오시는 검까?"
1007703-46 = "방금 막 말씀드렸잖슴까? 쳐 본 적은커녕 잡아본 적도 없다고! 창피라도 주시려고요?"
1007703-47 = "[s1] \"그냥 가볍게 시작해 보라는 뜻이었어.\"\n[s2] \"같이 시작해 보자는 의미에서 한 말이야.\""
1007703-50 = "아니, 그래도, 그……. 그런 이야기가 아니라……."
1007703-51 = "갑자기 그런 식으로 말씀하셔도……. 진짜로 부담스러운데요, 좀."
1007703-52 = "아무리 먼저 '해보고 싶다'라고 말했다곤 해도……."
1007703-53 = "역시 좀……. 그게……."
1007703-54 = "음……. 으음……."
1007703-55 = "……끄응."
1007703-56 = "……에이, 뭐. 모르겠다! 어떻게든 되겠지! 선생님이 먼저 듣고 싶다고 하신 거니까요."
1007703-57 = "대신 나중에 연주가 별로라느니 그런 소리 하기 없기임다! 확실하죠!?"
1007703-58 = "[s3] \"물론이지. 그런 말 안 해.\"\n[s4] \"편하게 해, 편하게.\""
1007703-61 = "그, 그럼……. 일단 초보자용, 제일 싼 걸로……!"
1007703-67 = "(이치카는 가게로 들어가, 쇼 윈도에 전시돼 있던 통기타 하나를 구입했다.)"
1007703-68 = "(기타 가방을 등에 멘 채, 근처 강변으로 터덜터덜 걸어갔다.)"
1007703-70 = "음……. 기타……. 진짜 기타네……."
1007703-71 = "그냥 상상만 하고 있었던 건데, 정말로 이렇게 기타를 들고 강변으로 나왔네요. 보란 듯이 악보까지 들고."
1007703-72 = "누가 보면 기타 고수인 줄 알겠슴다. 초보자용인데. 하하."
1007703-73 = "그렇지만 뭐, 악보도 있고 치는 방법도 책에 나와 있고……."
1007703-74 = "막상 여기서 하라고 하는 대로 하면, 어떻게 되지 않을……? 까요?"
1007703-75 = "[s5] \"그렇게 간단한 건 아니지만…….\"\n[s6] \"뭐, 가볍게 접근하는 게 좋지.\""
1007703-78 = "대충 그러니까……. 이런 식으로 쥐고……."
1007703-79 = "코드가~. 보자~ 이쪽에~ 흠~."
1007703-80 = "……이렇게 당기면."
1007703-84 = "……이런 식이려나요?"
1007703-88 = "[ns7] \"정말로 처음 쳐 보는 거야?\"\n[ns8] \"그렇게 간단하게……?\""
1007703-91 = "네? 네, 뭐……."
1007703-92 = "에이, 어려울 게 뭐 있겠슴까. 초보자용이기도 하고."
1007703-93 = "가이드북 보면서 하면 보통은 다 어느 정도 되지 않나요? 요리든, 기계든, 그림이든……."
1007703-94 = "악기라고 뭐 다를 건 없잖아요? 결국, 다 사람 쓰라고 만들어 둔 건데……."
1007703-95 = "하라는 대로 하기만 하면 되는 것. 별거 아니죠."
1007703-96 = "가끔 응용해서 뭔가 한다 할 만한 것도, 결국 기본적인 방법에서 재량을 좀 더한 것뿐."
1007703-97 = "전혀 대단할 거 없는 일이라고 보는데요."
1007703-98 = "……네?"
1007703-99 = "그래도 대단하다고요?"
1007703-100 = "……주변에서 그런 말 들은 적 없냐고요? 뭐든 잡으면 잘한다든가……?"
1007703-101 = "뭐……. 없다고는 못하겠지만……."
1007703-102 = "하하. 됐네요. 그렇게 말해 주셔도 더 뭐 나오는 건 없슴다만?"
1007703-103 = "그것보다 연습이나 좀 더 해 볼까요? 선생님만 괜찮으시다면……."
1007703-107 = "여기, 책에서 몇 곡 골라 주시죠. 지금 쳐보도록 할 테니."
1007703-110 = "(이후 강변에서 이치카의 기타 연주를 들으며 시간을 보냈다.)"
1007703-111 = "(이치카는 처음 해 보는 연주라고 말했지만, 전부 하나같이 훌륭한 연주들뿐이었다.)"
