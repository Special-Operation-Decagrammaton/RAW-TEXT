10028010-185 = "후우~."
10028010-186 = "아무튼 짐도 이걸로 마지막이네요! 간만에 땀 좀 뺐다!"
10028010-187 = "선생님도 고생 많으셨어요. 정의실현부……. 아니, 트리니티를 대신해 감사드립니다."
10028010-188 = "평소라면 제가 뭐라고 대표를 하겠냐만……. 오늘은 입장이 입장이니까요!"
10028010-189 = "더욱 좋은 모습 보여 드려야죠! 하하!"
10028010-190 = "[s1] \"이치카도 수고 많았어.\"\n[s2] \"먼 곳까지 와서 고생한 건 마찬가지지.\""
10028010-193 = "에이~. 고생은 제가 무슨 고생이에요. 고생은 선생님과 이곳 발굴팀 분들이 다 해 주셨죠."
10028010-194 = "저는 발굴하신 걸 가지러 온 김에 정리나 좀 도운 게 전부고……."
10028010-195 = "그나저나 신기하네요. <티파티 최초의 회합에서 사용된 찻잔 세트>라니."
10028010-196 = "이건 진짜 중요한 교보(校寶)인데 말이죠. 용케도 이런 게 아직도 안 부서지고 남아 있었네요?"
10028010-197 = "그것도 트리니티 자치구로부터 이렇게나 멀리 떨어진 곳에……."
10028010-198 = "……네?"
10028010-199 = "아아. 중요한 찻잔이란 건 알고 계셨지만, 정확히 어떤 의미인지까지는 못 들으셨다고요?"
10028010-200 = "하하, 티파티 분들도 참……. 이런 일을 부탁하면서 설명도 제대로 안 해주셨슴까……."
10028010-201 = "뭐, 딱히 기밀도 아니고 말씀드리기 어려운 일도 아니니……. 음~."
10028010-202 = "……역시 '정통성'이죠."
10028010-203 = "아시겠지만 최근 이런저런 일들이 있었다 보니, 티파티 분들도 구호기사단 분들이나 시스터후드 분들과의 대화가 좀 불편해지신 것 같더라고요."
10028010-204 = "그런 상황에서 이런 유물의 발견은 꽤 크잖아요? '우리가 이만큼 오래됐고 근본이 있다'라는 이미지를 보여줄 수 있으니까."
10028010-205 = "그러니 티파티에서도 구태여 다른 사람도 아닌 선생님께 이렇게 발굴 작업 참여를 부탁드린 걸 거고 말이죠."
10028010-206 = "애초에 지금 제가 여기 오게 된 것도, 그렇게 고생하는 선생님을 보필하란 의미고."
10028010-207 = "……즉! 다시 말하자면~"
10028010-208 = "오늘 하루는 제가 선생님의 요구를 뭐든 다~ 들어드린다~ 이 말씀!"
10028010-209 = "아시겠슴까? 자주 오는 기회가 아니라고요? 그러니 시키실 일 있으시면 뭐든지 편하~게 시키십쇼!"
10028010-210 = "어차피 전 선생님을 위해서 온 거니까!"
10028010-211 = "[s3] \"든든한걸. 고마워, 이치카.\"\n[s4] \"신세 좀 질게. 잘 부탁해.\""
10028010-214 = "후후후. 선생님께 그런 말도 다 듣고, 기분 좋네요! 역시 오길 잘한 것 같아요."
10028010-215 = "한 번쯤 함께 일해보고 싶다고 생각했거든요, 선생님이랑."
10028010-216 = "츠루기 선배나 하스미 선배, 마시로도 선생님 이야길 곧잘 했었고……."
10028010-217 = "……아. 다 좋은 이야기였으니 혹~시라도 걱정은 하실 필요 없슴다."
10028010-218 = "좋은 분이다, 마음이 편해지는 분이다……. 뭐 이래저래 그런 내용들이었으니까요."
10028010-219 = "아무튼 그러다 보니 같이 일하는 건 어떤 느낌일지 궁금하더라고요. 내심 기대도 되고."
10028010-220 = "그렇지만 제가 주로 맡는 업무상 사실 별로 뵐 기회는 없었고……."
10028010-221 = "……네?"
10028010-222 = "언제든지 편하게 연락해도 괜찮으시다고요?"
10028010-223 = "……하하."
10028010-224 = "말씀은 감사하지만, 그런 식으로 귀찮은 아이가 되고 싶지는 않은데요."
10028010-225 = "선생님이 아니라고 하셔도, 상황이 그러면 결국 보기에 그런 거 아니겠습니까."
10028010-226 = "…애초에 '손이 많이 가는 아이'가 되고 싶지는 않다-는 이야기예요."
10028010-227 = "대신 이런 식으로 기회가 될 때에만 조금씩."
10028010-228 = "어떻게 보면……. 약간의 사적인 기분도 담아서?"
10028010-232 = "……하하."
10028010-233 = "이상한 소리 해버렸네요. 짐이나 마저 정리하죠."
10028010-238 = "어디 보자……. 슬슬 장비 쪽 정리는 거의 다 끝났고……."
10028010-239 = "……네?"
10028010-240 = "아, 찻잔 세트요? 하얀 가방에 들어 있던 그거 말씀하시는 거죠?"
10028010-241 = "걱정하지 마시죠! 그러잖아도 짐 정리 전에, 혹시나 해서 확인해 봤었거든요."
10028010-242 = "이미 열차 화물칸에 잘~ 실려 있더라고요. 선생님은 저랑 같이 타기만 하시면 돼요."
10028010-247 = "……예?"
10028010-251 = "갑자기 웬 화물칸이냐고요? 그건 또 무슨……."
10028010-252 = "기차로 돌아가시는 거 아니었나요? 저도 같이 타고……?"
10028010-253 = "……예?"
10028010-254 = "지금이 아니라 3시간 뒤 기차……라고요?"
10028010-255 = "6시 10분……?"
10028010-260 = "지금은 3시임다만……?"
10028010-261 = "어라, 잠시만요. 지금 뭔가 좀 이상한데."
10028010-262 = "분명히 제가 올 때 받은 일정표로는 이제 곧 출발할 시간이……."
10028010-266 = "……아니 잠깐만요. 지금 그게 중요한 게 아니고."
10028010-267 = "그럼 방금 아까 가방이 실려 있던 기차는……?"
10028010-272 = "지역에 계신 분들께 안내방송 드립니다."
10028010-273 = "이제 곧, <게헨나 행 고속열차>, 게헨나 행 고속열차가 기차역에서 출발하겠습니다."
10028010-274 = "승객 여러분께서는 표를 꼭 지참하고 기차역으로 오셔서, 열차가 출발하기 전 모두 지정된 자리에 착석해 주시기 바랍니다."
10028010-275 = "다시 한번 안내방송 드립니다. 이제 곧 게헨나 행 고속열차. 게헨나 행 고속열차가 출발하겠……."
10028010-280 = "……게……."
10028010-282 = "……어디요?"
