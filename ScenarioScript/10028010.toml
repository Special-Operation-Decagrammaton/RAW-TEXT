10028010-50 = "……들어오세요."
10028010-57 = "실례합니다~. 하스미 선배. 부르셨슴까?"
10028010-58 = "네. 이치카. 제때 와 주었군요."
10028010-59 = "잠은 잘 잤나요? 이른 아침부터 불러내서 미안해요."
10028010-60 = "아뇨, 뭐. 전혀 문제없슴다! 잠은 잘~ 잤으니까요! 하하!"
10028010-61 = "그보다 오히려 이렇게 이른 아침부터 부르신 걸 보니……. 역시 무슨 일 있나 보죠?"
10028010-62 = "사건이 발생한 건 아니지만 '일'이라고 하면 맞는 이야기겠군요."
10028010-63 = " 츠루기와도 논의해 보았는데, 이 건은 역시 이치카가 가장 적임자라고 생각해서요."
10028010-64 = "네? 츠루기 선배랑 논의……? 제가 '적임자'……라고요?"
10028010-65 = "저기, 대체 무슨 일이기에……."
10028010-66 = "아, 부담 주려는 뜻은 아니었어요. 일 자체는 그리 위험하거나 어려운 일도 아니고요."
10028010-67 = "중요한 가방이 하나 있어서, 그것을 가지고 티파티로 가주기만 하면 되는 일이거든요. 오늘 안으로."
10028010-68 = "다만 그게 지금 트리니티 자치구로부터 꽤 떨어진 곳에 있는 상황이라……."
10028010-69 = "아무래도 다른 자치구의 학생들과도 잘 지내고 성격도 좋은 이치카가 적합할 것 같네요."
10028010-70 = "저나 츠루기가 가는 거보다는……. 그편이 원만하고 융통성 있게 일을 해결할 수 있겠죠."
10028010-71 = "아~. 이해했슴다. 난 또 뭐라고……. 그러니까 심부름 같은 거군요?"
10028010-72 = "그렇다고도 볼 수 있지만, 말씀드렸듯, 평범한 심부름치고는 '중요한' 사안이지요."
10028010-73 = "가방 안에 들어있는 물건은, 우리 티파티와 트리니티에 중요한 유물이거든요."
10028010-75 = "……티파티의 나기사님께서 직접 가져오라고 말씀하신 만큼이요."
10028010-76 = "굳이 따지자면……."
10028010-83 = "……\"트리니티 내 티파티의 정치적 입지에 영향을 줄 정도\"로, 중요한 유물이에요."
10028010-88 = "심부름이라는 말 죄송합니다."
10028010-89 = "……아."
10028010-90 = "그리고 또 한 가지……."
10028010-91 = "어쩌면 그 가방만큼이나 중요한 부분입니다만……."
10028010-95 = "가방을 회수해서 돌아오실 때, 아마도 선생님과 같은 기차로 함께 오게 될 거예요."
10028010-96 = "괜찮다면……. 오시는 길 선생님께서 편히 오실 수 있도록, 보좌를 좀 부탁해도 될까요?"
10028010-97 = "그 유물의 발굴 작업, 선생님께서 저희를 위해 직접 같이 참여해 주셨거든요."
10028010-98 = "하다못해 오시는 길만이라도 편하게 만들어 드리고 싶다는 게, 제 개인적인 생각이에요."
10028010-102 = "……네?"
10028010-103 = "선생님이요? ……선생님이 거기 계신 건가요?"
10028010-104 = "물론 이건 지시사항은 아니에요. 정의실현부로서 내리는 지시는 어디까지나 가방 쪽만."
10028010-105 = "그 일이 가방을 가져오는 데 조금이라도 방해가 된다면, 당연히 없었던 일로 해도 좋아요."
10028010-111 = "어떤가요? 이치카가 보기에는……. 괜찮겠어요?"
10028010-112 = "흐음……."
10028010-113 = "네, 일단은 이해했습니다. 잠시만요. 생각을 좀 해보고……."
10028010-114 = "선생님……. 선생님이라……."
10028010-115 = "가방……. 선생님……. 기차……. 음……."
10028010-116 = "……히히."
10028010-117 = "좋을 거 같은데요? 오는 길에 대화 상대도 생기는 거고. 전부터 선생님이랑 제대로 뵙고 싶기도 했었고."
10028010-118 = "뭐……."
10028010-119 = "별일이야 있겠어요? 그냥 가방만 가지고 오는 건데."
10028010-125 = "저한테 맡겨주십쇼!!"
10028010-127 = "……라는 것이, 오늘 아침의 일이었고요~."
10028010-128 = "영……차."
