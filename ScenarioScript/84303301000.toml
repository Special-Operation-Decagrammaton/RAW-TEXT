[translation]
84303301000-5 = "감사합니다…… 하마터면 공들여 만든 게임을 모두 날릴 뻔했어요……."
84303301000-6 = "왜, 왜 이렇게 된 거야…… 분명 어제까지만 해도 모두 기대에 차 있었는데……!"
84303301000-7 = "분명 게임은 그대로인데…… 유즈도 눈에 보이는 코드는 달라진 게 없다고 했는데……."
84303301000-9 = "타락의 힘이 섞인 게 분명합니다. 하지만 우리를 도와주러 온 도적님이 해결해 주셨습니다!"
84303301000-10 = "세이아 씨는 분노의 힘에 잠식되지 않았습니다! 어쩌면 세이아 씨가 답을 알고 계실지도 모릅니다!"
84303301000-15 = "……!! 정말?"
84303301000-16 = "괜찮……으셨나요??"
84303301000-17 = "아니, 그 이전에…… 아리스 쨩? 이분은 대체……"
84303301000-19 = "아, 죄송해요. 제 소개가 늦었네요."
84303301000-20 = "저는 트리니티 종합학원, 티파티의 유리조노 세이아라고 합니다. 그리고 저희 학우분들을 통솔할 입장이기도 해서……"
84303301000-21 = "이번 일은 여러분의 일임과 동시에 제 일이기도 했어요. 그러니 신경 쓰지 않으셔도 됩니다."
84303301000-22 = "오히려 저희 학우분들이 여러분의 소중한 작품을 부술 뻔한 점에 대해 사과드려요."
84303301000-27 = "통솔……? 왜 통솔을…… 티파티는 또 뭐야?"
84303301000-28 = "글쎄……"
84303301000-30 = "일종의 학생회 같은 것입니다. 밀레니엄으로 치면…… 세미나 같은 곳이겠네요."
84303301000-35 = "아하! 유우카 같은 분이었군요! 이해했어요!"
84303301000-36 = "아니, 뭔가 느낌이 조금 더 높은 분 같은 기분이……"
84303301000-38 = "(제가 괜찮았던 건, 전 처음부터 리오에게 언질을 받아 게임에 문제가 생겼단 걸 알았기 때문이겠지요.)"
84303301000-39 = "(아무것도 모르고 접근했다면…… 다른 학우분들과 큰 차이 없는 반응이었을 거 같네요.)"
84303301000-46 = "……!! 그럴 수가, 평범한 도적인 줄 알았는데, 왕도적이셨던 건가요!?"
84303301000-51 = "아리스……!?"
84303301000-52 = "이야기가 갑자기 커지는 것 같은데……. 생각하시는 것과는 조금 다를 수 있어요."
84303301000-53 = "그리고 저 또한 이런 일에 대비하고자 하는 다른 분의 일을 돕고 있는 것뿐이에요. 대단한 사람이 아닙니다."
84303301000-54 = "……!!"
84303301000-55 = "그렇군요. 도적을 보낸 현자가 따로 있었던 거군요!"
84303301000-56 = "그럼 그 현자께서 세이아 씨를 보내신 겁니까? 저희에게 생길 사고를 미리 예상한 건가요!"
84303301000-58 = "……!!"
84303301000-59 = "그, 그런……!?"
84303301000-61 = "……어느 정도는 사실이에요."
84303301000-62 = "그리고 자세히 설명드리진 못하지만……. 여러분이 무고하다는 것을 증언하는 일도 함께할 예정이지요."
84303301000-63 = "우선은 조사가 필요합니다. 그러니 혹시 괜찮으시다면……. 저도 게임을 하나 받아 갈 수 있을까요?"
84303301000-68 = "어? 우, 우리의 게임? 괜찮을까……?"
84303301000-69 = "저희는 상관없지만…… 아니, 오히려 정말로 감사하지만…… 코드를 보실 수 있는 거예요?"
84303301000-71 = "아니요. 제가 할 순 없지만, 아까도 말씀드렸듯 할 수 있고 신뢰할 만한 분께 전달할 수는 있으니까요."
84303301000-75 = "……'현자'님께 말이죠."
