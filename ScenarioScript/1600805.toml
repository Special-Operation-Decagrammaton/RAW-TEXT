[translation]
1600805-1 = "게으른 경찰의 잠복근무"
1600805-2 = "블랙마켓, 무기거래소 앞"
1600805-5 = "늦었잖아, 선생!"
1600805-6 = "게으름 부리다가 범인을 놓치면 어쩌려고 그러는 거야?"
1600805-7 = "잠복 현장에서의 1분 1초는 목숨과도 같다고!"
1600805-8 = "[s] \"후부키가 갑자기 의욕을 내다니, 이상하네.\""
1600805-9 = "이상할 게 뭐 있어? 발키리 경찰학교의 학생이 범인 체포에 의욕을 내는 건 당연한 일이잖아."
1600805-10 = "범인이 나타나는 장소라면 언제 어디라도 대기하는 것이 올바른 경찰의 자세지!"
1600805-11 = "[s] \"평소에 하던 말이랑 다르잖아.\""
1600805-12 = "어, 그건 그러니까……."
1600805-13 = "자, 자. 사소한 건 신경 쓰지 말자고. 중요한 건 범인을 체포하는 일이니까."
1600805-14 = "[s] \"범인은 어떤 옷을 입고 있어?\""
1600805-15 = "범인의 인상착의?"
1600805-16 = "어, 그게 그러니까……"
1600805-17 = "……적당히 수상한 양복을 입고 있지 않을까? ……아마도."
1600805-18 = "[s1] \"아마도?!\"\n[s2] \"그걸로 범인을 잡을 수 있겠어?\""
1600805-19 = "괜찮아, 괜찮아. 잠복근무에서 중요한 건 범인의 인상착의보다 진득하게 한자리에 앉아 기다릴 수 있는 지구력이거든."
1600805-20 = "괜찮아, 괜찮아. 잠복근무에서 중요한 건 범인의 인상착의보다 진득하게 한자리에 앉아 기다릴 수 있는 지구력이거든."
1600805-21 = "그 지구력을 유지하기 위해서는 꼭 필요한 준비물이 있어."
1600805-22 = "선생은 여기서 기다리고 있어. 내가 곧 근처에서 준비물을 가지고 올게."
1600805-29 = "오래 기다렸지, 선생?"
1600805-30 = "[s] \"손에 든 건 무슨 박스야?\""
1600805-31 = "응? 보면 몰라? <마스터 도너츠>의 박스 세트야."
1600805-32 = "오늘은 선생도 함께니까 특별히 두 박스나 구입했어!"
1600805-33 = "오랫동안 범인을 관찰하고 있으려면 당분이랑 카페인이 쉽게 떨어지니까. 잠복근무 중에는 간식비가 무제한으로 제공되거든."
1600805-34 = "게다가 작전 중이라는 핑계로 전화기를 꺼두어도 괜찮으니…… 느긋하게 도넛을 즐기기엔 이만큼 좋은 환경도 없지!"
1600805-35 = "[s] \"처음부터 목적은 그거였구나…….\""
1600805-36 = "선생, 옆으로 비켜 봐."
1600805-37 = "보닛 위에 도넛을 놓을 자리를 마련해야 하니까."
1600805-38 = "후후, 그럼 본격적인 잠복근무를 시작해볼까?"
1600805-41 = "[wa:450]― 하아…… [wa:2000]이거야말로 [wa:400]천국……"
1600805-44 = "― 따뜻한 [wa:750]보닛 [wa:900]위에서, [wa:1600]도넛에 [wa:1100]커피까지……"
1600805-46 = "― 이야, [wa:1400]잠복근무는 [wa:500]최고야!"
1600805-49 = "[ns] \"그렇게 앉아 있으면 잠복의 의미가 없지 않을까…….\""
1600805-50 = "[wa:500]― 아, [wa:1300]선생. [wa:2000]주변을 잘 지켜봐야 해."
1600805-52 = "[wa:300]― 이러고 있는 [wa:500]사이에, [wa:1800]범인이 [wa:500]지나갈 지도 모르니까 말이지."
1600805-55 = "[wa:1000]― (냠. [wa:1000]우물[wa:600]우물…….)"
1600805-58 = "[wa:1700]― 역시 [wa:1100]커피와 [wa:500]함께 먹는다면,"
1600805-60 = "― 올드 패션드가 [wa:1200]최고네…… [wa:1400]후훗."
1600805-63 = "[wa:250]― 응? [wa:1150]왜 그래, 선생?"
1600805-65 = "[wa:1400]― 도넛, [wa:300]먹고 싶어?"
1600805-68 = "으음…… 결국 범인은 안 나타났네."
1600805-69 = "[s] \"도넛을 먹느라 놓친 거 아냐?\""
1600805-70 = "그럴 리가 없어! 눈은 도넛을 향하고 있어도 내 예리한 육감은 줄곧 주위를 향하고 있었는걸."
1600805-71 = "하는 수 없지. 범인을 잡기 위해 다시 잠복근무를 지원하는 수밖에……."
1600805-72 = "대신 다음번 잠복근무 때는 설탕을 듬뿍 묻힌 글레이즈드 도넛을 먹자!"
1600805-73 = "[s] \"역시 목적이 잘못되지 않았어?!\""
