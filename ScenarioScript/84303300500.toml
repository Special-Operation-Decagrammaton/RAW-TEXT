[translation]
84303300500-5 = "안녕하세요. 저기……"
84303300500-6 = "어, 어째서…… 어째서 이런 일이……"
84303300500-7 = "……??"
84303300500-8 = "(뭐, 뭐죠. 분위기가 이상한데……?)"
84303300500-9 = "이럴 리가, 이럴 리가 없는데……! 분명 어제까지는 이러지 않았는데……?!"
84303300500-10 = "괜찮으신가요……? 혹시 무슨 일이라도……"
84303300500-11 = "아, 아아……!"
84303300500-12 = "죄송해요. 죄송해요! 저희는 절대 그런 의도로…… 아니 애초에 그렇게 만들지 않았는데……!"
84303300500-13 = "진정하세요. 저는 여러분을 탓하려는 게 아닙니다."
84303300500-14 = "그보다 지금 상황을 알려주실 수 있을까요? 뭔가 밖이……"
84303300500-19 = "소란……스러운 것 같기도 하고……"
84303300500-20 = "지, 지금 밖에서 큰 싸움이 벌어지고 있어요."
84303300500-21 = "정확한 이유는 모르겠지만…… 아마도 저희 게임을 플레이하고 난 분들이 싸움을 벌이신 거 같아요."
84303300500-22 = "게임을 한 뒤에…… 갑자기 싸움을 벌인다고요?"
84303300500-23 = "이상해요. 저희가 만든 것과는…… 아니, 물론 그렇게 만들긴 했지만 그렇게 만든 건 아닌데……!"
84303300500-24 = "이, 이상하게 들리시겠지만 정말이에요! 이건 저희의 의도가 아니에요……!"
84303300500-25 = "알겠으니 우선 이곳에서 쉬고 계세요. 너무 걱정하진 마시고요."
84303300500-26 = "제가 대신 상황을 보고 오겠습니다."
