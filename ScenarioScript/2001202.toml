[translation]
2001202-1 = "부상자는 데려갑니다"
2001202-2 = "(학생들이 걱정됐기에 세나가 말한 싸움 현장을 찾아갔다.)"
2001202-3 = "(게헨나에선 드문 일도 아니었겠지만, 이번 건은 꽤 컸는지 여기저기 기절한 학생들이 보였다.)"
2001202-6 = "(……기절한 학생들 사이로, 응급의학부 부원들을 지휘하던 세나의 모습이 보인다.)"
2001202-7 = "……시체……. 아니 실례. 부상자는 구급차에 적재. 걸을 수 있는 사람들은 우선 부축해서 저쪽에서 대기."
2001202-8 = "걷기 귀찮아서 기절한 척한 학생은 사격해서 정말로 기절 상태인지 확인해 봐도 좋습니다."
2001202-9 = "……지금 실시합니다."
2001202-11 = "실시!!"
2001202-16 = "으아아악!! 알았어, 알았다고!! 걸으면 되잖아, 걸으면!!"
2001202-17 = "아무리 그래도 환자를 쏘다니……! 미친 거 아냐!?"
2001202-18 = "……그리고 이송을 마친 부원들은 다시 여기로 집합하십시오."
2001202-19 = "아직 싸움이 끝나지 않은 상태니 시체……. 아니, 부상자가 더 발생할 겁니다. 차후 대응을……."
2001202-23 = "……상황 정지합니다."
2001202-24 = "상황 정지!!"
2001202-25 = "저는 잠시 이탈하겠습니다. ……여러분은 정책대로 하던 작업 계속 재개하십시오."
2001202-26 = " ……다시 실시."
2001202-27 = "실시!!"
2001202-34 = "……실례했습니다. 선생님 아니십니까. 여긴 어쩐 일로……?"
2001202-35 = "메시지를 보내 드렸을 텐데요. 여긴 소란스러운 상황이니, 다른 쪽으로 이동하시라고……."
2001202-36 = "……네?"
2001202-37 = "걱정이 돼서 와 보셨다……라고요?"
2001202-38 = "……아."
2001202-39 = "……음. 그렇군요. ……하긴 선생님이시라면 오히려 입장 상 무시하기도 어려우실 테니."
2001202-40 = "공연히 선생님을 불러들인 상황이 돼 버린 것이군요. 죄송합니다. 제 판단 미스였습니다."
2001202-41 = "앞으로 선생님께 이런 유의 문자는 예외처리하도록 하겠습니다."
2001202-42 = "음? 그런 이야기가 아니라고요?"
2001202-43 = "신경 쓰지 말라……는 말씀입니까? 그치만……."
2001202-44 = "……아닙니다. 네. 선생님께서 그렇게 말씀하신다면, 이 건에 대해선 현행을 유지하는 것으로."
2001202-45 = "……네? 일이 많아서 힘들겠다고요?"
2001202-46 = "말씀은 감사하지만 제 쪽은 신경 써 주실 필요 없습니다. 그저 늘 하던 일을 계속하는 것뿐이니까요."
2001202-47 = "이번 경우엔 확실히 싸움이 길어져서 예상보다 시체……."
2001202-48 = "……부상자 수가 많긴 하지만……."
2001202-49 = "그것도 조금 있으면 선도부가 와서 진압하겠지요. 싸움의 양상이 어떻든, 저희 알 바는 아니고요."
2001202-50 = "때마침 선도부도 도착하는군요."
2001202-56 = "상황 발견! 여기다! 전부 체포다!!"
2001202-57 = "모두 쓸어버려!! 와아아아아-!!"
2001202-67 = "……보시는 대로."
2001202-68 = "[s1] \"늘 이런 식이구나.\"\n[s2] \"응. 언제나의 게헨나네.\""
2001202-69 = "그렇습니다. 그리고 저희 또한 늘 그저 부상자와 관련된 일을 하는 것일 뿐."
2001202-70 = "그렇습니다. 그리고 저희 또한 늘 그저 부상자와 관련된 일을 하는 것일 뿐."
2001202-71 = "주어진 일 밖의 일들까지 일일이 신경을 쓰다 보면, 게헨나에선 할 수 있는 일이 없거든요."
2001202-72 = "……그럼 다시 본래 업무로 돌아가서……."
2001202-73 = "잠깐!"
2001202-79 = "거기, 멈춰. 응급의학부인가?"
2001202-80 = "부장인 히무로 세나입니다. 무슨 용무라도 있으신지?"
2001202-81 = "아. 부, 부장? 그, 그렇군요……. 실례했습니다."
2001202-82 = "아무튼 거기 누워 있는 부상자 중 한 명 때문에 찾아왔습니다. 사건 주모자 중 하나거든요."
2001202-83 = "……음. 네, 그렇군요."
2001202-84 = "……그래서?"
2001202-85 = "……? 네? 그래서……라뇨?"
2001202-86 = "그래서 그걸 왜 물으신 건지 다시 여쭙는 것입니다만."
2001202-87 = "그, 그야 데려가서 심문도 해야 하고 하니……. 신원을 양도해 달라는 거죠……?"
2001202-88 = "……거절합니다."
2001202-89 = "……네?"
2001202-90 = "응급의학부는 부상자를 맡은 그 순간부터 부상자를 '응급의학부 담당'으로 판단합니다. 예외는 없습니다."
2001202-91 = "해당 학생에 대한 조치는 치료가 끝난 퇴원 후 진행하십시오."
2001202-92 = "아니, 그게 무슨 말도 안 되는……. 이쪽은 일의 전말을 조사할 필요가 있다고!"
2001202-93 = "안 되겠어. 일단 힘으로라도 데려가야……."
2001202-94 = "……그렇습니까."
2001202-100 = "[ns] \"……세나?\""
2001202-103 = "……이분도 기절했군요."
2001202-104 = "의식 없는 환자 한 명 추가입니다. 즉시 구급차로 이송하십시오."
2001202-105 = "……지금 실시합니다."
2001202-106 = "실시!!"
2001202-110 = "[ns3] \"이래도 괜찮아?\"\n[ns4] \"이거 거의 납치 아냐?\""
2001202-111 = "괜찮습니다. 유탄 충격으로 기절시켰을 뿐 상처를 낸 것은 아니니까요."
2001202-112 = "괜찮습니다. 유탄 충격으로 기절시켰을 뿐 상처를 낸 것은 아니니까요."
2001202-113 = "조용히 일을 처리하려면 이 방법이 가장 확실하기도 하고요."
2001202-114 = "……음."
2001202-121 = "그럼 이제 대략적인 시체 적재는 마무리된 것 같고……."
2001202-122 = "[s5] \"또 단어 헷갈렸어, 세나.\"\n[s6] \"습관적이구나, 그 단어…….\""
2001202-127 = "죄송하지만, 오늘은 일을 마무리 지어야 해서 이만 물러나겠습니다."
2001202-128 = "그럼……."
2001202-134 = "[ns] \"…….\""
2001202-136 = "(그렇게 '부상자'들을 모두 차에 싣고, 세나와 응급의학부 부원들은 모두 사라졌다.)"
