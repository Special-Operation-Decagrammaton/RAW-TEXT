[translation]
10051020-1 = "제2화;임무의 자격"
10051020-2 = "백귀야행의 제38번 구교사의 어느 교실"
10051020-3 = "……해서 이런 이유로, 우리 인법연구부가 디자이너 샤인캣 씨의 경호를 맡게 되었다는 이야기!"
10051020-4 = "오오!!"
10051020-5 = "대단합니다, 부장!"
10051020-6 = "고, 고생하셨어요 부장님!"
10051020-7 = "훌쩍…… 저희를 위해 이런 귀한 의뢰까지 수주해 오시다니이이……."
10051020-8 = "어…… 근데 다들 괜찮은 거야?"
10051020-9 = "난 오히려 귀찮은 일 물어왔다고 한소리 들을 줄 알았는데……!"
10051020-10 = "아닙니다 부장!"
10051020-11 = "이것은 명망 높은 인사를 호위함으로써 우리 동아리의 명성을 드높일 기회……!"
10051020-12 = "오히려 거절할 이유가 없는 것입니다!"
10051020-13 = "저, 저도 그렇게 생각해요……!"
10051020-14 = "저기 그런데 진짜로 궁금해서 물어보는 건데."
10051020-15 = "다들 샤인캣이라는 이름, 들어본 적 있어?"
10051020-16 = "없습니다!"
10051020-17 = "대답 빨라!"
10051020-18 = "엥 잠깐만, 그럼 이즈나는 그 사람이 유명하다는 걸 어떻게 알았어?"
10051020-19 = "방금 부장님이 말씀해 주셨으니까요!"
10051020-20 = "아?"
10051020-21 = "하긴, 나도 니야한테 듣고 나서 알게 된 이름이긴 했지……."
10051020-23 = "저, 부장님……."
10051020-24 = "저, 저는 들어본 적 있어요……."
10051020-25 = "오 진짜?"
10051020-26 = "예. 고전미의 현대적 재해석을 참신한 양식으로 정립시킴으로써……"
10051020-27 = "패션계의 패, 패러다임을 뒤바꿨다고요……!"
10051020-28 = "그래서 현존하는 모든 의상 디자이너들의 롤모델로 불리고 있고요……."
10051020-29 = "뭔가 자세히 알고 있어……!"
10051020-30 = "그, 그런가요……?"
10051020-31 = "어쨌든! 잘 따라줘서 고맙다, 제군들."
10051020-32 = "하지만!"
10051020-33 = "닌자라는 것은 본디 프로! 그리고 프로는 대가 없이 움직이지 않는 법!"
10051020-34 = "그런 의미에서…… 짜잔!"
10051020-35 = "이번 일의 대가로, 새로운 카메라를 받아왔다는 이야기!"
10051020-36 = "드디어 다시 <소녀인법첩 미치룻치>를 다시 촬영할 수 있게 됐다구!"
10051020-37 = "오오!"
10051020-38 = "대단해요, 부장님……!"
10051020-39 = "이, 이, 이, 이 카메라는 저희가 쓰던 것보다 훨씬 더 좋은 거잖아요……!"
10051020-40 = "이 카메라라면 더욱 선명한 화질로 부장님의 인법을 화면에 담을 수 있겠어요!"
10051020-41 = "게다가 이것 봐요, 츠쿠요 공! 이 카메라, 방수 기능도 있어요!"
10051020-42 = "저, 정말이네요……!"
10051020-43 = "이 정도면 끓는 라멘 국물 속에서도 촬영해도 문제없겠어요! 닌닌!"
10051020-44 = "후후, 다들 기뻐하다니 다행이군."
10051020-45 = "그러나 닌자란 무릇 참는(忍) 자……!"
10051020-46 = "그러니 기쁨은 잠시 접어두고, 우리의 완벽한 경호 임무를 위해 브리핑을 하겠다!"
10051020-47 = "오오!"
10051020-48 = "부장님……!"
10051020-49 = "먼저, 음양부에서 준 것부터 보자고!"
10051020-54 = "가방……?"
10051020-55 = "오오! 이즈나, 기대됩니다!"
10051020-56 = "안에 무엇이 들어있는 거죠?"
10051020-57 = "새로운 인법이 기록된 두루마리?"
10051020-58 = "후후, 여기 든 것은 이번 임무의 필수품."
10051020-59 = "바로……"
10051020-61 = "드레스다!"
10051020-62 = "드레스……?"
10051020-63 = "드레스……요?"
10051020-69 = "와아! 이즈나, 이렇게 화려한 옷은 처음 봅니다!"
10051020-70 = "저, 정말 예뻐요……."
10051020-71 = "제 커다란 몸에는 전혀 맞지 않겠지만요……."
10051020-72 = "어…… 일단 옷 자체는 다들 마음에 든다니 다행이네."
10051020-73 = "그것들, 우리가 입어야 하거든."
10051020-77 = "네에?!"
10051020-78 = "이, 이런 옷으로는 움직임이 어려울 것 같지 않나요?!"
10051020-79 = "설마 부장님, 저, 저희가 패션쇼의 무대 위에 오르는 건가요?"
10051020-80 = "그, 그로 인해 관객석으로부터 쏟아질 무수한 야유를 견뎌내는 것도 저희가 감내해야 하는 임무인 건가요?!"
10051020-81 = "무, 물론, 그것이 닌자가 걸어야 하는 길이라면……."
10051020-82 = "저 츠쿠요는, 기꺼이……."
10051020-83 = "아냐 아냐, 우리 임무는 어디까지나 경호야!"
10051020-84 = "행사장의 인파에 섞여서, 수상한 움직임이 보이면 먼저 제압하는 거지!"
10051020-85 = "근데 그러려면 일단 행사장 전체를 자유롭게 돌아다닐 수 있어야 하잖아?"
10051020-86 = "그, 그렇죠……?"
10051020-87 = "그런데 이렇게 격식을 차린 복장이 아니면, 일부 구역은 입장이 안 된다고 하더라고."
10051020-88 = "예를 들어서 그 뭐냐, 높으신 분들이 모이는 그…… 뭐냐……."
10051020-89 = "여, 연회장이요?"
10051020-90 = "그래! 연회장!"
10051020-91 = "연회장 같은 곳 한정으로 드레스 코드가 있는 거군요……."
10051020-92 = "응. 그래서 음양부 측에서 이런 옷을 구해다 준 거고."
10051020-93 = "그런데 이런 걸 입으면 움직임에 제약이 크지 않을까요……?"
10051020-94 = "유연함과 신속함은 닌자의 기본인데……."
10051020-95 = "그 이전에, 저한테는 전혀 맞지 않을 것 같아요……!"
10051020-96 = "설령 입어지더라도 조금만 크게 움직여도 옷이 다 찢어질 거고요……!"
10051020-97 = "음! 그렇다면 지금 한번 다 함께 입어봐요! 닌닌!"
10051020-98 = "응?"
10051020-99 = "……!"
10051020-100 = "부장이 늘 말했죠."
10051020-101 = "닌자란! 자고로 어떤 궁지에 몰리더라도, 어떠한 역경에 부딪치더라도 포기하지 않는 법이라고!"
10051020-102 = "그러니 고작 드레스 한 벌 앞에서 좌절해선 안 되는 겁니다!"
10051020-103 = "지금부터 미리 입어보고 적응하는 훈련만 하면……."
10051020-104 = "행사장에서도 훨씬 편하게 움직일 수 있을 거예요!"
10051020-105 = "……확실히, 미리 적응해 둔다면 임무 수행이 더 용이하겠지."
10051020-106 = "그리고 자고로 닌자란 어떤 상황 속에서도 녹아들 수 있어야 하는 법!"
10051020-107 = "이즈나 말대로! 이까짓 드레스에 좌절할 수는 없지!"
10051020-108 = "맞습니다! 닌닌!"
10051020-109 = "그럼 이즈나, 먼저 입어보도록 하겠습니다!"
10051020-112 = "부장! 제가 입을 드레스가 이건가요?"
10051020-113 = "응, 이게 이즈나 거, 이건 츠쿠요 거……."
10051020-114 = "흐, 흐에에……!"
10051020-116 = "짜잔! 드레스 이즈나, 등장입니다!"
10051020-122 = "오옷……!"
10051020-123 = "와아……!"
10051020-124 = "뭐야 뭐야, 제법 잘 어울리잖아!"
10051020-125 = "예뻐요……!"
10051020-126 = "헤헷, 괜찮습니까?"
10051020-127 = "그렇게 띄워 주시니, 이즈나, 조금 부끄럽습니다!"
10051020-128 = "움직임은 어때?"
10051020-129 = "곳곳에 조이는 곳들이 있어서 조금 불편하긴 하지만……."
10051020-130 = "적응만 하면 괜찮을 것 같습니다!"
10051020-131 = "무엇보다, 이렇게 예쁘고 화려한 옷을 입어 보는 것은 처음이라……"
10051020-133 = "이즈나, 굉장히 두근거립니다!"
10051020-134 = "오오, 좋네, 좋아."
10051020-135 = "자 그러면……."
10051020-136 = "다음 차례는……."
10051020-137 = "부, 부장님이 먼저 입어 보시는 건 어때요?"
10051020-138 = "분명 부장님도 잘 어울리실 거예요!"
10051020-139 = "어, 그, 그러려나?"
10051020-140 = "그럼 어디 보자, 이게 나에게 배정된 옷이고……."
10051020-142 = "이걸…… 여기에 이렇게 넣으면 되는 건가?"
10051020-143 = "거꾸로 입었습니다, 부장!"
10051020-144 = "히엑!"
10051020-145 = "뭐야! 옷이 왜 복잡해!"
10051020-146 = "부장님, 이, 일단 여기부터 찬찬히 입어 나가면……."
10051020-147 = "그 다음 이쪽을 잘 조여주고……."
10051020-148 = "오오!"
10051020-149 = "옷 입는 김에 머리도 풀어 보면 어떻습니까, 부장?"
10051020-150 = "이런 복장에는 긴 생머리가 더 어울릴 것 같습니다!"
10051020-151 = "에, 헤어스타일까지 바꾸자고?!"
10051020-152 = "구, 굳이 그럴 것까지는……."
10051020-153 = "아니에요, 부장님!"
10051020-154 = "마, 마침 저에게 고데기도 있으니, 한번 해봐요!"
10051020-155 = "그런 장비도 있었어?!"
10051020-157 = "어, 어때……?"
10051020-158 = "오오! 완전히 다른 분위기입니다, 부장!"
10051020-159 = "맞아요, 청초하고, 소녀스럽고……!"
10051020-160 = "닌자의 가능성이란 이토록 무궁무진한 것이었군요……!"
10051020-161 = "너, 너무 띄워주지 마……!"
10051020-162 = "조, 조금 부끄러우니까……!"
10051020-163 = "그, 그리고 솔직히 이런 옷은 츠쿠요가 가장 어울릴 것 같고……!"
10051020-164 = "예, 예에?!"
10051020-165 = "맞아요, 츠쿠요 공!"
10051020-166 = "어서 츠쿠요 공도 입어 보는 겁니다!"
10051020-167 = "흐, 흐에에……!"
10051020-168 = "그, 그러면 저도……."
10051020-172 = "저기 이 옷, 제 몸에 맞는 사이즈이긴 한 건가요……?"
10051020-173 = "하나도 안 들어가는데요……!"
10051020-174 = "아냐, 처음에는 조금 조이더라고."
10051020-175 = "흐에에……!"
10051020-176 = "그리고 이거, 밑단이 너무 짧지 않아요?"
10051020-177 = "그…… 이 정도면 충분히 긴 거 아닌가?"
10051020-178 = "그런가요……? 여, 역시 제가 너무 커서 그런 거죠!"
10051020-179 = "저 같은 건 덩치만 크고…… 예쁘지도 않고……."
10051020-180 = "이제는 변변한 옷 한 벌도 입지 못해요……!"
10051020-181 = "후에에에……!"
10051020-182 = "아닙니다, 츠쿠요 공! 조금만 더 힘내 봐요!"
10051020-183 = "그, 그래도……!"
10051020-184 = "자, 잠깐만요, 이렇게 마, 막 억지로 끼우면……!"
10051020-188 = "찌이이익!"
10051020-191 = "어……."
10051020-192 = "옷이 찢어졌습니다……!"
10051020-193 = "다, 단추도 다 떨어졌어요……!"
10051020-194 = "흐에에엥……."
10051020-195 = "역시, 저는 이런 예쁜 옷을 입을 자격이 없어요!"
10051020-196 = "쓸데없이 덩치만 크고……!"
10051020-197 = "아냐! 우리가 미안해……! 괜히 억지로 입혀서……!"
10051020-198 = "츠쿠요 공, 괜찮습니까?"
10051020-199 = "저, 저는 괜찮은데……."
10051020-200 = "이 옷, 음양부에게 빌린 거잖아요……?"
10051020-201 = "이 일로 음양부가 저희를 협박하면 어떡하죠?!"
10051020-202 = "저희한테서 카메라를 도로 가져가 버리면 어떡하죠?!"
10051020-203 = "그래서 <소녀인법첩 미치룻치> 영상 업로드도 못 하게 되어 버리면……!"
10051020-204 = "[s] \"괜찮아. 찢어진 옷은 수선하면 되니까.\""
10051020-205 = "그럼 그럼, 수선해서 돌려주면 된다구."
10051020-206 = "요즘 기술이 좋아서 저 정도는 말끔하게 고칠 수 있어."
10051020-207 = "그러니까 너무 심각하게 받아들일 것 없……."
10051020-211 = "……잠깐만, 선생 공이 왜 여기 있어?"
10051020-212 = "[s] \"아, 이 근처에 볼 일이 있어서 왔다가 잠깐 들렸어.\""
10051020-213 = "아니…… 여기 온 이유가 궁금한 게 아니라……."
10051020-214 = "……언제부터 여기 있던 거야?!"
10051020-215 = "서, 선생님……?!"
10051020-216 = "주군?!"
10051020-217 = "서, 설마 아까 옷을 갈아입을……때부터……."
10051020-222 = "이…… 인법! 치한 퇴치의 술!! 변태에게 죽음을!"
10051020-223 = "[s] \"자, 잠깐만……!\""
