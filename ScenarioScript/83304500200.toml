[translation]
83304500200-7 = "그럼 이것으로 선도부 인원은 전부 모인 거겠지."
83304500200-8 = "네, 전부 모였답니다. 그쵸. 이오리?"
83304500200-9 = "아니, 거기서 왜 날 부르는 거야. 아코 쨩?!"
83304500200-10 = "저희 선도부에서 무언가 변수가 생겼다 하면 이오리일 확률이 높으니까요."
83304500200-11 = "이오리. 당신 함정에 자주 빠지고는 하니까."
83304500200-12 = "크읏! 아니! 억울해! 뭣보다 부정할 수 없단 점이 억울해!"
83304500200-17 = "넵, 부장님. 일동 훈련 준비 전부 마쳤습니다."
83304500200-18 = "그래. 그럼 시작해 볼까. 선도부의 대테러 훈련 개시야."
