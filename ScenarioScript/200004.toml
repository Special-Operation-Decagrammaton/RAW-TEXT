[translation]
200004-1 = "ตอนที่ 4;ผลึกทรงหลายเหลี่ยมที่เป็นประกาย"
200004-4 = "คะ... คือว่า..."
200004-5 = "ดำลงไปนานเกินไปแล้วรึเปล่า?"
200004-6 = "ดำน้ำลงไปยังไม่ถึง 3 นาทีเลยนะ..."
200004-7 = "ตะ... แต่ถ้าอยู่ใต้น้ำ อะไรก็เกิดขึ้นได้นี่นา..."
200004-8 = "ถ้าเกิดถูกกระแสน้ำเชี่ยวพัดไป หรือถูกสิ่งมีชีวิตใต้น้ำที่อันตรายโจมตีจะทำยังไงล่ะ?"
200004-9 = "ไม่รู้สิ..."
200004-10 = "แต่ถ้าเป็นเด็กพวกนั้นละก็ ไม่เป็นอะไรหรอกน่า"
200004-11 = ""
200004-15 = "เสียงสูดอากาศหายใจ..."
200004-16 = "พิกัดของบีคอนล่ะ?"
200004-17 = "ทางตะวันออกเฉียงใต้ 1,000 ฟุต"
200004-18 = "ถูกพัดออกไปไกลเลยนะนั่น ตอนนี้ฟ้ามืดแล้ว ออกไปรับกันเถอะ"
200004-19 = ""
200004-22 = "เฮ้อ..."
200004-23 = "โผล่ขึ้นมาไกลจากจุดนัดพบพอสมควรเลยนะ  มีปัญหาอะไรรึเปล่า?"
200004-24 = "โทษทีๆ กระแสน้ำแรงกว่าที่คิด เลยลำบากตอนจับทิศทางนิดหน่อยน่ะ"
200004-25 = "ปรับลดแรงดันถูกแล้วใช่รึเปล่า?"
200004-26 = "โธ่ ฉันไม่ใช่มือสมัครเล่นสักหน่อย ไม่ลืมอยู่แล้วละน่า"
200004-27 = "ฉันไม่เห็นต้องปรับเลย..."
200004-28 = "อย่าประมาทจะดีกว่านะ ใต้ผืนน้ำมืดมิดน่ะ อะไรก็เกิดขึ้นได้ทั้งนั้น"
200004-29 = "ฮู่ว..."
200004-30 = ""
200004-33 = "แล้วนี่ตรวจสอบของที่อยู่ใน <ซากเรืออับปาง> เรียบร้อยแล้วใช่มั้ย?"
200004-34 = "เปล่า อาจเพราะมันนานมากแล้ว เลยแทบไม่มีอะไรหลงเหลืออยู่เลย"
200004-35 = "ครั้งนี้ก็คว้าน้ำเหลวอีกแล้วสินะ..."
200004-36 = "แต่ฉันเก็บเจ้านี่มาจากพื้นซากเรืออับปางได้น่ะ"
200004-38 = "นี่มัน... เศษแก้วเหรอ...?"
200004-39 = "สีมันดูทึบกว่าจะเป็นแค่เศษแก้วธรรมดา ดูแข็งกว่ากระจกทั่วไปด้วย"
200004-40 = "แถมยังเปล่งแสงประหลาดออกมาอีกต่างหาก... ดูเหมือนอัญมณีลึกลับเลยว่ามั้ย?"
200004-41 = "นั่นสิ แสงนี้มัน... เหมือนกับเส้นขอบฟ้าที่ย้อมด้วยแสงสนธยายามพลบค่ำเลย"
200004-42 = "แต่อย่าจ้องมันนานเกินไปจะดีกว่านะ เพราะไม่รู้ว่าแสงนี้จะส่งผลอะไรต่อร่างกายบ้าง"
200004-43 = "มันอาจจะทำให้ผิวไหม้ได้ก็ได้..."
200004-46 = "แล้วพวกเราจะต้องทำแบบนี้ซ้ำไปซ้ำมาจนถึงเมื่อไรกัน?"
200004-47 = "จู่ๆ มาถามอะไรตอนนี้น่ะ"
200004-48 = "ก็ทำต่อไปเรื่อยๆ ห้ามหยุด... จนกว่าจะได้รับคำสั่งใหม่นั่นละ"
200004-49 = "ก็มันเป็นภารกิจของพวกเรานี่นะ"
200004-50 = "ถ้าเป็นแบบนี้ต่อไป คงได้แก่เร็วแน่ๆ~"
200004-51 = ""
200004-54 = "เอาเป็นว่าวันนี้พอแค่นี้แล้วกัน เรากลับกันได้แล้วละ"
200004-55 = "เอา <ผลึกทรงหลายเหลี่ยมที่เป็นประกาย> นี่กลับไปด้วย"
