[translation]
200004-1 = "第4話;閃耀的不等邊多面體"
200004-4 = "話，話說……"
200004-5 = "他們怎麼這麼久還沒上來啊？"
200004-6 = "……他們下水都還不到3分鐘呢。"
200004-7 = "可，可是海裡什麼事都有可能發生嘛……"
200004-8 = "萬一被急流捲走，或者被危險的海底生物襲擊了怎麼辦？"
200004-9 = "這個嘛……"
200004-10 = "如果是那些孩子的話，應該沒問題的。"
200004-11 = ""
200004-15 = "……是他們浮出水面的換氣聲。"
200004-16 = "信標的位置在哪？"
200004-17 = "東南方1000ft。"
200004-18 = "漂得挺遠的呢。#n天色也暗了，我們去接他們吧。"
200004-19 = ""
200004-22 = "呼……"
200004-23 = "……你們返回的位置距離預定地點相當遠。#n是出了什麼問題嗎？"
200004-24 = "抱歉抱歉。潮流比想像中還強，光是掌握方向就費了好一番功夫。"
200004-25 = "有確實做減壓吧？"
200004-26 = "哎呀～我又不是新手，當然記得啦。"
200004-27 = "我倒是不做也沒關係──"
200004-28 = "不能掉以輕心。在漆黑的海底，什麼事都有可能發生。"
200004-29 = "唔……"
200004-30 = ""
200004-33 = "所以，「沉船」裡面你們有仔細確認過了嗎？"
200004-34 = "沒有。可能是時間過了太久，幾乎沒有完整保存下來的東西。"
200004-35 = "看來這次也是白忙一場嗎……"
200004-36 = "不過，我從沉船的底部撿到了這個。"
200004-38 = "這是……玻璃碎片嗎？"
200004-39 = "以單純的玻璃碎片來說有點不太透明，看起來也比玻璃堅硬許多。"
200004-40 = "甚至還散發著奇妙的光芒……不覺得很像某種神祕的寶石嗎？"
200004-41 = "是啊。這道光……就像染上黃昏暮色的水平線一樣。"
200004-42 = "以防萬一，還是別盯著它看太久比較好。#n沒有人知道這道光會對身體造成什麼影響。"
200004-43 = "說不定會把皮膚燒得乾裂焦黑之類的……"
200004-46 = "話說回來，我們到底要重複這種事到什麼時候？"
200004-47 = "事到如今還問這個？"
200004-48 = "直到新的指令下達之前……我們不能停手。"
200004-49 = "畢竟這就是我們的使命。"
200004-50 = "再這樣下去，我都要變成老太婆了～"
200004-51 = ""
200004-54 = "總之今天就先到此為止。#n差不多該回去了。"
200004-55 = "……帶著這個「閃耀的不等邊多面體」。"
