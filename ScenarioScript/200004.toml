[translation]
200004-1 = "Episode 4;The Shining Trapezohedron"
200004-4 = "U-Um..."
200004-5 = "Isn't this taking too long?"
200004-6 = "It hasn't even been three minutes since she dove."
200004-7 = "B-But anything can happen in the water..."
200004-8 = "She could've gotten swept away by a riptide...or attacked by some sea monster..."
200004-9 = "...I mean, things can always go wrong."
200004-10 = "But there's no reason to worry yet."
200004-11 = ""
200004-15 = "There's the signal."
200004-16 = "Where's the beacon?"
200004-17 = "1,000 feet. Southeast."
200004-18 = "That's further from our meetup point than I'd expected. It's getting dark—let's go get her."
200004-19 = ""
200004-22 = "Phew..."
200004-23 = "Your resurface point was a ways from where we agreed upon. Did anything happen?"
200004-24 = "Sorry, sorry. The current was a little stronger than I expected. I got a little turned around."
200004-25 = "Did you decompress properly?"
200004-26 = "Geez. I'm not some newbie, you know."
200004-27 = "I would have been fine without—"
200004-28 = "You can never be too careful. Anything can happen in dark waters."
200004-29 = "Boo..."
200004-30 = ""
200004-33 = " Did you manage to see inside the shipwreck?"
200004-34 = "Nah, everything was too rotted. It's probably been sitting for longer than we'd thought."
200004-35 = "Another waste of time..."
200004-36 = "I did find this down there, though."
200004-38 = "What is it? A glass shard?"
200004-39 = "It's sturdier than glass, and too opaque."
200004-40 = "Look, it kind of glows too. Like a magical gemstone."
200004-41 = "It's almost like someone captured the colors of twilight inside a rock."
200004-42 = "We don't know what it's made of, so try to limit contact. This kind of light could have negative effects or radiation."
200004-43 = "Eek. What if it makes our skin fall off?"
200004-46 = "Hey, so, how much longer are we gonna be doing this for?"
200004-47 = "Why are you asking?"
200004-48 = "Until we get new orders, we keep going."
200004-49 = "That's our mission."
200004-50 = "We're gonna be working on this mission until I'm old and creaky."
200004-51 = ""
200004-54 = "Anyways, that's enough for today. Let's head back."
200004-55 = "...With this shining trapezohedron."
