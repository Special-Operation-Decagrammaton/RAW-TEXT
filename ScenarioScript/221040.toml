[translation]
221040-1 = "#title;제4화;흰 제복과 카레"
221040-3 = "#place;올림포스 호, 아일랜드 사관실"
221040-5 = "3;미츠키;01\n#3;a\n#wait;1500"
221040-6 = "3;미츠키;00;오늘 저녁은 대구 필렛을 곁들인 해산물 카레입니다.\n#3;em;[음표]"
221040-7 = "3;미츠키;99;부디 맛있게 즐겨주시길.\n#3;greeting"
221040-8 = "[ns1] \"보기에는 평범해 보이는 카레인데?\"\n[ns2] \"왜 식사 메뉴가 카레인 게 문제인 거야?\""
221040-11 = "3;미나토;02;그게……\n#3;em;[…]"
221040-12 = "3;미나토;02\n2;아미;02;오디세이아 학원에서는 입항 날, 모든 함선의 저녁 메뉴를 카레로 통일하는 전통이 있습니다.\n#2;a\n#3;m4"
221040-13 = "2;아미;00;항해 중에 소비되고 남은 식재료를 한꺼번에 소비할 수 있는 메뉴이기도 하고, 카레는 호불호 없이 대부분의 학생들이 좋아하니까요."
221040-14 = "2;아미;07;다만 일부 학생들은 취향과 별개의 이유로 카레를 싫어하는데……"
221040-15 = "3;가짜 총학생회장;04;알레르기의 문제인가요?\n#3;em;[?]\n#2;hide"
221040-16 = "3;아미;06;아뇨. 그런 문제는 아닙니다만……"
221040-17 = "3;아미;18;카레는 흰 옷에 튀면 지우기 어려우니까요."
221040-18 = "3;가짜 총학생회장;02;아하, 과연."
221040-19 = "3;미츠키;02;주제넘은 걱정임은 알고 있습니다만…… 총학생회장님, 괜찮으신가요?\n#3;em;[반응]"
221040-20 = "3;미츠키;01;카레 국물이 튀는 것이 싫다는 이유로 지정 교복이 검은색인 트라이던트에 지원한 학생도 있을 정도니, 불편하시다면 꼭 드시지 않더라도—"
221040-21 = "3;가짜 총학생회장;99;아뇨, 괜찮습니다. 그런 이유로 모처럼 대접받은 식사를 거절하는 것도 결례니까요."
221040-22 = "3;가짜 총학생회장;01;그럼…… 잘 먹겠습니다."
221040-23 = "#st;[0,0];instant;1;"
221040-25 = "3;가짜 총학생회장;01\n#3;greeting\n#wait;1500"
221040-27 = "3;가짜 총학생회장;99\n#3;a"
221040-28 = "3;가짜 총학생회장;04;이 맛은……\n#3;em;[...]"
221040-29 = "[ns] \"해산물이 이렇게 카레와 잘 어울렸었나?\""
221040-30 = "3;미나토;03;네. 카레는 기본적으로 나쁜 맛을 감추거나, 좋은 맛을 돋구는 향신료의 일종이니까요."
221040-31 = "3;미나토;01;해산물의 비린 맛을 싫어하는 학생들도 해산물 카레만큼은 거부감 없이 먹는 경우가 많답니다."
221040-32 = "3;미나토;11;물론 크루즈의 호화로운 요리를 만들어 내고 있는, 저희 여객관리부 학생들의 요리 실력이 우수한 덕도 있겠지만요.\n#3;em;[반짝]"
221040-33 = "#st;[0,0];instant;1;"
221040-35 = "3;미츠키;07\n#3;greeting\n#3;em;[음표]\n#wait;1500"
221040-36 = "[ns3] \"이 대구 필렛도 카레와 정말 잘 어울리네!\"\n[ns4] \"너무 맛있어서 수저를 멈출 수가 없어……!\""
221040-39 = "3;미나토;02\n#3;em;[반응]\n#wait;1500"
221040-40 = "3;미나토;02\n#3;d\n#wait;1000"
221040-41 = "3;미나토;03\n#3;a\n#3;closeup\n#wait;1500"
221040-42 = "3;미나토;08;……선생님.\n#3;em;[…]\n#fontsize;50\n#3;closeup"
221040-43 = "3;미나토;09;노파심에 한 가지 조언을 먼저 드리자면, 생선은 뒤집어 드시지 말고 뼈를 들어내는 걸 추천 드립니다.\n#fontsize;50\n#3;closeup"
221040-44 = "[s] \"……왜? 그것도 선상의 금기야?\""
221040-45 = "3;미나토;01;네. 불편하시겠지만, 양해 부탁드리겠습니다.\n#fontsize;50\n#3;greeting\n#3;closeup"
221040-46 = "[s] \"뭐, 어려운 일은 아니니 상관없지만……\""
221040-47 = "#st;[0,0];instant;1;"
221040-49 = "3;가짜 총학생회장;10\n#3;em;[…]\n#wait;2500"
221040-51 = "#na;(이후, 다소 차분한 분위기에서 저녁 식사가 계속되었다.)"
221040-53 = "3;가짜 총학생회장;03\n#3;a\n#wait;1500"
221040-54 = "3;가짜 총학생회장;02;……잘 먹었습니다."
221040-55 = "[ns5] \"정말 잘 먹었어!\"\n[ns6] \"처음 먹는 맛의 카레였는데, 정말 맛있었어~\""
221040-58 = "3;미츠키;03;후후, 입맛에 맞으셨다니 열심히 준비한 보람이 있네요.\n#3;em;[음표]"
221040-59 = "3;미츠키;99;주방의 학생들에게도 감상을 꼭 전달 드리겠습니다."
221040-60 = "3;미츠키;09;……사실, 준비한 카레 중 하나에는 하바네로 소스를 섞어 당첨을 만들 생각이었지만……\n#fontsize;50"
221040-61 = "3;미츠키;09\n4;아미;17;학교 간 외교 문제가 될 수 있으니 그런 짓은 절대 하지 말아주세요.\n#4;a\n#4;stiff\n#3;m2"
221040-62 = "3;스미카;02;그런데, 총학생회장님은 정말 카레를 드시는데도 흰 옷이 조금도 더러워지지 않았네요……!\n#3;em;[반응]\n#4;hide"
221040-63 = "3;스미카;15;역시 소문대로의 초인은 식사 예절 조차도 완벽하다는 건가……!"
221040-64 = "3;스미카;15\n2;아미;07;아마 총학생회장의 별명인 '초인'은 그런 뜻이 아닐 거라 생각합니다만.\n#2;a\n#3;m4"
221040-65 = "3;가짜 총학생회장;02;과찬의 말씀이시군요. 사실 요리가 너무 맛있어서 옷에는 신경 쓸 겨를이 없었거든요.\n#2;hide"
221040-66 = "3;가짜 총학생회장;01;음식을 남기는 게 아까워서 열심히 먹다 보니, 자연스럽게 깨끗이 먹게 되었나 보네요."
221040-67 = "3;가짜 총학생회장;01\n5;미나토;24;그게 무의식적으로 가능한 일인가요……?\n#3;m1\n#5;em;[?]\n#5;a"
221040-68 = "5;미나토;01;아직도 아일랜드의 많은 학생들이 카레 때문에 옷 세탁에 골머리를 앓고 있는데, 부디 비법을 알고 싶을 정도 네요."
221040-69 = "5;미나토;11;혹시 괜찮으시다면 다음 방문 때의 식사는 카레 우동으로 준비하는 것도—"
221040-70 = "1;가짜 총학생회장;01\n3;아미;20;쓸데없는 일로 총학생회장님을 시험하지 마세요.\n#3;a"
221040-71 = "5;미나토;22;……넵.\n#5;em;[땀]"
221040-73 = "3;미나토;01\n#3;a\n#wait;1000"
221040-74 = "3;미나토;02;그래서, 슬슬 본론으로 들어가 볼까요?\n#3;em;[반응]"
221040-75 = "3;미나토;01;미안하지만 학원의 기밀 사항과 관련된 중대한 회담이 될 수도 있는 지라."
221040-76 = "3;미나토;99;아미 부장을 제외한 나머지 학생들은 잠깐 자리를 피해줄래?"
221040-77 = "4;스미카;08\n2;미츠키;01;알겠습니다.\n#3;hide"
221040-78 = "4;스미카;15;회담이 끝나면 다시 꼭 불러주십쇼!\n#4;em;[재잘]"
221040-79 = "#st;[0,0];instant;1;"
221040-81 = "4;스미카;15\n2;미츠키;01\n#4;d\n#2;h\n#4;h\n#wait;300"
221040-82 = "2;미츠키;01\n#2;d\n#2;h\n#wait;2500"
221040-84 = "2;아미;00\n4;미나토;01\n#2;h\n#4;h\n#2;a\n#4;a\n#wait;2000"
221040-85 = "4;미나토;18;…………하아.\n#4;greeting\n#4;em;[한숨]"
221040-86 = "4;미나토;23;지쳤다……."
221040-87 = "2;아미;07;함장. 아직 회의는 시작도 하지 않았습니다. 자세를 똑바로 유지해 주세요."
221040-88 = "4;미나토;22;하지만…… 다른 오디세이아 학생들이 없는 장소에서는 조금 어깨 힘을 풀어도 괜찮잖아?\n#4;em;[훌쩍]"
221040-89 = "4;미나토;17;어차피 총학생회장이나 선생님은 조금의 흉 정도는 신경 쓰지 않으실테고."
221040-90 = "2;아미;20;함장!\n#2;jump\n#2;em;[!]"
221040-91 = "3;가짜 총학생회장;04;어머나.\n#2;hide\n#4;hide"
221040-92 = "3;가짜 총학생회장;01;역시, 평소의 우미지 함장은 이런 느낌이었나 보군요."
221040-93 = "4;미나토;17\n2;아미;13;저희 함장이 흐트러진 모습을 보여드려 죄송합니다……\n#2;em;[땀]\n#3;hide"
221040-94 = "[s] \"아냐. 사실 이쪽이 더 대하기 편한 걸.\""
221040-95 = "4;미나토;10;거 봐, 부장. 선생님께서도 괜찮으시다잖아?\n#4;em;[재잘]"
221040-96 = "2;아미;08;……쯧."
221040-97 = "4;미나토;24;혀를 찼어?!\n#4;em;[?!]\n#4;shake"
221040-98 = "2;아미;07;뭐. 이렇게 되었으니, 계속 이야기를 이어가자면……"
221040-99 = "2;아미;02;다른 오디세이아 학생들도 없으니, 다소 예민한 화제라 하더라도 저희 학원에 대해 궁금하신 점이 있다면 이 기회에 편히 여쭈어 주십시오."
221040-100 = "[s] \"음…… 가장 먼저 떠오르는 것이라면.\""
221040-101 = "#st;[0,0];instant;1;"
221040-103 = "2;아미;02\n4;미나토;24\n#2;h\n#4;h"
221040-105 = "[ns7] \"학원마다 문화나 금기가 조금씩 다르다는 건 알고 있었지만—\"\n[ns8] \"이상하게 오디세이아는 미신에 예민한 것 같은데.\""
221040-108 = "2;아미;02\n4;미나토;02;……다소 신경쓰는 부분이 많긴 하지요.\n#2;d\n#4;m3"
221040-109 = "#st;[0,0];instant;1;"
221040-111 = "4;미나토;15\n#4;em;[…]\n#wait;2500"
221040-112 = "4;미나토;01;선생님께서는 먼 바다에 나가 보신 적이 있으신가요?"
221040-115 = "#na;미나토;뭍과 가까운 해변은 바람도 잔잔하고 파도도 높게 치는 경우가 거의 없지만, 먼 바다— 대양에서는 시시각각 바람의 방향이 바뀌고, 파도가 갑판 위를 덮치는 경우가 흔하답니다."
221040-116 = "#na;미나토;이런 변덕스러운 환경 속에서, 단단하고 거대한 배를 몰다 보면 여러가지 위험한 상황이 쉽게 찾아옵니다."
221040-117 = "#na;미나토;무거운 화물에 치이고, 물에 빠지고, 기름에 불타는 등……"
221040-118 = "#na;미나토;목숨을 위협할 수 있는 수많은 상황에 대비하기 위해 뱃사람들은 저들 나름의 규칙을 만들었습니다."
221040-119 = "3;미나토;01\n#3;a"
221040-120 = "3;미나토;99;……[ruby=Taboo]금기[/ruby]"
221040-121 = "3;미나토;02;얼핏 보기엔 허황된 미신처럼 보여도 이 금기들은 해양 위기에 대처하기 위해 뱃사람들이 수세기에 걸쳐 만든 일종의 안전 수칙이거든요.\n#3;em;[반응]"
221040-122 = "[s] \"휘파람이나 토끼 같은 것도?\""
221040-123 = "3;미나토;03;물론이지요. 예를 하나 들어 볼까요?"
221040-124 = "3;미나토;01;바다에서는 '수직으로 물에 떠서 헤엄치는 익수자는 구출하지 않는다'는 금기가 있습니다만, 어째서 이런 금기가 생겼는지 아시나요?\n#3;em;[?]"
221040-125 = "[s9] \"잘 모르겠는데……\"\n[s10] \"설마 물귀신이 끌어당기고 있어서……?\""
221040-128 = "3;미나토;02;아, 그렇게 생각하는 오디세이아의 학생들도 많긴 합니다. 하지만 진짜 이유는……"
221040-129 = "3;미나토;01;그 이유는 익수자가 물에 수직으로 서 있으면 그 아래에 와류, 소용돌이가 있을 가능성이 높기 때문이지요.\n#3;em;[…]"
221040-130 = "3;미나토;02;따라서 그 상태의 익수자에게 다가가는 건 위험한 상황을 초래할 수 있기에, 만들어진 규칙이 지금까지도 금기로 남아 전래되고 있는 것입니다."
221040-131 = "3;미나토;03;휘파람이나 토끼도 마찬가지랍니다."
221040-132 = "3;미나토;99;배의 경보 신호나 구조 신호는 휘파람의 새된 음색과 닮아 있기 때문에, 신호를 오인하지 않도록 휘파람을 금지하던 문화가 터부시된 것이고—"
221040-133 = "3;미나토;01;토끼의 경우도 배를 훼손시킬 수 있는 목재 선박 시절의 금기가 지금까지 전해내려 온 것이지요."
221040-134 = "[s] \"생선을 뒤집어 먹는 건……?\""
221040-135 = "3;미나토;02;……글쎄요. 그건 잘 모르겠지만……"
221040-136 = "3;미나토;01;아마도 생선 살이 부스러질까 봐 금지한 게 아닐까요?\n#3;em;[?]"
221040-137 = "3;가짜 총학생회장;99;완전히 납득은 할 수 없어도, 이유 없는 억지는 아니라는 것이군요."
221040-138 = "3;미나토;01;네. 그렇기에 다들 완전히 이해하지 못하면서도, 이 금기를 따르고 익히는 것이랍니다."
221040-139 = "[ns] \"하지만 이해하지 못하고 행하는 일에는 한계가 있어.\""
221040-140 = "3;미나토;15\n#3;em;[…]\n#wait;2500"
221040-141 = "[ns] \"만약 금기에 없는 일이 발생한다면—\""
221040-142 = "3;미나토;15\n#wait;1500"
