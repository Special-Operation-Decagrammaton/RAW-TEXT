[translation]
1004602-1 = "이즈나와 함께 수박 깨기!"
1004602-5 = "(그리하여 이즈나의 강력한 요청에 따라 뜨거운 햇살이 내리쬐는 여름 바닷가에 나오게 되었다.)"
1004602-10 = "주군! 주군! 여기예요! 여기!"
1004602-11 = "[s] \"안녕, 이즈나.\""
1004602-12 = "에헤헷! 네!"
1004602-13 = "[s1] \"그래서 오늘은 어떤 일을 하려고 그래?\"\n[s2] \"분명 여름 바다에 어울리는 닌자 활동, 이라고 했었지?\""
1004602-16 = "그게, 여름에, 그것도 바다에 찾아왔으니!"
1004602-17 = "저 이즈나, 기왕이면 지금밖에 할 수 없는 활동을 하고 싶어요!"
1004602-18 = "[s] \"여름에 어울리는 특별한 활동이라고 한다면……. 수영이라든가?\""
1004602-19 = "(깜짝!)"
1004602-20 = "[s] \"이렇게 더운 날이니까, 같이 물속에 들어가면……\""
1004602-24 = "[ns] \"응? 이즈나?\""
1004602-25 = "아, 그게, 저기, 주군, 그러니까 수영은 그게……."
1004602-26 = "네, 넵! 주군! 물론 그, 그것도 좋지만!"
1004602-27 = "여기서 닌자라면……!"
1004602-28 = "역시 여름 바다에서만 할 수 있는 특별한 수련!"
1004602-29 = "그런 걸 하는 건 어떨까! 하고 이즈나는 생각했어요!"
1004602-30 = "[s] \"여름 바다에서만 할 수 있는 특별한 수련……?\""
1004602-31 = "그런 의미에서 여기, 이렇게 수련에 필요한 물건도 준비해 왔습니다! 주군!"
1004602-36 = "[ns] \"이건 수박이랑…… 목도? 설마, 이즈나가 말한 수련이란 게…….\""
1004602-37 = "네! 여름 하면 빼놓을 수 없는 체력 훈련……!"
1004602-38 = "바로 수박 깨기예요!"
1004602-39 = "[s3] \"체력, 훈련? 아니, 분명 엄청나게 여름답긴 하지만.\"\n[s4] \"그게, 닌자랑 관련이…… 있나……?\""
1004602-42 = "후후후……!"
1004602-43 = "물론 지금부터 하는 건 평범한 수박 깨기가 아닙니다! 주군!"
1004602-44 = "무려 이름난 닌자들 사이에서 남몰래 유행한다고는 하는…… <특별 닌자 수박 깨기>예요!"
1004602-45 = "[s] \"이즈나, 참고로 어디서 본 정보야?\""
1004602-46 = "네? 부장이 운영하는 <소녀인법첩 미치룻치> 채널에서 봤는데요?"
1004602-47 = "[s] \"응! 그럴 거라고 생각했지만!\""
1004602-48 = "채널에서 봤는데! 이 <특별 닌자 수박 깨기>의 규칙은 간단해요!"
1004602-49 = "존경하는 주군께서 명령을 내려주시면…… 그걸 충실히 이행하는 닌자!"
1004602-50 = "저 이즈나가! 명령을 따라 수박을 깨는 거예요!"
1004602-51 = "[s] \"……미안, 평범한 수박 깨기랑 뭐가 다른지 모르겠지만……\""
1004602-55 = "[ns] \"그래도 뭐, 이즈나가 하고 싶다면야.\""
1004602-56 = "에헤헷! 네!"
1004602-60 = "그럼 이렇게,"
1004602-65 = "먼저 수박을 세팅하고……."
1004602-71 = "네! 이것으로 준비는 전부 끝났어요!"
1004602-77 = "그럼 지금부터 눈을 감을 테니……."
1004602-78 = "주군! 이제 이즈나에게 마음껏 명령해주세요!"
1004602-79 = "[s] \"그럼 일단 이즈나…….\""
1004602-80 = "꿀꺽…… (두근두근!)"
1004602-81 = "[s5] \"그대로 앞으로 세 걸음 정도…….\"\n[s6] \"그대로 뒤로 네 걸음 걸어서…….\""
1004602-82 = "네! 주군! 이즈나! 갑니다!"
1004602-86 = "네! 주군! 이즈나! 갑니다!"
1004602-90 = "[ns] \"자, 잠깐, 이즈나?!\""
1004602-98 = "콜록콜록. 이즈나, 실수를 해버렸어요……."
1004602-99 = "[s] \"앗, 저기, 괜찮아?\""
1004602-100 = "네! 이즈나는 괜찮아요! 주군!"
1004602-101 = "방금은 주군의 명령을 듣자마자, 미처 속도를 생각 안 하고 달린 바람에 실수해버렸지만……."
1004602-102 = "이번엔 실수하지 않겠습니다!"
1004602-103 = "닌자로서! 다시금 제대로 된 여름 훈련을 위해! 명령을 내려주세요! 주군!"
1004602-104 = "[s] \"아, 으응. 그렇다면……. 이번엔 오른쪽으로…….\""
1004602-105 = "네! 오른쪽!"
1004602-106 = "하아아앗!!"
1004602-111 = "[ns] \"이, 이즈나?!\""
1004602-115 = "콜록콜록! 이번에도 실수를……"
1004602-119 = "아니, 아직 포기하기 일러요."
1004602-120 = "주군! 또 명령을!"
1004602-121 = "[s] \"어, 음, 그, 그럼 이번엔 왼쪽……?\""
1004602-122 = "하아아압!!"
1004602-128 = "아직, 아직이에요!"
1004602-132 = "이즈나류 인법! 보여드리겠습니다앗! 이야아압!!"
1004602-137 = "(그렇게 몇 번이나 되는 수박 깨기를 시도를 반복했을까.)"
1004602-138 = "(자욱한 모래 먼지가 피어오르는 와중에도)"
1004602-142 = "(여전히 수박은 그 모습 그대로, 멀쩡한 형태를 유지하고 있었다.)"
1004602-144 = "으윽…… 설마, 수박이 이렇게나 강적이었을 줄이야……."
1004602-145 = "이즈나, 수박의 털끝 하나 건드릴 수가 없었어요……."
1004602-146 = "과연…… <특별 닌자 수박 깨기> 훈련…… 우습게 볼 수 없었던 거로군요!"
1004602-147 = "[s7] \"아니, 좀 더 근본적인 문제라고 할까…….\"\n[s8] \"아무래도 훈련에 대해 조금 더 재고해볼 필요가…….\""
1004602-150 = "캐앵~?! 주, 주군?! 그 말씀은?!"
1004602-151 = "그, 그렇죠……. 이즈나가 먼저 <특별 닌자 수박 깨기>를 하자고 말을 꺼냈으면서……"
1004602-152 = "정작 훈련은 제대로 해내지도 못하고, 실수만 계속……."
1004602-153 = "그러니…… 주군께서 훈련을 다시 생각해보자고 말씀하시는 것도……"
1004602-154 = "어쩔 수 없는, 거겠죠……."
1004602-155 = "죄, 죄송해요~! 주군!"
1004602-156 = "이런 무더운 날에! 괜히 이즈나가 부족해서! 주군을 실망시켜드리기만 하고……!"
1004602-157 = "[s] \"아니아니, 딱히 이즈나를 탓하는 게 아니니까.\""
1004602-158 = "훌쩍. 네엣?"
1004602-159 = "[s9] \"그러니까 이즈나. 내 말은 명령을 받자마자 바로 움직이기보다.\"\n[s10] \"차분히 생각을 곱씹고 움직여보는 게 어떻겠냐는 뜻이야.\""
1004602-165 = "아…… 명령을 받은 즉시 움직이는 닌자의 신속함보다……."
1004602-166 = "보다 세밀하게 작전을 곱씹고 따라 할 수 있는 닌자의 신중함…… 그것을 고려하란 말씀이시군요……!"
1004602-167 = "과연…… 주군의 금언! 이즈나의 가슴속에 엄청나게 스며들어 옵니다!"
1004602-168 = "음음!"
1004602-169 = "…………."
1004602-170 = "으음, 하지만 역시 그건 안 될 거 같아요. 주군!"
1004602-171 = "[s] \"응? 어째서?\""
1004602-172 = "그게…… 주군. 저 이즈나, 주군의 명령을 들으면 싫어도 바로 몸부터 움직여버려서……!"
1004602-173 = "우으……. 하지만 수박 깨기는 성공하고 싶고……."
1004602-174 = "하지만! 또 주군의 명령을 들으면, 이즈나는 바로 움직이고 싶어서……!"
1004602-175 = "으앙~! 어떡하죠. 주군?!"
1004602-176 = "수박 깨기가 이렇게나 어려운 훈련이었을 줄이야. 이즈나. 전혀 몰랐어요!"
1004602-177 = "그래도……"
1004602-178 = "이즈나는 포기하고 싶지 않아요……"
1004602-179 = "모처럼 주군과 하는 훈련이니까……!"
1004602-180 = "[s11] \"으응, 그, 그래…….\"\n[s12] \"이즈나…… 이 대견한 아이……!\""
1004602-187 = "(그런 식으로 의욕을 내는 이즈나 앞에서)"
1004602-188 = "(차마 그만두라거나, 진정하라는 말을 꺼낼 수는 없었다.)"
1004602-189 = "(그리하여 결국…….)"
1004602-190 = "[ns] \"좋아. 이즈나. 그럼 그대로 성공할 때까지! 몇 번이고 시도하는 거야!\""
1004602-192 = "……!"
1004602-193 = "네! 이즈나! 힘낼게요!"
1004602-194 = "닌닌!"
1004602-200 = "(그 뒤로, 몇 번이고 폭주하여 뛰쳐나가는 이즈나와 함께 온종일 수박 깨기를 했고.)"
1004602-206 = "(훈련이 끝난 뒤엔, 수행으로 지친 이즈나와 함께 맛있게 수박을 먹었다.)"
