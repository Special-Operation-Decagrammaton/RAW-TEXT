[translation]
2002203-1 = "조금 어긋나더라도"
2002203-2 = "게헨나 학생식당"
2002203-3 = "(후우카의 말대로, 게헨나 학생식당에서 기다리고 있었다.)"
2002203-8 = "어서 오세요, 선생님."
2002203-9 = "[ns] \"어라, 후우카. 옷이……?\""
2002203-14 = "어떤가요? 어떠세요?"
2002203-15 = "[ns1] \"귀여워! 최고로 어울려!\"\n[ns2] \"기모노 후우카 땅이다–!\""
2002203-18 = "에헤헷. 그렇게 봐 주시니 감사해요."
2002203-19 = "왠지 부끄럽네요. 몸 둘 바를 모르겠기도 하고."
2002203-20 = "네? 휴일까지 급식실에 나오게 해서 미안하다고요?"
2002203-21 = "아뇨! 급식실은 저의 성지이자 전쟁터!"
2002203-22 = "오늘은 그 성지를 선생님 혼자만을 위해 사용하는 거예요!"
2002203-23 = "그것만으로도 제가 얼마나 기쁜데요!"
2002203-24 = "[s] \"그렇지만…… 쉬는 날에 무리하게 출근(?)한 것 아니야?\""
2002203-25 = "에이, 이 정도는 아무것도 아니에요."
2002203-29 = "조금만 기다리세요. 밑준비는 미리 해 뒀으니까."
2002203-30 = "최고의 해넘이 국수를 만들어 드릴게요!"
2002203-37 = "가쓰오다시는 미리 만들어서 냉장고에 넣어 뒀고……"
2002203-43 = "재워 둔 닭다리살과 대파는 한입 크기로 썰어서……"
2002203-49 = "대파를 먼저 구운 다음, 파기름에 닭다리살을 굽고……"
2002203-50 = "가쓰오다시에 설탕, 간장과 미림을 넣고 고명을 살짝 조리고……"
2002203-55 = "국수 면을 삶고, 재빨리 꺼내서 찬물에……"
2002203-61 = "마지막으로 육수를 붓고, 고명을 올리면……"
2002203-62 = "다 됐어요, 선생님! 해넘이 국수, 2인분이에요!"
2002203-63 = "닭고기 육즙과 파 향이 섞여서, 나쁘지 않을 거예요."
2002203-64 = "원래는 새우튀김까지 준비해 드리려고 했는데……"
2002203-65 = "[s3] \"이미 충분해.\"\n[s4] \"이것만으로도 차고 넘칩니다.\""
2002203-68 = "그, 그러신가요? 다행이다. 에헤헤……"
2002203-69 = "그러면, 맛있게 드세요!"
2002203-70 = "[s] \"잘 먹겠습니다.\""
2002203-71 = "잘 먹겠습니다."
2002203-73 = "(후우카와 함께 국수를 바닥까지 깨끗이 비웠다.)"
2002203-75 = "어, 어떠셨나요? 입에는 맞으셨을지……"
2002203-76 = "[s5] \"최고였어. 역시 후우카야.\"\n[s6] \"내가 먹어 본 것 중에서 가장 맛있는 해넘이 국수였어.\""
2002203-79 = "정말요? 감사합니다!"
2002203-80 = "저는…… 제 요리를 누군가 맛있게 먹어 주는 게 좋아요."
2002203-81 = "그게 선생님이시라면…… 더할 나위 없고요."
2002203-82 = "오늘 불러 줘서 고맙다고요?"
2002203-83 = "아, 아뇨! 오히려 감사 인사를 드리고 싶은 건 저인데요."
2002203-84 = "시기가 조금 맞지 않을지도 모르지만."
2002203-90 = "새해 복 많이 받으세요, 선생님!"
2002203-91 = "[ns] \"새해 복 많이 받아. 후우카.\""
2002203-93 = "(그 뒤로 한참이나 아무래도 좋은 이야기를 나누고, 후우카를 바래다줬다.)"
