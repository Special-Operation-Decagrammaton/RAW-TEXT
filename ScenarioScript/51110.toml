[translation]
51110-1 = "제11화;백화요란의 부원"
51110-5 = "자! 도망 못 가게 다 같이 포위해!"
51110-13 = "아까 오전 중에는 사람을 헷갈리는 바람에 사알-짝 실수를 했었지만!"
51110-14 = "이번엔 제대로 찾아왔다고!"
51110-23 = "………우물우물."
51110-24 = "저번엔 용케 잘도 우리한테서 도망쳤지만, 이번에는 소용없어! 망량즈를 더 많이 끌고 왔으니까!"
51110-25 = "…우물우물."
51110-26 = "리더! 저 녀석 아무 말도 못 하고 음식만 우물거리는 걸 보니…… 엄청 쫄은 모양인데!"
51110-27 = "하하! 이 숫자라면 긴장될 만도 해!"
51110-30 = "우물우물."
51110-32 = "꿀꺽."
51110-33 = "오, 다 먹었냐? 좋아. 어디 할 말이 있으면 들어나 볼까!"
51110-34 = "물론 지금 바로 얌전히 사과한다면 우리도 적당히 봐줄……."
51110-38 = "──우물우물."
51110-43 = "리더! 저 녀석, 손에 들고 있던 봉투에서 또 닭꼬치를 꺼내서 먹기 시작했는데요!?"
51110-45 = "에이잇! 백화요란! 네녀석! 어디까지 우리를 놀려야……!"
51110-46 = "……저번에도 말했지만 나는 백화요란이 아니야."
51110-47 = "나는 그저 타이밍 좋게 백귀야행 축제 거리를 찾았을 뿐인……."
51110-49 = "그래. 보통으로 평범하고, 조금은 살짝 신비로운 분위기를 가진…… 다소 귀여운 모습이 특징적일 뿐인 백귀야행의 학생, 이니까."
51110-51 = "엄청나게 뻔뻔한 얼굴로 짜증 나는 소리를 하고 있잖아. 저 녀석?!"
51110-52 = "더 이상 헛소리를 들어주고만 있진 않겠어!"
51110-53 = "모두 돌……!"
51110-54 = "[s] \"잠깐!\""
51110-62 = "리더?!"
51110-63 = "아니, 잠깐! 적어도 최소한의 양식미는 갖춰야지……"
51110-70 = "선배애애?!"
51110-71 = "에잇!"
51110-72 = "다, 다 같이 공격이야!"
51110-103 = "으으으으……………"
51110-107 = "크으윽!"
51110-108 = "수, 숫자! 숫자로 밀어붙여어어!"
51110-114 = "……!"
51110-121 = "(연전이 얼마나 이어졌을까.)"
51110-132 = "붙잡았……!"
51110-133 = "읏……?!"
51110-134 = "[ns] \"오른쪽이야!\""
51110-146 = "이제는 잘 알겠다고!"
51110-147 = "오른쪽! 오른쪽을 노려!"
51110-148 = "다른 것보다 오른쪽으로 들어갔을 때 반응이 굼뜬 게 보여!"
51110-149 = "자고로 약점을 집요하게 공략해서 승리하는 게 우리 망량즈의 특기라고!"
51110-150 = "……! 성가시기는……!"
51110-152 = "이대로 로켓 런쳐입니다!"
51110-156 = "우왓, 아, 아무것도 안 보여!"
51110-157 = "콜록콜록……"
51110-164 = "[ns] \"이대로 계속 싸우는 건 곤란할 테니까. 지금은 자리를 피하자.\""
51110-165 = "……누구?"
51110-170 = "자, 잠깐…… 나는……."
51110-177 = "[ns1] \"후우, 후우…… 이쯤 왔으면 괜찮겠지.\"\n[ns2] \"그래도 크게 다치지 않아서 다행이야.\""
51110-180 = "……당신은, 누구?"
51110-184 = "샬레의 선생……?"
51110-185 = "샬레의 선생이라면……. 분명……."
51110-186 = "……아니, 도와줄 필요는 없었어."
51110-187 = "도와주지 않아도 나 혼자서 얼마든지."
51110-192 = "[ns] \"그 오른팔. 혹시 다친 거야?\""
51110-193 = "……!"
51110-194 = "아까부터 오른쪽의 반응이 굼떴다고?"
51110-195 = "외부인이 보기에…… 그렇게 드러날 정도……였나."
51110-196 = "이건…… 그게……."
51110-200 = "…………."
51110-201 = "[s3] \"괜히 민감한 걸 캐물은 거라면 미안해.\"\n[s4] \"억지로 물어볼 생각은 없었으니까.\""
51110-204 = "……그래서 샬레의 선생이 여긴 어쩐 일로?"
51110-205 = "백귀야행에 볼일이 있어 찾아왔다? 나와는 돌아가는 길에 우연히 마주쳤을 뿐이다. 라고……."
51110-206 = "[s] \"그건 그렇고 복장을 보아하니, 혹시 너는…….\""
51110-210 = "아, 나는, 그러니까……. 백화요란의……."
51110-211 = "[s] \"역시 백화요란의 부원이니?\""
51110-212 = "………."
51110-213 = "……그렇구나. 그러고 보면 아직 샬레의 선생과는……."
51110-214 = "응."
51110-217 = "당신의 말이 맞아."
51110-218 = "난…… 확실히 백화요란의 부원, 이야."
51110-219 = "아니, 정확히는 부원이었다. 라고 하는 쪽이 맞겠지."
51110-220 = "지금은…… 그냥 그곳을 떠나온 몸이니까."
51110-221 = "[s] \"이야기라면 들었어. 해산령 이후, 탈퇴한 부원들이 많았다고.\""
51110-222 = "해산령……"
51110-223 = "그래, 그렇구나. 이미 백화요란은……."
51110-224 = "아니, 어쩌면 당연한, 걸까."
51110-225 = "내가 그걸 반납하려고 했으니, 당연히 그 아이들은……."
51110-226 = "………."
51110-227 = "맞아, 나도. 그래서 백화요란을 탈퇴하고…… 잠시 거리를 둘러보고 있었어."
51110-228 = "조금은 숨을 돌릴 겸, 마침 축제가 열린다고 하는 거리를 지켜보고 싶다고 생각해서."
51110-232 = "도와준 건 고마워."
51110-233 = "하지만 이만 여기선……"
51110-234 = "[s] \"일단 시간도 늦었으니 돌아갈까?\""
51110-238 = "응? 내가 왜 당신과, 잠깐……"
51110-244 = "잠깐…… 그게…… 저기……!"
51110-251 = "(함께 돌아가는 발걸음 위로 침묵이 내려앉았다.)"
51110-252 = "………"
51110-253 = "……………"
51110-254 = "당신은…… 백귀야행에 볼일이 있어 찾아왔다고 했었지."
51110-255 = "해산령에 대해서도 이미 알고 있었고."
51110-256 = "그렇다면 혹시…… 백화요란에 대해서……."
51110-257 = "[s] \"백화요란의 근황에 대해 알고 있느냐고?\""
51110-258 = "……응. 떠나온 지 제법 되었으니까. 다소 궁금, 하게 여기고 있긴 해."
51110-259 = "최근 백화요란이 어떤 상황인지."
51110-261 = "(굳이 숨길 이야기도 아니었던 만큼, 요청에 따라 오늘 하루 유카리와 있었던 일에 대해 대강 설명했다.)"
51110-263 = "……계승전, 이라고."
51110-264 = "그렇구나. 내가 없는 사이에 그런 일들이……."
51110-265 = "왜 그런 일까지……."
51110-266 = "………아니, 내게 역시 그런 말을 할 자격 따윈……."
51110-267 = "[s] \"결국 이대로 있으면 안 된다고. 유카리는 그렇게 마음먹은 거라고 생각해.\""
51110-268 = "그래, 유카리는………"
51110-270 = "백귀야행의 주택가"
51110-273 = "여기까지면 충분해."
51110-274 = "데려다줘서 고마워. 샬레의, 선생님."
51110-275 = "그럼……."
51110-276 = "[s] \"백화요란으로 돌아올 생각은 없어?\""
51110-280 = "그래, 떠나기 전, 상대가 보여준 호의에 잠시 마음이 누그러진 틈을 타."
51110-281 = "갑작스레 여기서 그런 걸 묻는다는 거구나."
51110-282 = "생각보다 엉큼한 점이 있는걸. 당신."
51110-283 = "………미안하지만, 난 돌아가지 못해."
51110-284 = "[s] \"역시 탈퇴한 부원이라서?\""
51110-285 = "…………그래."
51110-286 = "그때, <그걸> 반납하려 한 나를……… 그 아이들은 더는 용서하지 않을 테니까."
51110-287 = "그런 주제에…… 이제 와서 염치없이 돌아갈 수 있을 만큼, 나는 뻔뻔하지도……."
51110-288 = "그리고 강하지도 않아."
51110-289 = "내게…… 그럴 자격 따윈 없으니까."
51110-290 = "난…… <그 아이>가 아니니까."
51110-295 = "남겨진 아이들을, 실망시키고 싶지 않으니까……."
51110-296 = "……그래, 내가 돌아갈 수 없는 이유는 그뿐이야. 그러니……"
51110-301 = "[log=???]<거짓말>[/log]"
51110-304 = "<거짓말>"
51110-307 = "<거짓말>"
51110-310 = "<거짓말>"
51110-313 = "그럼 이만."
51110-317 = "[ns] \"……역시 백화요란 부원들에겐 민감한 이야기, 겠지.\""
51110-321 = "[ns] \"다음에 만났을 때는…… 적어도 이름을 들을 수 있으면 좋겠는데.\""
51110-323 = "(그렇게 날은 깊게 저물어 갔다.)"
51110-325 = "다음화;키류 키쿄, 그리고 계승전 1"
