[translation]
2005806-1 = "Erika, Consultation"
2005806-2 = "..."
2005806-3 = "[ns] \"Hello, Erika!\""
2005806-4 = ""
2005806-6 = ""
2005806-7 = "Hello, Sensei..."
2005806-8 = "I didn't expect you to fly over here. Were you not doing anything?"
2005806-9 = "You didn't want to let this rare event slip by?"
2005806-10 = "Ah... I guess I don't usually ask for help with my problems."
2005806-11 = ""
2005806-13 = ""
2005806-14 = "I just figured you were someone...I could trust? Rely on?"
2005806-15 = "...Hey. You're looking awfully smug about that."
2005806-16 = "A-Anyway!"
2005806-17 = "I tried organizing my thoughts while I was waiting for you."
2005806-18 = "But I thought I had more time, so I'm sorry if I'm still all over the place."
2005806-19 = "[s] \"There's no pressure.\""
2005806-20 = "Hm..."
2005806-21 = ""
2005806-23 = ""
2005806-24 = "Hmmm..."
2005806-25 = "It's just something I've been working through for a while."
2005806-26 = "I do like hanging out with other people."
2005806-27 = "It's fun being with them, talking to them, going to karaoke, all of that."
2005806-28 = "But, hm..."
2005806-29 = "There are times where..."
2005806-30 = "...I feel like I run out of things to say?"
2005806-31 = "Ah, and it's not like I don't connect with my friends or anything. It's a \"me\" thing."
2005806-32 = "I really do like hanging out with them. It's always fun when we're together."
2005806-33 = "But, well..."
2005806-34 = "Let me give you an example. Let's say everyone's talking, and then someone makes a joke."
2005806-35 = "There's a way I'd normally react to something funny..."
2005806-36 = "...but it's like I can't express it in the moment."
2005806-37 = "It's like I've run out of the energy to talk."
2005806-38 = "But I'm not tired or sick. It's more like..."
2005806-39 = "[ns] \"Like...\""
2005806-41 = "[ns] \"...you're feeling drained?\""
2005806-42 = "Drained...?"
2005806-43 = "[s1] \"You know, everyone has their own energy reserve.\"\n[s2] \"You'll feel drained once you've used all of it.\""
2005806-46 = "I mean, you're describing the feeling, but that doesn't make sense. I don't do enough to be burning through all my energy."
2005806-47 = "Even having fun uses up energy?"
2005806-48 = "Some people call it a \"social battery\"...?"
2005806-49 = "[s3] \"And that's when you need alone time.\"\n[s4] \"Time to 'recharge,' as they say.\""
2005806-52 = "Wow, recharge? You mean that thing introverts need?"
2005806-53 = "I never thought I was someone who needed to recharge."
2005806-54 = "My friends make me happy, and it feels like a productive day whenever I go out."
2005806-55 = "..."
2005806-56 = "Huh. Is that what it's been the whole time?!"
2005806-57 = "...Wow."
2005806-58 = "That's a lot to process."
2005806-59 = "I think what you're saying makes sense."
2005806-60 = "I'm just someone...who needs a little bit of alone time."
2005806-61 = "[ns]\"This is just my opinion, but I've always seen you that way.\""
2005806-62 = "Y-Yeah?"
2005806-63 = "[s] \"A lot of our chance meetings have been when you were alone.\""
2005806-64 = "Ah, I guess you're right."
2005806-65 = "[s5] \"And every time, it didn't seem like you were lonely.\"\n[s6] \"You looked like you were having fun.\""
2005806-68 = ""
2005806-70 = ""
2005806-71 = "...Yeah."
2005806-72 = "It's kinda fun being alone. And there are certain activities that are better solo."
2005806-73 = "Now that I'm thinking about it... I have this one place I like to go when it's just me."
2005806-74 = "[s] \"Kinda like a secret base?\""
2005806-75 = "A \"secret base\"..."
2005806-76 = "[s] \"Everyone needs their own 'secret base,' in one form or another.\""
2005806-77 = "Ah, I get what you're saying."
2005806-78 = "Yeah. I always feel relaxed when I'm at my base."
2005806-79 = "I've always thought of myself as an extrovert..."
2005806-80 = "It's just a little weird to realize that I might not be."
2005806-81 = "[s7] \"Extroverted, introverted...\"\n[s8] \"Life isn't so black and white.\""
2005806-84 = "Humans are multi-faceted?"
2005806-85 = "No matter what angle I'm being viewed from, I'm still me...?"
2005806-86 = "The me that likes playing with friends is also me. The one that likes spending time by herself is also me."
2005806-87 = "[ns9] \"It's important to maintain good relationships...\"\n[ns10] \"...but not at the cost of your well-being.\"\n[ns11] \"None of your friends would want that.\""
2005806-92 = "[ns] \"It's important to have a good relationship with yourself, too.\""
2005806-93 = "Wow. You really have your adult moments sometimes, Sensei."
2005806-94 = "[s] \"Haha! That's because I am one!\""
2005806-95 = "Anyway, I'm glad I brought this up with you, Sensei. I feel a lot better."
2005806-96 = "And I've learned a little more about myself. That sometimes I need to take a step back and recharge."
2005806-97 = "It definitely challenges my view of myself, but I don't think that's a bad thing."
2005806-98 = "[s12] \"I'm always here for another consultation if you need one.\"\n[s13] \"You can use me proactively!\""
2005806-101 = ""
2005806-103 = ""
2005806-104 = "\"Use\" you? I've never thought about it that way."
2005806-105 = "Of course, I get what you are trying to say..."
2005806-106 = "But if you say it like that, a student who approaches you with pure intentions might take that personally."
2005806-107 = "[s] \"Ah, that was my mistake... Sorry.\""
2005806-108 = "Well, then I'll book you for another consultation soon."
2005806-109 = ""
2005806-111 = ""
2005806-112 = ""
2005806-113 = "Got it?"
2005806-114 = "[s] \"Yes. I promise.\""
2005806-115 = "Yes, pinky swear."
2005806-116 = ""
2005806-118 = ""
2005806-119 = "..."
2005806-120 = "As I thought. You have warm hands, Sensei."
2005806-121 = "[s] \"You have soft hands, Erika.\""
2005806-122 = ""
2005806-124 = ""
2005806-125 = "I think I'm starting to get used to that as well."
2005806-127 = "After the consultation, we had fun talking until I had to go."
