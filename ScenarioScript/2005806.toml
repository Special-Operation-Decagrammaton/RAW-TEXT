[translation]
2005806-1 = "에리카, 상담"
2005806-2 = "……."
2005806-3 = "[ns]\"안녕, 에리카!\""
2005806-7 = "안녕, 선생님……."
2005806-8 = "이렇게 바로 와줄 줄은 몰랐어. 마침 시간 괜찮았던 거야?"
2005806-9 = "'에리카가 상담을 요청해 오는 건 드문 일이라고 생각해서'……?"
2005806-10 = "……뭐, 그럴지도 모르겠네. 웬만하면 굳이 걱정 같은 걸 다른 사람한테 말하지는 않으니까."
2005806-14 = "선생님은…… 믿을 수 있는? 내가 조금쯤 기대도 괜찮은? 그런 사람이라고 생각했거든."
2005806-15 = "……뭐야, 그 표정. 엄청 우쭐대는 느낌인데?"
2005806-16 = "아, 아무튼!"
2005806-17 = "기다리면서 생각을 좀 정리하긴 했는데……."
2005806-18 = "이렇게 빨리 상담하게 될 줄은 몰라서, 좀 두서없을지도."
2005806-19 = "[s]\"편하게 말해줘.\""
2005806-20 = "음……."
2005806-24 = "으음~~"
2005806-25 = "……그러니까, 얼마 전부터 좀 많이 느낀 건데."
2005806-26 = "애들이랑 노는 거, 좋거든?"
2005806-27 = "함께 있는 것도, 이런저런 수다 떠는 것도, 노래방을 가거나 함께 쇼핑하는 것도 좋아해."
2005806-28 = "그런데, 으음……"
2005806-29 = "뭐랄까…… 살짝, 어느 순간……."
2005806-30 = "……내 쪽에서 말이 없어진다고 해야 할까?"
2005806-31 = "아, 오해하지 마. 친구들은 전혀 잘못한 거 없어. 전적으로 내 문제야."
2005806-32 = "다시 한번 말하지만, 친구들이랑 함께 있는 거 절대 싫지 않거든. 같이 있으면 재미있고 좋아."
2005806-33 = "그런데, 뭔가……."
2005806-34 = "예를 들어 친구들이랑 수다를 떨다가, 누가 재미있는 말을 했다?"
2005806-35 = "그럼 만약 평소 같았으면 내가 이렇게 반응했을 텐데, 라고 머리로는 생각하지만……"
2005806-36 = "그게 말로 잘 안 나오는 거야."
2005806-37 = "이렇게 표현하긴 좀 그렇지만, 말할 기력이 없다는 느낌."
2005806-38 = "물론 실제로 기운이 없는 건 아니고…… 아프다거나 하지는 않으니까."
2005806-39 = "[ns]\"그거,\""
2005806-41 = "[ns]\"조금 지친 거 아냐?\""
2005806-42 = "지쳤다……?"
2005806-43 = "[s1]\"왜, 누구나 갖고 있는 에너지가 있잖아.\"\n[s2]\"그 에너지를 다 사용해버리면 지치게 되니까.\""
2005806-46 = "어…… 그 느낌인 것 같긴 한데. 에너지를 다 써버릴 일이 있나……? 뭔가 무리하게 활동한 적은 없는 것 같거든."
2005806-47 = "노는 것에도 에너지가 필요하다?"
2005806-48 = "사람을 만날 때에도 에너지를 쓰는 법……?"
2005806-49 = "[s3]\"그럴 때 혼자만의 시간이 필요한 거지.\"\n[s4]\"흔히 '충전'이라고 하는 시간이.\""
2005806-52 = "와, 충전이라니. 내향적인 사람들한테 필요하다는 그거?"
2005806-53 = "나한테 충전이 필요하다는 생각은 한 번도 해본 적 없었는데……."
2005806-54 = "친구들을 만나면 기분 좋고, 약속이 있으면 하루를 충실하게 보냈다는 느낌이 들고……."
2005806-55 = "……."
2005806-56 = "어……? 잠깐……. 그게 그래서 그랬던 건가……?"
2005806-57 = "……우와."
2005806-58 = "선생님, 나 방금 좀 충격받았어."
2005806-59 = "그거 맞는 것 같아……."
2005806-60 = "나, 나는…… 혼자 있는 시간이 필요한 사람이었구나……."
2005806-61 = "[ns]\"내 생각이지만, 에리카는 혼자 있는 시간도 좋아하는 것 같던데.\""
2005806-62 = "그, 그래?"
2005806-63 = "[s]\"혼자 있을 때 꽤 자주 마주쳤잖아, 우리.\""
2005806-64 = "아, 그건…… 생각해 보니 그렇네."
2005806-65 = "[s5]\"그럴 때마다 에리카, 외로운 느낌은 아니었거든.\"\n[s6]\"나름 즐거워 보였달까.\""
2005806-71 = "……맞아."
2005806-72 = "혼자 있는 것도 나름 재미있고. 혼자 있을 때만 가능한 것들도 있으니까."
2005806-73 = "그래서 그랬던 건가…… 혼자서 종종 가는 장소가 하나 있기도 하거든."
2005806-74 = "[s]\"에리카만의 비밀기지 같은?\""
2005806-75 = "비밀기지……."
2005806-76 = "[s]\"사람에게는 자신만의 비밀기지가 필요하니까.\""
2005806-77 = "아, 그렇다면 그럴지도."
2005806-78 = "왠지 그곳에 갈 때마다 마음이 편했는데, 이제 그 이유를 명확히 알게 된 기분이야."
2005806-79 = "아무튼 나, 지금까지 내가 외향적인 사람이라고 생각했었는데……."
2005806-80 = "아니었다니…… 소소하게 충격이야."
2005806-81 = "[s7]\"외향적이라거나, 내향적이라거나.\"\n[s8]\"그건 아마 딱 잘라서 나눌 수 없을지도 몰라.\""
2005806-84 = "사람은 동전처럼 양면만 있는 존재가 아니니까……?"
2005806-85 = "'나를 어떤 각도에서 봐도, 그 모든 게 나'……."
2005806-86 = "친구들과 노는 순간을 좋아하는 것도 나. 혼자 있는 시간을 좋아하는 것도 나."
2005806-87 = "[ns9]\"좋은 관계를 유지하는 것도 중요하지만,\"\n[ns10]\"지나치게 다른 사람한테 맞추느라 힘들어지는 건 좋지 않아.\"\n[ns11]\"그건 에리카의 친구 중 누구도 원하는 바가 아닐 테니까.\""
2005806-92 = "[ns]\"중요한 건, 에리카가 스스로의 중심을 지키는 일이라고 생각해.\""
2005806-93 = "선생님, 방금 좀 어른스러웠다. 가끔 이런다니까."
2005806-94 = "[s]\"어른 맞거든~\""
2005806-95 = "아무튼 선생님에게 상담하기를 잘했어. 속이 좀 시원해진 기분!"
2005806-96 = "나 자신에 대해 조금 더 알게 된 것 같아. 음. 사실 나는 충전이 필요한 존재였다!"
2005806-97 = "스스로 생각하던 모습과 달라서 살~짝 충격받았지만, 그것도 나름 괜찮아."
2005806-98 = "[s12]\"상담이 필요하면 언제든지 이야기해.\"\n[s13]\"나를 적극적으로 이용해도 되니까.\""
2005806-104 = "이용이라니. 그렇게 생각한 적은 한 번도 없다구."
2005806-105 = "물론 선생님이 무슨 의미로 말한 건지는 알겠지만……."
2005806-106 = "그런 식으로 말하면, 진심으로 다가간 학생은 상처받을지도 모른다?"
2005806-107 = "[s]\"아, 방금 건 내 실수…… 미안.\""
2005806-108 = "뭐, 그럼 다음에도 상담해 주기로."
2005806-113 = "알았지?"
2005806-114 = "[s]\"그래, 약속.\""
2005806-115 = "응, 손가락 걸고 약속."
2005806-119 = "……."
2005806-120 = "역시 따뜻하네. 선생님의 손."
2005806-121 = "[s]\"에리카의 손은 역시 부드럽네.\""
2005806-125 = "그 얘기도 이제 슬슬 적응되는 것 같다니까."
2005806-127 = "(상담을 마친 뒤에도, 한동안 이런저런 이야기를 즐겁게 했다.)"
