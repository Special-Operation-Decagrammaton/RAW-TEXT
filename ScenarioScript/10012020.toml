[translation]
10012020-1 = "제2화;좀 더 그럴싸한 변명을"
10012020-5 = "……음!? 뭐, 뭐야. 무슨 소리야?"
10012020-6 = "뭔가 추락하는 소리 같았는데……. 헬기? 비행기?"
10012020-7 = "……아무튼 자연적인 소리는 아니었지."
10012020-8 = "그리고 인위적인 소리라는 건, 사람이 있다는 뜻이다."
10012020-9 = "……! 라브 대장……!?"
10012020-11 = "후후후……. 일이 재밌게 흘러가네."
10012020-12 = "아직 아무도 찾지 못한 포인트라고 생각하고 있었는데……. 경쟁자가 있었을 줄이야."
10012020-13 = "아무래도 이번 <리조트 사냥>은……. 꽤 스릴이 있겠어."
10012020-14 = "감히 우리 퐁당퐁당 헬멧단의 먹잇감에 얼씬거리다니."
10012020-15 = "문자 그대로……."
10012020-16 = "뜨거운 맛을 보여주는 수밖에!"
10012020-18 = "으으……. 정말이지. 방심했어……."
10012020-19 = "잠깐 한눈파는 사이에 사라져 버리다니……."
10012020-20 = "[s1] \"……세리카?\"\n[s2] \"누굴 찾고 있는 거야?\""
10012020-21 = "……! 아, 선생님! 마침 잘 됐다. 혹시 호시노 선배 본 적 있어?"
10012020-22 = "……! 아, 선생님! 마침 잘 됐다. 혹시 호시노 선배 본 적 있어?"
10012020-23 = "아야네랑 다른 선배들이 챙겨온 용품들 가지러 헬기로 간 동안 둘이서 좀 치워 둘까 했더니……."
10012020-24 = "[s3] \"아하. 또다시 숨바꼭질인가.\"\n[s4] \"아아. 호시노를 찾으면 되는 거지?\""
10012020-25 = "뭐가 그리 즐겁다는 투로 말하는 거야……."
10012020-26 = "응. 부탁 좀 할게, 선생님. 난 치우던 걸 마저 치워야 할 거 같아서."
10012020-27 = "그다지 멀리 가진 않았을 거야. 어쩌면 이 건물 안 어딘가에 있을 수도 있겠지."
10012020-28 = "그리고 선배 찾으면 꼭 나한테 연락해 줘야 해. 알았지?"
10012020-29 = "선생님은 쓸데없이 사람이 무르니까, 호시노 선배가 적당히 부탁하면 또 대신 치우고 있을 게 뻔하다고."
10012020-30 = "알았지? 깨우지 말고 나한테 먼저 연락! 약속이야!!"
10012020-32 = "(이후 호시노를 찾아 리조트 건물 안을 한 바퀴 쭉 둘러보았다.)"
10012020-33 = "(처음 같이 한 번 둘러본 곳이었기에 그다지 길을 헤매진 않았다.)"
10012020-40 = "(……?)"
10012020-41 = "……? 어라, 선생……? 여긴 어쩐 일이야?"
10012020-42 = "[s5] \"……호시노?\"\n[s6] \"호시노를 찾고 있었지.\""
10012020-43 = "어…… 아저씨를 찾고 있었어?"
10012020-44 = "한참을 찾아다녔다고? ……어째서?"
10012020-45 = "아-. 세리카한테 말 안했었구나. 미안미안."
10012020-46 = "너무하구만……. 이래 봬도 성실하게 청소도구를 찾아다니고 있었는데 말이지……."
10012020-47 = "눈에 보이지 않는다고 해서 곧바로 자고 있을 거라 생각하다니……. 아저씨 상처받았다고."
10012020-48 = "세리카 쨩 혼자서 저렇게 고생하는데, 설마 아무리 나라도 여기서 편하게 잠을 자겠어?"
10012020-49 = "평소의 모습……?"
10012020-50 = "에헤헤……. 그러니까 그 부분을 어떻게 좀……."
10012020-54 = "……응?"
10012020-55 = "뭐라고? 방금 뭘 보고 있었냐고?"
10012020-56 = "……여전히 눈썰미가 좋구만, 선생."
10012020-57 = "뭐어. 여긴 후배들도 없고……. 선생이니까 상관없으려나."
10012020-58 = "그냥 좀, 괜히 신경 쓰이는 게 좀 있어서 말이지."
10012020-62 = "[ns7] \"……오래된 축제 포스터……네.\"\n[ns8] \"그러고 보니 아비도스에도 비슷한 것들이 있었지.\""
10012020-63 = "……으헤."
10012020-64 = "……으헤."
10012020-65 = "[s] \"……호시노…….\""
10012020-66 = "워, 워. 그냥 아저씨의 주접 같은 거니까. 다른 애들에겐 말하지 말아줘."
10012020-67 = "보기엔 그래도 꽤 섬세한 아이들이니까 말이야. 괜히 신경 쓰기 시작하면 분명 제대로 놀지도 못할 거라고."
10012020-68 = "기껏 여기까지 와 놓고 말이지. 그런 건 좀 손해잖아. 안 그래?"
10012020-69 = "[s] \"…….\""
10012020-70 = "……그러니까 그런 표정 짓지 말래도."
10012020-71 = "괜찮아, 괜찮아. 선생. 뭘 걱정하는지는 알겠지만 그런 건 아니라고. 알았지?"
10012020-72 = "[s9] \"……우선 같이 정리할까.\"\n[s10] \"그럼 이왕 하는 거, 여기도 청소하자.\""
10012020-73 = "으헤……."
10012020-74 = "으헤……."
10012020-75 = "말은 고맙지만, 굳이 그렇게까지는 안 해줘도 되는데."
10012020-76 = "어차피 여긴 변두리 쪽 방이고……. 치울 거면 세리카 쨩이 있는 쪽으로 돌아가는 게……?"
10012020-80 = "……………………."
10012020-81 = "흐으……. 알았어, 알았어. 선생. 같이 붙이자고. 좋아."
10012020-82 = "이 아저씨는 선생이 그렇게 말없이 보고만 있을 때가 가장 곤란하다니까."
10012020-83 = "그럼 청소 도구 가져와 주는 것만 좀 부탁하도록 할까~? 난 먼저 치우고 있을 테니."
10012020-84 = "……도망치는 거 아니니까 걱정하지 말고."
10012020-85 = "[s] 청소 도구를 가지러 다녀온다."
10012020-90 = "(이후 호시노와 함께 깨끗이 주변을 청소했다.)"
10012020-92 = "(마치 개장 당일인 것처럼 보기 좋은 실내가 되었다.)"
10012020-93 = "히야……. 내심 시작할 땐 이 넓은 델 어떻게 둘이서 치우나 했는데……. 되긴 되는구만."
10012020-94 = "선생도 수고했어. 이런 곳까지 끌려와서 우리 때문에 고생이 많네~."
10012020-95 = "[s11] \"신경 쓰지 마. 별거 아니니까.\"\n[s12] \"호시노가 거의 다 했지.\""
10012020-96 = "……항상 그런 식으로 말하면 어디까지 해도 되는지 모르게 돼버린다구?"
10012020-97 = "……항상 그런 식으로 말하면 어디까지 해도 되는지 모르게 돼버린다구?"
10012020-98 = "그래도……. 그러네. 확실히 깔끔해진 걸 보고 있으니 어딘가 시원해진 기분이 들어."
10012020-99 = "……응."
10012020-100 = "어디와는 달리 치우면 치워진다는 느낌이 확실히……."
10012020-101 = "찾았다!! 여기 있었구나, 선배!!"
10012020-102 = "……으응?"
10012020-103 = "도대체가 말이야, 사람이 잠시만 눈을 팔아도 도망쳐 버리고!"
10012020-104 = "나 혼자 치우면서 찾느라 얼마나 고생한 줄 알아? 가끔은 선배도 스스로……."
10012020-105 = "청소……를……?"
10012020-106 = "……어?"
10012020-107 = "뭐, 뭐야. 여기……. 왜 이렇게 깔끔해? 왜 여기만 청소가 다 돼 있는 거야……?"
10012020-108 = "[s13] \"호시노가 거의 다 치웠어.\"\n[s14] \"난 조금 거들었을 뿐이야.\""
10012020-109 = "지, 진짜야? 진짜 이렇게 깔끔하게……? 호시노 선배가……?"
10012020-110 = "지, 진짜야? 진짜 이렇게 깔끔하게……? 호시노 선배가……?"
10012020-111 = "흐흥~. 세리카 쨩. 놀란 얼굴도 귀엽네~."
10012020-112 = "호시노 선배……."
10012020-113 = "뭐야……. 그렇게까지 기뻐하면 조금 쑥스러운걸."
10012020-114 = "어때, 세리카 쨩…… 아저씨를 다시 봤어?"
10012020-115 = "……선배……. 이렇게나……."
10012020-116 = "……이렇게나 잘할 수 있었으면서……. 지금까지 부실에선 항상 그렇게……?"
10012020-118 = "어째서…… 지금까지, 제대로 하지 않았던 거야……?"
10012020-120 = "……? 엉?"
10012020-121 = "……어라. 어……."
10012020-122 = "잠깐만……. 선생……. 이거 어떻게 생각해~? 혹시 지금 이 아저씨는 위기에 처한 걸까……?"
10012020-123 = "[s15] \"……자업자득일지도.\"\n[s16] \"여기선 제가 도와드릴 수 있는 게 없네요.\""
10012020-124 = "으아아아~. 선생……! 이렇게 날 배신하는 거야!? 여기까지 와서 날 내치겠다고……!?"
10012020-125 = "으아아아~. 선생……! 이렇게 날 배신하는 거야!? 여기까지 와서 날 내치겠다고……!?"
10012020-126 = "무슨 선생님을 탓하고 있어!?"
10012020-127 = "이리 와! 이거 진짜 나랑 진지하게 이야길 좀 해 봐야겠어!!"
10012020-131 = "……응? 문 열리는 소리?"
10012020-132 = "……어라. 누가 왔나?"
10012020-133 = "선배들인가 보네. 마침 잘 됐어!"
10012020-134 = "모두 들어 봐, 사실 호시노 선배가……!?"
10012020-140 = "……? 응? 뭐야, 사람……!?"
10012020-141 = " ……앗!"
10012020-143 = "……? 응?"
10012020-144 = "여기다, 여기! 놈들이 여기 있다!!"
10012020-145 = "대장, 여기에요! 녀석들을 찾았습니다!!"
10012020-146 = "뭐, 뭐!? 녀석들? 갑자기 무슨 소리야? 우릴 찾았다고……?"
10012020-148 = "정말이로군. 설마 우리보다 빨리 여길 찾아냈을 줄이야……. 보통 실력이 아니네."
10012020-149 = "……후후후."
10012020-150 = "……말해 봐, 너희도 역시 <리조트 사냥꾼>이지? 그 눈빛……. 보면 알 수 있다고?"
10012020-151 = "……?"
10012020-152 = "……뭐?"
10012020-153 = "…………무슨 눈빛?"
10012020-154 = "시치미 떼고 있군. 정체를 밝히기 싫은 건가?"
10012020-155 = "뭐, 상관없어. 경쟁자가 있다면……."
10012020-156 = "……힘으로 몰아내고 쟁취하는 게, 이곳의 법도니까 말이야."
10012020-157 = "얘들아!! 연장 들어라!!"
10012020-159 = "전원 전투 준비!!"
10012020-160 = "본때를 보여주자고!!"
10012020-168 = "……? 엉???"
10012020-169 = "뭐, 뭐야!? 뭔데 이 녀석들!? 왜 다짜고짜 나타나서 총부터 들이미는데?!"
10012020-174 = "……뭔진 모르지만 아무래도 충돌은 피하기 힘들 거 같네."
10012020-175 = "그럼……. 어쩔 수 없으니 일단……."
10012020-176 = "……영차~."
10012020-177 = "잘 부탁해, 선생~."
