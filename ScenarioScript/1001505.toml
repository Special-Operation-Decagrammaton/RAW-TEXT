[translation]
1001505-1 = "아리스의 선택"
1001505-3 = "(아리스가 카페 구석에 앉아서 열심히 폰을 만지고 있다.)"
1001505-4 = "(가까이 가도 알아차리지 못하고 화면에 집중하고 있다.)"
1001505-5 = "[s1] \"아리스 안녕.\"\n[s2] \"무슨 게임 하고 있어?\""
1001505-8 = "선생님, 좋은 아침입니다."
1001505-9 = "요즘 학원 내에서 유행하고 있다는 게임이라는데, 난이도가 높습니다. 무엇을 선택해야 할지 모르겠습니다."
1001505-10 = "아리스에게 어려운 결정을 요구합니다……. 어려운 게임입니다."
1001505-11 = "[s3] \"무슨 게임이야?\"\n[s4] \"어떤 선택을 해야 하는데?\""
1001505-12 = "주인공은 가슴털 왕자님이라고 불리는 크로마티 왕국의 제 2왕자입니다."
1001505-13 = "주인공은 가슴털 왕자님이라고 불리는 크로마티 왕국의 제 2왕자입니다."
1001505-14 = "[s] \"음…….\""
1001505-15 = "대흉근의 밀림 같은 가슴털이 왕국 내에서 최고의 매력이라고 합니다."
1001505-16 = "[s] \"어…….\""
1001505-17 = "이웃의 다른 임금님들이 가슴털 왕자님을 쟁취하려고 피튀기는 경쟁을 하는데,"
1001505-18 = "이번 회차에선 턱수염 폐하와 대머리 황제님만 남았습니다."
1001505-19 = "가슴털 왕자님은 턱수염 폐하와 대머리 황제님 중 누구를 골라야 행복해질까요?"
1001505-20 = "어느 쪽도 왕자님을 행복하게 해줄 수 있을 것 같아서, 아리스는 결정을 하기 힘듭니다……."
1001505-21 = "[s5] \"으으음…….\"\n[s6] \"어려운 문제구나…….\""
1001505-22 = "턱수염 폐하는 알몸으로 거리를 달리는 취미가 있어서 왕자님과 같은 취미를 공유할 수 있고,"
1001505-23 = "턱수염 폐하는 알몸으로 거리를 달리는 취미가 있어서 왕자님과 같은 취미를 공유할 수 있고,"
1001505-24 = "대머리 황제님은 근육 페스티벌에서 몇 번이나 우승한 세계관 최고의 미남이라, 왕자님의 대흉근을 넓혀서 가슴털을 돋보이게 해줄 수 있습니다."
1001505-25 = "[s7] \"괜찮은 거야, 그 게임……?\"\n[s8] \"위험해보이는 물건이네…….\""
1001505-26 = "어느 쪽이라도 주인공은 행복해질 거 같은데, 여기에 우열을 정하라니…… 너무 어려운 문제입니다."
1001505-27 = "어느 쪽이라도 주인공은 행복해질 거 같은데, 여기에 우열을 정하라니…… 너무 어려운 문제입니다."
1001505-28 = "[s9] \"이건 아리스가 결정해야만 할 문제네.\"\n[s10] \"내가 돕진 못하지만 응원할게.\""
1001505-31 = "감사합니다. 선생님. 이것은 아리스가 해야할 선택이군요."
1001505-32 = "가슴털이냐, 알몸 달리기이냐."
1001505-33 = "턱수염이냐, 대머리냐."
1001505-34 = "[s11] \"……역시 위험해보이는 게임 같은데.\"\n[s12] \"괜찮은 건가…….\""
1001505-38 = "(아리스는 한동안 공략 사이트를 뒤지면서 고민하다가,)"
1001505-42 = "아리스, 공략법을 찾은 것 같습니다!"
1001505-43 = "학원으로 돌아가서 시도해보겠습니다."
1001505-45 = "(라고 하고는, 기쁜 얼굴로 학원으로 돌아갔다.)"
