[translation]
2001802-1 = "Collateral Damage"
2001802-2 = "……그렇군. [ruby=ECM]전파교란장치[/ruby]를 가지고 있는 좀도둑이 블랙마켓으로 도망치는 바람에 추적이 어렵게 되었다는 건가……"
2001802-3 = "확실히, 이 일대는 길도 복잡하고 CCTV 영상에 의존해야 하는 구간도 많으니까. 교란장치를 갖고 있는 상대라면 추적이 어렵겠지."
2001802-4 = "이런 상황이라면 [ruby=전파교란방지]ECCM[/ruby] 대책이 완비된 SRT의 열추적 드론을 쓰는 게 제일이긴 해. 나에게 도움을 요청한 건 좋은 판단이었어. 쿠히히……"
2001802-5 = "그런데 정말 괜찮겠어, 선생님? 내 도움을 받아도……?"
2001802-6 = "[s1] \"무슨 뜻인지는 모르겠는데……\"\n[s2] \"작전에 무슨 문제라도 있어?\""
2001802-7 = "아니, 작전 준비는 완벽해. 지금이라도 바로 드론을 전개해서 용의자를 추적할 수 있어."
2001802-8 = "아니, 작전 준비는 완벽해. 지금이라도 바로 드론을 전개해서 용의자를 추적할 수 있어."
2001802-9 = "다만 오랜만에 허락을 받고 화기를 잔뜩 쓸 수 있다고 생각하니, 온몸이 근질거려서……"
2001802-10 = "[s] \"잔뜩 써도 된다고 하지는 않았는데…….\""
2001802-11 = "괜찮아, 괜찮아. 그런 사소한 건 신경 쓰지 말라고."
2001802-12 = "……그럼 바로, 시작해 볼까?"
2001802-16 = "헉, 헉…… 여기까지 왔으면 더는 쫓아오지 못하겠지?"
2001802-17 = "조금 비싸긴 했지만 전파교란장치를 구입하길 잘했어."
2001802-18 = "이 교란장치만 있으면 CCTV에도 찍히지 않고, 무인기도 내 존재를 알아차리지 못하니, 들킬 걱정 없이 편리하게 도둑질을 할 수 있겠어."
2001802-19 = "이대로 가면 금세 원금을 회수할 수—"
2001802-23 = "우, 우앗?! 뭐야, 이 드론들은?!"
2001802-24 = "어째서 내 전파교란장치가 듣질 않는 거지?"
2001802-28 = "앗, 따가. 앗, 따가워! 이, 일단 도망치자!"
2001802-32 = "후후, 도망쳐도 소용없다고. 땅을 파고 들어가지 않는 한, 내가 오퍼레이팅 하는 드론에게선 벗어날 수 없으니까."
2001802-33 = "다만 금방 잡히면 시시하니까, 좀 더 열심히 도망쳤으면 좋겠네~"
2001802-34 = "[s3] \"저기…… 모에?\"\n[s4] \"너무 과격하게 하진 말았으면 하는데…….\""
2001802-35 = "괜찮아, 괜찮아. 나도 일단은 진지하게 작전에 임하고 있으니까."
2001802-36 = "괜찮아, 괜찮아. 나도 일단은 진지하게 작전에 임하고 있으니까."
2001802-37 = "아직까지는…… 말이지. 쿠히히."
2001802-38 = "[s] \"아직은……?!\""
2001802-39 = "아, 저쪽 방향에서 다시 신호가 잡힌 모양이네."
2001802-40 = "선생님, 잠시 기다려줘. 다시 한번 총알을 잔뜩 쏟아내고 올 테니까……!"
2001802-47 = "앗, 따가! 아프다고! 이제 그만해!"
2001802-48 = "우우…… 더는 못 참겠어! 항복이야!"
2001802-49 = "……응? 벌써 항복이라고?"
2001802-50 = "어디에 숨더라도, 어디로 도망치더라도, 드론이 귀신같이 쫓아와 무차별 사격을 가하니 견딜 수가 없어!"
2001802-51 = "훔친 물건은 모두 돌려놓을 테니, 이제 제발 사격을 멈춰줘!"
2001802-52 = "[s5] \"수고했어. 모에.\"\n[s6] \"이제 드론은 철수시켜도 돼.\""
2001802-53 = "……"
2001802-54 = "……"
2001802-56 = "……아직 미사일은 쏘지도 않았는데?"
2001802-57 = "[s] \"……도둑을 잡는 데 미사일은 필요 없어.\""
2001802-59 = "[ns7] \"게다가 그 근처에는 가연성 물질이 잔뜩 있어서……\"\n[ns8] \"폭발이라도 일어나면 곤란해…….\""
2001802-60 = "……지금 미사일을 쏘면 곤란해질 거라고?"
2001802-61 = "……지금 미사일을 쏘면 곤란해질 거라고?"
2001802-62 = "……그렇군. 내가 지금 이 발사 버튼을 누르면, 돌이킬 수 없는 결과가 발생하는 건가……."
2001802-63 = "분명 그 결과에는 엄청난 책임이 뒤따르겠지……"
2001802-64 = "그리고 엄청난 책임에는 엄청난 쾌락이……"
2001802-65 = "하아…… 하아, 하아……."
2001802-66 = "[s] \"저기, 모에 씨……?\""
2001802-67 = "……역시 못 참겠어!!"
2001802-71 = "자, 잠깐…… 드론이 이상한 빛으로 빛나고 있는데……"
2001802-72 = "서, 설마 저거 미사일이야? 지금 여기서 발사하려는 거야?"
2001802-73 = "지금 미사일을 쏘면 이 일대가 엉망이 될지도 모른다고?!"
2001802-74 = "무책임하게 엉망진창으로 만들어 버린다니……"
2001802-75 = "더더욱 못 참겠어! 하아, 하아……"
2001802-79 = "잠깐! 항복한다고 했잖아!"
2001802-80 = "그만둬어어어어어어!"
2001802-84 = "(……이후 기절한 좀도둑은 경찰에 인계했지만, 미사일로 엉망이 된 거리를 정리하느라 한동안 고생을 했다.)"
2001802-86 = "……."
2001802-87 = "……왜 그런 눈으로 쳐다보는 거야."
2001802-88 = "[s] \"어째서 상황이 끝난 뒤에 미사일을 날린 거야…….\""
2001802-89 = "그건, 그게 그러니까……"
2001802-90 = "그 앞에 미사일 버튼이 있었으니까?"
2001802-91 = "[s] \"어딘가의 등산가처럼 말해도…….\""
2001802-92 = "나도 알아, 안다고. 그 상황에서 미사일을 쏘지 않고 끝내는 게 훨씬 더 이성적이고 합리적인 판단이라는 것은."
2001802-93 = "하지만 이성과는 별개로, 뭔가 절대로 눌러서는 안 되는 버튼이 눈앞에 있으면……"
2001802-94 = "이성이 마비되고, 참을 수가 없게 되어버려…… 하아, 하아……"
2001802-95 = "[s] \"이해하기 어렵네……\""
2001802-96 = "……선생님. 도미노 패를 세우는 걸 본 적 있어?"
2001802-97 = "넘어지기 쉬운 직사각형 모양의 블록을 촘촘히 쌓는 도미노 게임은 고도의 집중력과 인내력을 필요로 하지."
2001802-98 = "한 번이라도 실수로 패를 쓰러트리면 그동안 쌓아 온 노력이 모두 물거품이 되어버릴 수도 있으니까."
2001802-99 = "하지만 그와는 별개로 정교하게 잘 쌓인 도미노 블록을 보면 무너트리고 싶어질 때가 있잖아?"
2001802-100 = "오랜 기간 사람의 노력을 들여 완성한 작품이, 단 한순간의 조작으로 와르르 무너져 내리는 걸 보면…… 뭔가 형용할 수 없는 저릿저릿한 카타르시스가…… 하아, 하아……"
2001802-101 = "[s] \"알 것 같기도 한데……\""
2001802-102 = "그래! 내가 원하는 건 도미노를 무너트리는 그런 종류의 쾌감이야!"
2001802-103 = "오퍼레이터 일을 하다 보면 수많은 버튼을 마주하게 돼."
2001802-104 = "그중에는 비상 상황이 아니라면 절대로 만져서는 안 되는 버튼도 잔뜩 있지."
2001802-105 = "바쁘게 일을 할 때는 알아차리지 못하지만…… 가끔 그 버튼을 눌렀을 때의 결과를 상상하게 될 때가 있어."
2001802-106 = "이 버튼을 누르면 과연 어떤 일이 벌어질까……"
2001802-107 = "그러면 난…… 손을 멈출 수가 없어……"
2001802-108 = "모든 게 엉망이 되겠지…… 박살 나겠지……! 수습도 정리도 안 되는 난장판이 되겠지!"
2001802-109 = "그걸 상상하는 것만으로 나는…… 나는……!"
2001802-110 = "하아, 하아, 하아아……"
2001802-111 = "[s] \"이, 일단 진정해…….\""
2001802-113 = "[ns9] \"여하튼 오늘은 일을 도와줘서 고마워.\"\n[ns10] \"자판기 음료수라도 괜찮다면 하나 살게.\""
2001802-114 = "아, 고마워. 안 그래도 오늘은 날이 더워서 목이 마르던 참이었거든."
2001802-115 = "아, 고마워. 안 그래도 오늘은 날이 더워서 목이 마르던 참이었거든."
2001802-116 = "될 수 있으면 시원한 스포츠 드링크를……"
2001802-117 = "어라? 이 캔은 뭐지? 처음 보는 음료수인데……"
2001802-118 = "……<폭렬 갓 단팥죽>?"
2001802-119 = "[s11] \"뜨겁게 덥힌 캔 단팥죽이네.\"\n[s12] \"오늘 같이 더운 날 먹기는 좀…….\""
2001802-120 = "그렇네. 이렇게 더운 날 뜨거운 단팥죽을 먹었다가는, 수분 보충이 되기는커녕 땀을 잔뜩 흘려 탈진할지도 모르니까."
2001802-121 = "그렇네. 이렇게 더운 날 뜨거운 단팥죽을 먹었다가는, 수분 보충이 되기는커녕 땀을 잔뜩 흘려 탈진할지도 모르니까."
2001802-122 = "이 수많은 선택지 중 단팥죽을 고르는 건 파멸에 가까운 행위지."
2001802-126 = "……하지만 다시 말하자면 이 단팥죽 버튼이야말로 파멸로 이어지는 유일한 선택지."
2001802-127 = "손가락을 들어 이 버튼을 누르는 것만으로도 돌이킬 수 없는 결과를 낳을 수 있다고 생각하니…… 하아, 하아……"
2001802-128 = "[s] \"잠깐, 모에. 기다려—\""
2001802-133 = "하아, 하아…… 정말로 뽑아버렸다……."
2001802-134 = "이 뜨끈하고 묵직한 감각…… 이 날씨에 이런 걸 먹었다간 정말로 큰일 나겠지? 후후후……"
2001802-135 = "[s] \"새로 사줄 테니까 억지로 마시진 마.\""
2001802-136 = "아니, 그럴 순 없지!"
2001802-137 = "내 손으로 택한 파멸인데, 내 손으로 책임지지 않으면 의미가 없으니까."
2001802-138 = "이건 내가 책임지고 마실게!"
2001802-142 = "……우앗! 뜨거워!"
2001802-143 = "걸쭉한 팥죽이 목을 타고 내려가면서 온몸을 뜨겁게 자극해서……"
2001802-144 = "이제는 캔을 입에 가져다 대는 것만으로도 땀이 줄줄 흘러내릴 정도야……"
2001802-145 = "[s] \"정말로 괜찮은 거 맞아……?\""
2001802-146 = "괜찮아…… 아니,"
2001802-147 = "오히려 좋아!"
2001802-148 = "그동안 주변을 파멸시키는 버튼에만 손을 대와서 알아차리지 못했는데, 자신을 파멸로 이끄는 버튼을 직접 손으로 누르는 것도 제법……"
2001802-149 = "여러 가지 의미로 엄청나게 흥분돼…… 하아, 하아……♥"
2001802-151 = "(……이후, 모에는 괴로워하면서도 뜨거운 단팥죽 캔을 끝까지 마셨다.)"
