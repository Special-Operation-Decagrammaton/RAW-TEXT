[translation]
1002703-1 = "생각지 못한 오해"
1002703-3 = "……아. 선생님. 여기다."
1002703-4 = "……?"
1002703-5 = "[s] \"…….\""
1002703-6 = "……? 뭐, 뭐지? 그 표정은?"
1002703-7 = "아, 왜 또 이 옷이냐고?"
1002703-8 = "그야 이번에 이 카페에서 잠입수사를 시작하게 됐으니까 그런 거다만."
1002703-9 = "……그러고 보니 저번에도 그러더니, 선생님은 내가 이 옷을 입을 때마다 물어보는군."
1002703-10 = "뭐랄까. 일부러 묻는 거 같은 느낌이 드는데……. 달리 이유라도 있나?"
1002703-11 = "음? 아무것도 아니라고?"
1002703-12 = "그렇게 말하니 괜히 더 수상한데……."
1002703-13 = "……선생님."
1002703-14 = "혹시나 해서 묻는 말인데, 이런 쪽에 관심이 있는 거라면……."
1002703-15 = "[s1] \"……예? 뭐라고요?\"\n[s2] \"지금 뭔가 엄청난 오해가 발생한 거 같은데.\""
1002703-16 = "……? 뭐지, 그 반응?"
1002703-17 = "……? 뭐지, 그 반응?"
1002703-18 = "설마……. 설마 진짜 그런 거였나……?"
1002703-19 = "놀랍군. 게다가 그 많은 옷들 중에 관심 가지고 있던 옷이 이런 바니걸 의상이었다니……."
1002703-20 = "의, 의외랄까……. 아, 아니. 미안하다. 이런 말을 하면 안 되지. 다른 사람의 취미인 것을."
1002703-21 = "물론 사람의 취미는 자유고, 나는 결코 그런 걸 나쁘게 볼 생각이 전혀 없다."
1002703-22 = "선생님이 어떤 취미를 가지고 있든 나는 다 이해할 것이다. 예쁜 옷을 입어본다는 건 좋은 일이고 말이지."
1002703-23 = "그리고 나는 선생님의 취미에 협조해 줄 의향도 물론 있다. 그간 도움받은 일들도 많으니……."
1002703-24 = "응? 오해라고? 그런 거 아니라고?"
1002703-25 = "……후후."
1002703-26 = "선생님. 아직 날 신뢰하지 못하는 건가……. 아니. 어쩌면 선생님에게는 그만큼 중요한 사안이란 뜻이겠지."
1002703-27 = "음. 알겠다. 괜히 아는 척 이야기해서 미안하군. 이 이야기는 없던 걸로 하지."
1002703-28 = "[s] \"아니. 그게 아니야. 오해야!\""
1002703-29 = "응. 선생님. 알고 있다. 나는 아무것도 모르는 거야."
1002703-30 = "혹여 알게 된다 하더라도 절대로 선생님을 이상하게 보거나 하지 않을 테니……."
1002703-34 = "어이어이! 카린 쨩! 잠깐잠깐!! 또 그런 실수를……!"
1002703-35 = "……!?"
1002703-36 = "[s] \"……!?\""
1002703-37 = "방문한 손님들은 모두 주인님이라 불러드려야 한다고 몇 번 말하니? 얘는, 정말."
1002703-38 = "……아."
1002703-39 = "마, 맞다. 그, 그게……"
1002703-40 = "네. 죄송합니다. ……주의하겠습니다."
1002703-41 = "후우……. 열심히 해주는 건 알고 있지만, 이런 카페는 호칭이 꽤 중요한 문제란다."
1002703-42 = "좀 더 그쪽으로도 신경을 써 주렴."
1002703-43 = "네, 네……"
1002703-48 = "……후우."
1002703-49 = "……큰일 날 뻔했군. 하마터면 들킬 뻔했어. 미안하다. 선생님."
1002703-50 = "[s3] \"진짜 그게 아니라니까…….\"\n[s4] \"제발 내 말을 들어줘…….\""
1002703-51 = "아, 그렇군. 확실히……."
1002703-52 = "아, 그렇군. 확실히……."
1002703-53 = "이 이야기는 자주 꺼낼수록 더 외부로 유출될 가능성이 커지겠군. 미안하다. 자중하지."
1002703-54 = "그래도 걱정은 할 필욘 없어. 선생님……."
1002703-55 = "아니."
1002703-56 = "주인님의 비밀은 내가 꼭 지켜주도록 할 테니까 말이야. 날 믿어도 좋아."
1002703-57 = "그럼 다시 본론으로 돌아가서……. 들어오시죠, 주인님. 이쪽으로."
1002703-61 = "[ns] \"…….\""
1002703-63 = "(결국 오해는 해소되지 않았다.)"
