[translation]
1013605-1 = "신호 방해"
1013605-2 = "(에이미에게서 마지막으로 신호가 들어온 좌표로 황급히 향했다.)"
1013605-3 = "(최악의 가능성만은 실현되지 않기를 기도하며 마음을 졸이던 때……!)"
1013605-6 = "야호~ 여기야. 선생님. 기다렸어."
1013605-7 = "[ns] \"……!\""
1013605-9 = "[ns] \"에이미!\""
1013605-10 = "?!"
1013605-11 = "왜, 왜 그래. 선생님?"
1013605-12 = "화…… 났어?"
1013605-13 = "[s] \"…….\""
1013605-14 = "……."
1013605-15 = "그랬, 구나……."
1013605-16 = "……."
1013605-17 = "미안해, 선생님. 난, 나는……."
1013605-18 = "[s] \"일단, 돌아가면서 이야기하자.\""
1013605-19 = "……."
1013605-20 = "응……."
1013605-21 = "[s] \"……무사해서, 다행이야.\""
1013605-22 = "으, 응……."
1013605-25 = "그게…… 정찰 중이었거든. 그런데 복귀 중에 교전이 일어났어."
1013605-26 = "화력을 조금 많이 과투사한 탓인지…… 백팩의 배터리가 전부 소모되었거든."
1013605-27 = "내 장비는 모두 백팩의 배터리…… 에너지 셸과 연동되어 있으니까."
1013605-28 = "적의 정찰대는 전부 분쇄하긴 했는데, 그 대신…… 그렇게 된 거야."
1013605-29 = "[s1] \"……그래. 그랬구나.\"\n[s2] \"그래도, 큰일 났으면 어쩌려고…….\""
1013605-32 = "그건…… 미안해."
1013605-33 = "그렇지만, 그래도 적의 정찰대를 분쇄해 두는 것이."
1013605-34 = "모든 조건을 따져 보면 효율적일 거라고 생각했어."
1013605-35 = "응? 어떤 효율성도 내 안전과는 교환할 수 없다고?"
1013605-36 = "……."
1013605-37 = "그렇구나."
1013605-38 = "그렇게 생각할 수도…… 있는 거구나."
1013605-39 = "미안해, 선생님. 화내지 마."
1013605-40 = "지금 선생님 얼굴, 정말로 무서우니까."
1013605-41 = "앞으로는 그러지 않을게. 약속."
1013605-42 = "응. 절대로."
1013605-45 = "그래도 말이지……?"
1013605-46 = "나, 내가 그렇게 위험해질 거라고는 생각하지 않았어."
1013605-47 = "일단 베이스 근처였고, 배터리가 아웃되기 직전에 제대로 구조 신호를 보냈고."
1013605-48 = "나는 그 자리에서 움직이지 않을 생각이었으니까."
1013605-49 = "……."
1013605-50 = "응. 맞아. 모두 다 변명이야."
1013605-51 = "……."
1013605-52 = "신기하네."
1013605-53 = "예전에는, 변명 같은 건 비효율적이라고 생각했는데."
1013605-54 = "변명 같은 걸 떠올리거나 할 시간에, 사태를 해결하거나 대처하는 편이 더욱 효율적일 거라고…… 그렇게 생각하고 있었는데."
1013605-55 = "……."
1013605-56 = "지금의 나는 어쩌면……."
1013605-57 = "선생님에게, 미움받고 싶지 않은 것인지도 모르겠어."
1013605-58 = "[s3] \"안 그래. 나 에이미 안 미워해.\"\n[s4] \"단지……. 걱정이 됐을 뿐이야. 아주 많이.\""
1013605-61 = "……."
1013605-62 = "후후. 고마워."
1013605-63 = "하지만 선생님?"
1013605-64 = "나는 가끔 일반적인 기준을 잘 모를 때가 있는 것 같아."
1013605-65 = "그러니까, 부탁이 있어."
1013605-66 = "[s] \"부탁?\""
1013605-68 = "(에이미가 그 자리에 잠시 멈추어 섰다.)"
1013605-69 = "(에이미는 살며시 눈을 감더니, 숨을 깊이 들이쉬었다.)"
1013605-75 = "나를, 지켜 주세요."
1013605-76 = "나를 돌아봐 주세요."
1013605-77 = "내가 엇나가지 않도록, 돌보아 주세요."
1013605-78 = "나는 분명, 내 멋대로 사는 부분이 있는 사람이지만."
1013605-79 = "그래서 주위 사람들에게, 위태로운 기분이 들게 한다는 것도, 이제는 이해할 수 있게 되었지만."
1013605-80 = "그래도…… 말이지?"
1013605-81 = "선생님이 있다면, 나."
1013605-82 = "분명, 괜찮을 테니까."
1013605-88 = "응? 새는 언젠가 둥지를 떠나 혼자 날아야 한다고?"
1013605-89 = "그건 물론 맞는 말이지만……."
1013605-90 = "나, 아직 고등학교 1학년인걸. 아직 둥지에 있어도 될 때 아닐까?"
1013605-91 = "[s] \"어? 생각해 보니까 그러네……?\""
1013605-92 = "후후."
1013605-93 = "그리고 말이야. 혼자 날 수 있게 된 새라고 해도."
1013605-94 = "가령…… 그러니까 가능성의 이야기지만……."
1013605-95 = "남은 시간을 함께할 파트너를, 구하고 싶어 할 수 있는 거잖아?"
1013605-96 = "[s] \"그, 그건 무슨 의미야?!\""
1013605-99 = "아무것도 아니야. 그냥 말해 봤을 뿐."
1013605-100 = "응. 정말로, 그냥 말해 봤을 뿐."
1013605-101 = "그런데 그거 알아, 선생님?"
1013605-107 = "지금 선생님 얼굴, 이제 더 이상 무섭지 않다?"
