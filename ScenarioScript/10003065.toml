[translation]
10003065-1 = "제6화;밤이 내려앉은 해변"
10003065-2 = "(아코가 기획했던 해변 산책은 결국 본의 아니게 실패로 돌아갔다.)"
10003065-3 = "[s] \"하지만 이대로 가만히 있기만 해서는…….\""
10003065-4 = "(모처럼 히나와 함께 바닷가에 온 의미가 퇴색된다. 그런 생각 끝에 결론을 내렸다.)"
10003065-5 = "[s] \"히나에게 산책을 제안하자.\""
10003065-6 = "(그렇게 핸드폰에서 히나의 번호를 찾기 시작했을 때, 급작스럽게 히나로부터 한 통의 모모톡이 도착했다.)"
10003065-8 = "선생님, 혹시 괜찮다면……. 잠시 어울려주지 않겠어?"
10003065-12 = "(히나의 부름을 받고 밤의 해변가를 찾았다.)"
10003065-15 = "아, 선생님……. 잠시 걸을까?"
10003065-20 = "……."
10003065-25 = "……."
10003065-30 = "(그렇게 서로 얼마나 말없이 걸었을까.)"
10003065-33 = "역시……. 나 같은 거랑 있으면, 별로 재미없지. 선생님?"
10003065-34 = "[s] \"응……? 갑자기 무슨 소리야?\""
10003065-35 = "오늘 하루, 선생님은 무척 바빴지."
10003065-36 = "맨 마지막에 방을 뛰쳐나갔을 땐, '바닷가에서 멸종위기종으로 지정된 문어를 발견했으니, 얼른 보호하러 가봐야 돼!' 라고 했었나?"
10003065-37 = "어때, 그때의 일은 잘 해결 되었어?"
10003065-38 = "[s] \"그, 그게 말이죠…….\""
10003065-39 = "……응, 나도 알고 있어."
10003065-40 = "오늘 하루 방 안에 있는 사이, 선생님이 말벗이 되어주었으면 했지만. 그건 어디까지나 내 욕심……."
10003065-41 = "애당초 나 같이 재미없는 애랑 있어봐야, 선생님도 지루하기만 할 테고……."
10003065-42 = "[s1] \"아니아니아니, 전혀 그렇지 않습니다만.\"\n[s2] \"애당초 그런 생각은 해본 적 없는데요?!\""
10003065-43 = "……고마워, 선생님. 하지만 굳이 날 배려해서 그런 말 할 필요 없어."
10003065-44 = "……고마워, 선생님. 하지만 굳이 날 배려해서 그런 말 할 필요 없어."
10003065-45 = "[s] \"아니, 진짜입니다……!\""
10003065-46 = "……정말?"
10003065-47 = "[s] \"네! 정말로!\""
10003065-48 = "……."
10003065-49 = "……."
10003065-50 = "……풋."
10003065-51 = "아하하, 그렇게나 심각한 얼굴이 되어서는……."
10003065-52 = "지금 건 농담이야."
10003065-53 = "선생님이 그런 사람이 아니라는 건, 누구보다 내가 제일 잘 알고 있으니까."
10003065-54 = "그냥 조금……. 심술을 부려봤달까."
10003065-55 = "[s] \"심술이라니……\""
10003065-56 = "오늘 하루 선생님이 바빴던 건, 결국 선도부 훈련 때문이었지?"
10003065-57 = "그렇게나 열심히, 우리 훈련에 어울려주고 뛰어 다녀주다니……. 선생님."
10003065-58 = "오늘 하루, 고마웠어. 선생님. 우릴 도와주어서."
10003065-59 = "[s3] \"앗, 히나가 모두를 위해 웃으며 감사 인사를……!\"\n[s4] \"이것이 여름의 마법……?!\""
10003065-60 = "뭐야, 그게. 날 뭐라고 생각하는 거야. ……그렇게까지 호들갑 떨 건 없잖아."
10003065-61 = "뭐야, 그게. 날 뭐라고 생각하는 거야. ……그렇게까지 호들갑 떨 건 없잖아."
10003065-62 = "뭐어, 그렇다고 전부 파악하고 있는 건 아니지만."
10003065-63 = "그보다 아까……. 구보 훈련을 할 때에도 모두들 흙투성이에……. 꽤나 지쳐 있던 모양이던데."
10003065-64 = "아코, 보기보다 심하게 굴리고 있나 봐?"
10003065-65 = "내가 굳이 나서지 않더라도 아코가 제대로 해주고 있다면…… 안심은 되지만."
10003065-66 = "그만큼……. 혼자 방에만 있어야 했던 건, 역시 조금 곤욕이야."
10003065-67 = "[s5] \"혹시, 방안에만 있는 게 힘들었어?\"\n[s6] \"혹시, 제대로 쉬지 못한 거야?\""
10003065-68 = "힘들었달까. 제대로 쉬지 못했달까……."
10003065-69 = "힘들었달까. 제대로 쉬지 못했달까……."
10003065-70 = "언제나 내 일상은 눈코 뜰 새 없이 바쁜 나날이었는데."
10003065-71 = "여기, 혼자만 덩그러니 있으려니, 그…… 조금."
10003065-72 = "[s] \"조금?\""
10003065-73 = "아아, 물론 이번 훈련의 전권은 아코에게 맡겼던 건, 어디까지나 내 선택이었으니까. 이제 와서 뭐라 하고픈 건 아니지만."
10003065-74 = "으음……. 이걸 뭐라고 표현하면 좋을까."
10003065-75 = "……응, 심심했어."
10003065-78 = "[ns7] \"그러면 말이야. 모처럼 여름 바다에 온 거.\"\n[ns8] \"히나가 달리 해보고 싶은 건 없어?\""
10003065-79 = "내가 달리 해보고 싶은 것이라……."
10003065-80 = "내가 달리 해보고 싶은 것이라……."
10003065-81 = "그렇네. 선생님이 그렇게까지 말해준다면 지금 당장 떠오르는 게 있어."
10003065-82 = "……수영을 배워보고 싶어."
10003065-83 = "[s] \"수영?\""
10003065-84 = "나, 그……. 수영을 해본 적이 별로 없거든."
10003065-85 = "스킬로서 수영은, 미숙한 편이라고……. 스스로도 깊게 통감하고 있어, 그래서 이번 기회엔 이걸 좀 보완해볼까 해서……."
10003065-86 = "마침 아코에게 받은 계획표상으로는, 내일 오전에도 방에서 대기하는 일정이라서……."
10003065-91 = "그래서 말이지만 선생님. 어때."
10003065-92 = "내일 오전에, 내게 수영을 가르쳐주지 않을래?"
10003065-95 = "[ns] \"응, 물론이야. 맡겨만 줘.\""
10003065-96 = "그래, 그럼 내일, 잘 부탁해."
10003065-98 = "하계 합숙 훈련 지휘통제실"
10003065-99 = "[ns] \"……까지가 아까 있었던 일입니다.\""
10003065-100 = "……."
10003065-101 = "어, 음, 저기……. 아코 쨩……?"
10003065-102 = "저……. 감격했어요! 부장님께서 직접……. 자기 입으로 수영을 배우고 싶다고 말씀하시다니……!"
10003065-103 = "그 말은 즉, 드디어 부장님께서도 휴가라는 것에 눈을 떠주셨다는 이야기라고요! 이건!"
10003065-104 = "그러게…… 그건 진짜 희귀한 상황이긴 한데……."
10003065-105 = "선생님도 이럴 때는 도움이 되는군요! 좋습니다!!"
10003065-106 = "여러분의 노력 덕분에, 부장님의 휴가를 보장하기 위한 이번 작전은 차질없이 순조롭게 진행되고 있습니다."
10003065-107 = "자, 그러니 가만히 있을 수 없지요. 이것으로 내일의 목표 또한 정해졌습니다."
10003065-108 = "내일은 반드시 부장님이 수영을 배우는 것을 목표로! 분골쇄신합니다!"
10003065-109 = "……."
10003065-110 = "……."
10003065-111 = "절대, 절대로 다른 문제가 생기는 것을 용납하지 않겠어요! 아시겠죠? 여러분? 실패할 바엔 바다에 코를 박고 죽는 쪽을 택하란 말입니다!!"
10003065-113 = "그럼 내일 최종 목표를 위해! 목숨을 거십시오!! 해산!!"
10003065-116 = "……."
10003065-117 = "……."
