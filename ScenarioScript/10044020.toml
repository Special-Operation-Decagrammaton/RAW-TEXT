[translation]
10044020-1 = "제2화;사라진 열차를 찾아서"
10044020-2 = "그러니까, 자동 발차 시스템이 멋대로 열차를 보내 버렸다고?"
10044020-3 = "네, 네에…… 발차 신호가 올 때 운전실에서 끄면 되긴 하는데……"
10044020-4 = "……그때는 아마 다들 역무실에 있었겠네요……"
10044020-9 = "뭐야? 왜 그렇게 봐?"
10044020-10 = "귀, 귀찮다고 역무실로 들어온 게 누구였더라……"
10044020-11 = "시끄러워~! 어쨌든 다른 역으로 가버렸으니, 찾으러 가야 된다고."
10044020-13 = "슈퍼 귀찮은 일 발생-"
10044020-14 = "이, 일단 그쪽으로 가는 노선을 알아보고……"
10044020-15 = "지금 시간에는 지하철을 타시는 게 더 빠르실 거예요…… 아마……"
10044020-16 = "후, 가자. 어쩔 수 없지. 빨리 찾아야 늦지 않을 테니까."
10044020-17 = "우우- 지하철 귀찮아……"
10044020-20 = "……그렇게 된 거야."
10044020-21 = "[ns1] \"그렇구나.\"\n[ns2] \"잘 불러줬어.\""
10044020-24 = "자, 잠깐만요……! 이, 이분이 그 샬레의 선생님?! 이신가요? 맞나요?"
10044020-25 = "왜, 왜 갑자기 선생님까지 부르신 거예요? 무슨 일이 일어나고 있는 거죠??"
10044020-27 = "히카리가 불렀어-"
10044020-28 = "그, 그러니까 갑자기 왜요?!"
10044020-29 = "선생님이- 곤란한 일 생기면 불러달라고 했으니까-?"
10044020-30 = "아니, 그런 건 그냥 으레 하는 말이잖아요. 의미 없는 말이잖아요오……!!"
10044020-35 = "히, 히익…… 저, 저 말씀이신가요……? 아앗……!"
10044020-36 = "저, 저는 화물운송 관리부 2학년 우츠미 아오바라고 해요……"
10044020-37 = "[s] \"반가워, 아오바. 잘 부탁해.\""
10044020-38 = "저, 저도 잘 부탁…… 드려요?"
10044020-40 = "엥? 2학년이었어?"
10044020-41 = "네, 네에…… 간부님들은 1학년이죠?"
10044020-42 = "학년도- 나이도 숫자에 불과-"
10044020-43 = "그, 그렇게 밑밥 깔지 않으셔도 간부님들한테 선배 대접 받을 생각은 없으니까요……"
10044020-44 = "애초에 기대도 안 했고……"
10044020-49 = "아, 왔다! 얼른 타자구!"
10044020-50 = "호이-"
10044020-55 = "진짜 어쩌다 저런 분들이랑 같이 행동하게 됐담……"
10044020-62 = "우오- 엄청 흔들흔들-"
10044020-63 = "열차라면 흔들림도 적었을 텐데. 뭐, 체급이 작으니 어쩔 수 없지."
10044020-64 = "가, 간부님들…… 좀만 조용히……"
10044020-65 = "왜-?"
10044020-66 = "아니…… 우리 학교 교복 입고 지하철 욕하지 마시라구요오……"
10044020-67 = "욕이라니? 사실을 말한 것뿐인데."
10044020-68 = "사실이라고 다 말해도 되는 게 아니니까……"
10044020-69 = "아니, 이런 걸 몰라요……? 발화는 때와 장소를 가려야 한다구요……?"
10044020-70 = "무슨 소린지 모르겠네. 말도 못 해?"
10044020-71 = "이, 이래서 평소에 눈치 볼 일 없는 간부님들은~~!!"
10044020-72 = "아~ 이번 임무는 좀 긴장하라고 신신당부를 듣고 온 참인데."
10044020-73 = "열차 잃어버린 거 뭐라고 변명한담?"
10044020-74 = "들키지 않으면- 변명 필요 없어-"
10044020-75 = "파햐햐, 그건 맞지! 좋아. 빨리 찾아버리자고."
10044020-81 = "어이, 저기 봐."
10044020-82 = "응? 하이랜더 녀석들이잖아."
10044020-83 = "저 녀석들…… 이번에 지하철 이용 요금도 인상한 주제에 뻔뻔하게 잘도 돌아다니네?"
10044020-84 = "아아, 매일 무임승차하고 있으니 별로 상관은 없지만."
10044020-85 = "그런데 하이랜더가 지하철도 관리하던가?"
10044020-86 = "몰라? 열차나 지하철이나 비슷한 거 아냐?"
10044020-88 = "저 녀석들, 이번 기회에 손 좀 봐줄까."
10044020-90 = "손잡이 체조- 인피니티 스파이럴 스핀-"
10044020-91 = "파햐햐, 손잡이가 있으니 이런 게 좋네! 열차에도 도입할까!"
10044020-93 = "[ns3] \"히카리, 내려오는 게 좋겠어.\"\n[ns4] \"노조미도 목소리를 조금만 낮추자.\""
10044020-96 = "응- 히카리 선생님 말 잘 들어-"
10044020-97 = "좀 시끄러웠나? 오케이~"
10044020-99 = "서, 선생님이 말씀하시는 건 잘 듣네요……"
10044020-100 = "저기…… 모든 간부들이 이런 건 아니니까요…… 하이랜더 학원을 오해하지 말아 주세요, 선생님……"
10044020-101 = "[s] \"지금은 내가 같이 있으니까 괜찮아.\""
10044020-102 = "네에…… 왜, 왜 부끄러움은 내 몫인 걸까……"
10044020-104 = "어이, 하이랜더!"
10044020-110 = "이번에 네 녀석들, 지하철 요금을 올렸겠다?"
10044020-111 = "우리같이 가난한 학생들은 어떻게 하라고 대중교통 요금을 올리는 거야, 아앙?"
10044020-112 = "지하철은 우리 소관 아닌데?"
10044020-114 = "앗, 그래? 지식이 늘었다. 크큭!"
10044020-115 = "그런 식으로 회피하려 해도 소용없다 이거야."
10044020-116 = "너희들도 열차로 돈 받아먹고 있으면서. 대신해서 책임 지라고!"
10044020-118 = "와, 완전 억지……"
10044020-119 = "그런 의미에서 우리에게 그…… 뭐지? 정신 피해 보장? 그걸 줘야겠어!"
10044020-120 = "정신적 피해 보상-?"
10044020-121 = "그래, 그거! 종이 한 장 차이구만!"
10044020-122 = "지금 우리가 공부도 못하는 문제아라고 깔보는 거야?"
10044020-123 = "아아, 위로금이 필요할 것 같은데. 엄청나게 상처였다고, 방금 그거?"
10044020-125 = "노조미, 돈 있어-?"
10044020-126 = "아니? 우리 표값도 선생님이 내줬잖아."
10044020-127 = "돈 없어- 우리 왕 거지-"
10044020-129 = "어이, 그런 말로 넘어갈 것 같아? 지금? 아앙?"
10044020-130 = "돈이 없으면 총알이라도 내놓으라고!"
10044020-132 = "[ns] \"얘들아, 조금만 진정하고……\""
10044020-134 = "뭐야, 이건? 어른?"
10044020-135 = "어른이면 지갑도 두둑하겠지? 어때, 불우한 학생들을 위해 기부라도 좀?"
10044020-136 = "[s5] \"내 지갑은 생각보다 얇을 텐데……\"\n[s6] \"일단 흥분을 가라앉히자……!\""
10044020-139 = "지금 우리가 흥분 안 하게 생겼어?!"
10044020-140 = "시험 점수는 나쁘고! 공부는 싫고! 돈도 없고!"
10044020-141 = "지금 이렇게 지하철 타서 아무한테나 시비 거는 거 말고는 청춘의 답답한 기분을 풀 방법이 없다고!"
10044020-142 = "성적도 나쁜데- 성격도 안 좋아-?"
10044020-144 = "이게! 뜨거운 맛을 기어코 볼 테냐?"
10044020-145 = "저, 저도 그 기분 알아요……"
10044020-146 = "아앙?"
10044020-147 = "저, 저도 고전 25점 받아서…… 그 마음은 잘 알겠어요……"
10044020-149 = "하하, 너도 공부 못 하는구만. 그래서?"
10044020-150 = "하, 하지만…… 공부가 싫어서 안 한 건 본인의 선택이었으니까……"
10044020-151 = "그 결과도 본인이 받아들여야 하지 않나요……?"
10044020-152 = "웃기지 마! 그런 거 받아들이고 싶지 않으니까!"
10044020-153 = "왜 세상은 항상 우리에게 냉정한 건데? 우리도 행복해지고 싶다고!"
10044020-157 = "왜, 왜 세상이 여러분에게 따뜻해야 한다고 생각하시나요……?"
10044020-162 = "왜냐니…… 따뜻하면 좋잖아?"
10044020-164 = "머리 꽃밭이네요…… 세, 세상은 냉혹하고 춥디추운 곳인데…… 아무도 나를 책임져주지 않는데……"
10044020-165 = "어째서 그런, 느긋하고 순진무구한 생각을 하시게 된 건가요……?"
10044020-166 = "그, 그러면 안 돼? 나도 사랑받고 싶거든?!"
10044020-167 = "후, 후후…… 그렇게 헛된 기대를 품고 있으니까 실망하는 거예요…… 머, 멍청하긴……"
10044020-168 = "기대하지 않으면 상처받을 일도 없는데…… 후후후……"
10044020-169 = "그래서 저는 아무 기대도 하지 않고 사는데…… 후후!!"
10044020-174 = "이, 이 자식……"
10044020-175 = "썩었어…… 엄청……"
10044020-176 = "가, 가자…… 엮여서 좋을 게 없을 것 같아."
10044020-181 = "이야, 마이너스 오오라로 물리쳤네! 제법이잖아?"
10044020-182 = "이, 이게 마이너스인가요…… 그냥 평범한 거 아닌가요……?"
10044020-183 = "기대하지 않으면- 무슨 재미로 살아-?"
10044020-184 = "예……? 사는데…… 재미가 필요한가요……?"
10044020-189 = "완~전!! 재미있지 않은 일은 할 필요도 없고, 할 이유도 없잖아?"
10044020-190 = "히카리도 동의-"
10044020-192 = "[ns7] \"다양한 삶의 방식이 있으니까.\"\n[ns8] \"아오바도 일상에 기대를 할 수 있게 되면 좋겠네.\""
10044020-195 = "그, 글쎄요…… 헤헤…… 아니어도 별 상관은 없으니까요……"
10044020-201 = "아, 내릴 때가 되었네요."
10044020-202 = "여기 있겠지? 있어야 하는데. 있을 거야!"
10044020-203 = "우오- 로스트 트레인-"
10044020-210 = "[ns] \"가자, 아오바.\""
10044020-211 = "네, 네에."
