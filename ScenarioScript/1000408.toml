[translation]
1000408-1 = "어쩐지 신비한 밤"
1000408-2 = "게헨나 선도부 교사"
1000408-3 = "(휴일 심야의 시간이라 교사 주변엔 아무도 없다.)"
1000408-4 = "(선도부장실만 불이 켜져있는 것을 확인했다.)"
1000408-7 = "선도부장실 앞"
1000408-9 = "(똑똑)"
1000408-10 = "(…….)"
1000408-11 = "(반응이 없다.)"
1000408-12 = "(똑똑똑-)"
1000408-13 = "-----------."
1000408-14 = "[s] 들어간다."
1000408-19 = "어……? 서, 선생님?"
1000408-20 = "[s] \"도와주러 왔어.\""
1000408-21 = "도, 돕는다고? 내 일을……?"
1000408-22 = "이 시간에 말야?"
1000408-23 = "……와준 건 고맙지만 이 일은 나만 할 수 있는 업무라……. #n선생님이 도울 수 있는 일은 없는데……."
1000408-24 = "[s] \"그럼 옆에 그냥 같이 있을게.\""
1000408-25 = "……."
1000408-26 = "……그 정도는 상관없어."
1000408-28 = "(옆에 앉아서 히나가 작업하는 것을 지켜보기로 했다.)"
1000408-31 = "(슥삭슥삭-)"
1000408-32 = "……."
1000408-34 = "(슥삭슥삭슥삭-)"
1000408-35 = "…………."
1000408-37 = "(슥삭슥삭슥삭-)"
1000408-38 = "……이거 조금 신경쓰이는데."
1000408-39 = "아까부터 집중이 잘 안 되는데, 선생님이 옆에서 빤히 보고 있으니까……."
1000408-40 = "……."
1000408-41 = "그리고 왜 이렇게 덥지……."
1000408-42 = "[s1] \"얼굴이 빨간데.\"\n[s2] \"열이라도 있어?\""
1000408-43 = "자, 잠깐?! 뭐하는 거야?!"
1000408-44 = "자, 잠깐?! 뭐하는 거야?!"
1000408-45 = "[s] 이마를 짚는다."
1000408-46 = "아, 아앗……!"
1000408-47 = "……."
1000408-48 = "………."
1000408-49 = "[s3] \"이마가 따끈따근해.\"\n[s4] \"볼이 따끈따근해.\""
1000408-50 = "다, 당연하잖아. 지금 며칠째 잠을 못 잤단 말야."
1000408-51 = "다, 당연하잖아. 지금 며칠째 잠을 못 잤단 말야."
1000408-52 = "[s] \"졸리면 몸이 따끈해지는 거야?\""
1000408-53 = "……신체 현상이라고! 졸릴 때 체온이 높아지는 건!"
1000408-54 = "[s5] \"쓰담쓰담쓰담.\"\n[s6] \"아이 같아서 귀여워.\""
1000408-59 = "……."
1000408-60 = "……이…… 그, 그만……."
1000408-63 = "……."
1000408-64 = "그만해!!"
1000408-67 = "……."
1000408-68 = "……지금은 일하는 중이니까."
1000408-69 = "그렇게 쓰다듬으면 어쩐지 너무 편안해져서…… 그대로 잠들어버릴 것 같단 말야……."
1000408-70 = "[s] \"미안해.\""
1000408-71 = "……아니. 사과할 것까진……."
1000408-72 = "……."
1000408-73 = "……. 하핫."
1000408-74 = "생각해보면…… 뭔가 신비한 밤이네."
1000408-75 = "이 시간에 내 집무실에서 선생님과 단둘이 있다니."
1000408-76 = "이렇게 있다가 그대로 쓰러져 잠들어버려도…… 어쩐지 상관없을 거 같아."
1000408-77 = "하하……. 응. 그것도…… 나쁘지 않을 거 같네."
1000408-78 = "졸리고…… 또 안심이 되어서……"
1000408-79 = "선생님……."
1000408-81 = "(털썩-)"
1000408-82 = "(히나가 그대로 뒤로 쓰러져 창가에 몸을 눕혔다.)"
1000408-85 = "― ……."
1000408-88 = "[wa:1000]― 그렇게 빤히 쳐다보면…… [wa:2500]아무리 나라도 부끄러워."
1000408-91 = "[wa:500]― 신기하지? [wa:2800]선생님과 함께 있으면 [wa:2700]어쩐지 안심이 돼."
1000408-94 = "[wa:1000]― 사실은…… [wa:2000]당신의 그런 표정을 좋아했어."
1000408-97 = "― ……."
1000408-100 = "― 하아…. [wa:3000]아무것도 생각하고 싶지 않아."
1000408-103 = "― ……."
1000408-106 = "(히나는 쓰러진 채로 스르륵 잠이 들어버렸다.)"
1000408-107 = "(코트를 덮어주고 조심스럽게 방을 빠져나왔다.)"
