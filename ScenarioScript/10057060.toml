[translation]
10057060-1 = "제6화;모두의 것, 모두에게"
10057060-7 = "으으……. 붉은겨울 중심부엔 징계받고 나서 처음 오는 것 같은데……."
10057060-8 = "괜히 쫄지 말고 자연스럽게, 자연스럽게!"
10057060-9 = "산 내려오는 것도 힘들었어. 다리 아파."
10057060-10 = "가는 길에 수레에 태워 줄게. 힘내자구!"
10057060-15 = "히잉……. 모처럼 내려왔는데, 밤이라서 즈나먀 카페는 닫았네……."
10057060-16 = "……그보다, 선생님은 저희하고 같이 있어도 괜찮아요?"
10057060-17 = "[s] \"보호자가 필요하지 않을까?\""
10057060-19 = "[ns] \"다 쓰고 꼭 돌려줄거지……?\""
10057060-24 = "다, 당연히 돌려주죠! 우리는 도둑이 아니니까요!"
10057060-25 = "잠시 위치가 이동되었다가 되돌아가는 것뿐이지, 결국 붉은겨울 내에서 돌고 도는 거예요!"
10057060-26 = "어디 보자, 각자 담당을 정해 보실까-"
10057060-27 = "전선으로 쓸 구리는……."
10057060-28 = "내가 할게."
10057060-29 = "라나가 해 줄래?"
10057060-30 = "응. 이 근처에 마침 봐둔 게 있어."
10057060-31 = "좋아! 그럼 각자 재료 구해서, 여기로 모이자앗!"
10057060-32 = "라나. 만약 누가 의심하면, 어떻게 하라고 했지?"
10057060-33 = "불쌍해 보이고, 귀엽게 울기."
10057060-34 = "그치 그치. 그랬는데도 체포되면, 어떻게 하지?"
10057060-35 = "떠오르는 모든 이름을 183호를 제외하고 전부 대면서, 붉은겨울 전체에 혼란을 일으켜 행정조직을 마비시킨다."
10057060-36 = "역시, 우리 중에서 라나가 제일 똑똑해~!"
10057060-37 = "응."
10057060-39 = "에리나, 티타늄은 어떻게 구할 거야?"
10057060-40 = "방법은 있는데…… 한 번에 구하기 힘드니까 나하고 같이 다니면서 찾아보자."
10057060-41 = "그러면 183호 특별반, 작전 개시!"
10057060-43 = "가자-!"
10057060-51 = "구리……. 전선을 자르면 다들 곤란해져. 남을 곤란하게 하면 안 된다고 혼났어."
10057060-52 = "대신 동상은 광장에 많으니까, 하나쯤 빌려도 될 거야."
10057060-56 = "땅꼬마 회장님, 잠시 왼쪽 귀 좀 빌리겠습니다."
10057060-57 = "많이 갈아내면 티가 날 테니, 전선으로 쓸 만큼만 살짝."
10057060-61 = "음. 약간 비대칭."
10057060-62 = "비대칭. 안 좋아."
10057060-63 = "오른쪽도 깎아서 균형을 맞춰 드리겠습니다."
10057060-69 = "으음……"
10057060-70 = "좌우 균형은 맞았지만, 이러면 얼굴이 너무 커 보여."
10057060-71 = "회장님, 예쁘게 해드리겠습니다."
10057060-83 = "벽에서 페인트는 왜 벗겨내는 거야? 이미 다 마른 페인트잖아?"
10057060-84 = "재료 수급이야! 최대한 꽉-꽉 눌러 담아야 해."
10057060-89 = "훌쩍, 으윽 나온 지 얼마나 됐다고 바로 감기 기운이……."
10057060-90 = "붉은겨울 학생이면서 찬 공기에 너무 약한 거 아니야?"
10057060-91 = "시, 시끄러워! 훌쩍. 그래도 최근엔 감기 거의 안 걸렸는데, 메틸아민 다 떨어져서 감기약도 못 만들고 짜증 나!"
10057060-92 = "집 나오면 고생이야 진짜. 쿨쩍. 크응!!"
10057060-97 = "쉿, 조용히!! 야간 출입 금지 구역이라 누가 듣고 오면 큰일 나!"
10057060-98 = "콧물이 마음대로 되겠냐! 자율신경계를 거스를 수는 없는 거라고!"
10057060-99 = "으으, 콜록, 케엑……."
10057060-100 = "왜 하필 사무국으로 온 거야? 다른 곳에도 페인트칠은 되어있잖아."
10057060-101 = "여기에서 '빌려올 때' 죄책감도 제일 덜 하니까?"
10057060-102 = "그리고, 사무국이 제-일 비싼 페인트 써서 꼭 필요하단 말야! 다른 싸구려 페인트는 석회가 많아서 못 써먹는다구!"
10057060-103 = "이랬다가 체리노 회장이 알게 되면 복권은커녕 영원히 183호에서……."
10057060-111 = "쿨쩍…… 왜?"
10057060-112 = "쉬이잇!!"
10057060-113 = "복도 끝에서 소리 났어, 순찰 중인가 봐! 조용히 해야 해!"
10057060-127 = "마, 마리나 보안위원장이잖아?"
10057060-128 = "으악, 걸리면 끝장이야! 윽……."
10057060-132 = "게, 게흑. 콜록-"
10057060-140 = "왜 그러십니까? 마리나 위원장."
10057060-141 = "뭔가, 저 끝에서 인기척이 느껴지는데."
10057060-142 = "흐음……."
10057060-144 = "(쉬, 쉬이잇!!!)"
10057060-145 = "(뭐 하는 거야! 입 막지 마!!)"
10057060-146 = "(여기서 기침하면 들킨다구! 조용히 해!!)"
10057060-147 = "우웁……! 우우……!"
10057060-153 = "야간 순찰은 가끔 이렇게 스산하단 말이지."
10057060-154 = "야간 경비 검열이라지만, 간만에 순찰을 돌다 보니 낯설었던 모양이다."
10057060-155 = "다음 층까지 순찰하고, 한 번 쉬도록 하지."
10057060-166 = "푸하앗……. 하아……."
10057060-167 = "괘, 괜찮아? 좀 진정됐어?"
10057060-168 = "기침 참는 거 힘들 텐데, 참느라 고생했-"
10057060-173 = "푸헤엣취히!!!!!!"
10057060-179 = "누구냐!! 침입자다!! 잡아!!!"
10057060-181 = "으아악!!! 누, 눈에 들어간 것 같아악!!!"
10057060-182 = "으아앙!! 기침이건 재채기건 어떻게 참으라구우!!!"
10057060-187 = "모두!! 침입자를 잡아라!!!"
10057060-192 = "끄아앙!!!"
