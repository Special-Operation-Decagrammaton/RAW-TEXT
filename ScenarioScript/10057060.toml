[translation]
10057060-1 = "第6話;みんなの物は、みんなの物"
10057060-6 = ""
10057060-7 = "うぅ……。#n懲戒処分受けてから、レッドウィンターの中心部に来るのは初めてな気がする……。"
10057060-8 = "な～にビビってんの～？こーゆー時は、ドーンと構えればいいんだって！"
10057060-9 = "山を下りるだけで大変だった。足が痛い。"
10057060-10 = "もうちょっと頑張って！途中で荷車に乗せてあげるから！"
10057060-11 = ""
10057060-13 = ""
10057060-14 = ""
10057060-15 = "ひぃん……。#nせっかくここまで来たのに、夜だからズナーミャカフェが閉まってる……。"
10057060-16 = "……それより、先生は私たちと一緒にいて大丈夫なんですか？"
10057060-17 = "[s] \"責任者が必要でしょう？\""
10057060-19 = "[ns] \"使ったら返すんだよね……？\""
10057060-20 = ""
10057060-21 = ""
10057060-23 = ""
10057060-24 = "と、当然です！私たちは窃盗団ではありませんから！"
10057060-25 = "レッドウィンター内で、少し移動するだけです。"
10057060-26 = "そろそろ、各自の担当を決めよーか。"
10057060-27 = "電線に使う銅は……。"
10057060-28 = "私がやる。"
10057060-29 = "ラナがやってくれるの？"
10057060-30 = "うん。この近くに目を付けてたものがあるから。"
10057060-31 = "よ～しっ！任せた！"
10057060-32 = "ラナ。もし誰かに疑われたら、どうするんだっけ？"
10057060-33 = "かわいそうに見えるよう、可愛らしく泣く。"
10057060-34 = "そうそう。それでも逮捕されたら、どうする？"
10057060-35 = "思いつく限りの183号以外の人の名前を全て出して、#nレッドウィンター全体を混乱させて行政組織を麻痺させる。"
10057060-36 = "やっぱり、私たちの中でラナが一番賢いね～！"
10057060-37 = "うん。"
10057060-39 = "エリナ、チタンはどうやって手に入れるの？"
10057060-40 = "方法はあるけど……一度には難しいから一緒に回りながら探そう。"
10057060-41 = "それじゃあ183号特別クラス、作戦開始！"
10057060-43 = "おー！"
10057060-44 = ""
10057060-50 = ""
10057060-51 = "銅……。電線を切るとみんなが困る。人を困らせたらダメって怒られた。"
10057060-52 = "でも、銅像は広場にたくさんあるから……1個ぐらい借りてもいいよね。"
10057060-53 = ""
10057060-55 = ""
10057060-56 = "チビ会長、左耳をちょっとお借りします。"
10057060-57 = "たくさん削ると目立つから、電線に使う分だけ。"
10057060-59 = ""
10057060-60 = ""
10057060-61 = "うーん。ちょっと不揃いになってる。"
10057060-62 = "非対称、良くない。"
10057060-63 = "右も削ってバランスを取ってあげますね。"
10057060-64 = ""
10057060-66 = ""
10057060-67 = ""
10057060-68 = ""
10057060-69 = "うーん……。"
10057060-70 = "左右のバランスはいいけど、今度は顔が大きく見える。"
10057060-71 = "会長、可愛くしてあげますね。"
10057060-72 = ""
10057060-74 = ""
10057060-81 = ""
10057060-82 = ""
10057060-83 = "どうして壁からペンキを削り落としているの？もう乾いちゃってるのに？"
10057060-84 = "材料の調達！めーっちゃ詰め込まないと。"
10057060-85 = ""
10057060-87 = ""
10057060-88 = ""
10057060-89 = "ズルッ！ううっ、まだ来たばっかりなのに風邪ひきそう……。"
10057060-90 = "エリナ、レッドウィンターの生徒なのに寒さに弱いよね？"
10057060-91 = "う、うるさいっ！#nズルルッ。最近は大丈夫だったのに……#nメチルアミンが切れたせいで風邪薬も作れないって、ほんっとありえない！"
10057060-92 = "外に出るだけで大変なんだけど！ズルズル、フンッ！！"
10057060-93 = ""
10057060-95 = ""
10057060-96 = ""
10057060-97 = "しーっ、静かに！！夜間立ち入り禁止区域なんだから、見つかったら終わりよ！"
10057060-98 = "は、鼻水なんて思いどおりにできないでしょ！自律神経系には逆らえないって！"
10057060-99 = "うう……ゴホゴホ、ゲホッ……。"
10057060-100 = "どうしてわざわざ事務局に来たの？#n他にペンキが塗られている所はいくらでもあるのに。"
10057060-101 = "ここで「借りれば」、罪悪感がないからかな？"
10057060-102 = "それに事務局が、いっちばん高いペンキを使っているから！#n他の安っぽいペンキは石灰分が多くてムリ！"
10057060-103 = "チェリノ会長に知られでもしたら、永遠に183号で……。"
10057060-104 = ""
10057060-109 = ""
10057060-110 = ""
10057060-111 = "ズルズル……どうしたの？"
10057060-112 = "しーーーっ！！！"
10057060-113 = "廊下の向こう側で音がした。巡回中みたい！静かにしないと！"
10057060-114 = ""
10057060-116 = ""
10057060-120 = ""
10057060-121 = ""
10057060-125 = ""
10057060-127 = "ま、マリナ保安委員長！？"
10057060-128 = "ば、バレたらおしまいじゃん！うっ……。"
10057060-129 = ""
10057060-131 = ""
10057060-132 = "げ、ゲホッ。ゴホゴホッ！"
10057060-133 = ""
10057060-136 = ""
10057060-137 = ""
10057060-138 = ""
10057060-140 = "どうかなさいましたか？マリナ委員長。"
10057060-141 = "あっちから人の気配を感じたのだが。"
10057060-142 = "ふむ……。"
10057060-144 = "（しーっ！しーーーっ！！！）"
10057060-145 = "（ちょっ！息できないんだけど！？）"
10057060-146 = "（ここで咳したらバレちゃうから！我慢して！！）"
10057060-147 = "ううっ……！ううっ……！"
10057060-148 = ""
10057060-150 = ""
10057060-152 = ""
10057060-153 = "夜間の巡回は、なんだか心細く感じるな。"
10057060-154 = "ただの夜間警備の点検とはいえ、久しぶりで勘が鈍っているみたいだ。"
10057060-155 = "次の階の巡回が終わったら、一度休むとしよう。"
10057060-156 = ""
10057060-159 = ""
10057060-165 = ""
10057060-166 = "ぷはあっ……はあ……。"
10057060-167 = "だ、大丈夫？少しは落ち着いた？"
10057060-168 = "咳を我慢するのは大変よね、よく頑張っ――"
10057060-169 = ""
10057060-171 = ""
10057060-173 = "ぶえーっくしゅん！！！！！"
10057060-174 = ""
10057060-176 = ""
10057060-178 = ""
10057060-179 = "不審者だ！！捕まえろ！！！"
10057060-181 = "ちょっ！？目に入ったわよ！？"
10057060-182 = "ひぃ～ん！！咳もくしゃみも止めるなんてムリ～！！！"
10057060-183 = ""
10057060-187 = "絶対に逃がすな！！！"
10057060-188 = ""
