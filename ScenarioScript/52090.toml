[translation]
52090-1 = "제9화;백화요란의 부장"
52090-2 = "에비스 기숙사 내 연회장"
52090-6 = "음, 역시 맛있어!"
52090-7 = "오랜만에 먹는 따듯한 음식이라 그런지, 한 입 먹을 때마다 온기가 온몸에 스며드는 것 같아~"
52090-8 = "저기, 미안한데 밥 한 그릇만 더 줄 수 있을까?"
52090-12 = "네, 네! 이 정도면 충분하실까요?"
52090-13 = "응. 그리고 괜찮다면 된장국도 한 그릇 더 부탁할게."
52090-24 = "……응? 다들 왜 그런 표정이야? 유령이라도 본 것처럼."
52090-29 = "아니, 진짜 유령을 본 건 아니지만……"
52090-30 = "유령을 본 기분이라고 할까, 믿겨지지 않는다고 해야 할까—"
52090-31 = "……아야메 부장. 당신이 무사히 돌아와서 나는 다행이라고 생각해."
52090-32 = "하지만 백화요란의 참모로서, 당신이 그동안 어디에서 무얼하고 있었는지에 대해서는 들어야겠어."
52090-33 = "예전부터 속을 알 수 없는 사람이라는 생각은 자주 했었지만, 당신이 설명도 없이 갑자기 사라진 탓에 백화요란은 해체될 뻔했었어."
52090-34 = "솔직한 심정으로는 당신을 아직 부장이라고 불러도 괜찮을지 확신이 들지 않을 정도야."
52090-35 = "그래도 당신의 입으로 변명 정도는 들어봐야겠지."
52090-37 = "……키쿄는 여전하구나. 바뀌지 않아서 다행이야."
52090-41 = "우선 그동안 백화요란의 부장 자리를 멋대로 비우고 책임을 방기한 점에 대해서는 무어라 할 말이 없어."
52090-42 = "특히 갑자기 부장 대리 업무를 맡게 되어 마음고생이 심했을 나구사에게는…… 낯을 볼 면목조차도 없어. 정말 미안해."
52090-46 = "아니, 지금이라도 돌아와 주었으니 그것만으로도—"
52090-47 = "나구사 선배는 조용히 해."
52090-53 = "다시 말하지만, 내가 듣고 싶은 건 당신이 어째서 부장의 자리를 비우고 사라졌는지에 대한 것이야."
52090-54 = "거기에 더해 나구사 선배의 오른팔에 대한 이야기도 듣고 싶고."
52090-58 = "……조금 긴 이야기가 될 텐데, 괜찮겠어?"
52090-59 = "물론이와요!"
52090-60 = "선배에 대한 오해가 풀릴 수 있다면 하루 종일이라도 경청할 준비가 되어있으니까요."
52090-61 = "1학년의 유카리라고 했었지? 그렇게 말해줘서 고마워."
52090-62 = "……우선 이야기를 시작하기에 앞서 질문 하나만 할게."
52090-63 = "백화요란의 '부장'이 되기 위한 자격은 무엇이라고 생각해?"
52090-64 = "저요, 저요! 그것이라면 소녀가 잘 알고 있사와요!"
52090-65 = "바로 선대 부장에게 계승전을 신청하여 계승전에서 승리하는 것이어요!"
52090-66 = "후후, 잘 알고 있구나. 하지만 설명이 조금 부족했어."
52090-70 = "계승전의 승자가 얻게 되는 것은 '부장의 직책' 그 자체라기보다는, [ruby=쿠즈노하]<대 예언자>[/ruby]로부터 계승되어 온 '자격의 증거'—"
52090-71 = "즉, 계승전은 <백련>을 계승 받는 의식의 일종이라고 할 수 있어."
52090-72 = "따라서 백화요란의 부장이라면 <백련>을 자유자재로 부릴 수 있어야 하지."
52090-73 = "하지만 그 말대로라면 더욱이 아야메보다 부장으로 적합한 사람은 없잖아?"
52090-74 = "지금도 백화요란 내에서 사격술로 아야메를 따라올 수 있는 사람은 아무도 없는걸."
52090-75 = "……그래. '사람'이 상대였다면 그랬을지도 모르지."
52090-81 = "사람?! 그럼 아야메 부장은 전에 사람이 아닌 것을 상대로 싸운 적이 있었다는 거야?"
52090-87 = "백화요란을 떠나기 며칠 전. 나는 평소처럼 순찰을 위해 백귀야행의 밤거리를 걷고 있었어."
52090-97 = "축제가 막 끝난 직후라 그런지. 거리는 사람 하나 없이 고요했고, 도로를 비추는 미등도 그날따라 이상하리만큼 불규칙하게 깜박이고 있었지."
52090-101 = "수로를 따라 이어진 다리를 건너 반대편으로 넘어가려던 그 순간, 갑자기 반대편에서 다른 학생 하나가 모습을 드러냈어."
52090-111 = "밝은 백금발에 보라색 눈, 흰색의 교복과 그 위에 걸쳐진 푸른 하오리까지……"
52090-112 = "그래, 그 상대는 나와 똑 닮은 모습을 하고 있었어."
52090-113 = "잘못 본 게 아닐까 싶어 눈을 의심했지만, 상대의 얼굴은 틀림없는 내 얼굴이었어. 마치 거울을 보고 있는 기분이 들 정도로."
52090-114 = "하지만 상대가 단순히 나와 닮은 '사람'이 아니라는 건, 직감으로 바로 깨달을 수 있었어."
52090-123 = "녀석은 나를 보고 놀라기는커녕, 기다리고 있었다는 것 마냥 섬뜩한 미소를 지었거든."
52090-124 = "두려움이 없는 저세상의 존재를 무엇으로 물리칠 수 있을까."
52090-128 = "다행히 내 손에는 귀신을 물리칠 수 있는 마총, <백련>이 있었고. 나는 부장이 되고 나서 처음으로 괴이를 상대로 총을 겨누었어."
52090-142 = "하지만, 아무런 효과도 없었어."
52090-143 = "마치 총을 맞았다는 인식도 하지 못한 것처럼, 상대는 계속해서 내게 다가왔고……"
52090-156 = "……그대로 그냥 지나쳐 사라져 버렸어."
52090-157 = "밤안개에 취해 벌어진 한 밤의 해프닝으로 여길 수도 있었지만, 한 번 생긴 불안은 쉬이 떨쳐내기 어려운 법."
52090-160 = "'어째서 나는 백련의 힘을 사용하지 못했던 걸까?'"
52090-161 = "'내게 자격이 없어서? 아니면 이 백련이 진짜가 아니라서?'"
52090-162 = "'……애초에 쿠즈노하라는 이름의 대 예언자는 정말로 존재하긴 하는 걸까?'"
52090-165 = "결국 불안을 이겨내지 못한 나는 쿠즈노하 님을 찾아 황혼의 사원이 존재했었다고 알려진 북쪽의 땅으로 떠났어."
52090-166 = "바보 같은 결정이었을지도 모르지만, 그때는 그렇게라도 하지 않으면 나를 용납할 수 없을 것 같았거든."
52090-167 = "그리고 결국…… 실패했어."
52090-168 = "내가 찾은 것은 <황혼의 사원>의 흔적으로 보이는 낡고 무너진 건물의 잔해뿐."
52090-169 = "쿠즈노하 님은 결국 내 앞에 모습을 드러내지 않았어."
52090-175 = "……할 말은 그것뿐이야?"
52090-176 = "응, 변명은 없어. 이게 전부야."
52090-177 = "아니, 그보다 더 중요한 이야기가 있잖아."
52090-178 = "나구사 선배의 팔은…… 화조풍월부와 함께 사라지며 남겼던 그 말은 어떻게 된 건데?"
52090-179 = "나구사의 팔……?"
52090-180 = "그러고 보니 그 붕대는 어떻게 된 거야. 다치기라도 했어?"
52090-185 = "이 팔은……"
52090-186 = "아야메, 혹시 기억하지 못하는 거야? 나와 대설원에서 마주쳤던 때의 일을."
52090-187 = "나구사가 대설원에 왔었다고? 언제? ……눈보라가 심해서 온 줄도 모르고 있었나?"
52090-188 = "………."
52090-189 = "정말로 기억에 없는 거야, 아야메 부장?"
52090-190 = "나구사 선배의 말에 의하면 선배의 손을 내치고, '너를 단 한 번도 친구라고 생각한 적 없었다'고 말했다던데—"
52090-195 = "그럴 리가 없잖아!"
52090-202 = "미, 미안…… 평소답지 않게 조금 흥분해 버렸네."
52090-203 = "하지만 내가 그런 말을 했을 리가 없잖아. 소중한 친구에게 그런 상처가 되는 말을 하다니."
52090-204 = "뭔가 잘못 들은 거 아냐? 다른 사람과 착각했다던가……"
52090-205 = "그, 그렇지……? 아야메가 그런 말을 했을 리가—"
52090-206 = "아니. 나구사 선배가 아무리 그렇게 말한다 하더라도 당신을 맹신할 수는 없어."
52090-207 = "나 역시도 내가 아는 아야메 부장이 그런 말을 할 사람은 아니라고 생각하지만…… 그사이에 너무 많은 일이 있었어."
52090-208 = "아무런 말도 없이 사라진 부장과, 백귀야행의 위기 앞에서 물러서지 않고 맞서 싸운 부부장 중 누구의 말을 더 믿느냐고 묻는다면 단연코 후자야."
52090-209 = "당신이 조금이라도 신뢰를 되돌리고 싶다면, 그동안 북쪽의 땅에서 무얼 하고 있었는지 숨김없이 털어놓는 게 좋을 거야."
52090-211 = "선배……"
52090-215 = "좋아. 처음부터 숨길 생각은 없었으니까."
52090-216 = "다만 아침 식사는 마저 하고 가도 괜찮을까?"
52090-217 = "왜, 음식을 남기면 가난뱅이신이 들러붙는다고 하잖아."
52090-219 = "다음화;불완전한 기억"
