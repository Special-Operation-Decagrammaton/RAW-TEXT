[translation]
2000205-1 = "다이어트약"
2000205-2 = "현무상회 거리"
2000205-3 = "헤매지 않고 잘 도착한 모양이군."
2000205-4 = "후-후- 선생도 알고 있겠지만 이곳이 바로 그 <산해진미>로 유명한 산해경의 현무상회인 것이다!"
2000205-5 = "노점의 운영을 둘러싸고 학생회와 운영진이 암투를 벌이고 있다던가— #n여러가지 재미있는 소문이 많이 떠도는 곳이기도 하지만, 그래도 음식 맛만큼은 확실한 것이다!"
2000205-6 = "지난 번 실수에 대한 사과가 될지는 모르겠지만, #n오늘은 나님이 이곳에서 특별히 점 찍어 둔 맛집을 소개하는 것이다."
2000205-7 = "그러고보니…… 아직도 네즈스케 같은 잔털이 얼굴에 남아있어. 푸흡……"
2000205-8 = "미, 미안, 선생. 웃으면 안 된다고 생각해도 너무 선생의 꼴이 우스워서…… 푸하하!"
2000205-9 = "푸흐흐…… 걱정 않는 것이다, 선생. 그 영약의 효과는 오래가지 않을 테니까. #n아마 한 달 뒤면 털은 말끔히 빠져나갈 것이다."
2000205-10 = "자, 그럼 가게로 들어가볼까."
2000205-13 = "국수 가게"
2000205-15 = "어서 오십시오, 주문은 무어로 하시겠습니까?"
2000205-16 = "늘 먹던 걸로. #n<면은 덜 익게, 국물은 진하게, 야채는 더블로, 마늘과 비계 많이 넣어서>, 두 그릇!"
2000205-17 = "네, 주문 받았습니다. #n<면은 덜 익게, 국물은 진하게, 야채는 더블로, 마늘과 비계 많이 넣어서>, 두 그릇!"
2000205-19 = "(술렁술렁)"
2000205-20 = "바, 방금 들으셨습니까, 대장? 저 꼬맹이가 <그 메뉴>를 시켰습니다."
2000205-21 = "잘못 들은 건 아니겠지…? 설마 이곳에서 <면은 덜 익게, 국물은 진하게, 야채는 더블로, 마늘과 비계 많이 넣어서>를 시키는 여학생이 있을 줄이야……"
2000205-24 = "후후, 벌써부터 기대되는 것이다."
2000205-25 = "[s] \"면은 덜익게, 국물은…… 뭐라고?\""
2000205-26 = "선생은 기억력이 나쁘구나. #n<면은 덜 익게, 국물은 진하게, 야채는 더블로, 마늘과 비계 많이 넣어서>로 주문했어. #n나님의 특제 주문이니 분명 맛있을 것이다~"
2000205-27 = "다 먹을 수 있는 양이냐고? #n물론이지! 나님은 뭐든지 가능하다고!"
2000205-28 = "이 나이대의 여학생이라면 비계를 추가하는 것 만으로도 칼로리가 신경 쓰일터… #n저런 칼로리 폭탄을 먹고도 마른 몸을 유지한다는 건 있을 수 없는 일이야!"
2000205-29 = "맞습니다, 분명 반도 못 먹어 치울 게 분명합니다."
2000205-30 = "주문하신 메뉴 나왔습니다. #n<면은 덜 익게, 국물은 진하게, 야채는 더블로, 마늘과 비계 많이 넣어서>, 두 그릇입니다."
2000205-31 = "드디어 나온 것이다! 잘 먹겠습니다~!"
2000205-33 = "잘 먹었습니다!"
2000205-36 = "보셨습니까, 대장! #n저 꼬맹이…… 순식간에 국물까지 마셔버렸습니다."
2000205-37 = "저런 작은 몸으로 <면은 덜 익게, 국물은 진하게, 야채는 더블로, 마늘과 비계 많이 넣어서>를 순식간에 해치우다니! 이 얼마나 무시무시한 소화력인가……"
2000205-42 = "이봐, 방금 <면은 덜 익게, 국물은 진하게, 야채는 더블로, 마늘과 비계 많이 넣어서>를 국물 째로 완식한 건가?"
2000205-43 = "그런데? 무슨 문제라도 있는 것이냐?"
2000205-44 = "그 국물 안에 들어있는 칼로리가 무섭지 않은 거냐! #n한 그릇만 먹어도 하루 권장 칼로리 수준을 아득히 뛰어넘을 텐데……!"
2000205-45 = "후-후-후- 걱정 없는 것이다! 나님이 개발한 이 특제 다이어트 약만 있다면!"
2000205-46 = "특제 다이어트 약이라고?"
2000205-47 = "응, 이것만 마시면 아무리 높은 칼로리의 음식을 먹어도 조금도 살이 찌지 않는 것이다!"
2000205-48 = "오오…… 그 약을 우리에게 팔지 않겠나? 돈은 얼마라도 내겠어!"
2000205-49 = "돈은 필요 없어. 대신 약을 먹고 얼마나 효능이 좋았는지 나중에 직접 알려주는 것이다!"
2000205-50 = "정말 고맙군. 그대는 우리의 은인이다!"
2000205-51 = "이 약만 있으면 돼지 비계도, 마카롱도, 원하는 만큼 먹을 수 있어!"
2000205-52 = "정말 기대되는 걸……"
2000205-56 = "후-후-후- 그러게 말이야. 정말 기대가 되는 것이다."
2000205-58 = "사야의 연구실"
2000205-64 = "헉, 헉…… 드, 드디어 찾았다. 이, 이 사기꾼……"
2000205-65 = "우, 우리에게 엉터리 약을 주다니……!"
2000205-66 = "어라? 다이어트 효과가 별로였던 것이냐? 더 센 약을 줄 것 그랬나?"
2000205-67 = "아니야! 그 반대다!"
2000205-68 = "무얼 먹어도 금세 소화가 되어버리는 바람에…… #n아무리 먹어도 먹어도 배가 부르질 않아……"
2000205-69 = "이대로 가다가는 굶어죽을지도 몰라……"
2000205-70 = "그래도 다이어트 효과는 확실하잖아? #n모로 가도 서울만 가면 그만인 것이다. 하-하-하!"
2000205-71 = "이 녀석, 가만두지 않겠다……!"
2000205-72 = "안 돼…… 힘이 빠져서…… 서 있기도 어려워……"
2000205-76 = "흐음…… 다음 번에는 물만 마셔도 살이 찌는 약을 팔아볼까?"
