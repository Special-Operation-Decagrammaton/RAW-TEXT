10053060-19 = "มันก็ใช่อยู่หรอก แต่ว่าสึจิโนโกะเป็นตัวอะไรกันแน่ล่ะ? เป็นงูจริงหรือเปล่า? นอกจากตัวอ้วนแล้ว ยังมีลักษณะเด่นอื่นๆ อีกหรือเปล่า?"
10053060-20 = "อืม... เป็นคำถามที่เฉียบแหลมเลยละ อย่างแรกเลยนะ ที่บอกว่าเป็นงูอ้วนน่ะ ไม่ตรงกับความเป็นจริงหรอก"
10053060-21 = "คำเรียกนั้นมันตรงตัวและเข้าใจง่ายดี ก็เลยติดปากและเป็นที่ยอมรับในหมู่คนทั่วไปเฉยๆ ที่จริงแล้ว#nสึจิโนโกะรูปร่างค่อนข้างไปทางทรงสี่เหลี่ยมขนมเปียกปูนมากกว่า"
10053060-22 = "หืม~ จริงเหรอ? แล้วนอกจากนั้นล่ะ?"
10053060-23 = "จากคำบอกเล่าของผู้ที่พบเห็น มันต่างจากงูทั่วไปตรงที่เวลาขู่ มันจะส่งเสียงร้อง 'หง่าว!' น่ะสิ"
10053060-24 = "เป็นงูหรือแมวกันเนี่ย?"
10053060-25 = "และที่สำคัญก็คือการกระโดดที่ทรงพลัง! ได้ยินว่ากระโดดได้สูงเกือบหนึ่งเมตรเลยนะ!"
10053060-26 = "เป็นแมวจริงๆ ด้วยสินะ"
10053060-27 = "เอ๋? ฟังดูก็มีเหตุผล... หรือว่าจริงๆ แล้วสึจิโนโกะจะเป็นแมว?!"
10053060-28 = "ทำไมคนอย่างเธอถึงคล้อยตามไปด้วยล่ะ!!"
