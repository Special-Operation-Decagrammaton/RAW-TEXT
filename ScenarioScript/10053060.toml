[translation]
10053060-1 = "第6話;從地獄打來的電話亭"
10053060-2 = "（隔日）"
10053060-7 = "這麼笨的方法一輩子也找不到！"
10053060-12 = "嗯？突然怎麼了？"
10053060-17 = "完全不「突然」好嗎！？ 已經翻石頭翻了2個小時了！"
10053060-18 = "但是……蛇的習性是喜歡陰涼潮濕的地方……"
10053060-19 = "話說回來，槌之子到底是什麼？是蛇嗎？除了長得胖之外還有其他特徵嗎？"
10053060-20 = "原來如此……是很敏銳的問題呢。首先，說是胖蛇這個描述並不準確。"
10053060-21 = "只是因為直觀且熟悉才在大眾中定型，實際上槌之子更接近菱形。"
10053060-22 = "哦～是嗎？其他的呢？"
10053060-23 = "雖然說法不一，但據說和普通的蛇不同，威脅對手時會發出「嚇啊──！」的叫聲。"
10053060-24 = "確定不是貓嗎？"
10053060-25 = "而且最厲害的是跳躍力！據說可以原地跳將近1m高！"
10053060-26 = "是貓吧。"
10053060-27 = "咦？聽起來……其實槌之子就是貓嗎！？"
10053060-28 = "連你都被說服了要怎麼辦啊！！"
10053060-29 = "沒有對搜索更有幫助的資訊嗎？"
10053060-30 = "嗯……有助於搜索的資訊是不知道，但方法倒是知道一個。"
10053060-31 = "就是給我們的隊伍取名字。"
10053060-32 = "……？"
10053060-33 = "什麼意思？"
10053060-38 = "如你所知，名字決定本質。例如，如果我們自稱探險隊，#n從那一刻起我們的目的就會變成探險，會無意識地更忠實於原本的目的。"
10053060-39 = "而且，那明確的意志會重新調整宇宙的流動使其流向我們想要的，#n準確地說是曾經想要的結果，也有這樣的研究結果。"
10053060-40 = "說著貌似有道理的精神論，突然轉向偽科學是怎樣！"
10053060-45 = "啊，我贊成。有個帥氣的名字就好了。"
10053060-46 = "老師你怎麼看？"
10053060-47 = "[s1] 「我也覺得不錯。」\n[s2] 「沒錯，例如……」"
10053060-53 = "[ns] 「我們研究的是神秘學，就簡稱神秘──！！」"
10053060-55 = "不要！！！！這樣真的會出大事的！？！？"
10053060-60 = "我覺得是個挺好的名字啊……？"
10053060-61 = "那就忠實於原本的目的叫「槌之子探險隊」如何？"
10053060-62 = "呃……和想像的有點不一樣……沒有什麼帥氣的名字嗎？"
10053060-67 = "怎，怎樣啦！？為什麼要看我！？"
10053060-68 = "是玲奈說不要神秘研的。說不要的人應該提出替代方案吧？"
10053060-69 = "……槌之子探險隊不就好了嗎？"
10053060-70 = "[s3] 「作為奇普托斯最棒的時裝設計師的品味……」\n[s4] 「展示一下玲奈的藝術才能吧！」"
10053060-73 = "這個和時裝藝術有什麼關──"
10053060-74 = "唔……！！"
10053060-75 = "看來你還是覺得有點關係嘛……"
10053060-76 = "呼～！不愧是狂獵的學生～！"
10053060-77 = "……X。"
10053060-78 = "嗯？"
10053060-79 = "「探險班X」怎麼樣？"
10053060-80 = "……"
10053060-81 = "……"
10053060-82 = "不，不對！這個不算！我想想……"
10053060-83 = "不是很帥嗎！？探險班X！！"
10053060-84 = "感覺像是某個秘密組織的特工呢……"
10053060-85 = "要是讓我們的人命名的話就只會拿出什麼希望、幸福之類土氣的東西，#n狂獵果然不一樣。"
10053060-86 = "是，是嗎？不錯嗎……？"
10053060-87 = "咳，哼。那當然，也不想想這是誰取的名字！"
10053060-88 = "有了名字之後感覺槌之子的搜索也會更順利呢！"
10053060-90 = "好，探險班X！讓我們重新開始充滿活力地尋找槌之子吧！"
10053060-97 = "這麼笨的方法一輩子也找不到！"
10053060-102 = "嗯？有什麼問題嗎？"
10053060-103 = "大有問題好嗎！？結果還是跟剛才一樣完全沒變啊！！"
10053060-104 = "翻了太多石頭我現在已經開始認得出石頭下面住的蟲子種類了！！"
10053060-105 = "喔，別擔心，我已經在用「吸引力法則」把宇宙的能量引到我們這邊了。"
10053060-106 = "但是要小心，不要使用負面詞彙，盡量說話時用過去式。#n不是「想找槌之子」，而是「找到槌之子了」，這樣。"
10053060-108 = "那是偽科學！！偽科學！！"
10053060-110 = "嗯？話說現在幾點了？"
10053060-114 = "……啊。"
10053060-115 = "怎麼了？已經到搭巴士的時間了嗎？"
10053060-116 = "呃，那個，該怎麼說呢。"
10053060-118 = "巴士……走掉了。"
10053060-124 = "哎呀～沒關係啦，叫個計程車吧。"
10053060-133 = "哇，真的假的，沒有訊號。"
10053060-134 = "奇普托斯還有這種地方啊。"
10053060-135 = "我也是，完全沒有訊號。"
10053060-136 = "乾脆現在開始走路回去怎麼樣？"
10053060-137 = "……啊，對了。"
10053060-138 = "我剛才好像有看到公共電話。"
10053060-139 = "對，聽你這麼說我剛才也看到了。"
10053060-140 = "對吧？那就用那個叫計程車吧，我馬上回來～"
10053060-144 = "等等！天都黑了一個人在山裡的話……"
10053060-145 = "走掉了……"
10053060-147 = "[ns5] 「我跟過去吧。」\n[ns6] 「你們兩個在這裡等著。」"
10053060-154 = "站住，是誰，在這裡幹什麼……"
10053060-155 = "……咦？老師？"
10053060-156 = "啊，抱歉。因為有人跟上來，我還以為是「那個囚犯」在跟蹤我。"
10053060-157 = "話說，有什麼事嗎？"
10053060-158 = "……咦？擔心我所以就跟來了？……擔心我？"
10053060-164 = "哎呀～在公安局都沒有受到這麼熱情的對待呢～"
10053060-165 = "不如說那些傢伙一有危險的事就先把我推出去，哈哈哈哈！"
10053060-166 = "謝啦，但是我一個人也沒問題的。如您所見，公共電話一下就找到了～"
10053060-167 = "我馬上打完電話，請稍等一下！"
10053060-172 = "……啊。"
10053060-173 = "老師，那個，抱歉，你有銅板嗎？"
10053060-174 = "[s7] 「才剛說完就……」\n[s8] 「還好跟來了……」"
10053060-179 = "嗯？您要進來電話亭嗎？"
10053060-182 = "不會太擠嗎？要不要我先出去？……沒關係嗎？"
10053060-183 = "那快點打完出去吧。"
10053060-188 = "喂？是計程車公司嗎？"
10053060-189 = "是的，我想叫計程車，這裡是……"
10053060-190 = "呃……請稍等。"
10053060-191 = "這裡是……該怎麼說明呢？是白川山……"
10053060-192 = "啊！要掛掉了！老師！銅板！快！"
10053060-196 = "所以……這裡是哪裡來著。"
10053060-197 = "啊，對了對了，到白川山公車站就好了，是的，站牌前面。"
10053060-198 = "4個人，小型車……老師會不會不方便？"
10053060-199 = "不對，老師坐副駕，三個人坐後面的話……"
10053060-200 = "啊，又要掛掉了！什麼爛公共電話！"
10053060-204 = "是的，就小型車。"
10053060-205 = "我們會在這裡等，麻煩馬上過來。"
10053060-206 = "好～辛苦了。"
10053060-210 = "解決～解決～萬事大吉～現在只要在站牌等著就……"
10053060-215 = "咦？是太舊了嗎？怎麼打不開？"
10053060-220 = "蛤？這傢伙……老師，請讓開一下。"
10053060-228 = "老師……？呃……"
10053060-229 = "銅板，還有剩嗎？好像得叫救援了。"
10053060-230 = "[ns9] 「沒有了……」\n[ns10] 「剛才用的是最後一個。」"
10053060-234 = "真是倒楣，什麼怪事都有。"
10053060-235 = "唉，抱歉，都是因為我……"
10053060-236 = "[s11] 「不是木乃香的錯吧？」\n[s12] 「只是門太舊壞了而已。」"
10053060-239 = "不，是我運氣不好招來了倒楣事。"
10053060-240 = "所以運氣不好的時候才想一個人待著，不然會把霉運傳給周圍的人。"
10053060-241 = "[s13] 「木乃香很相信這種東西呢。」\n[s14] 「運氣啊，迷信什麼的。」"
10053060-244 = "與其說相信，不如說實際上就是這樣不是嗎？"
10053060-245 = "你看，被困在公共電話亭裡，這種事一輩子能不能發生一次都不知道吧。"
10053060-246 = "現在這個時機發生這種事，就是因為我的運氣太衰了。"
10053060-247 = "嗯……不過如果太晚回去的話，那兩個人會來找我們吧，而且也聯絡過計程車公司了……"
10053060-251 = "……不過這裡有點擠呢。"
10053060-252 = "[s15] 「是啊……」\n[s16] 「好像比剛才更熱了……」"
10053060-255 = "我也感覺到了。"
10053060-256 = "果然是因為兩個人進來的關係嗎？"
10053060-260 = "啊，抱歉，碰到您了。"
10053060-261 = "該死……這什麼情況啊。"
10053060-266 = "……公共電話響了！？"
10053060-267 = "不對不對，公共電話也會接到電話嗎？"
10053060-268 = "[s17] 「技術上是可以，但……」\n[s18] 「通常應該不會吧……？」"
10053060-271 = "這個該怎麼辦？要接嗎？"
10053060-275 = "……果然不接不行吧？"
10053060-281 = "……喂？"
10053060-286 = "（從話筒那邊傳來熊熊燃燒的火聲和阿鼻叫喚般的慘叫聲。）"
10053060-287 = "你們也會在這裡被燒死的。"
10053060-291 = "老，老，老，老師！？"
10053060-292 = "你聽到了嗎！？這不是真的吧！？"
10053060-293 = "[s19] 「冷，冷靜，木乃香！」\n[s20] 「可能只是噪音，或者是惡作劇電話……！」"
10053060-296 = "不，怎麼可能！"
10053060-297 = "誰會打電話到公共電話，而且在這個時機剛好打來！？"
10053060-298 = "剛才不是說燒死嗎！？好像越來越熱了！？"
10053060-299 = "這不是心理作用！！地板是真的很燙！！"
10053060-300 = "[s21] 「確實是有點熱……！」\n[s22] 「總之，我們冷靜等待救援吧。」"
10053060-304 = "（過了大約10分鐘，救援還沒有來……）"
10053060-307 = "哈啊……哈啊……"
10053060-308 = "老師你還好嗎？從剛才開始汗就流得很誇張……"
10053060-309 = "[s23] 「木乃香也是啊……」\n[s24] 「有點，撐不住了……」"
10053060-312 = "……"
10053060-313 = "好吧，沒辦法了。"
10053060-314 = "老師，請靠近我一點。"
10053060-318 = "靠近到身體接觸在一起的程度……嗯，這樣剛剛好。"
10053060-319 = "那麼……"
10053060-323 = "我要上了！！！！！！！"
10053060-333 = "啊～好爽！！ 早該砸了！！"
10053060-334 = "老師，你有沒有受傷？"
10053060-335 = "[ns25] 「嗯，多虧有你，謝謝。」\n[ns26] 「沒想到會把電話亭扔出去……」"
10053060-338 = "這點小事輕而易舉！哈哈哈！"
10053060-340 = "（嘶嘶……）"
10053060-341 = "不是吧……這種事……怎麼可能……"
10053060-350 = "嗚哇，那該死的電話！！好可怕！！那個真的不是鬧鬼嗎！？"
10053060-351 = "我們趕快回去吧！！"
10053060-353 = "（結果，到最後也無法得知電話那頭聲音的真相。）"
