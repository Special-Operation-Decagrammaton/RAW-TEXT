[translation]
10053060-1 = "제6화;지옥에서 걸려 오는 전화박스"
10053060-2 = "(다음 날)"
10053060-7 = "이렇게 무식한 방법으로는 평생 못 찾아!"
10053060-12 = "응? 뭐야, 갑자기?"
10053060-17 = "전혀 '갑자기'가 아니거든?! 벌써 2시간째 바위만 뒤집고 있잖아!"
10053060-18 = "하지만…… 뱀은 습성상 그늘지고, 습기 찬 곳을 선호하니까……."
10053060-19 = "그래, 애초에 츠치노코는 뭐야? 뱀은 맞아? 뚱뚱하게 생겼다는 거 말고 다른 특징 없어?"
10053060-20 = "과연…… 예리한 질문이네. 일단, 뚱뚱한 뱀이라는 표현은 사실과 달라."
10053060-21 = "직관적이고 친숙하여 대중에게 정착했을 뿐, 실제로 츠치노코는 마름모꼴에 가깝다지."
10053060-22 = "헤에~ 그래? 그밖에는?"
10053060-23 = "목격담에 따라 다르지만, 일반적인 뱀과 달리 상대를 위협할 때 샤아악! 하는 울음소리를 낸다고도 하지."
10053060-24 = "고양이 아냐?"
10053060-25 = "그리고, 무엇보다 대단한 것은 점프력! 제자리에서 1m 높이 가까이 점프할 수 있다고 해!"
10053060-26 = "고양이잖아."
10053060-27 = "어라? 듣고 보니……. 사실, 츠치노코는 고양이였던 건가?!"
10053060-28 = "네가 설득되면 어쩌자는 거야!!"
10053060-29 = "좀 더 탐색에 도움될 만한 정보는 없어?"
10053060-30 = "음…… 탐색에 도움이 될 정보라면 몰라도, 방법이라면 하나 알고 있는 게 있는데."
10053060-31 = "바로, 우리들의 팀명을 짓는 거야."
10053060-32 = "……?"
10053060-33 = "들어는 줄게. 계속 말해봐."
10053060-38 = "알다시피 이름은 본질을 결정해. 예를 들어, 우리가 탐사대를 자칭한다면, 그 순간부터 우리의 목적은 탐사가 되어 무의식적으로 그 본연의 목적에 더 충실하게 되지."
10053060-39 = "그리고, 그 명확한 의지가, 우주의 흐름을 재조율하여, 우리가 원하는, 정확히는 원했던 결과로 흘러가게 된다는 연구 결과도 있어."
10053060-40 = "그럴듯한 근성론을 말하다가, 갑자기 사이비 과학으로 틀지 말라고!"
10053060-45 = "아, 나는 찬성. 좀 뽀대나는 이름이 있으면 좋겠는데."
10053060-46 = "선생님은 어떻게 생각하심까?"
10053060-47 = "[s1] \"나도 좋다고 생각해.\"\n[s2] \"그래, 예를 들어서…….\""
10053060-53 = "[ns] \"우리는 오컬트를 연구하니, 줄여서 오컬ㅇ──!!\""
10053060-55 = "하지 말라고!!!! 진짜 죽는다?!?!"
10053060-60 = "……? 나는 꽤 좋은 이름이라고 생각했는데."
10053060-61 = "그러면, 본연의 목적에 충실하게 <츠치노코 탐사대>는 어때?"
10053060-62 = "……생각했던 거랑 좀 다른데……. 좀 간지나는 이름 없나?"
10053060-67 = "뭐, 뭐야?! 왜 날 쳐다봐?!"
10053060-68 = "아니, 오컬연은 레나가 싫다며. 싫다는 사람이 대안을 제시해야지?"
10053060-69 = "……그냥 츠치노코 탐사대로 충분하지 않아?"
10053060-70 = "[s3] \"키보토스 최고의 패션 디자이너 센스치고는…….\"\n[s4] \"레나의 예술적 재능을 보여줘!\""
10053060-73 = "아니, 이거하고 패션 예술하고는…… 관계가……!!"
10053060-74 = "크윽……!!"
10053060-75 = "어느 정도는 있다 생각하는구나……."
10053060-76 = "휘유~! 역시 와일드헌트 학생~!"
10053060-77 = "……X."
10053060-78 = "응?"
10053060-79 = "<탐사반 X>. 어때?"
10053060-80 = "……."
10053060-81 = "……."
10053060-82 = "아, 아니야! 이거는 취소! 그러면……."
10053060-83 = "아니, 되게 멋있지 않아?! 탐사반 X!!"
10053060-84 = "무언가 비밀 조직의 요원 같은 느낌인걸……."
10053060-85 = "우리 애들은 뭔 공모를 시키면 희망이니, 누리니, 이딴 촌스러운 것만 가져오는데. 와일드헌트는 좀 다르구나."
10053060-86 = "그, 그래? 괜찮다고……?"
10053060-87 = "흐, 흐흥. 그야 당연하지. 누가 지은 이름인데!"
10053060-88 = "이름이 붙으니까 츠치노코 탐색도 더 잘될 거 같은 기분인걸!"
10053060-90 = "좋아, 탐사반 X! 츠치노코를 찾아 다시 힘차게 탐색을 시작하자!"
10053060-97 = "이렇게 무식한 방법으로는 평생 못 찾아!"
10053060-102 = "어? 뭔가 문제라도?"
10053060-103 = "아니, 얼렁뚱땅 넘어가고, 결국 수색 방식은 하나도 안 바꿨잖아!!"
10053060-104 = "하도 많이 바위를 뒤집어서, 이제 슬슬 바위 뒤에 사는 벌레 종류가 눈에 익을 정도라고!!"
10053060-105 = "아, 아아. 그 부분은 걱정하지 마. 이미 '끌어당김의 법칙'으로 우주의 기운을 우리 쪽으로 돌려놨으니까."
10053060-106 = "하지만 조심해. 부정적인 어휘는 사용하지 말고, 가급적 말할 때도 과거형으로 말해야 해. 츠치노코를 찾고 싶다가 아니라, 츠치노코를 찾았다, 같은 식으로."
10053060-108 = "그거 사이비!! 사이비 과학!!"
10053060-110 = "응? 근데 지금 몇 시지?"
10053060-114 = "……어."
10053060-115 = "왜 그래? 벌써 버스 탈 시간이야?"
10053060-116 = "아니, 그, 뭐라 해야 하지, 이걸."
10053060-118 = "……지나갔는데? 버스."
10053060-124 = "에이~ 뭐, 괜찮아. 콜택시라도 부르지."
10053060-133 = "우와, 실화냐. 회선이 안 터지네."
10053060-134 = "아직도 키보토스에 이런 동네가 있었나."
10053060-135 = "내 핸드폰도 안 잡혀. 아예 전파가 안 닿는 거 같아."
10053060-136 = "차라리 지금부터라도 걸어가는 게 어때?"
10053060-137 = "……아. 잠깐만."
10053060-138 = "그러고 보니, 아까 공중전화 본 거 같거든?"
10053060-139 = "아, 맞아. 나도 봤어."
10053060-140 = "그치? 그러면 그냥 그걸로 택시 부르지 뭐. 잠깐 다녀오겠슴다~"
10053060-144 = "잠깐! 날이 저물었는데, 산속에서 혼자 다니는 건……."
10053060-145 = "벌써 가버렸나……."
10053060-147 = "[ns5] \"응, 내가 따라갔다 올게.\"\n[ns6] \"둘은 여기서 기다리고 있어.\""
10053060-154 = "거기, 멈춰. 뭐 하는 새끼……."
10053060-155 = "……엥? 선생님?"
10053060-156 = "아, 죄송함다. 누가 쫓아오길래, '그 죄수'가 뒤를 밟는 줄 알고요."
10053060-157 = "그나저나, 무슨 일이심까? 깜빡하신 거라도?"
10053060-158 = "……네? 걱정돼서 따라왔다고요? 저를요?"
10053060-164 = "이야~ 공안국에서도 이렇게 극진한 대접 못 받는데~"
10053060-165 = "아니, 극진한 게 뭐야. 걔네는 위험한 일 있으면 제 등부터 떠미는데 말이죠, 하하하하!"
10053060-166 = "감사함다. 그치만 저 혼자서도 괜찮지 말임다. 이렇게 보시듯이 공중전화도 한방에 찾았다는 말씀~"
10053060-167 = "금방 통화하고 올 테니, 잠깐만 기다려 주십쇼!"
10053060-172 = "……아."
10053060-173 = "선생님, 그, 죄송한데, 동전 있으심까?"
10053060-174 = "[s7] \"말하자마자, 인가…….\"\n[s8] \"따라오길 잘했네…….\""
10053060-179 = "아, 부스에 들어오시는 검까?"
10053060-182 = "좁지 않으심까? 나가 있을까요? ……아, 괜찮다고요?"
10053060-183 = "뭐, 후딱 끝내죠."
10053060-188 = "……아, 여보세요? 거기 택시 회사죠?"
10053060-189 = "아, 넵. 콜택시 부르려고 전화했는데요. 여기가……."
10053060-190 = "어…… 잠시만요."
10053060-191 = "……여기가, 뭐라고 설명해야 하죠? 시라카와 산인데……."
10053060-192 = "앗! 끊긴다! 쌤! 동전! 빨리!"
10053060-196 = "……그래서, 여기가 어디랬더라."
10053060-197 = "아, 맞다, 맞다. 시라카와 산 버스 정류소로 가면 되겠다. 넵, 정류소 앞임다."
10053060-198 = "4명인데요. 어, 소형은…… 선생님이 불편하시려나요?"
10053060-199 = "아, 아니다. 선생님이 조수석 타시고, 셋이서 뒤에 타면……."
10053060-200 = "아, 또 끊길라 하네! 뭔 놈의 공중전화가 이래!"
10053060-204 = "아, 넵. 소형으로 부탁드림다."
10053060-205 = "기다리고 있으니까 바로 와주시면 됨다."
10053060-206 = "네~ 욕보십쇼."
10053060-210 = "아, 해결~ 해결~ 만사형통~ 이제 정류소에서 기다리기만 하면……."
10053060-215 = "아니, 낡아서 그런가. 왜 안 열린대?"
10053060-220 = "어쭈? 요놈 봐라? 선생님, 잠깐만 물러나 보십쇼."
10053060-228 = "선생님……? 어……."
10053060-229 = "동전, 남는 거 없으심까? 구조 불러야 할 거 같은데."
10053060-230 = "[ns9] \"이제 없어…….\"\n[ns10] \"조금 전에 쓴 게 마지막이야.\""
10053060-234 = "진짜 일이 안 될라니까, 별일이 다 일어나네."
10053060-235 = "에휴, 죄송함다. 괜히 저 때문에……."
10053060-236 = "[s11] \"코노카 때문은 아니잖아?\"\n[s12] \"문이 낡아서 고장 났을 뿐이지.\""
10053060-239 = "아뇨, 제 운수가 나빠서 화를 불러온 검다."
10053060-240 = "이래서 기운이 나쁠 때는 혼자 있고 싶은데 말이죠. 주변에까지 화가 퍼지니까요."
10053060-241 = "[s13] \"코노카는 그런 걸 되게 믿는구나.\"\n[s14] \"운이라든지, 미신이라든지.\""
10053060-244 = "믿는다, 기보다는 실제로 그렇지 않슴까?"
10053060-245 = "거 보십쇼. 공중전화 부스에 갇히는 거, 살면서 한 번이나 일어날까 말까 한 일 아님까."
10053060-246 = "지금 타이밍에 이렇게 일어난 거는, 제 기운이 쇠약해진 상태라 그런 거죠."
10053060-247 = "뭐…… 그래도 너무 늦으면, 두 사람이 눈치채고 도움을 부르겠죠. 택시 회사에도 연락해 뒀고……."
10053060-251 = "……좀 좁네요, 여기."
10053060-252 = "[s15] \"그러게…….\"\n[s16] \"아까보다 더워진 거 같기도…….\""
10053060-255 = "아, 저도 느꼈슴다."
10053060-256 = "역시 둘이 들어와 있어서 그럴까요?"
10053060-260 = "아, 죄송함다. 몸 닿았슴다."
10053060-261 = "아씨…… 뭔 상황이래."
10053060-266 = "……공중전화가, 울렸다?"
10053060-267 = "아니아니아니. 공중전화에 전화가 오기도 함까?"
10053060-268 = "[s17] \"기술적으로는 가능하다지만…….\"\n[s18] \"보통은 없지 않나……?\""
10053060-271 = "이거는, 어떻게 하죠? 받아야 할까요?"
10053060-275 = "……역시, 그렇겠죠? 안 받을 수는 없겠죠?"
10053060-281 = "여보세요."
10053060-286 = "(수화기 너머에서 이글거리는 불소리와 함께 아비규환과 같은 비명소리가 들려온다.)"
10053060-287 = "너희도 여기서 타 죽을 거야."
10053060-291 = "서, 서, 서, 선생님?!"
10053060-292 = "방금 들으셨슴까?! 이거 진짜 아님까?!"
10053060-293 = "[s19] \"지, 진정해, 코노카!\"\n[s20] \"그냥 노이즈이거나, 장난전화일 수도……!\""
10053060-296 = "아니, 그럴 리가 없잖슴까?!"
10053060-297 = "누가 공중전화에, 이 타이밍에 딱! 하고 전화를 겁니까?!"
10053060-298 = "방금 타 죽는다 하지 않았슴까?! 점점 뜨거워지고 있는 거 같은데?!"
10053060-299 = "아니, 이거는 기분 탓 아님다!! 진짜로 뜨겁슴다, 바닥!!"
10053060-300 = "[s21] \"확실히 덥긴 한데……!\"\n[s22] \"일단, 차분히 구조를 기다리자.\""
10053060-304 = "(10분 정도 시간이 흘렀지만, 구조는 오지 않았다…….)"
10053060-307 = "……하아, 하아……."
10053060-308 = "선생님, 괜찮으심까? 조금 전부터 땀이 장난 아닌데요……."
10053060-309 = "[s23] \"코노카도 마찬가지야.\"\n[s24] \"조금, 버티기 힘들지도…….\""
10053060-312 = "……."
10053060-313 = "이거는, 어쩔 수 없겠슴다."
10053060-314 = "선생님. 좀 더 가까이 오십쇼."
10053060-318 = "몸이 닿을 정도로…… 네, 그 정도가 좋슴다."
10053060-319 = "그러면……."
10053060-323 = "간다!!!!!!!"
10053060-333 = "아~ 후련해!! 진작에 때려 부술걸!!"
10053060-334 = "아, 선생님, 다치신 곳은 없으심까?"
10053060-335 = "[ns25] \"응, 덕분에. 고마워.\"\n[ns26] \"부스를 집어 던질 줄이야…….\""
10053060-338 = "이 정도야 거뜬하지 말임다! 하하하!"
10053060-340 = "(치직…….)"
10053060-341 = "……아니…… 이러는 법이, ……어딨……."
10053060-350 = "으아, 저놈의 전화기!! 소름 끼쳐!! 저거 진짜 귀신 들린 거 아님까?!"
10053060-351 = "빨리 돌아가죠!!"
10053060-353 = "(결국, 공중전화 너머의 목소리의 정체는 마지막까지 알 수 없었다.)"
