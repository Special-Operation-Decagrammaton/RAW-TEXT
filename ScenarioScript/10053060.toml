[translation]
10053060-1 = "第6話;從地獄打來的電話亭"
10053060-2 = "（隔天）"
10053060-7 = "用這麼笨的方法，找一輩子也找不到啦！"
10053060-12 = "嗯？怎麼突然這麼說？"
10053060-17 = "完全不「突然」好嗎！？#n我們已經翻了2個小時的石頭了耶！"
10053060-18 = "但是……蛇的習性是喜歡陰涼潮濕的地方……"
10053060-19 = "話說，槌之子到底是什麼啊？#n真的是蛇嗎？除了長得胖之外還有其他特徵嗎？"
10053060-20 = "呼呣……是個相當犀利的問題呢。#n首先，其實「胖蛇」這個描述並不是很準確。"
10053060-21 = "只是因為直觀又好記才會廣為流傳，實際上槌之子應該更接近菱形才對。"
10053060-22 = "嘿～這樣啊？還有其他的嗎？"
10053060-23 = "雖然說法不一，不過槌之子似乎和一般蛇類不同，#n在威嚇時會發出「嚇啊──！」的叫聲。"
10053060-24 = "確定不是貓嗎？"
10053060-25 = "然後最厲害的是牠的跳躍力！#n據說能夠原地跳起將近1m高哦！"
10053060-26 = "那是貓吧。"
10053060-27 = "咦？這麼說來……難道槌之子其實是貓嗎！？"
10053060-28 = "連你都被說服了要怎麼辦啦！！"
10053060-29 = "沒有對搜索更有幫助的資訊嗎？"
10053060-30 = "唔嗯……資訊的話倒是沒有，不過我知道一個方法。"
10053060-31 = "那就是幫我們的隊伍取名字。"
10053060-32 = "……？"
10053060-33 = "先聽你說說是什麼意思吧？"
10053060-38 = "如你所知，名字將會決定事物的本質。比如要是自稱為「探險隊」的話──#n我們的目的就會從那一刻起改變為探險，並在無意識間更加忠於那樣的目的。"
10053060-39 = "而且也有研究結果指出，那股明確的意志將會重新調整宇宙的流動，#n並將其引導至我們想要的──準確來說，是曾經渴望的結果。"
10053060-40 = "不要煞有其事地說著精神論，然後又突然鬼轉成偽科學好不好！"
10053060-45 = "啊，我贊成。有個帥氣的名字感覺挺不錯的。"
10053060-46 = "老師怎麼看呢？"
10053060-47 = "[s1] 「我也覺得不錯。」\n[s2] 「我想想，例如……」"
10053060-53 = "[ns] 「既然我們研究的是神秘學，乾脆就簡稱為神秘──！！」"
10053060-55 = "拜託不要！！！！這樣真的會出大事的啦！？！？"
10053060-60 = "我覺得是個挺好的名字啊……？"
10053060-61 = "那麼就忠於本來的目的，叫「槌之子探險隊」怎麼樣？"
10053060-62 = "感覺跟我想像的有點不一樣耶……沒有什麼更帥氣的名字嗎？"
10053060-67 = "怎，怎樣！？為什麼要盯著我看啊！？"
10053060-68 = "沒有啦，只是既然玲奈不要神秘研的話，應該負責提出替代方案吧？"
10053060-69 = "……叫槌之子探險隊不就行了嗎？"
10053060-70 = "[s3] 「以奇普托斯最棒的時裝設計師的品味來說……」\n[s4] 「展示一下玲奈的藝術才能吧！」"
10053060-73 = "不是，這跟時裝藝術有什麼關係……！"
10053060-74 = "唔……！！"
10053060-75 = "看來你也多少覺得有關係呢……"
10053060-76 = "哎呀～！真不愧是狂獵的學生～！"
10053060-77 = "……X。"
10053060-78 = "嗯？"
10053060-79 = "「探險班X」怎麼樣？"
10053060-80 = "……"
10053060-81 = "……"
10053060-82 = "不，不對！這個不算！#n讓我再想一想……"
10053060-83 = "不是很帥嗎！？探險班X！！"
10053060-84 = "感覺像是某個祕密組織的特務呢……"
10053060-85 = "向我們學園的人徵名的時候，總是只會收到希望或努力這類土裡土氣的東西……#n果然狂獵就是不一樣呢～"
10053060-86 = "是，是嗎？還不錯啊……？"
10053060-87 = "哼，哼！那還用說！也不想想這是誰取的名字！"
10053060-88 = "有了名字之後，感覺就連槌之子的搜索也會變得更順利呢！"
10053060-90 = "好，探險班X！讓我們再次打起精神，開始尋找槌之子吧！"
10053060-97 = "用這麼笨的方法，找一輩子也找不到啦！"
10053060-102 = "嗯？有什麼問題嗎？"
10053060-103 = "剛才雖然被你們含糊帶過了，結果找的方法還是完全沒變嘛！！"
10053060-104 = "因為翻了太多石頭的關係，我現在都開始認得石頭底下的蟲子是什麼種類了啦！！"
10053060-105 = "啊，這個部分你不用擔心。#n我已經藉由「吸引力法則」將宇宙的能量引導到我們這邊了。"
10053060-106 = "不過要注意避免使用負面詞彙，說話的時候也要盡量使用過去式。#n例如不可以說「想找到槌之子」，而是要說「找到槌之子了」。"
10053060-108 = "那是偽科學！！完完全全的偽科學！！"
10053060-110 = "嗯？話說現在幾點了？"
10053060-114 = "……啊。"
10053060-115 = "怎麼了？已經到巴士的時間了嗎？"
10053060-116 = "那個，該怎麼說呢……"
10053060-118 = "巴士好像……已經開走了。"
10053060-124 = "哎呀～沒關係啦。#n我們就叫台計程車吧。"
10053060-133 = "哇，真的假的。這裡沒有訊號耶。"
10053060-134 = "原來奇普托斯還有這種地方啊。"
10053060-135 = "我的也完全沒有訊號。看來是完全接收不到電波呢。"
10053060-136 = "還是乾脆從現在開始走路回去？"
10053060-137 = "……啊，先等一下。"
10053060-138 = "這麼說來，剛才是不是有看到過公共電話？"
10053060-139 = "啊，嗯。我剛才也看到了。"
10053060-140 = "對吧？就用它來叫計程車吧。#n我馬上回來～"
10053060-144 = "等等！現在天都黑了，要是一個人在山裡的話……"
10053060-145 = "已經走掉了……"
10053060-147 = "[ns5] 「我也一起過去吧。」\n[ns6] 「你們兩個在這裡等著。」"
10053060-154 = "那邊的人，給我站住。#n你是誰，在這裡做什麼……"
10053060-155 = "……咦？老師？"
10053060-156 = "啊，抱歉。因為有人跟了過來，我還以為是「那個逃犯」在跟蹤我呢。"
10053060-157 = "話說怎麼了嗎？有什麼事情忘記說了？"
10053060-158 = "……咦？覺得擔心就跟過來了？擔心我嗎？"
10053060-164 = "哎呀～我在公安局都沒有受過這麼好的待遇呢～"
10053060-165 = "或者應該說，那些傢伙一遇到危險就會先把我推出去才對，啊哈哈哈！"
10053060-166 = "雖然我一個人也沒問題，不過還是謝謝啦。#n如你所見，我一下就找到公共電話了～"
10053060-167 = "我馬上去把電話打完，麻煩老師稍等一下囉！"
10053060-172 = "……啊。"
10053060-173 = "老師，那個……抱歉，請問你身上有零錢嗎？"
10053060-174 = "[s7] 「話才剛說完就……」\n[s8] 「還好有跟過來……」"
10053060-179 = "啊，老師也要進來電話亭嗎？"
10053060-182 = "這樣會不會太擠？還是我先出去？#n……啊，沒關係是嗎？"
10053060-183 = "好，那我們就快點把事情搞定吧。"
10053060-188 = "……啊，你好？請問是計程車公司嗎？"
10053060-189 = "是的，我想叫計程車。這裡是……"
10053060-190 = "啊……請稍等一下。"
10053060-191 = "這裡是……該怎麼說明好呢？#n是在白川山的……"
10053060-192 = "啊！電話要斷掉了！#n老師！零錢！動作快！"
10053060-196 = "所以……這裡是哪裡來著。"
10053060-197 = "啊，對了對了，到白川山的公車站就行了。#n沒錯，就在站牌前面。"
10053060-198 = "這邊一共4個人。#n小型車的話……老師會不會不太方便？"
10053060-199 = "不對，如果老師坐副駕，我們三個人擠後面的話應該……"
10053060-200 = "啊，怎麼又要斷掉了啦！這到底是什麼破爛公共電話啊！"
10053060-204 = "啊，好的。小型車沒問題。"
10053060-205 = "我們會在這裡等，再麻煩盡快過來了。"
10053060-206 = "好～辛苦了。"
10053060-210 = "搞定搞定～萬事大吉～#n現在只要在站牌等著就……"
10053060-215 = "咦，是太舊了嗎？門怎麼打不開啊？"
10053060-220 = "哦？這傢伙……#n老師，麻煩讓開一下。"
10053060-228 = "老師……？呃……"
10053060-229 = "請問零錢還有剩嗎？#n我們好像得呼叫支援了。"
10053060-230 = "[ns9] 「已經沒了……」\n[ns10] 「剛才那是最後一個了。」"
10053060-234 = "人倒楣的時候，真是什麼怪事都能碰上呢。"
10053060-235 = "唉，抱歉。都是因為我……"
10053060-236 = "[s11] 「這不是木乃香的錯吧？」\n[s12] 「只是門太舊剛好壞了而已。」"
10053060-239 = "不，是我運氣不好才會招來倒楣的事。"
10053060-240 = "所以我倒楣的時候才會想一個人待著，以免把霉運傳染給周圍的人。"
10053060-241 = "[s13] 「木乃香很相信這種東西呢。」\n[s14] 「比如運氣或迷信之類的。」"
10053060-244 = "與其說相信，不如說實際上就是如此吧？"
10053060-245 = "你看，被困在公共電話亭裡這種事，一輩子能不能碰上一次都很難說吧？"
10053060-246 = "偏偏在這個時間點發生，就是因為我的運氣太衰了。"
10053060-247 = "不過……如果太晚回去的話，其他兩個人也會過來找我們吧。#n而且剛才也聯絡過計程車公司了……"
10053060-251 = "……話說這裡有點擠呢。"
10053060-252 = "[s15] 「就是說啊……」\n[s16] 「好像比剛才更熱了……」"
10053060-255 = "我也感覺到了。"
10053060-256 = "果然是因為兩個人進來的關係嗎？"
10053060-260 = "啊，抱歉碰到你了。"
10053060-261 = "該死……這到底是什麼情況啊。"
10053060-266 = "公共電話……居然響了？"
10053060-267 = "不不不，公共電話是能接電話的嗎？"
10053060-268 = "[s17] 「從技術上來說是可以……」\n[s18] 「不過通常是不會響的吧……？」"
10053060-271 = "該，該怎麼辦好呢？要接嗎？"
10053060-275 = "……果然還是得接吧？"
10053060-281 = "……你好？"
10053060-286 = "（從話筒另一邊傳來的是熊熊燃燒的火聲，以及宛如阿鼻地獄般的慘叫聲）"
10053060-287 = "你們也會在這裡被燒死的。"
10053060-291 = "老，老，老，老師！？"
10053060-292 = "你聽到了嗎！？這不是真的吧！？"
10053060-293 = "[s19] 「冷，冷靜點，木乃香！」\n[s20] 「可能只是噪音……或者惡作劇電話而已！」"
10053060-296 = "不是，這種事有可能嗎！？"
10053060-297 = "誰會剛好在這種時候打惡作劇電話到公共電話啊！？"
10053060-298 = "而且對方剛才不是說燒死嗎！？#n感覺好像真的越來越熱了耶！？"
10053060-299 = "這不是心理作用！！地板是真的很燙！！"
10053060-300 = "[s21] 「確實是有點熱……！」\n[s22] 「總之，我們先冷靜下來等待救援吧。」"
10053060-304 = "（過了大約10分鐘，救援依然沒有到來……）"
10053060-307 = "哈啊……哈啊……"
10053060-308 = "老師你還好嗎？#n從剛才開始汗就流得很誇張……"
10053060-309 = "[s23] 「木乃香你也是……」\n[s24] 「有點快撐不住了……」"
10053060-312 = "……"
10053060-313 = "看來沒辦法了。"
10053060-314 = "老師，請靠近我一點。"
10053060-318 = "靠近到身體貼在一起的程度……嗯，這樣剛剛好。"
10053060-319 = "那麼……"
10053060-323 = "看招！！！！！！！"
10053060-333 = "啊～真爽快！！早知道直接開砸就好了嘛！！"
10053060-334 = "老師，你沒有受傷吧？"
10053060-335 = "[ns25] 「嗯，多虧有你。謝謝。」\n[ns26] 「沒想到你會把電話亭扔出去……」"
10053060-338 = "這點小事輕輕鬆鬆啦！啊哈哈！"
10053060-340 = "（嘶嘶……）"
10053060-341 = "不是……這種事……怎麼可能……"
10053060-350 = "嗚哇，那台該死的電話也太恐怖了吧！！#n真的沒有被鬼附身嗎！？"
10053060-351 = "我們趕快回去吧！！"
10053060-353 = "（結果電話那頭聲音的真相，直到最後也不得而知）"
