10053060-37 = ""
10053060-38 = "ก็อย่างที่รู้กันว่าชื่อเป็นสิ่งที่กำหนดแก่นแท้ ถ้าพวกเราเรียกตัวเองว่าเป็น 'ทีมสำรวจ' ตั้งแต่วินาทีนั้น#nเป็นต้นไป จุดมุ่งหมายของเราก็จะเป็นการสำรวจ และเราจะทำหน้าที่ตามเป้าหมายที่แท้จริงนั้นอย่างเต็มที่#nโดยไม่รู้ตัว"
