[translation]
10032035-3 = "……이걸로 거의 다 둘러봤어. 나머지는 그래도 다 리스트 상 존재하는 사람들뿐."
10032035-4 = "생각보다 훨씬 더 많았네! 계속해서 싸움에 싸움만 이어서 한 느낌이랄까?"
10032035-5 = "대체 아란치노라는 사람은 얼마나 적이 많은 걸까요……."
10032035-6 = "뭐……. 갱단의 보스니까. 적으면 그게 이상한 거겠지."
10032035-7 = "물론 그렇다 쳐도……. 회수한 폭약의 양은 조금 놀라운 수준이었지만 말이야."
10032035-8 = "오페라 하우스를 통째로 날려버리고도 남을 정도의 양이었으니까."
10032035-9 = "이, 일단 전부 회수해서 뒷골목 쓰레기통에 버려버렸습니다만……."
10032035-10 = "그럼 이제 남은 곳은……."
10032035-16 = "……여기, 이 방이 마지막이야."
10032035-17 = "[s1] \"배우 대기실……이라.\"\n[s2] \"공연 준비 중일 텐데, 괜찮을까?\""
10032035-20 = "흐응~. 걱정되는 거야? 들어가면 방해라도 될까봐?"
10032035-21 = "확실히 이렇게 우글우글 들어가면 방해가 될 수밖에 없겠지. 지금 한창 바쁠 때니까."
10032035-22 = "뭐……. 안에 공작원이 숨어 있다면 어차피 전투가 발생할 테고, 지금의 이런 걱정도 의미 없는 거지만."
10032035-23 = "……어떻게 할 거야, 사장? 그냥 밀어붙일 거야?"
10032035-25 = "아니. 그렇게까지 할 필요는 없어."
10032035-26 = "여기서는 우선 나와 카요코만 들어가서 자연스럽게 내부를 살피도록 하자."
10032035-27 = "드레스 차림의 우리라면, 관계자로 속일 수 있을 테니까. 선생님…은 곤란하겠지. 아무래도. 시선이 집중될 거 같고."
10032035-28 = "무츠키와 하루카는 여기서 대기하며 선생님을 지켜줘. 금방 다녀올 테니."
10032035-30 = "오케이~. 무슨 일 있으면 바로 말해~."
10032035-31 = "네, 넵!! 여기서 기다리겠습니다! 목숨 걸고 지켜드리겠습니다, 선생님!!"
10032035-33 = "그렇게 됐으니, 선생님은 여기서 조금만 기다려줘."
10032035-34 = "……응? 괜찮겠냐고?"
10032035-35 = "후후. 아무리 그래도, 내가 이런 쪽으로 걱정을 끼칠 사람은 아니라고 생각하는데."
10032035-36 = "걱정하지 마. 금방 다녀올 테니."
10032035-37 = "출발하지, 카요코 과장."
10032035-44 = "……다녀올게, 선생."
10032035-45 = "혹시라도 무슨 일 있으면 아까 준……. 알지?"
10032035-46 = "[s3] \"걱정하지 마.\"\n[s4] \"카요코도 무슨 일 생기면 바로 연락해.\""
10032035-49 = "……후후."
10032035-50 = "……그럴게."
10032035-61 = "[ns5] \"아루, 카요코.\"\n[ns6] \"잘 다녀왔어? 별일은 없었고?\""
10032035-64 = "뭐, 예상대로 별거 없었어. 딱히 수상해 보이는 사람도 없었고, 폭탄 같은 것도 없었거든."
10032035-65 = "배우들 얼굴까지 하나하나 다 대조했던 건 아니지만……."
10032035-66 = "모두 공연 준비로 바빠 보였던 데다, 경호원들도 많았거든. 아무래도 장소가 장소다 보니……."
10032035-67 = "이래서야 배우 자체가 공작원이 아니라면, 숨어들기 쉽지 않겠지."
10032035-68 = "물론 명단 정도는 모두 대조를 마쳤어. 전원 등록 리스트에 올라와 있던 사람."
10032035-70 = "흐흥~. 그럼 일단 오페라 하우스의 검색은 이걸로 끝?"
10032035-71 = "다음으로 해야 할 건……."
10032035-78 = "아, ……잠시."
10032035-84 = "후후. 이거, 마침 좋은 타이밍인걸."
10032035-85 = "……모두들. 준비해."
10032035-97 = "……보스가 거의 도착했어."
