[translation]
10000005-1 = "프롤로그"
10000005-2 = "(평소처럼 샬레에서 업무를 보고 있을 때, 한 통의 전화가 왔다.)"
10000005-4 = "따르릉!"
10000005-5 = "[s] \"응? 전화?\""
10000005-9 = "[ns] \"여보세요.\""
10000005-10 = "앗, 진짜로 받았다! 어, 어떡하지?!"
10000005-11 = "진정하고 심호흡 하는 겁니다. 부장! 하아! 후우!"
10000005-12 = "조, 좋아. 후우. 하아. 그럼……."
10000005-13 = "여보세요! 그, 실례되지 않는다면 혹시……."
10000005-14 = "이 전화, 샬레의 [USERNAME] 선생님의 전화가 맞나요?"
10000005-15 = "[s1] \"맞습니다.\"\n[s2] \"아닙니다.\""
10000005-16 = "앗! 역시나! 정말이었구나!"
10000005-17 = "……가 아니라!"
10000005-18 = "네?! 아닌가요?!"
10000005-19 = "내, 이럴 줄 알았어!"
10000005-20 = "한숨을 쉬면서 내키지 않다는 얼굴로 알려줄 때부터 수상하다 싶었지!"
10000005-21 = "[s3] \"농담이고, 사실 맞아.\""
10000005-22 = "네?!"
10000005-23 = "이, 이거 예상외로 짓궂은 분……이 아니라!"
10000005-25 = "[s] \"그래서 무슨 용무로 전화한 거야?\""
10000005-27 = "크흠흠……."
10000005-28 = "안녕하세요! 샬레의 [USERNAME] 선생님☆"
10000005-29 = "저, 시즈코예요~!"
10000005-30 = "시즈코는요~ 백귀야행 연합학원 소속 마츠리운영관리부의 부장이면서~"
10000005-31 = "또 백야당의 아이돌을 담당하고 있답니다~!"
10000005-32 = "오늘 이렇게 전화를 드린 건 다름이 아니라……."
10000005-33 = "선생님을 저희 백귀야행 연합학원의 봄 벚꽃 축제."
10000005-34 = "백야앵제에 초대하기 위해서예요!"
10000005-35 = "[s4] \"백귀야행……?\"\n[s5] \"축제……?\""
10000005-36 = "네! 부디 샬레의 선생님께서 참석하시어, 자리를 빛내 주시지 않겠어요?"
10000005-37 = "네! 부디 샬레의 선생님께서 참석하시어, 자리를 빛내 주시지 않겠어요?"
10000005-38 = "이번 백야앵제에서는 전에 없는 새로운 시도를 더 해서, 더욱더 특별한 축제가 될 예정이에요!"
10000005-39 = "거기에 더해 쪼오끔 선생님께 상담하고 싶은 게 있사오니, 꼭 방문해주시길 바라요!"
10000005-40 = "……."
10000005-42 = "조, 좋았어! 됐어! 피나! 해냈어!"
10000005-43 = "부장, 굿잡입니다!"
10000005-46 = "띠링."
10000005-47 = "(그때 한 통의 사진이 도착했다.)"
10000005-48 = "축제회장까지 찾아오실 수 있도록, 포스터를 보내드립니다."
10000005-49 = "그럼 시즈코, 선생님이 찾아오길 기.대.하.면.서."
10000005-50 = "백야당에서 기다리고 있을게요~♪ 냥냥!"
10000005-52 = "[ns] \"벚꽃 축제, 그리고 백야당이라…….\""
10000005-55 = "(그리하여 축제가 열리는 백귀야행 거리에 도착했다.)"
10000005-59 = "백귀야행 제7번 상점가"
10000005-60 = "(한창 열기를 더하고 있는 축제 분위기, 축제를 즐기는 사람들로 가득한 거리 속에서,)"
10000005-61 = "(갑작스럽게 어떤 목소리가 들려왔다.)"
10000005-63 = "앗, 위, 위험해요?!"
10000005-68 = "아야얏……."
10000005-70 = "헉!"
10000005-75 = "앗앗! 저, 저기, 괜찮으세요? 다치신 데는 없나요?!"
10000005-76 = "[s6] \"으음, 괜찮긴 한데. 한눈팔아서 미안해.\"\n[s7] \"어딘가 부러진 거 같기도…….\""
10000005-78 = "후우, 하아, 다행이다~"
10000005-80 = "네헷?!"
10000005-81 = "[s8] \"뭐……, 농담이지만.\""
10000005-83 = "네에엣?! 노, 농담……? (갸웃)"
10000005-84 = "거기~서! 놓치지 않는다앗!"
10000005-86 = "자, 잠깐만요. 카, 카에데 쨩. 하아…… 하아…… 너, 너무 빨라요……"
10000005-88 = "앗, 벌써 여기까지!"
10000005-90 = "이크, 으, 으으으음! 어, 어떡하지?!"
10000005-91 = "[s] \"혹시……. 도움이 필요해?\""
10000005-93 = "네……? 앗, 그게. 그러니까."
10000005-94 = "찾았다! 저기야! 미모리 선배!"
10000005-98 = "앗……!"
10000005-101 = "(그렇게 한참을 달려 자리를 빠져나올 수 있었다.)"
10000005-104 = "아……. 여기면 안전하겠네요!"
10000005-105 = "그, 이즈나를 도와주셔서 감사합니다! (쫑긋쫑긋)"
10000005-106 = "그런데, 당신은……."
10000005-107 = "백귀야행의 학생이 아닌, 외지인……, 그것도 어른……? (꿀꺽)"
10000005-108 = "[s] \"샬레 소속으로 선생님 일을 하고 있어.\""
10000005-109 = "샬레의 선생님……?"
10000005-110 = "아, 샬레라면 혹시……!"
10000005-111 = "이즈나! 들어본 적 있어요!"
10000005-112 = "키보토스에서 여러 가지 각종 어려운 사건을 멋지게 해결하는, 굉장한 어른이 있다고!"
10000005-113 = "와아, 그건 마치…… 닌자 같네요!"
10000005-114 = "[s] \"……닌자?\""
10000005-115 = "진짜 선생님이라니. (쫑긋) (흔들)"
10000005-120 = "우와, 와~"
10000005-121 = "앗, 그런데, 샬레의 선생님이 여긴 어쩐 일이신가요?"
10000005-122 = "[s] \"축제를 구경하러 왔어.\""
10000005-123 = "과연……, 그런 거군요! 그럼 잘됐어요!"
10000005-126 = "그럼 이즈나가 축제를 안내해드릴게요! (쫑긋)"
10000005-129 = "보세요. 저기. 노점에선 백귀야행의 명물 여우여우 센베이를 팔고 있구요!"
10000005-131 = "또, 저기! 이번 축제에서 빼놓을 수 없는 너구리 오코노미야키도 팔고!"
10000005-132 = "벚꽃잎으로 만든 벚꽃 찹쌀떡도 엄청 엄청 맛있어요!"
10000005-133 = "에헤헷, 축제의 별미니까요!"
10000005-137 = "아참, 그리고 모처럼 오셨으니까."
10000005-138 = "이번 백야앵제에서 빼놓을 수 없는 자랑이 있어요!"
10000005-139 = "여기, 이쪽이에요. 선생님!"
10000005-144 = "백귀야행 전망대"
10000005-148 = "[ns9] \"……굉장하네.\"\n[ns10] \"저렇게나 커다란 나무라니.\""
10000005-149 = "에헤헷, 그렇죠? 백귀야행의 자랑이니까요!"
10000005-150 = "에헤헷, 그렇죠? 백귀야행의 자랑이니까요!"
10000005-151 = "저 이즈나, 신목과 백귀야행의 거리가 한눈에 들어오는 이곳을, 무척 좋아해요!"
10000005-152 = "여기서 이렇게 거리를 바라보고 있으면 이즈나의 가슴이 무지무지 뜨거워지거든요!"
10000005-153 = "[s] \"가슴이 뜨거워져?\""
10000005-154 = "네! 이즈나에겐 꿈이 있어요!"
10000005-155 = "이 거리에서 제일가는 닌자가 된다는 꿈이……!"
10000005-156 = "지금도 그 꿈을 위해서 매일 같이……!"
10000005-157 = "[s] \"……닌자?\""
10000005-158 = "핫?!"
10000005-159 = "아, 그러니까. 닌자라는 건, 그러니까……!"
10000005-160 = "[s11] \"잘은 모르겠지만, 멋진 일이네.\"\n[s12] \"이즈나는 꿈이 있다는 거잖아? 응원할게.\""
10000005-161 = "네?"
10000005-162 = "네?"
10000005-163 = "선생님이, 이즈나의 꿈을……. 응원……."
10000005-164 = "그……. 닌자가 되고 싶다는……."
10000005-165 = "그런……. 꿈도 말인가요?"
10000005-166 = "[s] \"그야 선생으로서 학생을 응원하는 건 당연한 일이니까.\""
10000005-167 = "……!"
10000005-168 = "우아앗! 그렇게 말씀해주신 건, 선생님이 처음이에요!"
10000005-169 = "에, 에헤헷, 그, 그렇군요!"
10000005-170 = "선생님께서 이즈나의 꿈을 응원해준다면!"
10000005-171 = "으무웃, 방금 전엔 조금 실패해버렸지만! 네엣!"
10000005-172 = "네! 이즈나! 열심히 노력해서 훌륭한 닌자가 되겠어요!"
10000005-173 = "앗! 그럼 이러고 있을 때가 아니다! 아직 고용주의 의뢰가 남아있으니까요!"
10000005-174 = "이즈나는 먼저 가보겠습니다!"
10000005-175 = "그럼 선생님. 나중에 또!"
10000005-176 = "의뢰가 끝나면, 또 같이 축제를 즐겨요!"
10000005-178 = "(이즈나는 그렇게 나타났을 때와 마찬가지로 바람처럼 사라졌다.)"
