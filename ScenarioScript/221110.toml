221110-109 = "3;사나에;02;선생님, 계십니까?\n#3;sig"
221110-110 = "3;사나에;03;늦은 시간에 실례했습니다. 지난 번에 인사드렸던 오디세이아의 선의, 후나모리 사나에입니다.\n#3;sig\n#3;greeting"
221110-111 = "3;사나에;02;잠시, 통화 괜찮으신지요?\n#3;sig\n#3;em;[?]"
221110-112 = "[s5] \"아, 사나에 쨩. 물론 기억하고 있지.\"\n[s6] \"갑자기 이 시간에 무슨 일이야?\""
221110-115 = "3;사나에;10;갑자기 전화를 드린 이유는 다름이 아니라……\n#3;sig\n#3;em;[...]"
221110-116 = "3;사나에;08;선생님께서 급히 봐주셨으면 하는 사안이 발생했기 때문입니다.\n#3;sig"
221110-117 = "[s] \"설마 아픈 학생이라도 생긴 거야?\""
221110-118 = "3;사나에;19;아픈 것은 맞지만…… 대상이 학생은 아닙니다.\n#3;sig"
221110-119 = "3;사나에;02;바로 단도직입적으로 말씀드리자면.\n#3;sig"
221110-121 = "#na;사나에;……선생님. 새미의 수명이 얼마 남지 않은 것 같습니다."
