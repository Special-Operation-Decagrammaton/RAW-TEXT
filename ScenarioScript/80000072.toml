[translation]
80000072-1 = "따듯한 마음"
80000072-2 = "대성당 외곽 비밀 길"
80000072-3 = "(조금 한산해진 시간에 맞춰 성당을 찾아갔다.)"
80000072-10 = "흥~. 흥흥흥~. 흥흥~~."
80000072-11 = "오늘의 정리도 거의 다 끝나가네요. 깔끔해진 성당을 보니 괜히 즐거운 기분인걸요?"
80000072-12 = "그런데 왠지 기시감이……. 뭔가 이런 느낌이 들 땐 항상 선생님께서 오셨던 느낌도……?"
80000072-13 = "[s1] \"그 말대로야, 히나타.\"\n[s2] \"전보다 감이 많이 좋아졌네.\""
80000072-19 = "어……. 어라?"
80000072-20 = "어라……? 선생님……!? 지, 진짜로 계셨을 줄은……!!"
80000072-21 = "그, 그럼 방금 말도 모두 들으신 건가요……? 흥얼거린 콧노래까지……? 부, 부끄럽게……!!"
80000072-22 = "……네? 즐겁게 일하고 있는 것 같아서 보기 좋았다고요?"
80000072-23 = "그, 그런가요? 그럼 다행이지만……."
80000072-24 = "그런데 선생님……. 오늘은 또 어쩐 일로 여기까지……."
80000072-25 = "……아. 발렌타인 데이……."
80000072-26 = "헉. 그, 그러네요. 오늘은 발렌타인 데이였군요. 전 그런 줄도 모르고……!!"
80000072-27 = "죄, 죄송해요. 선생님! 제가 이런 날은 미리 챙겨서 준비했어야 하는데, 일하느라 정신이 팔려서……!!"
80000072-28 = "[s3] \"그런 의미로 한 말이 아냐.\"\n[s4] \"히나타는 지금대로가 좋은걸.\""
80000072-29 = "마, 말씀은 감사하지만……. 그래도……. 오늘 같은 날인데……."
80000072-30 = "마, 말씀은 감사하지만……. 그래도……. 오늘 같은 날인데……."
80000072-34 = "……아! 자, 잠시만요!! 잠시만 기다려 주세요!!"
80000072-41 = "……후우. 찾았다!! 선생님! 부, 부디 이거라도!!"
80000072-46 = "[ns5] \"어린이용 초코볼!?\"\n[ns6] \"초코볼 세트다!\""
80000072-47 = "네. 맞아요. 실은 성당에 찾아오는 아이들을 위해 구비해 놓은 것들이에요."
80000072-48 = "네. 맞아요. 실은 성당에 찾아오는 아이들을 위해 구비해 놓은 것들이에요."
80000072-49 = "네? 아, 괜찮아요. 아직 많이 있으니까요. 사실 맛도 8가지나 더 있지만, 선생님께서 좋아하실 만한 것 몇 가지만 골라 온 거예요."
80000072-50 = "네? 맛을 다 알고 있냐고요? 네. 전부 먹어봤거든요. 아이들 성격이나, 취향에 맞게 주려면 저도 잘 알아야 하니까요."
80000072-51 = "저, 실은……. 초코는 그다지 취향이 아니지만요. 하하하……."
80000072-52 = "[s] \"히나타는 참 자상하구나.\""
80000072-53 = "그, 그런……. 아니에요. 고작 이런 걸로……!! 자, 자상하다니……."
80000072-54 = "초, 초코볼은 입맛에 맞으실까요? 제가 제대로 골라온 게 맞았으면 좋겠는데……!"
80000072-55 = "……네? 아, 다 좋아하시는 종류라고요?"
80000072-56 = "다행이다……. 안심했어요."
80000072-57 = "휴우……."
80000072-61 = "……후후."
80000072-63 = "(이후 히나타와 함께 어린이용 초코볼을 나눠 먹으며 시간을 보냈다.)"
