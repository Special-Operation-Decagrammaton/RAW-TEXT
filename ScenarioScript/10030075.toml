[translation]
10030075-18 = "……어라, 이게 무슨 소란이지?"
10030075-19 = "일출을 보고 오는 사이에 주변에 새로운 텐트가 잔뜩 늘어났어."
10030075-20 = "그사이에 갑자기 새로운 캠핑 붐이라도 일어난 걸까요……?"
10030075-21 = "[s] \"글쎄……\""
10030075-26 = "안녕하세요, 크로노스 채널 시청자 여러분! 긴급 편성 취재 다큐멘터리, <걸어서 역사 속으로>의 진행자 카자마키 마이입니다!"
10030075-27 = "오늘 저희는 이곳 히가시알프스에서 새로운 유적이 발견되었다는 소식을 듣고 급히 취재를 나왔는데요!"
10030075-28 = "그새 SNS를 통해 소문이 퍼져 나갔는지, 새해 첫날인데도 불구하고 이곳 캠핑장에는 유적을 탐사하려는 사람들이 잔뜩 모여 있습니다!"
10030075-29 = "과연 이번에 발견된 유적이 앞으로 키보토스 고고학에 어떤 영향을 끼칠지 귀추가—"
10030075-33 = "어라? 저 사람은……"
10030075-34 = "시청자 여러분! 말씀드리는 순간. 키보토스에서 제일 뜨거운 명사, [USERNAME] 선생님의 모습이 카메라에 포착되었습니다!"
10030075-35 = "지금부터 샬레의 선생님을 모시고 긴급 인터뷰를 진행하도록 하겠습니다!"
10030075-39 = "안녕하세요, [USERNAME] 선생님! 크로노스 채널입니다!"
10030075-40 = "[s1] \"다들 안녕!\"\n[s2] \"마이도 새해 복 많이 받아.\""
10030075-43 = "물론이지요! 새해 첫날부터 이런 특종……"
10030075-44 = "아니, 선생님을 뵙게 되어서 정말 운이 좋다고 생각하고 있었답니다!"
10030075-45 = "그나저나 [USERNAME] 선생님께서도 이곳에 계신 걸 보니……"
10030075-46 = "역시, 이번에 새로 발견된 유적은 엄청난 가치를 지닌 물건인 게 틀림없군요!"
10030075-47 = "[s3] \"……새로 발견된 유적?\"\n[s4] \"무슨 소리인지 잘 모르겠는데……\""
10030075-50 = "어라? 못 들으셨나요?"
10030075-51 = "이곳 히가시알프스에 있는 자연 동굴에서 새로운 고대 벽화가 발견되었다며, SNS상에서 지금 엄청난 화제가 되고 있는데요……"
10030075-58 = "사냥이나 채집을 주로 다룬 기존의 동굴 벽화와는 달리, 이번 벽화에는 거대한 탑이나 기계 장치처럼 보이는 오파츠들이 잔뜩 묘사되어 있다고 합니다!"
10030075-62 = "심지어 탑 위에는 흉측한 모습의 괴물이 묘사되어 있기도 한데요……"
10030075-63 = "그 괴물 그림을 본 몇몇 사람들이 '종말의 예언'이라며 연초부터 거리에서 난리를 피워 D.U.에서는 작은 소동이 일어난 모양입니다."
10030075-65 = "그래서, 샬레의 선생님께서는 이번 발견을 어떻게 생각하시나요?"
10030075-69 = "[ns] \"………마키.\""
10030075-73 = "내, 내 잘못 아니거든?!"
10030075-74 = "물론 그 벽화를 그린 사람은 내가 맞지만……"
10030075-75 = "분명 어제 동굴을 떠나기 전에 벽화는 깨끗이 지워 두라고 했을 텐데……"
10030075-76 = "하, 하지만 그때는 코타마 선배를 찾느라 정신이 없어서 깜박했는걸……"
10030075-77 = "게다가 솔직히 말하자면……"
10030075-81 = "그만큼 내 그림이 인상적이었다는 뜻 아닐까?"
10030075-88 = "조금이라도 반성하는 모습을 보여!"
10030075-90 = "(이후, 사람들에게 마키가 그린 벽화의 정체에 대해 해명하느라 한동안 애를 먹었다……)"
