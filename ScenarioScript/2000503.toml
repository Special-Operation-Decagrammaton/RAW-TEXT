[translation]
2000503-1 = "안전 주행 주의"
2000503-2 = "보충수업부 비품 <크루세이더 쨩> 내부"
2000503-4 = "으음, 이 근처는 도로 사정이 나빠서 그런지 전차가 많이 흔들리네요."
2000503-5 = "선생님, 전차의 난간에 부딪히지 않게 주의하세요."
2000503-6 = "난간의 뾰족한 부분에 긁히면 다칠 수도 있다고 하거든요."
2000503-7 = "저도 전차를 탈 때만큼은 넘어져도 다치지 않도록 두꺼운 옷을 입으려 해요."
2000503-8 = "[s] \"……그런데 어째서 지금은 수영복을 입고 있는 거야……?\""
2000503-9 = "네? 그야 지금부터 해변에 간다고 했으니까요."
2000503-10 = "지금 가는 해변은 워낙 외진 곳에 있어서 주변에 마땅히 옷을 갈아입을 만한 곳이 없거든요."
2000503-11 = "게다가 바다에 빨리 뛰어들고 싶은 마음을 참을 수가 없어서, 미리 숙소에서 수영복으로 갈아입어 버렸어요!"
2000503-12 = "[s] \"수영복을 입고 전차를 탄다니, 뭔가 이상한 느낌이네.\""
2000503-13 = "아하하…… 선생님께서 그렇게 말씀하시니 뭔가, 새삼 부끄럽네요……."
2000503-14 = "하지만 전차 안이라면 밖에서 보이지 않는 데다가……"
2000503-15 = "선생님이 골라준 수영복이니까, 선생님께 수영복 차림을 보이는 건 신경 쓰지 않아요!"
2000503-16 = "자…… 그럼 바다를 향해, 조금 더 속도를 내볼까요?"
2000503-19 = "아, 드디어 도착한 것 같아요."
2000503-20 = "선생님, 밖으로 나와보세요!"
2000503-24 = "무이가하마 해변"
2000503-25 = "바다다~"
2000503-26 = "[s] \"바다다!\""
2000503-27 = "후후, 이렇게 도착해서 바다를 직접 보니 좋네요."
2000503-28 = "바로 바다로 뛰어들고 싶은 마음이 굴뚝같지만……"
2000503-29 = "매뉴얼에 따라 전차를 정차시키기 전에 먼저 선생님께서 고임목을 설치해 주시겠어요?"
2000503-30 = "[s] \"알겠어.\""
2000503-36 = "[ns] \"이제 나와도 괜찮아.\""
2000503-37 = "네. 그럼 저도 곧 나갈게요!"
2000503-39 = "영차……."
2000503-40 = "……어라? 방금 뭔가 찢어지는 소리가……"
2000503-41 = "으햣?!"
2000503-45 = "[ns] \"무슨 문제라도 있어?\""
2000503-49 = "찢어졌어요……."
2000503-50 = "[s] \"……뭐가?\""
2000503-51 = "수영복의 뒤쪽이…… 전차의 난간에 걸려 찢어졌어요……."
2000503-52 = "[ns] \"수영복이 찢어졌다고?!\""
2000503-53 = "쉿! 쉬잇! 조용히 말해주세요!"
2000503-54 = "어, 어, 어쩌죠, 선생님?! 이대로는 돌아갈 수 없게 되어버려요!"
2000503-55 = "들뜬 나머지 숙소부터 수영복을 입고 오느라, 갈아입을 옷도 챙겨오지 않았는데……."
2000503-56 = "[s] \"가까운 의류점에 가서 옷을 사올게.\""
2000503-57 = "무리예요…… 이 근처에는 의류점은 커녕 편의점도 없는 걸요."
2000503-58 = "이, 이렇게 된 이상 전차를 타고 다시 숙소로 돌아가야 겠어요!"
2000503-62 = "[ns] \"잠깐, 아직 고임목이……!\""
2000503-65 = "우, 우앗? 전차 궤도가……?"
2000503-67 = "……."
2000503-68 = "선생님, 혹시 전차 궤도 수리하는 법 알고 계신가요……?"
2000503-69 = "[s1] \"무리야…….\"\n[s2] \"히후미의 숙소까지 걸어서 다녀올게.\""
2000503-70 = "……죄송해요. 부탁드릴게요……."
2000503-71 = "……죄송해요. 부탁드릴게요……."
2000503-73 = "(결국 한 시간이 넘는 거리를 걸어서 히후미의 교복을 직접 가져왔다.)"
2000503-74 = "(도중에 여학생의 교복을 들고 가는 변태로 오인되어 검문을 받고 말았다…….)"
