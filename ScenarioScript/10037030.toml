[translation]
10037030-1 = "제3화;패왕이 여인과 이별하는구나."
10037030-3 = "으음……. 조금 전부터 뭔가, 금속 악기 소리 같은 게 계속 울리고 있는데, 토모에?"
10037030-4 = "생소하게 느껴진다면, 양해를 부탁하지. 체리노 서기장. 이것은 우리 산해경의 전통 음악극이다."
10037030-5 = "우, 우왓?! 키사키 문주인가……?! 으음, 뭐어. 전통 음악극이라면 어쩔 수 없지. 으음!"
10037030-6 = "그건 그렇고 참 특이한 선율이로군."
10037030-7 = "귀가 좀 아플 정도야……."
10037030-8 = "전통 음악극이라고 했는데, 저 신기한 옷을 입은 사람들은 뭐지?"
10037030-10 = "말하자면 배우들이다. 이 음악극은 하나의 커다란 이야기를 악곡에 담아, 모두의 앞에서 공연을 여는 것이니."
10037030-11 = "우리 산해경에서는 이 음악극을 경극이라고 부르고 있노라."
10037030-12 = "경극……?"
10037030-13 = "자, 공연이 시작되려 하는구나. 부디 마음껏 즐기기를 바란다."
10037030-24 = "한 번 웃으면 온 세상이 봄이요, 한 번 흐느끼면 만고에 수심이 가득하니."
10037030-26 = "인간의 삶은 무상하여 봄날의 꿈과 같도다."
10037030-28 = "푸른 산에 두견새가 울고, 백합화 핀 나무 저 멀리 연기가 피어오르니."
10037030-33 = "어떻게 저 구름이 하늘을 감히 떠나겠는가!"
10037030-38 = "목소리가…… 엄청나게 높아!"
10037030-39 = "한정된 공간에서 멀리까지 소리를 들리게 하려다 보니 말이지. 저런 창법이 발달하게 된 것이다."
10037030-40 = "왜 저렇게 손끝을 빙글빙글 돌리는 거야? 같은 자리를 원처럼 돌기도 하고?"
10037030-41 = "경극의 모든 움직임에는 나름의 의미가 숨겨져 있지만…… 그것을 하나하나 이야기하는 것도 흥을 깨는 일이겠지."
10037030-42 = "몇 가지 정도만 미리 알아 두면, 감상에 도움이 될 게다. 가령 말채찍으로 허공을 때리는 시늉을 한다면, 그 인물이 말을 타고 어딘가로 달려간다는 것이지."
10037030-43 = "한 자리를 원을 그리며 도는 것은, 아주 먼 거리를 여행하며 나아갔다는 의미이고."
10037030-44 = "간혹 갑옷을 입은 자가 등 뒤에 깃발을 꽂고 나온다면…… 그것은 수천, 수만의 군대와 함께 나아왔다는 것이다."
10037030-46 = "으음……. 뭔가, 영화처럼 있는 그대로 거대하게 보여줬으면 더 좋았을 텐데."
10037030-47 = "후후. 예전에는 그렇게 큰 소품과 장치를 사용하기 어려웠으니 말이다."
10037030-52 = "들판에서 일어나 세력을 잡고."
10037030-53 = "삼 년 만에 다섯 제후를 이끌고 낡은 나라를 멸했다."
10037030-54 = "마침내 천하를 둘로 나누어 갈랐거늘."
10037030-55 = "어찌하여 하늘은 이 몸을 나아가게 하지 못하는가!"
10037030-61 = "저거, 저거! 지금 가면 쓰고 나온 사람! 뭔가 멋있는데?"
10037030-62 = "음. 이번 공연의 주인공에 해당한다고 볼 수 있는 인물이지."
10037030-63 = "이 극은 저 인물을 중심으로 이야기가 전개될 터이니, 저 주인공에게 주목하여 보는 것도 좋을 것이다."
10037030-69 = "긴 막대 같은 걸 꺼내 들었어……. 아하, 창이구나!"
10037030-71 = "자고로 병가의 승패는 기약할 수 없는 것이니."
10037030-72 = "부끄러움을 참는 것도 사람의 일입니다."
10037030-73 = "세상의 인재 중에는 우수한 자가 많았으니."
10037030-74 = "언젠가 흙먼지를 일으키며 돌아올 수도 있지 않겠습니까?"
10037030-76 = "수없이 싸워 피로함에 사람들의 사기는 떨어졌고."
10037030-77 = "중원에서 크게 패하니 대세를 돌이키기 어렵게 되었습니다."
10037030-78 = "우수한 자가 여태껏 남아 있다 하더라도."
10037030-79 = "과연 군왕과 더불어 흙먼지를 일으키며 올 리가 있겠습니까?"
10037030-81 = "저 녀석들, 무슨 말을 하는 거야! 좋은 말만 해도 모자랄 판에!"
10037030-82 = "나 같았으면 모조리 숙청이다! 숙청!"
10037030-84 = "으, 으음……! 간언을 하는 것도 충의의 한 방식이라는 말도 있으니 말이다……?"
10037030-85 = "그런 거 몰라! 전부 볕이 들지 않는 화장실에서 2주간 청소형이다!"
10037030-86 = "(숙청이라는 말이 갖는 무게에 비하면 자비롭구나. 이것이 붉은겨울의 독재자라 불리는 자의 그릇인가?)"
10037030-91 = "힘은 산을 뽑고, 기개는 세상을 덮었도다."
10037030-92 = "하지만 시운이 불리하니, 말이 나아가지 않는구나."
10037030-93 = "말이 나아가지 아니하니, 이 몸은 어찌해야 하는가."
10037030-98 = "그대여, 그대여. 그대를 어찌하면 좋은가!"
10037030-99 = "적이 이미 천하를 다 차지하였으니."
10037030-100 = "사방에 들려오는 것은 먼 곳의 노랫소리."
10037030-101 = "대왕의 의기가 이미 다하셨다 하면."
10037030-102 = "이 천한 몸이 살아서 무엇하겠습니까."
10037030-108 = "어, 어어? 뭐, 뭐 하는 거야. 지금? 주인공에게 먼 곳을 바라보게 하고…… 주인공의 칼을 뽑아 들었어?"
10037030-109 = "그리고 그 칼을 자기 목으로……?! 안 돼! 살아도 같이 살아야지! 그렇게 해 버리면…… 남은 사람들은 뭐가 되는데!"
10037030-111 = "으으……. 결국 군사들도 모두 헤어지고……. 남은 건 혼자……."
10037030-112 = "그런데도 뒤쫓는 건 수천의 적병들……."
10037030-114 = "내 목을 천금과 만호의 봉지로 사려 한다고 했느냐."
10037030-118 = "그렇다면 내 그대들에게 은혜를 베풀어 주겠노라!"
10037030-125 = "으아앗?!"
10037030-126 = "으으…… 훌쩍……. 말도 안 돼……. 그렇게 위엄 넘쳤는데……."
10037030-127 = "위엄만으로는 천하를 다스릴 수 없고, 용맹만으로는 사람의 마음을 얻을 수 없었다는 것이겠지."
10037030-128 = "천명이 이와 같으니, 사람이 할 수 있는 일은 단지 분발하며 겸양할 뿐……."
10037030-129 = "그 정도는 나도 안다고! 하지만, 하지만……."
10037030-130 = "으으, 이렇게까지 이 몸의 마음을 움직이게 하다니. 인정할 수밖에 없군! 좋은 공연이었다!"
10037030-131 = "흡족하였다니 기쁘구나. 다행이로다."
10037030-134 = "그러면, 체리노 서기장. 다음 순서로 넘어가도록 하지. 이어서–"
10037030-135 = "그 전에 잠깐! 붉은겨울 연방학원 서기장의 이름으로, 요청하고 싶은 것이 있다!"
10037030-139 = "(여기에서 서기장의 이름으로 요청이라……? '성대한 환영'의 영수증인가? 아니, 그 패를 지금 내보이는 것은 성급한 선택일 터.)"
10037030-140 = "(일단은 계속해서 들어보아야겠구나. 어차피 상황과 명분을 고려한다면, 거절한다는 선택지는 없을 것이니.)"
10037030-141 = "(오히려 붉은겨울의 패를 하나 엿볼 수 있다는 점에서는, 차라리 잘된 일일지도 모른다.)"
10037030-142 = "무엇인가? 현룡문의 문주로서, 가능한 요청이라면 무엇이든 응하도록 하지."
10037030-143 = "그렇다면…… 조금 전 있었던 공연 말이다만!"
10037030-144 = "경극 말인가?"
10037030-145 = "그래, 그거! 경극인지 뭔지 하는 그거!"
10037030-146 = "그 공연의 주인공 역을 맡았던 학생을, 이 자리에 불러 줘!"
10037030-147 = "카구야를……? 어찌하여……?"
10037030-148 = "카구야라고 하는 이름인가…… 그렇군! 뭔가 이야기를 나눠 보고 싶어졌어!"
10037030-149 = "(……종잡을 수 없는 요구로구나. 허나, 이 역시 또 하나의 심리전 같은 것일 가능성도…… 배제할 수는 없다.)"
10037030-151 = "서기장님께서 경극이 상당히 마음에 드셨던 모양입니다. 결례가 되지 않는다면, 부탁드릴 수 있을까요. 문주님?"
10037030-156 = "그러도록 하지. 미나. 부탁하마."
10037030-157 = "예. 문주님."
10037030-165 = "부르셨습니까, 문주님! 우루시바라 카구야, 인사 올리겠습니다! 한달음에 달려왔습죠!"
10037030-167 = "음. 왔는가. 카구야. 그러면…… 소개하도록 하지. 체리노 서기장. 이쪽이 만남을 요청했던 카구야다. 경극부의 부장을 맡고 있지."
10037030-168 = "그리고 카구야. 이쪽은 체리노 서기장이다. 이번 붉은겨울의 학생회장이시지. 이번 교류회를 기념한 경극, 수고 많았노라."
10037030-170 = "안녕하십니까, 체리노 서기장님! 보잘것없는 저희들의 공연을 감명 깊게 보아주셨다니, 진심으로 감사드립니다. 정말로 기쁘기 그지없네요!"
10037030-171 = "오, 오오……! 무대에서는 그렇게 위압감이 넘쳤는데, 완전히 인상이 달라졌어!"
10037030-172 = "그것은 또 다른 의미의 칭찬이시군요! 저희 같은 학생들은 이런저런 배역을 많이 연기하다 보니 말이죠."
10037030-173 = "가끔 어떤 게 자기 진짜 얼굴이고, 어떤 게 자기 진짜 성격인지 가끔 헷갈리기도 한다니까요!"
10037030-174 = "그런가! 그건 어떤 의미로 편리하고…… 어떤 의미로는 귀찮겠구나!"
10037030-175 = "거기에서 그런 부분을 말씀하시다니, 날카로우시네요! 감탄했습니다!"
10037030-182 = "그러면 문주님. 저희는 이제 본 의제로 들어가고 싶습니다만."
10037030-187 = "(흠……? 이 토모에라는 자에게 교섭을 맡기는 것인가, 체리노 서기장? 붉은겨울의 통치 구조가 어떻게 되어 있는지, 확인해 볼 필요가 있겠군.)"
10037030-188 = "(그것이 아니라면…… 혹시 그것인가? 통치자 본인은 아무 행위를 하지 않고서도 천하를 다스린다는, 무위지치(無爲之治)의 경지……?)"
10037030-189 = "(……일단은 계속해서 대화를 나누어 보는 편이 좋겠구나.)"
10037030-193 = "그러도록 하지. 토모에 비서실장."
10037030-196 = "변검술? 그건 또 뭐야?"
10037030-197 = "경극과는 조금 다른, 천극에서 볼 수 있는 기법입니다. 간단히 말씀드리자면, 얼굴에 손을 대지 않고, 상황과 분위기에 맞춰 가면을 바꿔 쓰는 기술이죠!"
10037030-198 = "뭔가, 말만 들어도 멋진데?! 끝내준다!"
10037030-199 = "산해경의 3대 연희라고 하면 경극, 천극, 곤극이라고 하여 세 가지의 연극을 이야기하곤 하죠. 이 3대 연희의 공통점은…… 무술을 우선 배워야 한다는 겁니다!"
10037030-200 = "무술……? 연극을 하는데?"
10037030-201 = "이상하죠? 그렇지만 그게 사실이니 어찌하겠습니까? 이미 보셨던 경극에서도, 저희 단원들이 훌륭한 창술을 선보이지 않았습니까?"
10037030-202 = "이제 와서는 무술이라기보다는 기예에 조금 더 가까워지기는 했지만요!"
10037030-203 = "듣고 보니, 확실히……!"
10037030-208 = "좀처럼 외부로의 문을 열지 않던 산해경 고급중학교에서, 저희 붉은겨울 연방학원에 먼저 손길을 내밀어 주신 것에는 무한한 감사를 드립니다."
10037030-209 = "하지만 그와 동시에, 산해경과 현룡문의 무거운 문을 여시는 데에는 그만한 뜻과 의중이 있으실 것이라 생각하는데요. 아닌가요?"
10037030-210 = "두 가지만 정정하고 싶구나. 우선, 산해경의 문은 그대가 생각하는 것만큼 무겁지 않도다. 현무상회는 이미 키보토스 유수의 음식 거리로 유명하지 아니한가?"
10037030-211 = "두 번째로, 현룡문에 외부의 출입이 없었던 것도 아니다. 이미 그대 역시 익히 알고 있겠지만, 선생의 존재가 있지 않은가."
10037030-212 = "[s1] \"네. 지금까지 같은 자리에 있었지만.\"\n[s2] \"잊히기 직전이었던 선생님입니다.\""
10037030-215 = "우후후. 그랬었지요. 선생님. 아쉽네요. 조금 더 다른 자리였다면 조금 더 다른 방식으로 선생님과의 시간을 즐길 수도 있었을 텐데."
10037030-216 = "후후. 그것은 나 역시 마찬가지이겠군. 너무 서운해하지 말아 다오. 선생."
10037030-217 = "[s3] \"괜찮아, 괜찮아…….\"\n[s4] \"진짜로 괜찮으니까, 편하게 이야기들 나눠.\""
10037030-220 = "어머나. 저는 문주님 덕택에 이보다 더 편한 자리를 경험해 본 적이 없는 기분을 느끼고 있는걸요."
10037030-221 = "그렇게 받아들여 준다면 안심이로다. 허나 아무리 그렇다고 한들, 자기 자신의 학원만큼의 안락함을 제공하기란 힘들겠지. 양해를 부탁하마."
10037030-222 = "그럼에도 저는 키사키 문주님께서, 이번 교류회를 맞아 어떠한 요구사항이 있으실 것이라 짐작하고 있습니다."
10037030-223 = "갑작스럽게 무례한 말로 들릴 수 있는 이야기를 꺼낸 것을 용서해 주시기를."
10037030-224 = "아니다. 오히려 직접적으로 본론을 이야기해 주어서 감사를 표해야겠구나."
10037030-225 = "그리고 그대의 짐작과 물음에 대답하자면…… 그런 것은 없다."
10037030-229 = "문주님……?"
10037030-230 = "또다시 외람된 말씀을 드리게 되는 것 같아 죄송합니다만, 저는 여기에서 한 번 더 문주님과 현룡문의 저의를 짐작하는 수고를 들이고 싶지 않습니다."
10037030-231 = "그렇기에 무례함을 무릅쓰고, 마리나 위원장을 잠시 물러나게 하면서까지 문주님께 직접 이야기의 장을 청한 것이고요."
10037030-233 = "그렇지. 나 역시 집행부장인 미나를 물리고 이 자리에 참여하였다. 여기에서 무언가를 숨기거나 감출 이유는, 전혀 없다는 뜻이기도 하지."
10037030-234 = "[s5] \"응. 끼어드는 것 같아서 미안하지만.\"\n[s6] \"지금의 키사키는 문주…… 학생회장으로서 말하고 있는 거야.\""
10037030-237 = "시의적절한 조언, 감사하지. 선생."
10037030-238 = "다시 한번 이야기하마. 그대들에게 특별히 요구하는 것은 없다. 그대들이 행하여 주었으면 하는 것도 없으며, 그대들로 하여금 무언가를 도모하려는 의도 역시 없다."
10037030-240 = "그렇다면, 어째서 이번의 교류회를……?"
10037030-245 = "그대들에게 산해경을 보여 주고 싶어서, 라는 대답으로는 부족하겠는가?"
10037030-246 = "부족하지는 않지만, 충분하다고도 말씀드리기 어려운 대답이시군요."
10037030-247 = "그렇게 느꼈다면 나의 언변이 부족했다는 뜻이 되겠지."
10037030-248 = "……진심이시군요?"
10037030-249 = "그래. 진심이다. 굳이 그대들에게 부탁하자면……. 그렇구나. 산해경의 이곳저곳을 유람하며, 속속들이 산해경과 만나 주었으면 한다."
10037030-250 = "'산해경과 만나 주었으면 한다'는 말씀은, 무슨 의미이신지……?"
10037030-251 = "후후. 그것이야말로 나의 저의를 짐작해 주었으면 하는 부분이다만?"
10037030-252 = "어머나. 여기에서 그 말을 그렇게 되돌려주실 줄은."
10037030-253 = "무얼. 우리 산해경의 중요한 전통 중 하나에는, 보은(報恩)이라는 개념이 포함되어 있으니 말이다."
10037030-254 = "우후후. 그렇군요."
10037030-255 = "후후. 그러하다."
10037030-260 = "진짜? 입으로 불을 뿜어낼 수도 있단 말이냐?"
10037030-261 = "네! 그 기술은 토화(吐火)라고 하며, 무대가 어두울수록 빛을 발하죠! 무대를 어둡게 하는 방법에는 또 몇 가지 비밀리에 전해지는 비법들이 있는데요–!"
10037030-262 = "듣다 보니 느끼는 것이지만, 정말로 산해경에는 비밀이 많군!"
10037030-263 = "그러려나요~? 하긴, 역사와 비밀은 비례하는 경우가 많다고도 하니까요!"
10037030-265 = "성대한 환영, 다시 한번 감사드립니다. 문주님."
10037030-266 = "음, 아주 만족스러웠다! 정말로 즐거웠어. 쿠데타를 걱정할 필요도 없고 말이지!"
10037030-268 = "후후. 다행이구나. 이대로 계속해서 산해경을 즐겨 주었으면 한다."
10037030-269 = "그리고……. 여기에서부터는, 선생의 힘을 빌리고 싶다만?"
10037030-270 = "[s] \"어? 나?\""
10037030-271 = "그러하다. 선생이라면 믿을 수 있는 데다, 붉은겨울의 방문단과도 이미 알고 있는 기색이었으니 말이다."
10037030-272 = "호위로 미나를 같이 보내도록 하지. 잘 부탁하마."
10037030-273 = "[s] \"그렇지만 키사키는 같이 가지 않는 거야?\""
10037030-274 = "……으음. 매우 실례되는 일이라는 것은 알고 있지만, 그렇게 해야 할 것 같구나."
10037030-275 = "이유를 여쭈어보아도 될까요. 문주님?"
10037030-276 = "미안하구나. 도저히 피할 수 없는 사정이 있기 때문에, 라고 밖에는 답할 수 없도다."
10037030-277 = "……그렇군요. 알겠습니다. 그러면 미나 집행부장과 선생님께 조금 더 의지하도록 하죠."
10037030-279 = "오, 콤라드도 함께인 건가? 그렇다면 더 좋지! 콤라드! 콤라드도 산해경은 처음이야?"
10037030-280 = "[s] \"뭐…… 정확히 말하자면, 처음은 아니긴 하지?\""
10037030-281 = "그렇지만 산해경에 대해서 잘 모르는 건, 이 몸과 같은 거지?"
10037030-282 = "역시 그런가! 좋았어. 이왕 이렇게 된 거, 여기저기 샅샅이 다녀 보자!"
10037030-286 = "[ns] \"자, 자. 그렇게 신나서 뛰어가다가 넘어진다~?\""
10037030-291 = "그러면 저도 이만 실례하겠습니다. 문주님. 서기장님."
10037030-292 = "그래. 수고했다, 카구야."
10037030-294 = "어……? 카구야는 같이 안 가는 거야?"
10037030-295 = "하하하. 부활동이 역시 바빠서 말이죠. 하지만 너무 서운해하지는 마십쇼. 여차하면 저희 경극부실에 견학을 오셔도 좋고요?"
10037030-297 = "그런가……. 부활동이 바쁘다면 어쩔 수 없지! 용서하마!"
10037030-298 = "감사합니다. 서기장님."
10037030-307 = "……."
10037030-309 = "문주님은 육화각에 남으시고, 붉은겨울은 산해경으로……."
10037030-310 = "'산해경의 이곳저곳을 유람하며, 속속들이 산해경과 만나 주었으면 한다.' 라……."
10037030-315 = "만남이란 만날 상대가 있어야 하는 것. 그리고 만날 상대에게도, 만남은 상대적이며 상호적인 것……."
10037030-316 = "붉은겨울이 산해경과 만난다는 것은, 바꾸어 말해 산해경이 붉은겨울과 만난다는 의미."
10037030-317 = "결국 그 길을 가려 하십니까. 문주님."
10037030-320 = "……."
10037030-321 = "충의(忠義)란 무엇인가. 그리고 이때 충의(忠義)는 무엇을 행하려 하는가……."
10037030-322 = "쉽지 않구나. 쉽지 않아. 극(劇)이 그러하듯, 생(生) 역시 마찬가지로다."
10037030-326 = "허나, 행해야 할 때 행하지 않는 것이야말로 불충의 증거."
10037030-331 = "[log=카구야]……이 경치가 사람들을 취하게 하니, [/log]"
10037030-333 = "[log=카구야]깨닫지도 못한 채 기슭에 이르렀구나.[/log]"
