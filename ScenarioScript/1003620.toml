[translation]
1003620-1 = "피크닉 보자기"
1003620-2 = "(약속 시간에 맞춰 공원으로 나가니, 이전처럼 히나타가 기다리고 있었다.)"
1003620-3 = "(히나타는 한 손에는 커다란 가방을 든 채로, 다른 한 손을 크게 흔들며 인사하고 있었다.)"
1003620-7 = "선생님! 여기예요! 여기!"
1003620-8 = "아, 아니다."
1003620-9 = "제가 그쪽으로 갈게요! 거기서 기다려 주세요!"
1003620-18 = "와주셨군요, 선생님! 감사합니다! 기다리고 있었답니다!"
1003620-19 = "[s1] \"미안. 조금 늦었네.\"\n[s2] \"앗. 많이 기다렸어?\""
1003620-20 = "……네?"
1003620-21 = "……네?"
1003620-22 = "아, 아뇨! 그런 뜻은 아니고! 그, 그냥! 저도 도착한 지 몇 분 안 됐는데요……!"
1003620-23 = "으으응. 그런 의미로 드린 말씀이 아니었는데, 죄송합니다……."
1003620-24 = "죄송할 일은 아니라고요?"
1003620-25 = "그, 그렇지만……. 하하하……."
1003620-26 = "……네?"
1003620-27 = "어딘가 들떠 보인다고요? 그, 그래 보이나요? 펴, 평소랑 다름없어 보이려고 노력하는 중인데……."
1003620-31 = "아, 아니!"
1003620-32 = "이렇게 말씀드리면 들떴다는 거나 다름없는 말이긴 하지만 그, 그게……!"
1003620-36 = "……에헤헤."
1003620-37 = "[s3] \"즐거워 보이니 보기 좋아.\"\n[s4] \"좀 들뜰 수도 있지. 나도 그런걸.\""
1003620-38 = "선생님………………."
1003620-39 = "선생님………………."
1003620-43 = "아! 제 정신 좀 봐요. 이러고 있을 때가 아닌데."
1003620-44 = "많이 배고프실 텐데, 저번처럼 제가 도시락을 싸 왔거든요! 괜찮으시다면 함께 드시겠어요?"
1003620-48 = "여기에 이렇게 돗자리를 펴고……. 가방에 가져온 도시락들을 꺼내서……."
1003620-53 = "[ns5] \"……도시락? 좀 크지 않아?\"\n[ns6] \"백과사전만 한 사이즈인데요……?\""
1003620-54 = "후후후. 부족하면 안 되니까요."
1003620-55 = "후후후. 부족하면 안 되니까요."
1003620-56 = "걱정 마세요. 드실 만큼만 드시면, 나머지는 제가 먹으면 되고……."
1003620-60 = "……어라."
1003620-61 = "뭔가 말씀드리고 나니 엄청 먹는 것처럼 들릴 것 같은데……."
1003620-62 = "아, 아무튼! 아무튼이에요!"
1003620-63 = "자, 선생님. 사양 말고 드셔 주세요."
1003620-69 = "제 회심의 도시락……."
1003620-74 = "……을……?"
1003620-78 = "……도시락……? 을……?"
1003620-84 = "……책?"
1003620-85 = "[s7] \"도시락이 아니라 책인데……?\"\n[s8] \"엄청나게 커다란 책이 있다…….\""
1003620-86 = "……어?"
1003620-87 = "……어?"
1003620-88 = "어……. 어? 왜……. 왜 <물품관리대장>이 여기에……."
1003620-92 = "어라? 나 분명……. 도시락……. 만들어서……. 여기에……? 응? 어? 어어……?"
1003620-93 = "어째서……. 어어……?"
1003620-94 = "[s9] \"지, 진정해. 히나타.\"\n[s10] \"흔히 할 수 있는 실수야. 나도 자주 그러는걸.\""
1003620-95 = "그, 그렇지만……. 그러면 도시락은……."
1003620-96 = "그, 그렇지만……. 그러면 도시락은……."
1003620-97 = "서, 선생님 식사도 안 하고 오셨는데……. 이런 어처구니없는 실수로 또 제가 민폐를……."
1003620-98 = "…………."
1003620-99 = "죄송합니다……."
1003620-103 = "[ns11] 보자기 안의 <물품관리대장>을 집어든다.\n[ns12] \"엄청 큰 책인데……. 봐도 되는 거야?\""
1003620-110 = "아, 아. 그건……. 그……."
1003620-111 = "당연히 보셔도 괜찮지만 전혀 재미있거나 한 내용은 아닌지라……."
1003620-112 = "말씀드렸듯 저희 성당의 물품관리대장이에요. 그냥 성당 물품들이 어떻게 관리되고 있는지를 제가 정리한……."
1003620-117 = "……선생님……? 왜 그렇게 진지하게 보시는……."
1003620-118 = "……네? 빽빽하게 잘 정돈돼 있다고요? 아……."
1003620-119 = "그, 그야 저희 성당은 아주 크니까……. 그만큼 관리해야 할 비품과 물품도 많거든요."
1003620-120 = "수천……. 아니 만 단위였던 걸로 기억하는데……."
1003620-121 = "아무리 관리 담당이라도 그런 걸 저 혼자 다 다룰 순 없으니……. 이렇게 정리를 해놨지요."
1003620-122 = "다른 분들과 달리 저는 덜렁이니까요. 이렇게라도 하지 않으면, 다 잊어버릴 거거든요."
1003620-123 = "에헤헤……."
1003620-124 = "[s13] \"응. 그러네. 히나타는 꼼꼼하구나.\"\n[s14] \"그렇지. 이런 게 바로 꼼꼼함이지.\""
1003620-130 = "……선생님? 방금 뭐라고……. 꼬, 꼼꼼함이요? 제가요?"
1003620-131 = "그럴 리가요……!! 저는 덜렁이인걸요!? 보시다시피 도시락도 제대로 못 챙겨오고……."
1003620-132 = "꼼꼼하다니, 그런 말은 한 번도 들어본 적이 없어요. 겨우 목록에 그런 거 좀 적었다고……."
1003620-136 = "……네? 그런 걸 포함해서요……?"
1003620-137 = "그게 무슨……."
1003620-138 = "[s15] \"꼼꼼함은 자신의 단점에 대비하는 거니까.\"\n[s16] \"기억력이 아니라, 자세의 이야기거든.\""
1003620-143 = "……선생님……."
1003620-147 = "……어라. 선생님? 갑자기 뭘 꺼내시는……."
1003620-148 = "……앗."
1003620-152 = "도시락……!?"
1003620-153 = "선생님? 선생님도 도시락을 싸 오셨던 거예요?"
1003620-154 = "[s17] \"뭐…… 이것도 나름의 '꼼꼼함'이지.\"\n[s18] \"마침 같이 먹으면 좋겠다 싶은 메뉴가 있었거든.\""
1003620-157 = "……아……."
1003620-158 = "그렇다면……. 다행……이네요……. 휴우……."
1003620-159 = "정말, 방금 전까지는 어떻게 될 줄 알았어요. 이번에도 선생님 덕분에 고비를 넘기네요."
1003620-160 = "……헤헤."
1003620-161 = "감사합니다!"
1003620-163 = "(이후 히나타와 함께 도시락을 나눠먹으며 물품관리대장을 구경했다.)"
1003620-164 = "(큰 크기만큼이나 다양하고 의외인 물품들도 많아서, 보는 내내 재미있는 잡담과 감상이 이어졌다.)"
1003620-168 = "(즐겁게 시간을 보낸 후, 히나타를 돌려보냈다.)"
