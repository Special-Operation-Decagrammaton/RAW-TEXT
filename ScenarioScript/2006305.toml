[translation]
2006305-1 = "소녀의 주문"
2006305-3 = "……여기야."
2006305-4 = "명심해 선생님,"
2006305-5 = "함부로 말해선 안 돼."
2006305-6 = "[s] \"네?\""
2006305-8 = "메모지 밑에 적혀 있었거든."
2006305-9 = "<아즈사 쨩, 저번에 본 것 그대로 연습해 보는 거예요>라고."
2006305-10 = "그래서, 일단 내가 혼자서 해보려고 해."
2006305-11 = "……좋아, 목표지점인 델타 탱고에 도착. 해치 열 테니 사주경계해줘."
2006305-15 = "좋아, 목표지점, <모치버거 게헨나 [ruby=델타 탱고] DT점 [/ruby]>. 주변에 위협 미관측됨."
2006305-16 = "현 시간부로, 드라이브 스루에서 햄버거 픽업을 시작한다."
2006305-17 = "[s] \"델타 탱고가 햄버거 드라이브 스루였어?!\""
2006305-18 = "응. 다들 대회 등록으로 바빠서, 점심에 먹을 햄버거를 \"DT\", \"델타 탱고\"에서 사다 달라고 했어."
2006305-19 = "히후미하고 비슷한 곳을 저번에 같이 갔던 적이 있는데 구체적인 절차가 기억이 잘 안 나."
2006305-20 = "일단, 전차를 몰아서 검문초소에 가까이 대야 하는데……."
2006305-21 = "……후우, 긴장되네. 가보자."
2006305-22 = "[s] \"검문소 같은 게 아니지만 일단 오케이!\""
2006305-32 = "……으음, 뭐지. 원래 초병이 나오질 않았던가?"
2006305-33 = "보안이 허술해, 인터폰만 두고 다들 어디에-"
2006305-37 = "안녕하세요- 모치버거 게헨나 [ruby=드라이브 스루] DT점 [/ruby]입니다- 주문 말씀해주세요-!"
2006305-38 = "뭣?!"
2006305-39 = "기습인가?! 주포, 준비 완료!"
2006305-40 = "[s] \"아니야, 아니야!! 주문을 하면 돼!\""
2006305-43 = "손님……? 주문하시겠어요?"
2006305-47 = "주문…… 그렇지, 주문이군. 명료하게 해야 해."
2006305-48 = "씩씩하고, 알아듣기 쉽게……. 헷갈리지 않고, 확실하게 의사를 전달하도록……. 그렇지."
2006305-52 = "……당소 준비완료, 귀소 감도 있는지."
2006305-53 = "뭐라고요? 귀소 감…… 네?!"
2006305-54 = "당소 수신 미소 불량. 감도 3. 큰 차질 아니라 판단하여……."
2006305-58 = "……9라인 브리핑, 속행한다."
2006305-59 = "선생님, 수신 음질이 안 좋아서 말이 끊기긴 하지만 내가 잘 판단해볼게."
2006305-60 = "라인 1, 픽업 지점, 현재 위치, 모치버거 델타 탱고."
2006305-61 = "라인 2, 무선 주파수 및 콜사인, 현재 채널 유지. 호출부호, '크루세이더 쨩'."
2006305-62 = "라인 3, 긴급도 낮음. 다만 대기 인원이 많기에 빠르게 진행되기를 희망함. 라인 4, 별도 없음."
2006305-63 = "라인 5. 모치비프버거 세트 5개. 샐러드볼 2개. 전부 콜라."
2006305-64 = "저, 저기......."
2006305-65 = "중단 금지. 시간상 브리핑 재개한다. 다음, 라인 6-"
2006305-71 = "……이상, 전체 복창 필요 없음. 즉시 준비 바람. 크루세이더 쨩, 아웃."
2006305-72 = "영업 방침이라서 복창은 할게요……. 모치비프버거 세트 5개에 샐러드 2개 주문 받았습니다……. 앞으로 와주세요……."
2006305-73 = "하아…… 게헨나에선 왜 이상한 손님들만 오는 거지……."
2006305-78 = "어서 오세요……."
2006305-79 = "음. 좋아."
2006305-80 = "창문이 있고, 초병이 있네. 여기가 검문소구나."
2006305-81 = "검문……?"
2006305-82 = "시동 끄고, 주간주행등 소등 완료."
2006305-83 = "여기 신분증. 차내에 총기류도 있으니 참고 부탁해."
2006305-84 = "아니, 그…… 검문소가 아니에요…… 햄버거 바로 받아가시면 됩니다……."
2006305-85 = "응?"
2006305-91 = "좋아, 햄버거 모두 정해진 대로 보급 완료."
2006305-92 = "어때, 선생님. 처음치고 나쁘지 않았지?"
2006305-96 = "[ns] \"아즈사가 역시 최고란다......!\""
2006305-97 = "평범한 일상을 하나씩 배워가는 걸 도와줘서 고마워."
2006305-98 = "다음에는 혼자서도 잘할 수 있을 것 같아."
2006305-99 = "그래도, 다음에도 같이 오자. 그게 더 즐거울 것 같아."
2006305-101 = "(이후, 아즈사는 작게 콧노래를 부르며 전차를 운전해 돌아왔다.)"
2006305-102 = "(심부름을 나름 잘 마친 아즈사가 기특하고 귀여웠다.)"
