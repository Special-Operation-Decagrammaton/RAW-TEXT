2006305-1 = "#title;소녀의 주문"
2006305-3 = "#na;아즈사 레이싱;……여기야."
2006305-4 = "#na;아즈사 레이싱;명심해 선생님,"
2006305-5 = "#na;아즈사 레이싱;함부로 말해선 안 돼."
