2006305-53 = "#na;모치버거 점원 목소리;뭐라고요? 귀소 감…… 네?!\n#3;hide"
2006305-54 = "3;아즈사 레이싱;11;당소 수신 미소 불량. 감도 3. 큰 차질 아니라 판단하여……."
2006305-55 = "#st;[0,0];instant;1;"
2006305-57 = "3;아즈사 레이싱;99\n#3;em;[...]\n#wait;2500"
2006305-58 = "3;아즈사 레이싱;05;……9라인 브리핑, 속행한다."
2006305-59 = "3;아즈사 레이싱;15;선생님, 수신 음질이 안 좋아서 말이 끊기긴 하지만 내가 잘 판단해볼게."
2006305-60 = "3;아즈사 레이싱;05;라인 1, 픽업 지점, 현재 위치, 모치버거 델타 탱고.\n#3;em;[반응]"
2006305-61 = "3;아즈사 레이싱;11;라인 2, 무선 주파수 및 콜사인, 현재 채널 유지. 호출부호, '크루세이더 쨩'."
2006305-62 = "3;아즈사 레이싱;99;라인 3, 긴급도 낮음. 다만 대기 인원이 많기에 빠르게 진행되기를 희망함. 라인 4, 별도 없음."
2006305-63 = "3;아즈사 레이싱;05;라인 5. 모치비프버거 세트 5개. 샐러드볼 2개. 전부 콜라."
2006305-64 = "#na;모치버거 점원 목소리;저, 저기.......\n#3;hide"
2006305-65 = "3;아즈사 레이싱;12;중단 금지. 시간상 브리핑 재개한다. 다음, 라인 6-\n#3;em;[!]"
2006305-71 = "3;아즈사 레이싱;11;……이상, 전체 복창 필요 없음. 즉시 준비 바람. 크루세이더 쨩, 아웃.\n#3;a\n#3;greeting"
2006305-72 = "#na;모치버거 점원 목소리;영업 방침이라서 복창은 할게요……. 모치비프버거 세트 5개에 샐러드 2개 주문 받았습니다……. 앞으로 와주세요…….\n#3;hide"
2006305-73 = "#na;모치버거 점원 목소리;하아…… 게헨나에선 왜 이상한 손님들만 오는 거지…….\n#fontsize;50"
2006305-76 = "3;모치버거 점원;04\n#3;a\n#3;em;[!]\n#3;stiff\n#wait;1500"
2006305-78 = "3;모치버거 점원;07;어서 오세요…….\n#3;greeting"
2006305-79 = "3;아즈사 레이싱;11;음. 좋아."
2006305-80 = "3;아즈사 레이싱;05;창문이 있고, 초병이 있네. 여기가 검문소구나."
2006305-81 = "3;모치버거 점원;04;검문……?\n#3;em;[?]"
2006305-82 = "3;아즈사 레이싱;12;시동 끄고, 주간주행등 소등 완료."
2006305-83 = "3;아즈사 레이싱;05;여기 신분증. 차내에 총기류도 있으니 참고 부탁해.\n#3;greeting"
2006305-84 = "3;모치버거 점원;07;아니, 그…… 검문소가 아니에요…… 햄버거 바로 받아가시면 됩니다…….\n#3;em;[세로선]"
2006305-85 = "3;아즈사 레이싱;02;응?\n#3;em;[?]"
