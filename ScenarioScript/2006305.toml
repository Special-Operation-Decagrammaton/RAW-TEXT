2006305-8 = "3;아즈사 레이싱;17;메모지 밑에 적혀 있었거든.\n#3;a\n#3;greeting"
2006305-9 = "3;아즈사 레이싱;02;<아즈사 쨩, 저번에 본 것 그대로 연습해 보는 거예요>라고."
2006305-10 = "3;아즈사 레이싱;00;그래서, 일단 내가 혼자서 해보려고 해."
2006305-11 = "3;아즈사 레이싱;15;……좋아, 목표지점인 델타 탱고에 도착. 해치 열 테니 사주경계해줘."
2006305-15 = "#na;아즈사 레이싱;좋아, 목표지점, <모치버거 게헨나 [ruby=델타 탱고] DT점 [/ruby]>. 주변에 위협 미관측됨."
2006305-16 = "#na;아즈사 레이싱;현 시간부로, 드라이브 스루에서 햄버거 픽업을 시작한다."
2006305-17 = "[s] \"델타 탱고가 햄버거 드라이브 스루였어?!\""
2006305-18 = "3;아즈사 레이싱;02;응. 다들 대회 등록으로 바빠서, 점심에 먹을 햄버거를 \"DT\", \"델타 탱고\"에서 사다 달라고 했어."
2006305-19 = "3;아즈사 레이싱;04;히후미하고 비슷한 곳을 저번에 같이 갔던 적이 있는데 구체적인 절차가 기억이 잘 안 나.\n#3;em;[속상함]"
2006305-20 = "3;아즈사 레이싱;00;일단, 전차를 몰아서 검문초소에 가까이 대야 하는데……."
2006305-21 = "3;아즈사 레이싱;17;……후우, 긴장되네. 가보자."
2006305-22 = "[s] \"검문소 같은 게 아니지만 일단 오케이!\""
2006305-23 = "#st;[0,0];instant;1;"
2006305-32 = "3;아즈사 레이싱;15;……으음, 뭐지. 원래 초병이 나오질 않았던가?"
2006305-33 = "3;아즈사 레이싱;16;보안이 허술해, 인터폰만 두고 다들 어디에-"
2006305-34 = "#st;[0,0];instant;1;"
2006305-36 = "3;아즈사 레이싱;02\n#3;stiff\n#wait;1200"
2006305-37 = "#na;모치버거 점원 목소리;안녕하세요- 모치버거 게헨나 [ruby=드라이브 스루] DT점 [/ruby]입니다- 주문 말씀해주세요-!\n#3;hide"
