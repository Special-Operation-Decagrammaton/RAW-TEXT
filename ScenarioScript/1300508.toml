[translation]
1300508-1 = "음반 매장"
1300508-2 = "상점가의 음반 매장 앞"
1300508-3 = "어라, 선생. 이런 곳에서 만나다니, 우연이네."
1300508-4 = "응. 오늘은 비번이라 음반 매장에 음악을 들으러 잠깐 들렀어."
1300508-5 = "음반 매장은 참 좋지. 여러가지 종류의 음악을 한 번에 들어볼 수 있으니까."
1300508-6 = "음…… 역시 이 곡도 나쁘지 않네."
1300508-7 = "선생도 한 번 들어 볼래?"
1300508-8 = "[s1] \"좋아.\"\n[s2] \"카요코의 추천 음악은 조금…….\""
1300508-9 = "사양하지 말고. 한 번 들어봐."
1300508-10 = "사양하지 말고. 한 번 들어봐."
1300508-14 = "잔잔한 재즈풍의 선율이 울려 퍼진다……."
1300508-15 = "……"
1300508-18 = "[ns] \"이건…… 헤비메탈이 아니잖아?\""
1300508-19 = "……어째서 또 메탈을 듣는다고 생각한 거야?"
1300508-20 = "게헨나의 학생이라고 해서 언제나 과격한 음악만 듣는 건 아니라고."
1300508-21 = "음악은 장르를 불문하고 모두 저마다의 이야기를 갖고 있으니까."
1300508-22 = "나름의 소신이 담긴 음악이라면 뭐든지 좋아해."
1300508-23 = "선생님은 어떤 음악을 좋아해?"
1300508-24 = "[s] 좋아하는 곡의 제목을 알려준다."
1300508-25 = "으음……. 들어본 적 없는 곡이네."
1300508-26 = "하지만 분명 내 귀에도 잘 맞을 거야."
1300508-27 = "그도 그럴 것이 선생님이 추천하는 곡인 걸."
1300508-28 = "그럼 한 번 찾아보도록 할까……."
1300508-30 = "이후, 카요코와 함께 음악을 감상하며 휴일을 보냈다."
