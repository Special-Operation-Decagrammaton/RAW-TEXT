[translation]
10055190-1 = "不凍港的無敵鐵甲"
10055190-2 = ""
10055190-3 = "……這裡是溫泉？還有這種設施啊？"
10055190-4 = "海邊竟然有溫泉，感覺好浪漫哦！"
10055190-5 = "不覺得有點不搭嗎？"
10055190-6 = ""
10055190-8 = ""
10055190-9 = "……"
10055190-10 = "真琴醬？你從剛才就在想什麼啊？"
10055190-11 = "……啊。"
10055190-12 = "糟了！！！！我忘記了！！！！"
10055190-13 = "嚇，嚇我一跳！"
10055190-14 = "啊，皐月。你沒事吧？"
10055190-15 = "真是的～！我還以為心臟要停了耶～！"
10055190-16 = "唔嗯……是我疏忽了。#n沒想到本大人居然會忽略掉這麼重大的事。"
10055190-17 = "格黑娜學園除了三一之外，還有另一道必須跨越的障礙！"
10055190-19 = "咦？除了三一以外，還有我們該提防的學園嗎……？"
10055190-20 = "伊呂波，你應該跟我一起去過才對！難道你沒察覺嗎！"
10055190-21 = "一起去過……？"
10055190-22 = "哼哼哼，果然很敏銳啊，真琴議長。"
10055190-23 = ""
10055190-25 = ""
10055190-26 = ""
10055190-27 = "沒錯，咱正是赤冬聯邦學園的學生會長、#n美化部長兼、書記長兼、體育部代表兼、整潔部部長……！"
10055190-28 = ""
10055190-29 = "不凍港的#n無敵鐵甲"
10055190-32 = ""
10055190-34 = "那個，還有……美化部部長……"
10055190-35 = "風紀委員長兼供餐部長，以及被選為本月最優秀布丁試吃家的潔莉諾會長。"
10055190-36 = "哦哦！沒錯！說得好！"
10055190-37 = "而且現在還是這座海邊溫泉浴場的老闆娘，也是最強的蟹鬥士！"
10055190-38 = ""
10055190-40 = ""
10055190-41 = "咦？"
10055190-42 = "難道真琴前輩比起三一，更提防赤冬嗎？"
10055190-43 = "才，才不是那樣！！！"
10055190-44 = "萬一到了本大人這一代，偏偏是本大人率領的格黑娜學園！！！"
10055190-45 = "有可能會輸給區區小鬼率領的赤冬這種事情，本大人可是一丁點都沒擔心過！！！"
10055190-46 = "舉的例子也太具體了吧……！？"
10055190-47 = "居然會提防赤冬，真琴醬也真是異想天開呢。"
10055190-48 = "皐月！你是因為沒有親眼見過才會不懂！"
10055190-49 = "一望無際的廣闊領土，還有無數的學生！"
10055190-50 = "要是能在像我真琴大人這種「受全校學生支持的優秀領導者」的帶領下團結一致，#n他們的潛力可是足以超越格黑娜，甚至威脅奇普托斯三大學園啊！"
10055190-51 = "不愧是真琴議長！您真是瞭若指掌！"
10055190-52 = "雖然上次的政變以失敗告終，但下次一定要讓赤冬朝更好的方向……"
10055190-53 = "咦？瑪麗娜，你打算發動政變嗎？"
10055190-54 = "……看來肅清得還不夠徹底呢。"
10055190-55 = "啊！？不是的！自從上次肅清後，我就完全效忠於事務局了！"
10055190-56 = "都那個樣子了，還談什麼帶領跟團結啊？"
10055190-57 = "啊哈哈哈！原來還有比我們更誇張的學園啊！"
10055190-58 = "……千秋你啊。"
10055190-59 = "有時候會若無其事地說出狠毒的話呢。"
10055190-60 = "咦咦！？"
10055190-61 = "夠了！不必囉嗦！反正彼此的目的都是一樣的吧！"
10055190-62 = "就用無敵的螃蟹「肅清君2號」打倒你們！"
10055190-63 = "什，什麼！？那隻巨大的螃蟹是！？"
10055190-64 = "這不是犯規嗎！？"
10055190-65 = "呵呵呵，這不算犯規。#n只要是甲殼類，任何種類都能參加「蟹鬥」。"
10055190-66 = "為了找到配得上潔莉諾書記長格調的螃蟹所付出的辛苦，也算是值得了呢。"
10055190-67 = "啊啊啊！寄居蟹們被敵人的體型嚇得縮起來了！"
10055190-68 = "什麼！？站起來，虎鯊丸！你可不是會被這點程度擊垮的螃蟹！"
10055190-69 = "……沒有反應呢。"
10055190-70 = "怎麼會！難道我們在開打前就已經輸了嗎！？"
10055190-71 = ""
10055190-73 = ""
10055190-74 = "……嗯，你害怕了啊。"
10055190-75 = ""
10055190-77 = ""
10055190-78 = "沒事的，伊吹會牽著你的手。"
10055190-79 = ""
10055190-81 = "哦哦！？害怕的寄居蟹彷彿聽懂了伊吹醬的話，舉起了螯……！"
10055190-82 = "……難道是在這裡開花了嗎！？"
10055190-83 = "伊吹身為蟹鬥士的才能……！？"
10055190-84 = "一起戰鬥就不怕了！"
10055190-85 = "走吧，夾夾先生！一起去教訓壞螃蟹！"
10055190-86 = "夾夾～！"
