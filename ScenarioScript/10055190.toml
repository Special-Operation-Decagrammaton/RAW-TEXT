[translation]
10055190-1 = "얼어붙지 않는 항구의 무적철갑"
10055190-3 = "……여기는, 온천? 이런 시설도 있었나요?"
10055190-4 = "해변에 온천이라니, 뭔가 낭만적이네요!"
10055190-5 = "좀 언밸런스하지 않아요?"
10055190-9 = "……."
10055190-10 = "마코토 쨩? 아까부터 뭘 그렇게 생각해?"
10055190-11 = "……아."
10055190-12 = "아차!!!! 깜빡했다!!!!"
10055190-13 = "까, 깜짝!"
10055190-14 = "아, 사츠키. 괜찮나?"
10055190-15 = "진짜~! 간 떨어지는 줄 알았단 말야~!"
10055190-16 = "음…… 불찰이다. 설마 이 몸께서 이렇게 중대한 사실을 놓치고 있을 줄이야."
10055190-17 = "게헨나 학원에는, 트리니티 외에도 넘어야 할 장벽이 하나 더 있다고!"
10055190-19 = "네? 트리니티 말고 우리가 경계해야 할 학교가 있던가요……?"
10055190-20 = "이로하, 네 녀석은 분명히 나와 함께 갔을 텐데! 설마 눈치채지 못한 거냐!"
10055190-21 = "같이 갔다……?"
10055190-22 = "훗훗훗, 역시 눈치가 빠르군, 마코토 의장."
10055190-27 = "그렇다, 바로 이 붉은겨울 학원의 학생회장이자, 미화부장이자, 서기장이자, 체육부장이자, 청소부장이자……!"
10055190-29 = "얼어붙지 않는#n항구의 무적철갑"
10055190-34 = "어, 그리고, 또…… 미화부장이랑……."
10055190-35 = "선도부장, 급식부장, 그리고 이달의 최우수 푸딩 시식가로 선정되신 체리노 님이십니다."
10055190-36 = "오오! 그렇다! 잘 말해주었다!"
10055190-37 = "그리고 지금은 이 해변 온천장의 여주인이자, 최강의 크랩 파이터이기도 하지!"
10055190-41 = "엥?"
10055190-42 = "설마 마코토 선배, 붉은겨울을 트리니티보다 경계하고 계셨던 거예요?"
10055190-43 = "그, 그렇지 않다!!!"
10055190-44 = "자칫하면 이 몸의 대에 이르러, 하필이면 이 몸이 이끄는 게헨나 학원이!!!"
10055190-45 = "고작 꼬맹이가 이끄는 붉은겨울 따위에게 밀릴 거라는 불안감 따위는 눈꼽만치도 가져본 적 없단 말이다!!!"
10055190-46 = "예시가 엄청나게 구체적인데요……?!"
10055190-47 = "마코토 쨩도 참 엉뚱하네. 붉은겨울이라니."
10055190-48 = "사츠키! 너는 직접 보지 않아서 모른다!"
10055190-49 = "가도 가도 끝이 없는 광활한 영토와, 무수한 학생의 숫자!"
10055190-50 = "만약 이 마코토 님처럼 전교생의 지지를 받는 우수한 지도자의 영달 하에 하나가 되어 움직일 수 있다면, 그 저력은 게헨나를 넘어 키보토스 삼대 학원을 넘보는 것이라고!"
10055190-51 = "역시나, 마코토 의장님! 잘 파악하고 계시군요!"
10055190-52 = "비록 저번 쿠데타는 실패로 돌아갔지만, 다음번에야말로 붉은겨울을 더 나은 방향으로……."
10055190-53 = "엥? 마리나, 쿠데타 할 계획이 있었어?"
10055190-54 = "……아직, 숙청이 덜 된 모양이네요."
10055190-55 = "앗?! 아닙니다! 저번 숙청 이후로, 저는 완전히 사무국에 충성하고 있습니다!"
10055190-56 = "바로 저러는데, 영달이고 단결이 뭐요?"
10055190-57 = "아하하하! 우리보다 더한 학교도 있네요!"
10055190-58 = "……치아키는."
10055190-59 = "가끔 아무렇지도 않게 심한 말을 한단 말이죠?"
10055190-60 = "네엣?!"
10055190-61 = "에잇! 다들 시끄럽다! 어차피 서로 목적은 이것뿐이겠지!"
10055190-62 = "무적의 게, <숙청군 2호>로 쓰러트려주마!"
10055190-63 = "뭐, 뭐냣?! 저 거대한 게는?!"
10055190-64 = "이거 반칙 아니야?!"
10055190-65 = "후후후, 반칙이 아닙니다. <크랩 파이트>는 갑각류라면 어떤 종이라도 참가할 수 있죠."
10055190-66 = "체리노 서기장님의 품격에 어울리는 게를 구하느라 고생한 보람이 있네요."
10055190-67 = "아아앗! 소라게들이 적의 크기에 놀라서 위축됐어요!"
10055190-68 = "뭣이라?! 일어나라, 타이거샤크마루! 너는 이 정도로 꺾일 게가 아니지 않느냐!"
10055190-69 = "……반응이, 없네요."
10055190-70 = "이럴 수가! 설마, 우리는 싸우기도 전에 패했다는 건가?!"
10055190-74 = "……응, 겁먹었구나."
10055190-78 = "괜찮아, 이부키가 손잡아줄게."
10055190-81 = "오옷?! 겁먹었던 소라게가 이부키 쨩의 말을 알아듣는 것처럼 집게발을……!"
10055190-82 = "……! 설마, 여기서 개화한 건가?!"
10055190-83 = "이부키의 크랩 파이터 재능이……?!"
10055190-84 = "같이 싸우면 무섭지 않은걸!"
10055190-85 = "가자, 꼬집이 씨! 함께 나쁜 게를 혼내주는 거야!"
10055190-86 = "꼬집~!"
