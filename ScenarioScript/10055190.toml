[translation]
10055190-1 = "不凍の港の無敵徹甲"
10055190-3 = "ここは……温泉でしょうか？"
10055190-4 = "浜辺に温泉って、なんだかロマンチックですね～！"
10055190-5 = "ロマンチックというより、ミスマッチな感じがしますけど……。"
10055190-9 = "……。"
10055190-10 = "マコトちゃん？さっきから何を考え込んでるの？"
10055190-11 = "……あ。"
10055190-12 = "んなあああっ！しまったあああ！！"
10055190-13 = "び、びっくりした！いきなり何なの！？"
10055190-14 = "……ああ、私としたことがつい取り乱してしまった。"
10055190-15 = "ほんとにもう！心臓止まっちゃったらどうするのよ！！"
10055190-16 = "いやなに、たった今、本当に重大なことを思い出してな。"
10055190-17 = "ゲヘナには……トリニティの他にも、まだ越えるべき壁があったのだ！"
10055190-19 = "トリニティの他に……？どこかありましたっけ？"
10055190-20 = "イロハ、お前は私と一緒にいただろう！何故分からん！"
10055190-21 = "一緒にいた……？"
10055190-22 = "フッフッフッ、鋭いな。さすがはマコト議長だ。"
10055190-27 = "そうだ、我こそレッドウィンター連邦学園の生徒会長であり、#n環境美化部部長兼、書記長兼、運動部代表兼、清掃部部長兼……！"
10055190-29 = "不凍の港の#n無敵徹甲"
10055190-34 = "あ……あと、環境美化部部長と……。"
10055190-35 = "風紀委員長兼、給食部部長……。#nそして今月の最優秀プリン試食家として選ばれた、チェリノ会長で御座います。"
10055190-36 = "おお、そうだ！よくぞ言ってくれた！"
10055190-37 = "そして今は……この温泉の女将であり、最強のクラブファイターでもある！"
10055190-41 = "……え？"
10055190-42 = "もしかしてマコト先輩、トリニティよりレッドウィンターを警戒してたんですか？"
10055190-43 = "そ、そんなことはない！"
10055190-44 = "もしかすると……ゲヘナ学園が！私の率いるこの代で！"
10055190-45 = "ただのチビが率いるレッドウィンターなんかに、#n引けを取るかもしれないという不安など、微塵も感じたことはない！！"
10055190-46 = "不安の内容がやけに具体的ですね……。"
10055190-47 = "レッドウィンターなんて、特に警戒が必要とは思えないけど……。"
10055190-48 = "サツキ、お前は見ていないからそんなことが言えるのだ！"
10055190-49 = "果てしなく広大な領土、無数の生徒！"
10055190-50 = "万一このマコト様のように優秀な指導者が現れ、生徒を団結させたなら……#nその底力はゲヘナを超え、キヴォトス三大学園をも圧倒しうるのだぞ！"
10055190-51 = "さすがマコト議長！よくご存じで！！"
10055190-52 = "前回のクーデターは失敗に終わりましたが、#n次こそはレッドウィンターをより良い……。"
10055190-53 = "ん？マリナ、またクーデターを計画していたのか？"
10055190-54 = "……どうやら、粛清が足りなかったようですね。"
10055190-55 = "ち、違います！前回の粛清以来、私は完全に事務局に忠誠を誓っております！"
10055190-56 = "あんなんですよ？優秀な指導者が……なんでしたっけ？"
10055190-57 = "あはははっ！私たちよりひどい学園もあるんだね～！"
10055190-58 = "チアキって……。"
10055190-59 = "たまにしれっと無慈悲なこと言いますよね。"
10055190-60 = "ふぇっ！？"
10055190-61 = "ええい！うるさい！とにかく目的はこれなのだろう！"
10055190-62 = "無敵のカニ、「粛清君2号」で蹴散らしてやる！"
10055190-63 = "なっ、なんだあの巨大カニは！？"
10055190-64 = "これ、反則じゃないの？"
10055190-65 = "ふふふ、反則ではありません。#n「クラブファイト」は甲殻類であればどんな種だって参加できます。"
10055190-66 = "頑張ってチェリノ書記長にふさわしいカニを見つけた甲斐がありました。"
10055190-67 = "ああっ！？ヤドカリたちがあまりの大きさにビビってます！"
10055190-68 = "なんだと！？立て、タイガーシャーク丸！お前はこの程度で折れる奴ではない！"
10055190-69 = "……反応がありません。"
10055190-70 = "まさか！戦いが始まる前に負けを認めると言うのか！？"
10055190-74 = "……そっか、怖いんだね。"
10055190-78 = "大丈夫だよ。イブキが、おてて握っててあげる。"
10055190-81 = "おおっ！？まるでイブキちゃんの気持ちが伝わったかのように、#nヤドカリが足を……！"
10055190-82 = "もしや……開花したのか……！？"
10055190-83 = "イブキのクラブファイターとしての才能が……！！"
10055190-84 = "一緒に戦えば怖くないよ！"
10055190-85 = "いこう、カニカニさん！一緒に悪いカニさんを懲らしめるよ！"
10055190-86 = "カニ～！"
