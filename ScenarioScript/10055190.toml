[translation]
10055190-1 = "เกราะเหล็กไร้เทียมทานแห่งท่าเรือไร้น้ำแข็ง"
10055190-2 = ""
10055190-3 = "ที่นี่คือออนเซ็นเหรอคะ...? มีสถานที่แบบนี้ด้วยงั้นเหรอคะ?"
10055190-4 = "ออนเซ็นริมชายหาด โรแมนติกจังเลยค่ะ!"
10055190-5 = "มันไม่ดูขัดกันเกินไปหน่อยหรือไงคะ?"
10055190-6 = ""
10055190-8 = ""
10055190-9 = "......"
10055190-10 = "มาโคโตะจัง? คิดอะไรอยู่ตั้งแต่เมื่อกี้แล้วน่ะ?"
10055190-11 = "อ๊ะ..."
10055190-12 = "อ๊ะ!!!! ลืมไปเลย!!!!"
10055190-13 = "ตะ... ตกใจหมดเลย!"
10055190-14 = "อ๊ะ ซัตสึกิ เป็นอะไรรึเปล่า?"
10055190-15 = "จริงๆ เลย~! ฉันเกือบหัวใจวายแน่ะ~!"
10055190-16 = "อืม... เราพลาดเอง ไม่คิดเลยว่าเราจะมองข้ามข้อเท็จจริงที่สำคัญขนาดนี้ไปได้"
10055190-17 = "นอกจากทรีนิตี้แล้ว สถาบันเกเฮนน่ายังมีกำแพงอีกด่านที่ต้องก้าวข้ามให้ได้!"
10055190-19 = "คะ? นอกจากทรีนิตี้แล้ว ยังมีโรงเรียนที่เราต้องระวังอีกเหรอคะ...?"
10055190-20 = "อิโรฮะ เธอก็ไปกับเราด้วยแท้ๆ! อย่าบอกนะว่าไม่ทันสังเกตน่ะ!"
10055190-21 = "ไปด้วยกัน...?"
10055190-22 = "หึหึหึ ไหวพริบดีจริงๆ สมกับที่เป็นประธานมาโคโตะ"
10055190-23 = ""
10055190-25 = ""
10055190-26 = ""
10055190-27 = "ใช่แล้ว! เราคือประธานสภานักเรียนแห่งสหภาพเรดวินเทอร์ และเป็นหัวหน้าฝ่ายตกแต่ง เลขานุการ หัวหน้าฝ่ายกีฬา หัวหน้าฝ่ายทำความสะอาด...!"
10055190-28 = ""
10055190-29 = "เกราะเหล็กไร้เทียมทาน#nแห่งท่าเรือไร้น้ำแข็ง"
10055190-32 = ""
10055190-34 = "เอ่อ แล้วก็ เอ่อ... หัวหน้าฝ่ายตกแต่ง แล้วก็..."
10055190-35 = "ประธานกรรมการวินัย หัวหน้าฝ่ายอาหาร และท่านเชริโน่ยังได้รับเลือกให้เป็นนักชิมพุดดิ้งยอดเยี่ยม#nประจำเดือนด้วยค่ะ"
10055190-36 = "โอ้! ถูกต้อง! พูดได้ดีมาก!"
10055190-37 = "และตอนนี้ยังเป็นทั้งเจ้าของออนเซ็นริมหาดแห่งนี้ และแคร็บไฟต์เตอร์ที่แข็งแกร่งที่สุดอีกด้วย!"
10055190-38 = ""
10055190-40 = ""
10055190-41 = "หา?"
10055190-42 = "อย่าบอกนะคะว่ารุ่นพี่มาโคโตะระวังเรดวินเทอร์ยิ่งกว่าทรีนิตี้อีกน่ะค่ะ?"
10055190-43 = "มะ... ไม่ใช่อย่างนั้นนะ!!"
10055190-44 = "ถ้าพลาดขึ้นมา ในยุคของท่านมาโคโตะผู้นี้ โรงเรียนเกเฮนน่าที่เราเป็นผู้นำอยู่ก็อาจจะ...!!!"
10055190-45 = "พลาดท่าให้เรดวินเทอร์ที่มีแค่เด็กน้อยเป็นผู้นำ! เราไม่เคยกังวลเรื่องแบบนั้นเลยแม้แต่นิดเดียว!!!"
10055190-46 = "ยกตัวอย่างได้เฉพาะเจาะจงสุดๆ เลยนะคะ...?!"
10055190-47 = "มาโคโตะจังนี่แปลกคนจริงๆ เลย เรดวินเทอร์เนี่ยนะ"
10055190-48 = "ซัตสึกิ! เธอไม่เคยเห็นกับตาเลยไม่รู้หรอก!"
10055190-49 = "ดินแดนอันกว้างใหญ่ที่เดินเท่าไรก็ไร้ที่สิ้นสุด กับนักเรียนจำนวนมหาศาลจนนับไม่ถ้วน"
10055190-50 = "ถ้ารวมใจเป็นหนึ่งเดียวกันได้ ภายใต้การนำของผู้นำที่ยอดเยี่ยมและได้รับการสนับสนุนจากนักเรียนทั้ง#nโรงเรียนอย่างท่านมาโคโตะผู้นี้ ก็จะมีพลังที่แท้จริงเหนือกว่าเกเฮนน่า ถึงขั้นท้าทายสามโรงเรียนใหญ่#nแห่งคิโวทอสได้เลยเชียวนะ!"
10055190-51 = "สมกับเป็นท่านประธานมาโคโตะ! มองได้ทะลุปรุโปร่งจริงๆ เลยนะ!"
10055190-52 = "ถึงการรัฐประหารครั้งก่อนจะล้มเหลว แต่ครั้งหน้าจะต้องพาเรดวินเทอร์ไปในทางที่ดีขึ้นให้ได้..."
10055190-53 = "หืม? มารินะ วางแผนยึดอำนาจด้วยเหรอ?"
10055190-54 = "ดูเหมือนจะยังกวาดล้างไปไม่หมดนะคะ..."
10055190-55 = "อ๊ะ?! ไม่ใช่นะคะ! หลังจากการกวาดล้างครั้งก่อน ฉันก็จงรักภักดีต่อสำนักเลขาธิการอย่างสุดๆ เลยค่ะ!"
10055190-56 = "ก็เห็นอยู่ว่าเป็นแบบนั้น แล้วความก้าวหน้ากับความสามัคคีที่ว่าอยู่ตรงไหนคะ?"
10055190-57 = "อะฮะฮ่า! มีโรงเรียนที่หนักกว่าโรงเรียนเราอยู่ด้วยสินะคะ!"
10055190-58 = "จิอากิ..."
10055190-59 = "บางครั้งเธอก็พูดอะไรแรงๆ ได้หน้าตาเฉยเลยนะคะ?"
10055190-60 = "เอ๋?!"
10055190-61 = "ฮึ่ม! ทุกคนเสียงดังกันจริงๆ! ยังไงเป้าหมายของทั้งสองฝ่ายก็มีแค่สิ่งนี้เท่านั้นละ!"
10055190-62 = "เราจะโค่นพวกเธอด้วยปูไร้เทียมทาน <ผู้กวาดล้าง No.2>!"
10055190-63 = "อะ... อะไรกัน?! ปูยักษ์นั่นน่ะ?!"
10055190-64 = "แบบนี้ไม่ผิดกติกาเหรอ?!"
10055190-65 = "ฮุฮุฮุ ไม่ผิดกติกาค่ะ <แคร็บไฟต์> อนุญาตให้สัตว์เปลือกแข็งทุกชนิดลงแข่งได้ค่ะ"
10055190-66 = "คุ้มค่ากับการที่อุตส่าห์ลำบากไปหาปูที่เหมาะกับเกียรติของท่านเชริโน่มาจริงๆ ค่ะ"
10055190-67 = "อ๊ายยยย! พวกปูเสฉวนตกใจกับขนาดของศัตรูจนหงอไปแล้วค่ะ!"
10055190-68 = "ว่าไงนะ?! ลุกขึ้นมา ไทเกอร์ชาร์กมารุ! แกไม่ใช่ปูที่จะยอมแพ้อะไรง่ายๆ แบบนี้ไม่ใช่รึไง!"
10055190-69 = "นิ่งสนิทเลยค่ะ..."
10055190-70 = "เป็นไปได้ยังไง! เราจะแพ้ตั้งแต่ยังไม่ทันสู้งั้นเหรอ?!"
10055190-71 = ""
10055190-73 = ""
10055190-74 = "อืม คงจะกลัวสินะ..."
10055190-75 = ""
10055190-77 = ""
10055190-78 = "ไม่เป็นไรนะ อิบูกิจะจับมือเอาไว้เอง"
10055190-79 = ""
10055190-81 = "โอ๊ะ?! พวกปูเสฉวนที่กำลังกลัวขยับก้ามหนีบเหมือนเข้าใจคำพูดของอิบูกิจังเลย...!"
10055190-82 = "...! อย่าบอกนะว่าเพิ่งจะถูกปลุกให้ตื่นขึ้นมาตอนนี้?!"
10055190-83 = "พรสวรรค์แคร็บไฟต์เตอร์ของอิบูกิน่ะ...?!"
10055190-84 = "ถ้าสู้ไปด้วยกันก็ไม่มีอะไรน่ากลัวหรอก!"
10055190-85 = "ไปกันเถอะ คุณจอมหยิก! ไปสั่งสอนพวกปูนิสัยไม่ดีด้วยกัน!"
10055190-86 = "หยิก~!"
