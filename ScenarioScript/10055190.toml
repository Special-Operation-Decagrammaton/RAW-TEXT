10055190-14 = "...Oh, Satsuki. Are you all right?"
10055190-15 = "Makoto! You scared me half to death!"
10055190-16 = "Hm... Such a blunder. I can't believe I overlooked something so important."
10055190-17 = "Gehenna has one more hurdle to overcome, even after Trinity!"
10055190-19 = "Huh? Was there another academy besides Trinity that we needed to watch out for...?"
10055190-20 = "Iroha, you were there with me! Don't tell me you failed to notice!"
10055190-21 = "I was there with you... Are you talking about...?"
10055190-22 = "Heeheehee. Sharp as ever, Chairman Makoto."
10055190-23 = ""
10055190-25 = ""
10055190-26 = ""
10055190-27 = "That's right! It is I, the esteemed president of Red Winter Academy, Beautifier of Lands, Great Leader, Athletics Club Captain, Chief of Sanitation...!"
10055190-28 = ""
10055190-29 = "\n\n#st;[400,95];smooth;90;The Unfrozen, Invincible#n& Ironclad Port"
10055190-32 = ""
10055190-34 = "...Beautifier of Lands, and, um..."
10055190-35 = "She is also the Head of All Prefects, Maven of Meal Service, and this month's Best Pudding Taster, Cherino."
10055190-36 = "Yes! Well said!"
10055190-37 = "And now, I am also the proprietress of this seaside hot spring, AND the strongest Crab Fighter!"
10055190-38 = ""
10055190-40 = ""
10055190-41 = "Wait..."
10055190-42 = "You were worried more about Red Winter than Trinity, Makoto?"
10055190-43 = "N-No!!"
10055190-44 = "You think I'd worry that my tenure at Gehenna might lead us to...?"
10055190-45 = "I have never ONCE worried that we might fall behind Red Winter and its brat of a leader! Not even a little!"
10055190-46 = "That's an awfully specific thing to not worry about..."
10055190-47 = "She's right, Makoto. Red Winter, of all places?"
10055190-48 = "You only say that because you haven't seen it for yourself, Satsuki!"
10055190-49 = "Their vast territory seems to stretch on forever, and their students are countless!"
10055190-50 = "If a strong enough leader, like me, the Great Makoto, were ever to unite them...their potential could surpass Gehenna, if not all three of Kivotos' greatest academies!"
10055190-51 = "Yes, Chairman Makoto! You understand Red Winter well!"
10055190-52 = "Our last coup may have ended in failure, but the next will surely lead Red Winter to a bright new era."
10055190-53 = "Oh? Marina, are you planning another coup?"
10055190-54 = "...It seems the last purge wasn't thorough enough."
10055190-55 = "What?! No! Ever since the last purge, I have been COMPLETELY loyal to the Secretariat!"
10055190-56 = "I don't think we have to worry about them uniting anytime soon."
10055190-57 = "Ahahaha! There's an academy worse than us!"
10055190-58 = "...Chiaki."
10055190-59 = "I don't think you know how harsh you can be sometimes."
10055190-60 = "Huh?!"
10055190-61 = "Argh! Enough! You know why we're all here!"
10055190-62 = "I'll crush you with the invincible crab, \"The Purginator No. 2\"!"
10055190-63 = "W-Wait, that crab is huge!"
10055190-64 = "That CAN'T be legal."
10055190-65 = "Oh, it's legal. The rules clearly say ANY species of crustacean can participate in a \"Crab Fight.\""
10055190-66 = "All that effort finding a crab worthy of Great Leader Cherino really did pay off."
10055190-67 = "Ahhh! Look, the hermit crabs are cowering in its shadow!"
10055190-68 = "What?! Get up, Tigersharkmaru! You're braver than this! You're stronger!"
10055190-69 = "...Annnd no response."
10055190-70 = "It can't be! Are we going to lose before the fight even begins?!"
10055190-71 = ""
10055190-73 = ""
10055190-74 = "...It's okay. I know. I know you're scared."
10055190-75 = ""
10055190-77 = ""
10055190-78 = "Here. Let Ibuki hold your claw."
10055190-79 = ""
10055190-81 = "Ooh, look! The little crab's raising its claw. Did it actually understand her?"
10055190-82 = "*gasp* Could it be? Has it awakened, here and now?"
10055190-83 = "Ibuki's talent as a Crab Fighter...?!"
10055190-84 = "We can be brave if we fight together!"
