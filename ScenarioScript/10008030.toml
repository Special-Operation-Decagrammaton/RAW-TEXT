[translation]
10008030-1 = "제3화;엉망진창 추격전 개시!"
10008030-7 = "거기 멈춰어어어엇!!"
10008030-8 = "아하하핫!! 쫓아라~!"
10008030-9 = "기, 기다려 주세요오……!"
10008030-11 = "핫핫핫! 그 누구도 히어로의 걸음을 멈출 순 없는 법!"
10008030-16 = "하아하아. 생각보다 재빠르잖아……."
10008030-17 = "아아~ 이대로 있으면 놓치겠는데? 아루 쨩?"
10008030-18 = "아니, 저 녀석들. 괴상한 차림을 하고 있는 주제에 발은 왜 이렇게 빠른 건데?!"
10008030-19 = "대체 카이텐져라니 뭐하는 놈들인 거냐구! 무슨 목적으로 이 몸의 새전함을 훔쳐 가는 거야?!"
10008030-20 = "뭐, 카이텐져라면 키보토스에서도 꽤 유명한 녀석들이야."
10008030-21 = "'정의를 위해서'라느니 뭐니 하면서 여기저기서 문제를 일으킨다고 할까."
10008030-22 = "저, 저도 카이텐져에 대해서라면 조, 조금이지만 알고 있어요."
10008030-23 = "달리기는 마하 3의 속도를 자랑하고, 그 키, 킥력은 5톤을 상회한다고……."
10008030-24 = "지, 진짜?!"
10008030-25 = "게, 게다가 카이텐져가 더욱 무서운 건 숨겨둔 비장의 무기가 있어서……."
10008030-26 = "여차할 때는 적을 쓰러트리기 위해 거대로봇 KAITEN FX를 호출한다고……."
10008030-27 = "우와~ 하루카 쨩. 그건 또 어디서 알아낸 정보야?"
10008030-28 = "카, 카이텐져 홍보 홈페이지였어요……."
10008030-30 = "홍보 홈페이지도 있는 거야?! 우리 흥신소도 없는데?!"
10008030-31 = "푸흐흐흡! 아하하하!! 꽤 본격적이잖아? 우리보다 나은 거 아냐, 아루 쨩?"
10008030-32 = "그, 그런 이상한 놈들에게 이대로 빼앗길까 보냐아~!"
10008030-36 = "이런 바쁜 순간에, 또 뭐야?!"
10008030-45 = "어이어이, 거기! 우리의 먹잇감을 노리다니!"
10008030-46 = "백만 년은 이르다고! 어이어이!"
10008030-48 = "흐응~ 뭐야뭐야~? 또 다른 방해꾼들?"
10008030-49 = "저 녀석들 헬멧단?"
10008030-51 = "맞아맞아! 카이텐져가 훔쳐 간 새전함은, 우리의 것이다! 네놈들이야말로 우릴 방해할 생각일랑 말고 썩 꺼져!"
10008030-52 = "그래! 어디까지나 빼앗은 놈이 임자!"
10008030-53 = "행사장으로부터 카이텐져가 빼앗았다면, 이번엔 우리가 빼앗으면 될 일! 이런 아이디어를 떠올리다니! 역시 우리야."
10008030-54 = "무지 똑똑해!"
10008030-59 = "……큭큭. 이해하기 쉬워서 좋네."
10008030-60 = "아까부터 불쾌한 기분이 사라지지 않고 있었거든. 잘됐네. 기분 전환용으로 딱이야."
10008030-61 = "무츠키, 카요코, 하루카, 그리고 세리카."
10008030-68 = "해치워."
10008030-72 = "뭐, 뭐야!! 난 네 부하가 아니거든?!"
10008030-73 = "그래도 해치울 거지만!"
