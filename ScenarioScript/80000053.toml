[translation]
80000053-1 = "그렇게 먹지 말라고!"
80000053-2 = "(코하루의 연락을 받고 하교 시간에 맞춰 정문에서 기다렸다.)"
80000053-7 = "(우르르 몰려나오는 학생들 속에서 우물쭈물하고 있던 코하루를 발견했다.)"
80000053-11 = "느, 늦었어! 선생님! 뭐 하느라 이제 온 거야!"
80000053-12 = "[s1] \"……예?\"\n[s2] \"아니. 너도 이제 막 나왔잖아.\""
80000053-13 = "아, 아니. 내가 무슨 소리를……. 이런 말 하려고 했던 게 아니었는데……."
80000053-14 = "그, 그야 나는 이제 끝났으니까……!"
80000053-15 = "아, 아무튼! 중요한 건 그게 아니고……!"
80000053-16 = "자, 자……! 이거 받아! 오늘은 특별히 선생님을 위해 준비한 거니까!"
80000053-23 = "[ns3] \"이건 초콜릿이잖아.\"\n[ns4] \"아. 발렌타인 선물이구나.\""
80000053-24 = "왜, 왜 그렇게 태연한 건데!? 발렌타인 초콜릿이잖아!? 여고생에게서 받은 거잖아!?"
80000053-25 = "왜, 왜 그렇게 태연한 건데!? 발렌타인 초콜릿이잖아!? 여고생에게서 받은 거잖아!?"
80000053-26 = "좀 더 자리와 물건에 어울리는 반응을 보이란 말이야! 내가 무안해지잖아!"
80000053-30 = "……으, 으응!? 뭐 하는 거야, 선생님?"
80000053-31 = "지금 바로 열어보는 거야? 여기서 먹는 거야……?"
80000053-32 = "뭐, 안 되는 건 아니지만……."
80000053-38 = "……어……."
80000053-39 = "[s5] \"……? 코하루?\"\n[s6] \"왜 그래? 갑자기 얼굴이 굳었어.\""
80000053-40 = "아, 아냐. 그냥……. 어……. 그……. 사, 살 때는 별생각이 없어서 몰랐는데……."
80000053-41 = "아, 아냐. 그냥……. 어……. 그……. 사, 살 때는 별생각이 없어서 몰랐는데……."
80000053-42 = "그 초콜릿……. 무, 무늬……. 무늬가……!"
80000053-43 = "[s] \"……무늬?\""
80000053-44 = "아, 아무것도 아냐! 그냥 신경 쓰지 마……. 응! 그, 그냥 무늬일 뿐이니까……!"
80000053-48 = "……."
80000053-57 = "뭐, 뭐 하는 거야!? 왜 그런 식으로 먹는 건데!! 그냥 평범하게 먹으라고!!"
80000053-58 = "[s] \"대체 왜 그러는 거야…….\""
80000053-59 = "힉……. 히이익!! 그렇게 말했는데도 계속 그런 식으로 핥아 먹고……!"
80000053-60 = "역시……. 역시 알고서 그러는 거지!? 처음부터 노리고 있던 거였구나!"
80000053-61 = "나를 생각하면서 그런 식으로……! 엉망진창으로……!"
80000053-62 = "어, 어쩌면 지금 이 상황도……!? 서, 설마! 내가 그걸 보는 것을 즐기는 거야……!? 다른 학생들이 보는 것도……!?"
80000053-63 = "[s7] \"?????????\"\n[s8] \"……예???\""
80000053-64 = "저질! 변태!"
80000053-65 = "저질! 변태!"
80000053-66 = "사형이야, 사형!!"
80000053-68 = "(끝내 코하루가 화내는 이유를 알지 못한 채, 초콜릿을 모두 먹고 샬레로 돌아왔다.)"
