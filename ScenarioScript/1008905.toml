[translation]
1008905-1 = "또 동결된 계좌"
1008905-3 = "(약속된 시간이 되어도, 어째서인지 아루가 나타나지 않았다.)"
1008905-7 = "[ns1] \"무슨 일이 있는 걸까…….\"\n[ns2] (연락을 취해 봐야 하나……?)"
1008905-11 = "아, 아니. 저기, 그게……."
1008905-12 = "자, 잠깐만요! 잠깐만 기다려 주시겠어요? 어, 어째서……? 설마 또……?"
1008905-14 = "[ns3] \"……아루 목소리?\"\n[ns4] 목소리가 들린 쪽으로 향한다."
1008905-18 = "으음. 곤란하게 됐는걸……. 학생도 물론 난처하겠지만……."
1008905-19 = "그, 그러니까 이게……. 돈이 없는 게 아니고! 지금 돈이 있긴 한데……!"
1008905-20 = "아냐, 아냐. 딱히 학생을 나무라는 건 아니니 그렇게 당황하지 않아도 돼. 그럴 수도 있지."
1008905-21 = "당연히 이쪽도 사정을 봐주고는 싶지만……."
1008905-22 = "평범한 옷이라면 모를까 이렇게 비싼 옷의 수선비를 외상으로 하는 건 좀 어려워서……."
1008905-23 = "절대로 학생이 떼먹을 것 같다거나 그런 이야기가 아니야. 가게 방침이라 그렇지. 이해해 주게."
1008905-24 = "[s5] \"아루? 무슨 일이야?\"\n[s6] 사정에 대해 물어본다."
1008905-27 = "……응? ……선생님?"
1008905-28 = "음?"
1008905-32 = "……!? 선생님!?!? 어, 어어, 어째서 여기에……!!"
1008905-33 = "아, 아직 약속 시간은……!!"
1008905-34 = "……헉."
1008905-35 = "벌써 시간이……!?!?"
1008905-40 = "[ns7] \"과연, 카드가 막혔다…….\"\n[ns8] \"그래서 수선비를 못 내고 있었구나.\""
1008905-43 = "아무래도 또 선도부가 내 계좌를 찾아내서 동결시킨 모양이야. 이번엔 안 들키게끔 만들었다고 생각했는데……."
1008905-44 = "하아……. 곤란하네. 되찾으려면 시간이 좀 걸리겠어."
1008905-48 = "으음……."
1008905-49 = "아으……! 정말……! 이런 모습을 보이려던 건 아니었는데……!!"
1008905-50 = "응? ……현금은 없냐고? 그럴 리가."
1008905-51 = "물론 나도 현금 정도는 들고 다니지만, 아무래도 이번 수선은 수선비가……."
1008905-55 = "꽤 값나가는 옷이라서 말이야. 재료도 신경 쓰고 인건비도 많이 들었거든."
1008905-56 = "학생이 지금 들고 있는 현금 정도로는 많이 부족해서……."
1008905-57 = "……음?"
1008905-58 = "무슨 옷이냐고? 아아. 바로 이 옷인데……."
1008905-63 = "[ns9] \"어라. 이 옷…….\"\n[ns10] \"과연, 이거라면 수선도 비싸겠지.\""
1008905-66 = "그래서 문제란 말이지. 보통 옷이라면 적당히 외상으로 해줘도 괜찮겠지만, 이건 좀……."
1008905-67 = "……응? 뭐라고?"
1008905-68 = "그쪽이 대신 내주겠다고? ……수선비를?"
1008905-69 = "……선생님!?!?"
1008905-70 = "안 되냐고? 아니. 안 될 거 없지. 학생도 당장 오늘 이 옷이 필요했던 것 같고……."
1008905-71 = "잘 됐구만, 학생! 잘 됐어! 하하하!!"
1008905-76 = "(이후 수선비를 대신 결제해 주고, 옷을 받은 아루와 함께 상점가를 빠져나왔다.)"
1008905-82 = "후훗……. 고마워, 선생님. 의도치 않게 빚을 졌네."
1008905-83 = "이, 이건 그……. 뭐라고 해야 할까……."
1008905-84 = "아, 아니. 뭐라고 해야 할까가 아니라 뭐라고 할까……. 그……."
1008905-85 = "……투, 투자!"
1008905-86 = "그래, 맞아! 투자야! 나와 우리 흥신소에 대한 선생님의 신용 투자인 걸로 하지!!"
1008905-87 = "그러니까……. 음……."
1008905-91 = "고, 고마워……. 그리고 미안……. 어쩌면 폐가 됐을지도 모르겠네……."
1008905-92 = "……응?"
1008905-93 = "그런 거 아니라고……? 의외로 흔한 일……?"
1008905-94 = "그, 그게 무슨 이야기야? 흔한 일이라니?"
1008905-95 = "[s11] \"사업하다 보면 신용도로 해결하는 일도 생기니까.\"\n[s12] \"나도 가끔 미래의 나에게 부탁하곤 하니까!\""
1008905-98 = "…………!!"
1008905-99 = "후, 후훗……. 과연, 역시 선생님. 자문을 구할 가치가 있는 사람이네."
1008905-100 = "이해했어. 그런 거라면야 역시 방금 전 했던 말을 다시 해줄 필요가 있겠네."
1008905-104 = "……이건 투자야, 선생님. 이 리쿠하치마 아루가 오늘의 일을 똑똑히 기억했으니까."
1008905-105 = "앞으로 필요한 일이 있을 때에는, 언제나 부담 없이 연락해도 좋다고!"
1008905-106 = "후후, 후후후……!"
1008905-111 = "……아. 맞다."
1008905-114 = "그러고 보니……."
1008905-115 = "오늘 수선비, 어디로 넣어주면 돼?"
1008905-119 = "(이후 괜찮다는 만류에도 불구하고, 아루는 계좌를 복구하자마자 수선비를 돌려주었다.)"
