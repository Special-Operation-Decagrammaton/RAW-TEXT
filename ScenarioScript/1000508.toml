[translation]
1000508-1 = "행운을 잡는 법"
1000508-2 = "D.U. 외곽 쇼핑몰"
1000508-4 = "(호시노와 함께 한참 동안이나 돌아다닌 끝에, 원하는 책을 구입했다.)"
1000508-5 = "으헤, 덕분에 살았어 선생."
1000508-6 = "우리 동네는 시골이라서 이런 최신판을 구하기가 힘들단 말이지."
1000508-8 = "짜안- <월간 아쿠아 하비 특별본>! 부록으로 열대어 2000종 양장 도감까지!"
1000508-9 = "이게 천 엔이라니, 굉장하지 않아? 부록까지 완전 빵빵한데도 말이지?"
1000508-10 = "하아…… 빨리 펼쳐보고 싶어. 어디든 들어가자고!"
1000508-12 = "[s] 따라간다."
1000508-14 = "헤에- 이것 봐, 집에서 성게 키우는 법이래."
1000508-15 = "해수 수족관이라는 건 꽤 난이도가 높다고 하던데 말이지. 흐음."
1000508-16 = "[s] \"호시노는 물고기를 좋아하는구나?\""
1000508-17 = "으헤~ 뭐, 키우고 싶지만…… 이렇게 보고만 있어도 즐거우니까 괜찮아."
1000508-19 = "……."
1000508-20 = "……어. 역시 좀 아이 같으려나……. 이 나이에 이런 취미를 가진 사람은 별로 없을 거 같은데……."
1000508-21 = "[s1] \"상관없지 않을까.\"\n[s2] \"취미는 나이와 관계없어.\""
1000508-22 = "……으헤헤."
1000508-23 = "……으헤헤."
1000508-24 = "……어라? 이것 봐, 선생. 뒷쪽에 즉석 복권 티켓이 있어."
1000508-25 = "<아쿠아리움 개장 기념 무료 입장권 30명 추첨 티켓> #n……우, 우와아아?! 뭐야, 이거?"
1000508-26 = "아쿠아리움이라는 건…… 그러니까……."
1000508-27 = "[s] \"엄청 큰 수족관인가.\""
1000508-28 = "엄청 큰 수족관……?!"
1000508-29 = "……!!"
1000508-30 = "그, 그러니까 1만5천엔 짜리 티켓을 두장이나 준다는 거야?"
1000508-31 = "이 즉석 복권을 긁으면 되는 거지? 기, 기다려 봐!"
1000508-32 = "도, 동전이……."
1000508-34 = "서, 선생! 행운을 빌어줘!"
1000508-35 = "[s3] \"파이팅!\"\n[s4] \"힘 내!\""
1000508-36 = "(사각사각)"
1000508-37 = "(사각사각)"
1000508-38 = "(사각사각사각)"
1000508-39 = "(사각사각) ……아."
1000508-40 = "[s5] \"당첨이야?\"\n[s6] \"어떻게 됐어?\""
1000508-41 = "……꽝이야."
1000508-42 = "……꽝이야."
1000508-43 = "……으헤, 역시 이런 행운이 제 발로 찾아올 리는 없겠지."
1000508-44 = "……."
1000508-45 = "자아, 그럼 가자고, 선생."
1000508-46 = "오늘은 선생이랑 같이 잔뜩 돌아다니고 원하는 책도 샀으니, 꽤 좋은 하루였다고."
1000508-47 = "[s] 호시노를 데리고 서점으로 간다."
1000508-48 = "응? 뭐, 뭐하는 거야, 선생? 어디 가?"
1000508-51 = "……."
1000508-52 = "(같은 책을 50권 더 사버렸다.)"
1000508-53 = "……. 이건 말이지. 선생……. 무슨 의미냐면……."
1000508-54 = "[s] \"포기하긴 일러! 될 때까지 긁는 거야!\""
1000508-55 = "……."
1000508-56 = "으헤~ 뭐, 좋아. 딴지 거는 건 내 역할이 아니니 어른의 장난에 장단을 맞춰볼까나~"
1000508-57 = "간다! 30번 안에 당첨돼 주겠어!!"
1000508-58 = "이야아아압-!!"
1000508-60 = "(다행히 38번만에 당첨되었고, 호시노에게 티켓을 선물해줄 수 있었다.)"
1000508-61 = "(남아버린 50권의 책은 어떻게 처리할까 고민하다가 샬레의 도서관에 보관해두기로 결정했다.)"
