[translation]
2300103-1 = "후우카 씨의 오늘의 밥상"
2300103-2 = "와주셨군요. 선생님."
2300103-3 = "[s] \"문자를 받고 오긴 했는데 말이야.\""
2300103-4 = "저……. 최근에 이야기를 들었어요."
2300103-5 = "선생님이 살레의 업무 때문에 밤낮으로 바쁘단 이야기를요."
2300103-6 = "그래서 밥도 제때 챙겨 드시지 못한다면서요?"
2300103-7 = "그러면 안 돼요!"
2300103-8 = "선생님은 어른이시잖아요?"
2300103-9 = "어른이라면 더 착실하게 건강을 챙기셔야죠!"
2300103-10 = "[s] \"거기엔 어른의 사정이라는 게…….\""
2300103-11 = "변명은 떽. 됐습니다!"
2300103-12 = "이건 긴급사태예요. 급양부 부장이 나서야 할 특별 사안……!"
2300103-13 = "그렇지 않아도 어제 장을 본 건 바로 오늘을 위해서였어요."
2300103-14 = "[s] \"학생식당 식료품을 사려던 거 아니었어?\""
2300103-15 = "겸사겸사라는 거예요. 학생식당도 중요하지만."
2300103-16 = "선생님의 식단 개선도 급양부에겐 최우선 선결과제이니까요!"
2300103-17 = "사람의 힘은 어디까지나 밥에서 나오는 법. 든든하게 챙겨 먹어야 탈이 나지 않는 법이에요!"
2300103-18 = "그런 의미에서 오늘 대접해드릴 요리는 바로."
2300103-20 = "게헨나 급양부식 가이세키 18선!"
2300103-21 = "그럼, 각오해주세요. 선생님!"
2300103-23 = "먼저 전채 요리예요."
2300103-24 = "백된장에 팥과 두부를 으깨어 만든 거죠."
2300103-25 = "[s1] \"음, 두부, 맛있다……!\"\n[s2] \"백된장의 풍미와 팥의 앙상블이 놀라워!\""
2300103-26 = "후, 후후, 후후후! 그럼 다음 요리는……."
2300103-27 = "후, 후후, 후후후! 그럼 다음 요리는……."
2300103-30 = "이번엔 대합으로 육수를 우려내 만든 완탕이에요."
2300103-31 = "따듯할 때 쭈욱 들이켜주세요!"
2300103-32 = "[s3] \"음, 국물, 맛있다……!\"\n[s4] \"대합과 새우살이 풍기는 해산물의 풍미가 굉장해!\""
2300103-33 = "아직 놀라기는 일러요. 다음 요리는……."
2300103-34 = "아직 놀라기는 일러요. 다음 요리는……."
2300103-37 = "이번엔 이걸!"
2300103-39 = "또 이번엔 이 음식을!"
2300103-41 = "또또또 이번엔 이걸 드셔보세요. 선생님!"
2300103-43 = "(그렇게 후우카가 내온 18종의 요리를 전부 맛보았다.)"
2300103-45 = "선생님? 왠지 안색이 안 좋으신 것 같은……."
2300103-46 = "[s] \"끄으윽. 배, 배가.......\""
2300103-47 = "네? 배가?"
2300103-48 = "배가 어떻게 되었다는 말씀이신가요?"
2300103-51 = "서, 선생님?!"
2300103-53 = "(이후, 게헨나의 양호실에서 소화제를 잔뜩 처방받았다.)"
