[translation]
214-1 = "[ruby=Late Night with the Lore]ทอล์กโชว์เรื่องตำนาน[/ruby]"
214-3 = ""
214-4 = ""
214-5 = "ยินดีต้อนรับสู่รายการทอล์กโชว์ยามดึกของมิสเตอร์ออร์เวลล์!"
214-6 = "ใช่แล้ว!"
214-7 = "สวัสดีครับ ท่านสุภาพบุรุษและสุภาพสตรี"
214-8 = "อำนาจที่กำหนดนิยามของโลกในยุคสมัยใหม่ ผมมิสเตอร์ออร์เวลล์ จะนำเสนอ 'พานอพลี' ทั้งหมดของโลกให้ทุกท่านรู้จักครับ"
214-9 = "ข้อความที่ผมจะนำเสนอในวันนี้เป็นครีปปี้พาสต้าที่ได้รับความนิยมอย่างมาก เป็นการผสมผสานสัญลักษณ์สองอย่างที่พบเห็นได้ทั่วไป"
214-10 = "ขอแนะนำให้ทุกท่านได้รู้จักกับ... <ดรัมบาร์กา>!"
214-11 = ""
214-14 = "ใช่แล้ว! ใช่แล้ว!"
214-15 = "สัญลักษณ์ที่ประกอบขึ้นมาเป็นดรัมบาร์กานั้นเรียบง่ายเหลือเกินครับ"
214-16 = "ด้วยการผสมผสานระหว่าง 'ความเชื่อจากข่าวลือ' อันไร้สาระที่ว่ามีใครบางคนกำลังบงการปู#nเพื่อทำร้ายผู้คน กับ 'สามัญสำนึก' ที่ว่าหากเป็นเช่นนั้นได้จริง ปูตัวนั้นต้องมีขนาดมหึมาจนสามารถ#nกลืนกินได้ทั้งท่าเรือ..."
214-17 = "ข้อความใหม่จึงถือกำเนิดขึ้นในรูปแบบที่ไม่มีใครคาดคิดมาก่อนครับ"
214-18 = "ใช่แล้ว!"
214-19 = "ครีปปี้พาสต้าเรื่องใหม่ที่ปรากฏในโลกจำลองนี้เป็นผลมาจากอิทธิพลของภาพลวงตาที่สื่อสร้างขึ้น#nจริงหรือเปล่า?"
214-20 = "หรือว่ามันคือร่องรอยแห่งความขัดแย้งที่หงส์ดำที่บินมาจากนอกโลกทิ้งเอาไว้?"
214-21 = "จนกว่าคอมมูนิตี้เสมือนจริงจะมอดไหม้และสถานที่ศักดิ์สิทธิ์จะกลายเป็นเถ้าถ่านไป— ขอเชิญเข้าร่วมการอภิปรายในตอนนี้เลยครับ!"
214-22 = "เพราะรายการนี้เป็นของพวกเราทุกคน!"
214-23 = "ใช่แล้ว!"
214-24 = ""
214-26 = ""
214-27 = ""
214-28 = "เป็นยังไงบ้างครับ คุณกำลังอ่านข้อความอะไรจากสัญลักษณ์นั้นอยู่ครับ?"
214-29 = "ในห้องสมุดอันไร้ขอบเขตของเรื่องลึกลับ มีต้นฉบับที่หลากหลายและจำนวนมากพอๆ กับเม็ดทราย#nเลยละครับ"
214-30 = "มันอาจเป็นการเปิดเผยเรื่องลึกลับที่แต่งขึ้นอย่างโหดร้ายที่แพร่หลายในคอมมูนิตี้"
214-31 = "หรืออาจเป็นการล้อเลียนหรือการแสดงความเคารพต่อสื่อเก่าแก่"
214-32 = "หรือหากไม่ใช่แบบนั้น ก็อาจจะเป็นเพียงการดัดแปลงเล็กๆ น้อยๆ ที่เกิดขึ้นจากความนึกสนุกของ#nผู้สร้างสรรค์ผลงานก็เป็นได้"
214-33 = "แต่ก็ไม่มีคำตอบที่ตายตัวสำหรับการตีความหรอกครับ"
214-34 = "เพราะคุณค่าของสัญลักษณ์นั้น ขึ้นอยู่กับการเลือกของผู้บริโภคอย่างพวกคุณทุกคนครับ!"
214-35 = "ใช่แล้ว!"
214-36 = "ต่อไปจะเป็นช่วงโฆษณาครับ"
214-37 = "โปรดอย่าเปลี่ยนช่องไปไหน จนกว่าจะถึงข้อความใหม่นะครับ!"
214-38 = "ใช่แล้ว!"
