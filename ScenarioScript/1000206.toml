[translation]
1000206-1 = "진정한 미식"
1000206-2 = "D.U. 외곽 지구"
1000206-3 = "어머나, 선생님?"
1000206-4 = "이런 곳에서 또 우연히 만나다니."
1000206-5 = "또 느긋하게 여기 저기를 방황하고 계셨나요?"
1000206-6 = "후후. 그건 저도 마찬가지인지라, 반갑기도 하고, 안심도 되네요."
1000206-7 = "[s] \"하루나는 뭐하고 있었어?\""
1000206-8 = "저는 새로운 맛집 탐험을 위해서 여기저기 헤메고 있는 중이었어요."
1000206-9 = "SNS에서 새로운 신흥 강자라고 주장하는 맛집을 찾아갔지만……."
1000206-10 = "제 기대와는 너무 달라서……."
1000206-11 = "[s] \"설마 또 가게를 폭파한 거야?\""
1000206-12 = "후후……. 저라고 맨날 그러지는 않는다고요."
1000206-13 = "음…… 그치만 요즘 뭔가 먹는 것에 조금 생각이 깊어져서……."
1000206-14 = "[s] \"고민이 많구나.\""
1000206-15 = "……후후. 말씀 감사합니다."
1000206-16 = "모처럼 선생님과 함께 가는 길이니, 잠깐 같이 걸어도 될까요?"
1000206-17 = "[s] \"물론이야.\""
1000206-21 = "(하루나랑 이런 저런 음식 이야기를 하며 걷고 있을 때쯤,)"
1000206-22 = "(붕어빵 가게가 눈에 띄었다.)"
1000206-23 = "[s] \"붕어빵 먹을래?\""
1000206-24 = "……붕어빵인가요."
1000206-25 = "……후후. 네. 사주세요. 선생님."
1000206-27 = "네, 감사합니다!"
1000206-29 = "……후후."
1000206-32 = "― 후후, [wa:2000]이렇게 함께 귀가하는 길이라니,"
1000206-34 = "― 붕어빵도 이렇게 잔뜩 사버렸구요."
1000206-37 = "[wa:300]― 붕어빵은 [wa:800]조금 소박하지 않냐[wa:1900]구요?"
1000206-40 = "[wa:300]― 아뇨…… [wa:1100]저에겐 [wa:1500]최고로 사치스러운 순간인걸요."
1000206-43 = "― 자, [wa:1000]선생님. [wa:1000]이거 드릴게요."
1000206-45 = "[wa:300]― ……아뇨. [wa:1000]아아- [wa:500]하셔야죠."
1000206-48 = "[ns] \"아아-\""
1000206-49 = "― 제일 좋아하는 사람과 함께 [wa:2500]제일 좋아하는 음식을 먹는다."
1000206-52 = "― 이게 바로……."
1000206-55 = "[ns] \"뭔가 부끄러운데…….\""
1000206-56 = "― 응? [wa:1300]그 표정은 [wa:1200]뭔가요?"
1000206-59 = "― 후훗. [wa:1500]그런 반응도 [wa:1500]싫어하지 않습니다."
1000206-62 = "― 춥지 않냐[wa:1500]고요?"
1000206-65 = "― 아뇨. [wa:1000]따뜻해요. [wa:1800]정말로."
1000206-68 = "(하루나와 사이좋게 붕어빵을 나눠먹으며, 집으로 돌아갔다.)"
