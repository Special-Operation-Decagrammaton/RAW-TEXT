[translation]
1008202-1 = "청춘의 스승님"
1008202-3 = "(그렇게 렌게의 상담 요청에 따라 백화요란의 조정실을 찾게 되었다.)"
1008202-7 = "핫!"
1008202-20 = "하앗!"
1008202-28 = "다시 한번!"
1008202-29 = "핫!"
1008202-36 = "좋았어. 그럼 이것으로 마무리다!"
1008202-43 = "하아아앗!!!"
1008202-53 = "[ns] \"저기, 마지막만 명백하게 장르가 다르지 않아?!\""
1008202-57 = "어? 선생님……?"
1008202-59 = "방금 그건 어떻게 한 거냐고?"
1008202-60 = "그야 그거라면 우리 백화요란에 대대로 내려오는 사격술을 활용해서, 이렇게 하고…… 요렇게 해서 하는…. 그런 느낌…이려나?"
1008202-61 = "[s1] \"그, 그렇구나…….\"\n[s2] \"그래서 방금 건 역시 평소 백화요란이 하는 아침 단련이야?\""
1008202-64 = "응. 맞아."
1008202-65 = "우리 백화요란 분쟁조정위원회는 백귀야행 내에서도, 뭐…… 나름 역할을 맡고 있으니까."
1008202-66 = "그 어떤 상황이라도, 또 혹시 모를 사태에 대비할 수 있도록 체력단련은 물론."
1008202-67 = "아까 같은 사격 훈련도 게을리하지 않고 있거든."
1008202-68 = "후후, 듣고 놀라지 마시라. 오늘의 나는 백발백중! 컨디션은 최상이야!"
1008202-69 = "[s3] \"과연……. 평소에도 허투루 단련하지 않는다니.\"\n[s4] \"역시 백화요란…… 아니, 백화요란의 돌격대장!\"\n[s5] \"후와 렌게 양! 굉장해!\""
1008202-75 = "으응?!"
1008202-76 = "에이~ 그렇게 칭찬해도 아무것도 안 나온다고~?"
1008202-77 = "이 정도야 백화요란이라면 누구나 다들 하는 거고~"
1008202-78 = "물론~! 선생님이 칭찬해 준다면야 그건 그것대로 엄청 기쁘니까. 일부러 거절 같은 건 안 하겠지만은~ 헤헷."
1008202-82 = "……………이 아니라."
1008202-83 = "어, 어흠…. 그보다, 그게……."
1008202-84 = "선생님, 생각보다 일찍 왔네? 오전 훈련이 채 끝나기도 전에 도착하다니."
1008202-85 = "[s] \"아, 응. 렌게의 연락을 받자마자 바로 온 거니까.\""
1008202-86 = "아차, 너무 신경 쓰게 만들어버렸나~"
1008202-87 = "바로 달려와줬다고 하니, 그것도 무진장 기쁘긴 한데……."
1008202-88 = "그…… 이렇게 빨리 올 줄 몰랐달까. 이쪽으로선 예상치 못한 사태라고 할까."
1008202-89 = "아직 준비가 제대로 되어있지 않다고 할까. 그게, 그러니까……."
1008202-95 = "[ns] \"나는 괜찮으니까. 렌게가 말했던 상담하고 싶다던 게…….\""
1008202-97 = "우, 우와아앗!"
1008202-98 = "[s] \"으, 으응?! 렌게?! 왜 그래?!\""
1008202-99 = "자자자자, 잠깐! 타임! 타임이야!"
1008202-103 = "그 이상 다가오지 마! 선생님!"
1008202-104 = "[s] \"왜 그래. 렌게? 뭔가 내가 실수라도…….\""
1008202-105 = "아니아니아니. 그런 게 아니라!"
1008202-106 = "방금 막 전력을 다해 아침 단련을 마친 참이니까."
1008202-107 = "여기서 선생님이 다가오면…… 그게…… 그러니까……"
1008202-108 = "여러가지로……! 내가 신경 쓰인다고……!"
1008202-109 = "[s] \"아…… 미, 미안. 확실히 그건 내가 너무 무신경했…….\""
1008202-110 = "후우…… 그러니 거기서! 조금만 기다리고 있어! 선생님!"
1008202-111 = "아직 늦지 않았으니까. 지금부터 열심히 하면……!"
1008202-119 = "[ns] \"어? 렌게……? 왜 갑자기 팔 벌려 뛰기를…….\""
1008202-120 = "그야……! 이렇게 하면 조금이라도…… 땀! 냄새가! 날아갈 테니까!"
1008202-124 = "영-차! 앞으로 전력을 다해!"
1008202-130 = "100번……! 더……!"
1008202-131 = "[s] \"저기, 오히려 역효과지 않을까?!\""
1008202-134 = "(렌게가 만족할 때까지 기다린 뒤에…….)"
1008202-138 = "후아아…… 좋아, 이 정도면 됐겠지……."
1008202-139 = "[s] \"뭔가, 굉장한 기합이었네…….\""
1008202-140 = "뭐어, 그건 그냥 기세로 넘어가 달라구!"
1008202-141 = "그보다 자, 그래서…… 본론, 말인데……."
1008202-142 = "하지만…… 이거 막상 얼굴을 맞대고 말하려니…. 그……."
1008202-143 = "으음……"
1008202-144 = "[s] \"으음……?\""
1008202-145 = "아니, 그게, 조금…… 살짝……"
1008202-146 = "으음! 역시 액정 너머가 아니라 얼굴을 직접 맞대고 말하는 건 부끄럽네!"
1008202-147 = "하지만…… 그래도!"
1008202-148 = "계속 혼자서 땅만 파고 있어서는 아무것도 해결되지 않으니까! 좋았어!"
1008202-149 = "선생님! 자! 이리로!"
1008202-156 = "오늘 이렇게 선생님을 모신 이유는 그러니까……."
1008202-157 = "[s] \"응, 상담하고 싶은 게 있다고 했었지.\""
1008202-158 = "……! 맞아. 상담하고 싶은 거……. 그게 말이지. 다름이 아니라……."
1008202-159 = "선생님, 나 깨닫고야 말았어. 아무것도 안하고 있으면 시간은 그저 흘러가 버리기만 한다는 걸 말이야."
1008202-160 = "단적으로 말해……."
1008202-164 = "선생님! 이대로 있다간 내 청춘이 현재진행형으로 낭비가 되고 말 거야!"
1008202-165 = "그러니 선생님! 이 상황을 타파하기 위해…… 선생님의 도움을 받고 싶어!"
1008202-166 = "[ns] \"………………………네?\""
1008202-167 = "아……. 역시 이것만으로는 설명이 조금 부족……했으려나?"
1008202-171 = "좀 더 이해하기 쉽게 풀어서 말하자면……."
1008202-172 = "먼 미래에, 과거의 추억을 다시 되새기는 게 일과가 될 정도로 나이를 먹었을 때."
1008202-173 = "오늘을 떠올릴 때마다 <아아, 그러고 보면 그때 매일 백화요란 활동에만 매진하느라 고등학생 시절이 눈 깜짝할 새에 끝나버렸지…… 나의 지나가 버린 청춘이여, 참으로 아쉬워라……>"
1008202-174 = "……하는 생각만 하게 되는 건, 역시 무진장 아깝잖아?"
1008202-175 = "그러니 나중에 오늘을 떠올려도 괜찮도록."
1008202-176 = "이때를 떠올릴 때마다 절로 입가에 미소가 지어질 만큼 엄청나게 대단한……. 그런 청춘을 보내 둬야 한다고 생각하지 않아?"
1008202-177 = "그게 이기는 길이라고 생각하지 않아?!"
1008202-181 = "[ns6] \"미안, 렌게.\"\n[ns7] \"이야기의 스케일이 너무 커진 나머지,\"\n[ns8] \"더더욱 의미를 모르겠어!\""
1008202-188 = "(그 뒤로도 이어진 렌게의 말을 한 줄로 정리하자면 요컨대 이런 이야기가 되었다.)"
1008202-190 = "툭 까놓고 말해! 더 늦기 전에 좀 더 <청춘스러운 활동>을 해두고 싶어!"
1008202-191 = "선생님! 도와주라!"
1008202-192 = "[s9] \"이런 말이 맞는지는 모르겠지만,\"\n[s10] \"이미 렌게는 백화요란 활동을 하고 있잖아?\""
1008202-195 = "[ns] \"그럼 이미 충분히 청춘 활동을 하고 있는 중인 게…….\""
1008202-196 = "응? 선생님, 무슨 말을 하는 거야."
1008202-197 = "백화요란의 활동이라고 해봤자……. 매일 같이 운동장을 뛰거나, 다 같이 구시렁거리면서 병법을 공부하거나, 사격술을 연습하거나……."
1008202-198 = "거리를 순찰하며 문제아가 없는지 살펴보거나, 가끔은 정말로 상황이 발생해서 단체로 다 같이 일사불란하게 작전을 펼치거나 할 뿐이잖아?"
1008202-199 = "에이~ 이런 건 청춘이라고 안 하지."
1008202-200 = "그건 단순한 <일상>이라고?"
1008202-201 = "[s] \"그런, 가?\""
1008202-202 = "애당초 청춘이란 건 좀 더 반짝반짝하고 새콤달콤한……."
1008202-203 = "그래. 바로 <사랑은 잉어> 작가님 작품에 나올 법한 내용 같은 거잖아?"
1008202-204 = "[s] \"그, 예를 들면……?\""
1008202-205 = "예를 들면 말이지……"
1008202-208 = "가슴이 설레는 만남과…… 가슴이 아릴 정도로 차가운 이별……."
1008202-209 = "친하게 지냈던 친구가 어느 날 갑자기 다가와, 그간 숨겨왔던 과거를 고백하는……. 가슴이 뜨거워지는 전개."
1008202-212 = "설마, 그 아이가 전생부터 인연이 이어져 내려온 전 갤럭시 워리어의 동료였을 줄이야……!"
1008202-213 = "이런 느낌으로 좀 더 파격적이고…… 가슴이 무진장 두근거리는 경험! 그걸 하는 쪽이 좋다고. 그게 이득이라고 생각하지 않아?!"
1008202-214 = "나중에 오늘날을 떠올리더라도 미소 짓고 누구에게나 자랑할 수 있도록 말이야!"
1008202-215 = "[s] \"그야 그런 게 있다면 평생의 자랑거리가 될 것 같긴 하지만!\""
1008202-216 = "아! 물론 나도 무턱대고 그런 극적인 설정의 경험만을 바라는 건 아니야."
1008202-217 = "단지…… 이대로 가면 백화요란으로서 단련만 하다가 청춘이 끝날 거라고 생각했더니. 그게 무척 아쉬워서……."
1008202-218 = "그러니 선생님……. 도와주지 않을래……?"
1008202-219 = "[s] \"렌게가 하는 말을 전부 이해했다고는 말 못 하겠지만.\""
1008202-221 = "[ns] \"도움이 필요하다면 전력을 다해 도와줄게.\""
1008202-225 = "어, 진짜……? 정말이야?"
1008202-226 = "으히힛! 고마워! 선생님!"
1008202-227 = "그럼 이걸로 우리들은 <청춘 사제관계>가 된 거네!"
1008202-228 = "[s] \"청춘…… 사제, 뭐?\""
1008202-229 = "흐음. 그렇다고 한다면……. 역시 선생님이라는 호칭만으로는 부족하겠지."
1008202-230 = "청춘 사제관계에 어울리는 좀 더 멋지고 위엄 있는 호칭이라고 한다면 역시……."
1008202-236 = "──스승님."
1008202-237 = "[s] \"스승, 님?\""
1008202-238 = "응! 어감 좋네!"
1008202-239 = "지금부터 같이 청춘 활동을 할 때라면, 선생님을 스승님이라고 부르겠어!"
1008202-245 = "모쪼록 앞으로도 부족한 제자를 잘 부탁해! 스승님!"
1008202-249 = "자, 악수!"
1008202-250 = "[s] \"아, 으응. 잘 부탁해.\""
1008202-251 = "헤헷!"
1008202-253 = "(그런 느낌으로 렌게와 함께하는 청춘 활동은 시작되었다.)"
