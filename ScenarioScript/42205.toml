[translation]
42205-5 = "으랴아아아아—!"
42205-11 = "FOX 3. 네 후배, 갑자기 개활지로 뛰쳐나왔는데?"
42205-12 = "저격수가 있다는 걸 뻔히 알면서도 당당히 돌격하다니…… 기합이 넘치는구만!"
42205-14 = "……저 바보는 도대체 무슨 생각을 하고 있는 거야?"
42205-15 = "저격할까?"
42205-16 = "아니, 기다려. 소대장이 상대가 저격 대책을 준비하고 있을지도 모른다고 했잖아."
42205-17 = "그리고…… 포인트맨은 포인트맨이 상대해 줘야지."
42205-18 = "FOX 4, 여기는 내가 맡을게. 후방 지원을 부탁해."
42205-20 = "확인."
42205-32 = "여기서 또 만나네, '선배'."
42205-34 = "……적진에 진입할 때는 상대가 존재를 알아차리지 못하도록 은밀히 돌입하라고, 내가 누누이 강조했을 텐데."
42205-35 = "아무래도 추가 훈련이 필요하겠는 걸!"
42205-44 = "침로가 제한된 상황에서 적의 시야 안쪽으로 기동할 때 은밀 기동은 의미가 없는 데다가……"
42205-45 = "선배가 쓰는 45구경 권총탄으로는 내 방탄 장비를 뚫지 못할 테니까."
42205-47 = "그건 그렇지. 사소한 피탄을 각오하고 거리를 좁힌 건 좋은 판단이었어."
42205-48 = "하지만 지금의 나는 망치가 아니라 모루 역할을 맡고 있거든."
42205-49 = "저격에 당하지 않도록 뒤통수를 조심하라고!"
42205-76 = "……CQC 솜씨가 제법 늘었는데?"
42205-77 = "사선을 피해 상대의 품으로 파고들면서 보조무기 대신 개머리판을 휘두른 건 꽤 위협적이었어."
42205-78 = "그게 좋다고 선배가 전에 가르쳐 주었으니까."
42205-79 = "역시 한 번 가르쳐 준 건 잊어버리는 법이 없구나. 필기 만점의 모범생다워."
42205-80 = "아쉽네…… 이런 우수한 후배와 앞으로 계속 함께 할 수 없다니."
42205-81 = "유감인 건 이쪽도 마찬가지야."
42205-82 = "SRT의 부활을 위해서라지만, 선배들이 시민의 안전을 위협하는 선택을 하다니…… 믿을 수가 없어."
42205-83 = "……모루나 망치가 무얼 두드리고 있는지 생각할 필요는 없지."
42205-84 = "총구를 상대에게 겨눌 때는 망설이지 마!"
42205-88 = "(……좋아. 이대로 시간을 끌며 탄환의 소진을 유도한 다음……)"
42205-89 = "자, 여기 보고—"
42205-94 = "치즈!"
42205-100 = "읏……!"
42205-111 = "……사키, 넌 너무 정직해."
42205-112 = "총을 쏘는 요령도, 엄폐를 하는 장소도 교범대로라 상대 입장에서는 너무나 예측하기가 쉬워."
42205-113 = "그러니까 베테랑이 되는 길은 쉽지 않다는 거야."
42205-115 = "……벌써부터 다 이긴 것처럼 굴지 마. 선배."
42205-116 = "응? 아직도 믿는 구석이 남아있는 거야?"
42205-117 = "아, 혹시 그 심약한 저격수 후배의 지원 사격이라도 기대하고 있는 거야?"
42205-118 = "내게 부상을 입히는 정도라면 가능하겠지만, 저격으로 전황을 뒤바꾸는 건 어려울걸."
42205-119 = "오히려 저격을 시도하다 원점을 들켜 역저격을 당할지도 모르고……"
42205-125 = "……선배는 같은 소대의 전우들을 얼마나 신뢰하고 있어?"
42205-126 = "그게 갑자기 무슨 뚱딴지같은 질문이야?"
42205-127 = "우리 소대의 저격수인 미유는 마음먹고 숨어 버리면 그 누구도 찾지 못하거든."
42205-128 = "CQB나 대인 전술이라면 몰라도 저격에서는 절대로 실패하지 않을 거라는 확신이 있어."
42205-129 = "……이상하지 않아? 지금 이 시점이면 오토기 선배 측에서도 지원 사격을 했을 법도 한데."
42205-130 = "우리 소대의 은밀한 암살자가 이미 오토기 선배를 처리했을지도 모르지."
42205-132 = "………!"
42205-136 = "FOX 4, 무사해? FOX 4!"
42205-140 = "……응? 나, 아무 문제도 없는데?"
42205-141 = "저격 대책이 있을지도 모르니 발포하지 말고 기다리라고 했었잖아?"
42205-142 = "다행이다, 나는 혹시 네가 당했을까 봐……"
42205-151 = "아."
42205-155 = "아까 선배가 말했지? 총구를 상대에게 겨눌 때는 망설이지 말라고."
42205-156 = "……소대원을 끝까지 신뢰하지 못했던 건 선배였던 모양이네."
42205-164 = "FOX 3, 다운."
42205-165 = "후배 앞이라고 너무 폼 잡은 거 아냐, 쿠루미? 마지막에 그렇게 허무하게 등을 내주다니."
42205-166 = "……어쩔 수 없지. 남은 타깃은 백업인 내가 처리하는 수밖에."
42205-171 = "디코이 드론 설치 완료. ECCM 대책도 완비…… 이것으로 역저격을 당할 우려는 없겠어."
42205-172 = "먼저 포인트 맨부터 처리할까?"
42205-173 = "……그나저나 RABBIT 소대의 저격수는 어디에 있는 거지?"
42205-180 = "저…… 여기 있는데요……"
42205-181 = "우, 우왓……?"
42205-186 = "어, 어느 틈에……? 그보다 어째서 여기에……?!"
42205-188 = "그게…… 저도 지원 사격을 하려고 괜찮은 저격 포인트를 찾아 이 위에 올라왔는데……"
42205-189 = "선배께서 여기에 먼저 자리를 잡고 계셔서…… 뒤에서 기다리고 있었어요……."
42205-190 = "먼저 말을 걸려 했는데…… 뭔가 여러모로 바빠 보이셔서……"
42205-191 = "적 저격수의 시야를 피해 가까이 접근한 수준이 아니라, 아예 등 뒤에서 기다리고 있었다고……?"
42205-192 = "미유, 무서운 아이……"
42205-194 = "역시 저 같은 건 아무도 인식하지 못하니까…… 언젠가는 모두의 기억 밖에서 쓸쓸하게 잊혀지게 되겠죠……"
42205-195 = "하지만…… 오늘만큼은 이 체질이 있어 다행이라고 생각해요."
42205-196 = "모두가 알아차리지 못한 덕분에…… 소대원들을 도울 수 있게 되었으니까요."
42205-200 = "……죄송합니다, 선배."
42205-206 = "자, 잠깐만 기다려……!"
42205-212 = "……FOX 3, FOX 4, 다운."
42205-213 = "설마 후배들이 이렇게까지 우리를 몰아세울 수 있을 거라고는 생각지 못했네."
42205-214 = "미리 중앙 엘리베이터의 제어 콘솔을 통제하지 못하도록 조치해 두길 잘했어."
42205-220 = "뭐야, 이거. 반응하는 노드가 하나도 없는데?"
42205-221 = "설마 강제로 오프라인 모드로 전환시킨 건가?!"
42205-222 = "미안, 모에 쨩. 지금 이 엘리베이터는 사용 금지야."
42205-223 = "오늘은 선배들이 먼저 예약을 걸어 놨거든."
42205-224 = "……니코 선배? 이거 니코 선배 짓이지?!"
42205-225 = "모에 쨩의 해킹 실력은 나도 잘 알고 있거든. 시간만 충분하다면 이 제어 콘솔의 보안 취약점을 찾아낼지도 모르니까……"
42205-226 = "외부에서는 접속이 아예 물리적으로 불가능하도록 회선을 끊어놨어. 헛수고를 하게 해서 미안해."
42205-227 = "이런 야비한 수를 쓰다니……"
42205-228 = "……오퍼레이션 룸으로 향하는 이 유일한 통로는 작전이 종료될 때까지 무슨 수를 쓰더라도 해킹으로는 열 수 없을 거야."
42205-229 = "거기서 시간을 더 끌었다가는 카이저 시큐리티의 증원이 언제 내려올지도 모르니까……"
42205-230 = "미안하지만 다른 후배들과 이만 돌아가 주었으면 해."
42205-235 = "……선배의 말대로라면 이 문은 전자적인 방법으로는 절대 열 수 없다는 말이지?"
42205-236 = "쿠히히…… 마음에 들었어. 오히려 바라던 바야."
42205-241 = "저기, 모에 쨩……? 혹시 무슨 생각을……"
42205-243 = "어떤 명령을 내려도 열리지 않는 굳건한 문을, 압도적인 힘으로 강제로 잡아당겨 열어젖히다니……"
42205-244 = "엉망진창이 될 것 같아서 생각만 해도 오싹오싹해…… 하아, 하아……"
42205-245 = "이 엘리베이터의 문은 전자식 도어라 물리적인 방법으로는 열리지 않는데?"
42205-246 = "물리적인 방법이 먹히지 않는다면 먹힐 때까지 밀어붙이면 되는 거 아냐?"
42205-251 = "폭약이라면 충분히 갖고 있거든!"
42205-252 = "어디보자…… 지금 1 파운드짜리 셈텍스가 10개 정도 있으니까……"
42205-253 = "이걸 전부 문에 붙여서 동시에 폭발시키는 거야!"
42205-255 = "무, 물론 그렇게 많은 폭약을 쓰면 문이 손상될 수도 있겠지만……"
42205-256 = "문의 문제가 아니라 그 앞에 있는 너희들까지 폭발에 휘말릴지도 모르는데?!"
42205-257 = "괜찮아! 우리 소대원들은 이런 일에는 충분히 익숙하거든!"
42205-258 = "익숙하다 하더라도 스스로가 위험에 노출될지도 모르는데 브리칭을 시도하다니……"
42205-259 = "상식적으로 그게 말이 되는—"
42205-272 = "콜록, 콜록…… 열렸다!"
42205-274 = "어…… 이건 열었다기보다는……"
42205-275 = "강제로 폭파시킨 것에 가깝지만요……"
42205-276 = "믿고 맡긴다고 했지만, 보유 중인 플라스틱 폭약을 여기서 모두 써버릴 줄은 생각도 못 했네요."
42205-278 = "뭐, FOX 선배들도 이렇게 무식한 브리칭은 처음 봤겠지."
42205-279 = "설마 파멸을 두려워하지 않는 모에의 기질이 이런 데에서 도움이 될 줄이야……"
42205-280 = "뭐야, 그거. 비꼬는 거야?"
42205-281 = "칭찬이야, 칭찬."
42205-285 = "……잘했어. RABBIT 3."
42205-286 = "뭐, 그쪽도 제법이었어. RABBIT 2."
42205-288 = "엘리베이터 통로로 향하는 길이 확보되었으니, 레펠링을 통해 오퍼레이션 룸 앞까지 바로 하강하겠습니다!"
42205-289 = "모두 케이블에 하네스를 결속해 주세요."
42205-296 = "그럼…… 이어서 진입합니다!"
42205-303 = "다음화;카르바노그의 굴속에서 2"
