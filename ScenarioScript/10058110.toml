[translation]
10058110-1 = "第11話;Off your Tank!"
10058110-2 = ""
10058110-3 = "それでは！表彰式に移ります！"
10058110-4 = "進行の都合上、私[ruby=きょうごく]、京極サ[/ruby]ツキが発表するわね。"
10058110-6 = ""
10058110-8 = "優勝。レッドウィンター連邦学園183号特別クラス！"
10058110-9 = ""
10058110-10 = ""
10058110-11 = ""
10058110-12 = ""
10058110-13 = ""
10058110-14 = ""
10058110-15 = ""
10058110-16 = ""
10058110-17 = ""
10058110-18 = ""
10058110-19 = ""
10058110-20 = ""
10058110-22 = "本当に、優勝したのね……。"
10058110-23 = "う、うぅ……ゆむ……夢じゃないよね？"
10058110-25 = ""
10058110-26 = "どうして撃つのよ！！！普通は自分の頬をつねるでしょ！！"
10058110-27 = "それだと痛いでしょ！！うああぁぁん！"
10058110-28 = "おめでとうございます！"
10058110-29 = "おめでとう、レッドウィンターの戦士たち。"
10058110-30 = "助けてあげて良かった！優勝なんて、すごいじゃない！"
10058110-32 = ""
10058110-33 = "補習授業部のみなさん……。"
10058110-34 = "おかげで優勝できました、うああぁぁん！"
10058110-36 = ""
10058110-37 = ""
10058110-38 = ""
10058110-39 = ""
10058110-40 = "……？"
10058110-41 = "あら、ふふっ。"
10058110-42 = "こんな嬉しい瞬間に、みなさんどうして泣いているんですか！#nふふふっ！シャッターチャンスには違いありませんが！"
10058110-43 = "しゃ、写真！？"
10058110-44 = "ちょっと待ってぇ！？"
10058110-45 = "ラナはどこに行ったの？ラナー！"
10058110-46 = "また迷子ぉ！？"
10058110-47 = "さっき、あっちに一人で歩いていくのを見た。"
10058110-48 = "迷子じゃないと思う。行くべき所に行くという目をしていた。"
10058110-49 = "え？"
10058110-50 = ""
10058110-51 = "はい、チーズ！"
10058110-52 = "ち、チーズ！？！？"
10058110-54 = ""
10058110-55 = ""
10058110-56 = ""
10058110-57 = "あの、ふわふわさん。"
10058110-58 = "おや。さっきの操縦手の方ですね。"
10058110-59 = "優勝、おめでとうございます。"
10058110-60 = "失礼でなければ、聞きたいことがあります。"
10058110-61 = "どうして、悲しみや悔しさを感じていないのですか？"
10058110-62 = "はい？"
10058110-63 = "うまく言葉にできなくてごめんなさい。#n決してからかっているわけではないんです。"
10058110-64 = "ふわふわさんは負けたのに、何故か気分が良さそうに見えました。"
10058110-65 = "本当にそうなら、どうしてなのか教えてください。"
10058110-66 = "私からも聞かせてください。何故、それを聞くんですか？"
10058110-67 = "友達が心配だから、です。"
10058110-68 = "友達は……ここに来る前も、来てからも悩んでいました。"
10058110-69 = "失敗や危険を恐れ、諦めようとしました。"
10058110-70 = "……はい。"
10058110-71 = "みんなに恥をかかせたくない、危険な目に遭わせたくない――"
10058110-72 = "そのような理由からでしょう。"
10058110-73 = "友達は、自分たちのことを弱虫だと言いますが……#n私の考えは違います。諦めることも、一つの勇気だと思うからです。"
10058110-74 = "……。"
10058110-75 = "しかし、もし友達がまた挫折を味わうことになったとしても――"
10058110-76 = "今まで友達がいなかった私には、#n友達として自分に何ができるのか分かりません……。"
10058110-77 = "だから……#nいつか友達に慰めが必要な時、かけてあげられる言葉が知りたいのです。"
10058110-78 = "「私の知り合いが、こう言ってた」と。"
10058110-79 = "ほう。"
10058110-80 = "そういうことでしたら、分かりました。"
10058110-81 = "たしかに、気分は良かったですよ。"
10058110-82 = "何故なら、みなさんが全力で戦ってくれたからです。"
10058110-84 = ""
10058110-85 = "それで負けたからといって、悔しがる必要はありません。"
10058110-86 = "私は……お互い全力で戦ったなら、それで良いと思っています。"
10058110-87 = "サボったりダラダラするのも好きですけど、#nたまにはこういうのも悪くはありません。"
10058110-88 = "「好きなことを全力で頑張る」人の目、嫌いじゃないですから。#nまあ、毎回は疲れますけど。"
10058110-89 = "それに……#n少しでも諦めたくないなら、とりあえずやってみるのは大事だと思います。"
10058110-90 = "「あの時、やっておけば……」と後悔するのが一番面倒ですから。#n面倒なことは嫌いなんです。"
10058110-91 = "なるほど。勉強になりました。"
10058110-92 = "もう一つ質問させてください。#n私たちと戦ったことは、ふわふわさんにとっても「大事な過程」になりましたか？"
10058110-93 = "それは……。"
10058110-94 = ""
10058110-96 = ""
10058110-97 = "あ、あの！！"
10058110-98 = "す、すみません！！イロハ戦車長！！すごく緊張してしまい……！"
10058110-99 = "どうでもいいことを質問して申し訳ございません！！"
10058110-100 = "戦車長、ですか。"
10058110-101 = "レースは終わりました。「戦車長」と呼ぶ必要はありません。"
10058110-102 = "負けることもあります。安心してください。こんなことで怒りはしませんから。"
10058110-103 = "戦車に乗っている間は少し神経質になってしまうんです。#nお詫びをしたいので、打ち上げを兼ねて食事でも行きましょう。"
10058110-105 = ""
10058110-106 = "イロハ先輩……！"
10058110-107 = "異論もないようなので、そうしましょうか。"
10058110-108 = "カラオケも一緒に行きませんか！？"
10058110-109 = "聞いているだけでも良いなら。では……。"
10058110-110 = "[ruby=なつめ]棗イ[/ruby]ロハ！！！！"
10058110-111 = "どうなってるんだ！！！ゲヘナが優勝を逃すとは！！！"
10058110-112 = "[ruby=パンデモニウム・ソサエティー]万魔殿の権威が[/ruby]！！！マコト様の権威があぁ！！！"
10058110-113 = "はぁ。また逃げなくてはいけませんね。"
10058110-114 = "虎丸、総員乗車！"
10058110-115 = "目的地、ハンバーガーショップ！"
10058110-116 = "はいっ！！！"
10058110-118 = ""
10058110-119 = ""
10058110-120 = "あ……まだ答えていませんでしたね。"
10058110-122 = ""
10058110-123 = ""
10058110-124 = "私にとっても「大事な過程」なんだと思います。良い経験をしましたから。"
10058110-126 = ""
10058110-127 = "虎丸、出発！"
10058110-130 = ""
10058110-132 = "棗イロハーーー！！！"
10058110-134 = ""
10058110-135 = "お別れです。ゲヘナで出会った「大事な過程」さん。"
10058110-136 = "ラナ！早くおいで！！"
10058110-137 = "先生が写真を撮ってくれるって！！みんな集まってるよぉ～！"
10058110-139 = ""
10058110-140 = ""
10058110-142 = ""
10058110-143 = ""
10058110-144 = ""
10058110-146 = ""
10058110-147 = "記念写真……！研究室の壁に掛けなきゃ……！"
10058110-148 = "ついに、優勝か……！とうとう……！うああぁぁ！"
10058110-149 = "ちょっと、エリナ！！押さないで！"
10058110-150 = "はぁ～？押してないですけどぉ～！？狭いから、あっち行って！！"
10058110-151 = "私のほうが先だったんだから、エリナがあっち行きなさいよ！#nこっちはラナと私だけでいいの！"
10058110-152 = "よく見たら、アンナ灰だらけじゃん！服着替えてきたら！？"
10058110-153 = "それはエリナもでしょ！！"
10058110-154 = "トロフィー持って、ピース。"
10058110-155 = "[ns] \"じゃあ、撮るよ！\""
10058110-156 = ""
10058110-157 = "[ns] \"はい、チーズ！\""
10058110-158 = ""
