[translation]
10058110-1 = "제11화;Off your Tank!"
10058110-3 = "그럼! 시상식입니다!"
10058110-4 = "대회 진행상 사정이 있어서, 나, 쿄고쿠 사츠키가 대신 수여할게."
10058110-8 = "우승. 붉은겨울 연방학원 183호 특별반!"
10058110-22 = "진짜, 진짜로 우승했어……."
10058110-23 = "끄윽, 끕……. 꿈은 아니겠지?"
10058110-26 = "왜 날 쏘는 거야!!! 보통은 자기 볼 꼬집어보잖아!!"
10058110-27 = "그건 아프니까!! 으아앙-!"
10058110-28 = "축하해요!"
10058110-29 = "축하해, 붉은겨울의 전사들."
10058110-30 = "도와준 보람이 있네! 우승까지 해내다니, 제법이야!"
10058110-33 = "보충수업부 여러부우운……."
10058110-34 = "덕분에 우승했어요, 으아아앙!"
10058110-40 = "……?"
10058110-41 = "어머, 후훗."
10058110-42 = "좋은 순간인데 왜 다들 울고 있어요! 물론 셔터찬스지만요!"
10058110-43 = "사, 사진?!"
10058110-44 = "잠깐만요?!"
10058110-45 = "라나는 어디 갔어? 라나-!"
10058110-46 = "또 미아 된 거야?!"
10058110-47 = "아까, 저기로 혼자 걸어가는 걸 봤어."
10058110-48 = "미아는 아니라고 생각해. 가야 할 곳이 있다는 듯한 눈을 하고 있었어."
10058110-49 = "네?"
10058110-51 = "자, 치즈-!"
10058110-52 = "치, 치즈으-!!?!"
10058110-57 = "저기. 복슬복슬 씨."
10058110-58 = "음? 아까의 그 운전수 분이시군요."
10058110-59 = "우승. 축하해요."
10058110-60 = "실례가 안 된다면, 꼭 물어보고 싶은 게 있습니다."
10058110-61 = "어째서 슬프거나 아까워하지 않으시는 건가요?"
10058110-62 = "네?"
10058110-63 = "말을 예쁘게 하는 방법을 잘 모르기에, 놀리는 것으로 들리지 않았으면 좋겠습니다."
10058110-64 = "그렇지만, 복슬복슬 씨는 졌는데도 기분이 좋아 보이십니다."
10058110-65 = "정말로 그렇다면, 어째서인지 가르쳐 주셨으면 합니다."
10058110-66 = "저도 궁금해서 물어보고 싶은 겁니다만, 어째서 물어보시는 건가요?"
10058110-67 = "제 친구들이 걱정되어서, 입니다."
10058110-68 = "제 친구들은…… 여기 오기 전에도, 온 뒤에도 고민하고 있었습니다."
10058110-69 = "실패나 위험을 무서워해서, 포기하려고도 했습니다."
10058110-70 = "……네."
10058110-71 = "모두에게 망신을 주고 싶지 않다, 위험한 일을 겪게 하고 싶지 않다—"
10058110-72 = "그런 이유로 포기하려고 했습니다."
10058110-73 = "친구들은, 자기들을 겁쟁이라고 말했지만……. 저는 다르게 생각합니다. 포기도, 하나의 용기라고 생각하니까요."
10058110-74 = "……."
10058110-75 = "하지만, 만약 친구가 또 좌절을 하게 된다면……."
10058110-76 = "지금까지 친구가 없었던 저는, 친구로서 뭘 해줄 수 있을지 모르겠습니다……."
10058110-77 = "그러니까…… 언젠가 친구에게 위로가 필요할 때, 건네줄 수 있는 말을 알고 싶습니다."
10058110-78 = "'내가 아는 어떤 사람이 말해주었다.'라고요."
10058110-79 = "호오."
10058110-80 = "아하. 그렇군요. 그런 이야기였군요. 이해했어요."
10058110-81 = "맞아요. 졌지만 나름 기분이 꽤 괜찮아요."
10058110-82 = "상대로 마주한 여러분들이 최선을 다해주셨으니까요."
10058110-85 = "그렇게 졌다면, 속상할 필요가 없죠."
10058110-86 = "서로 전력으로 싸웠다면, 그걸로 좋다고 생각해요."
10058110-87 = "땡땡이도 좋고, 빈둥거리는 것도 좋지만요. 그렇다고 최선을 다하는 걸 싫어하는 게 아니에요."
10058110-88 = "'좋아하는 일에 최선을 다했어.'라는 눈빛. 싫어하지 않아요. 뭐, 매번 보는 건 지치겠지만요."
10058110-89 = "그리고, 포기하지 않을 가치가 있다면, 일단 해보는 것도 좋아요."
10058110-90 = "'그때 해볼걸'이라는 후회가 더 귀찮은 일이니까요. 귀찮은 건 질색이에요."
10058110-91 = "그렇군요. 도움이 되었습니다."
10058110-92 = "다른 질문입니다만, 저희와 겨룬 것은 복슬복슬 씨에게 있어서도 ‘소중한 과정’, 일까요."
10058110-93 = "그건……."
10058110-97 = "저, 저기!!"
10058110-98 = "죄, 죄송합니다. 차장님!! 제가 너무 긴장하는 바람에 그만……."
10058110-99 = "쓸데없는 질문 해서 죄송했어요!!"
10058110-100 = "차장님, 이라."
10058110-101 = "대회 끝났잖아요. '차장님'이라고 할 필요 없어요."
10058110-102 = "질 수도 있죠. 안심해요. 이런 거로 화내지 않는다구요."
10058110-103 = "전차 타는 동안에는 약간 예민해서요. 사과의 의미로 뒤풀이 겸 식사나 하러 가죠."
10058110-106 = "이로하 선배……!"
10058110-107 = "불만 없으신 것 같으니, 갈까요."
10058110-108 = "노래방도 같이 가실래요?!"
10058110-109 = "듣기만 해도 괜찮다면야. 그럼……."
10058110-110 = "나츠메 이로하!!!!"
10058110-111 = "이게 어찌 된 일이냐!!! 게헨나가 우승컵을 놓치다니!!!"
10058110-112 = "만마전의 권위가!!! 나의 권위가아아!!!"
10058110-113 = "하아……. 피한다고 피했는데. 도망쳐야겠군요."
10058110-114 = "토라마루, 전원 승차!"
10058110-115 = "목적지, 햄버거집!"
10058110-116 = "네!!"
10058110-120 = "아차, 답을 잊었군요."
10058110-124 = "그렇죠. ‘소중한 과정’이겠네요. 좋은 경험을 했으니까요."
10058110-127 = "토라마루, 발차!"
10058110-132 = "나츠메 이로하아아아!!!"
10058110-135 = "작별입니다. 게헨나에서 만난 ‘소중한 과정’ 씨."
10058110-136 = "라나! 어서 와!!"
10058110-137 = "선생님이 다 같이 사진 찍어주신대!! 다들 모여있어!"
10058110-147 = "기념사진……! 연구실 벽에 크게 걸어둬야지……!"
10058110-148 = "드디어 우승…… 드디어……! 으아앙-!"
10058110-149 = "야, 에리나!! 밀지 마!"
10058110-150 = "뭐? 안 밀었거든?! 좁잖아!! 저리 비켜!!"
10058110-151 = "내가 먼저 왔어! 저리 가! 라나하고 내가 센터야!"
10058110-152 = "가서 옷이나 갈아입고 오시지?! 재투성이가!"
10058110-153 = "너도 그렇잖아!"
10058110-154 = "트로피 들고 피-스-"
10058110-155 = "[ns] \"그럼, 찍을게!\""
10058110-157 = "[ns] \"하나, 둘!\""
