[translation]
33180-1 = "제18화;흔들리지 않고"
33180-2 = "……."
33180-3 = "[s] 정신을 차린 하스미에게 인사한다."
33180-4 = "……선생님."
33180-5 = "여기는……. 대체…… 무슨 일이……."
33180-6 = "[s] \"걱정했어. 하스미.\""
33180-7 = "……. 그러네요. 헤일로가 부서진다고 생각했습니다……."
33180-8 = "츠루기는…… 다른 사람들은……."
33180-12 = "……."
33180-13 = "[s] 정신을 차린 츠루기에게 인사한다."
33180-14 = "……키에?"
33180-17 = "키, 키에에에에에에엑?!"
33180-18 = "서, 서, 선생님?! 어, 어째서 여기에……?!"
33180-19 = "앗, 츠, 츠루기 님?! 벌써 움직일 수 있다니??! 역시 정의실현부의 부장님!"
33180-22 = "……멀쩡해 보이시네요. 선생님."
33180-23 = "[s] \"세나의 응급처치 덕분에.\""
33180-24 = "아닙니다. 어른을 치료해본 건 처음입니다. 공부가 되었어요."
33180-25 = "선생님……."
33180-26 = "치나츠? 벌써 움직이면 안 되는데요. 가서 누우세요. 선배의 명령입니다."
33180-27 = "전 선도부인데……."
33180-28 = "지금이라도 응급의학부로 돌아오는 건 어떤가요? 질 좋은 시체…… 아니, 부상자들을 마음껏 만질 수 있습니다."
33180-29 = "……아뇨. 사양할게요."
33180-34 = "선생님……."
33180-35 = "아코 쨩…… 아직 움직이면…… 으, 으윽."
33180-36 = "[s] \"아코. 이오리. 무사해서 다행이야.\""
33180-37 = "부장님이 사라지셨어요……."
33180-38 = "연락도 안 되고…… 방에도 없고……."
33180-39 = "선생님…… 부장님을……."
33180-40 = "[s] \"응. 내가 찾아볼게.\""
33180-41 = "……네. 부탁드리겠습니다. 선생님."
33180-45 = "선생님……."
33180-46 = "[s] \"히후미…….\""
33180-47 = "선생님…… 아즈사 쨩이……."
33180-48 = "……."
33180-49 = "……."
33180-50 = "아즈사 쨩이 혼자서 싸우고 있어요……. 아직도 혼자서 싸우려고 해요……."
33180-51 = "[s] \"그래. 알고 있어. \""
33180-52 = "…… 그치만…… 저는…… 어떻게 해야 할지…… 방법도…… 해결책도…… 아무것도 모르겠어서……."
33180-53 = "지금 벌어지고 있는 일은…… 저같이 평범한 사람에겐…… 너무 거대하고 막막할 뿐이라……."
33180-54 = "방법이 있을까요…… 이런…… 무서운 일들에…… 제가 할 수 있는 일이…… 아즈사 쨩을 도울 수 있는 방법이……."
33180-55 = "……."
33180-56 = "그, 그치만! 아즈사를 혼자 둘 순 없잖아!"
33180-57 = "……코하루 쨩."
33180-58 = "나, 나는…… 외톨이가 얼마나 쓸쓸한지 알고 있으니까……. 아즈사를 혼자 두게 하면 안 돼……."
33180-59 = "……네. 그러네요. 아즈사 쨩, 분명 혼자서 외롭게……."
33180-60 = "[s] \"히후미 덕분에 우리 보충수업부는 여기까지 올 수 있었어.\""
33180-61 = "……선생님?"
33180-62 = "[s1] \"그리고 평범한 히후미는 어려운 상황에서도 굴하지 않고,\"\n[s2] \"자기가 할 수 있는 일을 하기 위해 노력해 왔어.\""
33180-63 = "뭐…… 그렇지. 보충수업부의 부장에다가……. 이런저런 궂은일들도 도맡아주고……."
33180-64 = "뭐…… 그렇지. 보충수업부의 부장에다가……. 이런저런 궂은일들도 도맡아주고……."
33180-65 = "……맞아요. 히후미 쨩이 없었다면…… 저희는 분명……. 여기에 없었을 거니까……."
33180-66 = "하나코 쨩. 코하루 쨩……."
33180-67 = "[s3] \"그러다 도저히 방법을 모르겠으면, 이번에도 내게 상담해주었으면 해.\"\n[s4] \"그걸 같이 고민하고 해결해주는 게 내 역할이니까.\""
33180-68 = "……."
33180-69 = "……."
33180-70 = "……네. 선생님. 무슨 얘기인지 알겠어요……."
33180-71 = "……저는, 포기하지 않겠어요. 고민하지도 않겠어요."
33180-72 = "고민해봤자 달라질 건 없어요. 저는 제가 할 수 있는 일을 할 거예요……!"
33180-73 = "선생님…… 아즈사 쨩을…… 도우러 가요."
33180-74 = "[s5] \"응. 히후미는 언제나 그래왔으니까.\"\n[s6] \"내가 히후미를 도울게. 보충수업 때처럼.\""
33180-77 = "아즈사 쨩을……. 구하러 다 같이."
33180-78 = "그래! 친구를 구하러 가는 거야. 그게 틀렸을 리가 없어!"
33180-79 = "그리고…… 아즈사 쨩을 만나서……."
33180-83 = "히후미 쨩…… 아즈사 쨩에게 하고 싶은 말이…… 있는 거군요?"
33180-84 = "……네."
33180-85 = "전부터 계속…… 우리에게 강요하고 있는 그런 것들에 너무 화가 나서…… 말하지 않으면 견딜 수가 없을 것 같아서……."
33180-86 = "<그런 세계> 라니…… 저는……."
33180-87 = "히후미……?"
33180-91 = "[ns] \"말하고 싶은 게 있다면 참지 말고 해. \""
33180-92 = "……네!! 아즈사 쨩에게, 그리고 모두에게……! 확실하게 말해두겠어요……!"
33180-93 = "네, 히후미 쨩. 저도 곁에서 함께 들을 테니까. 제대로 전하는 거예요."
33180-94 = "그럼 됐지? 얼른 가자!"
33180-97 = "사람들을 모으고, 설득하고, 소통하고, 이해한다."
33180-98 = "선생님은 사분오열한 트리니티와 게헨나의 학생들을 하나로 모으고 있군요……."
33180-99 = "지금 아리우스의 증오를 담은 유스티나 성도회가 트리니티와 게헨나로 진격해오고 있는 이 상황에서……."
33180-100 = "도움을 청하고, 부탁해서……."
33180-101 = "모두를 하나로 모았군요."
33180-106 = "그리고 혼자서 아리우스 스쿼드를 막으려는 아즈사의 위치를 찾아내었군요."
33180-107 = "고성당."
33180-108 = "낙원의 이름이 거론되었고, 지금은 이제 폐허가 되어버린 그곳으로."
33180-109 = "아리우스가, 아즈사가, 그리고 선생님이 향하기 시작했군요."
33180-111 = "……."
33180-112 = "……."
33180-113 = "아즈사……."
33180-117 = "사오리……."
33180-118 = "감히 공주님을! 아츠코를……!! 절대 용서 못 해!"
33180-119 = "내가 막겠어. 사오리. 널 막는다."
33180-120 = "네가 막을 수 있다고 생각하나!!"
33180-122 = "네가 아리우스의 분노를, 증오를, 원한을! 감당할 수 있다고 생각하나!!"
33180-123 = "<살의>가 부족하다면, 더 채워보이겠어. <살인자>가 되어야만 널 막을 수 있다면 여기서 그렇게 되어보이겠어."
33180-131 = "아즈사--!!"
33180-132 = "사오리. 이런 세계에 있는 건 우리들만으로 충분하니까."
33180-134 = "다음화;우리들의 이야기를"
