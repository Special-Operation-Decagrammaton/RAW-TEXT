[translation]
10052010-1 = "비나. 다름을 통감하는 숙고의 이해자"
10052010-2 = "모모이, 도착!"
10052010-3 = "강하라는 거, 엄청나네……."
10052010-4 = "우으으, 어지러워요……. 그런데……?"
10052010-6 = "[ns] \"이건…… 뭐지?\""
10052010-9 = "뭐긴요. 보시다시피."
10052010-10 = "보시다시피……."
10052010-11 = "……이거 진짜 뭐라고 표현해야 하죠……."
10052010-12 = "응? 그냥 큰 구덩이 아냐? 게임에서는 대공동이라고도 해!"
10052010-13 = "너무 1차원적인 네이밍 아닌가요, 모모이……?"
10052010-14 = "워, 원래 네이밍은 알기 쉬운 게 좋은 거야, 케이 쨩!"
10052010-19 = "뭔가…… 엄청난 소리가, 들리네요……?"
10052010-20 = "인공적인 동작음…… 가동음 같은 것이군요."
10052010-21 = "[s] \"그러면 직관적으로, 비나는 저 아래 있다는 소리인가.\""
10052010-22 = "……직관적으로는 그렇긴 할 건데, 말이죠."
10052010-27 = "모두, 무사히 도착했나요? 저 아래에서 비나의 신호가 잡히고 있어요. 그런데……."
10052010-28 = "무슨 문제라도 있나요, 히마리 선배?"
10052010-29 = "그 신호가, 다른 예언자보다 다소 약해져 있는 것으로 보여요. 원인은 몇 가지로 추측해 볼 수 있겠지만……."
10052010-30 = "알았다! 잠자고 있는 거구나!"
10052010-31 = "……물론 그럴 가능성도 충분히 있겠죠."
10052010-32 = "아니면 현재 포착되고 있는 그 대공동…… 구덩이가 너무 큰 나머지, 신호가 약해진 것일 수도 있고요."
10052010-33 = "[s] \"왜 이 구역만 이렇게 되어 있을까?\""
10052010-34 = "지금으로서는 알 방법이 없지만…… 비나 자체가 다른 예언자들과는 약간 궤를 달리하는 부분이 있어."
10052010-35 = "응? 그건 무슨 소리야, 회장?"
10052010-36 = "비나의 목격 기록은 데카그라마톤이 본격적으로 활동한 시기보다 훨씬 이전이에요."
10052010-37 = "이전, 아비도스 학생회가 상세한 연구 자료를 만들었다고 하지만, 지금은 유실되었고……."
10052010-38 = "애초에 이런 수수께끼의 AI 기계 구조체가, 무슨 이유로 아비도스 자치구의 사막에서 활동하고 있었는지부터가 의문이라고 해야 하겠지만."
10052010-39 = "두 분의 말만으로는…… 비나만 뭔가 따로 놀고 있는 것 같다는 이야기처럼 들리네요?"
10052010-40 = "맞아요. 그냥 해 보는 이야기에 지나지 않지만, 그래서 이렇게 이상하고 특별한 곳에 따로 배치한 것이 아닌가, 싶기도 하고요."
10052010-41 = "이러니저러니 해도, 일단 그 비나인지 뭔지를 불러내야 할 것 같네요."
10052010-42 = "불러낸다…… 좋은 표현이네요. 마침 저도 그 비슷한 일을 생각하고 있었는데 말이죠."
10052010-43 = "유즈? 지금부터 각도와 탄속을 지정할 테니, 그에 맞게 유탄을 공중으로 쏘아 올려 주겠어요?"
10052010-44 = "네, 네네네?! 제 유탄, 을요……? 어째서요……?"
10052010-45 = "그 구덩이의 대략적인 크기와 깊이를 측정해 봐야겠다는 생각이 들어서요."
10052010-46 = "유즈가 가진 총의 재원은 이미 우리가 분석한 상태야."
10052010-47 = "유탄의 탄속은 총탄에 비해 훨씬 느리니까, 지정된 각도로 저속 사격한다면, 탄환을 자유 낙하 상태로 떨어뜨릴 수 있을 거야."
10052010-48 = "심지어 폭발까지 할 테니, 그 반향을 이용하면 대공동의 규모 역시 대략적으로 측정할 수 있겠죠."
10052010-49 = "드론을 보내 두었으니, 곧 도착할 거예요."
10052010-56 = "그, 그럼…… 쏘겠습니다!"
10052010-63 = "[ns] \"어때? 좀 알겠어?\""
10052010-64 = "……생각보다도 더 엄청나네. 대략적인 크기를 말하자면, 우선 대공동 하부의 폭은-"
10052010-65 = "자, 자. 그냥 간단하고 직관적으로, 우리가 대강 상상할 수 있는 영역을 훨씬 넘어서 있는 상태라고 해 두죠!"
10052010-71 = "?!?! 모두 조심해! 지금 막 엄청난 질량 반응이 포착됐어!"
10052010-78 = "서, 선생님! 회장! 히마리 선배!"
10052010-79 = "엄청난 소리가…… 구덩이 아래에서부터 올라오고 있어요……!"
10052010-80 = "비, 비나가 오는 것 같아요!"
10052010-81 = "역시…… 깨워 버린 걸까요……. 우우우……."
10052010-82 = "[s] \"응. 그럴 것 같았어.\""
10052010-83 = "뭐. 어떤 의미로는 예측대로 일이 흘러가고 있다는 뜻이기도 하겠네요."
10052010-84 = "[ns] \"이 구역은 앞으로…… 우리의 것이다!\""
10052010-85 = "……벌써 다 이긴 것처럼 말씀하셔도 말이죠……."
