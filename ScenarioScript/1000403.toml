[translation]
1000403-1 = "당당한 이유"
1000403-2 = "게헨나 외곽의 슬럼가"
1000403-3 = "안녕, 선생님."
1000403-4 = "[s] \"여기는…….\""
1000403-5 = "아아. 이쪽은 얼마 전 선도 작전으로 학생들의 출입이 봉쇄된 곳이야."
1000403-6 = "원래는 위험한 곳이지만 한번 휘저어놨으니 며칠 간은 안전하겠지."
1000403-7 = "나를 알아보는 녀석들도 없을 거고."
1000403-8 = "그러니 안심하고 선생님을 만나도 돼."
1000403-9 = "[s] \"주변을 너무 신경 쓰지 않아도 되지 않을까?\""
1000403-10 = "……."
1000403-11 = "어쩔 수 없어. 이건 선생님을 위한 거니까."
1000403-12 = "알겠지만 난 적이 많아. 학교 안에도, 밖에도."
1000403-13 = "언제 어디서나 노려지고 있다고 봐도 돼."
1000403-14 = "그런 내가 특별히 만나는 사람이 있다는 게 알려지면 ……그 사람이 위험에 처할 수도 있으니까."
1000403-15 = "[s1] \"그럼 안 만나고 온라인으로 보면 되잖아?\"\n[s2] \"메일이나 메시지로도 일 할 수 있으니까.\""
1000403-18 = "……."
1000403-19 = "……그 말이 마, 맞긴 한데……."
1000403-20 = "그러니까……"
1000403-21 = "……."
1000403-22 = "[s] \"하지만 얼굴을 맞대고 해야만 하는 일도 있는 법이지.\""
1000403-23 = "……."
1000403-24 = "……어쩐지 날 가지고 노는 느낌인데."
1000403-25 = "맞는 말이야! 어떤 일 중에는 사람과 만나서만 할 수 있는 종류가 있어."
1000403-26 = "이 일도 그런 거야!"
1000403-27 = "어디까지나 일을 하기 위해서 만나는 것! 여기엔 어떠한 잘못도 없으니까!"
1000403-28 = "[s3] \"그치만 심야에 단둘이 있는 걸 들키면…….\"\n[s4] \"……여러 가지로 곤란해지지 않을까.\""
1000403-29 = "……? 그런가? 잘 이해가 안 되는데……."
1000403-30 = "……? 그런가? 잘 이해가 안 되는데……."
1000403-31 = "……심야에."
1000403-32 = "여러…… 가지…… 라면……"
1000403-33 = "어…… 그러니까."
1000403-35 = "……?!"
1000403-36 = "(골똘히 생각하다가 어떤 모종의 결론에 다다른 모양이다.)"
1000403-37 = "무, 무, 무슨 소릴 하는 거야?! 내, 내가 선생님이랑……?!"
1000403-38 = "내, 내가 그런 파렴치한 짓을 할 리가 없잖아!"
1000403-39 = "그런 오해를 하는 녀석들이라면 당장……."
1000403-40 = "……."
1000403-41 = "그런 가십을 좋아하는 녀석들은 어디에도 있으니. 맞는 말이야."
1000403-42 = "……생각해보니까 심야에 선생님을 만나는 건 엄청나게 위험한 짓이었구나."
1000403-43 = "오히려 한낮에 당당하게 만나는 게 더 안전했던 거 같아."
1000403-44 = "그렇지만 낮에는…… 일이 너무 많아서……."
1000403-45 = "……."
1000403-46 = "그러면 나는 언제 선생님을 만나야 하는 걸까?"
1000403-48 = "(히나는 고민이 생긴 듯 골똘히 생각에 잠겼다.)"
