[translation]
10013035-3 = "와하하하핫!! 뜨겁네. 뜨거워! 서로가 양보할 생각이 없으니 여기까지 뜨거워지는 거네! 꼭 온천 개발 같아서 좋은데!"
10013035-4 = "방해하는 건 죄다 불태워버리자고!"
10013035-6 = "응! 응! 카스미 부장의 명령이야~!"
10013035-7 = "모두 돌격! 개발을 위해! 뒤도 돌아보지 말고 저어어언부 불태워버리자!"
10013035-14 = "응~ 일단 불태우는 거네~"
10013035-16 = "치세, 너는 왜 거기 있는 건데?!"
10013035-17 = "으느읏! 끈질기기는……!"
10013035-18 = "대체 뭣 때문에 저렇게나 온천 개발에 목을 매는 거야?!"
10013035-19 = "[s] \"그것이, 온천개발부니까……?\""
10013035-20 = "선생님까지 영문 모를 소리를 하시는 건가요?!"
10013035-22 = "와핫핫핫!! 이대로 우리가 이기면, 그쪽도 마찬가지로 온천개발부의 하청으로 써먹어 줄게!"
10013035-23 = "다 같이 즐거운 온천 개발 라이프! 시작이야!"
10013035-24 = "[s] \"뙤약볕 아래에서 온천 개발에 전력투구하는 여름…….\""
10013035-26 = "그런 건 사절이라구요?!"
10013035-27 = "이대로는 계속 밀리기만 하겠어요~~ 사장님~~!"
10013035-28 = "시즈코 쨩! 무언가 수를 내야 해요!"
10013035-29 = "으으으! 이런 상황에서 온천개발부의 집단행동을 와해시키려면……."
10013035-30 = "그래! 방법은 하나뿐이야!"
10013035-31 = "온천개발부의 구심점이 되는 대장을 사로잡아…… 단숨에 무력화하는 수밖에!"
10013035-33 = "단칼에 적장의 목을 베어, 뚝! 하는 작전이로군요!"
10013035-34 = "과연 사장님……! 피도 눈물도 없는 백야당의 오너예요!"
10013035-35 = "어머나……."
10013035-36 = "시, 시즈코 공……! 시, 시대극에서 나올 법한, 그, 그런 무시무시한 일을 계획했던 건가요?! 이, 이즈나! 깜짝 놀랐어요……!"
10013035-37 = "[s] \"시즈코, 무서운 아이…….\""
10013035-38 = "아니아니아니! 그런 말은 한마디도 안 했거든요?! 왜 내 계획엔 다들 그런 소리인 건데!"
10013035-39 = "무슨 꿍꿍이인지는 몰라도, 늦었어!"
10013035-46 = "이히힛~~!"
10013035-49 = "아, 선생님."
10013035-50 = "[s] \"응, 치세? 무슨 일이야?\""
10013035-51 = "그게, 그러니까-"
10013035-52 = "저기에 있어-"
10013035-53 = "[s] \"저기? 뭐가 있는데?\""
10013035-54 = "음-"
10013035-58 = "………………………………온천?"
10013035-59 = "엉?"
10013035-60 = "응?"
10013035-65 = "[ns] \"이즈나! 치세가 가리킨 곳에-! 수리검이야!\""
10013035-69 = "네! 주군! 이즈나! 갑니다!"
10013035-70 = "이즈나류 인법……! 혼신의 비기-!"
10013035-71 = "수리검! 에잇!"
10013035-80 = "우와아앗?! 뭐야뭐야?! 깜짝 놀라버렸네-!"
10013035-81 = "갑자기 뭘 던지나 했더니……. 방금 그거, 수리검 모양 수류탄이었나?"
10013035-82 = "예상외로 엄청나게 멋진 장비를 가지고 있잖……."
10013035-94 = "어머나, 이건……."
10013035-95 = "설마…… 방금 이즈나의 공격으로-"
10013035-96 = "오, 오, 오, 오, 오……."
10013035-97 = "온천이다!"
10013035-99 = "앗~! 카스미 부장! 내 말을 가로채지 마~!"
10013035-100 = "됐고! 메구! 우리 애들 전부 준비시켜!"
10013035-102 = "자, 잠깐?! 우리들이랑 싸우던 건 어쩌고……?!"
10013035-104 = "지금 그게 중요해?! 온천이 터졌는데!"
10013035-105 = "응~! 온천개발부 일동~! 모두 준비~!"
10013035-107 = "땅!"
10013035-129 = "수, 순식간에 열대림이 사라지고 그 자리에 온천장이 들어섰다고?!"
10013035-130 = "와아…… 놀랍네요."
10013035-131 = "이야~! 멋지군! 멋져! 마음에 들어! 머릿속으로 그리고 있던 완벽한 해양심층수 온천은 아니지만"
10013035-132 = "방금 전, 그 깔끔한 한 방으로 꽤 질 좋은 온천이 만들어졌어"
10013035-133 = "그보다 대체 어떻게 찾은 거야? 스킬이 굉장한데? 거기 파란 머리 아가씨랑, 검은 머리 여우귀 아가씨 우리 온천개발부로 들어오지 않을래?"
10013035-134 = "온천 라이프, 굉장하다고?"
10013035-135 = "……?"
10013035-136 = "죄송해요! 이즈나는 이미 인법연구부의 부원인지라!"
10013035-137 = "그래? 아쉽네"
10013035-138 = "자, 그럼 다들 마무리를 하러 돌아가 볼까~"
10013035-139 = "자, 잠깐-! 이렇게 되면 아까 우리랑 나눴던 이야기라던가, 싸움이라던가, 계약서라던가……! 어떻게 되는 거야?!"
10013035-140 = "아아~ 그거."
10013035-141 = "으으으으음~~~~"
10013035-142 = "……아무래도 우리의 패배지?"
10013035-143 = "응?"
10013035-144 = "우리가 해양심층수 온천을 찾는 것보다- 그쪽이 먼저 온천을 찾아내 버리기도 했고."
10013035-145 = "이야~ 그러니 아쉽긴 하지만, 우리의 패배란 거지."
10013035-146 = "[s] \"방금 그거, 이기고 지는 문제였어……?\""
10013035-147 = "그러니까 철수해야지."
10013035-148 = "엑~! 카스미 부장! 해양심층수 온천은 아직인데?!"
10013035-149 = "기회는 다음으로 이 자리는……"
10013035-150 = "새로이 찾아온 젊은이들에게 물려준다-라는 패턴!"
10013035-151 = "으음~ 잘은 모르겠지만…… 카스미 부장이 그런 거라면 그런 거라고 해둘까……."
10013035-152 = "게다가 메구, 온천을 판 녀석 중에 나쁜 녀석은 없다구. 이 자리는 이 아이들에게 맡기는 거야!"
10013035-153 = "아! 그런 거면 상관없겠네!"
10013035-155 = "그러니까 상관이 없는 게 아니잖아……."
10013035-156 = "그래그래~ 해양심층수 온천을 파내지 못한 건 여전히 아쉽지만, 여기는 너희들에게 맡길 테니."
10013035-157 = "아……."
10013035-158 = "[s] \"잘됐네. 시즈코. 계약서를 무사히 회수할 수 있어서.\""
10013035-159 = "네! 이걸로 한 단계 앞으로 나간 거예요! 시즈코 쨩!"
10013035-160 = "그, 그건 그렇지만."
10013035-161 = "그건……."
10013035-163 = "그럼 우린 이만……"
10013035-169 = "자, 잠깐!"
10013035-175 = "응? 왜? 아직 볼일이 남았어?"
10013035-178 = "그게 말이지……."
10013035-179 = "으으으으음, 그러니까……."
10013035-180 = "그, 그래! 결정했어!"
10013035-181 = "이곳은 너희에게 맡기고 싶어."
10013035-182 = "[s] \"시즈코?\""
10013035-183 = "……응? 무슨 뜻이야?"
10013035-184 = "계약을 하자는 거야."
10013035-185 = "계약서는 뺏지 않아. 그대로 가지고 있어도 괜찮아. 대신 우리와 계약을 맺고-"
10013035-186 = "이대로 떠나지 말고, 남아서 당신네가 만든 이곳 온천 리조트를 계속 운영해줬으면 해."
10013035-187 = "……엥? <리조트 사냥>으로 뺏지 않겠다고? 왜?"
10013035-188 = "그야. 당신들 아직 해양심층수 온천을 발견하고 싶다고, 그렇게 생각하고 있잖아?"
10013035-189 = "응! 응! 아직 우리의 진짜 목적을 이룬 건 아니지. 그치 부장?!"
10013035-190 = "그건 그렇지만……."
10013035-191 = "호오……. 그래서, 과연……. 우리에게 기회를 주겠다고? 그래서 계약을?"
10013035-193 = "맞아, 백야당의 오너로서의 협업 제안인 셈이야."
10013035-194 = "아, 꼭 프랜차이즈 계약 같네요."
10013035-195 = "프랜차이즈……. 응, 정말 그 말대로일지도……."
10013035-196 = "그래서 어때? 내 제안이."
10013035-197 = "흐음……."
10013035-201 = "와핫핫! 응! 재미있는 생각이네! 응! 뭐, 나쁘지 않아!"
10013035-202 = "흐응~ 온천을 개발했는데도 타박 당하지 않고 협력 요청을 받는다……. 우리 온천개발부에겐 드문 일이긴 하지만, 뭐, 가끔은 이런 일도 있는 거겠지!"
10013035-203 = "까짓것 그 사업이란 거에 협력해주겠어. 앞으로 잘 부탁한다고, 사장!"
10013035-211 = "와아-! 이것으로 다시 쾌속 진격이네요! 사장님!"
10013035-212 = "그러니까 난 사장님 같은 게 아니라-!"
10013035-216 = "……아니, 이제는 사장이 맞나……?"
10013035-217 = "하, 하여간!"
10013035-221 = "잘 부탁해. 온천개발부."
