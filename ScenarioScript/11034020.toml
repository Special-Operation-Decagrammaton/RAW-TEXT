[translation]
11034020-1 = "#N-02"
11034020-3 = "그러고 보니 항상 이렇게 넷이 모여 있는 것과는 별개로, 이런 거대한 목표를 가지고 움직였던 적은 많지 않군."
11034020-4 = "아주 훌륭해. 역시 세상만사는 다 '계기'가 있어야 한다는 걸까."
11034020-8 = "그렇다면 모두를 위해, 앞으로는 내가 다양한 계기를 준비해야……."
11034020-12 = "누가 저거 좀 말려라."
11034020-13 = "……??? 네가 해야지. 피해자 1순위잖아."
11034020-15 = "아하하하……."
