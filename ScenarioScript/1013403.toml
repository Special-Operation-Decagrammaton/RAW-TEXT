[translation]
1013403-1 = "시작의 마을"
1013403-3 = "저기, 선생님 이거는……?"
1013403-4 = "[ns] \"특별 훈련이야!\""
1013403-5 = "어…… 그렇지만 이거는……."
1013403-6 = "그냥 게임, 아닙니까?"
1013403-7 = "[ns] \"특별 훈련이야!\""
1013403-8 = "크, 큰일입니다!"
1013403-9 = "선생님이 고장 나고 말았습니다!"
1013403-10 = "[s1] \"잠깐만, 들어봐!\"\n[s2] \"현재 아리스는 용사의 갑옷이 익숙하지 않아!\""
1013403-15 = "[ns3] \"그러니까, 몸에 길들이는 것부터 하는 거야!\"\n[ns4] \"이른바, 루틴이라는 녀석이야!\""
1013403-18 = "몸에, 길들인다……?"
1013403-19 = "운동선수 대부분이 하고 있다……? 최적의 상태를 만드는 요령……?"
1013403-23 = "그러니까, 용사의 갑옷을 입고 게임을 하기만 하면 된다는 겁니까?"
1013403-24 = "우응…… 그걸로 어떻게 수행이 된다는 건지, 아리스, 잘 모르겠습니다."
1013403-28 = "어라, 선생님? 왜 불을 끄는 겁니까?"
1013403-29 = "……불을 끄는 편이, 좀 더 몰입이 되어서 재밌다고요?"
1013403-30 = "그거는, 아리스도 그렇게 생각하지만……."
1013403-31 = "그치만, 불을 끄고 게임을 하면 눈이 나빠진다고 맨날 그러지 않았습니까?"
1013403-32 = "[s5] \"맞아. 평소에는 안돼.\"\n[s6] \"하지만 오늘은 특별 훈련이니까 예외야.\""
1013403-35 = "……!"
1013403-36 = "뭔가, 두근거리기 시작했습니다!"
1013403-37 = "밤늦게 게임하다가 몰래 편의점에 갔을 때랑 비슷한 기분입니다!"
1013403-41 = "핫……! 이거는 비밀이었습니다……!"
1013403-42 = "그, 그보다 게임입니다! 어떤 게임을 하면 됩니까?"
1013403-43 = "네? 게임도 아리스 마음대로 고르는 겁니까?"
1013403-44 = "……! 아리스가 좋아하는 게임이 잔뜩 있습니다!"
1013403-50 = "……하나같이 명작뿐이라 고를 수가 없습니다!"
1013403-54 = "예를 들어, 이 게임!"
1013403-55 = "이 게임은 커다란 무기로 용을 사냥하는 게임입니다!"
1013403-56 = "그렇게 용을 잡아서 얻은 소재로, 더 강한 무기를 만들어서 더 강한 용을 사냥합니다!"
1013403-57 = "물론, 장비만 좋다고 바로 강해지는 것은 아닙니다! 플레이어 본인이 강해지지 않는 한, 의미가 없으니까요!"
1013403-61 = "어찌 보면, 지금 아리스의 상황에 딱 맞는 게임일지 모릅니다!"
1013403-62 = "[s] \"그럼 그 게임으로 할래?\""
1013403-63 = "……분명, 이 게임은 좋아합니다만."
1013403-64 = "이 게임은 플레이 타임이 굉장히 길어서, 지금 하기에는 조금 적절하지 않은 거 같습니다."
1013403-65 = "역시, 조금만 더 살펴보고 싶습니다."
1013403-66 = "……앗, 이 게임은!"
1013403-70 = "엄청나게 어려운 걸로 유명한 게임입니다!"
1013403-71 = "필드 곳곳에 플레이어를 즉사시키는 함정이 잔뜩 숨겨져 있는데다가……."
1013403-72 = "가까스로 보스한테 도착해도, 모르면 당할 수밖에 없는 패턴으로 순식간에 패배하고 맙니다!"
1013403-73 = "그렇지만 도전을 거듭할 때마다, 조금씩 성장한 끝에 클리어하는 경험은 더없이 값집니다!"
1013403-74 = "말하고 보니, 이것도 마치 지금 아리스의 상황 같습니다……."
1013403-75 = "[s] \"그러면 그 게임으로 할까?\""
1013403-76 = "……아니요. 분명 좋아하는 게임이지만."
1013403-77 = "이 게임을 하면, 오히려 용사의 갑옷에 트라우마가 생길 거 같습니다……."
1013403-78 = "플레이 타임이 적당하면서, 편안한 기분이 들 만한 게임은……."
1013403-83 = "아."
1013403-87 = "정했습니다. 아리스, 이게 좋습니다."
1013403-88 = "[s7] \"그 게임은…….\"\n[s8] \"<테일즈 사가 크로니클>?\""
1013403-91 = "네! <테일즈 사가 크로니클>, 정확히는, <테일즈 사가 크로니클 1>입니다!"
1013403-92 = "아리스가 게임개발부에 들어오기 전에, 게임개발부 모두가 함께 만든 첫 작품입니다."
1013403-93 = "비록 만드는 과정에는 함께하지 못했지만, 플레이하고 있으면 다들 어떤 생각을 하며 만들었는지 생생하게 전해져 옵니다."
1013403-94 = "그리고, 무엇보다, 이 게임……."
1013403-95 = "진짜 망겜입니다!"
1013403-96 = "[s9] \"아, 아리스?!\"\n[s10] \"평범한 물건이 아니라고 듣긴 했지만……!\""
1013403-99 = "하지만 사실입니다!"
1013403-100 = "처음 플레이할 때는 몰랐습니다. 하지만 여러 게임을 섭렵한 지금의 아리스는 단언할 수 있습니다."
1013403-101 = "<테일즈 사가 크로니클 1>은 진. 짜. 망. 겜. 입니다!"
1013403-105 = "……그래도, 아리스는 이게 좋습니다."
1013403-106 = "이건 아리스가 처음으로 플레이했던 게임입니다."
1013403-107 = "이 게임은, 아리스를 처음으로 용사라고 불러줬습니다."
1013403-108 = "……역시, 아리스는 이 게임을 좋아합니다."
1013403-109 = "그리고, 플레이 타임도 적절합니다!"
1013403-110 = "공략만 안다면 3시간 안에 트루 엔딩까지 도달할 수 있으니까요!"
1013403-111 = "자, 선생님! 같이 하는 겁니다!"
1013403-113 = "(그렇게 아리스에게 떠밀리듯이 <테일즈 사가 크로니클 1>을 함께 플레이하게 되었다.)"
1013403-115 = "[56cd7b]< 코스모스 세기 2354년, 인류는 업화의 불길에 휩싸였다. >[-]"
1013403-116 = "정통 판타지 RPG라면서, 오프닝부터 이런 서두입니다!"
1013403-117 = "심지어 코스모스 세기라는 고유명사는 이 부분에서만 나옵니다!"
1013403-118 = "[56cd7b]< 튜토리얼을 시작합니다. >[-]"
1013403-120 = "[56cd7b]< 먼저 B 키를 눌러, 눈앞의 무기를 장착해보세요. >[-]"
1013403-121 = "아, 이건 함정입니다. 여기서 B 버튼을 누르면 그대로 게임 오버입니다."
1013403-122 = "A 버튼을 눌러야 진행할 수 있습니다."
1013403-124 = "[ns11] \"들었던 것보다 기괴한 물건인데…….\"\n[ns12] \"진짜 3시간 안에 깰 수 있는 거야?\""
1013403-127 = "으음…… 공략을 모른다면, 평생 클리어할 수 없을지도 모르겠네요."
1013403-128 = "하지만 아리스처럼 숙련된 플레이어에게는 문제없습니다!"
1013403-130 = "아."
1013403-131 = "적 인카운터와 조우하지 않고, 첫 마을까지 도착했습니다."
1013403-132 = "초반에는 회복 수단이 제한적이라 운이 좋았습니다!"
1013403-138 = "……이 '시작의 마을'의 BGM."
1013403-139 = "아리스는 정말 좋아합니다. 듣고 있으면, 처음 이 게임과 만났을 때로 돌아간 기분을 느낍니다."
1013403-140 = "……후후."
1013403-141 = "정말 신기합니다. 그때 아리스는 갓 태어난 아기처럼 아무것도 몰랐는데."
1013403-142 = "그 후 빛의 검을 얻고, 동료들과 만나…… 수많은 모험을 함께한 끝에……."
1013403-143 = "지금은 이런 머나먼 빙해에 와 있습니다."
1013403-144 = "진짜 용사의 모험 같습니다."
1013403-145 = "어떤 의미에서, 이 '시작의 마을'은 아리스에게도 시작점이었습니다."
1013403-149 = "……앗! 몬스터와 조우했습니다!"
1013403-150 = "더블 배럴 샷건을 가지고 있는 푸니젤리입니다! 근접전으로 상대하기 힘든 적입니다! 여기서는……."
1013403-152 = "(아리스와 함께 <테일즈 사가 크로니클 1>을 플레이했다.)"
1013403-153 = "(그리고…….)"
1013403-156 = "……이걸로, 최종 보스 클리어입니다!"
1013403-157 = "어라, 선생님? 왜 그러신가요?"
1013403-158 = "왠지 슬픈 아기 강아지 같은 얼굴을 하고 있습니다!"
1013403-159 = "[s] \"저기, 아리스…… 하나만 물어봐도 돼?\""
1013403-163 = "[ns13] \"왜 어머니가 히로인이고, 사실 어머니는 전생의 아내였으며,\"\n[ns14] \"아내는 어렸을 때 왜 헤어진 이복 친구가 타임리프해서 온 거야?\""
1013403-167 = "아리스도 모릅니다!"
1013403-168 = "하지만……."
1013403-169 = "재미있지 않습니까?"
1013403-170 = "[s15] \"……그러네.\"\n[s16] \"정말 재밌었어.\""
1013403-173 = "역시 그렇습니까? 아리스도 정말 재밌었습니다!"
1013403-174 = "그러면 다음에는……."
1013403-176 = "(어쩌다 보니 자연스럽게 계속 게임을 하는 흐름이 되었다.)"
1013403-177 = "(한동안 아리스와 여러 게임을 함께 즐기며 시간을 보냈다.)"
