[translation]
10035030-1 = "제3화;어린이 친구들, 놀아 드립니다!"
10035030-2 = "새로운 근무처가 바로 저기군요!"
10035030-3 = "어린이 친구들이 노는 키즈 풀입니다!"
10035030-4 = "실내로 들어온 건 좋지만, 어린애들 돌보기는 쉽지 않은데……."
10035030-5 = "체력이 좋아서 여기저기 뛰어다니면 잡기 힘들다고."
10035030-9 = "……."
10035030-10 = "[s1] \"실수할 수도 있지.\"\n[s2] \"아까 일은 너무 마음에 두지 마.\""
10035030-13 = "……네, 선생님."
10035030-14 = "아까는 공안국 업무와 생활안전국의 업무를 혼동해 버린 것 같습니다."
10035030-15 = "오랜 기간 공안국에서 지내면서 이런 방식이 몸에 배어버린 탓이겠죠."
10035030-16 = "괜찮습니다! 실수는 누구나 할 수 있는 거니까요!"
10035030-17 = "처음부터 완벽할 수는 없는 법이지."
10035030-18 = "기운 내라고, 국장."
10035030-19 = "……고맙다."
10035030-20 = "확실히, 대민 업무에서는 너희가 나보다 낫군."
10035030-21 = "아까와 같은 상황이 벌어지지 않도록 조언을 부탁해도 되겠나."
10035030-22 = "그야 물론, 적당히 일하다가 적당히 쉬는 게 베스트—"
10035030-23 = "노는 것부터 가르쳐 드리면 어떡해요, 후부키!"
10035030-24 = "그럼 국장님을 위해, 생활안전국에 들어왔을 때 귀따갑게 들은 대민 업무의 3대 원칙을 알려드리겠습니다!"
10035030-26 = "3대 원칙이라."
10035030-27 = "신났구만."
10035030-29 = "네, 바로바로—"
10035030-30 = "'봉사, 경청, 성실' 입니다!"
10035030-31 = "봉사! 시민에게 항상 봉사한다는 생각으로!"
10035030-32 = "경청! 시민의 말을 들을 때는 귀를 기울여서!"
10035030-33 = "성실! 시민에게 도움을 드릴 때는 언제나 성실한 태도로!"
10035030-34 = "본관이 저번 분기 생활안전국 대민 평가에서 좋은 점수를 받은 것도, 이 원칙을 성실히 지켰기 때문이 아닐까요!"
10035030-35 = "정작 중요한 실기 평가에서는 사격 빵점을 기록했지만 말야."
10035030-36 = "조, 조용히 하세요!"
10035030-37 = "그리고 또 하나 더."
10035030-38 = "한 가지 더 있는 건가?"
10035030-39 = "이건 3대 원칙은 아니지만……본관이 그동안 생활안전국에서 시민분들을 도와드리며 깨달은 거예요."
10035030-40 = "바로, 미소입니다."
10035030-41 = "미소라……?"
10035030-42 = "네, 어떤 상황이든, 시민분들께는 늘 웃는 얼굴로 대하려고 노력하거든요."
10035030-43 = "경험상, 그러면 시민분들께서도 마주 웃어 주시고, 그러면 본관도 덩달아 기분이 좋아집니다!"
10035030-44 = "알겠다. 머릿속에 넣어 두지."
10035030-45 = "네! 그럼 어린이 친구들을 만나러 가죠!"
10035030-49 = "그야말로 키즈 풀이네요."
10035030-50 = "풀장 깊이도 허리까지밖에 안 오고……"
10035030-51 = "수영에 익숙하지 않은 본관도 이곳이라면 얼마든지 구조활동에 임할 수 있겠어요!"
10035030-52 = "게다가 귀엽고 순수한 어린이들도 많아요!"
10035030-53 = "뭐야, 신입이 왔잖아?"
10035030-54 = "케헤헤, 이번에는 또 어떻게 놀아 줄까?"
10035030-55 = "어, 어라?"
10035030-56 = "으음, 벌써부터 불길한데."
10035030-57 = "앗, 거기 노란 수영복 어린이! 뛰어다니면 위험합니다!"
10035030-58 = "키킥! 이쪽이라구!"
10035030-59 = "이리 오세요!"
10035030-63 = "엇, 키리노 경관, 조심해라!"
10035030-65 = "걸려들었다! 스파인버스터!"
10035030-72 = "아앗?!"
10035030-77 = "오오, 깔끔하게 들어갔는걸."
10035030-78 = "저 녀석, 소질 있을지도."
10035030-79 = "어푸어푸!"
10035030-80 = "후, 후부키! 도와주세요!"
10035030-81 = "그냥 일어서라구, 키리노."
10035030-82 = "아, 그렇죠. 허리까지밖에 안 오는 얕은 물이니……."
10035030-83 = "와아! 마녀가 되살아났다!"
10035030-84 = "공격! 공격해!"
10035030-85 = "우왁! 물, 그만 뿌리세요! 눈을 뜰 수가 없잖아요!"
10035030-86 = "자꾸 그러면 본관도 가만있지 않습니다!"
10035030-87 = "에잇! 에잇!"
10035030-91 = "……."
10035030-92 = "[s] 어째, 같은 수준으로 놀고 있는 것 같지 않아?"
10035030-93 = "그러게 말이야."
10035030-94 = "어쩔 수 없지. 내가 나서는 수밖에."
10035030-95 = "어떻게 할 생각이지?"
10035030-98 = "자, 모두 주목~"
10035030-99 = "뭐야, 저 녀석은?"
10035030-100 = "허접해 보이는데?"
10035030-101 = "지금부터……무궁화꽃이 피었습니다를 시작할 거야!"
10035030-102 = "무궁화꽃이 피었습니다?!"
10035030-103 = "누가누가 제일 잘하나 보자!"
10035030-104 = "(아니, 갑자기 제안해도 응할 리가 없지 않나.)"
10035030-105 = "1등한테는 상으로 플러스 10점이다!"
10035030-106 = "(점수라니, 무슨 점수인지도 모르는데 아이들이 받아들일 리…….)"
10035030-107 = "자, 1라운드 시작한다!"
10035030-108 = "무궁화꽃이 피었습니다!"
10035030-109 = "……(이, 일단 멈췄는데!)"
10035030-110 = "……(솔직히 왜 하는지는 모르겠지만……!)"
10035030-111 = "……(그치만 지고 싶지는 않아!)"
10035030-113 = "어! 거기, 움직이면 탈락인데 괜찮아?"
10035030-117 = "방금까지만 해도 강아지처럼 뛰어놀던 아이들이……."
10035030-118 = "완전 얌전해졌네요……!"
10035030-119 = "자, 다시, 무궁화꽃이 피었습니다~"
10035030-121 = "(이후 후부키가 능숙하게 아이들을 놀아 주었다.)"
10035030-123 = "[ns3] \"후부키, 대단한걸.\"\n[ns4] \"후부키, 아이들을 잘 다루네.\""
10035030-126 = "뭐, 기본이지."
10035030-127 = "강제로 통제하기보다는 서로 경쟁시키는 편이 더 재밌고, 체력도 더 쓰게 되거든."
10035030-128 = "순찰 중 말썽쟁이들을 상대하다가 자연스럽게 터득하게 된 팁이랄까."
10035030-129 = "그, 그렇군……."
10035030-130 = "공부가 되었다."
10035030-131 = "이제 그냥 발이나 담그면서 애들을 지켜보기만 하면 돼."
10035030-132 = "뒷일은 맡겨도 되지?"
10035030-134 = "네! 감시는 맡겨주세요!"
10035030-135 = "아까는 잠깐 방심한 탓에 당했지만, 두 번은 없습니다!"
10035030-136 = "그럼 나는 반대편에서 지켜보겠다."
10035030-137 = "[s] \"나도 칸나 옆에 있을게.\""
10035030-138 = "네, 두 명씩 나누어 양편에서 지켜보면 되겠네요!"
10035030-139 = "물론 선생님은 라이프가드가 아니긴 하지만요."
10035030-142 = "생각보다 쉽지 않군요, 라이프가드 일은."
10035030-143 = "[s] \"금방 잘할 수 있을 거야.\""
10035030-144 = "그러면 좋겠습니다만……솔직히 아직 자신이 없습니다."
10035030-145 = "아까 실수는 그렇다 쳐도, 제게 후부키와 같은 능숙함은 없으니까요."
10035030-146 = "[s] \"아직 시무룩해하기는 일러.\""
10035030-148 = "[ns] \"봉사, 경청, 성실, 그리고 미소잖아?\""
10035030-150 = "후후, 그랬었지요."
10035030-151 = "알겠습니다. 조금 더 힘써보도록 하죠."
10035030-155 = "?!"
10035030-156 = "푸웁! 콜록!"
10035030-157 = "사, 살려주세요!"
10035030-158 = "케엑! 켁!"
10035030-159 = "어린아이가 물에 빠져서……!"
10035030-160 = "다녀오겠습니다, 선생님!"
10035030-165 = "헉, 허억."
10035030-166 = "괜찮나?"
10035030-167 = "콜록, 콜록……!"
10035030-168 = "무, 물속에 악어가 있어요! 커다란 악어가……!"
10035030-169 = "놀라서 헛것을 본 모양이군. 진정해라."
10035030-170 = "이제 물은 무서워!"
10035030-171 = "더 이상 들어가고 싶지 않아요……!"
10035030-172 = "괜찮다. 다시 빠지지 않게 내가 지켜보고 있으니."
10035030-173 = "[s] \"칸나! 미소! 미소!\""
10035030-174 = "……아!"
10035030-178 = "이, 이제 안심해도 좋다."
10035030-179 = "……."
10035030-180 = "으아아아앙!"
10035030-188 = "?"
10035030-189 = "[ns] (칸나의 얼굴을 보더니 스스로 물에 뛰어들었어……?)"
10035030-190 = "무서워어! 도, 도망갈래! 우아앙—!"
10035030-194 = "……선생님."
10035030-195 = "저, 정말 잘할 수 있을까요."
10035030-196 = "자신이 없어졌습니다……."
