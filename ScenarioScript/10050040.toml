[translation]
10050040-1 = "제4화;Covert Ops"
10050040-3 = "그러면, 오늘도 열심히 해 볼까요!"
10050040-9 = "부장님? 뭔가…… 어제는 보이지 않던 학생분들이 보이는 것 같은데요?"
10050040-10 = "그렇네요……. 분위기가 뭔가 달라요. 교복 색도 검은색이고……."
10050040-19 = "트리니티 학생분들이…… 미묘하게 피하고 있는 것처럼 보이는데요?"
10050040-20 = "이런 비유가 맞을지는 모르겠지만, 꼭 사무국 왔을 때의 우리 학생들을 보는 것 같군요……."
10050040-21 = "뭐, 아마도 우리는 잘 모르는 트리니티 내부 사정인 것 같으니, 이쪽은 이쪽 일에 충실하도록 하죠."
10050040-22 = "계속해서 열심히 벌어 봅시다!"
10050040-28 = "여기 계셨군요, 두 분!"
10050040-35 = "어머나? 누구시죠?"
10050040-36 = "쉿. 잠시만 목소리를 낮춰 주세요. 그리고 절 따라오시고요."
10050040-37 = "네, 네? 이건 또 갑자기 무슨 일이……?"
10050040-42 = "어딘가의 체육관"
10050040-43 = "헉, 헉……. 왜들 그렇게 바쁜가요……."
10050040-44 = "여긴 어디죠? 그리고 우리를 트리니티 학생분들이 어째서……?"
10050040-45 = "그건 이제부터 알게 되실 거예요."
10050040-46 = "여러분! 그분들이 도착했답니다! 이제 안전해요!"
10050040-54 = "이건, 도대체……?"
10050040-55 = "……실례가 되지 않는다면, 사정 설명을 부탁드려도 될까요?"
10050040-56 = "네, 물론이죠. 우선 여기까지 오는 길에 보셨던…… 그, 검은 교복을 입고 있는 학생들에 대한 것부터 말씀드려야 할 것 같네요."
10050040-57 = "그분들은 정의실현부…… 트리니티의 치안과 교풍을 수호하는, 일종의 선도 동아리라고 볼 수 있어요."
10050040-58 = "물론 고생이 많은 분들이기는 하지만, 이야기에 따르면 정의실현부의 부장님은 사람을 우그러진 깡통처럼 접어 버린다는 소문이……."
10050040-59 = "거기에서 괜한 트집만 더 잡는 패턴만 추가되면 사무국 맞구만요……."
10050040-60 = "그, 그런데 그런 분들이, 오늘따라 어째서……?"
10050040-61 = "그것은…… 두 분께서 정의실현부의 추적을 받기 시작했기 때문입니다."
10050040-62 = "우리가요……?"
10050040-63 = "어째서…… 냐고 묻기에는, 조금 찔리는 부분이 있기는 하네요……."
10050040-64 = "상황을 말씀드릴게요. 오늘 아침부터 두 분은…… 수배 대상이 되셨답니다."
10050040-68 = "저희 같은 트리니티의 일반 학생들에게까지 공개 수배령이 내려진 것은 아니지만."
10050040-69 = "적어도 정의실현부 부원 중 상당수는, 여러분을 찾고 있다고 보아도 되겠죠."
10050040-70 = "듣기로는, 정의실현부 뿐만 아니라, 그 윗선에는 티파티까지 암암리에 얽혀 있다는 소문도……."
10050040-71 = "티파티는 또 뭐죠?"
10050040-72 = "그건 말이죠……."
10050040-74 = "그, 그러니까…… 삼두 정치로 운영되는 트리니티의 학생회가, 저희를……?"
10050040-75 = "……비유하자면 체리노 회장이 직접 우리를 수배했다는 뜻이로군요."
10050040-76 = "아뇨, 차라리 진짜 체리노 회장이라면, 어떻게든 빠져나갈 방법은 한 100가지 정도 있겠지만……."
10050040-77 = "부장님! 그래서 제가 다른 학교 자치구에 가는 것은 위험하다고 말씀드렸잖아요……!"
10050040-78 = "아뇨…… 아닙니다. 타카네. 우리에게는 아직 기회가 있어요!"
10050040-79 = "왜냐하면, 트리니티 학생들이 정의실현부에 우리를 넘기려고 했다면, 진작에 그렇게 했을 테니까요!"
10050040-80 = "정말 그러려나요……."
10050040-81 = "어쨌든, 두 분이 발각된다면 아마도…… 즉결 추방을 당하게 될 거예요."
10050040-82 = "판매 대금도 전액 몰수당하겠죠."
10050040-83 = "그건 좀 곤란한데요! 경제 활동 탄압이잖아요!"
10050040-84 = "그리고 분명, 저희가 두 분에게서 구매한 책도, 모두 압수당할 거고요……."
10050040-85 = "그건 좀 곤란한데요! 문화 활동 탄압이잖아요?"
10050040-86 = "걱정하지 마세요. 그래서 두 분을 여기로 모셔 온 것이니까요."
10050040-87 = "그러고 보니, 여기는 어떤 곳인가요?"
10050040-88 = "네. 좋은 부분을 말씀해 주셨어요. 여기는 바로……."
10050040-89 = "'트리니티 아가씨 비밀 기지'랍니다!"
10050040-90 = "지금 자기 입으로 트리니티 아가씨라고 말한 것 같은데요?!"
10050040-91 = "부장님, 쉿. 쉿!"
10050040-92 = "잘 사용되지 않는 체육관을 정리해서, 이렇게 자리를 만들어 보았답니다."
10050040-93 = "당연하지만, 정의실현부의 자매님들도 이곳에 대해서는 잘 모르실 거예요."
10050040-94 = "그리고 여기에 모인 분들은 모두, 철저히 비밀을 지켜 주실 거고요. 말 그대로 일종의 비밀 기지죠."
10050040-98 = "같은 학교 안에서도 이렇게 비밀과 암투가 흘러 다니는 건가요……. 무섭네요, 트리니티. 정말 무서워요……."
10050040-99 = "그런 말을 우리 출판부가 하는 건, 조금 자학하는 느낌도 들고 그러네요……."
10050040-100 = "뭐, 하지만 이건 어떤 의미에서 기회입니다."
10050040-101 = "원래 이렇게 탄압받는 문화가 더 잘 팔리는 법이에요! 문화에 있어 탄압은 일종의 훈장 같은 거죠!"
10050040-102 = "별거 아닌 장면도 괜히 검열이니 뭐니 하는 게 붙으면, 그 자체로 홍보가 되어서 판매량이 몇 배는 늘어나기도 하고요!"
10050040-103 = "훈장이라고 하니까 수염 훈장이 생각나네요……."
10050040-104 = "그런 정말로 아무짝에도 쓸모없는 거 말고요……."
10050040-105 = "아무튼, 여러분들의 말씀은 잘 이해했습니다."
10050040-106 = "네. 이런 자리를 마련해 주신 것에 대해 진심으로 감사드려요."
10050040-107 = "그러면 오늘의…… '판매회'를, 시작하도록 할까요!"
10050040-111 = "그러면 슬슬 판이 전부 깔린 것 같으니……."
10050040-112 = "다음 과정을 부탁하도록 할까요, 타카네. 힛. 힛. 히."
10050040-113 = "……그거, 정말 해야 하나요……?"
10050040-114 = "물론이죠. 이게 다 마케팅이라니까요?"
10050040-115 = "상상만 해도 부끄러워 죽을 것 같은데요……."
10050040-116 = "이렇게 생각하는 거예요. 타카네. 모든 것은 문화 활동의 홍보를 위해서, 라고요!"
10050040-117 = "으으……. 아, 알겠습니다. 부장님……."
10050040-124 = "안녕하세요, 코하루 씨? 뭔가, 오랜만이네요."
10050040-125 = "으, 응……. 그, 그러게……. 오늘따라 정의실현부 부원들이 많이 보이는데, 무슨 일 있어?"
10050040-126 = "그게 말이죠. 뭔가…… 그…… 이상한, 책이 돌아다닌다고 해서요."
10050040-127 = "그 책의 출처와 유통 규모, 트리니티에 미치는 영향을 조사하라는 명령이 내려왔어요."
10050040-128 = "표면적으로는 도서부의 활동을 돕는다는 구실이지만……."
10050040-129 = "어째서인지, 티파티로부터 직접 명령이 내려왔다는 소문이 정의실현부 안에서 돌고 있기도 하거든요……."
10050040-130 = "티, 티파티?! 거기까지 올라갈 일이었어!?"
10050040-131 = "저희도 모르죠……."
10050040-132 = "뭔가, 그 책에 대한 이야기…… 나도 들은 것 같기도 한데……."
10050040-133 = "정말인가요? 단서라도 있나요?"
10050040-134 = "아, 아니야. 정말로 지나가다 이야기 정도만 들은 거라서……."
10050040-135 = "그렇군요. 뭔가 단서 비슷한 것이라도 찾아내면 알려 주세요."
10050040-136 = "이렇게까지 단서가 안 잡히는 건, 정의실현부 활동 중에서도 처음이거든요……."
10050040-137 = "무, 물론 저도 1학년이다 보니 활동 기간이 길지 않아서, 경험은 많지 않은 편이지만요."
10050040-138 = "그렇다고는 해도 마치, 누군가가 조직적으로 이 일을 숨기고 있는 것 같은 기분이 들어요."
10050040-139 = "으, 으응. 나도 열심히 알아볼게. 그러면 정말로 아무것도 얻어낸 게 없는 거야?"
10050040-140 = "불행 중 다행이라고 할지, 1권의 샘플과 2권의 샘플 같은 걸 간신히 몇 부 구하긴 했어요."
10050040-141 = "어, 어떤 건데?! 나, 나도 조금 볼 수 있을까?"
10050040-142 = "네? 네, 그야……. 코하루 씨도 어떻게 보면 정의실현부 부원이기도 했고, 이 정도는 다들 알고 있을 것 같으니……."
10050040-143 = "자요. 여기 있어요."
10050040-144 = "어디, 어디……."
10050040-148 = "삐약?!"
10050040-153 = "코, 코하루 씨?! 코하루 씨?!?!"
10050040-155 = "이, 이건 말이야……. 그러니까, 정말로. 정말 내가 보고 싶어서 그러는 게 아니고."
10050040-156 = "정말로 그냥 순수하게 돕고 싶어서 그러는 거니까 말이지?!"
10050040-157 = "……다음 샘플은, 아직 없어?"
10050040-158 = "아직 없는데요……."
10050040-159 = "혹시 필요하시면, 그 샘플은 드릴게요. 괜찮아요. 아직 조금 더 있거든요."
10050040-160 = "고, 고마워. 그러면…… 혹시, 조사하다가 뭔가 발견하면, 나에게도 보여 줄 수 있을까?"
10050040-161 = "나, 나도 나름대로 열심히 찾아볼 테니까 말이야!"
10050040-162 = "네. 그러죠. 협조 감사드려요. 그러면 수고해 주세요!"
10050040-163 = "으, 응. 나도 힘낼게......!"
10050040-167 = "……."
10050040-172 = "저, 정말로 다른 뜻은 없으니까……! 나는 정의실현부의 엘리트…… 가 될 인재니까!"
10050040-173 = "그, 그보다 이거…… 어쩌지?"
10050040-174 = "가만…… 이번 일, 정의실현부와 도서부가 협업 중이라고 했으니까……?"
10050040-176 = "정의실현부 부실"
10050040-177 = "후우……."
10050040-178 = "[s] \"기운이 없어 보이네…….\""
10050040-179 = "죄송합니다. 선생님. 좋지 않은 모습을 보여드렸군요."
10050040-180 = "그렇다고는 해도, 좀처럼 단서가 잡히지 않고 있는 것은 사실입니다……."
10050040-181 = "특히 제가 신경 쓰이는 것은, 지금까지는 없었던, 학우분들의 비협조적인 태도입니다."
10050040-182 = "청취를 해 보아도, 모른다거나, 뭔가 미묘하게 말을 돌리고 있는 것 같은 느낌이에요."
10050040-183 = "그래서 이런 생각까지 들 정도입니다. 혹시 트리니티의 순수한 학우들이."
10050040-184 = "그 책에서 발산되는 어떤 수수께끼의 파장 같은 것에 홀린 것은 아닐까…… 하고요."
10050040-185 = "[s] \"그건 좀 지나친 음모론 같아…….\""
10050040-186 = "확실히 그렇겠지요? 너무 내부에서 보고를 받기만 했더니, 사고방식이 이상해진 듯합니다."
10050040-187 = "아무래도 몸을 움직여야겠습니다. 저 역시 순찰이라도 돕고 오겠습니다."
10050040-191 = "안녕하세요, 선생님. 좀 어떠신가요? 어라, 그러고 보니 마시로 씨는요?"
10050040-192 = "아……. 순찰을 돕겠다며 나가셨다고요? 정말 성실하네요. 열정적이고요."
10050040-193 = "그렇지만 조금만 더 남아 있었으면 좋았을 텐데요. 지금 막 후속권의 샘플을 구해 왔거든요."
10050040-194 = "[s] \"어? 정말?\""
10050040-195 = "네. 한번 보시겠어요?"
10050040-201 = "[ns] \"어라……?\""
10050040-203 = "[ns1] (이거, 뭔가 어딘가에서 본 듯한 느낌이……?)\n[ns2] (특히 이 전개라든가, 캐릭터 활용이라든가…….)"
10050040-206 = "왜 그러세요, 선생님?"
10050040-207 = "아무것도 아니라고요?"
10050040-208 = "……."
10050040-209 = "네. 선생님께서 그렇게 생각하신다면, 그런 것이겠죠. 알겠습니다."
