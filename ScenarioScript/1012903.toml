[translation]
1012903-1 = "눈이 멀 정도로 당당하게"
1012903-3 = "(오늘도 평화롭구나.)"
1012903-4 = "(라고 생각하며, 공원 벤치에 앉아 있었다.)"
1012903-10 = "선생님!!"
1012903-11 = "잠시 벤치 뒤 좀 빌리겠습니다, 실례합니다!"
1012903-12 = "[s]\"스즈미?! 갑자기 왜??\""
1012903-18 = "앞을 보고 태연하게 행동해 주십시오."
1012903-19 = "쫓기고 있습니다."
1012903-20 = "[s]스즈미의 말에 따른다."
1012903-25 = "어디 갔어? 분명 이쪽으로 갔는데?"
1012903-26 = "잡히면 똑같이 갚아주마!!!"
1012903-27 = "공원을 포위해!! 절대 못 나가게 해!!"
1012903-28 = "모두, 공원을 둘러싸!!"
1012903-29 = "하얀 머리에 회색 트리니티 교복을 입은 녀석이 나오면 바로 작살내버려!"
1012903-34 = "[ns1]\"팬들이야?\"\n[ns2]\"친구들이야?\""
1012903-37 = "그럴 리가 없잖습니까."
1012903-41 = "일단 공원 외곽으로 물러났군요."
1012903-42 = "알려주신 수선집에 가고 있었는데, 갑자기 기습당했습니다."
1012903-43 = "애초에 노리고 함정을 판 모양입니다. 싸워보려 했지만, 탄약도 다 떨어졌습니다."
1012903-44 = "선생님 덕분에 숨은 돌렸습니다만, 어떻게 해야 할지……."
1012903-45 = "[s]\"상대가 몇 명이나 되는데?\""
1012903-46 = "자세한 수치는 모르겠습니다만……."
1012903-47 = "대충 90명까지는 제압했습니다만, 아직 두 배 이상은 남아있는 것 같습니다."
1012903-48 = "[s3]\"90명?!\"\n[s4]\"남은 상대는 그럼 200명 정도 되는 건가?\""
1012903-51 = "아마…… 그럴 거라고 생각합니다."
1012903-52 = "이대로라면 포위를 뚫고 나가기 힘들어 보입니다."
1012903-53 = "……후……."
1012903-54 = "감사합니다. 선생님. 충분히 휴식했으니 약한 포위망은 뚫고 나갈 수 있을 겁니다."
1012903-55 = "휘말리지 않게 먼저 공원을 빠져나가십시오."
1012903-60 = "아얏……."
1012903-61 = "[s]\"괜찮아? 다쳤어?\""
1012903-62 = "살짝 삔 모양입니다."
1012903-63 = "뛰기는 힘들겠군요. 그래도 어떻게든 해보면……."
1012903-64 = "[s5]\"무리하면 안 돼!\"\n[s6]\"다른 방법을 찾아보자!\""
1012903-67 = "상대가 제 인상착의를 공유했기에 포위를 뚫으려면 충돌이 불가피합니다."
1012903-68 = "괜찮습니다. 제가 어떻게든 해볼 테니, 선생님은 부디……."
1012903-69 = "[s7]\"방법이 있긴 한데…….\"\n[s8]\"내 말을 따라줬으면 좋겠어.\""
1012903-72 = "선생님을 위험에 휘말리게 할 수는 없습니다!"
1012903-73 = "[s]\"나는 스즈미의 선생님인걸?\""
1012903-77 = "아…… 알겠습니다. 그러면 어떻게 해야……."
1012903-80 = "서, 선생님……."
1012903-83 = "이 옷을 입는 게 '좋은 방법'인 건가요?!"
1012903-84 = "[s]\"마침 수선집에 가던 길이라서 다행이네!\""
1012903-85 = "수적으로 열세에 활동도 불편해서 오히려 불리할 겁니다."
1012903-86 = "자, 장난치시는 건가요?!"
1012903-87 = "[s9]\"아까 저기서 말했잖아?\"\n[s10]\"'회색 트리니티 교복을 입은 녀석'을 잡으라고.\""
1012903-90 = "!!"
1012903-91 = "그렇…… 군요. 확실히……."
1012903-92 = "상대는 제 특징을 대부분 구두로 전달받았을 테고,"
1012903-93 = "제 구체적인 외모에 대해서 사진 같은 것이 없기에 그렇게 전파했을 겁니다."
1012903-94 = "그래서 변장하면…… 충돌 없이 벗어날 수 있겠군요."
1012903-95 = "그래도 이 모습은 역시 너무 부끄럽습니다……!"
1012903-96 = "[s11]\"마법소녀는 싸우는 정의의 투사.\"\n[s12]\"옷이 상황에 맞는 것 아닐까?\""
1012903-99 = "그렇게 말씀하신들……. 하아, 알겠습니다."
1012903-100 = "선생님께서는 일단 안전을 위해 거리를 둬 주십시오."
1012903-101 = "[s]\"사실, 계획이 한 단계 더 있는데…….\""
1012903-109 = "아직 안 나타났지? 트리니티 교복을 입은 녀석."
1012903-110 = "응. 다른 사람들은 포위를 풀어서 통과시키긴 했어."
1012903-111 = "걸리기만 해봐라, 아주 작살을 내줄 테니까!!"
1012903-117 = "뭐야 저거?"
1012903-121 = "테, 테르밋 화이트. 등장~!"
1012903-126 = "?????"
1012903-127 = "옆에 샬레의 선생 아냐?"
1012903-128 = "핸드폰으로 영상 찍고 있잖아?"
1012903-130 = "준비된 사수로부터, 사격 개시! ☆"
1012903-131 = "[s]\"좀 더 부끄러운 표정으로!\""
1012903-135 = "다, 당신의 눈동자에…… 플래시뱅~☆"
1012903-137 = "샬레의 선생님은 저런 취미가 있구나……."
1012903-138 = "야, 이쪽으로 온다. 포위 풀어서 비켜줘."
1012903-139 = "저게 샬레에서 한다는 당번이 하는 일인가 봐."
1012903-140 = "어후…… 고생이 많네……."
1012903-141 = "비, 비켜줘서 고마워요. 요정 여러분!"
1012903-142 = "아…… 네……."
1012903-143 = "가자, 선생하고 눈 마주칠라……."
1012903-149 = "진짜로 먹혀들었군요."
1012903-150 = "설마, 선생님께서도 카메라맨으로 '변신'하는 작전일 줄은……."
1012903-151 = "[s13]\"아, 지금 건 편집할게.\"\n[s14]\"대사 계속 해! 테르밋 화이트!\""
1012903-157 = "정말 찍고 계셨던 겁니까!!!!"
1012903-159 = "(이후, 스즈미와 함께 공원을 벗어났다.)"
1012903-160 = "(다른 불량배들도 날 보고 멀찌감치 피해주었다.)"
