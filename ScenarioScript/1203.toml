[translation]
1203-1 = "Maid&Made 2"
1203-4 = "선배, 가만히 계세요. 머리 흐트러지겠어요."
1203-5 = "대체 이게 무슨 짓이냐고……. 이거 완전 주객전도잖아, 주객전도."
1203-7 = "분명 처음엔 메이드복이 신분을 숨기기 위한 위장이었는데……."
1203-8 = "아니. 문제는 없어. 의뢰를 받았고 계약서도 썼다. 그러니 의뢰 내용을 충실히 따르는 것뿐."
1203-9 = "하아? 완전 신이 났네? 평소에는 어떻게 참은 거야?"
1203-10 = "그, 그건……. 음……."
1203-11 = "흠흠. 아무튼 선배야 말로 이런 날까지 흐트러진 차림새로 오는 건 잘못됐다고 생각하는데."
1203-12 = "아앙? 어쩔 수 없잖아! 오는 길에 또 불량배 녀석들이랑……!"
1203-13 = "자, 자. 두 분 다 잠시만 그대로 있어 주세요. 특히 네루 선배. 지금 머리 땋고 있는 거 헝클어진다니까요."
1203-14 = "……쳇. 알아서 한다니까……."
1203-18 = "안 돼요. 평범한 임무라면 몰라도, 지금은 메이드 접객이 중요한 일."
1203-19 = "거의 다 끝나가니 잠시만 그대로 있어주세요. 움직이면 다시 흐트러진답니다."
1203-20 = "그리고 선배. 음……. 이왕 말이 나온 김에……. 오늘만큼은 스카쟌도 벗어 보시는 게 어때요?"
1203-21 = "어이, 적당히 해. 스카쟌 이야기는 꺼내지도 마."
1203-22 = "한 번만 더 그 말하면 난 그냥 돌아갈 테니까."
1203-23 = "후훗. 알겠습니다. 그럼 그대로 입으시는 대신 머리만이라도 깔끔하게 정돈하죠. 괜찮죠?"
1203-24 = "……하아."
1203-25 = "뭐, 마음대로 해."
1203-26 = "후훗……."
1203-29 = "후훗. 다 끝났습니다. 역시 기대했던 대로 훌륭하네요."
1203-30 = "……훌륭하긴 뭐가……. 평소랑 똑같구만."
1203-31 = "아니. 확실히 평소보다 깔끔하게 정돈돼 있는데……."
1203-32 = "그렇군요. 평소랑 똑같다라……."
1203-33 = "어쩌면 정말로 그럴 지도 모르겠네요."
1203-34 = "아직 제 실력이 부족해서 선배가 가지고 계신 매력들을 모두 표현하지 못하고……."
1203-35 = "……아, 알았어! 알았으니까. 그만!"
1203-39 = "그나저나 콜사인 제로원……."
1203-40 = "아니, 아스나는? 이 녀석은 또 어딜 가서 안 보이는 거야?"
1203-51 = "나 왔어-! 어라? 벌써 준비 다 끝난 거야?"
1203-53 = "넌 또 어디 있다가 이제서야 나타난 거야?"
1203-54 = "어? 나?"
1203-55 = "밖에서 사람들 데려왔는데? 호객행위 하라며?"
1203-56 = "뭐? ……사람들?"
1203-57 = "선배. 호객행위라는 건 기본적으로 가게가 열고 나서 하는 건데……."
1203-62 = "어, 엄청난 인파……."
1203-64 = "믿기 힘들 정도로 많은 손님들이……. 선배는 또 무슨 수를 쓰신 걸까요?"
1203-65 = "……? 어? 아무 말 안 했는데?"
1203-66 = "그냥 메이드 카페 차린다고 하니까 따라오던데?"
1203-67 = "이해했다. 이게 그 세미나 회계가 말했던 바로 그 상황인가보군."
1203-68 = "카페들이 대부분 평범하지 않으니, 오히려 이런 평범한 메이드 카페로 사람이 몰리는 거로군요."
1203-69 = "이거 어느 정도 각오는 했지만……."
1203-70 = "그 이상으로 오늘 하루 엄청 바쁠 것 같은데요?"
1203-71 = "시간 없다. 어서 목표……"
1203-72 = "주인님들을 처리……접대하도록 하지."
1203-73 = "……카린 씨. 신나신 건 알겠지만 손님들 앞에서는 말이 꼬이지 않도록 부탁해요."
1203-75 = "이젠 아주 신났다는 걸 숨길 생각도 없네."
1203-76 = "다들 준비된 거야? 그럼 문 열어도 되겠지?"
1203-77 = "자, 잠깐. 진짜로 주인님 같은 단어를 쓰는 거냐? 아직 난 마음의 준비가……!!"
1203-79 = "오케이, 그럼 문 연다!"
1203-85 = "어서 오세요, 주인님들~!!"
1203-96 = "(일주일 후.)"
1203-101 = "말도 안 돼……."
1203-102 = "이……. 이게 뭐야? 이 매출 표……. 진짜 이게 일주일만에 벌어들인 금액이라고?"
1203-103 = "우리 학교 축제가 처음부터 이랬다면……. 그랬다면……."
1203-107 = "……아. 미안. 이럴 때가 아니지. 우선 감사 인사부터 하는 게 맞겠지?"
1203-108 = "고마워. 의뢰였다고는 해도, 상가 사람들과 세미나의 입장을 대신해 감사를 표할게."
1203-109 = "적자 문제가 아니라……. 이 정도면 최근 너희들 때문에 쓴 복구비용도 충당할 수 있을 거 같아."
1203-110 = "듣던 중 반가운 소리네요. 그래서 그렇게 표정이 밝으셨던 거군요."
1203-111 = "뭐, 뭐야, 나라고 늘 싫은 소리만 하고 다니지는 않는다고. 좋은 일에는 당연히 감사하다고 말하지."
1203-112 = "……단지……."
1203-113 = "……음? 단지?"
1203-114 = "……앙? 뭐야, 또 뭐 불만 있어?"
1203-115 = "그런 거 아니라니까!"
1203-116 = "단지……. 음……. 그……."
1203-117 = "……역시 너무 좀 아까운데. 어떻게 할 방법이 없을까……."
1203-118 = "……? 무슨 방법을 말하는 거지?"
1203-119 = "아니. 음……."
1203-127 = "저기……. 우리 C&C 부장님?"
1203-129 = "……!?"
1203-130 = "뭐, 뭐야. 갑자기 그런 호칭으로 징그럽게……."
1203-131 = "혹시……."
1203-132 = "이번 기회에, 이왕 이렇게 된 거 말이야……."
1203-139 = "……에이전트 그만두고 그냥 계속 메이드 카페로 활동할 계획 같은 건 없어?"
1203-144 = "……앙?"
1203-149 = "네?"
1203-150 = "뭐라고?"
1203-152 = "사실 회계인 내 입장에선 아무래도 그쪽이 좀 더 학교에 도움이 되는 것 같은데 말야."
1203-153 = "이왕 이렇게 된 거, 전자상가 말고 다른 상가에도……."
1203-154 = "아니, 아예 학교 축제 때에도……. 밀레니엄 전속 메이드로써……."
1203-158 = "어머나……."
1203-159 = "……오."
1203-161 = "그, 그렇지? 괜찮지? 그렇게 나쁜 이야기는 아닌 거 같은데……?"
1203-167 = "……후……."
1203-168 = "……후후……후후후……."
1203-169 = "……후후?"
1203-170 = "……훗."
1203-175 = "하겠냐고!!!"
1203-180 = "Maid&Made"
