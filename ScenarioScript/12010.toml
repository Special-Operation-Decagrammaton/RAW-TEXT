12010-45 = "……."
12010-46 = "조금 전의 섣부른 학생 운용은 제가 대신 사과드리겠습니다."
12010-47 = "뭐?! 난 명령서에 적힌대로 했는데?! 아코 쨩!"
12010-48 = "명령서에 무차별 포격부터 하라고 적혀있던가요?"
12010-49 = "화, 화력 지원 후 보병 투입이…… 전술의 기본……."
12010-50 = "다른 학원의 자치구 근처니까 주의를 기울이는 게 당연하잖아요……."
12010-51 = "(응……?)"
12010-52 = "실례했습니다. 대책위원회 여러분."
12010-53 = "게헨나 선도부는 우리 학원의 교칙위반자들을 체포하기 위해 왔습니다."
12010-54 = "불미스러운 일이 있었지만 아직까지는 불법의 영역은 아니기에…… 지금 상황의 시급성을 이해해 주셨으면 합니다."
12010-55 = "선도 집행에 모쪼록 협조 부탁드립니다. 여러분."
12010-56 = "조금 전에도 얘기했지만……. 그건 곤란해요!"
12010-57 = "어머……?"
12010-58 = "게헨나 정도의 큰 학원이 무력을 앞세워서 우리 같은 작은 학원에서 멋대로 전술 행동을 벌이다니!"
