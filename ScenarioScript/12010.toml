12010-25 = "선임행정관이라면…… 선도부의 2인자……."
12010-26 = "어머, 그런 거창한 입장은 아니에요. 어디까지나 선도부장님을 보좌하는 비서 역할이고……."
12010-27 = "그렇기만 하다면 저 선도부원이 저렇게까지 긴장하진 않았겠지."
12010-28 = "누, 누가 긴장했다고!"
12010-29 = "……"
12010-30 = "꽤 관찰력이 좋으시네요. 어디보자…… 스나오오카미 시로코 씨?"
12010-31 = "……."
12010-32 = "아비도스 지역구에 학생회만 남아있다고 들었는데 바로 여러분들인가 보네요."
12010-33 = "아비도스의 학생회는 5명으로 알고 있는데 한명은 어딜 간 거죠?"
12010-34 = "부장은 지금 없어요. 그리고 저희는 학생회가 아니라 대책위원회입니다. 선임행정관."
12010-35 = "오쿠소라 씨……였죠? 그럼 학생회 임원은 여기 없는 건가요? 저는 학생회와 얘기하고 싶습니다."
12010-36 = "아비도스 학생회는 해체된지 오래야! 실질적으로 우리가 학생회를 대리하고 있으니까, 하고 싶은 말이 있으면 우리한테 하라고!"
12010-37 = "이렇게 포위해서 총을 겨누고는 대화를 하자- 라는 태도도 용서할 수 없지만요."
12010-38 = "아아……."
12010-39 = "실례했습니다. 선도부, 전원 무기를 내리세요."
