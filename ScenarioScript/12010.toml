12010-173 = "(저벅- 저벅- 저벅- 저벅- 저벅- 저벅-)"
12010-174 = "……. 12시 방향…… 6시 방향…… 3시, 9시…… 선도부 병력이 사방에서 집결 중……."
12010-175 = "……."
