12010-237 = "아…… 아하하하하하하!"
12010-238 = "당연하지! 이 몸을 누구라고 생각하는 거야? 걱정하지 마!"
12010-239 = "신뢰에는 신뢰로 답한다! 그게 바로 우리 흥신소의 모토니까!"
