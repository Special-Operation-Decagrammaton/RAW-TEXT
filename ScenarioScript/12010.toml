12010-68 = "그쪽의 다른 분들도 같은 생각인가 보네요."
12010-69 = "하아. 이 병력을 앞에 두고도 위풍당당이라니……"
12010-70 = "이 자신감의 원천은…… 역시 믿고 있는 어른이 있다는 건가요? 그러니까…… [USERNAME] 선생님?"
