12010-79 = "우리를 노린 거였다면 아무도 없는 시간에 라멘집을 폭발시켰을 이유가 없어. 계획이 들키기만 할 뿐이고, 함정으로써는 최악이고."
12010-80 = "……그, 그러네. 생각해보면."
12010-81 = "함정을 준비했다가 실수로 터트렸다……? 얼마나 바보인거야, 저 녀석들……."
12010-82 = "하지만 결과적으로 라멘집을 공격한 건은 맞으니, 너희에게 그냥 넘겨줄 수는 없어."
12010-83 = "네. 저 분들의 배후도 아직 알아내지 못했고요. 저희가 먼저 볼일이 있다고요."
