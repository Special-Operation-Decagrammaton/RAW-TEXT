12010-143 = "……처음엔 어째서 선도부가 여기 나타났는지 이해할 수가 없었어. 선도부가 다른 자치구까지 쫓아온다? 우리를 노리고?"
12010-144 = "이런 비효율적인 운용은 선도부장의 스타일은 아니지. 그러니까 아코, 이건 너의 독단적 행동."
12010-145 = "……."
12010-146 = "게다가, 애초에 우리를 상대하기엔 너무 많은 병력을 데리고 왔어. 다른 학원과의 분쟁을 상정한 거지."
12010-147 = "하지만 이곳은 전교생이 5명 밖에 없는 곳이니…… 그렇다면 결론은 뻔하다."
