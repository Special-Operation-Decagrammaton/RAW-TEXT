12010-134 = "제, 제가 잘못해서……! 계획을 다 망쳐버렸어요! 주, 죽을까요? 죽겠습니다!!"
12010-135 = "응, 따지고 보면 전부 하루카 쨩이 잘못한 게 맞지만. 뭐, 재미있으니까 됐어."
