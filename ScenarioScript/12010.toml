12010-244 = "……."
12010-246 = "음……. 뭐, 이건 이거대로 상정 내의 상황이긴 한데……."
12010-247 = "그래도 의기투합, 너무 빠르지 않아요? 죽이 너무 잘 맞는데……."
12010-248 = "……. 자아. 그럼."
12010-249 = "선도부, 공격입니다. 대책위원회와 흥신소를 제압하고, 선생님의 신변을 확보하세요."
12010-250 = "선생님은 키보토스 외부인이기에, 다치지 않도록 취급에 조심해주시고요."
12010-251 = "잘도 나한테 샷건을 갈겼겠다…… 각오해!!"
12010-253 = "적, 포위섬멸기동을 시작합니다!"
12010-254 = "선생님! 저희와 흥신소 68의 지휘를 부탁드립니다!"
