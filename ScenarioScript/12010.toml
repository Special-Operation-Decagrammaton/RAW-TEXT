12010-181 = "……충원."
12010-182 = "더 있었어요……? 이, 이렇게 많은 숫자를……?"
12010-183 = "으응…… 역시 조금 심했나 싶긴 하지만…… 샬레를 상대하려면 이 정도는 필요하지 않을까 싶어서……."
12010-184 = "뭐, 준비는 부족한 것보단 과한 게 나으니까요☆"
12010-185 = "포위를 벗어난 줄 알았더니…… 포위망이 이중이었어……?"
12010-186 = "네, 카요코 씨의 말이 맞아요. ……아니, 절반쯤 맞다고 할까요? 저는 샬레와 충돌하는 최악의 상황을 염두에 두긴 했습니다."
12010-187 = "하지만 이런 상황을 일부러 의도한 건 아니에요. 그것만큼은 믿어주셨으면 하는데……. 뭐, 힘들 것 같지만."
12010-189 = "……. 티파티."
12010-190 = "게헨나 학원과 오랜 적대 관계에 있는 트리니티 학원의 학생회 이름이죠."
12010-191 = "정보부에서 티파티에 샬레에 대한 보고서가 올라갔다는 첩보를 입수했거든요."
12010-193 = "돌아가서 이 사실을 티파티에게 보고하겠어요!"
12010-195 = "저도 처음엔 샬레가 뭔지 전혀 몰랐는데…… 티파티가 알고 있는 정보는 저희도 알고 있어야만 해요."
12010-196 = "그래서 치나츠 씨가 쓴 보고서를 확인했죠."
12010-197 = "(……늦잖아요. 확인이.)"
12010-198 = "총학생회장이 남긴 정체불명의 조직……. 어른인 선생님이 담당으로 있는 초법적 동아리……."
12010-199 = "누가봐도 수상쩍은 냄새가 나잖아요?"
12010-200 = "샬레라는 조직이 가지고 있는 변수는 너무 위험해 보여요. 앞으로 있을 트리니티와의 조약에도 무슨 영향이 있을지 알 수 없고."
12010-201 = "최소한, 조약이 체결되기 전까진 저희 선도부가 선생님을 모셔두고 있겠습니다."
12010-202 = "겸사겸사 벼르고 있던 불량 학생들도 선도하고…… 말이죠."
12010-203 = "……."
12010-204 = "오히려 알기 쉬워서 좋네."
12010-205 = "……그래. 선생님을 납치한다고? 그런 걸 우리가 보고만 있을 거 같아?"
12010-206 = "……."
12010-208 = "……네. 역시 이런 전개겠죠. 오쿠소라 아야네 씨?"
12010-209 = "……?"
12010-210 = "게헨나의 선도부는 필요하면 이런 폭거를 감행하기도 합니다. 저희는 그런데 거리낌이 없거든요."
12010-211 = "……!!"
12010-213 = "……."
12010-214 = "사장. 도망친다면 지금이 유일한 기회야. 전투가 시작되면 돌이킬 수 없어."
12010-215 = "선도부는 아비도스와 우리를 동시에 포위섬멸할 생각이야. 아비도스가 저쪽의 시선을 끌어준다면 포위망이 얇은 곳을 돌파할 수는 있을 거 같아."
12010-216 = "훗."
12010-217 = "후후. 후후후후."
12010-218 = "……사장?"
12010-219 = "……카요코. 카요코. 이쯤되면 슬슬 이 몸의 성향을 알아차릴 때도 되었잖아?"
12010-220 = "……?"
12010-221 = "이런 상황에서, 이런 취급을 받아놓고, 뒤를 보이며, 도망친다?"
12010-222 = "그런 3류 악당같은 짓을 우리 흥신소가 할 리가 없잖아!!!"
12010-223 = "……."
12010-226 = "저 건방진 놈들에게 한방 먹여주지 않으면 잠이 오질 않는다고!"
12010-227 = "아루 님……."
12010-228 = "(바로 어제도 도망쳤잖아…….)"
12010-229 = "하아……. 그럼 저 병력과 싸우겠다고? 아비도스와 힘을 합쳐도 아슬아슬할 텐데……."
12010-230 = "게다가 저 녀석들이 우리와 협력해 줄 리도 없고…… 남은 방법은……."
12010-231 = "좋아, 흥신소!! 거기서 협공이야!! 건방진 녀석들을 쓸어버리자고!!"
12010-232 = "선생님을 위해 방패가 되어라."
12010-233 = "?!"
12010-234 = "선생님을 다같이 지키는 거예요! 아시겠죠?"
