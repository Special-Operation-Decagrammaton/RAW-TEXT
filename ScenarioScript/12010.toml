12010-73 = "[s3] \"흥신소는 바보들이지만 나쁜 녀석들은 아냐.\"\n[s4] \"아루는 바보지만 나쁜 녀석은 아냐.\"\n[s5] \"바보지만. 바보랄까.\""
12010-74 = "뭐?! 나쁜 녀석들은 맞잖아! 라멘집을 폭파시켰으니까!"
