[translation]
1303-1 = "회장 동지는 언제나 옳다 3"
1303-3 = "……늦어!"
1303-4 = "마리나 보안위원장은 어째서 오지 않는 거지? 사무국 주간 정례 회의가 시작된 지 벌써 10분이나 지났거늘!"
1303-6 = "체리노 회장님이 늦잠을 자신 탓에 이미 30분이나 지연되기는 했지만요."
1303-8 = "듣기 싫다! 이 몸이 늦는 것은 상관없어! 이 몸은 붉은겨울 학원의 위대한 학생회장이자 서기장인 체리노 님이니까!"
1303-9 = "하지만 일개 위원장이 이 체리노님을 기다리게 하다니, 이는 용납할 수 없는 일이야!"
1303-10 = "도착하기만 해봐라, 단단히 혼쭐을 내줄 테다!"
1303-15 = "오, 오래 기다리셨습니다, 체리노님!"
1303-16 = "늦었잖아!"
1303-17 = "감히 이 몸을 10분이나 기다리게 하다니. 숙청당하고 싶은 거냐?!"
1303-18 = "죄, 죄송합니다. 회장님. 보고 준비를 하는 데 시간이 생각 외로 오래 걸려서……"
1303-19 = "하지만 제가 기쁜 소식을 가지고 왔습니다."
1303-20 = "……기쁜 소식?"
1303-21 = "네. 지난번에 지시하셨던 대로 페로로를 설득하여 저희 붉은겨울 연방학원에 편입시키는 데 성공했습니다!"
1303-22 = "그게 정말인가?"
1303-23 = "후후, 그게 사실이라면 이제 키보토스 전역에서 전학생이 몰려들기를 기다리기만 하면 되겠군. 수고했네, 마리나 위원장!"
1303-24 = "회장님을 도울 수 있어 영광입니다."
1303-25 = "그래서 그 페로로는 지금 어디에 있지?"
1303-26 = "네. 바로 보고 드리겠습니다."
1303-28 = "노도…… 아니, 페로로 동지. 앞으로 나오도록!"
1303-32 = "페로페로……."
1303-41 = "페, 페로로!"
1303-43 = "뭐, 뭐냐! 이 커다랗고 못생긴 새는?!"
1303-44 = "네? 말씀하셨던 그 페로로입니다만."
1303-45 = "윽…… 다시 살펴보니 확실히 그렇긴 한데…… 이 새가 이렇게 못생기고 커다랬던가……?"
1303-46 = "키보토스 시내에서는 멀리서 지켜보느라 제대로 확인하지 못했는데, 가까이서 보니 생각보다 더 안 귀여워……."
1303-47 = "그, 그래도 페로로는 키보토스 전역에서 인기가 있는 캐릭터이니, 수염을 달아 사무국 앞에 세워 둔다면 큰 화제가 될 겁니다!"
1303-48 = "뭐라? 이 기분 나쁜 새에게 권위의 상징인 수염을 붙여줄 리가 없지 않으냐!"
1303-49 = "전에 토모에 비서실장이 비슷한 이야기를 한 것 같지만…… 여하튼 그 안건은 취소다!"
1303-52 = "게다가 이런 기분 나쁜 새를 사무국 건물을 오갈 때마다 봐야한다니, 참을 수가 없군!"
1303-53 = "마리나, 페로로를 책임지고 숙청해라! 이 기분 나쁜 새는 구교사 227호 특별반에라도 보내버려!"
1303-55 = "……구교사 227호 특별반이요, 페로?"
1303-56 = "어라? 지금 페로로가 말을 한 건가?"
1303-57 = "아무리 구교사가 춥고 황량한 유배지라지만, 저희에게는 소중한 공간인데…… 쓸모없는 물건을 버리는 쓰레기장 취급을 하시다니……."
1303-64 = "아무리 회장이라 하더라도 이건 너무하잖아요, 페로!"
1303-66 = "뭐, 뭐냐! 어째서 페로로의 안에서 특별반의 에로 꼬맹이가 나오는 거지? 이 페로로는 진짜 페로로가 아니었던 거냐?"
1303-67 = "애초에 현실에 페로로는 존재하지 않는다고요, 페로! 회장은 바보인가요, 페로?"
1303-68 = "우으으…… 이 몸을 속였겠다, 마리나!"
1303-69 = "죄, 죄송합니다. 회장님!"
1303-70 = "하지만 어떤 수를 쓰더라도 현실에 페로로를 데려올 수가 없어서……."
1303-71 = "듣기 싫다! 특별반의 정학생과 결탁하여 이 몸을 기만한 죄는 도저히 용서할 수 없어!"
1303-72 = "숙청이다, 숙청! 이 에로 꼬맹이와 보안위원장을 당장 구교사로 끌고 가!"
1303-74 = "흥, 어차피 정학당한 몸. 이 이상의 숙청은 무엇도 두렵지 않다고요, 페로!"
1303-75 = "이렇게 된 이상 혁명입니다, 페로!"
1303-76 = "마리나 위원장도 보고만 있지 말고 같이 혁명에 동참해주세요, 페로!"
1303-77 = "엣…… 그게, 그러니까…… 나는 체리노 회장을 따랐을 뿐인데……"
1303-79 = "그렇지만 숙청당할 바에는 차라리…… 좋아. 그 제안, 받아들이겠어! 혁명이다!!"
1303-81 = "뭐, 뭐야?! 보안위원장도 함께 쿠데타라고?"
1303-82 = "토, 토모에…… 도와줘……!"
1303-84 = "(이후, 일주일에 걸친 세 번의 혁명과 숙청 끝에 사무국은 다시 원상태로 돌아갔다.)"
1303-85 = "(……쓸모가 없어진 페로로 인형은 익명의 트리니티 학생이 고가에 구입해갔다고 한다.)"
1303-86 = "회장 동지는 언제나 옳다"
