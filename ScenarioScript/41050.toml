[translation]
41050-1 = "제5화;걷히지 않는 불신"
41050-2 = "발키리 경찰학교, 본관 로비"
41050-8 = "다들…… 무사하셨나요?"
41050-9 = "뭐야, 미야코도 여기 있었나."
41050-10 = "미야코 쨩……."
41050-12 = "이제야 겨우 다시 모였네. 취조는 이걸로 다 끝난 건가?"
41050-13 = "볼일이 다 끝났으면 빨리 내보내 주었으면 좋겠는데. 가지고 있던 사탕이 다 떨어진 참이었거든."
41050-14 = "한가한 소리 하지 마, 모에. 여유롭게 있을 상황이 아니거든?"
41050-15 = "우리를 이렇게 한 자리에 불러 모았다는 건…… 이제 우리의 처분이 결정되었다는 뜻이야."
41050-16 = "홧김에 저지르긴 했지만, 발키리의 학생들과 그렇게 요란한 총격전을 벌였으니…… 최소한 퇴학은 각오해야겠지."
41050-17 = "호들갑 떨기는. 어차피 SRT 학원은 사라졌잖아. 퇴학 처분을 당해 봤자 바뀌는 것도 없다고."
41050-19 = "하, 하지만 최소한의 처분이 퇴학이라면…… 그 이상의 벌을 받을 수도 있다는 뜻 아냐?"
41050-20 = "뭐, 그럴지도 모르지."
41050-21 = "수상한 설비가 가득한 지하 시설에 끌려가 노동을 강요당한다든지, 수상해 보이는 실험에 참여하게 된다든지……."
41050-22 = "??!!!"
41050-23 = "우으으…… 우린 다 끝났어……."
41050-29 = "죄송합니다. 제가 좀 더 열심히 노력했더라면……"
41050-30 = "소대원 여러분들이 이런 고초를 겪을 필요는 없었을 텐데……"
41050-31 = "……잠깐, 어째서 네가 사과하는 거야?"
41050-32 = "그러게. 설마 우리가 네 명령 때문에 하고 싶지도 않은 일을 했다고 생각하는 거야?"
41050-33 = "착각하지 마, 미야코. 학원 폐쇄 결정이 내려진 시점부터 넌 소대장도 뭣도 아니었거든?"
41050-34 = "괜히 책임감 가진 척 뻣뻣하게 굴지 마. 애초에 너한테는 기대조차 하지 않았으니까."
41050-35 = "저는…… 그게 그러니까……."
41050-36 = "[s] \"다들 안녕.\""
41050-37 = "어라. 당신은……"
41050-38 = "으엑, 샬레의 선생님?"
41050-39 = "히이…… 히이이익……!?"
41050-40 = "[s] \"……여전히 환영받지 못하는 것 같네.\""
41050-42 = "아직도 여기에 남아 계셨군요, 선생님."
41050-43 = "발키리 경찰학교에서 처리해야 하는 공무가 더 있으신 건가요?"
41050-44 = "……아니면 저희에게 볼일이 남아 있으신가요?"
41050-45 = "[s] \"응. 행정위원회의 결정 사항을 대신 전달하러 왔어.\""
41050-47 = "……히, 히익!"
41050-48 = "뜸 들이지 말고 말해줘. 무슨 처분을 내리더라도 우리에게는 큰 차이가 없으니까."
41050-49 = "(꿀꺽)……."
41050-53 = "[ns1] \"RABBIT 소대는 전원 석방.\"\n[ns2] \"너희는 자유야. 원하는 곳으로 가도 좋아.\""
41050-56 = "……네?"
41050-57 = "석방…… 이라고? 벌을 받는 게 아니라?"
41050-58 = "잠깐. 혹시 그럼 우리, SRT 학원으로 돌아갈 수 있는 거야?"
41050-59 = "[s] \"아니. 그건 어려울 것 같은데…….\""
41050-60 = "쳇, 좋다 말았네."
41050-64 = "……그렇군요. 공원에서의 진압 작전을 성공적으로 지휘한 공적으로 샬레가 저희의 처분을 대신 맡게 된 건가요."
41050-65 = "이해하기는 어렵지만, 상황은 알겠습니다."
41050-66 = "그래서, 선생님께서는 저희에게 무슨 일을 시키고 싶으신 건가요?"
41050-67 = "[s] \"너희들은 무얼 하고 싶은데?\""
41050-68 = "역으로 이쪽에 물어보아도……."
41050-69 = "SRT 학원에 돌아갈 수 없다면…… 어디나 불편한 건 마찬가지인데요……."
41050-70 = "나는 우선 숙소에 들어가서 쉬고 싶어. 계속된 취조 때문에 완전히 녹초가 되었다고~"
41050-71 = "[s] \"원한다면 당분간은 샬레의 숙소에서 쉬어도 괜찮아.\""
41050-72 = "……수상해."
41050-73 = "선생님의 숙소에 여학생들을 끌어들여서 무얼 하려고?"
41050-75 = "……신뢰하기 어렵군요."
41050-76 = "여, 역시 지난 번 작전 때의 앙심을 품고……"
41050-77 = "분명 엉큼한 짓을 하려는 거겠지."
41050-78 = "그러고 보니 샬레의 숙소에는 도청 장치가 잔뜩 설치되어 있다는 소문을 들은 적이 있어."
41050-79 = "저, 저희의 약점을 잡아 협박을 할 생각이신가요?!"
41050-80 = "이를 빌미로 소년 만화에서도 볼 수 없는 수치스러운 일을 강요한다든가……"
41050-81 = "[s3] \"선생님이 그런 일을 할 리가 없잖아?!\"\n[s4] \"너희들은 나를 어떻게 생각하고 있는 거야?!\""
41050-84 = "호의에는 감사드립니다만, 그 제안은 받아들일 수 없습니다."
41050-85 = "저희가 발키리 경찰학교로의 전학을 거부하고 농성을 하게 된 이유는 총학생회의 결정에 항의하기 위함이었는데, 샬레의 숙소를 빌려 편안한 생활을 누리게 된다면 그 의미가 퇴색됩니다."
41050-87 = "물론이지. 게다가 샬레에서는 특수 훈련도, 경계 근무도 할 수 없잖아?"
41050-88 = "하루 이틀이면 몰라도 느슨한 생활을 계속하면 SRT의 규율이 흐트러지게 된다고."
41050-89 = "거기에 당연히 샬레 내에서 위험한 물건은 쓸 수 없을 테고……."
41050-90 = "가, 갑작스럽게 낯선 어른을 믿는 건 조금……."
41050-91 = "[s] \"그럼 전의 그 공원에서 야영을 하는 건?\""
41050-93 = "전의 그 공원이라면, 저희가 농성을 했던 '코우사기 공원'을 말씀하시는 건가요?"
41050-94 = "그곳이라면 나는 상관없어. SRT의 야전 훈련장과 환경이 거의 비슷하니까."
41050-95 = "나도 괜찮아. 필요한 장비는 이미 저번에 그곳에 가져다 놓았고."
41050-96 = "나, 나도 문제없어……."
41050-98 = "그곳에서 야영을 한다면 지난번의 농성을 계속하는 셈이니, 저희에게도 명분상의 문제는 없습니다만……."
41050-99 = "선생님께서는 그런 처분으로 괜찮으신가요?"
41050-100 = "[s5] \"괜찮아.\"\n[s6] \"도와주지 않아도 괜찮겠어?\""
41050-101 = "괜찮습니다. 저희는 무력한 어린아이가 아니니까요."
41050-102 = "괜찮습니다. 저희는 무력한 어린아이가 아니니까요."
41050-103 = "……다시 한번 말씀드리지만, 저희는 선생님을 신뢰하지 않습니다."
41050-104 = "이런 호의를 베푸신다고 마음이 바뀌는 일 또한 없을 겁니다."
41050-105 = "[s7] \"괜찮아. 알고 있어.\"\n[s8] \"너희들이 즐겁다면 그걸로 충분해.\""
41050-110 = "……이상한 어른."
41050-111 = "그럼 나중에 뵙겠습니다."
41050-112 = "다음에 볼 때는 적이니까!"
41050-113 = "애초부터 적 아니었어……?"
41050-120 = "사, 사키 쨩! 모에 쨩! 기다려……!"
41050-122 = "다음화;식량 조달 작전"
