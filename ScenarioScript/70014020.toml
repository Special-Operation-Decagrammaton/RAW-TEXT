[translation]
70014020-1 = "เส้นทางอันสับสนของหมอยา 2"
70014020-2 = "..."
70014020-3 = "ทำไมฉันต้องทำแบบนั้นด้วยล่ะ?"
70014020-4 = "พูดอีกอย่างก็คือ การทำแบบนั้นจะให้ประโยชน์อะไรกับฉันงั้นเหรอ?"
70014020-5 = "ภายใต้สถานการณ์อย่างตอนนี้ ในไม่ช้าที่พักแห่งนี้ก็จะกลายเป็นของฉันอยู่แล้ว"
70014020-6 = "ต่อให้ฉันจงใจเปลี่ยนสถานการณ์นี้ ผลลัพธ์ก็ไม่เปลี่ยนอยู่ดี ซ้ำยังอาจทำให้เรื่องดำเนินไปในทิศทาง#nที่ไม่เป็นผลดีกับฉันเสียอีก"
70014020-7 = "[s1] \"แต่ลองทำก่อนก็ได้ไม่ใช่เหรอ มาสัญญากับครูก็ได้\"\n[s2] \"ครูจะให้สัญญากับไคหนึ่งข้อเป็นการแลกเปลี่ยน\""
70014020-10 = "หมายถึงคำมั่น...? เพื่อฉันงั้นเหรอ?"
70014020-11 = "ฉันเองก็รู้สึกแปลกอยู่เหมือนกันที่ต้องพูดแบบนี้..."
70014020-12 = "แต่ครูไม่เป็นไรแน่นะ? ยังมีสติอยู่หรือเปล่า?"
70014020-13 = "[s3] \"ครูจะให้สัญญาเพื่อนักเรียนทั้งทีนะ...\"\n[s4] \"ถามแบบนี้ น่าน้อยใจจริงๆ เลย!\""
70014020-16 = "งั้นเหรอ นักเรียน... สินะ"
70014020-17 = "ถึงตอนนี้ก็ยัง... เรียกแบบนั้นสินะ"
70014020-18 = "หึหึหึ... ดีละ ข้อเสนอนี้น่าสนใจไม่น้อย จะลองรับไว้ดูสักครั้งก็แล้วกัน"
70014020-19 = "แต่ระวังไว้หน่อยก็ดีนะ ครู น้ำหนักของคำว่า 'คำมั่น' น่ะ... มันมหาศาลกว่าที่คิดเอาไว้เสียอีกนะ"
70014020-20 = ""
70014020-22 = ""
70014020-25 = "(ไคหยิบวัตถุดิบยาหลายอย่างออกจากกระเป๋า แล้วนำมาผสมกันบ้าง ให้ความร้อนบ้าง...)"
70014020-26 = "(หลังผ่านขั้นตอนที่ดูยังไงก็ไม่เข้าใจ ไคก็สร้างบางสิ่งขึ้นมา)"
70014020-27 = "(และ...)"
70014020-29 = ""
70014020-30 = "นี่มัน... เกิดอะไรขึ้น? ร่างกายฉัน... ข้อต่อของฉัน...?!!"
70014020-31 = "ยังไม่ได้หายดีเสียทีเดียวหรอก แต่... อีกสักหนึ่งสัปดาห์ก็คงหายเป็นปกติ"
70014020-32 = "ใช่ว่าจะไม่มีโอกาสกลับมาเป็นซ้ำ แต่ถ้าถึงตอนนั้นก็ให้กินยานี่"
70014020-33 = ""
70014020-35 = ""
70014020-36 = "แต่ในฐานะ 'หมอยา' ฉันไม่แนะนำให้กินตอนที่ไม่มีอาการนะ"
70014020-37 = "ขอบใจนะ... ขอบใจ..."
70014020-38 = "แต่ว่า... ทั้งที่หายได้ง่ายๆ แบบนี้ ทำไมที่ผ่านมาถึงต้องทนเจ็บอยู่ตลอดเลยนะ...?"
70014020-39 = "..."
70014020-40 = ""
70014020-41 = "[ns5] \"อะ... อาจเป็นเพราะยาที่ไคสั่งให้มาตลอด!\"\n[ns6] \"พอใช้ร่วมกับยาที่ได้ใหม่วันนี้!\"\n[ns7] \"ก็เลยออกฤทธิ์รักษาขึ้นมา... หรือเปล่า?\""
70014020-45 = "อ๋อ... เป็นแบบนั้นเองสินะ ขอบใจนะ ไค ขอบใจจริงๆ..."
70014020-46 = "ก็... ใช่ ประมาณนั้นแหละ"
70014020-47 = "ฮุฮุ... ไม่ได้รู้สึกตัวเบาแบบนี้มานานแค่ไหนแล้วนะ ดูท่าจะลงบันไดได้สบายๆ แล้วละ"
70014020-48 = "ไม่ได้ออกไปไหนเสียนาน ออกไปเดินเล่นสักหน่อยดีกว่า..."
70014020-49 = ""
70014020-51 = ""
70014020-52 = ""
70014020-53 = "[ns] \"เก่งในเรื่องที่ตัวเองเชี่ยวชาญจริงๆ เลยนะ...\""
70014020-54 = "อะไรกัน มันเป็นเรื่องธรรมดาอยู่แล้ว อันที่จริง ถ้าหากว่าอาการไม่ดีขึ้น ฉันคงจะหัวเสียมากกว่า"
70014020-55 = "[s8] \"เพราะอาจหมายความว่าไคปรุงยาผิดพลาดสินะ...?\"\n[s9] \"เพราะอาจหมายความว่าไคเป็นฝ่ายที่ทำผิดพลาดใช่มั้ย...?\""
70014020-58 = "โอ้ ครูเข้าใจฉันได้ชัดเจนพอตัวเลยนี่"
70014020-59 = "ใช่ ฉันเกลียดความจริงที่ว่าตัวเองก็อาจผิดพลาดได้ ในฐานะที่เป็นทั้งแพทย์และหมอยา นั่นเป็นทัศนคติที่ฉันควรมีอยู่แล้ว"
70014020-60 = "เพราะแบบนั้น การที่อาการป่วยของยายแก่ได้รับการรักษาจึงไม่ได้ทำให้ฉันรู้สึกอะไรเป็นพิเศษ#nนั่นคือสิ่งที่ควรเกิดขึ้นอยู่แล้ว"
70014020-61 = "แต่ก็..."
70014020-62 = "..."
70014020-63 = "แบบนี้ก็... ไม่เลวเหมือนกัน"
70014020-64 = "เอาละ ครู"
70014020-65 = ""
70014020-67 = ""
70014020-69 = "ตอนนี้ฉันอยากคุยเรื่อง 'คำมั่น' นั่นแล้ว"
70014020-70 = "หืม? ไม่ต้องห่วงเรื่องนั้น แล้วให้รออีกหน่อยงั้นเหรอ?"
70014020-71 = "ครูอยากทำจุดประสงค์ที่เข้ามาถึงที่แบบนี้ในตลาดมืดให้เสร็จก่อนงั้นเหรอ?"
70014020-72 = ""
70014020-74 = ""
70014020-75 = "..."
70014020-76 = "เรื่องนั้นกระตุ้นความอยากรู้อยากเห็นของฉันขึ้นมาแล้วสิ ก็ครูไม่ใช่คนที่จะเข้ามาในที่แบบนี้นี่นะ"
70014020-77 = "กลับกัน ฉันชักอยากเป็นฝ่ายถามขึ้นมาแล้วสิ ว่าครูอุตส่าห์มาถึงที่นี่ทำไมกัน?"
70014020-78 = ""
70014020-81 = "[ns] \"ครูมาดูด้วยตาตัวเองว่าจริงๆ แล้วตลาดมืดเป็นสถานที่แบบไหน\""
