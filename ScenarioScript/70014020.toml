[translation]
70014020-1 = "The Apothecary Wanderings 2"
70014020-2 = "..."
70014020-3 = "Why should I?"
70014020-4 = "In other words, how would that benefit me?"
70014020-5 = "As things stand now, this place will soon be mine."
70014020-6 = "In fact, there's a chance that curing her would ruin things for me."
70014020-7 = "[s1] \"Still, why not just give it a try?\"\n[s2] \"In exchange, I'll make you a promise, Kai.\""
70014020-10 = "A promise...? To me?"
70014020-11 = "...I'm not one to talk, but..."
70014020-12 = "Sensei, are you sure you're well? Are you in your right mind?"
70014020-13 = "[s3] \"All this for a teacher wanting to make a promise to a student...\"\n[s4] \"I'm so hurt!\""
70014020-16 = "I see. A \"student,\" you say?"
70014020-17 = "Still... You mean..."
70014020-18 = "...Keh heh heh. Very well. That's quite an interesting proposal. I think I'll accept."
70014020-19 = "But you'd better be careful, Sensei. The weight of a promise...is far greater than you might think."
70014020-20 = ""
70014020-22 = ""
70014020-25 = "Kai removed a few ingredients from her bag, mixed them, and carefully applied heat..."
70014020-26 = "Ultimately, at the end of an arduous process, she ended up creating something."
70014020-27 = "And..."
70014020-29 = ""
70014020-30 = "What...just happened? My body, my joints...?!"
70014020-31 = "You're not fully recovered yet. Well... You may be in a week."
70014020-32 = "There's always a chance of relapse. If the pain returns, make sure to take this."
70014020-33 = ""
70014020-35 = ""
70014020-36 = "However, as an apothecary, I strongly recommend taking it ONLY if you have symptoms."
70014020-37 = "Thank you... Thank you ever so much..."
70014020-38 = "But... If it could be cured this easily, why have I been sick for so long...?"
70014020-39 = "..."
70014020-40 = ""
70014020-41 = "[ns5] \"W-Well, that's probably because Kai's old medication...!\"\n[ns6] \"Combined with today's medication...!\"\n[ns7] \"Made the full treatment take effect...!\""
70014020-45 = "I see... That's how it is, is it? Thank you, Kai. Thank you so much..."
70014020-46 = "Well, yes. That's how it is."
70014020-47 = "Haha... It's been ages since I've felt this light on my feet. I believe I can walk down the stairs without any trouble."
70014020-48 = "I think I should celebrate! Maybe go out for a drink! It's been so long..."
70014020-49 = ""
70014020-51 = ""
70014020-52 = ""
70014020-53 = "[ns] \"You really are skilled...\""
70014020-54 = "Of course. That goes without saying. In fact, if her symptoms hadn't improved, I probably would have been upset."
70014020-55 = "[s8] \"Not because the old woman wouldn't get better...\"\n[s9] \"But because that would mean you made a mistake...?\""
70014020-58 = "Oh. You believe you have a pretty good grasp of who I am, don't you, Sensei?"
70014020-59 = "You're right, in this case. I detest the idea that I could be wrong. As a doctor and an apothecary, that's only natural for me."
70014020-60 = "That is why curing this elderly woman's illness failed to stir any emotion in me. After all, it was something that was bound to happen."
70014020-61 = "Well, that said..."
70014020-62 = "..."
70014020-63 = "All things considered, this isn't too bad."
70014020-64 = "Then, Sensei."
70014020-65 = ""
70014020-67 = ""
70014020-69 = "I'm starting to feel like I want to talk about your \"promise.\""
70014020-70 = "Hmm? \"Don't worry about it, and just wait a little while\"?"
70014020-71 = "You need to finish your business in the Black Market first?"
70014020-72 = ""
70014020-74 = ""
70014020-75 = "..."
70014020-76 = "That certainly piques my curiosity. You're not the type to wander around a place like this, Sensei."
70014020-77 = "So please, indulge my question. Sensei, why did you come all the way here?"
70014020-78 = ""
70014020-81 = "[ns] \"I came to see for myself what kind of place the Black Market is.\""
