[translation]
70014020-1 = "#title;약사의 방황길 2"
70014020-2 = "3;카이;99;…….\n#3;a\n#3;em;[…]"
70014020-3 = "3;카이;05;왜 내가 그렇게 해야 하지?"
70014020-4 = "3;카이;02;바꾸어 말해, 그것이 나에게 어떤 이득을 가져다주지?"
70014020-5 = "3;카이;99;이미 현재대로의 상황에서도, 이 거처는 머지않아 내 것이 된다."
70014020-6 = "3;카이;07;구태여 내가 이 상황을 변화시켜도, 결과는 변하지 않는다. 오히려 나에게 안 좋은 방향으로 흐를 가능성도 생겨나지."
70014020-7 = "[s1] \"그래도 일단 해 보면 어떨까?\"\n[s2] \"그대신 내가 카이를 위해, 약속 한 가지를 해 줄게.\""
70014020-10 = "3;카이;02;약조……? 나를 위해?\n#3;em;[?]"
70014020-11 = "3;카이;99;……내가 이런 말을 하는 것도 어딘가 이상하다는 생각이 들지만."
70014020-12 = "3;카이;07;선생, 괜찮은가? 제정신인가?"
70014020-13 = "[s3] \"선생님이 학생을 위해 약속해 준다는데…….\"\n[s4] \"서운하네, 그것 참!\""
70014020-16 = "3;카이;99;그렇군. 학생, 인가.\n#3;em;[…]"
70014020-17 = "3;카이;03;아직도…… 말이로군."
70014020-18 = "3;카이;07;……쿡쿡쿡. 좋다. 이건 제법 흥미로운 제안이군. 한번 받아 보도록 할까.\n#3;em;[재잘]"
70014020-19 = "3;카이;08;하지만 주의하는 편이 좋을 것이다, 선생. 약조라는 말이 갖는 무게는…… 생각보다 엄청난 것이니 말이야."
70014020-20 = "#st;[0,0];instant;1;"
70014020-22 = "3;카이;08\n#3;d\n#wait;1000"
70014020-25 = "#na;(카이는 가방에서 몇 가지 약재를 꺼내, 혼합하거나 열을 가하거나…….)"
70014020-26 = "#na;(아무튼 잘 알 수 없는 과정을 거치더니, 무언가를 만들어냈다.)"
70014020-27 = "#na;(그리고…….)"
70014020-29 = "3;아픈 노인 참새정;00"
70014020-30 = "3;아픈 노인 참새정;00;어떻게…… 된 거지? 몸이, 관절이……?!\n#3;a\n#3;shake\n#3;em;[?!]"
70014020-31 = "2;카이;01;아직 다 나은 것은 아니다. 뭐…… 일주일 정도 지나면 온전해지겠지만.\n#2;a\n#3;m4"
70014020-32 = "2;카이;02;재발할 가능성이 없는 것은 아니겠으나, 그때는 이걸 복용하도록 해."
70014020-33 = "#st;[0,0];instant;1;"
70014020-35 = "2;카이;01\n3;아픈 노인 참새정;00\n#2;greeting\n#2;h\n#3;h\n#wait;1000"
70014020-36 = "2;카이;05;하지만 증상이 없는데 복용하는 것은, '약사'로서는 추천하지 않는다."
70014020-37 = "3;아픈 노인 참새정;00;고맙구나……. 고마워……."
70014020-38 = "3;아픈 노인 참새정;00;그런데…… 이렇게 간단히 나아질 수 있었는데, 왜 지금까지는 계속 아프기만 했을까……?\n#3;em;[?]"
70014020-39 = "2;카이;06;……."
70014020-40 = "2;카이;06\n3;아픈 노인 참새정;00\n#2;h\n#3;h"
70014020-41 = "[ns5] \"그, 그건 아마도, 카이가 지금까지 처방해 온 약이!\"\n[ns6] \"오늘 새롭게 처방한 약과 더불어서!\"\n[ns7] \"드디어 치료 효과를 발휘한 것이 아닐까요……?\""
70014020-45 = "3;아픈 노인 참새정;00;과연……. 그런 것이구나. 고맙다, 카이야. 정말로 고마워…….\n#3;em;[재잘]"
70014020-46 = "2;카이;99;뭐, 그래. 그런 식이었다."
70014020-47 = "3;아픈 노인 참새정;00;허허……. 이렇게 몸이 가뿐한 게 얼마 만인지. 계단도 무리 없이 내려갈 수 있을 것 같구나."
70014020-48 = "3;아픈 노인 참새정;00;오랜만에 마실이라도 다녀와야겠어…….\n#3;em;[음표]"
70014020-49 = "#st;[0,0];instant;1;"
70014020-51 = "2;카이;99\n3;아픈 노인 참새정\n#3;d\n#2;h\n#3;h\n#wait;1500"
70014020-52 = "2;카이;99\n#2;m3\n#wait;1000"
70014020-53 = "[ns] \"정말로 자기 분야에서는 대단하네…….\""
70014020-54 = "2;카이;02;무얼. 당연한 것이다. 오히려 증상이 나아지지 않았으면, 나는 아마도 화가 났겠지."
70014020-55 = "[s8] \"저 노인 분이 낫지 않아서가 아니라.\"\n[s9] \"카이가 틀린 것이 될 수 있었으니까……?\""
70014020-58 = "2;카이;08;호오. 제법 정확하게 나를 파악하고 있지 않은가, 선생.\n#2;em;[음표]"
70014020-59 = "2;카이;07;그렇다. 나는 내가 틀릴 수 있다는 사실을 혐오한다. 의사이자 약사로서, 그건 내게 있어 당연한 태도다."
70014020-60 = "2;카이;00;그렇기에 노인의 병증이 치료된 것은, 나에게는 어떤 감흥도 불러일으키지 않는다. 그건, 당연히 일어났어야 하는 일이니까."
70014020-61 = "2;카이;99;뭐, 그렇지만……."
70014020-62 = "2;카이;99;…….\n#2;em;[…]"
70014020-63 = "2;카이;06;이건 이것대로, 나름 나쁘지 않군."
70014020-64 = "2;카이;01;그러면, 선생."
70014020-65 = "#st;[0,0];instant;1;"
70014020-67 = "2;카이;01\n#2;d\n#2;h\n#wait;1000"
70014020-69 = "3;카이;03;이제 슬슬, 그 '약조'라는 것에 관해 이야기하고 싶은데 말이지?\n#3;a\n#3;closeup"
70014020-70 = "3;카이;02;음? 그 부분은 걱정하지 말고, 조금만 기다려 달라고?\n#3;em;[?]\n#3;closeup"
70014020-71 = "3;카이;01;선생이 블랙마켓의 이런 곳까지 들어온 목적을, 조금 먼저 달성하고 싶다?\n#3;closeup"
70014020-72 = "#st;[0,0];instant;1;"
70014020-74 = "3;카이;01\n#3;d\n#3;closeup\n#3;h\n#wait;1000"
70014020-75 = "3;카이;99;…….\n#3;a\n#3;h"
70014020-76 = "3;카이;00;그 부분은 나의 호기심을 자극하는군. 확실히, 선생은 이런 곳을 찾아올 몸이 아니기는 하다."
70014020-77 = "3;카이;07;오히려 내가 묻고 싶어졌다. 선생은, 어째서 여기까지 온 것이지?"
70014020-78 = "#st;[0,0];instant;1;"
70014020-81 = "[ns] \"블랙마켓이 정말은 어떤 곳인지, 직접 보러 왔어.\""
