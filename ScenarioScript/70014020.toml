[translation]
70014020-1 = "藥師的徬徨（２）"
70014020-2 = "……"
70014020-3 = "我為何非得那麼做？"
70014020-4 = "換句話說，那能為我帶來什麼好處？"
70014020-5 = "就算維持現狀，這個住處也遲早會變成我的東西。"
70014020-6 = "即使我刻意改變現狀，結果也不會變。#n反而還可能往對我不利的方向發展。"
70014020-7 = "[s1] 「總之先試試看怎麼樣？」\n[s2] 「作為交換，我會為誡許下一個約定。」"
70014020-10 = "為我……許下約定？"
70014020-11 = "雖然這種話由我來說，總覺得有點奇怪……"
70014020-12 = "老師你還好嗎？是不是神智不清了？"
70014020-13 = "[s3] 「老師都願意為學生許下約定了……」\n[s4] 「你的反應也太讓人難過了吧！」"
70014020-16 = "這樣啊。學生……是嗎。"
70014020-17 = "直到現在……你都還這麼想啊。"
70014020-18 = "……咯咯咯，好吧。#n這倒是個相當有趣的提議，我就接受看看吧。"
70014020-19 = "不過你最好小心一點，老師。#n約定這個詞的分量……可是比想像中沉重許多。"
70014020-20 = ""
70014020-22 = ""
70014020-25 = "（誡從包裡取出幾樣藥材，時而混合、時而加熱……）"
70014020-26 = "（總之經過一連串看不太懂的過程後，做出了某樣東西）"
70014020-27 = "（接著……）"
70014020-29 = ""
70014020-30 = "這是……怎麼回事？#n身體和關節都……！？"
70014020-31 = "還沒有完全康復。不過……大概再過一週就會痊癒了。"
70014020-32 = "不能說沒有復發的可能，到時候就服下這個吧。"
70014020-33 = ""
70014020-35 = ""
70014020-36 = "不過沒有出現症狀卻服藥，作為「藥師」我並不推薦。"
70014020-37 = "謝謝你……謝謝……"
70014020-38 = "不過……明明這麼輕易就能治好，為什麼我之前一直病懨懨的呢……？"
70014020-39 = "……"
70014020-40 = ""
70014020-41 = "[ns5] 「那，那大概是因為誡至今為止開的藥！」\n[ns6] 「與今天新開的藥相輔相成！」\n[ns7] 「終於發揮出治療效果了吧……？」"
70014020-45 = "原來如此……是這麼回事啊。#n謝謝你，誡。真的謝謝你……"
70014020-46 = "嗯，是啊。就是那麼回事。"
70014020-47 = "呵呵……上次身體這麼輕鬆，都不知道是多久以前的事了。#n感覺連樓梯都能輕鬆走下去了呢。"
70014020-48 = "久違地出去串串門子吧……"
70014020-49 = ""
70014020-51 = ""
70014020-52 = ""
70014020-53 = "[ns] 「在自己的專業領域果然很厲害呢……」"
70014020-54 = "沒什麼，這是理所當然的。#n要是症狀沒有好轉的話，我大概會很生氣吧。"
70014020-55 = "[s8] 「不是因為沒有治好那位老人家……」\n[s9] 「而是因為那代表誡錯了……？」"
70014020-58 = "哦？你倒是把我摸得挺透徹的嘛，老師。"
70014020-59 = "沒錯。我厭惡自己可能出錯這件事。#n身為醫生兼藥師，這對我來說是理所當然的態度。"
70014020-60 = "所以那位老人的病治好了，並不會讓我有任何感觸──因為那是本就應該發生的事。"
70014020-61 = "不過話雖如此……"
70014020-62 = "……"
70014020-63 = "這樣倒也不錯，算是別有一番滋味吧。"
70014020-64 = "那麼，老師。"
70014020-65 = ""
70014020-67 = ""
70014020-69 = "差不多該來談談你所謂的「約定」了吧？"
70014020-70 = "嗯？你說那個部分不必擔心，要我再稍等一下？"
70014020-71 = "老師想先達成闖進黑市這種地方的目的？"
70014020-72 = ""
70014020-74 = ""
70014020-75 = "……"
70014020-76 = "這點倒是勾起了我的好奇心。#n老師確實不是會跑來這種地方的人。"
70014020-77 = "我反而想問你。老師，你為什麼會來到這裡？"
70014020-78 = ""
70014020-81 = "[ns] 「我是來親眼看看，黑市實際上是什麼樣的地方的。」"
