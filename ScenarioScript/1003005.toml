[translation]
1003005-1 = "답례품"
1003005-2 = "온천장 내 기념품점"
1003005-3 = "오셨군요, 선생님. 기다리고 있었습니다."
1003005-4 = "바쁘신 중에 시간을 내주셔서 감사합니다."
1003005-5 = "혹시 휴식 중에 제가 폐를 끼친 건 아닐지요."
1003005-6 = "[s1] \"그렇지 않아.\"\n[s2] \"마침 한가하던 참이었어.\""
1003005-7 = "그렇다면 다행입니다."
1003005-8 = "그렇다면 다행입니다."
1003005-9 = "오늘 선생님을 이곳에 모신 이유는…… 답례품을 고르는 일 때문이었습니다."
1003005-10 = "[s] \"답례품?\""
1003005-11 = "네. 반쯤 무리하게 떠안은 휴일이라고는 하지만, 휴가는 휴가."
1003005-12 = "다른 부원들이 열심히 일하고 있을 때 홀로 오프를 낸 것이니, 부원들을 위한 답례품 정도는 사서 돌아가는 것이 예의겠지요."
1003005-13 = "다만 저는 이렇게 홀로 휴가를 떠난 경험이 거의 없는지라, 어떤 종류의 답례품을 사가야 좋을지 좀처럼 감이 잡히질 않아서……."
1003005-14 = "경험이 많은 어른이신 선생님께 조언을 구하고자 합니다."
1003005-15 = "[s3] \"여학생이 좋아할 만한 답례품이라니.\"\n[s4] \"나도 잘 모르겠는걸…….\""
1003005-16 = "그런가요? 선생님께서는 학생들로부터 인기가 많으신 분이니, 분명 학생들이 좋아하는 물건에 대해서도 잘 아시리라 생각했었습니다만…… 조금 의외군요."
1003005-17 = "그런가요? 선생님께서는 학생들로부터 인기가 많으신 분이니, 분명 학생들이 좋아하는 물건에 대해서도 잘 아시리라 생각했었습니다만…… 조금 의외군요."
1003005-18 = "[s] \"선도부원들은 보통 어떤 물건을 좋아해?\""
1003005-19 = "'보통' 좋아하는 물건이라고 해도……."
1003005-20 = "게헨나의 학생들은 워낙 다들 개성이 강하다 보니, 모두가 공통으로 좋아할 만한 물건을 꼽기가 쉽질 않네요."
1003005-21 = "으음……."
1003005-25 = "우선은 진열된 물건을 하나씩 살펴보며 골라보도록 할까요?"
1003005-27 = "온천 기념품이라는 건 정말 다양하군요. 그 수에 조금 놀랐습니다."
1003005-28 = "과자 하나만 두고 보더라도 맛과 모양에 따라 종류가 수십 가지로 나뉘니……."
1003005-29 = "생각보다 더 결정이 쉽지 않겠어요."
1003005-30 = "[s] \"이 페로로 만쥬는 어때?\""
1003005-31 = "이 독특한 모양의 새는 정말 어디에나 있군요. 이 캐릭터의 어디가 매력적인 건지……."
1003005-32 = "저는 나쁘지 않습니다만, 게헨나 선도부에는 이 캐릭터를 싫어하는 부원들도 제법 있으니 페로로 만쥬는 곤란할 것 같네요."
1003005-33 = "다른 디자인의 물건을 찾아보는 게 좋겠습니다."
1003005-34 = "[s] \"이 특제 입욕제는 어떨까?\""
1003005-35 = "<게헨나 특제 지옥 입욕제. 습기에 닿는 순간 폭발하며 주변의 환경을 지옥처럼 만들어 드립니다. 찬물에 넣어도 OK.>"
1003005-36 = "……흥미롭긴 하지만 부원들의 손에 들어가면 어쩐지 나쁜 일에 악용될 것 같아서 조금 우려가 되네요."
1003005-37 = "조금 더 얌전한 기념품을 찾아보는 게 좋겠습니다."
1003005-41 = "[ns] \"온천 마크가 그려진 이 리본은?\""
1003005-42 = "이건…… 제법 귀여운 선물이군요."
1003005-43 = "온천의 정취도 느껴지고, 취향도 타지 않으니 선물로는 나쁘지 않을 것 같습니다."
1003005-44 = "……다만 가격이 너무 비싸서 제 소지금으로 모두의 것을 사는 건 어려울 것 같네요."
1003005-45 = "아쉽지만 다른 답례품을 찾아야겠습니다."
1003005-46 = "선생님, 다음 물건을 보러 가시지요."
1003005-48 = "(이후, 기념품점에 진열된 물건을 감상하며 한동안 물건을 골랐다.)"
1003005-51 = "……결국 마지막에 선택한 건 평범한 녹차 양갱이네요."
1003005-52 = "단맛이 강하지 않아 누구나 무난하게 좋아할 수 있다지만, 이런 평범한 선물로 정말 괜찮은 걸까요?"
1003005-53 = "[s5] \"답례품은 내용물보다 성의가 중요하니까.\"\n[s6] \"평범해서 오히려 더 좋아!\""
1003005-54 = "……후후, 그런가요."
1003005-55 = "……후후, 그런가요."
1003005-56 = "선생님께서 그렇게 말씀해 주시니 안심이 되네요."
1003005-57 = "오늘은 감사했습니다. 덕분에 좋은 선물을 고를 수 있었습니다."
1003005-58 = "그나저나 선생님께서도 아까 무언가를 구매하시던 것 같았는데……"
1003005-59 = "선생님께서도 따로 답례품을 드릴 곳이 있으신 건가요?"
1003005-65 = "[ns] \"치나츠를 위한 답례품이야.\""
1003005-66 = "……네? 저를 위한 답례품이요?!"
1003005-68 = "이건 제가 아까 눈여겨보았던 그 리본……."
1003005-69 = "하지만 저는 선생님께 아무런 도움도 드리지 못했는데, 어째서 답례품을……."
1003005-70 = "[s7] \"평소에 건강을 챙겨준 것에 대한 답례야.\"\n[s8] \"함께 보낸 즐거운 시간에 대한 답례야.\""
1003005-75 = "……정말 선생님은 신기한 분이시네요."
1003005-76 = "말씀드리지 않아도 언제나 제 마음을 꿰뚫어 보듯 먼저 다가와 주시니……"
1003005-77 = "다시 한번 감사드립니다, 선생님."
1003005-78 = "이 리본…… 계속 소중하게 간직하겠습니다."
