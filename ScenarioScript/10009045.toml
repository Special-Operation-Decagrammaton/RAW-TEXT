[translation]
10009045-2 = "휴우,"
10009045-3 = "고마워. 선생. 이번에도 덕분에 와카모를 잡을 수 있었어."
10009045-4 = "[s] \"……저기, 이번엔 또 어떻게 탈옥한 거야?\""
10009045-5 = "아, 그게 말이지……."
10009045-6 = "으음, 그게……."
10009045-8 = "……어떻게 탈옥한 거지?"
10009045-9 = "[s] \"이젠 방법조차 모른다는 거냐!\""
10009045-10 = "아니, 이쪽도 워낙 정신이 없던 터라. 아하핫."
10009045-11 = "죄, 죄송합니다! 선생님! 하지만 정말 다음번에는 이런 일이 일어나지 않도록 노력을……!"
10009045-12 = "맞아, 응. 다음에, 정말 다음엔 괜찮을 테니까!"
10009045-13 = "근거는 있습니까?"
10009045-14 = "네?! 그, 근거요?"
10009045-15 = "근거……. 으음……."
10009045-16 = "아니, 너무 매정하게 그런 말 하지 말고!"
10009045-17 = "이런 일에는 응당 신뢰가 필요한 거 아니겠어?"
10009045-18 = "그렇군요. 맞는 말씀입니다."
10009045-19 = "[s] \"납득해 주는 거구나.\""
10009045-20 = "아핫. 서로 고생하는 처지에, 응. 이런 일도 있는 거지!"
10009045-21 = "그럼, 우린 정말 정말! 이만 가볼게!"
10009045-22 = "수, 순찰 협조. 잘 부탁드립니다!"
10009045-28 = "자, 그럼 선생님. 다음으로 가시지요."
10009045-29 = "[s] \"으, 으응.\""
