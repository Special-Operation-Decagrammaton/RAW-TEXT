[translation]
90100030-1 = "第3話;小隊要吃飽才能進擊"
90100030-2 = "D.U.外圍的預約制高級燒肉店"
90100030-5 = ""
90100030-6 = "[ns1] 「……就從橫膈膜開始吃起吧。」\n[ns2] 「麻煩給我一杯冰烏龍茶。」"
90100030-9 = "好的，感謝您的點餐！"
90100030-10 = ""
90100030-12 = ""
90100030-13 = "那個……"
90100030-14 = "嗯……"
90100030-15 = "我不知道該說什麼才好……"
90100030-16 = ""
90100030-17 = "[ns3] 「啊，還要點牛舌才行。」\n[ns4] 「請再給我一份醋拌豆芽菜。」"
90100030-20 = "好的～"
90100030-21 = ""
90100030-23 = ""
90100030-24 = "……[USERNAME]老師。"
90100030-25 = "在繼續點餐之前，我想請教您一件事。"
90100030-26 = "[s5] 「啊，難道你想吃別的部位嗎？」\n[s6] 「想吃什麼儘管點沒關係。」"
90100030-29 = "不。我指的並不是肉的事情。"
90100030-30 = "我們明明是為了作戰的事前會議才來見老師的……"
90100030-32 = "為什麼要在這種高級燒肉店進行事前會議……？"
90100030-33 = "[s7] 「總之先吃肉再聊吧。」\n[s8] 「……橫膈膜烤好了。來。」"
90100030-36 = "啊，謝謝老師……"
90100030-37 = "既然都收下了，我還是會吃啦……"
90100030-38 = ""
90100030-39 = ""
90100030-40 = ""
90100030-41 = "……哇，這個肉。"
90100030-42 = "柔嫩程度就像在舌尖上融化一樣，每次咀嚼又會滲出滿滿濃郁的肉汁……#n嘴裡一瞬間就被肉的滋味給填滿了！"
90100030-43 = "唔嗯～雖然我一直都不覺得供應給SRT的肉品質不好……#n但是這麼高級的肉，可能是我這輩子第一次吃到呢。"
90100030-44 = "[s] 「下一道是牛舌哦。」"
90100030-45 = "哎呀。牛舌特有的香氣跟酸甜的醬汁簡直是絕配呢。"
90100030-46 = "口感這麼好的話，或許切碎之後加進豆皮壽司也不錯……？"
90100030-47 = "我第一次知道牛舌是這麼好吃的部位呢。#n與醬汁交融的深邃鮮味堪稱一絕啊。"
90100030-48 = ""
90100030-50 = ""
90100030-51 = "話說既然這是牛的舌頭，那吃牛舌實際上不就等於是在跟牛舌吻──"
90100030-52 = "別說那種讓人倒胃口的話啦！"
90100030-53 = ""
90100030-55 = ""
90100030-56 = ""
90100030-57 = "[ns9] 「雪乃好像興趣缺缺呢。」\n[ns10] 「難道你比較喜歡內臟嗎？」"
90100030-60 = "不，我並沒有特別喜歡吃內臟。"
90100030-61 = "所以再跟您重複一次，我並不是在說肉的事情。"
90100030-62 = ""
90100030-64 = ""
90100030-65 = "我們本來想自己決定這次作戰的目標，好讓老師不必為後援業務以外的事費心……"
90100030-66 = "不過根據聯邦學生會長的說法，老師您似乎希望能夠親自指揮作戰。"
90100030-67 = "[s11] 「既然把名義借了出去，就應該負起相應的責任。」\n[s12] 「可能會讓你覺得麻煩，不過這種程度的干涉就麻煩你體諒一下吧。」"
90100030-70 = "干涉是嗎……"
90100030-71 = "雖然您這麼說，不過這場作戰是我們為了贖罪而進行的苦行……#n這點老師您應該也很清楚才對。"
90100030-72 = "因此老師您所謂的「干涉」，無異於是在代替我們償還一部分的罪孽。"
90100030-73 = ""
90100030-75 = ""
90100030-76 = "……老師。"
90100030-77 = "您為什麼要幫助我們呢？"
90100030-78 = "不，假如只是單純幫助也就罷了，可是您卻給予了如此過度的善意……"
90100030-79 = "……坦白說比起疑惑，我甚至感受到了害怕。"
90100030-80 = "[s] 「不必在意。這純粹只是吃頓飯而已。」"
90100030-81 = ""
90100030-85 = "[ns] 「啊，難道你是擔心肉裡有可能被下毒嗎？」"
90100030-86 = "……毒？那是什麼意思──"
90100030-87 = ""
90100030-89 = ""
90100030-90 = "咳，咳！"
90100030-91 = "胡桃，就跟你說慢慢吃嘛。"
90100030-92 = "到底是吃得多急才會在吃肉的時候被嗆到啊？"
90100030-93 = "才，才不是咧……！"
90100030-94 = "啊哈哈……這麼說來，以前確實有過類似的對話呢。"
90100030-95 = "……我不太懂你們的意思。"
90100030-97 = "不好意思。這邊幫您換個烤網哦。"
90100030-98 = "[s] 「啊，麻煩再給我們3人份的牛小排。」"
90100030-99 = "好的，感謝您的點餐。"
90100030-100 = ""
90100030-102 = ""
90100030-104 = ""
90100030-105 = "……我所謂的害怕，指的並不是現實層面的恐懼。"
90100030-106 = "我們已經接受了老師過多的善意。"
90100030-107 = "為了不讓我們犯下更大的錯誤──#n老師將我們從深淵底部拉了上來，還保住了後輩們和我們的性命。"
90100030-108 = "明明光是這樣就等於背負了一輩子也償還不清的沉重恩情，#n您卻依然一而再再而三地像我們釋出善意與幫助……"
90100030-109 = "老師究竟對我們抱持著什麼樣的期望……我至今依然無法理解。"
90100030-110 = "[s] 「真是個令人懷念的問題呢……」"
90100030-111 = ""
90100030-114 = "[ns14] 「我並不是有所期待才這麼做的。」\n[ns15] 「畢竟我是老師嘛。」"
90100030-117 = "雖然還無法完全理解……"
90100030-118 = "不過招待學生享用豪華的燒肉，這跟老師的工作有關係嗎？"
90100030-119 = "[s16] 「那當然。」\n[s17] 「讓孩子們吃飽喝足，是大人的義務。」"
90100030-122 = ""
90100030-124 = "[ns18] 「吃得好才能有力氣……」\n[ns19] 「吃得好才能順利成長……」\n[ns20] 「……吃得好才能成為大人啊。」"
90100030-128 = "…………"
90100030-129 = "必須好好吃飯這點……我倒是不否認。"
90100030-130 = "畢竟有句俗話叫做「兵馬未動，糧草先行」啊。"
90100030-131 = ""
90100030-134 = "[ns] 「正好牛小排也烤好了呢。」"
90100030-135 = ""
90100030-136 = "……是塊好肉呢。"
90100030-137 = "等等！感想就只有這樣嗎！？"
90100030-138 = "……我說錯什麼了嗎？"
90100030-139 = "既沒有腥味也不會難以吞嚥，所以我才說這是塊好肉……"
90100030-140 = "我的天。對頂級霜降牛小排的評價居然只是「沒有腥味」──"
90100030-141 = "多麼暴殄天物！多麼令人絕望的味覺啊！"
90100030-142 = "老師，別再給雪乃吃貴的東西了！#n我看他就算只吃烤牛腩，感想八成也差不多啦！"
90100030-143 = "胡桃醬，那樣再怎麼說也有點……"
90100030-144 = "以前在部隊的時候每天都用戰鬥口糧打發三餐，我還以為是他忍耐力很強呢……#n原來只是味覺遲鈍而已啊……"
90100030-145 = "就算對美食再怎麼沒興趣，味覺遲鈍這種評價我可無法接受。"
90100030-146 = "大部分學生應該都不知道，其實SRT補給品的海鮮罐頭放得越久，#n魚味也會隨之增加，所以就算過了保存期限也能美味地吃──"
90100030-147 = "過了保存期限的就直接丟掉啦！"
90100030-148 = "不行了。事到如今，只能把決定權交給味覺還正常的副小隊長了……"
90100030-149 = "來，仁子。決定下一道菜吧！"
90100030-150 = "唔嗯，其實我也算不上是什麼美食家……"
90100030-151 = ""
90100030-153 = ""
90100030-154 = "那就點一份甜點菜單上的豆皮味噌湯──"
90100030-155 = "別在燒肉店吃那種莫名貴的副餐浪費食量啦！"
90100030-157 = "（之後和FOX小隊的隊員們一起，繼續品嘗著這頓略顯喧鬧的晚餐……）"
90100030-159 = "下一話;新的據點"
