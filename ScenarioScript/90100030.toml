90100030-141 = "น่าเศร้าเกินไปแล้ว! ต่อมรับรสทำงานได้น่าอนาถขนาดนี้เลยเหรอ!"
90100030-142 = "คุณครู อย่าให้ยูกิโนะกินของแพงๆ เลย! ต่อให้ย่างเนื้อคาตะบาระให้ ก็คงพูดแบบเดียวกันนั่นแหละ"
90100030-143 = "คุรุมิจัง ฉันว่าไม่หรอกน่า..."
90100030-144 = "ตอนอยู่ในกอง เห็นกินเสบียงสำหรับต่อสู้แทนข้าวทุกวัน ฉันนึกว่าอดทนเรื่องอาหารเก่งซะอีก ที่แท้ก็แค่ลิ้นจระเข้สินะ..."
90100030-145 = "ถึงฉันจะไม่ได้สนใจอาหารรสเลิศ แต่ฉันก็รับไม่ได้ที่จะถูกเรียกว่าลิ้นจระเข้นะ"
90100030-146 = "นี่เป็นข้อมูลที่นักเรียนส่วนใหญ่ไม่รู้ แต่อาหารทะเลกระป๋องที่แจกเป็นเสบียงของ SRT น่ะ ยิ่งเก็บไว้นาน รสชาติของปลาก็จะยิ่งกลมกล่อม เพราะงั้นต่อให้จะเลยวันหมดอายุไปแล้ว ก็ยังกินได้อร่อย..."
90100030-147 = "ถ้าหมดอายุแล้วก็บอกให้ทิ้งไปไง!"
90100030-148 = "ไม่ได้การแล้ว เห็นทีคงต้องมอบอำนาจการตัดสินใจให้รองหัวหน้ากองที่ยังมีประสาทในการรับรสที่#nปกติอยู่..."
