90100030-41 = "อะไรกัน เนื้อนี่มัน..."
90100030-42 = "นุ่มจนแทบละลายทันทีที่สัมผัสปลายลิ้น ทุกครั้งที่เคี้ยว น้ำรสเข้มข้นจากเนื้อก็เอ่อล้นออกมา... แค่พริบตาเดียว ทั้งปากก็เต็มไปด้วยรสชาติของเนื้อแล้ว!"
90100030-43 = "อืม ถึงจะไม่เคยคิดมาก่อนว่าเนื้อที่ SRT ได้รับมาจะมีคุณภาพต่ำ... แต่นี่เป็นครั้งแรกในชีวิตของฉันเลย#nที่ได้กินเนื้อคุณภาพดีขนาดนี้"
90100030-44 = "[s] \"ต่อไปเป็นกิวตัน\""
90100030-45 = "ตายจริง รสกลมกล่อมที่เป็นเอกลักษณ์ของกิวตันเข้ากันได้ดีกับซอสทาเระรสเปรี้ยวหวานเลยค่ะ"
