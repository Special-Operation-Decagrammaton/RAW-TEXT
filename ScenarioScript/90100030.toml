90100030-47 = "ไม่เคยรู้มาก่อนเลยว่ากิวตันเป็นส่วนที่อร่อยขนาดนี้ รสอูมามิเข้มข้นที่เข้ากันได้ดีกับซอส ยอดเยี่ยมไปเลยละ"
