90100030-64 = ""
90100030-65 = "ในปฏิบัติการครั้งนี้ พวกฉันก็ตั้งใจจะกำหนดเป้าหมายของปฏิบัติการกันเอง เพื่อไม่ให้คุณครูต้องเสียเวลาไปกับเรื่องอื่นนอกจากการเป็นผู้สนับสนุนค่ะ..."
