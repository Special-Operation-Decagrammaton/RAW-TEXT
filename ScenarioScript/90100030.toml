[translation]
90100030-1 = "Episode 3;A Squad Marches on Its Stomach"
90100030-2 = "D.U. Outskirts, Premium Reservation-Only Yakiniku Restaurant"
90100030-5 = ""
90100030-6 = "[ns1] \"...Let's start with the skirt steak.\"\n[ns2] \"And a pitcher of cold oolong tea, please.\""
90100030-9 = "You've got it, boss!"
90100030-10 = ""
90100030-12 = ""
90100030-13 = "Um..."
90100030-14 = "Yeah. So..."
90100030-15 = "I'm not sure what to say here..."
90100030-16 = ""
90100030-17 = "[ns3] \"Ah, and some beef tongue!\"\n[ns4] \"And how about an order of bean sprout salad?\""
90100030-20 = "Sure thing!"
90100030-21 = ""
90100030-23 = ""
90100030-24 = "...[USERNAME] Sensei."
90100030-25 = "Before you place another order, I have a question."
90100030-26 = "[s5] \"Ah, a special request?\"\n[s6] \"Order whatever you want!\""
90100030-29 = "No. It's not about the menu."
90100030-30 = "This was intended to be a briefing with Schale."
90100030-32 = "So why are we in a premium yakiniku restaurant...?"
90100030-33 = "[s7] \"We'll eat first, then talk.\"\n[s8] \"...The skirt steak's looking good. Here, have some.\""
90100030-36 = "Ah, thank you..."
90100030-37 = "Sure, since you're offering..."
90100030-38 = ""
90100030-39 = ""
90100030-40 = ""
90100030-41 = "...Wait, what's with this meat?"
90100030-42 = "It's so tender that it's practically melting in my mouth, but it's so juicy... How is this possible?"
90100030-43 = "Huh. I never thought SRT had low-quality food. But I've never tasted something like this."
90100030-44 = "[s] \"Now the beef tongue.\""
90100030-45 = "Oh my. The savory beef tongue really complements the sweet and tangy tare sauce."
90100030-46 = "I could finely chop this and add it to my inarizushi. This texture is amazing!"
90100030-47 = "I never thought beef tongue would be good, but it has such a deep flavor. Pass the sauce."
90100030-48 = ""
90100030-50 = ""
90100030-51 = "Now that I think about it, if this is a cow's tongue, then isn't eating beef tongue a little like kissing a cow?"
90100030-52 = "Otogi, we're trying to eat! This is a NICE place!"
90100030-53 = ""
90100030-55 = ""
90100030-56 = ""
90100030-57 = "[ns9] \"You barely touched your food, Yukino.\"\n[ns10] \"Would you prefer the intestines?\""
90100030-60 = "No, I don't particularly care for offal."
90100030-61 = "Once again, I'm not here for the free meal."
90100030-62 = ""
90100030-64 = ""
90100030-65 = "So, for this \"Lore\" mission, we don't need extensive supervision. We'll set the objectives ourselves, so you don't need to worry about any of that."
90100030-66 = "...The problem is that the General Student Council President told me that you wanted to take direct command of this mission."
90100030-67 = "[s11] \"If you're operating under my department, I'm taking responsibility.\"\n[s12] \"You might think I'm a nuisance, but I need to meddle.\""
90100030-70 = "\"Meddle\"..."
90100030-71 = "You say that, but I'm sure you also know that this mission is our chance for atonement. The stakes are high and personal."
90100030-72 = "Ultimately, your \"meddling\" would mean taking some of our debt."
90100030-73 = ""
90100030-75 = ""
90100030-76 = "...Sensei."
90100030-77 = "Why are you helping us?"
90100030-78 = "It would be one thing if you were simply offering professional help, but you're drowning us in such overwhelming kindness..."
90100030-79 = "...Honestly, it's scaring me a little."
90100030-80 = "[s] \"Don't worry about it. We're just having a meal.\""
90100030-81 = ""
90100030-85 = "[ns] \"Oh, are you concerned that I poisoned the meat?\""
90100030-86 = "...Poison? What do you mean by—"
90100030-87 = ""
90100030-89 = ""
90100030-90 = "*cough* *wheeze*"
90100030-91 = "Take it easy, Kurumi."
90100030-92 = "If you stop wolfing it down, you won't choke like that!"
90100030-93 = "Th-That's not what happened...!"
90100030-94 = "Ahaha... Now that I think about it, this feels familiar."
90100030-95 = "...I don't understand what any of you are saying."
90100030-97 = "Pardon me! Let me just squeeze in here and swap out the grill grate!"
90100030-98 = "[s] \"Ah, and we'll have three more ribs, please.\""
90100030-99 = "Absolutely!"
90100030-100 = ""
90100030-102 = ""
90100030-104 = ""
90100030-105 = "...When I said I was \"scared,\" I wasn't talking about an honest threat to our safety."
90100030-106 = "We've already received far more kindness from you than we deserve."
90100030-107 = "You grabbed us from the bottom of the abyss to stop us from making a dire mistake. You saved both ours and our underclassmen's lives."
90100030-108 = "That debt alone is already so heavy that we could never repay you. Still, you continue to show us kindness and offer your help..."
90100030-109 = "I've been trying to discern your motives. What do you expect to get out of this?"
90100030-110 = "[s] \"I've been asked this before...\""
90100030-111 = ""
90100030-114 = "[ns14] \"I'm not expecting anything from you.\"\n[ns15] \"I'm just your teacher.\""
90100030-117 = "I still don't understand. Not fully."
90100030-118 = "What does being a teacher have to do with buying us a gourmet meal?"
90100030-119 = "[s16] \"It's clear, isn't it?\"\n[s17] \"It's an adult's responsibility to ensure children eat well.\""
90100030-122 = ""
90100030-124 = "[ns18] \"They need to be well-fed to have energy...\"\n[ns19] \"Good food helps you grow...\"\n[ns20] \"...And all that helps you become good adults.\""
90100030-128 = "..."
90100030-129 = "I won't deny...the benefits of nutrition."
90100030-130 = "There's a saying, I'm sure you know. \"An army marches on its stomach.\""
90100030-131 = ""
90100030-134 = "[ns] \"The ribs are ready.\""
90100030-135 = ""
90100030-136 = "...This is quality meat."
90100030-137 = "Please! Is that all you have to say?!"
90100030-138 = "...What was wrong with my statement?"
90100030-139 = "It IS quality meat. It's odorless and easy to chew."
90100030-140 = "Honestly! You grab premium short rib and all you have to say is that it's \"odorless\"?"
90100030-141 = "Truly outrageous! Your palate is hopeless!"
90100030-142 = "Sensei, don't give Yukino anything expensive! I'm sure she'd love a piece of fried brisket just as much! Or a chicken nugget!"
90100030-143 = "Kurumi, let's be nice..."
90100030-144 = "I thought she was tough because she lived off of combat rations back in the day, but maybe she just has no sense of taste..."
90100030-145 = "I may not be a gourmand, but I can't let that statement slide. I know how to taste things."
90100030-146 = "Most students don't know this, but SRT's standard canned seafood has a flavor that matures and deepens over time. It can be THOROUGHLY enjoyed even after the expiration date..."
90100030-147 = "Please throw out expired food!"
90100030-148 = "I can't do this anymore. At this point, we should let our second-in-command, who at least has a functioning tongue, choose..."
90100030-149 = "Okay, Niko. Make the next order!"
90100030-150 = "Um. I'm not much of a \"gourmand\" myself, but..."
90100030-151 = ""
90100030-153 = ""
90100030-154 = "I've been eyeing the inari miso soup on the dessert menu..."
90100030-155 = "Stop filling up on overpriced sides! We're at a yakiniku restaurant! Eyes on the prize!"
90100030-157 = "I continued my somewhat rowdy dinner with the FOX Squad..."
90100030-159 = "Next Episode;A New Base"
