[translation]
200003-1 = "第3話;奇妙的夢"
200003-4 = "「這個故事講述的是身為夏萊老師的你，以及你的智慧手錶所發生的事。」"
200003-5 = "「你雖然算不上是個生活規律的人，不過也算是會努力準時起床的類型。」"
200003-6 = "「而放在桌邊的智慧手錶，正是幫助你起床的唯一夥伴。」"
200003-7 = ""
200003-10 = "[ns1] 「彩奈……？」\n[ns2] 「希迪姆的箱子跑到哪裡去了？」"
200003-13 = "「你像是還沉浸在睡意中似的，努力尋找著根本不在身邊的平板。#n　……然而你是不可能找到的。」"
200003-14 = "「因為你從聯邦學生會長那裡拿到的電子裝置，#n　只有一支名為『沙克德之杖』的智慧手錶而已。」"
200003-15 = "[s] 尋找希迪姆的箱子"
200003-16 = "「你在寢室裡持續著毫無意義的搜索，最終還是以失敗告終。」"
200003-17 = "「你心想，難道是自己昨晚把平板放到別的地方去了嗎？」"
200003-18 = "「你以熟練的手法戴上手錶，前往了休息室。」"
200003-19 = ""
200003-22 = "「休息室的燈光尚未亮起，裡面一片昏暗。#n　你像平常一樣預熱咖啡機，接著泡了一杯濃縮咖啡。」"
200003-23 = "「咖啡機將廉價的羅布斯塔咖啡豆磨碎，萃取出濃郁的濃縮咖啡……#n　雖然幾乎沒有香味且苦味很重，用來驅散早晨的睡意卻再好不過了。」"
200003-30 = "「稍微清醒一些的你，前往了平時處理業務的辦公室。」"
200003-31 = ""
200003-34 = "「然而，抵達辦公室的你察覺到了另一個異變。」"
200003-35 = "「平常應該早已抵達的學生，此刻卻不見蹤影。#n　不過考慮到偶爾也會有遲到的情況，你並沒有太放在心上。」"
200003-36 = "「……直到拉開窗簾為止。」"
200003-37 = ""
200003-43 = "[ns] 「咦……？」"
200003-44 = "「推開窗戶的你，察覺到了第三個異變。」"
200003-45 = "「世界失去了色彩。#n　那總是閃耀著清澈光芒的奇普托斯，此刻卻像烏雲密布一般被染成了灰色。」"
200003-46 = "「這並不是單純的天氣陰沉。#n　那總是散發著溫暖光芒的路燈，也變成了冰冷的白色。#n　世界上所有的色彩，全都只剩下黑白兩色。」"
200003-47 = "「……除此之外，就連行人在市區裡往來的身影也完全消失了。」"
200003-48 = "「彷彿除了你以外的一切，都如同蒸發一般消失殆盡。」"
200003-49 = "[ns] 「這個聲音又是怎麼回事……？」"
200003-50 = "「因接連不斷的異變而陷入混亂的你，#n　最終甚至開始懷疑起在自己腦海中浮現的那些文字。」"
200003-51 = "「不過請別擔心。至少這一點並不是異變。」"
200003-52 = "「在創作時由於情感描寫相對容易而以第一人稱開始敘述，#n　後來卻因為難以推進情節而改用第三人稱……#n　這是初次嘗試寫作的人經常遭遇的情況。」"
200003-53 = ""
200003-56 = "「……或許，這是個難以令人產生共鳴的話題也說不定。」"
200003-57 = "「你穿好衣服，急忙前往了醫院。#n　因為這是釐清自己的腦袋出了什麼問題最好的方法。」"
200003-58 = "[ns] 前往聯邦學生會的大樓"
200003-59 = "「……不過你或許會選擇其他方法也說不定。」"
200003-62 = "「就算在前往聯邦學生會大樓的途中，周遭的風景也絲毫沒有改變。」"
200003-63 = "「從窗外望見的奇普托斯，彷彿失去了色彩一般被染成一片黑白。」"
200003-64 = "「你曾經見過與此相似的景象。」"
200003-66 = "「不過與現在不同，當時世界是被鮮紅欲滴、令人窒息的紅色所壟罩……」"
200003-67 = "「但是那個時候，至少還能看見學生們的身影。」"
200003-73 = "「然而現在──卻並非如此。」"
200003-75 = "「抵達聯邦學生會大樓的你仔細地端詳著建築物，卻依然感受不到任何人的氣息。」"
200003-76 = "「總是嚴格為你打點一切的戴眼鏡行政官，#n　以及最愛明太子口味洋芋片的粉色頭髮幹部──如今全都不見蹤影。」"
200003-77 = "「……但是還有一個地方你還沒確認。」"
200003-78 = "「你彷彿被某種力量吸引一般登上了階梯，朝著『那個地方』走去。」"
200003-79 = "「朝著一切開始的那個地方。」"
200003-87 = "「空無一人的聯邦學生會長辦公室正中央，坐著一位素未謀面的少女。」"
200003-88 = "「不，是一位莫名讓你感到熟悉和懷念的少女正坐在那裡。」"
200003-89 = "[ns] 「現在正在說話的……是你嗎？」"
200003-90 = "「既是如此，卻也並非如此。」"
200003-91 = "「這個世界不僅是少女的思念，同時也是你的夢境。」"
200003-92 = "「正如你注視著少女一般，少女也同樣注視著你。」"
200003-93 = "[ns] 「你是誰？」"
200003-98 = "初次見面，老師。"
200003-99 = "我是奇普托斯的──"
200003-100 = ""
200003-109 = "[ns] 「這裡是……」"
200003-114 = "老師，你還好嗎！？"
200003-115 = "剛才睡覺的時候一直露出很痛苦的表情，所以我很擔心。"
200003-116 = "[s] 「原來是夢啊……」"
200003-117 = "莫非，您做了惡夢嗎？"
200003-118 = "[s] 「不。雖然不是惡夢……」"
200003-128 = ""
200003-129 = "[ns] 「……不過確實是個有點奇怪的夢。」"
200003-130 = "不是惡夢的話倒是值得慶幸，然而……"
200003-131 = "導致睡眠障礙的原因有很多種，還請您定期接受健康檢查。"
200003-132 = "真是的……都是因為老師最近幾乎都不睡覺又常常不吃飯，所以才會做惡夢啦！"
200003-133 = "之後超級彩奈醬每到用餐時間就會提醒你的，一定要三餐按時吃飯哦！"
200003-134 = "[s] 「謝謝你們兩個這麼擔心我。」"
200003-135 = ""
200003-137 = ""
200003-138 = "[ns] 「話說回來……你們知道『沙克德之杖』是什麼嗎？」"
200003-139 = "……否定。我的記憶體中沒有這項詞彙的紀錄。"
200003-140 = "這個嘛……我以前好像聽過類似的東西……"
200003-141 = "您是在哪裡聽到的呢？"
200003-142 = "[s] 「我也不太記得了……」"
200003-143 = ""
200003-145 = ""
200003-146 = "[ns3] 「夢的事情之後再慢慢思考吧……」\n[ns4] 「反正都睡醒了，今天就稍微提早開始一天的行程吧。」"
200003-149 = "咦？現在才凌晨4點而已耶！？"
200003-150 = "肯定。為了老師的健康著想，我也建議您應該馬上回到床上好好睡一覺。"
200003-151 = "來，請馬上躺回床上吧。"
200003-152 = "如果睡不著的話，我可以親自幫老師唱搖籃曲哦！"
200003-153 = "雖然我的系統並未安裝音樂外掛程式……但是我會盡最大的努力。"
200003-154 = ""
200003-156 = ""
200003-159 = "下一話;閃耀的不等邊多面體"
