[translation]
200003-1 = "Episode 3;A Weird Dream"
200003-4 = "\"This story is about you, Schale's Sensei, and your smartwatch.\""
200003-5 = "\"You're not necessarily disciplined enough to claim a daily routine, but you do try your best to wake up on time.\""
200003-6 = "\"The smartwatch lying on the table next to you chimes to wake you up. Your one and only partner.\""
200003-7 = ""
200003-10 = "[ns1] \"Arona...?\"\n[ns2] \"Where's the Shittim Chest?\""
200003-13 = "\"Still half-asleep, you desperately search for a tablet that you don't have... And how can you find something you don't own?\""
200003-14 = "\"The only electronic device the General Student Council President gifted you is a smartwatch. The Staff of Shaqed.\""
200003-15 = "[s] Look for the Shittim Chest."
200003-16 = "\"You continue your meaningless search in your bedroom, and come up with nothing.\""
200003-17 = "\"You think to yourself: Did I leave my tablet somewhere last night?\""
200003-18 = "\"As if you've done it a thousand times before, you snap your smartwatch on your wrist and go to the lounge.\""
200003-19 = ""
200003-22 = "\"The lounge is dark, and out of habit, you start bustling around the coffee machine.\""
200003-23 = "\"You grind up cheap beans and make yourself a strong espresso. It's bitter, and the taste flat, but it's exactly what you need to wake up and start your day.\""
200003-30 = "\"With caffeine now pumping through your veins, you head to your usual office to do your usual work.\""
200003-31 = ""
200003-34 = "\"However, upon arriving, you notice another anomaly.\""
200003-35 = "\"The Student Rep should have arrived by now. But that in itself isn't necessarily an unusual occurrence. They're students, prone to running on their own schedules, so the strangeness of it slips away as quickly as you noticed it.\""
200003-36 = "\"...That is, until you open the curtains.\""
200003-37 = ""
200003-43 = "[ns] \"Huh...?\""
200003-44 = "\"Thus, you witness the third anomaly.\""
200003-45 = "\"The Kivotos you know is a landscape of black and white. The radiance which shimmered through the city has turned bleak with grey, as if the clouds have eclipsed the sun.\""
200003-46 = "\"But it is not overcast today. Even the streetlights themselves have lost their warm glow. Black and white dances where color once lived.\""
200003-47 = "\"...And the streets. They echo with an emptiness you've never witnessed before.\""
200003-48 = "\"It would appear that everyone and everything in the world has crumbled into dust...except you.\""
200003-49 = "[ns] \"What is this sound...?\""
200003-50 = "\"Anomaly after anomaly strains your sense of reality, and not even your thoughts seem to be your own.\""
200003-51 = "\"Ease your worries. For these are not anomalies, after all.\""
200003-52 = "\"New writers often fall into the trap of writing in first person to best capture the emotions of their story, only to find that third person allows for more freedom in narrative development.\""
200003-53 = ""
200003-56 = "\"...Perhaps that was rather too esoteric to relate to.\""
200003-57 = "\"You decide to change your clothes and go to the hospital. After all, you must be ill in the head, no?\""
200003-58 = "[ns] Head to the General Student Council building."
200003-59 = "\"...Or perhaps you find a different method.\""
200003-62 = "\"Your path to the General Student Council only further confirms what you've seen thus far.\""
200003-63 = "\"The scenery is dyed in black and white. As if color itself has forgotten how to exist.\""
200003-64 = "\"It evokes a certain sense of familiarity within you.\""
200003-66 = "\"You remember a scene, quite similar, but rather different. One overlaid with a dripping red that had burned your eyes.\""
200003-67 = "\"Familiar, but not. For the students had been with you then.\""
200003-73 = "\"Now, they are nowhere to be seen.\""
200003-75 = "\"You arrive at the General Student Council building, only to find more of the same.\""
200003-76 = "\"Neither the chief officer with glasses, who always looked after you, nor the pink-haired executive who loves pollock roe potato chips... No one remains.\""
200003-77 = "\"...After searching, you know there is one place you have yet to go.\""
200003-78 = "\"As if an outside force guides you, you begin climbing the stairs to that place.\""
200003-79 = "\"To the place where everything began.\""
200003-87 = "\"There, you find a mysterious girl sitting in the very center of the empty General Student Council Executive Office.\""
200003-88 = "\"But what is this strange sense of nostalgia she elicits?\""
200003-89 = "[ns] \"Are you the one who's been speaking to me?\""
200003-90 = "\"Yes, but no. Yes, and no.\""
200003-91 = "\"For this is your dream. And a girl's simple longing.\""
200003-92 = "\"You gaze upon her, and she gazes back at you.\""
200003-93 = "[ns] \"Who are you?\""
200003-98 = "I'm happy to meet you, Sensei."
200003-99 = "I am Kivotos'..."
200003-100 = ""
200003-109 = "[ns] \"This is...\""
200003-114 = "Sensei! Are you okay?!"
200003-115 = "You looked like you were in pain while you were sleeping!"
200003-116 = "[s] \"That was a dream?\""
200003-117 = "Did you have a nightmare?"
200003-118 = "[s] \"No. I wouldn't exactly call it that.\""
200003-128 = ""
200003-129 = "[ns] \"It was more of a weird dream.\""
200003-130 = "I am relieved that you did not suffer a nightmare."
200003-131 = "However, a sleep disorder can be a symptom of any number of health issues. I recommend regular health check-ups."
200003-132 = "It's obvious why you're having bad dreams! You've been skipping meals and sleeping late!"
200003-133 = "But don't worry, Super Arona is here! I'll start reminding you whenever it's time to eat!"
200003-134 = "[s] \"Thanks for your concerns, both of you.\""
200003-135 = ""
200003-137 = ""
200003-138 = "[ns] \"By the way... Do you know what the Staff of Shaqed is?\""
200003-139 = "...Negative. The term is not registered in my memory."
200003-140 = "Hm... I dunno. It sounds kinda familiar."
200003-141 = "Where'd you hear it from?"
200003-142 = "[s] \"I don't really remember...\""
200003-143 = ""
200003-145 = ""
200003-146 = "[ns3] \"Let me put aside that dream for now...\"\n[ns4] \"Since I'm up, I might as well get some work done.\""
200003-149 = "HUH?! It's 4 AM, Sensei!"
200003-150 = "I am in agreement. Recommendation: return to bed and ensure you receive the proper hours of sleep, Sensei."
200003-151 = "That's right! Go lie down right now!"
200003-152 = "Don't worry if you're not sleepy! I'll sing you a lullaby."
200003-153 = "I do not have a music plugin installed in my OS... But I will also help."
200003-154 = ""
200003-156 = ""
200003-159 = "Next Episode;The Shining Trapezohedron"
