[translation]
200003-1 = "ตอนที่ 3;ฝันประหลาด"
200003-4 = "\"เรื่องราวในครั้งนี้ เป็นเรื่องราวเกี่ยวกับตัวคุณ... คุณครูของชาเล่ต์และสมาร์ตวอทช์เรือนสำคัญ\""
200003-5 = "\"แม้คุณจะไม่ใช่คนที่ดำเนินชีวิตตามกฎเกณฑ์อย่างเคร่งครัดนัก แต่ถึงอย่างนั้นก็ยังเป็นคนที่พยายาม#nจะตื่นนอนให้ตรงเวลาอยู่เสมอ\""
200003-6 = "\"และสมาร์ตวอทช์ที่วางอยู่บนโต๊ะข้างเตียงนอนก็คือคู่หูเพียงหนึ่งเดียวที่คอยปลุกให้ตื่นอยู่ตลอด\""
200003-7 = ""
200003-10 = "[ns1] \"อะโรน่า...?\"\n[ns2] \"กล่องแห่งซิสดิมอยู่ไหนนะ?\""
200003-13 = "\"คุณยังคงมีอาการง่วงงุน จึงตั้งหน้าตั้งตาหาแท็บเล็ตที่ไม่มีอยู่จริง... ทว่าคงหาไม่พบ\""
200003-14 = "\"เพราะอุปกรณ์อิเล็กทรอนิกส์ที่คุณได้รับจากประธานองค์การนักเรียนมีเพียงสมาร์ตวอทช์ที่เรียกว่า 'ชาเคด' เท่านั้น\""
200003-15 = "[s] มองหากล่องแห่งซิสดิม"
200003-16 = "\"คุณยังคงค้นหาภายในห้องนอนต่อไป แต่สุดท้ายก็คว้าน้ำเหลว\""
200003-17 = "\"คุณครุ่นคิดว่า... เมื่อคืนอาจนำแท็บเล็ตไปวางลืมไว้ที่อื่น...\""
200003-18 = "\"คุณหยิบสมาร์ตวอทช์ขึ้นมาสวมด้วยท่าทางที่คุ้นเคย แล้วมุ่งหน้าไปที่ห้องพักผ่อนเป็นอันดับแรก\""
200003-19 = ""
200003-22 = "\"ห้องพักผ่อนยังมืดสนิทเพราะยังไม่ได้เปิดไฟ คุณเปิดเครื่องชงกาแฟและเริ่มชงเอสเปรสโซ่หนึ่งแก้ว#nเหมือนทุกๆ วัน\""
200003-23 = "\"เมล็ดกาแฟโรบัสต้าราคาถูกได้ถูกบดในเครื่องชงกาแฟและสกัดออกมาเป็นเอสเปรสโซ่เข้มข้น... แม้แทบจะไม่ได้กลิ่นหอมของกาแฟและมีรสขมจัด แต่ก็เป็นกาแฟที่เหมาะสำหรับปลุกให้ตื่นในยามเช้า เป็นอย่างมาก\""
200003-30 = "\"หลังจากคลายความง่วงงุนได้ขึ้นมาบ้างแล้ว คุณก็มุ่งหน้าไปยังห้องทำงานที่ใช้เป็นประจำ\""
200003-31 = ""
200003-34 = "\"เมื่อมาถึงห้องทำงาน คุณก็สังเกตเห็นความผิดปกติอีกอย่างหนึ่ง\""
200003-35 = "\"หากเป็นเวลานี้ ตามปกตินักเรียนตัวแทนควรจะมาเข้าเวรกันแล้ว แต่ตอนนี้คุณกลับไม่เห็นแม้แต่เงา#nของใคร แต่ว่านักเรียนบางคนก็มาสายเป็นครั้งคราว คุณจึงไม่ได้ติดใจอะไรมากนัก\""
200003-36 = "\"จนกระทั่งผ้าม่านได้ถูกเปิดออก...\""
200003-37 = ""
200003-43 = "[ns] \"หืม...?\""
200003-44 = "\"เมื่อเปิดหน้าต่างออกไป คุณก็สังเกตเห็นความผิดปกติอย่างที่สาม\""
200003-45 = "\"โลกทั้งใบถูกย้อมกลายเป็นสีขาวดำ ทิวทัศน์ของคิโวทอสที่เคยเปล่งประกายด้วยแสงสดใส กลับถูกย้อมเป็นสีเทาราวกับวันที่มีเมฆหมอกปกคลุมเต็มท้องฟ้า\""
200003-46 = "\"ทว่าไม่ใช่เพียงเพราะอากาศมืดครึ้ม แม้แต่แสงไฟถนนที่เคยส่องสว่างอบอุ่นก็กลับกลายเป็นสีขาว#nเยียบเย็น และสีสันทั้งหมดของโลกก็ถูกถ่ายทอดออกมาเพียงแค่สีขาวกับดำเท่านั้น\""
200003-47 = "\"ยิ่งไปกว่านั้น... ไม่มีวี่แววของผู้คนสัญจรไปมาภายในเมืองเลยแม้แต่คนเดียว\""
200003-48 = "\"ราวกับทุกสิ่งทุกอย่างนอกจากคุณได้ระเหยหายไป...\""
200003-49 = "[ns] \"เสียงนี่มันอะไรกัน...?\""
200003-50 = "\"ความผิดปกติที่เกิดขึ้นต่อเนื่องทำให้คุณสับสน จนท้ายที่สุดก็เริ่มสงสัยแม้กระทั่งประโยคที่ผุดขึ้นมา#nในความคิดของคุณเอง\""
200003-51 = "\"แต่ไม่ต้องกังวล เพราะนี่ไม่ใช่เรื่องผิดแปลกอะไรเลยสักนิด\""
200003-52 = "นักเขียนมือใหม่มักเริ่มต้นการเขียนด้วยมุมมองบุคคลที่หนึ่งเพื่อให้บรรยายอารมณ์ได้ง่ายขึ้น แล้วเปลี่ยนไปเป็นมุมมองบุคคลที่สามเนื่องจากพบความยากลำบากในการพัฒนาเรื่องราว"
200003-53 = ""
200003-56 = "\"บางที... นี่อาจเป็นหัวข้อที่เข้าถึงได้ยาก\""
200003-57 = "\"คุณรีบแต่งตัวแล้วมุ่งไปที่โรงพยาบาล เพราะการไปโรงพยาบาลเป็นวิธีที่ดีที่สุดที่จะตรวจหาสาเหตุ ว่าสมองของคุณผิดปกติอะไรหรือไม่\""
200003-58 = "[ns] ไปที่อาคารองค์การนักเรียน"
200003-59 = "\"บางทีคุณอาจเลือกวิธีอื่นก็ได้...\""
200003-62 = "\"ระหว่างที่มุ่งหน้าไปยังอาคารขององค์การนักเรียน ทิวทัศน์รอบข้างก็ไม่เปลี่ยนไปเลยแม้แต่น้อย\""
200003-63 = "\"ทิวทัศน์ของคิโวทอสที่มองเห็นนอกหน้าต่างถูกย้อมเป็นสีขาวดำ ราวกับว่าสีสันได้จางหายไป\""
200003-64 = "\"คุณเคยพบเห็นทิวทัศน์ที่คล้ายคลึงกันมาก่อนแล้ว\""
200003-66 = "\"แม้ครั้งนั้นจะแตกต่างจากในตอนนี้ ตรงที่โลกถูกย้อมเป็นสีแดงฉานจนแสบตา...\""
200003-67 = "\"แต่อย่างน้อยก็ยังมีเหล่านักเรียนอยู่\""
200003-73 = "\"ทว่าตอนนี้ไม่ใช่\""
200003-75 = "\"เมื่อมาถึงอาคารขององค์การนักเรียน คุณเดินสำรวจอาคารอย่างละเอียดแล้ว#nแต่ก็ไม่พบวี่แววของผู้คนเลย\""
200003-76 = "\"ทั้งเจ้าหน้าที่สวมแว่นผู้คอยดูแลคุณอย่างเข้มงวด และกรรมการที่มีผมสีชมพูที่ชื่นชอบมันฝรั่งทอด#nรสเมนไทโกะเป็นอย่างมาก... ก็ไม่มีใครปรากฏตัวออกมาเลย\""
200003-77 = "\"แต่ยังเหลือสถานที่หนึ่งที่คุณยังไม่ได้ตรวจสอบ...\""
200003-78 = "\"คุณขึ้นบันไดไปยัง 'สถานที่นั้น' ราวกับถูกบางสิ่งบางอย่างดึงดูดไป\""
200003-79 = "\"ไปยังสถานที่ที่ทุกอย่างเริ่มต้นขึ้น\""
200003-87 = "\"กลางห้องทำงานของประธานองค์การนักเรียนอันว่างเปล่า มีเด็กสาวที่ไม่เคยพบมาก่อนนั่งอยู่\""
200003-88 = "\"ไม่สิ เด็กสาวผู้มีภาพลักษณ์ที่ชวนให้หวนคิดถึงอดีต และกระตุ้นความโหยหาภายในใจคุณอย่างน่า#nประหลาด... นั่งอยู่ ณ ที่แห่งนั้น\""
200003-89 = "[ns] \"คนที่กำลังพูดอยู่คือเธอที่นั่งอยู่ตรงนั้นเหรอ?\""
200003-90 = "\"ใช่ ในขณะเดียวกันก็ไม่ใช่\""
200003-91 = "\"โลกใบนี้คือความคะนึงของเด็กสาว และเป็นความฝันของคุณ\""
200003-92 = "\"เด็กสาวมองคุณเช่นเดียวกับที่คุณมองเด็กสาวอยู่\""
200003-93 = "[ns] \"เธอเป็นใครน่ะ?\""
200003-98 = "ยินดีที่ได้พบค่ะ คุณครู"
200003-99 = "ฉันคือ—— ของคิโวทอส"
200003-100 = ""
200003-109 = "[ns] \"ที่นี่คือ...\""
200003-114 = "คุณครู ไม่เป็นไรใช่มั้ยคะ?!"
200003-115 = "คุณครูทำหน้าทรมานมากๆ ตอนหลับ พวกเราเลยเป็นห่วงค่ะ"
200003-116 = "[s] \"ฝันไปนี่เอง...\""
200003-117 = "ฝันร้ายเหรอคะ"
200003-118 = "[s] \"เปล่า ครูไม่ได้ฝันร้ายหรอก...\""
200003-128 = ""
200003-129 = "[ns] \"แต่มันเป็นความฝันแปลกๆ น่ะ...\""
200003-130 = "ถ้าไม่ใช่ฝันร้ายก็โล่งอกไปทีค่ะ"
200003-131 = "ความผิดปกติด้านการนอนหลับเกิดขึ้นได้จากหลายสาเหตุ ดังนั้นควรเข้ารับการตรวจสุขภาพเป็นประจำค่ะ"
200003-132 = "จริงๆ เลยนะคะ... ช่วงนี้คุณครูไม่ค่อยได้นอนพัก แถมยังอดอาหารบ่อยๆ ก็เลยฝันร้ายแบบนี้ไงล่ะคะ!"
200003-133 = "ต่อไปนี้ซูเปอร์อะโรน่าจังจะส่งแจ้งเตือนให้กินอาหารทุกมื้อเลย เพราะงั้นต้องกินอาหารให้ตรงเวลานะคะ!"
200003-134 = "[s] \"ขอบคุณที่พวกเธอเป็นห่วงครูนะ\""
200003-135 = ""
200003-137 = ""
200003-138 = "[ns] \"ว่าแต่ว่า... รู้มั้ยว่า 'คทาแห่งชาเคด' คืออะไร?\""
200003-139 = "ปฏิเสธ... ไม่พบคำนี้ในหน่วยความทรงจำของฉันค่ะ"
200003-140 = "ไม่แน่ใจเลยค่ะ... แต่หนูเหมือนจะเคยได้ยินชื่อคล้ายๆ แบบนี้มาก่อน..."
200003-141 = "คุณครูได้ยินมาจากที่ไหนเหรอคะ?"
200003-142 = "[s] \"ครูเองก็นึกไม่ค่อยออกน่ะ...\""
200003-143 = ""
200003-145 = ""
200003-146 = "[ns3] \"เอาไว้ค่อยมาทบทวนเรื่องความฝันทีหลังละกัน\"\n[ns4] \"ตอนนี้ตื่นเต็มตาแล้ว งั้นเริ่มกิจวัตรประจำวันเร็วขึ้นสักหน่อยแล้วกัน\""
200003-149 = "คะ? ตอนนี้เพิ่งจะตีสี่เองนะคะ?!"
200003-150 = "เห็นด้วย เพื่อสุขภาพที่ดีของคุณครู ฉันขอแนะนำให้กลับไปนอนให้เต็มอิ่มดีกว่าค่ะ"
200003-151 = "เอาละๆ กลับไปนอนบนเตียงเดี๋ยวนี้เลยค่ะ"
200003-152 = "ถ้านอนไม่หลับ เดี๋ยวพวกเราจะร้องเพลงกล่อมให้เองค่ะ!"
200003-153 = "ถึง OS นี้จะไม่ได้ติดตั้งปลั๊กอินดนตรีไว้... แต่ฉันจะพยายามเต็มที่ค่ะ"
200003-154 = ""
200003-156 = ""
200003-159 = "ตอนต่อไป;ผลึกทรงหลายเหลี่ยมที่เป็นประกาย"
