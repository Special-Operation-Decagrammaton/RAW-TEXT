[translation]
33095-2 = "하아…… 하아……."
33095-3 = "크윽……."
33095-7 = "[ns] \"히나……!!\""
33095-12 = "게헨나의 선도부장. 쓰러졌습니다."
33095-13 = "드, 드디어…… 저 상처로도 여기까지……."
33095-14 = "……."
33095-15 = "트리니티와 게헨나의 주요 요인들은 모두 치워졌지. 남은 건 이제 너뿐이다. <샬레>의 선생."
33095-16 = "[s] \"너희가 바로 아리우스 스쿼드……?\""
33095-17 = "……."
33095-18 = "흠."
33095-19 = "헤헤……."
33095-20 = "……."
33095-24 = "그래. 우리가 바로 아리우스 스쿼드다. 드디어 만나게 되었군, 선생. 아즈사가 신세를 졌더군."
33095-25 = "[s] \"……!!\""
33095-26 = "아즈사는 잘 지내고 있나 보군. 조만간 만나러 갈 예정이지만."
33095-27 = "우리는 바로 이곳, 통공의 고성당에서 트리니티를 대신해 이 조약에 조인했다."
33095-28 = "……."
33095-29 = "[s] \"무슨 뜻이야……?\""
33095-30 = "바로 우리 <아리우스 스쿼드>가 낙원의 이름으로 조약을 수호하는 새로운 무력집단, [ruby=ETO]에덴조약기구[/ruby]가 되었다는 뜻이다."
33095-31 = "[s] \"……!\""
33095-32 = "이것은 원래 우리들의 의무였다. 1차 공의회에서 우리들이 원래 행사했어야 할 마땅한 권리."
33095-33 = "하지만 그것을 트리니티가 멋대로 짓밟아버렸지. 우리를 <분쟁대상>으로 정의하고 철저하게 탄압했다."
33095-34 = "그러니 이제 우리 <아리우스 스쿼드>가 ETO의 권한으로 <분쟁대상>을 다시 정의하겠다."
33095-35 = "게헨나, 트리니티야 말로 에덴조약을 위배하는 분쟁 요소. 배제해야만 할 대상."
33095-36 = "[s] \"그렇다는 건…….\""
33095-37 = "트리니티와 게헨나를 키보토스에서 지워버리겠다는 뜻이지."
33095-44 = "……이 조약의 계율을 수호하는 수호자들과 함께 말이다."
33095-45 = "너희들은 1차 공의회 이후 수백 년의 원한. 그 긴 시간 동안 이어져 온 우리의 증오를 확인하게 될 것이다."
33095-46 = "아아, 그러니까 그 전에. <샬레>의 선생부터 처리해야겠군."
33095-50 = "[ns] (총이 겨눠졌다…….)"
33095-51 = "그녀는 당신이야말로 계획에 가장 큰 차질이 될 거라고 하더군."
33095-54 = "으아아아아아---!!"
33095-60 = "……!! 아직도 움직일 수 있는 건가! 소라사키 히나!"
33095-61 = "세나-!! 이쪽이야!!"
33095-65 = "애, 앰뷸런스……?!"
33095-74 = "선생님! 이쪽입니다! 손을 잡아주세요!"
33095-78 = "놓칠까 보냐!!"
33095-82 = "아, 아직도 이런 힘이……."
33095-89 = "……놓쳤어."
33095-90 = "뭐, 됐어. 히나가 방해하긴 했지만 총을 맞은 것을 확인했다."
33095-91 = "키보토스의 사람이 아니니 헤일로가 파괴…… 아니, 죽겠지."
33095-92 = "하지만 저렇게까지 보호하다니…… 저 선생이 그렇게 중요한 존재인가?"
33095-93 = "……."
33095-94 = "저 사람이 없었다면 모든 것이 계획대로 되었을 거다…… 그런 얘기인가요? 공주님? 아즈사도……?"
33095-95 = "……."
33095-98 = "[ns] (배가…… 뜨겁다…….)"
33095-99 = "잘 들으십시오. 선생님. 당신은 총에 맞았습니다."
33095-100 = "기적처럼 급소를 피했지만, 이 출혈을 그냥 둘 수는 없습니다."
33095-101 = "지금부터 응급처치에 들어가겠습니다. 아프면 비명을 지르세요."
33095-102 = "아아, 죽게 놔두진 않겠습니다. 저는 응급의학부니까요."
33095-106 = "[ns] (의식이 흐려진다…….)"
33095-108 = "……."
33095-109 = "흐음. 그런가. 여기서 너의 등장인가."
33095-110 = "……. 설마 진짜로 모습을 드러낼 줄은. 그대로 도망쳤으면 좋았을 것을."
33095-111 = "헤, 헤헤 오랜만이네요……."
33095-117 = "하아…… 하아…… 하아……."
33095-118 = "……그래, 기분이 어떠냐. 아즈사."
33095-119 = "감히…… 감히……."
33095-120 = "내가 말한 대로지? 트리니티에도, <샬레>에도, 그 어디에도 네가 있을 곳은 없다. 당연하다."
33095-121 = "우리 같은 살인자를 받아줄 수 있을 곳이 이 세계에 있을 리가 없는데."
33095-122 = "감히…… 선생님을……."
33095-123 = "설령 그런 게 있다 해도, 결국엔 헛되이 사라질 뿐이야. 그래, 바로 지금처럼."
33095-124 = "모든 것은 헛되거늘, 어째서 발버둥치는 거지? 시라스 아즈사?"
33095-125 = "사오리이이이---------!!!"
33095-132 = "아직도 달콤한 꿈에 취해있는 거라면, 내가 도와줄 수밖에 없겠지."
33095-133 = "몇번이고, 몇번이고 깨어나게 해 주마. 그 달콤한 꿈 속에서 말야."
33095-134 = "자, 와라."
33095-138 = "[ns] \"여기는…….\""
33095-139 = "……. 처음 뵙겠습니다. 선생님."
33095-140 = "저는 유리조노 세이아."
33095-141 = "이곳은 당신의 꿈 속입니다. 혹은, 저의 꿈 속일지도 모르겠네요."
33095-142 = "[s] \"세이아…….\""
33095-143 = "아아…… 어쩌면 처음 뵙는 게 아닌가요?"
33095-144 = "그럴 수도 있겠네요. 지금의 저에게 시간의 흐름은 조금 뒤섞이고 뒤엉켜 있는 상태라……."
33095-145 = "하지만 중요한 건…… 드디어 선생님, 당신과 이렇게 만나게 되었다는 것입니다."
33095-150 = "그러니 이 이야기를…… 시작해볼까요."
33095-152 = "다음화;달콤한 거짓"
