[translation]
901010400110-7 = "여기는 FOX 1. FOX 2, 목표 지역에 무사히 진입했는지."
901010400110-8 = "확인. FOX 2, 방금 포인트 알파에 진입. 현재까지 확인된 트러블은 없음. 이어서 작전을 속행할게."
901010400110-14 = "여기는 FOX 3. FOX 4와 함께 포인트 시에라에 도착. 작전 구역 시야 양호. 이쪽도 문제 없어."
901010400110-15 = "방금 FOX 2가 검문에 붙잡혔을 때는 벌써 실패했나 싶어 조마조마했지만……"
901010400110-16 = "경비의 질문을 받아치는 솜씨가 제법이던걸, FOX 2. 진짜 도시락 배달부라고 해도 믿겠어."
901010400110-18 = "후후, 지금만큼은 진짜 <FOX EATS>의 배달부라는 마음으로 작전에 임하고 있으니까."
901010400110-19 = "……그래서 FOX 1. 첫 번째 타겟은 누구야?"
901010400110-20 = "오늘의 작전 구역— 카네사키 항구에서 가장 최근에 실종된 인물은 게잡이 배에서 일하던 미야구치라는 청년이다."
901010400110-21 = "어업에 종사한지는 얼마 되지 않았지만, 돈 씀씀이가 헤프고 불평이 많아 주변 인물과 자주 다툼이 있었다는군. 소문으로는 빚도 제법 있었다고."
901010400110-22 = "빚에다가 주변 사람들과 다투기까지 했다니…… 짚이는 구석이 너무 많은 걸."
901010400110-23 = "사채는 범죄에 빠지는 지름길이니까. 그러니 다들 신용 거래를 할 때는 주의하도록 해."
901010400110-24 = "FOX 4, 들었지?"
901010400110-25 = "응……? 어째서 갑자기 지목당한 거야?"
901010400110-26 = "너, 가끔 탄약을 수령할 때 외상을 달아두잖아. 지난 번에도 외상 갚을 날짜를 깜박하고, 비싼 핸드가드를 주문했다가—"
901010400110-30 = "자, 잠깐 그게 언제적 일인데……!"
901010400110-31 = "호오, 좀 더 자세히 들을 수 있을까? FOX 3?"
901010400110-32 = "지금은 옛날 이야기를 할 때가 아니잖아? 자, 작전에 집중해야지."
901010400110-34 = "그 말이 맞아. FOX 2, 브리핑을 계속하겠다."
901010400110-36 = "……알겠어. 일단은 말이지."
901010400110-37 = "윽……"
901010400110-39 = "함께 일하던 어부들의 말에 따르면 미야구치는 1주일 전, 정박한 어선에서 내린 뒤 갑자기 모습을 감추었다고 한다."
901010400110-40 = "배에 소지품이나 옷도 그대로 둔 채 사라져서, 말 그대로 증발한 모양이야."
901010400110-41 = "저기, 배에서 내리는 걸 본 것도 함께 일하던 어부들 뿐이지?"
901010400110-42 = "맞아. 그렇기 때문에 어부들 역시 이번 실종 사건의 용의자로 보고 접근해야 해."
901010400110-43 = "최대한 의심을 사지 않도록 조심스럽게 접근하도록."
901010400110-44 = "그거라면 내 전문이지."
901010400110-45 = "그럼…… 그 어부들은 어디에 가야 만날 수 있어?"
901010400110-47 = "남쪽에 있는 3번 부두에 게잡이 배가 계류되어 있어."
901010400110-48 = "아마 이 시간대라면 그 주변에서 어구를 정리하고 있을 거야."
901010400110-49 = "좋아. 그럼 다녀올게."
