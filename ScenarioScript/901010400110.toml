901010400110-6 = ""
901010400110-7 = "This is FOX 1. FOX 2, have you successfully breached the target location?"
901010400110-8 = "Affirmative. FOX 2, here. I've entered Point Alpha. No trouble confirmed so far. Continuing with the mission."
901010400110-9 = ""
901010400110-11 = ""
901010400110-13 = ""
901010400110-14 = "FOX 3 speaking. I've arrived at Point Sierra with FOX 4. We have good visuals on the target location. No problems here, either."
901010400110-15 = "I was so worried when you got stopped at the checkpoint, FOX 2."
901010400110-16 = "You deftly handled the security guards, FOX 2. You really DO seem like a delivery worker."
901010400110-18 = "Fufu, I hope so. I want people to believe I'm really here from FOX EATS, after all."
901010400110-19 = "...FOX 1. Who's our first target?"
901010400110-20 = "Our latest missing person is one \"Miyaguchi.\" He is young, and supposedly works on a crabbing boat. He was last seen at our mission point, Kanesaki Port."
901010400110-21 = "Though he hadn't been in the fishing industry that long, he is known for his lavish spending and constant complaining. He's been in a few scraps, and rumor has it that he also has accrued some heavy debt."
901010400110-22 = "Debt and conflicts... There are so many possibilities here."
901010400110-23 = "Private loans are a shortcut to trouble. You should ALL be careful when dealing with credit transactions."
901010400110-24 = "FOX 4, do you read?"
901010400110-25 = "Huh...? Why am I being singled out?"
901010400110-26 = "Because you buy ammo on credit sometimes. Also, don't you remember that time when you forgot your payment deadline and ordered an expensive handguard...?"
901010400110-27 = ""
901010400110-29 = ""
901010400110-30 = "H-Hold on, that was forever ago!"
901010400110-31 = "I'm not familiar. Can you tell me more, FOX 3?"
901010400110-32 = "Now's not the time to reminisce! W-We should focus on the mission."
901010400110-34 = "She's right. FOX 2, I'll continue with the briefing."
901010400110-36 = "...Got it. For now."
901010400110-37 = "Ugh..."
901010400110-39 = "According to his fellow fishermen, Miyaguchi suddenly disappeared a week ago after departing a docked fishing boat."
901010400110-40 = "He seemingly evaporated into thin air, leaving his belongings and clothes behind on the ship."
901010400110-41 = "So, only the other fishermen saw him disembark, right?"
901010400110-42 = "Yes. So, remember that any fisherman you meet is a potential suspect."
901010400110-43 = "Proceed cautiously and avoid suspicion."
901010400110-44 = "My specialty!"
901010400110-45 = "So... Where can I find those fishermen?"
901010400110-47 = "There's a crabbing boat moored at pier 3. South side."
901010400110-48 = "They should be managing their fishing gear around this time. They might have space to talk."
901010400110-49 = "Okay. Then, I'm off."
