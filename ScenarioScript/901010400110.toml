[translation]
901010400110-6 = ""
901010400110-7 = "นี่คือ FOX 1 ตอนนี้ FOX 2 ถึงพื้นที่เป้าหมายโดยปลอดภัยแล้วหรือยัง?"
901010400110-8 = "FOX 2 รายงาน ตอนนี้ฉันเพิ่งเข้าสู่จุดอัลฟา จนถึงตอนนี้ ยังไม่เจอปัญหาอะไร จะขอปฏิบัติภารกิจต่อเลย"
901010400110-9 = ""
901010400110-11 = ""
901010400110-13 = ""
901010400110-14 = "FOX 3 รายงาน มาถึงจุดเซียร์ราพร้อมกับ FOX 4 แล้ว ทัศนวิสัยในพื้นที่ปฏิบัติการดี ทางนี้ก็ไม่มีปัญหา"
901010400110-15 = "เมื่อกี้ตอน FOX 2 ถูกเรียกตรวจ ฉันนึกว่าปฏิบัติการจะล้มเหลวเสียแล้ว ใจหายใจคว่ำหมดเลย..."
901010400110-16 = "แต่ก็ตอบคำถามเจ้าหน้าที่รักษาความปลอดภัยได้แนบเนียนเลยนะ FOX 2 เหมือนเป็นพนักงานส่งอาหารตัวจริงเลย"
901010400110-18 = "ฮุฮุ ก็ตอนนี้ฉันทำปฏิบัติการด้วยความรู้สึกว่าตัวเองเป็นพนักงานส่งอาหารของ <FOX EATS> จริงๆ นี่นา"
901010400110-19 = "FOX 1 แล้วตกลงว่า เป้าหมายแรกคือใครเหรอ...?"
901010400110-20 = "ผู้สูญหายรายล่าสุดในท่าเรือคาเนะซากิที่เป็นพื้นที่ปฏิบัติการในวันนี้ คือชายหนุ่มชื่อมิยากุจิ ผู้ทำงานอยู่บนเรือจับปู"
901010400110-21 = "ถึงจะทำงานประมงมาได้ไม่นาน แต่ได้ยินว่าใช้เงินสุรุ่ยสุร่าย ขี้บ่น และมีเรื่องทะเลาะกับคนรอบตัว#nอยู่บ่อยๆ ตามข่าวลือ เห็นว่าติดหนี้อยู่พอสมควรเลย"
901010400110-22 = "ทั้งเป็นหนี้ ทั้งทะเลาะกับคนรอบข้าง... มีหลายประเด็นที่ชวนให้สงสัยจริงๆ"
901010400110-23 = "เงินกู้นอกระบบมักเป็นจุดเริ่มต้นที่พาคนเข้าสู่เส้นทางอาชญากรรมอยู่แล้ว ตอนทำธุรกรรมเครดิตอะไร ทุกคนก็ระวังกันด้วยล่ะ"
901010400110-24 = "FOX 4 ได้ยินที่พูดใช่มั้ย?"
901010400110-25 = "หืม...? ทำไมจู่ๆ ฉันถึงโดนพาดพิงล่ะ?"
901010400110-26 = "ก็เธอชอบไปเบิกกระสุนแบบติดเครดิตไว้ก่อนอยู่บ่อยๆ นี่ คราวก่อนก็ลืมวันจ่ายหนี้ที่ค้างไว้ แถมยังไปสั่งแฮนด์การ์ดราคาแพงไว้อีก..."
901010400110-27 = ""
901010400110-29 = ""
901010400110-30 = "ดะ... เดี๋ยวก่อน นั่นมันเรื่องตั้งนานแล้วนะ...!"
901010400110-31 = "โอ๊ะ ฉันขอฟังรายละเอียดเพิ่มได้มั้ย FOX 3?"
901010400110-32 = "ตอนนี้ไม่ใช่เวลามานั่งขุดคุ้ยเรื่องเก่าอยู่นะ ตะ... ต้องโฟกัสกับปฏิบัติการสิ"
901010400110-34 = "เห็นด้วย FOX 2 บรีฟต่อเลย"
901010400110-36 = "ก็ได้... ตอนนี้เอาอย่างนั้นก่อนก็แล้วกัน"
901010400110-37 = "อึก..."
901010400110-39 = "จากคำบอกเล่าของชาวประมงที่ทำงานร่วมกับเขา เมื่อหนึ่งสัปดาห์ก่อน มิยากุจิหายตัวไปอย่างกะทันหันหลังจากลงจากเรือประมงที่จอดเทียบท่าอยู่"
901010400110-40 = "เขาหายตัวไปโดยทิ้งทั้งข้าวของและเสื้อผ้าไว้บนเรือ ราวกับระเหยไปอย่างนั้นละ"
901010400110-41 = "คนที่เห็นเขาลงจากเรือ ก็มีแต่ชาวประมงที่ทำงานด้วยกันเท่านั้นใช่มั้ย?"
901010400110-42 = "ใช่ งั้นพวกเราต้องเข้าหาพวกชาวประมง โดยมองว่าพวกเขาเป็นผู้ต้องสงสัยในคดีนี้ด้วยเหมือนกัน"
901010400110-43 = "แต่ก็ต้องเข้าหาอย่างระมัดระวัง อย่าให้เกิดความสงสัยอะไร"
901010400110-44 = "ถ้าเป็นเรื่องนั้นละก็ งานถนัดฉันเลย"
901010400110-45 = "ถ้างั้น... ฉันจะไปพบชาวประมงพวกนั้นได้ที่ไหนล่ะ?"
901010400110-47 = "เรือจับปูจอดเทียบท่าอยู่ที่ท่าเรือที่ 3 ทางฝั่งใต้"
901010400110-48 = "เวลานี้พวกเขาน่าจะกำลังจัดเก็บอุปกรณ์ประมงกันอยู่แถวนั้นนะ"
901010400110-49 = "เข้าใจแล้ว งั้นฉันไปก่อนนะ"
