[translation]
901010400110-6 = ""
901010400110-7 = "這裡是FOX1。#nFOX2，是否已順利進入目標區域。"
901010400110-8 = "收到。FOX2已進入Point Alpha。#n目前為止未發現任何異常狀況，FOX2將繼續執行作戰。"
901010400110-9 = ""
901010400110-11 = ""
901010400110-13 = ""
901010400110-14 = "這裡是FOX3，已與FOX4一同抵達Point Sierra。#n作戰區域視野良好，這邊也沒問題。"
901010400110-15 = "剛才FOX2被攔下來盤查的時候還以為要失敗了，害我捏了一把冷汗……"
901010400110-16 = "應付警衛盤問的手腕相當了得呢，FOX2。#n就算說你是真的便當外送員我也會相信。"
901010400110-18 = "呵呵，至少我現在是抱著自己真的是「FOX EATS」外送員的心情在執行作戰的。"
901010400110-19 = "……那麼FOX1。#n第一個目標是誰？"
901010400110-20 = "作戰區域──鐘崎港最近的失蹤人物，是個在捕蟹船上工作，名為宮口的青年。"
901010400110-21 = "雖然從事漁業沒多久，但揮金如土又愛抱怨，據說經常和周圍的人發生爭執。#n根據傳聞，他還欠了不少債。"
901010400110-22 = "不但欠了一身債又和周圍的人起爭執……值得懷疑的地方也太多了吧。"
901010400110-23 = "高利貸是通往犯罪的捷徑，所以大家在進行信用交易時都要記得多加小心哦。"
901010400110-24 = "FOX4，聽到了吧？"
901010400110-25 = "嗯……？我為什麼突然被點名啊？"
901010400110-26 = "你領彈藥的時候偶爾會賒帳吧。#n上次也是忘了還款的日期，還訂了昂貴的護木──"
901010400110-27 = ""
901010400110-29 = ""
901010400110-30 = "等，等一下！那是多久以前的事了啊……！"
901010400110-31 = "哼嗯？FOX3，能不能說得再詳細一點？"
901010400110-32 = "現在不是講陳年往事的時候吧？#n來，該專心作戰了。"
901010400110-34 = "說的沒錯。#nFOX2，我要繼續說明了。"
901010400110-36 = "……了解。#n暫時就先這樣吧。"
901010400110-37 = "唔……"
901010400110-39 = "根據曾經一起工作的漁夫們所說……#n宮口在一週前，從停泊的漁船下來之後就突然消失了蹤影。"
901010400110-40 = "個人物品和衣服都原封不動地留在船上，簡直就像人間蒸發了一樣。"
901010400110-41 = "看到他下船的也只有一起工作的那些漁夫嗎？"
901010400110-42 = "沒錯。正因如此，接觸那些漁夫時也必須將其視為這次失蹤事件的嫌疑人。"
901010400110-43 = "盡可能謹慎地調查，避免引起懷疑。"
901010400110-44 = "那可是我的專長呢。"
901010400110-45 = "那麼……要去哪裡才能見到那些漁夫？"
901010400110-47 = "南邊的3號碼頭停著一艘捕蟹船。"
901010400110-48 = "這個時間帶的話，他們大概正在那附近整理漁具。"
901010400110-49 = "好，那我去去就回。"
