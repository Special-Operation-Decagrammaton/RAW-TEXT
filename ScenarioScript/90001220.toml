[translation]
90001220-1 = "제22화;그리드 포인트"
90001220-2 = "오로라도 사라졌고, 모든 회로와 기기도 정상으로 돌아왔어요."
90001220-3 = "으음~ 뭔가 아쉽네. 멋진 광경이었는데!"
90001220-4 = "후후. 갑작스러운 오로라는 멋진 자연 현상이지만, 사실 꽤나 위험한 신호랍니다?"
90001220-5 = "기본적으로 자기장이 크게 교란되었다는 뜻이니, 특히 무선 통신과 같은 부분에서 타격을 입게 되죠."
90001220-6 = "그, 그런 거야……? 그러면 차라리 빨리 사라져서 다행인 건가……?"
90001220-7 = "자기장 교란으로 인한 무선 장애는, 보통 길어야 서너 시간이면 회복되니까. 그렇게 걱정할 필요는 없어."
90001220-8 = "회장……."
90001220-9 = "의외로 회장, 좋은 사람일지도?! 예전에는 그렇게 막무가내에다 무서웠는데!"
90001220-10 = "그, 그래……?"
90001220-11 = "모두, 앞으로 15분 정도면 수송선이 도착할 거야. 다들 마지막으로 짐을 점검해 줘."
90001220-12 = "알았어!"
90001220-16 = "회장은……."
90001220-17 = "내가 뭐라고 할 것도 없겠지. 알아서 다 해 두었을 테니까."
90001220-22 = "케이? 준비는 다 끝난 거야?"
90001220-23 = "네……. 뭐, 그렇죠. 어차피 이 몸 말고는 따로 준비할 것도 없는 처지지만요."
90001220-24 = "그렇지? 내가 만든 몸이니까, 어떤 상황에든 빠르게 대응할 수 있을 거야."
90001220-25 = "우와……. 진심으로 기뻐하면서도 그렇게 믿고 있는 표정이라, 뭐라 할 말이 없을 지경이네요……."
90001220-26 = "그보다, 리오. 저기 말이죠."
90001220-27 = "응? 왜 그래?"
90001220-28 = "그게, 그러니까. 그러니까……."
90001220-29 = "?"
90001220-30 = "[s] (흐음, 이거 어쩌면…….)"
90001220-34 = "[ns1] \"아앗! 이런 일이!\"\n[ns2] \"저쪽에 짐을 깜빡 떨어뜨린 것 같아!\"\n[ns3] \"히마리! 리오와 케이 좀 빌릴게!\""
90001220-38 = "서, 선생?"
90001220-39 = "네? 또 무슨 꿍꿍이십니까, 선생님? 그렇게 억지로 잡아끌지 말라고요! 바퀴 하나라서 중심 잡기도 힘들단 말이에요!!!"
90001220-43 = "선생님? 물건 찾기라면, 차라리……."
90001220-47 = "……리오에다가 케이까지 있으니, 걱정은 없겠죠."
90001220-48 = "네. 리오와 케이가, 말이에요."
90001220-49 = "늦으면 확실하게 모모톡을 보내 드려야 하겠지만요."
90001220-54 = "……그래서, 무슨 일인가요. 뭔 할 말이 있길래요?"
90001220-55 = "어? 선생이 떨어뜨린 짐을 찾으러 온 거 아니었어?"
90001220-56 = "그걸 진짜로 믿었던 건가요……. 안 되겠네요, 이 사람. 누가 사기 같은 거 안 당하게 옆에 붙어 있지 않으면……."
90001220-57 = "그, 그런 거구나……."
90001220-58 = "아무튼, 그래서 뭔데요? 네? 제가 리오에게…… 둘이서만 할 이야기 같은 게, 있지 않느냐고요?"
90001220-59 = "무, 무슨 소리예요! 그런 것 따위, 그런 것 따위……!"
90001220-60 = "저는, 하나도……!"
90001220-61 = "[s] \"케이 쨩은 츤데레구나~\""
90001220-62 = "무슨 말을 하는 겁니까, 이 어른이!!!"
90001220-63 = "……."
90001220-64 = "하아……. 알겠어요. 이런 거, 이야기해 두지 않으면 결국 회로에 연산 오류만 일으킬 것 같고……."
90001220-65 = "(도대체 무슨 말이길래, 이렇게까지…….)"
90001220-66 = "그, 뭐냐. 그러니까, 그게. 아, 정말. 이제 와서 이런 말 굳이 해야 하나, 하는 생각도 들기는 하는데요!"
90001220-69 = "그래도 아리스는, 케이가 이렇게 몸을 갖고 함께 할 수 있어서 좋습니다."
90001220-70 = "그렇지 않았으면…… 여기에서 이렇게, 우리가 서로를 도울 수도 없지 않았을까요?"
90001220-73 = "그, 고맙다는 말을, 하고 싶었어요."
90001220-74 = "그래. 네가 나를 미워한다고 해도, 그건 분명─"
90001220-75 = "네?"
90001220-76 = "뭐?"
90001220-77 = "아니, 거기서 왜……?"
90001220-78 = "도대체 거기에서 어째서……?"
90001220-82 = "[ns] (어디 팝콘 없나…….)"
90001220-83 = "무, 무슨 이유로 제가 당신을 미워할 거라고 생각한 건데요? 누굴 무슨 은혜도 모르는 망나니로 아는 건가요?!"
90001220-84 = "그, 그렇지만 예전부터 나를 싫어하는 사람은 많았고, 그건 아마도 나에게 뭔가 문제가 있다는 것일 테니까……!"
90001220-85 = "그럴 리 없잖아요! 저는 그저, 그러니까, 그저……!"
90001220-89 = "……고맙다는 말을, 하고 싶었어요. 이렇게, 새로운 삶을 주어서, 네."
90001220-90 = "……!"
90001220-91 = "그냥, 이러고 있다 보니. 뭐라고 해야 하나. 그."
90001220-96 = "조금이지만, 살아 있다고 느끼긴 했어요."
90001220-97 = "볼 수 있고, 움직일 수 있고, 무언가를 감지할 수 있다고요. 이런 몸이지만요."
90001220-98 = "……이런 몸이지만요. 정말이지."
90001220-100 = "혹시…… 몸 때문에 화났어?"
90001220-101 = "와…… 진짜……!"
90001220-102 = "아뇨. 제가 이해해야죠. 네. 그렇고말고요. 우리에게는 어쨌든 유전자와 기질이라는 운명이 있는 것이고……. 우리는 일생 그것에 저항하거나 순응하면서……!"
90001220-103 = "자, 잘 모르겠지만. 미안, 해……?"
90001220-108 = "[ns] \"케이 쨩. 우리 조금만 침착하자.\""
90001220-109 = "몇 번을 말해야 하는지 모르겠지만 케이 쨩 아니라고요!!!"
90001220-111 = "……"
90001220-112 = "저기…… 미안해. 케이. 나도 역시 너에게 해야 할 말이 있었어."
90001220-113 = "아마도 난 너에게…… 사과하고 싶은 것 같아."
90001220-119 = "……무엇을, 왜 사과하고 싶은 건지 물어봐도 될까요, 리오?"
90001220-120 = "그…… 역시 아리스에 대한 것, 그리고 너에 대한 것……."
90001220-121 = "나는……."
90001220-122 = "그 부분은 이제 아무래도 좋아요."
90001220-123 = "저, 정말이야?"
90001220-124 = "그래요. 아리스가 당신을 용서했으니까. 정확히는 용서조차 필요하지 않다고 선언했으니까."
90001220-125 = "거기에 이런 말 꺼낸다는 거, 서로 어색하고 힘들잖아요? 그러니까…… 됐어요. 그냥."
90001220-126 = "그냥…… 앞으로는, 우리를 조금 더 다른 방식으로 대해 줘요. 그게 전부예요."
90001220-127 = "으, 응. 알았어. 저기……."
90001220-128 = "……고마워."
90001220-129 = "아무튼, 네. 뭐. 저도 그런 말을 하고 싶었어요."
90001220-130 = "이야기해 두지 않으면, 제 속도 편하지 않을 것 같기도 했고요."
90001220-131 = "슬슬 수송선이 도착할 시간이 된 것 같으니까, 먼저 가 있도록 하죠."
90001220-136 = "리오."
90001220-137 = "응?"
90001220-138 = "삶을 주어서, 고마워요."
90001220-139 = "……!"
90001220-146 = "(케이가 바쁘게 사라졌지만, 리오는 그 자리에서 조금도 움직이지 않았다.)"
90001220-147 = "(일부러 눈을 밟는 소리를 내며, 리오의 곁으로 다가갔다.)"
90001220-151 = "선생……?"
90001220-152 = "그, 미안. 지금은 조금 이쪽을 보지 말아 줬으면 좋겠어. 그게……."
90001220-153 = "금방, 금방 원래대로 돌아갈 테니까. 그러니까 조금만……."
90001220-154 = "[s] \"손수건, 빌려줄까?\""
90001220-155 = "……!"
90001220-156 = "……."
90001220-157 = "…… 응……. 잠시만……."
90001220-159 = "(리오가 진정되기까지는, 약간의 시간이 더 필요했다.)"
90001220-163 = "고마워, 선생."
90001220-167 = "현재 우리는 순항 중입니다. 시계도 양호하고, 난류의 조짐도 없습니다."
90001220-168 = "그렇지만 한 가지 중대한 문제가 잔존하고 있습니다."
90001220-169 = "그건 무엇인가요, 토키?"
90001220-170 = "……이제부터, 어디로 가야 하는 걸까요?"
90001220-171 = "아하. 그렇군요. 그 부분은 걱정하지 않아도 좋아요. 우리의 귀여운 후배 아리스가, 방법이 있다고 했으니까요."
90001220-172 = "[s] \"어? 나는 그런 말 못 들었는데……?\""
90001220-173 = "그러실 거예요. 선생님께서 케이와 리오에게 잃어버린 물건의 '탐색'을 부탁하셨을 때, 아리스가 저에게 살짝 이야기해 주었으니까요."
90001220-175 = "뽜밤 뽜밤! 그렇습니다! 이제부터는 아리스의 턴입니다!"
90001220-176 = "그렇군요. 그렇다면 안심입니다. 함께 조종석에 앉겠습니까. 아리스?"
90001220-177 = "알겠습니다! 그러면 혹시 모르니까, 케이도 같이 가고 싶은데, 괜찮을까요. 토키?"
90001220-178 = "네. 아무 문제 없습니다. 그러면 가시죠."
90001220-186 = "[ns] \"그러면 잘 부탁할게!\""
90001220-187 = "무슨 말씀이신가요, 선생님."
90001220-188 = "[s] \"어……? 뭔가 문제 있어?\""
90001220-189 = "선생님께서도, 같이 가시는 겁니다."
90001220-190 = "[s] \"자리 모자라지 않을까……?\""
90001220-191 = "그런 건 어떻게든 되는 법입니다. 브이."
90001220-198 = "(의외로 자리 문제는 일어나지 않았고.)"
90001220-199 = "(토키가 자기 무릎 위에 앉으라는 신호를 보냈지만, 그것만은 어떻게든 달랬다…….)"
90001220-201 = "네. 이 방향입니다. 이쪽으로 쭉 가면 될 겁니다."
90001220-202 = "감사합니다. 아리스. 하지만 만에 하나를 위해, 좌표를 지정해 줄 수 있을까요?"
90001220-203 = "네? 좌표, 요……? 어어……."
90001220-204 = "그렇군요! 여기에서는 이렇게 말하면 되는 것이로군요! 진로를 북북서로 돌려주세요!"
90001220-205 = "네……?"
90001220-206 = "알겠어요, 알겠어요. 이 부분은 제가 할게요. 어디……."
90001220-211 = "됐습니다. 여기로 가면 될 거예요."
90001220-212 = "감사합니다. 케이. 그리고 역시 저의 눈은 틀리지 않았던 것 같습니다."
90001220-213 = "……또 뭐요? 토키가 그렇게 바라보면, 항상 불안한 일이 일어난단 말이죠……?"
90001220-214 = "무슨 말씀을. 저는 그저, 케이는 역시."
90001220-219 = "착하고 좋은 아이라는 사실을 말하고 싶었습니다."
90001220-220 = "절대, 절대, 절대, 절대 아니니까요?!"
90001220-221 = "[s] \"맞아. 케이 쨩은 정말 착하고 좋은 아이지.\""
90001220-223 = "선생님을 죽이고 저도 죽을 거예요–!!!"
90001220-230 = "케이? 케이?! 여기에서 그렇게 날뛰면 안 됩니다!"
90001220-231 = "그렇습니다. 케이. 조종석에서의 사소한 실수는, 그 즉시 돌이킬 수 없는 사고로 이어질 수 있으니 조심해 주십시오."
90001220-236 = "[ns] \"맞아. 케이 쨩은 착하고 좋은 아이지만, 가끔씩 날뛰는 아이지.\""
90001220-238 = "으아아아아아아아악–!!!!!"
90001220-240 = "(그렇게, 케이의 엄청나게 노려보는 눈초리를 받아내며.)"
90001220-241 = "(우리는, 목적지로 출발했다.)"
90001220-244 = "……적 일행, 항로 설정 확인. 목표는…… 그리드 포인트."
90001220-245 = "정말로, 여기까지 오신 거네요……. 어, 어떤 의미로는, 인정해 드려야 할지도……."
90001220-246 = "그래요. 다른 모든 어리석은 인간들보다는 조금 나았다는 정도로."
90001220-247 = "플랜 C…… 아니, 플랜 D까지 갈 경우, 티페레트를 강철대륙으로 후퇴시키는 방안도 고려해야 해. 그 부분은 맡기겠어. 아인."
90001220-248 = "네, 네에! 걱정하지 마세요!"
90001220-249 = "그러면, 해 봅시다. 소프의 말에 따르면."
90001220-253 = "모름지기 환영 파티는, 성대하게 해야 하는 법이라고 했죠!"
90001220-255 = "다음화;보관소"
