[translation]
34220-1 = "제22화;AGNUS DEI"
34220-2 = "……허나, 안타깝군요. 의식은, 이미 진행 중입니다."
34220-3 = "……!!"
34220-5 = "로열블러드의 신비를 착취해, 키보토스 외부에서 도래하는 힘을 빌려서, 저는 저의 존재를 격상시키고 있습니다."
34220-7 = "자아, 선생이여. 불가해의 어른이여. 나의 대적자여."
34220-8 = "당신은 어쩌면 절 오해하고 있을지도 모르겠군요."
34220-9 = "우리는 이 세계를 직시함으로써 각자가 원하는 것을 추구합니다. 당신 또한 무엇이든 될 수 있고, 무엇이든 알 수 있습니다."
34220-10 = "더 높은 존재가 되는 것. 그걸 통해 모든 것을 구하는 것이 바로 어른의 의무입니다."
34220-11 = "네, 이 의식의 목적은 바로, 키보토스 외부의 힘을 이용해서 제가 더 위대해지는 것입니다!!"
34220-12 = "더 높은 권위와 더 높은 격을 가져서, 마침내 이 세계를 구원하는 것!! 그것이야말로 어른이 도달해야 할 극의!"
34220-13 = "그 과정에 [ruby=agnus dei]작은 희생[/ruby] 같은 건 어쩔 수 없는 것이죠."
34220-14 = "말하자면……. 이 희생이야말로 궁극의 공리(功利)!!"
34220-15 = "즉, 이것이야말로 <숭고> 그 자체인 것입니다!"
34220-16 = "당신이라면 이해하고 있겠죠. 이 가치를? 모든 학생을 심판할 수도, 구할 수도 있는 절대적인 힘을 지닌 당신이라면……!!"
34220-17 = "[s] \"아니야.\""
34220-18 = "……!?"
34220-19 = "[s1] \"너희들이야말로 나를 오해하고 있어.\"\n[s2] \"나는 그렇게 대단한 사람이 아니야.\""
34220-20 = "뭐라고……?"
34220-21 = "뭐라고……?"
34220-26 = "[ns] \"나는 심판자가 아니야. 누군가를 심판할 권리는 나에게 없어.\""
34220-29 = "[ns] \"나는 구원자가 아니야. 내가 이 세계의 고통을 없앨 순 없어.\""
34220-32 = "[ns] \"나는 절대자가 아냐. 이 세상의 죄악을 없앨 수 없어.\""
34220-34 = "……!!"
34220-35 = "[s] \"나는 그렇게 대단한 존재가 아냐.\""
34220-36 = "그럼…… 그럼 당신은 뭐란 말인가요!! 너는!!"
34220-37 = "당신의 능력은, 존재 가치는 무엇이라는 겁니까!!"
34220-38 = "[s] \"나는 그냥 학생들의 선생일 뿐이야.\""
34220-39 = "……!!"
34220-41 = "[ns] \"나는 그저 잊히고 고통받는 아이들의 곁에 있으려고 할 뿐이야.\""
34220-45 = "그렇다면 그것을 증명해보도록 하세요……!!"
34220-49 = "……!!"
34220-50 = "무슨……."
34220-51 = "아, 아으으……."
34220-52 = "자아, 보이시나요! 이게 바로 저의 위대함, 저의 더 높은 가치……!!"
34220-53 = "이것이야말로 저의 진짜 모습, 진정으로 위대해진 어른의 모습입니다……!!"
34220-54 = "[s] \"그게 네 정체인가. 베아트리체.\""
34220-55 = "저게…… 진짜 마담의 정체……."
34220-56 = "그냥 괴물인데요……."
34220-57 = "그런가…… 우리는 저런 것에게…… 줄곧……."
34220-58 = "[s] \"사오리. 히요리. 미사키.\""
34220-59 = "……응."
34220-60 = "……네!"
34220-61 = "……그래."
34220-62 = "[s] \"두려워하지 마. 같이 이겨내는 거야.\""
34220-64 = "……. 그래."
34220-65 = "그럼 가자. 저 괴물을 처치하러."
34220-66 = "네!! 공주님을 구하는 거예요……!!"
34220-67 = "[ns] \"가자!!!\""
