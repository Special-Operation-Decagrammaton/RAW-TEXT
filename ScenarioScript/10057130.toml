[translation]
10057130-1 = "후일담;게헨나에 가면"
10057130-2 = "게헨나 컵 경기장"
10057130-6 = "도착."
10057130-12 = "허리 아파- 의자에 쿠션 좀 푹신하게 만들걸!"
10057130-13 = "전차가 잔뜩!! 나, 구경하고 올게!!"
10057130-16 = "야, 같이 가-!!"
10057130-21 = "키키킥……. 이 괴상하기 짝이 없는 수레는 뭐지?"
10057130-22 = "붉은겨울 녀석들이로구나. 키킥……. 게헨나 컵에 용케도 왔-"
10057130-26 = "주차요원이시군요. 잘 부탁드립니다."
10057130-30 = "???"
10057130-34 = "오오오……!"
10057130-45 = "다들, 엄청난 호적수의 예감!"
10057130-46 = "전차도 하나같이 그럴듯하고 멋있네……."
10057130-47 = "강아지호도 엄청 멋있거든! 주차 요금도 할인받았잖아!"
10057130-48 = "그건 강아지호가 작아서 그런 거고……."
10057130-51 = "와앗!! 저거!! 저거 구경하러 가자!!"
10057130-54 = "애야, 무슨? 왜 이리 신났어! 같이 가!!"
10057130-58 = "수직장갑인데도, 방어력이 높아 보여……."
10057130-61 = "……포는 88mm인가, 이 전차, 놀라워."
10057130-62 = "대단해~ 엄청 무거워 보이는데 잘 움직이려나?"
10057130-63 = "같이 셀카로 사진이라도 찍을까?"
10057130-64 = "으음- 그런데, 주인 나타나면 부끄러울 것 같은데~"
10057130-69 = "뭔가요. 당신들."
10057130-70 = "으갹!! 진짜 나타났다!!"
10057130-71 = "그럼 주인이 있겠지, 없었겠어?!"
10057130-72 = "사람을 보고 뭔 귀신이라도 본 것처럼……."
10057130-73 = "위험하니까 전차 곁에는 서지 말아요."
10057130-74 = "네, 넵!! 죄송합니다!!!"
10057130-75 = "부끄러워 죽겠어, 진짜!"
10057130-81 = "우리 전차, 다른 데 다시 대야겠다. 거기 주차 자리 없어?"
10057130-82 = "맡겨 놨더니 이상하게 주차해 놨어. 옆에도 긁혔고."
10057130-84 = "전투실로 운전석을 옮겨서 그런 건가-?"
10057130-85 = "어쩔 수 없다구. 그러고 보니 라나, 엔진이 커져서 좁고 더웠었지?"
10057130-87 = "난 좋던데. 엔진 옆에 있으면 따듯해서 잠도 잘 왔어."
10057130-88 = "운전할 때 제일 안 좋은 거 아냐?!"
10057130-90 = "흐음……."
10057130-97 = "발상이 특이한 전차……."
10057130-98 = "재미있겠군요. 당신들."
10057130-99 = "이로하 선수! 전차대회 부동의 1위로서 잠시 인터뷰 좀 부탁드립니다!"
10057130-100 = "하아…… 이래서 차 밖으로 나오기 싫었던 건데."
10057130-101 = "여기는 혼잡하니 인터뷰는 저기서 하시죠."
10057130-105 = "뭐야 저 사람? 1위라고?"
10057130-106 = "뭔가 우리를 지긋이 쳐다보고. 기분이 묘한데……."
10057130-107 = "저런 그럴듯한 전차에 비하면, 역시 강아지호는 우스운가~"
10057130-110 = "저……."
10057130-111 = "앗, 너무 화내지는 말고. 딱히 뭔가 비웃는 느낌은 아니었으니-"
10057130-116 = "전차라고 해줬어!!"
10057130-117 = "거봐! 역시 누가 봐도 전차지!! 저 사람, 보는 눈이 있네!!"
10057130-118 = "역시 난 천재야!"
10057130-119 = "아, 아하하…… 네가 행복하다니 됐다……."
