[translation]
10057130-1 = "後日談その1;ゲヘナに行くと"
10057130-2 = "ゲヘナカップ競技場"
10057130-5 = ""
10057130-6 = "到着。"
10057130-8 = ""
10057130-11 = ""
10057130-12 = "腰、痛～！椅子のクッション、もっと柔らかくしとけば良かった！"
10057130-13 = "見て、戦車がいっぱいある！私、ちょっと行ってくるわね！！"
10057130-15 = ""
10057130-16 = "待って、一緒に行こー！！"
10057130-18 = ""
10057130-20 = ""
10057130-21 = "キキキッ……。この得体のしれない車は何だ？"
10057130-22 = "レッドウィンターの奴らだな。キキッ……ゲヘナカップによくぞ来て――"
10057130-25 = ""
10057130-26 = "駐車係さんですね。よろしくお願いします。"
10057130-28 = ""
10057130-29 = ""
10057130-30 = "？？？"
10057130-33 = ""
10057130-34 = "おおー……！"
10057130-35 = ""
10057130-36 = ""
10057130-37 = ""
10057130-38 = ""
10057130-39 = ""
10057130-40 = ""
10057130-41 = ""
10057130-42 = ""
10057130-44 = ""
10057130-45 = "強敵だらけの予感がするわね……！"
10057130-46 = "どの戦車もかっこいいねぇ……。"
10057130-47 = "子犬号だって負けてないわ！通行料も割引してもらったんだから！"
10057130-48 = "それはサイズが小さいからでしょ……。"
10057130-50 = ""
10057130-51 = "ねえ！あそこ！見にいくわよ！"
10057130-53 = ""
10057130-54 = "速っ！ちょっと待ってよー！！"
10057130-56 = ""
10057130-57 = ""
10057130-58 = "垂直装甲なのに、防御力が高そう……。"
10057130-60 = ""
10057130-61 = "……砲は88ミリ。見事な戦車ね。"
10057130-62 = "すご～い。めっちゃ重そうだけど、ちゃんと動くのかな？"
10057130-63 = "一緒に写真でも撮るのはどう？ "
10057130-64 = "う～ん……でも、持ち主が出てきたらマズイからな～"
10057130-66 = ""
10057130-68 = ""
10057130-69 = "何ですか。あなた方は。"
10057130-70 = "うわあっ！！本当に出てきた！！"
10057130-71 = "そりゃいるでしょ！？"
10057130-72 = "まるで幽霊でも見たような顔ですね……。"
10057130-73 = "危ないので戦車から離れていてください。"
10057130-74 = "は、はいっ！すみません！！"
10057130-75 = "もぉ～！めっちゃ恥ずかしいんだけど！"
10057130-80 = ""
10057130-81 = "私たちの戦車、別のところに止めたほうがいいかも。"
10057130-82 = "変なところに駐車されてる。何回か車体を擦ってたし。"
10057130-84 = "操縦席を戦闘室に移したのがマズかったかなー？"
10057130-85 = "それは仕方ないでしょ。#nそうだラナ、エンジンが大きくなったから……操縦席、狭くて暑かったでしょ？"
10057130-87 = "ううん。ちょうど良かったよ。暖かくて、よく眠れた。"
10057130-88 = "それ、運転の時に一番ダメなやつじゃない！？"
10057130-89 = ""
10057130-90 = "ふむ……。"
10057130-92 = ""
10057130-93 = ""
10057130-94 = ""
10057130-95 = ""
10057130-96 = ""
10057130-97 = "奇抜な発想の戦車……。"
10057130-98 = "あなた方、面白いですね。"
10057130-99 = "イロハ選手！本大会の絶対王者として、コメントをお願いします！"
10057130-100 = "はあ……これだから外に出たくなかったんです。"
10057130-101 = "ここは人が多いので、あちらに移動しましょう。"
10057130-103 = ""
10057130-104 = ""
10057130-105 = "え？あの人、絶対王者だったの？"
10057130-106 = "じっとこっちを見てくるから、何かと思ってたけど……。"
10057130-107 = "あんな立派な戦車に比べたら、こっちのはヘンテコだと思うよね～"
10057130-108 = ""
10057130-109 = ""
10057130-110 = "せ……。"
10057130-111 = "あっ、怒らないで。バカにしてる感じはしなかったし――"
10057130-113 = ""
10057130-114 = ""
10057130-116 = "戦車って言ってくれた！！"
10057130-117 = "ほら！やっぱり誰がどう見ても戦車よ！！あの人、見る目あるわね！！"
10057130-118 = "私って、ほんとに天才！"
10057130-119 = "あ、あはは……。アンナが嬉しそうで何よりだよ……。"
