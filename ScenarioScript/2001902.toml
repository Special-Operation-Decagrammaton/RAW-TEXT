[translation]
2001902-1 = "Case 1. 토끼랍니다?"
2001902-2 = "(조심스럽게 방문을 노크했다.)"
2001902-11 = "아, 주인님!"
2001902-12 = "뿅뿅."
2001902-19 = "(피로가 많이 쌓인 모양이다. 헛것이 보인다.)"
2001902-23 = "(눈을 비비고, 심호흡을 하고, 다시 방문을 노크했다.)"
2001902-29 = "왜 그러세요, 주인님?"
2001902-30 = "뿅뿅!"
2001902-37 = "(아직도 헛것이 보인다. 오늘은 푹 자도록 하자.)"
2001902-40 = "(그렇게 생각한 순간.)"
2001902-41 = "어서 오세요. 쭉 기다리고 있었다구요?"
2001902-45 = "[ns] \"……음, 아카네?\""
2001902-46 = "네, 저랍니다. 주인님의 영원한 메이드. 아카네예요."
2001902-47 = "뿅뿅!"
2001902-48 = "[s] \"뿅뿅…?\""
2001902-49 = "네. 토끼니까요."
2001902-50 = "그런데 표정이 왜 그러시죠?"
2001902-51 = "매우 당황한 듯한…, 뜻밖의 무언가를 보았다는 듯한……"
2001902-52 = "혹시 안 좋은 일이라도 있으셨나요?"
2001902-53 = "아니, 샬레의 업무량이 너무 많기 때문이군요."
2001902-54 = "주인님, 안심하세요. 오늘은 제가 한층 더 봉사해 드리도록 하겠습니다."
2001902-55 = "[s1] \"그게, 그러니까…… 그 복장 말인데.\"\n[s2] \"바니걸……?\""
2001902-56 = "전에 말씀드렸죠. 메이드는 봉사하는 자. 메이드복은 봉사하는 자의 의복이자 전투복."
2001902-57 = "전에 말씀드렸죠. 메이드는 봉사하는 자. 메이드복은 봉사하는 자의 의복이자 전투복."
2001902-58 = "그리고 바니걸도 봉사를 위해 만들어진 옷이죠."
2001902-59 = "봉사야말로 메이드의 사명."
2001902-60 = "그렇다면 바니걸도 메이드와 같지 않나요?"
2001902-61 = "확실히 조금 색다른 복장일지도 모릅니다만……"
2001902-62 = "그러니 오늘은 이 모습으로 선생님께 봉사해 드리겠어요."
2001902-63 = "[s3] \"영문을 모르겠어……\"\n[s4] \"제가 죽습니다…… 사회적으로……\""
2001902-64 = "괜찮아요. 걱정하지 마세요."
2001902-65 = "괜찮아요. 걱정하지 마세요."
2001902-66 = "자, 어떤 봉사가 필요하신가요?"
2001902-67 = "청소? 세탁? 요리? 호위?"
2001902-73 = "아니면 다른 의미의 청소?"
2001902-74 = "저는 언제나 모든 일에 준비되어 있답니다."
2001902-75 = "[s] \"미안, 아카네! 급한 일이 생각나서!\""
2001902-76 = "어머, 주인님?"
2001902-77 = "무슨 일이실까요. 갑자기 급한 일이라니…."
2001902-78 = "샬레의 업무란, 정말 힘든 일이군요…."
2001902-79 = "역시 제가 좀 더 봉사해드려야겠어요."
2001902-90 = "기다리세요, 주인님?"
