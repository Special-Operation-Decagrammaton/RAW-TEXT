[translation]
1004402-1 = "가끔은 이런 날도"
1004402-2 = "(로비 앞에 도착하니 노노미가 손을 흔들며 기다리고 있었다.)"
1004402-7 = "아, 선생님! 여기예요, 여기!"
1004402-8 = "기다리고 있었다구요~."
1004402-9 = "[s1] \"노노미……? 그 짐들은 대체……\"\n[s2] \"뭘 그렇게 많이 싼 거야?\""
1004402-12 = "아~. 이거요?"
1004402-13 = "후후. 그다지 대단한 건 아닌데……."
1004402-14 = "물색한 자리가 정말로 잘 어울리는지 확인하려면, 실제로 자리를 펴 보는 수밖에 없잖아요?"
1004402-15 = "그래서 간단하게 좀 챙겨봤어요."
1004402-19 = "파라솔이랑, 돗자리랑, 먹을 것들이랑 의자도……."
1004402-23 = "주스도 몇 가지나 챙겼다고요!"
1004402-24 = "오렌지 주스랑 사과 주스, 포도 주스 이렇게 세 가지를……."
1004402-25 = "……네? 너무 많은 거 같으니 같이 들자고요?"
1004402-26 = "후후. 선생님이라면 그렇게 말씀해주실 것 같았죠."
1004402-27 = "하지만 괜찮아요!"
1004402-28 = "마음은 감사하지만, 이건 처음부터 제가 부탁드린 일이고……."
1004402-34 = "게다가 이미 한 번에 들 수 있도록 잘 싸 두었으니, 다시 여는 게 더 일이거든요. 같이 가 주시는 거만 해도 감사하죠!"
1004402-35 = "[s3] \"……뭐, 그렇게까지 말한다면.\"\n[s4] \"무거우면 언제든 말해줘. 들어줄게.\""
1004402-39 = "후훗. 그럼 출발~☆"
1004402-46 = "우와……. 어딜 가든 풍경이 좋아서, 오히려 고르는 게 힘들어요!"
1004402-50 = "이쯤이면 좋을까요?"
1004402-51 = "너무 멀지도 않고……."
1004402-52 = "자리도 넓고, 바람도 선선하게 잘 부네요!"
1004402-53 = "그럼 우선 짐을 풀고……."
1004402-57 = "……음? 선생님? 왜 그러세요?"
1004402-58 = "……네?"
1004402-59 = "갑자기 파인애플 주스가 마시고 싶으시다고요? 그야 짐만 풀면 금방……."
1004402-63 = "……어라?"
1004402-67 = "아하하하……. 죄송해요, 선생님. 파인애플 주스는 안 가져왔네요. 홀에는 있을 텐데……."
1004402-68 = "조금만 기다려주세요☆"
1004402-69 = "금방 가져올게요~"
1004402-73 = "다녀오겠습니다~!"
1004402-77 = "[ns5] \"……그럼 시작해 볼까.\"\n[ns6] 짐들을 풀기 시작한다."
1004402-85 = "다녀왔어요~! 선생님!"
1004402-86 = "주문하신 파인애플 주스 나왔습니다~!"
1004402-90 = "……어라?"
1004402-91 = "……어? 선생님……? 이건 대체……."
1004402-92 = "[s7] \"기다리는 동안 내가 자리 만들어 놨어.\"\n[s8] \"그렇게 나쁜 솜씨는 아니지?\""
1004402-97 = "……아하."
1004402-98 = "그럼 이 파인애플 주스도……."
1004402-99 = "음음. 역시 그런 의미였군요? 그래서 미리 괜찮다고 말씀드렸는데……."
1004402-100 = "아무래도 신경이 쓰이셨던 걸까요……. 오히려 폐를 끼친 느낌이……."
1004402-101 = "그렇지 않다고요?"
1004402-102 = "하지만 저 때문에 또 수고를 들이셨는데……."
1004402-106 = "이거, 보기에는 이래도 꽤 일이라고요? 자리 펴고, 파라솔 세우고, 의자 펼치고 하는 것들."
1004402-107 = "[s9] \"노노미는 늘 주변을 배려하니까.\"\n[s10] \"이런 때라도 배려받는 게 좋지 않을까 해서.\""
1004402-112 = "……선생님……."
1004402-113 = "……후훗."
1004402-114 = "정말 괜찮으시겠어요? 지금 하신 말씀, 꽤 엄청난 이야기가 될 거라고요?"
1004402-115 = "자꾸 그러시면 저도 모르게 어리광을 피우게 될 거 같은데……."
1004402-116 = "제 어리광은, 생각보다 꽤 버거우실 수도 있다구요?"
1004402-117 = "[s11] \"물론이지. 괜찮아.\"\n[s12] \"아, 바라던 바지. 덤벼!\""
1004402-118 = "후후후후……."
1004402-119 = "후후후후……."
1004402-120 = "벌써 신이 나네요."
1004402-121 = "음……."
1004402-122 = "하지만 오늘은 여기까지만 할게요."
1004402-123 = "선생님의 말씀은 너무나도 감사하지만……."
1004402-124 = "소중한 건 쉽게 쓰면 소중한 느낌이 없어지니까요. 좀 더 중요할 때에, 부리도록 할게요."
1004402-125 = "그럼 그때에는……."
1004402-131 = "거절하시면 안 돼요. 아시겠죠?"
