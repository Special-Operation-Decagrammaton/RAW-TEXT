[translation]
80000061-1 = "가장 좋은 순간"
80000061-7 = "(게헨나 선도부실 문을 열고 들어가자, 테이블 뒤에 앉아서 기다리던 치나츠가 보였다.)"
80000061-8 = "……아. 오셨군요, 선생님. 초대에 응해 주셔서 감사합니다."
80000061-9 = "다른 분들은 없습니다. 잠시간은……. 저 혼자 여기를 지키게 되었어요."
80000061-11 = "……잠깐만요."
80000061-12 = "따, 딱히 그런 이유로 지금 시간대를 골라서 선생님을 초대한 건 아니니까요. 절대로……."
80000061-13 = "……사실 절대까지는 아니지만……."
80000061-14 = "아무튼 오늘 선생님을 초대한 이유는 이것입니다."
80000061-20 = "[ns1] \"……초콜릿?\"\n[ns2] \"포츈 쿠키?\""
80000061-21 = "그냥 초콜릿이 아닙니다. 포츈 초콜릿이에요."
80000061-22 = "쿠키가 아닙니다. 초콜릿이에요."
80000061-23 = "……네?"
80000061-24 = "굳이 이런 초콜릿을 고른 이유가 있냐고요? 그건……."
80000061-25 = "아, 아무래도……. 날이 날이니만큼, 오히려 말로 설명하기 힘든 것들이 있어서 그랬습니다."
80000061-26 = "순수하게 감사를 표하는 것도, 호의를 전달하려는 것도."
80000061-27 = "오늘은 발렌타인 데이라서 오히려 그 의미가 확대 해석될 여지들이 있는 관계로……."
80000061-28 = "아, 아니. 절대로 싫다거나 그런 것은 아닙니다. 애초에 그렇다면 챙기지도 않았겠죠. 그렇지만……."
80000061-29 = "……."
80000061-30 = "여, 역시……. 됐습니다. 그냥 이걸로 대신해 주세요. 부탁드리겠습니다……."
80000061-31 = "[s3] \"고마워. 잘 먹을게.\"\n[s4] 포츈 쿠키 하나를 가른다."
80000061-40 = "뭐라고 나왔나요……? 저도 한 번 확인을……."
80000061-44 = "……흠흠. 과연, 그렇군요."
80000061-45 = "'The time to be happy is now. The place to be happy is here.'#n……."
80000061-46 = "좋은 말이네요. 가장 좋은 때는 지금이다. 가장 좋은 곳은 바로 이곳이다."
80000061-47 = "어쩌면 이걸 지금 뽑게 되신 것도……. 지금 저희에게 있어서 의미하는 바가 큰 것일……."
80000061-48 = "[s5] \"다른 것들은 뭐가 있어?\"\n[s6] \"나머지도 확인해 봐도 돼?\""
80000061-49 = "……네, 네!? 나, 나머지요? 그, 그건……. 그게 말이죠……."
80000061-50 = "……네, 네!? 나, 나머지요? 그, 그건……. 그게 말이죠……."
80000061-51 = "서, 선생님!? 잠깐만요, 선생님! 거기서 더 확인하시면 곤란한데요……!?"
80000061-55 = "[ns7] \"The time to be happy is now. The place to be happy is here…….\"\n[ns8] \"……응? 똑같은 내용이……?\""
80000061-56 = "그, 그건……. 그게……. 그……."
80000061-57 = "그, 그건……. 그게……. 그……."
80000061-62 = "그, 그러니까! 더 이상 확인하면 안 된다고요……! 그, 그건……!"
80000061-63 = "네, 네? 왜 들어 있는 문구들이 다 똑같냐고요? 그, 그건……."
80000061-64 = "[s9] \"전부 똑같은 내용이다…….\"\n[s10] \"치나츠. 혹시 처음부터 그냥 이 말을 하려고…….\""
80000061-65 = "……."
80000061-66 = "……."
80000061-70 = "……크흑!!"
80000061-75 = "[ns] \"……치나츠!?\""
80000061-77 = "(이후 어렵사리 치나츠를 따라잡아 저녁 내내 달래주었다.)"
