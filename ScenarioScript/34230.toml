[translation]
34230-1 = "제23화;소녀들을 위한 키리에 1"
34230-12 = "하아…… 하아……."
34230-13 = "하아…… 아파…… 힘들어…… 상처가……."
34230-18 = "그치만…… 아직은 아니야."
34230-30 = "……."
34230-34 = "여기는…… 성가대실……?"
34230-38 = "파이프오르간이랑…… 악보들……"
34230-42 = "축음기도 있네……. 하하, 그렇구나. 응, 생각해보면 아리우스도 우리와 같은 채플 수업을 했을 거니까."
34230-47 = "……축음기도 작동을 안 하네. 하긴. 안 쓴 지 엄청 오래되어 보이니까."
34230-48 = "……."
34230-56 = "하아……."
34230-57 = "코하루 쨩, 선생님이 등장해서 구해주었을 때…… 멋있었지?"
34230-58 = "응. 그때만큼은 코하루 쨩도 이야기 속의 공주님 같았어. 나도 좋아해. 그런 이야기."
34230-59 = "화려하게 주인공이 등장해서 시련에 빠진 공주님을 구해주는 그런 이야기."
34230-60 = "유치하지만 멋지고 가슴 두근거리는 이야기……."
34230-61 = "……나도 그런 이야기의 주인공이 되고 싶었어."
34230-62 = "그치만 알고 있어. 나에겐 그런 자격 따위 없다는걸."
34230-63 = "이 세상 그 어디에도, <마녀>가 해피엔딩을 맞이하는 이야기는 없으니까."
34230-64 = "……사오리. 나는 내가 받은 고통만큼 너희도 고통받기를 원했어. 그게 공평한 거라고 생각했으니까."
34230-65 = "하지만…… 동시에……."
34230-66 = "내가 그랬던 것만큼, 너희도 구원받고 싶었겠지."
34230-67 = "너희도 행복해지고 싶었을 거야. 내가 바랐던 것만큼."
34230-68 = "사오리, 너가 아츠코에게 집착하는 이유도 알고 있어……."
34230-69 = "수많은 사람을 속이고 절망에 빠트려 온 너라도…… 최후의 최후에는 누군가를 구원할 수 있다면……."
34230-70 = "고통밖에 없는 네 비참한 삶도 그걸로 구원받을 수 있으면 좋겠다는…… 그런 바람이 있었던 거잖아."
34230-71 = "알고 있어. 나도 세이아 쨩이 그랬으니까."
34230-76 = "응. 그러니까…… 아리우스 스쿼드."
34230-80 = "……너희를 위해 기도할게."
34230-81 = "내 고통이 없어지길 바랐던 것만큼,"
34230-82 = "너희의 고통이 없어지기를 바랄게."
34230-83 = "내가 두 번째 기회를 갈망했던 것만큼……"
34230-84 = "너희에게 다음 기회가 있기를 바랄게."
34230-85 = "내가 용서받길 갈망했던 것만큼……"
34230-86 = "……그러니까 너희를 용서할게."
34230-87 = "그게 <공평>한 것보다…… 더 좋은 결말인 것 같아."
34230-97 = "아츠코를 구해낸다고 해도, 너희들의 미래가 행복하진 않을 거야."
34230-98 = "평생 쫓기겠지. 뒷골목의 지저분한 곳을 떠돌면서 춥고, 배고프고, 비참한 삶을 이어나가겠지."
34230-99 = "하지만 그럼에도…… 그럼에도……"
34230-100 = "너희들의 앞날에 행복이 있을지도 모른다고 믿는다면……."
34230-101 = "아츠코를 구하는 걸로 너희를 구하도록 해."
34230-102 = "나는 이미 늦었지만…… 너희는 아직 늦지 않았잖아?"
34230-103 = "선생님이 도와줄 거니까. 응. 분명히."
34230-104 = "응. 그러니까……."
34230-106 = "너희는 마침내 행복해지기를……."
34230-111 = "……응?"
34230-116 = "하하, 뭐야? 고장난 거 아니었어?"
34230-120 = "……응. 그러네. 이건…… 자비를 구하는 노래……."
34230-121 = "딱히 이 노래를 좋아한 적은 없었지만…… 그러네. 응."
34230-122 = "그러네……."
34230-137 = "어딜 그렇게 바쁘게 가는 거야, 응? 동창회라도 있어?"
34230-138 = "너희는 지나갈 수 없어. 이 너머에 있는 건 구원을 위해 싸우는 주인공들의 무대."
34230-139 = "우리 같은 악당들은 입장이 허락되지 않았어."
34230-140 = "자아, 선생님, 그 아이들을 구해줘."
34230-144 = "여기는 내가 어떻게든 막고 있을 테니까."
34230-153 = "― [i]Kyrie[/i]"
34230-155 = "[i]Eleison[/i]"
34230-168 = "다음화;소녀들을 위한 키리에 2"
