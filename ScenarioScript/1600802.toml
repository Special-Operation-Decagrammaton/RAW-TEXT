[translation]
1600802-1 = "게으른 경찰의 발명품"
1600802-2 = "(후부키가 보낸 모모톡이 신경 쓰여 생활안전국을 찾아왔다.)"
1600802-4 = "발키리 경찰학교, 생활안전국 사무실"
1600802-6 = "으헤, 으헤헤……."
1600802-7 = "……이렇게 많은 도넛을 받아도 괜찮은 거야……?"
1600802-8 = "역시…… 생활안전국은 최고야……."
1600802-9 = "[s] 후부키를 흔들어 깨운다."
1600802-10 = "으응……?"
1600802-11 = "뭐야, 샬레의 선생이잖아."
1600802-12 = "모처럼 맛있게 낮잠을 자고 있었는데, 방해하기는. 칫……."
1600802-17 = "갑자기 생활안전국에는 무슨 일이야?"
1600802-18 = "혹에라도 귀찮은 일을 가져온 거라면 키리노나 다른 학생을 찾아봐. 나는 낮잠을 자느라 바쁘니까."
1600802-19 = "[s1] \"근무 시간에 낮잠이라니…….\"\n[s2] \"그럼 방금 보낸 모모톡은 뭐였어?\""
1600802-20 = "방금 보낸 모모톡? 나는 아까 전부터 계속 낮잠을 자고 있었는데."
1600802-21 = "방금 보낸 모모톡? 나는 아까 전부터 계속 낮잠을 자고 있었는데."
1600802-22 = "혹시……?"
1600802-28 = "……아아, 매크로가 오작동을 한 모양이네."
1600802-29 = "미안, 미안. 경비국에 가야 할 정시 보고 메시지가 실수로 선생에게도 보내진 모양이야. 내게는 아무 문제도 없었으니까 신경 쓰지 마."
1600802-30 = "[s] \"매크로……?\""
1600802-31 = "응, 밀레니엄에서 구입한 매크로 프로그램을 조금 손봐서 나 대신 일을 해 줄 자동 응답기를 만들어 놓았거든."
1600802-32 = "이 자동 응답기만 켜 놓으면 생활안전국에 들어오는 여러 가지 민원을 자동으로 처리할 수 있다고."
1600802-33 = "예를 들자면……."
1600802-37 = "<후부키, 내일 오전에 있는 정례 회의 기억하고 있지? 늦으면 안 돼!>"
1600802-38 = "<응, 알고 있으니까 걱정하지 마.>"
1600802-39 = "<후부키, 지난주 순찰 기록부 봤어? 보고서를 작성해야 하는 데 안 보여.>"
1600802-40 = "<그건 나도 잘 모르겠는데…… 한 번 경비국에 문의해 보는 게 어때?>"
1600802-41 = "……이런 식으로 말이지!"
1600802-42 = "비록 조악한 알고리즘으로 이루어져 있지만, 이 정도의 수준으로도 어지간한 업무는 티 나지 않게 다른 부서에 떠넘길 수 있어."
1600802-43 = "그럼 나는 그 사이에 좀 더 생산적인 일을 할 수 있는 거지."
1600802-44 = "낮잠을 잔다든가, 간식을 먹는다든가……."
1600802-45 = "[s3] \"……이런 걸 사용해도 괜찮은 거야?\"\n[s4] \"정말로 큰일이 들어오면 어떻게 해?\""
1600802-46 = "걱정 마, 걱정 마. 애초에 생활안전국에는 큰일이 거의 들어오지 않으니까."
1600802-47 = "걱정 마, 걱정 마. 애초에 생활안전국에는 큰일이 거의 들어오지 않으니까."
1600802-48 = "앵무새처럼 같은 대답을 반복해야 하는 귀찮은 민원만 잔뜩 있을 뿐이지."
1600802-49 = "그리고 설령 매크로로 감당할 수 없는 큰일이 들어온다 하더라도 키리노가 호들갑을 떨며 알아서 처리해 줄 테니까— 내가 나설 필요는 없어."
1600802-50 = "[s] \"하지만……\""
1600802-51 = "하암……. 중간에 낮잠을 자다 깨어나서 그런가. 엄청나게 피곤하네……."
1600802-52 = "선생, 나는 다시 자러 갈 테니까, 그동안 매크로가 잘 돌아가는지 지켜봐 줘."
1600802-53 = "그럼 나중에 봐~"
1600802-58 = "(……잠시 후.)"
1600802-63 = "후부키, 근무는 잘 서고 있지? 여기는 경비국인데……."
1600802-64 = "<응, 알고 있으니까 걱정하지 마.>"
1600802-65 = "<나는 언제나 열심히 일하고 있으니까.>"
1600802-66 = "……어쩐지 말투가 불손한데."
1600802-67 = "게다가 네가 언제 열심히 일했다고 그런 소리를 하는 거야?"
1600802-68 = "<그건 나도 잘 모르겠는데…….>"
1600802-69 = "네 게으름을 네가 모르면 누가 안다는 거야!"
1600802-70 = "……아니다. 생활안전국에 진지하게 화를 내봐야 내 손해지."
1600802-71 = "연락한 건 다름이 아니라. 저번에 생활안전국에서 빌려 간 바리케이드는 언제 반납할 거야?"
1600802-72 = "반납이 오랫동안 지연되어서 경비국의 학생들이 곤란해하고 있다고."
1600802-73 = "<한 번 경비국에 문의해 보는 게 어때?>"
1600802-74 = "……뭐? 너 잠꼬대하고 있냐? 여기가 경비국이라니까!"
1600802-75 = "그것도 아니라면 우리를 바보로 여기고 있는 거야?"
1600802-76 = "<응, 나도 그렇게 생각해.>"
1600802-80 = "…………."
1600802-81 = "……이 건은 두고 볼 수 없겠군."
1600802-82 = "후부키, 지금 바로 생활안전국 사무실로 갈 테니 거기서 꼼짝 말고 기다리고 있어!"
1600802-86 = "……으응? 갑자기 뭔가 큰 소리가 났는데."
1600802-87 = "선생, 내가 자는 동안 무슨 일이라도 있었어?"
1600802-88 = "[s5] 후부키의 시선을 피한다.\n[s6] \"역시 자기의 일은 자기가 하는 게 좋겠어.\""
1600802-89 = "왜, 왜 그러는 거야? 진짜 내가 자는 동안 큰일이라도 생긴 거야?"
1600802-90 = "왜, 왜 그러는 거야? 진짜 내가 자는 동안 큰일이라도 생긴 거야?"
1600802-91 = "대답해 줘, 선생!"
1600802-93 = "(이후 후부키는 생활안전국에 찾아온 경비국 간부에게 크게 혼난 뒤, 대량의 시말서를 쓰게 되었다…….)"
