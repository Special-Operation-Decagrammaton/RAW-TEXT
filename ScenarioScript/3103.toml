[translation]
3103-1 = "가치의 증명 3"
3103-4 = "밀레니엄 공업 실습실"
3103-9 = "드디어 완성했어……."
3103-13 = "히마리 부장이 설계한 대로의 완벽한 <예언의 기록>이야!"
3103-14 = "완성입니다~"
3103-15 = "으윽…… 생각했던 것보다 훨씬 오래 걸렸어."
3103-16 = "역시 엔지니어링이란 간단한 일이 아니네."
3103-17 = "노아가 도와주지 않았더라면 아직도 완성은커녕 조립할 엄두도 내지 못하고 있었을 거야. 도와줘서 고마워."
3103-18 = "아뇨. 감사해하실 필요는 없답니다."
3103-19 = "이렇게 재미있어 보이는 일……"
3103-20 = "아니, 실례."
3103-21 = "세미나의 임원 된 사람으로서 밀레니엄의 기술과 가능성을 시험하는 일에는 적극 협조하는 게 당연하지요."
3103-22 = "노아도 참…… 이런 데서는 쓸데없이 성실하다니까."
3103-27 = "여하튼 그럼 바로 작동시켜 볼까?"
3103-32 = "<대규모 환경 변인 수집 분석 장치— A.K.A. '예언의 기록'을 실행시켜 주셔서 감사합니다.>"
3103-33 = "<예언의 기록은 수집한 데이터를 바탕으로 미래의 변화를 계산하여 실현 가능성이 가장 높은 결과를 예지해 드립니다.>"
3103-34 = "<알고 싶은 미래의 정보에 대해 무엇이든 물어보세요!>"
3103-35 = "정말로 작동하고 있어…… 이게 바로 히마리 부장이 설계한 예언의 기록……!"
3103-36 = "그, 그보다 알고 싶은 미래의 정보라니. 어떤 질문부터 던져야 하지?"
3103-37 = "현재까지 밝혀진 양자역학의 해석에 의하면 관측만으로도 미래가 바뀔 수 있으니까 질문은 신중하게 골라야 해."
3103-38 = "지금 당장 떠오르는 질문만 해도 서른네 개 정도 있지만……."
3103-39 = "앞으로 선생님과의 관계가 어떻게 될 지라든가— 말이죠?"
3103-43 = "그, 그런 사적인 질문을 이런 데 물어볼 수 있을 리가 없잖아?!!"
3103-44 = "모처럼 거금을 들여 만든 귀중한 장치니 좀 더 공적이고 의미 있는 일에 사용해야지!"
3103-45 = "선생님과 미래의 관계가 신경 쓰인다는 사실 자체는 부인하지 않으시네요. 후후."
3103-46 = "정말 너………"
3103-47 = "여하튼 제작에 들어간 비용을 우선 회수해야지. 예측으로 큰돈을 벌 수 있을 만한 정보라면……"
3103-48 = "저기, 앞으로 한 달간 희소 금속의 가격이 어떻게 변화할지 예측해줘."
3103-52 = "<……확인했습니다.>"
3103-53 = "<분석에 앞서 당신의 생년월일을 기계에 입력해 주세요.>"
3103-54 = "어라? 시장 상황의 예지에 사용자의 생년월일이 필요한 로직이 포함되어 있었던가?"
3103-55 = "뭐, 아무래도 상관없지만. ……3월 14일."
3103-60 = "<미래를 연산하고 있습니다. 잠시만 기다려주십시오……>"
3103-64 = "<……연산이 끝났습니다.>"
3103-71 = "<축하합니다! 물고기자리인 당신! 이번 달의 운세는 운수대통이네요!>"
3103-72 = "<수호 행성이 좋은 물의 기운을 받아 벌여 놓은 일이 막힘없이 해결되고, 많은 보상이 뒤따르는 달이 될 예정입니다.>"
3103-73 = "<이번 달의 행운 아이템은 튼튼한 티타늄! 가지고 다니면 좋은 일이 생길지도……?>"
3103-77 = "응……?"
3103-78 = "어머나……"
3103-79 = "……이게 끝?"
3103-81 = "아니, 정말 이게 끝이라고?!"
3103-84 = "치 쨩. 여기에 두었던 책, 못 보셨나요?"
3103-85 = "모니터 옆에 있던 그 두꺼운 천문학 책 말이야?"
3103-86 = "일주일 넘게 그 자리에 계속 방치되어 있었고, 반납 기한도 얼마 남지도 않은 것 같아서 내가 대신 도서관에 반납했는데. 왜?"
3103-87 = "……이런, 큰일이네요."
3103-88 = "그 책에 무슨 문제라도 있어?"
3103-89 = "그게 사실은……"
3103-90 = "제가 새로 설계한 최첨단 전산 장치, <예언의 기록>의 설계도를 그 책에 끼워 놓았었거든요."
3103-91 = "물론 시험 삼아 설계해 본 물건인지라, 없어졌다고 해서 특별히 곤란한 것은 아니지만……"
3103-92 = "예언의 기록은 미래를 엿볼 수 있는 위험한 힘을 지닌 발명품. 부디 나쁜 사람의 손에 들어가지 않아야 할 텐데…… 큰일이네요."
3103-93 = "<예언의 기록> 이라면……"
3103-94 = "전에 말했던 그 '별자리 점치는 기계'?"
3103-95 = "별자리 점치는 기계라니요. 예언의 기록은 과학적인 빅 데이터에 의거하여 미래의 가능성을 연산하는 최첨단의 전산 장치거든요?"
3103-96 = "제 위대한 발명품에 그런 촌스러운 이름을 붙이지 말아 주세요."
3103-97 = "하지만 하늘의 별이 같은 위치에 있을 때 태어난 사람들은 같은 운명을 공유한다니……"
3103-98 = "너무 비과학적인 추론 아니야?"
3103-99 = "점성술을 우습게 여기면 안 돼요, 치 쨩."
3103-100 = "점성술이란 고대의 천문학자들이 세대에 걸쳐 황도 12궁의 흐름과 인간의 생애를 관측하며 쌓아온 빅 데이터……"
3103-101 = "논리적으로 설명할 수 없어도 통계가 나타내는 경향성이란 무시할 수 없는 근거가 되지요."
3103-105 = "……무엇보다 제가 속해 있는 뱀주인자리의 수호 행성이 제게 직접 그렇게 속삭이고 있으니까요!"
3103-111 = "……저기, 히마리."
3103-112 = "뱀주인자리는 황도 12궁에 포함되지 않아."
3103-116 = "……네, 네에?! 어느새 바뀐 건가요?!"
3103-118 = "그러니까 이 <예언의 기록>이…… 사실은 미래를 예지하는 궁극의 전산 장치가 아니라……"
3103-119 = "단순한 별자리 점치는 기계였다고?!"
3103-120 = "아니야…… 그럴 리가 없어. 히마리 부장의 발명품이 이런 쓸모없는 괴작일리가……"
3103-121 = "우리가 제작 과정 중에 뭔가 놓친 게 아닐까?"
3103-122 = "청사진과 완성품을 비교했을 때 놓친 점은 없는 것 같은데요."
3103-123 = "게다가 최근 도서관의 대출 기록을 보면, 히마리 부장은 최근 점성술에 흥미가 생겼는지 별자리 점에 관련된 책만 잔뜩 빌려 갔었으니……"
3103-124 = "이 설계도는 아마 부장이 취미 삼아 가볍게 만들어본 장난감이 아닐까요?"
3103-125 = "장난감…… 장난감에 동아리 분기 예산에 가까운 돈을…… 나는 무얼 위해서……"
3103-126 = "잠깐, 그보다 방금 그 말은……"
3103-127 = "노아. 너 혹시 처음부터 이 <예언의 기록>이 점 치는 기계일지도 모른다는 사실을 알고 있었던 거야?!"
3103-128 = "확신이 든 건 아니었지만, 조금은요."
3103-129 = "그럼 어째서 진작 그 사실을 말해주지 않은 거야?"
3103-130 = "그야……"
3103-131 = "……안 물어봤으니까?"
3103-136 = "……노아, 정말 너어어어!!"
3103-138 = "(이후, 유우카는 <예언의 기록>을 제조하는 데 들어간 비용을 떠안게 되었지만……)"
3103-139 = "(다행히도 선물 거래로 구입한 티타늄의 가격이 폭등한 덕분에 원금은 회수할 수 있었다고 한다.)"
3103-140 = "가치의 증명"
