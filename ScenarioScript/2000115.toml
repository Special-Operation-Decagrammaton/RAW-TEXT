[translation]
2000115-1 = "メイドの象徴"
2000115-6 = "（しばらくするとカリンがやってきた）"
2000115-11 = "まずは装備の点検をしよう。"
2000115-15 = "（カリンが色んな掃除用具を取り出した）"
2000115-16 = "（モップに雑巾、スポンジ、ブラシ、クリーナー、洗剤、などなど……）"
2000115-17 = "[ns1] \"本格的だね。\"\n[ns2] \"モップがけとゴミ出しでいいかなって思ってた……。\""
2000115-20 = "やるからには徹底的に。"
2000115-21 = "C&Cの名にかけて、この部屋に潜む危険を残らず排除する。"
2000115-22 = "[s] \"そんなに危ないものは無いと思うけど……。\""
2000115-23 = "先生はホコリの危険性を分かってない。"
2000115-24 = "一つひとつは目に見えないほど小さいが、#n集まれば大気汚染を引き起こして健康を脅かす。"
2000115-25 = "放っておくと機械の故障を引き起こしたり、傷の原因になったりすることもある。"
2000115-26 = "パソコンの中を定期的に掃除するのも、それを予防するためだ。"
2000115-27 = "特に酷いのはPM2.5だな。肺に悪影響を及ぼす。"
2000115-28 = "だから多く飛ぶ日には、マスクの着用が推奨されているだろう？"
2000115-29 = "[s] \"ホコリ……小さいけど強力な敵だね。\""
2000115-30 = "そういうことだ。"
2000115-34 = "では、掃除を始めよう。"
2000115-35 = "……あ、そうだ。エプロンは持ってる？"
2000115-36 = "[s] \"ここには無いかな……。\""
2000115-37 = "それなら私のを使うといい。予備で2着持ってきたから。"
2000115-42 = "この子があれば、服をホコリから守れるはずだ。"
2000115-46 = "いや、でも……大人がつけるには可愛すぎるか？"
2000115-47 = "だけど今はこれしか……。"
2000115-48 = "うーーん……。"
2000115-49 = "先生、どうする？#n……使う？"
2000115-50 = "[s] \"使う！\""
2000115-51 = "分かった。#n後ろは結ぶのが難しいから、私が手伝おう。"
2000115-63 = "似合ってる。"
2000115-64 = "[s3] \"かわいい？\"\n[s4] \"かっこいい？\""
2000115-67 = "そ、そういうのは聞かないで！"
2000115-68 = "ほら、早く掃除を始めよう。"
2000115-69 = "[s] \"うん！\""
2000115-72 = "（窓を開けて、掃除を始めた）"
2000115-76 = "（ホコリを徹底的に探し、隅々まで綺麗にした）"
2000115-79 = "（数時間後――）"
2000115-83 = "[ns] \"おーわりー！\""
2000115-85 = "ふぅ、お疲れ様。"
2000115-86 = "綺麗になると気持ちがいいな。"
2000115-87 = "[ns5] \"執務室がピカピカになったね！\"\n[ns6] \"やっぱりメイドってすごいね！\""
2000115-90 = "お、大袈裟だ。やるべきことをやっただけ。"
2000115-91 = "掃除は終わったし、エプロンもらうよ。"
2000115-95 = "……どうかした？#n返したくなさそうだけど……。"
2000115-96 = "[s] \"汚しちゃったし、洗って返すね。\""
2000115-97 = "汚したと言っても、ちょっとホコリがついた程度だろう？"
2000115-98 = "もしかして……先生もエプロンを大切にするのか？"
2000115-99 = "……私と似てるんだな。"
2000115-100 = "理由を聞いてもいい？"
2000115-101 = "[s7] \"かわいいから。\"\n[s8] \"カリンのだから。\""
2000115-104 = "そ、そうか……。"
2000115-105 = "[s] \"カリンは？\""
2000115-109 = "可愛いもあるが……一番の理由は別にある。"
2000115-110 = "エプロンは、他の服のために自分を犠牲にする。"
2000115-111 = "一番前で、真っ先に汚れる役割。"
2000115-112 = "誰もやりたがらない仕事を、誰よりも率先して行う存在……。"
2000115-113 = "だから、メイドの精神に似てると思うんだ。"
2000115-114 = "メイドも、奉仕をやりがいと感じてるから。"
2000115-115 = "つまり、エプロンはメイドの象徴でもある。"
2000115-121 = "だから、大切にしないと。"
2000115-122 = "私たちと似ているこの子に、できる限り報いるために。"
2000115-123 = "[s9] \"カリンは優しいね。\"\n[s10] \"すごく大切に思ってるんだね。\""
2000115-126 = "……うん。#nいつも一緒にいたくて、他の服の上につけたこともある。"
2000115-127 = "体操服とか水着、着物にも。"
2000115-128 = "どんな服装でも、エプロンをつけてるとメイドの気分になれる。"
2000115-129 = "メイドの精神を思い出して、気を引き締めるのにピッタリというか。"
2000115-130 = "[s11] \"他の服にもエプロンを！？\"\n[s12] \"今まで見たことないよ！？\""
2000115-135 = "ひ、1人の時にちょっとつけてみただけだ。#n……人前じゃ恥ずかしいし。"
2000115-136 = "特に水着の上にエプロンは――"
2000115-137 = "……。"
2000115-141 = "と、とにかく恥ずかしいから！"
2000115-142 = "[s] \"そっか……分かった。\""
2000115-143 = "あ、うん……ありがとう。"
2000115-147 = "……よし、この話はここまで。"
2000115-148 = "後片づけまでが掃除だ。#n全部終わらせてしまおう。"
2000115-150 = "（片づけながら、メイドの精神について話し合った）"
2000115-151 = "（奉仕もエプロンも、メイドの象徴なのだと学んだ）"
