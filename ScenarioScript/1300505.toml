[translation]
1300505-1 = "락 스피릿"
1300505-2 = "키보토스 거리"
1300505-4 = "거리에서 고개를 숙인 채 무언가에 열중하고 있는 카요코를 보았다."
1300505-5 = "…………."
1300505-6 = "[s] \"카요코!\""
1300505-7 = "…………."
1300505-8 = "…………♫"
1300505-9 = "[s] \"카요코……?\""
1300505-11 = "……응? 선생?"
1300505-12 = "미안, 음악을 듣고 있느라. #n선생이 부르는 걸 알아차리지 못했어."
1300505-13 = "무슨 음악을 듣고 있었냐고?"
1300505-14 = "후후, 내가 제일 좋아하는 밴드의 신곡이 나왔거든."
1300505-15 = "워낙 좋은 곡이라 등하굣길에도 계속 듣게 되더라고."
1300505-16 = "괜찮다면 선생도 한 번 들어볼래?"
1300505-17 = "[s] 카요코로부터 이어폰을 받아 착용한다."
1300505-23 = "\"내가 갈망하는 것은 죽음! 네게 불필요한 것은 생존!\""
1300505-24 = "\"적의 심장을 뽑아 흘러나오는 피로 목을 축여라—!\""
1300505-25 = "……"
1300505-27 = "[ns] \"이, 이건 무슨 노래야?\""
1300505-28 = "가사 좋지? 내가 좋아하는 헤비메탈 그룹, 블랙 데스 포이즌의 신곡이야."
1300505-29 = "오랫동안 신곡이 나오지 않고, 해체한다는 소문도 있어서 걱정했는데……."
1300505-30 = "역시나 이번에도 좋은 곡을 들고 복귀해 주었어."
1300505-31 = "가사가 너무 교육에 나쁜 것처럼 들린다고?"
1300505-32 = "무슨 소리야, 블랙 데스 포이즌의 곡들은 다소 과격하게 들릴지는 몰라도 인생에 꼭 필요한 교훈적인 내용들을 담고 있다고."
1300505-33 = "선생도 블랙 데스 포이즌의 1집을 들어보면 생각이 바뀔거야."
1300505-34 = "자, 한 번 들어봐."
1300505-40 = "\"이 세상은 쓰레기! 이 음악을 듣는 너도 쓰레기!\""
1300505-41 = "\"모조리 분리수거해서 세상을 청소해주마—!\""
1300505-42 = "……"
1300505-43 = "이후 귀가 먹먹해질 때까지 카요코가 추천하는 음악을 들었다……."
