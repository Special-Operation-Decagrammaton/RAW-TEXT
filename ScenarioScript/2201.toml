[translation]
2201-1 = "건전하지 못한 사업계획"
2201-2 = "트리니티 학원의 상점가"
2201-4 = "어머, 정말인가요?"
2201-5 = "네, 정말이랍니다. 마침 저쪽 상점가 골목 끝에 있는 디저트 가게에서……."
2201-8 = "흐응~ 여기저기서 다들 태평한 얼굴로 걷고 있네."
2201-9 = "말 그대로 The 아가씨란 느낌?"
2201-10 = "다, 다들 반짝거리고 있는, 느, 느낌이예요."
2201-11 = "저, 정말 저 같은 게 여기, 있어도 되는 걸까요?"
2201-12 = "아하하, 이 가운데에서 폭탄을 터트리면 재밌겠다. 그치?"
2201-13 = "……(절레절레)"
2201-14 = "트리니티 거리 한복판을 폭파해달란 의뢰가 있다면 모를까."
2201-15 = "참아, 무츠키, 오늘은 따로 볼 일이 있어서 찾아온 거니까."
2201-16 = "난데없이 트리니티 학원지구에 볼 일이라니, 어쩐 일이야? 아루 쨩."
2201-17 = "훗훗훗, 듣고 놀라지 말라구."
2201-18 = "아~ 괜찮아. 아루 쨩이 하는 이야기의 대부분은 들어도 놀랍지 않으니까."
2201-19 = "그건 뭐, 또 그렇지."
2201-20 = "저, 전 놀랄 수 있어요! 준비할 게요!"
2201-21 = "아……! 하지만 놀라지 말라고 하셨으니까. 어, 어쩌면 좋죠!"
2201-22 = "아니아니, 그냥 쓸데없는 말을 덧붙이지 말라고!"
2201-23 = "크흠흠. 어쨌거나 오늘 우리가 이렇게 트리니티를 찾은 이유는 다른 게 아니라."
2201-25 = "이곳에서 새롭게 시작하는 신규 사업설명회가 있기 때문이야."
2201-26 = "사업설명회?"
2201-27 = "……하필이면 그것도 여기, 트리니티 같은 아가씨 학원에서?"
2201-28 = "응. 맞아. 아는 연줄을 통해서 들어온 이야기인데……."
2201-29 = "아루 쨩의 연줄?"
2201-30 = "……(질색)"
2201-31 = "왜, 왜, 다들 그런 표정인 건데?!"
2201-32 = "이건 확실한 정보라고! 저, 저번에 의뢰를 통해 알게 된 의뢰주가."
2201-33 = "'마침 이번에 좋은 사업기회가 있는데, 이건 아루 사장한테만 알려주는 거야? 알았지?' 라면서 소개해준……"
2201-35 = "무려 키보토스의 뒷세계에서만 알려진 최고급 정보라고!"
2201-36 = "무법자들만이 공유하는 사업 비밀……!"
2201-37 = "굉장하지 않아?!"
2201-38 = "흐응~ 아루 쨩이 그렇게 말한다면야, 그런 거겠지만."
2201-39 = "사, 사장님. 괴, 굉장해요!"
2201-40 = "아핫핫, 좀 더 칭찬해도 좋아!"
2201-41 = "이런 귀중한 기회를 얻을 수 있던 것도, 다 내 대단한 사업수완 덕분이라고!"
2201-42 = "……괜히 귀찮은 일만 일어나지 않았으면 좋겠는데."
2201-43 = "자, 설명회에 늦기 전에 어서 가자!"
2201-46 = "와-오. 사람이 엄청 많네."
2201-47 = "이 사람들이 다 신규 사업설명회에 참가하는 인원들이란 말이지."
2201-48 = "흔치 않은 기회야."
2201-49 = "여기 모인 사업가들은, 뒷세계에서도 내로라하는…… 각 분야에서 한가락 한다는 성공한 사업가들이니까!"
2201-50 = "여기서 얼굴을 익히고 우리 이름을 알릴 수만 있다면, 그것만으로도 큰 도움이 될 거야."
2201-51 = "뭐, 겸사겸사. 사업 투자에서 한 몫 단단히 챙길 수 있으면, 우리 흥신소가 더욱 성장할 여지도 있을 테고?"
2201-52 = "앗, 저기 단상에, 누가 나왔어요……."
2201-56 = "오늘, 이렇게 당사의 사업설명회에 참가해주신 사장님 여러분께, 먼저 감사 인사드립니다."
2201-57 = "오늘 같은 날은 흔치 않은 기회."
2201-58 = "이런 기회를 만난 것만으로도, 감히 말씀드릴 수 있습니다."
2201-59 = "여러분은 선택받은 것이나 다름없다고!"
2201-60 = "흐응~ 선택……?"
2201-61 = "……흠?"
2201-62 = "오오! 역시! 심상치 않은 기회일 줄 알았어!"
2201-64 = "그럼 소개하겠습니다."
2201-65 = "오늘 당사에서 여러분께 자신 있게 선보이는 사업 아이템!"
2201-66 = "그건 바로……!"
2201-67 = "(두-둥!)"
2201-68 = "<에코 프라이드 캐시미어 배터리>입니다!"
2201-70 = "에코……."
2201-71 = "캐시미어……?"
2201-72 = "……배터리?"
2201-73 = "……?"
2201-75 = "참고로 이 아이템은 단순한 배터리 사업이 아닙니다!"
2201-76 = "AI를 이용한 딥러닝을 통해, 가장 효율적인 소재를 추출해 구성한 재료를 밑바탕으로 삼아……."
2201-77 = "추후 그 어떤 배터리보다 효율이 뛰어난 물건을, 무려 친환경 소재로 만들어냈다는 쾌거!"
2201-78 = "오, 아루 쨩…… 이거 말인데."
2201-80 = "……."
2201-81 = "아, 아냐……! 조금만 더 들어봐!"
2201-83 = "내 잘나가는 사업가 지인이 장담했단 말이야……!"
2201-84 = "더군다나 당사가 제공하는 건 단순히 아이템뿐만이 아닙니다!"
2201-85 = "당사에서는 기반이 탄탄한 마케팅 시스템을 이용해, 귀하 사장님들의 수익을 극대화하고자……."
2201-86 = "리스크헷지를 충분히 고려한 사업전략으로……"
2201-87 = "시, 시스템…… 리스크헷지…… (메모메모)"
2201-88 = "……."
2201-89 = "변동폭이 큰 키보토스 경제곡선을 유의 깊게 주시하면서 그 어떤 상황이라도 유연하게 대처할 수 있는 기반을 마련했으며……."
2201-90 = "키, 키보토스, 고, 곡선?"
2201-91 = "(부들부들)"
2201-92 = "……음."
2201-93 = "(경악)"
2201-95 = "자, 그럼 설명은 이것으로 끝이고."
2201-96 = "본격적으로 저희 사업에 투자하는 방법 말입니다만."
2201-97 = "어려울 것 없습니다. 여러분께서는 저희 시스템에 가입하기 위한 회원카드를 구매해주시면 됩니다."
2201-98 = "회원카드를 구입하기만 해도 이 시스템의 향유자가 되실 수 있습니다!"
2201-100 = "여기, 500만엔짜리 회원 카드를 구매하시면, 그 즉시 세피로트 계급으로 상승!"
2201-101 = "고객께선 곧바로 100명의 천사를 거느릴 수 있게 되는 겁니다!"
2201-102 = "다단계에 오컬트까지 섞지 말라고!!!"
2201-103 = "아하하하! 도망칠 곳이 없어져 버렸잖아, 아루 쨩!"
2201-104 = "본인이 다단계라고 인정해버리면 어떡해, 아하하하!"
2201-105 = "하아……. 사장…… 그 지인이라는 사람……."
2201-106 = "……알아! ……더 말하지 마!!"
2201-107 = "저기, 제가 그 지인이라는 분, 없애버릴까요?"
2201-108 = "(울상)"
2201-109 = "뭐어, 트리니티 여학원 근처에서 여는 사업설명회라길래, 뭔가 했는데."
2201-110 = "결국 처음부터 세상물정 모르는 아가씨들을 노린 거였네."
2201-111 = "푸하하핫!! 그런 함정에, 아루 쨩도……! 푸흐흡!"
2201-112 = "믿었는데…… 나한테만 알려주는 고급정보라고 해서, 믿었는데!"
2201-113 = "감히, 내 신뢰를, 이런 식으로 보답해?!"
2201-115 = "어허! 거기! 고객분들! 무슨 소란이시죠?"
2201-116 = "저희는 어디까지나 건전한 사업계획을 공유하려는 넓은 마음으로……."
2201-117 = "됐고."
2201-118 = "감히…… 내, 귀중한 시간을 낭비시키다니……."
2201-119 = "예? 고객님. 무슨 소리를 하시는 겁니까. 이건 둘도 없는 기회입니다!"
2201-120 = "한몫 단단히 잡을 수 있는 꿈과 희망의 기회를 직접 움켜……!"
2201-123 = "(꽈악)"
2201-124 = "응? 아니, 기회가 아니라 제 어깨를 움켜쥐셔도……."
2201-125 = "하루카."
2201-128 = "네, 넷!"
2201-129 = "처리해."
2201-131 = "에헤, 에헤헷, 에헷!"
2201-132 = "네엣! 아루 님의 명령이시라면!"
2201-134 = "끄아악?! 무, 무슨 짓이야?!"
2201-135 = "가, 감히 아루 님의 귀중한 시간을 빼앗다니! 전부, 전부 꺼져버려!"
2201-136 = "……감히 우리 흥신소를 등쳐먹으려고 하다니, 응, 안 되지. 안 돼!"
2201-137 = "하마터면 교묘한 수법 덕분에, 우리 흥신소의 공적자금이 전부 날아갈 뻔했잖아!"
2201-138 = "뭐, 아루 덕분에 그럴 뻔했던 거지만~?"
2201-139 = "으아아아! 됐어! 무츠키! 카요코!"
2201-141 = "으응~ 뭐, 나도 적당히 재미있었으니까. 응! 시작해볼까!"
2201-142 = "하아, 뭐, 어쩔 수 없지."
2201-144 = "모두! 박살내버려!"
2201-153 = "정의실현부입니다!"
2201-154 = "여기서 불법적인 사업설명회가 열리고 있다는 신고를 듣고 왔습니다!"
2201-155 = "왔습니다!"
2201-156 = "……응? 그런데 이미, 난장판?"
2201-157 = "어라, 하스미 선배. 아무도 없는데요?"
2201-161 = "이크, 하필이면 막판에 트리니티의 정의실현부까지 납시었을 줄이야~!"
2201-162 = "녀석들과 엮이면, 선도부급으로 귀찮아질 거야."
2201-163 = "뭐, 그걸로 선도부장의 얼굴이 일그러지면, 그건 그것 나름대로 재미있겠지만~"
2201-164 = "마, 말씀만 내려주세요! 그럼 제가 전부 다……!"
2201-167 = "으아아! 이야기를 복잡하게 만들지 마!"
2201-168 = "으으……."
2201-169 = "오, 오늘은 이렇게 물러가지만, 다음번엔 다를 줄 알아!"
2201-170 = "지인이 무턱대고 추천하는 사업 아이템…… 앞으로는 절대로 믿지 않을 거야!"
2201-171 = "남의 말이 아니라, 내 손으로 직접 보란 듯이 사업을 성공시켜주겠어!!"
2201-172 = "아하핫~ 평소 같은 아루 쨩다워!"
2201-173 = "하아……. 역시, 오늘 이렇게 될 줄 알았어."
2201-174 = "됐고! 모두! 퇴각이야!"
2201-178 = "네, 네엣~!"
2201-180 = "(그렇게 정의실현부를 피해, 흥신소는 트리니티 학원의 밤거리를 내달렸다.)"
2201-181 = "건전하지 못한 사업계획"
