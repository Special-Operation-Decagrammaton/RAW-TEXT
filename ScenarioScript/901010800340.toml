[translation]
901010800340-6 = "식료품 구역에서 발견한 상자들에 대해 이야기하자면……"
901010800340-7 = "창고 중앙의 식료품 구역에는 다른 식재료는 없었지만, 유독 게만큼은 이해가 되지 않을 정도로 잔뜩 쌓여 있었어."
901010800340-8 = "성대한 게 파티를 준비 중이라고 해도 과할 정도의 양이었지."
901010800340-9 = "카르파초 패밀리는 다 먹지도 못할 만큼의 게를 사들여서 무엇을 할 생각이었을까?"
901010800340-10 = "사들인 게를 다른 지역에 가서 되팔려는 목적은 아니었을까?"
901010800340-11 = "수산물의 전매는 원칙적으로 금지되어 있기 때문에 쉽지는 않을 거야. 더욱이 그렇게 많은 양의 게를 유통시키면 쉽게 눈에 띄겠지."
901010800340-12 = "그럼 그 게를 의도치 않게 손에 넣은 거라면? 이해관계에 있는 어느 어부가 카르파초 패밀리에게 대금 대신 게를 보냈을지도 모르잖아."
901010800340-14 = "그런 간 큰 어부가 실존하는지는 모르겠지만, 니코가 창고에서 발견한 게는 카르파초 패밀리가 정식으로 구입한 게가 맞을 거야."
901010800340-15 = "수산물 경매 시장의 매매 기록을 확인해 보니, 최근 카르파초 패밀리가 대량의 게를 낙찰해 간 기록이 있더라고."
901010800340-16 = "그 때문에 카르파초 패밀리를 둘러싸고 수상한 소문이 돌기 시작한 모양이지만……"
901010800340-17 = "어쩌면 게를 구매하는 행위 그 자체에 목적이 있었을지도 모르겠네."
901010800340-18 = "그렇다면 카르파초 패밀리가 대량의 게를 구매한 이유는—"
901010800340-26 = "그렇다면 카르파초 패밀리가 대량의 게를 구매한 이유는—\n[as1] 게 파티를 열기 위해서.\n[as3] 게를 다른 곳에 팔아 차익을 남기기 위해서.\n[as2] 게와 관련된 소문을 퍼뜨리기 위해서."
901010800340-27 = "뭐, 게가 너무 많다고 해서 파티를 못 열 이유는 없긴 하지."
901010800340-28 = "하지만 카르파초 패밀리의 무서운 언니들이 화기애애한 표정으로 파티를 준비하는 모습은 쉽게 떠올리기 어렵네."
901010800340-29 = "게다가 그것만으로는 다른 식재료 없이 게만 구입한 정황도 설명되지 않아."
901010800340-30 = "분명 다른 이유가 있을 거야."
901010800340-39 = "네. 아마도 '게 드럼통'과 관련된 소문이겠지요."
901010800340-40 = "수산물 운송과 상관없는 카르파초 패밀리가 대량의 게를 구매한다면, 그 용도에 대해 분명 말이 나올 거라는 걸 본인들도 모르지는 않았을 거예요."
901010800340-41 = "더군다나 최근 실종 사건을 둘러싸고 괴물 게에 대한 소문이 퍼지고 있었으니—"
901010800340-42 = "모르는 사람 입장에서는 소문이 더 사실처럼 느껴졌겠지요."
901010800340-43 = "아하하…… 그 방법은 추천하고 싶지 않네요."
901010800340-44 = "아까도 말씀드렸지만 수산물 전매는 불법인데다, 게는 요즘 값이 저렴해서 차익을 남기기도 쉽지 않거든요."
901010800340-45 = "총학생회 재무실을 적으로 돌릴 생각이라면, 좀 더 비싼 물건을 밀수하지 않았을까요?"
901010800340-52 = "그런데 이 정도로 수상한 소문이 돌았는데, 왜 발키리 경찰학교에서는 조사를 하지 않았던 걸까?"
901010800340-53 = "카르파초 패밀리도 이를 신경 쓰지 않았을 리가 없는데."
901010800340-54 = "그건 아마도…… 지난번의 우리와 같은 결론에 도달한 게 아닐까?"
901010800340-55 = "같은 결론?"
901010800340-56 = "아무리 수상한 소문이 돌더라도, 직접 확인해 보면 실제로 실종된 사람은 없다는 걸 알 수 있잖아."
901010800340-57 = "그러니 발키리 경찰학교도 수사를 계속할 명분을 찾지 못한 게 아닐까."
901010800340-59 = "하긴. 발키리 경찰학교의 행정력도 한정되어 있으니까. 소문을 추적하는 데에도 한계가 있었겠지."
901010800340-60 = "생각보다 교묘한 수법을 쓰고 있는걸."
