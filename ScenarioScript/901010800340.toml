[translation]
901010800340-6 = "關於在食品存放區發現的那些箱子……"
901010800340-7 = "倉庫中央的食品存放區沒有其他食材，唯獨螃蟹堆得多到令人無法理解。"
901010800340-8 = "即便是在籌備一場盛大的螃蟹派對，數量還是多得不像話。"
901010800340-9 = "卡爾帕喬家族收購多到吃不完的螃蟹，到底是打算做什麼呢？"
901010800340-10 = "會不會是想把買來的螃蟹拿到其他地區轉賣呢？"
901010800340-11 = "水產的轉賣原則上是被禁止的，所以恐怕沒那麼容易。#n更何況把那麼大量的螃蟹流通出去，很容易引人注目吧。"
901010800340-12 = "那麼，如果那些螃蟹不是刻意買來的呢？#n說不定是某個與卡爾帕喬家族有利害關係的漁夫，打算拿螃蟹代替現金來償還債務。"
901010800340-14 = "雖然不知道那麼大膽的漁夫究竟存不存在……#n不過仁子在倉庫發現的螃蟹，應該是卡爾帕喬家族正式收購的沒錯。"
901010800340-15 = "我調查了拍賣市場的交易記錄後發現，最近有卡爾帕喬家族大量標下螃蟹的記錄。"
901010800340-16 = "似乎也是因為這樣，才會開始流傳關於卡爾帕喬家族的可疑傳聞……"
901010800340-17 = "說不定，購買螃蟹這個行為本身就是目的呢。"
901010800340-18 = "既然如此，卡爾帕喬家族大量購買螃蟹的目的是……"
901010800340-19 = ""
901010800340-21 = ""
901010800340-22 = ""
901010800340-25 = ""
901010800340-26 = "#Q;니코;既然如此，卡爾帕喬家族大量購買螃蟹的目的是……\n[as1] 為了舉辦螃蟹派對。\n[as3] 為了把螃蟹轉賣至其他地區賺取差價。\n[as2] 為了散播與螃蟹有關的傳聞。"
901010800340-27 = "嗯，確實不會因為螃蟹太多就辦不了派對。"
901010800340-28 = "但是我實在有點難以想像卡爾帕喬家族那些凶神惡煞的大姐頭們，#n帶著和樂融融的表情準備派對的模樣呢。"
901010800340-29 = "而且光憑這一點也無法解釋，除了螃蟹之外沒有購入其他食材的情況。"
901010800340-30 = "一定還有其他的原因。"
901010800340-31 = ""
901010800340-33 = ""
901010800340-35 = ""
901010800340-36 = ""
901010800340-39 = "是的，恐怕是和「鐵桶蟹」有關的傳聞吧。"
901010800340-40 = "他們應該也有所預料，如果與水產運輸無關的卡爾帕喬家族大量收購螃蟹……#n外界對於那些螃蟹的用途將會產生各種猜測。"
901010800340-41 = "更何況，最近怪物螃蟹的傳聞正圍繞著失蹤事件四處流傳……"
901010800340-42 = "站在局外人的立場來看，那則傳聞想必會顯得更加真實吧。"
901010800340-43 = "啊哈哈……這種可能性恐怕不高呢。"
901010800340-44 = "如同剛才所說，水產轉賣不僅違法，而且最近螃蟹價格低廉，要賺取差價也不容易。"
901010800340-45 = "如果打算與聯邦學生會財務室為敵，應該會走私更昂貴的商品才對。"
901010800340-46 = ""
901010800340-48 = ""
901010800340-49 = ""
901010800340-52 = "不過都傳出這麼可疑的傳聞了，為什麼女武神警察學園沒有進行調查呢？"
901010800340-53 = "卡爾帕喬家族也不可能沒有注意到這件事才對。"
901010800340-54 = "恐怕是因為……得出了和我們之前相同的結論了吧？"
901010800340-55 = "相同的結論？"
901010800340-56 = "無論傳聞再怎麼可疑，只要親自確認就會發現實際上並沒有人失蹤。"
901010800340-57 = "所以女武神警察學園恐怕也找不到繼續調查的名義吧。"
901010800340-59 = "說的也是。畢竟女武神警察學園的行政資源有限，對於追查傳聞也是有極限的。"
901010800340-60 = "他們使用的手法比想像中還要巧妙呢。"
