[translation]
901010800340-6 = "And now for the crates I found in the warehouse..."
901010800340-7 = "There was a refrigerated area at the center of the warehouse, intended for food. However, I almost exclusively found crab there."
901010800340-8 = "It would be too much even for a giant crab boil."
901010800340-9 = "Why did the Carpaccio Family buy that crab with no intention of eating them?"
901010800340-10 = "They could be the middleman? Maybe they wanted to resell."
901010800340-11 = "Reselling seafood is prohibited in principle. Besides, dumping that much crab onto the market would be sure to draw attention."
901010800340-12 = "What if they didn't intend to have all that crab? You know, maybe a fisherman who owed them money sent crabs instead of a payment."
901010800340-14 = "That would be bold. However, the crabs Niko found in the warehouse are likely an official, intended purchase."
901010800340-15 = "I checked the sales record at the recent seafood auction. It turns out the Carpaccio Family won a bid for a huge crab listing."
901010800340-16 = "It was so notable that it started a suspicious rumor about the Carpaccio Family..."
901010800340-17 = "Perhaps that's the whole reason they made the bid."
901010800340-18 = "So, the Carpaccio Family bought so many crabs in order to..."
901010800340-19 = ""
901010800340-21 = ""
901010800340-22 = ""
901010800340-25 = ""
901010800340-26 = "#Q;니코;So, the Carpaccio Family bought so many crabs in order to...\n[as1] \"Throw a crab boil.\"\n[as3] \"Sell them secondhand for a profit.\"\n[as2] \"Start a scandalous rumor.\""
901010800340-27 = "Well, it's not like they would never throw a party."
901010800340-28 = "But I don't really see the Carpaccio Family sisters as the cheery and festive type."
901010800340-29 = "And that doesn't explain why they only bought crab. What about lemon? Butter?"
901010800340-30 = "There must be a better reason."
901010800340-31 = ""
901010800340-33 = ""
901010800340-35 = ""
901010800340-36 = ""
901010800340-39 = "That's right. It must be linked to the \"drum barrel crab\" rumors."
901010800340-40 = "I'm sure the Carpaccio Family would've known that purchasing such a large quantity of crabs would raise questions, especially since they're not in the seafood business."
901010800340-41 = "They already had the monster crab rumors, as well as the missing persons cases..."
901010800340-42 = "Assuming the worst from the Carpaccio Family would make sense to people who didn't know better."
901010800340-43 = "Ahaha... I wouldn't recommend that."
901010800340-44 = "As I said, reselling seafood is illegal. Also, the crab market's way down. It would be very difficult to make a profit."
901010800340-45 = "Wouldn't they have smuggled something more valuable if they were willing to cross the Treasurer's Office?"
901010800340-46 = ""
901010800340-48 = ""
901010800340-49 = ""
901010800340-52 = "If this rumor is so widespread and so violent, then why hasn't Valkyrie looked into it?"
901010800340-53 = "The Carpaccio Family knows better than to egg them on."
901010800340-54 = "I think...it's because they reached the same conclusion we did."
901010800340-55 = "And what's that?"
901010800340-56 = "No matter how suspicious the rumor sounds, an investigation would reveal that no one was actually hurt."
901010800340-57 = "Perhaps Valkyrie couldn't find grounds to continue their investigation."
901010800340-59 = "I guess even Valkyrie has its limits."
901010800340-60 = "The Carpaccio Family's methods are far more clever than I imagined."
