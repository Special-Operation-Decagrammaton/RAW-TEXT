[translation]
901010800340-6 = "ต่อไปเป็นเรื่องลังที่พบในพื้นที่เก็บวัตถุดิบอาหาร..."
901010800340-7 = "ในพื้นที่เก็บวัตถุดิบตรงกลางโกดังไม่มีวัตถุดิบอย่างอื่นเลย แต่กลับมีปูจำนวนมากจนผิดสังเกตกองอยู่"
901010800340-8 = "ต่อให้กำลังจะจัดงานเลี้ยงปูครั้งใหญ่ ก็ยังถือว่าเยอะเกินไปอยู่ดี"
901010800340-9 = "การ์ปัชโช่ แฟมิลี่คิดจะทำอะไร ถึงได้ซื้อปูในจำนวนมากจนกินไม่หมดแบบนั้นนะ?"
901010800340-10 = "หรือว่าจะซื้อไปขายต่อที่อื่น?"
901010800340-11 = "ตามหลักแล้ว การขายต่อสินค้าประมงเป็นเรื่องต้องห้าม ถ้าจะทำก็คงไม่ง่าย ยิ่งเป็นปูจำนวนมากขนาดนั้นก็ยิ่งสะดุดตาด้วย"
901010800340-12 = "ถ้างั้น ถ้าเกิดว่าพวกเขาได้ปูพวกนั้นมาโดยไม่ได้ตั้งใจล่ะ? บางทีอาจจะมีชาวประมงที่มีผลประโยชน์#nเกี่ยวข้องกัน ส่งปูมาแทนการจ่ายเงินให้การ์ปัชโช่ แฟมิลี่ก็ได้นี่นา?"
901010800340-14 = "ไม่รู้ว่าจะมีชาวประมงใจกล้าบ้าบิ่นขนาดนั้นอยู่จริงหรือเปล่า แต่ปูที่นิโกะพบในโกดัง น่าจะเป็นปูที่การ์ปัชโช่ แฟมิลี่ซื้อมาอย่างถูกต้องนะ"
901010800340-15 = "ฉันตรวจดูบันทึกการซื้อขายของตลาดประมูลอาหารทะเลมาแล้ว ไม่นานมานี้การ์ปัชโช่ แฟมิลี่#nประมูลปูจำนวนมากไปจริงๆ"
901010800340-16 = "เหมือนมันจะเป็นสาเหตุที่ทำให้เริ่มมีข่าวลือน่าสงสัยเกี่ยวกับการ์ปัชโช่ แฟมิลี่เลยละ..."
901010800340-17 = "บางที จุดประสงค์อาจอยู่ที่ 'การซื้อปู' นั่นเองก็ได้"
901010800340-18 = "ถ้างั้น เหตุผลที่การ์ปัชโช่ แฟมิลี่ซื้อปูจำนวนมากไปก็คือ..."
901010800340-19 = ""
901010800340-21 = ""
901010800340-22 = ""
901010800340-25 = ""
901010800340-26 = "#Q;니코;ถ้างั้น เหตุผลที่การ์ปัชโช่ แฟมิลี่ซื้อปูจำนวนมากไปก็คือ...\n[as1] เพื่อจัดปาร์ตี้ปู\n[as3] เพื่อเอาปูไปขายทำกำไรที่อื่น\n[as2] เพื่อปล่อยข่าวลือเกี่ยวกับปู"
901010800340-27 = "ก็นะ ถึงจะบอกว่ามีปูเยอะเกินไปแต่ก็ไม่ได้แปลว่าจะไม่ได้เอาไปจัดปาร์ตี้"
901010800340-28 = "แต่พอให้ลองนึกภาพบรรดาพี่สาวสุดโหดจากการ์ปัชโช่ แฟมิลี่เตรียมจัดปาร์ตี้กันอย่างร่าเริงแล้ว นึกภาพตามไม่ค่อยออกเท่าไรเลยแฮะ"
901010800340-29 = "อีกอย่าง แค่นั้นมันยังอธิบายไม่ได้หรอกว่าทำไมถึงซื้อมาแต่ปู โดยที่ไม่มีวัตถุดิบอย่างอื่นเลย"
901010800340-30 = "มันต้องมีเหตุผลอย่างอื่นอยู่แน่ๆ"
901010800340-31 = ""
901010800340-33 = ""
901010800340-35 = ""
901010800340-36 = ""
901010800340-39 = "ค่ะ น่าจะเป็นข่าวลือที่เกี่ยวกับ 'ถังเหล็กใส่ปู' มากกว่าค่ะ"
901010800340-40 = "การ์ปัชโช่ แฟมิลี่ไม่ได้ทำธุรกิจขนส่งอาหารทะเล เพราะงั้นถ้าซื้อปูจำนวนมากไป พวกเขาเองก็คงรู้อยู่แล้วว่าจะต้องมีคนพูดถึงจุดประสงค์ในการซื้อแน่นอน"
901010800340-41 = "แถมช่วงนี้ก็มีข่าวลือเกี่ยวกับปูปีศาจแพร่สะพัดจากคดีคนหายอยู่แล้วด้วย..."
901010800340-42 = "สำหรับคนที่ไม่รู้ความจริง ข่าวลือก็คงฟังดูเหมือนเรื่องจริงมากกว่าค่ะ"
901010800340-43 = "แหะๆๆ... ฉันไม่ค่อยอยากแนะนำวิธีนั้นเท่าไรค่ะ"
901010800340-44 = "อย่างที่บอกไปเมื่อกี้ การขายต่อสินค้าประมงเป็นเรื่องผิดกฎหมาย แถมช่วงนี้ราคาปูก็ถูก น่าจะทำกำไรจากส่วนต่างได้ยากด้วยค่ะ"
901010800340-45 = "ถ้าคิดจะเป็นศัตรูกับฝ่ายการเงินขององค์การนักเรียน ก็น่าจะลักลอบขนของที่มีราคาสูงกว่านี้นี่คะ?"
901010800340-46 = ""
901010800340-48 = ""
901010800340-49 = ""
901010800340-52 = "แต่ทั้งที่มีข่าวลือน่าสงสัยขนาดนี้ ทำไมสถาบันฝึกตำรวจวัลคิรี่ถึงยังไม่สืบสวนกันนะ?"
901010800340-53 = "เป็นไปไม่ได้ด้วยที่การ์ปัชโช่ แฟมิลี่จะไม่ใส่ใจเรื่องนี้"
901010800340-54 = "นั่นอาจเป็นเพราะ... ทางวัลคิรี่ก็ได้ข้อสรุปเดียวกับพวกเราเมื่อครั้งก่อนแล้วก็ได้"
901010800340-55 = "ข้อสรุปเดียวกัน?"
901010800340-56 = "ต่อให้มีข่าวลือน่าสงสัยแค่ไหน แต่ถ้าตรวจสอบด้วยตัวเอง ก็จะรู้ว่าไม่มีผู้สูญหายจริงๆ"
901010800340-57 = "สถาบันฝึกตำรวจวัลคิรี่ก็เลยไม่มีเหตุผลที่จะสืบสวนต่อยังไงล่ะ"
901010800340-59 = "ก็จริงนะ กำลังคนของสถาบันฝึกตำรวจวัลคิรี่ก็มีจำกัด การตรวจสอบข่าวลือเองก็ย่อมต้องมีข้อจำกัด#nเหมือนกัน"
901010800340-60 = "ใช้วิธีที่แยบยลกว่าที่คิดอีกนะเนี่ย"
