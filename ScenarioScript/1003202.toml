[translation]
1003202-1 = "선생님을 위한 새해 선물"
1003202-5 = "샬레의 휴게실"
1003202-7 = "[ns] \"가, 간신히 끝났다…….\""
1003202-8 = "(잔뜩 쌓여 있던 샬레의 일을 가까스로 해치우고 난 뒤, 비틀거리며 휴게실을 찾았다.)"
1003202-9 = "[s] \"조금이라도……. 눈을 붙여야…….\""
1003202-18 = "[ns] \"으, 으음……? 벌써 아침……?\""
1003202-19 = "일~ 어~ 나~! 선생님!"
1003202-26 = "[ns] \"우, 우와앗?!\""
1003202-29 = "벌써 아침이라구? 선생님?"
1003202-30 = "언제까지 늦잠을 자고 있을 셈이야~?"
1003202-31 = "[s] \"무, 무츠키? 무츠키가 갑자기 여긴 왜?\""
1003202-32 = "그야 귀여운 학생이 선생님을 위해 직접 모닝콜을 해주러 나타난 거지!"
1003202-33 = "흐응~ 선생님, 또 밤새 철야를 한 거야? 어쩐지 평소보다 더 얼빠진 얼굴이네. 아하핫!"
1003202-34 = "[s1] \"그렇게 심각해?! 근데 그것보다…….\"\n[s2] \"무츠키의 그 차림새…….\""
1003202-35 = "아, 이거? 보다시피 새해를 맞이해 특별히 갈아입은 복장이야~"
1003202-36 = "아, 이거? 보다시피 새해를 맞이해 특별히 갈아입은 복장이야~"
1003202-37 = "아아~ 선생님, 너무 바쁜 나머지 새해도 온 줄 모르고 일하고 있었던 거구나~"
1003202-38 = "응! 처량한 이야기네. 불쌍해~!"
1003202-39 = "하지만 괜찮아!"
1003202-40 = "오늘은 그런 처량하고 불쌍한 선생님을 위해 내가 특별히 준비한 선물이 있으니까!"
1003202-45 = "[ns] \"그건……. 찬합?\""
1003202-46 = "응, 맞아. 내가 특별히 준비해온 특제 무츠키 수제 오세치 찬합이야! 선생님을 위해 준비했지롱!"
1003202-47 = "[s3] \"설마 무츠키의…… 오세치라고?\"\n[s4] \"무츠키가 특별히 준비해준 선물이라고……?\""
1003202-48 = "어때, 선생님을 위해 내가 아침 일찍부터 정성 들여 준비한 거야."
1003202-49 = "어때, 선생님을 위해 내가 아침 일찍부터 정성 들여 준비한 거야."
1003202-50 = "자아~! 감격해서 울려면 바로 지금이라고?"
1003202-51 = "쿠흐흣. 이러고 있을 게 아니라. 자, 어서 열어봐. 열어봐~ 선생님~!"
1003202-52 = "[s5] \"어디, 그럼…….\"\n[s6] \"감사히 잘 먹겠습니다.\""
1003202-53 = "쿠흐흣……."
1003202-54 = "쿠흐흣……."
1003202-59 = "[ns] \"저기, 무츠키 양……? 이건 오세치가 아니라…….\""
1003202-62 = "푸흐흡, 아하하핫! 유감이야~! 선생님!"
1003202-63 = "내가 준비해온 건 실은 새해 기념 오세치가 아니라, 무츠키 특제 깜짝 시한폭탄이었습니다~!"
1003202-64 = "철야로 고생한 선생님을 위한, 새해 기념 첫 미션이야~!"
1003202-65 = "[s] \"자, 잠깐잠깐. 잠깐! 진짜로?!\""
1003202-66 = "자, 여기서 문제입니다! 시한폭탄의 선은 두 개! 여기서 잘라야 할 선은 무엇일까요?"
1003202-67 = "마치 새해 해돋이를 흉내 내듯 빨갛게 칠한 이 빨간색 선?"
1003202-68 = "그게 아니면 지금 이 순간, 철야로 푸르죽죽해진 선생님의 얼굴색을 본떠 색을 입힌 파란색 선?!"
1003202-69 = "과연 정답은?!"
1003202-70 = "[s7] \"결국 빨간색과 파란색, 둘 중 하나잖아?!\"\n[s8] \"그리고 전자는 몰라도, 후자의 비유는 영문을 모르겠는데?!\""
1003202-78 = "쿠흐흣, 앞으로 남은 시간은 20초인가~"
1003202-79 = "시간이 얼마 없다고~? 선생님~? 선택해야 할 때야~!"
1003202-80 = "[s] \"여기서 선택은……!\""
1003202-84 = "[ns9] 빨간색 선을 자른다.\n[ns10] 파란색 선을 자른다."
1003202-87 = "(고민 끝에 어떤 선을 자를지 결심한 그때였다.)"
1003202-91 = "땡땡땡~! 시간 초과! 이미 늦어버렸습니다!"
1003202-92 = "(슈와아아악-)"
1003202-93 = "[s] \"………으, 응?\""
1003202-94 = "크, 쿠흐흐……."
1003202-95 = "아, 아하하하!! 선생님의 깜짝 놀란 얼굴! 무지무지 굉장해!! 아하하핫!!"
1003202-96 = "선생님의 영문을 모르겠다는 표정! 응, 잘 먹었습니다~!"
1003202-101 = "짜잔~! 이거, 실은 타이머야. 선생님~!"
1003202-102 = "[s] \"타, 타이머?\""
1003202-103 = "응! 시간이 되면 순식간에 찬합을 따듯하게 만들어주는 즉석 발열 타이머! 블랙마켓에서 산 거지롱!"
1003202-104 = "최근에 나온 장난감이라 인기가 많다던가. 아니라던가~! 재밌는 물건이지?!"
1003202-105 = "아 참! 그리고 그 아래엔 바로~!"
1003202-109 = "선생님이 기대한 대로 오세치가 들어있어!"
1003202-110 = "뭐, 내용물은 근처 대형마트에서 적당히 사온 물건이지만~?"
1003202-111 = "[s] \"무, 무츠키…….\""
1003202-112 = "아하하핫! 재밌었다! 아침 일찍 일어나서 준비한 보람이 있었네!"
1003202-113 = "그럼 새해 기념 선물도 전해줬겠다. 난 이만 가볼게. 선생님!"
1003202-114 = "쿠흐흣! 다음에 또 놀자~!"
1003202-120 = "(그 뒤로 무츠키가 준 오세치를 얌전히 맛보았다.)"
1003202-121 = "(무척이나 맛있어서 한숨이 나왔다.)"
