[translation]
11095-2 = "(딩동-댕동-)"
11095-3 = "아- 퇴근시간이다."
11095-4 = "그러네, 오늘 받은 금액으로는 이 시간까지야. 나머지는 너희들끼리 알아서 하라고. #n얘들아, 가자."
11095-5 = "뭐, 뭐?!! 자, 잠깐만?!"
11095-8 = "야, 퇴근이다."
11095-9 = "가는 길에 소바라도 먹을까?"
11095-12 = "야!! 이러는 게 어디있어! 잠깐만! 가지 마!!"
11095-13 = "……."
11095-14 = "이거 망했는데, 설마 이 시간까지 결판이 나지 않을 줄은…… 아루 쨩? #n어떡하지? 도망쳐?"
11095-15 = "아…… 으으……."
11095-16 = "이, 이걸로 끝났다고 생각하지 마, 아비도스 녀석들!!"
11095-17 = "아하하, 아루 쨩, 완전 3류 악당 대사잖아. 그거."
11095-18 = "시끄러! 도망…… 아니, 퇴각한다!"
11095-21 = "잠깐만요! ……아, 가버렸네."
11095-22 = "으헤~ 도망치는게 엄청 빠르잖아, 저 녀석들."
11095-23 = "……. 뭔가 자세히는 모르겠지만 적 병력의 퇴근…… 아니, 퇴각을 확인했습니다."
11095-24 = "머리가 아프네요……. 이제 이상한 흥신소까지 우리 학교를 노리다니……. #n대체 무슨 일이 벌어지고 있는 건지……."
11095-25 = "뭐, 차근차근 알아보자고. #n저 아루 사장님의 신원 정보를 뒤져보면 뭔가 나오겠지."
11095-26 = "네. 다들 수고하셨습니다. 일단은 복귀하시죠."
11095-28 = "다음화;실마리를 찾아서"
