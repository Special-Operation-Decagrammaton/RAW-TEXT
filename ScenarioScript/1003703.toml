[translation]
1003703-1 = "보안위원장의 추리"
1003703-2 = "붉은겨울 학원 본관 앞"
1003703-3 = "(마리나의 문자를 받고 붉은겨울 학원에 도착했다.)"
1003703-4 = "선생, 이쪽이다."
1003703-5 = "이곳이 바로 그 비열한 스파이가 사무국에 침입해 몰래 푸딩을 훔쳐 간 범행 현장이다."
1003703-6 = "하필이면 다른 사람도 아닌 체리노 회장님의 푸딩을 노려 범행을 저지르다니…… 괘씸한 녀석 같으니라고!"
1003703-7 = "[s] \"그 범인은 어째서 푸딩을 훔친 걸까?\""
1003703-8 = "그야 뻔하지. 모든 학생들이 소중히 여기는 귀중품을 훔쳐 서로를 의심하게 만든 뒤, 학원에 내분을 일으키려는 속셈이었을 게다."
1003703-9 = "하지만 다른 사람이라면 몰라도 이 보안위원장의 눈을 속일 수는 없지!"
1003703-10 = "이곳에 남겨진 흔적을 볼 때, 스파이는 외부의 창문을 통해 침입한 것으로 추측된다."
1003703-11 = "발자국의 크기를 보니…… 스파이는 1m도 되지 않는 작은 몸을 가진 게 분명하고, 네발로 기어 푸딩을 입에 문 채 창문 밖으로 다시 빠져나간 것 같군."
1003703-12 = "[s1] \"그건 스파이가 아니라…….\"\n[s2] \"들짐승이 물어간 거 아냐?\""
1003703-13 = "속단은 금물이다, 선생!"
1003703-14 = "속단은 금물이다, 선생!"
1003703-15 = "붉은겨울 학원에 잠입한 스파이는 변장의 귀재."
1003703-16 = "그 어떤 모습으로도 변장할 수 있는 존재인 만큼, 흔적만으로 정체를 속단할 수는 없어!"
1003703-17 = "우선은 녀석의 발자국이 남아 있으니, 이를 먼저 뒤쫓아 볼까."
1003703-18 = "녀석이 발자국을 지우는 걸 잊은 채 돌아간 것 같으니, 운이 좋다면 해가 지기 전에 그의 본거지에 도달할 수도 있을 거야."
1003703-19 = "[s] \"해가 지기 전에……?\""
1003703-20 = "음, 붉은겨울 학원은 키보토스에서도 가장 광활한 부지를 갖고 있으니까."
1003703-21 = "목적지를 정하지 않고 무작정 돌아다니다가는 조난을 당할 수 있을 만큼 넓지."
1003703-22 = "하지만 설마 학원 내에서 조난을 당하는 멍청이가 정말로 있겠어? 하하하!"
1003703-23 = "[s3] \"학원 부지 내에서 조난이라니…….\"\n[s4] \"어쩐지 불길한 예감이…….\""
1003703-24 = "조난은 걱정하지 않아도 좋다, 선생. 붉은겨울 학원의 지리를 완벽하게 숙지하고 있는 나와 함께 라면 길을 잃는 일은 절대 없을 테니까!"
1003703-25 = "조난은 걱정하지 않아도 좋다, 선생. 붉은겨울 학원의 지리를 완벽하게 숙지하고 있는 나와 함께 라면 길을 잃는 일은 절대 없을 테니까!"
1003703-27 = "(한 식경 뒤.)"
1003703-31 = "길을 잃은 것 같다……."
1003703-32 = "어째서지? 분명 발자국을 따라 계속 나아갔을 뿐인데……!"
1003703-33 = "[s] \"지리는 완벽하게 숙지하고 있다며?\""
1003703-34 = "무, 물론이지! 붉은겨울 학원의 보안위원장으로서 학원의 지리는 완벽하게 기억하고 있으니까."
1003703-35 = "이 근처만 하더라도 평소에 자주 산책을 하러 나오는 산책로가……."
1003703-36 = "……아닌가? 어쩐지 주변 풍경이 조금 낯설게 느껴지는데?"
1003703-37 = "우으…… 이제는 발자국의 흔적마저 보이질 않아. 범인은 놓친 건가……."
1003703-38 = "[s] \"아까의 발자국이라면 저 창고로 이어지고 있어.\""
1003703-40 = "어디……"
1003703-41 = "정말이잖아?"
1003703-42 = "게다가 창고의 입구에 버려진 이 용기들은…… 체리노 회장의 푸딩을 담았던 통이군!"
1003703-43 = "그렇다면 그 스파이는 분명 이곳에 은신하고 있는 게 분명해!"
1003703-45 = "그나저나 대단한 눈썰미군, 선생. 나조차 놓친 범인의 흔적을 알아차리다니……"
1003703-46 = "스파이를 무사히 붙잡게 된다면, 선생이 특별 수염 훈장을 받을 수 있도록 한번 건의해보도록 하지!"
1003703-47 = "자, 그럼 어서 그 괘씸한 스파이를 체포하러 가볼까?"
1003703-48 = "……[ruby=돌격!]Ура![/ruby]"
1003703-51 = "꼼짝 마라, 이 스파이!"
1003703-52 = "어라? 이건……."
1003703-56 = "[ns] \"귀여운 고양이네.\""
1003703-57 = "……."
1003703-58 = "맹수가 나타났다!"
1003703-59 = "[s] \"진정해, 마리나. 단순한 길고양이야.\""
1003703-60 = "어, 어떻게 진정할 수 있겠어! 선생은 저 날카로운 손톱과 이빨이 보이지 않는 거야?!"
1003703-61 = "간신히 스파이의 본거지를 찾아냈다고 생각했는데, 설마 더 큰 위협이 도사리고 있었을 줄이야……."
1003703-62 = "체리노 회장님께는 뭐라고 보고해야 하지? 푸딩을 훔친 범인을 찾았지만 도망칠 수밖에 없었다고?"
1003703-63 = "하지만 그랬다가는 체리노 회장님께 숙청당하고 말 테니…… 그도 아니라면, 마취총을 준비해서 생포해야 하나?"
1003703-64 = "[s5] \"마리나, 혹시…….\"\n[s6] \"고양이가 무서운 거야?\""
1003703-65 = "뭐? 붉은겨울 학원의 보안위원장이 고작 고양이에게 겁을 먹을 리가 없잖나!"
1003703-66 = "뭐? 붉은겨울 학원의 보안위원장이 고작 고양이에게 겁을 먹을 리가 없잖나!"
1003703-67 = "사무국의 안전을 책임지는 위원장으로서, 성난 곰이 덤벼든다 하더라도 절대—"
1003703-71 = "우아아아악!"
1003703-75 = "……그, 그래. 사실 고양이는 대하기 껄끄러워……."
1003703-76 = "어릴 적에 길고양이에게 간식을 주다가 얼굴을 할퀴인 경험이 있거든……."
1003703-77 = "그 이후로는 고양이라면 가까이 다가가고 싶지도 않아……."
1003703-78 = "[s] \"이 기회에 한 번 친해져 보는 게 어때?\""
1003703-79 = "제정신인가, 선생? 고양이와 친해지라니!"
1003703-80 = "저런 무시무시한 맹수와 친교를 나누느니, 차라리 굶주린 곰과 이야기를 나누고 말지!"
1003703-81 = "아무리 회장님의 명령이 있더라도 그런 가혹한 일은 할 수 없—"
1003703-85 = "가, 가까이 오지 마!!!"
1003703-91 = "……해, 해치웠나?"
1003703-92 = "[s7] \"총알이 맞지 않아서 다행이네.\"\n[s8] \"도망쳐 버렸어.\""
1003703-93 = "……."
1003703-94 = "……."
1003703-95 = "여, 여하튼 이걸로 사건은 해결되었군. 선생!"
1003703-96 = "회장님의 푸딩을 훔친 범인이 누구인지 알아냈을뿐더러, 녀석에게 똑똑히 경고를 했으니. 다시는 사무국에 기어들어 올 생각은 하지도 못할 거야."
1003703-97 = "이로서 체리노 회장님도 푸딩을 빼앗긴 노여움을 조금은 푸시겠지……."
1003703-98 = "……그나저나 방금 선반 위에서 무언가가 떨어진 것 같은데. 이게 무슨 물건이지?"
1003703-102 = "체리노 회장님의 석상이!!"
1003703-103 = "어, 어째서 회장님의 석상이 이런 곳에 있는 거지? 그, 그보다 어째서 이렇게 처참한 꼴이 되어 버린 거야?!"
1003703-104 = "……뭐? 방금 총을 난사했을 때 충격으로 바닥에 떨어진 것 같다고?"
1003703-105 = "이, 이럴 수가. 체리노 회장님의 오해를 풀기 위해 시작한 일이 도리어 회장님의 권위를 실추시키는 결과를 낳고 말다니……."
1003703-106 = "더 이상의 숙청은 이제 싫어—!"
1003703-108 = "(그동안 푸딩을 훔쳐 간 범인은 고양이라는 사실이 밝혀졌지만, 마리나는 체리노의 석상을 깨트린 벌로 다시 징계를 받게 되었다…….)"
