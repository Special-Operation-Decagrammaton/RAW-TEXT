[translation]
10047060-1 = "제6화;각자의 꿈"
10047060-9 = "[ns] \"……다락방이네.\""
10047060-10 = "후후, 마치 신데렐라 같네요."
10047060-11 = "저희가 정말 신데렐라인 것도, 재 속에서 콩을 찾는 것도 아니지만, 여기서는 그런—"
10047060-12 = "아아, 농담은 됐고! 이제 어떡할 거야? 여기서 어떻게 나갈 거냐고!"
10047060-16 = "[ns] \"여긴 대체 뭐 하는 곳이야?\""
10047060-17 = "학생을 외부 세계와 단절시켜 마나를 빼앗는 무시무시한 장소죠."
10047060-18 = "일종의 <결계>라고 할까요."
10047060-22 = "그냥 반성실이라는 소리야."
10047060-23 = "[s] \"그, 그렇구나…….\""
10047060-24 = "굳이 비교하자면 감옥, 이라고 할까요. 강제적인 느낌은 그보다 덜하지만요."
10047060-25 = "여기…… 생각보다 지낼만해…… 따뜻하고…… 밥도 제때 나오고……."
10047060-26 = "그러니까…… 다들 너무 걱정 마……."
10047060-27 = "금방 풀려날 거니까."
10047060-28 = "그래요! 최대한 긍정적으로 생각하죠!"
10047060-29 = "에휴, 다들 걱정 없어서 좋겠네. 이러다가 내신 점수 깎이면 어쩌려고?"
10047060-30 = "내가 왜 저런 바보들을 걱정해서 여기까지 오게 된 건지…… 하아."
10047060-31 = "진짜 마법진은 무슨 마법진이야. 다음에는 내가 어떻게 해서든 뜯어말릴 테니까."
10047060-35 = "[ns1] \"마법진이라…….\"\n[ns2] \"그러고 보니, 다들 어쩌다 오컬트를 좋아하게 된 거야?\""
10047060-38 = "솔직히 이렇다 할 계기가 있던 것은 아니었어요."
10047060-39 = "저는 모두와 즐거운 시간을 보내면 그걸로 만족하니까요."
10047060-40 = "밴드 활동처럼요."
10047060-41 = "후후, 이유는 그거면 충분한 것 아닐까요?"
10047060-42 = "히히, 그래. 즐거우면 된 거지."
10047060-43 = "이 세상은…… 어둠에 가득 차 있어……."
10047060-44 = "살아 나가려면…… 즐거움은 많으면 많을수록……좋아."
10047060-45 = "[s] \"카노에는 어쩌다가 오컬트를……?\""
10047060-46 = "나도…… 별다른 이유는 없어. 그냥 좋아하니까 하는 거야."
10047060-47 = "좋아하는 거에…… 이유는 필요 없잖아?"
10047060-48 = "그리고 오컬트…… 의외로 학업에 도움이 돼……."
10047060-49 = "언젠가 에리 쨩이 말했던 것처럼, 예술과 오컬트는 떼놓을 수 없는 관계니까……."
10047060-50 = "참고로 난…… 성적이 좋은 편이야…… 히히……."
10047060-51 = "으으, 존경합니다 선배님!"
10047060-52 = "저도 카노에 선배를 좀 닮아야 하는데 실기에 들어가면 항상 긴장해 버려서……."
10047060-53 = "[s] \"그렇구나?\""
10047060-54 = "……사실은 저, 낙제생이거든요."
10047060-55 = "입학하기 전까지는, 그림에 자신이 있었는데……#n여기엔 더 대단한 아이들이 많이 있었죠."
10047060-56 = "하지만 아무리 노력해도 실력이 늘지 않아서…….#n같은 과 친구들 앞에만 가면 자신감이 없어지더라고요……."
10047060-57 = "다들 멋진 작품을 만들어 내는데……#n저는 지금까지 납득할 만한 것을 만들지 못했어요."
10047060-58 = "[s] \"그래서 미술관에서 친구들을 만났을 때 긴장했던 거구나.\""
10047060-59 = "에헤헤, 한심하죠?"
10047060-60 = "하지만…… 계속 이렇게 있을 순 없잖아요? 어떻게든 실력을 키울 방법을 찾아야 했어요."
10047060-61 = "그러다 오컬트에 빠지게 된 거고요."
10047060-62 = "언젠가, 저도 <창세의 초상>같은 작품을 만들어 낸다면―"
10047060-63 = "그때야말로, 모두의 앞에서 당당하게 설 수 있어요!"
10047060-67 = "이상, 하려나요……."
10047060-68 = "[ns3] (열심히 자신의 꿈을 좇는 학생이 있다.)\n[ns4] (그렇다면, 선생님이 할 일은 무엇인가―)"
10047060-73 = "[ns] \"아니, 엉뚱하지 않아. 세상엔 다양한 가능성이 있으니까.\""
10047060-74 = "뉴후후! 그렇죠? 역시 마스터라면 응원해 주실 줄 알았어요!"
10047060-75 = "선생님도 <그쪽>이었구나……."
10047060-76 = "계속 말하지만 난 오컬트 같은 건 믿지 않아."
10047060-77 = "세간에 돌아다니는 이상한 소문이나 현상도 다들 뭔가 착각한 걸 거야."
10047060-78 = "악마 같은 수상한 존재가 있다거나, 운명이 있다거나, 미래를 본다거나, 마법을 쓴다거나……#n직접 보기 전엔 믿을 수 없어."
10047060-79 = "[s] \"응. 그런 이성적인 생각도 중요한 법이지.\""
10047060-80 = "맞아요. 레나 쨩은 언젠가 키보토스 최고의 패션 디자이너가 될 거라고 했으니까요."
10047060-81 = "꾸, 꿈은 크게 가질수록 좋잖아? 난 성적도 괜찮은 편이고."
10047060-82 = "그렇네요…….#n제 꿈은, 모두와 계속 꿈과 희망이 가득 찬 매일을 보내는 것이에요…… 후훗."
10047060-83 = "카노에 선배의 꿈은 뭐예요?"
10047060-87 = "……비밀."
10047060-88 = "에이, 그러지 말고 말해줘요! 우리도 다 말했잖아요?"
10047060-89 = "정말로 알고 싶어……?"
10047060-90 = "그럼 말하는 수밖에…… 내 꿈은……."
10047060-97 = "전생의 인연을 되찾는 것……."
10047060-98 = "[ns] \"응……?\""
10047060-99 = "내 전생에는, 강한 인연으로 맺어진 상대가 있었어……#n최근에 깨달았지…… 히히."
10047060-105 = "[ns5] \"그, 그렇구나……!\"\n[ns6] \"조, 좋다고 생각해…….\""
10047060-108 = "이히히……."
10047060-113 = "저기요? 잊고 계신 것 같은데, 여러분은 지금 반성실에 있답니다?"
10047060-114 = "아! 미, 미안! 조용히 있을게!"
10047060-115 = "……뭐, 이런 곳에 가둔다고 반성하실 분들로 보이진 않지만요."
10047060-120 = "어, 어라?"
10047060-127 = "자, 다들 나오세요. 이번엔 특별히 주의 정도로 끝낼 테니까."
10047060-128 = "하지만 다음에 또 걸리면 평의회에 보고할 테니 그런 줄 아세요."
10047060-129 = "히히, 고마워……. 역시 융통성 있는 건 미리아 쨩뿐이네."
10047060-130 = "샬레의 선생님을 오래 가둬 놨다간 저희도 좋은 소리 못 듣는다고요."
10047060-131 = "그러니까 어서 돌아가세요. 마음 바뀌기 전에."
10047060-132 = "고, 고마워!"
10047060-133 = "휴우, 살았어요……!"
10047060-145 = "[ns] \"방금 전의 그 아이, 사감대라고?\""
10047060-146 = "맞아…… 예전부터 신세를 지고 있는 친구지……."
10047060-147 = "사감대 간부들 중에선…… 그나마 융통성이 있는 녀석이야……."
10047060-152 = "[ns] \"……그렇구나.\""
10047060-153 = "자, 일단 기숙사로 돌아가죠. 청소도 빨리 해야 할 것 같고요."
10047060-154 = "아……! 그러고 보니 완전 난장판이 됐었잖아!"
10047060-155 = "에헤헤……. 죄송합니다, 죄송합니다."
10047060-159 = "[ns] \"청소라면 나도 도울게.\""
10047060-160 = "안 말린 선생님도 책임이 있으니까 제대로 치우라고."
10047060-161 = "나도 뭐, 어느 정돈 도와줄 테니까."
10047060-162 = "역시 레나 쨩은 착하네…… 히히……."
10047060-167 = "치, 칭찬하면 누가 좋아할 줄 알고!"
10047060-180 = "……이런 곳에서 다시 만날 줄이야."
10047060-181 = "후훗…… [USERNAME] 선생님."
