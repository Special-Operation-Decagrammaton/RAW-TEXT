[translation]
51190-1 = "제19화;화조풍월부의 괴담가 1"
51190-4 = "불길이 피어오른다."
51190-5 = "거리에는 이매망량이 모습을 드러낸다."
51190-7 = "축제를 알리는 신호탄과 함께."
51190-12 = "우리는 너희를 찾아간다."
51190-18 = "────그래, 마침내 시작되었구나."
51190-19 = "자, 어디 내게 보여주려무나."
51190-21 = "[ruby=너희들]네가[/ruby] 만들어 나가는 [ruby=괴담]<백물어>[/ruby]를."
51190-37 = "[ns] \"그렇게나 싸웠는데…… 여전히 상처 하나 없는 모습…….\""
51190-40 = "뭐야, 뭐냐고! 엄-청나게 총알 세례를 퍼부었는데 어쩐지 대미지가 전혀 없지 않아?!"
51190-42 = "으아아앙~! 뭔가 이상해! 쏴도 맞는 느낌이 안 들어~!"
51190-43 = "그대로 허공을 가르는 느낌이야."
51190-44 = "네, 마치 현실에 존재하지 않는 신기루를 쏘는 것 같은 느낌이……."
51190-46 = "……소용, 없어."
51190-47 = "[s] \"……나구사?\""
51190-50 = "……저것, 에게 평범한 사격은 통하지 않아."
51190-51 = "뭐?! 어째서?!"
51190-52 = "그도 그럴 것이…… 저것은 <환량백물어>."
51190-53 = "괴서 <이노모노노케로쿠>로부터 비롯된…… 화조풍월부가 자아낸 <괴담>."
51190-54 = "그런 괴담에게 평범한 총알은 통하지 않는 거야."
51190-55 = "뭐어?! 그런 거짓말 같은 이야기를 지금 믿으라고?!"
51190-56 = "……아니! 진짜 통하지 않고 있으니 믿을 수밖에 없긴 하지만! 그래도!"
51190-58 = "나구사 씨의 말대로라면…… 그럼 아예 처음부터 쓰러트릴 방법이 없다는 이야기, 인가요?"
51190-59 = "아무것도 안 통하다니! 사기 캐릭터잖아! 그런 건 반칙이야! 반칙!"
51190-64 = "쓰러트릴 수 있는 방법……이, 아예 없는 건 아니야."
51190-65 = "[s] \"나구사, 그 방법이 뭔데?!\""
51190-66 = "괴서에서 비롯된 괴담을 쓰러트릴 수 있는 건, 오로지 대 예언자 쿠즈노하로부터 인정을 받고 그 자격을 계승해 온 자."
51190-67 = "<백화요란의 부장>과 그 부장이 가진 자격의 증거 <[ruby=百蓮]백련[/ruby]>뿐……."
51190-68 = "[s] (비슷한 이야기를…… 분명 어디선가…….)"
51190-70 = "대 예언자 쿠즈노하로부터 전달 받았으며, 대대로 백화요란의 부장만이 손에 쥘 자격을 가진다는 전설의……."
51190-71 = "말 그대로 <귀신을 사냥하는 전설의 마총> 이어요!"
51190-73 = "[ruby=百蓮]백련[/ruby]. 그것이 없는 이상…… 환량백물어에겐 상처를 내는 것조차 불가능해."
51190-74 = "그럼, 우린 아무것도 할 수 없는 거야? 괴물이 저렇게 난동을 부리고 있는데."
51190-75 = "……그래, 우린 더는 아무것도."
51190-76 = "나구사 선배는 어떻게 그런 걸 알고 있는 거야?"
51190-77 = "나는……. 대설원에서 이미……."
51190-78 = "아니, 아니야. 그건 아무래도 좋아."
51190-79 = "도망가야 해. 이대로 있다간 전부 상처 입고 다칠 거야. 모두 끝나버릴 거야."
51190-80 = "그렇게 되기 전에…… 그때와 같은 일이 벌어지기 전에 얼른……!"
51190-85 = "그렇다 해도 이대로 가만히 있을 수는 없어!"
51190-90 = "렌게 쨩……?"
51190-95 = "하늘이 붉게 물들었던 그때처럼…… 또다시 이번에도 아무것도 못 한 채로 우왕좌왕하고 있으라고?"
51190-96 = "아니, 그럴 순 없는 거잖아!"
51190-97 = "다시는 그때처럼……"
51190-98 = "모두가 도움을 바라고 있을 때, 아무것도 할 수 없다고. 이게 우리의 한계라고 변명하듯이 포기하고 싶지 않아!"
51190-99 = "[s] \"렌게…….\""
51190-100 = "나구사 선배가 말했지. 자격을 가진 자라면 쓰러트릴 수 있다고."
51190-101 = "그럼 선배라면 가능한 거 아냐?! 선배야말로 백화요란의 부장 대리니까!"
51190-107 = "아, 냐…… 나는……. 이미 내 오른팔은……"
51190-108 = "나는…… 못해."
51190-113 = "할 수 없어. 내게 <자격>은 없어, 이미 그건 키쿄에게……."
51190-114 = "아니, 설사 <그것>을 가지고 있었다 하더라도………"
51190-115 = "내겐 불가능해."
51190-116 = "선배, 어째서……."
51190-121 = "나는……… 아야메가 아니니까."
51190-126 = "아하하하하핫! 잘 알고 있네요!"
51190-127 = "구역질이 날 정도로, 정말 잘 알고 있잖아요~!"
51190-131 = "……누구?"
51190-138 = "이힛, 이히힛. 정답, 정답, 완전 정답~! 나구사 쨩의 말이 맞아요."
51190-139 = "저것. 환량백물어 쿠로카게는 저의 괴서 이노모노노케로쿠가 빚어낸 괴담의 한 가지. 당신들은 그것의 털끝 하나 다치게 할 수 없어요."
51190-140 = "말 그대로……. 대 예언자로부터 자격을 정당히 이어받은 존재. <아야메>라면 또 모를까."
51190-146 = "그렇죠? 당신도 잘 알고 있는 사실이잖아요? 나구사 쨩."
51190-147 = "어째서…… 네가, 여기에……"
51190-148 = "야부키…… 슈로."
51190-149 = "[s] \"너는, 화조풍월부의……\""
51190-150 = "아핫, 아하하핫~ 기뻐라~ 나구사 쨩도 그리고 샬레의 선생님도, 모두 저를 기억해 주신 거네요?"
51190-151 = "그리고 또 감사합니다. 선생님. 제가 말씀드렸던 대로 여기까지 함께해 주셔서."
51190-152 = "저의 이야기를, 허투루 듣지 않아 주셔서~"
51190-153 = "어떠신가요."
51190-154 = "당신들을 위해 준비한 거리 곳곳의 <괴담>은, 마음에 드시나요?"
51190-159 = "그 말은…… 거리에서 벌어진 소동과 괴물들은 혹시……?"
51190-160 = "네놈이 꾸민 일인 거냐?!"
51190-161 = "어, 진짜루?! 저 사람이………?!"
51190-162 = "[ns] \"괴물을 불러낸, 장본인…….\""
51190-164 = "아핫~ 피부가 따끔따끔해질 정도의 적의, 경계심. 그리고 분노."
51190-165 = "당신들의 그 행동 너무너무너무~! 마음에 들어요. 무척이나~!"
51190-167 = "쓸데없는 말은 필요 없어. 묻는 말에 대답이나……!"
51190-169 = "네, 그것이 당신들의 질문이라면 정중한 대답을."
51190-170 = "정식으로 소개 드리지요."
51190-171 = "제 이름은 슈로."
51190-172 = "당신들의 말마따나 이 자리에 환량백물어를 불러낸──"
51190-173 = "──화조풍월부의 괴담가. 야부키 슈로랍니다. 앞으로 기억해주시길. 이히힛."
51190-174 = "[s] \"괴담가………?\""
51190-175 = "아핫. 아하핫. 또네요. 그 얼굴. 얼굴들."
51190-176 = "눈앞에 있는 것이 이해가 되지 않아. 영문조차 모르겠다는 표정."
51190-177 = "거기에 더해 지워지지 않은 적의와 적개심을 품고 저를 노려보는 표정."
51190-178 = "바람직해요. 좋아요. 좋아해요. 그 얼굴."
51190-179 = "……특히나 그중에서도 제 마음에 가장 쏙 드는 표정은 바로 당신이라구요. 나구사 쨩."
51190-185 = "대설원에서의 만남 이후, 이게 얼마만의 재회인가요? 이힛."
51190-186 = "그때 이후로 당신이 어디로 도망쳤나 했더니…… 이렇게 다시 백귀야행으로 돌아왔을 줄이야."
51190-187 = "아아. 물론 당신 같은 비참한 낙오자가 방황 끝에 돌아갈 수 있는 곳이라고 해봤자 여기밖에 없겠지만."
51190-188 = "그래도 참으로 염치없네요."
51190-189 = "애당초…… 당신은 이곳에, <백화요란>으로 돌아오고 싶어 하지도 않았잖아요? 계속해서 그곳에서 도망치고 싶어 한 주제에."
51190-190 = "다시 돌아오다니. 참으로 부끄럼 같은 것도 없는 건가요. 당신이란 인간은."
51190-191 = "너…… 무슨 말을 하는 거야……."
51190-192 = "어라라~~? 그 표정. 보아하니 설마 아직 모르고 있는 건가요~?"
51190-193 = "나구사 쨩. 설마 아직도 모두에게 비밀로 하고, 아무런 이야기도 하지 않은 건가요~?"
51190-198 = "아직도 거짓말을 하고 있는 건가요~?"
51190-200 = "…………읏."
51190-202 = "아하하핫~~~"
51190-203 = "여전히 백화요란의 옷을 걸치고 백화요란의 이름을 등에 업고, 여전히 백화요란의 부장 대리인 척 자신의 진짜 모습을 숨긴 채."
51190-204 = "여전하게 나구사 쨩이 염치없고 부끄럼 모른 행동을 하고 있는 걸. 저만은 이미 다~ 알고 있는데."
51190-205 = "이 자리에 있는 백화요란의 부원은, 거기 있는 선생님까지도. 그 누구도 모르고 있단 거네요."
51190-207 = "그, 만……."
51190-209 = "네 녀석이 누군지는 모르겠지만!"
51190-210 = "헛소리로 백화요란을 욕보일 생각이라면, 내가 가만히 있지 않겠어……!"
51190-212 = "헛소리라니. 억울해요…… 억울하다구요. 안 그래요 나구사 쨩?"
51190-213 = "그러니 제가 대신해서 말씀드릴게요. 좋다구요. 나구사 쨩이 말하기가 부끄럽고 창피한 나머지."
51190-214 = "이제껏 절대로 입에 담지 못했을 진실을, 거기 있는 나구사 쨩을 대신해서 제가 전부 말해드릴게요."
51190-215 = "그만, 해……"
51190-216 = "그만 하라니요. 그럴 순 없다구요. 저쪽에 있는 멍청한 년이 물어봤잖아요? 무슨 헛소리를 하는 거냐고."
51190-217 = "저, 남의 질문에 답해주는 거 좋아한다구요? 질문을 받았으면, 그에 합당한 대답을 할 줄 알아야 훌륭한 사람이라구요?"
51190-218 = "그러니 말해드릴게요."
51190-222 = "나구사 쨩은 줄곧 이렇게 말해왔죠?"
51190-224 = "<나는 백화요란의 부장이 될 수 없어.>"
51190-228 = "<나는 아야메가 아니니까.>, <아야메가 아닌 내게 그럴 자격은 없으니까.>"
51190-229 = "계속해서 아야메. 아야메. 아야메만 이야기하면서, 거기 있는 나구사는 어떻게든 이유를 댔잖아요?"
51190-230 = "그만…………!"
51190-231 = "아하핫."
51190-232 = "그것참."
51190-237 = "[log][ff4444]<거짓말>[-][/log]"
51190-240 = "[log][ff4444]<그렇게 생각한 적 따위, 단 한 번도 없으면서>[-][/log]"
51190-246 = "실은 그런 이유가 아니잖아? 헛소리 따윈 집어치워."
51190-247 = "번듯한 이유가 있는 것처럼, 어쩔 수 없다는 듯이 변명하지만. 죄다 거짓말이잖아?"
51190-248 = "모두에게 말하지 못하겠지? 그러기엔 부끄럽고 창피하니까."
51190-249 = "모두에게 진실을 고백하기엔 무서우니까."
51190-250 = "[s] \"무서워……?\""
51190-251 = "네, 무서운 거예요. 나구사 쨩은. 전부 들키는 게."
51190-252 = "아하핫. 그러니 제가 대신 말씀해 드릴게요. 나구사 쨩. 당신이 차마 입에 담지 못한 추악한 본심을."
51190-253 = "저의 괴서로 폭로해 드릴게요."
51190-258 = "………!"
51190-273 = "그 이야기 들었어? 아야메 부장이 하루아침에 사라졌대."
51190-274 = "(사람들이 수군거린다.)"
51190-275 = "앞으로 백화요란은? 부장의 자리가 공석이 되는 거잖아?"
51190-281 = "(사람들이 재잘거린다.)"
51190-282 = "설사 아야메 선배가 없어져도, 소꿉친구이며 똑같이 우수한 나구사 선배가 남아 있어주었으니까."
51190-284 = "그러니 괜찮아."
51190-288 = "(기대감이 담긴 목소리로 이야기한다.)"
51190-295 = "<아냐. 그렇지 않아.>"
51190-296 = "(그것은 미처 입 밖으로 꺼내지 못한 마음.)"
51190-299 = "……나는, 그럴 수 없어."
51190-304 = "(남겨진 내게, 이 [ruby=자격]총[/ruby]은 너무나도 무거워.)"
51190-305 = "그도 그럴 게…… 나는……"
51190-309 = "[ruby=나는 아야메가 아니니까.]이대로 있으면 내 진짜 모습을 들키게 될 테니까.[/ruby]"
51190-310 = "[ruby=나로서는 그런 아야메를 대신할 수 없으니까…….]이제까지 나는 그저 백화요란의 부부장이라는 우등생을 연기해 왔을 뿐이니까.[/ruby]"
51190-311 = "[ruby=백화요란의 부장으로서 자격을 가진 건 아야메 뿐이니까.]나는 재능도, 실력도 없는 주제에 그저 아야메 곁에 서 있었을 뿐이니까.[/ruby]"
51190-314 = "이대로 있으면 아야메에게 비해 뒤떨어지고, 아무것도 아닌 나에 대해."
51190-315 = "실은 내가 비루하고 추악했을 뿐이라는 걸."
51190-316 = "아야메의 곁에 안주하는 것만으로 만족한 채, 그 어떠한 것도 해낼 수 없는 열등생이라는 걸."
51190-318 = "모두에게 들켜버릴 거야."
51190-319 = "진실이 드러날 거야. 실은 내가 이곳에 있는 건 전부 요행에 불과하다는 게."
51190-321 = "그저 아야메의 후광에 기대어, 억지로 버티고 있었을 뿐이라는 것을."
51190-322 = "모두가 손가락질할 거야. 나를 보며 비웃을 거야."
51190-325 = "무서워."
51190-326 = "진실이 폭로되는 것이 두려워."
51190-327 = "그러니 진짜 모습을 들키기 전에."
51190-329 = "[log]<어서 도망쳐야만 해.>[/log]"
51190-333 = "어?! 어?! 방금 뭔가 이상한 게 확- 하고……!"
51190-334 = "보였어."
51190-335 = "그건…… 과거의…… 풍경, 인가요?"
51190-336 = "[s] \"아니, 이건 단순한 풍경이 아니라…….\""
51190-338 = "이것이…… 나구사 선배의……?"
51190-344 = "어떠신가요? 어떤 느낌인가요?"
51190-345 = "지금껏 잘 숨기고 있다고 생각한 상대의 본심을 엿본 기분은? 네? 감상을 들려주세요."
51190-346 = "무엇보다 거기."
51190-350 = "무엇보다 거기. 골목 구석 담벼락을 등지고 서서……"
51190-351 = "자신이 그토록 성토하던 선배의 진심을 들은, 당신의 감상을 듣고 싶다구요~?"
51190-357 = "[ns] \"키쿄……!\""
51190-358 = "거리에서 소란이 일어났길래, 무슨 일인지 확인하려고 나왔을 뿐이야."
51190-359 = "그래서 나왔을 뿐인데……."
51190-360 = "……방금 그거."
51190-361 = "……!"
51190-362 = "그게, 나구사 선배의 진심이야?"
51190-363 = "키쿄, 난……"
51190-365 = "아하핫. 네, 맞아요."
51190-366 = "방금 그것이 여러분께 이야기하지 않은 나구사 쨩의 진정한 속마음. 백화요란의 부원들이 존경한다고 생각했던 사람의 본질."
51190-367 = "나 참~ 아야메가 아니면 안 된다느니, 아야메가 아닌 자신에겐 자격이 없다느니. 겉으로는 그럴듯한 변명들을 해왔지만."
51190-368 = "실은 그 전부가 새빨간 거짓말."
51190-369 = "그저 소꿉친구만을 위해, 그 소꿉친구에게 어울리는 모습만을 연기하면 충분했고, 소꿉친구가 아닌 다른 후배들 따윈 아무래도 좋다고 진심으로 생각한 얼간이."
51190-370 = "그 결과가 바로 지금, 당신들에게서 도망치려고 하는 작금의 행동이랍니다."
51190-372 = "처음부터 그런 이유로, 당신은 우리를…… 떠난 거라고?"
51190-373 = "나구사 선배……."
51190-378 = "키쿄, 렌게……! 아냐……!"
51190-379 = "처음부터 그럴 마음을 먹었던 게 아니라, 나는……! 그저……!"
51190-381 = "여전히 그런 거짓말을."
51190-382 = "당신은 원래 그런 인간이었잖아요?"
51190-383 = "그 비루하기 짝이 없는, 너의 진짜 모습을 남에게 들키는 게 무서웠을 뿐인 거잖아요?"
51190-384 = "손가락질을 받을 바에야, 도망치면 그만이라고 생각한 패배자잖아요? 그런데 아직도 그걸 인정할 수 없다는 건가요?"
51190-385 = "참으로 당신이란 인간은."
51190-386 = "──역겨워."
51190-388 = "나는……… 나는………!"
51190-389 = "나는…… 나는…… 단지…… 모두에게…… 그저……."
51190-391 = "선배는………"
51190-392 = "고료 나구사. 당신은……"
51190-396 = "나는……"
51190-397 = "나는, 그런 게 아니라…… 아야메는……"
51190-398 = "나는 단지 아야메를……!"
51190-400 = "아하핫, 아핫. 아하핫."
51190-401 = "이제껏 숨기고 있던 본심을 폭로하는 것으로 시작되는 분열."
51190-402 = "네, 전부 망가져 버리도록 하세요."
51190-403 = "서로가 서로에게 성토하고 반목하고, 싸우고, 공격하고."
51190-404 = "혀로 상대를 베고, 거짓으로 숨기고 싶은 진실을 감싸고."
51190-405 = "있는 이야기는 끌어내리고. 없는 이야기는 괴담으로서 만들자구요."
51190-406 = "그렇게 하는 것으로."
51190-407 = "이것으로 마침내…… 드디어………"
51190-408 = "당신들이야말로 제가 꿈꾸던 진정한 풍류가 될 테───"
