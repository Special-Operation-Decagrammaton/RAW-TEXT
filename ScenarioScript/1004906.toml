[translation]
1004906-1 = "고양이 혀"
1004906-3 = "선생님, 안에 있지?"
1004906-4 = "……들어갈게요. 실례하겠습니다."
1004906-8 = "안녕, 선생님. 마침 쉬고 있는 타이밍인가 보네. 다행이다."
1004906-9 = "……응? 갑자기 무슨 일로 찾아왔냐고?"
1004906-10 = "뭐야. 그렇게 말하니 이유가 있을 때만 찾아오는 사람처럼 들리잖아. 좀 서운한데."
1004906-11 = "무, 물론…… 이번에도 이유가 없는 건 아니지만……."
1004906-12 = "그래도 이번에는 좀 다르다고. 나름대로 선생님에게도 나쁘지 않을 일일 테니까 말이야."
1004906-13 = "응? 그게 뭐냐고? 아아. 실은 이거 때문인데……."
1004906-18 = "[ns1] \"이건…… 초코케이크? 좀 다른가?\"\n[ns2] \"오늘 무슨 날이야?\""
1004906-19 = "으음. 정확하게는 <퐁당 쇼콜라>라는 건데 말이지……."
1004906-20 = "으음. 정확하게는 <퐁당 쇼콜라>라는 건데 말이지……."
1004906-21 = "하, 하하……. 사실 이것도 다 내가 선생님을 생각해서……."
1004906-22 = "그래서 일부러 베이커리까지 가서, 비싼 돈을 주고……."
1004906-23 = "사서…… 곧바로 여기로……. 그……."
1004906-24 = "…………."
1004906-25 = "……하아. 아니다, 됐어. 역시 거짓말은 성에 맞지도 않고 능숙하지도 않네."
1004906-26 = "미안해. 선생님 주려고 가지고 온 건 사실이지만, 딱히 살 때부터 그럴 의도였던 건 아냐."
1004906-27 = "그게 무슨 말이냐고? 그러니까 말이지……. 선생님. 손을 가까이 대 봐."
1004906-31 = "[ns3] \"뜨겁다. 열기가 확 느껴지네.\"\n[ns4] \"오……. 갓 만든 건가봐?\""
1004906-32 = "뭐……. 그렇지. 퐁당 쇼콜라라는 게 사실 이렇게 뜨거운 초코가 안에 들어있는 거거든."
1004906-33 = "뭐……. 그렇지. 퐁당 쇼콜라라는 게 사실 이렇게 뜨거운 초코가 안에 들어있는 거거든."
1004906-34 = "그냥 초코케이크인 줄 알고 샀는데 말이지……. 좀 잘 볼 걸……. 실수했어."
1004906-35 = "……응? 무슨 문제라도 있는 거냐고?"
1004906-36 = "……그게……. 음……."
1004906-37 = "내가 그……. 뜨거운 걸 잘 못 먹거든……."
1004906-38 = "이게 안에 들어 있는 초코가 굉장히 뜨거워서, 나는 도무지 먹을 수가 없어."
1004906-39 = "그렇다고 식을 때까지 기다리자니……. 보통 이런 건 식으면 맛이 없잖아?"
1004906-40 = "그래서 이왕 아까운데, 뜨거울 때 먹을 수 있는 사람에게 주자……. 그렇게 된 거지."
1004906-41 = "……응?"
1004906-42 = "결국 '처리'하려고 가지고 온 거냐고……?"
1004906-43 = "뭐, 뭐야!? 그런 식으로 말할 건 없잖아!! 누가 보면 버리러 온 줄 알겠네!!"
1004906-44 = "제대로 맛있는 새 거라니까!? 단지 내가 못 먹는 것일 뿐이고……!"
1004906-45 = "[s5] \"카즈사는 고양이 혀로구나.\"\n[s6] \"흐음. 마치 고양이 같네.\""
1004906-46 = "……!?"
1004906-47 = "……!?"
1004906-48 = "으, 으응……? 고양이 혀……?"
1004906-49 = "그, 그런가……? 딱히 그런 생각을 해 본 적은 없는데……."
1004906-53 = "……잠깐만, 선생님."
1004906-54 = "미리 말해두는데, 그런 말 들어도 안 기쁘다고. 나는 고양이 싫어하니까."
1004906-55 = "……아. 딱히 그런 건 아니라고? 그럼 뭐, 됐지만……."
1004906-59 = "……뭔가 역시 신경 쓰이는데."
1004906-60 = "아무리 생각해도 놀리려던 게 맞는 거 같은데……."
1004906-61 = "……응? 고맙게 잘 먹겠다고? 그, 그래. 별말씀을……."
1004906-62 = "흐음……."
1004906-63 = "……으음. 모르겠다……. 흠……."
1004906-65 = "(그렇게 의심하는 눈초리의 카즈사를 보며, 따듯한 퐁당 쇼콜라를 맛있게 '처리'했다.)"
1004906-66 = "(카즈사의 말대로 굉장히 달콤하고 부드러운 맛이었다.)"
