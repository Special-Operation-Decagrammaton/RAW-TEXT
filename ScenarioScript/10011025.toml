[translation]
10011025-2 = "끄, 끄앙. 당했다!"
10011025-7 = "이, 이렇게 당해버릴 줄이야. 저 녀석들 대체 정체가……."
10011025-9 = "응? 잠깐, 잘 보니까. 이 녀석! 샬레의 선생이잖아!"
10011025-10 = "뭣? 샬레의 선생이라니. 그 엮이기만 해도 엄청난 꼴을 당한다는, 그 샬레의 선생?!"
10011025-11 = "[s] \"뭔가, 엄청나게 부당한 평가를 받은 듯한…….\""
10011025-12 = "에잇! 모두 도망쳐!"
10011025-17 = "[ns] \"가버렸네……. 그보다, 괜찮아? 츠쿠요…….\""
10011025-18 = " 우, 우와아앙~~!! 서, 선생니이임!!"
10011025-20 = "[ns] \"어때 좀 진정됐어?\""
10011025-21 = "가, 가, 감사합니다아…… 선생님."
10011025-22 = "저, 그, 그게, 저, 저 때문에, 괜히…… 고, 고생하게…… 죄, 죄송합니다아……."
10011025-23 = "[s1] \"아냐, 별거 아냐.\"\n[s2] \"아까 일은 재난이었네, 종종 있는 일이야?\""
10011025-26 = "네, 네에……."
10011025-27 = "아무래도, 저……. 보시다시피 덩치만 쓸데없이 커서……."
10011025-28 = "눈에 잘 띄곤 하니까. 그런 식으로 붙잡힐 때가 종종 있어서"
10011025-29 = "도, 도와주셔서 감사합니다."
10011025-30 = "[s] \"해야 할 일을 했을 뿐이야. 일단 돌아갈까?\""
10011025-31 = "네, 넷!"
10011025-38 = "………(힐끔)"
10011025-45 = "……(힐끔)"
10011025-46 = "[s] \"……저기, 왜 그래? 내 얼굴에 뭐라도 묻었다던가?\""
10011025-47 = "아, 아뇨! 그, 그게 아니라……."
10011025-48 = "죄, 죄, 죄송합니다아!! 하, 함부로 쳐다보다니, 기, 기분 나쁘셨죠! 죄, 죄송해요……."
10011025-49 = "[s] \"탓하려는 게 아니라, 무슨 일인가 싶어서.\""
10011025-50 = "그, 그게, 그러니까아……."
10011025-51 = "그게……."
10011025-52 = "다, 다른 게 아니라……."
10011025-53 = "이즈나 쨩의 주군, 이라는 분이."
10011025-54 = "그, 어, 어떤 분이신가…… 줄곧 신경이 쓰였달까……."
10011025-55 = "[s] \"아, 그런 거 때문에…….\""
10011025-56 = "에, 에헤헷……."
10011025-58 = "인법연구부에 이즈나 쨩이 들어온 뒤로, 느, 늘 말했거든요."
10011025-59 = "\"저는 주군을 위해! 키보토스 제일의 닌자가 될 거예요!\" 라고."
10011025-60 = "무, 물론 그럴 때마다 부장님은 어, 어디 이상한 사람에게 속은 거 아니냐, 라고."
10011025-61 = "[s] \"아…….\""
10011025-62 = "아, 아, 아니! 그, 그니까! 제 말은 선생님이 수, 수상하다는 게 아니라!"
10011025-63 = "마, 만나기 전에! 네-! 만나기 전에 그런 생각을 했단 거니까요!"
10011025-66 = "무, 물론 그런 말을 할 때의 이즈나 쨩. 무척 눈부셔서……"
10011025-67 = "걱정보다는, 나도 만나보고 싶구나~ 라고 새, 생각을 했달까. 그게……."
10011025-68 = "[s3] \"어때, 직접 보고 나니까. 놀랐어?\"\n[s4] \"어때, 역시 보고 나니까. 실망했어?\""
10011025-72 = "아, 아뇨! 그런 게 아니라……"
10011025-73 = "……선생님은, 저희가 갑자기 찾아갔는데도, 그, 전혀 놀라시지 않고…… 그리고."
10011025-74 = "[s] \"그리고?\""
10011025-75 = "나무라시지도, 혼내시지도 않고…… 무엇보다 닌자-라고 말했는데도"
10011025-76 = "……비, 비웃지도 않으셔서."
10011025-77 = "오히려 음양부에게 찾아갔을 때, 저희를 위해, 직접 그런 말씀까지 해주셨을 때."
10011025-78 = "좀 놀랐어요."
10011025-79 = "……세상엔 선생님 같은 분도 있구나. 라고, 그걸 알게 되고 나니까. 그게……"
10011025-80 = "그게 기뻤어요."
10011025-81 = "이즈나 쨩도 부장님도 기뻐하고 있을 거라고 생각해요."
10011025-82 = "[s] \"같은 동아리 멤버끼리, 사이가 좋은가 보네.\""
10011025-83 = "아……"
10011025-84 = "네, 넷!"
10011025-85 = "처, 처음엔 이, 이런 제가 동아리에 있어도 될까. 거, 걱정도 많이 했지만."
10011025-86 = "이즈나 쨩도 좋아하고, 저 같은 애를 동아리로 받아준 부, 부장님도 무척 조, 존경하고 있어요!"
10011025-87 = "굼뜨고…… 느리기만 하던 저에게, 부장님은……"
10011025-90 = "츠쿠요라고 했었지?"
10011025-93 = "!!"
10011025-95 = "이런 저라도……"
10011025-96 = "그, 그러니까! 그, 열심히 하고 싶어요!"
10011025-97 = "닌자의 철칙에 따라, 저도, 지지 않도록……!"
10011025-101 = "하, 하지만……. 그, 그게 좀처럼 마음 같이 되지 않는 달까……."
10011025-102 = "오, 오늘 공연도 여, 열심히 성공시켜야겠다. 고 마음 먹었달까……."
10011025-103 = "[s5] \"……응, 그래.\"\n[s6] \"응, 츠쿠요는 잘 할 수 있을 거야.\""
10011025-106 = "네, 네엣. 그, 그럴까요……."
10011025-109 = "앗! 주군! 츠쿠요 공!"
10011025-110 = "둘 다~ 너무 늦잖아~! 이미 준비는 다 끝났다구~!"
10011025-111 = "앗! 가, 갈게요!"
