[translation]
2003703-1 = "폴리스 스토리-유수풀 편"
2003703-3 = "오, 선생! 같이 순찰하려고 왔어?"
2003703-4 = "잘됐네! 함께 하면 두 배로 즐겁, 아니 철저하게 돌아볼 수 있을 테니까!"
2003703-5 = "특별히 순찰 활동에 동행할 수 있도록 해 줄게!"
2003703-6 = "[s1] \"그런데 어째서 튜브를 가지고 있는 거야.\"\n[s2] \"일하는 거 아니었어?\""
2003703-9 = "물론 이 튜브도 라이프가드 임무에 필요한 물건이지."
2003703-10 = "생각해 봐. 오늘 파크 본부가 준 임무는 파크 전체를 돌아보며 순찰하는 것."
2003703-11 = "그렇다면 당연히 이동 수단이 있어야 하지 않겠어?"
2003703-12 = "[s] \"그 말인즉슨, 튜브를 타고 돌아다니겠다?\""
2003703-13 = "바로 그거지!"
2003703-14 = "이 워터파크, 엄청나게 긴 유수풀이 파크 전체를 휘감고 있단 말이지."
2003703-15 = "저절로 흘러가는 물에 튜브를 띄우고, 몸을 맡기면 그대로 OK. 귀찮게 물장구를 칠 필요조차 없다구."
2003703-16 = "꿈에서나 그리던 자동 순찰 시스템 완성이라는 거야!"
2003703-17 = "[s3] \"……결국 놀 생각이라는 거네.\"\n[s4] \"그거, 그냥 물놀이 아냐?\""
2003703-20 = "어허, 물놀이라니! 이것도 엄연한 공무 활동의 일환이라고!"
2003703-21 = "물론 아주 시원하고 즐거운 공무 활동이 되겠지만."
2003703-22 = "그럼 순찰을 시작해 볼까. 우선 튜브를 바닥에 두고……."
2003703-27 = "읏차!"
2003703-33 = "……어라?"
2003703-36 = "[wa:700]― [log=후부키 수영복]어, [wa:1090]어라라……?[/log]"
2003703-39 = "[wa:1170]― [log=후부키 수영복]으그그그그긋![/log]"
2003703-40 = "[wa:3020]― [log=후부키 수영복]……[wa:770]크흑.[/log]"
2003703-43 = "[wa:1430]― [log=후부키 수영복]아, [wa:1040]안 빠져……[/log]"
2003703-44 = "[wa:2390]― [log=후부키 수영복]평생 [wa:1480]이렇게 살아야 하는 건 아니겠지……?[/log]"
2003703-47 = "[wa:1430]― [log=후부키 수영복]저기, [wa:580]선생.[/log]"
2003703-48 = "[wa:1300]― [log=후부키 수영복]좀 도와줘![/log]"
2003703-51 = "― [log=후부키 수영복]앞으로는 땡땡이도 덜 치고,[/log]"
2003703-52 = "[wa:2730]― [log=후부키 수영복]일도 열심히 할 테니까…….[/log]"
2003703-55 = "[wa:900]― [log=후부키 수영복]그리고 [wa:1200]숨겨둔 도넛도 줄 테니까![/log]"
2003703-58 = "― [log=후부키 수영복]히익!?[/log]"
2003703-59 = "[wa:920]― [log=후부키 수영복]뒤, [wa:620]뒤쪽에서 손대는 건 [wa:1540]좀!?[/log]"
2003703-62 = "(결국 후부키가 튜브에서 빠져나올 수 있도록 도와주었다.)"
2003703-64 = "헉, 헉……."
2003703-65 = "정말 못 빠져나오는 줄만 알았어."
2003703-66 = "당분간 튜브는 못 타겠는걸……."
2003703-67 = "[s] \"그럼 성실하게 걸어서 순찰해야겠지?\""
2003703-68 = "걸어서 순찰이라……역시 귀찮은데."
2003703-73 = "그럼, 튜브 대신 구명조끼를 입으면 되는 거 아닐까?"
2003703-75 = "(이후 계속 농땡이 치려는 후부키를 데리고 파크를 순찰했다.)"
