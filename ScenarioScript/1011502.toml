[translation]
1011502-1 = "특별한 훈련 1"
1011502-2 = "(레이의 권유에 따라, 밀레니엄 야구부의 훈련장으로 향했다.)"
1011502-9 = "아, 오셨군요. 선생님! 감사드립니다!"
1011502-10 = "[s1] \"초대받았으니까 말이지! 하이터치?\"\n[s2] \"아니면 로우터치!?\""
1011502-11 = "네! 하이터치! 에헤헤."
1011502-12 = "로우터치! 손을 아래로 내려서…… 됐어요!"
1011502-13 = "그러면 지켜봐 주세요, 선생님."
1011502-15 = "오늘의 훈련, 시작하겠습니다!"
1011502-20 = "(그렇게 레이는 힘차게 훈련장으로 들어갔지만…….)"
1011502-27 = "<쓰리 스트라이크…… 아웃!>"
1011502-28 = "큭……! 여기에서 승부수로 오히려 직구를 던지다니, 역시 밀레니엄제 훈련 보조원……!"
1011502-29 = "하지만 다음에야말로!"
1011502-35 = "보였다!"
1011502-39 = "<좋은 타구입니다. 노마사 레이 양. 하지만 각도가 조금 높군요.>"
1011502-40 = "<플라이 아웃. 수고하셨습니다.>"
1011502-41 = "하아……."
1011502-45 = "<땅볼입니다.>"
1011502-46 = "윽……!"
1011502-49 = "<내야 플라이.>"
1011502-50 = "제발 좀……!"
1011502-54 = "<헛스윙. 삼진입니다.>"
1011502-55 = "이익……!"
1011502-64 = "수고하셨습니다……."
1011502-65 = "으으, 오늘도 좀처럼 맞지 않네요."
1011502-66 = "맞았나 싶은 공은 모조리 플라이나 땅볼, 아니면 직선타였고."
1011502-67 = "그나마 무안타는 아니었으니 다행이라고 생각해야 할까요……."
1011502-68 = "[ns] \"뭐가 문제일까?\""
1011502-69 = "……."
1011502-70 = "답이라면, 알고 있어요."
1011502-71 = "[s] \"어, 정말?\""
1011502-72 = "네에, 뭐. 결국은 타이밍 문제죠."
1011502-73 = "타격은 타이밍이고, 투구는 타이밍을 뺏는 것이라는 말도 있고요."
1011502-77 = "……아닌가? 반대였나?"
1011502-78 = "아무튼, 그래요. 공은 투수의 와인드업 동작부터 특정 타이밍으로 날아오는 법이고."
1011502-79 = "거기에 맞춰서 딱 좋을 때에 배트를 휘둘러야 하는데……."
1011502-80 = "으으, 역시 쉽지 않네요. 볼이 직구인지 변화구인지, 변화구라면 어떤 구종인지도 읽을 줄 알아야 하는 데다."
1011502-81 = "가끔은 동체시력 자체는 따라갔는데, 잡념이 넘쳐서 몸의 반응이 늦는 경우도 생기곤 하니……."
1011502-82 = "[ns3] \"타이밍, 타이밍이라…….\"\n[ns4] \"그러면, 타이밍 훈련을 해 보자!\""
1011502-85 = "네? 타이밍 훈련이요? 그런 게 있나요?"
1011502-86 = "그것만 특별히 할 수 있는 훈련이 있다면, 정말로 좋겠지만……."
1011502-87 = "그런 훈련이 있었다면, 왜 아직까지 아무도 몰랐던 걸까요?"
1011502-88 = "여기에서 필요한 것은 발상의 전환이라고요? 일단 믿고 따라와 보라고요?"
1011502-89 = "서, 선생님? 믿어도 되는 거죠? 알겠어요. 갈게요! 갈 테니까 그렇게 어깨를 밀지 않으셔도……!"
1011502-95 = "여기는…… 게임 센터잖아요!?"
1011502-96 = "어떻게 봐도 타이밍 훈련 같은 것과는 조금도 관계없어 보이는데요?!"
1011502-97 = "[s] \"그렇지 않아, 레이. 타이밍이라면, 리듬 게임이니까!\""
1011502-98 = "리듬…… 게임이요? 그건 또 뭔가요? 저는 사실 이런 곳에는 거의 와 본 적 없어서……."
1011502-99 = "일단 해 보면 알게 될 거라고요? 으으……."
1011502-100 = "알겠어요. 선생님만, 믿을게요……."
1011502-102 = "(그렇게 우리는 게임 센터 안으로, 포부도 당당하게 걸어 들어갔다.)"
1011502-103 = "(사실은 레이의 스트레스와 긴장을 풀어주려는 속셈도 있었지만…….)"
1011502-104 = "과연, 이것이 리듬 게임이군요."
1011502-105 = "특정 버튼을, 떨어지는 막대기 모양의 노트에 맞춰, 정확한 타이밍에 눌러야 하는 게임……."
1011502-106 = "……확실히, 타이밍 훈련의 요소를 갖추고 있네요. 생각도 못 했어요."
1011502-107 = "네? 사실 리듬 게임에는 다른 종류도 엄청나게 많아, 북을 치거나 기타를 연주하거나, 심지어 드럼을 치는 게임도 있다고요……?"
1011502-108 = "거기까지 가면 이미 타이밍 훈련과는 완전히 동떨어진 무언가가 될 것 같네요. 저는 완전히 처음 해 보는 초보자이기도 하고요."
1011502-112 = "그러면 일단은, 선생님께서 소개해 주신 이 게임부터……."
1011502-114 = "(그렇게 레이는, 태어나서 처음 해 본다는 리듬 게임을 조심스럽게 시작했다.)"
1011502-115 = "(그리고…….)"
1011502-123 = "여기, 여기, 여기서 길게 누르고, 다시 저기…… 좋아. 이대로……!"
1011502-134 = "저기 봐. 저기! BearMania IDX 플레이하는 학생!"
1011502-135 = "저거 3일 전에 들어온 레벨 12곡이잖아? 저게 사람이 클리어할 수 있는 곡이었어?"
1011502-145 = "3일 만에 채보를 다 외웠을 리는 없을 테니…… 세상에, 그러면 저거 다 눈으로 보고 치는 거야?!"
1011502-146 = "여기서 엇박자로 꼬았네…… 그리고 난타 패턴…… 보였다!"
1011502-169 = "선생님! 마지막 난이도까지 끝냈어요! 어라, 그런데……?"
1011502-173 = "이 사람들은…… 다 누구죠?"
1011502-174 = "[s5] \"어…… 일단 축하해, 레이!\"\n[s6] \"게임 센터 역대 랭킹 1위야, 레이!\""
1011502-177 = "네?! 저는 그냥 보이는 대로 타이밍에 맞게 쳤을 뿐인데, 1위라고요?"
1011502-178 = "그러면 이 사람들은, 모두……."
1011502-179 = "들었어? 그냥 보이는 대로 타이밍 맞게 쳤대!"
1011502-180 = "리듬 게임이 타고나야 하는 부분이 많다지만, 그게 되는 사람이 진짜 있구나……."
1011502-181 = "이 정도면, 리듬 게임 한정이겠지만, 전설의 그 게이머…… UZQueen과도 스코어링 승부를 해 볼만 할지도 몰라!"
1011502-182 = "조금 전에 선생님이 '레이'라고 불렀지? 그러면 이건 '레이 퀸'의 탄생인 건가?!"
1011502-186 = "어, 어어……?"
1011502-187 = "저, 저기요……? 괜찮으시면 혹시, 같이 사진 찍어줄 수 있으세요……?"
1011502-188 = "네?! 저, 저는 그럴 만 한 사람도 아니고, 애초에 제 분야는 게임이라기보다 야구이고……."
1011502-189 = "이, 일단 이건 야구가 아니고, 그러니까 아무래도 곤란하다고 할까 죄송스럽다고 할까……"
1011502-193 = "으아아아–! 죄송해요, 정말 죄송하지만 저는 여기서 이만–!"
1011502-200 = "헉, 헉, 헉……."
1011502-207 = "[ns7] \"헥, 헥, 헥…….\"\n[ns8] \"역시 야구선수, 빠르구나…….\""
1011502-210 = "으, 아? 선생님?! 죄송해요! 저만 혼자 도망치듯 빠져나와 버려서……!"
1011502-211 = "거기에 선수치고는 그렇게 빠른 편도 아니고요, 저……."
1011502-212 = "으으, 놀랐어요. 생각해 보면 실제 야구 경기에서는 그것보다 더 많은 사람들이 모이는데."
1011502-213 = "뭔가, 그렇게까지 주목받아 본 적이 없어서 놀랐다고 할까요, 너무 뜻밖이어서 당황했다고 할까요……."
1011502-214 = "[s] \"응……. 미안해, 레이.\""
1011502-215 = "네? 선생님께서 왜 사과하시는 거죠? 그러실 필요가……."
1011502-216 = "애초에, 저에게 리듬감을 찾아 주기 위해서 특별한 훈련 방법을 권해 주셨던 거잖아요?"
1011502-217 = "그렇지만 결과적으로 저를 너무 놀라게 한 것 같아 미안하시다고요……?"
1011502-218 = "아, 아니에요! 그건 선생님 탓이 아니라, 제가 너무 놀랐던 탓이 더 크고! 거기에……."
1011502-219 = "……제가 그 자리를 피했던 건, 물론 당황해서도 있지만, 저와 '전장(戰場)'이 달랐던 게 더 큰 이유였으니까요."
1011502-220 = "단어가 너무 거창한 것 아니냐고요? 그럴 리가요!"
1011502-221 = "이것만은 말씀드려야 하겠네요. 야구는, 전쟁입니다!"
1011502-222 = "그리고 자신의 모든 것을 걸고 노력하는 모든 사람들에게, 그 사람들의 분야는 그 자체로 전장이고요!"
1011502-223 = "그렇게 생각하고 나니, 리듬 게임이라는 분야에서 싸우는 분들에게…… 뭔가, 실례가 되는 거 아닐까, 하는 생각이 들어서요."
1011502-224 = "으, 다시 생각해 보니 제가 말을 좀 헷갈리게 한 것 같네요. 죄송합니다."
1011502-225 = "[s9] \"괜찮아, 괜찮아.\"\n[s10] \"레이는 정말 야구에 진심이구나.\""
1011502-228 = "그, 그렇게 봐주시면 감사하고요. 헤헤."
1011502-229 = "어쨌든…… 저, 조금이지만 자신감을 얻은 것 같아요!"
1011502-230 = "선생님 덕분에 리듬감을 찾았다는 느낌이, 팍! 하고 왔거든요!"
1011502-231 = "지켜봐 주세요, 선생님. 이번 타격 훈련은 분명…… 잘될 것이 분명하니까요!"
1011502-233 = "(레이는 그렇게 신을 내며 훈련장으로 향했고.)"
1011502-234 = "(의외라고 해야 할지, 당연하다고 해야 할지…… 장렬하게 패배했다.)"
1011502-235 = "어째서–?!?!?!"
