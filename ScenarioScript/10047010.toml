[translation]
10047010-1 = "제1화;운명적인 재회"
10047010-4 = "(휴식을 위해 찾은 어느 광장…….)"
10047010-8 = "[ns1] \"멋있어…….\"\n[ns2] \"어디서 들어본 것 같은데……?\""
10047010-12 = "거, 거짓말이지?#n이런 엄청난 연주를, 여고생이……?!"
10047010-13 = "이 데스메탈…… 영혼이 끓어오른다!!"
10047010-17 = "[ns] \"여고생……? 데스메탈……?\""
10047010-22 = "[ns] \"기억난다! 이 연주는 바로……!!\""
10047010-26 = "후후. 감사합니다, 여러분."
10047010-27 = "저는 이상한 나라에서 온 소녀, 시이나 츠무기라고 합니다."
10047010-28 = "사실 그런 동화속의 나라가 실존하는 것은 아닙니다만, 여기선 그런—"
10047010-33 = "—'느낌'."
10047010-34 = "……이 중요하니까요."
10047010-35 = "[ns] \"역시 츠무기였구나!\""
10047010-39 = "어머나, 당신은……."
10047010-40 = "이것은 예상치 못한 운명적인 재회."
10047010-41 = "조만간 반가운 만남이 있을 거라는 <그 아이>의 이야기가 진짜로 일어날 줄이야."
10047010-42 = "과연…….#n운명의 붉은 실은, 픽션이 아니었던 거네요."
10047010-47 = "모처럼의 재회입니다.#n조금, 이야기를 나누지 않겠어요?"
10047010-48 = "마침 오늘의 버스킹도 끝난 참이니까요."
10047010-49 = "[s] \"나야 좋지!\""
10047010-50 = "그럼, 가볼까요."
10047010-51 = "―이상한 나라로."
10047010-52 = "[s] \"이상한 나라라면……\""
10047010-56 = "[ns3] \"공원의 숲 말이야?\"\n[ns4] \"……데스메탈 공연장?\""
10047010-59 = "후후, 장소를 알려드리지 않는 것이 앞으로의 흥미를 위해서 좋겠네요."
10047010-60 = "자, 이쪽으로. 분명 잊지 못할 경험이 될 거예요."
10047010-65 = "자, 어떠신가요? 저와 함께 이상한 나라에 오신 소감이."
10047010-66 = "[s] \"펴, 평범한 디저트 카페 아닌가?\""
10047010-67 = "……선생님. #n<이상함>이란, <보통과 다른 것>을 의미하는 거예요."
10047010-68 = "우리가 함께 디저트 카페에 온 것은 오늘이 처음이기에,#n충분히 보통과 다른 이상한 상황 아닐까요?"
10047010-69 = "[s] \"그렇게 말하니 그런 것 같기도…….\""
10047010-70 = "하지만 학생과 선생님의 관계가 이상함으로 묶여 있으면 그것 또한 안타까운 일."
10047010-71 = "그러니…… 어떤가요?#n이야기를 하나, 진행해 보는 건."
10047010-72 = "[s] \"서로에 대해 알아가고 싶다는 거지?\""
10047010-73 = "후후, 그렇게 말씀하시니 마치 제가 데이트 신청이라도 하는 것 같네요."
10047010-74 = "딱히 부정하진 않겠습니다. 여기선 그런—"
10047010-79 = "—'감성'."
10047010-80 = "……이 중요하니까요."
10047010-81 = "그런 의미에서 질문."
10047010-82 = "지난번 저의 공연, 즐겁게 잘 즐기셨었나요?"
10047010-85 = "인간이 죽는 것이 사회복지다아아아—!!!!"
10047010-86 = "우우워우우우어어어어어—!!!"
10047010-89 = "선생님?"
10047010-90 = "[s5] \"아, 그게…….\"\n[s6] \"즈, 즐거웠어…….\""
10047010-93 = "후후, 다행이네요."
10047010-94 = "그땐 뒤풀이에 초대하지 못해 죄송했습니다.#n멤버가 낯을 가려서……."
10047010-95 = "언젠가 기회가 된다면 모두 소개해 드리고 싶네요."
10047010-96 = "[s] \"모두 와일드헌트의 밴드부인 거지?\""
10047010-97 = "아뇨. 다양한 학교의 학생들이 모여 결성된 밴드랍니다."
10047010-98 = "와일드헌트에는 밴드부가 없으니까요."
10047010-99 = "후훗, <예술학원>인데, 이상하죠?"
10047010-100 = "사실 저희 와일드헌트에는 공식적인 부활동이 없답니다."
10047010-101 = "다들 자신의 학과에서 좋아하는 예술활동을 충분히 즐기고 있으니까요. 별도의 부활동은 필요 없는 셈이죠."
10047010-102 = "그럼에도 별도의 활동이 필요하다 생각된다면, 저처럼 허가를 받고 외부 활동을 하거나……."
10047010-103 = "학교 내에서 같은 취미를 가진 사람끼리 모여, 몰래 활동하는 아이들도 있어요."
10047010-104 = "후후, 저희 학원에 대해 말씀드리고 싶은 게 많지만, 그러기엔 여백이 부족하네요."
10047010-105 = "간단하게 비유하자면, 예술가들을 위한 <꿈과 희망의 원더랜드>라고 해야 할까요?"
10047010-106 = "[s] \"꿈과 희망의 원더랜드……?\""
10047010-107 = "꿈과 결의를 가지고 입학해, 원하는 대로 추구할 수 있는 학원이니까요."
10047010-111 = "아, 그래요. 궁금하신 것이 많다면 차라리……."
10047010-115 = "선생님. 츠무기는 오늘부터 선생님의 토끼가 되겠어요."
10047010-116 = "[s] \"그건…… 무슨 의미……?\""
10047010-117 = "한 소녀를 원더랜드로 이끌었던 토끼처럼, 제가 선생님을 와일드헌트로 안내하겠어요."
10047010-118 = "정말로 제가 토끼인 건 아니지만, 여기서는 그런—"
10047010-123 = "—'분위기 형성'."
10047010-124 = "……이 중요하니까요."
10047010-125 = "그래요. 함께 학원을 둘러보며 다양한 이야기를 나누는 거예요."
10047010-126 = "저의 기숙사 친구들도 소개해 주고 싶고요."
10047010-127 = "모두 선생님과 만나는 걸 무척 기대하고 있답니다."
10047010-128 = "[s] \"오오! 츠무기의 친구들! 나도 기대돼!\""
10047010-129 = "후후, 그럼 이걸로 결정이네요."
10047010-130 = "지금 당장은 시간이 애매하니, 다음에 약속을 잡고 느긋하게 학원을 둘러보죠."
10047010-131 = "저는 선생님의 토끼가 되기로 했으니, 바니걸 코스튬으로 기다리고 있겠어요."
10047010-132 = "[s] \"구, 굳이 그러지 않아도 괜찮아!\""
10047010-133 = "정말요? 아쉬워라……."
10047010-134 = "바니걸과 기타는#n<이쪽>에서는 나름대로 역사가 있는 조합이거든요."
10047010-135 = "선생님께도 꼭 보여드리고 싶었는데……."
10047010-136 = "[s7] \"이번에는…….\"\n[s8] \"평범한 모습으로 부탁하고 싶어.\""
10047010-139 = "후후, 그건 다음의 즐거움으로 남겨둬야겠네요."
10047010-140 = "슬슬 주문할까요. 메뉴는……."
10047010-145 = "와, 선생님. 이 메뉴 설명 좀 보세요."
10047010-146 = "한입 베어 물면 정신이 혼미해지는 악마의 디저트 모음이라니."
10047010-147 = "특히 이쪽의 베리베리 케이크는 보기만 해도 뇌가 말랑해지는 기분이네요."
10047010-148 = "[s] \"베리가 케이크보다 두껍게 올라가 있는데……?\""
10047010-149 = "베리가 눈알처럼 보이는 것도, 정말 챠밍하네요."
10047010-153 = "그러고 보니, 기숙사에 이것과 비슷한 액세서리를 좋아하는 선배가 있어요."
10047010-154 = "그 외에도 항상 마녀 모자를 쓰고 있는 아이나, #n개성적인 패션의 아이……."
10047010-155 = "후후, 선생님도 조만간 만나게 되겠네요."
10047010-156 = "[s9] \"개성적인 아이들이네.\"\n[s10] \"재밌어 보이는 아이들이네.\""
10047010-163 = "(이때까지만 해도 알지 못했다…….)"
10047010-166 = "(이야기는 이미 시작되었다는 것을…….)"
