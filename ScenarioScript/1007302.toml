[translation]
1007302-1 = "어울리지 않는 모습"
1007302-4 = "(캠프 주변에서 우이를 찾지 못해 꽤 많은 곳을 돌아다녔다.)"
1007302-11 = "(좀 떨어진 곳의 해변가 한 귀퉁이, 바위 사이에 앉아 있던 우이의 모습을 발견했다.)"
1007302-15 = "[ns1] \"이런 곳에 있었구나.\"\n[ns2] \"무슨 일 있어? 우이?\""
1007302-20 = "……어."
1007302-21 = "선생님……? 어째서 여기에……. 아니, 그 이전에……."
1007302-22 = "어떻게 찾으신 건가요……. 그리 쉽게 찾을 수 있는 곳은 아니었을 텐데……."
1007302-23 = "……네?"
1007302-24 = "계속 찾고 있었다고요? 계, 계속이라니 언제부터……."
1007302-29 = "……모모톡 보냈을 때부터요!?"
1007302-30 = "아, 아니……. 왜……. 왜 그러신 거예요……."
1007302-31 = "말씀드렸잖아요, 아무 일 없다고……. 문제가 있어도 제 쪽이라고……."
1007302-32 = "선생님이 이러시면……. 제가 곤란해지는데요……."
1007302-33 = "[s3] \"내버려 두는 건 내가 곤란한걸.\"\n[s4] \"좋아서 한 일이니 신경 쓰지 마.\""
1007302-36 = "또, 또 그렇게 말씀하시고……. 으으……."
1007302-37 = "아……. 그래서 왜 여기 있었냐고요?"
1007302-38 = "그건……."
1007302-39 = "뭔가 이제 와서 말하려니 오히려 더 부끄러워지는데……. 진짜 별거 아니라서……."
1007302-43 = "하아……."
1007302-47 = "그냥, 그……. 뭐랄까……. 옷도 장소도, 저한테는 전혀 어울리지 않는 곳이다 보니……."
1007302-48 = "그래서 괜히 창피해진달까……. 그런 이야기였어요."
1007302-49 = "보시다시피 저는 다른 분들처럼 매력이 있는 것도 아니고, 화사한 얼굴도 아니고……."
1007302-50 = "당연히 스스로도 알고는 있으니까요. 주변에서 어떻게 보는지, 제가 어떤 분위기를 풍기고 있는지 정도는."
1007302-51 = "그나마 고서관이나……. 실내라면……. 그리고 이런 휑한 옷이 아니라면 그래도 좀 낫지만……."
1007302-52 = "지금은, 그, 거의, 그……. 뭐랄까……."
1007302-53 = "그 자체로도 굉장히 부담이 심하네요. 솔직히. ……전혀 대비해 본 적 없는 상황이라."
1007302-54 = "……아."
1007302-55 = "잠시만요. 무슨 말씀 하실지는 알겠지만, 그러지 않으셔도 돼요."
1007302-56 = "선생님이라면 또 보기 좋다느니, 귀엽다느니 좋은 말씀해주시겠죠. 하지만 괜찮으니까요."
1007302-57 = "위로를 받고 싶다는 것도 아니고……. 네. 그런 정도는 구분할 수 있거든요."
1007302-58 = "공감도 못하는 그런 소리 들어 봐야, 오히려 신경만 긁을 뿐이고……."
1007302-59 = "……흐……."
1007302-60 = "……네?"
1007302-61 = "그런 이야기를 하려던 게 아니었다고요……? 그럼……?"
1007302-62 = "[s5] \"오히려 여기니까 편한 게 아닐까?\"\n[s6] \"우이 스스로가 우이를 신경 쓰는 게 아닐까?\""
1007302-65 = "그런……. 그게 무슨 말씀이신지……."
1007302-66 = "으음……. 잠시만요…… 생각을 좀……."
1007302-70 = "……어……."
1007302-71 = "음……. 진짜 그런……가……?"
1007302-72 = "하긴 생각해 보면, 트리니티 시내와 달리……. 막상 여기는 다른 사람들이 없네요……."
1007302-73 = "있다고 해도 같이 온 몇몇 분들뿐이고……."
1007302-74 = "그 사람들이 편하다고까지는 생각하기 어렵긴 하지만, 그렇다고 크게 불편한 것도 아니니까요."
1007302-75 = "[s7] \"응. 사실은 다른 사람들도 비슷해.\"\n[s8] \"원래 그래서 멀리까지 나오는 거야.\""
1007302-78 = "으음……. 다들 비슷하니 멀리 나오는 거다……라."
1007302-79 = "……과연……. 그럴지도 모르겠네요."
1007302-82 = "사람들에게 치이기 싫다는 이유로 사람이 없는 먼 곳까지 온다는 점에서는……."
1007302-83 = "사람들을 피하기 위해 구석으로 숨어드는 저와 크게 다르지 않다는 말씀이시군요."
1007302-86 = "확실히……. 그럴싸하네요……."
1007302-87 = "그럼……. 설마 이런 복장도……?"
1007302-88 = "[s9] \"응. 평소엔 못 입어보는 거잖아.\"\n[s10] \"일탈의 일종이라고 생각하면 어떨까?\""
1007302-91 = "……호오……."
1007302-92 = "일탈이라……. 과연……. 그렇게 생각하면 또, 일리가 있는 거 같기도……."
1007302-93 = "하긴 이런 휑한 복장, 평상시에 입고 다닌다면 보통 머리가 이상한 사람일 테니까……."
1007302-94 = "[s11] \"어, 음. 그건, 음.\"\n[s12] \"………….\""
1007302-97 = "……농담이에요."
1007302-98 = "뭐랄까, 선생님은 정말로 설득을 잘하시네요. 이건 나쁜 의미로 하는 게 아니니 오해하지 말아 주셨으면 해요."
1007302-99 = "입에 발린 말로 속여 넘긴다는 느낌이 아니라서, 대화를 하고 있으면 마음이 편해지거든요."
1007302-100 = "……진심입니다."
1007302-101 = "똑같이 설득을 해도 공감되지 않는 말을 반복하기만 하면 공허해질 뿐이잖아요?"
1007302-105 = "많이 들었거든요. 그런 식의 말들. 빈말 섞인 칭찬, 비위 맞추기 위한 찬사……."
1007302-106 = "듣다 보면 자연스레 깨닫게 돼서, 그런 대화들이 전부 다 시간 낭비처럼 느껴져서……."
1007302-107 = "저도 모르게 조금씩 거리를 두게 되고. 가짜 관계를 밀어내고."
1007302-108 = "정신을 차리고 보니, 지금 같은 녀석이 돼 있었던 거죠."
1007302-109 = "음침하고 사람 꺼리고, 혼자 있고 싶어 하고 남에게 뭐든 꼬투리 잡히기 싫어하는 녀석."
1007302-110 = "오히려 잔소리 많고 직설적인 후배들이나 그나마 좀 남아서……. 고맙게 상대해 주는 관계."
1007302-111 = "……불쌍하죠. 딱하죠. 네. 그게 지금의 제 모습."
1007302-112 = "그런데도……. 굳이 찾아오는 사람들이 극소수 있네요. 이유는 모르겠지만요."
1007302-113 = "다 괴짜들이에요. 진짜……."
1007302-114 = "이런 녀석도 선배라고 매번 찾아와서 상대해 주는 후배 녀석들이나, 뭐가 좋다고 제 문제를 해결해 주려고 이런 자릴 따라온 사람들이나."
1007302-115 = "……선생님도 마찬가지예요. 아니, 그런 면에선 제일 심하죠."
1007302-116 = "[s13] \"아아. 물론 알고 있어. 걱정하지 마.\"\n[s14] \"그 부분은 유유상종이라고 해둘까.\""
1007302-121 = "……흐……."
1007302-122 = "……흐흐……. 참 나……."
1007302-123 = "……네."
1007302-124 = "……그럼 그런 걸로 하죠."
