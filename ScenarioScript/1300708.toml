[translation]
1300708-1 = "고독하지 않은 미식가"
1300708-2 = "산해경 학원 인근 중화거리"
1300708-3 = "하아~ 정말 맛있었어!"
1300708-4 = "들은 소문대로 이 중화가의 요리는 뭐든지 맛있네!"
1300708-5 = "볶음밥도, 차슈도, 고기만두도…… 모두 일품이야!"
1300708-6 = "일부러 멀리서 찾아온 보람이 있었어, 후후."
1300708-7 = "뭐? 배가 부르니 조금 쉬었다가 가는 게 어떠냐고?"
1300708-8 = "안 돼! 아직 가게의 절반도 들리지 못했단 말이야!"
1300708-9 = "부지런히 돌지 않으면 오늘 내로 모든 음식을 맛볼 수 없다구!"
1300708-10 = "으음…… 하지만 역시 기름진 음식만 먹었더니 속이 조금 느끼하기는 하네……."
1300708-14 = "좋아, 그럼 이 근처의 카페에서 잠깐 쉬었다 갈까?"
1300708-17 = "[wa:2500]― 에, [wa:500]뭐, [wa:800]뭐야. [wa:1200]왜 그렇게 쳐다 봐?"
1300708-19 = "― (……[wa:1000]정말이지…….)"
1300708-22 = "― 잠깐 쉬었다가 [wa:1500]또 먹으러 가는 거지? [wa:2500]다음엔 뭘 먹을까?"
1300708-25 = "[wa:3000]― 맛있어어~♪"
1300708-28 = "― 뭐야?! [wa:1200]같이 먹자고?"
1300708-30 = "― 이상한 소리 하지 마! [wa:1500]죽인다?"
1300708-33 = "― (놀리는 거지, [wa:1500]이거? [wa:1000]그런 거지? [wa:1500]빨대가 하나뿐인데…….)"
1300708-35 = "― (……그렇지만 선생님이라면…… [wa:2000]괜찮을……)"
1300708-38 = "― ……싫어!! [wa:300]안 줘!!"
1300708-41 = "아아~ 잘 먹었다~"
1300708-42 = "오늘 하루는 정말 만족스러웠어. 맛있는 음식도 잔뜩 먹고 말이야!"
1300708-43 = "게다가 선생님이랑 단둘이 함께 식사를 할 수 있어서 더……."
1300708-44 = "차, 착각하지 마! 맛있는 음식을 먹는 건 혼자서도 충분하니까!"
1300708-45 = "하지만 역시…… 음식은 혼자 먹는 것보다는 둘이 더…… 즐거우니까……."
1300708-46 = "다음에도 같이, 밥 먹으러 와줄 수 있어?"
1300708-47 = "[s] \"물론이야.\""
1300708-51 = "정말? 약속한 거다! 꼭이야, 꼭!"
1300708-53 = "이후 즐거워하는 준코와 함께 학교로 돌아왔다."
