[translation]
10000085-2 = "아코!"
10000085-3 = "너, 너무 강합니다앗!"
10000085-8 = "상인회장으로서 가용할 수 있는 모든 자금을 뿌려 모은 망량즈가……."
10000085-9 = "이 정도의 망량즈를 동원해도…… 역부족이라고?"
10000085-10 = "선생님의 지휘도 있었고, 지금의 우리라면 얼마든지 상대할 수 있다구요!"
10000085-11 = "이것이 우리들의 힘! 입니다!"
10000085-13 = "[ns] \"우리가 이겼어.\""
10000085-14 = "……후후. 정말 놀랍군."
10000085-15 = "내가 수년에 걸쳐 계획한 일이, 고작 학생과 선생 하나 때문에 실패한다고?"
10000085-16 = "아니, 인정할 수 없다……"
10000085-18 = "인정하지 않겠다!"
10000085-19 = "잠자코 포기해요. 냥텐마루 상인회장. 당신의 그 잘난 계획도 다 끝이니까요."
10000085-20 = "후후후, 끝이라고? 아니! 아직 끝나지 않았다!"
10000085-21 = "여기 모은 망량즈가 내가 불러들인 망량즈의 전부라고 생각하나?"
10000085-22 = "뭐, 뭐야?"
10000085-23 = "설마…… 아직도 망량즈가 더 남아있다는 건가요……?!"
10000085-24 = "크흐흐. 그래, 내가 오늘을 위해 얼마를 썼다고 생각하지?!"
10000085-25 = "망량즈! 이 거리에 모인 모든 망량즈를 전부 호출해라!"
10000085-27 = "100명이 넘는 망량즈의 무리, 즉 이매망량즈로! 이번에야말로 네놈들을……!"
10000085-29 = "아, 미안. 보스."
10000085-30 = "원래 오기로 했던 애들 중에 당일날 못 오겠다고 한 애들이 있어서……."
10000085-31 = "여기서 일하는 것보다, 백야앵제를 즐기는 게 더 재밌다고 한 애들도 많았슴다."
10000085-35 = "……."
10000085-36 = "……"
10000085-37 = "우와……"
10000085-38 = "어머……"
10000085-39 = "흐아암."
10000085-40 = "이거 아무래도……?"
10000085-41 = "보스가 진 거 같슴다."
10000085-42 = "……으음! 좋았어! 모두 도망쳐!"
10000085-44 = "앗?! 치사하게 여기서 도망치는 거야?!"
10000085-45 = "거~기~서!"
10000085-47 = "……."
10000085-50 = "(샥!)"
10000085-51 = "그, 어, 없던 일로 하면 안 될까? 자네들?"
10000085-52 = "이제 와서 그게 되겠냐아아앗! 시즈코 진심 펀치!"
