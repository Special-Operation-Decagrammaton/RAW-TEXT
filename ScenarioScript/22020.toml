[translation]
22020-1 = "제2화;게임개발부의 평범한 일상"
22020-3 = "(그날따라 드물게도 샬레의 업무가 없어 마침 여유가 생겼던 어느 날.)"
22020-4 = "(게임개발부로부터 부활동에 어울려 달라는 연락을 받게 되었다.)"
22020-5 = "(부활동이라고 해도 무엇을 말하는 것인지 자세한 설명은 듣지 못한 채.)"
22020-9 = "밀레니엄 게임개발부"
22020-15 = "으랴아앗! 각오해! 선생님!"
22020-16 = "지금부터 나만의 비장의 필살기……!"
22020-17 = "모모이 스플래쉬를 보여줄 테니까……!!"
22020-18 = "(정신을 차려보니 어느새인가 모모이와 대전격투 게임을 플레이하게 되었다.)"
22020-19 = "[s] \"모모이 비장의 필살기……!!\""
22020-28 = "후후후! 내 비정한 콤보 공격에 사각은 없어! 선생님의 HP가 제로가 될 때까지! 멈추지 않을 거야!"
22020-29 = "이야아압!"
22020-43 = "(쿵! 털썩!)"
22020-47 = "「Player MOMORIA LOSE!」"
22020-51 = "「WINNER! Player [USERNAME]!」"
22020-57 = "우와아앙! 어째서 내 콤보 공격이 하나도 맞지 않고 전부 빗나가는 건데?!"
22020-58 = "[s1] \"그야 모모이는 마음이 급해지면 일단 버튼부터 눌러버리니까…….\"\n[s2] \"욕심만 가득한 그런 콤보 공격 따위! 통하지 않는다고! 모모이!\""
22020-61 = "뭐, 뭣이라?! 이미 나의 공격패턴은 전부 선생님에게 간파당해버렸다는 거야?!"
22020-62 = "심지어 선생님은 오늘 이 게임을 처음 해보는 입문자라고 했었지. 언니."
22020-63 = "우왓?! 너무 비정한 현실을 들이밀지 말아줘! 미도리!"
22020-64 = "지금 건 무효! 무효니까!"
22020-65 = "한 판만! 한 판만 더 해! 선생님! 다음번엔 정말로 내 비장의 콤보를……."
22020-66 = "[s] \"그런 말도 벌써 8판째야. 모모이…….\""
22020-67 = "어?! 벌써 그렇게나?!"
22020-68 = "맞아, 언니. 적당히 해 둬. 선생님이 곤란해하시잖아."
22020-69 = "하, 하지만 이대로 진 채로 넘기는 건, 게, 게이머의 자존심이……"
22020-70 = "또 그런 억지를……."
22020-71 = "게다가 그 말은, 그럼 선생님은 진 채로 끝내도 된다는 거야?"
22020-72 = "우뮤얏?! 말이 또 그, 그게 그렇게, 되나……?"
22020-73 = "[s] \"난 괜찮은데.\""
22020-74 = "하아. 선생님. 너무 언니의 어리광을 받아 주시기만 하면 안 된다구요?"
22020-75 = "그보다 이렇게 놀 생각만 잔뜩인 거 보면 혹시라고는 생각하지만, 언니……."
22020-76 = "오늘 부활동의 목적, 잊은 거 아냐?"
22020-78 = "헉, 맞다……!"
22020-79 = "……맞다?"
22020-80 = "아, 아냐! 미도리! 확실하게 기억하고 있으니까! 응! 분명!"
22020-81 = "[s] \"그러고 보면 아직 오늘 부활동 내용, 제대로 듣지 못했지.\""
22020-82 = "언니, 설마 선생님에게 제대로 설명도 하지 않고 모셔 왔다는 건……"
22020-83 = "언~~니~~?"
22020-84 = "아, 그, 그거라면 지, 지금! 응! 지금부터 말할 테니까!"
22020-85 = "오늘 부활동의 목적은 다름이 아니라……."
22020-89 = "차기작의 아이디어를 준비하는 거야!"
22020-90 = "[s] \"차기작……?\""
22020-91 = "네, 저희 게임개발부에선 슬슬 다음 차기작을 준비하자는 이야기가 나왔거든요."
22020-92 = "맞아! 그런 의미에서 평소 무지 바쁜 선생님에게 마침 여유가 생겼단 말을 듣고 부른 거야!"
22020-93 = "[s3] \"……자주 찾아오지 못해서 미안해.\"\n[s4] \"확실히 최근엔 일이 좀 줄었지.\""
22020-96 = "뭐, 선생님이 늘 바쁜 건 잘 알고 있으니까……. 오히려 일부러 이렇게 찾아와줘서 고맙다고나 할까~"
22020-97 = "어쨌든! 선생님에게도 차기작의 아이디어에 대해 의견을 들어볼 수 있지 않을까~?"
22020-98 = "선생님이라면 뭔가 굉장한 아이디어를 번쩍! 하고 꺼내줄지도~?"
22020-99 = "라고 동아리의 모두와 이야기를 한 참에……. 이렇게 모셔왔다는 말씀!"
22020-100 = "[s] \"아, 으응……. 뭔가, 기대감이 무겁지만…….\""
22020-102 = "[ns] \"근데 잠깐. 그런 거치고는 아까부터 계속 대전격투 게임만 하지 않았나……?\""
22020-103 = "아, 그건 언니가 의견을 냈던 거예요."
22020-104 = "응! 분석이야! 분석!"
22020-105 = "아무것도 없는 상태에서 머리를 맞대고 끙끙거린다고 한들, 좋은 아웃풋이 나온다는 보장은 없잖아?"
22020-106 = "그러니 여러 인기 게임들을 직접 플레이하면서 분석하고, 그걸 바탕으로 아이디어를 내보자. 이런 흐름이 된 거예요."
22020-107 = "[s] \"과연 일리가 있네.\""
22020-108 = "후후후! 그치?! 특히나 방금 선생님이랑 함께 한 이 게임."
22020-109 = "<카시오페이아의 권 ~우파루파 대열전~>은 대전격투 게임계에서도 여러 가지 의미로 이단아라고 불리는 최고의 인기 게임 중 하나거든!"
22020-110 = "제법 본받을 점이 많은 게임이니까. 이걸 샅샅이 파고들어서 분석한다면!"
22020-111 = "분명 차기작에 걸맞은 멋진 아이디어를 떠올릴 수 있을 거야!"
22020-112 = "무엇보다 저희의 다음 차기작은 <퀘스트를 수주하고 낚시와 농사를 즐기면서 캐릭터를 육성하는 힐링 계열의 던전공략 RPG> 게임이거든요."
22020-113 = "[s] \"어?! 그런데도 대전격투 게임의 요소가 들어가는 거야?!\""
22020-114 = "무슨 소리를 하는 거야. 선생님!"
22020-115 = "물론 범인의 눈으로 보기엔, 얼핏 그런 던전공략 RPG와 대전격투 게임엔 접점이 없어 보일지 몰라도……."
22020-116 = "[s] \"없어 보일지 몰라도……?\""
22020-117 = "후후후! 단순히 겉보기로만 판단하는 건 NG!"
22020-118 = "다음 밀레니엄 프라이스의 수상을 노린다면, 그 누구도 예상치 못할 의외의 도전이 필요해!"
22020-119 = "요컨대 고정관념을 벗어나 선입견을 탈피하고 편견을 뛰어넘어서야 비로소 새로운 지평의 너머로 갈 수 있는……!"
22020-120 = "전혀 연관이 없어 보이는 엉뚱한 두 장르의 요소를 합치면 의외로 재미있는 게임 아이디어가 나올지도 모르니까요."
22020-121 = "앗! 미도리! 내 대사를 빼앗아 가면 어떡해!"
22020-122 = "언니가 자꾸 뜸만 들이고 본론을 말하지 않아서 대신 말한 거뿐이야."
22020-123 = "으앙~ 너무해~"
22020-124 = "[s] \"응. 이러니저러니 해도, 모두 동아리 활동에 매진하고 있구나.\""
22020-125 = "응?"
22020-126 = "아……."
22020-127 = "후후후!"
22020-128 = "그야 당연하지!"
22020-129 = "네, 저랑 언니뿐만이 아니라, 유즈 쨩이랑 아리스 쨩까지 모두 다 함께……."
22020-130 = "다음번엔 반드시 밀레니엄 프라이스의 콧대를 꺾어주겠다고 약속했으니까요."
22020-131 = "응. 그것이 지금 우리에게 주어진…… 말하자면 <퀘스트>인 셈이지!"
22020-137 = "모모이! 미도리! 선생님! 비상입니다!"
22020-138 = "[s] \"안녕, 아리스. 무슨 일이야?\""
22020-139 = "응? 갑자기 왜 그래? 아리스."
22020-140 = "유즈가 드디어 온라인 배틀 10연승 도전에 들어갔습니다!"
22020-141 = "어? 진짜?"
22020-142 = "뭐? 이 밸런스 망겜에서 10연승까지?!"
22020-160 = "「WINNER! Player UZQueen!」"
22020-165 = "후아아………"
22020-166 = "멋있었어! 유즈!"
22020-167 = "유즈 쨩은 언제나 굉장하네."
22020-169 = "아리스도 감탄했습니다! 역시 전설의 용사! UZQueen!"
22020-170 = "앗, 으, 으응……?"
22020-171 = "[s] \"유즈! 굉장해! 퍼펙트한 승리였네!\""
22020-172 = "그치? 퍼펙트한 유즈! 그야말로 <UZQueen모드>야!"
22020-173 = "[s] \"UZQueen, 모드……?\""
22020-174 = "설명하지! <UZQueen모드>란! 유즈가 특정한 상황에 처하면 발동되는 버프 스킬이야!"
22020-175 = "평소보다 더욱 대담해지고 자신감이 넘치게 되고…… 두뇌회전은 평상시의 150%! 동체시력의 성능은 280%나 상승하는 상태를 말해!"
22020-176 = "그런 설정은 또 언제 붙인 거야?"
22020-177 = "아리스도 잘 알고 있습니다! 이럴 때의 유즈는 엄청 강합니다! 아리스도 UZQueen모드 같은 스킬이 갖고 싶습니다!"
22020-178 = "[s] \"굉장해! <UZQueen모드>!\""
22020-179 = "서, 선생님까지?!"
22020-180 = "아, 그, 그게……! 아으으!"
22020-181 = "그, 그냥 평범하게 힘을 냈을 뿐인데……."
22020-182 = "유즈의 활약을 보고 있으려니, 아리스도 가만히 있을 수 없습니다."
22020-183 = "다음은 아리스의 차례입니다!"
22020-185 = "(그리하여 모두가 지켜보는 가운데, 아리스의 대전격투 게임 도전이 시작되었다.)"
22020-187 = "아리스도 모모이, 미도리, 유즈, 그리고 선생님처럼. 대전격투 게임에서 용사가 되겠습니다!"
22020-188 = "언니는 용사라기보다는, 용사에게 당하는 잡몹 역할이었던 거 같지만."
22020-189 = "동생이여! 때로는 진실이 아플 때도 있다고?!"
22020-190 = "아, 아리스 쨩…… 히, 힘내!"
22020-191 = "네! 아리스! 힘내겠습니다!"
22020-192 = "(Challengers Next Battle!!)"
22020-194 = "[ns] \"아, 도전자가 나타났대.\""
22020-196 = "아리스가 모모이를 상대로 단련해온 솜씨를 보여주겠습니다!"
22020-197 = "얍!"
22020-201 = "음! 이얍! 얍."
22020-207 = "상대가 전부 가볍게 회피를……."
22020-208 = "아뇨! 아직 아리스의 공격은 끝나지 않았습니다!"
22020-209 = "이렇게 공격을 맞추면!"
22020-219 = "어?! 방금……"
22020-220 = "방금 아리스가 공격을 맞춘 순간, 어째선지 아리스 캐릭터의 피가 닳지 않았어?"
22020-221 = "아, 아직! 아리스는 할 수 있……."
22020-227 = "[ns] \"앗, 이번엔 캐릭터가……. 사라졌어……?\""
22020-228 = "네, 네엣?"
22020-234 = "이번엔 갑자기 아리스의 뒤에서 나타나서 공격을?!"
22020-235 = "아앗, 앗……! 아읏! 고, 공격!"
22020-241 = "아리스의 공격이 상대를 통과해버렸습니다!"
22020-243 = "우왓?! 이번엔 캐릭터가 투명해졌어?!"
22020-244 = "그다음엔…… 커져서 화면 전체를 가리기까지?!"
22020-245 = "거기다 이번엔 히, 히트박스가…… 사라진 것 같아."
22020-254 = "끄, 끄앙! 아리스! 이 플레이어를 이길 수가 없습니다!"
22020-255 = "[s] \"이거, 아무리 봐도.\""
22020-256 = "뭐냐고! 이 녀석! 치트를 쓰고 있잖아!"
22020-257 = "너무해. 이런 식으로 게임을 해봤자. 즐거울 리가 없는데."
22020-258 = "(Challengers Next Battle Again!!)"
22020-263 = "더구나 보란 듯이 대전을 재신청한다고?! 염치없기는! 어차피 또 치트를 쓰려는 거잖아!"
22020-264 = "……그럼 어떻게 합니까?"
22020-265 = "[s] \"상대가 치트를 쓰고 있다면…… 이길 수 없을지도…….\""
22020-266 = "그냥 거절해! 이런 얼간이랑 어울려줄 필요 없으니까!"
22020-268 = "응, 아리스 쨩. 아쉽지만 이번엔……."
22020-273 = "……아주, 방법이 없는 건, 아니야……."
22020-279 = "[ns] \"유즈?\""
22020-281 = "여, 여기서부턴…… 내게 맡겨줘. 내 계정으로 난입할게."
22020-286 = "3"
22020-288 = "2"
22020-290 = "1"
22020-293 = "(Battle! START!)"
22020-296 = "!!"
22020-302 = "앗! 또 상대방이 투명해지는 치트를 썼어!"
22020-303 = "괜찮아. 아까 확인했던 거지만, 캐릭터의 모델링은 투명해져도, 그림자는 그대로 남아 있어."
22020-304 = "그림자의 길이가 변하는 걸 보고 대처하면 돼."
22020-305 = "[s] \"괴, 굉장해……! 그런 방법이 있을 줄이야!\""
22020-316 = "분명히 공격이 들어갔는데!"
22020-317 = "대미지가 들어가지 않아! 또 무적 치트를……."
22020-318 = "아마도 그건 히트박스를 조정하는 치트일 거야."
22020-319 = "그럼 히트박스와 관계없이 강제적으로 대미지를 주는 기술을 쓰면 돼."
22020-320 = "마침, 내 캐릭터의 도발 스킬엔 방해받지만 않으면 강제적으로 10의 대미지를 주는 기믹이 있으니까……."
22020-341 = "모모이! 미도리! 바, 방금 봤나요?!"
22020-342 = "진짜로……."
22020-343 = "대미지가 들어갔어!"
22020-353 = "[ns] \"앗! 상대가 갑자기 맹공을 시작했어!\""
22020-355 = "괜찮아요. 공격의 프레임을 읽고, 구석에서 가드를 한 채 대기……."
22020-356 = "상대가 공격하면서 타이밍을 놓친 순간에……"
22020-357 = "뒤로 점프하면서 강발을 날리면."
22020-364 = "상대 캐릭터가 그로기 상태에 들어갔어!"
22020-365 = "이 공격으로 견제했을[ruby=Delay Catch] 때, 딜캐를 못[/ruby]하면 절대로 접근할 수 없거든."
22020-366 = "상대의 실력은 그게 가능할 정도까진 아닌 거 같으니까."
22020-367 = "이런 방식으로 하나하나 상대방의 치트를 깨트리다 보면……"
22020-368 = "이길 수 있어."
22020-386 = "「WINNER! Player UZQueen!」"
22020-388 = "후우……"
22020-393 = "응, 이렇게 해서. 이겼지?"
