22020-401 = "과연! 꼼수와 얍삽이도 게임 플레이의 일부! 아리스도 이해했습니다!"
22020-402 = "물론 다음에 또 싸우게 됐을 때, 방금 했던 방식을 무력화하는 치트를 쓰면…… 또 고전하겠지만……."
