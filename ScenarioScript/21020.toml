[translation]
21020-1 = "제2화;세미나 회계 유우카"
21020-2 = "밀레니엄 게임개발부"
21020-4 = "……."
21020-5 = "나왔구나! 학생회의 사천왕 중 하나! 냉혹한 계산의 회계! 유우카!"
21020-6 = "사람과 담당 업무를 무슨 이명을 가진 몬스터 부르듯 부르지 말아 줄래? 실례야."
21020-7 = "그리고……"
21020-8 = "선생님."
21020-9 = "[s] \"반가워, 유우카.\""
21020-10 = "……하아. 뭐, 어쩔 수 없으려나."
21020-11 = "모모이."
21020-13 = "아무래도 포기가 느린 모양이네. 폐부를 막겠다고 '샬레'까지 끌어들이다니."
21020-14 = "하지만, 무의미한 짓이야."
21020-15 = "설령 총학생회의 샬레라 해도, 아니 사라진 총학생회장이 돌아온다 해도!"
21020-16 = "동아리의 운영은 각 학원 학생회의 고유영역이니까."
21020-17 = "게임개발부의 폐부는 이미 결정된 일이야. 누구도 막을 수 없어."
21020-18 = "아, 아직은 아니야!"
21020-19 = "분명히 말했어. 부원을 정족수에 맞추지 못하거나 밀레니엄 동아리로서의 성과를 내지 않으면……"
21020-20 = "부비는 물론 부실 또한 몰수하겠다고. 내가 말했지."
21020-21 = "너희는 부원수도 부족하고, 부활동을 증명할만한 성과도 내지 않은지 1년이 넘었으니……"
21020-24 = "폐부 되어도 이의는 없을 텐데?"
21020-26 = "이의 있소! 많이 있소! 우, 우리도 동아리 활동에 최선을 다하고 있어!"
21020-28 = "그러니, 그 뭐냐. 정상회담이라는 게 필요해!"
21020-29 = "정상참작이겠지. 그보다……"
21020-30 = "웃기지 마!"
21020-32 = "학교 안쪽에 파칭코 파크를 건설해 대규모 도박장을 만들질 않나. 고전게임기를 찾는다며 고대역사연구회를 습격하질 않나……"
21020-33 = "이게 일반적인 여학교 동아리 활동보고서야! 아니! 이딴 민폐 행위나 하며 당당하게 '개발 환경 개선'이라며 부비를 요청하고, 수령했다는 게 용서가 안 돼."
21020-34 = "변명이라도 해봐!"
21020-35 = "때, 때로는 결과보다 의도를 평가받을 필요가 있……"
21020-36 = "그런 패배자들의 변명 따위는 듣고 싶지 않아."
21020-37 = "변명을 하라는 거야 말라는 거야!"
21020-38 = "무의미한 변명은 듣고 싶지 않다는 거야. 밀레니엄에서는 오직 '결과'만이 증명될 뿐이니까."
21020-39 = "결과가 없다니, 섭섭한 말을 하네! 있어! 우리도 게임 만들었단 말야!"
21020-40 = "마, 맞아요! <테일즈 사가 크로니클>은 '어느 공모전'에서 '상위 입상' 하기도 했어요!"
21020-43 = "[ns] \"<테일즈 사가 크로니클>?\""
21020-44 = "……그래…… 수상이긴 하지."
21020-45 = "선생님은 모르셨나 보군요."
21020-46 = "<테일즈 사가 크로니클>…… 게임개발부의 유일한 성과죠."
21020-47 = "게임만큼이나 리뷰들이 인상적이었어요."
21020-48 = "'창조 이래 가장 절망적인 RPG를 만들고 싶었다면, 그들은 완벽한 성공을 거두었다.'"
21020-49 = "'이 게임은 많은 부분이 부족하다. 그중 가장 부족한 무언가는 단언컨대 '제정신'이다.'"
21020-50 = "'맙소사. 나는 이 게임을 플레이 한 이후 데드크림존이 명작이었음을 깨달았다.'"
21020-51 = "우, 우리의 게임은 리뷰어들의 악의로 가득 찬 조롱만으로 평가할 수 없……"
21020-52 = "다수의 평가가, 가장 진실한 결과야."
21020-53 = "그리고 너희의 결과란 <올해의 쿠소게 상>에서 1위를 한 것뿐이니……"
21020-54 = "하, 함부로 말하지 마!"
21020-55 = "[s] \"1위라니. 굉장해!\""
21020-57 = "……"
21020-58 = "……"
21020-61 = "……"
21020-62 = "……어쨌든."
21020-63 = "학교의 명예를 오히려 실추시키는, 너희 같은 부가 부비를 갉어먹는 건 용납할 수 없어."
21020-64 = "너희 때문에 의미 있게 특별활동을 하는 학생들이 지원을 받지 못할 수 있으니까."
21020-65 = "그러니 제대로 된 동아리 활동을 하고 있다고 주장하고 싶다면…… 증명하도록 해."
21020-66 = "증명이라면……?"
21020-67 = "유의미한 결과만 있다면 폐부는 철회해주겠다고, 몇 번이나 말했잖아."
21020-68 = "아. 대회 같은 곳에서 수상을 한다던가?"
21020-69 = "그래. 야구부가 인터하이에 진출하거나 엔지니어부가 발명품을 출품한다던가 같은 거지."
21020-70 = "게임개발부라면 그에 관련된 공모전이 있을 테지만……"
21020-71 = "유감이네. 너희들의 수준은 올해의 쿠소게 1위일 테니까."
21020-72 = "크윽."
21020-73 = "어차피 무리일 테니 서로 편하게 가자. 당장 동아리실을 비워줘. 이 고물들도 버리고."
21020-74 = "……."
21020-75 = "고, 고물이라 하지 마."
21020-76 = "고물이 아니면? 이게 뭔데?"
21020-77 = "……그, 그건……."
21020-81 = "……치잇!"
21020-82 = "……결과로 말해주겠어."
21020-83 = "결과로……?"
21020-84 = "이미 그를 위한 준비는 모두 끝났으니까!"
21020-86 = "뭐?"
21020-87 = "마, 말도 안 돼!"
21020-88 = "미도리, 너는 왜 놀라는 거야!"
21020-89 = "어쨌든 우리에게는 비장의 무기가 있어."
21020-90 = "바로 그걸로 우리는 이번 '밀레니엄 프라이스'에 우리의 게임……"
21020-91 = "<TSC２>…… <테일즈 사가 크로니클2>를 공모할 거야!"
21020-92 = "?!"
21020-93 = "[s] \"밀레니엄 프라이스?\""
21020-95 = "밀레니엄의 세 자릿수가 넘는 동아리들이 각자의 결과물을 제출하는, 밀레니엄 최대 공모전! 여기서 수상하면 아무리 너라도 찍소리도 못하겠지!"
21020-96 = "……그렇겠지."
21020-97 = "수상한다면, 말야."
21020-98 = "하지만 모모이, 지금 네가 말하는 건 야구부가 인터하이에 진출하는 레벨이 아니라……"
21020-99 = "고교 야구부가 메이저리그에 나간다는 말만큼이나 허황된 말이야."
21020-100 = "그래도…… 어째서일까. 오히려 기대가 되네."
21020-102 = "좋아. 기다려주지."
21020-103 = "앞으로 밀레니엄 프라이스까지는 2주, 그 사이에 어떤 결과물을 낼 수 있을지 말야."
21020-105 = "선생님, 모처럼 뵈었는데 냉정한 모습만 보여 난처하네요."
21020-106 = "하지만 이게 학생회의 일이라서요."
21020-107 = "그럼 이만, 나중에는 좀 더 부드러운 분위기에서 뵙도록 하죠."
21020-109 = "(철커덕)"
21020-110 = "……"
21020-111 = "……언니……."
21020-112 = "확률은 낮지만, 우린 게임 제작보다 부원 모집 쪽에 희망을 걸어보는 게 낫지 않을까?"
21020-113 = "그거라면 이미 한 달 동안 해봤잖아……. 그치만 아무도 가입해주지 않았는 걸."
21020-114 = " \"킥! VR도 구식인데 무슨 레트로 게임이냐.\" 바보 취급 당하는 건 이제 지긋지긋해."
21020-115 = "……."
21020-116 = "비겁한 유우카! 우리 같은 너드들은 친구가 없다는 걸 이용하다니! 용서 못 해!"
21020-117 = "아니…… 그건 유우카보다 백퍼센트 우리 자업자득인 것 같은데."
21020-118 = "어쨌든 더 이상 부원 모집에는 희망이 없어."
21020-119 = "하지만 방법이 없는 건 아니야."
21020-120 = "아 맞다. 유우카에게 말한 '비장의 무기'라는 거, 대체 뭐야?"
21020-121 = "그야 당연히 선생님이지."
21020-122 = "[s] \"나?\""
21020-123 = "선생님. 아까 말했듯이, 우리의 목적은 '폐허'에 있어."
21020-124 = "폐허는 총학생회가 출입을 통제하고 있던…… 밀레니엄 근교의 미지의 지역이야."
21020-125 = "출입을 통제한 이유는 위험한 지역이라서라는데…… 정확히는 무슨 위험이 있는지조차 모른다는 게 위험의 증거일 거야."
21020-126 = "들어간 사람이 없는 것인지, 아니면 들어가서 돌아온 사람이 없는 것인지조차 알 수 없을 만큼."
21020-127 = "완전한 미지의 세계……."
21020-128 = "[s] \"그런 곳에 대체 왜 들어가려는 거야?\""
21020-129 = "좋은 게임을 만들고 싶으니까!"
21020-130 = "나는, 증명하고 싶어."
21020-131 = "비록 지금 우리의 수준이 '올해의 쿠소게 1위'에 불과하다 해도."
21020-132 = "내가 좋아하는, 나를 행복하게 해주었던, 이 게임기들이……"
21020-134 = "결코 '고물'이 아니라, 소중한 '보물'이었다는 걸!"
21020-135 = "……언니."
21020-136 = "그러기 위해선 반드시 폐허에 들어가 '그것'을 찾아내야 해."
21020-137 = "[s] \"그것?\""
21020-138 = "아, 이 얘기를 먼저 해야겠구나."
21020-139 = "선생님 혹시……"
21020-142 = "G.Bible 이라는 거, 알아?"
21020-144 = "다음화;폐허로."
