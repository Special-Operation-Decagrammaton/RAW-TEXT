[translation]
90001150-1 = "제15화;눈싸움"
90001150-7 = "……라고 하는 것이, 지금까지의 상황이에요."
90001150-8 = "자, 그러면 또 질문 있으신 분?"
90001150-10 = "어……. 히마리 선배? 지금 너무 현실성이 없어서 그러는데…….지금 무슨 해커 특유의 농담 같은 걸 하고 있는 거 아니지?"
90001150-11 = "언니, 제발. 언니……."
90001150-13 = "네. 그런 반응도 나올 것 같다고, 예상하기는 했지만요……."
90001150-15 = "그렇지만, 이게 지금 일어나고 있는 현실이야. 히마리가 이야기한 대로지."
90001150-16 = "지금 우리에게 필요한 것은, 다차원 배리어를 해제하는 것……."
90001150-17 = "그래. 너희들도 아마 기억하고 있을, 그때처럼."
90001150-22 = "[ns1] \"맞아. 그래서 아리스와…… 모두에게 도와달라고 한 거야.\"\n[ns2] \"미안해. 모두.\""
90001150-25 = "[ns3] \"모든 걸 책임질 수 있을지, 이번에는 잘 모르겠지만.\"\n[ns4] \"할 수 있는 일은, 어떻게든 전부 해 볼게.\""
90001150-30 = "어? 선생님? 여기에서 선생님이 그렇게 나오면, 우리도 할 말이 없어진다고나 할까……!"
90001150-31 = "그, 그래요! 그렇게 고개를 숙이시면, 저희가 오히려 죄송해져요!"
90001150-33 = "거기에…… 이 일은, 사실……."
90001150-35 = "……네. 이해했습니다. 그때처럼, 말이군요."
90001150-44 = "알겠습니다. 선생님. 아리스는 선생님을 위해서라면 무엇이든 감당할 수 있습니다."
90001150-45 = "그렇지만……."
90001150-46 = "[s] \"그렇지만……?\""
90001150-51 = "아뇨. 괜찮을 겁니다. 세상에는 마법이 있으니까요. 기적도요. 그러니까 분명 괜찮겠지요."
90001150-52 = "아리스……?"
90001150-53 = "하지만, 아리스만으로는 아직 부족합니다."
90001150-58 = "그건 또 무슨 말이죠? 모자란 것이 있다면, 우리가 어떻게든……."
90001150-59 = "아리스가 그날, 빛의 검…… '축복받은' 빛의 검을 들어 올릴 수 있었던 것은 맞습니다."
90001150-60 = "그렇지만 그것은 아리스 혼자만의 힘으로는 들어올릴 수 없는 것이었습니다. 그때도 그랬고, 지금 역시 마찬가지입니다."
90001150-61 = "아리스가 다시 한번 축복받은 빛의 검을 들어올리기 위해서는……."
90001150-66 = "케이가, 필요합니다."
90001150-68 = "케…… 이?"
90001150-73 = "아!"
90001150-74 = "아리스 쨩! 그러면 그때에도 혹시……? 분명 케이 쨩이, 아리스 쨩의 부탁을……?"
90001150-76 = "네. 케이가 아리스를 도와주었습니다. 그래서 아리스는 축복받은 빛의 검을 온전히 들어 올릴 수 있었던 것입니다. 그리고……."
90001150-77 = "……."
90001150-78 = "사실, 어째서 아리스가 남겨졌고 케이가 떠난 것인지는, 아리스도 잘 알지 못합니다."
90001150-79 = "하지만 그때에도 지금도, 마왕성을 공략하기 위해서는, 무엇보다 케이가 있어야 합니다."
90001150-80 = "[s] \"그렇구나…….\""
90001150-81 = "……어떻게 해도 '케이'가 이 공정에서 필요한 것이라면, 어쩔 수 없겠네."
90001150-82 = "하다 못해 케이에 대한, 작은 단서라도 남아 있다면 좋겠지만……."
90001150-84 = "……부장?"
90001150-89 = "무슨 말을 하려는지 알아요. 에이미."
90001150-91 = "괜찮을까요? 그 일을…… 이야기해도 되는 것일까요?"
90001150-93 = "……이것은 일종의, 학자가 가져야 할 양심의 문제에요. 토키. 에이미."
90001150-94 = "엄연히 존재하는 것을, 없다고 할 수는 없으니까요."
90001150-95 = "그렇지만……."
90001150-100 = "알겠습니다. 히마리 부장의 의향이 그러하시다면."
90001150-105 = "리오. 이 정보를 당신에게 전달하는 것이 맞는 일인지는 모르겠지만, 케이의 단서 같은 것이라면 알고 있어요."
90001150-110 = "뭐?!"
90001150-111 = "우리가 우트나피쉬팀의 배로, 아트라하시스의 방주를 향해 돌입했던 날……."
90001150-118 = "그러니까 케이를 아리스의 열쇠고리 인형 속에 이식했다고?!"
90001150-120 = "……."
90001150-121 = "진정해요, 리오. 그 데이터는 고작 2Kb 크기일 뿐이었고."
90001150-122 = "애초에 뭔가 신기한 일이 생기거나 하진 않을 거고, 그냥, 아리스의 소망을 담아두자는 의미에서……."
90001150-123 = "그게 정말 자연적으로 발생한 데이터였던 게 맞아?"
90001150-129 = "리오 선배?"
90001150-131 = "그, 그래요. 갑자기 왜 그러는 거죠?"
90001150-132 = "……."
90001150-133 = "조금이지만, 실마리가 보인 것 같아."
90001150-134 = "?!"
90001150-136 = "네? 정말입니까? 그 실마리란 어떤 건가요?!"
90001150-137 = "[s] \"조금 더 자세히 이야기해 줘.\""
90001150-140 = "내 생각이 맞다면, 지금 우리들에게 필요한 것은 바로 그 데이터……."
90001150-141 = "열쇠고리 인형 속에 이식된, 2Kb 파일일 거야."
90001150-142 = "하지만 그건 비트 단위까지 분석해 봐도 알 수 없는, 의미 불명의 데이터였다고요?"
90001150-143 = "그럴 거야. '키보토스'의 '일반적인' 기술을 적용했다면 그런 결과가 나오는 것이 당연하겠지."
90001150-144 = "다른 접근 방법이라도 있다는 말인가요, 그렇다면?"
90001150-145 = "그건……."
90001150-147 = "혹시…… 혹시, 케이를 살릴 수 있는 건가요, 리오 선배?!"
90001150-152 = "아리스, 잠깐만요. 아직 충분한 정황 정보가……."
90001150-153 = "대답해 주세요. 리오 선배는, 케이를 살릴 수 있다고 보는 겁니까?"
90001150-159 = "……미안해. 나도 조금 흥분한 모양이야. 굳이 확률을 이야기하자면 반반 정도……."
90001150-160 = "아니, 더 정확하게 이야기하자면 그것보다도 한참 아래일 거야."
90001150-161 = "그리고 무엇보다…… 실패한다면, 그 남겨진 2kb의 데이터도, 이번에는 완전히 사라져 버릴 수도 있어."
90001150-163 = "!"
90001150-165 = "아리스……."
90001150-166 = "아리스 쨩……."
90001150-167 = "……."
90001150-169 = "……그 말은, 잘못하면, 이번에는 케이를 완전히 잃어버릴 수도 있다는 뜻이군요……?"
90001150-170 = "……."
90001150-171 = "가혹한 말이 되겠지만, 아리스."
90001150-172 = "이 문제에 대한 선택은…… 아마도, 너에게 달린 것 같아……"
90001150-173 = "아리스에게…… 그렇지만 케이는……."
90001150-179 = "(몸을 굽혀, 아리스와 눈높이를 맞췄다.)"
90001150-180 = "[ns] \"아리스는, 어떻게 하고 싶어?\""
90001150-184 = "네……? 아리스가, 말인가요?"
90001150-185 = "그렇지만 이건, 케이의 일이고…… 아리스가 그걸 결정한다는 것은……."
90001150-186 = "[s] \"그래. 맞아. 이건 누구도 섣불리 결정할 수 없는 일이지.\""
90001150-188 = "[ns5] \"그렇지만 세상 다른 누구보다는.\"\n[ns6] \"아리스에게 조금 더 이야기할 권리가 있다고 생각해.\""
90001150-191 = "……!"
90001150-192 = "아리스는……."
90001150-193 = "……아리, 스는…… 역시……."
90001150-200 = "케이와, 만나고, 싶습니다."
90001150-203 = "다시 한번, 케이와 만나고 싶습니다."
90001150-204 = "잘 모르겠습니다. 아리스는 아직 견습이니까, 세상에 모르는 것이 너무 많습니다."
90001150-205 = "최대한 케이의 입장에서, 케이라면 이 문제를 어떻게 생각할지 생각해 보았지만, 역시 잘 모르겠습니다……."
90001150-206 = "어쩌면 케이는, 자기를 이대로 놓아두라고 할지도 모르겠습니다."
90001150-213 = "그날, 남을 수 있게 된 것은 아리스였고, 케이는 그러지 못했습니다. 그건 분명…… 우연이, 아닐 거라고, 생각합니다."
90001150-214 = "그러니까, 여기서부터는, 아리스의 욕심입니다."
90001150-218 = "케이와 다시 이야기를 하고 싶습니다."
90001150-219 = "이번에는 케이와 동료로…… 친구로, 지내고 싶습니다."
90001150-220 = "만일, 정말로 만일 케이가 돌아온다면, 모든 원망은 아리스가 듣겠습니다."
90001150-221 = "무언가가 잘못되어서 케이를 영원히 잃어버린다고 해도, 리오 선배를 탓하지 않겠습니다."
90001150-222 = "정말이지, 정말, 이지…… 용사 실격이네요. 아리스는."
90001150-223 = "자기 욕심만으로, 케이를, 영영 만나지 못할 곳으로 보내 버릴지도 모릅니다. 아리스는 그런 일을 리오 선배에게 부탁하고 있습니다."
90001150-224 = "죄송합니다. 리오 선배. 죄송합니다……."
90001150-226 = "아, 아니, 나는……."
90001150-228 = "선생님에게도, 죄송합니다. 아리스는 이렇게, 욕심쟁이입니다……."
90001150-229 = "[s] \"…….\""
90001150-230 = "다른 모든 분들께도…… 죄송하다고, 사과드리고 싶습니다. 그러니까……."
90001150-231 = "……그러니까……."
90001150-236 = "……."
90001150-238 = "케이를, 부탁드리겠습니다."
90001150-239 = "……!"
90001150-240 = "……알겠어요. 아리스. 귀여운 후배의 부탁인데, 누가 그걸 거절하겠어요?"
90001150-241 = "리오? 멍하니 서 있지 말고 당장 시작하죠. 밀레니엄의 전지 학위를 보유한 초천재병약미소녀인 제 도움을 받는 이상, 실패는 용납치 않겠어요."
90001150-243 = "하, 하지만 아까도 말했듯이, 성공 확률은 절반보다 한참 이하라고……."
90001150-248 = "무조건 성공시키는 거예요. 알겠지요?"
90001150-252 = "……알겠어. 지금은 가능성을 이야기하고 있을 때가 아니니까."
90001150-254 = "저, 저기. 선생님? 히마리 선배? 리오 선배……? 혹시 아리스도, 같이 들어가도…… 될까요?"
90001150-259 = "아리스?"
90001150-260 = "갑자기 왜 그러죠?"
90001150-261 = "그건…… 그다지 추천하지 못할 것 같아. 아리스. 일단 이건 상당히…… 위험한, 공정이 될 거고. 거기에……."
90001150-262 = "만에 하나, 실패해 버리기라도 하면, 너는…… 그걸 눈앞에서……."
90001150-264 = "그래도, 그래도……. 아리스는……."
90001150-269 = "(히마리가 돌연 눈짓을 보내왔다.)"
90001150-270 = "(그게 무슨 뜻인지 궁금해하다가…… 문득, 어떤 생각이 번뜩이며 머리를 스쳤다!)"
90001150-276 = "[ns] \"자, 아리스. 게임개발부도.\""
90001150-278 = "네, 네……?"
90001150-279 = "부르셨나요, 선생님?"
90001150-283 = "[ns] \"우리, 나가서 눈싸움하지 않을래?\""
90001150-285 = "누, 눈싸움이요……? 어째서 밑도 끝도 없이……?"
90001150-291 = "……!"
90001150-292 = "좋아, 선생님! 그거 정말 좋은 생각이네! 우리 먼저 갈게!"
90001150-297 = "어, 언니?! 언니까지 갑자기 왜 그래!"
90001150-298 = "모모이? 모모이? 하지만 아리스는, 아리스는……!"
90001150-304 = "아우우…… 모모이도 참……."
90001150-305 = "감사합니다. 선생님."
90001150-306 = "[s] \"이런 일은 언제든 맡겨 줘.\""
90001150-308 = "감기에는 조심해 주십시오. 만에 하나 열이 나신다면 그때는, 제가 하루 종일 곁에서 돌보아 드리겠습니다."
90001150-309 = "생각해 보니, 그런 상황도 나름대로 기대가 되기는 하는군요."
90001150-310 = "토키…… 선생님이 감기에 걸리기를 바라는 거야, 안 걸리길 바라는 거야?"
90001150-311 = "저도 잘 모르겠습니다."
90001150-312 = "그래, 그래……."
90001150-318 = "[ns] \"오! 벌써들 하고 있구만!\""
90001150-326 = "아하하하하! 또 받아라, 미도리!"
90001150-327 = "앗, 차가! 앗! 차가! 언니, 정말……! 나도 당하고만 있지는 않을 거니까!"
90001150-330 = "모모이? 미도리? 그리고 선생님까지……?"
90001150-331 = "왜 모두들, 갑자기……? 그렇지만 아리스는……."
90001150-332 = "[s] \"어때, 아리스?\""
90001150-336 = "잘…… 모르겠습니다. 지금 아리스는, 이런 것도 좋지만, 케이가……."
90001150-337 = "……케이, 가……."
90001150-338 = "[s] \"맞아. 그래서야.\""
90001150-342 = "네? 그것은 무슨 말씀인가요, 선생님?"
90001150-343 = "[s] \"케이에게도 이렇게 멋진 모습을 보여주고 싶지 않아?\""
90001150-344 = "네? 케이에게, 이런 모습을……?"
90001150-355 = "……그렇습니다. 멋진 모습입니다."
90001150-359 = "세상에 이렇게 눈이 많이 쌓인 곳이 있었다니, 생각도 못 했습니다. 저것은 펭귄인가요? 실제로 보는 것은 처음입니다."
90001150-360 = "모모이는 극지 같은 곳은 도착하자마자 얼어붙어 버릴지도 모른다고 했습니다만, 실제로는 그렇지 않았네요."
90001150-361 = "물론 춥기는 하지만…… 여기도 세상의 일부라는 생각이, 확실히 듭니다."
90001150-362 = "[s7] \"맞아. 그러니까 여기가 얼마나 멋진지 이야기해 주려면.\"\n[s8] \"누구보다도 아리스가 먼저, 신나게 놀아 봐야 하지 않을까?\""
90001150-365 = "[ns] \"무엇보다 케이는, 반드시 돌아올 테니까. 그렇지?\""
90001150-369 = "케이는, 반드시……."
90001150-373 = "……."
90001150-374 = "그러네요, 선생님! 아리스가 생각이 짧았습니다!"
90001150-375 = "선생님의 말씀대로입니다! 알겠습니다! 세상이 얼마나 멋진지 이야기해 주려면……."
90001150-376 = "누구보다도, 아리스가 그걸 충분히 알아야 한다는 것을요! 그리고 그렇게 하기 위해서는–"
90001150-385 = "끄앙?!"
90001150-387 = "아, 아아아……! 미도리가 던진 눈뭉치가, 아리스에게 튀었어……!"
90001150-393 = "아리스, 알았습니다! 이건 모모이를 공격하는 척하면서 아리스를 공격하는, 일종의 우회 작전이군요!"
90001150-399 = "하지만 아리스도 지지 않을 겁니다! 아리스, 갑니다!"
90001150-407 = "푸와앗?!"
90001150-408 = "아하하! 뭐야, 미도리! 지금 진짜 웃겼어! 므와악?!"
90001150-417 = "이, 이번에는 아리스의 눈뭉치가, 모모이에게……?!"
90001150-418 = "좋아, 아리스! 해 보자 이거지? 바로 그 자세야!"
90001150-420 = "아리스는 준비되었습니다! 모모이도 미도리도, 봐 주지 않을 겁니다!"
90001150-438 = "조용히…… 눈치 채이지 않도록 뒤를 노려서……!"
90001150-444 = "[ns] \"그러면…… 나도!\""
90001150-450 = "우뮤앗?!?!"
90001150-451 = "꺄아앗!?!?"
90001150-452 = "끄앙!!??"
90001150-456 = "히, 히이익??!! 갑자기 선생님까지……?"
90001150-457 = "[ns9] \"하하하하! 다들 방심했구만!\"\n[ns10] \"이 피도 눈물도, 영원한 아군도 없는 눈싸움에서……!\"\n[ns11] \"한눈을 파는 것은, 그야말로 목숨을 내다 버리는 것!\""
90001150-465 = "좋~아, 선생님! 나 사이바 모모이, 절대 지고만 있을 수는 없는 것이다!"
90001150-466 = "후후. 선생님의 뜻은 알겠어요. 그러면 각오도 되신 거죠?"
90001150-467 = "아리스, 알고 있습니다! 이것은 만인에 대한 만인의 투쟁입니다!"
90001150-474 = "그렇네요…… 눈싸움의 한복판에서는, 선생님마저도 믿을 수 없는 거였죠……!"
90001150-483 = "[ns] \"크윽, 이럴 수가! 하지만 당하고 있지만은 않겠다!\""
90001150-484 = "와아! 아하하하하!"
90001150-485 = "저 잡아 보세요, 선생님!"
90001150-487 = "연타라는 것은 하나하나 진심을 담아서 던지는 것이라고 배웠습니다!"
90001150-493 = "저도 조금, 본격적으로 가겠습니다……!"
90001150-499 = "(그 뒤로 한참이나, 서로에게 눈뭉치를 던져대며, 평소보다도 더 큰 목소리를 내면서, 설원을 뛰어다녔다.)"
90001150-503 = "(그때의 우리들에게는…… 그런 것이 필요했다.)"
90001150-507 = "(완전히 자기들끼리 신나게 놀고 있는 아이들을 바라보며.)"
90001150-509 = "(조심스럽게, 들키지 않도록 빙해 베이스로 돌아왔다.)"
90001150-515 = "어서 오십시오. 선생님. 우선 몸을 좀 닦으셔야겠습니다. 제가 도와드리도록 하죠."
90001150-516 = "좋은 때에 왔어, 선생님. 지금 우리는 그러니까…… 이 베이스에서 가용 가능한 모든 데이터 저장 장치를 준비한 참이야."
90001150-517 = "정확히는 모르겠습니다만, 리오 님께서는 가능한 한 많은 데이터 필드가 필요하다고 하시더군요."
90001150-518 = "마침 힘이 필요한 일이니, 저와 에이미가 거들고 있었습니다."
90001150-519 = "[s] \"그러면, 이제…….\""
90001150-520 = "응."
90001150-521 = "선생님은 우리와 함께, 케이의 부활을 지켜보면 되는 거지."
90001150-523 = "다음화;부르는 소리"
