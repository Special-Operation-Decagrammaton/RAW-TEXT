[translation]
10033055-3 = "후우……. 수학여행의 열기에 다소 취한 모양이군요."
10033055-4 = "……되돌아보면, 역시 해삼 타코야키 바닐라 파르페는 좀 아니었지……."
10033055-6 = "휴우……. 어떻게든 진정된 것 같네요……. 그러면 다음은 무허가 식품을 팔던 가게 쪽인데…… 어어?"
10033055-7 = "(……?! 노점 자체가, 흔적도 없이 사라졌어……?)"
10033055-8 = "[ns] \"왜 그래, 우미카?\""
10033055-9 = "아, 아뇨……. 아무것도, 아니에요……."
10033055-10 = "우미카? 빨리 식당으로 돌아가야 할 것 같습니다! 다음 일정에 이미 늦었습니다!"
10033055-11 = "그, 그래요! 스케줄을 지켜야죠! 피나와 카에데는 여기 계신 학생분들을 인솔해 주세요! 식당에 계신 학생분들은 제가 어떻게든 해 보겠습니다!"
10033055-18 = "(……그렇게 이야기하기는 했지만, 피나의 말대로…….)"
10033055-19 = "(또 스케줄을 맞추지 못하고 말았어……!)"
