[translation]
10036070-1 = "제7화;그녀가 온다"
10036070-3 = "아얏! 살살 좀 해! 거기 두 발이나 맞은 데라고!"
10036070-4 = "약 바르는 걸 어떻게 살살 하라는 거야? 엄살 부리지 마!"
10036070-5 = "젠장…… 이게 무슨 꼴이람."
10036070-6 = "공연장 근처에 가기도 전에 정체불명의 헬멧단에게 당했어……."
10036070-7 = "맞아, 저 멀리 있나 싶었는데 어느새 다가와 있더라고. 눈 깜짝할 새였다니깐."
10036070-8 = "으으, 유령이라도 되는 건가……헬멧단에 그런 녀석이……."
10036070-9 = "시끄러!"
10036070-10 = "이러니저러니 해도, 헬멧단 축제를 망쳐놓는다는 우리 계획은 실패했어."
10036070-11 = "하지만 그건 우리 잘못이 아냐!"
10036070-12 = "……!"
10036070-13 = "그렇잖아? 다들 계획이 성공할 거라 믿고 싸운 거고, 최선을 다했잖아!"
10036070-14 = "그러면 그 계획을 세운 녀석의 잘못이지!"
10036070-15 = "그렇다면 역시……."
10036070-16 = "그래, 히죽히죽 교수! 그 녀석이 문제인 거라고!"
10036070-17 = "다시 전화 걸어 봐!"
10036070-24 = "여러분이군요. 승리의 축배를 들고 계시는지?"
10036070-26 = "축배는 무슨!"
10036070-27 = "솔직히 말해, 교수! 너 우리 엿먹이려고 이런 작전을 계획한 거지!"
10036070-28 = "쳐들어가기도 전에 두들겨 맞고 도망쳤다고!"
10036070-30 = "네? 그럴 리가요."
10036070-31 = "여러분의 병력과 헬멧단의 병력을 상정하면 유효한 작전이었어요."
10036070-33 = "아까 납치 작전도 그렇고! 네 녀석의 계획, 뭐 하나 제대로 되는 게 없잖아!"
10036070-35 = "호오. 설명을 부탁드려도 될까요?"
10036070-37 = "아아, 그렇군요. 두 번째 실패라. 안타깝네요."
10036070-39 = "인마! 우린 진지하다고! 너한테 지불한 돈은 어쩔 거야!"
10036070-40 = "맞아! 우리가 피땀 흘려 한 푼, 두 푼 열심히 모은 그런 소중한 돈이었는데!"
10036070-41 = "협박과 으름장으로 간신히 손에 넣은 귀중한 돈이었다구!"
10036070-43 = "처음 DJ를 납치하려 했을 때도 방해를 받았고, 이번에도 마찬가지……."
10036070-44 = "축제장 경계 병력이 얇아진 틈을 노렸음에도 불구하고, 또다시 패퇴라……."
10036070-45 = "그건 흥미롭네요."
10036070-47 = "흥미롭긴 뭐가! 이제 어쩔 거야! 너만 믿고 돌격했는데 번번이 실패만 했잖아!"
10036070-49 = "조용히 하세요. 오합지졸 주제에."
10036070-51 = "뭐, 뭣……?"
10036070-52 = "이 자식! 너 어디 있어! 헬멧단보다 너부터 두들겨주겠어!"
10036070-54 = "자, 자, 흥분하지 마시고."
10036070-55 = "여기까지 왔다면 인정할 수밖에 없겠죠."
10036070-56 = "반상의 반대편에 앉은 이가, 그리 만만한 자가 아니라는 것을요."
10036070-57 = "네, 적어도 저와 몇 수 이상 경합을 벌일 정도의 인물……."
10036070-58 = "허나 아직 패배한 것은 아닙니다."
10036070-59 = "자아, 귀를 기울여 보세요."
10036070-61 = "……?"
10036070-63 = "아아! 헬멧단 축제에서 안내방송 드립니다!"
10036070-64 = "공연 준비에 시간이 걸리는 관계로, 5시에 예정되어 있던 DJ 공연이 6시 이후에 시작될 예정입니다!"
10036070-65 = "죄송! 하지만 많은 기대 부탁합니다! 이상 방송 끝!"
10036070-66 = "……저건, 우리 습격 때문?"
10036070-68 = "네, 여러분은 잘 해줬어요. 본래 지금쯤 시작되었어야 할 축제의 메인 이벤트를 1시간이나 지연시켜 주었죠."
10036070-70 = "엥? 설마 원래부터 그게 목적?"
10036070-71 = "이렇게 되리라는 것까지, 전부 예상하고 있었어……?!"
10036070-73 = "글쎄요. 그건 어떨까요. 전황이란 무릇 예상치 못한 변수와 누군가의 변덕, 실수와 고집으로도 변하기 마련."
10036070-74 = "하지만 그 덕분에 좋은 소식입니다. 여러분이 힘내서 공연을 지연시켜 준 덕분에, 마침내 복수는 이루어질 테니까요."
10036070-75 = "다만 당신들의 손이 아닌, <그녀>의 방식으로 이루어지겠지만요."
10036070-76 = "'그녀'……?"
10036070-81 = "결국 이런저런 수를 쓰는 것보다 그녀의 준비가 끝나는 쪽이 더 빨랐다는 것이지요."
10036070-82 = "이 뒤로 펼쳐질 게임판 위에서 당신들이 활약할 국면은 없겠습니다만."
10036070-83 = "계속하거나 말거나, 어디까지나 선택은 당신들의 몫. 저의 컨설팅은 여기까지입니다."
10036070-84 = "그럼."
10036070-91 = "……그게 무슨 말이야?"
10036070-92 = "글쎄……."
10036070-93 = "하긴, 다친 녀석도 있고…… 여기까지 해서 안 됐으면 어쩔 수 없는 거 아냐?"
10036070-94 = "히죽히죽 교수도 저렇게 말하고...... 그만 돌아갈까."
10036070-95 = "솔직히 아까 그 녀석. 다시 만나면 이길 자신도 없고…."
10036070-99 = "떽!!!!!"
10036070-100 = "너희한테 실망했어! 실패할 수는 있지만, 마음마저 꺾이다니!"
10036070-101 = "이래서 큰누님을 뵐 면목이나 있겠냐!"
10036070-102 = "잊었어?! 우리를 이끌어준 누님의…… 그 단단하고 믿음직한 뒷모습을!"
10036070-103 = "……!!!"
10036070-108 = "우리가 누구야. 우는 애도 엉엉 울게 만들고. 엉엉 우는 애는 꺼이꺼이 울게 만드는 불량배!"
10036070-109 = "여기서 우리를 이끌어준 누님의 복수를 하지 않으면 누가 한단 말이냐!"
10036070-110 = "교수인지 뭔지는 이제 필요 없어!"
10036070-111 = "우리끼리 행동하는 거다! 지금까지 그래왔던 것처럼!"
10036070-112 = "오오!"
10036070-113 = "멀쩡한 녀석들은 나를 따라와!"
10036070-114 = "해변가 DJ 공연장을 습격한다!"
10036070-117 = "자, 자, 공연 시작 20분 전이라고! 이미 관객들도 다들 입장했어!"
10036070-118 = "시간이 밀렸으니 더 빨리빨리 움직이자고!"
10036070-119 = "네!"
10036070-120 = "음향 체크! 기재 체크! 오케이!"
10036070-121 = "1분 뒤 리허설 시작한다!"
10036070-122 = "알겠다."
10036070-124 = "우왁! 알바 양!"
10036070-125 = "리허설은 나도 돕겠다."
10036070-126 = "괘, 괜찮은데! 쉬어도 되는데……!"
10036070-127 = "아니, 맡은 임무니까. 혼자 놀고 있을 수는 없다. 무얼 하면 되지?"
10036070-128 = "남은 건 턴테이블 점검이랑 스피커 테스트 정도일까."
10036070-129 = "알겠다. 맡겨둬."
10036070-130 = "그, 그러면 부탁하지!"
10036070-135 = "[ns] \"사오리.\""
10036070-136 = "음? 아, 선생. 잘 왔다. 공연 직전이야."
10036070-137 = "아이들도 공연을 보러 와 있다고? 음, 안내해 줘서 고맙다."
10036070-138 = "조금만 기다려. 공연 전에 마지막으로 기자재 테스트를 할 생각이다만."
10036070-139 = "[s] \"도와줄게.\""
10036070-140 = "……그렇군. 선생이라면 그렇게 말할 줄 알았다."
10036070-141 = "그럼 무대에 잠깐 같이 올라가도록 할까."
10036070-143 = "나 완전 기대돼! DJ 공연은 처음인데 신나겠지?"
10036070-144 = "당연하지! 엄청 시끄럽고, 엄청 신나고, 엄청 재밌을걸!"
10036070-145 = "파티라면 역시 일렉트로닉 음악이 있어야지!"
10036070-147 = "……사람이 많군."
10036070-148 = "[s3] \"응, 다들 공연을 보러 온 관객들이야.\"\n[s4] \"객석이 꽉 찼는걸?\""
10036070-151 = "오늘 하루 종일 무대 위를 오르락내리락했지만……."
10036070-152 = "막상 공연 직전에 여기 올라와 보니, 아까와는 전혀 다른 느낌이다."
10036070-153 = "내 예상보다 좀 더 새롭다고 해야 할까……."
10036070-154 = "이런 건 한 번도 느껴보지 못했어."
10036070-155 = "……신기해."
10036070-158 = "후후, 일찍 오길 잘했네."
10036070-159 = "중간쯤의 가장 좋은 자리를 차지했어."
10036070-160 = "사람들 틈바구니에 끼어있는 건 그다지 선호하지 않는데……."
10036070-161 = "그치만 저, 잡지에서 봤어요. DJ 공연이야말로 축제의 하이라이트!"
10036070-162 = "이걸 즐기는 자야말로 해변의 인기인이라구요……!"
10036070-163 = "헬멧단 녀석들한테 인기 있어서 어쩔 건데……."
10036070-167 = "앗, 저기 무대 위를 봐. 리허설을 하는 것 같아."
10036070-168 = "역시 삿 쨩도 저기 올라가 있네."
10036070-169 = "저, 정말요? 어디요? 어디요?"
10036070-174 = "잠깐 히요리, 그렇게 뛰어대면 사오리가 이쪽을 눈치챌지도—"
10036070-178 = "잠깐, 무슨 소리 안 들려?"
10036070-179 = "네? 무, 무슨 소리요?"
10036070-184 = "얘들아! 드가자!"
10036070-185 = "헬멧단 나와! 한 판 붙게!"
10036070-194 = "가, 갑자기 뭐야?! 불량배? 어째서?"
10036070-195 = "우와악! 공격해 온다! 마, 맞서 싸워!"
10036070-197 = "짜식들아! 누님의 복수닷!"
10036070-204 = "아야얏……."
10036070-205 = "이 녀석들 대체 뭐야?"
10036070-206 = "수도 얼마 안 되는 녀석들이 회장을 습격하다니."
10036070-207 = "대체 뭘 하고 싶었던 거지?"
10036070-209 = "크읏……! 최후의 돌격마저 허무하게 꺾이다니……!"
10036070-210 = "여기까지인 건가……."
10036070-211 = "누님을 위한 복수였건만……!"
10036070-218 = "대체 뭐였던 걸까요…… 저분들은……?"
10036070-219 = "글쎄. 아까 DJ를 납치하려 한 것도 그렇고, 뭔가 소동을 일으키고 싶었던 걸까?"
10036070-223 = "……잠깐."
10036070-225 = "아츠코, 히요리, 이쪽으로 와!"
10036070-230 = "꺄앗?!"
10036070-231 = "우와아아앙?!"
10036070-235 = "크악! 뭐, 뭐야 이건! 로켓탄……?!"
10036070-236 = "뭐야! 무슨 일이 일어난 거야?!"
10036070-238 = "콜록, 콜록! 뭐야, 불량배 녀석들, 로켓 발사기까지 들고 온 거야?"
10036070-239 = "콜록! 아니, 우리한테 로켓 발사기 같은 건 없는데……."
10036070-240 = "그럼 대체 무슨……."
10036070-242 = "[ns] \"저, 저건……?!\""
10036070-244 = "오랜만에 뵈어요, 헬멧단 여러분. 그간 잘 지내셨나요?"
10036070-245 = "여러분을 매일매일 걱정했답니다. 건강은 어떠신가요?"
10036070-246 = "세 끼는 꼬박꼬박 챙겨 드시고, 활기차고 즐겁게 하루하루를 보내고 계셨나요?"
10036070-247 = "그렇지 않았다면 곤란해요. 소녀, 여러분과 다시 만날 이날만을 고대했으니까요."
10036070-248 = "이전과 다름없이 해맑고, 불량하고, 제멋대로인 여러분에게—"
10036070-252 = "—제 손으로 복수할 날을요!"
