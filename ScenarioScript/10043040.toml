[translation]
10043040-1 = "제4화;뜻밖의 만남"
10043040-2 = "우아, 정신이 없네요. 생각보다 관중분들이 더 많이 왔어요."
10043040-3 = "하긴, 브레이브스 팬뿐만 아니라 레이더스 쪽 팬들도 와 있을 테니 말이에요."
10043040-4 = "이러다가 절반도 못 찾아보고, 경기가 끝나버리는 건 아닐지 걱정이네요……."
10043040-9 = "즐기자! 우리의! 커다란 축제!"
10043040-13 = "힘찬 응원이네요. 누구인지는 모르지만, 저까지 조금 힘이 날 정도로요."
10043040-14 = "……제가 할 말은 아닌 것 같지만, 브레이브스의 응원은 중간에 보통 힘이 빠져 버리곤 하거든요……."
10043040-15 = "[s] \"잠깐만, 이 목소리는……?\""
10043040-16 = "선생님?"
10043040-19 = "힘내라! 힘내라! 우리의–"
10043040-23 = "어……. 우리의…… 이름이 뭐더라? 아무튼!"
10043040-24 = "꿈의 날개! 하늘 저 멀리!"
10043040-30 = "어라?"
10043040-31 = "선생님!!!"
10043040-35 = "에헤헤. 이런 곳에서 선생님을 만나다니, 전 정말 운이 좋네요!"
10043040-36 = "[s] \"우왓! 진정해, 하나에!\""
10043040-37 = "저…… 선생님? 이분은, 누구시죠……?"
10043040-38 = "안녕하세요! 저는 아사가오 하나에예요! 트리니티 종합학원 1학년, 구호기사단이고요! 구호가 필요한 곳에 구호를!"
10043040-39 = "[s] \"응. 구호가 필요한 곳에 구호를. 반가워, 하나에.\""
10043040-40 = "네! 저도요, 선생님! 그런데 같이 계신 분은 누구신가요?"
10043040-41 = "뭔가 이것저것 순서가 뒤섞여 버린 것 같긴 한데요……"
10043040-42 = "음, 네. 안녕하세요. 밀레니엄 사이언스 스쿨 1학년, 노마사 레이입니다. 일단은, 후우…… 트레이닝부고요."
10043040-43 = "그렇지만 동시에 밀레니엄 야구부 소속이기도 하죠! 타순은…… 4번입니다!"
10043040-44 = "와아, 그렇군요! 대단하세요!"
10043040-45 = "혹시 야구에 대해서 잘 아시나요?!"
10043040-46 = "하나도 몰라요!"
10043040-47 = "그, 그렇군요……."
10043040-48 = "지금은 응원을 보내 드리고 있지만, 응급 처치가 필요하다면 언제든 말씀해 주세요. 구호기사단이니까요!"
10043040-49 = "어째서인지 여기에서는 갑작스러운 두통을 호소하는 분을 많이 만나곤 했는데요……."
10043040-50 = "트리니티 도서관에서 찾아낸 지 오래된 의학서에 따르면!"
10043040-51 = "두통은 나쁜 기운이 갑작스럽게 머리에 들어와, 생각을 혼란하게 하고 머리를 어지럽히는 것이라고 하더라고요!"
10043040-52 = "그러니까 나쁜 기운을 몰아내기 위해, 두개골을 절개하고 그 안을 식초로 소독하면……"
10043040-53 = "어떤 두통이라도 씻은 듯이 나을지도 몰라요!"
10043040-54 = "[s] \"아니야! 그거 아니야, 하나에!\""
10043040-55 = "그런가요? 그러면 역시 두통의 원인은 과도하게 분비된 흑담액이라는 두 번째 챕터의 설명이 맞는 것이었나 보네요……."
10043040-56 = "그러면 골무꽃 씨앗을 잘게 빻아서 꿀과 함께 복용하면, 이번에야말로 두통을 낫게 할 수 있겠네요!"
10043040-57 = "(처음 들어 보는 치료법인데…….)"
10043040-58 = "(하지만 트리니티는 전통의 명문고등학교니까, 그런 치료법을 독자적으로 새로 개발한 게 아닐까?)"
10043040-64 = "[ns] \"그런데 하나에는 여기서 뭐 하고 있었어?\""
10043040-65 = "그야 보시는 대로, 응원을 하고 있었죠!"
10043040-66 = "보시겠어요, 선생님? 레이 씨도요!"
10043040-67 = "힘내라! 나가자! 멀리 높이 더 빨리!"
10043040-68 = "한 번 더! 한 번 더! 반짝반짝 빛날 내일을 향해!"
10043040-73 = "이렇게 열정적으로 브레이브스를 응원해 주신다니……."
10043040-74 = "정말 감사해요! 모두 큰 힘이 될 거예요!"
10043040-75 = "천만에요! 저기, 그런데 브레이브스가 뭔가요?"
10043040-76 = "네, 네?!"
10043040-77 = "그러니까 그건…… 지금 경기를 하고 있는, 이 팀인데요?"
10043040-78 = "전통의 숙적인 아비시니안과의 대결에, 힘을 보태 주고 계신 것 아니었나요……?"
10043040-79 = "그런 건 잘 모르겠어요!"
10043040-80 = "하지만 어딘가에서 응원이 필요하다는 이야기가 들려서……."
10043040-81 = "도저히 참을 수 없어져서, 한달음에 달려왔지, 뭐예요!"
10043040-82 = "그게, 전부인가요?"
10043040-83 = "네! 그게 전부예요! 저는 누군가를 응원하는 게 좋거든요!"
10043040-84 = "제 응원으로 누군가가 힘을 낼 수 있다면…… 그래서 포기하려고 했던 일에 한 번만이라도 더 도전할 수 있게 된다면……."
10043040-85 = "그래서 마침내는! 뭔가가 조금이라도 더 나아질 수 있게 된다면!"
10043040-86 = "생각해 보세요. 그것보다 좋은 게 어디 있을까요?"
10043040-87 = "만일 단장님이 이 자리에 계셨다면……."
10043040-88 = "이거야말로, 구호가 필요한 곳에 구호를 전하는 일이라고 말씀하지 않으셨을까요?"
10043040-89 = "[s] \"응. 그건 정말로 그럴 것 같네.\""
10043040-90 = "사실 야구 관중석이라는 곳은…… 수많은 감정이 정신없이 휘몰아치는 곳이기는 하죠."
10043040-91 = "그런 자리에서, 이렇게 깨끗한 열정을 보여 주시는 분이 있다니, 정말로 감탄스럽네요."
10043040-92 = "네…… 정말로요……."
10043040-93 = "우리는 어쩌면, 어딘가에서 정말로 중요했던 것을 잃어버렸던 건지도 모르겠어요……."
10043040-94 = "[s] \"나까지 치유 받는 느낌이야…….\""
10043040-95 = "저, 그런데 하나에 씨? 혹시 이 근처에서…… 아니면 다른 관중석에서라도."
10043040-96 = "어딘가 조금 수상해 보인다거나, 어색하게 느껴지는 사람을 본 적 있으신가요?"
10043040-97 = "아니면 특정 팀의 승리나 패배를 유난히 강하게 바라는 사람이라던가요."
10043040-102 = "음…… 죄송해요! 역시 모르겠어요!"
10043040-104 = "역시 그런가요……."
10043040-105 = "생각하기에 따라서는, 어떤 의미로 이 자리에서 가장 수상해 보일 수도 있는 분이지만……."
10043040-106 = "동시에, 그렇기에 가장 범인일 수 없는 분이로군요. 하나에 씨는."
10043040-107 = "어라? 무슨 말씀이신가요? 범인이요?"
10043040-108 = "아뇨. 그런 일이 조금 있어요. 오늘 처음 뵌 분이지만, 하나에 씨는 그냥 이대로 좋다는 생각이 드네요."
10043040-109 = "모두에게 기운을 나눠 주셔서, 정말로 고맙습니다."
10043040-110 = "……브레이브스에는, 정말로 필요하거든요. 그런 게."
10043040-111 = "정확히는 모르겠지만 도움이 되었다니 기뻐요!"
10043040-116 = "하나에 쨩? 여기, 이쪽도 좀 도와줘! 응원이 필요해!"
10043040-120 = "아! 어딘가에 응원이 필요한 장소가 또 있나 봐요!"
10043040-121 = "그러면 선생님, 레이 씨! 다음에 또 봬요! 가 볼게요!"
10043040-125 = "[ns] \"잘 가라는 소리를 할 새도 없이 가 버렸네…….\""
10043040-126 = "정말 기운 넘치는 분이셨죠. 마치…… 음……. 이런 비유가 맞을지는 모르겠지만"
10043040-127 = "홈런, 같은 분이었네요."
10043040-128 = "[s] \"홈런?\""
10043040-129 = "……."
10043040-130 = "사람에 따라 관점은 다르겠지만, 저는 홈런이야말로 야구의 꽃이라고 생각해요."
10043040-131 = "특정 상황에서는, 투수의 긴장을 보다 유지하는 효과가 있고, 야수들의 실책 역시 유도할 수 있기 때문에."
10043040-132 = "홈런보다 안타가 좋다는 말을 하는 사람도 있고."
10043040-133 = "그에 반박하기 위해, 홈런이야말로 경기 내의 변수에 전혀 구애받지 않는 확률 100%의 득점 방법이기 때문에."
10043040-134 = "홈런이야말로 최고의 팀플레이라는 말을 하는 사람도 있죠."
10043040-135 = "그렇지만 그런 건 아무래도 좋아요. 저도 숫자나 통계로 야구에 접근하는 방식을 싫어하는 것은 아니지만……."
10043040-139 = "저에게 있어, 홈런만은 예외에요."
10043040-140 = "음, 어째서일까요? 여기에서도 그렇게 확실히 말로 설명할 수는 없지만……."
10043040-141 = "이기고 있는 팀에게는, 이제 확실히 이겼다는 쐐기를 꽂아 주죠. 지고 있는 팀에게는, 이제부터 반격을 시작할 수 있다는 희망을 주고요."
10043040-142 = "홈런 타구가 그리는 아름다운 포물선이 좋아요."
10043040-143 = "하늘로 높이 뻗는 흰 공의 모습이 좋아요."
10043040-144 = "아무런 방해도 없이 고고하게 그라운드를 도는 타자의 모습이…… 멋지다고 생각해요."
10043040-145 = "홈런은, 우리 모두에게 '할 수 있다'는 희망을 주는, 그 무언가죠. 활력이고, 생기고, 원동력이에요."
10043040-146 = "그런 건 좀처럼 얻을 수 없는 것으로 생각하고 있었지만……."
10043040-147 = "하나에 씨는, 그걸 너무나 자연스럽게 주위에 나눠줄 수 있는 사람처럼 보였어요."
10043040-148 = "……무언가를 저렇게, 그저 순수하게 좋아할 수 있다면 정말로 좋을 텐데."
10043040-149 = "[s] \"레이는 그렇지 않아?\""
10043040-150 = "……어떨까요."
10043040-151 = "이기고 지는 것은 늘 있을 수 있죠."
10043040-152 = "그게 경기고, 그게 시합이고, 그게…… 스포츠니까요."
10043040-153 = "아마도 아시겠지만…… 저희 밀레니엄 야구부만 해도, 그렇게 강팀이라고는 말할 수 없어요."
10043040-154 = "네에, 뭐……. 엔지니어부에서 만들어 준 로봇을 상대로 한 연습 경기에서도, 그다지 이기지 못하는 편이기도 하고요."
10043040-155 = "하지만 저는 역시, 야구가 좋아요."
10043040-156 = "그러니, 그렇다면 야구의 승리도 패배도 받아들여야 해요. 그런 결론을 내리는 게 맞아 보이기는 하는데 말이죠……"
10043040-157 = "그래도, 역시 이기는 게 좋긴 해요. 헤헤."
10043040-158 = "이기는 걸 보고 싶어요."
10043040-159 = "이왕 하는 거라면, 납득할 수 있는 결과를 원해요."
10043040-160 = "저만 그렇게 생각하는 건 아니겠죠. 1승이라도 해 보고 싶은, 브레이브스의 열성적인 팬들이라면 더더욱 그럴 거예요."
10043040-161 = "……브레이브스에는, 유독 열정적인 팬 분들이 많이 계시거든요."
10043040-162 = "이럴 때 누군가 홈런을 친다면, 그래서 경기의 분위기를 바꿔버리거나 흐름을 결정짓는다면."
10043040-163 = "그래서 마침내 승리하게 된다면, 정말로 멋질 텐데요……."
10043040-168 = "학생답지 않게, 훌륭한 마인드를 갖고 있구나."
10043040-169 = "그렇지, 그렇지……. 브레이브스의 경기를 보는 데에는, 그런 마음가짐이 매우 필요하지."
10043040-173 = "누, 누구신가요?!"
10043040-174 = "앗! 이분은 부처님이라는 별명을 가진, 브레이브스의 20년 팬이시잖아!"
10043040-175 = "항상 웃는 얼굴로 경기를 응원하기에, 부처님이라는 별명이 붙어 계신……!"
10043040-177 = "허허허, 과찬입니다. 저는 그냥 평범한 팬 중 한 명이고, 야구를 좋아하는 사람일 뿐이랍니다."
10043040-178 = "그러신가요……."
10043040-179 = "역시, 야구는 좋네요!"
10043040-180 = "처음 만나는 사람이라도, 이렇게 금방 마음을 열고 친해질 수 있고."
10043040-181 = "같은 광경을 보고, 같은 감정을 느끼며, 같은 것을 좋아할 수 있다니."
10043040-182 = "이것이 야구의 멋진 점, 나아가서 스포츠의 멋진 점이 아닐까요, 선생님!"
10043040-188 = "그리고 볼카운트는 3볼 1스트라이크……. 쳤습니다! 얕은 2루수 플라이!"
10043040-189 = "세상에!"
10043040-190 = "공을 떨어뜨렸습니다! 브레이브스의 2루수가 공을 떨어뜨렸습니다! 주자가 홈으로 들어옵니다!"
10043040-191 = "오! 이런! 맙소사! 2루수가 공을 떨어뜨렸어요!"
10043040-192 = "이게 뭡니까!"
10043040-195 = "……."
10043040-199 = "네 이놈들! 그러고도 너희들이 진정 선수란 말이더냐!"
10043040-200 = "평범한 플라이 하나 놓쳐서 이 사달을 낸단 말이냐!"
10043040-201 = "다 집어치워라! 집어치우란 말이야! 크아아아악–!!!"
10043040-202 = "[s] \"부, 부처님?!\""
10043040-206 = "……."
10043040-207 = "그…… 선생님. 이건, 그거네요."
10043040-208 = "부처님 얼굴도…… 세 번까지라고요……."
