[translation]
10057080-1 = "제8화;기쁨과 걱정"
10057080-3 = "[log]전차대회 예선까지[/log]"
10057080-5 = "[log]D-1[/log]"
10057080-27 = "[log]전차대회 예선[/log]"
10057080-29 = "[log]D-Day[/log]"
10057080-32 = "드디어, 그날이 오고야 말았다……."
10057080-36 = "예선 당일!!!"
10057080-40 = "짝짝짝."
10057080-41 = "[s] \"짝짝짝.\""
10057080-42 = "박수 정도는 입으로 소리 내지 말고 직접 치라구! 선생님도!"
10057080-43 = "손이 얼어서 싫어."
10057080-44 = "[s] \"오늘따라 유독 추워서…….\""
10057080-45 = "하긴, 밤새 차가운 쇳덩어리나 주물럭거렸으니까~"
10057080-46 = "난로도 새벽에 꺼져버렸고, 감기 걸릴 것 같아……."
10057080-47 = "아무튼, 어떻게든 예선은 안 늦겠네! 다들 수고했어!"
10057080-48 = "특히, 안나! 수고 많았어."
10057080-55 = "아? 으, 응!! 아하하. 벼, 별거 아니야……."
10057080-56 = "자 그러면, 이번에야말로 선생님께 공개합니다! 입드럼 시작!"
10057080-61 = "두구두구두구두구!"
10057080-62 = "두구두구두구두구-"
10057080-63 = "[s] \"두구두구두구두구-!\""
10057080-67 = "짜잔, 짠!!"
10057080-75 = "[ns] \"오!!! 와우!! 어?? 와, 와아!!\""
10057080-77 = "[ns] \"……전차란게 보통 이렇게 생겼었…… 나?\""
10057080-78 = "실례네요!!"
10057080-79 = "으윽, 역시 이런 반응인가……."
10057080-80 = "보통 있는 회전포탑은, 부품이 모자라서 못 만들었어요."
10057080-81 = "그래서, 일단은 포를 고정시키고 최소한의 방탄판만 둘러 뒀어요. 천장을 막을 뚜껑도 없지만, 일단 전차예요!"
10057080-85 = "그, 그래도! 할 건 다 했다구요?! 인산염 피막으로 방청처리도 완벽하구요!"
10057080-86 = "일단 경기 규정상으로는 전차니까, 참가 자격은 있습니다."
10057080-87 = "포탑이 없으면, 전차 자체를 돌리면 되니까요."
10057080-88 = "아무튼, 어떻게든 완성은 했으니까 오케이!"
10057080-89 = "이름도 정했어요! 이름하야- <강아지호>!"
10057080-90 = "[s] \"그보다 뭔가……. 이것저것 붙어 있지 않아……?\""
10057080-91 = "멋있죠! 폐차장에서 주워 온 부품들을 달아왔어요! 부서진 차에 달려있었더라구요"
10057080-92 = "처음 보는 부품이어서 뭔가 싶었는데요, 생각해보니 스크랩해둔 신문 기사에 나왔더라고요!"
10057080-93 = "단속된 폭주족들 차에 붙어 있던 거라, 아마 속도를 올리기 위한 부품이겠죠!"
10057080-94 = "빠른 차에 무언가 달려있다면, 빠르게 하는 부품일 테니까요!"
10057080-95 = "보는 것만으로도 가슴이 두근거리는 것에 비추어보면, 사기 진작의 효과도 기대됩니다."
10057080-96 = "[s] (일단은 아이들의 꿈을 지켜보도록 한다.)"
10057080-100 = "앗!! 이럴 때가 아니잖아!! 빨리 테스트해 보자!"
10057080-101 = "전차 전문가인 안나 씨! 테스트 부탁드립니다~!"
10057080-107 = "으, 응……."
10057080-111 = "일단, 외관 점검. 차체 볼트 및 너트 체결 상태 확인……."
10057080-112 = "둘, 넷, 여섯…… 응! 문제없어!"
10057080-113 = "……다음, 포탄 적재상태 확인 및 조준경 점검."
10057080-117 = "확인, 이상 무! 눈금 정렬 살짝 틀어진 건 예선장에 도착해서 잡을게."
10057080-122 = "뭐야, 너무 긴장한 거 아냐? 잘될 거니까 걱정하지 말라구!"
10057080-123 = "응……. 하하……."
10057080-124 = "……유압과 전기계통 체크. 라나가 해줘."
10057080-130 = "유압 정상. 전압은……."
10057080-134 = "정격 12볼트인데 11.2볼트로 떠. 이상해."
10057080-135 = "엥?! 그게 무슨 의미야?"
10057080-136 = "11.6 볼트 아래면 시동 안 걸려."
10057080-142 = "안 돼! 그러면 어떡해?"
10057080-143 = "예비 배터리로 교체하면 돼."
10057080-149 = "백업이 없는 시스템은 시스템이 아니잖아. 그래서 이중화 구성했어."
10057080-153 = "응. 14.3볼트. 살짝 과충전인데 문제없어."
10057080-154 = "까, 깜짝 놀랐네, 진짜-"
10057080-155 = "놀라기는."
10057080-157 = "……."
10057080-158 = "혹시 시간 여유 나면, 엔진 예열도 할 겸 시내 들르자! 카페 가서 당충전 하자! 에헤헤, 옷도 볼까?"
10057080-162 = "아, 응."
10057080-163 = "사람들한테 미리 자랑도 하는 거지! 폐품으로 만들었다고 하면 깜짝 놀랄 거야, 안 그래?"
10057080-164 = "'니키 안나, 대단한데~'라는 말 듣고 싶지 않아?"
10057080-165 = "응, 그러게……."
10057080-166 = "뭐야, 이 반응! 알았어, 알았어! 시내 가는 건 예선 끝나고 다음에 가기로~!"
10057080-167 = "자, 마저 점검하자! 다음은-"
10057080-171 = "……충분한 것 같은데, 얼른 출발하자! 점검할 거 더 있어~?"
10057080-172 = "조금만 더 봐야 할 것 같은데……."
10057080-173 = "리스트 다 체크했잖아~? 시동만 걸면 된다구!"
10057080-174 = "그래도 혹시 모르니까 처음부터 한 번만 더……."
10057080-175 = "평소엔 자신만만하더니, 갑자기 왜 이래?"
10057080-176 = "걱정 마! 다 같이 최선을 다해서 만들었잖아, 스스로 자신감 좀 가져!"
10057080-177 = "물론! 이번에 우승하면 너하고 이 눈밖에 없는 산골짜기는 빠이빠이지만! 얏호!"
10057080-178 = "예선 통과하면 어디부터 가지? 역시 즈나먀 카페? 아니면 옷가게부터~?"
10057080-179 = "그게 아니라, 그러니까……."
10057080-180 = "아 그렇지 미안! 깜빡했네!"
10057080-181 = "라나! 시동 걸어! 이 괴물의 울음소리를 듣고 싶다!!"
10057080-183 = "어흥-"
10057080-191 = "엥?"
10057080-192 = "시동 안 걸려? 다시 걸어봐!"
10057080-199 = "왜 이러지? 배터리가 또 말썽이야?"
10057080-200 = "배터리가 문제가 아니야."
10057080-205 = "연료가 없어."
10057080-209 = "아, 아차-! 리스트에서 연료 주입 항목을 빼먹었네! 바본가 봐 정말!"
10057080-210 = "안나, 기름 채워줘! 기름은 원래 네가 담당하잖아."
10057080-216 = "이럴 줄 알았으면, 좀 더 확신을 가져볼걸."
10057080-217 = "응? 뭐라고?"
10057080-218 = "시간 없어! 연료 어디에 있어?"
10057080-226 = "……!"
10057080-231 = "저기에 있어."
10057080-235 = "……난로에."
