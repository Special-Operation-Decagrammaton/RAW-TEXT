10057080-27 = "[log]戦車レース予選[/log]"
10057080-29 = "[log]D-Day[/log]"
10057080-32 = "ついに来てしまった……。"
10057080-33 = ""
10057080-35 = ""
10057080-36 = "予選当日！！！"
10057080-37 = ""
10057080-39 = ""
10057080-40 = "パチパチパチ。"
10057080-41 = "[s] \"パチパチパチ。\""
10057080-42 = "拍手くらい、口で言わずちゃんとやってよ！先生も！"
10057080-43 = "手が凍ってるから嫌だ。"
10057080-44 = "[s] \"今日はすごく寒くて……。\""
10057080-45 = "まあたしかに。金属も、触ってると痛くなるくらい冷えてるもんね～#n昨夜の作業は大変だった……。"
10057080-46 = "ストーブも朝方には消えちゃったし、風邪ひいちゃいそう……。"
10057080-47 = "とにかく、なんとか予選に間に合ったね！みんな、お疲れ～！"
10057080-48 = "特に、アンナ！お疲れさん。"
10057080-49 = ""
10057080-51 = ""
10057080-53 = ""
10057080-54 = ""
10057080-55 = "え？う、うん！あはは……そんな大したことでも……。"
10057080-56 = "じゃあ、今度こそ先生に完璧なものをお披露目しま～す！#n口ドラム、スタート！"
10057080-57 = ""
10057080-61 = "ドドドドドドドド！"
10057080-62 = "ドドドドドドドドー。"
10057080-63 = "[s] \"ドドドドドドドドー！\""
10057080-64 = ""
10057080-67 = "ジャジャーン！！"
10057080-68 = ""
10057080-75 = "[ns] \"お！わあ！！え？わあ！！！\""
10057080-77 = "[ns] \"あれ……？戦車って、こんな形……だったっけ？\""
10057080-78 = "失礼な！！"
10057080-79 = "――とは言ってみたけど。#nううっ、やっぱりそうなるかぁ……。"
10057080-80 = "よくある回転するような砲塔は、部品が足りなくてムリでした。"
10057080-81 = "だから砲を固定することにしたんです！#n最低限の防壁もないけど……一応、戦車です！"
10057080-82 = ""
10057080-84 = ""
10057080-85 = "で、でも！やれることは全部やったんですよ！？#nリン酸塩フィルムで防錆処理も完璧だし！"
10057080-86 = "ちゃんとレースの規定に則っているので、参加資格については問題ありません。"
10057080-87 = "砲塔がなければ、車体そのものを回せばいいんです。"
10057080-88 = "とにかく、完成はしたんだから万事オッケ～！"
10057080-89 = "名前も決めたんですよ！その名も「子犬号」！"
10057080-90 = "[s] \"車体に何か……いろいろと付いてるね。\""
10057080-91 = "かっこいいでしょ！廃車置き場で拾ってきたものを付けたんです！"
10057080-92 = "初めてみる部品だから何だろ～って思ったら、#nスクラップしておいた記事に載ってたんですよ！"
10057080-93 = "取り締まられた暴走族の車に付いていたので、#n恐らくスピードアップのための物だと思います！"
10057080-94 = "きっとこれが速さの秘密なんですよ！"
10057080-95 = "見ているだけでもワクワクするので、士気の向上も期待できますね！"
10057080-96 = "[s] （楽しそうなエリナたちを見守る）"
10057080-97 = ""
10057080-99 = ""
10057080-100 = "あっ、そうだ！早速テストしてみないと！"
10057080-101 = "戦車の専門家であるアンナさん！テストお願いしま～す！"
10057080-102 = ""
10057080-104 = ""
10057080-105 = ""
10057080-106 = ""
10057080-107 = "う、うん……。"
10057080-110 = ""
10057080-111 = "まずは外観チェック。車体のボルトとナットの締め具合を確認……。"
10057080-112 = "2、4、6……うん！問題なし！"
10057080-113 = "……次、砲弾積載状態の確認及び照準器のチェック。"
10057080-114 = ""
10057080-116 = ""
10057080-117 = "確認、異常なし！目盛りが少しずれているのは、会場に着いてから直すね。"
10057080-118 = ""
10057080-120 = ""
10057080-121 = ""
10057080-122 = "ちょっと、緊張しすぎじゃない？うまくいくから、心配ないって！"
10057080-123 = "うん……あはは……。"
10057080-124 = "……油圧と電気系統をチェック。ラナ、お願い。"
10057080-125 = ""
10057080-127 = ""
10057080-129 = ""
10057080-130 = "油圧、正常。電圧は……。"
10057080-131 = ""
10057080-133 = ""
10057080-134 = "おかしい。定格は12ボルトなのに11.2ボルトって表示されてる。"
10057080-135 = "え！？つまり、どういうこと？"
10057080-136 = "11.6ボルト以下だとエンジンがかからない。"
10057080-137 = ""
10057080-140 = ""
10057080-142 = "嘘でしょ！？じゃあ、どうするの？"
10057080-143 = "予備のバッテリーに交換すればいい。"
10057080-144 = ""
10057080-147 = ""
10057080-149 = "バックアップのないシステムはシステムじゃない。だから二重化構成にしてた。"
10057080-150 = ""
10057080-152 = ""
10057080-153 = "うん。14.3ボルト。過充電だけど問題ない。"
10057080-154 = "び、びっくりしたぁ～、も～"
10057080-155 = "大げさ。"
10057080-157 = "……。"
10057080-158 = "時間に余裕があったら、エンジンあっためるのも兼ねて繁華街に寄ろう！#n私たちもカフェで糖分を補給しないと！えへへ、服とか見ちゃう？"
10057080-159 = ""
10057080-161 = ""
10057080-162 = "あ、うん。"
10057080-163 = "ついでにみんなに自慢しよーよ！#n廃品で作ったって言ったら、びっくりすると思わない？"
10057080-164 = "「[ruby=にき]仁木[/ruby]アンナ、すごい～」って言われたいでしょ？"
10057080-165 = "うん、そうだね……。"
10057080-166 = "テンション低っ！はいはい！繁華街に行くのは予選が終わってからにしまーす！"
10057080-167 = "じゃあ、チェックを続けよう！次は――"
10057080-170 = ""
10057080-171 = "……ねぇ、まだチェックすることあるの～？#n遅れちゃうから早く出発しよーよ！"
10057080-172 = "もう少しだけ見たほうがいいと思う……。"
10057080-173 = "リストは全部チェックしたでしょ～？あとはエンジンをかけるだけじゃん！"
10057080-174 = "でも念のため、初めからもう一度だけ……。"
10057080-175 = "いつもは自信たっぷりのくせに、急にどうしたの？"
10057080-176 = "心配ないって！みんなで力を合わせてできた作品でしょ！もっと自信持と～よ！"
10057080-177 = "もちろん！今回優勝したらアンナとも、#nこの雪しかない山奥ともサヨナラだけどね！やっほーい！"
10057080-178 = "予選通過したら、どこに行こうかな～？#nやっぱりズナーミャカフェ？いや、洋服が先か！"
10057080-179 = "そうじゃなくて、つまり……。"
10057080-180 = "あ、ごめん！忘れてた！"
10057080-181 = "ラナ！エンジンかけて！この[ruby=・]怪[/ruby][ruby=・]物[/ruby]の雄たけびが聞きたい！！"
10057080-183 = "がおがおー。"
10057080-184 = ""
10057080-191 = "え？"
10057080-192 = "エンジン、かからないの？もう一度やってみて！"
10057080-193 = ""
10057080-198 = ""
10057080-199 = "ど、どうしたんだろう？またバッテリーのトラブル？"
10057080-200 = "バッテリーの問題ではなく――"
10057080-201 = ""
10057080-203 = ""
10057080-204 = ""
10057080-205 = "燃料がない。"
10057080-206 = ""
10057080-208 = ""
10057080-209 = "あちゃ～！リストに「燃料注入」の項目を入れるのを忘れてた～！"
10057080-210 = "アンナ、担当でしょ！早く燃料入れて！"
10057080-211 = ""
10057080-213 = ""
10057080-215 = ""
10057080-216 = "……こんなことになるなら、もっと自信を持てば良かった。"
10057080-217 = "え？何？"
10057080-218 = "時間ないんだよ！燃料はどこ？"
10057080-219 = ""
10057080-222 = ""
10057080-225 = ""
10057080-226 = "……！"
10057080-227 = ""
10057080-229 = ""
10057080-231 = "あっちにある。"
10057080-232 = ""
10057080-235 = "……ストーブに。"
10057080-236 = ""
