[translation]
2600106-1 = "한없이 투명에 가까운 백색"
2600106-2 = "키보토스 중앙구 전자상점가"
2600106-4 = "(새 이어폰을 구매하기 위해 전자상점가를 돌아보던 중, 음반매장에서 청음을 하는 코타마를 보았다.)"
2600106-9 = "…………."
2600106-10 = "[ns] \"어이— 코타마.\""
2600106-11 = "……♪"
2600106-15 = "(코타마는 음악을 감상하느라 이쪽을 알아차리지 못한 것 같다.)"
2600106-16 = "[s] 코타마를 가까이에서 보기 위해 음반매장으로 들어간다."
2600106-22 = "[wa:300]― [log=코타마]아, [wa:740]선생님.[/log]"
2600106-25 = "[wa:500]― [log=코타마]죄송합니다……[/log]"
2600106-26 = "[wa:1820]― [log=코타마]음악을 듣느라, [wa:1115]미처 깨닫지 못했습니다.[/log]"
2600106-30 = "[ns] \"괜찮아. 뭘 그렇게 열심히 듣고 있던 거야?\""
2600106-31 = "[wa:600]― [log=코타마]이 음악, [wa:725]말인가요?[/log]"
2600106-34 = "[wa:400]― [log=코타마]……[wa:500]후후. [wa:1695]모처럼이니[/log]"
2600106-35 = "[wa:1850]― [log=코타마]선생님도 [wa:740]들어보시겠습니까?[/log]"
2600106-39 = "[ns] \"이건…… 카페의 소음이잖아?\""
2600106-40 = "[wa:400]― [log=코타마]네. [wa:1385]이건 음악이 아니라[/log]"
2600106-41 = "[wa:2230]― [log=코타마]카페에 있는 사람들의 [wa:965]대화나 주변 소리를 녹음한,[/log]"
2600106-44 = "[wa:500]― [log=코타마]이른바 '환경음'입니다.[/log]"
2600106-47 = "[wa:1450]― [log=코타마]리듬도 멜로디도 없지만……,[/log]"
2600106-48 = "[wa:2765]― [log=코타마]귀를 기울이고 있노라면 [wa:2100]여러 사람들의 목소리가 들립니다.[/log]"
2600106-51 = "[wa:400]― [log=코타마]사람들이 자아내는 일상의 음색이,[/log]"
2600106-52 = "[wa:2700]― [log=코타마]제게는 어째서인지, [wa:1855]그 어떤 음악보다 [wa:990]깊게 다가와서…….[/log]"
2600106-55 = "[wa:1000]― [log=코타마]언제까지나[/log]"
2600106-56 = "[wa:1650]― [log=코타마]이 소리를 듣고 싶어지네요.[/log]"
2600106-59 = "(이후 코타마가 추천해 준 음반을 들으며 시간을 보냈다.)"
2600106-61 = "선생님, 오늘 들어보신 환경음의 감상은 어떠셨습니까?"
2600106-62 = "[s] \"생각보다 종류가 다양해서 놀랐어.\""
2600106-63 = "요즈음은 작업의 집중도를 높이기 위한 여러 가지 작업용 소음이 음반으로 나오고 있으니까요."
2600106-64 = "카페의 소음이나, 비 내리는 소리 등 작업용 소음에도 다양한 종류가 있습니다."
2600106-65 = "[s] \"코타마는 그중에서 어떤 종류의 환경음을 제일 좋아해?\""
2600106-66 = "글쎄요. 오늘 들은 것과 같은 카페의 소음도 좋고, 비 내리는 소리도 좋지만……."
2600106-70 = "역시 제일은 선생님의 목소리가 아닐까요."
2600106-71 = "[s] \"내 목소리?\""
2600106-72 = "네, 선생님의 나긋나긋한 목소리를 듣고 있으면 마음이 편안해지고, 정신이 또렷해집니다."
2600106-73 = "선생님의 목소리로 발매된 정식 음반이 없다는 게 유일한 단점이지만요."
2600106-78 = "그러니 선생님, 이제 슬슬 선생님의 목소리를 정식으로 녹음하도록 허가해 주시면 안 되겠습니까?"
2600106-79 = "[s] \"안 돼.\""
2600106-80 = "치사해~"
2600106-82 = "(이후 녹음기를 작동시키려는 코타마와 계속 실랑이를 벌이며 시간을 보냈다.)"
