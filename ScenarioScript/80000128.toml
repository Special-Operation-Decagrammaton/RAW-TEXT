[translation]
80000128-1 = "의외의 선물"
80000128-2 = "(업무로 하루 종일 정신없이 보내던 중…….)"
80000128-3 = "[ns] \"피곤하다…….\""
80000128-5 = "선생님~ 있나?"
80000128-10 = "오, 있네."
80000128-11 = "[s] \"안녕, 노조미…….\""
80000128-12 = "파햐햐, 뭐야? 그 반건조 생선 같은 눈동자는."
80000128-13 = "아~ 아~ 그래, 그래. 과로하고 있을 것 같았어."
80000128-14 = "그런 의미에서……"
80000128-15 = "자, 이거!"
80000128-20 = "뭐. 별건 아니고, 피로 회복에 좋다는 영양 젤리야."
80000128-21 = "선생님, 달달한 건 이미 많이 받았을 것 같고. 평소에도 이런저런 일들로 고생하고 있으니까."
80000128-22 = "이런 영양제 같은 게 필요하지 않을까~ 생각해서! 파햐햣!"
80000128-23 = "[ns] \"노조미……!\""
80000128-25 = "우와, 뭐야. 그 표정."
80000128-26 = "감동했다고?"
80000128-27 = "뭐, 직접 만든 것도 아닌데……."
80000128-28 = "파햐햐~ 은근히 이런 데에 약하다니까, 선생님."
80000128-29 = "그럼, 모처럼 준 거니까 잘 챙겨 먹어~"
80000128-30 = "난 잠깐 들른 거라 이만 가볼게."
80000128-31 = "농땡이 좀 피다 갈까 했는데, 선생님 여전히 바빠 보이고."
80000128-32 = " 조금 더 있다 가도 된다고?"
80000128-36 = "흐응, 그럼 나랑 놀아줄 거야?"
80000128-37 = "[s] \"일은 나중에도 할 수 있으니까!!\""
80000128-38 = "파햐햐, 바로 그 자세지!"
80000128-43 = "좋아, 그럼……"
80000128-44 = "뭐 하고 놀까?"
80000128-46 = "(모든 걸 잊고 노조미와 한동안 신나게 놀았다.)"
80000128-47 = "(노조미는 실컷 놀아서 스트레스가 풀렸다며, 늦게까지 남은 업무 처리를 도와줬다…….)"
