90101070-146 = "ขอบคุณสำหรับอาหารนะคะ คุณเจ้าของร้าน!"
90101070-147 = "จะไปแล้วเหรอ? เหมือนยังกินไม่หมดเลยนะ..."
90101070-148 = "พอดีนึกเรื่องด่วนขึ้นมาได้น่ะค่ะ"
90101070-149 = "ไว้คราวหน้าจะแวะมาอีกนะคะ!"
