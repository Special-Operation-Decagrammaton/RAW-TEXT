[translation]
90101070-1 = "ตอนที่ 7;ประกาศประกวดราคา"
90101070-2 = "ท่าเรือคาเนะซากิ ร้าน <อากิตะ ซีฟู้ด>"
90101070-4 = ""
90101070-5 = "อากิตะ ซีฟู้ด ยินดีต้อนรับครับ!"
90101070-6 = "เอ๋? แม่หนูคนนี้คือ..."
90101070-7 = ""
90101070-10 = ""
90101070-11 = "สวัสดีค่ะ วันนี้ได้เจอกันในร้านนะคะ"
90101070-12 = "ถึงจะเช้าไปหน่อย แต่ร้านเปิดแล้วใช่มั้ยคะ?"
90101070-13 = "ใช่ เพิ่งเปิดร้านเมื่อกี้นี้เอง..."
90101070-14 = "แต่หนูพนักงานส่งอาหารมาที่นี่เองเลย แปลว่ามีออเดอร์ให้ไปส่งจากที่ไหนงั้นเหรอ?"
90101070-15 = "เปล่าค่ะ วันนี้ฉันแค่อยากมาทานอาหารที่นี่ เลยมากับเพื่อนๆ ค่ะ"
90101070-16 = "นี่ไงคะ พวกเราแค่แวะมาทานมื้อเช้ากันเฉยๆ ค่ะ"
90101070-17 = ""
90101070-19 = ""
90101070-20 = ""
90101070-21 = ""
90101070-22 = ""
90101070-23 = "ที่นี่คือร้านที่นิโกะเคยพูดถึงเหรอ?"
90101070-24 = "อืม ดูจากภายนอกก็ไม่ได้ต่างจากร้านอื่นแถวนี้เท่าไรนะ"
90101070-25 = "ดูจากตู้ปลาที่แทบไม่มีคราบทั้งที่ก็สกปรกได้ง่าย และหัวเตาที่สะอาดแล้ว ที่นี่ดูจะใส่ใจเรื่องความสะอาดมากเลยนะ"
90101070-26 = "เรื่องความสดของปลาคงไม่ต้องกังวลเลย"
90101070-27 = "โอ้ เพื่อนๆ ของแม่หนูสินะ?"
90101070-28 = "ถึงที่นี่จะไม่มีเมนูที่ถูกใจนักเรียนวัยรุ่นมากนัก แต่ฉันก็ทำเมนูที่มีให้ได้ทันที อยากกินอะไรก็สั่งมาได้เลย!"
90101070-29 = "อ้อ ยกเว้นเมนูของทอดที่อยู่ด้านหลังเมนูนะ วัตถุดิบสำหรับของทอดยังมาไม่ถึงน่ะ"
90101070-30 = "[ns] \"อยากกินปลาอาจิทอดแท้ๆ... น่าเสียดายจัง\""
90101070-31 = "ว่าแต่... ผู้ใหญ่ทางนี้คือใครล่ะ?"
90101070-32 = "พานักเรียนหญิงมาเดินอยู่แถวท่าเรือตั้งแต่เช้า ดูน่าสงสัยอยู่นะ"
90101070-33 = "[s1] \"เป็นผู้ปกครองของนักเรียนกลุ่มนี้น่ะ\"\n[s2] \"เป็นเหมือนกับ... ผู้ว่าจ้างของนิโกะน่ะ!\""
90101070-36 = "อ้อ เป็นเจ้าของบริษัทส่งอาหารจิ้งจอกอะไรนั่นสินะ ฉันเสียมารยาทจริงๆ เลย!"
90101070-37 = "ฉันได้รับความช่วยเหลือจากพนักงานส่งอาหารคนนั้นหลายอย่างเลยละ"
90101070-38 = "พอเห็นว่าร้านกำลังลำบาก ก็เป็นฝ่ายเสนอความร่วมมือทางธุรกิจก่อน เป็นเด็กที่มีฝีมือมากจริงๆ"
90101070-39 = "[s3] \"ตาถึงจริงๆ เลยนะ\"\n[s4] \"นักเรียนกลุ่มนี้ยอดเยี่ยมกันทุกคนเลยละ\""
90101070-42 = "คุยอะไรกันอย่างภูมิอกภูมิใจขนาดนั้นน่ะ...?"
90101070-43 = "เหมือนกำลังดูพ่อแม่คุยอวดลูกไม่มีผิดเลย"
90101070-44 = "ดูสิ นิโกะหูแดงแจ๋แล้ว"
90101070-45 = "คะ... คุณครู รีบสั่งอาหารก่อนเถอะค่ะ!"
90101070-46 = ""
90101070-48 = ""
90101070-49 = ""
90101070-50 = "[ns5] \"ขอเป็น 'ข้าวหน้าปลาดิบตามใจเชฟ' 5 ที่\"\n[ns6] \"เอาเป็น 'ข้าวหน้าปลาดิบตามใจเชฟ'' 5 ที่\""
90101070-53 = "ข้าวหน้าปลาดิบตามใจเชฟใช่มั้ย? รับออเดอร์ครับ!"
90101070-54 = ""
90101070-56 = ""
90101070-61 = ""
90101070-62 = "ว่าแต่ทำไมเมนูนี้ถึงชื่อว่าข้าวหน้าปลาดิบตามใจเชฟเหรอคะ?"
90101070-63 = "ก็เพราะวัตถุดิบที่ใส่ไม่ตายตัว เปลี่ยนไปทุกวัน ก็เลยเรียกว่า 'ตามใจเชฟ' ยังไงล่ะ"
90101070-64 = "ปกติข้าวหน้าปลาดิบของร้านแบบนี้จะใช้เศษปลาที่เหลือจากการแล่ซาชิมิ หรือปลาเบ็ดเตล็ดมาทำเป็นข้าวหน้าปลาดิบ..."
90101070-65 = "เมนูก็เลยเปลี่ยนไปตามชนิดของปลาที่เข้ามาในวันนั้น พอเจ้าของทำตามใจตัวเอง ก็เลยเรียกว่าข้าวหน้าปลาดิบตามใจเชฟน่ะ"
90101070-66 = "ถึงจะเป็นเมนูที่ราคาถูกที่สุด แต่บางครั้งก็มีลูกค้าสั่งเพื่อลองเสี่ยงดวงประจำวันอยู่เหมือนกัน"
90101070-67 = "อะไรกัน งั้นก็อาจได้ข้าวที่โปะมาแต่ปลาอาจิล้วนๆ ก็ได้น่ะสิ?"
90101070-68 = "เธอยังไม่เคยเผชิญด้านมืดของสังคมสินะ คุรุมิ เลิกคิดว่าข้าวหน้าปลาดิบจะต้องมีแต่ปลาดิบได้แล้ว"
90101070-69 = "ร้านอาจจะเสิร์ฟข้าวที่โปะปูอัดหรือทูน่ากระป๋อง เพื่อคุมต้นทุนก็ได้นะ"
90101070-70 = "แบบนั้นยังเรียกว่าข้าวหน้าปลาดิบได้อีกเหรอ?!"
90101070-71 = "ข้าวหน้าทูน่ามายองเนสก็รสชาติไม่เลวนะ แต่ข้อเสียคือแคลอรี่ค่อนข้างสูงนี่แหละ"
90101070-72 = ""
90101070-74 = ""
90101070-75 = ""
90101070-76 = "มาแล้ว ข้าวหน้าปลาดิบตามใจเชฟ 5 ที่"
90101070-77 = "นี่มัน..."
90101070-78 = "เอ่อ เสิร์ฟผิดหรือเปล่าคะ?"
90101070-79 = "หรือว่าสลับกับข้าวหน้าปลาทูน่าดิบของลูกค้าคนอื่น..."
90101070-80 = "เสิร์ฟผิดอะไรล่ะ? นี่เป็นออเดอร์แรกของวันนี้นะ"
90101070-81 = "เมื่อเช้าฉันแล่ปลาทูน่าพลาด ก็เลยมีเศษปลาดิบเหลือมากกว่าที่คิดเท่านั้นเอง"
90101070-82 = "แต่ก็ไม่ได้มีทูน่าแบบนี้ทุกวัน เพราะงั้นอย่าคาดหวังว่าจะได้ทุกครั้งล่ะ..."
90101070-83 = ""
90101070-85 = ""
90101070-86 = ""
90101070-87 = "ฮุฮุ วันนี้โชคดีจริงๆ นะคะ"
90101070-88 = "ขอบคุณสำหรับอาหารนะคะ จะทานให้อร่อยเลยค่ะ!"
90101070-89 = ""
90101070-91 = ""
90101070-92 = ""
90101070-93 = ""
90101070-94 = "รสชาตินี้มัน...!"
90101070-95 = "[s] \"พอจะรู้อะไรงั้นเหรอ โอโทกิ?\""
90101070-96 = "เปล่า ก็ไม่ค่อยรู้หรอก แต่ทูน่านี่..."
90101070-97 = "น่าจะเป็นส่วนที่ราคาแพงเลยนะ... ให้ความรู้สึกเหมือนกินของแพงมากเลย!"
90101070-98 = "ฉันก็ไม่ค่อยรู้เรื่องปลาดิบเท่าไร... แต่รู้สึกได้เลยว่านี่เป็นปลาทูน่าคุณภาพดี "
90101070-99 = "ทั้งมันและนุ่มเหมือนเนย แต่ก็ยังมีความเด้งกำลังดี ทำให้เคี้ยวอร่อยจริงๆ..."
90101070-100 = "อย่าบอกนะ ถึงจะไม่เคยกินมาก่อน แต่นี่คงไม่ใช่ส่วนโอโทโระหรอกเนอะ?"
90101070-101 = "ซอสโชยุที่กินคู่กับทูน่าก็อร่อยมากเลยนะคะ"
90101070-102 = "กลิ่นยูซุหอมอ่อนๆ กับรสเปรี้ยวกำลังดี ช่วยชูรสปลาโดยไม่กลบรส แถมยังเข้ากับวัตถุดิบอื่นได้#nอย่างลงตัวเลยค่ะ"
90101070-103 = "อืม ข้าวก็ดูเหมือนหุงจากข้าวคุณภาพดีเหมือนกัน"
90101070-104 = "คุณภาพดีเกินกว่าจะเชื่อว่าเป็นข้าวหน้าปลาดิบราคาเท่านี้เลย"
90101070-105 = "ฮุฮุ เห็นเด็กๆ กินกันเอร็ดอร่อยแบบนี้ ฉันก็มีกำลังใจขึ้นเลย"
90101070-106 = "นอกจากข้าวหน้าปลาดิบ ยังมีเมนูที่ฉันมั่นใจอีกเยอะ ครั้งหน้าลองสั่งอย่างอื่นดูนะ"
90101070-107 = ""
90101070-109 = ""
90101070-110 = "ถ้าร้านนี้ยังเปิดอยู่ถึงเดือนหน้าน่ะนะ..."
90101070-111 = ""
90101070-113 = ""
90101070-114 = "ร้านนี้จะปิดกิจการเหรอคะ?"
90101070-115 = "เปล่า ไม่ได้หมายความว่าจะปิดหรอก เพียงแต่ว่า..."
90101070-116 = "ร้านที่เปิดอยู่ในท่าเรือคาเนะซากิจะต้องต่อสัญญาด้วยการประกวดราคาเป็นประจำน่ะ"
90101070-117 = "อีกไม่นานก็จะถึงกำหนดประกวดราคารอบถัดไปแล้ว แล้วท่าเรือคาเนะซากิก็เข้าถึงง่าย คนสัญจรเยอะ การแข่งขันเลยค่อนข้างสูง"
90101070-118 = "ช่วงนี้ลูกค้าน้อยจนกำลังคิดว่าจะยอมแพ้การประกวดราคารอบหน้าอยู่แล้ว แต่ต้องขอบใจแม่หนูคนนี้ที่พาลูกค้ามาให้ ฉันเลยว่าจะลองสู้ต่อในเดือนหน้าน่ะ"
90101070-119 = "โล่งอกไปทีนะคะที่ร้านดีๆ จะได้เปิดต่อ"
90101070-120 = ""
90101070-122 = ""
90101070-123 = "ก็นะ... แต่ปัญหาคงเป็นการ์ปัชโช่ แฟมิลี่มากกว่าพวกเราน่ะสิ"
90101070-124 = "ไม่นานมานี้พวกนั้นถูกเล่นงานเสียยับ ในการประกวดราคารอบหน้าคงมีองค์กรไม่น้อยที่มองว่า#nการ์ปัชโช่ แฟมิลี่ไม่ได้น่ากลัวและคิดจะแย่งสัญญาจ้างไปแน่..."
90101070-125 = "การประกวดราคารอบหน้าเหรอคะ...?"
90101070-126 = "แย่ละสิ หลุดปากไปเสียได้"
90101070-127 = "ขอโทษนะ ช่วยทำเป็นว่าไม่ได้ยินเรื่องเมื่อกี้ได้มั้ย?"
90101070-128 = "ถ้าพวกสมาชิกองค์กรรู้ว่าฉันเที่ยวเอาข่าวที่การ์ปัชโช่ แฟมิลี่ถูกเล่นงานย่อยยับไปเผยแพร่ ร้านนี้คงไม่รอดแน่..."
90101070-129 = "ไม่ใช่ค่ะ คือว่า..."
90101070-130 = "แม้แต่งานรักษาความปลอดภัยที่การ์ปัชโช่ แฟมิลี่รับผิดชอบ ก็ต้องผ่านการประกวดราคาเพื่อให้ได้#nสิทธิ์เหมือนกันเหรอคะ?"
90101070-131 = "ก็แน่นอนสิ งานแทบทุกอย่างที่ดำเนินการในท่าเรือคาเนะซากิ ต้องผ่านกระบวนการประกวดราคาของ#nองค์การนักเรียนทั้งนั้น"
90101070-132 = "เพียงแต่ที่ผ่านมาไม่มีใครกล้าเข้าร่วมแข่งประกวดราคา เพราะกลัวการแก้แค้นของการ์ปัชโช่ แฟมิลี่"
90101070-133 = "แต่ความขัดแย้งครั้งนี้ก็พิสูจน์ให้เห็นว่าการ์ปัชโช่ แฟมิลี่เป็นเสือที่ไม่มีเขี้ยวเล็บแล้ว งั้นก็น่าจะเริ่มมีพวกที่คิดว่า ลองท้าชิงดูก็ไม่เสียหาย..."
90101070-134 = "โธ่เอ๊ย ปากพล่อยอีกแล้วฉัน..."
