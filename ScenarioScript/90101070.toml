90101070-155 = "อย่าบอกนะ..."
90101070-156 = "เด็กพวกนั้น คงไม่ใช่พวกเดียวกับการ์ปัชโช่ แฟมิลี่หรอกเนอะ...?"
90101070-158 = "ตอนต่อไป;ความลับของการ์ปัชโช่ แฟมิลี่"
