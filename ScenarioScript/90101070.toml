[translation]
90101070-1 = "第7話;定期招標公告"
90101070-2 = "鐘崎港．「龝田水產」"
90101070-4 = ""
90101070-5 = "歡迎光臨龝田水產！"
90101070-6 = "嗯？同學你是……"
90101070-7 = ""
90101070-10 = ""
90101070-11 = "您好，今天是在店裡見面呢。"
90101070-12 = "雖然時間還有點早，不過已經開始營業了吧？"
90101070-13 = "是啊。雖然才剛開店而已……"
90101070-14 = "外送的同學特地親自跑一趟，難道是從哪裡收到了外送訂單嗎？"
90101070-15 = "不是的，今天只是想在這裡用餐，所以才和朋友們一起過來的。"
90101070-16 = "來，您看。大家就只是單純來用餐而已。"
90101070-17 = ""
90101070-19 = ""
90101070-20 = ""
90101070-21 = ""
90101070-22 = ""
90101070-23 = "這裡就是仁子之前說的那家店嗎？"
90101070-24 = "嗯……外觀看起來和周圍其他店家沒什麼太大的差別呢。"
90101070-25 = "容易產生髒污的水槽上沒有任何污漬，爐口也很乾淨……看來很注重清潔呢。"
90101070-26 = "魚的新鮮度應該是不用擔心了。"
90101070-27 = "哦，是同學的朋友們嗎？"
90101070-28 = "雖然年輕學生會喜歡的菜色不多，但我可以馬上準備。儘管點吧！"
90101070-29 = "啊，不過菜單背面的炸物除外。因為那部分的食材還沒送到。"
90101070-30 = "[ns] 「我本來還很好奇炸竹莢魚的說……真可惜。」"
90101070-31 = "話說回來……這邊這位大人是誰？"
90101070-32 = "一大早就帶著女學生們在港口四處閒晃，總覺得有點可疑啊。"
90101070-33 = "[s1] 「我是這些學生的監護人。」\n[s2] 「就是……仁子的僱主之類的！」"
90101070-36 = "啊啊，原來是那個什麼狐狸外送的社長嗎？這可真是失禮了！"
90101070-37 = "我在各方面都受了你們的外送員不少幫助呢。"
90101070-38 = "發現我陷入困境就主動來提出商業合作……#n看來是個有經商才能、手腕高明的孩子呢。"
90101070-39 = "[s3] 「您真有眼光。」\n[s4] 「因為我的學生們都很優秀嘛。」"
90101070-42 = "……為什麼你們可以聊得一副那麼得意的樣子啊？"
90101070-43 = "簡直就像在看溺愛孩子的父母炫耀自家小孩一樣呢。"
90101070-44 = "你看，仁子的耳朵都漲得通紅了。"
90101070-45 = "老，老師。我們趕快先點餐吧！"
90101070-46 = ""
90101070-48 = ""
90101070-49 = ""
90101070-50 = "[ns5] 「那麼……」\n[ns6] 「請給我們五碗『隨性生魚片蓋飯』。」"
90101070-53 = "「隨性生魚片蓋飯」是吧。沒問題！"
90101070-54 = ""
90101070-56 = ""
90101070-61 = ""
90101070-62 = "不過為什麼名字是隨性生魚片蓋飯呢？"
90101070-63 = "因為裡面放的食材每天都不一樣，所以才叫「隨性」生魚片蓋飯啊。"
90101070-64 = "一般這種店家推出的生魚片蓋飯，#n大多都是拿切生魚片剩下的邊角料或廉價的魚來製作蓋飯……"
90101070-65 = "這樣一來，根據當天進貨的魚種不同，蓋飯的內容也會跟著改變……#n全憑老闆的心情自由搭配，所以才會叫隨性生魚片蓋飯。"
90101070-66 = "價格是最便宜的，但偶爾也會有人為了測試當天的運氣而點這道菜。"
90101070-67 = "什麼嘛，那不就有可能端出只放滿竹莢魚生魚片的蓋飯嗎？"
90101070-68 = "你還沒有切身體會過社會的黑暗面呢，胡桃。#n快拋棄「生魚片蓋飯上只有生魚片」的偏見吧。"
90101070-69 = "搞不好為了壓低成本，會端出放了蟹肉棒或鮪魚罐頭的蓋飯哦。"
90101070-70 = "那也能叫生魚片蓋飯嗎！？"
90101070-71 = "鮪魚美乃滋蓋飯的味道也不賴，缺點就是熱量稍微高了一點。"
90101070-72 = ""
90101070-74 = ""
90101070-75 = ""
90101070-76 = "來，你們的五碗隨性生魚片蓋飯。"
90101070-77 = "這是……"
90101070-78 = "那個……是不是上錯了呢？"
90101070-79 = "會不會是和其他客人點的鮪魚生魚片蓋飯搞混了……"
90101070-80 = "你在說什麼啊？這可是今天的第一筆訂單。"
90101070-81 = "只是今天早上切鮪魚的時候失手了，所以剩下的邊角料比想像中多了一點而已。"
90101070-82 = "……不是每天都會像今天這樣，可不要每次都期待啊。"
90101070-83 = ""
90101070-85 = ""
90101070-86 = ""
90101070-87 = "呵呵呵，今天運氣真好呢。"
90101070-88 = "那麼，我要開動了！"
90101070-89 = ""
90101070-91 = ""
90101070-92 = ""
90101070-93 = ""
90101070-94 = "這個味道是……！"
90101070-95 = "[s] 「你嚐得出什麼嗎，御伽？」"
90101070-96 = "不，雖然我也不太清楚啦。#n但是這個鮪魚……"
90101070-97 = "好像是很高級的部位，有種很貴的感覺！"
90101070-98 = "雖然我也不太懂生魚片……但這確實給人一種高級鮪魚的感覺呢。"
90101070-99 = "有如奶油般油潤柔嫩，同時又具有適度的彈性與口感……"
90101070-100 = "難道說……雖然我沒吃過，但這該不會是那個大腹肉的部位吧！？"
90101070-101 = "淋在鮪魚上的醬油，味道也非常出色呢。"
90101070-102 = "柚子的香氣隱隱飄散……#n恰到好處的酸味既不會破壞魚肉本身的味道，又能和其他食材完美融合。"
90101070-103 = "嗯，米飯也讓人感覺是用了品質優良的米煮出來的呢。"
90101070-104 = "難以相信這是那種價位的生魚片蓋飯會有的品質。"
90101070-105 = "哈哈，看同學們吃得這麼香，我也來勁了呢。"
90101070-106 = "除了生魚片蓋飯以外，我拿手的菜色還多得是，下次再來嚐嚐其他菜色吧。"
90101070-107 = ""
90101070-109 = ""
90101070-110 = "……當然，前提是下個月這家店還能繼續營業的話。"
90101070-111 = ""
90101070-113 = ""
90101070-114 = "這家店要收掉了嗎？"
90101070-115 = "不，並不是說要收掉。#n只是……"
90101070-116 = "進駐鐘崎港內的店家，都要定期透過招標來續約。"
90101070-117 = "距離下次招標已經沒剩多少時間了。#n鐘崎港交通便利且人潮眾多，所以競爭還挺激烈的。"
90101070-118 = "最近生意冷清，我本來還在煩惱要不要放棄下次的招標……#n不過多虧這位同學帶了客人上門，下個月我也想再挑戰看看了。"
90101070-119 = "優秀的店家能繼續經營下去，真是太好了呢。"
90101070-120 = ""
90101070-122 = ""
90101070-123 = "……不過比起我們，真正有問題的是卡爾帕喬家族吧。"
90101070-124 = "畢竟前陣子被打得那麼慘……#n下次招標時，恐怕會有不少小看卡爾帕喬家族，覬覦那份委託經營權的組織出現……"
90101070-125 = "……下一次的招標嗎？"
90101070-126 = "哎呀，我說溜嘴了。"
90101070-127 = "抱歉，剛才那段話可以當作沒聽到嗎？"
90101070-128 = "要是被他們發現我散播卡爾帕喬家族失敗的消息，那些組織成員可不會坐視不管……"
90101070-129 = "不，我不是那個意思……"
90101070-130 = "卡爾帕喬家族負責的警備業務，也是透過招標程序來取得資格的嗎？"
90101070-131 = "那當然。鐘崎港內進行的大部分業務，都要經過聯邦學生會的招標程序。"
90101070-132 = "只不過因為害怕卡爾帕喬家族的報復，過去沒有人敢貿然投入招標競爭就是了。"
90101070-133 = "這次的鬥爭證明了那些傢伙只是隻拔了牙的老虎，#n所以應該會開始有人認為值得一試──"
90101070-134 = "哎呀，真是禍從口出，我又來了……"
90101070-135 = ""
90101070-137 = ""
90101070-138 = ""
90101070-139 = "[ns] 「……雪乃。」"
90101070-140 = "是。"
90101070-141 = "假如卡爾帕喬家族相當重視對外形象的話……"
90101070-142 = "那麼對他們而言，或許就有充分的動機透過傳聞來散播恐懼了。"
90101070-143 = ""
90101070-145 = ""
90101070-146 = "多謝款待，老闆！"
90101070-147 = "這麼快？看起來餐點都還沒吃完啊……"
90101070-148 = "因為突然想起有重要的急事。"
90101070-149 = "我們下次會再來的！"
90101070-150 = ""
90101070-152 = ""
90101070-153 = ""
90101070-154 = ""
90101070-155 = "那些學生……"
90101070-156 = "應該不至於是卡爾帕喬家族的關係人吧……？"
90101070-158 = "下一話;卡爾帕喬家族的祕密"
