90101070-1 = "Episode 7;Regular Bidding Notice"
90101070-2 = "Kanesaki Port: Akita Seafood"
90101070-4 = ""
90101070-5 = "Welcome to Akita Seafood!"
90101070-6 = "Huh? You! You're from—"
90101070-7 = ""
90101070-10 = ""
90101070-11 = "Hello, it's nice to see you! What a lovely place."
90101070-12 = "I know it's a bit early, but are you open?"
90101070-13 = "Yeah. We just opened..."
90101070-14 = "Are you here for a pick-up and delivery?"
90101070-15 = "Not today. I'm just here to share a good meal with my friends!"
90101070-16 = "See? Here they are. Table for five, please."
90101070-17 = ""
90101070-19 = ""
90101070-20 = ""
90101070-21 = ""
90101070-22 = ""
90101070-23 = "So this is the place you've been talking about..."
90101070-24 = "It looks like a pretty typical restaurant."
90101070-25 = "The tank has no watermarks or buildup. The stovetop is spotless. Clearly, this establishment values hygiene."
90101070-26 = "We do not need to worry about the fish's freshness."
90101070-27 = "Oh, are these your friends?"
90101070-28 = "I can't say that I specialize in trendy things that \"the youth\" like, but I can whip up whatever you want right away."
90101070-29 = "Ah, except for the tempuras on the last page. I'm still waiting on a delivery."
90101070-30 = "[ns] \"What a shame. I wanted to try the mackerel tempura...\""
90101070-31 = "Ah... And who is this discerning adult?"
90101070-32 = "Taking a group of girls around the port in the morning... It's a bit suspicious."
90101070-33 = "[s1] \"I'm their guardian.\"\n[s2] \"You can think of me as...Niko's boss!\""
90101070-36 = "Ah, you're the one behind \"Fox Food,\" or whatever? Please excuse my rudeness!"
90101070-37 = "Your delivery girl helped me a lot."
90101070-38 = "She noticed that I was in a tough spot and proposed a business deal. She's quite charismatic."
90101070-39 = "[s3] \"You're absolutely right.\"\n[s4] \"All my students are exceptionally talented.\""
90101070-42 = "...Why are you acting like you're so proud of us?"
90101070-43 = "It's like watching a doting parent brag about their child."
90101070-44 = "Look, Niko's ears are turning red."
90101070-45 = "S-Sensei. Let's order!"
90101070-46 = ""
90101070-48 = ""
90101070-49 = ""
90101070-50 = "[ns5] \"In that case...\"\n[ns6] \"We'll have five 'Chef's Choice Sashimi Bowls,' please.\""
90101070-53 = "Five \"Chef's Choice Sashimi Bowls.\" You got it."
90101070-54 = ""
90101070-56 = ""
90101070-61 = ""
90101070-62 = "Why is it called the \"Chef's Choice Sashimi Bowl\"?"
90101070-63 = "Well, that's easy! It's because the ingredients aren't fixed."
90101070-64 = "You see, sashimi bowls are usually made using pieces leftover from a filler cut...or even a random fish that doesn't have a place anywhere else."
90101070-65 = "So the rice bowl always changes depending on the fish that comes in that day. You leave your order all up to the chef's whims."
90101070-66 = "It's usually the cheapest menu item, but some people order it to test their luck or just to be surprised!"
90101070-67 = "Wait, does that mean we might end up with a giant bowl full of mackerel?"
90101070-68 = "You haven't faced the dregs of society yet, Kurumi. You need to stop expecting that sashimi bowls must contain sashimi."
90101070-69 = "We might end up with a rice bowl topped with imitation crab or canned tuna. A real budget special."
90101070-70 = "Can you even call that a sashimi bowl?!"
90101070-71 = "Tuna mayo bowls are pretty good. Their only downside is that they're high in calories."
90101070-72 = ""
90101070-74 = ""
90101070-75 = ""
90101070-76 = "Five \"Chef's Choice Sashimi Bowls,\" ready for ya!"
90101070-77 = "This is..."
90101070-78 = "Um, are you sure this is ours?"
90101070-79 = "This looks like a tuna sashimi bowl..."
90101070-80 = "What are you talking about? Of course it's for you! You're my first orders of the day."
90101070-81 = "I just happened to have lots of leftover tuna because I made a mistake while slicing this morning. Oops!"
90101070-82 = "...This doesn't happen every day, so don't start expecting it."
90101070-83 = ""
90101070-85 = ""
90101070-86 = ""
90101070-87 = "Fufu, it looks like we were lucky today."
90101070-88 = "Thank you for the meal!"
90101070-89 = ""
90101070-91 = ""
90101070-92 = ""
90101070-93 = ""
90101070-94 = "This taste...!"
90101070-95 = "[s] \"What about it, Otogi?\""
90101070-96 = "I don't know how to explain it. But this tuna..."
90101070-97 = "...It's an expensive cut. I can tell!"
90101070-98 = "I don't know much about sashimi either... But this is clearly high-quality tuna."
90101070-99 = "It's buttery and soft, with just the right amount of chewiness..."
90101070-100 = "No way. I never had it before, but is this...\"otoro\"? Actual fatty tuna?"
90101070-101 = "The soy sauce complements it superbly."
90101070-102 = "The subtle scent of yuzu and balanced acidity harmonizes with the ingredients without overpowering the fish."
90101070-103 = "This is exceptional rice, too."
90101070-104 = "I can't believe we're getting something so good at such a low price."
90101070-105 = "Haha, seeing you all enjoy the food warms my heart!"
90101070-106 = "I'm skilled at plenty of other dishes, so try something new next time."
90101070-107 = ""
90101070-109 = ""
90101070-110 = "...Of course, that's assuming I'm still here..."
90101070-111 = ""
90101070-113 = ""
90101070-114 = "Oh, no! Are you going out of business?"
90101070-115 = "No, I didn't mean something like that. It's just..."
90101070-116 = "All the businesses in Kanesaki Port renew their contracts through a regular bidding process."
90101070-117 = "The next bidding date's coming up, and since Kanesaki Port is so accessible and touristy, there's substantial competition."
90101070-118 = "I was debating if I should give up on next month's bidding since business had been slow for so long. But, thanks to you bringing in lots of customers, I think I'll give it a shot."
90101070-119 = "I'm glad to hear that an amazing place like this will stay in business."
90101070-120 = ""
90101070-122 = ""
90101070-123 = "...Well, I guess the Carpaccio Family has it rougher than us."
90101070-124 = "After what happened to them, there's going to be QUITE a few people eyeing the service contract at the next bidding..."
90101070-125 = "...The next bidding?"
90101070-126 = "Oops, ah! I-I shouldn't have..."
90101070-127 = "Sorry, but can you just forget everything I just said?"
90101070-128 = "The Carpaccio Family will \"fix\" my shop if they find out I've been talking about their affairs..."
90101070-129 = "We won't say anything. It's just..."
90101070-130 = "Did the Carpaccio Family also get their security contract through a bidding process?"
90101070-131 = "Of course. Almost everything that happens in Kanesaki Port goes through the General Student Council's bidding procedure."
90101070-132 = "No one's ever bid against the Carpaccio Family. They...come off as a rough bunch, if you know what I mean."
90101070-133 = "But now that everyone knows they're nothing more than a toothless tiger, I'm sure a few people are fixing to bid on their contract."
90101070-134 = "Gosh, I really DO run my mouth..."
90101070-135 = ""
90101070-137 = ""
90101070-138 = ""
90101070-139 = "[ns] \"...Yukino.\""
90101070-140 = "Yes."
90101070-141 = "If the Carpaccio Family has been so concerned about their intimidating reputation..."
90101070-142 = "Then they might be motivated to spread fear, even if it's only through rumors."
90101070-143 = ""
90101070-145 = ""
90101070-146 = "Thank you so much for the food!"
90101070-147 = "Already? You haven't even finished your bowl..."
90101070-148 = "It was absolutely delicious, but something suddenly came up!"
90101070-149 = "We'll be back soon! Thanks!"
