[translation]
2004105-1 = "디자인"
2004105-5 = "네. 주문하신 3D프린터와…… 분말 소재네요. 맞으시죠?"
2004105-6 = "그러면 도장 부탁드리겠습니다!"
2004105-17 = "안녕, 선생."
2004105-18 = "뭔가…… 조금이지만 이런 것도 익숙해졌네. 신선한 기분이야."
2004105-19 = "[s] \"주문한 게 3D 프린터였던 것 같은데…… 맞아?\""
2004105-20 = "맞아. 그리고 환기가 잘 되는 빈 공간이 있으면 좋겠어."
2004105-21 = "3D 프린터는 작업 공정에서 오염 물질이 제법 발생하는 편이니까."
2004105-22 = "……지금 내 아지트에서 작업을 할 수 없었던 것도, 그 때문이기도 했고."
2004105-23 = "[s] \"찾아보면 있을 것 같긴 한데…….\""
2004105-32 = "[ns] \"여긴 어떨까?\""
2004105-33 = "좋아 보이네. 반대편 벽에는 창문도 크게 나 있고."
2004105-34 = "그러면 이 공간, 조금 실례할게."
2004105-42 = "다 됐어. 이제 이걸 가동시키면……."
2004105-47 = "그러면 우리는 나가 있도록 하자. 당분간은 호흡기에 좋지 않을 거야."
2004105-52 = "[ns] \"뭔가 목적이 있어서 만드는 물건인 거야?\""
2004105-53 = "특별히 그런 건 아니야. 그냥 가끔…… 이런 식으로 산업디자인 같은 걸 하곤 해서."
2004105-54 = "미리 해 둬서 나쁠 건 없고, 산업디자인은 기능미 측면에서도 고려해야 할 요소이기도 하고."
2004105-55 = "애초에 무언가를 디자인한다는 걸…… 그렇게 싫어하는 편도 아니라서."
2004105-56 = "[s] \"그럼 그게 리오의 취미인 거네?\""
2004105-57 = "응? 취미?"
2004105-58 = "그런…… 가?"
2004105-59 = "뭔가, 그런 식으로는 생각해 보지 못했어."
2004105-60 = "하지만 취미란 건…… 비합리적인 것이잖아?"
2004105-61 = "취미의 1순위는 즐거움에 있지. 이익이나 효용이 발생하는 학문이나 일, 훈련과는 달라."
2004105-62 = "즉 인풋 대비 아웃풋이, 미묘한 수준을 넘어서…… 0에 수렴한다는 뜻이고."
2004105-63 = "……내가 그런 일을 해도, 괜찮은 걸까……?"
2004105-64 = "[s] \"에이. 안 될 거 뭐 있겠어.\""
2004105-65 = "그런…… 가? 취미를 갖는 것은 나쁜 게 아니라, 오히려 권장할 행동이라고……?"
2004105-66 = "……."
2004105-71 = "하지만, 한 가지 문제가 더 있어."
2004105-72 = "내가 한 디자인들…… 선생도 어쩌면 알고 있겠지만."
2004105-73 = "전체적으로, 누구에게 보여주면 평이 별로 좋지 않아."
2004105-74 = "나는 사실 합리적이면서도 기능미를 추구하는 디자인을 지향하는데, 사람들이 별로 이해해 주지 않는 것 같아……."
2004105-75 = "……내가 잘못된 걸까."
2004105-76 = "아마도…… 아니 분명, 그렇겠지."
2004105-77 = "세계는 확률과 통계로 이루어져 있고, 이 부분에 있어서 통계의 결과는…… 나의 잘못을 가리키니까."
2004105-78 = "[ns] \"……!\""
2004105-80 = "[ns1] \"아니야. 나는 그렇게 생각하지 않아!\"\n[ns2] \"만드는 본인이 진심이면, 누가 뭐라 해도 그건 예술이야!\""
2004105-83 = "……어?"
2004105-87 = "예…… 술?"
2004105-96 = "내가…… 예술??!!"
2004105-97 = "그, 그런 식으로는 생각 못 해 봤어."
2004105-98 = "무엇보다 예술은 주관적인 것이고, 거기에는 객관이 들어갈 자리가 없는 것일 텐데……."
2004105-99 = "아니야, 그렇지만 특정하고 정의할 수 없다는 부분에서……. 그리고 그렇기에, 누구도 틀리다고 말할 수 없다는 점에서……!"
2004105-100 = "……!"
2004105-101 = "그런, 가……."
2004105-102 = "예술, 이구나."
2004105-103 = "나는, 예술을 하고 있었던 거였어. 그리고 나는…… 예술을 할 수 있었던 거였어……."
2004105-104 = "나는…… 틀리지, 않은 거였어……!"
2004105-105 = "고마워, 선생!"
2004105-106 = "[s] \"응? 으, 응…….\""
2004105-107 = "선생은 항상, 내가 놓치고 있었던 부분을 짚어 주는 것 같아."
2004105-108 = "그래……. 그렇구나. 그래서 '선생'인 거겠지."
2004105-109 = "앞서 살아간 자, 그렇기 때문에 누군가를 이끌 수 있는 자, 그 사람에게 부족한 것을 이야기해 줄 수 있는 자. 그래. 그러니까……!"
2004105-110 = "[s] \"리, 리오? 괜찮아?\""
2004105-111 = "모르, 겠어. 나…… 이렇게 기쁘다는 느낌이 든 것은, 처음이야."
2004105-112 = "항상 무언가를 해 내야 한다거나, 견뎌내야 한다거나, 그런 생각만을 반복하고 있었는데."
2004105-113 = "그렇, 구나……."
2004105-114 = "나는 당신의 곁이라면, 이대로 있어도 되는 거였구나……!"
2004105-118 = "(3D 프린팅이 완료되었다는 소리가 들렸다.)"
2004105-120 = "[ns] \"다 된 건가? 뭐가 나왔는지 보고 싶네\""
2004105-121 = "응……!"
2004105-123 = "저, 선생?"
2004105-124 = "미안, 돌아보지 말고, 그대로 들어주었으면 해."
2004105-125 = "……조금 전, 고마워."
2004105-126 = "그렇게 말해 줘서…… 정말로, 기뻤어."
2004105-133 = "(멀어져 가는 리오의 모습을 보면서, 예술이라는 것에 대해 생각해 보았다.)"
