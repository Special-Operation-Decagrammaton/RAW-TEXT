[translation]
52135-2 = "(한 편, 그 시각. <피안의 저택> 앞에서는……)"
52135-11 = "[ns1] \"역시 나타났나…….\"\n[ns2] \"이쪽으로 먼저 올 줄은 몰랐는데……\""
52135-14 = "……츠쿠모가미? 하필이면 백화요란 여러분이 계시지 않을 때……"
52135-15 = "선생님, 제 뒤쪽으로 와주세요. 엄호하겠습니다!"
52135-20 = "하, 하하……"
52135-23 = "아하하, 아하핫……"
52135-24 = "아하하하하하하하하핫!!"
52135-25 = "다들 보았지? 코쿠리코 님은 이미 다~ 예상하고 계셨다고!"
52135-26 = "네 놈들이 흔적을 따라 <피안의 저택>에 도착할 것도, 백물어를 상대할 대책이 백련 이외에는 없다는 사실도 다 알고 계셨거든?"
52135-27 = "그런데도 내 반응 하나만 보고 선생님을 놔둔 채 제각기 뿔뿔이 흩어지다니……"
52135-28 = "기발한 책략? 화조풍월부를 상대로 함정을 놓았다고?"
52135-29 = "바보 같기는. 내 연기에 속아 뱀의 아가리에 머리를 들이민 건 네 녀석들이었다고!"
52135-30 = "[s] \"……슈로.\""
52135-34 = "뭔가요, 선생님. 이제 와서 목숨이라도 구걸하시려는 셈이신가요?"
52135-35 = "안타깝네요. 타임 오-버 랍니다!"
52135-36 = "지금부터는 얌전히 황혼의 먹이가 될 준비나 하고 계시죠. 그곳에도 선생님께서 관리해 주셔야 할 학생들이 아주~ 많을 테니까요."
52135-37 = "[s] \"정말로, 아까 불안해했던 건 연기였어?\""
52135-38 = "큭………!"
52135-39 = "연기라고 했잖아! 감히 지금 내 말을 의심하는 거야?"
52135-40 = "뭐든지 다 아는 척, 이해하는 척…… 그 꼴을 보고 있으면 구역질이 치밀어 올라. 이 자리에서 해치워 백물어의 먹이로 만들어 주겠어!"
52135-44 = "뭐하고 있어? 어서 샬레의 선생을 쏴!"
52135-55 = "어, 어째서……?"
52135-56 = "어, 어째서 괴담에서 태어난 백물어가…… 나를 공격하는 건데?"
52135-57 = "아니야, 뭔가 잘못되었어. 코쿠리코 님이 내 존재를 잊어버리지 않는 한 그런 일은 있을 수가—"
52135-67 = "우으…… 우으으……"
52135-73 = "[ns3] \"이게 어떻게 된 일이지……?\"\n[ns4] \"어째서 백물어가 슈로를 공격하는 거지?\""
52135-76 = "저도 잘은 모르겠지만, 무언가 화조풍월부 부원 간에 문제가 생긴 모양이네요."
52135-77 = "그보다 괜찮을까요? 지금의 슈로 양은 츠쿠모가미를 제어하지 못하는 것처럼 보이는데……"
52135-78 = "괴서에서 비롯된 괴담 외에는 변변찮은 방어 수단도 없는 그녀가, 자칫 츠쿠모가미에게 역으로 둘러싸여 잡아먹히기라도 한다면."
52135-79 = "이번에는 다른 사람도 아닌 슈로 양이 황혼에 떨어지고 말텐데요……"
52135-80 = "물론 제 꾀에 제가 넘어간 셈이니 자업자득이라 할 수도 있겠지만."
52135-81 = "[s] \"……다녀올게.\""
52135-85 = "네? 지금 제 정신이신가요?"
52135-86 = "잠시 백물어가 물러나긴 했지만 이곳도 여전히 안전하진 않다구요."
52135-87 = "게다가 <피안의 저택> 안에서 무슨 일이 벌어지고 있는지 여전히 알 수 없는데……"
52135-88 = "당신을 죽이려고 했던 아이를 구하기 위해 다시 위험을 감내하시겠다고요?"
52135-89 = "그런 무모한—"
52135-91 = "[ns5] \"위험에 빠진 아이를 보면 달려가는 건 사람의 본능이야.\"\n[ns6] \"시시비비는 그 이후에 가려도 상관없으니까.\""
52135-100 = "하, 하하……"
52135-104 = "사실, 이미 그렇게 말씀하실 줄 알고 있었어요."
52135-109 = "헉, 헉, 허억……"
52135-112 = "(말도 안 돼, 말도 안 돼, 말도 안 돼, 말도 안 돼……)"
52135-113 = "(정말로…… 정말로 난 버려진 거야?)"
52135-114 = "(내가 두 차례나 실수를 하는 바람에 코쿠리코 님이 더 이상 나를 신뢰할 수 없게 되어 버린 거야?)"
52135-115 = "(그래서 코쿠리코 님의 괴담이 나를 적대하고 있는 거야……?)"
52135-116 = "(싫어, 싫어, 그건 싫어. 코쿠리코 님 없이 나는 존재할 수 없어. 왜냐하면 나는……)"
52135-129 = "안 돼…… 멈춰……"
52135-130 = "이대로…… 버려진 도구로 되돌아가고 싶지 않아……"
52135-137 = "……멈춰!"
52135-146 = "………어?"
52135-147 = "[s] \"……늦지 않아서 다행이다.\""
52135-148 = "……샬레의 선생님?"
52135-149 = "어째서 나를 대신해서 백물어의 공격을……"
52135-150 = "[s] \"어쩐지 위험한 상황에 처한 것 같아서 도우러 왔어.\""
52135-151 = "하지만……"
52135-152 = "나는…… 당신을 죽이려 했잖아? 어째서 도울 필요가 있는데……"
52135-153 = "게다가 나는 당신을 따르는 학생도 아닌데. 도대체…… 무얼 착각하고 있는 거야?"
52135-154 = "몸을 바쳐서 나를 구해주면 개과천선해서 당신을 돕기라도 할 줄 알았어?!"
52135-155 = "[s7] \"위험에 빠진 아이를 구하는 데 이유는 필요하지 않아.\"\n[s8] \"그것은 당연한 사람의 [ruby=측은지심]본능[/ruby]이니까.\""
52135-160 = "이 무슨 멍청한……"
52135-161 = "당신이 우리들과 달리 총알 한 발, 폭탄 하나에도 목숨이 위태로운 존재라는 건 나도 알고 있어!"
52135-162 = "그런데…… 자신을 적대하고, 소중한 학생들을 나락으로 떨어트리려던 원수가 위험에 처했다고 사선에 몸을 던진다고?"
52135-163 = "멍청한 것도 정도가 있지!"
52135-164 = "[s] \"걱정 마, 슈로 쨩. 선생님은 생각보다 튼튼하거든.\""
52135-168 = "누가 슈로 쨩—"
52135-169 = "[s] \"근데 생각보다 아프긴 하네……\""
52135-173 = "………………하아?"
52135-181 = "……스승님!"
52135-186 = "아, 백화요란 여러분. 무사하셨군요!"
52135-187 = "안 그래도 갑자기 저택 곳곳에 츠쿠모가미가 나타나서……"
52135-188 = "그건 우리도 이미 알고 있어!"
52135-189 = "그보다 선생님…… [USERNAME] 선생님은 무사해?"
52135-190 = "저, 그게……"
52135-191 = "츠쿠모가미가 습격해 왔을 때 갑자기 슈로 양이 도망치는 바람에, 선생님께서는 슈로 양을 구하기 위해 뒤쫓아 가셨어요."
52135-195 = "제가 막으려 했지만 선생님의 뜻이 너무 완고하셔서……"
52135-197 = "아니, 그렇다고 이 위험한 상황에 스승님이 혼자 가시는 걸 그저 지켜 보고만 있었던 거야?"
52135-198 = "무력을 써서라도 붙잡았어야지—"
52135-204 = "뭐, 뭐하는 거야. 키쿄?"
52135-205 = "물론 나도 방금 따져 묻긴 했지만, 그렇다고 총을 겨눌 것까지는……"
52135-206 = "아야메 부장에게만 신경을 쓰느라 더 중요한 사실을 놓치고 있었네."
52135-207 = "이곳으로 오는 내내 괴서를 다루는 화조풍월부의 부원이 근처에 있을 거라는 예측은 했지만……"
52135-211 = "설마 이미 무리 속에 들어와 있었을 줄이야."
52135-217 = "아, 아하하……"
52135-221 = "……어떻게 아셨나요?"
52135-223 = "다음화;화조풍월부의 괴예가"
