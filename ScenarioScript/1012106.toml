[translation]
1012106-1 = "여름의 바다, 밤의 유카리"
1012106-2 = "(잠깐 편의점에 들렀다가 오는 길에 익숙한 뒷모습을 발견했다.)"
1012106-6 = "앗, 선생님?"
1012106-7 = "여기는 어인 일로…… 아, 장을 보고 지나가시던 중이셨군요."
1012106-8 = "아니요. 전혀 방해가 아니어요. 소녀는 오히려 기쁘답니다."
1012106-9 = "소녀는, 소녀는 그저 바다를 보고 있었사와요."
1012106-10 = "낮에는 그렇게 소란스럽고, 즐거웠던 풍경이 거짓말처럼 적막해져서……."
1012106-11 = "이 모습을 쓸쓸하다 여기는 것은, 소녀가 변했다는 뜻이겠죠."
1012106-15 = "선생님과 만나기 전까지는, <이런 바다>가 오히려 소녀에게 정상이었으니까요."
1012106-16 = "……."
1012106-20 = "흐흥~ 흥~♪"
1012106-21 = "바다의 유카리는 무적 전함~♪ 바닷속을 종횡무진이어요~♪"
1012106-22 = "[ns1] (이 타이밍에 노래를……?!)\n[ns2] (그러면 그냥 침몰이지만…… 말하지 말자.)"
1012106-25 = "비록 물에 떠 있더라도 젖지 않는 연꽃처럼 우아하게 있어라…… 옷과 머리카락을 적셔 망신당하면 가문의 기품이 훼손된다……."
1012106-26 = "어릴 적부터 소녀가 항상 들어온 말씀들이어요."
1012106-27 = "그런데 오늘은, 후후! 옷을 적시기는커녕, 아예 바닷물에 퐁당 뛰어들었사와요!"
1012106-28 = "집안 분들이 보셨다면 깜짝 놀라서 그 자리에서 쓰러지시겠죠."
1012106-29 = "[ns3] \"오늘 즐거웠어?\"\n[ns4] \"유카리는 후회해?\""
1012106-30 = "네! 무척이나 즐거웠답니다!"
1012106-31 = "선생님은 항상 소녀의 세계를, 한없이 아름다운 세계로 바꿔주셔요."
1012106-32 = "저 유카리, 어떤 선택에도 후회는 없사와요! ……라고 하면 거짓말이겠지만……."
1012106-33 = "소녀는 아주 즐거웠사와요. 그리고 선생님께서는 그게 가장 중요하다 말씀하시겠죠? 후후."
1012106-34 = "그리고…… 이건 집안 분들도 모르는 소녀의 비밀이지만, 선생님께만 몰래 가르쳐 드릴게요."
1012106-39 = "바다에 옷조차 적신 적 없다는 말은 거짓말이어요."
1012106-40 = "바다에 올 때마다, 맑고 투명한 바닷물을 내려다보면서, 남몰래 슬쩍 발을 담가보곤 했사와요."
1012106-41 = "항상 그런 식으로, 소녀 나름 여름 바다를 즐겨왔답니다."
1012106-43 = "(한참 동안 유카리와 함께 밤바다를 지켜봤다.)"
1012106-48 = "아아앗!"
1012106-49 = "[ns] \"무슨 일이야, 유카리?!\""
1012106-50 = "무심코 기분이 좋아서, 선생님을 오래 붙잡아 두고 말았사와요!"
1012106-51 = "분명 다른 용건이 있어서 나오신 거지요?!"
1012106-52 = "(……편의점 봉투 사이로 녹은 아이스크림이 뚝뚝 떨어지고 있다.)"
1012106-53 = "선생님, 어서 들어가셔요! 유카리는 신경 쓰지 마시고요!"
1012106-54 = "[s5] \"아니, 이미 늦었어…….\"\n[s6] \"모리모리군의 HP는 이미 제로야.\""
1012106-57 = "아앗…… 소녀와 만나 이런 일이……."
1012106-58 = "[s7] \"이렇게 된 이상, 어쩔 수 없나…….\"\n[s8] \"지금부터 밤바다 탐험하러 갈 건데, 어때?\""
1012106-61 = "……!"
1012106-66 = "네! 소녀, 어디까지나 함께하겠사와요!"
1012106-68 = "(그 후 유카리와 함께 바다의 야시장을 돌아다니며 군것질을 즐겼다.)"
