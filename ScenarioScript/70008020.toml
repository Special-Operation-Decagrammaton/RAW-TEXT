[translation]
70008020-1 = "살벌! 망량즈 나이트! 2"
70008020-4 = "아."
70008020-5 = "엑."
70008020-6 = "하필 나오자마자 제일 위험한 녀석한테 걸리다니!!"
70008020-7 = "……."
70008020-8 = "……하아."
70008020-9 = "뭐야, 그 반응은!!"
70008020-10 = "그래서 이번에는 어떤 사고를 쳤어?"
70008020-11 = "아직 아무것도 안 했거든!!"
70008020-12 = "아직……?"
70008020-13 = "아차! 이 녀석이랑 얘기하고 있으면 뭔가, 자꾸 말리는 느낌이라 싫단 말이지……."
70008020-14 = "잠깐, 조사하겠어."
70008020-15 = "앗, 나는 그러고 있을 시간이……!"
70008020-19 = "어라, 아라타 아니니~?"
70008020-21 = "진짜네. 아라타하고 친구들이 왔구나."
70008020-22 = "오늘은 도와줄 일이 없는데, 이걸 어쩐담."
70008020-27 = "……아는 분들이셔?"
70008020-28 = "그냥 용돈벌이나 할 겸, 심부름 좀 했을 뿐이야."
70008020-29 = "축제에서 놀려면 돈이 많이 필요하니까……."
70008020-31 = "들어가서 간식 먹고 갈래? 양갱이 있는데."
70008020-32 = "오, 진짜요?! 리더, 어때요?"
70008020-34 = "바보야! 여기 나온 목적을 까먹으면 어떻게 해!"
70008020-36 = "아~ 맞다~ 죄송해요~ 오늘은 리더랑 약속이 있어서~"
70008020-37 = "괜찮아~ 나중에 집에 갈 때 출출하면 들러~"
70008020-42 = "말썽은 좀 피우고, 솔직하진 않아도 괜찮은 애예요."
70008020-43 = "아, 네."
70008020-44 = "같은 백귀야행 학생들이니까 친하게 지내요."
70008020-46 = "으아아악!!! 다 가버려!!!"
70008020-48 = "아이구~ 어른한테 소리치는 거 아니다, 욘석아~"
70008020-49 = "하하, 완전히 뿔났네~ 갑시다~"
70008020-53 = "……흠."
70008020-58 = "친하게 지낼까?"
70008020-59 = "미쳤냐!!!"
70008020-60 = "백화요란이랑 친하게 지낼 리가 없잖아!!"
70008020-65 = "리더~ 천천히 가요~!"
70008020-72 = "하아~ 하아~ 따돌렸나……."
70008020-73 = "아니…… 생각해 보니 쫓길 이유가 없잖아……."
70008020-78 = "허억, 허억…… 리더, 달리는 속도, 빨라지지 않았어?"
70008020-79 = "이건, 그거지…… 요즘 도망치는 일이 많으니까……."
70008020-80 = "시, 시끄러워! 내가 빨라지면 대단하고 좋은 거지! 거기에 무슨 이유를 달아!"
70008020-81 = "근데, 생각해 보면 아까 얘기 좋은 거 아니에요?"
70008020-82 = "무슨 얘기?"
70008020-83 = "백화요란이랑 친하게 지내라는 말이요. 백화요란이랑 친해지면 이렇게 도망 다닐 일도 없어지잖아요."
70008020-84 = "오, 그러네. 게다가 백화요란이면 엘리트들 아니야? 축제 때 쿠폰 같은 거 받을 수 있지 않을까?"
70008020-85 = "그게 무슨 바보 같은 소리야!!!"
70008020-87 = "왜 그렇게 화내요…."
70008020-88 = "망량즈하고 백화요란은 절대, 절대로!! 친해질 수 없어!! 예전부터 그렇게 정해져 있었어!!"
70008020-90 = "예전부터? 언제부터요? 누가요?"
70008020-91 = "그건…… 당연히 처음부터지!! 말해서 뭐 해!! 그리고, 누가 정했냐면……."
70008020-92 = "……."
70008020-93 = "아무튼!! 그런 닭살 돋는 소리는 다신 하지 마!!"
70008020-95 = "아무래도 리더도 잘 모르는 거 같지?"
70008020-96 = "눈치껏 물어보지 말자."
70008020-98 = "그 뾰족한 백화요란 녀석 때문에 시장에서 천천히 가면을 둘러보려는 계획이……."
70008020-99 = "하지만 시장으로 가봐야 결국 비슷비슷한 평범한 가면밖에 못 찾겠지. 뭔가 특별한 게 필요해…… 한 번에 이목을 끌 만큼 특별한 가면이……."
70008020-100 = "앙~? 그러니까, 결국 여기는 관광지도 뭣도 아니란 거잖아."
70008020-101 = "나 참, 모처럼 여행 왔더니 길이나 잃고 있고. 재수가 없으려니까……."
70008020-105 = "……저거야."
70008020-106 = "바로 저거야!!"
70008020-112 = "응?"
70008020-113 = "어, 어어?! 뭐야, 뭐야?!"
