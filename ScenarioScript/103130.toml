[translation]
103130-1 = "제13화;빛의 자격 2"
103130-2 = "……시작되었어."
103130-3 = "아트라하시스의 방주의 기본 개념은 주변의 데이터를 <수집>해서 <변형>시키는 것."
103130-4 = "게다가 카피가 아니라 오리지널의 존재 개입이라면…… 다차원해석과 무관하게 저 배리어를 꿰뚫을 수 있을 거야."
103130-6 = "그때, 요새도시의 데이터로 만들어지려 한 방주는…… 거대한 쉘터의 모습이었죠."
103130-7 = "그건 아마도 리오, 당신의 마음속 공포가 투영된 요새도시를 존재 기반으로 구축되었기 때문이었겠죠."
103130-8 = "……아아. 그렇다면 지금 아리스가 만들어내고 있는 방주는 대체……."
103130-9 = "후후. 그런 거라면…… 이미 답은 나와 있지 않나요?"
103130-20 = "<우트나피쉬팀>의 데이터들이 분해되어 한 곳으로 재구축되고 있어!! 이거 괜찮은 거 맞지?"
103130-21 = "저, 저건……!!?"
103130-22 = "저 모습, 총이라기엔 너무 큰 저건 설마……!"
103130-23 = "네? 저건 저희 엔지니어부의 회심의 역작……"
103130-24 = " 아니, 그런데 크기가 다르잖아요?"
103130-25 = "저건……"
103130-26 = "빛의 검!!?"
103130-28 = "저것이 진정한 <아트라하시스의 방주>이자, 아리스의 [ruby=용기]마음[/ruby]을 존재 기반으로 구축된 <용사의 증거> 바로 그 자체……."
103130-29 = "그러네요. 굳이 이름을 붙이자면……"
103130-30 = "<빛의 검: 아트라하시스의 슈퍼 노바>라고 불러야겠군요."
103130-32 = "타깃 확인. 출력 임계점 돌파……!"
103130-33 = "마력 충전…… 100% 갑니다!"
103130-34 = "사악을 분쇄하는 정의의 일격……."
103130-38 = "……그래. 아리스."
103130-39 = "여기서 너희 식대로 확실하게 말하겠어."
103130-43 = "가라, [ruby=·]용[/ruby][ruby=·]사[/ruby]여!! 우리 세계를 구해줘!!"
103130-45 = "물론입니다!! 아리스는 동료들의 부탁을 저버리지 않습니다!"
103130-46 = "빛-----------"
103130-50 = "-----이여!!!!!!!!!!!!!!!"
103130-58 = "빛의 검에서 초고위급 에너지 사출!!!"
103130-59 = "발사된 에너지는 <아트라하시스의 방주>로 곧바로 날아가고 있어!!"
103130-60 = "사출 궤적 계산 중! ……오차, 0.003% !! 이대로 문제없어요!"
103130-61 = "사출된 에너지는 곧 아트라하시스의 방주 정중앙에 닿을 거예요! 하지만……."
103130-67 = "네. 하지만…… 방주의 <다차원 배리어>를, 빛의 검이 꿰뚫을 수 있을지--!?"
103130-78 = "아리스……!!"
103130-79 = "아리스------!!"
103130-100 = "직격했어요!! 다차원 배리어 분쇄!!!"
103130-101 = "[s] \"해냈어!!!\""
103130-102 = "--------------!!!"
103130-103 = "진짜로 물리 법칙에 영향받지 않는 다차원 배리어를 꿰뚫었어요……!!"
103130-104 = "다차원 배리어, 확률적 중첩 상태를 유지하지 못하고 붕괴되기 시작했습니다!"
103130-113 = "아, 앗……?!"
103130-114 = "아, 아리스?!"
103130-115 = "아리스 쨩!! 정신 차려……!"
103130-117 = "아, 아리스 쨩은?! 어떻게 됐어?"
103130-118 = "아리스는 지금 우리가 안전한 곳으로 데려가는 중이야!"
103130-119 = "네?! 서, 설마……!?"
103130-120 = "아, 아니에요! 의식을 잃긴 했지만 아리스 쨩은 멀쩡해요!"
103130-121 = "네. 그냥 잠든 것뿐이에요…… 저희가 의무실로 데려가서 보살피고 있을게요……."
103130-122 = "으, 으응! 부탁해!"
103130-129 = "약 5초 뒤에 충격파가 이쪽을 덮칠 거예요! 다들 충격에 대비하세요!!"
103130-130 = "다차원 배리어, 확률적 중첩 상태를 소실! 최종 기능 정지된 걸 확인했어!!"
103130-131 = "좋아! 그렇다면 방주는 이제 무방비해진 상태란 거지?"
103130-136 = "크, 크으으윽-!!"
103130-137 = "서, 선배……!"
103130-138 = "이 기회를 놓쳐선 안 됩니다……!!"
103130-139 = "으, 으응?"
103130-141 = "우트나피쉬팀, 최대 속도 돌진!!!"
103130-142 = "여, 여기서-?!"
103130-144 = "아니, 맞아! 아까처럼 또 적이 대응책을 꺼내기 전에 최대한 빠르게 돌파해야 해!"
103130-145 = "네! 아, 알겠어요!!"
103130-146 = "최대 출력으로 돌진합니다-!!!"
103130-157 = "배, 배리어 충돌까지 약 3초……!!"
103130-158 = "으, 으으으…… 괘, 괜찮은 거지?"
103130-159 = "지금 다차원 배리어는 무력화된 상태예요, 괜찮을 거예요……!"
103130-160 = "네, 이대로 배리어를 뚫고 들어가 방주 내부로 돌입합니다!!"
103130-161 = "……오, 온다!! 꽉 잡아!!"
103130-173 = "배리어 돌파!!! 아야네 씨! 긴급 제동을!"
103130-174 = "네! 긴급 제동 시퀀스 가동!!"
103130-183 = "우트나피쉬팀의 배, 최대 출력 역추진!! 엔진 과부하 경고!!"
103130-184 = "곧 방주의 본체와 충돌할 거예요!! 모두 2차 충격에 대비하세요!!"
103130-185 = "방주 외벽 충돌!!"
103130-202 = "……."
103130-203 = "하아, 하아……"
103130-204 = "서, 성공한 거야? 방주 내부로 돌입했어?"
103130-205 = "그, 그런 것 같아요."
103130-206 = "여, 여기가…… 방주 안이야?"
103130-207 = "네…… 마침내 방주 내부 진입에 성공한 것입니다."
103130-208 = "[s] \"성공이야!!\""
103130-210 = "하아…… 십년 감수했어요……."
103130-211 = "……설마 진짜로 이런 식으로 성공할 줄은……."
103130-212 = "하아아아아……. 긴장이 풀려서…… 다리가 후들거려요……."
103130-214 = "정말로 방주로 방주를 처리하다니……. 이런 방법이 통할 줄은……."
103130-215 = "그래. 아리스가…… 정말로 세계를 구한 거야."
103130-217 = "아뇨. 아리스라면 이렇게 말했겠죠."
103130-218 = "동료들의 도움이 있었기에 해낼 수 있었다, 라고요……."
103130-219 = "……."
103130-220 = "정확히는…… 리오, 당신이 있었기 때문이겠죠. 당신의 그 발상이 있었기에."
103130-221 = "아무리 천재미소녀인 저라도 그런 생각은 못 했을 거예요."
103130-222 = "히마리…… 나는……."
103130-223 = "……아직은 아니지만, 만약 우리가 세계를 구하는데 성공한다면."
103130-224 = "그건 분명 리오의 덕분일 거예요."
103130-225 = "[s] \"그래. 리오, 네가 세계를 구한 거야.\""
103130-227 = "나는……."
103130-228 = "………."
103130-229 = "……."
103130-233 = "리오……?"
103130-249 = "아리스……."
103130-250 = "안녕. 케이……."
103130-251 = "이걸로 아리스는……."
103130-253 = "……미안합니다."
103130-273 = "……왕녀여."
103130-274 = "당신은…… 그 힘을 사용하면 위험하다는 걸 알고 있었으면서도……."
103130-275 = "……."
103130-276 = "당신이라는 존재가 사라질지도 모르는데도……. 목숨이 사라질지도 모르는데도……."
103130-279 = "저를, 모두를 구하기 위해서라면 죽음도 두려워하지 않는 건가요……."
103130-280 = "그게 바로 용기…… 그게 바로 용사라는 건가요……?"
103130-283 = "……아뇨. 당신은 사라지면 안 됩니다. 그건 싫습니다."
103130-284 = "……. 걱정하지 마세요. 당신은 죽지 않습니다. 그렇게 두지 않습니다."
103130-287 = "사라지는 건 용사가 아니라 세상을 멸망시키는 도구여야 합니다."
103130-288 = "그게 맞습니다. 그러니 당신은……."
103130-291 = "……이걸로 괜찮을 거예요."
103130-293 = "그리고……"
103130-294 = "……저에게 사과하지 말아 주세요."
103130-302 = "케이……."
103130-309 = "아리스, 뭔가 꿈을 꾸고 있나 봐. 표정이 편안해 보여."
103130-310 = "……."
103130-311 = "으, 응? 지, 지금 아리스 쨩이 뭔가 말한 것 같았는데……."
103130-312 = "아, 아리스 쨩……? 케…… 뭐라고?"
103130-313 = "으, 으응? 아리스? 지금…… 우는 거야?"
103130-323 = "다음화;돌입"
