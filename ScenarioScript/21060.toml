[translation]
21060-1 = "제6화;언어를 배우는 방법"
21060-2 = "밀레니엄 게임개발부"
21060-3 = "어쨌든, 다시 소개할게."
21060-4 = "게임개발부 부장 유즈야."
21060-5 = "우리 부에 와줘서 고마워. 아리스 쨩."
21060-6 = "앞으로 잘 부탁해."
21060-7 = "잘…… 부탁……?"
21060-8 = "이해."
21060-9 = "유즈가 동료로 참가했습니다. 뽜밤뽜밤!"
21060-10 = "입니까?"
21060-11 = "어, 음. 비, 비슷한 거 같아."
21060-12 = "정말 우리 게임을 재미있게 한 모양이네. 하긴 새로운 동료를 획득해 나가는 과정이, RPG의 즐거움 중 하나지."
21060-13 = "아, RPG의 재미를 더 느끼고 싶다면……"
21060-14 = "내가 게임을 추천해줄게."
21060-15 = "잠깐! 추천은 내가 먼저야!"
21060-16 = "그 이상한 말투도 게임을 하며 더 자연스러워지면, 우리 계획의 성공률도 올라가지."
21060-17 = "자, 우선 <영웅신화>랑 <파이널 판타지아>랑 <아이즈 이터널>이랑……"
21060-18 = "무슨 소리야! 아리스 쨩은 게임 초심자라고! 당연히 <젤나의 전설: 꿈꾸는 섬>이 먼저지!"
21060-19 = "이건 양보 못 해. 당연히 다음 게임은 <로맨싱 서기>야. 3편은 안 해도 된다고 생각하지만……."
21060-22 = "……??"
21060-23 = "……"
21060-25 = "기대, 다시 게임을 시작합니다."
21060-27 = "(2시간 뒤)"
21060-28 = "…… (삑-삑-삑-삑-삑-삑……)"
21060-29 = "우와. 아리스. 읽는 속도 엄청 빠르네. 대화가 출력됨과 동시에 이해하는 거 같아."
21060-30 = "아리스 쨩. 다음은 <전설의 오크 베틀> 해보자! 턴제의 재미를 느끼게 해줄게!"
21060-31 = "…… (끄덕)"
21060-32 = "…… (삑-삑-삑-삑-삑-삑……)"
21060-34 = "(Zzz……)"
21060-35 = "(Zzz……) 음냐."
21060-36 = "…… (삑-삑-삑-삑-삑-삑……)"
21060-38 = "…… (삑-삑-삑-삑-삑-삑……)"
21060-39 = "……클리어."
21060-41 = "…… (삑-삑-삑-삑-삑-삑……)"
21060-42 = "……클리어."
21060-44 = "짹-짹-"
21060-45 = "으음……."
21060-46 = "앗. 벌써 아침? 이런! 등교 준비 해야 하는데……!"
21060-47 = "(스윽) ……."
21060-48 = "드디어 눈을 떴군……."
21060-49 = "자네 운이 좋군. 정신이 드나?"
21060-50 = "어?!"
21060-51 = "아리스 쨩! 이제 멀쩡하게 말하는 법을 익힌 거야?"
21060-52 = "필멸자여. 그러하다."
21060-53 = "여, 여전히 뭔가 이상하게 익힌 것 같은데?!"
21060-54 = "우웅. 다들…… 좋은 아침……."
21060-56 = "(철컥)"
21060-57 = "굿모닝!"
21060-58 = "자아. 아리스. 이거 받아."
21060-62 = "……?"
21060-63 = "아리스는 '정체를 알 수 없는 종이'를 획득했다."
21060-65 = "오~ 말투가 많이 세련되어졌네~ 이건 '학생증'이야."
21060-66 = "세련…… 된 걸까. 레트로 게임 회화 그 자체잖아……!"
21060-67 = "학생증……?"
21060-68 = "이 학생증이 있어야 우리 학교 학생이라는 증거가 되거든. 학원 명부에도 베리타스가 해킹…… 등록해 줬으니, 이제 너도 우리 동료인 거야!"
21060-69 = "동료? 이해합니다."
21060-71 = "뽜밤뽜밤. 아리스가 '동료'로 합류했다."
21060-73 = "괘, 괜찮은 거야?"
21060-74 = "물론이지! 교복! 학생증! 말투! 다 해결되었으니……"
21060-75 = "다음은……"
21060-76 = "무기려나……"
21060-77 = "좋아. 아리스. 이번 기회에 소개해줄게."
21060-78 = "소개?"
21060-81 = "우리 학교, 밀레니엄을!"
21060-83 = "다음화;그것은 총이라기엔 너무 컸다."
