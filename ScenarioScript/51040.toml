[translation]
51040-1 = "제4화;음양부에서"
51040-2 = "음양부 부실"
51040-4 = "먼 길 오시느라 고생하셨어요~ 선생님."
51040-5 = "이렇게 다시 뵙게 되니 무척이나 반갑네요. 냐하핫."
51040-6 = "백귀야행에 찾아오신 걸 환영합니다."
51040-7 = "안녕~ 선생님~~"
51040-8 = "[s] \"다들 오랜만이야.\""
51040-9 = "그러게요. <그날>…… 이후로 제법 많은 시간이 흘렀지요?"
51040-10 = "응~"
51040-15 = "오래 못 보면……."
51040-16 = "흐릿해져 버리는"
51040-17 = "선생님 얼굴."
51040-18 = "방금까지 잊어버리고 있었어~"
51040-22 = "치, 치세 쨩의 하이쿠……!"
51040-23 = "기록을, 해둬야……!"
51040-24 = "[s] \"아, 으응, 치세가 그렇게 말하니 농담으로 안 들리는걸.\""
51040-26 = "……?"
51040-27 = "[s] \"치, 치세?!\""
51040-28 = "냐하핫. 치세의 말은 그렇다 치더라도………"
51040-29 = "그때 이후로 정말 저희 백귀야행도 꽤나 정신없는 시간을 보냈답니다~"
51040-30 = "그치~? 카호."
51040-32 = "예. 파괴된 인프라의 보수나 재작업, 부서진 학생 기숙사를 재건하기 위한 긴급예산편성 등등…… 전체적으로 복구 활동은 지금도 현재진행형인 상황입니다."
51040-33 = "[s] \"다들 고생이구나…….\""
51040-34 = "냐하, 카호도 차암~ 모처럼 선생님이 찾아와 주셨는데~ 그런 딱딱한 이야기만 하고 말이야~"
51040-35 = "근래의 백귀야행은 복구 활동이니 뭐니 하는 뒤숭숭한 이야기만 있는 건 아닌 걸~"
51040-36 = "예로 들자면…… 이번에 열리는 축제─라거나~?"
51040-37 = "[s1] \"아, 그렇지 않아도 오는 길에 준비하고 있는 걸 봤어.\"\n[s2] \"분명 시즈코가 준비한 축제라고…….\""
51040-40 = "아하~"
51040-41 = "이미 알고 계신다면 이야기가 빠르겠네요. 맞아요~ 시즈코 양이 무척이나 열심히 힘을 내주고 있지요~"
51040-45 = "시즈코 양은 매번 멋지고 즐거운 축제를 위해서라면, 정말 많은 돌발행동을 저지르고 있다 보니. 보고 있으면 참으로 질리지가 않는……"
51040-46 = "……게 아니라 무척 대견하다고 생각한답니다?"
51040-47 = "[s] \"아, 으응. 그, 그래…….\""
51040-48 = "냐핫. 아무래도 시즈코 양은 이전부터 줄곧 20년 전에 폐지되었던 <백귀야행 등불 축제>를 부활시키고 싶었다는 모양이에요."
51040-49 = "뭐, 이렇게 된 거 차라리 잘된 걸지도 모르겠네요~"
51040-50 = "니야 님, 그런 말씀은 좀……."
51040-51 = "카호도 참. 그래도 객관적으로 타이밍이 좋은 건 사실이잖아~?"
51040-55 = "[ns] \"저기, 무슨 의미야……?\""
51040-56 = "그게 왜, 시즈코 양이 되살리고 싶어 했던 등불 축제는 공교롭게도 딱 지금 상황에 필요한 축제지 않나~ 싶어서 말이지요."
51040-57 = "한창 복구 활동으로 정신없는 사이. 백귀야행이 앞으로 화려하게 꽃피기 위한 첫 시작으로 제격이라고 할까요?"
51040-59 = "……니야 님의 말씀은 다소 지나친 부분은 있습니다만."
51040-60 = "실제로 백귀야행의 최근 분위기가 침체된 것은 사실이기에. 커다란 계기가 필요하다. 라는 건 모두가 동의하고 있는 바이긴 합니다."
51040-62 = "침체된 분위기가 이번 축제를 통해 좀 더 달아오르면 좋겠네~ 라거나. 모두 웃는 얼굴을 되찾았으면 좋겠네~ 라거나~"
51040-63 = "마침 좋은 목표가 되어주었다는 거죠~"
51040-64 = "치세도 새로 시작할 공연 준비를 위해 밤새워서 열심히 연습하고 있지~? 정말 장해라~"
51040-66 = "응~ 나도~ 힘낼게~"
51040-67 = "치, 치세 쨩……!"
51040-69 = "냐하하핫! 모두 기특하다니까~"
51040-70 = "네, 덕분에 최근엔 업무량도 폭증하고 있으므로 니야 님께서도 빈틈없이 지금보다 더욱 열심히 업무에 힘을 써주시기 바랍니다. 아시겠지요?"
51040-71 = "에엥~ 방금까지 훈훈한 분위기였잖아~?"
51040-72 = "갑자기 그런 가혹한 말이라니, 카호, 너무해~ 훌쩍훌쩍……."
51040-78 = "니야 님, 이번만큼은 도망치시면 정말로 곤란하니까요……?"
51040-83 = "냐하하……. 으, 으응~ 그런가아~?"
51040-84 = "뭐, 어쨌거나 모처럼 찾아와 주신 만큼 선생님께서도 마음껏 축제를 즐겨주셨으면 해서요~ 냐하항."
51040-85 = "아, 겸사겸사 시즈코 양을 만나서 이것저것 격려도 해주면 더 좋겠구요~"
51040-86 = "[s] \"……응?\""
51040-87 = "냐핫? 왜 그러신가요?"
51040-88 = "아, 맞다~ 미리 말씀드린 것도 있고 하니 어떠신가요? 치세냥. 쓰다듬고 가실래요?"
51040-89 = "냐앙~?"
51040-90 = "[s] \"아니, 그것뿐이라면 상관없긴 한데.\""
51040-91 = "어머나, 사랑스러운 학생에게 그런 의심의 눈초리라니……."
51040-92 = "그렇게 말씀하신다면, 저 니야. 무척이나 슬프답니당. 훌쩍훌쩍."
51040-93 = "제가 평소에 선생님께 신뢰를 드리기 위해 얼마나 노력하고 있는데, 저란 학생은 선생님께 그런 이미지인가요? 훌쩍."
51040-94 = "[s] \"아, 미안, 역시 좀 지나친 말이었…….\""
51040-95 = "물론…… 사알짝, 마음에 걸리는 일이라면 있긴 하지만요."
51040-96 = "[s] \"아니, 역시 뭔가 있네!\""
51040-105 = "니야 님, 그건……."
51040-110 = "응응~ 카호는 어차피 장난일 거라고 했지만."
51040-111 = "모처럼이니 축제를 위해 찾아와 주신 선생님에게 보고 정도는 해둘까~ 싶어서 말이야."
51040-112 = "[s] \"……이건, 편지?\""
51040-113 = "네, 바로 얼마 전에 저희 음양부에 도착한 편지랍니다."
51040-118 = "보낸 이의 이름은 다름 아닌 <화조풍월부>."
51040-119 = "놀랍게도 입에서 입으로 전해져 내려오는 괴담 속의 동아리가 보내온…… 시대를 뛰어넘은 물건~이라고 해둘까요?"
51040-120 = "[s] \"화조, 풍월부……? 거기다 괴담, 이라고?\""
51040-122 = "화조풍월부가 무엇인가 하면, 백귀야행에서도 아는 사람만이 아는 뜬소문."
51040-123 = "가담항설, 유언비어, 가담항어, 도청도설 그리고 거기에 더해 조금 더 정취가 있는 말로 표현하자면……."
51040-129 = "예로부터 항간에 전해져 내려오는 <[ruby=괴담]백물어[/ruby](百物語)>"
51040-130 = "그들은 <백귀야행의 연합을 인정하지 않는 패악의 동아리>, <괴서를 다루며 사람을 홀리는 이매망량>이더라…… 하는 이야기가 있다든가, 아니라든가~"
51040-131 = "그런데 무려 그런 곳에서 저희 음양부에게 <협박장>이 도착했다는 말씀!"
51040-132 = "[s] \"어째 소개부터가 무시무시한데…… 그럼 편지의 내용은……?\""
51040-133 = "그 내용은 아래와 같사오니."
51040-135 = "<그대들이여, 전언을 들어라.>"
51040-136 = "<우리의 풍류는 아직 끝나지 않았다. 그윽한 정취는 다 함께 맛보는 데에 의미가 있는 것.>"
51040-137 = "<즐거움이 시작되는 시기, 모두가 눈을 빛내며 하늘에 피어난 꽃을 바라보는 그때.>"
51040-141 = "[log=니야]<다시금 우리 화조풍월부가 너희를 찾아가겠다.>[/log]"
51040-145 = "네, 편지의 내용은 이상입니다."
51040-146 = "니야 님, 편지 내용은……."
51040-147 = "응. 맞아. 카호. 전형적인 경고성 메시지."
51040-148 = "사실 딱히 신기할 건 없어요. 그 왜, 커다란 이벤트가 있으면 종종 이런 일이 있곤 하거든요~"
51040-149 = "그치~? 카호."
51040-154 = "……네, 니야 님의 말씀대로."
51040-155 = "총학생회의 이름으로 선언한다. 축제 따윈 그만둬라. 라든가, 샬레의 이름으로 말할 테니, 축제를 할 때 망량즈에게 축제용 쿠폰을 좀 더 나눠줘라. 라든가."
51040-156 = "……주로 권위에 기댄 망량즈들이 저지르는 장난 전화…… 아니, 편지 같은 것도 자주 오는 편이긴 합니다."
51040-157 = "[s] \"아니, 그런 일이 자주 있는 거야? 고생이네!\""
51040-159 = "물론, 어디까지나 이는 저희 백귀야행의 내부 사정. 샬레의 선생님에게 쪼르르 달려가 <응석을 부릴 정도의 사건>은 아닙니다."
51040-160 = "냐하핫. 네. 아무리 그래도 거기까지 폐를 끼칠 수야 없지요. 안 그래? 카호."
51040-161 = "그건……"
51040-162 = "네, 니야 님의 말씀이 맞습니다."
51040-163 = "[s] \"나는 괜찮은데 말이야.\""
51040-164 = "뭐어, 그 말씀은 감사하지만, 이런 일이 생기면 보통은 백화요란의 차례! 가 되는 법이거든요."
51040-165 = "다만 아시다시피 현재 백화요란은 부장과 부부장의 잠적 이후 활동이 거의 정지된 상태."
51040-166 = "게다가 그뿐만이 아니라."
51040-170 = "──바로 엊그제, 백화요란에서 공식적으로 <해산령>을 내렸다는 속보가 들어왔답니다."
51040-176 = "아니, 그럴 리는 없나. 최근에 그쪽은 <해산령>이다 뭐다 난리가 나면서 전부 근신에 들어갔다고 들은 것 같으이."
51040-181 = "아뇨!"
51040-183 = "[ns] \"그 말은, 백화요란이 정말로 해산한다는 뜻……이야?\""
51040-184 = "네, 부장급의 잠적 이후, 더는 동아리를 유지할 수 없다고……."
51040-185 = "아니, 어쩌면 [ruby=・]유[/ruby][ruby=・]지[/ruby]할 필요가 없다고 누군가가 [ruby=・]판[/ruby][ruby=・]단[/ruby]한 것이겠지요."
51040-186 = "여기까지 왔다면 절차상으로도 이젠 폐부 단계라고 밖에 볼 수 없는 상황입니다."
51040-187 = "……정말 무슨 생각들인지."
51040-188 = "라고 푸념도 해보고~ 냐하, 이대로라면 망량즈가 알아채는 것도 시간 문제려나요~"
51040-189 = "어쨌거나 이런저런 이유가 있으므로 부디 샬레의 선생님께선 이곳에 머물면서 백화요란의 공백을 채워줬으면~ 했달까."
51040-190 = "물론 축제를 즐겨달라는 것도 본심이지만요? 겸사겸사란 것으로~"
51040-191 = "[s] \"니야는 솔직하네.\""
51040-192 = "후후. 네, 단지 그뿐."
51040-193 = "물론, 그렇지 않아도 바쁜 샬레의 선생님에게 이런 억지라니, 제멋대로라는 말을 들어도 부정하지는 않는답니다."
51040-194 = "하지만 상황이 상황이다 보니 이용할 수 있는 건 저언~부 이용하는 게 좋달지~"
51040-195 = "음양부 부장으로서 늘 귀찮지만……이 아니라 맡은 바 업무를 해내기 위해 전력으로 힘을 내고 있달지~"
51040-196 = "그걸 위해서라면 선생님에게 앙큼한 속내를 감추는 것도 마다하지 않는달지~"
51040-197 = "[s] \"응, 그건 니야 다운 걸.\""
51040-198 = "……선생님."
51040-199 = "냐하핫. 그 말씀은, 역시나 음모를 꾸미기만 하는 저의 모습에 살짝 실망을 하셨다는 말씀이신지?"
51040-200 = "[s3] \"말은 그렇게 하지만, 결국 백귀야행의 모두를 위해 움직이는 그 모습\"\n[s4] \"그 따듯한 속마음이, 니야답다고 생각했을 뿐이야.\""
51040-203 = "어머나, 그 말씀은 단지 제가 표리부동하고 있다는 지적이시온지?"
51040-204 = "[s] \"어?! 그런 의도로 말한 건 아닌데!\""
51040-205 = "……뭐어, 그렇다고는 해도 선생님. 제가 할 말은 아니라고 생각하옵니다만."
51040-206 = "그렇게 남의 억지를 받아주시기만 하면 언젠가 코가 꿰일 거라구요?"
51040-207 = "이번 일도 저 나름의 숨겨둔 음모가 있을지도~ 없을지도~ 모르는데."
51040-208 = "저, 좀 걱정되기 시작했답니다?"
51040-209 = "[s] \"왜 도와준다고 말하고도 그런 말을 들어야 해?!\""
51040-210 = "냐하하~ 그래도 도와주신다니, 어머나. 다행이어라~"
51040-211 = "그치. 치세~? 카호~?"
51040-213 = "그치~~~"
51040-214 = "……선생님께서 그리 말씀해 주신다면 당연히 기쁜 일이긴 합니다만."
51040-215 = "선생님~ 당분간 여기 있는 거지~?"
51040-216 = "그럼 오늘은 연습하는 거 보여줄게~"
51040-220 = "치세 쨩의 연습 라이브……!"
51040-221 = "그걸 직관할 수 있다니! 그건 엄청 기뻐요!"
51040-223 = "냐하항, 그럼 이것으로 선생님께서도 흔쾌히 허락하신 걸로 알고,"
51040-224 = "이다음으로는……."
51040-229 = "잠까아아안!!"
51040-237 = "이야기는 들었사와요!"
51040-241 = "소녀의 이름은 유카리!"
51040-246 = "백화요란 분쟁조정위원회의 자랑스러운 1학년이자 최강의 엘리~트!"
51040-247 = "음양부 부장님께 부탁이 있어 이곳에 찾아왔답니다!"
51040-253 = "……어머나."
51040-255 = "다음화;자칭 엘리트 소녀 등장!"
