[translation]
1602-1 = "좌충우돌 급양부의 위생관리평가 2"
1602-2 = "먼저 개인위생관리 상태."
1602-3 = "모두 손을 내밀어 봐."
1602-4 = "자."
1602-5 = "여기요."
1602-6 = "엣헴~! 위생 관리라면 자신 있어!"
1602-7 = "음식을 맛있게 먹으려면 위생규칙도 잘 지켜야 하니까!"
1602-8 = "아니……, 넌 급양부가 아니잖아."
1602-9 = "뭐, 상관없지만."
1602-11 = "흠, 좋아. 다들 깨끗하게 손질했네."
1602-12 = "개인 위생 상태는 양호- 체크했고."
1602-13 = "다음은……."
1602-15 = "사용하는 도구의 청결 상태 관리……. 양호."
1602-16 = "탁자나 의자, 커튼 같은 시설물 관리도 제대로 되어있고."
1602-17 = "식재료의 유통기한도……. 준수하고 있네."
1602-18 = "그리고 다음은…… 대망의 주방이야."
1602-21 = "(꿀꺽)"
1602-23 = "(부글부글부글)"
1602-24 = "응? 저건, 냄비잖아?"
1602-25 = "쿠구구구궁!"
1602-26 = "어?! 냄비가 흔들린다아-?!"
1602-27 = "주리, 저건 네가 만들던 요리잖아. 무슨 일이야?!"
1602-28 = "앗! 제가 만든 요리가 폭주하기 시작했나 봐요!"
1602-29 = "또?!"
1602-30 = "……또?"
1602-31 = "하지만 괜찮아요. 선배!"
1602-32 = "언제든지 이런 상황이 벌어지더라도 대응할 수 있도록, 저 공부해왔으니까요!"
1602-33 = "위생평가의 무사 종료와 급양부의 안녕, 그리고 여러분의 안전을 위해!"
1602-34 = "저, 싸우겠어요!"
1602-35 = "이오리 씨에게 지지 않을 거랍니다!"
1602-36 = "그러니까 왜 선의의 라이벌처럼 말하는 거냐구!"
1602-44 = "우와앗?! 요리가 습격해온다아!!"
1602-45 = "나…… 생각도 못했어."
1602-46 = "요리는 내가 먹는 거라고만 생각했는데."
1602-47 = "살다 보면 요리한테 먹힐 수도 있는 거구나……!"
1602-48 = "아니, 보통 없지 않아? 그런 경우……."
1602-49 = "그보다 이건, 위생 문제인가……?"
1602-50 = "아니겠지? #n으음, 일단 양호에 체크……."
1602-55 = "위생관리평가 전부 체크 완료……."
1602-56 = "칫, 만점이야."
1602-57 = "엣-헴!"
1602-58 = "아니, 왜 미식연구회 부원이 자랑스러워 하는 거야……?"
1602-59 = "근데, 생각보다 순순히 인정하네?"
1602-60 = "쳇. 난 싸우러 온 게 아니야."
1602-61 = "말 그대로 위생 상태를 점검하러 나왔을 뿐이지."
1602-62 = "좋아. 좋다고. 인정하겠어. 위생 상태는 완벽해."
1602-63 = "하아……."
1602-64 = "응! 다행이야!"
1602-67 = "그래도 다시 봤어. 급양부."
1602-68 = "너희들의 뜨거운 열정. 완벽한 위생 상태……."
1602-69 = "뭐, 평소 밥이 맛없는 건 제쳐 두고, 이 부분은 확실히 해두고 있었네."
1602-70 = "이제 알겠냐~!"
1602-71 = "누군 맛없게 만들고 싶어서 그런 줄 알아?!"
1602-72 = "뭐어, 결과를 보니 #n확실히 내가 전해들은 이야기에 착오가 있었던 걸지도 모르겠어."
1602-73 = "이 정도로 깨끗하다면, 돌아가서 판단을 재고할 필요가 있겠는 걸."
1602-74 = "저야말로 감탄했어요."
1602-75 = "선도부답게 신속하면서도 공명정대한 평가!"
1602-76 = "네, 이번 급양평가관이 이오리 씨라 다행이네요!"
1602-77 = "윽! 입에 발린 말을 한다고 나오는 건 아무것도 없어!"
1602-78 = "돼, 됐다고. 난 이만 갈 테니까!"
1602-82 = "(다행이다아……. 무사히 끝난 거, 맞지……?)"
1602-83 = "크흠, 말을 많이 해서 그런가."
1602-84 = "목이 마른데, 혹시 마실 만한 거 있어?"
1602-85 = "어……? 마실 거? 물이면 돼?"
1602-87 = "아, 그런 거라면 마침 좋은 게 있어요!"
1602-90 = "여기 쭉 들이키세요."
1602-91 = "응? 아, 오렌지 주스야? 고마워. 잘 마실게."
1602-92 = "나도나도 마실래!"
1602-93 = "후훗, 네. 여기 있어요!"
1602-95 = "……응? 주스?"
1602-96 = "급양부에 아직 급식용 오렌지 주스는 들어온 적 없지 않아?"
1602-97 = "아, 이건 급식용이 아니라."
1602-98 = "이번에 제가 대접하기 위해 직접 만든 생과일 주스예요!"
1602-99 = "저번 급양평가관에게도 드렸답니다!"
1602-100 = "뭐……? 저번에도?"
1602-101 = "……."
1602-103 = "지난 번 위생평가 때, 급양부를 찾았던 평가관은 식중독 판정을 받았어."
1602-105 = "……!!"
1602-106 = "잠깐, 거기! 스토오옵!"
1602-107 = "응? (꿀꺽꿀꺽)"
1602-108 = "……윽?!"
1602-111 = "Nooooo!!!!"
1602-112 = "어머? 이오리 씨? 아침부터 피곤했던 걸까요?"
1602-113 = "그래도 여기서 갑자기 주무시면 곤란해요~"
1602-114 = "으아아아! 망했어!!"
1602-115 = "이, 이래선 또 다시 위생평가가!"
1602-116 = "아니, 심지어 이번엔 상대가 선도부니까 더욱 나락으로……! #n급양부 예산이 반토막으로……!"
1602-117 = "……아냐. 진정해. 후우카. 아직 해결방법은 있을 거야!"
1602-118 = "그, 그래!"
1602-119 = "다른 선도부원에게 들키기 전에, 피해자를 먼저 숨기면……!"
1602-127 = "(꿀꺽꿀꺽)"
1602-129 = "푸하. 맛있다!"
1602-131 = "(그 후 깨어난 이오리에게 가차 없이 위생평가 F등급을 받았다.)"
1602-132 = "좌충우돌 급양부의 위생관리평가"
