[translation]
2006006-1 = "和伊吹，一起。"
2006006-2 = "海邊"
2006006-3 = "（來到伊吹所在的海邊）"
2006006-4 = "（然而……）"
2006006-5 = ""
2006006-7 = ""
2006006-8 = "唔嗯……"
2006006-9 = "啊，那邊也有！"
2006006-10 = ""
2006006-12 = ""
2006006-13 = ""
2006006-14 = "耶嘿嘿，這是第五個了……"
2006006-16 = "（伊吹正埋頭挖著沙灘，忙著撿東西）"
2006006-17 = ""
2006006-18 = "[ns] 「伊吹？」"
2006006-19 = "啊，老師！"
2006006-20 = "[s] 「你在做什麼？」"
2006006-21 = "嗯，伊吹在找畫畫要用的材料！"
2006006-22 = ""
2006006-24 = ""
2006006-25 = ""
2006006-26 = "你看看這個！"
2006006-27 = ""
2006006-28 = "（伊吹伸出的手上……）"
2006006-29 = "（放著五顏六色的貝殼碎片和玻璃碎片）"
2006006-30 = "（被海浪磨得圓滾滾又光滑的碎片）"
2006006-31 = "怎麼樣，很漂亮吧，老師？"
2006006-32 = "[s1] 「真的很像寶石呢……！」\n[s2] 「不過要怎麼用這些畫畫……？」"
2006006-35 = "嗯，要把這些……"
2006006-36 = "貼在紙上做成一幅畫！"
2006006-37 = "因為畫畫不一定只能用蠟筆嘛！"
2006006-38 = "可是，實在很難找到顏色完全滿意的碎片……"
2006006-39 = "所以伊吹一大早就出來在沙子裡翻找了！"
2006006-40 = ""
2006006-42 = ""
2006006-43 = ""
2006006-44 = "[ns3] 「那麼，我可以幫忙找材料嗎？」\n[ns4] 「伊吹大畫家？」"
2006006-47 = "大畫家……！"
2006006-48 = "嗯嗯！謝謝老師！"
2006006-49 = "[s] 「那可以稍等我一下嗎？」"
2006006-50 = "嗯？"
2006006-51 = "啊，你說有更輕鬆找碎片的方法？"
2006006-52 = "嗯！那伊吹會等你的！"
2006006-54 = "（就這樣讓伊吹在原地等，去附近的店買了某樣東西回來）"
2006006-55 = ""
2006006-56 = "啊，老師！你回來了？"
2006006-57 = "咦？老師手上拿的那個……"
2006006-58 = "耙子……？"
2006006-59 = "[s] 「沒錯，是園藝用的耙子。」"
2006006-60 = "可是要怎麼用那個……"
2006006-61 = "啊！"
2006006-62 = "老師！伊吹好像知道了！"
2006006-63 = "用耙子耙沙子的話，沙子會漏下去……"
2006006-64 = "就只會耙出藏在沙子裡的貝殼和玻璃碎片了吧！"
2006006-65 = "[s] 「不愧是伊吹！真聰明！」"
2006006-66 = "耶嘿嘿，謝謝老師！"
2006006-68 = "（把耙子交給了伊吹）"
2006006-69 = ""
2006006-70 = "這樣好像就能更輕鬆地找到畫畫的材料了！"
2006006-71 = ""
2006006-73 = ""
2006006-74 = ""
2006006-75 = "來，那先從這裡挖挖看……"
2006006-76 = ""
2006006-78 = ""
2006006-79 = ""
2006006-80 = "……咦？"
2006006-81 = "[s] 「啊……！」"
2006006-83 = "（伊吹的耙子尖端雖然也勾到了貝殼和玻璃碎片……）"
2006006-84 = "（……但勾上來更多的是垃圾）"
2006006-85 = ""
2006006-86 = "[ns] 「那個，伊吹……」"
2006006-87 = "這樣的話，垃圾也可以一起清掉了吧？"
2006006-88 = "[s] 「嗯……？」"
2006006-89 = "既能收集畫畫的材料，又能讓海邊變乾淨，對吧？"
2006006-90 = "所以伊吹會加油的！"
2006006-91 = "[s5] 「好耀眼……！」\n[s6] 「好刺眼……！」"
2006006-94 = "嗯？老師，你在哭嗎？"
2006006-95 = "伊，伊吹做錯什麼了嗎？"
2006006-96 = "不，不是嗎……？"
2006006-97 = "只是……感動而已？為什麼……？"
2006006-99 = "（之後拿來空袋子，和伊吹一起把垃圾挖了出來）"
2006006-100 = "（結果挖出了超過五袋的垃圾……）"
2006006-101 = "（……以及一小把閃閃發光的碎片）"
