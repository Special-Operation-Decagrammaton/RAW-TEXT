[translation]
2006006-1 = "이부키와, 함께."
2006006-2 = "해변"
2006006-3 = "(이부키가 있는 해변으로 나갔다.)"
2006006-4 = "(그런데…….)"
2006006-8 = "으음……."
2006006-9 = "아, 저기도 있다!"
2006006-14 = "헤헤, 이걸로 다섯 개째……."
2006006-16 = "(이부키는 모래사장을 파헤치며 뭔가를 줍느라 열심이었다.)"
2006006-18 = "[ns] \"이부키?\""
2006006-19 = "아, 선생님!"
2006006-20 = "[s] \"뭘 하고 있었어?\""
2006006-21 = "응, 그림에 쓸 재료를 찾고 있었어!"
2006006-26 = "이것 좀 봐봐!"
2006006-28 = "(이부키가 내민 손 위에는…….)"
2006006-29 = "(색색깔의 조가비 조각과 유리 조각이 놓여 있었다.)"
2006006-30 = "(파도에 깎여서, 둥글둥글하게 매끈해진 조각들이.)"
2006006-31 = "어때, 예쁘지, 선생님?"
2006006-32 = "[s1] \"정말 보석 같은 느낌이네……!\"\n[s2] \"그런데 이것들로 어떻게 그림을……?"
2006006-35 = "응, 이것들을 말이지……."
2006006-36 = "종이 위에 붙여서 그림을 만들 거야!"
2006006-37 = "그림을 꼭 크레파스만으로 칠할 필요는 없으니까!"
2006006-38 = "하지만 말이지, 마음에 쏙 드는 색의 조각들을 찾기는 어려워서……."
2006006-39 = "일찍부터 나와서 모래 속을 뒤지고 있었어!"
2006006-44 = "[ns3] \"그렇다면, 재료 찾는 걸 도와드려도 될까요?\"\n[ns4] \"이부키 화백님?\""
2006006-47 = "화백……!"
2006006-48 = "응응! 고맙습니다, 선생님!"
2006006-49 = "[s] \"그럼 잠깐만 기다려줄래?\""
2006006-50 = "응?"
2006006-51 = "아, 조각들을 찾는 훨씬 편한 방법이 있다고?"
2006006-52 = "응! 그러면 기다리고 있을게!"
2006006-54 = "(그렇게 이부키를 남겨두고 잠시 근처 가게에서 무언가를 사 왔다.)"
2006006-56 = "아, 선생님! 돌아왔어?"
2006006-57 = "어? 그런데 선생님이 들고 있는 그거……."
2006006-58 = "갈퀴……?"
2006006-59 = "[s] \"맞아, 원예용 갈퀴야.\""
2006006-60 = "그런데 그걸로 어떻게……."
2006006-61 = "아!"
2006006-62 = "선생님! 이부키 알 것 같아!"
2006006-63 = "모래를 갈퀴로 긁으면, 모래는 빠져나가고……."
2006006-64 = "모래 속에 숨어 있던 조가비랑 유리 조각만 걸려 올라오겠네!"
2006006-65 = "[s] \"역시! 이부키 똑똑해!\""
2006006-66 = "헤헤, 고맙습니다. 선생님!"
2006006-68 = "(이부키에게 갈퀴를 건넸다.)"
2006006-70 = "이러면 훨씬 더 쉽게 그림 재료들을 찾을 수 있을 것 같아!"
2006006-75 = "자, 그러면 여기부터 한 번 파보면……."
2006006-80 = "……어?"
2006006-81 = "[s] \"앗……!\""
2006006-83 = "(이부키의 갈퀴 끝에는, 조가비와 유리 조각들도 걸려 있었지만…….)"
2006006-84 = "(……그보다 더 많은 양의 쓰레기가 걸려 올라왔다.)"
2006006-86 = "[ns] \"저기, 이부키…….\""
2006006-87 = "이러면, 쓰레기도 같이 치울 수 있겠네?"
2006006-88 = "[s] \"응……?\""
2006006-89 = "그림 재료들도 모을 수 있고, 해변도 깨끗하게 할 수 있는 거잖아?"
2006006-90 = "그러니까 이부키, 열심히 할게!"
2006006-91 = "[s5] \"밝아……!\"\n[s6] \"눈부셔……!\""
2006006-94 = "응? 선생님, 울어?"
2006006-95 = "이, 이부키가 뭐가 잘못한 거야?"
2006006-96 = "아, 아니라고……?"
2006006-97 = "그냥 감동한 거……라고? 왜……?"
2006006-99 = "(이후 빈 자루들을 챙겨 와서 이부키와 함께 쓰레기를 캐냈다.)"
2006006-100 = "(그 결과, 다섯 자루가 넘는 양의 쓰레기를 캐낼 수 있었고…….)"
2006006-101 = "(반짝반짝 빛나는 조각을…… 딱 한 줌 구할 수 있었다.)"
