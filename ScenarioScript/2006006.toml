[translation]
2006006-1 = "ด้วยกันกับอิบูกิ"
2006006-2 = "ชายหาด"
2006006-3 = "(คุณครูออกไปยังชายหาดที่อิบูกิอยู่)"
2006006-4 = "(แต่ว่า...)"
2006006-5 = ""
2006006-7 = ""
2006006-8 = "อืม..."
2006006-9 = "อ๊ะ ตรงนั้นก็มี!"
2006006-10 = ""
2006006-12 = ""
2006006-13 = ""
2006006-14 = "ฮิฮิ อันนี้ก็เป็นอันที่ห้าแล้ว..."
2006006-16 = "(อิบูกิกำลังตั้งอกตั้งใจขุดคุ้ยหาดทรายเพื่อเก็บอะไรบางอย่าง)"
2006006-17 = ""
2006006-18 = "[ns] \"อิบูกิ?\""
2006006-19 = "อ๊ะ คุณครู!"
2006006-20 = "[s] \"ทำอะไรอยู่เหรอ?\""
2006006-21 = "อื้ม กำลังหาวัสดุมาทำรูปภาพอยู่น่ะ!"
2006006-22 = ""
2006006-24 = ""
2006006-25 = ""
2006006-26 = "ดูนี่สิ!"
2006006-27 = ""
2006006-28 = "(ในฝ่ามือที่อิบูกิยื่นมา...)"
2006006-29 = "(มีเศษเปลือกหอยกับเศษแก้วหลากสีวางอยู่)"
2006006-30 = "(ทุกชิ้นถูกคลื่นขัดจนมนและเรียบเนียน)"
2006006-31 = "เป็นไง สวยใช่มั้ย คุณครู?"
2006006-32 = "[s1] \"ดูเหมือนอัญมณีจริงๆ เลย...!\"\n[s2] \"ว่าแต่ จะเอาพวกนี้มาทำรูปภาพยังไง...?\""
2006006-35 = "อื้ม อิบูกิจะเอาพวกนี้..."
2006006-36 = "มาติดบนกระดาษให้เป็นรูปภาพละ!"
2006006-37 = "ก็รูปภาพไม่จำเป็นต้องระบายด้วยสีเทียนเสมอไปนี่นา!"
2006006-38 = "แต่ว่านะ จะหาเศษชิ้นที่มีสีถูกใจก็ยาก..."
2006006-39 = "อิบูกิก็เลยออกมาตั้งแต่เช้า แล้วคุ้ยหาในทรายอยู่!"
2006006-40 = ""
2006006-42 = ""
2006006-43 = ""
2006006-44 = "[ns3] \"งั้นขอครูช่วยท่านจิตรกรหาวัสดุด้วยได้มั้ย?\"\n[ns4] \"งั้นขอครูช่วยท่านจิตรกรอิบูกิได้มั้ย?\""
2006006-47 = "จิตรกรเหรอ...!"
2006006-48 = "อื้มๆ! ขอบคุณค่ะ คุณครู!"
2006006-49 = "[s] \"ถ้างั้น รอเดี๋ยวนะ\""
2006006-50 = "หืม?"
2006006-51 = "อ๋อ มีวิธีง่ายกว่าในการหาชิ้นพวกนี้งั้นเหรอ?"
2006006-52 = "อื้อ! ถ้างั้นอิบูกิจะรอนะ!"
2006006-54 = "(คุณครูให้อิบูกิรออยู่ตรงนั้น แล้วไปซื้ออะไรบางอย่างจากร้านใกล้ๆ มา)"
2006006-55 = ""
2006006-56 = "อ๊ะ คุณครู! กลับมาแล้วเหรอ?"
2006006-57 = "เอ๋? แต่ที่คุณครูถืออยู่คือ..."
2006006-58 = "คราด... เหรอ?"
2006006-59 = "[s] \"ใช่แล้ว คราดสำหรับทำสวนน่ะ\""
2006006-60 = "แต่จะใช้มันยังไง..."
2006006-61 = "อ๊ะ!"
2006006-62 = "คุณครู! อิบูกิน่าจะรู้แล้วละ!"
2006006-63 = "ถ้าเอาคราดไปคราดทราย ทรายก็จะลอดออกไปตามซี่..."
2006006-64 = "แล้วก็จะมีแค่เปลือกหอยกับเศษแก้วที่ซ่อนอยู่ในทรายติดขึ้นมาสินะ!"
2006006-65 = "[s] \"สมกับเป็นอิบูกิเลย! ฉลาดมาก!\""
2006006-66 = "ฮิฮิ ขอบคุณค่ะ คุณครู!"
2006006-68 = "(คุณครูยื่นคราดให้อิบูกิ)"
2006006-69 = ""
2006006-70 = "แบบนี้น่าจะหาวัสดุมาทำรูปภาพได้ง่ายขึ้นเยอะเลย!"
2006006-71 = ""
2006006-73 = ""
2006006-74 = ""
2006006-75 = "เอาละ เริ่มจากตรงนี้ก่อน..."
2006006-76 = ""
2006006-78 = ""
2006006-79 = ""
2006006-80 = "อ้าว...?"
2006006-81 = "[s] \"อ๊ะ...!\""
2006006-83 = "(ที่ปลายคราดของอิบูกิมีทั้งเปลือกหอยและเศษแก้วติดอยู่...)"
2006006-84 = "(แต่ขยะกลับติดขึ้นมาเยอะกว่านั้นอีก...)"
2006006-85 = ""
2006006-86 = "[ns] \"เอ่อ อิบูกิ...\""
2006006-87 = "แบบนี้ก็เก็บขยะไปด้วยได้เลยสินะ?"
2006006-88 = "[s] \"หืม...?\""
2006006-89 = "ก็ได้ทั้งวัสดุมาทำรูปภาพ แล้วก็ทำให้ชายหาดสะอาดด้วยนี่นา"
2006006-90 = "เพราะงั้นอิบูกิจะตั้งใจทำให้เต็มที่เลย!"
2006006-91 = "[s5] \"สดใสจังเลยนะ...!\"\n[s6] \"เจิดจ้าจนแสบตาเลย...!\""
2006006-94 = "หืม? คุณครูร้องไห้เหรอ?"
2006006-95 = "อะ... อิบูกิทำอะไรผิดไปหรือเปล่า?"
2006006-96 = "อะ... อ้าว ไม่ใช่เหรอ...?"
2006006-97 = "แค่ประทับใจ... งั้นเหรอ? ทำไมล่ะ...?"
2006006-99 = "(หลังจากนั้นคุณครูก็ไปเอากระสอบเปล่ามา แล้วก็เก็บขยะด้วยกันกับอิบูกิ)"
2006006-100 = "(สุดท้ายก็ขุดขยะได้มากกว่าห้ากระสอบ...)"
2006006-101 = "(แต่ได้ชิ้นส่วนที่ส่องประกายระยิบระยับมา... แค่หยิบมือเดียว)"
