[translation]
10009120-1 = "후일담;아무튼 잘못된 건 세상이야"
10009120-2 = "……"
10009120-4 = "내가 스케반이 된 이유는, 자유로웠기 때문이었지……"
10009120-5 = "규율에 얽매이지 않고, 자유롭게 인생을 살아 나가고."
10009120-6 = "자신의 일은 자신이 책임져 가며, 그래도 책임질 수 없는 것들은 사회에 되돌려 주면서……"
10009120-7 = "그건 나쁘지 않았어. 재미있기도 하고."
10009120-8 = "조금, 사는 게 힘들어질 때도 있었지만, 어차피 쉽게만 살아가면 재미없는 법이잖아."
10009120-9 = "다 좋아. 다 좋은데……"
10009120-12 = "이, 시대착오적인 치마는 어떻게 안 되는 거냐?!"
10009120-13 = "뭐냐고, 대체! 길고, 발목까지 내려오고, 거추장스럽고!"
10009120-17 = "보기에 예쁜 것도 아니지, 비가 오면 끝단이 젖지, 안에다 뭘 숨길 수도 있다지만 솔직히 그런 거 필요 없지!"
10009120-21 = "그런데도 이 치마가 아니면 복장 위반이라느니 의리가 없다느니!"
10009120-22 = "스케반이면 꾸며서도 안 된다는 거야?! 좀 예쁘고 귀여운 거 입으면 안 된다는 거냐고!"
10009120-24 = "후후후후…… 당신의 고민 담긴 외침, 잘 들었습니다."
10009120-26 = "누, 누구냐?!"
10009120-29 = "어쩌면 당신의 고민을 해결해 줄 수 있을지도 모르는……"
10009120-30 = "조력자라고나 할까요?"
10009120-35 = "그러니까, 이 옷과 가면을 쓰고…… 여기에서 멋대로 날뛰면 된다는 거야?"
10009120-37 = "그렇답니다."
10009120-38 = "하지만 이거, 당신이 입고 있는 옷이랑 가면과 거의 똑같은 거 같은데?"
10009120-39 = "그렇다고는 해도, 그 치마보다는 나을지도 모르는 물건이기도 하죠. 그렇지 않나요?"
10009120-40 = "강요하지는 않겠습니다. 저는 단지 제안을 할 뿐이니까요."
10009120-41 = "……"
10009120-42 = "마음에 들었어."
10009120-43 = "이 기모노풍 교복도 예쁘고, 귀엽고…… 가면도 뭐, 그럭저럭 나쁘지 않고."
10009120-44 = "날뛰는 건 애초에 전공이기도 하고."
10009120-48 = "그 제안, 받아 주지!"
10009120-56 = "그러면, 수고해 주시길 바랍니다."
10009120-60 = "가버렸군……"
10009120-65 = "그러면, 할 일은 정해진 건가."
10009120-72 = "좋아, 어디 한번 마음껏 날뛰어 보자고!"
