[translation]
10053110-1 = "後日談;神秘學研究會的天空，UFO的春天"
10053110-3 = "……"
10053110-8 = "玲奈君，你在忙什麼？"
10053110-9 = "哦，我在給宿舍的前輩們發訊息……"
10053110-10 = "對了，結果就像我說的吧？槌之子並不存在。"
10053110-11 = "不對，肯定存在，槌之子就在我們心中……"
10053110-12 = "我是說真正的槌之子！！"
10053110-13 = "哦對，沒有找到真正的槌之子。"
10053110-14 = "結果槌之子目擊談這種東西，是在外面修橋的那些人散布的。"
10053110-15 = "對吧？所以我把這個結論跟前輩們說了。"
10053110-16 = "嗯……？"
10053110-17 = "這樣大家就會知道所謂的神秘學是怎樣的騙局了。"
10053110-18 = "不，怎麼想都只會有反效果吧……？"
10053110-19 = "啊，馬上有回覆了，你看。"
10053110-22 = "哎呀。"
10053110-23 = "呵呵呵。"
10053110-24 = "咿嘻嘻……"
10053110-27 = "為，為什麼是這種反應啊？"
10053110-30 = "我還在想玲奈跟朋友們去旅行是什麼意思。"
10053110-31 = "竟然跑那麼遠就只是為了證明槌之子這個神秘學。"
10053110-32 = "果然……玲奈是優秀的神秘學研究會成員呢……"
10053110-35 = "不對，大家為什麼自己亂誤會啊！？"
10053110-36 = "才不是好嗎！？我完全不好奇……！"
10053110-43 = "嚇啊啊──！！所以說！！才不是這樣！！！"
10053110-44 = "所以就說了會有反效果……"
10053110-45 = "對了，既然大家都聚在一起，那我們快出去吧。"
10053110-46 = "嗯？出去？為什麼？"
10053110-47 = "已經要晚上了耶……？"
10053110-48 = "當然是都來到這種地方了，"
10053110-53 = "晚上該做的事也只有一件吧？"
10053110-58 = "Cosmos Cosmo…… Aria Ariaria……"
10053110-59 = "請回應我們的呼喚。"
10053110-60 = "Cosmos Cosmo……"
10053110-61 = "Aria Ariaria……"
10053110-63 = "……？？？"
10053110-64 = "這是在幹嘛？"
10053110-66 = "那邊安靜！！如果祈願中混入雜念就會被宇宙的暗能量給阻擋的！！"
10053110-67 = "銀河彼岸的存在們！請回應我們的呼喚！"
10053110-72 = "想想辦法啊……那是你的後輩吧？"
10053110-73 = "那個……要阻止那種狀態的翼有點困難……"
10053110-74 = "你有沒有過第一次告訴孩子聖誕老人不存在的經驗？"
10053110-75 = "完全能理解……"
10053110-76 = "好像知道是什麼感覺了……"
10053110-78 = "那邊！咒語斷了！與外星的通訊正在減弱！"
10053110-83 = "Aria Ariaria……"
10053110-84 = "再更誠心一點！！！"
10053110-85 = "Cosmos Cosmo……"
10053110-87 = "更誠心一點！！！！！！"
10053110-89 = "Aria Ariaria！！"
