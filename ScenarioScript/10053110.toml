10053110-8 = "เรนะ ตอนนี้ยุ่งหรือเปล่า? ทำอะไรอยู่เหรอ?"
10053110-9 = "อ้อ เดี๋ยวนะ ฉันกำลังส่งข้อความหารุ่นพี่ในหอพัก..."
10053110-10 = "ใช่แล้วละ สุดท้ายแล้วฉันก็พูดถูกเรื่องการสำรวจ สึจิโนโกะน่ะไม่มีอยู่จริงหรอก"
10053110-11 = "ไม่หรอก มันมีอยู่จริงนะ สึจิโนโกะอยู่ในใจเราไง..."
10053110-12 = "ไม่เอาอะไรแบบนั้นสิ!! ฉันหมายถึงสึจิโนโกะตัวจริงต่างหาก!!"
10053110-13 = "อ่า ก็ใช่นะ เราหาสึจิโนโกะตัวจริงไม่เจอนี่นา"
10053110-14 = "สุดท้ายแล้วเรื่องราวการพบเห็นสึจิโนโกะก็เป็นแค่ข่าวลือจากเด็กพวกนั้นที่ออกไปซ่อมสะพานอยู่"
10053110-15 = "ใช่มั้ยล่ะ? เพราะแบบนั้นฉันก็เลยส่งข้อสรุปไปให้พวกรุ่นพี่ยังไงล่ะ"
10053110-16 = "หืม...?"
10053110-17 = "ข้อสรุปนี้จะทำให้ทุกคนเข้าใจมากขึ้นยังไงล่ะ ว่าสิ่งที่เรียกว่ารหัสยศาสตร์เป็นเรื่องหลอกลวงที่เกิดขึ้น#nได้ยังไงบ้าง"
10053110-18 = "แต่ไม่ว่าจะคิดเท่าไร มันก็น่าจะส่งผลเสียมากกว่านะ...?"
10053110-19 = "อ๊ะ ได้ข้อความตอบกลับทันทีเลย ดูสิ"
