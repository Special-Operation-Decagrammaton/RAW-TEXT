10053110-8 = "玲奈君，你在忙嗎？"
10053110-9 = "啊，等我一下。我正在傳訊息給宿舍的前輩們……"
10053110-10 = "對了，結果就跟我說的一樣對吧？#n槌之子的確是不存在的。"
