[translation]
10053110-1 = "후일담;오컬연의 하늘, UFO의 봄"
10053110-3 = "……."
10053110-8 = "레나 군. 지금 바빠? 뭐 해?"
10053110-9 = "아, 잠깐, 기숙사 선배들한테 메시지……."
10053110-10 = "맞다. 결국, 조사는 내가 정답이었잖아? 츠치노코는 존재하지 않는다."
10053110-11 = "아니, 아니. 분명히 존재했다고. 츠치노코는 우리들 마음속에……."
10053110-12 = "그런 거 말고!! 진짜 츠치노코 말이야!!"
10053110-13 = "아, 그렇지. 진짜 츠치노코는 찾지 못했지."
10053110-14 = "결국, 츠치노코 목격담이란 것은, 밖에서 다리 고치고 있는 저 친구들이 퍼트린 것이었고."
10053110-15 = "그렇지? 그래서, 그 결론을 선배들에게 보내줬어."
10053110-16 = "응……?"
10053110-17 = "이걸로, 소위 말하는 오컬트라는 것이, 어떤 식으로 생기는 사기인지 다들 좀 알게 되겠지."
10053110-18 = "……아니, 아무리 생각해도 역효과밖에……?"
10053110-19 = "아, 바로 답장 왔다. 봐봐."
10053110-22 = "어머나."
10053110-23 = "뉴후후."
10053110-24 = "이히히……"
10053110-27 = "뭐, 뭐야, 반응이 왜 이래?"
10053110-30 = "레나 쨩이 친구들이랑 여행을 간다는 게 무슨 뜻인가 했더니."
10053110-31 = "그 멀리까지 가서, 츠치노코라는 오컬트를 증명하려 하고 있었을 줄이야."
10053110-32 = "역시…… 레나 쨩은, 훌륭한 오컬연의 일원이네……."
10053110-35 = "아니, 다들 왜 멋대로 오해하고 난리야?!"
10053110-36 = "아니거든?! 전혀 궁금했던 거……!"
10053110-43 = "샤아아악!! 그러니까!! 아니라고!!!"
10053110-44 = "그러니까, 처음부터 그건 역효과라고 했잖아……."
10053110-45 = "아참. 다들 모여 있으니까, 빨리 나가자."
10053110-46 = "응? 나간다니, 왜?"
10053110-47 = "……이 저녁에?"
10053110-48 = "당연하지. 이런 곳까지 와서."
10053110-53 = "밤에 할 일은 하나밖에 없잖아?"
10053110-58 = "코스모스 코스모…… 알리야 알리알리……."
10053110-59 = "우리의 부름에 응답하소서."
10053110-60 = "코스모스 코스모……."
10053110-61 = "알리야 알리알리……."
10053110-63 = "……???"
10053110-64 = "이게 뭐야?"
10053110-66 = "거기, 조용히!! 기원에 잡념이 섞여 들어가면, 우주의 암흑 에너지에 가로막히게 된다고!!"
10053110-67 = "은하수 너머의 존재들이여! 우리의 부름에 답하소서!"
10053110-72 = "……어떻게 좀 해봐. 네 후배잖아."
10053110-73 = "그게…… 저 상태의 츠바사는, 말리기가 어렵다고 할까……."
10053110-74 = "아이한테, 산타가 실존하지 않는다는 걸 처음 가르쳐 주는 역할을 맡아본 적 있나요?"
10053110-75 = "완전 공감."
10053110-76 = "뭔지 알 거 같긴 한데……."
10053110-78 = "거기! 주문이 끊겼어! 외계와의 교신이 약해지고 있어!"
10053110-83 = "알리야 알리알리……."
10053110-84 = "좀 더 간절하게!!!"
10053110-85 = "코스모스 코스모……."
10053110-87 = "더 간절하게!!!!!!"
10053110-89 = "알리야 알리알리!!"
