10053110-12 = "我指的不是那種東西！是真正的槌之子啦！！"
10053110-13 = "哦，原來是這樣啊。#n確實是沒有找到真正的槌之子。"
10053110-14 = "畢竟槌之子的目擊情報，只是在外面修橋的那些人散佈的謠言而已。"
10053110-15 = "對吧？所以我就把這個結論告訴前輩們了。"
10053110-16 = "嗯……？"
10053110-17 = "這樣大家應該就能稍微明白，所謂的神秘學究竟是場怎麼樣的騙局了吧？"
