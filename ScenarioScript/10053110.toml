10053110-30 = "กำลังสงสัยอยู่เลยละ ว่าการที่เรนะจังไปเที่ยวกับเพื่อนๆ มันหมายความว่ายังไง"
10053110-31 = "คิดไม่ถึงเลยนะว่าจะเดินทางไปไกลขนาดนั้นเพื่อพิสูจน์สิ่งลี้ลับที่เรียกว่าสึจิโนโกะ"
10053110-32 = "เรนะจังเนี่ย... เป็นสมาชิกชมรมวิจัยรหัสยศาสตร์ที่ยอดเยี่ยมจริงๆ..."
