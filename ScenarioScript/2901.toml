[translation]
2901-1 = "그렇게 소녀들은 한자리에 모인다. 1"
2901-7 = "백귀야행의 제38번 구교사의 어느 교실"
2901-8 = "우냐악-! 촬영, 드디어 끄으으읕났~다아~"
2901-9 = "고, 고, 고, 고생하셨어요오오…… 부, 부장니임……. 여, 여기, 무, 물이에요……!"
2901-10 = "아, 고마워. 츠쿠요."
2901-11 = "그리고 여기, 땀을 닦을 수건이랑……. 지, 집에서 만들어온 레몬 벌꿀 절임도 있으니, 부, 부디 드, 드셔 주세요……!"
2901-12 = "오호라~ 이런 것까지?"
2901-13 = "우햐햣~ 응. 잘 먹을게-"
2901-14 = "……라고 말하는 시점에서 깨달은 거지만-! 이거 완전히 운동부 패키지잖아! 노려라! 전국대회잖아!"
2901-15 = "으으음, 츠쿠요는 준비성이 철저한걸~"
2901-17 = "제, 제, 제가 할 수 있는 건…… 이, 이 정도뿐이니까요……"
2901-18 = "응? 무슨 소리야? 오늘 촬영에서 츠쿠요가 얼마나 도움이 되었는데."
2901-19 = "츠쿠요가 반사판을 들어주지 않았다면 중간에 내가 원했던 바로 그 타이밍에-"
2901-20 = "인법의 수인을 맺은 순간 파-칭! 하고 반짝이는 장면."
2901-21 = "못 찍었을 거라고~?"
2901-22 = "그, 그런가요? 하, 하지만…… 저, 저어, 조, 좀 더 부장님의 촬영에 도, 도움이 되고 싶지만……."
2901-23 = "제, 제가 할 수 있는 거라고는 어디까지나 촬영 보조 같은 것뿐이고……."
2901-24 = "시, 심지어 그 보조도, 오늘 오전에…… 가, 갑자기 그렇게 되어버려서, 그게……."
2901-25 = "아, 아까 전에 그거."
2901-27 = "츠쿠요! 응! 거기! 그쪽에서 반사판을 들면 돼! 응! 그쪽!"
2901-28 = "네, 네엣! 반사판을, 이렇게, 여기서 이런 식으로 들어서……."
2901-32 = "넷? 아, 저, 저기……."
2901-36 = "여, 여러부운……? 그, 그렇게 제 주변으로 모이시며언…… 고, 곤란해요오……"
2901-37 = "저, 지금 해야 할 일이 있어서…… 그게……."
2901-43 = "그, 그렇게 다리 옆에 모이시면, 저, 우, 움직이기가…… 저, 그게…… 촤, 촬영이이……."
2901-44 = "저, 저, 저, 전 마, 만남의 타워 같은 게 아닌데요오오……!"
2901-46 = "앗! 저기 봐봐! 고양이가 잔뜩이야!"
2901-47 = "고양이 집회인가, 뭔가 하는 그건가?"
2901-48 = "신기해! 사진으로 찍어 놔야지!"
2901-55 = "우, 우와앗. 찌, 찌, 찍지 말아주세요오오오……!!"
2901-56 = "지, 지금~ 촬영 중인데에……!"
2901-58 = "우냐핫- 확실히 그건 재난이었지~ 음음."
2901-59 = "훌쩍…… 훌쩍…… 그래서 결국 본격적인 촬영을 시작하기까지…… 30분이나 더 걸려버렸고……"
2901-60 = "죄, 죄송해요오오…… 부장니이임……."
2901-61 = "저어, 괜히…… 저 때문에에~~!"
2901-62 = "아니아니. 츠쿠요 탓이 아니지 그건."
2901-63 = "반사판을 들고 서 있는 츠쿠요를 보고 혹시 먹이라도 주는 줄 착각했던 거 아닐까?"
2901-64 = "……훌쩍. 그, 그럼 앞으로는…… 그, 그런 것도 챙겨 두는 편이 좋을까요오오……."
2901-65 = "또 그런 일이 일어날 걸 상정하는 거야?! 아니, 뭐 그런 부분까지 착실하게 신경 쓰는 게 또 츠쿠요답지만!"
2901-69 = "뭐, 그래도 별 탈 없이 촬영도 끝마쳤겠다."
2901-70 = "크흠- 그걸로 충분하지 않겠소이까? 츠쿠요 공!"
2901-72 = "아, 네, 네엣? 츠, 츠쿠요 공……?"
2901-73 = "아, 과연 부장님이 평소 사용하시는 닌자 용어인 거네요……!"
2901-74 = "그, 그게, 그러니까. 네, 네엣!"
2901-75 = "뭐~ 지나간 일은 훌훌 털어버리고 우리의 밝은 미래에 집중해보자고!"
2901-76 = "그럼 오늘 찍은 영상이나 편집해볼까?"
2901-77 = "네, 넵!"
2901-84 = "(약 한 시간 후…….)"
2901-86 = "으으음-"
2901-87 = "으으으음~~"
2901-88 = "우냐아앗!"
2901-89 = "부, 부, 부장님? 왜, 왜 그러신가요?"
2901-90 = "내 입으로 이런 말 하긴 좀 그렇지만."
2901-91 = "……역시 부족해."
2901-93 = "저기, 그…… 부족, 하단 말씀은……?"
2901-94 = "오늘 촬영 전까지만 해도, 내 머릿속에는 완벽한 구도와 카메라 워크…… 이번 영상을 어떻게 고조시키면 좋을지-"
2901-95 = "그야말로 완벽한 아이디어가 있었으니까. 여기에 츠쿠요의 보조만 더해진다면-"
2901-96 = "좀 더 이렇게 파바밧~하고."
2901-97 = "여기서는 이렇게 샤샤샥-! 하는 식으로- 멋진 그림이 나올 줄 알았는데."
2901-98 = "어째 확인해보니까. 영 아닌걸…… 마음에 들지가 않아. 아무래도 오늘은 업로드를 미뤄야 할지도……."
2901-99 = "아……."
2901-100 = "아니, 뭐, 어쩔 수 없지. 가끔은 이럴 때도 있는 법이니까-"
2901-101 = "죄, 죄, 죄, 죄송해요오오……! 여, 여, 역시 저 때문에에에……!"
2901-102 = "으응?"
2901-103 = "제, 제가 부족한 탓에……! 부, 부장님이 그렇게나 고생하셨는데- 정작 저는 도움은 하나도 아, 안되고……!"
2901-104 = "아, 아무래도 저는 니, 닌자에 대해선 아, 아무것도 모르니까아…… 흐윽……."
2901-106 = "아니아니, 그건 츠쿠요의 잘못이 아니라니깐-"
2901-107 = "츠쿠요는 아직 닌자 초심자고, 모르는 게 잘못도 아니고, 게다가 츠쿠요. 평소에도 열심히 공부하고 있잖아?"
2901-108 = "응~ 성장기지. 성장기. 너무 그럴 거 없다니까."
2901-109 = "우으…… 그, 그런 가요오오……."
2901-110 = "단지 그게 뭐시다냐, 최근 들어 이렇게 영상이 맘에 안 드는 일이 많아졌다고 할지."
2901-111 = "슬슬 우리 둘만으로는 아이디어가 떨어져서 벅차다고 할지……"
2901-115 = "어쩌면, 이제는 정말 고려해봐야 할지도."
2901-116 = "고려하신다는 말씀은……?"
2901-117 = "새로운 부원 말이야."
2901-121 = "……! 새, 새로운……! 부, 부원 말인가요?!"
2901-123 = "으으음, 그게 말이야 물론 우리 인법연구부는 아직 정식 동아리가 아니지만……"
2901-124 = "그래서 부비도 나오질 않고, 부실도 제공되지가 않아서-"
2901-125 = "이런 식으로 몰래 백귀야행 구석탱이에 있는, 그 누구의 시선도 미치지 않는 구교사를 무단으로 점거하고 있을 뿐이지만……!"
2901-126 = "뿌, 뿐이지만……!"
2901-127 = "그래! 그렇다고 해서 그게 우리의 길을 가로막는 이유가 될 순 없어!"
2901-128 = "\"좀 더 닌자를 널리 알리고 싶어! 키보토스의 모두가 닌자의 멋짐을! 닌자가 얼마나 힙하고 쿨한지 알아줬으면 좋겠어!\""
2901-129 = "이제껏 그런 마음을 품고 우리 둘이서 <소녀인법첩 미치룻치> 채널을 운영해오기를 수개월이지만."
2901-130 = "그게 여기 봐봐. 구독자 성장세는 이미 팍 꺾여버렸지."
2901-131 = "슬슬 최근 올리는 영상에는 악플이 달리기 이전에 완전히 무플 상태지."
2901-132 = "그나마 최근에 댓글이 하나 달렸길래 엄청 기뻐하면서 확인해봤는데."
2901-133 = "여기, 이 댓글."
2901-134 = "\"재, 재미있어요! 최고예요!\" by O.C……"
2901-135 = "라니, 이거 츠쿠요가 달아준 거잖아……!"
2901-136 = "부, 부장님이 만드신 영상은, 저, 저, 정말로 재, 재미있으니까요오……"
2901-137 = "내, 내용은 잘 이해가 안 되지만……"
2901-138 = "그……. 죄, 죄송해요……"
2901-139 = "아니아니! 엄청 기쁘긴 한데 말이지. 엄청 기쁘지만. 역시 이것만으로는 안 돼!"
2901-140 = "이 암담한 상황을 극복하기 위해선, 역시 새로운 돌파구……"
2901-141 = "그래. 신규 부원이 필요한 거야!"
2901-142 = "과, 과연…… 그, 그럼 신규 부원분은 아무래도……."
2901-143 = "지, 진짜 니, 닌자 씨…… 같은 분이 찾아와주면, 조, 좋겠네요…… 에헤헷……."
2901-144 = "아니, 뭐. 진짜 닌자가 오지는 않겠지만……이라고 할까, 실제로 닌자가 있을 리 없겠지만."
2901-146 = "앗, 그, 그런 건가요……? 저, 니, 닌자에 대해 자, 잘 몰라서……"
2901-147 = "으음, 알고 모르고의 일인가?! 싶긴 하지만."
2901-148 = "아, 그치만 닌자가 단순히 가짜라든가, 그런 뜻은 아니야!"
2901-149 = "이 세상에 닌자는 실존하지 않을지언정 그 정신만큼은 진짜!"
2901-150 = "그러한 닌자의 마음을 가슴에 품고, 닌자의 정신을, 닌자의 멋지고 쿨한 모습을 본받아 살아가야 진정한 <닌자 메이트>라고 할 수 있을 테니까!"
2901-155 = "다만 그런 <닌자 메이트>를 주변에서 쉽게 찾을 수 있느냐가 문제인데……."
2901-156 = "닌자를 바보 취급하지 않고, 우리 이야기에 공감해주면서, 끝내 인법연구부를 함께 해줄 만한-"
2901-157 = "손발이 착착 맞으면서 척하면 척! 착하면 착-! 해줄 수 있는, 거기다 심지어 귀엽기까지 한 아이!"
2901-158 = "그런 애가 어디 없으려나~?"
2901-163 = "(………….)"
2901-164 = "앗, 죄, 죄송해요……! 저, 친구가 없어서……"
2901-165 = "그, 그……! 귀, 귀엽지도 않아서……!"
2901-166 = "아니아니아니, 신경 안 써도 돼! 그리고 츠쿠요는 귀여워!"
2901-167 = "가, 감사합니다……만, 아무래도, 저희는 정식 동아리도 아니니까……."
2901-168 = "그, 가, 가입하려는 분이, 과연 있을까요……?"
2901-169 = "우갸악! 느닷없이 날아오는 현실이 아파?!"
2901-170 = "죄, 죄, 죄송해요오오……!"
2901-171 = "아냐, 츠쿠요 말이 맞아. 당장 그것부터가 문제겠지……."
2901-175 = "……우냐앗. 그래, 뭐. 이렇게 축 늘어진 채로 떠들 때가 아니지!"
2901-176 = "우리가 누구야. 닌자에 대해 연구하며 탐구하고, 끝내 닌자를 널리 알리고자 하는 닌자 메이트 집단!"
2901-177 = "아니-! 여기까지 오면 이미 팬을 넘어, 이제는 닌자 그 자체라 해도 무방할 우리가 바로……!"
2901-182 = "모두가 입을 모아 부르길. 그 이름…… <인법연구부>!"
2901-183 = "어떤 역경이 있더라도 포기하지 않아!"
2901-184 = "노려라! 구독자 증가! 노려라! 부원 모집! 그리고 정식 동아리가 되는 것까지! 모두 힘내서 쟁취해줄 테다!"
2901-185 = "그 왜, <닌자 닌페로 씨>에 나오는 닌자의 철칙 중엔 그런 말도 있잖아?"
2901-186 = "<닌자란! 자고로 어떤 궁지에 몰리더라도, 어떠한 역경에 부딪히더라도 포기하지 않는 법!>이라고 말이지!"
2901-188 = "네, 네엣!"
2901-189 = "좋았어. 그럼 츠쿠요. 나는 내일 재촬영할 아이디어를 정리할 테니까, 츠쿠요는……"
2901-193 = "……히얏?!"
2901-194 = "엉……?"
2901-195 = "소, 소, 소, 손님……인가요오……?"
2901-196 = "엥? 이런 곳에 손님이라니, 그럴 리……가 있나?!"
2901-197 = "네……?"
2901-198 = "설마…. 설마, 혹시나……! 백화요란?! 아니면 음양부의 너구리들?!"
2901-199 = "기어코 우리가 구교사를 멋대로 점거하고 있단 걸 눈치채고 잡으러 왔다는 건가?!"
2901-200 = "네, 네, 네, 네에엣?!"
2901-201 = "크윽…… 아니, 언젠가 이런 날이 올 거라고 생각은 했지만……!"
2901-202 = "부, 부, 부, 부장니이임……! 그, 그, 그럼 어떡하죠오오?!"
2901-203 = "아냐! 츠쿠요! 당황할 거 없어! 호랑이에게 물려가도 정신만 바짝차리면"
2901-204 = "그, 뭐냐, 그게 어찌어찌 된다고 하니까!"
2901-205 = "그러면 엄청 무서울 거 같은데요오오!!"
2901-211 = "실례합니다-!"
2901-218 = "부, 부, 부장니이이임?!"
2901-219 = "우, 우와아악! 우린 절대로 여기서 안 나가! 인법연구부의 활동은 언제까지고 영원히-!"
2901-223 = "……?"
2901-224 = "……엥? 음양부도, 백화요란도, 아니야……?"
2901-225 = "저, 저기…… 누, 누, 누구¸ 세, 요, 요오……?"
2901-226 = "아! 소개가 늦었습니다! 저, 이즈나는 이즈나!"
2901-227 = "인법연구부에 입부하고 싶어서 찾아왔어요!"
2901-228 = "…………."
2901-232 = "……엥?"
