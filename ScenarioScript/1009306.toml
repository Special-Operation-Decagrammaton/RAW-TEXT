[translation]
1009306-1 = "키라라 on the 스트리트"
1009306-2 = "(키라라의 기쁜 연락을 받고 약속 장소로 향했다.)"
1009306-9 = "앗! 쌤! 여기야, 여기!"
1009306-10 = "약속시간 20분 전인데, 쌤은 성실하네!"
1009306-11 = "[s1] \"오래 기다렸어?\"\n[s2] \"키라라가 먼저 왔잖아?\""
1009306-14 = "아핫! 쌤이랑 놀러 가는 게 기대돼서 좀 일찍 와버렸지 뭐야!"
1009306-15 = "보충시험도 끝났겠다, 이제 걱정할 거 없으니까 마음 편하게 놀자구!"
1009306-16 = "평소 쌤이 자주 가는 가게라든가 있어?"
1009306-17 = "응? 업무가 바빠서 이 주변은 잘 모른다고?"
1009306-18 = "그럼 더 잘됐네!"
1009306-19 = "내가 평소에 자주 가는 가게들을 소개해 줄게. 쌤 취향에도 맞을지 몰라!"
1009306-20 = "자, 얼른얼른!"
1009306-23 = "특대 크레이프, 딸기랑 바나나 맛으로 주세요!"
1009306-24 = "두 개 말씀이시죠! 잠시만 기다려 주세요!"
1009306-29 = "여기, 완전 맛있다? 쌤도 한 입 먹자마자 반하고 말걸!"
1009306-30 = "딸기랑 바나나, 블루베리랑 생크림을 듬뿍 담아 주거든. 이 정도 퀄리티는 다른 곳에서 찾아보기 힘들어!"
1009306-31 = "여기 특대 크레이프 나왔습니다."
1009306-37 = "자! 여기 쌤 꺼!"
1009306-38 = "[ns] \"그럼 어디…….\""
1009306-41 = "어때? 어때?"
1009306-42 = "[s] \"응, 맛있는걸.\""
1009306-43 = "그치? 쌤이 좋아할 줄 알았다니까!"
1009306-44 = "자, 내 것도 먹어 봐! 나는 딸기 크레이프로 주문했거든!"
1009306-45 = "둘 다 맛보면 두 배로 즐길 수 있잖아?"
1009306-46 = "자, 아~"
1009306-47 = "응? 왜 그래? 물론 내가 먹던 거라 모양이 좀 이상하긴 하지만, 맛에는 문제가 없다구?"
1009306-48 = "[ns] 키라라가 내민 크레이프를 한 입 맛본다."
1009306-52 = "어때? 맛있지? 내 최애인 이유가 있다니까!"
1009306-56 = "아하핫! 쌤, 입가에 생크림 묻었잖아? 얼마나 맛있었으면 다 묻히면서 먹어?"
1009306-57 = "자, 이쪽 봐봐!"
1009306-58 = "[s] \"아, 스스로 닦을 수 있으니까. 일부러 닦아줄 필요까지는…….\""
1009306-59 = "안 돼, 안 돼. 나랑 같이 다니는 사람이 허술해 보이는 건 싫으니까!"
1009306-60 = "어디 보자, 어라, 냅킨이 없네."
1009306-61 = "우선 손으로……."
1009306-65 = "(할짝)"
1009306-66 = "[ns] \"?!?!\""
1009306-68 = "자, 그럼 다음 코스로 가자구!"
1009306-73 = "쌤, 이거 봐! 이 옷 완전 귀엽지 않아?"
1009306-74 = "어? 같은 티셔츠를 1+1으로 판다고……?"
1009306-76 = "어때, 쌤? 우리, 옷 맞춰서 입을까?"
1009306-105 = "후우, 벌써 시간이 이렇게 됐네."
1009306-106 = "쌤, 힘들지 않아?"
1009306-107 = "[s] \"사실 조금 전부터 체력의 한계가…….\""
1009306-108 = "앗! 미리 말하지 그랬어!"
1009306-109 = "미안, 나도 모르게 너무 신나서 돌아다녔나 봐……."
1009306-110 = "응? 나랑 돌아다니는 게 힘들어도 즐거웠다고?"
1009306-111 = "아하하, 그렇게 말해주면 고맙구!"
1009306-112 = "으음~ 이대로 돌아가는 건 아쉽고……"
1009306-113 = "쌤. 마지막으로 공원에 들렀다 가자!"
1009306-116 = "휴우, 나도 다리가 아픈걸."
1009306-117 = "다리가 아플 정도로 돌아다닌 건 되게 오랜만인 것 같아."
1009306-118 = "[s] \"키라라는 평소에도 친구들이랑 자주 놀러 다니지 않아?\""
1009306-119 = "응, 서너 명 이상으로 놀러 다녀. 복작복작하고 떠들썩한 편이 즐거우니까."
1009306-120 = "근데 오늘은 단둘인데도 평소보다 더 많이 걸은 것 같네……."
1009306-121 = "나도 모르게 신이 나 버렸을지도?"
1009306-122 = "[s] \"보충시험 합격해서 마음이 홀가분해진 탓이 아닐까?\""
1009306-123 = "확실히, 그런 것도 있긴 하겠지만 그보다는……."
1009306-127 = "옆에서 걷는 사람의 차이랄까……."
1009306-128 = "여, 역시 잘 모르겠네! 그럼 슬슬 일어날까!"
1009306-130 = "(이후, 키라라와 좀 더 걸은 뒤 샬레로 돌아왔다.)"
