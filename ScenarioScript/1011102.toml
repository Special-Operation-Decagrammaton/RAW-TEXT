[translation]
1011102-1 = "놀라운 평범함"
1011102-2 = "밀레니엄 자치구 공원"
1011102-5 = "[ns] \"안녕, 네루.\""
1011102-6 = "아, 선생."
1011102-7 = "온 줄도 모르고 있었네. 거의 졸 뻔했지 뭐야."
1011102-8 = "[s] \"교복 차림이네?\""
1011102-9 = "아, 이렇게 입고 둘이 만난 건 처음이었던가?"
1011102-10 = "뭐, 그렇게 됐어."
1011102-11 = "세미나의 회계가 행사 기간 동안만 교복을 입어 달라고 부탁했거든."
1011102-12 = "평소 같았으면 당연히 무시했겠다만……."
1011102-13 = "얼마나 중요한 행사인지 나야 잘 모르지만, 어찌나 애걸을 하던지 거절할 수가 있어야지."
1011102-14 = "으으음…… 사실 선생을 부른 것도 옷 때문."
1011102-15 = "스카잔이 없으니까 조금 허전해서 말야."
1011102-16 = "그래서…… 선생에게…… 조언을……."
1011102-17 = "……."
1011102-21 = "크아아아악!"
1011102-22 = "[s] \"포, 폭발?!\""
1011102-23 = "조금이 아니라, 많이 허전해!"
1011102-24 = "엄청 어색해! 완전 이상해! 발가벗겨진 느낌이야!"
1011102-25 = "어때? 선생이 보기에도 교복만 입는 건 역시 이상하지? 억지로라도 다시 입는 게 낫겠지?!"
1011102-26 = "[s] \"……평범하게 귀여운데.\""
1011102-27 = "뭐, 뭣?!"
1011102-28 = "장난치지 마! 난 진지하다고!"
1011102-29 = "[s] \"……평범하게 어울리는데.\""
1011102-30 = "그, 그럴 리가……?"
1011102-31 = "크흠, 아, 아무튼!"
1011102-32 = "먼저 연락한 건 그거 때문이니까."
1011102-33 = "뭐, 선생 눈에 엄청 이상하게 보이는 게 아니라면 됐어."
1011102-34 = "어쨌든 한시름 덜었네. 물론 귀엽다거나 어울린다거나 하는 생각은 안 들지만."
1011102-35 = "[s] \"걱정 마.\""
1011102-37 = "[ns] \"어떤 옷을 입든 네루는 네루잖아?\""
1011102-38 = "아앙? 그거야 당연하지!"
1011102-39 = "스카잔이 없어도, 지금 당장 불량배 한두 무리쯤은 쓸어버릴 수 있다고!"
1011102-40 = "응? 내가 원래대로 돌아온 것 같아 안심했다고?"
1011102-41 = "……크핫!"
1011102-42 = "역시 선생과 얘기하길 잘했네. 기분이 훨씬 나아졌어."
1011102-43 = "그럼 선생, 용무는 끝났지만 이렇게 헤어지긴 아쉬우니까, 같이 좀 앉지 않을래?"
1011102-48 = "자, 이쪽으로."
1011102-50 = "그러고 보니 오늘따라 학교가 조용한 것 같단 말이지."
1011102-51 = "행사 때문인 건지, 아니면 기분 탓인 건지……."
1011102-52 = "[s] \"평소랑 비슷한 것 같던데…….\""
1011102-53 = "아냐, 아냐. 확실히 분위기부터 다르다니깐."
1011102-54 = "아무래도 밀레니엄 전체에 내가 모르는 무슨 일이 생긴 모양이야."
1011102-55 = "아, 저기 또 온다. 가만히 잘 봐봐."
1011102-65 = "[ns] \"잘 모르겠는데…….\""
1011102-66 = "내가 아까부터 여기 벤치에 앉아 있었는데 말이지, 학생들이 내 앞을 그냥 스쳐 지나가더라니까."
1011102-67 = "앙? 그게 어쨌냐니, 그야 평소에는 날 보면 \"C&C의 부장이 어째서……?\" 라거나, \"눈 마주쳤는데 무서워……!\"라거나,"
1011102-68 = "그렇게 호들갑을 떤단 말이지."
1011102-69 = "[ns] (그것도 일단은 위장복일 텐데 의미 없구나…….)"
1011102-70 = "그런데 오늘은 그런 게 저언~혀 없었어."
1011102-71 = "물론 나야 딱히 주목받고 싶은 것도 아니고, 무슨 말을 하든 신경 안 쓰지만, 어째 평소랑 다르니까 어딘가 이상한 기분이 든단 말야."
1011102-72 = "중요한 일이 있는데 나만 모르고 있는 듯한……."
1011102-73 = "으으, 젠장! 이것도 스카잔이 없어서 마음이 싱숭생숭한 탓인가?"
1011102-74 = "[s3] \"워, 워, 진정, 진정.\"\n[s4] \"우선 흥분을 가라앉히고…….\""
1011102-77 = "후우……."
1011102-78 = "선생은 뭐 짚이는 거 없어? 아무리 생각해도 이상한데."
1011102-79 = "[s] \"글쎄…….\""
1011102-86 = "어이쿠 이런, 우리 아지트에 손님이 있었잖아?"
1011102-90 = "키키킥, 이 공원은 우리 구역이라고. 벤치에 앉으려면 대가를 치러야지?"
1011102-91 = "어디, 일단 사거리 포장마차에서 사 먹을 크레이프 값 정도만 받아 볼까?"
1011102-92 = "……?"
1011102-93 = "그거, 방금 나한테 한 소리냐?"
1011102-94 = "그럼 여기 너 말고 누가 있—"
1011102-99 = "어라? 넌……."
1011102-100 = "음? 어디서 많이 본 얼굴……이 아니라, 미카모 네루잖아!"
1011102-104 = "너, 기억에 있는데? 전에도 나한테 혼난 적 있지 않냐?"
1011102-105 = "모, 몰랐어! 어째서 스카잔이 없는 거야!"
1011102-106 = "이건 반칙이잖아! 함정이잖아! 너무해!"
1011102-107 = "최소한 보고 도망갈 수 있게 스카잔을 입어달란 말야!"
1011102-108 = "오늘은 사정이 있어서 말이지."
1011102-109 = "그건 그거고, 전에 만났을 때 내가 뭐라고 했는지 혹시 기억하냐?"
1011102-110 = "히익?!"
1011102-111 = "또 나쁜 짓 하면 쥐어터진댔지?"
1011102-123 = "으으으……."
1011102-124 = "다, 다음에 두고 보자!"
1011102-131 = "[ns] \"수, 순식간에…….\""
1011102-132 = "덤빈 용기가 가상해서 봐줬다. 크하핫!"
1011102-133 = "나한테 상납금을 받으려 하다니, 꽤 신선한 경험이었어."
1011102-134 = "[s] \"네루를 못 알아본 것 같았지?\""
1011102-135 = "하긴 그런가? 나인 줄 알았다면 방금처럼 다가올 리가 없나……."
1011102-136 = "못 알아본 건……."
1011102-137 = "[s] \"스카잔 때문?\""
1011102-138 = "확실히, 스카잔은 화려해서 멀리서도 알아보기 쉽고……."
1011102-139 = "잠깐, 그러면 학교 분위기가 다르게 느껴졌던 것도, 다른 녀석들한테 무슨 일이 있는 게 아니라……."
1011102-140 = "다들 나인 줄 몰랐다는 거네?"
1011102-141 = "[s] \"그렇겠지…….\""
1011102-142 = "아무도 나를 못 알아봤다…… 그건……."
1011102-146 = "나쁘지 않을지도?"
1011102-147 = "신기한 감각이란 말이지? 지금까지 이런 적은 없었으니까."
1011102-148 = "방금처럼 신선한 경험도 하고 말야. 크하핫!"
1011102-149 = "[s] \"마, 마음에 드는 거야?\""
1011102-150 = "뭐, 어느 쪽이냐고 하면 당연히 스카잔이 있는 편이 좋겠지만……."
1011102-151 = "그래도 조금 신이 나기 시작했다고!"
1011102-152 = "아, 그렇지!"
1011102-153 = "나, 이 차림으로 학교에 가면 어떨까? 다들 날 못 알아볼까?"
1011102-158 = "궁금해졌어! 같이 가 보자고, 선생! 얼른!"
1011102-160 = "(이후, 들뜬 네루와 함께 밀레니엄 학원 여기저기를 돌아다녔다.)"
