[translation]
52080-1 = "제8화;악몽"
52080-7 = "……내가 기억하는 아야메는 한낮의 햇살처럼 밝고 따듯한 인상의 아이였다."
52080-8 = "무슨 부탁을 하더라도 거절하는 법이 없고, 해결하지 못하는 일이 없는 우수한 백화요란의 부장."
52080-9 = "아야메의 망설임 없는 미소를 보고 있노라면, 무엇을 맡기더라도 안심할 수 있을 것만 같았다."
52080-13 = "이번 가을 축제에 필요한 음식을 만드는 데 일손이 부족하다고? 괜찮다면 내가 도와줄게. 혼자 살아서 요리에는 익숙하거든."
52080-17 = "신목 전망대 앞에서 망량즈 몇이 소란을 피우고 있다고……? 곤란한 아이들이네. 금방 다녀올 테니 잠시 여기서 기다려 줄래?"
52080-22 = "어머, 축제 인파 속에서 부모님과 헤어진 거니? 울지 마. 언니가 곧 부모님을 찾아올 테니 여기서 기다리고 있을래?"
52080-28 = "모두가 문제가 생기면 아야메를 찾았고, 모두 아야메에게 많은 부분을 의지했다."
52080-29 = "간혹 무리한 부탁을 받더라도 아야메는 미소를 잃는 법이 없었다."
52080-33 = "아야메 부장님! 오늘 대련도 잘 부탁드립니다!"
52080-39 = "아야메 선배, 이번 축제의 슬로건은 무엇으로 하는 게 좋을까요?"
52080-40 = "아야메 쨩. 미안한데 이번 주 주말의 야간 아르바이트를 도와줄 수 없을까? 원래 오기로 한 학생이 갑자기 아프다고 해서……"
52080-46 = "응, 걱정 마! 내가 맡아서 해결해 줄 테니."
52080-49 = "그에 비해 나는…… 아야메의 곁에서 그녀의 발걸음을 쫓아가기에도 벅찼다."
52080-50 = "조금만 어려운 난관에 부딪히더라도 울음을 터트리기 일쑤. 아야메와의 대련에서는 단 한 번도 이긴 적이 없었다."
52080-51 = "그런 아야메의 모습을 보며 나는 입 밖으로 뱉지 못한 혼잣말을 되뇌이며 자괴감에 젖을 뿐이었다."
52080-56 = "아야메가 없으면 나는 아무것도 못 해. 할 수 있을 리가 없어."
52080-57 = "나는 아야메가 아니니까."
52080-58 = "백화요란의 부장으로서 자격을 가진 건 아야메 뿐이니까."
52080-61 = "하지만 아야메는 그런 내 마음을 읽기라도 한 듯, 언제나 명랑하고 환한 미소를 지으며 내게 손을 내밀어 주었다."
52080-70 = "괜찮아, 나구사."
52080-71 = "왜냐하면 나는 너를—"
52080-79 = "[log=아야메]단 한 번도 친구라고 생각한 적이 없었으니까.[/log]"
52080-83 = "………윽!"
52080-88 = "하아, 하아…… 또 꿈이었나."
52080-89 = "어째서 나는 계속 이런 악몽을……"
52080-94 = "어라, 벌써 일어나 버린 건가요, 나구사 쨩?"
52080-95 = "아무래도 낯선 잠자리가 익숙지 않았던 모양이네요."
52080-103 = "……야부키 슈로."
52080-104 = "네, 또 저랍니다."
52080-105 = "여기서 당신과 또 뵙게 되다니, 정말 옛 이야기 속에서나 나올 법한 기연이라 할 수 있겠네요."
52080-106 = "……아니, 당신이 이곳에 직접 찾아온 이상 필연이라고 할 수 있겠지요."
52080-111 = "무슨 생각으로 겁도 없이 이매망량이 날뛰는 이 북쪽의 땅까지 찾아온 건가요?"
52080-112 = "이제 와서 예전에 버리고 간 옛 친우가 떠오르기라도 하신 건가요?"
52080-113 = "그건 내가 할 말이야, 슈로."
52080-114 = "여기서 무슨 흉계를 꾸미고 있었던 거지? 에비스 분교에 출몰한다는 백물어는 역시 네 소행이었던 건가?"
52080-115 = "글쎄요~? 반전이 중요한 괴담에서 스포일러는 금기니, 지금 당장은 말해드릴 수 없지만……"
52080-116 = "우선 당신에게 옛 빚이라도 갚을 겸 깨어날 수 없는 악몽을 선사할 작정이었지만, 이제 와서는 아무래도 상관없는 일이 되었네요."
52080-117 = "그 악몽을 현실로 만들어 드릴 테니까."
52080-139 = "아하하! 역시 그때 <백련>의 힘을 사용했던 건 우연이 아니었던 모양이네요."
52080-140 = "설마 아직도 당신이 아야메 쨩을 대신하여 백화요란의 부장 역할을 해낼 수 있다고 믿고 있는 건 아니겠지요, 나구사 쨩~?"
52080-141 = "할 수 있는지 없는지는 중요하지 않아."
52080-142 = "모두를 지키기 위해서라면 해내야만 해.#n……최소한 그 연기라도 해낼 테니까."
52080-146 = "그것 참 모범적인 마음가짐이네요. 박수라도 쳐 드릴까요?"
52080-147 = "하지만…… 당신이 아무리 강해진다 하더라도, 머리가 셋이 되고 팔이 여섯이 되는 건 아니잖아요?"
52080-148 = "끊임없이 몰려드는 공포 앞에서 당신이 얼마나 버틸 수 있는지 궁금하네요."
52080-159 = "자, 다시 한번 새로운 이야기의 서장을 시작하죠."
