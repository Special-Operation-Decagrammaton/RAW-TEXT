[translation]
33160-1 = "제16화;편린들"
33160-6 = "아즈사……."
33160-7 = "당신은 목숨처럼 소중히 여기는 선물을…… 살해 도구로 써버렸군요."
33160-8 = "그것은 원래 저의 헤일로를 파괴하기 위해 준비된 폭탄."
33160-9 = "당신은 그때 사용하지 않았던 그 폭탄을 아직 가지고 있었던 거군요……."
33160-12 = "큭, 쿨럭…… 쿨럭……. 으, 으으……."
33160-13 = "고, 공주님--!?"
33160-14 = "공주님-!!!!"
33160-15 = "……."
33160-16 = "하지만 사오리는 죽지 않았습니다. 크게 다쳤지만, 죽진 않았어요."
33160-17 = "왜냐하면 아츠코가 사오리를 감싸고 대신 폭탄을……."
33160-18 = "공주님-!!!! 안 돼, 아츠코! 정신 차려!!"
33160-19 = "아츠코는…… 저 공주님이라는 아이는……."
33160-20 = "사오리에게 중요한 사람이었나 보네요."
33160-22 = "……."
33160-23 = "로열블러드의 힘이 약해졌군……. 죽은 건가?"
33160-24 = "내 실험에 차질이 생기는 것은 곤란하다. 아직 이 <모든 성인의 통공>은 준비되지 않았어……."
33160-25 = "……."
33160-26 = "아아. 아닌가……."
33160-27 = "그렇군. 그녀가 이미 대비해두고 있었나 보군……. 그렇지. 그 귀한 로열블러드인데……."
33160-28 = "……그럼 됐다. 시간을 좀 더 낭비하게 됐지만, 같은 동지로서 그 정도는 감안해주지."
33160-33 = "실험을 계속한다."
33160-35 = "……사…… 오……."
33160-36 = "공주님! 괜찮아?"
33160-37 = "……. (끄덕)"
33160-38 = "아아……. 다행이야. 공주님……."
33160-43 = "……. 용서 못 해."
33160-44 = "아즈사…… 감히 공주님을 다치게 하다니……."
33160-45 = "절대 용서 못 해!! 아즈사!!"
33160-47 = "그렇군요……. 아츠코는 죽지 않았습니다."
33160-48 = "저 폭탄…… 확실히 저였다면 틀림없이 헤일로가 부서졌을 겁니다."
33160-49 = "근처에서 간접적으로 영향을 받은 사오리조차도 저렇게 될 정도인데……."
33160-50 = "저 아츠코라는 아이의 헤일로는…… 누군가에게 보호받고 있는 것 같군요."
33160-51 = "……."
33160-52 = "……이제 아리우스 스쿼드의 계획은 차질이 생길 수밖에 없겠죠."
33160-53 = "원래의 트리니티 습격은 미뤄지고, 성도회의 힘은 약해졌습니다."
33160-54 = "고성당에서의 전투는 소강상태로 접어들었고……."
33160-55 = "두 학원은 서로 물러나서 대치 상태에 들어가, 마침내 부상자들의 수색과 후송을 할 수 있게 되었습니다."
33160-56 = "아즈사…… 이걸로 당신의 절망이 조금 줄어들어도 괜찮지 않을까요……?"
33160-58 = "부상자 발견! 수송합니다!!"
33160-59 = "이쪽! 이쪽이에요! 들것을 가져와 주세요!"
33160-60 = "저쪽에! 부상자가!"
33160-62 = "부장님! 호수로 떨어진 비행선에서 만마전 의원들을 다수 구출했습니다! 마코토 의장도 포함됐다고 합니다!"
33160-63 = "역시 의장이군요. 언제나 운이 좋네요. 설마 호수로 떨어질 줄은……."
33160-64 = "전원 수송합니다. 나머지 의원들도 곧 찾을 수 있겠네요. 찾으면 전원 강제로 중환자실에 집어넣으세요."
33160-65 = "네!"
33160-66 = "선도부 쪽은요?"
33160-67 = "현재 선임행정관 아코 씨가 수습 중입니다. 선도부장은 현재 중상, 의식불명이라고 합니다."
33160-68 = "……."
33160-69 = "이 에덴조약을 가장 기다렸던 게 선도부장이었을 텐데……."
33160-70 = "네?"
33160-71 = "……아무것도 아닙니다. 계속 부상자들을 구출하세요."
33160-75 = "……"
33160-76 = "비가 올지도 모르겠네요……. 서두르세요."
33160-79 = "정의실현부 부장 츠루기 중상! 부부장 하스미 중태!"
33160-80 = "사쿠라코 님도 중태입니다! 지금 구호기사단의 구호실은 병실이 꽉 차서, 고서관에서 제공하는 침실까지 후송 중입니다!"
33160-85 = "아, 아아…… 사쿠라코 님……."
33160-86 = "나기사 씨는요?"
33160-87 = "나기사 님은 아, 아직 수색 중입니다!"
33160-88 = "……."
33160-89 = "긴급 사항입니다! 티파티가 곧 게헨나 학원에 선전포고를 한다고 합니다!!"
33160-91 = "네?!"
33160-92 = "……. 안 돼요, 지금 여기서 그렇게 되어버린다면……."
33160-96 = "긴급 속보입니다!! 지금 정의실현부가 대성당으로 진입을 시도하고 있습니다! 이를 막던 시스터들과 중앙 홀에서 충돌했다는 소식입니다!"
33160-97 = "네?! 뭐라고요?!"
33160-101 = "티파티 내부에선 벌써 대혼란이 벌어지고 있는 건가요……."
33160-102 = "지금 이러고 있을 때가 아니에요…… 전투를 중지하고 사람들을 구하는데 집중하지 않으면……."
33160-105 = "(이런 상황에서…… 저는 대체 어떻게 해야…….)"
33160-106 = "(세이아 쨩……)"
33160-108 = "(선생님……. 저는…….)"
33160-110 = "게헨나 임시 구호소"
33160-111 = "무슨 소리예요! 부장님이 사라졌다니!"
33160-112 = "그, 그게…… 조금 전까지만 해도 여기 누워있었는데……."
33160-113 = "당장 찾아내세요! 그 상처로 어딜 가겠다는 거예요! 지금 당장!!"
33160-114 = "네, 넵!"
33160-119 = "부장님……."
33160-121 = "……선도부장은. 모습을 감춰버렸습니다."
33160-122 = "지금까지도 겨우 힘겹게 버텨왔던 그녀의 마음은…… 결국 꺾여버린 걸까요……?"
33160-124 = "티파티 행정실"
33160-125 = "선전포고문은요!"
33160-126 = "지금 준비되었습니다!"
33160-127 = "좋습니다, 그렇다면 지금 바로……!"
33160-131 = "기, 기다려주세요! 여러분!"
33160-132 = "당신은……. 우라와 하나코……? 어떻게 여기에……?!"
33160-133 = "선전포고는 호스트가 없이는 교칙 상 성립될 수 없어요!"
33160-134 = "……."
33160-135 = "게다가 이미 확보된 영상을 보셨을 겁니다! 이건, 게헨나가 아니에요!"
33160-136 = "자세히 설명할 수는 없지만…… 저건 아리우스가 조종하는 <다른 무언가>예요!"
33160-137 = "트리니티 자치구 곳곳에 있는 유적과 그 지하에 연결된 카타콤을 통해서 자유롭게 침투할 수 있었……."
33160-139 = "……. 하나코 씨를 체포하세요."
33160-145 = "?!"
33160-147 = "우라와 하나코…… 결국 시스터후드의 편에 선 건가요."
33160-148 = "……네!?"
33160-149 = "영상은 우리도 확인했습니다. 저 정체불명의 집단은 <유스티나 성도회>."
33160-150 = "저들이 시스터후드와 관계가 있다는 것 정도는 알고 있죠. 그래서 대성당을 제압하려고 했던 겁니다."
33160-151 = "탐정 놀이는 이제 됐습니다. 하나코 씨."
33160-152 = "……!!"
33160-153 = "순항 미사일의 발사 위치도 확인했습니다. 분명, 시스터들의 관리하에 놓여있는 성당 유적이었습니다."
33160-154 = "아리우스가 그 아래에 있는 카타콤을 통해 마음대로 우리 자치구로 침투했다…… 그럴 수도 있겠죠."
33160-155 = "하지만 애초에 아리우스와 시스터후드가 처음부터 같은 편이었다면?"
33160-156 = "……!!"
33160-157 = "정체를 숨긴 신비주의 집단이니 그 정도 정보 조작은 어려운 일은 아니었겠죠."
33160-158 = "그래서 저희 파테르 분파는 이 무자비한 사태에 강하게 대응하기로 결정했습니다."
33160-159 = "설마…… 티파티는……. 이미……."
33160-160 = "네. 저희의 결정에 반대하거나 유보적이었던 필리우스와 상투스 분파는 이미 신병을 구속해둔 상태입니다."
33160-161 = "쿠데타……!"
33160-162 = "아뇨. 아닙니다. 우리에겐 아직 티파티가 한 분 계시잖아요."
33160-163 = "……?!!"
33160-167 = "파테르 분파의 수장이자 티파티의 멤버이신 미카 님."
33160-168 = "그분을 석방하고 그분이 원하시는 대로 게헨나와의 전면전을 시작할 겁니다."
33160-169 = "……!!!"
33160-172 = "……."
33160-173 = "미카 님. 이쪽으로 나와주십시오."
33160-174 = "……흐응."
33160-179 = "아즈사…… 당신은 이제 어떻게 할 거죠?"
33160-180 = "당신의 각오로 사람들을 구할 수 있었지만, 체결된 계율을 취소시켜 <성도회>를 없애는 것에는 실패했습니다."
33160-181 = "게헨나의 히나는 숨어버렸고, 트리니티의 하나코는 체포되었습니다."
33160-182 = "그리고 이제 그 미카가 석방되어버렸군요."
33160-183 = "이런 결말을…… 이런 이야기를 보여주고 싶었던 건가요……."
33160-184 = "결국 무의미하고, 헛된 꿈 같은 이야기를……."
33160-185 = "아직이야."
33160-186 = "아즈사……?"
33160-188 = "아직 좌절하고 있을 때가 아니야. 아즈사."
33160-189 = "움직여야 해. 생각해, 방법을 찾아. 좌절하고 슬퍼할 시간에 방법을 찾아 내."
33160-190 = "다음 계획은…… 다음 목표는……. 다음은……."
33160-195 = "멈추지 마……. 움직여야 해……. 방법을……."
33160-196 = "<성도회>가 사라지지 않았어……. 사오리도, 아츠코도…… 무사해……. 다행이야……. 아니, 그치만……. 그러니까……."
33160-197 = "움직여야 해……. 사오리를 막기 위해선……."
33160-198 = "가야 해……."
33160-206 = "……아즈사. 당신은 아직도……? 아직도 싸우려는 건가요?"
33160-207 = "모든 것이 헛될지라도……. 아직도 당신은……."
33160-208 = "어째서 그렇게……."
33160-210 = "저쪽에 폭력 사태야! 누가 가줘!"
33160-211 = "제5 교사 쪽에 소요 발생! 어떻게 하죠?"
33160-213 = "……으, 으으."
33160-214 = "나, 나는……."
33160-215 = "응? 너는 보충수업부 아니었어? 여기 왜 있는 거야? 아직 복귀하면 안 되는 거 아냐?"
33160-216 = "으, 응? 그, 그게……."
33160-217 = "별로 할 일이 없으면 유폐실 쪽으로 가서 대기하고 있어. 그쪽에 집합이 있는 거 같던데."
33160-221 = "으, 으으……. 나, 나는……."
33160-223 = "사, 사오리 씨……."
33160-224 = "리더……."
33160-226 = "전원! 지금 당장 트리니티로 공격을 준비한다……."
33160-227 = "……시간이 조금 필요해."
33160-228 = "공주님이 다쳐서……. <성도회>의 현현에 문제가 생겼어요……."
33160-229 = "……그 고성당으로 돌아가서 계율을 갱신해야 해."
33160-230 = "……."
33160-231 = "……알겠어. <고성당>이다. 거기서 <성도회>의 계율을 수복한다."
33160-232 = "지금 출발한다."
33160-233 = "……."
33160-234 = "지금 당장!!"
33160-236 = "미카 님. 이쪽으로."
33160-237 = "미카 님!!"
33160-238 = "이제 자유입니다! 부디."
33160-242 = "……흐응."
33160-243 = "이거 뭔지 알 것 같아. 그러니까, 내 팬들인 거지? 이렇게 수십 명씩 우르르 몰려와선, 사인이라도 해줄까?"
33160-244 = "아, 아뇨. 이미 보셨겠지만, 트리니티는 지금……."
33160-246 = "응, 알고 있어. 선전포고를 하겠다는 거잖아? 게헨나랑? 아하하하- 엄청 웃기겠네."
33160-247 = "네! 지금이야말로 게헨나 녀석들을 지도에서 지워버릴 기회입니다!!"
33160-248 = "당신이 원하셨던……. 게헨나와의 전면전을……."
33160-249 = "지금 당장 트리니티 전역에 전투 준비 명령을……!"
33160-250 = "아하하하하하."
33160-251 = "응. 맞아. 난 게헨나가 너무너무 싫어. 다들 기억력도 좋네? 아하하하."
33160-252 = "그래서 이렇게 마치 대운동회에서 난동 부리는 머리 텅 빈 관중들 같은 얼굴로 날 찾아온 거구나?"
33160-253 = "……네?"
33160-254 = "우르르 떼거리로 몰려와서, 자기들 대신 화내 달라, 미워해 달라…… 그렇게 아우성치는 게 엄청 웃겨서 말야, 아하하……. ……응, 그런 느낌 알겠어?"
33160-255 = "미, 미카 님! 말씀이 너무 심한……."
33160-256 = "아하하. 응? 그랬어? 미안."
33160-257 = "맞아. 나는 게헨나가 너무 싫어. 기회가 된다면 반드시 밟아버려야 한다고 생각해."
33160-258 = "그런데 어떡하지? 지금은 내가 별로 그럴 기분이 아니라서 말야. 그러니 그만 돌아가. 시간 낭비하지 말고."
33160-259 = "기, 기분……?"
33160-260 = "기분이라뇨…… 지금이 얼마나 중요한 시기인데, 고작……."
33160-261 = "고작……? 아니 아니, 사실 그게 전부잖아?"
33160-262 = "게헨나가 싫은 건 그냥 그런 거야. 딱히 이유도 목적도 없으니까."
33160-263 = "그러니까 헛수고하지 말고 그만 돌아가 줘. 지금 그럴 기분도 아니고 슬슬 귀찮아지고 있거든?"
33160-264 = "자기들 대신 증오해 줄 사람을 찾아다니는 멍청한 여자들이랑 같이 있는 게 말야."
33160-265 = "……뭐?"
33160-266 = "어라? 못 들었어? 다시 말해줄까?"
33160-267 = "이, ……누가 멍청하다고!"
33160-272 = "크읏……?"
33160-273 = "세상 물정 모르는 아가씨 주제에! 감옥에서 빼내 줬더니!! 주제 파악을 못 하고!"
33160-277 = "이봐? 잠깐만? 난 비무장인데……."
33160-283 = "아, 아파……."
33160-287 = "주제 파악을 해라! 이제 티파티에서 해임될 처지면서!"
33160-291 = "기껏 감옥에 갇힌 걸 구해줬더니!!"
33160-300 = "……."
