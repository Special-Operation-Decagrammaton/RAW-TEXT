[translation]
1012203-1 = "그때를 이어서"
1012203-4 = "아핫, 선생님~! 안녕!"
1012203-5 = "정말 멍때리고 있네. 아하하."
1012203-6 = "[s1] \"모처럼 바다에 왔으니까.\"\n[s2] \"이런 시간도 귀중하다구.\""
1012203-9 = "그러네~ 햇볕도 그리 따갑지 않고."
1012203-10 = "후후, 선생님은 바다 좋아해?"
1012203-11 = "[s3] \"좋지. 탁 트인 시야라든가.\"\n[s4] \"바다의 냄새라든지.\""
1012203-12 = "앗, 나도!"
1012203-13 = "바다만이 주는 그 특유의 개방감이 있지~"
1012203-14 = "시야가 확 넓어지니까, 마음도 넓어지는 느낌? 아하하!"
1012203-15 = "앗, 나도!"
1012203-16 = "바다 특유의 그 냄새가 있지~"
1012203-17 = "짜고 비리지만, 싫지 않은……"
1012203-18 = "그리고 파도가 왔다 갔다 하는 것도 재밌어!"
1012203-19 = "이렇~ 게~"
1012203-24 = "아하하, 이렇게 파도 사이에 서 있으니까 뭔가 이상한 느낌이야."
1012203-25 = "물결이 다시 바다 쪽으로 흘러갈 때, 뭐랄까. 빨려 들어갈 것 같아."
1012203-26 = "실제로 사고도 많이 일어나니까 조심해야 한다고?"
1012203-27 = "응! 걱정하지 않아도 돼, 선생님!"
1012203-28 = "나 수영도 꽤 연습했으니까."
1012203-32 = "[ns] \"그러고 보니……\""
1012203-34 = "[ns] \"예전에 수영 수업을 하다 말았었지?\""
1012203-35 = "아…… 맞아."
1012203-36 = "그때 경비원분에게 들키는 바람에 도망쳤었지."
1012203-41 = "후후, 재미있었지. 도망치는 선생님 엄청 빨랐어."
1012203-42 = "[s] \"퇴근이었다구!\""
1012203-43 = "아하하. 응, 그렇지."
1012203-44 = "나, 그 뒤로 수업 열심히 받았어. 선생님과 함께 수선한 수영복이 있었으니까."
1012203-45 = "그 덕분인지 성적도 꽤 잘 나왔다? 수영에 조금 자신감이 생길 정도로!"
1012203-49 = "사실, 이번에도 그 수영복을 입고 올까 했었는데."
1012203-50 = "[s] \"프라이빗 비치에?\""
1012203-51 = "응! 장소에는 안 어울리겠지만, 내가 입고 싶었거든."
1012203-52 = "무엇보다 선생님과의 추억이 깃든 소중한 수영복이고."
1012203-53 = "그렇지만 아무래도 수선한 부분들이 고스란히 드러나니까."
1012203-54 = "친구들이 보면 이런저런 이야기를 할까 봐서."
1012203-55 = "[ns] \"아……\""
1012203-56 = "친구들은 잘 모르는 일이니까, 괜히 과거의 일 때문에 걱정 끼치게 만드는 것도 싫고."
1012203-57 = "이미 지나간 일이고……"
1012203-61 = "아, 그건 아닌가. 음, 음."
1012203-62 = "아무튼~!!"
1012203-63 = "아쉽지만 새 수영복을 입었다는 결말! 아하하☆"
1012203-64 = "하지만 이것도 꽤 잘 어울리지?"
1012203-65 = "어때? 귀여워?"
1012203-66 = "[s] \"응. 귀여워, 미카.\""
1012203-71 = "……우와."
1012203-72 = "직구로 받아칠 줄은 몰랐는데……"
1012203-73 = "……우웃!!"
1012203-78 = "선생님, 그런 말 하고도 부끄럽지 않은 거야?!"
1012203-79 = "[s5] \"왠지 기시감이……\"\n[s6] \"파도에 휩쓸리지 않게 조심해, 미카!\""
1012203-82 = "아, 이쪽 수심 엄청 얕아서 괜찮을 것 같아! 이거 봐! 무릎까지밖에 안 와."
1012203-83 = "선생님도 들어올래? 후후."
1012203-89 = "[ns] \"그러고 보니, 그때 수업 끝이라는 말은 안 했었지.\""
1012203-92 = "응……"
1012203-93 = "자, 그럼."
1012203-98 = "수영 수업…… 이어서 해주세요, 선생님."
1012203-100 = "(그렇게 미카와 한참 동안 얕은 물가에서 물놀이를 했다.)"
