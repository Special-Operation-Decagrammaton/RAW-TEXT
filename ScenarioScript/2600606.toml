[translation]
2600606-1 = "유성우와 소원"
2600606-2 = "심야의 샬레 건물 입구"
2600606-3 = "기다리고 있었어요, 선생님!"
2600606-4 = "오늘이 너무 기대되어서 잠을 설치는 바람에…… #n하마터면 늦잠을 잘 뻔했지 뭐예요."
2600606-5 = "그래도 이렇게 무사히 유성우를 볼 수 있게 되어서 얼마나 다행인지 몰라요."
2600606-6 = "자, 늦기 전에 빨리 옥상으로 올라가요!"
2600606-8 = "심야의 샬레 건물 옥상"
2600606-9 = "후우, 아직 시작되지는 않은 모양이네요."
2600606-10 = "춥지는 않으신가요, 선생님?"
2600606-11 = "이 무렵의 밤은 제법 쌀쌀하니 옷을 단단히 챙겨 입으시는 게 좋아요."
2600606-12 = "후후, 차라도 한 잔 따라드릴까요?"
2600606-13 = "[s] \"고마워.\""
2600606-18 = "어쩐지… 이렇게 한밤중에 단둘만 있으려니 조금 부끄럽네요."
2600606-19 = "모처럼 가져온 천체망원경도 유성우를 관측할 때는 필요가 없을 테고……"
2600606-20 = "무, 무슨 이야기를 하며 시간을 보내면 좋을까요……?"
2600606-21 = "[s] \"노도카, 하늘을 봐.\""
2600606-22 = "……네?"
2600606-26 = "― 어머나, [wa:500]별똥별이에요! [wa:2100]앗…… [wa:550]저기도! [wa:1550]또 저기도……!"
2600606-29 = "― 하늘에 별똥별이 가득해요! [wa:3500]정말[wa:800] 유성이[wa:500] 비처럼 내리네요!"
2600606-31 = "― 이렇게 아름다운 광경을 직접 눈으로 볼 수 있다니…… [wa:3120]정말[wa:1300] 꿈만 같아요."
2600606-34 = "― 소원이요? [wa:4500]아니…… [wa:1300]오늘은[wa:650] 괜찮아요."
2600606-37 = "― 좋아하는 사람과 [wa:2000]아름다운 광경을 함께 지켜볼 수 있는데,"
2600606-39 = "― 여기서 더한 소원을 빌면[wa:1450] 어쩐지[wa:820] 별님에게 혼이 날 것 같아서……"
2600606-42 = "― 오늘은[wa:950] 이것으로[wa:800] 만족할래요."
2600606-45 = "그런데 왜 유성에게 소원을 빌면 이루어진다는 이야기가 생겨난 걸까요?"
2600606-46 = "분명 아름답기는 하지만, 사람의 소원과는 상관이 없는 천체 현상일 텐데……"
2600606-47 = "선생님은 어떻게 생각하세요?"
2600606-48 = "(대답이 없다. 잠이 든 것 같다.)"
2600606-49 = "아앗, 여기서 잠드시면 안 돼요!"
2600606-50 = "정말~ 선생님~!"
2600606-52 = "그리고 유성우가 그칠 때까지 노도카와 함께 밤하늘을 지켜보았다."
