[translation]
10018015-8 = "두, 두고 보자. 너희들!"
10018015-9 = "우리 '구르메 헬멧단'을 건드린 대가는 톡톡히 치르게 해 줄 테니까!"
10018015-15 = "품위라고는 눈을 씻고 찾으려 해도 찾을 수 없는 분들이었군요."
10018015-19 = "그러면 다시 원래의 목적을 달성하러 가 볼까요?"
10018015-24 = "마음은 감사드립니다만, 역시 이 가게를 계속하는 것은,"
10018015-25 = "무리라고 밖에 말씀드릴 수가 없겠네요."
10018015-26 = "[s] \"조금 더 자세한 사정을 듣고 싶습니다만.\""
10018015-27 = "음…… 어떻게 해야 할지."
10018015-28 = "그래요…… 어차피 곧 문을 닫을 가게이니……"
10018015-32 = "이미 익히 보아 오셨겠지만, 이 상가 거리도 점점,"
10018015-33 = "프랜차이즈 상회들로 가득 차고 있답니다."
10018015-35 = "(크게 보자면 획일화된 맛을 대가로 값싼 식품이 널리 공급되는 현상……)"
10018015-36 = "(미식의 길을 걷는 입장으로서는 가슴 아픈 일이지요……)"
10018015-38 = "그 프랜차이즈 상회들과 가격 경쟁을 한다는 것이,"
10018015-39 = "아무래도 쉬운 일이 아닌 데다……"
10018015-40 = "최근 설상가상으로 더 큰일이 생겨 버렸다고나 할까요."
10018015-41 = "그 큰일이라는 것은, 뭔가요?"
10018015-42 = "저희 가게는 '냐오푸드'라는 식품회사에서 식자재를 공급받고 있습니다."
10018015-43 = "저희 가게도, 프랜차이즈 상회들도 전부 냐오푸드의 유통망에 손을 빌리고 있지요."
10018015-44 = "그런데 냐오푸드 쪽에서 최근…… 공급가를 갑작스럽게 인상해 버려서……"
10018015-50 = "자, 잠깐!"
10018015-51 = "그러면 프랜차이즈 상회들도 가격을 올릴 수밖에 없는 거 아냐?"
10018015-52 = "과연 그렇겠네요. 공급처가 똑같다면 가격 인상도 똑같이 진행될 수밖에 없을 테니까요."
10018015-53 = "으응~ 잘 모르겠지만, 물가 상승이란 거지?"
10018015-55 = "하지만 프랜차이즈 상회들은 모두 또 냐오푸드 소속이기도 해서요."
10018015-56 = "식자재 물가 상승분만큼 임대료를 인하해 준다던가 하는 식으로,"
10018015-57 = "가격 조정을 해 주고 있답니다."
10018015-58 = "뭐야, 그게! 너무하잖아!"
10018015-59 = "영세 가게는 어떻게 경쟁하라고!"
10018015-60 = "……그건 바꿔 말해, 주인분 역시 냐오푸드 프랜차이즈로 들어오라는 뜻이 아닌지?"
10018015-61 = "그런 권유를 몇 차례 받기도 했습니다."
10018015-62 = "하지만 저는 역시…… 대대로 이어져 내려온 이 가게를 지키고 싶어서……"
10018015-63 = "바보 같은 일이지요. 하나를 지키려다 모든 것을 잃게 되었으니 말이에요."
10018015-64 = "처음에는 더 열심히 요리를 만들어, 손님분들께 보답하면 될 거라고 생각했습니다만."
10018015-65 = "역시 세상 일이라는 것은 그렇게 순진하게 돌아가 주지 않더군요."
10018015-66 = "뭔가 신세 한탄처럼 되어 버렸습니다만, 그래도 털어놓고 나니 속이 후련해집니다."
10018015-67 = "들어주셔서 감사합니다. 신세를 졌네요."
10018015-73 = "그 마음……"
10018015-74 = "네?"
10018015-75 = "그 마음, 저도 알 것 같아요."
10018015-76 = "손님……?"
10018015-77 = "아무리 열심히 요리를 해도,"
10018015-78 = "스스로의 힘으로는 어쩔 수 없는 일로 요리를 못하게 된다든가!"
10018015-84 = "다시, 아무리 열심히 요리를 만들어도,"
10018015-85 = "자기 탓이 아닌 다른 누군가 때문에 가치가 폄하된다든가!"
10018015-86 = "그런 일이 있었다고요? 정말 너무하네요★"
10018015-87 = "그리고 또다시, 정말 최선을 다해 요리를 만들어도!"
10018015-88 = "준비 단계에서부터 천재지변 같은 일을 만나서, 아무것도 뜻대로 되지 않는다든가!!!"
10018015-89 = "서, 선배?!"
10018015-90 = "마지막으로, 간신히 요리를 만들었더니!"
10018015-95 = "제대로 배식하기도 전에 누군가가 먼저 없애 버린다든가!!!"
10018015-96 = "뭐야, 뭐야? 무슨 이야기야?"
10018015-97 = "나도 끼워 줘!"
10018015-98 = "소, 손님?"
10018015-99 = "조금 진정하시고…… 말씀하시는 뜻은 잘 알겠습니다만……"
10018015-104 = "도와 드릴게요."
10018015-106 = "네……?"
10018015-107 = "방법이 있을 거예요. 다 같이 찾아봐요. 아무것도 안 하고 이대로 물러날 수는 없잖아요?"
10018015-108 = "그, 그렇게 해 주신다면야, 저야 더 드릴 말씀이 없지요……"
10018015-109 = "감사합니다. 감사합니다……"
10018015-114 = "후후후……"
10018015-115 = "결과가 좋았으니, 전부 OK가 된 셈이군요."
10018015-116 = "[s] \"……이걸로 정말 괜찮을까……?\""
10018015-117 = "어머나. 무슨 문제라도 있으신가요, 선생님?"
10018015-118 = "문제없어 보이신다고요?"
10018015-119 = "그렇다면 괜찮겠지요."
10018015-125 = "그런데 왜 한숨을 쉬고 계시는 거죠?"
