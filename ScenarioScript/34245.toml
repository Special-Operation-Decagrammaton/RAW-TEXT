[translation]
34245-2 = "크, 크아, 크아아아아아아-!!"
34245-3 = "어째서, 어째서……!! 나는, 나는……!!"
34245-4 = "내 계획이…… 내 영지가…… 내 의식이……"
34245-5 = "내…… 내……."
34245-6 = "크아아아아아……!!"
34245-13 = "하아…… 하아…… 하아……."
34245-14 = "끄, 끝……인가요?"
34245-18 = "아! 공주님은요!!"
34245-19 = "아, 아츠코……!!"
34245-21 = "아직 위에 매달려 있어."
34245-22 = "네, 네! 어, 어서 공주님을 내려주어요!"
34245-32 = "공주님……."
34245-37 = "공주님…… 정신 차려……."
34245-38 = "고…… 공주님……."
34245-39 = "……외상이 심해. 피를 너무 많이 흘렸어."
34245-40 = "공주…… 아츠코…… 부탁이야, 눈을 떠줘…… 제발……."
34245-41 = "제발…… 아츠코…… 눈을 떠 줘……."
34245-42 = "……."
34245-43 = "……."
34245-51 = "사오리 쨩……?"
34245-52 = "아츠코……!!"
34245-53 = "공주……."
34245-54 = "고, 공주님!! 정신이 들어요?!"
34245-55 = "응. 좋은 아침."
34245-56 = "사오리, 히요리, 미사키…… 모두 좋은 아침이야."
34245-66 = "아츠코……!!!"
34245-67 = "아, 사오리……?"
34245-68 = "다행이야…… 응. 정말 다행이야……."
34245-69 = "으, 응……?"
34245-70 = "다행이야, 아츠코…… 살아줘서 고마워…… 정말 고마워……."
34245-71 = "……응. 그렇구나."
34245-72 = "으흐흐흐흐흑-. 으흐흐흐흐흐흑……."
34245-73 = "사오리…… 울지 마. 난 괜찮으니까."
34245-74 = "선생님이 도와준 거구나……? 우리를."
34245-75 = "그래…… 맞아……."
34245-76 = "응…… 고마워, 선생님. 괜찮아 이제…… 응……. 괜찮아……. 분명히……."
34245-79 = "……응. 사오리. 이제 다 괜찮을 거야."
34245-81 = "[ns] 쓰러져 있는 베아트리체에게 다가간다."
34245-85 = "크, 크으윽……"
34245-86 = "[s] \"다 끝났어. 베아트리체.\""
34245-87 = "감히…… 나, 나는 아직……. 아직이다!"
34245-88 = "고작 의식을 방해한 것으로 기고만장해하지 말아라, 선생!"
34245-89 = "아직 나에게는 바르바라도, 아리우스의 병력들도 온전해! 미메시스도 가지고 있다!!"
34245-90 = "한 번의 승리를 이루어 냈다고 모든 것이 끝났다고 생각하는 거냐!!"
34245-92 = "아뇨. 하지만 이야기는 이것으로 끝입니다."
34245-93 = "[ns] \" ……!!\""
34245-98 = "골콩트……!!"
34245-99 = "아아. 진정하세요. 놀라게 해드렸다면 죄송합니다. 저는 <게마트리아>의 골콩트……."
34245-100 = "인사는 생략하도록 하죠. 선생님. 어쩌면 우리는 이전에 만났을지도 모르니까요."
34245-101 = "저는 싸우러 온 게 아닙니다. 마담을 데려가려고 온 겁니다."
34245-102 = "나를……!!?"
34245-103 = "게다가 제가 싸워서 이길 자신도 없군요. 게마트리아가 모두 마담처럼 괴물로 변할 수 있는 건 아니니까요."
34245-104 = "네. 마담. 이걸로 분명해졌어요. 선생님은 당신의 대적자가 아니었습니다. 이건 당신의 이야기가 아니었어요."
34245-105 = "……!!"
34245-106 = "당신이 꾸민 사건들, 갈등들, 과정들……. 그런 건 <굳이 몰라도 아무 상관 없는 것>으로 격하되었습니다."
34245-107 = "당신은 주인공은 커녕…… 선생님의 대적자조차 아닌, <맥거핀> 이었던 거죠."
34245-108 = "……크…… 크윽……!!"
34245-109 = "선생님, 당신이 개입하면 모든 개념이 바뀌어 버립니다. 원래 이 이야기의 결말은 이렇지 않았을 거예요."
34245-110 = "모두가 힘을 합쳐 노력으로 이겨낸다……? 제가 원하는 텍스트는 그것보다는 더 문학적인 것이었는데……."
34245-111 = "[s] \"…….\""
34245-112 = "흠, ……죄송합니다. 심기를 불편하게 해드렸나 보군요."
34245-113 = "그럼 저는 마담을 데리고 돌아가겠습니다. 마담, 일어나세요."
34245-118 = "쿨럭…… 너는……."
34245-119 = "[s] \"기다려……!!\""
34245-120 = "혹시 저를 방해하실 건가요? 부디 그런 결심을 하진 말아주세요. 선생님."
34245-121 = "가령…… 저는 다양한 도구를 활용할 수 있습니다. 당신이 가지고 있는 그 <헤일로를 파괴하는 폭탄>도 제 작품이거든요."
34245-122 = "[s] \"……!!\""
34245-123 = "아아. 물론 그걸 여기서 터트리거나 할 생각은 없습니다. 당신에겐 효과도 없을뿐더러, 그 실험은 결국 실패였던 것 같으니까요."
34245-124 = "그 폭탄이 실제로 헤일로를 파괴할 수 있는지를 한 번도 확인할 수 없었죠. 분명 제 계획은 그런 게 아니었는데……. 그러니까 그건 이후 폐기할 예정입니다."
34245-125 = "마담. 이번 실험은 실패입니다. 돌아가시죠."
34245-126 = "골콩트……!"
34245-127 = "실례했습니다, 선생님. 그럼 다음에 또."
34245-134 = "다음화;소중한 사람"
