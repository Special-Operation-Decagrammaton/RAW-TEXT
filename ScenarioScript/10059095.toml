[translation]
10059095-3 = "……！"
10059095-4 = "マナミ様……！ご無事ですか？"
10059095-5 = " ……ええ。まだ、戦えます。"
10059095-6 = "マナミ様……。"
10059095-9 = "……何これ。"
10059095-10 = "舐めてんの？"
10059095-11 = "この程度なら、最初から力で潰しとくんだった。"
10059095-12 = "とんだ無駄足じゃん。"
10059095-13 = "さすがボス！お見事です！"
10059095-14 = "さあ、評議会の皆様！もう諦めて、己の無力を受け入れるのです！"
10059095-15 = "流通に関する権限を明け渡すだけ！簡単なことでしょう？"
10059095-16 = "金が湯水のように流れ込む――#n利益第一の芸術学院へと生まれ変わらせて差し上げましょう！"
10059095-17 = "……させません。"
10059095-18 = "[s1] \"うん。そんなことはさせない。\"\n[s2] \"ここから指揮の仕方を変えるよ。\""
10059095-23 = "[ns] \"マナミが足首を気にせず、力を発揮できる形に。\""
10059095-24 = "……。"
10059095-25 = "先生……ご存じだったのですか？"
10059095-26 = "[s] \"うん。私の生徒のことだから。\""
10059095-30 = "[ns3] \"でも、このやり方はできれば避けたかった。\"\n[ns4] \"マナミの過去に触れてしまうようで。\""
10059095-34 = "……ふふっ。"
10059095-35 = "構いません。"
10059095-36 = "過去のことは、もう気にしないと決めましたから。"
10059095-37 = "……指揮を変える？"
10059095-38 = "そんなことで、あの雑魚どもが私に勝てるとでも思ってる？"
10059095-39 = "[s] \"雑魚じゃない。\""
10059095-41 = "[ns] \"大切な、私の生徒たちだ。\""
