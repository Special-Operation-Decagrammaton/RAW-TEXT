[translation]
10059095-3 = "……!"
10059095-4 = "마나미 님……! 괜찮으십니까?"
10059095-5 = "……괜찮습니다. 아직은 버틸 수 있어요."
10059095-6 = "마나미 님……."
10059095-9 = "……뭐야, 이거."
10059095-10 = "야. 장난해?"
10059095-11 = "이런 녀석들인 줄 알았다면 처음부터 힘으로 해결할걸."
10059095-12 = "괜히 시간 낭비만 했잖아."
10059095-13 = "후후후, 역시 보스! 강하십니다!"
10059095-14 = "자! 평의회 여러분! 이제 포기하고 결과에 승복하십시오!"
10059095-15 = "학원의 모든 유통 권한을 우리에게 넘기는 겁니다!"
10059095-16 = "자금이 물처럼 흐르는, 아주 실리적인 예술학원으로 만들어 드리겠습니다!"
10059095-17 = "……그렇게 둘 순 없어요."
10059095-18 = "[s1] \"그래. 그렇게 둘 순 없어.\"\n[s2] \"마나미. 지금부터 지휘 방법을 바꿀게.\""
10059095-23 = "[ns] \"발목이 불편한 마나미가, 최대한 활약할 수 있는 방법으로.\""
10059095-24 = "……."
10059095-25 = "선생님. 알고 계셨던 건가요?"
10059095-26 = "[s] \"응. 내 학생에 대한 일이니까.\""
10059095-30 = "[ns3] \"그래도 이 방법은…….\"\n[ns4] \"과거를 건드리는 것 같아서 최대한 하지 않으려 했는데.\""
10059095-34 = "……후후."
10059095-35 = "괜찮습니다."
10059095-36 = "과거 같은 건, 신경 쓰지 않기로 했으니까요."
10059095-37 = "……지휘를 바꾸겠다?"
10059095-38 = "그런다고 저 오합지졸들이 날 이길 수 있을 거라 생각하나?"
10059095-39 = "[s] \"오합지졸이 아니야.\""
10059095-41 = "[ns] \"소중한, 내 학생들이야.\""
