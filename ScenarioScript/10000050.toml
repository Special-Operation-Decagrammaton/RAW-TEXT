[translation]
10000050-1 = "제5화;축제가 열리는 거리"
10000050-2 = "뭐? 또 당했다고? 이즈나는? 이즈나는 어딜 갔지?"
10000050-3 = "그 녀석도 도움이 안 돼! 닌자라니, 장난치는 거냐구!"
10000050-4 = "오늘도 여기 오기 전에, 볼일이 있다면서 뛰쳐나갔음다."
10000050-5 = "흐음. 모처럼 좋은 실력을 갖추고 있다고 생각했거늘."
10000050-6 = "(결국 여기까지인가.)"
10000050-7 = "이대로 계속 가면 축제를 방해하기 전에, 전부 그 샬레의 선생님이란 어른한테 당해버릴 검다-"
10000050-8 = "샬레의 선생님. 그 정도의 힘을 지녔다고는 도저히 믿기 힘들지만. 뭐, 하는 수 없지."
10000050-9 = "지금 상점가 거리에 몇이나 되는 망량즈가 모였지?"
10000050-10 = "어, 대충 120명 쯔음?"
10000050-11 = "그럼 좋아. 슬슬 적극적으로 움직일 필요가 있는 국면이군."
10000050-12 = "특단의 조치다. 지금부터 내가 하는 말을 잘 들어라."
10000050-15 = "(소근소근 쿵떡쿵떡 재잘재잘 깜짝깜짝)"
10000050-16 = "엣…… 정말 그래도 돼?"
10000050-17 = "정말임까? 정말로 저질러버림까?"
10000050-18 = "마지막 변수를 제거하기 위해서다."
10000050-19 = "이번 일만 처리해준다면, 모든 계획은 성공하고, 너희들도 계약대로 거대한 인센티브를 받을 수 있다."
10000050-20 = "뭐, 그렇다면야. 알았어. 보스."
10000050-21 = "넷! 알겠슘돠!"
10000050-22 = "물론……. 이건 전부 이즈나에겐 비밀이다."
10000050-23 = "슬슬 마무리를 지을 때다."
10000050-25 = "백야당"
10000050-26 = "(날은 어두워졌지만, 작전회의를 위해 백야당에 모두가 모였다.)"
10000050-27 = "그런데 원흉은, 어떻게 찾으면 좋을까요?"
10000050-28 = "가장 확실한 방법이 있어."
10000050-29 = "우선 길거리로 나가서, 요리조리 난장판을 만들고 있는 망량즈를 찾은 다음 단번에 포위하는 거야."
10000050-30 = "마츠리부만으로는 힘들었지만, 수행부까지 함께한 지금이라면 가능해!"
10000050-31 = "포위한 다음엔~?"
10000050-32 = "그야 포위했다면 단숨에 격퇴! 사로잡아서 포획!"
10000050-33 = "그 뒤엔 그네들을 고용한 원흉이 누군지 밝혀내면 끝!"
10000050-34 = "필요에 따라선 과격한 방법도 불사하겠어!"
10000050-35 = "과연! 부장님임다!"
10000050-37 = "의리를 모르는 악당들에겐 새끼손가락 싹둑형인 겁니다!"
10000050-38 = "우와……."
10000050-39 = "어머나……."
10000050-40 = "후아암……."
10000050-41 = "[s] 말없이 경악한다."
10000050-43 = "그……, 다시 생각해보니 피나도 거기까진 너무 한 거 같습니다. 부장……."
10000050-44 = "아니아니아니, 거기까지 생각하진 않았거든?!"
10000050-45 = "중요한 건, 붙잡아서 원흉을 불게 만든다. 이거라구!"
10000050-46 = "뭣보다 시간이 없어."
10000050-47 = "당장 축제의 클라이맥스가 예정된 것이 바로 내일이니까."
10000050-48 = "앗! 들은 적 있어! 불꽃놀이라고 했었지?! 홀로그램으로! 펑펑펑!"
10000050-49 = "응, 이번 백야앵제의 절정이라고 할 수 있는 내일. 축제의 대미를 장식할 불꽃놀이를 준비했어."
10000050-50 = "그때도~ 망량즈가 날뛰면 단순한 소동으로 끝나지 않을 거야~"
10000050-51 = "그리고 사전에 그걸 막지 못한 책임을 물어, 저희 마츠리부 또한……."
10000050-52 = "시즈코 쨩……."
10000050-53 = "으응, 아냐. 부정적인 생각은 됐어!"
10000050-54 = "빨리 원흉을 찾아서, 내가 받는 스트레스를 그대로 떠넘겨주겠다구! 그 녀석드으을!"
10000050-55 = "[s] \"……이젠 꾸미는 것조차 하지 않는구나.\""
10000050-56 = "자, 잔말은 됐구요!"
10000050-58 = "(그렇게 되어 마츠리운영관리부 그리고 수행부와 함께 거리 순찰에 나서게 되었다……만)"
10000050-59 = "정작 망량즈, 그 녀석들, 왜 갑자기 코빼기도 보이지 않는 거얏?!"
10000050-60 = "피나, 조금 알 거 같습니다! 리모콘 같은 게 분명합니다!"
10000050-61 = "피나도 가끔 리모콘을 찾으면 늘 냉장고에서 찾고는 했습니다!"
10000050-62 = "나! 나요! 그게 뭔지 알고 있어! 분명 머, 머피, 응! 머핀의 법칙인가. 하는 그거야!"
10000050-63 = "맛있어 보이는 법칙이네~"
10000050-64 = "그래도 소동이 없으니, 모두 평범하게 축제를 즐기고 있네요."
10000050-68 = "으으읏! 이럴 리가 없어."
10000050-69 = "망량즈 녀석들이라면 지금이라도 저기서 바로……!"
10000050-71 = "으아아앙~! 엄마~! 아빠~! 어디있어~!"
10000050-73 = "어머나, 미아가 된 꼬마 아가씨?"
10000050-74 = "가만 있을 수 없는 사안 발생!! 수행부 출동 건이야, 츠바키 선배!"
10000050-75 = "출~동~"
10000050-78 = "으, 응? 자, 잠깐……!"
10000050-79 = "앗! 시즈코 씨! 여기 있었습니까? 한참을 찾았습니다요!"
10000050-80 = "내일 있을 불꽃놀이 행사 준비로 상담드릴 게 있습니다만."
10000050-81 = "읏?! 하필 이럴 때……!"
10000050-82 = "하지만……. 마츠리부 부장으로서 모른 체 할 수는……. 으윽! 피나! 여기는 맡길게!"
10000050-83 = "선생님과 함께 망량즈를 발견하면, 잘 감시해야 해!"
10000050-84 = "라져-입니다! 피나에게 맡겨만 주세요!"
10000050-86 = "음음! 다들 갑자기 바빠져 버렸습니다!"
10000050-87 = "[s] \"망량즈가 아니었다면, 이게 당연한 거였겠지.\""
10000050-88 = "과연, 두목! 날카로운 통찰입니다!"
10000050-89 = "망량즈만 아니었으면 축제 준비도 제대로, 저희 마츠리부도 열심히 뛰어다녔을 겁니다!"
10000050-90 = "그런데 이런 일로 모두가 힘들어하다니, 피나도 무척……."
10000050-91 = "아앗! 실망하고 있을 때가 아닙니다! 지금 두목과 함께 있는 건, 피나 혼자 뿐?!"
10000050-92 = "이건 행동대장으로서, 빈틈을 보이면 안 되는 '씬'이로군요! <의리 없는 냥냥펀치>에서 봤습니다!"
10000050-93 = "[s] \"잘 부탁해. 피나.\""
10000050-94 = "넵! 두목의 신변 보호 및 축제 거리의 치안은……."
10000050-95 = "이 행동대장 피나에게만 맡겨주세요!"
10000050-96 = "(와장창!)"
10000050-97 = "[s1] \"말하자마자 트러블이?!\"\n[s2] \"망량즈가 또?!\""
10000050-101 = "아앙? 그러니까 이게 실패라고오?"
10000050-102 = "지금 우릴 물로 보는 거냐?! 앙?!"
10000050-103 = "하, 하지만 여기 잘 보시면 모서리 끝이 깨져서……."
10000050-104 = "됐고! 뽑기는 전부 성공했으니까. 얌전히 상품권을 내놓으라고!"
10000050-105 = "3천 엔짜리 축제 쿠폰, 그것만 받으면 이 가게의 뽑기를 전부 성공시켜주마!"
10000050-106 = "히, 히이이익!! 어떻게 그런 잔인무도한 짓을! 그렇게 되면 뭘로 장사하라고!"
10000050-107 = "크크큭! 그것이 우리 뽑기 달인이 축제를 즐기는 법이지!"
10000050-108 = "우리에게 걸린 걸 후회하라고!"
10000050-110 = "저건……! 축제 때면 어김없이 자연발생 하는 뽑기 양아치!"
10000050-111 = "[s] \"한 여름의 날벌레 같은 거야?!\""
10000050-112 = "축제 상인들이 두려워하는 뽑기 킬러들입니다! 두목!"
10000050-113 = "이건 두목과 피나가 나설 때입니다!"
10000050-114 = "축제의 평화를 어지럽히는 문제아는, 이 협객 피나가 용서하지 않습니다!"
