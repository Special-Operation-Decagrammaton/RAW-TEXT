[translation]
10014065-4 = "……여기인가……?"
10014065-5 = "선생님은 어떻게 안 거야? 추적기라도 달아 놓은 건 아닐 테고……."
10014065-6 = "[s1] \"이 정도의 스케반들이 몰려 있는데…….\"\n[s2] \"이쯤 되면 모르는 게 이상하지 않을까.\""
10014065-7 = "화, 확실히……."
10014065-8 = "화, 확실히……."
10014065-9 = "이제야 알겠네. 이 정도의 소란이라면, 트리니티 안에선 당연히 정의실현부가 나왔을 거야."
10014065-10 = "이래서 아예 트리니티 밖까지 우자와를 몰아온 거지. 여기라면 자기들도 마음껏 날뛸 수 있으니까."
10014065-11 = "뭐, 그래 봐야 길어도 오늘 밤……. 아니, 내일 새벽까지 정리되지 않으면 발키리가 됐든 뭐가 됐든 몰려오겠지만 말이지."
10014065-12 = "그건 그런데……."
10014065-16 = "……이것들은 왜 여기 있는 거야……."
10014065-17 = "……? 이것들이라니, 도와주러 온 사람한테 말 한번 진짜 이쁘게 하네?"
10014065-18 = "누가 도와 달라고 했는데? 방해만 되니까 지금이라도 돌아가지 그래?"
10014065-19 = "하하하하!! 재밌네? 진짜 그런지 들어가기 전에 우선 나랑 한 판 하고 시작할까?"
10014065-20 = "으으……. 이쪽에도 말 많고 시끄러운 녀석이……. 요 며칠 이상한 말투까지 배워서는……."
10014065-21 = "너 이번 일 끝나면 꼭 그거 버려. 유치하니까 나중에 반드시 이불 차게 된다고. 그때 가서 후회하지 말고."
10014065-22 = "뭣……! 유, 유치……!?"
10014065-23 = "너 지금 뭐라고 했어!?"
10014065-25 = "요, 요시미 쨩! 카즈샤 쨩……! 여기서 우리끼리 싸우면 안 돼……!"
10014065-26 = "진짜 왜 온 거야……."
10014065-27 = "……역시 선생님이 부른 거지? 그렇지?"
10014065-28 = "[s3] \"이왕 함께인 게 좋잖아.\"\n[s4] 딴청을 피운다."
10014065-29 = "선생님……."
10014065-30 = "선생님……."
10014065-34 = "사양할 거 없어, 카즈사. 어차피 우리는 이 일대를 잡아먹을 공포의 <방과후 디저트단>. 카스팔루그의 동료들."
10014065-35 = "그리고 동료의 동료는……. 동시에 우리의 동료이기도 하지."
10014065-36 = "감히 우리 조직의 동료를 건드리다니, 그에 상응하는 피의 대가를 치르게 될 것이다."
10014065-37 = "아니. 그러니까 몇 번이나 이야기했잖아. 나는 그 녀석이랑 친구 같은 게……."
10014065-38 = "……후후후. 차마 인정하지 못하는 그 모습, 그야말로 <악우>로군!"
10014065-39 = "로망이다!!"
10014065-40 = "아 진짜!! 그런 말투 좀 그만하라고!! 낯 뜨겁지도 않냐!?"
10014065-41 = "그런 말투 쓰면 나중에 분명 이불을 찰 거라니까!?"
10014065-42 = "……??? 이제 와서? ……쟤가?"
10014065-43 = "유감스럽지만 엄청 맘에 들어버린 것 같은데."
10014065-48 = "……훗."
10014065-49 = "……너무 싫어……. 꿈이야, 이건……."
10014065-53 = "뭐, 어때!? 까짓거 해 보자고!!"
10014065-54 = "이쪽은 선생님도 있겠다, 웬만해선 지지 않으니까!!"
10014065-55 = "서, 선생님……! 부디 안전한 곳에서 알려주세요!"
10014065-56 = "[s5] \"가자, 방과후 디저트단!\"\n[s6] \"레이사를 구하자!!\""
10014065-59 = "돌겨어어어억-!!"
10014065-60 = "와, 와아아아아아-!!"
