[translation]
13280-1 = "제28화;격전 1"
13280-8 = "……하아, 하아."
13280-12 = "……."
13280-17 = "(생각보다 까다로워. 이 녀석……. 내 행동을 거의 예측하고 있잖아…….)"
13280-21 = "(게다가 나는 저 녀석의 행동이 예측이 안 돼. 무슨 생각을 하는지 하나도 모르겠어…….)"
13280-23 = "(큭……. 여기서 선도부장을 상대하고 있을 시간이 없는데……!)"
13280-27 = "뭔가 꾸미고 있군."
13280-32 = "포기해. 타카나시 호시노."
13280-41 = "……하아. 따돌렸나."
13280-42 = "게헨나의 선도부장……. 어째서 저 녀석이 지금 여기에……."
13280-43 = "잠깐 싸워봤지만, 엄청 까다로운 상대였어."
13280-44 = "……결과적으로 도망친 게 되었나. 뭐, 지금은 그것보단 열차포를……."
13280-50 = "대 오아시스 역이라고……?"
13280-51 = "……하하. 어째서 하필 거기인 거야."
13280-52 = "……."
13280-65 = "……뭐야? 위쪽에……?"
13280-66 = "서, 설마……?!"
13280-72 = "……!!!"
13280-87 = "설마 도망칠 거라곤 생각하지 못했어."
13280-88 = "1:1 승부에선 뭐라고 그러지 않았어?"
13280-91 = "크, 으…… 으윽……!"
13280-94 = "자, 그러면 다시 해볼까. 타카나시 호시노."
13280-96 = "다음화;격전 2"
