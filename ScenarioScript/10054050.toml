[translation]
10054050-1 = "5화;무시무시한 이름"
10054050-2 = "아뇨, 아뇨! 우리 주제는 우리가 잘 알고 있습니다. 네, 그렇고말고요!"
10054050-3 = "버, 벌써 점심시간이 조금 지났으니까, 식사라도 준비할까요?"
10054050-4 = "일단 고추잡채와 꽃빵이라도……!"
10054050-9 = "……뭐야, 이건. 피망이잖아?"
10054050-10 = "잘도 피망을 넣었네. 우린 정말로 피망이 싫은데. 눈치도 없고, 실력도 없고."
10054050-11 = "안 되겠어요. 이런 어른들에게는, 벌이 필요하겠군요. 우후후후."
10054050-12 = "하, 하지만 어제는 분명, 고추잡채를 드시고 싶으시다고……!"
10054050-13 = "그리고 고추잡채에 피망이라도 들어가지 않으면, 요리 이름의 의미가 없어집니다만……?"
10054050-14 = "그그그, 그렇습니다! 원래는 풋고추를 사용해야 하는데, 그러면 정말로 매워서 드시지 못할까 봐……!"
10054050-15 = "그런 거 모르겠으니까! 아무튼 피망 같은 거 넣지 말라고(요)!"
10054050-16 = "그리고 이거 뭐야? 거위?"
10054050-17 = "요리 재료입니다!"
10054050-18 = "참 나, 거위가 불쌍하지도 않아? 어서 풀어줘!"
10054050-19 = "그렇지만 분명 거위구이를 먹고 싶다고 하셨잖습니까?"
10054050-20 = "그건 그거고, 이건 이거죠."
10054050-21 = "꽤애애애애액!!!"
10054050-22 = "꺄악?! 뭐, 뭐야??? 이 거위 녀석…… 동물 주제에! 당장 없애 버려!"
10054050-23 = "예? 방금…… 풀어주라고 하지 않았나요?"
10054050-24 = "그때는 그때고, 지금은 지금. 어른이면서 이것도 모르다니, 정말 못 써먹겠네."
10054050-29 = "[ns] \"뭐지? 저 아이들…….\""
10054050-31 = "그러게요. 하지만 한 가지 확실한 것은……."
10054050-32 = "조금, 버릇이 없군요."
10054050-37 = "흐음……."
10054050-38 = "안 되겠네요. 기분 좋은 날이었는데, 아저씨들이 모두 망쳤어요."
10054050-39 = "역시, 벌이 필요하겠네요."
10054050-46 = "아이고……. 아이고오……. 결국 이 좌판마저……."
10054050-47 = "……너무 낙심 말게. 낙심하지 마. 조금씩 도와줄 테니까, 다시 하면 돼."
10054050-48 = "그렇지, 그렇지. 서로 돕고 살아야지. 안 그래?"
10054050-49 = "뭔가, 기분 나쁘네."
10054050-50 = "맞아. 기분 나빠."
10054050-51 = "이래서야 벌이 되지 않잖아요. 조금 더 따끔한 손길이 필요한 걸까요? 우후후후."
10054050-52 = "너희들, 지금 뭐 하는 거야?!"
10054050-53 = "뭐야, 넌. 혹시…… 여행객?"
10054050-54 = "어떻게 된 거지? 우리 말고는 아무도 여기에 안 올 텐데, 이상하네."
10054050-55 = "어쩌다 인터넷으로 소문이 퍼진 모양이네요. 이래서 숏폼 영상들이란."
10054050-56 = "뭐, 특별히 가르쳐 줄게. 너도 우리 이름을 들으면 부러워서 당장 같이 다니게 해 달라고 할걸?"
10054050-57 = "그건 당연하지. 어떤 아이라고 해도, 이 이름을 듣고 가만히 있을 리 없으니까."
10054050-58 = "그러면 알려 드리죠. 하고 싶은 대로 하기, 놀고 싶은 대로 놀기, 이상한 잔소리 따위 안 듣기가 모토인 우리는–"
10054050-59 = "–그 이름도 무시무시한, 병아리파!"
10054050-60 = "나는 타카노스 스이코! 이 조직을 처음 모았지. 꺄하하하!"
10054050-61 = "나는 이오쟈쿠 나고미. 당하면 열 배로 갚아줄 거야. 당하지 않아도 복수하고, 본 적 없어도 복수하고, 누구 할 것 없이 걸리면 끝장나는 거야."
10054050-62 = "그건 그냥 민폐잖아……."
10054050-63 = "우토 요코랍니다. 우후후후. 후후후……. 아이들의 원한은, 생각보다 깊으니까요?"
10054050-64 = "흐음……? 그러고 보니 너……."
10054050-65 = "왜, 왜 그래……?"
10054050-66 = "저렇게 재미없는 어른들은 버리고, 우리랑 같이 다니지 않을래?"
10054050-67 = "맞아. 고리타분한 소리나 하는 어른보다는, 우리 병아리파 쪽이 훨씬 재미있을걸?"
10054050-68 = "여기에서는 그야말로, 하고 싶은 것은 다 하고, 하기 싫은 것은 안 하고, 꼴 보기 싫은 것은 모조리 날려버릴 수 있으니까."
10054050-69 = "아이에게는 모든 가능성이 있는 법이니까요. 후후. 우후후후……."
10054050-70 = "무슨 소리를 하는 거야, 너희들……."
10054050-73 = "여, 여기 운메에봉과 달고나 우유를 준비했습니다! 일단 이거라도……!"
10054050-74 = "어? 운메에봉에 달고나 우유? 나 그거 좋아하는데……."
10054050-75 = "뭐야. 눈치 없는 어른치고, 나쁘지 않은 걸 가져왔잖아?"
10054050-76 = "어떻게 할까요? 우후. 우후후후……."
10054050-77 = "으음……."
10054050-78 = "뭐, 오늘은 기분이 풀렸으니까, 넘어가 주도록 하지!"
10054050-79 = "하지만 다음에는 안 봐줄 거야? 그때는 이 거리를 불로 뒤덮어 줄 테니까."
10054050-80 = "한낮에도 밤에도 환하게 보일, 불꽃놀이가 되겠네요. 우후후후후……."
10054050-87 = "그나마 갔구나. 휴우……."
10054050-88 = "……괜찮나, 자네?"
10054050-89 = "괜찮지 않아도 괜찮아야지, 어쩌겠어."
10054050-91 = "[ns] \"그 아이들은…… 뭔가요?\""
10054050-92 = "'병아리파'라는…… 폭력 조직이라네."
10054050-93 = "뭐라고? 폭력…… 조직?! 유치원생 정도로 보였는데……!?"
10054050-94 = "그래……. 유치원생들이지."
10054050-95 = "이런 표현 별로 안 좋아하지만, 그런 건가요? 요즘 아이들은 무섭다거나, 그 비슷한 거?"
10054050-96 = "이 상황에서는 들어맞는 말 같구나……."
10054050-97 = "갑자기 나타난 아이들인 것인가?"
10054050-98 = "갑자기…… 까지는 아니긴 하지만, 언젠가부터 여기에 온 아이들이었지."
10054050-99 = "이곳을 새로운 거점으로 삼겠다든가, 뭐라든가……."
10054050-100 = "보았던 것처럼 완전히 제멋대로여서, 참 골치 아프구나."
10054050-101 = "그런데…… 왜 그냥 두고 보시는 건가요? 그건 저 아이들의 교육을 위해서라도, 좋지 않을 텐데요."
10054050-102 = "……뭐라고 해야 할까. 뒷배가 좀 강해."
10054050-103 = "물론 혼을 내거나 가르쳐 보려고도 했지……. 하지만……. 여러 가지 일로, 잘 안됐어."
10054050-104 = "여기가 꽤 마음에 들었던 모양이더군. 자기들만 사용하려고 하는 모양이야."
10054050-105 = "그래……. 그동안 잘 알려지지 않았지만, 이 계곡은 멋진 곳이니까."
10054050-106 = "얼마 전에 투자 금액도 들어와서 그걸로 시설을 정비하고, 새롭게 시작해 보려고 했는데……."
10054050-107 = "보았다시피, 바로 그 찰나에 병아리파 아이들이…… 날뛰기 시작해서 말이지."
10054050-108 = "……."
10054050-109 = "제대로 손님을 받기도 어렵고, 시설 확충이나 보강 같은 것도…… 쉽지 않은 상황이 되어 버렸어."
10054050-110 = "[s] \"그러면 그 아이들은 여기 근처에 머무는 건가요?\""
10054050-111 = "그래. 이 계곡에서…… 가장 유서 깊은 호텔에 방을 잡았어."
10054050-112 = "저기, 산 중턱에 있는 호텔인데, 케이블카로 직접 연결되어 있다네."
10054050-113 = "케이블카로 직접, 이군요."
10054050-114 = "그래……. 그 정도 시설을 사용할 수 있을 정도로, 만만치 않은 아이들인 게지."
10054050-115 = "그러고 보니, 코코나 쨩에게는 잘 대해 주려던 것 같던데요?"
10054050-116 = "그건 그런 게 아닐까. 말이 통할 것 같은 아이가 늘어날 것 같다는 것이었겠지."
10054050-117 = "언젠가 키보토스의 모든 아이들을 병아리파로 만들겠다는 이야기도 했고."
10054050-118 = "말도 안 돼요……. 전 그런 경우도 모르고 예의도 없는 애들은 질색이라구요!"
10054050-119 = "코코나…… 라고 했니?"
10054050-120 = "네? 네. 스노하라 코코나, 입니다."
10054050-121 = "기특하구나. 그리고…… 참 의젓하네. 그 아이들도 조금만 코코나를 닮았으면 좋을 텐데."
10054050-122 = "다, 당연하죠! 저는 이미 어엿한 레이디니까요!"
10054050-124 = "[ns] \"그렇습니다. 코코나는 자랑스러운 우리 학생이죠.\""
10054050-125 = "서, 선생님……? 갑자기 왜 그러세요? 감사하기는 한데……."
10054050-126 = "네? 이런 때에까지 함부로 농담을 하지는 않는다고요? 그, 그런……."
10054050-127 = "드, 드디어 선생님도 저의 매력에 눈을 뜨신 거네요! 당연하죠!"
10054050-128 = "잠시만요. 그런데, 그렇다면……."
10054050-129 = "……평소에는 정말로 절 놀리거나 농담을 하셨다는 이야기네요……?"
10054050-130 = "[ns] \"……들켰나?\""
10054050-131 = "선~생~님~!!!"
10054050-134 = "(얼굴을 빨갛게 물들이며 달려오는 코코나에게서, 일부러 잡힐 듯 말 듯 아슬아슬하게 도망쳤다!)"
10054050-136 = "아무튼, 이곳을 찾아 줘서 고맙구나."
10054050-137 = "허허허…… 간만의 손님이라는 느낌이야."
10054050-138 = "할 수 있는 데까지는 최대한 손님 대접을 해 줄 테니, 부디 편히 쉬다 가시게나."
10054050-139 = "말씀 감사합니다."
10054050-140 = "……."
10054050-141 = "그러면 일단, 조금 전 고추잡채와 꽃빵 주세요!"
10054050-142 = "으음? 하지만 그건 전부 식었는데……?"
10054050-143 = "괜찮습니다! 잘 만든 고추잡채는 식어도 맛있는 법이니까요!"
10054050-144 = "고추잡채……. 으으, 하지만 피망이……. 당근보다는 조금 낫지만……."
10054050-145 = "아뇨……. 아니에요. 그 병아리파 아이들처럼 투정 부리고 싶지는 않으니까요!"
10054050-147 = "(고추잡채는 많이 식어 있었지만, 역시 생각대로 맛있었다.)"
10054050-153 = "……잘 먹어 주는구나."
10054050-154 = "참 간만에 느끼는 기분이군, 이런 것도……."
10054050-155 = "돈은 물론 중요하지만, 가끔이라도 이런 모습을 보기 위해 장사를 하는 것일 텐데."
10054050-157 = "[ns] \"자, 그러면…….\""
10054050-158 = "이 문제를 어떻게 할까, 라는 것이겠지?"
10054050-159 = "냉정하게만 생각하자면, 우리는 이곳에 여행객으로 온 몸이고."
10054050-160 = "여기에서 일어나고 있는 일과는 직접적인 관련이 없다고도 생각할 수 있겠으나……."
10054050-161 = "그렇게 서두를 꺼내실 때는, 그것이 본심이 아니라는 것 정도는 알고 있습니다."
10054050-162 = "호오. 그렇게 생각하는가. 그렇다면 그대는 어떻게 할 것이냐."
10054050-163 = "최소한, 알아보기는 해야 하지 않겠습니까!"
10054050-164 = "상인 분들은 좋은 분들이셨습니다. 다 식었다며 고추잡채와 꽃빵의 가격도 절반밖에 받지 않으셨죠."
10054050-165 = "그리고 그런 일을 겪으면서까지 이 휴양지를 지키려고 하는 모습…… 우리 학교라고 해도, 귀감이 될 만한 자세였습니다."
10054050-166 = "그런 분들께 최소한의 도리도 다하지 못해서야, 무엇이 의이고 협이겠습니까!"
10054050-167 = "그래. 참으로 그대다운 말이었다, 미나."
10054050-171 = "나도 찬성. 일단 같은 상인으로서 그렇게 하고 싶어. 장사에도 최소한의 도리라는 게 있는 법이니까."
10054050-172 = "맞아요! 저도 그 병아리파라는 꼬맹이들, 절대로 두고 볼 수 없어요!"
10054050-173 = "뭔가요? 그 무례한 데다 안하무인하고, 예절이고 경우고 아무것도 없잖아요!"
10054050-174 = "매화원이었으면 당장 엉덩이부터 때찌때찌 했을 거예요!"
10054050-175 = "[ns] \"슌은 어때?\""
10054050-179 = "그렇네요."
10054050-180 = "……"
10054050-181 = "여러 가지를, 생각하게 해 주는 아이들이었습니다만……."
10054050-182 = "루미 씨가 말한 것처럼 이곳의 친절하신 상인 분들을 위해서도."
10054050-183 = "그리고…… 그 아이들을 위해서라도."
10054050-184 = "저 역시, 마냥 가만히 있고 싶지는 않네요."
10054050-185 = "애초에 그 아이들의 행동 때문에, 자금의 투자와 순환이 이루어지지 않고 있다."
10054050-186 = "우리가 이곳에 온 진짜 이유는, 산해경의 투자가 원활히 이루어지고 있는지를 관찰하기 위한 것이었지."
10054050-187 = "따라서 이 일을 알아보는 것 역시, 그 활동의 연장선상이라고 할 수 있을 게다."
10054050-188 = "[ns] \"좋아! 방향은 결정했고……. 방법은 어떻게?\""
10054050-189 = "우선은 조금 더 이곳의 형편…… 상회 거리를 조사해 보는 편이 좋겠어."
10054050-190 = "병아리파 아이들을 직접 알아보기에는…… 으음."
10054050-191 = "……우리 구성원이, 조금 나이가…… 많지? 한 명 빼고."
10054050-192 = "네? 으으……. 꼭 하라고 하시면, 하겠지만요……."
10054050-193 = "으우우……. 역시 조금 그래요……. 그런 꼬맹이들 조직에 들어가서…… 같은 편인 척을 해야 한다니……!"
10054050-194 = "맞아요. 일단 '지금 이 순간'은 코코나 쨩 밖에는 부탁할 수 있는 사람이 없는 것도 사실이지만."
10054050-195 = "코코나 쨩의 가족이자…… 나아가 보호자 중 한 명으로서, 저도 조금 찬성하고 싶지 않은 부분이 있네요."
10054050-197 = "[ns] \"응. 나도 마찬가지야.\""
10054050-198 = "괘, 괜찮은 건가요? 언니도, 선생님도……."
10054050-199 = "물론이랍니다, 코코나 쨩."
10054050-200 = "하지만 그러면, 병아리파 쪽은 어떻게……."
10054050-201 = "안심해도 좋아요. 언니가 조금, 생각이 있거든요."
10054050-202 = "물론, 키사키 님도요."
10054050-203 = "그게…… 무슨 뜻이세요?"
10054050-208 = "(순간, 슌과 키사키의 눈빛이…… 서로 마주쳤다!)"
10054050-209 = "(그리고……!)"
10054050-211 = "그래. 우리에게 나름대로 좋은 생각이 있단다."
10054050-212 = "오늘은 시간이 늦었으니 쉬도록 하고, 내일부터는 상회 거리 쪽 조사를 부탁하도록 하지."
10054050-213 = "흐음……. 짐작이 갈 것 같기도 하고, 모를 것 같기도 하지만……."
10054050-214 = "좋아! 키사키가 그렇게 말한다면야, 우리 셋은 상회 거리 조사를 담당하도록 할까!"
10054050-215 = "네……. 알겠어요!"
10054050-216 = "음. 이견 없다. 그러면 우리는 방으로 먼저 들어가 있도록 하지."
10054050-226 = "[ns1] \"……혹시나 해서 묻겠는데.\"\n[ns2] \"내가 생각하는 그거…… 맞니?\""
10054050-230 = "후후. 어떨까요?"
10054050-231 = "하지만 선생님께서도 조금 말을 맞추어 주신다면, 더욱 이야기가 빨라질지도요?"
10054050-232 = "그렇다. 이럴 때야말로 어른의 '능력'이 필요한 때가 아니겠느냐."
10054050-234 = "(그렇게 의미심장한 미소를 지어 오는 둘의 모습이…….)"
10054050-235 = "(오늘만큼은, 조금 두렵게까지 느껴졌다……!)"
