[translation]
10054050-1 = "第5話;駭人的名號"
10054050-2 = "不敢，不敢！我們當然很清楚自己有多少斤兩……！"
10054050-3 = "已，已經到午餐時間了，讓我們來為各位準備午飯吧？"
10054050-4 = "先來份青椒肉絲和花捲如何……！"
10054050-5 = ""
10054050-7 = ""
10054050-8 = ""
10054050-9 = "……搞什麼啊？這不是青椒嗎？"
10054050-10 = "居然敢放青椒，不知道我們最討厭青椒了嗎？#n真是既不長眼又沒手藝啊。"
10054050-11 = "這樣可不行呢。看來該給你們這種大人一點懲罰才行。唔呵呵。"
10054050-12 = "可，可是您昨天確實說過想吃青椒肉絲……！"
10054050-13 = "而且青椒肉絲要是不放青椒的話，還能叫做青椒肉絲嗎……？"
10054050-14 = "就就，就是說啊！#n本來應該要使用青辣椒的，但我們擔心那樣會變得太辣……！"
10054050-15 = "那種事我不管啦！反正不准給我放青椒那種東西！"
10054050-16 = "還有這是什麼？鵝？"
10054050-17 = "是料理用的食材！"
10054050-18 = "我的天哪！你們難道不覺得鵝很可憐嗎！？快放牠走！"
10054050-19 = "可是您不是說想吃烤鵝料理嗎？"
10054050-20 = "這是兩回事，不要混為一談。"
10054050-21 = "呱啊啊啊啊啊！！！"
10054050-22 = "呀啊！？什，什麼啊？？？#n這隻臭鵝……明明只是隻動物！快把牠處理掉！"
10054050-23 = "咦？您剛才……不是要我放牠走嗎？"
10054050-24 = "剛才是剛才，現在是現在！#n身為大人連這種事都不懂，真的是沒救了。"
10054050-25 = ""
10054050-27 = ""
10054050-28 = ""
10054050-29 = "[ns] 「那些孩子是怎麼回事……？」"
10054050-30 = ""
10054050-31 = "我也不太清楚，不過可以確定的是……"
10054050-32 = "他們有點沒規矩呢。"
10054050-33 = ""
10054050-35 = ""
10054050-36 = ""
10054050-37 = "唔呣……"
10054050-38 = "真是的。本來是個心情愉快的日子，結果全都被大叔們搞砸了。"
10054050-39 = "果然需要給你們一點懲罰才行。"
10054050-40 = ""
10054050-42 = ""
10054050-46 = "哎喲喂……我的老天爺啊……終究連這個攤子都……"
10054050-47 = "……別太灰心了，打起精神來吧。#n我會一點一點幫你的，重新來過就行了。"
10054050-48 = "沒錯沒錯。大家本來就該互相幫忙，不是嗎？"
10054050-49 = "總覺得有點噁心。"
10054050-50 = "沒錯，看了很不舒服。"
10054050-51 = "這樣根本就不算懲罰嘛。#n是不是需要再來點更嚴厲的手段呢？唔呵呵。"
10054050-52 = "你們幾個在做什麼！？"
10054050-53 = "你是誰啊？難道……是遊客？"
10054050-54 = "怎麼回事？除了我們之外應該沒有人會來這裡才對啊。真奇怪。"
10054050-55 = "看來是不小心在網路上傳開了呢。#n所以我才說短影音那種東西實在是……"
10054050-56 = "算了，我就特別告訴你吧。#n反正等你聽到我們的名號之後，肯定會羨慕得想馬上加入我們的！"
10054050-57 = "那當然！不管是誰，只要聽到這個名號都不可能無動於衷。"
10054050-58 = "那我就告訴你吧。不聽無聊的說教、想做什麼就做什麼、想怎麼玩就怎麼玩。#n以此為座右銘的我們──"
10054050-59 = "就是連名號也令人聞風喪膽的「雛鳥組」！"
10054050-60 = "我是鷹野主翠子！最先把這個組織聚集起來的就是我！呀哈哈！"
10054050-61 = "我是五百雀和美。有仇必報，而且加倍奉還。#n沒仇也要報仇，沒見過面也要報仇。#n不管是誰，只要被我盯上就完蛋了。"
10054050-62 = "那完全是在找碴吧……"
10054050-63 = "我是烏頭尾陽子唷。#n唔呵，唔呵呵……小孩子的怨念，可是比想像中還要深的唷？"
10054050-64 = "哼嗯……？我說你啊……"
10054050-65 = "怎，怎麼了……？"
10054050-66 = "要不要拋下那些無趣的大人，過來跟我們一起玩？"
10054050-67 = "沒錯。比起成天只會說教的古板大人，我們雛鳥組可是有趣多了唷？"
10054050-68 = "在這裡想做的事就做、不想做的事就不做，而且還能把看不順眼的東西全都轟飛哦。"
10054050-69 = "畢竟小孩子擁有無限的可能性嘛。唔呵呵……"
10054050-70 = "你們到底在說什麼啊……"
10054050-72 = ""
10054050-73 = "這，這裡有好粗棒和椪糖牛奶！請，請先吃這個吧……！"
10054050-74 = "咦？好粗棒跟椪糖牛奶？我很喜歡耶……"
10054050-75 = "什麼嘛。以不長眼的大人來說，倒是拿來了不錯的東西呢？"
10054050-76 = "該怎麼辦呢？唔呵，唔呵呵……"
10054050-77 = "唔嗯……"
10054050-78 = "好吧。看在今天心情還不錯的份上，這次就放你們一馬！"
10054050-79 = "不過下次可不會再放過你們了哦？#n要是再有下次，我就用火把這條街給燒個精光。"
10054050-80 = "想必會是一場無論白天晚上都能閃閃發亮的煙火秀呢。唔呵呵……"
10054050-81 = ""
10054050-83 = ""
10054050-84 = ""
10054050-85 = ""
10054050-86 = ""
10054050-87 = "總算走了啊。呼……"
10054050-88 = "……你沒事吧？"
10054050-89 = "就算有事也只能裝作沒事……不然還能怎麼辦呢。"
10054050-90 = ""
10054050-91 = "[ns] 「請問那些孩子的來歷是……？」"
10054050-92 = "他們……是個名為「雛鳥組」的暴力組織。"
10054050-93 = "什麼？暴力……組織！？#n可是他們看起來明明只是幼稚園小朋友啊……！？"
10054050-94 = "是啊……確實是幼稚園的孩子沒錯。"
10054050-95 = "雖然我不太喜歡這種說法，不過這就是所謂的「現在的孩子很可怕」嗎？"
10054050-96 = "至少以現在的情況而言，那句話似乎還挺貼切的……"
10054050-97 = "那群孩子是突然間冒出來的嗎？"
10054050-98 = "要說突然……倒也不完全是。#n只是不知道從什麼時候開始，那些孩子就跑來這裡了。"
10054050-99 = "說是要把這裡當作新的據點之類的……"
10054050-100 = "就像各位剛才看到的一樣，他們過度的我行我素實在很讓人頭疼。"
10054050-101 = "不過……為什麼就這麼放任不管呢？#n就算是為了那些孩子的教育著想，這樣應該也不太好吧。"
10054050-102 = "該怎麼說呢……他們背後的靠山不太好惹。"
10054050-103 = "當然我們也曾經試著責罵或教導他們……可惜因為種種原因都不太順利。"
10054050-104 = "他們似乎相當喜歡這裡，打算把這裡占為己有的樣子。"
10054050-105 = "是啊……畢竟這座溪谷雖然不怎麼有名，不過確實是個好地方。"
10054050-106 = "前陣子還得到了一筆投資，原本打算用來整頓設施、重新出發的……"
10054050-107 = "結果你們也看到了……雛鳥組的那些孩子，偏偏在這個時候開始到處惹事。"
10054050-108 = "……"
10054050-109 = "現在別說正常接待客人了，就連想擴建或改善設施都很困難。"
10054050-110 = "[s] 「這麼說來，那些孩子就住在這附近嗎？」"
10054050-111 = "是啊，他們住在這座溪谷歷史最悠久的旅館裡。"
10054050-112 = "就在那裡的半山腰上，和這邊有纜車直接相連。"
10054050-113 = "有纜車直接相連啊……"
10054050-114 = "沒錯……有能力入住那種旅館的孩子可不好惹啊。"
10054050-115 = "話說回來，他們對待心菜醬倒是很友好呢。"
10054050-116 = "我想應該是認為又多了一個能理解自己想法的孩子吧。"
10054050-117 = "他們之前還說過，總有一天要把奇普托斯的所有孩子都變成雛鳥組呢。"
10054050-118 = "怎麼可能……我最討厭那種不懂事又沒禮貌的孩子了！"
10054050-119 = "你叫……心菜是吧？"
10054050-120 = "咦？是的，我是春原心菜。"
10054050-121 = "真是個乖孩子，而且很懂事呢。#n要是那些孩子也能稍微學學心菜就好了。"
10054050-122 = "那，那當然！畢竟我已經是個出色的淑女了！"
10054050-123 = ""
10054050-124 = "[ns] 「沒錯，心菜是我引以為傲的學生。」"
10054050-125 = "老，老師……？怎麼突然這麼說？雖然我是很開心啦……"
10054050-126 = "咦？這種時候你不會隨便開玩笑？#n那，那個……"
10054050-127 = "看，看來老師也總算發現我的魅力了呢！那是當然的嘛！"
10054050-128 = "等一下。所以也就是說……"
10054050-129 = "老師平常都在用玩笑捉弄我嗎……？"
10054050-130 = "[ns] 「……被發現了嗎？」"
10054050-131 = "老師！！！"
10054050-134 = "（面對滿臉通紅衝過來的心菜，故意以若即若離的距離驚險地逃開了！）"
10054050-135 = ""
10054050-136 = "總之，謝謝你們願意來到這裡。"
10054050-137 = "呵呵呵……好久沒有客人上門的感覺了呢。"
10054050-138 = "我會在能力所及範圍內盡力款待各位，還請務必放鬆心情好好休息。"
10054050-139 = "感謝各位的好意。"
10054050-140 = "……"
10054050-141 = "那麼，可以把剛才的青椒肉絲和花捲給我們嗎？"
10054050-142 = "咦？可是那些全都冷掉了耶……？"
10054050-143 = "沒關係！好吃的的青椒肉絲，就算冷掉了也一樣好吃！"
10054050-144 = "青椒肉絲……唔唔，可是青椒……雖然比紅蘿蔔好一點……"
10054050-145 = "不……不對。我可不能跟雛鳥組那些孩子一樣挑食！"
10054050-147 = "（雖然青椒肉絲已經涼掉了，但是就如預想中的一樣好吃）"
10054050-149 = ""
10054050-150 = ""
10054050-151 = ""
10054050-152 = ""
10054050-153 = "……你們吃得真香呢。"
10054050-154 = "這種感覺真是久違了啊……"
10054050-155 = "收入固然重要，但是偶爾可以看到這樣的景象，或許才是我一直經商的原因吧。"
10054050-157 = "[ns] 「好了，那麼……」"
10054050-158 = "關鍵在於該如何應對此事，對吧？"
10054050-159 = "若冷靜思考，吾等不過是前來旅行的訪客。"
10054050-160 = "此地正在發生的問題，可說是與吾等無關……"
10054050-161 = "每當您以這種方式起頭時，我便明白那並非您的本意了。"
10054050-162 = "哦？汝是這麼認為的嗎。那麼汝有何打算？"
10054050-163 = "無論如何，至少應該先把情況調查清楚。"
10054050-164 = "那幾位商人都很親切……還因為菜已經放涼的關係，只向我們收了一半的費用。"
10054050-165 = "即使經歷過那種事，依然堅守著這片土地的模樣……#n就算以我校的標準來看，也是值得效法的精神。"
10054050-166 = "如果對那些值得敬佩的人都無法盡到最基本的道義，又怎麼談得上俠義二字！"
10054050-167 = "是啊。這番話著實有汝之風範呢，美奈。"
10054050-168 = ""
10054050-170 = ""
10054050-171 = "我也贊成。同為商人，我也認為應該伸出援手。#n畢竟經商也有最基本的道義嘛。"
10054050-172 = "沒錯！我也沒辦法對那群雛鳥組的臭小鬼坐視不管！"
10054050-173 = "不但失禮又狂妄自大，完全不懂禮貌和規矩！"
10054050-174 = "要是在梅花園早就先打屁屁了！"
10054050-175 = "[ns] 「旬，你覺得呢？」"
10054050-176 = ""
10054050-178 = ""
10054050-179 = "這個嘛……"
10054050-180 = "……"
10054050-181 = "他們確實是群讓人感觸良多的孩子。"
10054050-182 = "不過就像瑠美同學說的，即便是為了這裡親切的商人們……"
10054050-183 = "同時……也為了那些孩子。"
10054050-184 = "我也不想就這麼袖手旁觀。"
10054050-185 = "追根究柢，正是那些孩子的所作所為，導致資金無法順利運作與循環。"
10054050-186 = "吾等此行的真正目的，本就是為了確認山海經的投資是否有被妥善運用。"
10054050-187 = "那麼對此事的調查，亦可視作原先目的之延伸吧。"
10054050-188 = "[ns] 「既然方向已經決定好了……具體來說該怎麼做呢？」"
10054050-189 = "首先還是多調查一下商店街的情況比較好吧。"
10054050-190 = "至於要直接調查雛鳥組那些孩子的話……唔嗯……"
10054050-191 = "我們這些人的年紀……是不是稍微大了點？除了一個人以外。"
10054050-192 = "咦？唔唔……如果一定要的話也不是不行……"
10054050-193 = "嗚嗚嗚……不過果然還是有點……#n居然要混進那種臭小鬼的組織，還得裝成他們的同伴……！"
10054050-194 = "沒錯。雖然「此時此刻」確實沒有比心菜醬更適合的人選……"
10054050-195 = "不過作為心菜醬的家人……或者進一步作為監護人之一，我也不太贊成這麼做。"
10054050-196 = ""
10054050-197 = "[ns] 「嗯，我也一樣。」"
10054050-198 = "真，真的嗎？姐姐，還有老師……"
10054050-199 = "當然囉，心菜醬。"
10054050-200 = "可是這樣的話，雛鳥組那邊該怎麼辦呢……"
10054050-201 = "不用擔心，姐姐我已經想到一些辦法了。"
10054050-202 = "當然，妃姬大人也是。"
10054050-203 = "那是什麼意思……？"
10054050-204 = ""
10054050-206 = ""
10054050-208 = "（就在這個瞬間……旬和妃姬的眼神交會了！）"
10054050-209 = "（然後……）"
10054050-211 = "是啊，吾等自有妙計。"
10054050-212 = "天色已晚，今日就到此為止吧。#n明日再勞煩汝等前去商店街一帶調查了。"
10054050-213 = "唔嗯……好像大概能猜到你們要做什麼，可是又不太確定……"
10054050-214 = "好！既然妃姬都這麼說了，我們三個就負責調查商店街吧！"
10054050-215 = "好的……我知道了！"
10054050-216 = "嗯，沒有異議。那我們就先回房間去吧。"
10054050-217 = ""
10054050-219 = ""
10054050-220 = ""
10054050-221 = ""
10054050-222 = ""
10054050-224 = ""
10054050-225 = ""
10054050-226 = "[ns1] 「……姑且讓我確認一下。」\n[ns2] 「該不會……是我想的那個吧？」"
10054050-229 = ""
10054050-230 = "呵呵，您覺得呢？"
10054050-231 = "如果老師願意稍微配合一下，事情或許會進行得更順利哦？"
10054050-232 = "是啊。這種時候正需要借助大人的「力量」啊。"
10054050-234 = "（兩人那意味深長的微笑……）"
10054050-235 = "（唯獨今天，不禁讓人感到有點可怕……！）"
