10054050-221 = ""
10054050-222 = ""
10054050-224 = ""
10054050-225 = ""
10054050-226 = "[ns1] \"...I just wanted to ask.\"\n[ns2] \"Is this...going to be what I think it is?\""
10054050-229 = ""
10054050-230 = "Fufu. Who knows?"
10054050-231 = "We may require you to play your own role, Sensei, to help things along."
10054050-232 = "Precisely. Times like these are when an adult's abilities shine brightest."
10054050-234 = "The pair's mysterious smiles..."
10054050-235 = "...sent a bit of a shiver down my spine."
