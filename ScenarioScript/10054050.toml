[translation]
10054050-1 = "Episode 5;A Scary Name"
10054050-2 = "W-Welcome back! We would never dream of doing anything to upset you! We will never forget our place!"
10054050-3 = "It's past your usual lunchtime! W-Would you like something to eat?"
10054050-4 = "We can prepare some pepper steak and flower rolls, r-right away!"
10054050-5 = ""
10054050-7 = ""
10054050-8 = ""
10054050-9 = "Ain't this...BELL PEPPER?"
10054050-10 = "What in the heck are you up to now? You tryna poison us? Don't y'all know we HATE bell pepper?"
10054050-11 = "Useless! Totally useless and stupid! All y'all just wanna get punished, huh?"
10054050-12 = "B-But you wanted pepper steak!"
10054050-13 = "And the name \"pepper\" steak means we use bell peppers!"
10054050-14 = "I-I-It's normally green chili peppers, actually, but we wanted to be considerate! We thought that would make it too spicy for you!"
10054050-15 = "We ain't ask what the recipe is! Don't put in gross stuff like bell peppers (please)!!"
10054050-16 = "And what in the heck is that? A goose?!"
10054050-17 = "F-For our next dish!"
10054050-18 = "Do y'all have no heart at all?! Free it right now!"
10054050-19 = "Y-You said you wanted grilled goose, didn't you?!"
10054050-20 = "And what about it? HUH?!"
10054050-21 = "Hooooonk!!"
10054050-22 = "Eeek?!?! You dang animal! Git! GIT! Do somethin', you useless adults!"
10054050-23 = "B-But...you wanted me to free it!"
10054050-24 = "Can't'cha keep up?! Now we're telling you to do something! Ugh! If y'all ain't the most hopeless people I've ever met..."
10054050-25 = ""
10054050-27 = ""
10054050-28 = ""
10054050-29 = "[ns] \"What's with those kids...?\""
10054050-30 = ""
10054050-31 = "There's one thing I can say about them."
10054050-32 = "They're quite rude."
10054050-33 = ""
10054050-35 = ""
10054050-36 = ""
10054050-37 = "Hm..."
10054050-38 = "Ya' know, I was having a GRAND old day 'til y'all went and RUINED it. "
10054050-39 = "Which means...punishment. "
10054050-40 = ""
10054050-42 = ""
10054050-46 = "No... Nooo... Not my stall... Please..."
10054050-47 = "...Keep your chin up. You can always start over, and we'll be there to help."
10054050-48 = "That's right. All we can do is give each other a helping hand wherever we can."
10054050-49 = "Ick. Ugh. GROSS."
10054050-50 = "Yeah. Gross."
10054050-51 = "All that mushy-gushiness is making me sick. So let's punish them even more."
10054050-52 = "Hey! You three! What do you think you're doing?!"
10054050-53 = "Whozzat? Are y'all...tourists?!"
10054050-54 = "How'd word get out about our spot? It should be us, and only us!"
10054050-55 = "Looks like word spread online. Ugh, this is why I hate short-form content."
10054050-56 = "Eh, we'll fill you losers in then. Try not to be too amazed by our awesome-ness, okay?"
10054050-57 = "How're they supposed to do that? Ain't no kid that wouldn't be green with envy after hearin' about us."
10054050-58 = "We do what we want! Play how we wanna play! And ignore nagging adults who try to order us around! That's our motto!"
10054050-59 = "Fear the name, we're the Peep Syndicate!"
10054050-60 = "Takanosu Suiko, leader of this here group. Kyahahaha!"
10054050-61 = "Me? Iojaku Nagomi. I don't care if you did somethin' to me or didn't. If I've met you or haven't. I get my revenge on anyone who dares cross my path!"
10054050-62 = "You're using \"revenge\" as an excuse to be a menace..."
10054050-63 = "And I'm Utou Youko. Ufufufufufufu... We might look like little kids to you, but our resentment runs deeper than our years!"
10054050-64 = "Eh, now that I'm getting a good look at you..."
10054050-65 = "Wh-What is it?"
10054050-66 = "Get rid of those lame-os and come join us!"
10054050-67 = "You really wanna sit around and listen to a bunch of old people tell you what to do? "
10054050-68 = "Join the Peep Syndicate! You'll getta do anythin' and everythin' ya want! And if someone pisses you off? Just blow 'em away with a rocket launcher!"
10054050-69 = "When you're a kid, sky's the limit!"
10054050-70 = "What are you even saying...?"
10054050-72 = ""
10054050-73 = "H-Here are some corn sticks and sweet milk! Please, take some!"
10054050-74 = "Huh? Corn sticks and sweet milk? Not bad."
10054050-75 = "Not bad, not bad. You ain't as stupid as you look!"
10054050-76 = "How y'all feelin'? What's the next move?"
10054050-77 = "Hmm..."
10054050-78 = "I'm fixin' to go off and eat these, so I reckon we can let 'em off the hook for now."
10054050-79 = "But y'all better not get too comfortable! Next time you piss us off, you can say bye-bye to this whole street!"
10054050-80 = "We'll make a fireworks display so bright, y'all gonna see it even if the sun's out!"
10054050-81 = ""
10054050-83 = ""
10054050-84 = ""
10054050-85 = ""
10054050-86 = ""
10054050-87 = "They're finally gone. Phew..."
10054050-88 = "...Are you okay?"
10054050-89 = "It doesn't matter if I am or not... Not at this point..."
10054050-90 = ""
10054050-91 = "[ns] \"Who...were they?\""
10054050-92 = "The Peep Syndicate is...a gang."
10054050-93 = "A GANG? Those kids?!"
10054050-94 = "I know... They're just kindergarteners, but..."
10054050-95 = "I don't usually use this expression, but could you say... Kids are scary these days?"
10054050-96 = "There's no better way to describe this particular situation..."
10054050-97 = "And they simply appeared one day, with no forewarning?"
10054050-98 = "It wasn't a sudden thing... They more or less meandered in here."
10054050-99 = "They looked around and started saying they were going to make our town their new base."
10054050-100 = "And the result is...what you saw. They do what they want, with no regard for the residents or tourists."
10054050-101 = "Excuse me if this is rude, but why is no one disciplining them? This sets a terrible precedent for their education moving forward."
10054050-102 = "I wish we could...but they have powerful people backing them up."
10054050-103 = "We did try to scold them and set them on the right path at first. But it backfired..."
10054050-104 = "The problem is, they really like this place. So they don't want newcomers or tourists to come in and take it from them."
10054050-105 = "This valley hasn't always been the most well-known spot, but it's really a nice place to visit."
10054050-106 = "A mysterious benefactor invested in us recently, so we were drawing up plans to update our facilities and revitalize the area."
10054050-107 = "But that's when...the Peep Syndicate struck, and they struck hard. They went on a rampage when they found out."
10054050-108 = "..."
10054050-109 = "Forget attracting new customers, we can't even renovate a single bathroom with those kids around."
10054050-110 = "[s] \"Are they staying somewhere in the area?\""
10054050-111 = "Yes, a room in a hotel nearby. It's known for being the oldest one in the valley."
10054050-112 = "It's halfway up the mountain, but you can take a cable car directly to it."
10054050-113 = "A direct cable car to their home..."
10054050-114 = "We don't know who their sponsor is, but it must be someone rich."
10054050-115 = "They were rather kind to Kokona, though, weren't they?"
10054050-116 = "Despite how they act, they're just kids, and it's only adults here. They must've been excited to meet someone their age they could play with."
10054050-117 = "They said once that their goal is to have all the children in Kivotos join the Peep Syndicate."
10054050-118 = "I would never! They have no manners or sense of etiquette at all!"
10054050-119 = "You said your name was Kokona?"
10054050-120 = "Eh? Yes, that's me. I am Sunohara Kokona."
10054050-121 = "Thank you for standing up for us. I hope those kids can grow up to be mature like you."
10054050-122 = "Th-They could take a lesson or two from me! I'm a proper, well-mannered lady."
10054050-123 = ""
10054050-124 = "[ns] \"Isn't she? I'm proud to call her one of my students.\""
10054050-125 = "S-Sensei? Where's all this coming from? Are you teasing me?"
10054050-126 = "Huh? You wouldn't joke at a time like this?"
10054050-127 = "Eheehee. You've finally come to understand my ladylike charms!"
10054050-128 = "Wait! Hold on!"
10054050-129 = "...Does that mean you were teasing me all those other times?"
10054050-130 = "[ns] \"...Uh oh. Did I get caught?\""
10054050-131 = "Sensei!!"
10054050-134 = "Kokona dove after me, red in the face, but it was easy to dance just outside of her reach."
10054050-135 = ""
10054050-136 = "Anyways, we've gone on about our woes for too long now. "
10054050-137 = "He's right. We haven't had new customers in a while!"
10054050-138 = "So we better do our best to give you the full valley treatment! Come in, and make yourselves at home!"
10054050-139 = "Thank you."
10054050-140 = "..."
10054050-141 = "Those pepper steak and flower rolls from earlier sound delicious to me!"
10054050-142 = "Are you sure? They've probably gone cold by now."
10054050-143 = "Even better! Sometimes, pepper steak is best served cold."
10054050-144 = "Yum, pepper steak. But ew, peppers... At least they're not carrots, but still..."
10054050-145 = "Wait, I can't complain! I can't fall to the level of those Peep Syndicate kids!"
10054050-147 = "Even though they were cold, the rolls were delicious."
10054050-149 = ""
10054050-150 = ""
10054050-151 = ""
10054050-152 = ""
10054050-153 = "...What a heartwarming feeling."
10054050-154 = "I haven't gotten to see someone enjoy our food in quite some time."
10054050-155 = "Of course we need money to live, but it's moments like these that keep us going."
10054050-157 = "[ns] \"Now then...\""
10054050-158 = "You wish to discuss how to resolve this conflict we have stumbled upon, yes?"
10054050-159 = "Realistically, we came here with the intention of acting as tourists."
10054050-160 = "This area is not within the bounds of Shanhaijing. We hold no obligation to find a solution to their troubles."
10054050-161 = "I sense a very big \"but\" coming..."
10054050-162 = "Is that so? Then, what is your analysis of the situation, Mina?"
10054050-163 = "We have to look into it!"
10054050-164 = "Those stall owners only charged us half price because our food was cold. They don't deserve what's happening to them."
10054050-165 = "I admire that they haven't given up on their home, despite all they've been through. Our own students could learn a lesson or two from them."
10054050-166 = "And if we fail to repay them, then where has our sense of chivalry gone? Are we no longer proponents of justice?!"
10054050-167 = "How very like you, Mina."
10054050-168 = ""
10054050-170 = ""
10054050-171 = "I might not be able to match her passion, but I agree. As a fellow merchant, I can hardly sit by as someone's business gets harassed for reasons outside of their control."
10054050-172 = "Those Peep Syndicate kids bring shame to students everywhere! I won't let them get away with it!"
10054050-173 = "I've never met children that were so rude and arrogant in my whole life!"
10054050-174 = "If they were attending the Plum Blossom Garden, I would've really given it to them!"
10054050-175 = "[ns] \"What about you, Shun?\""
10054050-176 = ""
10054050-178 = ""
10054050-179 = "Yes."
10054050-180 = "..."
10054050-181 = "Just seeing them brought up many memories for me..."
10054050-182 = "I agree with Rumi. We should do this for the sake of those kind merchants who treated us so fairly."
10054050-183 = "However, I would also like to intervene...for the children's sake."
10054050-184 = "I cannot sit idly by in this situation."
10054050-185 = "If one were to peer through a logistical lens, the meddling of those children has stymied the growth of an area that the Genryumon now holds a vested interest in."
10054050-186 = "The core of our mission is to evaluate if Shanhaijing's funds are being properly used, is it not?"
10054050-187 = "Therefore, our involvement in this matter is simply an extension of said mission."
10054050-188 = "[ns] \"So we're all in agreement! Where should we start?\""
10054050-189 = "Where they're being hit the hardest: the shopping street."
10054050-190 = "We need some sort of envoy to communicate with the Peep Syndicate as well..."
10054050-191 = "But there's really only one person here that they'd be willing to speak to."
10054050-192 = "Me? ...Ugh. I mean, if I have to."
10054050-193 = "But, just so you know, I really, really don't want to. I'm way too dignified to be dealing with brats like them!"
10054050-194 = "While it is true Kokona may be the only candidate as of right now..."
10054050-195 = "As both her older sister and guardian, I must admit, I find myself rather against the idea."
10054050-196 = ""
10054050-197 = "[ns] \"I agree. We should find another way.\""
10054050-198 = "Shun? Sensei? Are you sure?"
10054050-199 = "I would never willingly send you into danger like that, dearest."
10054050-200 = "But then what're you gonna do about the Peep Syndicate?"
10054050-201 = "Don't you worry. I have an idea in mind."
10054050-202 = "And I'm sure Kisaki will participate as well."
10054050-203 = "Huh? What're you talking about?"
10054050-204 = ""
10054050-206 = ""
10054050-208 = "Shun and Kisaki's eyes met and a shared understanding flashed between them."
10054050-209 = "Then...!"
10054050-211 = "Yes, an excellent idea, in fact."
10054050-212 = "However, for today, it is time for one and all to lie in repose. The others will commence their investigation of the shopping street tomorrow morning."
10054050-213 = "Hm... I think I get it, and I think I like it."
10054050-214 = "Then, let's trust in Kisaki and Shun, and the three of us will find out what we can on our end."
10054050-215 = "Yes... Understood!"
10054050-216 = "Understood. Then, we will go rest, as Madam directed. Good night, everyone."
