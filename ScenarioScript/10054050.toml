[translation]
10054050-1 = "ตอนที่ 5;ชื่อที่น่าหวาดหวั่น"
10054050-2 = "มะ... ไม่ใช่อย่างนั้นนะครับ! พวกเรารู้ฐานะของตัวเองดี ใช่ครับ แน่นอนอยู่แล้ว!"
10054050-3 = "นะ... นี่ก็เลยเวลาอาหารกลางวันมาหน่อยแล้ว ให้เราเตรียมอาหารให้มั้ยครับ?"
10054050-4 = "ก่อนอื่นก็เนื้อผัดพริกกับหมั่นโถว...!"
10054050-5 = ""
10054050-7 = ""
10054050-8 = ""
10054050-9 = "อะไรเนี่ย... นี่มันพริกหวานไม่ใช่เหรอ?"
10054050-10 = "กล้าใส่พริกหวานมาด้วยเหรอเนี่ย แต่พวกเราเกลียดพริกหวานยิ่งกว่าอะไร ทั้งไม่มีไหวพริบ แถมยังไม่มีฝีมืออีก"
10054050-11 = "ไม่ได้การแล้ว ผู้ใหญ่แบบนี้ต้องถูกลงโทษนะคะ ฮุฮุฮุฮุ"
10054050-12 = "ตะ... แต่เมื่อวานบอกว่าอยากกินเนื้อผัดพริกนี่นา...!"
10054050-13 = "อีกอย่าง ถ้าเนื้อผัดพริกไม่ใส่พริกเลย มันก็ไม่ถูกต้องตามชื่อเมนูสิครับ...?"
10054050-14 = "ชะชะ... ใช่ครับ! อันที่จริงต้องใช้พริกเขียว แต่พวกเรากลัวว่าพริกเขียวจะเผ็ดจนพวกคุณกินไม่ไหว...!"
10054050-15 = "เรื่องแบบนั้นฉันไม่รู้หรอก! เอาเป็นว่าอย่าใส่พริกหวานเข้าไปแล้วกัน(ค่ะ)!"
10054050-16 = "แล้วนี่อะไร? ห่านเหรอ?"
10054050-17 = "เป็นวัตถุดิบทำอาหารครับ!"
10054050-18 = "ให้ตายสิ ไม่สงสารห่านบ้างหรือไง? รีบปล่อยมันไปเลยนะ!"
10054050-19 = "แต่พวกคุณบอกไว้ว่าอยากกินห่านย่างไม่ใช่เหรอครับ?"
10054050-20 = "อย่าเอาเรื่องนั้นมาปนกับเรื่องนี้ค่ะ"
10054050-21 = "แคว้กกกกกก!!!"
10054050-22 = "ว้าย?! อะ... อะไรเนี่ย??? เจ้าห่านนี่... เป็นแค่สัตว์แท้ๆ! กำจัดมันทิ้งเดี๋ยวนี้เลยนะ!"
10054050-23 = "เอ๋? เมื่อกี้... ยังบอกอยู่เลยนะครับว่าให้ปล่อยมันไป?"
10054050-24 = "ตอนนั้นก็ส่วนตอนนั้น ตอนนี้ก็ส่วนตอนนี้ เป็นผู้ใหญ่แท้ๆ เรื่องแค่นี้ยังไม่รู้อีก ไม่ได้เรื่องเลยจริงๆ"
10054050-25 = ""
10054050-27 = ""
10054050-28 = ""
10054050-29 = "[ns] \"อะไรน่ะ? เด็กพวกนั้น...\""
10054050-30 = ""
10054050-31 = "นั่นสิคะ แต่หนึ่งเรื่องที่แน่นอนก็คือ..."
10054050-32 = "เด็กพวกนั้นออกจะเสียมารยาทไปหน่อยนะคะ"
10054050-33 = ""
10054050-35 = ""
10054050-36 = ""
10054050-37 = "ฮึ่ม..."
10054050-38 = "ไม่ได้การแล้วค่ะ วันนี้อุตส่าห์อารมณ์ดีมาแท้ๆ แต่พวกลุงกลับทำพังหมดเลย "
10054050-39 = "เห็นทีจะต้องลงโทษกันสักหน่อยแล้วค่ะ "
10054050-40 = ""
10054050-42 = ""
10054050-46 = "โธ่... โธ่เอ๊ยย... สุดท้ายแม้แต่แผงขายของนี้ก็..."
10054050-47 = "อย่าเสียใจไปนักเลย... ไม่ต้องเสียใจไปหรอก ฉันจะค่อยๆ ช่วยเอง เราเริ่มใหม่เอาก็ได้"
10054050-48 = "นั่นสินะ เราต้องช่วยเหลือกันสิ ถึงจะอยู่รอด ว่ามั้ย?"
10054050-49 = "รู้สึกไม่สบอารมณ์เลยแฮะ"
10054050-50 = "ใช่ น่าหงุดหงิดชะมัด"
10054050-51 = "แบบนี้ก็ไม่เรียกว่าการลงโทษน่ะสิ หรือว่าต้องจัดให้เจ็บแสบกว่านี้อีกหน่อยคะ? ฮุฮุฮุฮุ"
10054050-52 = "นี่พวกเธอ ทำอะไรกันอยู่น่ะ?!"
10054050-53 = "เธอเป็นใคร หรือว่า... นักท่องเที่ยวเหรอ?"
10054050-54 = "เกิดอะไรขึ้นเนี่ย? นอกจากพวกเราแล้ว ก็ไม่น่าจะมีใครมาที่นี่นี่นา แปลกจัง"
10054050-55 = "ดูเหมือนข่าวลือจะแพร่ไปบนอินเทอร์เน็ตจนได้สินะคะ พวกคลิปสั้นนี่ จริงๆ เลย"
10054050-56 = "เอาเถอะ งั้นจะบอกให้เป็นกรณีพิเศษแล้วกัน ถ้าเธอได้ยินชื่อพวกเราละก็ คงอิจฉาจนต้องรีบขอเข้า#nกลุ่มทันทีเลยแน่ๆ"
10054050-57 = "มันก็แน่อยู่แล้ว ไม่ว่าเด็กคนไหน ถ้าได้ยินชื่อนี้แล้วก็ไม่มีทางอยู่เฉยหรอก"
10054050-58 = "ถ้างั้นฉันจะบอกให้ฟังนะคะ พวกเราที่ยึดคติว่า อยากทำอะไรก็ทำ อยากเล่นยังไงก็เล่น และไม่ฟังคำบ่นไร้สาระอะไรทั้งนั้น..."
10054050-59 = "นามนั้นช่างน่าหวาดหวั่น... เพราะพวกเราคือ แก๊งลูกเจี๊ยบ!"
10054050-60 = "ฉันคือทาคาโนสึ ซุยโกะ! เป็นคนแรกที่ก่อตั้งแก๊งนี้ขึ้นมา วะฮ่าฮ่าฮ่า!"
10054050-61 = "ส่วนฉันก็อิโอจาคุ นาโกมิ ถ้าโดนทำอะไร จะเอาคืนสิบเท่า ต่อให้ไม่โดนก็จะแก้แค้น ต่อให้ไม่เคยเห็นหน้าก็จะแก้แค้น ไม่ว่าจะเป็นใคร ถ้ามาเจอเข้าละก็ จบเห่แน่"
10054050-62 = "แบบนั้นมันสร้างความเดือดร้อนให้คนอื่นไม่ใช่เหรอ..."
10054050-63 = "ฉันชื่ออูโตะ โยโกะค่ะ ฮุฮุฮุฮุ ฮุฮุฮุ... ความแค้นของเด็กๆ น่ะ ฝังลึกกว่าที่คิดนะคะ?"
10054050-64 = "หืม...? จะว่าไป เธอน่ะ..."
10054050-65 = "ทะ... ทำไมเหรอ...?"
10054050-66 = "ทิ้งพวกผู้ใหญ่น่าเบื่อแบบนั้น แล้วมาเข้าแก๊งกับพวกเรามั้ย?"
10054050-67 = "ใช่ เทียบกับผู้ใหญ่ที่เอาแต่พูดเรื่องคร่ำครึแล้ว แก๊งลูกเจี๊ยบของเราสนุกกว่ากันเยอะเลยนะ? "
10054050-68 = "แก๊งของเราน่ะ อยากทำอะไรก็ทำได้หมด ไม่อยากทำอะไรก็ไม่ต้องทำ ส่วนอะไรที่ขัดหูขัดตา#nก็เป่าให้กระเด็นไปได้หมดเลย"
10054050-69 = "นั่นก็เพราะเด็กทุกคนมีความเป็นไปได้อันไร้ขีดจำกัดยังไงล่ะคะ ฮุฮุ ฮุฮุฮุฮุ..."
10054050-70 = "พวกเธอพูดเรื่องอะไรกันน่ะ..."
10054050-72 = ""
10054050-73 = "พะ... พวกเราเตรียมขนมข้าวโพดกรอบกับนมรสสตรอว์เบอร์รีไว้ให้แล้วครับ! มากินกันก่อนสิครับ...!"
10054050-74 = "เอ๋? ขนมข้าวโพดกรอบกับนมรสสตรอว์เบอร์รีเหรอ? นั่นมันของอร่อยที่ฉันชอบเลย..."
10054050-75 = "อะไรกัน เป็นผู้ใหญ่ที่ไม่มีไหวพริบแท้ๆ แต่ของที่เอามาก็ใช้ได้เหมือนกันนี่?"
10054050-76 = "เอายังไงดีคะ? ฮุฮุ ฮุฮุฮุฮุ..."
10054050-77 = "อืม..."
10054050-78 = "เอาเถอะ วันนี้อารมณ์ดีขึ้นแล้ว จะยอมปล่อยผ่านให้ก็แล้วกัน!"
10054050-79 = "แต่คราวหน้าจะไม่ใจดีให้หรอกนะ? ถึงตอนนั้น ฉันจะเผาย่านนี้ให้กลายเป็นทะเลเพลิงเลย"
10054050-80 = "คงจะกลายเป็นดอกไม้ไฟที่สว่างจนมองเห็นได้ทั้งกลางวันและกลางคืนเลยสินะคะ ฮุฮุฮุฮุฮุ..."
10054050-81 = ""
10054050-83 = ""
10054050-84 = ""
10054050-85 = ""
10054050-86 = ""
10054050-87 = "ไปกันได้เสียทีนะ เฮ้อ..."
10054050-88 = "เป็นยังไงบ้าง...?"
10054050-89 = "ต่อให้ไม่ไหวก็ต้องทำเหมือนว่าไหว จะให้ทำยังไงได้ล่ะ"
10054050-90 = ""
10054050-91 = "[ns] \"เด็กพวกนั้น... เป็นใครกันน่ะ?\""
10054050-92 = "'แก๊งลูกเจี๊ยบ'... เป็นกลุ่มนักเลงน่ะ"
10054050-93 = "ว่าไงนะ? กลุ่ม... นักเลง?! ดูเป็นเด็กอนุบาลอยู่เลยแท้ๆ...!?"
10054050-94 = "ใช่... พวกนั้นเป็นเด็กอนุบาล"
10054050-95 = "ถึงจะไม่ค่อยชอบคำพูดแบบนี้ก็เถอะ แต่นี่คงเป็นอย่างที่เขาว่ากันใช่มั้ยคะ? ที่บอกว่าเด็กสมัยนี้น่ากลัว หรืออะไรทำนองนั้นน่ะค่ะ"
10054050-96 = "ดูเหมือนคำพูดนี้จะเข้ากับสถานการณ์ตอนนี้พอดีเลยละ..."
10054050-97 = "กลุ่มเด็กที่จู่ๆ ก็ปรากฏตัวขึ้นอย่างนั้นหรือ?"
10054050-98 = "จะว่าจู่ๆ... ก็ไม่เชิง เด็กๆ พวกนั้นมาที่นี่ได้สักพักใหญ่แล้ว"
10054050-99 = "ได้ยินว่าจะใช้ที่นี่เป็นฐานใหม่ หรืออะไรทำนองนั้นน่ะ..."
10054050-100 = "ก็อย่างที่เห็นว่าเด็กพวกนั้นทำอะไรตามใจตัวเองไปหมด น่าปวดหัวจริงๆ"
10054050-101 = "แต่ว่า... ทำไมถึงปล่อยไว้เฉยๆ ไม่ทำอะไรเลยล่ะคะ? อย่างน้อยก็ควรอบรมสั่งสอนเด็กพวกนั้นสิคะ"
10054050-102 = "...จะว่ายังไงดี เด็กพวกนั้นมีคนหนุนหลังที่มีอำนาจอยู่พอตัวน่ะ"
10054050-103 = "แน่นอนว่าพวกเราก็เคยลองดุหรืออบรมสั่งสอนแล้ว... แต่ว่า... ด้วยเรื่องหลายๆ อย่าง ก็เลยไม่ค่อยได้ผลน่ะ"
10054050-104 = "ดูเหมือนพวกนั้นจะถูกใจที่นี่มาก ก็เลยคิดจะใช้กันแค่พวกตัวเองด้วย"
10054050-105 = "ใช่... ถึงที่ผ่านมาจะไม่ค่อยเป็นที่รู้จัก แต่หุบเขาแห่งนี้เป็นสถานที่ที่ยอดเยี่ยมนะ"
10054050-106 = "เมื่อไม่นานมานี้ก็เพิ่งได้รับเงินลงทุนเข้ามา ว่าจะใช้เงินนั่นปรับปรุงร้านแล้วเริ่มกิจการใหม่แท้ๆ..."
10054050-107 = "แต่ก็อย่างที่เห็นนั่นแหละ ในจังหวะนั้นเด็กๆ แก๊งลูกเจี๊ยบ... ก็เริ่มมาก่อความวุ่นวาย"
10054050-108 = "..."
10054050-109 = "ตอนนี้เลยกลายเป็นว่า จะต้อนรับลูกค้าก็ทำได้ไม่เต็มที่ จะขยายหรือปรับปรุงร้านก็... ไม่ได้ทำกันได้ง่ายๆ เลย"
10054050-110 = "[s] \"ถ้าอย่างงั้น เด็กพวกนั้นก็พักอยู่แถวๆ นี้เหรอ?\""
10054050-111 = "ใช่ พวกนั้นจองห้องไว้ที่... โรงแรมที่เก่าแก่ที่สุดในหุบเขานี้"
10054050-112 = "เป็นโรงแรมที่อยู่กลางไหล่เขา มีเคเบิลคาร์เชื่อมตรงไปถึงเลย"
10054050-113 = "นั่งเคเบิลคาร์เข้าไปได้... สินะคะ"
10054050-114 = "ใช่... ถึงขั้นใช้สถานที่ระดับนั้นได้ แสดงว่าเด็กพวกนั้นไม่ธรรมดาเลยละ"
10054050-115 = "ว่าแต่ ดูเหมือนพวกเธอพยายามทำดีกับโคโคน่าจังนะคะ?"
10054050-116 = "คงเพราะคิดว่าจะมีเด็กที่น่าจะพูดคุยกันเข้าใจเพิ่มมาอีกคนละมั้ง"
10054050-117 = "พวกนั้นยังเคยบอกว่าสักวันจะทำให้เด็กทุกคนในคิโวทอสกลายเป็นสมาชิกแก๊งลูกเจี๊ยบด้วย"
10054050-118 = "เด็กเหลวไหลพวกนี้... ฉันเกลียดเด็กที่ไม่รู้กาลเทศะ แถมยังไม่มีมารยาทแบบนั้นที่สุดเลยค่ะ!"
10054050-119 = "เมื่อกี้บอกว่าชื่อโคโคน่า... ใช่มั้ย?"
10054050-120 = "คะ? ใช่ค่ะ ฉันสึโนฮาระ โคโคน่าค่ะ"
10054050-121 = "น่าชื่นชมจริงๆ แล้วก็... ดูโตเป็นผู้ใหญ่มากเลยนะ ถ้าเด็กพวกนั้นเอาอย่างโคโคน่าบ้างสักนิดก็คงดีนะ"
10054050-122 = "นะ... แน่นอนค่ะ! ฉันเป็นกุลสตรีเต็มตัวอยู่แล้วค่ะ!"
10054050-123 = ""
10054050-124 = "[ns] \"ใช่แล้ว โคโคน่าเป็นนักเรียนที่น่าภาคภูมิใจของพวกเรา\""
10054050-125 = "คะ... คุณครู...? จู่ๆ พูดอะไรแบบนั้นคะ? ถึงจะฟังแล้วรู้สึกขอบคุณก็เถอะ..."
10054050-126 = "คะ? คุณครูจะบอกว่าตอนนี้ไม่ได้พูดล้อเล่นส่งเดชเหรอคะ? ระ... เรื่องนั้น..."
10054050-127 = "ใน... ในที่สุดคุณครูก็มองเห็นเสน่ห์ของฉันแล้วสินะคะ! ต้องเป็นอย่างนี้แน่ๆ ค่ะ!"
10054050-128 = "เดี๋ยวก่อนค่ะ แต่ว่า ถ้างั้นก็แสดงว่า..."
10054050-129 = "ปกติคุณครูแกล้งหรือพูดล้อเล่นกับฉันจริงๆ สินะคะ...?"
10054050-130 = "[ns] \"ความแตกแล้วเหรอเนี่ย...?\""
10054050-131 = "คุณ~ ครู~!!!"
10054050-134 = "(ครูจงใจวิ่งหนีโคโคน่าที่หน้าแดงก่ำและกำลังไล่ตามมา โดยรักษาระยะไว้แบบฉิวเฉียดจนเหมือนจะ#nถูกจับได้อยู่รอมร่อ!)"
10054050-135 = ""
10054050-136 = "เอาเป็นว่า ขอบคุณที่มาเยือนที่นี่นะ "
10054050-137 = "ฮ่าฮ่าฮ่า... รู้สึกเหมือนไม่ได้ต้อนรับลูกค้ามานานมากแล้วเลย"
10054050-138 = "พวกเราจะต้อนรับให้ดีที่สุดเท่าที่ทำได้ เพราะงั้นก็พักผ่อนให้เต็มที่เลยนะ"
10054050-139 = "ขอบคุณนะคะ"
10054050-140 = "..."
10054050-141 = "ถ้างั้นก็ ขอเนื้อผัดพริกกับหมั่นโถวเมื่อกี้ก่อนเลยค่ะ!"
