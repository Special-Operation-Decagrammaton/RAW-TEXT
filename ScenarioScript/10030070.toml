[translation]
10030070-1 = "제7화;첫 풍경"
10030070-5 = "으음…… 으으으……"
10030070-9 = "마키, 이제 슬슬 일어나."
10030070-10 = "오늘은 새벽 일찍 일어나 다 같이 새해 첫 일출을 보러 가기로 했잖아?"
10030070-16 = "하지만…… 10분만 더 자면 안 돼……?"
10030070-17 = "안 돼. 해가 뜨기 전에 정상에 도착하려면 지금 출발해도 아슬아슬할 정도니까."
10030070-18 = "얼른 일어나서 장비 정리하고 올라갈 준비해. 새벽 공기가 차니까 옷 단단히 챙겨 입는 거 잊지 말고."
10030070-19 = "응……"
10030070-25 = "[ns1] \"좋은 아침, 마키.\"\n[ns2] \"새해 복 많이 받아.\""
10030070-26 = "좋은 아침, 선생님……"
10030070-27 = "선생님도 새해 복 많이 받아……"
10030070-28 = "……그러고 보니 오늘이 새해 첫날이었구나."
10030070-29 = "보통 새해 첫날은 밤새 깨어 있다가 아침에 잠들기 때문에 이 시간에 일어나는 건 좀 신기한 느낌인걸……"
10030070-30 = "아니, 생각해 보면 일찍 자고 일찍 일어나는 경우가 애초에 거의 없었던 것 같기도 하고……"
10030070-36 = "……마키도 일어났구나."
10030070-37 = "좋은 아침입니다, 선생님."
10030070-38 = "[s] \"두 사람도 좋은 아침이야.\""
10030070-39 = "하암…… 졸려……"
10030070-40 = "이럴 때는 고카페인 에너지 드링크를 한 잔 들이켜야 정신이 드는데……"
10030070-41 = "저도 오늘만큼은 에너지 드링크를 마시고 싶은 기분입니다……"
10030070-46 = "에너지 드링크는 없지만 커피라면 아침에 진하게 내려놓은 게 있으니까."
10030070-50 = "자, 입맛이 없더라도 초콜릿 바 한 개 정도는 같이 먹어둬. 아침 산행은 에너지가 중요하니까."
10030070-51 = "그리고 혹시라도 몸에 이상이 느껴진다면 바로 보고해야 해. 알았지?"
10030070-56 = "네~"
10030070-58 = "(이후, 간단하게 채비를 정비한 뒤 정상을 향해 산행을 시작했다.)"
10030070-63 = "헉, 헉……"
10030070-64 = "벌써부터…… 체력의 한계가……"
10030070-65 = "힘들어~"
10030070-66 = "선배~ 정상에 도착하려면 아직 멀었어?"
10030070-71 = "이제 절반 정도 왔으니까, 조금만 더 힘내자."
10030070-75 = "……그보다 날씨가 심상치 않네."
10030070-76 = "이대로 가면 정상에 도착해도 일출을 보기 어려울지도……"
10030070-83 = "어라? 방금 저쪽 수풀, 흔들리지 않았어?"
10030070-84 = "서, 설마…… 어제처럼 곰이 다시 나타난 건……"
10030070-85 = "히이……"
10030070-101 = "어라, 베리타스의 부원 여러분? 그리고 트레이너까지……"
10030070-108 = "아, 스미레 선배다. 안녕!"
10030070-110 = "안녕하세요, 마키 양. 여기서 다시 마주치게 될 줄은 몰랐네요."
10030070-111 = "다들 새해 복 많이 받으시길 바랍니다."
10030070-112 = "[s] \"스미레도 새해 복 많이 받아.\""
10030070-114 = "[ns] \"어젯밤은 잘 잤어?\""
10030070-118 = "아뇨. 오랜만의 야외 합숙에 들뜬 탓인지, 어젯밤은 제대로 잠을 이루지 못했답니다……"
10030070-119 = "그래서 덜 풀린 몸의 긴장을 풀기 위해 아침 운동 삼아 등산을 하던 중이었습니다."
10030070-120 = "가볍게 몸을 움직이니 조금은 활력이 돌아오는 것 같네요."
10030070-121 = "조금도 가볍지 않았거든요?!"
10030070-122 = "안 그래도 어제 한 운동의 피로가 제대로 풀리지도 않았는데, 등산로가 아닌 험한 길을 따라 몇 차례나 전력 질주를 하다니……"
10030070-123 = "스미레 선배의 운동 신경은 도대체 어떻게 된 건가요?!"
10030070-124 = "후후, 몸은 쓰는 만큼 강해진다고 하니까요."
10030070-125 = "레이 양도 저와 함께 지속적인 트레이닝을 계속하신다면 내년 시즌에는 연타석 홈런을 치는 것도 꿈은 아닐 겁니다."
10030070-129 = "연타석 홈런이라면…… 어쩔 수 없지만."
10030070-130 = "그나저나 다들 이런 새벽부터 등산이라니, 드문 일이네요."
10030070-131 = "……혹시 새해 결심으로 베리타스 여러분도 운동에 취미를 붙여 보기로 결심하신 건가요?"
10030070-133 = "운동에 취미까지 붙일 생각은 없었지만……"
10030070-134 = "부부장의 권유로 새해 첫 일출을 보러 정상에 오르던 중이었습니다."
10030070-136 = "음…… 새해 첫 일출이 목적이라면……"
10030070-140 = "죄송하지만, 이번 일출 구경은 포기하시는 게 좋을지도 모르겠습니다."
10030070-144 = "어째서?!"
10030070-145 = "아직 해가 뜨지 않아서 잘 보이진 않지만, 지금도 하늘에 구름이 꽤 끼어 있거든요."
10030070-146 = "이런 흐린 날씨라면 해가 뜨더라도 일출을 온전히 감상하기 어려울 가능성이 높아서……"
10030070-147 = "모처럼 기대를 품고 산에 오셨는데, 오히려 실망을 하게 되실지도 모릅니다."
10030070-149 = "분명 기상예보에서는 맑을 예정이라고 들었는데……"
10030070-150 = "[s] \"이를 어쩌지……\""
10030070-155 = "……다들 어떻게 할래?"
10030070-156 = "내가 먼저 제안하긴 했지만, 날씨가 따라주지 않는데 정상까지 무리해서 오를 필요는 없으니까."
10030070-165 = "……계속 갈래."
10030070-166 = "그래. 역시 돌아가고 싶어 할 줄 알았—"
10030070-170 = "……응? 계속 정상까지 가겠다고?"
10030070-171 = "음, 모처럼 밖에 나왔으니까."
10030070-173 = "여기까지 올라왔으니, 정상을 밟지 못하고 돌아가는 편이 더 신경 쓰일 것 같습니다."
10030070-174 = "지루한 반복 플레이를 즐기는 스타일은 아니지만……"
10030070-175 = "그래도 보스전을 앞두고 게임 패드를 내던질 수는 없지!"
10030070-177 = "하지만 정상까지 가려면 아직 절반이나 남았는데……"
10030070-178 = "너희들…… 고생은 고생대로 하면서 성과는 없는 작업, 싫어하지 않았었어?"
10030070-180 = "물론 막상 정상에 올랐는데 일출을 보지 못한다면 아쉽겠지만……"
10030070-181 = "해가 뜨는 광경은 부실에 설치된 모니터로도 얼마든지 볼 수 있으니까요."
10030070-182 = "우리가 체험해 보지 못한 건 산을 오르는 경험뿐이야."
10030070-188 = "……이번 새해 일출은 서쪽에서 뜨는 해를 보게 되려나."
10030070-189 = "멋진 마음가짐이로군요!"
10030070-190 = "흔히 간과하는 사실이지만 트레이닝의 진정한 가치는 멋진 몸을 만드는 것보다, 그 상태에 도달하기 위해 운동을 반복하는 과정 속에 있는 법이니까요."
10030070-191 = "마찬가지로 등산의 가치 또한 정상이 아닌, 산을 오르는 여정 속에 존재하는 법!"
10030070-193 = "그 마음가짐에 깊이 동감하는바. 저희 트레이닝부도 정상까지의 여정에 함께 하겠습니다!"
10030070-194 = "레이 양! 지금부터 정상을 향해 전력으로 질주하도록 하죠!"
10030070-198 = "잠깐, 선배! 오늘 트레이닝은 정상까지 오르지 않고 산 중턱에서만 진행한다고 했잖아요?!"
10030070-206 = "어째서——!"
10030070-211 = "그럼 다 같이 힘을 모아 정상까지 가 볼까?"
10030070-212 = "일출 시각도 얼마 남지 않았으니 서두르자."
10030070-228 = "……도착이야."
10030070-229 = "이곳이 히가시다케 산의 정상이야."
10030070-233 = "우와, 바람이 엄청 불어!"
10030070-234 = "탁 트인 정상에 올라서 그런지 더 추운 느낌입니다……"
10030070-235 = "구름이 걷혔나? 어두워서 잘 보이지가 않는데……"
10030070-238 = "글쎄요. 지금은 모르겠지만……"
10030070-242 = "아, 하늘이 조금씩 밝아진다."
10030070-243 = "드디어 해가 뜨려는 건가?"
10030070-253 = "아……"
10030070-254 = "……아름답다."
10030070-255 = "순식간에 하늘을 빛으로 물들였어……"
10030070-256 = "커다란 모니터로 일출을 본 경험은 많지만, 실제로 보니 확실히 느낌이 다르네……"
10030070-257 = "훨씬 더 화려하고, 훨씬 더 반짝일뿐더러……"
10030070-258 = "……훨씬 더 따듯해."
10030070-262 = "고행 끝에 마주한 정상의 경치는, 그 무엇과도 견줄 수 없는 황홀한 자극이 되는 법이니까요."
10030070-263 = "……역시 직접 보러 오길 잘했지?"
10030070-268 = "응."
10030070-269 = "이번에는 먼저 권해줘서 고마워, 선배."
10030070-270 = "처음에 일출을 보러 캠핑을 가자고 했을 때는 귀찮은 마음뿐이었지만……"
10030070-271 = "지금은 부부장이 어떤 느낌으로 캠핑을 권했는지 알 것 같습니다."
10030070-273 = "그렇게 생각해 주니 오히려 고맙네."
10030070-277 = "……세상에는 직접 체험해 보지 않으면 느낄 수 없는 것들이 잔뜩 있으니까."
10030070-283 = "방금 그 소리는……"
10030070-288 = "레이 양, 혹시 시장하신가요?"
10030070-289 = "그, 그건…… 그게 그러니까……"
10030070-290 = "어쩔 수 없잖아요! 아침 일찍부터 일어나 유산소 운동을 계속했는데, 배가 고플 수밖에……"
10030070-292 = "그럼 우리 쪽 캠프로 돌아가서 다같이 아침 식사를 하지 않을래?"
10030070-293 = "아침은 간단하게 먹을 수 있도록 빵을 좀 챙겨왔거든."
10030070-298 = "[ns] \"빵에 곁들여 먹을 수 있는 잼과 버터도 있어.\""
10030070-300 = "아, 그럼 나는 잼이랑 버터로 빵에 그림을 그려서 먹을래!"
10030070-301 = "저는 버터 바른 빵 한 조각이면 충분합니다만……"
10030070-302 = "나는 빵보다는 커피를 한 잔 더 마시고 싶어……"
10030070-305 = "프로틴 쉐이크에 곁들인다면 제법 괜찮은 아침이 될 것 같군요."
10030070-306 = "그래, 그래. 캠프로 돌아가면 각자 취향껏 만들어 먹자고."
