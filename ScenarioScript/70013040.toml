70013040-29 = "ฉันก็ไม่รู้หรอก แต่ดูจากที่บอสระแวงมากขนาดนั้น อาจจะอยู่ระดับเดียวกับอาเคมิ ที่เป็นเจ็ดอาชญากรก็ได้นะ?"
