[translation]
70013040-1 = "雜草不會獨自綻放（４）"
70013040-2 = ""
70013040-3 = "利加托尼家族佔領的飯店正門"
70013040-5 = ""
70013040-6 = "利加托尼家族佔領的飯店後門"
70013040-10 = "附近其他大樓的頂樓"
70013040-11 = ""
70013040-12 = "哇哦，真是戒備森嚴。想直接闖進去恐怕很難耶？"
70013040-13 = "怎，怎麼辦？也聯絡不上亞瑠大人……#n再這樣下去真的會出大事的……！"
70013040-14 = "咯呵呵。不用擔心，我有辦法。"
70013040-15 = "遙香醬，先來換衣服吧。"
70013040-16 = "衣服？什麼樣的衣服……？"
70013040-17 = "就算靠近那些傢伙也不會被識破的衣服！"
70013040-19 = "（過了一會……）"
70013040-20 = ""
70013040-21 = "開，開始了嗎？要，要炸掉他們嗎！？"
70013040-22 = "唔嗯，先等一下。#n那些傢伙好像在說些什麼，我們來聽聽看吧。"
70013040-23 = "……唉，到底有什麼事需要在這種深夜緊急集合啊？"
70013040-24 = "聽說是抓到了之前冒犯老大的那些傢伙，結果有幾個人不知道逃到哪裡去了。"
70013040-25 = "嗯？逃了幾個？"
70013040-26 = "兩個。"
70013040-27 = "不是吧……就為了區區兩個人把組織成員全都召集起來？"
70013040-28 = "到底是多厲害的傢伙啊？"
70013040-29 = "我也不知道。#n看老大這麼緊張兮兮，搞不好跟七罪人的明美同等級？"
70013040-30 = "喂喂，怎麼可能還有那種怪物？別鬧了。"
70013040-31 = "說是組織成員全都到齊了……"
70013040-32 = "咯呵呵。這樣反而更好，可以炸個過癮了。"
70013040-33 = "那我們走吧，遙香醬。"
70013040-34 = ""
70013040-39 = ""
70013040-40 = "哎呀～這麼晚了，辛苦你們啦。"
70013040-41 = "辛，辛苦了……！"
70013040-42 = "嗯？你們是什麼人？"
70013040-43 = "不是召集全員嗎？我們因為有點事所以來晚了。"
70013040-44 = "沒見過你們呢……是新來的嗎？"
70013040-45 = "嗯，所以有很多不懂的地方。"
70013040-46 = "聽說抓到了什麼厲害傢伙的老大？有好好關在安全的地方不讓他們跑掉吧？"
70013040-47 = "跟老大一起在最頂層，應該沒問題吧？"
70013040-48 = "咯呵呵，這樣啊。謝謝你！"
70013040-49 = "作為回答問題的謝禮，我就送你一份特別的禮物吧。"
70013040-50 = ""
70013040-52 = ""
70013040-53 = ""
70013040-54 = ""
70013040-55 = "嗯？怎麼這麼突然……"
70013040-60 = "入，入口發生了爆炸……！？"
70013040-61 = "喂！那邊發生什麼事了！？"
70013040-62 = ""
70013040-63 = ""
70013040-64 = "好！趁他們一片混亂的時候，一口氣衝到最頂層吧！"
70013040-65 = "請等等我，亞瑠大人！我馬上過去……！"
70013040-66 = ""
70013040-68 = ""
70013040-70 = "快，快確認監視器！找出入侵者……！！"
70013040-71 = "在，在中央走廊！快追上去！！"
70013040-72 = ""
70013040-73 = "飯店下層中央走廊"
70013040-77 = ""
70013040-78 = ""
70013040-80 = ""
70013040-83 = ""
70013040-84 = "什麼！？那些傢伙打進來了！？"
70013040-85 = "攔住他們！絕對不能讓他們上來……！！"
70013040-86 = "可，可是那些傢伙……明明很矮小卻比想像中還要厲害……！"
70013040-87 = "唔，唔啊啊啊啊……！！"
70013040-88 = "你們這些混蛋！整個組織的人竟然被區區兩個人耍得團團轉！？"
70013040-89 = "哼哼哼……"
70013040-90 = ""
70013040-92 = ""
70013040-93 = ""
70013040-94 = "畢竟老大是這副德性，手下自然也不會好到哪裡去啊。"
70013040-95 = "從這層意義上來說，我們的員工可是頂尖中的頂尖呢。"
70013040-96 = "竟敢來找我們麻煩。"
70013040-97 = "這次你可是犯下大錯了。"
70013040-98 = "唔……！被綁著還那麼囂張！"
70013040-99 = ""
70013040-101 = ""
70013040-102 = ""
70013040-103 = ""
70013040-104 = "哎呀？你拿那個是打算對我開槍嗎？"
70013040-105 = "儘管動手吧。"
70013040-106 = "不過唯獨這一點，你可要記清楚。"
70013040-107 = "要是我們的員工趕到的時候發現我受了傷……你覺得他們會有什麼反應？"
70013040-108 = "勸你最好三思而後行哦。"
70013040-109 = "唔唔唔……！"
70013040-110 = ""
70013040-112 = ""
70013040-113 = "社長……你挺大膽的嘛？"
70013040-114 = "嚇，嚇死我了……！老實說剛才真的很可怕……！！"
70013040-115 = ""
70013040-117 = ""
70013040-118 = "（……可是我得撐住）"
70013040-119 = "（因為我相信我的員工們……！）"
