70013040-13 = "ทะ... ทำยังไงดีล่ะคะ? ตอนนี้ติดต่อกับท่านอารุไม่ได้ด้วย... ถ้าขืนเป็นแบบนี้ต้องเกิดเรื่องใหญ่แน่ๆ...!"
