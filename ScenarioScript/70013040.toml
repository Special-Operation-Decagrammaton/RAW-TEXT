70013040-150 = ""
70013040-151 = ""
70013040-154 = ""
70013040-155 = ""
70013040-156 = "遙香醬！你沒事吧！？"
70013040-157 = "沒，沒事！只是稍微擦到而已！"
70013040-158 = "繼續往上吧！"
70013040-159 = "亞瑠大人……一定在等著我們……！"
70013040-161 = ""
70013040-163 = "什麼……！？已經快打到這裡來了！？"
70013040-164 = "怎，怎麼可能！才兩個人到底是怎麼辦到的……！！"
70013040-165 = "你從那時候開始就完全沒長進呢。"
70013040-166 = "不，反而應該說是退步了吧。"
70013040-167 = "相反地，我們可是比那時候強多了。"
70013040-168 = "被你欺負過的那個柔弱的孩子……#n如今已經變成了我們便利屋68最頂尖的爆破工作員。"
70013040-169 = "剛才四處響起的爆炸聲，全都是那孩子的傑作。"
70013040-170 = "怎麼樣？#n站上因為自己的過錯而造就的審判台，被一點一點地勒緊咽喉的滋味如何啊？"
70013040-171 = "噫噫噫……！"
70013040-172 = ""
70013040-174 = ""
70013040-175 = ""
70013040-176 = "社長……沒想到你說那種話還挺有氣勢的呢？"
70013040-177 = "我，我也沒想到自己能講得這麼好……！"
70013040-180 = ""
70013040-181 = ""
70013040-182 = ""
70013040-183 = "終，終究還是打到這裡來了嗎……！！"
70013040-184 = ""
70013040-186 = ""
70013040-187 = ""
70013040-188 = "亞瑠大人！佳世子課長……！你們沒事吧！？我們來救你們了……！！"
70013040-189 = "哼哼哼，我一直相信著你們哦。"
70013040-190 = "我們沒事，別擔心。"
70013040-191 = ""
70013040-193 = ""
70013040-194 = ""
70013040-195 = "咯呵呵。#n那麼……是不是該給那個害我們吃盡苦頭的胖子老大一點懲罰了？"
70013040-196 = "……"
70013040-197 = "哼，哼哼哼……"
70013040-198 = "哼哈哈哈哈……！"
70013040-199 = "你們這些蠢蛋！剛才說誰要懲罰誰啊！？"
70013040-200 = "要被懲罰的……是你們才對！"
70013040-201 = "出來吧！傭兵們……！！"
70013040-202 = ""
70013040-204 = ""
70013040-206 = "什，什麼！？那些傢伙居然一直藏在牆壁後面嗎！？"
70013040-207 = "被包圍了……！無月！遙香！小心！"
70013040-209 = "哼哈哈哈哈，你們再怎麼囂張也就到此為止了！"
70013040-211 = "全體射擊……！！"
70013040-212 = ""
70013040-215 = ""
70013040-221 = ""
70013040-222 = "彈藥耗盡，已鎮壓完畢。"
70013040-223 = "哼哼哼……哼哈哈哈！！"
70013040-224 = "再厲害的傢伙，吃了這麼多子彈也不可能全身而退。"
70013040-225 = "便利屋的社長！接下來就輪到你了……！"
70013040-226 = ""
70013040-227 = "……"
70013040-228 = "……不，還沒結束呢。你看那邊。"
70013040-229 = ""
70013040-230 = ""
70013040-231 = ""
70013040-232 = "……"
70013040-233 = "什麼──！？"
70013040-234 = ""
70013040-235 = "咳，咳咳咳！"
70013040-236 = "唔唔……謝謝你幫我擋下來，遙香醬。#n果然論抗打能力，遙香醬比我還要厲害呢……"
70013040-238 = ""
70013040-239 = "怎，怎麼回事？竟然能撐過那種火力……！"
70013040-240 = "什麼啊……你，你到底是什麼人……！？"
70013040-241 = ""
70013040-242 = "我是……雜草……"
70013040-243 = "怎麼踩都踩不死的……雜草。"
70013040-244 = ""
70013040-246 = ""
70013040-247 = "……"
70013040-248 = "我要讓你永遠消失。"
70013040-249 = "竟敢把亞瑠大人……還有佳世子課長當成人質……"
70013040-250 = "還想在我面前傷害無月室長……"
70013040-251 = "不可饒恕……"
70013040-252 = "不可饒恕不可饒恕不可饒恕不可饒恕不可饒恕不可饒恕不可饒恕……！"
70013040-253 = "不可饒恕──！！"
70013040-254 = "噫，噫噫噫噫！？"
70013040-255 = ""
70013040-265 = ""
70013040-266 = ""
70013040-267 = ""
70013040-268 = "饒，饒命啊……！我，我再也不會出現在你們面前了……！！"
70013040-269 = "拜，拜託了！求，求求你們……！！"
70013040-270 = "……"
70013040-271 = "……亞瑠大人，該怎麼辦呢？"
70013040-272 = "哼，饒他一命吧。"
70013040-273 = "對於名譽已經掃地的那傢伙來說，活著或許才是更可怕的懲罰。"
70013040-274 = "沒錯。就讓他一輩子在底層爬行，時時刻刻想起今天這一切。"
70013040-276 = "想起真正冷酷無情的硬派法外之徒……究竟是誰！"
70013040-277 = "噫，噫噫噫……！"
70013040-278 = "……耶嘿嘿。#n亞瑠大人果然很帥氣。"
70013040-279 = "要不是亞瑠大人……你可沒這麼好運。"
70013040-280 = ""
70013040-285 = "唔，唔啊……！！"
70013040-286 = ""
70013040-288 = ""
70013040-290 = ""
70013040-291 = "亞瑠醬、佳世子醬，你們沒事吧？"
70013040-292 = "嗯，我們沒事哦。"
70013040-293 = "真該讓你們也看看社長嚇唬那個胖老大的樣子。"
70013040-294 = "哼哼。反正我那副硬派的模樣以後還能時常看到，所以就別太惋惜了。"
70013040-295 = ""
70013040-297 = ""
70013040-298 = ""
70013040-299 = "耶嘿嘿……太好了呢……"
70013040-300 = ""
70013040-302 = ""
70013040-304 = "遙，遙香……！"
70013040-305 = "遙香醬……！"
70013040-306 = "唔……"
70013040-308 = "……"
70013040-309 = "……沒什麼大礙。#n看起來只是有點累了而已。"
70013040-310 = "……"
70013040-311 = "……謝謝你，遙香。#n這次真的欠了你一個大人情。"
70013040-312 = ""
70013040-313 = "請，請不要這麼說……真正救了我的是亞瑠大人啊……"
70013040-314 = "要報答那份恩情……還遠遠不夠呢……"
70013040-315 = "不，如果是那份恩情的話，你早就償還得夠多了。#n所以，今後別再說那種話了。"
70013040-316 = "亞瑠大人……謝謝您。"
70013040-317 = "那，那個，遙香醬……"
70013040-318 = "剛才你說自己是雜草的事……難道你到現在還這麼想嗎？"
70013040-319 = "是因為我們初次見面的時候……我叫你「雜草醬」的關係嗎……？"
70013040-320 = "……"
70013040-321 = "請不要在意……"
70013040-322 = "因為那個綽號，我真的很喜歡。"
70013040-323 = "嗚……遙香醬～！"
