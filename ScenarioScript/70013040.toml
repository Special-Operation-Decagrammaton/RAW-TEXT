[translation]
70013040-1 = "잡초는 홀로 피지 않는다 4"
70013040-3 = "리가토니 패밀리가 점령한 호텔 정문"
70013040-6 = "리가토니 패밀리가 점령한 호텔 후문"
70013040-10 = "인근의 다른 빌딩 옥상"
70013040-12 = "와우, 경비 삼엄한 것 좀 봐. 이대로 안에 들어가긴 힘들겠는데?"
70013040-13 = "어, 어떡하죠? 아루 님과 연락도 안 되고…… 이대로 있다간 정말 큰일이 날 텐데……!"
70013040-14 = "쿠후후, 괜찮아. 다 방법이 있으니까."
70013040-15 = "하루카 쨩. 일단 옷부터 갈아입자."
70013040-16 = "옷이요? 어떤 옷……?"
70013040-17 = "저 녀석들에게 다가가도 들키지 않을 만한 옷!"
70013040-19 = "잠시 후……."
70013040-21 = "시, 시작할까요? 어, 없애버릴까요?!"
70013040-22 = "으음, 잠깐만. 쟤들 뭐라고 하는 것 같으니까, 이야기를 들어보자."
70013040-23 = "……하아, 갑자기 무슨 일이길래 이런 밤에 긴급 소집이야?"
70013040-24 = "예전에 보스를 건드렸던 녀석들을 잡았는데, 몇 명이 도망가서 행방이 묘연하대."
70013040-25 = "응? 몇 명이 도망갔는데?"
70013040-26 = "두 명."
70013040-27 = "아니…… 고작 두 명 때문에 조직원을 전부 소집했다고?"
70013040-28 = "얼마나 대단한 놈들이길래?"
70013040-29 = "나도 몰라. 보스가 예민하게 구는 걸 보니 일곱 죄수 중 아케미 급이 아닐까?"
70013040-30 = "에이, 그런 괴물이 또 있다고? 설마."
70013040-31 = "조직원이 전부 모였다는데요……."
70013040-32 = "쿠후후, 오히려 좋아. 팡팡 터트리는 재미가 있겠어."
70013040-33 = "그럼 가자, 하루카 쨩."
70013040-40 = "이야~ 늦은 밤에 수고가 많네."
70013040-41 = "수, 수고가 많으십니다……!"
70013040-42 = "응? 너희는 뭐야?"
70013040-43 = "전원 소집이잖아? 사정이 있어서 조금 늦었어."
70013040-44 = "처음 보는 얼굴인데…… 신입인가?"
70013040-45 = "응. 그래서 모르는 게 많아."
70013040-46 = "뭔가 대단한 놈들의 보스를 잡았다며? 도망 못 가게 안전한 곳에 잘 뒀겠지?"
70013040-47 = "보스랑 최상층에 있으니 그러지 않을까?"
70013040-48 = "후후, 그렇구나. 고마워!"
70013040-49 = "대답해 준 답례로, 특별한 선물을 줄게."
70013040-55 = "응? 갑자기 무슨……."
70013040-60 = "이, 입구에서 폭발……?!"
70013040-61 = "어이! 거기 무슨 일이야?!"
70013040-64 = "자! 다들 정신이 없는 틈을 타서 최상층까지 올라가자고!"
70013040-65 = "기다려 주세요, 아루 님! 제가 갑니다……!"
70013040-70 = "카, 카메라 확인해! 침입자를 찾아……!!"
70013040-71 = "주, 중앙 복도다! 쫓아라!!"
70013040-73 = "호텔 하층 중앙 복도"
70013040-84 = "뭐?! 놈들이 쳐들어왔다고?!"
70013040-85 = "막아! 절대로 올라오지 못하게 해……!!"
70013040-86 = "하, 하지만 녀석들…… 쪼그만 주제에 생각보다 엄청납니……!"
70013040-87 = " 크, 으아아아악……!!"
70013040-88 = "이 멍청한 놈들! 조직원 전부가 고작 두 명에게 쩔쩔매?!"
70013040-89 = "후후후……."
70013040-94 = "우두머리가 엉망인데, 그 부하들이 제대로 됐을 리가 없지."
70013040-95 = "그런 의미에서 우리 사원들은 최고 중의 최고라고."
70013040-96 = "감히 우리에게 시비를 걸다니."
70013040-97 = "당신, 실수한 거야."
70013040-98 = "크, 으으윽! 묶여 있는 주제에 잘난 척하긴!"
70013040-104 = "왜? 그걸로 날 쏘려고?"
70013040-105 = "마음대로 해."
70013040-106 = "하지만 이건 알아 둬."
70013040-107 = "우리 사원들이 여기에 왔을 때 내가 다친 상태라면…… 어떤 반응을 보일까?"
70013040-108 = "현명하게 생각하는 게 좋을 거야."
70013040-109 = "크, 으으윽……!"
70013040-113 = "사장…… 대담한데?"
70013040-114 = "무, 무서웠어……! 솔직히 무서웠다고……!!"
70013040-118 = "(……하지만 견뎌야 해.)"
70013040-119 = "(난 우리 사원들을 믿으니까……!)"
70013040-121 = "호텔 중간층"
70013040-147 = "호텔 상층부"
70013040-156 = "하루카 쨩! 괜찮아?"
70013040-157 = "괘, 괜찮아요! 살짝 스쳤을 뿐이에요!"
70013040-158 = "계속 올라가요!"
70013040-159 = "아루 님이…… 우리를 기다리고 있을 테니까……!"
70013040-163 = "뭣……?! 이미 근처까지 와 있다고?!"
70013040-164 = "그, 그럴 리가! 어떻게 두 명이……!!"
70013040-165 = "당신은 그때 이후 전혀 성장하지 않았네."
70013040-166 = "아니, 오히려 퇴보했다고 해야 할까."
70013040-167 = "반면 우리는 그때보다 훨씬 강해졌어."
70013040-168 = "당신이 괴롭혔던 연약한 아이가 우리 흥신소 68 최고의 폭파 공작원이 됐지."
70013040-169 = "지금 여기저기서 들리고 있던 폭음도, 모두 그 아이 작품이야."
70013040-170 = "어때? 자신의 과오가 만든 심판대에 올라, 점점 숨통이 조여드는 기분은?"
70013040-171 = "히이이익……!"
70013040-176 = "사장…… 생각보다 분위기 있게 이야기 잘하네?"
70013040-177 = "나, 나도 내가 이렇게 잘할 줄은 몰랐어……!"
70013040-183 = "겨, 결국 여기까지 뚫린 건가……!!"
70013040-188 = "아루 님! 카요코 님……! 괜찮으신가요? 저희가 왔어요……!!"
70013040-189 = "후후후, 믿고 있었다고."
70013040-190 = "우린 괜찮아. 걱정하지 마."
70013040-195 = "쿠후후, 그럼 우릴 고생시킨 저 뚱보 보스에게 벌을 내려줘야겠지?"
70013040-196 = "……."
70013040-197 = "후, 후후후……."
70013040-198 = "후후후하하하하……!"
70013040-199 = "멍청한 것들! 누가 누굴 벌한다는 거냐!"
70013040-200 = "벌받는 건, 너희다!"
70013040-201 = "나와라! 용병들……!!"
70013040-206 = "뭐, 뭐야? 저런 게 벽 뒤에 숨어 있었다고?!"
70013040-207 = "포위됐어……! 무츠키! 하루카! 조심해!"
70013040-209 = "크흐흐흐, 날뛰는 것도 여기까지다!"
70013040-211 = "일제 사격……!!"
70013040-222 = "전 탄 소진. 제압 완료."
70013040-223 = "후후후…… 후후하하하!!"
70013040-224 = "제아무리 대단한 놈들이라도 이만큼 탄환을 먹여줬으니 무사하지 못하겠지."
70013040-225 = "흥신소 사장! 다음은 네 녀석 차례다……!"
70013040-227 = "……."
70013040-228 = "……아니. 아직 끝나지 않았어. 저쪽을 봐."
70013040-232 = "……."
70013040-233 = "뭣?!"
70013040-235 = "콜록, 콜록 콜록!"
70013040-236 = "으으…… 막아줘서 고마워, 하루카 쨩. 역시 맷집은 나보단 하루카 쨩이라니까."
70013040-239 = "어, 어떻게 된 거야? 그 정도의 화력을 견뎌 내다니……!"
70013040-240 = "뭐야…… 너, 넌 대체 누구야……?!"
70013040-242 = "저는…… 잡초……."
70013040-243 = "밟아도 밟아도 죽지 않는…… 잡초예요."
70013040-247 = "……."
70013040-248 = "없애버리겠어."
70013040-249 = "감히 아루 님을…… 카요코 님을 인질로 잡고……."
70013040-250 = "무츠키 님까지 내 앞에서 해치려 했겠다……?"
70013040-251 = "용서 못 해……."
70013040-252 = "용서 못 해 용서 못 해 용서 못 해 용서 못 해 용서 못 해 용서 못 해 용서 못 해……!"
70013040-253 = "용서 못 해……!!"
70013040-254 = "히, 히이이이익?!"
70013040-268 = "사, 살려줘……! 다, 다시는 너희들 앞에 얼씬도 하지 않을 테니까……!!"
70013040-269 = "부, 부탁할게! 제, 제발……!!"
70013040-270 = "……."
70013040-271 = "……아루 님. 어떻게 할까요?"
70013040-272 = "훗, 살려주도록 해."
70013040-273 = "평판이 바닥에 떨어진 저 녀석에겐, 살아있는 게 더 끔찍한 형벌이 될 수 있겠지."
70013040-274 = "그래. 평생 바닥을 기면서 떠올리게 해주는 거야."
70013040-276 = "진정으로 비정하고 냉혹한 하드보일드 무법자가 누구인지!"
70013040-277 = "히, 히이이익……!"
70013040-278 = "……헤헤. 역시 아루 님은 멋지세요."
70013040-279 = "당신…… 아루 님 덕분이니까…… 운 좋은 줄 아세요."
70013040-285 = "커, 커헉……!!"
70013040-291 = "아루 쨩이랑 카요코 쨩은 괜찮아?"
70013040-292 = "응. 우린 괜찮아."
70013040-293 = "사장이 저 뚱보 보스 겁주는 걸 너희도 봐야 했는데."
70013040-294 = "후후, 내 하드보일드한 모습은 앞으로도 계속 볼 수 있으니 너무 아쉬워하지 마."
70013040-299 = "헤헤…… 다행…… 이네요……."
70013040-304 = "하, 하루카……!"
70013040-305 = "하루카 쨩……!"
70013040-306 = "……으, 으으음."
70013040-308 = "……."
70013040-309 = "……괜찮아. 조금 지친 것뿐이야."
70013040-310 = "……."
70013040-311 = "……고마워, 하루카. 이번에는 너에게 정말 큰 빚을 졌어."
70013040-313 = "아, 아니에요……. 저를 구해준 건 아루 님이니까……."
70013040-314 = "그 은혜를 갚으려면…… 아직 멀었어요……."
70013040-315 = "아니야. 은혜라면 이미 충분히 갚았어. 그러니까 앞으로는 그런 이야기 하지 마."
70013040-316 = "아루 님…… 감사해요."
70013040-317 = "그, 저기, 하루카 쨩……."
70013040-318 = "조금 전에 자기가 잡초라고 했던 거…… 설마 아직도 그렇게 생각하고 있었어?"
70013040-319 = "처음 만났을 때…… 내가 <잡초 쨩>이라고 불렀었던 것 때문에……?"
70013040-320 = "……."
70013040-321 = "괜찮아요……."
70013040-322 = "이제는 그 별명, 정말 좋아하니까."
70013040-323 = "으으, 하루카 쨩……!"
70013040-331 = "이후 도착한 발키리에 의해 리가토니가 체포되었다."
70013040-332 = "모두에게 있어, 정말로 잊지 못할 밤이었다."
