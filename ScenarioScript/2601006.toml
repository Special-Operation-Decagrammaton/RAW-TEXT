[translation]
2601006-1 = "과감한 테스트"
2601006-2 = "코우사기 타운"
2601006-3 = "(미유의 모모톡이 신경 쓰여 RABBIT 소대 캠프 인근의 거리로 황급히 나왔다.)"
2601006-4 = "(그 한가운데에서…… 미유의 모습을 찾는 것은 그리 어렵지 않았다……)"
2601006-6 = "아, 선생님……."
2601006-7 = "이, 이쪽이에요……"
2601006-10 = "선생님께서 금방 찾아 주실 거라 기대하긴 했지만, 그래도 역시 평소보다 빨리 찾아주신 것 같네요……."
2601006-11 = "어쩌면 정말…… 새 코디의 효과가 있었을지도…… 후후……."
2601006-12 = "[s1] \"미, 미, 미, 미, 미유………?\"\n[s2] \"그 복장은 도대체 뭐야?\""
2601006-15 = "그게, 그러니까……."
2601006-16 = "패션 잡지에서 보았던 것처럼 사복의 코디를 조금 바꾸어 보았어요."
2601006-17 = "[s3] \"그건 사복이라기보다는……\"\n[s4] \"……수영복이잖아?!\""
2601006-20 = "네…… 저번에 고른 수영복을 입어 보았어요."
2601006-21 = "바다나 수영장에서 수영복을 입고 있으면 존재감이 대단한 사람이 아닌 이상, 옷 때문에 시선을 받는 경우는 거의 없지만……"
2601006-22 = "시내에서 수영복을 입고 있으면 명백하게 TPO를 거스르는 일이니, 저처럼 존재감이 부족한 사람이라도 시선을 끌 수 있지 않을까, 해서요……"
2601006-23 = "어차피 다른 사람에게 보여주기 위한 옷이니 부끄럽거나 경범죄가 되는 것도 아니고……"
2601006-24 = "[s] \"당연히 수영복을 입고 있으면 시선을 끌지!\""
2601006-25 = "그, 그런가요……?"
2601006-26 = "하지만 제 타고난 존재감이 부족해서 그런지, 큰 반응은 없었던 걸요……"
2601006-27 = "그 예로 아침부터 수영복을 계속 입고 있었지만 아무도 말을 걸지 않았고……"
2601006-28 = "[s] \"그건 아마도……\""
2601006-42 = "……네? 제게 말을 걸기가 어려워서 그러는 걸 거라고요?"
2601006-43 = "하지만…… 평상시에 교복을 입고 있었을 때도 먼저 말을 걸어오는 사람은 거의 없었고……"
2601006-44 = "의외로 저는 말을 걸기 어려운 인상일까요……?"
2601006-45 = "[s] \"우선은 빨리 돌아가서 교복으로 갈아입자…….\""
2601006-46 = "……네? 다시 평소의 모습으로 돌아가라고요?"
2601006-47 = "모처럼 좋은 방법을 떠올렸다고 생각했는데, 다시 존재감이 없는 코디로 돌아가라니……"
2601006-48 = "어째서 그런 심한 말씀을……"
2601006-50 = "……저것 좀 봐. 샬레의 선생님이 시내 한 가운데에서 수영복을 입은 학생에게 무어라 다그치고 있어."
2601006-51 = "아침부터 왜 거리에서 수영복을 입고 있을까 했는데…… 설마 샬레의 선생님 때문이었던 거야?"
2601006-52 = "저런 심약해 보이는 학생에게 부끄러운 모습을 서슴없이 시키다니……"
2601006-53 = "역시 소문대로 샬레는 무서운 곳인가 보네……"
2601006-54 = "[ns] \"제발 부탁이니까 빨리 돌아가자……!\""
2601006-56 = "(이후, 미유를 설득해서 거리에서는 수영복을 입지 않도록 주의를 주었지만…….)"
2601006-57 = "(……샬레에 대한 이상한 소문이 더욱 퍼져 다른 학생들에게 해명을 하느라 애를 먹었다.)"
