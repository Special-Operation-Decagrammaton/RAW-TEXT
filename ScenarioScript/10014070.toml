[translation]
10014070-1 = "제7화;우리 '방과후 디저트단'"
10014070-8 = "하아, 하아……. 이것 참……."
10014070-9 = "늘 찾아가기만 하던 입장에서, 갑자기 이렇게 많은 관심을 받으니 몸 둘 바를 모르겠네요."
10014070-10 = "유감스럽게도 이렇게 많은 사람이 저를 찾았던 적은 없었어서 말이죠……! 하하……."
10014070-14 = "진짜 징그럽군……. 대체 언제까지 버티려는 거야, 이 녀석은!?"
10014070-15 = "이런 똥 맷집이었으니 지금껏 그렇게 쑤시고 다녀도 멀쩡했던 거로구나……. 대단하다……."
10014070-16 = "넌 뭘 또 감탄하고 있냐! 정신 차려, 적이라고!!"
10014070-17 = "시간이 없어. 아무리 교외라지만 이렇게 밤새 소란을 피우면, 아침에 뭐가 와도 올 거라고."
10014070-18 = "그 전에 알아내야지! 카스팔루그의 소재를!!"
10014070-19 = "맞아. 다른 방법이 없어."
10014070-20 = "다들 다시 총 들라고!! 불 때까지 밀어붙인다!!"
10014070-25 = "그러니까 알려 드릴 수 없다고 그렇게나 말씀드렸는데……. 하하……."
10014070-26 = "살다 보니 이 모두의 히어로 우자와 레이사가 카스팔루그를 위해 싸우는 날도 다 오고……."
10014070-27 = "참으로 오래 살고 볼 일이네요."
10014070-28 = "전 아직 15살밖에 안 됐지만요!"
10014070-29 = "……네, 뭐. 좋습니다. 한 번 아침까지……. 승부를 내 보시죠……."
10014070-30 = "전……. 하루 종일도 할 수 있으니까요……. 하아, 하아……."
10014070-31 = "……그런 거 치곤 목소리에 힘이 없네."
10014070-32 = "……?"
10014070-33 = "……응? 순간 어디서 낯익은 목소리가……."
10014070-34 = "그러니까 계속 말했잖아. 너무 세 보이는 말만 쓰면 오히려 약해 보인다고. 사람이 말을 해주면 좀 기억해."
10014070-38 = "하하. 이게 무슨 일이람. 이제는 카스팔루그의 환청까지 들리다니……."
10014070-39 = "내심 어지간히도 서운했던 모양입니다. 저란 사람, 의외로 속이 참 좁은 것 같네요."
10014070-40 = "뭐, 뭐야? 누구 목소리야? 어디서 들려온 소리지?"
10014070-41 = "……?"
10014070-42 = "어라……?"
10014070-43 = "벽 뒤다! 벽 뒤에서 지금……."
10014070-44 = "……?"
10014070-50 = "……!!"
10014070-51 = "!!! 전부 물러나!! 폭탄이다!!"
10014070-56 = "콜록, 콜록콜록……! 깜짝이야……! 갑자기 웬 폭발이……!"
10014070-57 = "어이! 모두 괜찮아? 다친 사람은 없고!?"
10014070-58 = "어어, 뭐……. 어떻게든……. 다들 그냥 놀랐을 뿐이야."
10014070-59 = "대체 어떤 녀석들이……!"
10014070-62 = "……음. 좋아."
10014070-63 = "아무래도 제대로 찾아온 거 같네."
10014070-64 = "우자와……."
10014070-65 = "음……?"
10014070-68 = "……어……."
10014070-69 = "……어라."
10014070-70 = "[s1] \"폭발의 충격에 기절한 것 같아.\"\n[s2] \"다친 거 같진 않아서 다행이네.\""
10014070-71 = "……으음."
10014070-72 = "……으음."
10014070-75 = "뭐야, 이 녀석! 야!! 너 뭐야? 이거 네가 한 짓이냐!?"
10014070-76 = "죽고 싶어!? 엉!? 지금 뭐 하는 짓이야? 지금 여기가 어디고 우리가 누군 줄 알고 이러는 거냐? 엉?"
10014070-80 = "어엉? 뭐야, 이거. 말이 안 들리냐? 벙어리야?"
10014070-84 = "……?"
10014070-85 = "뭐야, 이 쪼그만 한 건 또 무슨……."
10014070-95 = "……실로 무례한 자들이로다."
10014070-96 = "너희야말로, 감히 이분이 누구신 줄 알고 이러는 것이냐?"
10014070-97 = "이분으로 말씀드릴 것 같으면 힘을 숨기고 있던 암흑가의 제왕."
10014070-98 = "곧 부활하여 이 일대를 지배하게 되실 공포의 마수……."
10014070-102 = "……!?"
10014070-103 = "아, 아니! 잠깐!! 나츠! 야!! 나츠, 제발……!"
10014070-110 = "아냐, 해! 더 해! 우리 나츠 하고 싶은 만큼 다 해!!"
10014070-115 = "아이고 잘한다!"
10014070-121 = "우리 나츠 잘한다!!"
10014070-125 = "……공포의 마수."
10014070-126 = "……<카스팔루그>시니라!!!"
10014070-128 = "카, 카스팔루그……!? 카스팔루그라고!? 진짜로!?"
10014070-129 = "여, 역시 소문은 사실이었어……! 거 봐! 진짜라니까!!"
10014070-131 = "그리고 우리는 그의 수하들인 <방과후 디저트단>의 사천왕!!"
10014070-132 = "……어……? 어라? 사천왕?"
10014070-133 = "[s3] \"아무래도 나까지 포함인 것 같아.\"\n[s4] \"사천왕? 출세했네, 나?\""
10014070-134 = "뭣……!! 나는 아냐!! 나는 저 녀석 부하 같은 거 아니라고……!!"
10014070-135 = "뭣……!! 나는 아냐!! 나는 저 녀석 부하 같은 거 아니라고……!!"
10014070-136 = "요, 요시미 쨩. 여기선 그냥 눈치껏 맞춰주는 걸로……."
10014070-137 = "눈치껏 좋아하시네!! 아무리 그래도 저 녀석 부하 취급인 건 사양이라고!! 알겠어!?"
10014070-138 = "[s5] \"아냐, 요시미. 카즈사 얼굴을 봐.\"\n[s6] \"저 얼굴을 보고도 그런 말이 나와?\""
10014070-139 = "……??? 응? 얼굴?"
10014070-140 = "……??? 응? 얼굴?"
10014070-141 = "무슨 얼굴……."
10014070-145 = "……흐……."
10014070-146 = "……흐즈믈르그……! 진쯔……! 죽……는드 니네 즌브……!!"
10014070-150 = "……."
10014070-151 = "우리는 방과후 디저트단의 사천왕이다!!"
10014070-152 = "제군들, 선생님 빼고 모두 앞으로 돌겨어어억-!!"
10014070-153 = "와아아아아-!!"
10014070-154 = "와, 와아아-!?"
10014070-155 = "와아아아아-!!!"
10014070-160 = "[ns7] \"와아아아아-!\"\n[ns8] \"아, 난 뒤에 있어야지, 참.\""
10014070-163 = "자……식들……."
10014070-164 = "이놈이고 저놈이고…… 우자와고 스케반이고 선생님이고 전부……."
10014070-166 = "나중에 다 죽여버릴 거야……."
