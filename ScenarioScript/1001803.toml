[translation]
1001803-1 = "상냥한 파이터"
1001803-2 = "게임개발부 부실"
1001803-3 = "저, 선생님. 괜찮으시다면……."
1001803-4 = "저와 같이 대전 격투 게임을 플레이하지 않으시겠어요?"
1001803-5 = "[s] \"대전 격투 게임?\""
1001803-6 = "네, 전에 문자로 말씀드렸던 그 신작 대전 게임을 드디어 구했거든요!"
1001803-7 = "너무나도 기대했던 게임이라 빨리 플레이해보고 싶은데, 오늘따라 부원들이 모두 약속이 있다고 해서요."
1001803-8 = "대전 게임의 특성상 상대가 없으면 플레이할 수 없는데, 그렇다고 모르는 사람과 처음부터 게임을 하는 건 어쩐지 무서워서……."
1001803-9 = "선생님께서 제 상대가 되어 주시지 않겠어요?"
1001803-10 = "[s1] \"나는 대전 격투 게임은 잘 못 하는데…….\"\n[s2] \"봐주지 않을 테니까 각오해!\""
1001803-11 = "괜찮아요. 저도 이 게임을 플레이하는 건 처음이니까요."
1001803-12 = "함께 대전을 하며 실력을 쌓도록 하죠!"
1001803-13 = "하, 하하…… 그렇게 말씀하시니 저도 조금 긴장되네요."
1001803-14 = "그럼 저도 최선을 다해서 싸울게요!"
1001803-21 = "아, 아앗…… 위, 위험해요……!"
1001803-24 = "대, 대단하시네요…… 그런 스킬이 있었을 줄이야……."
1001803-25 = "그럼 이번에는 다른 방법으로 반격을……."
1001803-30 = "<유즈 선수의 퍼펙트 승리!>"
1001803-31 = "[s] \"……졌습니다.\""
1001803-32 = "헤헤, 이번 판에는 제가 이겼네요."
1001803-33 = "서, 선생님? 어째서 그런 표정을 짓고 계시나요? 호, 혹시 재미가 없으셨나요?"
1001803-34 = "네? 제가 이 게임을 처음 하는 게 맞느냐고요?"
1001803-35 = "그럼요! 이 게임은 오늘 아침에 막 출시된 신작인걸요."
1001803-36 = "이번 판은 제 운이 좋아서 이겼을지도 모르니까…… 한 판만 더 플레이 해 보죠!"
1001803-43 = "그, 그런 수는 생각지도 못했어요."
1001803-44 = "이번에야말로 대위기에요……!"
1001803-47 = "<유즈 선수의 퍼펙트 승리!>"
1001803-48 = "[s] \"………….\""
1001803-49 = "휴우…… 이번에도 간신히 이겼네요."
1001803-50 = "네? 제 혼잣말과는 달리 선생님은 일방적으로 두들겨 맞기만 하셨다고요?"
1001803-51 = "그게…… 게임에 몰입하다 보면 저도 모르게 자꾸 혼잣말을 하게 되어서……."
1001803-52 = "저, 절대로 이상한 생각으로 한 말이 아니에요!"
1001803-53 = "그, 그럼 이번 판에는 제가 콤보 스킬을 쓰지 않을 테니까…… 한 판 더 어떠신가요……?"
1001803-60 = "<유즈 선수의 퍼펙트 승리!>"
1001803-61 = "그, 그게 그러니까…… 저도 모르게 게임 패드만 잡으면 기합이 들어가는 바람에……. 하하……."
1001803-62 = "이, 이번에는 아예 잡기 스킬은 모두 쓰지 않을 테니, 한 판만 더 부탁드릴게요!"
1001803-64 = "유즈의 거듭되는 배려에도 불구하고 이어지는 10차례의 대전에서 완전히 연패하고 말았다……."
