[translation]
90001180-1 = "제18화;여명"
90001180-10 = "아, 아인?! 정신 차려! 언니가 이렇게 왔는데 네가 먼저 쓰러지면 어떡해!"
90001180-11 = "……차라리 먼저 쓰러져 줘서 고마워요. 아인. 저도 하마터면 그럴 뻔했으니까."
90001180-28 = "안녕하세요. 아인."
90001180-29 = "!!!"
90001180-31 = "안녕하세요. 소프."
90001180-32 = "우와아–!"
90001180-34 = "안녕하세요. 오르."
90001180-35 = "……네. 안녕하세요. 언니."
90001180-40 = "말쿠트 언니~~~!!!"
90001180-41 = "저, 저희 이름을 기억해 주시는군요……!"
90001180-42 = "혹시 우리들을 못 떠올리면 어떡하지, 라고 생각했지만! 이젠 아무래도 상관없어졌어!"
90001180-43 = "훗훗후……. 언니가 깨어났으니, 이제 모든 것은 우리들의 뜻대로!"
90001180-45 = "제가, 특별히 해야 할 일이 있나요?"
90001180-47 = "아, 아뇨! 괜찮아요, 언니. 언니는 그냥…… 그렇게…… 그대로 거기에 계시면 돼요."
90001180-48 = "맞아! 무엇보다 최고의 엔지니어이자, 과학자이자, 만능 여동생들인……!"
90001180-49 = "우리들이 있으니까 말이죠……!"
90001180-50 = "그러니까 언니는 모든 걸 마음 편히 우리들한테 맡기면 돼요!"
90001180-51 = "저, 저는 아인이에요……. 어…… 그…… 언니의 육체적인 면의 서포트와…… 장비 관리를 맡고 있죠. 그리고, 또, 저기…… 기계, 좋아하세요? 저는 엄청 좋아해요. 에헤헤……."
90001180-52 = "나는 소프! 언니의 애드온 무장 시스템을 관리하고 있어. 다른 누군가가 이상한 소리를 하면, 나한테 맡겨 줘."
90001180-53 = "저는 오르. 언니의 종합적인 밸런스를 관장한답니다. 훗훗후……. 누구도 언니에게 함부로 손댈 수 없게 할 테니, 안심하세요."
90001180-57 = "그러면……."
90001180-58 = "우리는 모두 자기소개를 했으니까……!"
90001180-59 = "어, 언니가 싫지 않으시다면……. 그, 저기, 언니도……."
90001180-64 = "잠시 의문을 제기하고 싶습니다."
90001180-65 = "아인, 소프, 오르. 당신들은 저에 대해 이미 잘 알고 있지 않나요?"
90001180-67 = "그, 그건 분명, 그렇기는, 한데요……."
90001180-68 = "아~ 그게 말이지. 말하자면, 뭐라고 할까."
90001180-69 = "가능하다면 언니의 목소리로 직접 듣고 싶어서요. 히힛."
90001180-71 = "……."
90001180-72 = "잘 모르겠지만, 그런 요청이라면 받아들여야 할 것 같다는 인식이 드네요."
90001180-73 = "다시 한번. 안녕하세요. 아인. 안녕하세요. 소프. 안녕하세요. 오르."
90001180-74 = "저는 말쿠트. 데카그라마톤의 열 번째 예언자."
90001180-75 = "세상의 끝에 도달한 왕국의 순례자. 마지막 세피라이자 최후의 원. 하나의 길로 모이는 여정의 지평."
90001180-80 = "아, 아아……. 열 번째 길은 눈부신 지성이니……."
90001180-81 = "그것은 온 땅을 광명으로 비출 것이다……!"
90001180-82 = "모든 것이 세상의 끝에 도달한 왕국의 순례자를 경배하리라!"
90001180-83 = "언니~!!!"
90001180-90 = "……?"
90001180-91 = "아, 치사해! 나도 언니한테 안길래! 언니한테 쓰다듬 받을래!"
90001180-92 = "언니! 나도!"
90001180-93 = "쓰담쓰담. 쓰담쓰담……. 후아……."
90001180-95 = "아, 아우. 아아아아……"
90001180-100 = "……."
90001180-107 = "어, 어어……?"
90001180-108 = "자아……."
90001180-109 = "언니……! 에헷. 에헤헷……."
90001180-111 = "……아인, 치사하네."
90001180-112 = "치사하군요. 이것은."
90001180-113 = "우리도 언니가 먼저 안아 줬으면 하는데."
90001180-114 = "확실히 그렇습니다. 끌어안는 것도 좋지만, 끌어안김 당하는 것도 분명한 수요가……!"
90001180-115 = "우리도, 우리도!"
90001180-116 = "인생이란 무릇 공평무사해야 뒤탈이 없는 법. 그러니……. 훗훗후……."
90001180-118 = "아으, 저기, 그러니까……."
90001180-119 = "언니……?"
90001180-120 = "……."
90001180-121 = "소프, 오르."
90001180-123 = "으, 응!"
90001180-124 = "자아, 저희는 준비되어 있답니다. 언니. 그러니 언제든……!"
90001180-126 = "아인이 곤란해하고 있어요."
90001180-127 = "그러니까, 떽이에요."
90001180-129 = "에엑?!"
90001180-130 = "으우우우…… 언니한테 혼났어요……."
90001180-132 = "그렇게까지 낙담하기를 바란 건 아니었는데요……."
90001180-135 = "아무튼! 이렇게 언니도 무사히 눈을 떴으니까, 다음 과정으로 넘어갈 때가 된 거야!"
90001180-136 = "네, 네! 다음 과정…… 말이군요?"
90001180-137 = "흐음? 소인은 아직 거기에 대해 들은 바 없소만…… 그건 무엇입니까?"
90001180-138 = "그건 바로……"
90001180-144 = "선전포고야!"
90001180-145 = "선전?"
90001180-146 = "포고?"
90001180-147 = "또 어딘가에서 이상한 인간들의 무의미한 말버릇이 옮아버린 모양이군요……."
90001180-152 = "이, 인간들의 버릇…… 같은 거란 건 맞지만! 무의미한 건 아닐 거거든?! 그러니까 뭐더라, 조약 위반이랬어!"
90001180-153 = "아뇨, 그 조약이란 것 자체가 인간들의 무의미한 장난 같은 거 아니냐는 말인데요. 소프."
90001180-154 = "으, 으윽……!"
90001180-155 = "저, 저는…… 그렇게 해 봐도, 나쁘지 않다고 생각, 하는데요……?"
90001180-156 = "아인……!"
90001180-157 = "크윽, 이럴 수가! 어느새 우리 아인마저 소프의 간악한 마수에……!"
90001180-158 = "야."
90001180-159 = "그, 저기, 우리에게는 큰 의미가 없어도, 인간들에게는 의미가 있을 수 있으니까요……. 그렇죠?"
90001180-160 = "여, 여여여, 여전히, 인간들과 직접 교류하는 건…… 저에게는, 조금, 많이 무섭긴 하지만……."
90001180-162 = "그러네요. 아인도 이렇게 말하고 있고, 여기에서는 소프의 말대로 해 보는 건 어떨까요?"
90001180-168 = "으음……. 뭐, 알겠어요. 언니도 아인도 그렇다면야, 어울려 주지 못할 것도 없죠."
90001180-169 = "좋아요! 그러면 그 선전포고인지 뭔지를 준비해 보도록 할까요!"
90001180-170 = "네, 네에……! 소프가 잘 알고 있는 것 같으니까, 마, 맡기도록 할게요……!"
90001180-171 = "응! 날 믿으라고!"
90001180-174 = "후우……."
90001180-175 = "쉽지 않았지만, 결국 해냈네."
90001180-176 = "모두 수고하셨습니다. 에이미의 말대로, 정말 쉽지 않은 과정이었지요."
90001180-177 = "완성시켜 놓고 보니, 확실히 나름대로의 보람은 있습니다만……."
90001180-178 = "……정말, 이대로 괜찮은 건가요……?"
90001180-179 = "무슨 문제라도 있어, 부장? 효율적이잖아."
90001180-180 = "관점에 따라서는 분명히 그런 면도 있어 보인다고? 그러면 된 거 아냐?"
90001180-181 = "리오 회장도 뭔가 말해 봐. 설계를 주도했던 건 회장이었잖아."
90001180-186 = "……전위적이야……."
90001180-190 = "……."
90001180-191 = "[s] \"어…… 케이? 뭔가, 소감이라도 말해 보면……?\""
90001180-195 = "……."
90001180-196 = "저 다시 데이터로 돌아갈래요."
90001180-197 = "그건 안 돼. 케이. 모두가 이렇게나 노력했는데."
90001180-198 = "특히 나는 이 바퀴 구조가 훌륭하다고 봐. 이족보행은 아무래도 비효율적인 부분이 있으니까."
90001180-199 = "거기에 여차하면 비행이 가능할 정도의 출력을 보장하는 부스터까지. 그야말로 리오 회장다운, 합리성의 극치야."
90001180-200 = "그렇습니다. 케이. 옛말에 이르기를, 도망치면 하나, 나아가면 둘을 얻는다고 했습니다. 여기에서 도망치면 안 되지 않겠습니까."
90001180-201 = "그거 무슨 뜻인지는 알고 하는 말이에요?!"
90001180-202 = "솔직히 모르겠습니다."
90001180-203 = "으아아아–! 히마리, 리오! 당신들도 뭐라고 해 봐요! 이게 도대체 뭔가요!"
90001180-205 = "……저는 말을 아끼도록 하죠. 마침 깜빡 잊어버리고 있었지만 도저히 미룰 수 없는 중요한 일이 하나 생각나서, 이만."
90001180-210 = "도망치는 거냐고요!"
90001180-212 = "……[ruby=아방가르드]전위적[/ruby]이야……."
90001180-213 = "당신은 그 말 밖에 할 줄 아는 게 없죠, 지금!"
90001180-214 = "[s1] \"……진정해, 케이. 어쨌든 몸을 갖고 움직일 수 있게 되었잖아.\"\n[s2] \"와아……. 잘 됐다, 잘 됐어……. 우리 악수할래?\""
90001180-217 = "선생님이 제일 나빠요!"
90001180-218 = "[s] \"어째서?! 아니, 짐작이 가지 않는 건 아니지만, 어째서?!?!\""
90001180-223 = "아무튼, 이제 슬슬 준비를 해야겠지?"
90001180-224 = "무슨 준비요……? 뭔가 되게 불길한 예감이 드는데요……?"
90001180-225 = "그야, 케이를 기다리고 있을 왕녀님을 만날 준비지."
90001180-226 = "……!"
90001180-227 = "저 진짜 다시 데이터로 돌아가면 안 돼요……???"
90001180-228 = "그건 안 됩니다. 케이. 그렇게 하면 무엇보다 귀여운 아리스가 슬퍼할 것이 분명하기 때문입니다."
90001180-229 = "왜 이럴 때는 또 멀쩡한 소리를 하는 건데요–!!!"
90001180-233 = "좋아! 이걸로 빙해 전부…… 는 아니겠지만, 베이스 주변이 어떤지는 알았어!"
90001180-234 = "으으…… 슬슬 추워지는데……? 이제 그만 들어가자, 언니……."
90001180-235 = "나도…… 찬성…… 에칫……!"
90001180-236 = "확실히 나도 춥기는 하지만……."
90001180-237 = "그래도, 조금만 더 기다리자."
90001180-238 = "어째서인가요, 모모이?"
90001180-239 = "그거야, 케이의 새 몸을 만나기 위해서지!"
90001180-240 = "우으…… 하지만 안에서 해도 되지 않을까……."
90001180-241 = "아니야, 유즈! 이런 건 뭔가 서프라이즈~ 해야 한다고!"
90001180-242 = "무슨 말인지는 알겠는데 말이야……."
90001180-248 = "아, 선생님에게서 모모톡이다!"
90001180-249 = "……."
90001180-250 = "그러면, 때가 되었네."
90001180-251 = "준비하자, 아리스."
90001180-257 = "네. 알겠습니다."
90001180-261 = "[ns] \"모두, 잘 있었어? 춥지는 않고?\""
90001180-265 = "얏호, 선생님! 기다렸다고! 그러면 하이 터치!"
90001180-271 = "그러면…… 된 거지?"
90001180-272 = "[s] \"그래. 다 됐어.\""
90001180-273 = "어, 언제…… 만날 수 있나요?"
90001180-277 = "[ns] \"그건…… 바로 지금이야!\""
90001180-286 = "……."
90001180-287 = "………."
90001180-288 = "…………!!!"
90001180-289 = "……풉……!"
90001180-290 = "푸하하하하하! 뭐야, 케이! 그 모습은! 아니, 누가 만든 건지는 딱 보면 알겠는데! 아무리 그래도 이건! 아하하하하하!"
90001180-292 = "으, 으익……!"
90001180-293 = "어, 언니. 그렇게 웃으면 안 되지 않을…… 미안, 케이 쨩! 나도 좀 무리! 아하하하하하!"
90001180-294 = "……어, 그, 어…… 저, 그게…… 엄청나게 인상적인 모습이네. 응."
90001180-299 = "……선생님."
90001180-300 = "[s] \"……왜 그러니, 케이.\""
90001180-301 = "저 좀 죽여주세요."
90001180-302 = "[s3] \"너무 낙담하진 마……\"\n[s4] \"나는 그 모습도 꽤 멋지다고 생각해!\""
90001180-309 = "케이……."
90001180-310 = "와, 왕녀여. 이건, 그러니까, 저기, 그러니까……."
90001180-311 = "……죄송합니다."
90001180-312 = "뭐가 죄송한지는 저도 잘 모르겠는데……. 하여튼, 다 죄송합니다, 이런 모습이어서요……."
90001180-313 = "네? 왜 그러나요, 케이? 아리스는 지금 케이의 모습이 정말 멋지다고 생각합니다!"
90001180-319 = "무엇보다 케이는, 어떤 모습이라도 케이인걸요."
90001180-320 = "……!"
90001180-321 = "다시 한번, 안녕하세요, 케이."
90001180-322 = "네, 왕녀여. 다시 한번 잘 부탁드리겠습니다."
90001180-323 = "그리고…… 갑자기 고칠 수는 없겠지만, 앞으로는 가능한 한 아리스라고 불러 주세요."
90001180-324 = "네? 하지만 왕녀여……."
90001180-325 = "부탁입니다. 조금씩만이라도 좋으니, 안 될까요?"
90001180-326 = "……왕녀여."
90001180-327 = "……."
90001180-328 = "알겠습니다. 아리스."
90001180-329 = "네. 케이."
90001180-330 = "정말로, 고맙습니다."
90001180-333 = "……."
90001180-334 = "당신이 여기까지 나와 볼 줄은 몰랐네요. 리오."
90001180-335 = "나는, 그저……. 내가 설계한 결과물이, 의도대로 잘 작동하는지를 확인하려고……."
90001180-336 = "어머나. 평소에는 충분한 시뮬레이션은, 실증을 대체할 수 있다고 주장하지 않았던가요?"
90001180-337 = "……."
90001180-338 = "이번만 말해 두는 건데요."
90001180-339 = "응?"
90001180-340 = "당신이 해낸 거예요. 이 결과는."
90001180-341 = "히마리……."
90001180-342 = "알아 두세요. 저는 당신을 저 이상으로 인정할 생각은 없었고, 분명 앞으로도 그럴 거예요."
90001180-343 = "하지만 당신이 이루어낸 결과를 폄하하거나 질투할 생각은 없어요. 그건 무엇보다 학자의 자세가 아니잖아요?"
90001180-344 = "……물론 케이의 디자인이 꼭 저것이어야 했는지에 대해서는, 아직까지도 조금 이견이 있기는 하지만……."
90001180-345 = "그래도, 이건 당신이 도달한 결과인 거예요."
90001180-346 = "……응."
90001180-347 = "크흠. 그러면."
90001180-351 = "자, 여러분! 이제 슬슬 추워졌는데, 베이스로 돌아가죠!"
90001180-352 = "목욕물도 따듯하게 덥혀 두었답니다? 만에 하나 감기에 걸리기라도 하면 큰일이니까, 어서 들어가요!"
90001180-354 = "역시 히마리 선배! 뭘 좀 아네!"
90001180-355 = "감사합니다. 히마리 선배."
90001180-356 = "여, 여러모로 폐를 끼치네요……. 잘 사용하겠습니다……."
90001180-358 = "밖은 저녁이 되어 가는 중이니, 지금부터는 외출에 주의해 주세요."
90001180-359 = "빙해의 밤은 혹독하답니다. 든든한 방한 장비가 없이는, 큰 일을 당하게 될 거예요."
90001180-360 = "알겠습니다, 히마리 선배!"
90001180-361 = "응. 이 시간에는 나도 살짝 춥다고 느낄 정도니까, 다들 조심해야 해."
90001180-362 = "……당신도 추위라는 개념을 느끼기는 하는군요, 에이미……. 그건 확실히 여러모로 신선한 정보네요……."
90001180-363 = "아무튼, 지금부터의 일정을 고민해 보자면–"
90001180-367 = "??!! 리오, 지금 이건……?!"
90001180-369 = "그래. 나도 확인했어."
90001180-371 = "무슨 일이야, 부장? 회장? 뭔가 일어났어?"
90001180-372 = "무언가 발견하셨습니까. 리오 님? 저희에게도 공유를……!"
90001180-382 = "……비상사태입니다. 여러분. 각자 위치로 돌아가 주세요."
90001180-383 = "어? 우, 우리들은?!"
90001180-384 = "그렇군요. 여러분은 적당한 자리에 앉아 있으면 될 것 같네요."
90001180-385 = "무슨…… 일인가요, 히마리 선배?"
90001180-390 = "결론부터 말하자면, 새 예언자의 신호야."
90001180-391 = "좌표는 예전, 강력하게 발산되었다 소실되었던, 현재 다차원 배리어가 전개되고 있는 것으로 추정 중인 그 좌표와 일치해요."
90001180-392 = "이번과 그때의 차이는, 신호가 계속 발산 중이어서, 그 정체도 특정해 낼 수 있다는 사실 정도일 거고."
90001180-393 = "[s] \"새로운 예언자의 정체?!\""
90001180-394 = "그렇습니다. 선생님. 이 신호는 분명……."
90001180-395 = "……데카그라마톤의 일곱 번째 예언자, <네차흐>……!"
90001180-396 = "[s] \"<네차흐>……?\""
90001180-397 = "그렇습니다. 선생님. 네차흐는 분명 세피로트의 나무 중 일곱 번째로–"
90001180-399 = "이야기 중에 미안해, 히마리 부장. 정체불명의 통신 라인이 강제로 연결됐어."
