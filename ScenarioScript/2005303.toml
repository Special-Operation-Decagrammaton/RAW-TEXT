[translation]
2005303-1 = "닌자 소녀는 부끄러워!"
2005303-2 = "백귀야행 상점가"
2005303-3 = "자, 맡기셨던 드레스, 수선 끝났습니다."
2005303-4 = "오옷……!"
2005303-5 = "깔끔해……!"
2005303-6 = "찢어졌던 부분이 흔적도 없이 사라졌어……!"
2005303-7 = "이것이 프로의 솜씨인가……!"
2005303-8 = "[s]\"잘 마무리됐네, 미치루.\""
2005303-9 = "후후, 하지만 이것으로 끝낼 수는 없지."
2005303-10 = "잠깐만 기다려 달라고, 선생 공!"
2005303-15 = "(5분 뒤…….)"
2005303-16 = "선생 공!"
2005303-18 = "자, 다시 가보자고!"
2005303-19 = "[ns]\"갈아입었어?!\""
2005303-20 = "후후, 당연하지."
2005303-21 = "옷이란 근본적으로 ‘착용하는’ 물건……."
2005303-22 = "즉, 수선이 제대로 되었는지 알기 위해서는 직접 입어봐야 하는 법 아니겠어?"
2005303-23 = "[s]\"설득력이…… 있어?\""
2005303-24 = "그렇지만! 입어보는 것만으로는 역시 부족해."
2005303-25 = "입고 나서 최대한 다양한 동작을 취해 봐야지."
2005303-26 = "걷고, 뛰고, 무거운 물건도 들어 보고……!"
2005303-27 = "거기까지는 테스트를 해 봐야, 비로소 옷의 수선이 제대로 되었는지 알 수 있는 거야!"
2005303-28 = "[s]\"아주 틀린 말은 아닌데…….\""
2005303-29 = "어때, 선생 공도 납득이 가지?"
2005303-30 = "그래서 말이야, 이 테스트를 할 수 있는 최적의 코스를 짜 왔다, 이 말씀!"
2005303-31 = "저쪽으로 쭉 걸어가면 각종 굿즈들을 파는 가게들이 늘어서 있어."
2005303-32 = "저번에 함께 갔던 내 단골 가게도 그 골목 끝에 있고."
2005303-33 = "아무튼, 그 거리까지 걸어가서 쇼핑을 마친 뒤 빠져나오면……."
2005303-34 = "걷기, 뛰기, 무거운 물건 들기! 전부 깔끔하게 한 번에 해결!"
2005303-35 = "거기다 마침 그곳의 몇몇 가게에 새롭게 닌자 굿즈…… 아니, 인법 도구를 들여놓기 시작한다는 소식도 들었고 말이야!"
2005303-36 = "놀랍지 않아? 이제 점점 더 많은 사람들이 닌자를 좋아하게 되는 거라고!"
2005303-37 = "[s]\"역시 그쪽이 목적이었구먼!\""
2005303-38 = "오? 같이 가주겠다고?"
2005303-39 = "[s]\"아직 그런 말 안 했어……!\""
2005303-40 = "역시 선생 공이야! 자, 그럼 가자!"
2005303-46 = "백귀야행 굿즈 상점가"
2005303-47 = "(결국 미치루에게 끌려서 굿즈 상점가까지 왔다.)"
2005303-48 = "자, 이 상점가에서 굿즈를 사려면 신경 바짝 차려야 해, 선생 공."
2005303-49 = "똑같은 굿즈라도 가게마다 가격이 천차만별인 경우가 종종 있거든."
2005303-50 = "그러니 가격들을 볼 때마다 바로바로 숙지하고 머릿속으로 비교하는 습관을 들이는 것이 중요하지."
2005303-51 = "……물론 닌자 굿즈…… 아니 인법 도구들은 해당 사항이 없지만."
2005303-52 = "물량 자체가 적어서 가격 비교를 할 필요도 없거든……."
2005303-53 = "뭐 그래도…… 음?"
2005303-54 = "찾았다! 마트료시카 수리검!"
2005303-55 = "수리검 안에 작은 수리검이 내장된 특제 수리검!"
2005303-56 = "날아드는 수리검을 잡아내도 그 안에서 또 다른 수리검이 튀어나와 공격하는 방어 불가의 투척 무기……!"
2005303-57 = "카이견컹컹 감독의 작품에서 처음 등장한 이후 수많은 곳에서 오마주 되었던 소품이지!"
2005303-58 = "그리고 그 옆에 이건…… 닌자용 화염 연막탄!"
2005303-59 = "폭발시키면 연막 대신 화염이 뿜어져 나와서 시야 차단과 공격을 동시에 할 수 있는 희대의 인법 도구!"
2005303-60 = "[s]\"그게 소이탄이랑 무슨 차이야……?\""
2005303-61 = "후후, 사소한 건 그냥 넘어가자고, 선생 공."
2005303-62 = "자, 그리고 이쪽에 있는 건…… 고대 닌자의 홀로그램 두루마리?!"
2005303-63 = "이런 것까지 가져다 놨단 말이야?!"
2005303-70 = "(그렇게 미치루를 따라다니며 한참 동안 닌자 굿즈…… 아니 인법 도구들을 구경했다.)"
2005303-72 = "우냐하…… 즐거웠다……."
2005303-73 = "비록 드레스 수선 비용으로 돈을 좀 써버려서 살 수 있던 건 수리검 하나뿐이었지만……."
2005303-74 = "그래도 선생 공과 함께 돌아다닌 것만으로도 좋았소이다."
2005303-75 = "그리고 그……."
2005303-76 = "선생 공도 내 응석에 어울려줘서…… 고맙고……."
2005303-77 = "[s]\"뭘, 나도 재미있었던걸.\""
2005303-78 = "저, 정말로……?"
2005303-79 = "헤……헤헤……."
2005303-80 = "그, 그래도! 그냥 말로만 넘어가면 조금 그…… 부끄러우니까!"
2005303-81 = "자!"
2005303-82 = "[s]\"이건…… 캡슐 토이?\""
2005303-83 = "서, 선생 공 주려고 내가 아까 자판기에서 뽑아온 거야!"
2005303-84 = "이 거리 유일의 닌자 캡슐 토이 자판기에서 말이지!"
2005303-85 = "물론 캡슐 안에 뭐가 들어있을지는 모르지만……"
2005303-86 = "그런 것도 캡슐 토이를 뽑는 재미니까!"
2005303-87 = "자, 그럼 한번 열어볼까?"
2005303-89 = "……엣?"
2005303-92 = "[wa:1250]― [log=미치루 드레스]안에 든 건…… [wa:2240]반지, [wa:1040]네?! [/log]"
2005303-94 = "― [log=미치루 드레스]수리검 장식이 달려 있어서 [wa:2320]멋지잖아?! [wa:1900]우아아아! [/log]"
2005303-97 = "[ns] \"모처럼 받았으니, 껴볼까?\""
2005303-98 = "[wa:440]― [log=미치루 드레스]……응? [wa:770]에? [wa:1170]선생 공? [wa:1680]끼는 거야……?[/log]"
2005303-100 = "― [log=미치루 드레스]아, [wa:970]아니, [wa:920]상관은 없지만……![/log]"
2005303-103 = "[wa:1570]― [log=미치루 드레스](어라? [wa:1290]반지를, [wa:1020]상대에게 건넨다……?)[/log]"
2005303-105 = "― [log=미치루 드레스](이건…… [wa:1460]고백 [wa:1540]같잖아?!) [wa:40] [/log]"
2005303-108 = "[wa:380]― [log=미치루 드레스]자, [wa:440]잠깐만 기다려봐, [wa:630]선생 공![/log]"
2005303-110 = "― [log=미치루 드레스]이건 [wa:440]절대로 노린 게 아니라…… [wa:1850]아니, [wa:460]그게……! [/log]"
2005303-113 = "[ns] \"일단 진정해, 미치루……!\""
2005303-114 = "[wa:2040]― [log=미치루 드레스]우으, [wa:840]우냐아아악……! [/log]"
2005303-117 = "이, 이, 이, 이건 말이지……!"
2005303-118 = "그, 그게……!"
2005303-119 = "에, 에잇!"
2005303-120 = "퍼어어엉!"
2005303-121 = "[ns]\"…….\""
2005303-123 = "(연막이 걷힌 뒤, 미치루는 이미 사라져 있었다.)"
2005303-124 = "(……그리고 어쩐지 캡슐 토이는, 내 손 위에 얹어져 있었다.)"
