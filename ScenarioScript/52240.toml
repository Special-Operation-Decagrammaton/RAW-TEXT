[translation]
52240-1 = "제24화;불안을 쫓는 귀곡성"
52240-2 = "냐하하~ 정말 큰일 날 뻔했었네요."
52240-3 = "상대를 방심시키기 위해 태연한 척 말하긴 했지만, 혹여나 정말로 오시지 않으면 어쩌지…… 하고 속으로는 진땀을 흘리고 있었거든요."
52240-4 = "그 신호를 못 알아차릴 리가 없지."
52240-5 = "천수각에서 흰 불꽃을 쏘아 올리는 것은 음양부 내에 문제가 있음을 알리는 전통적인 신호 체계였으니까."
52240-6 = "완벽한 타이~밍 이었사와요!"
52240-7 = "쳇…… 화조풍월부 녀석들은 발만 빠른 게 특징인가? 꼬리만 잡았다 싶으면 능구렁이처럼 도망쳐 버리니."
52240-8 = "……왜 이쪽을 쳐다보는 거야?"
52240-9 = "어라, 의외의 동행과 함께하고 계셨군요."
52240-10 = "이렇게 묘한 조합을 이루어 돌아오신 걸 보니, 그동안 여러가지 일이 있었던 모양이네요."
52240-11 = "[s1] \"괜찮아, 니야?\"\n[s2] \"많이 다치지는 않았어?\""
52240-14 = "네, 이래 봬도 몸 하나만큼은 튼튼하다고 자부하고 있거든요."
52240-15 = "게다가 [USERNAME] 선생님께서 든든한 호위를 붙여주고 가신 덕분에 와라쿠 축제도 무사히 속행할 수 있었답니다."
52240-16 = "[s] \"도움이 되었다니 다행이네.\""
52240-17 = "네, 무척이나 도움이 되었답니다."
52240-18 = "그에 비하면 제가 할 수 있는 일은 평소처럼 시시비비를 따져 현상을 유지하는 것뿐이니."
52240-19 = "백물어와 같은 거대한 부조리 앞에서 저 홀로 할 수 있는 건 아무것도 없더군요."
52240-20 = "아무래도 음양부 부장의 자리를 내려놓아야 할 때가 머지않을지도—"
52240-26 = "—니, 니야앗?!"
52240-27 = "움직이지 마셔요! 상처를 소독하는 데 방해가 되는 것이와요!"
52240-28 = "그, 그런 사소한 처치는 나중에 해도 괜찮은데……"
52240-29 = "지금 치료하지 않으면 얼굴에 큰 흉터가 남게 될지도 몰라."
52240-30 = "중요한 일이든, 사소한 일이든. 때를 놓치면 돌이킬 수 없게 되니까."
52240-31 = "………나구사 양."
52240-32 = "[s3] \"세상에 혼자서 모든 것을 할 수 있는 사람은 없어.\"\n[s4] \"니야가 내 도움 없이 아무것도 할 수 없다고 말한다면……\""
52240-37 = "[ns] \"나 역시 학생 없이는 아무것도 아니야.\""
52240-38 = "……선생님께서 그렇게 말씀하신다면."
52240-43 = "확실히, 지금은 우는 소리를 내고 있을 때가 아니네요."
52240-44 = "우선, 무사히 본관에 돌아오신 것을 환영합니다. [USERNAME] 선생님. 그리고 백화요란 여러분."
52240-45 = "……그리고 화조풍월부의 꼬마 괴담가님도."
52240-49 = "누가 꼬마라는 거야!"
52240-50 = "우선은 상황 정리를 위해, 그동안 음양부에서 취합한 정보를 공유 드리겠습니다."
52240-51 = "현상을 파악하고 대책을 세우기 위해서는 기록과 소문, 실체와 허상을 구분하는 것이 우선일 테니까요."
52240-52 = "응, 동감이야. 정제되지 않은 정보만큼 위험한 적도 없을 테니까."
52240-54 = "과연, 그렇군요. 아야메 양이 결국 그런 결정을……"
52240-55 = "어딘가 완벽하면서도 위태로워 보이는 사람이라는 생각은 자주 했지만, 그 정도로 곪아 있었을 줄이야."
52240-56 = "백화요란의 부장이 그토록 몰려 있었다는 것을 간과했다니, 제 불찰이로군요."
52240-57 = "아니, 친구의 고통을 이해하지 못한 것은 오히려 내 불찰이야. 좀 더 아야메를 이해했더라면—"
52240-58 = "……우리 모두의 불찰이겠지."
52240-59 = "모든 책임을 홀로 짊어지려는 건 당신의 나쁜 습관이라고 했을텐데, 나구사 선배."
52240-60 = "맞사와요. 아야메 선배의 고통에 가슴 아파하는 건 저희 모두 마찬가지라고요!"
52240-61 = "두 번 다시 아야메 부장이 그런 생각을 하지 못하도록, 이번에야말로 꽉 붙잡아 줘야지!"
52240-65 = "……그래. 아야메를 지키는 건, 우리 모두의 목표야."
52240-69 = "그래서 한 가지 묻고 싶은데, 니야 부장."
52240-70 = "축제를 계속하는 것만으로 아야메 부장의 백물어— 그, 히토츠메의 힘을 억제할 수 있는 거야?"
52240-71 = "정확히 말씀드리자면 그 괴예가의 말처럼 미봉책인 것은 사실입니다."
52240-72 = "축제를 통해 한껏 달아오른 사람들의 열기가 공포를 잊게 하여 백물어의 힘을 약화시킨 것은 사실이지만……"
52240-73 = "사람의 감정이란 언제나 한 가지 상태로 고정되지 않으니까요."
52240-74 = "축제의 분위기가 가라앉으면 다시금 히토츠메가 백귀야행의 전역에 시선을 비추기 시작할 겁니다."
52240-75 = "게다가 가장 큰 문제는, 백화요란의 부장 아야메 그 자체라……"
52240-76 = "아야메 부장에게 무슨 또 다른 문제라도 있는 건가요?"
52240-77 = "문제가 있다면……"
52240-78 = "아야메 부장이 너무 강한 탓에, 백화요란 내에서 그녀를 일대일로 상대할 수 있는 학생이 존재하지 않는다는 점이 문제입니다."
52240-79 = "화, 확실히 그건……"
52240-80 = "나조차도 대련에서 아야메를 이겨본 적은 단 한 번도 없었으니까."
52240-81 = "그리고 아야메 부장이 건재한 이상, 히토츠메는 아무리 해치운다 하더라도 사람의 공포를 머금으며 계속 세를 불려 나갈 테지요."
52240-82 = "젠장…… 같은 편이었을 때는 그렇게나 든든했는데, 적으로 만나니 대책이 서질 않네."
52240-83 = "하지만 방법이 아예 없는 건 아닙니다."
52240-84 = "일단은 이 자리에 괴서를 저격할 수 있는 전설의 마총, 백련과 백화요란 여러분이 있으니까요."
52240-85 = "거리를 거니는 괴담을 하나씩 물리치며 아야메에게 접근한다면 괴서를 파괴할 기회가 있을지도 모릅니다."
52240-86 = "하지만 그렇다 하더라도 백련은 한 자루밖에 없는데, 이 많은 수의 괴이를 어떻게 단번에 물리친단 말이야?"
52240-87 = "그리고 또 하나의 방법은…… 이쪽도 괴서의 힘으로 맞서는 것."
52240-88 = "옛말에, 이이제이라는 말도 있잖아요?"
52240-89 = "괴서의 힘을 상대한다면 이쪽도 괴서의 힘으로 대응하는 것이 가장 유효한 상책이겠지요."
52240-90 = "괴서의 힘……? 그 말은 우리에게도 괴서가 있다는 말이야?"
52240-91 = "그야—"
52240-96 = "하, 무슨 소리를 하나 듣고 있었더니만……"
52240-97 = "괴서의 힘을 괴서의 힘으로 상대한다고? 그렇게 괴서가 쉽게 구할 수 있는 물건이라면, 내가 이 꼬락서니로 고생을 하고 있을 리가 없잖아!"
52240-98 = "게다가 화조풍월부의 괴서가인 나조차도 <이노모노노케로쿠>를 다루기까지 오랜 시간이 걸렸는데. 설령 네 녀석들의 손에 당장 새로운 괴서가 들어온다 하더라도—"
52240-99 = "네, 맞아요. 바로 그 <이노모노노케로쿠> 랍니다."
52240-100 = "뭐……?"
52240-104 = "자, 받으세요."
52240-106 = "이건 <이노모노노케로쿠>……?"
52240-107 = "마, 말도 안 돼. <이노모노노케로쿠>는 지난 사태 때 분명 찢어지고 불타 없어졌을 텐데……"
52240-108 = "분명 그랬었죠. 저희가 나중에 현장을 정리하면서 발견한 것도 그을린 표지와 찢어진 낱장의 일부뿐이었으니까요."
52240-109 = "그 잔해만으로 괴서의 내용을 복원해 내는 것은 불가능한 일이겠지만……"
52240-110 = "마침 저희가 정기적으로 교류하는 학원에 책의 일부만 가지고도 책을 복원하는 기술을 가진 '마술사' 같은 분이 계셔서……"
52240-119 = "평범한 인간이, <이노모노노케로쿠>를 복원했다고……?"
52240-120 = "말도 안 돼. 있을 수 없는 일일 텐데……"
52240-126 = "……그런데 이 책, 아무것도 쓰여 있지 않잖아!"
52240-127 = "네. 제아무리 마술사님이라 하더라도 불타버린 책의 소재를 복원할 순 있어도, 불타버린 내용까진 추론할 수 없다고 하셔서."
52240-132 = "그럼 아무런 쓸모도 없잖아? 괴서의 힘은 그 안에 적힌 괴담에서 비롯되는 법이라고!"
52240-133 = "그저 똑같은 외형의 낡은 책을 가져둔다 하더라도—"
52240-136 = "아, 그 낡은 괴담집 말이냐? 그깟 낡은 책에 무슨 의미가 있다고."
52240-139 = "……아무런, 가치도 없다고."
52240-143 = "네, 맞아요. 아무런 내용도 적혀 있지 않은 괴서는 그저 낡은 종이 뭉치일 뿐이지요."
52240-144 = "하지만 그렇다면 이 빈 책에 새로운 이야기를 직접 기입하면 되는 게 아닐까요?"
52240-145 = "인기 소설가이신 '쿠치키 슈라' 님께서."
52240-146 = "……쿠치키 슈라?"
52240-147 = "쿠치키 슈라, 라면……"
52240-148 = "[s] \"슈로의 필명이었던가……?\""
52240-149 = "네, 네가 그 이름을 어떻게 알고 있는 거야!"
52240-150 = "어머나, 모를리가요. 인터넷 소설 투고 사이트 <소설을 쓰자>에 매주 꼬박꼬박 소설을 연재하셨었잖아요."
52240-151 = "개인적으로는 <나 홀로 이세계에서 괴담가가 되어 초레벨업> 시리즈가 좋았었는데~"
52240-153 = "우와아아…… 우와아아아!"
52240-154 = "물론 취향을 타는 급전개와 치트 능력 때문에 새 에피소드가 올라오기만 하면 댓글란이 뜨겁게 불타오르는 다른 의미의 명작이었지만……"
52240-155 = "그건, 그건 그러니까……!"
52240-156 = "알고 있어요. 당신이 말하고 싶던 건 그런 사소한 전개가 아닌, 심오한 주제였을 텐데."
52240-157 = "그 글의 가치도 알아보지 못하다니, 너무나도 억울해서 참을 수가 없었겠죠."
52240-161 = "너도…… 내 글을 읽어본 거야?"
52240-162 = "네. 좋았다고 말씀드렸잖아요."
52240-163 = "슈로 양. 어떠신가요?"
52240-164 = "당신의 글이 괴서의 힘을 빌어 현실에 나타난다면, 당신의 글을 두고 '비현실적인 전개'라고 코웃음 치던 그 독자들이 어떤 표정을 지을지, 궁금하지 않나요?"
52240-165 = "아무도 진심으로 읽어주지 않아 억울하고, 비참했던 그 마음을 모두에게 보여주고 싶지 않나요?"
52240-166 = "그 감정, 그대로 돌려주고 싶다고 생각하지 않나요?"
52240-170 = "……헉."
52240-171 = "그, 그런 사탕발림으로 꾀어낸다 하더라도 너희들에게 협력할 생각은 없거든?"
52240-172 = "나는 코쿠리코 님의 뜻을 따라 백물어를 만드는 것 이외에는 그 어느 것도—"
52240-173 = "괜찮아요. 당신이 백귀야행에 새로운 백물어를 만들어낸다 하더라도."
52240-174 = "뭐, 뭐라고? 진심이야?"
52240-175 = "네. 저 괴예가가 풀어내는 이야기와 당신의 이야기 중, 어느 것에 사람들이 더 열광할지 저도 궁금했었으니까요."
52240-176 = "잠깐, 니야 부장. 그런 짓을 했다가는 혼란이 두 배로 가중될 게……"
52240-177 = "쉬잇."
52240-178 = "일단 이대로 지켜보고 있자."
52240-182 = "나의 이야기…… 나의 백물어……"
52240-185 = "그 사실을 깨닫게 되었을 때, 너 또한 너만의 괴서를 갖게 될 것이야."
52240-188 = "나만의 괴서……"
52240-192 = "어때요, 슬슬 결심이 서셨나요?"
52240-200 = "……진짜 아무거나 써도 괜찮은 거야?"
52240-202 = "그럼…… 이어서 다음 곡……"
52240-206 = "치세 쨩, 힘내! 파이팅!"
52240-224 = "피나 공, 뒤쪽에서 또 몰려듭니다!"
52240-225 = "동시에 앞쪽에서도…… 수가 너무 많아서 동시에 대응할 수가 없습니다!"
52240-226 = "으으…… 괴물의 수가 줄어드나 싶더니만, 다시 조금씩 늘어가고 있어……"
52240-227 = "이대로 얼마나 더 버틸 수 있을지……"
52240-232 = "어라? 이 긴 울음소리는……"
52240-233 = "고양이 울음소리?"
52240-234 = "설마, 저번의 그 괴물 고양이가—"
52240-246 = "냐아아아아아아아아!"
52240-250 = "……뭐야, 저 허접한 모습은."
52240-251 = "뭔가 그때의 괴물 고양이라기에는……"
52240-252 = "어린아이가 그린 고양이 같은 모습이네……"
52240-259 = "[log=슈로]<최강의 괴담가의 손에 의해 새롭게 태어난 묘귀 쿠로카게의 모습은……[/log]"
52240-261 = "[log=슈로]보는 것만으로도 강함을 느낄 정도의……[/log]"
52240-263 = "[log=슈로]어쨌든 뭔가 무서워 보이는 대단한 모습이었다.>[/log]"
52240-266 = "[log=슈로]<그러니까…… [wa:1000]엄청 크고…… [wa:1000]긴 수염과 모든 것을 꿰뚫는 뿔도 있고……[/log]"
52240-268 = "[log=슈로]하여튼 뭔가 엄청나게 사악한 모습이었다……>[/log]"
52240-271 = "[log=슈로]<거세게 포효하는 그 모습은 고양이…… [wa:1000]아니, 고귀하고 강력한 맹수……[/log]"
52240-273 = "[log=슈로]그래, 거대한 사자처럼 보이는 것이었다……>[/log]"
52240-277 = "우하하, 저 모습은 뭐야?"
52240-278 = "저것도 와라쿠 축제에서 준비한 어트랙션의 일부인가?"
