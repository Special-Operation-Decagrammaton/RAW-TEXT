[translation]
10036110-1 = "에필로그"
10036110-3 = "후우."
10036110-4 = "전부 철거하고 나니, 남은 것은 모래사장뿐이군……."
10036110-13 = "[ns] \"좋은 아침, 사오리.\""
10036110-15 = "선생, 그리고 모두들……."
10036110-16 = "산책 중이었어?"
10036110-17 = "비, 비슷한 것이려나. 그냥, 어제의 축제 현장을 다시 보고 싶었다."
10036110-18 = "그 열기, 그 흥분, 그리고 무엇보다…… 내가 무대에 섰다는 게, 믿어지지 않아서……."
10036110-19 = "웃음거리만 되지 않았으면 좋으련만."
10036110-20 = "[s1] \"아냐! 엄청 흥겨웠어!\"\n[s2] \"어제 신나게 뛰어논 탓에 오늘 근육통이 올 지경인걸!\""
10036110-26 = "마, 맞아요…… 완전 즐거웠어요. 잡지에서 본 바로 그 해변 파티였어요!"
10036110-27 = "뭐, 나쁘진 않았으니까……."
10036110-28 = "응, 나도 즐거웠어. 삿 쨩한테 그런 재능이 있는 줄은 몰랐는걸."
10036110-30 = "재능이라니…… 크, 크흠! 그럼 조금 걷기로 할까."
10036110-36 = "해변이 조용하네. 어젯밤의 소란은 상상도 못 할 정도야."
10036110-37 = "축제장을 철거해서 그런지 더 허전해 보이는걸."
10036110-38 = "그러네요…… 헬멧단도 다 떠나서, 마치 다른 곳 같아요."
10036110-42 = "……."
10036110-49 = "부서지는 파도, 반짝이는 햇살……"
10036110-50 = "아무것도 없는 해변가는 또 다른 느낌이네."
10036110-51 = "피곤하기는 해도, 일찍 일어난 보람은 있을지도."
10036110-52 = "그래서, 고민은 좀 풀렸어, 리더?"
10036110-53 = "으, 응?!"
10036110-54 = "……나 참."
10036110-55 = "괜히 서성이는 거, 마음 심란할 때의 버릇이잖아."
10036110-56 = "나도 알고 있을 정도인데."
10036110-57 = "쿠, 쿨럭."
10036110-58 = "후훗. 당황하는 삿 쨩도 귀엽네."
10036110-63 = "……다시 떠날 생각이지?"
10036110-64 = "자아 찾기, 계속하시는 건가요?"
10036110-66 = "……그래, 맞아."
10036110-67 = "하지만 지금까지와는 조금 다를지도 모르겠어."
10036110-68 = "전에는 캄캄한 어둠 속에서 방향도, 속도도 모르고 달려왔다면……."
10036110-69 = "이번 일로, 살짝, 아주 살짝이지만 어렴풋이 빛을 본 것 같다."
10036110-70 = "그러니까, 그 빛을 이정표 삼아서 조금 더 부딪치고, 헤매 볼 생각이다."
10036110-71 = "너희에겐 미안할 따름이다만……."
10036110-75 = " 이제 와서 사과할 필요 없잖아."
10036110-76 = "응, 삿 쨩, 언제나 응원하고 있을 테니까, 우리 걱정은 마."
10036110-77 = "가, 가끔씩은 연락주세요…… 우연히 가까이 있으면, 얼굴이라도 볼 수 있게……."
10036110-83 = "……고맙다, 모두들."
10036110-84 = "그리고 선생."
10036110-85 = "[s3] \"나도 응원할게.\"\n[s4] \"도움이 필요하면 언제든 불러 줘.\""
10036110-88 = "고맙다, 선생."
10036110-89 = "그럼 여기서 작별, 이려나."
10036110-91 = "……그렇게 되겠지. 먼저 가라. 매번 내가 먼저 떠났으니, 이번에는 이쪽에서 배웅하겠어."
10036110-93 = "모, 몸조심하세요, 언니……."
10036110-99 = "……다치지 마."
10036110-105 = "응, 다시 만날 때까지 안녕, 삿 쨩."
10036110-114 = "……."
10036110-115 = "[s] \"기운 내, 사오리. 이별은 또 다른 만남의…….\""
10036110-116 = "아이들은, 갔나?"
10036110-117 = "[s] \"……응?\""
10036110-118 = "아이들 앞에선 숨겼지만, 여러 가지 일 때문에 미처 생각하지 못한 게 있었다."
10036110-119 = "모처럼 이렇게 의뢰를 수행했건만. 알바비를 받지 못했다."
10036110-120 = "[s] \"뭐……?!\""
10036110-121 = "헬멧단…… 역시 우습게 볼 수 있는 녀석들이 아니었다. 괜히 이곳 키보토스에서 세력을 키운 집단이 아니야."
10036110-122 = "선생에게도 확실히 배웠었지. 계약을 하고 아르바이트를 하고, 일을 하다 보면 정말로 많은 일들이 일어나기 마련이라고."
10036110-123 = "그러는 와중엔 얼마든지 여러 사정으로 이것저것 편의를 봐주고 감안도 할 수 있다고는 하지만……."
10036110-124 = "계약을 하고도 임금을 떼어먹는 것만큼은 절대로 용서할 수 없는 행위라고……!"
10036110-125 = "그래서 말이다만, 선생……"
10036110-126 = "[s] \"응, 그런 일이라면 전력으로 도와줄게.\""
10036110-127 = "좋다. 그럼……."
10036110-132 = "지금부터 헬멧단을 추격한다!"
10036110-134 = "(아무래도, 여름이 끝나기는 아직 이른 모양이다.)"
10036110-135 = "Sheside outside"
