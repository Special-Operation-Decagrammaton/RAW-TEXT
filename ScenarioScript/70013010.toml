[translation]
70013010-1 = "วัชพืชมิอาจเติบโตเพียงลำพัง 1"
70013010-2 = "เลานจ์ ห้องอาหารหรูของโรงแรม"
70013010-4 = ""
70013010-5 = ""
70013010-6 = "......"
70013010-7 = "มาแล้ว..."
70013010-8 = "ในที่สุดก็ได้มาสักที!"
70013010-9 = "ได้มาร้านอาหารไฟน์ไดนิงของโรงแรมสุดหรูพร้อมกับทุกคน...!"
70013010-10 = ""
70013010-12 = ""
70013010-13 = ""
70013010-14 = "มะ... ไม่คิดเลยว่าจะได้มากินอาหารกับท่านอารุในที่แบบนี้... ต่อให้ต้องตายไปฉันก็ไม่เสียดายอะไรแล้วค่ะ!"
70013010-15 = "นี่ อารุจัง... จะไม่เป็นอะไรจริงๆ เหรอ? ที่นี่ดูแพงเอาเรื่องเลยนะ?"
70013010-17 = "มะ... ไม่ต้องกังวลหรอกน่า! ทุกคนทำงานกันหนักมากก็เลยมีรายได้เข้ามาเรื่อยๆ แล้ว"
70013010-18 = "แต่ถึงอย่างนั้นก็เถอะ อย่าทำอะไรเกินตัวจะดีกว่านะ"
70013010-19 = "คะ... แค่นี้ไม่เป็นไรหรอกน่า!"
70013010-20 = "ช่วงนี้มีเงินเหลือพอเก็บออมได้ด้วย"
70013010-21 = "อืม... ถ้าเลี้ยงของอร่อยๆ แบบนี้สักมื้อให้พนักงานไม่ได้ ประธานอย่างฉันจะเอาหน้าไปไว้ที่ไหน"
70013010-22 = "เพราะงั้นทุกคนไม่ต้องเป็นห่วงหรอก สนุกให้เต็มที่ได้เลย"
70013010-24 = "ฮุฮุฮุ ถ้าพูดถึงขนาดนั้นก็ต้องสนุกให้เต็มที่แล้วละ"
70013010-25 = "ว่าแต่ว่า... จองโต๊ะไว้แล้วใช่มั้ย?"
70013010-27 = "แหงอยู่แล้วสิ"
70013010-28 = "เอ่อ คุณพนักงานคะ"
70013010-29 = "ครับ ยินดีต้อนรับครับ"
70013010-30 = "ฉันจองโต๊ะไว้ค่ะ ชื่อ ริคุฮาชิมะ..."
70013010-31 = ""
70013010-33 = ""
70013010-34 = "ครับ ตรวจสอบการจองเรียบร้อย เชิญทางนี้เลยครับ "
