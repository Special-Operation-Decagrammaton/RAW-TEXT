[translation]
70013010-1 = "잡초는 홀로 피지 않는다 1"
70013010-2 = "호텔 파인 다이닝 레스토랑 라운지"
70013010-6 = "……."
70013010-7 = "……왔어."
70013010-8 = "드디어 왔어!"
70013010-9 = "모두와 함께! 최고급 호텔의 파인 다이닝 레스토랑에……!"
70013010-14 = "이, 이런 곳에서 아루 님과 식사를 할 수 있다니…… 저는 죽어도 여한이 없어요!"
70013010-15 = "헤에, 아루 쨩. 정말로 괜찮은 거야? 여기 엄청 비싸 보이는데?"
70013010-17 = "괘, 괜찮아! 다들 고생해 준 덕분에 요즘 수입도 안정권으로 들어왔으니까."
70013010-18 = "……그래도 너무 무리하지 않는 게 좋아."
70013010-19 = "이, 이 정도는 괜찮아!"
70013010-20 = "요즘 저축도 할 수 있을 정도로 여유 있다구."
70013010-21 = "……그래. 그런 사원들에게 이 정도 대접도 못하면 사장으로서의 체면이 안 서."
70013010-22 = "그러니까 다들 걱정 말고 즐기도록 해."
70013010-24 = "쿠후후, 그렇게까지 말한다면 즐겨 줘야지."
70013010-25 = "혹시나 해서 물어보는데, 예약은 제대로 했지?"
70013010-27 = "물론이지."
70013010-28 = "저기, 웨이터?"
70013010-29 = "네, 어서오세요."
70013010-30 = "리쿠하치마입니다만……."
70013010-34 = "네. 확인했습니다. 이쪽으로 오시죠."
70013010-46 = "이쪽의 창가 자리로 안내해 드리겠습니다."
70013010-56 = "그럼 예약하신 코스를 간략하게 소개해 드리죠."
70013010-57 = "메인 디시는 셰프 특제 와일드헌트풍 소고기 안심 스튜입니다."
70013010-58 = "산미가 적은 와인과 육즙을 [ruby=Deglaze]디글레이즈[/ruby]한 소스에 졸인 것이 특징이죠."
70013010-59 = "그 외에도 풍부하고 깊은 맛을 느낄 수 있도록……."
70013010-66 = "이후로도 웨이터의 장황한 메뉴 설명이 이어졌다."
70013010-73 = "[ruby= Infusion]인퓨전[/ruby], [ruby=Al dente]알덴테[/ruby], [ruby=Brunoise]브뤼누와즈[/ruby] 등등…… 평소에 들어본 적 없었던 전문 용어가 난무했다."
70013010-74 = "으, 으흠! 좋네. 기대하고 있겠어."
70013010-75 = "네. 그러면 곧 [ruby= amuse bouche]아뮤즈 부쉬[/ruby]부터 준비해 드릴 테니 잠시만 기다려 주시길."
70013010-81 = "아루 쨩. 무슨 말인지는 알고 대답하는 거야?"
70013010-82 = "대, 대충 최고급 요리라는 뜻이겠지."
70013010-83 = "비싼 곳이니 분명 좋은 요리가 나올 거야. 더 자세한 건 생각할 필요 없어."
70013010-88 = "그러고 보니 여기 물도…… 평범하지 않네."
70013010-89 = "깨끗한 빙하를 녹인 미네랄 워터래."
70013010-90 = "이, 이런 곳에서 식사하는 분들은 대체 정체가 뭘까요……?"
70013010-100 = "와우. 다들 돈이 엄청 많아 보이네."
70013010-101 = "우리들도 손님으로서 온 거니까, 주위랑 비교할 필요 없어."
70013010-102 = "오히려 의상은 우리 쪽이 더 완벽해!"
70013010-103 = "우리가 지나치게 차려입고 온 건 아니고?"
70013010-104 = "그, 그럴 리가……! 이 정도면 완벽한 드레스 코드야!"
70013010-105 = "우아한 식사에 이보다 어울리는 의상은 없다고!"
70013010-106 = "쿠후후, 아루 쨩은 이곳의 예절을 잘 안다는 거네?"
70013010-107 = "그럼 혹시 이 포크와 나이프는 어떻게 쓰는지 알아? 종류가 여러 개 있는데."
70013010-108 = "저, 저도 궁금한 참이었어요. 왜 크기가 다른 게 여러 개 있는 걸까요……?"
70013010-109 = "어…… 그, 그게……."
70013010-111 = "음식마다 사용하는 식기가 다르대."
70013010-112 = "……어디에 뭘 써야 하는지는 나도 잘 모르지만."
70013010-113 = "아, 아무거나 사용하면 어때? 어차피 입에 들어가면 똑같잖아?"
70013010-120 = "아니, 뭐가 이렇게 소란스러워?"
70013010-121 = "아무래도 장소에 어울리지 않는 손님이 온 것 같군."
70013010-123 = "흐응~? 그거 우리한테 하는 이야기?"
70013010-124 = "방금…… 아루 님을 모욕한 건가요……?"
70013010-126 = "아루?"
70013010-130 = "……."
70013010-131 = "잠깐! 그러고 보니 너희들은……!"
70013010-132 = "흥신소 68!!"
70013010-137 = "실례지만…… 누구?"
70013010-142 = "나를……! 감히 나를 모른다고?!"
70013010-143 = "쿠후후, 비슷한 악당들을 워낙 많이 만나서 말이야."
70013010-144 = "당신 같은 잔챙이 씨는 기억나지 않는걸?"
70013010-145 = "나다! 리가토니 패밀리의 브루노 리가토니!"
70013010-146 = "설마 그 이름까지 잊진 않았겠지!!"
70013010-151 = "리가토니…… 패밀리……?"
70013010-152 = "……설마."
70013010-153 = "그러고 보니 당신은……."
70013010-155 = "후, 후후……."
70013010-156 = "후후하하하하하……!"
70013010-157 = "기억나는 건가! 그렇다면 지금부터 내가 뭘 할지도 잘 알겠지!"
70013010-158 = "복수의 때가 왔다! 얘들아!!"
70013010-167 = "잠깐. 제정신이야? 여기서 싸우겠다고?"
70013010-168 = "문제없어! 내가 이 레스토랑에 들인 돈이 얼만데! 내가 소유주나 다름없다고!"
70013010-169 = "지금까진 사정이 있어 눈감아 줬다만, 이렇게 만나버렸으니 어쩔 수 없지."
70013010-170 = "그때의 원한을 되갚아 주마."
70013010-171 = "얘들아! 전부 쓸어버려!!"
70013010-183 = "꺄하핫, 이거 뭐야? 이런 식의 환영은 전혀 예상 못 했는데?"
70013010-184 = "사장. 어떻게 할 거야?"
70013010-185 = "여기 물건을 부쉈다간 수리비 청구서가 만만치 않을 텐데."
70013010-186 = "그, 그렇긴 하지만……."
70013010-187 = "어쩔 수 없어! 여기서 도망치는 건 하드보일드하지 않아!"
70013010-188 = "모두, 대응 사격을 시작해!"
70013010-189 = "역시 멋져, 아루 쨩! 그렇게 나와야지!"
70013010-190 = "네…… 맡겨주세요, 아루 님. 저 녀석들…… 전부 쓸어버릴게요……!"
70013010-203 = "갑자기 벌어진 호텔 레스토랑 총격전."
70013010-204 = "흥신소 68과 리가토니 패밀리 사이엔 대체 무슨 일이 있었던 걸까."
