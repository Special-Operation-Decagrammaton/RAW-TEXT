70013010-73 = "[ruby= Infusion]อินฟิวชัน[/ruby] [ruby=Al dente]อัลเดนเต[/ruby] [ruby=Brunoise]บรูนัวส์[/ruby] และอื่นๆ... มีแต่คำศัพท์เฉพาะที่ไม่เคยได้ยินมาก่อนพรั่งพรูออกมาไม่หยุด"
70013010-74 = "อะ... อะแฮ่ม! งั้นก็ดี ฉันจะตั้งตารอก็แล้วกัน"
70013010-75 = "ครับ ถ้าอย่างนั้น เราจะเริ่มเตรียม[ruby= amuse bouche]อามูซบุช[/ruby]ให้ทันทีครับ "
