[translation]
70013010-1 = "雜草不會獨自綻放（１）"
70013010-2 = "飯店高級餐廳休息區"
70013010-4 = ""
70013010-5 = ""
70013010-6 = "……"
70013010-7 = "終於……"
70013010-8 = "終於來了！"
70013010-9 = "和大家一起來到最高級飯店的高級餐廳……！"
70013010-10 = ""
70013010-12 = ""
70013010-13 = ""
70013010-14 = "能，能在這種地方和亞瑠大人一起用餐……我就算死也沒有遺憾了！"
70013010-15 = "亞瑠醬，真的沒問題嗎？這裡看起來超級貴的耶？"
70013010-17 = "當，當然沒問題！#n多虧了大家的努力，最近便利屋的收入也開始穩定了。"
70013010-18 = "……不過還是別太勉強比較好吧。"
70013010-19 = "這，這點程度沒問題的！"
70013010-20 = "最近資金寬裕到還能存點錢呢。"
70013010-21 = "……沒錯。#n要是連這點程度的待遇都給不了，那我身為社長也太沒面子了。"
70013010-22 = "所以大家別擔心，盡情享受吧。"
70013010-24 = "咯呵呵。既然你都這麼說了，那我就好好享受囉。"
70013010-25 = "保險起見先確定一下，你有訂位吧？"
70013010-27 = "那當然。"
70013010-28 = "您好，不好意思。"
70013010-29 = "歡迎光臨。"
70013010-30 = "我有訂位，名字是陸八魔……"
70013010-31 = ""
70013010-33 = ""
70013010-34 = "好的，已確認。#n這邊請。"
70013010-35 = ""
70013010-37 = ""
70013010-39 = ""
70013010-40 = ""
70013010-41 = ""
70013010-42 = ""
70013010-45 = ""
70013010-46 = "為您安排這邊靠窗的座位。"
70013010-47 = ""
70013010-49 = ""
70013010-50 = ""
70013010-51 = ""
70013010-52 = ""
70013010-53 = ""
70013010-54 = ""
70013010-55 = ""
70013010-56 = "那麼簡單為您介紹一下今天的餐點。"
70013010-57 = "主菜是主廚特製的狂獵風燉牛菲力。"
70013010-58 = "特色是用酸味較少的葡萄酒和肉汁[ruby=Deglaze]收汁[/ruby]而成的醬汁。"
70013010-59 = "此外，為了可以讓顧客品嚐到醇厚且富有層次的味道……"
70013010-60 = ""
70013010-62 = ""
70013010-63 = ""
70013010-64 = ""
70013010-65 = ""
70013010-66 = "（之後服務生冗長的菜單說明還在持續著……）"
70013010-67 = ""
70013010-69 = ""
70013010-70 = ""
70013010-71 = ""
70013010-72 = ""
70013010-73 = "[ruby= Infusion]浸漬[/ruby]、[ruby=Al dente]彈牙[/ruby]、[ruby=Brunoise]細丁[/ruby]等等……全都是平常從沒聽過的專業術語。"
70013010-74 = "咳，咳哼！聽起來還不錯呢。我很期待。"
70013010-75 = "好的。那麼馬上就從[ruby=amuse bouche]開胃前菜[/ruby]開始為您準備，請稍候片刻。"
70013010-76 = ""
70013010-78 = ""
70013010-79 = ""
70013010-80 = ""
70013010-81 = "亞瑠醬，你是聽懂那些是什麼意思才回答的嗎？"
70013010-82 = "大，大概就是最高級料理的意思吧？"
70013010-83 = "這麼貴的地方一定會端出好料理的，我們就不用去想那些細節了。"
70013010-84 = ""
70013010-86 = ""
70013010-87 = ""
70013010-88 = "話說回來，這裡的水……也不太一樣呢。"
70013010-89 = "聽說這是用純淨冰川融化而成的礦泉水。"
70013010-90 = "能，能在這種地方用餐的人，究竟都是些什麼人物呢……？"
70013010-92 = ""
70013010-93 = ""
70013010-94 = ""
70013010-95 = ""
70013010-96 = ""
70013010-97 = ""
70013010-98 = ""
70013010-99 = ""
70013010-100 = "哇……！大家看起來都超有錢的。"
70013010-101 = "我們也是以客人的身份來光顧的，不需要去跟周圍做比較。"
70013010-102 = "反倒是我們這邊的服裝更完美！"
70013010-103 = "不覺得我們穿得太浮誇了嗎？"
70013010-104 = "怎，怎麼可能……！這樣才是完美的著裝規範！"
70013010-105 = "沒有比這更適合優雅用餐的服裝了！"
70013010-106 = "咯呵呵，也就是說……亞瑠醬很清楚這裡的禮儀囉？"
70013010-107 = "那你知道這些叉子和刀子該怎麼使用嗎？有好幾種耶。"
70013010-108 = "我，我也很在意。#n為什麼會有那麼多大小不同的呢……？"
70013010-109 = "咦……那，那是因為……"
70013010-111 = "據說每道料理使用的餐具都不一樣。"
70013010-112 = "……不過什麼料理該使用什麼餐具，我也不太清楚就是了。"
70013010-113 = "隨，隨便用一個不就好了嗎？反正吃進嘴裡都一樣吧？"
70013010-114 = ""
70013010-116 = ""
70013010-117 = ""
70013010-119 = ""
70013010-120 = "哎呀，怎麼這麼吵鬧？"
70013010-121 = "看來是有幾位和這種場合不相稱的客人啊。"
70013010-123 = "哼嗯～？那是在說我們嗎？"
70013010-124 = "你剛才……是在侮辱亞瑠大人嗎……？"
70013010-126 = "亞瑠？"
70013010-127 = ""
70013010-129 = ""
70013010-130 = "……"
70013010-131 = "等等！仔細一看，你們是……！"
70013010-132 = "便利屋68！！"
70013010-133 = ""
70013010-136 = ""
70013010-137 = "不好意思……您是哪位？"
70013010-138 = ""
70013010-140 = ""
70013010-141 = ""
70013010-142 = "竟然……！竟然不記得我！？"
70013010-143 = "咯呵呵，因為我們遇過太多類似的壞蛋了。"
70013010-144 = "像你這種小嘍囉，我們可記不住呢？"
70013010-145 = "是我啊！利加托尼家族的布魯諾・利加托尼！"
70013010-146 = "你們總不會連這個名字也忘了吧！？"
70013010-147 = ""
70013010-149 = ""
70013010-150 = ""
70013010-151 = "利加托尼……家族……？"
70013010-152 = "難道說……"
70013010-153 = "這麼說來你是……"
70013010-155 = "哼，哼哼……"
70013010-156 = "哼哈哈哈哈哈……！"
70013010-157 = "想起來了嗎！那麼接下來我要做什麼，你們應該也很清楚吧！"
70013010-158 = "復仇的時刻到了！小的們！！"
70013010-159 = ""
70013010-163 = ""
70013010-166 = ""
70013010-167 = "等等。你瘋了嗎？打算在這裡動手？"
70013010-168 = "這有什麼問題！你以為我在這間餐廳砸了多少錢！？說我是半個老闆都不過分！"
70013010-169 = "之前是因為有一些隱情才會一直放過你們……#n既然今天在這裡遇到，那我也沒辦法了。"
70013010-170 = "當時的怨恨，我今天就要討回來！"
70013010-171 = "小的們！把他們全都解決掉！！"
70013010-172 = ""
70013010-175 = ""
70013010-182 = ""
70013010-183 = "呀哈哈，搞什麼？這種歡迎方式我可完全沒料到呢？"
70013010-184 = "社長，該怎麼辦？"
70013010-185 = "要是把這裡的東西砸壞，維修費可不是開玩笑的。"
70013010-186 = "那，那倒是沒錯……"
70013010-187 = "但也沒辦法！在這裡逃跑可不夠硬派！"
70013010-188 = "大家！開始反擊！"
70013010-189 = "不愧是亞瑠醬！這樣才帥氣嘛！"
70013010-190 = "是的……亞瑠大人，請交給我吧。#n那些傢伙……我會全部解決掉的……！"
70013010-191 = ""
70013010-203 = "（突如其來的餐廳槍擊戰）"
70013010-204 = "（便利屋68和利加托尼家族之間，究竟發生過什麼事呢……）"
