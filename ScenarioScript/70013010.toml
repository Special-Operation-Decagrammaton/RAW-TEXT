70013010-100 = "ว้าว ทุกคนดูรวยกันสุดๆ เลยละ"
70013010-101 = "พวกเราก็มาในฐานะลูกค้าเหมือนกัน เพราะงั้นไม่ต้องเอาตัวเองไปเปรียบเทียบกับคนอื่นๆ หรอก"
70013010-102 = "ที่จริงฉันว่าชุดของพวกเราเริ่ดกว่าด้วยซ้ำ!"
70013010-103 = "ไม่ใช่ว่าพวกเราแต่งตัวจัดเต็มเกินไปหรอกเหรอ?"
70013010-104 = "มะ... ไม่มีทาง! นี่เป็นชุดที่เหมาะที่สุดแล้วนะ!"
70013010-105 = "ไม่มีชุดไหนเหมาะกับมื้ออาหารหรูๆ ไปกว่าชุดนี้แล้วละ!"
70013010-106 = "ฮุฮุฮุ แปลว่าอารุจังรู้มารยาทของที่นี่ดีสินะ?"
70013010-107 = "งั้นรู้รึเปล่าว่ามีดกับส้อมพวกนี้ต้องใช้ยังไงบ้าง? มันมีตั้งหลายแบบแน่ะ"
70013010-108 = "ฉะ... ฉันเองก็สงสัยอยู่เหมือนกันค่ะ ทำไมถึงต้องมีหลายอันแบบนี้ด้วยคะ...?"
70013010-109 = "เอ่อ... ระ... เรื่องนั้น..."
70013010-111 = "ได้ยินว่าอาหารแต่ละชนิดจะใช้อุปกรณ์ที่ต่างกันน่ะ"
70013010-112 = "แต่ฉันก็ไม่รู้หรอกว่าอันไหนใช้กับอาหารจานไหนบ้าง"
70013010-113 = "จะ... จะใช้อันไหนก็ไม่เห็นเป็นไรเลยนี่? สุดท้ายก็เข้าปากกลืนลงท้องเหมือนกัน"
