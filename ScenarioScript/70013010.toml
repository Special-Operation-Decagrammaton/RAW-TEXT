70013010-117 = ""
70013010-119 = ""
70013010-120 = "อะไรกัน เสียงดังเอะอะอะไรกันนักหนา?"
70013010-121 = "ดูเหมือนว่าจะมีแขกที่ไม่เหมาะกับที่นี่เข้ามาสินะ"
70013010-123 = "ฮืม~ พวกเขาพูดถึงพวกเราอยู่เหรอ?"
70013010-124 = "เมื่อกี้... ดูถูกท่านอารุเหรอคะ...?"
