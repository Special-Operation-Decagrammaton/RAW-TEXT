70013010-142 = "ฉัน...! นี่ไม่รู้จักฉันงั้นเหรอ?!"
70013010-143 = "ฮุฮุฮุ พวกเราเจอพวกวายร้ายหน้าซ้ำมาเยอะ"
70013010-144 = "เลยจำพวกกระจอกแบบนายไม่ได้น่ะ"
70013010-145 = "นี่ฉันเอง! ริกาโตนีแห่งริกาโตนีแฟมิลี่!"
70013010-146 = "อย่าบอกนะว่าลืมแม้กระทั่งชื่อนี้ไปแล้ว!!"
