70013010-56 = "ต่อไปขออนุญาตแนะนำคอร์สอาหารที่จองไว้ก่อนนะครับ"
70013010-57 = "อาหารจานหลักจะเป็นสตูว์เนื้อสันในสไตล์ไวด์ฮันต์ สูตรพิเศษของเชฟครับ"
70013010-58 = "จุดเด่นของเมนูนี้คือซอสดีเกลซที่เคี่ยวจากไวน์ที่มีความเป็นกรดต่ำกับน้ำจากเนื้อสัตว์ครับ"
70013010-59 = "นอกจากนี้ เพื่อให้สัมผัสได้ถึงรสชาติที่เข้มข้นลุ่มลึก..."
