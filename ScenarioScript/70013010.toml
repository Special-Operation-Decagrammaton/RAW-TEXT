70013010-151 = "ริกาโตนี... แฟมิลี่...?"
70013010-152 = "หรือว่า..."
70013010-153 = "จะว่าไปแล้วคุณคือ..."
70013010-155 = "ฮุ... ฮุฮุ..."
70013010-156 = "ฮุฮุฮ่าฮ่าฮ่าฮ่า...!"
70013010-157 = "จำได้แล้วสินะ! งั้นก็คงรู้ดีว่าหลังจากนี้จะเกิดอะไรขึ้น!"
70013010-158 = "ถึงเวลาแก้แค้นแล้ว! เด็กๆ!!"
70013010-159 = ""
70013010-163 = ""
70013010-166 = ""
70013010-167 = "เดี๋ยวสิ เสียสติไปแล้วรึไง? จะสู้กันที่นี่เนี่ยนะ?"
70013010-168 = "ไม่มีปัญหา! รู้มั้ยว่าฉันทุ่มเงินให้ร้านอาหารนี้ไปตั้งเท่าไร! เพราะงั้นฉันก็เหมือนเป็นเจ้าของร้านนี้นั่นแหละ!"
70013010-169 = "ที่ผ่านมาฉันมีเหตุจำเป็นเลยยอมมองข้ามไปตลอด แต่ในเมื่อได้มาเจอกันแบบนี้แล้ว ก็ช่วยไม่ได้ละนะ"
70013010-170 = "จะเอาคืนให้สาสมเลย"
70013010-171 = "เด็กๆ! ซัดให้เรียบ!!"
70013010-172 = ""
70013010-175 = ""
70013010-182 = ""
70013010-183 = "วะฮ่าฮ่า อะไรกันเนี่ย? คิดไม่ถึงเลยว่าจะต้อนรับกันอย่างอบอุ่นแบบนี้?"
70013010-184 = "เอายังไงดีล่ะ ประธาน?"
70013010-185 = "ถ้าทำข้าวของในร้านนี้พัง คงถูกเรียกเก็บค่าซ่อมแพงมากแน่ๆ"
70013010-186 = "ระ... เรื่องนั้นก็จริงอยู่หรอก..."
70013010-187 = "ช่วยไม่ได้! ถ้าหนีออกไปทั้งๆ แบบนี้ก็ไม่ใช่วายร้ายแล้วละ!"
70013010-188 = "ทุกคน! เปิดฉากยิงโต้ตอบได้!"
70013010-189 = "เท่สุดๆ สมกับเป็นอารุจังเลย! ต้องแบบนี้สิ!"
70013010-190 = "ค่ะ... ให้เป็นหน้าที่ของฉันเองค่ะ ท่านอารุ เจ้าพวกนั้น... ฉันจะจัดการให้เรียบเลยค่ะ...!"
70013010-191 = ""
70013010-203 = "จากนั้นก็เกิดเหตุยิงปะทะขึ้นอย่างกะทันหันขึ้นภายในร้านอาหารของโรงแรม"
70013010-204 = "หน่วยรับจ้างสารพัด 68 กับริกาโตนีแฟมิลี่เคยมีเรื่องบาดหมางอะไรเกิดขึ้นกันแน่..."
