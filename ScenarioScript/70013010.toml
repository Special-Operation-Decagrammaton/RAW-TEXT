70013010-81 = "อารุจัง ที่ตอบไปเนี่ยรู้ความหมายรึเปล่า?"
70013010-82 = "กะ... ก็คงหมายถึงอาหารชั้นเลิศนั่นแหละ"
70013010-83 = "ร้านราคาแพงๆ แบบนี้คงทำอาหารที่ดีออกมาแน่ ไม่ต้องห่วงเรื่องเล็กๆ น้อยๆ หรอก"
70013010-84 = ""
70013010-86 = ""
70013010-87 = ""
70013010-88 = "จะว่าไป แม้แต่น้ำดื่มของที่นี่... ก็ไม่ธรรมดาเลยนะ"
70013010-89 = "ได้ยินว่าเป็นน้ำแร่ที่ได้จากการละลายธารน้ำแข็งบริสุทธิ์น่ะ"
70013010-90 = "คะ... คนที่มากินอาหารในที่แบบนี้เป็นใครกันแน่นะคะ...?"
