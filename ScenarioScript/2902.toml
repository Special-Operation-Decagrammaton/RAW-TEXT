[translation]
2902-1 = "그렇게 소녀들은 한자리에 모인다. 2"
2902-2 = "와-아, 와앗!"
2902-10 = "이곳이 소문으로만 듣던 인법연구부의 부실이로군요……!"
2902-12 = "츠쿠요, 여기여기."
2902-16 = "네엣……?"
2902-22 = "어떡해, 츠쿠요! 수상한 애가 와버렸어! 아니, 생긴 건 귀엽지만!"
2902-23 = "네, 네엣……? 수, 수상한, 가요오……?"
2902-24 = "그도 그럴게…… 인법연구부라는 정체불명의 동아리에."
2902-25 = "그것도 솔선해서 입부하기 위해 찾아오다니, 어딜 봐도 수상함이 한가득……"
2902-26 = "사실상 걸어 다니는 수상함, 그 자체라고!"
2902-27 = "저, 저기…… 이, 일단 저도, 이, 입부했는데요, 오오……."
2902-28 = "츠쿠요는 내가 직접 스카우트한 거니까 노카운트! 응! 노카운트니까!"
2902-29 = "앗, 네, 네엣……!"
2902-30 = "헉?! 혹시…… 우리를 눈엣가시로 여기고 있는 음양부나, 백화요란에서 보낸 자객이라거나?!"
2902-34 = "……응! 물론! 그럴 리는 없겠지만-!"
2902-35 = "처, 처음 뵙는 분이라, 무섭기는 하지만,"
2902-39 = "그래도 모, 모처럼 찾아와주셨으니까……."
2902-40 = "이, 이것으로 저, 정식 동아리를 위한 첫걸음을 내, 내디딘 거네요……!"
2902-41 = "음…… 부원은 있었으면 하지만, 역시 어떤 사람인지 모르고 무턱대고 받기에는 좀……."
2902-45 = "좋아. 결정했어."
2902-49 = "여기서부턴 특별 면접이야!"
2902-51 = "트, 특별 면접……?"
2902-52 = "응! 인법연구부에 입부하려는 저 아이가 정말로 우리 동아리에 어울리는지! 그걸 확인해보는 거야!"
2902-54 = "그래서 면접을 볼 생각이야. 이즈나 양. 어때, 괜찮겠지?"
2902-55 = "과연…… 어중간한 닌자는 임무에 지장을 초래할지도 모르니까……. 그런 것이군요!"
2902-56 = "이즈나는 문제없어요!"
2902-57 = "응? 그래? 뭐, 그렇다면 다행이지만."
2902-58 = "아, 이럴 게 아니라. 츠쿠요, 모처럼 손님이 오셨으니까. 마실 것 좀 내줄래?"
2902-59 = "네, 넷!"
2902-67 = "저, 저, 저, 저기이………"
2902-73 = "여, 여, 여 여, 여기, 마, 마, 마, 마실 것 가, 가져왔습니다아아……."
2902-75 = "앗, 네!"
2902-80 = "이, 있는 건 없지만, 드, 드세요오오……."
2902-82 = "앗. 감사합니다! 닌닌!"
2902-83 = "니, 닌닌……! 저, 처, 처음 들어봤어요!"
2902-84 = "아, 죄송해요. 그게……. 여기, 차, 같은 게 아니라서, 며, 면목이 없습니다마는……."
2902-85 = "그, 그냥 수돗물, 이라, 죄, 죄송합니다아……."
2902-86 = "과연, 이것이 접대용 수돗물……."
2902-87 = "히, 히익, 죄, 죄송합니다……! 모처럼 손님이 오셨는데, 물을 대접하다니……?!"
2902-88 = "괴, 괴롭히려는 게 아니라요……! 이 근처에선, 찻잎 같은 걸 구하기 힘들어서, 그게……!"
2902-89 = "저희, 부비도 없다보니까아-! 후, 훌쩍……!"
2902-91 = "괜찮아! 츠쿠요! 괜찮으니까!"
2902-92 = "수돗물도 어떤 의미로 보면 사회의 상수도 시스템이 마련해준 <사회의 마실 것>이라고 부를 수 없는 것도 아닌 게, 또 아니니까! 괜찮아! 응! 아마도!"
2902-93 = "의, 의미를 모르겠어요오오. 부, 부장니임……!"
2902-95 = "굉장해요!"
2902-96 = "……응?"
2902-97 = "…………네……?"
2902-98 = "이즈나, 예전에 닌자 시대극에서 비슷한 걸 본 적 있어요!"
2902-99 = "진정한 닌자라면, 마실 것은 냉수만으로 충분하다……! 그 이상은 사치에 불과한 법!"
2902-100 = "그것을 일상생활에서도 실천하고 있다니, 소문으로 들은 것 이상으로……. 이것이 인법연구부! 이즈나! 감격했어요!"
2902-101 = "아…… 그, 그래?"
2902-102 = "흠흠. 어쨌거나 본론으로 들어가서……"
2902-103 = "이즈나 양, 우리 부실은 어떻게 찾은 거야?"
2902-104 = "내 입으로 이런 말 하기도 좀 그렇지만, 우리 인법연구부의 부실은 그게- 백귀야행 자치구에서도 꽤 외진 곳에 있잖아?"
2902-105 = "교통도 불편하고, 편의시설도 부족하고……."
2902-106 = "(물론 전부 백화요란이나 음양부 같은 귀찮은 녀석들의 시선을 피하기 위해서지만…….)"
2902-108 = "네, 화, 확실히 불편해서, 그, 찾아오기도 힘들고, 그게, 중간에 버스라도 놓치면 학교에 가는 것도 어, 어렵구……."
2902-109 = "구, 구교사다 보니, 가, 가끔 전기랑 물이 끊길 때도 있어서, 주변에 편의점 하나 없는 게, 또 크, 큰일이 되어 버리기도 하지만……."
2902-110 = "츠쿠요, 혹시 그거 나 들으라고 하는 소리는 아니지?!"
2902-111 = "그, 그래도 좋은 곳이니까요!"
2902-112 = "바, 밤이 되면 별도 잘 보이고, 조용해서- 부, 부장님의 인법을 촤, 촬영하기에도, 조, 좋고……!"
2902-113 = "아, 그렇지- 무슨 일을 해도 클레임이 들어오지 않는 건 최고야."
2902-114 = "특히 내가 최근에 직접 만든 <반짝반짝 파이어의 술>이라는 인법이 있는데 말이야~ 꽤나 자신작이라고나 할까~"
2902-116 = "지, 직접 만든 인법의 수련……!"
2902-117 = "응……?"
2902-118 = "아 참! 이즈나가 이곳을 찾을 수 있던 건, 거리에서 이 단서를 찾은 덕분이었어요!"
2902-122 = "앗, 저건……."
2902-126 = "앗! 기억났다! 내가 반년 전쯤에 거리에 붙여 뒀던 홍보용 전단지-!"
2902-127 = "이 전단지에 적혀 있는 암호. 시바견왕왕 감독의 대표작 <닌자를 동반한 시바견>에 나온 암호죠?"
2902-128 = "아닛?! 그걸 알아봤다고?!"
2902-129 = "대, 대단해요……!"
2902-131 = "(확실히, 그걸 알아봤다는 건 나와 같은 영화를 좋아한다는 거니까……. 물론 그걸 노리고 만든 거긴 하지만…….)"
2902-132 = "(이제까지 전단지를 보고 찾아온 건, 이런 걸 붙이는 건 불법이라면서 잔소리를 하러 쫓아온 백화요란 녀석들뿐이어서, 완전 실패했다고 생각했는데……)"
2902-133 = "(그걸 알아보다니 설마…… 이 아이……?)"
2902-135 = "크흠흠, 보통이 아닌걸……! 그럼 두 번째 질문이야."
2902-136 = "어쩌면 가장 중요한 질문일 수도 있는데……."
2902-137 = "앗! 넵-! 꾸, 꿀꺽!"
2902-138 = "그, 이즈나 양이 우리 인법연구부에 들어오려는 이유가 뭔지 궁금해."
2902-139 = "아, 그거라면-"
2902-140 = "이즈나는……! 인법연구부의 여러분처럼 되고 싶다고 생각했기 때문이에요!"
2902-141 = "엥? 우리처럼……?"
2902-142 = "넷……?"
2902-143 = "<소녀인법첩 미치룻치> 채널에 올라온 영상 중에 특히나 그거!"
2902-144 = "<보시라! 단번에 바위를 파괴하는 초강력 인법! 여기에 강림!> 영상을 보고 이즈나 엄청 감동해서……!"
2902-145 = "아, 그거라면……."
2902-146 = "저, 저희 채널에서도 가장 조회수가 많이 나왔던, 그, 여, 영상이에요! 부, 부장님!"
2902-147 = "흠흠~ 뭐, 그 영상, 확실히 공을 들인 물건이었으니까."
2902-149 = "(사전에 바위를 쪼개기 쉽게 세팅해두고, 딱 타이밍 좋게 폭약을 써서 마치 곧바로 쪼갠 것처럼 연출한 것뿐이지만……. 비주얼이 화려했던 덕분에 조회수가 제법 잘 나왔었지.)"
2902-150 = "(그렇구나……. 우리 채널을 봐줬던 거구나.)"
2902-151 = "(그래서 우리의 팬이 되었고, 우리처럼 되고 싶어서 인법연구부에 입부할 생각까지 했단 말인가~ 우햐햣~)"
2902-153 = "……응? 잠깐, 그렇다는 건…… 이즈나 양, 우리 채널의 구독자였어?!"
2902-154 = "네!"
2902-155 = "부, 부장니임……! 구, 구독자분이라니……! 저, 처, 처, 처음 봤어요!"
2902-160 = "이, 이걸 기록해둬야. 사, 사, 사, 사진이라도 찍어둘까요!? 도, 도망갈지도 모르니까요!"
2902-161 = "아니아니, 츠치노코처럼 말하기냐고~! 그야 어딘가엔 있었겠지! 구독자! 물론 당사자인 나도 깜짝 놀란 참이지만!"
2902-162 = "그 영상을 보고 이즈나, 여러분과 함께하면 키보토스 최고의 닌자가 될 수 있겠다고 생각했어요!"
2902-163 = "………응?"
2902-164 = "키, 키보토스, 최, 최고의 닌자……인가요……?"
2902-165 = "자, 잘은 모르겠지만. 이즈나 씨는 대, 대단하네요……!"
2902-166 = "키보토스 최고의 닌자라……. 으음, 뭐라고 할까-"
2902-167 = "……응! 멋진 취향이잖아! 자고로 닌자라면 그 정도 포부는 있어야지!"
2902-168 = "애당초 시바견왕왕 감독의 작품을 알아보는 눈썰미…… 우리처럼 되고 싶다는 그 결심까지……"
2902-172 = "이건 의심할 여지 없이……!"
2902-173 = "이즈나 양은 우리와 동류인 거구나!"
2902-175 = "네……! 이즈나도 이렇게 만나 뵙게 되어 기뻐요!"
2902-176 = "과, 과연 부, 부장님께서 찾고 있던 인재……!"
2902-178 = "물론 이즈나는, 아직 인법연구부 여러분 같은 수준의 닌자에는 미치지 못하지만요!"
2902-179 = "이야~ 그런 말을 들을 정도는 아니라고 생각하는데~"
2902-180 = "이즈나 양이랑 우리는 딱히 차이 없다니까~"
2902-181 = "네……? 하지만 이즈나는 아직 많이 부족해서……."
2902-182 = "우리의 전단지를 보고 이곳까지 찾아올 정도잖아? 그 말은 이즈나 양도 닌자를, 엄청 좋아하고 있단 거지? 알 수 있어."
2902-183 = "……!!"
2902-184 = "……네! 이즈나는, 닌자를 엄청 좋아해요!"
2902-185 = "물론 예전엔 이해해주는 사람 하나 없이, 이즈나는 줄곧 혼자였고……"
2902-186 = "그러다가 어느 때엔, 축제를 망치려고 하는 나쁜 악당에게, 이즈나는 바보 취급당하면서 이용당하기도 했지만……."
2902-190 = "(축제를 망치려고 드는 악당? 취미를 바보 취급해……?)"
2902-191 = "(아, 혹시 코미센의 이야기인가?)"
2902-192 = "(코미센에서 악당이라고 부를만한 족속들이라면…….)"
2902-194 = "이즈나 양, 혹시 그 악당이란 녀석."
2902-195 = "자기 이익만을 위해 멋대로 축제에서 난동을 피우며 폐를 끼치는, 그런 녀석 아니었어?"
2902-196 = "맞아요! 이즈나의 말만으로 전부 알아채다니……! 어떻게……?"
2902-197 = "뭐, 어느 장소에나 있는 법이지."
2902-198 = "자기들이 메인스트림이라고 해서, 혹은 하이 컬쳐를 다루고 있다고 해서 상대를 바보 취급하는 그런 무리들이!"
2902-199 = "정말이지- 취미를 즐긴다면 다른 장르에도 리스펙을 가져달라구! 그런 태도로 고생하는 건, 결국 자기 자신이나 주변 동료들인데 말이야."
2902-200 = "과, 과연……! 세상엔 냥텐마루 같은 악당이 잔뜩……!"
2902-201 = "그 정도로 닌자의 세계가 무자비했을 줄이야…… 이즈나, 또 하나 배웠어요!"
2902-202 = "그런 일을 겪으면서도 닌자를 계속 좋아하는 거잖아? 그건 굉장한 거라고."
2902-204 = "저, 저라도 엄청 괴로워서! 다, 당분간은 닌자에 대해 생각도 하고 싶지 않았을 거예요!"
2902-205 = "그런데도 이즈나 씨는……."
2902-206 = "그게……"
2902-207 = "이즈나는, 다행히 주군과 만났거든요!"
2902-208 = "……엥?"
2902-210 = "(닌자설명중)"
2902-212 = "……그렇게 되어! 이즈나는! 주군의 닌자가 된 거예요!"
2902-213 = "아, 으응. 그래, 으음."
2902-218 = "(뭔가 엄청난 활극 한 편을 들은 듯한, 아니, 그보다……)"
2902-219 = "(주군이라고 부를 정도의 신뢰 관계? 아니, 혹시 무슨 플레이의 일종……인가?)"
2902-221 = "으음, 샬레의 선생이라면 어디선가 들어봤던 거 같기도 하고……"
2902-222 = "부, 부, 부장니이임…… 흐, 흐윽. 후, 훌쩍."
2902-223 = "어라, 츠쿠요? 울어……?"
2902-224 = "이, 이즈나 씨가, 저런, 저런 역경을 뛰어넘어 왔다니…… 저, 너, 너무 감동해버려서……"
2902-225 = "이즈나 씨이이……! 괴, 괴로운 일을 겪어왔던 거네요!"
2902-226 = "네! 조금 괴로운 일이 있긴 했지만, 그래도 이즈나는 괜찮아요."
2902-227 = "덕분에 주군과 만나 계속해서 꿈을 꿀 수 있었으니까!"
2902-228 = "……!! 네! 정말 아름다운 이야기예요! 그쵸! 부장님?!"
2902-229 = "으음, 뭐, 단번에 이해하기는 어렵지만."
2902-230 = "그래도 이즈나 양의 진심은 잔뜩 전해졌어! 뭐야, 좋은 이야기잖아! 그것도 엄청나게!"
2902-231 = "이즈나 양의 주군이란 사람이 누군지, 만나보고 싶을 정도야!"
2902-232 = "아, 기회가 된다면 부디!"
2902-236 = "어쨌거나 이러저러하게 되어서, 이즈나는 이곳 인법연구부에 찾아온 거예요!"
2902-237 = "이게, 대답이 되었을, 까요?"
2902-242 = "부, 부장니임……?"
2902-243 = "이즈나 양…… 아니, 이즈나! 대답이 된 정도가 아니야!"
2902-244 = "네가 겪어온 일! 네가 살아온 인생! 너의 꿈 전부!"
2902-245 = "그야말로 인법연구부 그 자체잖아!"
2902-247 = "지금부터 이즈나, 너는 우리 인법연구부의 부원이다! 이걸로 괜찮지, 츠쿠요?!"
2902-248 = "네! 이즈나 씨…… 아니, 이즈나 쨩! 인법연구부의 부원이 된 걸 환영해요!"
2902-249 = "아, 제, 제가, 인법연구부의……."
2902-253 = "네! 이즈나! 인법연구부의 부원으로서 앞으로 잘 부탁드려요!"
2902-254 = "부장……! 그리고 츠쿠요 공……!"
2902-255 = "부, 부장? 왠지 츠쿠요가 아닌 다른 사람한테 부장이라고 불리는 건 익숙하지 않지만……."
2902-256 = "응, 좋네! 그거!"
2902-257 = "츠, 츠쿠요 공이라니, 에, 에헤헷……"
2902-258 = "저, 저도 잘 부탁드려요. 이, 이즈나 쨩……"
2902-259 = "네! 이즈나도 이곳에서 여러분과 함께!"
2902-260 = "앞으로도 키보토스 최고의 닌자가 되기 위해 노력할 테니까요! 닌닌!"
2902-261 = "물론이지! 노려라 정식 동아리 인가! 노려라! <소녀인법첩 미치룻치>의 구독자 100명 돌파!"
2902-262 = "네! 같이 노력해요!"
2902-263 = "네! 닌닌~!"
2902-270 = "(그렇게 제각기 꿈을 품고 모인 소녀들이, 추후 <주군>이라고 부르는 사람과 만나게 되는 건, 조금 더 나중의 이야기……)"
2902-271 = "그렇게 소녀들은 한자리에 모인다."
