[translation]
10017025-1 = "제2화;Les Miserables……?"
10017025-10 = "뒷골목"
10017025-11 = "헉, 헉……! 이봐, 괜찮냐? 살아 있어?"
10017025-16 = "제길…… 막다른 곳이야. 내몰렸어!"
10017025-19 = "불량배들을 몰아넣는 데에 성공했습니다. 마시로, 들리나요?"
10017025-20 = "네. 문제없습니다!"
10017025-21 = "지원 사격 부탁합니다."
10017025-22 = "알겠습니다. 저격 개시합니다!"
10017025-23 = "그러면, 마무리는 맡기겠습니다."
10017025-24 = "키힛…… 크크큭……"
10017025-29 = "앗, 따가. 앗, 따가! 어디에서 쏴대는 거야!"
10017025-30 = "보통 탄환이 아니야……! 그건가? 정의실현부의 저격수!"
10017025-31 = "우리가 뭘 그렇게까지 잘못했다는 거야?"
10017025-32 = "맞아 맞아! 평소처럼 인질을 납치해서 몸값을 요구한 것도 아니고!"
10017025-33 = "세력 다툼으로 거리를 반쯤 부숴 놓지도 않았고!"
10017025-34 = "폭동을 일으키지도 않았고 과격 시위를 조장한 것도 아니고 집단 구타도 안 했는데!"
10017025-35 = "애초에 크리스마스잖아? 우리도 조용히 좀 보내고 싶다고!"
10017025-39 = "콰아아앙-!!"
10017025-40 = "히, 히이이익?!"
10017025-41 = "뭐, 뭐야? 무슨 일이야?!"
10017025-46 = "크크크크큭. 크크큭……."
10017025-47 = "크히히히히히히히히힛-!!"
10017025-49 = "저건……?!"
10017025-50 = "사, 살려 줘! 내겐 돌아가서 보살펴줘야 할 여우 같은 토끼들이……!"
10017025-52 = "키에에에에에에에엑---!!!!"
10017025-64 = "후우……"
10017025-65 = "상황 종료. 수고했어요. 마시로, 츠루기."
10017025-66 = "수고하셨습니다. 하스미 선배, 츠루기 선배."
10017025-71 = "……예의 그 물건은?"
10017025-76 = "확실히 회수했습니다. 걱정 말아요."
10017025-77 = "그건 그렇고, 크리스마스에 이런 발상이라니."
10017025-78 = "여러 가지 의미로 기발하다고 해야 할지, 악마적이라고 해야 할지, 게헨나나 떠올릴 법한 방식이라고 해야 할지……"
10017025-79 = "어느 쪽이든, 끔찍한 행위라는 사실은 변함이 없을 것 같습니다. 선배."
10017025-80 = "재난이라고 할 수밖에 없겠군요. 송년회 직전에 이런 일을 처리해야 하다니……"
10017025-81 = "하지만 다른 누군가에게 맡길 수도 없는 일이었습니다."
10017025-82 = "'정의'를 실현하는 우리 정의실현부가 나서는 게, 순리에는 더 맞지 않을까요?"
10017025-83 = "정의의 실현에 때와 장소를 가려서는 안 됩니다. 마시로. 크리스마스 당일이라고 해도요."
10017025-84 = "과연, 정의의 실현에는 때와 장소를 가려서는 안 된다……"
10017025-85 = "저는 아직도 부족한 모양입니다. 더욱 정진하겠습니다. 선배."
10017025-86 = "으음…… 네. 지나치게 과격하게만 나아가지 않는다면……"
10017025-87 = "이미 이런 일을 저지르고 만 입장에서, 조금 늦은 것 같기도 합니다만."
10017025-89 = "……늦었다고 하니, 다른 쪽 일도 늦은 것 같은데……"
10017025-90 = "아, 그렇군요. 송년회."
10017025-91 = "정말, 안 그래도 약속에 늦을 것 같았는데, 시간이 더욱 빠듯해지고 말았군요."
10017025-92 = "서두르죠. 저희가 늦는다면 많은 부원들이 기다려야 할 겁니다."
10017025-93 = "그럼 갈까요. 츠루기. 마시로."
10017025-98 = "……갔지?"
10017025-99 = "아고고고…… 죽겠네."
10017025-100 = "너무들 하네! 우린 크리스마스를 지내지도 말라는 거야, 뭐야!"
10017025-101 = "있는 것들이 더 한다니까, 가만 보면…… 그나저나, 이제부터 어떡하지?"
10017025-102 = "생각해 둔 건 다 엉망이 됐고, 가지고 온 것들도 전부 뺏겼고……"
10017025-103 = "일단 여길 나가자……"
10017025-112 = "키보토스 거리"
10017025-116 = "울면 안 돼~ 울면 안 돼~"
10017025-117 = "하나에 쨩? 조금 천천히 가요!"
10017025-118 = "그러고 보니, 선배. 오늘은 산타클로스가 오시는 날인데, 저희가 산타 복장을 하고 있어도 될까요?"
10017025-119 = "그래서 산타에게 부끄럽지 않도록 자선 활동을 하는 것 아니겠어요?"
10017025-120 = "그렇네요! 이 복장을 입었으면, 그만한 책임을 져야 하는 거겠네요!"
10017025-121 = "저, 참을 수 없어졌어요! 한시라도 빨리 현장에 도착해야겠어요!"
10017025-125 = "하, 하나에 쨩? 조심해요! 길이 미끄럽다구요~"
10017025-131 = "구호기사단과 샬레의 선생님이잖아? 뭘 하고 있는 거지……?"
10017025-132 = "구호기사단이면, 그거겠지. 매년 자선냄비 가지고 뭘 하잖아."
10017025-133 = "아하, 그건가. 올해는 거기에 선생님까지 합류하는 거고. 정말이지, 다들 크리스마스구만."
10017025-134 = "가만있어 봐…… 구호기사단…… 선생님…… 크리스마스……"
10017025-135 = "나 지금 뭔가 좋은 생각이 떠오른 것 같은데 말이야."
10017025-136 = "또 뭐? 여기에서 더 엉망이 되지나 않았으면 좋겠는데."
10017025-137 = "아냐, 들어 봐. 이거 분명 통할 거라고."
10017025-142 = "너 천재냐?"
10017025-143 = "다 잃었는데, 머리라도 굴려야지. 그럼 찬성하는 거지?"
10017025-144 = "다른 방법도 없잖아? 좋아, 해 보자고."
10017025-145 = "일단 우리가 최대한 불쌍하게 보여야 할 텐데……"
10017025-146 = "그건 걱정 말자고. 크리스마스에 가진 거 다 빼앗기고, 계획 망쳤고,"
10017025-147 = "이런 처지가 불쌍하지 않으면 누가 불쌍하다는 거야?"
10017025-148 = "말해 놓고 나니까, 조금 울고 싶어졌어……"
10017025-149 = "울 거면 모든 게 끝나고 나서 울자고. 그건 언제든 할 수 있는 일이잖아."
