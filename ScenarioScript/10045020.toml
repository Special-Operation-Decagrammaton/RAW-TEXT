[translation]
10045020-1 = "제2화;제1회전: 물총 서바이벌 게임"
10045020-4 = "계속 밀어붙여! 백화요란 녀석들부터 쓰러뜨리는 거다!!"
10045020-5 = "이 기회에 그동안의 원한을 마음껏 갚아주는 거야!!"
10045020-9 = "유카리! 그쪽 뚫릴 것 같은데, 만회 가능해?"
10045020-13 = "아, 아직 괜찮아요!"
10045020-14 = "어째서지? 분명 완벽한 작전이었는데……."
10045020-15 = "역시 난 안돼…… 모두의 발목을 붙잡기만 해서……."
10045020-17 = "으아아, 다들 정신 차리라고!!"
10045020-19 = "10분 전……."
10045020-21 = "사방은 탁 트인 해변."
10045020-22 = "내 예상대로라면 모두 살아남기 위해 최대한 엄폐물에서 나오지 않을 거야."
10045020-23 = "그러니까 우리도 모래로 진지를 구축하고 버티는 게 효과적이라고 생각해."
10045020-24 = "그럼, 그때까지 시간은 소녀가 벌게요!"
10045020-26 = "흠, 난 돌진이 취향이지만 키쿄가 그렇게 말한다면야."
10045020-27 = "그럼 결정이네. 키쿄의 작전대로 가보자."
10045020-29 = "……대체 어디서부터 잘못된 거지?"
10045020-30 = "계획대로라면 이런 대규모 전투에 휘말리진 않아야 했는데."
10045020-34 = "크아아악……!"
10045020-35 = "앗! 정신 차려! 이 경기가 끝나면 같이 디저트 카페에 가기로 했잖아!"
10045020-39 = "아아악……!!"
10045020-40 = "이, 이런 무자비한 공격이라니! 백화요란 녀석들, 용서 못 해……!!"
10045020-42 = "그건 억지이어요!!"
10045020-43 = "왜 전부 우리만 노리냐고!!"
10045020-45 = "너희부터 없애지 않으면 우리에겐 미래가 없으니까!"
10045020-46 = "그래! 어떻게든 우승 후보부터 떨어뜨려야 우리가 이길 가능성이 있어!!"
10045020-47 = "너희 때문에 활동 자금이 다 떨어져서 꼭 우승 상금을 타야 한다고!!"
10045020-49 = "……눈물 나는 이유가 있었네."
10045020-50 = "흥, 자업자득이잖아!"
10045020-54 = "앗, 위험해 리더……!!"
10045020-60 = "아, 아아아악……!!"
10045020-62 = "이, 이럴 수가……!"
10045020-63 = "네놈들, 역시 용서 못 해!!"
10045020-64 = "아아, 이것이 증오의 연쇄! 이것이 전장의 비애!"
10045020-65 = "하지만 이런 시련을 딛고 일어나는 것도 청춘의 로오~망스!"
10045020-66 = "청춘은 그렇게 피비린내 나지 않아!"
10045020-71 = "오오, 시작부터 난전인 상황! 백화요란은 과연 어디까지 버틸 수 있을까요!"
10045020-73 = "우리가…… 도와주자."
10045020-74 = "좋습니다! 저분들에겐 신세를 많이 졌으니까요!"
10045020-75 = "후훗, 그럼 가볼까요?"
10045020-80 = "뭐, 뭐지?"
10045020-81 = "저, 저건……!"
10045020-85 = "인법연구부, 도와드리겠습니다……! 닌닌!"
10045020-86 = "저는 인법연구부가 아닌데요……."
10045020-87 = "아무튼…… 같이 싸우는 거야."
10045020-89 = "크윽, 저 녀석들이 합류하다니……!"
10045020-90 = "다들 겁먹지 마! 아직은 우리가 유리하다!"
10045020-97 = "배, 백화요란 여러분! 저희도 돕겠어요!"
10045020-98 = "잠깐이지만…… 렌게 쨩은 우리 부에서 활동했었으니까!"
10045020-100 = "오오, 너희들!"
10045020-101 = "크윽, 저 녀석들 갑자기 숫자가 늘었어……?!"
10045020-102 = "오오, 이걸로 전세 역전인 것이어요!"
10045020-103 = "좋아! 다들 돌진해서 섬멸한다!!"
