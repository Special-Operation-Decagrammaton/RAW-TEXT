[translation]
1008303-1 = "맺고 끊음은 확실하게"
1008303-5 = "예고한 대로 방문했어."
1008303-6 = "[s1] \"예고라고 하기엔 제법 갑작스러웠던 느낌이…….\"\n[s2] \"네, 방문하셨군요…….\""
1008303-9 = "흥, 꽤나 떨떠름한 반응이네."
1008303-10 = "갑작스러운 학생의 방문이 달갑지 않은 것일까?"
1008303-11 = "……아니, 평소 풍문으로 듣기에 샬레는 그 어떤 학생에게라도 열려 있는 장소라 했었지."
1008303-12 = "그럼 여기서 소거법으로 따져 본다면 달갑지 않은 건 학생이라는 카테고리가 아닌……"
1008303-13 = "내 쪽의 이야기가 되는 거려나?"
1008303-14 = "[s3] \"아니! 전혀! 절대로! 그렇지 않습니다!\"\n[s4] \"응! 역시 필요하다면 얼마든지 마음껏 방문해 줬으면 할 정도니까!\""
1008303-17 = "……아, 그래."
1008303-18 = "으음……."
1008303-19 = "그…… 나도 그냥 살짝 농담을 했을 뿐이니까."
1008303-20 = "그렇게까지 격하게 변명하지 않아도 괜찮아."
1008303-21 = "[s] \"으응? 그래? 미안…… 키쿄의 농담이 내겐 살짝 어려웠나 봐.\""
1008303-22 = "……지금 그거, 혹시 놀리는 거야?"
1008303-23 = "아니…… 잡담은 여기까지."
1008303-24 = "난 어디까지나 당신에게 볼일이 있어 찾아왔을 뿐이니까."
1008303-25 = "어쩐 일로 이렇게 샬레를 찾아온 거냐고?"
1008303-26 = "그 이유라면 단순해."
1008303-30 = "저번에 선생님. 당신이 적극적으로 백화요란의 부실을 고쳐준 덕분에, 최근 부원들 사이에서 제법 평이 좋아."
1008303-33 = "구체적으로 예를 들면 <더는 비가 와도 양동이를 찾을 필요가 없사와요!> 라던가, <바닥이 언제 무너질지 조마조마하면서 걷지 않아도 되니, 엄청 편하네.> 라던가."
1008303-34 = "<장지문에 뚫려 있던 구멍이 사라졌어! 문이라는 건 원래 비바람을 막아주는 기능을 가지고 있는 물건이구나!> 라든가……."
1008303-35 = "[s] \"저기, 평소에 대체 어떻게 생활을 했던 거야?!\""
1008303-38 = "뭐어, 살짝 과장은 있을지언정 모두가…… 나를 포함해 고마움을 느끼고 있는 건 사실이야."
1008303-39 = "그런 의미에서 오늘, 나는 당신에게 빚을 갚고자 찾아왔어."
1008303-40 = "샬레의 선생님. 오늘 하루 당신의 업무를 나, 키류 키쿄가 도와주겠어."
1008303-46 = "지금이라면 백화요란의 작전참모에게 무엇이든 시킬 수 있는 기회야."
1008303-47 = "어때, 제법 구미가 당기는 이야기이지 않아?"
1008303-48 = "[s5] \"그거라면 신경 쓸 필요 없어. 원래부터 대가를 받을 생각도 없었고.\"\n[s6] \"게다가 이미 보상이라면, 저번에 충분히 받았잖아?\""
1008303-51 = "……거짓말."
1008303-52 = "[s] \"……네?\""
1008303-53 = "처음부터 보상은 필요 없었다느니, 저번에 대접받은 저녁 한 끼로 충분하다느니."
1008303-54 = "정말 그런 걸로 충분할 리가 없잖아."
1008303-55 = "점잔 뺄 필요 없어."
1008303-56 = "사람과 사람 사이의 관계란 곧 주고받는 것이 오고 가야 성립할 수 있는 것."
1008303-57 = "한쪽이 다른 한쪽에게 시혜할 뿐인 관계는, 애당초 관계로서 파탄 나 있는 것이나 다름없어."
1008303-58 = "인간이란 욕망을 가진 생물. 바라는 바가 있어 접근하고 관계를 맺는 것이 당연한 생물이야."
1008303-59 = "그러니 의연한 척 속내를 숨기려고 해 봤자 나 키류 키쿄의 눈을 피할 수는 없어."
1008303-60 = "서로 의중을 떠보기 위해 무의미한 대화를 지속해 봐야 피차 피곤해지기만 할 뿐이니까. 그냥 시원스레 원하는 바를 말하도록 해."
1008303-61 = "<이용할 수 있는 수단은 많으면 많을수록 좋은 법>. 그리고 지금이 바로 그 수단으로써 키류 키쿄를 이용할 수 있는 기회야."
1008303-62 = "이런 기회, 흔치 않다는 걸 알아두도록 해."
1008303-66 = "[ns7] \"으음, 키쿄가 그렇게까지 말한다면 알았어.\"\n[ns8] \"모처럼의 기회니까.\""
1008303-69 = "……그래. 그럴 줄 알았어."
1008303-70 = "좋아. 아무거나 괜찮아. 당신이 무엇을 요구하든 나 키류 키쿄가 기대했던 것보다 그 이상으로 완벽하게 해내 보일 테니까."
1008303-75 = "(……이거면 됐겠지.)"
1008303-76 = "(얌전히 원하는 걸 들어주는 걸로 서로 간의 빚은 전부 청산.)"
1008303-77 = "(그러면 우리 관계도 이전과 마찬가지의 형태로 다시 돌아갈……)"
1008303-78 = "[ns] \"키쿄에게 부탁하고 싶은 건 <오늘 하루 잔뜩 쉬기>야.\""
1008303-82 = "……뭐?"
1008303-83 = "잠깐, 그건 무슨 농담이야?"
1008303-84 = "제대로 들은 거야?"
1008303-85 = "나를 <이용>할 수 있는 기회라고 말했을 텐데."
1008303-86 = "……아니면, 나를 바보 취급하는 거야?"
1008303-87 = "[s] \"응, 그러니까 나는 키쿄에게 <쉬는 일>을 부탁한 거야.\""
1008303-91 = "[ns] \"키쿄도 작전참모라면 잘 알 거 아냐? 쉬는 게 얼마나 중요한지.\""
1008303-95 = "그, 그쯤은 알고 있어!"
1008303-96 = "작전 행동을 하는 것에 있어 보급이나 휴식도 충분히, 경우에 따라서는 일을 하는 것보다도 중요한 일이라는 것쯤은."
1008303-97 = "하지만 지금 우리는 그런 이야기를 하는 게 아니잖아."
1008303-98 = "당신의 말장난 같은 말을 듣고 납득할 수 있을 리가……."
1008303-99 = "[s] \"나는 키쿄의 말대로 부탁을 했을 뿐. 따르고 안 따르고는 키쿄의 몫이야.\""
1008303-100 = "그래서 선택권을 내게 떠넘긴다, 이거야?"
1008303-101 = "……어처구니가 없어. 이해가 안 돼."
1008303-102 = "[s] \"아니면 키쿄가 한 번 내뱉은 말을 번복해도 난 상관없는데?\""
1008303-103 = "……!"
1008303-104 = "하아…… 후우……."
1008303-105 = "좋아. 그것이 당신의 선택이고 부탁이라면──"
1008303-111 = "[ns] \"우, 우왓! 키쿄 양! 그렇다고 너무 화낼 필요까지는……!\""
1008303-115 = "……무슨 소리야?"
1008303-116 = "난 잠시 선생님 뒤에 있는 책장에서 책을 꺼내려고 한 것뿐이야."
1008303-117 = "[s] \"그 말은 즉……?\""
1008303-121 = "당신의 억지에 어울려 주겠다는 말이야."
1008303-122 = "선생님, 당신의 말대로 오늘 하루 얌전히 샬레에서 휴식을 취하겠어."
1008303-131 = "잠시 이 책이랑 소파를 빌릴 테니, 그런 줄 알아."
1008303-132 = "[s] \"아, 응! 혹시 커피가 필요하지 않아? 마침 내려둔 게 있는데.\""
1008303-133 = "………부탁할게."
1008303-140 = "모처럼의 기회라고 말해줘도, 이런 식으로 흘러가다니."
1008303-141 = "샬레의 선생님…… 당신이 나는…… 이해가 되지 않아."
1008303-142 = "정말……"
1008303-146 = "…………이상한 사람."
1008303-148 = "(그리하여 키쿄와 함께 잠시나마 느긋한 오후 한때를 보내게 되었다.)"
