[translation]
1003506-1 = "이름 없는 번역가"
1003506-2 = "(우이의 부탁대로 편의점에서 드링크와 졸음 껌을 구입해 고서관으로 향했다.)"
1003506-3 = "(……우이가 과로를 한 것 같기에 목에 붙일 파스도 추가로 담아두었다.)"
1003506-5 = "고서관 내부"
1003506-8 = "……응? 뭐야……."
1003506-9 = "문 열린 건 또 어떻게 알았어……. 누가 마음대로 들어오라고……."
1003506-10 = "[s1] \"우이……?\"\n[s2] \"목소리가 굉장히 피곤해 보이는데……?\""
1003506-11 = "……?"
1003506-12 = "……?"
1003506-13 = "……아아. 죄송합니다. 선생님이셨군요……. 억지 부탁이었는데……. 들어주셔서 감사합니다."
1003506-14 = "여기……. 이쪽이에요……."
1003506-17 = "[wa:1600]― 가, [wa:1600]감사합니다. [wa:2100]선생님."
1003506-19 = "― 그……. [wa:1700]챙겨 주셔서……."
1003506-22 = "[wa:700]― ……이거, [wa:1300]말인가요?"
1003506-24 = "― 저기, [wa:2000]해독 작업 [wa:1300]중이었어요."
1003506-27 = "― 이 고서관에는……."
1003506-29 = "― 옛날 말로 쓰여진 책이, [wa:2350]많이 있어요."
1003506-32 = "[wa:2700]― 이 아이들도 [wa:1800]누군가에게 전하고 싶은 것들을 [wa:1200]품은 채,"
1003506-34 = "― 기다리고 [wa:550]있었을 텐데……"
1003506-37 = "― 달리 할 사람도 없고요…… [wa:2700]그래서, [wa:1400]제가……"
1003506-40 = "[wa:700]― ……죄송해요. [wa:1500]재미없는 이야기……[wa:2000]였죠? [wa:200]"
1003506-43 = "[ns3] \"전혀. 아주 멋지다고 생각해.\"\n[ns4] \"우이는 정말 대단한 아이구나.\""
1003506-46 = "[wa:200]― ……!! [wa:1800]어, [wa:1200]그게, [wa:1200]그……."
1003506-48 = "― 그, 그렇게까지 칭찬해 주시면……. [wa:2800]그……."
1003506-51 = "― 무슨 말씀을 드려야 좋을지……"
1003506-53 = "― 말이, [wa:1550]잘 떠오르지 않네요…… [wa:3500]흐……"
1003506-56 = "뭔가……. 기분이 굉장히 묘하네요."
1003506-57 = "쭉 짬 날 때마다 이 작업을 하고는 있었지만……. 그런 말을 들을 거라곤 상상도 못 했었거든요."
1003506-58 = "그것도 다른 사람도 아닌 선생님께……."
1003506-59 = "사실 다들 쓸데없는 짓이라고 여길 줄 알았거든요. 분명 그렇게 생각하는 사람도 많을 테고……."
1003506-60 = "사실 그래도 상관없다고 생각 하면서, 내가 해야 할 일이라고 생각해서 해왔을 뿐인 정도라서……."
1003506-61 = "[s5] \"아냐. 절대 그렇지 않아.\"\n[s6] \"누군가에겐 반드시 필요해질 일이라고 생각해.\""
1003506-62 = "……선생님……."
1003506-63 = "……선생님……."
1003506-64 = "[s7] \"나도 이걸로 더욱 확실하게 알았어.\"\n[s8] \"부원들이 우이를 부장으로서 존경하는 이유 말이지.\"\n[s9] \"이런 일을 묵묵하게 해왔다는 것 자체가 대단한 거야.\""
1003506-65 = "흐……."
1003506-66 = "흐……."
1003506-67 = "흐……."
1003506-68 = "……."
1003506-69 = "감사합니다. 힘이 나네요."
1003506-70 = "세상 사람들이 다 선생님 같은 분이셨다면……. 저도 밖으로 나가 볼 생각 정도는 해볼 텐데 말이죠."
1003506-71 = "……물론 저도 알고 있어요. 바깥 사람들이 다 무신경하고 못되지만은 않았다는 것쯤은."
1003506-72 = "알지만……. 사람마다 알아도 잘 안되는 게 하나둘쯤은 있기 마련이니까요."
1003506-73 = "사실 제가 좋아하는 우리 부원들도, 저에게 자주 그걸 강요하는 편이고……."
1003506-74 = "부원들이 좋은 것과는 별개로, 저한테는 사실 꽤나 부담스러운 일이거든요. 그게……."
1003506-75 = "……그런데 선생님은 오히려 그런 말을 전혀 하지 않으시네요."
1003506-76 = "……선생님이신데도."
1003506-77 = "오히려 저와 대화 분위기도 맞춰 주시고……. 굳이 책들을 '아이'라고 같이 불러 주실 때도 있으셨고……."
1003506-78 = "확실히……. 놀랐어요. '이게 선생님이라는 거구나'라고 생각했어요."
1003506-79 = "그러니 자연스레 기대도 하게 되더라고요."
1003506-80 = "사실 뭐에 대한 기대인지조차 지금은 구체적으로 잘 모를 막연함이지만……."
1003506-81 = "뭐……. 그것도 때가 되면 알 수 있겠죠. 그러면 그때 다시 말씀드릴게요. 괜찮죠?"
1003506-82 = "[s10] \"물론이지. 편하게 생각해.\"\n[s11] \"가장 편할 때, 가장 편하게 말해줘.\""
1003506-83 = "……후……."
1003506-84 = "……후……."
1003506-85 = "네. ……그렇게 할게요."
1003506-86 = "……정말 감사합니다. 선생님."
1003506-88 = "(이후 우이를 도와주며 해독 작업이 마무리 될 때까지 기다려 주었다.)"
1003506-89 = "(작업이 끝나자마자 곯아떨어진 우이에게 담요를 덮어준 뒤, 고서관 문을 닫고 샬레로 돌아왔다.)"
