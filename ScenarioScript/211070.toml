211070-74 = "เฮอะ! เธอคนเดียวจะทำอะไรได้? คงต้องทำให้เห็นหน่อยแล้วว่าความยุติธรรมมันตายไปแล้ว!"
211070-75 = "โอ้ว! นี่คือคอร์สสัมผัสความขมขื่นและความโหดร้ายของคิโวทอสยุคปัจจุบันยังไงล่ะ!"
