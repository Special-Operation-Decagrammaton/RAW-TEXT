211070-110 = "ทำไมยืนตัวแข็งทื่อแบบนั้นล่ะ? เอาเถอะ ท่าทางจะไม่ได้บาดเจ็บตรงไหน แล้วก็ไม่มีอะไรถูกแย่งไปด้วยสินะ"
211070-111 = "ขอบใจที่ช่วยนะ... เกือบโดนแย่งแม็กกระสุนไปจนหมดแล้วเชียว"
211070-112 = "ฉันก็บอกไปเมื่อกี้แล้วนี่นา ตั้งแต่นี้ไปเธอคือเพื่อนของฉัน ใครที่รังแกเพื่อน ฉันไม่ปล่อยไว้แน่"
211070-113 = "ทะ... เท่จัง..."
211070-114 = "จริงสิ รู้จักคณะกรรมการฟื้นฟูเกเฮนน่ามั้ย?"
211070-115 = "เหมือนจะเคยได้ยินอยู่นะ...? ชมรมที่ช่วงนี้มีคนพูดถึงเยอะใช่มั้ย?"
211070-116 = "ใช่เลย ฉันอยู่ชมรมนั้นนั่นแหละ"
211070-117 = "อ๊ะ จริงเหรอ? ชักสนใจขึ้นมาเลยแฮะ ฉันไม่ได้ทำกิจกรรมชมรมอะไรอยู่พอดี"
211070-118 = "งั้นเหรอ? งั้นเธอก็มาเข้าชมรมเราเลยสิ! ยะฮะฮ่า!"
211070-119 = "เอ้า นี่ MOMOTALK ของฉัน แอดไว้นะ ถ้ามีอะไรก็ติดต่อมาได้เลย"
211070-120 = "พวกเราไม่เหมือนคณะกรรมการวินัยหรอก เราคุ้มครองนักเรียนเกเฮนน่าถึงข้างนอกด้วย เหมือนวันนี้ไง"
211070-121 = "โอ้โฮ... ได้ฟังแล้วอุ่นใจสุดๆ ไปเลย"
211070-122 = "อื้อ!! ถ้ามีอะไรจะติดต่อไปแน่นอน แล้วก็จะยื่นใบสมัครเข้าชมรมด้วย!"
