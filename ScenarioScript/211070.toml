[translation]
211070-1 = "第7話;香蓮"
211070-6 = ""
211070-7 = ""
211070-8 = "唷～你好啊？"
211070-9 = ""
211070-11 = ""
211070-12 = ""
211070-13 = ""
211070-14 = "對對對，就是在說你。"
211070-15 = "怎，怎麼了？有什麼事嗎？"
211070-16 = ""
211070-18 = ""
211070-19 = "沒什麼，只是我很討厭格黑娜的傢伙。"
211070-20 = "討厭到光是看到就會過敏的程度！"
211070-21 = "結果偏偏讓我看到你了。你看，這裡都因為過敏長出斑點了。"
211070-22 = "咦，不見了耶？"
211070-23 = "嘖，水性的墨水一下就掉了。筆再借我一次。"
211070-24 = ""
211070-26 = ""
211070-27 = "好，你看。手臂上長了七顆斑點對吧？#n所以你是不是該為此負起責任啊？"
211070-28 = "那明明是你剛才用簽字筆點上去的吧！"
211070-29 = "少在那邊廢話！我說是就是！快把慰問金交出來！"
211070-30 = "不是，哪有這麼不講理的？"
211070-31 = "喂，你是想吃手榴彈嗎？安靜點，快把錢包拿出來～"
211070-32 = "嗚嗚……你，你們……"
211070-33 = "噗嘿嘿！落單的格黑娜傢伙可是很容易到手的獵物啊。"
211070-34 = "格黑娜那些傢伙根本不團結嘛。#n風紀委員會只顧著自己的自治區，才不會跑到這裡來。"
211070-35 = "也就是說，不會有任何人來救你的！"
211070-37 = "[ns] 上前一步"
211070-40 = "[ns] 「嗯……？那是……」"
211070-41 = "呀哈！看看那副德性。真是笑死人了。"
211070-42 = "啊啊？你說什麼？"
211070-43 = "是哪個傢伙？"
211070-44 = ""
211070-46 = ""
211070-47 = ""
211070-48 = "這又是誰啊。格黑娜的？"
211070-49 = ""
211070-51 = ""
211070-52 = "嗯，沒錯，是格黑娜的。"
211070-53 = "所以說……"
211070-54 = "能不能馬上把手從我們的學生身上拿開，然後滾遠一點？"
211070-55 = ""
211070-57 = ""
211070-59 = "格黑娜學園2年級，明樂香蓮。"
211070-60 = "現為格黑娜再興委員會所屬的委員長輔佐。"
211070-61 = "外表亮麗卻以脾氣火爆聞名，動用暴力時毫不猶豫。"
211070-63 = ""
211070-65 = "啊啊？"
211070-66 = "哈哈！這傢伙真好笑！你算哪根蔥？#n沒戴臂章，看來也不是風紀委員會的人嘛。"
211070-67 = "喂，這傢伙是你朋友？"
211070-68 = "咦，不是……也不算是那樣啦……"
211070-69 = ""
211070-71 = ""
211070-72 = "從現在起就是朋友了，給我記清楚。"
211070-73 = "哇……"
211070-74 = "哈！就憑你一個人能怎樣？#n看來得讓這傢伙見識一下，這世上已經沒有正義了！"
211070-75 = "哦哦！現代奇普托斯的苦澀與冷酷體驗行程開始啦！"
211070-76 = ""
211070-77 = "[ns] 「等，等一下……！」"
211070-78 = ""
211070-80 = ""
211070-81 = ""
211070-82 = ""
211070-86 = ""
211070-87 = "咳呃！你，你這傢伙……"
211070-88 = ""
211070-90 = ""
211070-91 = ""
211070-92 = ""
211070-94 = ""
211070-96 = ""
211070-97 = "嗚呃！好痛……！！"
211070-98 = "被，被幹掉了！"
211070-99 = ""
211070-101 = ""
211070-103 = "一，一下子就解決了……"
211070-104 = ""
211070-106 = ""
211070-107 = ""
211070-108 = "沒事吧？"
211070-109 = "咦，啊……？嗯，我沒事……"
211070-110 = "為什麼要那麼緊張？#n看起來沒受傷，東西好像也沒被搶。"
211070-111 = "謝謝你出手幫忙……我差點連彈匣都要被搶光了。"
211070-112 = "剛才不是說了嗎？從現在開始你就是我的朋友了。#n欺負我朋友的傢伙，我絕對不會放過。"
211070-113 = "好，好帥……"
211070-114 = "啊，你知道格黑娜再興委員會嗎？"
211070-115 = "……好像有聽說過？是最近很常被提到的社團吧？"
211070-116 = "沒錯。我就是那裡的成員。"
211070-117 = "啊，真的嗎？我突然有點興趣了耶。#n反正我也沒參加社團。"
211070-118 = "是嗎？那你就加入我們社團吧！呀哈哈！"
211070-119 = "來，這是我的MomoTalk。加一下，有什麼事就馬上聯絡我。"
211070-120 = "我們跟風紀委員會不一樣，在外面也會保護格黑娜的學生。就像今天這樣。"
211070-121 = "哦哦……好可靠啊。"
211070-122 = "嗯！！有什麼事我一定會聯絡你的。我也會去申請入會！"
211070-123 = "讓格黑娜再次偉大！"
211070-124 = ""
211070-126 = ""
211070-127 = "沒錯，讓格黑娜再次偉大！"
211070-128 = ""
211070-130 = ""
211070-131 = ""
211070-132 = "呀哈，今天也解決一件！"
211070-133 = ""
211070-135 = ""
211070-136 = ""
211070-137 = "咦？老師？"
211070-138 = "[s] 「你好啊，香蓮。」"
211070-139 = "哇！真的是老師耶！"
211070-140 = "你在做什麼？要去哪裡嗎？剛才我做的事你看到了嗎？覺得怎麼樣？"
211070-141 = "[s1] 「我是有事要辦才出門的。」\n[s2] 「很帥哦，香蓮。你保護了朋友呢。」"
211070-144 = "哇，被你看到了！"
211070-145 = "雖然不是做給誰看的啦……不過被老師看到，總覺得更有成就感了？"
211070-146 = ""
211070-148 = ""
211070-149 = "那就摸摸頭！做了好事就該被稱讚，對吧？"
211070-150 = "[s] 摸摸頭"
211070-151 = ""
211070-153 = ""
211070-154 = ""
211070-155 = "嗯！這種感覺真不錯～呀哈哈！"
211070-156 = ""
211070-158 = ""
211070-159 = "你問我平常是不是很常遇到這種事？"
211070-160 = "嗯～～算是吧？"
211070-162 = "在自治區裡面有風紀委員會巡邏，所以幾乎沒有這麼大膽的混混，#n不過在外面就經常會發生這種事。"
211070-163 = "落單的格黑娜學生們很容易被盯上。#n不過不管哪個學園應該都差不多吧。"
211070-164 = "總之，只要在我看得到的範圍內，我都能想辦法處理。#n敢動我們學生的傢伙，我絕對不會放過。"
211070-165 = ""
211070-166 = "你說還是別勉強，需要幫忙就叫你？"
211070-167 = ""
211070-169 = ""
211070-170 = "老師真溫柔～已經好久沒聽人這麼說了。"
211070-171 = "不過我可是很強的哦。不管對手有幾個人，大部分都打得贏。"
211070-172 = "要是覺得打不贏，先逃走再回來偷襲就好了嘛！"
211070-173 = "不過就像你剛才看到的，這附近的治安滿差的。#n老師一個人到處走可能會有危險。"
211070-174 = "難得遇到，在老師辦完事之前，就由我來護送你吧！"
211070-175 = "沒關係，沒關係！反正我也沒什麼事要做！"
211070-176 = ""
211070-177 = ""
211070-178 = ""
211070-179 = ""
211070-180 = ""
211070-182 = "（途中雖然還遇到其他不良學生的威脅……）"
211070-183 = ""
211070-184 = ""
211070-185 = ""
211070-186 = ""
211070-187 = ""
211070-188 = ""
211070-189 = ""
211070-190 = ""
211070-191 = ""
211070-192 = ""
211070-193 = ""
211070-194 = ""
211070-196 = "（香蓮都挺身而出擊退了他們）"
211070-197 = ""
211070-202 = "[ns] 「今天謝謝你了，香蓮。」"
211070-203 = "呀哈哈，那就好！"
211070-204 = "能跟老師到處逛逛，我也覺得很開心呢。"
211070-205 = "不過老師，你好像是很容易被找碴的類型耶。光是今天就……"
211070-206 = "[s] 「是啊……」"
211070-207 = "以後要到處跑的話，不用客氣，儘管叫我！"
211070-208 = "啊，我把我的MomoTalk給你。傳訊息也好，打電話也行～"
211070-209 = ""
211070-211 = ""
211070-213 = "嗯，好了！呀哈。"
211070-214 = "總覺得我們之間有了聯繫呢～！"
211070-215 = "我還是第一次像這樣跟大人一起做些什麼呢。超好玩的～"
211070-216 = ""
211070-218 = ""
211070-219 = "啊，我差不多該走了。"
211070-220 = "老師，最後還有什麼想問我的嗎？"
211070-221 = "今天是香蓮大出血特別服務，什麼問題都可以回答你哦！呀哈哈。"
211070-222 = ""
211070-225 = "[ns] 「香蓮為什麼要參加再興委員會的活動？」"
211070-226 = "哦，沒想到你會問這種問題。"
211070-227 = "唔嗯……"
211070-228 = ""
211070-230 = ""
211070-231 = "因為喜歡格黑娜？"
211070-232 = "這大概是最主要的理由！呀哈。"
211070-233 = "跟部員們一起做些什麼也很好玩。#n老師你也看到了，大家都很有趣嘛。"
211070-234 = "喜歡格黑娜的理由？"
211070-235 = "……"
211070-236 = "唔嗯……唔～嗯……"
211070-237 = "真是個困難的問題。我想應該有很多理由吧！"
211070-238 = "首先，大概是那種不記仇的氛圍吧！"
211070-239 = "我啊，超級討厭那種虛偽的人。#n當面嘻嘻哈哈，背地裡卻說三道四……真的很噁心又倒胃口。"
211070-240 = "至少我們學園不是那種氛圍吧？#n要做什麼就轟轟烈烈地做，事後也乾乾脆脆。"
211070-241 = "還有就是可以為所欲為的校風吧。我喜歡那種自由的感覺。"
211070-242 = "你說這跟再興委員會現在的方向好像有點不一樣？"
211070-243 = "啊，對啊。我們是要為格黑娜帶來秩序與管控……"
211070-244 = "雖然管控聽起來可能不太舒服，不過這是我們的智囊翔子醬說的。"
211070-245 = "總之，我們就是想推行那樣的東西。"
211070-246 = "其實我也滿喜歡亂七八糟的，#n不過我很好奇真由美醬眼中看到的光景，所以才一起參與。"
211070-247 = "因為真由美醬是我認識的人裡面，最愛格黑娜的人！"
211070-248 = ""
211070-249 = "那樣的真由美醬想打造的學園，究竟會是什麼樣子呢──大概是這種感覺吧。"
211070-250 = "我們委員長雖然只有行動力，是個橫衝直撞的麻煩精……#n不過我就是喜歡他這一點。"
211070-251 = "翔子醬雖然偶爾也會說些奇怪的話，但喜歡格黑娜的心是一樣的。"
211070-253 = "你不好奇嗎？大家團結一致的格黑娜。"
211070-254 = "不是像現在這樣各玩各的，而是大家都望向同一個地方的格黑娜。"
211070-255 = "雖然現在完全想像不到那會是什麼感覺。"
211070-256 = ""
211070-257 = "呀哈哈，總之就是這樣。這就是我參加再興委員會活動的原因。"
211070-258 = "這樣算是回答了嗎？好像講得有點亂。#n畢竟我不太會讀書嘛！"
211070-259 = "[s] 「嗯，已經是很充分的答案了。」"
211070-260 = "啊！還有這句話也得說。"
211070-261 = ""
211070-263 = ""
211070-264 = ""
211070-265 = "謝謝你幫忙，老師。"
211070-266 = "只靠我們的話應該會很辛苦。#n多虧老師，事情才進行得這麼順利。"
211070-267 = "最近加入我們社團的學生也變多了呢？"
211070-268 = "所以，以後也要麻煩你囉！呀哈哈。"
211070-270 = "（多虧香蓮，平安地結束行程回來了）"
211070-271 = "（也真切地感受到他對格黑娜的心意）"
211070-273 = "下一話;Trigger Happy Zone"
