211070-159 = "\"Does this happen often,\" you ask?"
211070-160 = "Hmm... Somewhat?"
211070-162 = "The Prefect Team runs patrols, so it's rare to see this stuff inside the district. But once we step outside, yeah... It can get a little rough."
211070-163 = "Lone Gehenna students tend to be easy targets. Well, I suppose it's the same for any academy."
