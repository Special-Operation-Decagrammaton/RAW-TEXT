211070-160 = "อืม~~ ก็ประมาณหนึ่งนะ?"
211070-162 = "ในเขตปกครองตนเองมีคณะกรรมการวินัยลาดตระเวนอยู่ เลยแทบไม่มีพวกอันธพาลที่เหิมเกริมขนาดนี้ แต่ข้างนอกก็เกิดเรื่องแบบนี้อยู่เรื่อยๆ"
211070-163 = "นักเรียนเกเฮนน่าที่ไปไหนมาไหนคนเดียวมักตกเป็นเป้าได้ง่ายน่ะ แต่ก็นะ ไม่ว่าโรงเรียนไหนก็คงคล้ายๆ กัน"
211070-164 = "ยังไงฉันก็พอจัดการเรื่องที่อยู่ในสายตาได้อยู่น่ะ ใครที่บังอาจมาแตะต้องนักเรียนของเรา ฉันไม่ปล่อยไว้แน่"
211070-165 = ""
211070-166 = "ถึงอย่างนั้นก็อย่าหักโหม ถ้าต้องการความช่วยเหลือก็ให้บอกได้งั้นเหรอ?"
211070-167 = ""
211070-169 = ""
211070-170 = "คุณครูนี่ใจดีจังเลยนะ~ ฉันไม่ได้ยินคำพูดแบบนั้นมานานเลย"
211070-171 = "แต่ฉันก็แข็งแกร่งพอตัวนะ จะมากี่คนก็ชนะได้เกือบหมดแหละ"
211070-172 = "พอเห็นท่าไม่ดีเมื่อไรก็หนีก่อน แล้วค่อยกลับมาจู่โจมใหม่ก็ได้!"
211070-173 = "แต่ก็อย่างที่เห็นเมื่อกี้ แถวนี้ไม่ค่อยปลอดภัยเท่าไรน่ะ ถ้าคุณครูเดินไปไหนมาไหนคนเดียวก็อาจจะ#nเป็นอันตรายได้นะ"
211070-174 = "ไหนๆ ก็ได้มาเจอกันแล้ว ฉันจะคอยคุ้มกันให้จนกว่าคุณครูจะทำธุระเสร็จเอง!"
211070-175 = "ไม่เป็นไร ไม่เป็นไร! ฉันเองก็ไม่มีอะไรจะทำอยู่พอดี!"
