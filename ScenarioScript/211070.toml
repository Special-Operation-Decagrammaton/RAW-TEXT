211070-60 = "ปัจจุบันเป็นผู้ช่วยหัวหน้าคณะกรรมการฟื้นฟูเกเฮนน่า"
211070-61 = "เป็นที่รู้จักจากรูปลักษณ์อันโดดเด่นและนิสัยเลือดร้อน ทั้งยังไม่ลังเลที่จะใช้ความรุนแรง"
