211070-255 = "ถึงตอนนี้จะยังจินตนาการไม่ออกเลยว่าจะเป็นแบบไหนก็เถอะ"
211070-256 = ""
211070-257 = "ยะฮะฮ่า ก็เพราะแบบนั้นแหละ ที่ฉันทำกิจกรรมอยู่กับคณะกรรมการฟื้นฟู"
211070-258 = "พอจะตอบคำถามได้มั้ย? รู้สึกว่าฉันจะพูดวกไปวนมานิดหน่อยนะ ก็ฉันไม่ค่อยเก่งเรื่องเรียนนี่นา!"
