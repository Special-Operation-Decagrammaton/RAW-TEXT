[translation]
211070-1 = "제7화;카렌"
211070-8 = "이야~ 안녕?"
211070-14 = "그래, 그래. 너 말이야."
211070-15 = "왜, 왜 그래? 무슨 일 있어?"
211070-19 = "아니, 내가 게헨나 녀석들을 싫어하거든."
211070-20 = "보기만 해도 알레르기 반응이 나올 정도로 말이야!"
211070-21 = "그런데 하필 네가 눈에 띄어버렸잖아. 이거 봐, 여기 알레르기로 점 생긴 거."
211070-22 = "어, 지워졌는데?"
211070-23 = "아씨, 수성이라 금방 지워지네. 다시 줘봐."
211070-27 = "자, 봐라. 팔뚝에 점이 일곱 개나 생겼지? 그러니까 네가 여기에 대한 책임을 져야 하지 않겠어?"
211070-28 = "방금 네가 사인펜으로 찍은 거잖아!"
211070-29 = "웃기고 자빠졌넴마! 그렇다면 그런 줄 알라고! 위로비나 내놔!"
211070-30 = "아니, 뭐 이런 억지가 다 있어?"
211070-31 = "어이, 수류탄이라도 맞고 싶은 거야? 조용하고 빨리 지갑 꺼내라고~"
211070-32 = "으으…… 너, 너희들……"
211070-33 = "푸헤헤! 혼자 다니는 게헨나 녀석은 아주 손쉬운 먹이감이라는 거지."
211070-34 = "게헨나 녀석들은 단합도 안 되니까.#n선도부는 자기들 자치구나 신경 쓰지, 여기까지 오지도 않는다고."
211070-35 = "널 도와줄 사람은 어디에도 없다 이거야!"
211070-37 = "[ns] (앞으로 나선다)"
211070-40 = "[ns] \"응……? 저건……\""
211070-41 = "야핫! 저 꼴들 좀 봐. 완전 웃기네."
211070-42 = "아앙? 뭐라고?"
211070-43 = "어떤 녀석이야?"
211070-48 = "뭐야 이건 또. 게헨나?"
211070-52 = "응, 게헨나 맞아."
211070-53 = "그러니까……"
211070-54 = "지금 당장 우리 학생에게서 손 떼고 꺼져줄래?"
211070-59 = "게헨나 학원 2학년, 묘라쿠 카렌."
211070-60 = "현재 게헨나재흥위원회 소속 위원장 보좌."
211070-61 = "화려한 외모에 다혈질로 알려져 있으며, 폭력을 사용하는 데에 주저함이 없다."
211070-65 = "아앙?"
211070-66 = "하하! 이거 웃기는 녀석이네! 네가 뭔데? 완장이 없으니 선도부도 아닌 것 같고."
211070-67 = "야, 이 녀석 네 친구냐?"
211070-68 = "엣, 아니…… 딱히 그런 건 아닌데……."
211070-72 = "지금부터 친구니까, 그런 줄 알아."
211070-73 = "우왓……."
211070-74 = "하! 너 혼자 뭘 어쩌겠다고? 저 녀석에게 정의가 죽었음을 보여줘야겠구만!"
211070-75 = "우오! 현대 키보토스의 씁쓸함과 냉혹함 체험 코스다앗!"
211070-77 = "[ns] \"자, 잠……!\""
211070-87 = "커억! 이, 이 녀석……."
211070-97 = "어흑! 아팟……!!"
211070-98 = "다, 당했다!"
211070-103 = "수, 순식간에 끝냈어……."
211070-108 = "괜찮아?"
211070-109 = "어, 어……? 으응, 괜찮아……."
211070-110 = "왜 그렇게 굳어 있어? 아무튼 다친 곳도 없어 보이고, 뺏긴 것도 없는 것 같고."
211070-111 = "도와줘서 고마워…… 하마터면 탄창까지 죄다 뺏길 뻔했지 뭐야."
211070-112 = "아까 말했잖아. 지금부터 내 친구라고. 친구를 괴롭히는 녀석들은 가만두지 않지."
211070-113 = "머, 멋있어……."
211070-114 = "아, 혹시 게헨나재흥위원회라고 알아?"
211070-115 = "……들어본 것 같기도 하고? 최근 이야기 많이 나오는 동아리 아니야?"
211070-116 = "맞아. 내가 거기 소속이거든."
211070-117 = "아, 진짜? 뭔가 관심이 생기는데? 나 딱히 부활동 안 하고 있었거든."
211070-118 = "그래? 그럼 너 우리 동아리 들어와라! 야하핫!"
211070-119 = "자, 여기 내 모모톡. 등록하고, 무슨 일 있으면 바로 연락해."
211070-120 = "우리는 선도부와는 다르게, 외부에서도 우리 게헨나 학생들을 보호하고 있거든. 오늘처럼."
211070-121 = "오오…… 엄청 든든하다."
211070-122 = "응!! 뭔가 일이 있으면 꼭 연락할게. 그리고 가입 신청도 할게!"
211070-123 = "게헨나를 다시 위대하게!"
211070-127 = "그래, 게헨나를 다시 위대하게!"
211070-132 = "야핫, 오늘도 한 건!"
211070-137 = "어? 선생님?"
211070-138 = "[s] \"안녕, 카렌.\""
211070-139 = "와! 진짜 선생님이다!"
211070-140 = "뭐해? 어디 가고 있었어? 방금 내가 한 거 봤어? 어땠어?"
211070-141 = "[s1] \"일이 있어서 나왔지.\"\n[s2] \"멋졌어, 카렌. 친구를 지켜줬구나.\""
211070-144 = "우왓, 봤네!"
211070-145 = "누구 보여주려고 하는 건 아니지만…… 선생님이 봤다니까 왠지 더 잘한 느낌?"
211070-149 = "그럼 쓰담쓰담! 착한 일에는 칭찬이 따라오는 거잖아?"
211070-150 = "[s] (쓰다듬는다)"
211070-155 = "음! 좋네~ 이 기분! 야하핫!"
211070-159 = "평소에도 이런 일이 많냐고?"
211070-160 = "음~~ 어느 정도?"
211070-162 = "자치구 안에서야 선도부가 순찰을 도니까 이렇게 간 큰 불량배들은 거의 없지만, 밖에서는 이런 일이 종종 있어."
211070-163 = "혼자 다니는 게헨나 학생들은 표적이 되기 쉽거든. 뭐, 어느 학원이든 비슷할 테지만."
211070-164 = "아무튼 내 눈에 닿는 범위까지는 어떻게 할 수 있으니까.#n감히 우리 학생을 건드리는 녀석들은 가만두지 않지."
211070-166 = "그래도 무리하지 말고 도움이 필요하면 부르라고?"
211070-170 = "선생님, 상냥하네~ 그런 말 들어본지 꽤 오래됐는데."
211070-171 = "그치만 나 꽤 강하거든. 상대가 몇이든 웬만하면 이길 수 있어."
211070-172 = "못 이길 것 같으면 도망쳤다가 다시 기습하면 되니까!"
211070-173 = "그런데, 방금 봤듯이 이 근처는 꽤 치안이 안 좋거든. 선생님 혼자 돌아다니면 위험할 수 있어."
211070-174 = "모처럼이니까, 선생님이 일 볼 때까지 내가 호위해 줄게!"
211070-175 = "괜찮아, 괜찮아! 나도 딱히 할 일 없었거든!"
211070-182 = "(중간에 다른 불량 학생들의 위협이 있었지만……)"
211070-196 = "(카렌이 나서서 물리쳐주었다.)"
211070-202 = "[ns] \"오늘 고마웠어, 카렌.\""
211070-203 = "야하핫, 그럼 다행이고!"
211070-204 = "선생님이랑 여기저기 구경도 하고 좋았달까."
211070-205 = "그런데 선생님, 은근히 시비 자주 걸리는 타입이네. 오늘만 해도……."
211070-206 = "[s] \"그러게…….\""
211070-207 = "앞으로 어디 돌아다닐 일 있으면 부담 없이 불러도 돼!"
211070-208 = "아, 내 모모톡 알려줄게. 톡으로 해도 되고, 전화로 해도 되고~"
211070-213 = "응, 됐다! 야핫."
211070-214 = "뭔가 연결된 느낌이네~!"
211070-215 = "나 이렇게 어른이랑 뭔가 하는 건 처음인데. 되게 재밌다~"
211070-219 = "아, 나 이제 슬슬 가봐야 할 것 같은데."
211070-220 = "선생님, 마지막으로 나한테 뭔가 궁금한 거라든가 있어?"
211070-221 = "오늘만큼은 카렌 대출혈 서비스로 뭐든지 대답해 줄 준비 완료거든! 야하하."
211070-225 = "[ns] \"카렌은 재흥위원회 활동을 하는 이유가 뭐야?\""
211070-226 = "오, 그런 질문은 예상 못 했는데."
211070-227 = "음……."
211070-231 = "게헨나가 좋아서?"
211070-232 = "아마 그게 첫 번째! 야핫."
211070-233 = "부원들이랑 같이 뭔가 하는 것도 재미있고. 선생님도 봐서 알겠지만 다들 웃기잖아."
211070-234 = "게헨나를 좋아하는 이유?"
211070-235 = "……."
211070-236 = "음…… 으음……."
211070-237 = "어려운 질문이네. 여러 가지 있다고 생각해!"
211070-238 = "일단, 뒤끝 없는 분위기랄까!"
211070-239 = "나, 위선적인 거 되게 싫어하거든.#n서로 앞에서는 하하호호 하면서, 뒤에서는 이러쿵저러쿵. 으, 밥맛."
211070-240 = "적어도 우리 학원은 그런 분위기는 아니잖아? 뭘 하면 화끈하게 하지. 뒤에 가서도 깔끔하고."
211070-241 = "그리고 제멋대로 해도 되는 교풍이랄까. 자유로운 느낌이 좋아."
211070-242 = "그건 지금 재흥위원회가 하는 방향이랑은 조금 다른 것 같다고?"
211070-243 = "아, 맞아. 우리는 게헨나에 질서와 통제……"
211070-244 = "통제라고 하면 좀 느낌이 별로일 수 있는데, 우리 브레인인 쇼코 쨩이 한 말이니까."
211070-245 = "아무튼 그런 걸 도입하려고 하고 있지."
211070-246 = "나는 사실 엉망진창인 것도 좋아하지만, 마유미 쨩이 바라보는 광경이 궁금해서 동참하고 있어."
211070-247 = "마유미 쨩은 내가 아는 사람 중에서 게헨나를 가장 사랑하는 사람이거든!"
211070-249 = "그런 마유미 쨩이 만들고 싶은 학원은 대체 어떤 걸까, 하는 느낌이지."
211070-250 = "우리 회장, 행동력만 좋고 좌충우돌 사고뭉치긴 한데. 그런 부분이 좋달까."
211070-251 = "쇼코 쨩도 가끔 이상한 말을 하곤 하지만, 게헨나를 좋아하는 마음은 같고."
211070-253 = "궁금하지 않아? 모두 하나가 된 게헨나."
211070-254 = "지금처럼 따로 노는 게 아니라, 모두가 한 곳을 바라보는 게헨나."
211070-255 = "과연 어떤 느낌일지 지금은 상상도 안 가지만."
211070-257 = "야하핫, 아무튼 그래서야. 내가 재흥위원회 활동하고 있는 거."
211070-258 = "대답이 됐을까? 좀 두서없었던 것 같은데. 나 공부는 별로거든!"
211070-259 = "[s] \"응, 충분히 답이 됐어.\""
211070-260 = "아! 그리고 이 말도 해야겠네."
211070-265 = "도와줘서 고마워, 선생님."
211070-266 = "우리만 있었으면 많이 어려웠을 거야. 선생님 덕분에 수월하게 진행되고 있어."
211070-267 = "요즘 우리 동아리에 가입하는 학생들도 꽤 생겼고?"
211070-268 = "그러니까, 앞으로도 부탁할게! 야하핫."
211070-270 = "(카렌 덕분에 안전하게 일정을 마치고 돌아왔다.)"
211070-271 = "(게헨나에 대한 마음도, 진심으로 느껴졌다.)"
211070-273 = "다음화;트리거 해피 존"
