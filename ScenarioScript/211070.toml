211070-140 = "ทำอะไรอยู่? กำลังจะไปไหนเหรอ? เมื่อกี้เห็นที่ฉันทำมั้ย? เป็นยังไงบ้าง?"
211070-141 = "[s1] \"ครูออกมาทำธุระน่ะ เมื่อกี้เยี่ยมไปเลยนะ คาเรน\"\n[s2] \"เท่มากเลยนะ คาเรน ปกป้องเพื่อนไว้ได้ด้วย\""
211070-144 = "ว้าว เห็นด้วยสินะ!"
211070-145 = "ฉันไม่ได้ทำเพราะอยากให้ใครเห็นหรอกนะ... แต่พอคุณครูเห็นแล้ว ก็รู้สึกเหมือนตัวเองทำได้ดีกว่าเดิมยังไงไม่รู้?"
