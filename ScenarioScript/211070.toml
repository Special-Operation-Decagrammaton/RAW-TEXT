211070-225 = "[ns] \"Why are you in the Heritage League?\""
211070-226 = "Huh, oh? THAT's what's on your mind?"
211070-227 = "Well..."
211070-228 = ""
211070-230 = ""
211070-231 = "It's because I like Gehenna, I guess?"
211070-232 = "That's probably the primary reason! Yaha!"
211070-233 = "And it's a blast doing things with all the other members. And as you saw, they're all funny people...in their own ways."
211070-234 = "\"Why do I like Gehenna,\" you ask?"
211070-235 = "..."
211070-236 = "Hmm... Mmm..."
211070-237 = "That's a really hard question. There are SO many reasons."
211070-238 = "For starters, it's the straightforward atmosphere!"
211070-239 = "I really hate hypocrisy. People acting nice in public, then badmouthing in private. Ugh, they make me sick."
211070-240 = "But Gehenna has a different vibe. We're direct and wholehearted. And we wrap things up cleanly, with everything on the table."
211070-241 = "We have a culture where you can be yourself. I like this sense of freedom."
211070-242 = "Oh. You don't think that \"sounds like what the Heritage League wants\"?"
211070-243 = "Ah, I suppose. We're trying to implement order and control in Gehenna..."
211070-244 = "I know the word \"control\" sounds a little harsh, but that's kind of just how Shouko talks. She's the brains of the group."
211070-245 = "So, yeah, you're right. That's what we're trying to bring forth."
211070-246 = "Honestly, I like the complete chaos, but I stay because I'm curious to see what Mayumi will do."
211070-247 = "Out of everyone I know, Mayumi loves Gehenna the most! You can see it!"
211070-248 = ""
211070-249 = "She has so much spirit and drive. I'd like to see what she can do with the academy."
211070-250 = "Sure, she's a little reckless. She acts first and thinks later, but I like that about her."
211070-251 = "And yes, Shouko says weird things once in a while, but she also loves Gehenna."
211070-253 = "How could you not be intrigued? Wouldn't it be cool to see a united Gehenna?"
211070-254 = "Like a school where everyone coordinated and was set on the same goal instead of running in a hundred directions!"
211070-255 = "Frankly, it's beyond my imagination! So I'll have to see it for myself."
211070-256 = ""
211070-257 = "Yahaha, anyway, that's the reason I stay in the Heritage League with my friends."
211070-258 = "Did that answer your question? I feel like I was all over the place. Look, I'm not great at presentations!"
211070-259 = "[s] \"You answered my question well.\""
211070-260 = "Ah! And I should also say something."
211070-261 = ""
211070-263 = ""
211070-264 = ""
211070-265 = "Thank you for helping us, Sensei."
