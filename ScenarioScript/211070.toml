211070-236 = "อืม... อืมม..."
211070-237 = "คำถามยากจัง ฉันคิดว่าเหตุผลมีหลายอย่างเลยนะ!"
211070-238 = "อย่างแรกก็ บรรยากาศแบบไม่เก็บอะไรไปผูกใจเจ็บละมั้ง!"
211070-239 = "ฉันน่ะเกลียดการเสแสร้งสุดๆ เลย ต่อหน้าก็หัวเราะเฮฮากัน แต่ลับหลังกลับพูดนั่นพูดนี่ อึ๋ย น่าขยะแขยง"
211070-240 = "อย่างน้อยโรงเรียนของเราก็ไม่มีบรรยากาศแบบนั้นนี่นา? ถ้าจะทำอะไรก็ทำกันซึ่งๆ หน้าให้สุดไปเลย พอจบแล้วก็ไม่มีอะไรค้างคา"
211070-241 = "แล้วก็จะเรียกว่าเป็นธรรมเนียมโรงเรียนที่อยากทำอะไรก็ทำได้ละมั้ง ฉันชอบความรู้สึกอิสระแบบนั้น"
211070-242 = "จะบอกว่านั่นดูแตกต่างจากแนวทางที่คณะกรรมการฟื้นฟูกำลังทำอยู่ตอนนี้นิดหน่อยงั้นเหรอ?"
211070-243 = "อ๊ะ จริงสิ พวกเรากำลังจะนำระเบียบและการควบคุมมาสู่เกเฮนน่า..."
211070-244 = "คำว่าการควบคุมอาจฟังดูไม่ค่อยดีเท่าไร แต่โชโกะจังที่เป็นมันสมองของพวกเราเป็นคนพูดไว้น่ะ"
211070-245 = "เอาเป็นว่า พวกเราก็กำลังคิดจะเอาระบบแบบนั้นมาใช้อยู่หรอกนะ"
211070-246 = "จริงๆ แล้วฉันเองก็ชอบความเละเทะเหมือนกัน แต่ที่เข้าร่วมก็เพราะอยากเห็นเกเฮนน่าในแบบที่#nมายูมิจังวาดฝันไว้น่ะ"
211070-247 = "ในบรรดาคนที่ฉันรู้จัก มายูมิจังคือคนที่รักเกเฮนน่ามากที่สุดเลย!"
211070-248 = ""
211070-249 = "ก็เลยรู้สึกอยากรู้ขึ้นมาว่า โรงเรียนที่มายูมิจังอยากสร้างจะเป็นแบบไหนกันนะ"
211070-250 = "หัวหน้าของพวกเราน่ะ ถึงจะมีดีแค่คิดไวทำไวแถมยังเป็นตัวปัญหาที่ชอบบุ่มบ่ามก่อเรื่องไปทั่วก็เถอะ แต่ฉันก็ชอบตรงนั้นของเธอนะ"
211070-251 = "ส่วนโชโกะจังก็พูดอะไรแปลกๆ อยู่บ้าง แต่เธอก็รักเกเฮนน่าเหมือนกัน"
211070-253 = "ไม่อยากเห็นเหรอ? เกเฮนน่าที่ทุกคนเป็นหนึ่งเดียวกันน่ะ"
