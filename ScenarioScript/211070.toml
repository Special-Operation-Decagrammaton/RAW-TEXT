211070-20 = "แค่เห็นผื่นแพ้ขึ้นมาเลยแหละ!"
211070-21 = "แล้วเธอดันมาสะดุดตาฉันพอดีอีก ดูนี่สิ นี่ไง ผื่นแพ้ขึ้นเป็นจุดๆ เลย"
211070-22 = "เอ๋ มันลบออกไปแล้ว?"
211070-23 = "โธ่เอ๊ย เป็นหมึกแบบล้างน้ำได้ เลยลบออกง่ายชะมัด เอามาให้อีกทีซิ"
211070-24 = ""
211070-26 = ""
211070-27 = "นี่ไง ดูสิ ที่แขนฉันมีจุดขึ้นตั้งเจ็ดจุด งั้นเธอก็ต้องรับผิดชอบน่ะสิ?"
211070-28 = "เธอเพิ่งเอาปากกาเมจิกจิ้มเองนี่!"
211070-29 = "พูดบ้าบอไปได้! บอกว่าผื่นแพ้ก็ผื่นแพ้สิ! เอาค่าปลอบขวัญมาซะดีๆ!"
211070-30 = "นี่ มีที่ไหนมาบังคับกันแบบนี้?"
211070-31 = "เดี๋ยวเหอะ อยากโดนระเบิดมือสักลูกหรือไง? หุบปากแล้วควักกระเป๋าสตางค์ออกมาเร็วเข้า~"
211070-32 = "อึก... พะ... พวกเธอ..."
211070-33 = "วะฮะฮ่า! เด็กเกเฮนน่าที่เดินอยู่คนเดียวน่ะ เป็นเหยื่อที่เล่นงานง่ายสุดๆ เลย"
211070-34 = "พวกเกเฮนน่าไม่สามัคคีกันอยู่แล้วนี่นา คณะกรรมการวินัยก็สนใจแต่เขตปกครองของตัวเอง คงไม่มาถึงตรงนี้หรอก"
211070-35 = "สรุปก็คือ ไม่มีใครที่ไหนมาช่วยเธอได้ทั้งนั้น!"
