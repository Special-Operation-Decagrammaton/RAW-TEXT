211070-65 = "หา?"
211070-66 = "ฮ่าฮ่า! ยัยนี่ตลกดีนี่! เธอเป็นใครกัน? ไม่มีปลอกแขน ดูท่าจะไม่ใช่คณะกรรมการวินัยด้วย"
211070-67 = "นี่ ยัยนี่เป็นเพื่อนเธอเหรอ?"
