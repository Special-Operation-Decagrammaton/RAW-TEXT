211070-204 = "ได้เดินดูโน่นนี่ไปกับคุณครูด้วย จะว่าไปก็ดีเหมือนกัน"
211070-205 = "แต่ว่านะ คุณครูเป็นคนประเภทที่โดนหาเรื่องบ่อยอยู่เหมือนกันนะ แค่วันนี้วันเดียวก็..."
