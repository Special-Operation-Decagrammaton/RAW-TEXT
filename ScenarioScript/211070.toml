[translation]
211070-1 = "第7話;カレン"
211070-6 = ""
211070-7 = ""
211070-8 = "やぁやぁ。こ～ん～に～ち～は～？"
211070-9 = ""
211070-11 = ""
211070-12 = ""
211070-13 = ""
211070-14 = "無視ってのはひどいじゃんよ。"
211070-15 = "……何か用？"
211070-16 = ""
211070-18 = ""
211070-19 = "いや～あたし、ゲヘナの奴が大っ嫌いでさ。"
211070-20 = "もう見るだけでアレルギー出んの。"
211070-21 = "で、お前を見ちゃったじゃん？#nだから……ほらここ、蕁麻疹。"
211070-22 = "……あれ、消えてない？"
211070-23 = "ちっ、水性かよ。もっかいペン貸して。"
211070-24 = ""
211070-26 = ""
211070-27 = "ほら、見ろ。お前のせいで腕にホクロが7個もできた。#nこれ、どう責任取ってくれんだ？"
211070-28 = "いま自分で描いたよね！？"
211070-29 = "うるせぇな！つべこべ言わずに慰謝料払え！"
211070-30 = "無茶苦茶な……。"
211070-31 = "さっさと財布出すのが身のためだと思うぜ？"
211070-32 = "うぅ……あんた達……。"
211070-33 = "はーっ、ゲヘナったって1人で歩いてりゃ楽な獲物だぜ。"
211070-34 = "結束力はねぇし、風紀委員会は自治区内のことで手一杯。"
211070-35 = "つまり、誰もあんたを助けない！"
211070-37 = "[ns] 前へ出る。"
211070-40 = "[ns] \"ん……？あれは……。\""
211070-41 = "やはっ！マジうけんね。"
211070-42 = "あぁん？今なんつった？"
211070-43 = "誰だテメェ？"
211070-44 = ""
211070-46 = ""
211070-47 = ""
211070-48 = "なんだ、またゲヘナか？"
211070-49 = ""
211070-51 = ""
211070-52 = "そう。ゲヘナ。"
211070-53 = "だからさ――"
211070-54 = "うちの生徒から手ぇ離して、とっとと消えてくれる？"
211070-55 = ""
211070-57 = ""
211070-59 = "[ruby=みょうらく]明楽[/ruby]カレン"
211070-60 = "ゲヘナ再興委員会の委員長補佐"
211070-61 = "見た目に反して短気で、暴力に一切のためらいがない"
211070-63 = ""
211070-65 = "あぁん？"
211070-66 = "なになに、あんた何様？#n腕章……はつけてねぇし、風紀委員会じゃなさそうだな。"
211070-67 = "てこたぁ、お前の[ruby=ダチ]友達[/ruby]か？"
211070-68 = "えっ、違っ……別に、そういうんじゃ――"
211070-69 = ""
211070-71 = ""
211070-72 = "今から友達だから。よろしく。"
211070-73 = "えぇっ……。"
211070-74 = "ま、なんでもいいけどよ。1人で何ができる。#n世の中の理不尽ってやつを教えてやるよ！"
211070-75 = "キヴォトスの苦みと冷たさ体験コースだぁっ！"
211070-76 = ""
211070-77 = "[ns] \"ちょ、ちょっと……！\""
211070-78 = ""
211070-80 = ""
211070-81 = ""
211070-82 = ""
211070-86 = ""
211070-87 = "ぐはっ！こ、この……！"
211070-88 = ""
211070-90 = ""
211070-91 = ""
211070-92 = ""
211070-94 = ""
211070-96 = ""
211070-97 = "うぐっ！痛っ――！！"
211070-98 = "お、覚えてやがれ……！"
211070-99 = ""
211070-101 = ""
211070-103 = "一瞬で終わった……。"
211070-104 = ""
211070-106 = ""
211070-107 = ""
211070-108 = "だいじょぶ？"
211070-109 = "え、あ……うん。"
211070-110 = "固い固い。もっとフランクでいいって。#n怪我はしてなさそうだし、取られたものもなさそうだね。"
211070-111 = "ホントにありがとね。助けてくれなかったらどうなってたか……。"
211070-112 = "さっき言ったっしょ？もう友達って。#nうちの友達いじめるやつは絶対許さないから。"
211070-113 = "かっこいい……。"
211070-114 = "あ、全然話変わるんだけどさ、ゲヘナ再興委員会って知ってる？"
211070-115 = "……聞いたことあるかも。なんか最近有名だよね？"
211070-116 = "うち、そこ入ってるんだ。"
211070-117 = "え、マジ？私、部活とか入ってなくてさ。"
211070-118 = "やはっ、じゃあ入っちゃいなよ！"
211070-119 = "はい、うちのモモトーク。何かあったら連絡ちょうだい。"
211070-120 = "うちらは「外」でもゲヘナの生徒を守ってるから。風紀委員会とは違ってね。"
211070-121 = "めっちゃカッコいいじゃん……。"
211070-122 = "入会届だしちゃおっかな！"
211070-123 = "ゲヘナを再び偉大に！"
211070-124 = ""
211070-126 = ""
211070-127 = "ゲヘナを再び偉大に！"
211070-128 = ""
211070-130 = ""
211070-131 = ""
211070-132 = "やはっ、今日も一件落着！"
211070-133 = ""
211070-135 = ""
211070-136 = ""
211070-137 = "あれ、先生？"
211070-138 = "[s] \"やぁ。\""
211070-139 = "わっ、本物だ！"
211070-140 = "何してんの？ってか、うちの活躍見てた？"
211070-141 = "[s1] \"かっこよかったよ。\"\n[s2] \"友達を守ったんだね。\""
211070-144 = "マジ？見てくれてたんだ！"
211070-145 = "えー、ヤバ。嬉しいかも。"
211070-146 = ""
211070-148 = ""
211070-149 = "じゃ、なでなで！良いことしたら褒められるのが当然でしょ？"
211070-150 = "[s] 撫でる。"
211070-151 = ""
211070-153 = ""
211070-154 = ""
211070-155 = "やはっ。"
211070-156 = ""
211070-158 = ""
211070-159 = "ん～？いつもこういうことしてるのかって？"
211070-160 = "まあ、そこそこ？"
211070-162 = "自治区の外だとたまにあるんだよね。風紀委員会は中だけだから。"
211070-163 = "1人で歩いてるゲヘナ生は狙われやすいんだよ。#nや、それはどの学園も似たようなもんか。"
211070-164 = "でも、ゲヘナの生徒に手ぇ出したやつは絶対逃がさない。"
211070-165 = ""
211070-166 = "え？いつでも呼んでね、って……先生を？"
211070-167 = ""
211070-169 = ""
211070-170 = "やっさし～そういうこと言われたの久しぶりだなぁ。"
211070-171 = "だけどねぇ、うち、けっこう強いんだよ？#n数が多くても大抵はなんとかなるし。"
211070-172 = "負けそうだなって思ったら、一回引いてから奇襲かければオッケー。"
211070-173 = "てか、危ないのは先生のほうじゃない？#nさっきみたいに、ここの治安結構ガタガタだから。"
211070-174 = "せっかくだし、先生の用事が終わるまでエスコートしてあげる！"
211070-175 = "あ、気にしないで。やることなくて暇だったから。"
211070-176 = ""
211070-177 = ""
211070-178 = ""
211070-179 = ""
211070-180 = ""
211070-182 = "（道中、他にも何度か脅されたが……）"
211070-183 = ""
211070-184 = ""
211070-185 = ""
211070-186 = ""
211070-187 = ""
211070-188 = ""
211070-189 = ""
211070-190 = ""
211070-191 = ""
211070-192 = ""
211070-193 = ""
211070-194 = ""
211070-196 = "（カレンが撃退してくれた）"
211070-197 = ""
211070-202 = "[ns] \"今日はありがとね。\""
211070-203 = "なんのなんの。力になれたならよかったよ。"
211070-204 = "一緒にあちこち回れて、うちも楽しかったし。"
211070-205 = "でも先生、やっぱ絡まれやすいタイプだよね。今日だけでも狙われ過ぎ。"
211070-206 = "[s] \"困っちゃうよね……。\""
211070-207 = "今度からは遠慮なく呼んでいいからね？"
211070-208 = "あ、モモトーク教えとこっか。メッセでも電話でも、好きなほうで～"
211070-209 = ""
211070-211 = ""
211070-213 = "よし、登録完了！"
211070-214 = "なんか繋がった感じしていいよね。"
211070-215 = "うち、大人とこういうことするの初めてでさ。やはっ、めっちゃ楽しい。"
211070-216 = ""
211070-218 = ""
211070-219 = "あ、そろそろ戻らないと。"
211070-220 = "最後に、何か聞きたいこととかある？"
211070-221 = "今日は出血大サービス。何でも答えたげるよ？"
211070-222 = ""
211070-225 = "[ns] \"カレンはどうしてゲヘナ再興委員会の活動をしてるの？\""
211070-226 = "おっ、予想外の質問。"
211070-227 = "うーん……。"
211070-228 = ""
211070-230 = ""
211070-231 = "ゲヘナが好きだから？"
211070-232 = "たぶんそれが一番！"
211070-233 = "みんなと一緒に何かやるのも楽しいし。#n先生も見て分かったでしょ？うちのメンツ、みんな面白いからさ。"
211070-234 = "んー？ゲヘナが好きな理由？"
211070-235 = "……。"
211070-236 = "うーん……うぅ～ん……。"
211070-237 = "難しいなぁ。いろいろあるとは思うんだよね。"
211070-238 = "まず……後腐れのない空気？っていうの？"
211070-239 = "偽善ってマジで嫌いなんだよね。#n表じゃニコニコしておいて、裏でごちゃごちゃ言うとか。#nああいうの、ホント無理。"
211070-240 = "でも、うちってそうじゃないでしょ？#nやる時は派手にやるけどそれっきり。表も裏もない。"
211070-241 = "あとは～好き勝手していい感じかな。自由な感じ。あれが好き。"
211070-242 = "委員会の方向性とちょっと違くないかって？"
211070-243 = "それねー、たしかに。ゲヘナに秩序と統制を、ってね。"
211070-244 = "こう言うと聞こえ悪いかもだけど……それ、[ruby=うちのブレイン]ショウコちゃん[/ruby]の受け売りなの。"
211070-245 = "でも……やっぱマユミちゃんの見てる景色が気になるからかな。#nうちもそれを見たいから一緒に走ってるんだ。"
211070-246 = "めちゃくちゃなゲヘナも嫌いじゃないけどさ。"
211070-247 = "マユミちゃんって、うちが知ってる中で1番ゲヘナを愛してるから！"
211070-248 = ""
211070-249 = "そんなマユミちゃんが作りたい学園ってどんな場所なんだろう、って。"
211070-250 = "突っ走って事故るタイプだけど、そこが良いっていうか。"
211070-251 = "ショウコちゃんはたまに変なこと言うけど、ゲヘナ好きなのは同じだし。"
211070-253 = "見てみたくない？#nみんなが一つになったゲヘナ。"
211070-254 = "バラバラじゃなくて、みんなが同じ方向を見てるの。"
211070-255 = "どんな感じかは全然想像つかないけどさ。"
211070-256 = ""
211070-257 = "やはっ、それかな。うちが再興委員会で頑張ってる理由。"
211070-258 = "どう？ちゃんと答えになってた？#nまとまってなかったらごめんね。勉強苦手なんだ。"
211070-259 = "[s] \"大丈夫、十分伝わったよ。\""
211070-260 = "そっか。よかった。#n……あ！あとこれも言わなきゃ。"
211070-261 = ""
211070-263 = ""
211070-264 = ""
211070-265 = "手伝ってくれてありがとね、先生。"
211070-266 = "うちらだけじゃ、きっともっと大変だったと思う。#n先生のおかげでスムーズに進んでる。"
211070-267 = "最近は入会してくる生徒も増えてきたんだよ。"
211070-268 = "だから、これからもよろしくね！"
211070-270 = "（カレンのおかげで、安全に予定を終えられた）"
211070-271 = "（ゲヘナへの想いも「本気」だと感じた）"
211070-273 = "次回;トリガー・ハッピー・ゾーン"
