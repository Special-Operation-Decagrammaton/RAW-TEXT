[translation]
1002605-1 = "주변의 시선"
1002605-2 = "(부탁을 받고, 네루가 기다리고 있다던 밀레니엄 광장으로 향했다.)"
1002605-3 = "(원래부터 사람들이 많은 곳이긴 했지만 어째서인지 평소보다 조금 더 소란스러웠다.)"
1002605-6 = "뭔데? 무슨 일이야? 무슨 일 있어?"
1002605-7 = "나, 나도 잘 모르겠어. 저게 무슨 상황인지……. 행사 같은 건가?"
1002605-8 = "그럼 왜 혼자야? 그리고 왜 태연하게 강의실을 들락거려……?"
1002605-9 = "글쎄……. 어? 잠깐만. 근데 저 사람, C&C의 부장 선배 아냐?"
1002605-10 = "지, 진짜네……? 뭐야. 저 사람이 왜 저런 복장을……."
1002605-11 = "여어, 선생. 여기야, 여기."
1002605-16 = "……제 시간에 왔네. 역시 선생이야."
1002605-17 = "[s1] \"……네루?\"\n[s2] \"왜 또 그 복장을…….\""
1002605-18 = "……뭐야, 선생도 그런 반응이야? 흐음……."
1002605-19 = "……뭐야, 선생도 그런 반응이야? 흐음……."
1002605-20 = "역시 이거 때문이었나. 대충 예상은 했지만……."
1002605-21 = "……응? 무슨 말이냐고? 지금 뭔가 위장 임무 같은 거 하는 중이냐고?"
1002605-22 = "크하하. 아냐. 이건 그냥 입고 나온 거야."
1002605-23 = "이제 슬슬 신발 쪽도 길들이기가 되었으니까 말이지. 꽤나 자연스럽게 행동할 수 있게 됐으니……."
1002605-24 = "그치만 역시 어색하게 안 보이려면 가끔씩은 실제로 착용하고 다니는 것도 필요할 거 같아서 말이지."
1002605-25 = "일부러라도 적어도 네다섯 번은 입어 봐야 필요할 때 자연스럽게 행동할 수 있지 않겠어?"
1002605-26 = "……응?"
1002605-27 = "신경 쓰이지 않냐고?"
1002605-28 = "아니, 전혀."
1002605-29 = "뭐, 그래. 아침부터 쓸데없는 시선을 많이 받긴 했지. 대충 그런 이유인가보다 하기는 했는데……."
1002605-30 = "역시 선생이 말해주니 확실해지는군. 고마워, 확인이 됐네."
1002605-31 = "참 나. 남의 옷에 신경 쓸 시간에 자기들 앞가림이나 잘 할 것이지……."
1002605-32 = "……뭐?"
1002605-33 = "별로 개의치 않아 하는 것 같다고?"
1002605-34 = "당연하잖아? 딱히 교칙 위반을 한 것도 아닌데."
1002605-35 = "그렇게 따지면 평소에 입는 옷도 마찬가지 아니겠어? 보통의 교복은 아니니까."
1002605-36 = "뭐, 어느 쪽이든 교복보다는 훨씬 낫지. 갑갑한 건 딱 질색이니까."
1002605-40 = "……(웅성웅성)."
1002605-43 = "……어이."
1002605-44 = "저리 안 꺼져? 무슨 구경 났어!? 앙?"
1002605-45 = "히익……!"
1002605-49 = "크하하하. 하여간 맥없는 녀석들이라니까. 결국 저렇게 다 도망칠 거면서."
1002605-50 = "……음."
1002605-51 = "흐음……."
1002605-52 = "[s3] \"……네루?\"\n[s4] \"왜 그래?\""
1002605-53 = "……아니. 그냥 좀."
1002605-54 = "……아니. 그냥 좀."
1002605-55 = "선생은 어때?"
1002605-56 = "선생도 신경 쓰여? 혹시 많이 이상하다든가, 우스꽝스럽게 보인다든가……. 그런가?"
1002605-57 = "……응? 아니라고?"
1002605-58 = "가끔은 이런 식인 것도 괜찮은 거 같다고?"
1002605-59 = "……크하하. 정말 좋은 사람이구만, 선생."
1002605-60 = "그냥 해주는 말인지 진심인지는 모르겠지만, 상관없겠지."
1002605-61 = "자아-. 그럼 뭐……. 어차피 오늘은 수업도 다 끝났겠다……."
1002605-62 = "이왕 여기까지 나온 거, 같이 좀 놀다 들어갈까? 선생."
1002605-64 = "(이후 네루와 저녁까지 캠퍼스를 돌아다니며 놀다 샬레로 돌아왔다.)"
1002605-65 = "(돌아다니는 내내 네루의 복장 때문에 시선들이 쏠렸지만, 정말로 본인은 전혀 신경 쓰지 않았다.)"
