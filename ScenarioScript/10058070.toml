10058070-274 = ""
10058070-275 = "ラナだって、諦めてない！"
10058070-276 = "ラナ……。"
10058070-277 = "自分の頭は自分で守るから、大丈夫。"
10058070-279 = ""
10058070-280 = ""
10058070-281 = ""
10058070-282 = ""
10058070-283 = "最後までやってみよう。それがきっと「大事な過程」になるよ。"
