[translation]
10058070-1 = "第7話;赤信号"
10058070-2 = ""
10058070-3 = "チェリノ……会長……？"
10058070-4 = "会長がどうしてあんなところに……？"
10058070-5 = "お変わりなく何より。背も全然伸びてない。"
10058070-6 = "出場してたの！？どうして！？#nというか、私たちが優勝するにはチェリノ会長に勝たなきゃいけないってこと！？"
10058070-7 = "もし勝っちゃったら粛清されるんじゃない！？"
10058070-8 = "さっきの様子だと実力も相当みたい。#n6キロ以上離れたところを砲撃してきたし。"
10058070-9 = "とりあえず避けて進もう！#nそのうち他のチームが会長を撃破するかもしれないし！"
10058070-10 = "いや、でも……勝てるチームなんているかな……#nあっ、そうだ！あのふわふわで眠そうな目の人だったら……。"
10058070-11 = "ゲヘ[ruby=パンデモニウム・ソサエティー]ナの万魔殿、虎[/ruby]丸チーム[ruby=なつめ]の棗イ[/ruby]ロハ。"
10058070-12 = "そうそう！逃げていればあの人がやっつけてくれると思わない？#nそうすれば、私たちは粛清されな～い！！"
10058070-13 = "双眼鏡貸して！あっちの様子を見て動かなきゃ！"
10058070-15 = "とりあえず、ひたすらチェリノ会長が行く方向と反対に逃げ……。"
10058070-22 = "ど、どこ行った～！？"
10058070-23 = "もう！！双眼鏡で見てるのに分からないの！？"
10058070-24 = "おかしいよ！！絶対、あっちにいたのに！！"
10058070-27 = "ラナ、エンジンを切って！音でバレちゃうかも！"
10058070-28 = "？"
10058070-29 = "燃料節約のため、とっくに切ってる。"
10058070-30 = "えっ……？"
10058070-31 = "他の戦車に後ろを取られないよう気を付けろ。"
10058070-32 = "基本中の基本だ。"
10058070-33 = "ひえええっ！！！！！"
10058070-35 = "おーっと！これは下剋上対決だー！！"
10058070-36 = "183号特別クラスが、レッドウィンターの生徒会である事務局と大激突！"
10058070-37 = "ここでイブキちゃんにチームの紹介をお願いします！"
10058070-38 = "うん！ええっと、レッドウィンターの事務局は、会長の名前が「れんかわチェリノ」だって！"
10058070-39 = "何さいなのか書いてないけど、お姉ちゃんなのかな？"
10058070-40 = "戦車は「しゅくせい君1号」で、キヴォトス戦車ランキング2位！"
10058070-41 = ""
10058070-42 = "[ns] \"チェリノってそっちの方面でも有名だったの？\""
10058070-43 = "前号の「週刊[ruby=ぱんでも]万魔殿[/ruby]特別編」で裏表紙のモデルにもなりましたよ！"
10058070-44 = "この界隈ではすごくすご～く有名な実力者なんです！"
10058070-45 = "これに対する183号特別クラスの戦績は0戦0勝0敗！"
10058070-46 = "Eloレーティングも基本の1500。未勝利かつ無敗という謎めいたチームです！"
10058070-47 = "すでに戦車レースマニアの間では#n「破壊に飢えた地獄より降臨せしマッシャー」#nとも呼ばれ始めている183号特別クラス！"
10058070-48 = "本大会のために3人で戦車を作ったそうですが、#nどのような活躍を見せてくれるでしょうか！"
10058070-49 = ""
10058070-50 = "ふあぁぁぁーん！"
10058070-51 = "ひえぇぇぇーん！"
10058070-52 = "やっぱり、チビ会長の戦車はかっこいい。"
10058070-53 = "感心してる場合じゃないでしょ！！"
10058070-55 = ""
10058070-56 = "こいつらはレッドウィンターの生徒たちなのか？#nどこかで見たような気もするが……。"
10058070-57 = "会長。報告によると、#n彼女たちはレッドウィンター連邦学園の183号特別クラスチームとのことです。"
10058070-58 = "ふむ。……なんだか戦車は奇妙だし、みんな怯えているな。"
10058070-59 = "他の生徒が見たら、おいらの権威が失墜しかねない。"
10058070-60 = "装填手、HEAT弾だ。準備ができたら零距離射撃！"
10058070-61 = "おいらの優勝を阻むものは、全て消してしまえ！"
10058070-65 = ""
10058070-66 = "ここで、おしまい……。"
10058070-67 = "ひぃん……。"
10058070-68 = ""
10058070-71 = ""
10058070-72 = "？"
10058070-73 = "？"
10058070-74 = ""
10058070-77 = "？？"
10058070-78 = ""
10058070-81 = "きゃあああっ！！！"
10058070-82 = "チェリノ会長、襲撃です！！！"
10058070-83 = "この機動性、このエンジン音。久方ぶりだな……。"
10058070-85 = ""
10058070-86 = "[ruby=あじたに]阿慈谷[/ruby]、ヒフミ……！"
10058070-88 = "いやぁ～！！ここでライバルが登場！！運命的ですね！！"
10058070-89 = "レッドウィンター事務局の粛清君1号チームが、#nトリニティ補習授業部のクルセイダーちゃんチームに不意打ちを食らいました！"
10058070-90 = "戦車ランキング2位タイの実力者、#n阿慈谷ヒフミさんが率いる恐ろしいチームです！"
10058070-91 = "[s] \"ヒフミが戦車ランキング2位なの！？\""
10058070-92 = "あれ？知らなかったんですか？"
10058070-93 = "ゲヘナでも有名な選手ですよ！#nその活躍ぶりからついた二つ名は[ruby=ティターニア]妖精女王[/ruby]！"
10058070-94 = "[s] \"悪名？可愛らしい名前だけど？\""
10058070-95 = "それがですね――"
10058070-96 = "森の中で出くわしたら、絶対に逃げられないからつけられたらしいです！"
10058070-97 = "[s] \"それで、妖精女王……！\""
10058070-98 = "他にもっとやばい名前もあるとかないとか！"
10058070-100 = ""
10058070-101 = "ところで、なぜ補習授業部チームが#nレッドウィンター事務局チームと対戦することになったのでしょうか？"
10058070-102 = "183号特別クラスチームがやられるのを待ってもよかったですよね！"
10058070-104 = "補習授業部チーム"
10058070-105 = "（少し前）"
10058070-106 = "困りましたね……。"
10058070-107 = "どうしたの、ヒフミ？"
10058070-108 = "私たちを攻撃したチームが、昨日会った183号の人たちを狙っているようです。"
10058070-109 = "183号の人たちは気付いてないようなので、このままだとやられてしまいます。"
10058070-110 = "こっちの騒動に気を取られて、#n周りの様子が分からなかったのか。初歩的なミスだ。"
10058070-111 = "つまり、私たちを狙っていた相手は目標を変えたということですね？"
10058070-112 = "はい。砲身はまだこちらを向いていますが、#nすぐに183号の方へ目標を切り替えると思います。"
10058070-113 = "じゃあ、その隙に逃げちゃえばいいんじゃないの？#n的は全部当てたし、後はゴールすればおしまいでしょ！"
10058070-114 = "コハルちゃんの言うとおりです。でも……。"
10058070-115 = "それは、183号を見殺しにするということ。"
10058070-116 = "……！"
10058070-117 = "うーん……それはそうですね……。"
10058070-118 = "しかし、私たちに取れる手段はあるのでしょうか？#nこの距離から撃っても向こうの装甲は突破できないでしょうし。"
10058070-119 = "また私たちが狙われたら、この低地では孤立してしまう。"
10058070-120 = "クルセイダーちゃんのエンジンを酷使したから、少し冷ます必要もありますね。"
10058070-121 = "……。"
10058070-122 = "……。"
10058070-123 = "よく分からないけど……私たちが[ruby=・]代[/ruby][ruby=・]わ[/ruby][ruby=・]り[/ruby][ruby=・]に[/ruby][ruby=・]戦[/ruby][ruby=・]う[/ruby]のは損なんでしょ？"
10058070-124 = "そうですね、コハルちゃん。優勝のチャンスを逃す……というか……。"
10058070-125 = "じゃあ183号を助けて、私たちも逃げればいいじゃん。"
10058070-127 = ""
10058070-128 = "コハルちゃん！"
10058070-129 = "元々あっちは私たちの戦いに割り込んできたんだから！"
10058070-130 = "でも再試験も勉強も嫌っ！だから、逃げるのを手伝って終わり！#n私たちは、私たちのやり方で優勝するの！"
10058070-131 = "このまま逃げたら、ずっと気になっちゃいそう……だから……。"
10058070-132 = "……。"
10058070-133 = "あ、アズサ？"
10058070-135 = ""
10058070-137 = "やっぱり私は、こういうコハルが好きだ。"
10058070-139 = ""
10058070-140 = "え、ええっ！？急に！？どうして！？"
10058070-141 = "って、ハナコはなんでニコニコしてるの？#n……もしかして、私なにか見落としてる？"
10058070-142 = "いいえ、コハルちゃん。何も見落としてはいません。ですが……。"
10058070-144 = ""
10058070-145 = ""
10058070-146 = ""
10058070-148 = "たとえ見落としていたとしても、そんなコハルちゃんだから良いんですよ。"
10058070-149 = ""
10058070-150 = "そんな私って、何！？"
10058070-151 = "あはは、ハナコちゃん。その言い方だと、コハルちゃんが勘違いしちゃいます。"
10058070-152 = "みなさんの意見はどうですか？"
10058070-153 = "天才コハルちゃんの意見に賛成です。"
10058070-154 = "私も心が痛む。賛成。"
10058070-155 = "「大事な過程」をもう少し楽しめるように手伝おう。"
10058070-157 = ""
10058070-158 = ""
10058070-160 = "コハルちゃん！距離を取ったらダメです！もっと追い込んでください！"
10058070-161 = "初めて運転するんだから分かんないわよ！！"
10058070-162 = "大変だと思いますが、もう少しです！"
10058070-164 = ""
10058070-165 = "撃ちます！砲尾に気をつけてください！"
10058070-166 = ""
10058070-169 = "183号のみなさん！逃げてください！"
10058070-170 = "あいつら、同盟を結んでいたのか？#nこの状況で助けようとするとは、無謀なことを！"
10058070-172 = "トリニティの人たちだ！！どうしてここに！？"
10058070-173 = "助けに来てくれたってこと？っていうか、あの人たち水着！？"
10058070-174 = "空気抵抗を減らすため？"
10058070-175 = "そんなこと言ってる場合！？早く逃げないと！！"
10058070-177 = ""
10058070-178 = ""
10058070-179 = "履帯が壊れて空回りしてる。直さないと。"
10058070-180 = "うあああー！！エリナ！！ハンマー持ってきて！！早く早く早く！！"
10058070-181 = "わ、分かった！ちょっと待って！"
10058070-183 = "絶対に距離を取るな！砲身を向けられないよう、死角から接近しろ！"
10058070-184 = "この距離では、やつらの火力でもやられるぞ！"
10058070-185 = "むむ……やつらが攻撃できなくなったのは良いが、#nこのままではおいらたちも攻撃できないな……。"
10058070-186 = "火力でこちらが勝っている以上、この膠着状態は望ましくない。"
10058070-187 = "何か妙案は……。"
10058070-189 = ""
10058070-190 = "か、会長！！"
10058070-191 = "何だマリナ。せっかく機会を与えてやったというのに、また裏切るつもりか？"
10058070-192 = "滅相もございません！先日のクーデターは誤解です！"
10058070-193 = "この不肖マリナに、信頼回復のチャンスをお与えください！"
10058070-194 = "敵の戦車に飛び乗る「対戦車突撃」の許可を！チェリノ様！"
10058070-195 = "……。"
10058070-196 = "ふむ、素晴らしい忠誠心だ。"
10058070-197 = "敵戦車を制圧し、この私に優勝カップをもたらした暁には……。"
10058070-198 = "おいらが直々に、お前に勲章をやろう。"
10058070-199 = "会長が直々に……！"
10058070-200 = "トモエ。「あれ」を。"
10058070-201 = "はい、会長。こちらホイップクリームです。"
10058070-202 = "マリナ……お前のもたらす勝利は、#nこのホイップクリームのように滑らかで甘美なものになるはずだ。"
10058070-203 = ""
10058070-205 = "トモエ！マリナの準備をさせろ！"
10058070-207 = "戦車の上に飛び乗るなんて、まるで海賊みたいですね！ヨーホー！"
10058070-208 = "あのお姉ちゃん、すごーい！"
10058070-209 = "[s] \"これ、アリなの……？\""
10058070-210 = "はい！ルールにないのでオッケーです！"
10058070-211 = "ルールが緩いと、みんなメチャクチャするので3倍は面白くなりますよ！"
10058070-212 = "この激闘を生で見られる183号チームが羨ましいです！"
10058070-214 = ""
10058070-215 = "誰か飛び乗ってきます！"
10058070-216 = "しょ、正気なの！？"
10058070-217 = "妨害されるだけでも致命的だ。ひとまず対処を……！"
10058070-219 = "うおおおっ！！レッドウィンターのために！！"
10058070-220 = ""
10058070-222 = ""
10058070-223 = "あっ、靴紐が！？"
10058070-224 = "うぎゃあああっ！！！"
10058070-228 = "はぁ……#nマリナ委員長、試合前に靴紐を結んでおくようあれほど言ったのに……。"
10058070-229 = "情けないやつめ！"
10058070-235 = ""
10058070-236 = ""
10058070-237 = ""
10058070-238 = "んぎぎ……この固定ピンっ！！どうして抜けないの！！"
10058070-239 = "仕方ない、先にテンションスプロケットから外すわよ！エリナ、ハンマー！"
10058070-240 = "子犬号、お願い！！言うことを聞いて！！"
10058070-241 = "このままだと助けに来てくれた補習授業部の人たちがやられちゃう！！"
10058070-243 = ""
10058070-244 = ""
10058070-245 = ""
10058070-246 = ""
10058070-247 = ""
10058070-248 = "（こんなこと、危なすぎるでしょ……）"
10058070-249 = "（怖い、怖いよぉ……）"
10058070-250 = "エリナ、何してるの！早くハンマーを出して！"
10058070-251 = "……。"
10058070-252 = "もう、やめよう。"
10058070-254 = ""
10058070-255 = "え！？"
10058070-256 = "……！"
10058070-257 = "これ以上は危ないだけだよ。"
10058070-258 = "さっきだって……ちょっと運が悪ければ、ラナの頭を直撃してた。"
10058070-259 = "レースに出ようなんて、欲張り言ってごめん。もう、諦めよう――"
10058070-260 = "エリナがやろうって言ったんでしょ！！"
10058070-261 = "……！！"
10058070-262 = "「自信を持て」って、「一緒にかっこよく成功しよう」って！#n私に言ったわよね！"
10058070-264 = ""
10058070-265 = ""
10058070-266 = ""
10058070-268 = "私をその気にさせたんだから、最後まで責任取りなさいよ！！バカぁ～！！"
