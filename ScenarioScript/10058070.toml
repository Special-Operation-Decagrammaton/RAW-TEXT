[translation]
10058070-1 = "제7화;적색경보"
10058070-3 = "체리노……. 회장……?"
10058070-4 = "회장님이 왜 저기서 나와……?"
10058070-5 = "건강한 것 같아서 다행이야. 키는 조금도 안 컸고."
10058070-6 = "직접 출전한 거야?! 대체 왜?!! 그러면 우리가 1등 하려면 체리노 회장님을 이겨 먹어야 한다는 거야?"
10058070-7 = "그러면 이겨 먹었다고 숙청당하는 거 아니야?!"
10058070-8 = "어떡하지?! 아까 맞히는 실력도 엄청났잖아, 거의 6km는 넘겼던 것 같았는데."
10058070-9 = "일단 피해야지!! 피해 다니다가 다른 팀이 대신 회장을 격파할 수도 있는 거잖아?"
10058070-10 = "그 복슬복슬하고 졸린 눈에……. 아, 그러니까……."
10058070-11 = "게헨나 만마전, 토라마루 팀의 나츠메 이로하."
10058070-12 = "그래 그래!! 도망치다 보면 그 사람이 해치우지 않을까? 그러면 우리는 안 혼나겠지!"
10058070-13 = "쌍안경 빨리!! 가는 방향 보고 피해 가야지!"
10058070-15 = "일단 무조건 체리노 회장이 가는 방향 반대로 도망치는……."
10058070-22 = "어, 어디 갔어?!"
10058070-23 = "어디 있었는지도 기억 못 해?! 바보야?!"
10058070-24 = "아냐!! 분명히 저기에 있었다고!!"
10058070-27 = "라나, 엔진 끄자! 소리 때문에 들킬지도 몰라!"
10058070-28 = "?"
10058070-29 = "기름 아끼느라 시동은 이미 꺼뒀어."
10058070-30 = "엥?"
10058070-31 = "다른 전차가 뒤에 서게 하지 말도록."
10058070-32 = "기본 중의 기본이니까."
10058070-33 = "엄마야!!!!!!!!"
10058070-35 = "오-! 이건 하극상 대결이다-!"
10058070-36 = "붉은겨울의 학생회, 사무국과 183호 특별반의 대격돌!"
10058070-37 = "여기서 이부키 쨩의 팀 소개가 있겠습니다!"
10058070-38 = "응! 어디 보자, 붉은겨울 사무국은 주장이 '렌카와 체리노'래!"
10058070-39 = "언니려나? 나이가 안 적혀있어!"
10058070-40 = "전차는 <숙청군 1호>, 키보토스 전차 랭킹은 2위!"
10058070-42 = "[ns] \"체리노가 그런 쪽으로도 유명했었니?\""
10058070-43 = "지난번에 나온 <주간 만마전 특별판>에서 뒤표지 모델로도 나왔다구요!"
10058070-44 = "이 업계에선 엄청엄청엄청 유명한 실력자예요!"
10058070-45 = "아무튼, 이에 맞서는 183호 특별반의 전적은 0전 0승 0패!"
10058070-46 = "ELO 레이팅도 기본인 1500점. 무승이면서 무패인 수수께끼의 팀이죠!"
10058070-47 = "이미 전차대회 마니아들이 <파괴에 굶주린 지옥에서 온 마차꾼들>이라는 별명도 붙인 183호 특별반!"
10058070-48 = "이번 대회를 위해 전차를 직접 만들었다는데, 과연 어떤 활약을 보여줄까요!"
10058070-50 = "흐아아아앙-!"
10058070-51 = "히에에에에엥-!"
10058070-52 = "역시, 꼬맹이 회장님의 전차는 멋지구나."
10058070-53 = "감탄할 때가 아니잖아아!!"
10058070-56 = "붉은겨울의 학생들인가? 어디서 본 기억이 있는 것도 같은데……."
10058070-57 = "회장님. 저 학생들은 우리 붉은겨울 연방학원의 183호 특별반 팀이라고 합니다."
10058070-58 = "흐음, 전차도 괴상하게 생겼고, 다들 겁에 질려있구나."
10058070-59 = "다른 학교 학생들이 보면, 사무국의 권위마저도 실추되겠어."
10058070-60 = "탄약수, 대탄. 영거리, 준비되는 대로 사격!"
10058070-61 = "이 몸의 우승을 가로막는 것들은 모두 치워버려!"
10058070-66 = "여기서, 끝……."
10058070-67 = "히잉……."
10058070-72 = "?"
10058070-73 = "?"
10058070-77 = "??"
10058070-81 = "끄아앙!!"
10058070-82 = "체리노 회장님, 습격입니다!!!"
10058070-83 = "이 기동성, 이 엔진 소리. 간만이로군……."
10058070-86 = "아지타니, 히후미……!"
10058070-88 = "이야아!! 여기서 또 다른 최강자의 등장! 운명적이네요!"
10058070-89 = "붉은겨울 사무국, 숙청군 1호 팀에 트리니티 보충수업부팀이 불의의 기습을 가합니다!"
10058070-90 = "전차랭킹 공동 2위의 숨은 고수, 아지타니 히후미 씨가 주장인 무서운 팀이죠!"
10058070-91 = "[s] \"히후미가 랭킹 공동 2위?!\""
10058070-92 = "어라? 모르셨어요?"
10058070-93 = "게헨나에도 유명한 선수예요! 그 활약으로 붙게 된 이명은- '요정여왕'!"
10058070-94 = "[s] \"요정여왕? 무슨 의미야?\""
10058070-95 = "아, 그게 말이죠-"
10058070-96 = "숲에서 마주치면, 절대로 도망칠 수 없어서 붙은 별명이에요!"
10058070-97 = "[s] \"엄청난 별명이구나……!\""
10058070-98 = "그 외에 더 엄청난 이명도 있다나 뭐라나!"
10058070-101 = "그런데, 어째서 보충수업부 팀은 굳이 붉은겨울 사무국팀과 맞붙게 된 걸까요?"
10058070-102 = "183호 특별반 팀이 당하는 걸 기다려도 됐을 텐데 말이죠!"
10058070-104 = "보충수업부 팀"
10058070-105 = "(얼마 전)"
10058070-106 = "곤란하네요……."
10058070-107 = "히후미, 뭘 봤길래 그래?"
10058070-108 = "저희를 공격한 팀이, 어제 뵈었던 183호 분들을 덮치려고 움직이고 있었어요."
10058070-109 = "183호 분들은 전혀 눈치를 못 채셨고요. 이대로라면 당할 거예요."
10058070-110 = "이쪽의 소동에 정신이 팔려서 가까운 환경을 인식 못 한 모양이야. 초보적인 실수네."
10058070-111 = "그렇다는 것은, 당장 저희가 걱정하던 공격자는 다른 목표로 관심이 옮겨간 걸까요?"
10058070-112 = "네. 포신 방향을 보면 저희를 의식하고는 있지만, 곧 관심이 183호 분들에게 완전히 돌아설 거예요."
10058070-113 = "그러면 우리가 이 틈에 도망치면 되는 거 아냐? 표적도 다 맞혔고, 결승선으로 가면 끝이잖아?"
10058070-114 = "네. 코하루 쨩 말대로예요. 그런데……."
10058070-115 = "그러면, 183호가 당하게 내버려 두는 거야."
10058070-116 = "……!"
10058070-117 = "어라…… 그건 그렇네요. 음……."
10058070-118 = "하지만 저희가 어떻게 할 수 있는 방법이 없지 않을까요? 이 거리에서 쏴도 관통은 무리일 테고요."
10058070-119 = "다시 우리에게 집중하게 된다면, 낮은 지대에서 오히려 우리가 고립될 거야."
10058070-120 = "방금 전 크루세이더 쨩이 너무 엔진을 혹사시켜서, 잠시 식혀줄 필요도 있을 거예요."
10058070-121 = "……."
10058070-122 = "……."
10058070-123 = "어려운 말이라서 잘 모르겠는데…… 우리가 도와주면 손해인 거지?"
10058070-124 = "그렇긴 해요 코하루 쨩, 우승할 찬스를 놓친다…… 랄까……."
10058070-125 = "그럼 조금만 손해 보면 안 돼? 구해주기만 하고 우리도 도망치면 되잖아……?"
10058070-128 = "코하루 쨩!"
10058070-129 = "저쪽이 우리 싸움에 끼어들었던 거고, 따지고 보면 원래 우리가 상대해야 하는 거잖아!"
10058070-130 = "그치만 재시험도 공부도 진짜 싫으니까! 어디까지나 도망치는 것만 도와주자구! 우리는 우리 나름대로 우승하는 거야!"
10058070-131 = "모른 척하기에는 자꾸 마음에 걸릴 것 같으니까 그런 거…… 야……."
10058070-132 = "……."
10058070-133 = "아, 아즈사?"
10058070-137 = "나는 역시, 이런 코하루가 좋아."
10058070-140 = "에, 엥?! 왜? 갑자기?!"
10058070-141 = "하나코는 왜 싱글벙글하는 건데? 나, 뭐 놓치고 있는 거야?"
10058070-142 = "아뇨, 코하루 쨩. 중요한 부분을 놓친 건 없어요. 그런데……."
10058070-148 = "놓치고 있었다고 해도, 그런 코하루 쨩이라서 좋은 거예요."
10058070-150 = "그런 나라는 게 대체 뭔데?!"
10058070-151 = "아하하, 하나코 쨩. 코하루 쨩이 오해할 거예요."
10058070-152 = "다른 분들의 의견은 어떠세요?"
10058070-153 = "천재 코하루 쨩 의견에 찬성이에요-"
10058070-154 = "나도 마음이 편하지 않아. 찬성이야."
10058070-155 = "소중한 과정을 좀 더 즐길 수 있게 도와주자."
10058070-160 = "코하루 쨩! 거리를 벌리면 안 돼요! 더 가까이 몰아주세요!"
10058070-161 = "운전은 처음이라서 잘 모른단 말야-!!"
10058070-162 = "힘들겠지만 좀 더 부탁해요!"
10058070-165 = "쏩니다! 포미 조심해요!"
10058070-169 = "183호 여러분들! 도망쳐요!"
10058070-170 = "저 녀석들과 동맹을 맺은 건가? 가망 없는 구조를 왔군!"
10058070-172 = "어제의 그 트리니티 분들이잖아?! 어째서 여기까지 온 거야?"
10058070-173 = "우리를 도와주려고?! 그보다 뭐야 저 옷은! 수영복에 웬 레이싱 옷?!"
10058070-174 = "고수들이 광장에서 입고 있는 옷차림 같은데."
10058070-175 = "그게 무슨 말이야?! 라나, 도망가야 해!!"
10058070-179 = "궤도가 부서져서 헛돌아. 고쳐야 해."
10058070-180 = "으아아아-!! 에리나!! 망치 들고 나와!! 빨리 고치고 도망가야 해!!"
10058070-181 = "으, 으아아!! 알았어, 알았다고!!!"
10058070-183 = "절대 거리를 벌리면 안 돼! 포신을 겨누지 못하게 사각으로 맞붙어라!"
10058070-184 = "200미터 내에 접어든 이상, 이런 근거리에서는 저 녀석들 화력으로도 관통당한다!"
10058070-185 = "으음, 포신이 얽혀서 저 녀석들이 공격을 못 하는 건 좋지만, 동시에 우리도 공격할 수 없군……."
10058070-186 = "우리가 가진 화력의 우위를 포기하면서까지, 이렇게 길게 교착을 끌어가는 건 손해야. 이미 녀석들이 달라붙게 기습한 시점에서 말려든 건가……."
10058070-187 = "뭐라도 좋으니 묘수가……."
10058070-190 = "회, 회장님!!"
10058070-191 = "뭐냐 마리나. 기껏 기회를 주었는데 또 배신할 틈을 노리는 건가?"
10058070-192 = "아닙니다! 당치도 않습니다! 지난 쿠데타는 오해였습니다!"
10058070-193 = "회장님의 믿음을 회복할 수 있게, 불초 마리나에게 기회를 주십시오!"
10058070-194 = "체리노 님, 적 전차에 올라타는, <대전차 돌격>을 허가해주십시오!"
10058070-195 = "……."
10058070-196 = "음. 훌륭한 당성이군."
10058070-197 = "적 전차를 제압하고 내게 우승컵을 안긴다면……."
10058070-198 = "이 몸이 직접, 사무국의 문까지 데려가겠다."
10058070-199 = "회장님께서 저를 직접……!"
10058070-200 = "토모에. '그것'을 주게."
10058070-201 = "네, 회장님. 여기, 휘핑크림입니다."
10058070-202 = "마리나, 네가 가져다줄 승리는 이 휘핑크림처럼 부드럽고 달콤할 것이다."
10058070-205 = "토모에! 마리나를 준비시켜라!"
10058070-207 = "전차 위에 올라타기! 해적 같네요! 요-호호!"
10058070-208 = "저 언니, 대단해-!"
10058070-209 = "[s] “전차전인데 이래도 돼……?”"
10058070-210 = "네! 규정에 없으면 오케이예요!"
10058070-211 = "규정이 헐렁하면, 다들 기상천외한 일을 해서 세 배는 재밌어지니까요!"
10058070-212 = "이 웅장한 승부를 1열에서 지켜보는 183호 팀이 부럽네요!"
10058070-215 = "올라타려는 모양이에요!"
10058070-216 = "어떡해?!"
10058070-217 = "방해만 받아도 치명적일 거야, 일단 준비를……!"
10058070-219 = "으아아아!! 연방을 위해!!"
10058070-223 = "아앗, 신발끈이?!"
10058070-224 = "으갸아아악!!!"
10058070-228 = "하아. 마리나 동지, 경기 시작 전부터 신발끈 좀 묶으라고 그렇게 말했는데……."
10058070-229 = "형편없는 녀석!"
10058070-238 = "으그극!! 이놈의 고정핀!! 왜 이렇게 안 빠져!!"
10058070-239 = "텐션 스프로킷 먼저 빼버리자! 에리나, 망치!"
10058070-240 = "제발!! 강아지호야 제발 우리 말 좀 들어줘!! 부탁해!!"
10058070-241 = "이러다가 도와주러 온 보충수업부 분들도 위험해질 거야! 제발!!"
10058070-248 = "(이런 거, 너무 위험하잖아…….)"
10058070-249 = "(무서워, 무섭다아…….)"
10058070-250 = "에리나, 뭐 해!! 빨리 망치 줘-"
10058070-251 = "……."
10058070-252 = "그만, 하자."
10058070-255 = "뭐?!"
10058070-256 = "……!"
10058070-257 = "이 이상 해봤자, 위험하기만 할 거야."
10058070-258 = "아까, 그대로 맞았다면 라나 머리로 지나갔어."
10058070-259 = "이런 거 하자고 해서 미안해, 포기하자. 내 욕심 때문에, 미안-"
10058070-260 = "야! 네가 하자고 했잖아!!"
10058070-261 = "……!!"
10058070-262 = "'자신 가지라'라고, '같이 멋지게 성공하자'라고 했잖아!"
10058070-268 = "내가 그 말에 힘이 나게 했으면, 끝까지 책임지라고! 바보야!!"
10058070-271 = "그런……."
10058070-275 = "라나도 포기 안 했잖아? 봐!"
10058070-276 = "라나……."
10058070-277 = "내 머리는 내가 알아서 지킬 거니까, 괜찮아."
