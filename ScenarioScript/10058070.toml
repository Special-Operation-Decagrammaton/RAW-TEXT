10058070-294 = "うっ、ううっ……！"
10058070-296 = ""
10058070-297 = "……オッケー！！"
10058070-298 = "どいた、どいたぁ！！ハンマー様のお通りだぁ！"
10058070-299 = "ぐあああっ！！"
