[translation]
10046250-3 = "흠흠. 실례합니다~"
10046250-4 = "혹시 이 해변의 관리자분이 맞으실까요?"
10046250-5 = "관리자…… 일단은, 그런 셈이긴 한데요."
10046250-6 = "혹시 무슨 문제 있으실까요?"
10046250-7 = "아, 처음 뵙겠습니다. 저는 백야당의 간판소녀 겸 주인, 카와와 시즈코라고 하는데요."
10046250-8 = "아아, 백야당이라면 백귀야행의 그 명물 가게…… 이번에 이 해변에 노점 운영을 한다고 들었슴다."
10046250-9 = "네, 그것과 더불어 해변에서 축제 개최의 허가를 받았는데요."
10046250-10 = "……응?"
10046250-11 = "죄송하지만, 축제 개최라면, 마츠리운영관리부에서 맡았던 걸로 아는데요."
10046250-12 = "흠흠…… 흐흐흠! 실은, 저 시즈코는 마츠리운영관리부의 부장도 겸하고 있답니다."
10046250-13 = "앗, 그렇습니까?! 실례했습니다."
10046250-14 = "하지만, 대단하네요. 그런 유명 가게의 점주이면서, 백귀야행의 축제 관리까지 하고 계시다니……."
10046250-15 = "훗……."
10046250-16 = "아, 아니, 이 정도는 아무것도 아니랍니다~ 주변 분들이 다들 잘 도와주셔서~"
10046250-17 = "아! 그보다 축제 말인데요!"
10046250-25 = "……전혀 개최할 수 있는 환경이 아니었습니다!"
10046250-26 = "아니, 티파티의 프라이빗 비치 첫 개장이라면서요!"
10046250-27 = "그렇다면 좀 더 우아하고, 고급스럽고, 돈 많은 손님들이 모이는……!"
10046250-31 = "아, 아니…… 치안이 좋은 장소라고 생각했는데요~"
10046250-32 = "이대로면 가지고 온 상품을 전혀 팔 수 없을 것 같은 느낌이……."
10046250-33 = "아, 아하하. 그게……."
10046250-34 = "죄송합니다. 저 혼자 관리하다 보니 부족한 점이 많아 이용에 불편을 끼쳐드렸습니다."
10046250-35 = "으음~ 역시, 일손이 부족한 건가요?"
10046250-36 = "예? 아, 네에, 뭐, 그런 셈이죠."
10046250-37 = "……좋아."
10046250-38 = "그러면 이렇게 하죠. 제가 해변 관리를 도와드릴게요."
10046250-39 = "네? 아니, 그러실 필요까지는……."
10046250-40 = "있어요! 있다고요!"
10046250-41 = "여기까지 가져온 재료하고, 노점 설비에 운송비까지……!"
10046250-42 = "대적자라고요! 대. 적. 자!"
10046250-43 = "…………."
10046250-44 = "……앗, 그러니까~ 모두가 행복하게 해변을 즐길 수 있게끔 도와주고 싶다고 할까……."
10046250-50 = "…………."
10046250-51 = "…………."
10046250-52 = "그런 걸로 합시다!"
10046250-53 = "앗, 네."
