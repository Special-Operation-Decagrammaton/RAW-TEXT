[translation]
32150-1 = "제15화;시작되는 습격"
32150-6 = "……. IV팀. 도착 완료."
32150-7 = "별도의 경계는 없는 것으로 확인."
32150-11 = "V팀, VI팀, VIII팀 모두 스탠바이 완료했다고 합니다."
32150-12 = "타겟의 위치 확인되었다. 예정대로 작전 진행한다."
32150-13 = "전원, 이동."
32150-20 = "……후우."
32150-24 = "……아뇨. 홍차는 이제 괜찮아요."
32150-29 = "……응?"
32150-30 = "잠이 안 오시나 보네요."
32150-31 = "?!"
32150-37 = "하긴, 정의실현부를 교외로 전부 보내버렸으니 불안했나 봐요……? 나기사 씨."
32150-38 = "우, 우라와 하나코 씨?! 다, 당신이 여, 여긴 어떻게……?!"
32150-39 = "이 패닉룸을 어떻게 알고 있냐고요? 그야, 티파티의 패닉룸 87개의 로테이션 순서를 다 알고 있거든요…… 후후♡"
32150-40 = "……?!"
32150-41 = "변칙적으로 어떻게 운용하는지도 대충 알아요. 가령, 지금처럼 정말로 불안할 때는 이 다락방 위의 비밀 장소에 숨는다는 것도♡"
32150-42 = "여, 여기……!!"
32150-46 = "움직이지 마."
32150-47 = "……!!"
32150-48 = "아아, 당연히 주변의 경호원들은 전부 처리했어요. 그러니까 이렇게 제가 모습을 드러낸 거잖아요?"
32150-49 = "시라스 아즈사……. 우라와 하나코…… 설마……."
32150-50 = "<배신자>는 한 명이 아니라 두 명이었다는……?"
32150-51 = "……후후후후♡ 단순하네요. 저도, 아즈사 쨩도 한낱 장기말에 불과해요. 진짜 우리들을 지휘하는 분은 따로 있거든요."
32150-52 = "……!!"
32150-53 = "그, 그건…… 대체……. 누구죠, 그건?!"
32150-54 = "……. 흐음, 그치만 나기사 씨. 이렇게까지 할 필요가 있었나요?"
32150-55 = "……."
32150-56 = "보충수업부 얘기예요. 나기사 씨의 걱정은 알겠지만, 이런 식으로 <샬레>까지 동원해서 편법을 쓸 필요까진 없었잖아요."
32150-57 = "……. 그건."
32150-58 = "처음부터 수상쩍었던 저나 아즈사 쨩은 그렇다고 해도…… 히후미 쨩과 코하루 쨩은 너무했다고 생각하지 않나요?"
32150-59 = "……."
32150-60 = "특히 히후미 쨩은…… 나기사 씨와 친했잖아요."
32150-61 = "어째서 이렇게까지 가혹하게 군 거죠? 히후미 쨩이 받았을 상처는 생각해보지 않았나요?"
32150-62 = "……."
32150-63 = "……네. 대의를 위해서라고는 해도, 히후미 씨에게는…… 그렇게 했었으면 안되었는데."
32150-64 = "제 행동을 후회하지 않아요. 그래도 그녀와의 우정만큼은 끝까지 지키고 싶었는데. 저는……."
32150-65 = "……후후후후♡"
32150-66 = "그럼 저희 지휘관님이 나기사 씨에게 보내는 메시지를 전할게요."
32150-68 = "'아하하…… 즐거웠어요, 나기사 님과 함께 한 우정 놀이.' ……라고♡"
32150-69 = "……네?! 서, 설마……. 그럼……?!"
32150-74 = "목표 확보 완료. 지금 포장해서 킬링 필드로 이동 중."
32150-75 = "근접거리에서 5.56mm 탄을 한 탄창이나 맞았으니 1시간은 기절해 있을 거야."
32150-76 = "후후후♡ 좋아요. 여기서부터는 작전대로 아즈사 쨩이 적들을 유인해주면 돼요."
32150-77 = "……으응. 아직 어딘가에 남아있을 <진짜 트리니티의 배신자>에게 거짓 정보를 흘린다는 것은 이해했어."
32150-78 = "그 가정대로라면 아리우스도 습격을 서두를 수밖에 없겠지."
32150-79 = "응, 맞아요. 아즈사 쨩. 제 추측대로라면, 아직 풀리지 않은 부분들이 몇개 더 있어요……."
32150-80 = "<진짜 배신자>의 존재는 아직 증거는 없지만…… 그 존재가 있다는 것은 저는 어느 정도 확신하고 있어요."
32150-81 = "그런데 마지막의 그 대사는 왜 필요했던 거야?"
32150-82 = "어…… 그건…… 그냥…… 말하자면 저 혼자 멋대로 복수라고 할까…… 나기사 씨를 혼내주고 싶어서……."
32150-83 = "뭐, 오해는 금방 풀릴 거예요♡"
32150-84 = "……."
32150-85 = "아, 아즈사 쨩, 아리우스의 병력은 몇이죠? 혼자서 얼마나 오래 막을 수 있나요?"
32150-86 = "나도 자세한 규모는 몰라. 하지만 대비는 이미 오래 전부터 해 왔으니까 시간을 끄는 건 가능해."
32150-87 = "밤마다 학원 주변에 부비트랩과 참호를 만들어놨으니까. 그쪽으로 유인해서 게릴라전을 펼치면서 시간을 벌겠어."
32150-88 = "랑데뷰 포인트는 킬링필드에서."
32150-89 = "네! 그럼 여기서 헤어지는 거예요!"
32150-95 = "패닉룸 클리어! 타깃, 보이지 않습니다!"
32150-96 = "먼저 방문한 손님이 있었나 본데…… [ruby=.]첩[/ruby][ruby=.]보[/ruby]가 사실이었군."
32150-97 = "주변을 수색해라! 큰 소동은 벌이지 마!"
32150-98 = "접선하기로 한 <첩자>는 어디에 있는 거지?! 그 녀석의 도움이 필요하다!"
32150-99 = "(치익-!) 여기는 IV팀, 기, 기습입니다!"
32150-100 = "뭐?!"
32150-103 = "<첩자>입니다! 배, 배신이다! <첩자>가 배신했습니다!"
32150-104 = "(후욱- 후욱-)"
32150-106 = "으아아아아아--!!"
32150-107 = "무, 무슨 일이 벌어지고 있는 거냐……!! <첩자>가 배신했다고……?"
32150-112 = "(후욱-) 그래. 맞아."
32150-113 = "?!"
32150-114 = "목표는 내가 탈취했어."
32150-115 = "뭐, 뭐라고?!! 어째서 이런 짓을?!"
32150-116 = "이걸 빨리 처리해놓고 시험을 쳐야 하거든."
32150-117 = "……뭐?"
32150-118 = "참고로 정의실현부에도 지금 상황을 보고해 놨으니, 도망치려면 지금뿐이야."
32150-119 = "(딸깍)"
32150-120 = "……."
32150-121 = "어쩌실 거죠? 퇴각합니까?"
32150-122 = "아니, 블러핑이다. [ruby=.]첩[/ruby][ruby=.]보[/ruby]에 의하면 정의실현부는 절대 움직이지 않을 거라고 했어."
32150-123 = "우리의 퇴각을 유도하는 심리전이야. 추격한다!"
32150-124 = "네!"
32150-126 = "다음화;격전"
