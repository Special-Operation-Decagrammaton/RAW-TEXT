[translation]
10000095-2 = "그럼, 저희 마츠리부는 마지막 축제 준비를 위해 먼저 가볼게요."
10000095-3 = "두목! 좋은 자리에서 클라이맥스를 구경해주시기 바랍니다!"
10000095-4 = "[s] \"응, 둘 다 수고해.\""
10000095-6 = "(마츠리운영관리부의 부원들을 떠나보낸 뒤, 떠들썩한 축제 거리를 거닐었다.)"
10000095-8 = "이제 좀 있으면 밀레니엄 불꽃놀이가 시작한다고 하는구먼!"
10000095-9 = "늦기 전에 얼른 가자고!"
10000095-11 = "[ns] 사람들을 따라 불꽃놀이 장소로 이동한다."
10000095-15 = "(불꽃놀이를 볼 수 있는 전망대는 많은 사람으로 붐비고 있었다.)"
10000095-16 = "(하지만 그렇게 많은 인파 속에서도 금방 발견할 수 있었다.)"
10000095-18 = "사, 사람이, 엄청 많아서, 이, 이즈나 숨쉬기가 힘들어요~"
10000095-19 = "[s] 조용히 이즈나를 부른다."
10000095-20 = "앗?! 이 목소리는! 선생……. 아니, 주군!"
10000095-23 = "(갑자기 달려온 이즈나의 기세에 못 이겨 몸이 휘청거렸다.)"
10000095-24 = "주군! 이즈나가 자리를 맡아두고 있었어요!"
10000095-26 = "……는! 앗! 여기 오는 사이에 사람이 꽉 들어차서!"
10000095-27 = "어, 어쩌죠?! 으앙! 도, 돌아가는 길이 막혀버렸어요!"
10000095-28 = "(당황하는 이즈나를 애써 달래주며 이 자리에 머물기로 했다.)"
10000095-29 = "[s] \"어쩔 수 없지, 여기서 보자.\""
10000095-30 = "앗, 네! 에헤헷!"
10000095-32 = "아…… 시작됐어요!"
10000095-38 = "와앗! 멋져요!"
10000095-39 = "(그렇게 이즈나와 함께 한동안 하늘에서 피어나는 불꽃놀이를 구경했다.)"
10000095-41 = "(그것을 얼마나 지켜보고 있었을까.)"
10000095-43 = "에헤헷, 이게…… 주군과 함께 보는 풍경인 거군요."
10000095-44 = "……."
10000095-45 = "그, 이번에, 이즈나가, 그, 폐를 많이 끼쳐버린 거, 죄송해요."
10000095-46 = "이즈나는 그러니까……."
10000095-47 = "[s1] \"그거라면 괜찮아. 선생님이니까.\"\n[s2] \"그런 일이라면 언제든지 환영이니까.\""
10000095-48 = "그런 일이 있더라도, 선생님은, 선생님……."
10000095-49 = "그런 일이 있더라도, 선생님은, 선생님……."
10000095-51 = "에헤헤헷! 네엣! 주군! 저 이즈나! 맹세했어요!"
10000095-52 = "주군도 이즈나와 마찬가지로 닌자 동지! 제 꿈을 응원해주는 분이니까!"
10000095-53 = "앞으로도 평생토록! 주군을 따르겠다고!"
10000095-54 = "[s] \"그, 그래?\""
10000095-55 = "그러니 주군!"
10000095-56 = "앞으로도 이즈나를, 잘 부탁드려요!"
10000095-57 = "그걸 위해서, 이즈나는 앞으로도 수행을 계속할 테니까요!"
10000095-60 = "닌닌!"
10000095-63 = "백귀야행의 제38번 구교사."
10000095-67 = "(인법연구부 동아리실)"
10000095-68 = "(볼일이 없는 잡상인이라면 사절! 입부 희망자 모집中!)"
10000095-69 = "오오, 여기가 소문으로만 듣던, 인법연구부……!"
10000095-70 = "닌자를 연구하는 동아리가 있었다니, 이즈나 완전 몰랐어요!"
10000095-71 = "이곳에서 수행한다면 이즈나는 앞으로 더더욱 훌륭한 닌자가……!"
10000095-73 = "그럼 어디!"
10000095-76 = "실례합니다-!"
10000095-79 = "끝……?"
10000095-80 = "벚꽃만발 축제대소동!"
