[translation]
1601006-1 = "마이스터의 상냥한 자장가"
1601006-2 = "오늘도 수고 많았어, 선생님."
1601006-3 = "지난번에 받은 피드백을 바탕으로 새로운 응원 도구를 만들어 보았어."
1601006-4 = "선생님의 의견을 적극 반영해서 만든 물건인 만큼, 선생님이 먼저 시험해 주었으면 좋겠어."
1601006-5 = "[s] \"오늘도 치어리더 차림이구나…….\""
1601006-6 = "응…… '응원'에 관련된 일이니까."
1601006-7 = "이제는 이 옷을 입지 않으면 새로운 응원 도구를 만들고자 하는 의욕이 나질 않아."
1601006-8 = "……나도 모르는 사이에 루틴이 되어버린 걸까?"
1601006-9 = "……여하튼."
1601006-10 = "이번에 만든 응원 도구는 선생님의 마음에도 들 거야."
1601006-11 = "이 응원 도구는 기존의 시제품과는 달리, '누구에게나 필요하고, 현대인이 가장 갈망하는 특정한 성질의 욕망'을 자극하도록 설계되었으니까."
1601006-12 = "그렇게 해서 만들어진 결과물이…… 바로 이것."
1601006-16 = "[ns1] \"이건…… 응원용 응원술?\"\n[ns2] \"응원술은 쓰지 않는다고 하지 않았어?\""
1601006-17 = "응, 평범한 응원술이라면 그렇겠지."
1601006-18 = "응, 평범한 응원술이라면 그렇겠지."
1601006-19 = "하지만 이 응원술에는 특별한 기능이 추가되어 있어."
1601006-20 = "바로…… 블루투스 기능이야."
1601006-21 = "[s] \"블루투스?\""
1601006-22 = "응. 전에 만들었던 <실신 전용 쇠파이프>의 기능을 활용해 보았어."
1601006-23 = "충분한 수면은 뇌의 인지기능을 강화해 집중력을 향상시키고, 업무를 능숙하게 수행할 수 있도록 도와주니까……"
1601006-24 = "수면을 유도하는 행위야말로 가장 효과적인 응원이라고 할 수 있지."
1601006-25 = "[s] \"틀린 말은 아니지만…….\""
1601006-26 = "자, 선생님. 침대에 누워서 이 응원술에 머리를 뉘어봐."
1601006-31 = "(……응원술에 머리를 가져다 대니, 익숙한 목소리의 자장가가 흘러나왔다.)"
1601006-32 = "[s] \"이 목소리는…….\""
1601006-34 = "……맞아."
1601006-35 = "……내가 녹음한 자장가야."
1601006-36 = "급하게 응원술에 내장할 자장가를 찾다 보니 마땅한 음원을 찾을 수가 없어서……"
1601006-37 = "임시로 내 목소리로 자장가를 불러보았어."
1601006-38 = "……역시 평범한 클래식 음악을 쓰는 게 좋았으려나……."
1601006-39 = "[s3] \"절대 그렇지 않아!\"\n[s4] \"이편이 훨씬 좋아!\""
1601006-44 = "……그런가."
1601006-45 = "이 '응원'이 선생님의 마음에 들었다니 다행이네."
1601006-46 = "사용법은 간단해."
1601006-47 = "침대에 누워서 응원술을 머리 가까이에 두고 블루투스 기능을 키면 OK."
1601006-48 = "분명 이 응원술은…… 선생님에게 최고의 숙면을 보장해 줄 거야."
1601006-55 = "……그럼, 선생님."
1601006-56 = "오늘 밤은 좋은 꿈을 꾸길 바랄게."
1601006-58 = "(……히비키의 발명품 덕분에 간만의 단잠을 청할 수 있었다.)"
