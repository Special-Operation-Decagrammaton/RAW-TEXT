[translation]
102190-1 = "제19화;자치구 방어 작전 - D.U. 시라토리구"
102190-5 = "다음은 여섯 번째 성소인데…… 이곳의 <수호자>는 아직까지 포착되지 않은 상태예요."
102190-6 = "하지만 탐지되는 에너지로 볼 때…… 아마 이 <수호자>는 다른 모든 수호자들을 합친 것보다 더 위험한 존재라고 생각되네요."
102190-7 = "섣부르게 성소를 공격하면 어떻게 될지 예측이 안되기에……. 일단 D.U. 주변의 방어와 정찰을 강화하시죠."
102190-8 = "그때까지 제6 성소의 위협을 막아낼 수 있는 방법을 찾아낼 테니까요."
102190-9 = "방법? 그런 게 있는 거야, 부장?"
102190-10 = "물론이에요. 에이미. 지금도 한창 데이터를 수집하는 중인걸요? 절 누구라고 생각하는 거죠?"
102190-11 = "음……. 하수구의……."
102190-12 = "시작이 틀렸잖아요. 완전 다르잖아요. 그 단어로 시작하면 그냥 오답이잖아요? 요즘 자주 그러는 거 알아요? 일부러 그러는 거죠?"
102190-13 = "……."
102190-19 = "좋아! 확인했어! 그건 우리에게 맡겨!"
102190-20 = "네, D.U. 시라토리구의 방어 작전은 저희가 돕도록 하죠."
102190-22 = "사실은 아쿠아리움으로 가는데 방해가 되어서지만★"
102190-23 = "응! 얼른 해치우는 거야!"
102190-24 = "보충수업부의 두 분도 함께 하시죠."
102190-26 = "네, 네?! 저, 저희도요?!"
102190-27 = "응. 잘 부탁해. 미식연구회."
102190-29 = "어머나~ 그때 이후로 오랜만이네요."
102190-30 = "자아! 그럼 가자고!"
102190-39 = "무한히 회전하는 레일은 이윽고 정의의 미래로 이어진다!"
102190-43 = "무한초밥전대 카이텐져 등-장!!!"
102190-44 = "핫핫핫! 세계의 위기가 도래한 지금, 우리가 손 놓고 있을 수는 없는 법!"
102190-45 = "그렇지! 지금이야말로 우리 정의의 카이텐져가 등장할 타이밍이지!!"
102190-46 = "그런데 말야, 이건 진짜 위기로 보이는데? 괜찮은 거 맞지?"
102190-47 = "레드! 오늘 업무는 특별 수당 나오는 걸로 인지하고 있습니다. 노파심에 리마인드 드립니다."
102190-48 = "푸하핫! 이거라면 어쩔 수 없겠네! 해주는 수밖엔!"
102190-49 = "간다!! 무한초밥전대 카이텐져 출격!!"
102190-55 = "……어, 어라? 방금 뭔가 이상한 분들을 본 것 같았는데……?!"
102190-56 = "맞아!! 나도 봤어!! 초밥이었어!"
102190-57 = "뭐어? 초밥? 어디에?"
102190-58 = "초밥…… 먹기 힘든 음식이잖아……. 저번에 배달 주문했더니 이번 분기 금리가 높아서 배달이 어렵다고 했어……."
102190-59 = "무슨 소릴 하는 거야. 초밥이랑 금리가 무슨 상관인데!"
102190-61 = "후후후…… 좋네요. 분위기가 달아올랐으니, 다시 한번 흥을 돋워볼까요."
102190-62 = "갑니다!"
