[translation]
10033010-1 = "제1화;공정, 공평, 그리고 재미"
10033010-4 = "……."
10033010-5 = "……."
10033010-6 = "잠깐만요, 니야 님. 지금 하신 말은, 그러니까……?"
10033010-12 = "네에~ 들으신 대로랍니다. 금번 게헨나 학원의 백귀야행 수학여행 프로젝트의 진행 동아리로."
10033010-13 = "매우 공정하고 공평한 데다 재미있기까지 한 모종의 방법을 통해……."
10033010-14 = "바로, 마츠리운영관리부가 선정되었다는 영광스러운 소식을 전해드리려 합니다~ 냐하핫~"
10033010-16 = "그런 소식, 처음 듣습니다–! 그보다 공정하고 공평한 방법이라니, 그건 도대체……?"
10033010-17 = "룰렛으로 정했어–"
10033010-18 = "네, 네?! 룰렛이요?! 그거, 혹시 저희가 아는 그 룰렛 맞나요? 빙빙 돌리는 그거?!"
10033010-20 = "덧붙여서, 룰렛을 만드는 데에는 치세의 도움도 있었답니다~"
10033010-21 = "돌리는 건 니야 부장이 직접 했지만–"
10033010-30 = "우미카?! 지금 정신을 잃으면 안 됩니다!"
10033010-34 = "사, 사장님도…… 시즈코 부장님도 지금은 안 계시는데, 하필이면 이럴 때 이런 일이……!"
10033010-35 = "하지만 시즈코 부장은…… 트리니티 축제 연구를 위해 출장을 가 계시니……. 우우……!"
10033010-37 = "뭐어~ 이렇게 많은 인원이 모이는 행사를, 가장 많이 주최해 본 동아리 중 하나가 마츠리운영관리부이기도 할 테고~?"
10033010-38 = "그렇게 생각하면 저의 인선도 상당히 합리적이었다는 뜻이 되지 않을지~?"
10033010-39 = "룰렛이었지만–"
10033010-40 = "그런 이유로~ 잘 부탁합니다, 마츠리운영관리부 여러분~"
10033010-41 = "비록 몸은 함께 할 수 없게 되었지만, 마음만은 늘 여러분들 곁에 있는 것으로 생각해 주시면~ 냐하하하~"
10033010-46 = "자, 잠시만요! 니야 님, 니야 님?!"
10033010-47 = "통화가 끊겨 버렸습니다……. 어떻게 하죠, 우미카?"
10033010-48 = "잠시만요, 잠시만……. 우선 심호흡을 하죠."
10033010-49 = "후우. 하아. 후우. 하아……."
10033010-53 = "……어떡하죠. 피나? 심호흡을 해 봐도 모르겠어요……."
10033010-54 = "안 됩니다, 우미카! 이건 거절할 수 밖에 없는 안건입니다! 그렇지요?!"
10033010-58 = "……우미카?"
10033010-59 = "……."
10033010-60 = "아뇨. 아니에요. 피나."
10033010-61 = "이 일은…… 우리가 어떻게든 해내야 해요."
10033010-62 = "네?!"
10033010-63 = "사장님이 자리를 비운 지금…… 우리가 그 이름에 먹칠을 할 수는 없으니까요!"
10033010-64 = "우미카가 말한 그대로, 부장이 없는데도 말입니까? 가능할까요……?"
10033010-65 = "……."
10033010-66 = "으아앙~ 사장님~ 물론 무리라는 건 알지만 지금이라도 돌아와 주세요~"
10033010-69 = "축제를 여는 거에요! 게헨나 학생분들이 백귀야행에 도착하자마자 환영 축제!"
10033010-70 = "숙소에 도착할 때까지 숙박 축제! 이어서 밤샘 축제! 파자마 축제! 축제! 축제! 축제!"
10033010-71 = "우미카! 저도 축제는 무척 좋아하지만. 그래도 시간적으로? 어쩌면 예산? 같은 걸로 어렵지 않을까요?!"
10033010-72 = "축제 조사를 마치고 돌아온 시즈코 부장도 통장에 남은 예산을 보고 깜짝! 놀랄 게 분명합니다!"
10033010-73 = "으으……. 그건 확실히 그럴지도 모르지만, 그럼 뭔가 다른 좋은 방법이……!"
10033010-74 = "그보다는 역시! 여기에서는 협객의 정석으로 시작해서! 영화촌을 활용한 협객 체험!"
10033010-75 = "의리와 우정 체험! 비장함과 각오와 결단의 장 체험! 체험! 체험! 체험! 인 겁니다!"
10033010-76 = "그러면 수학여행이 아니라, 협객 테마파크가 되어버리지 않을까요?! 아니……. 때에 따라선 불가능하지만은 않, 으려나요?"
10033010-77 = "으, 으앙! 저도 막상 좋은 아이디어가 안 떠오릅니다! 우미카!"
10033010-78 = "으으으……. 뾰족한 수가……. 얼른 돌파구를 떠올리지 못하면 이번 수학여행은 끔찍한 사태로……!"
10033010-79 = "이럴 때는 역시……!"
10033010-80 = "또 좋은 생각이라도 있나요, 피나?"
10033010-82 = "동료에게 도움을 요청하는 겁니다! 마침 우리에겐 도움을 줄, 배틀리스트 동료가 있습니다!"
10033010-88 = "배틀, 리스트요?! 잠깐만요, 피나! 같이 가요. 기다려요~!"
10033010-95 = "여긴…… 수행부?"
10033010-96 = "그렇습니다, 우미카! 수행부와는 평소에도 자주 협력하곤 했으니, 분명 이런 사태에도 흔쾌히 손을 내밀어 줄 겁니다!"
10033010-97 = "잠깐만요! 분명 수행부와는 협력 관계를 유지해 오는 중이지만, 그래도……!"
10033010-98 = "(사장님도 계시지 않는데, 이만한 일을 이렇게 처리해도…… 될까요?)"
10033010-99 = "지, 지금이라도 일단 부실로 돌아가서, 좀 더 신중하게 플랜을 세우는 것이……. 그렇게 하지 않으면……."
10033010-100 = "우미카? 무슨 일이라도 있습니까?"
10033010-105 = "어? 마츠리부잖아? 여긴 웬일이야?"
10033010-106 = "이렇게 누군가 나와 버린단 말이에요!?!?"
10033010-107 = "누군가 나와 주면 좋은 것 아닙니까?"
10033010-108 = "어어? 둘 다 왜 그래?!"
10033010-112 = "카에데. 배틀리스트로서……! 부탁이 있어 왔습니다!"
10033010-114 = "저, 저기. 설명도 없이 다짜고짜 그렇게 이야기한다고 해서……."
10033010-115 = "응? 좋아! 자세한 이야기는 안에서 들을게!"
10033010-116 = "이게 또 먹힌다구요?!"
10033010-122 = "흐음, 흐음. 그렇구나. 잘 알았어! 요컨대, 게헨나 학생들이 백귀야행에 놀러 온다는 거네!"
10033010-123 = "간단하게 줄이자면 그런 것입니다, 카에데!"
10033010-124 = "그, 그렇게 쉽게 이야기해도 될 문제가 아니라고 생각하는데요?!"
10033010-125 = "괜찮아, 괜찮아! 너무 복잡하게 생각해도 오히려 길이 보이지 않는 법이니까."
10033010-126 = "그럴 때는 일단 한숨 자고 생각해도 된다고 츠바키 선배가 예전에 말했었어!"
10033010-127 = "그러고 보니 정작 그 츠바키 선배와…… 미모리 선배는 어디에……?"
10033010-129 = "어, 어? 그러니까, 그게……."
10033010-130 = "두 사람에게 무슨 일이라도 있는 건가요, 카에데? 그러고 보니 수행부에 있는 것은 카에데 혼자뿐인 것 같습니다!"
10033010-131 = "아– 그러니까, 우선 미모리 선배는…… 지난주부터 수행 수련을 떠났어."
10033010-135 = "수행?"
10033010-136 = "수련?"
10033010-137 = "응! 그러니까…… 보다 훌륭한 요조숙녀가 되기 위한, 자신과 마주 보는 여행! 같은 거야!"
10033010-138 = "그렇…… 군요……?"
10033010-139 = "응……. 미모리 선배가 그렇게 말할 때는, 아무도 그 진짜 의미를 모른다는 뜻이기도 해……."
10033010-140 = "하지만 츠바키 선배도 나도! 미모리 선배의 뜻을 존중하기로 했으니까! 응!"
10033010-142 = "과연! 동료의 뜻을 존중해서 모든 일을 불문에 부치는 자세…… 이것이야말로 의리! 라는 것이군요!"
10033010-144 = "어, 그런가? 잘 모르겠지만 그런 걸로! 에헤헤……."
10033010-145 = "그, 그러면 미모리 선배는 그런 사정이 있으신 것으로 하고…… 츠바키 선배는요?"
10033010-146 = "츠바키 선배? 아– 뭐어– 그거지. 언제나처럼 낮잠 수행 중이야!"
10033010-147 = "과, 과연. 지금 같은 상황 속에서도 츠바키 선배는 평소와 마찬가지로 수행을 하시는 거군요. 뭔가 표현하기 어렵지만 굉장히 안심이 되네요……."
10033010-148 = "그렇지만 수학여행인가– 좋겠다– 신나겠다– 나도 수학여행 같은 거 가고 싶은데!"
10033010-149 = "어라? 그런데 정작 수학여행에서는 뭘 하는 거지?"
10033010-150 = "피나도 잘은 모릅니다! 하지만 여행이니까 뭔가 신나고 즐거운 일이 아닐까 합니다!"
10033010-151 = "역시 그렇지? 그렇겠지? 역시 피나는 뭘 안다니까! 칭찬 스티커 하나 줄게!"
10033010-152 = "고맙습니다, 카에데!"
10033010-153 = "두 사람……. 이거 우리들이 수학여행을 가는 게 아니라, 오는 분들을 맞이하고 안내해야 하는 일인데요……?"
10033010-154 = "맞아! 그랬었지! 어…… 그런데, 그러면 무엇부터 해야 하는 거야? 누구 아는 사람?"
10033010-155 = "일단 피나는 모르겠습니다!"
10033010-159 = "(……정말로 할 수 있는 걸까? 우리들만으로, 무사히……?)"
10033010-160 = "우미카? 무슨 일이라도 있습니까? 표정이 매우 좋지 않아 보입니다."
10033010-161 = "……이 일, 괜찮을까요? 정말로?"
10033010-162 = "네? 그것은 또 어떤 의미입니까……?"
10033010-163 = "애초에 저희는 사장님이 하시는 일을 거들어 오기만 했을 뿐……. 저희 쪽에서 뭔가를 직접 계획하고 만들어 나간 적은 없었는데……."
10033010-164 = "이만한 이벤트……. 학교와 학교 간의 초대형 이벤트를…… 제대로, 무사히 치러 낼 수 있을까요……?"
10033010-165 = "그것은……."
10033010-167 = "전…… 자신이 없어요. 피나는 어떤가요……?"
10033010-168 = "……그렇게 생각하면, 저 역시……."
10033010-170 = "으아앗! 둘 다 뭐 하는 거야!"
10033010-171 = "카에데?!"
10033010-172 = "이럴 때일수록 망설이기보다 직접 움직여야지!"
10033010-174 = "막연히 땅만 파고 있으면 아무것도 해결되지 않아! 멋진 레이디라면, 기다리는 것보다 나아가 쟁취해야 하는 법이니까!"
10033010-176 = "그렇군요, 카에데! 원하는 것이 있으면 자기 손으로 직접 움켜쥐어라! 협객 영화에서도 자주 나오는 교훈입니다!"
10033010-177 = "그런데…… 그렇지만…… 우리는 무엇부터 시작해야 하는 걸까요……?"
10033010-178 = "어, 어? 그, 그건 그러니까……."
10033010-179 = "지금부터, 다 같이 생각해 보면……?"
10033010-180 = "……."
10033010-181 = "……."
10033010-182 = "역시 모르겠어–!!!"
10033010-183 = "적어도…… 역시…… 시즈코 부장이 계셨더라면!"
10033010-184 = "죄송해요, 사장님…… 저는…… 저희는……."
10033010-185 = "후아암……. 그래서 선생님에게 연락했어……."
10033010-187 = "선배?!"
10033010-188 = "츠바키 부장님!?"
10033010-190 = "선생님께 연락이라니, 무슨 말인가요?! 그보다 여기에는 언제…… 저희들의 이야기는 어떻게……?"
10033010-191 = "웅……. 낮잠 수행 중에, 비슷한 꿈을 꿔서…… 쿠울……."
10033010-193 = "굉장해! 역시 츠바키 선배!"
10033010-195 = "네, 네에……?"
10033010-196 = "괜찮아……. 선생님이라면 분명, 도와줄 테니까……."
10033010-197 = "하암……. 그러면 난 다시 잘게……."
10033010-198 = "잠깐, 잠깐만요! 선생님께는 뭐라고 말씀을……!"
10033010-200 = "코오–"
10033010-202 = "잠들어 버렸습니다!"
10033010-203 = "이건 무언가 큰일이 일어나기 전까지, 구체적으로는 선생님이 도착하기 전까지 깨어나지 않는 패턴?!"
10033010-204 = "어떡하죠……? 이대로 선생님을 기다리는 걸로 정말 괜찮을지……."
10033010-205 = "그럼 일단은 말이야! 나에게 생각이 하나 있는데!"
10033010-207 = "무언가 좋은 아이디어라도 있습니까, 카에데?"
10033010-208 = "카에데!"
10033010-213 = "그…… 무시퀸이라도 하면서, 선생님, 기다리지 않을래……?"
10033010-214 = "카에데~!"
10033010-219 = "[ns1] \"일단 백귀야행으로 와 주었으면 한다는 말을 듣고.\"\n[ns2] \"최대한 빨리 도착하기는 했는데…….\""
10033010-222 = "우아앙~ 선생님~ 정말 기다렸다구~"
10033010-223 = "죄, 죄송합니다. 선생님……. 저희들 때문에, 굳이 여기까지……!"
10033010-224 = "[s] \"그런 건 괜찮은데, 게헨나 학생들의 수학여행이라…….\""
10033010-242 = "서, 선생님? 괜찮으십니까?!"
10033010-243 = "우왓! 선생님이 잠깐 휘청거렸어!"
10033010-244 = "여, 역시 저희들 때문인가요? 그런 건가요?"
10033010-245 = "[s3] \"아니야……. 괜찮아……. 학생들에게는 잘못이 없어…….\"\n[s4] \"이보다 더 한 일도 해 봤으니까, 좋아……!\""
10033010-248 = "혼자 중얼거리더니 스스로 일어섰어……! 역시 어른이라는 거네, 선생님!"
10033010-249 = "[ns] \"우선은, 가장 익숙한 일부터 차근차근히 해 보자.\""
10033010-250 = "그런데, 그게 뭘까요……?"
10033010-254 = "네? 행정 처리 업무? 그거라면 확실히, 사장님이 계실 때에도 많이 분담하긴 했는데요……."
10033010-255 = "알겠습니다, 선생님. 우선 떠오르는 서류 목록부터 정리해 보자는 말씀이시죠?"
10033010-256 = "당장 생각나는 것만 해도……. 기본계획서나 금액 산출 예상서, 견적서와 사업 제안요청서, 일정표와 배치도, 식단표, 종합진단표, 시설 현황표, 수의계약 또는 경쟁계약서……."
10033010-257 = "아, 그것들을 우선 기록해 둔 다음, 아직 음양부에 위탁되어 있을 업무 공조권을, 우선 마츠리운영관리부로 이양받는 것부터 시작하자고요?"
10033010-258 = "네, 네! 그런 거라면 어떻게든, 시작해 볼 수 있을 것 같아요……!"
10033010-259 = "저는……. 그렇군요! 알겠습니다! 상가 여러분들께 게헨나 학생들이 수학여행을 올 거라고 알리는, 홍보를 담당하는 것이로군요!"
10033010-260 = "선생님, 선생님! 그러면 나는? 츠바키 선배는? 응? 수행부는 평소에 순찰을 자주 다니니까……"
10033010-261 = "그 경험을 살려, 백귀야행의 명소를 다시 한번 정리해 보자고? 그러면서 수학여행 코스를 구상하고?"
10033010-263 = "좋았어, 츠바키 선배! 일어나! 수행부가 출동할 시간이라구~!"
10033010-264 = "후아암……. 아직 낮잠 수행이 끝나지 않았는데……."
10033010-265 = "무슨 말을 하는 거야, 츠바키 선배! 선생님도 와 계시다구! 지금부터~ 엄청난 일이 일어날지도 모른단 말야!"
10033010-267 = "여러분……."
10033010-268 = "[ns5] \"무엇부터 시작해야 할지 모를 때에는.\"\n[ns6] \"일단 손에 잡히는 일부터 시작하는 것도 좋아.\""
10033010-271 = "대단하시네요……. 선생님은 이런 상황에 익숙하신 것 같아요……."
10033010-272 = "네? 샬레의 일을 하다 보면, 싫어도 익숙해질 수밖에 없다……? 무언가, 깊은 어둠이 느껴지는 듯한, 아닌 듯한……."
10033010-273 = "……."
10033010-274 = "그래요……. 그렇겠지요. 사장님이 계시지 않는다고, 마냥 풀 죽어 있어서는 아무것도 시작되지 않겠지요."
10033010-275 = "오히려 아무것도 하지 않는 것이야말로 사장님의…… 나아가 저희 마츠리운영관리부의 이름에 흠집을 내는 것이나 다름없는 일일 거예요……!"
10033010-276 = "우미카가 기운을 차린 모양이네!"
10033010-277 = "그렇습니다! 이것으로 일단은 안심! 인 겁니다!"
10033010-279 = "여러분…… 선생님……"
10033010-284 = "좋아요. 알았어요. 저, 결심했어요……!"
10033010-285 = "무슨 일이 일어날지도 모르고, 사장님도 계시지 않지만…… 아직 할 수 있는 일이 있어요. 있을 거예요. 그러니까 가만히 손 놓고 있을 수만은 없어요……!"
10033010-286 = "저는 반드시…… 사장님이 안 계시는 동안, 그 빈 자리를 보완하고……!"
10033010-287 = "이번 게헨나 수학여행 안내 프로젝트를…… 최고의 축제로 만들어 보이겠어요!"
10033010-292 = "(그런데…… 우미카가 너무 기운 넘쳐 보여서…….)"
10033010-294 = "(차마 말을 꺼내지는 못했습니다만……)"
