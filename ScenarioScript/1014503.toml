[translation]
1014503-1 = "วันที่ผ่อนคลายเกินไป..."
1014503-2 = "สวัสดีค่ะ คุณครู!!!"
1014503-3 = "[s1] \"คิซากิ?!?!\"\n[s2] \"คิกิ?!?!\""
1014503-4 = "คิซากิเหรอคะ? นั่นใครกันเหรอคะ? คิกิไม่รู้จักหรอกค่ะ!"
1014503-5 = "ค่ะ! คิกิเองค่ะ!"
1014503-6 = "วันนี้คิกิน่ะ รู้สึกคิกิสุดๆ ไปเลยค่ะ!"
1014503-7 = "[s] \"งั้นเหรอ... ยินดีที่ได้เจอนะ...\""
1014503-8 = "ค่ะ! คิกิก็ดีใจมากๆ ที่ได้เจอคุณครูเหมือนกันค่ะ!"
1014503-9 = "ถ้างั้น คุณครู! วันนี้เราจะเล่นอะไรกันดีคะ?"
1014503-10 = "โอกาสแบบนี้ไม่ได้มีบ่อยๆ คิกิตื่นเต้นสุดๆ เลยค่ะ!!!"
1014503-11 = "[s] \"แล้วคิกิอยากทำอะไรเหรอ...?\""
1014503-12 = "คิกิเลือกได้เหรอคะ?! ถ้างั้น ถ้างั้น..."
1014503-13 = "ก่อนอื่น คิกิอยากไปเล่นริมน้ำค่ะ!!!"
1014503-15 = "ว้าว!!!"
1014503-16 = "คะ? ว่ายน้ำเก่งมั้ยน่ะเหรอคะ? อืม..."
1014503-17 = "จริงๆ แล้วคิกิว่ายน้ำไม่ค่อยเก่งค่ะ! แต่ว่า..."
1014503-18 = "คุณครูก็จะคอยอยู่ด้วยกันนี่คะ ใช่มั้ยล่ะคะ?"
1014503-19 = "[s] \"จ้าๆ...\""
1014503-20 = "ว้าว! คิกิชอบคุณครูที่สุดเลยค่ะ!"
1014503-22 = ""
1014503-23 = ""
1014503-24 = ""
1014503-25 = ""
1014503-26 = ""
1014503-27 = ""
1014503-29 = "(จากนั้นคุณครูก็ตัดสินใจว่าจะคอยเฝ้าดูคิกิ(?) เล่นอย่างระมัดระวัง)"
1014503-30 = "(ในจังหวะที่กำลังคิดแบบนั้น...!)"
1014503-32 = "[ns] \"คิกิ...?\""
1014503-34 = "[ns] (คิกิหายไปจากสายตาแล้ว!!!)"
1014503-36 = "นี่แน่ะ! แอบเผลอแล้วนะคะ!!!"
1014503-37 = ""
1014503-42 = "[ns] \"อึก แค่กๆ?!?!\""
1014503-43 = "อะฮะฮะฮ่า! สำเร็จแล้วค่ะ!"
1014503-44 = "คิกิว่ายน้ำไม่ค่อยเก่งก็จริง แต่มั่นใจเรื่องดำน้ำนะคะ! เป็นยังไงคะ คุณครู? เมื่อกี้เป็นยังไงบ้างคะ?!"
1014503-45 = "[s] \"เจ้า~ ตัว~ แสบ~!!!\""
1014503-46 = "ว้าว! คุณครูทำเป็นโกรธ แล้วเริ่มวิ่งไล่ตามมาแล้ว! ว้ายย!!!"
1014503-48 = "(ในที่สุดคุณครูก็จับตัวคิกิได้... คราวนี้เลยให้ขี่คอสูงๆ เหมือนขึ้นไปบนฟ้า!)"
1014503-49 = ""
1014503-53 = "ว้าว! สูงจัง สูงจังเลยค่ะ!"
1014503-54 = "คุณครู! คิกิอยากเล่นเครื่องบินค่ะ! พาคิกิเล่นเครื่องบินหน่อยค่ะ!"
1014503-55 = "ต้องทำยังไงงั้นเหรอคะ? ง่ายมากค่ะ! แค่ยกคิกิขึ้นแบบนี้..."
1014503-56 = "แล้วโยนขึ้นไปบนฟ้าแรงๆ แล้วก็ค่อยรับไว้ค่ะ!"
1014503-57 = "คะ? ทำแบบนั้นมันอันตรายเกินไป เลยอยากให้คิกิอดใจไว้เหรอคะ? อึก... แต่ว่า..."
1014503-58 = "ก็ได้ค่ะ..."
1014503-59 = ""
1014503-60 = "ค่อยๆ ระวังๆ..."
1014503-61 = ""
1014503-63 = ""
1014503-64 = "ดูสิคะ คุณครู! คิกิจับปลาซิวได้ค่ะ!"
1014503-66 = "(คิกิประคองมือทั้งสองข้างเหมือนจาน แล้วโชว์ปลาซิวที่ว่ายอยู่ในมือให้ดู!)"
1014503-67 = ""
1014503-68 = "ว้าว... ตัวเล็กจิ๋วเลยค่ะ! อะฮะฮะฮ่า! ครีบของปลาซิวจั๊กจี้ฝ่ามือจังเลย! จั๊กจี้ๆ!"
1014503-69 = "ได้ยินว่ามีคนเลี้ยงปลาซิวไว้ในตู้ปลากันเยอะเลยใช่มั้ยคะ? คิกิคิดว่าเริ่มเข้าใจความรู้สึกนั้นแล้วค่ะ!"
1014503-70 = "ถ้างั้น..."
1014503-71 = "ลาก่อนนะ เจ้าปลาซิว ต้องโตขึ้นอย่างแข็งแรงล่ะ เข้าใจมั้ย?"
1014503-72 = ""
1014503-74 = ""
1014503-75 = "ว้าว ดูสิคะ คุณครู! เจ้าปลาซิวว่ายน้ำไปเร็วมากเลยค่ะ!"
1014503-76 = "เอ๋? คิกิก็คิดอยู่ว่าทำไมน่องถึงจั๊กจี้... ที่แท้ก็มีฝูงปลาซิวมาว่ายอยู่ใกล้ๆ นี่เองค่ะ!"
1014503-77 = "นี่พวกเธอ ระวังตัวไว้หน่อยก็ดีนะ? เพราะคิกิอาจจับพวกเธอเหมือนเด็กคนเมื่อกี้ก็ได้นะ?"
1014503-78 = "ว้าว! คุณครู! พวกปลาซิวบอกว่า \"ถึงอย่างนั้น คิกิก็จะปล่อยพวกเรากลับไปใช่มั้ย?\" ด้วยค่ะ! แต่พวกมันพูดถูกนะคะ!"
1014503-80 = "คุณครู คุณครู! ที่นี่มีจักรยานให้เช่าด้วยค่ะ!"
1014503-81 = "คิกิ... อยากขี่จักรยานกับคุณครูค่ะ... ได้มั้ยคะ?"
1014503-82 = "[s] \"จ้าๆ... น่าจะดีต่อสุขภาพด้วยเนอะ...\""
1014503-83 = "ว้าว! ถ้าได้ปั่นจักรยานชมวิวกับคุณครู ต้องสุดยอดมากแน่ๆ เลยค่ะ!"
1014503-85 = "อ๊ะ คุณครู! ดูตรงนั้นสิคะ! มีเด็กๆ เล่นน้ำกันอยู่ค่ะ!"
1014503-86 = "อะไรน่ะ เจ้านั่น เด็กใหม่เหรอ?"
1014503-87 = "น่าจะใช่นะ ถ้างั้นก็ช่วยไม่ได้ ต้องจัด 'พิธีรับน้อง' ให้หน่อยแล้ว!"
1014503-88 = ""
1014503-90 = ""
1014503-91 = "ว้าย?!"
1014503-92 = "จู่ๆ ก็สาดน้ำใส่คิกิเลยเหรอคะ นี่มัน..."
1014503-93 = ""
1014503-95 = ""
1014503-96 = "เป็นการท้าทายสินะคะ!"
1014503-97 = "ป๊อดเหรอ? พวกเรามาถึงที่นี่ก่อนนะ!"
1014503-98 = "ถ้าไม่พอใจ ก็เข้ามาเลย!"
1014503-99 = "คุณครูคะ? คิกิ..."
1014503-100 = "[s] \"ขอบอกไว้แค่อย่างหนึ่งนะ...\""
1014503-101 = ""
1014503-104 = "[ns] \"ห้ามแพ้เด็ดขาด\""
1014503-105 = "...!"
1014503-106 = "ค่ะ!"
1014503-107 = ""
1014503-109 = ""
1014503-110 = "โอ้ กล้าเข้ามาใกล้พวกเรางั้นเหรอ!"
1014503-111 = "ค่ะ! ถ้าไม่เข้าไปใกล้ ก็ชนะศึกสาดน้ำไม่ได้หรอกค่ะ!"
1014503-112 = "งั้นก็ลองเข้ามาใกล้กว่านี้สิ!"
1014503-114 = "(และแน่นอนว่า... คิกิก็เล่นสนุกได้เก่ง สมกับเป็นคิกิจริงๆ)"
1014503-115 = "(หลังจากนั้น ไม่รู้ทำไมถึงได้กลายเป็นหัวหน้าแก๊งเด็กๆ ไปเสียแล้ว...)"
1014503-117 = ""
1014503-118 = "ทำยังไงดีคะ คุณครู...? คิกิอยากกินอันนี้ แล้วก็อยากกินอันนั้นด้วย..."
1014503-119 = "ซื้อทั้งหมดเลยก็ได้งั้นเหรอคะ? แต่ว่าคิกิกินเยอะขนาดนั้นไม่ไหว แล้วถ้ากินเหลือ ทีมดูแลหุบเขาก็จะทำโทษด้วย..."
1014503-120 = "[s] \"ของที่เหลือ คุณครูจะกินให้หมดเอง!\""
1014503-121 = "จริงเหรอคะ? คิกิซื้อของที่อยากกินทั้งหมดได้จริงๆ เหรอคะ??!!"
1014503-122 = "คุณครูนี่สุดยอดที่สุดจริงๆ ค่ะ!!!"
1014503-124 = "(จากนั้นคิกิก็เดินไปทั่วทั้งย่านร้านค้า และซื้อของกินเล่นมาเป็นจำนวนมาก)"
1014503-125 = "(และแน่นอนว่า ทั้งคุณครูและคิกิต้องพึ่งยาช่วยย่อย...)"
1014503-126 = ""
1014503-127 = "ฮู่ว! สุดยอดไปเลยค่ะ!"
1014503-128 = "วันนี้... ต้องเป็นวันที่ลืมไม่ลงแน่ๆ เลยค่ะ!"
1014503-129 = "[s] \"อื้อ... ค่อยยังชั่วนะ\""
1014503-130 = "ขอบคุณที่มาเล่นกับคิกิวันนี้นะคะ คุณครู!"
1014503-131 = "แล้วก็..."
1014503-132 = "..."
1014503-133 = ""
1014503-135 = ""
1014503-136 = "เราเองก็ได้เห็นท่าทีแปลกใหม่ของครูเช่นกัน"
1014503-137 = "น่ารักไม่น้อยเลยล่ะ"
1014503-138 = "[ns] \"...?!?!\""
1014503-140 = "[ns] \"คิซากิ?! จู่ๆ ก็กลับมาเลยเหรอ??!!\""
1014503-141 = "คิซากิเหรอคะ? นั่นใครกันเหรอคะ? คิกิไม่เห็นรู้จักเลยค่ะ!"
1014503-142 = "คิกิน่ะ..."
1014503-143 = ""
1014503-145 = ""
1014503-146 = "เอ๋...?"
1014503-147 = ""
1014503-149 = ""
1014503-151 = "[ns] \"???!!!\""
1014503-154 = "(คุณครูแบกคิซากิขึ้นหลัง แล้วรีบพากลับที่พัก...!)"
1014503-158 = "ช่างน่าละอายเสียจริง ครู..."
1014503-159 = "เฮ้อ... ดูเหมือนว่าเราจะผ่อนคลายมากเกินไปหน่อยน่ะ"
1014503-160 = "[s] \"ไม่เป็นไร... แน่นะ?\""
1014503-161 = "ฮุฮุ อย่ากังวลเกินไปเลย เรารับรู้ถึงสภาพของตัวเองดี"
1014503-162 = "แต่ว่าวันนี้... ดูท่าจะเคลื่อนไหวมากไปกว่านี้ไม่ได้แล้ว"
1014503-163 = "[s] \"จริงเหรอ?\""
1014503-164 = "อืม อย่างน้อยในเวลาเช่นนี้ เราก็อยากให้ครูเชื่อใจเรามากขึ้นอีกหน่อย"
1014503-165 = "หืม? มีอะไรที่ครูทำให้เราได้หรือเปล่างั้นหรือ? เรื่องนั้น..."
1014503-166 = "..."
1014503-167 = ""
1014503-169 = ""
1014503-170 = "ถ้าคุณครูช่วยกล่อม คิกิน่าจะหลับได้สบายขึ้นอีกหน่อยค่ะ..."
1014503-171 = "[s] \"จ้า... เข้าใจแล้ว\""
1014503-172 = "ขอบคุณค่ะ... คุณครู..."
1014503-174 = "(จากนั้น...)"
1014503-175 = "(คุณครูก็จับมือของคิซากิ... จับมือของคิกิไว้ และอยู่ข้างๆ จนกระทั่งเธอหลับไป)"
