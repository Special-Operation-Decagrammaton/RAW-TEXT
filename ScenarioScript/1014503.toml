[translation]
1014503-1 = "……過度放鬆的一天"
1014503-2 = "你好呀，老師！！！"
1014503-3 = "[s1] 「妃姬！？！？」\n[s2] 「妃妃！？！？」"
1014503-4 = "妃姬是誰呀？妃妃不知道耶！"
1014503-5 = "沒錯！是妃妃哦！"
1014503-6 = "今天的妃妃，是妃妃的心情哦！"
1014503-7 = "[s] 「這樣啊……很高興見到你……」"
1014503-8 = "嗯！妃妃也很高興能見到老師！"
1014503-9 = "那麼老師！我們今天要玩什麼呢？"
1014503-10 = "因為這樣的機會很難得，妃妃超期待的哦！！！"
1014503-11 = "[s] 「……妃妃想玩什麼呢？」"
1014503-12 = "可以讓妃妃決定嗎！？#n那麼，那麼……"
1014503-13 = "妃妃想先在溪邊玩水！！！"
1014503-15 = "哇啊──！！！"
1014503-16 = "咦？妃妃會不會游泳？唔嗯……"
1014503-17 = "其實妃妃不太會游泳！但是……"
1014503-18 = "老師會陪著妃妃，對吧？"
1014503-19 = "[s] 「對，對啊……」"
1014503-20 = "哇～！妃妃果然最喜歡老師了！"
1014503-22 = ""
1014503-23 = ""
1014503-24 = ""
1014503-25 = ""
1014503-26 = ""
1014503-27 = ""
1014503-29 = "（就這樣一邊看著妃妃(?)玩耍的模樣，一邊留意是否有意外發生）"
1014503-30 = "（就在這麼想著的瞬間……！）"
1014503-32 = "[ns] 「妃妃……？」"
1014503-34 = "[ns] （妃妃的身影突然消失了！！！）"
1014503-36 = "嘿咿！有破綻！！！"
