1014503-106 = "That's right!"
1014503-107 = ""
1014503-109 = ""
1014503-110 = "Oh? You're coming closer to us?!"
1014503-111 = "Sure am! How else is Kiki supposed to win the ultimate splash battle without coming closer?!"
1014503-112 = "Well then, come as close as you like!"
1014503-114 = "...As expected, Kiki had a great time."
1014503-115 = "Somehow, she emerged as the leader of the other children."
1014503-117 = ""
1014503-118 = "What should Kiki do, Sensei...? Kiki wants to eat that and that and THAT..."
1014503-119 = "Why doesn't Kiki just have it all? But it's too much. Kiki doesn't want to waste food. That would be bad..."
1014503-120 = "[s] \"I'll eat whatever is left over!\""
1014503-121 = "Really? So Kiki can get aaaaanything?"
1014503-122 = "You're the best, Sensei!"
1014503-124 = "So Kiki wandered from shop to shop, grabbing an assortment of snacks."
1014503-125 = "...And of course, we both needed antacids afterward."
1014503-126 = ""
1014503-127 = "Wow! That was amazing!"
1014503-128 = "Kiki...will never forget today! Never!"
1014503-129 = "[s] \"Good... I'm glad.\""
1014503-130 = "Thank you for playing with Kiki today, Sensei!"
