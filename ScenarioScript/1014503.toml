1014503-166 = "..."
1014503-167 = ""
1014503-169 = ""
1014503-170 = "I'd be able to sleep better if you were by my side, Sensei..."
1014503-171 = "[s] \"...Absolutely.\""
1014503-172 = "Thank you... Sensei..."
1014503-174 = "And so, Kisaki..."
1014503-175 = "...I mean, \"Kiki,\" fell soundly asleep as I held her hand."
