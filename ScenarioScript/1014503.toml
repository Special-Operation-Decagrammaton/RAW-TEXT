1014503-42 = "[ns] 「咕嚕咕嚕……！？噗哈！？」"
1014503-43 = "啊哈哈哈！成功了！"
1014503-44 = "妃妃雖然不太會游泳，但是潛水可是很拿手的哦！#n怎麼樣啊，老師？厲害吧？"
1014503-45 = "[s] 「你～這～傢～伙～！！！」"
1014503-46 = "哇啊！老師假裝生氣的樣子追過來了！呀啊──！！！"
1014503-48 = "（好不容易抓住妃妃之後……這次讓他坐在肩上，高高地扛了起來！）"
1014503-49 = ""
1014503-53 = "哇啊！好高哦！"
1014503-54 = "老師！妃妃想要飛高高！請把妃妃抱起來飛高高！"
1014503-55 = "要怎麼做嗎？很簡單哦！#n只要像這樣把妃妃舉起來……"
1014503-56 = "然後朝著天空用力拋起來再接住就可以了！"
1014503-57 = "咦？那樣太危險所以不行嗎？#n唔……可是……"
1014503-58 = "知道了……"
1014503-59 = ""
1014503-60 = "不要急……慢慢來……"
1014503-61 = ""
1014503-63 = ""
1014503-64 = "老師快看！我抓到青鱂魚了！"
1014503-66 = "（妃妃把雙手捧成碗狀，展示了在裡頭游來游去的青鱂魚）"
1014503-67 = ""
1014503-68 = "哇……真的好小哦！啊哈哈哈！好癢哦！牠一直在搔我的手心！"
1014503-69 = "聽說有很多人會把青鱂魚養在魚缸裡面……妃妃好像也能理解那種心情了！"
1014503-70 = "那麼……"
1014503-71 = "再見囉，小魚兒。要健健康康地長大哦？"
1014503-72 = ""
1014503-74 = ""
1014503-75 = "哇，老師你看！牠游得好快哦！"
1014503-76 = "咦？我還在想腳怎麼癢癢的……原來還有另一群青鱂魚在附近游來游去啊！"
1014503-77 = "你們可要小心一點哦？#n妃妃說不定會像剛才一樣，把你們也抓起來唷？"
1014503-78 = "哇，老師！小魚們說「妃妃之後還是會放我們走的對吧？」耶！#n沒錯，妃妃當然會那麼做囉！"
1014503-80 = "老師老師！這裡可以租腳踏車耶！"
1014503-81 = "妃妃……好想和老師一起騎腳踏車哦……可以嗎？"
1014503-82 = "[s] 「好，好吧……反正對身體也有好處……」"
1014503-83 = "好耶～！和老師一起騎腳踏車看風景一定很開心！"
1014503-85 = "啊，老師你看！有小朋友在那邊玩水！"
1014503-86 = "什麼啊，那傢伙。是新來的嗎？"
1014503-87 = "好像是耶。那就得給他來個「新人儀式」了！"
1014503-88 = ""
1014503-90 = ""
1014503-91 = "呀啊！？"
1014503-92 = "突，突然對妃妃潑水的意思……"
1014503-93 = ""
1014503-95 = ""
1014503-96 = "是在下戰帖對吧！"
1014503-97 = "怕了嗎？這裡是我們先來的！"
1014503-98 = "要是不服氣就放馬過來啊！"
1014503-99 = "老師，妃妃……"
1014503-100 = "[s] 「……老師我只說一句。」"
1014503-101 = ""
1014503-104 = "[ns] 「絕對不可以輸！！」"
1014503-105 = "……！"
1014503-106 = "是！"
1014503-107 = ""
1014503-109 = ""
1014503-110 = "哦？居然主動接近，膽子挺大的嘛！"
1014503-111 = "沒錯！打水仗不靠近一點可是贏不了的！"
1014503-112 = "很好！那就儘管上吧！"
1014503-114 = "（……理所當然地，妃妃玩得非常開心）"
1014503-115 = "（後來甚至還莫名變成了孩子們的老大……）"
1014503-117 = ""
1014503-118 = "老師，該怎麼辦……？#n妃妃這個也想吃，那個也想吃……"
1014503-119 = "全部都買下來就好了？#n可是妃妃吃不了那麼多，而且聽說浪費食物的話會被處罰……"
1014503-120 = "[s] 「剩下的食物，老師會全部幫你吃掉的！」"
1014503-121 = "真的嗎！？真的可以把想吃的東西全部買下來嗎！？！？"
1014503-122 = "老師果然最棒了！！！"
1014503-124 = "（於是妃妃便在商店街的各個攤位穿梭，買了相當多的小吃）"
1014503-125 = "（……最後我們兩人理所當然地都需要胃藥）"
1014503-126 = ""
1014503-127 = "呼……！真是太棒了！"
1014503-128 = "今天……肯定會成為妃妃永遠不會忘記的一天！"
1014503-129 = "[s] 「嗯……那真是太好了。」"
1014503-130 = "老師，謝謝你今天陪妃妃玩！"
1014503-131 = "還有……"
1014503-132 = "……"
1014503-133 = ""
1014503-135 = ""
1014503-136 = "老師那鮮為人知的一面，妾身也好好見識了一番啊。"
1014503-137 = "真是意外地惹人憐愛呢。"
1014503-138 = "[ns]「……！？！？」"
1014503-140 = "[ns] 「妃姬！？這麼突然！？！？」"
1014503-141 = "妃姬？那是誰呀？妃妃聽不懂！"
1014503-142 = "所以妃妃──"
1014503-143 = ""
1014503-145 = ""
1014503-146 = "奇怪……？"
1014503-147 = ""
1014503-149 = ""
1014503-151 = "[ns]「！？！？！？」"
1014503-154 = "（急忙背起妃姬回到了房間……！）"
1014503-158 = "……抱歉讓老師見笑了。"
1014503-159 = "呼……看來多少有些過於鬆懈了呢。"
1014503-160 = "[s] 「你身體沒事……對吧？」"
1014503-161 = "呵呵，無需如此操心。#n妾身對自身情況多少有所掌握。"
1014503-162 = "不過今日……恐怕確實無法繼續活動了。"
1014503-163 = "[s]「你確定嗎？」"
1014503-164 = "是啊。至少此時此刻，希望汝能多信任妾身一些呢。"
1014503-165 = "唔呣？老師能為妾身做些什麼？那自然是……"
1014503-166 = "……"
1014503-167 = ""
1014503-169 = ""
1014503-170 = "如果老師願意哄妃妃睡覺的話，妃妃感覺能睡得更安心……"
1014503-171 = "[s] 「……好，我知道了。」"
1014503-172 = "謝謝你……老師……"
1014503-174 = "（於是在妃姬……）"
1014503-175 = "（在妃妃安穩入睡之前，一直守在身邊牽著他的手）"
