1014503-132 = "..."
1014503-133 = ""
1014503-135 = ""
1014503-136 = "It was indeed refreshing to behold you in a new light."
1014503-137 = "Rather \"cute,\" I dare say."
1014503-138 = "[ns] \"...?!\""
1014503-140 = "[ns] \"Kisaki?! Out of nowhere?!\""
1014503-141 = "Kisaki? Who's that? I'm Kiki!"
1014503-142 = "And that means I, uh, Kiki—"
1014503-143 = ""
1014503-145 = ""
1014503-146 = "Huh...?"
1014503-147 = ""
1014503-149 = ""
1014503-151 = "[ns] \"?!\""
1014503-154 = "I scooped up Kisaki and quickly carried her to her room...!"
1014503-158 = "...I am embarrassed beyond words, Sensei."
1014503-159 = "...I may have relaxed a bit too much."
1014503-160 = "[s] \"You're sure you're fine...?\""
1014503-161 = "Fufu. No need to worry. I know my own condition well enough."
1014503-162 = "But I do believe that for today... I won't be moving anymore."
1014503-163 = "[s] \"Really?\""
1014503-164 = "Yes. In moments like these, I ask for you to trust my judgment."
