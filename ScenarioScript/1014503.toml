[translation]
1014503-1 = "……지나치게 긴장이 풀린 하루"
1014503-2 = "안녕하세요, 선생님!!!"
1014503-3 = "[s1] \"키사키?!?!\"\n[s2] \"키키?!?!\""
1014503-4 = "키사키라뇨? 그건 누구인가요? 키키, 잘 몰라요!"
1014503-5 = "네! 키키예요!"
1014503-6 = "오늘 키키는, 키키한 기분이거든요!"
1014503-7 = "[s] \"그래……. 반갑구나…….\""
1014503-8 = "네! 키키도 선생님과 만나서 너무 좋아요!"
1014503-9 = "그러면, 선생님! 오늘은 뭘 하고 놀까요?"
1014503-10 = "이런 기회, 좀처럼 없으니까, 키키는 너무 기대돼요!!!"
1014503-11 = "[s] \"………키키는, 뭘 하고 싶니……?\""
1014503-12 = "키키가 골라도 되는 건가요?! 그러면, 그러면……."
1014503-13 = "키키는 우선, 물가에서 놀고 싶어요!!!"
1014503-15 = "와– 아–!!!"
1014503-16 = "네? 수영 잘하냐고요? 우웅……."
1014503-17 = "사실 키키, 수영 잘 못해요! 그렇지만……."
1014503-18 = "선생님이 계셔 주실 거잖아요. 그렇죠?"
1014503-19 = "[s] \"그래, 그래…….\""
1014503-20 = "와아! 역시 키키는 선생님이 제일 좋아요!"
1014503-29 = "(그렇게, 키키(?)가 노는 모습을 조심하면서 지켜보기로 했다.)"
1014503-30 = "(그렇게 생각하고 있던 순간……!)"
1014503-32 = "[ns] \"키키……?\""
1014503-34 = "[ns] (갑자기 키키의 모습이 사라졌다는 것을 알아차렸다!!!)"
1014503-36 = "에잇! 빈틈이네요!!!"
1014503-42 = "[ns] \"어푸, 어푸?!?!\""
1014503-43 = "아하하하! 해냈어요!"
1014503-44 = "키키, 수영은 잘 못하지만, 잠수는 자신 있거든요! 어떠세요, 선생님? 어땠어요?!"
1014503-45 = "[s] \"요~ 녀~ 석~!!!\""
1014503-46 = "와아! 선생님이 화낸 척하며 따라오기 시작했어요! 꺄아–!!!"
1014503-48 = "(간신히 키키를 붙잡아서…… 이번에는 하늘을 향해 목말을 태워 주었다!)"
1014503-53 = "와아! 높아요, 높아요!"
1014503-54 = "선생님! 키키, 비행기 타고 싶어요! 비행기 태워 주세요!"
1014503-55 = "어떻게 하면 되냐구요? 간단해요! 이대로 키키를 들어서……."
1014503-56 = "하늘을 향해 힘껏 던졌다가, 받아 주시면 돼요!"
1014503-57 = "네? 그건 너무 위험하니까 참아 달라고요? 으우……. 그래도……."
1014503-58 = "알았어요……."
1014503-60 = "조심, 조심……."
1014503-64 = "보세요, 선생님! 송사리 잡았어요!"
1014503-66 = "(키키는 두 손을 접시처럼 만들어, 그 안에 헤엄치고 있는 송사리를 보여 주었다!)"
1014503-68 = "와…… 정말 작네요! 아하하하! 송사리 지느러미가 손바닥을 간지럽히고 있어요! 간지러워요!"
1014503-69 = "송사리를 어항에 기르는 분도 많다죠? 그 기분, 키키도 알 것 같아요!"
1014503-70 = "그러면……."
1014503-71 = "잘 가렴, 송사리야. 건강하게 자라야 한다?"
1014503-75 = "와, 보세요. 선생님! 저렇게 빠르게 헤엄쳐 가고 있어요!"
1014503-76 = "어라? 어째서인지 종아리가 간질간질하다고 생각했는데……. 다른 송사리 떼가 근처를 헤엄치고 있었네요!"
1014503-77 = "너희들 조심하는 게 좋을지도 몰라? 키키, 조금 전 그 아이처럼, 너희들도 붙잡아버릴지도 모르는데?"
1014503-78 = "와아! 선생님! 송사리들이 '키키는 그래도 다시 우리를 놓아줄 거지?'라고 했어요! 물론 그렇게 할 거지만요!"
1014503-80 = "선생님, 선생님! 여기, 자전거를 빌려준대요!"
1014503-81 = "키키…… 선생님과 같이 자전거 타고 싶은데…… 안될까요?"
1014503-82 = "[s] \"그래, 그래……. 분명 건강에도 좋을 거야…….\""
1014503-83 = "와아! 선생님과 같이 자전거에서 경치를 보면, 정말 최고일 거예요!"
1014503-85 = "아, 선생님! 저기 보세요! 아이들이 물속에서 놀고 있어요!"
1014503-86 = "뭐야, 저 녀석. 신입인가?"
1014503-87 = "그런 것 같은데. 그렇다면 어쩔 수 없지. '신고식'을 해 줘야겠어!"
1014503-91 = "꺄앗?!"
1014503-92 = "가, 갑자기 키키한테 물을 끼얹었어요. 이건……."
1014503-96 = "도전인 것이네요!"
1014503-97 = "겁먹었냐? 여긴 우리가 먼저 왔다고!"
1014503-98 = "억울하면 덤벼 보든가!"
1014503-99 = "선생님? 키키는……."
1014503-100 = "[s] \"……한 가지만 말해 두지.\""
1014503-104 = "[ns] \"절대, 지지 마라.\""
1014503-105 = "……!"
1014503-106 = "네!"
1014503-110 = "호오, 가까이 오는 건가. 이 우리에게!"
1014503-111 = "네! 다가가지 않으면 물싸움에서 이길 수 없으니까요!"
1014503-112 = "그러면 어디, 더 가까이 와 보라고!"
1014503-114 = "(……당연하게도, 키키는 역시나 참 잘 놀았다.)"
1014503-115 = "(나중에는 어째서인지, 아이들의 대장이 되어 있었다…….)"
1014503-118 = "어떡하죠, 선생님……? 키키, 이것도 먹고 싶고, 저것도 먹고 싶고……."
1014503-119 = "전부 사면 되는 것 아니냐고요? 하지만 키키, 그렇게 많이는 못 먹고, 음식 남기면 벌을 받는다고 하고……."
1014503-120 = "[s] \"선생님이 남는 건 모두 먹어 줄게!\""
1014503-121 = "정말요? 진짜 먹고 싶은 거 다 사도 돼요??!!"
1014503-122 = "역시 선생님이 최고예요!!!"
1014503-124 = "(그렇게 키키는 상점 거리 여기저기를 돌아다니며, 상당히 많은 간식을 샀다.)"
1014503-125 = "(……당연하게도 우리 모두 소화제가 필요했다…….)"
1014503-127 = "후와! 최고였어요!"
1014503-128 = "오늘은…… 정말로, 잊지 못할 하루가 될 것 같아요!"
1014503-129 = "[s] \"응……. 다행이네.\""
1014503-130 = "오늘 키키와 놀아 주셔서 감사합니다. 선생님!"
1014503-131 = "그리고……."
1014503-132 = "……."
1014503-136 = "선생의 신선한 모습 역시, 잘 보았다."
1014503-137 = "제법, 귀엽더구나."
1014503-138 = "[ns] \"……?!?!\""
1014503-140 = "[ns] \"키사키?! 갑자기??!!\""
1014503-141 = "키사키라뇨? 그건 누구인가요? 키키, 잘 모르겠어요!"
1014503-142 = "그러니까 키키는……."
1014503-146 = "어라……?"
1014503-151 = "[ns] \"???!!!\""
1014503-154 = "(키사키를 업고, 서둘러 방으로 들어갔다……!)"
1014503-158 = "……면목 없구나, 선생."
1014503-159 = "후우……. 조금 지나치게 긴장을 풀었던 모양이야."
1014503-160 = "[s] \"괜찮은 거…… 맞지?\""
1014503-161 = "후후. 너무 걱정하지 말거라. 어느 정도이지만, 내 상태는 내가 알고 있으니."
1014503-162 = "하지만 확실히 오늘은…… 이 이상 움직이는 것은 어려울 듯 하구나."
1014503-163 = "[s] \"정말이야?\""
1014503-164 = "그래. 이럴 때만큼이라도 조금 더, 나를 믿어 주었으면 한다."
1014503-165 = "흠? 선생이 해 줄 수 있는 것이 없느냐고? 그거야……."
1014503-166 = "……."
1014503-170 = "키키, 선생님이 재워 주시면 조금 더 편하게 잠들 수 있을 것 같아요……."
1014503-171 = "[s] \"……그래. 알았어.\""
1014503-172 = "감사합니다……. 선생님……."
1014503-174 = "(그렇게 키사키…….)"
1014503-175 = "(키키의 손을 잡고, 편히 잠들 때까지 자리를 지켰다.)"
