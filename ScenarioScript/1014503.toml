1014503-48 = "I managed to catch Kiki...and hoisted her on my shoulders!"
1014503-49 = ""
1014503-53 = "Wow! Amazing! So high!"
1014503-54 = "Sensei! Kiki wants to fly around! Plane ride time!"
1014503-55 = "What do you mean, \"how\"? It's super simple! You just pick Kiki up..."
1014503-56 = "...throw Kiki in the air, and catch!"
1014503-57 = "What? That sounds too \"dangerous?\" Hrmm... But..."
1014503-58 = "Okay..."
1014503-59 = ""
1014503-60 = "Easy, now. Eaaaasy..."
1014503-61 = ""
1014503-63 = ""
1014503-64 = "Look, Sensei! Kiki caught a fish!"
1014503-66 = "Kiki created a small bowl with her palms and showed me a fish swimming inside!"
1014503-67 = ""
1014503-68 = "Wow... It's so small! Hahaha! The fins tickle!"
1014503-69 = "People raise these in tanks, you know? Kiki...might know the feeling."
1014503-70 = "Now, then..."
1014503-71 = "Bye bye, fishy. Make sure to grow up healthy and strong!"
1014503-72 = ""
1014503-74 = ""
1014503-75 = "Wow, look, Sensei! It's swimming so fast!"
1014503-76 = "Huh? Something tickles... It looks like there's a whole school of them!"
1014503-77 = "You should be more careful, you guys. Kiki might scoop you just like your friend!"
1014503-78 = "Wow, Sensei! The fish told Kiki that they know they'd be let go! And they're right! Kiki let them be free!"
1014503-80 = "Sensei, Sensei! You can rent bikes here!"
1014503-81 = "Kiki would like to ride one with you... Would that be all right?"
1014503-82 = "[s] \"Of course... It's a very healthy activity...\""
1014503-83 = "Yay! Kiki bets sightseeing with you on a bike is going to be amazing, Sensei!"
1014503-85 = "Oh, look! Over there! There are children playing in the water!"
1014503-86 = "Who's that? Some new kid?"
1014503-87 = "Looks like it. There's only one thing to do, then. Let's introduce ourselves!"
1014503-88 = ""
1014503-90 = ""
1014503-91 = "Augh?!"
1014503-92 = "Th-They sprayed Kiki with water! This..."
1014503-93 = ""
1014503-95 = ""
1014503-96 = "...must be a challenge!"
