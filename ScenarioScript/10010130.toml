10010130-125 = "……어……? 이건……?"
10010130-126 = "……카마수트라……잖아요……."
10010130-127 = "……어……."
10010130-128 = "이게……. 이게 왜 지금 선생님 손에……."
10010130-129 = "……????"
10010130-134 = "여러분 정숙! 정숙하세요! 잠시 소란이 있었지만 행사를 다시 시작하겠습니다."
10010130-135 = "중요한 자리란 말입니다. 모두 입가에 케이크를 닦아주세요!"
10010130-139 = "자……. 그럼 다 모이셨죠?"
10010130-141 = "……어……?"
