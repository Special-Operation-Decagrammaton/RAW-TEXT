10010130-93 = "……서, 선생님?"
10010130-96 = "보고합니다. 적 모두 퇴각! 더 이상의 공격이 없습니다. 아군측 피해는 경미!"
10010130-97 = "아직 퇴각 중인 적이 시야 내에 있습니다만……. 쫓을까요?"
10010130-98 = "아뇨. 괜찮습니다. 말씀드렸듯 저희의 목적은 어디까지나 유적 행사장과 내부 인사의 경호."
10010130-99 = "그동안 행사장 안쪽에서 지원 요청도 없었으니……."
10010130-100 = "우선 방어에 성공한 것으로 간주하고, 다시 원위치로 복귀합니다. 자세한 건 다음에 조사하도록 하죠."
10010130-101 = "전원! 원위치 복귀!"
10010130-102 = "원위치 복귀!!"
10010130-107 = "……사라졌다……."
10010130-108 = "언제 그랬었냐는 듯 조용해졌어요……. 이, 이건 대체 무슨 상황이었던 걸까요……?"
10010130-112 = "……?"
10010130-113 = "……어……?"
10010130-114 = "……선생님……?"
10010130-118 = "서, 선생님!? 선생님이 어째서 이곳에……!? 고서관에 계신 거 아니었나요……!?"
10010130-119 = "……네?"
10010130-120 = "생각했던 것보다는 무겁다고요? 그, 그게 무슨 말씀이신지……. 뭐가 무겁다는 거예요?"
10010130-121 = "[s3] \"……이거 말이야. 대신 좀 들어줘.\"\n[s4] 들고 있던 것을 히나타에게 건네준다."
10010130-122 = "……아. 네, 넵."
10010130-123 = "……아. 네, 넵."
