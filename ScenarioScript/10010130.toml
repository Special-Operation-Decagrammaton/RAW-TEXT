[translation]
10010130-1 = "제13화;뿌린 대로 거두리라 3"
10010130-15 = "적 불량배 조직 소탕 중! 전력 자체는 강하지 않습니다, 아니 꽤 약합니다!"
10010130-16 = "그럼 왜 이렇게 시간을 질질 끌고 있는 거야!? 숫자라도 많은 건가!?"
10010130-17 = "그, 그런 거 같기도 하고 아닌 거 같기도 하고……."
10010130-22 = "깜짝이야! 아무튼 어디선가 치료라도 받고 있는 것인지, 이런 식으로 계속 복귀하는지라……."
10010130-23 = "경계를 늦추지 마세요! 목표를 쫓되, 유적으로부터 너무 멀리 벗어나면 안 됩니다!"
10010130-24 = "저희 목적은 고성당 유적과 내부 인사 경호라는 걸 잊지 마세요!"
10010130-26 = "네!!"
10010130-36 = "이, 이게 무슨……. 무슨 일이죠, 대체……!?"
10010130-37 = "어째서 밖에서 불량배분들이……. 이곳을 공격하고 계신 거죠……!? 왜……?"
10010130-41 = "……이 소리는……. 차……? 아니, 트럭……?"
10010130-46 = "자~자! 밖이 소란스럽지만 모두들 진정하세요! 별일 아닙니다!"
10010130-50 = "당신은……!"
10010130-51 = "기다리시는 동안 이거라도 드셔 보시죠. 특별 나눔 코너라고 생각해 주세요!"
10010130-52 = "<미라클 5000 케이크>입니다! 오늘만큼은 한정이 아니라고요! 배포라고요!"
10010130-53 = "여기 있는 모든 분들이 드시고도 열두 통은 남을 만큼 만들어 왔으니까요!!"
10010130-55 = "와서 받아가세요~! 내일부터는 다시 한정이 돼버릴지도 몰라요~!"
10010130-56 = "맛있다고요~. 와서 한 번 드셔 보세요~."
10010130-58 = "바, 방과후 디저트부 여러분들까지……!?"
10010130-59 = "그런데 진짜 될까, 이거……? 여기 있는 사람들……. 나름대로 높은 사람들 아냐?"
10010130-60 = "아무리 한정판 미라클 5000이라지만, 설마 전부 우리처럼 케이크에 환장할 거라고는……."
10010130-65 = "나, 나……! 나부터 하나 줘, 나부터……!"
10010130-66 = "에잇, 저리 비켜! 나부터 먼저!! 이런 기회 아니면 돈 주고도 먹기 어려운 거란 말이야!"
10010130-67 = "지금 새치기하는 거야? 이 사람이 체통은 안 지키고……!"
10010130-68 = "지금 그런 게 중요해!? 미라클 5000이라고!! 일단 먹고 봐야지, 어차피 행사도 잠시 멈췄는데!!"
10010130-72 = "……되는데?"
10010130-73 = "딴청 피울 생각 말고 와서 돕기나 하시지?"
10010130-75 = "……."
10010130-76 = "결국 인간이란 다 똑같은 존재……. 아니, 여기선 오히려 그들의 선택은 틀리지 않다고 생각해."
10010130-77 = "맛있는 것을 먹기 위해 산다. 그것이 인생이기 때문이지."
10010130-78 = "알겠으니까 너도 거들기나 해. 은근슬쩍 빠지지 말고."
10010130-79 = "와서 도우라고!! 둘 다!!"
10010130-80 = "……네."
10010130-82 = "뭐, 뭐죠? 뭡니까 이 상황은……!? 대체 무슨……!"
10010130-83 = "나, 나도……. 나도 미라클 5000……! 나도 한 번도 못 먹어봤는데……!"
10010130-84 = "으으……. 그치만 행사 진행자로서 경전을 지켜야……."
