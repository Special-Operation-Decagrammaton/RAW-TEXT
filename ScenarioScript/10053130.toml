[translation]
10053130-1 = "後日談;鐵處女"
10053130-3 = "所以……"
10053130-15 = "這騷動是怎麼回事？"
10053130-16 = "那個…… 好像是來自首的。"
10053130-17 = "自首？又是什麼莫名其妙的……"
10053130-18 = "聽說是木乃香副局長送來的。"
10053130-23 = "我們決心重新做人！"
10053130-24 = "準確地說是不想再和那種怪物打架了……"
10053130-29 = "那傢伙不是在休假嗎……？"
10053130-30 = "算了，如果是木乃香送來的應該沒錯。"
10053130-31 = "先臨時拘留自首的學生們，調查他們犯了什麼錯再處理。"
10053130-32 = "知道了！"
10053130-36 = "咦？不像平時那樣由環奈局長親自審問嗎？"
10053130-37 = "局長正在接待重要的客人。"
10053130-38 = "重要的客人？誰？"
10053130-43 = "抱歉，外面有點吵。"
10053130-45 = "沒關係，反而很佩服呢，耶嘿嘿……不愧是公安局，女武神的驕傲……"
10053130-46 = "公安局副局長在休假時也確實地在處理工作呢……呵呵。"
10053130-47 = "請不要太調侃了。"
10053130-48 = "說到繁忙，女武神的任何部門都不能說輕鬆。"
10053130-49 = "更何況是被稱為「火歸消防局，人歸矯正局」的兩個部門不是嗎？"
10053130-50 = "謙虛過頭的話反而會讓聽的人也很為難的，矯正局長。"
10053130-56 = "耶嘿嘿……如果其他人也像公安局長一樣這麼想就好了……"
10053130-57 = "要是外面那些人都被送到矯正局的話……"
10053130-62 = "也許會變得更忙一點呢……耶嘿嘿……"
