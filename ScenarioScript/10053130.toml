[translation]
10053130-1 = "후일담;아이언 메이든"
10053130-3 = "……그래서."
10053130-15 = "뭐냐, 이 소동은?"
10053130-16 = "그게…… 자수하러 왔다는 모양입니다."
10053130-17 = "자수? 또 무슨 얼토당토않은……."
10053130-18 = "그게, 코노카 부국장님이 보냈다고."
10053130-23 = "우리는 새사람으로 태어나기로 결심했다고!"
10053130-24 = "정확히는, 그런 괴물 같은 녀석이랑 더는 싸우고 싶지 않은 거지만……."
10053130-29 = "……그 녀석, 휴가라고 하지 않았나?"
10053130-30 = "일단, 코노카가 보낸 거라면, 틀림없겠지."
10053130-31 = "자수한다는 학생들을 임시 구류하고, 어떤 잘못을 저질렀는지 조사하여 대응하도록."
10053130-32 = "알겠습니다!"
10053130-36 = "어라? 평소처럼 칸나 국장님이 직접 심문하지 않는 건가요?"
10053130-37 = "지금 중요한 손님맞이를 하고 계시잖아."
10053130-38 = "중요한 손님? 그게 누군데?"
10053130-43 = "……죄송합니다. 바깥이 소란스러워서."
10053130-45 = "반대로, 감탄했어요. 에헤헤……. 역시 발키리의 자랑, 공안국이라 할까……."
10053130-46 = "공안국 부국장님은 휴가 때도 일 처리가 확실하시네요…… 헤헤."
10053130-47 = "너무 놀리지 말아 주십시오."
10053130-48 = "격무에 있어서는 발키리의 어느 부서도 자유롭다 말할 수 없으니까요."
10053130-49 = "하물며 <불에 떨어지면 소방국, 사람에 떨어지면 교정국>이라 불리는 두 부서 아닙니까?"
10053130-50 = "겸양도 지나치면 듣는 쪽이 괴롭습니다, 교정국장님."
10053130-56 = "에헤헤…… 다른 분들도, 공안국장님처럼 생각해 주면 감사하겠지만요오."
10053130-57 = "바깥에 계신 분들 모두 교정국으로 오시게 된다면……."
10053130-62 = "어쩌면, 조금 더 바빠질지도, 에헤헤……."
