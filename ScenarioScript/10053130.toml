[translation]
10053130-1 = "ย้อนวันวาน;ไอรอน เมเดน"
10053130-3 = "แล้วยังไงต่อ..."
10053130-15 = "นี่มันเรื่องวุ่นวายอะไรกัน?"
10053130-16 = "คือว่า... ดูเหมือนพวกนี้จะเข้ามามอบตัวน่ะค่ะ"
10053130-17 = "มอบตัว? พูดเรื่องอะไรของเธอ..."
10053130-18 = "ได้ยินว่ารองหัวหน้ากรมฯ โคโนกะเป็นคนส่งตัวมาค่ะ"
10053130-23 = "พวกฉันตัดสินใจแล้วว่าจะกลับตัวเป็นคนใหม่!"
10053130-24 = "พูดให้ชัดเจนก็คือ ฉันไม่อยากต่อสู้กับสัตว์ประหลาดแบบนั้นอีกแล้ว..."
10053130-29 = "ยัยนั่นกำลังพักร้อนอยู่ไม่ใช่เหรอ...?"
10053130-30 = "แต่ถ้าโคโนกะเป็นคนส่งตัวมา ก็คงไม่ผิดหรอก"
10053130-31 = "คุมตัวนักเรียนที่เข้ามอบตัวไว้ชั่วคราว แล้วก็สอบสวนว่าทำความผิดอะไร แล้วดำเนินการตามความเหมาะสม"
10053130-32 = "รับคำสั่งค่ะ!"
10053130-36 = "เอ๋? แต่ปกติหัวหน้ากรมฯ คันนะจะสอบสวนเองไม่ใช่เหรอคะ?"
10053130-37 = "ก็ตอนนี้หัวหน้ากรมฯ กำลังต้อนรับแขกคนสำคัญอยู่ไง"
10053130-38 = "แขกคนสำคัญ? ใครเหรอ?"
10053130-43 = "ขอโทษด้วยค่ะ... พอดีข้างนอกเสียงดัง"
10053130-45 = "ฉันกลับประทับใจมากกว่าค่ะ แหะๆๆ... สมแล้วที่เป็นกรมความมั่นคงสาธารณะ นี่ละความภูมิใจของวัลคิรี่..."
10053130-46 = "ต่อให้รองหัวหน้ากรมความมั่นคงสาธารณะจะไปพักร้อน แต่ก็ยังจัดการงานได้อย่างมีประสิทธิภาพเลย#nนะคะ... แหะๆ"
10053130-47 = "ไม่ต้องตกใจขนาดนั้นหรอกค่ะ"
10053130-48 = "ถ้าพูดถึงภาระงานแล้ว ไม่มีหน่วยงานไหนในวัลคิรี่ที่เป็นอิสระได้หรอกค่ะ"
10053130-49 = "ยิ่งเป็นกรมดับเพลิงกับสำนักควบคุม ยิ่งไม่ต้องพูดถึงเลยค่ะ ถึงขนาดมีคำพูดที่ว่ากันว่า <กรมดับเพลิงเรียกตอนไฟไหม้ ตอนเจอคนร้ายเรียกสำนักควบคุม> เลยไม่ใช่เหรอคะ?"
10053130-50 = "การถ่อมตัวที่มากเกินไปก็ทำให้คนฟังรู้สึกลำบากใจได้นะคะ หัวหน้าสำนักควบคุม"
10053130-56 = "แหะๆๆ... ถ้าคนอื่นคิดเหมือนหัวหน้ากรมความมั่นคงสาธารณะบ้างก็น่าจะดีสินะคะ"
10053130-57 = "ถ้าคนที่อยู่ข้างนอกนั่นถูกส่งตัวที่สำนักควบคุมกันทั้งหมดละก็..."
10053130-62 = "พวกฉันอาจจะงานยุ่งขึ้นก็ได้ค่ะ แหะๆๆ..."
