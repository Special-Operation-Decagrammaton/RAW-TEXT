[translation]
10011095-8 = "이, 이즈나, 헤롱헤롱이에요……"
10011095-9 = "우, 우와아앗. 태, 탱크는. 무, 무서워요……"
10011095-10 = "우냐아앙………"
10011095-15 = "서, 선생님…… 부, 부디…… 이, 이부키를………"
10011095-24 = "[ns] \"크윽…… 어때, 미치루. 설 수 있겠어?\""
10011095-25 = "으, 응. 어떻게든……"
10011095-26 = "[s] \"남은 건 우리뿐이야. 어떡할래?\""
10011095-27 = "……난."
10011095-38 = "가자, 선생 공. 약속을, 지키기 위해서……!"
10011095-45 = "드, 드디어 도착했다! 음양부의 부장은?!"
10011095-46 = "어디 있슴까?!"
10011095-51 = "냐하핫~ 모두 수고하시네요~"
10011095-52 = "처음부터, 이곳에 없었다고?!"
10011095-53 = "자아! 공연도 드디어 막바지에 이르러. 마지막에 웃는 이는 누구인가!"
10011095-58 = "하아하아……."
10011095-59 = "후우……."
10011095-60 = "납치된 공주님을 돌려받겠어!"
10011095-65 = "(라고, 말하긴 했지만…….)"
10011095-66 = "[s] \"드디어 궁지까지 몰았어. 미치루. 남은 건 구해내는 것뿐이야.\""
10011095-67 = "(서, 선생 공……! 무, 무슨 말을 하는 거냐고……!)"
10011095-68 = "(정말로 내가……)"
10011095-69 = "(망량즈들을 상대로, 공연을 망치지 않고 공주를 구해낸다고?)"
10011095-71 = "에, 에잇! 다가오지 마! 다가오면……!"
10011095-76 = "납치한 공주를… 인질을 이 울타리 밖으로 던져버릴 테다……!"
10011095-80 = "오오! 전개는 예상치 못한 과격한 국면으로……!"
10011095-81 = "대본이라고는 해도 저 발언, 과연 괜찮을까요~!?"
10011095-82 = "대본이라거나, 방송이라거나! 대체 음양부의 부장! 네놈은 계속 무슨 영문 모를 이야기를……!"
10011095-84 = "(아니아니…… 무리잖아! 애당초! 나 같은 게 구할 수 있겠냐고…… 저 문제아들을 상대로……!)"
10011095-85 = "(생각해 보면…… 여기까지 올 수 있었던 건, 다른 사람들 덕분이고, 나는 단지 기세로 달려왔을 뿐)"
10011095-86 = "(미처 생각해두지 않았어. 구한다. 구해야 한다고 떠든 주제에…… 정작 여기까지 와서 어떻게 구할지. 그 방법 같은 건 전혀……!)"
10011095-87 = "(뭐냐고……! 정식 동아리가 되고 싶다고! 그래서 포기할 수 없다고 말하고! 츠쿠요에게까지…… 그런 격려를 받은 주제에! 여기까지 왔는데……!)"
10011095-90 = "오오, 최후의 도전자. 무엇을 고심하는지- 신중하게 말을 고르는 모습이네요~!"
10011095-92 = "(그야 고민하는 게 당연하잖아! 한 발자국이라도 잘못 내디디면, 전부 끝나버리는 상황이라고?!)"
10011095-93 = "(……다리가 떨려. 심장이 쿵쾅거려……! 이젠 뭐가 뭔지도 전혀!)"
10011095-94 = "(이런 상황에서 이부키는? 나도 이런데, 불만 꺼져도 울던 그 아이는, 엄청나게 무서워하고 있는 거……)"
10011095-95 = "……닌자 언니?"
10011095-96 = "아……! 이부키!"
10011095-97 = "응! 닌자 언니! 이부키! 여기 얌전히 있었어!"
10011095-98 = "……어라, 이부키…… 울고 있지 않았어?"
10011095-99 = "응? 왜애?"
10011095-100 = "그야, 나, 납치된 공주님 역할이니까. 혹시 엄청 무서워하진 않을까- 하고. 그게……."
10011095-101 = "무섭지 않았는걸! 왜냐하면……"
10011095-107 = "<그 어떤 상황이라도 닌자가 구해줄 거라고!> 약속했으니까!"
10011095-108 = "아……!"
10011095-110 = "<그 어떤 상황이라도 닌자가 공주님을 구해주러 가겠다>고요!"
10011095-115 = "알았어! 이부키! 지금 바로 구해줄 테니까……!"
10011095-118 = "거기 멈춰! 섣불리 움직이면 진짜 어떻게 될지 모른다니까!"
10011095-119 = "거짓말 아냐! 정말로……!"
10011095-125 = "아, 놓쳐버렸다."
10011095-127 = "[ns] \"이부키! 위험해!\""
10011095-132 = "(놓칠까 보냐………!)"
10011095-133 = "(하나……! 두울……!)"
10011095-135 = "미치루류 인법……!!!"
10011095-138 = "잡았어!! 선생 공!"
10011095-139 = "[s] \"잘했어! 미치루! 나도 바로잡아서 끌어올려 줄 테니까!\""
10011095-140 = "앗! 이부키! 잡혀버렸어!"
10011095-141 = "응! 이대로 선생 공과 함께 힘으로 끌어올리면……!"
10011095-145 = "아."
10011095-149 = "우갸아아악! 떨어진다! 떠, 떨어……!!"
10011095-150 = "이즈나 쨩!!"
10011095-151 = "네! 츠쿠요 공!"
10011095-163 = "느, 늦지 않게 잡아챘어요!"
10011095-164 = "주군! 이대로 이즈나가 끌어올릴 테니까요!"
10011095-165 = "[s] \"모두…… 고마워.\""
10011095-167 = "으아아아…… 주, 죽는 줄 알았어어어……… 흐에에엑………"
10011095-168 = "아! 이부키! 괜찮아?!"
10011095-169 = "응! 정말로 구해주러 왔네! 닌자 언니들!"
10011095-170 = "……그야."
10011095-172 = "네! 약속했으니까요! 닌자의 철칙으로!"
10011095-173 = "인법연구부의 승리예요! 닌닌!"
10011095-175 = "저기…… 이거 아무래도……."
10011095-176 = "전부 끝난 거 같지 말임다."
10011095-177 = "아, 아니……! 이대로 모든 계획을 실패할 수는……!"
10011095-179 = "……거기, 스톱."
10011095-184 = "이부키를 멋대로 끌어들인 죄. 그냥 넘어가지 않을 거예요."
10011095-186 = "히이익?!"
