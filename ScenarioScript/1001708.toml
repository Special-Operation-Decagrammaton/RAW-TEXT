[translation]
1001708-1 = "악몽"
1001708-2 = "으헤…… 푸딩이 하나, 푸딩이 두 개……."
1001708-3 = "허윽?!"
1001708-7 = "붉은겨울 학원 사무국 집무실"
1001708-8 = "으음…… 업무 시간 중에 깜빡 졸았나."
1001708-9 = "최근의 격무로 인해 피로가 쌓인 모양이군. 아무래도 낮잠 시간을 더 늘려야겠어."
1001708-10 = "그나저나 얼마나 오래 자고 있었던 거지? 어디 보자, 시간이……."
1001708-13 = "……오후 5시라고? 오후 간식 시간이 한참 지났지 않는가!"
1001708-14 = "아무리 이 몸이 자고 있었다 하더라도 저들끼리만 간식 시간을 즐기다니, 이는 용서할 수 없는 일이야!"
1001708-15 = "친위대! 친위대는 어디에 있느냐!"
1001708-18 = "으으, 시끄러워! 정숙해야 할 사무국 내에서 누가 이렇게 시끄럽게 떠드는 거야?"
1001708-19 = "뭐, 뭣이라?! 시끄럽다니, 이 체리노 님께 그 무슨 무례한 말투란 말인가!"
1001708-20 = "네 녀석을 화장실 청소 한 달 형에 처하겠다!"
1001708-21 = "……이 꼬맹이는 누구지?"
1001708-22 = "꼬, 꼬맹이?!"
1001708-23 = "네 녀석! 이 몸을 알아보지 못하는 거냐!"
1001708-24 = "이 몸은 붉은겨울 학원의 서기장이자 학생회장이자, 미화부장이자, 청소부장인…… 체리노 님이시다!"
1001708-25 = "뭐? 너 같은 꼬맹이가 붉은겨울 학원의 회장일 리가 없잖아?"
1001708-26 = "어째서 믿지 않는 것이냐! 벽에 걸린 이 초상화만 보아도……."
1001708-30 = "어, 없잖아?"
1001708-31 = "이 몸의 초상화가 없어졌어!"
1001708-33 = "복도에 전시된 동상도……."
1001708-36 = "이 몸을 찬양하는 선전물도…… 모두 흔적도 없이 사라졌어!"
1001708-38 = "이게 어찌된 일이지? 자는 사이에 혁명이라도 일어난 것인가?"
1001708-39 = "(………….)"
1001708-41 = "콤라드! 마침 잘 와주었구나!"
1001708-42 = "그, 그대는 내가 누군지 잊지 않았겠지? 붉은겨울 학원의 서기장이자 학생회장인 이 몸을 잊지는 않았겠지?"
1001708-43 = "(………….)"
1001708-44 = "어, 어째서 처음 본다는 표정을 짓는 것이냐! 정말 그대까지 이 몸을 잊은 것이냐?!"
1001708-45 = "기억해! 기억해내라고!"
1001708-46 = "(………….)"
1001708-48 = "기억해…… 기억하라고……."
1001708-50 = "[s] \"……체리노?\""
1001708-51 = "……으헉?!"
1001708-52 = "여, 여기는?"
1001708-53 = "[s] \"무슨 잠꼬대를 그렇게 심하게 하는 거야?\""
1001708-54 = "꾸, 꿈이었나…… 휴우, 다행이다……."
1001708-55 = "저, 정말 끔찍한 꿈이었어. 친위대는 물론이고 콤라드까지 이 몸을 기억하지 못한다니……."
1001708-56 = "두려움을 모르는 이 몸조차도 그 상황에서는 아연실색하고 말았을 정도라네."
1001708-57 = "[s] \"꿈이라 다행이네.\""
1001708-58 = "……아니, 전혀 괜찮지 않아!"
1001708-59 = "다른 사람이라면 몰라도 어떻게 콤라드, 그대가 이 몸을 잊을 수 있단 말인가!"
1001708-60 = "[s] \"하지만 그건 체리노의 꿈이었을 뿐이잖아?\""
1001708-61 = "꿈속이라 하더라도 콤라드는 콤라드!"
1001708-62 = "꿈속의 콤라드가 저지른 일의 대가로 최고급 푸딩을 요구하는 바이니라!"
1001708-63 = "[s] \"부조리해…….\""
1001708-65 = "(……이후, 토라진 체리노를 달래주느라 한동안 애를 먹었다.)"
