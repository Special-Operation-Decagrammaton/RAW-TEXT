[translation]
10052130-1 = "예소드. 기초 위에 올라선 힘의 정화자"
10052130-4 = "위치 확보."
10052130-5 = "네, 에이미. 위치 확보. 이제부터 저 위로 올라가야 하는 것이군요."
10052130-6 = "……."
10052130-7 = "그런데 저걸 뭐라고 해야 할까요?"
10052130-8 = "글쎄? 성벽?"
10052130-9 = "네. 그게 가장 직관적인 표현인 것 같습니다."
10052130-10 = "예소드였지, 이 예언자."
10052130-13 = "도착하자마자 성대하게 환영식을 받았죠."
10052130-14 = "응. 어떻게든 한번 물러나게 했지만……."
10052130-17 = "……말 그대로, 성벽의 수호자라는 느낌이었지."
10052130-18 = "그 패스path와 이명은 완전히 달랐지만 말이죠."
10052130-19 = "그거, 뭐였더라?"
10052130-20 = "패스path는 <완성을 향해 나아가는 진리>."
10052130-21 = "그리고 이명은 <기초 위에 올라선 힘의 정화자>."
10052130-22 = "……그런 거 다 외우고 다녀?"
10052130-23 = "특별히 할 일도 없지 않습니까."
10052130-24 = "뭐……?"
10052130-25 = "죄송합니다. 실언이었군요. 사실 다들 할 일이 너무 많아서 쓰러질 지경이지요."
10052130-26 = "토키, 또 반사적으로 농담 같은 대답 했구나? 그러다 눈치 없다고 미움받을지도 몰라?"
10052130-27 = "그렇군요. 주의하겠습니다, 에이미. 그리고 반사적으로 농담한 것은 맞습니다."
10052130-28 = "……무서우니까요."
10052130-29 = "……토키도, 무섭다고 생각해?"
10052130-30 = "에이미는요?"
10052130-34 = "나도 무서워."
10052130-35 = "남들은 나를."
10052130-36 = "우리를."
10052130-37 = "어딘가 태연하고 엉뚱한 학생처럼 생각할지도 모르지만……."
10052130-38 = "느낄 건 다 느끼지."
10052130-39 = "귀찮은 건 싫고, 게으름도 부리고 싶고."
10052130-40 = "그렇습니다. 저도 가능하면 선생님과 같이 감자칩을 먹으며, 인터넷 방송이라도 보고 싶습니다."
10052130-41 = "인터넷 방송이라니, 그건 또 뭐야?"
10052130-42 = "저, 취미 찾는 중이잖습니까?"
10052130-43 = "이른바 임시 취미라는 것이죠. 브이."
10052130-44 = "……임시?"
10052130-45 = "맞습니다. 지금은 인터넷 방송에 조금 흥미가 가는 중입니다만, 어디까지나 임시이기에 금방 또 바뀔 수도 있겠지요."
10052130-46 = "임시 취미 같은 거 또 있어?"
10052130-47 = "음. 역시 게임일까요. 아리스와 노는 것은 즐겁습니다."
10052130-48 = "만화도 그럭저럭이더군요. 보다 보니 조금 알았습니다. 재미라는 것은 어느 정도 비합리성과 비효율성을 내포한다는 것을 말이죠."
10052130-49 = "만화, 게임……. 왠지 그럴 거 같더라."
10052130-50 = "아무튼, 나도 싸우는 걸 좋아하는 건 아니야. 다른 방법으로 해결하는 게 언제나 효율적이잖아?"
10052130-51 = "그냥, 다 적당히 잘 지냈으면 좋겠는데 말이지."
10052130-52 = "하지만 이런 상황에서는 잘 안될 것 같네요. 무엇보다 앞서 말씀드렸던 것처럼, 저는 두렵습니다."
10052130-53 = "만에 하나 무슨 일이 일어나서, 선생님이나 제가 내일을 바랄 수 없게 된다거나, 더…… 말로 하기 힘든 일이 일어난다거나……."
10052130-54 = "그런 것을 생각하는 것만으로도, 숨이 막힐 것 같습니다."
10052130-55 = "나는?"
10052130-56 = "저나 선생님보다는 조금 아래겠네요."
10052130-57 = "……진심?"
10052130-58 = "그럴 리가요. 사람 목숨에 어떻게 위아래가 있다는 겁니까."
10052130-59 = "그래……. 고마워."
10052130-60 = "저는 가능하다면 누구도 다치지 않았으면 합니다."
10052130-61 = "지금을 살아가는 누구든, 너무 힘들거나 고통스럽지는 않았으면 합니다."
10052130-62 = "그건 좀 많이 어려운 일이지."
10052130-63 = "그래서 다들, 자기가 아는 사람들만이라도 무사하길 바라는 거고. 참 생각해 보면, 겁나는 것투성이란 말이지."
10052130-64 = "부장 혼자만으로도 가끔 버거운데, 이젠 회장에다가……."
10052130-65 = "……선생님도, 너무, 걱정이야."
10052130-66 = "역시 언제 날 잡아서, 선생님을 밀레니엄 특제 밀실에 가둬 버릴까."
10052130-67 = "그게 선생님의 안전을 보장하는, 가장 효율적인 방식일지도 모르는데."
10052130-68 = "밀레니엄발 키보토스 대전이라도 일으킬 생각인가요, 에이미."
10052130-69 = "좋습니다. 그렇게 되면 저는 떳떳하게 최전선에 서도록 하겠습니다."
10052130-70 = "……농담이야."
10052130-71 = "저도 그렇습니다."
10052130-72 = "토키의 농담은 구분이 잘 안된단 말이지……."
10052130-73 = "그런가요. 하지만 배웠습니다."
10052130-74 = "상황이 힘들고 위험할수록."
10052130-75 = "오히려 더 농담을 하고 의미 없는 소리를 하고, 실없는 이야기를 하면서 의미 없이 웃거나 장난을 치거나……."
10052130-76 = "그렇게 하지 않으면, 버티기 어려운 것이라고요."
10052130-77 = "그러면 평소에 뜬금없이 뻔뻔한 소리를 하는 것도 그 연장선상이야?"
10052130-78 = "아뇨. 그건 그냥 떠오르는 대로 이야기하는 건데요."
10052130-79 = "……진짜, 토키답네."
10052130-88 = "에이미, 토키. 들려? 이쪽은 준비 완료야. 먼저 돌입하면, 우리가 움직임을 맞출게."
10052130-89 = "드디어 마지막이 보이네요. 이런 때가…… 오긴 오는군요."
10052130-90 = "사실상 이게 마지막 예언자인 거지?"
10052130-91 = "정확히는 둘이 더 있기는 해. 강철대륙 그 자체라는 네차흐와……."
10052130-92 = "말쿠트……."
10052130-93 = "으으으……. 우, 우리가 다시 싸울 수 있을까? 이번에는…… 이길 수 있을까……?"
10052130-94 = "할 수 있을 겁니다, 유즈! 우리 모두 새로운 무기와 갑옷을 얻은 상태고, 케이도 잔뜩 레벨업을 해 왔으니까요!"
10052130-95 = "네……. 예전만큼 비관적이지는 않겠죠. 우리도 적 예언자들의 힘을, 제법 많이 활용할 수 있게 된 상태고요."
10052130-98 = "정말로, 때가 됐다는 느낌이네."
10052130-99 = "네. 그렇군요."
10052130-104 = "제가 먼저 움직이도록 하죠. 이번은 제가 선봉이니까요."
10052130-105 = "평소와는 달리, 무장도 옷도 가벼워져서 좋군요."
10052130-108 = "응. 토키가 시선을 끌고, 그사이에 후속 부대가 강하하는 작전이었으니까."
10052130-109 = "[ruby=Operation Steel Rain]<강철의 비 작전>[/ruby] 이었던가……."
10052130-112 = "에이미는 반대로 최후방 화력 지원이었죠?"
10052130-113 = "맞아. 나는 어떤 포지션이든 적응할 수 있으니까. 나를 가장 효율적으로 사용한다면 그것으로 만족해."
10052130-114 = "네. 그러면 잘 부탁합니다. 다치지 마세요. 에이미."
10052130-115 = "무사히, 다시 만나죠."
10052130-118 = "그래. 토키도."
