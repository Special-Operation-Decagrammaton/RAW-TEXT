[translation]
2601606-1 = "NC, ND"
2601606-2 = "ปิดท้ายข่าวพิเศษด้วย..."
2601606-3 = "เรื่องชวนฮือฮาของคุณครูอีกสักนิด ก็น่าจะดีนะคะ!"
2601606-4 = ""
2601606-6 = ""
2601606-7 = "[ns] \"ว่าแล้วเชียว เป้าหมายคือเรื่องนั้นสินะ!!\""
2601606-8 = "ไม่ใช่ๆๆ! ไม่ถึงกับเป็นเป้าหมายหรอกค่ะ การเก็บข้อมูลเป็นแค่ขั้นตอนหนึ่งเท่านั้นเอง!"
2601606-9 = "เพราะงั้น มีเรื่องน่าสนใจเกิดขึ้นบ้างมั้ยคะ? อย่างคนที่คุณครูสนใจอยู่ อะไรแบบนี้น่ะค่ะ!"
2601606-10 = "หรือจะให้ถ่ายรูปตอนโพสท่าแปลกๆ ก็ได้นะคะ? อะไรก็ได้ค่ะ!"
2601606-11 = "[s] \"ข่าวธรรมดาๆ เรียบๆ ไม่ต้องปรุงแต่งก็พอแล้ว!\""
2601606-12 = "บทความพิเศษต้องเติมเครื่องปรุงลงไปนิดๆ หน่อยๆ ถึงจะอร่อยนะคะ!"
2601606-13 = "ชิ..."
2601606-14 = "[s1] \"ครูจะทำงานที่เอามา จิอากิก็ตรวจแก้ต้นฉบับให้เรียบร้อยนะ\"\n[s2] \"ไม่ยอมให้เอาไปทำสกู๊ปพิเศษหรอก!\""
2601606-17 = "ไม่เห็นจะเสียหายตรงไหนเลย!"
2601606-18 = "[s] \"เสียหายไปแล้วเหอะ!! ชื่อเสียงเอย!! ศักดิ์ศรีเอย!!\""
2601606-19 = "อะฮ่า!"
2601606-22 = "(คุณครูเริ่มทำงานในโน้ตบุ๊กไปเรื่อยๆ)"
2601606-23 = "(จิอากินั่งแก้มป่องอยู่ข้างๆ พลางจ้องเขม็ง)"
2601606-24 = ""
2601606-26 = ""
2601606-27 = ""
2601606-29 = ""
2601606-30 = "ขอโทษที่รบกวนตอนทำงานนะคะ..."
2601606-31 = "นึกว่าตอนตั้งใจทำงานจะมีสีหน้าตลกๆ ให้เห็นบ้าง แต่ไม่เปิดช่องให้เลย..."
2601606-32 = "[s] \"ครูไม่ยอมให้จับไปเป็นสกู๊ปพิเศษหรอก!\""
2601606-33 = "ชิ..."
2601606-34 = "อืมม..."
2601606-35 = ""
2601606-37 = ""
2601606-38 = "!"
2601606-39 = ""
2601606-41 = ""
2601606-42 = "อ่าา คุณครู! ฉันทำเหรียญตกใต้โต๊ะค่ะ!"
2601606-43 = "ช่วยเก็บให้หน่อยได้มั้ยคะ? มันกลิ้งไปทางคุณครูแล้วค่ะ!"
2601606-44 = "[s3] \"หืม? ได้สิ!\"\n[s4] มุดลงไปใต้โต๊ะ"
2601606-47 = "ติดกับแล้วสินะคะ!"
2601606-49 = "ฮึบ!"
2601606-52 = "― [log=치아키 수영복]ฮุฮุ! ได้โอกาสแล้ว! กดชัตเตอร์! [/log][wa:1910] "
2601606-55 = "― [log=치아키 수영복]อ๊ะ! คุณครู ขดตัวเล็กเชียว...[/log][wa:1270] "
2601606-57 = "― [log=치아키 수영복]อันนี้เป็นองค์ประกอบภาพที่เหมาะกับหน้าปกสุดๆ เลยค่ะ![/log][wa:10] "
2601606-60 = "― [log=치아키 수영복]ฮุฮุฮุ! [/log][wa:430] "
2601606-62 = "― [log=치아키 수영복]ถ้าไม่มีสกู๊ปพิเศษ ก็สร้างขึ้นมาเองได้ค่ะ![/log][wa:500] "
2601606-65 = "[ns] \"จะ... จิอากิ?! แล้วเหรียญล่ะ?\""
2601606-67 = "― [log=치아키 수영복]แหมๆๆๆๆ! ใสซื่อจริงๆ นะคะ![/log][wa:3440] "
2601606-69 = "― [log=치아키 수영복]ของที่ทำตกคือฝาขวดนี้ต่างหากค่ะ![/log][wa:1200] "
2601606-72 = "― [log=치아키 수영복]อย่างที่ว่าเลยค่ะ ไม่ได้ใช้เงินสักเหรียญ ก็สร้างภาพล้ำค่าออกมาได้เลยนะคะ![/log][wa:140] "
2601606-75 = "― [log=치아키 수영복]คุณครูที่ทำตัวไม่สนุก ต้องรับโทษ 'ขังใต้โต๊ะ' ค่ะ![/log][wa:3340] "
2601606-78 = "― [log=치아키 수영복]ถ้าบอกความลับที่สนุกกว่านี้ [/log][wa:960] "
2601606-80 = "― [log=치아키 수영복]ฉันอาจยอมปล่อยให้ก็ได้นะคะ? [/log][wa:2440] "
2601606-83 = "― [log=치아키 수영복]หืม? เป็นอะไรหรือเปล่าคะ?[/log][wa:320] "
2601606-85 = "― [log=치아키 수영복]หลบสายตาด้วย...[/log]"
2601606-88 = "[ns] \"คือว่า... ไม่รู้จะมองไปทางไหนน่ะ...\""
2601606-90 = "― [log=치아키 수영복]ยังอยู่ระหว่างสัมภาษณ์ค่ะ![/log][wa:90] "
2601606-92 = "― [log=치아키 수영복]ต้องมองตรงมาทางนี้สิคะ![/log]"
2601606-95 = "― [log=치아키 수영복]ทำไมถึงไม่มองมาทางนี้ล่ะคะ?[/log]"
2601606-98 = "― [log=치아키 수영복]อ๊ะ นี่มัน...![/log][wa:1100] "
2601606-101 = "― [log=치아키 수영복]ว้ายยย! [/log][wa:4430] "
2601606-103 = "― [log=치아키 수영복]หะ! ห้ามมองนะคะ! [/log][wa:450] "
2601606-106 = "― [log=치아키 수영복]ห้ามออกมาด้วย![/log][wa:760] "
2601606-108 = "― [log=치아키 수영복]อยู่นิ่งๆ เลยค่ะ![/log]"
2601606-111 = "(หลังจากนั้นคุณครูก็ติดอยู่ใต้โต๊ะจนคนรอบๆ เริ่มน้อยลง)"
2601606-112 = "(จิอากิบอกว่าเพิ่งนึกขึ้นได้ว่ามีธุระด่วนแล้วรีบหนีไป)"
