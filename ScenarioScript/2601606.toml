[translation]
2601606-1 = "NC, ND."
2601606-2 = "作為特輯報導的收尾──"
2601606-3 = "只要再加上一點老師的刺激題材就好了呢！"
2601606-4 = ""
2601606-6 = ""
2601606-7 = "[ns] 「果然，那才是目的吧！！」"
2601606-8 = "不不不～！還稱不上是目的，採訪終究只是過程啦！"
2601606-9 = "所以說，有沒有發生什麼有趣的事？像是在意的人之類的！"
2601606-10 = "或是讓我拍幾張奇怪姿勢的照片？什麼都好哦！"
2601606-11 = "[s] 「平淡清爽的報導就夠了啦！」"
2601606-12 = "特輯就是要偷偷加點料才對嘛！"
2601606-13 = "呿～"
2601606-14 = "[s1] 「我來處理帶來的工作，千秋也去做最後的校對吧。」\n[s2] 「獨家新聞我是不會給的！」"
2601606-17 = "又不會少一塊肉～！"
2601606-18 = "[s] 「會少啦！！像是名譽！！尊嚴！！之類的！！」"
2601606-19 = "啊哈～！"
2601606-22 = "（用筆電處理帶來的工作）"
2601606-23 = "（千秋在旁邊鼓著臉頰，直盯著這邊看）"
2601606-24 = ""
2601606-26 = ""
2601606-27 = ""
2601606-29 = ""
2601606-30 = "抱歉在你工作的時候打擾……"
2601606-31 = "還以為你專心時會露出什麼有趣的表情，結果完全沒有破綻呢……"
2601606-32 = "[s] 「我是不會成為硬湊出來的獨家新聞的！」"
2601606-33 = "呿～"
2601606-34 = "唔嗯～"
2601606-35 = ""
2601606-37 = ""
2601606-38 = "！"
2601606-39 = ""
2601606-41 = ""
2601606-42 = "啊啊～老師！我的硬幣掉到桌子底下了！"
2601606-43 = "可以幫我撿一下硬幣嗎？滾到老師那邊去了！"
2601606-44 = "[s3] 「嗯？好啊！」\n[s4] 鑽進桌子底下"
2601606-47 = "上鉤了呢！"
2601606-49 = "嘿～！"
2601606-52 = "― [log=치아키 수영복]呵呵！有破綻！快門時機！[/log][wa:2710] "
2601606-55 = "― [log=치아키 수영복]啊哈！老師，縮成小小一團……[/log][wa:1870] "
2601606-57 = "― [log=치아키 수영복]這是適合拿來當封面的構圖呢！[/log][wa:980] "
2601606-60 = "― [log=치아키 수영복]哼哼～！[/log][wa:590] "
2601606-62 = "― [log=치아키 수영복]沒有獨家新聞的話，只要做一個就行了！[/log][wa:1460] "
2601606-65 = "[ns] 「千，千秋！？比起這個，硬幣呢？」"
2601606-67 = "― [log=치아키 수영복]嘖嘖嘖嘖嘖～！太天真了！[/log][wa:4000] "
2601606-69 = "― [log=치아키 수영복]掉下去的是這個的瓶蓋！[/log][wa:2040] "
2601606-72 = "― [log=치아키 수영복]名副其實沒花半毛錢就換來了精彩的場面呢！[/log][wa:2260] "
2601606-75 = "― [log=치아키 수영복]不有趣的老師要被處以「關在桌子底下之刑」！[/log][wa:4500] "
2601606-78 = "― [log=치아키 수영복]要是你告訴我更有趣的題材，[/log][wa:1560] "
2601606-80 = "― [log=치아키 수영복]我也不是不能放你出來哦？[/log][wa:3080] "
2601606-83 = "― [log=치아키 수영복]咦，怎麼了嗎？[/log][wa:1040] "
2601606-85 = "― [log=치아키 수영복]為什麼移開視線……[/log]"
2601606-88 = "[ns] 「那個……我不知道眼睛該往哪裡看……」"
2601606-90 = "― [log=치아키 수영복]還在訪問中哦！[/log][wa:850] "
2601606-92 = "― [log=치아키 수영복]請好好看著這邊！[/log]"
2601606-95 = "― [log=치아키 수영복]為什麼不看我這邊呢～？[/log]"
2601606-98 = "― [log=치아키 수영복]啊，這個……！[/log][wa:1380] "
2601606-101 = "― [log=치아키 수영복]呀啊啊啊！[/log][wa:4550] "
2601606-103 = "― [log=치아키 수영복]等一下！不可以看！[/log][wa:770] "
2601606-106 = "― [log=치아키 수영복]出來也不行！[/log][wa:1080] "
2601606-108 = "― [log=치아키 수영복]請待著別動！[/log]"
2601606-111 = "（之後一直被困在桌子底下，直到周圍的人變少）"
2601606-112 = "（千秋說想起了急事，便慌慌張張地逃走了）"
