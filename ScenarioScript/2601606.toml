[translation]
2601606-1 = "NC, ND."
2601606-2 = "특집 기사의 마무리로-"
2601606-3 = "선생님의 자극적인 소재만 살짝쿵 얹으면 좋을 것 같네요!"
2601606-7 = "[ns] \"역시, 그게 목적이었나!!\""
2601606-8 = "아뇨아뇨아뇨-! 목적까지는 아니구, 취재는 어디까지나 과정이죠!"
2601606-9 = "그런고로, 뭔가 재미있는 일 없으셨나요? 신경 쓰이는 사람이라든지!"
2601606-10 = "아니면 이상한 포즈로 사진을 찍혀주신다든지? 뭐든 좋아요!"
2601606-11 = "[s] \"무난하고 슴슴 담백한 기사로 충분하다구!\""
2601606-12 = "특집은 슬쩍슬쩍슬쩍 양념도 치고 그래야 맛이 좋은 건데요!"
2601606-13 = "치이-"
2601606-14 = "[s1] \"가져온 일감 하고 있을 테니 치아키도 마무리 교정하렴.\"\n[s2] \"특종은 주지 않을 거니깐!\""
2601606-17 = "닳는 것도 아니구-!"
2601606-18 = "[s] \"닳았단다!! 명예라든지!! 존엄!! 그런 거!!\""
2601606-19 = "아핫-!"
2601606-22 = "(노트북으로 가져온 업무를 처리해 나갔다.)"
2601606-23 = "(치아키는 옆에서 볼을 부풀리고 뚫어져라 쳐다보고 있었다.)"
2601606-30 = "업무 중에 죄송한데요오……."
2601606-31 = "집중하시면서 뭔가 재미있는 표정이라도 보여주실 줄 알았는데, 빈틈이 없으시네요……."
2601606-32 = "[s] \"나는 억지 특종이 되지 않겠다!\""
2601606-33 = "치이-"
2601606-34 = "우움-"
2601606-38 = "!"
2601606-42 = "아아- 선생님! 테이블 밑에 동전을 떨어뜨렸어요!"
2601606-43 = "동전 좀 주워주시겠어요? 선생님 쪽으로 굴러갔어요!"
2601606-44 = "[s3] \"응? 알았어!\"\n[s4] 테이블 밑으로 들어간다."
2601606-47 = "걸려들었군요!"
2601606-49 = "에잇-!"
2601606-52 = "[wa:450]― [log=치아키 수영복]후훗! [wa:960]빈틈 발견! [wa:940]셔터찬스![wa:160] [/log]"
2601606-55 = "― [log=치아키 수영복]아핫! [wa:830]선생님, [wa:840]작게 웅크려선…….[/log]"
2601606-57 = "― [log=치아키 수영복]이건 표지에 [wa:820]딱 맞는 구도네요! [/log]"
2601606-60 = "― [log=치아키 수영복]훗[wa:550]후웅! [/log]"
2601606-62 = "― [log=치아키 수영복]특종감이 없으면 [wa:1460]만들면 되는 법![/log]"
2601606-65 = "[ns] \"치, 치아키?! 그보다, 동전은?\""
2601606-67 = "[wa:1060]― [log=치아키 수영복]칫[wa:460]칫[wa:400]칫[wa:360]칫[wa:380]치-! [wa:1220]순진하시군요![/log]"
2601606-69 = "― [log=치아키 수영복]떨어뜨린건 [wa:1800]이 병뚜껑 이랍니다![/log]"
2601606-72 = "― [log=치아키 수영복]말 그대로, [wa:990]동전 한 닢 안 쓰고 [wa:750]귀한 장면을 연출했네요! [/log]"
2601606-75 = "[wa:770]― [log=치아키 수영복]재미없는 선생님은 [wa:3370]'테이블 밑에 가두기형'에 처합니다![/log]"
2601606-78 = "― [log=치아키 수영복]좀 더 재미있는 비밀을 [wa:1280]알려주시면[wa:40] [/log]"
2601606-80 = "― [log=치아키 수영복]풀어드릴지[wa:3120]도오-?[wa:40] [/log]"
2601606-83 = "― [log=치아키 수영복]응? [wa:920]괜찮으세요? [/log]"
2601606-85 = "― [log=치아키 수영복]눈도 피하시고…….[/log]"
2601606-88 = "[ns] \"그게……. 시선을 둘 곳이 없어서…….\""
2601606-90 = "[wa:610]― [log=치아키 수영복]아직 인터뷰 중이에요! [/log]"
2601606-92 = "― [log=치아키 수영복]제대로 여기 봐 주셔야죠! [/log]"
2601606-95 = "― [log=치아키 수영복]왜 여기 봐주지 않으시는 거에요오?[/log]"
2601606-98 = "― [log=치아키 수영복]앗, [wa:1340]이거……![/log]"
2601606-101 = "[wa:4470]― [log=치아키 수영복]꺄아아앗![wa:40] [/log]"
2601606-103 = "― [log=치아키 수영복]보! [wa:650]보면 안돼요![wa:40] [/log]"
2601606-106 = "[wa:1000]― [log=치아키 수영복]나오면 안 돼![/log]"
2601606-108 = "― [log=치아키 수영복]가만히 있어요! [/log]"
2601606-111 = "(이후, 주변 사람들이 적어질 때까지 테이블 밑에 갇혀있었다.)"
2601606-112 = "(치아키는 급한 일이 떠올랐다면서 황급히 도망쳤다.)"
