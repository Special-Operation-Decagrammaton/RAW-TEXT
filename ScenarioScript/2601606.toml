[translation]
2601606-1 = "NC, ND."
2601606-2 = "And to finish off the feature..."
2601606-3 = "I just need a little juicy material about you, Sensei!"
2601606-4 = ""
2601606-6 = ""
2601606-7 = "[ns] \"I knew that was what you were after!\""
2601606-8 = "No, no, no! I wouldn't call it the goal. The interview is just part of the process!"
2601606-9 = "So, has anything interesting happened lately? Any budding romance in your life?"
2601606-10 = "Or you could let me take a picture of you doing some weird pose! Anything works!"
2601606-11 = "[s] \"A nice, plain article is more than enough!\""
2601606-12 = "But a feature needs a little spice here and there to make it interesting!"
2601606-13 = "Ugh. Fine."
2601606-14 = "[s1] \"I'll work on some tasks I brought, so you finish proofreading, Chiaki.\"\n[s2] \"And I'm not giving you any scoops!\""
2601606-17 = "It's not like you'd lose anything!"
2601606-18 = "[s] \"I would!! My reputation! My dignity! Things like that!\""
2601606-19 = "Ahaha!"
2601606-22 = "I worked through the tasks I'd brought with me on my laptop."
2601606-23 = "Beside me, Chiaki puffed out her cheeks and stared at me intently."
2601606-24 = ""
2601606-26 = ""
2601606-27 = ""
2601606-29 = ""
2601606-30 = "Hey, Sensei? I don't mean to bother, but..."
2601606-31 = "You don't even make faces while you work. You're not giving me anything!"
2601606-32 = "[s] \"I won't let you turn me into a scoop!\""
2601606-33 = "Tch."
2601606-34 = "Hmm..."
2601606-35 = ""
2601606-37 = ""
2601606-38 = "Oh!"
2601606-39 = ""
2601606-41 = ""
2601606-42 = "Ah! Sensei! I dropped a coin under the table!"
2601606-43 = "Could you pick it up for me? It rolled over to your side!"
2601606-44 = "[s3] \"Hmm? Okay!\"\n[s4] Duck under the table."
2601606-47 = "You fell for it!"
2601606-49 = "Hup!"
2601606-52 = "― [log=치아키 수영복]Fufu! An opening! The perfect shot! [/log][wa:1750] "
2601606-55 = "― [log=치아키 수영복]Ahaha! Sensei, curled up so small like that...[/log][wa:590] "
2601606-57 = "― [log=치아키 수영복]This is a perfect shot for the cover![/log][wa:60] "
2601606-60 = "― [log=치아키 수영복]Heehee! [/log][wa:430] "
2601606-62 = "― [log=치아키 수영복]If there's no scoop, I'll just make one![/log][wa:580] "
2601606-65 = "[ns] \"Ch-Chiaki?! More importantly, where's the coin?\""
