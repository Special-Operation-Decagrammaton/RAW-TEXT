[translation]
1000515-1 = "어디서든 입장권"
1000515-3 = "(호시노의 '부탁'을 들어주기 위해, 대책위원회의 부실로 향했다.)"
1000515-10 = "으응? 이 소리는……."
1000515-11 = "역시 선생이려나? 지금 시간대라면 그럴 수밖에 없겠지~?"
1000515-17 = "으헤~. 역시나로구만."
1000515-18 = "고마워, 선생. 내심 반신반의했는데, 이런 사소한 부탁도 다 들어주고 말이야."
1000515-19 = "……응? 다른 아이들?"
1000515-20 = "우리 귀여운 후배들은 오늘 모두 일정이 있어. 그렇기 때문에 이렇게 선생도 부를 수 있었던 것이기도 하고 말이지."
1000515-21 = "단순히 감사를 표하고 싶다거나, 그냥 시간이 남아서 놀고 싶다는 이유로 선생을 찾는 거라면 나도 말리지 않겠지만……."
1000515-22 = "다들 선생에게 꽤 의지하고 있으니까 말이야. 상담이나 부탁하고 싶어 하는 일들이 한가득이더라고."
1000515-23 = "그래도 언제나 그렇게……. 너무 선생에게 의지만 하는 것도 곤란하잖아?"
1000515-24 = "일이 있을 때만 선생을 부른다는 느낌도 조금 미안하고 말이지. 아무리 어른이라고 해도 말이야."
1000515-25 = "[s1] \"나는 완전 괜찮은데?\"\n[s2] \"편하게 대해준다면 오히려 환영인걸.\""
1000515-28 = "으헤……. 그래, 그래. 정말 생각대로구만. 선생이라면 그렇게 말할 줄 알았어."
1000515-29 = "하지만 자립은 중요한 것이고……."
1000515-30 = "……아니."
1000515-31 = "이건 아저씨 입으로 말하기엔 조금 안 맞을지도 모르겠네. 아저씨는 오히려 그쪽으로 노력해야 할 타입이니까."
1000515-35 = "알고 있다고, 알고 있어. 그러니 그런 눈으로 보지 말아줘."
1000515-36 = "아저씨는 선생이 그런 눈으로 볼 때가 제일 힘들단 말이지. 아야네 쨩이 화낼 때만큼이나 곤란하거든."
1000515-37 = "아무튼 오늘의 본론은 그런 쪽의 이야기가 아니야."
1000515-38 = "문득 혼자 시간을 보내다가, 선생 생각이 났었거든. 그래서 불렀던 것뿐."
1000515-39 = "[s3] \"……내 생각?\"\n[s4] \"갑자기 그런 무드!?\""
1000515-42 = "자, 자. 그런 장난은 그만하고."
1000515-43 = "선생……."
1000515-44 = "이걸 봐주겠어?"
1000515-50 = "[ns5] \"이건 호시노의 베개잖아.\"\n[ns6] \"음? 갑자기 이건 왜……?\""
1000515-53 = "선생은 아직 모르나 보네. 이건 단순한 베개가 아니야."
1000515-54 = "이건 아저씨만의 보물, 신비한 힘을 지닌 <어디서든 입장권>이라고~."
1000515-58 = "후후……. 아직 무슨 말인지 모르겠다는 표정이네."
1000515-59 = "뭐, 구구절절이 입으로 말할 필요는 없겠지. 선생, 이리로 와서 앉아 보겠어?"
1000515-64 = "그래, 그래. 응. 좋아."
1000515-65 = "거기서 그렇게 자세를 잡고……. 자, 가슴팍이랑 팔 사이에 이걸 끼워서 깔아봐."
1000515-69 = "음. 딱 좋은 자세네."
1000515-70 = "그리고 그대로 눈을 감으면……."
1000515-81 = "세상 어디서라도 편안한 꿈나라로 들어갈 수 있는, 무적의 티켓이거든."
1000515-85 = "(호시노의 말 대로, 쿠션의 부드러움이 굉장해 점점 의식이 날아갔다.)"
1000515-86 = "(정신없이 잠드는 동안, 옆에서 혼잣말처럼 중얼거리던 호시노의 말이 계속 들려왔다.)"
1000515-89 = "……선생."
1000515-90 = "가끔은 선생도 다 잊고 느긋한 낮잠 한 번 자보는 게 어떨까 싶었어."
1000515-91 = "하지만 선생은 이렇게 학생이 자리를 마련해 주지 않으면, 그러지 않는 사람이니까."
1000515-92 = "그래서 빌려주는 거야. 이거, 아저씨한테는 굉장히 소중한 물건이라고?"
1000515-96 = "……선생? 벌써 자는 거야?"
1000515-97 = "……뭐……."
1000515-99 = "……선생도……나에게……."
1000515-103 = "……소중……사람……."
1000515-112 = "(그렇게 얼마나 잠이 들었을까.)"
1000515-117 = "(눈을 떠 보니 이미 해가 넘어간 저녁이었다.)"
1000515-118 = "[ns7] \"벌써 저녁인가…….\"\n[ns8] \"정신없이 잤네. 피곤하긴 했었나…….\""
1000515-121 = "……어라, 일어났어? 선생."
1000515-126 = "너무 기분 좋게 잘 자길래, 나도 모르게 옆에서 같이 누워 자 버렸네. 으헤……."
1000515-127 = "……응??"
1000515-128 = "물론 그 베개가 아저씨가 가진 비장의 아이템이긴 하지만, 아저씨는 그거 없어도 이런 데에서는 잘 자거든."
1000515-129 = "여기서는 밸런스를 위한 거라고 해둘까. '낮잠 초심자'에게 빌려주는 느낌으로?"
1000515-130 = "그럼……."
1000515-131 = "슬슬 늦었네. 선생, 이제 돌아가서 푹 쉬고 내일부터 다시 일해야 하지?"
1000515-132 = "요 앞까지는 바래다줄게. 아저씨가 불렀으니, 거기까진 책임져야 속이 편할 거 같거든."
1000515-133 = "뭐, 원래 요 주변 순찰도 자주 도는 편이고……."
1000515-134 = "그러니까 겸사겸사야, 겸사겸사. 괜히 부담스러워하지 않아도 된다고. 알았지?"
1000515-135 = "……응?"
1000515-136 = "……이 베개? ……마음에 들었어?"
1000515-137 = "어디서 구할 수 있냐고……?"
1000515-142 = "……으헤."
1000515-143 = "안 돼, 안 돼. 그건 말해줄 수 없어. 말해줬다가는 다음번에 지금이랑 같은 빌미로 선생을 부를 수 없게 돼 버리잖아."
1000515-144 = "사실 아비도스가 지금처럼 되기 전에, 예전에 근방에서 팔던 거라 이제는 못 구하는 거기도 하지만 말이지."
1000515-145 = "이제 알겠어? 세상에 단 하나밖에 없는 귀중한 아이템이라고. 아저씨의 <어디서든 입장권>은."
1000515-150 = "……그러니까 선생"
1000515-151 = "앞으로도 필요하면, 이 아저씨에게 직접 말해줘야 해."
1000515-152 = "……알았지?"
1000515-154 = "(이후 호시노의 에스코트를 받으며 아비도스를 벗어나, 샬레 휴게실로 돌아왔다.)"
1000515-155 = "(확실히 휴게실에 있던 다른 쿠션이나 베개들로는, 같은 느낌으로 잠이 들지 않았다.)"
