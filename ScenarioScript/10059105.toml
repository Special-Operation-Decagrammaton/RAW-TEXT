[translation]
10059105-3 = "……."
10059105-4 = "뭐냐."
10059105-5 = "이렇게 갑자기 변한다고?"
10059105-6 = "대체 무슨 수작을 부린 거냐."
10059105-7 = "[s] \"도움이 필요한 학생에게 있는 힘껏 손을 뻗었을 뿐이야.\""
10059105-11 = "……궤변이다."
10059105-12 = "고작 그런 걸로……."
10059105-13 = "[s] \"아마 너는 이해 못 하겠지.\""
10059105-17 = "[ns] \"내 진심은, 돈으로는 살 수 없으니까.\""
10059105-18 = "…………."
10059105-20 = "……확실히 훌륭하군요."
10059105-21 = "제 불편한 움직임을 배려하면서도, 최대한 유효한 결과가 나오도록 이끄는 지휘였어요."
10059105-22 = "용케 눈치채셨군요."
10059105-23 = "제가…… <장난감 병정과 발레리나 인형>의, 그 발레리나였다는 걸."
10059105-24 = "[s] \"그런 중요한 사실을 모를 리가 없잖아?\""
10059105-28 = "[ns] \"마나미는 내 소중한 학생이니까!\""
10059105-30 = "정말…… 당신이라는 사람은……."
10059105-35 = "후, 후후후……."
10059105-36 = "……제법이군요. 절 당황하게 하다니."
10059105-37 = "방금 그 대답, 100점 드리겠어요."
10059105-38 = "[s] \"오오, 드디어……!\""
10059105-39 = "990점 만점에서요."
10059105-40 = "[s] \"어학 시험 점수냐고!\""
10059105-44 = "으음, 뭔가 지켜보는 저까지 창피해지는 대화가 계속 심상 안으로 스며들어 옵니다만……."
10059105-45 = "이것도 서기관의 일이니 군말 없이 일지에 작성하도록 하겠습니다."
10059105-46 = "후후…… 아무튼 덕분에 상황이 역전됐네요. 원군도 도착했고요."
10059105-53 = "네놈들은……."
10059105-54 = "슬슬 포기하는 게 좋을걸?"
10059105-55 = "네. 이제 당신을 도와줄 부하들은 없어요."
10059105-56 = "우리가 전부 쓰러뜨렸으니까!"
10059105-62 = "……."
10059105-63 = "하아아아……."
10059105-67 = "……야."
10059105-71 = "왜 쟤들이 기어 나오는 건데?"
10059105-72 = "시키는 것도 제대로 못 해?"
10059105-73 = "보, 보스……! 이, 이건……!!"
10059105-74 = "닥쳐!"
10059105-76 = "꾸엣……!"
10059105-81 = "부하를 너무 믿었군."
10059105-82 = "……뭐, 상관없어. 나 혼자라도 네놈들을 상대하긴 충분하니."
10059105-83 = "후후, 아무리 당신이라도 이런 전면전은 피해가 클 텐데요?"
10059105-84 = "그러니 그쯤 해두시죠. 화가 많이 나셨다는 건 알겠습니다만……."
10059105-89 = "추후를 도모해야 하지 않겠어요?"
10059105-90 = "…………."
10059105-91 = "너, 뭔가 다르군."
10059105-95 = "……칫. 교수 놈."
10059105-96 = "……좋아. 이번엔 물러나지."
10059105-97 = "하지만 다음엔……."
10059105-98 = "[s1] \"또 만날 기회가 왔으면 좋겠네.\"\n[s2] \"그때는 좋은 인연으로 말이야.\""
10059105-101 = "……헛소리."
10059105-102 = "그쪽의 실력은 이제 알았다."
10059105-103 = "다음에 만나면…… 네놈을 갈아서 사탕으로 만들겠어."
10059105-104 = "기억해 두라고."
10059105-109 = "보, 보스……! 저도 데려가 주십시오……!!"
10059105-115 = "브로커 일당이 차례차례 자리를 떠나고 있습니다. 명실상부한 우리의 승리입니다!"
10059105-116 = "으으으, 드디어 끝났다…… 힘들었어요……."
10059105-117 = "하지만 그만큼 값진 승리였습니다."
10059105-118 = "……저를 향한 선생님의 마음도 확인할 수 있었고요."
10059105-119 = "마나미는 내 소중한 학생……이라니. #n모두가 보는 앞에서 잘도 그런 대담한 말을 해주셨군요."
10059105-120 = "엎질러진 물처럼, 한번 뱉은 말은 주워 담을 수 없습니다. 각오는 되셨는지?"
10059105-121 = "[s] \"무, 물론이지!\""
10059105-122 = "좋습니다. 그럼 그 각오와 오늘의 승리를 기념하는 특별한 수집품을 선물하죠."
10059105-123 = "그것은 바로……."
10059105-128 = "저의 교복입니다."
10059105-132 = "[ns] \"……응?\""
10059105-133 = "이 황폐한 현장에서 저의 교복만큼이나 오늘의 승리를 기념할 물건은 없겠죠."
10059105-134 = "그러니 제가 입고 있는 이 교복을 오늘의 기념품으로 지정해 선생님께 선물하겠습니다."
10059105-135 = "전시가 용이하도록 커다란 액자에 넣어 드릴 테니, #n사무실의 잘 보이는 곳에 걸고 감상해 주시길."
10059105-136 = "부디, 다른 학생들의 눈에도 잘 보이도록요."
10059105-137 = "설마 싫다고는 못 하시겠죠?"
10059105-138 = "선생님이 소중하다고 말한 학생의 교복이잖아요?"
10059105-139 = "[s] \"그, 그렇긴 한데……!\""
10059105-140 = "이건…… 제가 기록을 시작한 이래로 가장 적극적인 마나미 님의 모습이군요."
10059105-141 = "포기하십시오, 선생님. 도망갈 곳은 없습니다."
10059105-142 = "후후…… 어찌 됐든 일이 잘 해결돼서 다행이에요."
10059105-143 = "앞으로도 오늘만 같았으면 좋겠네요."
10059105-147 = "……네."
10059105-148 = "앞으로도, 오늘만 같았으면 좋겠네요."
10059105-153 = "(이후, 학원으로 돌아가 모두와 가벼운 뒤풀이를 즐겼다.)"
10059105-154 = "(일이 잘 해결되어 정말 다행이다…….)"
