[translation]
10059105-3 = "……。"
10059105-4 = "何？"
10059105-5 = "いきなりここまで変わるわけ？"
10059105-6 = "何をしたの？"
10059105-7 = "[s] \"助けを必要としている生徒に、届く限り手を伸ばしただけだよ。\""
10059105-11 = "……詭弁だろ。"
10059105-12 = "たったそれだけで？"
10059105-13 = "[s] \"たぶん、分からないだろうね。\""
10059105-17 = "[ns] \"私の本気は、お金じゃ買えないから。\""
10059105-18 = "…………。"
10059105-20 = "実に見事な指揮でした。"
10059105-21 = "私の足に負担をかけないよう配慮しながら、最大限に力を引き出していた。"
10059105-22 = "……よくお気づきになりましたね。"
10059105-23 = "私が……「しっかり者のスズの兵隊」のバレリーナだったと。"
10059105-24 = "[s] \"当然だよ。\""
10059105-28 = "[ns] \"マナミは私の大切な生徒だから。\""
10059105-30 = "本当に、あなたという人は――"
10059105-35 = "ふ、ふふっ。"
10059105-36 = "この私を狼狽えさせるとは……お見事です。"
10059105-37 = "今のお答えには100点を差し上げましょう。"
10059105-38 = "[s] \"おおっ、ついに……！\""
10059105-39 = "990点満点中の、ですが。"
10059105-40 = "[s] \"語学試験かな！？\""
10059105-44 = "ふむ……難儀なものです。こちらまで恥ずかしくなるやり取りが、#n強烈な記憶として刻み込まれていくのですが……。"
10059105-45 = "……いえ。これも書記官の務めです。#n私情を挟まず、ありのまま記録しておきましょう。"
10059105-46 = "ふふ……ともかく、これで形勢は逆転しましたね。援軍も到着しましたし。"
10059105-53 = "アンタらは……。"
10059105-54 = "そろそろ諦めた方がいいんじゃないかな？"
10059105-55 = "ええ。あなたを助ける部下は、すでに残っていません。"
10059105-56 = "私たちが全部倒したからな！"
10059105-62 = "……。"
10059105-63 = "はああああ……。"
10059105-67 = "……なあ。"
10059105-71 = "なあ、なあ、なあ。"
10059105-72 = "何であいつらが出てくるわけ？#n言われたことすら、まともにできないの？"
10059105-73 = "ボ、ボス……！これは……！！"
10059105-74 = "うるさい！"
10059105-76 = "くあっ……！"
10059105-81 = "買い被りすぎだったか。"
10059105-82 = "……まあいい。アンタら程度なら、私一人で十分だから。"
10059105-83 = "ですが、流石の貴女でも全面戦争を続ければ無傷では済まないでしょう？"
10059105-84 = "心中お察ししますが、引き際は弁えた方が良いかと。"
10059105-89 = "……先々のことも考えなくては、ね。"
10059105-90 = "…………。"
10059105-91 = "アンタ、ただの寮監隊じゃないね。"
10059105-95 = "……チッ。教授め。そういうことか。"
10059105-96 = "いいよ、今回は退いてやる。"
10059105-97 = "でも、次は――"
10059105-98 = "[s1] \"また会えるといいね。\"\n[s2] \"その時は、もう少しいい形で。\""
10059105-101 = "くだらない。"
10059105-102 = "アンタの実力は分かった。"
10059105-103 = "次に会ったら……すり潰して、キャンディにしてやる。"
10059105-104 = "覚えときな。"
10059105-109 = "ボ、ボス……！私も連れてってください……！！"
10059105-115 = "次々と撤退していきます。名実ともに、我々の勝利です！"
10059105-116 = "やっと終わったのですね……。"
10059105-117 = "ええ、収穫の多い勝利となりました。"
10059105-118 = "……先生が私をどう思っているのかも、よく分かりましたから。"
10059105-119 = "「マナミは私の大切な生徒」……でしたか。#n皆さんの前で、よくもまあ大胆なことを仰ったものです。"
10059105-120 = "一度口にした以上、なかったことにはできませんよ。#n覚悟はできているのでしょうね？"
10059105-121 = "[s] \"もちろん！\""
10059105-122 = "よろしい。#nその覚悟と今日の勝利を記念して、特別な収蔵品をひとつ贈りましょう。"
10059105-123 = "それは――"
10059105-128 = "私の制服です。"
10059105-132 = "[ns] \"……うん？\""
10059105-133 = "この荒れ果てた戦場で、本日の勝利を記念する品――#n私の制服ほどふさわしいものはないでしょう。"
10059105-134 = "私が身にまとっているこの制服を本日の記念品とし、先生へ贈呈いたします。"
10059105-135 = "額装してお渡ししますので、どうぞ執務室の目立つ場所に飾って存分にご鑑賞ください。"
10059105-136 = "もちろん、他の生徒からもよく見えるように。"
10059105-137 = "まさか、拒絶なさったりなんて……しませんよね？"
10059105-138 = "先生の「大切な」生徒の制服なのですから。"
10059105-139 = "[s] \"大切だからこそじゃないかなぁ……。\""
10059105-140 = "これは……私の記録史上、最も積極的なマナミ様です。"
10059105-141 = "諦めてください、先生。もはや逃げ道はありません。"
10059105-142 = "ふふ……何はともあれ、無事に解決して本当によかったです。"
10059105-143 = "これからも、今日のような日が続くといいですね。"
10059105-147 = "……ええ。"
10059105-148 = "これからも。"
10059105-153 = "（その後は学院に戻り、ささやかな打ち上げを楽しんだ）"
10059105-154 = "（本当に、無事に解決してよかった……）"
