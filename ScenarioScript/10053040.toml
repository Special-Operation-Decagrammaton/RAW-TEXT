[translation]
10053040-1 = "第4話;活著的石像"
10053040-4 = "嗯～！空氣真好！"
10053040-5 = "咦，老師？為什麼在那麼後面？"
10053040-6 = "[s1] 「稍微，慢一點……」\n[s2] 「走不動了……」"
10053040-9 = "哈哈，什麼啊！平時要多運動啊。"
10053040-14 = "不是！是你不正常！"
10053040-15 = "怎麼叫都停不下來！"
10053040-16 = "看來大家都運動不足呢～某所長呢？"
10053040-21 = "哈啊……！哈啊啊……！！"
10053040-22 = "哇哦！快趴了呢！"
10053040-23 = "但是流點汗不是很爽快嗎？"
10053040-24 = "呼啊……！呼啊啊……！！"
10053040-25 = "連回答的力氣都沒有了！哈哈哈！"
10053040-26 = "這不是該笑的事吧……！"
10053040-33 = "呼……終於，到第一個點了……"
10053040-34 = "但這裡真的是目的地嗎？什麼都沒有耶？"
10053040-35 = "等，等一下，讓我喘口氣……"
10053040-40 = "呼……這裡就是白川山的第一個搜索點不會錯。"
10053040-41 = "覺得什麼都沒有是正常的，按常理，#n如果是人走的路槌之子早就被發現或者逃到別的地方去了。"
10053040-42 = "那倒是沒錯……"
10053040-46 = "以防萬一我再問最後一次。"
10053040-47 = "真的要把這裡全翻一遍嗎？為了找可能存在的胖蛇，把整座山翻一遍？"
10053040-52 = "那是當然的，只要這座山上……"
10053040-53 = "存在著槌之子的話。"
10053040-57 = "（30分鐘後）"
10053040-61 = "…………"
10053040-66 = "等等！才剛開始多久你就不行了！"
10053040-67 = "我剛才，靈魂出竅了……所以，靈魂是存在的……Q.E.D."
10053040-68 = "到底在說什麼啊……"
10053040-69 = "老師呢……？"
10053040-70 = "[ns5] 「長期辦公導致的肌肉痠痛……！」\n[ns6] （沒有回應。似乎是普通的屍體。）"
10053040-73 = "你們兩個真的靠不住耶……"
10053040-74 = "……？你在笑什麼？"
10053040-75 = "咦？我嗎？"
10053040-76 = "沒感覺嗎？嘴角都翹到耳邊了。"
10053040-77 = "是嗎……其實也沒什麼。"
10053040-78 = "就是想著大家一起做同一件事還蠻快樂。"
10053040-79 = "……嗯，我也這麼覺得。"
10053040-80 = "那個，我有點好奇。"
10053040-81 = "翼有沒有參加社團活動什麼的？"
10053040-82 = "那樣的話應該會有能和更多人相處的機會……"
10053040-83 = "啊……"
10053040-87 = "那個，該怎麼說呢，對外人解釋起來有點困難。"
10053040-88 = "準確來說是有過，但後來就沒有了……"
10053040-89 = "我們的社團……"
10053040-90 = "被廢除了，因為成果不足和各種原因。"
10053040-91 = "…………抱歉。"
10053040-92 = "沒，沒事！沒關係！我又沒有放棄社團！"
10053040-93 = "千年是重視成果的學園嘛，說不定這次探險發現槌之子的話，社團就能復活了！"
10053040-94 = "雖然沒聽說過被廢除的社團復活的事……"
10053040-95 = "總之我會幫忙的。但是，我認為槌之子大概不存在。"
10053040-96 = "就算是這樣，如果是錯誤的理論證明它也是很重要的事。"
10053040-97 = "比起那個，剛才開始就沒看到木乃香君？"
10053040-98 = "啊，話說回來，我看到他喊著好像找到什麼東西然後跑過去了。"
10053040-99 = "也許會發生什麼事，我們要好好看著他。木乃香君是我們當中最脆弱的。"
10053040-100 = "……你認真？"
10053040-101 = "嗯？什麼意思？"
10053040-103 = "嗚，嗚啊啊……"
10053040-104 = "剛才那有氣無力的叫聲是！？"
10053040-105 = "難道木乃香君發生什麼事了！？ 快去看看！"
10053040-109 = "……嗚啊啊，嗚啊…… 老，老師…… 救救我……"
10053040-110 = "[s7] 「怎麼了，木乃香！？」\n[s8] 「臉色好蒼白！」"
10053040-113 = "就是……我發現地上好像埋著什麼東西……就挖了出來……然後就……"
10053040-118 = "就完了。"
10053040-119 = "這，這是什麼啊？看起來超不吉利的？"
10053040-120 = "看起來是老舊的木製盒子，雖然確切年份要調查過才知道……"
10053040-121 = "但是看到像紙這種保存性低的材質做的護身符還完好無損，應該不是那麼久遠的東西。"
10053040-122 = "現在不是冷靜分析的時候吧！？ 這個真的不是開玩笑的！！"
10053040-126 = "怎，怎，怎，怎麼辦！？現在埋回去的話還來得及吧！？要現在就挖嗎！？"
10053040-127 = "等等，不打開看看嗎？"
10053040-129 = "怎麼可能打開！！！！"
10053040-134 = "聽我說，雖然媒體總是強調破魔、避邪這類負面意義的符咒，#n但符咒本身並不是不吉利的東西。"
10053040-135 = "反而可以說是吉祥的物品，因為符咒原本主要是用來寄託祈願和心願的。"
10053040-136 = "至少這個不是吧！？這個不管怎麼看都是詛咒吧！？"
10053040-137 = "我懂了！！你是水象對吧！？想給火象的我帶來厄運對吧！？"
10053040-139 = "我，我也覺得還是埋回去比較好……"
10053040-140 = "我，我才不是相信什麼詛咒！但是別人埋的東西，不管有什麼理由擅自打開是很失禮的！"
10053040-142 = "……呼姆。"
10053040-148 = "[ns9] 「啊……」\n[ns10] 「打開了。」"
10053040-154 = "這是……石像嗎？看起來是石頭做的人偶。"
10053040-155 = "真的出現危險的東西了！！"
10053040-156 = "不，只是普通的石頭人偶，冷靜點……"
10053040-157 = "用符咒纏繞的盒子裡出現石頭人偶這一點就已經不普通了！？！？"
10053040-162 = "沒事的，雖然很遺憾，但這是假的。"
10053040-163 = "假的？"
10053040-168 = "首先這個不是100%的石頭做的，以石頭來說體積相對重量太輕了，而且表面質感也過於一致。"
10053040-169 = "我猜大概是塑膠……用樹脂混合石粉做成的仿製品吧。#n也就是說，與其說是手工藝品更有可能是量產品。"
10053040-170 = "相較之下，盒子是真正的木頭做的，看起來也相當有年代了。#n也就是說，為了讓這個石頭人偶看起來像真品所以特意找了老舊的盒子。"
10053040-176 = "但是，再怎麼說誰會閒著沒事這麼用心地惡作劇啊……"
10053040-178 = "嗯，按常理來說是這樣，但意外地這種東西相當常見。"
10053040-179 = "主要是用於影片拍攝、擴增實境遊戲、話題行銷等目的……#n但偶爾也會有人完全沒什麼理由，純粹做了之後把它藏起來。"
10053040-180 = "很明顯是為了引起關注或者……純粹是為了嚇唬發現者，算是有點惡劣的惡作劇。"
10053040-181 = "特別是在我平時去的廢墟等地方常常能發現，所以我很清楚。"
10053040-187 = "看，看吧！我就說沒什麼大不了的，對吧！？老師！？"
10053040-188 = "[s11] 「……為什麼要問我？」\n[s12] 「不過還好。如果是假的，木乃香也能放心……」"
10053040-195 = "現在開始挖洞吧！"
10053040-197 = "……蛤？"
10053040-199 = "就算是惡作劇，只要包含了惡意就無疑是不吉利的東西！"
10053040-200 = "所以這次要確實地讓任何人都挖不出來，重新封印到地下！"
10053040-201 = "是有點道理……但為了不增加受害者還是我們收著會比較……"
10053040-202 = "不！！ 這東西原本就不該出現在地面上！！"
10053040-203 = "這次一定要埋到地底最深處！！"
10053040-205 = "大家拿起鏟子！！！ 開始挖！！！"
10053040-207 = "咦，咦！？"
10053040-208 = "……咦咦咦！？"
10053040-217 = "呼～封印完成！！這樣就解決了！！"
10053040-218 = "心情輕鬆了身體也就跟著輕盈起來了呢～大家不覺得嗎？哈哈哈哈！"
10053040-223 = "哈啊……哈啊……他都不會累的嗎……"
10053040-224 = "…………"
10053040-229 = "他一個人幾乎挖了10m不是嗎……？"
10053040-230 = "最後測量的時候，是8m……"
10053040-232 = "哎呀，大家只是動了一下怎麼這麼誇張。"
10053040-233 = "不過是挖了一點土而已。"
10053040-234 = "別說得像在公園挖沙一樣啊……"
10053040-235 = "那個，女武神的人都是這樣嗎？"
10053040-236 = "哎呀，我這種程度在女武神根本不算什麼，比起我，環奈大姐要厲害得多。"
10053040-241 = "……"
10053040-242 = "我要好好做人。"
10053040-243 = "……我也是。"
10053040-248 = "那就差不多該……"
10053040-252 = "下山了吧？"
10053040-253 = "[s13] 「萬歲！！！！」\n[s14] 「不再找槌之子了嗎？」"
10053040-254 = "不說別人還以為是我抓了大家呢。"
10053040-255 = "雖然抓人確實是我的工作，哈哈哈！"
10053040-259 = "差不多要晚上了，而且時間還算充裕。"
10053040-260 = "重點是……看到那種東西之後就沒有心情繼續找了……"
10053040-265 = "呼……終於結束了。"
10053040-266 = "……但是這麼辛苦，實際收穫卻是零啊。"
10053040-267 = "如果一天就能輕易發現的話就不會是傳說中的生物了。"
10053040-268 = "話是這麼說沒錯……"
10053040-276 = "嗯？"
10053040-277 = "我好像看到有什麼從草叢裡跟過來……是野生動物嗎？"
10053040-281 = "……！！！"
10053040-282 = "呀啊啊啊啊啊！！！！！"
10053040-286 = "[ns15] 「玲奈……？」\n[ns16] 看往玲奈看的方向。"
10053040-290 = "（明明應該埋在地下8m的石頭人偶竟從樹叢間看著我們……！）"
10053040-291 = "（…………）"
10053040-292 = "（但是，怎麼比第一次看到的時候更髒更邋遢，而且看起來非常疲憊。）"
10053040-293 = "老師～你在那裡做什麼呢～？"
10053040-297 = "（稍微移開視線後，石頭人偶就消失不見了。）"
10053040-298 = "（……總覺得，結下了奇怪的怨恨。）"
