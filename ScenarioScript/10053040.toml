[translation]
10053040-1 = "ตอนที่ 4;ตุ๊กตาหินที่มีชีวิต"
10053040-3 = ""
10053040-4 = "โอ้ อากาศสดชื่นจังเลย!"
10053040-5 = "เอ๋ คุณครู? ทำไมไปอยู่ข้างหลังแบบนั้นล่ะคะ?"
10053040-6 = "[s1] \"ค่อยๆ เดินได้มั้ย...\"\n[s2] \"ครูเดินตามไม่ไหวแล้ว...\""
10053040-9 = "ฮ่าฮ่า อะไรกันคะ! ปกติไม่ค่อยออกกำลังกายใช่มั้ยเนี่ย?"
10053040-10 = ""
10053040-13 = ""
10053040-14 = "นี่! เธอต่างหากล่ะที่ผิดปกติน่ะ!!"
10053040-15 = "ตะโกนเรียกแค่ไหนก็ไม่หยุดเดินสักที!"
10053040-16 = "ไม่ค่อยได้ออกกำลังกายเหมือนกันสินะ~ แล้วหัวหน้าศูนย์ โมล่ะ?"
10053040-17 = ""
10053040-19 = ""
10053040-20 = ""
10053040-21 = "แฮ่ก...! แฮ่ก...!"
10053040-22 = "โอ้! สภาพดูไม่จืดเลย!"
10053040-23 = "แต่พอได้เหงื่อแล้วก็สดชื่นอยู่ใช่มั้ยล่ะ?"
10053040-24 = "แฮ่ก...! แฮ่ก...!"
10053040-25 = "ไม่มีแรงแม้แต่จะตอบเลยเหรอ! ฮ่าฮ่าฮ่า!"
10053040-26 = "ไม่ใช่เรื่องน่าหัวเราะสักหน่อย...!"
10053040-27 = ""
10053040-29 = ""
10053040-30 = ""
10053040-32 = ""
10053040-33 = "ฮู่ว... ในที่สุดก็มาถึงจุดแรกแล้ว..."
10053040-34 = "ว่าแต่ที่นี่คือจุดหมายปลายทางจริงๆ เหรอ? ไม่เห็นจะมีอะไรเลยนะ?"
10053040-35 = "ขะ... ขอฉันพักหายใจเดี๋ยวหนึ่งนะ..."
10053040-37 = ""
10053040-38 = ""
10053040-39 = ""
10053040-40 = "ใช่แล้วละ นี่คือจุดสำรวจแรกของภูเขาชิราคาวะ"
10053040-41 = "ไม่แปลกหรอกถ้าจะรู้สึกว่าไม่มีอะไรอยู่เลย ก็ถ้านี่เป็นเส้นทางที่มีคนสัญจร ก็คงมีใครเจอสึจิโนโกะไปแล้ว หรือไม่สึจิโนโกะก็คงหนีไปไหนแล้วละ"
10053040-42 = "มันก็จริงอยู่หรอก แต่ว่า..."
10053040-43 = ""
10053040-45 = ""
10053040-46 = "ฉันจะถามเป็นครั้งสุดท้ายจริงๆ นะ"
10053040-47 = "จะหาให้ทั่วสถานที่นี้เลยเหรอ? จะพลิกภูเขาทั้งลูกเพื่อเจ้างูอ้วนที่ไม่รู้ว่ามีอยู่จริงหรือเปล่าเนี่ยนะ?"
10053040-48 = ""
10053040-50 = ""
10053040-51 = ""
10053040-52 = "ก็ถ้าในภูเขานั้น..."
10053040-53 = "มันมีสึจิโนโกะอยู่จริงๆ ละก็"
10053040-57 = "(สามสิบนาทีต่อมา)"
10053040-58 = ""
10053040-60 = ""
10053040-61 = "..."
10053040-62 = ""
10053040-64 = ""
10053040-66 = "เดี๋ยวสิ! เพิ่งจะเริ่มหาได้ไม่นานเอง หมดแรงกันแล้วเหรอ!"
10053040-67 = "ฉัน... รู้สึกเหมือนวิญญาณหลุดออกจากร่างไปแวบหนึ่ง... งั้นก็พิสูจน์ได้ว่า... วิญญาณมีอยู่จริง... จบการพิสูจน์"
10053040-68 = "พูดอะไรเหลวไหล..."
10053040-69 = "แล้วคุณครูล่ะ..."
10053040-70 = "[ns5] \"ครูปวดกล้ามเนื้อจากออฟฟิศซินโดรม...!\"\n[ns6] (ไม่ตอบ แต่นอนนิ่งเหมือนวิญญาณออกจากร่างไปจริงๆ)"
10053040-73 = "สองคนนี้นี่เชื่อถือไม่ได้เลยจริงๆ แฮะ..."
10053040-74 = "ทำไมถึงฉีกยิ้มอยู่แบบนั้นล่ะ...?"
10053040-75 = "หืม? ฉันเหรอ?"
10053040-76 = "ไม่รู้ตัวหรอกเหรอ? ยิ้มกว้างจนปากจะถึงหูแล้วนะ?"
10053040-77 = "อ่า งั้นเหรอ... แต่ก็ไม่ได้มีอะไรมากหรอก"
10053040-78 = "ฉันก็แค่... คิดว่าการได้ทำอะไรด้วยกันกับคนอื่นมันก็สนุกดีน่ะ"
10053040-79 = "อ่า... งั้นเหรอ"
10053040-80 = "คือว่า... ฉันถามเพราะสงสัยเฉยๆ หรอกนะ"
10053040-81 = "สึบาสะไม่ได้ทำกิจกรรมของชมรมหรอกเหรอ?"
10053040-82 = "ถ้าได้ทำกิจกรรมชมรม ก็น่าจะมีปฏิสัมพันธ์กับผู้คนได้มากขึ้นนะ..."
10053040-83 = "อ่า"
10053040-84 = ""
10053040-86 = ""
10053040-87 = "ฉันควรอธิบายยังไงดีนะ มันค่อนข้างยากที่จะอธิบายให้คนนอกเข้าใจน่ะ"
10053040-88 = "พูดให้ชัดๆ เลยก็คือ... ฉันก็เคยมีชมรมนะ... แต่สุดท้ายเราก็ทำกิจกรรมไม่ได้..."
10053040-89 = "เอ่อ ชมรมของฉัน..."
10053040-90 = "ถูกยุบไปน่ะ เหตุผลก็เพราะผลงาน แล้วก็อย่างอื่นด้วย"
10053040-91 = "ขอโทษที่ถามนะ..."
10053040-92 = "มะ... ไม่! ไม่เป็นไร! ยังไงฉันก็ไม่ได้ละทิ้งชมรมไปเสียทีเดียวหรอก!"
10053040-93 = "มิลเลเนียมเป็นโรงเรียนที่ให้ความสำคัญกับผลงาน ถ้าฉันหาสึจิโนโกะเจอจากการสำรวจครั้งนี้ ชมรมอาจจะได้กลับมาอีกครั้งก็ได้!"
10053040-94 = "ถึงฉันจะยังไม่เคยเห็นเคสที่ชมรมที่ถูกยุบไปแล้วได้กลับมาเปิดใหม่ก็เถอะ..."
10053040-95 = "เอาเป็นว่าฉันจะให้ความร่วมมือด้วย ต่อให้จะคิดว่าสึจิโนโกะไม่มีอยู่จริงก็เถอะนะ"
10053040-96 = "ก็แน่อยู่แล้วละ ถ้ามันเป็นทฤษฎีที่ผิด การพิสูจน์ว่าผิดก็เป็นโจทย์ที่สำคัญเหมือนกัน"
10053040-97 = "แต่ที่สำคัญกว่านั้น เราไม่เห็นโคโนกะตั้งแต่เมื่อกี้แล้วนะ"
10053040-98 = "อ๊ะ จะว่าไป เมื่อกี้เห็นตะโกนว่าเจอบางอย่างแล้ววิ่งไปไหนก็ไม่รู้"
10053040-99 = "อาจเกิดเรื่องอะไรขึ้นก็ได้ ต้องตามไปดูแล้วละ โคโนกะเป็นคนที่ขวัญอ่อนที่สุดในหมู่พวกเรานี่นา"
10053040-100 = "พูดจริงใช่มั้ยเนี่ย...?"
10053040-101 = "หืม? หมายความว่ายังไงน่ะ?"
10053040-102 = ""
10053040-103 = "อะ... อ๊ายยยย..."
10053040-104 = "อะไรน่ะ เสียงกรีดร้องอย่างกับคนปอดแหกเมื่อกี้มัน?!"
10053040-105 = "หรือว่าจะเกิดอะไรขึ้นกับโคโนกะ?! รีบไปกันเถอะ!"
10053040-108 = ""
10053040-109 = "อะ... อึกกก... คะ... คุณครู... ช่วยด้วย... "
10053040-110 = "[s7] \"เกิดเรื่องอะไรเหรอ โคโนกะ?!\"\n[s8] \"เกิดอะไรขึ้นน่ะ หน้าซีดเป็นไก่ต้มเลย!\""
10053040-113 = "คือว่า... ฉันเจอบางอย่างฝังอยู่ใต้ดิน... ก็เลยลองขุดขึ้นมาดูค่ะ..."
10053040-114 = ""
10053040-116 = ""
10053040-118 = "ซวยแล้วค่ะ"
10053040-119 = "นะ... นั่นมันอะไรเหรอ? ดูเป็นลางไม่ค่อยดีเลยนะ"
10053040-120 = "เป็นกล่องไม้เก่าๆ สินะ ส่วนเรื่องอายุที่แน่นอนคงต้องเอาไปตรวจสอบดูอีกที..."
10053040-121 = "แต่ดูจากยันต์กระดาษที่ยังอยู่ในสภาพดี ทั้งที่เป็นวัสดุที่ผุพังง่ายแล้ว... งั้นกล่องนี้คงไม่ได้เก่าแก่มากนักหรอก"
10053040-122 = "นี่มันใช่เวลามาวิเคราะห์อย่างใจเย็นมั้ย?! นี่ไม่ใช่เรื่องตลกเลยนะ!!"
10053040-123 = ""
10053040-125 = ""
10053040-126 = "ทะ... ทะ... ทะ... ทำยังไงดีล่ะคะ?! ถ้าเอาไปวางไว้ที่เดิมตอนนี้ ลางร้ายจะหายไปมั้ยคะ?! หรือจะขุดดินแล้วฝังไว้ดีคะ?!"
10053040-127 = "เดี๋ยวก่อน จะไม่เปิดดูข้างในกันเหรอ?"
10053040-129 = "ใครมันจะไปเปิดกันเล่า!!!!"
10053040-130 = ""
10053040-132 = ""
10053040-133 = ""
10053040-134 = "เดี๋ยวสิ ฟังฉันก่อนนะ สื่อในยุคปัจจุบันมักจะลงข่าวเกี่ยวกับยันต์แต่ในแง่ลบ อย่างพวกยันต์ปราบมาร#nหรือสะกดวิญญาณ แต่จริงๆ แล้วยันต์ไม่ใช่สิ่งอัปมงคลอะไรหรอกนะ"
10053040-135 = "ควรเรียกว่าเป็นสิ่งมงคลมากกว่าด้วยซ้ำ ก็เดิมทีแล้ว จุดประสงค์หลักของมันก็เพื่อใช้สำหรับสวดมนต์ และอธิษฐานต่างหาก"
10053040-136 = "ฉันไม่ใช่เด็กน้อยหรอกนะ?! ดูเอาก็รู้ว่านี่คือของต้องสาป!!"
10053040-137 = "รู้แล้ว!! เธอเป็นพวกธาตุน้ำใช่มั้ย?! ไม่งั้นคงไม่เอาเรื่องแย่ๆ มาสาดใส่คนธาตุไฟอย่างฉันหรอก?!"
10053040-139 = "ฉะ... ฉันก็คิดว่าควรเอาไปฝังไว้นะ..."
10053040-140 = "ถะ... ถึงฉันจะไม่ได้เชื่อเรื่องคำสาปอะไรนั่นก็เถอะ! แต่มาเปิดสิ่งของของคนอื่นโดยไม่รู้เรื่องราว#nเบื้องหลังเลยแบบนี้ มันเป็นการเสียมารยาทนี่นา!"
10053040-142 = "ฮืม..."
