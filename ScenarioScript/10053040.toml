[translation]
10053040-1 = "第4話;活著的石像"
10053040-4 = "嗯～！空氣真好！"
10053040-5 = "咦，老師？為什麼走在那麼後面？"
10053040-6 = "[s1] 「稍微，慢一點……」\n[s2] 「我快走不動了……」"
10053040-9 = "哈哈，什麼啦！平時記得要多運動哦。"
10053040-14 = "不對，是你太不正常了吧！？"
10053040-15 = "而且無論怎麼叫都不停下來！"
10053040-16 = "哎呀，看來大家都缺乏運動呢～某所長呢？"
10053040-21 = "哈啊……！哈啊啊……！！"
10053040-22 = "哇哦！已經快不行了呢！"
10053040-23 = "不過流點汗不是很爽快嗎？"
10053040-24 = "呼啊……！呼啊啊……！！"
10053040-25 = "連回答的力氣都沒有了呢！哈哈哈！"
10053040-26 = "這有什麼好笑的啦……！"
10053040-33 = "呼……終於到達第一個觀測地點了……"
10053040-34 = "這裡真的是目的地嗎？感覺什麼都沒有耶？"
10053040-35 = "先，先讓我喘口氣……"
10053040-40 = "沒錯，這裡就是白川山的第一個搜索點。"
10053040-41 = "會覺得什麼都沒有是正常的。#n畢竟照理來說，如果是有人走動的地方……#n槌之子不是早就被人發現，就是已經逃到其他地方去了吧。"
10053040-42 = "唔嗯，話是這麼說沒錯啦……"
10053040-46 = "保險起見，我再問最後一次。"
10053040-47 = "真的要把這裡全部找一遍嗎？#n就為了那隻不知道存不存在的胖蛇？"
10053040-52 = "沒錯，只要這座山裡……"
10053040-53 = "真的存在著槌之子的話。"
10053040-57 = "（30分鐘後）"
10053040-61 = "…………"
10053040-66 = "等一下！你怎麼才開始沒多久就陣亡了啊！"
10053040-67 = "剛才……我靈魂出竅了……所以……靈魂是存在的……Q.E.D."
10053040-68 = "到底在說什麼啊……"
10053040-69 = "老師呢……？"
10053040-70 = "[ns5] 「長期辦公導致的肌肉痠痛……！」\n[ns6] （沒有回應。似乎只是普通的屍體）"
10053040-73 = "你們兩個真的很不可靠耶……"
10053040-74 = "……怎麼了？為什麼要那樣傻笑？"
10053040-75 = "咦？我嗎？"
10053040-76 = "你沒發現嗎？嘴角都快翹到耳邊了哦。"
10053040-77 = "啊，這樣啊……其實也沒什麼。"
10053040-78 = "只是覺得……大家一起做點事情還挺開心的。"
10053040-79 = "……嗯，就是說啊。"
10053040-80 = "那個……其實我有點好奇一件事情。"
10053040-81 = "翼沒有參加社團之類的嗎？"
10053040-82 = "那樣應該會有更多和其他人相處的機會才對……"
10053040-83 = "啊……"
10053040-87 = "那個，該怎麼說好呢……要跟外人解釋好像有點困難。"
10053040-88 = "準確來說是曾經有參加，不過後來被迫停止了……"
10053040-89 = "我們的社團……"
10053040-90 = "被廢除了。因為成果不足之類的各種原因。"
10053040-91 = "…………抱歉。"
10053040-92 = "別，別這麼說！沒關係的！#n而且我也沒有因為這樣就放棄社團！"
10053040-93 = "千年畢竟是所重視成果的學園──#n要是能在這次探險中發現槌之子的話，或許社團就能復活了也說不定！"
10053040-94 = "雖然我從來沒聽說過被廢除的社團復活的案例就是了……"
10053040-95 = "總之，我也會幫忙的。#n雖然我還是認為槌之子八成不存在就是了。"
10053040-96 = "沒關係。就算理論是錯誤的，實際加以驗證也是很重要的事。"
10053040-97 = "話說回來，好像從剛才開始就沒看到木乃香君了呢？"
10053040-98 = "啊，我剛才有看到他喊說「找到什麼東西了」然後跑走的樣子哦。"
10053040-99 = "要是發生什麼事就糟了，我們得好好看著他才行。#n畢竟木乃香君是我們當中最脆弱的。"
10053040-100 = "……你認真？"
10053040-101 = "嗯？什麼意思？"
10053040-103 = "嗚，嗚啊啊……"
10053040-104 = "剛才那有氣無力的叫聲是……！？"
10053040-105 = "難道木乃香君出事了！？#n快去看看吧！"
10053040-109 = "嗚啊啊，嗚啊……#n老，老師…… 救救我……"
10053040-110 = "[s7] 「怎麼了，木乃香！？」\n[s8] 「臉色好蒼白！」"
10053040-113 = "就是……我發現地上好像埋著什麼東西……於是就挖了出來……"
10053040-118 = "完蛋了。"
10053040-119 = "這，這是什麼啊？看起來超不吉利的耶？"
10053040-120 = "看起來是個老舊的木製盒子呢。#n雖然確切年份需要進一步的調查才能確定……"
10053040-121 = "不過從保存性較低的紙質符咒還完好無損來看，應該不是多麼久遠的物品才對。"
10053040-122 = "現在不是冷靜分析的時候吧！？#n這個真的不是開玩笑的耶！！"
10053040-126 = "怎，怎，怎，怎麼辦！？#n現在埋回去的話還來得及吧！？要現在就挖嗎！？"
10053040-127 = "等等，不打開看看嗎？"
10053040-129 = "怎麼可能打開！！！！"
10053040-134 = "不，你先聽我說。#n雖然現代媒體總是在強調破魔這類負面的用途，但是符咒本身並不是不吉利的東西。"
10053040-135 = "反而應該說是吉祥的物品才對。畢竟它原本是用來寄託祈禱與願望的東西啊。"
10053040-136 = "至少這個不是吧！？這個不管怎麼看都是詛咒吧！？"
10053040-137 = "我懂了！！你是水象對吧！？是不是想給火象的我帶來厄運！？"
10053040-139 = "我，我也覺得還是埋回去比較好……"
10053040-140 = "不，不是因為相信什麼詛咒哦！#n只是認為擅自打開別人埋的東西很失禮而已！"
10053040-142 = "哼嗯……"
10053040-148 = "[ns9] 「啊……」\n[ns10] 「打開了。」"
10053040-154 = "這是……石像嗎？#n看起來是石頭做的人偶呢。"
10053040-155 = "真的出現危險的東西了！！"
10053040-156 = "只是個普通的石頭人偶而已，你先冷靜一點……"
10053040-157 = "光是「纏滿符咒的盒子裡出現石頭人偶」就已經一點也不普通了吧！？！？"
10053040-162 = "沒事的。#n雖然對我來說有點遺憾，不過這個東西是假的。"
10053040-163 = "嗯？假的？"
10053040-168 = "首先，它100%不是石頭做的。#n以體積而言重量實在太輕，表面的質感又太過一致了。"
10053040-169 = "我猜大概是塑膠……用樹脂混合石粉做成的仿製品吧。#n所以比起手工藝品，這更有可能是大量生產的量產品。"
10053040-170 = "相較之下，盒子則是用真正的木頭製成，看起來也相當有年代了。#n也就是說，有人為了讓石頭人偶更加逼真，特意將它裝進了老舊的盒子之中。"
10053040-176 = "不是，到底誰那麼閒搞這種大費周章的惡作劇啊……"
10053040-178 = "以常理而言是這樣沒錯，不過這種東西其實意外地常見哦。"
10053040-179 = "主要是為了拍攝影片、擴增實境遊戲、話題行銷之類的目的……#n偶爾也會有人無緣無故把做好的東西藏起來。"
10053040-180 = "說白了就是想引起關注……或者純粹為了嚇唬發現者吧。#n算是一種有點惡劣的惡作劇。"
10053040-181 = "尤其在我常去的廢墟之類的地方經常能夠發現，所以我還挺清楚的。"
10053040-187 = "你，你看！就說沒什麼大不了的吧，老師！？"
10053040-188 = "[s11] 「……為什麼要問我？」\n[s12] 「不過是假的也好，這樣木乃香也能放心──」"
10053040-195 = "現在開始挖洞吧！"
10053040-197 = "……咦？"
10053040-199 = "不怕一萬只怕萬一！#n就算是惡作劇，只要帶有惡意就是不吉利的東西！"
10053040-200 = "所以這次一定要確實把它封印到地底下，不讓任何人有辦法挖出來！"
10053040-201 = "雖然是有點道理……不過為了避免受害者增加，還是由我們收著比較──"
10053040-202 = "不行！！這種東西本來就不應該出現在地面上！！"
10053040-203 = "這次一定要把它埋到地函底下！！"
10053040-205 = "所有人鏟子預備──！！！開始！！！"
10053040-207 = "咦，咦！？"
10053040-208 = "……咦咦咦！？"
10053040-217 = "呼～封印完成！！這樣就解決了！！"
10053040-218 = "隨著心情放鬆，身體也變輕盈了呢～#n大家不覺得嗎？啊哈哈哈！"
10053040-223 = "哈啊……哈啊……不是，那個人都不會累的嗎……"
10053040-224 = "…………"
10053040-229 = "他是不是一個人挖了快10m深啊……？"
10053040-230 = "最後測量的時候是8m……"
10053040-232 = "哎唷～只是稍微活動一下而已，大家也太誇張了吧。"
10053040-233 = "不過就是挖了一點土嘛。"
10053040-234 = "別說得好像在公園挖沙一樣好不好……"
10053040-235 = "那個，女武神的人都是這樣嗎？"
10053040-236 = "哎呀，我這種程度在女武神根本不算什麼。#n真要說的話，環奈大姐頭可是比我厲害多了呢。"
10053040-241 = "……"
10053040-242 = "我要好好做人。"
10053040-243 = "……我也是。"
10053040-248 = "那麼，我們也差不多……"
10053040-252 = "該下山了吧？"
10053040-253 = "[s13] 「萬歲！！！！」\n[s14] 「不繼續找槌之子了嗎？」"
10053040-254 = "別說的好像我綁架了大家一樣嘛～"
10053040-255 = "雖然抓人確實是我的工作沒錯啦！哈哈哈！"
10053040-259 = "畢竟快到傍晚了，剩下的天數也還算充裕。"
10053040-260 = "而且在看到那種東西之後，實在沒有心情繼續找下去了……"
10053040-265 = "呼……終於結束了。"
10053040-266 = "……付出了這麼多努力，實際的收穫卻是零啊。"
10053040-267 = "如果只花一天就能輕易發現的話，也不會成為傳說中的生物了嘛。"
10053040-268 = "話是這麼說沒錯啦……"
10053040-276 = "嗯？"
10053040-277 = "我好像看到有東西從草叢裡跟了過來……是野生動物嗎？"
10053040-281 = "……！！！"
10053040-282 = "呀啊啊啊啊啊！！！！！"
10053040-286 = "[ns15] 「玲奈……？」\n[ns16] 看向玲奈剛才看著的方向"
10053040-290 = "（明明應該埋在地下8m的石頭人偶，竟然在樹叢之間盯著這邊看……！）"
10053040-291 = "（…………）"
10053040-292 = "（不過總覺得它好像比第一次看到的時候更髒，而且相當疲憊的樣子）"
10053040-293 = "老師～你待在那裡做什麼～？"
10053040-297 = "（稍微移開視線後，石頭人偶就消失不見了）"
10053040-298 = "（……總覺得好像結下了奇怪的怨恨）"
