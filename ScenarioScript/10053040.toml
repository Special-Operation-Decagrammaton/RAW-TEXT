10053040-145 = ""
10053040-146 = ""
10053040-148 = "[ns9] \"ท้าดา...\"\n[ns10] \"เปิดแล้ว\""
10053040-151 = ""
10053040-154 = "นี่มัน... หินเหรอ? เป็นตุ๊กตาที่ทำจากหินสินะ?"
10053040-155 = "มีของอันตรายอยู่ข้างในจริงด้วย!!"
10053040-156 = "อันตรายที่ไหนล่ะ ก็แค่ตุ๊กตาหินธรรมดาๆ เอง ใจเย็นๆ เถอะ...."
10053040-157 = "มันไม่ธรรมดาตั้งแต่ออกมาจากกล่องที่มียันต์ติดไว้แน่นหนาแล้วเถอะนะ?!?!"
10053040-158 = ""
10053040-160 = ""
10053040-161 = ""
10053040-162 = "ถึงนี่จะเป็นเรื่องน่าเสียดายสำหรับฉัน แต่ก็วางใจเถอะ ของชิ้นนี้เป็นของเก๊น่ะ"
10053040-163 = "หะ... หืม? ของเก๊เหรอ?"
10053040-164 = ""
10053040-166 = ""
10053040-167 = ""
10053040-168 = "อย่างแรกเลยนะ ตุ๊กตานี่ไม่ได้ทำจากหิน 100% หรอก เมื่อเทียบกับขนาดแล้ว มันน้ำหนักเบาเกินกว่า#nจะเป็นหินแท้ๆ ส่วนพื้นผิวก็เรียบเกินไปด้วย"
10053040-169 = "ฉันเดาว่ามันน่าจะทำจากพลาสติก... หรือไม่ก็ฝุ่นหินผสมเรซิ่นเพื่อลอกเลียนแบบพื้นผิวของหินขึ้นมา สรุปก็คือ มันน่าจะเป็นสินค้าที่ผลิตครั้งละเยอะๆ ในโรงงานมากกว่าจะเป็นงานฝีมือ"
10053040-170 = "แต่ตรงกันข้าม กล่องใบนี้ทำจากไม้จริงและดูค่อนข้างเก่าแก่ เท่ากับว่าเป็นการจงใจเอากล่องเก่าๆ มาใช้เพื่อให้ตุ๊กตาตัวนี้ดูเหมือนของจริง"
10053040-171 = ""
10053040-173 = ""
10053040-175 = ""
10053040-176 = "เดี๋ยวก่อนนะ แต่คนปกติที่ไหนจะเสียเวลาทำเรื่องแบบนี้เพื่อแกล้งคนอื่น..."
10053040-178 = "ก็นะ ถ้ามองตามหลักความจริงมันก็ใช่ แต่เชื่อมั้ยว่าของจำพวกนี้มีให้เห็นเกลื่อนเลยละ"
10053040-179 = "ส่วนใหญ่แล้วมักสร้างขึ้นเพื่อใช้ในการถ่ายทำวิดีโอ ใช้ในเกม AR หรือการตลาดแบบสร้างกระแส... แต่ก็มีบางกรณีที่แค่ทำมาเก็บไว้โดยไม่มีเหตุผลอะไร"
10053040-180 = "ก็แค่เพื่อดึงดูดความสนใจ... หรือไม่ก็แค่ทำให้ผู้คนที่ไปเจอหวาดกลัวน่ะ ถือว่าเป็นการแกล้งที่ร้ายกาจไม่ใช่เล่นเลย"
10053040-181 = "ฉันรู้จักของพวกนี้ดี เพราะเจอบ่อยๆ ในบ้านร้างและสถานที่ต่างๆ ที่ไปสำรวจน่ะ"
10053040-182 = ""
10053040-184 = ""
10053040-185 = ""
10053040-186 = ""
10053040-187 = "หะ... เห็นมั้ยล่ะ! ฉันบอกแล้วว่าไม่มีอะไร ใช่มั้ยคุณครู?!"
10053040-188 = "[s11] \"หาพรรคพวกเพื่อให้จบเรื่องเหรอ...?\"\n[s12] \"โล่งอกไปทีนะ ถ้าเป็นของปลอม โคโนกะก็คงวางใจได้...\""
10053040-192 = ""
10053040-194 = ""
10053040-195 = "ฉันจะขุดหลุมฝังเดี๋ยวนี้เลยค่ะ!"
10053040-197 = "หืม...?"
10053040-199 = "กันไว้ดีกว่าแก้! ต่อให้จะเป็นการแกล้งกันเล่น แต่ในเมื่อมันแฝงเจตนาร้ายเอาไว้ ก็ถือว่าเป็นของอัปมงคลค่ะ!"
10053040-200 = "ฉันจะปิดผนึกมันไว้ใต้ดินเลย จะได้ไม่มีใครมาเจออีก!"
10053040-201 = "มันก็สมเหตุสมผลอยู่หรอก... แต่ถ้าไม่อยากให้มีใครตกเป็นเหยื่อเพิ่ม เราเก็บมันไว้กับตัวไม่ดีกว่าเหรอ..."
10053040-202 = "ไม่ได้!! ของชิ้นนี้ไม่ควรออกมาจากใต้ดินตั้งแต่แรกแล้ว!!"
10053040-203 = "คราวนี้ฉันจะฝังให้ลึกถึงชั้นเนื้อโลกเลยค่ะ!!"
10053040-205 = "ทุกคน หยิบพลั่วค่ะ!!! เริ่มขุดได้!!!"
10053040-207 = "หะ... หา?!"
10053040-208 = "หืมมมม...?!"
10053040-216 = ""
10053040-217 = "ฮู่ว~ ผนึกไว้ได้สำเร็จ!! เท่านี้ก็คลี่คลายเรื่องนี้ได้แล้ว!!"
10053040-218 = "พอสบายใจแล้ว ก็พลอยสบายกายไปด้วยเลยนะ ทุกคนเป็นเหมือนกันมั้ยคะ? ฮ่าฮ่าฮ่าฮ่า!"
