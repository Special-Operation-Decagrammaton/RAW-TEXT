[translation]
10053040-1 = "제4화;살아 움직이는 돌 인형"
10053040-4 = "오, 공기 좋고!"
10053040-5 = "얼레, 선생님? 왜 그렇게 뒤에 계심까?"
10053040-6 = "[s1] \"조금만, 천천히…….\"\n[s2] \"더는 못 걷겠어…….\""
10053040-9 = "하하, 그게 뭠까! 평소에 운동 좀 하시지."
10053040-14 = "아니! 네가 비정상이라니까?!"
10053040-15 = "아무리 불러도 멈추지도 않고!"
10053040-16 = "하여간, 다들 운동 부족이라니까~ 모 소장은?"
10053040-21 = "흐엑……! 헤엑……!"
10053040-22 = "오! 죽어가고 있구만!"
10053040-23 = "그래도 땀 좀 빼니까 개운하지 않아?"
10053040-24 = "후욱……! 후아아……!"
10053040-25 = "대답할 기운도 없나! 하하하!"
10053040-26 = "웃을 일이 아니라니까……!"
10053040-33 = "후우…… 겨우, 첫 번째 포인트에 도착했나……."
10053040-34 = "근데 진짜로 여기가 목적지야? 아무것도 없는데?"
10053040-35 = "자, 잠깐 숨 좀 돌리고……."
10053040-40 = "맞아. 여기가 시라카와 산의 첫 번째 탐색 스팟이야."
10053040-41 = "아무것도 없다고 느껴지는 것은 당연해. 상식적으로 사람이 다니는 길이었다면, 츠치노코는 진작 발견됐거나, 어디론가 도망쳤을 테니까."
10053040-42 = "그건, 맞는 말이기는 한데……."
10053040-46 = "진짜, 진짜로 마지막으로 물어보는데."
10053040-47 = "여길 다 뒤질 거야? 있을지도 모를 뚱뚱한 뱀을 찾아서, 이 산 전체를?"
10053040-52 = "……만약, 그 산에."
10053040-53 = "츠치노코가 있다면야."
10053040-57 = "(30분 후)"
10053040-61 = "…………."
10053040-66 = "잠깐! 시작한 지 얼마나 됐다고, 벌써 그렇게 뻗는 거야!"
10053040-67 = "나, 방금 잠깐 유체 이탈했어…… 고로, 영혼은 존재한다…… q. e. d."
10053040-68 = "대체 뭔 헛소리래……."
10053040-69 = "선생님은……."
10053040-70 = "[ns5] \"오랜 데스크 워크로 인한 근육통이……!\"\n[ns6] (대답이 없다. 평범한 시체인 듯하다.)"
10053040-73 = "둘 다 진짜 못 미덥다……."
10053040-74 = "……? 왜 그렇게 히죽거리고 있어?"
10053040-75 = "응? 나?"
10053040-76 = "몰랐어? 입꼬리가 귓가에 걸렸던데?"
10053040-77 = "아, 그랬나……. 아니, 별건 아니고."
10053040-78 = "그냥, 다 같이 무언가 하는 건 즐겁구나, 싶어서."
10053040-79 = "……아, 그래."
10053040-80 = "저기, 이거는 그냥 궁금해서 물어보는 건데."
10053040-81 = "츠바사는 부 활동이라든지 안 해?"
10053040-82 = "그러면 좀 더 사람들이랑 많이 활동할 수 있을 거라 생각하는데……."
10053040-83 = "아."
10053040-87 = "그게, 뭐라 설명해야 할까. 외부인에게 설명하려니까 좀 난이도가 높네."
10053040-88 = "정확히는, 했는데, 할 수 없게 되었다고 해야 할까……."
10053040-89 = "그, 우리 동아리는……."
10053040-90 = "폐부됐거든. 실적이나, 이런저런 이유로."
10053040-91 = "…………미안."
10053040-92 = "아, 아니! 괜찮아! 딱히 동아리를 포기하거나 하지는 않았으니까!"
10053040-93 = "밀레니엄은 실적 중시 학원이니까. 어쩌면 이번 탐사에 츠치노코를 발견하면, 그걸 기반으로 동아리가 부활할지도 모르고!"
10053040-94 = "폐부된 동아리가 부활했다는 얘기는 못 들어보긴 했지만……"
10053040-95 = "일단, 협력은 할게. 그거와 별개로, 츠치노코는 아마 없다고 생각하지만."
10053040-96 = "물론이야. 틀린 이론이라면, 그것을 입증하는 것 또한 중요한 일이니까."
10053040-97 = "그보다, 아까부터 코노카가 안 보이는데?"
10053040-98 = "아, 그러고 보니, 뭔가 찾은 거 같다고 소리치면서 달려가는 것까지는 봤는데."
10053040-99 = "혹시 무슨 일이 생길 수도 있으니까 잘 지켜봐야지. 코노카는 우리 중에 제일 연약하니까."
10053040-100 = "……진심?"
10053040-101 = "응? 무슨 뜻?"
10053040-103 = "으, 으아아아……."
10053040-104 = "뭐야, 지금 그 힘 빠지는 비명은?!"
10053040-105 = "설마 코노카 군에게 무슨 일이?! 서두르자!"
10053040-109 = "……으아아, 으아…… 서, 선생님…… 도와주십……."
10053040-110 = "[s7] \"무슨 일이야, 코노카?!\"\n[s8] \"얼굴이 창백해!\""
10053040-113 = "그게…… 뭔가 바닥에 묻혀 있길래…… 파봤는데요……."
10053040-118 = "조졌슴다."
10053040-119 = "뭐, 뭐야, 이거? 엄청 불길하게 생겼는데?"
10053040-120 = "낡은 목조 함이네. 정확한 연식은 알아봐야 하겠지만……."
10053040-121 = "그래도 종이처럼 보존성이 낮은 재질의 부적이 멀쩡한 걸 봐서는, 그렇게 오래된 물건은 아닐 거야."
10053040-122 = "지금 그렇게 차분하게 분석할 때 아니거든?! 이거 진짜 장난 아님다!!"
10053040-126 = "어, 어, 어, 어떻게 하죠?! 지금에라도 다시 원래 자리에 갖다 놓으면 괜찮을까요?! 땅 팔까요?!"
10053040-127 = "잠깐. 이걸 열어보지 않는다고?"
10053040-129 = "열겠냐고!!!!"
10053040-134 = "아니, 들어봐. 현대에는 파마, 화피와 같은 부정적 의미의 부적만이 미디어로 조명되어 그렇지, 부적 그 자체는 불길한 물건이 아니야."
10053040-135 = "오히려 길한 물건이라 볼 수 있지. 본래는 기원과 소망을 담는 것이 주된 쓰임새였으니까."
10053040-136 = "최소한 얘는 아니거든?! 이거는 누가 봐도, 빼박 저주거든?!"
10053040-137 = "알았다!! 너 수속성이지?! 화속성인 나한테 악재를 가져오려는 거지?!"
10053040-139 = "나, 나도 그냥 다시 묻는 게 좋을 거 같은데……."
10053040-140 = "따, 딱히 저주 같은 걸 믿는다는 건 아니지만! 남이 묻은 물건을, 어떤 사연이 있는지도 모르는데, 멋대로 열어보는 건 실례잖아!"
10053040-142 = "흐음……."
10053040-148 = "[ns9] \"아…….\"\n[ns10] \"열었다.\""
10053040-154 = "이건, 석상인가? 돌로 만든 인형이네."
10053040-155 = "진짜로 위험한 물건이 나왔잖아!!"
10053040-156 = "아니, 그냥 평범한 돌 인형이니까 진정해……."
10053040-157 = "부적으로 칭칭 감아 둔 상자에서 돌 인형이 나온 시점에서 평범하지 않거든?!?!"
10053040-162 = "괜찮아. 나에게는 유감스러운 일이지만, 이건 가짜니까."
10053040-163 = "으, 응? 가짜?"
10053040-168 = "일단, 이건 100% 돌로 되어 있지 않아. 돌치고는 부피 대비 무게가 가볍고, 표면 질감이 지나치게 일관되어 있어."
10053040-169 = "내 추측으로는, 아마 플라스틱…… 레진에 돌가루를 섞어서 질감을 흉내 낸 물건이 아닐까 싶어. 즉, 수공예품보다는, 높은 확률로 양산품이겠지."
10053040-170 = "그에 비해, 상자는 진짜 나무로 되어 있고, 꽤 연식도 있어 보여. 즉, 이 돌 인형을 진품처럼 보이게 하려고, 일부러 낡은 상자를 구했다는 뜻이야."
10053040-176 = "……아니, 아무리 그래도, 어떤 할 일 없는 사람이 이렇게 정성스럽게 장난을……."
10053040-178 = "뭐, 상식적으로 생각하면 그렇지만, 의외로 이런 물건은 꽤 있는 편이야."
10053040-179 = "주로 영상 촬영, 증강 현실 게임, 노이즈 마케팅 등의 콘텐츠 목적이지만…… 드물게 아무 이유 없이 만들어 숨겨두는 경우도 있어."
10053040-180 = "분명, 관심을 끌거나…… 그냥 순수하게 발견자를 겁주려는 목적으로 말이야. 살짝 질이 나쁜 장난인 셈이지."
10053040-181 = "특히, 내가 주로 다니는 폐가 등에서는 자주 발견되어서 잘 알아."
10053040-187 = "거, 거 보라니까! 내가 별거 아니랬지, 선생님?!"
10053040-188 = "[s11] \"……? 나를 걸고넘어진다고?\"\n[s12] \"그래도 다행이네. 가짜라면, 코노카도 안심…….\""
10053040-195 = "지금부터 땅을 팝니다!"
10053040-197 = "……엥?"
10053040-199 = "만에 하나! 아무리 장난이라 해도, 악한 의도가 담긴 이상, 불길한 물건임은 틀림없슴다!"
10053040-200 = "그러니까, 이번에는 확실하게, 아무도 꺼내지 못하게 땅속으로 다시 봉인함다!"
10053040-201 = "어느 정도 일리는 있지만…… 피해자를 늘리지 않기 위해서는, 그냥 우리가 수거하는 게……."
10053040-202 = "아니!! 애초에 이건 지상에 나와서는 안 되는 물건이었어!!"
10053040-203 = "이번에야말로 맨틀 밑까지 묻어버릴 검다!!"
10053040-205 = "다들, 삽을 듭니다!!! 실시!!!"
10053040-207 = "어, 어?!"
10053040-208 = "……어어어?!"
10053040-217 = "휴~ 봉인 완료!! 이걸로 해결!!"
10053040-218 = "마음이 홀가분하니 몸도 가볍네. 다들 안 그렇슴까? 하하하하!"
10053040-223 = "하아…… 하아…… 아니, 쟤는, 지치지도 않나……."
10053040-224 = "………."
10053040-229 = "혼자서 거의 10m는 파지 않았어……?"
10053040-230 = "마지막으로 측정했을 때, 8m였어……."
10053040-232 = "에이, 다들 그거 쪼끔 움직여 놓고, 무슨 엄살이 그리들 심함까."
10053040-233 = "고작 흙 조금 판 거 가지고."
10053040-234 = "무슨 놀이터 흙 파는 것처럼 말하지 말라고……."
10053040-235 = "저기, 발키리는 다들 이래?"
10053040-236 = "에이, 나 정도는 발키리에서 아무것도 아니야. 나보다는 칸나 누님이 훨씬 대단하지."
10053040-241 = "……."
10053040-242 = "난 착하게 살아야지."
10053040-243 = "……나도."
10053040-248 = "그러면, 이제 슬슬……."
10053040-252 = "내려갈까요?"
10053040-253 = "[s13] \"만세!!!!\"\n[s14] \"츠치노코는 더 안 찾아?\""
10053040-254 = "누가 보면 제가 잡아둔 줄 알겠슴다."
10053040-255 = "물론, 사람 잡아 두는 게 제 일이긴 한데요, 하하하!"
10053040-259 = "슬슬 저녁이니까요. 아직 날짜에는 여유가 있고."
10053040-260 = "……뭣보다, 그런 걸 보고 나서는 더 찾을 기분이 아니라고 할까……."
10053040-265 = "휴우…… 겨우 끝났네."
10053040-266 = "……하지만 이 고생을 했는데, 실질 수확 제로인가."
10053040-267 = "뭐, 하루아침에 쉽게 발견된다면, 전설의 생물이 아니었을 테고."
10053040-268 = "그 말도 맞긴 한데……."
10053040-276 = "응?"
10053040-277 = "수풀에서 뭔가 따라오는 걸 본 거 같은데……. 야생동물?"
10053040-281 = "……!!!"
10053040-282 = "꺄아아아아아악!!!!!"
10053040-286 = "[ns15] \"레나……?\"\n[ns16] 레나가 봤던 장소를 본다."
10053040-290 = "(분명 지하 8m에 묻었을 돌 인형이 나무 사이에서 우릴 지켜보고 있었다……!)"
10053040-291 = "(………….)"
10053040-292 = "(그런데, 어째 처음 봤을 때보다 훨씬 꼬질꼬질하고, 왠지 굉장히 지쳐 보인다.)"
10053040-293 = "선생님~ 거기서 뭐하심까~?"
10053040-297 = "(잠깐 눈을 돌리자, 돌 인형은 사라지고 없었다.)"
10053040-298 = "(……어쩐지, 부조리한 원한을 산 듯하다.)"
