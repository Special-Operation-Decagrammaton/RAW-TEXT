[translation]
34110-1 = "제11화;추격자"
34110-2 = "미소노, 미카……."
34110-3 = "여기서는 마치 악당 등장☆ 같은 느낌으로! 응. 나야. 아직 기억하고 있었네?"
34110-4 = "반가운 얼굴이지, 사오리? 응? 그런데 뭐야뭐야? 표정이 왜 그래? 마치……."
34110-5 = "……마녀라도 본 것처럼?"
34110-6 = "……탈출한 건가. 감옥에서."
34110-7 = "응, 뭐. 그렇게 됐어. 너희를 빨리 만나고 싶어서 말야."
34110-8 = "아직 우리들, 해결해야 할 문제가 남아 있잖아?"
34110-13 = "……."
34110-14 = "(소근) ……선생은?"
34110-15 = "지, 지금 뒤따라오고 있을 거예요……. 아마 몇 분 내에 도착할 거예요……."
34110-17 = "어떻게 여기를 알고 있었냐고? 응, 그거야 나도 너희가 쓰는 그 방법, 몇 번이나 봤었거든. 뭐야? 나는 그 정도의 머리가 없을 거라고 생각했던 거야?"
34110-19 = "통로가 막히기까지 남은 시간은?"
34110-20 = "약 28분. 싸울 셈이야? 지금 저 여자와 교전하면 우리에게 승산이 높지 않아."
34110-21 = "그, 그런가요?!"
34110-22 = "……."
34110-23 = "체력적으로 한계에 다다른 우리는 철저하게 전술적 우위를 가진 통제된 전장에서 싸워야만 해."
34110-24 = "이쪽에는 선생님의 지휘라는 서포트도 있으니까 지금까지는 그게 통하기도 했고."
34110-25 = "미소노 미카는 티파티의 무력 그 자체이기도 해. 이런 식의 지휘 계통과 전술이 통하지 않는 난전이야말로 그녀에게 가장 유리한 전장이야."
34110-27 = "멍청한 여자라고 생각했어? 응, 그러네. 그치만 나도 너희들의 음어 정도는 대충 계산할 수 있어."
34110-28 = "응, 너희 집결지라든가 중요 포인트 같은 것도 아직 기억하고 있고. 이래 봬도 쿠데타를 일으켰던 장본인이잖아? 응, 나도 나름대로 학원에선 거물인데."
34110-29 = "음…… 바보라고 생각하고 있었을 수도 있겠네……. 그야, 속이기도 쉽고 이용하기도 쉬웠을 테니까. 응. 그건 부정하기가 힘드네……."
34110-32 = "후퇴해서 재정비하는 건?"
34110-33 = "불가능해. 곧 통로가 닫힐 거야. 시간이 없어."
34110-34 = "선생님이 도착할 때까지 시간을 끄는 건?"
34110-35 = "그건……."
34110-37 = "어라? 저기? 내 말 듣고 있어? 무시하는 거야? 응? 너무하잖아. 그래도 한때 같이 음모를 꾸미던 사이였는데."
34110-38 = "이거 완전 괴롭힘이잖아?"
34110-48 = "오, 옵니다?!"
34110-50 = "흩어져! 정면으로 맞붙지 마라!"
34110-61 = "[ns1] (앞장서서 상황을 정리하기로 했던 스쿼드가 연락이 되지 않는다.)\n[ns2] (게다가 방금 전 그 총격음은…….)"
34110-67 = "[ns] (서둘러 쫓아가자.)"
34110-76 = "으, 으으…… 너무 빨라요……. 게다가 너무 강해……."
34110-83 = "크윽……."
34110-88 = "뭐야, 뭐야뭐야? 이게 끝이야? 사오리?"
34110-89 = "허수아비도 너보다는 잘 싸울 거 같은데? 이 정도는 아니었잖아, <스쿼드>는. 왜 그런 거야? 부상 때문이야? 아하하. 엄청 한심한 모습. 완전 웃겨."
34110-94 = "크윽……."
34110-95 = "으응? 그러고 보면 한 명이 안 보이네? 가면을 쓰고 한마디도 하지 않던 조용한 여자애는 어디 갔어? 뭐, 상관없나. 금방 찾아줄 테니까."
34110-97 = "……!!"
34110-99 = "자아, 사오리, 총알이라도 떨어졌어? 왜 그렇게 멍청하게 서 있어? 더 쏘지 않는 거야? 자아, 내가 이렇게 무방비하게 서 있잖아. 응?"
34110-103 = "크, 크으윽……."
34110-104 = "미사키……!"
34110-105 = "으응, 그런가. 너희 같은 애들도 역시 동료는 소중한 거지? 임무 때문에 함께 있는 거라고 생각했었는데."
34110-106 = "뭐. 마음에 안 들지만 그래도 소중한 관계도 있을 수 있다고 생각해. 응, 이해해. 나에게도 그런 사람이 있었거든. 너희들이 죽이려고 했던 세이아 쨩 말이야."
34110-107 = "하아…… 정말이지, 속으론 몇 번이나 때려버리고 싶었는지 몰라. 세이아 쨩은 사람을 진짜 화나게 만든다니까."
34110-108 = "그치만 그러면서도 막상 다치기라도 하면 불안해지고, 걱정되어서 다른 생각은 전혀 할 수 없고……."
34110-109 = "세이아 쨩이 죽었다는 이야기를 들었을 땐 제정신이 아니게 되어버리고……. 정말이지 성가시지 않아? 사람의 마음이라는 건."
34110-110 = "미워하고 괴롭히고 싶어도, 그래도 나에겐 소중한 사람인데…… 응, 죽기를 바란 건 아니었어……. 살인자가 될 생각도 없었어……."
34110-111 = "그런데…… 이젠…… 다 소용없어져 버렸어……."
34110-122 = "크아아아아아-!!"
34110-124 = "미사키!!"
34110-126 = "내가 혼내주라고 했지, 언제 헤일로를 부수라고 했어?"
34110-127 = "뭐, 제멋대로 날뛰다가 혼자서 일을 망친 주제에 지금 와서 피해자 행세냐고 한다면…… 그 말도 틀린 건 아니야……."
34110-128 = "그런데……."
34110-129 = "나는…… 그 뒤로 소중한 걸 다 빼앗겨버렸어……."
34110-130 = "학원도…… 친구도…… 집도…… 돌아갈 곳도…… 선생님과의 약속도……."
34110-131 = "내일이 되면 모든 게 원래대로 돌아갈지도 모른다고 믿었는데……. 역시 그런 건 없는 거야……. 응, 정해진 건 바꿀 수 없는 건가 봐……."
34110-132 = "그러니까……, 아리우스 스쿼드, 사오리. 너희도 나와 똑같은 고통을 느끼지 않으면 안 돼."
34110-133 = "내가 잃은 만큼 너희도 잃지 않으면 안 돼. 그야, 그래야 공평한 거잖아?"
34110-138 = "……!!"
34110-146 = "[ns] \"그만둬-!!\""
34110-151 = "서, 서, 서…… 선생님?!"
34110-152 = "선생……."
34110-153 = "[ns] \"미카! 여기서 뭘 하는 거야!?\""
34110-154 = "나, 나는……, 어…… 그러니까……."
34110-155 = "어, 어째서……?!"
34110-156 = "저, 저기…… 서, 선생님?! 어, 어째서 스쿼드와 함께 있는 거야……?"
34110-157 = "이, 이게 아닌데……"
34110-158 = "어…… 어째서 이렇게 되는 거야…… 왜 하필 절대로 보여주고 싶지 않은 모습을 어, 어째서……. 하필……."
34110-164 = "이쪽이다!!"
34110-165 = "미소노 미카도 있다! 쏴!!"
34110-175 = "[ns] \"미카……!!\""
34110-176 = "(쿨럭) 시간이 없어……. 선생님…… 아리우스의 추격이 붙었어. 지금 바로 들어가야 해."
34110-177 = "[s3] \"미카! 트리니티로 돌아가! 나중에 돌아가서 설명할 테니까!\"\n[s4] \"트리니티에서 기다리고 있어! 반드시 돌아갈 테니까!\""
34110-178 = "저쪽이다! <스쿼드>가 저기 있어!"
34110-179 = "저쪽이다! <스쿼드>가 저기 있어!"
34110-183 = "서, 서둘러야 해요! 이제 곧 통로가 막힐 거예요!"
34110-184 = "[s] 스쿼드와 함께 카타콤으로 들어간다."
34110-185 = "달려!"
34110-203 = "하아, 하아……. 세, 세이프……."
34110-204 = "간신히…… 까진 아니네. 아직 시간이 남아 있어. 추격이 붙기 전에 서둘러야 해."
34110-205 = "멈추지 말고 바로 이동한다. 선생, 여기서부터는 길이 복잡하니 잘 따라와 줘."
34110-206 = "여, 여기는 전파도 통하지 않으니까…… 길을 잃으면 연락도 안 되고 전부 끝장이니까요……."
34110-207 = "이곳을 지나면 아리우스 자치구야. 가자."
34110-212 = "[ns] (미카……)"
34110-214 = "[ns5] (스쿼드에게 복수하기 위해 탈옥한 걸까?)\n[ns6] (트리니티에 무슨 일이 벌어지고 있는 걸까……?)"
34110-218 = "카타콤으로 도망쳤습니다! 쫓을까요?"
34110-219 = "아직 시간이 남아 있어! 뒤쫓는다!"
34110-225 = "아프잖아!"
34110-227 = "미소노 미카……?!"
34110-233 = "흐응. 지원군이야?"
34110-234 = "미소노 미카. 너는 한때 우리 자치구를 지원해주었었지. 옛정을 생각해서 지금 이곳에서 사라질 것을 권한다."
34110-235 = "뭐야뭐야. 이 정도 숫자로 날 상대하겠다는 거지? 저기, 계산은 확실하게 한 거야?"
34110-236 = "재미있네. 이 내가 혼자 있다고 이길 수 있을 거라고 생각한 거야? 머리 나쁘면 일상생활 여러모로 힘들지 않아?"
34110-237 = "<스쿼드>는 어딜 간 거야? 도망쳤나? 도망칠 시간을 벌어주고 싶은 거야?"
34110-238 = "아니, ……우리가 쫓고 있는 건 <스쿼드>다."
34110-239 = "……응? 뭐라고?"
34110-241 = "<스쿼드>는 아리우스를 배신하고 도망쳤어. 그들을 처분하는 게 우리 임무다."
34110-242 = "잠깐잠깐. 무슨 소리야? 배신? 도망?"
34110-247 = "……."
34110-248 = "아하하하하하-. 그런 거야? 재미있네. 버림받았어? 같은 편한테? 어쩌다가?"
34110-249 = "……응, 그렇구나. 사오리. 이게 네 결말이야? 기르던 사냥개가 사냥에 실패하면 이렇게 되는 거네. 응."
34110-250 = "……그렇구나."
34110-251 = "선생님은……. 응."
34110-252 = "선생님, 또 위기에 빠진 아이를 구하기 위해 위험을 무릅쓰고 있는 거였구나."
34110-253 = "정말이지……."
34110-254 = "……그렇구나."
34110-255 = "비켜라, 미카. 지금이라면 눈감아주겠다."
34110-256 = "보고입니다! 스쿼드에 <샬레>의 선생이 동행하고 있다고 합니다!"
34110-257 = "뭐?! 뭐라고?! 당장 그녀에게 보고를……."
34110-266 = "저기, 저기. 내가 하는 말 못 들었으려나? 스쿼드는 내 거야. 그 누구에게도 넘겨주지 않을 거야."
34110-267 = "그러니까 꺼져줄래? 남의 것에 함부로 손 대면 어떻게 되는지 알지 않아? 응, 역시 잘 모르려나……."
34110-272 = "쏴. 쏴라!!"
34110-289 = "다음화;아리우스 자치구"
