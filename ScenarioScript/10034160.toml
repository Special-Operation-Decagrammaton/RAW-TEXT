[translation]
10034160-1 = "3일 전: 나약한 생명체"
10034160-3 = "……끄응……."
10034160-4 = "……아이리? 무슨 일이야?"
10034160-5 = "아, 아무것도 아니야. 그냥 좀 뻐근해서……. 헤헤."
10034160-6 = "아무것도 아닌 게 아니잖아. 명백히 곡소리였다고, 방금."
10034160-7 = "사실 나도 여기저기 꽤 뭉쳐 있다는 느낌을 받고 있고 말이지. 역시 같은 자세로 계속 비슷한 행동만 하니까……."
10034160-9 = "아니, 말은 똑바로 하자, 요시미. 안 하던 운동을 갑자기 하니까-잖아."
10034160-10 = "쓰, 쓸데없는 참견이시네!! 그러는 너는 괜찮냐!?"
10034160-11 = "완전 멀쩡한데."
10034160-12 = "어째서!? 그렇게나 움직였는데!?"
10034160-14 = "네 주제를 알아라! 나약한 생명체야!!"
10034160-15 = "알량한 자신의 신체가 괴묘 카스팔루그랑 똑같은 줄……."
10034160-22 = "내가 죽여버린다고 했지!!!"
10034160-23 = "표현의 자유!! 모든 사람은 표현의 자유에 대한 권리를 가진다!!"
10034160-24 = "이 권리는 공권력의 제한을 받지 않고……!!"
10034160-28 = "아아아악-!!"
10034160-41 = "……일단 시작할까? 요시미 쨩."
10034160-42 = "어."
