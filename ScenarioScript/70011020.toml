[translation]
70011020-1 = "The Melancholy of Kanbara Misuzu 2"
70011020-2 = "So, how much are they worth?"
70011020-6 = "What...?"
70011020-7 = "Um, perhaps you misheard me. I was asking if you have any friends on the outside."
70011020-8 = "Let's assume I get myself some. How much can I make off them?"
70011020-9 = "...I'm having a hard time understanding your thought process. One doesn't usually make friends for financial gain..."
70011020-10 = "Then they're useless to me. Trash."
70011020-11 = "Well, there are many things in this world that can't be bought with money..."
70011020-12 = "Hey."
70011020-13 = "Can't be bought with money? Hah. Funny, funny."
70011020-14 = "Don't waste my time. You're just fluffing your own ego."
70011020-15 = "Th-That's not what I meant at all. I... I..."
70011020-17 = "...Hey."
70011020-19 = "HEY!"
70011020-20 = "Yes?!"
70011020-21 = "I wasn't sure, but did you...actually fall asleep? Right in front of me?!"
70011020-22 = "Oh, I'm terribly sorry. I was just so tired..."
70011020-23 = "But it's the morning. Did you pull an all-nighter, lady?"
70011020-24 = "Well, I guess you could say that, heehee..."
70011020-25 = "...But, more importantly... Do you know why you're here with me?"
70011020-26 = "Well, yeah. I can imagine."
70011020-27 = "I'm not interested in interrogating you. But I was curious. What's been so unsatisfactory about your stay here?"
70011020-28 = "Not much."
70011020-29 = "Not much... Not a bad answer. That's one I like to hear."
70011020-30 = "But that doesn't make it a \"good answer,\" either. I reviewed your school records, but I felt they didn't capture YOUR story."
70011020-31 = "What drove you to escape? What made you want to do that?"
70011020-32 = "...Look, I didn't have any particular reason or anything."
70011020-33 = "I just thought I could pull it off. So I tried. That's it."
70011020-34 = "..."
70011020-35 = "...May I ask where that confidence came from?"
70011020-36 = "When I was on the outside, I heard that seven whole inmates escaped, and no one even caught them."
70011020-37 = "I think, uh, they were called the \"Seven Prisoners\" or something."
70011020-38 = "So I thought... Why not give it a try?"
70011020-39 = "Seven students escaped. That is true."
70011020-40 = "But, if I may expand on that... In all our history, they are the ONLY seven."
70011020-41 = "The Corrections Bureau has a perfect record otherwise. We have thwarted any and all other escape attempts."
70011020-42 = "...? That's not what I heard. Everyone's saying this place is a joke."
70011020-43 = "The \"Fox of Calamity\" walks in and out like she owns the place. You know, Whack-a-mole?"
70011020-44 = "Wakamo."
70011020-45 = "..."
70011020-46 = "Let's stay focused on you. We don't need to discuss anyone else."
70011020-47 = "I wish for you to understand that the Corrections Bureau isn't here to bully or berate you."
70011020-48 = "Students are moved to the Corrections Bureau because their original campuses have no other recourse...or because they have an unclear academic history."
70011020-49 = "Most of the time, we are here to manage problematic students who are too much for a single school to handle..."
70011020-50 = "Harsh."
70011020-51 = "...The standards are subjective. Gehenna never sends their students, but stricter schools will ship off any student who steps a single toe over the line."
70011020-52 = "All that is to say... Just because you're here, at the Corrections Bureau, doesn't mean you deserve a negative reputation or scorn."
70011020-53 = "What is this, some attempt at making me feel better?"
70011020-54 = "In a way, yes..."
70011020-55 = "...Still, despite everything I said, Valkyrie Police School is in charge of Kivotos' security. We can't allow disruptive students to simply do as they please."
70011020-56 = "However, that also means that once we're confident that a student has been rehabilitated and won't misbehave, we are at liberty to release them as we see fit."
70011020-57 = "To be absolutely clear, the Corrections Bureau is NOT a prison."
70011020-58 = "If, after reflecting, you demonstrate that you have changed your ways, you're free to go. No escape has ever been necessary."
70011020-59 = "Okay, fine. I'll reflect on my actions or whatever."
70011020-63 = "I have one more question for you. It's very important."
70011020-64 = "Why did you attempt to escape?"
70011020-65 = "What? I just told you. That's it! I just wanted to."
70011020-66 = "You thought you could... And, what did you intend to do if you were successful?"
70011020-67 = "...It looks like you already have an answer in mind, so why don't you just tell me?"
70011020-68 = "I don't have YOUR answer. Not at all. I won't have the faintest idea until you tell me what's on your mind."
70011020-69 = "...Fine! I'll spill it! But you better not laugh!"
70011020-73 = "Today's my...birthday, okay?"
70011020-74 = "But I was just thrown in here a couple of days ago. I haven't made a lot of friends, or anything..."
70011020-75 = "So I thought it would be fun to celebrate with my buds! I wasn't going to stay out forever. I'd have come back."
70011020-76 = "...I see."
70011020-77 = "Hmph. Not that I expect you to believe me."
70011020-78 = "I'm sorry if I give you that impression."
70011020-84 = "Excuse me, security? Can you bring me the item I requested?"
70011020-85 = "Yes, ma'am. We've been holding it for you."
70011020-87 = "...? What is that?"
70011020-88 = "...I was hoping to give this to you under more pleasant circumstances, so I apologize for the mood."
70011020-89 = "Happy birthday. I knitted this hat myself."
70011020-96 = "H-Huh...?"
70011020-97 = "I thought that a pastel tone would complement your wonderful blonde hair, so I used light pink yarn. I do hope you like it."
70011020-98 = "No, wait. You knew it was my birthday...? And you made a present?"
70011020-99 = "You're in my care, and it's a precious day. A birthday only happens once a year, after all."
70011020-100 = "I'm sure spending it in the Corrections Bureau is frustrating. I was hoping this could help you feel better, but..."
70011020-101 = "I'm sure it won't be enough."
70011020-102 = "If I may ask, could you share your friends' contact information with me?"
70011020-103 = "...What?"
70011020-104 = "I would like to invite them to the Corrections Bureau. Wouldn't it be nice if you could all have a little party together? You deserve to feel special."
70011020-105 = "...Are you sure?"
70011020-106 = "Whatever do you mean?"
70011020-107 = "Well, I'm a prisoner who just attempted to escape, you know?"
70011020-108 = "You have it backwards. As I've been saying, the Corrections Bureau isn't a prison."
70011020-109 = "...So you are not a prisoner. You never have been."
70011020-111 = "Nice work, ma'am!"
70011020-112 = "She was crying like a baby on her way out! Amazing."
70011020-113 = "It does hurt my heart to think she was crying on her special day..."
70011020-114 = "Oh, it's not because she was sad!"
70011020-115 = "I finally understand why you have such a reputation, Director! You really are changing lives."
70011020-116 = "...As I've been saying, they're the ones who do all the hard work. I'm just someone to talk to."
70011020-117 = "If the other party isn't willing to share..."
70011020-118 = "...or has a thought process beyond my capability... I can't do anything."
70011020-119 = "A different \"thought process\"?"
70011020-120 = "Oh, I'm sorry. I misspoke. Please, forget I said anything."
70011020-121 = "Thank you for all your help this morning!"
70011020-122 = "Not at all. Just doing my job, ma'am! Please call if you need anything!"
70011020-127 = "...They were real. They were here, and impossible to talk to, to connect with. They didn't even seem to come from this world."
70011020-129 = "...Those \"prisoners.\""
70011020-137 = "The newly-appointed director, Kanbara Misuzu, will share some words. Please welcome her with—"
70011020-141 = "Emergency! Prisoners have escaped!"
70011020-142 = "Seven of them! Seven of them, gone without a trace!"
70011020-143 = "It's a group escape!"
70011020-145 = "That day, Kanbara Misuzu was made Director of the Corrections Bureau."
70011020-146 = "That year, the number of applicants to the Corrections Bureau dropped by 80%."
70011020-147 = "The Melancholy of Kanbara Misuzu"
