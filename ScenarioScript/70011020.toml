[translation]
70011020-1 = "ความกลัดกลุ้มของคันบาระ มิซึสึ 2"
70011020-2 = "แล้วจะให้เท่าไรล่ะ?"
70011020-3 = ""
70011020-5 = ""
70011020-6 = "คะ...?"
70011020-7 = "เอ่อ ได้ยินผิดไปหรือเปล่าคะ? ฉันถามว่ามีเพื่อนอยู่ข้างนอกบ้างหรือเปล่าต่างหากค่ะ"
70011020-8 = "ก็นะ สมมติว่ารับทำก็แล้วกัน แล้วฉันจะได้เงินจากงานนั้นเท่าไรล่ะ?"
70011020-9 = "ฉันไม่ค่อยเข้าใจความหมายเลยค่ะ... เราสร้างมิตรภาพโดยหวังสิ่งตอบแทนอย่างเช่นเงินทอง#nไม่ได้หรอกนะ..."
70011020-10 = "ถ้างั้นก็ไม่มีประโยชน์น่ะสิ"
70011020-11 = "คือว่า... โลกนี้มีสิ่งล้ำค่าหลายอย่างนะคะที่ไม่อาจแลกด้วยเงินได้..."
70011020-12 = "นี่"
70011020-13 = "เปลี่ยนเป็นเงินไม่ได้งั้นเหรอ? เฮอะ"
70011020-14 = "งั้นก็อย่ามาทำให้ฉันเสียเวลาเพื่อตอบสนองความต้องการของเธอเลย"
70011020-15 = "มะ... ไม่ใช่อย่างนั้นนะคะ... ฉัน... คือฉัน..."
70011020-17 = "นี่..."
70011020-19 = "นี่!"
70011020-20 = "เฮือก?!"
70011020-21 = "นี่เธอมาหลับงั้นเหรอ? สั่งให้คนอื่นมานั่งตรงหน้าแท้ๆ"
70011020-22 = "อ๊ะ ขอโทษค่ะ พอดีฉันเหนื่อยนิดหน่อย..."
70011020-23 = "แต่นี่มันตอนเช้านะ ไม่ได้นอนมาหรือไง?"
70011020-24 = "ก็... ทำนองนั้นน่ะค่ะ แหะๆๆ..."
70011020-25 = "ว่าแต่... พอจะทราบมั้ยคะว่าถูกเรียกตัวมาด้วยเรื่องอะไร?"
70011020-26 = "อ้อ เรื่องนั้นน่ะ ก็ต้องรู้สิ"
70011020-27 = "ฉันไม่ได้จะซักไซ้อะไรหรอกค่ะ ว่าแต่มีปัญหาหรือความไม่สะดวกอะไรในชีวิตประจำวันหรือเปล่าคะ?"
70011020-28 = "ก็ไม่นะ"
70011020-29 = "ก็ไม่งั้นเหรอคะ... เป็นคำตอบที่ไม่เลวเลยนะคะ"
70011020-30 = "แต่ในทางกลับกัน มันก็ไม่ใช่คำตอบที่ดีด้วยค่ะ ที่จริงฉันดูบันทึกการใช้ชีวิตประจำวันมาแล้วค่ะ แต่จากเอกสารอย่างเดียวคงบอกอะไรไม่ได้"
70011020-31 = "ว่าแต่ทำไมคุณถึงพยายามจะหลบหนีออกไปเหรอคะ? มีเรื่องอะไรไม่สบายใจหรือเปล่าคะ?"
70011020-32 = "ก็ไม่ได้มีเหตุผลอะไรเป็นพิเศษหรอก..."
70011020-33 = "ฉันแค่เชื่อว่าตัวเองก็น่าจะทำได้เหมือนคนอื่นน่ะ ฉันก็เลยลองทำดูบ้าง"
70011020-34 = "..."
70011020-35 = "มีเหตุผลอะไรสนับสนุนความเชื่อนั้นเหรอคะ...?"
70011020-36 = "ก็ตามที่ฉันได้ยินมา เห็นว่ามีคนแหกคุกออกไปได้ตั้งเจ็ดคนเลยไม่ใช่เหรอ"
70011020-37 = "เห็นว่าเรียกกันว่าเจ็ดอาชญากรหรืออะไรทำนองนั้นน่ะ"
70011020-38 = "ฉันก็เลยคิดว่าตัวเองก็น่าจะทำได้บ้าง"
70011020-39 = "มีคนหลบหนีไปได้เจ็ดคน นั่นเป็นเรื่องจริงค่ะ"
70011020-40 = "ตรงกันข้าม นั่นก็ยังหมายความว่ามีเพียงเจ็ดคนเท่านั้นที่หนีรอดไปได้"
70011020-41 = "นับตั้งแต่ก่อตั้งสำนักควบคุมขึ้นมา เราก็ไม่เคยปล่อยให้ใครหลบหนีไปได้อีกเลยนอกจากเจ็ดคนนั้น แม้กระทั่งในตอนที่เกิดเหตุนั้น พวกเราก็ยังสกัดกั้นไม่ให้มีใครหนีรอดเพิ่มไปได้ค่ะ"
70011020-42 = "ทำไมไม่เหมือนที่ฉันได้ยินมาเลยล่ะ...? ได้ยินว่าการรักษาความปลอดภัยของสำนักควบคุม#nหละหลวมออกนะ"
70011020-43 = "มีข่าวลือว่าไม่นานมานี้จิ้งจอกแห่งความพินาศก็เข้าออกที่นี่เหมือนบ้านตัวเองเลยด้วย"
70011020-44 = "หมายถึงวาคาโมะ... สินะคะ..."
70011020-45 = "..."
70011020-46 = "กลับมาที่ประเด็นหลักของเราดีกว่าค่ะ นี่ไม่ใช่เวลามาคุยเกี่ยวกับวาคาโมะค่ะ"
70011020-47 = "เอาเถอะค่ะ ทางสำนักควบคุมไม่ได้จำกัดการออกไปข้างนอกเพื่อจะกลั่นแกล้งพวกคุณหรอกนะคะ"
70011020-48 = "อย่างที่คุณอาจรู้อยู่แล้วว่า... การส่งตัวมาคุมประพฤติยังสำนักควบคุมจะเกิดขึ้นก็ต่อเมื่อโรงเรียนเก่า#nดัดนิสัยไม่ไหวแล้ว... หรือไม่ก็กรณีที่ประวัติการศึกษาไม่ชัดเจน"
70011020-49 = "โดยส่วนใหญ่แล้ว นักเรียนที่ถูกส่งมาที่นี่คือเด็กมีปัญหา ที่หนักเกินกว่าโรงเรียนจะรับมือได้ค่ะ..."
70011020-50 = "พูดแรงไปแล้วนะ"
70011020-51 = "แน่นอนว่าบรรทัดฐานของแต่ละที่ก็ต่างกันออกไปค่ะ ถึงจะมีโรงเรียนอย่างเกเฮนน่าที่ไม่ส่งนักเรียนมา#nยังสำนักควบคุมเลยแม้แต่คนเดียว แต่ก็ยังมีบางโรงเรียนที่กฎระเบียบเข้มงวดขนาดที่แค่ทำผิดนิดเดียว#nก็ส่งตัวมายังสำนักควบคุมทันทีเลยค่ะ"
70011020-52 = "เพราะงั้นการมีประวัติว่าเคยมาอยู่ในสำนักควบคุมก็ไม่ได้หมายความว่าเป็นคนไม่ดีเสมอไปหรอกค่ะ"
70011020-53 = "อะไรกันน่ะ มาปลอบใจกันงั้นเหรอ?"
70011020-54 = "จะว่าอย่างนั้นก็ได้ค่ะ..."
70011020-55 = "แต่ถึงจะอย่างนั้น... สถาบันฝึกตำรวจวัลคิรี่ก็เป็นสถาบันที่รับผิดชอบความสงบเรียบร้อยของคิโวทอส เราไม่อาจปล่อยให้เด็กเจ้าปัญหาที่ไม่รู้ว่าจะไปก่อเรื่องที่ไหนเมื่อไรอีกลอยนวลอยู่ได้หรอกค่ะ"
70011020-56 = "ในทางกลับกัน ถ้าเรามั่นใจว่าเด็กคนไหนจะไม่ไปก่อปัญหาใดๆ อีก เราก็จะอนุมัติการปล่อยตัวได้ทุกเมื่อค่ะ"
70011020-57 = "ขอบอกอีกครั้งนะคะว่าสำนักควบคุมแห่งนี้ไม่ใช่คุกหรือตะรางค่ะ"
70011020-58 = "ถ้าสำนึกผิดและกลับตัวกลับใจ ก็ออกไปจากที่นี่ได้ทุกเมื่อค่ะ ไม่จำเป็นต้องหนีด้วยค่ะ"
70011020-59 = "เข้าใจแล้วๆ รู้แล้วน่าว่าต้องสำนึกผิด"
70011020-60 = ""
70011020-62 = ""
70011020-63 = "ฉันจะถามคำถามสำคัญอีกข้อค่ะ"
70011020-64 = "ทำไมถึงพยายามหลบหนีล่ะคะ?"
70011020-65 = "ว่าไงนะ? ฉันก็เพิ่งบอกไปเมื่อกี้ไม่ใช่เหรอว่าไม่ได้มีเหตุผลอะไรเป็นพิเศษ"
70011020-66 = "แค่คิดว่าตัวเองก็น่าจะทำได้... งั้นถ้าออกไปได้แล้วคิดจะทำอะไรเหรอคะ?"
70011020-67 = "ก็พอเดาได้อยู่แล้วไม่ใช่เหรอ ไม่เห็นจะต้องถามให้เสียเวลาเลย..."
70011020-68 = "ไม่หรอกค่ะ ฉันไม่มีทางรู้จนกว่าจะได้ยินจากปากของเจ้าตัวหรอก"
70011020-69 = "ก็ได้! ฉันบอกก็ได้! แต่พอรู้แล้วก็อย่าหัวเราะกันล่ะ!"
70011020-70 = ""
70011020-72 = ""
70011020-73 = "วันนี้เป็นวันเกิดของฉันน่ะ"
70011020-74 = "แต่ฉันเพิ่งถูกส่งตัวมาคุมขังที่สำนักควบคุม ก็เลยไม่มีเพื่อนสนิทในนี้..."
70011020-75 = "ก็เลยคิดว่าจะออกไปเล่นสนุกกับเพื่อนๆ ข้างนอกแล้วกลับมาน่ะ! ฉันไม่ได้คิดจะหนีตั้งแต่แรกหรอก ก็แค่อยากออกไปเที่ยวเล่นแค่วันนี้วันเดียวก็เท่านั้น"
70011020-76 = "งั้นสินะคะ..."
70011020-77 = "ฮึ่ม กะไว้แล้วละว่าเธอต้องไม่เชื่อ"
70011020-78 = "ถ้าฉันดูเป็นอย่างนั้นก็ขอโทษด้วยค่ะ แต่ว่า..."
70011020-79 = ""
70011020-81 = ""
70011020-84 = "ผู้คุมคะ ช่วยเอาของชิ้นนั้นมาให้หน่อยได้มั้ยคะ?"
70011020-85 = "อ๊ะ ได้ค่ะ หมายถึงของที่ฝากไว้ตอนเข้ามาใช่มั้ยคะ?"
70011020-87 = "อะไรน่ะ...?"
70011020-88 = "ฉันอยากทำให้การพูดคุยของเรามีบรรยากาศอบอุ่นกว่านี้แท้ๆ... ขอโทษด้วยนะคะ"
70011020-89 = "แล้วก็... สุขสันต์วันเกิดค่ะ นี่คือหมวกไหมพรมที่ฉันถักเองค่ะ"
70011020-90 = ""
70011020-92 = ""
70011020-93 = ""
70011020-94 = ""
70011020-95 = ""
70011020-96 = "เอะ... เอ๋...?"
70011020-97 = "ฉันคิดว่าโทนสีพาสเทลอ่อนๆ น่าจะเหมาะกับผมบลอนด์ที่ดูมีเสน่ห์ของคุณ ก็เลยเลือกใช้ไหมพรมสีชมพูอ่อนค่ะ หวังว่าคุณจะชอบนะคะ"
70011020-98 = "เดี๋ยวนะ เดี๋ยวก่อน รู้วันเกิดของฉันด้วยเหรอ...? แถมยังเตรียมของขวัญมาให้อีก...?"
70011020-99 = "ก็นี่คือวันเกิดในวัยเรียนอันล้ำค่าที่มีเพียงแค่ครั้งเดียว และจะไม่หวนกลับมาอีกแล้วนี่คะ"
70011020-100 = "การใช้เวลาในวันสำคัญแบบนั้นในสำนักควบคุมคงไม่ใช่เรื่องที่ดีนักหรอกค่ะ หวังว่าฉันจะช่วยปลอบใจคุณได้บ้างนะคะ..."
70011020-101 = "แต่ดูเหมือนว่าแค่นี้น่าจะยังไม่เพียงพอสินะคะ"
70011020-102 = "ถ้าไม่ว่าอะไรละก็ ช่วยบอกเบอร์ติดต่อเพื่อนๆ ของคุณกับฉันได้มั้ยคะ?"
70011020-103 = "หืม...?"
70011020-104 = "ฉันจะเชิญทุกคนมาสำนักควบคุม แล้วอนุญาตให้คุณจัดปาร์ตี้กับเพื่อนๆ ที่นี่ได้หนึ่งวันค่ะ"
70011020-105 = "ฉันทำแบบนั้นได้ด้วยเหรอ...?"
70011020-106 = "หมายความว่ายังไงเหรอคะ?"
70011020-107 = "ก็ฉันเป็นนักโทษ แล้วเมื่อวานก็พยายามจะแหกคุกเลยนะ?"
70011020-108 = "ตรงกันข้ามค่ะ ฉันบอกไปแล้วนี่คะว่าสำนักควบคุมไม่ใช่คุก"
70011020-109 = "เพราะงั้นคุณก็ไม่ใช่นักโทษหรอกค่ะ"
70011020-111 = "สุดยอดเลย ทำได้ดีมากค่ะ!"
70011020-112 = "เด็กคนนั้นเดินปาดน้ำตากลับไปเลยนะคะ หัวหน้าเป็นคนที่ยอดเยี่ยมจริงๆ เลยค่ะ"
70011020-113 = "วันสำคัญแท้ๆ แต่ต้องมาเสียน้ำตาเพราะฉัน รู้สึกผิดจังเลยนะคะ..."
70011020-114 = "ไม่หรอกค่ะ เราไม่ได้ทำอะไรไม่ดีกับเด็กคนนั้นสักหน่อยนี่คะ"
70011020-115 = "พอได้เห็นกับตาตัวเองวันนี้ ฉันก็เข้าใจแล้วค่ะว่าทำไมถึงบอกกันว่ามีนักเรียนหลายคนได้เริ่มต้น#nชีวิตใหม่ทุกปีเพราะหัวหน้า"
70011020-116 = "อย่างที่ฉันบอกอยู่เสมอว่านั่นเป็นเพราะความพยายามของทุกคนค่ะ... ฉันก็แค่มาชวนคุยบ้างก็เท่านั้น"
70011020-117 = "ถ้าอีกฝ่ายไม่เปิดใจและไม่มีความตั้งใจจะคุยด้วยละก็"
70011020-118 = "ไม่สิ ถ้าเด็กพวกนั้นมีความคิดบิดเบี้ยว ฉันก็คงทำอะไรไม่ได้ค่ะ"
70011020-119 = "มีความคิดบิดเบี้ยวเหรอคะ?"
70011020-120 = "อ๊ะ ขอโทษค่ะ ฉันพลั้งปากพูดออกไปน่ะ ช่วยลืมไปเถอะนะคะ"
70011020-121 = "วันนี้ขอบคุณที่มาช่วยตั้งแต่เช้าเลยนะคะ"
70011020-122 = "ไม่หรอกค่ะ นี่เป็นหน้าที่ของฉันอยู่แล้วค่ะ ถ้าต้องการอะไรก็เรียกหาฉันได้นะคะ!"
70011020-123 = ""
70011020-125 = ""
70011020-126 = ""
70011020-127 = "ฉันเคยเจอกับคนประเภทนั้นค่ะ... คนที่คุยกันด้วยคำพูดไม่รู้เรื่อง คนที่ยากที่จะเชื่อว่าเราใช้ชีวิตอยู่บนโลกใบเดียวกัน"
70011020-129 = "นัก โทษ พวก นั้น น่ะ"
70011020-137 = "ลำดับต่อไป หัวหน้าสำนักควบคุมคนใหม่ คุณคันบาระ มิซึสึจะขึ้นมากล่าวเปิดงานค่ะ ขอเสียงปรบมือต้อนรับด้วยค่ะ..."
70011020-138 = ""
70011020-141 = "เกิดเรื่องใหญ่แล้วค่ะ!! มีนักโทษหลบหนีไปได้ค่ะ!!"
70011020-142 = "เจ็ดคนเลยค่ะ! นักโทษเจ็ดคนหายไปพร้อมกันเลย!!"
70011020-143 = "นี่คือการแหกคุกหมู่ค่ะ!!"
70011020-145 = "(ในวันนั้น คันบาระ มิซึสึได้รับการแต่งตั้งให้เป็นหัวหน้าสำนักควบคุม)"
70011020-146 = "(และในปีนั้น จำนวนผู้สมัครเข้าสำนักควบคุมก็ลดลงกว่าปีก่อนถึง 80%)"
70011020-147 = "ความกลัดกลุ้มของคันบาระ มิซึสึ"
