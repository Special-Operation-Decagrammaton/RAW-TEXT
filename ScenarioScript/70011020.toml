[translation]
70011020-1 = "監原美鈴的憂鬱（２）"
70011020-2 = "那個值多少錢？"
70011020-6 = "咦……？"
70011020-7 = "那個……你是不是聽錯了？#n我問的是你在外面有沒有朋友……"
70011020-8 = "好吧，假設有的話，我能賺多少錢？"
70011020-9 = "……我不太理解你的意思。#n交朋友並不是為了錢……"
70011020-10 = "那就一點用處也沒有了嘛。"
70011020-11 = "那個……世上有很多無法用金錢衡量的東西……"
70011020-12 = "喂。"
70011020-13 = "無法用金錢衡量？呵……"
70011020-14 = "不要用你的自我滿足來浪費我的時間。"
70011020-15 = "不，不是，我沒有那個意思……我……我只是想……"
70011020-17 = "……喂。"
70011020-19 = "喂！"
70011020-20 = "呼咿！？"
70011020-21 = "不會吧，你真的睡著了哦？#n我人都還坐在這裡耶？"
70011020-22 = "啊，抱歉。我有點累……"
70011020-23 = "現在才早上幾點而已耶。#n難道你整晚沒睡嗎？"
70011020-24 = "嗯，差不多吧，耶嘿嘿……"
70011020-25 = "……話說回來，你知道我找你來的原因嗎？"
70011020-26 = "啊，嗯，算是吧。"
70011020-27 = "我沒有想要追究責任的意思。#n只是想知道……生活中有什麼讓你感到不便的地方嗎？"
70011020-28 = "沒有。"
70011020-29 = "沒有啊……是個不錯的答案呢。"
70011020-30 = "不過同時也不是理想的答案。#n我查看了你的生活記錄，但是從文件上卻看不出端倪……"
70011020-31 = "你為什麼要越獄呢？有什麼讓你不滿的地方嗎？"
70011020-32 = "……沒有特別的理由。"
70011020-33 = "只是覺得我好像也能做到，所以就嘗試了一下。"
70011020-34 = "……"
70011020-35 = "……能告訴我那股自信的來源嗎？"
70011020-36 = "就是……我聽說之前有七個人越獄了吧？"
70011020-37 = "在外面好像叫什麼「七罪人」的樣子。"
70011020-38 = "所以才覺得我搞不好也能做到。"
70011020-39 = "有七個人越獄……這的確是事實。"
70011020-40 = "不過反過來說，也只有七個人越獄了。"
70011020-41 = "自從矯正局創立以來，除了那七個人之外從未讓任何人成功越獄。#n並且即便是那個時候，我們也同樣阻止了更多越獄的發生。"
70011020-42 = "……怎麼好像跟傳聞不太一樣啊。#n大家不是都說矯正局的保全非常鬆懈嗎？"
70011020-43 = "而且不久之前，「災厄之狐」還好幾次像回自己家一樣進進出出的。"
70011020-44 = "你說的……是若藻吧……"
70011020-45 = "……"
70011020-46 = "先回到正題吧。現在不是談論若藻的時候。"
70011020-47 = "總之，我們矯正局不是為了故意刁難大家而限制外出的。"
70011020-48 = "……我想你應該也清楚，學生會被送到矯正局的情況有兩種。#n一種是被母校放棄輔導，另一種則是學籍本身並不明確。"
70011020-49 = "普遍來說，就是那種學園無法應付的問題學生……"
70011020-50 = "說得真難聽啊。"
70011020-51 = "……當然，標準是相對的。#n有像格黑娜這種一個學生都不送到矯正局的學園，#n也有規定嚴格到會因為一些小錯誤就把人送到矯正局的學園。"
70011020-52 = "所以在矯正局待過，並不代表那個人就一定犯下了無可挽回的大錯。"
70011020-53 = "怎麼，你現在是在安慰我嗎？"
70011020-54 = "至少我是這麼想的……"
70011020-55 = "……話雖如此，女武神警察學園畢竟是負責維持奇普托斯治安的學園。#n我們不能讓不知道會惹出什麼麻煩的問題學生自由行動。"
70011020-56 = "反過來說，只要確定不會再惹出問題，隨時都可以允許學生離開。"
70011020-57 = "我再強調一次，矯正局並不是監獄。"
70011020-58 = "只要反省並改過自新，隨時都可以離開這裡，不需要依靠越獄。"
70011020-59 = "好啦好啦，我反省就是了嘛。"
70011020-63 = "還有一個重要的問題。"
70011020-64 = "你為什麼要越獄呢？"
70011020-65 = "啊？不是，我剛才不就說過沒有什麼特別的理由嗎？"
70011020-66 = "只是覺得自己能夠做到對吧……#n那麼，你出去之後打算做什麼呢？"
70011020-67 = "……你都擺出一副已經知道了的樣子，還有必要問嗎？"
70011020-68 = "沒有那種事。#n在聽你本人親口說出來之前，我是不會知道的哦。"
70011020-69 = "……好啦！我說就是了嘛！#n但是你絕對不可以笑我哦！"
70011020-73 = "今天……是我的生日。"
70011020-74 = "可是因為剛來矯正局沒多久的關係，根本沒什麼朋友……"
70011020-75 = "所以才會想出去和朋友們玩一下再回來……#n我根本沒有要逃跑的意思，原本打算今天就回來的！"
70011020-76 = "……原來是這樣啊。"
70011020-77 = "哼，反正你們也不會相信吧。"
70011020-78 = "如果讓你產生那種感覺的話，我很抱歉。但是……"
70011020-84 = "警衛，可以幫我把那個東西拿過來嗎？"
70011020-85 = "好的，是您剛才寄放的東西對吧？"
70011020-87 = "……那是什麼？"
70011020-88 = "本來想在更溫和的氣氛中給你的……真是不好意思。"
70011020-89 = "還有，祝你生日快樂。這是我自己編織的帽子。"
70011020-96 = "咦，咦……？"
70011020-97 = "我覺得華麗的金髮很適合搭配柔和的粉色調，所以就用了淡粉色的毛線。#n希望你會喜歡。"
70011020-98 = "先，先等一下。#n你不只知道我的生日……甚至還準備了禮物嗎？"
70011020-99 = "畢竟這是一生只有一次，而且再也無法重來的學生時期中經歷的寶貴生日啊。"
70011020-100 = "必須在矯正局迎接這樣的日子，你想必很難受吧。#n所以我才希望至少能藉此帶給你一絲絲的慰藉……"
70011020-101 = "看來光是這樣，好像還遠遠不夠呢。"
70011020-102 = "如果不介意的話，能把你朋友們的聯絡方式告訴我嗎？"
70011020-103 = "……咦？"
70011020-104 = "我可以試著邀請他們來到矯正局，並為你安排一場生日派對。"
70011020-105 = "……這樣真的可以嗎？"
70011020-106 = "怎麼說呢？"
70011020-107 = "就是，我是囚犯……而且還打算越獄耶？"
70011020-108 = "不是那樣的。#n誠如我先前所說，矯正局並不是監獄。"
70011020-109 = "所以你也不是囚犯。"
70011020-111 = "哎呀～辛苦您了！"
70011020-112 = "不愧是局長！那傢伙出來的時候哭得泣不成聲耶？"
70011020-113 = "在值得開心的日子裡把人家弄哭了，我心裡實在有點過意不去……"
70011020-114 = "別這麼說，我們也不是在欺負他嘛。"
70011020-115 = "之前就聽說每年都有很多學生在見過局長之後改過自新，#n今天實際見識到之後總算能理解了呢。"
70011020-116 = "……那是他們自己努力所得到的結果，我只不過是陪在旁邊嘮叨幾句而已。"
70011020-117 = "如果對方沒有對話的意願……"
70011020-118 = "不，如果思維方式本身就脫離常軌的話，就連我也無能為力。"
70011020-119 = "思維方式脫離常軌？"
70011020-120 = "啊，抱歉。#n剛才是我失言了，請忘掉那些話吧。"
70011020-121 = "謝謝你一大早就來幫忙。"
70011020-122 = "不會，畢竟這是我的工作嘛！有需要的時候儘管吩咐！"
70011020-127 = "……這裡確實曾經存在過。#n任何言語都無法溝通，甚至難以相信生活在同一個世界的──"
70011020-129 = "──[ruby=・]囚[/ruby][ruby=・]犯[/ruby][ruby=・]們[/ruby]。"
70011020-137 = "現在讓我們請新上任的矯正局長「監原美鈴」發表就任致詞。#n請大家以熱烈的掌聲──"
70011020-141 = "大事不好了！！囚犯們逃跑了！！"
70011020-142 = "七個人！七個人同時消失了！！"
70011020-143 = "是集體越獄！！"
70011020-145 = "（那一天，正是監原美鈴就任矯正局長的日子）"
70011020-146 = "（那一年報考矯正局的人數，相較去年減少了八成）"
70011020-147 = "監原美鈴的憂鬱"
