[translation]
10011035-4 = "바, 방금 그 녀석들은 대체 뭐야?!"
10011035-5 = "[s] \"망량즈야.\""
10011035-6 = "마, 망량즈라고 하면…… 그 문제아 집단인 망량즈?!"
10011035-7 = "게다가 아까! 그 사람들! 자기들을 제멋대로 망량즈라고 소개했어요!"
10011035-8 = "저, 드, 들어본 적 있어요……! 제멋대로 망량즈라고 하면…… 망량즈 중에서도 특히 싸우는 걸 무척 조, 좋아하는……"
10011035-11 = "축제는 백귀야행의 전통 축제만 인정한다던가…… 그 외의 것은 아웃이라던가……."
10011035-13 = "그 밖에도 망량즈에게 연 12회의 축제 상품권을 배부하라고 요구한다던가……."
10011035-15 = "하지만 요구를 들어주지 않는 백귀야행 학원에 불만이 잔뜩이라, 매번 싸울 생각만 가득한, 그, 그런 축제 강경파, 분들이라고 들었어요오오……."
10011035-17 = "아니아니아니~! 그건 또 무슨 만화 설정이냐구웃~!"
10011035-18 = "[s] \"축제 강경파라니……. 또 처음 듣는 단어가…….\""
10011035-20 = "그런데 왜 그런 놈들이 우리를 습격한 건데?!"
10011035-24 = "크, 크, 큰일났다아……! 고, 공주 역할의 배우가 납치당했어!"
10011035-28 = "공주 역을 맡은 배우가…… 유괴됐다?"
10011035-29 = "그, 그 말은 즉……"
10011035-30 = "이부키 공이 위험해요!"
10011035-31 = "[s] \"……설마 망량즈는 처음부터 교류회를 방해하려고?\""
10011035-32 = "시, 시, 신고해야 해요! 일단! 음양부나……! 백화요란에게 얼른……!"
10011035-33 = "아, 아냐! 그건 곤란해……!"
10011035-37 = "[ns] \"곤란하다니, 무슨 의미야, 미치루?\""
10011035-38 = "그게, 그러니까,"
10011035-39 = "그게 시, 신고를 하는 건…… 공연이……!"
10011035-41 = "만마전의 일원이 납치된 일이에요."
10011035-42 = "외부에 알려졌다간 그것만으로도 엄청난 외교적 분쟁을 일으킬 텐데요. 최악의 경우 학교 간의 항쟁이 될지도."
10011035-43 = "!! 마, 맞아! 그러니 더욱 알리는 건, 고, 곤란하지 않을까?!"
10011035-44 = "특히 만마전의 톱은 완전 엄청난 녀석이라며?! 만약 이 사실이 만마전에게 알려지기라도 했다간……!"
10011035-45 = "[s] \"아, 그거라면 이미 늦었다고 할지.\""
10011035-49 = "……이부키가, 저희 만마전의 학생이 납치되었단 말이죠."
10011035-54 = "이미 있잖아! 게헨나의 학생이! 심지어, 댁도 만마전이야?! 그 당사자가 바로 여기에?!"
10011035-55 = "아이에에에-!! 완전 아웃이잖아!"
10011035-56 = "버, 벌어지는 건가요?! 전쟁이?!"
10011035-57 = "후, 후에에엥……. 훌쩍훌쩍……."
10011035-58 = "후우……"
10011035-59 = "[s] \"이로하, 잠깐 진정하고 이야기를 하자.\""
10011035-60 = "무슨 소리를 하시는 건가요. 선생님. 전 지금 지극히 냉정한 상태인데요."
10011035-65 = "[ns] \"으음, 그렇게는 보이지 않는데…….\""
10011035-66 = "하아…… 대체, 뭐죠?"
10011035-67 = "저는 처음부터 마코토 선배가 이부키에게 추억이 될 거라며 배역을 맡기는 걸, 위험하다고 반대했었는데."
10011035-68 = "결국 이렇게 되어버렸잖아요? 어떻게 책임지실 건가요? 마코토 선배? 네?"
10011035-69 = "[s] \"저기, 이로하…… 마코토는 여기 없으니까……\""
10011035-73 = "마음 같아서는 밖으로 나가서 바로 난리를 피우고 싶은 참입니다만……"
10011035-74 = "우, 우와아아……."
10011035-75 = "아, 아우으……."
10011035-76 = "꾸, 꿀꺽……."
10011035-77 = "……하지만 역시 외부에 알릴 수는 없죠."
10011035-78 = "백귀야행과 게헨나 사이에 정치적 알력이나 분쟁이 일어나게 둘 수는 없으니까요."
10011035-79 = "……!!"
10011035-81 = "[ns] \"이로하, 그렇게까지 모두를 생각해서……!\""
10011035-82 = "그런 귀찮은 일에 휘말리는 거, 진짜 싫거든요."
10011035-83 = "[s] \"응……! 역시 그런 이유 때문일 줄 알았지만!\""
10011035-84 = "혹시라도 그렇게 되었다간 마코토 선배는 또 제멋대로 난리를 피울 거고, 사츠키 선배는 말할 것도 없고."
10011035-85 = "결국 휘말리는 건 저와 이부키니까요. 네, 그런 일은 완전 사절."
10011035-86 = "그러니 외부에 알리는 건 추천하지 않아요."
10011035-87 = "그, 그럼 저희는, 그, 어, 어떻게 해야……."
10011035-88 = "……응. 알았어."
10011035-89 = "부장?"
10011035-90 = "우리에게 방법은 하나밖에 없어!"
10011035-91 = "[s] \"미치루, 뭔가 떠오른 거야?\""
10011035-92 = "외부에 알려지기 전에, 이 일을 수습할 수밖에 없어!"
10011035-93 = "즉! 이 자리에 있는 우리만으로 구해내는 거야!"
10011035-95 = "과, 과연……!"
10011035-96 = "부장! 그런 방법이……!"
10011035-97 = "마침 여기엔 우리뿐만 아니라 만마전의 높으신 분도……! 그리고 무엇보다 샬레의 선생님인 선생 공이 있어!"
10011035-98 = "그치?!"
10011035-99 = "[s] \"물론 그럴 수만 있다면 베스트겠지만…….\""
10011035-101 = "문제는 현 상황을 어떻게 외부에 숨길 수 있느냐-일 텐데요. 뭔가 좋은 방법이라도."
10011035-105 = "아아, 여러분, 잘 들리시나요?"
10011035-109 = "[ns] \"……어라? 이건, 비행선의 방송?\""
10011035-111 = "냐하하핫~~ 모두 공연은 잘 즐겨 주고 계신가요~?"
10011035-112 = "만마전 여러분께서 협력해주시며 더욱 특별해진 이번 공연!"
10011035-113 = "조금 예정과 달라졌지만, 보다시피 저희 백귀야행이 자랑하는 체험형 이벤트 <와라쿠 공주님>의 공연은 시작되었습니다."
10011035-114 = "자, 이 장면을 봐주세요!"
10011035-126 = "보셨다시피 공주님을 납치한 도당들은 현재진행형으로 도주 중!"
10011035-127 = "그렇다면 자아! 과연 이 도당으로부터 납치된 공주님을 가장 먼저 구해내는 이는 누구인가~?"
10011035-128 = "그 영광을 손에 쥐는 분께는 저희 음양부에서 특별히 준비한 선물을 프레젠트할 예정이오니……."
10011035-129 = "저희 백귀야행을 찾아와주신 게헨나의 학생 여러분, 그리고 언제나 축제를 흥겹게 즐겨 주시는 백귀야행의 학생분들 전부."
10011035-130 = "이번 이벤트에 적극적으로 참가해주시길 바랍니다!"
10011035-131 = "응원하고 있을 테니까요~ 냐하핫!"
10011035-136 = "[ns] \"아…….\""
10011035-137 = "과연……. 아직까진 외부 사람들에게 <공연이 계속되고 있다> 라는 점을 어필한다."
10011035-138 = "그렇게 눈을 속일 생각이로군요. 영리한걸요."
10011035-139 = "역시 음양부의 너구리……! 가 아니라, 음양부의 부장이야! 이거라면 시간 벌이는 어느 정도 되겠어!"
10011035-140 = "자, 그럼 목표는 간단해!"
10011035-141 = "사태가 심각해지기 전에, 우리 인법연구부가 이부키 양을 구출해낸다! 알겠지?!"
10011035-143 = "네! 위기에 처한 사람이 있다면, 그걸 구하는 게 닌자니까요! 닌닌!"
10011035-144 = "이부키 양……. 분명 무서워서 울고 있을 거예요! 반드시 구해내요! 우리!"
10011035-145 = "……이부키, 기다려주세요. 금방 갈 테니까."
10011035-146 = "[s] \"응, 모두 힘내자.\""
10011035-148 = "(응, 아직 괜찮아……! 아직 수습할 수 있어! 공연의 성공과 인법연구부의 정식 인가 건까지……!)"
10011035-149 = "(이즈나와 츠쿠요에게 호언장담했으니까……!)"
10011035-150 = "(아직! 기회는 있어!)"
