[translation]
10058080-1 = "제8화;혁명, 좋아해?"
10058080-2 = "쾅!!!!"
10058080-5 = "회장님, 지시 부탁드립니다. 적 크루세이더는 거리상 저희 장갑을 뚫지 못하고 있습니다."
10058080-6 = "그렇다면 오도 가도 못하는 183호 녀석들 먼저 숙청한다!"
10058080-7 = "궤도가 끊어져서 이 몸을 조준도 못 하고 있군! 옆에서 노려!"
10058080-8 = "알겠습니다! 조준 좋으면 쏴!"
10058080-9 = "네! 조준 좋으면 쏴!"
10058080-14 = "시, 시동 꺼졌어!"
10058080-15 = "이거 잘 모르겠는데, 빨간 불빛이 엄청 들어와있는데 괜찮은 거야?"
10058080-16 = "엔진 과열이에요, 결국 라디에이터가 터졌네요……. 바로 시동 걸면 엔진이 녹아버릴 거예요."
10058080-17 = "적 전차, 우리에게 조준 풀었어."
10058080-18 = "183호를 먼저 쏠 생각이야."
10058080-19 = "어째서 도망치지 않는 거야?! 시간 충분히 벌어줬잖아!"
10058080-20 = "무리예요. 183호 분들, 궤도가 끊어져서 움직이지 못하고 있어요."
10058080-21 = "포탑도 없어서, 저분들이 반격을 할 수도 없네요……."
10058080-22 = "전차를 버리고 도망치지도 않고, 어떻게든 궤도를 고치려고 애쓰고 있어."
10058080-23 = "울면서도 끝까지, 도망치지 않고……."
10058080-24 = "그럼 어떡해? 방법이 없잖아?"
10058080-25 = "……방법은 있어요. 딱 한 가지."
10058080-26 = "히후미……?"
10058080-27 = "저분들이 차체를 돌려서 조준할 수 없다면, 저희가 차체를 돌려주면 돼요."
10058080-28 = "그러니까, 183호 분들의 차체 뒤편을 들이받는 거예요."
10058080-29 = "그렇다고 해도…… 저희가 지금 다시 시동을 걸면……."
10058080-30 = "엔진이 녹아버리거나, 포탄에 옆구리를 맞겠지."
10058080-31 = "코하루 쨩."
10058080-32 = "그럼 우승은 못 하잖아……. 그러면 다시 보충수업…… 공부……."
10058080-33 = "코하루."
10058080-34 = "……."
10058080-35 = "으으으……"
10058080-36 = "……다 똑같은 생각 하면서, 내가 말하게 하지 마!"
10058080-41 = "코하루 쨩♡"
10058080-42 = "열받아! 손해 보고 망할 거 알면서도, 못 본 척할 수 없어서 달려들게 되는 거, 진짜 열받아!"
10058080-43 = "보충수업, 안 도와주면 진짜 화낼 거야! 절교할 거야! 으아아아아!!!"
10058080-46 = "간다!!!!!"
10058080-48 = "잡았다, 이 반동 녀석들!"
10058080-49 = "감히 이 몸에게 저항하려고 들어? 영거리 숙청이다!"
10058080-50 = "조금만 더 고치면 됐는데……."
10058080-51 = "끝……."
10058080-52 = "났…… 다……."
10058080-53 = "미안해요, 보충수업부 여러분들. 그렇게 도와주셨는데."
10058080-54 = "역시…… 포탑, 돌아갈 수 있게 만들걸……."
10058080-55 = "차체가 옆으로 조금만 더 돌아갔더라면……."
10058080-58 = "포수, 발포-"
10058080-61 = "?"
10058080-65 = "꺄악?! 뭐야!! 부딪힌 거야?!"
10058080-66 = "보충수업부 분들이……! 대신 맞아주셨어!!"
10058080-67 = "보험 부를까. 이럴 때 머리로 클랙슨 누르고 있으면 좋다던데."
10058080-69 = "여러분! 이제 조준할 수 있을 거예요!"
10058080-70 = "이 거리라면, 가능해."
10058080-71 = "뭐, 뭐라고?! 이 녀석들, 돌이킬 수 없는 반역을 하려고 하는구나!"
10058080-74 = "보충수업부 여러분!!!"
10058080-75 = "어차피 숙청이면, 더 나빠질 것도 없어!!!"
10058080-76 = "진검 승부야! 받은 기회, 헛되게 못 하지!"
10058080-77 = "이제 못 물러나!!!"
10058080-83 = "철갑탄!!"
10058080-86 = "장전 완료, 쏴! 쏴!! 쏴!!! 쏴!!!!"
10058080-90 = "이 거리에서도 못 맞히다니, 아지타니 히후미. 헛수고했군."
10058080-92 = "큭……."
10058080-95 = "히이익!!!"
10058080-96 = "안나, 이 멍청아 뭐 하는 거야!! 그걸 못 맞혀?!"
10058080-97 = "조준경이 충격 때문에 망가져서 영점이 틀어졌단 말이야!!"
10058080-98 = "그러면 빗나간 만큼 오조준하면 되는 거잖아!"
10058080-102 = "또 빗나갔어!!"
10058080-103 = "쏠 때마다 반동으로 영점이 틀어져! 어디에 맞을지 예측을 할 수 없다구!"
10058080-105 = "더 시간을 끌 것도 없군, 어서 장전해, 장전!"
10058080-106 = "예비탄이 구석에 있어서 꺼내는 중입니다!"
10058080-107 = "더 빨리 움직이지 않으면 네 녀석도 숙청이다!!"
10058080-109 = "이런……!"
10058080-110 = "기껏 도와줬는데 으아앙-!"
10058080-112 = "어쩌지? 어떡하지?"
10058080-113 = "조준, 조준을 해야 하는데……."
10058080-114 = "!!! 그렇지!!"
10058080-115 = "안나, 포탄 빼!!"
10058080-116 = "갑자기 왜?! 이제 와서 항복하려고?"
10058080-117 = "항복 안 해! 안 한다고! 됐으니까 빨리!!!"
10058080-118 = "아, 알았어!!"
10058080-121 = "비켜, 비켜!!"
10058080-122 = "포미에 머리를 왜 대는 거야? 위험하다구!"
10058080-123 = "아! 시끄럽네 진짜!!!"
10058080-127 = "우로 5! 아래로 10!"
10058080-130 = "됐어!! 장전!!"
10058080-133 = "장전 완료! 쏴! 쏴!! 쏴!!!"
10058080-134 = "발포!!!"
10058080-138 = "뭐야?!"
10058080-141 = "으아앗?!"
10058080-142 = "쾅!!!!!"
10058080-148 = "해냈군요, 끝까지 포기하지 않은 여러분들의 승리예요."
10058080-149 = "보람 있는 희생이었어."
10058080-150 = "재시험 준비……. 벌써 하기 싫어……."
10058080-151 = "어머♡ 걱정 마요 코하루 쨩, 이것저것 전부 가르쳐드릴게요♡"
10058080-152 = "진짜 우울하니까, 더듬지 마!!"
10058080-154 = "저, 적 전차 격파……."
10058080-155 = "해냈다……."
10058080-159 = "기절한 거야?!"
10058080-160 = "으읏, 나도 긴장이 풀리니까아……."
10058080-165 = "그러게 어제 잘 자뒀어야지. 아이들도 아니고."
10058080-167 = "역시 강하다, 붉은겨울의 자객들! 어려운 상황에서 임기응변으로 살아남았습니다!"
10058080-168 = "조준경이 망가지니까, 포구로 들여다보는 것으로 조준하다니! 처음 보는 전개군요!"
10058080-169 = "183호는 이걸로 격파수 2대! 다크호스의 이름에 걸맞은 활약이네요!"
10058080-170 = "한편, 랭킹 2위인 히후미 씨가 이끄는 보충수업부팀, 탈락합니다! 이번 대회는 한 치 앞을 알 수가 없네요!"
10058080-171 = "다들 엄청 화난 것처럼 보였어. 서로 사이 안 좋은 거 아니지?"
10058080-172 = "말려야 하는 거 아닐까? 이부키가 과자 나눠줄 수 있는데……."
10058080-173 = "이부키 쨩 괜찮아요, 괜찮아! 그냥 스포츠라구요!"
10058080-174 = "그렇죠, 선생님!"
10058080-175 = "[s] \"애들은 싸우면서 크니까!\""
10058080-176 = "정말?! 이부키도 그럼 많이 싸워서 쑥쑥 클래!"
10058080-177 = "[s] \"그런 이야기가 아니란다, 이부키!\""
10058080-178 = "선생님의 당황하는 얼굴 캐치! 아하하!"
10058080-179 = "자아! 경기는 점점 더 클라이맥스로 향해 갑니다!"
10058080-180 = "채널-"
10058080-181 = "[s] \"-고정입니다!\""
10058080-186 = "저, 저기이- 체리노 회장님-?"
10058080-187 = "다친 곳은 없으시지요? 에헤헤……."
10058080-188 = "이 녀석들, 감히 이 몸의 전차를 격파해?!"
10058080-189 = "끼잉……."
10058080-190 = "너무 화내지 마세요!! 이건 그냥, 그러니까-"
10058080-191 = "붉은겨울이 1등을 해야 한다고 누누이 말했는데, 서로 발목을 잡다니!!! 반동이다, 반동!!!"
10058080-192 = "끼잉……."
10058080-193 = "너희들 모두 돌아가면 숙청이야, 숙청!!!"
10058080-194 = "체리노 회장님."
10058080-195 = "네 녀석도 뭔가 할 말이 있는 게냐!! 반동 녀석들!"
10058080-196 = "회장 동지. 저희는 혁명을 한 것이 아닙니다."
10058080-197 = "얘, 라나!!"
10058080-198 = "회장님, 엄청 화났으니까 그냥 잘못했다고 빌어!!"
10058080-199 = "혁명을 한 게 아니라고? 그게 무슨 소리지?"
10058080-200 = "저희는 혁명을 한 게 아니라, 그냥 회장님이 타고 계신 전차를 부순 것뿐입니다."
10058080-204 = "내가 탄 전차를 부순 것뿐이다?"
10058080-205 = "그렇습니다. 회장님께서 우승을 하고 오라고 하셨기에, 우승을 하려고 회장님의 전차를 격파한 겁니다."
10058080-206 = "체리노 회장님이 우승을 하시면, 저희 183호는 우승을 못 하니까요."
10058080-207 = "혁명의 의도는 없습니다. 그렇기에 혁명을 한다는 선언도 없었고요."
10058080-212 = "혁명이 아니라, 우승하려고 이 몸을 공격한 거다?"
10058080-213 = "……."
10058080-217 = "뭐야, 그런 거였나! 그냥 경기를 한 것뿐이었군!"
10058080-218 = "네?!"
10058080-219 = "에엑?!"
10058080-220 = "이 몸이 큰 오해를 할 뻔했군! 경기를 빌미 삼아서 사무국에 위해를 가하고 이 몸을 끌어내리는 의도라고 생각했다네!"
10058080-221 = "그렇다면 문제없지. 좋은 승부였다!"
10058080-222 = "혁명이라니, 당치도 않습니다. 사무국은 재미없어 보이기도 하고요."
10058080-223 = "토모에! 이 녀석들은 숙청 명단에서 지우도록!"
10058080-224 = "알겠습니다. 3명, 숙청 예약 명단에서 삭제하겠습니다."
10058080-225 = "휴, 휴우……!"
10058080-228 = "여러분 모두 괜찮아요?"
10058080-229 = "네! 평소처럼 탱탱하고 요염해요!"
10058080-230 = "평소에 그런 말 하려고 준비라도 하는 거야?! 저질이야, 사형!!!"
10058080-231 = "아하하…… 다행이에요, 모두 무사하신 것 같아서."
10058080-232 = "크루세이더 쨩 상태는 어때요?"
10058080-233 = "완전히 망가졌어. 엔진도 녹았고 차축도 뒤틀렸고, 약점에 맞아서 탄약도 전부 망실했어."
10058080-234 = "안타깝지만, 탈락이네요……."
10058080-235 = "아지타니 히후미. 그리고 그 친구들이로군."
10058080-239 = "저, 저기……. 이건 그저 경기일 뿐이니까……"
10058080-240 = "둘 다 싸우지 말구, 에, 에헤헤……."
10058080-244 = "흠잡을 구석 없는 투지였네! 이번에도 겨루게 되어서 기뻤다!"
10058080-245 = "형식에 얽매이지 않은 전술에 진심으로 감탄했어요! 항상 배워가네요!"
10058080-246 = "으응……?"
10058080-247 = "체리노 회장이, 싸움 상대에게 화를 내지 않았다고……?"
10058080-248 = "에엥……?"
10058080-249 = "뭔가, 방금 전까지 적대적이지 않았어……?"
10058080-250 = "체리노 회장님은 항상 관대하시지만, 특히 더 관대하신 분야가 있으시거든요."
10058080-251 = "그중에서 전차전은, 호적수를 더 존중하시기도 하고요."
10058080-252 = "보충수업부 여러분들……."
10058080-253 = "괜히 저희가 발목을 잡은 것 같아서, 정말 죄송해요……."
10058080-254 = "괜찮아요! 이런 것들 모두가…… 아즈사 쨩?"
10058080-255 = "'소중한 과정', 이니까. 즐거웠어."
10058080-256 = "에헤헤."
10058080-257 = "찌잉……"
10058080-258 = "이런 과정이 없었다면, 히후미가 냉혹한 처단자 '요정여왕'인 것도 몰랐을 테니까."
10058080-259 = "아즈사 쨩?! 그, 그러니까 그건 이제 그마안-!"
10058080-265 = "어머, 어머-♡"
10058080-266 = "나름 멋진 대목인데 은근슬쩍 껴안지 마!"
10058080-269 = "감동을 나누는 트리니티의 문화인가 보군요. 그렇다면 저도……."
10058080-270 = "아, 안 돼!! 차라리 내가 혼자 희생할 테니까 이런 거에 물들지 마!!"
10058080-272 = "아지타니 히후미. 우승을 이렇게 포기하다니……."
10058080-273 = "정말 이해할 수 없군. 무슨 심정이었을지 도통 모르겠어."
10058080-274 = "그렇지만……."
10058080-281 = "이유가 없지는 않은 모양이군."
10058080-282 = "언젠가, 시간을 내서 물어보겠다."
10058080-284 = "아야야……."
10058080-285 = "결정적인 기회였는데, 하필 신발끈 때문에 이렇게 망쳐버리다니!"
10058080-286 = "돌아가면 숙청당할 거야…… 히잉……."
10058080-287 = "마리나."
10058080-288 = "으앗, 체리노 회장님!"
10058080-289 = "죄송합니다! 아, 아얏……."
10058080-290 = "흐음."
10058080-291 = "다쳤나?"
10058080-292 = "아, 아닙니다! 끄떡없습니다!"
10058080-293 = "……."
10058080-294 = "다들, 부축하도록."
10058080-295 = "수고했다 마리나."
10058080-298 = "회, 회장님-!!"
10058080-299 = "자아, 마리나 위원장. 제가 부축할게요."
10058080-300 = "그런데 마리나, 돌아가서 화장실 청소는 해주면 안 돼?"
10058080-301 = "마리나가 청소하는 게 제일 깨끗해."
10058080-302 = "맡겨만 주십쇼, 회장님! 반짝반짝 닦아두겠습니다!"
10058080-303 = "(결과는 숙청하고 다를 게 없는 것 같지만 다행이네요.)"
10058080-306 = "으, 으헤헤. 다들 바쁘신 것 같아서 실례하겠습니다-!"
10058080-307 = "수고들 하세요-!"
10058080-310 = "오오……."
10058080-311 = "가슴 뜨거워지는 전개."
10058080-314 = "얼른 도망가야지!! 맘 바뀔지도 모른다구!!"
10058080-321 = "손쓸 새도 없이 당했어……."
10058080-322 = "끄윽……."
10058080-327 = "이로하 차장님. 적 전차 무력화됐습니다."
10058080-328 = "이걸로 33대 격파입니다. 이제 어떻게 할까요?"
10058080-329 = "마지막 과녁으로 갑니다."
10058080-330 = "운전수. 기어 3단으로. 미속 전진."
10058080-331 = "장전수. 철갑유탄 장전하세요."
10058080-332 = "네! 철갑유탄 장전!"
10058080-336 = "차장님. 대회 운영 측입니다!"
