[translation]
10058080-1 = "第8話;クーデター、じゃない？"
10058080-2 = "ドン！！！！"
10058080-5 = "会長、ご指示を。#nクルセイダーは我々との距離が開いたため、装甲を貫通できずにいます。"
10058080-6 = "それなら、身動き取れない183号のやつらから粛清しよう。"
10058080-7 = "履帯が切れて、おいらを狙うこともできないからな！"
10058080-8 = "分かりました！各員！狙いを定め、砲撃を開始してください！"
10058080-9 = "了解！"
10058080-14 = "え、エンジンが止まっちゃった！"
10058080-15 = "赤いランプが光ってるけど大丈夫なの！？"
10058080-16 = "オーバーヒートです。ラジエーターが壊れちゃったみたいですね……#n今エンジンをかけたら焼き付いてしまいます。"
10058080-17 = "敵の戦車、私たちから狙いを外した。"
10058080-18 = "183号から撃つつもりだ。"
10058080-19 = "どうして逃げないの！？あんなに時間稼いだのに！"
10058080-20 = "逃げられないんです。戦車の履帯が切れているので。"
10058080-21 = "砲塔もなしでは、反撃すら……。"
10058080-22 = "それでも……戦車を捨てずに、履帯を直そうと頑張ってる。"
10058080-23 = "泣きながらだけど……最後まで、逃げずに……。"
10058080-24 = "じゃあどうするの？もう、打つ手はないんでしょ？"
10058080-25 = "……一つだけ、あります。"
10058080-26 = "ヒフミ……？"
10058080-27 = "自分たちで車体を回せないなら、私たちが回してあげればいいんです。"
10058080-28 = "つまり……クルセイダーちゃんをぶつけて方向転換させます。"
10058080-29 = "そうは言っても……私たちが今エンジンをかけたら……。"
10058080-30 = "エンジンが焼き付く。そうでなくとも、代わりに砲弾が当たるかもしれない。"
10058080-31 = "コハルちゃん。"
10058080-32 = "じゃあ、優勝できないじゃん……#nそしたら、また補習授業して……勉強して……。"
10058080-33 = "コハル。"
10058080-34 = "……。"
10058080-35 = "うぅぅ……。"
10058080-36 = "……同じこと考えてるなら、私に言わせないで！"
10058080-41 = "コハルちゃん♡"
10058080-42 = "損することが分かってるのに……#n放っておけなくて足突っ込んじゃうとこ、ほんっとうにムカつく！"
10058080-43 = "補習授業、絶対助けなさいよ！じゃないと絶交するから！うわあぁぁぁ！！！"
10058080-46 = "みんな、行くわよ！！！"
10058080-48 = "捕まえたぞ、反乱分子め！"
10058080-49 = "おいらに反抗するやつらは、零距離粛清だ！"
10058080-50 = "もう少しで直せるのに……。"
10058080-51 = "お……。"
10058080-52 = "わっ……た……。"
10058080-53 = "ごめんなさい、補習授業部のみなさん。あんなに助けていただいたのに……。"
10058080-54 = "やっぱ……砲塔、回るようにしとけば良かったなぁ……。"
10058080-55 = "あとちょっと……車体が、横に向いたら……。"
10058080-58 = "撃てー！"
10058080-61 = "？"
10058080-65 = "きゃあっ！？な、何かぶつかった！？"
10058080-66 = "補習授業部の人たちが、私たちの身代わりに……！"
10058080-67 = "追突事故みたいだね。保険会社を呼ぼうか。"
10058080-69 = "みなさん！これで狙えるはずです！"
10058080-70 = "この距離なら問題ない。"
10058080-71 = "な、なんだと！？やつら、反撃に出る気か！"
10058080-74 = "補習授業部のみなさん！！！"
10058080-75 = "どうせ粛清されるなら、やるっきゃない！！！"
10058080-76 = "真剣勝負だ！！もらったチャンスは、無駄にしない！！"
10058080-77 = "もう、後には引けない！！！"
10058080-83 = "AP弾、装填！！"
10058080-86 = "撃てっ！撃てっ！撃てっ！撃てっ！撃てえええぇぇぇ！！！"
10058080-90 = "この距離でも当たらないとは。[ruby=あじたに]阿慈谷[/ruby]ヒフミ、アテが外れたな。"
10058080-92 = "くっ……。"
10058080-95 = "ひいぃっ！！！"
10058080-96 = "何してんの！！どうやったらこの距離で外せるワケ～！？"
10058080-97 = "照準器が壊れて、ゼロインがズレてるの！！"
10058080-98 = "それならズレた分、照準を調整すればいいでしょ！"
10058080-102 = "またダメ！！"
10058080-103 = "撃つたびに反動で狙いがズレちゃう！これじゃ予測もできない！"
10058080-105 = "これ以上、引き延ばす必要はない。次弾を装填しろ！"
10058080-106 = "予備の弾が隅にあるので、今引っ張り出しています！"
10058080-107 = "早くしないと、お前も粛清するぞ！！"
10058080-109 = "そんな……！"
10058080-110 = "せっかく助けてあげたのに、うわあぁぁぁん！"
10058080-112 = "どうしよう！どうしたらいいの！？"
10058080-113 = "とにかく、狙いを定めなきゃ……。"
10058080-114 = "……そうだ！！"
10058080-115 = "アンナ、砲弾を抜いて！！"
10058080-116 = "急にどうしたの！？今さら降参でもするつもり？"
10058080-117 = "んなわけないでしょ！いいから、早く！！！"
10058080-118 = "わ、分かったわよ！！"
10058080-121 = "どいた、どいたぁ！！"
10058080-122 = "どうして砲尾に頭を押し付けるのよ！？危ないでしょ！"
10058080-123 = "もぉ！うるさ～いっ！黙って、見とけ～！！"
10058080-127 = "右に5！下に10！"
10058080-130 = "よしっ！！装填！！"
10058080-133 = "撃てっ！撃てっ！撃てっ！撃てっ！撃てえええぇぇぇ！！！"
10058080-134 = "発射！！！"
10058080-138 = "なんだ！？"
10058080-141 = "うわあああぁぁぁっ！？"
10058080-142 = "ドン！！！！！"
10058080-148 = "やりましたね。最後まで諦めなかったアンナさんたちの勝利です。"
10058080-149 = "私たちの犠牲も報われた。"
10058080-150 = "再試験……今から嫌なんだけど……。"
10058080-151 = "あら♡心配しないでください、コハルちゃん。#nあんなことやこんなこと、ぜ～んぶ教えてあげますからね。"
10058080-152 = "本当に落ち込んでるんだから、やめてっ！"
10058080-154 = "て、敵戦車、撃破……。"
10058080-155 = "やりぃ……。"
10058080-159 = "エリナぁ！？"
10058080-160 = "うぅっ……私も、緊張が解けて……。"
10058080-165 = "こうなるから、睡眠は大事。"
10058080-167 = "やはり強いぞレッドウィンターからの刺客！#n難しい状況でしたが、臨機応変に対応して生き残りました！"
10058080-168 = "照準器が壊れたから、砲身をのぞき込んで照準を合わせるなんて……前代未聞です！"
10058080-169 = "183号は撃破数2両を記録しました。ダークホースの名に相応しい活躍です！"
10058080-170 = "一方、ランキング2位の阿慈谷ヒフミさん率いる#n補習授業部チームが脱落してしまいました。#n本大会はまさに、一寸先は闇とも言える波乱の展開を見せています。"
10058080-171 = "みんな、すごく怒ってるみたい。仲良しじゃないの？"
10058080-172 = "イブキのおやつを分けて、とめたほうがいいのかな……？"
10058080-173 = "大丈夫だよ、イブキちゃん！これはスポーツだからね！"
10058080-174 = "そうですよね、先生！"
10058080-175 = "[s] \"みんな、ケンカを繰り返しながら成長していくんだよ！\""
10058080-176 = "ほんと！？それなら……イブキもたくさんケンカして、いっぱい大きくなる！"
10058080-177 = "[s] \"そういうことじゃないよ、イブキ！\""
10058080-178 = "先生の戸惑った顔、いただき～！あはは！"
10058080-179 = "……はい。では、試合はこのままクライマックスに向かいます！"
10058080-180 = "チャンネルは――"
10058080-181 = "[s] \"――そのままだよ！\""
10058080-186 = "あ、あのぉ……。チェリノ会長？"
10058080-187 = "おケガはありませんか？へへっ……。"
10058080-188 = "お前らが、おいらの戦車を撃破したのだな！？"
10058080-189 = "くぅん……。"
10058080-190 = "怒らないでください！これには、深いワケが……。"
10058080-191 = "レッドウィンターが優勝するとは言ったが、#n足を引っ張りあってどうするんだ！！この反乱分子め！！"
10058080-192 = "きぃん……。"
10058080-193 = "お前らは、戻ったら粛清だ！粛清！！"
10058080-194 = "チェリノ会長。"
10058080-195 = "なんだ、お前。まだ言い訳があるのか？"
10058080-196 = "チェリノ会長。私たちはクーデターを起こしたのではありません。"
10058080-197 = "ちょっと、ラナ！！"
10058080-198 = "会長は今怒ってるんだから、謝っておけばいいんだよ！！"
10058080-199 = "クーデターを起こしたのではない？どういうことだ？"
10058080-200 = "私たちはクーデターを起こしたのではなく……#nただ、会長が乗っている戦車を壊しただけです。"
10058080-204 = "おいらが乗っている戦車を壊しただけだと……？"
10058080-205 = "そうです。#n会長が優勝してこいと言ったので、優勝するために会長の戦車を倒したのです。"
10058080-206 = "チェリノ会長が優勝すれば、私たちは優勝できませんから。"
10058080-207 = "クーデターの意図はありません。だから宣言もしませんでした。"
10058080-212 = "クーデターではなく、優勝するためにおいらを攻撃したというのか？"
10058080-213 = "……。"
10058080-217 = "なんだ、そういうことか！お前たちはレースをしただけということだな！"
10058080-218 = "えっ！？"
10058080-219 = "ええっ！？"
10058080-220 = "勘違いしそうになったじゃないか！#nレースを口実にクーデターを起こし、#nおいらを引きずり降ろそうとしているのかと思ったぞ！"
10058080-221 = "それなら問題ないのだ。良い勝負だった！"
10058080-222 = "クーデターなんて、とんでもないです。事務局は面白くなさそうなので。"
10058080-223 = "トモエ！こいつらは粛清名簿から消すように！"
10058080-224 = "分かりました。この3人は粛清予約名簿から削除します。"
10058080-225 = "はあああぁぁぁ……！"
10058080-228 = "みなさん、大丈夫ですか？"
10058080-229 = "は～い！いつもどおり、弾力があってツヤツヤです！"
10058080-230 = "いっつもそんなコメントを準備してるの！？最っ低、死刑！！！"
10058080-231 = "あはは……良かったです。みなさん、ご無事のようで。"
10058080-232 = "クルセイダーちゃんの状態はどうですか？"
10058080-233 = "大破している。弾薬は尽きたし、エンジンもアクセルも使い物にならない。"
10058080-234 = "残念ですが、脱落ですね……。"
10058080-235 = "阿慈谷ヒフミ。そしてその仲間たちよ。"
10058080-239 = "あ、あの……これはレースということで……。"
10058080-240 = "ふ、二人とも落ち着いて……。"
10058080-244 = "文句のつけようのない試合だった！また戦えて嬉しかったぞ！"
10058080-245 = "こちらこそ！形式にとらわれない戦術に感服しました！"
10058080-246 = "ん……？"
10058080-247 = "チェリノ会長が、戦った相手を怒らない……？"
10058080-248 = "ええっ……？"
10058080-249 = "さっきまで敵意むき出しじゃなかった……？"
10058080-250 = "チェリノ会長は常に寛大ですが、特に寛大になられる分野があるんですよ。"
10058080-251 = "中でも戦車レースでは、戦った好敵手を尊重します。"
10058080-252 = "補習授業部のみなさん……。"
10058080-253 = "私たちのせいで、本当にすみません……。"
10058080-254 = "大丈夫ですよ！こういうこともすべて……はいっ、アズサちゃん！"
10058080-255 = "「大事な過程」だから。楽しかった。"
10058080-256 = "えへへ。"
10058080-257 = "うえぇぇぇん……。"
10058080-258 = "この過程がなかったら、#nヒフミが冷酷な「妖精女王」だってことも知らなかった。"
10058080-259 = "アズサちゃん！？#nそれはもうやめてください～！！"
10058080-265 = "あら、あら～♡"
10058080-266 = "いいところなんだから、さりげなく抱きしめないで！"
10058080-269 = "感動を分かち合うトリニティの文化なんですね。それなら私も……。"
10058080-270 = "だ、ダメっ！！私が犠牲になるから、こんな人に染まらないで！！"
10058080-272 = "阿慈谷ヒフミ。そんな風に優勝を諦めるなんて……。"
10058080-273 = "どういうつもりなんだ？まったくもって理解できないぞ。"
10058080-274 = "だが……。"
10058080-281 = "理由がないわけでは、なさそうだな。"
10058080-282 = "いつか、時間を作って聞いてやろう。"
10058080-284 = "あいたた……。"
10058080-285 = "絶好のチャンスだったのに、よりにもよって靴紐がほどけるなんて！"
10058080-286 = "帰ったら絶対粛清だ……うぅっ……。"
10058080-287 = "マリナ。"
10058080-288 = "ちぇっ、チェリノ会長！？"
10058080-289 = "申し訳ありませんっ！あ、痛っ……。"
10058080-290 = "ふむ。"
10058080-291 = "怪我をしたのか？"
10058080-292 = "い、いえ！全然平気です！"
10058080-293 = "……。"
10058080-294 = "誰か、手を貸してやれ。"
10058080-295 = "ご苦労だった、マリナ。"
10058080-298 = "か、会長ぉー！！"
10058080-299 = "どうぞ、マリナ委員長。肩を貸します。"
10058080-300 = "ところでマリナ、帰ったらトイレ掃除をしてもらってもいいか？"
10058080-301 = "お前の掃除が一番綺麗になるからな。"
10058080-302 = "お任せください！ピカピカに磨き上げておきます！"
10058080-303 = "（粛清と変わらない気もしますが、よかったですね）"
10058080-306 = "あ、あはは。みなさんお忙しいようなので失礼しま～す！"
10058080-307 = "お疲れで～す！"
10058080-310 = "おお……。"
10058080-311 = "胸アツな展開。"
10058080-314 = "心変わりしないうちに早く逃げるわよ！！"
10058080-321 = "ぐああやられた……。"
10058080-322 = "ぐぅっ……。"
10058080-327 = "イロハ戦車長。敵の戦車を無力化しました。"
10058080-328 = "これで撃破数は33両です。次はどうしますか？"
10058080-329 = "最後の的に行きます。"
10058080-330 = "操縦手。ギアを3速に入れ、静かに前進してください。"
10058080-331 = "装填手。APHE弾を装填してください。"
10058080-332 = "はい！APHE弾、装填します！"
10058080-336 = "イロハ戦車長。運営から通信です。"
10058080-337 = "2番に繋いでください。"
10058080-341 = "……。"
10058080-344 = "分かりました、チアキ。疑問は残りますが、ルールはルールなので。"
10058080-345 = "それでは。"
10058080-348 = "はぁ。またどうしてこんな位置で……。"
10058080-349 = "操縦手。15メートル進んでから停止してください。"
10058080-350 = "イロハ戦車長。今の、何の連絡だったんですか？"
10058080-353 = "必要があれば、適宜情報は共有します。"
10058080-354 = "え？"
10058080-357 = "す、すみません！こいつはまだ合流して間もないんです！"
10058080-358 = "各自の役割を果たす上で有益な情報ではないと判断したため、#n共有しなかったまでです。"
10058080-359 = "必要な情報だったのでしょうか？"
10058080-360 = "い、いいえ！！"
10058080-361 = "すみません！黙って従います！"
10058080-366 = "私、もしかしてやばいことした？"
10058080-367 = "やばいってほどじゃないけど、あれこれ口を出したらダメ！"
10058080-368 = "私たちは命令どおり動くだけ。余計な提案や質問はしなくていいの。"
10058080-369 = "ええっ、普段はすれ違ったら挨拶もするのに。"
10058080-370 = "戦車に乗った時は例外！#nイブキちゃんレベルでない限り、戦車の中ではイロハ先輩に意見できないんだから。"
10058080-371 = "そうなんだ……謝ったほうがいいかな？"
10058080-372 = "そこまでする必要はないと思うけど、これからは気を付けて！"
10058080-377 = "このような形で会うことになるとは。"
10058080-378 = "あちらも、全力できてくれると良いのですが。"
10058080-383 = "命中！次で最後の的だね！"
10058080-384 = "それを撃ってゴールすれば優勝よ！"
10058080-387 = "あれ？ビデオ通話だ。誰からだろう……？"
10058080-390 = "もしもし？私たち、今忙しくて……。"
10058080-391 = "えー、こんにちはー！"
10058080-392 = "運営の[ruby=もとみや]元宮[/ruby]チアキですー！"
10058080-394 = "えっ……？"
