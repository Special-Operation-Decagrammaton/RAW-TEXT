[translation]
10012030-1 = "제3화;선제 필승"
10012030-14 = "……막상 치우고 나니 그래도 꽤 그럴싸해졌네."
10012030-15 = "……우리 리조트."
10012030-16 = "[s1] \"오~. '우리 리조트'~?\"\n[s2] \"잠깐 사이 주인의식이 생겼나 보네.\""
10012030-17 = "한번 말해보고 싶었을 뿐이야……! 이 정도면 묵기에는 충분하겠지……."
10012030-18 = "한번 말해보고 싶었을 뿐이야……! 이 정도면 묵기에는 충분하겠지……."
10012030-19 = "응응! 세리카 쨩 말이 맞아요. 아예 이대로 손님 받아 버려도 문제없지 않을까요?"
10012030-20 = "그, 그건 아직 무리죠……. 청소만 했을 뿐 시설도 기계도 하나도 정비되지 않은 상태잖아요?"
10012030-21 = "전기실로 들어가 쓸 수 있는 설비와 시스템도 다시 가동하고, 가져온 놀 거리도 세팅을 해야 하니까요."
10012030-22 = "그전까진 계속 준비와 정비의 시간이라고 봐야……."
10012030-23 = "……하지만 네. 확실히 깨끗해진 걸 보니 기분은 좋네요."
10012030-24 = "뭔가 전에 없던 후련함이 느껴지는 거 같고……."
10012030-25 = "이제 장소는 확보됐으니, 그럼 다음으로 전기실을……."
10012030-26 = "……식량이 먼저."
10012030-31 = "……식량?"
10012030-33 = "응. 식량. 무인도에 표류한 상황에서, 가장 먼저 챙겨야 할 건 생존을 위한 식량이야."
10012030-34 = "……응? 생존??"
10012030-35 = "저기, 딱히 생존을 따질 상황까진 아닌 거 같은데. 여긴 휴대폰 전파도 터지고, 버려진 배도 있고……."
10012030-36 = "그리고 이런 곳에서는 낚시로 단백질을 공급하는 게 최선의 방책."
10012030-37 = "……응. 반드시 해야만 하는 일. '생존'을 위해."
10012030-38 = "……듣지 않네. 선배."
10012030-42 = "마침 여기 낚시 장비도 다 있어."
10012030-46 = "……준비는 이미 완료. 남은 것은 실행뿐이야."
10012030-51 = "……'마침 여기'가 아니잖아. 완전히 본격적인 채비를 해 놨다고."
10012030-52 = "이거 뭔가 찬물 끼얹으면 안 될 것 같은 분위기인걸."
10012030-53 = "아야네 쨩. 아무래도 전기실은 다음 순번으로 미뤄야 할 거 같아."
10012030-55 = "……뭐, 순서가 그리 중요한 건 아니니까요. 실제로 식량도 고려 중인 사안이긴 하고……."
10012030-56 = "그나저나 선배가 낚시에 관심이 있으신 줄은 몰랐네요. 확실히 아비도스에서는 시도할 수 있는 환경도 아니지만……."
10012030-57 = "서바이벌 활동의 일환이니까. ……꼭 낚시가 아니어도 상관은 없어."
10012030-58 = "……아아. 그쪽이었네."
10012030-63 = "역시 이건 막을 수 없겠지?"
10012030-64 = "그럼……. 선생? 혹시 부탁 하나 해도 괜찮을까?"
10012030-65 = "[s3] \"물론이지. 나한테 맡겨.\"\n[s4] \"내가 시로코랑 같이 다녀올게.\""
10012030-66 = "……선생님?"
10012030-67 = "……선생님?"
10012030-68 = "같이 가는 거야……?"
10012030-70 = "고마워~. 그럼 부탁한다구, 선생~."
10012030-71 = "저희는 이 주변을 둘러보면서 다른 것도 찾아볼 테니까요. 먹을만한 과일도 많아 보이고……."
10012030-72 = "그럼 이왕 다녀오는 거, 큰 거 기대하고 있을게. 선배!"
10012030-74 = "……응."
10012030-78 = "나한테 맡겨."
10012030-86 = "(시로코와 함께 적당한 해안가 갯바위를 찾아갔다.)"
10012030-87 = "[ns5] \"이쯤이면 좋겠지?\"\n[ns6] \"좋은 낚시 포인트가 많구나.\""
10012030-88 = "……응. 좋아. 여기면 충분해."
10012030-89 = "……응. 좋아. 여기면 충분해."
10012030-90 = "낚싯대, 밑밥, 미끼, 보관할 망……. 모두 챙겼어."
10012030-91 = "[s] \"낚은 고길 들어 올릴 뜰채가 없지 않아?\""
10012030-92 = "그건 괜찮아."
10012030-93 = "그땐 선생님이 낚싯대를 잡아주는 동안,"
10012030-94 = "내가 쏘면 되니까."
10012030-95 = "[s] \"아하. 그렇구나.\""
10012030-99 = "[ns] \"……지금 뭐라고 하셨어요?\""
10012030-100 = "가장 확실한 낚시 방법. 죽은 고기는 도망칠 일도 없어."
10012030-101 = "……응?"
10012030-102 = "그 총으로 쏘면 고기가 부서질 수 있지 않겠느냐고?"
10012030-103 = "……으음. 그건……."
10012030-104 = "[s7] \"역시 거기까진 생각하지 않았구나.\"\n[s8] \"……뜰채 가지러 돌아가자.\""
10012030-105 = "……응……."
10012030-106 = "……응……."
10012030-107 = "……괜찮아요. 제가 챙겨 왔으니까."
10012030-108 = "……? 아야네?"
10012030-112 = "왠지 그런 걱정이 돼서 따라와 봤더니……. 역시 예상대로였네요."
10012030-113 = "[s9] \"아야네? 여긴 어쩐 일로…….\"\n[s10] \"일부러 따라와 준 거야?\""
10012030-114 = "아, 아뇨. 그게 그……. 아무래도 두 분만 보내기에는 역시 좀……. 그러니까……."
10012030-115 = "아, 아뇨. 그게 그……. 아무래도 두 분만 보내기에는 역시 좀……. 그러니까……."
10012030-116 = "다른 분들도 그렇게 이야기해서……. 그……."
10012030-117 = "……응. 고마워, 아야네."
10012030-119 = "그럼 내가 낚싯대를 잡고, 아야네의 권총으로 쏘는 것으로……."
10012030-120 = "그러니까 고기를 쏘면 안 된다고요, 선배……. 총의 위력 이야기가 아니잖아요."
10012030-121 = "제대로 뜰채 가져왔으니 뜰채를 쓰죠. 물고기가 살아 있어야 생선요리의 질도 좋아지는 법이니까요."
10012030-122 = "으음……. 응."
10012030-123 = "[s] \"시로코는 아야네 말을 잘 듣네.\""
10012030-124 = "……네, 네!?"
10012030-125 = "마, 말을 잘 듣다뇨!? 아뇨. 아니에요! 이건 절대 그런 게 아니라 시로코 선배는 그저……."
10012030-126 = "……응. 잘 들어. 아야네는 늘 좋은 판단을 내리니까."
10012030-127 = "……시로코 선배?"
10012030-128 = "아야네가 틀린 거면, 대부분 우리도 틀렸을 거라고 생각하니까. 모두 그렇게 생각해."
10012030-129 = "여기서 잡은 고기들도, 돌아가서 손질하기 전에 아야네에게 물을 예정이었어."
10012030-130 = "먹어도 되는 물고기인지, 독은 없는지."
10012030-132 = "혹은 돈이 되는지……."
10012030-134 = "선배……."
10012030-135 = "여기 있었구만, 이 녀석들!!"
10012030-140 = "……음? 뭐야? 이 녀석들, 아까 녀석들이랑 다른 녀석들 같은데……?"
10012030-141 = "역시 그게 전부가 아니었나 보네."
10012030-142 = "차라리 잘 됐어, 뭉쳐 있을 때보단 각개격파가 가능성 있지!"
10012030-144 = "저기……. 누구신지……."
10012030-146 = "후후후……. 이번에는 우리도 밀리지 않을걸. 이쪽은 '지원군'이 있으니까 말이야!!"
10012030-147 = "자, 나설 차례다. 지금부터 일당 값을 해주셔야겠어!"
10012030-148 = "와카모!!"
10012030-153 = "[ns] \"……?\""
10012030-155 = "[ns] \"……??? 누구……요????\""
10012030-157 = "이것 참……. 무슨 일로 그렇게 다급히 부르시나 했는데……."
10012030-158 = "솔직히 꽤 실망스럽네요. 겨우 이 정도의 인원수에 고전하고 계셨던 건가요?"
10012030-159 = "이래서야 어떻게 이 넓은 리조트를 사냥하겠다는 건지……. 겨우 세 사람 상대로 쩔쩔매시면……."
10012030-160 = "……응?"
10012030-161 = "……어……."
10012030-162 = "……어라?"
10012030-163 = "……선생님?"
10012030-164 = "[s11] \"……와카모?\"\n[s12] \"이런 데에서 다 보는구나…….\""
10012030-165 = "……?"
10012030-166 = "……?"
10012030-167 = "으, 으응? 응……? 무, 무슨……? 이게 무슨 상황일까요……?"
10012030-172 = "……."
10012030-174 = "자, 잠시만요……? 우선 정리를……."
10012030-178 = "……우, 우와아아앙!?"
10012030-179 = "[s13] \"시로코!?\"\n[s14] \"다짜고짜 공격……!?\""
10012030-182 = "……응."
10012030-183 = "선수 필승. 지휘를 부탁해, 선생님."
