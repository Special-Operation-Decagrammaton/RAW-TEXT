[translation]
52145-2 = "(한편 그 시각, <피안의 저택> 본관에서는……)"
52145-15 = "하아, 하아……"
52145-16 = "아야메, 괜찮아?"
52145-17 = "아직은 견딜만해. 그보다 나구사, 네 쪽이야말로 괜찮아?"
52145-18 = "응. 나는 괜찮아."
52145-19 = "하지만 백물어가 끊임없이 나타나고 있어서…… 빨리 선생님과 다른 부원들과 함께 합류해야 하는데, 도무지 틈이 보이질 않아."
52145-20 = "그래도 이번에는 아야메, 네가 있으니 분명 괜찮을 거야."
52145-21 = "아야메는 나와 다르게 언제나 어려운 임무도 수월하게 해결했으니까."
52145-25 = "………."
52145-30 = "그대는 여전히 이해하지 못하고 있구나."
52145-31 = "사람의 마음은 서로 이해할 수 없는 불가해의 영역이라는 것을."
52145-39 = "다시 이곳에서 마주치게 되는구나, 백화요란의 아이야."
52145-50 = "당신은 그때 아야메를 데려갔던……"
52145-51 = "아니, 그건 거짓 된 꿈이었어. 그런 일은 실제로 벌어지지 않았는걸."
52145-52 = "분명 아야메가 자신의 입으로 그런 일은 없었다고 답해주었으니까……"
52145-53 = "호오, 그럼 그대는 나를 어떻게 알고 있는 것이지?"
52145-54 = "지금 이 광경 또한 꿈을 꾸고 있는 것이라 여기는 겐가?"
52145-55 = "……저 말에 흔들려서는 안 돼. 상대는 괴서를 다루며 사람을 홀리는 이매망량, 화조풍월부의 부장이니까."
52145-59 = "아야메, 내가 신호하면 바로 협공을—"
52145-63 = "……아야메?"
52145-64 = "방금 전까지 옆에 있었는데…… 어, 어디에 간 거야, 아야메?"
52145-69 = "어디에 갔기는. 나는 처음부터 너와 함께한 적이 없었는데."
52145-84 = "아야…… 메……?"
52145-85 = "이제야 꿈에서 깨어나 나를 알아보는구나."
52145-86 = "좋은 꿈은 충분히 즐겼니, 나구사?"
52145-87 = "그럼 이제 꿈에서 깨어나 악몽 같은 현실을 마주할 차례야."
52145-88 = "……말도 안 돼."
52145-89 = "내가 아는 아야메는, 저런 얼굴을……"
52145-96 = "다음화;달콤한 꿈의 끝"
