[translation]
2004905-1 = "일광욕은 재미없어"
2004905-2 = "(선베드 두 개를 가지고 미사키가 있는 해변으로 향했다.)"
2004905-4 = "역시 왔구나, 선생님."
2004905-5 = "뭐야, 그건…… 선베드? 그것도 두 개나?"
2004905-6 = "내 것까지 가져왔다니, 나는 하겠다는 말도 안 했거든."
2004905-10 = "……알겠어. 어울려 줄게."
2004905-11 = "[s] \"……어라? 진짜로?\""
2004905-12 = "왜 그래?"
2004905-13 = "……너무 빨리 승낙해서 오히려 의문이라고?"
2004905-14 = "이젠 하겠다고 해도 문제인 거야?"
2004905-15 = "……별 이유는 없어. 어차피 할 거라면 빨리 해치워 버리는 편이 좋겠다고 생각했을 뿐이야."
2004905-16 = "이러나저러나, 별 의미 없는 일이니까."
2004905-17 = "그래서, 여기 누우면 돼?"
2004905-21 = "(미사키와 나란히 하늘을 보고 누웠다.)"
2004905-23 = "……더워."
2004905-24 = "[s] \"더운 건 익숙하다고 하지 않았어?\""
2004905-25 = "익숙하다고 했지, 좋아한다고는 안 했어."
2004905-26 = "어째서 일부러 햇빛을 쬐는 거야."
2004905-27 = "[s1] \"조금 태운 피부는 건강해 보이니까……?\"\n[s2] \"비타민 D라든가……?\""
2004905-30 = "뭐야, 그게."
2004905-31 = "결국 다 의미 없는 것들뿐이잖아."
2004905-32 = "[s] \"그렇게 되려나…….\""
2004905-33 = "……."
2004905-37 = "……비?"
2004905-38 = "[s3] \"갑자기 소나기가……!\"\n[s4] \"미사키, 일단 저기 바다의 집까지 뛰자!\""
2004905-44 = "하아, 하아……."
2004905-45 = "[s] \"일단 여기 좀 앉아.\""
2004905-48 = "결국 이런 결말일 줄 알았어."
2004905-49 = "애초에 즐긴다는 행위는 나한테 어울리지 않아."
2004905-50 = "어차피 그 끝에 기다리고 있는 건 이런 배신……."
2004905-51 = "그렇다면 처음부터 기대 따위 하지 않는 게 좋잖아."
2004905-52 = "기대가 없으면 실망도 없으니까."
2004905-53 = "쓸데없는 감정의 동요도…… 괜한 헛수고도 할 필요 없이."
2004905-54 = "[ns] \"…….\""
2004905-58 = "비가 그쳤네. 정말 소나기였나 봐."
2004905-59 = "그래서, 이제 어떻게 할 거야?"
2004905-60 = "일광욕, 계속할 생각이야?"
2004905-61 = "[s] \"……응, 계속할 거야.\""
2004905-62 = " 윽…… 정말로?"
2004905-63 = "[s5] \"결국 건강해 보이는 피부도, 비타민 D도 얻지 못한다고 해도.\"\n[s6] \"미사키와 나란히 누워 이야기했던 추억은 남는 거니까!\""
2004905-66 = "……."
2004905-67 = "그게 뭐야. 모르겠어."
2004905-68 = "추억이라니……"
2004905-69 = "그게 허무함을 감수할 만큼 중요한 거야?"
2004905-70 = "[s7] \"그럼 같이 계속해 보지 않을래?\"\n[s8] \"답을 찾을 수 있을지도 모르잖아?\""
2004905-73 = "또 그렇게, 끌어들이려고……."
2004905-74 = "……."
2004905-75 = "하아……."
2004905-76 = "솔직히 잘 모르겠지만……."
2004905-77 = "……알았어. 마음대로 해."
