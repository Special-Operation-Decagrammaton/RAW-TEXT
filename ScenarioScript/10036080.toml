[translation]
10036080-1 = "제8화;전설의 스케반"
10036080-3 = "발키리 경찰학교 학생들은 일전에 있었던 그 체포작전을 떠올리며 몸서리를 치곤 하죠."
10036080-8 = "경찰차 열두 대와 전차 두 대를 잃고 다수의 부상자가 발생한 그날, 적은 '단 한 명'이었으니까."
10036080-13 = "그 근력과 맷집은 타의 추종을 불허."
10036080-18 = "악명 높은 '일곱 죄수' 중 하나, '전설의 스케반'—"
10036080-24 = "아름다운 밤이에요, 여러분."
10036080-25 = "그리고 오랫동안 기다리던 밤이기도 하답니다."
10036080-28 = "쿠리하마 아케미……!"
10036080-30 = "네, 잘 기억하고 계신 것 같아 다행이에요."
10036080-31 = "소녀, 아케미, 인사드립니다."
10036080-32 = "[s] (저 모습은……?)"
10036080-33 = "오랜만이에요. 참으로 오랜만이에요."
10036080-34 = "그동안 여러분을 보고 싶어서 얼마나 애가 탔는지 몰라요."
10036080-35 = "여러분은 어떠셨나요?"
10036080-36 = "저와 마지막으로 만난 순간, 분명히 기억하시겠지요?"
10036080-38 = "……!"
10036080-40 = "그렇지 않다면 곤란하답니다."
10036080-41 = "여러분의 밀고로 발키리의 참새 녀석들이 제가 있는 곳을 알아냈으니까요."
10036080-42 = "교정국의 감방에서 참으로 기나긴 시간을 보냈답니다."
10036080-43 = "여.러.분.생.각.을.하.면.서.요."
10036080-44 = "그럼, 준비는 되셨나요?"
10036080-46 = "주, 준비?! 무슨 준비?!"
10036080-48 = "그야 물론…… 저한테 박살 날 준비죠."
10036080-50 = "히, 히익……!"
10036080-51 = "여, 역시 저 불량배들에게 습격을 지시한 것도 너였지!"
10036080-53 = "네? 누구한테 뭘 지시해요?"
10036080-60 = "큰누님!!!!!"
10036080-62 = "어머, 어머? 여러분이 어떻게 여기에……?"
10036080-63 = "그야 당연히, 누님의 원수를 갚기 위해서죠!"
10036080-64 = "하지만 전 더 이상 여러분의 일원이 아닌걸요…… 탈옥한 죄수일 뿐……."
10036080-65 = "아니! 저희에게는 언제까지나 큰누님이세요!"
10036080-66 = "발키리의 표적이 된 후 저희를 보호하기 위해 탈퇴하신 거니까요……!"
10036080-67 = "저희를 떠나시자마자 헬멧단 놈들의 계략에 빠져 교정국의 차가운 감방으로…… 크흑!"
10036080-68 = "……여러분, 맙소사. 저를 잊지 않았다니, 게다가 저를 위해 복수까지 생각해 주고 계셨다니……."
10036080-69 = "소녀, 무척이나 감동하였어요……!"
10036080-70 = "교수에게 의뢰하니, 이러한 가슴 따듯한 만남도 이루어지는 거네요!"
10036080-71 = "누님도 히죽히죽 교수에게 복수를 의뢰하신 건가요?!"
10036080-72 = "설마 교수가 말한 '그녀'가 누님이었을 줄은……!"
10036080-76 = "[ns] (히죽히죽 교수라, 그 이름은 분명…….)"
10036080-82 = "감동적인 재회에 끼어들어서 미안한데 말야! 이쪽은 쉽게 당해줄 생각이 없거든?"
10036080-83 = "맞아! 아무리 '전설의 스케반'이라지만 탈옥한 지 얼마 안 된 상태!"
10036080-84 = "오히려 헬멧단의 주가를 올릴 절호의 기회야!"
10036080-90 = "네, 좋아요. 그렇게 나와주셔야죠."
10036080-91 = "아참, 여러분. 저를 위해 나서준 것은 무척이나 감사한 일이지만."
10036080-92 = "우선은 이 복수, 저 스스로 매듭짓고 싶어 한 부분. 이해해 주시길."
10036080-93 = "이것은 제 몫의 복수. 여기선 엘리자베스와 단둘이서만 상대해 드리겠습니다."
10036080-94 = "자! 각오하세요!"
10036080-97 = "우와아아악!"
10036080-98 = "도, 도망치지 마! 맞서 싸워!"
10036080-102 = "아야야야야야야얏! 취소! 도망쳐! 도망쳐!"
10036080-114 = "공주, 엎드려……!"
10036080-123 = "크윽……."
10036080-124 = "히에엑! 미사키 씨! 괜찮으신가요?!"
10036080-126 = "미사키……!"
10036080-127 = "칫……! 선생, 이렇게 있을 수는 없다. 아이들이 위험해."
10036080-128 = "게다가 무대도 엉망이 되고 있으니……!"
10036080-129 = "[s] 고개를 끄덕인다."
10036080-130 = "이봐! 거기 난입자!"
10036080-132 = "네? 소녀 말씀이신가요?"
10036080-137 = "어멋! 엘리자베스가!"
10036080-138 = "[s] (로켓발사기 이름이었나…….)"
10036080-139 = "어떤 무도한 분이시죠?!"
10036080-141 = "나다."
10036080-142 = "당장 물러나도록. 이 이상으로 축제를 망치는 건 허용하지 않겠다."
10036080-143 = "후후훗, 앙증맞은 반항이군요."
10036080-144 = "당신은 누구시길래 저한테 허용하니 못하니 하시는 건가요?"
10036080-145 = "당신이 뭐라고 하건 소녀는 물러날 수 없답니다. 여기에 온 이상, 철저한 피의 복수를 이루겠다고 결심했기에!"
10036080-146 = "그럼에도 계속해서 방해하려고 하신다면……!"
10036080-147 = "그 행동, 처음부터 무의미했다는 걸 깨닫도록 힘의 차이를 알려드리죠!"
