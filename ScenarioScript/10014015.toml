[translation]
10014015-2 = "멈추세요, 쿄야마 카즈사!! 왜 도망치는 겁니까!!!"
10014015-3 = "으아아아아, 저리 가! 저리 가란 말이야!!"
10014015-20 = "하아, 하아."
10014015-21 = "하아…… 땀 나……."
10014015-22 = "이쯤이면 됐겠지……? 우자와 녀석도 이젠 안 보이고……."
10014015-23 = "힘들어 죽겠다……. 진짜……. 오늘만 벌써 세 번째야……."
10014015-24 = "미안, 선생님……. 혹시 휘말리진 않았어? 일단 바로 선생님한테서 멀어지긴 했는데……."
10014015-25 = "아아. 괜찮다고? 그럼 다행이지만……."
10014015-26 = "……응?"
10014015-27 = "그나저나 어떻게 이렇게 빨리 따돌리고 온 거냐고? 음……. 뭐, 별 건 아닌데."
10014015-28 = "저 녀석, 벽 넘는 건 느리니까 말이야. 대충 막다른 골목으로 유도한 뒤 벽을 뛰어넘어 도망치면 돼."
10014015-32 = "……? 뭐야. 왜 그런 표정을 지어?"
10014015-33 = "[s1] \"카즈사는 벽 뛰어넘을 수 있는 거야?\"\n[s2] \"뭔가 되게 쉽게 말하시네요……?\""
10014015-34 = "……아."
10014015-35 = "……아."
10014015-36 = "이런……. 그, 그게 말이지……."
10014015-37 = "나야 좀 그럴 이유가 있었달까, 연습할 일이 많았달까……. 일단은 그냥 그런 거로……."
10014015-41 = "……하아."
10014015-42 = "알았어. 상담을 부탁한 주제에 제대로 설명도 안 해주는 건 예의가 아니겠지. 죄송합니다."
10014015-43 = "사실 웬만하면 떠벌리고 다니지 않고 싶었거든. 뭐 딱히 좋은 일도 아니고 해서……."
10014015-44 = "그렇지만……. 그러네. 그걸 말하지 않고선 이 상황에 대한 상담도 제대로 받을 수 없겠지."
10014015-45 = "음……. 어디서부터 말해야 하나."
10014015-46 = "……선생님. <스케반>이라고 알아?"
10014015-47 = "뭐, 간단하게 말하자면 불량 학생인데, 그 중에서도 좀 딱 보면 느낌이 오는 애들 있잖아."
10014015-48 = "그, 왜……. 항상 마스크 쓰고, 교복 마음대로 개조해서 치마 길이 늘이고, 가슴팍에 붕대 같은 걸 두르고……."
10014015-49 = "뭐, 선생님이니까 어쩌면 이미 알고 있을 수도 있겠지만……."
10014015-50 = "아무튼 자세한 이야기는 사족이니 패스하고, 그래서 왜 이 이야기를 하냐면……."
10014015-51 = "조금 전의 그 우자와라는 녀석, 중학생 때부터 강한 스케반이라고만 하면 앞뒤 안 가리고 달려드는 열혈 바보였거든."
10014015-52 = "자칭 '정의의 사도'……라는 거지."
10014015-53 = "보니까 지금도 '자경단'이니 뭐니 하면서 비슷한 짓을 계속하고 있던 것 같은데……. 달라진 게 하나도 없달까."
10014015-54 = "후……. 정말이지, 이래서 말 많고 시끄러운 녀석들은 싫다니까."
10014015-58 = "……아. 미안. 또 이야기가 샐 뻔했네. 하려던 말은 전부 이것 때문이야."
10014015-63 = "[ns3] \"이 사진은…….\"\n[ns4] \"……어라. 스케반?\""
10014015-64 = "딱히 좋아서 들고 있는 사진은 아니지만, 선생님한테는 보여줘야 할 거 같아서 가져왔거든."
10014015-65 = "딱히 좋아서 들고 있는 사진은 아니지만, 선생님한테는 보여줘야 할 거 같아서 가져왔거든."
10014015-66 = "혹시라도 농담으로 듣는다거나, 못 믿겠다 같은 말을 할 때를 대비해서 말이지."
10014015-67 = "……어?"
10014015-68 = "……응. 맞아. 봤으니 이제 다 알겠지? 바로 그런 이유야."
10014015-69 = "그거……."
10014015-70 = "…………나야."
10014015-71 = "아니. 정확히는 지금의 내가 아니라 중학생 때의 나인 거지만 말이지."
10014015-72 = "……나……."
10014015-73 = "…………."
10014015-78 = "……'스케반'이었거든."
