1014203-37 = "[log]Let's go to the beach together![/log]"
1014203-39 = ""
1014203-40 = "..."
1014203-41 = "Since the rumor is that the snow maiden is wandering around the beach alone..."
1014203-42 = "...if you are with me, the \"Snow Maiden of the Sands\" rumor would naturally fade away?"
1014203-43 = "..."
1014203-44 = "Is this not simply a ploy to spend time with me at the beach?"
1014203-45 = "Your cunning knows no bounds, Sensei."
1014203-46 = "However, that does sound rather...fun."
1014203-47 = "I am in agreement. Let us go to the beach."
1014203-48 = "[s] \"YAY!\""
1014203-50 = "So I went to the beach with Nagusa..."
