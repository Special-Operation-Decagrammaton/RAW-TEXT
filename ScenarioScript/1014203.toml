1014203-110 = "(ช่วงเวลาที่สนุกสนานดำเนินต่อไป...)"
1014203-115 = ""
1014203-117 = "เวลาผ่านไปขนาดนี้แล้วเหรอเนี่ย"
1014203-118 = "ขอบคุณนะ วันนี้สนุกมากเลยละ"
1014203-119 = "ฉันสนุกจนเกือบลืมจุดประสงค์เดิมที่มาทะเลด้วยกันวันนี้เลย"
1014203-120 = "ฉันมาที่นี่เพราะอยากคลายความเข้าใจผิดแท้ๆ แต่ฉันกลับสนุกจนลืมตัวไปเลย..."
1014203-121 = "[ns] \"เหตุผลน่ะไม่สำคัญหรอก\""
1014203-123 = "[ns] \"ถ้าอยู่ด้วยกันแล้วมีความสุขก็พอแล้วละ\""
1014203-125 = "..."
1014203-126 = "อื้อ... นั่นสินะ"
1014203-127 = "ถ้างั้น ไว้ฉันขอให้ช่วยแบบนี้อีกได้มั้ย?"
1014203-128 = "[s] \"ได้อยู่แล้ว\""
