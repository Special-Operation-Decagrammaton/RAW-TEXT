[translation]
1014203-1 = "해변의 설녀"
1014203-2 = "(며칠 뒤. 업무차 찾은 백귀야행의 거리…….)"
1014203-5 = "저기, 소문 들었어?"
1014203-6 = "소문? 무슨 소문?"
1014203-7 = "토리이 해변에 설녀가 나타난다는 소문!"
1014203-8 = "에에엥? 설녀가?"
1014203-10 = "(다른 장소에서도…….)"
1014203-12 = "아니, 해변에 설녀라니. 햇빛에 다 녹아버리는 거 아니에요?"
1014203-13 = "응? 그런가? 아무튼 그런 소문이 돌던데요."
1014203-14 = "설녀가 혼자 해변을 돌아다닌다고!"
1014203-16 = "[ns1] (이상한 소문이 돌고 있다…….)\n[ns2] (설마…….)"
1014203-20 = "(서둘러 백화요란 분쟁조정위원회를 찾아갔다.)"
1014203-22 = "응? 선생님? 갑자기 무슨 일이야?"
1014203-24 = "(나구사에게 거리에서 떠도는 소문에 대해 말한다.)"
1014203-26 = "……."
1014203-27 = "그거, 아무래도 내 이야기가 맞는 것 같아."
1014203-28 = "내가 간 해변이 토리이 해변이었거든."
1014203-29 = "최대한 눈에 안 띄려고 혼자 수영했는데, 그게 역효과였을 줄이야."
1014203-30 = "……역시, 나는 어떻게 해도 사람들의 시선을 사로잡는 모양이구나."
1014203-31 = "[ns3] \"이, 이건 내 잘못이야……!\"\n[ns4] \"바다에 더 자주 가보라고 했던 건 나니까……!\""
1014203-34 = "[ns] \"그러니까 지금부터 이렇게 하자!\""
1014203-35 = "응? 어떻게?"
1014203-37 = "[log]나랑 같이 바다에 가는 거야![/log]"
1014203-40 = "……."
1014203-41 = "설녀가 혼자 돌아다닌다는 소문이 돌고 있으니까……."
1014203-42 = "선생님이 계속 곁에서 즐겁게 어울려 준다면, 해변의 설녀 소문은 자연스레 사라질 거라고?"
1014203-43 = "……."
1014203-44 = "그걸 구실로 나랑 바다에 놀러 갈 심산인 거네."
1014203-45 = "역시 선생님은 엉큼한 점이 있어."
1014203-46 = "하지만…… 재미있을 것 같아."
1014203-47 = "알았어. 부탁할게. 같이 바다에 가자."
1014203-48 = "[s] \"얏호……!\""
1014203-50 = "(그리하여 나구사와 함께 찾아간 바다…….)"
1014203-58 = "(많은 아이가 즐거운 시간을 보내고 있었다.)"
1014203-63 = "오늘은 평소보다 사람이 많네."
1014203-65 = "아! 나구사 님이다!"
1014203-66 = "나구사 님! 나구사 님도 설녀를 구경하러 오신 건가요?"
1014203-68 = "……응?"
1014203-69 = "[s] \"사람이 많은 이유가…… 그거 때문이었나?\""
1014203-70 = "……."
1014203-71 = "아마도, 소문의 설녀는 나였을 거야."
1014203-73 = "네에에에?!"
1014203-75 = "눈에 띄지 않으려고 단독 활동을 하는 바람에 오해가 생긴 모양이네."
1014203-77 = "저, 저희는 그런 줄도 모르고……!"
1014203-79 = "아니야, 신경 쓰지 마."
1014203-86 = "그럼…… 같이 바다를 즐기자, 선생님."
1014203-87 = "사람들의 오해가 풀리도록, 날 도와주는 거야."
1014203-88 = "[s] \"물론이지!\""
1014203-110 = "(정말로 즐거운 시간이 이어졌다…….)"
1014203-117 = "벌써…… 시간이 이렇게 됐네."
1014203-118 = "덕분에 정말 즐거웠어."
1014203-119 = "바다를 찾아온 본래의 목적을 잊어버릴 정도로."
1014203-120 = "난 분명 오해를 풀고 싶어서 왔는데, 노는 것에 정신이 팔려서……."
1014203-121 = "[ns] \"이유 같은 건 상관없어.\""
1014203-123 = "[ns] \"함께 있는 시간이 즐거웠다면, 그걸로 충분해.\""
1014203-125 = "……."
1014203-126 = "……응. 그렇네."
1014203-127 = "그럼, 또 부탁해도 될까?"
1014203-128 = "[s] \"물론이지.\""
1014203-129 = "고마워, 선생님."
1014203-134 = "이제…… 슬슬 돌아가자. 밤이 너무 깊었어."
1014203-136 = "(이후 나구사를 백화요란 분쟁조정위원회실까지 바래다주었다.)"
1014203-137 = "(다음에 또 바다에 갈 날이 기다려진다…….)"
