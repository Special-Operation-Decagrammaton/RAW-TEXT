[translation]
1014203-1 = "หญิงหิมะริมหาด"
1014203-2 = "(ไม่กี่วันหลังจากนั้น ณ ถนนเส้นหนึ่งในเฮียกคิยาโค...)"
1014203-4 = ""
1014203-5 = "นี่ ได้ยินข่าวลือนั้นหรือยัง?"
1014203-6 = "ข่าวลือ? ข่าวลืออะไรเหรอ?"
1014203-7 = "ที่บอกว่ามีสาวหิมะมาปรากฏตัวที่ชายหาดไง!"
1014203-8 = "เอ๋? สาวหิมะงั้นเหรอ?"
1014203-10 = "(และในสถานที่อื่น...)"
1014203-11 = ""
1014203-12 = "อะไรกัน สาวหิมะบนชายหาดงั้นเหรอ? ตัวเธอน่าจะละลายไปกับแสงแดดร้อนๆ นะ?"
1014203-13 = "หืม? นั่นสินะ? เอาเป็นว่ามีข่าวลือแบบนั้นก็แล้วกัน"
1014203-14 = "มีสาวหิมะมาปรากฏตัวเพียงลำพังอยู่ในชายหาดน่ะสิ!"
1014203-15 = ""
1014203-16 = "[ns1] (มีข่าวลือแปลกๆ ไปทั่วเลย...)\n[ns2] (หรือว่า...)"
1014203-20 = "(คุณครูรีบมุ่งหน้าไปที่คณะไกล่เกลี่ยข้อพิพาท เฮียกกะเรียวรัน)"
1014203-21 = ""
1014203-22 = "หืม? คุณครู? มีเรื่องอะไรขึ้นมาเหรอ?"
1014203-24 = "(คุณครูเล่าเกี่ยวกับข่าวลือที่แพร่สะพัดให้นางุสะฟัง)"
1014203-25 = ""
1014203-26 = "..."
1014203-27 = "เรื่องนั้น... น่าจะเป็นเรื่องของฉันน่ะ"
1014203-28 = "ก็ชายหาดที่ฉันไปมา คือชายหาดโทริอิน่ะสิ"
1014203-29 = "อุตส่าห์แอบไปว่ายน้ำคนเดียวเพราะไม่อยากให้ใครสังเกตเห็นแท้ๆ... ไม่คิดเลยว่าผลลัพธ์จะออกมากันตรงข้าม"
1014203-30 = "สรุปว่าไม่ว่าฉันจะทำอะไร ก็ดึงดูดความสนใจของผู้คนที่พบเห็นไปหมดสินะ..."
1014203-31 = "[ns3] \"นะ... นี่เป็นความผิดของครูต่างหาก...!\"\n[ns4] \"ครูผิดเองที่บอกให้นางุสะไปทะเลบ่อยๆ...!\""
1014203-34 = "[ns] \"งั้นจากนี้ไป เราทำอย่างนี้แล้วกัน!\""
1014203-35 = "หืม? ยังไงเหรอ?"
1014203-37 = "[log]ไปทะเลด้วยกันกับครูไง![/log]"
1014203-39 = ""
1014203-40 = "..."
1014203-41 = "ตอนนี้กำลังมีข่าวลือว่าสาวหิมะมาปรากฏตัวเพียงลำพัง..."
1014203-42 = "หมายความว่าถ้าไปทะเลกับคุณครูละก็ ข่าวลือเรื่องสาวหิมะบนชายหาดก็จะค่อยๆ ซาไปเองงั้นเหรอ?"
1014203-43 = "..."
1014203-44 = "วางแผนใช้เรื่องนั้นเป็นข้ออ้างเพื่อไปเที่ยวทะเลกับฉันสินะ"
1014203-45 = "คุณครูนี่นะ ยังไม่ทิ้งนิสัยเจ้าเล่ห์เลยจริงๆ"
1014203-46 = "แต่ว่า... แบบนั้นก็น่าสนุกดีนะ"
1014203-47 = "ก็ได้ งั้นก็ฝากด้วยนะ ไว้เราไปทะเลด้วยกันเถอะ"
1014203-48 = "[s] \"ยะฮู้ว...!\""
1014203-50 = "(แล้วคุณครูกับนางุสะก็ได้ไปทะเลด้วยกัน...)"
1014203-53 = ""
1014203-54 = ""
1014203-55 = ""
1014203-57 = ""
1014203-58 = "(เด็กๆ หลายคนกำลังสนุกสนาน)"
1014203-59 = ""
1014203-62 = ""
1014203-63 = "วันนี้คนเยอะกว่าทุกวันอีกนะ"
1014203-65 = "อ๊ะ! คุณนางุสะนี่นา!"
1014203-66 = "คุณนางุสะ! คุณนางุสะก็มาดูสาวหิมะกับเขาด้วยเหรอคะ?"
1014203-68 = "หืม...?"
1014203-69 = "[s] \"เพราะแบบนี้สินะ... คนก็เลยเยอะเป็นพิเศษ\""
1014203-70 = "..."
1014203-71 = "สาวหิมะในข่าวลืออาจจะเป็นฉันก็ได้นะ"
1014203-73 = "คะ?!"
1014203-75 = "ฉันพยายามแยกตัวไปทำอะไรคนเดียวเพราะไม่อยากให้ใครสังเกตเห็น แต่สงสัยจะทำให้เกิดเรื่องเข้าใจผิดขึ้นมาน่ะ"
1014203-77 = "พะ... พวกฉันไม่รู้เลยค่ะว่าเป็นแบบนั้น...!"
1014203-79 = "ไม่เป็นไร ไม่ต้องสนใจหรอก"
