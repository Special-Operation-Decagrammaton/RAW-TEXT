[translation]
1014203-1 = "海邊的雪女"
1014203-2 = "（幾天後，因公務造訪了百鬼夜行……）"
1014203-4 = ""
1014203-5 = "喂，你聽說那個傳聞了嗎？"
1014203-6 = "傳聞？什麼傳聞？"
1014203-7 = "就是鳥居海岸出現雪女的傳聞啊！"
1014203-8 = "咦～？雪女？"
1014203-10 = "（在別的地方也……）"
1014203-11 = ""
1014203-12 = "不是，海邊怎麼會有雪女啊。#n不會被陽光曬到融化嗎？"
1014203-13 = "嗯？是嗎？總之就是有那樣的傳聞。"
1014203-14 = "說雪女獨自一人在海邊徘徊！"
1014203-15 = ""
1014203-16 = "[ns1] （流傳著奇怪的傳聞……）\n[ns2] （難道說……）"
1014203-20 = "（急忙前往了百花繚亂紛爭調停委員會）"
1014203-21 = ""
1014203-22 = "嗯？老師？這麼突然有什麼事嗎？"
1014203-24 = "（向名草說了街上流傳的傳聞）"
1014203-25 = ""
1014203-26 = "……"
1014203-27 = "看來那個傳聞……說的應該就是我沒錯。"
1014203-28 = "因為我去的海邊正是鳥居海岸。"
1014203-29 = "我為了盡量不引人注目所以一個人去游泳，沒想到反而弄巧成拙了。"
1014203-30 = "……果然無論我怎麼做，似乎都會吸引眾人的目光呢。"
1014203-31 = "[ns3] 「是，是我不好……！」\n[ns4] 「畢竟叫你多去海邊看看的是我……！」"
1014203-34 = "[ns] 「接下來就這麼辦吧！」"
1014203-35 = "嗯？怎麼辦？"
1014203-37 = "[log]跟我一起去海邊！[/log]"
1014203-39 = ""
1014203-40 = "……"
1014203-41 = "因為現在流傳著雪女獨自徘徊的傳聞……"
1014203-42 = "所以只要老師一直待在我身邊，雪女的傳聞就會自然消失？"
1014203-43 = "……"
1014203-44 = "你是打算拿這件事當藉口，跟我去海邊玩對吧？"
1014203-45 = "老師果然別有心思呢。"
1014203-46 = "不過……感覺會很有趣。"
1014203-47 = "好吧，那就拜託你了。#n一起去海邊吧。"
1014203-48 = "[s] 「呀呼……！」"
1014203-50 = "（於是和名草一起前往了海邊……）"
1014203-53 = ""
1014203-54 = ""
1014203-55 = ""
1014203-57 = ""
1014203-58 = "（那裡有許多學生正享受著愉快的時光）"
1014203-59 = ""
1014203-62 = ""
1014203-63 = "今天的人比平常還多呢。"
1014203-65 = "啊！是名草大人！"
1014203-66 = "名草大人！名草大人也是來看雪女的嗎？"
1014203-68 = "……嗯？"
1014203-69 = "[s] 「人這麼多的原因……是因為那個嗎？」"
1014203-70 = "……"
1014203-71 = "傳聞中的雪女，大概就是我吧。"
1014203-73 = "咦～～！？"
1014203-75 = "似乎是我為了不引人注目而單獨行動，結果反而造成了誤會。"
1014203-77 = "我，我們竟然完全不知情……！"
1014203-79 = "沒關係，你們不用在意。"
1014203-80 = ""
1014203-83 = ""
1014203-85 = ""
1014203-86 = "那麼……一起享受大海吧，老師。"
1014203-87 = "為了解開眾人的誤會，你得陪著我才行。"
1014203-88 = "[s] 「那當然！」"
1014203-89 = ""
1014203-91 = ""
1014203-92 = ""
1014203-93 = ""
1014203-95 = ""
1014203-96 = ""
1014203-97 = ""
1014203-98 = ""
1014203-99 = ""
1014203-101 = ""
1014203-102 = ""
1014203-103 = ""
1014203-106 = ""
1014203-107 = ""
1014203-108 = ""
1014203-110 = "（愉快的時光持續著……）"
1014203-115 = ""
1014203-117 = "已經……天黑了呢。"
1014203-118 = "多虧了老師，我真的很開心。"
1014203-119 = "開心到都快忘記來海邊的目的了。"
1014203-120 = "我明明是為了解開誤會才來的，結果卻只顧著玩……"
1014203-121 = "[ns] 「理由什麼的都無所謂。」"
1014203-123 = "[ns] 「只要待在一起的時光是快樂的，那就足夠了。」"
1014203-125 = "……"
1014203-126 = "……嗯。說的也是。"
1014203-127 = "那我下次還可以拜託你嗎？"
1014203-128 = "[s] 「當然囉。」"
1014203-129 = "謝謝你，老師。"
1014203-130 = ""
1014203-132 = ""
1014203-133 = ""
1014203-134 = "差不多……該回去了。#n時間已經很晚了。"
1014203-136 = "（之後將名草送回了百花繚亂紛爭調停委員會）"
1014203-137 = "（真期待下次去海邊的日子……）"
