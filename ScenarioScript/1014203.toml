1014203-136 = "(หลังจากนั้นคุณครูก็มาส่งนางุสะถึงคณะไกล่เกลี่ยข้อพิพาท เฮียกกะเรียวรัน)"
1014203-137 = "(และรอคอยวันที่จะได้ไปทะเลกับนางุสะอีกครั้ง...)"
