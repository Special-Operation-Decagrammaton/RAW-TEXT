[translation]
1014203-1 = "Snow Maiden of the Sands"
1014203-2 = "A few days later, I visited the streets of Hyakkiyako for work."
1014203-4 = ""
1014203-5 = "Hey, have you heard the rumors?"
1014203-6 = "Rumor? What rumor?"
1014203-7 = "Apparently a snow maiden has been appearing on the Torii beach!"
1014203-8 = "Eh? A snow maiden?"
1014203-10 = "Somewhere else..."
1014203-11 = ""
1014203-12 = "A snow maiden at a beach? Are you sure she didn't melt away under this sun?"
1014203-13 = "Hmm, maybe? Anyways, that's what I heard."
1014203-14 = "That a snow maiden is wandering around the beach alone!"
1014203-15 = ""
1014203-16 = "[ns1] \"(That's a strange rumor...)\"\n[ns2] \"(Wait, don't tell me...)\""
1014203-20 = "I hurried to the Hyakkaryouran Resolution Council."
1014203-21 = ""
1014203-22 = "Hmm? Sensei, has something happened?"
1014203-24 = "I told Nagusa about the rumors I'd been hearing everywhere."
1014203-25 = ""
1014203-26 = "..."
1014203-27 = "That does...rather sound like me."
1014203-28 = "I did visit the Torii beach."
1014203-29 = "I was swimming alone to avoid standing out, but it would appear that backfired."
1014203-30 = "...No matter the endeavors I undertake, I am simply too dazzling."
1014203-31 = "[ns3] \"Th-This is my fault...!\"\n[ns4] \"I told you to visit the beach more often...!\""
1014203-34 = "[ns] \"Okay, then let's do this!\""
