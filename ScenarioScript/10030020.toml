[translation]
10030020-1 = "제2화;텐트 설치"
10030020-6 = "자, 도착. 이곳이 밀레니엄 동쪽에 위치한 히가시알프스야."
10030020-7 = "우리는 이곳, 히가시다케 산밑에서 텐트를 치고 하룻밤 야영을 한 다음, 내일 새벽에 새해 첫 일출을 보러 산을 오를 거야."
10030020-8 = "그전까지 특별한 일정은 없으니, 다들 이 근처에서 하고 싶은 걸 하면서 느긋하게 하루를 보내면 돼."
10030020-9 = "[s1] \"밀레니엄 학원 근처에서 이렇게 아름다운 자연경관을 보게 되다니……\"\n[s2] \"밀레니엄 자치구는 도시화된 지역이라는 인식이 있었는데, 의외의 풍경이네.\""
10030020-12 = "밀레니엄 학원의 도심은 첨단 기술로 지어진 건물이 가득하지만, 모든 지역이 그런 것만은 아니야."
10030020-13 = "밀레니엄 자치구에는 <폐허>처럼 손이 닿지 않은 미개발 지구도 잔뜩 남아 있거든."
10030020-14 = "평소에는 주목받는 일이 거의 없지만…… 캠핑이나 트래킹을 하기에는 이만큼 적합한 장소도 따로 없지."
10030020-18 = "……나무 사이로 부는 차가운 솔바람이 기분 좋네."
10030020-19 = "다들 기분은 어때? 모처럼 도시에서 벗어나 신선한 공기를 마시니 몸도 마음도 상쾌하—"
10030020-28 = "……지는 않은 것 같네."
10030020-29 = "예상은 했지만 정말로 전파가 아예 잡히지 않을 줄이야……"
10030020-30 = "심지어 가장 가까운 편의점이 30km 밖에 있다니…… 에너지 드링크는 어디서 구하지 ……"
10030020-31 = "이동하는 것만으로도 벌써 절반의 체력을 소모한 기분입니다……"
10030020-32 = "벌써부터 우는 소리를 내면 어떻게 해. 캠핑은 시작하지도 않았다고."
10030020-33 = "마키, 차 트렁크에서 빨간색 파우치부터 꺼내 줄래?"
10030020-38 = "빨간색 파우치라면…… 이건가?"
10030020-44 = "윽, 무거워…… 이게 다 뭐야? 쇠 파이프?"
10030020-45 = "텐트용 폴대야. 야영을 하기로 했으니 텐트부터 쳐야지."
10030020-46 = "그리고 그 뒤에 있는 파우치도 전부 꺼내 줘. 거기에 있는 짐은 모두 텐트 치는 데 사용하는 도구니까."
10030020-47 = "이 무거운 게 전부 텐트 부품이라고?!"
10030020-48 = "오자마자 야영 준비를 하는 데 또 체력을 써야 한다니……"
10030020-49 = "안락하고 튼튼한 부실이 있는데, 굳이 야외에서 텐트를 치고 자려 한다니…… 비합리적인 발상입니다."
10030020-50 = "뭐, 너희들이 원한다면 텐트 없이 노숙을 해도 괜찮아."
10030020-51 = "하지만 이 시기에 난방 기구 없이 밖에서 밤을 나려면 몹시 추울 텐데…… 괜찮겠어?"
10030020-57 = "으윽……"
10030020-58 = "부부장이 그렇게 말한다면 하는 수 없지만……"
10030020-59 = "저기…… 선배, 더 간단한 방법은 없는 거야?"
10030020-60 = "인터넷에서 보니까 펼치기만 해도 자동으로 설치되는 텐트 같은 것도 있던데……"
10030020-62 = "팝업 텐트 말이구나. 물론 팝업 텐트는 설치가 간편해서 초보자들이 선호하긴 하지만……"
10030020-63 = "구조 특성상 폴대와 텐트가 합쳐져 있기 때문에 접어도 부피가 커서 수납이 어렵고, 천장이 낮아서 여러 사람이 쓰는 대형 텐트에는 적합하지 않아."
10030020-68 = "게다가 원단이 얇고 비바람과 추위에 약하기 때문에, 지금과 같은 겨울 시즌에 사용하기는 조금 여러모로 어렵지."
10030020-69 = "이를 보강하기 위해 타프와 쉘터 등을 추가하다 보면 결국 평범한 텐트를 쓰는 편이 품이 더 적게 들 거야."
10030020-70 = "[s3] \"뭔가…… 치히로는 캠핑에 익숙해 보이네.\"\n[s4] \"평소에도 자주 캠핑을 다니는 편이야?\""
10030020-73 = "글쎄. 일부러 캠핑장을 찾아다녔던 건 아니지만……"
10030020-74 = "보안 업무의 특성상 밤샘 작업을 하는 일이 잦아서 말이야. 밤샘 작업 때 쓸 침낭을 알아보다 보니 캠핑 장비에도 조금씩 흥미가 생겨서……"
10030020-75 = "일이 바쁘지 않을 때는 조용한 교외에서 텐트를 펼쳐 놓고 가끔씩 해바라기를 하곤 했었어."
10030020-77 = "야외에서 해바라기라니, 뭔가……"
10030020-78 = "할머니 같은 취미……"
10030020-85 = "……라고 할 뻔했네! 하, 하하……"
10030020-87 = "여하튼 날이 저물기 전에 서둘러 텐트를 치고 싶으니까, 모두 이쪽으로 모여 봐."
10030020-88 = "모두 힘내서 도와주면 금방 끝날 테니까. 너무 싫은 표정 짓지 말라고."
10030020-89 = "알겠어, 알겠어……"
10030020-93 = "선배, 이거 앞면이 이쪽 맞아?"
10030020-94 = "응. 그라운드시트는 은박이 바닥을 향하도록 아래에 설치해 줘. 그렇게 해야 습기를 방지할 수 있거든."
10030020-95 = "하지만 아무리 봐도 이쪽이 더 예쁜 것 같은데……"
10030020-96 = "미관을 위해서 설치하는 시트가 아니거든……?"
10030020-100 = "부, 부부장…… 이 폴대, 부러지는 거 아냐? 지, 진짜 더 구부려도 돼……?"
10030020-101 = "괜찮아. 그 정도의 변형에는 견딜 수 있게 설게 되었으니까, 좀 더 힘껏 잡아당겨."
10030020-102 = "하지만 더 구부리려고 해도…… 힘이 안 들어가……"
10030020-107 = "우, 우앗…… 바람에 매트가 날아갑니다!"
10030020-108 = "자, 잠깐……! 지금 고정해 둔 팩이 뽑히면 더 위험하니까……"
10030020-112 = "이쪽은 내가 붙잡고 있을 테니까, 빨리 뛰어가서 잡아와!"
10030020-124 = "자, 이제 마지막으로 타프에 고정된 줄을 정리하면……"
10030020-129 = "설치는 이것으로 끝이야. 다들 수고 많았어."
10030020-134 = "지쳤어……"
10030020-135 = "텐트를 치느라 그나마 남아 있던 체력도 모두 소모하고 말았습니다……"
10030020-137 = "이제 저녁 시간까지 힘쓸 일은 없으니까, 다들 자유롭게 쉬도록 해."
10030020-138 = "자유롭게 쉬라고 해도……"
10030020-139 = "인터넷도 전자기기도 없는데 어떻게 쉬란 말이야?"
10030020-140 = "여기서는 게임도 못하고, 웹 서핑도 못하고, 푹신한 소파도 없는데……"
10030020-141 = "……너희들은 소파에 누워서 게임하는 것 이외에는 쉬는 방법을 모르는 거야?"
10030020-142 = "이참에 전자기기 없이 휴식하는 법을 좀 익히도록 해."
10030020-143 = "마음을 가라앉히고 거대한 자연 속에서 산책을 하다 보면, 어느새 시간이 훌쩍 흘러간 걸 깨닫게 될 거야."
10030020-149 = "치이…… 순 억지야."
10030020-150 = "어딘가 전파가 잡히는 곳은 없으려나?"
10030020-151 = "높은 곳이라면 핸드폰의 신호가 잡힐지도 모릅니다. 근처를 한 번 둘러보죠."
10030020-156 = "서, 선배. 우리는 잠깐 산책 좀 하고 올게!"
10030020-158 = "그래, 너무 멀리 가지는 말고."
10030020-167 = "야영 준비는 이만하면 거의 끝난 것 같고…… 선생님은 이제 뭘 할 거야?"
10030020-168 = "[s5] \"나는 밀린 업무를 처리하려고.\"\n[s6] \"혹시 몰라서 보고서 일부를 종이로 뽑아왔거든!\""
10030020-171 = "안 돼. 오늘은 선생님도 평소에 하던 업무는 금지야."
10030020-172 = "[s] \"……어째서?\""
10030020-173 = "아까도 말했잖아? 이번 캠핑은 평소의 생활 습관에서 벗어나 여유로운 휴식을 즐기는 데 목적이 있다고."
10030020-174 = "한 해의 마지막 날이니까. 선생님도 오늘만큼은 일은 잊고 정신적으로도 휴식을 취하도록 해."
10030020-181 = "혹시 그냥 시간을 보내는 게 무료하다면 내가 가져온 책을 빌려줄게."
10030020-182 = "[s7] \"……<총, 귀여움, 청춘>?\"\n[s8] \"서가에 늘 꽂혀만 있던 인문학 서적이네……\""
10030020-185 = "원래 이런 책은 일부러 시간을 내서 읽으려 하면 좀처럼 집중하기 어렵잖아?"
10030020-186 = "하지만 특별히 다른 할 일이 없는 캠핑장에서라면 이런 딱딱한 책도 재미있게 읽을 수 있지."
10030020-194 = "그럼 나는 옆에서 책을 읽고 있을 테니까, 무슨 일이 있으면 불러줘."
10030020-196 = "(이후, 한동안 그늘 아래에 앉아서 치히로와 함께 느긋이 독서를 즐겼다.)"
