[translation]
2006406-1 = "秘密の花園"
2006406-2 = "（ウララから預かっていた物を返すためにワイルドハントを訪れた）"
2006406-6 = "検問です。ご協力願います。"
2006406-12 = "あれ？これは……禁止されていた演劇のものですね。"
2006406-15 = "まあ今回リストから除外されたので問題ないでしょう。通行を許可します。"
2006406-19 = "（ウララの言葉通り、問題なく入ることができた）"
2006406-20 = "（それからすぐに待ち合わせ場所に向かった）"
2006406-24 = "先生。ごきげんよう。"
2006406-25 = "これまで預かってくださり、本当にありがとうございます。"
2006406-30 = "ああ、この日をどれほど待ち焦がれたことか……。#nいま再び、私の手に……これでやっと安心できます。"
2006406-31 = "[s] \"結局、何があったの？\""
2006406-32 = "ふふ……。"
2006406-33 = "わたくしは、か弱く振り回されるだけではございません。#nマナミ様に真っ向勝負を挑んだのです。"
2006406-36 = "[ns] \"ウララが！？\""
2006406-37 = "自分でも驚いています。"
2006406-38 = "ですがこのまま好きな演劇を見られなくなると思うと、とても悲しくて――"
2006406-39 = "マナミ様を説き伏せるべく立ち上がりました。"
2006406-40 = "あの方が憎悪している「怪盗」と、演劇の主人公は違う人物だと。"
2006406-41 = "しかしそれでも納得していただけず、一緒に劇を見ながら説得を続けました。"
2006406-42 = "長く険しい道のりでしたが、諦めることなく食い下がり……#nついに、勝利を勝ち取ったのです。"
2006406-43 = "わたくしがこれほど強く反対することもめったにありませんので。#nきっと最後は、わたくしを大事にする思いから許可してくださったのだと思います。"
2006406-44 = "だからといって、元をただせばこの件は問題ですらないはずでしたのに。#nだって別人であることは事実なのですから。"
2006406-45 = "演劇の主人公は正義感で動きますが、「怪盗」は個人の芸術観で動きます。"
2006406-46 = "ゆえに「正義」と相反し、七囚人になってしまったのでしょう……。"
2006406-47 = "[s] \"ウララは「怪盗」について詳しそうだね。\""
2006406-48 = "ふふ……マナミ様にとって最大の敵ですから。"
2006406-49 = "相手を知らねば備えることはできません。副会長として、入念に調べたのです。"
2006406-50 = "……ええ、どんな些細なことまでも。"
2006406-51 = "あっ……このような話をするつもりでは。#nこほん。話を戻しましょう。"
2006406-52 = "今回の一件、先生にはどれほど感謝をしてもし足りません。#nどうお返ししていけば良いのか分からないほどに。"
2006406-53 = "わたくしのこの思いを表現できるのは――"
2006406-56 = "……。"
2006406-57 = "どうやら[ruby=・]ア[/ruby][ruby=・]レ[/ruby]しかないようですね。"
2006406-58 = "マナミ様の時のように……勇気を出してもよろしいでしょうか？"
2006406-59 = "[s] \"というと……？\""
2006406-60 = "先生をご招待しようと思うのです。"
2006406-61 = "これまで外部の立ち入りを禁じていた――"
2006406-62 = "――わたくしのバラ園に。"
2006406-63 = "[s] \"……！！\""
2006406-65 = "（こうして、ウララの案内でバラ園に行くことになった）"
2006406-68 = "[ns] \"ここが……。\""
2006406-69 = "ええ。"
2006406-70 = "わたくしが丹精込めて管理している秘密の花園。"
2006406-71 = "外部の方をお連れしたのは……先生が初めてです。"
2006406-72 = "[s1] \"光栄だよ。\"\n[s2] \"今はここを二人占めなんだね。\""
2006406-75 = "そ、そうなりますかね……？"
2006406-76 = "こちらにお掛けください。お茶をお持ちします。"
2006406-84 = "（近くの椅子に座った）"
2006406-87 = "（日の光を反射して輝く噴水に、ふわりと広がる花の香り。草木が奏でる音色……）"
2006406-88 = "[ns3] （じっとしているだけでも癒される場所だ）\n[ns4] \"やっぱり突然変異の植物はないか……。\"\n[ns5] \"秘密結社のアジトや異世界への入口もない。\""
2006406-92 = "（ウララが来るまで、バラ園を眺めて過ごした）"
2006406-98 = "先生？何か考え事ですか？"
2006406-99 = "[s] \"……ウララは大変そうだなって。\""
2006406-100 = "ふふ……中間管理職的な立場はどうにも……。"
2006406-101 = "ですがここで演劇の台本を読みながらお茶を飲んでいると……#n憂鬱な曇り空の気分も晴れていくように感じるのです。"
2006406-102 = "ああ、折しも、ここに。"
2006406-103 = "先生に守っていただいた、わたくしが最も愛する演劇の台本。"
2006406-104 = "……。"
2006406-105 = "では……一緒に楽しみましょうか。"
2006406-106 = "秘密の花園での、二人占めのティータイムを。"
2006406-109 = "[wa:950]― [log=우라라]不思議なものですね。[/log]"
2006406-111 = "― [log=우라라]外部の立ち入りを禁じている花園で――[/log]"
2006406-114 = "― [log=우라라]つい先日まで禁じられていた、[/log]"
2006406-116 = "― [log=우라라]演劇の台本を[wa:1790]こうして眺めているだなんて。[/log]"
2006406-119 = "[wa:550]― [log=우라라]校則に違反しているわけではありません。 [/log]"
2006406-121 = "― [log=우라라]ですが、[wa:1200]なんだか……[/log]"
2006406-124 = "― [log=우라라]悪いことをしているような[wa:1140]気持ちになります。[/log]"
2006406-127 = "― [log=우라라]この胸の高鳴りは……[wa:2820]背徳感、[wa:1640]なのでしょうか？[/log]"
2006406-130 = "[wa:320]― [log=우라라]ふふ……[wa:720]わたくし――[/log] "
2006406-132 = "― [log=우라라]悪い子になってしまったのかもしれません。[/log] "
2006406-135 = "[wa:500]― [log=우라라]……[wa:1050]ええ。[wa:1270]元より、[wa:1390]わたくしは良い子ではありません。[/log]"
2006406-138 = "― [log=우라라]美しいバラには[wa:970]棘があるように……。[/log]"
2006406-140 = "― [log=우라라]わたくしだって、[wa:1400]棘を持っているのです。[/log]"
2006406-143 = "[wa:880]― [log=우라라]ええと……[wa:904]今聞いたことは――[/log]"
2006406-146 = "― [log=우라라]わたくしと[wa:650]先生だけの[wa:770]秘密……[wa:1230]ですよ？[/log]"
2006406-149 = "[wa:480]― [log=우라라]秘密の花園で[wa:980]交わした言葉、[wa:1570]ですからね？[/log]"
2006406-153 = "ところで、お出ししたお茶は気に入っていただけましたか？"
2006406-154 = "[s] \"うん！本当に良い香りだね。\""
2006406-155 = "喜んでいただけたなら何よりです。"
2006406-156 = "ここで栽培したバラの花で作ったお茶なのですよ。"
2006406-157 = "見ても良し、香りも良し、飲んでも良し……バラには、たくさんの姿があります。"
2006406-158 = "いくつもの色や花言葉を持つバラが、様々な姿で日常に溶け込んでいる。"
2006406-159 = "しかし形は違えど、それらは全て「バラ」と呼ばれます。"
2006406-160 = "わたくしは「芸術」もそうであると思っているのです。"
2006406-161 = "数多くのジャンルがあって、多様な気持ちが込められているのに――"
2006406-162 = "全て「芸術」という名で包み込むことができる。"
2006406-163 = "このような多様性こそ、わたくしたちが守るべき芸術の価値だと考えています。"
2006406-164 = "[s] \"素敵な考えだね。\""
2006406-165 = "ふふ……ありがとうございます。"
2006406-166 = "ではもう一杯、いかがですか？"
2006406-169 = "（そうしてウララと穏やかなティータイムを過ごした）"
2006406-170 = "（次もまたここに来て休みたいな、と思った）"
