[translation]
2006406-1 = "비밀의 화원"
2006406-2 = "(우라라가 맡긴 연극 관련 물품을 돌려주기 위해 와일드헌트를 찾았다.)"
2006406-6 = "그럼 잠시 검문이 있겠습니다. 협조해 주세요."
2006406-12 = "어라? 이건……. 금지됐던 연극 관련 물건들 같은데."
2006406-15 = "뭐, 이제 괜찮다고 하니까 문제없겠죠. 통과하셔도 좋습니다."
2006406-19 = "(역시 아무런 문제 없이 통과할 수 있었다!)"
2006406-20 = "(이후 곧바로 약속 장소를 찾아갔다.)"
2006406-24 = "아, 선생님. 오셨군요."
2006406-25 = "그동안 제 소중한 물건들을 보관해 주셔서 정말 감사했습니다."
2006406-30 = "아아, 이날을 얼마나 간절히 기다렸는지. #n다시 이 아이들을 보니…… 이제 안심이 되네요."
2006406-31 = "[s] \"대체 어떤 일이 있었던 거야?\""
2006406-32 = "후후……."
2006406-33 = "마나미 님께 정면 승부를 걸었습니다. #n저는 약하지만, 항상 휘둘리진 않거든요."
2006406-36 = "[ns] \"우라라가?!\""
2006406-37 = "저도 어디서 그런 용기가 났는지 모르겠어요."
2006406-38 = "하지만 이대로 제가 좋아하는 연극을 볼 수 없다고 생각하니 너무 슬퍼져서……."
2006406-39 = "그래서 마나미 님께 직접 건의드렸어요."
2006406-40 = "그분이 증오하는 <괴도>와, 연극의 주인공은 다른 인물이라고요."
2006406-41 = "하지만 여전히 납득 못 하셔서, 제가 함께 연극을 보면서 설득했답니다."
2006406-42 = "길고 험난했지만 포기하지 않았고…… 결국엔 인정받았어요."
2006406-43 = "아마 제가 이렇게 반대하고 나서는 경우가 드물다 보니…… #n저를 아끼는 마음에 허가해 주신 것 같아요."
2006406-44 = "실제로 연극의 주인공과 괴도는 다른 인물이기도 하고요."
2006406-45 = "연극의 주인공은 정의감으로 움직이지만, 괴도는 개인의 예술관을 기초로 움직이거든요."
2006406-46 = "때문에 일반적인 정의에 부합하지 않는 일을 가끔 해버려서 일곱 죄수가 되어버린 걸지도……."
2006406-47 = "[s] \"우라라는 괴도에 대해 잘 알고 있는 것 같네.\""
2006406-48 = "후후…… 마나미 님의 가장 큰 적이니까요."
2006406-49 = "뭐든 잘 알고 있어야 대비도 잘할 수 있는 거라…… #n부회장으로서 꽤 열심히 조사했답니다."
2006406-50 = "……네. 상당히 사소한 부분들까지도요."
2006406-51 = "아…… 이런 이야기를 하려고 했던 게 아닌데."
2006406-52 = "아무튼 정말 감사했습니다. 이 은혜를 어떻게 갚아야 할지 모르겠네요."
2006406-53 = "평범한 선물로는 이 마음을 표현 못 할 것 같은데……."
2006406-56 = "……."
2006406-57 = "……아무래도 이 방법밖에 없어 보여요."
2006406-58 = "선생님. 마나미 님 때처럼…… 용기를 내봐도 될까요?"
2006406-59 = "[s] \"어떤……?\""
2006406-60 = "선생님을 초대해 보려고 해요."
2006406-61 = "지금까지 외부인의 출입을 금지하고 있던……."
2006406-62 = "……저의 장미 화원에."
2006406-63 = "[s] \"……!!\""
2006406-65 = "(그렇게 우라라의 안내로 장미 화원에 가게 되었다.)"
2006406-68 = "[ns] \"오…… 여기가 바로?\""
2006406-69 = "네. 바로 이곳이랍니다."
2006406-70 = "제가 정성 들여 관리하고 있는 비밀의 화원."
2006406-71 = "외부인이 이곳에 들어온 건…… 저…… 선생님이 처음이에요."
2006406-72 = "[s1] \"왠지 영광이네!\"\n[s2] \"지금은 둘만의 화원인 건가!\""
2006406-75 = "그, 그렇게 되는 건가요……?"
2006406-76 = "이, 일단 저쪽 테이블에 앉아 계세요. 차를 내어 올게요!"
2006406-84 = "(우라라의 말대로 근처의 테이블에 앉았다.)"
2006406-87 = "(분수와 함께 퍼지는 향기로운 꽃내음과 사방에서 들려오는 자연의 소리…….)"
2006406-88 = "[ns3] (가만히 있어도 치유가 되는 장소다.)\n[ns4] \"역시 돌연변이 식물은 없구나…….\"\n[ns5] \"비밀결사 기지와 이세계 입구도 안 보여.\""
2006406-92 = "(그렇게 멍하니 앉아 우라라가 돌아올 때까지 시간을 보냈다.)"
2006406-98 = "선생님? 무슨 생각을 그렇게 깊이 하시나요?"
2006406-99 = "[s] \"……우라라가 고생이 많다는 생각?\""
2006406-100 = "후후…… 뭐, 중간관리 업무가 많다 보니……."
2006406-101 = "하지만 여기서 좋아하는 연극의 대본을 보면서 차를 마시다 보면…… #n모든 근심이 사라지는 느낌이 들어요."
2006406-102 = "아…… 그러고 보니 마침 가지고 있네요."
2006406-103 = "선생님이 보관해 주셨던, 제가 좋아하는 연극의 대본."
2006406-104 = "……."
2006406-105 = "그럼…… 함께 즐겨 볼까요?"
2006406-106 = "비밀의 화원에서 진행하는, 둘만의 티타임을."
2006406-109 = "[wa:950]― [log=우라라]신기하네요.[/log]"
2006406-111 = "― [log=우라라]외부인의 출입을 금지하고 있던 화원에서……[/log]"
2006406-114 = "― [log=우라라]얼마 전까지 금지돼 있던 [/log]"
2006406-116 = "― [log=우라라]연극의 대본을 [wa:1710]이렇게 바라보고 있다니. [/log]"
2006406-119 = "[wa:550]― [log=우라라]교칙을 위반하는 건 아니랍니다.[wa:40] [/log]"
2006406-121 = "― [log=우라라]하지만 [wa:1200]뭔가……  [/log]"
2006406-124 = "― [log=우라라]나쁜 짓을 하는 듯한 [wa:1140]기분이 들어요. [/log]"
2006406-127 = "― [log=우라라]이 가슴의 두근거림은……[wa:2700]배덕감, [wa:1600]인 걸까요?[wa:40] [/log]"
2006406-130 = "[wa:320]― [log=우라라]후후……[wa:720] 저,[wa:80] [/log]"
2006406-132 = "― [log=우라라]나쁜 아이가 되어 버린 걸지도 모르겠네요.[/log]"
2006406-135 = "[wa:500]― [log=우라라]…… [wa:1010]네. [wa:1270]애초에, [wa:1310]저는 착한 아이가 아니에요. [/log]"
2006406-138 = "― [log=우라라]아름다운 장미에는[wa:890] 가시가 있듯이…….[/log]"
2006406-140 = "― [log=우라라]저 역시, [wa:1440]가시를 품고 있답니다.[/log]"
2006406-143 = "[wa:880]― [log=우라라]아 그게…… [wa:824]지금 들으신 건…….[/log]"
2006406-146 = "― [log=우라라]저와 [wa:690]선생님만의 [wa:730]비밀…… [wa:1190]이에요?[/log]"
2006406-149 = "[wa:480]― [log=우라라]비밀의 화원에서 [wa:860]나눈 이야기, [wa:1530]이니까요? [/log]"
2006406-153 = "그나저나 제가 준비한 차는 마음에 드시나요?"
2006406-154 = "[s] \"응! 정말 향이 좋네.\""
2006406-155 = "좋아해 주시니 다행이네요."
2006406-156 = "이 정원에서 재배한 장미꽃으로 직접 만든 차랍니다."
2006406-157 = "……장미는 수많은 모습이 있어요."
2006406-158 = "다양한 색의, 다양한 꽃말을 가진 장미들이, 다양한 방식으로 우리의 일상에 녹아 있죠."
2006406-159 = "하지만 모두 장미라고 불린답니다."
2006406-160 = "저는 예술이 이런 장미와 비슷하다고 생각해요."
2006406-161 = "수많은 장르가 있고, 그 안에도 수많은 마음이 담겼지만……."
2006406-162 = "모두 예술이라는 이름으로 하나가 될 수 있잖아요?"
2006406-163 = "저는 이런 다양성이야말로, 우리가 지켜야 할 예술의 가치라고 생각해요."
2006406-164 = "[s] \"좋은 생각이네.\""
2006406-165 = "후후…… 감사합니다."
2006406-166 = "그럼 한 잔 더, 어떠신가요?"
2006406-169 = "(그렇게 우라라와 화원에서 편안하게 티타임을 즐겼다.)"
2006406-170 = "(다음에도 또 와서 휴식을 취하고 싶구나…….)"
