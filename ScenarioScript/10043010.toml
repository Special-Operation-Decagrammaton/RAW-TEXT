[translation]
10043010-1 = "제1화;절대로 '절대'라고 말하지 않기"
10043010-6 = "저희가 브레이브스의 선수 대기실에 들어오게 되다니……."
10043010-7 = "저는 야구장 문화에 아직 자세하지 못합니다만, 보통 팀 시설에 외부인을 들이는 것은…… 흔치 않은 일이 아닌가요?"
10043010-8 = "[s] \"조용히 이곳으로 안내받기는 했는데…….\""
10043010-13 = "잘 와 주셨습니다, 샬레의 선생님."
10043010-17 = "[ns] \"누구신가요?!\""
10043010-23 = "아, 소개가 늦었군요. 저는 코기 브레이브스의 감독입니다."
10043010-28 = "어? 코기 감독님? 정말로?!"
10043010-29 = "이분이……."
10043010-31 = "학생들의 말마따나, 기본적으로 경기 중 팀 시설에 외부인을 들이는 것은 금지되어 있죠……."
10043010-32 = "하지만 이번은 너무나 다급한 사안이라, 샬레의 선생님께 도움을 받을 수밖에 없다고 생각했습니다."
10043010-36 = "저희를…… 브레이브스를, 구해 주십시오!"
10043010-41 = "도대체 무슨 일이시길래……?"
10043010-42 = "트레이닝으로 해결할 수 있는 일입니까?"
10043010-43 = "아무리 그래도 그건 아니겠죠!"
10043010-45 = "그것은–"
10043010-54 = "감독. 나다. 내 지시…… 작전을 실행할 준비는 되었는가?"
10043010-57 = "!!!"
10043010-59 = "주, 준비는 되었다. 그렇지만 도대체 원하는 게 뭐지? 역시 돈인가? 그런 거라면……."
10043010-60 = "돈 같은 것에는 관심이 없다. 중요한 건 경기지."
10043010-61 = "다시 한번 말하겠다. 그대로 실행하도록 해. 이번 수비가 끝나고 다음번 공격에서……."
10043010-62 = "반드시, 주자 진루 후 번트 작전을 실행해라. 알겠나? 무조건이다. 다른 이야기는 듣지 않겠다."
10043010-64 = "이 작전을 이행하지 않을 시, 나는 반드시 '그 예고'를 실행하고 말겠다."
10043010-65 = "으, 으음!"
10043010-66 = "그리고 발키리 경찰학교에 신고하거나 하여 경기가 중단되기라도 하면, 그 즉시 '그 예고'는 실행될 것이다."
10043010-67 = "공수 교대 타임에, 한 번 더 연락하도록 하겠다. 가능한 한 빨리 응답하는 것이 좋을 거야."
10043010-72 = "끊어졌네요……."
10043010-73 = "상당히……. 수상한 느낌의 목소리였습니다. 음성 변조를 사용하기까지 했군요."
10043010-75 = "으으으…… 도대체 뭘 원하는 것인지……!"
10043010-76 = "[s] \"'그 예고'라는 것이 뭡니까?\""
10043010-80 = "확실히, 거기에서부터 설명해 드려야 하겠군요. 그것은…… 아아, 이 얼마나 입에 담기도 무서운 협박인지……!"
10043010-82 = "협박, 인가요? 도대체 무슨…… 그보다 한 야구팀의 감독에게 협박해서, 무엇을 얻어내려고……?"
10043010-83 = "그 내용도 어딘가 이해가 가지 않는 것이었습니다만……."
10043010-85 = "그것은…… 정말로 무서운 협박이란다."
10043010-86 = "바로……"
10043010-94 = "우리 코기 브레이브스가 전속 계약 중인 개껌 공장을, 벽돌 하나 남기지 않고 폭파시켜 버리겠다고!"
10043010-95 = "입에 담기도 두려워지는 테러 예고를 해 왔지. 뭐니!"
10043010-99 = "[ns] \"……네?\""
10043010-101 = "개껌, 이요……?"
10043010-102 = "저…… 감독님? 죄송합니다만 잘 모르겠는데……."
10043010-104 = "아니다…… 이건 정말로 중요한 일이란다."
10043010-105 = "그 공장에서 만들어지는 개껌은, 굳기도 적당하고 씹는 감촉도 괜찮은 데다."
10043010-106 = "무엇보다 은근히 오래 씹을수록 배어 나오는 특유의 감칠맛이 정말로 참을 수 없을 정도지!"
10043010-107 = "선수들도 그 개껌을 씹으면 마음이 가라앉고, 경기 중의 지나친 흥분이 저절로 조절되는 효과가 있다고 입을 모아 칭찬할 정도라."
10043010-108 = "대부분의 선수가 투구나 타석에 들어서기 전에 루틴처럼 그 개껌을 씹고 있지."
10043010-109 = "그게 없다면 분명…… 우리 코기 브레이브스의 팀 타율은 지금보다 0.5할 이상 떨어질 것이 분명하고!"
10043010-110 = "팀 방어율 역시 1점 이상 치솟을 것이 분명해!"
10043010-112 = "그런…… 가요?"
10043010-113 = "(사실 그래도 잘 모르겠지만……. 으으. 팀 타율과 방어율에 영향을 끼칠 정도라면…….)"
10043010-119 = "음, 트레이너? 제가 레이 양보다 야구에 대해 잘 아는 것은 아닙니다만."
10043010-120 = "그래도 이 일은 일반적인 '스포츠 정신', 나아가 '스포츠'와는 상당히 거리가 먼 일처럼 보이는데요. 그렇지 않습니까?"
10043010-124 = "그, 그건 그래요. 이건…… 조금 놀랍네요. 선배가 트레이닝 이외의 스포츠를 언급하다니."
10043010-125 = "혹시 선배도, 야구를 계기로 보다 넓은 식견과 인식을 하게 되어, 트레이닝 일변도에서 벗어나게 된 것이–?"
10043010-126 = "건강한 정신이란 결국, 건강한 육체에 깃드는 법."
10043010-127 = "충분한 근력이 있다면, 이 문제도 해결되는 것이 아닐까요?"
10043010-128 = "잘 가는가 싶더니, 결국 또 트레이닝인가요!"
10043010-130 = "[ns] \"사정은 잘 알았습니다. 감독님.\""
10043010-134 = "그, 그렇다면…… 힘을 빌려주시는 겁니까?"
10043010-135 = "……우선, 한 명의 야구팬…… 아니, 스포츠를 사랑하는 사람으로서, 이건 조금 이상한 것 같아요."
10043010-136 = "우선 신성한 야구 경기에서, 이해할 수 없는 일을 벌이고 있다는 게 마음에 들지 않고요."
10043010-137 = "애초에 테러 예고잖아요?! 내버려두면 안 되는 거잖아요!? 그냥 당연한 거잖아요!!??"
10043010-138 = "저도 같은 의견입니다, 트레이너. 이런 폭거를 방치한다는 것은."
10043010-139 = "비단 이 야구 경기뿐만이 아니라, 키보토스 전체의 스포츠계에도 악영향을 끼치겠지요."
10043010-140 = "[s1] \"의견이 이렇게 모였으니.\"\n[s2] \"저희는 저희가 할 수 있는 일을 찾아보겠습니다.\""
10043010-146 = "가, 감사합니다…… 감사합니다!"
10043010-148 = "그렇지만, 선생님. 저희가 할 수 있는 일이 뭐가 있을까요?"
10043010-152 = "네? 우선은 각자 관중석을 돌면서 범인을 찾아보자…… 그렇군요. 단서가 부족하니, 지금은 실질적으로 움직여야 한다는 것이로군요."
10043010-153 = "네……. 시라토리 시리즈는 기본적으로 생중계까지는 하지 않는 경기들이라."
10043010-154 = "경기 결과를 실시간으로 확인하려면, 경기장 내에 범인이나 공범이 있을 수밖에 없다는 결론이 되겠네요."
10043010-155 = "하지만…… 범인은 공수 교대 타임에 연락해 올 거라고도 했는데 말이죠……?"
10043010-156 = "확실히 그렇습니다, 트레이너. 범인이 또 어떤 억지스러운 요구를 해 올지 알 수 없는 일입니다."
10043010-157 = "이 부분에 대한 대책도 필요할 것으로 보입니다."
10043010-161 = "아하……. 그 부분은, 회선을 동시에 연결해서, 그때그때 범인의 요구에 대응하자고요?"
10043010-162 = "그렇군요. 즉각적으로 협상을 해 가며, 범인의 진짜 의도를 알아낸다……."
10043010-163 = "그러면 그 부분은 트레이너와 레이 양에게 맡기도록 하겠습니다."
10043010-164 = "저는 아무래도 협상이라든지 의논이라든지 그런 쪽에는 조금 약해서요."
10043010-165 = "체력과 육체적 에너지가 필요한 일이라면 자신 있는 편입니다만."
10043010-166 = "[s3] \"그러면, 약간씩만 역할을 분담하자.\"\n[s4] \"크게 범인의 탐색과 범인과의 협상이 있다고 치고…….\""
10043010-169 = "그렇군요. 저는 협상을 위주로 담당하면서, 탐색을 부수적으로 수행하고……."
10043010-170 = "알겠습니다. 저는 레이 양보다 보다 적극적으로 관중석을 탐색하면 되는 것이로군요?"
10043010-171 = "네. 회선은 항상 열어 두겠습니다. 그러면 그 방향으로 잘 부탁드리겠습니다. 선생님."
10043010-175 = "그리고…… 스미레 양이라고 했던가?"
10043010-180 = "네. 감독님. 무슨 일이신가요?"
10043010-181 = "레이 양은 지금 그 복장으로 관중석을 돌아다녀도, 그렇게 눈에 띄지 않으리라 생각하지만……."
10043010-182 = "스미레 양은 조금, 눈에 띌 수도 있을 것 같아서 말이지."
10043010-183 = "어라, 제 복장이 그렇게 이상한가요. 트레이너?"
10043010-184 = "[s] \"아냐, 아냐. 이상하다는 게 아니라.\""
10043010-185 = "그렇군요. 야구장이라는 이 장소의 특성을 고려하면, 그렇게 보일 수도 있다는 말씀이군요."
10043010-186 = "알겠습니다. 그렇다면…… 어떻게 하면 좋을까요. 트레이너?"
10043010-191 = "아! 저 지금 좋은 생각 떠올랐어요, 선생님! 말 그대로 여기는 야구장이니까……."
10043010-192 = "선배가, 야구장에서라면 누구도 의심하지 않을 옷으로 갈아입으면 되지 않을까요?"
10043010-193 = "[s] \"그런데 그런 옷이 있을까?\""
10043010-194 = "혹시 이런 거 있나요, 감독님? (소곤소곤)"
10043010-199 = "음? 아하……! 물론이지! 그런 거라면야 지금 당장이라도 준비할 수 있고말고!"
10043010-216 = "오래 기다리셨습니다! 자, 선배! 이쪽이에요! 나와 봐요!"
10043010-224 = "음…… 이런 옷은 어딘가, 신선한 느낌이군요."
10043010-225 = "그…… 트레이너?"
10043010-226 = "어떻, 습니까……?"
10043010-227 = "[s] \"......!\""
10043010-229 = "[ns5] \"뭔가 신선해. 스미레! 엄청나게 잘 어울려!\"\n[ns6] \"평소에 몰랐던 스미레의 매력을 알게 된 것 같아!\""
10043010-232 = "그, 그렇습니까?"
10043010-233 = "트레이너께서 그렇게 말씀해 주신다면…… 후훗. 이 옷을 입은 것도 나쁘지 않군요."
10043010-234 = "관객들께 드링크를 나누어 드릴 수 있다는 점에서, 그렇군요. 몸에 좋은 단백질 드링크를 보다 많은 분께 제공해 드리는 것도……."
10043010-235 = "아뇨, 아니니까요. 선배. 그거 진짜 아니니까요."
10043010-236 = "아무튼! 그 복장이라면 문제없을 거예요! 어서 시작하죠. 시간이 없다고요!"
10043010-237 = "무엇보다 이렇게 시간이 지나 버렸으니까요. 어쩌면 벌써 공수교대 타임에 들어가서, 우리가 공격할 차례가 되어 버렸을 지도……?"
10043010-238 = "음, 그게 말이지. 아직 원 아웃이라서 시간은 제법 많이 남아 있을 것 같구나."
10043010-239 = "네?! 그만큼이나 시간이 지났는데 원 아웃이라고요!? 그럼 도대체……"
10043010-240 = "그러니까 우리는 그동안 계속, 아웃카운트 하나만 잡아내고 쭉 수비를 하고 있었다는 말이 되니까……!"
10043010-246 = "……."
10043010-247 = "……."
10043010-248 = "[s] \".......\""
10043010-253 = "그, 그래도 야구는 끝날 때까지 모르는 거니까요!"
