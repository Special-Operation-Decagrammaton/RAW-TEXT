[translation]
1000002-1 = "근로의욕 증진 방법"
1000002-2 = "후후후, 그래서 말인데. 선생님."
1000002-3 = "혹시 받고 싶은 포상이라든가 있어?"
1000002-4 = "[s1] \"역시 금일봉.\"\n[s2] \"아루의 쓰담쓰담.\""
1000002-5 = "어, 어른이다……!"
1000002-6 = "그, 그게 아니라 선생님에게 로망 같은 건 없는 거야……?!"
1000002-7 = "읏, 쓰담쓰담?!"
1000002-8 = "그게 선생님이 받고 싶은 포상이라니."
1000002-9 = "저, 정말 그런 걸로 괜찮아……? 그런 거라면 얼마든지……."
1000002-11 = "[s] \"음, 아니면 뺨에 뽀뽀?\""
1000002-12 = "뺘, 뺨에 뽀, 뽀, 뽀뽀라니……!"
1000002-13 = "그건 아, 안돼. 아무리 사장과 우수 직원 사이라지만, 그런 행위는 좀 더 차근차근 시간을 들여서 진도를 나가는 쪽이……!"
1000002-14 = "역시 처음은 야경이 내려다보이는 레스토랑 같은 곳에서……."
1000002-15 = "[s] \"아, 생각해보니 역시 금일봉 쪽이 좋겠다.\""
1000002-16 = "(선생님, 지금 날 놀리는 거야?!)"
1000002-19 = "하아, 괜히 지쳤어."
1000002-20 = "선생님, 좀 더 진지하게 고민해 줘. 뛰어난 실적에 적절한 포상을 지급하는 것."
1000002-21 = "이건 직원들의 근로의욕을 증진시키기 위해서라도 꼭 필요한 거잖아?"
1000002-22 = "[s] \"아루는 그런 곳에서 고집이 있네.\""
1000002-23 = "후후후, 우수한 직원들을 부리기 위해선 그만큼 우수한 사장님이 되어야 하는 법이야."
1000002-24 = "부하들이 먼저 이야기를 꺼내기도 전에 솔선해서 움직이는 리더."
1000002-25 = "분명 내 뛰어난 리더십에 부하들도 감탄을 금치 못할 테지. 후후훗!"
1000002-26 = "[s] \"그런 거라면 나, 아루에게 받고 싶은 포상이 있어.\""
1000002-27 = "음?"
1000002-29 = "스위트 큐브"
1000002-30 = "디저트 카페에서 사장인 나와 같이 파르페를 먹고 싶다니……"
1000002-31 = "선생님은 정말 포상으로 이런 걸 받아도 괜찮아?"
1000002-32 = "[s] \"아루와 먹는다는 게 중요해.\""
1000002-33 = "나, 나와 먹는다는 게, 중요하다고……."
1000002-34 = "흐, 흐응……. 뭐, 그렇게까지 말한다면야 어쩔 수 없네."
1000002-35 = "응, 선생님이 직접 말한 거니까. 나중에 딴소리하기 없기야?"
1000002-36 = "그래서 파르페는 뭘로 주문했어?"
1000002-42 = "여기, 주문하신 <커플 전용 도전메뉴 끊임없이 퍼먹어라. 도전해라 끝없는 크림의 산 ~점보 파르페 3단 찌르기~> 나왔습니다!"
1000002-43 = "저, 점보? 도전? 무, 무슨 의미야?"
1000002-44 = "[s] \"20분안에 다 먹으면 공짜래.\""
1000002-45 = "시간 안에 다 먹으면 공짜……?"
1000002-46 = "후후후, 역시 선생님이야."
1000002-47 = "직원 포상에서도 쓸데없는 낭비를 줄이기 위한 가장 효율적인 선택……."
1000002-48 = "역시 우리 흥신소의 경영 고문다워!"
1000002-49 = "[s] \"경영 고문이라니?\""
1000002-50 = "잔말 말고, 도전을 걸어온다면 받아주겠어!"
1000002-51 = "자, 먹자. 선생님!"
1000002-52 = "냠."
1000002-55 = "(그보다 이거……)"
1000002-56 = "(미처 몰랐는데 커플 전용 메뉴였잖아……?!)"
1000002-57 = "(선생님, 아무렇지도 않게 이런 걸 시키다니……!)"
1000002-58 = "(……흐, 흥!)"
1000002-59 = "(뭐어, 이, 이 정도는 나한테도 여유로우니까……?)"
1000002-60 = "(……당황한 거, 선생님한테, 안 들켰겠지?)"
