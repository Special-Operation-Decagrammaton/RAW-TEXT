[translation]
103140-1 = "제14화;돌입"
103140-5 = "지금 저희는…… 우트나피쉬팀의 배 전면부가 아트라하시스의 방주의 외벽을 뚫고 내부에 박혀 있는 상태예요."
103140-6 = "아마도 멀리서 본다면 사과에 이쑤시개가 꽂혀 있는 그런 모습이겠네요……."
103140-7 = "하아. 히, 힘들었어……."
103140-8 = "모두들, 괜찮나요? 상황 보고 부탁드립니다."
103140-9 = "다차원해석 시스템은 무사해요. 하지만 방주와 충돌하면서 중추 시스템이 피해를 입은 것 같아요."
103140-11 = "엔진도 셧다운 상태이고…… 재기동 시퀀스는 동작하지 않아요……."
103140-12 = "메인 컨트롤 시스템도 작동 불능…… 먹통이에요."
103140-13 = "각 구역별 통신 시스템 먹통, 연산 시스템도 뻗었어……."
103140-19 = "뭐, 뭐죠?!"
103140-20 = "으, 으아아?! 적이야! 적들이 여기로 몰려오고 있어!!"
103140-31 = "동쪽, 서쪽, 위에서까지…… 사방에서 몰려오고 있어!"
103140-32 = "예상은 하고 있었지만 이렇게 빨리……?! 마치 준비하고 있었던 것처럼……?"
103140-33 = "지금 저희는 적들의 본거지 한가운데 떨어진 거나 마찬가지니까……."
103140-34 = "막아야 해! 배가 부서지기라도 한다면 끝장이야! 지금 당장 교전 가능한 사람들을 보내서 방어해야 해!"
103140-35 = "다, 당장 교전 가능한…… 어…… 그러니까……"
103140-37 = "으헤~ 그럼 우리가 나설 차례려나~"
103140-45 = "호시노 선배!!"
103140-46 = "응응, 저희는 준비 완료예요! 언제든지 출동할 수 있어요!"
103140-47 = "네! 제가 서포트하겠습니다! 동쪽 통로예요!! 그쪽을 방어하러 가야 합니다!"
103140-48 = "좋아~ 가보자고."
103140-49 = "출발이야!!"
103140-55 = "후후후. 그럼 여기는 저희가 맡도록 하죠."
103140-56 = "으으…… 멀미 나."
103140-58 = "하아…… 나는 또 왜……."
103140-59 = "미식연구회……! 어느새?"
103140-61 = "후후후. 자세히는 모르겠지만 아무튼 여기서 와장창★ 하면 되는 거죠?"
103140-62 = "그렇습니다. 저희 미식연구회, 미식의 탐구를 방해하는 자들에게서 등을 보이고 도망친 적은 없습니다."
103140-63 = "맞아! 우주 식량을 먹기 위한 여정은 이제부터 시작이라고!!"
103140-65 = "(……그거 끝까지 먹지 못할 텐데요.)"
103140-66 = "하아…… 뭐, 고양이 손이라도 빌려야 하는 상황이니……"
103140-67 = "가시죠, 제가 지원하겠습니다."
103140-68 = "후후후. 감사합니다, 아코 씨."
103140-69 = "그럼 시작해 볼까요★"
103140-75 = "여, 여기는 저희가 막겠습니다……."
103140-76 = "게임개발부?! 어, 언제 거기에……?!"
103140-77 = "네. 저희들이라도 도움이 될 수 있다면 좋을 것 같아서요……. 아리스 쨩은 아직 자고 있지만."
103140-78 = "그래. 우리들과 선생님의 도움이라면 어떻게든 될 거야!"
103140-80 = "아, 알겠어! 내가 서포트할 테니까, 무모한 짓은 하지 않는 거야?"
103140-81 = "좋아, 유우카가 도와준다면 걱정 없지! 가자!!"
103140-82 = "네, 잘 부탁드리겠습니다!"
103140-83 = "가, 가자……! 파이팅!"
103140-85 = "선생님, 그러면 <우트나피쉬팀의 배>의 방어를 부탁드리겠습니다!"
103140-92 = "[ns] \"좋아, 대책위원회, 게임개발부, 미식연구회!! 가보자!\""
