[translation]
2005905-1 = "小惡魔與飯店度假"
2005905-2 = "（那天晚上，因為一直在意著那則訊息，決定前往無月投宿的飯店看看）"
2005905-3 = ""
2005905-7 = ""
2005905-8 = "飯店大廳"
2005905-9 = ""
2005905-10 = ""
2005905-12 = "[ns] （是這間嗎？）"
2005905-14 = "嗯？是誰？"
2005905-15 = "咦？老師？這種時間你怎麼會在這裡？"
2005905-19 = "嘿～？沒想到你真的來了呢。"
2005905-20 = "你是認真的嗎？跑來一個女孩子獨自投宿的飯店房間？"
2005905-21 = "咯呵呵，老師也挺大膽的嘛？"
2005905-22 = "[s] 「真的沒事嗎？沒發生什麼事吧？」"
2005905-23 = "……嗯？難道說你在擔心我嗎？"
2005905-24 = "啊哈哈哈，真的沒什麼大不了的啦。#n事情是這樣的……"
2005905-27 = ""
2005905-28 = ""
2005905-29 = ""
2005905-30 = ""
2005905-31 = ""
2005905-37 = "為了以防萬一，我調查了那些轉賣商還有沒有殘餘的勢力……結果果然不出所料。"
2005905-38 = "那些傢伙打算用炸彈換來的錢購買武器，然後把老師抓去當人質。"
2005905-39 = "不過別擔心，我已經把殘餘勢力全部打得落花流水了。"
2005905-40 = "他們賣炸彈賺來的錢，我也全都搶過來了。"
2005905-41 = "來，你看。"
2005905-43 = ""
2005905-46 = "（無月的包包裡裝滿了鈔票……）"
2005905-47 = ""
2005905-49 = ""
2005905-50 = "[ns] 「比，比想像中還要多耶？」"
2005905-51 = "咯呵呵，對吧？"
2005905-52 = "所以我才決定在安全的飯店裡躲個幾天。"
2005905-53 = "畢竟說不定還有其他人盯上了這筆錢嘛。"
2005905-54 = "[s] 「這筆錢你打算怎麼辦？」"
2005905-55 = "這不是連主人都找不到的無主之財嗎？"
2005905-56 = "這次的事件我也算是費了一番功夫，所以這筆錢就當作我的酬勞收下應該沒關係吧？"
2005905-57 = "老師你覺得呢？"
2005905-58 = "[s1] 「無月收下應該也沒關係吧？」\n[s2] 「把這種錢私吞感覺有點……」"
2005905-59 = "咦～？真的嗎？"
2005905-60 = "咯呵呵，就知道老師會這麼說。"
2005905-61 = "我自己也考慮了一下……"
2005905-62 = "我覺得由我來收下這筆錢……"
2005905-63 = "一點都不有趣！"
2005905-64 = "[ns] 「……嗯？」"
2005905-65 = "你想想，要是我把這筆錢拿回去的話，最後都變成便利屋的經費吧？#n不覺得那種結果很無聊嗎？"
2005905-66 = "我們便利屋就是要時不時出點狀況，跌跌撞撞地運作下去才有趣嘛。"
2005905-67 = "啊，這件事要對大家保密哦？咯呵呵。"
2005905-68 = "[s] 「那有值得信任，可以託付的地方嗎？」"
2005905-69 = "嗯！有！這筆錢……"
2005905-70 = "我要全部交給老師！"
2005905-73 = "― [log=무츠키 드레스]你知道嗎？別看我這樣…… [/log][wa:2690] "
2005905-75 = "― [log=무츠키 드레스]其實還挺信任老師的哦？[/log][wa:2170] "
2005905-78 = "― [log=무츠키 드레스]咦，很意外？[/log][wa:1538] "
2005905-80 = "― [log=무츠키 드레스]……因為我總是在惡作劇嗎？ [/log][wa:200] "
2005905-83 = "― [log=무츠키 드레스]咯呵呵。我也不是對誰都會這樣的哦。[/log][wa:2475] "
2005905-86 = "― [log=무츠키 드레스]嗯，總之……那筆錢要怎麼處理，就交給你決定了。 [/log][wa:6136] "
2005905-88 = "― [log=무츠키 드레스]如果是老師，一定會用在有意義的地方吧。 [/log][wa:2948] "
2005905-91 = "― [log=무츠키 드레스]捐去某個地方也行……[/log][wa:874] "
2005905-93 = "― [log=무츠키 드레스]拿來當作老師的活動資金也可以…… [/log][wa:1529] "
2005905-96 = "― [log=무츠키 드레스]如果都不喜歡的話，就當作是交給老師保管──[/log][wa:2005] "
2005905-98 = "― [log=무츠키 드레스]為了我們的未來先存起來，或許也不錯？ [/log][wa:3162] "
2005905-101 = "― [log=무츠키 드레스]咦？問我在說什麼？[/log][wa:2240] "
2005905-104 = "― [log=무츠키 드레스]咯呵呵！不知道耶？[/log][wa:1835] "
2005905-106 = "― [log=무츠키 드레스]是什麼意思呢♪ [/log][wa:120] "
2005905-110 = "（之後繼續在飯店裡配合著無月的惡作劇）"
2005905-111 = "（雖然以防萬一陪他待到深夜……但並沒有發生危險的事）"
2005905-113 = ""
2005905-114 = ""
2005905-116 = "（為了慰勞無月這次的辛勞，決定替他支付所有飯店費用）"
2005905-117 = "（總之，沒有發生什麼大事真是太好了）"
