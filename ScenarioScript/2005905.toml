[translation]
2005905-1 = "ปีศาจน้อยกับสเตย์เคชั่น"
2005905-2 = "(คืนนั้นเอง ข้อความจากมุสึกิยังคงรบกวนจิตใจคุณครูอยู่ คุณครูจึงไปยังโรงแรมที่มุสึกิพักอยู่)"
2005905-3 = ""
2005905-7 = ""
2005905-8 = "ล็อบบี้โรงแรม"
2005905-9 = ""
2005905-10 = ""
2005905-12 = "[ns] (ห้องนี้หรือเปล่านะ?)"
2005905-14 = "หืม? ใครน่ะ?"
2005905-15 = "เอ๋? คุณครูเหรอ? แต่นี่มันดึกแล้วนะ?"
2005905-19 = "เอ๋? มาจริงๆ ด้วย?"
2005905-20 = "จริงจังเหรอเนี่ย? เข้ามาในห้องพักของโรงแรมที่เด็กผู้หญิงมาพักอยู่คนเดียวเลยเหรอ?"
2005905-21 = "ฮุฮุฮุ คุณครูใจกล้าจังเลยนะ"
2005905-22 = "[s] \"โอเคดีหรือเปล่า? ทุกอย่างเรียบร้อยดีมั้ย?\""
2005905-23 = "หืม...? อย่าบอกนะว่า... เป็นห่วงเค้า?"
2005905-24 = "อะฮะฮะฮ่า ก็บอกว่าไม่ใช่อะไรใหญ่โตไง เรื่องมันเป็นอย่างนี้น่ะ..."
2005905-27 = ""
2005905-28 = ""
2005905-29 = ""
2005905-30 = ""
2005905-31 = ""
2005905-37 = "เค้าไปสืบดูอีกครั้งว่ายังมีพวกกักตุนระเบิดเหลืออยู่อีกหรือเปล่า แล้วก็ดันมีจริงๆ ด้วย"
2005905-38 = "ที่หนักกว่านั้นก็คือ พวกนั้นจะเอาเงินที่ได้จากการขายระเบิดไปซื้ออาวุธ แล้วจะมาจับคุณครูเป็น#nตัวประกันน่ะสิ"
2005905-39 = "แต่ไม่ต้องห่วงนะ เค้าไปกวาดล้างพวกนั้นจนเรียบหมดแล้วละ"
2005905-40 = "แล้วก็แย่งเงินจากการขายระเบิดของพวกนั้นมาด้วย"
2005905-41 = "นี่ไง ดูสิ"
2005905-43 = ""
2005905-46 = "(กระเป๋าของมุสึกิมีเงินอยู่เพียบ...)"
2005905-47 = ""
2005905-49 = ""
2005905-50 = "[ns] \"มะ... มากกว่าที่คิดไว้เยอะเลยนะ?\""
2005905-51 = "ฮุฮุฮุ ใช่มั้ยล่ะ?"
2005905-52 = "เค้าเลยตัดสินใจว่าจะซ่อนตัวในโรงแรมที่ปลอดภัยสักสองสามวันน่ะ"
2005905-53 = "เพราะอาจมีคนอื่นที่หมายตาเงินก้อนนี้อยู่ก็ได้"
2005905-54 = "[s] \"จะเอาเงินนี้ไปทำอะไรเหรอ?\""
2005905-55 = "มันเป็นเงินที่หาตัวเจ้าของไม่ได้นี่นา"
2005905-56 = "งานนี้เค้าเองก็ลำบากไปตั้งเยอะ ถ้าจะขอเก็บเงินนี้ไว้เป็นค่าเหนื่อย คงไม่เป็นไรหรอกเนอะ?"
2005905-57 = "คุณครูคิดว่ายังไงเหรอ?"
2005905-58 = "[s1] \"มุสึกิเก็บไว้เป็นของตัวเองก็ได้นะ\"\n[s2] \"แอบฮุบเงินแบบนี้มันไม่ถูกต้องหรือเปล่า...\""
2005905-59 = "หืม~? จริงเหรอ?"
2005905-60 = "ฮุฮุฮุ กะไว้แล้วละว่าคุณครูต้องพูดแบบนี้"
2005905-61 = "แต่ก็นะ ยังไงเค้าก็คิดทบทวนเรื่องนี้มาเยอะเหมือนกัน"
2005905-62 = "ถ้าจะเก็บเงินก้อนนี้ไว้กับเค้า มันก็คง..."
2005905-63 = "หมดสนุกน่ะสิ!"
2005905-64 = "[ns] \"หืม...?\""
2005905-65 = "ลองคิดดูนะ ถ้าเค้าเอาเงินก้อนนี้ไป มันก็จะกลายเป็นงบประมาณของหน่วยรับจ้างทั้งหมด แบบนั้นมันก็น่าเบื่อแย่เลยไม่ใช่เหรอ?"
2005905-66 = "หน่วยรับจ้างของเราต้องขับเคลื่อนแบบทุลักทุเลหน่อยสิถึงจะสนุก"
2005905-67 = "อ๊ะ เรื่องนี้ต้องเก็บเป็นความลับนะ ห้ามไปบอกใครล่ะ ฮุฮุฮุ"
2005905-68 = "[s] \"งั้นมีที่ไหนที่ปลอดภัยต่อการเก็บเงินเหรอ?\""
2005905-69 = "อื้อ! มีสิ! เงินนี้น่ะ..."
2005905-70 = "จะฝากไว้ที่คุณครูให้หมดเลย!"
2005905-73 = "― [log=무츠키 드레스]รู้หรือเปล่า? เห็นเค้าอย่างนี้ [/log][wa:1970] "
2005905-75 = "― [log=무츠키 드레스]เค้าก็เชื่อใจมากเลยนะ เชื่อใจคุณครูน่ะ[/log][wa:1090] "
2005905-78 = "― [log=무츠키 드레스]เอ๋ คาดไม่ถึงเหรอ?[/log][wa:1058] "
2005905-80 = "― [log=무츠키 드레스]เพราะเค้าเอาแต่แกล้งเล่นอยู่ตลอดงั้นเหรอ? [/log][wa:10] "
2005905-83 = "― [log=무츠키 드레스]ฮุฮุฮุ เค้าก็ไม่ได้เป็นแบบนี้กับทุกคนหรอกนะ[/log][wa:1435] "
2005905-86 = "― [log=무츠키 드레스]ก็ เอาเป็นว่า... เค้าจะให้ตัดสินใจเองแล้วกัน ว่าจะเอาเงินนั้นไปทำอะไร [/log][wa:4296] "
2005905-88 = "― [log=무츠키 드레스]ถ้าเป็นคุณครูละก็ต้องเอาไปใช้ในทางที่ดีอยู่แล้ว [/log][wa:1828] "
2005905-91 = "― [log=무츠키 드레스]จะเอาไปบริจาคให้ที่ไหนก็ได้[/log][wa:194] "
2005905-93 = "― [log=무츠키 드레스]หรือใช้เป็นทุนทำกิจกรรมของคุณครูก็ได้เหมือนกัน [/log][wa:329] "
2005905-96 = "― [log=무츠키 드레스]ถ้ายังไม่ชอบ คุณครูก็เก็บติดตัวไว้ตลอดแล้วกัน[/log][wa:1045] "
2005905-98 = "― [log=무츠키 드레스]เก็บออมไว้เพื่ออนาคตของเราก็ดีเลยไม่ใช่เหรอ? [/log][wa:2122] "
2005905-101 = "― [log=무츠키 드레스]หืม? หมายความว่ายังไงน่ะเหรอ? [/log][wa:1400] "
2005905-104 = "― [log=무츠키 드레스]ฮุฮุฮุ! ก็ไม่รู้สิ?[/log][wa:1435] "
2005905-106 = "― [log=무츠키 드레스]จะหมายความว่ายังไงน้า♪ [/log][wa:10] "
2005905-110 = "(หลังจากนั้นคุณครูก็อยู่ที่โรงแรมต่อเพื่อเล่นสนุกกับมุสึกิ)"
2005905-111 = "(ถึงจะอยู่ต่อจนดึกดื่นด้วยความเป็นห่วง... แต่ก็ไม่มีเรื่องอันตรายใดๆ เกิดขึ้น) "
2005905-113 = ""
2005905-114 = ""
2005905-116 = "(สุดท้ายคุณครูตัดสินใจจ่ายค่าโรงแรมให้ เพื่อให้กำลังใจในความเหนื่อยยากครั้งนี้)"
2005905-117 = "(โชคดีที่ไม่มีเรื่องใหญ่อะไรเกิดขึ้นตามมา)"
