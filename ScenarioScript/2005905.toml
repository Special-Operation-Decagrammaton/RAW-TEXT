[translation]
2005905-1 = "The Imp and Glamping"
2005905-2 = "I couldn't stop thinking about the text. I headed to Mutsuki's hotel."
2005905-3 = ""
2005905-7 = ""
2005905-8 = "Hotel Lobby"
2005905-9 = ""
2005905-10 = ""
2005905-12 = "[ns] \"(Is it this room?)\""
2005905-14 = "Huh? Who is it?"
2005905-15 = "Sensei? At this hour?"
2005905-19 = "Hm? So you're actually here."
2005905-20 = "Are you for real? You just go to a hotel room where a nice girl is staying all by herself?"
2005905-21 = "Kufufu. You're quite bold, Sensei."
2005905-22 = "[s] \"Are you really all right? Nothing's wrong?\""
2005905-23 = "...Huh? Were you worried?"
2005905-24 = "Hahaha. Oh, it was nothing. What happened is..."
2005905-27 = ""
2005905-28 = ""
2005905-29 = ""
2005905-30 = ""
2005905-31 = ""
2005905-37 = "I was checking...very innocently...if there were any more bomb scalpers. And I found a gang."
2005905-38 = "It turned out that they were looking to buy some weapons. And they wanted to use THOSE to take YOU as a hostage, maybe collect some ransom money."
2005905-39 = "But don't worry. I wiped them all out. You're safe!"
2005905-40 = "I also confiscated all the money they made from scalping."
2005905-41 = "See? Look."
2005905-43 = ""
2005905-46 = "Her bag was stuffed with money."
2005905-47 = ""
2005905-49 = ""
2005905-50 = "[ns] \"Th-That's way more than I expected.\""
2005905-51 = "Kufufu. Right?"
2005905-52 = "So I decided to lay low at a hotel, just in case. I thought that I might as well pick a nice one."
2005905-53 = "It's got good security. And I'm sure they're looking for their lost loot."
2005905-54 = "[s] \"What are you going to do with the money?\""
2005905-55 = "It's unclaimed money with no identifiable owner, isn't it?"
2005905-56 = "Don't you think all my hard work has earned me ample compensation?"
2005905-57 = "Isn't that right, Sensei?"
2005905-58 = "[s1] \"Are you sure that's all right?\"\n[s2] \"Embezzling money like this is a bit...\""
2005905-59 = "Oh? Is it?"
2005905-60 = "Kufufu. I knew you'd say that."
2005905-61 = "That said, I have thought about it."
2005905-62 = "I think that me keeping this money..."
2005905-63 = "...Is boring!"
2005905-64 = "[ns] \"...Huh?\""
2005905-65 = "Think about it. If I take this money, then I'll have to invest in our club's budget. And that's so...dull."
2005905-66 = "Problem Solver 68 needs its hiccups. That's what makes it fun!"
2005905-67 = "So you better keep it a secret, all right? Kufufu."
2005905-68 = "[s] \"Then what are you going to do with it?\""
2005905-69 = "I figured that out too! All this money..."
2005905-70 = "...should go to you, Sensei!"
2005905-73 = "― [log=무츠키 드레스]You know? Despite everything... [/log][wa:1930] "
2005905-75 = "― [log=무츠키 드레스]...I trust you a lot, Sensei.[/log][wa:1450] "
2005905-78 = "― [log=무츠키 드레스]Eh? That was surprising?[/log][wa:818] "
2005905-80 = "― [log=무츠키 드레스]Because I'm pulling pranks all the time? [/log][wa:10] "
2005905-83 = "― [log=무츠키 드레스]Kufufu. I don't say this to just anyone.[/log][wa:1555] "
2005905-86 = "― [log=무츠키 드레스]That's why... I'll leave it up to you, what to do with the money. [/log][wa:4456] "
2005905-88 = "― [log=무츠키 드레스]You of all people will put it to good use. [/log][wa:2028] "
2005905-91 = "― [log=무츠키 드레스]You can donate it... [/log][wa:434] "
2005905-93 = "― [log=무츠키 드레스]...or even use it to fund your hobbies. [/log][wa:609] "
2005905-96 = "― [log=무츠키 드레스]If none of that appeals to you, just keep it.[/log][wa:1045] "
2005905-98 = "― [log=무츠키 드레스]It's never too early to start saving for our future, right? [/log][wa:1522] "
2005905-101 = "― [log=무츠키 드레스]Hm? What does that mean? [/log][wa:1600] "
2005905-104 = "― [log=무츠키 드레스]Kufufu! I wonder.[/log][wa:1515] "
2005905-106 = "― [log=무츠키 드레스]What could it mean? ♪ [/log][wa:10] "
2005905-110 = "Even after that, I played along with Mutsuki's mischief at the hotel."
2005905-111 = "I stayed there until it got late, just in case... But nothing dangerous happened."
2005905-113 = ""
2005905-114 = ""
2005905-116 = "To show my support, I paid for the hotel room."
2005905-117 = "I'm glad nothing too serious happened."
