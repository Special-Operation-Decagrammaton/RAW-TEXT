[translation]
10052070-1 = "헤세드. 자비로운 고통으로 정죄하는 심판자"
10052070-2 = "심~ 심~ 해~!!!"
10052070-3 = "또 그런다, 또. 그러다 금방 큰일 날지도 몰라, 언니?"
10052070-4 = "하지만~ 우리만 빼놓고 전부 나가 버렸고~ 선생님도 여기 없고~"
10052070-5 = "우리 놀러 온 거 아니거든? 어떻게 보면 엄청 위험한 곳 한가운데에 있는 거란 말이야……."
10052070-6 = "……여기 예언자가 뭐랬더라. 헤세드였나?"
10052070-7 = "응. 맞아."
10052070-8 = "걔는 어떤 앨까……."
10052070-9 = "예언자를 무슨 학교 친구 부르는 것처럼 부르네……. 아무튼, 무슨 공장 같은 거라던데?"
10052070-10 = "밀레니엄 폐허에 있었다고 했던가? 그러고 보니 우리가 또 거기랑 인연이 있지……."
10052070-11 = "기억나네. G.Bible을 찾으려고 폐허에 갔다가, 떨어져서……."
10052070-13 = "……아리스 쨩을, 만났지."
10052070-16 = "그게 또 원래는 디비전(Divi:SION)이었던가…… 그걸 생산하는 AI였다며?"
10052070-17 = "그 이름도 별로 반갑지는 않네……. 그 문어인가 오징어처럼 생긴, 그것들 말이지?"
10052070-19 = "그게 또 케이랑도 관계 있는 것이기도 했고…… 잠깐만. 그렇게 따지면 이 헤세드라는 예언자, 우리와 인연이 너무 많은 거 아냐?"
10052070-20 = "그런데도 현장에 못 가고 수송선 대기라니~ 심심해~ 너무하다구~"
10052070-21 = "어쩔 수 없잖아. 헤세드는 말 그대로 공장이라고 했고, 그래서 엄청나게 많은 병력을 실시간으로 만들어낸다고 하고."
10052070-22 = "거기에 대응하려면, 우리 쪽에서도 쓸 수 있는 전력은 모두 써야 한다고 했는걸."
10052070-23 = "우리는 전력으로도 안 취급하는 거냐!"
10052070-24 = "……언니가 제비뽑기에서 우리 둘만 딱 뽑았잖아……."
10052070-25 = "그엑. 거기에서 사람의 아픈 기억을 끄집어내다니……!"
10052070-26 = "그래도 간만에 쉴 수 있어서 다행인 것 아닐까? 다시 말하지만, 우리 여기 놀러 온 거 아니야, 언니."
10052070-30 = "……우리들 말이야."
10052070-31 = "응."
10052070-32 = "참 별거 다 해본다. 그렇지?"
10052070-33 = "폐허에 우주에, 다음은 강철대륙인가……."
10052070-34 = "우우…… 우리는 어디까지나 게임을 만들려고 했을 뿐인데……."
10052070-35 = "무슨 소리야, 미도리. 이게 다 소재라고, 소재."
10052070-36 = "그거 우주에 갔을 때도 똑같은 말 하고는 안 써먹었잖아……. 하아, 됐어. 내가 말을 말아야지……."
10052070-47 = "뭐, 뭐야?!"
10052070-51 = "언니! 저쪽 화면을 봐! 큰일 났어!"
10052070-58 = "어?! 저것들은…… 레이버였던가? 그리고……!"
10052070-60 = "병력이 엄청나게 몰려오고 있어!"
10052070-65 = "수송선, 들리나요? 모두 미안해요!"
10052070-66 = "레이버와 병력 일부를 놓쳤는데, 그쪽으로 간 것 같아요!"
10052070-67 = "수송선의 방어 시스템은 빈약하지만…… 어떻게든 이쪽에서 최대한 가동해 보겠어요. 그러니까……!"
10052070-71 = "……."
10052070-72 = "우리가 막아 볼게, 히마리 선배. 걱정하지 마."
10052070-73 = "어, 언니?!"
10052070-74 = "괜찮아. 우리도 뭔가 해야지. 이 슈트, 애초에 안전성 중시로 디자인한 거잖아? 분명 할 수 있을 거야!"
10052070-75 = "선생님도 아리스도 다들 저렇게 열심인데, 우리만 놀고 있을 수는 없으니까!"
10052070-76 = "그, 그렇다기에는 여러분도 다른 구역에서 많은 도움이 되어 주셨는데요?"
10052070-77 = "지금은 교대 멤버로 어쩌다 수송선에 남은 것일 뿐이고……."
10052070-78 = "그런 건 중요하지 않아!"
10052070-82 = "……."
10052070-83 = "응. 무슨 말인지 알았어, 언니."
10052070-84 = "걱정하지 마세요, 히마리 선배. 여기는 우리가 어떻게든 해 볼게요."
10052070-98 = "어, 어어어어, 어떡하죠?!"
10052070-99 = "지, 지금이라도 모모이와 미도리에게 돌아가야 하지 않을까요, 선생님?"
10052070-100 = "……."
10052070-101 = "그것도 하나의 방법이겠지만, 최대한 빠르게 이 구역을 점령하고 돌아가는 편을 추천하고 싶어."
10052070-102 = "그렇습니다. 여기까지 와서 되돌이키기는 어렵습니다."
10052070-103 = "무엇보다 섣불리 회군하면, 자칫 양면 전선에 돌입하게 될 가능성이 높습니다."
10052070-104 = "여기에서는 모모이와 미도리를 최대한 믿어야 한다고 생각합니다."
10052070-105 = "……맞아. 다른 예언자의 구역이라면 우리 중 일부를 복귀시켰겠지만."
10052070-106 = "여기는 헤세드의 구역이야. 어쩔 수 없이 소모전을 강요받게 되는 곳이지."
10052070-107 = "그렇지만 만에 하나를 대비해서, 히마리와 아리스는 이 구역을 이탈할 마음의 준비를 해 줘."
10052070-108 = "왜 우리죠?"
10052070-109 = "가장 빠르니까."
10052070-110 = "좋아요. 합리적인 이유군요. 받아들이겠어요."
10052070-112 = "[ns1] \"……최대한 빠르게 헤세드를 공략하자.\"\n[ns2] \"그리고 모모이와 미도리에게 돌아가는 거야.\""
10052070-115 = "네. 그러면 선생님, 부탁드리겠습니다."
