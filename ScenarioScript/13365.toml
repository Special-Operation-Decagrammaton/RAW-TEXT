[translation]
13365-3 = "지금이야!!"
13365-9 = "……!! 으윽!"
13365-10 = "뜨, 뜨거워!! 빨리!!"
13365-13 = "선생님!! 저 열기는 제가 어떻게든 막고 있을 테니까, 서둘러주세요!"
13365-14 = "<세트의 분노>의 상태가 심상치 않아요! 시간이 없어요!"
13365-18 = "[ns] 호시노의 몸에 손을 갖다 댄다."
13365-21 = "됐어! 그런데 대체 선생님은 무슨 말을……?"
13365-22 = "[s] \"내가 아니야!!\""
13365-26 = "[ns1] \"아무리 어른이어도, 죽음이나 고통에 대해선 아무것도 알지 못해!!\"\n[ns2] \"그건 아이나 어른과는 관계없이 공평한 거니까!\""
13365-30 = "[ns] \"너희들이 해야 해!!\""
13365-33 = "그렇군……. 응. 이건 대책위원회만이 할 수 있는 일이겠지."
13365-34 = "[ns] \"그리고 너도!!\""
13365-38 = "응. 너도 아비도스잖아. 호시노 선배를 구해줘."
13365-39 = "복면단의 일원으로서."
13365-45 = "그런 말에 일일이 반응해 주지 마!! 시로코 선배 버릇 나빠지잖아!"
13365-52 = "……아니, 같은 사람이니까 어쩔 수 없나."
13365-53 = "서둘러!!"
13365-58 = "[ns3] \"전해!!\"\n[ns4] \"호시노에게 전해!!\""
13365-62 = "다음화;말하지 않으면 안 되는 것"
