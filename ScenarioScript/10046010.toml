[translation]
10046010-1 = "제1화;오늘은 금요일"
10046010-5 = "아아아~앙! 싫어~!"
10046010-6 = "싫어싫어싫어싫어싫어싫어~!!"
10046010-9 = "그게 뭐야~! 말도 안 돼, 그럴 수는 없어!!"
10046010-10 = "있고 없고는 미카 씨가 정하는 게 아닙니다. 제발 애처럼 굴지 좀 마세요."
10046010-11 = "늘 말씀드리지만, 아무리 지금 같은 상태라도 미카 씨는 조금 더 티파티의 일원으로서 격식을……."
10046010-12 = "……아니, 그 이전에 3학년이나 돼서 그렇게 소리치며 떼쓰는 법이 어디 있습니까? 조금은 성장을 하세요!"
10046010-13 = "몰라! 몰라몰라, 그런 거 몰라~! 가기로 했었잖아, 약속했던 일정이잖아!"
10046010-14 = "이렇게 일 많다고 갑자기 취소하는 게 어디 있어~! 내가 얼마나 기대하면서 준비했는데!!"
10046010-16 = "나기 쨩 바보! 왕 바보!! 완전 자기 맘대로야!! 진짜 싫어!!"
10046010-24 = "정말이지……. 대체 여름 휴양이 뭐라고……."
10046010-25 = "알았습니다. 그러면 미카 씨만이라도 보내 드릴 테니……."
10046010-29 = "안 돼!!"
10046010-33 = "……예?"
10046010-34 = "안 되지!! 혼자 가서 어쩌라고!? 혼자 바다 가서 노는 거야? 아무 재미없다고!!"
10046010-35 = "그냥 원래 일정대로 하자~!! 응? 나기 쨩이랑 세이아 쨩도 같이 가자~!!"
10046010-36 = "미카 씨……!!"
10046010-41 = "아니, 대체 뭐 어쩌라는……."
10046010-42 = "세이아 씨, 세이아 씨도 뭐라고 한마디 좀 해 보세요. 미카 씨를 저대로 둘 겁니까?"
10046010-43 = "흐으응~~?"
10046010-44 = "재미있군요. 나기사 혼자서는 감당 안 되니, 이젠 저까지 끌어들이는 건가요?"
10046010-45 = "글쎄요……."
10046010-49 = "평소에는 별다른 권한도 안 주고, 필요할 때만 이용할 셈이라면 사양하겠습니다."
10046010-50 = "아니면 뭐, 지금이라도 업무를 분배해서 양도할 생각이 드나요? 나기사."
10046010-52 = "크윽!! 세이아 씨, 당신마저!!"
10046010-53 = "……"
10046010-54 = "크윽! 제가 매일매일 '일부러 참아가며 사는 것'을 모르지도 않는 두 분께서!!"
10046010-55 = "진짜 계속 이런 식으로 나오시는 겁니까……?"
10046010-56 = "흐응, 협박과 회유라. 나기사는 그런 게 특기였죠."
10046010-57 = "하지만 상대를 잘못 골랐네요. 그렇게 나오는 것이, 외려 그녀의 노림수인 것 같으니까요."
10046010-58 = "후.후.후……!"
10046010-60 = "……으으으……!!"
10046010-67 = "아~!! 정말!! 당신들 마음대로 하세요!!"
10046010-68 = "이제는 진짜 어떻게 돼도 전 모릅니다!!"
10046010-75 = "잘 됐군요, 미카. 결국, 예정대로 바다에 가겠네요."
10046010-76 = "솔직히 감탄했습니다. 다른 사람도 아닌 나기사의 고집을 꺾는 건, 아마 세상천지에 당신뿐일 거예요."
10046010-77 = "……이제 만족하나요? 미카."
10046010-83 = "응! 당연하지!"
10046010-84 = "나는 이제 나기 쨩이나 세이아 쨩이랑 달리 이런 기회가 흔치 않다고!"
10046010-85 = "이런 때에 세트로라도 가야 하는 게 당연하잖아? 안 그래?"
10046010-86 = "히히~. 프라이빗 비치~. 프라이빗 비치~."
10046010-87 = "지금은 나기사도 없는데, 굳이 여기서까지 그럴 필요는 없어요. 저도 바보는 아니니까요."
10046010-88 = "나기사를 위한 행동이었잖아요? 덕분에 저도 업무를 나눠 받을 수 있었고……."
10046010-89 = "제가 보기에도 지금이 적기였습니다. 미카가 아무 생각 없이 어리광을 부린 게 아니라는 것쯤은 알고 있습니다."
10046010-94 = "……."
10046010-95 = "……나기 쨩한테는 말하면 안 돼."
10046010-96 = "설마요. 제가 당신도 아니고, 그 정도로 어리숙하진 않죠."
10046010-97 = "세이아 쨩……?"
10046010-98 = "저대로 그냥 놔뒀으면 나기사는 또 과중한 업무를 해결하느라 휴양 일정을 취소하고 무리했겠죠."
10046010-99 = "저번에 풀어준 이후로도 금방 다시 돌아가서……. 언제쯤 혼자 떠안고 있는 저걸 놓을지 걱정했는데, 잘 됐어요."
10046010-100 = "이번 기회에 억지로라도 좀 쉬게 해야죠."
10046010-101 = "이런 식으로라도…. 네. 원래부터 티파티는 혼자 관리해야 하는 조직도 아니고, 그럴 수 있는 업무량도 아니니까요."
10046010-102 = "……그 이전의 문제기도 하고요."
10046010-103 = "아무튼 저는 계속 실패했던 시도인데……. 여러모로 고마워요, 미카."
10046010-108 = "헤에~. 세이아 쨩한테 감사도 다 받아 보고, 별일이네. 히히."
10046010-109 = "뭐, 하지만 휴양으로 놀고 싶다는 말 자체도 거짓말은 아니니까! 지금의 나는 이런 때 아니면 호사를 못 누리잖아?"
10046010-110 = "너무 어른스러운 사람인 것처럼 띄워 줘도 부끄럽고 말이지."
10046010-111 = "어른스럽다고 까진 말 안 했는데요. 미카가 놀고 싶어서 떼썼다는 걸 거짓말이라고 한 기억은 없습니다만."
10046010-112 = "우리도 하루이틀 본 사이는 아니잖아요? 철부지 아가씨."
10046010-113 = "제발 한 번만이라도 그냥 훈훈하게 넘어갈 수 없을까? 우리 왕재수 세이아 씨는?"
10046010-114 = "후후, 당신이 철부지인 것처럼, 이것도 제 천성이니까요. 감안해 주시죠."
10046010-115 = "그래도 오랜만에 셋이서 함께, 다른 거 신경 안 쓰고 놀고 싶다는 생각은 저 역시 마찬가지네요."
10046010-116 = "……다만……."
10046010-120 = "……응? 뭔가 걱정되는 거라도 있어?"
10046010-121 = "음……."
10046010-122 = "아뇨. 저도 이제는 예전 같지는 않으니까요. 그냥 노파심이 좀 들었을 뿐이에요."
10046010-123 = "하하! 그게 뭐야, 세이아 쨩도 참~."
10046010-124 = "에이~. 너무 그러지 마. 뭐……."
10046010-129 = "별일이야 있겠어?"
10046010-145 = "……그런 일이 있어서, 모쪼록 너희들과 선생님한테도 부탁을 하게 됐어!"
10046010-146 = "나기 쨩이 푹 쉴 수 있게, 괜히 일 생각을 하지 않도록 함께 도와줬으면 해."
10046010-147 = "정의실현부도…… 선생님도 각자의 일로 바쁠 텐데……. 미안해!"
10046010-148 = "후후, 그럴 리가요. 티파티를 보좌하는 것도 엄연히 저희의 업무예요."
10046010-149 = "그리고 나기사 님에 대해서는……. 저희 또한 걱정하고 있었으니, 오히려 미카 님의 배려에 안심하고 있습니다."
10046010-150 = "그러니 저 또한 미카 님처럼, 정의실현부를 대표해서 부탁드립니다. 선생님."
10046010-151 = "[s1] \"정말로 괜찮아. 나도 오히려 기쁜걸.\"\n[s2] \"기특한 생각들이잖아! 좋아, 좋아.\""
10046010-154 = "선생님……."
10046010-155 = "역시 그렇게 말씀해 주실 거라 예상하긴 했습니다만……."
10046010-156 = "……뭐, 저희가 계속 분위기 잡고 있어도 선생님께서 불편하실 테니, 여기서는 조금 가볍게 내려놓는 게 어떨까요?"
10046010-157 = "이치카……?"
10046010-158 = "후후, 역시 츠루기가 이치카를 보낸 이유가 있었군요. 저랑 이치카 둘만 보낸다기에 뭔가 했는데."
10046010-159 = "'최소한의 병력만 왔으면 좋겠다. 거창한 분위기가 아니었으면 한다.'라는 요청이었기 때문이지만 말이죠."
10046010-161 = "아, 그것도 내가 말했어. 아무래도 사람들 북적북적 데려오면, 나기 쨩은 또 평소의 나기 쨩이 되려 할 테니까."
10046010-162 = "정말 귀찮은 아가씨라고. 눈이 조금만 많아지면, 금세 평소처럼 굴려고 하니까."
10046010-163 = "오히려 사실은 정의실현부 없이, 우리끼리만 와도 괜찮다고 말하려 했지만……."
10046010-165 = "아무리 그래도 입장상 그건 곤란하죠. 여러분을 경호하는 건 저희의 최우선 업무니까요."
10046010-166 = "그렇지만 뭐, 어차피 여기는 아무도 없고…."
10046010-167 = "사실 애초에 티파티가 소유한 해안가고……. 별일이야 있겠나 싶은데 말이죠."
10046010-171 = "……네? 선생님?"
10046010-172 = "다른 두 분은 어디 있냐고요? 아아, 세이아 님과 나기사 님이요?"
10046010-174 = "두 사람은 아직 안 왔어. 조금 뒤에 따로 도착할 거야."
10046010-175 = "지금 우리는 일종의 '선발대' 느낌으로 온 거거든! 만일을 대비해 우선 이 해안가를 점검하러 왔달까?"
10046010-176 = "……응?"
10046010-177 = "그럼 인원은 그게 전부냐고? 맞아, 지금 이렇게 네 명에 세이아 쨩, 그리고 나기 쨩. 해서 6명!"
10046010-178 = "……응? 그럼 나는 왜 벌써부터 와 있는 거냐고? 그야……."
10046010-182 = "나는 이번 일정의 총책임자니까!"
10046010-183 = "[s3] \"……미카가?\"\n[s4] \"일정의 총책임자?\""
10046010-186 = "헤헤, 놀랐지? 프라이빗 비치 건에 한해서만큼은 내가 책임지고 진행하기로 했어."
10046010-187 = "사실 '휴양'이라고는 해도, 결국 진행하는 사람한테는 그것도 일종의 '일'이잖아?"
10046010-188 = "나기 쨩 한테는 '휴양 일정 동안에는 진짜로 아무것도 신경 쓰지 마!'라고 말해놨으니까."
10046010-190 = "과연……. 하긴, '휴식'이라고 한다면 완전히 업무로부터 떨어져야 비로소 휴식이라 할 수 있겠죠."
10046010-191 = "그러면 오늘의 티파티 쪽 업무는……."
10046010-192 = "그건 세이아 쨩이 해줄 거야. 만약 세이아 쨩 혼자 하기에 조금 힘들다면, 나기 쨩 대신 선생님한테 부탁하기로 했어."
10046010-193 = "[s5] \"그 이야기는 대충 전해 들었어.\"\n[s6] \"무슨 일인가 했더니, 그런 거였구나.\""
10046010-196 = "좋군요. 하지만 그런 일이라면 제게 맡기셔도 됐을 텐데……."
10046010-197 = "에이, 안돼. 안돼. 우리가 놀자고 온 건데 일정까지 맡기는 건 너무 미안하잖아."
10046010-198 = "그러니 두 사람도 이번에는 마찬가지야!"
10046010-199 = "이번에는 하스미 쨩이랑 이치카 쨩도, 일이라고 생각하지 말고 놀러 왔다고 생각해 줬으면 해."
10046010-200 = "무슨 일 생기면 둘이서 고민하지 말고, 그냥 나한테 말하라고! 알았지?"
10046010-206 = "미카 님……."
10046010-207 = "후후, 그렇게 신경 써 주시는 것만으로도 훨씬 즐거운 기분이네요."
10046010-208 = "저희도 입장이 있으니, 최소한의 대비는 스스로 해야 하겠지만…… 네, 그러면 가끔 부탁하도록 하겠습니다."
10046010-210 = "응, 응!! 맡겨 달라고!!"
10046010-211 = "대놓고 '놀러 왔다'라고는 말 못 하지만, 솔직히 저희 입장에서는 덕분에 이런 곳에 온 것이기도 하니까요."
10046010-212 = "말씀해 주신 대로, 적당히 휴양의 느낌으로도 즐기겠다~ 하고 있겠슴다!"
10046010-213 = "응! 아주 좋아!! 바로 그 느낌이야!!"
10046010-214 = "자~. 그럼 어디 보자, 처음 우리 '선발대'가 할 일은……."
10046010-216 = "우선 주변 조사겠지요. 언뜻 보아서는 한적하고 평화로운 해안이긴 하지만…."
10046010-217 = "그래도 늘 대비는 해야 하니까요. 주변의 시설이나 지형 등을 찾으며 문제가 될 게 없는지 찾아봅시다."
10046010-219 = "헤에, 척하면 척이네. 바로 나오잖아?"
10046010-220 = "원래 그런 일 하는 사람들이잖아요."
10046010-221 = "해변도 넓고 하니, 흩어져서 찾도록 할까요? 저는 해안가 끝부터 살펴보겠슴다."
10046010-222 = "다녀오겠슴다~!"
10046010-226 = "그럼 나는 반대쪽 끝부터 보고 올 게~!"
10046010-231 = "……역시, 그렇군요. 눈치채셨습니까, 선생님?"
10046010-232 = "[s7] \"아, 이치카 말이지.\"\n[s8] \"조금 긴장하고 있는 걸까?\""
10046010-235 = "후후, 역시 예리하시군요. 이치카는, 예, 저희 정의실현부 내에서도 촉망받는 부원이지요."
10046010-236 = "오히려 그 탓에 바깥으로만 나가게 되어 티파티 보조 업무에 투입된 적이 없습니다."
10046010-237 = "본인은 그렇지 않은 척하려 하지만, 평소보다 조금 어깨에 힘이 들어가고 만 듯하네요."
10046010-238 = "물론, 본인은 잘 얼버무리고 있다 생각하겠지만요."
10046010-239 = "모쪼록 이번 일정 동안, 이치카에 대해서도 잘 부탁드립니다."
10046010-240 = "[s] \"응, 걱정하지 마.\""
10046010-241 = "후후, 감사합니다. 그러면 선생님께서는…… 시설 점검을 하러 다녀오는 동안, 잠깐 쉬고 계시겠습니까?"
10046010-245 = "네? 저와 함께 가시겠다고요?"
10046010-246 = "후후, 감사합니다. 뭔가 그렇게 말씀해 주실 것 같았는데 말이죠."
10046010-250 = "시설이라고는 해도 그리 많지는 않으니 금방 끝날 것입니다. 그럼 이쪽으로……."
10046010-257 = "이곳은 샤워실입니다. 모두의 일정이 끝나고 나면, 여기서 샤워를 하고 환복하게 되겠지요."
10046010-258 = "점검……이라고는 해도, 매달 관리인 분께서 방문하시니, 물이 제대로 나오는지 정도만 확인하면 그만일 것 같네요."
