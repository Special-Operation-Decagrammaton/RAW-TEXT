[translation]
1300809-1 = "아주 잠깐의 휴식"
1300809-5 = "……."
1300809-6 = "안녕. 선생님. 일찍 왔네."
1300809-7 = "[s1] \"세리카, 괜찮은 거야?\"\n[s2] \"다리가 후들거리는 거 같은데?\""
1300809-8 = "괜찮아……. 이 정도는 끄떡……."
1300809-9 = "괜찮아……. 이 정도는 끄떡……."
1300809-10 = "우, 우왓?!"
1300809-14 = "고, 고마워, 선생님. 주저 앉을 뻔했어……."
1300809-15 = "괘, 괜찮으니까. 이제 놔도 돼."
1300809-16 = "으, 으응? 안색이 안좋다고?"
1300809-17 = "야, 약간 피곤해서 그런 것뿐이야!"
1300809-18 = "어제부터 한숨도 못자서 그런 거니까…… 이 정도는 아무 것도 아냐! 괜찮으니까……!!"
1300809-19 = "[s] \"어제부터?\""
1300809-20 = "아……."
1300809-21 = "바, 밤샘 순찰 알바를……."
1300809-22 = "[s] \"밤샘?\""
1300809-23 = "그, 그 뒤에 새벽 우유배달을 하고……."
1300809-24 = "[s] \"새벽까지?\""
1300809-25 = "그, 그것보다는 빨리 주변을 정리하지 않으면……. 마, 마감 시간에 맞출 수 없단……."
1300809-26 = "(비틀)"
1300809-29 = "(털썩-)"
1300809-30 = "[s] \"세리카?!\""
1300809-32 = "……."
1300809-33 = "우, 우와아앗?!"
1300809-35 = "(벌떡)"
1300809-36 = "나, 나…… 자버렸어?!"
1300809-37 = "공원 벤치에서?"
1300809-38 = "서, 선생님?! 왜 안깨운 거야?! 알바는? 알바는 어떡하지?!"
1300809-39 = "어, 얼마나 자버린 거야??! 벌써 오후잖아!"
1300809-40 = "[s3] \"진정해.\"\n[s4] \"일을 맡긴 쪽에는 내가 제대로 사과해 두었어.\""
1300809-41 = "으, 으응?"
1300809-42 = "으, 으응?"
1300809-43 = "그, 그치만……. 그래도……."
1300809-44 = "[s] \"그러다 큰일 나. 너무 무리하지 않았으면 좋겠어.\""
1300809-45 = "……."
1300809-46 = "자, 자는 모습을 선생님한테…… 보였다니……."
1300809-47 = "변태!! 바보!! 얼마나 여고생을 부끄럽게 만들 셈이야, 당신!"
1300809-49 = "……."
1300809-52 = "(하아……. 선생님 말이 맞아.)"
1300809-53 = "(건강이 나빠져서야 오히려 일하는 이유가 역전되는 거잖아…….)"
1300809-54 = "(모두에게 폐를 끼치게 되는 거고.)"
1300809-57 = "……."
1300809-59 = "……아하하. 그네네. 옛날엔 자주 탔었는데."
1300809-60 = "여기 앉아봤던 게 언제였더라……."
1300809-61 = "읏챠."
1300809-64 = "(세리카가 그네에 앉았다.)"
1300809-67 = "― (최선을 다하는 수밖엔 없어.)"
1300809-69 = "― (이 마을을 사라지게 [wa:1800]둘 순 없으니까……)"
1300809-72 = "― 지금은…… [wa:1800]의지할 어른도 있으니까……[wa:200]"
1300809-75 = "― 선생님, [wa:1500]이리 와. [wa:1800]나랑 같이 탈까?"
1300809-77 = "― ……아하하, [wa:1300]농담이야. [wa:1500]아무리 그래도 그건 무리지."
1300809-80 = "― 저기, [wa:1000]듣고 있어? [wa:1300]지금 엄청 진지한 분위기라고.[wa:200]"
1300809-82 = "― ……정말이지."
1300809-85 = "― ……응? [wa:1300]고생 많았다고?"
1300809-87 = "― 내가 노력하는 걸 알고 있다니 [wa:3500]무슨……"
1300809-91 = "― 무, [wa:500]무슨 소리야?! [wa:1500]갑자기 위로하지 마!![wa:200]"
1300809-94 = "― 이, [wa:500]이건 [wa:2000]눈에 먼지가 들어간 것 뿐이니까…!"
1300809-97 = "― (그래도 [wa:1000]선생님이 아니었으면…… [wa:2500]나는 [wa:1000]훨씬 더 전에 포기했을 지도 몰라.)"
1300809-99 = "― 뭐, [wa:500]뭐야?! [wa:1400]왜 그렇게 빤히…….[wa:300]"
1300809-102 = "― 밀어주겠다고?"
1300809-104 = "― 괘, [wa:400]괜찮아! [wa:1600]누가보면 어쩌려고 그래!"
1300809-107 = "― 아, [wa:500]아무도 없긴 하지만 그래도!!"
1300809-109 = "― 이, [wa:500]이렇게 [wa:1500]선생님과 단둘이 데이트하고 있는 걸 들켜버리면……."
1300809-112 = "……."
1300809-113 = "오, 오늘은 신세졌어."
1300809-114 = "무리하지 말라는 말, 새겨 들을게. 선생님."
1300809-115 = "그, 그대신…… 그러니까…… 조, 조금은 의지할 테니까……."
1300809-116 = "……."
1300809-117 = "웃지 마!! 진지한 분위기잖아!"
1300809-118 = "……하아. 역시 글러먹은 어른은 안돼."
1300809-119 = "……. 뭐, 그게 선생님 다우니까."
1300809-120 = "……하아아-암. 조금 쉬었더니 다시 기운이 나는 거 같아."
1300809-121 = "응. 힘내서 내일부터 다시 열심히 해야지."
1300809-124 = "그럼, 갈까, 선생님?"
