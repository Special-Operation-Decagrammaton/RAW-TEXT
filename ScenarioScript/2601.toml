[translation]
2601-1 = "어른의 장난감 1"
2601-3 = "현무상회 운영 사무소"
2601-4 = "안녕하세요, 루미 회장님. 좋은 오후예요."
2601-5 = "오, 코코나 쨩이잖아? 어서 와."
2601-6 = "코코나 쨩이 아니라, 코코나 교관이라니까요!"
2601-7 = "저도 언니처럼 어엿한 한 사람의 교관이거든요? 정말…… 어린아이처럼 대하지 말아주세요!"
2601-8 = "하하, 미안. 예전부터 불러온 호칭이 입에 붙어서 말이야."
2601-9 = "그래서, 우리 '코코나 교관님'께서는 현무상회의 사무소에 무슨 일로 온 거야?"
2601-10 = "배고파? 볶음밥이라도 만들어줄까?"
2601-11 = "아뇨, 오늘은 식사를 하러 온 게 아니라, 식자재를 받으러 왔어요."
2601-12 = "식자재……?"
2601-13 = "네. 슌 언니가 현무상회에 가서 매화원 아이들의 식사 준비에 쓸 식자재를 받아오라고 했었거든요."
2601-14 = "……혹시 전달 못 받으셨나요?"
2601-15 = "맞다, 내 정신 좀 봐. 일을 하느라 바빠서 까맣게 잊고 있었네."
2601-16 = "잠깐만 기다려. 곧 가져다줄게."
2601-19 = "보자. 양배추랑 죽순, 당근, 양파는 챙겼고…… 거기에 말린 중화면이랑 두유도 넣은 다음……"
2601-20 = "아, 그리고 입구에 있는 납작 복숭아도 같이 가져가. 달콤하니 식후에 간식으로 내면 다들 좋아할 거야."
2601-21 = "이, 이렇게나 많이 챙겨 주셔도 괜찮으신가요?"
2601-22 = "저는 그저, 요리에 쓰고 남은 식자재를 받아오는 것뿐이라고만 들었는데……."
2601-23 = "괜찮아, 괜찮아. 어린아이들은 산해경의 미래니까. 많이 먹고, 빨리 자라야지!"
2601-24 = "……아, 하지만 코코나 쨩 혼자 들고 가기에는 조금 무거웠으려나?"
2601-25 = "그, 그렇지 않거든요? 저 정도의 교관이라면 이 정도의 짐은 혼자서도 충분하다고요!"
2601-26 = "후후, 그렇다면 다행이지만."
2601-27 = "아, 또 깜빡할 뻔했네. 이것도 같이 가져가."
2601-30 = "이 봉투는 뭔가요? 이것도 먹는 건가요?"
2601-31 = "아니. 그건 슌 교관이 저번에 특별히 현무상회를 통해 특별히 부탁한 물건이야."
2601-32 = "그게 뭐냐면—"
2601-34 = "……비밀이야."
2601-35 = "네? 갑자기?!"
2601-36 = "그게 생각해보니 슌 교관이 이 물건의 정체에 대해서는 다른 사람들에게 절대 비밀로 해달라고 했었거든."
2601-37 = "아무리 코코나가 슌의 동생이라고는 하지만, 고객의 비밀 엄수는 상회의 신용과도 관련된 일이니까. 미안하지만 알려줄 수 없어."
2601-38 = "우으…… 그렇게 말씀하시니 오히려 더 신경이 쓰이는데요."
2601-40 = "뭔가 단단한 게 흔들리며 달그락거리는 소리를 내는 것이…… 장난감인가?"
2601-41 = "뭐, 아주 틀린 이야기는 아니지. 이건 따지자면 <어른의 장난감>이라고도 할 수 있으니까."
2601-42 = "어른의…… 장난감이요?"
2601-43 = "응. 이 안에는 코코나 쨩 같은 어린아이가 보기에는 감당할 수 없을 정도의 무시무시한 물건이 들어있지."
2601-44 = "그러니까 가는 길에 몰래라도 확인해 볼 생각은 하지 않는 게 좋을 거야."
2601-45 = "그렇게 치면 루미 회장님이나 슌 언니도 어른이 아닌 건 마찬가지잖아요!"
2601-46 = "저도 어엿한 한 사람의 교관인데, 저만 모르고 넘어가야 한다니…… 치사해요!"
2601-47 = "코코나. 세상에는 모르는 게 도움이 되는 정보도 잔뜩 있는 법이야."
2601-48 = "예를 들자면…… 산해경의 학생회인 <현룡문> 간부들은 학교의 기밀을 유지하기 위해 비밀이 폭로되면 목격자들도 함께 처리해 버린다고 하잖아?"
2601-49 = "그 때문에 산해경의 학생들은 누군가가 현룡문의 실체에 대해 가르쳐 준다고 해도, '알고 싶지 않은 정보'를 듣게 될까 봐 먼저 발을 피하곤 하지."
2601-50 = "혀, 현룡문이요……?! 그럼 이 안에 담긴 물건은 현룡문과 관련된 기밀……?"
2601-51 = "으음, 뭐라 부인할 수는 없지만…… 일단은 그렇다고 해둘까."
2601-52 = "그러니까 코코나 쨩. 위험한 꼴을 보고 싶지 않다면 조용히 물건을 전달하는 게 좋을 거야."
2601-53 = "……네, 넵!"
2601-54 = "그, 그럼 이 봉투는 건드리지 않고 직접 슌 언니에게 전달할게요!"
2601-55 = "응. 그럼 잘 부탁할게~."
2601-60 = "하, 하하…… 이만하면 잘 속여넘겼으려나……?"
2601-62 = "현무상회 거리"
2601-66 = "어른의 장난감이라…… 생각하면 할수록 더 신경이 쓰이네요."
2601-67 = "하지만 루미 회장님이 말씀하신 것처럼 위험한 일에 휘말릴 수도 있으니 지금은 얌전히 물건을 전달하는 데 집중해야겠어요."
2601-68 = "[s] \"안녕, 코코나.\""
2601-69 = "앗, 선생님. 안녕하세요."
2601-70 = "[s1] \"무거워 보이는 짐이네.\"\n[s2] \"무슨 물건을 옮기고 있는 거야?\""
2601-71 = "현무상회에서 나누어 받은 각종 식자재랑……"
2601-72 = "현무상회에서 나누어 받은 각종 식자재랑……"
2601-73 = "슌 언니가 부탁한 <어른의 장난감>을 가져가는 길이었어요."
2601-74 = "[s] \"……어른의 장난감?\""
2601-76 = "……아앗! 루미 회장님이 다른 사람에게는 절대로 말하지 말라고 했었는데!"
2601-77 = "어, 어쩌죠. 어디선가 현룡문의 무서운 선배들이 나타나 저희를 잡아갈지도……."
2601-78 = "……아니, 선생님은 이미 어른이시니 <어른의 장난감>에 대해 들어도 괜찮으시겠죠?"
2601-79 = "[s] \"……그게 무슨 물건인데?\""
2601-80 = "저도 잘은 모르겠어요. 슌 언니가 현무상회에 특별 주문한 물건이라는 점 이외에는 아무것도 듣지 못했어요."
2601-81 = "봉투 밖으로 만져 보기에는 뭔가 길고 단단한 기구 같아 보이는데……."
2601-82 = "루미 회장님께서 이 <어른의 장난감>의 정체가 폭로된다면 산해경에 엄청난 일이 생길 거라며 비밀로 해달라고 하셨거든요."
2601-83 = "……선생님이 보시기에는 이 어른의 장난감이 무슨 물건처럼 보이시나요?"
2601-84 = "[s3] \"새로운 총이 아닐까?\"\n[s4] \"단순한 미용 도구가 아닐까?\""
2601-85 = "으음…… 그럴지도 모르겠네요."
2601-86 = "어린아이는 다루지 못할 만큼 복잡하고 강력한 위력을 가진 총이라면 루미 회장님이 그렇게 주의를 주셨던 것도 이해가 돼요."
2601-87 = "어쩌면 금지된 기술로 제작된 무시무시한 신무기일지도—"
2601-88 = "에이, 미용 도구라면 이렇게 꼭꼭 숨겨서 전달할 리가 없잖아요?"
2601-89 = "게다가 슌 언니가 피부 미용을 신경 쓰느라 이것저것 수상한 기구를 구입하는 건 저 이외의 다른 학생들도 다 알고 있는 사실이라고요."
2601-90 = "제 생각에는 어린아이는 다루지 못할 정도의 무시무시한 신무기나 폭탄이—"
2601-91 = "어라? 벌써 시간이 이렇게 되었네요."
2601-92 = "계속 늦장을 부리다가는 오후 간식 시간에 늦겠어요. 빨리 서둘러야……"
2601-95 = "선생님, <어른의 장난감>에 대한 건 비밀로 해주셔야 해요! 꼭이에요, 꼭!"
2601-101 = "매화원"
2601-103 = "언니, 나 왔어!"
2601-104 = "어머나, 엄청난 분량의 식자재네요. 가져오느라 수고 많았어요."
2601-105 = "응, 루미 회장님이 남는 식자재라며 이것저것 많이 얹어주셔서 말이야."
2601-106 = "양배추랑, 죽순이랑, 당근이랑, 납작 복숭아."
2601-107 = "그리고 언니가 따로 주문했다던 물건도—"
2601-108 = "네, 네에?!"
2601-114 = "루, 루미 회장님도 참…… 나중에 따로 받으러 간다고 말씀드렸는데!"
2601-115 = "흠흠…… 코코나 쨩. 혹시 안에 들어있는 물건을 본 건 아니겠지요?"
2601-116 = "응. 루미 회장님이 어린아이는 절대로 보면 안 되는 물건이라고 엄포를 놓으셔서……."
2601-117 = "그렇다면 다행이지만요."
2601-118 = "수고 많았어요, 코코나 쨩. 그럼 곧 오후 간식을 내올 테니 식자재 정리는 부탁드릴게요."
2601-122 = "코코나 쨩, 코코나 쨩. 현무상회에서 무얼 받아온 거야?"
2601-123 = "코코나 쨩이 아니라, 코코나 교관이라니까!"
2601-124 = "매화원의 음식 조리에 필요한 식자재를 받아왔어. 이걸로 금방 맛있는 간식을 만들어줄 테니까 얌전히 기다려."
2601-125 = "슌 언니가 가져간 봉투는? 뭔가 달각거리는 소리가 났는데, 그것도 음식이야?"
2601-126 = "아니, 그건 음식이 아닌 <어른의 장난감>이라고 할까……."
2601-127 = "장난감? 나도 보고 싶어! 어떤 장난감이야?"
2601-128 = "안 돼! 어른의 장난감이라고 했잖아! 어린아이가 봤다가는 큰일이 난다고!"
2601-129 = "……왜? 무섭게 생긴 장난감이야?"
2601-130 = "으, 응. 아주 무시무시한 모습의 장난감이거든! 막 뾰족뾰족한 가시도 돋아 있고, 생김새도 흉측하기 때문에 어린아이는 보자마자 울음을 터트릴 거야."
2601-131 = "무, 무서워……."
2601-132 = "……혹시나 해서 하는 말이지만, 이 사실은 절대 비밀이다? 다른 사람에게는 절대 말하면 안 돼!"
2601-133 = "응, 알겠어."
2601-134 = "그래, 그래. 착한 아이네."
2601-135 = "그럼 나는 슌 언니의 간식 준비를 도우러 갈 테니 여기서 조금만 더 기다려줘."
2601-140 = "아까 코코나 쨩이랑 슌 언니가 뭔가 엄청나게 큰 봉투를 들고 가던데…… 뭔지 봤어?"
2601-141 = "응, 코코나 쨩이 가져간 건 음식 재료고, 슌 언니가 가져간 건 <어른의 장난감>이래."
2601-142 = "어른의 장난감? 그게 뭐야?"
2601-143 = "(소근) 슌 언니가 현무상회에서 몰래 구입한 물건이라는데, 뾰족뾰족한 가시가 돋은 흉측한 모양의 장난감이래……."
2601-144 = "무, 무서워……."
2601-145 = "뭔데? 무서운 이야기를 하는 중이야?"
2601-146 = "(소근) 응. 이건 비밀인데, 슌 언니가……."
2601-148 = "이후, 슌이 수상한 장난감을 구입했다는 사실은 얼마 지나지 않아 매화원 원생들의 입을 통해 산해경 전역에 널리 퍼지게 되었다……."
