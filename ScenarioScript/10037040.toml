[translation]
10037040-1 = "제4화;세상을 유람하며 강을 바라보노라."
10037040-3 = "음, 음. 과연 키보토스에서도 정평이 난 음식 거리인 현무상회로군."
10037040-4 = "……이라고 말하고 싶지만."
10037040-11 = "자, 자! 전가복 추가입니다! 말린 해삼, 전복, 소라를 야채와 함께 끓여낸 요리죠!"
10037040-16 = "이거 너무 많은 거 아냐?! 벌써 몇 번째 코스인 거야?!"
10037040-17 = "[s1] \"느낌상 하는 말이지만…….\"\n[s2] \"이제 한 절반 정도 나왔을 걸……?\""
10037040-20 = "나 그렇게까지 많이는 못 먹는데?!"
10037040-21 = "……물론 못 먹는 게 아까울 정도로 맛있기는 하지만!"
10037040-26 = "자, 자. 그러지 말고, 더 많이 드시고 쑥쑥 자라셔야죠. 붉은겨울의 서기장님!"
10037040-27 = "아케시로 루미입니다. 현무상회의 회장을 맡고 있고, 그 이전에 주방장이기도 하죠."
10037040-28 = "회, 회장님?! 직접 나오셨군요?"
10037040-29 = "당연하지. 먼 곳에서 귀한 손님이 오셨는데, 내가 주방에만 머무를 수도 없지 않겠어?"
10037040-33 = "음? 산해경의 회장은…… 우리가 만나 왔던 키사키 문주가 아니었나?"
10037040-34 = "아, 뭐. 말하는 방식과 호칭의 문제지. 그건."
10037040-35 = "내 정식 호칭은 '상인회장'이지만, 그냥 줄여서 회장이라고 다들 불러 주는 것뿐이고."
10037040-36 = "산해경의 학생회인, 현룡문의 회장 역할을 맡고 있는 키사키…… 문주님의 호칭은, 기본적으로 '문주'이니까 둘은 혼동되진 않아."
10037040-37 = "……적어도 산해경 내부에서라면 말이지."
10037040-39 = "그런가……. 이해했다. 아니, 그렇지만……?"
10037040-40 = "(우리는 서기장님이라고도 회장님이라고도 다 부르잖아? 그건 어쩌면…….)"
10037040-41 = "(설마, 체리노 회장님이 학생회장, 미화부장, 서기장, 청소부장, 체육부장, 청소부장, 선도부장, 급식부장…… 같은 걸 전부 맡고 있어서였던 건가?!)"
10037040-42 = "다음으로 나올 요리는 오리를 사용한 날개 육류 요리입니다만……. 여기서 조금 고민이 되었단 말이죠."
10037040-43 = "오리의 조리 방법만 해도 수십 가지가 있겠지만, 가장 유명한 방법 두 가지를 고르라면."
10037040-44 = "갈색으로 구워 내는 방식과, 소금에 절여 향신료에 쪄내는 방식이 있습니다."
10037040-45 = "어느 쪽이 보다 귀한 손님들을 맞이하는 데에 어울릴지 고민하던 중."
10037040-49 = "그냥 이렇게! 둘 다 요리해서 가져와 봤습니다! 많이 드세요!"
10037040-50 = "흠, 배가 터지게 먹고도 남을 만큼 대접해야 진정한 대접이지. 산해경 식이로군!"
10037040-51 = "[s] \"어째 그럴 것 같더라!\""
10037040-52 = "하하하. 선생님도 많이 먹고 가라고. 현무상회를 방문한 손님이 충분히 배를 채우지 못한 채 돌아간다면, 그거야말로 우리 상회의 수치니까!"
10037040-58 = "콤라드~ 살려줘~"
10037040-59 = "[s] \"체리노.\""
10037040-63 = "으, 응?"
10037040-64 = "[s] \"서기장으로서, 위엄을 보일 시간이야!\""
10037040-65 = "……!"
10037040-66 = "그런가…… 어쩔 수 없는 것인가."
10037040-70 = "좋다. 어디 한번 와 보거라, 현무상회! 붉은겨울의 기상은, 이 정도로 꺾이지 않으니까!"
10037040-71 = "역시 통이 크시군요, 붉은겨울의 서기장님!"
10037040-73 = "(……결국 체리노는 나중에 울먹이며 소화제를 찾아야만 했다.)"
10037040-86 = "……."
10037040-87 = "저 사람들이, 이번 교류회의 붉은겨울 학생들……?"
10037040-88 = "그래 보이지?"
10037040-89 = "으음……."
10037040-91 = "산해경 훈육지원부 매화원에 오신 것을 환영합니다. 체리노 서기장님. 토모에 비서실장님. 마리나 위원장님."
10037040-92 = "저희 매화원은 산해경 학원의 어린 학생들을 훈육하기 위해 만들어진 훈육 기관으로."
10037040-93 = "산해경 학원에서 우수한 성적을 기록한 학생들은 교관으로 선발되어, 매화원에서 어린 학생들을 가르치게 되죠."
10037040-94 = "그렇다면 이 아이들은 매화원에서부터 고등학생이 될 때까지, 계속 산해경에서 배우게 되는 것이로군?"
10037040-95 = "그렇습니다. 물론 중간에 전학을 오는 경우도 있기는 하지만요."
10037040-99 = "그런가……. 그, 그보다! 잡아당기지 마라, 이 녀석들!"
10037040-104 = "와아~! 희고 붉은 색 옷이다! 신기해!"
10037040-105 = "이건 뭐야? 콧수염? 어…… 떨어지네? 나도 줘!"
10037040-110 = "아, 안 돼! 그 콧수염은…… 토모에!"
10037040-111 = "자, 자. 진정하세요. 체리노 쨔…… 체리노 서기장님. 얼른 예비 수염을……."
10037040-112 = "아니, 아니야……! 더 근본적인 대책이 필요해! 이 아이들이 수염을 또 가져가 버리면 결국 똑같아지잖아!"
10037040-117 = "너희들! 이분들은 먼 길을 오신 귀한 손님이라고! 얌전히 굴어야지!"
10037040-118 = "에이, 코코나 쨩. 또 재미없는 소리만 하고 있어……."
10037040-122 = "아! 콧수염 돌려줘, 코코나 쨩! 나도 해 보고 싶었는데!"
10037040-123 = "코코나 쨩이 아니라, 코코나 교관!"
10037040-128 = "여러분?"
10037040-132 = "혼나요?"
10037040-136 = "히, 히익?! 죄, 죄송해요. 슌 교관님!"
10037040-137 = "잘못했어요……. 말 잘 들을게요……."
10037040-138 = "정말이지 아이들이란…… 여기 있어요, 체리노 서기장님."
10037040-139 = "음……. 역시 슌 교관의 원생들을 다루는 솜씨는, 언제 보아도 감탄이 나오는군."
10037040-144 = "흠, 흠. 그런데 코코나 교관이라고 하였나?"
10037040-145 = "네, 그래요! 역시 제대로 불러 주시는군요!"
10037040-146 = "매화원에서는…… 애가 애를 돌보는 건가……?"
10037040-150 = "애, 애라뇨! 저는 어엿한 매화원의 교관이자 슌 언니의 동생이고, 그리고 또……!"
10037040-152 = "우후훗. 우리 코코나 쨩은 말이죠. 말씀하신 대로 원래대로라면 소학교에 다닐 나이지만……."
10037040-153 = "능력을 인정받아 고급중학교로 월반해서, 교관의 권한까지 받게 되었답니다 그야말로 제 자랑스러운 동생이죠."
10037040-155 = "슈, 슌 언니……? 부끄러우니까, 그만……."
10037040-156 = "[s] \"맞아! 코코나 교관 쨩은 매화원의 자랑이라고!\""
10037040-157 = "선생님까지 왜 그러세요! 거기에 코코나 교관 쨩이라는 건 또 뭔데요!"
10037040-164 = "어……? 지금 붉은겨울 학생들이 매화원에서 나왔어."
10037040-165 = "그래도 되는 거야? 매화원은 우리 산해경에서도 중요한 곳인데……."
10037040-166 = "그러게. 현룡문이라고 해도, 매화원 일에는 멋대로 간섭할 수 없을 정도잖아."
10037040-167 = "문주님은 도대체 무슨 생각이시지……?"
10037040-170 = "오오, 이곳은! 경극이 열렸던 곳이구나!"
10037040-171 = "백호 공원은 산해경에서도 특히 명물로 꼽히는 공원……."
10037040-172 = "큰 행사와 공연의 상당수는, 이곳에서 이루어진다고 보아도 좋을 정도지. 훗."
10037040-174 = "확실히 제법 넓은 공원으로 보이기는 하지만……."
10037040-179 = "우리 붉은겨울의 붉은 수염 혁명광장이 더욱 넓어 보이는데!"
10037040-180 = "……뭐라고?"
10037040-181 = "우리 산해경의 전통이 담긴 백호 공원을, 단순한 넓이와 크기 비교만으로 폄하할 생각인가!"
10037040-182 = "아니, 그렇지 않다. 산해경이 전통을 자랑하는 학원이라는 것은, 이번 교류회를 통해서 확실히 알았으니까."
10037040-183 = "단지! 혹한의 추위와 가도 가도 끝이 없는 설원을 이겨내야 하는, 우리 붉은겨울의 투지와 불굴의 정신에 다시 한번 감탄했을 뿐이다!"
10037040-184 = "……그렇게 춥고 넓은가? 붉은겨울 연방학원은?"
10037040-185 = "그렇게 춥고 넓지……. 조금만 방향을 잘못 들면 길을 잃기 일쑤고, 가끔은 곰을 만나기도 할 정도로……."
10037040-186 = "곰이라고? 우리도 판다는 있다만……."
10037040-187 = "판다는 귀엽잖나!"
10037040-188 = "아니, 생각해 보면 곰도 귀여운데……? 메드베지라던가……. 그리고 따져 보면 판다도 곰의 일종……?"
10037040-189 = "우우웃! 나를 혼란스럽게 할 작정이었나, 미나 집행부장!"
10037040-190 = "아니, 난 진짜 별말 안 했는데……?"
10037040-191 = "[s3] \"내가 보기엔, 마리나 나름대로.\"\n[s4] \"산해경을 인정하겠다는 말이었던 것 같아.\""
10037040-194 = "서, 선생?!"
10037040-195 = "그런 거였나…… 그렇다면 감사하지. 마리나 위원장."
10037040-196 = "으, 으음……! 뭐, 그런 것이다. 산해경도 제법이군! 하하하!"
10037040-197 = "훗. 알아주는 건가. 후후후……."
10037040-203 = "……묘하게 저 둘, 사이가 좋아 보이지 않아? 토모에?"
10037040-204 = "그러게요. 체리노 쨔……. 체리노 서기장님. 무슨 일일까요?"
10037040-205 = "[s] \"아니야. 저건 사이가 좋은 게 아니야.\""
10037040-206 = "그러면?"
10037040-207 = "[s] \"여러 가지 요인으로…… 죽이 잘 맞는 거야…….\""
10037040-208 = "그건 서로 통하는 게 있다는 소리지? 그건 좋은 거 아냐?"
10037040-209 = "맞다고? 그런데 콤라드의 표정은 뭔가 복잡해 보이는데?"
10037040-211 = "저는 어쩐지 알 것 같네요……. 그렇지요, 선생님?"
10037040-212 = "어찌 되었든 사이가 좋아졌다면 그것으로 되었다? 교류회이기도 하니까? 우후훗. 아무렴요. 그렇고말고요."
10037040-218 = "저기 봐. 또 붉은겨울 방문단이야."
10037040-219 = "미나 집행부장이 수행 중이네……. 잠깐만. 그러면 문주님은 누가 지키고?"
10037040-220 = "문주님께서는 현룡문에 남아 계실 테니, 호위 문제는 일단 없겠지?"
10037040-221 = "그걸 말하는 게 아니잖아. 문주님께서 미나 집행부장을 내어준다는 건, 그만큼의 대우를 해 준다는 뜻이라는 거 아냐."
10037040-222 = "뭐어, 일단은 산해경에 초대된 손님들이니까……?"
10037040-223 = "……그리고 여기 백호 공원에서 야외 경극 무대까지 성대하게 열어 주셨지……."
10037040-227 = "그게 맞는 거라고 생각해?"
10037040-228 = "저 붉은겨울 방문단은, 자기들이 어느 정도의 대접을 받고 있는지 알기나 할까……."
10037040-229 = "……전에는 샬레의 선생님이더니, 이번에는 외부 학원인가……."
10037040-230 = "이대로, 괜찮은 걸까?"
10037040-231 = "문주님께서 결정하시겠지……."
10037040-232 = "그러는 너도 목소리에 힘이 없잖아."
10037040-234 = "……불안한 건 모두 마찬가지니까."
10037040-238 = "응……."
