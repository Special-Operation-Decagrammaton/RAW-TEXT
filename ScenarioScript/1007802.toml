[translation]
1007802-1 = "키누가와 카스미"
1007802-2 = "(카스미가 알려준 장소를 찾아가니, 버려진 지 오래돼 보이는 폐건물이 나타났다.)"
1007802-6 = "……음? 누군가 온 건가?"
1007802-7 = "아아……! 그렇군! 선생님인가! 마침 타이밍도 좋구만, 확실히 파장이 잘 맞는다니까. 파장이."
1007802-8 = "선생님~!! 이쪽, 이쪽! 이쪽으로 와~!!"
1007802-9 = "[s1] \"카스미였구나. 지금 갈게.\"\n[s2] 소리가 난 쪽으로 이동한다."
1007802-17 = "아, 선생님!!"
1007802-18 = "이쪽이야, 이쪽!"
1007802-19 = "아니, 그쪽이 아니라 이쪽!!"
1007802-22 = "[wa:500]― [log=카스미]와~[wa:500]핫핫핫하![/log]"
1007802-24 = "[wa:200]― [log=카스미]딱 좋은 타이밍에 왔네![/log] [wa:200]"
1007802-27 = "― [log=카스미]잘 왔어, [wa:600]선생님~.[/log]"
1007802-29 = "― [log=카스미]여기가 나의 [wa:1050]86번째 [wa:700]비밀 아지트다.[/log]"
1007802-32 = "[wa:600]― [log=카스미]여기서 [wa:300]뭐 하냐고?[/log] [wa:150]"
1007802-35 = "― [log=카스미]우문이네, 선생님.[/log]"
1007802-37 = "― [log=카스미]내가 하는 일이라면 [wa:1100]단 하나.[/log]"
1007802-40 = "― [log=카스미]바로…….[/log]"
1007802-42 = "[wa:700]― [log=카스미]새로운 [wa:400]온천 포인트를 찾고 있다~ 이 말이야![/log]"
1007802-45 = "[ns3] \"온천 포인트라고?\"\n[ns4] \"그 말인즉슨…….\""
1007802-46 = "[wa:300]― [log=카스미]하핫, [wa:700]선생님.[/log]"
1007802-47 = "[wa:300]― [log=카스미]하핫, [wa:700]선생님.[/log]"
1007802-49 = "― [log=카스미]대화가 통해서 [wa:600]좋구만.[/log][wa:50]"
1007802-52 = "[wa:100]― [log=카스미]아아, [wa:400]맞아.[/log]"
1007802-54 = "― [log=카스미]실제로 폭파시킬 곳 주변을 좀 [wa:1000]맞춰보고 있었다는 거지.[/log]"
1007802-57 = "[wa:1100]― [log=카스미]흠……. [wa:1100]여기가 좋을까?[/log]"
1007802-59 = "― [log=카스미]아니…… [wa:800]이쪽도 그럭저럭…….[/log]"
1007802-62 = "[wa:1400]― [log=카스미]뭐야, [wa:400]선생님? [wa:1000]왜 그런 눈으로 날 보는 거지?[/log]"
1007802-64 = "― [log=카스미]무슨 문제라도 [wa:760]있나?[/log]"
1007802-67 = "이왕이면 선생님의 의견도 듣고 싶어서 부른 건데 말이야."
1007802-68 = "발파할 장소를 고르는 건……. 늘 새롭고 짜릿한 일이지만, 가끔은 다른 사람의 말도 좀 들어보고 싶어서 말이지!"
1007802-69 = "물론 아무 사람의 말이라고 다 들어주는 건 아니라고? 선생님이니까! 다른 누구도 아닌 선생님의 말이니까 말이야."
1007802-70 = "……응?"
1007802-71 = "애초에 왜 이런 곳에 있는 거냐고? 왜 '이번 달의 86번째 아지트'냐고?"
1007802-72 = "와핫핫! 당연한 걸 물어보네, 선생님은! 그야 당연히 내가 쫓기는 입장이니까 그렇지."
1007802-73 = "이래 봬도 게헨나의 수배령을 받고 있는 몸이라고. 아무 데에서나 막 움직일 순 없잖아?"
1007802-74 = "게다가 발파 계획을 수립하는 건……. 꽤나 고도의 집중력을 필요로 하는 일이라서 말이지."
1007802-75 = "이런 때에는 너무 왁자지껄하지 않은 곳에서 준비하는 편이거든."
1007802-76 = "아무튼 사소한 이야기는 그만! 중요한 건 발파 계획이야, 발파 계획!"
1007802-77 = "그럼 지금부터 내가 발가락으로 잘 짚어 볼 테니까 의견을 제시해 줘. 알겠지?"
1007802-78 = "자……. 음……. 어디 보자아~."
1007802-79 = "여기! 여긴 어때? 백화점 밑인데!"
1007802-80 = "뭐? 조금 별로인 것 같다고? 그런가……? 흠……. 그럴지도."
1007802-81 = "그럼 여기는 어때? 지하철 환승역이야! 이미 반쯤 파여 있는 거나 다름없으니, 더 깊고 화끈하게 파 내려갈 수 있겠네!"
1007802-82 = "응? 좀 더 신선한 데를 찾아보자고? 흠……. 그럴까?"
1007802-83 = "그러면~. 흐으음……."
1007802-84 = "으으으으음~~!!!!!"
1007802-86 = "(이후로도 카스미는 계속해서 인구밀집지역이나 교통량이 많은 지역만을 골라 제안했다.)"
1007802-87 = "(어떻게든 인적이 없는 곳으로 유도하려 했지만, 좀처럼 잘되지 않았다…….)"
1007802-89 = "으음……!"
1007802-90 = "선생님도 정말이지 신중한 타입이구만. 하나부터 열까지 다 안 되는 이유를 대다니."
1007802-91 = "하지만 더 이상은 안 되겠어. 이젠 나도 어쩔 수 없다!"
1007802-92 = "이번에 찍을 곳은 이번 발파 작업 후보지 중 마지막 장소야."
1007802-93 = "자! 여기로 가도록 하지. 선생님이 반대해도 어쩔 수 없어! 더는 후보지가 없다고!"
1007802-94 = "바로……."
1007802-95 = "[s5] \"바, 바로……?\"\n[s6] 꿀꺽 침을 삼킨다."
1007802-98 = "……여기!!"
1007802-102 = "[ns7] \"여긴……. 빈 산골짜기……?\"\n[ns8] \"오……. 여기라면 그래도…….\""
1007802-105 = "와핫핫핫!! 뭐야, 그 표정! 꽤나 안도하는 얼굴이네!"
1007802-106 = "뭐, 최소한 지금까지 보다는 긍정적인 반응이군."
1007802-107 = "자……! 어때? 선생님. 여기라면 괜찮겠지? 설마 이번에도 반대할 생각은 아니겠지?"
1007802-108 = "[s9] \"여기라면 괜찮은 것 같아.\"\n[s10] 고개를 끄덕인다."
1007802-111 = "좋아, 좋아! 마지막의 마지막까지 갔지만, 그래도 의견이 일치했네!"
1007802-112 = "그럼 찬성인 걸로 알고! 결과는 나중에 따로 알려줄 테니까 말이야."
1007802-113 = "음음……! 다시 생각해도 훌륭해. 만족스러웠어!"
1007802-114 = "오늘 회의, 고마웠다고! 다음에 또 봐, 선생님!!"
1007802-125 = "내 정신 좀 봐. 장비들을 그냥 놔두고 갈 뻔했네."
1007802-126 = "……그럼"
1007802-127 = "진짜로 이만!!"
1007802-133 = "(……그렇게 떠난 카스미의 빈자리를 보며, 일단 안도의 한숨을 내쉬었다.)"
