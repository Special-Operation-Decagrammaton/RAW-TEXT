[translation]
80000127-1 = "걸 앤 스낵"
80000127-4 = "히카리- 샬레에 정차 완료-"
80000127-5 = "[s] \"음? 오늘 히카리가 당번이었던가?\""
80000127-6 = "당번-? 아닌데-?"
80000127-7 = "오늘은- 좋아하는 사람에게 과자를 주는 날이야-"
80000127-8 = "그래서 선생님 생각났어-"
80000127-9 = "[s] \"이렇게 기특할 데가…….\""
80000127-14 = "자- 이거-"
80000127-15 = "초- 신상- 플레이밍 컴포지션 C형 초코볼-"
80000127-16 = "장난 아니지- 완전 궁금했는데 운 좋게 구함-"
80000127-17 = "이 기세라면 히카리 오늘 완전 무적일지도-?"
80000127-18 = "아무튼, 선생님 먹어- 선물-"
80000127-22 = "[ns1] \"멋진데, 히카리……! 고마워!\"\n[ns2] (히카리가 준 초코볼을 받아들었다.)"
80000127-31 = "[ns] \"…….\""
80000127-33 = "[ns3] \"이건 혼자 먹기에는 너무 아깝네.\"\n[ns4] \"누구랑 같이 먹으면 정말 좋겠는걸?\""
80000127-37 = "[ns] \"히카리가 선생님을 좀 도와줄래?\""
80000127-38 = "으, 응-?"
80000127-43 = "응-!!"
80000127-45 = "(히카리와 함께 신상 초콜릿을 나눠 먹었다.)"
80000127-46 = "(엄청나게 신맛에 표정이 찌그러지자, 히카리는 아주 즐거워했다…….)"
