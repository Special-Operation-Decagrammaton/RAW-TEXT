[translation]
2000703-1 = "버추얼 싱어의 고민"
2000703-5 = "라이브 하우스 내 대기실"
2000703-7 = "(약속한 시각에 라이브 하우스 뒤편의 대기실로 찾아가니, 미쿠가 누군가와 이야기를 나누고 있었다.)"
2000703-11 = "뭐?! 노래를 부를 수 없게 되었다고?"
2000703-12 = "네, 이유는 모르겠지만 갑자기……."
2000703-13 = "그런 이야기는 듣지 못했는데…… 이게 어떻게 된 일이야?"
2000703-14 = "새로운 신체를 갖게 된 뒤로 노래를 부르려고 하면 어째서인지 목소리가 나오지 않아서요."
2000703-15 = "으으. 기술자 녀석들, 미쿠의 몸에 고장은 절대로 없을 거라고 호언장담했으면서……."
2000703-16 = "노래를 부르지 못하는 버추얼 싱어의 공연이라니, 이건 진짜 위험한 상황이라고."
2000703-17 = "저, 혹시 지금이라도 공연을 취소하는 방법은……."
2000703-18 = "그건 곤란해! 그랬다가는 어마어마한 비용의 위약금을 내게 될 거야."
2000703-19 = "이미 시작된 광고는 둘째치더라도, 라이브 하우스의 대관비부터 새로운 신체를 만드는 데 들어간 기술 비용까지……"
2000703-20 = "공연이 취소되면 이 비용을 고스란히 우리가 떠안아야 한다고......."
2000703-21 = "그러니까 공연을 취소할 수는 없어. 미쿠도 노래를 다시 부를 수 있는 방법을 여러모로 찾아봐 줘!"
2000703-22 = "네……."
2000703-27 = "휴우……."
2000703-28 = "[s] \"뭔가 곤란한 상황인 것 같네.\""
2000703-30 = "아, 선생님. 오셨군요."
2000703-31 = "타이밍이 나빠 부끄러운 모습을 보여드렸네요."
2000703-32 = "[s] \"저 사람이 공연의 기획자야?\""
2000703-33 = "네. 이번 라이브 공연을 책임지는 높으신 분이세요."
2000703-34 = "방법을 찾을 때까지 노래를 부를 수 없게 되었다는 사실을 어떻게든 숨겨보려고 했는데……"
2000703-35 = "결국 들키고 말았네요."
2000703-36 = "그래서 혹시 지금이라도 공연을 취소할 방법은 없을지 여쭈어보았는데, 그건 스케쥴 상 곤란하다고 하셔서요."
2000703-37 = "[s] \"어른에게는 여러 가지 사정이 있으니까.\""
2000703-38 = "그건 그렇지요. 결국은 제 책임이니까요."
2000703-39 = "게다가 지금 공연을 취소하면 제 노래를 듣기 위해 기다려 주신 팬 여러분께 실례를 하는 셈이니, 역시 공연은 취소할 수 없어요."
2000703-40 = "[s1] \"너무 걱정하지 마.\"\n[s2] \"곧 노래를 다시 부를 수 있을 거야.\""
2000703-41 = "응원해주셔서 감사합니다."
2000703-42 = "응원해주셔서 감사합니다."
2000703-43 = "그나저나 선생님. 제 목소리를 되찾을 방법은 어떻게 찾아보셨나요?"
2000703-44 = "[s] \"일단 여러 가지를 가져와 봤어.\""
2000703-51 = "이건…… 대파?"
2000703-52 = "감기나 병으로 목이 잠겼을 때, 목에 대파를 두르면 목소리를 회복하는 데 도움이 된다고요?"
2000703-53 = "저도 그런 말을 들어본 적이 있기는 하지만……"
2000703-54 = "버추얼 싱어인 제게도 이런 민간요법이 통할까요?"
2000703-55 = "[s] \"우선은 직접 시도해보자.\""
2000703-59 = "네. 지금은 찬물과 더운물을 가릴 때가 아니니까요."
2000703-66 = "으음, 대파를 두르니 뭔가 목이 따끈따끈해지는 느낌이 들기는 하네요."
2000703-67 = "어쩌면 정말로 효험이 있을지도……"
2000703-68 = "그럼 하츠네 미쿠, 노래하겠습니다!"
2000703-74 = "……안 되네요."
2000703-75 = "역시 버추얼 싱어인 제게 대파의 효능은 들지 않는 걸까요? 파는 싫어하지 않지만요."
2000703-76 = "[s3] \"아직 실망하기는 일러.\"\n[s4] \"이번에는 이거야!\""
2000703-85 = "이건…… 에너지 드링크?"
2000703-86 = "캔의 겉면에 뭔가 신기한 외형의 새가 그려져 있네요……."
2000703-87 = "[s5] \"일부 학생들에게 인기가 있는 에너지 드링크야.\"\n[s6] \"페로로 님과 같은 날개의 힘을 얻을 수 있다고 하던데.\""
2000703-88 = "으음. 선생님을 믿겠다고는 했지만, 뭔가 디자인이 수상한데요."
2000703-89 = "으음. 선생님을 믿겠다고는 했지만, 뭔가 디자인이 수상한데요."
2000703-90 = "……이걸 마시면 어쩐지 목이 더 안 좋아질 것 같은 기분이 들어요."
2000703-91 = "하지만 어쩌면 이 음료로 정말 목소리를 고칠 수 있을지도 모르니……."
2000703-95 = "하츠네 미쿠, 도전하겠습니다!"
2000703-98 = "(……이후 선생님이 준비해 온 여러가지 민간요법을 시도해보았지만, 미쿠는 끝내 노래를 부르지 못했다.)"
2000703-100 = "……역시 이것도 꽝이네요."
2000703-101 = "[s] \"설마 비장의 민트 초코도 효과가 없었다니…….\""
2000703-102 = "아니, 그건 목의 상태와는 상관없는 평범한 아이스크림이었잖아요?"
2000703-103 = "마지막에는 스위츠를 여러 가지 늘어놓고 맛을 보느라 어쩐지 다과회처럼 되어버렸고……."
2000703-104 = "그래도 오랜만에 기분전환은 된 것 같아요."
2000703-105 = "최근에는 공연에 대한 걱정으로 머리가 가득 차 다른 생각을 할 틈이 조금도 없었거든요."
2000703-106 = "이렇게 장난 같은 일을 즐기며 생각 없이 시간을 보낸 게 얼마 만인지……."
2000703-107 = "[s] \"미안. 장난을 치려던 건 아니었는데…….\""
2000703-108 = "서, 선생님의 노력을 깎아내리려던 건 아니었어요!"
2000703-109 = "다만 노래를 전달하기 위해 태어난 제가, 노래를 부르는 것 이외의 일로도 웃을 수 있다는 사실이 새삼스러워서요."
2000703-110 = "이것이 즐겁다는 감정……."
2000703-111 = "[s] \"미쿠가 즐거웠다면 그걸로 충분해.\""
2000703-112 = "……그런가요."
2000703-113 = "오늘도 도와주셔서 감사합니다, 선생님."
2000703-119 = "빨리 제 목소리가 돌아왔으면 좋겠네요."
