2006003-13 = "[s] \"아뇨, 오늘만큼은 제가 학생이죠!\""
2006003-14 = "3;이부키 수영복;15;헤헤, 그렇다면 이부키, 최선을 다해 가르칠게!\n#3;em;[음표]"
2006003-15 = "3;이부키 수영복;00;그러니까, 오늘 이부키 선생님이 가르칠 것은……!"
