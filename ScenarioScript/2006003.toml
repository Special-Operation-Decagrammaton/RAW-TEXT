2006003-32 = "3;이부키 수영복;00;그러면 이 바위 아래에 붙어 있는 이 아이들은 무엇일까요?\n#3;em;[?]"
2006003-33 = "[s] \"응? 자색따개비 아니야?\""
2006003-34 = "3;이부키 수영복;15;땡! 엄청나게 닮았지만, 완전히 다른 종이야!\n#3;em;[!]\n#3;jump"
2006003-35 = "3;이부키 수영복;00;이 아이들의 이름은 피라미드조개! 자색따개비와 모양도 습성도 비슷하지만, 완전히 다른 생물이야!\n#3;jump\n#3;m2"
2006003-36 = "3;이부키 수영복;03;차이점은 껍데기의 모양! 둥그스름한 자색따개비의 껍데기와 달리 피라미드조개의 껍데기는 네 개의 뾰족한 귀퉁이를 가지고 있어!\n#3;em;[재잘]\n#3;m3"
