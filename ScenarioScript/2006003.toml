[translation]
2006003-1 = "เรียนกับอิบูกิ!"
2006003-2 = "แนวโขดหินริมทะเล"
2006003-5 = "(คุณครูมายังแนวโขดหินที่อิบูกิบอกไว้)"
2006003-6 = "อ๊ะ คุณครูมาแล้ว!"
2006003-7 = ""
2006003-10 = ""
2006003-11 = "[s] \"สวัสดี คุณครูอิบูกิ!\""
2006003-12 = "ฮิฮิ วันนี้มีคุณครูตั้งสองคนเลย!"
2006003-13 = "[s] \"ไม่ใช่สิ วันนี้ครูเป็นนักเรียนต่างหาก!\""
2006003-14 = "ฮิฮิ ถ้างั้นอิบูกิจะตั้งใจสอนให้เต็มที่เลย!"
2006003-15 = "เอาละ วันนี้คุณครูอิบูกิจะสอนเรื่อง...!"
2006003-16 = "สิ่งมีชีวิตในทะเลค่ะ!"
2006003-17 = "[s] \"สิ่งมีชีวิตในทะเลเหรอ?\""
2006003-18 = "อื้อ! ก่อนมาทะเล อิบูกิอ่านหนังสือเกี่ยวกับสิ่งมีชีวิตในทะเลมาด้วย!"
2006003-19 = "ปลา วาฬ แมงกะพรุน ปลาดาว ปูม้า หอย..."
2006003-20 = "แล้ววันนี้! เราจะไปพบเพื่อนๆ ที่อาศัยอยู่ตามโขดหินริมทะเลกันค่ะ!"
2006003-21 = "ถ้างั้น คุณครู! ขึ้นไปบนโขดหินกันเถอะ!"
2006003-23 = "(แล้วคุณครูก็ตามอิบูกิขึ้นไปบนโขดหินริมทะเล)"
2006003-24 = ""
2006003-25 = "เอาละ! ก่อนอื่นเราจะมาดูเพรียงสีม่วงที่เกาะอยู่บนหินกันค่ะ!"
2006003-26 = "ตอนยังเล็ก เพรียงพวกนี้จะล่องลอยอยู่ในทะเล พอโตเต็มที่ก็จะเกาะอยู่บนหินไปตลอดชีวิตเลยละ!"
2006003-27 = "ส่วนอาหารของพวกมันก็คือ... อ๊ะ?"
2006003-28 = "คุณครู! คุณปูหนามกำลังเดินอยู่บนหินตรงโน้นละ!"
2006003-29 = "ว่ากันว่าพอเจ้าตัวนี้ตกใจ หนามที่ซ่อนไว้ก็จะพองออกมาเต็มเลยละ!"
2006003-30 = "ดูสิ! คงตกใจที่เห็นคุณครูแน่เลย! หนามพองออกมาแล้ว!"
2006003-31 = "[s] \"จริงด้วย...!\""
2006003-32 = "ถ้างั้น เจ้าพวกนี้ที่เกาะอยู่ใต้หินคืออะไรเอ่ย?"
2006003-33 = "[s] \"หืม? ไม่ใช่เพรียงสีม่วงเหรอ?\""
2006003-34 = "ผิดแล้ว! ถึงจะหน้าตาเหมือนกันมาก แต่เป็นคนละสายพันธุ์กันเลยนะ!"
2006003-35 = "เจ้าพวกนี้คือหอยฝาเดียวรูปพีระมิด! ทั้งรูปร่างทั้งพฤติกรรมคล้ายเพรียงสีม่วง แต่เป็นสิ่งมีชีวิตคนละชนิดกันเลย!"
2006003-36 = "จุดที่ต่างกันคือรูปร่างของเปลือก! เปลือกเพรียงสีม่วงจะกลมๆ แต่เปลือกหอยฝาเดียวรูปพีระมิด#nมีมุมแหลมอยู่สี่มุม!"
2006003-39 = "(หลังจากฟังบทเรียนเรื่องสิ่งมีชีวิตที่อาศัยอยู่บนผิวหินจนจบ)"
2006003-40 = "(ทั้งสองก็ลงไปยังแอ่งน้ำตามซอกหิน)"
2006003-41 = ""
2006003-42 = "คุณครู ดูในน้ำสิ! มีเจ้าตัวที่ไม่เห็นบนโขดหินด้วยละ!"
2006003-43 = "ดอกไม้ทะเล ปลาดาว กุ้ง..."
2006003-44 = "แถมน้ำยังใสแจ๋วเลย!"
2006003-45 = "[s] \"จริงด้วยนะ มองเห็นเท้าในน้ำชัดเลย\""
2006003-46 = "อิบูกิเพิ่งเคยเห็นน้ำทะเลสะอาดแล้วก็ใสขนาดนี้เป็นครั้งแรกเลย!"
2006003-47 = "แล้วก็... อะฮะฮ่า!"
2006003-48 = "ปลามาตอดเท้าจนจั๊กจี้เลย!"
2006003-49 = "เด็กพวกนี้คือปลาจิ้มฟันจระเข้... หืม?"
2006003-50 = "คุณครู! ดูตรงนั้นสิ!"
2006003-51 = "[s] \"หืม? ลูกโป่งเหรอ?\""
2006003-52 = ""
2006003-53 = "(ไม่ไกลนัก มีอะไรบางอย่างคล้ายลูกโป่งสีฟ้าลอยอยู่บนผิวน้ำ)"
2006003-54 = "[s] \"ลูกโป่งพวกนั้น... คืออะไรเหรอ คุณครู?\""
2006003-55 = "ฮิฮิ! เป็นคำถามที่ดีเลยค่ะ!"
2006003-56 = "พวกนั้นชื่อแมงกะพรุนหัวขวด..."
2006003-57 = "เป็นคุณแมงกะพรุนจอมขี้เกียจที่ลอยตุ๊บป่องอยู่บนผิวน้ำ แล้วเคลื่อนที่ไปตามคลื่นอย่างเดียวเลย!"
2006003-58 = "ที่หนวดมีพิษอันตรายมาก~ เลย ถ้าโดนต่อยต้องไปโรงพยาบาลทันที..."
2006003-59 = ""
2006003-62 = ""
2006003-63 = "[ns1] \"เอ่อ ว่าแต่ กระแสน้ำมัน...\"\n[ns2] \"เหมือนว่า... กระแสน้ำกำลังพัดมาทางเราเลยมั้ย...?\""
2006003-66 = "แงงง คะ... คุณครู...!"
2006003-67 = ""
2006003-69 = ""
2006003-70 = ""
2006003-71 = "[ns] \"อิบูกิ?!\""
2006003-73 = "(คุณครูแบกอิบูกิที่ตกใจจนถอยหลังแล้วล้มลงในน้ำขึ้นหลัง จากนั้นจึงออกมาจากบริเวณโขดหิน)"
2006003-74 = "(ดูเหมือนอิบูกิจะกลัวมาก แม้กลับมาถึงหาดทรายแล้ว อิบูกิก็ยังเกาะคุณครูไม่ยอมปล่อยอีกพักใหญ่...)"
