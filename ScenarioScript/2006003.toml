[translation]
2006003-1 = "イブキと授業！"
2006003-2 = "海岸の岩場"
2006003-5 = "（イブキに言われた場所へ向かった）"
2006003-6 = "あ、先生！"
2006003-11 = "[s] \"こんにちは！イブキ先生！\""
2006003-12 = "えへへっ！今日は先生が二人だね！"
2006003-13 = "[s] \"いや、今日の私は生徒だよ。\""
2006003-14 = "そうだった！じゃあイブキ、頑張って先生するね！"
2006003-15 = "今日は、イブキ先生と一緒に～"
2006003-16 = "海のいきものを覚えていきましょう～！"
2006003-17 = "[s] \"海の生き物？\""
2006003-18 = "うん！海に来る前にね、本を読んだの！"
2006003-19 = "お魚さん、クジラさん、クラゲさん、ヒトデさん、カニさん、貝さん……。"
2006003-20 = "というわけで！今からこの辺りの岩に住んでいるお友達に会いに行きます！"
2006003-21 = "先生！岩に登って～！"
2006003-23 = "（イブキのうしろについて、海岸の岩の上に登った）"
2006003-25 = "まずは、紫フジツボから！"
2006003-26 = "この子たちはね、生まれたばっかの時は海を漂いながら暮らして……#n大きくなったら岩にくっついて過ごすんだって！"
2006003-27 = "それで、ご飯は……あれ？"
2006003-28 = "先生！あっちにトゲカニさんが歩いてる！"
2006003-29 = "びっくりした時に、トゲを膨らませるんだよ！"
2006003-30 = "ほら！びっくりしたみたい！トゲが出てきた～"
2006003-31 = "[s] \"本当だ！\""
2006003-32 = "ここで問題！岩の下にいるこの子たちは、なんていうでしょ～？"
2006003-33 = "[s] \"さっきの紫フジツボじゃないの？\""
2006003-34 = "ぶっぶー！すごく似ているけど、全然違う種類なんだ！"
2006003-35 = "ピラミッド貝さんっていうの！紫フジツボに似てるけど、ぜんぜん別の生き物！"
2006003-36 = "違いはね～カラの形！#n紫フジツボのカラは丸いけど、ピラミッド貝のカラは角が尖ってるんだ、見えるかな？"
2006003-39 = "（そうして、岩の表面に暮らす生き物たちの話を聞いた後――）"
2006003-40 = "（二人で岩の下に降りた）"
2006003-42 = "先生！こっちには違う子たちがいるよ！"
2006003-43 = "イソギンチャクさんにヒトデさん、エビさん……。"
2006003-44 = "わ～！ハッキリ見えるよ！"
2006003-45 = "[s] \"海底がきれいに見えるね！\""
2006003-46 = "イブキ、こんなにきれいな海はじめて見た！"
2006003-47 = "あと……あははっ！"
2006003-48 = "くすぐったいよ～！お魚さん、ダメ～！"
2006003-49 = "この子たちはヨウジウオ、って言うんだけど――あれ？"
2006003-50 = "先生！見て！"
2006003-51 = "[s] \"……風船が浮かんでる？\""
2006003-53 = "（少し離れた水面に、青い風船のようなものが浮いていた）"
2006003-54 = "[s] \"あれは……なんですか？イブキ先生。\""
2006003-55 = "えっへん！良い質問ですね！"
2006003-56 = "あの子たちはアオクラゲっていって――"
2006003-57 = "水面をふよふよ漂うクラゲだよ！"
2006003-58 = "触手にはすご～く痛い毒がついてて、刺されちゃったら病院に……"
2006003-63 = "[ns1] \"なんか……。\"\n[ns2] \"こっちに近づいてない……？\""
2006003-66 = "ふえええ、せ、先生……！"
2006003-71 = "[ns] \"イブキ！？\""
2006003-73 = "（後ずさりして転んでしまったイブキをおぶって、岩場を離れた）"
2006003-74 = "（……怖かったのか、砂浜に戻ってもイブキはしばらくしがみついていた）"
