[translation]
2006003-1 = "和伊吹一起上課！"
2006003-2 = "海邊岩岸區"
2006003-5 = "（前往伊吹說的岩岸區）"
2006003-6 = "啊，是老師！"
2006003-7 = ""
2006003-10 = ""
2006003-11 = "[s] 「您好，伊吹老師！」"
2006003-12 = "耶嘿嘿，今天有兩個老師耶！"
2006003-13 = "[s] 「不，今天我才是學生！」"
2006003-14 = "耶嘿嘿，那伊吹會盡全力教你的！"
2006003-15 = "那麼，今天伊吹老師要教的是……！"
2006003-16 = "登登～！海洋生物課！"
2006003-17 = "[s] 「海洋生物？」"
2006003-18 = "嗯！來海邊之前，伊吹讀了關於海洋生物的書！"
2006003-19 = "魚、鯨魚、水母、海星、螃蟹、貝殼……"
2006003-20 = "而今天呢！我們要去見見住在海岸岩石上的朋友們！"
2006003-21 = "那麼老師！我們爬到岩石上吧！"
2006003-23 = "（就這樣跟著伊吹爬上了海岸的岩石）"
2006003-24 = ""
2006003-25 = "來！首先來看看附著在岩石上的紫藤壺！"
2006003-26 = "這些孩子們小時候會在海裡漂來漂去，長大後就會附著在岩石上過一輩子哦！"
2006003-27 = "然後牠們吃的東西是……咦？"
2006003-28 = "老師！那邊的岩石上有棘蟹先生在走路！"
2006003-29 = "這孩子被嚇到時，會把藏起來的刺鼓得脹脹的哦！"
2006003-30 = "你看！牠好像被老師嚇了一跳！刺都跑出來了！"
2006003-31 = "[s] 「真的耶……！」"
2006003-32 = "那麼，附著在這塊岩石下面的這些孩子們是什麼呢？"
2006003-33 = "[s] 「嗯？不是紫藤壺嗎？」"
2006003-34 = "叮咚，錯了！雖然長得超級像，但是完全不同的種類哦！"
2006003-35 = "這些孩子們的名字是金字塔貝！#n外型和習性都跟紫藤壺很像，卻是完全不同的生物哦！"
2006003-36 = "差別在於殼的形狀！#n紫藤壺的殼圓圓的，金字塔貝的殼卻有四個尖尖的角！"
2006003-39 = "（就這樣聽完岩石表面生物的課程後）"
2006003-40 = "（往下走到岩縫間的水窪）"
2006003-41 = ""
2006003-42 = "老師，你看水裡！有在岩石上看不到的孩子們！"
2006003-43 = "海葵、海星、蝦子……"
2006003-44 = "而且水也超級清澈！"
2006003-45 = "[s] 「真的耶，水裡的腳都看得一清二楚。」"
2006003-46 = "伊吹還是第一次看到這麼乾淨清澈的海水！"
2006003-47 = "還有……啊哈哈！"
2006003-48 = "魚兒們在搔伊吹的腳！"
2006003-49 = "這些孩子們是尖嘴魚……嗯？"
2006003-50 = "老師！你看那個！"
2006003-51 = "[s] 「嗯？氣球？」"
2006003-52 = ""
2006003-53 = "（不遠處有一些像藍色氣球的東西漂浮在水面上）"
2006003-54 = "[s] 「那些氣球……是什麼呢，老師？」"
2006003-55 = "哼哼！問得好！"
2006003-56 = "那些孩子們的名字是藍色氣球水母……"
2006003-57 = "是只會浮在水面上，隨著海浪漂動的懶惰鬼水母先生哦！"
2006003-58 = "觸手上有超～可怕的毒，被螫到的話就要馬上去醫院……"
2006003-59 = ""
2006003-62 = ""
2006003-63 = "[ns1] 「那個，話說……」\n[ns2] 「總覺得……水流好像正往我們這邊推過來……？」"
2006003-66 = "嗚哇哇，老，老師……！"
2006003-67 = ""
2006003-69 = ""
2006003-70 = ""
2006003-71 = "[ns] 「伊吹！？」"
2006003-73 = "（背起慌張後退時跌進水裡的伊吹，離開了岩石區）"
2006003-74 = "（……大概是嚇壞了，回到沙灘後，伊吹還是緊緊抓著不放好一陣子）"
