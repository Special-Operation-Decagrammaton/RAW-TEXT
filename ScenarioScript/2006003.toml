[translation]
2006003-1 = "Lessons with Ibuki!"
2006003-2 = "Rocky Coast Area"
2006003-5 = "I went to the rocky area Ibuki told me about."
2006003-6 = "Oh, it's Sensei!"
2006003-7 = ""
2006003-10 = ""
2006003-11 = "[s] \"Hello, Ibuki Sensei!\""
2006003-12 = "Heehee, we have two Sensei today!"
2006003-13 = "[s] \"Nope! Today, I'm just going to be your student!\""
2006003-14 = "Heehee! In that case, Ibuki will try hard to teach you!"
2006003-15 = "So, what Ms. Ibuki Sensei will teach you today is..."
2006003-16 = "...Marine Biology!"
2006003-17 = "[s] \"Marine Biology?\""
2006003-18 = "Yes! Ibuki prepped by reading books about sea creatures!"
2006003-19 = "Fish, whales, jellyfish, starfish, crabs, clams..."
2006003-20 = "And today! We're going to personally meet the friends who live on the coastal rocks! It's their habitat!"
2006003-21 = "Then, Sensei! Let's climb to the top of the rocks!"
2006003-23 = "I followed Ibuki and we hiked to the top of the rocks."
2006003-24 = ""
2006003-25 = "Now! Let's check out the purple barnacles first! "
2006003-26 = "They drift through the ocean when they're young, but once they're fully grown, they attach to a rock and live there forever!"
2006003-27 = "And they feed on... Huh?"
2006003-28 = "Sensei! Mr. Spiny Crab's on that rock over there!"
2006003-29 = "This one puffs up his hidden spines when he gets startled, so he looks big and scary."
2006003-30 = "Look! He must've gotten surprised when he saw you, Sensei! His spines are out!"
2006003-31 = "[s] \"You're right...!\""
2006003-32 = "Then can you guess what the creatures under this rock are called?"
2006003-33 = "[s] \"Hm? They're not just...'purple barnacles'?\""
2006003-34 = "Wrong! They're very similar, but a completely different species!"
2006003-35 = "These are called Pyramid Shells! They look and behave similarly to purple barnacles, but they're sooo different."
2006003-36 = "You can see it in the shape of their shells! Unlike the round shells of purple barnacles, Pyramid Shells have four pointy edges! Count 'em!"
2006003-39 = "After an enlightening lecture about the creatures living on the rock's surface..."
2006003-40 = "We descended into a tide pool in the rock's crevice."
2006003-41 = ""
2006003-42 = "Sensei, look under the water! There are so many new things!"
2006003-43 = "Anemones, starfish, shrimp..."
2006003-44 = "The water is so clear too!"
2006003-45 = "[s] \"Yeah, I can see my feet super clearly.\""
2006003-46 = "Ibuki's never seen seawater this clean before!"
2006003-47 = "And... Ahaha!"
2006003-48 = "The fish are tickling Ibuki's feet!"
2006003-49 = "These are called pipefish and they... Huh?"
2006003-50 = "Sensei! Look!"
2006003-51 = "[s] \"Hm? Bags?\""
2006003-52 = ""
2006003-53 = "I spotted blue balloon-looking things floating on the water nearby."
2006003-54 = "[s] \"What are those balloons, Ibuki Sensei?\""
2006003-55 = "Heehee! Good question!"
2006003-56 = "They are called the blue balloon jellyfish..."
2006003-57 = "They're lazy jellyfish that drift along and only move where the waves take them!"
2006003-58 = "They store suuuuper scary venom in their tentacles, so you have to run to the hospital if you're stung..."
2006003-59 = ""
2006003-62 = ""
2006003-63 = "[ns1] \"Um, by the way...\"\n[ns2] \"Doesn't it...feel like the waves are coming closer...?\""
2006003-66 = "Ehhhhh, S-Sensei...!"
2006003-67 = ""
2006003-69 = ""
2006003-70 = ""
2006003-71 = "[ns] \"Ibuki?!\""
2006003-73 = "Ibuki had panicked and fallen into the water. I carried her out of the rocky area and back to safety."
2006003-74 = "...Poor Ibuki seemed terrified. She clung to me even after we returned to the sandy beach."
