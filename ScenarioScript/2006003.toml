2006003-17 = "[s] \"해양 생물?\""
2006003-18 = "3;이부키 수영복;07;응! 바다에 오기 전에, 바다의 생물들에 대한 책을 읽었어!\n#3;em;[반짝]"
2006003-19 = "3;이부키 수영복;15;물고기, 고래, 해파리, 불가사리, 꽃게, 조개……."
2006003-20 = "3;이부키 수영복;09;그 중에서도 오늘은! 해안가 바위에서 사는 친구들을 만나볼 거랍니다!\n#3;em;[전구]"
