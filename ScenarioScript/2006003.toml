[translation]
2006003-1 = "이부키와 함께 수업을!"
2006003-2 = "해안 바위 지대"
2006003-5 = "(이부키가 말한 바위 지대로 갔다.)"
2006003-6 = "어, 선생님이다!"
2006003-11 = "[s] \"안녕하세요, 이부키 선생님!\""
2006003-12 = "헤헤, 오늘은 선생님이 둘이나 되네!"
2006003-13 = "[s] \"아뇨, 오늘만큼은 제가 학생이죠!\""
2006003-14 = "헤헤, 그렇다면 이부키, 최선을 다해 가르칠게!"
2006003-15 = "그러니까, 오늘 이부키 선생님이 가르칠 것은……!"
2006003-16 = "바로! 해양 생물 수업입니다!"
2006003-17 = "[s] \"해양 생물?\""
2006003-18 = "응! 바다에 오기 전에, 바다의 생물들에 대한 책을 읽었어!"
2006003-19 = "물고기, 고래, 해파리, 불가사리, 꽃게, 조개……."
2006003-20 = "그중에서도 오늘은! 해안가 바위에서 사는 친구들을 만나볼 거랍니다!"
2006003-21 = "그럼 선생님! 바위 위로 올라가자!"
2006003-23 = "(그렇게 이부키를 따라 해안가 바위 위로 올라갔다.)"
2006003-25 = "자! 먼저 바위 위에 붙어 있는 자색따개비들부터 살펴보겠습니다!"
2006003-26 = "이 아이들은 어릴 때는 바다를 떠다니면서 살다가, 다 크면 바위에 붙어서 평생을 산대!"
2006003-27 = "그리고 먹이는…… 어?"
2006003-28 = "선생님! 저쪽 바위 위에 가시밭게 씨가 걸어가고 있어!"
2006003-29 = "이 아이는, 깜짝 놀라면 숨겨 놨던 가시들을 빵빵하고 부풀린대!"
2006003-30 = "이것 봐! 선생님을 보고 깜짝 놀랐나 봐! 가시가 나왔어!"
2006003-31 = "[s] \"정말이네……!\""
2006003-32 = "그러면 이 바위 아래에 붙어 있는 이 아이들은 무엇일까요?"
2006003-33 = "[s] \"응? 자색따개비 아니야?\""
2006003-34 = "땡! 엄청나게 닮았지만, 완전히 다른 종이야!"
2006003-35 = "이 아이들의 이름은 피라미드조개! 자색따개비와 모양도 습성도 비슷하지만, 완전히 다른 생물이야!"
2006003-36 = "차이점은 껍데기의 모양! 둥그스름한 자색따개비의 껍데기와 달리 피라미드조개의 껍데기는 네 개의 뾰족한 귀퉁이를 가지고 있어!"
2006003-39 = "(그렇게 바위 표면에 사는 생물들의 강의를 모두 들은 뒤.)"
2006003-40 = "(바위틈의 물웅덩이로 내려갔다.)"
2006003-42 = "선생님, 물속 좀 봐! 바위 위에서는 못 보던 아이들이 있어!"
2006003-43 = "말미잘, 불가사리, 새우……."
2006003-44 = "거기다 물도 엄청 맑아!"
2006003-45 = "[s] \"그러게, 물속의 발이 그대로 비쳐 보이네.\""
2006003-46 = "이부키, 이렇게 깨끗하고 맑은 바닷물은 처음이야!"
2006003-47 = "그리고…… 아하하!"
2006003-48 = "물고기들이 발을 간지럽히고 있어!"
2006003-49 = "이 아이들은 흰실고기인데…… 응?"
2006003-50 = "선생님! 저것 좀 봐!"
2006003-51 = "[s] \"응? 풍선?\""
2006003-53 = "(그리 멀지 않은 곳에, 파란색 풍선 같은 것들이 물 위에 둥둥 떠 있었다.)"
2006003-54 = "[s] \"저 풍선……들은 무엇인가요, 선생님?\""
2006003-55 = "에헤! 좋은 질문입니다!"
2006003-56 = "저 아이들의 이름은 청색풍선해파리……"
2006003-57 = "물 위에 둥둥 떠서 파도를 따라서만 움직이는 게으름뱅이 해파리 씨야!"
2006003-58 = "촉수에는 엄~청 무서운 독이 있어서, 쏘이면 바로 병원으로……."
2006003-63 = "[ns1] \"저기 그런데…….\"\n[ns2] \"어쩐지…… 물살이 우리 쪽으로 밀려오는 것 같지 않아……?\""
2006003-66 = "흐에에에, 서, 선생님……!"
2006003-71 = "[ns] \"이부키?!\""
2006003-73 = "(당황해서 뒷걸음치다 물속에 넘어진 이부키를 업고 바위 지대를 빠져나왔다.)"
2006003-74 = "(……많이 무서웠던 모양인지, 모래사장으로 돌아오고도 이부키는 한참을 더 매달려 있었다.)"
