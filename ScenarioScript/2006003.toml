2006003-23 = "#na;(그렇게 이부키를 따라 해안가 바위 위로 올라갔다.)"
2006003-24 = "3;이부키 수영복;01\n#3;a"
2006003-25 = "3;이부키 수영복;15;자! 먼저 바위 위에 붙어 있는 자색따개비들부터 살펴보겠습니다! \n#3;hophop"
2006003-26 = "3;이부키 수영복;03;이 아이들은 어릴 때는 바다를 떠다니면서 살다가, 다 크면 바위에 붙어서 평생을 산데!"
2006003-27 = "3;이부키 수영복;02;그리고 먹이는…… 어?"
2006003-28 = "3;이부키 수영복;07;선생님! 저쪽 바위 위에 가시밭게 씨가 걸어가고 있어!\n#3;jump"
2006003-29 = "3;이부키 수영복;03;이 아이는, 깜짝 놀라면 숨겨 놨던 가시들을 빵빵하고 부풀린대!\n#3;hophop\n#3;em;[재잘]"
2006003-30 = "3;이부키 수영복;00;이것 봐! 선생님을 보고 깜짝 놀랐나 봐! 가시가 나왔어!"
