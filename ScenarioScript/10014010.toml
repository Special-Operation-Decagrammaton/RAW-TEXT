[translation]
10014010-1 = "제1화;덤벼드는 녀석"
10014010-2 = "[ns1] \"스토킹이라고……!?\"\n[ns2] \"……확실히 큰일이네.\""
10014010-3 = "아, 미리 말하는 건데 지금 선생님이 생각하는 그런 형태의 스토킹은 아냐. 좀 더 복잡하지."
10014010-4 = "아, 미리 말하는 건데 지금 선생님이 생각하는 그런 형태의 스토킹은 아냐. 좀 더 복잡하지."
10014010-5 = "……차라리 그런 문제였다면 편했을 텐데 말이지. 정의실현부 쪽에 신고해버리면 되니까."
10014010-9 = "음……. 아니, 취소."
10014010-10 = "역시 정의실현부 쪽은 좀 불편한 것 같기도……."
10014010-11 = "[s3] \"……?\"\n[s4] (정의실현부가 불편하다니……?)"
10014010-12 = "아무튼 이건 그러니까……. 뭐랄까……. 좀 더 기묘한……. 조금 복잡한 상황이라……."
10014010-13 = "아무튼 이건 그러니까……. 뭐랄까……. 좀 더 기묘한……. 조금 복잡한 상황이라……."
10014010-14 = "우선……. 본인 딴에는 전혀 스토킹이라는 자각이 없는 모양이야."
10014010-15 = "……응? 스토킹이라는 게 원래 그런 거 아니냐고?"
10014010-16 = "하하……. 갑자기 정론이라 반박하기 어렵네."
10014010-17 = "아무튼 뭐……. 이래저래 이유가 있어서, 딱히 녀석을 벌하고 싶지는 않다는 거지."
10014010-18 = "그냥……. 방법은 잘 모르겠지만 아무튼 그만두게 만들고 싶을 뿐. 그래서 선생님께 부탁하는 거야."
10014010-19 = "으음. 말하고 나니 역시 좀 부담스러운 일이려나. 괜히 선생님을 난처하게 만드는 거 아닌가 싶은데."
10014010-20 = "[s5] \"카즈사가 난처한 거보단 낫지.\"\n[s6] \"신경 쓰지 마. 원래 이런 게 내 일이야.\""
10014010-21 = "정말 아무렇지도 않게 그런 말을 하는구나, 선생님은."
10014010-22 = "정말 아무렇지도 않게 그런 말을 하는구나, 선생님은."
10014010-23 = "그래도 뭐……. 나야 고맙지."
10014010-24 = "감사합니다."
10014010-25 = "……응?"
10014010-26 = "그래서 결국 그 스토커라는 애는 누구냐고?"
10014010-27 = "아아. 그렇지. 미안. 또 설명을 깜빡했네."
10014010-28 = "다른 사람의 신상을 말하는 거라 좀 마음에 걸리지만……. 사안이 사안이니 어쩔 수 없나."
10014010-29 = "……어차피 가만 놔둬도 결국 눈에 띌 녀석이고 말이지."
10014010-30 = "녀석의 이름은 말이지……."
10014010-31 = "……우자와……."
10014010-32 = "드디어 찾았습니다! 더는 피할 수 없어요, 쿄야마 카즈사!!!"
10014010-33 = "이 <우자와 레이사>와의 결투를 피할 순 없습니다!! 얌전히 도전장을 받으세요!"
10014010-37 = "[ns7] \"……<도전장>?\"\n[ns8] \"<결투>라고?\""
10014010-39 = "……하아."
10014010-40 = "……하아."
10014010-41 = "……그래, 이런 식으로 다짜고짜……."
10014010-46 = "선빵 필승-!!!"
10014010-59 = "……덤비는 녀석이거든."
