[translation]
2601005-1 = "하늘의 모양"
2601005-2 = "(미유의 감상이 궁금했기 때문에, 미유가 있는 곳을 물어 그곳으로 찾아갔다.)"
2601005-5 = "어라……. 선생님……?"
2601005-6 = "……네? 여기서 뭘 하고 있었냐고요……? 그건, 그……."
2601005-7 = "딱히 대단한 무언가를 하고 있었던 건 아니고……. 그저 해바라기를……."
2601005-8 = "우으으으……."
2601005-9 = "역시 아까 전 모모톡 때문에 그러시는 거군요……. 별 뜻은 없었던 건데……."
2601005-10 = "저는 그저…… 하늘에 대한 감상을 나누고 싶어서 즉흥적으로 연락드렸던 거라……"
2601005-11 = "혹시 신경 쓰이게 해드렸던 걸까요……."
2601005-12 = "[s] \"나도 미유가 말한 하늘을 보고 싶어졌거든.\""
2601005-13 = "그런 거라면…… 이쪽으로 와주세요."
2601005-14 = "그쪽의 계선주 위에 앉아서 서쪽의 바다를 향해……"
2601005-15 = "……네, 그 수평선 위의 바다예요."
2601005-16 = "후훗…… 평범하죠?"
2601005-17 = "아무것도 없는 하늘의 풍경이지만…… 제게는 좀 신기했어요."
2601005-18 = "평상시에는 저격을 위해 항상 좁거나 어두운 곳에 몸을 숨기고 있을 때가 많으니까요……"
2601005-19 = "하지만 여기는 사방이 트여 있고, 바람이 세지도 않고…… 시끄럽지도, 고요하지도 않으면서…… 그리고 또……"
2601005-20 = "……단순해서 좋아요."
2601005-21 = "[s] \"단순하다고?\""
2601005-23 = "평소에 보던 하늘은 가리는 것이 많았거든요……"
2601005-24 = "도심 사이로 끝없이 솟아오르는 건물과, 뾰족뾰족한 산의 경계가 풍경에 요철을 내서……"
2601005-25 = "하늘과 맞닿는 경계에는 언제나 울퉁불퉁한 굴곡이 있었는데……"
2601005-27 = "이곳은 하늘과 바다 사이에 아무런 장애물도 없이…… 마치 자로 그은 것처럼 깔끔한 수평선을 그리고 있어요."
2601005-28 = "이렇게 단순한 하늘 아래에서라면 어떤 표적이든 맞출 수 있을 것 같아서……"
2601005-29 = "……뭔가 확신하기 어려운 자신감이 생겨나더라고요."
2601005-30 = "그래서 작전이 아니더라도 이런 곳에 자주 오면 좋겠다- 라고 생각하고 있노라니……"
2601005-31 = "저도 모르게 선생님께 연락을 보내고 있었어요……"
2601005-32 = "……이상한 이야기였네요. 죄, 죄송해요. 역시……."
2601005-33 = "[s1] \"……이곳이 꽤 마음에 든 모양이네.\"\n[s2] \"앞으로는 작전 말고도 가끔씩 찾아올까?\""
2601005-36 = "그, 그런……. 딱히 그런 의미로 드린 말씀은 아닌데……!"
2601005-37 = "우으으……. 역시 이래서 말씀드리지 않으려고 했는데……."
2601005-38 = "뭔가 선생님께……. 떼를 쓰는 것처럼 보이잖아요……."
2601005-39 = "[s3] \"그렇지 않아.\"\n[s4] \"나도 좋은걸. 이 하늘의 모양이.\""
2601005-42 = "저, 정말이신가요……?"
2601005-43 = "정말로 선생님도 마음에 드시나요? 수평선이라든가……. 이런 하늘……."
2601005-47 = "마, 만약……. 정말로 만약에……."
2601005-48 = "선생님께서도……. 이 풍경이 마음에 드신다면……. 그러신다면……."
2601005-49 = "혹시라도…… 그러니까……"
2601005-50 = "……그……."
2601005-51 = "[s] \"다음에 또 같이 오자. 이 바닷가에.\""
2601005-52 = "…………!!"
2601005-53 = "……아."
2601005-54 = "아우우……."
2601005-55 = "…………네."
2601005-57 = "……꼭 ……부탁드릴게요."
