[translation]
10042060-1 = "제6화;해야 할 일"
10042060-2 = "……."
10042060-3 = "아니, 진짜 정말 이게……."
10042060-4 = "[s] \"그러니까 말했잖아…….\""
10042060-5 = "그래도 그렇지, 이게 실화인가요!?"
10042060-6 = "제가 뭐 누군가가 세심하고 악랄하게 준비한, 악몽의 한가운데에 들어와 있는 건 아니겠죠?!"
10042060-10 = "아프잖아요!"
10042060-11 = "그러면…… 이게 정말…… 현실이라고요? 진짜라고요?!"
10042060-12 = "(저거…….)"
10042060-13 = "(나도 했었는데…….)"
10042060-14 = "갑작스러운 상황 변화에 사람은 가끔 안 하던 행동을 하곤 합니다. 그 증상이로군요."
10042060-15 = "쓸데없는 소리는 됐어요!"
10042060-16 = "이럴 수가……. 분명 거대한 팬케이크가 어쩌고 하는 말을 듣긴 했지만, 이 정도일 줄은……."
10042060-17 = "그런 거라면 오히려 제 쪽에서 더욱 호들갑을 떨어서, 그 대가를 반드시 선생님에게 받아내려던 당초의 계획이……."
10042060-18 = "[s] \"그런 거였냐.\""
10042060-19 = "읏……!"
10042060-20 = "어, 어쨌든 결과적으로는 상황을 타개할 수 있는 대책을, 때맞춰 가져오게 된 셈이잖아요?! 오히려 정답이었잖아요!?"
10042060-21 = "빨리 그렇다고 말하세요! 그렇게 '그거 진짜 뻔뻔하구만……' 같은 표정 하지 마시고요!"
10042060-22 = "[s] \"알았어. 알았으니까 울먹이지 마.\""
10042060-23 = "누, 누가요?! 전 진짜 그런 적 없거든요!?"
10042060-24 = "……."
10042060-25 = "아무튼 좋아요. 전 포대, 발포 준비!"
10042060-26 = "알겠습니다! 88mm FlaK 36 12문, 전 포대 발포 준비!"
10042060-27 = "자, 잠깐만요. 선임행정관……! 잠시만 이야기를!"
10042060-28 = "……? 또 뭔가요?!"
10042060-29 = "그게……."
10042060-30 = "……! 선임행정관님! 목표물…… 그러니까 저 커다란……"
10042060-31 = "'팬케이크'의 이동이 너무 빨라, 정확한 조준이 어렵습니다!"
10042060-32 = "건물들 사이를 빠르게 돌아다니며, 몸을 숨기고 있어서……."
10042060-33 = "이대로라면, 게헨나 자치구 건물들에까지 피해가 발생할 수 있습니다!"
10042060-34 = "……? 뭐라고요?"
10042060-35 = "……네, 그 말씀을 드리려고 했습니다만……."
10042060-36 = "아, 아니……. 아니. 잠깐만요."
10042060-37 = "팬케이크가 빠른 속도로 건물 사이를 이동……. 조준이 어렵고 시가지에 피해……."
10042060-38 = "아니, 그……. 아……. 무슨 상황이지 이제……."
10042060-39 = "[s1] \"……큰일이네.\"\n[s2] \"그래도 그냥 쏘라고는 안 하는구나.\""
10042060-42 = "대체 사람을 뭐로 보시는 거예요……."
10042060-43 = "……크윽……."
10042060-48 = "(저걸 소거하는 것이, 현재 시점에서는 가장 중요한 목표이겠지만.)"
10042060-49 = "(그 과정에서 우리가 게헨나에 피해를 입히게 된다면……. 그야말로 주객전도.)"
10042060-50 = "(거기에 그 일로 만마전의 너구리들이 트집을 잡기라도 하면……!)"
10042060-51 = "……선임행정관."
10042060-52 = "……네?"
10042060-53 = "뒤에."
10042060-54 = "……?"
10042060-55 = "……뒤? 뒤라니 무슨–"
10042060-60 = "꺄아아아아아아아악?!?!"
10042060-67 = "팬 쨩의 촉수가 아코 행정관을 낚아챘습니다!"
10042060-68 = "그, 그것도 하필이면 발목을……!"
10042060-69 = "괜찮으신가요, 아코 행정관?! 지금 거꾸로 매달려서 대롱대롱거리고 계신데요……!?"
10042060-73 = "악! 아악!! 아아악!!! 이것 좀 어떻게 해 봐요!!!!"
10042060-77 = "싫어! 이게 뭔가요! 끔찍해요! 끈적거려요! 미끈거리고 기분 나쁘고 하여튼 다 최악이……!"
10042060-80 = "……읍읍읍읍?!?!?!"
10042060-82 = "[ns] \"으아아아……. 팬 쨩의 촉수가 아코를 휘감고 있어……!\""
10042060-83 = "과연. 그때 교실에 매달렸던 학생들도 이렇게 당했던 것이겠군요."
10042060-84 = "웁우웁읍읍!!! (지금 그렇게 냉정한 분석을 내릴 때인가요?!?!)"
10042060-85 = "읍엡웁믐! 압아아압압!!! (뭐라도! 하라고요-!!!)"
10042060-86 = "어, 어어어어, 어떻게 하지?!?! 뭐라는 거야!?"
10042060-87 = "저도 모르겠습니다. 그런 취미가 있는 건 아니라서."
10042060-88 = "우리가 할 수 있는 일이 뭐가 있을까요……?"
10042060-89 = "……."
10042060-90 = "막아야 해요. 어떻게 해서든……!!"
10042060-91 = "주리……?"
10042060-92 = "무슨…… 생각인가요? 저걸 어떻게……?"
10042060-93 = "물리적으로 당장 성립되는 방도가 떠오르지는 않습니다만……."
10042060-94 = "거기까지는 저도 정확히는 모르겠지만, 어떻게든 막아야 해요!"
10042060-98 = "……제가 해 볼게요."
10042060-99 = "[s3] \"……주리……!?\"\n[s4] \"뭘 하려는 거야……?\""
10042060-102 = "저……. 요리를 잘하고 싶어요. 그건 변하지 않았어요. 앞으로도 분명 그럴 것 같아요."
10042060-103 = "이번에도 처음에는 어쩐지 잘 됐어요. 그때는 정말 기뻤어요."
10042060-104 = "언젠가 또……."
10042060-105 = "……그런 걸 만들어 볼 수……. 있었으면 좋겠어요."
10042060-106 = "주리……!? 갑자기 무슨 소리야? 지금 상황이랑 관계 있는 거야, 그거……?"
10042060-107 = "……과연, 플래그입니까."
10042060-108 = "선배!?!?"
10042060-109 = "괜찮아요. 선배. 네, 다 괜찮아요. 분명 그럴 거예요."
10042060-110 = "그렇지만 그 모든 것과 별개로, 이 문제는 제가 어떻게든 해야 할 것 같아요."
10042060-111 = "왜냐하면 이건……"
10042060-113 = "……제가, 가져가야 할 일이니까요."
10042060-115 = "[ns5] \"그만둬! 그런 말은……!\"\n[ns6] \"이 상황에서 그 대사는!!!\""
10042060-118 = "괜찮아요. 선생님. 다 괜찮을 테니까요. 다만."
10042060-119 = "……."
10042060-120 = "기억해 주세요. 잊지 말아 주세요."
10042060-121 = "제가, 어떻게든 시선을 끌어 볼 테니까요."
10042060-122 = "그럼……."
10042060-126 = "……다녀오겠습니다."
10042060-132 = "못 돌아오는 흐름이라고, 그거-!!!"
