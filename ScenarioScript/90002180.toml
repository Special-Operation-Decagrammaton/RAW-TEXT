[translation]
90002180-1 = "제18화;너를 위한 이야기"
90002180-3 = "[ns] \"얘들아……?\""
90002180-6 = "……."
90002180-9 = "……."
90002180-10 = "……."
90002180-12 = "[ns] \"……!\""
90002180-13 = "빌어, 먹을……."
90002180-14 = "빌어먹을, 빌어먹을, 빌어먹을……!"
90002180-15 = "네? 움직일 수 있냐고요?"
90002180-16 = "……."
90002180-17 = "움직일 수 없지만, 움직여 보겠어요! 저 자식…… 저 자식이……!!!"
90002180-18 = "으아아아아아아아아!!!!!"
90002180-22 = "도대체…… 어째서! 왜! 왜!!!!!"
90002180-28 = "(무력했다.)"
90002180-29 = "(그 손끝 하나, 어떻게 할 수 없었다.)"
90002180-33 = "……님? 선생님? 계세요? 괜찮으세요?! 저희는#$^@$%–"
90002180-37 = "*&)%^&$@싯딤의 상자, 자가 수복 프로세스 개시. 선생님, 조금만 더$%&#–"
90002180-43 = "(왠지 모르게 알 수 있었다.)"
90002180-44 = "(저것은, 그냥, 어떻게 할 수 있는 것이 아니다.)"
90002180-46 = "(그렇다면.)"
90002180-48 = "[ns] \"…….\""
90002180-50 = "[ns] 다리에 힘을 주어, 어떻게든 일어선다."
90002180-53 = "선생님……?"
90002180-54 = "지금, 뭐 하는 거예요……? 움직이면 안 돼요. 지금 선생님은 우리보다 상태가 안 좋다고요!"
90002180-67 = "……그쪽이 아니다. 선생이여. 나는 여기에 있다."
90002180-68 = "제대로 걷지도 못하고, 앞조차 보지 못하는 몸으로 무엇을 하려 하는가."
90002180-70 = "[ns] 입을 열어 대답한다."
90002180-71 = "학생들을 무사히 키보토스로 보내 달라는 것인가?"
90002180-72 = "……."
90002180-73 = "그대도 알고 있을 것이다. 모든 일에는 때가 있다."
90002180-74 = "그대는 나의 선지자가 되는 것을 거부했고, 그렇기에 이것은 어떤 의미에서 그대와 내가 선택한 결과이기도 하다."
90002180-75 = "……."
90002180-77 = "'멸망이 우리의 선택이라면, 나는 그것을 받아들일 것이다.'"
90002180-78 = "그대의 그 말을, 나는 아직 기억하고 있다."
90002180-79 = "그 말을 했을 때의 그대와, 지금의 그대는 다른 존재인가?"
90002180-80 = "[ns] 대답하지 않는다."
90002180-82 = "[ns1] 무릎을 꿇는다.\n[ns2] 간청하듯 엎드린다."
90002180-85 = "선생님……?"
90002180-87 = "……."
90002180-88 = "그대를 나의 선지자로 삼고자 했던 것은, 그대가 나에게 있어 가장 예측하기 힘든 변수였기 때문이다."
90002180-89 = "선생이여. 지금의 그 행동으로 그대는, 지금의 그대가 나에게 있어 더 이상 어떤 변수도 되지 못한다는 것을 증명했다."
90002180-90 = "[ruby=생명체들]너희들[/ruby]은 항상 그런 식이다."
90002180-91 = "모든 것이 막연하게 어떻게든 될 것이라 생각하고, 불확실한 미래에 몸을 맡긴다."
90002180-92 = "생존을 위해서라면 스스로의 언행을 손바닥 뒤집듯이 뒤집고, 그 행위에 대해 어쩔 수 없었다며 스스로를 합리화한다."
90002180-93 = "[ns3] 다시 간청한다.\n[ns4] 이마를 바닥에 찧는다."
90002180-98 = "선생님……?"
90002180-99 = "하지, 마요……. 그러지 말라구요……!"
90002180-100 = "선택한 멸망이 눈앞에 다가왔을 때, 나는 그대가 그것을 담담히 받아들이기를 기대했다."
90002180-101 = "그것은 다른 누구도 아닌, 그대 자신의 말이었기 때문이다."
90002180-102 = "[s] \"그렇게 할 거야.\""
90002180-106 = "[ns] \"하지만, 아이들은 집으로 돌아가게 해 줘.\""
90002180-108 = "……!"
90002180-109 = "……."
90002180-110 = "그런가. 그대 본인과 학생들을 분리하려는가."
90002180-111 = "그 대신 그대 본인의 처분은, 온전히 나에게 맡기겠다는 것인가."
90002180-112 = "……."
90002180-113 = "나는 지금도 그대에게 빠른 죽음을 선사할 수 있다."
90002180-114 = "그러나 그렇게 하지 않겠다면, 그대는 어떻게 할 것인가."
90002180-115 = "뭐……?"
90002180-116 = "삶은 소중한 것이라고 그대들은 말한다."
90002180-117 = "생명보다 중요한 것은 없다고 그대들은 말한다."
90002180-118 = "그러나 내가 여기에서 입을 열어 말할 것이니, 죽음보다 못한 삶이라는 것은 얼마든지 존재한다."
90002180-119 = "그것은 지금 이 순간에도, 그대들이 그대들 스스로의 힘으로 현재에 만들어내고 있는, 지옥의 일면이다."
90002180-120 = "나는 그대에게 그런 삶을 강요할 수 있다."
90002180-121 = "그대의 의식만을 남겨두고, 그대의 손으로 그대의 학생들을 직접 살해하도록, 그대의 모든 것을 조작할 수도 있다."
90002180-122 = "생명만을 꺼지지 않게 남겨두고, 그 밖의 모든 것을 끝없는 고통 속으로 밀어 넣을 수도 있다."
90002180-123 = "내가 그렇게 정한다 해도, 그 길을 받아들이겠는가. 선생이여."
90002180-124 = "[s] \"원한다면, 그렇게 해.\""
90002180-128 = "[ns] \"나는 추한 인간이야. 그 사실을 부정할 생각은 없어.\""
90002180-129 = "선생님……?"
90002180-133 = "[ns] \"그러니, 제발 부탁드립니다.\""
90002180-135 = "[ns] \"아이들만은, 집으로 돌아가게 해 주십시오.\""
90002180-141 = "선생님!!!"
90002180-142 = "아아아, 으아아아아아아아아!!!"
90002180-143 = "조금만 더, 내가 조금만 더 강했어도!!!!!"
90002180-144 = "슬프구나. 선생이여. 그리고."
90002180-145 = "진정으로, 추하구나."
90002180-147 = "(많은 생각들이 머리를 스쳤지만, 그 생각들이 확실한 이미지로 잡히지는 않았다.)"
90002180-148 = "(다만.)"
90002180-149 = "(아직 아이들에게 무엇 하나 제대로 해 주지 못했다는 사실만이, 그저 가슴에 사무쳤다.)"
90002180-152 = "정말 그걸로 괜찮은 거야?"
90002180-153 = "[ns] 누구?"
90002180-155 = "어, 으음……. 뭐, 우리가 누구인지는 이제 별로 중요하지 않은 것 같고."
90002180-156 = "그냥 뭐라고 해야 할까? 조금 신기하다는 생각이 들어서."
90002180-157 = "있잖아, 선생님. 선생님은 어떻게 그럴 수 있는 거야?"
90002180-158 = "[ns] 대답한다."
90002180-159 = "소중한 것이 있으니까, 라고?"
90002180-160 = "……."
90002180-161 = "그래. 그렇구나."
90002180-162 = "하지만 사람은 보통, 자기 생명이 가장 소중하다고 생각하지 않아? 내가 조금 잘못 알고 있는 거야?"
90002180-163 = "[ns] 대답한다."
90002180-164 = "그래. 그렇구나. 역시 보통은 그게 맞는 거지?"
90002180-165 = "하지만 그것만으로는 안 된다고? 그저 살아있기만 하는 것으로는 안 되는 것이 있으니까? 그건 또 무슨 소리야?"
90002180-166 = "어? 인간은…… 그런 식으로, 자기 종족을 이어 온 생물종…… 이었다고?"
90002180-167 = "자기보다 더 가능성이 있는 자들에게, 그리고 자기보다 더 소중하다고 여길 수 있는 자들에게……."
90002180-168 = "자기가 가진 모든 것을 남기고 물려주면서."
90002180-169 = "그렇게 사라져간 자들의 뜻을, 남은 사람들이 이어받으며……?"
90002180-172 = "저는 말이죠. 언제나 그걸 잘 모르겠다고 생각했어요."
90002180-173 = "무슨 위선이라든가, 거짓말이라고만 생각했죠."
90002180-174 = "그런데……."
90002180-175 = "……."
90002180-176 = "있잖아요, 선생님."
90002180-177 = "선생님에게 학생들은, 그 정도로 소중한가요?"
90002180-178 = "[ns] 대답한다."
90002180-179 = "……그렇군요. 해야 한다고 생각하면, 자기가 가진 모든 것과……."
90002180-180 = "필요하다면, 자기의 모든 가능성을 넘겨줄 수 있을 정도로요."
90002180-181 = "어른이란 건 분명 그렇게 하라고 있는 것일 테니까, 라고요?"
90002180-182 = "하지만 말이죠. 이거 그 츠카츠키 리오와 같은 선택인지도 모른다고요?"
90002180-183 = "그거 분명, 레일의 방향을 어디로 결정하느냐의 문제였죠?"
90002180-184 = "리오는 이제 마지막까지 다른 방법을 찾고, 도움을 요청하겠다고 입장을 바꿨던 것 같고요."
90002180-185 = "……."
90002180-186 = "선생님은, 리오를 너무 비난할 자격이 없었던 것인지도 모르겠네요."
90002180-187 = "[ns] 대답한다."
90002180-188 = "……."
90002180-189 = "그렇군요."
90002180-190 = "그래서 그때도, 그 아이를 지나치게 몰아세우고 싶지는 않았다는 건가요……."
90002180-193 = "하, 하지만 선생님이 학생들을, 어떻게든 키보토스로 되돌려 보낸다고 해서……."
90002180-194 = "그 학생들의 운명이, 근본적으로 바뀌지는…… 아, 않을 거라고 생각해요……."
90002180-195 = "강철대륙이 다시 확장을 시작해서, 키보토스가 다시 강철대륙의 일부가 되면……."
90002180-196 = "그 학생들이 어, 어디에서 무엇을 하는지, 무엇을 하려 하는지……. 그분에게 결국에는 공유될 테니까요……."
90002180-197 = "어디로 도망치든, 어디로 숨든, 결국에는…… 발각되고야, 말겠죠……."
90002180-198 = "그래서 학생들은 결국, 그분이 생각하시기에…… 하, 합당한 처벌을 받고야 말 거예요……."
90002180-199 = "물론 그 학생들은…… 여기에서 일어난 일에 대한, 모든 정보를 가지고 있으니까……."
90002180-200 = "저항군 같은 것을 결성해서, 최대한의 저항을 시도할 수도 있겠지만……."
90002180-201 = "그, 그렇다고 해도, 결과는 크게 바뀌지 않을 거라고…… 생각, 해요……."
90002180-202 = "[ns] 대답한다."
90002180-203 = "네? 그렇지만 가능성은 남는다고요?"
90002180-204 = "0과 0이 아닌 것 사이에는 비교할 수 없는 차이가 있으니까요?"
90002180-205 = "그건, 분명, 그렇지만……. 그래도……."
90002180-206 = "그 학생들이 남은 일생을, 계속해서 그분의 진노를 피하면서 살아가거나, 그것에 저항해야 한다고 해도요?"
90002180-207 = "그렇, 군요. 선생님은 그래도 그 아이들이 살았으면, 한다는 거네요……."
90002180-209 = "[ns] \"그 아이들뿐만 아니라.\""
90002180-211 = "[ns] \"너희들 역시도, 그랬으면 해.\""
90002180-214 = "?!"
90002180-215 = "!?!?"
90002180-216 = "……."
90002180-217 = "저기, 학생들은, 당연, 하겠지만……."
90002180-222 = "저희에게도 그럴 가치가, 이, 있다고…… 생각, 하시나요……?"
90002180-223 = "[ns] \"당연한 거야.\""
90002180-225 = "[ns] \"어른이 할 일은, 아이들을 지키는 거니까.\""
90002180-226 = "!!!"
90002180-227 = "[ns] \"미안해.\""
90002180-229 = "네? 갑자기…… 요? 어, 어째서요……?"
90002180-230 = "[s] \"세상이 그래도 살 만한 곳이라는 걸 보여 주지 못해서.\""
90002180-231 = "그건 뭐…… 선생님 혼자만 잘못한 건 아니잖습니까."
90002180-232 = "[s5] \"그래도, 세상이 살 만한 곳은 못 되지만.\"\n[s6] \"괜찮은 사람도 있다는 걸 보여 주지 못해서.\""
90002180-237 = "[ns] \"제대로 된 가능성을 넘겨주지 못해서.\""
90002180-239 = "[ns] \"결국 좋은 어른이 되지 못해 줘서.\""
90002180-241 = "[ns] \"정말로, 미안해.\""
90002180-242 = "……."
90002180-243 = "그래."
90002180-244 = "그렇게 생각하는구나. 선생님은."
90002180-249 = "(서늘한 손길이 느껴진다.)"
90002180-251 = "알았어, 선생님."
90002180-252 = "응. 알았어."
90002180-253 = "그렇게 생각해 줘서, 정말로 고마워."
90002180-254 = "그러니까 여기에서부터는, 우리에게 맡겨 줘."
90002180-258 = "그래요. 그런 거죠."
90002180-259 = "저기, 감사…… 해요."
90002180-260 = "잠깐이라도, 선생님과 같은 시간을 보낼 수 있어서…… 기뻤어요."
90002180-265 = "[ns] \"……?\""
90002180-268 = "못 말리겠네, 그 사람."
90002180-269 = "역시나, 라고 해야 할까요. 그런 거였네요."
90002180-270 = "에헤헤……. 그래도 뭔가, 좋았어요……."
90002180-276 = "역시 말이지."
90002180-277 = "행복이 무엇인지, 나는 아직도 잘 모르겠어."
90002180-278 = "아마 우리는, 영원히 알 수 없지 않을까 합니다만."
90002180-279 = "응. 그게 어디에 있는지, 있다면 어떤 것인지. 그리고 또 우리가 그걸 붙잡을 수 있기는 한 건지."
90002180-280 = "……."
90002180-281 = "하지만 이런 생각이 들기도 했어."
90002180-282 = "세계는 비극이 맞을지도 모르고, 탄생은 저주일지도 모르지만."
90002180-283 = "그, 그건……."
90002180-284 = "그러니까, 이제 그걸 용서하지 않으려고 해."
90002180-285 = "탄생이 비극이라면, 행복은 그에 대한 투쟁일 테니까."
90002180-286 = "……뭐예요, 그거 그냥 선생님이 한 말 따라 하는 거잖아요."
90002180-287 = "시끄럽네, 거 참."
90002180-288 = "그, 그래도 여, 역시 소프예요!"
90002180-289 = "하지만 말이야. 그 말에서 확실하게 느낀 것도 분명 있었어."
90002180-290 = "살아 있다면 온 힘을 다해 저항해야 한다는 것."
90002180-291 = "나라고 해도, 내 인생을 비극으로 칠해진 기념품으로 만들어 줄 생각은 없다는 것 말야."
90002180-292 = "그건 뭔가 케이가 했던 말과 비슷하게 들리네요."
90002180-293 = "……응. 그럴지도 모르지."
90002180-299 = "당신들……? 선생님에게 뭔가, 듣기라도 했나요……?"
90002180-300 = "아, 아뇨! 들었다고 하기보다, 그……."
90002180-301 = "……억지로 파고들었다고 해야 하겠네요."
90002180-302 = "그래서 말이지. 지금 어떤 생각이 막 떠올랐거든?"
90002180-303 = "생각, 이요?"
90002180-304 = "기억나요, 케이? 예전에, 생명과 죄에 대해서 선생님과 이야기했을 때."
90002180-305 = "생명……? 티페레트 때 말인가요?"
90002180-306 = "저, 저는 기, 기억나요! 오르가 이런 말을 했었죠……. 생이 고통이라면, 죄는 그 생명의 일부인 것이라고요……."
90002180-307 = "네. 그랬죠. 그래서 그냥 이런 생각이 들었어요."
90002180-308 = "우리도, 무죄하지는 않을 거라고요."
90002180-309 = "응. 그럴 리가 없지. 왜냐하면 우리는 이미 움직이고 있으니까."
90002180-310 = "이, 이 몸을 움직이는 데 필요한 동력도…… 어딘가에서 아무 까닭 없이 주어진 것일 리 없을 테니까요."
90002180-311 = "네, 뭐. 에너지가 땅 파서 나오는 건 아닐 테니까요……?"
90002180-312 = "저기, 그렇다면 살아 있는 것은, 모두 유죄인 것일까요……?"
90002180-316 = "……어쩌면, 그런 결론을 내릴 수도 있을지 모르죠."
90002180-317 = "그래. 그렇겠지."
90002180-318 = "그렇지만 말야. 그렇기에 더 나아지기 위해서 애를 쓸 수 있는 게 아닐까."
90002180-319 = "애초부터 완전한 것에는 의미가 없었던 거야. 그것은 더 나아지거나 나아갈 수 없다는 뜻이니까."
90002180-320 = "제자리에 멈추어서 굳어 버린 채, 그대로 남겨지겠다는 것이니까."
90002180-321 = "케이, 우리는……."
90002180-326 = "우리는, 무엇을 하고 있었던 걸까요?"
90002180-327 = "무엇이…… 되고 싶었던 걸까요……?"
90002180-329 = "……."
90002180-330 = "에헤헤. 미안해요. 대답하기 어려운 질문이었죠?"
90002180-336 = "[log]\"열심히 했구나.\"[/log]"
90002180-341 = "[log]\"주어진 조건 안에서, 정말로 열심히 했어.\"[/log]"
90002180-344 = "솔직하게 이야기하자면, 그런 것은 생각하지 않았었죠."
90002180-345 = "그럴 필요가 없을 것 같았으니까. 우리는 우리가…… 이미 완벽한 줄 알았으니까."
90002180-346 = "소프가 예전에 한 말처럼 말이에요."
90002180-350 = "[log]\"모든 일에 납득할 수 있는 이유가 따라온다면, 얼마나 좋을까.\"[/log]"
90002180-353 = "[log]\"살아가는 게 벅차지 않은 세계가 있을 수 있다면.\"[/log]"
90002180-356 = "[log]\"그건 정말로…… 얼마나, 멋진 일일까.\"[/log]"
90002180-359 = "있잖아, 케이. 학생이 된다는 건 어떤 걸까?"
90002180-360 = "학생…… 요? 그건……."
90002180-361 = "일단, 적어도 무언가를 끊임없이 배워야 하는 입장이긴 하죠?"
90002180-362 = "더 나아지고, 더 달라지고, 그렇게 마침내 지금의 자신이 아닌, 더 나은 무언가를 향해서……."
90002180-363 = "그건 역시, 머, 멋질 것 같아요……!"
90002180-365 = "에헤헤. 하, 할 수 있다면, 말이지만요……."
90002180-371 = "[log]\"선생님이 학생을 포기하면 안 되잖니.\"[/log]"
90002180-376 = "[log]\"전학 서류는 구비되어 있으니까, 관심 있으면 연락 줘.\"[/log]"
90002180-379 = "비밀 하나 말해 줄게! 우리 말이야, 조금 전에 선생님이랑 우리만 아는 이야기를 했거든!"
90002180-380 = "네……?"
90002180-381 = "거기에서 선생님이 이런 말을 했어! 그저 살아 있기만 해서는 안 되는 것이 있다고!"
90002180-382 = "에헤헤……. 왠지 그 말이 무슨 뜻인지, 조, 조금 알 것 같았어요."
90002180-383 = "여기에서 하나 질문! 자기 자신을 위해서라면, 할 수 없는 결심도 분명히 있을 거예요."
90002180-385 = "왜냐하면 어떤 건…… 절대로 되돌이킬 수 없는 결과를 가져올 테니까!"
90002180-386 = "잠시만요……. 무슨 말을 하려는 거죠? 아뇨, 무슨 일을 하려는 거예요……?"
90002180-387 = "하지만 친구를 위해서라면 어떨까? 케이, 너는 할 수 있어?"
90002180-388 = "이런 질문도 바보 같네! 이미 한번 해 본 사람한테, 왜 그런 걸 물었을까?"
90002180-389 = "아뇨, 잠깐만요. 멈춰요. 뭘 하려는 것인지는 모르겠지만 일단 멈춰 봐요. 아직은, 아직은……!"
90002180-390 = "싫거든요~? 우리는 애초에 선생님 말도 남의 말도 잘 안 듣는, 말썽꾸러기에 악당들이니 말이죠!"
90002180-391 = "거기에 말입니다. 우리, 사실."
90002180-395 = "저분께 갚아 드려야 할 것들, 조금 많고 말이죠?"
90002180-396 = "그것도 그렇지. '되돌려주고 싶다'는 기분이야말로, 꽤 강력한 동기니까 말이야."
90002180-397 = "에헤헤……."
90002180-401 = "친구가 되어 주세요."
90002180-405 = "……."
90002180-411 = "바라는 것이 있다면, 그리고 그것이 무엇보다 절실하다면!"
90002180-416 = "……."
90002180-422 = "[ruby=싸움]행복[/ruby]이야말로, 우리가 절대 멈출 수 없는, 우리에게 있어 가장 중요한 것들 중 하나일 테니까요."
90002180-426 = "[log]\"……슬픔 없이 타인을 이해할 방법은, 존재하지 않으니까.\"[/log]"
90002180-429 = "……."
90002180-437 = "살아가는 것, 죄를 짓는 것."
90002180-438 = "불완전해지는 것, 투쟁하는 것, 나아가는 것."
90002180-439 = "그리고 마침내, 더 나은 자신이 되는 것."
90002180-440 = "절대로 포기할 수 없는, 그 어떤 것들."
90002180-441 = "그것이 옳거나 바람직하기에 그렇게 하는 것이 아니죠."
90002180-442 = "그렇게 하는 것 외에, 달리 할 수 있는 일이 없기 때문인 거고요."
90002180-443 = "<원하는 바를 행하라. 그것이 그대의 법이 될 것이니>"
90002180-444 = "우, 우리는 어떤 의미에서, 우리의 율법을 계속해서 따르려 하는 것이니까요."
90002180-446 = "모두, 고마워. 그리고, 미안해."
90002180-451 = "그러면 어디."
90002180-462 = "진짜 악당이 되러, 가 볼까."
90002180-464 = "다음화;신을 떨어트린 날"
