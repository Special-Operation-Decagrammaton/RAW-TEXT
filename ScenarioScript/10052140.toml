[translation]
10052140-1 = "자비"
10052140-10 = "아, 아와, 아와와와……!!!!!"
10052140-11 = "말도, 아, 안 돼요……! 어떻게, 어떻게 이런 일이……!!!"
10052140-16 = "……."
10052140-17 = "경보 꺼."
10052140-19 = "경보 출력 중지."
10052140-24 = "소, 소프……?"
10052140-25 = "괜찮은 건가요?! 그래도 돼요!?"
10052140-27 = "바뀔 건 없잖아. 그냥 이런 상황이 된 거야. 그게 전부고."
10052140-28 = "아니야?"
10052140-30 = "……."
10052140-31 = "그건, 그렇죠……."
10052140-32 = "아인. 준비는 어느 정도 됐어?"
10052140-33 = "모, 모두, 괜찮아요! 거의 끝나 가요!"
10052140-34 = "오. 양쪽 전부요?"
10052140-35 = "네!"
10052140-37 = "그래. 그렇구나. 그러면……."
10052140-38 = "어쩔 생각이죠?"
10052140-39 = "뭘 어쩌겠어. 여기까지 오셨잖아."
10052140-40 = "환영 인사는 해 드려야지. 안 그래?"
10052140-41 = "……."
10052140-42 = "그 말이 맞네요. 어차피 두 개의 코어는 아직 우리 쪽에 있고."
10052140-43 = "아직은 모두 되돌릴 수 있는 범위이기도 하네요."
10052140-44 = "그런 거지."
10052140-45 = "그러면 나갈 건가요. 소프?"
10052140-46 = "응. 얼굴이나 한번 보자고."
10052140-48 = "저, 저도요……?"
10052140-49 = "아인은 여기에서 마무리 작업을 해 줘."
10052140-50 = "어떻게 보면 우리보다, 아인의 작업이 더 중요할 테니까."
10052140-54 = "네, 네에……!"
10052140-56 = "중앙 네차흐의 영역을 제외한, 강철대륙의 전 영역을 탈환하는 데 성공했어요."
10052140-57 = "와……. 이게 되려나 싶었는데, 정말로 되네……."
10052140-58 = "이런 일은 순서를 밟아 나가면, 통계적으로 최종 결과에 다다르게 되는 법이니까. 그렇게 놀랄 필요는 없어."
10052140-59 = "저…… 처음부터 순서대로 잘 안되었다거나, 했으면요……?"
10052140-60 = "그러면……."
10052140-61 = "지금쯤 강철대륙으로 뒤덮인 키보토스에서, 어떻게 살아갈지 고민하고 있지 않았을까?"
10052140-62 = "네, 네에……?!"
10052140-63 = "결과만 좋으면 대부분은 좋은 일이라는 말도 있지 않습니까. 잘 되었으니, 좋은 일이죠."
10052140-64 = "……그렇게 속 편하게 이야기할 만한 일이었나요, 이거……."
10052140-65 = "확률적으로는 거의, 낙타가 바늘구멍을 지나가는 것보다 더 어려운 일이었다고요……."
10052140-66 = "……양자역학적으로, 그 확률은 0이 아니고, 어느 정도 사실과 부합하는 측면도 있기는 하지만……."
10052140-67 = "그래도 아리스는 걱정하지 않았습니다! 선생님도 계셨고, 모두가 있고, 무엇보다 리오 선배가 돌아왔으니까요!"
10052140-68 = "나, 나……?"
10052140-69 = "네! 이른바 아군이 된 적 클리셰라는 겁니다! 이건 무적입니다!"
10052140-70 = "어……? 그렇지만 그건, 아리스가 리오 선배를 적이었다고 말해 버리는 것이 되고 맙니다…… 어떡하죠?"
10052140-71 = "죄송합니다. 리오 선배! 그럴 의도는 없었습니다!"
10052140-72 = "아, 아니야. 그때의 나는…… 분명…… 그런 측면이, 충분히 있었으니까……."
10052140-76 = "감사합니다. 리오 선배!"
10052140-81 = "모든 것의 시작에 대해, 생각해 본 적이 있습니까?"
10052140-82 = "?!"
10052140-84 = "가령 때로는 이런 질문을 던질 수 있겠지요."
10052140-85 = "……!"
10052140-90 = "우리는 어디에서 왔지?"
10052140-91 = "우리의 목적은 뭐지?"
10052140-92 = "모든 과정이 끝난 후, 우리는 어디로 향하게 되지?"
10052140-94 = "케이……!"
10052140-95 = "네. 아리스. 저도 들리고 있습니다."
10052140-97 = "신이라는 것은 어쩌면, 그것을 따르는 자들을 위한 규율일지도 모릅니다."
10052140-101 = "아리스? 케이? 무슨 일이라도 있나요?"
10052140-105 = "네? 그, 그게……!"
10052140-106 = "아뇨. 아무 일도 없습니다. 괜찮아요."
10052140-107 = "고, 고맙습니다. 케이……."
10052140-108 = "무슨 말씀을요. 이럴 때를 위해서 제가 있는 거니까요."
10052140-109 = "그렇지만…… 무슨 의미였을까요? 케이는 뭔가 알고 있는 것이 있나요?"
10052140-110 = "……정확한 부분까지는 저 역시 알 수 없습니다만."
10052140-111 = "그건 아마도, 우리들의 첫 시작과…… 관련된 것일 겁니다."
10052140-113 = "모두, 잠시만. 누군가가 오고 있는 것 같아."
10052140-120 = "……."
10052140-121 = "……."
10052140-122 = "[s1] \"좋은 날이네, 소프 쨩! 오르 쨩!\"\n[s2] \"아인 쨩은 같이 안 왔어?\""
10052140-125 = "……기가 막혀서."
10052140-126 = "으에……."
10052140-128 = "그러면 안 돼, 너희들. 사람이 인사를 했으면 같이 인사를 받아 줘야지. 그래야 착한 아이가 될 수 있다고?"
10052140-129 = "언제부터 우리가 서로 한가하게 인사 나눌 사이였다는 건가요, 이즈미모토 에이미……?"
10052140-130 = "그건 너무 긴 호칭이야. 다시 말해 효율적이지 않지. 그냥 에이미라고 불러 줘."
10052140-131 = "……네?"
10052140-132 = "자, 따라 해 봐. 에이미."
10052140-133 = "아니, 그게……."
10052140-134 = "에이미."
10052140-135 = "……알겠어. 에이미. 그리고 [USERNAME]선생님도."
10052140-136 = "응. 잘했어."
10052140-137 = "……."
10052140-138 = "8명의 예언자에게 이기고, 네차흐의 지배권을 대부분 가져간 것에 대해서는, 솔직하게 대단하다고 이야기해 줄게."
10052140-140 = "……쳇."
10052140-141 = "그래서 말입니다만. 지나간 과거는 세면대에 적당히 흘려보내 두고, 전학이라도 오지 않겠습니까?"
10052140-142 = "선생님께 다시 한번 확인 드려 보았습니다만, 역시 서류는 아직 많이 남아 있다고 하셨습니다."
10052140-143 = "물론 어떤 학원을 선택할지는 여러분들의 자유일 것이고, 키보토스는 수천 개의 크고 작은 학교가 모여 연방을 구성하고 있는 학원도시이므로."
10052140-144 = "원칙적으로는 여러분에게 수천 개의 가능성이 펼쳐져 있다고 볼 수 있겠습니다만."
10052140-145 = "저는 역시 밀레니엄 사이언스 스쿨을 추천 드리고 싶은 바이며–"
10052140-146 = "안 가요, 안 가. 좀 말이 통할 상대에게 그런 말을 하라고요."
10052140-147 = "지금이라면 특별히 리오 님께서 직접 디자인하신 전입 선물도 받으실 수 있을 겁니다."
10052140-148 = "어, 어어……? 난 그런 거 준비한 적 없는데……?"
10052140-149 = "말 좀 맞춰요!"
10052140-150 = "아, 알았어……."
10052140-151 = "어쨌든, 저희가 하고 싶은 말이 무엇인지는 알겠죠? 키보토스, 특히 밀레니엄은 언제든 모든 학생에게 열려 있는 곳이랍니다?"
10052140-152 = "아니, 안 간다니까. 정말로. 필요 없다고."
10052140-153 = "(이런 대화를 하고 있는 것도 한심하지만, 일단은 아인의 시간을 최대한 벌어 줘야 하니까 말이지…….)"
10052140-154 = "[s] \"아무리 그래도, 선생님은 여러분을 포기하지 않을 거예요~\""
10052140-155 = "우리도 포기 안 할 거거든요~ 어차피 이제 와서 서로 할 말 같은 건 없잖아요?"
10052140-157 = "어라? 그런데 너희들, 할 말 없다면서 왜 나온 거야?"
10052140-158 = "그, 그래요! 선생님은 어떤 경우에도 학생들을 포기하지 않으실 테니, 경우가 다르겠지만……!"
10052140-160 = "윽."
10052140-162 = "그, 그건. 그러니까……!"
10052140-163 = "뭐, 뭐어! 여기까지 왔는데, 얼굴 정도는 서로 봐야 하지 않겠어? 그런 거야!"
10052140-164 = "[s] \"아이고, 착한 아이들이네. 예의를 잘 알아. 기특하다, 기특해~\""
10052140-165 = "그렇군요. 역시 이왕 이렇게 된 거 조금만 더 해 보지 않겠습니까?"
10052140-166 = "뭘 어떻게 더 하란 건가요. 거기, 함부로 웃지 말라고요. 정들겠어요."
10052140-167 = "어머나. 저는 이미 어느 정도 그렇게 된 것 같기도 하네요?"
10052140-168 = "……거기, 다들 제정신이야? 당신들 입장에서 보면, 우리는 세상을 금속으로 뒤덮으려는…… 정체불명의 악당 세력일 텐데?"
10052140-169 = "괜찮아. 아직 잘 몰라서 그래. 학교 가서 잘 배우면 괜찮을 거야."
10052140-170 = "말 잘했어요, 에이미. 저도 이해한답니다. 다들 그 나이에는 철이 없는 법이죠."
10052140-171 = "……어떤 사람은 나이를 먹고도 철이 안 들기도 하지만요."
10052140-172 = "히, 히마리 선배……. 그렇게까지 말씀하시면……!"
10052140-173 = "괜찮아요, 유즈."
10052140-179 = "? 누구 이야기하는 거야? 일단 저 아이들은 아닐 것 같고……."
10052140-180 = "……보세요. 괜찮죠?"
10052140-181 = "네, 네에……."
10052140-182 = "[s] \"어쨌든, 사람은 공부를 해야 사람이 되는 법이에요.\""
10052140-183 = "우리 애초에 사람 아닌데요~"
10052140-184 = "[s] \"아니지. 경우를 알고 예의를 알면 사람이지. 그럼, 그럼.\""
10052140-185 = "자꾸 공부, 공부, 하는데. 우리 어차피 알 거 다 알고 태어났거든? 웬만한 건 모두 프로그램되어 있다고."
10052140-186 = "……그런 면에서, 우린 어차피 인간이 아니란 말이야."
10052140-187 = "[s3] \"다 안다고 생각하는 것이야말로, 모르는 게 많다는 소리란다!\"\n[s4] \"어제 맞았다고 생각했던 게, 오늘은 틀렸을 수도 있고!\""
10052140-191 = "선생님의 말씀이 맞습니다. 배움에는 끝이 없다는 말도 있죠."
10052140-192 = "그러니까 선생님. 돌아가면 여기에서 수업 일수를 빼먹은 만큼."
10052140-193 = "특별히 저에게 1대 1 교습을 해 주시는 것이 교육자로서의 의무가 아닐까요?"
10052140-194 = "……그거 정말, 수업 진도 따라잡기 위한 교습 신청 맞죠……?"
10052140-195 = "좋은 생각입니다, 토키! 아리스도 같이 하고 싶습니다!"
10052140-196 = "그, 그건……."
10052140-197 = "알겠습니다. 귀여운 아리스는 어쩔 수 없겠지요."
10052140-198 = "아니, 무슨 대화의 흐름이……."
10052140-199 = "……."
10052140-200 = "어쨌든, 그래서 당신들은 언제나 후회하곤 하지."
10052140-201 = "모든 걸 자기 위주로 바꿔 버리고는, 이렇게 될 줄 몰랐다거나 자기 의도가 아니었다면서."
10052140-202 = "그래. 그게 다른 사람이든, 자연이든, 세계 그 자체이든 간에 말이야."
10052140-203 = "모든 걸 엉망으로 만들어 놓고, 제대로 책임도 지려고 하지 않아."
10052140-204 = "그래서 말인데, 그런 거 하다 보면 후회가 남지 않아?"
10052140-205 = "뒤로 돌아가서 다시 시작하고 싶다는 생각 같은 거, 들지 않아?"
10052140-206 = "[s] \"……그건 그렇지. 후회는 언제나 남기 마련이니까.\""
10052140-207 = "……."
10052140-208 = "[s5] \"다시 그런 상황이 주어진다면, 이번에는 다르게 해 볼 거라고.\"\n[s6] \"누구나 한 번쯤은, 생각해 보지 않았을까.\""
10052140-211 = "……."
10052140-212 = "[s] \"하지만 후회가 남더라도, 뒤로 되돌아가지는 않을 거야.\""
10052140-213 = "……그건, 어째서죠?"
10052140-214 = "[s] \"우리가 뒤를 돌아보는 건, 앞으로 나아가기 위한 것이니까.\""
10052140-215 = "……!"
10052140-216 = "[s7] \"마지막까지 걸어가서 끝장을 보기 위해.\"\n[s8] \"지금까지 걸어왔던 길을 되새겨 보는 거니까.\""
10052140-220 = "[ns9] \"그렇게 앞서간 사람의 뒤를 이어 길을 내는 것이.\"\n[ns10] \"우리가…… 살아가는 방식이기도 하고.\""
10052140-223 = "……!"
10052140-224 = "인간이, 살아가는…… 방식……."
10052140-225 = "그러면, 우리는……?"
10052140-226 = "……."
10052140-231 = "아인? 거기에 있나요?"
10052140-235 = "네, 네에! 저, 저 여기에 있어요, 언니!"
10052140-236 = "미안해요. 부담을 지워서. 하지만 제가 거듭나고 있다는 것만은, 잘 알 것 같네요."
10052140-237 = "죄, 죄죄죄죄, 죄송해요! 저, 저희가 못나서…… 결국 언니의 손을……!"
10052140-238 = "아니에요. 저 역시 언니로서, 아인, 소프, 오르가 저를 의지해 줘서 기뻐요."
10052140-239 = "정말로, 제가 아인, 소프, 오르를 도울 수 있게 되어서, 다행이라고 생각한답니다."
10052140-240 = "네, 네에……!"
10052140-241 = "……."
10052140-242 = "소프, 오르. 드, 들리나요? 아, 아직 괜찮아요……. 우리는 할 수 있어요!"
10052140-243 = "……라고, 생각해요……!"
10052140-244 = "[ruby=DAATH]다아트[/ruby]의 준비는, 이제 막 끝났어요! 저도 곧 거기로 갈게요!"
10052140-251 = "그런가. 그렇구나."
10052140-252 = "그러면……!"
10052140-253 = "네. 그렇죠. 소프."
10052140-254 = "시간 끄느라 수고했어요."
10052140-258 = "좋아, 모두 잘 들으라고!"
10052140-259 = "부서진 것은 고치면 돼! 더럽혀진 신성은 다시 빛나게 만들면 되고!"
10052140-260 = "우리는 아직 다시 시작할 수 있으니까요! 당신들이 포기하지 않으려는 것처럼. 그리고, 그러니까……!"
10052140-261 = "뻗어 나간 가능성!"
10052140-262 = "지식을 통한 깨달음!"
10052140-264 = "호크마의 지혜! 게부라의 용기!"
10052140-265 = "그리고 합일로부터 드리워진 무형의 그림자!!!"
10052140-270 = "저 아이들, 뭘 하려는 거죠?"
10052140-271 = "저건…… 설마?!"
