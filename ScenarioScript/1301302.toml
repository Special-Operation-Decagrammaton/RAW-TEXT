[translation]
1301302-1 = "책을 찾는 여정"
1301302-2 = "도서관 내부"
1301302-4 = "전설의 회지를 찾는 거예요!"
1301302-5 = "[s1] \"엄청난 박력……!\"\n[s2] \"자, 잠깐. 우선 설명부터 해 줘.\""
1301302-8 = "아. 죄, 죄송해요, 선생님! 마음이 너무 앞선 나머지……"
1301302-9 = "그러니까…… 붉은겨울 학원 어딘가에, 과거 지식해방전선이 만든 전설의 회지가 묻혀 있다는 정보를 들었거든요."
1301302-10 = "지식해방전선의 전설의 회지라니, 뭔가 두근두근하지 않으세요?!"
1301302-11 = "분명 거기에는, 지식해방전선의 모든 역사와 전통과 그리고……"
1301302-12 = "하여튼! 지금 지식해방전선이 겪고 있는 모든 문제를 해결해 줄, 대단한 단서가 담겨 있을지도 몰라요!"
1301302-13 = "[s] \"그렇게까지……?\""
1301302-19 = "자, 빨리 전설의 회지를 찾으러 가요. 선생님!"
1301302-20 = "책은 약하고 상하기 쉽다고요? 지금 저희가 이러고 있는 순간에도, 회지는 습기를 머금은 채 돌이킬 수 없이 손상되고 있을지도 모르는 일이에요!"
1301302-21 = "어떻게 회지를 찾을 거냐고요? 걱정 마세요. 제가 다 방법을 준비해 뒀거든요!"
1301302-36 = "[ns] \"저기, 모미지……? 이건……?\""
1301302-41 = "왜 그러세요. 선생님?"
1301302-42 = "회지를 찾는 것 아니었냐고요? 네, 맞아요. 그래서 이 방법으로 접근하는 거고요."
1301302-43 = "뭔가 잘못되었나요?"
1301302-44 = "[s] \"이 방법은…… 어울리지 않는 것 같아.\""
1301302-45 = "무슨 말씀이세요. 선생님."
1301302-46 = "'다우징 로드'에 얼마나 오랜 전통과 경험이 담겨 있는데요."
1301302-47 = "원래는 수맥을 찾는 용도로 사용되는 도구지만……"
1301302-48 = "다우징의 원리를 잘 응용하면, 잃어버린 물건도 찾아낼 수 있다고요!"
1301302-49 = "쉿. 보세요. 지금 천천히…… 구리 막대가 회전하기 시작했어요."
1301302-53 = "이 회전이 좀 더 빨라지는 곳까지 가면……"
1301302-57 = "빙글빙글, 빙글빙글……"
1301302-61 = "여기예요! 분명 여기일 거예요."
1301302-62 = "이제 이곳을 제 RPG로 사격해 폭발시키면……!"
1301302-63 = "[ns] \"그러다 회지까지 산산조각나고 말 거야!\""
1301302-68 = "어? 그, 그러려나요……? 그러면 어떻게……?"
1301302-69 = "일단 진정하고 조금씩 땅을 파 보자고요? 하지만 붉은겨울의 동토는 대부분 얼어 있어서 삽이 잘 들어가지 않을 텐데……"
1301302-70 = "알겠어요. 선생님께서 그렇게 말씀하신다면……"
1301302-77 = "우우…… 벌써 1미터 넘게 간신히 땅을 팠는데, 아무것도 발견되지 않았어요……"
1301302-78 = "어째서일까요? 제 다우징 실력이 부족했기 때문일까요……?"
1301302-79 = "[s] \"다우징 실력과는 관계없을 거라고 생각해……\""
1301302-80 = "그럴까요? 그렇다면 이번에는 다른 방법으로 접근해 봐야겠어요."
1301302-84 = "바로…… 펜듈럼이에요!"
1301302-85 = "지금은 작게 흔들리는 진자이지만……"
1301302-86 = "찾는 물건의 근처에서는, 원형을 그리며 크게 흔들릴 거예요!"
1301302-88 = "다음은 자기장 센서를 활용하는 거예요!"
1301302-89 = "무료 어플을 다운받아서, 핸드폰에 내장된 자기 센서를 조금 응용하면……!"
1301302-91 = "지맥탐지기!"
1301302-93 = "타로 카드……!"
1301302-95 = "점성술……"
1301302-97 = "으애애애앵……"
1301302-98 = "[s] \"모, 모미지? 울지 말고……\""
1301302-99 = "하지만…… 하지만 어떻게 해도 회지를 찾을 수 없는걸요……"
1301302-100 = "[s] \"그렇게 중요한 거야?\""
1301302-101 = "……"
1301302-102 = "정말은…… 아무것도 아닐지도 몰라요."
1301302-103 = "찾고 보니 진짜 별것 아니었고, 이렇게 고생해 주시는 선생님께 보여드리기도 민망한 물건일 수도 있겠죠……"
1301302-104 = "하지만 그 회지는 어떤 의미에서 지식해방전선의 역사나 다름없어요……"
1301302-105 = "분명, 제가 보지 못했던 이런저런 만화나 그림, 자료들이 남겨져 있을지도 모르는 일이니까요."
1301302-109 = "그러니까 저는, 포기하고 싶지 않아요."
1301302-110 = "그저 죄송한 건…… 이렇게까지 고생해 주시는 선생님이죠……"
1301302-111 = "저, 선생님? 저는 괜찮으니까, 이제…… 돌아가 보셔도 돼요."
1301302-112 = "오히려 저 때문에 이렇게까지 신경 써 주셔서…… 정말 면목이 없네요."
1301302-113 = "오늘은 감사했어요, 선생님. 조심해서 들어가세요."
1301302-114 = "[s] \"자, 다음은 어딜 찾아보면 될까?\""
1301302-115 = "네, 네? 저기, 선생님께서는 애초에 이 일과 관련이 없으셨는데……"
1301302-116 = "마지막까지…… 같이, 찾아주시겠다고요?"
1301302-117 = "……"
1301302-118 = "고, 고맙습니다. 선생님. 정말…… 감사드려요! 그리고 다시 한번…… 죄송해요……"
1301302-122 = "……그렇게 감동적인 장면이 나오면, 보통은 목표를 이루기 마련인데……"
1301302-123 = "적어도 만화였다면 말이에요……"
1301302-124 = "우우…… 현실은 호락호락하지 않네요……"
1301302-125 = "[s3] \"어쩌면…… 지식해방전선의 회지는……\"\n[s4] \"우리들의 마음속에 있는 것인지도 몰라……\""
1301302-128 = "도중 출하되는 만화 마지막화에서 나올 법한 대사네요……"
1301302-132 = "잠깐만요, 선생님. 마음속…… 마음속……"
1301302-136 = "선생님, 혹시……!"
1301302-137 = "[s] \"왜 그래, 모미지?\""
1301302-138 = "우리, 도서관으로 가 봐요!"
1301302-140 = "도서관 가장 안쪽…… 창고로 쓰이는 공간……"
1301302-141 = "아무도 찾지 않았던 곳…… 여기라면 혹시……?!"
1301302-142 = "……!"
1301302-146 = "찾았어요, 선생님! 지식해방전선의 회지예요!"
1301302-147 = "[s5] \"이런 곳에 있었다니……! 축하해, 모미지!\"\n[s6] \"등잔 밑이 어둡다는 말 그대로네. 잘 됐어, 모미지!\""
1301302-150 = "네. 에헤헤. 정말…… 기뻐요. 전부 선생님 덕분이에요."
1301302-151 = "예? 선생님은 그냥, 실없는 소리를 해 본 것뿐이라고요?"
1301302-152 = "아뇨. 그래도 그 말씀 덕분에 여기를 생각해 낸 거잖아요."
1301302-153 = "거기에…… 오늘 하루 종일, 저와 회지를 찾아 주시기도 했고요."
1301302-154 = "아, 회지 내용 말이죠. 참. 맞아요. 어디, 어디……"
1301302-160 = "……"
1301302-161 = "후후…… 뭔가, 조금 맥이 빠지기도 하네요."
1301302-162 = "서툴고, 풋풋하고, 어설프고……"
1301302-163 = "그렇지만 '하고 싶다'는 마음만은 확실하게 전해져 오는……"
1301302-164 = "마치, 코미센 초기 작품들 같은 동인지 모음집이에요……"
1301302-165 = "네? 실망스럽지 않느냐고요?"
1301302-166 = "전혀요. 이런 것도 분명히 지식해방전선의 역사와 기록인걸요."
1301302-167 = "물론, 이런 일상적인 동인지들이 지금 지식해방전선이 겪고 있는 문제들을 해결해 주지는 않겠지만……"
1301302-168 = "뭐라고 할까요. 용기가 나네요. 아주 오래전 선배들도, 이런 것을 만들었고…… 이렇게, 살아가고 있었다는 걸 실감하게 되니까요."
1301302-173 = "에헤헤. 선생님?"
1301302-179 = "저, 선생님이 계셔서, 정말 좋아요!"
