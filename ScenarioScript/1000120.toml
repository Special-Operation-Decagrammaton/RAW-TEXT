[translation]
1000120-1 = "열풍"
1000120-2 = "(에이미를 따라 밀레니엄 근처의 사막으로 조사를 나왔다.)"
1000120-3 = "(……꽤 오랜 시간 주변을 조사했지만, 별다른 특이점은 발견되지 않았다.)"
1000120-8 = "……으음……."
1000120-13 = "으으으으으음……."
1000120-14 = "[s1] \"……에이미?\"\n[s2] \"괜찮아? 혹시 피곤하다던가…….\""
1000120-17 = "……아."
1000120-18 = "아니야, 선생님. 신경 쓸 필요 없어."
1000120-19 = "그렇게 만족스러운 결과는 아니지만 이런 경우는 흔히 있는 일이니까."
1000120-25 = "이곳에 이상이 없다는 걸 확인하는 것만으로도, 충분히 유효한 데이터를 얻었다고 할 수 있지."
1000120-26 = "이런 장시간 야외활동은……. 이미 익숙하고."
1000120-27 = "오히려 걱정된다면 선생님 쪽인데……."
1000120-28 = "선생님이야말로 괜찮아? 걸음걸이가 확실히 처음보다는 느려져 있어."
1000120-29 = "[s3] \"음. 그럴지도…….\"\n[s4] \"지친 것보다, 더운 게 큰 것 같아.\""
1000120-32 = "확실히. 이런 날씨라면 더욱 그렇겠네."
1000120-33 = "그늘 하나 없는 지형. 내리쬐는 태양열. 바람도 제대로 불지 않고."
1000120-34 = "물은 충분히 챙겨 왔지만, 그래도 쉽게 지칠 만한 상황이 맞으니까."
1000120-35 = "나도 몸에 열이 많고, 괜찮은 것과 별개로 이미 전신이 땀 범벅이거든."
1000120-36 = "본래라면 이런 상황……. 곧바로 땀과 열을 배출하기 위해 탈의하는 게 맞겠지만……."
1000120-40 = "……알고 있어. 선생님은 말릴 테니까. 이미 비슷한 상황을 몇 번 겪어서 숙지해 뒀거든."
1000120-41 = "하지만…… 그래도 괜찮아."
1000120-42 = "말했었잖아? '이럴 때도 있겠다 싶어서 확실하게 준비해 뒀다'고."
1000120-43 = "바로……"
1000120-50 = "[ns5] \"휴대용 선풍기?\"\n[ns6] \"의외로 귀여운 물건이…….\""
1000120-54 = "……하지만 겉모습으로 판단해선 곤란해, 선생님."
1000120-55 = "이건 지금 상황에서 충분히 효율적인 장비라고 판단해서 가지고 온 것이니까."
1000120-56 = "애초에 이런 상황을 상정하고, 약간의 개조와 튜닝을 부탁한 것이기도 하고 말이지."
1000120-57 = "이렇게 스위치를 올리면……."
1000120-62 = "[ns7] \"뭐, 뭐야. 이 바람 출력은……?\"\n[ns8] \"약간의 개조 수준이 아니잖아!?\""
1000120-65 = "극단적인 상황에선, 극단적인 처방이라는 거지."
1000120-66 = "바람을 오래 쐬고 있을 여유가 없는 만큼, 빠르게 체온을 내리기 위한 조치야. 바람이 강하다면, 필요 시간도 줄어들잖아?"
1000120-67 = "그럼……."
1000120-71 = "자, 선생님. 이제 이쪽으로 와."
1000120-75 = "출력이 강하다고는 해도 휴대용 선풍기. 바람을 쐴 수 있는 범위 자체는 그리 넓지 않아."
1000120-76 = "효율적으로 두 사람 모두의 체온을 내리기 위해서라도, 지금은 가까이 붙어 있을 필요가 있어."
1000120-77 = "다시 말해 최대한 서로 몸을 밀착할 필요가 있다는 거지. 내 말 이해했지?"
1000120-81 = "……? 선생님?"
1000120-82 = "왜 가만히 있는 거야? 가까이 오라고 했잖아."
1000120-83 = "……괜찮다고?"
1000120-84 = "몸을 너무 붙이지는 않는 게 좋을 거 같다고? 어째서?"
1000120-85 = "……논리가 설명이 안 돼. 선생님, 지금 선생님은 나랑 떨어져 있을 이유가 없어. 지금은 효율을 우선해야 할 상황이야."
1000120-86 = "……으음……."
1000120-87 = "이리 오라니까."
1000120-92 = "……이리 와. 선생님."
1000120-94 = "(………….)"
1000120-95 = "(이후 에이미와 함께 딱 붙어서, 에이미의 선풍기를 같이 쐬며 쉬는 시간을 가졌다.)"
1000120-96 = "(하지만 에이미의 몸에서 난 열기 때문에, 선풍기 바람도 결국 열풍으로 바뀌어 버렸다…….)"
