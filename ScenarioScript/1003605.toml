[translation]
1003605-1 = "수풀 속에서"
1003605-2 = "트리니티 성당 내부"
1003605-3 = "(히나타의 자신만만한 표정을 기대하며 트리니티의 성당을 들렀다.)"
1003605-4 = "(미사 시간이 아니어서 그런지 넓은 성당 안에는 학생들의 모습이 보이지 않았다.)"
1003605-8 = "(그리고 예배당 한쪽 구석에, 또 무방비하게 열려 있는 문이 보였다.)"
1003605-9 = "[s1] (뭔가 기시감이 드는 상황인데…….)\n[s2] ……열린 문을 따라 들어간다."
1003605-15 = "트리니티 성당 뒤편 공원"
1003605-16 = "(문 너머에는 성당 뒤편에 만들어진 넓은 공원이 펼쳐져 있었다.)"
1003605-17 = "(척 봐도 성당 사유지처럼 보였던 그 공원 한 곳에서 나무 손질을 하고 있던 히나타가 보였다.)"
1003605-18 = "흠흠~흠. 흠흠흠~."
1003605-19 = "……?"
1003605-20 = "……어……. 선생님……?"
1003605-21 = "[s] \"안녕.\""
1003605-22 = "어……. 네, 네……. 안녕하세요……?"
1003605-23 = "……어라."
1003605-24 = "그런데 선생님, 어떻게 여길 오신 건가요? 여긴 개방시간 외에는 외부 분들이 오실 수 없을 텐데……."
1003605-25 = "……아."
1003605-26 = "뭔가 지금……. 약간 기시감이 드는 것 같은데……."
1003605-27 = "기분 탓……일까요? 기분 탓이겠죠, 역시? 아하하하하……."
1003605-28 = "[s3] \"아니. 나도 마찬가지야.\"\n[s4] \"걱정 마. 이번에는 문 닫고 왔으니까.\""
1003605-29 = "여, 역시! 역시 그런 거였군요!! 저 또 문을 열어놓고 와서……!"
1003605-30 = "여, 역시! 역시 그런 거였군요!! 저 또 문을 열어놓고 와서……!"
1003605-31 = "으, 으으……! 나는 또 똑같은 실수를 이렇게 반복해서……!"
1003605-32 = "[s5] \"뭐, 그럴 수도 있지.\"\n[s6] 히나타를 위로해준다."
1003605-33 = "흐으……. 그래도……!"
1003605-34 = "흐으……. 그래도……!"
1003605-35 = "……아. 문은 선생님께서 대신 닫아 주신 거군요."
1003605-36 = "감사합니다, 선생님. 또 선생님의 도움을 받았네요."
1003605-37 = "무, 물론 선생님께서 여기 계신 것부터가 저에겐 실책이긴 하지만……. 아하하……."
1003605-38 = "……음? 저요? 저야 아까도 말씀드렸듯, 공원을 관리하고 있었답니다."
1003605-39 = "네? ……전부 다 제가 담당하냐고요? 뭐, 일단은 그렇죠……?"
1003605-40 = "관리 담당자라는 게, 꼭 성당 안의 비품들만 취급하는 건 아니니까요."
1003605-41 = "아. 하지만 걱정 마세요. 이젠 무리하게 전부 다 제가 끌어안진 않으니까요."
1003605-42 = "일이 많을 때라면 다른 자매님께 부탁드리기도 하고……. 전보다 많이 편해졌어요."
1003605-43 = "……이것도 다 선생님 덕분이겠지요."
1003605-44 = "오늘 일은 정말로 혼자서도 충분히 할 만한, 여유 있는 일이니까 혼자 하는 것뿐."
1003605-45 = "이전 같았다면 지금도 굉장히 당황하고 있었겠지만, 지금의 저는 그래도 아주 조금 다르니까요……!"
1003605-46 = "그러니……."
1003605-52 = "……!?"
1003605-53 = "[s7] \"……아. 긴급상황.\"\n[s8] 얼른 주변의 수풀 속으로 숨는다."
1003605-61 = "히나타 자매님~. 히나타 자매님 계신가요~?"
1003605-62 = "여기 계신 거 맞죠?"
1003605-63 = "네. 아까 직접 말씀도 들었는 걸요."
1003605-64 = "……. 그런데 안 보이시는 걸요. 어디 계신 걸까요……?"
1003605-66 = "서, 선생님. 이건……."
1003605-67 = "……곤란하게 됐네요. 설마 이 시간에 다른 자매님들이 여길 찾아오실 줄은……."
1003605-68 = "게다가 으음……. 서, 선생님……."
1003605-69 = "이 수풀……. 뭔가 너무 좁아서……. 좀……."
1003605-73 = "……? 뭐, 뭐죠, 저건?"
1003605-74 = "어……. 그, 글쎄요. 저도 잘……."
1003605-75 = "크, 큰일이다……. 아무래도 저희 쪽 기척을 눈치 챈 거 같아요……!"
1003605-76 = "[s9] \"……? 그런데 히나타는 왜 숨는 거야?\"\n[s10] \"나만 숨으면 되는 거 아니었을까?\""
1003605-77 = "……? 네?"
1003605-78 = "……? 네?"
1003605-79 = "……어라."
1003605-80 = "……그러게요. 생각해 보니 그런 거 같기도……."
1003605-81 = "계속 수풀에서 목소리가 들리는데……."
1003605-82 = "……크, 큰일이다. 이대로라면 들키겠어요!"
1003605-83 = "이, 일단 제가 얼른 나가서……!!"
1003605-89 = "펴, 평안하신가요, 자매님들……!"
1003605-90 = "어, 어쩐 일로 저를……? 아, 아하하하……."
1003605-91 = "히, 히나타 자매님!? 왜 거기서……!?"
1003605-92 = "그, 그러게요! 아하하……. 관리를 하다 보니 어쩌다가 그만……."
1003605-93 = "어쩌다가 그만이라니……. 그럼 방금 전 그 소리들……은……."
1003605-94 = "그, 그나저나 어떤 일로 찾으셨나요? 혹시 제가 뭔가 도와 드릴 거라도……?"
1003605-95 = "뭐, 뭐든지 괜찮으니까요! 어디죠? 어디로 가면 될까요? 지금 바로 가시죠!!"
1003605-96 = "아, 아아……. 네……. 우, 우선 그럴까요……?"
1003605-97 = "그……. 성당 안쪽에 책장 위치를 좀 옮겨야 해서……."
1003605-98 = "아아, 그 일 때문이셨군요. 좋아요, 지금 바로 가죠……! 저라도 괜찮으시다면 얼마든지 도와드리겠습니다!"
1003605-103 = "(…….)"
1003605-104 = "[ns] \"…….\""
1003605-106 = "[ns] 돌아간다."
1003605-108 = "(조용히 일어나 빠져나온 뒤, 샬레로 복귀했다.)"
