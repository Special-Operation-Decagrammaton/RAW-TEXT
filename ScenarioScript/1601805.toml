[translation]
1601805-1 = "대장의 강함"
1601805-2 = "[ns] \"헉…… 헉…….\""
1601805-3 = "……."
1601805-4 = "[s] \"헉…… 허억…… 헉…….\""
1601805-8 = "[ns] \"흐억…… 헉…… 헉…… 허억…….\""
1601805-10 = "[ns] \"흐윽…… 허억…….\""
1601805-11 = "언제까지 그러고 있을 생각이야……."
1601805-12 = "대체 얼마나 뛰어온 거야?"
1601805-13 = "[s] \"샬레에서 여기까지 뛰어왔어.\""
1601805-14 = "보통은 대중교통을 타든지, 급하면 택시를 타든지…… 하."
1601805-15 = "그냥 블랙마켓이라고만 했는데 무작정 뛰어오고, 바보냐구……."
1601805-16 = "아니 이러면 뭐 엄청 대단한 거라도 보여줘야 할 것 같은데,"
1601805-17 = "진짜 별거 아니란 말야. 미안하게스리."
1601805-18 = "자, 이거 봐."
1601805-19 = "[s1] \"자판기?\"\n[s2] \"자판기 샀어? 대단한데?\""
1601805-20 = "응, 자판기."
1601805-21 = "그럴 리가 있겠냐고!"
1601805-22 = "보통 자판기가 아니야. 엄청나게 싸잖아?"
1601805-23 = "봐봐, 한 병에 20엔밖에 안 한다구."
1601805-24 = "선생이 이 근처 지날 때, 목마르면 여기서 사 먹으면 좋잖아? 값도 싸구."
1601805-28 = "그, 그냥 그렇다구."
1601805-29 = "[s3] \"라브가 알려주는 블랙마켓 극비 정보…….\"\n[s4] \"메모해 둬야겠어…….\""
1601805-32 = "호들갑은 진짜!"
1601805-33 = "뭐, 기왕 이렇게 된 거 하나 사줄게."
1601805-34 = "최근에 일도 잘됐구, 이 정도 가격이면 한턱 쏠 수 있다고!"
1601805-35 = "[s] \"라브의 주스, 박물관에 전시할래…….\""
1601805-36 = "시끄러!!"
1601805-41 = "자."
1601805-42 = "[s5] \"라브의 주스, 잘 먹겠습니다!!!\"\n[s6] \"뼛속까지 스며드는 맛이야!!!\""
1601805-45 = "그렇게 뛰어왔으면 맹물이어도 맛있을걸."
1601805-46 = "으극,"
1601805-47 = "으윽, 이거 왜…… 으그그그그-!"
1601805-48 = "[s7] \"아파?\"\n[s8] \"열나?\"\n[s9] \"배고파!?\""
1601805-52 = "선생, 가끔 과잉보호한다는 말 안 들어?"
1601805-53 = "이 주스, 뚜껑이 너무 꽉 조여서 안 열려,"
1601805-54 = "으그그그극-!!"
1601805-55 = "으아!! 열받아!! 확 총으로 따버리고 싶네!!"
1601805-56 = "[s] \"줘 봐.\""
1601805-57 = "손 조심해, 엄청 꽉 닫혀서 맨손으로 하면 아플 거야."
1601805-58 = "안 열리면 나중에 고무장갑 끼고서……."
1601805-63 = "[ns] \"자.\""
1601805-64 = "……."
1601805-65 = "놀리지 마!!!"
1601805-66 = "[s] \"아직 아무 말도 안 했는데…….\""
1601805-67 = "하아……."
1601805-68 = "나 말이지, 그래도 다른 체력은 자신 있는 편인데,"
1601805-69 = "유독 악력만 엄청나게 약하거든. 그래서 원래는 애들 앞에선 병 음료도 잘 안 마시는데."
1601805-70 = "부끄럽게시리 선생 앞에서 약하단 걸 보여주게 되다니……."
1601805-71 = "[s] \"내가 맨날 병뚜껑 열어줄게.\""
1601805-72 = "무, 무슨 소리 하는 거야 대체!!"
1601805-73 = "아무튼! 내가 병뚜껑 못 땄다고 소문내면…… 박살 날 줄 알아!"
1601805-74 = "내 주스 이리 내!!"
1601805-75 = "[s] \"어엇…….\""
1601805-80 = "(그렇게 라브는 주스 병을 낚아채고 도망갔다)"
1601805-81 = "(그건 내가 마시던 거였는데…….)"
