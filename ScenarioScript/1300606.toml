[translation]
1300606-1 = "누군가의 특별한 의뢰"
1300606-2 = "야호, 선생님! 여기야. 여기."
1300606-3 = "[s] \"어마어마한 의뢰라니, 뭐야?\""
1300606-4 = "아하핫, 이게 음, 어마어마하다고 할까~?"
1300606-5 = "으음, 아냐……."
1300606-6 = "그것보다는 꼭 좀 선생님의 도움을 받고 싶은 의뢰라고나 할까?"
1300606-7 = "[s1] \"무츠키가 어마어마하다고 말할 정도라니 대체…….\"\n[s2] \"무츠키가 도움이 필요하다고 말할 정도라니 대체…….\""
1300606-8 = "쿠흐흣~ 글쎄~ 어떨까?"
1300606-9 = "쿠흐흣~ 글쎄~ 어떨까?"
1300606-10 = "자자, 이렇게 학생이 곤란해하고 있으니, 선생님은 당연히 내버려 둘 수 없겠지? 어울려줄 수밖에 없겠지~?"
1300606-11 = "[s] \"근데 흥신소 의뢰인데 왜 무츠키 혼자…….\""
1300606-14 = "어.울.려.줄.거.지."
1300606-15 = "선생님?!"
1300606-16 = "뭐어~ 여기까지 나온 이상, 어차피 선생님한테 거부권은 없지만!"
1300606-17 = "[s3] \"……으음, 거부권은 없는 거구나.\"\n[s4] \"뭐, 어쩔 수 없지…….\""
1300606-18 = "아하핫. 역시 선생님이라면 도와줄 줄 알았어!"
1300606-19 = "아하핫. 역시 선생님이라면 도와줄 줄 알았어!"
1300606-20 = "[s] \"그래서 의뢰라니, 뭐부터 하면 돼?\""
1300606-21 = "마침 이 종이에 의뢰 목록을 전부 적어 왔어."
1300606-22 = "[s] \"좋아, 어디 한 번 보여줄래?\""
1300606-25 = "아핫, 그건 곤란해~!"
1300606-26 = "고객의 개인 정보는 소중한 법이잖아~?"
1300606-27 = "아무리 선생님이라도 그걸 함부로 보여줄 순 없어."
1300606-28 = "[s] \"과연……, 무츠키는 프로구나.\""
1300606-29 = "쿠흐흣. 맞아. 이래 봬도 프로라구~"
1300606-30 = "흠흠. 자, 그럼 대망의 첫 번째 의뢰야."
1300606-31 = "그 내용은 바로……."
1300606-33 = "수제 디저트 가게 달짝지근"
1300606-34 = "[ns] \"……그 의뢰 내용, 진짜야?\""
1300606-35 = "응! 의뢰 내용에 따르면 '이곳 디저트 카페에서 판매하는 모든 크레이프를 먹어본 뒤…….'"
1300606-36 = "'그중 최강을 가려주세요.' 래!"
1300606-37 = "[s5] \"크레이프의 최강……!\"\n[s6] \"하지만 메뉴가 10가지가 넘는데?\""
1300606-38 = "아핫~ 최강은 중요하니까~ 문제는 예산인데……."
1300606-39 = "흐응~ 괜찮으려나? 어차피~"
1300606-40 = "괜찮아. 괜찮아. 다 먹을 수 있어. 그리고 어차피……."
1300606-41 = "경비 처리는 선생님의 지갑으로 하면 되니까~♪"
1300606-42 = "[s] \"엑…….\""
1300606-43 = "응응~? 학생의 부탁이니까. 당연히 들어줄 거지~? 선생님?"
1300606-44 = "소중한 학생이 의뢰를 해결하려고, 이렇~게 노력하고 있으니까."
1300606-45 = "아니면……."
1300606-46 = "안 돼……?"
1300606-48 = "[s] \"크, 큭! 어, 어른의 지갑을 얕보지 말라구~!\""
1300606-49 = "아하하핫! 고마워! 선생님!"
1300606-51 = "합. 으음~♪ 역시 딸기는 클래식해서 맛있네~"
1300606-52 = "하무, 바나나도 풋풋한 달콤함이 최고야~"
1300606-53 = "선생님은 어때?"
1300606-54 = "[s7] \"딸기, 바나나, 초코, 캬라멜……. 크레이프가 잔뜩…….\"\n[s8] \"입안이 달달해서 그야말로 단맛의 게슈탈트 붕괴…….\""
1300606-55 = "쿠흐흣, 선생님. 힘내! 이제 몇 개 안 남았어! 파이팅~!"
1300606-56 = "쿠흐흣, 선생님. 힘내! 이제 몇 개 안 남았어! 파이팅~!"
1300606-57 = "[s] \"오, 오우……!\""
1300606-59 = "(그렇게 무츠키와 함께 크레이프를 잔뜩 해치웠다.)"
1300606-61 = "아하핫, 크레이프의 최강이라고 해도, 음~ 역시 한 번에 정하긴 어려운 느낌~?"
1300606-62 = "[s] \"으윽, 아직도 입안이 텁텁해.\""
1300606-63 = "뭐, 됐구~ 다음 의뢰로 가자!"
1300606-64 = "[s] \"다음 의뢰라면……. 이 유원지에서 할 수 있는 거야?\""
1300606-65 = "두 번째 의뢰 내용도 간단해~"
1300606-66 = "그러니까……."
1300606-67 = "'여기 유원지에 있는 회전목마에서 어떤 말이 가장 빠른지' 조사해달래!"
1300606-68 = "[ns9] \"……회전목마?\"\n[ns10] \"가장 빠른 말?\""
1300606-73 = "[ns] \"그게…… 구분이 되나?\""
1300606-74 = "자자, 선생님. 그러지 말고 골라봐. 난 저 빨간 말로 할래!"
1300606-75 = "아마 다른 말보다 세 배쯤 빠르지 않을까!"
1300606-76 = "아! 움직이기 시작했다!"
1300606-77 = "[s] \"으, 으으음……?\""
1300606-79 = "(당연한 이야기지만, 회전목마들의 속도는 전부 똑같았다…….)"
1300606-81 = "아하핫, 아하하하~ 속도는 전부 똑같았네! 뭐, 어쩔 수 없나~"
1300606-82 = "쿠흐흣. 이번엔 세 번째 의뢰로 가자, 선생님!"
1300606-83 = "[s] \"으, 응…….\""
1300606-85 = "게헨나 제13도서관"
1300606-86 = "자~ 다음 의뢰는 여기, 도서관이야. (소근소근)"
1300606-87 = "[s] \"의뢰 내용이 뭐야? (소근소근)\""
1300606-88 = "그건 바로……."
1300606-89 = "'아무에게도 들키지 않고 책장 하나의 책등을 전부 거꾸로 놓아주세요.' 래."
1300606-90 = "[s] \"아니, 그건 그냥 단순한 민폐인 게…….\""
1300606-91 = "의뢰니까, 응? 해놓고 다시 돌려놓으면 되잖아? 응? 선생님~"
1300606-92 = "[s11] \"의뢰이기도 하고, 다시 돌려놓는다면야……\"\n[s12] \"하아, 어쩔 수 없지…….\""
1300606-93 = "아핫~♡ 땡큐~! 선생님!"
1300606-94 = "아핫~♡ 땡큐~! 선생님!"
1300606-96 = "(그 뒤로도 무츠키가 이끄는 대로 돌아다니면서 여러 가지 의뢰를 수행했다.)"
1300606-97 = "(그렇게 얼마나 돌아다녔을까.)"
1300606-99 = "[ns] \"의뢰도 제법 많이 해결했네.\""
1300606-100 = "쿠흐흣, 그러게."
1300606-101 = "[s] \"이제 얼마나 남았어?\""
1300606-102 = "아, 그게 말이야……."
1300606-104 = "남은 의뢰가 분명……."
1300606-106 = "아, 종이가……."
1300606-107 = "(무츠키가 놓친 의뢰서가 하늘로 날아올랐다.)"
1300606-111 = "[ns13] \"괜찮아! 무츠키. 내가 잡았어!\"\n[ns14] \"자, 어디 그럼 남은 의뢰 목록이…….\""
1300606-112 = "앗, 선생님. 내용을 들여다보면……!"
1300606-113 = "앗, 선생님. 내용을 들여다보면……!"
1300606-114 = "[ns] \"응? 이거 의뢰인 이름이……\""
1300606-116 = "[ns] \"의뢰인 이름이, 무츠키……?\""
1300606-119 = "에잇……!"
1300606-123 = "[ns] \"어, 어엇?! 무츠키?!\""
1300606-128 = "[wa:100]― 아아~ [wa:1050]아쉬워라."
1300606-130 = "― 쿠흐흣, [wa:1120]결국 들켜버렸네~♪"
1300606-133 = "[wa:100]― 선생님. [wa:1300]오늘의 [wa:300]귀여운 의뢰인은 [wa:2150]다름 아닌,"
1300606-135 = "― 이 무츠키 쨩이었습니다~"
1300606-138 = "― 그도 그럴게, [wa:600]"
1300606-140 = "[wa:50]― 원래부터 흥신소의 의뢰를 [wa:1200]나 혼자 [wa:700]해결할 리가 없잖아~?"
1300606-143 = "[wa:100]― 아핫, [wa:700]어땠어? [wa:600]선생님?"
1300606-145 = "― 그래도 내 장난~ [wa:1050]완벽하게 먹혀 들었던 거지?"
1300606-148 = "― 꺄핫, [wa:1150]뭐야, [wa:1450]선생님의 얼빠진 얼굴,"
1300606-150 = "― 무지 웃겨. [wa:850]아하핫~♪"
1300606-153 = "[wa:900]― 오늘 [wa:400]선생님이랑 [wa:750]여러 가지를 했네."
1300606-156 = "― 크레이프도 먹고, [wa:1200]유원지도 들렀고,"
1300606-158 = "― 아, [wa:550]도서관에선 [wa:650]공범이 되기까지……!"
1300606-161 = "[wa:100]― 아아~ [wa:1100]마지막까지 [wa:500]완벽하게 속일 수 있었는데, [wa:1950]아쉬워라~"
1300606-164 = "― 그래도 [wa:400]다음번에는 [wa:650]반드시 끝까지 [wa:850]속여줄 테니까."
1300606-166 = "[wa:50]― 기대하라구~!"
1300606-169 = "[wa:100]― 아, [wa:1400]오늘 [wa:500]엄청 [wa:1450]재밌었다!"
1300606-172 = "그럼, 장난이 들켰으니~ 나는 이만~!"
1300606-174 = "[ns] \"속았다…….\""
1300606-176 = "(깔깔거리며 손을 흔드는 무츠키가 저 멀리 사라질 때까지, 제자리에 못 박힌 듯 움직일 수가 없었다.)"
