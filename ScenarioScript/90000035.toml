[translation]
90000035-2 = "(확보해 온 PMC의 데이터를 분석하기 시작했다.)"
90000035-7 = "어때, 부장? PMC 쪽의 데이터는? 쓸만한 거라도 찾았어?"
90000035-8 = "……아뇨. 이쪽은 텅 비었어요."
90000035-9 = "비었다고?"
90000035-10 = "네. ……재미있네요. 발굴지에서 얻은 모든 정보는 암호화되어서 본사로 전송되고 있어요. 이쪽에는 어떤 정보도 남겨두고 있지 않네요."
90000035-11 = "흐음…… 보안 때문인가? 그치만 왜 그렇게까지 번거로운 짓을 하는 거지?"
90000035-12 = "그러게요. 평범한 사설 용병 기업이 어째서 이렇게까지 보안에 신경을 쓰는걸까요……? 이것만으로도 꽤 수상쩍긴 하군요."
90000035-13 = "그럼 목표를 카이저 코퍼레이션의 본사로 변경합니다."
90000035-14 = "그쪽은 침투하는 게 더 힘든 거 아냐?"
90000035-15 = "아무래도 그렇죠. 하지만……."
90000035-20 = "……. DB 침투 완료. 청순한 미소녀 해커인 저에게 불가능은 없어요."
90000035-21 = "오- 역시 부장. 미소녀는 관계 없다고 생각하지만."
90000035-22 = "관계 있어요. 미소녀의 기본 소양이니까요."
90000035-26 = "그럼 PMC가 뭘 숨기고 있는지 볼까요?"
90000035-30 = "흐음…… 과연."
90000035-31 = "있네."
90000035-32 = "네. 비나와의 전투 기록이에요. 그것도 상당히 많은 숫자네요."
90000035-33 = "……. PMC는 사막의 발굴지구에서 비나와 싸우고 있었던 거네요. 아니, 이 패턴이라면……."
90000035-34 = "비나가 발굴지구에 접근하지 못하게 PMC가 방어하고 있었다…… 에 가까우려나."
90000035-35 = "그러네요. 대체 거기서 뭘 하고 있는 거길래……."
90000035-41 = "……흐음. 발굴지 쪽은 데이터가 완전 봉쇄되어 있어요. 게다가 이건 처음보는 형태의 방화벽……"
90000035-42 = "후후, 건방지네요. 새로운 기술인가요? 해커의 혼이 끓는 느낌……."
90000035-43 = "패턴 자체는 흔한 난수 알고리즘의 OTP를 활용한 것이네요. 난이도가 낮은 대신 물리적 시간이 많이 소모되게 만들어두었네요."
90000035-44 = "즉, 여기서 침입자가 시간을 끄는 동안 패턴을 변경하겠다……라는 함정이죠."
90000035-45 = "하지만 이 정도라면 제가 4시간 정도만 투자하면……."
90000035-46 = "……부장. 발굴지의 정보는 이제 됐어. 다른 길로 새지 마. 비나를 찾아야지."
90000035-47 = "그치만 미소녀 해커의 혼이……."
90000035-48 = "그건 지금 목표가 아니잖아. 그리고 미소녀는 관계 없다고 생각해."
90000035-49 = "……."
90000035-50 = "[s] (시무룩해졌네…….)"
90000035-53 = "……네. 지금은 데카그라마톤의 예언자를 추격하는 게 더 중요하죠. 이건 다음에 기회가 되면 하고……. 후후…… 뭐 그렇죠."
90000035-54 = "(……성가시네.)"
90000035-55 = "그렇게 성가신 걸 바라보는 얼굴로 절 보지 말아줄래요? 전 아무렇지도 않거든요? 저는 아량이 넓거든요."
90000035-56 = "응. 미안."
90000035-63 = "[ns] (불편하다…….)"
90000035-66 = "다음화;정보수집 4 - 비나"
