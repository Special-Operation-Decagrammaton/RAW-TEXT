[translation]
1601902-1 = "비상사태의 메이드"
1601902-2 = "안녕하십니까. 선생님."
1601902-3 = "그러면 오늘의 업무를 시작하겠습니다."
1601902-10 = "괜찮습니다. 일일이 고마워하지 않으셔도 됩니다."
1601902-11 = "저는 다만 저에게 맡겨진 의무를 수행하고 있을 뿐이니까요."
1601902-12 = "그건 그렇고, 여기 있습니다. 커피입니다."
1601902-13 = "90℃로 예열한 데미타세에, 부르봉 푸엥튀 풀 시티 로스팅을, 융 드립으로 1.5온스 추출한 것입니다."
1601902-14 = "원두 본연의 맛과 향을, 가장 있는 그대로 음미하실 수 있을 겁니다."
1601902-15 = "겉옷은 이리 주십시오. 혹시 세탁물이 더 있으시다면, 언제든 말씀 주셔도 됩니다."
1601902-16 = "오늘의 업무 리스트는 이쪽에 정리해 두었습니다. 제 나름대로 우선순위를 선정해 두었습니다만, 자세한 부분은 선생님께서 판단해 주시면 될 듯합니다."
1601902-17 = "스트레스 경감과 적절한 당분 보충을 위해, 키르쉬토르테를 한 조각 준비했습니다."
1601902-18 = "걱정 마십시오. 무알콜 체리 리큐르를 사용했습니다. 커피와 함께 즐기시면 좋을 것입니다."
1601902-22 = "[ns] \"……토키야?\""
1601902-23 = "왜 그러시죠, 선생님?"
1601902-24 = "[s] \"너…… 원래 이렇게 잘했니……?\""
1601902-25 = "당연한 것입니다. 저는 완벽한 메이드이기에."
1601902-26 = "사실 이것도 기본 중의 기본만 하는 것입니다."
1601902-27 = "리오 님과 함께 있을 때는, 지금의 퍼펙트 메이드에서 한층 더 나아간, 하이퍼 퍼펙트 메이드 모드였으니까요."
1601902-28 = "[s] \"……그런데 나한테는 왜 그랬니……?\""
1601902-29 = "선생님은 알아서 잘 사시잖습니까."
1601902-30 = "[s] \"정말 그 이유였냐!\""
1601902-31 = "선생님. 저도 사람입니다. 쉴 땐 쉬어야 합니다. 안 그러면 고장 나기 마련입니다."
1601902-32 = "그리고 또 사람이 고장 날 때가 있는데, 그건 바로 지루함이 반복될 때입니다."
1601902-33 = "그러니까 선생님은 포상으로, 나중에 제 심심함을 달래 주셔야 합니다. 아시겠지요?"
1601902-34 = "아, 그렇다고 지금 심심하다는 것은 아니니까, 너무 걱정하지 않으셔도 됩니다."
1601902-35 = "오히려 가벼운 긴장감이 있어서, 딱 좋은 상태라고 해야 할 것 같습니다."
1601902-36 = "[s] \"그럼 지금의 나는, 알아서 잘 못 살고 있다는 뜻……?\""
1601902-37 = "그건 아닙니다. 저도 때와 상황은 구분할 줄 압니다."
1601902-38 = "무엇보다, 지금은 비상사태니까요."
1601902-39 = "그야말로, 서로가 서로를 도와야 하고 자기 역할을 다해야 할 때라는 것입니다."
1601902-40 = "그렇지 않으면, 내일을 바라볼 수 없게 될 테니까요."
1601902-41 = "[s] \"토키가 현실을 정확히 바라보고 있어서 기쁘구나…….\""
1601902-42 = "천만의 말씀입니다. 피스. 피스."
1601902-43 = "네? 그래도 이상한 부분이 조금 있는 것 같다고요?"
1601902-44 = "리오 님에게는 매일 잘해 주지 않았냐고요……?"
1601902-45 = "……."
1601902-46 = "선생님."
1601902-50 = "그분은, 매일이 비상사태였습니다."
1601902-51 = "[s] \"……우리 토키가 정말 고생이 많았구나…….\""
1601902-52 = "감사합니다."
1601902-53 = "아무튼, 그런 것입니다."
1601902-54 = "본래대로라면 상황에 걸맞게, 퍼펙트 메이드의 전투복인 메이드복으로 보좌해 드려야 하겠으나."
1601902-55 = "때와 상황에 미묘하게 맞지 않는 복장을 하고 있는 것은, 선처해 주셨으면 합니다."
1601902-56 = "[s1] \"곁에 있어 주기만 해도 도움이 되니까.\"\n[s2] \"고마워. 정말로 든든해.\""
1601902-59 = "그러면 말이 나온 김에, 24시간 밀착 경호는 어떠신가요?"
1601902-60 = "[s] \"어……?\""
1601902-61 = "몸을 씻겨 드릴 수도 있고, 등을 밀어드릴 수도 있고."
1601902-62 = "사람은 체온만큼의 온도를 가장 기분 좋게 느낀다는 근거 없는 이야기도 있으니."
1601902-63 = "침대를 제 몸으로 미리 덥혀 드릴 수도 있을 것 같습니다."
1601902-64 = "[s] \"잠깐만, 잠깐만!\""
1601902-65 = "아닙니다. 제 생각이 짧았군요."
1601902-66 = "이곳 온도는, 아쉽게도 평균 기온보다 약간 낮으므로."
1601902-67 = "바로 지금 제가, 몸으로 따듯하게 해 드리면 될 것 같습니다."
1601902-68 = "[s] \"마음만 받을 테니까!\""
1601902-69 = "사양하지 않으셔도 됩니다."
1601902-70 = "지금의 선생님은, 그 누구보다도 중요한 분이시니까요. 이 정도는 당연합니다."
1601902-72 = "(그렇게 가까이 달라붙으려는 토키와, 잠깐 술래잡기 같은 것을 해야 했다.)"
1601902-73 = "(토키는 심심하지 않게 되었는지, 나름 만족한 기색을 보였다…….)"
