[translation]
22250-1 = "제25화;밀레니엄 사이언스 스쿨"
22250-3 = "(그렇게 모두가 힘을 합친 끝에 에리두를…….)"
22250-4 = "(혹은 밀레니엄을…… 나아가 어쩌면 키보토스를 위협했을지도 모를 위기를 극복해낼 수가 있었다.)"
22250-6 = "……그렇게 되어 에리두의 시설은 제가 책임을 지고 폐쇄시키게 되었습니다."
22250-7 = "[s] \"고생이 많네. 히마리.\""
22250-8 = "뭐, 그때의 위협은 어찌어찌 막을 수 있었지만, 아직 밝혀진 건 아무것도 없으니까요."
22250-9 = "초현상특무부의 부장으로서 좌시할 수 없는 일이기도 하고…… 이게 대체 다 누구 때문에 이런 고생인지…… 싶기도 하지만."
22250-10 = "뭐, 그 누군가를 위해서……라고 해둘까요?"
22250-11 = "초천재병약미소녀 해커는 늘 바쁘다니까요."
22250-12 = "[s] \"응. 잘 부탁해.\""
22250-14 = "세미나의 집무실"
22250-15 = "(그리고 당사자인 리오에 이르러서는…….)"
22250-25 = "리오 회장?! 갑자기 무슨 소리예요?! 회장직을 내려놓고 물러나겠다니!"
22250-26 = "회장?! 회장 어디로 도망간 건가요?!"
22250-27 = "……아."
22250-28 = "유우카 쨩. 여기, 회장이 남긴 메시지가 있어요."
22250-29 = "뭐? 메시지?! 어디어디……."
22250-34 = "<미안해>……?"
22250-35 = "…………………"
22250-36 = "……미, 미안하다면 다야?!"
22250-38 = "(그리고 그다음으로는…….)"
22250-39 = "자~ 부장의 퇴원을 축하하며! 건배!"
22250-40 = "음, 건배."
22250-41 = "네~ 짠!"
22250-46 = "……이게 다 뭐 하는 거야?"
22250-47 = "후훗, 부장님이 무사히 퇴원하면 그걸 기념해 같이 뒤풀이를 하기로 했거든요."
22250-48 = "그래서 오늘은 이렇게 C&C 전원이 집합한 거야!"
22250-49 = "아니, 그건 그렇다 치는데 선생은 또 왜……?"
22250-50 = "[s1] \"초대받았어. 네루, 퇴원 축하해.\"\n[s2] \"역시 내가 온 건 민폐였으려나?\""
22250-51 = "아니, 그 말은 물론 고, 고맙긴 하지만……"
22250-52 = "윽……! 아니, 그런 건 아니지만……."
22250-53 = "자자, 그러고 있지 말고. 주인님도 마셔! 마셔!"
22250-54 = "베리타스가 빌려준 요괴 MAX라면 잔뜩 있으니까!"
22250-55 = "[s] \"……아, 응. 요괴 MAX 말이지.\""
22250-56 = "아스나 선배, 그렇게 집요하게 권하면 아무리 선생님이라도 곤란해하시니까……."
22250-58 = "후훗, 카린. 오늘만큼은 괜찮지 않나요? 다소 시끌벅적해도……"
22250-59 = "그쵸? 선생님?"
22250-60 = "[s] \"그건 상관없지만…….\""
22250-61 = "으음~ 이걸로는 흥이 안 살아서 그런가?"
22250-62 = "아!"
22250-63 = "차라리 모두 다 같이 바니걸 옷이었으면 더 좋았으려나?"
22250-64 = "응? 주인님."
22250-65 = "바니걸 차림이라니…… 곤란하다……"
22250-66 = "아니…… 선생님이 꼭 원한다면…… 불가능하지는……"
22250-67 = "[s] \"참아주라. 분명 이상하게들 쳐다볼 테니까!\""
22250-68 = "하아…… 이게 대체 누구를 위한 뒤풀이인 건지……."
22250-69 = "과연…… 뒤풀이 또한 바니걸 차림새로 한다."
22250-70 = "그것이 C&C 스타일이라는 것이군요. 배웠습니다."
22250-71 = "……하?"
22250-72 = "어머."
22250-73 = "……!"
22250-74 = "아핫~"
22250-75 = "제가 늦었네요. 선배님들."
22250-76 = "안녕~ 토키 쨩!"
22250-77 = "무, 무슨…… 아니…… 네 녀석이 왜…… 여기……?!"
22250-78 = "C&C 전원이 집합하는 뒤풀이 자리라길래 와봤습니다."
22250-79 = "넌 회장 전속이잖아?!"
22250-80 = "……안타깝게도 그 회장이 모습을 감추어 버린 상황이라."
22250-81 = "제가 어찌해야 할지 갈팡질팡하다가…… 마침 C&C가 떠올랐기에."
22250-82 = "그렇다고 자기가 때린 녀석의 퇴원 뒤풀이에 참가하는 게 어딨어?!"
22250-83 = "……네?"
22250-84 = "뭐가 이상하냐고 되묻는 것 같은 그 표정은 또 뭔데?!"
22250-85 = "앗! 부장! 너무해! 모처럼 토키 쨩이 와준 건데!"
22250-86 = "아니아니, 저 녀석. 얼마 전까지만 해도 우리랑 피 터지게 싸웠다고?!"
22250-87 = "[s] \"애들은 싸우면서 큰다고 하니까…….\""
22250-88 = "선생까지 그런 말을 하기야?!"
22250-90 = "아, 토키 양. 온 김에 여기 과자 좀 드실래요?"
22250-91 = "감사합니다."
22250-92 = "다음은 이거!"
22250-94 = "……음, 요괴 MAX의 맛은 심오하군."
22250-95 = "으으으?!?!"
22250-96 = "………"
22250-97 = "하아…… 뭐, 됐다."
22250-98 = "[s] \"네루……?\""
22250-99 = "뭐, 결국 위에서 까라면 까는 게 C&C니까."
22250-100 = "그래, 너도 결국 회장의 의뢰를 받아 활동했던 것뿐일 테고."
22250-101 = "네루 선배는, 보기보다 납득이 빠르시군요."
22250-102 = "이게 다 누구 때문인데?!"
22250-103 = "그건 그렇고…… 그때 보니까 싸움은 잘하더라? 제법 싸우는 방법을 알고 있던데?"
22250-104 = "네, 만전의 상태라면 네루 선배 정도는……."
22250-105 = "자아, 토키 양. 여기 요괴 MAX도 드셔보세요."
22250-107 = "네, 잠, ……아카네 선배, 그게, 웁……"
22250-111 = "……아앙? 뭐라고?"
22250-112 = "[s] \"……앞으로도 소란스러울 것 같네.\""
22250-118 = "(그렇게 커다란 일이 있고 난 직후라도 변함없이 시간은 흘러간다.)"
22250-142 = "(그건 마찬가지로 이곳에서도…….)"
22250-144 = "[ns] \"……해서 부르길래 찾아왔는데 말이야.\""
22250-145 = "아! 선생님! 어서 와!"
22250-146 = "지금 막 모두 다 함께 공부를 하던 참이거든!"
22250-147 = "[s] \"……무슨 공부?\""
22250-148 = "무슨 공부긴! 당연히!"
22250-149 = "우리들의 차기작인 <지나가던 귀여운 몬스터들을 같은 편으로 만들면서 레벨을 올리고 세계를 정복하는 수집형 육성전략 RPG>를 만들기 위한 공부지!"
22250-150 = "[s] \"저번에 말한 거랑 장르가 달라지지 않았어?!\""
22250-151 = "그거라면 엎어졌어요…… 진행이 도중에 막힌 바람에……."
22250-152 = "대신 그 사이에 언니가 새로운 장르에 도전해보고 싶다는 말을 해서……."
22250-153 = "[s] \"……또?\""
22250-154 = "또, 또라니……! 게임개발은 언제나 그런 법이라구?!"
22250-158 = "으앙! 아리스, 이 귀여운 몬스터 씨를 친구로 삼을 수가 없습니다!"
22250-159 = "앗! 아리스! 거기선 우선 배틀을 해서 체력을 깎아야 해!"
22250-160 = "그래야 포획하기 쉬우니까!"
22250-161 = "몬스터 씨는 아무런 짓도 안 했는데…… 아리스가 먼저 때리는 건가요?"
22250-162 = "앗, 그렇게 생각해보니, 뭔가…… 좀 이상할지도……"
22250-163 = "으으으, 하지만 게임이 원래부터 그런 시스템이라고 할까……."
22250-164 = "거기! 이상한 이야기만 하지 말고! 제대로 분석하자니까!"
22250-166 = "그, 처, 천천히 해도 되니까……."
22250-167 = "[s] \"좋아. 그럼 같이 해볼까.\""
22250-168 = "네! 선생님은 여기! 아리스의 옆에 앉으면 됩니다!"
22250-169 = "좋았어~ 다 모였으니! 팀 배틀 시작하자!"
22250-170 = "하아…… 정말."
22250-171 = "응……."
22250-173 = "(수많은 난관을 만나 부딪치고 깨지고 상처 입고 때로는 주저앉거나 울기도 하지만.)"
22250-174 = "(그럼에도 용사와 동료들의 모험은 앞으로도 계속된다.)"
22250-175 = "(그래, 언제까지고 계속해서.)"
