[translation]
84301300200-5 = "……역시나 그런 일이."
84301300200-6 = "(역시나……)"
84301300200-7 = "여기선 꽤 흔한 일인가 보네요."
84301300200-8 = "사실 일상다반사긴 하지. 그런 일 하나하나 다 C&C가 쫓아다니면, 우린 과로로 쓰러질걸."
84301300200-9 = "아까도 말했던…… '어디서 무슨 시끄러운 일이 일어나도 이상하지 않아'라는 말이 이런 뜻이었어."
84301300200-10 = "혹시라도 다친 데라든가…… 있다면 바로 이야기해 줘."
84301300200-11 = "아뇨. 정말로 괜찮아요. 신경 쓰지 말아 주세요."
84301300200-12 = "오히려 이런 부분을 계속 더 찾아다니고 싶네요."
84301300200-13 = "그런 상황들을? 어째서……."
84301300200-15 = "재밌으니까 그런 거 아냐? 나도 좋았는데?"
84301300200-16 = "선배……. 우리는 이 사람을 경호해야 하는 입장이야……."
84301300200-17 = "말괄량이 아가씨 같은 처지라서 죄송하네요. 하지만 아스나 씨의 말씀이 맞습니다. 저도 꽤 즐거웠어요."
84301300200-18 = "그러고 보니 아까 전에 '엔지니어부'라는 곳에 대한 이야기를 들었어요. 어쩌면 로봇 악어를 만든 곳도 그곳인 것 같다고 하더군요."
84301300200-19 = "거긴 어떤 곳인가요?"
84301300200-23 = "거, 거긴……!"
84301300200-24 = "엄청 재밌는 곳이지! 굉장히 신기한 것들을 많이 만든다고, 엔지니어부는!"
84301300200-25 = "선배……!!"
84301300200-27 = "후후, 그렇군요. 그럼 이번에는 그 엔지니어부로 직접 찾아가 보도록 할까요?"
84301300200-28 = "아무래도 조금 더…… 이 일에 대해 파고들고 싶은 기분이에요."
84301300200-29 = "……진심이야?"
84301300200-33 = "보기와 달리 피곤한 구석이 있는 아가씨네."
84301300200-34 = "죄송하지만 사실이에요. 그러니 그 부분은 이해해 주시고, 대신 더 편하게 대해 주셔도 괜찮아요."
84301300200-35 = "……안내해 주시겠어요? <엔지니어부>로."
84301300200-36 = "좋아-! 지금 바로 출발한다!"
84301300200-37 = "하아……."
84301300200-38 = "어쩔 수 없지. 클라이언트가 해 달라면 해 주는 게 우리의 기본 모토니까."
84301300200-39 = "의외로 엔지니어부라면 세미나 쪽에서도 조금 더 면밀히 검사했을 테고."
84301300200-40 = "……뭐, 별일 없겠지."
