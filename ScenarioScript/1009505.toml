[translation]
1009505-1 = "메이드를 기억해 주세요, 선생님."
1009505-2 = "그런데 생각해 보니 큰일 났어요!"
1009505-3 = "[s] \"갑자기 무슨 일이야, 미도리?!\""
1009505-4 = "그, 제가 선생님만의 메이드가 되겠다고 한 건, 메이드가 주인공인 게임의 원화를 구상하기 위해서였잖아요?"
1009505-5 = "그런데 떠올려 보니……."
1009505-17 = "저, 지금까지 선생님과 놀기만 한 것 같아요!"
1009505-18 = "[s1] \"괜찮아, 괜찮아…….\"\n[s2] \"학생은 원래 놀면서 크는 거야…….\""
1009505-21 = "그렇지만 학생의 본분은 원래 공부 아닌가요?"
1009505-22 = "[s3] \"아아, 미도리가 그런 말을 하다니…….\"\n[s4] \"선생님은 대견해서 눈물이 나올 것 같구나…….\""
1009505-28 = "아무튼 이대로는 안 돼요!"
1009505-29 = "오늘 하루만이라도 제대로 된 메이드 일을 해야겠어요!"
1009505-30 = "선생님! 지금부터 샬레로 가실 거죠? 같이 가요!"
1009505-31 = "[s] \"미도리? 그렇게 잡아 끌지 마! 미도리~?!?!\""
1009505-34 = "그러고 보니 선생님께서는 메이드의 종류에 대해 알고 계신가요?"
1009505-35 = "[s] \"전혀 모르겠는데……?\""
1009505-36 = "그렇군요……!"
1009505-37 = "흠, 흠. 우선…… 가장 높은 대접을 받았던 것은 레이디스 메이드라는 직책이었대요."
1009505-38 = "옷가지와 장신구를 관리하고, 옷 입기와 화장 등을 조력하는 것이 주된 임무였죠."
1009505-39 = "집의 안주인이 직접 고용하며 별도의 관리를 받았다고 해요."
1009505-40 = "그와 비슷한 정도의 대접을 받았던 것이 하우스키퍼."
1009505-41 = "하우스키퍼는 정확히 말하면 메이드에 들어가지 않아요. 집안 살림을 총괄하는 관리직에 가까웠죠."
1009505-42 = "메이드를 포함한 다른 사용인들을 다루는 최고위 관리직이면서, 인사 담당자이기도 했어요."
1009505-43 = "[s] \"오오……. 지식이 늘고 있어……!\""
1009505-44 = "그 아래로 있는 것이 하우스 메이드."
1009505-45 = "방의 관리와 청소 등, 주로 청결을 유지하는 작업을 도맡아 했다고 해요."
1009505-46 = "그리고 아이를 돌보는 너서리 메이드, 주방을 보조하는 키친 메이드."
1009505-47 = " 빨래를 담당하는 론드리 메이드, 일반적인 잡무를 도맡아 하는 체임버 메이드 등이 있었다죠."
1009505-48 = "이렇게 여러 직책의 메이드들이 있었던 것으로 보이지만……."
1009505-49 = "사실 가장 많은 수의 메이드 직책을 차지하고 있었던 것은, 메이드 오브 올 워크스라고 불리는."
1009505-50 = "모든 일을 도맡아 하는 1인 메이드였다네요."
1009505-51 = "대부분은…… 메이드를 1명 이상 고용할 만큼 재정이 넉넉하지 않았기 때문이라는 것 같아요."
1009505-52 = "[s] \"많이 알고 있구나.\""
1009505-53 = "네. 일러스트를 준비하면서 여러 가지로 조사했거든요."
1009505-60 = "그러니 저는! 오늘 하루만이라도 제대로 된 메이드가 되겠어요!"
1009505-61 = "샬레의 잡무는 모두 저에게 맡겨 주세요!"
1009505-63 = "(그렇게 기운 넘치는, 미도리의 일일 메이드 실습(?)이 시작되었다……!)"
1009505-65 = "메이드의 기본이라고 하면, 우선 청소겠죠!"
1009505-69 = "……집무실 구석에 먼지가 엄청나네요……."
1009505-70 = "보통 이런 곳은 꼼꼼히 정리하지 않아 먼지가 쌓이기 마련이기는 하죠."
1009505-71 = "사실 저희 게임개발부실이라고 해서 다를 것도 없구요……."
1009505-72 = "걱정 마세요, 선생님! 잘못 밞으면 미끄러져서 넘어질 정도로 깨끗하게 청소해 놓을게요!"
1009505-73 = "[s] \"그래도 사람이 미끄러지면 안 되지 않을까?!\""
1009505-76 = "다음은 식사 보조로군요!"
1009505-77 = "그렇다고 해 봤자, 배달 음식의 뒤처리 정도이긴 하지만요……."
1009505-78 = "그와는 별개로, 배달 음식 용기가…… 좀…… 많이 쌓여 있긴 하네요."
1009505-79 = "일단은, 분리수거를 하고 오겠습니다."
1009505-80 = "[s] \"면목이 없습니다…….\""
1009505-81 = "괜찮아요. 메이드니까요."
1009505-84 = "옷 단장을 보조해 드리는 것도 메이드의 역할이겠죠?"
1009505-85 = "[s5] \"저기, 미도리? 미도리 씨……?\"\n[s6] \"뭔가 기세가 심상치 않으십니다만……?\""
1009505-88 = "괜찮아요. 선생님. 저에게 몸도 마음도 모두 맡겨 주세요."
1009505-95 = "자, 옷매무새가 흐트러졌어요. 제대로 정리해 드릴게요."
1009505-100 = "네. 잘 되었네요. 거울도 가져다드릴까요?"
1009505-103 = "설거지도 메이드의 중요한 일이죠!"
1009505-107 = "……머그컵이, 조금 과장해서, 5층으로 쌓여 있네요……."
1009505-108 = "[s] \"그저, 죄송합니다…….\""
1009505-109 = "괜찮아요. 메이드니까요."
1009505-110 = "[s] \"그 말은 이미 하지 않았어……?\""
1009505-111 = "네. 자주 하지 않게 되었으면 좋겠네요."
1009505-120 = "오늘 하루는 왠지 보람찼던 것 같아요!"
1009505-121 = "이대로 쭉…… 선생님의 메이드가 되어도 괜찮지 않을까, 하는 생각마저 들 정도로요……."
1009505-122 = "[s] \"어, 음. 네. 그건 조금 곤란할 것 같아요…….\""
1009505-124 = "[ns] \"게임 개발을 위한 메이드 체험은, 잘 된 것 같아?\""
1009505-125 = "네……?"
1009505-129 = "아……!"
1009505-130 = "깜빡 잊고 있었어요……."
1009505-131 = "네? 그런 것도 잊을 만큼 푹 빠져서 메이드 일을 수행했으니…… 오히려 확실한 경험이 되었을 거라고요?"
1009505-132 = "위로해 주시는 것은 감사하지만요……."
1009505-133 = "그, 그러면요! 마지막으로!"
1009505-134 = "한 가지, 부탁드리고 싶은 것이 있는데요……?"
1009505-135 = "[s] \"부탁? 뭔데?\""
1009505-136 = "그, 저기, 그러니까요……!"
1009505-137 = "……."
1009505-138 = "표지에 사용될지 어떨지는, 지금으로선 모르겠지만……."
1009505-139 = "저의, 메이드로서 컨셉 샷을, 남기고 싶어요……."
1009505-140 = "그러니까…… 괜찮으시다면……."
1009505-141 = "선생님께서 그걸, 찍어 주셨으면, 좋겠어요……!"
1009505-146 = "(미도리에게 컨셉 샷에 대한 설정과 정황을 듣고, 샬레의 공간 중 적당한 장소를 찾아보았다.)"
1009505-147 = "(미도리가 설명해 준 컨셉이란, 바로……!)"
1009505-151 = "[wa:830]― [log=미도리 메이드]죄, [wa:1200]죄송합니다. [wa:1760]주인님![/log]"
1009505-152 = "[wa:2400]― [log=미도리 메이드]저, [wa:1160]또 다시 실수해 버려서, [wa:1900]넘어져서…….[/log]"
1009505-155 = "[wa:1330]― [log=미도리 메이드]괜찮…… [wa:1060]습니다. [wa:1700]주인님께서, 내리시는 질책이라면…….[/log]"
1009505-156 = "[wa:2650]― [log=미도리 메이드]어떤 것이라도…… [wa:1980]받아들일 테니까요…….[/log]"
1009505-159 = "[wa:830]― [log=미도리 메이드]……어, [wa:1240]어떤가요?[/log]"
1009505-162 = "[ns] \"지금 뭔가 엄청나게 하면 안 되는 일을 하는 것 같아!\""
1009505-163 = "[wa:830]― [log=미도리 메이드]하, [wa:490]하지만 [wa:1060]이건 그런 상황이니까요![/log]"
1009505-164 = "[wa:2790]― [log=미도리 메이드]사진을 찍어달라고 부탁한 건, [wa:3470]제 쪽이었고……[/log]"
1009505-167 = "[wa:1330]― [log=미도리 메이드]저기, [wa:1960]선생님?[/log]"
1009505-168 = "[wa:2340]― [log=미도리 메이드]오늘의 메이드 미도리는, [wa:2800]만족스러우셨나요?[/log]"
1009505-171 = "후아……. 뭔가, 개운한 기분이네요."
1009505-172 = "감사합니다. 선생님. 수고 많으셨어요."
1009505-176 = "어라, 표정이 왜 그러세요?"
1009505-177 = "[s] \"별거 아니야. 소수를 세고 있었어.\""
1009505-178 = "그런…… 가요?"
1009505-179 = "……후훗."
1009505-180 = "선생님. 저, 이번 일러스트는 정말로 최선을 다해 볼 거예요."
1009505-181 = "그리고 괜찮으시다면……."
1009505-182 = "누구보다 먼저, 완성품을 보여드리고 싶은데. 괜찮으실까요?"
1009505-183 = "[s] \"응. 기대할게.\""
1009505-184 = "네!"
