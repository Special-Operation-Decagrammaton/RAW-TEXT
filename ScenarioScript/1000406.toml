[translation]
1000406-1 = "따뜻한 햇볕의"
1000406-2 = "게헨나 근교 강변길"
1000406-4 = "……안녕. 선생."
1000406-5 = "[s1] \"무서운 히나 쨩이다!\"\n[s2] \"엄청 무게 잡고 있어!\""
