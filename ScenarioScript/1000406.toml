1000406-36 = "(히나가 몸을 돌려 무릎 사이에 걸터앉았다.)"
1000406-37 = "……."
1000406-38 = "[s] 히나의 체중이 느껴진다."
1000406-39 = "……어때? 이 정도는 버티라고 선생. ……어른이잖아."
1000406-40 = "……후후. 조금 불편한 듯 편안한……."
1000406-41 = "[s7] 히나의 정수리에서 좋은 향기가 나는 것 같다.\n[s8] 히나의 머리카락에서 좋은 냄새가 나는 것 같다."
