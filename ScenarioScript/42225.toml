[translation]
42225-6 = "큭……"
42225-10 = "(폭압의 충격으로 기폭 장치가……)"
42225-16 = "[ns1] \"……잡았다!\"\n[ns2] \"기폭 장치는 내가 확보했어!\""
42225-19 = "확인!"
42225-20 = "어디에 시선을 돌리는 거지, 츠키유키 소대장?"
42225-22 = "상대는 이쪽이다!"
42225-37 = "윽……"
42225-41 = "여전히 허점투성이군. SRT의 시험이었다면 방금은 감점 처리였다."
42225-45 = "……시험이었다면 그랬겠지요."
42225-46 = "하지만, 이곳은 시험장이 아닌 현실이고……"
42225-47 = "현실에서 정의는 언제나 승리하는 법이니까요!"
42225-48 = "현실에서, 정의는 언제나 승리한다고……?"
42225-49 = "그렇게 세상의 이치가 단순했더라면 문제가 여기까지 불거지지도 않았어."
42225-50 = "현실은 언제나…… 기대를 배반하는 법이니까."
42225-55 = "폭스트롯……"
42225-60 = "(이 소리는 설마 섬광탄을—)"
42225-62 = "……그리고 하나!"
42225-71 = "……선배 말이 맞았네요."
42225-72 = "손을 당기기 전에 머리로 먼저 들이받으니, 반응 속도를 0.5초 줄일 수 있었어요."
42225-76 = "무장의 해제를 부탁드립니다, FOX 1."
42225-77 = "하아……"
42225-78 = "그렇게 말을 잘 듣는 후배가 왜 이번만큼은 내 말을 믿지 않은 건지."
42225-79 = "……무슨 말씀이신가요?"
42225-85 = "오퍼레이션 룸에 들어오면 탄두를 기폭 시키겠다는 협박."
42225-86 = "그건 단순한 블러핑이 아니었어."
42225-87 = "나는 정말로 목숨을 버릴 각오를 하고 이곳에 남아 있었는데……"
42225-88 = "도대체 귀관은 무슨 생각으로 작전을 강행한 거지?"
42225-93 = "선배가 저희를 죽게 하는 선택을 할 거라고는 생각할 수 없었으니까요."
42225-94 = "자신의 손을 더럽히면서까지 SRT 학원을 부활시키려는 건, 후학을 위해서라고. 전에 선배가 말했으니까요."
42225-95 = "오늘의 현실에 체념하여 미래에 모든 기대를 건 채, 자신의 목숨도 내던지는 사람이……"
42225-96 = "SRT의 내일이 될 후배들을 죽도록 내버려 둘 리가 없으니까요."
42225-101 = "……나는 너희가 꾸는 달콤한 꿈에 찬물을 끼얹고, 사회의 어두움에 대해서만 가르쳤어."
42225-102 = "명예로운 패배보다 비열한 승리가 낫다고, 그렇게 누차 강조해 왔었지."
42225-103 = "그런데도…… 나를 믿는다고?"
42225-104 = "선배가 전에 말씀하셨죠."
42225-107 = "SRT의 정의는 그 어떤 상황에서도 변하지 않는다고."
42225-108 = "세상의 풍파로 인해 먼지를 뒤집어쓰고, 스스로가 발하던 그 빛을 잃게 되더라도……"
42225-111 = "정의가 품고 있는 본래의 가치나 의미까지 퇴색되지는 않습니다."
42225-112 = "선배들은 저희의 꿈이자, 저희의 미래였어요."
42225-115 = "[ruby=FOX 소대]미래를[/ruby] 믿지 못했더라면…… 애초에 이 길을 택하지도 않았을 겁니다."
42225-117 = "그러니까…… 저희의 앞에서 도망치지 말아 주세요. 유키노 선배."
42225-122 = "……너무 먼 길을 돌아왔어."
42225-123 = "우리는 애초에 스스로가 질 수 있는 책임보다 더 큰 힘을 휘두르도록 설계된 조직이었으니까."
42225-124 = "총학생회장이 사라진 이후로, 우리는 계속 이 힘을 책임질 사람을 찾아왔었지."
42225-125 = "그대로 내려놓으면 모든 게 해결되는 일이었는데…… 우리는 타인에게서 물려받은 이 권위의 이름이 아까워 차마 그 힘을 포기하지 못했어."
42225-126 = "그래서 마침내 마주한 것이 과거의 그림자라니…… 운명이란 참 얄궂네."
42225-130 = "츠키유키 소대장. 유감스럽지만 이 탄두는 이곳에서 기폭 되어야 한다."
42225-131 = "과거의 책임을 과거의 SRT와 함께 이 [ruby=어비스]심연[/ruby]에 묻어버리기 위해서."
42225-132 = "그러니까…… 부탁이니 이곳에서 떠나줘."
42225-134 = "선배……!"
42225-139 = "[ns] \"……가끔은 어른에게도 책임을 받아들이기 어려운 순간이 있지.\""
42225-141 = "[ns] \"하지만 책임으로부터 도망쳐서는 안 돼.\""
42225-144 = "……[USERNAME] 선생님."
42225-145 = "선생님께서는 저희를 이해하지 못하시겠죠."
42225-146 = "선생님은 스스로의 힘도, 책임도 모두 감당할 수 있는 어른이니까요."
42225-147 = "만약 선생님이 저희처럼 감당하기 어려운 책임을 맞닥트린다면……"
42225-148 = "선생님께서는 어떤 선택을 하실 건가요?"
42225-152 = "[ns] \"……내일을 기다렸을 거야.\""
42225-153 = "……내일?"
42225-154 = "내일이 온다고 무엇이 달라질까요?"
42225-155 = "실수는 반복되고 결과는 달라지지 않습니다."
42225-156 = "한 번 쓸모를 잃은 무기는 폐기되어야 마땅합니다."
42225-157 = "[ns3] \"하지만 너희는 무기가 아니라 학생이니까.\"\n[ns4] \"다음번에는 더 잘할 수 있을 거야.\""
42225-160 = "다음번……?"
42225-161 = "선생님께서는 저희에게 다음 기회가 있다고 생각하시는 겁니까?"
42225-162 = "[s] \"물론이야.\""
42225-167 = "[ns5] \"모르는 부분이 있으면 새로 배우고……\"\n[ns6] \"어려운 일이 있으면 손을 내밀고……\"\n[ns7] \"괴로울 때는 서로 의지하며……\""
42225-171 = "[ns8] \"그렇게 성장해서 어른이 되면.\"\n[ns9] \"그때 책임을 지면 되는 거야.\""
42225-175 = "어른이 되면……"
42225-179 = "……우리는 어른이 아니었구나."
42225-187 = "아야야…… 사키, 저 녀석 또 배에다 쐈어! 이번에는 분명 고의였다고!"
42225-188 = "그러니까 가슴에 방탄판 하나 정도는 덧대라고 했잖아."
42225-189 = "하지만 작전 중에 방탄판을 착용하면 흉부가 압박되어서 호흡이 불편한걸……"
42225-190 = "……별것도 없으면서."
42225-191 = "시끄러워!"
42225-196 = "……결국 실패했구나, FOX 1."
42225-197 = "……그래. 실패했어."
42225-198 = "……소문만큼이나 이상한 어른이지?"
42225-199 = "그러게. 정말 이상한 어른이네……"
42225-205 = "……하지만 이런 어른이 있다면 안심하고 '오늘'을 마무리할 수 있겠어."
42225-213 = "우리의 패배다, 츠키유키 소대장."
42225-214 = "FOX 소대는 이것으로 항복이야."
42225-215 = "……어제의 우리가 틀린 선택을 하지 않았다는 것을."
42225-217 = "부디 너희의 손으로 증명해 줘."
42225-219 = "다음화;실패한 쿠데타"
