[translation]
32130-1 = "제13화;그럼에도 불구하고"
32130-2 = "(그 후로도, 보충수업부는 제3차 평가 시험을 준비하기 위해 매일 매일 노력을 멈추지 않았다…….)"
32130-24 = "제4차 보충수업부 자체 모의 시험 결과"
32130-25 = "하나코 - 100점 [007eff](합격)[-]"
