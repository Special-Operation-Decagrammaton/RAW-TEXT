32130-71 = "제6차 보충수업부 자체 모의 시험 결과"
32130-72 = "하나코 - 100점 [007eff](합격)[-]"
32130-73 = "아즈사 - 91점 [007eff](합격)[-]"
32130-74 = "코하루 - 83점 [FF6666](낙제)[-]"
32130-75 = "히후미 - 89점 [FF6666](낙제)[-]"
32130-82 = "마지막 평가 시험, 앞으로 6일."
32130-85 = "마지막 평가 시험, 앞으로 5일."
32130-88 = "마지막 평가 시험, 앞으로 4일."
32130-91 = "마지막 평가 시험, 앞으로 3일."
32130-94 = "마지막 평가 시험, 앞으로 2일."
32130-97 = "마지막 평가 시험, 앞으로 1일."
32130-100 = "……. 최후의 시간이 다가왔어요."
32130-101 = "……. 네. 내일이네요……."
32130-102 = "……."
32130-103 = "으, 으으……. 또 갑자기 바뀌거나 하는 건 아니지?"
32130-107 = "아우…… 3차 평가시험은 아직까진 우리가 알고 있는 대로예요."
32130-108 = "네. 제가 계속 지켜보고 있었어요. 시험범위는 저번에 공지된 대로이고, 90점 이상 합격."
32130-109 = "장소는 내일 트리니티 제 19분관 32교실. 외부에 있는 건물이지만 그렇게까지 멀진 않은 곳이에요."
32130-110 = "시간은 오전 9시. 시간 또한 그대로예요. 변경은 없어요."
32130-111 = "특별히 이상한 점은 없지만…… 어제부터 본관 쪽이 이상하게 조용한 느낌이네요. 인적도 뚝 끊겼고."
32130-112 = "그래도 혹시 모르니 오늘은 제가 계속 공지 게시판을 지켜보고 있을게요."
32130-113 = "아, 아우……. 하나코 쨩도 쉬어야 하는데."
32130-114 = "후후. 저는 괜찮아요. 제가 도울 수 있는 방법이 이런 것밖에 없어서……."
32130-115 = "아, 아니에요! 하나코 쨩이 엄청 쉽게 공부를 가르쳐 줘서 성적도 꽤 올릴 수 있었고…… 저도, 아즈사 쨩도, 코하루 쨩도 성적이 훨씬 더 올랐잖아요?"
32130-116 = "제 덕분이 아니라 모두가 열심히 해주셔서……."
32130-117 = "며칠째 잠도 제대로 자지 못하고 모두들 밤 늦게까지 고생하셨어요……"
32130-118 = "[s] \"……응. 할 수 있는 만큼 노력한 거 같아.\""
32130-119 = "네…… 그래도 평균 90점은 아슬아슬하지만…… 호, 혹시라도 내일 시험이 쉽게 나온다면……."
32130-120 = "……."
32130-121 = "아니! 그럴 리가 없잖아! 그런 요행같은 게 있을 거 같아?! 난 오늘도 밤 늦게까지 공부할 거니까!"
32130-122 = "100점! 100점을 맞을 거야! 그거라면 어떤 시비도 걸 수 없겠지!!"
32130-123 = "아우우…… 코하루 쨩…… 오늘만큼은 푹 쉬는 게……."
32130-124 = "맞아요. 코하루 쨩이 열심히 한 건 우리 모두가 다 알고 있으니까……. 오늘은 그만 쉬고 내일을 위한 준비를 하는게 맞을 거 같아요."
32130-125 = "맞아. 쉬는 것도 전략이니까."
32130-126 = "그건 아즈사 쨩도 마찬가지예요……. 쉬지 않으면 안 돼요……."
32130-127 = "……그러네. 알았어. 오늘만큼은 푹 쉬어두겠어."
32130-131 = "드디어 내일…… 우리 모두의 운명이 결정 나네요."
32130-132 = "……. 아니, 불안한 소린 하지 말자. 나는 반드시 합격할 거니까."
32130-133 = "나도야!! 누가 이딴 거에 질 줄 알고!"
32130-134 = "아하하…… 그러네요. 왠지 시무룩해져 있었달까…… 조금 더 파이팅하지 않으면……."
32130-135 = "네. 지금까지 우리는 최선을 다 해 왔으니까."
32130-136 = "[s] \"솔직히 위기이긴 하지만…… 그래도 지금까지의 노력을 믿자.\""
32130-137 = "네. 선생님."
32130-138 = "……네."
32130-139 = "음."
32130-140 = "……."
32130-142 = "마지막 평가 시험, 앞으로 1일."
32130-148 = "……."
32130-153 = "……."
32130-156 = "임무 날짜가 바뀌었다. 아즈사."
32130-157 = "……바뀌었다고?"
32130-159 = "그래. 내일 오전이다. 약속된 장소에서 명령을 기다리고 있어라."
32130-160 = "자, 잠깐. 사오리. 내일은……."
32130-161 = "문제라도 있나?"
32130-162 = "아직 준비가 끝나지 않았어. 계획보다 일정을 당기는 건 리스크가 너무 커."
32130-163 = "아니, 내일이다. 훈련받은 대로 준비하고 있어라. 시라스 아즈사."
32130-164 = "……."
32130-165 = "내일이면 모든 것이 바뀔 거다. 우리 아리우스에도, 이 트리니티에도. 비가역적인 변화가 일어나게 되겠지."
32130-166 = "트리니티 티파티의 호스트 키리후지 나기사의 헤일로 파괴. 그걸 위해 네가 거기 있는 거니까."
32130-167 = "……."
32130-168 = "세이아 때처럼 잘 해주리라고 믿는다. 너의 실력은 신뢰하고 있으니까."
32130-169 = "……. 이해했어. 계획이 그렇게 결정되었다면 이견은 없어."
32130-170 = "내일 임무에 차질 없도록 준비해두겠어."
32130-175 = "아즈사."
32130-176 = "……?"
32130-177 = "잊지 않았겠지? vanitas vanitatum."
32130-178 = "……모든 것은 헛되고 또 헛되니. 물론이야."
32130-179 = "어떤 노력도, 어떤 성취도, 그리고 어떤 실패도 결국은 최후의 최후에는 모두 무의미할 뿐이라는 걸."
32130-180 = "단 한 번도 그 사실을 잊어본 적 없어."
32130-185 = "……."
32130-187 = "……."
32130-189 = "다음화;고백"
