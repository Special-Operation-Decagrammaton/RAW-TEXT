[translation]
80000001-1 = "모모카의 도전"
80000001-2 = "총학생회 리셉션 룸"
80000001-4 = "(샬레의 업무차 총학생회를 방문하여 서류 작업을 하던 중에…….)"
80000001-5 = "(와작) 흐음…… 오늘도 감자칩이 맛있네."
80000001-6 = "어디 재미있는 일이라도 떨어져 있지 않으려나……."
80000001-7 = "[s] \"……….\""
80000001-8 = "뭐야, 왜 그런 표정으로 쳐다보는 거야?"
80000001-9 = "그런 눈으로 쳐다봐도 선생의 일은 조금도 도와줄 수 없어."
80000001-10 = "나는 지금 감자칩을 먹느라 지금 정신없이 바쁘다고. (와작)"
80000001-11 = "[s] \"아니, 그 감자칩 말인데…….\""
80000001-12 = "뭐야, 설마 내 감자칩을 노리는 거야?"
80000001-13 = "안 돼. 이 명란 맛 감자칩은 절대로 못 나눠줘!"
80000001-14 = "……응? 그게 아니라, 내가 왜 명란 맛 감자칩만 먹는지 궁금하다고?"
80000001-15 = "선생도 당연한 걸 묻네. 그야 맛있으니까. (와작)"
80000001-16 = "이 명란 맛 감자칩을 처음 입에 댄 순간 나는 운명적인 이끌림을 느꼈어."
80000001-17 = "적절하게 가미된 소금과 명란 특유의 감칠맛, 그리고 바삭한 식감까지……"
80000001-18 = "이보다 더 완벽한 음식은 태어나서 먹어본 일이 없어."
80000001-19 = "그런데 다른 과자를 입에 댈 필요가 어디에 있겠어? 괜히 입맛만 버리는 일이지."
80000001-20 = "[s] \"다른 맛 감자칩도 맛있을지도 모르잖아?\""
80000001-21 = "으음…… 그런가? 하긴, 새로 출시된 신제품을 먹어본 지도 꽤 오래되었으니까."
80000001-27 = "마침 가게에서 사은품으로 받은 발렌타인 기념 초콜릿 맛 감자칩이 남아있기도 하고……."
80000001-28 = "맛을 보는 정도라면 나쁘지 않겠지."
80000001-29 = "하읍…… (와작)"
80000001-32 = "……."
80000001-34 = "……어째서 감자칩에서 단맛이 나는 거야?"
80000001-35 = "[s] \"……초콜릿 맛이니까?\""
80000001-36 = "말도 안 돼! 감자칩은 언제나 짠맛이어야 한다고!"
80000001-37 = "새콤한 사워크림 맛까지는 사도라고 칠 수도 있겠지만, 이 초콜릿 맛은 절대로 용납할 수 없어!"
80000001-38 = "당장 가져다 버려야……."
80000001-42 = "으음…… 하지만 막상 버리려고 하니 뭔가 아깝기도 하고……."
80000001-44 = "저기, 선생. 그러고 보니 선생은 이번 발렌타인 데이에 초콜릿 받았어?"
80000001-48 = "자, 내가 주는 초콜릿이야. 받아."
80000001-49 = "[s] \"필요 없거든?!\""
80000001-50 = "에이, 부끄러워하긴. 사양하지 마."
80000001-51 = "나는 정말로 괜찮으니까!"
80000001-52 = "대신 초콜릿의 대가로 다음에 총학생회에 올 때 명란 맛 감자칩 한 상자만 사 와."
80000001-53 = "크크…… 그럼 기대하고 있을게?"
