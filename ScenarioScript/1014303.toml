1014303-182 = "คุณครู คุณครู! ต่อไปเราทำอะไรกันดีคะ?"
1014303-183 = "แล้วฉันอยากทำอะไรน่ะเหรอคะ? ไม่ต้องห่วงค่ะ! ตอนนี้ฉันเองก็เริ่มหนาวนิดๆ แล้ว..."
