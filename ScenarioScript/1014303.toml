1014303-75 = ""
1014303-76 = "เอาละครับ ถ้ามองไปทางขวาจากตรงนี้ จะเห็นโขดหินใหญ่ที่มีช่องคล้ายถ้ำอยู่ครับ"
1014303-77 = "รูปร่างโดยรวมของมันดูคล้ายกับควาย ก็เลยถูกเรียกว่าโขดหินควายด้วยครับ"
1014303-78 = "อ๊ะ ดูเหมือนอย่างนั้นจริงๆ ด้วยค่ะ!"
1014303-79 = "แล้วก็ว่ากันว่าช่องใหญ่ตรงนั้น เกิดจากเมื่อนานมาแล้วมีแม่ทัพคนหนึ่งยิงปืนใหญ่ระหว่างพนันกันครับ"
1014303-80 = "คงเป็นปืนใหญ่ที่ใหญ่มากจริงๆ สินะคะ..."
1014303-82 = ""
1014303-83 = "ดูเหมือนเราจะพายลงมากันได้ 30 นาทีแล้วนะครับ! เราจะพักกันตรงนี้สักครู่ครับ"
1014303-84 = "ช่วงพักต้องทำอะไรเหรอคะ?"
1014303-85 = "ทำอะไรก็ได้ครับ จะว่ายน้ำก็ได้ ลอยตัวในน้ำเฉยๆ ก็ได้ หรือจะพักผ่อนสบายๆ บนเรือก็ได้ครับ!"
1014303-86 = ""
1014303-88 = ""
