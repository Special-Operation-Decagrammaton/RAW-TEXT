[translation]
1014303-1 = "여름. 새로운 모습."
1014303-2 = "저 왔어요, 선생님!!!"
1014303-3 = "[ns] \"……….\""
1014303-4 = "어라? 왜 그러세요, 선생님?"
1014303-5 = "[s] \"새로운 모습이라는 게…….\""
1014303-6 = "에헤헤. 맞아요, 선생님. 새로우시죠?"
1014303-7 = "[s] \"그건, 맞는 말이긴 한데…….\""
1014303-8 = "자, 자! 어서 놀러 가요, 선생님!"
1014303-9 = "하루가 아깝잖아요? 이러는 중에도 시간은 흘러가니까요!"
1014303-11 = "(슈에링의 손에 이끌려, 케이블카로 향했다…….)"
1014303-15 = "저기 보세요, 선생님! 건물이 장난감 같아요!"
1014303-16 = "여기 산은 정말 신기하네요……. 꼭 종을 세워 놓은 것처럼 생기기도 했고, 땅에서 병풍이 갑자기 솟아난 것처럼 보이기도 하고……."
1014303-17 = "아, 그거 아세요? 여기에는 계수나무가 엄청 많대요!"
1014303-18 = "[s] \"그런데…… 몸은 괜찮은 거야?\""
1014303-19 = "네? 아, 회춘의 비약 말씀이군요?"
1014303-20 = "에헤헤. 문제없어요. 예전보다 훨씬 안전해졌다고 연단방…… 에서 직접 이야기를 들었거든요."
1014303-21 = "아, 그런데 그 대신 살짝 불안정해질 수도 있다고 했는데, 건강상에 직접 문제가 되지는 않을 거라고도 했어요."
1014303-22 = "[ns] (살짝 불안정해질 수도 있다……?)"
1014303-23 = "왜 그러세요, 선생님? 혹시…… '슈에링'과는…… 놀고 싶지 않으신 건가요?"
1014303-24 = "[ns] \"아니야! 그럴 리가!\""
1014303-25 = "다행이에요! 저는 혹시 선생님께서 저를 싫어하게 되신 건 아닌지, 걱정이 되었거든요."
1014303-26 = "네? 어떤 일이 있어도, 그럴 일은 없다고요?"
1014303-27 = "……."
1014303-28 = "사실 저도 알고 있었답니다! 감사해요!"
1014303-29 = "아, 케이블카가 멈췄어요!"
1014303-30 = "그래서 오늘 선생님과 같이 놀고 싶었던 것은……."
1014303-31 = "계곡 래프팅이랍니다!"
1014303-36 = "어서 오세요, 어서 오세요. 래프팅은 정말 신나죠."
1014303-37 = "하지만 위험할 수도 있으니, 제가 주의 사항을 하나씩 말씀드리겠습니다."
1014303-38 = "보트에는 저 역시 탑승할 테니, 너무 걱정은 하지 않으셔도 좋습니다."
1014303-39 = "가장 중요한 것은 첫째도 안전, 둘째도 안전, 셋째도 안전인데요."
1014303-41 = "실수로 보트에서 떨어져 물에 빠졌을 때는–"
1014303-43 = "그러면 출발하도록 하죠! 모두 노를 들어주세요!"
1014303-44 = "와아–!!!"
1014303-45 = "[s] \"여기는 물이 정말 차갑네요!\""
1014303-46 = "그럴 겁니다! 하지만 열심히 노를 젓다 보면 금방 또 덥다고 느끼실 거고요!"
1014303-47 = "하나, 둘, 셋!"
1014303-48 = "–셋!"
1014303-49 = "[s] \"셋!!!\""
1014303-51 = "(강사의 말에 따라 노를 젓기 시작했다!)"
1014303-62 = "아, 선생님! 저기 보세요! 급하게 흘러가는 물살이에요!"
1014303-63 = "이제부터 저 물살을 타게 되는 거네요!"
1014303-64 = "처음 시작이지만, 신을 좀 내 봐야죠! 바위 조심하십시오!"
1014303-69 = "꺄아–!!!"
1014303-72 = "(보트는 적당한 높이로 흔들렸다!)"
1014303-73 = "(계곡물이 물결치며 수영복을 적셨다!)"
1014303-75 = "자, 여기에서 오른쪽을 보시면 동굴 같은 구멍이 뚫린 큰 바위가 보일 텐데요."
1014303-76 = "전체적인 모양이 꼭 물소를 닮았다고 해서, 물소 바위라고도 불린답니다."
1014303-77 = "아, 그 말씀을 듣고 보니 정말 그렇게 보이는 것 같아요!"
1014303-78 = "그리고 저 커다란 구멍은, 오래전 어떤 장군님이 내기를 하다가 대포를 쏘아서 생겨났다고 하는데 말이죠."
1014303-79 = "정말 커다란 대포였나 보네요……."
1014303-82 = "벌써 30분은 노를 저어 내려온 것 같군요! 여기에서 조금 쉬도록 하겠습니다."
1014303-83 = "쉬는 시간에는 뭘 하면 되나요?"
1014303-84 = "뭐든 상관없답니다. 수영을 하셔도 되고, 그냥 물에 떠 있어도 되고, 아니면 보트에서 편히 휴식 시간을 가져도 되죠!"
1014303-89 = "그렇대요, 선생님! 우리 같이 수영해요!"
1014303-90 = "[s1] \"미안해……. 선생님은 조금만 이대로 앉아 있을게…….\"\n[s2] \"그 대신 슈에링이 수영하는 모습…… 사진 찍어 줄 테니까…….\""
1014303-93 = "제가 수영하는 모습을, 선생님이 사진으로요……?"
1014303-97 = "네! 그것도 좋아요!"
1014303-102 = "꼭, 오래오래 보관해 주셔야 해요?"
1014303-103 = "[s3] \"……?\"\n[s4] \"그, 그래……?\""
1014303-106 = "네! 에헤헤."
1014303-109 = "(슈에링은 물 속으로 들어가, 신나게 수영을 시작했다.)"
1014303-111 = "선생님! 저 지금 찍어 주세요!"
1014303-118 = "지금도요!"
1014303-126 = "지금 이런 모습은, 어떠세요……?"
1014303-127 = "[ns] \"?!?!\""
1014303-129 = "여기부터는 큰 급류 구간입니다! 긴장하세요!"
1014303-130 = "제법 높이 올라갔다가…… 확 내려갈 겁니다!"
1014303-135 = "와, 와아……. 한눈에 봐도, 그럴 것 같아요……!"
1014303-136 = "[s] \"우리 모두 조심하자……!\""
1014303-137 = "네!"
1014303-138 = "……시작이에요, 선생님!"
1014303-142 = "와아! 아하하하하!"
1014303-143 = "선생님! 이거 엄청나요! 대단해요!"
1014303-148 = "어어?!"
1014303-152 = "[ns] \"조심해!\""
1014303-164 = "잘하셨습니다! 그대로 선생님을 꼭 붙잡고 계세요!"
1014303-165 = "그, 그렇다고 하네요. 선생님."
1014303-166 = "에헤헤. 저 놓으시면 안 되니까요?"
1014303-167 = "……."
1014303-168 = "선생님의 품, 따듯하고…… 안심이 되어서……."
1014303-169 = "정말로, 좋아요."
1014303-170 = "[s] \"그, 그래…….\""
1014303-173 = "이것으로 오늘의 래프팅을 종료하겠습니다!"
1014303-174 = "감사합니다! 수고 많으셨어요!"
1014303-175 = "[s] \"수고 많으셨습니다!\""
1014303-176 = "그러면 계속해서 즐거운 관광 되셨으면 합니다. 좋은 시간 보내세요!"
1014303-181 = "선생님, 선생님! 우리 이제 뭐 할까요?"
1014303-182 = "저는 뭘 하고 싶냐고요? 걱정 마세요! 저도 지금 좀 쌀쌀해져서……."
1014303-183 = "뭔가, 맛있는 게 먹고 싶어졌거든요!"
1014303-187 = "아, 선생님! 저거 보세요!"
1014303-188 = "꼬치에 고기와 채소를 꽂아서 구운 바비큐네요……. 향신료 냄새가 엄청나게 맛있어 보여요!"
1014303-190 = "저건…… 쌀국수인가 봐요! 여기 쌀국수는 땅콩을 듬뿍 넣는 걸로 유명하대요."
1014303-191 = "한 그릇 사서, 나눠 드실래요?"
1014303-193 = "선생님, 선생님! 저 시원하고 달콤한 거 먹고 싶어요!"
1014303-194 = "여기 과일빙수가 맛있다고 해요! 과일뿐만 아니라 팥과 녹두, 젤리도 들어가 엄청 풍성하대요!"
1014303-196 = "(그렇게 슈에링과 함께, 상점 거리를 그야말로 완전히 공략했다.)"
1014303-197 = "(나중에는 배가 너무 불러서, 우리 모두 서로의 빵빵해진 배를 보며 한참이나 웃었다.)"
1014303-199 = "후아……. 조금 너무 먹었나 봐요. 몸에 다시 열이 오를 정도예요."
1014303-200 = "하지만 역시 더 수영을 하거나 물놀이를 할 힘은 없네요……."
1014303-201 = "……."
1014303-202 = "저, 선생님?"
1014303-203 = "[s] \"왜 그래?\""
1014303-204 = "오늘 제 어리광을 받아 주셔서, 감사해요."
1014303-205 = "[s5] \"에이, 그런 걸 가지고.\"\n[s6] \"얼마든지 더 응석 부려도 돼.\""
1014303-208 = "……."
1014303-209 = "역시 저, 선생님이 제일 좋아요!"
1014303-212 = "(슈에링은 강가의 맑은 물웅덩이에 앉아, 천천히 물장구를 치기 시작했다.)"
1014303-213 = "(조금 나른한 기분으로 그 모습을 바라보고 있었을 때……!)"
1014303-217 = "어, 어라?!"
1014303-218 = "[ns] \"응? 갑자기 왜……. 그래……?!?!\""
1014303-222 = "[wa:2020]― [log=슌 수영복]어, [wa:600]어어어?! [/log]"
1014303-225 = "― [log=슌 수영복]서, [wa:198]선생님!?[/log]"
1014303-227 = "― [log=슌 수영복]이건, [wa:550]그러니까……![/log]"
1014303-230 = "[wa:1210]― [log=슌 수영복]그, [wa:190]그그그, 그러고 보니[/log]"
1014303-232 = "― [log=슌 수영복]사야 양이, [wa:1030]살짝 불안정해질 수도 있다고 한 게, [wa:3040]혹시……? [/log]"
1014303-235 = "[ns] \"미, 미안해!\""
1014303-236 = "[wa:880]― [log=슌 수영복]아와와……?! [wa:120]왜 선생님이 사과하시는 건가요?![/log]"
1014303-238 = "― [log=슌 수영복]그보다……![wa:260] [wa:770] [wa:1520] [/log]"
1014303-241 = "― [log=슌 수영복]저, [wa:450]저는 어떻게 해야……![/log]"
1014303-244 = "[ns] \"이, 일단 자리를 비켜 줄까?!\""
1014303-245 = "[wa:660]― [log=슌 수영복]안 돼요![/log]"
1014303-248 = "― [log=슌 수영복]그, [wa:220]그게……![/log]"
1014303-251 = "― [log=슌 수영복]거기 계셔 주시겠어요? [wa:160] [/log]"
1014303-253 = "― [log=슌 수영복]숨을 테니까……[/log]"
1014303-256 = "[wa:2260]― [log=슌 수영복]저는…… [wa:1470]괜찮, [wa:880]으니까요.[/log]"
1014303-259 = "― [log=슌 수영복]선생님[wa:750]이라면…… [/log]"
1014303-261 = "― [log=슌 수영복]조금 더, [wa:1040]그대로 [wa:920]계셔 주셔도……[/log]"
1014303-264 = "(간신히 주위의 눈치를 살피다, 슌의 수영복을 가져다주었다…….)"
1014303-266 = "……."
1014303-267 = "[s] \"…….\""
1014303-268 = "뭐, 뭐라도…… 말 좀 해 주세요……."
1014303-269 = "[s] \"무슨 말을…… 하면, 될까……?\""
1014303-270 = "……."
1014303-271 = "몰라요……."
1014303-273 = "(역시 부끄러운 탓이었을까.)"
1014303-274 = "(슌은…… 그날 하루 평소보다, 조금 더 말수가 줄어들어 있었다…….)"
