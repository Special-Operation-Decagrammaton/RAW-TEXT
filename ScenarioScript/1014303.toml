1014303-90 = "ผู้ฝึกสอนว่าอย่างนั้นค่ะ คุณครู! เราไปว่ายน้ำด้วยกันเถอะค่ะ!"
1014303-91 = "[s1] \"ขอโทษนะ... ครูขอนั่งอยู่แบบนี้แล้วถ่ายรูปให้แทนดีกว่า...\"\n[s2] \"ครูขออยู่บนเรือ แล้วถ่ายรูปตอนชุนหลิงว่ายน้ำให้แทนนะ...\""
