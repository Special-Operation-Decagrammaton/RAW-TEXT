[translation]
1014303-1 = "A New Summer Look"
1014303-2 = "I'm here, Sensei!"
1014303-3 = "[ns] \"...\""
1014303-4 = "Huh? What's wrong, Sensei?"
1014303-5 = "[s] \"By a 'new side of yourself,' you meant...\""
1014303-6 = "Heeheehee. That's right, Sensei. It's \"new,\" isn't it?"
1014303-7 = "[s] \"You're right, but...\""
1014303-8 = "Then that's that! Let's go play, Sensei!"
1014303-9 = "We don't want to waste a single day! The clock's a tickin'!"
1014303-11 = "Shunling led me into the cable car..."
1014303-13 = ""
1014303-15 = "Look down there, Sensei! The buildings look like toys! Like for dolls!"
1014303-16 = "The mountain here is sooo interesting... Like a bell sitting upright...or like folding screens sticking out of the ground! See those, over there!"
1014303-17 = "Oh, did you know? There are lots of Katsura trees here!"
1014303-18 = "[s] \"But... Are you feeling okay?\""
1014303-19 = "Huh? Oh, you mean because of the Rejuvenation Elixir?"
1014303-20 = "Heeheehee. No biggie. I heard it's much safer than before... The Eastern Alchemy Society said that themselves!"
1014303-21 = "Oh, but they did warn me of something. Um... It's possibly \"less stable\"? But there's no health risks, so STOP worrying!"
1014303-22 = "[ns] \"(...Possibly 'less stable'...?)\""
1014303-23 = "What's wrong, Sensei? Do you not...want to play...with 'Shunling'?"
1014303-24 = "[ns] \"Of course I do!\""
1014303-25 = "Good! What a relief! I was worried you started to hate me."
1014303-26 = "Huh? That's \"never ever going to happen\"?"
1014303-27 = "..."
1014303-28 = "Honestly, yeah I knew that! But thank you for saying it!"
1014303-29 = "Oh, the cable car stopped!"
1014303-30 = "So, Sensei... The thing I want us to try today is..."
1014303-31 = "...river rafting!"
1014303-34 = ""
1014303-36 = "Welcome, welcome! NOW, I know we're all excited to get rafting..."
1014303-37 = "But it can be dangerous! So, everyone, listen closely! I'll explain a few safety rules so we can all have a fun time!"
1014303-38 = "...Of course, don't let this get you TOO worked up. I'll be right there with you on the raft. That said..."
1014303-39 = "What are the three most important rules to rafting? Safety, saaaaaafety, and SAFETY."
1014303-41 = "If you accidentally fall into the water, remember to..."
1014303-42 = ""
1014303-43 = "Let's go! Pick up your oars, everyone! Overhand grip! Relax those elbows!"
1014303-44 = "Wow!"
1014303-45 = "[s] \"The water's so cold!\""
1014303-46 = "As it should be! But keep rowing and you'll work up a sweat! Together, now!"
1014303-47 = "One, two, three!"
1014303-48 = "...Three!"
1014303-49 = "[s] \"Three!\""
1014303-51 = "We followed the instructor's commands. Soon, we were rowing!"
