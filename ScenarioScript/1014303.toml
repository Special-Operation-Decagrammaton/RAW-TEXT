1014303-62 = "อ๊ะ คุณครู! ดูตรงนั้นสิคะ! กระแสน้ำไหลเชี่ยวมากเลยค่ะ!"
1014303-63 = "จากนี้ไปเราจะล่องไปตามกระแสน้ำนั่นสินะคะ!"
1014303-64 = "ถึงจะเพิ่งเริ่มต้น แต่ก็มาเพิ่มความคึกคักกันอีกหน่อยนะครับ! ระวังหินกันด้วยครับ!"
