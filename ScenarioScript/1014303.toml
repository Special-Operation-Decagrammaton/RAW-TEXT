1014303-190 = ""
1014303-191 = "ส่วนนั่นก็... น่าจะเป็นก๋วยเตี๋ยวนะคะ! ได้ยินว่าก๋วยเตี๋ยวที่นี่ขึ้นชื่อเรื่องใส่ถั่วลิสงเยอะๆ ด้วยค่ะ"
1014303-192 = "เราซื้อสักชามแล้วแบ่งกันมั้ยคะ?"
1014303-193 = ""
1014303-194 = "คุณครู คุณครู! ฉันอยากกินอะไรหวานๆ เย็นๆ ค่ะ!"
1014303-195 = "ได้ยินว่าน้ำแข็งไสผลไม้ที่นี่อร่อยมากเลยนะคะ! ไม่ได้มีแค่ผลไม้ แต่ยังใส่ถั่วแดง ถั่วเขียว แล้วก็เยลลี่ด้วย เครื่องแน่นมากเลยค่ะ!"
1014303-197 = "(และแล้ว คุณครูกับชุนหลิงก็ได้ตะลุยกินในย่านการค้าด้วยกัน)"
1014303-198 = "(หลังจากนั้น ทั้งสองก็อิ่มจนท้องป่อง และหัวเราะกันอยู่นานเมื่อเห็นท้องป่องๆ ของกันและกัน)"
1014303-199 = ""
1014303-200 = "ฮู่ว... ดูเหมือนจะกินเยอะเกินไปหน่อยค่ะ ถึงขั้นร่างกายเริ่มอุ่นขึ้นมาเลย"
1014303-201 = "แต่ก็ไม่มีแรงเหลือจะว่ายน้ำหรือเล่นน้ำต่อแล้วละค่ะ..."
