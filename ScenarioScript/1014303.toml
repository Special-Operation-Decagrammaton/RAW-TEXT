[translation]
1014303-1 = "หน้าร้อนกับตัวตนใหม่"
1014303-2 = "ฉันมาแล้วค่ะ คุณครู!!!"
1014303-3 = "[ns] \"...\""
1014303-4 = "เอ๋? เป็นอะไรไปเหรอคะ คุณครู?"
1014303-5 = "[s] \"ที่ว่าตัวตนใหม่ๆ นี่...\""
1014303-6 = "ฮิฮิฮิ ใช่แล้วค่ะ คุณครู รู้สึกแปลกใหม่เลยใช่มั้ยคะ?"
1014303-7 = "[s] \"มันก็จริงอยู่หรอก...\""
1014303-8 = "มาเร็ว มาเร็วค่ะ! รีบไปเที่ยวเล่นกันเถอะค่ะ คุณครู!"
1014303-9 = "เสียดายเวลาออกนะคะ? ระหว่างที่เรามัวยืนอยู่แบบนี้ เวลาก็ผ่านไปเรื่อยๆ อยู่นะคะ!"
1014303-11 = "(คุณครูถูกชุนหลิงจูงมือไปยังกระเช้าลอยฟ้า...)"
1014303-13 = ""
1014303-15 = "ดูตรงนั้นสิคะ คุณครู! อาคารดูเหมือนของเล่นเลยค่ะ!"
1014303-16 = "ภูเขาที่นี่น่าอัศจรรย์จริงๆ เลยนะคะ... บางลูกก็เหมือนระฆังที่ตั้งอยู่ บางลูกก็เหมือนฉากกั้นที่จู่ๆ ก็โผล่ขึ้นมาจากพื้นดิน..."
1014303-17 = "อ๊ะ รู้มั้ยคะ? ได้ยินว่าที่นี่มีต้นคัตสึระเยอะมากเลยค่ะ!"
1014303-18 = "[s] \"แต่ว่า... ร่างกายไม่เป็นไรแน่นะ?\""
1014303-19 = "คะ? อ้อ หมายถึงยาคืนวัยเยาว์สินะคะ?"
1014303-20 = "ฮิฮิฮิ ไม่มีปัญหาค่ะ ฉันได้ยินจากชมรมวิจัยศาสตร์การปรุงยาโดยตรงเลยว่า... มันปลอดภัยกว่าเมื่อก่อนมากแล้วค่ะ"
1014303-21 = "อ๊ะ แต่ทางนั้นก็บอกว่าในทางกลับกัน มันก็อาจไม่เสถียรเล็กน้อย แต่จะไม่ส่งผลโดยตรงต่อสุขภาพค่ะ"
1014303-22 = "[ns] (อาจไม่เสถียรเล็กน้อย...?)"
1014303-23 = "เป็นอะไรไปเหรอคะ คุณครู? หรือว่า... คุณครูไม่อยากเล่นกับ 'ชุนหลิง'... คะ?"
1014303-24 = "[ns] \"ไม่ใช่นะ! ไม่มีทางเป็นแบบนั้นหรอก!\""
1014303-25 = "โล่งอกไปทีค่ะ! ฉันกังวลอยู่เลยว่าบางทีคุณครูอาจจะเริ่มไม่ชอบฉันแล้วหรือเปล่า"
1014303-26 = "คะ? ไม่ว่าจะเกิดอะไรขึ้น ก็ไม่มีทางเป็นแบบนั้นเหรอคะ?"
1014303-27 = "..."
1014303-28 = "อันที่จริงฉันก็รู้อยู่แล้วค่ะ! ขอบคุณนะคะ!"
1014303-29 = "อ๊ะ กระเช้าลอยฟ้าหยุดแล้วค่ะ!"
1014303-30 = "เพราะงั้น สิ่งที่ฉันอยากทำกับคุณครูต่อในวันนี้ก็คือ..."
1014303-31 = "ล่องแก่งในหุบเขาค่ะ!"
1014303-34 = ""
1014303-36 = "ยินดีต้อนรับครับ เชิญเลยครับ การล่องแก่งเป็นกิจกรรมที่สนุกมากจริงๆ ครับ"
1014303-37 = "แต่ก็อาจมีอันตรายได้เช่นกัน ผมจะอธิบายข้อควรระวังทีละข้อนะครับ"
1014303-38 = "ผมจะขึ้นเรือไปด้วย เพราะงั้นไม่ต้องกังวลมากเกินไปนะครับ"
1014303-39 = "สิ่งสำคัญที่สุด อย่างแรกก็ความปลอดภัย อย่างที่สองก็ความปลอดภัย และอย่างที่สามก็ยังเป็นความปลอดภัยครับ"
1014303-41 = "ถ้าพลัดตกจากเรือแล้วตกลงไปในน้ำละก็..."
1014303-42 = ""
1014303-43 = "ถ้างั้นก็ ออกเดินทางกันเลยครับ! ทุกคนยกไม้พายขึ้นครับ!"
1014303-44 = "ว้าว!!!"
1014303-45 = "[s] \"น้ำที่นี่เย็นมากจริงๆ เลยนะ!\""
1014303-46 = "ใช่แล้วครับ! แต่ถ้าพายเรือกันให้เต็มที่ เดี๋ยวก็จะรู้สึกร้อนขึ้นมาเองครับ!"
1014303-47 = "หนึ่ง สอง สาม!"
1014303-48 = "สาม!"
1014303-49 = "[s] \"สาม!!!\""
1014303-51 = "(คุณครูเริ่มพายเรือตามคำบอกของผู้ฝึกสอนล่องแก่ง!)"
1014303-52 = ""
