[translation]
1014303-1 = "夏季。煥然一新的模樣。"
1014303-2 = "我來囉，老師！！！"
1014303-3 = "[ns]「……」"
1014303-4 = "咦？老師你怎麼了嗎？"
1014303-5 = "[s] 「你說煥然一新的模樣是……」"
1014303-6 = "耶嘿嘿。沒錯，很新鮮吧？"
1014303-7 = "[s] 「確實是這樣沒錯……」"
1014303-8 = "來來來！我們趕快去玩吧，老師！"
1014303-9 = "時間可是很寶貴的哦？#n就連我們在這裡說話的時候，時間也正在流逝呢！"
1014303-11 = "（就這樣被小旬拉著手，一路朝纜車走去……）"
1014303-13 = ""
1014303-15 = "老師，你看那邊！建築物就像玩具一樣耶！"
1014303-16 = "這裡的山真是不可思議呢……#n既像是把鐘豎了起來，又像地面上突然冒出屏風一樣……"
1014303-17 = "對了，老師你知道嗎？聽說這裡有超級多的桂花樹哦！"
1014303-18 = "[s] 「話說回來……你的身體沒問題嗎？」"
1014303-19 = "咦？啊，是在說回春祕藥嗎？"
1014303-20 = "耶嘿嘿，沒問題的。#n煉丹術研究會的人親口告訴我，現在這種藥已經變得比以前安全很多了。"
1014303-21 = "雖然可能會有點不太穩定，但不會直接對健康造成問題。"
1014303-22 = "[ns] （可能會有點不太穩定……？）"
1014303-23 = "怎麼了嗎，老師？#n難道說……你不想和「小旬」……一起玩了嗎？"
1014303-24 = "[ns] 「當然不是！怎麼可能呢！」"
1014303-25 = "太好了！我還擔心老師會不會是討厭我了呢。"
1014303-26 = "咦？無論如何都不會有那種事嗎？"
1014303-27 = "……"
1014303-28 = "其實我一直都知道哦！謝謝老師！"
1014303-29 = "啊，纜車停了！"
1014303-30 = "那麼，今天我想和老師一起玩的是……"
1014303-31 = "溪谷泛舟！"
1014303-34 = ""
1014303-36 = "歡迎歡迎！泛舟真的很有趣哦！"
1014303-37 = "不過考慮到多少具有危險性，我會逐一向兩位說明安全須知。"
1014303-38 = "稍後我也會一起乘船，所以請不用太過擔心。"
1014303-39 = "最重要的第一點是安全，第二點也是安全，第三點還是安全。"
1014303-41 = "萬一不慎從船上掉入水中……"
1014303-42 = ""
1014303-43 = "那麼我們就出發吧！請大家舉起船槳！"
1014303-44 = "哇啊──！！！"
1014303-45 = "[s] 「這裡的水真的很冰呢！」"
1014303-46 = "那是當然的！不過只要努力划槳，很快就會暖和起來哦！"
1014303-47 = "一，二，三！"
1014303-48 = "──三！"
1014303-49 = "[s] 「三！！！」"
1014303-51 = "（依照教練的指示開始划動船槳！）"
1014303-52 = ""
1014303-56 = ""
1014303-57 = ""
1014303-58 = ""
1014303-60 = ""
1014303-61 = ""
1014303-62 = "老師！快看那邊！那裡有一段急流耶！"
1014303-63 = "我們接下來就要順著那道急流衝下去了呢！"
1014303-64 = "雖然才剛開始，但也該來炒熱一下氣氛了！請小心岩石！"
1014303-65 = ""
1014303-67 = ""
1014303-69 = "呀啊──！！！"
1014303-72 = "（橡皮艇以適當的幅度顛簸搖晃著！）"
1014303-73 = "（溪水激起波浪，浸濕了泳裝！）"
1014303-74 = ""
1014303-75 = "來，現在大家的右手邊，可以看見一塊有著巨大孔洞的岩石哦。"
1014303-76 = "因為整體的輪廓很像水牛，所以也被稱為水牛岩。"
1014303-77 = "啊，這麼說來好像真的有點像呢！"
1014303-78 = "那個巨大的孔洞，據說是很久以前的某位將軍，在打賭時發射的大砲所形成的。"
1014303-79 = "看來是相當巨大的大砲呢……"
1014303-81 = ""
1014303-82 = "不知不覺已經划了30分鐘了！我們在這裡稍微休息一下吧！"
1014303-83 = "休息時間要做什麼才好呢？"
1014303-84 = "想做什麼都可以哦。#n看是要去游泳或漂在水上，還是在船上悠閒地休息都可以！"
1014303-85 = ""
1014303-87 = ""
1014303-88 = ""
1014303-89 = "似乎是這樣呢，老師！我們一起去游泳吧！"
1014303-90 = "[s1] 「抱歉……老師想坐著休息一下……」\n[s2] 「不過我可以幫小旬把游泳的樣子拍下來……」"
1014303-93 = "老師要拍我游泳的樣子嗎……？"
1014303-94 = ""
1014303-96 = ""
1014303-97 = "嗯！那樣也不錯呢！"
1014303-98 = ""
1014303-100 = ""
1014303-101 = ""
1014303-102 = "請一定要長長久久地保存好哦？"
1014303-103 = "[s3] 「……？」\n[s4] 「好，好啊……？」"
1014303-106 = "耶嘿嘿。"
1014303-109 = "（小旬進到水中，開始愉快地享受著游泳）"
1014303-110 = ""
1014303-111 = "老師！請拍我現在的樣子！"
1014303-112 = ""
1014303-114 = ""
1014303-115 = ""
1014303-116 = ""
1014303-117 = ""
1014303-118 = "還有現在這樣！"
1014303-119 = ""
1014303-121 = ""
1014303-122 = ""
1014303-123 = ""
1014303-124 = ""
1014303-125 = ""
1014303-126 = "現在這個樣子，老師覺得怎麼樣呢……？"
1014303-127 = "[ns]「！？！？」"
1014303-128 = ""
1014303-129 = "從這裡開始是大型急流區！請做好準備！"
1014303-130 = "接下來會高高升上去之後……再一口氣往下衝哦！"
1014303-131 = ""
1014303-133 = ""
1014303-134 = ""
1014303-135 = "哇，哇啊……一看就知道會很刺激呢……！"
1014303-136 = "[s] 「我們都小心一點吧……！」"
1014303-137 = "是！"
1014303-138 = "……要來囉，老師！"
1014303-142 = "哇啊！啊哈哈哈哈！"
1014303-143 = "老師！這個超厲害的！太棒了！"
1014303-148 = "咦咦！？"
1014303-149 = ""
1014303-151 = ""
1014303-152 = "[ns] 「小心！」"
1014303-161 = ""
1014303-162 = ""
1014303-163 = ""
1014303-164 = "做得很好！就那樣緊緊抓住老師別放哦！"
1014303-165 = "那，那就只能照做了呢，老師。"
1014303-166 = "耶嘿嘿。老師可不能放開我哦？"
1014303-167 = "……"
1014303-168 = "老師的懷裡好溫暖……好安心……"
1014303-169 = "我真的非常喜歡。"
1014303-170 = "[s] 「那，那就好……」"
1014303-172 = ""
1014303-173 = "今天的泛舟就到此結束！"
1014303-174 = "謝謝！辛苦了！"
1014303-175 = "[s] 「辛苦了！」"
1014303-176 = "那麼請繼續享受接下來的觀光行程！祝兩位玩得愉快！"
1014303-177 = ""
1014303-179 = ""
1014303-180 = ""
1014303-181 = "老師老師！我們接下來要做什麼呢？"
1014303-182 = "問我想做什麼……？#n因為現在身體有點冷……"
1014303-183 = "我突然想吃點好吃的東西！"
1014303-186 = ""
1014303-187 = "啊，老師！快看那邊！"
1014303-188 = "是把肉和蔬菜一起串在竹籤上的烤肉串呢……香料的味道聞起來很好吃的樣子！"
1014303-189 = ""
1014303-190 = "那個……似乎是米線呢！#n我聽說這裡的米線，是以加入了大量花生而聞名哦。"
1014303-191 = "要不要買一碗一起分著吃？"
1014303-192 = ""
1014303-193 = "老師老師！我想吃冰冰甜甜的東西！"
1014303-194 = "聽說這裡的水果刨冰很好吃哦！#n除了滿滿的水果之外，還加了紅豆、綠豆和果凍，超級豐盛的呢！"
1014303-196 = "（就這樣和小旬一起，把整條商店街徹底攻略了一遍）"
1014303-197 = "（最後因為實在吃得太撐，還看著彼此圓滾滾的肚子笑了好一陣子）"
1014303-198 = ""
1014303-199 = "呼……好像因為吃太多的關係，感覺身體都熱起來了呢。"
1014303-200 = "不過已經沒有力氣再繼續游泳或玩水了……"
1014303-201 = "……"
1014303-202 = "那個，老師。"
1014303-203 = "[s]「怎麼了？」"
1014303-204 = "謝謝老師今天願意陪我撒嬌。"
1014303-205 = "[s5] 「哎呀，這點小事不算什麼。」\n[s6] 「你想怎麼撒嬌都沒問題哦。」"
1014303-208 = "……"
1014303-209 = "我果然最喜歡老師了！"
1014303-212 = "（小旬坐在河邊清澈的淺水潭裡，悠閒地踢起了水花）"
1014303-213 = "（然而就在帶著幾分慵懶，靜靜望著那副身影時……！）"
1014303-214 = ""
1014303-215 = ""
1014303-216 = ""
1014303-217 = "唔？咦！？"
1014303-218 = "[ns] 「嗯？突，突然怎麼了……！？！？」"
1014303-222 = "― [log=슌 수영복]咦，呀啊啊！？[/log][wa:2700] "
1014303-225 = "― [log=슌 수영복]老，老師！？[/log][wa:278] "
1014303-227 = "― [log=슌 수영복]這是，那個……！[/log][wa:670] "
1014303-230 = "― [log=슌 수영복]這，這麼說來……[/log][wa:1640] "
1014303-232 = "― [log=슌 수영복]沙耶同學說過，可能會變得有點不太穩定……難道說……？[/log][wa:4390] "
1014303-235 = "[ns] 「抱，抱歉！」"
1014303-236 = "― [log=슌 수영복]老，老師沒有必要道歉……！[/log][wa:1520] "
1014303-238 = "― [log=슌 수영복]不，不如說……那個……就是……[/log][wa:2310] "
1014303-241 = "― [log=슌 수영복]我，我該怎麼辦才好……！[/log][wa:570] "
1014303-244 = "[ns] 「要，要不要我先迴避一下！？」"
1014303-245 = "― [log=슌 수영복]不可以！[/log][wa:700] "
1014303-248 = "― [log=슌 수영복]那，那個……！[/log][wa:260] "
1014303-251 = "― [log=슌 수영복]可以請您站在那裡嗎？ [/log][wa:280] "
1014303-253 = "― [log=슌 수영복]因為我要躲起來……[/log]"
1014303-256 = "― [log=슌 수영복]我……並不介意。[/log][wa:4850] "
1014303-259 = "― [log=슌 수영복]如果是老師的話……[/log][wa:750] "
1014303-261 = "― [log=슌 수영복]再稍微維持這樣，也可以……[/log][wa:2160] "
1014303-264 = "（好不容易避開周遭的目光，把旬的泳裝拿了過來……）"
1014303-265 = ""
1014303-266 = "……"
1014303-267 = "[s]「……」"
1014303-268 = "請，請說點什麼吧……拜託您了……"
1014303-269 = "[s] 「我該說什麼……才好……？」"
1014303-270 = "……"
1014303-271 = "請不要問我啦……"
1014303-273 = "（果然是因為害羞的緣故嗎……）"
1014303-274 = "（接下來一整天……旬變得比平常安靜許多……）"
