[translation]
10054090-1 = "9화;계약과 이행"
10054090-10 = "……."
10054090-11 = "……."
10054090-12 = "하아……. 정말 이 짓 해야 하나……."
10054090-13 = "돈 받았으니까, 일은 해야지……."
10054090-14 = "아니, 근데 멀쩡히 잘 살고 있는 시장을 엎어버리라는 건 조금……."
10054090-15 = "그건 그래. 그나마 처음 의뢰를 준 사람은 점잖은 어른이었던 것 같은데."
10054090-16 = "모르겠다. 아무튼 가자."
10054090-23 = "아, 왔네!"
10054090-24 = "뭐야. 늦었잖아. 우리가 얼마나 기다렸는데. 나이도 많으면서 약속이 얼마나 중요한지도 모르는 거야? 정말 못 봐 주겠네."
10054090-25 = "이 정도 인력밖에는 구하지 못했던 건가요. 실망스럽네요."
10054090-26 = "뭐, 뭐야. 이 꼬맹이들."
10054090-27 = "왠지 그 어른, 계속 미리 미안하다고 하더니만……."
10054090-28 = "어쩔 수 없지. 마음 넓은 우리가 넘어가 줄 수밖에."
10054090-29 = "너희들이 할 일은 간단해! 여기를……."
10054090-30 = "완전히 난장판으로 만들어 버리면 되는 거야!"
10054090-31 = "하나 물어나 보자. 뭣 때문에 그래야 하는데?"
10054090-32 = "그런 건 왜 물어보는 걸까? 돈을 받았으면 계약대로 해야 하는 거 아닐까?"
10054090-33 = "아니면 계약이라는 개념도 모르는 바보에다 허접이라는 뜻?"
10054090-34 = "이미 조금 실망하기 시작했는데, 거기에 더 실망을 얹지 말아 줬으면 해."
10054090-35 = "……이 꼬맹이들이……!"
10054090-36 = "가끔은 이유 없이 해야 하는 일도 있는 법이에요. 우후후후."
10054090-37 = "거기에 세상만사, 돈이면 대부분 해결되는 것 아니었던가요?"
10054090-38 = "……."
10054090-39 = "……."
10054090-40 = "정말 뭔가 싫구만……."
10054090-41 = "뭐……. 틀린 말은 아니긴 하니까."
10054090-42 = "그래도 참, 에휴……."
10054090-49 = "안녕하세요! 죄송해요. 조금 늦었죠?"
10054090-50 = "후아암……. 키키, 늦잠을 자 버린 거예요. 미안해요……."
10054090-51 = "어서 와! 그런 건 괜찮으니까! 새 나라의 어린이는 푹 자야 하는 법이고 말이지!"
10054090-52 = "혹시 모르니까 뒤에 가 있어. 너무 앞으로 나서지 말고."
10054090-53 = "그래도 되는 건가요?"
10054090-54 = "우후후후. 첫 경험이니까요. 수습 기간이라는 거죠."
10054090-55 = "(어떻게 의심받지 않고 후방으로 빠질 수 있을지 고민했는데, 그럴 필요는 없겠군.)"
10054090-56 = "감사합니다!"
10054090-57 = "그러면 이제부터…… '불꽃놀이'를 시작해 보자고!"
10054090-58 = "가자(가죠)!!!"
10054090-65 = "정말로…… 온 건가!"
10054090-66 = "그 학생들 말대로였군. 예전이라면 속수무책으로 당했겠지만……!"
10054090-67 = "우릴 돕는 학생들을 봐서라도, 더 이상은 못 참아!"
10054090-74 = "앗, 따가! 어라, 분명 아무 저항 없을 거라고 하지 않았어?"
10054090-75 = "아무리 그래도 이렇게 난리를 피우는데, 고분고분 당할 리가 있겠냐."
10054090-76 = "흐음……. 이봐. 우린 사실 정말로 '돈 받은 만큼'만 일하면 되는 거지?"
10054090-77 = "그야 그렇지. 가만, 그렇다면……?"
10054090-81 = "흠, 역시."
10054090-82 = "응. 그렇지?"
10054090-85 = "정말 돈 받은 만큼만 하자고! 기분도 찝찝한데!"
10054090-86 = "좋지! 뭘 어떻게 더 하라고는 안 했으니까 적당히 싸우는 척만 하자고!"
10054090-87 = "맞아! 기껏 선크림까지 발랐는데, 피부 상하는 건 질색이란 말이지!"
10054090-89 = "그래, 그래! 다 부숴버려! 다시는 이상한 마음 먹지 못하게!"
10054090-93 = "어, 어라……?"
10054090-94 = "당하고만 있을 수는 없다!"
10054090-100 = "어떻게 된 거야? 이런 일은 처음인데……? 허접 어른들 주제에……!!!"
10054090-101 = "여기는 우리 거리다! 너희가 아무리 아이들이라고 해도…… 지켜야 할 것은 있단 말이다!"
10054090-102 = "분수도 모르면서…… 그런데 고용한 언니들은 뭐 하는 거죠? 계약을 지켜야 할 것 아닌가요!"
10054090-103 = "그거 말인데. 계약서에는 이런 일이 일어날 거라고는 안 쓰여 있었잖아?"
10054090-104 = "맞아. 아무 일도 안 일어날 거라며. 그래도 우리 일단 싸우고는 있다고? 이거 추가 수당 줘야 하는 거 아냐?"
10054090-108 = "감히…… 감히……!"
10054090-113 = "아얏?!?!"
10054090-114 = "이런. 유탄이 튀었나 보네. 너희들, 다치는 거 싫으면 적당히 빠져 있지 그래?"
10054090-115 = "……얕보였는데, 이거. 그것도 겁쟁이들에게."
10054090-116 = "결국, 세상에 믿을 사람은 하나도 없다는 것이겠지요. 우리가 직접 나설 수밖에요."
10054090-117 = "제대로 쓴 맛을 보여주마!!!"
10054090-127 = "저 애들, 많이 신경질이 났나 본데?"
10054090-128 = "이런 상황은 예측하지 못했을 테니 말이지."
10054090-129 = "애들 상대로 이렇게까지 해야 하나 싶기도 한데 말이야."
10054090-130 = "무슨 말이세요! 아이들일수록 이럴 때 따끔하게 혼을 내야, 다시는 이런 일을 하지 않는 법이라고요!"
10054090-131 = "정말이지, 버릇이 잘못 들어도 한참 잘못 들었네요! 저 애들에게는 반드시 제가 한소리 해 주고 말겠어요!!!"
10054090-132 = "하하하. 코코나 교관 쨩이 그렇게 말하니, 이거 할 이야기가 없어졌는걸."
10054090-133 = "뭐, 여기까지도 선생님이 한 말 대로다. 말 그대로, '망치와 모루'로군."
10054090-136 = "망치와 모루?"
10054090-137 = "들어 본 적 있긴 한데…… 전술의 시작과 끝이라고 불리는 개념이라는 건 알고 있다."
10054090-138 = "'모루'를 담당한 부대가 적의 공격을 막는 동안, 기동성이 좋은 '망치' 부대가 별동대로서 측면과 후방을 기습하는 전술이었지."
10054090-139 = "거의 모든 전술 전략의 표준이라고도 할 수 있고……."
10054090-140 = "진법이나 무기 체계 같은 것도 결국, '망치와 모루 전술을 구사할 수 있게 해주느냐'가 가장 큰 골자가 된다고도 하지."
10054090-142 = "[ns] \"그래. 이번에는 너희들이 '망치' 역할을 해 줘야 해.\""
10054090-143 = "우리가…… 망치? 그리고 이곳 거리의 지형을 잘 알고 있는 상인분들이 모루 역할인 것이라고? 하지만, 그건……."
10054090-144 = "알겠습니다, 선생님. 맡겨 주십시오."
10054090-145 = "괘, 괜찮은 것인가? 그렇다고는 해도, 그것은 이 거리를 전장으로 삼겠다는 뜻이 될 수밖에 없고, 그렇게 되면……."
10054090-146 = "……바로 그래서란다."
10054090-147 = "생각해 보면 우리는, 너무 무기력하기만 했지. 이렇게 너희와 선생님의 힘을 빌리게 되었다는 것이, 부끄러운 일이야."
10054090-148 = "그래……. 여기는 쭉 우리 삶의 터전이었으니까. 오히려 이제 와서 조금 눈을 뜬 셈이라고도 할 수 있겠구나."
10054090-149 = "결국 이 거리를 지나가지 못하게 지키면 되는 것 아니냐. 그 정도야 당연히 해내 보아야지. 그렇고말고."
10054090-151 = "그러면 시작할까. 빠르게 끝을 내야, 상인 분들도 피해가 적겠지?"
10054090-152 = "속전속결인가. 나쁘지 않은 작전이다."
10054090-156 = "너희들! 말썽은 여기까지니까 말이야!!!"
