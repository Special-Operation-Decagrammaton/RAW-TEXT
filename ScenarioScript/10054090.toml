[translation]
10054090-1 = "第9話;契約與履行"
10054090-8 = ""
10054090-9 = ""
10054090-10 = "……"
10054090-11 = "……"
10054090-12 = "唉……真的非做這種事不可嗎……"
10054090-13 = "既然錢都收了，該做的事還是得做啊……"
10054090-14 = "可是要把一個運作得好端端的市場給毀掉，這未免有點……"
10054090-15 = "這倒是真的。一開始的委託人，好歹看起來還算是個正經的大人的說。"
10054090-16 = "算了，總之先走吧。"
10054090-17 = ""
10054090-19 = ""
10054090-20 = ""
10054090-22 = ""
10054090-23 = "啊，終於來了！"
10054090-24 = "居然遲到是什麼意思！知道我們等多久了嗎！？#n都幾歲了還不知道守時守約有多重要是不是啊？真是讓人看不下去。"
10054090-25 = "就只能湊出這點人手嗎？真令人失望呢。"
10054090-26 = "什，什麼啊？這群小鬼。"
10054090-27 = "難怪那個大人事先一直莫名跟我們道歉……"
10054090-28 = "算了，看在我們心胸寬大的份上就不跟你們計較了。"
10054090-29 = "你們的任務很簡單！就是把這裡……"
10054090-30 = "徹底搞成一團亂就對了！"
10054090-31 = "我想先問一下，為什麼非得那麼做？"
10054090-32 = "那種問題有必要問嗎？拿了錢就該照契約做吧？"
10054090-33 = "還是說，你們是個連契約都不懂的笨蛋菜鳥？"
10054090-34 = "本來就已經有點失望了，拜託別再讓我更失望了。"
10054090-35 = "這些臭小鬼……！"
10054090-36 = "有時候也會遇到沒有理由卻非做不可的事唷。唔呵呵。"
10054090-37 = "再說了，世上幾乎所有事情都能用錢解決吧？"
10054090-38 = "……"
10054090-39 = "……"
10054090-40 = "總覺得有種討厭的感覺……"
10054090-41 = "對啊……雖然這麼說也沒錯啦。"
10054090-42 = "可是……唉……"
10054090-43 = ""
10054090-45 = ""
10054090-46 = ""
10054090-48 = ""
10054090-49 = "大家好！對不起，我們是不是遲到了？"
10054090-50 = "呼啊……妃妃睡過頭了……對不起……"
10054090-51 = "歡迎歡迎！那種事別在意啦！小孩子本來就該好好睡覺嘛！"
10054090-52 = "為了保險起見，你們就先待在後面吧。"
10054090-53 = "真的可以嗎？"
10054090-54 = "唔呵呵，畢竟是第一次嘛。就當作是試用期囉。"
10054090-55 = "（本來還煩惱該如何自然地退到後方，看來似乎沒有那個必要了）"
10054090-56 = "謝謝你們！"
10054090-57 = "那麼接下來……就開始放「煙火」吧！"
10054090-58 = "出發！！！"
10054090-65 = "竟然真的來了……！"
10054090-66 = "看來跟那些學生說的一樣啊。#n換作是以前，我們恐怕只能束手無策地任人宰割……！"
10054090-67 = "就算是為了幫助我們的那些學生，我也不能再忍下去了！"
10054090-68 = ""
10054090-70 = ""
10054090-73 = ""
10054090-74 = "啊，好痛！咦，不是說不會有任何抵抗嗎？"
10054090-75 = "都把事情鬧成這樣了，人家也不可能老老實實挨打吧。"
10054090-76 = "唔嗯……我們只要「拿多少錢辦多少事」就行了吧？"
10054090-77 = "那當然。等等，如果是這樣的話……？"
10054090-78 = ""
10054090-80 = ""
10054090-81 = "哼，沒錯。"
10054090-82 = "嗯，對吧？"
10054090-85 = "那我們就真的拿多少錢辦多少事吧！畢竟我本來就覺得挺不爽的！"
10054090-86 = "贊成！反正他們也沒說要做什麼，我們就隨便應付一下吧！"
10054090-87 = "沒錯！我今天還特地做了防曬，要是傷到皮膚可就糟了！"
10054090-89 = "沒錯沒錯！通通給我砸爛！讓他們再也不敢打歪主意！"
10054090-90 = ""
10054090-92 = ""
10054090-93 = "咦，奇怪……？"
10054090-94 = "不能再這樣一味挨打下去了！"
10054090-95 = ""
10054090-97 = ""
10054090-100 = "怎麼回事？以前都不會這樣啊……？#n明明只是一群沒用的大人……！！！"
10054090-101 = "這裡是我們的街道！就算你們是小孩子……我們也有必須守護的東西！"
10054090-102 = "真是不自量力……#n話說那些傭兵姐姐在做什麼？不是應該遵守契約嗎！？"
10054090-103 = "說到這個，契約書上可沒有寫會發生這種事吧？"
10054090-104 = "對啊。之前明明說過不會發生任何問題的。#n不過我們多少也有在打，是不是應該給我們額外津貼啊？"
10054090-105 = ""
10054090-107 = ""
10054090-108 = "竟……竟敢……！"
10054090-109 = ""
10054090-111 = ""
10054090-113 = "呀啊！？！？"
10054090-114 = "哎呀，看來是被流彈波及到了。#n你們幾個，不想受傷的話就乖乖待在旁邊吧？"
10054090-115 = "……這下可真是被看扁了。而且還是被一群膽小鬼。"
10054090-116 = "看來果然不能相信任何人呢。#n事到如今，只能由我們親自出馬了。"
10054090-117 = "就讓你們嚐嚐真正的苦頭吧！！！"
10054090-127 = "那些孩子，看起來相當火大呢？"
10054090-128 = "他們大概沒料到會是這種局面吧。"
10054090-129 = "感覺似乎沒必要對一群孩子做到這種地步呢。"
10054090-130 = "怎麼這麼說呢！#n就因為是孩子才更要狠狠教訓一下，將來才不會再犯相同的錯呀！"
10054090-131 = "真是的，那群孩子被慣得太不像話了！我一定要好好念他們一頓才行！！！"
10054090-132 = "哈哈哈。既然心菜教官醬都這麼說了，我也不好意思再多說什麼。"
10054090-133 = "目前為止都和老師說的一樣，完全是「鐵鎚與鐵砧」的戰術呢。"
10054090-135 = ""
10054090-136 = "鐵鎚與鐵砧？"
10054090-137 = "之前好像有聽過……據我所知，那是被稱為戰術的原點與終點的概念。"
10054090-138 = "在負責「鐵砧」的部隊阻擋敵人攻勢的同時，#n由機動性佳的「鐵鎚」部隊奇襲側翼與後方的戰術。"
10054090-139 = "這幾乎可以說是所有戰略的標準……"
10054090-140 = "也有說法認為無論陣型配置還是武器發展，#n其核心目的都在於「能否運用鐵鎚與鐵砧戰術」。"
10054090-141 = ""
10054090-142 = "[ns] 「沒錯，這次要由你們來擔任『鐵鎚』的角色。」"
10054090-143 = "我們擔任……鐵鎚？熟悉這片街區的商人們則擔任鐵砧？#n可是那樣的話……"
10054090-144 = "我明白了，老師。請交給我們吧。"
10054090-145 = "這，這樣真的好嗎？#n這麼做就代表要將這條街道當成戰場，一旦變成那樣……"
10054090-146 = "……正是因為這樣啊。"
10054090-147 = "仔細想想，我們總是太過無力了……#n像這樣借助你們和老師的力量，實在是一件令人羞愧的事。"
10054090-148 = "是啊……這裡一直以來都是我們生活的地方。#n倒不如說，事到如今才總算稍微清醒過來了呢。"
10054090-149 = "說到底，只要守住這條街不讓他們通過不就行了嗎？#n這點小事當然得做到才行。"
10054090-151 = "那麼就開始吧。必須盡快結束，這樣商人們的損失也會比較小吧？"
10054090-152 = "速戰速決嗎？不錯的戰術。"
10054090-153 = ""
10054090-155 = ""
10054090-156 = "你們幾個！胡鬧就到此為止了！！！"
