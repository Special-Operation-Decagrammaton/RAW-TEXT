10054090-10 = "..."
10054090-11 = "..."
10054090-12 = "เฮ้อ... ต้องทำเรื่องแบบนี้จริงๆ เหรอ..."
10054090-13 = "รับเงินมาแล้ว ก็ต้องทำงานสิ..."
10054090-14 = "แต่การให้ไปทำลายตลาดที่อยู่กันอย่างสงบสุข มันก็ออกจะ..."
10054090-15 = "นั่นก็จริง แต่อย่างน้อย ผู้ใหญ่ที่มาว่าจ้างตอนแรกก็ดูเป็นคนสุภาพนะ"
10054090-16 = "เอาน่า ยังไงก็ไปกันเถอะ"
10054090-17 = ""
10054090-19 = ""
10054090-20 = ""
10054090-22 = ""
10054090-23 = "อ๊ะ มากันแล้วสินะ!"
10054090-24 = "นี่ มาสายนะ รู้มั้ยว่าพวกเรารอนานแค่ไหน? โตจนป่านนี้แล้วแท้ๆ ยังไม่รู้อีกเหรอว่าสัญญามันสำคัญ#nแค่ไหนน่ะ? ทนดูไม่ได้เลยจริงๆ"
10054090-25 = "หาคนมาได้แค่นี้เองเหรอคะ? น่าผิดหวังจังค่ะ "
10054090-26 = "อะ... อะไรกัน เด็กน้อยพวกนี้"
10054090-27 = "มิน่าล่ะ ผู้ใหญ่คนนั้นถึงเอาแต่ขอโทษล่วงหน้าอยู่เรื่อย..."
10054090-28 = "ช่วยไม่ได้ คนใจกว้างอย่างพวกเราก็มีแต่ต้องยอมปล่อยผ่านไป"
10054090-29 = "งานของพวกเธอน่ะง่ายๆ! แค่ทำให้ที่นี่..."
10054090-30 = "เละไม่เป็นท่าก็พอแล้ว!"
10054090-31 = "ขอถามสักอย่างนะ ทำไมพวกเราต้องทำแบบนั้นด้วย?"
10054090-32 = "ทำไมถึงถามเรื่องแบบนั้นล่ะ? รับเงินมาแล้วก็ควรทำตามสัญญาไม่ใช่เหรอ? "
10054090-33 = "หรือจะบอกว่าตัวเองทั้งโง่และกระจอกจนไม่รู้ด้วยซ้ำว่าสัญญาคืออะไร?"
10054090-34 = "เริ่มจะผิดหวังขึ้นมานิดๆ แล้วแฮะ เพราะงั้นอย่ามาทำให้ผิดหวังไปมากกว่านี้เลย"
10054090-35 = "ยัยเด็กน้อยพวกนี้...!"
10054090-36 = "บางครั้งก็มีเรื่องที่ต้องทำโดยไม่ต้องมีเหตุผลเหมือนกันนะคะ ฮุฮุฮุฮุ"
10054090-37 = "อีกอย่าง ปัญหาส่วนใหญ่ในโลกนี้ก็แก้ไขได้ด้วยเงินไม่ใช่เหรอคะ?"
10054090-38 = "..."
10054090-39 = "..."
10054090-40 = "ไม่ชอบเรื่องนี้เลย..."
10054090-41 = "ก็นะ... ที่พูดมาก็ไม่ผิดหรอก"
10054090-42 = "แต่ถึงอย่างนั้นก็เถอะ เฮ้อ..."
10054090-43 = ""
10054090-45 = ""
10054090-46 = ""
10054090-48 = ""
10054090-49 = "สวัสดีค่ะ! ขอโทษนะคะ พวกฉันมาสายนิดหน่อยใช่มั้ยคะ?"
10054090-50 = "ฮ้าว... คิกิเผลอตื่นสายค่ะ ขอโทษนะคะ..."
10054090-51 = "มาเลยๆ! เรื่องนั้นไม่เป็นไรหรอก! เด็กดีของชาติต้องนอนให้เต็มอิ่มสิ!"
10054090-52 = "ไปหลบอยู่ข้างหลังไว้ก่อนนะ อย่าออกมาข้างหน้ามากเกินไปล่ะ"
10054090-53 = "ทำแบบนั้นได้จริงๆ เหรอคะ?"
10054090-54 = "ฮุฮุฮุฮุ ก็นี่เป็นครั้งแรกนี่คะ ถือว่าเป็นช่วงทดลองงานค่ะ"
10054090-55 = "(กำลังคิดอยู่เลยว่าจะถอยไปอยู่แนวหลังโดยไม่ถูกสงสัยได้ยังไง แต่ดูเหมือนจะไม่จำเป็นแล้วสินะ)"
10054090-56 = "ขอบคุณค่ะ! "
10054090-57 = "ถ้างั้นต่อจากนี้... เรามาเริ่ม 'เล่นดอกไม้ไฟ' กันเลย!"
10054090-58 = "ไปกันเลย!!!!!"
10054090-65 = "มากันจริงๆ... สินะ!"
10054090-66 = "เป็นอย่างที่นักเรียนพวกนั้นพูดไว้จริงๆ ถ้าเป็นเมื่อก่อน พวกเราคงถูกเล่นงานโดยไร้ทางตอบโต้...!"
10054090-67 = "แต่อย่างน้อยก็เพื่อเหล่านักเรียนที่ช่วยพวกเราไว้ เราจะไม่ยอมทนอีกต่อไปแล้ว!"
10054090-68 = ""
10054090-70 = ""
10054090-73 = ""
10054090-74 = "อ๊ะ เจ็บนะ! เอ๋ ไหนบอกว่าจะไม่มีการต่อต้านเลยไง?"
10054090-75 = "ก็เรามาอาละวาดกันขนาดนี้ พวกนั้นจะยอมถูกเล่นงานแต่โดยดีได้ยังไงล่ะ?"
10054090-76 = "ฮึ่ม... นี่ ที่จริงพวกเราแค่ต้องทำงาน 'ตามค่าจ้างที่ได้รับ' ก็พอแล้วใช่มั้ย?"
10054090-77 = "ก็ต้องใช่อยู่แล้ว เดี๋ยวนะ ถ้าอย่างนั้น...?"
10054090-78 = ""
10054090-80 = ""
10054090-81 = "ฮึ่ม อย่างนี้สินะ?"
10054090-82 = "อื้อ คิดเหมือนกันใช่มั้ยล่ะ?"
10054090-85 = "ทำๆ ไปแค่ตามค่าจ้างที่ได้รับมาก็พอ! ยังไงก็รู้สึกไม่ค่อยดีกับเรื่องนี้อยู่แล้วด้วย!"
10054090-86 = "ดีเลย! ยังไงก็ไม่ได้มีคำสั่งว่าต้องทำอะไรต่อยังไง แกล้งทำเป็นสู้กันพอเป็นพิธีก็แล้วกัน!"
10054090-87 = "ใช่! อุตส่าห์ทาครีมกันแดดมาแล้วทั้งที ขืนผิวเสียขึ้นมาละก็ไม่เอาด้วยเด็ดขาด!"
10054090-89 = "เอาเลยๆ! ทำลายให้หมดเลย! จะได้ไม่กล้าคิดทำอะไรแปลกๆ อีก!"
10054090-90 = ""
10054090-92 = ""
10054090-93 = "เอะ เอ๋...?"
10054090-94 = "พวกเราไม่ยอมถูกเล่นงานอยู่ฝ่ายเดียวหรอก!"
10054090-95 = ""
10054090-97 = ""
10054090-100 = "อะไรเนี่ย? เรื่องแบบนี้ไม่เคยเกิดขึ้นมาก่อนเลยนี่นา...? เป็นแค่พวกผู้ใหญ่กระจอกแท้ๆ...!!!"
10054090-101 = "ที่นี่คือย่านของพวกเรา! ต่อให้พวกเธอจะเป็นเด็กก็เถอะ... แต่พวกเราก็มีสิ่งที่ต้องปกป้องเหมือนกัน!"
10054090-102 = "ไม่รู้จักเจียมตัวซะบ้าง… ว่าแต่พวกพี่สาวที่จ้างมาทำอะไรกันอยู่คะ? ต้องทำตามสัญญาไม่ใช่เหรอคะ!"
10054090-103 = "เรื่องนั้นน่ะ ในสัญญาไม่ได้เขียนไว้ว่าจะเกิดเรื่องแบบนี้ไม่ใช่เหรอ?"
10054090-104 = "ใช่ ไหนบอกว่าจะไม่มีอะไรเกิดขึ้นไง แต่ยังไงตอนนี้พวกเราก็กำลังสู้อยู่นะ? แบบนี้ต้องมีค่าตอบแทนเพิ่มไม่ใช่เหรอ?"
10054090-105 = ""
10054090-107 = ""
10054090-108 = "บังอาจ... บังอาจนักนะ...!"
10054090-109 = ""
10054090-111 = ""
10054090-113 = "โอ๊ย?!?!"
10054090-114 = "โอ๊ะ ดูเหมือนกระสุนลูกหลงจะกระเด็นไปนะ พวกเธอ ถ้าไม่อยากเจ็บตัวก็ถอยไปอยู่ห่างๆ ดีกว่ามั้ย?"
10054090-115 = "ดูท่าพวกเราจะถูกพวกนั้นดูถูกเข้าให้แล้ว... แถมยังเป็นแค่พวกขี้ขลาดเสียด้วย"
10054090-116 = "สุดท้ายแล้ว บนโลกนี้ก็คงไม่มีใครเชื่อใจได้เลยสินะคะ พวกเราคงต้องลงมือเองแล้วค่ะ"
10054090-117 = "จะสั่งสอนให้รู้ซึ้งไปเลย!!!"
10054090-127 = "เด็กพวกนั้นดูท่าจะหัวเสียเอามากๆ เลยนะ"
10054090-128 = "คงคาดไม่ถึงว่าจะเจอสถานการณ์แบบนี้น่ะ"
10054090-129 = "แต่ฉันก็อดคิดไม่ได้เหมือนกันนะว่า จำเป็นต้องทำถึงขนาดนี้กับเด็กๆ เลยเหรอ"
10054090-130 = "พูดอะไรอย่างนั้นคะ! ยิ่งเป็นเด็ก เวลาแบบนี้ยิ่งต้องสั่งสอนให้หลาบจำค่ะ จะได้ไม่ทำเรื่องแบบนี้อีก!"
10054090-131 = "จริงๆ เลย นิสัยเสียไปมากแล้วนะคะ! ฉันต้องไปอบรมให้รู้เรื่องให้ได้ค่ะ!!!"
10054090-132 = "ฮ่าฮ่าฮ่า พอผู้ฝึกสอนโคโคน่าจังพูดแบบนั้น ฉันก็เถียงอะไรไม่ออกแล้วละ"
10054090-133 = "จนถึงจุดนี้ทุกอย่างก็ยังเป็นไปตามที่คุณครูพูดไว้ เรียกได้ว่าเป็น 'ค้อนกับทั่ง' จริงๆ ด้วย"
10054090-135 = ""
10054090-136 = "ค้อนกับทั่งเหรอ?"
10054090-137 = "ฉันเคยได้ยินมาอยู่บ้าง... และรู้ว่าแนวคิดนี้ได้รับการขนานนามว่าเป็นทั้งจุดเริ่มต้นและจุดสิ้นสุดของ#nยุทธวิธี"
10054090-138 = "เป็นยุทธวิธีที่ให้หน่วย 'ทั่ง' คอยสกัดการโจมตีของศัตรู ในขณะที่หน่วย 'ค้อน' ที่มีความคล่องตัวสูง#nจะแยกกำลังออกไปลอบโจมตีจากด้านข้างและแนวหลัง"
10054090-139 = "เรียกได้ว่าเป็นมาตรฐานของยุทธวิธีและยุทธศาสตร์แทบทุกชนิดเลยก็ว่าได้..."
10054090-140 = "แม้แต่กระบวนทัพหรือระบบอาวุธ สุดท้ายแล้วก็กล่าวกันว่า แก่นสำคัญที่สุดอยู่ที่ว่า 'เอื้อให้ใช้ยุทธวิธีค้อนกับทั่งได้หรือไม่'"
10054090-141 = ""
10054090-142 = "[ns] \"ใช่ ครั้งนี้ทุกคนต้องรับบทเป็น 'ค้อน' ให้หน่อย\""
10054090-143 = "ให้พวกเรา... เป็นค้อน? ส่วนเหล่าพ่อค้าที่รู้จักพื้นที่ของย่านนี้เป็นอย่างดี ก็ให้ทำหน้าที่เป็น 'ทั่ง' งั้นเหรอ? แต่ว่าแบบนั้นมัน..."
10054090-144 = "เข้าใจแล้ว คุณครู วางใจพวกเราได้เลย"
10054090-145 = "จะ... จะไม่เป็นไรแน่เหรอ? แต่ถึงอย่างนั้น นั่นก็หมายความว่าเราจะใช้ย่านนี้เป็นสนามรบ และถ้าเป็นแบบนั้น..."
10054090-146 = "ก็เพราะอย่างนั้นแหละ..."
10054090-147 = "พอมาคิดดูแล้ว พวกเราได้แต่ไร้กำลังจนทำอะไรไม่ได้มาตลอด การต้องมาพึ่งกำลังของพวกเธอกับ#nคุณครูแบบนี้ ช่างน่าละอายจริงๆ"
10054090-148 = "ใช่... ที่นี่เป็นทั้งบ้านและแหล่งทำมาหากินของพวกเรามาโดยตลอด จะว่าไป ก็คงถือว่าพวกเราเพิ่งตาสว่างขึ้นมาบ้างเอาตอนนี้เองสินะ"
10054090-149 = "สุดท้ายก็แค่ป้องกันไม่ให้พวกนั้นผ่านย่านนี้ไปได้ก็พอแล้วไม่ใช่เหรอ? เรื่องแค่นั้นน่ะ พวกเราต้องทำให้ได้อยู่แล้ว แน่นอนเลย"
10054090-151 = "ถ้างั้นเริ่มกันเลยมั้ย? ต้องรีบจบให้เร็ว พวกพ่อค้าจะได้เสียหายน้อยลง"
10054090-152 = "เผด็จศึกโดยเร็วสินะ เป็นแผนที่ไม่เลวเลย"
10054090-153 = ""
10054090-155 = ""
10054090-156 = "พวกเธอ! หยุดก่อเรื่องกันได้แล้ว!!!"
