[translation]
10034080-1 = "에필로그;부족하지 않아."
10034080-4 = "[log=???]그건 좀 부족하지 않아?[/log]"
10034080-9 = "……응?"
10034080-10 = "아, 미안. 미안. 잠시 딴생각을 좀 하느라……. 뭐라고 그랬어?"
10034080-16 = "조금 부족한 거 아니냐고. 방금 말한 그 <유령의 집 카페>말이야."
10034080-17 = "물론 전보다는 그래도 뭔가 있고……. 그냥 디저트 카페보단 낫겠지만……."
10034080-18 = "그렇지만 뭐랄까……. 다른 데랑 겹칠지도 몰라. 우리가 걱정하는 건 그 부분이거든."
10034080-19 = "그치, 그치. 좀 더 특이한 게……. 아니면 지금 등에 맨 그거라던가?"
10034080-21 = "……응? 이거? 키보드?"
10034080-23 = "맞아. 밴드 카페 같은 건 어때? 그거라면 좀 확 뭔가 튈 지도 모르잖아."
10034080-24 = "키보드도 칠 줄 알았다니, 애초에 그런 걸로 했으면 어땠을까- 싶은데!"
10034080-26 = "으음……. 과연……. 밴드라……."
10034080-27 = "으으으으으음……!"
10034080-31 = "……후후."
10034080-32 = "후후. 후후후……."
10034080-33 = "……아이리?"
10034080-34 = "음……? 왜, 왜 웃어? 뭔가 웃기는 생각이라도 난 거야?"
10034080-35 = "아하하하……. 아냐, 아냐. 걱정 고마워. 무슨 말인지 대충 이해했어."
10034080-36 = "……그렇지만 괜찮아. ……이번에는 그 정도면 괜찮은 거 같아."
10034080-41 = "……뭐야. 걱정할 필요 없었잖아."
10034080-42 = "그러게. 아이리 표정 보니, 더 이상은 이야기 안 해도 될 거 같다, 야."
10034080-43 = "그럼 준비 힘내, 아이리! 애들 데리고 갈 테니까!!"
10034080-44 = "디저트도 기대하고 있다고! 방과후 디저트부!"
10034080-46 = "……응! 기대해도 좋아!"
10034080-50 = "아. 내릴 역이다."
10034080-51 = "그럼 나머지는 나중에! 나 먼저 간다!"
10034080-53 = "그래~. 조심해서 들어가~."
10034080-54 = "내일 보자~!!"
10034080-56 = "응!!"
10034080-60 = "……후우."
10034080-61 = "어라. 뭔가 지금 이 상황……. 전에도 있었던 것 같은 느낌이……."
10034080-63 = "아이리! 여기야, 여기!!"
10034080-64 = "……?"
10034080-68 = "뭐 한다고 그리 멍하니 서 있어! 혹시 모르니까 미리 좀 가 있자고!!"
10034080-69 = "보채지 좀 마라. 아이리도 뭔가 생각할 게 있겠지. 다 넌 줄 아냐."
10034080-70 = "……? 뭐라고 했냐."
10034080-71 = "만에 하나라도 테스트 늦어서 일 나면 책임질 거야!? 이 고생하고 셈라 진짜 못 먹는 수가 있다!?"
10034080-72 = "피를 토하는 일주일이 지났지. 모두 결전의 각오로 임해야 해. 피를 토하는 록을……!!"
10034080-73 = "아니, 피를 토하면 테스트를 못 하잖아……."
10034080-74 = "아무튼 뭐, 그래. 그동안의 성과를 보여줄 때이긴 하지."
10034080-75 = "……가자, 아이리."
10034080-77 = "…………."
10034080-78 = "……아이리?"
10034080-79 = "뭘 멍하니 서 있어? 시간 없다니까?"
10034080-80 = "우리에겐 작은 한 걸음이지만, 키보토스 밴드계에는 위대한 도약이 될 것이다!!"
10034080-81 = "……………………."
10034080-85 = "그건 좀 부족하지 않아?"
10034080-94 = "\"……이제 괜찮아.\""
10034080-97 = "-ive aLIVE!"
