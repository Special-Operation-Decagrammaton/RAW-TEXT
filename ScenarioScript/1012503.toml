[translation]
1012503-1 = "마법의 모자"
1012503-4 = "으으. 와주셨군요, 마스터!"
1012503-5 = "어떡하면 좋죠?"
1012503-6 = "오늘 오후에 실기 시험이 있는데……. 깐깐하기로 악명 높은 감독관이 들어와요!"
1012503-7 = "마법 모자는 물론이고 마법에 관련된 건 아무것도 가져오면 안 된대요!"
1012503-8 = "모자 없이 시험장에 가라는 건, 저에게 발가벗고 거리를 돌아다니라는 말과 같아요!"
1012503-12 = "으으, 정말 어떡해야 좋죠?"
1012503-13 = "마스터…… 저는 발가벗고 다니기 싫어요."
1012503-19 = "[ns1] \"이, 일단 장소를 옮기자!\"\n[ns2] \"여긴 보는 눈이 많아!\""
1012503-25 = "(조용한 곳에서 침착하게 에리의 이야기를 들었다.)"
1012503-28 = "[ns3] \"그러니까 시험장엔 그림 도구만 가져갈 수 있는 거네.\"\n[ns4] \"사실 그게 맞긴 한데 말이야.\""
1012503-31 = "마스터도 제가 모자를 벗어야 한다는 건가요?"
1012503-32 = "즉…… 부끄러운 모습이 되어 줬으면 한다는……?"
1012503-33 = "[s] \"원하지 않습니다!!\""
1012503-34 = "제가 험한 꼴을 당하지 않으려면 감독관을 바꾸는 수밖에 없어요."
1012503-35 = "역시 저주의 마법일까요? 그날만 하루 종일 배가 아프게 되는 마법을 걸어서……."
1012503-36 = "[s] \"그, 그런 마법도 쓸 수 있어?\""
1012503-37 = "마법에 불가능이란 없습니다. 음식에 몰래 약을 타면……."
1012503-38 = "[s] \"마법이 아니잖아! 게다가 범죄라고!!\""
1012503-39 = "으, 으으으으……!"
1012503-40 = "저도 알아요. 그런 짓을 하면 안 된다는 것 정도는요."
1012503-41 = "……현 상황에서 감독관의 교체는 불가능."
1012503-42 = "저는 모든 무장을 해제당한 채 시험장 안에 들어가게 되겠죠."
1012503-43 = "그리고 무방비 상태로 마력이 바닥나서, 저런 꼴이나 이런 꼴로……!"
1012503-44 = "[s5] \"지금도 늦지 않았어!\"\n[s6] \"모자를 벗고 그림을 그리는 연습을 해보자!\""
1012503-47 = "지금 당장요?"
1012503-48 = "……그렇군요. 저에겐 시간이 없으니, 여유 부릴 틈이 없네요."
1012503-49 = "후우우우……."
1012503-50 = "좋아요. 벗겠습니다. 발가벗는 것만큼 부끄럽지만, 벗겠습니다……!"
1012503-54 = "……그럼 눈을 감고 고개를 돌려주세요. 저, 진짜로 창피하니까."
1012503-56 = "(에리가 시키는 대로 눈을 감고 고개를 돌렸다.)"
1012503-60 = "후우우우……."
1012503-61 = "……진짜 모자를 쓰고 옷을 벗는 게 나을 것 같아."
1012503-62 = "[s] \"부탁이니까 제발 그러지 말아 주세요!!\""
1012503-63 = "아, 알아요! 농담이라고요, 농담!"
1012503-64 = "아무튼 이제 됐어요. 눈을 떠주세요!"
1012503-66 = "어, 어떤가요? 이상하지 않나요?"
1012503-67 = "[s7] \"이상하지 않아.\"\n[s8] \"자연스러워 보이니까 걱정 안 해도 돼.\""
1012503-70 = "그, 그렇군요. 에헤헤헤헤……."
1012503-71 = "고마워요, 마스터. 덕분에 힘이 나네요."
1012503-79 = "앗, 에리 쨩이다."
1012503-80 = "안녕, 에리 쨩! 모자 벗고 있는 모습 오랜만이네."
1012503-81 = "여, 여, 여러분은……?!"
1012503-82 = "아, 아, 아, 안녕하세요! 여, 여기는 갑자기 무, 무슨 일로?!"
1012503-83 = "오후 실기 시험 연습하러 왔지."
1012503-84 = "에리 쨩도 연습하러 온 거구나?"
1012503-85 = "시험, 함께 힘내자! 응원할 테니까!"
1012503-86 = "가, 감, 감사합니다! 여, 여, 열심히 하겠습니다……!!"
1012503-91 = "아, 아아……! 망했어요! 같은 과 분들에게 알몸으로 있는 모습이 들키다니……!"
1012503-92 = "[s] \"알몸 아니야! 정신 차려!\""
1012503-93 = "……그, 그렇군요! #n모자를 벗는 건, 벼, 별로 대단한 일은 아니……! #n……일반적으로는."
1012503-98 = "……으으, 역시 안 되겠어요."
1012503-99 = "어떻게든 모자만이라도 쓰고 시험장 안에 들어갈 방법을 찾아야겠어요."
1012503-100 = "……그래요. 마법으로 사람들의 눈에 보이지 않는 마법 모자를 만드는 거예요."
1012503-101 = "그런 모자를 쓰고 들어가면 안전할 수 있……."
1012503-102 = "……는 게 아니라, 그러면 모자를 안 쓴 것과 똑같잖아요!"
1012503-106 = "벌거벗은 임금님이냐고요!"
1012503-107 = "아아아, 망했어! 역시 복통이 오는 저주의 마법을 걸어야……!"
1012503-108 = "[s9] \"지, 진정하고 그림 연습을 하자!\"\n[s10] \"연습을 하다 보면 분명 훌륭한 작품이 나올 거야!\""
1012503-111 = "으으으, 제가 정말 잘할 수 있을까요?"
1012503-112 = "[s] \"응! 옆에서 계속 마나를 충전해 줄 테니까!\""
1012503-113 = "그렇게 말씀하신다면……."
1012503-114 = "……알겠습니다, 마스터. 생각을 전환해서 어떻게든 힘을 내볼게요."
1012503-115 = "그래요. 누드모델이 된 기분으로 부끄러움을 잊어보는 거예요."
1012503-116 = "누드도 예술의 한 영역이니까요……."
1012503-117 = "[s] \"뭐, 뭔가 좀 이상한 것 같지만 힘을 내!\""
1012503-119 = "(이후 에리의 모델이 되어 열심히 실기시험 연습을 도왔다.)"
