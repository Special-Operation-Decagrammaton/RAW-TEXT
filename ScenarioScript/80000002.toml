[translation]
80000002-1 = "발주 미스"
80000002-2 = "샬레 빌딩 내 <엔젤 24>"
80000002-5 = "어, 어서 오세요. 선생님……."
80000002-8 = "……"
80000002-9 = "저, 선생님. 혹시 초콜릿 선물하실 분 안 계신가요?"
80000002-10 = "지금이라면 저희 엔젤 24에서 초콜릿 1+1 증정 이벤트를 하고 있으니까요!"
80000002-11 = "좋아하는 사람 두 명에게 동시에 고백할 수 있는 절호의 기회에요!"
80000002-12 = "[s] \"그랬다가는 싸움이 날 것 같은데…….\""
80000002-13 = "그, 그렇겠죠?"
80000002-14 = "하우우…… 이를 어쩌죠……."
80000002-15 = "[s] 무슨 일이냐고 묻는다."
80000002-16 = "다름이 아니라…… 발렌타인 데이를 앞두고 초콜릿을 발주하려 했는데, 수량을 실수로 잘못 기입해서요."
80000002-17 = "초콜릿 20개가 아니라, 20박스를 주문해 버렸어요……."
80000002-18 = "급한 대로 초콜릿 1+1 이벤트를 열긴 했지만, 찾아오는 손님도 거의 없는 이런 가게에서 초콜릿이 20박스나 팔릴 것 같지도 않고……."
80000002-19 = "발주를 실수했다는 사실을 본사에 들키면 정말 끝장이에요."
80000002-20 = "이대로는 용돈이 문제가 아니라, 어마어마한 액수의 환불금을 물게 될지도……."
80000002-21 = "[s] \"거리에 나가서 초콜릿을 직접 팔자!\""
80000002-22 = "네? 건물 밖에서 초콜릿을 직접 팔자고요?"
80000002-23 = "무, 물론 샬레를 방문하는 손님들을 상대로 파는 것보다는 효과적이겠지만……."
80000002-24 = "20박스, 낱개로는 200개 가까이 되는 초콜릿을 하루 만에 팔 수 있을까요……?"
80000002-25 = "[s1] \"걱정 마.\"\n[s2] \"내가 직접 판매를 도와줄게.\""
80000002-26 = "(우으…… 수상한 사무실의 그 선생님께 빚을 지고 싶지는 않았지만…….)"
80000002-27 = "(우으…… 수상한 사무실의 그 선생님께 빚을 지고 싶지는 않았지만…….)"
80000002-28 = "(하지만 다른 방법도 없고…… 그렇게 나쁜 사람은 아닌 것 같기도 하고…….)"
80000002-29 = "……네. 그럼 부탁드릴게요, 선생님!"
80000002-31 = "(이후, 소라와 함께 샬레 건물 밖으로 나가 직접 초콜릿을 팔았다.)"
80000002-38 = "(지나가는 학생들이 관심을 보여준 덕분에 초콜릿은 금방 매진되었다.)"
80000002-40 = "……대, 대단해요. 선생님. 그 많은 초콜릿이 순식간에 다 팔렸어요!"
80000002-41 = "심지어 그중에는 트리니티나 게헨나의 유명한 분들도 있었던 것 같고……"
80000002-42 = "역시 수상한 선생님……"
80000002-43 = "[s] \"응? 방금 뭐라고 말했어?\""
80000002-44 = "아, 아무것도 아니에요!"
80000002-48 = "……수상한 어른이지만, 가끔은 믿음직스러울지도……."
80000002-52 = "저, 선생님. 초콜릿이 하나 남았는데요……."
80000002-53 = "혹시 괜찮으시다면 이 초콜릿을 받아주시겠어요?"
80000002-58 = "아, 아뇨, 아뇨! 깜박 잊고 미처 팔지 못한 게 아니에요."
80000002-59 = "이 초콜릿은…… 제가 제 사비로 구입해서 드리는 거니까요……."
80000002-60 = "부디 즐거운 발렌타인 데이가 되셨으면 좋겠네요."
