[translation]
1011703-1 = "걸 온 더 스트리트"
1011703-2 = "(길거리를 지나고 있던 중……)"
1011703-6 = "[ns] \"저건……\""
1011703-11 = "[ns] \"히카리, 뭐 하고 있어?\""
1011703-13 = "아- 선생님-"
1011703-14 = "이리 와봐- 빨리-"
1011703-16 = "(히카리의 옆으로 가보았다.)"
1011703-18 = "이거- 보여-?"
1011703-22 = "[ns] \"이건……\""
1011703-24 = "(검은 개미들과 붉은 개미들이 뒤엉켜 싸우고 있었다.)"
1011703-26 = "[ns] \"개미 전쟁……!\""
1011703-27 = "응- 개미 대격돌- 키보토스 최후의 라그나로크-"
1011703-28 = "[s] \"이걸 구경하고 있었구나.\""
1011703-29 = "응응- 히카리 취미-"
1011703-30 = "하루 종일도 볼 수 있어-"
1011703-31 = "선생님- 어느 쪽이 이길 것 같아-?"
1011703-32 = "[s1] \"이거 옛날 생각 나네……\"\n[s2] \"과연 어느 쪽일까……\""
1011703-38 = "검은 쪽은- 덩치가 크고-"
1011703-39 = "빨간 쪽은- 수가 많아-"
1011703-40 = "[ns3] \"검은색!\"\n[ns4] \"빨간색!\""
1011703-43 = "흐응- 그럼 히카리는 그 반대-"
1011703-44 = "아- 검은 쪽 장군 등장-"
1011703-45 = "엄청 커- 빨간색 패배의 위기-"
1011703-46 = "[s] \"하지만 빨간 색도 여럿이 달라붙어서……!\""
1011703-47 = "흥미진진-"
1011703-49 = "(그렇게 시간 가는 줄 모르고 히카리와 한참 동안 개미 구경을 하던 찰나……)"
1011703-51 = "아- 빨간색 포병부대 출동-"
1011703-52 = "전탄발사-"
1011703-53 = "[s5] \"개미산을 쏘고 있네.\"\n[s6] \"히카리, 위험하니까 조금 뒤로……\""
1011703-56 = "아얏-"
1011703-57 = "으앙- 히카리 피격당했어-"
1011703-58 = "[s] \"이런! 이쪽으로……!\""
1011703-60 = "(황급히 가까운 수돗가로 히카리를 데려가서 물로 세척했다.)"
1011703-62 = "우우- 히카리 치명상……"
1011703-63 = "[s7] \"그래도 다행히 살짝 튄 거라, 큰 문제는 없을 것 같네.\"\n[s8] \"많이 아파?\""
1011703-66 = "초당 5억 포인트의 데미지……"
1011703-67 = "복수할 거야- 지금의 히카리는 어벤저-"
1011703-68 = "[s9] \"착한 히카리가 참자……!\"\n[s10] \"맛있는 거 사줄게……!\""
1011703-71 = "우우…… 맛있는 거……"
1011703-72 = "하지만 철저하게 복수해야- 개미들이 히카리를 얕보지 않을 텐데……"
1011703-76 = "으응-"
1011703-77 = "그럼- 히카리가 흘린 피의 가치만큼 맛있는 거 사줘-"
1011703-78 = "[s] \"피는 안 흘렸지만 말야……\""
1011703-80 = "(마저 응급조치를 끝낸 뒤, 히카리와 맛있는 걸 먹으러 갔다.)"
