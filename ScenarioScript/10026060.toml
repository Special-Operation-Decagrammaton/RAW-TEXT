[translation]
10026060-1 = "제6화;조사 포인트 D. 잊힌 등대"
10026060-3 = "일단은 한 짐……."
10026060-4 = "영차……."
10026060-5 = "후우. 생각보다 등대 안에도 조사할 것들이 많나 보네요. 좋은 일이지만요."
10026060-6 = "사실 고대 성도회 분들이 쓰신 곳이라 해서, 좀 더 텅 비어 있을 줄 알았는데……."
10026060-7 = "……음? 어라……?"
10026060-8 = "선생님……? 여기 계셨나요? 안에서 다른 분들과 같이 조사하시는 줄 알았는데……."
10026060-9 = "[s1] \"히나타를 도와주러 왔지.\"\n[s2] \"혼자 짐 나르느라 고생이 많아 보여서.\""
10026060-12 = "그, 그런……! 괜찮아요. 괜히 저 때문에 그러실 필요 없어요!"
10026060-13 = "계속 말씀드렸잖아요? 이러는 쪽이 제가 편하니, 이렇게 하게 해 달라고!"
10026060-14 = "아, 아닌가? 선생님은 선생님이시니까……. 역시 그냥 두고 보실 수 없는 걸까요……?"
10026060-15 = "……네? 그런 거 아니라고요? 그렇지만……. 으음……."
10026060-16 = "……후후."
10026060-17 = "그러네요. 일부러 그렇게 말씀해 주셨는데, 따지는 건 그것대로 좋지 않겠지요."
10026060-18 = "감사합니다. 그럼 그런 것으로 알고……. 작은 것들은 같이 부탁드리도록 할게요."
10026060-19 = "그래도 큰 건……. 정말로 무거우니까, 그건 제가 들겠습니다."
10026060-23 = "……그럼 같이 가실까요?"
10026060-25 = "(이후 히나타와 등대 안에서 찾아낸 짐들을 밖으로 빼내었다.)"
10026060-26 = "후……. 이 정도면 큰 것들은 다 뺀 거 같죠?"
10026060-27 = "다른 분들은 안에서 조금 더 조사하신다는 것 같으니……. 일단 여기서 기다리도록 할까요?"
10026060-28 = "정말로 고생 많으셨어요, 선생님. 그리고 다시 한번 감사합니다."
10026060-32 = "……음? 방금 뭔가 소리가……? 숲속 쪽에서 난 소리일까요……?"
10026060-39 = "……! 역시……."
10026060-40 = "이번에도……겠군요."
10026060-49 = "이거……. 완전히 포위됐네요……. 이렇게까지 될 거라곤 생각지 않았는데……."
10026060-50 = "……네?"
10026060-51 = "다른 분들이요? 불러서 같이 대응해야 할 거 같다고요……?"
10026060-52 = "음……. 그건……."
10026060-56 = "[ns3] \"……히나타?\"\n[ns4] \"주변을 둘러보고 있어……?\""
10026060-59 = "아, 죄송해요. 선생님. 그……. 몇 분이나 되시는지 좀 살펴보려고……."
10026060-60 = "우이 씨와 다른 분들은 지금 중요한 조사 중이시니, 가급적 집중하게 해드리고 싶어서요."
10026060-61 = "혹시나 가능하다면……. 제가 막을 수 있을까……하고 어림잡아 보고 있었어요."
10026060-65 = "[ns] \"…………???\""
10026060-67 = "[ns5] \"어……? 혼자서 상대하겠다는 거야!?\"\n[ns6] \"수십 명은 돼 보이는데요……!?\""
10026060-70 = "그, 그런가요……? 하지만 이 정도 전투는 곧잘 하는 편이고……."
10026060-71 = "성당에는 많은 일들이 있으니까요……. 여러 상황에 대처하다 보면 이런 일 저런 일……."
10026060-72 = "왜 놀라시는 건가요……!? 혹시 이상한가요!? 뭔가 잘못 말했나요, 저……!?"
10026060-73 = "설마 아닌 건가요? 일상생활 하다 보면 이 정도의 전투, 곧잘 있지 않나요!?"
10026060-78 = "……아, 오, 옵니다! 선생님!!"
10026060-79 = "시간이 없어요, 일단은 제가 한 번 막아볼게요! 선생님만 괜찮으시다면……!!"
10026060-80 = "[s7] \"이, 일단 알았어. 한 번 해보자!!\"\n[s8] \"지휘는 내가 맡을 테니, 몸조심해.\""
10026060-83 = "……네!"
10026060-87 = "감사합니다!! 선생님!"
