[translation]
10007115-1 = "에필로그;붉은겨울 학원의 어느 평범한 하루"
10007115-4 = "구(舊) 227호 온천장"
10007115-7 = "[ns] \"………….\""
10007115-9 = "서, 선생님. 엄청난 폭발이 있었는데…… 괜찮으신가요?"
10007115-10 = "[s1] \"빠르게 도망쳐서 괜찮아.\"\n[s2] \"다친 곳은 없어.\""
10007115-11 = "선생님께서 다치시지 않았다니 다행이네요."
10007115-12 = "선생님께서 다치시지 않았다니 다행이네요."
10007115-13 = "하지만 온천장 건물은……."
10007115-14 = "기둥 하나 남지 않고 폭삭 무너져 내리고 말았군. 이 무슨 처참한 광경이란 말인가……."
10007115-21 = "……최악이에요."
10007115-22 = "모처럼 기대를 걸었던 온천은 말라버리고, 그나마 체리노 회장의 선처로 남겨둘 수 있었던 온천장 건물까지 폭발해 버렸으니……"
10007115-23 = "과거의 구교사 생활에서 하나도 달라진 게 없어요……."
10007115-24 = "……아니. 거기에 더해 폭발로 인해 재투성이가 되기까지 했으니, 오히려 전보다 나빠졌다고 할 수 있겠죠."
10007115-28 = "그래도…… 어쩔 수 없네요."
10007115-29 = "이런 일로 주저하고 포기하기엔 아직 세상에 못 본 아름다운 것들이 잔뜩 남아있으니까요."
10007115-35 = "그리고 무엇보다 소중한 선생님과 친구들이 무사하니…… 그걸로 만족이에요!"
10007115-36 = "응, 모두 무사해서 다행이네!"
10007115-37 = "[s] \"언제나 응원할게, 노도카.\""
10007115-38 = "후후, 감사합니다. 선생님."
10007115-39 = "다만, 폭발로 인해 먼지를 잔뜩 뒤집어쓰는 바람에 옷이랑 머리가 엉망이 되고 말았네요."
10007115-40 = "빨리 몸을 씻고 싶은데…… 온천이 없어진 게 이럴 때는 유감이에요."
10007115-42 = "그건 이 몸도 마찬가지이니라!"
10007115-43 = "으으, 뭔가 끈적거리는 게 수염에 잔뜩 묻어서 기분 나빠……."
10007115-44 = "구교사에 몸을 씻을 만한 장소가 없을까요?"
10007115-45 = "구교사의 화장실이 하나 있기는 하지만, 수도가 끊긴 지 오래라…… 특별반의 학생들은 드럼통에 물을 데워서 사용하곤 했어요."
10007115-46 = "그럼 붉은겨울 학원의 최고 존엄인 이 몸이 이런 추레한 꼴로 사무국으로 돌아가란 말이냐? 그래서는 이 몸의 권위가 서질 않아!"
10007115-52 = "노도카. 저 쪽에 폭발에 휘말리지 않은 노천탕이 하나 남아있어."
10007115-53 = "물도 아직 깨끗한 걸 보니 아직 사용할 수 있을 것 같아."
10007115-54 = "정말이야?"
10007115-55 = "잘 됐다!"
10007115-56 = "그럼 빨리 몸에 묻은 먼지를 씻어내러 탕에—"
10007115-57 = "잠깐! 이 몸을 놔두고 구교사의 정학생들이 먼저 씻겠다니, 있을 수 없는 일이야!"
10007115-58 = "이 몸도 같이 탕에 들어가겠다!"
10007115-60 = "체리노 회장님께서 들어가신다면 저도……."
10007115-61 = "이제 요란스러운 소동은 사양이야…… 따듯한 탕 속에서 휴식하고 싶어……."
10007115-62 = "이제는 몸을 씻을 권리마저 독차지하려는 건가?"
10007115-63 = "사무국의 학생들이 들어간다면 우리도 함께 탕에 들어가겠어!"
10007115-65 = "자, 잠시만요! 이렇게 많은 분이 한꺼번에 들어가기에는 탕이 너무 좁을 거라고요!"
10007115-66 = "뭐, 어때. 좁은 탕 안에서 북적대며 다 함께 목욕을 하는 것도 나는 괜찮아."
10007115-67 = "……게다가 탕이 남아 있는 한 <227호 온천장>의 영업은 아직 끝나지 않은 거잖아?"
10007115-68 = "마지막까지 잘 부탁할게, '지배인'님."
10007115-69 = "……어휴."
10007115-70 = "시구레 쨩이 그렇게 말하니 어쩔 수 없네요."
10007115-74 = "<227호 온천장>, 임시 개장입니다!"
10007115-78 = "후우…… 정말 좋은 탕이네요. 하루의 피로가 모두 씻겨 내려가는 것 같아요."
10007115-79 = "음. 앞으로는 이런 좋은 탕을 즐길 수 없을 거라는 사실이 새삼 아쉽군."
10007115-80 = "사무국 건물에 피해가 생기지 않도록 새로운 온천을 건설하는 방법은 없을까?"
10007115-81 = "체리노 쨩. 그렇게 고양이 세수만 하면 제대로 때를 씻을 수 없다고요?"
10007115-82 = "자, 제가 직접 씻겨드릴 테니 이리로 오세요."
10007115-83 = "우웃! 이 몸은 어린 아이가 아니느니라! 이 몸의 수염에 손 대지 말거라!"
10007115-88 = "후후, 뜨거운 탕에 앉아서 마시는 모르스의 맛도 각별하네~"
10007115-89 = "응? 그 병에 담긴 음료는 뭐지?"
10007115-90 = "설마 사무국의 보안위원 앞에서 뻔뻔하게 알코올을 마시는 건 아니겠지?"
10007115-91 = "그럴리가. 이건 지난 봄에 내가 담근 특제 모르스라고."
10007115-92 = "물론 조금 발효되긴 했지만."
10007115-93 = "응? 지금 무어라고 했나?"
10007115-94 = "후후, 아무것도 아니야."
10007115-95 = "그렇게나 의심스럽다면 보안위원장도 한 잔 할래?"
10007115-96 = "뭐, 한 모금 정도라면…… 상관없겠지."
10007115-101 = "동지들! 비록 오늘은 사악한 압제자의 신무기 앞에 발길을 돌리고 말았지만, 이는 절대로 우리의 패배가 아니다! 2보 전진을 위한 1보 후퇴일 뿐이다!"
10007115-102 = "다음번에는 그 볼썽사나운 전차를 미리 사보타주하여 위험을 차단하고 혁명적 승리를 쟁취하도록 하자!"
10007115-103 = "사보타주다! 혁명이다!"
10007115-108 = "으으, 소란스럽네요. 이래서 다같이 들어오고 싶지 않았던건데……."
10007115-109 = "[s] \"그래도 다들 기운차 보여서 다행이야.\""
10007115-110 = "하하…… 기운 없는 붉은겨울 학생들의 모습을 상상하는 게 더 어렵겠지만요."
10007115-112 = "……선생님."
10007115-113 = "오늘 여러 가지 소동이 있기는 했지만, 온천장에서 보내신 오늘 하루는 즐거우셨나요?"
10007115-114 = "[s3] \"즐거운 하루였어.\"\n[s4] \"최고의 하루였어.\""
10007115-115 = "그렇게 생각해주셨다니 다행이네요. 헤헤."
10007115-116 = "그렇게 생각해주셨다니 다행이네요. 헤헤."
10007115-117 = "비록 이제 온천은 없지만, 다음 번에도 구교사를……"
10007115-118 = "아니, 저희 227호 특별반을 찾아와주세요."
10007115-124 = "저희는 언제까지나 선생님을 기다리고 있을테니까요!"
10007115-125 = "227호 온천장 운영일지!"
