[translation]
1600906-1 = "닌자 소녀는 빛나고 싶어!"
1600906-2 = "백귀야행 오리꽥꽥 공원"
1600906-3 = "(그리하여 사전에 미치루와 약속(?)한 대로 시간에 맞춰 공원에 나왔다.)"
1600906-4 = "[ns] \"일단 나오긴 했는데, 어쩐 일로 부른 거야?\""
1600906-5 = "우후후. 그게 말이지. 선생 공도 이미 짐작했다시피……. 오늘 이렇게 우리가 밤중에 모인 이유는 단 하나-"
1600906-6 = "이번에 내가 새롭게 만들어 낸 자작 인법……."
1600906-7 = "그 인법을 영상으로 찍어서, 우리 채널 <소녀인법첩 미치룻치>에 올리기 위해서야!"
1600906-8 = "[s] \"전혀 상상도 못했다…….\""
1600906-9 = "뭐어? 이런이런, 선생 공- 무슨 소리를 하는 거야?"
1600906-10 = "이미 내가 앞서 선생 공이 눈치챌 수 있도록 충분히 복선을 뿌려 놨는데!"
1600906-11 = "[s] \"복선?\""
1600906-12 = "맞아, 복선. 선생 공도 모모톡에서 내가 부자연스러울 정도로 갑자기 화제 전환을 한다고 말했잖아?"
1600906-13 = "하지만 떠올려 봐! 화제를 전환하기 직전까지 내가 무슨 이야기를 하고 있었는지!"
1600906-14 = "[s] \"분명 직전까지, 샬레에 놓고 간 만화책 19권에 대해…….\""
1600906-15 = "바로 그거야! 선생 공! 선생 공도 알다시피, 카마보코 돌풍전 19권은 엄청 기념비적인 에피소드가 담겨 있던 단행본이잖아!"
1600906-16 = "무려 주인공인 카마보코 쨩이 피나는 수련을 통해, 처음으로 자신만의 시그니처 인법을 손에 넣는 명장면이 바로 19권에서 나왔으니까!"
1600906-17 = "[s] \"……그, 그랬던 거야?!\""
1600906-18 = "우냐앗?! 이걸 모른다고……? 으음, 선생 공. 아직 수련이 부족하구나?"
1600906-19 = "하여간 그 왜, 최근에 유행하고 있는 콘텐츠 중에 <XX에 나오는 XX를 만들어보았다>라고 해서- 흔히 만들어 보았다 장르의 영상이 인기가 많잖아?"
1600906-20 = "그러니 나도 그 시장을 노려서 <카마보코에 나올 법한 자작 인법을 만들어 보았다!>라는 영상을 찍을 생각이다. 뭐, 이런 거지."
1600906-21 = "그래서 오늘 영상을 찍는 데 쓸 물건은 바로 이거!"
1600906-22 = "이름하여 <화염난무 닌자 불꽃놀이 세트>!! 간편하게 불만 붙이면 화려하게 불꽃이 반짝이는 멋진 물건이야!"
1600906-23 = "이걸 이용하면……. 내가 평소 상상하고 있던 인법을 완벽하게 구현해낼 수 있을 거야!"
1600906-24 = "[s1] \"아무리 봐도 그냥 닌자라는 단어만 갖다 붙인 듯한 느낌이…….\"\n[s2] \"불을 쓰는 건 조금 위험하지 않을까? 조심해야 해?\""
1600906-25 = "자자, 사소한 건 신경 쓰지 말자구! 그리고 준비도 완벽히 해뒀으니까. 괜찮아!"
1600906-26 = "자자, 사소한 건 신경 쓰지 말자구! 그리고 준비도 완벽히 해뒀으니까. 괜찮아!"
1600906-30 = "만약을 위해, 여기 물 양동이도 준비했고, 인법을 어떻게 보여줄 건지- 응, 영상의 콘티도 머릿속으로 완벽하게 구상했으니까-! 계획은 완벽해!"
1600906-31 = "그럼 선생 공! 잘 찍어줘야 해-?"
1600906-32 = "시작부터 화려하게 갈 테니까-!"
1600906-39 = "[wa:850]― 그럼 [wa:1000]보여드리겠소이다!"
1600906-41 = "― 내가 고안해낸, [wa:2000]새로운 미치루류 [wa:1900]인법을! [wa:50]"
1600906-44 = "[wa:450]― <인법! [wa:900]반짝반짝 파이어[wa:1000]의 술!>"
1600906-47 = "[wa:300]― 아하핫! [wa:900]선생 공-! [wa:1000]어때어때?"
1600906-49 = "― 느낌 있지 않아??"
1600906-52 = "― 내 멋진 모습, [wa:1450]잘 나오고 있어?"
1600906-55 = "[wa:800]― 이 닌자다운 [wa:1100]판타스틱함…. [wa:1700]완벽해!"
1600906-57 = "― 역시 나야말로, [wa:1500]인법연구부 [wa:800]최강의 [wa:700]부장!"
1600906-60 = "[wa:400]― 아, [wa:800]여기서부터가 또 굉장하니까."
1600906-62 = "― 잘 보고 있으라구!"
1600906-65 = "― 하나- [wa:800]둘!"
1600906-69 = "이얍, 이얍~! 어떠냐~! 멋지지?"
1600906-70 = "응! 이거, 느낌이 좋아! 촉이 온다고나 할까! 이대로면 이번 영상의 조회수는 대박이 날 거야!"
1600906-71 = "그렇게 되면 스페셜 땡스에 친히 선생 공의 이름도 적어줄 테니까 말이야!"
1600906-75 = "[ns] \"앗, 근데 미치루. 너 머플러 끝이…….\""
1600906-76 = "응……?"
1600906-77 = "앗-뜨, 거엇! 뭐, 뭐야?! 우, 우와아앗?!"
1600906-78 = "서, 선생 공?! 무, 물물물……! 빨리 물을 소환하는 인법을……!"
1600906-79 = "[ns] \"가능하겠냐……! 우선 여기, 양동이로……!\""
1600906-83 = "어푸어푸어푸……! 쿨럭쿨럭……!!"
1600906-85 = "(다행히 재빠르게 반응한 덕분에 일이 더 커지기 전에 불은 끌 수 있었지만……)"
1600906-87 = "방금 건 취소! 취소니까! 다시, 다시 찍는 거야! 이번에야말로……!"
1600906-88 = "응? 안 된다고?"
1600906-89 = "어, 어째서야?! 선생 공……?!"
1600906-90 = "[s3] \"그야 위험하니까. 게다가 이대로 있으면 감기에 걸릴 거야.\"\n[s4] \"다른 소재를 생각해 보자. 미치루가 위험하지 않은 방법으로\""
1600906-91 = "아, 날 걱정해서……? 안 된다고……."
1600906-92 = "아, 날 걱정해서……? 안 된다고……."
1600906-93 = "그, 그럼 어쩔 수 없네! 응. 어쩔 수 없겠어……."
1600906-94 = "우냐악-! 생각처럼 풀리지 않은 건 답답해 죽을 거 같지만!"
1600906-95 = "그래도…… 나, 치도리 미치루! 인법연구부의 부장은 포기하지 않아!"
1600906-96 = "반드시 방법을 찾아내서……! 언젠가는 엄청나게 굉장한- 닌자 콘텐츠를 만들어서……."
1600906-97 = "키보토스 전체에 닌자를 알리고, 우리 채널의 구독자 숫자도 세 자릿수를 달성하고야 말겠어!"
1600906-98 = "[s] \"목표와 이상이 높은 건지, 아닌 건지……\""
1600906-99 = "에잇~! 사소한 건 신경 끄고! 돈 마인! 돈 마인!"
1600906-100 = "앞으로도 소생의 닌자 콘텐츠 만들기- 그리고 인법연구부의 활동!"
1600906-101 = "선생 공도 협력해 주기를 바라오-!"
1600906-102 = "[s] \"응, 물론이야.\""
1600906-103 = "우햐햣. 응-!"
