[translation]
1005505-1 = "오붓하게"
1005505-2 = "(약속한 날 시내 레스토랑 근처에서 시구레를 기다렸다.)"
1005505-6 = "(시간이 되자 저 멀리서 여유롭게 걸어오는 시구레의 모습이 보였다.)"
1005505-7 = "[ns1] 손을 흔들어 인사한다.\n[ns2] \"이쪽이야, 시구레.\""
1005505-10 = "알았어, 알았어. 가고 있으니까~"
1005505-15 = "그렇게 손을 흔들어 인사하지 않아도 괜찮은데. 괜히 다른 사람들 눈에 띄잖아."
1005505-16 = "아니면 일부러 그런 걸까? 이 상황을 남들에게 티 내고 싶었다든가……."
1005505-20 = "농담이야, 농담. 그렇게 당황하지 않아도 돼."
1005505-21 = "그래서……."
1005505-22 = "붉은겨울 학원에서 한참 떨어진 이런 번화가까지 불러내서 해준다는 그 '답례'라는 건 뭐야?"
1005505-23 = "……응? 음식점? 아아. 역시 그런 느낌이려나……."
1005505-24 = "[s3] \"달리 좋아하는 게 있으면 말해줘.\"\n[s4] \"모처럼 번화가에 나왔으니까. 어디가 좋아?\""
1005505-27 = "으으음. 싫다는 뜻은 아니었어. 오히려 대환영이야."
1005505-28 = "붉은겨울 학원— 구교사 근처에는 이런 번화가나 고급 레스토랑이 없잖아?"
1005505-29 = "평소라면 먹어볼 수 없는 맛있는 음식을 먹을 수 있다니, 내게는 분에 넘치는 호사지."
1005505-30 = "혹시……. 예약해 둔 곳이라도 있어?"
1005505-31 = "아, 역시 있구나. 그럼 오늘은 선생님의 에스코트를 믿고 따라가 볼까."
1005505-37 = "……잘 부탁해, 선생님."
1005505-46 = "(이후, 시구레와 함께 레스토랑에서 식사를 즐기며 즐거운 시간을 보냈다.)"
1005505-47 = "(……다만 식사 중 능청스럽게 반주를 주문하려는 시구레를 말리느라 한동안 고생을 했다.)"
1005505-54 = "아— 잘 먹었다. 고마워, 선생님."
1005505-55 = "음, 뭐랄까……"
1005505-56 = "오늘은 여러 가지로 신선한 경험을 잔뜩 하게 되네."
1005505-57 = "선생님과 단둘이 식사를 하는 것도, 번화가의 고급 레스토랑에서 입이 벌어질 만한 고급 요리를 먹는 것도, 따듯한 차를 즐기며……"
1005505-58 = "……도시의 야경을 바라보는 것도."
1005505-61 = "[wa:400]― 아름다운 야경이네……"
1005505-64 = "― 이런 멋진 풍경을"
1005505-66 = "― 보여줘서 고마워, [wa:1500]선생님."
1005505-69 = "[ns5] \"원한다면 좀 더 자주 데리고 나와 줄게.\"\n[ns6] \"시구레도 필요하면 언제든 연락해.\""
1005505-70 = "[wa:400]― 그렇게 말해 주는 건 [wa:1500]기쁘지만……"
1005505-71 = "[wa:400]― 그렇게 말해 주는 건 [wa:1500]기쁘지만……"
1005505-73 = "― 나는, [wa:1200]역시 지금의 장소가 좋아."
1005505-76 = "[wa:750]― 이런 도시에서는"
1005505-78 = "― 별이 잘 보이질 않거든."
1005505-81 = "[wa:400]― 너무 밝은 빛 속에서는,"
1005505-83 = "― 별을 [wa:1300]찾을 수 없게 되어버리니까……"
1005505-86 = "― 그러니까,"
1005505-88 = "― 나는 어둠 속에서 별을 바라보는 것으로 [wa:1650]충분해."
1005505-91 = "[wa:750]― 소중한 사람,"
1005505-93 = "― 그리고 맛있는 음료만 있다면……"
1005505-96 = "― 장소는 [wa:300]어디든 상관없어."
1005505-99 = "그나저나 구교사에 남아 있을 특별반 친구들을 생각하니 조금 미안해지는걸."
1005505-100 = "나만 혼자서 이렇게 선생님의 호의를 받고 있으니까 말이야."
1005505-101 = "……노도카에게 조금 미움받으려나? 후후."
1005505-102 = "[s7] \"다 같이 와도 괜찮은데.\"\n[s8] \"다음엔 특별반의 모두를 부를까?\""
1005505-108 = "음. 선생님……."
1005505-109 = "그 대답은, 좋은 점수를 주기 어렵겠는데."
1005505-110 = "뭐, 다른 사람도 아닌 선생님이니까. 그렇게 말할 거라고는 생각했지만."
1005505-111 = "[s] \"어라, 나 방금 뭔가 잘못 말했어?\""
1005505-112 = "아니. 농담이었어. #n……절반은."
1005505-113 = "선생님만 괜찮다면, 나쁘지 않은 제안이라고 생각해."
1005505-114 = "특별반의 친구들은 평소에도 고생이 많으니까. 이렇게 평소에 즐기지 못했던 신선한 경험을 할 수 있다면 다들 정말 즐거워할 거야."
1005505-115 = "특별히 희망하는 음식점이나 명소가 있냐고?"
1005505-119 = "글쎄. 어디든 괜찮지 않을까."
1005505-125 = "특별반의 모두와 선생님이 함께 있는 곳이라면……"
1005505-126 = "그곳이 어디든 내게는 세상에서 제일 행복한 장소일 테니까."
