[translation]
1300603-1 = "소악마의 형언할 수 없는 비밀"
1300603-2 = "(무츠키의 초대를 받아, 흥신소 사무실에 도착했다.)"
1300603-3 = "어서 와~ 선생님!"
1300603-4 = "오늘 선생님하고 놀려고 여.러.가.지를 잔뜩 준비했어♡"
1300603-6 = "[s] \"평소에 메고 다니는 그 가방이구나.\""
1300603-7 = "우선 트럼프 카드부터 시작해서……"
1300603-8 = "체스랑, 오셀로랑 백개먼~ 아! 카루타도 있어~"
1300603-9 = "[s] \"전부 다 보드 게임?\""
1300603-10 = "응, 오늘을 위해 준비한 게임들이야."
1300603-11 = "밖에서 노는 것도 좋지만, 이렇게 실내에서 느긋하게 게임을 즐기는 것도 재밌을 거야. 분명!"
1300603-12 = "쿠흐흐, 그럼 선생님. 가장 먼저 무슨 게임을 해볼까~?"
1300603-14 = "(그렇게 무츠키와 둘이서 여러 가지 보드게임으로 놀았다.)"
1300603-15 = "(어느덧 5시간 정도가 흘렀을 무렵…….)"
1300603-17 = "후아아, 재밌다!"
1300603-18 = "응, 벌써 시간이 이렇게 됐네? 생각보다 시간이 금방 지나가는걸~"
1300603-19 = "[s] \"그것이 바로 보드 게임의 매직…….\""
1300603-20 = "선생님, 어때 피곤해? 조금 쉴까?"
1300603-21 = "음, 목마르다. 잠깐 있어 봐. 어디 음료수가 있을 텐데~"
1300603-25 = "아참!"
1300603-26 = "참고로 나 없다고 가방 안을 들여다보면 안 돼?"
1300603-27 = "숙녀의 비.이.밀.이니까~"
1300603-28 = "알겠지?"
1300603-31 = "[s] \"가방?\""
1300603-32 = "(그러고 보면 지금까지 즐긴 수많은 보드게임이 저 가방에서 나왔었다.)"
1300603-33 = "(그 개수만 족히 20여 개에 이르렀으니…….)"
1300603-34 = "[s1] \"응? 잠깐.\"\n[s2] \"그게……. 물리적으로 가능한가?\""
1300603-35 = "(꿈틀)"
1300603-36 = "(꿈틀)"
1300603-39 = "[ns] \"……방금 가방이 꿈틀거렸어?\""
1300603-44 = "[ns] \"착각이겠지…….\""
1300603-46 = "[ns] \"무츠키가 돌아오기 전에 보드게임이나 정리해둬야…….\""
1300603-47 = "(꿈틀)"
1300603-50 = "[ns] \"역시……!\""
1300603-51 = "(꿈틀) (꿈틀)"
1300603-52 = "[ns] \"꿀꺽……\""
1300603-54 = "[ns3] \"……화, 확인해볼까.\"\n[ns4] \"무츠키 말대로……. 멋대로 들여다보는 건 곤란하지.\""
1300603-55 = "(꿀꺽)"
1300603-58 = "[ns5] \"그럼…. 어디?\""
1300603-60 = "(……!!!)"
1300603-62 = "(그 안에 들어있던 건 바로……)"
1300603-63 = "(주인이 자리를 비운 사이, 물건을 확인하는 건 역시 해서는 안 될 일이란 느낌이 들었다.)"
1300603-64 = "선생님?"
1300603-66 = "[ns] \"헉?!\""
1300603-67 = "선생님? 왜 그래? 귀신을 본 것처럼 멍한 표정으로."
1300603-68 = "[s] \"응? 방금까지 분명 가방이……\""
1300603-69 = "가방이? 왜?"
1300603-71 = "[s] \"으, 으음. 아무것도 아니야…….\""
1300603-72 = "뭐야~ 싱겁게, 자, 여기 음료수 가져왔어."
1300603-73 = "이러고 있을 때가 아니야. 아직 남은 게임이 무척 많아."
1300603-74 = "그.러.니.까. 자아, 지금부터 2차전 시작이야♥"
1300603-76 = "(그 뒤로도 별다른 일 없이 밤이 될 때까지 무츠키와 보드게임을 하며 잔뜩 어울렸다.)"
1300603-78 = "쿠흐흐……."
1300603-79 = "다행이야. 선생님. 내용물을 알지 못해서."
1300603-80 = "앞으로도 비.밀.이.야♡"
