[translation]
3702-1 = "怪しいリミナルスペース（１）"
3702-3 = "とある穏やかな昼下がり――"
3702-6 = ""
3702-7 = "みなさん、大事なお話があります。"
3702-9 = ""
3702-10 = ""
3702-11 = ""
3702-12 = "ふふっ。今日も面白い日になりそうですね。"
3702-13 = "「リミナルスペース」をご存じですか？"
3702-14 = "なにそれ？"
3702-15 = "私的空間と公共空間の境界が薄れた場所……。"
3702-16 = "現実と似ているようで、現実ではない……未知の空間。"
3702-17 = "異世界のスーパーに迷い込んだ話が有名だねぇ。"
3702-18 = "誰もいないスーパーをさまよい続けて、ようやく出会った店員……。#nしかしそれは店員ではなく――"
3702-19 = "化け物だった……って話。"
3702-20 = "……それは私も聞いたことある。"
3702-21 = "でも、ただの噂でしょ？"
3702-22 = "にゅふふ……果たしてそうでしょうか？"
3702-23 = "情報によると本当に存在するらしいのです。"
3702-24 = "それも、このワイルドハントに！"
3702-26 = ""
3702-27 = "イヒッ……その話、私も聞いたよぉ。"
3702-28 = "一度行ってみたいですね。"
3702-29 = "本気！？"
3702-30 = "傑作とは多様な経験から生まれるもの。"
3702-31 = "まだ見ぬ経験は、私たちの芸術を昇華させる助けとなってくれることでしょう。"
3702-32 = "果てしない挑戦こそが――"
3702-34 = ""
3702-35 = ""
3702-36 = "――「イノベーション」。"
3702-37 = "……ですから。"
3702-38 = "まーた適当なこと言って！もう騙されないんだから！！"
3702-39 = "ふふ。でも楽しそうじゃありませんか？#nみんなと一緒ならきっと怖くもありませんよ。"
3702-40 = "ホラー映画も、みんなで観れば怖くない……でしょ？"
3702-41 = "みんなで行けば大丈夫です！"
3702-43 = ""
3702-44 = ""
3702-45 = "……はぁ、行けばいいんでしょ？まあ、どうせそんな場所あるわけないけどね。"
3702-46 = "では、決まりですね。"
3702-48 = ""
3702-49 = "いざ行かん！オカルトの[ruby=たび]研究[/ruby]へ！"
3702-51 = "しばらくして――"
3702-53 = "怪しげな建物・1階"
3702-55 = ""
3702-56 = "ごめんくださーい……。"
3702-57 = "入るよー？"
3702-60 = "……。"
3702-61 = "……電気もついてないし、本当に誰も居ないみたい。"
3702-63 = ""
3702-64 = ""
3702-65 = "ここが、噂のリミナルスペース……。"
3702-66 = "どこかに異世界と繋がる入口があるはずです！"
3702-67 = "いや、よくある建物じゃない？#n窓の外が見えないことを除けば。"
3702-69 = ""
3702-70 = "……ん？#n待って、窓の外が見えない……？"
3702-71 = "外が見えないように、全て覆われています。"
3702-72 = "ふふっ、面白くなってきましたね。"
3702-73 = "な、なんでそんなことしてるのよ？"
3702-74 = "いま分かることは1つだけ……。"
3702-75 = "ここには……なにか「特別な目的」があるんだろうねぇ。"
3702-76 = "と、特別な目的？"
3702-77 = "おおっ！きっと異世界と繋がる場所に違いありません！#nさっそく探検を始めましょう！"
3702-79 = ""
3702-82 = ""
3702-83 = ""
3702-84 = ""
3702-85 = ""
3702-86 = ""
3702-88 = "みんなで建物の1階を見て回った。"
3702-89 = "そして――"
3702-91 = "この場所、思ったより興味深い構造をしています。"
3702-92 = "中からでは外の様子が分からず、なぜか階段は全てふさがれている。"
3702-93 = "たしかにここは「境目」が薄れた、外部と断絶された空間です。"
3702-94 = "リミナルスペースと呼ばれるのもおかしくありません。"
3702-95 = "でも、エレベーターは普通に使えるみたいですね。"
3702-97 = ""
3702-100 = "ほら、ちゃんと動いてます！"
3702-101 = "上がってみる？"
3702-102 = "う、うーーん……。"
3702-103 = "それとも……帰る？"
3702-104 = "い、いや。ここで帰ったら、リミナルスペースの存在を認めることになるでしょ！"
3702-105 = "この世にオカルトなんて無いって確認してやるんだから！"
3702-106 = "イヒッ、じゃあ行こうかぁ……。"
3702-108 = "8階まであるんですね。"
3702-109 = "まずは7階から行こ！7はラッキーナンバーだから。"
3702-110 = "ふふ。迷信は信じないのでは？"
3702-111 = "これくらいは普通でしょ！行くよ！"
3702-118 = "怪しげな建物・4階"
3702-120 = ""
3702-121 = "なんで4階で止まるの？7階押したよね？"
3702-123 = ""
3702-124 = ""
3702-125 = ""
3702-126 = ""
3702-127 = ""
3702-128 = "反応しない！？"
3702-130 = ""
3702-131 = "ずっとエレベーターの中にいる訳にもいきませんし、とりあえず降りましょう。"
3702-132 = "にゅふふっ……何があるのかワクワクします。"
3702-133 = "4階……なんか不吉……。"
3702-134 = "心配せずとも、私たちが守ってあげますよ。"
3702-136 = ""
3702-137 = ""
3702-138 = ""
3702-140 = "怪しげな建物・4階廊下"
3702-141 = "……綺麗な廊下ですね。"
3702-142 = "このドアはどこに繋がるんでしょう？"
3702-143 = "ちょっ、すぐ開けようとしないで！なんか出てきたらどうするのよ！"
3702-144 = "あら？ここ、見てください。何か貼ってあります。"
3702-145 = "読んでみようか……。"
3702-147 = ""
3702-148 = "好奇心は猫をも殺す、という言葉を知っていますか？"
3702-150 = "皆さんは入ってはならない場所に足を踏み入れました。"
3702-151 = "ここは現実の裏面。迷宮とも言える、境界の空間。"
3702-152 = "ここから出るためには異常現象を調べなくてはなりません。"
3702-154 = "異常現象を発見した場合、エレベーターに乗って1つ上の階へ。"
3702-155 = "異常現象がない場合は、1つ下の階へ。"
3702-156 = "「外に出たい」と心から思うのならば――このルールを必ず守ってください。"
3702-157 = "ルールに違反した場合、皆さんは8階へ導かれます。"
3702-158 = "そして、永遠に8階をさまようことになるでしょう……まるでメビウスの輪のように。"
3702-159 = "ふふ、ふふふふふ……。"
3702-161 = ""
3702-162 = ""
3702-163 = ""
3702-164 = "――だって。"
3702-166 = ""
3702-167 = "……。"
3702-168 = "な、なに……？"
3702-169 = "うぅぅ……。"
3702-170 = "こんなイタズラ仕掛けたの誰！？"
