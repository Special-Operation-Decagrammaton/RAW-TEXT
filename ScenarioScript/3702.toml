[translation]
3702-1 = "수상한 리미널 스페이스 1"
3702-3 = "평화로운 와일드헌트 학원의 어느 날……."
3702-7 = "오컬트 연구회 회원 여러분. 중요한 전달 사항이 있습니다."
3702-12 = "후후, 오늘도 재미있는 주제를 가져오신 것 같네요. 어떤 일일까요?"
3702-13 = "여러분은 혹시 <리미널 스페이스>에 대해 들어보셨는지요?"
3702-14 = "리미널…… 스페이스? 그게 뭐야?"
3702-15 = "사적 공간과 공적 공간의 경계가 허물어진 장소……."
3702-16 = "현실과 닮았지만…… 현실이 아닌 미지의 공간……."
3702-17 = "다른 세계의 마트에 빠졌다가 가까스로 탈출한 이야기가 유명하지."
3702-18 = "텅 빈 마트를 헤매다 겨우 직원을 만났는데……"
3702-19 = "그건 직원이 아니라 괴물이었다는 이야기……."
3702-20 = "……그, 그거 나도 들어본 것 같긴 한데."
3702-21 = "하, 하지만 그건 이야기일 뿐이잖아?"
3702-22 = "뉴후후, 과연 그럴까요?"
3702-23 = "소문에 의하면, 수상한 리미널 스페이스가 현실에도 존재한다고 합니다."
3702-24 = "그것도 우리 학원 안에요!"
3702-27 = "그 소문…… 나도 들었어. 히히……."
3702-28 = "와아, 궁금해요. 한번 찾아가 보고 싶어요."
3702-29 = "진심이야? 그런 불길한 장소에 가겠다고?!"
3702-30 = "좋은 작품은 다양한 경험에서 우러나는 것."
3702-31 = "이 기회에 새로운 경험을 한다면, 우리 모두 예술의 역량을 한층 높일 수 있겠죠."
3702-32 = "끊임없는 도전. 그것이야말로—"
3702-36 = "—'혁신'."
3702-37 = "……이니까요."
3702-38 = "또 그럴싸하게 가져다 붙이는데 이젠 안 속아!"
3702-39 = "후후, 그래도 재미있을 것 같지 않나요? 모두와 함께라면 무서운 일도 없을 거예요."
3702-40 = "공포영화도…… 다 같이 보면 개그 영화가 되곤 하지……"
3702-41 = "맞아요! 다 같이 가봐요! 분명 즐거울 거라고요!"
3702-45 = "……하아아. 알았어. 갈게. 그런 장소가 진짜로 있을 리는 없을 테니까."
3702-46 = "후후, 그럼 결정이네요."
3702-49 = "자, 출발하는 겁니다! 우리 학원에 숨은 오컬트를 연구하기 위해서!"
3702-51 = "잠시 후……."
3702-53 = "어느 수상한 빌딩 1층"
3702-56 = "저기, 누구 있어?"
3702-57 = "우리 들어간다?"
3702-60 = "……."
3702-61 = "……정말 아무도 없나 보네. 불도 꺼져 있고."
3702-65 = "자. 이곳입니다. 여기가 소문의 리미널 스페이스예요."
3702-66 = "여기 어딘가에 다른 세계와 연결된 입구가 있어요!"
3702-67 = "흐음, 아무리 봐도 평범한 빌딩 안인데? 창밖이 안 보이는 것만 빼면……"
3702-70 = "……응? 잠깐. 창밖이 안 보인다고?"
3702-71 = "밖이 안 보이게 창문이 전부 코팅되어 있네요."
3702-72 = "후후, 시작부터 흥미로운데요?"
3702-73 = "여, 여긴 대체 뭐 하는 건물인데 1층부터 밖이 안 보이게 한 거야?"
3702-74 = "나도 정확한 건…… 몰라."
3702-75 = "무언가 <특별한 목적>을 위해 만든 장소라는 것밖에……."
3702-76 = "트, 특별한 목적……?"
3702-77 = "오오, 역시 다른 세계와 연결된 장소가 분명해요! 그럼 탐험을 시작하죠!"
3702-88 = "모두가 빌딩의 1층을 살폈다."
3702-89 = "그리고 잠시 후……."
3702-91 = "이곳, 생각보다 꽤 흥미로운 구조를 하고 있네요."
3702-92 = "안에서 밖을 확인할 방법은 없고, 계단도 공사 중인지 전부 막혀 있어요."
3702-93 = "확실히 이곳은 정상의 경계가 허물어진, 외부와 단절된 폐쇄 공간."
3702-94 = "리미널 스페이스라는 소문이 있을 만하네요."
3702-95 = "그 와중에 엘리베이터는 정상 작동하는 것 같아요."
3702-100 = "보세요. 제대로 움직이잖아요?"
3702-101 = "어떡할까……? 올라가 볼까……?"
3702-102 = "으, 으으음……."
3702-103 = "돌아갈래……?"
3702-104 = "아, 아니야. 여기서 돌아가면 리미널 스페이스가 실존한다고 인정하는 꼴이잖아."
3702-105 = "직접 확인해 주겠어. 이 세상에 오컬트 같은 건 없다고 말이야!"
3702-106 = "히히, 그럼 올라가자고……."
3702-108 = "으음, 8층까지 올라갈 수 있군요."
3702-109 = "먼저 7층부터 가자. 7은 행운의 숫자니까."
3702-110 = "후후, 그런 미신은 안 믿는 거 아니었나요?"
3702-111 = "이 정도는 다들 믿잖아! 일단 가자고!"
3702-118 = "수상한 빌딩 4층"
3702-121 = "……어? 뭐야? 왜 4층에서 멈춰? 난 7층을 눌렀는데?"
3702-128 = "이젠 꼼짝도 안 하잖아?!"
3702-131 = "여기 계속 있을 순 없으니 일단 내리죠."
3702-132 = "뭐가 있을지 기대되네요. 뉴후후……."
3702-133 = "으으, 뭔가 불길한데……."
3702-134 = "걱정 마세요. 우리가 지켜드릴 테니까요."
3702-140 = "수상한 빌딩 4층 복도"
3702-141 = "오호, 깔끔한 복도로군요."
3702-142 = "여기의 문들은 어디로 연결된 걸까요?"
3702-143 = "쓰, 쓸데없이 건드리지 마! 이상한 게 튀어나오면 어쩌려고!"
3702-144 = "응? 잠시만요. 이쪽에 쪽지가 붙어 있어요."
3702-145 = "내가 읽어볼게……."
3702-148 = "호기심이 고양이를 죽인다는 말을 아시나요?"
3702-150 = "여러분은 들어와서는 안 되는 장소에 발을 들이고 말았습니다."
3702-151 = "이곳은 현실의 이면. 미궁과도 같은 경계의 공간."
3702-152 = "탈출을 원하신다면 주변에서 이상 현상을 조사해 주세요."
3702-154 = "이상 현상 발견 시, 엘리베이터를 타고 현재 층에서 바로 위층으로."
3702-155 = "이상 현상이 없을 시엔 현재 층에서 바로 아래층으로 내려가시면 됩니다."
3702-156 = "무사히 1층에 도착하고 싶으시면 이 규칙을 반드시 지켜주세요."
3702-157 = "규칙을 어긴다면, 여러분은 최상층인 8층에 도착하게 될 겁니다."
3702-158 = "그곳에서…… 뫼비우스의 띠처럼 영원히 방황을 하는 거예요."
3702-159 = "후후, 후후후후……."
3702-164 = "……라고 하네."
3702-167 = "……."
3702-168 = "뭐, 뭐야……?"
3702-169 = "으으으으으……."
3702-170 = "누가 대체 이런 장난을 치는 거야!!"
