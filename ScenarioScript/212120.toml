212120-356 = "[ns] \"Hina?!\""
212120-357 = "As I previously mentioned, we have no need for discord in our united Gehenna."
212120-358 = "Now, we all must coordinate, united under one gestalt heart and mind."
212120-359 = "While I still question why some students are acting against our will..."
212120-360 = "I'm sure the dissent will resolve once we remove the central figure inspiring such rebellion."
212120-361 = "...And I've been told that person is you, Sensei."
