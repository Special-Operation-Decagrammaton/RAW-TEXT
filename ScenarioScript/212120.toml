[translation]
212120-1 = "第12話;応援してくれる、先生？"
212120-4 = "……終わった。"
212120-5 = "だよねぇ……。"
212120-6 = "[s] \"……。\""
212120-8 = "放送室の警備があそこまで厳重だなんて……。"
212120-16 = "建物への立ち入りは禁止です。"
212120-17 = "え？あ、取材したいことがあって来たんですけど――"
212120-18 = "ダメです。"
212120-19 = "えっと……私、週刊万魔殿の記者で……それでもダメですか？"
212120-20 = "はい。誰だろうと立ち入りはできません。"
212120-21 = "どうしよう……。"
212120-25 = "建物の前もだけど、ちらっと見た感じ中も警備がびっしりだったよ。"
212120-26 = "めちゃくちゃ警戒されてるじゃん……。"
212120-27 = "……もう強行突破しかなくない？"
212120-29 = "単純に頭数が足りないし、突破できたとしてもその先がない。"
212120-30 = "サツキ先輩が入れたとしても、すぐに手掛かりを見つけられる保証はありません。"
212120-31 = "その間に別の戦力が……特に風紀委員長が増援に来たら終わりです。"
212120-32 = "……。"
212120-38 = "見方を変えれば、私たちの仮説が正しい証拠とも言えるわね。"
212120-39 = "どうして？"
212120-40 = "警備にあれだけの人数を割いているのだもの。"
212120-41 = "そうまでして守るべきものが放送室にあるということよ。"
212120-42 = "あ、そっか。じゃあ良いことではあるのかな？"
212120-43 = "警備が固すぎて入れないことを除けばね。"
212120-48 = "……。"
212120-49 = "……何か変じゃないか？"
212120-50 = "何が？"
212120-51 = "警備って何かを守るためにするだろ？"
212120-52 = "それで放送室が守られてるってことは――"
212120-54 = "……。"
212120-55 = "その言い方だと……。"
212120-56 = "あそこに手掛かりがあることを知ってる[ruby=・]誰[/ruby][ruby=・]か[/ruby]がいる。"
212120-60 = "つまり……この状況を仕組んだやつがいるってことなんじゃ……？"
212120-61 = "……！！"
212120-62 = "それなら、これは事故なんかじゃない。"
212120-63 = "……事件を起こした犯人がいるってことね。"
212120-64 = "[s] \"……。\""
212120-65 = "状況証拠から見れば……ほぼ確実でしょうね。"
212120-66 = "……でも、誰が？"
212120-72 = "ん？他に誰か来る予定なんてあっ――"
212120-82 = "……。"
212120-84 = "ショウコ？"
212120-85 = "ショウコちゃん……！"
212120-87 = "……皆さん、こちらにいらしたんですね。"
212120-88 = "わぁ～！ショウコもこっちに来てくれたの？"
212120-89 = "[s] \"待って、マユミ……！\""
212120-94 = "動くな！"
212120-98 = "……。"
212120-99 = "……何をしに来たんだ？"
212120-100 = "チャンスを差し上げるために。"
212120-101 = "チャンス……？"
212120-102 = "何がゲヘナにとって正しいことなのか、悟るための機会を。"
212120-103 = "……。"
212120-105 = "へえ？お前の言う正しさってのは何なんだ？"
212120-109 = "ゲヘナを裏切らないことです。"
212120-115 = "秩序に則り、偉大なるゲヘナに貢献すること。"
212120-116 = "そして戦列に加わり、血と鉄をもって敵を打ち倒すこと。"
212120-117 = "以上です。"
212120-118 = "笑わせるなよ。そんなの、正しいはずがない。"
212120-119 = "いずれ歴史が証明するでしょう。"
212120-120 = "その歴史とは、力ある者によって記されるのですがね。"
212120-121 = "皆さんの活躍は見届けさせていただきますよ。"
212120-127 = "ショウコ……！"
212120-128 = "……本気なの？"
212120-129 = "委員長、カレン。選択の機会は十分に差し上げたつもりです。"
212120-130 = "……。"
212120-131 = "……これで、道は分かれましたね。"
212120-132 = "……。"
212120-136 = "二人とも手が焼けますね。"
212120-137 = "私がいなかったらどうするつもりだったんですか？"
212120-142 = "そしたらこんなことやってないし！"
212120-143 = "言い出しっぺはショウコじゃん！！"
212120-145 = "それもそうですね。"
212120-148 = "ショウコ……。"
212120-149 = "私たち、どうしてこんなことになっちゃったのかな……？"
212120-150 = "……ゲヘナのためです。"
212120-151 = "ゲヘナを、再興するため。"
212120-152 = "……。"
212120-153 = "違う、こんなの……全然違うよ。"
212120-155 = "感傷はここまでです。"
212120-158 = "1本、線を引きましょう。"
212120-159 = "貴女方が邪魔をすれば、ゲヘナの結束に綻びが生じます。"
212120-160 = "これは警告です。"
212120-161 = "真にゲヘナを思うのならば、分裂を煽らないでください。"
212120-162 = "貴女方の行いはゲヘナの不利益となります。"
212120-168 = "ええ。どうぞ、こちらに。"
212120-176 = "……。"
212120-177 = "[s] \"ヒナ……。\""
212120-178 = "委員長……！"
212120-179 = "……イオリ、チナツ。"
212120-180 = "……はい。"
212120-181 = "今まで何をしていたの？"
212120-182 = "そ、それは……。"
212120-183 = "知っているわよね？#n無断での離脱は、その場で処分することもできるほどの案件よ。"
212120-185 = "……。"
212120-186 = "風紀委員長、落ち着いてください。私たちはただ話を――"
212120-191 = "イロハ。万魔殿を辞めると言ったそうね。"
212120-192 = "……その通りです。"
212120-193 = "それはつまり、ゲヘナに反発するという理解でいいのかしら。"
212120-194 = "風紀委員会の中核が、反旗を翻した者と一緒にいるのだけど……#n私はこの事実をどう受け取ればいいのかな。"
212120-195 = "……。"
212120-199 = "サツキ、チアキ。あなたたちも万魔殿を辞めたの？"
212120-206 = "そうじゃないなら万魔殿へ戻って。人手が足りなくててんてこ舞いなのだから。"
212120-207 = "それからゲヘナ再興委員会。あなたたちにも聞きたいことがある。"
212120-208 = "私たちも……！？"
212120-209 = "あなたたちの書記は睡眠を削ってまで最善の計画を組んでいるわ。"
212120-210 = "叫び続けていたゲヘナが目の前にあるのに、あなたたちは何をしているの？"
212120-214 = "……それ、私たちが夢見てたゲヘナなの？"
212120-215 = "勝手気ままな放縦を捨て、ただ1つの目標に向かって進む統制された集団。"
212120-216 = "それを求めていたのでしょう？"
212120-220 = "やはっ、それはちょっと違うっしょ。"
212120-221 = "何が違うの？"
212120-222 = "それは狂気って言うんだよ、先輩。"
212120-223 = "同じゲヘナとして、最後の言葉と受け取っていいのかしら。"
212120-228 = "間違わないように、はっきり言ってくれる？もう一度。"
212120-229 = "やはっ……圧すっご……！"
212120-230 = "こ、これが風紀委員長の……本気……。"
212120-235 = "[ns] \"ヒナ……！\""
212120-239 = "ふぅ……。"
212120-241 = "くっ……。"
212120-242 = "はぁ、はぁ……。"
212120-247 = "改めて明言しておく。"
212120-248 = "空虚な「自由」にかまけて怠惰を放置していたゲヘナは終わった。"
212120-249 = "全員、持ち場に戻って。"
212120-250 = "今後、また不穏な動きを見せるなら――"
212120-254 = "相応の覚悟をすることね。"
212120-255 = "[s] \"……。\""
212120-256 = "……先生。"
212120-257 = "どうしてここにいたのかは聞かない。"
212120-258 = "その代わり、少し時間を貰えるかしら。"
212120-259 = "[s] \"……分かった。\""
212120-260 = "……うん。じゃあ、ついて来て。"
212120-264 = "（ヒナに連れられて別の場所へ向かった）"
212120-268 = "（残してきたみんなには、心配しないように伝えたけど……）"
212120-269 = "（どう転ぶかは予想もつかなかった）"
212120-273 = "先生……。"
212120-274 = "[s] \"聞かせて。\""
212120-275 = "……大丈夫？"
212120-276 = "[s] \"どういう意味……？\""
212120-277 = "だって、最近ずっとゲヘナにいるでしょ？"
212120-278 = "先生も気にかけてくれてるんだよね。"
212120-279 = "私たちにとって、とても大事な局面だから……。"
212120-280 = "[s] \"……。\""
212120-281 = "ねぇ、先生。"
212120-282 = "ゲヘナが本格的にキヴォトスへの攻撃を始めたら、先生はどうするの？"
212120-283 = "[s] \"私は……。\""
212120-284 = "その時も、前みたいに言ってくれる？"
212120-288 = "頑張ってくれてありがとう。#n力を尽くしてくれてありがとう。"
212120-289 = "これからもずっと、応援するよ。"
212120-290 = "――って。"
212120-291 = "[s] \"…………。\""
212120-292 = "……そっか。"
212120-293 = "先生は……間違いだと思ってるんだね。"
212120-294 = "でも、私は……。"
212120-295 = "私は、自分の心がおかしいとは思わない。"
212120-296 = "こんなに頭が冴えてたことも、行動に確信を持てることも、今までなかった。"
212120-301 = "気づいたんだ。これが私の存在理由。"
212120-302 = "私の力も、私の決断も、私の立場も。"
212120-303 = "その全部は、キヴォトスをゲヘナが統べるためにある。"
212120-304 = "[s] \"ヒナ……。\""
212120-307 = "……どうしてだろうね。"
212120-308 = "ふと、昔のことを思い出すんだ。"
212120-309 = "どうしてあの時、私は……。"
212120-310 = "どうして、雷帝に抗いながら――"
212120-311 = "自由、の、ため、に……？"
212120-317 = "くっ！ぐううっ……！"
212120-318 = "[s] \"ヒナ……！\""
212120-323 = "うああああ……！！"
212120-335 = "……。"
212120-336 = "……先生。"
212120-337 = "私たちを……私を、今までみたいに応援して。"
212120-338 = "それだけで、私はもっと頑張れる。どんなに辛いことだって乗り越えられる。"
212120-339 = "[s] \"……。\""
212120-341 = "[ns] \"うん、ヒナなら乗り越えられるよ。\""
212120-343 = "[ns] \"私もヒナのために全力を尽くすね。\""
212120-344 = "……信じるね。"
212120-345 = "だから、お願い。これからは私の言う通りにして。"
212120-356 = "[ns] \"ヒナ！？\""
212120-357 = "さっきも言ったけど、一つになったゲヘナに異物はいらない。"
212120-358 = "みんながまとまらなきゃいけない時だから。"
212120-359 = "どうして逆らう生徒がいるのかは分からないけど……。"
212120-360 = "支柱が無くなれば、自然消滅するはず。"
212120-361 = "……その支柱が先生なんだって。"
212120-362 = "だからしばらくは、先生を保護させてもらうね。"
212120-368 = "こんなこと……できればやりたくない。"
212120-369 = "先生に嫌われるかもって思うと、怖い。"
212120-370 = "でも、こうしないと先生を守れないんだ。だから……私の気持ちを分かってほしい。"
212120-377 = "（怪しく輝くヒナの目を見ながら、私は何も言えなかった）"
212120-381 = "（生徒の夢を応援できないという現実が……）"
212120-382 = "（言葉にならない気持ちとして心に渦巻いていた）"
212120-384 = "次回;監禁"
