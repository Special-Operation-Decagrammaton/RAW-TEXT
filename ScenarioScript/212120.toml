212120-236 = ""
212120-238 = ""
212120-239 = "Phew..."
212120-241 = "Ugh..."
212120-242 = "*pant* *pant*"
212120-243 = ""
212120-246 = ""
212120-247 = "I will say this once more, just to be crystal clear."
212120-248 = "The Gehenna that tolerated idleness under the guise of \"freedom\" is over."
212120-249 = "You should all return to your places, to your proper roles, before we begin the operation."
212120-250 = "And if you continue to show such verboten behavior in the coming days..."
212120-251 = ""
