212120-195 = "……"
212120-196 = ""
212120-198 = ""
212120-199 = "皐月、千秋。我可沒聽說你們也決定退出萬魔殿。"
212120-200 = ""
212120-202 = ""
212120-204 = ""
212120-206 = "如果是我誤會了就說清楚。#n不是的話就回萬魔殿去。"
