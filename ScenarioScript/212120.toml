212120-295 = "...I don't think there's anything wrong with my feelings."
212120-296 = "I have never had such a clear mind or felt this confident before."
212120-297 = ""
212120-301 = "Yes. This is my reason for being."
212120-302 = "My strength, my determination, my position."
212120-303 = "It is all for Gehenna's conquest of Kivotos."
