212120-1 = "第12話;可以為我加油嗎，老師？"
212120-3 = ""
212120-4 = "……完蛋了。"
212120-5 = "就是說啊。唉……"
212120-6 = "[s] 「……」"
212120-8 = "沒想到廣播室的戒備會那麼森嚴……"
212120-13 = ""
212120-15 = ""
212120-16 = "建築物內部禁止進入。"
212120-17 = "咦？啊，我是來採訪的……"
