212120-181 = "What were you doing here, leaving your stations without approval, ignoring the chain of command?"
212120-182 = "W-Well..."
212120-183 = "Desertion is verboten. Under current Prefect Team policies, you could even be sentenced on the spot."
212120-185 = "..."
212120-186 = "Calm down, Head Prefect. We're just here to talk..."
