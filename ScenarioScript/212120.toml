212120-254 = "You shall face due consequence."
212120-255 = "[s] \"...\""
212120-256 = "...Sensei..."
212120-257 = "I won't ask you why you were with them."
212120-258 = "Nevertheless, could you spare a moment of your time?"
212120-259 = "[s] Say yes."
212120-260 = "...Very well. Then let's have a quick chat."
212120-264 = "I followed Hina's lead."
212120-265 = ""
212120-268 = "I told the students not to worry about me..."
212120-269 = "But there was no telling what would happen next."
212120-272 = ""
212120-273 = "Sensei..."
212120-274 = "[s] \"...Go on, Hina.\""
212120-275 = "Sensei, has everything been okay lately?"
212120-276 = "[s] \"Like with what...?\""
212120-277 = "I've noticed that you've had an extended stay in Gehenna."
212120-278 = "That must mean you care dearly about our situation."
212120-279 = "And, given that this is a very meaningful moment for us..."
212120-280 = "[s] \"...\""
212120-281 = "Sensei."
