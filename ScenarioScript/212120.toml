212120-194 = "And how should I interpret the fact that my core officers are with you right now?"
212120-195 = "..."
212120-196 = ""
212120-198 = ""
212120-199 = "Satsuki and Chiaki. I never heard of you resigning from the Pandemonium Society."
212120-200 = ""
212120-202 = ""
212120-204 = ""
212120-206 = "Inform me if I am mistaken. Otherwise, return to the Pandemonium Society and aid your chairman."
212120-207 = "And the Gehenna Heritage League, there's something I wanted to ask you as well."
212120-208 = "U-Us...?!"
212120-209 = "Your secretary has been sacrificing sleep to devise the best possible plans for her glorious academy."
212120-210 = "Our Gehenna, the place you cried and fretted for, has at last come to pass. How do you like it?"
212120-211 = ""
212120-213 = ""
212120-214 = "You're asking if this is truly the Gehenna we dreamed of?"
212120-215 = "A perfect military, free of self-indulgence, advancing toward a singular goal."
212120-216 = "Is this not what you wanted to see?"
212120-217 = ""
212120-219 = ""
212120-220 = "Yaha, I think it's a little off..."
212120-221 = "How so?"
212120-222 = "You see, what you described is \"madness,\" Head Prefect."
212120-223 = "Shall I consider that as an official declaration that you will not take part in realizing a glorious Gehenna?"
212120-224 = ""
212120-226 = ""
212120-228 = "Can you say that again so I can be absolutely certain?"
212120-229 = "...Tch...! Yaha... This is a bit much...!"
212120-230 = "S-So this is what the Head Prefect's really like!"
