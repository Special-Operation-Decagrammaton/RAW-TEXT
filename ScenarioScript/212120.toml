[translation]
212120-1 = "제12화;응원해 줄 수 있어, 선생님?"
212120-4 = "……망했어."
212120-5 = "그러게. 하아……."
212120-6 = "[s] \"…….\""
212120-8 = "방송실의 경계가 그렇게 삼엄할 줄이야……."
212120-16 = "건물 안쪽으로는 출입 금지입니다."
212120-17 = "네? 아, 저 취재할 것이 있어서 왔는데요."
212120-18 = "안 됩니다."
212120-19 = "어…… 저 주간 만마전 기자인데, 그래도 안 될까요?"
212120-20 = "네. 그 누구도 출입할 수 없습니다."
212120-21 = "우, 우와……."
212120-25 = "건물 앞에도 그렇고, 슬쩍 보니까 안쪽에도 경계 병력이 쫙 깔렸더라."
212120-26 = "지금 방송실은 게헨나에서 가장 경계가 삼엄한 곳 중 하나야……."
212120-27 = "……그냥 뚫고 들어갈 수는 없을까?"
212120-29 = "쉽게 뚫릴 만한 숫자도 아니고, 만약 그런다 하더라도 뒤가 없어."
212120-30 = "사츠키 선배가 들어가서 살펴본다 해도 금방 단서를 찾으리라는 보장은 없잖아요."
212120-31 = "그사이에 다른 병력들…… 특히 선도부장이 지원을 오면 끝장이에요."
212120-32 = "……."
212120-38 = "어떻게 보면 이 상황, 우리의 가설이 맞다고 볼 수도 있어."
212120-39 = "어째서?"
212120-40 = "방송실이 중요한 곳이 아니라면 저렇게 지킬 필요도 없잖아?"
212120-41 = "그 안에 단서든 뭐든 있다는 뜻이니까."
212120-42 = "아하, 좋은 소식이구나?"
212120-43 = "흐응, 내부로 들어갈 수만 있다면 말이지."
212120-48 = "……."
212120-49 = "그런데…… 뭔가 이상하지 않아?"
212120-50 = "뭐가?"
212120-51 = "만약 방송실에 단서가 있다는 게 사실이라 경계 병력을 배치했다면……"
212120-52 = "다른 사람들이 단서를 획득하지 못하게 하려는 거잖아?"
212120-54 = "……."
212120-55 = "그 말은……"
212120-56 = "누군가는 거기에 단서가 있다는 걸 알고 있다는 소리고……"
212120-60 = "결국…… 누군가 의도해서 이 상황을 일으켰다는 거잖아……?"
212120-61 = "……!!"
212120-62 = "그러니까, 이 상황은 사고가 아니었던 거지."
212120-63 = "……이 사건을 일으킨 범인이 있다는 이야기지? 그거."
212120-64 = "[s] \"…….\""
212120-65 = "정황상…… 확실하겠네요."
212120-66 = "……대체 누가?"
212120-72 = "응? 또 누구 올 사람이 있었……"
212120-82 = "……."
212120-84 = "쇼, 쇼코?"
212120-85 = "쇼코 쨩……!"
212120-87 = "……네. 여기들 계셨군요."
212120-88 = "와~ 쇼코도 우리와 뜻을 함께 하러 온 거야?"
212120-89 = "[s] \"잠깐, 마유미……!\""
212120-94 = "거기, 물러서!"
212120-98 = "……."
212120-99 = "……여기에는 무슨 일로 온 거지?"
212120-100 = "기회를 드리러 왔습니다."
212120-101 = "기회……?"
212120-102 = "무엇이 게헨나를 위해 옳은 일인지 깨달을 기회."
212120-103 = "……."
212120-105 = "그래? 그럼 네가 생각하는 옳은 일이 뭔데?"
212120-109 = "게헨나를 배반하지 않는 것."
212120-115 = "현재의 질서에 탑승하고, 위대한 게헨나에 일조하는 것."
212120-116 = "나아가 키보토스를 상대로 한 성전에 참여해 피와 철로서 우리의 적을 단죄하는 것."
212120-117 = "이상입니다."
212120-118 = "웃기고 있네. 그딴 건 절대로 옳은 일이 될 수 없어."
212120-119 = "누가 옳은지는 역사가 판명하겠죠"
212120-120 = "그리고, 역사는 힘 있는 자의 편에서 쓰여진다는 것."
212120-121 = "지켜보겠습니다. 계속."
212120-127 = "쇼코……!"
212120-128 = "쇼코 쨩…… 진심이야?"
212120-129 = "회장, 카렌. 선택할 기회는 충분히 드렸을 텐데요."
212120-130 = "……."
212120-131 = "……우리의 길은 이렇게 갈라졌군요."
212120-132 = "……."
212120-136 = "정말, 두 분은 사고뭉치네요."
212120-137 = "제가 없었으면 어쩔 뻔했습니까?"
212120-142 = "그럼 이런 짓 안 했지!"
212120-143 = "네가 하자고 한 거잖아!!"
212120-145 = "그것도 맞네요."
212120-148 = "쇼코……."
212120-149 = "우리, 왜 이렇게 된 걸까?"
212120-150 = "……게헨나를 위해서입니다."
212120-151 = "다시금 위대해질 게헨나를 위해서."
212120-152 = "……."
212120-153 = "아냐, 이런 건…… 바라지 않았어."
212120-155 = "……감상은 여기까지."
212120-158 = "한 가지만 확실히 말해두도록 하죠."
212120-159 = "당신들이 방해를 하면 할수록 게헨나의 전력은 깎여나가고, 키보토스 정복은 점점 더 어려운 일이 될 겁니다."
212120-160 = "이건 경고입니다."
212120-161 = "진정 게헨나를 위한다면, 분열을 조장하지 마십시오."
212120-162 = "당신들이 지금 하고 있는 일은, 결코 게헨나를 위한 것이 아니니까요."
212120-168 = "네, 이쪽입니다. 들어가시죠."
212120-176 = "……."
212120-177 = "[s] \"히나…….\""
212120-178 = "부, 부장……!"
212120-179 = "……이오리, 치나츠."
212120-180 = "……네, 부장님."
212120-181 = "보고체계를 무시하고 무단으로 이탈해서 뭘 하고 있었던 거지?"
212120-182 = "그, 그건……."
212120-183 = "지금의 선도부 규율로는 즉결 심판도 가능한 일이야. 알고 있을 텐데?"
212120-185 = "……."
212120-186 = "진정하세요, 선도부장. 우리는 그저 이야기를……."
212120-191 = "이로하. 만마전을 그만두겠다고 했다며."
212120-192 = "……네. 맞아요."
212120-193 = "그 말인즉, 지금의 게헨나에 반발하겠다는 것과 다르지 않겠지."
212120-194 = "선도부의 중진들이 그런 너와 함께 있다는 사실을 내가 어떻게 받아들여야 할까?"
212120-195 = "……."
212120-199 = "사츠키, 치아키. 너희도 만마전 그만두기로 했다는 이야기는 못 들었는데."
212120-206 = "내가 오해하고 있다면 똑바로 말해주도록. 아니라면 만마전으로 돌아가고."
212120-207 = "그리고 게헨나재흥위원회, 너희에게도 묻고 싶은 게 있는데."
212120-208 = "으응……?!"
212120-209 = "지금 너희의 서기는 위대한 게헨나를 위해 잠도 줄여가며 최선의 계획을 짜내고 있지."
212120-210 = "너희가 부르짖던 게헨나가 눈앞에 있는데, 너희는 지금 뭘 하고 있는 거야?"
212120-214 = "……그거, 우리가 꿈꾸던 게헨나가 맞아?"
212120-215 = "제멋대로인 방종을 버리고, 오직 하나의 목표를 향해 나아가는 완벽한 군단."
212120-216 = "이런 모습이 보고 싶었던 거 아니었어?"
212120-220 = "야핫, 조금 다른 것 같은데."
212120-221 = "뭐가 다르지?"
212120-222 = "그건 광기라고 하는 거야, 선배."
212120-223 = "그 말, 너희는 현재의 게헨나에 동참하지 않겠다는 선언일까?"
212120-228 = "내가 확신을 가질 수 있도록, 다시 한번 똑바로 말해주겠어?"
212120-229 = "……큭……! 야핫…… 엄청난 압박감이잖아……!"
212120-230 = "이, 이게 선도부장의…… 진정한 모습……."
212120-235 = "[ns] \"히나……!\""
