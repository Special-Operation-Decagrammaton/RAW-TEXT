212120-159 = "The more you interfere, the more Gehenna's power is whittled away. We need unity for this conquest."
212120-160 = "This is a warning."
212120-161 = "If you truly care about Gehenna, stop inciting discord and division."
212120-162 = "What you are doing right here, right now, hiding in this little room, is certainly not for the sake of Gehenna."
