212120-248 = "'자유'라는 헛된 이름 아래 나태함을 방치하던 게헨나는 끝났어."
212120-249 = "모두 작전 개시 전까지 각자의 위치로 복귀하도록 해."
212120-250 = "만약 이후에도 지금과 같은 불순한 움직임을 보인다면……"
212120-254 = "그 결과는 알아서 감당하도록."
212120-255 = "[s] \"…….\""
212120-256 = "……선생님……."
212120-257 = "선생님이 왜 이들과 함께 있었는지는 묻지 않을게."
212120-258 = "그러니 시간 좀 내줄 수 있을까?"
212120-259 = "[s] 알겠다고 대답한다."
212120-260 = "……그래. 그럼 잠깐 이야기를 나누자."
212120-264 = "(그렇게 히나가 이끄는 곳으로 향했다.)"
212120-268 = "(학생들에게는 걱정하지 말라고 안심시켰지만,)"
212120-269 = "(차갑게 식은 분위기가 어떻게 될지는 예상할 수 없었다…….)"
212120-273 = "선생님……."
212120-274 = "[s] \"……말해, 히나.\""
212120-275 = "선생님, 요즘 괜찮아?"
212120-276 = "[s] \"어떤 부분……?\""
212120-277 = "그도 그럴 게, 선생님 요즘 게헨나에만 있잖아?"
212120-278 = "아마 그만큼 선생님도 신경 쓰고 있다는 거겠지?"
212120-279 = "우리에게 아주 중요한 시점이니까……."
212120-280 = "[s] \"…….\""
212120-281 = "있지, 선생님."
212120-282 = "게헨나가 본격적으로 키보토스 정복 전쟁을 시작하면, 선생님은 어떻게 할 거야?"
