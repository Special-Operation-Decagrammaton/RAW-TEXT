212120-21 = "嗚，嗚哇……"
212120-24 = ""
212120-25 = "不只建築物前面，我偷看了一下，裡面也布滿了警備兵力。"
212120-26 = "現在廣播室是格黑娜戒備最森嚴的地方之一……"
212120-27 = "不能直接硬闖進去嗎？"
212120-29 = "對方的人數多到不可能輕易突破，就算真的闖進去也沒有後路。"
212120-30 = "再加上即使皐月前輩進去調查，也不保證能馬上找到線索。"
212120-31 = "期間要是其他兵力……特別是風紀委員長趕來支援就完蛋了。"
212120-32 = "……"
212120-33 = ""
212120-35 = ""
212120-37 = ""
212120-38 = "換個角度看，這個狀況也可以說明我們的假說是正確的。"
212120-39 = "為什麼？"
212120-40 = "如果廣播室不是重要的地方，就沒必要那樣把守了吧？"
212120-41 = "這代表裡面有線索之類的東西。"
212120-42 = "啊哈，所以是好消息囉？"
212120-43 = "嗯，前提是能進得去的話。"
