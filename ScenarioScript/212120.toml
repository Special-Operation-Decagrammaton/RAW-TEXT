212120-283 = "[s] \"I...\""
212120-284 = "When that day dawns, will you still speak to me as you once had?"
212120-285 = ""
212120-287 = ""
212120-288 = "\"Thank you for working hard\"#n\"Thank you for giving your all.\""
212120-289 = "\"I'll support you, always.\""
212120-290 = "...Will you still say all those things?"
212120-291 = "[s] \"...\""
212120-292 = "...I see."
212120-293 = "So, Sensei... You think what we're trying to do is wrong."
