212120-337 = "Ah. Please continue to support us, support ME...as you always have."
212120-338 = "With you close, I can work even harder. I can overcome any hardship, no matter how painful."
212120-339 = "[s] \"...\""
212120-341 = "[ns] \"Hina, you can overcome THIS.\""
212120-343 = "[ns] \"I will also do my best for you, Hina.\""
212120-344 = "...Yes. I'm sure you mean that."
212120-345 = "Which is why I'm going to ask you to follow along and do as I say."
