212120-338 = "그것만 있다면, 나는 더 열심히 할 수 있어. 아무리 힘든 일도 이겨낼 수 있어."
212120-339 = "[s] \"…….\""
212120-341 = "[ns] \"히나는 이겨낼 수 있어.\""
212120-343 = "[ns] \"나 또한 히나를 위해 최선을 다할 거야.\""
212120-344 = "……응. 그 말은 진심일 거라 생각해."
212120-345 = "그러니, 이제부터는 내가 하자는 대로 따라줘."
212120-356 = "[ns] \"히나?!\""
212120-357 = "아까도 말했지만, 하나 된 게헨나에 불협화음은 필요하지 않아."
212120-358 = "모두가 한마음 한뜻으로 뭉쳐야 할 시기니까."
212120-359 = "어째서 일부 학생들이 우리의 뜻에 반하는 행동을 하는지는 아직도 잘 모르겠지만,"
212120-360 = "구심점이 사라진다면 자연스럽게 해결될 거야."
212120-361 = "……그 구심점이 선생님이라고 하더라."
212120-362 = "그러니 당분간은 선생님의 신변을 우리가 보호하고 있을게."
212120-368 = "……이렇게 돼서 유감이야."
212120-369 = "솔직히, 선생님에게 미움받을까 봐 두렵기도 하지만……"
212120-370 = "이렇게 해야 선생님을 보호할 수 있거든. 그러니…… 부디 내 마음을 알아줬으면 해."
212120-377 = "(기이하게 빛나는 히나의 눈을 보며, 어떤 말도 할 수 없었다.)"
212120-381 = "(학생의 꿈을 응원할 수 없다는 현실이……)"
212120-382 = "(내게 그 무엇보다 비현실적인 감각이 들게 했다.)"
212120-384 = "다음화;감금"
