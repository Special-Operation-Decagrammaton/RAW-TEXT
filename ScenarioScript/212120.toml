212120-294 = "그런데, 나는……."
212120-295 = "나는, 내 마음이 이상하다고 생각하지 않아."
212120-296 = "지금처럼 머리가 맑고, 확신이 있었던 적이 없어."
212120-301 = "그래. 나는 그러기 위해 존재했던 거야."
212120-302 = "내 힘, 내 결단, 내 위치."
