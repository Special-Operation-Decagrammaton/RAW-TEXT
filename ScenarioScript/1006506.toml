[translation]
1006506-1 = "카호 님의 진정한 영업전략"
1006506-5 = "(그리하여 카호가 이야기했던 음양부의 휴게실에 도착하게 되었다.)"
1006506-6 = "[ns] \"분명 이곳에서 보자고…….\""
1006506-10 = " 이건…… 이쪽에……"
1006506-14 = " 또 이건 이렇게 하면……."
1006506-15 = "[s] (카호의 목소리가…… 안쪽에 있나?)"
1006506-23 = "아, 선생님. 오셨군요. 어서 오세요."
1006506-24 = "[s] \"안녕. 카호. 뭐 하고 있었어?\""
1006506-28 = "네, 좋은 질문이네요!"
1006506-29 = "후후훗, 미리 말씀드렸던 것처럼 굿즈들을 장식하고 있었답니다!"
1006506-30 = "마침 이곳 음양부 부실은 보통 찾아온 손님들을 접객하기 위해 사용되는 장소인 만큼……."
1006506-35 = "이렇게 이곳에 새롭게 발주한 홍보용 굿즈를 보기 좋게 전시하면……."
1006506-36 = "네, 분명 홍보 효과도 배가 되리라 생각했기에!"
1006506-37 = "[s] \"아……. 응, 그래…… 카호답네…….\""
1006506-38 = "아, 그러니 잠시만 기다려 주세요. 선생님."
1006506-39 = "이러고 있을 게 아니라, 좀 더 완벽한 위치에…… 완벽한 각도로 굿즈를 배치해야……."
1006506-40 = "[s] \"그런 거라면 나도 도와줄게.\""
1006506-41 = "아……. 감사합니다."
1006506-48 = "그럼 염치없지만…… 도움, 감사히 받도록 하겠습니다."
1006506-50 = "(그렇게 시작된 카호와의 굿즈 정리 타임은 얼마 지나지 않아…….)"
1006506-54 = "아, 이것으로 배치 완료네요! 선생님."
1006506-57 = "[wa:550]― 선생님, [wa:1100]어떠신가요?"
1006506-60 = "― 이 무심한 듯 땡그란 눈동자에……."
1006506-62 = "― 깊이 사색하는 듯한 표정……."
1006506-65 = "― 정말이지. [wa:1200]엄청 [wa:1050]귀엽지 않나요?!"
1006506-68 = "[wa:150]― 하아, [wa:1530]하늘이 내린 조형…… [wa:2220]최고……"
1006506-70 = "― 살아있어서 다행이다……!"
1006506-73 = "[ns] \"응. 그러게. 카호가 가져온 거 전부 귀엽네.\""
1006506-74 = "[wa:100]― 네, [wa:900]정말이지"
1006506-76 = "― 모두 귀엽고 [wa:1300]소중한 아이들이랍니다."
1006506-79 = "― 사랑스러운 아이, [wa:1400]멋진 아이,"
1006506-81 = "― 쿨한 아이, [wa:1350]아름다운 아이……."
1006506-84 = "― 후훗…."
1006506-86 = "― 마치 [wa:1100]백귀야행의 학생들 같네요."
1006506-89 = "[ns] \"카호, 백귀야행의 학생들이라는 건…….\""
1006506-90 = "[wa:150]― 다들 다르기 때문에,"
1006506-92 = "― 가끔씩 [wa:700]부딪칠 때도 있지만……"
1006506-95 = "― 각자 [wa:1300]빛나는 개성을 가진"
1006506-97 = "― 소중한 학생, [wa:1150]이라는 생각이 들어서요."
1006506-100 = "[ns1] \"그래……. 물론 거기엔 카호도 포함되지만 말이야.\"\n[ns2] \"언제나 노력하고 있는 카호도 내겐 소중한 학생이야.\""
1006506-101 = "[wa:50]― 서, [wa:650]선생님……?!"
1006506-102 = "[wa:50]― 서, [wa:650]선생님……?!"
1006506-104 = "[wa:100]― 우으…… [wa:1450]갑자기 그런……"
1006506-107 = "― 가, [wa:1050]감사, 합……"
1006506-109 = "― 니다……. [wa:1450]선생님……"
1006506-112 = "(그렇게 카호와 대화를 나누며, 즐거운 시간을 함께했다.)"
