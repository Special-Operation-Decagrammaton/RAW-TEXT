32020-233 = "………………."
32020-234 = "[s] \"………………….\""
32020-235 = "……………."
32020-237 = "시, 실례했습니다?! 저, 저는 그런 것도 모르고, 아, 아우우……?! 저, 전혀 몰랐어요, 저! 그, 그런, 아니, 대체 언제부터?!"
32020-238 = "히, 히후미 쨩? 오늘은 늦어서 죄송하다고 그랬죠?! 그, 그 말인 즉, 몇 번이고 여기에 왔었다는 얘기죠……?! 그런 거죠?!"
32020-240 = "바, 방해해서 죄송해요! 조, 조금 이따가 올게요, 선생님, 아니, 오, 오늘은 오면 안 되는 거겠죠?! 제, 제가 잘 몰라서…… 누, 눈치가 없어서 죄송해요, 아우, 아우우……."
32020-241 = "잠깐 기다려요, 어딜 가는 거예요, 좀 더 자세히 알아야겠어요! 둘이서 뭘 하고 있었는지 좀 더 상세하게 설명을, 아니, 가능하면 제 눈앞에서 재현해주시겠어요?"
32020-242 = "[s] \"둘 다 조용히 해줘…… 제발…….\""
