[translation]
32020-1 = "제2화;시스터후드"
32020-2 = "아, 선생님! 오셨군요!"
32020-3 = "[s] \"볼일이 있어서 늦었어. 미안.\""
32020-4 = "네, 그것보다, 보세요! 방금 친 모두의 모의 시험 결과예요!"
32020-5 = "[s] 시험 결과를 확인한다."
32020-7 = "제2차 보충수업부 자체 모의 시험 결과"
32020-9 = "하나코 - 8점 [FF6666](낙제)[-]"
32020-11 = "아즈사 - 58점 [FF6666](낙제)[-]"
32020-13 = "코하루 - 49점 [FF6666](낙제)[-]"
32020-15 = "히후미 - 64점 [007eff](합격)[-]"
32020-17 = "음. 종이 한 장 차이였어."
32020-18 = "네! 맞아요! 아즈사 쨩, 정말로 종이 한 장 차이였어요! 엄청 아까웠어요!"
32020-19 = "흐, 흥! 봤지? 나도 꽤 올랐다구?"
32020-20 = "네! 코하루 쨩, 저번 시험은 15점이었는데, 이번엔 49점이니, 여기서 제일 성적이 많이 오른 건 코하루 쨩이에요! 굉장해요!"
32020-21 = "아하하하. 그렇다니까. 말했잖아. 진짜 힘을 숨기고 있었다고."
32020-22 = "네! 맞아요, 엄청나요!"
32020-23 = "그리고……. 아, 아우……. 하나코 쨩은……."
32020-24 = "후훗. 어머? 히후미 쨩? 왜 목소리가 줄어드는 거죠?"
32020-25 = "처음의 평가 시험에서 2점, 그다음 모의시험에서 4점, 이번엔 8점이잖아요?"
32020-29 = "2배씩 착실하게 기하급수적으로 오르고 있으니 이대로 세 번만 더 치면 저도 합격권인걸요?"
32020-30 = "아, 아우……. 그, 그렇게 보면 그런 것 같지만……."
32020-31 = "[s] \"다들 굉장하네.\""
32020-32 = "네, 다들 엄청 열심히 해줘서…… 이대로라면 생각보다 더 빨리 목표에 도달할 수 있을 거 같아요……"
32020-33 = "물론이야. 임무에 성공해서 반드시 그 귀여운 걸 받아내고야 말겠어. 그게 내가 여기 있는 이유니까."
32020-34 = "아, 아즈사 쨩?! 우리의 목표는 낙제를 면하는 거라구요? 어느새 목표가 바뀐 것 같은데요?"
32020-35 = "아아. 그런 것도 있었지. 그건 원래 겸사겸사 같이하면 되는 2차 목표였어."
32020-36 = "2차예요?! 원래 그런 거였어요?! 아, 아우…… 모모프렌즈의 팬으로서 기쁘긴 하지만……."
32020-42 = "……응?"
32020-43 = "어머? 누가 찾아왔나 본데요?"
32020-44 = "그, 그러게요……. 누가 이 별관에 볼일이 있어서……."
32020-45 = "저, 저기…… 실례합니다!"
32020-46 = "어머…… 이 목소리는……."
32020-47 = "침입자인가. 그럴 줄 알고 준비해두었지."
32020-48 = "네? 아즈사 쨩, 뭘 준비……."
32020-52 = "꺄, 꺄악?!!"
32020-53 = "부비트랩. 함부로 침입했다간 기폭 하게 되어 있지."
32020-54 = "아, 아즈사 쨔아아앙?!"
32020-55 = "이, 이건 대체……. 아, 앗?! 여기도?!"
32020-61 = "꺄아아아앗?!"
32020-62 = "도망치려고 하면 다음 트랩이 터지게 세팅도 해놨어."
32020-63 = "아즈사 쨔아아아앙!!!??"
32020-65 = "별관 입구"
32020-66 = "콜록, 콜록콜록……."
32020-67 = "괘, 괜찮으세요?! 다, 다치신 데는 없으신……."
32020-68 = "오늘도 평화와 안녕이 콜록, 콜록 ……그대와 함께하기를. 콜록."
32020-69 = "전혀 평화와 안녕과 관계없는 상황 같지만……?! 아우우?!"
32020-70 = "이 복장은…… 시스터후드의……?"
32020-71 = "어머, 마리 쨩?"
32020-72 = "하, 하나코 씨……."
32020-74 = "자, 받아. 물이야."
32020-75 = "감사합니다……."
32020-79 = "(꿀꺽꿀꺽)"
32020-80 = "……하아. 깜짝 놀랐어요……. 방금 그건 대체……."
32020-84 = "아즈사 쨔앙……."
32020-95 = "음……"
32020-96 = "미안하다. 적의 습격인 줄 알았어."
32020-97 = "……저, 적이요?"
32020-98 = "그, 그건 그렇고 시스터후드가 여긴 어쩐 일로……."
32020-99 = "아…… 그게……."
32020-100 = "보충수업부의 이야기는 저도 들었어요……. 그치만 하나코 씨가 여기 계신 줄은……."
32020-102 = "……. 으응. 저도 낙제생이라서요."
32020-103 = "그렇…… 네요. 네……."
32020-104 = "하나코, 시스터들과 아는 사이였어?"
32020-105 = "아하하…… 조금 인연이 있어서……"
32020-106 = "마리 쨩, 절 찾아온 건…… 아닌 것 같고. 어째서 여기에……?"
32020-107 = "아, 그, 그게……."
32020-108 = "시라스 아즈사 씨를 찾아왔어요. 여기 계신다고 해서……."
32020-109 = "나를?"
32020-110 = "네, 그게…… 며칠 전 아즈사 씨가 구해주었던 학생분께서 감사 인사를 드리고 싶다고 해서……."
32020-111 = "구해준……?"
32020-112 = "감사인사……?"
32020-113 = "……네. 급우들에게 괴롭힘을 당하는 학생분이 계셨는데, 그날도 구석진 건물 뒤편에 불려 나가서 괴롭힘을 당하고 있었나 봐요."
32020-115 = "괴, 괴롭힘요……?!"
32020-116 = "뭐어?!"
32020-117 = "……흔히 있는 일이긴 하죠. 다들 교활하게 음습하게 해서 잘 안 드러나지만."
32020-121 = "저희도 학생분과 상담을 통해 알게 된 거라……."
32020-122 = "그때 우연히 지나가던 아즈사 씨가…… 그 학생분을 구해주셨다고 들었어요."
32020-123 = "그, 그랬어?"
32020-124 = "……그런 일도 있었지. 여럿이서 약한 사람을 괴롭히는 게 거슬렸을 뿐이야."
32020-125 = "그치만 아즈사 씨에게 혼난 분이 정의실현부에 신고를 해서, 그 뒤로 정의실현부와 아즈사 씨의 전투로 커져버렸다고 들었어요……."
32020-126 = "?!"
32020-127 = "그때 아즈사 씨가 최루탄 창고를 점거하고 거기서 정의실현부 부원들을 부비트랩으로 3시간 넘게 괴롭혔다고……."
32020-128 = "그게 그거였어?!"
32020-130 = "흥. 걸어오는 싸움은 피하지 않아. 그때도 탄약만 떨어지지 않았어도 길동무로 세 명은 더 보낼 수 있었어."
32020-131 = "아, 아우……."
32020-132 = "나중에 그분이 아즈사 씨에게 감사의 인사를 하고 싶다고 상담해주셨는데, 학원에서 찾을 수가 없어서…… 제가 이렇게 찾아온 거였어요."
32020-133 = "그런가……."
32020-134 = "딱히 감사를 받을 일은 아니야. 내 무력함 때문에 결국 나도 체포되었으니까."
32020-135 = "그게 중요한 부분이 아닌 것 같지만……."
32020-136 = "하지만 언제나 그렇게 괴롭힘당하고 있기만 하면 안 돼. 모든 것은 헛되더라도 저항을 멈춰서는 안 되니까."
32020-137 = "……좋은 말씀이네요. 네, 그렇게 그분께도 전해두겠습니다."
32020-138 = "……."
32020-139 = "……아즈사 씨는 폭력만을 신봉하는 얼음마녀라는 소문이 있었는데, 역시 소문은 소문일 뿐이네요."
32020-143 = "우후후, 그치만 아즈사 쨩, 얼음마녀같은 부분도 있다구요? 그렇죠? 이 무뚝뚝한 표정이라거나……."
32020-148 = "하나코 씨……."
32020-149 = "응, 마리 쨩, 건강해보이니 좋네요."
32020-150 = "네……. 그건……. 저는……."
32020-151 = "그럼 제가 현관까지 배웅해드릴게요. 자아, 같이 가요."
32020-152 = "……아, 네."
32020-153 = "그, 그럼 실례했습니다. 선생님. 갑자기 찾아와서 죄송했어요."
32020-154 = "[s] \"조심해서 돌아가.\""
32020-160 = "(그렇게 하루의 일과가 마무리되었다.)"
32020-162 = "자아, 여러분. 오늘은 빨래를 하는 날이에요~"
32020-163 = "모두 교복이랑 속옷과 양말, 빨아야 하는 것들을 이 바구니에 다 담아주세요."
32020-164 = "음. 고마워, 부탁할게."
32020-165 = "네?! 소, 속옷까지요?!"
32020-166 = "뭐 하는 거야?! 속옷은 각자 빨면 되잖아!"
32020-167 = "빨래는 모아서 한꺼번에 하는 게 물과 비누를 아끼는 방법이지. 자, 다들 하나코의 지시에 따라."
32020-168 = "아, 아우우……. 그럼 부탁드립니다."
32020-169 = "끄, 끄응……."
32020-174 = "우후후♡ 고마워요."
32020-175 = "아, 선생님도 괜찮으시면……?"
32020-176 = "[s] \"고맙지만 사양할게.\""
32020-177 = "……응, 그런가요? 그럼 전 세탁실로 가서 빨래를 돌려놓을게요."
32020-178 = "밖에 널어두면 내일 아침에는 깔끔하게 입을 수 있을 거예요."
32020-183 = "그럼 나도 슬슬 잘 준비를 하겠어. 오늘도 수고하셨습니다."
32020-184 = "……수고하셨습니다."
32020-191 = "(소근소근) ……선생님. 오늘도 잠깐 얘기를……. 저기, 하나코 쨩에 대해서……."
32020-192 = "[s] 고개를 끄덕인다."
32020-195 = "선생님의 개인실"
32020-197 = "선생님…… 계신가요?"
32020-198 = "[ns1] (히후미가 왔다.)\n[ns2] 문을 연다."
32020-202 = "네. 선생님 저예요."
32020-206 = "[ns] \"………?!?!\""
32020-207 = "어머나♡ 이렇게 순순히 열어주실 줄은 몰랐는데. 무방비하셔라♡"
32020-208 = "[s3] \"어째서 하나코가……?!\"\n[s4] \"어째서 수영복이……?!\""
32020-211 = "아아, 복장은 신경쓰진 마세요. 이건 제 잠옷이거든요."
32020-212 = "[s] \"신경 쓰이는데요. 잠옷이 아니라 수영복인데요.\""
32020-213 = "우후후, 그건 중요하지 않고, 다름이 아니라 상담하고 싶은 게 있는데……."
32020-214 = "……그건, 바로……."
32020-219 = "……아즈사 쨩에 대해서예요."
32020-220 = "[s] \"아즈사……?\""
32020-224 = "선생님, 계신가요……? 저예요."
32020-228 = "기다리셨죠? 오늘은 늦어서 죄송해요…… 아우……."
