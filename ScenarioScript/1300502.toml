[translation]
1300502-1 = "불심검문"
1300502-2 = "키보토스 거리"
1300502-6 = "어두운 골목길 앞, 카요코가 경찰에게 붙잡혀 대화를 나누고 있다."
1300502-7 = "그러니까, 나는 아무 짓도 하지 않았다니까."
1300502-8 = "거짓말 마! 그렇게 수상해 보이는 차림새를 하고서는……."
1300502-9 = "아무런 이유도 없이 이런 우범지역을 어슬렁거릴 이유가 또 있어?"
1300502-10 = "그건 그러니까……."
1300502-11 = "……그러니까?"
1300502-12 = "……아무것도 아니야."
1300502-13 = "흥, 거 보라지. 수상한 꿍꿍이가 있는 게 분명하잖아!"
1300502-14 = "우선 학생증을 이리 줘. 신분을 확인해야겠다."
1300502-15 = "(게헨나 소속인게 들켜버리면 선도부 녀석들에게 또 잔소리를 들을 텐데……)"
1300502-16 = "(귀찮은 일에 휘말려버렸네…….)"
1300502-20 = "[ns] \"저희 학생에게 무슨 문제라도 있습니까?\""
1300502-21 = "응? 그쪽은 누구시지요?"
1300502-22 = "[s] \"저는 샬레의 선생입니다.\""
1300502-23 = "……선생?"
1300502-24 = "선생이 어째서 이곳에……."
1300502-26 = "이후, 경찰에게 카요코에 대해 변호해주었다."
1300502-29 = "흐음…… 샬레의 선생님께서 그렇게 말씀하신다면 어쩔 수 없지요."
1300502-34 = "……어째서 도와준 거야?"
1300502-35 = "곤란해 보였다고? 물론 곤란한 상황이긴 했지만……."
1300502-36 = "수상한 사람으로 오인받는 것에는 익숙하니까. 신경 쓰지 않아도 돼."
1300502-37 = "퍽하면 불심검문에, 경찰에게 붙들리기 일쑤니……."
1300502-38 = "정말이지 귀찮다니까. 이 사나운 인상은."
1300502-39 = "그래서, 이곳에서 사실은 무얼 하고 있었냐고?"
1300502-40 = "알 필요 없잖아. 내가 여기서 무얼 하고 있든."
1300502-41 = "…………."
1300502-42 = "(한숨) ……길고양이에게 먹이를 주고 있었어. #n경찰이 오자마자 도망가 버리긴 했지만."
1300502-43 = "어째서 처음부터 솔직하게 말하지 않았냐고?"
1300502-44 = "그야, 솔직하게 말해도 믿어주지 않았을 테니까."
1300502-45 = "어울리지 않는 일이라는 건 스스로도 잘 알고 있어."
1300502-46 = "이런 사나운 표정으로 고양이를 보살핀다니, 남이 보기엔 우스울 뿐이지."
1300502-48 = "……우습지 않다고? #n어, 음…… 고마워……."
1300502-49 = "여하튼 본의는 아니라지만 오늘은 빚을 졌네."
1300502-50 = "그 빚, 다음에 꼭 갚을게."
1300502-52 = "이후, 흥신소 사무실까지 카요코를 바래다주었다."
