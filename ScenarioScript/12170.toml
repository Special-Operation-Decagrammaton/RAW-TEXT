[translation]
12170-1 = "제17화;지키고 싶은 것"
12170-2 = "게헨나 학원 정문"
12170-3 = "뭐? 선도부장을 만나고 싶다고? 게헨나의 선도부장을 그렇게 쉽게 만날 수 있을 것 같아?"
12170-4 = "뭐, 혹시 모르지. 도게자해서 내 발이라도 핥으면……"
12170-8 = "히꺄악?!!"
12170-9 = "아니, 말도 안끝났거든…… 당신……"
12170-10 = "인간으로서 가져야 할 망설임 같은 건 없는 거야?!"
12170-11 = "[s1] \"그런 건 없다.\"\n[s2] \"있었는데 없었습니다.\""
12170-12 = "뭐야! 이 선생! 뭔가 이상해! 뒤틀렸어!"
12170-13 = "뭐야! 이 선생! 뭔가 이상해! 뒤틀렸어!"
12170-14 = "이런 변태 어른은 당장……!"
12170-15 = "뭐가 그리 우습지?"
12170-16 = "부, 부장……?"
12170-17 = "자신을 위해 무릎을 꿇고 비는 자는 많이 봐 왔어. 하지만 학생을 위해 무릎을 꿇는 선생은 생전 처음 보는군."
12170-18 = "고개를 들어줘, 선생."
12170-19 = "말해줘. 내가 뭘 하면 되지?"
12170-20 = "아니, 부장…… 무릎을 꿇은 게 아니라 발을……."
12170-21 = "……."
12170-24 = "?!"
12170-26 = "……."
12170-27 = "히후미 씨의 설명은 잘 들었어요."
12170-28 = "그 선생님의 말이 진짜라면 그냥 흘려넘길 수 없는 일은 맞는 것 같지만……."
12170-29 = "지금 저희는 조약을 앞두고 있는 상태라 함부로 움직이면 안되는 상황……."
12170-30 = "하지만 PMC라는 기업의 존재가 우리 학생들에게도 좋지 않은 영향을 끼칠 것은 분명해 보이네요."
12170-31 = "이번만은 조금의 예외를 고려해두는 것도 좋을 듯하네요."
12170-32 = "가, 감사합니다. 나기사 님……."
12170-33 = "음, 마침 견인포반이 야외 수업이 예정되어 있었죠? 모처럼이니 좀 멀리까지 나가보는 건 어떨까 싶네요."
12170-34 = "소풍대신요. 날씨도 좋으니까."
12170-35 = "아, 아우…… 견인포라면……  L118 반……?"
12170-36 = "우등생 히후미 씨의 부탁이라면 그 정도는 해드려야겠죠?"
12170-37 = "사랑은 돌고 도는 것이니. 히후미 씨도 저에게 줄 것이 생길 거 같고요. 후후."
12170-38 = "아, 아우우……."
12170-40 = "그리고…… 지금은 그 <샬레>의 선생님에게 빚을 지워두는 것이 절대적으로 필요하니까요……."
12170-43 = "(뚝딱뚝딱-)"
12170-44 = "음-. 대충 완성인가."
12170-45 = "우와- 꽤 멋지잖아? 이 포장마차?"
12170-46 = "아아. 원래 시바세키 라멘집은 포장마차로 시작했었지."
12170-47 = "제, 제가…… 제가 부숴버려서…… 주, 죽을까요? 죽겠습니다!"
12170-48 = "그치만- 그만둔다고 들었는데 다시 가게를 열어서 다행이야~ 주인장."
12170-49 = "흠. 누가 가게 앞에 돈을 버리고 갔거든."
12170-50 = "……."
12170-51 = "이대로 은퇴해서 쉬려고 했는데 다시 영업해 달라니, 민폐도 이만저만이 아니잖아."
12170-52 = "……."
12170-55 = "자, 시바세키 라멘 580엔짜리 4그릇."
12170-56 = "음…… 또 양 잘못주지 않았나?"
12170-57 = "아하하하~ 뭐 어때."
12170-58 = "잘 먹겠습니다!"
12170-60 = "하아- 맛있었어. 자아, 그럼 가볼까?"
12170-61 = "그런데 사장…… 정말로 가는 거야?"
12170-62 = "이 싸움, 우리에게 아무런 이득이 없어. 대가도 없이 PMC와 싸운다니……."
12170-63 = "……흥."
12170-64 = "이야~ 카요코 쨩. 아직 깨닫지 못한 거야?"
12170-65 = "응?"
12170-66 = "아루 쨩의 얼굴을 보면 알 수 있잖아. '의뢰비는 이 라멘 한 그릇으로 충분해.' 라는 대사를 할 것만 같은 얼굴이잖아!!"
12170-67 = "……."
12170-68 = "……."
12170-69 = "과, 과연 이해했어요! 아루 님! 라멘 한 그릇을 지키기 위해 지옥으로 걸어들어가는 것! 그것이 바로 하드보일드!"
12170-70 = "저, 저도 진정한 무법자로 거듭나기 위해 최선을 다하겠습니다! 다 없애 버리겠어요!"
12170-71 = "……흥. 뭐, 그럼 됐어."
12170-72 = "자, 모두 나를 따라 지옥의 바닥까지 갈 각오는 되었겠지?"
12170-73 = "헤에……"
12170-78 = "(무, 무슨 소릴 하는 거야, 나!)"
12170-79 = "(원래 라멘만 먹고 돌아가려고 한 거였잖아……!)"
12170-80 = "(흥에 취해서 엄청난 말을 뱉어버렸고, 그 기세를 멈추지 못해서 여기까지 와 버렸다고……!!?)"
12170-81 = "(지금이라도 도망칠까? 아, 아으으…… 그, 그치만…….)"
12170-82 = "(아비도스 녀석들에게 정신을 차리게 해줘서 고맙다느니, 다시 봤다느니, 그런 말들을 잔뜩 들어버렸고…….)"
12170-83 = "(어, 어떡하지?! 마켓 가드도 아닌 PMC와 싸움이라니…… 망할 게 뻔하잖아!)"
12170-84 = "(어, 어떡해?! 어떡하지?!)"
12170-86 = "자아~ 그럼 가자! 아루 쨩!"
12170-87 = "지, 지옥까지 따르겠습니다!!"
12170-88 = "……하아. 이래저래 손해보는 짓만……."
12170-90 = "음. 준비 완료."
12170-91 = "응응! 보급도 충분하고, 간식도 잔뜩 챙겼어요."
12170-92 = "그래, 준비 만전이야! 잠도 충분히 잤고, 밥도 배부르게 먹었고!"
12170-93 = "네. 저도 아비도스 사막의 옛 지도들을 다 수집해서 최신화시켜두었어요."
12170-94 = "선생님이 알려주신 정보로는 호시노 선배는 카이저 PMC의 51지구 한가운데 있습니다."
12170-95 = "거기까지 도달하는 가장 안전한 루트로, 오퍼레이트합니다!"
12170-96 = "[s] \"출발하자!\""
12170-97 = "네!"
12170-98 = "그럼, 호시노 선배 구출 작전, 시작합니다!!"
12170-100 = "……. 그래."
12170-101 = "부서진 건 다시 지으면 돼."
12170-102 = "중요한 건 라멘을 먹으러 와주는 사람들이니까."
12170-103 = "손님이 있는 이상 라멘집은 사라지지 않아. 말은 잘 못하겠지만, 그런 거라고 생각한다."
12170-108 = "그러니까, 가라! 아비도스 대책위원회!!"
