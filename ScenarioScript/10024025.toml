[translation]
10024025-3 = "이, 이럴 수가……!"
10024025-5 = "이거, 재미있게 됐군. 키사키 녀석의 성격상 이런 일을 지시하지는 않았을 거고."
10024025-7 = "무, 문주님에 대해 뭘 안다는 거냐!"
10024025-8 = "확실히, 사람 속이란 모를 물건이지."
10024025-9 = "상품처럼 정해진 가격이 쓰여 있는 것도 아니고, 흔들어서 안을 확인할 수도 없어."
10024025-10 = "그렇다고는 해도 내가 아마 여기 있는 사람 중에서는 가장 문주에 대해 잘 알고 있을 거라고 생각하는데?"
10024025-11 = "무엄하다!"
10024025-12 = "무엄한 것은 그쪽입니다."
10024025-14 = "독단으로 이만한 일을 벌인 이상, 저희가 현룡문에 정식으로 항의해도 할 말이 없겠지요."
10024025-16 = "누가 죄인들의 말에 진지하게 귀를 기울이겠냐!"
10024025-17 = "두고 보라고! 이번 일은 반드시 갚아 줄 테니까!"
10024025-23 = "빨리도 사라지네……"
10024025-24 = "[s] \"뒤쫓지 않아도 괜찮을까?\""
10024025-25 = "여기는 아직 현룡문의 구역이야. 행동을 조심해야 하는 것은 우리 쪽이지."
10024025-26 = "동료를 더 불러오지 않으면 좋겠지만…… 아니, 그렇게 되면 키사키의 귀에도 소식이 들어갈 테니, 거기까지는 하지 않겠군."
10024025-27 = "[s] \"이제 어떻게 하지?\""
10024025-28 = "우선은 만년삼에 대한 정보가 필요하다는 말을 했었지?"
10024025-29 = "현룡문에 정식으로 항의하는 게 아니냐고? 음…… 그건 나중의 빚 같은 걸로 남겨 두기로 하지."
10024025-30 = "일단 우리에게 씌워진 혐의를 푸는 게 먼저라고 생각해."
10024025-32 = "아무튼, 그렇다면 갈 곳은 한 군데밖에 없지."
