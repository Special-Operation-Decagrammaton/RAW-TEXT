[translation]
10036035-13 = "다음."
10036035-14 = "축제를 망치려는 녀석은 용서하지 않아."
10036035-16 = "치, 치잇! 어디서 나타난 녀석들이길래 연계가 이렇게 완벽한 거야……!"
10036035-17 = "우리들만으로는 안 될 것 같은데, 포기하고 튀는 게?"
10036035-18 = "DJ를 데려가야 하는데……!"
10036035-20 = "그렇게 하도록 놔둘 것 같아?"
10036035-22 = "망할……! 일단 후퇴다!"
10036035-26 = "같이 가!"
10036035-31 = "……휴, 일단 물리쳤나."
10036035-36 = "네, 완전히 퇴각하는 걸 확인했어요……."
10036035-37 = "[s] \"어째서 불량배가……?\""
10036035-38 = "이유는 알 수 없지만, 일단은 실패를 인정하고 퇴각한 것 같아."
10036035-44 = "무엇보다, 이 녀석을 데려가지 못했다는 게 중요하지."
10036035-45 = "읍읍읍!"
10036035-46 = "미안해, DJ B.o.B씨. 오래 기다렸지?"
10036035-50 = "푸하!"
10036035-51 = "그럼 이제 하던 얘기를 마저 해야지."
10036035-52 = "그, 그 전에 잠깐…… 어째서 날 도와준 거지?"
10036035-53 = "내게 해를 끼치려던 게 아니었나?"
10036035-54 = "해를 끼칠 생각은 없었어. 살짝 때리긴 했지만……."
10036035-55 = "단지, 우리는 당신이 공연 준비를 하면서 보인 행동이 마음에 들지 않았을 뿐이야."
10036035-56 = "고압적이고, 자기만 알고. 그리고 알바생 좀 그만 괴롭혀."
10036035-62 = "마, 맞아요…… 삼류 악당 같은 짓은 그만둬 주세요……."
10036035-63 = "일을 시키는 건 괜찮아. 하지만 부당한 요구나 폭언은 안 돼."
10036035-64 = "그런가……."
10036035-65 = "알겠어."
10036035-66 = "크흠, 아무래도 내가 간만에 여름 해변에 와서 조금 오버했던 것 같군."
10036035-67 = "[s] \"의외로 순순히 받아들였네……?\""
10036035-68 = "뭐어, 위기를 겪고 나니 내가 DJ를 했던 이유를 다시 상기해 보았달까……."
10036035-69 = "하루 36시간 디제잉은…… 싫어…… 으으으……."
10036035-70 = "응, 좋아. 그럼 가도 좋아."
10036035-71 = "아츠코? 정말 그걸로 괜찮겠어?"
10036035-72 = "본인이 저렇게까지 말한다면, 믿을까 해."
10036035-73 = "우린 싸우러 온 게 아니라, 삿 짱을 위해 온 거잖아?"
10036035-74 = "……아츠코가 그렇게 말한다면야."
10036035-75 = "그, 그래. 도와줘서 고마웠다……!"
10036035-80 = "생각과는 조금 달랐지만 일단 해결이려나."
10036035-81 = "저렇게 말할 정도니 분명 약속을 지킬 거야."
10036035-84 = "헉, 헉……."
10036035-85 = "다음은…… 턴테이블 배치인가."
10036035-89 = " 알바! 아니, 알바 양!"
10036035-90 = "아, 돌아왔군. 지시했던 기자재들은 모두 제자리에 옮겨두었고, 무대 장식 위치도 변경했다. 물론 최대한 조심해서 다뤘고—"
10036035-91 = "좋아, 좋아. 어련히 알아서 잘했겠지."
10036035-92 = "그 정도 했으면 됐어. 슬슬 쉬어도 괜찮아."
10036035-93 = "으, 으음, 그게…… 고맙다만…… 조금 당황스럽군."
10036035-94 = "정말 그걸로 괜찮나? 이 부분은 까다롭게 본다고 했던 것 같은데……."
10036035-95 = "무슨 일 있었나?"
10036035-96 = "그러니까…… 내 인생의 소중함을 깨달았다고나 할까……"
10036035-97 = "조금 전 내가 산책로에 들어섰는데—"
10036035-101 = "[ns] \"스톱! 거기까지!\""
10036035-102 = "헉! 당신은! 아까 같이 있던!"
10036035-103 = "[s] \"B.o.B씨, 저쪽 그늘에 가서 조금 쉬지 그래? 내가 도울 테니!\""
10036035-104 = "그, 그렇다면 잠깐 실례하겠습니다!"
10036035-108 = "서, 선생……!"
10036035-109 = "급히 뛰어왔나? 굉장히 헉헉대고 있는데……."
10036035-110 = "[s3] \"사, 사오리를 발견하고 반가워서 그만.\"\n[s4] (아슬아슬하게 세이프……!)"
10036035-113 = "조금 놀랐다. 갑자기 나타날 줄이야."
10036035-114 = "아츠코와 미사키, 히요리에게 무슨 일이라도 생긴 건가?"
10036035-115 = "[s] \"아냐, 순조롭게 축제를 즐기고 있어.\""
10036035-116 = "그런가. 그거 잘 됐군."
10036035-117 = "나도 최선을 다해 공연 무대를 준비하고 있었다."
10036035-118 = "DJ공연은 축제의 메인 이벤트니까, 기대해도 좋아."
10036035-119 = "[s] \"나도 도울게.\""
10036035-120 = "아, 아니다, 선생에게 일을 시키는 건 미안하니까……!"
10036035-124 = "앗! 그건 무겁다! 같이 들지!"
