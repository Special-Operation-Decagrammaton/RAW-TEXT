[translation]
63080-1 = "제8화;티 타임"
63080-2 = "우선 이번 모의고사 일에 대해서, 다시 한번 진심으로 감사드립니다."
63080-3 = "[s] \"나기사도 정말 고생 많았어.\""
63080-4 = "아뇨. 천만의 말씀……."
63080-5 = "아닙니다. 지금은 선생님의 말씀을 감사히 받아들이기로 하죠."
63080-6 = "아리우스 학생들이 공부할 장소와 시험을 치를 장소에 대해서는, 너무 걱정하지 마세요."
63080-7 = "명목상 트리니티의 소유로 되어 있지만, 지금은 사용되지 않는 구교사 건물들이 있습니다."
63080-8 = "그곳을 자유롭게 사용할 수 있도록 무료 대여해 드리고자 합니다."
63080-9 = "[s1] \"사용되지 않는 구교사 건물들…….\"\n[s2] \"무료 대여…….\""
63080-14 = "왜, 왜 그러시나요. 선생님? 제가 또 뭔가 잘못이라도……?"
63080-15 = "네? 마음 씀씀이의 폭이 너무 넓어서, 따라가기 조금 어려우셨다고요?"
63080-16 = "후훗. 무슨 말씀이신가 했네요. 하지만 모든 요소는 각자의 자리에서 쓸모를 다할 때, 비로소 더욱 빛을 낼 수 있는 법이니까요."
63080-17 = "네? 저희 티파티 멤버들은 모의고사를 치르지 않느냐고요?"
63080-18 = "그럴 리가요. 오히려 저희야말로 성적이 좋지 않으면, 티파티의 자격을 의심받게 됩니다."
63080-19 = "하지만 미카 씨도 세이아 씨도, 다들 우수하니까요. 큰 걱정은 하지 않습니다."
63080-20 = "네? 세이아 씨는 그렇다 쳐도, 미카 씨의 성적 말씀이신가요?"
63080-24 = "……."
63080-25 = "선생님."
63080-26 = "미카 씨의 경우는, 정말이지, 그 표현이 딱 들어맞는 경우라고 볼 수 있는 분입니다."
63080-27 = "'우리 애가 머리는 좋은데, 노력을 안 해요…….' 같은 표현 말이죠."
63080-30 = "선생님께서도 어쩌면 이미 실감하셨을지도 모릅니다만…… 미카 씨는 머리가 안 좋은 것이 아닙니다. 오히려 그 반대에 가깝죠."
63080-31 = "다만…… 그걸, 적극적으로 쓰고 싶지 않아 하는 것뿐입니다."
63080-32 = "제 추측이지만…… 아마도, 머리를 하나하나 사용하는 것은, 조금 귀찮은 일이니까요……."
63080-35 = "그러니 시험은 잘 볼 거예요…… 언제나 그랬으니까요……. 하아……."
63080-36 = "애초에 성적이 좋지 않았는데, 티파티로 선출될 수 있었을 리가 없잖아요?"
63080-37 = "[s] \"나기사가 고생이 많구나…….\""
63080-38 = "알아주셔서 감사합니다……."
63080-39 = "……."
63080-40 = "결국 그때도 지금도, 이런 일이 일어나게 된 것은…… 트리니티와 아리우스의 역사 때문이겠죠."
63080-41 = "트리니티와 아리우스의 역사는, 완전히 같으면서도 완전히 다른 해석을 갖고 있습니다."
63080-42 = "역사는 일어난 사실의 총합이지만, 그것을 기록하는 것은 사람이니까요."
63080-43 = "……."
63080-44 = "그래서, 선생님. 저는 이번 시험이 끝나게 되면……."
63080-45 = "트리니티에 기록된 역사를, 포르타 파시스에 기록된 역사와 하나하나 대조하여, 일종의 기록관이나 박물관을 세울 계획입니다."
63080-46 = "[s] \"괜찮, 을까?\""
63080-47 = "물론, 그 둘은 엄청나게 다르겠죠. 그 과정에서 갈등과 다툼도…… 일시적이지만 증가할 거고요."
63080-48 = "그렇지만 필요하다면 제삼자의 시선까지 빌려, 자문 역시 구하려고 합니다."
63080-49 = "과거를 극복하는 것은…… 그것을 흐림 없이 바라보려는 용기 있는 시선이니까요."
63080-50 = "기록의 재조사와 대조, 연구라면…… 기꺼이 도맡아 주실 분이 계시기도 하고요."
63080-55 = "하지만 저는 트리니티가 그 모든 혼란을 극복할 것이라고 믿습니다."
63080-56 = "제가 아는 트리니티는, 그렇게 약하지 않으니까요."
63080-57 = "당연히 그 과정에서 많은 정치적인 문제나 부채가 발생할 것이라고 생각합니다만……."
63080-58 = "……."
63080-59 = "그런 건, 어떻게 보면 티파티 호스트의 '전공' 분야라고 볼 수 있는 것이기도 하니까요?"
63080-60 = "[s] \"…….\""
63080-61 = "정치란, 그런 것이죠."
63080-62 = "타인으로부터 하나를 얻기 위해, 자신이 갖고 있는 하나를 내주는 과정입니다."
63080-63 = "그리고 그렇게 타협과 교환을 반복하면서도."
63080-64 = "자신이 지키려는 어떤 가치만은, 마지막까지 놓지 않는 것입니다."
63080-65 = "첫 번째의 타협과 교환은 의외로 어렵지 않습니다만, 두 번째는 사실 많은 사람들이 놓치곤 하는 부분이에요."
63080-66 = "그렇게 되면 보통은 내가 누구인지, 무엇을 추구하려고 했는지 스스로 망각하게 되곤 하죠."
63080-67 = "[s] \"나기사가 지키고 싶은 것은 뭐야?\""
63080-71 = "저는……."
63080-72 = "트리니티가, 최고의 학원이 되길 바랍니다."
63080-73 = "트리니티에 다니는 학생들이, 그 사실만으로도 그건 자랑스러운 일이라고, 자부심을 갖게 되었으면 합니다."
63080-74 = "아주 많은 시간이 지난 다음, 트리니티에서의 학창 시절을 생각해 보며."
63080-75 = "그 시간은 정말 소중하고 귀중한 시간이었다고, 기쁜 마음으로 떠올릴 수 있었으면 합니다."
63080-84 = "트리니티에서 있었던 모든 경험이, 그 학생이 보다 나은 사람이 될 수 있도록 돕는, 작지만 소중한 보물이기를 바랍니다."
63080-85 = "물론 아직 갈 길이 너무 멀지만요."
63080-86 = "그리고 하는 김에 저도 그런 거 좀 받고 싶고요."
63080-87 = "하지만 그렇게 하려면 역시……."
63080-88 = "우리를 둘러싼 모든 것들을, 보다 냉철한 시각으로 바라볼 수 있어야 하지 않을까요."
63080-89 = "이것도 모두, 선생님께서 가르쳐 주신 것이지만요."
63080-90 = "[s] \"있잖아, 나기사.\""
63080-91 = "네?"
63080-92 = "[s] \"그때는 미안했어.\""
63080-93 = "네……?"
63080-94 = "[s] \"나기사를 좀처럼 믿으려 하지 않았던 것.\""
63080-97 = "[ns] \"그리고…… 나기사에게 심한 말을 했던 것.\""
63080-99 = "[ns3] \"모두, 내 잘못이야.\"\n[ns4] \"나는 그렇게 말하면 안 되었어.\""
63080-103 = "선생, 님……?"
63080-104 = "왜, 갑자기……. 지금 그런 말씀을……?"
63080-105 = "지금이 아니라면, 영영 솔직하게 전할 수 없을 것 같았으니까, 요……?"
63080-106 = "아, 아뇨! 그렇게 허리를 숙이지 않으셔도……!"
63080-111 = "어라……?"
63080-116 = "죄, 죄송합니다. 선생님. 제가……."
63080-117 = "[s5] \"아니야. 나기사는 그렇게 해도 이상하지 않아.\"\n[s6] \"잘못한 건 나야. 다시 한번 사과할 수 있게 해 줘.\""
63080-123 = "[ns7] \"나도 빨리, 좀 더 제대로 된 어른이 되어야 할 텐데.\"\n[ns8] \"미숙한 선생님이라서, 정말로 미안해.\""
63080-126 = "선생, 님……."
63080-127 = "선생님……."
63080-128 = "……."
63080-129 = "죄송, 하지만."
63080-130 = "잠시, 뒤돌아, 주실 수 있으시겠어요……?"
63080-133 = "(나기사의 요청대로 뒤로 돌아섰다.)"
63080-134 = "(그대로 잠시 있으려니…….)"
63080-139 = "(아주 작은 무게 같은 것이, 등 뒤에 톡, 하고 실려 왔다…….)"
63080-143 = "저, 힘들었어요."
63080-144 = "[s] \"……미안해.\""
63080-145 = "그동안 정말로, 정말로……."
63080-146 = "[s] \"응…….\""
63080-147 = "몇 번이나, 생각했어요."
63080-148 = "물론 그 일은 저에게 전적인 책임이 있었지만."
63080-149 = "그래도, 그래도……."
63080-150 = "어째서, 저에 대한 기준만, 유독 그렇게도 엄격하셨을까, 하고."
63080-151 = "물론 저는 엄격한 기준을 적용해야 할, 티파티의 호스트이고."
63080-152 = "히후미 씨와 코하루 씨에 대한 것은, 더 심한 말을 들었어도 할 말이 없었겠지만……."
63080-153 = "그렇지만, 그렇지만……."
63080-158 = "흑……."
63080-159 = "(나기사의 손이, 그동안 정말로 괴로웠다는 듯이, 몇 번이고 등을 툭툭 쳤다.)"
63080-160 = "(어린아이의 주먹처럼 아무렇지도 않은 손길이었지만…….)"
63080-161 = "(그것이 어째서인지, 오히려 더욱 아프게 다가오는 것 같았다…….)"
63080-164 = "[ns] \"조금, 괜찮니?\""
63080-165 = "네."
63080-166 = "추한 모습을 보여드리게 된 것 같아, 죄송합니다."
63080-167 = "[s] \"다시 한번, 미안해…….\""
63080-168 = "선생님께서도 너무 그러지 말아 주세요. 자꾸 그러시면 저 역시도……."
63080-169 = "……."
63080-170 = "이렇게 하죠. 선생님."
63080-171 = "저희 둘 다, 앞으로는 조금 더 조심할 것."
63080-172 = "그리고 그 이야기는 이제 웬만해서는 꺼내지 말 것."
63080-173 = "그것을 기념하고 확인하는 의미에서, 홍차로 건배, 어떠신가요?"
63080-174 = "[s] \"고마워. 나기사.\""
63080-175 = "천만의 말씀입니다."
63080-176 = "[s] \"그러면…… 건배!\""
63080-177 = "건배~"
63080-182 = "[ns] \"향이 좋네…….\""
63080-185 = "그럼요. 그래야죠."
63080-189 = "네? 그러고 보니, 마지막으로 '그때의' 일에 대해, 저에게 말씀 주시지 않은 것이 있다고요……?"
63080-194 = "(스바루에게도 이야기했던…… 아니, 스바루에게 공유되었던.)"
63080-195 = "(에덴 조약 사건 직후의…… 파테르 분파와 상투스 분파의, 이른바 '총의'에 대한 이야기를 했다…….)"
63080-198 = "……."
63080-199 = "…………."
63080-200 = "………………."
63080-201 = "[s] \"나, 나기사 씨……?\""
63080-202 = "후."
63080-203 = "[s] \"후……?\""
63080-204 = "후후."
63080-205 = "후후후후……."
63080-206 = "그랬군요, 그랬군요. 그런 일이 있었군요."
63080-207 = "그 두 분이 누구신지, 대충 짐작은 갑니다. 저에게도 관련 보고서를 올려 주셨거든요."
63080-208 = "정말로."
63080-209 = "진심으로, 감사드립니다. 선생님."
63080-210 = "아주, 소중한 정보였어요. 후후후후후……."
63080-211 = "[s] \"히, 히이이이…….\""
63080-212 = "그렇군요, 그렇군요. 알아서 잘해 놓겠다고 이야기해 두고, 일 처리를 그렇게 했다는 거네요……."
63080-213 = "그러면서 보고서는 살짝 비틀어서, 그렇게 올려놓았던 거고요……."
63080-214 = "[s] \"나기사……?\""
63080-215 = "걱정 마세요, 선생님."
63080-216 = "이 일은 '제가', '원만하게 처리해' 두겠습니다."
63080-217 = "정말로, 정말로."
63080-218 = "아무 걱정하지 않으셔도 되도록, '최선을 다해' 대처해 두겠습니다. 정치는 모름지기 명분과 타이밍이죠."
63080-219 = "가령 이런 기망 행위가 발생했던 것은, 역시 각 분파 대표의 권위가 아직 회복되지 않은 탓이라고 볼 수 있기에."
63080-220 = "특히 미카 씨의 위치와 대우를, 물론 예전으로 되돌리는 것은 지극히 어렵겠지만."
63080-221 = "적어도 지금보다는 조금 더 승격시켜도 문제가 없을 것으로 판단된다는 내부 공문을 발송한다던가……."
63080-225 = "(그렇게 이야기하는 나기사의 상쾌한 표정에서…….)"
63080-226 = "(오늘, 최대치의 공포를 느낄 수밖에 없었다…….)"
63080-227 = "그러면, 선생님? 조금 무겁고 머리가 아파 오는 화제는, 여기까지만 하는 것으로 하고."
63080-228 = "남은 한 시간 정도…… 저와, 단둘이 티타임을 해 주실 수 있으실까요?"
63080-229 = "[s] \"나는 좋은데, 갑자기 왜?\""
63080-230 = "그건……."
63080-231 = "가령 '선생님의 그 발언'이라든가."
63080-232 = "저와 선생님 사이에 미묘하게 존재해 왔던 거리감이라든가."
63080-233 = "그 거리감을 유발하게 했던 여러 가지 요인들이라든가."
63080-234 = "그런 것들에 대한……."
63080-235 = "'사소한 보상'을 요구하고 싶어져서요?"
63080-236 = "[s] \"……!\""
63080-241 = "[ns] \"그 이야기는 하지 않기로 했잖아!\""
63080-242 = "어머나."
63080-243 = "저는 그 발언이 구체적으로 무엇인지, 확실하게 지칭하지 않았는데요?"
63080-244 = "[s] \"노렸구나, 나기사…… 노렸구나!\""
63080-245 = "후훗. 그것은 또 어떨까요……?"
63080-246 = "그러면, 선생님."
63080-247 = "아~앙?"
63080-248 = "[s] \"뭣?!?!\""
63080-249 = "……그렇게, 제가 싫으신가요……?"
63080-250 = "[s] \"……노렸구나, 나기사…… 노렸구나…….\""
63080-251 = "네. 노렸답니다."
63080-252 = "이것도 어떤 의미로는, '정치'이지 않을까요?"
63080-254 = "(완벽하게 함정에 걸리고 말았다는 것을 인정하며…….)"
63080-255 = "(나기사의 응석을 받아 주려고 했던…… 바로 그 순간이었다!)"
63080-260 = "얏호, 나기 쨩! 뭐 하고 있어?"
63080-266 = "미, 미카 씨?! 세이아 씨?!?!"
63080-270 = "어, 어어?! 선생님??!! 서, 선생님이 있는 줄 알았다면, 나도 조금 더……."
63080-271 = "호오. 무언가 재미있…… 아뇨. 중요한 일이 일어날 것 같다는 '느낌'에 따라, 예정 없이 방문했습니다만……."
63080-272 = "아무래도, 정답이었던 것 같군요."
63080-274 = "서, 선생님? 어떡하죠?! 두 분, 특히 미카 씨에게는 알려지지 않았으면 하는 이야기가……!"
63080-275 = "[s] (진정해, 나기사! 그 화제는 이미 끝났으니까!)"
63080-276 = "!!!"
63080-277 = "그랬죠……. 감사합니다. 선생님!"
63080-281 = "크흠. 흠. 어서 오세요. 두 분. 선생님이 갑자기 예정에도 없이, 트리니티를 방문해 주셔서요."
63080-282 = "어? 정말? 뭐야, 그랬던 거구나. 그러면 당연히 나기 쨩이 자리를 마련해야지. 잘했네!"
63080-283 = "우우…… 그래도 나한테는 살짝 먼저 이야기해 줬으면 더 좋았을 텐데……."
63080-287 = "(나기사가 윙크하며 눈짓을 보내왔다!)"
63080-288 = "[ns9] \"그러게. 그럴 걸 그랬네.\"\n[ns10] \"왠지 미카가 보고 싶어져서, 깜짝 놀라게 해 주려고 했거든.\""
63080-293 = "어, 어어어?!?! 저, 정말???!!! 그건, 정말로 기쁜데……."
63080-294 = "에헤헤. 에헤헤헤. 선생님도 참."
63080-299 = "……."
63080-300 = "선생님은 정말로, 죄 많은 분이시군요."
63080-301 = "[s11] \"나, 나는 아무것도 하지 않았어!\"\n[s12] \"억울하다! 나는 그냥 최선을 다하고 있을 뿐인데!\""
63080-302 = "진심이신가요……."
63080-303 = "의도와 결과가 매번 일치한다면, 얼마나 좋을까요……."
63080-304 = "그러면 두 분 모두, 이렇게 되었으니 간만에…… 함께 '티 타임'을 가지지 않으시겠어요?"
63080-305 = "이렇게, 선생님도 계시니 말이죠."
63080-306 = "응, 응! 대찬성!"
63080-307 = "어라? 그러고 보니…… 우리 셋에 선생님까지 있는 티 타임은 처음이었던가? 아니, 아니었나?"
63080-308 = "우우, 기억력이 나빠졌나 봐. 가물가물하네……. 나 어떡하지, 선생님?"
63080-309 = "그런 것은 아무래도 좋지 않을까요, 미카."
63080-310 = "중요한 것은 지금, 우리가 이 자리에 함께 있다는 사실 그 자체일 테니까요."
63080-311 = "물론 당신에게는 어쩌면, 세상 모든 일이 대부분 신선하게 다가올지도 모르는 일이지만요."
63080-312 = "세~이~아~쨩~? 사람 기억력이 안 좋다는 말을, 이젠 거의 돌리지도 않고 이야기해 주네?"
63080-313 = "다행입니다. 기억력이 위험해졌을 뿐, 눈치는 아직 살아 있는 모양이네요."
63080-314 = "자꾸 그렇게 배배 꼬아서 이야기하면 말이지? 언젠가 모두에게서 멀어져 버릴지도 모르고 말이지?"
63080-315 = "그 부분은 두고 보아야 하지 않을까요?"
63080-316 = "무엇보다 저는, 더 이상 미래를 읽을 수 없게 된 몸이니까요."
63080-317 = "꼭 한 마디를 안 져요, 한 마디를……!"
63080-318 = "……훗."
63080-320 = "미, 미카 씨? 세이아 씨? 지금 선생님도 와 계신데……?"
63080-332 = "[ns13] \"역시, 사람과 사람 사이의 갈등이란…….\"\n[ns14] \"그렇게 쉽게 해소되지 않는 법인가…….\""
63080-335 = "제가 다 죄송합니다, 선생님……."
63080-337 = "다음화;시험공부"
