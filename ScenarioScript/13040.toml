[translation]
13040-1 = "제4화;흘러간 것들"
13040-2 = "으, 으으으…… 어째서 이렇게 된 걸까나."
13040-3 = "크크큭, 어째서긴? 그렇게 쉽게 남을 믿으니까 그렇지."
13040-4 = "히, 히잉…… 쉽게 믿지 않았는데…… 분명히 건실하게 주 90시간 노동해서 월급받는 일 아니었어요……?"
13040-5 = "여기처럼 망해가는 자치구에서 건실한 노동 같은 게 있을 리가 없잖아!"
13040-6 = "그래, 맞아. 있는 건 그냥 주 90시간 노동 뿐이거든?"
13040-7 = "워, 월급은요……?"
13040-8 = "있을 리가 있겠냐! 키키키킥-!"
13040-10 = "고, 곤란해요……? 저는 학교의 빚을 갚아야 해서 무급 노동은 좀……. 그리고 빨리 돌아가지 않으면 후배가 걱정할 것 같은데……."
13040-12 = "지금 그딴 걸 걱정할 처지가 아니라고?"
13040-13 = "그래, 게다가 이 건물에는 우리 부하들이 쫙 깔려 있어서 널 도와줄 사람은 아무도 없거든?"
13040-14 = "그러니……."
13040-18 = "……응?"
13040-19 = "지진인가? 왜 진동이……."
13040-23 = "심판의 시간이다~! 이 깡패 놈들아!!"
13040-24 = "우, 우와아앗-?!"
13040-25 = "뭐, 뭐야?!"
13040-27 = "호, 호시노 쨩……?!"
13040-28 = "찾았잖아요, 선배! 바빠죽겠는데 자꾸 자리를 비우면 곤란하다구요!"
13040-29 = "얼른 돌아가요. 해야 할 일이 잔뜩 쌓여 있다고요!"
13040-31 = "무, 무슨 짓이냐, 이 녀석!"
13040-32 = "이, 이봐! 이쪽이다! 부하들을 전부 불러와!"
13040-34 = "아무도 오지 않을걸? 이 빌딩에 있는 녀석들은 전부 해치워 뒀으니까."
13040-36 = "뭐, 뭣?!"
13040-37 = "어, 어느새……?! 그 숫자를……?! 호, 혼자서……?!"
13040-46 = "으, 으아아악-!"
13040-47 = "크아아악--!!"
13040-51 = "히, 히이이잉…… 무서웠어. 호시노 쨩……."
13040-52 = "그러니까 왜 또 이상한 어른들에게 속은 거예요."
13040-53 = "그치만……."
13040-54 = "지금의 아비도스 자치구는 그야말로 무법천지라고요. 사람들이 떠나면서 도시는 텅 비어서 슬럼화가 진행되고 있어요."
13040-55 = "오히려 키보토스 곳곳에 있는 불량한 녀석들이 아비도스로 몰려오고 있는 상황이라고요."
13040-56 = "그러니까 기본적으로 얼굴이 익지 않은 낯선 사람들은 전부 나쁜 놈이라고 생각하세요."
13040-57 = "그치만…… 그게 진짜 곤란에 처한 사람이면 어떻게 해?"
13040-58 = "그럴 리가 없잖아요. 아비도스에 착한 사람은 없다구요. 전부 꿍꿍이가 있는 악당들뿐이라고요!"
13040-59 = "우웅…… 그치만……."
13040-60 = "먼저 손 내밀었다가는 뒤통수를 맞습니다! 계속 의심하고 또 의심해야 해요! 그래야 저희 학교를 지킬 수 있어요!"
13040-64 = "그러니까 지금부터라도 좀 더 적극적으로……."
13040-65 = "호시노 쨩."
13040-66 = "……?"
13040-67 = "아니야. 호시노 쨩. 그건 아니야."
13040-72 = "유, 유메 선배……?"
13040-76 = "잘 들어. 호시노 쨩. 중요한 이야기야."
13040-77 = "저기…… 너무 가깝습니다……만……."
13040-82 = "호시노 쨩. 의심과 불신, 폭력…… 거짓말…… 우리가 그런 방식에 조금씩 익숙해지기 시작하면……"
13040-83 = "우리도 언젠가 그런 사람들이 되어버릴 거야."
13040-85 = "……."
13040-86 = "우리가 그렇게 해서 아비도스를 구한다고 해도…… 그건 우리가 원했던 아비도스는 아닌 거야."
13040-87 = "나는 아비도스가 그런 불신과 폭력, 거짓말로 가득 차 있는 곳으로만 기억된다면…… 조금 슬플 것 같아."
13040-88 = "그러니까, 호시노 쨩? 곤란에 처한 사람을 보면 먼저 손을 내밀어 줬으면 좋겠어. 춥고 배고픈 사람에겐 옷과 밥을 주고……."
13040-89 = "……."
13040-90 = "나는 바보라서 자세하게 설명할 수는 없지만……"
13040-91 = "호시노 쨩이라면 내 말이 무슨 뜻인지 이해할 거야. 그치?"
13040-95 = "……. 너무 안일하다고요. 유메 선배. 그러다가 배신당하면요? 또 지금처럼 선배가 위험에 빠지면 어쩌려구요?"
13040-96 = "그땐 또 호시노 쨩이 구해주려나……?"
13040-97 = "……뭐, 그러겠지만요."
13040-98 = "에헤헤……."
13040-99 = "뭐, 뭐예요?"
13040-100 = "응! 호시노 쨩의 그 말, 잊어버리지 않게 적어둬야 해!"
13040-101 = "네?!"
13040-107 = "무, 무슨 짓이에요?! 적지 마요! 그것도 이상한 센스의 수첩에다가!! 낯부끄러운 대사를……."
13040-108 = "아니, 그리고 수첩 바꿀 생각은 없어요? 초등학생도 아니고……."
13040-109 = "그것보다, 유메 선배. 이제부터 제가 생각해 둔 계획이 있는데요."
13040-110 = "아비도스의 치안을 조금 더 나아지게 할 방법인데…… 그러니까……."
13040-111 = "……유메 선배?"
13040-115 = "……유메 선배?"
13040-121 = "……."
13040-122 = "유메 선배……."
13040-123 = "……."
13040-124 = "………………."
13040-125 = "여, 여기는……."
13040-126 = "…………."
13040-127 = "아, 아아……."
13040-135 = "……. 그렇……지. 맞아."
13040-136 = "나는…… 아비도스 학생회실…… 폐쇄하려고 왔었지……."
13040-137 = "그리고 깜빡 졸았……나 보네……."
13040-138 = "……."
13040-139 = "폐쇄…… 해야 하는데."
13040-140 = "하아……."
13040-148 = "……. 내일…… 하자……."
13040-149 = "내일은 미루지 않는 걸로……."
13040-154 = "어라, 넌……."
13040-155 = "당신을 기다리고 있었어요! 부학생회장님!"
13040-156 = "어…… 나를?"
13040-157 = "네! 드릴 말씀이 있어요!"
13040-158 = "흐응…… 뭔데?"
13040-159 = "저, 저는…… 확실히 네프티스 그룹의 사람이 맞아요."
13040-160 = "그, 그치만 그래도 상관없어요! 저는…… 아비도스를 위해 할 수 있는 일이 있으니까요……!!"
13040-161 = "할 수 있는 일……?"
13040-166 = "제가, 학교의 빚을 전부 갚을게요! 이 황금 카드로!"
13040-172 = "어…… 그러니까…… 뭐? 황금 카드……?"
13040-173 = "네? 어, 그, 그러니까…… 이건 제 전용 신용카드인데…… 네프티스의 자금을 융통할 수 있는 법인 카드……같은 걸로……."
13040-174 = "건방진 소리 하지 마, 아가씨."
13040-175 = "……!!"
13040-176 = "그걸로 학교의 빚을 갚겠다는 건 이 학교의 주인이 되겠다는 얘기거든? 그런 걸 원하는 거야?"
13040-177 = "네? 저, 저는 그럴 생각은……. 아무런 대가 없이 그냥……."
13040-178 = "대가가 없는 건 없어. 너는 그렇게 생각하더라도 다른 사람들은 그렇게 생각하지 않을걸?"
13040-179 = "그리고 그 카드는 네가 아니라 네프티스의 것이잖아. 빚을 갚아준 게 네프티스가 되어버리는데, 어째서 네가 빚을 갚아주겠다고 생각하는 거지?"
13040-180 = "저, 저는……."
13040-181 = "네가 자유롭게 쓸 수 있는 돈이니까 네 것이라고 생각하는 거야, 아가씨?"
13040-182 = "뭐라도 직접 돈을 벌어본 적은 있어? 아니면 그냥 다른 일이라도 직접 해본 적은? 청소는? 빨래는?"
13040-183 = "그, 그건……."
13040-184 = "……돈의 소유권은 쓰는 사람이 아니라 그걸 번 사람에게 있는 거야. 그 점을 착각하면 안 돼."
13040-185 = "네가 그 카드로 빚을 변제하는 순간, 이 학교의 소유권은 자신들에게 있다고 네프티스는 생각하게 되겠지."
13040-186 = "그럼……"
13040-187 = "아비도스의 빚은 어떻게 해야 갚을 수 있는 거죠……?"
13040-189 = "……."
13040-190 = "아비도스 학생의 입장에서 직접 번 돈으로 갚으면 되겠지?"
13040-191 = "……."
13040-192 = "……응. 알겠어요. 당신처럼…… 말이죠?"
13040-193 = "으, 으응……?"
13040-194 = "……이해했어요. 준비가 끝나면 다시 찾아오겠습니다."
13040-195 = "아, 그리고 제 이름은 아가씨가 아니라……"
13040-197 = "노노미예요. 호시노 [ruby=・]선[/ruby][ruby=・]배[/ruby]."
13040-198 = "어, 어어……?"
13040-200 = "그럼."
13040-204 = "으, 으응……?"
13040-207 = "서, 선배?! 어디예요?!"
13040-215 = "유메 선배! 저 여기 있어요!! 선배!!"
13040-216 = "유메 선배!!!"
13040-220 = "……!!"
13040-221 = "……."
13040-222 = "호, 호시노 선배……."
13040-226 = "………………………………."
13040-227 = "……뭐야. 너였냐."
13040-228 = "저, 저기……. 괘, 괜찮으세요……?"
13040-229 = "……."
13040-230 = "누가 함부로 여기 들어오래? 여긴 고등학교 교실이야. 중학생은 못 들어온다고."
13040-231 = "비명소리가 들려서……."
13040-232 = "……그리고 이제 저 중학생 아니에요. 막 졸업했으니까."
13040-233 = "그리고 네프티스와 산학협력을 맺은 고등학교에 입학이 결정됐어요. 하이랜더 철도 학원이었나…… 아마 지금쯤 입학 서류도 전달되었을 거예요……."
13040-234 = "뭐, 잘된 일이네. 뭐, 그럼 네가 있을 그 학교로 가면 되잖아. 귀찮게 하지 말고."
13040-235 = "……네. 그래서 아비도스를 떠나기 전에 마지막으로 둘러보고 싶어서……."
13040-239 = "그렇게 어찌저찌 아비도스 교정 근처까지 왔다가…… 그, 호시노 선배를 스토킹했다거나 그런 의도는 아니었고……."
13040-240 = "그러다가 비명이 들려서……."
13040-241 = "……그런가."
13040-242 = "그럼 적당히 구경하다가 돌아가. 영애님."
13040-243 = "……소식. 들었어요."
13040-247 = "학생회장의 실종 사건…… 분명 유메라는 이름이었던 걸로……."
13040-251 = "학생회장은 처음부터 문제가 많았던 사람으로, 부학생회장을 두고 도망쳤다고 말하는 사람도 있지만……"
13040-252 = "하지만 극비리에 밝혀진 것으로는, 학생회장은…… 실종된 게 아니라……."
13040-256 = "게다가 그…… 마지막을 발견한 사람이……."
13040-257 = "모, 모르는 척할게요! 이런 이야기를 떠벌리고 다녀도 좋을 게 하나도 없고……."
13040-258 = "뭐, 어차피 소문낼 사람도 없잖아. 여긴 너랑 나밖에 없는데."
13040-259 = "저기……."
13040-260 = "저기…… 사막을 찾아 헤매는 건 이제 그만두신 거예요……?"
13040-261 = "학생회장이 발견되고 나서도…… 계속 사막을 헤매고 계셨잖아요. 뭔가 찾고 있는 건가요……?"
13040-262 = "대체 뭘……?"
13040-267 = "그러고 보면 여기가 아비도스 학생회실이죠……? 물건들도 다 정리가 끝난 것 같고……"
13040-268 = "문은 폐쇄된 걸로 보이는데 여기 다시 들어오신 건가요……? 찾고 있는 건 찾으신 건가요?"
13040-269 = "나가자."
13040-274 = "아, 앗. 자, 잠깐만요, 선배!"
13040-280 = "콜록, 콜록……. 먼지가 꽤 쌓여 있네요……."
13040-281 = "……뭐, 청소 안 한 지 오래됐으니까. 혼자서 엄두도 안 나고. 거기 조심해. 바닥이 상했으니까."
13040-282 = "애초에 여기는 사막화를 피해 몇 번이나 이사를 해서 오게 된 별관 건물이거든. 시설이 좋지 못해."
13040-283 = "……네, 알아요. 저도 들었어요. 키보토스에서 가장 긴 역사를 자랑하는 아비도스의 본관 건물은 이미 사막 어딘가에 묻혀 버렸다고……."
13040-284 = "그렇지. 내가 처음 입학했던 학교 건물도 지금은 모래에 파묻혀 버렸고 말야."
13040-285 = "네, 호시노 선배가 입학하고 나서 얼마 안 있어서 여기로 이사했죠?"
13040-286 = "……잘 알고 있네?"
13040-287 = "네, 여기는 별관 건물이지만 그래도 다른 학교에 있는 것은 다 있는…… 어라?"
13040-288 = "선배, 학원제사무국이래요. 이런 부실도 있었네요?"
13040-290 = "학원제라니, 설마 오아시스 모래 축제일까요?"
13040-294 = "야, 잠깐, 멋대로 들어가면……."
13040-296 = "축제라면 저도 아이디어가 있어요! 이런저런 행사를 열어서 사람들의 이목을 집중시키면 어떨까요?"
13040-297 = "응응! 아이돌 무대 같은 화려하고 귀여운 이벤트는 어떨까요♧"
13040-298 = "어라."
13040-299 = "……텅 비어 있네요."
13040-300 = "당연하지. 모래 축제 같은 건 이미 오래전에 중단되었으니까."
13040-301 = "……그러네요. 생각해 보면 당연한 건데……."
13040-302 = "하아……."
13040-306 = "……왜 온 거야?"
13040-307 = "네? 아이돌 무대 같은 걸……."
13040-308 = "아니. 그 말이 아니야. 왜 날 따라다니냐는 거야, 네프티스의 영애님."
13040-309 = "중학생에게 선배 소릴 들을 이유는 없다고. 왜 귀찮게 하는 거지?"
13040-310 = "하이랜더 철도 학원? 거기가 네가 입학할 학교라며? 여기가 아니라."
13040-311 = "그, 그건……."
13040-312 = "……거기로 가면 계속 후회하며 살 것 같거든요."
13040-313 = "왜? 네프티스의 협력 학원이라며?"
13040-314 = "네. 분명 좋은 대우를 해주겠죠. 아마 학생회장 같은 직책에도 오르게 될 거고……."
13040-315 = "헤에~ 학생회장인가? 좋지 않아?"
13040-316 = "……."
13040-317 = "……뭐어, 사정이 있는 건 알겠어."
13040-318 = "그치만 여기로 와도 후회하긴 마찬가지야. 우중충하고 조용하기만 한 이런 학교가 뭐가 좋아서 찾아오는 거야?"
13040-319 = "아직 청춘이잖아. 노노미 쨩. 이 아저씨 말을 들으라구."
13040-320 = "(아저씨……?)"
13040-321 = "그치만 호시노 선배, 저와 나이 차이 별로 안 나지 않나요……?"
13040-322 = "중학생이잖아? 고등학생에게 그런 말 하면 안된다고?"
13040-323 = "졸업했지만……."
13040-324 = "뭐어, 어쨌든."
13040-333 = "시간이 없으니까 하이랜더 철도 학원에 대해 빠르게 설명하겠습니다!"
13040-335 = "여기는 철도 관리 및 교육에 특화되어 있는 학원입니다. 키보토스에 존재하는 철도 노선들 중 일부를 관리하기도 하고, 다양한 사업도 펼치고 있는 것 같아요."
13040-336 = "이 학교의 특성은 특별한 자치구가 존재하지 않는다는 것입니다. 대신, 자신들이 관리하는 철도 노선 자체가 그들의 자치구 역할을 하는 것 같아요."
13040-337 = "점과 선으로 이루어진 자치구라는 건가…… 특이하긴 하네."
13040-338 = "네. 그 때문인지 이곳은 그 감독관이 말한 것처럼 굉장히 복잡한 정치적 알력이 있는 것으로 보여요."
13040-339 = "철도를 유지 관리하는 사무조직과 치안조직이 있고…… 그리고 학원 행정을 총괄 관리하는 집단이 바로 중앙관제센터 (Central Control Center) 즉, CCC라는 곳입니다."
13040-340 = "하이랜더의 학생회 같은 곳이지?"
13040-342 = "맞아, 세리카 쨩. 그 쌍둥이들은 CCC의 간부, 즉 학생회 위원들인 것 같아……."
13040-347 = "그리고 나중에 등장했던 사람…… 아사기리 스오우는 그 CCC를 견제하는 이사회라는 집단에서 파견한 감독관인 것 같고……."
13040-348 = "스오우 씨와 쌍둥이들은 서로 견제하는 관계라고 생각되지만…… 확실한 건 아직 잘……."
13040-350 = "이정도가 하이랜더 철도 학원의 정보입니다."
13040-354 = "어라……?"
13040-359 = "이, 이건 교문 앞 차임벨……?"
13040-360 = "당연히 상식적으로 손님이 방문할 때 누르라고 달아놓은 거지만, 아무도 쓰지 않던 그 잊혀진 차임벨이 마침내 울렸다고요?!"
13040-362 = "안-녕-"
13040-363 = "하이랜더 CCC에서 찾아왔어. 지금 교문 앞인데, 들어갈게? 대답 없네? 히카리, 연타해!"
13040-364 = "우오- 히카리 명인의 벨튀 초당 16연타- 간다- 슈바바바-바-"
13040-373 = "네에?!"
13040-374 = "뭐, 뭐야, 이 녀석들?"
13040-375 = "흐음~ 호랑이도 제 말 하면 온다더니. 그런데 진짜 금방 찾아왔잖아?"
13040-378 = "……하아. 저리 비켜, 간부님들."
13040-382 = "우오오-?"
13040-383 = "야, 갑자기 밀지 마!"
13040-384 = "……실례하겠어. 하이랜더 감리감독관 아사기리 스오우다. 지금 이건 내가 대신 사과하지."
13040-385 = "약속한대로 대책위원회를 찾아왔어. 괜찮다면 들어가도 될까? 싸울 생각으로 온 건 아니야."
13040-387 = "어, 어쩌죠?"
13040-388 = "뭐어, 어쩔 수 없으려나. 이대로 두면 하나밖에 없는 차임벨이 고장 나버릴지도 모르니까, 들어오라고 해."
13040-390 = "다음화;사막횡단철도"
