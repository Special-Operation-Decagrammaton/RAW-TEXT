[translation]
1014008-1 = "배웅하는 여우"
1014008-2 = "(총학생회에서 주관한 오후 회의가 예정보다 길어진 어느 날.)"
1014008-3 = "(역에서 나와 샬레로 돌아가던 도중……)"
1014008-8 = "[ns1] \"가로등이 고장났나……?\"\n[ns2] \"……오늘따라 길이 어둡네.\""
1014008-12 = "[ns] \"우, 우왓?!\""
1014008-14 = "[ns3] (날이 어두워서 자꾸 자꾸 발을 헛디디네.)\n[ns4] (게다가 지나다니는 사람도 거의 없어서……)"
1014008-18 = "최근 이 주변 골목에서 금품을 목적으로 한 강도가 나타나는 모양이야."
1014008-19 = "인적이 드문 어두운 골목길에서 몰래 뒤를 밟은 뒤에…… 뒤를 급습해서 쓰러트리고 주머니를 털어 간다나 봐."
1014008-22 = "[ns] \"조금 서둘러야 겠다……\""
1014008-26 = "[ns] (누군가 따라붙었어……?)"
1014008-30 = "[ns5] \"해, 해치지 마세요!\"\n[ns6] \"제게 돈 될만한 물건은 아무것도 없어요!\""
1014008-33 = "……그게 무슨 소리야?"
1014008-37 = "설마 나를 요새 소문이 자자한 그 강도로 착각한 거야?"
1014008-38 = "[s7] \"쿠루미였구나…… 다행이다.\"\n[s8] \"……나쁜 사람이 따라오는 줄 알았어.\""
1014008-41 = "잠깐 편의점에 다녀오는 길에 낯익은 뒷모습이 보여서 따라왔더니만…… 역시 선생님이었네."
1014008-42 = "그보다 그렇게 겁을 먹으면서, 왜 홀로 밤 거리를 걷고 있었던 거야?"
1014008-43 = "다른 학생이나 호위…… 마땅치 않으면 내게 연락해도 괜찮다고 말했었는데."
1014008-44 = "[s] \"짧은 거리라 괜찮을 줄 알았어.\""
1014008-45 = "선생님은 정말 위기 의식이 부족하다니까."
1014008-46 = "그러다 언젠가 나쁜 마음을 먹은 학생에게 덮쳐지더라도 할 말 없게 될 거야."
1014008-47 = "[s9] \"그보다, 혹시 지금 손전등 갖고 있어?\"\n[s10] \"너무 어두워서 길이 잘 보이지 않아.\""
1014008-50 = "손전등? 지금은 갖고 있지 않은데."
1014008-51 = "핸드폰의 플래시 기능도……"
1014008-55 = "윽, 배터리가 10% 밖에 남지 않았네. 지금은 쓸 수 없겠어."
1014008-56 = "[s] \"쿠루미의 섬광 방패는?\""
1014008-57 = "이건 일시적으로 섬광을 터트리는 용도라, 길을 비추는 데에는 적합하지 않아."
1014008-58 = "게다가 이런 어두운 밤에 섬광 방패를 터트리면 주변 사람들에게 민폐가 되잖아?"
1014008-59 = "[s] \"……지당하신 말씀입니다.\""
1014008-65 = "자, 내 손을 잡아."
1014008-66 = "이래뵈도 밤눈은 밝은 편이니까, 내 손을 잡고 그대로 따라오면 최소한 돌부리에 발을 부딪힐 일은 없을 거야."
1014008-67 = "……꼭 손을 잡아야 할 필요가 있냐고?"
1014008-68 = "무, 무슨 생각을 하는 거야! 이건 시야가 확보되지 않는 장소에서 퇴출할 때 자주 쓰는 전술 방법이거든?"
1014008-69 = "오, 오해하지 말고 손이나 꽉 잡아. 놓치면 정말로 더 위험하니까."
1014008-73 = "(쿠루미의 손을 잡은 채, 어두운 골목길을 걸어 나갔다.)"
1014008-75 = "[ns] \"쿠루미는 이런 상황에…… 꽤 익숙한 느낌이네.\""
1014008-76 = "익숙할 수 밖에. 포인트맨이라는 말도 결국은 누군가를 선도한다는 뜻이니까."
1014008-77 = "나는 언제나 어두운 곳에 먼저 뛰어들어 길을 밝히고, 타인을 이끄는 데 익숙하거든."
1014008-78 = "하지만 익숙하다 해서…… 마음이 늘 편한 건 아니야."
1014008-79 = "어둠 속에서 내가 향하고 있는 곳이, 함정으로 점철된 잘못된 방향이라면……"
1014008-80 = "모두를 위험에 빠트릴지도 모르니까."
1014008-81 = "매번 새로운 발을 내딛을 때마다 두려움이 조금씩 밀려와."
1014008-83 = "……나는 옳은 방향으로 소대를 선도하고 있을까?"
1014008-84 = "[s11] \"어둠이라는 건 언제나 불확실하지.\"\n[s12] \"내딛어 보기 전까지는 아무것도 알 수 없잖아.\""
1014008-88 = "맞아. 그게 나를 더 불안하게 만들—"
1014008-89 = "[s] \"하지만 여전히 손을 쥐고 있잖아?\""
1014008-90 = "………."
1014008-91 = "[s13] \"쿠루미가 발을 헛디디면, 그 때는 뒤에서 잡아당겨줄게.\"\n[s14] \"그렇기에 소대에 백업이 존재하는 법이지.\""
1014008-94 = "함께 작전을 꽤 해서 그런지, 선생님도 어느새 특수부대 같은 소리를 하네."
1014008-95 = "맞아. 이 움켜쥔 손은 꼭 상대를 앞으로만 이끄는 게 아니니까."
1014008-96 = "선생님. 그러니까……"
1014008-100 = "절대, 절대 이 손을 놓으면 안 돼."
1014008-102 = "(이후 쿠루미의 손을 잡은 채, 안전하게 샬레로 돌아왔다.)"
