[translation]
1014008-1 = "送行的狐狸"
1014008-2 = "（在某個下午，由聯邦學生會主辦的會議比預定時間拖得更晚的日子）"
1014008-3 = "（走出車站返回夏萊的途中……）"
1014008-4 = ""
1014008-8 = "[ns1] 「路燈壞了嗎……？」\n[ns2] 「……今天這條路特別暗呢。」"
1014008-12 = "[ns] 「呃，哇啊！？」"
1014008-14 = "[ns3] （天色太暗看不到路，結果一直踩空）\n[ns4] （而且路上幾乎沒有人經過……）"
1014008-17 = ""
1014008-18 = "最近這一帶的巷子裡，好像出現了以財物為目標的強盜。"
1014008-19 = "會在人煙稀少的昏暗巷弄裡偷偷跟在後面……#n再從背後突襲將人擊倒，然後把財物洗劫一空的樣子。"
1014008-22 = "[ns] 「得稍微加快腳步才行……」"
1014008-25 = ""
1014008-26 = "[ns] （有人跟上來了……？）"
1014008-29 = ""
1014008-30 = "[ns5] 「請，請不要傷害我！」\n[ns6] 「我身上沒有任何值錢的東西！」"
1014008-33 = "……你在說什麼啊？"
1014008-34 = ""
1014008-36 = ""
1014008-37 = "難道你把我誤認成最近傳得沸沸揚揚的那個強盜了嗎？"
1014008-38 = "[s7] 「原來是胡桃啊……太好了。」\n[s8] 「……我還以為是壞人跟上來了。」"
1014008-41 = "我剛去便利商店回來的路上，看到熟悉的背影就跟了過來……果然是老師呢。"
1014008-42 = "話說你都嚇成這樣了，為什麼還要一個人走夜路啊？"
1014008-43 = "不是跟你說過如果找不到其他學生或護衛的話……可以聯絡我嗎。"
1014008-44 = "[s] 「我想說距離很短應該沒關係。」"
1014008-45 = "老師你真的很缺乏危機意識耶。"
1014008-46 = "這樣要是哪天被起了歹念的學生襲擊，也是你自找的哦。"
1014008-47 = "[s9] 「比起這個，你現在身上有手電筒嗎？」\n[s10] 「太暗了，路都看不太清楚。」"
1014008-50 = "手電筒？我現在沒帶。"
1014008-51 = "手機的手電筒也……"
1014008-52 = ""
1014008-55 = "唔，電池只剩10%了。現在沒辦法用。"
1014008-56 = "[s] 「胡桃的閃光盾呢？」"
1014008-57 = "這是用來瞬間釋放閃光的，不適合用來照明。"
1014008-58 = "而且在這種漆黑的夜晚啟動閃光盾，會給周圍的人添麻煩吧？"
1014008-59 = "[s] 「……您說得非常有道理。」"
1014008-60 = ""
1014008-62 = ""
1014008-63 = ""
1014008-64 = ""
1014008-65 = "來，牽住我的手。"
1014008-66 = "別看我這樣，我的夜視能力還算好。#n牽著我的手跟在後面，這樣至少不會被石頭絆到腳。"
1014008-67 = "……你問一定得牽手嗎？"
1014008-68 = "你，你在想什麼啊！#n這是從無法確保視野的地方撤離的時候經常使用的方法耶！？"
1014008-69 = "不，不要誤會，把手牽緊就對了。#n要是走散了反而會變得更危險。"
1014008-73 = "（就這樣牽著胡桃的手，走過昏暗的巷弄）"
1014008-74 = ""
1014008-75 = "[ns] 「胡桃對這種狀況……感覺相當熟練呢。」"
1014008-76 = "那是當然的。#n所謂的尖兵，本來就有引導他人前進的意思。"
1014008-77 = "我總是率先衝進黑暗之中照亮道路、引領他人，所以早就習慣了。"
1014008-78 = "但就算習慣了……心裡也不見得總是輕鬆。"
1014008-79 = "要是我在黑暗中前往的，是布滿陷阱的錯誤方向……"
1014008-80 = "說不定會讓大家陷入危險。"
1014008-81 = "每當踏出新的一步，恐懼就會一點一點地湧上來。"
1014008-83 = "……擔心自己到底有沒有把小隊帶往正確的方向。"
1014008-84 = "[s11] 「所謂黑暗，總是充滿了不確定呢。」\n[s12] 「而且在踏出去之前，什麼都無法得知。」"
1014008-87 = ""
1014008-88 = "沒錯，那正是讓我更加不安的──"
1014008-89 = "[s] 「但你仍然緊握著我的手，不是嗎？」"
1014008-90 = "…………"
1014008-91 = "[s13] 「如果胡桃踩空了，到時候我會從後面把你拉住的。」\n[s14] 「正是因為這樣，小隊才會有後援的存在。」"
1014008-94 = "可能是一起作戰久了，老師也漸漸開始會說一些像是特殊部隊的話了呢。"
1014008-95 = "沒錯。這隻緊握的手，並不一定只是把對方往前引導。"
1014008-96 = "所以說……老師。"
1014008-97 = ""
1014008-99 = ""
1014008-100 = "你絕對……絕對不可以放開這隻手哦。"
1014008-102 = "（之後就這樣牽著胡桃的手，安全地回到了夏萊）"
