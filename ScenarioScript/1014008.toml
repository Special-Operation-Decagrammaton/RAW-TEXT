[translation]
1014008-1 = "จิ้งจอกผู้ไปส่ง"
1014008-2 = "(การประชุมช่วงบ่ายในวันหนึ่งขององค์การนักเรียนใช้เวลามากกว่าที่กำหนดไว้)"
1014008-3 = "(ระหว่างเดินออกมาจากสถานีรถไฟและกำลังมุ่งหน้ากลับชาเล่ต์...)"
1014008-4 = ""
1014008-8 = "[ns1] \"ไฟทางเสียเหรอเนี่ย...?\"\n[ns2] \"วันนี้ถนนมืดเป็นพิเศษเลยแฮะ...\""
1014008-12 = "[ns] \"วะ... เหวอ?!\""
1014008-14 = "[ns3] (พอถนนหนทางมืดก็เดินสะดุดล้มบ่อยเลย)\n[ns4] (แถวนี้ก็แทบไม่มีใครเดินผ่านเลยด้วย...)"
1014008-17 = ""
1014008-18 = "เหมือนว่าช่วงนี้จะมีโจรดักปล้นชิงทรัพย์โผล่มาตามซอยแถวนี้น่ะ"
1014008-19 = "ได้ยินว่าโจรจะชอบเดินตามหลังเงียบๆ ในซอยที่เปลี่ยวและมืด... พอได้จังหวะก็พุ่งเข้าประชิดตัวจากข้างหลัง แล้วก็ฉกกระเป๋าไปเลยละ"
1014008-22 = "[ns] \"ต้องรีบหน่อยแล้วละ...\""
1014008-25 = ""
1014008-26 = "[ns] (มีใครตามมาหรือเปล่านะ...?)"
1014008-29 = ""
1014008-30 = "[ns5] \"ยะ... อย่าทำร้ายกันนะ!\"\n[ns6] \"ไม่มีของมีค่าให้ปล้นหรอก!\""
1014008-33 = "หมายความว่ายังไงน่ะ...?"
1014008-34 = ""
1014008-36 = ""
1014008-37 = "เข้าใจผิดว่าฉันเป็นโจรที่คนเขาลือกันช่วงนี้งั้นเหรอ?"
1014008-38 = "[s7] \"คุรุมิเองสินะ... โล่งอกไปที\"\n[s8] \"ครูคิดว่ามีคนไม่ดีตามมาซะแล้ว...\""
1014008-41 = "ฉันแวะไปซื้อของที่ร้านสะดวกซื้อ พอเห็นคนที่ดูคุ้นๆ ก็เลยเดินตามมา... แล้วก็เป็นคุณครูจริงๆ ด้วย"
1014008-42 = "แต่ที่สำคัญกว่านั้น ทำไมคุณครูถึงมาเดินทำท่าทีหวาดกลัวอยู่คนเดียวในเวลากลางคืนแบบนี้ล่ะ?"
1014008-43 = "ฉันก็เคยบอกไว้แล้วไง... ว่าถ้าหานักเรียนหรือคนคุ้มกันคนอื่นไม่ได้ ก็ให้ติดต่อมาหาฉันน่ะ"
1014008-44 = "[s] \"มันไม่ได้ไกลมาก ครูเลยคิดว่าไม่เป็นไรน่ะ\""
1014008-45 = "คุณครูเนี่ยนะ ไม่มีความรู้สึกตื่นตัวต่ออันตรายเลยจริงๆ"
1014008-46 = "ถ้าวันไหนโดนนักเรียนที่คิดไม่ซื่อมาจู่โจมขึ้นมา ถึงตอนนั้นจะมาโวยวายทีหลังไม่ได้นะ"
1014008-47 = "[s9] \"จะว่าไป ตอนนี้คุรุมิมีไฟฉายติดตัวมาหรือเปล่า?\"\n[s10] \"ทางมันมืดจนมองไม่ค่อยเห็นเลย มีไฟฉายมามั้ย?\""
1014008-50 = "ไฟฉายเหรอ? ไม่ได้เอามาด้วยหรอก"
1014008-51 = "แต่โทรศัพท์มือถือก็มีไฟฉายนี่นา..."
1014008-52 = ""
1014008-55 = "อึก แบตเตอรี่เหลือแค่ 10% เอง คงเปิดไฟฉายไม่ได้แล้วละ"
1014008-56 = "[s] \"แล้วโล่แฟลชของคุรุมิล่ะ?\""
1014008-57 = "โล่ของฉันออกแบบมาเพื่อปล่อยแสงวาบชั่วคราว มันไม่เหมาะมาใช้ส่องสว่างตรงทางเดินหรอก"
1014008-58 = "และถ้ามาจุดแสงวาบจากโล่ในคืนมืดๆ แบบนี้ มันจะไปสร้างความเดือดร้อนให้กับคนรอบข้าง#nเอาเปล่าๆ ไม่ใช่เหรอ?"
1014008-59 = "[s] \"ที่พูดมาก็ถูกเลยละ...\""
1014008-60 = ""
1014008-62 = ""
1014008-63 = ""
1014008-64 = ""
1014008-65 = "เอาละ จับมือฉันไว้นะ"
1014008-66 = "เห็นแบบนี้ ฉันเป็นพวกสายตาดีในที่มืดนะ ถ้าจับมือฉันไว้แล้วเดินตามมาดีๆ รับรองได้เลยว่า#nอย่างน้อยก็ไม่เดินไปสะดุดก้อนหินหรอก"
1014008-67 = "จำเป็นต้องเดินจับมือกันจริงๆ หรือเปล่างั้นเหรอ...?"
1014008-68 = "คะ... คิดอะไรอยู่น่ะ! นี่เป็นกลยุทธ์ที่ใช้เวลาอพยพออกจากสถานที่ที่มีทัศนวิสัยจำกัดนะ?"
1014008-69 = "ละ... เลิกเข้าใจผิดแล้วจับมือฉันไว้ให้แน่นๆ ล่ะ ถ้าปล่อยมือขึ้นมาละก็ เดี๋ยวจะยิ่งอันตรายนะ"
1014008-73 = "(คุณครูจับมือคุรุมิเดินออกไปตามตรอกมืด)"
1014008-74 = ""
1014008-75 = "[ns] \"คุรุมิดูจะ... คุ้นเคยกับสถานการณ์แบบนี้เลยนะ\""
1014008-76 = "ก็ต้องคุ้นเคยสิ ก็พ็อยนต์แมนคือคนที่คอยนำทางให้กับคนอื่นอยู่แล้วนี่นา"
1014008-77 = "ฉันมักจะเป็นคนแรกที่กระโจนเข้าไปในความมืดเพื่อส่องสว่างและนำทางให้คนอื่นน่ะ"
1014008-78 = "แต่ถึงปากจะบอกว่าคุ้นเคย... แต่ก็ไม่ได้หมายความว่าในใจฉันจะไม่กลัวหรอกนะ"
1014008-79 = "ถ้าเกิดปลายทางที่ฉันมุ่งหน้าไปท่ามกลางความมืดมิด มันคือทิศทางที่ผิดมหันต์ และเต็มไปด้วยกับดักละก็..."
1014008-80 = "แบบนั้นทุกคนอาจตกอยู่ในอันตรายก็ได้"
1014008-81 = "ทุกครั้งที่ฉันก้าวไปข้างหน้า ความกลัวจะค่อยๆ คืบคลานเข้ามาทีละนิด"
1014008-83 = "แล้วฉันก็จะถามตัวเองว่า ฉันกำลังนำทางที่ถูกต้องให้กับกองทหารอยู่หรือเปล่า?"
1014008-84 = "[s11] \"ในความมืดมิดไม่มีอะไรแน่นอนหรอก\"\n[s12] \"เราไม่มีทางรู้อะไรเลย จนกว่าจะลองก้าวเดินดู\""
1014008-87 = ""
1014008-88 = "ใช่ แล้วนั่นก็ยิ่งทำให้ฉันกังวลมากขึ้น—"
1014008-89 = "[s] \"แต่ก็ยังจับมือกันอยู่ตลอดไม่ใช่เหรอ?\""
1014008-90 = "..."
1014008-91 = "[s13] \"ถ้าคุรุมิสะดุด ครูจะช่วยคว้าตัวจากข้างหลังให้เอง\"\n[s14] \"เพราะแบบนี้แหละ ในกองทหารถึงต้องมีคนคอยระวังหลังให้ไง\""
1014008-94 = "นี่พวกเราออกปฏิบัติการด้วยกันบ่อยเกินไปหรือเปล่านะ... คุณครูถึงได้พูดจาเหมือนหน่วยรบพิเศษขึ้นมาอย่างนั้น"
1014008-95 = "ใช่แล้วละ ก็มือที่กำแน่นแบบนี้ ไม่ได้หมายความว่าเรากำลังพาอีกฝ่ายไปข้างหน้าเสมอไปนี่นะ"
1014008-96 = "คุณครู เพราะงั้น..."
1014008-97 = ""
1014008-99 = ""
1014008-100 = "ห้ามปล่อยมือนี้เด็ดขาดเลยนะ"
1014008-102 = "(แล้วคุณครูก็เดินจับมือคุรุมิกลับชาเล่ต์อย่างปลอดภัย)"
