[translation]
1014008-1 = "A Farewell Fox"
1014008-2 = "The General Student Council meeting ran a lot later than I expected that day."
1014008-3 = "I exited the station, finally on my way back to Schale."
1014008-4 = ""
1014008-8 = "[ns1] \"Is the streetlight broken?\"\n[ns2] \"...It's unusually dark today.\""
1014008-12 = "[ns] \"Wh-Whoa!\""
1014008-14 = "[ns3] \"(It's too dark to see my own feet right now)\"\n[ns4] \"(The streets are essentially empty too)\""
1014008-17 = ""
1014008-18 = "A robber in the area has been lurking in alleys and stealing valuables from people."
1014008-19 = "They'll stalk you into a deserted area... Then ambush you from behind to empty your pockets."
1014008-22 = "[ns] \"I should hurry...\""
1014008-25 = ""
1014008-26 = "[ns] \"(Is someone following me?)\""
1014008-29 = ""
1014008-30 = "[ns5] \"D-Don't hurt me!\"\n[ns6] \"I don't have any money!\""
1014008-33 = "What are you saying?"
1014008-34 = ""
1014008-36 = ""
1014008-37 = "...Did you think I was that robber?"
1014008-38 = "[s7] \"It's you, Kurumi... What a relief.\"\n[s8] \"...Yes. I thought you were the robber.\""
1014008-41 = "I thought I saw you on my way back from the convenience store. Turns out I was right."
1014008-42 = "If you're so scared, why are you walking around alone at night?"
1014008-43 = "I told you, get one of the students to take you home...or even me."
1014008-44 = "[s] \"I know, but it was such a short distance.\""
1014008-45 = "You really lack a sense of awareness, Sensei."
1014008-46 = "Are you still going to say the same thing when someone actually jumps you?"
1014008-47 = "[s9] \"Yes, ma'am. Do you have a flashlight?\"\n[s10] \"I can't see because it's so dark.\""
1014008-50 = "A flashlight? Not right now."
1014008-51 = "Here, I can use my phone's light..."
1014008-52 = ""
1014008-55 = "Ugh, I only have 10% battery left. It won't work."
1014008-56 = "[s] \"What about your Flash Shield?\""
1014008-57 = "That's for popping a blinding flash, not to light someone's way."
1014008-58 = "If I were to use it now, when it's this dark, I'd be considered a public nuisance."
1014008-59 = "[s] \"...I completely agree.\""
1014008-60 = ""
1014008-62 = ""
1014008-63 = ""
1014008-64 = ""
1014008-65 = "Here, grab my hand."
1014008-66 = "I have good night vision. Just follow my lead, and you won't fall or stub your feet."
1014008-67 = "...Is it \"really necessary to hold hands\"?"
1014008-68 = "Wh-Why are YOU making it weird? It's an approved tactical method when traversing places with limited visibility!"
1014008-69 = "D-Don't get the wrong idea, and hold my hand tightly. For tactical purposes."
1014008-73 = "I walked out of the dark alley, still holding Kurumi's hand."
1014008-74 = ""
1014008-75 = "[ns] \"You seem pretty used to situations like this, Kurumi.\""
1014008-76 = "Obviously. Point woman, remember?"
1014008-77 = "I'm used to jumping into dark places and lighting them up, and leading others."
1014008-78 = "I'm used to it...but even I'm not completely comfortable."
1014008-79 = "If I choose the wrong path, and I take them into a trap or dangerous environment..."
1014008-80 = "I could be putting my squad member's lives on the line."
1014008-81 = "Every time I take a new step, I feel a bit of fear and indecision."
1014008-83 = "...Am I leading everyone the right way?"
1014008-84 = "[s11] \"Darkness is always uncertain.\"\n[s12] \"You won't know until you take that step.\""
1014008-87 = ""
1014008-88 = "Exactly. That's what makes me nervous..."
1014008-89 = "[s] \"But we're still holding hands!\""
1014008-90 = "..."
1014008-91 = "[s13] \"If you stumble, Kurumi, I'll pull you up from behind.\"\n[s14] \"That's why squads have backups, right?\""
1014008-94 = "Maybe it's because you've been helping us with so many operations lately, but you sound like a proper special forces soldier, Sensei."
1014008-95 = "That's right. This clasped hand isn't just for leading someone forward."
1014008-96 = "So, Sensei..."
1014008-97 = ""
1014008-99 = ""
1014008-100 = "Don't let go."
1014008-102 = "I held Kurumi's hand until we made our way safely back to Schale."
