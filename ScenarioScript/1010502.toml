[translation]
1010502-1 = "도시락의 행방"
1010502-2 = "(연습하는 마리를 격려하고자, 연습실로 향했다.)"
1010502-8 = "응……? 누가 오셨나요……?"
1010502-9 = "……선생님……?"
1010502-10 = "……?! 서, 선생님!? 어쩐 일로 여기에……."
1010502-11 = "……네?"
1010502-12 = "그냥 격려차 들리셨다고요? 아, 아니! 안 그러셔도 되는데……!"
1010502-13 = "……아, 혹시 보낸 메시지가……!"
1010502-14 = "죄송해요. 괜히 또 발걸음을 하시게 만든 게 아닌지……."
1010502-15 = "그런 거 아니라고요? 그거랑은 별개……? 그, 그러면 다행이지만……."
1010502-16 = "……다른 분들이요? 아, 아뇨. 지금은 저 혼자뿐이에요."
1010502-17 = "아까 전까지는 같이 연습을 하셨지만, 두 분 모두 다른 업무도 바쁘신 분들이라……."
1010502-18 = "저는 오늘 특별한 일정이 없는 날이거든요. 그래서 이왕 시간도 남겠다, 조금 더 연습해 두려고……."
1010502-22 = "아! 걱정하실 필요는 없어요! 연습은 잘 돼 가고 있고, 노래도 안무도 모두 순조로우니까요!"
1010502-23 = "지금 남아서 연습하는 건, 순전히 조금 더 여유 있게 다듬고 싶어서일 뿐인 거라……."
1010502-24 = "그, 그러고 보니 식사는 하셨나요, 선생님? 슬슬 점심시간이네요!"
1010502-25 = "괜찮으시다면, 여기 도시락이라도 같이 드시는 게……."
1010502-26 = "……네?"
1010502-27 = "괜찮으시다고요? 나눠 먹기에는 양이 조금 부족해 보인다고요?"
1010502-28 = "그, 그건 그럴 수도 있지만……."
1010502-29 = "[s1] \"연습 계속하려면 든든히 채워야지.\"\n[s2] \"나는 따로 챙겨 먹으면 되니까.\""
1010502-32 = "으음……. 그렇게 말씀하시니 저도 드릴 말씀이 없네요."
1010502-33 = "그렇지만 아무리 그래도, 선생님께서 안 드시고 계신데 혼자 먹는 건 좀……."
1010502-34 = "역시 선생님 가시고 나면 먹는 게 좋을 지도……."
1010502-35 = "……네?"
1010502-36 = "그, 그럼 지금 가신다고요!? 어, 어째서……!?"
1010502-37 = "[s3] \"마리의 식사에 방해가 될 순 없지.\"\n[s4] \"고민거리를 얹으려고 온 게 아니잖아?\""
1010502-40 = "그, 그런……! 으, 으으……."
1010502-41 = "그, 그런 식으로 어쩔 수 없는 상황을 만드시다니……. 너무하세요……."
1010502-42 = "아, 알겠습니다. 그러면……. 선생님께서는 나중에 꼭 챙겨 드신다는 걸로 믿고……."
1010502-46 = "머, 먼저 먹도록……. 할게요……."
1010502-51 = "[ns5] 주변 물품들을 정리한다.\n[ns6] 일어나서 연습실을 정비한다."
1010502-54 = "……!? 선생님!? 갑자기 왜 주변을 정돈하시는……."
1010502-55 = "다시 연습하기 편하게 정리만 좀 하시는 거라고요? 아, 아니요! 그걸 말씀드리는 게 아니라 어째서 선생님께서……."
1010502-56 = "치우는 건 당연히 제가 해야 하는 것인데……."
1010502-57 = "……네?"
1010502-58 = "격려하러 온 거니, 이 정도는 하게 해 달라고요……?"
1010502-59 = "오히려 밥 먹는데 계속 보고 있으면 부담스러울 수 있다고요? 그, 그건……."
1010502-60 = "무, 물론 말씀대로 부끄러울 수 있을 거 같긴 하지만……."
1010502-61 = "뭔가 도움만 받는 것 같은 느낌이라, 이건 이것대로 몸 둘 바를 모르겠어요."
1010502-62 = "[s7] \"최대한 편하게 생각해.\"\n[s8] \"지금은 연습만 생각하자!\""
1010502-65 = "그렇게 말씀하셔도……."
1010502-66 = "으음……."
1010502-71 = "[ns9] \"……마리?\"\n[ns10] \"자리에서 일어났다?\""
1010502-76 = "……선생님."
1010502-77 = "그렇게 말씀하신다면, 그럼 그 대신 한 가지만……. 저의 고집에 맞춰 주실 수 있으실까요?"
1010502-78 = "말씀대로 이후 연습에만 집중하기 위해……."
1010502-79 = "저의 마음을 편하게 하기 위한, 최소한의 장치라고 생각해 주셨으면 해요."
1010502-80 = "……네. 그런 이유로 충분해요."
1010502-81 = "그러니, 이걸……."
1010502-85 = "[ns11] \"이건……. 계란말이?\"\n[ns12] \"마리가 먹을 계란말이 아냐?\""
1010502-88 = "……아뇨."
1010502-89 = "이건 선생님을 위한 거예요. 하나 정도라면 양에 큰 차이도 없겠지요."
1010502-90 = "선생님께서 아무것도 드시지 않은 채 이렇게 도와만 주시면, 결국 저도 그 생각에서 벗어나기 힘들 거예요."
1010502-91 = "그러니 정말로 제가 이후 편하게 연습하는 걸 도와주려 하신다면……."
1010502-92 = "한 입이라도 좋으니, 제 걸 드셔 주실 수 있을까요?"
1010502-93 = "……아니, 드셔 주세요. 여기서는 저도 조금 더 고집을 부리겠어요."
1010502-94 = "그러니, 자……. 선생님."
1010502-95 = "…………."
1010502-97 = "……아- 해주세요."
1010502-98 = "아아-."
