[translation]
1007605-1 = "그것과 이것은 별개"
1007605-2 = "(코토리의 연락을 받고, 쉬고 있다는 대기실을 찾아갔다.)"
1007605-6 = "(너무 조용한 나머지, 순간 코토리가 없는 곳으로 잘못 찾아온 줄 알았다…….)"
1007605-7 = "아아, 서, 선생님……"
1007605-8 = "여기……. 이쪽이에요……."
1007605-9 = "[s1] \"……코토리?\"\n[s2] 소리가 난 쪽으로 다가간다."
1007605-15 = "생각지도 않은 방법으로……. 이렇게 선생님을 또 뵙게 되는군요……. 하하……."
1007605-16 = "뭐어어어……. 별일이 있었던 건 아니고……."
1007605-17 = "그, 그냥 이렇게……. 좀……. 갑자기 활동량이 많아져서 조금 현기증이……. 헤헤……."
1007605-18 = "…………."
1007605-19 = "……그……."
1007605-20 = "……생각해 보니, 참고로……."
1007605-21 = "……'현기증'……"
1007605-22 = "……이라는 건……. 말이죠……. 그러니까……. 부분적인 지각, 안정성의 혼란……."
1007605-23 = "[s3] \"이 와중에 또 설명……!?\"\n[s4] \"정말 이쪽으론 불굴의 의지구나…….\""
1007605-26 = "하……하하……. 그, 그러게요……."
1007605-27 = "뭔가 습관적이랄까……. 알려 드리지 않으면 안 될 것 같달까……. 그런 게 좀……."
1007605-28 = "방금 건……. 제가 생각해도 좀……. 과했을지도요……."
1007605-32 = "[ns] \"………….\""
1007605-34 = "[ns5] \"……현기증이란, 부분적인 지각이나 안정성의 혼란 현상.\"\n[ns6] \"실제 움직이지 않는데도, 움직인다고 느끼는 일종의 어지러움 증상.\"\n[ns7] \"원인으로는 과호흡 증후군, 스트레스, 빈혈, 저혈당…….\""
1007605-38 = "…………?"
1007605-39 = "어, 어라……. 선생님……? 음……?"
1007605-40 = "뭐죠……? 어째, 제가 하려던 말을 대신해 주시는 느낌이……."
1007605-41 = "[s8] \"그편이 코토리도 편할 것 같아서.\"\n[s9] \"이러면 굳이 고생해서 설명하지 않아도 될까 싶어서.\""
1007605-46 = "……하하……."
1007605-47 = "……과연……."
1007605-48 = "그렇군요. 신기하네요……."
1007605-49 = "이렇게 뭔가……."
1007605-50 = "알고 계신다는 걸 말로서 같이 공유해 주시니, 정말로 마음이 편해지는 것 같기도……."
1007605-51 = "제 마음……. 편하게 해 주시려고 굳이 그렇게 또……."
1007605-52 = "정말……. 상냥하신 분이시네요, 제 마음도 전부 다 읽으시고……."
1007605-53 = "설마 이런 도움까지 받을 거라고는, 상상조차 못했는데 말이에요……."
1007605-54 = "……헤헤."
1007605-55 = "……선생님……."
1007605-56 = "선생님께는 늘 감사를……. 하고 있어요……. 음……."
1007605-57 = "……음……냐……."
1007605-58 = "흠냐……."
1007605-59 = "[ns10] 잠든 코토리의 머리에 수건을 깔아준다.\n[ns11] 코토리를 자기 편한 자세로 받쳐준다."
1007605-64 = "(이후, 잠든 코토리의 곁을 지켜주며 시간을 보냈다.)"
1007605-65 = "(다시 깨어난 코토리는 완전히 활력을 되찾았는지, 평소의 모습대로 돌아갔다.)"
