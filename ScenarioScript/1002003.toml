[translation]
1002003-1 = "무슨 소릴 하는 거야?"
1002003-2 = "(아무래도 신경이 쓰여서 코하루를 찾기 위해 트리니티로 향했다.)"
1002003-3 = "(오래 찾을 것도 없이, 한참 하교 시간이었던 교문에서 코하루를 발견했다.)"
1002003-4 = "……"
1002003-5 = "(다른 학생들이 재잘재잘 떠들며 돌아가는 것과, 달리 코하루는 딱히 말이 없었다.)"
1002003-6 = "[s] \"……코하루?\""
1002003-7 = "……에, 에에!?"
1002003-8 = "서, 선생님……? 어째서 여기에……?"
1002003-9 = "[s1] \"모모톡이 끊겨 있어서\"\n[s2] \"무슨 일인지 걱정이 돼서\""
1002003-10 = "으, 으응!? 아, 아아. 그건……"
1002003-11 = "으, 으응!? 아, 아아. 그건……"
1002003-12 = "그건…… 그…… 별 건 아니고 그냥……"
1002003-13 = "……그냥……요."
1002003-14 = "[s] \"……웬 존댓말?\""
1002003-15 = "아, 아니예요. 아무 것도…… 그냥…… 이전의 일 때문에……"
1002003-16 = "새, 생각해 보니 조금 심했다 싶어서…… 그냥 사과도 할 겸……"
1002003-17 = "그…… 그냥 그것뿐……"
1002003-18 = "……이에요……."
1002003-19 = "[s] \"……?\""
1002003-20 = "……"
1002003-22 = "(그렇게 서 있는 사이에도 다른 학생들은 모두 교문을 빠져나갔다.)"
1002003-23 = "(조금 시간이 지나자, 곧 교문 앞에는 코하루와 둘만 남게 되었다.)"
1002003-25 = "……"
1002003-26 = "……흑……"
1002003-27 = "……흐흑"
1002003-28 = "[s] \"……저, 저기요?!\""
1002003-29 = "……왜……"
1002003-30 = "왜, 왜 굳이 여기까지 찾아온 거야……?"
1002003-31 = "겨우…… 그 메시지 하나 때문에……?"
1002003-32 = "그럴 리가……"
1002003-33 = "그럴 리가 없어!"
1002003-34 = "……역시 다른 '의도'가 있는 거야!"
1002003-35 = "[s] \"코하루 쨩이 원래대로 돌아왔다!?\""
1002003-36 = "그, 그치만…… 메시지에는 별 내용도 없었잖아……?"
1002003-37 = "걱정이 돼서 왔다는 거…… 진짜야? 정말일까? 정말 그것뿐일까?"
1002003-38 = "……아니."
1002003-39 = "그럴 리가 없어…… 어쩌면 다른 뜻이…… 있는 걸지도……"
1002003-40 = "맞아. 그럴 거야…… 이런 때에는 꼭…… 이런 전개에는 항상 그 뒤에……"
1002003-41 = "이렇게 뭔가 몽글몽글한 분위기로 만든 다음 으슥한 공간에……."
1002003-42 = "가령 저 비어 있는 체육 창고 같은데로 데려간 다음……."
1002003-43 = "……흐아아!?"
1002003-44 = "[s] \"……예?\""
1002003-45 = "역시 그런 거지? 그렇겠지……?"
1002003-46 = "이런 때엔 당연히……"
1002003-47 = "반드시…… 그런 전개!?"
1002003-48 = "역시 처음부터 그런 걸 노리고……!?"
1002003-49 = "[s3] \"아니. 오해야…… 절대로 오해입니다……\"\n[s4] \"그것도 책에서 읽은 거야……?\""
1002003-50 = "정말이지…… 방심할 수 없는 사람……!!"
1002003-51 = "정말이지…… 방심할 수 없는 사람……!!"
1002003-52 = "선생님의 모든 수법을 파악하고 있는 이 나여서 망정이지, 아니었다면……."
1002003-53 = "아, 아니. 어쩌면…… 오히려 그래서 나한테……!?"
1002003-54 = "그렇군. 역시 그런 거였어……"
1002003-55 = "[s] \"저기요, 여보세요…….? 코하루 씨?\""
1002003-56 = "전부 이해했어……"
1002003-57 = "그렇다면 이건 '정의실현부'로서 내게 내려진 사명……."
1002003-58 = "내가 선생님의 마수로부터 다른 학생들을 지키지 않으면 안되는 거였어……!"
1002003-59 = "응……! 이것이야 말로…… 나만이 할 수 있는 나의 사명……!"
1002003-60 = "나, 나는……! 나는……! 으흑흑…… 이 어려운 사명을 위해……."
1002003-61 = "[s5] \"듣고 계신가요~? 코하루 씨~?\"\n[s6] 코하루의 어깨를 손으로 톡톡 두드린다."
1002003-62 = "……힉!!!"
1002003-63 = "……힉!!!"
