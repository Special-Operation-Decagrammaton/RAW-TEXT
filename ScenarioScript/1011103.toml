[translation]
1011103-1 = "느긋한 휴일"
1011103-4 = "어, 일찍 왔네, 선생. 아직 약속 시간 전인데."
1011103-5 = "응? 나도 일찍 왔다고?"
1011103-6 = "크하핫! 그게 말이지, 요 며칠 교복 입는 데 살짝 재미를 붙였달까?"
1011103-7 = "기왕 이렇게 된 거, 스카잔 없이 지내는 날들을 좀 더 즐겨볼까~ 해서!"
1011103-8 = "그래서 그런가 나도 모르게 서둘렀지 뭐야."
1011103-9 = "[s] \"그래서, 오늘은 특별한 하루를 보내고 싶다고?\""
1011103-11 = "[ns] \"갑자기 무슨 바람이 불어서?\""
1011103-12 = "그렇게 물어볼 줄 알았어."
1011103-13 = "봐봐, 나 지금 교복 차림이라고?"
1011103-14 = "지금의 나는 C&C의 부장도 아니고, 옆에 눈여겨봐야 할 부원들도 없단 말씀."
1011103-15 = "완전 평범한 학생 A잖아?"
1011103-16 = "이런 날이야말로, 나 자신한테 충실한 하루를 보낼 수 있지 않겠어?"
1011103-17 = "평소에도 관심이 있었지만, 입장 때문에 못 해본 일들이 많으니까."
1011103-18 = "……응? 선생? 왜 그렇게 봐?"
1011103-19 = "[s1] \"그런 것도 생각하고 있었구나.\"\n[s2] \"네루는 의외로 속이 깊구나.\""
1011103-20 = "아앙? 그거야 당연하지."
1011103-21 = "가, 갑자기 그런 말을 해도 나오는 건 없어, 선생!"
1011103-22 = "어쨌든, 지금의 나밖에 할 수 없는 일들!"
1011103-23 = "그걸, 이번 기회에 해 본다! 라는 결론."
1011103-24 = "그리고 이런 날은 선생이랑 보내면 재밌지 않을까 싶어서 말야."
1011103-25 = "어때? 멋지지? 얼른 가보자고!"
1011103-31 = "어서오세요! 퀸 버거 밀레니엄 점입니다~!"
1011103-33 = "[ns] \"여긴…… 패스트푸드점?\""
1011103-34 = "아, 뭐 그렇지."
1011103-35 = "평소 부원 녀석들이랑 자주 오는 곳. 여기 맛있어."
1011103-36 = "[s] \"그럼 평소랑 다를 바가 없지 않아?\""
1011103-37 = "아니아니, 오늘은 메뉴가 달라."
1011103-38 = "자, 일단 주문하자고. 선생 먼저 해."
1011103-39 = "[s] \"난 치즈버거 세트.\""
1011103-40 = "나는 그럼……."
1011103-41 = "어린이 세트 B로!"
1011103-42 = "[s] \"어린이…… 세트?\""
1011103-43 = "왜? 말했잖아! 오늘은 내 맘대로 할 거라고!"
1011103-44 = "자! 얼른 주문!"
1011103-46 = "자, 이쪽이 선생이 시킨 치즈버거 세트."
1011103-47 = "내 어린이 세트는 이쪽."
1011103-48 = "[s] \"하고 싶다는 게, 어린이세트 주문하기였어?\""
1011103-49 = "다른 녀석들이랑 왔을 때 주문하면 분명 꼬맹이 같다거나 귀엽다거나, 그런 말을 들을 게 뻔하단 말이지."
1011103-50 = "게다가 C&C의 부장이 어린이세트를 먹고 있다는 사실이 알려지면 어떻게 되겠어?"
1011103-51 = "다른 녀석들이 뭐라고 하는지는 신경 안 쓰지만, 일단 폼이 안 나잖아, 폼이."
1011103-52 = "[s] \"……그래서 벼르고만 있었던 거야?\""
1011103-53 = "뭐 그렇지."
1011103-54 = "그리고 이건 그냥 어린이세트가 아냐. 잘 보라고."
1011103-55 = "무려 이 세트에는 이걸 껴 준단 말이지!"
1011103-61 = "[ns] \"……장난감 로봇?\""
1011103-62 = "봐봐, 그냥 단순한 장난감이 아니라니까. 내가 괜히 노리고 있던 게 아니야!"
1011103-63 = "이쪽 관절을 이렇게 돌리고, 여기를 이렇게 끼우면, 로봇이……."
1011103-68 = "변신해."
1011103-69 = "[ns] \"……!\""
1011103-70 = "어때, 멋지지? 선생도 눈이 빛나는데?"
1011103-71 = "하하핫! 하지만 안 되지, 안 돼. 어린이 세트는 내가 시켰으니까 이건 내 거야!"
1011103-72 = "선생도 갖고 싶으면 따로 주문하라고."
1011103-78 = "아~ 배도 부르고, 다음으로 넘어갈까나!"
1011103-79 = "이쪽 길로 가면 공원이 나오는데, 거기서 잠깐 걷자구."
1011103-80 = "오늘은 날도 좋으니까 말야."
1011103-81 = "앙? 그건 평소에도 할 수 있는 일 아니냐고?"
1011103-82 = "크핫! 그래도 조금 다르단 말이지. 일단 가서 설명해 줄게."
1011103-84 = "응, 오늘도 좋은 느낌으로 비어 있구만."
1011103-85 = "이쪽으로 가면 산책로가 나오고, 반대편엔 작은 연못이 있어."
1011103-86 = "뭐, 가보지는 않았지만."
1011103-87 = "[s] \"안 가본 것 치고는 잘 알고 있는데?\""
1011103-88 = "아아, 그게 말이지, 여긴 C&C 부실이랑 가까운 공원이걸랑."
1011103-89 = "동선이 겹치는 경우가 많아서, 출동하거나 복귀할 때는 늘 여길 가로지르거든."
1011103-90 = "지나가기만 했지, 여유롭게 둘러본 적은 한 번도 없어서 말야."
1011103-91 = "지나칠 때마다 꽤 잘 꾸며놓은 것 같아서, 언젠가는 느긋하게 산책이나 해야지, 하고 생각했는데…… 그럴 기회가 없어서."
1011103-92 = "오늘 같은 때가 아니면 또 언제 해 보겠어?"
1011103-93 = "어울려 줄 거지, 선생?"
1011103-94 = "[s] \"물론이지.\""
1011103-95 = "좋구만! 선생도 지쳤을 테니, 같이 힐링하자고!"
1011103-97 = "이야, 이거 기분 좋네! 이 공원이 이렇게 넓은 줄은 또 몰랐구만!"
1011103-101 = "앗? 선생, 여기 연못에 물고기 좀 봐봐!"
1011103-102 = "완전 큰데?! 크하핫! 뭘 먹고 이렇게 큰 거야?"
1011103-103 = "[s] \"난간에 매달리면 위험해, 네루.\""
1011103-104 = "괜찮아, 괜찮아!"
1011103-105 = "조금 매달린다고 무너지지는 않을 거 아냐?"
1011103-106 = "그 정도로 약한—"
1011103-110 = "흐갹?!"
1011103-115 = "[ns] \"자, 잡았다……!\""
1011103-119 = "노, 놀랐잖아……."
1011103-120 = "[s] \"그러게 조심하라니까.\""
1011103-121 = "나, 나도 진짜로 난간이 흔들릴 줄은 몰랐지!"
1011103-122 = "……."
1011103-123 = "그런데 선생, 언제까지 잡고 있을 생각이야?"
1011103-124 = "나, 이제 괜찮은데……."
1011103-125 = "[s] \"앗, 미안!\""
1011103-126 = "……."
1011103-127 = "서, 선생도 참! 걱정이 많다니까!"
1011103-128 = "좀 놀랐어도, 빠지진 않았을 거라고?!"
1011103-129 = "뭐어, 잡아준 건 고맙지만……."
1011103-130 = "에이, 모르겠다! 자, 자, 저쪽 벤치에 좀 앉자고!"
1011103-133 = "벤치에 앉아서 그저 풍경을 바라보는 것…… 나른하구만. 나쁘지 않아."
1011103-134 = "한가로운 휴일 그 자체랄까."
1011103-135 = "선생은 어때? 지루하진 않아?"
1011103-136 = "[s3] \"네루와 함께라면 뭘 하든 즐거워.\"\n[s4] \"응, 이런 여유도 필요한 법이지.\""
1011103-137 = "그, 그래?"
1011103-138 = "……크핫! 선생도 참, 입 발린 말을 잘 한단 말이지."
1011103-139 = "앙? 진심이라고?"
1011103-140 = "뭐, 나도 선생이랑 있는 건 즐겁지만……."
1011103-141 = "그치, 그치?"
1011103-142 = "역시 선생도 좋아할 줄 알았어."
1011103-143 = "흐아아암."
1011103-144 = "으음, 햇살도 좋고, 장소도, 좋아서…… 좀 졸릴지도……."
1011103-150 = "(꾸벅꾸벅)"
1011103-151 = "[ns] 네루에게 어깨를 내준다."
1011103-152 = "음냐…… 따뜻하구만……."
1011103-154 = "(그렇게 시간이 지나고…….)"
1011103-161 = "[ns] \"……네루.\""
1011103-162 = "……."
1011103-163 = "[ns] \"슬슬 일어나지 않으면 밤에 잠 못 잘지도 몰라.\""
1011103-164 = "……으응?"
1011103-169 = "우앗?!"
1011103-170 = "나, 잠들었던 거야?!"
1011103-171 = "어, 어느새…… 심지어 몇 시간이나 잤다고?"
1011103-172 = "[s] \"피곤은 좀 풀렸어?\""
1011103-173 = "아…… 뭐, 그런 셈이려나."
1011103-174 = "잠깐만, 그럼 선생, 나 때문에 자리에서 일어나지도 못하고 있었던 거야?"
1011103-175 = "말을 하지 그랬어! 나도 이 정도로 신세 질 생각은 없었는데……."
1011103-176 = "이상하게 편하고 따뜻해서 나도 모르게……!"
1011103-177 = "[s] \"그래도 잘 쉬었으면 됐지.\""
1011103-178 = "으, 으음…… 그래도 뭔가 미안한데."
1011103-179 = "좋아, 그럼 이제부턴 선생이 내 어깨에 기대 자! 얼마든지 내줄 테니까!"
1011103-180 = "……라고 하기엔 시간이 늦었나……."
1011103-181 = "[s] \"신경 쓰지 마.\""
1011103-183 = "[ns] \"그보다 오늘 하고 싶은 일, 또 있어?\""
1011103-184 = "아니, 오늘은 이걸로 만족!"
1011103-185 = "오늘은 엄청 여유롭고 즐거운 휴일을 보낸 느낌이거든."
1011103-186 = "뭐어, 이것도 선생 덕분이려나."
1011103-191 = "고맙다구, 선생. 특별한 하루를 같이 보내 줘서."
