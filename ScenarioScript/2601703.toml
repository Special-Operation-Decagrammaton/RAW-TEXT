[translation]
2601703-1 = "#title;라나와 콜로서스 "
2601703-2 = "#na;(연락이 끊어진 라나가 걱정되어 급히 183호로 왔다.)"
2601703-3 = "#na;(아무 일도 없어야 할 텐데…….)"
2601703-5 = "#place;183호 특별반"
2601703-6 = "4;라나;00\n#4;a\n#4;greeting\n#wait;1300"
2601703-7 = "4;라나;05\n#4;m3\n#4;em;[...]\n#wait;2500"
2601703-8 = "4;라나;99;……."
2601703-9 = "4;라나;99;으음……."
2601703-10 = "[ns1] \"다행이다…… 아무 일 없어서.\"\n[ns2] \"라나야-! 선생님 왔단다!\""
2601703-13 = "4;라나;02\n#4;em;[!]\n#wait;1300"
2601703-14 = "4;라나;01;아, 선생님."
2601703-15 = "4;라나;02;혹시 심심하시다면, 거기 수레에 실려 있는 디젤 엔진을 끌고 와 주실 수 있으십니까."
2601703-16 = "4;라나;02;무거우니, 발을 다치지 않게 조심하시기 바랍니다."
2601703-17 = "[s] \"어, 으응……!\""
2601703-19 = "#na;(라나는 계속해서 작은 건물만 한 기계를 만들었다.)"
2601703-20 = "#na;(거들어주면서, 방해가 될까 봐 무얼 만드는지 묻지 않았다.)"
2601703-22 = "3;라나;02;선생님, 저 부품이 필요합니다만.\n#3;em;[반응]\n#3;a"
2601703-23 = "3;라나;01;괜찮다면 목마를 태워주실 수 있으실까요. 손이 닿지 않는 높은 곳에 부품이 있습니다."
2601703-24 = "[s] \"물론이지!\""
2601703-25 = "3;라나;03;감사합니다.\n#3;em;[음표]"
2601703-31 = "3;라나;05;음……!\n#3;a\n#3;em;[...]"
2601703-32 = "3;라나;02;이 정도면 된 것 같습니다. 선생님 덕분에 오늘 내로 완성했습니다."
2601703-33 = "3;라나;03;선생님과 함께 있으면, 모든 일이 잘됩니다. 감사합니다."
2601703-34 = "3;라나;01;이제 시동을 걸어야 합니다만, 총소리에 놀라지 마십시오."
2601703-35 = "[s3] \"시동……?\"\n[s4] \"총소리……?\""
2601703-38 = "#st;[0,0];instant;1;"
2601703-40 = "3;라나;01\n#3;greeting\n#wait;1300"
2601703-44 = "3;라나;02\n#3;a"
2601703-45 = "3;라나;02;오오…….\n#3;em;[반짝]"
2601703-46 = "3;라나;03;살아 움직이는군요. 다행입니다."
2601703-47 = "[s] \"총으로 시동을 걸었던 거니?\""
2601703-48 = "3;라나;02;네. 코프만 스타터입니다. 쎄루모다가 없어서 화약의 압력으로 엔진을 돌려 시동을 걸었습니다. 다행히 잘 작동하는군요."
2601703-49 = "3;라나;99;이것은 제게는 커다란 기계지만, 붉은겨울에게도 커다란 도약이 되겠군요.\n#3;em;[한숨]"
2601703-50 = "[s] \"대단해! 멋있어! 장하다, 우리 라나!\""
2601703-51 = "#st;[0,0];instant;1;"
2601703-54 = "[ns] \"……그래서 이게…… 무슨 기계니?\" "
2601703-55 = "3;라나;02;아, 그렇군요. 대단한 물건은 아닙니다만……. 이건…….\n#3;em;[...]"
2601703-56 = "#st;[0,0];instant;1;"
2601703-58 = "3;라나;01\n#3;greeting\n#wait;1300"
2601703-60 = "3;라나;02;핸드폰 충전기입니다."
2601703-61 = "3;라나;01;원래 쓰던 충전기가 느렸는데 얼마 전에 고장까지 나버렸기에 이참에 고속 충전되는 것으로 만들었습니다."
2601703-62 = "[s] \"충전기인데 엄청나게 크구나…….\""
2601703-63 = "3;라나;03;진공관으로 만들었더니 이렇게 됐습니다. 따듯해서 보통의 충전기보다 훨씬 좋습니다.\n#3;em;[음표]"
2601703-64 = "3;라나;11;선생님도 필요하시면 같이 충전하시겠습니까. 포트도 제대로 4개 만들어서, 모두 사용할 수 있습니다."
2601703-65 = "#st;[0,0];instant;1;"
2601703-67 = "3;라나;02\n#3;em;[반응]\n#wait;1300"
2601703-68 = "3;라나;01;그러고 보니, 열중하느라 잠시 잊고 있었습니다."
2601703-69 = "3;라나;99;안녕하십니까, 선생님. 후루하타 라나입니다.\n#3;greeting"
2601703-70 = "3;라나;16;마침 이렇게 뵙게 된다니. 신기한 우연입니다. 이런 일도 다 있군요."
2601703-71 = "[s5] \"마침이라기엔 라나를 보려고 온 거지만…….\"\n[s6] \"걱정할 일 아니었으니 다행이다!\" "
2601703-74 = "3;라나;02;걱정…… 말씀이십니까.\n#3;em;[...]"
2601703-75 = "3;라나;12;무슨 일이 있었는지는 모르겠습니다만, 선생님께서 기뻐 보이셔서 다행입니다."
2601703-77 = "#na;(이후, 라나와 함께 시간을 보냈다.)"
2601703-78 = "#na;(충전기는 야외의 눈이 녹을 정도로 뜨거웠다.)"
