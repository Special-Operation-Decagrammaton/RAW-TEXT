[translation]
10038030-1 = "제3화;어른과 아이, 아이, 아이."
10038030-3 = "평소에는 그렇게 학생들이 많이 지나다니는 공원이었는데……."
10038030-4 = "지금은 거의 아무도 없네요. 황량하게 느껴질 지경이에요."
10038030-5 = "경극을 연습하곤 했던 경극부 부원들의 모습도 보이지 않고, 탕후루나 망고 와플을 먹으며 이야기하는 학생들의 모습도……."
10038030-6 = "……."
10038030-10 = "아, 하지만 저기 노점은 남아 있네요! 선생님, 우리도 뭔가 먹어요. 저, 에그타르트 먹고 싶어요!"
10038030-14 = "키키도요! 다 먹고 나면 양치질도 열심히 할게요!"
10038030-15 = "[s] \"어…… 응. 그래…….\""
10038030-17 = "감사합니다!"
10038030-20 = "선생님, 선생님! 그거 아세요? 여기 도원향에서도, 빤지(班戟)를 팔기 시작했대요!"
10038030-21 = "전통을 해친다며 3학년…… 언니…… 들은 잘 먹으려 하지 않지만."
10038030-22 = "그래도 한번 먹어 보면 반드시 다시 찾게 된다는 거 있죠!"
10038030-23 = "빤지(班戟)라는 게 뭔가요? 키키, 잘 모르겠어요."
10038030-24 = "훗. 훗. 후……. 빤지(班戟)는 말이죠……!"
10038030-29 = "얇은 피 안에 생크림과 과일을 듬뿍 넣고 차갑게 굳힌 과일 크림 케이크예요!"
10038030-30 = "가장 유명한 것은 망고이지만…… 녹차, 초콜릿, 딸기 등, 어울리는 건 뭐든 넣을 수 있죠!"
10038030-32 = "세상에, 그런 멋진 음식이 있었다니……!"
10038030-33 = "선생님! 키키도 꼭 먹어 보고 싶어요!"
10038030-34 = "[s] \"하지만 조금 전에 에그타르트를 먹지 않았니……?\""
10038030-43 = "제발요~ 네에~?"
10038030-44 = "맛이 진한 녹차와 함께 먹는다면, 정말로 맛있을 거예요!"
10038030-45 = "과일과 크림의 녹진한 맛을 녹차가 잡아 주고, 그렇게 깨끗해진 입에 다시 빤지(班戟)를 넣는다면……."
10038030-47 = "정말 안 되나요~? 정말요~?"
10038030-51 = "[ns] \"그래, 그래…….\""
10038030-55 = "와아! 감사합니다!"
10038030-56 = "키키는 선생님이 제일 좋아요!"
10038030-60 = "어라? 왜 그러세요? 마시던 물을 순간 뿜을 뻔하셨네요!"
10038030-61 = "안 돼요. 선생님. 어른이시잖아요. 공공장소에서는 예절을 지켜야죠. 키키도 그 정도는 알고 있다구요!"
10038030-62 = "[s] \"그…… 래…….\""
10038030-67 = "너무 먹기만 했으니까, 산책이라도 하면서 소화를 시켜야겠어요!"
10038030-68 = "키키도 좋은 생각이라고 생각해요! 여긴 언제 와도 마음이 편안해지네요!"
10038030-69 = "운이 좋다면 판다를 만날 수도 있을 텐데요……. 아, 저기 있네요!"
10038030-75 = "어……. 그렇지만 조금, 위험하지 않을까요? 판다도 결국 곰인데……."
10038030-76 = "괜찮아요! 여기 아이들은 사람에게 익숙해진 것을 넘어, 사람을 좋아하거든요!"
10038030-80 = "이쪽에 사는 아이들은 조릿대를 특히 좋아하니까, 이걸 이렇게 따서 건네주면……!"
10038030-85 = "뿌우우?"
10038030-89 = "삐에에!"
10038030-90 = "보세요! 먹고 있어요!"
10038030-91 = "아, 부러워요! 키키도 할래요. 키키도 할래요!"
10038030-92 = "[s] \"그렇다고 해서 너무 가까이 가지는 말고…….\""
10038030-94 = "네~에!"
10038030-98 = "다녀왔습니다~!"
10038030-99 = "후아…… 엄청난 하루였어요. 키키, 만족했어요!"
10038030-100 = "정말요? 다행이에요!"
10038030-101 = "선생님은 어떠셨나요?"
10038030-102 = "[s] \"학생들이 만족했다면야…….\""
10038030-103 = "저희는 학생들이라기보다는 매화원 원생인데요?"
10038030-104 = "[s] \"아이들이 만족했다면야…….\""
10038030-105 = "그런데 표정이 왜 그러세요? 뭔가 해탈한 듯, 모든 것을 내려놓은 듯……?"
10038030-106 = "아무것도 아니라고요? 신경 쓰지 않아도 된다고요? 음…… 그런가요……."
10038030-114 = "아, 선생님! 매화원에 어서 오세요. 오늘 매화원 아이들과 놀아 주셨다면서요? 고생 많으셨어요."
10038030-118 = "어라? 너, 한동안 안 보이던 그 애잖아? 그리고 그 옆에는……?"
10038030-123 = "이, 이번에 전학 온 키키라고 해요! 슌 언니에게 부탁받았어요!"
10038030-127 = "안녕하세요, 코코나 교관님! 키키라고 해요. 잘 부탁드립니다!"
10038030-132 = "……!"
10038030-133 = "그, 그럼! 보셨죠, 선생님? 전 이렇게 어엿한 교관이라구요!"
10038030-143 = "어, 어어? 갑자기 왜 흐뭇한 시선으로 바라보시는 거예요? 거기에 머리를 쓰다듬기까지……?!"
10038030-144 = "네? 세상이 그래도 정상적으로 돌아가는 증거를, 여기에 와서야 비로소 발견한 것 같다고요? 그게 대체 무슨 말이세요……?"
10038030-149 = "저, 저희는 슌 언니를 찾아서 먼저 가 볼게요! 이쪽이에요!"
10038030-153 = "키키도 같이 가요~!"
10038030-158 = "자, 잠깐! 슌 언니는……!"
10038030-162 = "으우, 오늘은 언니가 어디로 갔는지 안 보이던데……."
10038030-163 = "[s] \"슌은…… 내가 어떻게든 찾아볼게…….\""
10038030-164 = "선생님이요? 그렇게 해 주시면 저야 편하…… 아니, 감사하지만……."
10038030-165 = "네? 이번만큼은 선생님이 해야 하는 일이라고요? 오늘따라 뜻 모를 말씀을 많이 하시네요……."
10038030-170 = "그러면 부탁드릴게요. 저는 다른 원생들을 돌봐 줘야 해서요."
10038030-171 = "뭘요! 저는 어엿한 매화원의 교관이니까요! 이 정도는 당연하죠. 엣헴!"
10038030-174 = "후아. 큰일은 나지 않겠지만 그래도 하마터면 큰일 날 뻔했어요. 코코나 쨩은 묘한 부분에서 감이 좋으니까요……."
10038030-175 = "음……."
10038030-176 = "후우. 그래도 산해경을 암행하겠다는 소기의 목적은 달성한 것 같구나. 모두들 고생 많았다."
10038030-177 = "……만족스러우셨나요. 문주님?"
10038030-178 = "으음. 무엇이라고 해야 할까……."
10038030-183 = "키사키……?"
10038030-191 = "!!??"
10038030-192 = "아, 안녕하세요! 저는 키키라고 해요. 오늘 전학 와서 모르는 분이 많아요. 누구신가요?"
10038030-196 = "……."
10038030-197 = "……."
10038030-198 = "키사키 너…… 뭐 하고 있는 거야……?"
10038030-199 = "그, 그러니까 저는, 키키, 라고……."
10038030-200 = "아니, 그건 무리지. 여러 가지 의미로."
10038030-201 = "……."
10038030-202 = "후우. 역시 그대의 눈은 속일 수 없는가."
10038030-203 = "……설명을 요구해도 될까. 키사키, 선생님?"
10038030-204 = "[s] \"우선은…… 자리를 옮기자. 응.\""
10038030-210 = "……좋아. 주위에 아무도 없는 것도 확인했고, 웬만해서는 목소리도 들리지 않을 거야."
10038030-211 = "누가 지나가면서 우리를 본다고 해도, 매화원 원생들이 선생님과 함께 공원에 나와 있다고 생각하겠지."
10038030-212 = "그러니까 솔직하게 털어놓으라고, 키사키. 뭐 하고 있는 거야?"
10038030-214 = "무얼. 그리 대단한 것은 아니다."
10038030-215 = "그저…… 암행에 최적화된 복장을 선택했을 뿐이지."
10038030-216 = "아…… 암행인가. 그래. 그렇군……."
10038030-217 = "뭐, 네가 종종 암행을 다닌다는 것 정도는 나도 알고 있으니 말이야."
10038030-218 = "그게 반드시 그 '키키'여야 했는지는 아직도 잘 납득이 안 되지만……."
10038030-219 = "으, 으음. 모름지기 암행 복장에는 시기와 상황, 그리고 주위의 사정이라는 것이 고려되어야 하는 것이니……."
10038030-220 = "뭐, 됐어. 네가 그렇다면 그런 거겠지. 그, 왜. 예전에는 현무상회 부원으로 변장해서 상회에 들어왔던 적도 있었잖아?"
10038030-221 = "후후. 기억나는구나. 나름대로 감쪽같았지. 처음에는 잘 풀리는가 싶었다만."
10038030-222 = "하지만 너, 너무 요리가 서툴렀다고! 그래서야 금방 들통날 수밖에. 하하하!"
10038030-223 = "그나마 알아차린 게 나였으니 망정이지, 다른 애들한테 들켰으면 거의 정치 문제로 올라갈 사건이었다고?"
10038030-224 = "그 빚은 갚은 것으로 기억한다만."
10038030-225 = "그래, 그래. 그냥 예전 생각이 나서 말이지."
10038030-226 = "그러고 보니, 정작 무슨 일로 매화원에 와 있었던 것인가?"
10038030-227 = "나? 뭐…… 월영제가 지금 열릴지 어떨지 애매하게 됐잖아? 그래서 남은 월병을 매화원 아이들에게 나누어 줄까 해서."
10038030-228 = "너도 좀 먹을래? 몇 개 남았거든."
10038030-229 = "월병인가……. 그립구나. 감사히 먹도록 하지."
10038030-230 = "선생님도 어때? 현무상회의 월병은, 나름 특산품이라고?"
10038030-231 = "[s] \"그러면 사양하지 않고…….\""
10038030-239 = "(월병을 베어 물자, 고소하고 풍부한 맛이 입안에 퍼졌다.)"
10038030-241 = "(우리는 당분간 아무 말도 없이, 조용히 간식을 나누었다…….)"
10038030-244 = "……예전 일이 생각나는구나. 우리가 만든 첫 월병을 나누어 먹었을 때 말이다."
10038030-245 = "윽, 그거 아직도 기억하고 있는 거야……?"
10038030-246 = "계란 노른자와 호두, 팥소가 들어간 월병이었지."
10038030-247 = "좀, 지나간 일은 지나간 일답게 잊어버리라고……."
10038030-248 = "워낙 강렬했어야 말이지. 팥소에서는 살짝 탄 맛이 났고, 계란 노른자는 익다 말았으며, 호두는 산산이 부서져 씹는 맛이 나지 않았으니."
10038030-249 = "월병을 틀에 찍은 것은 키사키, 너였잖아."
10038030-250 = "그래. 그래서 여기저기 부서지기도 했고, 모양이 찌그러지기도 했었다."
10038030-251 = "참으로, 월병이라고 부르기도 뭣한, 그런 물건이었지……."
10038030-252 = "뭐, 첫술에 배부를 수 있을 리가. 다 그런 거지."
10038030-253 = "그래. 분명히 그러하다. 그렇지만."
10038030-254 = "아무리 시간이 지나도, 그 월병만은 생생하게 기억나는구나."
10038030-255 = "……나도 아마 그즈음부터 요리사를 목표로 하게 되었던 것 같은데."
10038030-256 = "원하는 모습이 되었는가?"
10038030-257 = "잘 모르겠어. 그럭저럭 그런 것 같기도 하고. 키사키는 어때?"
10038030-258 = "나 말인가……. 모르겠구나. 그대도 알고 있겠지만, 나는 한 번도 내 뜻으로 문주가 되고자 한 적은 없었다."
10038030-259 = "……."
10038030-260 = "그래도, 너 정도면 잘 해내고 있는 것 아닐까."
10038030-261 = "현무상회를 통제해 준 덕분에, 거리 전체가 경영난에 빠져들기 시작했지만 말이야……."
10038030-266 = "……미안하다. 할 말이 없구나."
10038030-267 = "아니아니, 그렇게까지 진지하게 사과해 달라는 건 아니었다고?"
10038030-268 = "다들 영업자금은 어느 정도 비축해 두고 있었고, 현룡문의 조치도 어쩔 수 없는 부분이 있었다고 생각하고. 무엇보다, 보라고."
10038030-269 = "상회장이 이런 모습이 되어 버렸으니, 부원 애들도 할 말이 없지 않겠어?"
10038030-270 = "……그렇다고는 해도, 나중에 애들 달래려면 좀 고생할 것 같긴 하지만 말이야."
10038030-271 = "고생이 많구나."
10038030-272 = "너만 하겠니. 초심을 잃지 않으면, 어떻게든 되는 법이니까."
10038030-273 = "초심이라……."
10038030-274 = "왜 그래?"
10038030-275 = "아니, 그대에게는 확실히 그런 것이 있겠지. 그래."
10038030-276 = "그렇지만 나에게는 있을지 어떨지, 스스로도 자신이 없구나."
10038030-277 = "너……."
10038030-278 = "[s] \"그렇지만, 뭐. 그건 그것대로 괜찮지 않을까?\""
10038030-282 = "……무슨 의미인가, 선생?"
10038030-283 = "[s1] \"그게, 초심이란 건 보통, 잃어버렸을 때 문제가 생기는 건데.\"\n[s2] \"애초에 그런 게 없었다면, 잃어버릴 걱정도 없는 걸 거 아냐.\""
10038030-286 = "없는 것을 잃어버릴 수는 없다……?"
10038030-287 = "후후……. 과연, 그러한가. 없는 것을 망치기는 확실히 어려운 일이지. 새로운 관점이었다. 선생."
10038030-288 = "그런 선생이 보기에, 나의 처신은 어떻게 보이는가?"
10038030-289 = "[s] \"……키사키가 최선을 다하고 있다는 건, 나도 잘 알고 있어.\""
10038030-290 = "……그런가."
10038030-291 = "하지만 최선만을 다하는 것은, 때때로 그렇게까지 큰 쓸모가 없을 경우가 있지."
10038030-293 = "아, 그거 현무상회에서도 가끔 하는 말이기는 한데."
10038030-294 = "'열심히 볶기만 하면 뭐 하니. 잘 볶아야지.'"
10038030-295 = "그래. 그런 식이지. 마치 연단방에서 많은 노력과 수고를 들이곤 하지만, 그 결과가 언제나 최선이지는 않은 것처럼."
10038030-296 = "사야를 너무 놀리지 말라고."
10038030-297 = "특별히 사야의 이야기를 하고 있는 것은 아니다만? 또 다른 문제가 예전에는 있었지……."
10038030-302 = "(가만, 연단방이라……?)"
10038030-305 = "……그렇습니다. 소문의…… 무거움에 비해 동요는 그렇게까지 크지 않습니다만, 이런 소문이 퍼지고 있다는 사실 자체가……."
10038030-308 = "(지금 연단방의 수뇌는 부재중…….)"
