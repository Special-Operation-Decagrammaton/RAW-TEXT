[translation]
1010105-1 = "둘만의 뒤풀이"
1010105-2 = "(사오리의 연락을 받고, DJ 공연을 관람했다.)"
1010105-6 = "신나게 놀아버렸네! 아직도 어깨가 들썩들썩한걸."
1010105-7 = "DJ가 신참이라고 해서 좀 걱정했는데, 그럴 필요 없었어!"
1010105-8 = "맞아. 땀까지 뻘뻘 흘려가며 디제잉을 하는데, 그 열정까지 느껴지더라고."
1010105-13 = "[ns1] (사오리, 엄청 열심히 했지……)\n[ns2] (관객들에게도 전해졌구나.)"
1010105-22 = "[ns] \"사오리.\""
1010105-26 = "……음?"
1010105-27 = "앗, 선생. 와주었던 건가. 고맙다."
1010105-28 = "공연은 어땠나?"
1010105-29 = "[s3] \"완전 신났어.\"\n[s4] \"끝내주던걸.\""
1010105-32 = "그, 그 정도였나……"
1010105-33 = "즐겨준 것 같아 고맙군."
1010105-34 = "부족한 점이 많은 공연이었다만, 듣는 사람이 즐거웠다면 다행이다."
1010105-35 = "제대로 할 수 있을지 걱정했는데, 선생의 말을 들으니 한시름 놓을 수 있겠군."
1010105-38 = "[ns] \"그런데 왜 무대에 혼자 있어? 다른 스태프들은?\""
1010105-39 = "아, 다른 관계자들은 다 같이 저녁을 먹으러 갔다. 공연 뒤풀이라더군."
1010105-40 = "나한테도 권유하긴 했는데, 내가 거절했다."
1010105-41 = "기재를 미리 정리해 두지 않으면 안 되고, 또…… 번잡한 분위기는 선호하지 않으니."
1010105-42 = "그냥 혼자서—"
1010105-46 = "콜록!"
1010105-47 = "[s] \"왜 그래?\""
1010105-48 = "크흠, 괜찮다."
1010105-49 = "그냥 입안이 말라서 그런 거다. 신경 쓰지 않아도……."
1010105-53 = "응? 이건…… 음료수? 마침 갖고 있던 거라고?"
1010105-54 = "고맙다. 선생에게는 신세만 지는 것 같군."
1010105-55 = "[s] \"신경 쓰지 마.\""
1010105-60 = "그럼, 잠깐 앉을까. 선생도 이쪽으로 와라."
1010105-67 = "[wa:1090]― [log=사오리 수영복]종연 후의 객석은, [wa:2240]쓸쓸한 것이군. [/log]"
1010105-68 = "[wa:2630]― [log=사오리 수영복]그 많던 관객은 빠지고, [wa:1970]조명은 모두 꺼지고……[wa:80] [/log]"
1010105-71 = "[wa:1380]― [log=사오리 수영복]화려한 무대는 [wa:1700]흔적도 없이, [wa:1520]정적에 잠겨 있다.[/log]"
1010105-74 = "― [log=사오리 수영복]열기와 함성으로 가득했던 공간이 [wa:2200]갑자기 조용해지니……[/log]"
1010105-75 = "[wa:2330]― [log=사오리 수영복]어딘가, [wa:1570]애틋한 느낌마저 든다.[/log]"
1010105-78 = "[wa:670]― [log=사오리 수영복]……[wa:940]그래도 [wa:2010]지금은 [wa:1300]괜찮다.[/log]"
1010105-81 = "[wa:1340]― [log=사오리 수영복]변한 것은 아무것도 없지만, [wa:2180]평온하게 있을 수 있다.[/log]"
1010105-84 = "[wa:790]― [log=사오리 수영복]……[wa:2020]선생님이 옆에 있으니까, [wa:2600]일지도 모르겠군.[/log]"
1010105-87 = "음료수 고맙다, 선생. 덕분에 기운이 났어."
1010105-88 = "[s] \"겨우 음료수 한 캔으로?\""
1010105-89 = "그 이상의 음식은 딱히 필요하지……."
1010105-94 = "……상정 외의 사태다."
1010105-95 = "아무래도 공연하느라 체력을 많이 쓴 것 같군."
1010105-96 = "[s5] \"그럼 우리도 뒤풀이하러 갈까?\"\n[s6] \"번잡하지 않게, 둘이서만.\""
1010105-101 = "선생이 그렇게 말한다면 어쩔 수 없군."
1010105-106 = "따라가겠다."
