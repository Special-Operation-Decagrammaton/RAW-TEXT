[translation]
2000006-1 = "만약 꿈을 꾼다면, 당신과의 하루를."
2000006-2 = "밀레니엄 엔지니어부"
2000006-3 = "수면은 중요하지."
2000006-4 = "사실 나야 누울 수만 있다면 관이라도 상관없다고 생각하지만……."
2000006-5 = "불면은 괴로운 일인 모양이야."
2000006-6 = "내 주변에도 그것 때문에 힘들어하는 사람이 많으니까."
2000006-7 = "응? 나…… 다크서클이 심해진 것 같다고?"
2000006-8 = "아니…… 나는 그냥 철야를 너무 해서."
2000006-9 = "……"
2000006-10 = "…… 너, 너무 뻔히 보진 말아줘."
2000006-11 = "어쨌든 잠을 못 자는 이들에게, 밤은 괴로운 시간일 거야."
2000006-12 = "그래서 일단 두 개 정도의 시제품을 준비했어."
2000006-13 = "첫 번째의 이름은……"
2000006-14 = "기절 머신."
2000006-15 = "[s1] \"이름에서부터 뭔가 심각한 오류가 발견된 것 같은데?\"\n[s2] \"헤에. 베개인가?\""
2000006-16 = "그렇지 않아."
2000006-17 = "일단은 침구류의 형태를 하고 있지."
2000006-18 = "사람마다 차이는 있겠지만……"
2000006-19 = "사람은 하루의, 아니 인생의 1/3을 침대에서 보낸다고 해."
2000006-20 = "그렇기 때문에 침구류에 투자하는 건, 인생의 1/3을 윤택하게 보낼 수 있게 해주는 선택일거야."
2000006-21 = "일단 이 베게 형태의 기계에 누워볼래?"
2000006-22 = "응? 숙면을 하고 싶을 뿐, 기절하고 싶진 않다고?"
2000006-23 = "음. 나도 인체공학에는 좀 자신은 없지만."
2000006-24 = "때로는 기절 후에, 마치 오래 자고 일어난 것처럼 개운하다는 경험담을 들어본 적 있지 않아?"
2000006-25 = "응? 어쨌든 기절은 안 좋은 거라고?"
2000006-26 = "흐음. 그럴지도."
2000006-27 = "그렇지 않아도, 이건 프로토타입일 뿐."
2000006-28 = "훨씬 더 선생님을 만족시킬 수 있는…… 다른 작품도 있으니까."
2000006-29 = "이름하여……"
2000006-30 = "'실신 전용 쇠파이프'라는 건데……."
2000006-35 = "앗. 왜 멀어지는 거야."
2000006-36 = "선생님은 또 오해를 하고 있는 모양이네."
2000006-37 = "다소 아날로그적이지만…… #n이 실신 전용 쇠파이프의 효과는 검증되어 있어."
2000006-38 = "[s] \"자칫하면 영원히 잠들 것 같아.\""
2000006-39 = "아. 오해하지 마. 이걸로 선생님의 후두부를 후려치는……"
2000006-40 = "그런 아날로그 함이 아니니까."
2000006-41 = "이 쇠파이프에는……"
2000006-42 = "내가 가장 좋아하는 기능이 달려 있어."
2000006-43 = "[s3] \"자폭……?\"\n[s4] \"살상……?\""
2000006-44 = "블루투스 기능이야."
2000006-45 = "블루투스 기능이야."
2000006-46 = "이 쇠파이프는 듣기만 해도 잠이 오는 물리학 강의 10선이나……."
2000006-47 = "약 200곡 정도의 수면 유도 음악을 취향에 따라 출력할 수 있어."
2000006-48 = "[s5] \"한 번 해볼까?\"\n[s6] \"이런 거로 잠이 들리 없잖아?\""
2000006-49 = "정말이지?"
2000006-50 = "정말이지?"
2000006-51 = "그럼, 선생님. #n일단 간단한 침구류를 준비했으니."
2000006-52 = "한 번 누워볼래?"
2000006-54 = "좋아. 그럼. 음악을 켜볼께."
2000006-55 = "실신 쇠파이프…… 작동!"
2000006-61 = "……."
2000006-62 = "……후훗. #n선생님, 많이 피곤했던 모양이네."
2000006-63 = "소리가 나오자마자 의식을 잃었어."
2000006-64 = "이번 작업물도…… 덕분에 좋은 평가를 얻을 수 있을 것 같아."
2000006-65 = "그리고……"
2000006-66 = "……후훗."
2000006-67 = "자는 모습, 귀여웠어."
