[translation]
34160-1 = "제16화;지하 회랑"
34160-2 = "아리우스 분교 구교사"
34160-4 = "이쪽이야."
34160-5 = "[s] \"여기가 아리우스 분교의 옛 건물이구나…….\""
34160-6 = "안쪽으로 들어와 본 건 처음이에요……."
34160-7 = "그렇지. 여기는 폐허…… 아니, 유적에 가까운 곳이니까."
34160-8 = "옛날엔 여기서 아리우스 학생들이 공부를 했던 걸까요……. 어떤 것들을 배웠던 걸까요……."
34160-9 = "나도 잘 모르겠어. 그걸 기억하고 있는 사람은 남아 있지 않겠지."
34160-10 = "자, 서두르자. 회랑은 지하에 있어."
34160-12 = "구교사 지하 회랑"
34160-13 = "차, 찾았어요! 이쪽인 것 같아요!"
34160-14 = "그렇군."
34160-15 = "……. 잠깐만."
34160-19 = "리더의 말대로 이게 바실리카까지 일직선으로 이어져 있는 통로라면…… 이 지형은 위험해."
34160-20 = "복병이라면 나도 생각해봤어. 오히려 일직선이라면……."
34160-21 = "아니, 미소노 미카 이야기야."
34160-22 = "내가 그녀였다면 어떻게 했을까…… 생각해봤어."
34160-23 = "그녀에게 가장 큰 장애물은 바로 선생님의 존재겠지. 다치게 하고 싶지도 않고, 선생님의 지휘도 거슬릴 테니까."
34160-25 = "그렇다면 분명……."
34160-29 = "쿠쿠쿠쿠쿠쿠쿠쿠쿠쿠쿵-!!"
34160-30 = "이 진동은……."
34160-31 = "어, 어어……? 조, 조심하세요! 선생님! 뒤예요! 기둥이 무너지고 있어요!!"
34160-32 = "[ns1] \"………!!\"\n[ns2] 쓰러지는 기둥을 피해 앞으로 달린다."
34160-38 = "콰아아아아앙-!!"
34160-40 = "큭, 괜찮아? 선생님?"
34160-41 = "[s] \"응. 생각보다 피할만했달까…….\""
34160-42 = "다, 다행이에요…… 그런데 갑자기 기둥이 무너지다니…… 대체……."
34160-46 = "아, 아앗!? 리, 리더는요?"
34160-47 = "리더? 어디야?"
34160-48 = "……여기야. 무너진 기둥 반대쪽에 있어."
34160-49 = "잔해 때문에 보이지 않아. 다치진 않았어?"
34160-50 = "아아. 괜찮아."
34160-51 = "자, 잠깐만 기다려주세요, 리더! 기둥들을 치워볼 테니……."
34160-56 = "아, 아앗! 아직 안 끝났어요? 더 무너진다아아?"
34160-60 = "……콜록, 콜록."
34160-61 = "틀렸어. 이래선 완전히 막혀버렸네."
34160-62 = "와, 완전히 망했어요?! 리더는요? 괜찮은 거예요?"
34160-63 = "리더? 들려? 돌아가는 길은 막히지 않았어? 중간에서 합류하는 지점을 찾아야 할 것 같은데."
34160-66 = "……. 아니. 그건 힘들 것 같아."
34160-70 = "……살았어. 선생님이 휘말릴까 봐 위력을 낮췄지만 그래도 조마조마했거든."
34160-75 = "……."
34160-80 = "뭐, 그래도 조마에 사오리. 네가 당첨이라서 다행이야."
34160-82 = "다음화;대결"
