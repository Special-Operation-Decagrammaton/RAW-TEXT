[translation]
10036045-4 = "크악!"
10036045-5 = "그, 그만! 우리가 졌어!"
10036045-10 = "학습은 비교적 빠른 편이군."
10036045-11 = "그래서, 야끼소바가 얼마라고 했지?"
10036045-13 = "히익! 치, 칠천……아니! 공짜로 드리겠습니다!"
10036045-15 = "아니, 그럴 순 없다."
10036045-20 = "이건……?"
10036045-21 = "돈이다. 홀에 앉아 있는 녀석들에게 야끼소바 세 그릇과 빙수 하나, 그리고 옥수수와 아이스크림을 갖다줘."
10036045-22 = "내가 주문했다는 말은 하지 말고."
10036045-23 = "도, 돈을 지불하겠다는 말씀이신가요……?"
10036045-24 = "틀림없이 공짜로 내놓으라고 할 줄……."
10036045-25 = "정당한 대가를 지불하지 않으면 아까의 네 녀석들과 같아질 뿐이다."
10036045-26 = "……!"
10036045-27 = "……네, 주문, 확실히 받았습니다!"
10036045-31 = "[ns9] \"사오리, 돈은 내가 낼게.\"\n[ns10] \"사오리, 결제는 내 카드로 하는 게…….\""
10036045-34 = "아니, 괜찮다, 선생. 정중히 사양하지."
10036045-35 = "선생에게는 이미 여러 번 신세를 졌고, 무엇보다……."
10036045-36 = "아이들에게, 내가 번 돈으로 맛있는 걸 먹여주고 싶다."
10036045-37 = "[s] (사오리……천사인가?)"
10036045-38 = "자, 이제 아이들이 먹는 모습을 보러 가도록 하자."
10036045-41 = "자, 여기 음식 나왔습니다!"
10036045-42 = "야끼소바 세 그릇과 빙수, 옥수수, 아이스크림입니다!"
10036045-48 = "어라? 우리가 주문한 건 야끼소바 한 그릇인데요?"
10036045-49 = "……설마 바가지도 모자라 강매까지 하는 거야?"
10036045-50 = "히익…… 역시 걱정이 현실로……!"
10036045-52 = "아, 아닙니다!"
10036045-53 = "이건 그러니까…… 그, 그렇지! 이벤트에 당첨되셨습니다!"
10036045-54 = "축하합니다! 아까 지불하신 7000엔도 돌려드립니다!"
10036045-58 = "야! 빨리 와서 거들어!"
10036045-64 = "추, 축하드립니다!"
10036045-69 = "뭔가 수상한데…… 무슨 꿍꿍이를……."
10036045-70 = "우아아앙! 고마워요!"
10036045-71 = "늘 불행한 일만 가득이었는데! 살다 보니 이런 날도 오는 거네요!"
10036045-72 = "영문은 모르겠지만, 그래도 이왕 이렇게 된 거 받아들이는 편이 좋겠지?"
10036045-73 = "히요리, 음식 식겠어. 얼른 먹자."
10036045-74 = "네……! 이것이 야끼소바……!"
10036045-79 = "맛있어요!"
10036045-81 = "천상의 맛…… 까지는 아니지만, 먹을 만하네."
10036045-82 = "우리가 이렇게 행복해도 되는 걸까요! 안 되겠죠! 역시 행복해진 만큼 반동이 오고 마는 거겠죠!"
10036045-84 = "……."
10036045-85 = "[s] \"사오리, 뿌듯해 보이네.\""
10036045-86 = "내가 번 돈으로 아이들에게 무언가 사주는 건 이번이 처음이다."
10036045-87 = "좋아하는 모습을 보니…… 나도 기쁘군."
10036045-88 = "[s] \"그럼 사오리도 점심을 먹어야지.\""
10036045-92 = "이건…… 야끼소바?"
10036045-93 = "어느새?"
10036045-94 = "[s] \"실수로 두 그릇이나 시켜 버렸는데, 괜찮으면 하나 먹어 줄래?\""
10036045-95 = "……그런가. 선생도 뿌듯해 보이는군."
10036045-96 = "그럼 고맙게 받도록 하지, 선생."
