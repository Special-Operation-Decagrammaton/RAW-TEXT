[translation]
80000021-1 = "특별한 에너지 드링크"
80000021-2 = "(샬레의 업무와 관련된 일로 하레에게 도움을 요청하기 위해 베리타스의 동아리실을 찾았다.)"
80000021-3 = "(하레가 일을 시작한 지 5시간쯤 지났을 무렵…….)"
80000021-5 = "베리타스 해커 휴게실"
80000021-8 = "불법 무기를 판매 중인 불량 학생들의 거래 기록을 추적해 보니, 이 근처의 노드를 사용하고 있는 것 같은데……."
80000021-9 = "응? 갑자기 왜 그래, 선생님?"
80000021-10 = "뭔가…… 엄청 피곤해 보이는 표정인데."
80000021-11 = "[s] \"미안. 갑자기 피로가 몰려와서…….\""
80000021-12 = "……아, 그러고 보니 벌써 시간이 이렇게 되었나."
80000021-13 = "낮과 밤이 뒤바뀐 해커라서 선생님은 원래 이 시간에 잠든다는 걸 신경 쓰지 못했어. 미안."
80000021-14 = "[s] \"괜찮아. 신경 쓰지 마.\""
80000021-18 = "[ns] \"잠을 깨는 데 도움이 되는 음료는 없을까?\""
80000021-19 = "잠을 깨는 데 도움이 되는 음료? 커피는 지금 다 떨어졌는데……."
80000021-23 = "아, 그러고 보니 그게 있었구나."
80000021-30 = "자, 하나 받아. 선생님. <요괴 MAX>야."
80000021-31 = "카페인이 잔뜩 농축된 에너지 드링크니, 이거 한 캔이면 바로 잠이 달아날 거야."
80000021-32 = "[s] \"전에 봤던 것과는 조금 디자인이 다르네.\""
80000021-33 = "응. 이건 이번 발렌타인 시즌을 기념해서 출시된 초코맛 <요괴 MAX>거든."
80000021-34 = "한정판이라 구하기 힘들어서 조금 아껴 두고 있었지만……."
80000021-35 = "선생님에게 주는 거라면 조금도 아깝지 않으니까. 마시고 싶어지면 언제든 말만 해."
80000021-41 = "(하레가 건넨 초코맛 <요괴 MAX>는 유난히 끔찍한 맛이었지만, 잠은 확실히 달아났다…….)"
