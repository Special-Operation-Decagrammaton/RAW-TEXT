[translation]
10005010-1 = "제1화;스마-트하게"
10005010-2 = "(2일 전 브리핑 상황.)"
10005010-5 = "37시간 전, 1학년의 '쿠로사키 코유키'……. 그러니까 코드네임 <백토>가 반성실을 탈출했어."
10005010-6 = "확인했을 땐 이미 세미나의 감시망을 완전히 빠져나간 뒤였지."
10005010-7 = "어머나……. 또 그 아이인가요?"
10005010-8 = "정말 잊을 만하면 한 번씩 존재감을 어필하는 친구네요."
10005010-9 = "이번에는 또 무슨 사고를 친 건가요? 본인 성적 조작? 다른 학생들 학적부 초기화? 아니면……."
10005010-10 = "……무단 채권 발행."
10005010-11 = "그것도 세미나의 이름으로 말이지. 지금도 계속해서 찍어내는 중이고……"
10005010-12 = "계산대로라면 사흘 내에 확실히 파산이야. 이대로라면 말이지."
10005010-16 = "……이제 감이 좀 와? 지금이 어떤 상황인지?"
10005010-17 = "……오……."
10005010-18 = "이번 건……. 좀 굉장한 걸요……."
10005010-19 = "[s1] \"……백토?\"\n[s2] \"쿠로사키 코유키?\""
10005010-20 = "……어라."
10005010-21 = "……어라."
10005010-22 = "죄송해요. 그러고 보니 선생님께선 처음 들으시는 이름일 수도 있겠네요. 소개해드리죠."
10005010-25 = "쿠로사키 코유키. 코드네임인 <백토>는 이미 그 아이의 체포 작전으로 몇 번이나 사용된 이름이에요."
10005010-26 = "전 세미나 소속이었던……. 밀레니엄의 문제아이자 세미나의 골칫덩이인 아이죠."
10005010-27 = "가는 곳마다 문제를 일으키고 다니는……. 걸어 다니는 혼란이랄까. 살아있는 변수랄까."
10005010-30 = "……네? 어떻게 그런 일들이 가능하냐고요?"
10005010-31 = "그건……."
10005010-32 = "재능이 있거든요. 꽤 특이한 재능이죠."
10005010-33 = "특정 부분의 계산에 있어 믿을 수 없을 만큼 빠른 연산 능력……."
10005010-34 = "하필이면 그 연산능력이라는 게, 특정 암호체계를 무의미하게 만들어버리는 쪽이라서요."
10005010-35 = "말하자면 밀레니엄 내에 사용되는 디지털 암호의 대부분을, 암산으로 풀어버릴 수 있다는 이야기죠."
10005010-36 = "암호를 바꿔도 의미가 없어요. 암호를 아는 게 아니라, 암호를 푸는 법을 아는 것이니까요."
10005010-37 = "정말 굉장한 재능이죠? 밀레니엄 최고의 컴퓨터도 그 정도로 빠르게 해독하진 못한다고요."
10005010-38 = "하아……. 사실 세미나에 데려온 것도 그 능력을 보고 데려왔던 건데……."
10005010-39 = "이렇게까지 통제할 수 없는 말썽꾸러기인 줄은 몰랐다……. 라는 이야기죠. 후훗."
10005010-40 = "'말썽꾸러기'라고 표현할 만큼 귀여운 사안들이 아니라고."
10005010-41 = "정말이지. 세미나 출신만 아니었어도 진즉 교정국에 넣어버렸을걸."
10005010-42 = "이젠 학원 내 기밀사항도 꽤 많이 알고 있어서 그것조차도 못 할 상황이라 그렇지……."
10005010-43 = "……아무튼 그래서, 이번에도 늘 그렇듯이……."
10005010-44 = "네. 이번에도 저희 C&C가 그 일을 맡게 됐다. 그런 이야기지요?"
10005010-45 = "정말 '어쩔 수 없이'말이지."
10005010-46 = "무엇보다 이번 일에는, 우리도 오토마타나 드론을 쓸 수 없으니까."
10005010-47 = "……어라? 그러고 보니 궁금하군요. 그건 어째서죠?"
10005010-48 = "백토의 전투 능력은 잘 봐줘도 중학생 수준이잖아요? 드론으로 제압하지 못할 이유가 있나요?"
10005010-49 = "으음. 그게……."
10005010-50 = "탈출한 백토가 향한 곳이 애초에 오토마타들을 보낼 수가 없는 곳이거든."
10005010-51 = "밀레니엄 자치구나 D.U.가 아닌, 다른 학교의 자치구 안이라서……."
10005010-52 = "[s3] \"다른 학교의 자치구?\"\n[s4] \"밀레니엄이 아니라고?\""
10005010-53 = "네. 도망친 곳은 <오디세이아 해양학원>라고 하는, 여러 대의 배들로 이루어진 학교로."
10005010-54 = "네. 도망친 곳은 <오디세이아 해양학원>라고 하는, 여러 대의 배들로 이루어진 학교로."
10005010-55 = "그중에서도 크루즈선의 하나인 <골든 플리스>호 라는 배예요."
10005010-56 = "사실 오디세이아 측과는 자주 밀레니엄과 교류도 하는 곳이라, 직접 학교 측에도 좀 부탁해 보긴 했는데……."
10005010-57 = "듣자 하니 골든 플리스호는 학교 측에서도 반쯤 방치하고 있는 선박인 것 같더라고요."
10005010-58 = "학생회의 말도 안 듣고, 배에서 뭘 하는지 말도 안 해주고, 예산도 스스로 번다고……."
10005010-59 = "저런……. 문제아가 문제 선박에 숨어든 상황이네요."
10005010-60 = "채권까지 발행해 가면서……. 무슨 일을 하는 걸까요? 쿠데타라도 준비하는 걸까요?"
10005010-61 = "사실 그게 제일 걱정이야. 만에 하나 나쁜 사람들과 큰 범죄라도 준비하고 있는 거라면……."
10005010-62 = "그리고 그 자금이 모두 세미나의 이름으로 발행된 채권으로 인한 거라면……!"
10005010-63 = "으으……. 생각만 해도 머리가 터질 것 같아!"
10005010-64 = "하지만 아무리 방치된 배라고는 해도, 골든 플리스호는 우리 학교 배가 아니잖아?"
10005010-65 = "다른 학교의 자치구인 배 위에 드론이나 오토마타를 보낼 수는 없어. 그건 규정 위반이야."
10005010-66 = "아하. 그래서……."
10005010-67 = "후훗. 그야말로 '에이전트'들이 필요한 순간이군요."
10005010-68 = "……'은밀한' 에이전트가 필요하지."
10005010-69 = "아하하하……."
10005010-70 = "알겠지? 여기까지 이야기했으니, 이젠 정말로 사태의 심각성을 알았을 거라 생각해."
10005010-71 = "진짜 큰일이니까. 이번만큼은 내가 수습해 줄 수도 없는 일이니까!"
10005010-72 = "이번 일에 한해서는 콜사인도 쓰지 말고, 최대한 평범한 사람처럼……."
10005010-73 = "아무튼 최대한 신속하게, 동시에 들키지 않게. '들키지 않게'가 무엇보다 중요해!"
10005010-74 = "명심해. 거긴 우리 학교가 아니라고! 조용하게! 아무도 모르게……!"
10005010-75 = "……스마트하게!"
10005010-77 = "……스마트하게……라."
10005010-78 = "[s5] \"……그럼 이제부터 뭘 하면 돼?\"\n[s6] \"구체적인 작전 내용은 있어?\""
10005010-79 = "후훗. 그러잖아도 그 부분에 대해서 말씀드리려고 했답니다."
10005010-80 = "후훗. 그러잖아도 그 부분에 대해서 말씀드리려고 했답니다."
10005010-81 = "우선 작전을 시작하기 전에 거점을 만들어야겠죠."
10005010-82 = "객실이 있는 층으로 올라가 빈방을 하나 확보하고 그곳을 임시 거점으로 삼을 거예요."
10005010-83 = "다음으로는 시스템실로 향해서, 감시 시스템들을 무력화시키고 백토의 위치를 찾아낸 뒤에……."
10005010-84 = "뭐야? 거기 누구야?"
10005010-85 = "……!?"
10005010-86 = "……!!"
10005010-87 = "……?"
10005010-94 = "당신들 뭐지? 여긴 기관실이라고. 여기서 뭐 하고 있는 거야?"
10005010-95 = "……앙? 이건 또 뭐야?"
10005010-96 = "옷은 또 왜 그런 꼴이지? 대체 뭐 하는 녀석이냐?"
10005010-97 = "……? 그게 무슨……?"
10005010-98 = "잠깐. 그쪽이야말로 복장도 허가된 복장이 아닌 거 같은데?"
10005010-99 = "승객들 교복도 아니고 가드 복장도 아니고……."
10005010-100 = "……뭐지? 메이드복? 그런 게 허가돼 있었나?"
10005010-101 = "수상한 녀석들이군. 아무래도 조사에 협조해 줘야겠어."
10005010-102 = "이 봐! 다들 여기로 와 봐! 여기 이상한 녀석들이……."
10005010-103 = "……!!"
10005010-113 = "……으헉!?"
10005010-118 = "……아."
10005010-119 = "어라……. 빠르기도 하시지."
10005010-120 = "세미나 회계가 그렇게나 '은밀성'을 강조했던 것 같은데."
10005010-121 = "아하하! '들키지 않게'는 벌써 끝!"
10005010-122 = "아, 아니. 이건……. 그……."
10005010-123 = "선생! 이건 그러니까……!"
10005010-124 = "[s7] \"이번 건 어쩔 수 없었다고 봐.\"\n[s8] \"세이프……겠지?\""
10005010-125 = "그, 그런가? 그렇지?"
10005010-126 = "그, 그런가? 그렇지?"
10005010-127 = "그, 역시 그렇겠지?"
10005010-128 = "아하하하!"
10005010-129 = "역시, 아무리 그래도 이건 세이프지. 하하하!"
10005010-130 = "응? 무슨 소리 안 났어?"
10005010-131 = "침입자다! 침입자가 있는 것 같다!"
10005010-136 = "……."
10005010-137 = "……."
10005010-143 = "……아웃이네!!"
