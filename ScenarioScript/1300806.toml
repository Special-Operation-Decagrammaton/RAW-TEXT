[translation]
1300806-1 = "뒤늦은 깨달음"
1300806-2 = "(세리카와 밤 늦게까지 길거리 청소를 했다.)"
1300806-4 = "하아…… 오늘도 지쳤어……."
1300806-5 = "[s1] \"고생했어.\"\n[s2] \"오늘은 꽤 하드했지.\""
1300806-6 = "맞아. 쓰레기통이 쏟아졌을 땐 정말 난감했다고."
1300806-7 = "맞아. 쓰레기통이 쏟아졌을 땐 정말 난감했다고."
1300806-8 = "음……."
1300806-12 = "(매일 이렇게 선생님이랑 아르바이트하는 거…….)"
1300806-13 = "(이, 이래도 괜찮은 걸까?)"
1300806-14 = "(아니, 그러니까…… 같이 있어서 즐거워! 즐거운데……)"
1300806-15 = "(오늘처럼 쓰레기나 줍고 낙엽 쓸고 이러다가 하루가 끝나는 건 좀…….)"
1300806-17 = "(좀 더…… 다른 일을 해야 하는 거…… 아닐까?! 조, 조금 더 뭐랄까…….)"
1300806-18 = "(데, 데이트……라던가.)"
1300806-20 = "……."
1300806-21 = "바보!! 멍청이!"
1300806-22 = "[s3] \"……응?\"\n[s4] \"……이유는 모르겠지만 죄송합니다.\""
1300806-23 = "바, 바보 선생님! 갈거야!"
1300806-24 = "바, 바보 선생님! 갈거야!"
1300806-26 = "(이유는 모르지만 혼나고 말았다.)"
