[translation]
34040-1 = "제4화;꿈과 신기루 사이에서"
34040-3 = "[ns] \"키보토스가 멸망하는 광경……?\""
34040-4 = "……."
34040-5 = "네. 그렇습니다."
34040-6 = "멸망이라고 해야 할지……. 결과적으로 그렇게 되는 것인지…… 그것은 모르겠지만……."
34040-7 = "[s] \"어떤 광경이었길래……?\""
34040-9 = "……하늘에서 거대한 탑이 도래하고, 하늘은 붉게 변합니다."
34040-12 = "그 불길한 탑은……마치 비명처럼…… 이 세계를 조금씩 깎아나가고, 붕괴시키고…… 불길한 다른 무언가들로 이 세계를 덧씌웁니다."
34040-13 = "찢어진 세계의 조각들이 폭풍처럼 휘몰아치는 가운데 검은빛이 내려오고……. 파멸이 이어지고 또 이어져……."
34040-15 = "마침내…… 키보토스의 모든 것이 멸망합니다."
34040-16 = "먼지 하나 남기지 않고. 모든 것들이."
34040-18 = "[ns] \"………….\""
34040-19 = "제가 본 것이 단순한 악몽인지, 아니면 정말로 미래를 예지한 것인지, 혹은 과거에 있었던 일을 보여줄 뿐인 것인지……"
34040-20 = "지금으로선 어떤 것도 확신할 수 없지만……. 그것을 목격한 이상…… 저는…… 그 꿈이 의미하는 진실을 알아내야만 했습니다."
34040-21 = "……."
34040-22 = "그 꿈이 무엇인지 알아내기 위해 저는 끝없는 자각몽 속을 헤매고 다녔습니다."
34040-23 = "하지만 자각몽은 현실과 꿈, 미래와 과거를 이리저리 뒤섞어버리기 때문에……."
34040-24 = "이제 꿈과 현실을 구분하지 못하는 지경에 이른 것 같네요……."
34040-25 = "[s] \"엄청 위험하게 들리는데…… 괜찮은 거야?\""
34040-26 = "……. 네. 아마도, 위험할지도 모르겠네요."
34040-27 = "저는 예전에 미래를 보는 것을 두려워해서 도망쳤었습니다. 하지만 이번에는 그럴 수 없었어요."
34040-28 = "그 멸망의 광경…… 그것이 진짜 미래인지, 아니면 그저 단순한 악몽인지…… 스스로 확인하지 않으면 안 된다고 생각해서……."
34040-29 = "그 파멸은…… 원래 키보토스의 것이 아닙니다. 키보토스의 외부에서부터 도래한 것……."
34040-30 = "여기서부터는 저의 추측이지만…… 아마도, 그 원인은……. <게마트리아>……."
34040-31 = "선생님도 알고 계신, 바로 그 정체불명의 집단이 아닐까……하고 추측하고 있습니다."
34040-32 = "[s] \"……게마트리아가?\""
34040-40 = "어쩌면 그 파멸을 막을 수 있는 방법이 있을지도 모르기에 저는……."
34040-41 = "[ns] \"세이아.\""
34040-42 = "……네?"
34040-43 = "[s1] \"그쪽과 관계된 것이라면, 당장 그만두는 것이 좋아.\"\n[s2] \"지금 너는 혼자서 너무 위험한 행동을 하고 있어.\""
34040-44 = "……."
34040-45 = "……."
34040-46 = "네, 그러네요. 그런 불가해한 존재들의 뒤를 쫓는 건…… 진짜로 위험한 행동일지도……."
34040-47 = "[s3] \"그게 진짜든 아니든 지금 이런 방식은 안 돼.\"\n[s4] \"제대로 정보를 모으고, 모두 함께 머리를 맞대고 함께 헤쳐 나가야 하는 거야.\""
34040-50 = "……."
34040-51 = "[s] \"지금은 더 중요한 일이 눈앞에 있잖아.\""
34040-55 = "……미카."
34040-56 = "네…… 선생님의 말이 맞습니다……."
34040-57 = "아직 어떤 정보도 없는 상태에서…… 저는 그 꿈의 장면에 압도되어 균형을 지키지 못하고 있었던 것 같네요……."
34040-61 = "지금에 와서 제 신변에 무슨 일이 벌어지기라도 한다면…… 미카…… 그러네요. 그 아이가 잘못되어 버리겠죠."
34040-62 = "……그렇습니다."
34040-63 = "지금 미카의 상황은 최악 중의 최악……."
34040-64 = "……그 아이는 언제나 어리광을 부리면서 살아왔습니다. 모두가 그녀를 떠받들고, 우러러보는 가운데 동화 속 공주님처럼 살아왔죠."
34040-65 = "그런 그녀가 지금처럼 온 세상의 증오의 대상이 된 것은…… 아마도 태어나 처음 경험하는 상황……."
34040-66 = "그녀가 감당하기에는 너무 가혹한 것일지도 모르겠네요……."
34040-67 = "……네. 맞습니다. 지금은 미카를 그 수렁에서 구하는 것이 가장 시급한 일이에요."
34040-68 = "어째서 저는 그걸 깨닫지 못하고……."
34040-69 = "안개가 걷히는 느낌이네요……. 감사드립니다. 선생님. 제대로 미카의 문제부터 해결해야 합니다."
34040-70 = "[s] \"잘 생각했어, 세이아. 미카는 너에게 사과하고 싶어 했어.\""
34040-71 = "네……? 저는 그녀를 이미 용서했습니다만……."
34040-72 = "……아아, 그건 꿈속이었던가요."
34040-73 = "그렇군요…… 아직 미카는 저에게 용서받지 못했다고 생각하고 있겠네요."
34040-74 = "자신이 저지른 행동…… 그 가장 큰 피해자가 저라고 생각하고 있을 테니까요."
34040-77 = "바보 같은 미카……."
34040-78 = "제멋대로에다가, 별로 생각도 없고, 충동적이고, 욕심도 많은 주제에 자기 파괴적이기나 한 당신은……"
34040-79 = "그저 동화 속의 건방지고 오만한 악역 영애 정도가 딱 맞는 역할이었을 텐데……."
34040-80 = "하필이면……."
34040-82 = "자기 마음에 들지 않는 아이를 괴롭혀주려고 했던 악당 소녀는……"
34040-83 = "결국 동화가 아닌, 살인과 죽음이 벌어지는 악몽 같은 이야기에 떨어져 버렸다는 결말."
34040-87 = "하지만…… 그런 그녀에게도 구원이 있다면……."
34040-88 = "저는 죽지 않았고, 그녀는 살인자가 아니었다는 것."
34040-89 = "미카가 지금 이 지옥 같은 상황을 견뎌낼 수 있는 건…… 바로 그 사실 때문이겠죠."
34040-90 = "그렇게 저의 안위는 미카에게 중요한 의미가 되어 있을 거예요."
34040-91 = "미카……."
34040-92 = "저는 그녀에게 친절하지 못했는데…… 그녀는 저 때문에 그렇게나……."
34040-93 = "……네. 그러네요."
34040-94 = "유치원생도 아니고…… 저도, 미카도 미안하다는 말 한마디를 건네지 못하고 미적거리고 있다니…… 부끄러울 따름입니다."
34040-95 = "지금 바로 미카를 여기로 불러와달라고 요청하겠습니다."
34040-96 = "그녀와 제대로 된 대화를 하고…… 그리고 내일 청문회에는 저도 동참하겠습니다."
34040-97 = "미카의 죄목 중 가장 무거운 게 바로 저에게 상해를 가했던 것이었으니, 그 당사자인 제가 함께한다면 더욱 큰 의미가 되겠죠."
34040-102 = "부, 부르셨나요? 세이아 님?"
34040-103 = "미안하지만 미카를 만나고 싶어서요. 여기로 데려와 주실 수 있을까요?"
34040-104 = "미, 미카 님을요? 아, 알겠습니다. 나기사 님께 확인을 받아보겠습니다!"
34040-105 = "네. 고마워요. 음…… 가급적 미카와 단둘이 이야기하고 싶다고 전해주세요. 아무래도 좀 부끄러운 내용이라……."
34040-106 = "아, 알겠습니다! 지금 곧 확인해 보겠습니다!"
34040-111 = "[ns] \"그럼 알겠어. 나도 나기사에게 가서 이 소식을 전할게.\""
34040-112 = "……오랜만에 너무 많은 이야기를 나눴네요."
34040-113 = "네. 그럼 저는 조금 지쳐서……. 조금만 누워있어야 할 것 같습니다."
34040-114 = "……죄송합니다. 선생님. 잠시 실례하겠습니다……."
34040-115 = "[s] \"알겠어. 그럼 내일 청문회에서 봐. 세이아.\""
34040-116 = "……네. 그럼. 조심히 돌아가시길."
34040-118 = "(나기사에게 내일 청문회에 미카와 세이아 모두 다 참가하게 되었다는 사실을 전했다.)"
34040-119 = "(기뻐하는 나기사의 감사 인사를 받으며, 내일 있을 청문회를 위해 일찍 샬레로 돌아가기로 했다.)"
34040-124 = "……. 그럼 다음 의제로 넘어가겠습니다."
34040-125 = "그렇다!"
34040-126 = "이견은 없다만, 그 전에 확인하고 싶은 것이 있군."
34040-130 = "(…….)"
34040-131 = "(이런…… 미카를 기다리며 잠깐 쉰다는 게…… 잠들어 버렸나요.)"
34040-132 = "(또다시 자각몽 속인가요……. 최근에 몸이 더 안 좋아진 탓인지…… 꿈에서 깨는 게 점점 더 힘들어지고 있어서…….)"
34040-133 = "(하지만…… 여기는……. 대체.)"
34040-135 = "말씀하십시오. 마에스트로."
34040-136 = "……."
34040-138 = "(……!? 이 자들은……!? 서, 설마……!?)"
34040-139 = "베아트리체에게 묻겠다."
34040-144 = "……네. 저에게 말인가요? 무엇이죠?"
34040-145 = "(이들은…… 게마트리아……?!)"
34040-147 = "다음화;불가해한 탐구자들"
