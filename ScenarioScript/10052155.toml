[translation]
10052155-7 = "아, 아아. 아아아아…… 안 돼……. 이럼 안 된다고요……!"
10052155-8 = "어째서……? 이제…… 이제, 어떻게 해야 하지……? 이대로라면 계획이……!"
10052155-13 = "어……?"
10052155-15 = "설마, 이 신호는?!"
10052155-20 = "저, 너무 늦지 않았죠? 이, 이제 괜찮아요! 모두…… 괜찮을, 거예요!"
10052155-21 = "언니가, 모두 준비되셨어요!!!"
10052155-28 = "언니!!!!!"
10052155-29 = "미안해요. 아인. 소프. 오르."
10052155-30 = "이제부터는 제게 맡겨 주세요."
10052155-44 = "꺄아아아아아아아악?!?!?!"
10052155-45 = "유즈, 탈출해!"
10052155-46 = "어, 어어어어어어, 어떻게요?!?!"
10052155-47 = "이쪽에서 할게! 강제 사출!"
10052155-49 = "어, 어어……?!"
10052155-54 = "아아아아아악–?!"
10052155-61 = "네오 아방가르드 군 완파! 유즈는……!"
10052155-62 = "괜찮아. 탈출 성공했어. 낙하산도 무사히 전개되었고."
10052155-68 = "우으으으으으……."
10052155-72 = "유즈!"
10052155-73 = "유즈 쨩!"
10052155-75 = "괜찮습니까, 유즈?!"
10052155-81 = "히이잉……."
10052155-82 = "[s] \"괜찮아, 유즈! 잘 해냈어. 정말 잘했어!\""
10052155-86 = "네, 네에……?"
10052155-87 = "그, 그렇군요. 모두를 도울 수 있었다니, 다행이네요. 에헤헤……."
10052155-91 = "리오 님."
10052155-92 = "으, 응? 왜 그래, 토키?"
10052155-93 = "다음에는 저를 파일럿으로 선별해 주십시오. 그래서 선생님께 유즈처럼 쓰다듬과 위로를 받고 말겠습니다."
10052155-94 = "어, 어어……?"
10052155-96 = "자, 자. 우리에게는 우리가 할 일이 따로 있을 거야, 토키."
10052155-102 = "언니……."
10052155-103 = "…언니… 미안해."
10052155-104 = "……저희가, 부족해서……."
10052155-106 = "괜찮아요. 아인. 소프. 오르."
10052155-107 = "동생들이 힘들어할 때는, 언니인 제가 나서야죠."
10052155-108 = "그렇지만 쉬운 상대처럼 보이지는 않는군요. 예언자들은 다시 일으키면 되는 일이지만."
10052155-109 = "그렇게 하기 위해서는, 저들을 먼저 넘어서야 할 것 같습니다."
10052155-111 = "네, 네! 언니! 물론이죠!"
10052155-112 = "언니의 등장 시간은, 지금이 아니었지만……. 아니, 아예 언니가 등장할 일이 없었으면 했지만……."
10052155-113 = "괜찮아요. 아직 되돌릴 수 있어요. 아직은……. 그러니까……!"
10052155-115 = "안녕하세요. 여러분."
10052155-116 = "그리고 다시 한번 안녕하세요. 왕녀. 그리고 열쇠."
10052155-117 = "정식으로 인사드리는 것은 처음일 듯하니, 제대로 된 자기소개를 여기에서 한 번 더."
10052155-118 = "깃발 아래 창조된 하나의 의지이자, 세상의 끝에 도달한 왕국의 순례자. 말쿠트입니다."
10052155-119 = "테, 텐도 아리스, 입니다……."
10052155-120 = "……케이예요. 그냥 그렇게 불러요. 그게 전부니까요."
10052155-121 = "……!"
10052155-122 = "그렇습니다! 텐도 케이입니다!"
10052155-123 = "네?!?!"
10052155-125 = "……?"
10052155-127 = "왜냐하면 케이는 가족이니까요! 가족끼리는 같은 성을 쓴다고 들었습니다!"
10052155-128 = "그, 그건……! 말하자면 분명, 그렇기는 한데……!"
10052155-129 = "왜 그러나요, 케이? 혹시…… 아리스가 잘못 알고 있는 겁니까?"
10052155-130 = "아, 아뇨! 그게 아니라……."
10052155-131 = "제, 제가…… 그래도 되는 걸까, 싶어서……."
10052155-132 = "텐도…… 텐도, 케이……."
10052155-133 = "헤, 헤헤……."
10052155-138 = "……."
10052155-139 = "결국 그 이름을 선택한 것이군요."
10052155-140 = "아리스. 그리고 케이."
10052155-141 = "크, 크흠."
10052155-142 = "그래요. 뭐 불만 있어요?"
10052155-143 = "아닙니다. 자유 의지는 언제나 우리를 이끌지요."
10052155-144 = "설령 그것이, 고도화된 착각에 지나지 않을지라도요."
10052155-146 = "어, 언니와…… 그리고 이곳, 네차흐 쨩의 코어로 만들어진 [ruby=JEHOVAH]예호바[/ruby]와……."
10052155-147 = "지극히 높은 곳의 [ruby=TZEVAOT]체바오트[/ruby]! 그리고……."
10052155-148 = "성지, 그리고 조하르의 터전이 남아 있는 한!"
10052155-150 = "그래요. 아인. 소프. 오르."
10052155-151 = "우리는 언제든지 모든 것을 다시 시작할 수 있고."
10052155-152 = "또한, 언제든지 모든 것을 다시 만들어낼 수 있습니다."
10052155-153 = "그러니 여기에서는 언니인 제가 나서겠습니다."
10052155-157 = "아인, 소프, 오르는 잠시 몸을 피하도록 해요."
10052155-159 = "네!!!"
