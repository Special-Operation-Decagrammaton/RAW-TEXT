[translation]
801-1 = "대결전 임무 브리핑"
801-5 = "기다리게했네요, 선생님."
801-6 = "이번엔 조정실의 이와비츠 아유무와 함께 왔습니다."
801-7 = "아, 안녕하세요, 선생님."
801-8 = "네. 시급한 일이니 곧바로 본론으로 들어가겠습니다."
801-9 = "지금 선생님이 계신 이곳은, 키보토스에서 벌어졌던 다양한 사건들을 좀 더 효과적으로 대응하기 위해 총학생회에서 준비한 곳입니다."
801-11 = "네…… 일종의 종합 상황실……. 아니, 작전실인데……."
801-12 = "키보토스에서 반복적으로 발생했던 사건들은 이제 이곳에서 좀 더 신속하게 대처할 수 있으실 거예요……."
801-14 = "조정실에서 고생해 주셨죠. 수고 많으셨습니다. 아유무."
801-15 = "네? 아, 아뇨. 이건 전부 린 선배…… 수석행정관님이 기획하신 건데……"
801-16 = "게다가 재무실에서도 적극적으로 도와주시기도 했고……."
801-17 = "아무튼, 그럼 선생님. 이제 이 작전실을 활용해서 좀 더 효과적인 활약을 기대하겠습니다."
801-18 = "그럼."
801-19 = "자, 잘 부탁드립니다!"
