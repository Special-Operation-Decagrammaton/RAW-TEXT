[translation]
10038050-1 = "제5화;너의 세계를 지나칠 때"
10038050-15 = "끝이…… 없는 수준이군……!"
10038050-16 = "날이 밝아오고 있는 것 같습니다."
10038050-20 = "어느 새……?"
10038050-21 = "저희가 도착한 것이 늦은 밤이기는 했죠. 그렇다고 해도 이 정도의 병력이라니……!"
10038050-22 = "아니, 끝이 보이기 시작했다. 증원이 멈춘 듯하군."
10038050-23 = "문제는…… 저희도, 끝이 보이기 시작했다는 것 같습니다만."
10038050-27 = "무슨 소리야? 이 정도로는……?!"
10038050-35 = "허세는 적당히 하시죠. 조금 전부터 다리가 풀려 있지 않았습니까."
10038050-36 = "……!"
10038050-37 = "아니, 아직이다! 나는 현룡문의 선봉이자 집행부장! 현룡문의 힘과 결정을 상징하는 자!"
10038050-42 = "백 번 부러질지언정 휘어질 수는 없다!"
10038050-56 = "(그렇지만 이대로는 역시 중과부적(衆寡不敵)……. 어떻게 해야……!)"
10038050-61 = "문주님 행차하십니다!"
10038050-69 = "문주님 행차하십니다!"
10038050-70 = "이 소리는……?!"
10038050-78 = "수고가 많았다. 미나. 레이죠."
10038050-80 = "무, 문주님!"
10038050-81 = "현룡문……? 문주님이 직접……?"
10038050-83 = "일련의 보고는 받았다. 연단방에서 무슨 일이 일어나고 있는지도."
10038050-84 = "처, 처벌해 주십시오! 이 정도의 대규모 외부 병력이, 산해경 내부에 침투할 때까지 조금의 대처도 하지 못한 것은–"
10038050-85 = "되었다. 물러나 쉬고 있거라."
10038050-89 = "……이 안에서 일어나고 있는 일이 나의 짐작대로라면, 제아무리 현룡문의 집행부라고 하더라도 어찌할 수 있는 일이 아닐 터이니 말이다."
10038050-91 = "네? 그렇다고 하심은…… 연단방에서는 도대체 무슨 일이……?"
10038050-97 = "……지금, 그 답을 얻을 수 있을 것 같구나."
10038050-103 = "이거, 성대한 환영이로군. 나는 기뻐해야 하는가, 아니면 안타까워해야 하는가."
10038050-104 = "현룡문이 이 정도의 사태마저 대응하지 못하게 되었을 만큼 쇠락하였음을 슬퍼해야 할까."
10038050-108 = "아니면 구중궁궐에서 나올 일이 없었던 문주가, 직접 행차하게 되었음을 즐거워해야 할까?"
10038050-110 = "[ns] \"너는……?\""
10038050-114 = "거기에 있는 어른은……?"
10038050-119 = "아아, 그렇겠군. 소문의 그 선생인가."
10038050-120 = "이거, 뜻밖의 수확이로군. 쿡쿡쿡. 우리의 만남은 조금 더 의미 있고 극적인 것이 되었으면 하는 희망이 있었거늘."
10038050-121 = "생각하기에 따라서는 이 역시 충분히 극적인 만남이라 할 수 있겠지만……."
10038050-122 = "조금은 더 여유가 있는 상태에서, 서로에 대한 호기심을 풀 수 있는 자리가 마련되기를 바랐는데 말이다?"
10038050-123 = "[s] \"…….\""
10038050-124 = "……그래. 선생에게는 초면이겠구나. 이 자리에 있는 학생들의 절반 이상 역시 그러할 것이고."
10038050-125 = "어떻게 하겠느냐. 신타니 카이. 스스로 자신을 소개하겠는가? 아니면 내가 그 수고를 덜어줄 수도 있다만?"
10038050-130 = "……?!?!"
10038050-131 = "(저 사람이…… 그 말로만 듣던, 신타니 카이?! 연단방의 예전…… 제정신이 아닌 부장이었다던……???)"
10038050-133 = "과도한 친절은 독이 되기 마련이다. 키사키."
10038050-134 = "예전의 너였다면, 독도 쓰기에 따라서는 약이 될 수 있다고 말하였을 듯한데?"
10038050-135 = "그 생각 자체는 옳은 것이지. 하지만 지금은 약을 약으로, 독을 독으로 사용해야 할 때여서 말이지."
10038050-139 = "반갑구나. 현룡문의 모두들. 그리고 선생."
10038050-140 = "지금은 일곱 죄수라는 묶음에 멋대로 포함된, 신타니 카이라고 한다."
10038050-142 = "[ns] \"……!\""
10038050-143 = "산해경은 나를 추방하고, 잊힌 자로 만들려 하였지만……"
10038050-144 = "나는 산해경을 잊지 않았다. 정확히 그와 같은 정도로, 연단방 역시 잊지 않았고."
10038050-145 = "보아라. 키사키. 돌아오기까지 무수한 과정이 있었지만, 나는 결국 이 자리에 돌아왔다."
10038050-151 = "……무엇을 할 생각이냐."
10038050-152 = "그거야 물론, 나의 것을 되찾을 작정이다만."
10038050-153 = "연단방은 너의 것이 아니다."
10038050-154 = "물론 너는 그렇게 주장할 수 있겠지."
10038050-155 = "연단방을 되찾아서, 무엇을 이루고자 하는가."
10038050-156 = "당연한 것 아닌가. 선단(仙丹)의 완성이다."
10038050-157 = "……그때와 같이, 수많은 학생들을 도탄으로 밀어 넣으며?"
10038050-158 = "선단(仙丹)이 완성된다면, 모든 것을 되돌릴 수 있다. 그때에도 충분히 그렇게 할 수 있었지."
10038050-163 = "너다. 바로 너다. 네가 모든 것을 막았다. 네가 이 모든 것을 초래한 원인이다. 키사키."
10038050-164 = "하지만 너무 걱정하지는 마라. 나에게도 연민과 긍휼이라는 감정은 남아 있으니 말이다."
10038050-166 = "호오. 그건 참으로 놀라운 소식이로구나."
10038050-167 = "쿡쿡쿡쿡……. 그렇지만 괜찮은가? 슬슬 몸이 한계에 다다랐을 것이라고 생각하는데?"
10038050-168 = "……?!"
10038050-169 = "어떻게 그것을 알았느냐고 묻는 얼굴이군. 알다마다. 모를 수가 없는 일이지."
10038050-170 = "나라면 널 낫게 할 수 있다. 키사키."
10038050-171 = "그것도 당연하지. 너를 그렇게 만든 것은."
10038050-176 = "나였으니 말이다?"
10038050-177 = "……!"
10038050-182 = "그래. 짐작은 하고 있었다. 그러했겠지. 네가 아니라면, 달리 누가 있겠느냐."
10038050-187 = "(무슨 말이지, 지금?)"
10038050-188 = "(글쎄……? 하지만 문주님의 표정이 심상치 않은데……?)"
10038050-194 = "여기에서 제안을 하나 하도록 하마."
10038050-201 = "나에게 연단방을 돌려준다면, 책임지고 너를 돌보도록 하겠다."
10038050-202 = "선단(仙丹)을 만들고, 시험하고, 적용하며 응용하는 모든 과정을, 다시 나의 이름으로 행하게 해 준다면."
10038050-203 = "너의 몸 정도야, 한 달 안에 해결할 수 있는 문제에 불과하지."
10038050-207 = "……."
10038050-208 = "나는 기억한다. 네가 만들어낸 그 모든 고통들을."
10038050-212 = "많은 학생들이 괴로워했고, 많은 학생들이 몸부림쳤다."
10038050-213 = "그런 너를, 나 한 몸의 안식을 위해, 아무런 책임도 없이 다시 받아들여야 하는가?"
10038050-214 = "나의 대답은 그때와 마찬가지다."
10038050-218 = "네가 크게 돌이켜 성찰하지 않는 한, 산해경에 네가 있을 자리는 앞으로도 없을 것이다!"
10038050-223 = "참으로, 마지막까지 한결같구나."
10038050-227 = "그렇다면 그 선택의 결과를 이 자리에서 가져가도록 해라. 키사키."
