[translation]
51210-1 = "제21화;그럼에도 당신에게"
51210-3 = "하압!"
51210-15 = "자잘한 괴물들은 어떻게든 물리칠 수 있었지만. 역시……."
51210-23 = "[ns] \"여전히 쿠로카게에겐 어떤 공격도 통하질 않아.\""
51210-24 = "일단은 태세를 정비하기 위해서인지 저쪽도 잠시 소강상태가 되긴 했지만……"
51210-25 = "또 언제 덤벼들지 몰라."
51210-26 = "우와아앙. 이대로 저길 지나갈 수 없으면…… 그 악당을 쫓아서 쓰러트리러 갈 수도 없는 거잖아!"
51210-27 = "어, 어떡하면 좋지?!"
51210-29 = "이대로 있다간, 결국 유카리가 위험에……."
51210-30 = "……그럴 수는 없어!"
51210-31 = "어떻게든 방법을 찾아야 하잖아. 안 그래. 키쿄?!"
51210-32 = "…………."
51210-38 = "[ns] \"나구사.\""
51210-42 = "[ns1] \"슈로가 유카리를 노리고 있다는 건 알겠어.\"\n[ns2] \"지금 같은 상황을 만들기 위해 모든 음모를 꾸몄다는 것도.\""
51210-45 = "[ns] \"하지만 나구사, 슈로가 말한 <백물어>를 만든다는 건 무슨 의미야?\""
51210-47 = "[ns] \"슈로는…… 유카리를 통해 무슨 일을 벌이려는 거야?\""
51210-48 = "그건……."
51210-49 = "선생님! 지금 그런 게 중요해?!"
51210-50 = "유카리가……!"
51210-52 = "나구사 선배는 아야메 부장 때처럼, 이라고 했었지."
51210-56 = "엇, 키쿄……?"
51210-61 = "렌게. 정보는 중요해. 그 얄미운 화조풍월부의 부원이 말했던 것처럼. 우리는 아무것도 모르는 상태야."
51210-62 = "무엇이 옳고 그른지. 어떻게 움직여야 그나마 실낱 같이 미약한 <실마리>라도 잡을 수 있을지. 그 전부."
51210-63 = "정보가 있어야 판단을 내릴 수 있어."
51210-64 = "선생님이 묻고 있는 건 그거야. 이 자리에서 정보를 가지고 있는 건, 결국 나구사 선배. 당신밖에 없으니까."
51210-66 = "나 밖에…………"
51210-67 = "그러니 답해줘. 녀석이 뭘 노리고 있는 건지. 무엇을 의도하고 있는 건지. 우리가 어떻게 행동하면 되는 건지."
51210-68 = "이 자리에서 그걸 아는 건 당신뿐이야."
51210-72 = "……………………"
51210-73 = "……그래."
51210-74 = "이런 상황에서조차 당신은 끝까지, 우리에겐 [ruby=・]아[/ruby][ruby=・]무[/ruby][ruby=・]런[/ruby] [ruby=・]기[/ruby][ruby=・]대[/ruby][ruby=・]도[/ruby] ──"
51210-75 = "화조풍월부……."
51210-80 = "나구사 선배……?"
51210-86 = "그들은 과거, 백귀야행이 아직 연합이 되기 이전의 시절 나타나 활개를 쳤다고 알려진…… 이매망량의 도당."
51210-87 = "그들을 가리켜 표현하기로는……"
51210-88 = "[ns3] \"<백귀야행의 연합을 인정하지 않는 패악의 동아리>.\"\n[ns4] \"<괴서를 다루며 사람을 홀리는 이매망량>이라 하더라…… 맞지?\""
51210-91 = "……맞아."
51210-92 = "이유는 몰라. 의도도 알 수 없어. 하지만 수단만큼은 분명히 존재해."
51210-93 = "그들은 <괴서>라는 책을 이용해, 풍류를…… 그들이 말하기로는 <백물어>라는 괴담을 만들고 싶어 해."
51210-94 = "실제로 내가 찾아갔던 대설원에서 화조풍월부의 부장 코쿠리코는 아야메를……"
51210-95 = "……아야메를 <백물어>로 자아내 황혼 너머로 데려갔어."
51210-101 = "난 그걸 지켜볼 수밖에 없었어. 그저 무력하게…… 지켜보는 수밖에………"
51210-103 = "아야메 부장은 그렇게……"
51210-104 = "……"
51210-106 = "슈로의 말이 사실이라면, 이번엔 유카리가 목표야."
51210-107 = "이대로 있으면 유카리 또한 아야메처럼……."
51210-108 = "나구사 선배…… 왜. 그런 건 우리에게 한마디도 하지 않고……"
51210-109 = "………무서웠으니까. 진실을 말하는 것이."
51210-110 = "………"
51210-116 = "…………나구사 선배."
51210-124 = "뭐, 뭐야?!"
51210-126 = "아아, 잘 보이나요? 여러분?"
51210-130 = "앗, 선생님! 저기……!"
51210-138 = "아하핫. 축제는 즐거우신가요?"
51210-139 = "네, 즐거우시겠지요."
51210-140 = "이 전부가 힘이 닿는 대로 여러분을 더욱 즐겁게 만들어 드리고자 준비한 무대이니까."
51210-144 = "저건 음양부의 방송용 비행선……"
51210-145 = "그뿐만 아니라, 인터넷을 통해서도 중계되고 있어요……!"
51210-146 = "뭐, 어, 어떻게?! 거기까지 가능한 거야?!"
51210-147 = "[s] \"그러고 보면, 분명…… 시즈코가 축제를 방송하기 위한 준비를…….\""
51210-148 = "하지만, 저 아이는 왜 방송 같은 걸……?"
51210-150 = "아하핫. 하지만 제가 준비한 것은 그게 끝이 아니에요."
51210-151 = "마침 여러분께 소개해 드리고 싶은 게스트가 있거든요~"
51210-155 = "이미 알고 계실 분들은 알고 계시겠지요. 20년 만에 재현되는 이번 기념비적인 축제에서도 특히나 모두의 기대를 한 몸에 받고 있던 분이랍니다~"
51210-164 = "[ns] \"유카리……!\""
51210-165 = "아하핫. 잘 보이시나요~?"
51210-166 = "그래요. 잘 보이시겠죠. 애당초 그걸 위해 준비한 무대니까."
51210-167 = "그럼 소개해 드릴게요. 이번 이야기의 주인공을."
51210-169 = "………"
51210-171 = "비록 지금은 잠들어 있는 공주님처럼 아무 말도 없으시지만. 저는 알고 있답니다. 무척이나 절절하게 이해하고 있답니다."
51210-172 = "여기 있는 무녀님은, 가슴속에 커다란 아픔을 가지고 있다는 걸."
51210-175 = "그동안 존경하고 동경했던 사람이 돌아봐 주지 않은 것에."
51210-178 = "그토록 원래대로 되돌아가고 싶다던 말에, 의미 따윈 없다고 하는 일갈에."
51210-180 = "돌아가고 싶다며 모두에게 외친 말에, 너는 돌아갈 곳이 있지 않느냐며 쏘아붙이는 그 한 마디에."
51210-182 = "그렇게 해서 무녀님은 집으로 돌아왔지요. 바로 이 자리에."
51210-184 = "하지만 이를 어째. 유일하게 돌아갈 수 있는 곳이라 생각했던 그곳에서 모두가 무녀님께 바란 건 단 하나……"
51210-185 = "20년 전에 벌어진…. 폐지된 축제의 불명예를 대신 설욕해달라는 부당한 요구뿐."
51210-186 = "…………"
51210-187 = "그래요. 그 누구도, 그 어느 하나 무녀님의 마음 따위엔 관심 없어."
51210-188 = "아아, 불쌍해라. 실로 가련해라. 모두가 즐거워야 할 축제에서 홀로 아픔을 가지고 있는 꼴이라니."
51210-189 = "그건……… 억울하잖아요?"
51210-190 = "그렇다면 차라리 그 감정, 혼자만 끌어안고 괴로워할 바엔…… 다 함께 괴로워지는 편이 좋지 않나요?"
51210-194 = "그러니 제가 당신을 대신해서 목소리를 내어줄게요. 제가 대신하여 당신의 <감정>을 모두에게 돌려드릴게요."
51210-195 = "지금부터 시작되는 것은 저희 화조풍월부가 자아내는 풍류."
51210-196 = "실로 멋지고 화려하게 당신들의 백귀야행을 불태워 드리겠나이다."
51210-197 = "기대해 주세요. 아하핫!"
51210-204 = "[ns] \"유카리……!\""
51210-206 = "백귀야행을 불태운다고 했어."
51210-207 = "지금 이상으로……. 더 큰 일이 벌어질 거예요."
51210-208 = "마, 막아야 해! 얼른……!"
51210-213 = "[ns] \"또 쿠로카게가 움직이기 시작했어. 하필 이럴 때 또……!\""
51210-214 = "제길……!"
51210-215 = "어쩌면 좋은 거야! 우리의 공격이 전혀 통하지 않는 괴물을 무슨 수로……."
51210-216 = "아니, 설사 녀석을 뚫고 무대로 향할 수 있다고 할지라도…… 마찬가지로 총알이 통하지 않는 그 꼬맹이는 어떻게 해야 쓰러트릴 수 있는 건데?!"
51210-217 = "……방법이라면 있어."
51210-221 = "키쿄?! 정말이야?!"
51210-225 = "[ns] \"키쿄, 이건……… 백화요란의 부장에게 주어진다는 바로 그……?\""
51210-230 = "맞아. 나구사 선배. 당신이 내게 떠넘기고 갔던 물건. <[ruby=百蓮]백련[/ruby]>이야."
51210-231 = "화조풍월부. 슈로의 말이 사실이라 가정한다면……."
51210-232 = "이 자리에서 슈로를 막고 쓰러트릴 수 있는 자격을 가진 사람은 한 명뿐. 즉──"
51210-238 = "유카리를 구할 수 있는 건 나구사 선배. 당신밖에 없어."
51210-239 = "그러니, 부탁해. 선배. 유카리를 구해줘."
51210-240 = "화, 확실히 부장의 자격을 가진 나구사 선배라면 가능성이……."
51210-244 = "난……"
51210-249 = "난, 못해."
51210-251 = "어?! 어, 어째서야?! 나구사 선배!"
51210-253 = "슈로가 말했던 <백화요란의 부장>으로서 자격을 가진 자라는 건…… 아야메를 가리키는 거야. 내가 아니야."
51210-254 = "난 할 수 없어."
51210-255 = "슈로의 말이 맞았어. 처음부터…… 전부…… 변명이었어."
51210-256 = "나는 그저 도망치려고 했을 뿐이야. 내 진짜 모습을 들킬까 봐. 무서워서."
51210-257 = "진심을 밝히지 못하고…… 전력으로 아야메 곁에 선 채로…… 설 수 있는 자격을 지닌 <나구사>라는 소녀를 연기한 것에 지나지 않아."
51210-258 = "그렇게 모두를 속이고 있었을 뿐."
51210-259 = "내 모든 건 전부…… <[ruby=・]코[/ruby][ruby=・]스[/ruby][ruby=・]프[/ruby][ruby=・]레[/ruby]>였어."
51210-260 = "[s] \"나구사…….\""
51210-263 = "그저 아야메 곁에 서고 싶어서…… 아야메에게 어울리는 존재가 되고 싶어서."
51210-264 = "우등생을 연기하고 있었을 뿐인 가짜."
51210-265 = "말할 수 없었어…… 아야메를 눈앞에서 잃고…… 이곳으로 돌아온 내가…… 아야메를 잃어버린 주제에 혼자만 돌아왔다고 말하면……."
51210-270 = "<[ruby=・]모[/ruby][ruby=・]두[/ruby][ruby=・]가[/ruby] [ruby=・]손[/ruby][ruby=・]가[/ruby][ruby=・]락[/ruby][ruby=・]질[/ruby][ruby=・]을[/ruby] [ruby=・]했[/ruby][ruby=・]을[/ruby] [ruby=・]테[/ruby][ruby=・]니[/ruby][ruby=・]까[/ruby].>"
51210-272 = "이런 내게 자격이고 뭐고 있을 리가 없어."
51210-273 = "이런 내가…… 유카리를 구할 수 있을 리가………!"
51210-279 = "고료…… 나구사………!"
51210-284 = "아……"
51210-289 = "[ns] \"키쿄, 잠깐만…… 진정……!\""
51210-304 = "………키, 쿄?"
51210-305 = "나, 유카리에게 심한 말을 했어."
51210-306 = "너에겐 돌아갈 곳이 있지 않느냐고. 백화요란 놀이 따위를 할 필요가 있겠냐고."
51210-307 = "………그런 생각은 해본 적도 없는데. 유카리를 위해서라는 양. 스스로를 속이고, 일방적으로 이야기했어."
51210-309 = "그게, 저 아이를 저렇게 만든 거야."
51210-310 = "…키, 쿄……"
51210-315 = "………"
51210-316 = "당신이…… 우리를 버리고 떠나간 것에 대해선, 여전히 당신을 미워하고 있어."
51210-317 = "지난날, 계속해서 당신을 기다렸는데도…… 돌아오지 않은 것을, 나는 아직 용서할 수 없어."
51210-322 = "하지만…… 그래도 말이야."
51210-323 = "그래도………"
51210-325 = "나 때문에…… 내 실수 때문에……"
51210-326 = "그 이상으로, 지금껏 제멋대로 군 까닭에 상처 입혀버린 그 아이를……"
51210-327 = "유카리를 구할 수 있는 건, 지금 이 자리에서 당신밖에 없어."
51210-328 = "나도…… 렌게도…… 하다못해 이 자리에 없는 아야메 부장조차 아닌, 당신밖에……."
51210-330 = "그러니…… 부탁할게."
51210-331 = "이런 말이 염치없다는 건 알아. 제 잘난 척 행동한 주제에, 이런 말을 할 자격 따윈 처음부터 없었을지 몰라."
51210-332 = "그래도 부탁하고 싶어!"
51210-333 = "돌아가서 그 아이에게 사과하기 위해서라도."
51210-334 = "제발, 나구사 선배……."
51210-336 = "부탁해."
51210-339 = "나구사 선배!"
51210-343 = "아."
51210-344 = "나도…… 나도 마찬가지야!"
51210-345 = "키쿄만큼이나…… 백화요란을 뛰쳐나간 내게도 이런 말을 할 자격은 없다는 거, 알아!"
51210-346 = "그래도 나도 키쿄랑 같아!"
51210-347 = "내 말이 유카리를 상처 입혔다면, 나도 사과를 하고 싶어."
51210-348 = "다시 만나서 이야기를 나누고 싶어."
51210-349 = "억지라는 건 알아. 이미 저질러 버린 주제에, 다시 담으려고 하다니 염치가 없다는 것도 알아."
51210-350 = "그래도……"
51210-355 = "유카리의 말처럼, 그때로 돌아갈 수만 있다면…… 나도 그때로……."
51210-356 = "그러니 부탁해. 나구사 선배."
51210-362 = "…………나는, 모두를 속이고……"
51210-363 = "거짓말, 을……."
51210-369 = "[ns] \"나구사. 나도 부탁할게.\""
51210-382 = "……알았어."
51210-392 = "해볼게."
51210-404 = "[ns] \"역시나 쉽게 보내줄 생각은 아닌 모양이야.\""
51210-405 = "일단 이 앞으로…… 길이라면 우리가 열겠어!"
51210-406 = "응. 목표가 정해졌으면 행동할 수 있으니까. 최대한 붙잡고 늘어지기. 맞지?"
51210-407 = "쓰러트릴 수는 없을지라도, 발목을 잡는 데 최선을 다할게요!"
51210-408 = "우리만 믿어! 선생님!"
51210-410 = "………유카리를, 부탁해. 선생님. 나구사 선배."
51210-412 = "[ns] \"응. 가자. 나구사!\""
51210-419 = "………!"
51210-421 = "다음화;화염에 휩싸인 거리"
