[translation]
10012035-8 = "이, 이게 뭐야!? 또 졌잖아……?? 지원군까지 데려왔는데!!"
10012035-9 = "아니, 뭔가 이 녀석, 지금 상태가 좀 이상하지 않아? 왜 이렇게 벙쪄 있는 건데!?"
10012035-11 = "서, 선생님……? 선생님이 왜……. 왜 거기 계시는……?"
10012035-12 = "선생님은……? 어, 어라……? 응……?"
10012035-14 = "와카모? 뭐 하는 거야, 와카모!!"
10012035-16 = "와카모!!"
10012035-17 = "완전히 넋이 나가 있는데요."
10012035-18 = "우, 우선 퇴각하죠! 데려가서 정신 좀 차리게 한 뒤에 다시 오든지……!"
10012035-24 = "앗, 따따따가워!!"
10012035-25 = "그만, 그만! 알았다고!!"
10012035-26 = "칫……. 망할……!"
10012035-27 = "이대로 끝날 거라 생각하지 마라!!"
10012035-38 = "대체 누구였을까요, 저분들은……."
10012035-39 = "아마도 세리카와 호시노 선배가 말했던 녀석들……. 우리 리조트를 뺏으려 했다던 녀석들일지도."
10012035-40 = "……그렇지, 선생님?"
10012035-41 = "[s1] \"일단 대부분은 그런데…….\"\n[s2] \"약간의 차이는 있지만…….\""
10012035-42 = "그러고 보니 한 분은 마치 선생님을 아시는 것처럼 행동하던데……."
10012035-43 = "그러고 보니 한 분은 마치 선생님을 아시는 것처럼 행동하던데……."
10012035-44 = "혹시 그 와카모라는 분과는 구면이신 건가요? 선생님?"
10012035-45 = "[s3] \"그……. 말하자면 긴데…….\"\n[s4] \"모르는 게 나을지도…….\""
10012035-48 = "……."
10012035-49 = "선생님……."
10012035-50 = "……아아앗!!"
10012035-51 = "……!? 아야네!?"
10012035-52 = "낚싯대가……. 낚시 도구들이……!"
10012035-53 = "싸우는 동안 모두 부서져서 쓸 수 없게 돼버렸어요!!"
10012035-57 = "……?"
10012035-61 = "……!!!"
10012035-63 = "(이후 한동안 침울해진 시로코를 달래 준 후, 다 같이 리조트로 돌아갔다.)"
10012035-70 = "(리조트로 돌아가 그간의 일을 설명하는 동안에도, 시로코는 세 번이나 낚싯대……라고 중얼거렸다.)"
