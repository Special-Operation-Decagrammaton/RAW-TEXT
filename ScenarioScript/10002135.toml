[translation]
10002135-1 = "제13화;여름 하늘의 위시리스트"
10002135-2 = "(불꽃이 모두 사그라든 해변에선 화약과 네이팜 냄새가 진동했다.)"
10002135-3 = "(그러잖아도 어두운 해안가가 새카만 재로 인해 더더욱 칠흑 같아졌다.)"
10002135-5 = "콜록, 콜록! 아우…… 아직도 연기가 다 안 가셔서 매워요……"
10002135-6 = "역시 저희의 승리로군요."
10002135-7 = "밤에 맡는 네이팜 냄새가 좋……."
10002135-8 = "아니, 그런 대사는 됐구요, 아즈사 쨩……."
10002135-9 = "승패를 정하는 이벤트가 아니었던 거 같은데……"
10002135-10 = "하후우…… 큰일이에요…… 사진은 어떻게 하죠……?? 이대로라면 사진이……"
10002135-11 = "[s1] \"걱정 마. 잘 찍어 뒀으니.\"\n[s2] \"이건 이것대로 멋진 사진인걸.\""
10002135-12 = "흐에……!? 선생님……!? 어느 틈에 찍으신 거예요?!"
10002135-13 = "흐에……!? 선생님……!? 어느 틈에 찍으신 거예요?!"
10002135-16 = "우와아…… 대단해요!"
10002135-17 = "이렇게만 보면 평범하게 예쁜 불꽃놀이처럼 보이네요……!?"
10002135-19 = "어…… 어레? 이건…… 저희들을 찍으신 건가요? 언제 이런 장면이……"
10002135-20 = "[s] \"츠루기도 볼래?\""
10002135-22 = "……흐에!? 켁!?"
10002135-23 = "……!!!!"
10002135-24 = "……그, 그…… 음……"
10002135-25 = "……감사합니다……"
10002135-27 = "(이후 아침 해가 뜰 때까지 대충 주변을 정리했다.)"
10002135-28 = "(정리한 것들을 모두 크루세이더로 옮길 때 즈음, 해가 뜨기 시작했다.)"
10002135-30 = "[ns] \"그럼 돌아갈까.\""
10002135-36 = "(다들 지친 기색들이 역력했는데, 아니나 다를까 돌아가는 차 안에선 대부분 잠이 들었다.)"
10002135-37 = "(모두의 표정은 어딘가 만족스러워 보였다……)"
10002135-43 = "(……피곤한 얼굴로 운전대를 잡고 있던 한 사람만 제외하고.)"
10002135-45 = "(다음 날.)"
10002135-48 = "정의실현부 동아리실"
10002135-51 = "오셨군요. 선생님. 오랜만에 뵙는 것 같습니다."
10002135-52 = "바다는 즐거우셨는지 모르겠습니다. 모쪼록 어울려 주셔서 감사드립니다."
10002135-53 = "마시로와 츠루기는 임무가 있어서 인사드리지 못하지만……"
10002135-54 = "그래도 츠루기가 꽤 활기를 되찾은 것 같아서 다행이네요. 이것도 다 선생님 덕분이겠지요."
10002135-55 = "마시로도 조금은 여유를 가진 것 같은 분위기였고요."
10002135-56 = "다른 두 분도…… 잘 다녀오셨으려나요? 선생님이 보시기엔 어떠셨던가요?"
10002135-57 = "[s3] \"즐겁게 놀다 온 거 같긴 한데…….\"\n[s4] \"아직은 숙제 검사 받는 아이들 분위기랄까.\""
10002135-58 = "네?"
10002135-59 = "네?"
10002135-64 = "[ns] 두 사람에게서 받은 리스트 체크표를 보여준다."
10002135-66 = "……아아. 이것 때문에……. 저런…… 혹시 부담을 드렸던 걸까요."
10002135-67 = "……음? 리스트가 있어서 오히려 자연스럽게 진행이 된 거 같다고요?"
10002135-68 = "후훗……"
10002135-69 = "그렇게 말씀해 주시니 감사하네요. 어느 정도는 의도한 것이기도 합니다만……"
10002135-70 = "두 사람에게 츠루기는 조금 어려울 수도 있는 상대겠지요. 어색해 할 거 같아서 준비한 리스트였습니다."
10002135-71 = "두 분을 긴장하게 만든 거라면 조금 미안하긴 하지만……"
10002135-72 = "적어도 하는 일이 명확하다면 좀 더 상황을 즐기기 편했을 거라고 생각해서요."
10002135-73 = "[s5] \"적절한 방법이었던 거 같아.\"\n[s6] \"없었으면 더 어색했을지도 몰라.\""
10002135-74 = "후후. 정말이지, 듣기 좋은 말만 해 주시는군요. 선생님께서는. 이것도 배려인가요?"
10002135-75 = "후후. 정말이지, 듣기 좋은 말만 해 주시는군요. 선생님께서는. 이것도 배려인가요?"
10002135-76 = "혹시 괜찮으시다면, 다음에 두 분을 뵙거든 리스트에 대해선 신경 쓰지 않으셔도 된다고 말씀 좀 부탁드리겠습니다."
10002135-77 = "아무래도 제가 직접 말하는 것보다…… 그 편이 더 편하실 거 같군요."
10002135-78 = "모쪼록 다시 한번, 괜한 일에 말려들게 해드려서 죄송하고 감사합니다. 선생님."
10002135-83 = "그럼."
10002135-88 = "[ns] \"하스미.\""
10002135-89 = "……네?"
10002135-90 = "[s7] \"다음에는 하스미도 같이 가자.\"\n[s8] \"하스미도 같이 갔으면 더 즐거웠을 거 같아.\""
10002135-91 = "……네? 다음에는 저도 같이……?"
10002135-92 = "……네? 다음에는 저도 같이……?"
10002135-93 = "후후…… 그렇군요. 하지만 그랬다간 여길 돌볼 사람이 없어질 터라……."
10002135-94 = "하지만 말씀만은 정말로 감사드립니다. 그것만으로도 이미 휴가를 다녀온 것 같은 기분입니다."
10002135-95 = "……음?"
10002135-96 = "혹시 뭔가 더 하실 말씀이라도 있으신가요?"
10002135-97 = "……아아. 이 리스트요? 아아. 미리 만들어 둔 것이었냐고요?"
10002135-98 = "……후후. 조금은 말씀드리기 어려운 일입니다만……"
10002135-99 = "누구나 여유가 없거나 피곤할 때엔, 한 번쯤 바라는 것들을 상상하며 정리해보곤 하니까요."
10002135-100 = "그런 이야기입니다. 별로 대단한 건 아니었군요."
10002135-101 = "그러고 보니, 리스트 이야기가 나왔을 때 사진을 찍어 달라고 말씀을 드렸던 거 같네요."
10002135-102 = "같이 가진 못해도 구경이나마 하고 싶어서 드린 말씀이었는데…… 혹시 사진이 있을까요?"
10002135-103 = "[s] 사진들을 건네준다."
10002135-109 = "감사합니다. 그럼 어디 저도 구경을……"
10002135-110 = "……?"
10002135-111 = "……선생님?"
10002135-112 = "……이건…… 뭐죠?"
10002135-113 = "[s9] \"리프레시 하는 사진.\"\n[s10] \"여름 바다의 위시리스트지.\""
10002135-119 = "……후훗. 네."
10002135-125 = "……그런 것 같네요."
10002135-126 = "여름 하늘의 위시리스트"
