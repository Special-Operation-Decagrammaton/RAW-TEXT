[translation]
1300006-1 = " 잠든 숲 속의 메이드"
1300006-2 = "의문의 사무실"
1300006-3 = "코오-……"
1300006-4 = "흠냐 흠냐……"
1300006-5 = "(Zzz……)"
1300006-6 = "으음…… 카린…… 그거 네루 선배 푸딩…… 먹으면 안……"
1300006-7 = "[s] 깨운다."
1300006-8 = "으음?"
1300006-9 = "[s] \"일어나.\""
1300006-10 = "…… 에?"
1300006-11 = "아앗?! 주, 주인님?!"
1300006-12 = "으음 곤란하네요. 자고 있는 숙녀의 방에 들어오시는 건 신사의 도리가 아닙니다만…"
1300006-13 = "뭐, 주인님이라면…… 후훗."
1300006-14 = "……어라? 꿈이 아닌가?"
1300006-16 = "하암. 잘 잤다~"
1300006-17 = "어라. \"하암~ 잘 잤다~\" 할 분위기가 아니라고요? 흐음. 확실히."
1300006-18 = "온 몸이 묶여 있었군요."
1300006-19 = "그, 그러고 보니 저희는……"
1300006-21 = "밀레니엄 근교 도심지"
1300006-22 = "(몇 시간 전.)"
1300006-23 = "여기가 그 서류를 훔쳐 간 하수인에게 기밀 유출을 지시한……"
1300006-24 = "의뢰주의 빌딩이에요."
1300006-25 = "카이저 코퍼레이션이라…… 상대하기 불편할 정도의 기업이긴 한데……"
1300006-26 = "일단은 제가 잠입해 볼게요. 주인님은 제 연락을 기다려 주세요."
1300006-30 = "만약 제 연락이나 탈출이 늦어진다면…… 부탁 드릴게요."
1300006-32 = "의문의 사무실"
1300006-33 = "으음……"
1300006-34 = "제 탈출이 늦어진다면, C&C로 요청해 달라는 의미였는데."
1300006-35 = "저를 구하려고 침입하셨고, 그 때문에 저까지 발각 당했고, 이렇게 되었었죠."
1300006-36 = "후훗. 탓하는 거 아니에요."
1300006-37 = "저를 구하러 와주셨다는 거, 기뻐요."
1300006-38 = "하지만…… 창밖을 보니 제법 시간도 흘렀고, 제법 높은 건물인 것 같은데."
1300006-39 = "어쩐다…… 할 수 없죠. 폭탄을 사용할까요."
1300006-40 = "운이 좋으면 살아남을 수 있을 거예요."
1300006-41 = "아 잠깐…… 주인님은 좀 위험할지도?"
1300006-42 = "으음…… 이번에는 죄송해지네요."
1300006-43 = "저 때문에 주인님이…… 이렇게 위험해지다니."
1300006-44 = "…… 흑"
1300006-45 = "네? 괜찮다고요? 나, 납치 정도는 그렇게 놀라운 일도 아니시라고요?!"
1300006-46 = "으음. 저를 위로하려고 하시는 거짓말 같진 않은데……"
1300006-47 = "후훗…… 그렇네요."
1300006-48 = "사실 저도 그렇게 불안하진 않아요."
1300006-49 = "그 이유가 뭘까? 생각해 봤는데."
1300006-50 = "주인님이 곁에 있기 때문에, 그리고……"
1300006-51 = "보통 이때쯤 되면……"
1300006-53 = "(콰과과광!)"
1300006-54 = "네, 네루다!"
1300006-55 = "도, 도망쳐! C&C가 나타났다!!"
1300006-56 = "젠장! 아까 그 안경 쓴 메이드가 정말로 C&C였나?!"
1300006-57 = "이래서 내가 메이드는 건드리지 말라고 했잖…… 으아아아악!"
1300006-58 = "……"
1300006-59 = "보통 이렇게 되거든요."
1300006-60 = "곧 동료들이 이 문을 열고 \"헤헷. 이대로 보낼 순 없지.\" 라며 찾아올……"
1300006-61 = "크아악! 이대로 당할 순 없지! 인질이 있는 층만 폭파시켜!"
1300006-62 = "?!"
1300006-63 = "아, 안돼! 자, 잠깐만!"
1300006-65 = "(콰아앙-!)"
1300006-66 = "주인님!!"
1300006-73 = "주인님! 주인님!"
1300006-75 = "아, 주인님, 괜찮으세요?!"
1300006-76 = "[s] \"하암. 잘 잤다~\""
1300006-77 = "\"하암. 잘 잤다~\"가 아니잖아요!"
1300006-78 = "후우…… 그래도……"
1300006-79 = "다행이네요. 폭발은 대충 크지 않았지만."
1300006-80 = "밑에 난간이 있어서, 조금 아프긴 해도 위험하진 않았네요."
1300006-81 = "그리고……"
1300006-82 = "떨어질 때, 제 쿠션이 되어주셨더군요."
1300006-83 = "……후훗…… 역시 주인님은, 주인님이네요."
1300006-84 = "지켜주셔서, 고마워요."
1300006-85 = "앞으로도 잘 부탁드려요."
