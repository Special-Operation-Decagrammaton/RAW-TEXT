[translation]
2005106-1 = "기특해 레이사"
2005106-3 = "선생님, 여기입니다!!"
2005106-4 = "[s] \"오우, 어서 와 레이사!\""
2005106-5 = "후후, '우자와 레이사.'"
2005106-6 = "한 때는 그런 이름을 가진 적이 있었지요."
2005106-7 = "[s] \"엥???\""
2005106-8 = "'테르밋 핑크', 라고 불러주세요!"
2005106-9 = "[s] \"각성했구나!!\""
2005106-10 = "왓하하!"
2005106-14 = "흐으윽……."
2005106-15 = "두 번이나 옷에 갇히다니……."
2005106-16 = "체념해 버렸습니다……."
2005106-17 = "[s] \"피할 수 없으면 즐겨야지!\""
2005106-18 = "으음, 확실히 좋아하는 코스튬을 입으니 좋긴 하지만요!"
2005106-19 = "하지만 벌써 순찰 시간입니다!"
2005106-20 = "순찰 나가기 전에 기분 전환 겸 입어봤는데,"
2005106-21 = "이렇게 될 줄은 몰랐습니다!!"
2005106-22 = "어서 옷을 갈아입고 순찰을 돌아야……."
2005106-27 = "어이, 이거 어쩔 거야? 아앙?"
2005106-28 = "어깨 부러진 것 같은데? 아야~!!"
2005106-29 = "어, 억지에요!! 실수로 어깨를 부딪힌 것뿐이잖아요!"
2005106-30 = "지금 사람을 쳐놓고 당당하네?"
2005106-31 = "치료비는 알아서 지갑에서 꺼내 가면 되는 거지?"
2005106-32 = "흐어엉 하지 마세요!!"
2005106-37 = "멈추세욧!"
2005106-42 = "뭐야? 이상한 옷 입고 있고."
2005106-43 = "공주님이냐?"
2005106-49 = "아니, 요정인가?"
2005106-55 = "저리 가시지! 지금 사람이 사업 중인데!"
2005106-61 = "으아악!! 어, 어깨가!!!"
2005106-62 = "진짜 부러진 것 같아 으아아악!!"
2005106-64 = "당장 사과하세요!!"
2005106-66 = "크아악, 미, 미안합니다!! 자해공갈해서 죄송합니다!!"
2005106-67 = "어, 어어…… 네, 뭐……."
2005106-69 = "두 개 더 사과하세요!!!! 공주라든지, 요정이라든지!!!"
2005106-70 = "뭔 소리야, 그게?!"
2005106-72 = "아이구 우리 둥둥이 어떡해!!"
2005106-73 = "우리 둥둥이가 나무에 걸렸어요!!"
2005106-74 = "음!"
2005106-75 = "이번엔 고양이가 나무에 올라간 건가요!"
2005106-76 = "바로 출동입니다!"
2005106-82 = "읏차!"
2005106-83 = "나무 위에 고양이는 없고, 웬 드론은 하나 있는데요?"
2005106-84 = "아이구 우리 둥둥이 많이 무서웠지!!"
2005106-85 = "정말 감사합니다, 나무에 걸리는 바람에 그만!!"
2005106-86 = "네????"
2005106-88 = "아이구 이런!! 도와줘요!!"
2005106-89 = "갑니다!!"
2005106-91 = "오늘따라 유독 여러 가지 일이 일어났습니다."
2005106-92 = "옷을 갈아입을 새도 없었습니다."
2005106-93 = "[s] \"그래도 이젠 좀 일단락된 것 같네.\""
2005106-94 = "후후, 자경단의 에이스에게 이 정도쯤이야!"
2005106-95 = "슬슬 돌아가야-"
2005106-100 = "으앙-! 내 연!!"
2005106-101 = "강으로 떨어지고 있어!!"
2005106-102 = "공작 숙제로 만든 건데 으앙-"
2005106-103 = "!!"
2005106-104 = "저 아이의 노력의 결정체, 지켜야 합니다!"
2005106-105 = "히-얏!!!"
2005106-112 = "[wa:1910]― [log=레이사 매지컬]세이-프!![/log]"
2005106-115 = "― [log=레이사 매지컬]후후……[wa:1500] 연의 평화는[wa:808] 지켜졌습니다![/log]"
2005106-117 = "― [log=레이사 매지컬]물에 떨어지기 직전![wa:1850] 이렇게 잡아냈으니까요![wa:120] [/log]"
2005106-120 = "[ns] \"레이사, 괜찮아?\""
2005106-122 = "[wa:540]― [log=레이사 매지컬]모두를 위해서라면,[wa:1280] 자경단은[wa:520] 주저하지 않습니다![/log]"
2005106-125 = "― [log=레이사 매지컬]불 속이건, [wa:1310]물 속이건,[wa:40] [/log]"
2005106-127 = "― [log=레이사 매지컬]어디든지 [wa:760]뛰어들 테니까요! [wa:1770]니헤헤-[wa:120] [/log]"
2005106-130 = "[ns] \"흠뻑 젖었잖니, 감기들라.\""
2005106-131 = "[wa:570]― [log=레이사 매지컬]영웅의 [wa:670]옷이란 자고로, [/log]"
2005106-133 = "― [log=레이사 매지컬]영웅의 [wa:810]일을 할 때야말로 [wa:1800]빛나는 법![/log]"
2005106-136 = "― [log=레이사 매지컬]그리고,[wa:690] 이건 세탁기에 돌려도 [wa:1560]괜찮거든요![/log]"
2005106-139 = "[wa:1736]― [log=레이사 매지컬]게다가……[wa:1675] 선생님께 [wa:320]배웠으니까요.[wa:40] [/log]"
2005106-141 = "― [log=레이사 매지컬]주저하지 않는 자야말로, [wa:1580]모두를 지킬 수 있다, [wa:1530]라고요![wa:950] 에헤헷![/log]"
2005106-144 = "[wa:380]― [log=레이사 매지컬]헤헤,[wa:790] 에, [wa:210]엣……[wa:80] [/log]"
2005106-146 = "― [log=레이사 매지컬]에츄!![wa:80] [/log]"
2005106-149 = "― [log=레이사 매지컬]우으으…….[/log]"
2005106-152 = "(기특한 레이사를 샬레로 데려갔다.)"
2005106-153 = "(씻고 푹 쉬게 했다.)"
