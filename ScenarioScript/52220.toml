[translation]
52220-1 = "제22화;축제는 계속되어야 한다"
52220-5 = "카호 님, 카호 님!"
52220-6 = "……또 무슨 일이 있기에 이리 호들갑이신가요."
52220-7 = "와라쿠 축제의 개회까지 1시간도 남지 않았으니, 어지간히 급한 일이 아니라면 음양부 부실에 계신 니야 님께 전달해 달라고 말씀드렸을텐데요."
52220-8 = "설마, 니야 님이 또 도망치셨나요?"
52220-9 = "네, 니야 님은 '또' 사라지셨습니다. 그런데 그것보다……"
52220-10 = "이렇게 중요한 때 또 자리를 비우시다니. 이번만큼은 절대로 게으름 피우지 마시라고 신신당부를 했었는데……!"
52220-11 = "그나저나, '그것보다—' 라니요?"
52220-12 = "와라쿠 축제를 앞둔 이 때에 니야 님이 사라진 것보다 더 큰 문제가 생겼단 말씀이신가요?"
52220-13 = "설마 마이 스위트 아이돌, 치세 쨩의 신변에 무슨 문제라도—"
52220-14 = "나는 여기 있어~"
52220-15 = "아, 치세 쨩. 다행히 무사했군요."
52220-16 = "그럼 치세 쨩의 일도 아니라면 무슨 문제가……?"
52220-17 = "그게…… 직접 나와서 보시는 게 빠를 것 같습니다."
52220-21 = "이게, 도대체……"
52220-22 = "학원 전체를 둘러싼 저 눈은 도대체, 무엇이지요?"
52220-23 = "온 사방에 데굴데굴 눈알이 한가득—"
52220-24 = "그게…… 조금 전, 갑자기 행사장 주변에 거대한 눈 모양의 기물이 잔뜩 나타났습니다."
52220-25 = "마츠리부의 시즈코 씨도 아는 바가 없다고 하셨습니다만, 혹시라도 카호 님께서 따로 준비하신 와라쿠 축제의 특별 어트랙션일까 싶어서."
52220-26 = "치세 쨩의 귀여움을 어필하는 행사에 저런 흉측한 기물을 설치할 리가 없잖습니까!"
52220-27 = "그나저나 시즈코 씨도 아는 바가 없다면, 저 눈들은 도대체—"
52220-33 = "저 꺼림칙하고 낯이 익은 시선은, 어쩐지 전에 마주한 적이 있는 기분입니다만……"
52220-34 = "카호, 저 커다란 눈이랑 눈싸움해도 돼~?"
52220-35 = "안 됩니다!"
52220-38 = "으엑, 뭐야? 이 눈알들은."
52220-39 = "기분 나빠…… 살아 있는 것처럼 계속 깜박거리고 있잖아."
52220-40 = "혹시 총으로 쏴 버리면 겁을 먹고 도망치지 않을까?"
52220-41 = "자, 잠시만 기다려 주세요. 정체를 파악하기 전까지 불필요하게 기물을 자극하는 것은 피해야—"
52220-45 = "총알이…… 그대로 관통했어?"
52220-46 = "도대체 이게 뭐지? 뭔가 신기루를 쏘는 듯한 기묘한 느낌인데—"
52220-54 = "으악, 더 늘어나기 시작했어!"
52220-55 = "게다가 이건…… 지난번 화재 때의 그 괴물……"
52220-56 = "우, 우리가 어찌 할 수 있는 상대가 아니야…… 모두 도망쳐!"
52220-60 = "……츠쿠모가미."
52220-61 = "화조풍월부가 만들어 낸 괴이로군요."
52220-62 = "하필이면 백화요란이 자리를 비운 이 시기에 나타나다니……"
52220-63 = "아니, 오히려 일부러 이 시기를 노리고 왔을 가능성도 배제할 수 없겠군요. 어느 쪽이든 타이밍이 좋지 않아요."
52220-64 = "카, 카호 님. 저희는 어찌하면 좋을까요?"
52220-65 = "우선 축제장에 있는 모든 관객과 스태프에게 방송을 통해 알리세요. 절대로 저 괴물과 교전해서는 안 된다고!"
52220-66 = "그리고 나머지 인원들은 가능한 저 눈의 시야가 닿지 않는 장소까지 시민들을 대피시켜 주세요!"
52220-67 = "하, 하지만 온 학원에 저 눈의 시선이 닿지 않는 곳이 없는데. 어디로 도망쳐야 하나요?"
52220-68 = "그, 그건 그러니까……"
52220-70 = "카호 부부장님! 눈알에 이어 지난번 화재 때 나타났던 것과 같은 낡은 물건 형태의 괴물이 나타나 시민들을 습격하고 있다고 합니다!"
52220-71 = "도망치는 곳마다 지켜보고 있었던 것처럼 괴물이 길목을 차단해서……"
52220-72 = "어디로 가도 저 시선에서 벗어날 수가 없습니다!"
52220-77 = "이대로라면 와라쿠 축제의 진행은 불가피……"
52220-78 = "……카호 님, 저희는 어찌하면 좋을까요?"
52220-80 = "……니야 님."
52220-81 = "최소한 니야 님만이라도 이 장소에 있었더라면."
52220-82 = "제가 할 수 있는 일이라고는 현상을 파악하고, 상황을 정리하는 것뿐이라."
52220-83 = "저는, 이 위기를 타개할 묘책 같은 건 떠올릴 수가 없는데……."
52220-87 = "……카호."
52220-88 = "미안해요, 치세 쨩."
52220-89 = "그동안 열심히 준비했지만, 아무래도 이번 와라쿠 축제는 중단해야—"
52220-90 = "아니. 그게 아니야."
52220-91 = "저기에, 닌자가 있어."
52220-92 = "닌자……?"
52220-98 = "인법연구부, 여기에 등장!"
52220-99 = "카호 공, 무사하셨군요!"
52220-100 = "가, 갑자기 괴물들이 나타나서 따돌리느라…… 시간이 걸렸어요!"
52220-102 = "인법연구부 여러분? 여기에는 어쩐 일로……"
52220-103 = "혹시 이 괴물들을 함께 무찌르기 위해 와 주셨나요?"
52220-104 = "무, 물론 그쪽도 도울 수 있다면 돕겠지만, 지금은 더 급히 전달해야 할 일이 있다고 할까……"
52220-105 = "네, [USERNAME] 선생님께서 저희에게 따로 부탁하신 일이 있었거든요!"
52220-106 = "니야 님의 전갈을 가지고 돌아왔습니다, 닌닌!"
52220-107 = "[USERNAME] 선생님……? 그리고, 니야 님의 전갈……?"
52220-109 = "(약 30분 전……)"
52220-112 = "냐하하…… 이것 참, 꼴사납게 당해버렸네."
52220-113 = "역시 썩어도 준치. 그림자라 할지라도 백화요란의 부장은 그리 호락호락한 존재가 아니라는 건가."
52220-114 = "역시 만만한 상대가 아니라니까, 아야메 부장은~"
52220-119 = "슬슬 괴담이 퍼질 시기인가."
52220-120 = "여기까지는 예견한 상황이라 할 수 있겠지만, 이렇게 묶여 있어서야 사건이 흘러가는 걸 관망할 수밖에 없으니."
52220-121 = "아아~ 최소한 이렇게 될 줄 알았더라면, 쓸 수 있는 패 하나 정도는 남겨 둘걸 그랬네."
52220-128 = "니야 공!"
52220-129 = "니야 부장, 우리가 구하러 왔어!"
52220-130 = "괘, 괜찮으신가요. 니야 부장님?"
52220-131 = "……인법연구부 여러분? 이 장소는 어떻게 알고……"
52220-132 = "사실 아까 전부터 계속 따라왔었습니다!"
52220-133 = "그게, 사실 선생 공이 떠나기 전에 따로 우리에게 특별히 의뢰를 했었거든."
52220-134 = "선생님이 여러분께 의뢰를요……?"
52220-135 = "네, 넵! 백화요란 여러분께서 자리를 비우면 음양부를 노리는 무리가 있을지도 모른다고, 니야 부장님을 몰래 호위해달라고 부탁하셨거든요……"
52220-136 = "후후, 어둠 속에서 은밀히 대상을 호위하는 것도 닌자의 임무이니까!"
52220-137 = "그렇다는 말은, 아까 아야메 부장의 그림자가 저를 습격했을 때부터 지켜보고 계셨다는 말씀……?"
52220-141 = "그, 그게 그러니까…… 아야메 부장이 니야 부장을 갑자기 습격했을 때, 당황해서 바로 대처하지 못한 건 사실이지만……"
52220-142 = "그때 우리가 가세했다 하더라도 아야메 부장을 막을 순 없었을 거야."
52220-143 = "소, 솔직히 그 움직임을 지켜보는 것만으로도 발이 떨어지지 않았을 정도였어요……"
52220-144 = "하, 하지만 언제나 정면승부만이 상책은 아니니까!"
52220-145 = "불리한 상황을 피해 유리한 때를 기다렸다가, 허를 찌르는 것 또한 닌자의 기책!"
52220-146 = "그래서 니야 공이 혼자 남을 때까지 몰래 뒤를 밟아 따라왔지!"
52220-147 = "과연, 부장! 살금살금의 술법이로군요!"
52220-148 = "자, 니야 공! 지켜보는 사람이 없는 지금, 어서 우리와 함께 여기를 빠져나가는 거야!"
52220-149 = "……아니, 이제는 어디로도 도망칠 수 없습니다."
52220-150 = "네……?! 어, 어째서인가요?"
52220-151 = "괴담과 함께 백귀야행을 뒤덮고 있는 저 눈, 히토츠메 때문입니다."
52220-152 = "히토츠메는 어디서나 바라볼 수 있는 동시에, 모든 것을 바라보는 눈."
52220-153 = "저 눈이 백귀야행을 뒤덮고 있는 한, 백귀야행에서 벌어지는 모든 일은 그녀의 시야 아래에 있다고 해도 과언이 아니지요."
52220-154 = "백귀야행을 빠져나가려고 해도, 외부에서 백귀야행으로 들어오려 해도, 아야메와 백물어가 이를 보고 먼저 움직일 것입니다."
52220-155 = "아니, 어쩌면 저희가 도망칠 계획을 짜고 있는, 지금 이 상황도 지켜보고 있을지도요?"
52220-156 = "우, 우리의 계획이 들켰다고? 어, 어디서 지켜보고 있었단 말이야?"
52220-161 = "저, 저쪽이냐?! 아니면 저쪽?!"
52220-162 = "어, 어쩌죠……? 그럼 저희는 이대로 어떤 계획을 세우더라도, 꼼짝없이 황혼에 잡아먹히고 말 텐데……"
52220-163 = "츠쿠요 공, 그렇다고 해도 포기해서는 안 됩니다!"
52220-164 = "주군의 명령을 지키기 위해서라면 어떤 위태로운 상황에서도 전력을 다하는 것이 닌자니까요!"
52220-165 = "후후, 그 말이 옳습니다."
52220-166 = "비록 고립무원, 진퇴유곡의 상황이지만 아무것도 하지 않을 수는 없으니까요."
52220-167 = "저희는 언제나 그랬던 것처럼 '조화롭게' 하던 일을 계속하면 되는 것이랍니다."
52220-168 = "인법연구부 여러분. 저를 구하는 대신, 와라쿠 축제장에 있을 카호에게 제 말을 전달해 주시겠어요?"
52220-172 = "—축제는 어떤 상황에서도 계속되어야 한다고."
52220-174 = "니야 님이…… 그렇게 말씀하셨다고요?"
52220-175 = "그렇다니까! 이렇게 혼란스러운 상황에 와라쿠 축제를 속행하라니, 이게 가능한 일이긴 하냐구~!"
52220-176 = "하, 하지만 음양부의 부장님이 그렇게 말씀하셨다면…… 뭔가 특별한 계책이라도 있는 게 아니실까요?"
52220-177 = "혹시 니야 님께서 그 이외의 말씀은 없으셨나요?"
52220-178 = "그, 글쎄…… 음양부의 목적은 백귀야행의 균형을 유지하는 데 있으니, '조화롭게' 하던 일을 계속하라고……"
52220-182 = "……그렇군요."
52220-183 = "인법연구부 여러분, 여기까지 오시느라 수고가 많으셨습니다만, 한 가지만 더 부탁드려도 괜찮을까요?"
52220-184 = "네, 이즈나에게 맡겨만 주세요!"
52220-185 = "지금 바로 마츠리운영관리부의 시즈코 씨를 모시고 와 주시겠어요?"
52220-190 = "마츠리부가 도착하는 대로…… 와라쿠 축제를 속행하겠습니다!"
52220-192 = "다음화;사면화락"
