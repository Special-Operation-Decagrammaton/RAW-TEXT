[translation]
10040060-1 = "제6화;날 기억해 줘!!"
10040060-4 = "도착인가요. 여기가 바로……."
10040060-5 = "네. 지금은 사용되지 않는, 버려진 지 오래된 지하 통로 중 하나입니다."
10040060-6 = "CCTV도 없고, 별도의 감지 시스템도 없습니다. 사실상 세미나 소유지일 뿐 건물 밖이라고 봐도 무방하죠."
10040060-7 = "그, 그렇군요……. 으으……."
10040060-8 = "뭔가 분위기가요. 좀 무섭네요. 인기척도 없고, 스산하고 어둡고."
10040060-9 = "진짜 엄청 오래돼 보이는데, 이런 곳에 길이 있었다니……."
10040060-10 = "애초에 그게 여기로 온 목적이니까. 저쪽도 원격으로는 제어할 수 없는 구역이잖아."
10040060-11 = "그, 그렇긴 한데……. 뭔가……."
10040060-15 = "으음. 아무것도 아니에요. 기분 탓이겠지요."
10040060-17 = "……?"
10040060-18 = "시간이 많지 않습니다. 여기까지 왔으니, 이젠 앞으로 나아갈 수밖에 없어요. 끝까지 가면 출구가 나올 겁니다."
10040060-19 = "사실 더 깊은 곳으로 들어가면 저희들조차도 지원이 어려워지니 걱정도 있습니다만……."
10040060-20 = "[s1] \"두 사람도?\"\n[s2] \"전파가 아예 안 닿는 거야?\""
10040060-23 = "그렇습니다. 아마 저 앞으로 더 들어가시면 당분간 연락도 끊길 것입니다."
10040060-24 = "길이 다소 복잡하긴 하지만 잃을 정도는 아니고, 미리 알려드렸으니 괜찮으실 겁니다."
10040060-25 = "반대쪽으로 도착해서 나가면, 세미나로부터 조금 떨어진 골목의 지하도로 이어질 거야."
10040060-26 = "마키에게는 그쪽으로 장소를 옮겨 달라고 연락해 두었어. 접선한 뒤 탈출하면 돼."
10040060-28 = "그건 그렇고 진짜 너무 어두워서 앞이 안 보이네요. 이거 가다가 넘어지는 거 아니에요?"
10040060-29 = "어디 걸려서 빠지거나 하면 큰일인 것 같은데……. 불은 못 켜나요?"
10040060-30 = "여기 숨어 있다고 동네방네 홍보라도 할 생각입니까……."
10040060-31 = "[s3] \"아니. 그래도 다치는 건 안 돼.\"\n[s4] \"위험한 건 피해야지. 불을 켜자.\""
10040060-34 = "……? 선생님까지……?"
10040060-35 = "거기도 길이라고 만들어 둔 곳이니 당연히 불을 켤 수는 있어. 말했듯이, 문제는 그다음이지."
10040060-36 = "불을 켜면 전력 사용량이 바뀌며 제어실에서 변화가 있다는 사실을 알게 될 거야. 다시 말해 확실히 들킨다는 이야기야."
10040060-37 = "물론 잡히기 전에 미리 내달려 그곳을 빠져나가 버리면 아무 문제가 없을 수도 있지만……."
10040060-38 = "그걸로 괜찮을까? 선생님은 그쪽이 더 낫다고 생각하는 거야?"
10040060-39 = "……응? 그래도 그렇다고?"
10040060-40 = "어쨌거나 코유키나 쫓아오던 두 사람이 다치는 것만큼은 용납할 수 없어……?"
10040060-44 = "……후우. 그렇게 나오는 거야?"
10040060-45 = "정말로 선생님다운 대답이시군요. 그러시다면 어쩔 수 없죠."
10040060-46 = "오른쪽 옆 벽을 돌아가시면 바로 전원 스위치가 있을 것입니다. 올리시면 전반적으로 불이 들어올 거예요."
10040060-47 = "말씀드렸듯 켜면 이제 통제실에서 전력 사용량의 변화를 느낄 테니, 최대한 빨리 그곳을 벗어나세요."
10040060-48 = "네-! 제가 갑니다-! 자, 자. 오른쪽 벽~. 오른쪽 벽 옆~."
10040060-49 = "어디 보자~. 이건가……!"
10040060-54 = "……됐나?"
10040060-55 = "뭔가 돌아가는 것 같기도……."
10040060-61 = "뭐, 뭐!? 뭐죠?! 무슨 소리죠……!? 불 켜지는 데에 이런 소리가 나나요!? 보통 아니잖아요!?"
10040060-62 = "감지되는 소리는……."
10040060-63 = "……접근! 병력입니다! 비행체……? 드론……?"
10040060-64 = "네에에에에에-!? 어, 어째서!? 어째서 드론!?!?"
10040060-65 = "[ns5] \"처음부터 대기하고 있던 건가!?\"\n[ns6] \"이렇게 빠른 대응!? 어떻게……?!\""
10040060-68 = "이, 일단 그곳을 빠져나와야 해! 아니, 빠져나온다는 말은 이제 할 수 없나……!"
10040060-69 = "달려, 두 사람!! 무조건 앞으로 달려!!"
