[translation]
2002002-1 = "천재 해커의 취향"
2002002-2 = "(그렇게 히마리의 호출을 받고 밀레니엄 학원의 동아리관까지 찾아오게 되었다.)"
2002002-5 = "밀레니엄 제8동아리관 복도"
2002002-7 = "[ns] \"히마리가 알려준 장소는 여기인데, 여기서 어떻게 해야…….\""
2002002-11 = "(그때 무언가가 바람 소리를 내며 근처로 다가왔다.)"
2002002-15 = "[ns] \"이건…… 밀레니엄의 경비 드론?\""
2002002-23 = "[ns] \"어, 이쪽으로 오라고……?\""
2002002-28 = "(드론이 이끄는 대로 이동해 도착한 곳은, 제법 으슥한 구석에 놓인 동아리실의 문 앞이었다.)"
2002002-32 = "(문 바로 옆에 부착된 명패엔 이런 글이 쓰여 있었다.)"
2002002-33 = "[ns] \"<원주율 숨 안 쉬고 오래 외우기 동아리>……?\""
2002002-40 = "기다리고 있었습니다. 선생님. 들어오세요."
2002002-50 = "후후, 늦지 않게 와 주셨군요. 어서 오세요. 선생님."
2002002-54 = "네, 여기까지 안내해줘서 고마워요. 그럼 다시 업무로 돌아가 주세요."
2002002-60 = "[ns] \"히마리? 방금 그 드론은…….\""
2002002-61 = "아, 그거라면 밀레니엄의 경비 드론이에요."
2002002-62 = "저는 병약한 미소녀라서 직접 마중을 나가기가 어렵다 보니, 선생님의 안내역으로 마침 적당히 주변에 돌아다니는 걸 가볍게-"
2002002-68 = "네, 해킹했답니다."
2002002-69 = "길 안내역으로는 제격이었죠?"
2002002-70 = "좋은 아이들이랍니다. 제법 귀엽기도 하고요. 드론."
2002002-74 = "[ns] \"또 아무렇지도 않게 그런 일을…….\""
2002002-76 = "[ns1] \"그래서 여긴 뭐 하는 곳이야?\"\n[ns2] \"명패에도 어쩐지 묘한 이름이 쓰여 있었는데.\""
2002002-79 = "어, 어라? 그, 그, 그렇게 이상한 이름인가요?"
2002002-80 = "……좋은 이름이 어디 없을까. 사흘 밤낮을 고민한 끝에 떠올려낸, 무척이나 이지적이고 인텔리 하면서 정체를 숨기기에 딱 맞다고 생각한……."
2002002-81 = "그야말로 밀레니엄의 천재 우등생다운 작명이라고 생각했었는데……."
2002002-82 = "[s] (눈에 띄게 시무룩한 얼굴이네……!)"
2002002-84 = "[ns] \"아니, 그, 묘하다고 할까. 개성 넘치고, 응, 좋다고 생각해.\""
2002002-85 = "……후후훗, 그런가요?"
2002002-86 = "네, 그럴 거라고 생각했답니다♪"
2002002-87 = "누가 뭐라고 해도 밀레니엄의 최고 천재 청초 병약 미소녀-"
2002002-88 = "저 아케보시 히마리의 작명이니까!"
2002002-92 = "[ns] \"……그래서 히마리는 왜 여기에?\""
2002002-93 = "아, 그런 이야기를 하고 있었죠."
2002002-94 = "설명하자면, 그렇군요. 이곳은 저만의 비밀스러운 <은신처>라고 해둘까요?"
2002002-95 = "[s] \"은신처?\""
2002002-96 = "네. 기존에 사용하고 있는 특무부실이나 베리타스의 부실 같은 경우엔, 아무래도 <빅 시스터>의 감시가 미치고 있으니까요."
2002002-97 = "그러니 이런 식으로 밀레니엄의 행정 전산 시스템을 해킹해서, 사용하지 않는 부실의 이용권리를 받아낸 뒤 저만의 공간으로 만든 거예요."
2002002-98 = "왜 그런 일까지 하냐고요?"
2002002-99 = "물론 휴식을 위해서죠. 저 같은 초천재 병약 미소녀에겐 잠자는 시간이……."
2002002-100 = "아니, 뇌를 쉬어주는 것이 무척이나 중요하니까요."
2002002-101 = "[s3] \"과연…… 하지만 오는 길에 들키면 위험한 거 아냐?\"\n[s4] \"아까 봤던 드론이라거나, 밀레니엄에 있는 CCTV라거나…….\""
2002002-102 = "후후후. 물론 그 정도 이슈라면 이미 충분히 대응하고 있답니다?"
2002002-103 = "후후후. 물론 그 정도 이슈라면 이미 충분히 대응하고 있답니다?"
2002002-104 = "드론의 통상 경비 루트를 파악하는 것쯤이야 식은 죽 먹기보다 간단한 일이고. 필요하다면 해킹으로 개입해서 루트를 손보는 것도 간단."
2002002-105 = "때로는 CCTV의 순환 감시를 살짝 간섭하기도 하면서……. 이동에 필요한 사각지대는 얼마든지 만들고 있어요."
2002002-111 = "문자 그대로 제 여가생활에 사각은 없답니다! 엣-헴!"
2002002-112 = "[s5] \"그야말로 규모가 다른 이야기구나…….\"\n[s6] \"그런데 그렇게나 중요한 곳이라면, 내가 와도 괜찮은 건가?\""
2002002-115 = "아, 네, 그거라면…… 괜찮아요."
2002002-116 = "오히려 와 주셔서 감사하다고 할지. 아니, 꼭 와 주셔야만 했다고 할지."
2002002-117 = "[s] \"응?\""
2002002-118 = "선생님께서도 아시다시피, 저란 존재는 평소 모두가 동경하는 대상. 절벽 위에 피어난 한 떨기의 청초한 꽃."
2002002-119 = "가만히 있어도 작약, 앉아 있기만 해도 모란, 그저 한숨짓는 모습을 보여주기만 해도 백합-이라는 평가를 받고 있는 천재 미소녀이지만."
2002002-120 = "[s] \"망설임이라고는 하나도 찾아볼 수 없는 자기 PR이구나!\""
2002002-121 = "그렇기에 더욱 섣불리 다른 사람에게 빈틈을 보일 수는 없다고 생각해요."
2002002-122 = "하지만……. 아무리 저같이 단점 하나 찾을 수 없는 완벽한 미소녀라도 늘 긴장만 하고 살 수는 없는 법."
2002002-123 = "엣-헴. 그러니까 무슨 이야기냐면."
2002002-124 = "조금쯤은, 그, 마음을 푹 놓을 수 있는 시간이라고 할지……."
2002002-125 = "아무런 대가 없이도 다가와 주고, 믿고 함께할 수 있는 사람이."
2002002-126 = "제 본연의 모습을 보아도 화를 내지도, 핀잔도 주지 않던 사람이, 때마침 근처에 있지 않았던가~? 하는 생각에."
2002002-127 = "그게, 그러니까."
2002002-128 = "[s] \"그러니까……?\""
2002002-129 = "……모처럼의 은신처까지 마련하는 데는 성공했지만. 역시 혼자만 있는 건 심심하니까."
2002002-130 = "……선생님이라면, 그게……."
2002002-131 = "제 말 상대가 되어 주시지는 않을까-하는 아주 약간의, 그게."
2002002-132 = "욕심이라고 할지. 바람이라고 할지……."
2002002-133 = "그런…, 이유 때문에, 으음."
2002002-134 = "이 자리에 모셨다고나 할지……."
2002002-135 = "(힐끔)"
2002002-136 = "[s] \"응, 뭐, 그런 용무라면 얼마든지 환영이야. 히마리.\""
2002002-137 = "……아."
2002002-138 = "[s] \"응? 히마리? 왜 그래?\""
2002002-142 = "아, 아뇨."
2002002-143 = "후후후……. 역시나 제 예상대로네요-라고 생각했을 뿐이에요."
2002002-144 = "저의 뛰어난 두뇌가 사전에 시뮬레이트한 결과와 똑같은 결과로군요. 음. 역시 제 승리네요."
2002002-148 = "[ns] \"승리나 패배와 관련된 이야기였나……?\""
2002002-149 = "사소한 건 신경 쓰지 마시고……. 어울려 주시겠다고 하면 그걸로 충분해요."
2002002-150 = "아, 참고로 나중에 가서 무르고 싶다고 해도 안 되니까요?"
2002002-151 = "[s] \"그런 거라면 걱정 안 해도 돼, 히마리.\""
2002002-152 = "후후."
2002002-158 = "그럼 오늘 하루 잘 부탁드린답니다? 선생님."
2002002-161 = "(그렇게 히마리와 잠깐의 휴식 시간을 함께하며, 여유로운 오후 한때를 보내게 되었다.)"
2002002-166 = "……라면서 선생님과의 휴식을 손에 넣은 지금."
2002002-167 = "평소의 저라면 이쯤에서 천재 병약 미소녀가 이루어 낸 또 하나의 성취에 <의기양양한 얼굴>을 지을 참이겠습니다만."
2002002-168 = "안타깝게도 최근에, 한 가지 마음대로 되지 않는 게 있어서 말이지요."
2002002-169 = "[s] \"어라? 뭔가 문제라도 있어?\""
2002002-170 = "문제라고 할 정도는 아니지만……"
2002002-171 = "선생님도 아시다시피, 밀레니엄 학원에서는 점심 무렵에, 방송부에서 신청곡을 틀어 주는 교내 방송을 하고 있잖아요?"
2002002-172 = "[s7] \"처음 듣는 정보인걸!\"\n[s8] \"아, 응, 그, 그랬지? ……어, 그랬나?\""
2002002-175 = "그 어떤 밀레니엄의 학생이라도 신청할 권리가 있는 그 방송에서……."
2002002-176 = "어째서인지 제 곡은 전혀 선정해주지 않는 거 있죠?!"
2002002-177 = "지금까지 몇 번이나, 몇 번이나 신청을 했는데. 대체 왜 뽑아주지 않는 걸까요? 선생님께서는 어째서라고 생각하시나요?"
2002002-178 = "설마 저의 감성이 너무 앞서 나간 나머지, 평범한 학생 여러분과는 더는 돌아올 수 없는 차이를 만들고야 말았다는 비극……?"
2002002-179 = "저, 눈치채지 못한 사이에, 비련의 히로인이 되어버린 게?"
2002002-180 = "[s] \"아니, 아무래도 그렇지는 않겠지…….\""
2002002-181 = "저는 그저, 제가 좋아하는 멋진 노래를 밀레니엄의 모두와 나누고 싶었을 뿐인데……."
2002002-182 = "……라며 아쉬워하기만 하던 저는 오늘부로 안녕."
2002002-183 = "오늘은 저와 선생님, 우리 두 사람의 은신처가 생긴 것을 기념하여……."
2002002-184 = "이번엔 조금 <특별한 방법>을 써보도록 하지요."
2002002-188 = "[ns] \"응……? 특별한 방법?\""
2002002-192 = "(그 순간 교실 스피커에선 교내 방송이 흘러나오기 시작했다.)"
2002002-197 = "네! 밀레니엄 정기 교내 방송을 듣고 계시는 애청자 여러분, 모두 안녕하신가요?"
2002002-198 = "오늘도 또 점심시간을 맞이해, 평소와 마찬가지로 돌아온 사연 신청곡 코너!"
2002002-199 = "그럼 바로 이번 신청자분인데요."
2002002-203 = "닉네임이……."
2002002-207 = "<밀레니엄 최고의 청초한 미소녀>……? 또 이 사람이야?"
2002002-208 = "아, 마침 제가 신청한 곡이네요."
2002002-209 = "[s] \"그럴 거라고 생각했지만!\""
2002002-210 = "아니아니, 진짜 곤란하다니까."
2002002-215 = "다른 사람으로……"
2002002-216 = "뭐? 신청자가 그 이름밖에 없어? 나머지는 보는 앞에서 삭제돼? 해킹?"
2002002-217 = "무슨 소리야?"
2002002-218 = "……후후."
2002002-222 = "[ns] \"저기, 히마리……? 설마, 라고 생각하지만.\""
2002002-223 = "아무리 그래도 이 노래를 그대로 틀기에는 조금 저항감이……."
2002002-228 = "앗! 잠깐! 머, 멈춰! 왜 시스템이 멈추질 않는 거야?!"
2002002-232 = "방송기기가 제멋대로 작동을?!"
2002002-244 = "(그 직후, 스피커에선 구슬픈 곡조를 가진 엔카가 흘러나오기 시작했다.)"
2002002-248 = "[ns] \"히마리가 평소 좋아하는 멋진 노래라는 게…….\""
2002002-249 = "이전에 엔지니어부의 부장에게 추천받은 곡이랍니다."
2002002-250 = "[s] \"한 떨기의 청초한 꽃이 좋아하는 노래가 엔카…….\""
2002002-251 = "후후후, 조용히 은신처에 앉아, 함께하고 싶은 사람과, 또한 함께 좋아하는 노래를 듣는다."
2002002-252 = "그야말로…… 제법 정취가 있지요?"
2002002-256 = "[ns] \"뭐어, 으음.\""
2002002-258 = "[ns] \"응, 조금은…… 알 것 같아.\""
2002002-259 = "네, 그렇죠? 후후훗."
2002002-261 = "(여전히 스피커 너머로 들려오는 방송부원들의 소동과 엔카를 함께 들으며…….)"
2002002-262 = "(밤이 찾아올 때까지 히마리와 함께 시간을 보냈다.)"
