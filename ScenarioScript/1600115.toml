[translation]
1600115-1 = "สัญลักษณ์นำโชค"
1600115-2 = "(หลังจากได้รับข้อความจากอาสึนะ คุณครูก็ไปถึงสถานที่หนึ่งที่กำลังมีการต่อสู้อย่างดุเดือด)"
1600115-3 = ""
1600115-8 = "จริงๆ เลย~! แบบนี้การแฝงตัวก็หมดความหมายน่ะสิ!"
1600115-9 = "ยัย C&C นี่นะ ใส่ชุดนั้นมาแล้วบอกว่าเป็นการแฝงตัวงั้นเหรอ หน้าไม่อายจริงๆ!"
1600115-10 = "คิดว่าจะไม่สะดุดตาเลยหรือไง? หน้างานซื้อขายของเถื่อนวันนี้น่ะ การเฝ้าระวังมันเข้มงวดจะตายไป!"
1600115-11 = "แต่นี่มันเป็นเครื่องแบบนะ! จะให้ถอดได้ยังไง..."
1600115-12 = ""
1600115-14 = ""
1600115-15 = "หืม? หรือว่าควรถอดออกนะ?"
1600115-16 = ""
1600115-19 = "[ns1] \"ไม่ได้นะ!\"\n[ns2] \"อาสึนะ เดี๋ยวครูช่วยเอง!\""
1600115-22 = ""
1600115-23 = "ว้าว นายท่านนี่นา!!"
1600115-24 = "ดีละ~ ถ้างั้นก็แผน B! เริ่มบุกจากด้านหน้าค่ะ~!"
1600115-25 = ""
1600115-27 = ""
1600115-28 = "ขวางยัยนั่นไว้!"
1600115-29 = "อย่าให้บุกเข้ามาทำลายงานเด็ดขาด!!"
1600115-30 = ""
1600115-32 = ""
1600115-37 = "(การต่อสู้ที่ดุเดือดยังคงดำเนินต่อไป...)"
1600115-39 = "อึก น่าโมโหชะมัด... นึกว่าจะขวาง C&C ที่มาคนเดียวได้ซะอีก..."
1600115-40 = "เก่งสมคำร่ำลือเลยละ..."
1600115-41 = ""
1600115-43 = ""
1600115-46 = "[ns] \"อาสึนะ เป็นยังไงบ้าง?\""
1600115-47 = "อื้อๆ! ฉันไม่เป็นไรเลย!"
1600115-48 = "แต่โบว์ติดผมของฉันน่าจะหล่นหายระหว่างต่อสู้น่ะ ฉันขอไปหาก่อนนะ!"
1600115-50 = "อยู่ตรงนี้หรือเปล่าน้า~?"
1600115-51 = ""
1600115-54 = "หรือว่าตรงนี้~?"
1600115-55 = ""
1600115-58 = "ว้าก! น่องฉัน!"
1600115-59 = "ว้าย! ขอโทษ ขอโทษที!"
1600115-60 = "อ๊ะ ว่าแต่เห็นโบว์ติดผมสีฟ้าหล่นอยู่บ้างมั้ย?"
1600115-61 = "ใครจะไปเห็นล่ะ... ฉันยังเจ็บที่เธอยิงเมื่อกี้อยู่เลย..."
1600115-62 = "ซอรี่นะ นอนพักให้หายเจ็บก่อนแล้วกัน!"
1600115-63 = ""
1600115-66 = "อ๊ะ เจอแล้ว!! ลักกี้~!"
1600115-68 = "อะฮะฮ่า! นายท่าน~ รอนานหรือเปล่า?"
1600115-69 = "[s] \"เจอโบว์ติดผมแล้วเหรอ?\""
1600115-70 = "อื้อๆ! นี่ไง! โบว์ติดผมสีฟ้า"
1600115-71 = "โชคดีนะที่หาเจอ! ในเมื่อเสร็จภารกิจแล้ว งั้นเราไปรายงานผลกันเถอะ~"
1600115-73 = ""
1600115-75 = ""
1600115-76 = "[ns] \"จะว่าไป อาสึนะติดโบว์ติดผมตลอดเลยนะ\""
1600115-77 = "อื้อ ใช่แล้วละ! นายท่านรู้อยู่สินะเนี่ย!"
1600115-78 = ""
1600115-80 = ""
1600115-82 = "มันเป็นไอเทมนำโชคของอาสึนะน่ะ! หลังจากได้โบว์อันนี้มาติด อาสึนะก็รู้สึกว่าทุกอย่างราบรื่นไปหมดเลย"
1600115-83 = "ก็อย่างเช่น..."
1600115-84 = "อืม~! มันมีหลายเรื่องมากเลยละ!"
1600115-85 = "อ๊ะ จริงสิ"
1600115-86 = "มีครั้งหนึ่งที่อาสึนะมีสอบในวันรุ่งขึ้น แต่ขี้เกียจติวหนังสือ ก็เลยวาดรูปเล่นเรื่อยๆ จนเผลอหลับไป"
1600115-87 = "แต่พอติดโบว์อันนี้ไปสอบ ก็ตอบถูกทุกข้อเลย!!"
1600115-88 = "[s] \"ทุกข้อเลยเหรอ?!\""
1600115-89 = "อื้อ!! ถูกทุกข้อเลย!! สุดยอดไปเลยใช่มั้ยล่ะ?"
1600115-90 = "แล้วก็ แล้วก็!"
1600115-91 = "ร้านที่อาสึนะแวะไปบ่อยๆ มีของหวานพิเศษที่ขายแบบจำกัดจำนวนน่ะ#nเห็นว่าวันหนึ่งขายแค่ 20 ชิ้นเองนะ"
1600115-92 = "ต่อให้เป็นวันที่คิดว่าต้องไปซื้อไม่ทันแน่ๆ แต่ถ้าติดโบว์อันนี้ละก็ อาสึนะได้กินขนมทุกครั้งเลย! มีหลายครั้งด้วยที่อาสึนะได้ซื้อเป็นคิวสุดท้ายเลย!"
1600115-93 = "[s] \"ยอดไปเลยนะ!\""
1600115-94 = "ยังมีอีกนะ! มีเรื่องโชคดีแบบนี้ด้วย!"
1600115-95 = "ตอนนั้นอยู่ระหว่างการต่อสู้ แล้วกระสุนก็เหลือน้อยเต็มที! ถือว่าสถานการณ์วิกฤตเลยละ! แม็กปืนที่เตรียมมาต่างหากก็ใช้ไปหมดแล้ว แต่ศัตรูก็ยังเหลืออีกเพียบ!"
1600115-96 = "ฉันก็เลยเอาโบว์ติดผมบนหัวมาทำเป็นหนังสติ๊ก แล้วก็ชนะมาได้!"
1600115-97 = "[s] \"นะ... นั่นไม่น่าจะเกี่ยวกับโชคนะ...\""
1600115-98 = "โบว์ติดผมนำโชคที่คอยปกป้องอาสึนะไม่ว่าจะไปที่ไหน! มันเป็นไอเทมสำคัญขนาดนั้นเลยละ! "
1600115-99 = "ฮุฮุ มันดูไม่เก่าเลยใช่มั้ยล่ะ? ยังเหมือนใหม่อยู่เลย! อาสึนะดูแลมันอย่างดีเลยละ"
1600115-100 = "[s5] \"ถ้าโบว์ติดผมหล่นหายระหว่างการต่อสู้แบบวันนี้ล่ะ?\"\n[s6] \"ถ้าโบว์ติดผมหล่นหายไปจริงๆ จะทำยังไงเหรอ?\""
1600115-103 = "ถ้าหายไปจริงๆ ละก็?"
1600115-104 = "อืม..."
1600115-105 = "อืมม~~~~"
1600115-106 = "อืมมม~~~~~~"
1600115-107 = "[s] \"มะ... ไม่เป็นไรดีกว่า...! ครูก็ไม่น่าถามเลย...!\""
1600115-108 = "น่าจะไม่เป็นไรนะ!"
1600115-109 = "[s] \"หืม?\""
1600115-110 = "แน่นอนว่าอาสึนะคงเศร้าและเจ็บปวดมากแน่ๆ..."
1600115-111 = "แต่โชคดีที่สุดที่โบว์ติดผมอันนี้มอบให้"
1600115-112 = "อยู่ตรงหน้าอาสึนะในตอนนี้แล้วน่ะสิ!!"
1600115-113 = "ก็อาสึนะได้พบนายท่านแล้วยังไงล่ะ!!"
1600115-114 = "ต่อให้จะหายไปก็ไม่เป็นไรหรอก! อื้อ! ไม่เป็นไร!"
1600115-115 = "[s7] \"พูดจนครูซึ้งใจเลย!\"\n[s8] \"แต่ก็รักษาไว้ให้ดีล่ะ จะได้ไม่หายไป!\""
1600115-118 = "แหะๆ อื้อ!"
1600115-119 = "อาสึนะต้องระวัง ไม่ให้ทั้งนายท่านและโบว์ติดผมหายไปเลยละ~!"
1600115-121 = "(แล้วคุณครูกับอาสึนะก็เดินกลับและคุยเรื่องโชคดีที่ได้เจอด้วยกัน)"
