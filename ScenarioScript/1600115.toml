[translation]
1600115-1 = "幸運的象徵"
1600115-2 = "（收到明日奈的聯絡後前往的地方，正在如火如荼地交戰著）"
1600115-3 = ""
1600115-8 = "真是的～！這樣就失去潛入的意義了嘛！"
1600115-9 = "可惡的C&C，穿那套衣服潛入也太招搖了吧！厚臉皮也該有個限度！"
1600115-10 = "你該不會真以為自己不會被發現吧？#n尤其在今天這種交易現場，戒備可是非常森嚴的啊！"
1600115-11 = "可是這是我們的制服呀！又不能脫──"
1600115-12 = ""
1600115-14 = ""
1600115-15 = "對耶？脫掉不就好了嗎？"
1600115-16 = ""
1600115-19 = "[ns1]「不行！」\n[ns2]「明日奈，我來幫忙了！」"
1600115-22 = ""
1600115-23 = "哇！是主人！！"
1600115-24 = "好～那就執行B計劃！開始正面突破～！"
1600115-25 = ""
1600115-27 = ""
1600115-28 = "攔住那傢伙！"
1600115-29 = "不能讓他闖進去！！"
1600115-30 = ""
1600115-32 = ""
1600115-37 = "（於是激烈的戰鬥依舊持續……）"
1600115-39 = "可惡，真不甘心……本來以為有辦法攔住一個C&C的……"
1600115-40 = "果然名不虛傳……"
1600115-41 = ""
1600115-43 = ""
1600115-46 = "[ns]「明日奈，你還好嗎？」"
1600115-47 = "嗯！完全沒事！"
1600115-48 = "不過交戰的時候髮帶好像掉了，我去找一下！"
1600115-50 = "是這邊嗎～？"
1600115-51 = ""
1600115-54 = "還是這邊呢～？"
1600115-55 = ""
1600115-58 = "啊……！我的腳！"
1600115-59 = "哇！抱歉抱歉！"
1600115-60 = "啊，你有沒有看到藍色的蝴蝶結髮帶？"
1600115-61 = "不知道……我現在被你射到的地方超痛的……"
1600115-62 = "抱歉～繼續躺著休息吧！"
1600115-63 = ""
1600115-66 = "啊，找到了！！真幸運～！"
1600115-68 = "啊哈哈，主人～等很久了嗎？"
1600115-69 = "[s]「髮帶找到了嗎？」"
1600115-70 = "嗯！在這裡！我的藍色髮帶！"
1600115-71 = "幸好很快就找到了！#n任務完成，我們回去報告吧～"
1600115-73 = ""
1600115-75 = ""
1600115-76 = "[ns]「這麼說來，明日奈總是綁著那個髮帶呢。」"
1600115-77 = "沒錯！不愧是主人，果然有注意到呢！"
1600115-78 = ""
1600115-80 = ""
1600115-82 = "這是明日奈的幸運物品哦！#n只要綁上這個，事情都會變得特別順利。"
1600115-83 = "要我舉個例子？"
1600115-84 = "唔嗯～！其實有很多耶！"
1600115-85 = "啊，對了。"
1600115-86 = "有一次我明明隔天要考試卻不想讀書，所以就一直塗鴉塗到睡著為止……"
1600115-87 = "但是後來我綁著這個髮帶去考試，結果猜的答案全部都答對了！！"
1600115-88 = "[s]「全部！？」"
1600115-89 = "嗯！！全部！！厲害吧？"
1600115-90 = "還不只這樣哦！"
1600115-91 = "我常去的那間店裡有賣限量的特別甜點，一天大概只賣20個左右。"
1600115-92 = "就算我到的稍微有點晚，只要綁著這個髮帶就一定能吃到！#n而且有很多次都剛好在明日奈後面就賣完了呢！"
1600115-93 = "[s]「好厲害！」"
1600115-94 = "還有還有！也有這種情況！"
1600115-95 = "之前戰鬥到一半的時候沒子彈了！情況超級不妙！#n連備用的彈匣都用光了，敵人卻還剩下一大堆！"
1600115-96 = "所以我就用這個髮帶當成投石繩，把剩下的敵人全部打倒了！"
1600115-97 = "[s]「那，那好像跟幸運沒什麼關係吧……」"
1600115-98 = "總之就是這麼重要的寶物！#n這是一條無論走到哪裡都守護著明日奈的幸運髮帶！"
1600115-99 = "呵呵，完全看不出來已經用很久了對吧？#n因為我都有認真在保養，看起來就像全新的一樣！"
1600115-100 = "[s5]「不過如果像今天這樣，髮帶在戰鬥中鬆掉……」\n[s6]「真的弄丟的話該怎麼辦呢？」"
1600115-103 = "真的弄丟的話？"
1600115-104 = "嗯……"
1600115-105 = "唔嗯……"
1600115-106 = "唔唔唔……"
1600115-107 = "[s]「沒，沒事啦……！就當我沒問過吧……！」"
1600115-108 = "應該不會有問題！"
1600115-109 = "[s]「咦？」"
1600115-110 = "當然，我應該會超級超級難過……"
1600115-111 = "不過它帶給我最大的幸運……"
1600115-112 = "現在就在明日奈的眼前呀！！"
1600115-113 = "因為我已經遇見了主人！！"
1600115-114 = "所以就算弄丟了也沒關係！#n嗯，一定不會有問題的！"
1600115-115 = "[s7]「老師好感動！」\n[s8]「不過還是要小心別弄丟了哦！」"
1600115-118 = "嘿嘿，嗯！"
1600115-119 = "不管是主人還是髮帶，我都會更加珍惜的！"
1600115-121 = "（一邊和明日奈一起聊著至今為止覺得幸運的時刻，一邊踏上了歸途）"
