[translation]
1600115-1 = "Lucky Charm"
1600115-2 = "By the time I got there, Asuna was already in the thick of battle."
1600115-8 = "C'mooon! This really puts a damper on the whole \"infiltration thing,\" you know!"
1600115-9 = "Seriously?! You SERIOUSLY thought you could sneak in here with THAT outfit?"
1600115-10 = "If a MAID shows up to one of our trafficking gigs, of course security's gonna notice! It's teeming with guards here!"
1600115-11 = "But I can't just take off my uniform—"
1600115-15 = "Oh? Can't I just take it off?"
1600115-19 = "[ns1] \"No! You cannot!\"\n[ns2] \"I'll help you instead, Asuna!\""
1600115-23 = "Wooow! It's Master!!"
1600115-24 = "All righty! Time for plan B—we're breaking through!"
1600115-28 = "Stop her!"
1600115-29 = "Don't let her get to the worksite!"
1600115-37 = "The fierce battle continued..."
1600115-39 = "Tch, how frustrating...! We can't even stop ONE C&C member?"
1600115-40 = "That's the C&C for you..."
1600115-46 = "[ns] \"Are you okay, Asuna?\""
1600115-47 = "Yup, yup! Haven't even broken a sweat!"
1600115-48 = "But I need a sec! My hair ribbon went flying somewhere in the shuffle!"
1600115-50 = "Here, maybeee?"
1600115-54 = "Or here...?"
1600115-58 = "Ow! My leg!"
1600115-59 = "Ack! Sorry, sorry!"
1600115-60 = "Ah, have YOU seen a blue hair ribbon anywhere?"
1600115-61 = "I'm a little preoccupied with the BULLET WOUND you just gave me!"
1600115-62 = "My baaad! You just rest up right there!"
1600115-66 = "Ah, found it! Lucky!"
1600115-68 = "Master, master! Did ya wait long?"
1600115-69 = "[s] \"Did you find your hair tie?\""
1600115-70 = "Yup, yup! It's this blue ribbon! I use it to tie my hair."
1600115-71 = "Good thing I found it. Let's go make our report and wrap up this mission!"
1600115-76 = "[ns] \"Now that I think about it, you're always wearing that ribbon.\""
1600115-77 = "Aha! You noticed, Master?"
1600115-82 = "It's my lucky charm! Things in my life started working out better after I started wearing it!"
1600115-83 = "Like what?"
1600115-84 = "Hmm! So there's lots of things!"
1600115-85 = "Ah, right."
1600115-86 = "Like the time I was procrastinating studying for a test the next day, and I fell asleep doodling!"
1600115-87 = "But I wore this ribbon to the test and guessed all the answers right!"
1600115-88 = "[s] \"All of them?!\""
1600115-89 = "Yup!! Every single one!"
1600115-90 = "Oh, and, and!"
1600115-91 = "My favorite dessert spot usually only sells 20 servings a day of their special menu item, right?"
1600115-92 = "But, as long as I was wearing this ribbon, I'd be able to get one still! I was the very last person more than once!"
1600115-93 = "[s] \"That's incredible!\""
1600115-94 = "RIGHT?! But wait! There's MORE!"
1600115-95 = "Once, I ran out of ammo during the middle of battle! That's really bad, right? And there were still tooons of enemies!"
1600115-96 = "So I turned my ribbon into a sling and whacked them all on the heads until I won!"
1600115-97 = "[s] \"I don't know if 'luck' is the word I would use there...\""
1600115-98 = "That's how powerful it is! It's my lucky hair ribbon that protects me!"
1600115-99 = "Fufu, look, it's still in real good condition, right? Right? It's because I take super-good care of it!"
1600115-100 = "[s5] \"What if it falls out of your hair again?\"\n[s6] \"You could actually lose it one day.\""
1600115-103 = "Actually lose it?"
1600115-104 = "...Hm..."
1600115-105 = "...Hmm..."
1600115-106 = "Hmmm..."
1600115-107 = "[s] \"F-Forget I said that! I don't know why I did!\""
1600115-108 = "I think it would be fine!"
1600115-109 = "[s] \"Huh?\""
1600115-110 = "Of course, I might get very, very disappointed and sad..."
1600115-111 = "But this ribbon has already brought Asuna more than enough luck!"
1600115-112 = "The proof is right in front of me!"
1600115-113 = "I met you, didn't I, Master?"
1600115-114 = "So it'd be fine if I lost it! Yup! I'm 100% certain!"
1600115-115 = "[s7] \"I'm deeply moved by your words!\"\n[s8] \"But let's just try not to lose it!\""
1600115-118 = "Heehee, yup!"
1600115-119 = "Asuna will be careful not to lose either Master or my ribbon!"
1600115-121 = "Asuna and I chatted about more of our luckiest experiences as we headed back."
