[translation]
1600115-1 = "幸運的象徵"
1600115-2 = "（收到明日奈的聯絡後前往的地方，已經如火如荼地交戰著）"
1600115-8 = "真是的～！這樣就失去潛入的意義了嘛！"
1600115-9 = "穿那身衣服潛入也太招搖了吧！"
1600115-10 = "你真的以為不會被發現嗎？更何況今天是黑市交易現場，戒備可是非常森嚴的啊！"
1600115-11 = "但是這是制服啊！又不能脫──"
1600115-15 = "啊！脫掉不就好了嗎？"
1600115-19 = "[ns1]「不行！」\n[ns2]「明日奈，我來幫忙了！」"
1600115-23 = "哇！是主人！！"
1600115-24 = "好～那就執行B計劃！開始正面突破～！"
1600115-28 = "攔住那傢伙！"
1600115-29 = "不能讓他闖進去！！"
1600115-37 = "（就這樣激烈的戰鬥持續著……）"
1600115-39 = "嗚，不甘心……想說只有一個C&C的我們可以攔得住……"
1600115-40 = "名不虛傳……"
1600115-46 = "[ns]「明日奈，你還好嗎？」"
1600115-47 = "嗯！完全沒事！"
1600115-48 = "不過交戰的時候髮帶好像掉了，我去找一下！"
1600115-50 = "是這邊嗎～？"
1600115-54 = "還是這邊呢～？"
1600115-58 = "啊……！我的腳！"
1600115-59 = "哇！抱歉抱歉！"
1600115-60 = "啊，你有沒有看到藍色的蝴蝶結髮帶？"
1600115-61 = "不知道……我現在被你射到的地方超痛的……"
1600115-62 = "抱歉～繼續躺著休息吧！"
1600115-66 = "啊，找到了！！真幸運～！"
1600115-68 = "啊哈哈，主人～等很久了嗎？"
1600115-69 = "[s]「髮帶找到了嗎？」"
1600115-70 = "嗯！這裡！藍色髮帶。"
1600115-71 = "幸好很快就找到了！任務完成，回去報告吧～"
1600115-76 = "[ns]「說起來明日奈總是綁著那個髮帶呢。」"
1600115-77 = "對啊！不愧是主人，有注意到呢！"
1600115-82 = "這是明日奈的幸運物品哦！綁上這個之後事情都會特別地順利。"
1600115-83 = "例如？"
1600115-84 = "嗯……有很多耶……"
1600115-85 = "啊，對了。"
1600115-86 = "有一次隔天要考試，超不想念書的就只顧著塗鴉然後睡著了。"
1600115-87 = "結果綁著這個髮帶去，猜得答案全都答對了！！"
1600115-88 = "[s]「全部！？」"
1600115-89 = "嗯！！全部！！厲害吧？"
1600115-90 = "然後然後！"
1600115-91 = "常去的地方有賣限量特別甜點，一天只賣20個左右。"
1600115-92 = "雖然晚到了點，但是只要綁著這個髮帶就一定能吃到！#n很多次剛好都在明日奈後面就賣完了呢！"
1600115-93 = "[s]「好厲害！」"
1600115-94 = "還有還有！也有這種情況！"
1600115-95 = "正在戰鬥的時候實彈不夠了！超麻煩的！#n另外帶的彈匣也用完了，敵人還剩一大堆！"
1600115-96 = "所以就用這個髮帶當成投石繩把剩下的敵人全部打倒了！"
1600115-97 = "[s]「那，那個算幸運嗎……？」"
1600115-98 = "當然算啊！這是一條無論走到哪裡都守護著明日奈的幸運髮帶！"
1600115-99 = "呵呵，完全看不出來用很久了吧？就像全新的一樣！我都有認真在保養哦。"
1600115-100 = "[s5]「戰鬥中如果像今天這樣髮帶鬆掉，」\n[s6]「真的弄丟的話怎麼辦？」"
1600115-103 = "真的弄丟的話？"
1600115-104 = "嗯……"
1600115-105 = "唔嗯……"
1600115-106 = "唔唔唔……"
1600115-107 = "[s]「沒，沒事……！當我沒說……！」"
1600115-108 = "應該不會有問題！"
1600115-109 = "[s]「咦？」"
1600115-110 = "當然會超級超級難過……"
1600115-111 = "但是這個髮帶，帶來的最大的幸運……"
1600115-112 = "現在就在明日奈的眼前啊！！"
1600115-113 = "因為我已經遇見了主人！！"
1600115-114 = "所以就算弄丟也沒關係！嗯！一定不會有問題！"
1600115-115 = "[s7]「老師好感動！」\n[s8]「不過，要小心別弄丟了哦！」"
1600115-118 = "嘿嘿，嗯！"
1600115-119 = "不管是主人還是髮帶，我都會更加珍惜的！"
1600115-121 = "（和明日奈一起聊著至今為止覺得幸運的時刻，接著一起回去了）"
