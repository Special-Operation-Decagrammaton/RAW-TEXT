[translation]
10047090-1 = "제9화;작전의 시작"
10047090-3 = "(시간이 흘러 작전 당일…….)"
10047090-10 = "마스터~! 드디어 이날이 왔습니다!"
10047090-12 = "[ns] \"응? 그런데 레나가 안 보이네?\""
10047090-13 = "레나 쨩은…… 이번 일에서 빠지기로 했어요."
10047090-14 = "아마 오늘은…… 여기 오지 않을 거야……. 다른 곳에서 잔다고 했거든."
10047090-15 = "이해한답니다. 이번 작전은 정말 위험하니까요."
10047090-16 = "또한 믿지 않는 것을 억지로 상대에게 강요하는 건, 예술의 발전에도 긍정적이지 못한 일."
10047090-17 = "다양함을 인정할 수 있어야 모두가 앞으로 나아갈 수 있는 것이죠."
10047090-22 = "뉴후후, 그럼 작전을 확인하며 밤이 되길 기다리죠."
10047090-30 = "자. 시간이 됐습니다. 그럼 거리로 나가죠."
10047090-51 = "흐아아암, 졸려……. 얼른 순찰하고 들어가서 자야지."
10047090-52 = "그래. 설마 오늘처럼 달이 밝은 밤에 누가 이상한 짓 하겠어?"
10047090-58 = "뉴후후, 보름달이 뜨는 날엔 마력이 충만해진다는 걸 모르나 보네요."
10047090-59 = "아무튼 덕분에 감시가 느슨해진 느낌이네요. 좋은 징조예요."
10047090-60 = "그럼…… 흩어지자……."
10047090-61 = "넵! 그럼 각자 지도에 표시된 구역을 잘 부탁드립니다!"
10047090-62 = "일을 마치고 무사히 합류 포인트에서 만나는 거예요!"
10047090-63 = "모두에게 마법의 가호가 함께 하길!"
10047090-68 = "[ns] (나도 서둘러 이동하자.)"
10047090-73 = "[ns1] \"우선 여기부터 시작인가?\"\n[ns2] 마법진을 그릴 재료들을 확인한다."
10047090-78 = "(지도에 표시된 장소를 파보니, 와이어 led 전구와 축광 테이프가 잔뜩 나왔다.)"
10047090-80 = "마법진은 led 전구와 축광 테이프를 사용해 그릴 거야."
10047090-81 = "전구는 신호가 가면 연쇄적으로 켜지게 해 뒀어."
10047090-82 = "어때, 선생? 말했던 대로 안전한 재료지? 히히……."
10047090-84 = "[ns3] \"……확실히 안전한 재료긴 하네.\"\n[ns4] (사감대에 들키기 전에 재빨리 마무리하자.)"
10047090-102 = "(모두가 열심히 작업을 이어 나갔다.)"
10047090-103 = "(그렇게 모든 것이 순조롭게 진행되는 것 같았지만…….)"
10047090-105 = "[ns] \"휴우, 이제 남은 건 사감대 기숙사 쪽 정도네.\""
10047090-106 = "음……? 잠깐만! 거기 누구야!"
10047090-111 = "어라? 당신은 샬레의 선생님? 이 시간에 여기서 뭘 하고 계신 거죠?"
10047090-112 = "[s] \"어…… 그, 그게 말이야…….\""
10047090-116 = "[ns5] \"아! 그, 그래! 화, 화단에 전구를 달면 예쁠 것 같아서……!\"\n[ns6] \"이것도 예술 활동의 하나인 거지!\""
10047090-119 = "그런 일정은 들은 적 없는데요……."
10047090-123 = "통신보안. 여기는 올빼미 3호. 오늘 심야에 작품활동 있다는 소식 있었습니까?"
10047090-127 = "……그렇군요. 알겠습니다. 이쪽에서 적절히 대응하겠습니다."
10047090-133 = "선생님. 지금부터 얌전히 저의 통제에 따라주시죠."
10047090-134 = "[ns] \"크윽……!\""
10047090-136 = "(그 시각, 다른 아이들도…….)"
10047090-159 = "선생님. 지금 여기저기서 무전이 들어오는데, 404호 녀석들이랑 뭘 하고 계신 거죠?"
10047090-160 = "솔직하게 말씀해 주세요. 정상참작 정도는 해드릴 테니까."
10047090-161 = "[s] \"그, 그건……!\""
10047090-165 = "까악! 까아아악!"
10047090-170 = "까마귀가 뭘 떨어뜨린 거지?"
10047090-174 = "……기숙사 특별 지침 문서?"
10047090-175 = "만약 이 문서의 폐기가 용이하지 않을 경우, 1층 로비의 붉은색 전화기를 이용해 666번을 눌러주세요."
10047090-176 = "그럼 전문가가 찾아가 해당 문서의 폐기를 도울 것입니다……?"
10047090-177 = "666번은 특수 에이전트의 비밀 회선인데 설마 유출된 건가?!"
10047090-178 = "불길한 번호라 아무도 안 누를 줄 알았는데!"
10047090-179 = "[ns7] (뭔진 모르겠지만 지금이다!)\n[ns8] (한눈을 판 사이에 도망가자!)"
10047090-185 = "아앗! 거기 서세요!!"
