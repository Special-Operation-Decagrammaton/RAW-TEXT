[translation]
90001290-1 = "제29화;화물 운송"
90001290-2 = "[ns] \"해, 해냈다……!\""
90001290-3 = "무사하신가요, 선생님? 다행입니다! 이것이 선생님이 말한…… 예언자로군요!"
90001290-4 = "엄청났습니다! 마치 중간 보스를 쓰러트린 기분이었습니다!!!"
90001290-5 = "아리스의 중간 보스라는 비유는 그렇다고 쳐도…… 여러 가지로 독특한 예언자였네요."
90001290-7 = "예언자들의 형태가 특별히 어떤 방식으로 정해져 있는 것은 아니니까."
90001290-8 = "그걸 감안하더라도…… 조금 더 이질적이었던 것 같기는 해."
90001290-9 = "네. 여러 개의 파츠 같은 것들이 합쳐져, 메인 유닛을 보조하는 느낌이었지요."
90001290-10 = "그보다 명백히 화력 과잉 아니었어? 자기가 지키고 있었던 씨앗들까지 소각시킬 지경이었는데?"
90001290-12 = "확실히 그 부분은 이상하네요. 아니면 종자를 보호하는 것보다도……"
90001290-13 = "침입자인 우리를 제거하는 쪽이, 더 우선순위로 지정되었던 것일 수도 있고요."
90001290-14 = "제, 제거라고 하니까 왠지 무섭게 들리는데……."
90001290-15 = "예언자라는 AI들은…… 전부 이렇게 무자비했던 건가요……? 선생님은 지금까지, 도대체 어떤 싸움을 해 오신 거죠……?"
90001290-16 = "우으으…… 역시 이불, 아니 캐비닛 밖은 위험한 것 같아요……."
90001290-18 = "[ns1] \"뭐…… 지금까지는 어떻게든 되어 왔으니까?\"\n[ns2] \"초현상특무부와 모두의 덕이 컸지.\""
90001290-22 = "어머나. 조금 더 칭찬해 주셔도 저는 싫지 않답니다. 선생님?"
90001290-23 = "뭐 하는 거야, 선생님. 부장이 또 제멋대로 우쭐해졌잖아."
90001290-24 = "그렇습니다. 선생님께서는 조금 더 C&C이자 초현상특무부, 이중 소속으로 대활약 중인 저를 인정해 주셔야 합니다."
90001290-26 = "……이젠 당신들 옆에서, 어떻게 지금까지 선생님이 무사할 수 있었던 건지, 의심이 갈 지경이네요……."
90001290-28 = "티페레트가…… 패배했다고요……?"
90001290-29 = "우, 우애애앵–!"
90001290-30 = "설마 했는데, 진짜로 이런 일이……!"
90001290-34 = "티페레트로부터 메세지가 도착했네요. 티페레트는…… 네. 사과하고 있어요."
90001290-35 = "우선 소프에게. 종자 보관소 AI로서의, 흔적 같은 기억 때문에 이런 결과를 초래하게 된 것에 대하여."
90001290-36 = "그리고 아인에게. 언제나 보내 주었던 신뢰를 배신한 것에 대하여."
90001290-37 = "마지막으로 오르에게. 관리자인 오르에게 실망만을 안겨준 것에 대하여."
90001290-39 = "아뇨. 그런 건 아무래도 괜찮아요. 일단 티페레트의 정보는 무사한 것 같으니 그나마 다행이죠."
90001290-40 = "……그 왕녀와 시녀라는 변수만 없었어도……."
90001290-41 = "도대체 언제, 어떻게 그 변수들이 중간에 끼어든 거지?"
90001290-42 = "조, 조금만 기다려요. 티페 쨩! 우리가 최대한 빠르게 어떻게든 해 줄게요!"
90001290-43 = "오르! 마지막 컨테이너 런쳐의 여유 공간은 어때?!"
90001290-44 = "공간 자체는 어떻게든 될 거예요. 그러면, 아인!"
90001290-45 = "네, 네에엣! 그, 그렇지만……."
90001290-46 = "지금 이대로는, 시간이……! 티페 쨩을 지하의 컨테이너 런쳐까지 옮기고, 적재시키려면…… 최소한 30분은 더……!"
90001290-47 = "그렇게 기다릴 수는 없어!"
90001290-48 = "그, 그그그그, 그러면, 어떻게 하죠……?"
90001290-49 = "간단해! 컨테이너 런쳐를 티페레트의 아래까지 이동시킨 다음……!"
90001290-50 = "이, 이동시킨 다음……?"
90001290-52 = "바닥을 폭발시켜 버려!"
90001290-53 = "네에에에에?!?!"
90001290-54 = "화끈해서 좋네요!"
90001290-55 = "정말요오오!?!?"
90001290-59 = "갑자기 뭐죠? 이 진동은…… 심상치 않은데요?"
90001290-60 = "응. 발 바로 밑에서, 거대한 무언가가 움직이는 느낌이야."
90001290-61 = "제2종 보안 경고. 제2종 보안 경고. 현 시간부로 본 시설은 폐쇄 절차에 들어갑니다."
90001290-62 = "다시 한번 안내 드립니다. 현 시간부로 본 시설은 폐쇄 절차에 들어갑니다. 남아 있는 인원이 있다면, 신속히 퇴거해 주십시오."
90001290-68 = "윽……! 선생님! 저를 꼭 붙잡아주십시오!"
90001290-69 = "모두 여기에서 나가!"
90001290-79 = "다들 괜찮나요? 특히 아리스는요? 선생님은?"
90001290-80 = "아리스는 무사합니다, 케이! 다른 모두 역시 마찬가지고요. 그런데……."
90001290-82 = "[ns] \"대체 무슨 일이 일어난 거지……?\""
90001290-84 = "선생님! 저 아래에……!"
90001290-88 = "저건…… 뭐죠?"
90001290-89 = "엄청나게 거대한 수송 시설처럼 보입니다."
90001290-90 = "……! 이런 식으로, 이 시설로부터 강철대륙까지 자원을 수송하고 있었던 걸까……?"
90001290-91 = "그렇지만…… 구체적으로 어떻게요? 이건 비유하자면 커다란 컨테이너에 화물을 수납한 것일 뿐이고……."
90001290-95 = "이거…… 혹시? 모두 엎드려요! 저게 곧 발사될지도 몰라요!"
90001290-101 = "[ns] \"우와아아아앗?!\""
90001290-102 = "괜찮아, 선생님? 일단 토키와 내가 후폭풍을 막았어!"
90001290-103 = "무사하신 것 같군요. 다행입니다."
90001290-105 = "……컨테이너가, 사라졌네요. 아니, 발사되었다고 해야 할까요."
90001290-106 = "어떻게 저 컨테이너가 발사될 것이라는 걸 알았죠?"
90001290-107 = "그, 그게…… 예전에 했던 게임 중에, 저런 장치 같은 것이 있었어서……. 혹시나, 하고요……."
90001290-108 = "음…… 그렇군요. 게임이라는 분야……. 저도 조금 관심을 가져야 할까 봐요."
90001290-110 = "조심해서 저 아래 공간으로 내려가 보자."
90001290-111 = "아직 열기가 꽤 남아 있는 것 같으니, 다들 신중하자구요."
90001290-112 = "그러면 난 여기를 지키고 있을게."
90001290-113 = "네? 갈 거면 다 같이……. 아뇨, 됐어요. 알겠네요. 그럼 부탁할게요."
90001290-114 = "응. 고마워, 케이."
90001290-120 = "저쪽으로부터 긴 레일이 이어지고 있었네."
90001290-121 = "그렇군요. 이곳으로 운송된 자원들은…… 마지막으로 여기에 적재되게 되어 있었던 모양이네요."
90001290-122 = "그리고 이곳에 적재된 자원들은, 조금 전 우리가 보았던 컨테이너를 통해서……."
90001290-124 = "……저렇게, 강철대륙으로 쏘아지는 것이었고요. 이 시스템을…… 뭐라고 정의해야 할까요?"
90001290-125 = "음…… [ruby=Container]화물을[/ruby] [ruby=Launcher]쏘아 보내[/ruby]는 방식이니, 컨테이너 런쳐라고 일단 불러 둘까요."
90001290-126 = "아무튼 저 컨테이너 런쳐를 통해 모든 운송을 처리하고 있었던 거였네요."
90001290-128 = "그렇다는 것은, 방금 쏘아진 컨테이너의 궤적을 분석하면 강철대륙의 좌표를 추적할 수 있다는 것이겠네."
90001290-129 = "이곳에 남겨진 시설 역시 분석해 볼 필요가 있을 것 같고요."
90001290-131 = "그렇군요. 잘 모르겠지만 알았습니다. 그러면 저희는 무엇을 하면 될까요?"
90001290-132 = "으음……. 일단은 말이죠."
90001290-133 = "힘을 써야 할 일이 있을 듯하니, 에이미를 불러와 주겠어요?"
90001290-134 = "그 아래, 더워서 가기 싫은데……."
90001290-135 = "[s] \"나중에 시원한 거 사 줄게!\""
90001290-136 = "……."
90001290-137 = "알았어, 선생님. 꼭이야?"
90001290-140 = "다음화;출발 준비"
