[translation]
10055175-2 = ""
10055175-3 = "わあ！サツキ先輩！すごい！"
10055175-4 = "わ、私が勝ったの？"
10055175-5 = "まーけーたー"
10055175-6 = "くうっ……チセちゃんが負けるだなんて……！"
10055175-7 = "まあまあ、どんな天才だって負けることはあるから～"
10055175-8 = ""
10055175-10 = ""
10055175-11 = "夏海に"
10055175-12 = "ヤドカリ会いて"
10055175-13 = "打つ手なし"
10055175-14 = "チセちゃんの即興俳句！？"
10055175-15 = "敗北からインスピレーションを得るなんて……！#nまさに、災い転じて福と成す……！"
10055175-16 = "にゃはは。一喜一憂～右往左往～カホは本当に陰陽部らしいねぇ。"
10055175-17 = "……これはどういうことだ！？"
10055175-18 = "おっと、長居しすぎたようで。"
10055175-19 = ""
10055175-21 = ""
10055175-22 = "百鬼夜行の陰陽部部長が、何故ここにいる！"
10055175-23 = ""
10055175-24 = "……そうか。私の居ない間にそんなことが。"
10055175-25 = "よくやった、サツキ！"
10055175-26 = "要は、万魔殿がまた一歩優勝に近づいたということだな！"
10055175-27 = "いや、もっと聞くことありません？"
10055175-28 = "勝報に勝る事実などない！さっさと陰陽部の星を出すがいい！"
10055175-29 = "はい、どうぞ～"
10055175-30 = ""
10055175-32 = ""
10055175-33 = "キシシッ！これで百鬼夜行も制覇だ！"
10055175-34 = "解釈は好きにしていただいてかまいませんが～#n私たちは、百鬼夜行の代表ではありませんよ？"
10055175-35 = "陰陽部が生徒会でないことなど百も承知だ。#n百鬼夜行は元々連合学院なのだからな。"
10055175-36 = "外部の方には説明が難しいというか……んん？"
10055175-37 = "しかし実質的に百鬼夜行を取りまとめている陰陽部を打破すれば、#n他の部活も自然とゲヘナの覇権を認めることだろう。"
10055175-38 = "反発しうるのは、独立した武力を有する百花繚乱くらいだろうか……。#n私の所見に間違いはあるか？"
10055175-39 = "……おやまあ、随分とお詳しいですね～"
10055175-40 = "キシシッ！もっと讃えるがいい！"
10055175-41 = "にゃははっ！さっすがマコト議長！"
10055175-42 = "……意外に油断ならないお人で。これは直接会えてむしろラッキーだったかも。"
10055175-43 = ""
10055175-45 = ""
10055175-46 = "え、え～っと……何かしら？"
10055175-47 = "これ。"
10055175-48 = ""
10055175-50 = ""
10055175-51 = "……これは何？……ただの砂に見えるけど。"
10055175-52 = "綺麗でしょー？"
10055175-53 = "まあ、貝殻が混ざってキラキラしてるし……言われてみれば綺麗だけど……。"
10055175-54 = "あげる。"
10055175-55 = ""
10055175-57 = ""
10055175-58 = "ちょっと！いきなり手に出したら……！"
10055175-59 = "おおっ！試合を終えて芽生える友情！これこそ青春の1ページですね！"
10055175-60 = "元宮チアキ、感動しました！"
10055175-61 = "今のどこに感動する要素が……？"
10055175-62 = "す、ストップ！こぼれちゃってる！こぼれちゃってるわよ！！"
