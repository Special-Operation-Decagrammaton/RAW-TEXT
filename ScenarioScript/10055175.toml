[translation]
10055175-3 = "와아-! 사츠키 선배, 대단해-!"
10055175-4 = "내, 내가 이긴 거야?"
10055175-5 = "디피-트-"
10055175-6 = "크으으읏……! 치세 쨩이 지다니……!"
10055175-7 = "뭐어, 뭐어~ 이길 때도 있고, 질 때도 있는 거지~"
10055175-11 = "여름바다서"
10055175-12 = "소라게와 다퉈도"
10055175-13 = "이길 리 없네"
10055175-14 = "허억?! 치세 쨩의 즉흥 하이쿠?!"
10055175-15 = "……설마, 패배한 덕분에 착상이 떠올라 하이쿠를…… 그야말로 전화위복이지만……!"
10055175-16 = "냐하하~ 슬퍼했다가 기뻐했다가~ 갈팡질팡~ 카호도 참 음양부답다니까~"
10055175-17 = "어떻게 된 일이냐?!"
10055175-18 = "어이쿠. 너무 오래 머물렀나 보네요."
10055175-22 = "백귀야행의 음양부장?! 어째서 이곳에?!"
10055175-24 = "……과연, 이 몸이 없는 사이에 그런 일이 있었나."
10055175-25 = "우선, 잘해주었다, 사츠키!"
10055175-26 = "요지는, 만마전이 또다시 승리했다는 것이군!"
10055175-27 = "아니, 그렇게 퉁 쳐도 돼요?"
10055175-28 = "승전보 이상으로 중요한 사실은 없다! 퍼뜩 음양부의 별을 내놔라!"
10055175-29 = "네네~ 모쪼록~"
10055175-33 = "키시싯! 이걸로 백귀야행도 제패로군!"
10055175-34 = "뭐어~ 뭐~ 해석하시기 나름이지만, 딱히 저희 음양부는 백귀야행을 대표하거나 하지는 않는답니다?"
10055175-35 = "아아, 알고 있다. 음양부는 학생회가 아니지. 백귀야행은 본래 연합학원이니."
10055175-36 = "아니, 이게 외부인에게 설명하기 어려워서…… 응?"
10055175-37 = "하지만, 실질 학원의 총의를 모으고 있는 음양부를 타파한다면, 나머지 동아리들도 자발적으로 게헨나의 패권을 인정할 터."
10055175-38 = "반발하는 것은, 자체 무력을 보유한 백화요란 분쟁조정위원회 정도려나. 이 몸의 말에 틀린 부분이라도?"
10055175-39 = "……어머나~ 대단히 해박하십니다!"
10055175-40 = "키시싯! 이 몸을 더욱 칭송하라!"
10055175-41 = "냐핫! 역시 마코토 의장님!"
10055175-42 = "……이거, 대면한 것이 전화위복이 되었군요. 함부로 얕볼 상대가 아니네요."
10055175-46 = "으, 응? 뭐야?"
10055175-47 = "이거."
10055175-51 = "……이게 뭔데? 그냥 모래 아니야?"
10055175-52 = "이쁘지-?"
10055175-53 = "……어, 예쁜가 아닌가 하면, 조개껍질도 섞여 있고, 반짝거려서 예쁜 편인 거 같긴 한데."
10055175-54 = "줄게."
10055175-58 = "어, 어어? 잠깐만, 손에 다짜고짜 부으면?!"
10055175-59 = "오오! 시합이 끝나고 싹트는 우정! 그야말로 청춘의 한 장면이네요!"
10055175-60 = "모토미야 치아키! 감동했습니다!"
10055175-61 = "대체 지금 어디에 감동할 요소가……?"
10055175-62 = "그, 그만! 다 쏟아지잖아!"
