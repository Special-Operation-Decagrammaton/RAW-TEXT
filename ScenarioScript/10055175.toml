[translation]
10055175-2 = ""
10055175-3 = "ว้าว! รุ่นพี่ซัตสึกิสุดยอดเลย!"
10055175-4 = "ฉะ... ฉันชนะเหรอ?"
10055175-5 = "แพ้... แล้ว... ละ..."
10055175-6 = "อึกกก...! ชิเซะจังแพ้ซะแล้ว...!"
10055175-7 = "เอาน่าๆ~ มีชนะก็ต้องมีแพ้บ้างละนะ~"
10055175-8 = ""
10055175-10 = ""
10055175-11 = "ทะเลฤดูร้อน"
10055175-12 = "แม้ปูเสฉวนพร้อมสู้"
10055175-13 = "ก็มิอาจสู่ชัยชนะได้"
10055175-14 = "ฮึก?! กลอนไฮกุสดๆ ของชิเซะจัง?!"
10055175-15 = "หรือว่าความพ่ายแพ้ทำให้เกิดแรงบันดาลใจจนแต่งกลอนไฮกุสดๆ ได้... นับว่าเปลี่ยนเรื่องร้ายให้กลาย#nเป็นดีจริงๆ นะ...!"
10055175-16 = "อะฮะฮ่า~ เดี๋ยวเศร้าเดี๋ยวดีใจ~ เปลี่ยนไปเปลี่ยนมา~ คาโฮะสมกับเป็นชมรมหยินหยางจริงๆ เลยน้า~"
10055175-17 = "เกิดอะไรขึ้นกันเนี่ย?!"
10055175-18 = "ตายจริง ดูเหมือนจะอยู่นานเกินไปแล้วนะคะ"
10055175-19 = ""
10055175-21 = ""
10055175-22 = "หัวหน้าชมรมหยินหยางของเฮียกคิยาโค?! มาทำอะไรที่นี่?!"
10055175-23 = ""
10055175-24 = "เข้าใจแล้ว ระหว่างที่เราไม่อยู่เกิดเรื่องแบบนั้นขึ้นสินะ..."
10055175-25 = "ก่อนอื่นก็ ทำได้ดีมากเลยนะ ซัตสึกิ!"
10055175-26 = "สรุปก็คือแพนเดโมเนียม โซไซตี้ได้รับชัยชนะอีกครั้ง!"
10055175-27 = "เดี๋ยวนะ สรุปกันง่ายๆ แบบนั้นเลยเหรอคะ?"
10055175-28 = "ไม่มีข้อเท็จจริงใดสำคัญกว่าเรื่องชัยชนะ! รีบส่งดาวของชมรมหยินหยางมาซะ!"
10055175-29 = "ค่าๆ เชิญรับไปเลยค่ะ~"
10055175-30 = ""
10055175-32 = ""
10055175-33 = "คิกคิกคิก! เท่านี้ก็พิชิตเฮียกคิยาโคได้แล้วสินะ!"
10055175-34 = "แหม~ ก็แล้วแต่จะตีความนะคะ แต่ชมรมหยินหยางของเราไม่ได้เป็นตัวแทนของเฮียกคิยาโคหรอกค่ะ?"
10055175-35 = "อ่า เรื่องนั้นเรารู้ ชมรมหยินหยางไม่ใช่สภานักเรียน เพราะเดิมทีเฮียกคิยาโคก็เป็นสหพันธ์โรงเรียนนี่นะ"
10055175-36 = "คือเรื่องนี้อธิบายให้คนนอกเข้าใจยากอยู่สักหน่อย... หืม?"
10055175-37 = "แต่ถ้าเอาชนะชมรมหยินหยางที่เป็นศูนย์รวมของทั้งโรงเรียนได้ ชมรมที่เหลือก็ย่อมยอมรับความยิ่งใหญ่#nของเกเฮนน่าด้วยความสมัครใจนั่นละ"
10055175-38 = "ที่ต่อต้านคงมีเพียงคณะไกล่เกลี่ยข้อพิพาท เฮียกกะเรียวรันที่มีกำลังรบของตัวเองละมั้ง หรือว่าเราพูดผิดตรงไหน?"
10055175-39 = "ตายจริง~ ช่างรอบรู้เหลือเกินค่ะ!"
10055175-40 = "คิกคิกคิก! จงสรรเสริญเราให้มากกว่านี้สิ!"
10055175-41 = "อะฮ่า! สมกับเป็นท่านประธานมาโคโตะจริงๆ!"
10055175-42 = "การได้มาเจอกันครั้งนี้กลับเป็นผลดีซะอย่างนั้น เป็นคู่ต่อสู้ที่ประมาทไม่ได้เลยนะคะ"
10055175-43 = ""
10055175-45 = ""
10055175-46 = "อะ... อืม? อะไรเหรอ?"
10055175-47 = "นี่ไง"
10055175-48 = ""
10055175-50 = ""
10055175-51 = "นี่อะไรน่ะ...? ก็แค่ทรายไม่ใช่เหรอ?"
10055175-52 = "สวยใช่มั้ย?"
10055175-53 = "อ่า... ถ้าถามว่าสวยรึเปล่าละก็ มันมีเปลือกหอยปนอยู่ด้วย แถมเป็นประกายวิบวับอีก ก็เหมือนจะสวยอยู่หรอกนะ"
10055175-54 = "ให้..."
10055175-55 = ""
10055175-57 = ""
10055175-58 = "อะ... เอ๋? เดี๋ยวก่อน อยู่ๆ ก็เอามายัดใส่มือแบบนี้เลยเหรอ?!"
10055175-59 = "โอ้โฮ! มิตรภาพที่ผลิบานหลังจบการแข่งขัน! เป็นภาพลักษณ์ของวัยรุ่นอย่างแท้จริงเลยค่ะ!"
10055175-60 = "โมโตมิยะ จิอากิคนนี้ซาบซึ้งมากค่ะ!"
10055175-61 = "มีอะไรน่าซาบซึ้งกันนะ...?"
10055175-62 = "พะ... พอก่อน! มันหกหมดแล้วนะ!"
