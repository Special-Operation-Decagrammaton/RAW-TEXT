[translation]
10055175-2 = ""
10055175-3 = "哇～！皐月前輩，好厲害～！"
10055175-4 = "我，我贏了嗎？"
10055175-5 = "輸～掉～了～"
10055175-6 = "嗚嗚嗚……！知世醬居然輸了……！"
10055175-7 = "好啦好啦～勝敗乃兵家常事嘛～"
10055175-8 = ""
10055175-10 = ""
10055175-11 = "夏日的海邊"
10055175-12 = "與寄居蟹爭高下"
10055175-13 = "沒能贏下來"
10055175-14 = "啊！？知世醬的即興俳句！？"
10055175-15 = "難道是因為輸了才有靈感寫出俳句……正可謂因禍得福……！"
10055175-16 = "喵哈～一下難過一下開心～慌慌張張～#n佳穗也真有陰陽部的風格呢～"
10055175-17 = "這是怎麼回事！？"
10055175-18 = "哎呀，看來我們待太久了呢。"
10055175-19 = ""
10055175-21 = ""
10055175-22 = "百鬼夜行的陰陽部部長！？為何會在這裡！？"
10055175-23 = ""
10055175-24 = "……原來如此，本大人不在的時候發生了這種事啊。"
10055175-25 = "總之做得好，皐月！"
10055175-26 = "重點是，萬魔殿又贏了一場對吧！"
10055175-27 = "不是，這樣草草帶過真的沒問題嗎？"
10055175-28 = "沒有比捷報更重要的事！快把陰陽部的星星交出來！"
10055175-29 = "好好～請收下～"
10055175-30 = ""
10055175-32 = ""
10055175-33 = "嘰嘻嘻！這下連百鬼夜行也稱霸了！"
10055175-34 = "唔嗯～要怎麼解讀是您的自由，不過我們陰陽部並不代表百鬼夜行哦？"
10055175-35 = "啊啊，我知道。#n陰陽部並不是學生會，況且百鬼夜行本來就是聯合學園嘛。"
10055175-36 = "不是，這對外人有點難解釋……嗯？"
10055175-37 = "不過只要打倒實質上統合學園共識的陰陽部，其他社團也自然會承認格黑娜的霸權。"
10055175-38 = "會反抗的，大概只有擁有獨立武力的百花繚亂紛爭調停委員會吧。#n本大人說的有哪裡不對嗎？"
10055175-39 = "……哎呀～您真是博學多聞！"
10055175-40 = "嘰嘻嘻！再多稱讚本大人一點！"
10055175-41 = "喵哈哈！不愧是真琴議長！"
10055175-42 = "……看來直接見上一面反倒是好事呢。這位可真是不容小覷啊。"
10055175-43 = ""
10055175-45 = ""
10055175-46 = "嗯，嗯？怎麼了？"
10055175-47 = "這個。"
10055175-48 = ""
10055175-50 = ""
10055175-51 = "……這是什麼？不就只是沙子嗎？"
10055175-52 = "很漂亮吧～？"
10055175-53 = "……要說漂不漂亮的話，裡面混著貝殼又亮晶晶的，確實算是挺漂亮的啦。"
10055175-54 = "給你。"
10055175-55 = ""
10055175-57 = ""
10055175-58 = "咦，咦咦？等一下，別突然倒在我手上啊！？"
10055175-59 = "哦哦！比賽結束後萌生的友情！#n這正是青春的一幕呢！"
10055175-60 = "元宮千秋，深受感動！"
10055175-61 = "剛剛到底有哪裡值得感動……？"
10055175-62 = "停，停下來！全都灑出來了啦！"
