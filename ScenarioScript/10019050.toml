[translation]
10019050-11 = "호드, 지상으로 유인했어!"
10019050-16 = "코유키 쨩, 앞의 방벽!"
10019050-21 = "으아아아-! 정말이지, 알겠다구요!"
10019050-26 = "베리타스 부실"
10019050-27 = "치히로 선배, 남은 침식 타워는?"
10019050-28 = "파악된 건 모두 온천부가 파괴했어! 이제 남은 건 호드뿐이야!"
10019050-29 = "좋아! 메구! 이제 지상으로 가서 저 녀석을 철거하는 거야!"
10019050-31 = "오케이. 맡겨줘."
10019050-32 = "뭐든지 부수는 건 우리 온천개발부 전문이니까."
