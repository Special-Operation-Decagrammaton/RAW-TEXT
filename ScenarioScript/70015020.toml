70015020-80 = "นี่มันเกิดอะไรขึ้นกันคะ...?"
70015020-82 = "เรื่องมันก็เป็นอย่างนี้แหละ!!"
70015020-83 = "อย่างนี้นี่เอง... ทุกคนเล่นเป็นเพื่อนคุณอิบูกิ แถมซื้อของอร่อยๆ ให้ด้วย..."
70015020-84 = "ดูยังไงก็ลักพาตัวไม่ใช่เหรอคะ?!"
70015020-85 = "คิดแล้วเชียวว่าต้องเป็นแบบนี้!!"
70015020-86 = "ไม่ใช่นะๆ อิบูกิโกรธก็เลยออกมาเอง"
70015020-87 = "พี่สาวพวกนี้บังเอิญมาเจออิบูกิต่างหาก ทุกคนเป็นคนดีมากๆ เลยนะคะ!"
70015020-88 = "ถ้าอย่างนั้นก็โล่งอกไปค่ะ แต่ว่า..."
70015020-89 = "อะ... อิบูกิ มีคนมาตามแล้ว คงต้องกลับแล้วสินะคะ..."
70015020-90 = "ฉันสนุกมากเลยที่ได้เล่นด้วยกันค่ะ รักษาสุขภาพจนกว่าเราจะได้เจอกันอีกนะคะ..."
70015020-91 = "ค่ะ... ตอนนี้เรากลับกันเถอะค่ะ ทางแพนเดโมเนียม โซไซตี้เองก็เป็นห่วงกันมาก..."
70015020-92 = "ไม่เอา! อิบูกิยังไม่กลับหรอกนะ!"
