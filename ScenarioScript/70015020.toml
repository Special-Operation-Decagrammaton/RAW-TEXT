[translation]
70015020-1 = "เหตุการณ์อิบูกิหนีออกจากบ้าน 2"
70015020-3 = ""
70015020-4 = "..."
70015020-6 = ""
70015020-7 = ""
70015020-8 = "สรุปก็คือ..."
70015020-9 = "เพราะยัยประธานจอมเจ้าเล่ห์นั่นเผลอขโมยพุดดิ้งของคุณอิบูกิกิน..."
70015020-10 = "ค่ะ..."
70015020-11 = "คุณอิบูกิก็เลยโกรธแล้ววิ่งหนีออกไป..."
70015020-12 = "พอหาไม่เจอสักทีว่าอิบูกิหายไปไหน ก็เลยมาขอให้พวกเราช่วยสินะคะ?"
70015020-13 = "ค่ะ ก็ตามที่บอกไปนั่นละค่ะ เฮ้อ..."
70015020-14 = "อะไรกันเนี่ย..."
70015020-15 = "ปกติก็จ้องเล่นงานคณะกรรมการวินัยของพวกเราอยู่ตลอด พอต้องการความช่วยเหลือก็เลยคิดจะมา#nใช้งานกันแบบนี้งั้นเหรอคะ?"
70015020-16 = "เรื่องนั้นฉันก็ไม่รู้จะพูดยังไงเลยค่ะ..."
70015020-17 = "เข้าใจแล้ว พวกเราจะช่วยเอง"
70015020-18 = ""
70015020-20 = ""
70015020-21 = "อิบูกิยังเด็ก ต้องมีคนดูแล ถ้าหลงทางแล้วเดินเตร็ดเตร่ไปไหน อาจเจอเรื่องที่กลายเป็นความทรงจำ#nแย่ๆ ก็ได้"
70015020-22 = "ท่านประธานกรรมการวินัย..."
70015020-23 = "ค่ะ... คุณพูดถูกแล้วค่ะ เราจะพักเรื่องบาดหมางไว้ก่อน แล้วให้ความร่วมมืออย่างเต็มที่ค่ะ"
70015020-24 = "ถ้างั้น... ถึงเวลาออกลาดตระเวนพอดี ฉันจะช่วยตามหาอิบูกิให้เอง"
70015020-25 = "ขอบคุณนะคะ คณะกรรมการวินัยทุกท่าน..."
70015020-26 = "นี่คงไม่ใช่แผนของประธานมาโคโตะที่จะใช้ความร่วมมือครั้งนี้มาบงการคณะกรรมการวินัยหรอกนะคะ?"
70015020-27 = "ตอนนี้เธอคงไม่มีเวลาคิดอะไรแบบนั้นหรอกค่ะ ตอนนี้รุ่นพี่มาโคโตะคงจะกำลัง..."
70015020-28 = ""
70015020-29 = "อิบูกิ~~~!!! เราผิดไปแล้ว!! กลับมาเถอะ!!!"
70015020-31 = "..."
70015020-32 = "เฮ้อ..."
70015020-33 = "จะช่วยก็ไม่มีปัญหาหรอกค่ะ แต่เราไม่รู้เลยว่าคุณอิบูกิไปอยู่ที่ไหนน่ะสิคะ"
70015020-34 = "นี่ก็ผ่านมาหลายชั่วโมงแล้วด้วย..."
70015020-35 = ""
70015020-37 = ""
70015020-38 = "อ๊ะ...?"
70015020-39 = ""
70015020-40 = "ว้าว~! สนุกสุดๆ เลย!"
70015020-41 = ""
70015020-42 = ""
70015020-43 = ""
70015020-44 = ""
70015020-45 = ""
70015020-46 = "พี่ฮารุกะเล่นกระดานหกเก่งจัง!"
70015020-47 = "แหะๆ... ดีจังเลยค่ะที่อิบูกิสนุก..."
70015020-48 = "ต่อไปเราไปเล่นชิงช้ากันมั้ยคะ?"
70015020-49 = "อื้อ! เอาสิ เล่นกันๆ!"
70015020-50 = "ฮุฮุฮุ ฮารุกะจังดูแลเด็กเก่งมากเลยนะ"
70015020-51 = "ก็ฮารุกะเป็นคนอ่อนโยนนี่"
70015020-52 = "..."
70015020-53 = "ประธาน ทำไมทำหน้าเครียดแบบนั้นล่ะ?"
70015020-54 = "เปล่า... แค่คิดว่าปล่อยให้เป็นแบบนี้จะดีจริงๆ น่ะเหรอ..."
70015020-55 = "อ๋อ~ เพราะเป็นเด็กน้อยของแพนเดโมเนียม โซไซตี้สินะ? ถ้าระหว่างอยู่กับเรา แล้วแพนเดโมเนียม โซไซตี้มาตามหาละก็..."
70015020-56 = "ฉะ... ฉันไม่ได้กลัวเรื่องนั้นสักหน่อย!"
70015020-57 = "แต่พวกเราเป็นชมรมที่ไม่ได้รับอนุญาต ก็เลยอาจมะ... ไม่ค่อยสะดวกเท่าไรก็แค่นั้นเองน่ะ"
70015020-58 = "ก็แค่กังวลนิดหน่อยเอง... ละมั้ง? กะ... ก็แค่นั้นแหละ!"
70015020-59 = "อืม... ตอนนี้ทางนั้นก็คงกำลังตามหาอิบูกิเหมือนกัน..."
70015020-60 = "เอาน่า จะมีอะไรเกิดขึ้นได้ล่ะ? ว่ากันตามจริง ตอนนี้พวกเราก็กำลังดูแลอิบูกิจังให้ปลอดภัยอยู่#nไม่ใช่รึไง?"
70015020-61 = "กะ... ก็ใช่นะ"
70015020-62 = "พอดีช่วงนี้มีเงินเหลือก็เลยให้กินของอร่อยๆ ไปตั้งเยอะ ทำแต่เรื่องดีๆ ทั้งนั้นเลยนะ"
70015020-63 = "ชะ... ใช่มั้ยล่ะๆ ใช่มั้ย"
70015020-64 = "คงไม่คิดว่าพวกเราลักพาตัวอิบูกิหรอกมั้ง..."
70015020-65 = "...!!"
70015020-66 = "จะ... จะ... จะเป็นแบบนั้นได้ยังไง!! ลักพาตัวอะไร พูดซะน่ากลัวเลย...!"
70015020-67 = "แต่พวกเราคือกลุ่มวายร้ายที่ขึ้นชื่อเรื่องความโหดร้าย เป็นนักรับจ้างสารพัดสุดน่าเกรงขาม… คนจะคิดแบบนั้นก็ไม่แปลกหรอก…!!"
70015020-68 = "เดี๋ยวสิ ใจเย็นๆ ก่อน ประธาน ถึงทางนั้นจะเข้าใจผิด อิบูกิก็คงช่วยอธิบายให้ได้อยู่แล้ว"
70015020-69 = "อา... จะ... จริงด้วยนะ อื้ม"
70015020-70 = "อืม ฉันลืมไปเลย"
70015020-71 = "ฮุฮุ สมเป็นประธานของเราจริงๆ ตั้งสติได้ไวสุดๆ เลยนะ"
70015020-72 = "ว่าแต่ว่า... ปัญหาคืออิบูกิจะยอมกลับเมื่อไรนี่สิ"
70015020-73 = "ไม่งั้นพวกนั้นอาจมาตามหาเองก็ได้..."
