[translation]
70015020-1 = "伊吹離家出走事件（２）"
70015020-3 = ""
70015020-4 = "……"
70015020-6 = ""
70015020-7 = ""
70015020-8 = "也就是說……"
70015020-9 = "你們那位狐狸議長不小心偷吃了伊吹醬的布丁……"
70015020-10 = "是的……"
70015020-11 = "伊吹醬一氣之下跑了出去……"
70015020-12 = "然後怎麼找都找不到人，所以才來向我們求助是嗎？"
70015020-13 = "是的，完全正確。唉……"
70015020-14 = "這都什麼跟什麼啊……"
70015020-15 = "平常恨不得把我們風紀委員會生吞活剝，現在急需人手就連我們也想拉來幫忙嗎？"
70015020-16 = "這點我確實無話可說……"
70015020-17 = "知道了。我會幫忙的。"
70015020-18 = ""
70015020-20 = ""
70015020-21 = "伊吹還小，需要人照顧。#n要是迷了路在某處徘徊，說不定會留下不好的回憶。"
70015020-22 = "風紀委員長……"
70015020-23 = "……是，您說得沒錯。#n這次就先放下過去的恩怨，全力協助吧。"
70015020-24 = "剛好也到了巡邏的時間，我就順便重點找找伊吹吧。"
70015020-25 = "非常感謝，風紀委員會的各位……"
70015020-26 = "這該不會是真琴議長想藉機拉攏我們，好操控風紀委員會的詭計吧？"
70015020-27 = "應該沒那個閒工夫吧。#n真琴前輩現在……"
70015020-28 = ""
70015020-29 = "伊吹～～～！！！是我不好！！快回來吧！！！"
70015020-31 = "……"
70015020-32 = "唉……"
70015020-33 = "幫忙是沒問題，但完全不知道伊吹醬跑去哪裡了呢。"
70015020-34 = "已經找了好幾個小時了……"
70015020-35 = ""
70015020-37 = ""
70015020-38 = "……啊？"
70015020-39 = ""
70015020-40 = "哇啊～！超好玩的！"
70015020-41 = ""
70015020-42 = ""
70015020-43 = ""
70015020-44 = ""
70015020-45 = ""
70015020-46 = "遙香姐姐，你蹺蹺板玩得超好的！"
70015020-47 = "耶嘿嘿……伊吹玩得開心就好……"
70015020-48 = "接下來我們去盪鞦韆好嗎？"
70015020-49 = "嗯！要玩要玩！"
70015020-50 = "咯呵呵。遙香醬很會照顧小孩呢。"
70015020-51 = "因為遙香是個溫柔的孩子。"
70015020-52 = "……"
70015020-53 = "社長，你怎麼一臉嚴肅？"
70015020-54 = "沒有……只是在想就這樣下去真的好嗎……"
70015020-55 = "啊哈～是因為他是萬魔殿的孩子吧？#n怕帶著他的時候，萬魔殿會找上門來……"
70015020-56 = "我，我才不是怕那個！"
70015020-57 = "只是我們是未經認可的社團，見面可能會有點尷，尷尬……之類的？"
70015020-58 = "就只是那種小小的……擔心？就，就只是這樣而已！"
70015020-59 = "唔嗯……那邊現在大概也在找伊吹吧……"
70015020-60 = "哎呀，能出什麼事呢？#n說到底，我們現在是在保護伊吹醬的安全嘛。"
70015020-61 = "好，好像也是？"
70015020-62 = "趁著手頭正寬裕，還讓他吃了很多好吃的，我們做的可都是好事哦？"
70015020-63 = "對，對吧？是這樣吧？"
70015020-64 = "……他們應該不會認為是我們綁架了伊吹吧。大概。"
70015020-65 = "……！！"
70015020-66 = "會，會會，會那樣嗎～！！#n綁架什麼的，別說這麼可怕的話……！"
70015020-67 = "可是我們是以冷酷硬派出名的惡人集團，令人聞風喪膽的便利屋……#n會被那樣想也不奇怪……！！"
70015020-68 = "不，冷靜點，社長。#n就算對方誤會了，伊吹也會好好解釋的。"
70015020-69 = "啊……就，就是說啊。"
70015020-70 = "嗯。我只是一時忘了而已。"
70015020-71 = "咯呵，果然是我們家社長。#n馬上就冷靜下來了呢。"
70015020-72 = "先不說這個……問題是伊吹打算什麼時候回去。"
70015020-73 = "也可能是對方先找上門來……"
70015020-74 = ""
70015020-76 = ""
70015020-77 = ""
70015020-78 = "……"
70015020-79 = "……啊。"
70015020-80 = "這又是什麼狀況……？"
70015020-82 = "事情就是這樣～！！"
70015020-83 = "……原來如此。#n這些人陪伊吹醬玩，還買了好吃的給他……"
70015020-84 = "怎麼看都是綁架吧！？"
70015020-85 = "果然是這種反應！！"
70015020-86 = "不是，不是。#n是伊吹自己生氣跑出來的。"
70015020-87 = "這些姐姐只是剛好遇到伊吹而已。#n他們都是好人哦！"
70015020-88 = "那樣的話就好……"
70015020-89 = "伊，伊吹，有人來找你了，你差不多該回去了呢……"
70015020-90 = "跟，跟你一起玩很開心。#n下次見面之前要保重身體哦……"
70015020-91 = "……是啊。我們回去吧。萬魔殿那邊現在不知道有多……"
70015020-92 = "不要！伊吹還不要回去！"
70015020-93 = ""
70015020-95 = ""
70015020-96 = "為，為什麼呢？#n還在生氣嗎，伊吹醬？"
70015020-97 = "沒有，伊吹已經不生氣了……"
70015020-98 = "可是還不想回去。"
70015020-99 = "伊吹想跟姐姐們再多待一下！"
70015020-100 = ""
70015020-102 = ""
70015020-103 = "耶嘿嘿……這，這樣啊。#n伊吹還想再多待一下嗎？"
70015020-104 = "嗯！！要待在一起！！"
70015020-105 = ""
70015020-107 = ""
70015020-108 = ""
70015020-109 = ""
70015020-110 = "社，社長……"
70015020-111 = "唔嗯……"
70015020-112 = "唉……"
70015020-114 = "那個……要不要來我們的事務所？"
