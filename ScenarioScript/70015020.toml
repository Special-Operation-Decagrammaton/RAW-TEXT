[translation]
70015020-1 = "이부키 가출사건 2"
70015020-4 = "……."
70015020-8 = "그러니까……"
70015020-9 = "그쪽 너구리 의장이 모르고 이부키 양의 푸딩을 훔쳐먹는 바람에……"
70015020-10 = "네……."
70015020-11 = "이부키 양이 화가 나서 뛰어나갔고……"
70015020-12 = "어디 갔는지 도통 찾을 수가 없어서, 우리에게 도움을 요청한 건가요?"
70015020-13 = "네, 정확합니다. 하아……."
70015020-14 = "이게 무슨……."
70015020-15 = "평소에는 그렇게 우리 선도부를 못 잡아먹어서 안달이더니, 필요하니까 고양이 손이라도 빌리겠다는 건가요?"
70015020-16 = "그건 저도 할 말이 없긴 한데요……."
70015020-17 = "알겠어. 도와줄게."
70015020-21 = "이부키는 아직 어리니 보살핌이 필요해. 길을 잃고 어딘가에서 헤매다가 나쁜 기억을  갖게 될지도 모르고."
70015020-22 = "선도부장님……."
70015020-23 = "……네, 맞는 말씀이에요. 묵은 감정은 내려놓고, 최대한 협조하지요."
70015020-24 = "그럼 마침 순찰 나갈 때가 되었으니까, 이부키를 중점적으로 찾아보도록 할게."
70015020-25 = "감사합니다, 선도부 여러분……."
70015020-26 = "이거, 마코토 의장이 우리의 협조를 얻어내서 선도부를 쥐고 흔들려는 수작은 아니겠지요?"
70015020-27 = "아마 그럴 여유도 없을 거예요. 마코토 선배는 지금……."
70015020-29 = "이부키이이이이~~~!!! 내가 잘못했다!! 돌아와다오!!!"
70015020-31 = "……."
70015020-32 = "하아……."
70015020-33 = "돕는 것까지는 좋은데, 이부키 양이 어디를 갔는지 도통 알 수가 없네요."
70015020-34 = "이것도 벌써 몇 시간째……."
70015020-38 = "……아?"
70015020-40 = "와아~! 완전 재미있어!"
70015020-46 = "하루카 언니, 시소 엄청 잘 타!"
70015020-47 = "헤헷…… 이부키가 즐거워하니 다행이에요……."
70015020-48 = "우리, 다음에는 그네를 타볼까요?"
70015020-49 = "응! 탈래, 탈래!"
70015020-50 = "쿠후후. 하루카 쨩, 아이를 엄청 잘 돌보네."
70015020-51 = "하루카는 다정한 아이니까."
70015020-52 = "……."
70015020-53 = "사장, 왜 심각한 표정이야?"
70015020-54 = "아니…… 이거 이대로 있어도 되나 싶어서……."
70015020-55 = "아항~ 만마전의 아이라서 그런 거지? 데리고 있다가 만마전이 찾아오기라도 하면……."
70015020-56 = "그, 그게 겁나는 건 아니고!"
70015020-57 = "다만 우리는 비인가 동아리니까 부, 불편해질 수 있다, 랄까?"
70015020-58 = "그냥 그 정도의 사소한? 걱정? 그, 그것 뿐이야!"
70015020-59 = "으음…… 아마 그쪽에서도 지금 이부키를 찾고 있겠지만……."
70015020-60 = "뭐, 별 일이야 있겠어? 따지고 보면 우리가 지금 이부키 쨩을 안전하게 보호하고 있는 거잖아?"
70015020-61 = "그, 그렇겠지?"
70015020-62 = "마침 풍족해진 김에 맛있는 것도 많이 먹였겠다, 좋은 일만 했는걸?"
70015020-63 = "마, 맞지? 그렇지?"
70015020-64 = "……우리가 이부키를 납치했다고 생각하지는 않겠지. 아마."
70015020-65 = "……!!"
70015020-66 = "그, 그그 그러려나~!! 납치라니, 무서운 소리를……!"
70015020-67 = "하지만 우리는 하드보일드로 소문난 악인 집단, 무시무시한 흥신소니까…… 그렇게 생각하는 것도 무리는 아닐 텐데……!!"
70015020-68 = "아니, 진정해. 사장. 설령 그쪽에서 오해한다 해도 이부키가 잘 설명해줄 테니까."
70015020-69 = "아…… 마, 맞지. 으응."
70015020-70 = "음. 잠시 깜빡했을 뿐이야."
70015020-71 = "쿠훗, 역시 우리 사장. 금방 안정을 되찾네."
70015020-72 = "그건 그렇고…… 이부키가 언제쯤 돌아갈지가 관건이네."
70015020-73 = "아니면 그쪽에서 찾으러 올 수도……"
70015020-78 = "……."
70015020-79 = "……아."
70015020-80 = "이건 또 무슨 상황인가요……?"
70015020-82 = "그렇게 된 거야~!!"
70015020-83 = "……그렇군요. 이분들이 이부키 양과 놀아주기도 하고, 맛있는 것도 사주고……."
70015020-84 = "아무리 봐도 납치 아닌가요?!"
70015020-85 = "역시 이런 반응이!!"
70015020-86 = "아니야, 아니야. 이부키가 화나서 나온 거야."
70015020-87 = "이 언니들은 우연히 이부키와 만난 거고. 좋은 분들이에요!"
70015020-88 = "……그렇다면 다행이지만……."
70015020-89 = "이, 이부키, 찾으러 온 사람이 있으니 이제 돌아가겠네요……."
70015020-90 = "가, 같이 놀면서 즐거웠어요. 다음에 또 만날 때까지 건강해요……."
70015020-91 = "……그래요. 이제 돌아가요. 안 그래도 만마전에서 얼마나……."
70015020-92 = "아니야! 이부키, 아직 돌아가지 않을 거야!"
70015020-96 = "어, 어째서죠? 아직 화가 나 있는 건가요, 이부키?"
70015020-97 = "……아니, 화는 풀렸는데……."
70015020-98 = "아직 돌아가고 싶지는 않아."
70015020-99 = "이부키, 언니들이랑 좀 더 같이 있고 싶어!"
70015020-103 = "헤헤…… 그, 그런가요. 이부키. 좀 더 같이 있고 싶나요?"
70015020-104 = "응!! 같이 있을래!!"
70015020-110 = "사, 사장님……."
70015020-111 = "으음……."
70015020-112 = "하아……."
70015020-114 = "저…… 우리 사무실이라도 갈래?"
