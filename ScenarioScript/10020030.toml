[translation]
10020030-9 = "시로코 선배, 다시 나타났어요……."
10020030-10 = "좋아, 이번에야말로 놓치지 않아."
10020030-15 = "그래! 이쪽은 준비 만전이니까. 각오해!"
10020030-16 = "시로코 쨩! 얌전히 포획당할 준비를 하세요!"
10020030-22 = "[ns1] \"시로코! 하나만 가르쳐 줘!\"\n[ns2] \"어째서 프레나파테스의 명령을 듣고 있는 거야?\""
10020030-25 = "……. 아니야. 선생님."
10020030-26 = "내가 프레나파테스의 명령을 듣고 있는 게 아니라, 그 반대야."
10020030-27 = "[s] \"반대라고……?\""
10020030-28 = "……<색채의 인도자>가 내 명령을 듣고 있는 거야."
10020030-29 = "[ns] \"그게 무슨……?\""
10020030-30 = "여러분, 지금 시로코 씨가 있는 위치를 찾아냈어요!"
10020030-31 = "시로코 씨는 지금 방주 제4구역의 폐쇄된 섹터에 있어요! 거기서 신호가 포착되고 있어요!"
10020030-37 = "네? 제4구역이면……."
10020030-39 = "네! 지금 여러분들이 있는 제3구역의 차원엔진실과는 꽤 떨어진 곳이지만……."
10020030-40 = "……."
10020030-41 = "어…… 저기. 시, 시로코 쨩은 지금 우리 앞에 있는데……?"
10020030-45 = "……네? 거기에…… 도?"
10020030-46 = "어, 어……?! 뭐, 뭐죠? 그쪽에도 시로코 씨가 있다고 나오는데……?!"
10020030-47 = "시로코 씨가 제4구역과…… 지금 있는 제3구역의 <차원엔진>에도……?"
10020030-48 = "뭐, 뭐죠? 시로코 씨는 지금 이 방주 안에 둘이 존재한다는 얘기……? 자, 잠깐만요. 서, 설마 저 같은 천재가 실수를 한 건가요……?!"
10020030-49 = "……아니, 그건 실수가 아니야. 고마워, 좋은 정보가 되었다구."
10020030-50 = "네……?"
10020030-51 = "흐음. 이제야 알 것 같네. 으음. 그렇구만~"
10020030-52 = "뭔가 <색채>라는 것 때문에 시로코 쨩이 변해버렸다…… 그렇게 믿고 있었는데 말야."
10020030-53 = "……. 그게 아니었어."
10020030-59 = "저 시로코는 우리가 알고 있는 시로코 쨩이 아니야."
10020030-60 = "[s3] \"………………뭐?\"\n[s4] \"………………뭐라고?\""
10020030-64 = "네……?!"
10020030-65 = "그, 그게 무슨 소리야, 선배?"
10020030-66 = "우리가 알고 있는 시로코 선배가…… 아니라고요?"
10020030-74 = "시, 시로코 선배! 다시 교전 태세로 돌입……!"
10020030-75 = "저희도 대응해야 합니다."
10020030-76 = "뭐어, 진실이 뭔지는 부딪쳐 볼 수밖에 없겠지. 지금은 일단 이 싸움에 집중해야 해!"
10020030-77 = "[ns] \"……알았어!! 지금은 일단 나아갈 수밖에 없어!!\""
10020030-78 = "네!! 지금부터 시로코 선배를 제압하고, <차원엔진>을 파괴하겠습니다!!"
10020030-79 = "선생님, 지휘를 부탁합니다!"
