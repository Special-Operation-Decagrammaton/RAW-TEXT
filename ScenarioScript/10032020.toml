[translation]
10032020-1 = "제2화;더 하드보일드하게"
10032020-2 = "……갱단 연합의 최고 지도자……. <돈 아란치노>를 납치해 달라고……?"
10032020-4 = "이상하게 들릴 수도 있겠지만, 그렇다. 그 말대로다."
10032020-5 = "조금 더 자세한 설명이 필요하겠는데. 당신도 스스로를 <아란치노 패밀리>의 일원이라고 말했잖아."
10032020-6 = "자신의 보스를 납치해 달라니……. 납득하기 쉽지 않은걸."
10032020-7 = "이해한다. 충분히 이상해 보일 수 있겠지."
10032020-8 = "하지만 이건 배신이 아니야. 아니, 오히려 조직을 위한 일이라 할 수 있지."
10032020-9 = "보스는……. 폭주하고 있다. 이대로라면 우리 조직은 남아나지 못하게 될 거야."
10032020-13 = "그러니까 그 전에 보스를 막아달라는 건가. 꽤 부담 있는 의뢰라는 건 그쪽에서도 알고 있겠지?"
10032020-14 = "……물론이다. 무엇보다 거칠고 위험한 일이 되겠지. 따라서 보수는 섭섭잖게 준비했다."
10032020-15 = "단순히 보수만의 문제는……."
10032020-17 = "아, 물론 문제없지! 마침 잘 찾아왔어. 그런 일이라면 우리 흥신소 68이 적임이네. 후후후."
10032020-19 = "……사장……?"
10032020-20 = "……!?"
10032020-25 = "거칠고 위험한 일이라고 했잖아? 하드보일드한 의뢰라는 거잖아?"
10032020-26 = "후후후……. 그 말대로, 여기보다 거칠고 하드보일드한 일에 적합한 곳은 없지. 이 건은 우리에게 맡기도록 해."
10032020-28 = "쿠후후. 아루 쨩, 완전히 스위치가 올라갔네~?"
10032020-29 = "……아."
10032020-30 = "……하아……."
10032020-34 = "설마 했는데 이렇게 흔쾌히 수락할 줄이야……. 고민하는 기색조차 없는 건가."
10032020-35 = "과연, 소문은 거짓말이 아니었던 모양이군, 흥신소 68."
10032020-36 = "일을 제대로 처리하기만 한다면 선금의 네 배를 마저 지급하도록 하지."
10032020-37 = "물론 잘 처리한다면. ……이라는 전제가 깔려 있긴 하지만 말이야."
10032020-38 = " ……실력을 의심하는 건가?"
10032020-39 = "설마. 직책상의 불가피한 직업병이라고 이해해 줬으면 좋겠어. 그게 우리 쪽 성향이기도 하고 말이야."
10032020-40 = "보스……. 그러니까 아란치노는 조심성이 많아서 2중 3중의 안전장치를 둔다는 이야기가 있거든."
10032020-41 = " 흐응……."
10032020-42 = " 문제 될 거 없어. 그렇다면 그 2중 3중 안전장치를 부숴버리면 그만."
10032020-43 = "믿음직한 대답이로군. 그럼 그렇게 진행하도록 하지."
10032020-44 = "날짜와 시간이 정해지면, 보다 자세한 내용을 알려주겠어. 일의 진행을 위해 청사진과 참석자 명단도 모두 구해주도록 하지."
10032020-45 = "……그럼 기다리도록."
10032020-53 = "……저기. 사장……?"
10032020-54 = "아, 아루 님……?"
10032020-55 = "……음? 뭐야? 왜 그런 얼굴들이야……?"
10032020-56 = "이건 혹시나 해서 묻는 건데, 사장……. <아란치노 패밀리>가 어떤 데인지는 알아?"
10032020-57 = "음? ……그, 글쎄? 이름 보면 갱단 같은 거 아냐?"
10032020-58 = "그……. 틀린 말은 아니지만……."
10032020-65 = "……뭐……."
10032020-67 = "뭐라고오오오오~!!"
10032020-69 = "지, 지지, 진짜로!? 갱단 연합의 총수……!? 그냥 갱단 보스가 아니었단 말이야!?"
10032020-70 = "어, 어쩌다!? 어쩌다 그런 녀석과 관련된 사람이 우리 사무실의 위치까지 알아내서……!"
10032020-71 = "아니, 알아냈다니……. 숨긴 적도 없잖아. 오히려 홍보하고 있었지."
10032020-72 = "그나저나 조금 의외인걸, 사장. 범죄자들을 보는 건 어제오늘의 일이 아닐 텐데……."
10032020-73 = "아루 쨩……. 혹시 이제 와서 무서운 거야? 상대가 생각보다 큰 조직이라서?"
10032020-77 = "무, 무섭기는 무슨! 아주 조금 긴장한 것뿐이야! 큰 손이잖아? 큰 손이면 큰돈이잖아!?"
10032020-78 = "지금까지 받았던 일과는 보수의 자릿수도 달랐다고! 일의 내용도 확실히 하드보일드 했고, 이 정도라면……!"
10032020-79 = "아루 쨩……. 정말로 예상대로의 반응이라 재밌네~. 쿠후후."
10032020-80 = "……정말로 괜찮겠어, 사장?"
10032020-81 = "내 입으로 이런 말 하긴 뭐 하지만 이번 일, 정말로 꽤 큰일 같아서. 심상치 않은데."
10032020-82 = "무, 무슨 의미야!? 큰일이니까 받아야 하는 거잖아! 언제까지 고양이 찾아주기나 골목가 불량배 청소 같은 일이나 할 순 없다고!"
10032020-88 = "음? 난 딱히 그런 것도 상관없는데?"
10032020-89 = "저, 저도……! 저도 아루님과 함께하라면 쓰레기통이든 노숙이든 함께……!!"
10032020-91 = "으아아아~! 그만, 그만!! 노숙 이야기는 그만!! 별로 그런 적도 없잖아!!"
10032020-92 = "아무튼 이건 기회야, 우리 흥신소 68의 위상을 떨칠 수 있는 기회!!"
10032020-93 = "모두 잘 들어. 이번 건 절대로 놓칠 수 없어……!!"
10032020-94 = "반드시 이번 의뢰를 성공시키고, 암흑가에 명성을 쌓아서……! 모두에게 극악무도한 하드보일드 조직으로 유명해지는 거야!"
10032020-101 = "더, 더욱더……!"
10032020-111 = "더 하드보일드해지는 거야-!!"
10032020-115 = "……라는 것이 지금까지의 이야기."
10032020-117 = "우선 오페라 하우스 내부를 수색하며, 보스가 심어 뒀을 잔챙이들을 솎아내고 있었어!"
10032020-118 = "혹시나 해서 나도 좀 알아봤는데……. 제시한 이야기들은 다 사실이었거든."
10032020-119 = "갱단 연합의 보스는 세력을 키우기 위해 좋지 않은 일을 꾸미는 게 확실해."
10032020-120 = "그러니 방식과는 별개로, 이건 어느 정도 공익을 위한 일이라는 거지."
10032020-121 = "변명이라는 사실은 부정하진 않겠지만, 선생이 생각하는만큼 나쁜 일도 아니라는 거야."
10032020-128 = "……핫!"
10032020-129 = "고, 공익과는 관계없어! 우린 그저 돈을 받고 일을 하는 것뿐이니까! 우연히 목표가 일치하는 것뿐이라고, 우연히!!"
10032020-131 = "마, 맞아요! 절대로예요! 아루 님이 결정하신 일인 걸요!"
10032020-132 = "……하아."
10032020-136 = "[ns1] \"갱단 보스를 납치하는 일이라…….\"\n[ns2] \"확실히 이번 일은 '하드보일드'하네.\""
10032020-140 = "후후후……. 역시 그렇지? 역시 선생님도 그렇게 생각하는 거지?"
10032020-141 = "드디어 우리 흥신소 68의 이름에 걸맞은 일이 들어온 거라고. 그래서 이렇게 다 같이 옷도 맞춰 입고 왔고 말이야."
10032020-142 = "선생님에게 미리 말하지 않는 부분은 미안하지만……."
10032020-143 = "아무리 선생님이라도, 일을 반대하거나 방해하지는 않기를 바랄게. 우리의 관계를 위해."
10032020-144 = "……응? ……알았다고?"
10032020-145 = "어라, 어째서……? 그렇게 순순히 넘어가도 되는 거야?"
10032020-151 = "거기서 사장이 그걸 되물으면 어떡해."
10032020-152 = "아하하하하!! 아루 쨩 당황했네~! 재미있는 반응!"
10032020-158 = "그, 그렇지만……. 어라……? 정말로……?"
10032020-159 = "……어째서……?"
10032020-160 = "[s3] \"오늘의 나는 그 일로 온 게 아니니까.\"\n[s4] \"아루를 믿으니까, 그런 쪽의 걱정은 안 해.\""
10032020-163 = "……선생님……."
10032020-167 = "후후, 후후후……."
10032020-168 = "과연 선생님이야. 협력자를 고르는 내 안목은 역시나 틀리지 않는군."
10032020-169 = "하긴 그렇지. 선생님이라면 이해해 줄 줄 알았어. 우리의 하드보일드한 길……."
10032020-170 = "방금 전까지 '어째서'냐고 연거푸 되물었지만 말이지."
10032020-171 = "그럼 그런 선생님을 위해……. 협력사로서 보다 긴밀한 도움을 주는 편이 좋겠네."
10032020-172 = "선생님의 그 '오페라 조사' 일……."
10032020-173 = "방금 전엔 작은 소란이 있었지만, 사장의 직함을 걸고, 끝까지 도와주도록 하지."
10032020-174 = "아, 물론 갱단 연합의 보스가 오기 전까지만이야. 그 뒤로는 우리도 우리 일을 해야 하니까."
10032020-175 = "괜찮은 거야, 사장? 기존에 하던 '잠복 요인 색출 작업'은?"
10032020-176 = "같이 하면 되지! 어차피 선생님을 데리고 오페라 하우스를 한 바퀴 둘러봐야 하잖아?"
10032020-182 = "헤에~. 관람객 모드야? 그럼 나도 다시 드레스로 갈아입을까나?"
10032020-183 = "드, 드레스인가요? 결국 입게 되는 건가요, 저도……?"
10032020-184 = "아, 아니! 절대로 싫다는 뜻이 아니라, 그, 저, 저 같은 거랑은, 전혀, 전혀 어울리지 않는 복장이라……."
10032020-185 = "하, 하지만 역시 다른 분들과 드레스 코드를 맞추지 않으면 그건 그것대로 민폐니까……."
10032020-189 = "바, 바로 다녀오겠습니다……!!"
10032020-193 = "쿠후후. 금방 다녀올 테니 조금만 기다려줘, 선생님!"
10032020-199 = "……음……."
10032020-200 = "……선생."
10032020-205 = "자, ……이거 받아."
10032020-206 = "[s5] \"……무선 통신기?\"\n[s6] \"작전의 일원이 되는 거야?\""
10032020-209 = "하루카나 무츠키가 하나 부숴 먹으면 보충하려고 가져온 거지만, 결과적으로 잘됐네."
10032020-210 = "딱히 우리랑 한패가 돼 달라는 의미까지는 아냐. 따지자면 선생님의 안전을 위한 거라고 해둘까."
10032020-211 = "별일은 없을 거라고 생각하지만…… 그래도 혹시 모르니까. 어쨌거나 갱단이 엮인 일이고."
10032020-215 = "사실은……. 웬만하면 오늘은 선생이 그냥 돌아갔으면 좋겠다고 생각하지만……."
10032020-216 = "……어차피 듣지 않겠지, 선생은."
10032020-217 = "[s7] \"응. 아무래도 무리지, 내 입장상.\"\n[s8] \"피차 걱정된다는 건 마찬가지니까.\""
10032020-220 = "하아……."
10032020-221 = "알고 있어, 그런 사람이라는 건. 그런 의미에서 주는 거기도 하니까."
10032020-226 = "그래도 역시 조심해. 물론 지금 당장은 큰 문제가 없을 것 같은 분위기긴 하지만……"
10032020-227 = "아니, '이쪽'은……. 그렇게 형편 좋은 일이라는 게 일어나지 않는 곳이거든."
10032020-228 = "……응? 뭔가 짚이는 거라도 있냐고?"
10032020-229 = "아니. 지금으로서는 딱히 없어. 있었으면 그걸 근거로 말렸겠지."
10032020-230 = "이건 그냥, 뭐랄까. 지금까지의 경험이랄까……. 그냥, 그런 생각이 좀 들었어."
10032020-235 = "……그동안 쌓인 감 같은 거지."
