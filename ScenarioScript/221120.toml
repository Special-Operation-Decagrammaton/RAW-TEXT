[translation]
221120-1 = "제12화;폭풍우 치는 밤에"
221120-3 = "(사나에의 연락을 받고 황급히 새미가 언제나 머무르고 있던 아일랜드의 사관실로 향했다.)"
221120-6 = "올림포스 호, 아일랜드 사관실"
221120-9 = "체온은 36도로 낮아졌고, 수축기 혈압은 190mmHg. 분당 맥박수도 220회를 초과합니다."
221120-10 = "호흡 수가 분당 30회를 넘었고, 개구 호흡을 반복하는 것으로 보아 심장 기능도 꽤 악화된 것 같습니다."
221120-11 = "아무래도 만성적인 신장 기능 저하로 인해 높아진 혈압이 심장에 무리를 준 모양이군요."
221120-12 = "그 외에도 전반적인 활력 징후가 좋지 않아서…… 오래 가지 못할 것 같습니다."
221120-13 = "그런…… 오늘 오전까지만 하더라도 신나게 배 위를 뛰어다녔잖아요?"
221120-14 = "어째서 갑자기 이렇게……"
221120-15 = "언제 이렇게 되더라도 이상하지 않은 상태였으니까요."
221120-16 = "새미의 나이를 고려하면 몇 시간 만에 위독해지는 일도 드문 경우가 아닙니다."
221120-17 = "오히려…… 지금까지 증상이 나타나지 않은 것이 더 신기했을 정도지요."
221120-23 = "……나 때문이야."
221120-24 = "내가 새미를 하선시킨다고 너무 무리를 하게 만드는 바람에 새미의 상태가 악화된 거야."
221120-25 = "내가 조금만 더 빨리 용기를 냈었어도……"
221120-27 = "현 시점에 그런 가정은 무의미합니다, 함장."
221120-28 = "병이 진행되는 원인은 환경적 요인을 포함하여 무수한 우연과 필연으로 이루어져 있습니다."
221120-29 = "그걸 면도날로 재단하듯, 하나의 가정으로 치부해 버린다면 그 어떤 병도 치료할 수 없을테니까요."
221120-30 = "지금은 현상에 주목 부탁드리겠습니다."
221120-31 = "…………하아."
221120-32 = "함장. 결정을 부탁드립니다."
221120-33 = "무슨…… 결정을?"
221120-34 = "새미가 우리에게 소중한 벗이고, 헤어지고 싶지 않다는 마음은 저도 마찬가지입니다만."
221120-35 = "고양이가 배 위에서 목숨을 잃는 일은, 단순히 휘파람이나 재채기와는 비교도 할 수 없는 금기입니다."
221120-36 = "그렇기에, 그동안 오디세이아의 모든 함재묘는 육지에서 숨을 거두었습니다."
221120-37 = "빨리 결정하지 않으면…… 돌이킬 수 없게 될지도 모릅니다."
221120-42 = "아무리 금기를 어겨서는 안된다고 해도…… 이건 너무해요!"
221120-43 = "스미카, 아일랜드의 결정에 멋대로 참견하지마."
221120-44 = "[s] \"잠깐만, 지금은 그런 이야기를 할 때가—\""
221120-46 = "잠시만 기다려주십시오, 선생님."
221120-47 = "전에도 말씀드렸지만 이는 오디세이아 학원의 일이니까요."
221120-48 = "저희가 결정하겠습니다."
221120-55 = "아미 부장, 함 내 긴급 방송을 준비해줘."
221120-56 = "지금부터 올림포스 호의 출항을 준비할 예정이니까."
221120-66 = "아아, 여기는 오디세이아 함장, 우미지 미나토다."
221120-67 = "갑자기 다들 놀랐지? 평소에는 이렇게 직접 방송을 하는 일도 없었으니까, 아마 내 목소리를 처음 듣는 사람도 있었을 거야."
221120-68 = "늦은 시간이고, 이른 취침을 준비 중이던 학생이 있을지도 모르겠지만……"
221120-72 = "함장으로서 오디세이아 총원에게 전파할 사항이 있다."
221120-73 = "오디세이아 학원의 함재묘이자, 우리의 오랜 벗인 새미의 상태가…… 좋지 않다."
221120-74 = "후나모리 의무실장의 말에 의하면 며칠— 아니, 오늘 밤을 넘기기도 어려울지도 모르겠다고 하더군."
221120-75 = "다들 알고 있겠지만, 배에서 고양이가 죽는 건 뱃사람으로서 절대로 용납해서는 안 되는 금기다."
221120-76 = "그렇기에 오디세이아의 선배들은 함재묘의 수명이 끝나가면 뭍에 내려주고, 새 함재묘를 들여왔었지."
221120-78 = "……하지만 이전의 함재묘는 어땠는지 몰라도, 새미는 이 배를 좋아했다."
221120-80 = "갑판 위에서 피어오르는 비눗방울을 쫓으며, 학생들과 술래잡기를 하는 걸 좋아했다."
221120-82 = "볕이 잘 드는 날은 함교에 올라 비릿한 바람을 쐬며 수면을 내려다보는 걸 좋아했다."
221120-85 = "……낡은 로프로 만든 조잡한 장난감 공을 물고, 공놀이를 하는 걸 좋아했다."
221120-88 = "그렇기에 오랜 벗을 낯선 땅 위의 침상에서 떠나게 하는 건 벗에 대한 실례라고 생각했다."
221120-92 = "그래서 이번만큼은 함장의 권한으로 다소 억지를 부리려고 한다."
221120-93 = "새미에게 마지막 선물로, 새미가 가장 좋아하는 바다의 풍경을 선물하자."
221120-94 = "모든 것이 멈추어 있는 항구의 풍경이 아닌, 파도가 넘실대고 바닷 바람이 코를 간질이는 일상의 풍경을 선물하자."
221120-95 = "오디세이아의 기함, 올림포스는 벗의 환송을 위해 명일 0600 시 출항을 예정하고 있다."
221120-96 = "당연히 이 불길한 항해에 함께할 의무는 귀관들에게 없다."
221120-97 = "금기를 피하기 위해 이 배에서 내린다 하더라도 책임을 묻지 않겠다."
221120-98 = "……이의가 있다면 항해가 끝나고 받도록 하지."
221120-103 = "각 부서는 기재태세 점검 후, 출항 전 보고서 제출할 것."
221120-104 = "이상, 오디세이아 함장. 우미지 미나토."
221120-108 = "다음화;마지막 항해"
