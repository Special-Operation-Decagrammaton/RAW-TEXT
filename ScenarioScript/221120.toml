221120-1 = "#title;제12화;폭풍우 치는 밤에"
221120-3 = "#na;(사나에의 연락을 받고 황급히 새미가 언제나 머무르고 있던 아일랜드의 사관실로 향했다.)"
221120-6 = "#place;올림포스 호, 아일랜드 사관실"
221120-8 = "3;사나에;06\n#3;em;…\n#3;a\n#wait;2500"
221120-9 = "3;사나에;19;체온은 36도로 낮아졌고, 수축기 혈압은 190mmHg. 분당 맥박수도 220회를 초과합니다."
221120-10 = "3;사나에;99;호흡 수가 분당 30회를 넘었고, 개구 호흡을 반복하는 것으로 보아 심장 기능도 꽤 악화된 것 같습니다."
221120-11 = "3;사나에;02;아무래도 만성적인 신장 기능 저하로 인해 높아진 혈압이 심장에 무리를 준 모양이군요."
221120-12 = "3;사나에;06;그 외에도 전반적인 활력 징후가 좋지 않아서…… 오래 가지 못할 것 같습니다."
221120-13 = "3;스미카;11;그런…… 오늘 오전까지만 하더라도 신나게 배 위를 뛰어다녔잖아요?\n#3;stiff"
221120-14 = "3;스미카;06;어째서 갑자기 이렇게……"
221120-15 = "3;사나에;02;언제 이렇게 되더라도 이상하지 않은 상태였으니까요."
221120-16 = "3;사나에;01;새미의 나이를 고려하면 몇 시간 만에 위독해지는 일도 드문 경우가 아닙니다."
221120-17 = "3;사나에;99;오히려…… 지금까지 증상이 나타나지 않은 것이 더 신기했을 정도지요."
221120-18 = "#st;[0,0];instant;1;"
221120-20 = "3;사나에;99\n#3;d\n#wait;1200"
221120-22 = "3;미나토;16\n#3;a\n#wait;1200"
221120-23 = "3;미나토;17;……나 때문이야.\n#3;stiff"
221120-24 = "3;미나토;16;내가 새미를 하선시킨다고 너무 무리를 하게 만드는 바람에 새미의 상태가 악화된 거야."
221120-25 = "3;미나토;06;내가 조금만 더 빨리 용기를 냈었어도……"
221120-27 = "3;사나에;02;현 시점에 그런 가정은 무의미합니다, 함장."
221120-28 = "3;사나에;99;병이 진행되는 원인은 환경적 요인을 포함하여 무수한 우연과 필연으로 이루어져 있습니다."
221120-29 = "3;사나에;00;그걸 면도날로 재단하듯, 하나의 가정으로 치부해 버린다면 그 어떤 병도 치료할 수 없을테니까요."
221120-30 = "3;사나에;02;지금은 현상에 주목 부탁드리겠습니다."
221120-31 = "3;아미;06;…………하아.\n#3;em;[속상함]"
221120-32 = "3;아미;05;함장. 결정을 부탁드립니다."
221120-33 = "3;미나토;16;무슨…… 결정을?\n#3;stiff"
221120-34 = "1;아미;05;새미가 우리에게 소중한 벗이고, 헤어지고 싶지 않다는 마음은 저도 마찬가지입니다만.\n#1;ar\n#3;m5"
221120-35 = "1;아미;07;고양이가 배 위에서 목숨을 잃는 일은, 단순히 휘파람이나 재채기와는 비교도 할 수 없는 금기입니다."
221120-36 = "1;아미;08;그렇기에, 그동안 오디세이아의 모든 함재묘는 육지에서 숨을 거두었습니다."
221120-37 = "1;아미;05;빨리 결정하지 않으면…… 돌이킬 수 없게 될지도 모릅니다."
