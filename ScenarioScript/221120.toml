221120-71 = "3;미나토;06\n#3;stiff\n#wait;1300"
221120-72 = "3;미나토;05;함장으로서 오디세이아 총원에게 전파할 사항이 있다.\n#3;em;[반응]"
221120-73 = "3;미나토;17;오디세이아 학원의 함재묘이자, 우리의 오랜 벗인 새미의 상태가…… 좋지 않다."
221120-74 = "3;미나토;06;후나모리 의무실장의 말에 의하면 며칠— 아니, 오늘 밤을 넘기기도 어려울지도 모르겠다고 하더군."
221120-75 = "3;미나토;16;다들 알고 있겠지만, 배에서 고양이가 죽는 건 뱃사람으로서 절대로 용납해서는 안 되는 금기다."
221120-76 = "3;미나토;05;그렇기에 오디세이아의 선배들은 함재묘의 수명이 끝나가면 뭍에 내려주고, 새 함재묘를 들여왔었지."
221120-78 = "#na;미나토;……하지만 이전의 함재묘는 어땠는지 몰라도, 새미는 이 배를 좋아했다."
221120-79 = "#3;hide\n5;오디세이아 학생 A;02\n1;오디세이아 학생 B;02\n3;???;00"
221120-80 = "#na;미나토;갑판 위에서 피어오르는 비눗방울을 쫓으며, 학생들과 술래잡기를 하는 걸 좋아했다."
221120-81 = "#1;hide\n#5;hide\n#3;hide\n2;여객관리부 부원 A;02\n4;여객관리부 부원 A;02\n3;???;00"
221120-82 = "#na;미나토;볕이 잘 드는 날은 함교에 올라 비릿한 바람을 쐬며 수면을 내려다보는 걸 좋아했다."
221120-85 = "#na;미나토;……낡은 로프로 만든 조잡한 장난감 공을 물고, 공놀이를 하는 걸 좋아했다."
221120-88 = "3;미나토;06;그렇기에 오랜 벗을 낯선 땅 위의 침상에서 떠나게 하는 건 벗에 대한 실례라고 생각했다.\n#3;a"
221120-89 = "#st;[0,0];instant;1;"
221120-91 = "3;미나토;17\n#3;em;…\n#wait;2500"
221120-92 = "3;미나토;05;그래서 이번만큼은 함장의 권한으로 다소 억지를 부리려고 한다.\n#3;closeup"
221120-93 = "3;미나토;00;새미에게 마지막 선물로, 새미가 가장 좋아하는 바다의 풍경을 선물하자.\n#3;closeup"
221120-94 = "3;미나토;99;모든 것이 멈추어 있는 항구의 풍경이 아닌, 파도가 넘실대고 바닷 바람이 코를 간질이는 일상의 풍경을 선물하자.\n#3;closeup"
221120-95 = "3;미나토;00;오디세이아의 기함, 올림포스는 벗의 환송을 위해 명일 0600 시 출항을 예정하고 있다.\n#3;closeup"
221120-96 = "3;미나토;19;당연히 이 불길한 항해에 함께할 의무는 귀관들에게 없다.\n#3;closeup"
221120-97 = "3;미나토;15;금기를 피하기 위해 이 배에서 내린다 하더라도 책임을 묻지 않겠다.\n#3;closeup"
