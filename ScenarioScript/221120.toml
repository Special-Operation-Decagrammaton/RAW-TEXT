221120-67 = "3;미나토;01;갑자기 다들 놀랐지? 평소에는 이렇게 직접 방송을 하는 일도 없었으니까, 아마 내 목소리를 처음 듣는 사람도 있었을 거야."
221120-68 = "3;미나토;08;늦은 시간이고, 이른 취침을 준비 중이던 학생이 있을지도 모르겠지만……"
