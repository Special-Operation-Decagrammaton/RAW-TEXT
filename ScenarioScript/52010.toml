[translation]
52010-1 = "제1화;닿지 못한 옷자락"
52010-13 = "……백화요란 분쟁조정위원회 1학년, 고료 나구사."
52010-21 = "……그리고, 백화요란 분쟁조정위원회 1학년, 나나카도 아야메."
52010-27 = "두 사람 모두 앞으로."
52010-30 = "예로부터 전해 내려오는 백화요란의 관례에 따라—"
52010-31 = "자, 정정당당하게."
52010-38 = "승부!"
52010-46 = "……빈틈."
52010-64 = "머리—!"
52010-71 = "……윽."
52010-72 = "나나카도 아야메, 승!"
52010-77 = "……이걸로 201전, 201승. 전승인가."
52010-78 = "이번에도 좋은 대련이었어. 고마워, 나구사."
52010-82 = "우으, 우으으……"
52010-83 = "나, 나구사 쨩?"
52010-84 = "아야메에게 또 지고 말았어……"
52010-85 = "우, 울지 마. 나구사 쨩도 충분히 잘했으니까!"
52010-86 = "하지만…… 이런 실력으로는 아야메에게 도움이 될 수 없는 걸."
52010-87 = "그렇게 오랫동안 단련했지만 여전히 아야메의 옷깃조차 스치지 못하다니…… 이런 내가 너무 한심해……"
52010-88 = "자책하지 마. 그래서 너를 돕기 위해 내가 곁에 있는 거잖아."
52010-94 = "자, 내 손 잡아."
52010-97 = "네가 넘어지더라도 언제든 손을 내밀어 줄 수 있도록 곁에 있어 줄게."
52010-101 = "내가 도움이 되기는커녕 네 발목만 잡는다 해도?"
52010-102 = "물론이야."
52010-103 = "나는 무슨 일이 있으면 울음부터 터트리는 울보인데도?"
52010-104 = "알고 있어."
52010-105 = "우유부단한 성격 탓에 중요한 순간에는 얼어붙기 일쑤인데—"
52010-106 = "괜찮아. 그러니까 나는 너를—"
52010-114 = "단 한 번도 친구라고 생각한 적이 없었어."
52010-132 = "………!"
52010-133 = "하아, 하아…… 꿈이었구나……"
52010-134 = "아직도 아야메의 옷깃이 손에서 빠져나가는 감촉이 생생한데, 이게 꿈이라니."
52010-139 = "……윽."
52010-142 = "아파……"
52010-143 = "……날이 지날수록 팔이 안쪽에서 타들어 가는 것 같아."
52010-144 = "그때 아야메를 붙잡았더라면 애초에 이런 고통을 느낄 필요도 없었을 텐데."
52010-148 = "우으으……"
52010-149 = "……미안해, 아야메."
52010-150 = "정말 미안해……"
52010-152 = "내가 아무짝에도 쓸모없는 나라서."
52010-153 = "너를 붙잡을 힘조차 없는 나약한 나라서……"
52010-157 = "정말로 미안해, 아야메……"
52010-159 = "다음화;새로운 괴담"
