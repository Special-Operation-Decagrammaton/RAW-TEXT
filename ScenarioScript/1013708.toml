[translation]
1013708-1 = "การพักฟื้นของตำรวจ"
1013708-2 = "คุณครูเป็นห่วงโคโนกะที่เป็นหวัด จึงมาเยี่ยมไข้"
1013708-6 = "[ns] \"อยู่หรือเปล่า?\""
1013708-7 = "อะ... อึก... ฉันเกือบหลับได้แล้วนะ... เฮ้อ..."
1013708-8 = "ฉันบอกไปตั้งหลายรอบแล้วไม่ใช่เหรอว่าบ้านฉันไม่มีทีวีน่ะ!!!"
1013708-9 = "แค่กๆ ก็ตอนเกมเบสบอลแพ้ ฉันโมโหจนทุ่มทีวีทิ้งไปน่ะสิ..."
1013708-10 = "ถ้ามาอีกละก็ แค่กๆ ฉันจับขังแน่ จริงๆ นะ!"
1013708-11 = "[s1] \"จะ... ใจเย็นๆ นะ โคโนกะ นี่ครูเอง!\"\n[s2] \"นี่ครูเองนะ ครูจากชาเล่ต์ไง!\""
1013708-14 = "เอะ... เอ๋?!"
1013708-15 = "อะไรกัน คุณครูเองเหรอคะ?! เชิญเข้ามาเลยค่ะ! ประตูไม่ได้ล็อกค่ะ!"
1013708-19 = "[ns] \"อยู่คนเดียว ทำไมไม่ล็อกประตูล่ะ?!\""
1013708-20 = "แค่กๆ ก็ถ้าขโมยเปิดประตูเข้ามา ก็จะจับได้คาหนังคาเขาเลยยังไงล่ะคะ"
1013708-21 = "มันก็คล้ายๆ กับการทำผลงานโดยอัตโนมัติน่ะค่ะ"
1013708-22 = "[s] \"มีขโมยเข้ามาในหอพักวัลคิรี่ด้วยเหรอ?!\""
1013708-23 = "พวกโจรหัวขโมยน่ะไม่ใส่ใจเรื่องแบบนั้นหรอกค่ะ พวกนั้นความคิดแตกต่างจากพวกเราค่ะ"
1013708-24 = "ว่าแต่มีธุระอะไรที่นี่คะ... แค่กๆ..."
1013708-25 = "[s] \"ครูรู้ว่าเป็นหวัด ก็เลยมาเยี่ยมไข้น่ะสิ!\""
1013708-26 = "รู้ได้ยังไงคะว่าฉันเป็นหวัด?! หรือแอบส่งนักสืบตามติดฉันคะ?!!"
1013708-27 = "[s3] \"ก็โคโนกะส่ง MOMOTALK มาบอกครูเอง...\"\n[s4] \"ก็บอกครูเองไม่ใช่เหรอว่าเปียกฝนมาจนเป็นหวัด...\""
1013708-30 = "แค่กๆ... เอะ... เอ๋...?"
1013708-32 = "อ๊ะ แค่กๆ สงสัยฉันจะไม่สบายจนเบลอๆ ไป"
1013708-33 = "คิดว่าส่งไปบอกเด็กๆ ซะอีก คงจะส่งผิดไปหาคุณครูน่ะค่ะ"
1013708-34 = "ส่งผิดแท้ๆ แต่คุณครูก็อุตส่าห์มาเยี่ยมไข้ น่าอายจังเลยนะคะ"
1013708-35 = "[s] \"โคโนกะป่วยทั้งที ครูก็ต้องมาเยี่ยมอยู่แล้ว!\""
1013708-36 = "อึก... ขอบคุณนะคะ แต่ว่า เอ่อ... ตอนนี้ฉันไม่สบายเอามากๆ"
1013708-37 = "แล้วนี่ก็เป็นครั้งแรกที่มีคนมาเยี่ยมไข้ด้วย ฉันไม่รู้ว่าต้องทำยังไงค่ะ"
1013708-38 = "[s5] \"ต้องกินอะไรให้มีแรงก่อนนะ กินโจ๊กมั้ย?\"\n[s6] \"ให้ครูต้มโจ๊กให้กินมั้ย?\""
1013708-41 = "โจ๊กเหรอคะ... จะว่าไปวันนี้ฉันก็ยังไม่ได้กินอะไรเลยค่ะ"
1013708-42 = "ถ้างั้นก็... แค่กๆ ฉันขอเป็นซุปทงคตสึใส่กระเทียมเยอะๆ ไม่ใส่ผัก และใส่น้ำมันคั่วพริกให้เผ็ดๆ หน่อยได้มั้ยคะ?"
1013708-43 = "[s] \"ที่นี่ไม่ใช่ร้านราเม็งนะ!\""
1013708-44 = "คะ?"
1013708-47 = "ฮู่ว ขอบคุณสำหรับอาหารค่ะ"
1013708-48 = "มันเหมือนราเม็งที่ไม่มีเส้น ก็เลยกินง่ายเลยค่ะ แต่น่าจะใส่กระเทียมให้มากกว่านี้นะ"
1013708-49 = "[s] \"ตอนนี้คนไข้ดูสดชื่นขึ้นแล้ว ก็ถือว่าโอเคละนะ...?\""
1013708-50 = "อะฮ่า แค่กๆ คนไข้อะไรกันล่ะคะ เป็นห่วงเป็นใยกันมากไปแล้ว"
1013708-51 = "ฉันแค่เป็นหวัดเองค่ะ ได้โหนบาร์ดึงข้อให้ได้เหงื่อนิดหน่อยก็ดีขึ้นแล้ว..."
1013708-56 = "[ns] (วางมือบนหน้าผากของโคโนกะ)"
1013708-58 = "!!!"
1013708-59 = "อ่า..."
1013708-63 = "แค่กๆ..."
1013708-64 = "หืม...?"
1013708-65 = "[s] \"รีบไปนอนพักเลย!\""
1013708-66 = "อ่า..."
1013708-67 = "อื้อ..."
1013708-71 = "[ns] \"เป็นยังไงบ้าง เป็นไข้หนักเลยใช่มั้ยล่ะ?\""
1013708-72 = "อ๊ะ... อ่า...!"
1013708-73 = "พะ... พอได้มานอน... ก็รู้สึกว่าไม่สบายหนักจริงๆ... ด้วยค่ะ"
1013708-74 = "คะ... แค่กๆ แค่กๆ โอย..."
1013708-75 = "[s] \"ครูจะอยู่เฝ้าไข้จนกว่าจะหลับนะ\""
1013708-76 = "ค่ะ... ค่ะ..."
1013708-77 = "อ๊ะ งั้นก็... ฝากล็อกประตูให้หน่อย... นะคะ"
1013708-78 = "ตอนนี้ฉันไม่สบาย ถ้ามีใครเข้ามา ฉันน่าจะปกป้องคุณครู... ไม่ได้ค่ะ "
1013708-79 = "[s] \"อื้อ! ถ้าเบื่อๆ ละก็ ครูอ่านดวงประจำวันให้ฟังเอามั้ย?\""
1013708-80 = "อึก... ไม่เป็นไรค่ะ"
1013708-81 = "ฉันรู้ว่าวันนี้จะเป็นวันที่ดีที่สุดค่ะ แล้ววันนี้ฉันก็คือดาวเด่นของวันเลยด้วย "
1013708-83 = "(หลังจากนั้นคุณครูก็ได้ใช้เวลาร่วมกับโคโนกะต่อ)"
