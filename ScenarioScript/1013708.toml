[translation]
1013708-1 = "The Detective's Self-Care Time"
1013708-2 = "Konoka had caught a cold, so I went to go visit her."
1013708-6 = "[ns] \"Anyone here?\""
1013708-7 = "U-Ugh... I almost fell asleep... *sigh*"
1013708-8 = "I've already told you I DON'T HAVE A TV!!"
1013708-9 = "I smashed it when we lost that baseball game..."
1013708-10 = "I *cough* told you that I'd arrest you too, *cough* if I ever saw your face again!"
1013708-11 = "[s1] \"C-Calm down, Konoka!\"\n[s2] \"It's me!\""
1013708-14 = "E-Eh?!"
1013708-15 = "What the—?! It was Sensei?! Come in! Door's open!"
1013708-19 = "[ns] \"You don't lock your doors?!\""
1013708-20 = "*cough* A thief would be caught in the act if they opened the door, right?"
1013708-21 = "It's like I'm baiting arrests? Eh, basically."
1013708-22 = "[s] \"People come and steal from the Valkyrie dorms, of all places?\""
1013708-23 = "Thieves don't think like that. They just want to get whatever they want."
1013708-24 = "More importantly, what brings— *cough*"
1013708-25 = "[s] \"I heard you caught a cold, so I came for a visit!\""
1013708-26 = "How did you know that?! Did you have someone tailing me?!"
1013708-27 = "[s3] \"You told me in MomoTalk...\"\n[s4] \"You said you caught a cold from the rain...\""
1013708-30 = "*cough* E-Eh...?"
1013708-32 = "Oh. *cough* I was a little delirious from the fever."
1013708-33 = "I thought I was texting my team, but I guess it was you."
1013708-34 = "And now you came all this way for a visit... Huh. I dunno what to say now."
1013708-35 = "[s] \"You said you're sick, so of course I had to come!\""
1013708-36 = "Auuugh, thank you. But I'm feeling...really sick right now..."
1013708-37 = "No one's ever visited me when I was sick before. What do I do?"
1013708-38 = "[s5] \"Let's get something to eat first!\"\n[s6] \"Do you want porridge?\""
1013708-41 = "Porridge, you say...? Now that I think about it, I've just been sleeping."
1013708-42 = "In that case... *cough* I'll have tonkotsu with lots of garlic, no veggies, plenty of oil, and make it just a bit spicy."
1013708-43 = "[s] \"This isn't the ramen shop!\""
1013708-44 = "Huh?"
1013708-47 = "Phew, thank you for the meal."
1013708-48 = "It was nice and smooth, like ramen without noodles. Could've used a little more garlic, though!"
1013708-49 = "[s] \"As long as the patient is happy, I guess...!\""
1013708-50 = "Haha. *cough* You're calling me a patient? You're too soft."
1013708-51 = "It's just some sniffles! A few pull-ups, and I could just sweat this away!"
1013708-56 = "[ns] Place a hand on Konoka's forehead."
1013708-58 = "!!!"
1013708-59 = "Uh..."
1013708-63 = "*cough*"
1013708-64 = "...Ah...?"
1013708-65 = "[s] \"Let's go lie down and get some rest!\""
1013708-66 = "Ah..."
1013708-67 = "Yeah..."
1013708-71 = "[ns] \"How are you feeling?\""
1013708-72 = "Ah, um...!"
1013708-73 = "U-Um... Now that I'm lying down, I do feel somewhat...sick."
1013708-74 = "*cough* *cough* Oww."
1013708-75 = "[s] \"I'll stay here until you fall asleep.\""
1013708-76 = "R-Right..."
1013708-77 = "Ah, in that case... Please lock the door."
1013708-78 = "Because I'm sick, I can't protect you...if someone did come in. "
1013708-79 = "[s] \"Sure thing! Want me to read your daily horoscope to you?\""
1013708-80 = "U-Uh, I'm fine."
1013708-81 = "Today has to be the best day ever. There's no questioning that I'm the star of the day. "
1013708-83 = "I spent some time with Konoka until she finally fell asleep."
