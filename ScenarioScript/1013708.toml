[translation]
1013708-1 = "那位刑警的療養"
1013708-2 = "（因為擔心感冒的木乃香，所以來探病了）"
1013708-6 = "[ns] 「有人在嗎──？」"
1013708-7 = "唔，呃……差點就睡著了說……唉……"
1013708-8 = "說了多少遍，我家沒有電視！！！"
1013708-9 = "咳咳，棒球輸的那天就砸壞了……"
1013708-10 = "我明明說了，咳咳，再來的話就要逮捕你。"
1013708-11 = "[s1] 「冷，冷靜點木乃香！」\n[s2] 「是我，是我！」"
1013708-14 = "咦？咦咦！？"
1013708-15 = "什麼！？是老師嗎！？ 請進！門開著！"
1013708-19 = "[ns] 「你沒鎖門嗎！？」"
1013708-20 = "咳咳，小偷打開門進來的話，就是現行犯嘛。"
1013708-21 = "算是自動刷業績的感覺吧。"
1013708-22 = "[s] 「會有人來女武神宿舍偷東西嗎……！？」"
1013708-23 = "哎呀，在意那種事還怎麼偷東西？他們跟我們的思維方式本來就不一樣。"
1013708-24 = "比起那個，有什麼事……咳咳……"
1013708-25 = "[s] 「聽說你感冒，所以就來探病了。」"
1013708-26 = "你怎麼知道的！？ 難道你派人監視我嗎！？"
1013708-27 = "[s3] 「木乃香用MomoTalk告訴我的……」\n[s4] 「說是被雨淋濕感冒了。」"
1013708-30 = "咳咳，咦……？"
1013708-32 = "啊啊……咳咳，病得暈頭轉向了。"
1013708-33 = "原本是要發給我們的人的，結果不小心發給老師了。"
1013708-34 = "還讓老師特地來探病，真是慚愧……"
1013708-35 = "[s] 「木乃香都生病了，當然要來啊！」"
1013708-36 = "嗚嗚，謝謝。但是，我現在……太難受了……"
1013708-37 = "第一次因為感冒被探病，所以不知道該怎麼辦。"
1013708-38 = "[s5] 「先好好吃飯吧！」\n[s6] 「我煮粥給你吃？」"
1013708-41 = "粥……啊……這麼說來，我一直睡都沒吃飯。"
1013708-42 = "那就……咳咳，豚骨然後大蒜多一點，不要蔬菜辣油多一點。"
1013708-43 = "[s] 「這裡不是拉麵店耶！？」"
1013708-44 = "咦？"
1013708-47 = "呼……吃飽了。"
1013708-48 = "像沒有麵的拉麵一樣很好入口，應該多放點蒜的。"
1013708-49 = "[s] 「總之病人看起來很開心所以OK……？」"
1013708-50 = "咳，咳咳……病人什麼的，太誇張了。"
1013708-51 = "只是感冒而已，做幾個引體向上流流汗很快就好──"
1013708-56 = "[ns] 把手放在木乃香的額頭上"
1013708-58 = "！！！"
1013708-59 = "呀啊……！"
1013708-63 = "……咳咳。"
1013708-64 = "……咦？"
1013708-65 = "[s] 「快躺下休息！」"
1013708-66 = "啊……"
1013708-67 = "嗯……"
1013708-71 = "[ns] 「怎麼樣？還很難受嗎？」"
1013708-72 = "啊，呃……！"
1013708-73 = "呃，嗯……躺下來之後，好像確實……有點難受。"
1013708-74 = "咳，咳咳，哎呀～好，好痛啊～"
1013708-75 = "[s] 「我會陪你到睡著的。」"
1013708-76 = "好，好的……"
1013708-77 = "啊，那……把門鎖上吧……"
1013708-78 = "我生病了，如果有人進來，我沒辦法保護老師，所以……"
1013708-79 = "[s] 「嗯，無聊的話，要我唸今天的占卜給你聽嗎？」"
1013708-80 = "沒關係。"
1013708-81 = "今天肯定是最棒的一天，我就是今天的主角。"
1013708-83 = "（之後和木乃香一起度過了一段時間）"
