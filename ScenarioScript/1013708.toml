[translation]
1013708-1 = "那位刑警的療養"
1013708-2 = "（擔心感冒的木乃香，於是前來探病）"
1013708-6 = "[ns] 「有人在嗎──？」"
1013708-7 = "唔，唔呃……差點就睡著了說……唉……"
1013708-8 = "已經跟你們說過好幾次了，我家沒有電視啦！！！"
1013708-9 = "咳咳，在棒球輸掉的那天就被我砸壞了……"
1013708-10 = "要是之後敢再來推銷……咳咳，我真的會逮捕你，聽到沒有！"
1013708-11 = "[s1] 「你，你先冷靜點，木乃香！」\n[s2] 「是我，是我啊！」"
1013708-14 = "咦？咦咦！？"
1013708-15 = "什麼！？是老師嗎！？#n請進請進！門開著！"
1013708-19 = "[ns] 「你都不鎖門的嗎！？」"
1013708-20 = "咳咳，要是小偷打開門進來的話，就是現行犯了嘛。"
1013708-21 = "類似放置刷業績的那種感覺？"
1013708-22 = "[s] 「會有人想來女武神的宿舍偷東西嗎……！？」"
1013708-23 = "哎呀，要是在意那種事還能當小偷嗎？#n他們跟我們的思維方式本來就是不一樣的啦。"
1013708-24 = "話說回來，找我有什麼事嗎……咳咳……"
1013708-25 = "[s] 「聽說你感冒，所以就來探病了。」"
1013708-26 = "老師是怎麼知道的！？難道你有派人監視我嗎！？"
1013708-27 = "[s3] 「是木乃香自己用MomoTalk告訴我的……」\n[s4] 「說是被雨淋濕所以感冒了。」"
1013708-30 = "咳咳，咦……？"
1013708-32 = "啊啊……咳咳，看來我已經病到腦袋有點不清楚了。"
1013708-33 = "本來是要傳給我們學園的孩子，結果不小心傳給老師了。"
1013708-34 = "居然麻煩老師特地過來探病，真是不好意思……"
1013708-35 = "[s] 「木乃香都生病了，當然要來啊！」"
1013708-36 = "嗚嗚，謝謝你。#n但是我現在……真的很不舒服……"
1013708-37 = "我也是第一次因為感冒而被人探病，所以不知道該怎麼辦才好。"
1013708-38 = "[s5] 「先好好吃頓飯吧！」\n[s6] 「要不要我煮粥給你吃？」"
1013708-41 = "你說粥嗎……這麼說來，我好像只顧著睡覺，到現在都還沒吃飯呢。"
1013708-42 = "那就……咳咳，豚骨口味大蒜多、不要蔬菜油脂多、辣度微辣就好。"
1013708-43 = "[s] 「這裡不是拉麵店啦！」"
1013708-44 = "咦？"
1013708-47 = "呼……吃飽了。"
1013708-48 = "像沒有麵的拉麵一樣很好入口呢。要是再多放一點大蒜就更完美了。"
1013708-49 = "[s] 「既然病人看起來很開心，應該沒問題吧……？」"
1013708-50 = "咳，咳咳……說什麼病人，老師也太誇張了吧。"
1013708-51 = "不過就是感冒而已。只要做幾個引體向上流流汗，很快就能──"
1013708-56 = "[ns] 把手放在木乃香的額頭上"
1013708-58 = "！！！"
1013708-59 = "呀啊……！"
1013708-63 = "……咳咳。"
1013708-64 = "……咦？"
1013708-65 = "[s] 「快點躺下休息！」"
1013708-66 = "啊……"
1013708-67 = "嗯……"
1013708-71 = "[ns] 「怎麼樣？還很難受嗎？」"
1013708-72 = "啊，呃……！"
1013708-73 = "唔……躺下來之後……好像還挺不舒服的。"
1013708-74 = "咳，咳咳，哎呀～好，好痛啊～"
1013708-75 = "[s] 「在你睡著之前，我都會陪著你的。」"
1013708-76 = "好，好的……"
1013708-77 = "啊，那麼……麻煩你……幫我把門鎖上吧……"
1013708-78 = "畢竟我現在生病了……要是有人闖進來的話，沒辦法保護老師……"
1013708-79 = "[s] 「嗯。如果覺得無聊的話，要不要我唸今天的占卜給你聽？」"
1013708-80 = "唔嗯……沒關係。"
1013708-81 = "反正今天肯定是最棒的一天。畢竟我可是今天的主角啊。"
1013708-83 = "（之後陪在木乃香身邊，度過了一段時光）"
