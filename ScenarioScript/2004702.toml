[translation]
2004702-1 = "작전참모의 권유법"
2004702-3 = "[ns] \"키쿄~! 나 왔어!\""
2004702-4 = "뭐야, 벌써 왔어?"
2004702-5 = "선생님, 이쪽.#n잠깐 도와줘."
2004702-8 = "[ns] \"안녕하세—\""
2004702-10 = "[ns1] \"……헉!\"\n[ns2] \"이, 이건……?!\""
2004702-14 = "그렇게 놀랄 일이야?"
2004702-15 = "여름이고. 그렇게 특이한 복장도 아니잖아."
2004702-16 = "[s] \"어째서 수영복 차림으로……?\""
2004702-17 = "……이거. 지금 바람을 넣으려고."
2004702-18 = "보지만 말고 도와줬으면 좋겠는데."
2004702-19 = "[s] \"으음, 부의 부지 내에 풀장을?\""
2004702-20 = "맞아. 훌륭한 피서지?"
2004702-21 = "가깝고, 다른 사람의 시선을 신경 쓰지 않고도 간단하게 물놀이를 즐길 수 있어."
2004702-22 = "음?"
2004702-23 = "……뭔가 이견이 있는 표정이네."
2004702-24 = "좋아. 들어주겠어."
2004702-28 = "자. 선생님의 의견을 들려줘."
2004702-29 = "나름 자신 있게 준비한 건데……."
2004702-30 = "……이상해?"
2004702-31 = "[s3] \"그럴 리가!\"\n[s4] \"수영복, 어울려!\""
2004702-34 = "……수영복?"
2004702-38 = "……!"
2004702-39 = "그런 거 물어보지 않았어! 풀장 이야기야!"
2004702-40 = "[s] \"어울리는데…….\""
2004702-41 = "당연하잖아?#n이미 알고 있는 걸 굳이 물어볼 필요는—"
2004702-45 = "……하고 싶은 말이 있으면 해."
2004702-46 = "아, 참고로."
2004702-47 = "다음 기회는 없으니까."
2004702-48 = "내용, 잘 생각해?"
2004702-49 = "[s5] \"부, 부디 기회를!\"\n[s6] \"솔직한 의견을 말씀드리겠습니다!\""
2004702-53 = "그럼, 본론으로 돌아가서—"
2004702-54 = "여기에 풀장을 설치한다는 계획, 선생님은 어떻게 생각해?"
2004702-55 = "간단하게 피서를 즐기기 좋아 보이지?"
2004702-56 = "……응? 그래서는 사무실에서 에어컨 쐬는 거랑 다를 게 뭐냐고?"
2004702-57 = "……."
2004702-58 = "말은 잘하네.#n뭐, 무슨 이야기를 하고 싶은지는 알겠어."
2004702-59 = "바다나 강, 수영장이라던가……#n막상 가면 즐거울지 몰라도."
2004702-60 = "가는 것까지가 귀찮지 않아?"
2004702-61 = "그게 귀찮아서 간이 풀장을 마련했던 건데."
2004702-62 = "[s] \"야외 활동은 안 좋아했던가?\""
2004702-63 = "딱히. 누구와 가느냐에 따라 달라."
2004702-64 = "당신과 함께라면……뭐, 고민해 볼만할지도."
2004702-65 = "[s] \"오오, 그럼 같이 바다에 가자!\""
2004702-66 = "그 말은…… 둘이서 가자는 거야?"
2004702-67 = "[s] \"그럴 생각이었는데…… 어떠려나?\""
2004702-68 = "……흐음."
2004702-69 = "그럼 일정을 짜야겠네.#n이런 풀장을 준비하고 있을 때가 아니야."
2004702-70 = "그래서, 당신은 스케줄 언제 비어 있어?"
2004702-71 = "응? 처음부터 이렇게 될 걸 노리고 있었냐고?"
2004702-72 = "글쎄? 좋을 대로 생각해."
2004702-73 = "어쨌든, 바다에 가는 건 결정이야.#n철회는 용서 못 하니까."
2004702-74 = "……후훗."
2004702-76 = "(그렇게 어딘가 들떠 보이는 키쿄와 함께 휴가 계획을 세웠다.)"
