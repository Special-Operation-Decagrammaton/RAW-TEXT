[translation]
1014006-1 = "จิ้งจอกผู้ขัดเกลา"
1014006-4 = "กองบัญชาการของกองทหาร FOX"
1014006-5 = "[ns] \"ทุกคนอยู่กันพร้อมหน้ามั้ย?\""
1014006-6 = "เอ๋ คุณครู [USERNAME]?"
1014006-7 = "วันนี้ไม่มีทำปฏิบัติการอะไรนี่นา... มีธุระอะไรที่กองบัญชาการเหรอ?"
1014006-8 = "[ns] \"ครูได้ของขวัญจากเกษตรกรที่เคยไปช่วยมาเมื่อคราวก่อน\""
1014006-9 = ""
1014006-12 = "[ns1] \"มันฝรั่งที่ได้มามันเยอะมากจนกินคนเดียวไม่ไหว...\"\n[ns2] \"ครูเอามันฝรั่งมาแบ่งให้กินน่ะ\""
1014006-15 = "โอ้ ขอบคุณนะ! มันฝรั่งเป็นวัตถุดิบที่ดีเลยละ"
1014006-16 = "จะอบ ต้ม หรือเอาไปทอดกินก็ได้... ไม่ว่าจะทำอะไรก็ใส่มันฝรั่งไปด้วยได้ทุกเมนูเลย"
1014006-17 = "ฉันจะเอาไปทำของอร่อยๆ กินกับสมาชิกในกองนะ"
1014006-18 = "[s] \"ว่าแต่ วันนี้อยู่คนเดียวเหรอ?\""
1014006-19 = "อื้อ คนอื่นออกไปทำธุระส่วนตัวกันหมดน่ะ"
1014006-20 = "มีอะไรจะฝากบอกคนอื่นงั้นเหรอ?"
1014006-21 = "[s3] \"เปล่าหรอก ก็แค่...\"\n[s4] \"พออยู่กับคุรุมิแค่สองคน ก็ประหม่านิดหน่อยนะ\""
1014006-22 = ""
1014006-25 = "พูดอะไรน่าขนลุกแบบนั้นเนี่ย... จู่ๆ ก็เป็นอะไรขึ้นมาน่ะ?"
1014006-26 = "[ns] \"ว่าแต่คุรุมิกำลังทำอะไรอยู่เหรอ?\""
1014006-27 = "หืม? ก็อย่างที่เห็นนั่นแหละ ฉันกำลังซ่อมบำรุงโล่ของตัวเองอยู่"
1014006-28 = "ช่วงนี้ฉันออกปฏิบัติการติดต่อกันหลายครั้ง โล่ก็เลยมีรอยขีดข่วนเยอะ แล้วสีก็ลอกหลายจุดจน#nสะดุดตาเลย..."
1014006-29 = "ฉันเลยว่าจะใช้ยาขัดเงาลบรอยขีดข่วนออกให้หมด แล้วก็ทาสีทับใหม่น่ะ"
1014006-30 = "[s] \"อย่างนี้สินะ ทำงานหนักน่าดูเลย\""
1014006-31 = ""
1014006-34 = "[ns5] \"ว่าแต่ต้องซ่อมบำรุงโล่แบบนี้ทุกครั้งเลยเหรอ?\"\n[ns6] \"โล่แบบนี้น่าจะเป็นรอยขีดข่วนได้ง่ายเลยนะ...\""
1014006-37 = ""
1014006-38 = "อ้อ เข้าใจแล้วละว่าคุณครูจะสื่ออะไร จะบอกว่าไม่จำเป็นต้องทาสีแบบนี้ทุกครั้งใช่มั้ย?"
1014006-39 = "แน่นอนว่าโล่เป็นอุปกรณ์เพื่อใช้ป้องกันกระสุน และหน้าที่ของมันก็คือการถูกขีดข่วนและแตกหัก#nอยู่แล้ว ก็เลยไม่จำเป็นต้องทำให้สะอาดหมดจดอยู่เสมอไป..."
1014006-40 = "แต่ฉันก็ชอบทำความสะอาดโล่ของตัวเองทุกครั้งก่อนออกไปทำปฏิบัติการน่ะ"
1014006-41 = "เวลาออกปฏิบัติการ สิ่งที่ศัตรูจะได้เห็นเป็นอย่างแรกก็คือโล่อันนี้ที่พ็อยนต์แมนถืออยู่ ใช่มั้ยล่ะ?"
1014006-42 = "จะมองว่าโล่อันนี้เป็นหน้าตาของกองทหารก็ได้ ฉันก็เลยอยากให้โล่อยู่ในสภาพที่ดูดี และสะอาดเรียบร้อยที่สุดเมื่อออกปฏิบัติการ"
1014006-43 = "ต่อให้พอเริ่มเปิดฉากยิงกัน เราจะมองไม่เห็นโล่หรือหน้าตาของศัตรูเลยด้วยซ้ำก็เถอะ"
1014006-44 = "สุดท้ายแล้วมันคงเป็นแค่ความพึงพอใจส่วนตัวเท่านั้นแหละมั้ง..."
1014006-45 = "[s7] \"แต่ครูคิดว่านั่นเป็นความตั้งใจที่ดีนะ\"\n[s8] \"ความตั้งใจนี้น่าจะทำให้กองทหาร FOX แข็งแกร่งได้เลยนะ\""
1014006-48 = "ชะ... ใช่มั้ยล่ะ? ฉันคิดอยู่แล้วว่าคุณครูจะเข้าใจ!"
1014006-49 = "ถ้าอยู่ในสภาพที่ตัวเองยังยอมรับไม่ได้ ฉันก็เผชิญหน้ากับอีกฝ่ายอย่างมั่นใจไม่ได้หรอก ต่อให้อีกฝ่ายที่ว่าจะเป็นศัตรูก็เถอะ!"
1014006-50 = "บางครั้งฉันก็ติดสติกเกอร์ที่ชอบลงบนโล่แบบนี้ด้วยนะ"
1014006-51 = "ดูนี่สิ นี่คือสติกเกอร์ที่ฉันได้เป็นของแถมมาจากนิตยสารเมื่อคราวก่อน น่ารักใช่มั้ยล่ะ?"
1014006-52 = "[s] \"โอ้ น่ารักเลยนะ\""
1014006-53 = ""
1014006-56 = "[ns] \"จะว่าไป ครูก็มีสติกเกอร์ที่ได้เป็นของแถมมาเหมือนกัน\""
1014006-57 = "นี่มันสติกเกอร์รูปน้องแมวนี่นา?"
1014006-58 = "น่ารักจัง..."
1014006-59 = "[s] \"ถ้าชอบอันนี้ละก็ งั้นเอาไปติดที่โล่ไว้ด้วย—\""
1014006-60 = "จะเอาสติกเกอร์อันนี้มาติดที่โล่ได้ยังไงล่ะ!"
1014006-61 = "ให้เอาแมวที่น่ารักขนาดนี้ไปรับกระสุนที่หน้าโล่ได้ยังไง คุณครูไม่มีหัวใจเลยเหรอ?"
1014006-62 = "ถ้าติดอะไรแบบนี้ไว้ที่โล่ของเรา คนอื่นต้องคิดว่ากองทหาร FOX เป็นแก๊งป่าเถื่อนที่ไร้หัวใจน่ะสิ!"
1014006-63 = "[s9] \"ขอโทษนะ ครูลืมคิดถึงเรื่องนั้นไปเลย\"\n[s10] \"ถ้างั้นครูขอสติกเกอร์คืน—\""
1014006-66 = ""
1014006-68 = ""
1014006-69 = "ไม่ให้..."
1014006-70 = "คุณครูให้ฉันมาแล้ว ฉันไม่คืนให้หรอก"
1014006-71 = "ถึงจะไม่ได้ติดไว้ที่โล่ ก็ยังมีที่อื่นตั้งเยอะที่ฉันเอาไปติดได้นี่นา ทั้งไดอารี หรือสมุดบันทึกทางทหาร..."
1014006-72 = "[s] \"คุรุมิ หรือว่า...\""
1014006-73 = "ฉะ... ฉันไม่ได้หวงแหนมากขนาดนั้น แค่เพราะมันเป็นของที่คุณครูให้มาหรอกนะ?"
1014006-74 = "ก็แค่... กะ... ก็แมวมันน่ารักนี่นา!"
1014006-75 = "ยะ... อย่าเข้าใจผิดนะ! คุณครูคนบื้อ!"
1014006-77 = "(หลังจากนั้นคุณครูก็สนุกกับการซ่อมบำรุงโล่ของคุรุมิและก็ฟังคำบ่นของคุรุมิไปด้วย)"
