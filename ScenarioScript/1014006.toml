[translation]
1014006-1 = "梳妝打扮的狐狸"
1014006-4 = "FOX小隊HQ"
1014006-5 = "[ns] 「大家都在嗎？」"
1014006-6 = "咦，[USERNAME]老師？"
1014006-7 = "今天應該沒有預定的作戰才對……你來HQ有什麼事嗎？"
1014006-8 = "[ns] 「之前我去幫忙驅除過有害生物的農家送了一些禮物過來。」"
1014006-9 = ""
1014006-12 = "[ns1] 「馬鈴薯多到我一個人吃不完……」\n[ns2] 「想說如果有需要的話就分一些給你們。」"
1014006-15 = "哦哦，謝謝！#n馬鈴薯可以用在各種料理上呢。"
1014006-16 = "烤的、煮的、炸的……不管做什麼料理，馬鈴薯都是不可或缺的。"
1014006-17 = "我會和其他小隊成員一起好好享用的。"
1014006-18 = "[s] 「話說回來，今天只有你一個人嗎？」"
1014006-19 = "嗯，大家都因為私事外出了。"
1014006-20 = "你還有其他事嗎？"
1014006-21 = "[s3] 「那倒不是。」\n[s4] 「只是要和胡桃單獨兩人相處，讓我有點緊張。」"
1014006-22 = ""
1014006-25 = "……你在說什麼噁心的話啊？已經太遲了吧。"
1014006-26 = "[ns] 「話說回來，胡桃從剛才開始就在做什麼？」"
1014006-27 = "嗯？如你所見，我正在保養盾牌。"
1014006-28 = "最近頻繁出勤作戰，盾牌上的刮痕和掉漆的地方明顯變多了……"
1014006-29 = "所以我想用研磨劑去除刮痕，然後再重新上色。"
1014006-30 = "[s] 「原來如此。真是辛苦你了。」"
1014006-31 = ""
1014006-34 = "[ns5] 「話說回來，你每次都像這樣保養盾牌嗎？」\n[ns6] 「以盾牌的特性來說，應該很容易產生刮痕才對……」"
1014006-37 = ""
1014006-38 = "啊啊，我懂你的意思。#n你是想說，沒必要每次都這樣特地上色吧？"
1014006-39 = "盾牌確實是為了抵擋子彈而製造的裝備。#n被刮傷和破壞就是它的特性，所以沒必要總是保養得乾乾淨淨……"
1014006-40 = "不過即便如此，我還是習慣在每次作戰之前像這樣保養盾牌。"
1014006-41 = "畢竟作戰的時候，對手最先看到的通常都是尖兵手持的這面盾牌對吧？"
1014006-42 = "某種意義上，這面盾牌可以說是小隊的第一印象……#n所以我希望總是能以完美的狀態投入作戰。"
1014006-43 = "當然實際進入戰鬥之後，常常會連盾牌和對手的臉都無暇顧及就是了。"
1014006-44 = "……說穿了可能也只是一種自我滿足吧。"
1014006-45 = "[s7] 「不過我覺得這是很棒的態度。」\n[s8] 「正是因為抱持著這樣的態度，FOX小隊才會變得更加強大吧。」"
1014006-48 = "對，對吧？我就知道老師一定會懂的！"
1014006-49 = "在自己無法認同的狀態下，我是沒辦法充滿自信地站到他人面前的。#n就算對方是敵人也一樣！"
1014006-50 = "所以我偶爾也會把喜歡的貼紙貼在盾牌上，像這樣展示出來。"
1014006-51 = "你看，這是之前雜誌附錄送的貼紙。很可愛吧？"
1014006-52 = "[s] 「哦哦，很可愛耶？」"
1014006-53 = ""
1014006-56 = "[ns] 「這麼說來，我之前也有抽獎得到的貼紙。」"
1014006-57 = "這是印有貓咪的貼紙？"
1014006-58 = "好可愛……"
1014006-59 = "[s] 「如果你不介意，把這個也貼到盾牌上──」"
1014006-60 = "我怎麼可能把這個貼在盾牌上啊！"
1014006-61 = "竟然要我把這麼可愛的貓咪貼在子彈傾瀉而下的盾牌前面……#n老師你難道沒有人心嗎！？"
1014006-62 = "要是盾牌上貼著這種東西，大家一定會覺得FOX小隊是個沒血沒淚的惡鬼集團啦！"
1014006-63 = "[s9] 「抱歉，我沒有想那麼多……」\n[s10] 「那貼紙我就──」"
1014006-66 = ""
1014006-68 = ""
1014006-69 = "……不要。"
1014006-70 = "老師已經送給我了，我才不還你。"
1014006-71 = "就算不貼在盾牌上，能貼的地方還多的是。#n像是日記本……軍用手冊之類的……"
1014006-72 = "[s] 「胡桃，難道說……」"
1014006-73 = "我，我才不是因為是老師送的東西才這麼珍惜的哦！？"
1014006-74 = "只是因為……貓，貓咪太可愛了啦！"
1014006-75 = "別，別誤會了！你這個笨蛋！"
1014006-77 = "（之後一邊聽著胡桃的斥責，一邊度過了愉快的時光）"
