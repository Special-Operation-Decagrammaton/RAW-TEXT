[translation]
1014006-1 = "A Decorated Fox"
1014006-4 = "FOX Squad HQ"
1014006-5 = "[ns] \"Is everyone in their seats?\""
1014006-6 = "Wait, [USERNAME] Sensei?"
1014006-7 = "I don't think there were any planned operations today... What are you doing at HQ?"
1014006-8 = "[ns] \"I received a gift from the farm with the seawater issue today.\""
1014006-9 = ""
1014006-12 = "[ns1] \"And it's an overwhelming amount of potatoes...\"\n[ns2] \"I thought I'd share them with you.\""
1014006-15 = "Oh, thanks! There are plenty of uses for potatoes."
1014006-16 = "You can roast them, boil them, fry them... They're extremely versatile."
1014006-17 = "I'll share them with the other squad members."
1014006-18 = "[s] \"Anyway, are you alone today?\""
1014006-19 = "Yeah. Everyone's away on personal business."
1014006-20 = "Did you have some business with them?"
1014006-21 = "[s3] \"No, not them...\"\n[s4] \"I'm a little nervous, being alone with you.\""
1014006-22 = ""
1014006-25 = "Ugh! Don't say gross things, and completely unprompted too!"
1014006-26 = "[ns] \"So what were you up to, Kurumi?\""
1014006-27 = "Huh? As you can see, I've been working on my shield."
1014006-28 = "I've been busy lately, so it's been getting a little beat up."
1014006-29 = "I'll work out the scratches with an abrasive, and then repaint it."
1014006-30 = "[s] \"I see. You're hard at work.\""
1014006-31 = ""
1014006-34 = "[ns5] \"How often do you maintain your shield?\"\n[ns6] \"A shield is bound to get scratched, isn't it?\""
1014006-37 = ""
1014006-38 = "It feels a bit unnecessary, repainting it like this all the time, doesn't it?"
1014006-39 = "Shields were made to block things. It's a given that it's going to get dinged up and scratched."
1014006-40 = "Regardless, I always like to clean my shield before our next mission."
1014006-41 = "It's the first thing an opponent sees during an operation, right?"
1014006-42 = "This shield right here is like the first impression our squad makes, so I want to make sure it's up to standard whenever I deploy to the field."
1014006-43 = "Honestly speaking, this isn't the kind of thing you notice when you're in the thick of battle..."
1014006-44 = "So it's mostly just my own self-indulgence."
1014006-45 = "[s7] \"I still think that's a great mindset.\"\n[s8] \"Things like that are what set the FOX Squad apart.\""
1014006-48 = "R-Right? I knew you'd understand, Sensei!"
1014006-49 = "I need to display my conviction with confidence, or I won't feel confident. Even in front of my enemies!"
1014006-50 = "So sometimes I even put stickers on it, to show off a little."
1014006-51 = "Look. I got this sticker for free from a magazine. Isn't it cute?"
1014006-52 = "[s] \"Oh, it's cute!\""
1014006-53 = ""
1014006-56 = "[ns] \"Come to think of it, I have a sticker I won as a prize, too.\""
1014006-57 = "Aw! It's a little cat sticker."
1014006-58 = "How cute..."
1014006-59 = "[s] \"If you want to, you can put it on your—\""
1014006-60 = "There's no way I could put this on my shield!"
1014006-61 = "You want me to put this adorable little cat on my shield, so it can be barraged by a rainstorm of bullets? Are you actually completely heartless, Sensei?"
1014006-62 = "The only impression the FOX Squad will leave with this sticker on my shield is that we're a bunch of ruthless monsters!"
1014006-63 = "[s9] \"Sorry, I wasn't thinking that far ahead.\"\n[s10] \"Then I'll take the sticker back...\""
1014006-66 = ""
1014006-68 = ""
1014006-69 = "...I refuse."
1014006-70 = "You gave it to me, so I won't give it back."
1014006-71 = "I have plenty of other places to stick it on other than my shield. Like my diary or military notebook..."
1014006-72 = "[s] \"Kurumi. By any chance...\""
1014006-73 = "No! I-I definitely don't want to keep it safe because it's technically a gift from you!"
1014006-74 = "That's not it! Just... Just look at this cat! It's adorable!"
1014006-75 = "Don't let your ego get ahead of you! You big idiot!"
1014006-77 = "I had a fun time hanging out with Kurumi while she continued her shield maintenance, chastising me all the while."
