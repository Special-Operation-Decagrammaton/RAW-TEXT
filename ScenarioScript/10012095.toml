[translation]
10012095-2 = "오늘은 정말 많은 일들이 있었네요~☆"
10012095-3 = "모처럼 1등에 당첨되었다고 좋아했더니, 결국 온종일 엉망진창인 일만 한가득……. 이젠 다 싫어……."
10012095-5 = "응. 세리카. 역시 공짜라고 뭐든 덥석 받으면 안 되는 법이야."
10012095-6 = "그러는 시로코 선배는 가장 먼저 수영복을 준비했으면서?!"
10012095-7 = "그건 그거고 이건 이거."
10012095-9 = "그래도 어떻게든 끝났으니 다행이네~"
10012095-10 = "선생님께서도 바쁘실 때에 일부러 시간을 내주셨는데, 일이 이렇게 되어버려서 죄송해요……."
10012095-11 = "으헤~ 선생도 모처럼 휴양을 보낼 기회라고 제법 기대했는데, 괜히 우리 때문에 엉망이 되어버렸네~"
10012095-12 = "[s] \"아냐, 난 괜찮아.\""
10012095-13 = "네?"
10012095-14 = "[s1] \"다 같이 떠들썩하게 보낼 수 있었으니까.\"\n[s2] \"그리 나쁘지만은 않았어.\""
10012095-17 = "아핫~☆ 선생님께선 늘 그렇게 말씀해주신다니까요~☆"
10012095-18 = "[s] \"모두 어때? 이번 여름, 즐거웠어?\""
10012095-19 = "……뭐, 뭘 부끄럽게 그런 걸 직접 얼굴을 맞대고 물어보는 거야?!"
10012095-20 = "으헤~ 부끄러워하네~ 세리카 쨩~ 귀여워라~ 귀여워라~"
10012095-21 = "으읏! 호, 호시노 선배까지!"
10012095-22 = "……굳이 따지자면 당연히-"
10012095-24 = "네엣~! 즐거웠답니다!"
10012095-25 = "갖은 소동이 있었지만……. 그래도 모처럼 아비도스의 모두와, 그리고 선생님과 함께 보낸 시간, 이었으니까요."
10012095-27 = "응. 세리카는, 어때?"
10012095-29 = "뭐어? 나?! 그, 그야……!"
10012095-30 = "다, 당연히, 즈, 즈, 즐거……."
10012095-31 = "[s] \"응, 그럼 난 슬슬 돌아가 볼께.\""
10012095-32 = "하긴~ 선생은 아직 샬레에도 밀린 일이 잔뜩일 테니까. 슬슬 돌아가 봐야겠지?"
10012095-33 = "아, 마침 날도 저물고 있어서, 얼른 움직이지 않으면 헬기로 모셔다드릴 수 없을 거예요."
10012095-35 = "우리는 이곳의 정리를 위해, 내일까지는 남아있을 예정이니까."
10012095-36 = "저기, 내 대답 아직 안 끝났는데?!"
10012095-37 = "세리카 쨩~ 그 감상의 뒷이야기는, 나중에, 돌아가서 천천히~ 선생님과 다과회를 즐기면서 전해도 된다구요~? 후훗"
10012095-38 = "아냐! 오늘로 끝이야! 내 감상 전달은!"
10012095-39 = "장사 종료니까-!"
10012095-41 = "[ns] \"응, 그럼 먼저 돌아가 볼게.\""
10012095-42 = "그럼! 저도 선생님을 무사히 샬레로 모셔다드리고 올게요!"
10012095-43 = "힘내~ 아야네 쨩~"
10012095-46 = "후후~ 선생님. 짧게나마 저희와 놀았던 요 며칠, 힐링이 되셨을까요?"
10012095-47 = "충분해. 에너지도 풀충전했을 거야."
10012095-48 = "그럼 좋겠네요~"
10012095-49 = "자~ 그럼 우리는 이제 뭐부터 해볼까~ 리조트로 돌아가서 짐부터 싸야 하려나~?"
10012095-50 = "하아. 쉴 만큼 쉬었달지. 고생만 잔뜩 한 느낌이지만. 돌아가서 얼른 알바도 다시 시작해야겠지. 휴가도 며칠 안 남았고……."
10012095-54 = "앗, 리조트 사용권이……."
10012095-55 = "응? 노노미 선배. 이제 그거 필요 없지 않아?"
10012095-56 = "우후훗~ 그래도 기념으로 가져갈까- 해서요."
10012095-57 = "영-차."
10012095-59 = "……어머나?"
10012095-60 = "왜 그래? 노노미 쨩?"
10012095-61 = "아- 그게 말이죠. 여기, 마침 계약서의 맨 끄트머리에……. 이 계약서의 최종 권리자 이름이 적혀 있는데요?"
10012095-62 = "어?! 최종권리자?!"
10012095-63 = "아까, 미처 보지 못하고 놓친 거야?"
10012095-64 = "최종권리자라는 건……… 이번 소동을 일으킨 주범?"
10012095-65 = "<리조트 사냥>이 일어나도록, 허점투성이인 계약서를 여기저기 뿌려댄 장본인이라는 거지?!"
10012095-66 = "대체 누구야?! 그게!"
10012095-67 = "노노미 쨩~ 어디 보자~"
10012095-68 = "네, 여기 있어요. 호시노 선배."
10012095-69 = "흠흠. 로스트 파라다이스~ 리조트 투자 및 운영 총괄……"
10012095-70 = "그 이름이 그러니까"
10012095-73 = "……어라?"
10012095-74 = "아비도스 리조트 복구 대책위원회"
