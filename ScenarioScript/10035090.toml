[translation]
10035090-1 = "제9화;악어, 제압합니다!"
10035090-7 = "우앗!"
10035090-8 = "역시, 겉껍질이 너무 단단합니다!"
10035090-9 = "인마! 너 아까부터 쏘는 총알이 다 빗나가잖아!"
10035090-10 = "제대로 하라고!"
10035090-12 = "어쩔 수 없어. 그건 천재지변 같은 거라고."
10035090-13 = "뭐, 악어 녀석 방어력이 대단한 건 인정하지만 말야."
10035090-14 = "이렇게나 쐈는데도 조금 우그러졌을 뿐, 멀쩡하다니."
10035090-15 = "대체 누가 만든 거야?"
10035090-16 = "게다가 움직임도 빠르고 공격수단도 다양하다."
10035090-17 = "한 가지 다행인 건 파크 이용객 자체보다는 워터슬라이드나 분수대 같은 놀이기구를 파괴하는 데 더 관심이 있어 보인다는 것……."
10035090-18 = "녀석의 행동 알고리즘이 어떻게 되어 있는 건지 모르겠군."
10035090-19 = "애초에 무엇을 노리고 만들어진 것인지도……."
10035090-29 = "메카 악어, 방향을 바꾸었습니다! 공격이 먹힌 걸까요?!"
10035090-30 = "인마! 도망치는 거냐! 돌아와서 맞서 싸워!"
10035090-39 = "[ns1] \"그쪽은……!\"\n[ns2] \"아까 머물렀던 키즈 풀……?\""
10035090-44 = "푸핫! 꽁무니 빼는 꼴 좀 보라지!"
10035090-45 = "네가 있던 곳으로 돌아가라, 괴물아!"
10035090-50 = "안 돼, 그쪽으로 가면……!"
10035090-54 = "꺄아아악!"
10035090-55 = "[ns] \"어린아이가……!\""
10035090-60 = "칫!"
10035090-70 = "칸나 국장님?!"
10035090-72 = "국장!"
10035090-73 = "미친개?!"
10035090-74 = "[s] \"칸나!\""
10035090-83 = "아, 아이를 구했어!"
10035090-84 = "한 번은 피했지만……! 위험합니다!"
10035090-85 = "악어의 진행 방향에 있잖아! 저러다 큰일난다구!"
10035090-91 = "……."
10035090-92 = "물러나."
10035090-101 = "[ns3] \"어, 어라?!\"\n[ns4] \"악어가……멈췄어?!\""
10035090-104 = "뭐, 뭐야……"
10035090-105 = "메카 악어, 침묵…… 아니, 어째서 멈춘 거죠?!"
10035090-107 = "지금 그런 거 따질 때야!"
10035090-108 = "다시 움직이기 전에 수류탄이라도 던져!"
10035090-110 = "악어 자식, 너 때문에 우리가 오해를 받았잖냐!"
10035090-111 = "이 빚은 목숨으로 갚아랏!"
