[translation]
2006002-1 = "พักผ่อนกับอิบูกิ!"
2006002-2 = "ใต้ร่มชายหาดบนหาดทราย"
2006002-5 = "(ตอนที่นัดกับอิบูกิว่าจะไปพักร้อนด้วยกัน ทุกอย่างก็ดีอยู่หรอก...)"
2006002-6 = "(แต่ระหว่างนั้นคุณครูก็ฝืนทำงานให้ตารางลงตัว พอมาถึงชายหาดก็หมดแรงแล้ว...)"
2006002-7 = ""
2006002-9 = ""
2006002-10 = "ฮ้าาาว..."
2006002-11 = "ง่วงจังเลยยย..."
2006002-12 = "(ไม่รู้ว่าเป็นเพราะคุณครูหรือเปล่า อิบูกิก็ดูเหนื่อยมากเหมือนกัน)"
2006002-13 = "คุณณณ ครู... อิบูกิ... ไม่มีแรงเลย..."
2006002-14 = "[s] \"ครูก็เหมือนกัน...\""
2006002-15 = "แหะๆ... เหมือนอิบูกิเลย..."
2006002-16 = "สัญญาไว้ว่าจะเล่นกับคุณครู"
2006002-17 = "แล้ว... แท้ๆ..."
2006002-18 = "zzz..."
2006002-20 = "คร่อกกก..."
2006002-21 = "[s] \"อื้อ ถ้าเหนื่อยก็ต้องนอนพักก่อนแบบนี้ละ...\""
2006002-22 = "(หลังจากดูจนแน่ใจว่าอิบูกิหลับแล้ว...)"
2006002-23 = "[ns] \"เราก็งีบสักหน่อยดีมั้ยนะ...\""
2006002-24 = "(แล้วคุณครูก็หลับไปข้างๆ อิบูกิ)"
2006002-25 = "(แต่ว่า...)"
2006002-26 = ""
2006002-29 = "[ns] \"ทำไมร้อนขนาดนี้ล่ะ?\""
2006002-32 = "(ดวงอาทิตย์เคลื่อนไปแล้ว แดดจึงส่องเข้ามาแผดเผาใต้ร่มชายหาดแทน)"
2006002-33 = "[ns] \"ต้องไม่ให้อิบูกิร้อน...\""
2006002-34 = "(คุณครูย้ายร่มชายหาดให้เงาขยับไปบังแดด)"
2006002-35 = "[ns1] \"เท่านี้ก็น่าจะได้แล้วนะ\"\n[ns2] \"ถ้างั้น นอนต่ออีกนิด...\""
2006002-39 = "(ผ่านไปอีกสักพัก...)"
2006002-41 = "[ns] \"อ๊ะ ร้อน...\""
2006002-43 = "(คุณครูย้ายร่มชายหาดอีกครั้ง แล้วกลับไปนอนต่อ)"
2006002-44 = ""
2006002-48 = "(แล้วก็ผ่านไปอีกพักหนึ่ง...)"
2006002-49 = ""
2006002-52 = "[ns] \"หืม? อิบูกิโทรมา...?\""
2006002-55 = "(เมื่อเห็นโทรศัพท์ คุณครูถึงได้รู้ว่าอิบูกิที่อยู่ข้างๆ หายไปตั้งแต่เมื่อไรก็ไม่รู้)"
2006002-56 = "(มองหาแถวนั้นก็ไม่เจอ)"
2006002-57 = ""
2006002-60 = "[ns] \"อิบูกิ...?\""
2006002-62 = "(คุณครูรับโทรศัพท์อย่างใจเย็น ทั้งที่ในใจเป็นห่วง)"
2006002-63 = ""
2006002-65 = ""
2006002-66 = "คุณครู คุณครู!"
2006002-67 = "[s] \"โล่งอกไปที...! อยู่ที่ไหนเหรอ?\""
2006002-68 = "อิบูกิน่ะ เจอที่ที่สุดยอดมากๆ เลย!"
2006002-69 = "หันหน้าเข้าทะเล แล้วเดินมาทางขวาเรื่อยๆ~ ก็ถึงแล้ว!"
2006002-70 = "รีบมานะ คุณครู! อิบูกิคิดถึง!"
2006002-71 = ""
2006002-73 = ""
2006002-74 = "[ns] \"ไปดูก่อนแล้วกัน...\""
2006002-76 = "(คุณครูโล่งอกที่ไม่มีอะไรเกิดขึ้น จึงเดินไปหาอิบูกิ)"
2006002-83 = "[ns] \"น่าจะอยู่แถวนี้นะ...\""
2006002-84 = "คุณครู!"
2006002-85 = "(จู่ๆ ก็ได้ยินเสียงอิบูกิดังมาจากข้างบน)"
2006002-86 = "[ns] เงยหน้ามองขึ้นไป"
2006002-89 = "― [log=이부키 수영복]คุณครู! ทางนี้! [/log][wa:1250] "
2006002-90 = "― [log=이부키 수영복]ป่านี้เย็นมากๆ เลย~![/log][wa:3710] "
2006002-93 = "― [log=이부키 수영복]ต่อให้แดดส่องแรงแค่ไหน...[/log][wa:390] "
2006002-94 = "― [log=이부키 수영복]แต่ถ้าเป็นที่นี่ละก็... ดูสิ พวกต้นไม้ช่วยบังให้หมดเลย~![/log][wa:3850] "
2006002-97 = "― [log=이부키 수영복]เพราะงั้น! เมื่ออยู่ที่นี่...[/log][wa:630] "
2006002-98 = "― [log=이부키 수영복]ก็ไม่ต้องย้ายร่มชายหาดแล้วก็ได้ คุณครู![/log][wa:3930] "
2006002-101 = "[ns] \"เห็นด้วยเหรอ...?\""
2006002-103 = "― [log=이부키 수영복]...อืม... จริงๆ แล้วอิบูกิเห็นหมดเลย[/log][wa:5040] "
2006002-104 = "― [log=이부키 수영복]ตอนที่คุณครูออกแรงฮึบๆ แล้วย้ายร่มชายหาดน่ะ...[/log][wa:3730] "
2006002-107 = "― [log=이부키 수영복]แต่ที่นี่ไม่ต้องทำแบบนั้นแล้ว![/log][wa:810] "
2006002-108 = "― [log=이부키 수영복]แค่พักผ่อนกับอิบูกิให้เต็มที่ก็พอ![/log][wa:4230] "
2006002-110 = ""
2006002-111 = "หืม? ถามว่าทำไมถึงขึ้นมาอยู่บนต้นไม้เหรอ?"
2006002-112 = "ก็ถ้าอยู่ที่สูงๆ จะได้เห็นคุณครูเดินมาเร็วกว่าไง!"
2006002-113 = "แต่ว่านะ คุณครู"
2006002-114 = "คือ..."
2006002-115 = "จากตรงนี้... อิบูกิจะลงไปยังไงเหรอ?"
2006002-116 = "[s] \"เอ้า จับตรงนี้นะ\""
2006002-118 = "(คุณครูอุ้มอิบูกิลงมาจากต้นไม้ แล้วพักผ่อนใต้ร่มเงากันต่อ)"
2006002-119 = "(ผ่านไปสักพักก็ต้องย้ายที่ เพราะผู้ดูแลบอกว่าถ้าอยู่ใต้ต้นมะพร้าว อาจโดนลูกมะพร้าวหล่นใส่ได้...)"
2006002-120 = "(แต่นี่ก็เป็นช่วงเวลาที่สบายใจที่สุดในฤดูร้อนปีนี้เลย...)"
