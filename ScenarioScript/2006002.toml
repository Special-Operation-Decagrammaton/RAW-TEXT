[translation]
2006002-1 = "Relaxing with Ibuki!"
2006002-2 = "Under the Beach Parasol"
2006002-5 = "Promising to take Ibuki on a summer vacation was a lovely idea..."
2006002-6 = "...But I'd been pushing myself too hard. I was determined to keep my schedule even though I was exhausted by the time I made it to the beach."
2006002-7 = ""
2006002-9 = ""
2006002-10 = "*yawn*..."
2006002-11 = "Ibuki is sleepy..."
2006002-12 = "Perhaps she was influenced by me, but Ibuki also seemed tired."
2006002-13 = "Sensei... Ibuki...is tired..."
2006002-14 = "[s] \"Sensei is too...\""
2006002-15 = "Heehee... Same as Ibuki..."
2006002-16 = "Ibuki promised to play with..."
2006002-17 = "Sen...sei..."
2006002-18 = "Zzz..."
2006002-20 = "Zzz..."
2006002-21 = "[s] \"Yeah, maybe it's best to take a nap...\""
2006002-22 = "I made sure Ibuki was fast asleep."
2006002-23 = "[ns] \"...Maybe I'll rest too.\""
2006002-24 = "So, I fell asleep next to Ibuki."
2006002-25 = "However..."
2006002-26 = ""
2006002-29 = "[ns] \"...Why's it so hot?\""
2006002-32 = "The sun had moved, so scorching sunlight was peeking past the parasol."
2006002-33 = "[ns] \"Let's make sure Ibuki stays cool...\""
2006002-34 = "I moved the parasol and adjusted the shade's angle."
2006002-35 = "[ns1] \"There we go.\"\n[ns2] \"Now, back to sleep...\""
2006002-39 = "But, soon after..."
2006002-41 = "[ns] \"...Ow, hot.\""
2006002-43 = "I adjusted the parasol and went back to sleep."
2006002-44 = ""
2006002-48 = "Then, soon after..."
2006002-49 = ""
2006002-52 = "[ns] \"Hm? Ibuki's calling me?\""
2006002-55 = "I looked around and saw that she was no longer nearby."
2006002-56 = "In fact, I couldn't find Ibuki anywhere."
2006002-57 = ""
2006002-60 = "[ns] \"Ibuki...?\""
2006002-62 = "Worried, I quickly answered my phone."
2006002-63 = ""
2006002-65 = ""
2006002-66 = "Sensei! Sensei!"
2006002-67 = "[s] \"My goodness...! Where are you?\" "
2006002-68 = "Ibuki found a really cool place!"
2006002-69 = "Face the sea, take a right, and keep walking!"
2006002-70 = "Hurry, Sensei! Ibuki wants to see you!"
2006002-71 = ""
2006002-73 = ""
2006002-74 = "[ns] \"...Better get moving.\""
2006002-76 = "With a sigh of relief, I headed to where Ibuki instructed."
2006002-83 = "[ns] \"It should be right around here...\""
2006002-84 = "Sensei!"
2006002-85 = "Suddenly, Ibuki called out from above."
2006002-86 = "[ns] Look up."
2006002-89 = "― [log=이부키 수영복]Sensei! Over here! [/log][wa:1130] "
2006002-90 = "― [log=이부키 수영복]This forest feels soooo cool![/log][wa:3350] "
2006002-93 = "― [log=이부키 수영복]No matter how bright the sun is...[/log][wa:30] "
2006002-94 = "― [log=이부키 수영복]Look... The trees cover everything![/log][wa:4690] "
2006002-97 = "― [log=이부키 수영복]So! At this place...[/log][wa:990] "
2006002-98 = "― [log=이부키 수영복]You don't have to move the parasol, Sensei![/log][wa:3770] "
2006002-101 = "[ns] \"...You knew I was doing that?\" "
2006002-103 = "― [log=이부키 수영복]...Yes. You know, Ibuki saw it all.[/log][wa:5080] "
2006002-104 = "― [log=이부키 수영복]Sensei was going heave-ho and moving the parasol...[/log][wa:3530] "
2006002-107 = "― [log=이부키 수영복]But you don't have to do that here![/log][wa:610] "
2006002-108 = "― [log=이부키 수영복]All you need to do is take a nice break with Ibuki![/log][wa:3550] "
2006002-110 = ""
2006002-111 = "Hm? Why did Ibuki climb the tree?"
2006002-112 = "Because being up high means Ibuki can spot Sensei coming sooner!"
2006002-113 = "By the way, Sensei."
2006002-114 = "Um..."
2006002-115 = "How...can Ibuki get down?"
2006002-116 = "[s] \"Here, hold on to me.\""
2006002-118 = "I helped Ibuki down the tree and we once more relaxed in the shade."
2006002-119 = "We ended up moving after the park ranger warned us of the danger of falling coconuts."
2006002-120 = "Nevertheless, it was the most relaxing time I had this summer."
