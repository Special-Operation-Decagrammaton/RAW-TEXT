[translation]
2006002-1 = "和伊吹一起休息！"
2006002-2 = "沙灘遮陽傘下"
2006002-5 = "（雖然和伊吹約好一起過暑假……）"
2006002-6 = "（……但為了配合行程太過勉強，抵達海邊時已經筋疲力盡了）"
2006002-7 = ""
2006002-9 = ""
2006002-10 = "呼啊啊啊……"
2006002-11 = "好睏～……"
2006002-12 = "（大概是被我影響了，伊吹看起來也非常疲倦）"
2006002-13 = "老師……伊吹沒力氣了……"
2006002-14 = "[s] 「老師也是……」"
2006002-15 = "耶嘿嘿……跟伊吹一樣耶……"
2006002-16 = "明明跟老師約好要一起玩的……"
2006002-17 = "約好……了……"
2006002-18 = "zzz……"
2006002-20 = "呼咻……"
2006002-21 = "[s] 「對啊，這種時候還是先睡一覺吧……」"
2006002-22 = "（確認伊吹睡著之後……）"
2006002-23 = "[ns] 「……我也閉眼休息一下吧。」"
2006002-24 = "（就這樣在伊吹旁邊睡著了）"
2006002-25 = "（然而……）"
2006002-26 = ""
2006002-29 = "[ns] 「……怎麼這麼熱？」"
2006002-32 = "（由於太陽移動了位置，熾熱的陽光照進了遮陽傘下）"
2006002-33 = "[ns] 「不能讓伊吹被太陽曬到……」"
2006002-34 = "（轉動遮陽傘，調整好陰影的位置後）"
2006002-35 = "[ns1] 「這樣應該就沒問題了。」\n[ns2] 「再稍微睡一下吧……」"
2006002-39 = "（又過了一陣子……）"
2006002-41 = "[ns] 「……啊，好燙。」"
2006002-43 = "（再次調整遮陽傘的位置後，又睡著了）"
2006002-44 = ""
2006002-48 = "（然後又過了一陣子……）"
2006002-49 = ""
2006002-52 = "[ns] 「嗯？伊吹打來的電話……？」"
2006002-55 = "（這才發現原本在旁邊的伊吹，不知道什麼時候不見了）"
2006002-56 = "（環顧附近也都沒看到他）"
2006002-57 = ""
2006002-60 = "[ns] 「伊吹……？」"
2006002-62 = "（雖然擔心，還是冷靜地接起了電話）"
2006002-63 = ""
2006002-65 = ""
2006002-66 = "老師老師！"
2006002-67 = "[s] 「太好了……！你在哪裡？」"
2006002-68 = "跟你說哦，伊吹找到了一個超棒的地方！"
2006002-69 = "面向大海往右邊一～直走過來就到了！"
2006002-70 = "快點來吧，老師！伊吹想你了！"
2006002-71 = ""
2006002-73 = ""
2006002-74 = "[ns] 「……先過去看看吧。」"
2006002-76 = "（確認伊吹沒事後鬆了一口氣，接著朝伊吹所在的方向走去）"
2006002-83 = "[ns] 「應該是這附近……」"
2006002-84 = "老師！"
2006002-85 = "（突然從頭上傳來了伊吹的聲音）"
2006002-86 = "[ns] 抬頭往上看"
2006002-89 = "― [log=이부키 수영복]老師！這邊這邊～！[/log][wa:1530] "
2006002-90 = "― [log=이부키 수영복]這裡，超～涼快的！[/log][wa:4150] "
2006002-93 = "― [log=이부키 수영복]不管太陽公公曬得再怎麼兇……[/log][wa:830] "
2006002-94 = "― [log=이부키 수영복]只要在這裡……你看，一點都不熱唷～！[/log][wa:5370] "
2006002-97 = "― [log=이부키 수영복]所以呢！在這裡的話──[/log][wa:1350] "
2006002-98 = "― [log=이부키 수영복]就不用再搬陽傘了哦，老師。[/log][wa:4970] "
2006002-101 = "[ns] 「……你看到了？」"
2006002-103 = "― [log=이부키 수영복]……嗯，其實呢，伊吹都看到了。[/log][wa:5880] "
2006002-104 = "― [log=이부키 수영복]老師嘿咻嘿咻地，搬著陽傘……[/log][wa:5010] "
2006002-107 = "― [log=이부키 수영복]不過在這裡就沒問題了！[/log][wa:1570] "
2006002-108 = "― [log=이부키 수영복]和伊吹一起，好好休息吧！[/log][wa:5110] "
2006002-110 = ""
2006002-111 = "嗯？你問伊吹為什麼要爬到樹上？"
2006002-112 = "因為待在高的地方，才能更快看到老師過來嘛！"
2006002-113 = "那個，老師。"
2006002-114 = "就是……"
2006002-115 = "這裡……要怎麼下去？"
2006002-116 = "[s] 「來，抓住這裡。」"
2006002-118 = "（抱著伊吹從樹上下來後，在樹蔭下繼續休息）"
2006002-119 = "（不久後，管理員說待在椰子樹下可能會被掉落的椰子砸到，因此換了位置……）"
2006002-120 = "（……不過這仍是今年入夏以來最放鬆的一段時光）"
