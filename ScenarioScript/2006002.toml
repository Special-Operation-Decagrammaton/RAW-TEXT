[translation]
2006002-1 = "이부키와 함께 휴식을!"
2006002-2 = "모래사장 파라솔 아래"
2006002-5 = "(이부키와 여름휴가 약속을 한 것까지는 좋았는데…….)"
2006002-6 = "(……일정을 맞추려고 무리한 탓에, 해변에 도착했을 때는 이미 녹초 상태였다.)"
2006002-10 = "흐아아암……."
2006002-11 = "졸려어어어……."
2006002-12 = "(내 영향을 받았는지, 이부키도 대단히 피곤해 보인다.)"
2006002-13 = "선생니이임…… 이부키…… 몸에 힘이 없어……."
2006002-14 = "[s] \"선생님도 그래…….\""
2006002-15 = "헤헤…… 이부키랑 똑같네……."
2006002-16 = "선생님이랑 같이 놀기로 약속했는데"
2006002-17 = "했는……데……."
2006002-18 = "zzz……."
2006002-20 = "피휴우우……."
2006002-21 = "[s] \"그래, 이럴 때는 일단 잠부터 자야지…….\""
2006002-22 = "(이부키가 잠든 것을 확인한 뒤…….)"
2006002-23 = "[ns] \"……나도 눈 좀 붙일까.\""
2006002-24 = "(그렇게 이부키 옆에서 잠에 들었다.)"
2006002-25 = "(그런데…….)"
2006002-29 = "[ns] \"……왜 이렇게 뜨겁지?\""
2006002-32 = "(해의 위치가 바뀌어서, 따가운 햇빛이 파라솔 안으로 들이치고 있었다.)"
2006002-33 = "[ns] \"이부키가 뜨겁지 않게…….\""
2006002-34 = "(파라솔의 방향을 바꾸어 그늘의 위치를 조정한 뒤.)"
2006002-35 = "[ns1] \"이 정도면 괜찮겠지.\"\n[ns2] \"그러면 다시 조금만…….\""
2006002-39 = "(다시 얼마 뒤…….)"
2006002-41 = "[ns] \"……앗 뜨거워.\""
2006002-43 = "(파라솔 위치를 또다시 조정한 뒤, 다시 잠에 들었다.)"
2006002-48 = "(그리고 또 얼마 뒤…….)"
2006002-52 = "[ns] \"응? 이부키의 전화……?'"
2006002-55 = "(그러고 보니 옆에 있던 이부키가 어느새 사라져 있었다.)"
2006002-56 = "(근처 어디에서도 보이지 않았고.)"
2006002-60 = "[ns] \"이부키……?\""
2006002-62 = "(걱정하는 마음으로 차분히 전화를 받았다.)"
2006002-66 = "선생님 선생님!"
2006002-67 = "[s] \"다행이다……! 어디 있어?\""
2006002-68 = "이부키가 있지, 엄청 멋진 곳을 찾아냈어!"
2006002-69 = "바다를 보고 오른쪽으로 쭉~ 올라오면 돼!"
2006002-70 = "빨리 와, 선생님! 보고 싶어!"
2006002-74 = "[ns] \"……일단 가볼까.\""
2006002-76 = "(아무 일도 일어나지 않은 것에 안심하며, 이부키가 있는 쪽으로 향했다.)"
2006002-83 = "[ns] \"여기쯤일 것 같은데…….\""
2006002-84 = "선생님!"
2006002-85 = "(갑자기 머리 위에서 이부키의 목소리가 들려왔다.)"
2006002-86 = "[ns] 머리를 들어 위를 본다."
2006002-89 = "[wa:500]― [log=이부키 수영복]선생님! [wa:870]이쪽이야![wa:80] [/log]"
2006002-90 = "[wa:2860]― [log=이부키 수영복]이 숲, [wa:480]엄~[wa:610]청 시원해! [/log]"
2006002-93 = "[wa:670]― [log=이부키 수영복]아무리 해님이 쨍쨍 내리쬐어도……[/log]"
2006002-94 = "[wa:3180]― [log=이부키 수영복]여기라면…… [wa:1040] 봐봐, [wa:830]나무들이 전부 가려줘서~![/log]"
2006002-97 = "[wa:500]― [log=이부키 수영복]그러니까![wa:770] 여기서는…….[/log]"
2006002-98 = "[wa:1880]― [log=이부키 수영복]이제 [wa:630]파라솔 안 옮겨도 괜찮아, [wa:2100]선생님![/log]"
2006002-101 = "[ns] \"……봤어?\""
2006002-103 = "[wa:2000]― [log=이부키 수영복]……[wa:1010]응, [wa:1090]사실은 있지. [wa:750]이부키, [wa:670]전부 봤어.[/log]"
2006002-104 = "[wa:2150]― [log=이부키 수영복]선생님이 영차[wa:1490]영차 하고, [wa:890]파라솔 옮기는 거…….[/log]"
2006002-107 = "[wa:670]― [log=이부키 수영복]하지만 [wa:700]여기선 안 그래도 돼![/log]"
2006002-108 = "[wa:2910]― [log=이부키 수영복]그냥 이부키랑 [wa:1330]푹! [wa:390]쉬기만 하면 되는 거야![/log]"
2006002-111 = "응? 그런데 나무에는 왜 올라가 있었냐고?"
2006002-112 = "그야 높은 곳에 있어야 선생님이 오는 걸 더 빨리 볼 수 있으니까!"
2006002-113 = "그런데 선생님."
2006002-114 = "그……."
2006002-115 = "여기…… 어떻게 내려가?"
2006002-116 = "[s] \"자, 여기 잡아.\""
2006002-118 = "(이부키를 들고 나무 아래로 내려온 뒤, 그늘에서 다시 휴식을 취했다.)"
2006002-119 = "(얼마 뒤, 야자수 아래에 있으면 떨어지는 코코넛에 맞을 수도 있다는 관리인의 말에 자리를 옮기긴 했지만…….)"
2006002-120 = "(……이번 여름에 들어 가장 마음 편한 시간이었다.)"
