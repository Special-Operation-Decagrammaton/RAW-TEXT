[translation]
10056110-1 = "에필로그;따개비, 그리고 더 많은 따개비"
10056110-2 = "오디세이아 정박지"
10056110-3 = "(블루홀에 다녀온 지 약 일주일 즈음 지난 뒤의 어느 날.)"
10056110-10 = "으으…… 냄새……"
10056110-11 = "두번씩이나 이 거지 같은 작업에 투입되다니~"
10056110-12 = "비린내~"
10056110-17 = "미, 미안. 또 따개비 청소를 부탁하게 되어서……"
10056110-18 = "뭐, 어쩔 수 없지."
10056110-19 = "이런 선저 청소 이외에는 다이빙부가 당장 할 수 있는 작업도 많지 않으니까."
10056110-20 = "……네."
10056110-21 = "게다가 다이빙부가 진 부채를 일부 탕감해 주는 데 비하면, 그리 어려운 업무도 아니라고 생각하는데요."
10056110-28 = "아, 아미 부장님……!"
10056110-29 = "게, 게으름 부리고 있었던 건 아니었고요……!"
10056110-30 = "다이빙을 마친 뒤에는 체내 잔류 질소를 제거하기 위해 충분히 휴식을 취해야—"
10056110-31 = "여러분을 감시하러 온 것이 아니니 걱정 마시길."
10056110-32 = "저는 그저……"
10056110-33 = "아일랜드를 대표해서 감사의 인사를 전하러 왔습니다."
10056110-34 = "……감사요?"
10056110-35 = "네."
10056110-36 = "지난 사건 때, 조수의 교룡으로부터 선생님을 보호하고 그들을 격퇴하는 데 다이빙부가 크게 일조하였다지요."
10056110-37 = "샬레의 선생님은 저희 오디세이아에서 모시고 있는 VIP."
10056110-38 = "선생님의 신변에 무슨 일이라도 생겼더라면 아일랜드는 물론이고, 오디세이아 학원 전체가 큰 불명예를 안았을지도 모릅니다."
10056110-39 = "아일랜드를 대표해서, 학원을 대표해서 감사의 인사를 드립니다."
10056110-40 = "아, 아뇨…… 감사를 표하실 필요는……"
10056110-41 = "사실 저희가 몰래 배를 출항시키지 않았더라면, 애초에 선생님께서 그곳에 함께 가실 일도 없었을 테고……"
10056110-42 = "어떤 의미에서는 자업자득이라고 해야 할까……"
10056110-43 = "그건 그렇지만요."
10056110-44 = "……윽."
10056110-45 = "사실 그보다 더 감사를 표하고 싶은 부분은 따로 있습니다."
10056110-46 = "조수의 교룡— 아니, 그 바보 교주의 코를 납작하게 만들었다면서요?"
10056110-47 = "사실 아일랜드의 입장에서는 당시 그녀가 체포되었을 때, 교정국에 신병을 인도하는 것이 최선이었습니다만……"
10056110-48 = "개인적으로는 크게 골탕을 먹여주고 싶었거든요."
10056110-49 = "다이빙부의 부장에게는 큰 빚을 졌네요."
10056110-50 = "가, 감사합니다……"
10056110-51 = "호, 혹시 그럼 괜찮으시다면…… 기타 장비 구매에 쓰인 빚도 탕감해 주시면……"
10056110-52 = "좀 더 이성적인 계산을 원하신다면 얼마든지."
10056110-53 = "아, 아닙니다!"
10056110-57 = "그리고…… 전에 말했던 판자의 비유는 제가 잘못 생각했던 것 같네요."
10056110-58 = "가끔은 제 자리를 떠나 표류하던 판자 한 장이 표류자의 목숨을 구하는 것을 보면."
10056110-59 = "물론 그렇다고 해서 앞으로도 예외를 인정할 생각은 없지만요."
10056110-60 = "다, 당연하죠! 오, 오디세이아의 규칙을 어길 생각은 없습니다."
10056110-61 = "최, 최선을 다하겠습니다!"
10056110-66 = "부장은 왜 저렇게 보는 사람이 민망할 정도로 굽신거리는 거야?"
10056110-67 = "원래부터 권력에 약한 사람이라…… 다들 이해해."
10056110-68 = "물개야, 물개."
10056110-69 = "그나저나 이번 사건의 보고서를 읽다가 알게 되었는데……"
10056110-70 = "교룡의 선단을 폭파하는 데 쓴 흡착 기뢰는 어디서 난건가요?"
10056110-71 = "다이빙 장비 구매 내역서에 이런 전문 장비는 포함되어 있지 않았던 것 같은데."
10056110-72 = "아, 그게 그러니까……"
10056110-73 = "노, 노획! 노획했습니다! 해적 선단의 창고에서요."
10056110-74 = "흐음……"
10056110-79 = "[ns1] \"안녕, 다들!\"\n[ns2] \"뭐하고 있었어?\""
10056110-82 = "어서오십시오, 선생님."
10056110-83 = "저는 마침 다이빙부에 전달 사항이 있어서."
10056110-84 = "[s3] \"요 앞의 <아쿠아 씰>에서 아이스크림을 사왔는데……\"\n[s4] \"아미도 하나 먹고 갈래?\""
10056110-87 = "아뇨. 저는 아일랜드에 남은 서류가 많아서."
10056110-88 = "먼저, 실례하겠습니다."
10056110-92 = "[ns] \"……아미 쨩은 꽤 딱딱하네.\""
10056110-93 = "하, 하하…… 일이 많으니 어쩔 수 없을 거예요……"
10056110-94 = "[s5] \"그나저나 다들 휴식 중이었어?\"\n[s6] \"마침 잘 됐네. 쉬면서 아이스크림이라도 먹자.\""
10056110-97 = "네? 이, 이렇게 챙겨 주실 필요는……"
10056110-101 = "……선생님. 혹시 저희를 챙겨 주시는 데 특별한 이유라도 있으신가요?"
10056110-102 = "저희는 선생님께 아무것도 해드리지 못했는데……"
10056110-103 = "[s] \"특별한 이유가 필요해?\""
10056110-104 = "……네?"
10056110-105 = "[s7] \"나는 다이빙부의 스폰서잖아.\"\n[s8] \"스폰서가 아낌없는 지원을 하는 건 당연하지!\""
10056110-112 = "그렇다면…… 어쩔 수 없네요."
10056110-120 = "뭐야, 선생님. 또 아이스크림 사온 거야?"
10056110-121 = "사유리는 정어리 맛이 좋아~"
10056110-122 = "나는 바닐라 맛으로."
10056110-126 = "아, 나도……"
10056110-132 = "그럼…… 잘 먹겠습니다!"
10056110-133 = "DIVE into OCEAN!"
