[translation]
1006106-1 = "의외의 취미"
1006106-2 = "(사쿠라코와의 상담을 위해, 사쿠라코가 사용하는 성당의 집무실로 향했다.)"
1006106-6 = "오셨군요, 선생님."
1006106-12 = "개인적인 일인데도, 먼 길 와 주셔서 감사합니다."
1006106-13 = "본래라면 응당 제가 선생님을 찾아뵈었어야 할 일이지만, 지금 그럴 수 없는 일이 좀……."
1006106-14 = "[s1] \"알고 있어, 업무 때문이잖아?\"\n[s2] \"걱정하지 마. 누구보다 이해하고 있으니까.\""
1006106-17 = "아. 네, 감사합니다. 선생님."
1006106-21 = "그럼 선생님의 시간을 낭비하지 않기 위해, 거두절미하고 바로 이야기 드릴까 합니다."
1006106-22 = "이건 그러니까 '취미'라는 것에 관련되는 이야기입니다."
1006106-23 = "[s] \"취미?\""
1006106-24 = "네. 얼마 전에, 그런 질문을 받았었거든요."
1006106-25 = "취미생활을 할 시간이 줄어들어 힘들다던, 어떤 자매님의 이야기를 들어주던 도중……."
1006106-26 = "자매님께서 문득 저에게, \"사쿠라코님의 취미는 무엇인가요?\"라고 여쭈셨었습니다."
1006106-27 = "그리고 저는, 대답을 하지 못했습니다."
1006106-28 = "그럴 수밖에 없었습니다. 실제로, 취미라고 생각할 만한 게 딱히 없었으니까요."
1006106-29 = "취미라고 할 만한 것이 무엇인지도 잘 모릅니다."
1006106-30 = "물론 다른 분들이 모두 취미를 가지고 있다고 해서, 제가 꼭 취미를 가져야 한다고 생각하지는 않습니다만."
1006106-31 = "그치만……."
1006106-32 = "[s3] \"다른 사람을 이해해 주기 위해서라도.\"\n[s4] \"그 감정에 대해서 알고 싶은 거구나.\""
1006106-35 = "맞습니다. 말씀드리고 나니, 딱히 저에 대한 이야기만은 아닐 지도 모르겠군요."
1006106-36 = "저의 하루 일과는 늘 동일하게 정해져 있고, 크게 남는 시간이 없습니다."
1006106-37 = "설령 남는 시간이 생긴다 해도, 성당의 행사나 자매님들의 일정을 재점검합니다."
1006106-38 = "그것들을 딱히 시간에 쫓기면서 하는 일도 아니고, 괴롭거나 부담스럽다고 느끼지도 않습니다."
1006106-39 = "……선생님."
1006106-45 = "남는 시간이란 뭘까요. 취미란 무엇일까요?"
1006106-46 = "선생님께서는 저보다 바쁜 일정을 소화하고 계시면서도, 때때로 취미에 열중하신다는 이야기를 들은 적이 있습니다."
1006106-47 = "그렇기에 알고 싶었습니다. 취미를 어떻게 만드시는 건지, 어째서 그것을 구하시는 것인지……."
1006106-48 = "……네?"
1006106-49 = "굳이 목적이나 의미를 담은 행동이 아니라 습관……이라고요? 취미가?"
1006106-53 = "그렇군요. 과연. 일리가 있는 말씀입니다."
1006106-54 = "저는 쭉 취미가 자신의 회복이나 추가적인 자아 확보를 위해 하는 의식적인 행동일 거라 생각했는데."
1006106-55 = "생각보다 훨씬 무의식적인 것이었군요. 그런 거라면 대충 알 것도 같습니다."
1006106-56 = "그렇다면 제 취미라는 것도, 어쩌면……."
1006106-57 = "[s] \"최근 시간 날 때 했던 것들을 떠올려 봐.\""
1006106-61 = "[ns5] \"무의식적으로 했던 습관들을 떠올려 봐.\"\n[ns6] \"큰 목적이나 의미 없이 그냥 했던 걸 떠올려 봐.\""
1006106-66 = "과연. 그렇군요."
1006106-67 = "무의식적으로 했던 일들……. 최근 들어, 시간이 날 때, 별 의미 없이 했던 일들……."
1006106-68 = "보통은 업무를 하다가 남는 대기 시간이나, 이동 도중 짬이 날 때의 일들이겠군요."
1006106-69 = "뭐, 그럴 때는 최근……."
1006106-70 = "보통 선생님께 모모톡으로 잡담을 보내거나……."
1006106-71 = "문득 떠오른 주제에 대해서 선생님께 말을 걸거나……."
1006106-72 = "고민 같은 게 생겼을 때 상담을 신청하거나……."
1006106-73 = "그랬……던……. 것……."
1006106-74 = "같……은……데……."
1006106-84 = "[ns7] \"……사쿠라코?\"\n[ns8] \"방금 뭐라고 말했어?\""
1006106-89 = "……어."
1006106-90 = "어. 으, 으음……. 그게……."
1006106-94 = "……선생님."
1006106-95 = "대단히 죄송합니다만, 이 이야기는 여기까지 해도 괜찮을까요?"
1006106-96 = "해결은……. 이미 되었습니다. 다만, 저 스스로 조금 추스를 시간이 필요할 것 같습니다."
1006106-97 = "두서도 없고, 예의도 없는 행동이라는 걸 알고 있지만."
1006106-98 = "부디……. 이렇게 부탁드립니다."
1006106-99 = "오, 오늘은."
1006106-100 = "여기까지만, 하게 해주십시오……."
1006106-105 = "[ns] \"………….\""
1006106-107 = "[ns] \"……????\""
1006106-109 = "(이후 어째서인지 어색한 얼굴을 한 사쿠라코의 배웅을 받으며 대성당을 빠져나왔다.)"
