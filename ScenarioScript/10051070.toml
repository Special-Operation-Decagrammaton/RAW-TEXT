[translation]
10051070-1 = "제7화;낯선 공백"
10051070-2 = "<소녀인법첩 미치룻치> 촬영 장소"
10051070-3 = "냐하하~ 네, 저랍니다."
10051070-4 = "카메라부터 드레스까지…… 저희 음양부가 빌려드린 것들을 잘 활용하고 계신 걸 보니 이거, 보람이 느껴지는군요."
10051070-8 = "니야 공……!"
10051070-9 = "혹시 저희 드레스를 회수하러 오신 건가요?!"
10051070-10 = "냐하하, 아니랍니다. 반납은 언제든 편할 때 해주시면 되니까요."
10051070-11 = "그렇다면 혹시 게스트 출연의 목적?!"
10051070-12 = "환영합니다, 니야 공! 닌자의 길은 늘 열려 있습니다! 닌닌!"
10051070-13 = "아니, 그쪽 이유도 아니긴 한데……."
10051070-15 = "그럼 음양부의 부장이 여기는 무슨 일이야?"
10051070-16 = "뭐, 지나가다가 우연히 마주쳤다고 할까요……."
10051070-17 = "그보다, 역시 츠쿠요 씨는 오지 않았군요."
10051070-18 = "응. 이상할 정도로 연락도 안 되고, 오늘따라 늦는데……"
10051070-22 = "아니 그런데 잠깐만, 역시라니? 그게 무슨 소리야?"
10051070-24 = "아, 제가 알기로 츠쿠요 씨는 이제 인법연구부 활동에서 빠지게 되었다고 들었거든요."
10051070-29 = "뭐어?!"
10051070-30 = "그, 그게 무슨 소리야?!"
10051070-31 = "모르고 있었군요."
10051070-32 = "사실 닌자 말고는 관심사가 없어 보이는 것 같아서 예상은 하고 있었지만……."
10051070-33 = "아니 아니 아니, 츠쿠요가 인법연구부에서 빠진다니? 그게 무슨 소리야?!"
10051070-34 = "내가 부장인데 왜 내가 모르는 이야기가 나와?!"
10051070-35 = "미치루 님, 혹시 <ron-ro>나 <하트걸즈>를 보시나요?"
10051070-36 = "그게 뭐야?"
10051070-37 = "그러면 <BiBi>는 더더욱 모르실 거고…… 그럼 혹시 하고 있는 SNS는 있으신가요?"
10051070-38 = "<소녀인법첩 미치룻치> 채널을 운영하고 있지."
10051070-39 = "음, SNS도 안 하시고. 그랬으면 당연히 '그 방송'도 못 보셨겠군요."
10051070-40 = "방송? 무슨 방송?"
10051070-41 = "으음…… 직접 보여드리는 게 빠르겠네요. 크로노스 채널에 올라온 녹화 영상이랍니다."
10051070-47 = "그러면 마지막 질문! 츠쿠요 씨의 앞으로의 계획을 한 줄로 말씀해 주실까요!"
10051070-48 = "그, 아, 앞으로, 머, 멋진 패션모델이 되도록 최선을 다하겠습니다!"
10051070-49 = "예! 그럼 앞으로 츠쿠요 씨의 모델 인생에 꽃길만 펼쳐지길 바라며……."
10051070-54 = "어……."
10051070-55 = "그…… 어……."
10051070-56 = "츠쿠요? 무슨 말이야? 모델이라니? 앞으로 쭈욱 모델로…… 활동하겠다는 거야?"
10051070-57 = "부장……."
10051070-58 = "……."
10051070-59 = "그…… 왜? 아니, 대체 언제부터……?"
10051070-60 = "저번 패션쇼 때, 츠쿠요 씨가 대타 모델로서 무대에 올랐었다고 들었습니다."
10051070-61 = "그때 패션 평론가들을 비롯한 업계인들 사이에서 상당한 반향이 일었다고 해요."
10051070-62 = "그래서 아마 그 직후에, 샤인캣 디자이너의 에이전시에서 츠쿠요 씨를 섭외해 간 것으로 알고 있고요."
10051070-63 = "……그나저나 정말로 모르고 있었군요, 미치루 씨."
10051070-64 = "……."
10051070-65 = "나…… 정말로 몰랐어."
10051070-66 = "……그렇군요, 아무래도 더 말을 하기에는 좋은 날이 아닌 것 같네요."
10051070-67 = "그럼 오늘은 이만 물러나겠습니다."
10051070-71 = "부장…… 츠쿠요는……."
10051070-72 = "이즈나, 무대 위에 서 있던 츠쿠요의 모습, 기억나?"
10051070-73 = "……물론입니다."
10051070-74 = "어땠어?"
10051070-75 = "……아름답다고, 생각했습니다."
10051070-76 = "그리고?"
10051070-77 = "그리고…… 우으으……."
10051070-78 = "마치 다른 세상의 사람 같다, 라는 생각이 들지 않았어?"
10051070-79 = "……!"
10051070-80 = "우리는 무대 아래, 가장 어둡고 구석진 곳에서 올려다보고 있고……"
10051070-81 = "츠쿠요는, 무대의 가장 높고 밝은 곳에 서 있었잖아."
10051070-82 = "그렇지만 부장…… 닌자는 원래 가장 어두운 곳에서 뜨겁게 마음을 빛내는 이들이잖아요?"
10051070-83 = "맞아, 그렇지만…… 아니, 오히려 그래서 츠쿠요가, 우리를……."
10051070-87 = "아 맞다, 하나 깜빡한 게 있었네요."
10051070-88 = "흐익!"
10051070-89 = "아직 안 갔어?!"
10051070-90 = "예, 생각해 보니 오늘 이곳에 온 진짜 목적을 막상 하나도 말씀을 안 드려서 말이죠, 냐하하."
10051070-91 = "목적? 지나가다가 우연히 마주친 게 아니었어?!"
10051070-92 = "후후, 의도된 우연이라는 거죠."
10051070-93 = "앞뒤가 안 맞아……!"
10051070-94 = "우연에 의도가 끼면 더 이상 우연이 아니잖아?!"
10051070-95 = "후후 외교적 수사라는 것이랍니다."
10051070-96 = "어쨌든, 츠쿠요 씨가 오늘 촬영에 불참하시게 될 것은 기정사실, 이라는 느낌이 되어 버린 터라……."
10051070-97 = "제가 츠쿠요 씨의 빈자리를 메워 줄 촬영 보조를 직접 섭외해 왔다! 라는 이야기랍니다."
10051070-99 = "촬영 보조……?!"
10051070-100 = "저기 니야, 평소답지 않은 세심한 마음 씀씀이는 정말 고마운데……."
10051070-101 = "그, 츠쿠요의 자리는 다른 사람이 대체하기가 어려운……"
10051070-107 = "[ns] \"안녕하세요, 금일 한정 임시 촬영 보조입니다.\""
10051070-108 = "흐끼야악!!"
10051070-109 = "주군!"
10051070-110 = "뭐야?! 갑자기 뒤에서 튀어나와서 깜짝 놀랐잖아?!"
10051070-111 = "[s1] \"음, 일종의 앰부쉬랄까.\"\n[s2] \"인사를 나누기 전 1회의 앰부쉬는 허용 아니었나?\""
10051070-114 = "역시 선생 공! 내 가르침을 제대로 기억하고 있었……."
10051070-115 = "아니 지금 그게 중요한 게 아니지! 니야, 지금 선생 공을 촬영 보조로 섭외한 거야?! 어떻게?!"
10051070-116 = "냐하하, 자잘한 건 신경 쓰지 말구요."
10051070-117 = "그럼 용건은 제대로 전달 되었으니, 저는 정말로 가보겠답니다~."
10051070-121 = "와아! 주군! 반갑습니다!"
10051070-122 = "예기치 못한 순간에 마주치니 더 반가운 것 같습니다! 닌닌!"
10051070-123 = "갑자기 선생 공을 촬영에 섭외하게 되다니……."
10051070-124 = "이건 정말 예상치도 못한 전개인걸……."
10051070-125 = "그럼…… 어…… 일단 촬영을 시작해도 되려나……."
10051070-126 = "응? 츠쿠요를 빼고 촬영해도 되냐고?"
10051070-127 = "당연히 괜찮지 않지만…… 전화도 안 받고, 모모톡 답장도 없고, 행방도 모르니 어쩔 도리가 없어서……."
10051070-128 = "[s3] \"츠쿠요가 어디 있는지는 나도 모르지만…….\"\n[s4] \"연락할 방법은 알고 있어.\""
10051070-131 = "뭐?!"
10051070-132 = "정말입니까, 주군?!"
10051070-133 = "뭔데? 어떻게 하면 츠쿠요랑 연락할 수 있는데?!"
10051070-134 = "[s] \"니야로부터 샤인캣 매니저의 연락처를 받았거든.\""
10051070-135 = "……!"
10051070-136 = "부장! 바로 전화를 걸어봅시다!"
10051070-137 = "물론이지!"
10051070-138 = "그 전에…… 흐으읍…… 후우우……."
10051070-139 = "[s] \"심호흡을 하는 거야?\""
10051070-140 = "낯선 이와 통화하는 건 늘 무섭…… 아니, 신중해야 하는 일이니까!"
10051070-141 = "자, 그럼…… 선생 공이 준 번호로 전화를…… 후우우……."
10051070-147 = "뚜르르르……"
10051070-148 = "딸깍."
10051070-151 = "예, 전화받았습니다."
10051070-152 = "아……안녕하신가!"
10051070-153 = "네? 누구십니까?"
10051070-154 = "그, 그래! 다름이 아니라! 츠쿠요라는 닌자…… 아니, 모델이 거기 있나요?"
10051070-155 = "츠쿠요 씨요?"
10051070-159 = "에휴, 또 기자인가……."
10051070-160 = "이봐요, 충분히 인터뷰에도 응하고 보도자료도 뿌렸지 않았습니까."
10051070-161 = "저희 지금 한창 바쁠 시간이니, 이만 끊겠습니다."
10051070-162 = "아니 아니 잠깐만! 우리는 기자가 아니야!!"
10051070-163 = "나는 치도리 미치루! 츠쿠요의 친구라고!"
10051070-164 = "아……당신입니까, 미치루가?"
10051070-165 = "엥? 나를 알고 있다고?"
10051070-167 = "설마 당신, <소녀인법첩 미치룻치>의 구독자인가……?!"
10051070-168 = "인법…… 뭐라고요?"
10051070-169 = "저는 그런 거 모릅니다. 제가 당신 이름을 알고 있는 건 츠쿠요 씨가 말해서 알고 있는 것뿐이고."
10051070-170 = "아무튼, 용건이 뭡니까?"
10051070-171 = "그, 그래, 용건! 당신들, 츠쿠요를 어떻게 한 거야!"
10051070-172 = "네?"
10051070-173 = "츠쿠요가 전화도 안 받고! 모모톡도 확인하지 않고 있다고!"
10051070-174 = "아니, 뭐 고작 그런 일로……."
10051070-175 = "고작……?"
10051070-176 = "일에 집중하기 위해서 연락을 차단하는 것은 프로의 세계에서 흔한 일입니다."
10051070-177 = "뭐, 이 경우는 우리가 폰을 압수한 거긴 하지만."
10051070-178 = "압수?!"
10051070-179 = "무엇보다, 지금 츠쿠요 씨가 얼마나 열심히 화보 촬영에 임하는지 아세요?"
10051070-180 = "츠쿠요가……?"
10051070-181 = "예. 그러니 이야기는 여기까지 하고, 끊겠습니다."
10051070-182 = "잠깐만! 츠쿠요랑 잠깐이라도 통화를……!"
10051070-183 = "츠쿠요 씨는 걱정하실 것 없습니다. 오늘 저녁에 저희 채널에 츠쿠요 씨 화보 촬영 영상이 올라갈 테니까요."
10051070-184 = "그럼 이만."
10051070-189 = "부, 부장……."
10051070-190 = "……"
10051070-194 = "좋아, 넋두리는 여기까지 하자."
10051070-195 = "부장?!"
10051070-196 = "츠쿠요도 촬영 영상을 오늘 올린다잖아. 그렇다면 우리도 질 수 없지!"
10051070-197 = "츠쿠요가 없더라도…… 일단은 우리가 할 수 있는 일을 하자고!"
10051070-198 = "무엇보다 선생 공도 도와줄 거잖아! 안 그래?"
10051070-199 = "[s] \"물론이지!\""
10051070-200 = "자, 마저 촬영 현장을 세팅하자, 이즈나!"
10051070-201 = "네, 넵! 부장!"
10051070-205 = "자! 오늘의 <소녀인법첩 미치룻치>! 그 주제는 바로…… 잠입 상황에서의 인법!"
10051070-206 = "어디에 어떤 암기를 숨겨야 하고, 어떤 유파의 기술을 활용해야 하는가!"
10051070-207 = "그 모든 것에 대하여! 오늘의 미치룻치가……"
10051070-208 = "미치루……가……."
10051070-209 = "……."
10051070-210 = "[s] \"미치루, 괜찮아?\""
10051070-211 = "부장, 역시 오늘 촬영은 다음으로 미루는 게……."
10051070-215 = "후우우우……"
10051070-216 = "아냐, 촬영은…… 이대로 간다……!"
