[translation]
901010600430-6 = ""
901010600430-7 = "I gathered a few things about the missing fisherman..."
901010600430-8 = "As we knew, Miyaguchi didn't have a sterling reputation."
901010600430-9 = "He was a diligent worker, but he was often criticized because he frequently complained."
901010600430-10 = "And, based on his colleagues' reports, he missed a lot of work because of his gambling addiction."
901010600430-11 = "Gambling? Like betting money?"
901010600430-12 = "Yeah, and lots of it. He was a big spender, so he was often strapped for cash. So he made a habit of trying his luck at the tables."
901010600430-13 = "But I guess he didn't have the knack for it. He never hit the jackpot."
901010600430-14 = "That's why he took out some dubious private loans."
901010600430-15 = "There's no \"knack\" in gambling. It's designed to take your money and give it to the house."
901010600430-16 = "You might come up ahead once or twice, but you'll end up losing everything if you don't know when to quit."
901010600430-17 = "It's best to earn your money honestly. And never bet more than you are willing to lose. \"Easy come, easy go,\" as they say."
901010600430-18 = "Still, one can dream."
901010600430-19 = "Like if I won the lottery, I'd live in the lap of luxury..."
901010600430-21 = "Cool. So, unless Miyaguchi got involved in an accident or suddenly vanished, there are only a few reasons why he would suddenly disappear."
901010600430-22 = "The reason he had to flee the port was..."
901010600430-23 = ""
901010600430-25 = ""
901010600430-26 = ""
901010600430-29 = ""
901010600430-30 = "#Q;유키노;The reason he had to flee the port was...\n[as2] \"Someone was after his money.\"\n[as3] \"He was being bullied.\"\n[as1] \"He couldn't repay his gambling loan.\""
901010600430-32 = "Right. There's no way he could have dealt with not only the gambling debts, but also the private loan interest."
901010600430-33 = "Even his fellow fishermen knew of his exorbitant debt..."
901010600430-34 = "He must've seized the moment when there was no one around and fled from his creditors."
901010600430-35 = ""
901010600430-38 = ""
901010600430-39 = "Hmm. Since he was a heavy spender, someone might've thought he was rich..."
901010600430-40 = "But I don't think he would've uprooted his life because he was threatened by a robber. He didn't even have much money to lose."
901010600430-41 = "Think again, Sensei."
901010600430-42 = ""
901010600430-44 = ""
901010600430-45 = ""
901010600430-46 = ""
901010600430-50 = "A few people disliked him for his constant complaining..."
901010600430-51 = "But there's no direct evidence of bullying."
901010600430-52 = "Wouldn't there be a more reasonable cause if it were true?"
901010600430-53 = ""
901010600430-55 = ""
901010600430-56 = ""
901010600430-57 = ""
901010600430-60 = "Lots of people run away from their debt."
901010600430-61 = "Does it work? Would running off to another district clear all the money you owe?"
901010600430-62 = "No way. Unless you declare bankruptcy, your debt will follow you forever."
901010600430-64 = "I heard that once an ENTIRE district was handed over to a corporation because an academy couldn't pay off its debts."
901010600430-65 = ""
901010600430-68 = ""
901010600430-69 = "An academy-sized debt... I can't even imagine how you'd pay that off..."
