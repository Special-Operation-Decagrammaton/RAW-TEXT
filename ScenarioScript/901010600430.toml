[translation]
901010600430-6 = ""
901010600430-7 = "สรุปข้อมูลที่สืบมาเกี่ยวกับชาวประมงที่หายตัวไป..."
901010600430-8 = "อย่างที่เรารู้อยู่แล้ว ชาวประมงที่ชื่อมิยากุจิดูเหมือนจะมีชื่อเสียงไม่ค่อยดีนักในหมู่คนรอบตัว"
901010600430-9 = "ต่อให้เป็นคนตั้งใจทำงาน แต่ก็มักจะบ่นเรื่องทุกเรื่อง จนทำให้ถูกตำหนิอยู่บ่อยๆ"
901010600430-10 = "แถมชาวประมงที่ทำงานด้วยกันยังบอกว่า เขาติดการพนันจนมักจะไม่มาทำงานด้วย"
901010600430-11 = "การพนัน? หมายถึงเอาเงินไปเล่นพนันน่ะเหรอ?"
901010600430-12 = "อื้อ ได้ยินว่าเขาใช้เงินมือเติบจนเงินไม่พอ เลยหวังรวยทางลัดด้วยการพนันอยู่บ่อยๆ"
901010600430-13 = "แต่เขาคงไม่มีพรสวรรค์ด้านนั้น ก็เลยไม่เคยได้เงินก้อนโตเลย"
901010600430-14 = "และสุดท้ายดูเหมือนจะถึงขั้นไปกู้เงินนอกระบบ..."
901010600430-15 = "การพนันไม่ใช่เรื่องที่พรสวรรค์จะช่วยได้หรอก มันถูกออกแบบมาเพื่อให้สูญเสียเงินอย่างหลีกเลี่ยง#nไม่ได้อยู่แล้ว"
901010600430-16 = "ถ้าแค่ครั้งสองครั้งก็อาจจะได้เงินมาบ้างก็จริง แต่ถ้าเล่นต่อไป สุดท้ายก็จะเสียเงินจนหมดตัวน่ะสิ"
901010600430-17 = "เงินน่ะหาอย่างสุจริตดีที่สุดแล้ว มีคำกล่าวด้วยว่าเงินที่หามาง่ายก็หมดไปง่าย"
901010600430-18 = "แต่ยังไงเราก็ฝันได้อยู่ไม่ใช่เหรอ?"
901010600430-19 = "อ่า~ ฉันเองก็อยากถูกลอตเตอรี่แล้วใช้ชีวิตหรูหราบ้างจัง~"
901010600430-21 = "แต่ถ้ามิยากุจิไม่ได้ประสบอุบัติเหตุหรือหายตัวไปอย่างกะทันหัน เหตุผลที่เขาจำเป็นต้องหลบซ่อนตัว#nก็คงจำกัดเหลือเพียงไม่กี่ข้อ"
901010600430-22 = "เหตุผลที่เขาต้องหนีออกจากท่าเรืออย่างกะทันหันคือ..."
901010600430-23 = ""
901010600430-25 = ""
901010600430-26 = ""
901010600430-29 = ""
901010600430-30 = "#Q;유키노;เหตุผลที่เขาต้องหนีออกจากท่าเรืออย่างกะทันหันคือ...\n[as2] เพราะมีใครบางคนหมายปองเงินของเขา\n[as3] เพราะถูกคนรอบข้างกลั่นแกล้ง\n[as1] เพราะเขาใช้หนี้พนันไม่ไหว"
901010600430-32 = "ใช่ ทั้งหนี้พนันและดอกเบี้ยเงินกู้นอกระบบ คนธรรมดาคงไม่มีทางทนรับไหวหรอก"
901010600430-33 = "สถานการณ์หนี้สินของเขาย่ำแย่ขนาดที่ชาวประมงคนอื่นที่ทำงานด้วยกันยังรู้เลย..."
901010600430-34 = "เขาต้องอาศัยจังหวะที่ไม่มีคน แล้วหนีเจ้าหนี้ไปแน่นอน"
901010600430-35 = ""
901010600430-38 = ""
901010600430-39 = "อืม ชาวประมงคนนั้นใช้เงินมือเติบ ก็ไม่แปลกที่ใครจะเข้าใจผิดได้..."
901010600430-40 = "แต่ช่วงหลังเขาเสียเงินทั้งหมดไปกับการพนันแล้ว ฉันไม่คิดว่าเขาจะหนีไปเพราะถูกโจรข่มขู่หรอกนะ"
901010600430-41 = "ลองคิดใหม่อีกครั้งเถอะ คุณครู"
901010600430-42 = ""
901010600430-44 = ""
901010600430-45 = ""
901010600430-46 = ""
901010600430-50 = "จริงอยู่ว่าเขาเป็นคนชอบบ่นทุกเรื่อง จึงดูเหมือนจะมีคนไม่ชอบอยู่ไม่น้อย..."
901010600430-51 = "แต่ฉันก็ไม่พบร่องรอยของความขัดแย้งโดยตรงใดๆ อย่างการกลั่นแกล้งค่ะ"
901010600430-52 = "ไม่มีเหตุผลที่เข้าใจง่ายกว่านั้นเหรอคะ?"
901010600430-53 = ""
901010600430-55 = ""
901010600430-56 = ""
901010600430-57 = ""
901010600430-60 = "การหนีไปกลางดึกเพราะหนี้สินเป็นเรื่องที่เกิดขึ้นได้บ่อย"
901010600430-61 = "แต่ถ้าหนีไปเขตปกครองตนเองอื่น หนี้ที่ติดไว้จะหายไปเหรอ?"
901010600430-62 = "ไม่มีทางหรอก ตราบใดที่ไม่ยื่นล้มละลาย หนี้ส่วนบุคคลจะตามติดไปตลอดชีวิตนั่นละ"
901010600430-64 = "ได้ยินว่ามีโรงเรียนแห่งหนึ่งที่จ่ายหนี้ที่พอกพูนขึ้นเรื่อยๆ ไม่ไหว จนเขตปกครองตนเองต้องตกไป#nอยู่ในมือของบริษัทเจ้าหนี้ด้วยนะ"
901010600430-65 = ""
901010600430-68 = ""
901010600430-69 = "หนี้สินระดับโรงเรียนเลยเหรอ จินตนาการไม่ออกเลยนะว่าจะจ่ายยังไงไหว..."
