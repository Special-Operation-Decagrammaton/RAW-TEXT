[translation]
901010600430-6 = ""
901010600430-7 = "我整理了針對消失的漁夫進行調查後獲得的資訊……"
901010600430-8 = "如同先前掌握的情報，那個叫宮口的漁夫，在周圍的人當中風評似乎不太好。"
901010600430-9 = "雖然工作認真踏實卻凡事都愛抱怨，也曾因此受到責備。"
901010600430-10 = "根據一起工作的漁夫們所說，他甚至還沉迷於賭博，經常不見人影。"
901010600430-11 = "賭博？你是說他把錢拿去當賭注嗎？"
901010600430-12 = "嗯。他因為花錢大手大腳經常手頭很緊，所以好像經常想靠賭博一夕致富的樣子。"
901010600430-13 = "不過大概是天生沒有那個才能，因此從來沒有贏過大錢。"
901010600430-14 = "也是因為這樣，最後似乎還涉足了高利貸……"
901010600430-15 = "賭博單靠才能是不可能行得通的。#n畢竟賭博就是朝著讓人虧損的方向設計的啊。"
901010600430-16 = "也許可以贏個一兩次，但是長久下來遲早會把財產全部輸光。"
901010600430-17 = "還是老老實實地賺錢比較好。#n俗話說「來得快去得也快」嘛。"
901010600430-18 = "不過做做夢也是可以的吧。"
901010600430-19 = "啊啊～我也好想中樂透過上奢侈的生活啊～"
901010600430-21 = "總之，如果宮口不是遭遇事故也不是突然人間蒸發……#n那麼他非得銷聲匿跡的原因，就能縮小到幾種可能性了。"
901010600430-22 = "他之所以不得不從港口倉皇逃走的原因是……"
901010600430-23 = ""
901010600430-25 = ""
901010600430-26 = ""
901010600430-29 = ""
901010600430-30 = "#Q;유키노;他之所以不得不從港口倉皇逃走的原因是……\n[as2] 因為他的錢被強盜盯上了。\n[as3] 因為遭到周遭人們的霸凌。\n[as1] 因為無法償還賭債。"
901010600430-32 = "沒錯。除了賭債之外還有高利貸的利息，一般人想必是無法承受的吧。"
901010600430-33 = "甚至連一起工作的其他漁夫們都知道他的債務狀況，可見事情已經相當嚴重了……"
901010600430-34 = "肯定是為了躲避債主，趁著人煙稀少的空檔逃跑的。"
901010600430-35 = ""
901010600430-38 = ""
901010600430-39 = "唔嗯……那個漁夫花錢毫無節制，所以或許會因此讓人誤會……"
901010600430-40 = "不過他最近才因為賭博把錢全部輸光了，實在不像是遭到強盜威脅才逃跑的。"
901010600430-41 = "再仔細想一想吧，老師。"
901010600430-42 = ""
901010600430-44 = ""
901010600430-45 = ""
901010600430-46 = ""
901010600430-50 = "他確實凡事都愛抱怨，因此討厭他的人似乎也不少……"
901010600430-51 = "不過並沒有找到霸凌這類直接衝突的跡象。"
901010600430-52 = "會不會是更加顯而易見的原因呢？"
901010600430-53 = ""
901010600430-55 = ""
901010600430-56 = ""
901010600430-57 = ""
901010600430-60 = "因為債務而連夜潛逃的情況，確實相當常見。"
901010600430-61 = "可是逃到其他自治區，原本背負的債務就會一筆勾銷嗎？"
901010600430-62 = "怎麼可能。除非申請破產，否則個人背負的債務會跟著你一輩子。"
901010600430-64 = "聽說還有學園因為無法償還持續增加的債務，導致整個自治區落入企業手中的案例。"
901010600430-65 = ""
901010600430-68 = ""
901010600430-69 = "學園規模的債務啊……我連該怎麼償還都難以想像……"
