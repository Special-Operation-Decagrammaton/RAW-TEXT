[translation]
901010600430-7 = "사라진 어부에 대해 조사한 내용을 정리하자면……"
901010600430-8 = "이미 알고 있던 것처럼 그 미야구치라는 어부는 주위 평판이 그리 좋지 않았던 모양이야."
901010600430-9 = "일은 성실하게 했었지만, 매사에 불평이 많아서 쓴소리를 듣기도 했고."
901010600430-10 = "심지어 함께 일하는 어부들의 말로는 도박에 빠져 모습을 보이지 않을 때도 많았다는데."
901010600430-11 = "도박? 돈을 걸고 노름을 했단 말이야?"
901010600430-12 = "응. 돈 씀씀이가 헤픈 만큼 주머니 사정이 궁할 때가 많아서, 도박으로 한탕을 노릴 때가 잦았대."
901010600430-13 = "하지만 타고난 재능은 없었는지, 큰돈을 딴 경우는 없었던 것 같아."
901010600430-14 = "그 때문에 결국에는 사채에까지 손을 댄 모양이고……"
901010600430-15 = "도박에 재능이라는 건 통하지 않아. 도박은 무조건 돈을 잃는 방향으로 설계되어 있으니까."
901010600430-16 = "한두 번은 돈을 벌 수 있을지 몰라도, 계속되면 가진 돈을 전부 잃게 될 거야."
901010600430-17 = "돈은 정직하게 버는 게 제일이지. 쉽게 번 돈은 쉽게 나간다는 소리도 있고."
901010600430-18 = "그래도 꿈은 꿔 볼 수도 있잖아."
901010600430-19 = "아아~ 나도 복권에 당첨되어서 호화롭게 살고 싶다~"
901010600430-21 = "여하튼 미야구치가 사고를 당했거나, 갑자기 증발해 버린 게 아니라면, 모습을 감추어야만 할 이유는 몇 가지로 좁힐 수 있겠군."
901010600430-22 = "그가 항만에서 갑작스럽게 도망쳐야만 했던 이유는……"
901010600430-30 = "그가 항만에서 갑작스럽게 도망쳐야만 했던 이유는……\n[as2] 누군가 그의 돈을 노리고 있어서다.\n[as3] 주변 사람들로부터 괴롭힘을 당했다.\n[as1] 도박 빚을 갚지 못해서다."
901010600430-32 = "맞아. 도박 빚에 사채 이자까지 생겼으니 평범한 사람으로서는 견딜 재간이 없었겠지."
901010600430-33 = "함께 일하는 다른 어부들까지 그의 빚 사정을 알고 있을 정도였으니……"
901010600430-34 = "인적이 드문 틈을 타 빚쟁이들을 피해 도망친 게 분명해."
901010600430-39 = "음. 그 어부는 씀씀이가 헤펐으니, 누군가가 오해할 수도 있었겠지만……"
901010600430-40 = "그래도 최근에는 도박으로 돈을 모두 잃었는데, 강도에게 위협받아 도망쳤을 것 같진 않아."
901010600430-41 = "다시 한 번 생각해 봐, 선생님."
901010600430-50 = "확실히 매사에 불평이 많은 사람이라, 싫어하는 사람들이 꽤 있었던 것 같지만……"
901010600430-51 = "괴롭힘과 같은 직접적인 갈등의 흔적은 찾지 못했어요."
901010600430-52 = "그보다는 좀 더 알기 쉬운 이유가 있지 않을까요?"
901010600430-60 = "빚 때문에 야반도주하는 경우는 제법 흔하지."
901010600430-61 = "그런데 다른 자치구로 도망치면 가지고 있던 빚이 변제되는 거야?"
901010600430-62 = "그럴 리가. 파산 신청을 하지 않는 이상, 개인이 진 빚은 평생 따라다닌다고."
901010600430-64 = "어떤 학원은 늘어나는 빚을 갚지 못해 자치구가 통째로 기업에 넘어간 경우도 있대."
901010600430-69 = "학원 규모의 빚이라니, 어떻게 갚아야 할지 상상도 안 가네……."
