[translation]
10038105-11 = "어째서, 이런 일이……?"
10038105-12 = "후후후. 아직도 모르겠는가? 그렇다면 내 알려주도록 하지."
10038105-16 = "네가 산해경에 퍼트린 질병에 대해 생각해 보거라. 우리가 어린이 병이라고 이름 붙인 그것을 말이다."
10038105-17 = "그것은…… 신체 나이와 구조를 퇴행시켜 어린 시절로 되돌리는……."
10038105-21 = "설마?!"
10038105-22 = "그렇다. 그 덕분에 이 몸은 오히려, 지금까지 중에서도 가장 상태가 좋았던 때로 돌아가 있지."
10038105-23 = "언제부터……?!"
10038105-24 = "글쎄. 언제부터였을까?"
10038105-25 = "키사키……!"
10038105-26 = "후후후. 제 꾀에 스스로 넘어간 셈이로구나. 신타니 카이."
10038105-27 = "어떻게 하겠느냐? 계속하여 소란을 일으키겠다면."
10038105-31 = "나는 언제까지든 어울려 줄 수 있는데 말이다."
10038105-37 = "……."
10038105-41 = "나의 패배다. 적어도 이번은."
10038105-42 = "그런데 말이다. 나를 어떻게 처분할 생각이냐, 키사키?"
10038105-43 = "애초에 나를 산해경에서 감당하지 못했기에, 교정국으로 보낸 것이 아니었던가?"
10038105-44 = "……."
10038105-48 = "여러 가지 의미로, 너는 산해경에서 감당하기 힘든 학생이었지……."
10038105-49 = "하지만 현룡문의 결정은 변하지 않는다."
10038105-50 = "너는 다시 교정국으로 이송될 것이고, 이번에는 특별히 더 엄중한 장소로 보내어질 것이다."
10038105-52 = "쿡쿡쿡……. 정말이지 한결같구나. 키사키. 하지만 세간에는 이런 말도 있는 법이지."
10038105-56 = "같은 일을 반복하면서, 다른 결과를 기대하는 것은 제정신이 아닌 짓이라고."
10038105-58 = "……뜻대로 하거라. 신타니 카이."
10038105-59 = "네가 어디에서 무엇을 하든, 현룡문은 몇 번이라도 너를 상대할 테니 말이다."
10038105-64 = "웃음조차 나오지 않는구나. 흥이 떨어졌다. 그렇다면 이번에는 선생에게 묻도록 하지."
10038105-65 = "[s] \"응? 나?\""
10038105-66 = "그래. 선생에게는 예전부터 여러 가지로 흥미가 있어서 말이지."
10038105-67 = "내가 듣기로는, 선생은 모든 학생의 편이 되어 주는 어른이라고 하더군. 맞는가?"
10038105-68 = "[s] \"그래. 맞아.\""
10038105-69 = "그렇다면 그것은 나에게도 해당되는 것인가?"
10038105-70 = "[s] \"물론이야.\""
10038105-71 = "호오?"
10038105-76 = "선생……!"
10038105-77 = "[s1] \"카이가 더 이상 다른 학생들을 이용하지 않겠다고 약속하면.\"\n[s2] \"나는 언제든지, 카이의 편도 되어 줄 거야.\""
10038105-80 = "……조건을 붙이겠다는 것이군."
10038105-81 = "하지만 말이다, 선생. 나는 나 자신에게 반성할 것이 없다고 생각한다만?"
10038105-82 = "[s3] \"그렇다면 카이에게는 '공부'가 필요하겠네.\"\n[s4] \"만일 그걸 가르쳐 줄 사람이 필요하다면, 나를 찾아 줘.\""
10038105-86 = "[ns] \"나는 가능하다면, 어떤 학생도 포기하고 싶지 않으니까.\""
10038105-90 = "선생……."
10038105-91 = "……."
10038105-92 = "그렇다면 말이다. 선생. 이것은 만약과 가정의 이야기이고."
10038105-93 = "또한, 개인적으로 갑자기 호기심이 들어서 묻는 것이다만."
10038105-94 = "아무리 말도 안 되는 학생이고, 구제불능이라고 해도."
10038105-95 = "어떻게 해도 반성 같은 것은 하지 않고, 세간의 표현을 빌리자면 괴물이나 마찬가지인 학생이라고 해도."
10038105-96 = "그럼에도 선생은, 같은 선택을 내릴 것인가?"
10038105-100 = "[ns5] \"그렇다고 해도 최선을 다할 거야.\"\n[ns6] \"우리에게는 그것 말고 할 수 있는 일이 없으니까.\""
10038105-103 = "그것이 정말로, 만에 하나, 아무리 해도 안 되는 학생이라면?"
10038105-104 = "[s] \"한 가지만 부탁할게. 카이.\""
10038105-111 = "[ns] \"내가, 너를 포기하지 않도록 해 줘.\""
10038105-115 = "……!"
10038105-116 = "쿡, 쿡쿡쿡…… 하하하하하! 이거 허를 찔렸군! 거기에서 그렇게 나올 줄은!"
10038105-117 = "좋다. 나를 잡아가라. 선생의 대답을 봐서라도, 여기에서는 순순히 따르도록 하지!"
10038105-118 = "포기하지 않게 해 달라……. 아아, 즐거웠다. 정말로 즐거웠어."
10038105-119 = "그러면, 신타니 카이. 네가 마지막으로 해 주어야 할 일이 있다."
10038105-120 = "말해 보아라. 지금의 나는 매우 기분이 좋으니까 말이지."
10038105-121 = "산해경에는 어린이 병에 대한 완전한 치료약이 필요하다."
10038105-122 = "그것인가……. 어린이 병이 전염성이었듯, 치료약 역시 전염성을 띠고 조제되었다."
10038105-123 = "치료약을 살포하는 것에는 문제가 없지. 당장이라도 그렇게 할 수 있다."
10038105-124 = "쿡쿡쿡…… 그렇지만 괜찮겠느냐? 치료약이 퍼진다면, 너 역시 원래의 병약한 몸으로 돌아갈 터인데?"
10038105-125 = "대답할 필요도 없는 것을 묻는구나."
10038105-130 = "산해경이 그로 인해 원래대로 돌아갈 수 있고, 그리하여 월영제를 무사히 열 수 있다면."
10038105-131 = "그리하지 않을 이유가 도대체 어디에 있겠는가?"
10038105-136 = "……마지막까지 범부(凡夫)들 중 한 명으로 남겠다는 것이냐……."
10038105-140 = "좋다. 마음대로 하거라. 언젠가 네가 이 선택을 후회하게 된다 해도, 나는 모르는 일이니."
10038105-141 = "그것이야말로 두말하면 잔소리가 되겠구나."
