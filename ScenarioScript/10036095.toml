[translation]
10036095-5 = "으으으……."
10036095-11 = "아얏! 따끔하네요!"
10036095-12 = "여기까지다. 전설의 스케반."
10036095-13 = "네 부하들은 전부 쓰러졌어. 이 이상의 싸움은 무의미하다."
10036095-14 = "아니면……… 혼자라도 해보겠다는 건가?"
10036095-15 = "소녀의 복수는 여기까지……라는 건가요……!"
10036095-16 = "큭, 당신들, 대체 정체가 뭔가요? 평범한 헬멧단은 아닌 것 같은데……"
10036095-20 = "우리는……."
10036095-26 = "거기까지 하도록 하죠. 아케미."
10036095-27 = "[ns] (………통신? 누구?)"
10036095-29 = "슬슬 그 해변에서 빠져나오는 게 좋을 거예요."
10036095-30 = "네? 하지만 소녀, 아직 싸울 수 있는걸요?"
10036095-32 = "후후, 센 척하시기는."
10036095-33 = "오랫동안 교정국에 갇혀 있던 몸이 아직 만전의 상태가 아니라는 거, 저는 알고 있답니다."
10036095-34 = "그런 상태에서 계속 싸운다면……."
10036095-35 = "복수 이전에 다시 교정국으로 돌아가게 되는 결말을 맞이할지도 몰라요. 그건 추천하고 싶지 않네요."
10036095-36 = "──모처럼 제가 손을 써서 탈옥시킨 [ruby= ・ ]일[/ruby][ruby= ・ ]곱[/ruby][ruby= ・ ]의[/ruby] [ruby= ・ ]죄[/ruby][ruby= ・ ]수[/ruby]들."
10036095-37 = "그중에서도 누구보다 저와 마음이 잘 맞는 당신을 이 자리에서 잃는 건 피하고 싶으니까요."
10036095-38 = "아직 도망칠 수 있을 때, 부하들과 몸을 빼는 걸 권할게요."
10036095-40 = "아……. 히죽히죽 교수, 당신……."
10036095-41 = "[s] (히죽히죽 교수………라고?)"
10036095-47 = "……말이 많아졌군요. 제 조언은 여기까지입니다."
10036095-53 = "……흥."
10036095-54 = "좋습니다. 당신의 조언. 이번에도 가슴 깊이 새겨두도록 할까요."
10036095-55 = "여러분! 다소 안타까운 일이 되었지만, 이번에는 소녀가 봐 드리기로 하지요!"
10036095-56 = "헬멧단, 그리고 거기 있는 날다람쥐 양을 포함한 당신들! 얼굴 외웠습니다!"
10036095-57 = "부디 길에서 소녀와 마주치는 불상사를 피해주시길!"
10036095-58 = "그때엔 이번처럼 무사히 넘어갈 수 있으리란 보장이 없으니까요."
10036095-59 = "자, 그럼 불량배 여러분. 아직 움직일 수 있는 분은 동료를 부축해서, 퇴각하도록 하지요!"
10036095-60 = "네, 넵! 누님! 따르겠습니다!"
10036095-64 = "앗, 뭐, 뭐야! 저 녀석들! 쫓아!"
10036095-65 = "거기 서!!"
10036095-72 = "어, 엄청 빠르게 튀었는데요……."
10036095-73 = "[s1] \"엄청나게 갑작스러운 해프닝이었네…….\"\n[s2] \"따라갈 필요까진 없을 거 같지만.\""
10036095-78 = "[ns] \"그건 그렇고, 이쪽은…….\""
10036095-81 = "……."
10036095-82 = "……."
10036095-83 = "리더."
10036095-84 = "사오리 언니……."
10036095-88 = "저, 저기!"
10036095-93 = "축제는 어땠어, 아츠코?"
10036095-94 = "……응, 즐거웠어."
10036095-95 = "삿 쨩은?"
10036095-96 = "……나도, 즐거웠어."
10036095-98 = "……설마 서로를 계속 보고 있었을 줄이야."
10036095-99 = "DJ B.o.B의 태도가 바뀌었던 것도, 나도 모르게 물총 대회에서 우승한 것도 모두 너희가 한 일이었다니, 상상도 못 했다."
10036095-100 = "포장마차 음식도 사실은 사오리 언니가 사준 거였다니…… 게다가 우리가 놀고 있을 때 불량배들이 습격해 왔었다니, 전혀 몰랐어요……."
10036095-101 = "……그리고 이 모든 걸, 선생님은 알고 있었다 이거지."
10036095-102 = "[s3] \"서, 서프라이즈, 랄까……?\"\n[s4] \"그게……서로 사정이 있었으니까…….\""
10036095-105 = "[USERNAME] 선생을 탓할 수는 없지."
10036095-106 = "나도, 너희들도 선생에게 비밀로 해 달라고 했으니까."
10036095-107 = "선생은 약속을 지킨 것뿐이다."
10036095-108 = "따지고 보면 그렇긴 하지만…… 그래도 뭔가 약 오르는 느낌은 지울 수 없네."
10036095-109 = "그러면, 선생님은 우리 모두가 축제를 즐길 수 있도록 해준 거나 다름없네?"
10036095-110 = "[s] \"그렇게 볼 수도 있으려나……?\""
10036095-111 = "고맙다, 선생."
10036095-112 = "선생님, 고마워."
10036095-114 = "우리들의 여름을 지켜 줘서."
