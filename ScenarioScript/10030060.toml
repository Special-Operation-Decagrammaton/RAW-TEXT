[translation]
10030060-1 = "제6화;영혼을 위한 닭고기 전골"
10030060-4 = "……냄비가 달각거리고 있어."
10030060-5 = "좋은 냄새……"
10030060-7 = "선배, 우리가 재료를 손질하는 동안 먼저 요리를 하고 있었던 거야?"
10030060-8 = "다는 아니고 육수만. 육수를 우리려면 시간이 오래 걸리니까."
10030060-9 = "어디, 어디……"
10030060-15 = "어라? 냄비에는 다시마와 마른 버섯밖에 안 들어 있는데……"
10030060-16 = "아까 가져온 식재료 꾸러미 중에 닭고기도 있지 않았어?"
10030060-17 = "조금만 더 기다려. 고기는 아직 들어갈 차례가 아니거든."
10030060-22 = "국물이 우러나는 동안, 준비한 닭 날개와 정육은 한입 크기로 잘라 꼬치에 꿰고……"
10030060-26 = "숯불로 닭 껍질을 바삭하게 익힌 다음……"
10030060-28 = "불이 조금 강하지 않아? 이대로 계속 익히면 겉이 탈 것 같은데……"
10030060-29 = "괜찮아. 껍질만 살짝 굽는 게 목적이거든."
10030060-30 = "닭 껍질에 배어든 지방을 녹인 뒤에 그대로 냄비에 넣어서 국물에 중후한 기름 맛을 더하는 거야."
10030060-31 = "그리고 닭 육수가 충분히 우러나면 손질한 채소와 버섯을 넣고 한숨 푹 끓이면 돼."
10030060-32 = "[s1] \"닭고기와 채소를 넣어 맑게 끓인 전골이라……\"\n[s2] \"미즈타키를 만드려는 모양이네.\""
10030060-35 = "응, 정답이야. 선생님."
10030060-36 = "미즈타키……?"
10030060-37 = "닭고기를 주재료로 여러 가지 재료를 삶아서 만든 토속 전골 요리야."
10030060-38 = "일전에 D.U.에서 멀리 떨어진 곳에 위치한 통신사에 보안 자문을 하러 갔다가 우연히 맛보았는데, 생각보다 맛이 좋아서 혼자서도 종종 만들어 먹었거든."
10030060-39 = "추운 날 밖에서 다같이 캠핑을 한다면 카레나 스튜보다 따듯한 국물이 있는 전골이 좋을 것 같아서."
10030060-40 = "뭔가 재료도 평범하고, 수수해 보이는데……"
10030060-42 = "그래도 냄새만큼은 정말 좋네."
10030060-43 = "……어쩐지 갑자기 배가 고파지기 시작했습니다."
10030060-50 = "닭은 다 익은 것 같은데…… 이제 슬슬 먹어볼까?"
10030060-67 = "우선은 국물부터. 그리고 천천히 고기를 곁들여 먹어봐."
10030060-71 = "하아…… 따듯해……"
10030060-72 = "추운 곳에서 먹는 음식이라 그런지, 국물의 감칠맛이 더욱 진하게 느껴집니다……"
10030060-73 = "이 닭 날개도 씹을 때마다 육즙이 진하게 우러나서…… 진짜 맛있네!"
10030060-74 = "[s] \"심금을 울리는 감동적인 맛이야……\""
10030060-75 = "후후, 다들 마음에 들어 하는 것 같아서 다행이야."
10030060-76 = "사실 야외에서 만들어 본 것은 처음이라 잘 될까 걱정했었거든."
10030060-77 = "어쩐지 학원 근처의 전문점에서 먹는 것보다 훨씬 더 맛있는 것 같아."
10030060-78 = "시장이 반찬이라는 말도 있잖아? 하루 종일 열심히 밖에서 움직였으니 배가 고플 수밖에."
10030060-82 = "자, 그럼 이번에는 버섯과 당근, 그리고 두부를……"
10030060-83 = "아하하, 이것 봐! 이 못생긴 당근, 코타마 선배가 자른 거 아냐?"
10030060-84 = "읏…… 제, 제가 자른 당근은 이렇게 생기지 않았습니다."
10030060-85 = "좀 더 귀엽게 별 모양으로 자른 당근이……"
10030060-86 = "모양은 조금 이상해도 맛은 괜찮은걸. 채소에 배어든 닭 육수에서 깊은 맛이 느껴져."
10030060-87 = "[s] \"온몸에 스며드는 느낌이야……\""
10030060-91 = "어라? 벌써 다 건져 먹었나?"
10030060-92 = "어느새 냄비 속에 국물밖에 안 남았어~"
10030060-93 = "배는 충분히 채운 것 같지만…… 뭔가 아쉬운 느낌이군요."
10030060-95 = "걱정 마. 아직 마지막 재료가 남아 있으니까."
10030060-101 = "아직 재료가 남아 있다고? 아까 손질한 채소는 다 넣고 끓이지 않았어?"
10030060-105 = "건더기를 모두 먹었으면…… 마지막은 우동으로 마무리해야지."
10030060-106 = "아하, 미즈타키의 육수로 우동을 끓이는 거구나……!"
10030060-107 = "응. 게다가 오늘은 한 해의 마지막 날이기도 하니까."
10030060-108 = "해넘이 국수 없이 한 해를 마무리하는 건 조금 아쉽잖아?"
10030060-109 = "저녁 메뉴로 전골을 선택한 이유 중에는 이 마무리 우동을 먹을 수 있다는 점도 한몫했거든."
10030060-111 = "그러고 보니 작년에는 해넘이 국수를 먹지 않고 지나갔던 것 같네……"
10030060-112 = "한 해의 마지막 날이라고 해도 뭔가를 먹을 상황이 아니었으니까요."
10030060-113 = "맞아. <동부 평원 지대>에서 영혼의 한타를 해야 하는데, 뭘 먹을 시간이 어디 있겠어?"
10030060-115 = "너희들은 정말 한결같구나……"
10030060-119 = "우동은 금방 익었네. 퍼지기 전에 어서 먹자."
10030060-126 = "……이것도 진짜 맛있다!"
10030060-128 = "야외에서 이런 별미를 먹을 수 있을 거라고는 생각지도 못했는데."
10030060-129 = "이제야 뭔가 부족했던 부분이 채워지는 것 같습니다……"
10030060-130 = "[s] \"역시 전골 요리의 디저트라면 우동이지!\""
10030060-132 = "아, 우동까지 다 먹었으면 각자 먹은 그릇은 바로 치워줘."
10030060-133 = "음식 냄새를 맡고 야생 동물이 모여들 수도 있으니까, 설거지는 식사가 끝나자마자 바로 끝내야 하거든."
10030060-137 = "……역시 식사 후에도 게으름 부릴 시간은 없는 건가."
10030060-138 = "이대로 시간이 멈춰버렸으면 좋겠습니다……"
10030060-140 = "그건 안 돼! 인터넷도 안 되는 이 캠핑장에 계속 머무르라고?"
10030060-148 = "(이후, 베리타스 부원들과 함께 우동을 나누어 먹으며 즐거운 저녁 시간을 보냈다.)"
10030060-155 = "(식기 정리를 마치고, 모닥불 앞에서 시간을 죽이고 있노라니……)"
10030060-162 = "선생님……?"
10030060-168 = "아직 안 자고 있었구나."
10030060-169 = "[s3] \"아, 하레였구나.\"\n[s4] \"하레도 아까 자러 갔던 거 아니었어?\""
10030060-172 = "응. 식기를 정리한 뒤에 바로 자려고 했는데……"
10030060-173 = "어쩐지 잠이 안 와서."
10030060-174 = "마키는 베개가 바뀌어서 잠이 안 올 것 같다고 투덜대더니, 금방 잠이 들었어."
10030060-175 = "간만에 부지런히 돌아다니느라 피곤했었나봐."
10030060-176 = "……혹시 다른 부원들은 못 봤어?"
10030060-177 = "[s] \"치히로는 내일 일찍 일어나기 위해 먼저 들어간다고 했었고……\""
10030060-183 = "[ns] \"한 사람은 먼저 와서 기다리고 있는 것 같네.\""
10030060-188 = "……뜨끔."
10030060-189 = "[s] \"코타마. 숨어 있지 말고 슬슬 나와.\""
10030060-191 = "치잇…… 들키지 않을 줄 알았는데."
10030060-196 = "……코타마 선배? 언제부터 거기 숨어 있었던 거야?"
10030060-197 = "……아까 전부터 계속 기다리고 있었습니다."
10030060-198 = "여기 숨어 있으면 선생님과 하레가 나누는 은밀한 대화를 엿들을 수 있지 않을까 기대하고 있었는데……"
10030060-199 = "뭘 기대하고 있었던 거야?!"
10030060-203 = "[ns5] \"시간이 늦었으니 커피는 조금 그렇고……\"\n[ns6] \"코코아라도 한 잔 마실래?\""
10030060-208 = "응, 마실래."
10030060-209 = "감사히, 받겠습니다."
10030060-213 = "날이 추워서 그런가. 코코아도 평소보다 더 달콤하게 느껴지네."
10030060-214 = "피로한 몸에 스며드는 당분은 각별하군요."
10030060-215 = "응. 오늘은 정말 여러 가지 일이 있었으니까……"
10030060-216 = "[s] \"다들 이번 캠핑, 어땠던 것 같아?\""
10030060-217 = "음, 글쎄."
10030060-218 = "여러 가지 생각이 떠오르지만 한마디로 요약하자면……"
10030060-222 = "……별로였어."
10030060-224 = "힘들었습니다……."
10030060-225 = "[s] \"그렇게 바로 즉답?!\""
10030060-227 = "하지만 밖에서 의식주를 해결하려니 불편한 점 투성이였는걸."
10030060-228 = "날씨도 춥고, 의자도 불편하고……"
10030060-229 = "인터넷도 안 되고, 전자 장비도 쓰지 못하고……"
10030060-230 = "에너지 드링크도 오늘은 하루 종일 마시지 못했어……"
10030060-231 = "아, 그래도 저녁으로 먹은 전골은 맛있었습니다."
10030060-232 = "확실히 그건 그랬지만……"
10030060-233 = "준비하고 치우는 데 들어간 품을 생각하면, 맛있는 전골을 먹기 위해 일부러 캠핑을 나오고 싶지는 않아……."
10030060-234 = "베리타스가 추구하는 것은 진리이지, 지고의 미식이 아니니까요."
10030060-235 = "[s7] \"……그렇게 생각할 수도 있겠네.\"\n[s8] \"뭐, 휴일을 즐기는 방법은 다 제각기 다르니까.\""
10030060-240 = "하지만……"
10030060-245 = "생각했던 것 보다는 나쁘지 않았던 것 같아."
10030060-246 = "평소보다 자극이 덜하니, 평소에 신경 쓰지 않았던 현재에 더 집중할 수 있었거든."
10030060-247 = "새해를 밝히는 화려한 폭죽도, 거리를 가득 메운 인파도 볼 수 없었지만……"
10030060-248 = "정적에 가까울 만큼 고요한 산속에 있으니, 역설적으로 한 해의 마지막을 향해 달려가는 이 순간을 조금 더 깊이 곱씹어 볼 수 있었던 것 같아."
10030060-253 = "……올해도 다 끝나버렸네."
10030060-255 = "카운트다운이나 종소리 없이 조용히 맞이하는 신년이라니…… 뭔가 신기한 느낌이네요."
10030060-259 = "새해 복 많이 받아, 선생님."
10030060-260 = "올해도 잘 부탁드리겠습니다."
10030060-261 = "[s] \"두 사람도 새해 복 많이 받아.\""
10030060-265 = "하암……"
10030060-266 = "우린 먼저 들어가 볼게, 선생님."
10030060-267 = "내일 아침 일찍 일출을 보려면 조금이라도 눈을 붙여 두어야지."
10030060-268 = "선생님도 좋은 밤 되시길 바랍니다."
10030060-269 = "[s] \"응. 내일 보자.\""
10030060-275 = "(이후 불이 완전히 꺼질 때까지 모닥불 곁을 지키다 잠깐 잠을 청했다.)"
