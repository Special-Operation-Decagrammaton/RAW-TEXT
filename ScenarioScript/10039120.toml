[translation]
10039120-1 = "후일담;생활안전국이 축제에 참가하는 법"
10039120-10 = "키리노, 이야기 들었어?"
10039120-14 = "어떤 것 말씀이신가요! 양방향 단속 카메라 도입에 의한 도로교통법 개정이라면 이미 숙지하고 있습니다!"
10039120-15 = "아니…… 그런 게 있었어? 왜 난 몰랐지?"
10039120-16 = "어쨌든 그거 말고!"
10039120-17 = "이번에 트리니티에서 사육제를 한다나 봐."
10039120-22 = "앗, 말만 들어본 그 엄청난 규모의 축제 말씀이시군요! 오오……!"
10039120-23 = "좋아할 일은 아니야. 이런 대형 행사 있을 때마다 생활안전국에서 인원 차출해서 치안 관리하는 게 일상이니까."
10039120-24 = "그 말인즉슨, 우리가 파견된다 이거지."
10039120-25 = "시민의 안전을 지키는 것이야말로 우리의 의무니까요! 어떤 임무든 오케이입니다!"
10039120-26 = "항상 대책 없이 긍정적이란 말이야. 난 생각만 해도 귀찮아서 눈물이 찔끔 나왔는데."
10039120-27 = "귀찮다고 생각하면 한없이 귀찮아지는 법이잖아요? 그럴 때는 생각을 줄여요!"
10039120-28 = "으응…… 생각하는 것도 귀찮아……"
10039120-36 = "안녕하심까~! 혹시 이번에 <트리니티 사육제>에 파견되는 인원 계신가요?"
10039120-37 = "아, 저희입니다!"
10039120-38 = "오, 수고하시네요. 그럼 이 의상 전달드리고 가겠습니다."
10039120-39 = "예? 의상이요?"
10039120-40 = "뭔지는 저도 잘 몰라요. 파견 인원에게 전달해 달라길래."
10039120-44 = "그럼 이만~! 고생하십셔~!"
10039120-49 = "이게 뭐지?"
10039120-54 = "'사육제 파견 인원용 의상'……?"
10039120-55 = "뭐야. 그런 것도 있다고? 일단 꺼내보자."
10039120-58 = "(잠시 후……)"
10039120-63 = "잠깐……!! 이 의상, 뭐야?!"
10039120-64 = "우리 임무는 안전 관리 및 시민 안내인데 이런 화려한 복장이 왜 필요해?? 생활안전국의 유니폼이면 충분하잖아?!"
10039120-65 = "그, 글쎄요……"
10039120-69 = "뭔가 행정 착오?! 그런 거 아닐까요? 발키리 내에서는 흔히 있는 일이니까……"
10039120-70 = "정말 그런 건지 높으신 분에게 한번 따져봐야겠어!"
10039120-71 = "높으신 분이라면……?"
10039120-76 = "공안국장입니다. 무슨 일이십……"
10039120-80 = "아. 생활안전국인가."
10039120-81 = "국장! 이게 대체 무슨 일인지 설명이 필요해!"
10039120-85 = "그 복장은 대체……"
10039120-86 = "우리한테 갑자기 이런 의상이 전달되었다고! 이거 뭐 <트리니티 사육제>랑 관련 있는 거야?"
10039120-87 = "음? 그게 무슨……"
10039120-92 = "아."
10039120-93 = "아아…… 그런 거였군……"
10039120-94 = "뭐지?! 뭔가 알고 있는 눈치?"
10039120-96 = "구, 국장님! 이 복장, 우리가 입는 게 맞나요?"
10039120-101 = "……제군. 사실 이번 건은 생활안전국 지원과 관련이 있다."
10039120-106 = "예? 그게 무슨……"
10039120-108 = "생활안전국에서 활용할 지원 용품과 간식 일체를 민간업체로부터 제공받는 조건으로, 이번 <트리니티 사육제>에 파견되는 인원은 특별한 복장을 착용하는 것으로 이야기가 됐지."
10039120-109 = "그게 그 복장인가 보군."
10039120-115 = "민간업체의 홍보 겸, 평소 위태위태하던 발키리의 이미지를 좀 더 친숙하게 변화…… 라는 취지다."
10039120-117 = "바, 발키리의 이미지 변화가 우리 어깨 위에 달려있는 건가요!"
10039120-118 = "의상이랑 관계없이 너무 중대한 책임 아냐?"
10039120-119 = "아니, 그보다 그동안 쌓아온 이미지가 이런 옷 정도로 변하겠냐고!"
10039120-121 = "생각보다 잘 어울리는데…… 괜찮지 않나."
10039120-122 = "그러게요. 이 의상, 보다 보니 조금 귀여운 것 같기도……"
10039120-123 = "아무튼 그렇게 됐다. 높으신 분들의 결정이라, 나도 어떻게 해줄 수가 없군. 미안하다."
10039120-124 = "국장, 자기가 입는 거 아니라고 너무 쿨하잖아!"
10039120-128 = "앗, 통신이 불안정하…… 지직…… 은……"
10039120-133 = "여보세요? 여보세요?!"
10039120-137 = "안 들리는 척하고 끊었어! 치사하게!!"
10039120-138 = "으음…… 어쨌든 우리가 입어야 하는 의상은 맞았네요."
10039120-139 = "차출된 것도 귀찮은데, 이런 귀여운…… 거추장스러운 복장까지 하라니. 이건 말이 안 돼."
10039120-140 = "하란다고 다 하면 안락하고 게으른 생활은 없어지는 거라고. 보이콧이다!!"
10039120-144 = "(그리고 사육제 당일……)"
10039120-158 = "……"
10039120-159 = "……"
10039120-164 = "저, 혹시 화장실은 어느 쪽에 있나요?"
10039120-169 = "왼쪽으로 돌아가시면 복도 끝에 있습니다!"
10039120-171 = "앗, 감사합니다."
10039120-178 = "안녕하세요! 혹시 2부 참가자 대기실은 어디로 가야 하는지 아시나요?"
10039120-179 = "2부 참가자 대기실은 204호부터 212호까지입니다! 오른쪽으로 돌아서 올라가시면 돼요!"
10039120-180 = "아하, 감사합니다. 그럼 수고하세요."
10039120-181 = "천만에요. 좋은 결과 있으시길 바랄게요!"
10039120-186 = "아까부터 뭘 그리 자연스럽게 안내하고 있는 거야…… 우리도 참가팀인데."
10039120-191 = "시민분들께 길안내 드리던 자세가 몸에 배었다보니, 저도 모르게 그만……"
10039120-192 = "그런데 방금 그분, 아이돌 콘테스트에 기모노라니. 신기한 복장이네요."
10039120-193 = "도넛 가게 홍보복을 입은 우리만큼 신기하겠어?"
10039120-194 = "에잇, 결국 입게 될 거였으니까 조금이라도 좋게 생각하자구요."
10039120-195 = "으으…… 어떻게 좋게 생각할 수 있단 말이야?"
10039120-196 = "계약 기간 동안 업체로부터 무제한 간식을 제공받기로 했으니까, 그걸로라도……"
10039120-197 = "아, 그리고 신제품들도 가장 먼저 맛볼 수 있다고 하잖아요."
10039120-198 = "그건 확실히 나쁜 일은 아니지만……"
10039120-199 = "그 민간업체가 하필 단골인 '마스터 도넛'일 줄이야…… 후우…… 이래서야 거절할 수가 없잖아……"
10039120-200 = "자, 힘내서 가보자구요! 질서와 치안 유지를 위해! 그리고 우리의 실적을 위해!"
10039120-201 = "귀찮아아……"
10039120-208 = "참가자 확인하겠습니다. '프리티 도넛 폴리스 걸즈' 팀 계신가요?"
10039120-213 = "앗, 저희예요."
10039120-214 = "진짜 적응 안 되는 그룹명이야."
10039120-215 = "그래도 정식 출전이 아니라 중간에 공익 광고 형식으로 진행하는 짧은 무대라 그나마 다행이지."
10039120-216 = "짧지만 중요하다고요? 안전 수칙을 전달하는 가사와 안무니까!"
10039120-217 = "그만큼 열심히 연습했잖아요, 후부키!"
10039120-218 = "그건 그거고 부끄러운 건 부끄러운 거야…… 이런 것까지 시키다니……"
10039120-224 = "하아, 긴장해서 위가 아파."
10039120-225 = "이런, 큰일이네요. 심호흡이라도……"
10039120-230 = "성함 확인하겠습니다. 나카츠카사 키리노 님?"
10039120-234 = "네! 본관…… 아니, 접니닷!"
10039120-236 = "네무가키 후부키 님?"
10039120-238 = "네에, 네에……"
10039120-243 = "도, 도와주세요……"
10039120-245 = "네에……"
10039120-254 = "으앗, 깜짝이야! 여기 마스코트 사이에 누가 있는데?!"
10039120-255 = "뭐, 뭔가요! 괜찮으십니까?!"
10039120-265 = "으아앗…… 가, 감사합니다……"
10039120-266 = "어, 어쩌다가 그쪽에 끼어계셨던 거예요?"
10039120-267 = "그, 그게…… 곧 리허설인데 너무 긴장이 되어서요……"
10039120-268 = "눈에 띄지 않게 인형 뒤에 숨어서 심호흡을 하고 있었는데, 떨어진 폰을 주우려다……"
10039120-269 = "하마터면 공연하기도 전에 일이 생길 뻔했네요……"
10039120-270 = "덕분에 무사할 수 있었어요. 정말 감사드려요."
10039120-271 = "혹시 두 분도 콘테스트에 참가하시는 건가요?"
10039120-276 = "아, 저희는……"
10039120-277 = "말하자면 복잡하니까, 그럴 만한 사정이 있었다는 걸로 하자구."
10039120-278 = "……그렇게 됐어요!"
10039120-280 = "그, 그렇군요…… 세상에는 참 많은 일들이 있는 법이지요……"
10039120-281 = "오늘도 평화를 위해서……"
10039120-286 = "그렇지. 그때는 고마웠어."
10039120-287 = "대활약이었지요!"
10039120-289 = "후후, 키보토스의 안전을 지켜주시느라 항상 고생 많으세요."
10039120-290 = "그럼, 멋진 무대 기대하고 있겠습니다. 또 뵙길 바랄게요."
10039120-291 = "넵! 저희도 기대하고 있겠습니다! 힘내세요!"
10039120-297 = "귀엽네, 시스터 씨."
10039120-298 = "그러게요. 시스터후드도 우리처럼 이미지를 바꾸고 싶은 걸까요?"
10039120-299 = "다들 노림수가 비슷하잖아? 경직된 이미지 전환을 위한 아이돌 의상이라……"
10039120-300 = "뭐, 지금 우리는 생활안전국이 아니라 도넛 가게 이미지를 대표하고 있지만."
10039120-301 = "하하…… 그렇긴 한데……"
10039120-305 = "그러고 보니 후부키, 긴장이 좀 풀린 것 같네요."
10039120-309 = "어? 그러게. 지금은 괜찮은 것 같아."
10039120-310 = "아까 그 시스터랑 이야기하고 나니까 이상하게 긴장이 좀 풀린 느낌이야."
10039120-311 = "시스터 분들은 종종 고해성사도 받아준다니까, 좋은 상담사일지도 모르겠네요."
10039120-316 = "……걸즈!"
10039120-317 = "'프리티 도넛 폴리스 걸즈'! 안 계시면 다음 팀으로 넘어갑니다!"
10039120-321 = "아앗!! 여기! 여기 있습니다!"
10039120-322 = "준비하세요, 후부키! 우리 차례예요!"
10039120-323 = "하아…… 결국 이 시간이 오고야 말았어……"
10039120-324 = "일어서야 움직이죠!! 어서요!"
10039120-325 = "네에, 네에……"
10039120-337 = "(생활안전국의 두 사람이 홍보를 겸한 도넛 가게의 매출은, 사육제 이후 두 배 이상 폭등했다고 한다.)"
