[translation]
212140-1 = "第14話;叛徒們"
212140-6 = "這裡是很少有人來往的地方。"
212140-7 = "校內很危險，盡量在不顯眼的地方活動比較好吧……"
212140-8 = ""
212140-12 = "可惡，可惡！"
212140-13 = "居然只能眼睜睜看著老師在面前被帶走……這樣我還算什麼風紀委員會啊……！"
212140-14 = "冷靜一點，伊織。#n老師早就預料到了不是嗎？"
212140-15 = "所以老師才會事先把任務交給我們。"
212140-16 = "老師說過吧。#n核心消失之後，他們才會放鬆戒心。"
212140-17 = "我們四散開來、各自回到自己的戰場，反而才是作戰的開始。"
212140-18 = "話是這麼說沒錯……！"
212140-19 = "我的心，我的心都快碎了啦……"
212140-21 = "這點我們大家都一樣。"
212140-22 = "所以才要狠狠回敬他們一記啊。#n大家都還記得自己該做的事吧？"
212140-23 = ""
212140-26 = ""
212140-27 = "首先，是盡可能招募想法相同的人吧。"
212140-28 = "我會去招募和我們想法相同的風紀委員。#n應該不是所有人都陷入了瘋狂。"
212140-29 = "我也會在萬魔殿和想法相近的人接觸。"
212140-30 = "就算沒有幹部的權限，除了3年級以外應該都能說服。"
212140-32 = "我們也一樣，會小心不讓人發現的。"
212140-34 = "還有最重要的是……完成皐月前輩的干擾頻率吧。"
212140-35 = "不管我們再怎麼吸引目光、聚集人手，要是解不開洗腦也無濟於事……#n前輩你沒問題嗎？"
212140-36 = "呵呵……交給我吧。#n在奇普托斯，應該沒有人比我更深入挖掘雷帝的研究了。"
212140-37 = "好。我相信你。"
212140-38 = "後輩們都這麼努力了。#n身為唯一的3年級，可不能丟臉呢。"
212140-39 = "而且要是我沒能做到，真琴醬就會一直那個樣子吧。#n我可不想看到那種模樣。"
212140-40 = "是啊。我也是。"
212140-42 = "然後到了行動當天，就由我們打開通往廣播室的路。"
212140-43 = "雖然戒備森嚴，但我會想辦法的。"
212140-44 = "特別要注意的是，盡可能避開風紀委員會和萬魔殿前輩們的監視來活動。"
212140-45 = "萬一被發現的話……應該不會有好下場吧。"
212140-47 = "……有可能會被當成格黑娜的叛徒而吃盡苦頭，就算運氣好一點也得被拘禁吧。"
212140-48 = ""
212140-51 = ""
212140-52 = "真的會做到那種地步嗎？"
212140-54 = "你也聽到委員長的警告了吧……那個表情，是什麼事都做得出來的眼神。"
212140-55 = "不能把現在的陽奈委員長當成以前的他來看。"
212140-57 = "那萬一風紀委員長在作戰中出現，該怎麼應對……？"
212140-58 = ""
212140-61 = ""
212140-62 = "唉……老實說根本沒辦法。"
212140-63 = "要是委員長親自出馬，不管我們有多大的覺悟都會在轉眼間被收拾掉。"
212140-65 = "就是那麼壓倒性的武力嗎……"
212140-66 = "現在戰爭準備已經進入收尾階段了。#n我們要做什麼的話，就必須在戰爭爆發之前進行。"
212140-67 = "唔嗯。得在準備完成前盡可能拖延時間才行……"
212140-68 = "我們會盡可能把風紀委員會的彈藥與補給物資審核程序弄亂，好讓日程出現延誤。"
212140-69 = "而且雖然不在這裡，但除了我們之外也有抱持相同想法的學生。"
212140-70 = "其中最具代表性的是……"
212140-77 = ""
212140-78 = ""
212140-80 = ""
212140-81 = ""
212140-82 = "我不做！！也做不到！！！"
212140-83 = ""
212140-86 = ""
212140-87 = "什麼！？為什麼！"
212140-88 = "只不過是準備補給而已吧！"
212140-89 = "明明跟你們供給部一直在做的事沒什麼差別，為什麼做不到？"
212140-90 = "要你們在三天之內準備好供應格黑娜所有部隊的戰鬥口糧，是那麼無理的指示嗎？"
212140-92 = "三天？你在開玩笑嗎！？格黑娜全體有多少人，居然要我們兩個人在三天內做完？#n你們連數字都不會算嗎！？"
212140-93 = "只要有效率地行動應該做得到。#n我們已經把所有訓練行程都切割成以1分鐘為單位……"
212140-94 = "那是你們的事！料理可不是數學！"
212140-95 = "好吧，給我聽清楚了。#n我就告訴你們3天內無法完成供給的技術性理由。"
212140-96 = "第一，我們現在沒有足以應付的設施。"
212140-97 = "我們現在24小時不停地製作戰鬥口糧用的高熱量蛋白棒，主閥門都快爆了。"
212140-98 = "只要再多加一個循環，爆炸的烤箱就會把整棟供餐大樓炸飛，這樣還要做嗎？"
212140-99 = ""
212140-101 = ""
212140-104 = ""
212140-105 = "剛，剛才烤箱裡開始傳出奇怪的聲音……#n聽起來像是野獸的叫聲……是不是我最後碰到的地方出問題了……？"
212140-107 = "叫聲……？不是，從烤箱裡面……？"
212140-108 = "那個先放一邊！第二，是保存性的問題。"
212140-109 = "你們要求的菜單，大部分都是在常溫下很容易腐敗的餐點耶？"
212140-110 = "就這樣帶出去別說是戰爭，全校學生大概後天就會因為食物中毒全軍覆沒了。"
212140-111 = "如果你們想毒死格黑娜所有人就繼續堅持吧！"
212140-112 = "那，那倒不是……"
212140-113 = "最後，是人手不足。"
212140-114 = "就算我們兩個人熬夜準備補給，也不可能煮出平常8倍以上的量。#n物理上就辦不到！！"
212140-115 = ""
212140-120 = ""
212140-121 = "啊！剛才用剩下的食材做的飯糰活過來了……#n它現在正在把倉庫裡的緊急糧食吃光……！"
212140-122 = "怎，怎麼辦？部長……！！"
212140-124 = "看到了吧？光是用物理方式消滅那個再消毒倉庫，至少就要花上三天。"
212140-125 = "三，三天！？要是議長知道了，絕對不會放過我們的……！"
212140-126 = "那你們自己來做啊！#n以現在的狀態，你們要求的補給日程打死我們都趕不上！"
212140-129 = ""
212140-130 = "唔唔，沒想到居然會有這種伏兵……"
212140-131 = "我們忽略了補給的重要性呢。#n這樣下去，整體日程都會出現延誤。"
212140-132 = "現在有什麼解決辦法？#n從最快的手段開始報告！"
212140-133 = "既然如此……！！"
212140-136 = ""
212140-137 = ""
212140-139 = ""
212140-141 = ""
212140-142 = "所以，我們就被緊急派來當協助供給部的人手了～！！"
212140-143 = ""
212140-145 = ""
212140-146 = "你們根本不會做菜吧！？"
212140-147 = "哎呀呀！"
212140-148 = "哎呀呀個頭啊！！"
212140-151 = "（時間流逝……）"
212140-154 = ""
212140-155 = "嗯，這裡的麵粉都過篩好了～！"
212140-156 = "哇！動作真快！那我拿過去揉麵團！"
212140-157 = ""
212140-159 = ""
212140-161 = "切洋蔥的任務……這點程度輕而易舉。"
212140-162 = "按照規定的尺寸，連1mm的誤差都不能有……"
212140-163 = ""
212140-165 = ""
212140-166 = ""
212140-167 = "哈啊，對眼睛真刺激呢。不過……"
212140-168 = "這一切準備都不能馬虎……唔。"
212140-169 = "羽留奈，你做得雖然比我想像中好很多……但你為什麼要這麼拚命？"
212140-170 = "哎呀，那當然是……"
212140-171 = "（吸）"
212140-172 = ""
212140-174 = ""
212140-175 = "為了完美的格黑娜呀。"
212140-176 = "那是什麼意思？"
212140-177 = "風華同學，你還沒察覺到嗎？#n那股在血液中活生生跳動著的、對征服的渴望。"
212140-178 = "我們至今都被名為美食的迷妄所囚禁，#n但現在不是有了征服奇普托斯這個具體的目標嗎？"
212140-179 = "通往勝利的道路，就從我們手中開始。"
212140-180 = ""
212140-182 = ""
212140-183 = ""
212140-184 = "唔。"
212140-185 = "當然，連準備過程都要用心才對吧？"
212140-186 = "……"
212140-187 = "呵呵，真期待統一奇普托斯的那一天呢。#n到時候也不必再為了偷黃金鮪魚而引發學園之間的紛爭了吧。"
212140-188 = "在受控的秩序下感受到的幸福，或許比不確定的美食還要愉快呢。"
212140-189 = "來，為了那一天加油吧★"
212140-190 = ""
212140-192 = ""
212140-193 = "那兩個人，總覺得變得有點奇怪。#n啊，雖然平常就很奇怪了啦……不過該怎麼說呢。"
212140-194 = "……簡直就像變了個人似的吧？"
212140-195 = "啊，嗯。沒錯。換作以前應該根本不會在意的……該說是突然變得太愛格黑娜了嗎。"
212140-197 = "最近羽留奈和亞伽里好像有比美食更重要的東西了。#n你知道為什麼嗎？"
212140-198 = "……因為現在的格黑娜變得有點不對勁。"
212140-199 = "我比較喜歡有各種味道的世界……"
212140-200 = "如果像他們兩個說的那樣，整個世界都變成格黑娜，其他的味道不就會消失了嗎？"
212140-201 = "唔唔……我不要那樣。"
212140-202 = "而且要是爆發戰爭，我努力記下來的那些好吃的店也會受到波及。"
212140-203 = "可能會買不到食材，或者會有炸彈掉下來，店家也可能會關門。"
212140-204 = "明明還有好多地方都還沒去過……"
212140-205 = ""
212140-207 = ""
212140-208 = "得想辦法不讓戰爭爆發才行呢。#n不然就是要盡可能拖延。"
212140-209 = ""
212140-212 = ""
212140-213 = "該，該怎麼做？"
212140-214 = "軍隊沒有補給就沒辦法打仗。"
212140-215 = "而整個格黑娜的補給是由我們負責的。"
212140-216 = "……只要我們搞砸就行了吧？"
212140-217 = ""
212140-219 = ""
212140-221 = "沒錯。"
212140-223 = ""
212140-224 = ""
212140-226 = ""
212140-227 = "本，本大人都親自把格黑娜最強的美食專家派去當人手了！"
212140-228 = "為什麼補給物資的產量反而砍半了！！"
212140-229 = ""
212140-231 = ""
212140-232 = "那，那個……他們只說料理不是1+1……！"
212140-234 = "唔，雖然很想反駁那句話，但我對大量烹調不太了解，實在令人痛心……！"
212140-235 = "沒想到以前把所有供餐流程都交給供給部全權負責，居然會在這種時候被扯後腿！！"
212140-236 = "真琴議長，這看起來不單純是人手之間的配合問題。"
212140-237 = "什麼！？這是什麼意思，天雨亞子首席行政官！"
212140-238 = "……是怠工吧。"
212140-239 = "您應該知道那些反對合而為一的格黑娜之人的組織性行動吧。"
212140-240 = "這件事恐怕也該從類似的角度來看待。"
212140-241 = "……被視為核心的老師應該已經拘禁了才對。"
212140-242 = "雖然我個人也覺得很遺憾，但山中的火即使撲滅了，地底下也還會殘留火種。"
212140-243 = "那該怎麼辦才好！要是對供給部部長愛清風華施以懲處……！"
212140-244 = ""
212140-248 = "不。那對解決目前的狀況完全沒有幫助。"
212140-249 = ""
212140-251 = ""
212140-252 = ""
212140-256 = ""
212140-257 = "因為沒有人能像風華同學那樣，在短時間內掌控如此大規模的供餐。"
212140-258 = "風華同學也是明白這一點，才會像現在這樣行動的吧。"
212140-260 = "……說的沒錯。#n如果現在懲處供給部，整個格黑娜的補給體系就會完全崩潰。"
212140-261 = "那你們到底想怎樣？難道有什麼防止怠工的手段嗎？"
212140-263 = "老實說，我想不到那樣的方法呢。"
212140-264 = "我也一樣。#n風華同學和茱莉同學，其實意外地頑固呢。"
212140-266 = "無法替代的人才，還真是棘手的對手呢……"
212140-267 = "唔，本大人提起這件事不是為了聽這種話！#n我是要你們拿出解決方案！"
212140-268 = "追根究柢，這難道不是你至今都沒有培養供給部替代人手的失誤嗎？"
212140-269 = "吵死了～！！"
212140-270 = "暫時就以擴大我們美食研究會的監視範圍與時間來應對吧。"
212140-271 = "呼……我知道了，你們退下吧。"
212140-272 = "對供給部的物理威脅或接觸，只會讓事態更加惡化……還請務必牢記這點，呵呵。"
212140-273 = "哼，你們美食研才是供給部的威脅本身吧？#n關於炸毀餐廳和強行綁架供給部部長的報告，我早就收到不知道多少次了。"
212140-274 = "那些都是為了美食而不得不採取的行動。#n不過既然現在有了更遠大的目標，就不能再像以前那樣行事了。"
212140-276 = "而且會對供給部做那種事的，有我們就夠了哦？#n可不能讓其他人也做那種事呢★"
212140-277 = "……真是荒唐。"
212140-278 = "亞子首席行政官。#n如果目前的情況持續下去，距離預定的開戰時間點會延誤多久？"
212140-279 = "……至少要多花上以週為單位，長則以月為單位的時間吧。"
212140-280 = "……這可不行。"
212140-281 = "在這場征服戰爭中，時間明明是最大的資產。"
212140-282 = ""
212140-286 = ""
212140-287 = "我也有同感。"
212140-288 = "在聯邦學生會和其他學園察覺之前一舉掃蕩的閃電作戰……目前來說是不可能的。"
212140-289 = "其實現在就已經存在不安因素了。#n時間拖得越久就越是如此。"
212140-290 = "雖然已經有在管控SNS的連線網路，但偶爾還是會有發文成功的案例。#n就算有進行追蹤和刪除……"
212140-291 = ""
212140-293 = ""
212140-294 = "……"
212140-296 = "如果難以進軍與占領，那就得用別的方法。"
212140-297 = ""
212140-299 = ""
212140-300 = ""
212140-301 = "……什麼方法？"
212140-302 = ""
212140-304 = ""
212140-306 = ""
212140-307 = ""
212140-308 = "先將其摧毀，再於灰燼之上建立新的秩序。"
212140-309 = "摧毀……是說整個奇普托斯嗎？要怎麼做？"
212140-310 = "嘰嘻嘻，非常簡單。"
212140-311 = "只要一發就能把D.U.中心地區化為焦土的化學彈──如果有好幾十發的話呢？"
212140-312 = ""
212140-314 = ""
212140-315 = "那該不會是……"
212140-316 = "沒錯。就是把雷帝其中一項戰略兵器的設計復原。"
212140-317 = "不會花很多時間嗎？"
212140-318 = "嘰嘻嘻，再簡單不過了。因為那全部都記在這顆腦袋裡。"
212140-319 = "……真了不起。"
212140-320 = "我們至今為止都只從占領的角度來思考……但是既然情況有變，手段也得跟著改變。"
212140-321 = "光憑部分人的怠工，絕對阻止不了這場崇高的聖戰。"
212140-322 = ""
212140-324 = ""
212140-327 = ""
212140-328 = "格黑娜的底蘊真是驚人呢。#n我都不知道還有那樣的東西。"
212140-329 = "嘻嘻。只是沒有刻意展現出來，也沒有刻意去做罷了。"
212140-330 = "然而，既然已經明白我們一直以來守住的底線毫無意義，#n那樣的限制不就跟不存在一樣了嗎？"
212140-331 = "本大人保證，擁有合而為一的秩序這個目標的格黑娜是最強的。"
212140-332 = "是的。現在的格黑娜比任何事物都還要強大。"
212140-333 = "兵器一準備完成就立即開戰，所有人保持警戒原地待命。"
212140-335 = "我知道了。#n亞子，把和原本計畫有變更的部分整理好告訴我。"
212140-336 = "是，委員長。我會在一小時後向您報告。"
212140-338 = ""
212140-339 = "……"
212140-341 = "下一話;擬定作戰"
