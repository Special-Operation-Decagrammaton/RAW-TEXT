[translation]
212140-1 = "第14話;反逆者たち"
212140-6 = "ここなら人通りは少ないよ。"
212140-7 = "校内は危ないし、できるだけ目立たない場所を動いた方がいいっしょ？"
212140-8 = ""
212140-12 = "くそっ、くそっ！"
212140-13 = "先生が連れてかれるのに、黙って見てるしかなかった……#nこんなんじゃ風紀委員失格じゃんか……！"
212140-14 = "落ち着いてください。この事態も先生は予測していたじゃないですか。"
212140-15 = "だからこそ、前もって私たちに役割を託されたんです。"
212140-16 = "……先生、言ってましたよね。支柱が消えれば、向こうは油断するって。"
212140-17 = "私たちがそれぞれの役目に戻ることこそ、作戦の始まりだって。"
212140-18 = "それはそうだけどさ……！"
212140-19 = "そんな簡単に割り切れないって……。"
212140-21 = "……みんな同じだよ。"
212140-22 = "だからこそ、きっちり1発食らわせてやんないと。#nみんな、自分の仕事はちゃんと覚えてるよね？"
212140-23 = ""
212140-26 = ""
212140-27 = "まずは仲間集めよね。"
212140-28 = "風紀委員会は私が受け持ちます。全員が呑まれているわけではないはずですから。"
212140-29 = "こちらも、似た考えを持っていた子たちに接触してみます。"
212140-30 = "3年生以外なら説得できるはずです。"
212140-32 = "私たちも目を付けられないように気をつけるね。"
212140-34 = "とはいえ、肝心要は妨害周波数の完成です。"
212140-35 = "私たちがどれだけ人を集めても、洗脳を解けなければ全部無駄になりますけど……#nサツキ先輩、大丈夫なんですか？"
212140-36 = "ふふ……任せて頂戴。#n雷帝の研究に関して私の右に出る人なんていないはずだもの。"
212140-37 = "はい。よろしくお願いします。"
212140-38 = "それに後輩たちがこんなに頑張っているんだもの。#n唯一の3年生として、情けないところは見せられないでしょう？"
212140-39 = "あんなマコトちゃんも見ていたくないものね。"
212140-40 = "……同感です。"
212140-42 = "決行日になったら、放送室へ向かう道を私たちが切り開く。"
212140-43 = "警備は厳重だけど、何とかしてみせるよ。"
212140-44 = "風紀委員と万魔殿の先輩方の監視には特に注意してください。"
212140-45 = "もしも発覚すれば……穏便には済まされないでしょうね。"
212140-47 = "反逆者扱いの後にひどい目に遭うか……運が良くても拘束でしょうね。"
212140-48 = ""
212140-51 = ""
212140-52 = "そこまでしてくるかな？"
212140-54 = "委員長の警告、聞いたでしょ……。あれは何でもやる目だった。"
212140-55 = "今のヒナ委員長を、昔と同じだと思ってはいけません。"
212140-57 = "思ったり考えたりは自由だけど、作戦の最中に鉢合わせたらどうするの？"
212140-58 = ""
212140-61 = ""
212140-62 = "……はぁ。正直、止める術はない。"
212140-63 = "ヒナ委員長が出てきたら、私たちの覚悟なんて関係なく一瞬で片づけられます。"
212140-65 = "やっぱ圧倒的なんだね……。"
212140-66 = "ゲヘナの攻撃準備はすでに最終段階です。#n戦端が開かれる前に動かなければ意味がありません。"
212140-67 = "準備をどうにか引き延ばせないかな……。"
212140-68 = "風紀委員会側の弾薬と補給物資の承認手続きを可能な限り遅らせます。#n多少なり日程に支障を出せるように。"
212140-69 = "同じ考えの生徒は、この場以外にもいますから。"
212140-70 = "代表的なのは――"
212140-77 = ""
212140-78 = ""
212140-80 = ""
212140-81 = ""
212140-82 = "やりません！！無理です！！"
212140-83 = ""
212140-86 = ""
212140-87 = "なぜだっ！？"
212140-88 = "補給を用意するだけの簡単な話じゃないか！"
212140-89 = "給食部が日常的にやっていたことと大差ないだろう。"
212140-90 = "その通りだ。ゲヘナ全体を賄う戦闘食を用意しろという指示が無茶だとでも？"
212140-92 = "無茶ですよ！ゲヘナ全体って何人いると思ってるんですか！？#nしかもそれを3日でやれって？算数すらできないんですか！？"
212140-93 = "効率的に動けば可能な計算だ。こちらはすでに訓練スケジュールを分単位で――"
212140-94 = "それはそっちの事情でしょう！？無理なものは無理です！"
212140-95 = "分からないのなら今から説明します。"
212140-96 = "第一に、設備が足りません。"
212140-97 = "すでに24時間ぶっ通しで高カロリープロテインバーを作ってるんです。"
212140-98 = "ここでもう1サイクル追加したら、オーブンが爆発して建物ごと吹き飛びますけど、#nそれでもやります？"
212140-99 = ""
212140-101 = ""
212140-104 = ""
212140-105 = "さ、さっきからオーブンの中で獣の唸り声みたいな音がし始めてて……#n私が触ったのがまずかったんでしょうか……？"
212140-107 = "唸り声……？オーブンの中で……？"
212140-108 = "それはひとまず置いておくとして。#n第二に、保存の問題です。"
212140-109 = "いま要求されているメニュー、常温だと大半はすぐ傷んでしまいます。"
212140-110 = "仮に作れたとして、このまま持ち出したら食中毒で全滅します。"
212140-111 = "それがお望みならご自由にどうぞ！"
212140-112 = "そ、それは違うが……。"
212140-113 = "最後に、人手不足です。"
212140-114 = "2人が徹夜でフル稼働したって、普段の8倍を超える量なんて調理できません。#n物理的に無理です！"
212140-115 = ""
212140-120 = ""
212140-121 = "ぶっ、部長！さっき残り物で作ったおにぎりが生き返って……#n倉庫の非常食を食い荒らし始めてます……！"
212140-122 = "ど、どうしましょう！？"
212140-124 = "見ましたよね？あれを駆除して倉庫を消毒するだけで最低でも3日はかかります。"
212140-125 = "3日！？議長に知られたらただじゃ済まないぞ……！"
212140-126 = "だったら自分たちでやったらどうですか！#nもう分かったでしょう？あなたたちの要求には死んでも合わせられません！"
212140-129 = ""
212140-130 = "くっ、こんな伏兵がいるとは……。"
212140-131 = "補給の重要性を見誤っていましたね。#nこのままでは全体のスケジュールに支障が出ます。"
212140-132 = "今すぐ取れる善後策はあるか？"
212140-133 = "でしたら――！！"
212140-136 = ""
212140-137 = ""
212140-139 = ""
212140-141 = ""
212140-142 = "というわけで、給食部の補助要員として参りました。"
212140-143 = ""
212140-145 = ""
212140-146 = "あんたたち料理できないでしょ！？"
212140-147 = "そういえばそうでしたわね？"
212140-148 = "じゃあなんで来たのよ！？"
212140-151 = "（しばらくして……）"
212140-154 = ""
212140-155 = "小麦粉、ふるいにかけたよ～！"
212140-156 = "わぁ！すっごく早いですね！#nここからは私が生地にするのでバトンタッチです！"
212140-157 = ""
212140-159 = ""
212140-161 = "玉ねぎを刻む任務……この程度、造作もないですわ。"
212140-162 = "規定のサイズ通りに、1ミリの誤差もなく……。"
212140-163 = ""
212140-165 = ""
212140-166 = ""
212140-167 = "はあ、沁みますわね……ぐすっ。ですが……。"
212140-168 = "準備を疎かにはできません……うぅっ。"
212140-169 = "ハルナ、思いのほかやれてるけど……なんでそんなに必死なの？"
212140-170 = "あら、それはもちろん――"
212140-171 = "ぐすっ。"
212140-172 = ""
212140-174 = ""
212140-175 = "完璧なゲヘナのためですわ。"
212140-176 = "え、なにそれ。"
212140-177 = "お気づきになりませんか？血の中に脈打つ、戦いへの渇望を。"
212140-178 = "私たちは美食に囚われ、無軌道に日々を浪費しておりました。#nけれど今は明確な目標が生まれたではありませんか。"
212140-179 = "勝利へ至る道がこの手から始まるのです。"
212140-180 = ""
212140-182 = ""
212140-183 = ""
212140-184 = "くぅっ……目がぁ……。"
212140-185 = "……準備にも心を尽くすのは当然でしょう？"
212140-186 = "……。"
212140-187 = "うふふ、キヴォトスを統一する日が楽しみですね。#nそうすれば食材のために学園間の揉め事を起こす必要もなくなるでしょうし。"
212140-188 = "秩序の中で味わう幸福は、不確かな美食より甘美かもしれませんから。"
212140-189 = "さあ、来たるべきその日のために頑張りましょう★"
212140-190 = ""
212140-192 = ""
212140-193 = "あの二人、なんか変なんだよね。あ、変なのは前からだけど。なんていうか……。"
212140-194 = "人が変わったみたい……。"
212140-195 = "そうそう。急にゲヘナを愛しすぎてるっていうか。"
212140-197 = "美食より大事なものができたみたいなんだよね。#nどうしてだと思う？"
212140-198 = "二人だけじゃない……ゲヘナが、どこかおかしくなってるんです。"
212140-199 = "私はいろんな味があった方がいいのになぁ……。"
212140-200 = "世界が全部ゲヘナ味になっちゃうのは……。"
212140-201 = "うぅ……それは嫌。"
212140-202 = "……それに戦いが始まったら、名店だって被害を受ける。"
212140-203 = "食材の仕入れが止まるかもしれないし、お店が壊れちゃうかも……#n閉店するかもしれない。"
212140-204 = "一生懸命メモしてきたのにまだ行けてないお店、いっぱいあるのに……。"
212140-205 = ""
212140-207 = ""
212140-208 = "……戦争は起こさせないようにしないと、ですね。せめて最大限遅らせるとか。"
212140-209 = ""
212140-212 = ""
212140-213 = "できるの？"
212140-214 = "どれだけ強くて、どれだけ人数がいても、補給がなければ戦えません。"
212140-215 = "そしてゲヘナの補給は私たちが握ってます。"
212140-216 = "……私たちが使い物にならなければいいってこと？"
212140-217 = ""
212140-219 = ""
212140-221 = "はい。"
212140-223 = ""
212140-224 = ""
212140-226 = ""
212140-227 = "こ、この私が直々にゲヘナ最強の美食家どもまで手伝いに回してやったというのに！"
212140-228 = "どうして生産量が半減しているのだぁ！！"
212140-229 = ""
212140-231 = ""
212140-232 = "げ、現場からは……料理は1+1じゃない！との報告しか……！"
212140-234 = "くっ、論破しようにも大量調理については詳しくない……！痛恨の極みだ！"
212140-235 = "補給プロセスを給食部に依存しきっていた付けが回ってきたか……。"
212140-236 = "マコト議長、どうやら原因は別にあるようです。"
212140-237 = "何だと！？それはどういう意味だ！"
212140-238 = "……サボタージュでしょう。"
212140-239 = "反対勢力の組織的な動きについては把握されているはずです。"
212140-240 = "この件も同じ視点で捉えるべきかと。"
212140-241 = "……中心と見られる先生は拘束したはずだが。"
212140-242 = "一度火がついてしまったが最後、山火事は鎮火しても地中に火種が残るものです。"
212140-243 = "ではどうすればいいのだ！給食部長の[ruby=あいきよ]愛清[/ruby]フウカに処罰を下して――"
212140-244 = ""
212140-248 = "お待ちください。それは現状の解決にはまったく役立ちませんわ。"
212140-249 = ""
212140-251 = ""
212140-252 = ""
212140-256 = ""
212140-257 = "膨大な補給物資をこの短期間で用意できる人材は他にいませんわ。"
212140-258 = "フウカさんもそれを分かっているからこそ、今のように振る舞っているのでしょう。"
212140-260 = "……その通りです。#n給食部に処罰を下せば、ゲヘナ全体の補給体制は完全に崩壊します。"
212140-261 = "ならば黙って見ていろとでも？#n他に何かサボタージュを防ぐ手立てがあるのか？"
212140-263 = "あいにくと、そこまでの妙案は浮かびませんわね。"
212140-264 = "フウカさんとジュリさん、案外頑固なんですよね。"
212140-266 = "代えのきかない人材というのは厄介ですね……。"
212140-267 = "くっ、そんな話を聞くために呼んだのではない！#n解決策を持ってこいと言っているのだ！"
212140-268 = "もとを正せば、給食部の代替人員を育ててこなかったあなたの落ち度なのでは？"
212140-269 = "うるさい！！"
212140-270 = "当面は[ruby=私たち]美食研究会[/ruby]の監視範囲と時間を増やすことで対処いたしましょう。"
212140-271 = "ふぅ……分かった。ならば下がれ。"
212140-272 = "給食部への脅迫や干渉は、事態のさらなる悪化を招くだけ……その点はお忘れなく。#nふふっ。"
212140-273 = "ふん、お前たちこそ給食部にとって脅威そのものではないか。#n食堂爆破に給食部長の拉致、他にも報告は山ほど受けてきたぞ。"
212140-274 = "美食のためには必要だったのです。#nとはいえ、もっと大きな目標ができた今となっては、以前と同じ振る舞いを続けるわけにはまいりませんわ。"
212140-276 = "それに、給食部にそんなことをするのは私たちだけで十分なので。#n他の人にも真似をさせるわけにはいきません★"
212140-277 = "……呆れた話だ。"
212140-278 = "アコ行政官。#nこの状況が続く場合……攻撃開始までにどの程度の遅延が見込まれる？"
212140-279 = "……少なくとも週単位、長ければ月単位の時間が追加で必要になるでしょう。"
212140-280 = "……まずいな。"
212140-281 = "時間こそが最大の武器だというのに。"
212140-282 = ""
212140-286 = ""
212140-287 = "同感よ。でも……。"
212140-288 = "勘づかれる前に連邦生徒会や他学園を掃討する電撃作戦が理想だけど……#n現状では不可能ね。"
212140-289 = "しかし、時間が延びるほど不安要素は膨らみます。"
212140-290 = "SNSの統制も行っていますが、稀に投稿に成功するケースもあるようです。#n追跡して削除はしていますが……。"
212140-291 = ""
212140-293 = ""
212140-294 = "……。"
212140-296 = "それなら、方法を変えればいい。"
212140-297 = ""
212140-299 = ""
212140-300 = ""
212140-301 = "……どんな？"
212140-302 = ""
212140-304 = ""
212140-306 = ""
212140-307 = ""
212140-308 = "更地にした後、灰の上に新たな秩序を築く。"
212140-309 = "キヴォトス全域を、ですか？どうやって？"
212140-310 = "キシシッ、なに、簡単な話だ。"
212140-311 = "たった1発でD.U.中心地区を焦土に変えられる化学弾。#nそれが何十発もあるとすればどうだ？"
212140-312 = ""
212140-314 = ""
212140-315 = "もしかして……。"
212140-316 = "ああ、雷帝の戦略兵器を復元するのだ。"
212140-317 = "時間はかからないの？"
212140-318 = "キシシッ、問題ない。すべてこの頭の中に記憶してある。"
212140-319 = "……流石ね。"
212140-320 = "思考が占領に囚われていたが、状況が変わった以上、手段も変えるべきだろう。"
212140-321 = "一部のサボタージュ程度で、この歩みは決して止められまい。"
212140-322 = ""
212140-324 = ""
212140-327 = ""
212140-328 = "……ゲヘナの底力、実に凄まじいですね。#nそのようなものまで存在していたとは知りませんでした。"
212140-329 = "キキキッ。わざわざ表に出さず、わざわざ使わなかっただけのこと。"
212140-330 = "だが私たちの守ってきた線が無意味だと悟った以上……#nそのような制約、もはやあってないようなものだろう？"
212140-331 = "この私が保証しよう。ひとつの秩序という目標を掲げたゲヘナは最強だ。"
212140-332 = "……はい。今のゲヘナは、何よりも強いでしょう。"
212140-333 = "兵器の準備が整い次第、直ちに攻撃を開始する。全員、気を緩めず待機していろ。"
212140-335 = "分かった。アコは既存の計画との変更点を整理しておいて。"
212140-336 = "はい、委員長。1時間後にご報告します。"
212140-338 = ""
212140-339 = "……。"
212140-341 = "次回;作戦立案"
