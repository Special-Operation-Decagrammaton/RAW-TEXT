[translation]
212140-1 = "제14화;반역자들"
212140-6 = "여기는 사람들이 자주 오가지 않는 곳이야."
212140-7 = "교내는 위험하니까, 최대한 눈에 띄지 않는 곳에서 활동하는 게 낫겠지……."
212140-12 = "젠장, 젠장!"
212140-13 = "눈앞에서 선생님이 끌려가는 모습을 보고만 있었다니…… 이러고도 내가 선도부냐고……!"
212140-14 = "진정하세요, 이오리. 선생님은 이미 예견하고 계셨잖아요."
212140-15 = "그래서 우리에게 미리 역할을 맡기신 거고요."
212140-16 = "……선생님이 그러셨죠. 구심점이 사라져야 그들이 방심할 거라고."
212140-17 = "우리가 뿔뿔이 흩어져서 각자의 전장으로 돌아가는 게, 오히려 작전의 시작이라고요."
212140-18 = "그건 그렇지만……!"
212140-19 = "마음이, 내 마음이 부서질 것 같단 말이야……."
212140-21 = "……그건 우리 모두 마찬가지야."
212140-22 = "그러니까 제대로 한 방 먹여줘야지. 다들 해야 할 일은 잘 기억하고 있어?"
212140-27 = "일단, 같은 생각을 하는 사람들을 최대한 모집하는 거였지."
212140-28 = "우리와 생각이 같은 선도부원들을 모집할게요. 모두가 광기에 휩싸인 건 아닐 테니까요."
212140-29 = "저도 만마전에서 비슷한 생각이었던 이들과 접선하겠습니다."
212140-30 = "임원으로서의 권한이 없더라도, 3학년을 제외하면 설득할 수 있을 거예요."
212140-32 = "우리도 마찬가지야. 들키지 않도록 조심해서 접선할게."
212140-34 = "또 가장 중요한 것은…… 사츠키 선배의 방해 주파수 완성이었죠."
212140-35 = "……우리가 아무리 시선을 끌고, 사람들을 모으더라도 선배가 세뇌를 풀지 못하면 말짱 헛일이 되는 건데…… 괜찮겠어요?"
212140-36 = "후후…… 맡겨둬. 키보토스에서 나보다 더 뇌제의 연구를 많이 파헤친 사람은 없을 테니까."
212140-37 = "네. 믿을게요."
212140-38 = "후배들이 이렇게 힘내고 있는데. 유일한 3학년으로서 부끄럽지 않아야겠지."
212140-39 = "그리고 내가 해내지 않으면 마코토 쨩은 계속 저대로일 거 아냐. 그런 모습은 보고 싶지 않거든."
212140-40 = "……네. 저도요."
212140-42 = "그리고 결행날짜가 되면, 우리가 방송실로 가는 길을 여는 거지."
212140-43 = "경계가 삼엄하지만, 어떻게든 해볼게."
212140-44 = "특히 조심해야 할 것은, 최대한 선도부와 만마전 선배들의 감시를 피한 활동입니다."
212140-45 = "만약 발각된다면…… 곱게 끝나지는 않겠죠."
212140-47 = "……게헨나 전체의 반역자로 치부되어 갖은 고초를 당하든가, 운이 좋아야 구금이겠죠."
212140-52 = "설마 그렇게까지 할까?"
212140-54 = "부장의 경고를 들었잖아…… 그 표정은 뭐든 할 수 있는 눈이었어."
212140-55 = "지금의 히나 부장을 예전처럼 생각해선 안 됩니다."
212140-57 = "그럼 만약 선도부장이 작전 중 등장하면 그 대책은…… 어떻게 하지?"
212140-62 = "……하아. 사실 답이 없는데."
212140-63 = "부장님이 나선다면, 우리의 각오와는 관계없이 순식간에 정리될 거예요."
212140-65 = "그만큼 압도적인 무력이라는 건가……."
212140-66 = "지금 전쟁 준비는 마무리 단계예요. 우리가 뭔가 하려면, 전쟁이 발발하기 전에 진행해야 합니다."
212140-67 = "끄응. 준비가 완료되기 전에 시간을 최대한 끌어야 할 텐데……."
212140-68 = "저희는 실무 단계에서 최대한 선도부의 탄약과 보급 물자 승인 절차를 최대한 꼬아놓겠습니다. 일정에 차질이 생기게끔요."
212140-69 = "그리고 이 자리에는 없지만, 우리 말고도 같은 생각을 하고 있는 학생들이 있으니까요."
212140-70 = "대표적으로……."
212140-82 = "안 해!! 못해!!!"
212140-87 = "뭐?! 어째서!"
212140-88 = "단순히 보급을 챙기는 일이지 않나!"
212140-89 = "지금까지 너희 급양부가 해왔던 일과 크게 다르지도 않단 말이다. 왜 못 하겠다는 거지?"
212140-90 = "게헨나의 모든 부대를 먹일 전투 식량을 단 3일 안에 준비하라는 게 그렇게 무리한 지시인가?"
212140-92 = "3일? 지금 장난해요?! 게헨나 전체 인원이 몇 명인데 그걸 단둘이서 3일 만에 하라는 거예요? 당신들은 숫자 계산도 못 하나요?!"
212140-93 = "효율적으로 움직이면 가능할 텐데. 우리는 이미 모든 훈련 스케줄을 1분 단위로 쪼개서……"
212140-94 = "그건 당신들 사정이고요! 요리는 수학이 아니에요!"
212140-95 = "자, 잘 들으세요. 3일 안에 보급이 불가능한 기술적 이유를 대줄 테니까."
212140-96 = "첫째, 지금 우리는 그럴 만한 시설이 없어요."
212140-97 = "지금 24시간 내내 전투 식량용 고열량 단백질 바를 만들다가 메인 밸브 터지기 직전이라고요."
212140-98 = "지금 여기서 한 사이클만 더 추가해도 오븐이 폭발해서 급식소 건물이 통째로 날아갈 텐데, 그래도 할까요?"
212140-105 = "바, 방금 오븐 안에서 이상한 소리가 들리기 시작했는데요…… 짐승의 울음소리 비슷한…… 마지막에 제가 건드린 게 문제일까요……?"
212140-107 = "울음소리……? 아니, 오븐 속에서……?"
212140-108 = "그건 일단 두고요! 둘째, 보존성 문제예요."
212140-109 = "당신들이 요구한 메뉴는 대부분 상온에서 쉽게 부패하는 식단이거든요?"
212140-110 = "이대로 들고 나갔다간 전쟁이고 자시고 내일모레쯤 전교생이 식중독으로 전멸할 거예요."
212140-111 = "그렇게 게헨나 전 인원을 독살하고 싶으면 계속 우겨보시든가요!"
212140-112 = "……그, 그건 아닌데……."
212140-113 = "마지막으로, 인력 부족이에요."
212140-114 = "우리 둘이서 아무리 철야로 보급을 준비한다고 해도 평소의 8배가 넘는 양을 조리할 수는 없다고요. 물리적으로 무리예요!!"
212140-121 = "앗! 방금 남은 식재료로 만든 주먹밥이 살아나서…… 얘가 지금 창고에 있는 비상식량을 먹어 치우고 있는데요……!"
212140-122 = "어, 어떻게 하죠? 부장님……!!"
212140-124 = "보셨죠? 저걸 물리적으로 퇴치하고 창고를 소독하는 데만 최소 사흘은 걸릴 거예요."
212140-125 = "사, 사흘?! 의장님이 아시면 가만두지 않을 텐데……!"
212140-126 = "그럼 직접 하시든가요! 아무튼 지금 상태로는 당신들이 요구한 보급 일정, 때려죽여도 못 맞춰요!"
212140-130 = "크윽, 이런 복병이 있을 줄이야……."
212140-131 = "보급의 중요성을 간과했군요. 이대로라면 전체 일정에 차질이 발생할 텐데요."
212140-132 = "……지금 해결할 수 있는 방법에는 무엇이 있지? 최대한 빠른 수단부터 보고하도록!"
212140-133 = "그렇다면……!!"
212140-142 = "그래서, 우리가 급양부를 도울 인력으로 긴급 파견되었답니다-!!"
212140-146 = "너희 요리 못하잖아?!"
212140-147 = "아차차!"
212140-148 = "아차차가 아니라-!!"
212140-151 = "(시간이 흐르고……)"
212140-155 = "응, 여기 밀가루 체에 다 걸렀어~!"
212140-156 = "와아! 엄청 빠르시네요! 그럼 제가 가져가서 반죽할게요!"
212140-161 = "양파를 써는 임무…… 이 정도는 쉽지요."
212140-162 = "정해진 규격대로, 단 1mm의 오차도 없이……"
212140-167 = "하아, 맵군요. 훌쩍. 하지만……"
212140-168 = "이 모든 준비를 허투루 할 수는 없겠지요. 크읍."
212140-169 = "하루나, 생각보다 꽤 잘하고는 있는데…… 왜 이렇게 열심히 하는 거야?"
212140-170 = "어머, 그거야 당연히……"
212140-171 = "훌쩍."
212140-175 = "……완벽한 게헨나를 위해서죠."
212140-176 = "……그게 무슨 말인데?"
212140-177 = "후우카 씨, 아직 깨닫지 못하셨나요? 핏속에 살아 숨 쉬는 정복에 대한 열망을."
212140-178 = "우리는 그간 미식이라는 미망에 사로잡힌 존재들이었지만, 이제는 키보토스 정복이라는 구체적인 목표가 생겼잖아요?"
212140-179 = "승리로 가는 길이 우리의 손안에서 시작된다니."
212140-184 = "크응."
212140-185 = "……당연히 그 준비 과정에도 신경을 써야 하지 않을까요?"
212140-186 = "……."
212140-187 = "후후, 키보토스를 통일하는 그날이 기대되네요. 그때는 골드마구로를 훔치다 학원 간 분쟁을 일으킬 일도 없겠죠."
212140-188 = "통제된 질서 아래 느끼는 행복은, 어쩌면 불확실한 미식보다 즐거울지도요."
212140-189 = "자아, 그날을 위해 힘내자구요★"
212140-193 = "저 둘, 뭔가 좀 이상해지긴 했거든. 아, 평소에도 이상하긴 했는데. 뭐랄까."
212140-194 = "……사람이 바뀐 것 같죠?"
212140-195 = "아, 응. 맞아. 예전 같았으면 신경도 안 썼을 것 같은데…… 갑자기 게헨나를 너무 사랑하게 된 것 같달까."
212140-197 = "요즘 하루나랑 아카리는 미식보다 다른 게 중요한 것 같아. 왜 그런지 알아?"
212140-198 = "……지금의 게헨나는 어딘가 이상해졌거든요."
212140-199 = "나는 다양한 맛이 나는 세상이 좋은데……."
212140-200 = "만약 두 사람이 말하는 것처럼 온 세상이 게헨나가 되면, 다른 맛들은 없어지는 거 아닐까?"
212140-201 = "으으…… 그건 싫어."
212140-202 = "……그리고 전쟁이 나면, 내가 열심히 적어둔 맛집들도 피해를 받을 거야."
212140-203 = "재료 수급이 안 될 수도 있고, 폭탄이 떨어질 수도 있고, 문을 닫을 수도 있고."
212140-204 = "아직 안 가본 곳들이 너무 많은데……."
212140-208 = "……전쟁이 나지 않게 해야겠지요. 최대한 늦추거나요."
212140-213 = "어, 어떻게?"
212140-214 = "군대는 보급이 없으면 싸울 수 없어요."
212140-215 = "그리고 게헨나 전체의 보급은 우리가 책임지고 있죠."
212140-216 = "……우리가 망하면 되겠네?"
212140-221 = "네."
212140-227 = "이, 이 몸이 친히 게헨나 최강의 미식 전문가들까지 일손으로 보내줬건만!"
212140-228 = "어찌하여 보급물자 생산량이 반 토막이 난 것이냐!!"
212140-232 = "그, 그것이…… 요리는 1+1이 아니라는 말만……!"
212140-234 = "크윽, 그 말을 반박하고 싶지만 이 몸이 대량 조리에 대해서는 잘 모른다는 점이 통탄스럽구나……!"
212140-235 = "모든 급양 프로세스를 급양부에만 일임했던 과거가 이렇게 발목을 잡다니!!"
212140-236 = "마코토 의장, 이는 단순히 인력 간 시너지의 문제는 아닌 것으로 보입니다만."
212140-237 = "뭣이?! 그건 무슨 뜻이냐, 아마우 아코 선임행정관!"
212140-238 = "……태업이겠죠."
212140-239 = "하나 된 게헨나에 반대하는 이들의 조직적인 행동에 대해서는 알고 계시겠죠."
212140-240 = "이 건도 비슷한 시각으로 접근해야 할 것 같습니다."
212140-241 = "……그 구심점으로 예상되는 선생을 구금했을 텐데."
212140-242 = "저 개인적으로도 애석하게 생각하는 부분입니다만, 본디 산불은 진화하더라도 땅거죽 안에 불씨가 살아있는 법입니다."
212140-243 = "그렇다면 어찌해야 하겠나! 급양부장 아이키요 후우카에게 처벌을 내린다면……!"
212140-248 = "아뇨. 그것은 현 상황 해결에 전혀 도움이 되지 않습니다."
212140-257 = "후우카 씨만큼 이 거대한 규모의 급식을 단기간에 통제할 수 있는 인력은 없으니까요."
212140-258 = "후우카 씨도 그걸 알기에 지금처럼 행동하고 있는 거겠죠."
212140-260 = "……맞는 말입니다. 지금 급양부에게 처벌을 내리면, 게헨나 전체의 보급 체계는 완전히 붕괴합니다."
212140-261 = "그렇다면 어쩌자는 건가? 태업을 방지할 수단이라도 있나?"
212140-263 = "솔직히 말하자면, 그런 방법은 떠오르지 않는군요."
212140-264 = "저도 마찬가지예요. 후우카 씨와 주리 씨, 은근히 고집이 세거든요."
212140-266 = "대체할 수 없는 인력이란 정말 까다로운 상대죠……."
212140-267 = "큭, 그런 이야기나 듣자고 말을 꺼낸 것이 아니다! 해결책을 가져오란 말이다!"
212140-268 = "사실 따지고 보면 지금까지 급양부의 대체 인력을 키워두지 않은 당신의 실책이 아닐까요?"
212140-269 = "시끄럽다~!!"
212140-270 = "당분간은 저희 미식연구회의 감시 범위와 시간을 늘리는 것으로 대응하도록 하지요."
212140-271 = "후…… 알겠으니 이만 물러가도록."
212140-272 = "급양부에 대한 물리적 위협이나 접촉은 사태를 더 악화시킨다는 점만 기억하시길…… 후훗."
212140-273 = "흥, 너희 미식연이야말로 급양부의 위협 그 자체 아니던가? 급식실 폭파와 급양부장 강제 납치에 대한 보고는 이미 수도 없이 받았던 터."
212140-274 = "모두 미식을 위해 불가피한 행동이었죠. 하지만 이제 더 큰 목표가 있는 이상, 이전과 같은 행동을 그대로 할 수는 없으니까요."
