[translation]
212140-1 = "Episode 14;Traitors"
212140-6 = "People don't come here often."
212140-7 = "And since we can't keep meeting on campus, we have to be discreet."
212140-8 = ""
212140-12 = "Damn it, damn it!"
212140-13 = "I can't believe I just stood there and watched Sensei get taken away... And I call myself a member of the Prefect Team...?!"
212140-14 = "Calm yourself, Iori. Sensei anticipated this happening."
212140-15 = "That's why we were each given our own roles."
212140-16 = "...Sensei predicted that they'd let their guard down once the \"central figure\" was removed."
212140-17 = "Now, our true operation begins. We need to scatter and return to our respective battlegrounds."
212140-18 = "That's true, but..."
212140-19 = "I feel like...like my heart's going to shatter..."
212140-21 = "...I think we all do."
212140-22 = "Which is why we better get a few good hits in. Do we all know our assignments?"
212140-23 = ""
212140-26 = ""
212140-27 = "First, we need to gather as many like-minded people as possible."
212140-28 = "I'll recruit from the Prefect Team members. I'm sure some of them resisted being swept into this madness."
212140-29 = "I'll do the same with the Pandemonium Society."
212140-30 = "Even without my old authority, I should be able to persuade a few students—save for the third-years."
212140-32 = "And we'll do what we can with the Heritage League."
212140-34 = "And, most importantly...we need Satsuki's jamming frequency."
212140-35 = "...No matter how much attention we draw or how many people we gather, it's worthless if we can't undo the brainwashing... Satsuki?"
212140-36 = "Fufu... Leave it to me. There's no one in Kivotos who's studied the Tyrant Emperor's research more than I have."
212140-37 = "I'm counting on it."
212140-38 = "I can't afford to embarrass myself while my underclassmen are working this hard."
212140-39 = "Also, I can't bear to keep seeing Makoto like this."
212140-40 = "...Yes. Me too."
212140-42 = "When the time comes, we will clear a path to the broadcasting room."
212140-43 = "Security's tight, but we can do it."
212140-44 = "And we'll have to mind the Prefect Team and Pandemonium Society upperclassmen."
212140-45 = "If we're caught... It won't end well."
212140-47 = "...We'd be branded as traitors to Gehenna and tortured...or imprisoned if they're feeling merciful."
212140-48 = ""
212140-51 = ""
212140-52 = "Would they really go that far?"
212140-54 = "You heard the Head Prefect's warning... She's unstoppable."
212140-55 = "We can't think of her as the same Hina we knew."
212140-57 = "What if she shows up in the middle of the fray? Do we have a plan?"
212140-58 = ""
212140-61 = ""
212140-62 = "...*sigh* Honestly, there's no strategizing around that."
212140-63 = "If the Head Prefect steps up, it'll be over in an instant."
212140-65 = "So she's that powerful..."
212140-66 = "The war preparations are nearly finalized. If we're going to take action, we must act quickly."
212140-67 = "Ugh. But we need more time! We've barely built a resistance!"
212140-68 = "We'll do our best to delay the Prefect Team's ordnance approval process as much as possible."
212140-69 = "And although they're not currently present, there are others like us, ones willing to fight for the cause."
212140-70 = "For example..."
