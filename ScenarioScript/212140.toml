212140-80 = ""
212140-81 = ""
212140-82 = "I REFUSE!!! I CAN'T!!!"
212140-83 = ""
212140-86 = ""
212140-87 = "What?! Explain yourself!"
212140-88 = "It's only preparing necessary supplies!"
212140-89 = "It's no different from your standard School Lunch Club duties. Why can you not fulfill the request?"
212140-90 = "Is there something UNREASONABLE about preparing combat rations for all the Gehennan troops? You have a 72-hour deadline."
212140-92 = "Three days? Are you kidding me?! Do you realize how many hungry teenage girls are in Gehenna?! And there are TWO of us cooking! Do the math!"
212140-93 = "It will be possible if you move efficiently. See here, we have already broken down our entire training schedule on a minute-to-minute basis..."
212140-94 = "Yes, that's YOUR problem! Cooking doesn't work like that."
212140-95 = "Okay, listen carefully. I will explain, rationally, why I cannot prepare all these combat rations in three days."
212140-96 = "First, we don't have proper facilities."
212140-97 = "The main valve is about to burst from baking high-calorie protein bars for a day straight. "
212140-98 = "If I run one more round of these ration bars, the oven will explode, blowing up the cafeteria building and us along with it. Do you still think I should try?"
212140-99 = ""
212140-101 = ""
212140-104 = ""
212140-105 = "I-I heard a strange noise coming from the oven just now... Like an animal crying... Is it because I touched the door last?"
212140-107 = "Cry...? Wait, from the oven...?"
212140-108 = "Stay focused! Second, there are the preservation issues. "
212140-109 = "Are you aware that most of your \"essential items\" require stable refrigeration? They will SPOIL at room temperature."
212140-110 = "If we pack food like this on the trucks, don't bother with the war. The entire student body will be wiped out by food poisoning."
212140-111 = "If you really want a biohazard on your hands, then go ahead and keep pushing me!"
212140-112 = "...Th-That's not..."
212140-113 = "And lastly, we don't have enough people."
212140-114 = "Even if the two of us pulled all-nighters, we can't cook eight times more food than usual. It's physically and temporally impossible!"
212140-115 = ""
212140-120 = ""
212140-121 = "Ah! The rice ball I made came to life...and it's eating the pantry's emergency food supply...!"
212140-122 = "Wh-What should we do? President, please...!"
212140-124 = "See that? And now I need at least three MORE days just to exterminate whatever's crawling around back there."
212140-125 = "Th-Three days?! This is unacceptable! The chairman demands results!"
212140-126 = "Then do it yourselves! But you can't, because all of this is impossible!"
212140-129 = ""
212140-130 = "Tch, I didn't anticipate such hindrances..."
212140-131 = "We've overlooked the importance of provisions. At this rate, the entire schedule will be delayed."
212140-132 = "...What are the available solutions? Give me whatever's fastest!"
212140-133 = "In that case...!"
212140-136 = ""
212140-137 = ""
