212140-155 = "อื้ม ใช้ตะแกรงร่อนแป้งตรงนี้หมดแล้ว~!"
212140-156 = "ว้าว! เร็วมากเลยค่ะ! ถ้างั้นฉันจะเอาไปนวดต่อนะคะ!"
212140-157 = ""
212140-159 = ""
212140-161 = "ภารกิจหั่นหัวหอม... แค่นี้ง่ายมากค่ะ"
212140-162 = "หั่นตามขนาดที่กำหนด ไม่ให้คลาดเคลื่อนแม้แต่มิลลิเมตรเดียว..."
212140-163 = ""
212140-165 = ""
212140-166 = ""
212140-167 = "อ่า แสบตาจังค่ะ ฮึก แต่ว่า..."
212140-168 = "จะเตรียมทั้งหมดนี้แบบลวกๆ ไม่ได้สินะคะ ฮึบ"
212140-169 = "ฮารุนะ ทำได้ดีกว่าที่คิดไว้อีกนะ... ทำไมถึงได้ตั้งใจมากขนาดนี้เชียวล่ะ?"
212140-170 = "อ๋อ นั่นก็เพราะ..."
