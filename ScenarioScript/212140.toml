[translation]
212140-1 = "ตอนที่ 14;เหล่าคนทรยศ"
212140-6 = "ที่นี่ไม่ค่อยมีคนผ่านไปมากันเท่าไรน่ะ"
212140-7 = "ในโรงเรียนอันตราย เพราะงั้นเคลื่อนไหวในจุดที่ไม่สะดุดตาที่สุดน่าจะดีกว่า..."
212140-8 = ""
212140-12 = "บ้าชะมัด บ้าชะมัด!"
212140-13 = "ได้แต่ยืนดูคุณครูถูกลากตัวไปต่อหน้าต่อตา... แบบนี้ฉันยังจะเรียกตัวเองว่าเป็นคณะกรรมการวินัย#nได้อีกงั้นเหรอ...!"
212140-14 = "ใจเย็นก่อนค่ะ อิโอริ คุณครูคาดการณ์ไว้แล้วไม่ใช่เหรอคะ"
212140-15 = "เพราะแบบนั้นไงคะถึงได้มอบหน้าที่ให้พวกเราเอาไว้ล่วงหน้าแล้ว"
212140-16 = "คุณครูเคยบอกไว้สินะคะ ว่าเมื่อศูนย์รวมใจหายไป พวกนั้นก็จะประมาท..."
212140-17 = "การที่พวกเราแยกย้ายกันแล้วกลับไปสู่บทบาทของแต่ละคนต่างหากค่ะ ที่เป็นจุดเริ่มต้นของปฏิบัติการ"
212140-18 = "ถึงอย่างนั้นก็เถอะ...!"
212140-19 = "หัวใจ... เหมือนว่าหัวใจของฉันกำลังจะแตกสลายเลย..."
212140-21 = "เรื่องนั้น... พวกเราทุกคนก็เหมือนกัน"
212140-22 = "เพราะงั้นเราต้องเอาคืนให้สาสมเลย ทุกคนยังจำสิ่งที่ต้องทำได้อยู่ใช่มั้ย?"
212140-23 = ""
212140-26 = ""
212140-27 = "ก่อนอื่นก็ต้องรวบรวมคนที่คิดเหมือนกันให้ได้มากที่สุด"
212140-28 = "ฉันจะรวบรวมสมาชิกคณะกรรมการวินัยที่คิดเหมือนพวกเรา ทุกคนไม่ได้ถูกความบ้าคลั่งครอบงำไปหมดค่ะ"
212140-29 = "ฉันก็จะนัดพบกับคนในแพนเดโมเนียม โซไซตี้ที่เคยมีความคิดคล้ายกันอย่างลับๆ ค่ะ"
212140-30 = "ต่อให้ไม่มีอำนาจในฐานะสมาชิกแล้ว แต่ถ้าไม่ใช่นักเรียนชั้นปีที่ 3 ก็น่าจะพอเกลี้ยกล่อมได้ค่ะ"
212140-32 = "พวกเราก็เหมือนกัน จะนัดพบกันระวังๆ ไม่ให้ถูกจับได้"
212140-34 = "แล้วสิ่งที่สำคัญที่สุด... คือการทำความถี่รบกวนของรุ่นพี่ซัตสึกิให้เสร็จสมบูรณ์สินะคะ"
212140-35 = "ต่อให้พวกเราดึงความสนใจและรวบรวมผู้คนได้มากแค่ไหน แต่ถ้ารุ่นพี่คลายการล้างสมองไม่ได้ ทุกอย่างมันก็สูญเปล่า... จะไม่เป็นไรแน่เหรอคะ...?"
212140-36 = "ฮุฮุ... วางใจได้เลย ในคิโวทอสน่ะคงไม่มีใครขุดคุ้ยงานวิจัยของผู้เหี้ยมโหดมากไปกว่าฉันแล้ว"
212140-37 = "ค่ะ ฉันเชื่อใจนะคะ"
212140-38 = "รุ่นน้องพยายามกันขนาดนี้ ในฐานะนักเรียนชั้นปีที่ 3 เพียงคนเดียว ฉันก็ต้องทำตัวให้สมกับเป็นรุ่นพี่สินะ"
212140-39 = "แล้วถ้าฉันทำไม่สำเร็จ มาโคโตะจังก็จะเป็นแบบนั้นต่อไปใช่มั้ยล่ะ ฉันไม่อยากเห็นมาโคโตะจังในสภาพนั้นหรอก"
212140-40 = "ค่ะ... ฉันก็เหมือนกัน"
212140-42 = "และพอถึงวันลงมือ พวกเราจะเปิดทางไปยังห้องกระจายเสียงกัน"
212140-43 = "การรักษาความปลอดภัยยังเข้มงวดอยู่ แต่ฉันจะหาทางจัดการเอง"
212140-44 = "สิ่งที่ต้องระวังเป็นพิเศษคือ ต้องเคลื่อนไหวโดยหลบเลี่ยงการเฝ้าจับตาของรุ่นพี่คณะกรรมการวินัย#nกับแพนเดโมเนียม โซไซตี้ให้ได้มากที่สุดค่ะ"
212140-45 = "ถ้าถูกจับได้ละก็... คงไม่จบดีแน่ค่ะ"
212140-47 = "ทุกคนคงถูกตราหน้าว่าเป็นคนทรยศของเกเฮนน่าและต้องทนทุกข์สารพัด หรือถ้าโชคดีหน่อยก็คงแค่ถูกคุมขังค่ะ"
212140-48 = ""
212140-51 = ""
212140-52 = "จะถึงขั้นนั้นเลยเหรอ?"
212140-54 = "ได้ยินคำเตือนของประธานกันแล้วนี่... สีหน้านั้นบอกว่าพร้อมทำทุกอย่างได้เลย"
212140-55 = "จะมองประธานฮินะในตอนนี้เหมือนเมื่อก่อนไม่ได้ค่ะ"
212140-57 = "ถ้าประธานกรรมการวินัยปรากฏตัวระหว่างปฏิบัติการ แล้วเรา... จะรับมือยังไงดี?"
212140-58 = ""
212140-61 = ""
212140-62 = "เฮ้อ... ความจริงก็ไม่มีวิธีรับมือหรอก"
212140-63 = "ถ้าท่านประธานออกโรงเองละก็ ต่อให้พวกเราตั้งใจแน่วแน่แค่ไหน ก็คงถูกจัดการได้ภายในพริบตาค่ะ"
212140-65 = "มีกำลังแข็งแกร่งถึงขนาดนั้นเลยเหรอ..."
212140-66 = "ตอนนี้การเตรียมสงครามอยู่ในขั้นตอนสุดท้ายแล้ว ถ้าพวกเราจะทำอะไร ก็ต้องลงมือก่อนสงครามจะปะทุค่ะ"
212140-67 = "อึก ต้องถ่วงเวลาให้ได้มากที่สุดก่อนที่จะเตรียมการกันเสร็จ..."
212140-68 = "ในขั้นตอนปฏิบัติงาน พวกฉันจะทำให้กระบวนการอนุมัติกระสุนและเสบียงของคณะกรรมการวินัย#nยุ่งเหยิงที่สุด เพื่อให้กำหนดการเกิดความล่าช้าค่ะ"
212140-69 = "และถึงตัวจะไม่ได้อยู่ที่นี่ แต่ก็ยังมีนักเรียนคนอื่นที่คิดเหมือนพวกเราอยู่ด้วยนะคะ"
212140-70 = "อย่างเช่น..."
212140-77 = ""
212140-78 = ""
212140-80 = ""
212140-81 = ""
212140-82 = "ไม่ทำ!! ฉันทำไม่ได้!!!"
212140-83 = ""
212140-86 = ""
212140-87 = "อะไรนะ?! ทำไมล่ะ!"
212140-88 = "ก็แค่จัดเตรียมเสบียงเองไม่ใช่เหรอไง!"
212140-89 = "นี่ไม่ได้แตกต่างจากงานที่ชมรมโภชนาการของพวกเธอทำมาตลอดเท่าไรเลยนี่ แล้วทำไมถึงบอกว่าทำไม่ได้ล่ะ?"
212140-90 = "การสั่งให้เตรียมเสบียงอาหารสำหรับการต่อสู้เพื่อเลี้ยงทุกหน่วยของเกเฮนน่าภายในเวลา 3 วัน มันเกินกำลังขนาดนั้นเลยเหรอ?"
212140-92 = "3 วัน? ล้อกันเล่นอยู่หรือไงคะ?! รู้มั้ยว่าทั่วทั้งเกเฮนน่ามีกี่คน แล้วจะให้พวกเราสองคนทำทั้งหมดภายใน 3 วันเนี่ยนะ? พวกคุณคิดเลขกันไม่เป็นหรือไงคะ?!"
212140-93 = "ถ้าทำงานอย่างมีประสิทธิภาพก็น่าจะทำได้ ขนาดพวกฉันยังแบ่งตารางฝึกทั้งหมดออกเป็นหน่วยนาที แล้วก็..."
212140-94 = "นั่นมันเรื่องของพวกคุณค่ะ! การทำอาหารมันไม่ใช่คณิตศาสตร์นะคะ!"
212140-95 = "เอาละ ฟังให้ดีนะคะ ฉันจะบอกเหตุผลทางเทคนิคว่าทำไมถึงเตรียมเสบียงให้ภายใน 3 วันไม่ได้"
212140-96 = "ข้อแรก ตอนนี้พวกเราไม่มีสถานที่และอุปกรณ์รองรับงานขนาดนั้นค่ะ"
212140-97 = "ตอนนี้พวกฉันทำโปรตีนบาร์แคลอรีสูงสำหรับใช้เป็นเสบียงอาหารในการต่อสู้ตลอด 24 ชั่วโมง#nจนวาล์วหลักใกล้จะแตกอยู่แล้วนะคะ"
212140-98 = "ถ้าเพิ่มรอบการผลิตอีกแค่รอบเดียว เตาอบก็จะระเบิดจนโรงอาหารปลิวหายไปทั้งหลังเลย ยังจะให้ทำอีกมั้ยล่ะคะ?"
212140-99 = ""
212140-101 = ""
212140-104 = ""
212140-105 = "มะ... เมื่อกี้เริ่มมีเสียงประหลาดดังออกมาจากเตาอบค่ะ... คล้ายเสียงร้องของสัตว์... หรือสิ่งที่ฉันแตะไปล่าสุดจะมีปัญหาคะ...?"
212140-107 = "เสียงร้อง...? เดี๋ยวนะ ดังมาจากในเตาอบเหรอ...?"
212140-108 = "เรื่องนั้นเอาไว้ก่อนค่ะ! ข้อสอง ปัญหาด้านการเก็บรักษาค่ะ"
212140-109 = "รู้มั้ยคะว่าเมนูส่วนใหญ่ที่พวกคุณต้องการเป็นอาหารที่เน่าเสียง่ายในอุณหภูมิห้อง?"
212140-110 = "ถ้าเอาออกไปทั้งแบบนี้ ไม่ต้องพูดถึงสงครามหรอกค่ะ อีกสองวันนักเรียนทั้งโรงเรียนคงตายเรียบ#nเพราะอาหารเป็นพิษค่ะ"
212140-111 = "ถ้าอยากวางยาพิษคนทั้งเกเฮนน่าขนาดนั้น ก็เชิญยืนกรานต่อไปเลยค่ะ!"
212140-112 = "มะ... ไม่ใช่แบบนั้น..."
212140-113 = "ข้อสุดท้ายก็คือ ปัญหาขาดแคลนกำลังคนค่ะ"
212140-114 = "ต่อให้พวกเราสองคนโต้รุ่งเตรียมเสบียง ก็ไม่มีทางทำอาหารในปริมาณมากกว่าปกติถึง 8 เท่าได้ ด้วยกำลังคนแค่นี้ มันเป็นไปไม่ได้เลยค่ะ!!"
212140-115 = ""
212140-120 = ""
212140-121 = "อ๊ะ! ข้าวปั้นที่ทำจากวัตถุดิบเหลือเมื่อกี้นี้มันมีชีวิตขึ้นมา... ตอนนี้มันกำลังกินอาหารสำรองฉุกเฉินใน#nโกดังอยู่ค่ะ...!"
212140-122 = "ทะ... ทำยังไงดีคะ? หัวหน้า...!!"
212140-124 = "เห็นแล้วใช่มั้ยคะ? แค่กำจัดเจ้าตัวนั้นด้วยกำลังและฆ่าเชื้อโกดัง อย่างน้อยก็ต้องใช้เวลา 3 วันแล้วค่ะ"
212140-125 = "ตะ... ตั้ง 3 วัน?! ถ้าท่านประธานรู้เข้า คงไม่ปล่อยพวกเราไว้แน่...!"
212140-126 = "ถ้างั้นก็ทำเองสิคะ! ไม่ว่ายังไง ในสภาพตอนนี้ต่อให้ฆ่ากันให้ตาย พวกเราก็ทำเสบียงไม่ทันกำหนดที่#nพวกคุณต้องการหรอกค่ะ!"
212140-129 = ""
212140-130 = "อึก ไม่คิดเลยว่าจะเจออุปสรรคที่คาดไม่ถึงแบบนี้..."
212140-131 = "พวกเรามองข้ามความสำคัญของเสบียงไปสินะคะ ถ้าเป็นแบบนี้กำหนดการทั้งหมดคงล่าช้าแน่ค่ะ"
212140-132 = "ตอนนี้... มีวิธีไหนที่ใช้แก้ปัญหาได้บ้าง? รายงานวิธีที่เร็วที่สุดมาก่อน!"
212140-133 = "ถ้าอย่างนั้นละก็...!!"
212140-136 = ""
212140-137 = ""
212140-139 = ""
212140-141 = ""
212140-142 = "เพราะแบบนั้น พวกเราก็เลยถูกส่งตัวมาอย่างเร่งด่วน เพื่อเป็นกำลังช่วยชมรมโภชนาการค่ะ!!"
212140-143 = ""
212140-145 = ""
212140-146 = "แต่พวกเธอทำอาหารไม่เป็นไม่ใช่เหรอ?!"
212140-147 = "อ๊ะ ลืมไปเลย!"
212140-148 = "อย่ามา \"อ๊ะ ลืมไปเลย\" นะ!!"
