212140-172 = ""
212140-174 = ""
212140-175 = "เพื่อเกเฮนน่าอันสมบูรณ์แบบยังไงล่ะคะ..."
212140-176 = "หมายความว่ายังไงน่ะ...?"
212140-177 = "คุณฟูกะ ยังตระหนักไม่ได้อีกเหรอคะ? แรงปรารถนาในการพิชิตที่หายใจอยู่ในเส้นเลือดของเราน่ะค่ะ"
212140-178 = "ที่ผ่านมาเราถูกพันธนาการด้วยความหลงผิดที่เรียกว่าอาหารรสเลิศ แต่ตอนนี้เรามีเป้าหมายเป็นรูปธรรม อย่างการพิชิตคิโวทอสแล้วไม่ใช่เหรอคะ?"
212140-179 = "เส้นทางสู่ชัยชนะเริ่มต้นจากมือของพวกเราเชียวนะคะ"
212140-180 = ""
212140-182 = ""
212140-183 = ""
