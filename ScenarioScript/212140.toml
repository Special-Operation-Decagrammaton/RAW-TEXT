212140-156 = "Wow! That was so fast! Great, I'll start the dough."
212140-157 = ""
212140-159 = ""
212140-161 = "Slicing onions... Such a simple task."
212140-162 = "Cut according to the specified standards without even a millimeter of error..."
212140-163 = ""
212140-165 = ""
212140-166 = ""
212140-167 = "*sigh* My eyes. *sniff* But..."
212140-168 = "I cannot afford to take the preparations lightly. *sniff*"
212140-169 = "Haruna, you're doing way better than I anticipated... But why are you crying so hard?"
212140-170 = "Oh my, it's clearly for..."
212140-171 = "*sniff*"
212140-172 = ""
212140-174 = ""
212140-175 = "...the sake of our glorious Gehenna."
212140-176 = "...What do you mean by that?"
212140-177 = "Fuuka, have you not been left breathless by the surging desire for conquest flowing through your veins?"
212140-178 = "Once, we were obsessed with the illusory pretension of fine dining. Now, all we care for is the conquest of Kivotos."
212140-179 = "The path to victory is built with our very own hands."
212140-180 = ""
212140-182 = ""
212140-183 = ""
212140-184 = "*sniff*"
212140-185 = "...Is it not natural for us to participate in the preparation process?"
212140-186 = "..."
212140-187 = "Fufu, I can't wait for the day we take over Kivotos. Then I wouldn't have to steal gold maguro from other academies. We'd all be one!"
212140-188 = "You know, I think that predictably edible food like this might be much more delightful than some uncertain dining experience!"
212140-189 = "Now then, girls, let's do our best so that glorious day can dawn! ★"
212140-190 = ""
212140-192 = ""
212140-193 = "Something weird is going on with those two. Well, they were always WEIRD, but..."
212140-194 = "...Like they turned into different people?"
212140-195 = "Ah, yeah. That's it. They barely cared about the school before, and now it's like they're in love with Gehenna..."
212140-197 = "It's almost as if Haruna and Akari think there's something...actually more important than food."
212140-198 = "...There's something strange about Gehenna right now."
212140-199 = "I like a world with a variety of tastes..."
212140-200 = "But if the entire world turns into Gehenna like those two say, wouldn't those...rare and special dishes disappear?"
212140-201 = "Ugh... So tragic! I don't want THAT..."
212140-202 = "...And if a war really breaks out, it's going to impact all the good food shops I worked so hard to find."
212140-203 = "They might face ingredient shortages, a bomb could fall on them, or they could even run out of business."
212140-204 = "There's so many places I never got to try..."
212140-205 = ""
212140-207 = ""
212140-208 = "...Then we should stop this war from starting. Or delay it as much as possible."
212140-209 = ""
212140-212 = ""
212140-213 = "H-How?"
212140-214 = "Troops can't march on an empty stomach."
212140-215 = "And WE are in charge of providing provisions for all of Gehenna."
212140-216 = "...So we just need to screw everything up?"
212140-217 = ""
212140-219 = ""
212140-221 = "Yes."
212140-223 = ""
212140-224 = ""
212140-226 = ""
212140-227 = "I-I even sent the grandest epicures in Gehenna to assist them!"
212140-228 = "So HOW is supply production down by half?!"
212140-229 = ""
212140-231 = ""
212140-232 = "W-Well... All we got from them is that there's a \"law of diminishing returns\"!"
212140-234 = "Tch, that sounds wrong, but I've never studied the logistics of cooking for the masses...!"
212140-235 = "I can't believe consolidating all food production to the School Lunch Club would come back to bite us like this!"
212140-236 = "Chairman Makoto, I doubt this is simply a matter of worker synergy."
212140-237 = "What?! What do you mean by that, Senior Administrator Amau Ako?!"
212140-238 = "...It reeks of an intended slowdown. In short, sabotage."
212140-239 = "Surely you're aware of us quashing the rebel organization that opposed a unified Gehenna."
212140-240 = "I believe we should take a similar approach with these dissidents."
212140-241 = "...But we locked up Sensei. They were the central figure. The ringleader!"
212140-242 = "While regrettable, embers often smolder after a fire is extinguished."
212140-243 = "Then what actions should we take?! Would punishing the School Lunch Club President Aikiyo Fuuka set an—!"
212140-244 = ""
212140-248 = "No. That would not relieve the most pertinent setback of this situation."
212140-249 = ""
212140-251 = ""
212140-252 = ""
212140-256 = ""
212140-257 = "No one else is capable of managing food production at this scale, especially in such a tight timeframe. We need Fuuka."
212140-258 = "Fuuka's rebelling because she realizes how important she is."
212140-260 = "...She's right. If we punish the School Lunch Club now, Gehenna's entire supply chain will collapse."
212140-261 = "Then what's your solution? Is there a way to halt the slowdown?"
212140-263 = "To be frank, I can't fathom a method."
212140-264 = "That's right. Fuuka and Juri can be so stubborn."
212140-266 = "It's always a pain when an irreplaceable employee realizes their worth..."
212140-267 = "Tch, I didn't bring this up to hear you all banter. Bring me a solution!"
212140-268 = "Isn't this your fault for failing to train replacements for the School Lunch Club?"
212140-269 = "Silence!!!"
212140-270 = "If you desire, we can increase the duration and scope of the Gourmet Research Society's surveillance."
212140-271 = "Phew... Very well. You may return to your posts. And prepare reports!"
212140-272 = "And please bear in mind that any action against the School Lunch Club will only worsen the situation... Fufu."
212140-273 = "Hmph, wasn't the Gourmet Society the greatest threat to the School Lunch Club? I recall several lunchroom bombings and even kidnapping the School Lunch Club president."
212140-274 = "Such was necessary in the pursuit of fine dining. But now that we have a more important goal, we have reformed."
212140-276 = "And we're the only ones who should be bullying the School Lunch Club, you know? We can't let others think it's okay! ★"
212140-277 = "...Unbelievable."
212140-278 = "Senior Administrator Ako. If this situation persists, how long will it set us back? "
212140-279 = "...At least weeks, if not months."
212140-280 = "...Unacceptable."
212140-281 = "In matters of war, timing is our greatest asset."
212140-282 = ""
212140-286 = ""
212140-287 = "I agree."
212140-288 = "But it appears that our plan to blitzkrieg our primary targets before the General Student Council intervenes has become unviable."
212140-289 = "In fact, there are still several sources of uncertainty. The longer we stall, the worse our outcome."
212140-290 = "While we've also been throttling social media, posts occasionally slip through. We track and remove them, but..."
212140-291 = ""
212140-293 = ""
212140-294 = "..."
212140-296 = "If advancement and capture prove too difficult, we must resort to other methods."
212140-297 = ""
212140-299 = ""
212140-300 = ""
212140-301 = "...Like what?"
212140-302 = ""
212140-304 = ""
212140-306 = ""
212140-307 = ""
212140-308 = "Destroy, and establish a new order on the scorched earth."
212140-309 = "\"Destroy\"... You mean the entirety of Kivotos? How?"
212140-310 = "Kihehe, it's a simple task."
212140-311 = "If we possessed a few dozen chemical warheads...each capable of completely decimating a central D.U. district..."
212140-312 = ""
212140-314 = ""
212140-315 = "Does that mean...?"
212140-316 = "Precisely. We will resurrect one of the Tyrant Emperor's most strategic weapons."
212140-317 = "And what of the time frame?"
212140-318 = "Kihehe, it's a simple, quick task. The details never left my memory."
212140-319 = "...Impressive."
212140-320 = "We've limited ourselves by only considering occupation. But now that the situation has changed, the methods must as well."
212140-321 = "This noble crusade will not be thwarted by a few uncooperative dissidents."
212140-322 = ""
212140-324 = ""
212140-327 = ""
212140-328 = "...Gehenna truly has such underlying potential. I didn't know we could create such things."
212140-329 = "Kihe. We simply did not reveal or act on the possibility."
212140-330 = "However, after realizing that the \"line\" we've been protecting is meaningless, such restrictions are wholly unnecessary."
212140-331 = "And I guarantee you, Gehenna is the most united academy out there. We are one."
212140-332 = "...Precisely. Our glorious Gehenna surpasses all others."
212140-333 = "We will commence the war as soon as the weapons are ready. Everyone, remain on alert and stand by."
212140-335 = "Understood. Ako, brief me on the changes made to our original attack plan."
212140-336 = "Yes, Head Prefect. I will report to you in an hour."
