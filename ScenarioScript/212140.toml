212140-185 = "ถ้างั้นก็ต้องใส่ใจขั้นตอนเตรียมการด้วยสิคะ?"
212140-186 = "..."
212140-187 = "ฮุฮุ ฉันตั้งตารอวันที่รวมคิโวทอสเป็นหนึ่งเลยค่ะ ถึงตอนนั้นก็คงไม่ต้องก่อข้อพิพาทระหว่างโรงเรียน เพราะขโมยมากุโร่สีทองอีกแล้วสินะคะ"
212140-188 = "ความสุขภายใต้ระเบียบที่ถูกควบคุม อาจน่าอภิรมย์กว่าอาหารรสเลิศที่ไม่แน่นอนก็ได้นะคะ"
212140-189 = "เอาละ มาพยายามเพื่อวันนั้นกันเถอะค่ะ★"
212140-190 = ""
212140-192 = ""
212140-193 = "สองคนนั้นเปลี่ยนไปแปลกๆ นะ อ๊ะ ปกติก็แปลกอยู่แล้วนั่นแหละ จะว่ายังไงดี"
