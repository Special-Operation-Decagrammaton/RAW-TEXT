[translation]
1300308-1 = "짧지만 사치스러운"
1300308-2 = "트리니티 분관"
1300308-3 = "후우……."
1300308-4 = "어머, 선생님?"
1300308-5 = "늦은 새벽까지 수고하셨습니다. 지금 돌아가시는 건가요?"
1300308-6 = "아아. 네. 저도 동아리의 중요한 문서 작업이 끝나지 않아서……."
1300308-7 = "이제 겨우 끝낸 참입니다."
1300308-8 = "이래저래 보고서라는 건 누군가의 노동력을 대가로 완성되는 것이라서……."
1300308-9 = "[s] \"고생했어.\""
1300308-10 = "감사합니다. 선생님도 고생많으셨어요."
1300308-11 = "후우…… 새벽 늦게까지 작업했더니 어깨도 결리네요."
1300308-12 = "함께 가시죠. 늦었으니 제가 에스코트해드리겠습니다."
1300308-13 = "(쿠르르릉-- 콰앙--)"
1300308-14 = "……어라."
1300308-15 = "소나기가 오려나 본데요."
1300308-16 = "뛰시죠, 선생님!"
1300308-20 = "(쏴아아아아아아-)"
1300308-21 = "이런……. 더 세게 쏟아지네요."
1300308-22 = "비를 피할 데가……."
1300308-23 = "[s] \"공원으로 가자.\""
1300308-24 = "공원요?"
1300308-25 = "아……. 맞아. 거기라면……."
1300308-27 = "(하스미와 함께 노을을 구경하던 공원에 있는 가건물로 향했다.)"
1300308-30 = "[ns] \"여기서 비를 피하자.\""
1300308-31 = "네. 여기라면…… 괜찮을 것 같네요."
1300308-34 = "― 아아. [wa:1500]다 젖어버렸네요. [wa:3000]곤란하게도."
1300308-37 = "― 흐음. [wa:2000]쉽게 [wa:1000]그칠 것 같진 않은 비네요."
1300308-40 = "― 저와 함께 여기에 꼼짝없이 [wa:2500]갇혀있어야겠네요?"
1300308-43 = "― 후후, [wa:1500]이런 일은 예상하지 못했는데."
1300308-46 = "[wa:3500]― 잠깐이라면… [wa:2000]이런 여유도 괜찮겠죠."
1300308-48 = "[wa:500]― ……저에겐 [wa:2000]사치스럽지만 [wa:2000]소중한 시간입니다."
1300308-51 = "(비는 새벽이 되어서야 간신히 그쳤다.)"
1300308-54 = "……."
1300308-55 = "[s] 하스미를 깨운다."
1300308-56 = "아……."
1300308-57 = "제가 잠깐 졸았나요? 실례했습니다……."
1300308-58 = "아무래도 야근이 잦았던 탓인지……."
1300308-59 = "……."
1300308-60 = "……날이 밝아오고 있네요."
1300308-61 = "[s] \"괜찮아?\""
1300308-62 = "네. 괜찮습니다. 기숙사에서는 야근한다고 얘기해뒀기 때문에……. #n걱정은 안하겠지만."
1300308-63 = "……후후."
1300308-64 = "또 신세를 져버렸네요. 선생님."
1300308-65 = "……잠깐이라고 생각했던 시간을 이렇게나 사치스럽게 잔뜩 가질 줄은."
1300308-66 = "[s] \"응?\""
1300308-67 = "……아무 것도 아닙니다."
1300308-68 = "음. 그럼 다른 누가 보기 전에 전 기숙사로 돌아가봐야겠네요."
1300308-69 = "그럼, 선생님."
1300308-71 = "다음에 또……."
