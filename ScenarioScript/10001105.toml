[translation]
10001105-1 = "제10화;붉은겨울 학원의 혁명적 휴일"
10001105-2 = "붉은겨울 학원 사무국"
10001105-3 = "왔노라, 보았노라, 이겼노라!"
10001105-4 = "보았느냐, 토모에, 콤라드? 이 몸이 완벽한 작전으로 적을 분쇄하는 모습을!"
10001105-5 = "네. 정말 완벽한 지휘였습니다, 체리노 회장님!"
10001105-6 = "각기 다른 소속의 학생들을 규합하여 적진을 향해 나아가는 체리노 회장님의 모습은 분명 학생들의 심상에 깊이 아로새겨져 붉은겨울 학원의 역사에 길이길이 구전되겠지요."
10001105-7 = "아니, 이럴 게 아니라 후대의 학생들도 그 모습을 눈으로 볼 수 있도록 화가를 불러 기록화를 그리게 할까요?"
10001105-8 = "음. 좋은 생각이다, 토모에 총비서실장! 바로 진행하도록!"
10001105-9 = "[s] \"내가 보기에는 막무가내로 소리만 지르는 것처럼 보였는데…….\""
10001105-10 = "그게 무슨 망언인가, 콤라드! #n그것은 학생들의 사기를 돋우기 위한 용맹한 전장의 함성이었느니라! 워 크라이—라고!"
10001105-11 = "그 목소리가 어린아이의 투정처럼 들렸더라면 당장 병원에 가서 귀 치료를 받고 오게나. 그대의 귀에 문제가 있는 게 분명하니!"
10001105-12 = "하아…… 어찌 되었든 간에 사무국에 다시 돌아오니 좋구나."
10001105-13 = "찬장에는 간식이 가득하고, 옥좌는 푹신하니, 집에 돌아온 것처럼 마음이 편안해……. 역시 이 몸의 집무실이라면 이 정도는 되어야지!"
10001105-14 = "오늘 남은 하루는 이 옥좌에 눌러앉아 감자칩을 먹으며 한 발자국도 움직이지 않을 테다!"
10001105-16 = "그전에…… 어디 한 번 쿠데타에 대한 변명을 들어보도록 할까, 마리나 위원장?"
10001105-19 = "으윽……."
10001105-21 = "마리나. 내가 그동안 그대를 얼마나 아끼고 신뢰했었는데, 감히 이 몸의 낮잠 시간을 틈타 쿠데타를 일으키다니!"
10001105-22 = "용서할 수 없어!"
10001105-23 = "면목 없습니다, 체리노 회장님……."
10001105-24 = "흠, 흠!"
10001105-25 = "그래서, 이 몸에게 반기를 들고 일어난 진짜 이유가 뭐지?"
10001105-26 = "……역시 내가 그때 마리나의 푸딩을 몰래 훔쳐먹은 것 때문에 화가 난 거야?"
10001105-27 = "아니면 마리나가 아끼는 곰인형을 몰래 베고 자서……?"
10001105-28 = "푸딩과 곰인형이요? 그게 무슨 말씀이신지……?"
10001105-29 = "기, 기억나지 않으면 떠올리지 않아도 괜찮느니라!"
10001105-30 = "(시, 실수할 뻔했네. 하마터면 마리나가 기억하지도 못하는 잘못을 내 입으로 먼저 실토할 뻔했어!)"
10001105-31 = "……엣헴!"
10001105-32 = "그럼 푸딩도 곰인형도 아니라면 무슨 이유 때문에 쿠데타를 일으킨 거지?"
10001105-33 = "저, 그게…… 사실은 체리노 회장님의 석상을 실수로 깨트려서……."
10001105-34 = "석상? 무슨 석상?"
10001105-35 = "신관 복도에 있는 회장님의 석상 말입니다. 지난달 신관 증축을 기념하여 체리노 회장님의 근엄한 모습을 석상으로 만들어 그곳에 설치했었지요."
10001105-36 = "(그, 그런 석상이 거기에 있었던가……? 기억이 나는 것 같기도 하고…….)"
10001105-37 = "그런데 실수로 그 석상에 부딪혀서 얼굴의 수염 부분이 깨져 나가는 바람에…… 회장님의 권위를 제 손으로 실추시키고 말았습니다."
10001105-38 = "고의가 아니었다고는 하지만, 분명 회장님께 용서받지 못할 거라 생각해서, 그만……"
10001105-39 = "뭐야. 겨우 그런 것 때문에 쿠데타를 일으킨 건가."
10001105-40 = "네? 그 말씀은……."
10001105-41 = "마리나, 그대는 붉은겨울 학원 사무국의 보안위원장이자, 이 몸의 충실한 오른팔으로 그동안 수많은 일을 해왔었네."
10001105-42 = "위원장이 없었더라면 아무리 이 몸이 유능하다 하더라도 지금의 자리까지는 오를 수 없었겠지. 그대를 잃는 것에 비하면 석상의 수염이 깨지는 건 사소한 문제라네."
10001105-43 = "이 몸은 관대하니까— 그런 사소한 일로 숙청 따위는 하지 않는다고. 하하하!"
10001105-44 = "회장님……!"
10001105-46 = "……라고 말할 줄 알았냐!"
10001105-48 = "우, 우앗?"
10001105-49 = "너 때문에 내가 얼마나 고생한 줄 알아? 낮잠도 제대로 못 자고, 간식도 제대로 못 먹고! 학생들에게는 꼬맹이라고 무시당하기만 하고!"
10001105-50 = "석상의 콧수염은 아무래도 상관없지만, 쿠데타를 일으킨 죄는 절대로 용서할 수 없어!"
10001105-51 = "체, 체리노 회장님! 제발 한 번만 용서를!"
10001105-52 = "안 돼! 이번 일은 절대로 용서 못 해!"
10001105-53 = "토모에, 지금 당장 마리나와 그 일당을 끌고 가 화장실 청소 한 달 형에 처하도록!"
10001105-57 = "숙청 퍼레이드, 개시다!"
10001105-59 = "사건이 벌어지고 일주일 뒤. 이반 쿠팔라 축제 당일."
10001105-61 = "붉은겨울 학원 정문"
10001105-63 = "어서 오십시오, 선생님."
10001105-64 = "체리노 회장께서 안에서 기다리고 계십니다."
10001105-65 = "이쪽으로……."
10001105-68 = "붉은겨울 학원 회장 집무실"
10001105-69 = "후, 후, 후. 어서 오게나. 콤라드. #n멋진 이반 쿠팔라가 되기를!"
10001105-70 = "[s] \"멋진 이반 쿠팔라가 되기를, 체리노.\""
10001105-71 = "붉은겨울 학원의 경사스러운 축제를 이렇게 콤라드와 함께 보낼 수 있다니, 이 몸도 기쁘기 그지없군."
10001105-72 = "본래 이반 쿠팔라 축제에는 외부인을 들이지 않는 것이 원칙이지만……"
10001105-73 = "콤라드에게는 지난번의 사건 때 큰 실례를 끼쳤으니, 학생회장의 권한으로 그대를 특별 초청한 것이라네. 자랑스럽게 여겨도 좋아! 하하하!"
10001105-74 = "그래서 말인데, 콤라드. #n일주일 전과 비교하여 무언가 바뀐 것처럼 보이지 않는가?"
10001105-75 = "[s] \"학교가 좀 더 깨끗해진 것 같아.\""
10001105-76 = "음, 그야 마리나와 보안위원들이 매일매일 열심히 학교를 청소하고 있기 때문이지."
10001105-77 = "처음에는 화장실 청소만 맡기려고 했는데, 생각보다 청소에 탁월한 재능을 보여서 말이야."
10001105-78 = "이대로 가다가는 청소부장의 직위를 빼앗기게 될까 두려울 정도라네."
10001105-79 = "……아니, 학교의 모습이 아니라! #n이 몸에게 바뀐 점이 없냐고 물은 것이네!"
10001105-80 = "[s] \"체리노의 키가 좀 더 큰 것 같아.\""
10001105-81 = "그, 그, 그게 정말인가? 콤라드!"
10001105-82 = "키재기용 줄자를 가져오게! 당장 키를 재봐야겠어!"
10001105-86 = "……뭐야, 조금도 자라지 않았잖나. #n지금 나를 놀리는 겐가, 콤라드!"
10001105-87 = "콤라드가 아무리 샬레의 선생이라고는 하지만, 이 위대하신 체리노 님을 놀리는 것은 허락되지 않는다고!"
10001105-88 = "흠흠! 물론 키가 자라는 것도 중요하지만……"
10001105-89 = "내가 처음에 말하려고 했던 변화는 바로 내면의 변화를 말하는 것이었네."
10001105-90 = "지난번의 소동을 거치며 이 몸은 그동안 알지 못했던 붉은겨울 학원 학생들의 고충에 귀를 기울이게 되었지."
10001105-91 = "토모에 비서실장의 말에 의하면 학생들의 고충을 들어주고, 공감하며, 해결책을 약속하는 이 몸의 모습은 마치 선생과도 같았다고 한다……."
10001105-92 = "선생의 일이란, 어른의 일! 평범한 학생 따위가 수행할 수 없는 어려운 일이지!"
10001105-93 = "그 말인즉, 이 몸은 지난 소동을 거치며 그전까지는 경험해 보지 못한 어른의 계단을 올랐다는 뜻이다!"
10001105-94 = "어떤가, 콤라드. 전과는 달리 이 몸에게서 어른의 매력이 느껴지지 않는가? 후후후……!"
10001105-95 = "[s] \"그때 다른 학생들에게 했던 약속들은 모두 지켰어?\""
10001105-96 = "어, 어……? 야, 약속들 말인가?"
10001105-97 = "그게…… 당장 게헨나 학원과 트리니티 학원을 공격하는 건 어려운 데다가……"
10001105-98 = "게다가 특별반의 학생들은 계속 나를 꼬맹이라고 부르지 않았나! #n괘씸죄를 물어서라도 당장 복권시켜줄 수는 없어!"
10001105-99 = "약속은 보류다! 당분간은 이대로 현상 유지이니라!"
10001105-100 = "여하튼, 콤라드. 오늘은 시간도 충분하니 나와 함께 오붓이—"
10001105-103 = "체리노 회장님, 큰일입니다!"
10001105-104 = "뭔가, 토모에 총비서실장. #n콤라드와 단둘이 이야기할 때는 방해하지 말라고 했을 텐데!"
10001105-105 = "그게…… <구교사 227호 특별반>의 학생들이 지난번의 약속을 지키라며 사무국으로 몰려들고 있습니다!"
10001105-106 = "그뿐만이 아니라 <지식해방전선>과 <용역부>의 학생들도 함께……."
10001105-107 = "뭐라고? 이 참을성도 없는 녀석들 같으니라고! #n소동이 마무리된 지 얼마나 지났다고 축제가 끝나기도 전에 새로운 쿠데타라니!"
10001105-108 = "마리나 보안위원장과 친위대를 내보내 쿠데타를 진압하도록 해라!"
10001105-110 = "하지만 마리나 위원장은 밤새도록 화장실 청소를 하느라 지쳐서…… 지금 싸울 수 있는 상태가 아닙니다."
10001105-111 = "게다가 친위대원의 대부분도 지난번의 숙청으로 쫓겨나거나 근신 중이라……."
10001105-113 = "뭐야, 또 도망쳐야 하는 거야? 이제는 어디로 도망치라고!?"
10001105-114 = "실각은 이제 지긋지긋해—!"
10001105-115 = "혁명의 이반 쿠팔라"
