[translation]
1015402-1 = "감각의 예술"
1015402-2 = "(중요한 일정이니 30분 정도 일찍 약속 장소를 찾아갔다.)"
1015402-5 = "안녕하세요, 선생님. 일찍 오셨군요?"
1015402-6 = "[s] \"마나미도 일찍 왔네?\""
1015402-7 = "선생님을 기다릴 겸, 이곳에서 사색의 시간을 보내려 했거든요."
1015402-8 = "와일드헌트와 샬레가 정식으로 진행하는 교류회이니만큼 조심해야 할 것도 많고요."
1015402-9 = "어떤 화법으로 선생님을 압도할까, 어떤 주제로 이번 교류회에서 우위를 점할까……."
1015402-10 = "그런 생각은 절대로 하지 않았어요."
1015402-11 = "[s] \"그, 그렇구나!\""
1015402-12 = "약속 시간보다 일찍 나오신 걸 보면, 선생님도 이번 만남을 중요하게 생각하시는 것 같네요."
1015402-13 = "후후, 시작부터 느낌이 좋아요."
1015402-14 = "그럼 뜸 들일 것 없이 곧바로 가실까요?"
1015402-15 = "오늘의 전장으로."
1015402-17 = "(이후 마나미와 함께 '전장'으로 향했다.)"
1015402-19 = "와일드헌트 미술관"
1015402-20 = "[ns] \"오, 여기는?\""
1015402-21 = "우리 학원의 다양한 작품이 전시된 미술관입니다."
1015402-22 = "정식 교류회이니만큼, 학원을 대표하는 곳으로 일정을 잡아 보았습니다."
1015402-23 = "학원의 다양한 작품들이 전시된 미술관. 이곳보다 우리 와일드헌트를 상징하는 곳도 없겠죠."
1015402-24 = "이곳에서 함께 작품들을 관람하며, 다양한 감성을 느끼는 시간이 되었으면 좋겠습니다."
1015402-25 = "[s] \"응! 잘 부탁해!\""
1015402-26 = "네. 저도 잘 부탁드립니다."
1015402-27 = "그럼 관람에 앞서, 간단한 질문이 있는데요."
1015402-28 = "선생님은 어떤 기준으로 예술의 가치를 판단하시나요?"
1015402-29 = "[s] \"간단한 질문이 아닌데?!\""
1015402-30 = "너무 어렵게 생각하실 것 없습니다. 애초에 정답이 없는 영역이니까요."
1015402-31 = "예를 들자면……"
1015402-32 = "작품이 품은 본연의 아름다움, 그 안에 담긴 작가의 의도와 미덕. #n또는 작품의 희소성이나 역사적 상징."
1015402-33 = "정말 다양한 기준이 있죠. #n선생님은 이 중에 어떤 쪽이실까요?"
1015402-34 = "[s1] \"전부 훌륭한 기준인 것 같아.\"\n[s2] \"모든 걸 종합해서 봐야 하지 않을까?\""
1015402-37 = "후후, 그러시군요."
1015402-38 = "솔직히 말해서, 예상했던 대답이라 높은 점수는 드리지 못하겠습니다."
1015402-39 = "제가 몇 점을 드렸는지는 우호적인 협력 관계를 위해 비밀로 해두죠."
1015402-40 = "[s] \"크읏!\""
1015402-41 = "아아, 역시 반응이 재미있으시네요. 농담이니 너무 진지하게 생각하지 마시길."
1015402-42 = "사실 선생님의 대답이 가장 상식적인 대답이니까요."
1015402-43 = "[s] \"마나미의 기준은 어느 쪽이야?\""
1015402-44 = "어머, 곧바로 저를 시험하시는 건가요?"
1015402-45 = "좋습니다. 그 도전, 받아들이죠."
1015402-46 = "저에게는 예술을 판단하는 저만의 기준이 있답니다. 그건 바로……."
1015402-49 = "저의 심미안이죠."
1015402-50 = "[s] \"……응?\""
1015402-51 = "저에겐 모든 예술의 가치를 꿰뚫어 보는 심미안이 있답니다."
1015402-52 = "유치한 농담으로 하는 말이 아니라, 진심으로요."
1015402-53 = "이러한 안목 덕분에, 많은 것이 부족했던 제가 평의회장 자리에 오를 수 있었죠."
1015402-54 = "[s] \"예술의 가치를 꿰뚫어 보다니…… 대단하네.\""
1015402-55 = "하지만 모두가 제 심미안에 동조하지는 않죠. #n말씀드렸듯, 예술엔 다양한 관점이 있으니까요."
1015402-56 = "그렇기에 때에 따라서는 강력한 규칙과 통제가 필요한 거랍니다."
1015402-57 = "어머, 방금 속으로 '그래서 와일드헌트의 교칙이……' 같은 말을 하지 않으셨나요?"
1015402-58 = "[s] \"으, 으흠!\""
1015402-59 = "후후……. 뭐, 너무 걱정하지 마세요. 제 심미안은 정말 관대하니까요."
1015402-60 = "예술을 돈으로만 보는 배금주의를 싫어한다는 것만 빼고요."
1015402-61 = "금액 또한 예술을 평가하는 기준 중 하나일 것이라는 점은 이해하고 있습니다. #n하지만 이 세상에는 값을 매길 수 없는 작품도 많은 법이죠."
1015402-62 = "[s] \"이를테면, 창세의 초상 같은?\""
1015402-63 = "네. 잘 알고 계시군요."
1015402-64 = "그 무엇과도 바꿀 수 없는, 우리 학원의 대표 작품이죠."
1015402-65 = "그 외에도 가격으로 책정할 수 없는 작품이 많답니다."
1015402-66 = "아. 말이 나온 김에, 그중에서 가장 특별한 작품을 소개해 드리고 싶군요."
1015402-67 = "어떠신가요? 흥미가 있으신가요?"
1015402-68 = "[s] \"응! 궁금해!\""
1015402-69 = "좋습니다. 그럼 이쪽으로……."
1015402-71 = "(이후 마나미의 안내에 따라 미술관 안쪽으로 들어갔다.)"
1015402-76 = "[ns3] \"닫힌 커튼……?\"\n[ns4] \"저 뒤에 마나미가 말한 작품이 있는 거야?\""
1015402-79 = "네. 기대되시죠?"
1015402-80 = "그럼, 커튼을 걷겠습니다."
1015402-83 = "자, 이것이 바로……."
1015402-85 = "가격으로 책정할 수 없는, 우리 학원의 특별한 작품입니다."
1015402-88 = "(하지만 마나미의 설명과 달리, 그저 백지와 액자였다.)"
1015402-89 = "어떠신가요? 이 작품과 마주하신 소감이?"
1015402-90 = "[ns5] (이건 시험당하고 있는 걸까…….)\n[ns6] (여기서는 대답을 신중히 해야 한다!!)"
1015402-95 = "[ns7] \"그냥 백지 액자잖아?\"\n[ns8] \"공백의 허전함을 표현한 작품이구나?\""
1015402-96 = "네. 이것은 그저 백지가 걸린 액자. 하지만 제가 바라던 대답은 아니네요."
1015402-97 = "후후…… 매우 흥미로운 답변이네요."
1015402-98 = "사실, 조금 이상했죠? 이런 백지가 걸린 액자가 가격을 책정할 수 없는 작품이라니."
1015402-99 = "하지만 이 백지 액자에 담긴 사연을 알게 되신다면, 모든 것을 이해하실 겁니다."
1015402-101 = "때는 지금으로부터 10년 전……."
1015402-103 = "야심한 시간, 경비 교대 근무자로 위장한 도둑이 이곳에 침입했습니다."
1015402-104 = "수상함을 느낀 당직자가 곧바로 신고 및 대응에 나섰지만, 도둑의 손이 더 빨랐죠."
1015402-105 = "도둑은 10분도 되지 않는 짧은 틈에, 커튼 안쪽의 작품을 훔쳐 달아나 버렸답니다."
1015402-106 = "<오디세이아의 폭풍>. 거센 파도 위에서 사투를 벌이는 선원들이 담긴 명화였죠."
1015402-107 = "액자를 바닥에 던져 깨뜨리고, 칼로 작품을 잘라내 훔쳐 간……. #n정말 야만적인 사건이었죠."
1015402-108 = "당시의 평의회장은 모든 힘을 동원해 작품을 되찾으려 했지만, 실패하고 말았습니다."
1015402-109 = "용의주도한 범인은 아무런 단서도 남기지 않았거든요."
1015402-110 = "범인의 얼굴을 목격했던 당직자의 진술로 몽타주가 만들어지긴 했습니다만……."
1015402-111 = "비슷한 인상을 가진 인물이 워낙 많아 용의자를 특정하지도 못했죠."
1015402-112 = "훔쳐 간 작품도, 그 뒤로는 세상에 모습을 드러내지 않았고요."
1015402-114 = "……이후 해당 사건은 현재까지 영구미제로 남아 있습니다."
1015402-115 = "10년이 지난 지금도 이 사건을 해결하기 위해 노력하고 있습니다만……."
1015402-116 = "오랜 시간이 흘러버린 탓에 단서가 쉽게 잡히지 않는군요."
1015402-117 = "지금은 그저 작품이 돌아오길 바라는 마음으로 당시에 사용된 액자를 걸어두는 것밖에……."
1015402-118 = "[s9] \"그래서 이런 액자가…….\"\n[s10] \"정말 안타까운 사건이네…….\""
1015402-121 = "작품은 사라졌지만, 그 작품을 그리워하는 사람들의 마음은 계속 이곳에 남아 있어요."
1015402-122 = "사라진 작품을 백지 위에 눈으로 그리며, #n그로 인해 피어난 감정들을 각자의 선율로 마음에 새기고 있죠."
1015402-123 = "물질적인 예술과, 그 물질을 넘어서는 염원의 가치."
1015402-124 = "……이것이야말로 감각의 예술이 아닐까 하네요."
1015402-125 = "[s11] \"……작품을 꼭 되찾았으면 좋겠네.\"\n[s12] \"내가 도와줄 수 있는 건 없을까? \""
1015402-128 = "후후, 선뜻 말씀해 주셔서 정말 감사합니다."
1015402-129 = "도움이 필요한 순간이 찾아온다면, 부담 없이 선생님께 요청하도록 하죠."
1015402-130 = "사라진 작품을 되찾는 건, 그 사건 이후로 쭉 우리 예술 평의회의 염원이었어요."
1015402-131 = "평의회장이자, 예술품 수집가인 저의 숙원이기도 하고요."
1015402-132 = "후후, 선생님의 협력을 얻어낸 것만으로도 이 자리를 마련한 의미가 있네요. #n가치 있는 연결을 형성하는 건 아주 기쁜 일이죠."
1015402-134 = "(이후 마나미와 미술관의 작품을 보며 다양한 이야기를 나누었다.)"
1015402-135 = "(예술을 향한 마나미의 깊은 생각을 확인할 수 있었던, 정말 뜻깊은 시간이었다.)"
