[translation]
10020025-5 = "제2구역의 <차원엔진> 파괴했습니다!!"
10020025-11 = "시, 시로코 씨, 다시 도망치려고 하고 있어요!"
10020025-28 = "기다려, 시로코!!"
10020025-29 = "시로코 쨩!!"
10020025-35 = "큭……."
10020025-42 = "아, 아아…… 다시 놓쳐버렸어요……?"
10020025-48 = "이런 패턴, 앞으로도 계속 반복되는 걸까요……."
10020025-49 = "이래서야 붙잡을 수 있는 게 맞는 거야……? 저런 식으로 도망치고 있는데."
10020025-51 = "……."
10020025-52 = "아니. 뭔가…… 달라."
10020025-53 = "네?"
10020025-54 = "저 녀석…… 저 시로코는…… 우리를 피하고 있는 것 같아."
10020025-55 = "저, 저희를요?"
10020025-56 = "그런 느낌이 들었어. 마치 우리와 만나는 것을 두려워하는 느낌이……."
10020025-57 = "……."
10020025-59 = "뭐? 어, 어째서? 두려워할 것까진 없는 거 아냐?"
10020025-60 = "……."
10020025-68 = "아아. 2구역의 <차원엔진>을 파괴한 것까지 확인했어."
10020025-69 = "이걸로 총 4개의 구역 중 두 개를 확보한 거야. 절반이나 가져온 거지."
10020025-70 = "앞으로 한 개의 구역만 더 점령하면…… 승기는 우리 쪽으로 기울게 될 거야."
10020025-72 = "그러네요, 방주의 연산 기능을 절반이나 확보했으니, 지금부터는 좀 더 공격적으로 해볼까요?"
10020025-73 = "지금부터 시로코 씨의 위치를 추적해 보겠습니다."
10020025-74 = "자유롭게 이동하는 그녀의 능력을 봉쇄하려면, 언제든지 추적 가능하게 방울을 매달아 놓는 게 좋겠죠."
10020025-75 = "방주의 중추 시스템을 해킹…… 방주 내부에 존재하는 모든 방어 시스템, 경보 장치, 통신망을 휘저어 보겠어요."
10020025-76 = " 뭔가 성과가 생기면 말씀드릴게요."
10020025-77 = "……네. 부탁드립니다."
10020025-78 = "그럼 선생님, 저희는 다음으로 넘어가겠습니다."
10020025-79 = "아트라하시스의 방주의 제3구역입니다. 계속해서 지휘를 부탁드립니다!"
10020025-81 = "뭐, 그렇게 돼서 말야. 지금부터는 우리가 돕도록 할게~ 선생."
10020025-82 = "네! 구역을 두 개나 점령해서 지금 방어에 여유가 생겼거든요."
10020025-83 = "네. 그래서 우트나피쉬팀의 방어는 게임개발부 분들과 미식연구회 분들께 맡기고, 저희는 선생님을 돕기로 했습니다."
10020025-85 = "맞아!! 시로코 선배를 찾아내는 거야!! 그리고 가능하다면 붙잡아서 포획하는 거야!!"
10020025-86 = "응응! 사냥 시작이에요~♧"
