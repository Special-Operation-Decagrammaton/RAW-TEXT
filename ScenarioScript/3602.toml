[translation]
3602-1 = "단맛과 노스탤지어 2"
3602-3 = "(다음 날, 미카와 나기사는 세이아가 운전하는 오토바이를 타고 출발했다.)"
3602-4 = "(그리고 나기사의 눈은 여전히 풀려 있었다.)"
3602-9 = "(부우우웅…….)"
3602-10 = "저를 어디로…… 끌고 가는 거죠?"
3602-11 = "응, 나기 쨩이 가장 좋아할 만한 곳으로 가고 있지☆."
3602-12 = "제가…… 좋아할…… 곳……?"
3602-13 = "산해경 고급중학교 외곽에 유명한 홍차 공방이 있다고 하더군요, 나기사."
3602-14 = "그 공방으로 가는 중입니다."
3602-15 = "세이아 쨩! 그걸 스포일러 하면 어떡해?!"
3602-16 = "심신 안정을 위한 투어인데, 굳이 궁금증만 키워줄 필요는 없잖아요."
3602-18 = "심신 안정……."
3602-19 = "그럴 거면 그냥…… 기숙사에 두지……."
3602-20 = "나기 쨩, 기숙사 침대에서도 서류 들여다보고 있던 거 내가 모를 줄 알고?"
3602-21 = "오늘 하루는 다 놓고 푹 쉬라는 거야☆."
3602-22 = "향긋한 홍차와 함께 말이야."
3602-23 = "홍……차……."
3602-26 = "도착했습니다. 내리죠."
3602-32 = "와-오. 여기가 그 공방이구나."
3602-33 = "어서 오십시오! 공방 투어 예약하신 분들이죠?"
3602-34 = "먼저 홍차를 만드는 과정을 가볍게 둘러보신 후, 시음과 블렌드 체험으로 넘어가겠습니다!"
3602-35 = "공방에 직접 오셔야만 즐길 수 있는 차들도 있으니, 기대해 주시지요!"
3602-36 = "좋아! 가자, 나기 쨩!"
3602-43 = "……."
3602-44 = "자, 그러면 여기부터 가시죠."
3602-45 = "홍차를 만들려면 먼저 찻잎의 수분을 빼고 잎을 시들게 만들어야 한답니다. 그것을 위해서 우선……."
3602-57 = "(그렇게 공방 주인과 함께 홍차 생산 공정을 둘러보았다.)"
3602-58 = "(공방 주인의 입담이 좋아 투어는 지루하지 않았다.)"
3602-59 = "(……하지만, 나기사의 눈은 여전히 초점을 찾지 못하고 있었다.)"
3602-61 = "자, 그럼 블렌드 체험을 해보도록 할까요?"
3602-62 = "홍차는 한 가지 찻잎만 가지고 만들기도 하지만, 여러 종의 찻잎이나 과일, 향신료 등과 섞어 향을 북돋우기도 한답니다."
3602-63 = "자, 그럼 일단 이 바구니들에 담긴 재료들부터 보시죠."
3602-64 = "코를 대고 향기를 맡아보셔도 좋고요."
3602-65 = "……."
3602-69 = "스으으읍……."
3602-70 = "……."
3602-71 = "어때요, 향이 참 좋죠?"
3602-72 = "……후후."
3602-78 = "앗?!"
3602-79 = "나기사?!"
3602-80 = "나기 쨩이 찻잎에 얼굴을 파묻었어……!"
3602-81 = "나기 쨩! 괜찮아?!"
3602-83 = "……."
3602-84 = "푸후으으……."
3602-85 = "싫어어어……."
3602-86 = "저는 그냥 구석에 박혀 있을래요……."
3602-87 = "나는 홍차가 될래요……."
3602-88 = "뜨거운 물에 푹 우러나서…… 멀리멀리 흘러갈 거예요……."
3602-89 = "나기 쨩이 고장 났어……!"
3602-90 = "……아니, 이러는 쪽도 어떻게 생각해 보면 익숙하긴 한데……!"
3602-91 = "진정해요, 미카."
3602-92 = "사장님, 일단 이분이 얼굴을 파묻은 찻잎은 따로 빼서 계산해 주세요."
3602-93 = "아, 예! 알겠습니다……!"
3602-95 = "(그렇게 나기사 향이 첨가된 찻잎 한 바구니를 구매한 뒤, 셋은 공방을 빠져나왔다.)"
