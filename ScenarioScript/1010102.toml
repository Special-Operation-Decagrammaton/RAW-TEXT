[translation]
1010102-1 = "식당 아르바이트"
1010102-4 = "(사오리의 연락을 받고 배가 고파져서, 해변가 식당으로 향했다.)"
1010102-10 = "주문한 오코노미야키다. 맛있게 드세요."
1010102-11 = "오, 먹음직스럽구만!"
1010102-12 = "근데 마요네즈는 안 뿌려줘?"
1010102-16 = "아, 아차! 미안하다! 금방 가져오겠다!"
1010102-21 = "저기요! 여기 메뉴판도 안 갖다주셨는데요!"
1010102-22 = "미안하다! 조금만 기다려 줘!"
1010102-27 = "[ns] (으음, 조금 여유 있게 기다릴까…….)"
1010102-32 = "헉, 허억……"
1010102-33 = "어서 오세요. 손님. 메뉴를 고르고 나서……"
1010102-37 = "음? 선생?"
1010102-38 = "방문해 준 건가. 고맙다."
1010102-39 = "[s] \"상당히 바빠 보이네.\""
1010102-40 = "선생의 눈에도 그렇게 보이나. 일이 많은 건 아니지만, 아직 익숙지 못한 상태다."
1010102-41 = "여러모로 서툰 모습을 보였군."
1010102-42 = "자, 여기 메뉴판이다."
1010102-43 = "먹고 싶은 음식을 골라서 내게 말해 줘."
1010102-44 = "[s1] \"으음…… 굉장히 많은걸.\"\n[s2] \"혹시 추천 메뉴가 있을까?\""
1010102-47 = "음, 내게 물어도 곤란하다만……"
1010102-51 = "그렇지. 가장 주문량이 많은 메뉴는 추천해 줄 수 있다."
1010102-52 = "여기, <특제 오므라이스+정성 서비스>."
1010102-53 = "이 메뉴가 가장 인기가 좋더군."
1010102-54 = "응? 정성 서비스란 게 뭐냐고?"
1010102-55 = "오므라이스 위에 케첩으로 그림을 그려 주는 서비스다. 어차피 먹을 음식에 왜 그런 수고를 들이는지는 잘 모르겠다만……."
1010102-59 = "[ns] \"그걸로 주세요!\""
1010102-60 = "으, 응?! 선생도 그걸 주문하는 건가?"
1010102-61 = "알겠다만…… 아직 그림에 서툴러서 조금 이상하게 나올 수도 있는데……."
1010102-62 = "[s3] \"오히려 그쪽이 더 좋습니다……!\"\n[s4] \"사오리가 직접 그려준 그림……!\""
1010102-65 = "그런가……?"
1010102-66 = "그렇다면 알겠다. 조금만 기다리—"
1010102-71 = "이봐! 지금 이게 뭐 하자는 거야!"
1010102-75 = "저쪽에서 문제가 생긴 모양이군."
1010102-76 = "[s] \"안 가봐도 돼?\""
1010102-77 = "으음, 신경은 쓰인다만, 아직 주문을 받는 중이다."
1010102-78 = "선생도 지금은 손님이니, 손님에게는 최선을 다해야……."
1010102-83 = "책임자 나와, 당장!"
1010102-84 = "으으음……."
1010102-85 = "[s] \"역시 가 보는 편이 좋을 것 같네…….\""
1010102-86 = "미안하다. 그럼 빠르게 다녀오지."
1010102-90 = "[ns] 불안하니 사오리를 따라가 본다."
1010102-98 = "이 식당 엉망이구만! 메뉴판에 적힌 대로 나오지 않으면 그건 사기잖아!"
1010102-99 = "난 이런 식당에 돈 못 내!"
1010102-104 = "당신은 분명 방금 전 내가 오므라이스를 서빙한……."
1010102-105 = "음식에 뭔가 문제라도 있나?"
1010102-106 = "그래, 이 오므라이스에 심각한 문제가 있잖아!"
1010102-110 = "네 두 눈으로 똑똑히 봐!"
1010102-114 = "……평범한 오므라이스군. 미안하지만 잘 모르겠다."
1010102-115 = "[s] (……그냥 먹다 남은 오므라이스인데?)"
1010102-116 = "이것 봐! 자기 문제가 뭔지도 모르고 있잖아!"
1010102-117 = "메뉴판에 적힌 설명에는 케첩으로 고양이를 그려 준다고 되어 있지!"
1010102-121 = "근데 이건 고양이가 아니라 토끼잖냐!"
1010102-122 = "[ns] \"그게 무슨 억지야!\""
1010102-123 = "손님 상대로 사기나 치고 말이야!"
1010102-124 = "난 이런 식당에 돈 못 내!"
1010102-128 = "뭣……!"
1010102-132 = "그렇군, 확실히 그렇게 보일지도 모르겠어."
1010102-133 = "주문한 것과 다른 물건을 내놓은 것은 나의 실책. 이건 내가 책임져야 할 문제다."
1010102-134 = "음, 그렇지, 그렇지. 이제야 알아듣는군."
1010102-135 = "[s] \"사오리, 그럴 필요 없—\""
1010102-140 = "그러니까, 손님이 만족할 때까지 고양이를 그리겠다!"
1010102-145 = "뭐? 그, 그게 무슨……!"
1010102-146 = "난 그런 걸 바란 게 아니라……!"
1010102-147 = "걱정 마라. 내가 그린 것 중 가장 완벽한 고양이를 그려 보일 테니……!"
1010102-148 = "오므라이스와 케첩 통을!"
1010102-152 = "하앗!"
1010102-153 = "자, 잠깐만……!"
1010102-155 = "(……1시간 후.)"
1010102-159 = "자, 지금까지 했던 것 중 가장 잘 나왔다……! 어떤가?"
1010102-160 = "아, 아니, 내 말은 그게 아니라……!"
1010102-161 = "아직 부족한 건가."
1010102-162 = "좋다. 될 때까지 해 주마!"
1010102-168 = "(4시간 후…….)"
1010102-172 = "어떤가! 이 정도면 최선의 고양이 그림이라 할 수 있겠지!"
1010102-173 = "그만…… 그만……!"
1010102-174 = "역시 부족한가."
1010102-178 = "한 번 더……!"
1010102-182 = "제발 그만해 주세요! 내가 잘못했으니까!"
1010102-183 = "자 여기 돈! 거스름돈은 필요 없어!"
1010102-188 = "자, 잠깐 기다려!"
1010102-189 = "이번에는 진짜 잘 그려졌는데……!"
1010102-193 = "……가버렸나."
1010102-194 = "선생, 그 정도로 내 그림이 구제 불능인가?"
1010102-195 = "[s] \"……그림 때문은 아니라고 생각해.\""
1010102-196 = "음?"
1010102-197 = "……그게 정말인가? 돈을 내기 싫어서 고양이 그림을 핑계 댔던 것뿐이라고?"
1010102-198 = "그렇군…… 뜻대로 안 되자 계산하고 도망간 건가."
1010102-199 = "고맙다, 선생. 공부가 되었어. 오늘 일은 확실히 기억해 두겠다."
1010102-200 = "……그리고 꼬투리 잡히지 않도록, 케첩 그림도 좀 더 연습해야겠군."
