[translation]
10036060-1 = "제6화;어둠 속 습격자"
10036060-2 = "(물총 대회가 끝나고, 세 사람 몰래 사오리를 찾아갔다.)"
10036060-7 = "아, 선생, 무슨 일로?"
10036060-8 = "[s] \"별 건 아니고, DJ 공연 준비는 잘 되고 있나 궁금해서.\""
10036060-9 = "아, 그거라면 착실히 준비 중이다. 방금 무대 근처 청소를 끝낸 참이야."
10036060-10 = "응? 주변이 좀 어수선하다고? ……정확히 봤군."
10036060-15 = "비, 빈틈없이 붙어. 혼자 있다간 습격이 있을지도 모르니까……!"
10036060-16 = "아유, 또 그러신다. 여긴 완전 안전하다니까요?"
10036060-17 = "그래도 DJ님 말씀이니 경호 인력을 충원했지요. 걱정 마세요."
10036060-18 = "으음…… 이대로 괜찮을지……."
10036060-25 = "DJ B.o.B가 안전에 각별히 신경을 써야 한다고 주장해서 말이다."
10036060-26 = "공연장 근처 외곽을 경계하던 병력까지 끌어서 경호하는 중이다."
10036060-27 = "다소 기우라고는 생각한다만, 역시 조금……."
10036060-28 = "[s] \"걱정되는 거지?\""
10036060-29 = "……맞아. 말하자면 직업병 같은 거다. 별일 아니라고는 생각하지만 괜히 마음에 걸리는군."
10036060-30 = "[s] \"사오리 다운걸. 그럼 어디 갔다 와 볼까?\""
10036060-31 = "음, 그게 좋겠어."
10036060-32 = "외곽의 병력이 이동했다면 방비도 자연히 약해졌을 테니……."
10036060-35 = "오케이, 준비 끝."
10036060-36 = "남은 건 시작 신호뿐인가! 정찰조! 축제장을 염탐한 결과는 어때?"
10036060-37 = "……교수의 예상대로야."
10036060-38 = "DJ가 경호를 요청해서, 축제 외곽을 지키던 헬멧단 병력이 빠졌어."
10036060-39 = "그래서 지금은 경계가 느슨한 상태."
10036060-40 = "신기할 정도로 들어맞았는걸……."
10036060-44 = "교수다!"
10036060-45 = "얼른 받아 봐!"
10036060-51 = "네, 여러분. 저랍니다."
10036060-52 = "준비는 되셨나요?"
10036060-54 = "물론이지! 정찰도 완료했고, 습격조 준비도 끝났어."
10036060-55 = "그런데 교수…… DJ가 경호를 요청할 거라는 걸 어떻게 안 거야?"
10036060-57 = "여러분이 납치할 예정이었던 DJ B.o.B의 경우엔 뒷세계에서 제법 유명한 인물이더군요."
10036060-58 = "여러분을 통해 전달받은 그자에 대한 인상비평은 물론, 기록으로 남아있는 DJ의 공연이나, 인터뷰, 뉴스 기사 등등을 참고하여 어떤 인물상인지 추론할 수 있었답니다."
10036060-59 = "뒷세계에서 활동하는 탓인지 겁이 많고, 자신이 위험에 처할지라면 누구보다 보신을 신경 쓸 타입……."
10036060-60 = "습격이 있었던 직후, 아직 위험이 해소되지 않았다고 판단했다면 당연히 경호를 보강할 테고……."
10036060-61 = "없는 병력을 만들어낼 수는 없으니 자연스레 여분의 인원. 외곽에 배치한 경계 병력을 데려올 것으로 추측할 수 있겠죠."
10036060-62 = "이건 머리를 쓸 필요도 없는, 수순이 정해진 오프닝 같은 거예요."
10036060-63 = "남은 것은 훤히 보이는 상대의 게임에 대비해, 이쪽이 어떠한 수를 착수하는가."
10036060-64 = "네, 이미 둬야 할 수는 정해져 있습니다. 약해진 경계를 돌파해, 즉시 축제장을 습격한다."
10036060-65 = "이렇게 게임을 끌어 나간다면 헬멧단에게 일격을 가한다는 여러분의 목적도, 마침내 완성될 수 있겠지요."
10036060-66 = "말이 길어졌네요. 결행 시점은 알려드렸으니, 이제부터는 여러분의 손에 달렸어요. 행운을 빕니다."
10036060-73 = "교수 녀석, 설마 이걸 노리고 아까 작전을 허술하게 짠 건가?"
10036060-74 = "그, 그럴 리가. 그냥 어쩌다 보니 들어맞은 거겠지."
10036060-75 = "어쨌든 중요한 건, 이번에야말로 큰누님의 복수를 이룰 수 있다는 거야."
10036060-76 = "크흑! 누님, 우리 마음이 교정국 창살 너머까지 전해질 수 있다면……!"
10036060-77 = "울지 마! 슬플수록 마음을 굳세게 먹자고!"
10036060-78 = "결행 시각은 전부 집결했을 때! 이제 얼마 안 남았다고. 더 이상 망설일 이유도, 필요도 없어!"
10036060-80 = "……저 녀석들은, 불량배……?"
10036060-81 = "방금 녀석들이 나눴던 대화가 사실이라면, 공연장을 노리고 습격해 올 생각인가……!"
10036060-82 = "……이곳을 지킬 의리 같은 건 없지만, 그래도 내겐 남아있는 계약과, 그리고……"
10036060-86 = "……."
10036060-87 = "선생, 이것은 나의 억지일지도 모른다. 하지만……."
10036060-88 = "[s] \"모두의 축제를 지키고 싶은 거잖아. 도와줄게.\""
10036060-89 = "그래. 위협은…… 배제한다!"
10036060-91 = "여기는 A팀, 쳐들어갈 준비 됐어."
10036060-92 = "B팀도 이상 무. 신호만 주라고."
10036060-93 = "이쪽도 준비 완료."
10036060-95 = "오케이, 완벽해."
10036060-96 = "헬멧단 녀석들, 아주 혼비백산해서 달아나겠지."
10036060-97 = "기습은 비겁하다고 할지 모르지만…… 이건 단순한 싸움이 아니라 복수니까."
10036060-98 = "좋아! 가자! 헬멧단 축제를 뒤엎으러!"
10036060-99 = "습격조, 들려? 지금 출발해!"
10036060-100 = "(치직)……여긴 C팀. 뭔가 이상……(치직)"
10036060-101 = "응? 회선 상태가 왜 이래? C팀! 응답해!"
10036060-102 = "……(치지직)……."
10036060-103 = "(툭)"
10036060-104 = "뭐야, 이거……?"
10036060-105 = "어라? ……(치직)……저건 뭐야? 방금 뭔가 보인 것 같았는데!"
10036060-106 = "야, 가서 확인해 보고—"
10036060-107 = "(툭)"
10036060-108 = "엥? 또 끊겼네. 진짜 회선 불량인가?"
10036060-109 = "B팀! 응답해!"
10036060-110 = "야! 저거 뭐야! 쏴!"
10036060-111 = "이쪽으로 온다! 우왁!"
10036060-112 = "(치직)……(치지직)……"
10036060-113 = "(툭)"
10036060-114 = "어……어? 얘들아?"
10036060-115 = "대, 대체 무슨 일이 일어난 거야……?"
10036060-116 = "나, 나도 잘……."
10036060-121 = "뭐, 뭔데? 누구야! 당장 나와!"
10036060-122 = "아니, 이런 곳에 헬멧단이 있을 리도 없고, 단순한 바람 소리겠지! 내, 내가 갔다 와 볼게!"
10036060-123 = "야, 야 잠깐!"
10036060-129 = "?!"
10036060-130 = "노, 놀리지 말라고! 안 그래도 불안한데……!"
10036060-131 = "자, 자꾸 그러면 쏜다……?"
10036060-138 = "어, 어라……?"
10036060-148 = "……불량배들, 후퇴하는군. 뒤쫓을 필요까진 없겠지."
10036060-149 = "숫자는 제법 있었지만, 아군이 당했을 때의 서브 플랜조차 준비되어 있지 않은 상태라니, 전체적인 움직임이 어설퍼."
10036060-150 = "게다가…… 시의적절하게 제3자로서 판을 조망하며 지시를 내려준 선생님 덕이 컸다."
10036060-151 = "감사를 표하지."
10036060-152 = "[s1] \"나보다는 사오리가 더 대단했는 걸, 뭐.\"\n[s2] \"그래도 다행이야. 축제를 지켜낼 수 있어서.\""
10036060-155 = "음, 그 말대로다. 불량배들이 어째서 축제장을 습격하려 했던 건지는 잘 모르겠다만……."
10036060-156 = "이유가 무엇이든, 가만둬서는 안 될 일이니까."
10036060-157 = "이런, 그러고 보니 녀석들을 막느라 시간이 늦어 버렸다."
10036060-158 = "얼른 무대 준비를 하지 않으면……!"
10036060-159 = "선생, 미안하지만……."
10036060-160 = "[s] \"응, 얼른 가 봐.\""
10036060-161 = "음, 그럼 다시 보도록 하지."
10036060-166 = "[ns3] \"그건 그렇고 DJ를 납치하려고 하지를 않나……\"\n[ns4] \"공연장을 습격하려고 하질 않나…….\""
10036060-172 = "[ns] \"대체 뭘 하려는 거지……?\""
10036060-175 = "[ns] \"축제는 잘 즐기고 있었어?\""
10036060-176 = "앗, 선생님, 어서 와."
10036060-177 = "우린 게임 부스를 한 바퀴 돌고 나온 참이야."
10036060-178 = "결과는 별로였지만."
10036060-179 = "선생님…… 완전 망했어요……."
10036060-180 = "운세 뽑기는 연달아 흉에, 인형 뽑기도 실패하고……"
10036060-181 = "역시 희망은 없는 거네요…… 바닷가의 행복 따위 파도에 쓸려 순식간에 사라지는 거겠죠……."
10036060-182 = "[s] \"게임 부스보다 더 큰 게 기다리고 있잖아, 히요리.\""
10036060-183 = "네?"
10036060-184 = "[s] \"아직 DJ공연이 남았는걸!\""
10036060-186 = "……그렇네."
10036060-187 = "삿 쨩이 열심히 준비하던 공연을 아직 못 봤잖아."
10036060-188 = "공연 시작까지 얼마 남지 않았으니, 그걸 오늘의 하이라이트로 삼자."
