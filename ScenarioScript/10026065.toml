[translation]
10026065-7 = "휴……. 방금 전이 마지막……."
10026065-8 = "역시 어떻게든 되는군요! 뭔가 개운한 게……. 성당의 빨래를 너는 정도의 느낌이었어요!"
10026065-9 = "어라? 선생님 반응이……? 왜 그러시는지……."
10026065-10 = "호, 혹시 다치셨나요!? 분명 모두 막았다고 생각했는데……! 설마 그런……!"
10026065-11 = "……아, 괜찮으시다고요? 그런 건 아니시라고요? 휴……. 다행이에요……."
10026065-12 = "행여 제 고집 때문에 선생님께서 다치셨나 해서, 가슴이 철렁 내려앉을 뻔……."
10026065-19 = "……어라? 이 소리는……."
10026065-20 = "무, 무슨 소리예요!? 유탄 터지는 소리가 계속 들렸는데……!?"
10026065-21 = "서, 선생님……!? 히나타 씨……?"
10026065-23 = "두 분 모두 무사하신 것 같네요. 역시 방금 전 소리는……."
10026065-24 = "어……. 소, 소리요? 소리……? 아. 유탄 소리……."
10026065-25 = "……헉."
10026065-26 = "그, 그게……. 그러니까 말이죠! 이건 그……!! 어……!!"
10026065-27 = "아, 아무 일도 아니에요! 여러분 이렇게 나와서 신경 쓰실 거 없어요!"
10026065-28 = "하고 계신 일들이 있었잖아요? 조사하시던 데에 방해가 안 되려고 했던 건데, 이러면 의미가……."
10026065-29 = "……무슨 소리예요, 그게? 아무 일도 없었는데 유탄 터지는 소리가 수십 발씩 들렸다고요?"
10026065-30 = "얼버무리는 것도 정도가 있지……."
10026065-31 = "[s1] \"별일 아니었어. 신경 쓰지 마.\"\n[s2] \"아무 일도……. 없었다!\""
10026065-34 = "……? 그게 무슨……. 선생님까지……."
10026065-38 = "……아하. 그렇군요."
10026065-39 = "뭐, 기다리기 지루해서 연습 사격이라도 하신 모양이죠. 저흰 다시 돌아가서 하던 조사나 마저 할까요? 우이 씨?"
10026065-40 = "……?????????"
10026065-41 = "뭔가요? 갑자기 단체로 왜들 이러는 거죠? 무슨 짜고 치는 상황극인가요?"
10026065-42 = "자, 자. 선생님께서 아무 일도 아니라고 하셨잖아요. 불러야 할 일이었다면 어련히 부르셨겠죠. 돌아가서 저희 일 하도록 해요."
10026065-43 = "아니, 그러니까 우선 상황 확인부터 하자니까? 사람이 말을 하면 좀……."
10026065-45 = "……코.제.키.선.배?"
10026065-46 = "히, 히익……!? 뭐, 뭐야?! 뭔데요!?"
10026065-47 = "아, 알았어요. 알았다고요! 잘은 모르겠지만……. 들어가면 되잖아요……!!"
10026065-48 = "그, 그럼 저는 다시……. 조사를 하러……. 이만……."
10026065-53 = "……후훗♡"
10026065-54 = "[s] \"고마워, 하나코.\""
10026065-55 = "어머나, 무슨 말씀이신지 모르겠는데요? 갑자기 감사 인사라니……."
10026065-56 = "그럼 우리도 우이 씨를 따라가도록 할까요? 코하루 쨩?"
10026065-57 = "어, 어어……? 으, 음……. 응……."
10026065-62 = "[ns3] \"어떻게든 잘 얼버무렸네.\"\n[ns4] \"하긴 꽤 요란했으니까.\""
10026065-65 = "아, 아하하하……. 그, 그런 걸까요……. 뭔가 잘 된 것 같기도 하고 아닌 것 같기도 하고……."
10026065-66 = "……잘 된 거……겠죠? 하하하……."
10026065-67 = "뭔가……. 전혀 그럴 의도는 아니었는데, 다른 분들께는 말씀드리지 않은 비밀을 만들어 버린 느낌이네요."
10026065-68 = "시스터로서 이런 건 안 될 일인 것 같은데……. 으음……. 괜찮은 걸까요……?"
10026065-69 = "[s5] \"당연하지. 여기선 선생님 말을 듣도록.\"\n[s6] \"남은 시간은, 좀 느긋하게 쉴까?\""
10026065-75 = "……후후. 감사합니다, 선생님."
10026065-76 = "그런 식으로 말해 주시니……. 오히려 마음이 편해지는 것 같아요."
10026065-77 = "그럼 말씀해 주신 대로……."
10026065-81 = "지금 이건, 저희만의 비밀로 간직하도록 할게요."
10026065-83 = "(이후 히나타와 짐들을 지키며, 남은 시간을 여유롭게 보냈다.)"
