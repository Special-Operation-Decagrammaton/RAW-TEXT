[translation]
1001603-1 = "현장실습이에요. 선생님."
1001603-2 = "밀레니엄 게임 아트워크 전시회장 입구"
1001603-3 = "아침 일찍 일어나서 만든 샌드위치 OK."
1001603-4 = "선생님이랑 같이 마실 우롱차랑 간식도 챙겼고……."
1001603-5 = "메모용 수첩이랑 스케치북도 준비했고. ……또 잊은 건 없겠지?"
1001603-6 = "던전 공략을 위해선 사전 준비가 필수이니까."
1001603-7 = "후, 하, 후우, 하아."
1001603-8 = "이건 기회야. 이번 아트워크 전시회에서 선생님에게 내 어른스러운 모습을……."
1001603-9 = "[s] \"뭘 그렇게 중얼거리고 있어?\""
1001603-10 = "우와아앗?! 까, 깜짝이야!"
1001603-11 = "서, 선생님?! 어, 언제 오신 거예요?"
1001603-12 = "[s1] \"미도리가 도시락통을 노려볼 때부터.\"\n[s2] \"던전 공략을 코앞에 둔 용사처럼 심호흡 할 때까지.\""
1001603-13 = "저, 전부 다 듣고 계셨단 말이잖아요!"
1001603-14 = "저, 전부 다 듣고 계셨단 말이잖아요!"
1001603-15 = "[s] \"오늘 전시회가 무척 기대됐나 봐?\""
1001603-16 = "그, 그거야……. 1년에 한 번씩 열리는 게임 아트 전시회거든요."
1001603-17 = "이번 기회에 잔뜩 구경하고, 자료 조사도 잔뜩 할 생각이에요."
1001603-18 = "(물론 오늘을 기대한 이유는 그것뿐만은 아니지만…….)"
1001603-19 = "자, 여기서 이럴 게 아니라. 얼른 가요. 선생님."
1001603-21 = "밀레니엄 게임 아트워크 전시회장 1F"
1001603-23 = "음. 전시회의 1층에는 최신 게임 부스가 놓여있고, 층마다 장르별로 구분되어 있나 봐요."
1001603-24 = "아, 고전 게임 아트워크 전시는 3층부터네요."
1001603-25 = "[s] \"사람들이 무척 많네.\""
1001603-26 = "네, 이게 게임이 가진 가장 큰 매력 덕분이라고 생각해요."
1001603-27 = "모두가 다른 장소에서, 다른 시간에 서로 다른 장르의 게임을 즐겼지만."
1001603-28 = "끝내 이런 자리에 모여 같이 추억을 나누는 거죠."
1001603-29 = "아, 이럴 게 아니라. 3층으로 올라가요. 선생님. 분명 매력적인 아트워크가 많을 거예요."
1001603-35 = "(선생님과 단 둘이 여기까지 오는 미션은 성공했어. 여기서 빈틈없이 공략을 완수하려면…….)"
1001603-38 = "제법 오래 걸었는데. 선생님. 혹시 목이 마르시진 않나요?"
1001603-39 = "마침 집에서 챙겨온 우롱차가 있는데……."
1001603-40 = "(이 타이밍에 차를 건네 주면서 선생님에게 어프로치를……!)"
1001603-41 = "[s] \"미도리, 저것 좀 봐.\""
1001603-42 = "네? 무얼……."
1001603-46 = "앗, 생명 한 포기 용납하지 않겠다는 듯이 황량함이 강하게 전해져 오는 아트워크라니……!"
1001603-47 = "혹시 이 사막 그림……."
1001603-48 = "역시! 제 예상이 맞았어요. 선생님!"
1001603-49 = "고전에서도 명작이라 부르기에 손색이 없는 런 앤 건 슈팅게임……!"
1001603-50 = "메탈스네일2의 황무지 맵 아트워크예요! 굉장해요!"
1001603-51 = "앗, 이것만이 아니에요. 저쪽 그림도!"
1001603-54 = "이번엔 모럴 해저드에서 악명 높은 좀비 도시인 너구리 시티의 아트워크까지……!"
1001603-55 = "이거고 저거고 전부 다 엄청난 고전 게임 명작들의 그림들이에요!"
1001603-58 = "[ns3] \"미도리, 진정해.\"\n[ns4] \"미도리, 입가가 헤벌쭉하고 있어.\""
1001603-59 = "지금은 진정할 때가 아니라구요!"
1001603-60 = "지금은 진정할 때가 아니라구요!"
1001603-61 = "앗!"
1001603-62 = "저건 유명한 플랫포머 고전 게임 '울트라 마린 시스터즈'에 나왔던 초기 1-1 스테이지 맵의 아트워크!"
1001603-63 = "선생님, 선생님! 그거 알고 계신가요?"
1001603-64 = "울트라 마린 시스터즈에 나오는 수풀하고 구름은 원래 같은 도트 디자인이라는 거요!"
1001603-65 = "으으음! 참을 수 없어요! 지금 아이디어가 샘솟고 있어요."
1001603-66 = "메, 메모장……! 메모장이 어디 있더라?! 당장 그려둬야……!"
1001603-68 = "(그 뒤로도 한동안 미도리는 흥분한 채로 마구 그림을 그렸다.)"
1001603-69 = "(게임 아트워크 전시회가 끝난 뒤)"
1001603-71 = "드릴 말씀이 없네요. 제가 또…… 흥분해서……"
1001603-72 = "선생님, 죄송해요. 저 혼자만 잔뜩 신나서 멋대로 선생님을 끌고 다니기나 하고……."
1001603-73 = "(어린애처럼 잔뜩 흥분한 바람에, 선생님에게 내 어른스러운 모습을 어필하려 했던 계획이 모두 물거품으로…….)"
1001603-74 = "[s5] \"아냐, 나는 재미있었어.\"\n[s6] \"미도리는 고전 게임을 정말 좋아하나 봐.\""
1001603-75 = "앗, 네……. 처음엔, 고전 게임 같은 거. 어째서 다들 이런 걸 하는 걸까."
1001603-76 = "앗, 네……. 처음엔, 고전 게임 같은 거. 어째서 다들 이런 걸 하는 걸까."
1001603-77 = "의문도 들고 그랬지만."
1001603-78 = "게임개발부에 들어와서 하나 둘 즐기면서 점점 좋아하게 되었어요."
1001603-79 = "개중에는 좀 이해하기 어려운 룰을 가진 게임도 있지만."
1001603-80 = "애당초, 그 얼음을 깨면서 등반하는 게임 말이죠?!"
1001603-81 = "왜 화면 너머로 넘어가면 죽어야만 하는 건가요! 왜 기다려 주질 않는 거죠?!"
1001603-82 = "[s] \"응, 그런 미도리가 즐거워하는 모습을 봐서 좋았어.\""
1001603-83 = "아……."
1001603-84 = "선생님은, 언제나 그런 말씀을……."
1001603-85 = "그렇네요. 네. 저도 오늘 즐거웠어요."
1001603-86 = "다음에도 이렇게 같이 놀러 와요. 선생님."
