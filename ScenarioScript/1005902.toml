[translation]
1005902-1 = "다시 일상으로"
1005902-4 = "우와, 선생님이다! 와주었구나?"
1005902-5 = "엄청 기다리고 있었어, 응!"
1005902-11 = "자아, 그럼 바로 출발! 저쪽이야!"
1005902-12 = "[s] \"출발? 어, 어디로 가는 거야?\""
1005902-14 = "쇼핑이야! 선생님, 살게 잔뜩 있거든!"
1005902-20 = "(즐겁게 앞서나가는 미카를 따라가기로 했다.)"
1005902-24 = "우와. 바깥 공기."
1005902-29 = "응- 역시 좋네."
1005902-30 = "[s] \"좋아 보이네, 미카.\""
1005902-31 = "그런가? 역시 자유롭게 다닐 수 있는 건 기분 좋으니까."
1005902-32 = "예전 생활이랑은 많이 달라져서…… 아직 적응하는데 시간이 좀 걸릴 것 같지만……."
1005902-33 = "괜찮아. 그 정도는 금방 익숙해질 거고."
1005902-34 = "[s] \"예전과는 어떻게 달라?\""
1005902-35 = "음, 이젠 독채가 아니라 교실에서 다른 학생들이랑 같이 공부를 해야 한다거나……."
1005902-36 = "식사도 학교 식당을 이용해야 한다거나……."
1005902-37 = "머리도 혼자 말려야 하고…… 뭐 그런 것들?"
1005902-38 = "[s] \"흐음. 그렇구나.\""
1005902-39 = "응, 무엇보다 이제 학생 기숙사에서 살게 되어서……"
1005902-40 = "빨래나 다림질도 혼자 해야 하고…… 시간에 맞춰 식사나 목욕 같은 걸 끝내지 않으면 안 돼."
1005902-41 = "정말이지, 정해진 시간에 불도 꺼버리고 억지로 잠자리에 들라니, 너무 가혹한 거 아냐?"
1005902-42 = "[s1] \"그 정도면 평범한 거라고 생각해.\"\n[s2] \"일반적인 느낌인데?\""
1005902-47 = "으응……. 뭐, 선생님이 그렇다면 그런 거겠지만……."
1005902-48 = "그래도 트리니티엔 좀 덜 엄격한 기숙사도 많은데…… 뽑기 운이 나빴던 걸까?"
1005902-49 = "뭐, 그래도 괜찮아☆ 금세 익숙해지겠지."
1005902-50 = "[s] \"응. 파이팅이야.\""
1005902-51 = "그래,"
1005902-58 = "그럼 쇼핑! 쇼핑하러 가자!"
1005902-60 = "근교의 서점"
1005902-61 = "[ns] \"쇼핑이라더니 책을 사러 온 거야?\""
1005902-62 = "응. 수업에 쓸 거. 사전이나 참고서 같은 건 아직 이런 데서 사야 하거든."
1005902-63 = "예전에 쓰던 건 다 없어져 버려서……."
1005902-64 = "[s] \"…….\""
1005902-65 = "있어봐, 선생님! 금방 골라서 올 테니까!"
1005902-70 = "(잠시 뒤)"
1005902-74 = "기다렸지?"
1005902-75 = "생각보다 사야 할 게 많아서 시간이 좀 걸렸어."
1005902-76 = "[s] \"양이 꽤 많네.\""
1005902-77 = "응…… 그게 구경하다 보니 소설이나 잡지 같은 것도 사버렸지 뭐야."
1005902-78 = "이제 충동구매도 자제해야 하는데……."
1005902-79 = "뭐, 어떻게든 되겠지☆"
1005902-83 = "자아, 그럼 다른 데로 가자, 선생님! 사야 할 게 더 있어!"
1005902-84 = "[s] \"더 있어?\""
1005902-89 = "[ns3] \"………….\"\n[ns4] 뒤따라간다."
1005902-97 = "[ns] \"옷 가게……?\""
1005902-98 = "응, 사야 할 게 있어서!"
1005902-102 = "잠깐만 기다려, 선생님!"
1005902-103 = "여긴 얼마 안 걸릴 거야."
1005902-108 = "(잠시 뒤)"
1005902-113 = "계산 도와드리겠습니다."
1005902-118 = "학교 지정 운동화 1켤레에…… 실내 슬리퍼 1켤레…… 지정 체육복 1벌과……"
1005902-119 = "손수건 2장이랑…… 학교 지정 수영복 1벌…… 스포츠 타올 2장과 그리고……"
1005902-126 = "[ns] \"어쩐지 학교 용품들이네.\""
1005902-130 = "아, 으, 으응……."
1005902-131 = "예전에 쓰던 건 전부 찾을 수 없게 되어버려서……."
1005902-132 = "[s] \"…………….\""
1005902-133 = "응! 잘됐지 뭐야! 안 그래도 낡아서 새 걸로 사고 싶었거든."
1005902-135 = "결제는 어떻게 하시겠습니까?"
1005902-139 = "자, 이걸로."
1005902-143 = "카드 받았습니다."
1005902-151 = "……죄송한데 한도 초과라는데요."
1005902-153 = "으, 으응?!"
1005902-154 = "어…… 자, 잠깐만……? 그, 그러니까……."
1005902-155 = "……."
1005902-156 = "타올 1장이랑 손수건 1장을…… 일단 빼고……. 스, 슬리퍼도 뺄게!"
1005902-162 = "한도초과라는데요."
1005902-164 = "아, 으……."
1005902-165 = "수, 수영복도 뺄게. 그리고……."
1005902-169 = "[ns] \"미카? 그걸 빼면 수영 수업은……?\""
1005902-170 = "괜찮아!"
1005902-171 = "수영복은 사실 있었어. 낡아서 새걸 사려고 했던 거고!"
1005902-175 = "자, 이거 빼줘."
1005902-182 = "한도……."
1005902-183 = "그, 그럼 체육복도……."
1005902-187 = "……다른 카드는 없나요?"
1005902-192 = "[ns5] \"이걸로 결제해 주세요.\"\n[ns6] 어른의 카드로 대신 결제한다."
1005902-200 = "네. 결제되었습니다."
1005902-201 = "서, 선생님?! 어, 어째서……."
1005902-202 = "[s] \"자. 이제 돌아가자.\""
1005902-209 = "……"
1005902-210 = "[ns] \"이제부턴 계획적인 소비에 익숙해져야겠네.\""
1005902-211 = "……."
1005902-212 = "……이게 아닌데."
1005902-213 = "난 그냥 선생님이랑 같이 쇼핑하려고 한 것뿐이었는데……."
1005902-214 = "어째서 이렇게……. 보여주기 싫은 모습만…… 자꾸……."
1005902-215 = "선생님한테 폐만 끼치고……. 어째서 이런 식으로 항상……."
1005902-216 = "[s7] \"아냐. 학교생활에 꼭 필요한 물건들이었잖아?\"\n[s8] \"미카가 돌아온 걸 기념하는 선물이라고 생각해 줘.\""
1005902-221 = "……선물."
1005902-222 = "응……. 그러네. 그렇구나……."
1005902-223 = "[s] \"그러니까 앞으로도 힘내. \""
1005902-227 = "……응."
1005902-228 = "고마워. 선생님…… 소중히 할게……."
1005902-229 = "[s] \"그럼 나는 일이 밀려 있어서 이만 돌아가 볼게.\""
1005902-230 = "어? 으, 으응……."
1005902-235 = "(미카를 배웅하고 샬레로 돌아왔다.)"
