[translation]
31050-1 = "제5화;낙제생들 2"
31050-4 = "……이야기는 들었습니다. 선생님께서 기간 한정으로 보충수업부를 맡으신다고……."
31050-5 = "아쉽네요. 여러 모로 바쁘시겠지만 저희는 그쪽으로는 도움을 드릴 수가 없어서……."
31050-6 = "[s] \"저 둘의 신병을 인도받고 싶은데.\""
31050-7 = "뭐?! 무슨 권리로?! 절대 안 돼! 흉악범들이야!"
31050-8 = "코하루. 선생님은 샬레의 담당이시자 티파티의 의뢰를 받고 오신 분이에요."
31050-9 = "선생님은 규정상 이들을 데리고 가는 게 가능합니다. 보충수업부의 담당이시니까요."
31050-10 = "그, 그치만……. 서, 선배가 그렇다면 뭐……."
31050-11 = "흐, 흥! 그치만 꼴 좋네! 저런 흉악범들과 같이 있어야 한다니! 게다가 보충수업부라니! 부끄럽고 불쌍해!"
31050-12 = "아하하하하! 꼴 좋다! 악당에 바보 조합이잖아? 나같았으면 같이 있는 것만으로도 수치심을 못견디고 죽어버렸을 거야!"
31050-13 = "코하루…… 하아……."
31050-15 = "아우……."
31050-16 = "[s] \"이걸로 남은 건 한 명이지?\""
31050-17 = "아…… 맞아요. 네…… 아직 말을 못 꺼냈는데……"
31050-18 = "남은 한명은…… 시모에 코하루…… 씨……예요."
31050-19 = "……."
31050-20 = "……응? 나?"
31050-24 = "시"
31050-26 = "모"
31050-28 = "에"
31050-32 = "코"
31050-34 = "하"
31050-36 = "루"
31050-38 = "보충수업부 멤버 1학년 시모에 코하루."
31050-39 = "3연속 낙제로 유급을 눈앞에 두고 있음."
31050-40 = "참고사항. 낙제에서 벗어나기 전까지 정의실현부로 복귀하지 못함."
31050-44 = "어머나. 이분들이 바로 보충수업부원?"
31050-45 = "(후욱- 후욱-)"
31050-46 = "……."
31050-49 = "아, 아하하하…… 그래도 어떻게든 다 모였네요……. 보충수업부가……."
31050-50 = "이, 이제…… 앞으로가 문제인데……."
31050-51 = "후후, 이제 뭘 하면 되죠? 아지타니 부장님?"
31050-52 = "방과 후의 외딴 교실에서 여고생들과 어른이 모여서 할 만한 거…… 음, 역시 그런 거려나……."
31050-53 = "(후욱-) 그런 거? 뭔진 모르겠지만 상관없어. 참고로 나는 이 교실이라면 한 달은 더 농성할 수 있어."
31050-54 = "……죽고 싶어."
31050-56 = "……."
31050-57 = "선생님……. 부디…… 잘 부탁드립니다……."
31050-58 = "[s] \"……응. 노력해볼게.\""
31050-59 = "네…… 감사합니다……. 저도 힘낼 테니까……."
31050-61 = "다음화;자기소개의 시간"
