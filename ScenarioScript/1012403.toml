[translation]
1012403-1 = "결전의 날"
1012403-2 = "D.U. 외곽 쇼핑몰"
1012403-3 = "(어째선지 약속 장소는 트리니티 자치구에서 멀리 떨어진 쇼핑몰이었다.)"
1012403-4 = "(도착해 보니 이미 하스미가 기다리고 있었다.)"
1012403-5 = "오셨군요, 선생님."
1012403-6 = "[s1] \"이런 데서 만나는 건 신선하네.\"\n[s2] \"근데 이렇게 멀리 올 필요가 있었어?\""
1012403-7 = "후후. 그렇네요."
1012403-8 = "평소에는 업무로 바빠 트리니티 자치구 밖으로 나오는 일이 드물었으니까요."
1012403-9 = "네. 물론입니다."
1012403-10 = "만에 하나라도 수영복 사이즈가 다른 학생들에게 알려지면 곤란하니……."
1012403-11 = "그렇다 해도 문제는 없습니다."
1012403-12 = "사전 조사를 통해, 여기에도 베로니카 점포가 있다는 걸 알고 왔으니까요."
1012403-13 = "[s3] \"베로니카가…… 뭐였지?\"\n[s4] \"아, 학생들이 많이 입는 의류 브랜드다!\""
1012403-16 = "예. 요즘 시대에는 드물게 장인 정신을 담아 물건을 만들어내는 명품 브랜드죠."
1012403-17 = "저희 트리니티 종합학원과도 오랜 연을 맺고 있는 만큼 이곳 물건은 믿을 수 있습니다."
1012403-18 = "아, 혹시 연락 주신 트리니티 학생분이실까요?"
1012403-24 = "내점을 기다리고 있었습니다. 편안한 쇼핑 되시도록 제가 오늘 하루 안내를 맡겠습니다."
1012403-25 = "후후. 신경 써 주셔서 감사합니다."
1012403-27 = "[ns5] (굉장한 아가씨의 오오라…….)\n[ns6] (새삼스럽지만 진짜 정의실현부의 엘리트구나…….)"
1012403-30 = "그러면 선생님, 가실까요?"
1012403-32 = "베로니카 점내"
1012403-33 = "수영복을 찾으신다고요. 마침 올여름의 최신 디자인의 수영복들이 준비되어 있습니다."
1012403-34 = "그러면 시착해 봐도 괜찮을까요?"
1012403-35 = "물론이죠. 마음에 드시는 물건이 있을 때까지 가져다드리겠습니다."
1012403-36 = "후후. 감사합니다."
1012403-37 = "그러면 선생님. 잠시 후에 뵙겠습니다."
1012403-41 = "[ns] (나, 여기 있을 필요가 있나?)"
1012403-44 = "……이건, 말도 안 되는……."
1012403-45 = "[s] \"하스미?\""
1012403-46 = "아, 선생님. 저, 아무것도 아닙니다. ……혹시 점원분도 거기 계실까요?"
1012403-47 = "왜 그러시죠, 손님? 혹시 사이즈가 안 맞으실까요?"
1012403-48 = "……네. 아무래도 그런 것 같습니다."
1012403-49 = "죄송하지만, 혹시 한 치수 더 큰 사이즈로 바꿔 주실 수 있을까요?"
1012403-50 = "물론이죠. 금방 가져다드리겠습니다!"
1012403-53 = "여기 있습니다!"
1012403-54 = "감사합니다. 그러면…… 이번에야말로."
1012403-59 = "그, 그럴 리가!!"
1012403-60 = "……점원님."
1012403-61 = "음…… 아무래도, 조금 작았나요?"
1012403-62 = "괜찮습니다! 당점에서는 빅 사이즈 제품도 취급하니까요!"
1012403-63 = "비…… 빅 사이즈……? 크윽……! 그걸로, 부탁드립니다……!"
1012403-65 = "어디 있더라…… 오랫동안 안 나간 상품이라……."
1012403-72 = "자, 오래 기다리셨습니다!"
1012403-73 = "가, 감사합니다."
1012403-78 = "……."
1012403-79 = "……?"
1012403-84 = "……점원님."
1012403-85 = "어…… 저, 말씀드리기 어렵지만……."
1012403-87 = "방금 그게 저희 가게에서 제일 큰 사이즈입니다……."
1012403-88 = "……."
1012403-89 = "……."
1012403-90 = "[ns] \"…….\""
1012403-92 = "[ns] \"하스미…….\""
1012403-95 = "[wa:1300]― [log=하스미 수영복]흣…… [wa:2010]후읏! [wa:1390]우으읏……[wa:403] [/log]"
1012403-97 = "― [log=하스미 수영복]드, [wa:843]들어갔습니다![/log]"
1012403-100 = "― [log=하스미 수영복]아슬아슬…… [wa:680]하지만…… [/log]"
1012403-103 = "[wa:1950]― [log=하스미 수영복]보시다시피! [wa:2290]착용에는! [/log]"
1012403-105 = "― [log=하스미 수영복]문제없습니다![/log]"
1012403-108 = "[wa:400]― [log=하스미 수영복]조금만 관리한다면,[/log]"
1012403-110 = "― [log=하스미 수영복]딱 맞는 사이즈이니까요……![/log]"
1012403-113 = "[ns] \"이, 일단 침착하자! 하스미!\""
1012403-114 = "[wa:1550]― [log=하스미 수영복]전 침착합니다![/log]"
1012403-116 = "― [log=하스미 수영복]수영복은 이걸로 하겠습니다![wa:110] [/log]"
1012403-119 = "[wa:400]― [log=하스미 수영복]오히려, [wa:960]이것만 입겠습니다……![/log]"
1012403-127 = "이걸로, 계산 부탁드립니다!"
1012403-128 = "[s7] \"하, 하스미?!\"\n[s8] \"무리하지 않아도 되니까!\""
1012403-131 = "아니요! 저는 각오를 굳혔습니다!"
1012403-132 = "입을 수 있었다고요! 아슬아슬하게!"
1012403-133 = "저에게 충분한 시간만 주어진다면, 이 이상의 성과도 낼 수 있습니다!"
1012403-134 = "[s9] \"아슬아슬, 이라는 시점에서…….\"\n[s10] (성과라는 표현은 적절한 걸까……?)"
1012403-137 = "자, 점원님! 어서 계산을!"
1012403-138 = "계, 계산 도와드리겠습니다."
1012403-140 = "(결국, 하스미는 시착했던 수영복을 샀다.)"
1012403-141 = "(결제하는 하스미의 모습에서 이글거리는 투지가 느껴졌다.)"
