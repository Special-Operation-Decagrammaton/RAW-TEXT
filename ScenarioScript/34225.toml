[translation]
34225-3 = "크아아아아아아아아----!! 아, 안 돼……!! 나의 현현이……!!"
34225-4 = "안 돼요…… 아직 의식이 완성되지 않았던 것인가요……? 아직 힘이…… 힘이……."
34225-5 = "네놈들이! 고작 네놈들 따위가……!!"
34225-6 = "바르바라를…… 아니, 바실리카에 존재하는 모든 병력을 이곳으로……!!"
34225-7 = "이곳으로 돌아오세요!!"
34225-12 = "하아…… 하아……."
34225-13 = "여, 여기서 더 몰려오는 거예요……? 아, 으아아……."
34225-14 = "큭…… 여기서 더 시간을 끌면……."
34225-15 = "다들 정신 차려! 아직 끝난 게 아냐!!"
34225-16 = "지원이 오기 전에 어서……!!"
34225-17 = "어서!! 모두 이쪽으로 집결해서 저를 보호하세요!!"
34225-19 = "다음화;소녀들을 위한 키리에 1"
