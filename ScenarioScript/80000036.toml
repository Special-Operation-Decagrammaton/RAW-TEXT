[translation]
80000036-1 = "최고의 초콜릿을 만드는 방법"
80000036-4 = "살금살금. 살금살금."
80000036-9 = "선생님, 쉿. 어두우니까. 거기 발 조심해."
80000036-10 = "[s] \"으, 응.\""
80000036-12 = "아무리 어두워도 급식실 어디에 뭐가 있는지, 난 다 알고 있지롱~"
80000036-14 = "아마 이쯤에……."
80000036-16 = "아, 여기다!"
80000036-19 = "봐봐! 선생님! 텅 비어 있어! 내 예상대로 오늘은 아무도 없네!"
80000036-20 = "응! 오늘 하루 전세 내고 마음껏 쓸 수 있겠다!"
80000036-21 = "[s1] \"일단 무작정 끌려오긴 했다마는…….\"\n[s2] \"저기, 이즈미. 여긴 어쩐 일로…….\""
80000036-22 = "응? 오늘 급식실을 방문한 이유?"
80000036-23 = "응? 오늘 급식실을 방문한 이유?"
80000036-24 = "그야 오늘은 선생님도 알다시피 발렌타인 데이잖아?"
80000036-25 = "[s] \"응, 그렇지.\""
80000036-26 = "그러니 여길 찾아온 이유도 딱 하나!"
80000036-27 = "선생님이랑 같이 발렌타인 데이 최고의 초콜릿을 만들기 위해서인 게 당연하지!"
80000036-28 = "자! 가자 선생님! 이럴 시간이 없어!"
80000036-32 = "[ns] \"……네?\""
80000036-34 = "발렌타인 데이를 맞이해, 최고의 초콜릿을 맛보고 싶다고 생각했지만."
80000036-35 = "역시 그런 건 기다린다고 먼저 다가와 주지 않는 법이야."
80000036-36 = "미식연구회의 자랑스러운 부원이라면 직접 자기 발로 뛰고, 자기 손으로 쟁취해야 하는 법!"
80000036-37 = "그리고 최고의 초콜릿이라면, 당연히 나 혼자 먹기보다 선생님과 같이 먹는 게 제일이고! 그렇지?"
80000036-38 = "[s] \"크흑, 이즈미, 너란 아이는……!\""
80000036-39 = "그래서 여기, 초콜릿을 만들기 위한 재료를 준비해왔어!"
80000036-40 = "먼저 여기, 장인이 만들어서 슈퍼마켓에 유통하고 있다는 특제 전통 간장 소스야!"
80000036-41 = "[s] \"……응? 어째서 간장 소스?\""
80000036-42 = "응? 초콜릿에서 멋진 검은색 광택은 빼놓을 수 없으니까?"
80000036-43 = "그리고 맞다. 요즘 유행은 과일 초콜릿이라고, 어디선가 들은 기억이 나!"
80000036-44 = "그래서 최고로 맛있는 과일이 뭘까. 하고 찾아봤는데. 과일의 왕이라고 불리는 과일이 있다길래 가져왔어!"
80000036-49 = "[ns] \"큭, 이, 내, 냄새는……!\""
80000036-50 = "두리안이라는 거 있지?"
80000036-51 = "근데 과일의 왕만 있으면 뭔가 아쉬운 거 같더라구."
80000036-52 = "근데 과일의 왕이라고 하니까. 비슷하게 굉장한 뭔가가 없을까. 찾아보다가……."
80000036-53 = "생선의 왕이라는 걸 찾았거든!"
80000036-54 = "도미야! 참고로 도미엔 비타민이 풍부해서 건강에도 좋대."
80000036-55 = "초콜릿이 맛있는 데다가 건강에도 좋아지면 또 최강일 거 아냐?"
80000036-56 = "자, 그럼 재료는 전부 있으니까! 만들자! 초콜릿!"
80000036-57 = "[s] \"괜찮은 걸까? 정말, 이걸로 괜찮은 걸까?!\""
80000036-59 = "(그렇게 이즈미와 함께 좌충우돌 초콜릿 만들기가 시작되었다.)"
80000036-67 = "완성했어! 선생님! 이거 봐!"
80000036-72 = "그럼 자, 선생님. 먼저 한 입 먹어!"
80000036-73 = "최고의 재료를 써서 만들었으니까. 분명 맛있을 거야!"
80000036-74 = "[s3] (이즈미가 노력해서 만들어준 초콜릿……!!)\n[s4] \"으음, 그, 그럼 어디 한 번…….\""
80000036-83 = "[ns] \"이, 이 풍미는……!\""
80000036-84 = "(부드럽게 뭉개지는 도미살 위로 풍겨오는 간장 소스의 독특한 풍미.)"
80000036-85 = "(그리고 그 사이사이를 두리안의 독특한 과일 내음이 빈틈을 채워 나가며, 예상치 못한 하모니가 입안에서 펼쳐졌다!)"
80000036-86 = "[s] \"마, 맛있어……. 초콜릿 맛은 아니지만!\""
80000036-87 = "그래? 아하핫! 다행이다!"
80000036-88 = "역시 직접 도전해보는 게 정답이었네! 응! 미식의 길은 굉장하네!"
80000036-89 = "[s] \"오늘, 고마워. 이즈미.\""
80000036-90 = "응! 별말씀을! 자! 아직 많이 남았으니까. 남은 것도 같이 나눠 먹자!"
80000036-91 = "자아, 아-앙! 해피 발렌타인 데이야! 선생님!"
80000036-93 = "(그렇게 이즈미와 독특한 발렌타인 데이를 함께 했다.)"
