[translation]
1601706-1 = "I hate this world (without you)"
1601706-2 = "(아오바의 연락을 받고 정비소에 도착했다.)"
1601706-11 = "앗, 아아…… 서, 선생님……"
1601706-12 = "지, 진짜 와주셨네요…… 또……"
1601706-13 = "[s1] \"아오바의 요청인데 와야지.\"\n[s2] \"내가 도움이 될지는 모르겠지만 말야.\""
1601706-16 = "도, 도움은 엄청! 엄청 될 거예요……"
1601706-17 = "아무것도 안 하셔도 도움 되, 될 거예요……!"
1601706-21 = "그럴 수는 없다구요……?"
1601706-22 = "여, 역시 선생님다운 말씀……"
1601706-23 = "그, 그럼 죄송하지만……!"
1601706-24 = "오늘치 일정이 많이 바쁜 관계로…… 부득이하게 도움을 부, 부탁드릴게요!"
1601706-25 = "[s] \"얼마든지!\""
1601706-28 = "(준비해 온 작업복으로 갈아입고 바로 아오바를 도와 정비에 들어갔다.)"
1601706-47 = "(뭐가 뭔지는 잘 알지는 못하지만, 시키는 일을 열심히 했다…….)"
1601706-49 = "(시간이 지나고……)"
1601706-52 = "이, 이제 이쪽 나사만 조이면……!"
1601706-57 = "끄, 끝났어요……!"
1601706-58 = "[s] \"와아……! 해냈다!\""
1601706-59 = "저, 정말 오늘 내로 끝내버렸네요……"
1601706-60 = "모두 선생님 덕분이에요……! 도, 도와주셔서……!"
1601706-61 = "[s] \"꽤 합이 잘 맞았지.\""
1601706-62 = "네, 네에! 정비는 익숙하지 않으신데도…… 대단해요……!"
1601706-63 = "그, 그런데 시간이 또 너무 늦은 게 아닌지……"
1601706-64 = "이, 이럴 게 아니라 얼른 갈아입고 퇴근하죠!"
1601706-73 = "……"
1601706-74 = "(어, 어디서 자꾸 기름 냄새가……)"
1601706-75 = "……"
1601706-76 = "……아?"
1601706-77 = " (서, 설마……?)"
1601706-85 = "으, 으아아……!!"
1601706-86 = "[ns] \"아, 아오바?\""
1601706-92 = "[wa:680]― [log=아오바]여,[wa:350] 여기 오지 말아주세요…… [wa:1260]으아……![/log]"
1601706-95 = "[ns] \"아니, 잠깐……\""
1601706-96 = "[wa:3450]― [log=아오바]오,[wa:790] 옷에……서……[/log]"
1601706-99 = "― [log=아오바]기름 냄새가[wa:1240] 많이 나서요……[/log]"
1601706-101 = "― [log=아오바]조,[wa:610] 좋지 않아요……[/log]"
1601706-104 = "― [log=아오바]그,[wa:700] 금방 벗을 테니까…… [/log]"
1601706-106 = "― [log=아오바]그,[wa:860] 거기서…… [wa:1610]기다려주세요……![/log]"
1601706-109 = "[ns3] \"아니아니!\"\n[ns4] \"그게 더 곤란하거든! 여러모로!\""
1601706-110 = "[wa:1210]― [log=아오바]예?[wa:1780] 그게…… [wa:1230]무슨 말씀……[/log]"
1601706-111 = "[wa:1210]― [log=아오바]예?[wa:1780] 그게…… [wa:1230]무슨 말씀……[/log]"
1601706-114 = "[wa:2220]― [log=아오바]……어 [wa:1640]…… 그러니까……[/log]"
1601706-117 = "― [log=아오바]……아아앗?![wa:1230] 그,[wa:230] 그게!![/log]"
1601706-119 = "― [log=아오바]우,[wa:820] 우와아아앗!! [/log]"
1601706-122 = "(허둥지둥 숙직실 밖으로 나와서 아오바를 기다렸다……)"
1601706-126 = "……"
1601706-127 = "깨, 깨끗한 옷으로 갈아입었어요……"
1601706-128 = "이제 냄새…… 아, 안 날 거예요! 깔끔하게 퇴근 가, 가능!"
1601706-129 = "[s] \"좋아, 갈까?\""
1601706-130 = "네엡……!"
1601706-137 = "여, 역시 바깥 공기는 상쾌하네요……"
1601706-138 = "오늘…… 선생님 덕분에 버거운 작업이었는데도 금방 마칠 수 있었어요……"
1601706-139 = "[s] \"매번 그렇게 일감이 많은 거야?\""
1601706-140 = "그렇……죠? 아무래도……"
1601706-141 = "이 근처에 정비소는 여기뿐이기도 하고……"
1601706-142 = "이, 이래저래 사건사고가 많으니까요…… 정비 품목이 줄어든 적은 없네요……"
1601706-143 = "[s] \"고생 많네, 정말……\""
1601706-144 = "그, 그래도 요즘은 예전만큼 힘들지는 않은 것 같아요……"
1601706-145 = "왤까요? 딱히 변한 건 없는데……"
1601706-146 = "……"
1601706-150 = "아."
1601706-156 = "아…… 아아……"
1601706-157 = "그, 그랬구나…… 하, 하핫……"
1601706-158 = "[s] \"응? 뭔가 좋은 일이 있었던 거야?\""
1601706-162 = "그, 그러게요! 아하하……"
1601706-163 = "좋은 일…… 조, 좋은 일이라면 있긴 하네요……"
1601706-164 = "[s] \"다행이야, 아오바!\""
1601706-165 = "좋은 일……"
1601706-166 = "으응, 좋은 일."
1601706-170 = "저…… 예전에는 그러지 않았거든요."
1601706-172 = "일상은 항상 힘들고 지겨웠고…… 잠들기 전에는 한숨만 나왔거든요."
1601706-173 = "다음 날 아침이 안 왔으면 좋겠다."
1601706-174 = "아무것도 기대할 수 없고, 실망스러운 날이 또 계속될 테니까."
1601706-177 = "[ns] \"……\""
1601706-178 = "그런데, 요즘은 달라요."
1601706-179 = "잠들기 전에 다음 날이 기대되거든요."
1601706-180 = "어떤 일이 있을지, 어떤 날이 될지…… 그런 것들이, 이제는 기대가 돼요."
1601706-181 = "사실 일과가 변한 건 없는데도요."
1601706-182 = "이상하죠……? 일이 줄어든 것도 아니고……"
1601706-183 = "간부님들이 짜증 나게 하는 것도 마찬가진데……"
1601706-184 = "……"
1601706-185 = "그냥 다음 날이, 그리고 일상이 기대되는…… 이런 경험은 처음이에요."
1601706-186 = "누군가의 존재가…… 이렇게 큰 변화를 줄 수 있다니……"
1601706-187 = "[s5] \"정말 잘 됐어, 아오바!\"\n[s6] \"앞으로도 쭉 그런 날들이 계속됐으면 좋겠네!\""
1601706-192 = "후후…… 네. 그러게요."
1601706-193 = "앞으로도 쭉…… 오늘 같은 날들이."
1601706-195 = "계속되기를……"
