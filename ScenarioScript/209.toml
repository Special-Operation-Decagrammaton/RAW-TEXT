[translation]
209-1 = "불멸성에 대한 담론"
209-10 = "……. 다시 만나게 되었군. 선생이여."
209-11 = "아아, 이 모습 말인가?"
209-12 = "원래도 그다지 보기 좋은 모습은 아니었지만, 이번에는 이런 심한 꼴로 앞에 나타나게 되었군. 그 부분은 양해를 구하지."
209-16 = "……그래, 육신이 있는 존재는 언젠가 죽을 수밖에 없는 운명이지."
209-17 = "모든 것은 사라진다. 죽음과 소멸…… 그것은 존재하는 자가 마땅히 받아들여야 할 숙명."
209-18 = "결국 사라져 버릴 것에게 의미 같은 건 없겠지."
209-22 = "하지만…… 예술만큼은 남는다."
209-23 = "육신을 가진 자가 죽어 없어져도, 예술만큼은 이 세계에 남는다."
209-25 = "죽음 이후에도, 존재의 소멸 이후에도 예술은 남아서 그 존재를, 그 가치를, 그 경지를 끝없이 증거하겠지."
209-26 = "그것이야말로 육신을 가진 존재가 불멸을 꿈꿀 수 있는 단 하나의 방법. 유한이 무한을 추구하는 통로."
209-28 = "……."
209-29 = "그러니 소개하겠다. 선생이여."
209-30 = "우리가 창조해 낸 교의의 인공천사 [ruby=Communio Sanctorum]<모든 성인의 통공>[/ruby]의 새로운 시리즈. 나의 예술 작품."
209-31 = "그레고리오."
209-32 = "그러니 이번에도 갈채를 내려주기 바란다. 선생이여."
209-34 = "공연이 곧 시작될 테니. 부디, 더욱 격렬하게."
