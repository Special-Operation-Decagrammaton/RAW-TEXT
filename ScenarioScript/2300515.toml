[translation]
2300515-1 = "สายฝนกลางทะเลทราย"
2300515-3 = "[ns1] \"ทำงานเสร็จก่อนค่ำเลย!\"\n[ns2] \"ทั้งหมดนี้ต้องขอบใจอายาเนะเลยนะ!\""
2300515-6 = ""
2300515-7 = "ขะ... ขอบคุณที่พูดแบบนั้นค่ะ แต่ฉันไม่ได้ทำอะไรเป็นพิเศษเลยนะคะ...?"
2300515-8 = "การทำงานของฉันรวดเร็วและแม่นยำเสมอ ก็เลยช่วยได้มากงั้นเหรอคะ?#nขะ... ขอบคุณที่พูดแบบนั้นค่ะ แต่ว่า..."
2300515-9 = "จะว่าไป พอลองคิดดูแล้ว ฉันก็สงสัยขึ้นมาเลยค่ะ"
2300515-10 = "ถ้างานเสร็จเร็วกว่ากำหนดเหมือนอย่างวันนี้ คุณครูจะทำอะไรในเวลาที่เหลือเหรอคะ?"
2300515-11 = "[s3] \"โดดงานกับอายาเนะ?\"\n[s4] \"นั่งคุยเล่นกับอายาเนะ?\""
2300515-14 = "คะ... คุณครู!"
2300515-15 = "..."
2300515-16 = "อันที่จริง... ถึงจะทำแบบนั้น ฉันก็ไม่ว่าอะไรหรอกค่ะ..."
2300515-17 = "ถ้าคุณครูทำแบบนั้นจริงๆ ฉันน่าจะดีใจมากกว่าด้วยซ้ำ..."
2300515-18 = "ถะ... ถ้างั้น ฉันจะไปเตรียมเครื่องดื่มกับของว่างมาให้ก่อนแล้วกันค่ะ!"
2300515-19 = ""
2300515-21 = ""
2300515-24 = "อ๊ะ?!"
2300515-25 = "[s] \"เป็นอะไรเหรอ?!\""
2300515-26 = "มะ... ไม่มีอะไรค่ะ แค่กิ๊บติดผมหล่น ขอโทษทีค่ะ"
2300515-29 = ""
2300515-31 = ""
2300515-32 = "นี่ค่ะ คุณครู กาแฟกับช็อกโกแลตค่ะ"
2300515-33 = "คะ? ฉันรู้ได้ยังไงว่าคุณครูดื่มกาแฟแบบไหนน่ะเหรอคะ?"
2300515-34 = "ฮุฮุ..."
2300515-35 = "เรารู้จักกันมาตั้งนานแล้ว เรื่องแค่นั้นไม่ยากหรอกค่ะ"
2300515-37 = "(คุณครูกับอายาเนะเพลิดเพลินกับกาแฟและช็อกโกแลตด้วยกัน)"
2300515-38 = ""
2300515-39 = "[ns] \"จะว่าไป เหมือนอายาเนะติดกิ๊บอันนั้นอยู่ตลอดเลยนะ?\""
2300515-40 = ""
2300515-42 = "คะ?"
2300515-43 = "สะ... สังเกตเห็นด้วยสินะคะ..."
2300515-44 = "[ns] \"ครูก็ไม่รู้เหมือนกันว่าทำไม\""
2300515-45 = "ค่ะ..."
2300515-46 = "ถึงจะไม่รู้ว่าทำไม แต่ฉันก็ดีใจนิดหน่อย ไม่สิ... อาจจะ... ดีใจมากเลยก็ได้ค่ะ..."
2300515-47 = "อันที่จริง กิ๊บติดผมรูปดอกไม้อันนี้เป็นรูปทรงที่ไม่มีอยู่จริงค่ะ"
2300515-48 = "[ns] \"หืม? แต่เหมือนจะ... มีอยู่ที่ไหนสักแห่งนะ?\""
2300515-49 = "ตอนแรกฉันก็คิดแบบนั้น แต่พอลองค้นดู กลายเป็นว่าฉันเข้าใจผิดค่ะ"
2300515-50 = "มันดูเหมือนดอกยูกิโนะชิตะอยู่นิดหน่อย แต่ดอกนั้นมีกลีบห้ากลีบค่ะ"
2300515-51 = "ก็คงเหมือนเครื่องประดับประเภทนี้ทั่วไป... ที่นำดอกไม้ป่ามาดัดแปลงเป็นรูปทรงเรียบง่ายน่ะค่ะ"
2300515-52 = "แต่ฉันชอบความรู้สึกเรียบง่ายและธรรมดาแบบนั้นค่ะ"
2300515-53 = "รู้สึกประมาณว่า \"อย่างน้อยถ้าฉันช่วยจดจำดอกไม้แบบนี้ไว้ก็คงจะดีละนะ\" อะไรทำนองนั้นค่ะ"
2300515-54 = "[ns] \"จิตใจดีจังเลยนะ อายาเนะ\""
2300515-55 = "ขอบคุณค่ะ"
2300515-56 = "เราต้องใส่ใจสิ่งธรรมดาๆ ที่มักถูกมองข้ามให้ดี เพื่อลดความสูญเสียในรูปแบบต่างๆ ในอนาคตค่ะ"
2300515-57 = "อย่างใบเสร็จ... หรือพวกข้อกำหนดและเงื่อนไข..."
2300515-58 = "หรือข้อความเกี่ยวกับความเสี่ยงตรงด้านล่างของหน้าสุดท้ายในสัญญาประกันภัย ที่เขียนมาตัวเล็กจิ๋วจนต้องใช้แว่นขยายถึงจะพอมองเห็นได้!!!"
2300515-59 = "[s] \"เป็นความมุ่งมั่นที่แรงกล้าเลยนะ อายาเนะ...\""
2300515-60 = "ฮู่ว... ขอบคุณค่ะ คุณครู"
2300515-61 = "กิ๊บติดผมอันนี้... ฉันใช้มาตั้งแต่สมัยมัธยมต้นเลยค่ะ"
2300515-62 = "ฉันถึงกับซื้อถุงเท้าลายคล้ายๆ กันมาเลยนะคะ"
2300515-63 = "เอ๋...?"
2300515-64 = "ตะ... แต่ว่าทำไมจู่ ๆ ฉันถึงมาพูดเรื่องถุงเท้าต่อหน้าคุณครูล่ะคะ?!"
2300515-65 = "ฉันไม่ได้เป็นพวกที่ดูเรียบร้อย แต่กลับชิงพูดเรื่องแบบนี้ขึ้นมาก่อนเสียหน่อยนะคะ!"
2300515-66 = "[s] \"ถ้าถามแบบนั้น ครูก็ไม่รู้เหมือนกัน!\""
2300515-67 = "นะ... นั่นสินะคะ... ขอโทษด้วยค่ะ ฉันตกใจเกินไปหน่อยน่ะค่ะ"
2300515-68 = ""
2300515-69 = ""
2300515-70 = "..."
2300515-71 = "คุณครู ทราบไหมคะว่าแม้แต่ในทะเลทรายก็มีดอกไม้บานด้วย?"
2300515-72 = "[s] \"ในทะเลทรายเหรอ?\""
2300515-73 = "อันที่จริงฉันเองก็ยังไม่เคยเห็นกับตาค่ะ"
2300515-74 = "แต่ได้ยินว่าถ้ามีฝนตกลงมาในรอบหลายปี หรืออาจจะเป็นสิบกว่าปี..."
2300515-75 = "เมล็ดพันธุ์ที่ซ่อนอยู่ในผืนทรายจะแข่งกันเติบโต และผลิดอกพร้อมกันทั้งหมดเลยค่ะ"
2300515-76 = "แต่ในไม่กี่สัปดาห์ต่อมา ลมร้อนก็จะพัดมาอีกครั้ง จนต้นไม้และดอกไม้ทั้งหมดเหี่ยวแห้งและตายไปค่ะ"
2300515-77 = "นั่นก็เพราะพวกมันต้องทิ้งเมล็ดพันธุ์รุ่นถัดไปไว้ให้ได้ค่ะ"
2300515-78 = "จากนั้นเมล็ดพันธุ์เหล่านั้นก็จะหลับใหลอยู่ในผืนทรายอีกครั้ง จนกว่าจะมีฝนตกลงมาอีกค่ะ"
2300515-79 = "พอคิดถึงเรื่องนั้นแล้ว ฉันรู้สึกว่าไม่ใช่เรื่องอื่นไกลเลยค่ะ"
2300515-80 = "สักวันหนึ่ง ฝนจะตกที่อะบิดอสบ้างมั้ยคะ...?"
2300515-81 = "[s] \"อืม ครูก็หวังว่าจะเป็นอย่างนั้นนะ\""
2300515-82 = "อันที่จริง ถ้าฝนตกในทะเลทราย "
2300515-83 = "ก็มักต้องมีปรากฏการณ์สภาพอากาศผิดปกติในระดับหนึ่งร่วมด้วย โอกาสที่ฝนจะตกถึงจะสูงขึ้น..."
2300515-84 = "เพราะงั้น นั่นอาจไม่ใช่เรื่องที่ดีเสมอไปก็ได้ค่ะ"
2300515-85 = "[s] \"คะ... ครูต้องถอนคำพูดเมื่อกี้หรือเปล่านะ...?!\""
2300515-86 = "อะฮะฮ่า... ไม่จำเป็นต้องทำถึงขนาดนั้นหรอกค่ะ"
2300515-87 = "เพราะฝนอาจตกลงมาด้วยเหตุผลอื่นๆ ได้ ต่อให้ไม่มีปรากฏการณ์สภาพอากาศผิดปกติค่ะ"
2300515-88 = "และในแง่หนึ่ง ที่อะบิดอส... ก็อาจถือได้ว่า ฝนได้มาเยือนแล้วค่ะ"
2300515-89 = "[s5] \"ฝนตกลงมาแล้วเหรอ?\"\n[s6] \"ทำไมไม่บอกครูบ้างล่ะ!\""
2300515-92 = "ฮุฮุ... คิดไว้อยู่แล้วค่ะว่าคุณครูจะต้องพูดแบบนั้น"
2300515-93 = "คะ? ถ้าฝนตกลงมาแล้ว แล้วมีดอกไม้บานหรือยังน่ะเหรอคะ?"
2300515-94 = "อืม..."
2300515-95 = "มีแล้วค่ะ อย่างน้อยก็สำหรับฉันน่ะค่ะ"
2300515-96 = "[s] \"ทำไมยิ่งฟังยิ่งไม่เข้าใจนะ...\""
2300515-97 = "ชะ... ใช่มั้ยล่ะคะ?"
2300515-98 = "แต่ยังไงก็ค่อยยังชั่วนะคะ..."
2300515-99 = "[s] \"ทำไมเหรอ?\""
2300515-100 = "ก็ไม่รู้สิคะ เพราะอะไรกันนะ?"
2300515-101 = "แต่ถ้าครั้งหน้ามีฝนตกลงมาจริงๆ"
2300515-102 = "แล้วทำให้ดอกไม้ผลิบานในอะบิดอส..."
2300515-103 = "ฉันก็อยากชมภาพนั้นกับคุณครูค่ะ"
2300515-104 = "[s] \"ได้สิ ไว้ไปดูด้วยกันให้ได้นะ\""
2300515-105 = "สัญญาแล้วนะคะ?"
2300515-106 = "ถ้างั้น เพื่อเป็นหลักฐานของสัญญา..."
2300515-107 = "ฉันจะมอบสิ่งนี้ให้ค่ะ"
2300515-108 = ""
2300515-110 = ""
2300515-112 = "ไม่เป็นไรค่ะ ฉันยังมีอยู่อีกหลายอัน"
2300515-113 = "คุณครูไม่จำเป็นต้องเอาไปติดผมก็ได้..."
2300515-114 = "แค่ช่วยเก็บรักษาไว้ ฉันก็ดีใจแล้วค่ะ"
2300515-115 = "[ns] \"ขอบใจนะ\""
2300515-116 = ""
2300515-117 = "ไม่เป็นไรค่ะ"
2300515-118 = ""
2300515-120 = ""
2300515-121 = ""
2300515-122 = "คนที่ควรขอบคุณคือพวกเรา..."
2300515-123 = "คือเราชาวอะบิดอสต่างหากค่ะ"
2300515-125 = "(คุณครูใช้เวลาช่วงเย็นโดดงานอย่างเต็มที่ไปกับอายาเนะ ซึ่งดูสนุกสนานกว่าปกติอย่างบอกไม่ถูก)"
