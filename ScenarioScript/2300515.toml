[translation]
2300515-1 = "Rain in the Desert"
2300515-3 = "[ns1] \"We actually finished before the sun went down!\"\n[ns2] \"It's all thanks to you, Ayane!\""
2300515-6 = ""
2300515-7 = "I-I appreciate it, but I didn't do much."
2300515-8 = "You think my work is always accurate, and I work quickly? Again, I think you're giving me too much credit..."
2300515-9 = "I have a question, though!"
2300515-10 = "In situations like these, when you finish work early, what do you like to do?"
2300515-11 = "[s3] \"Slack off with Ayane.\"\n[s4] \"Hang out with Ayane.\""
2300515-14 = "S-Sensei!"
2300515-15 = "..."
2300515-16 = "Ah. I didn't mean to sound reproachful. I like...the thought of that..."
2300515-17 = "Actually, I really like the thought of that..."
2300515-18 = "A-Anyways, let me get you something to drink! Or snack on! Or anything!"
2300515-19 = ""
2300515-21 = ""
2300515-24 = "Eek!"
2300515-25 = "[s] \"Are you okay?!\""
2300515-26 = "Y-Yes! I just dropped my hairpin."
2300515-29 = ""
2300515-31 = ""
2300515-32 = "Here, Sensei. I brought coffee and chocolate."
2300515-33 = "Hm? How did I know how you like your coffee?"
2300515-34 = "Fufu..."
2300515-35 = "We've known each other for a long time now, Sensei. Of course I know that much!"
2300515-37 = "Ayane and I enjoyed the chocolate and perfectly brewed coffee together."
2300515-38 = ""
2300515-39 = "[ns] \"Come to think of it, you're always wearing that hairpin.\""
2300515-40 = ""
2300515-42 = "Hm?"
2300515-43 = "Ah, you noticed..."
2300515-44 = "[ns] \"Do you know how long we've known each other?\""
2300515-45 = "Yes..."
2300515-46 = "That makes me really happy... Heehee."
2300515-47 = "I like the shape of the hairpin. You can't find a flower that looks like this anywhere."
2300515-48 = "[ns] \"Really? It looks like you'd be able to!\""
2300515-49 = "That's what I thought too, but I searched high and low and couldn't find one."
2300515-50 = "Saxifrages are the closest you'll get, but those have five petals."
2300515-51 = "I just like it because...at first glance, it seems like just a simple wildflower you'd see anywhere."
2300515-52 = "And for some reason, I liked the ordinary feeling it gave."
2300515-53 = "It made me think, wouldn't it be nice if someone, even if it's just me, gave this flower the attention it deserves?"
2300515-54 = "[ns] \"You have such a kind heart, Ayane.\""
2300515-55 = "Thank you."
2300515-56 = "It's important to take care with the small details! Things that are easily overlooked are the most likely to cause losses later on!"
2300515-57 = "Things like receipts, terms and conditions..."
2300515-58 = "Or the risk clauses written in fine print so small that you'd need a magnifying glass to read them on the bottom of insurance contracts!!"
2300515-59 = "[s] \"You have such an...earnest heart, Ayane.\""
2300515-60 = "Phew. Thanks, Sensei."
2300515-61 = "I've been wearing this hairpin ever since I became a middle school student."
2300515-62 = "I even ended up buying socks with the same pattern."
2300515-63 = "...Eh?"
2300515-64 = "Wh-Why am I describing my sock drawer to you, of all people?!"
2300515-65 = "What am I, a cat that climbs onto the stove?"
2300515-66 = "[s] \"I don't think I have an answer to that...\""
2300515-67 = "Ack. You're right, I'm sorry. I got a little flustered."
2300515-68 = ""
2300515-69 = ""
2300515-70 = "..."
2300515-71 = "Sensei, did you know that there are flowers that can bloom in the desert?"
2300515-72 = "[s] \"Really? How is that possible?\""
2300515-73 = "I've never actually seen it myself."
2300515-74 = "But on the rare occasion it rains, every several years, or even decades..."
2300515-75 = "That's when seeds that are hidden deep in the sand bloom, all at once."
2300515-76 = "Their lifespans are short. The hot wind will dry everything up again, and they'll wilt soon after."
2300515-77 = "But before they do, they leave their seeds for the next generation to bloom one day."
2300515-78 = "And those seeds will sleep, deep in the sand, until the rain comes again."
2300515-79 = "For some reason, I really related to it when I first heard that."
2300515-80 = "...Do you think it'll rain in Abydos one day?"
2300515-81 = "[s] \"I hope so.\""
2300515-82 = "All kinds of climate anomalies usually come... "
2300515-83 = "...before it can rain in the desert."
2300515-84 = "So it isn't necessarily a good thing..."
2300515-85 = "[s] \"Sh-Should I take back what I just said...?!\""
2300515-86 = "Ahaha, well, I wouldn't go that far."
2300515-87 = "All kinds of different things can cause rain, good and bad!"
2300515-88 = "From a certain perspective, rain has already come to Abydos."
2300515-89 = "[s5] \"Really?\"\n[s6] \"You should have told me!\""
2300515-92 = "Fufu... I knew you would say that, Sensei."
2300515-93 = "Hmm? Did the flowers bloom, you ask?"
2300515-94 = "Well..."
2300515-95 = "For me, they did."
2300515-96 = "[s] \"What does that mean?!\""
2300515-97 = "W-Well..."
2300515-98 = "It's better you don't know."
2300515-99 = "[s] \"Huh? What? Why?\""
2300515-100 = "Yeah, I wonder why."
2300515-101 = "The next time it rains in Abydos..."
2300515-102 = "...and the flowers bloom in the desert..."
2300515-103 = "...I'd love to see it with you, Sensei."
2300515-104 = "[s] \"Sure thing. I promise.\""
2300515-105 = "Okay, it's a promise."
2300515-106 = "As proof of our pact..."
2300515-107 = "I'll give you this."
2300515-108 = ""
2300515-110 = ""
2300515-112 = "Don't worry, I have a couple of them."
2300515-113 = "You don't need to wear it..."
2300515-114 = "But keep it safe, okay?"
2300515-115 = "[ns] \"Thank you.\""
2300515-116 = ""
2300515-117 = "Not at all."
2300515-118 = ""
2300515-120 = ""
2300515-121 = ""
2300515-122 = "In fact..."
2300515-123 = "I'm the one who's grateful."
2300515-125 = "I had a great time slacking off the rest of the day with Ayane, who looked happier than she usually did, for some reason."
