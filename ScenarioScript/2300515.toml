[translation]
2300515-1 = "落在沙漠的雨"
2300515-3 = "[ns1] 「在天黑之前就完成工作了──！」\n[ns2] 「全都多虧了綾音呢──！」"
2300515-6 = ""
2300515-7 = "雖，雖然很感謝您這麼說，不過我好像也沒有特別做什麼……？"
2300515-8 = "我做事一向準確又迅速，相當有幫助……？#n非，非常感謝您的誇獎……"
2300515-9 = "不過聽您這麼一說，我倒是突然有點好奇。"
2300515-10 = "像這樣工作比平常還早結束的時候，剩下的時間老師都會做些什麼呢？"
2300515-11 = "[s3] 「和綾音一起蹺班？」\n[s4] 「和綾音一起偷閒？」"
2300515-14 = "老，老師！？"
2300515-15 = "……"
2300515-16 = "其實，就算那樣我也並不討厭……"
2300515-17 = "或者應該說，反而會覺得很開心……"
2300515-18 = "那，那麼，我先去準備一些茶點過來吧！"
2300515-19 = ""
2300515-21 = ""
2300515-24 = "啊啊！？"
2300515-25 = "[s] 「怎麼了！？」"
2300515-26 = "沒，沒事。只是髮夾掉了而已。不好意思。"
2300515-29 = ""
2300515-31 = ""
2300515-32 = "來，老師請用。這是咖啡和巧克力。"
2300515-33 = "咦？我怎麼知道老師喜歡的咖啡口味……是嗎？"
2300515-34 = "呵呵……"
2300515-35 = "我們認識也不是一天兩天了，這種程度的事情我還是知道的。"
2300515-37 = "（和綾音一起享用了咖啡和巧克力）"
2300515-38 = ""
2300515-39 = "[ns] 「話說回來，你好像總是戴著那個髮夾呢？」"
2300515-40 = ""
2300515-42 = "咦？"
2300515-43 = "啊，您注意到了呢……"
2300515-44 = "[ns] 「不知為何就注意到了？」"
2300515-45 = "是……"
2300515-46 = "不過還是有點……不，是非常開心呢……"
2300515-47 = "其實這個髮夾的造型，是現實中不存在的花朵哦。"
2300515-48 = "[ns] 「咦？可是總覺得……好像在哪裡見過？」"
2300515-49 = "我一開始也是這麼想的，不過調查之後發現並不是呢。"
2300515-50 = "虎耳草的花有點類似的感覺，但是它卻是五片葉子。"
2300515-51 = "我想……應該就像這類產品常見的方式一樣，只是將野花簡化後設計的造型吧。"
2300515-52 = "不過正是那種簡單又平凡的感覺，不知為何讓我相當喜歡。"
2300515-53 = "這樣的花，就算只有我記得也挺好的……那樣的感覺。"
2300515-54 = "[ns] 「你真善良呢，綾音。」"
2300515-55 = "謝謝您。"
2300515-56 = "這種平凡又容易被忽略的事物就該好好留意，日後在各種意義上的損失才會減少嘛。"
2300515-57 = "像是收據啦……條款啦……"
2300515-58 = "還有保險合約最後一頁下方，字小到得拿放大鏡才能勉強看到的條款之類的！！！"
2300515-59 = "[s] 「……真是懇切的想法呢，綾音。」"
2300515-60 = "呼……謝謝您，老師。"
2300515-61 = "這個髮夾……是我在升上國中之後開始戴的。"
2300515-62 = "我甚至還特地買了花紋類似的襪子呢。"
2300515-63 = "……哎呀？"
2300515-64 = "為，為什麼我會突然在老師面前聊起襪子的事！？"
2300515-65 = "我又不是那種會搶先跳上灶台的貓咪！"
2300515-66 = "[s] 「你問我我也不知道啊！」"
2300515-67 = "說，說的也是……抱歉。我太慌張了。"
2300515-68 = ""
2300515-69 = ""
2300515-70 = "……"
2300515-71 = "老師您知道，其實在沙漠裡也會開花嗎？"
2300515-72 = "[s] 「在沙漠裡？」"
2300515-73 = "其實我自己也還沒親眼見過就是了。"
2300515-74 = "不過難得時隔幾年，或者十幾年下雨的時候……"
2300515-75 = "藏在沙中的種子們就會爭先恐後地生長，一齊綻放花朵呢。"
2300515-76 = "因為幾週之後炎熱的風又會吹起，導致它們全都乾枯而死……"
2300515-77 = "所以得設法在那之前留下下一批種子才行。"
2300515-78 = "接著那些種子又會在沙中不斷沉睡，直到下一場雨落下為止。"
2300515-79 = "一想到這些……就莫名覺得不像是別人的事呢。"
2300515-80 = "……阿拜多斯，也會迎來下雨的那天嗎？"
2300515-81 = "[s] 「嗯。希望如此呢。」"
2300515-82 = "其實沙漠要下雨的話……"
2300515-83 = "通常得要伴隨某種程度的氣候異常，下雨的可能性才會提高……"
2300515-84 = "所以也不見得一定是好事就是了。"
2300515-85 = "[s] 「剛，剛才那句話是不是收回比較好……！？」"
2300515-86 = "啊哈哈……也不一定會那樣啦。"
2300515-87 = "就算沒有出現氣候異常，也可能因為各種其他的理由而下雨。"
2300515-88 = "而且從某種意義上來說……阿拜多斯也已經算是已經有雨到來了呢。"
2300515-89 = "[s5] 「是嗎？」\n[s6] 「也告訴我一聲嘛！」"
2300515-92 = "呵呵……老師您果然會這麼說呢。"
2300515-93 = "咦？您問那花開了嗎……？"
2300515-94 = "唔嗯……"
2300515-95 = "至少對我來說……已經開了？"
2300515-96 = "[s] 「越來越搞不懂了……」"
2300515-97 = "是，是嗎？"
2300515-98 = "不過這樣或許也不錯呢……"
2300515-99 = "[s] 「這又是為什麼？」"
2300515-100 = "這個嘛……是為什麼呢？"
2300515-101 = "如果下次真的下雨……"
2300515-102 = "阿拜多斯真的有花朵盛開的話……"
2300515-103 = "希望能跟老師一起欣賞那樣的景象呢。"
2300515-104 = "[s] 「好。我們一定要一起看。」"
2300515-105 = "這是我們的約定哦？"
2300515-106 = "那麼作為約定的證明……"
2300515-107 = "這個送給您。"
2300515-108 = ""
2300515-110 = ""
2300515-112 = "沒關係。我其實還有好幾個呢。"
2300515-113 = "老師不一定要戴在頭上也沒關係……"
2300515-114 = "不過要是您願意收著的話，我會很開心的。"
2300515-115 = "[ns] 「謝謝。」"
2300515-116 = ""
2300515-117 = "不客氣。"
2300515-118 = ""
2300515-120 = ""
2300515-121 = ""
2300515-122 = "應該道謝的是我們……"
2300515-123 = "是我這邊才對呢。"
2300515-125 = "（和不知為何看起來比平常更開心的綾音一起，充實地度過了下午的偷閒時光）"
