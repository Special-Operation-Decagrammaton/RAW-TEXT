[translation]
31060-1 = "제6화;자기소개의 시간"
31060-2 = "보충수업부 교실"
31060-3 = "(간단한 자기소개와 보충수업부의 소개가 이어졌다.)"
31060-4 = "……저기, 그런 거니까. 앞으로 짧은 시간이지만 잘 부탁드려요……."
31060-5 = "[s] \"잘 부탁드립니다.\""
31060-6 = "……."
31060-7 = "……."
31060-8 = "……."
31060-11 = "아우…… 저기…… 다들 잘 이해했으려나……."
31060-12 = "물론. 이제 정규 수업 외에 매일 방과 후에 특별 훈련을 더 한다는 거잖아."
31060-13 = "네…… 우리의 목표는 앞으로 있을 특별 학업 능력 평가 시험…… 그걸 모두가 함께 통과하는 것……."
31060-14 = "거, 거창한 목표도 아니라…… 다 같이 낙제를 받지 않는 것! 그 정도니까요……. 선생님도 전력으로 도와주실 거고……."
31060-15 = "평가 시험은 앞으로 3차까지 있지만, 우리가 낙제를 면하면 더이상 시험은 치르지 않아도 되고…… 보충수업도 거기서 종료인 거예요!"
31060-16 = "선생님은 주로 저희를 관리, 감독하고 일정을 체크해주실 거고…… 다양한 수업의 보충도 지원해 주실 거예요."
31060-17 = "이해했어. 어려운 임무는 아니야. 미션을 다 같이 성공적으로 완수한다. 그러기 위해 매일 여기에 모여 훈련을 거듭한다."
31060-18 = "결국 각자의 리타이어를 막기 위해 모인 모임. 굳이 내가 사보타주를 할 이유는 없지."
31060-19 = "네! 맞아요. 저기, 아즈사 쨩. 아즈사 쨩은 전학 온 지 얼마 되지 않았잖아요?"
31060-20 = "아직 이 학원에 적응하는 중인 거니까, 선생님과 함께 노력하다 보면 금세 보충수업을 끝낼 수 있을 거예요."
31060-21 = "어머? 시라스 씨는 전학 온 거예요?"
31060-22 = "이 트리니티에? 별로 그런 케이스는 잘 없었는데……."
31060-23 = "……."
31060-24 = "아…… 서류상으로는 그렇게 적혀 있어서…… 아우…… 혹시 제가 괜한 말을……."
31060-25 = "아니, 딱히 숨길 일은 아니야. 신경 쓰지 않아도 돼. 사실이니까."
31060-26 = "적응이야 하면 되는 문제고. 노력이야 하면 되는 거고."
31060-27 = "흐음……."
31060-28 = "응, 그럼 저도 아즈사 쨩이라고 불러도 되나요?"
31060-29 = "……? 딱히 상관없는데?"
31060-30 = "응, 아즈사 쨩. 히후미 쨩. 그리고 코하루 쨩. 우후후후. 좋은 울림이네요. 보충수업의 동지들이에요."
31060-31 = "아즈사 쨩은 얼음마녀처럼 생겨서 은근히 귀여운 부분도 있고. 후후후."
31060-37 = "……."
31060-38 = "그치만 코하루 쨩이 헤이트에 가득 찬 표정으로 우릴 보고 있어요?"
31060-39 = "저기…… 마, 말해두지만. 난 인정 못하니까……!"
31060-40 = "아, 아우?"
31060-41 = "어떤 걸요?"
31060-42 = "나, 나는! 엘리트 정의실현부원이니까!"
31060-43 = "따, 딱히 내 나이가 어리다고 선배라고 부르라거나, 그런 건 절대 용납 안할 거고!"
31060-44 = "그리고 이딴 보충수업부도 얼른 탈출해버릴 거니까!! 크게 친한 척하진 말아줬으면 좋겠거든!"
31060-45 = "……음, 그러네요. 보충수업부에서까지 선후배를 굳이 따질 필요는 없죠. 저는 불만 없답니다."
31060-46 = "나도 딱히 상관은 없어. 그런 문화에 익숙하지도 않고."
31060-47 = "그리고 어차피 서로의 이익을 위해 모인 거니 굳이 친한 척할 이유가 없잖아?"
31060-48 = "아, 아우우……."
31060-49 = "잘됐네! 사실은 말이지, 숨기고 있었던 비밀이 있었거든?"
31060-50 = "내가 그동안 낙제를 받은 이유는…… 사실은 월반을 위해 2학년 시험을 쳤기 때문이야!"
31060-51 = "월반을요? 왜 그런 짓을……?"
31060-52 = "왜냐니……?! 나는 앞으로 정의실현부의 엘리트가 될 몸이니까……!"
31060-53 = "음, 그치만 그렇게 해서 낙제를 받은 거잖아요? 한 번 정도는 시도할 수 있겠지만, 그걸 몇 번이나 반복했다는 건……."
31060-54 = "시, 시끄러! 내가 하고 싶은 말은 그게 아냐!"
31060-56 = "핵심은, 난 힘을 숨기고 있었다, 이거야."
31060-61 = "그런 내가 이번 시험엔 제대로 1학년 시험을 쳐 줄 거니까! 그럼 단번에 우수상을 받겠지?"
31060-66 = "그걸로 보충수업부를 탈출해주겠어!"
31060-67 = "우수상을 받으면 보충수업을 수료한다는 약속은 없었지만……."
31060-68 = "자신의 전력을 숨기는 기만책인가. 참고로 나도 1학년 시험을 치는 중이야."
31060-69 = "과, 관심없거든? 그러니까 보충수업부든 뭐든 다음 시험으로 안녕이라는 거야! 짧은 시간동안 반가웠어, 그런 얘기지!"
31060-70 = "이걸로 내 전략은 완벽해! 나는 신경 쓰지 않아도 돼! 아하하하!"
31060-71 = "그럼 안녕! 열심히들 하라고!"
31060-74 = "아, 아우……. 가, 가버렸어요……."
31060-75 = "후후, 코하루 쨩은 텐션의 폭이 큰 게 재미있네요."
31060-76 = "거기에 비해 아즈사 쨩은 거의 일관된 느낌이라 재미있고."
31060-79 = "아우우……."
31060-80 = "앞으로가 기대되네요. 후후훗."
31060-82 = "(그 후 보충수업부는 매일 방과 후에 교실에 모여 특별 수업을 받기 시작했다.)"
31060-84 = "다음화;시험 준비"
