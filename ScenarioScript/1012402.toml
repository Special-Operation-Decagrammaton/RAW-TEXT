[translation]
1012402-1 = "소녀에게는 시간이 필요해"
1012402-2 = "……그렇게 된 겁니다."
1012402-7 = "(하스미가 가져온 일정표를 보니…… 한시도 쉬지 않겠다는 의지가 느껴진다.)"
1012402-8 = "[ns1] \"다들 이렇게 바쁜 거야?\"\n[ns2] \"너무한 일정…….\""
1012402-11 = "아니요. 정의실현부는 그렇게 가혹하지 않습니다."
1012402-12 = "이건 부 전체 일정입니다. 개인 일정은 개별로 기재되어 있어요."
1012402-13 = "(다시 보니 하스미 말대로 일정마다 참석 인원 이름이 따로 적혀 있다.)"
1012402-14 = "물론…… 일정 외의 시간은 자유롭게 보내도 됩니다."
1012402-15 = "선생님 말씀처럼 모처럼의 바다니까요."
1012402-16 = "언제나 노력하는 부원들을 위한…… 저 나름대로의 소박한 선물이라 할까요."
1012402-17 = "[s3] \"하지만 하스미는……\"\n[s4] \"모든 일정에 참석하게 되어 있는데……?\""
1012402-20 = "그야 저는 부부장이니까요."
1012402-21 = "대부분 의전처럼 형식적인 일정이니, 너무 염려하지 않으셔도 됩니다."
1012402-22 = "오히려 순찰이나, 사무 업무에서 해방되는 만큼 평소보다 편한 축에 속하겠죠."
1012402-23 = "……네?"
1012402-24 = "저를 위한 시간도 가지라고요?"
1012402-25 = "후후. 그 말씀만으로 기운이 나네요. 저는 괜찮습니다."
1012402-26 = "[s5] \"혹시 모르니까 수영복은 챙겨두자.\"\n[s6] \"일정이 취소될 수도 있잖아.\""
1012402-29 = "……선생님."
1012402-30 = "[s7] \"그리고 해변에서 활동하는 거지?\"\n[s8] \"혹시 교복이 젖으면 곤란하잖아!\""
1012402-33 = "하아……."
1012402-34 = "결국, 이러다가 슬쩍 쉬는 흐름으로 만드시려는 거죠?"
1012402-35 = "[s9] \"조금 티 났어?\"\n[s10] (생각을…… 읽었다고……?!)"
1012402-38 = "선생님께서는, 학생과 관련되면 조금 알기 쉬워지셔서……."
1012402-43 = "아, 물론! 싫다는 뜻은 아닙니다. 오히려 감사하죠."
1012402-44 = "최근 알게 되었지만, 저는 이런 자기 관리에…… 남들보다 조금 서툰 편인 듯하더군요."
1012402-45 = "[s] (의외로 자각이 있구나…….)"
1012402-46 = "교복이 젖으면 곤란하다……. 그것도 분명 틀린 말은 아니죠."
1012402-47 = "알겠습니다."
1012402-48 = "[s] \"그 말은……?\""
1012402-51 = "네. 선생님의 배려를 너무 사양해도, 예의가 아니니까요."
1012402-52 = "의상 정도는 형식에 구애받지 않아도 괜찮겠죠."
1012402-53 = "하지만, 기존 일정에 변동은 없습니다."
1012402-54 = "제가 빠지게 되면, 결국 누군가 그 자리를 채워야 하니까요."
1012402-55 = "선생님께서도 그걸 바라시는 건 아니시겠죠?"
1012402-56 = "[s11] \"그 부분은 하스미의 결정을 존중할게.\"\n[s12] \"그나저나 수영복은 있어?\""
1012402-59 = "그러고 보니, 사이즈가 맞지 않게 되었죠."
1012402-60 = "아, 오해하지 말아 주세요! 체중은 그다지…… 늘지 않았으니까요!"
1012402-61 = "그저 1년 사이에 조금 성장한 탓에……."
1012402-62 = "[s13] \"괜찮아. 수영복은 새로 맞추면 되니까.\"\n[s14] \"새 수영복을 사러 가자!\""
1012402-65 = "안 됩니다."
1012402-66 = "[s] \"아, 오후에 일정 있어? 그러면 내일……\""
1012402-67 = "내일도 안 됩니다."
1012402-68 = "[s] \"저…… 하스미 양?\""
1012402-69 = "일주일……."
1012402-73 = "제게 일주일만 시간을 주시죠. 그때까지 준비해 오겠습니다."
1012402-74 = "[s15] \"좀 비장하지 않아?\"\n[s16] \"고작 수영복 사러 가는 건데…….\""
1012402-77 = "아니요. 이럴 만한 중대사입니다."
1012402-78 = "그러면, 일주일 후에 다시 뵙는 걸로 하겠습니다."
1012402-79 = "이만 실례했습니다."
1012402-84 = "(하스미는 결의에 찬 모습으로 떠나갔다.)"
