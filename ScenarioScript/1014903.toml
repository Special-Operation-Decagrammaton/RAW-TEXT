[translation]
1014903-1 = "ダイバーと船歌"
1014903-3 = "（日差しの強い、ある日の午後）"
1014903-4 = "（ココロとのダイビング後、片付けの最中……）"
1014903-5 = ""
1014903-7 = "ふん、ふーん……♪"
1014903-8 = "（少し離れたところから戻ってくると、ココロが鼻歌を歌いながら片づけをしていた)"
1014903-9 = ""
1014903-10 = "♪おひさま　さんさん、こいしは　きらきら……♪"
1014903-11 = "……ふふふ～ん♪"
1014903-12 = "[s1] \"それ、なんて歌？\"\n[s2] \"素敵なメロディーだね。\""
1014903-15 = "あ、先生。"
1014903-16 = "歌って、なんのことですか？"
1014903-17 = "[s] \"今、口ずさんでなかった？\""
1014903-18 = "……あ。"
1014903-19 = "あああ……！"
1014903-20 = "気にしないでください！忘れてください！"
1014903-21 = "うぅ、作業してるうちに楽しくなっちゃって……つい歌ってしまいました……！"
1014903-22 = "先生にこんな姿を見られるなんて……。"
1014903-23 = "[s3] \"別に恥ずかしがらなくても。\"\n[s4] \"素敵な歌だったよ。\""
1014903-26 = "でも……やっぱり人に聞かせるのは恥ずかしいです。"
1014903-27 = "今のは即興の鼻歌でしたけど……。"
1014903-28 = "中学以来、人前で歌うことはありませんでしたし……。"
1014903-29 = "[s] \"そうなの？ココロの声、綺麗なのに。\""
1014903-30 = "自分では思ったことないのですが……ありがとうございます。"
1014903-31 = "でも、私が歌うと……悪いことが起きるから……。"
1014903-32 = "[s] \"悪いこと？\""
1014903-33 = "……はい。"
1014903-34 = "先生はセイレーンの伝説をご存知ですか？"
1014903-37 = "セイレーンは……下半身が海鳥の姿をした、伝説の怪物なのですが――"
1014903-38 = "その歌声を聞いた船員は、みんな海へ飛び込んでしまうのだそうです。"
1014903-39 = "不思議なことに……私が歌うときも、聴いた人は海に飛び込んでしまうんです。"
1014903-40 = "[s] \"セイレーンの歌みたいに？\""
1014903-41 = "はい。#n飛び込んだ理由を聞きましたが……みんな、目をそらして言葉をにごすばかりで。"
1014903-43 = ""
1014903-44 = "もしかしたら、私の祖先に本物のセイレーンがいるのかもしれません。"
1014903-45 = "セイレーンは空想上の存在なんですけどね。"
1014903-46 = "まぁ、なんとなくそう思っているだけなんですけど。#nみんなが水に飛び込まないように、人前で歌うのは控えていたんです。"
1014903-47 = "[s5] \"そうだったんだ。でも、なんだかもったいないね。\"\n[s6] \"どんな歌声か、私も聴いてみたいな。\""
1014903-48 = ""
1014903-51 = ""
1014903-55 = "[ns7] \"じゃあさ、ココロ。今から――\"\n[ns8] \"私の前で歌ってよ！\""
1014903-58 = "はい！？先生、話聞いてました！？"
1014903-59 = "危険です！海に飛び込みたくなっちゃうかも……！"
1014903-60 = "[s9] \"大丈夫だよ、この辺はそんなに深くないし。\"\n[s10] \"心配なら、私を縛ってから歌ってみたら？\""
1014903-63 = "たしかに、それなら安全ですが……。"
1014903-64 = "本当に、いいんですか……？"
1014903-65 = "[s] \"うん！ココロの歌声、聴きたい！\""
1014903-66 = "……分かりました。少し、失礼します。"
1014903-67 = ""
1014903-69 = ""
1014903-70 = ""
1014903-71 = ""
1014903-75 = ""
1014903-76 = "試しに、手足を動かしてみてください。"
1014903-77 = "……大丈夫そうですね。"
1014903-78 = "では……。"
1014903-79 = "[ruby=とうみ]渡海[/ruby]ココロ、歌います！"
1014903-81 = "（少し緊張した面持ちで、ココロが歌いはじめた）"
1014903-82 = "（ココロの歌声は……聞き心地は悪くなかったのだが……）"
1014903-83 = ""
1014903-84 = "♭わたしの　なまえは　♯ココロ～♪"
1014903-86 = "（歌い出しの時点で、みんなが水に飛び込んだ理由が分かった）"
1014903-87 = ""
1014903-88 = "うみを♭　およぐ　ダイビングぶの　#ぶちょう～"
1014903-90 = "（ココロの歌は、リズムも音程もバラバラで……聴いていると不安になってくる）"
1014903-91 = "（本人は気づいてない様子だったが……。#n見ている方がいたたまれなくなるほどの……音痴だった）"
1014903-92 = ""
1014903-93 = "ああ～♯うみは　♭たのしい～"
1014903-95 = "（しかし、気持ちよく歌っているココロを邪魔する気にもなれず……。#n私は全力でその場を耐え抜いた)"
1014903-96 = ""
1014903-97 = "ふぅ……。"
1014903-98 = "えっと……いかがでしょうか……？"
1014903-99 = "歌を聴いている間……海に飛び込みたくなったり、しませんでしたか？"
1014903-100 = "[s11] \"ううん、超悪くなかった！\"\n[s12] \"良かったよ！気を失うくらい！\""
1014903-103 = "本当ですか！？よかった……やっとセイレーンの呪いから抜け出せたんですね。"
1014903-104 = "先生が背中を押してくれなかったら……ずっと知らないままでした。"
1014903-105 = "[s] \"じゃあ、そろそろほどいてくれる？\""
1014903-106 = "はい！もちろんです！"
1014903-107 = ""
1014903-109 = ""
1014903-110 = "あの……先生？もしよろしければ……もう一曲だけ、歌ってもいいですか？"
1014903-111 = "久しぶりに歌ったら、なんだかもっと歌いたくなって。"
1014903-112 = "あ、その前にこれ、外しますね。"
1014903-113 = "[s] \"やっぱり、縛ったままにしておいて。\""
1014903-114 = "えっ、でも……縛られたままだとお辛いんじゃ？"
1014903-115 = "[s13] \"実は、縛られるのが好きなんだ！\"\n[s14] \"だから私のことは気にしなくて良いよ！\""
1014903-118 = "分かりました……。"
1014903-119 = "では！もう一曲、歌いますね！"
1014903-121 = "（その後……縛られたまま、ココロが楽しく歌う姿を観賞した）"
