1014903-22 = "3;코코로;10;으으, 선생님께 이런 모습을 들켜 버리다니……\n#3;em;[속상함]"
1014903-23 = "[s3] \"왜 그렇게 부끄러워하는 거야?\"\n[s4] \"내가 듣기에는 좋았는 걸.\""
1014903-26 = "3;코코로;08;하, 하지만…… 역시 남 앞에서 노래를 부르는 건 부끄러운 걸요."
1014903-27 = "3;코코로;04;방금 흥얼거린 멜로디도 노래라기 보다는, 즉흥적인 허밍에 가깝고……\n#3;em;[땀]"
