1014903-34 = "3;코코로;02;선생님께서는 세이렌의 전설에 대해 알고 계신가요?"
1014903-37 = "#na;코코로;세이렌은 오래된 전설에 등장하는 바닷새 모습의 괴물인데요."
1014903-38 = "#na;코코로;세이렌은 아주 노래를 잘 부르지만, 그 노래를 들은 선원들은 모두 바다로 뛰어들게 된다고 해요."
1014903-39 = "#na;코코로;그런데 이상하게 제가 노래를 부를 때도…… 노랫 소리를 들은 사람들이 바다로 뛰어들곤 해서요."
1014903-40 = "[s] \"세이렌의 노래처럼?\""
1014903-41 = "#na;코코로;네. 바다로 뛰어 든 이유를 물어보았지만 모두 눈을 피하며 이유를 얼버무려서요."
1014903-43 = "3;코코로;08\n#3;a"
1014903-44 = "3;코코로;10;그래서 생각해 보았지만…… 혹시 제 조상 중에 진짜 세이렌이 있는 게 아닐까요?\n#3;em;[훌쩍]"
1014903-45 = "3;코코로;02;물론 세이렌의 목격담은 기록 상으로는 존재하지 않는 허구의 전설이라 하지만."
1014903-46 = "3;코코로;08;그래도 주변 사람들이 계속 물에 뛰어드는 건 곤란하기 때문에, 다른 사람 앞에서 노래를 불러 본지도 꽤 되었네요."
1014903-47 = "[s5] \"그런 좋은 목소리로 노래를 부르지 않는다니 아깝네.\"\n[s6] \"어떤 노랫소리이기에 바다에 뛰어드는지도 궁금하고.\""
