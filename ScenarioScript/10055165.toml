[translation]
10055165-2 = "얌마! 파딱파딱 안 일어나?!"
10055165-3 = "대 공안국의 가재가 이 정도로 자빠지면 쓰겠냐!!!!"
10055165-4 = "무리한 강요는 그만둬라. 다들 너처럼 체력이 남아도는 게 아니다."
10055165-5 = "……아무래도 저희 가재는 이제 한계인 거 같군요."
10055165-6 = "오오, 그 말은!"
10055165-7 = "네, 축하합니다. 여러분의 승리입니다."
10055165-8 = "와! 해냈어요, 블랙 돌리!"
10055165-10 = "키시싯! 공안국의 별도, 우리가 받아 가지."
10055165-11 = "여기 있습니다."
10055165-12 = "……다만, 주제넘게 한 마디 충고의 말을 드리려 합니다."
10055165-13 = "패배자 주제에 정말로 주제가 넘는구나!"
10055165-15 = "그냥 들어요, 좀."
10055165-16 = "여러분은 연승을 통해, 전보다 더욱 주목받는 상황이 되었습니다."
10055165-17 = "이 앞에 만날 적들은 아마도 저희보다 더 무시무시한 자들이겠죠."
10055165-18 = "무슨 말을 하나 들어봤다만, 정말 그릇이 작은 녀석들이로고!"
10055165-19 = "오히려 잘된 일이다!"
10055165-20 = "이 대회를 통해 우리 게헨나가, 만마전이 얼마나 우수한지, 제대로 서열 정리를 해주마!"
