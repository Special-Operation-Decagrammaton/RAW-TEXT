[translation]
10055165-2 = "喂！還不快給我爬起來！？"
10055165-3 = "堂堂公安局的螯蝦，怎麼能這樣就倒下啊！！！！"
10055165-4 = "別強人所難了。不是每個人都像你一樣體力過剩。"
10055165-5 = "……看來我們的螯蝦已經到極限了。"
10055165-6 = "哦哦，也就是說……！"
10055165-7 = "沒錯，恭喜你們。是你們贏了。"
10055165-8 = "哇！我們做到了，黑色多莉！"
10055165-10 = "嘰嘻嘻！公安局的星星，也由我們收下了。"
10055165-11 = "請收下。"
10055165-12 = "……不過，請容我不自量力地給各位一個忠告。"
10055165-13 = "你這個輸家還真好意思開口啊！"
10055165-15 = "你就乖乖聽人家怎麼說嘛。"
10055165-16 = "如今各位連戰連勝，已經變得比之前更受矚目了。"
10055165-17 = "接下來要遇到的敵人，實力恐怕會比我們更加可怕吧。"
10055165-18 = "本大人還以為要說什麼，真是一群器量狹小的傢伙！"
10055165-19 = "這反倒正合我意！"
10055165-20 = "本大人要藉著這場大會，讓世人好好認清我們格黑娜──不對，萬魔殿有多麼優秀！"
