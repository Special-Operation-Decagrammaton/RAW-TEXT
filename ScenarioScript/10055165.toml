[translation]
10055165-2 = "3;코노카;12;얌마! 파딱파딱 안 일어나?!\n#3;em;[스팀]\n#3;a\n#3;hophop"
10055165-3 = "3;코노카;13;대 공안국의 가재가 이 정도로 자빠지면 쓰겠냐!!!!"
10055165-4 = "3;칸나 수영복;99;무리한 강요는 그만둬라. 다들 너처럼 체력이 남아도는 게 아니다.\n#3;em;[한숨]"
10055165-5 = "3;칸나 수영복;02;……아무래도 저희 가재는 이제 한계인 거 같군요."
10055165-6 = "1;치아키 수영복;08;오오, 그 말은!\n#1;ar\n#1;em;[반짝]\n#3;m5"
10055165-7 = "3;칸나 수영복;03;네, 축하합니다. 여러분의 승리입니다."
10055165-8 = "1;치아키 수영복;12;와! 해냈어요, 블랙 돌리!\n#1;hophop"
10055165-10 = "3;마코토 수영복;03;키시싯! 공안국의 별도, 우리가 받아 가지.\n#3;em;[음표]"
10055165-11 = "4;칸나 수영복;01;여기 있습니다.\n#3;m2\n#4;a\n#4;greeting"
10055165-12 = "4;칸나 수영복;02;……다만, 주제넘게 한 마디 충고의 말을 드리려 합니다."
10055165-13 = "3;마코토 수영복;05;패배자 주제에 정말로 주제가 넘는구나!\n#3;em;[!]"
10055165-15 = "3;이로하 수영복;05;그냥 들어요, 좀.\n#3;em;[빠직]"
10055165-16 = "3;칸나 수영복;02;여러분은 연승을 통해, 전보다 더욱 주목받는 상황이 되었습니다.\n#3;em;[반응]"
10055165-17 = "3;칸나 수영복;09;이 앞에 만날 적들은 아마도 저희보다 더 무시무시한 자들이겠죠."
10055165-18 = "3;마코토 수영복;16;무슨 말을 하나 들어봤다만, 정말 그릇이 작은 녀석들이로고!\n#3;closeup\n#3;em;[한숨]"
10055165-19 = "3;마코토 수영복;05;오히려 잘된 일이다!\n#3;closeup"
10055165-20 = "3;마코토 수영복;15;이 대회를 통해 우리 게헨나가, 만마전이 얼마나 우수한지, 제대로 서열 정리를 해주마!\n#3;em;[!]\n#3;closeup"
