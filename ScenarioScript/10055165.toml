[translation]
10055165-2 = "Hey! Get up already, will you?!"
10055165-3 = "No crayfish of mine is going to lose that easily!"
10055165-4 = "Stop pushing everybody so hard. Not everyone has infinite stamina the way you do."
10055165-5 = "...All right, I guess you need a break, crayfish. Take five."
10055165-6 = "Oh, d-did we just..."
10055165-7 = "Yes, you won. Congrats. Victory is yours."
10055165-8 = "Woo! We did it, Black Dolly!"
10055165-10 = "Kihehe! That'll be one star, officers."
10055165-11 = "Here you go."
10055165-12 = "...But let me give you one piece of advice."
10055165-13 = "You're the one who lost!"
10055165-15 = "Just listen to her, will you?"
10055165-16 = "The more you win, the bigger the bull's eye you're going to put on yourself."
10055165-17 = "Whoever comes at you next is going to come locked and loaded."
10055165-18 = "Hmph. Did you mean that as a warning?"
10055165-19 = "All it means for us is more glory!"
10055165-20 = "Let them summon their strongest and come from all sides! We'll bring them all to heel and prove our superiority, now and forever!"
