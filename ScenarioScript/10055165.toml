[translation]
10055165-2 = "おい、さっさと起きねぇか！"
10055165-3 = "天下の公安局のカニが、こんなとこでへばってんじゃねえ！"
10055165-4 = "無茶を言うな。皆がお前みたいにタフなわけじゃない。"
10055165-5 = "……どうやら我々のカニは限界のようだ。"
10055165-6 = "おお！それはつまり！"
10055165-7 = "ああ。おめでとう、そちらの勝利だ。"
10055165-8 = "わあ！やりましたよ、ブラックドリー！"
10055165-10 = "キシシッ！公安局の星も我々がいただくとしよう。"
10055165-11 = "では、こちらを。"
10055165-12 = "……最後に、一つだけ忠告を。"
10055165-13 = "ふん、敗者の口から聞くことなどない！"
10055165-15 = "はぁ……素直に聞きましょうよ。"
10055165-16 = "あなた方はこの連勝によって、より注目を集める立場となった。"
10055165-17 = "この先出会う敵は、私たちよりも遥かに手強いものになるだろう。"
10055165-18 = "何かと思えばそんなことか。……まったく、器の小さい奴だ！"
10055165-19 = "むしろ、都合がいいではないか！"
10055165-20 = "この機会を利用して、我々ゲヘナが……。#nいや、万魔殿がどれだけ優秀なのか……キヴォトス中に知らしめてやるのだ！"
