[translation]
10055165-2 = "นี่! รีบลุกขึ้นมาสิ?!"
10055165-3 = "เป็นกุ้งของสำนักงานความมั่นคงสาธารณะสุดยิ่งใหญ่ทั้งที จะมายอมแพ้เพราะเรื่องแค่นี้ได้ยังไง!!!!"
10055165-4 = "เลิกบังคับฝืนใจน้องกุ้งเถอะน่า ไม่ใช่ทุกคนจะมีแรงเหลือเฟือเหมือนเธอนะ"
10055165-5 = "ดูเหมือนกุ้งของเราจะถึงขีดจำกัดแล้วค่ะ"
10055165-6 = "โอ้ ถ้าอย่างนั้น..."
10055165-7 = "ค่ะ ขอแสดงความยินดีด้วย พวกคุณชนะแล้วค่ะ"
10055165-8 = "เย่! ทำได้แล้วค่ะ แบล็กดอลลี่!"
10055165-10 = "คิกคิกคิก! ดาวของกรมความมั่นคงสาธารณะ เราก็ขอรับไปด้วยละนะ"
10055165-11 = "นี่ค่ะ"
10055165-12 = "แต่ขอเสียมารยาท... ให้คำแนะนำสักเรื่องนะคะ"
10055165-13 = "เป็นแค่คนแพ้แท้ๆ ยังกล้าเสียมารยาทอีกสินะ!"
10055165-15 = "ช่วยฟังก่อนเถอะค่ะ"
10055165-16 = "พวกคุณชนะติดต่อกันหลายครั้ง ก็เลยเป็นที่จับตามองมากกว่าเดิมค่ะ"
10055165-17 = "ศัตรูที่พวกคุณจะพบต่อจากนี้ คงจะน่ากลัวกว่าพวกเราอีกค่ะ"
10055165-18 = "อุตส่าห์ฟังว่าจะพูดอะไร ที่แท้ก็เป็นพวกใจคับแคบเสียจริง!"
10055165-19 = "แบบนี้สิยิ่งดี!"
10055165-20 = "ในการแข่งครั้งนี้ เราจะทำให้เห็นว่าเกเฮนน่าและแพนเดโมเนียม โซไซตี้ของเรายอดเยี่ยมแค่ไหน ให้มันรู้ดำรู้แดงกันไปเลยว่าใครเหนือกว่าใคร!"
