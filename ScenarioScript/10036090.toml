[translation]
10036090-1 = "제9화;아리우스 스쿼드, 집결"
10036090-5 = "치잇……!"
10036090-7 = "저, 저 녀석 알바생 아냐……? 저 전설의 스케반을 혼자서 몰아넣고 있는데?"
10036090-8 = "로켓 발사기를 장전할 수 없게 절묘한 타이밍에 총격……"
10036090-9 = "게다가 이동속도도 빨라! 전설의 스케반이 완전히 못 따라잡고 있잖아!"
10036090-16 = "우아하면서도 재빠른 움직임…… 그 모습에서 연상되는 모습은……"
10036090-17 = "마치 제가 평소에 기르며 무척이나 귀여워했던 날다람쥐 카를레스 군과도 같은 자태!"
10036090-18 = "평소라면 당신의 행동을 경애하며 마음껏 찬사를 해드렸겠지만……!"
10036090-19 = "직접 상대하려니…… 무척이나 거슬리네요!"
10036090-20 = "순순히 물러나면 될 일이다."
10036090-25 = "히, 힘내라! 알바!"
10036090-26 = "불청객을 몰아내고 축제를 되찾자!"
10036090-32 = "……이런 차암."
10036090-33 = "곤란하게 되었네요."
10036090-34 = "저를 교정국에 처넣은 헬멧단 여러분께 복수할 수 있단 말씀을 듣고, 히죽히죽 교수의 계획에 따라 달려왔을 터인데."
10036090-35 = "여기서 이토록 강대한 장애물을 만날 줄이야……"
10036090-36 = "……하지만 그렇지요. 저희 인생에 예상치 못한 굴곡 한두 개쯤이야, 늘 예상치 못한 타이밍에 마주치기도 하는 법!"
10036090-37 = "이런 위기를 우아하고 세련되게 극복하지 못한다면 '전설의 스케반'의 이름이 울겠지요!"
10036090-38 = "그러므로 여기서부터는 좀 더 기합을 넣고 가보도록 할까요!"
10036090-39 = "흐읍!"
10036090-40 = "……? 용태가, 변했다……?"
10036090-41 = "[s] \"눈 감고…… 명상?\""
10036090-48 = "쿠리하마 아케미식! 정신을 가다듬기 위한 기합 넣기! 그 첫 번째 호흡!"
10036090-49 = "…………하아아압!"
10036090-53 = "……!!"
10036090-54 = "[ns] \"사오리?! 괜찮아?!\""
10036090-55 = "……큿! 방금 공격은……?"
10036090-56 = "무장이 바뀐 것도, 특별히 무언가 다른 수단을 활용한 것도 아닐 터인데."
10036090-57 = "단순히 정신을 집중하고 호흡을 가다듬는 것만으로 공격의 정확도가 더욱 예리하게………"
10036090-58 = "된답니다!"
10036090-59 = "우아하고 세련되게! 쿠리하마 아케미식 호흡법엔 우리 불량배의 정수가 담겨 있기에!"
10036090-60 = "[s] \"………이해가 따라가질 못하겠는데!\""
10036090-65 = "후우…… 물론 이런 무리한 호흡법은, 몸에 부담을 주지만."
10036090-66 = "그만큼…… 당신을 인정하고 있단 거예요. 날다람쥐 양."
10036090-67 = "……그거참 고맙군."
10036090-68 = "후후……"
10036090-69 = "누님! 우리도 가세하겠습니다!"
10036090-70 = "헬멧단을 향한 복수라면! 누님 혼자 싸우게 내버려둘 수 없습니다!"
10036090-71 = "여러분……. 하지만 이는 소녀의 개인적인 복수일 뿐인데…… 왜 여러분까지……."
10036090-72 = "아닙니다! 누님의 복수라면! 곧 우리들의 복수!"
10036090-73 = "이 세상 끝까지 따르겠습니다! 누님!"
10036090-75 = "……기백이 대단하군."
10036090-76 = "숫자는 많지 않지만. 손에 잡힐 듯 느껴지는 이 열기는……"
10036090-77 = "서로를 향한 신뢰, 인가."
10036090-79 = "에잇! 가자!"
10036090-86 = "[ns] \"사오리……!\""
10036090-87 = "읏………!"
10036090-92 = "……?"
10036090-97 = "안녕, 삿 쨩. 고단해 보이네."
10036090-98 = "……아츠코!"
10036090-100 = "돕는 녀석도 한패라고!"
10036090-105 = "으윽……."
10036090-111 = "헤, 헤헤. 일단 쏘긴 했는데요…… 완전 어그로 끌린 것 같은데요……."
10036090-116 = "……손이 많이 가잖아."
10036090-118 = "미사키, 히요리……."
10036090-119 = "이야기 나눌 시간은 없을 것 같은데."
10036090-126 = "……."
10036090-127 = "단체전인가."
10036090-128 = "그래, 이야기는 조금 후에 나누도록 하지."
10036090-132 = "선생, 지휘를 부탁한다."
10036090-133 = "[s3] \"좋아, 내게 맡겨!\"\n[s4] \"아리우스 스쿼드, 가라!\""
10036090-137 = "우, 우리도 질 수 없지!"
10036090-138 = "멀쩡한 녀석들은 모두 싸운다!"
