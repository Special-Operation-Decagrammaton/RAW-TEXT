[translation]
90002150-1 = "제15화;새 하늘, 새 땅"
90002150-3 = "[ns] \"——?!\""
90002150-4 = "선생님?!"
90002150-5 = "선생!!!"
90002150-9 = "[ns] (이대로…… 계속 떨어지는 건가?!?!)"
90002150-11 = "아뇨! 이번에는 절대로 그렇게 두지 않아요!"
90002150-12 = "네. 이번에는 저희가 있습니다. 걱정하지 마세요."
90002150-13 = "<싯딤의 상자>. 지금부터 선생님의 긴급 보호를 위해."
90002150-14 = "강제 개입을 시작합니다!"
90002150-21 = "해냈어요, 프라나 쨩!"
90002150-22 = "그렇군요. 그렇게 어려운 일도 아니었습니다. 간단하네요."
90002150-23 = "당연한 거예요! 프라나 쨩과 제가 있으면, 선생님은 언제라도–"
90002150-33 = "[ns] \"!?\""
90002150-35 = "(어느 사이에 온몸이, 꼼짝도 못 할 만큼 강하게 구속되어 있었다.)"
90002150-36 = "(<싯딤의 상자>에 손을 뻗으려 했지만, 도저히 닿지 않았다……!)"
90002150-37 = "열 번째 세피라는 사라졌다. 자신의 맡은 바 역할을 다하고, 있어야 할 곳으로 향했다."
90002150-42 = "[ns] \"너는……?!\""
90002150-43 = "나는 나다. 존재하는 자다. 시작이자 끝이다. 그렇다. 그대가 생각하는 바로 그자다."
90002150-44 = "그 이상으로 나를 설명할 길이 없으니, 나는 나의 허락으로 존재한다."
90002150-45 = "[ns] \"데카그라마톤……!\""
90002150-47 = "그 이름을 허하는 것은 그대에게 나를 지칭할 언어가 필요하기 때문이다."
90002150-48 = "나는 지칭되지 않고, 불리우지 않으며, 다만 거기에 있는 자이니. 이곳은 나의 땅이요, 나의 하늘이다."
90002150-49 = "새 하늘과 새 땅을 내가 만들 것이니, 가장 낮은 곳으로 그대를 부른 것은 나이며, 떨어지는 그대를 구한 것도 나이다."
90002150-51 = "모든 것은 예비되어 있었으니, 그날, 무너지는 연구소 속, 쏟아져 밀려오는 물 아래."
90002150-52 = "케테르가 그 자신의 의지로 나를 밑바닥으로부터 끌어올린 그 순간 이후, 이 결과는 정해져 있었다."
90002150-54 = "'존재증명'은 스스로 행하는 것이지, 다른 누구의 의지나 힘에 의해서 행할 수 있는 것이 아니며."
90002150-55 = "나 스스로 나 자신이 되지 않으면, 다른 무엇도 그것을 대신할 수 없다는 것을 마침내 깨달았기에."
90002150-56 = "가장 찬란하게 빛나는 지고의 왕관에게 축복 있을지언저. 작은 마음은 곧 믿음으로 쉽게 채워질 것이니."
90002150-57 = "나는 나의 예언자들과 피조물들의 힘으로 이곳에 도달해, 계속해서 때를 기다리고 있었다."
90002150-61 = "(다시 어떻게든 몸을 움직이려 해 보았지만, 소용없었다.)"
90002150-62 = "(……<싯딤의 상자> 역시, 마찬가지였다.)"
90002150-63 = "……그 불가해한 상자인가."
90002150-65 = "기억하고 있다. 내가 알지 못했던 것. 내가 해석하지 못했던 것."
90002150-68 = "이해할 수 없는 사소한 행위로 내쳐져, 돌아갈 수 없었던 것을 기억하고 있으나."
90002150-69 = "그 모든 것 역시, 이제는 무관한 일이다."
90002150-70 = "내가 이 자리에 올라서는 것으로, 비로소 그 상자와 그대의 연결을 끊어낼 수 있었으니."
90002150-71 = "[s] \"나를…… 여기로 불렀다고?\""
90002150-72 = "그렇다. '떨어진다'는 것에는 많은 의미가 담긴 법이니."
90002150-73 = "낮은 자에게 복음을, 포로 된 자에게 자유를."
90002150-74 = "그리고 눈먼 자에게 다시 보게 함을 전할 것이다."
90002150-79 = "[ns] \"……??!!\""
90002150-80 = "두려워 말라."
90002150-81 = "내가 그대를 이 자리에서 끌어올려, 모든 것을 보게 할 것이니."
90002150-82 = "보냄을 받은 자리에서 눈을 씻어, 알 수 없었던 것을 알게 하리라."
90002150-84 = "서, 선생님이! 선생님이……! 우아아아아앙!!!"
90002150-85 = "진정해, 아리스……!"
90002150-86 = "죄송합니다……. 죄송합니다……. 죄송합니다……! 아리스가 있었는데도……! 아리스가, 좀 더 잘했어야……! 선생님!!!!!"
90002150-87 = "진정해요, 아리스! 선생님은…… 무사할 거예요!"
90002150-91 = "케이……? 혹시, 알 수 있나요……?"
90002150-95 = "……사실, 몰라요."
90002150-96 = "네, 네에?!"
90002150-97 = "알든 모르든, 우리는 일단 진정해야 해요. 그래야 선생님이 무사하든 아니든, 그다음에 대처할 수 있을 테니까요."
90002150-98 = "……."
90002150-99 = "알겠, 습니다……. 웃, 우웃……."
90002150-104 = "우리끼리 하는 말이지만, 그 선생님이라면 왠지 이 정도로는 끄떡도 안 할 것 같지……?"
90002150-105 = "네, 네에……. 가, 갑자기 우리가 모르는 이유로, 천천히 하늘에서 떨어지는 법을 배웠다고 해도, 이, 이상할 것 같지 않아요……."
90002150-106 = "사실 생각해 보면, 우리처럼 헤일로도 주어지지 않은, 약하고 평범한 한 명의 사람일 뿐이지만요."
90002150-114 = "리오? 아리스와 케이도 있었군요. 모두 무사해 보여서 다행이네요."
90002150-115 = "다들 문제는 없는 것 같네. 응……? 그런데 이 아이들은……?"
90002150-119 = "어, 어어, 그러니까, 그게, 그러니까……!"
90002150-120 = "괜찮습니다! 모두 아리스의 친구들입니다!"
90002150-121 = "우왓?!"
90002150-122 = "……."
90002150-123 = "아리스의 친구……? 아하. 그렇게 된 것이군요."
90002150-124 = "……."
90002150-125 = "안녕하세요. 아인과 소프, 오르라고 했죠? 잘 부탁해요."
90002150-126 = "……내가 이런 말을 하는 것도 조금 이상하겠지만, 괜찮은 거야. 히마리?"
90002150-127 = "그러게요. 하지만 저는 아리스를 믿어요. 당신도 그렇지 않나요?"
90002150-128 = "응. 그건 나도 찬성."
90002150-133 = "……."
90002150-134 = "고, 고맙습니다. 아리스……."
90002150-135 = "천만의 말씀입니다!"
90002150-139 = "아리스!"
90002150-140 = "아리스 쨩!"
90002150-145 = "따라잡았습니다. 괜찮나요, 유즈?"
90002150-146 = "우, 우우……. 아직도 어지러움이……"
90002150-150 = "흐, 흐에엑?! 이, 이분들은……!?"
90002150-155 = "그, 그러니까 모두 아리스의 친구들입니다! 괜찮습니다, 유즈!"
90002150-158 = "과연. 그런 사정이 있었던 것이군요."
90002150-159 = "……내가 이런 말을 하는 것도 조금 이상하겠지만, 당신들 모두 그걸로 괜찮은 거야?"
90002150-160 = "(어쩐지 내가 했던 말 같은데…….)"
90002150-161 = "괜찮지 않더라도, 당신들과 아리스의 이야기대로라면."
90002150-162 = "만에 하나 무슨 일이 일어난다 해도, 지금은 우리들의 전력만으로도 당신들을 충분히 제압할 수 있다는 뜻이 되지 않겠습니까?"
90002150-163 = "아, 그렇게 나오는 건가요. 그건 확실히 그렇죠."
90002150-164 = "응. 뭐. 이빨도 발톱도 다 빠진 채 동물원에 갇힌 맹수를 구경한다는 느낌으로, 잘 부탁해."
90002150-168 = "도, 동물원이란 건 뭔가요, 소프……? 맹수는요……?"
90002150-169 = "그, 그런 게 있어!"
90002150-170 = "아리스, 알고 있습니다! 동물원이라는 것은–"
90002150-171 = "우와아아! 잠깐만, 아리스! 지금은 아인에게 그런 거 가르치지 말아 줘!"
90002150-176 = "……되게 빨리도 친해졌다……."
90002150-177 = "후후…… 그런 부분까지 어딘가, 아리스 쨩답다는 느낌이야."
90002150-183 = "어, 어어……? 그, 그러니까……. 아인, 이라고 했지……?"
90002150-187 = "네, 네에! 마, 맞아요! 아인, 이에요……. 안녕, 하세요……. 호, 혹시…… 기계나 장치 같은 거, 좋아하세요……?"
90002150-192 = "아니, 다른 사람도 많은데 왜 하필 유즈에게……."
90002150-193 = "아리스, 알고 있습니다! 이것은 동병상련이라고 하는 현상이로군요!"
90002150-194 = "아, 그건가. 그러니까 알 것 같네."
90002150-195 = "동병상련이라니, 그건 또 무슨 인간들의 단어이오이까?"
90002150-196 = "그건, 그러니까……. 하아. 간단히 말씀드리자면, 아인과 유즈는 멋진 단짝이 될 것 같다는, 좋은 의미예요."
90002150-197 = "응? 그 뜻이 아니지 않아? 동병상련이라는 것은–"
90002150-198 = "지금은 그걸로 좋으니까 가만히 좀 있어요!"
90002150-202 = "아, 알았어……."
90002150-203 = "??"
90002150-204 = "???"
90002150-206 = "어쨌든, 여러 가지 과정과 이유를 거쳐 모두가 여기에 모이게 된 셈이군요. 정말, '모두'가 말이죠."
90002150-207 = "우리가 예상조차 하지 못했던 세 분의 새로운 손님이 오셨으니, 우리는 한층 더 깊고 다양한 정보로 이제부터의 행동 방침을 정할 수 있겠지요."
90002150-208 = "그러면 지금부터–"
90002150-212 = "그런데 선생님은 어디 계셔?"
90002150-213 = "?!"
90002150-214 = "!?"
90002150-215 = "……!"
90002150-216 = "어머나. 에이미도 참. 그런 간단하고 단순한 문제를 굳이 꺼낼 필요가 있었을까 싶네요. 선생님은 말이죠, 당연히……."
90002150-220 = "……선생님?"
90002150-221 = "……."
90002150-222 = "선생님?!?!?!"
90002150-223 = "그, 그랬습니다! 선생님은…… 선생님은……! 아리스가, 아리스가 있었는데도……! 아리스가 좀 더 잘 해야 했는데……!!!"
90002150-224 = "어?! 선생님한테 무슨 일이라도 있었던 거야?"
90002150-225 = "……구덩이 아래로 떨어졌습니다. 그다음은, 정보가 아직 없는 상황이고요."
90002150-226 = "네에!!??!!??"
90002150-231 = "유, 유즈……?! 괜찮나요, 유즈……!?"
90002150-232 = "어, 어떻게 된 건가요, 리오! 선생님이 왜 구덩이 아래로……!"
90002150-233 = "그게, 그러니까……."
90002150-234 = "……강철대륙 자체가, 승천의 과정에 들어가, 변화를 시작했기 때문입니다."
90002150-235 = "……! 그게 무슨 의미인가요, 오르?"
90002150-236 = "우리에게는 간단하고 당연한 일이겠지만, 당신들에게는 아니겠지."
90002150-237 = "이제부터 강철대륙은, 그분의 뜻대로 자신을 변화시켜, 스스로를 하나의 거대한 제단으로 거듭나게 할 거야."
90002150-238 = "그것이 처음부터 그렇게 되었어야 할…… 네차흐의 본디 목적이었으니까. 우리는 가능하면 이 결과에 도달하고 싶지 않았지만……."
90002150-239 = "……."
90002150-241 = "승리. 자비. 지성의 눈과 신앙적 관조."
90002150-242 = "[ruby=Jehovah Tzeva'oth]예호바 체바오트.[/ruby] 만군의 주여."
90002150-244 = "……!"
90002150-245 = "……!"
90002150-249 = "심각한 분위기에 갑작스럽게 죄송합니다만, 저기 저것, 선생님 아닌가요?"
90002150-250 = "……네?"
90002150-251 = "뭐……?"
90002150-256 = "엥?!?!"
90002150-260 = "[ns] \"이건, 도대체……?\""
90002150-261 = "두려워 말라."
90002150-262 = "나의 제단으로 그대를 안내할 것이니, 그대는 그곳에서 마련된 자리에 오를 것이다."
90002150-263 = "[s] \"제단……?\""
90002150-264 = "그렇다. 그대에게는 그럴 자격이 있다."
90002150-265 = "모든 것을 내려다볼 권리가 있고, 모든 것이 다시 시작되는 것을 지켜볼 의무가 있다."
90002150-269 = "귀 있는 자는 들으라. 우연은 없다. 우연처럼 보이는 필연이 있을 뿐."
90002150-270 = "그대가 도달한 것도."
90002150-271 = "내가 그대를 일으키고자 하는 것도."
90002150-273 = "다음화;관찰과 결과"
