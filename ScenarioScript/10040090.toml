[translation]
10040090-1 = "후일담;도둑잡기"
10040090-2 = "으음……"
10040090-3 = "으으으음……"
10040090-4 = "아—! 완전히 감 잡았습니다. 이번에는 여기죠!"
10040090-6 = "<삐—— 꽝입니다!>"
10040090-7 = "크악!"
10040090-8 = "그으읏…… 어째서 이번에도!"
10040090-12 = "우와, 엄청난 불운이네. 벌써 몇 번째 연속으로 룰렛에서 꽝을 뽑는 거야?"
10040090-13 = "방금 것까지 해서 다섯 번 연속입니다. 단순 계산으로 해도 약 0.00006%의 희박한 확률이군요."
10040090-14 = "이쯤 되면 정말 주사위의 신에게 저주라도 받았다고밖에 말할 수가 없겠네."
10040090-16 = "세상에 그런 신이 어디 있어요? 이건 누가 봐도 명백히 이상하잖아요!"
10040090-17 = "이건 분명 조작이에요! 누군가가 저를 골탕 먹이기 위해 룰렛에 개조를—"
10040090-19 = "하지만 게임을 시작하기 전에 구조를 간단하게 살펴보았지만, 룰렛 내에 사용자를 식별할 수 있는 별도의 인식 장치 같은 건 설치되어 있지 않았는걸요."
10040090-20 = "맞아. 게다가 이 보드게임들은 파티 직전에 빌려온 물건인데. 너 하나 골탕 먹이자고 보드게임을 개조할 틈이 어디 있었겠어?"
10040090-21 = "다만 튀어나온 페로로 인형이 정확하게 벌칙 대상자의 머리를 요격할 수 있도록 상부 공격 지능탄용 적외선 유도 장치는 설치되어 있는 것은 확인했습니다만—"
10040090-22 = "파티 플레이용 게임에 누가 그런 쓸데없이 비싸기만 한 전투 시스템을 설치한 거야?"
10040090-24 = "아, 전에 이 룰렛을 엔지니어부에 빌려주었을 때, '파티의 여흥을 돋구기 위해' 약간의 개조를 했다고 했었는데…… 그때 설치된 기능인가?"
10040090-25 = "또 엔지니어부가 저지른 일이야? 어휴……"
10040090-26 = "앞으로 엔지니어부에서 부비가 모자라다고 우는 소리를 내거든 따끔하게 한 마디 해줘야겠어!"
10040090-28 = "그렇다 해도 이건 불공평해요! 룰렛처럼 운에 의존하는 승부는 저한테 완전 불리하잖아요!!"
10040090-29 = "운에 의존하는 승부가 누군가에게 특별히 불리하다는 건 말이 안 되는데……."
10040090-30 = "불리하다면 불리한 거예요!! 이의 있소!"
10040090-31 = "심판! 종목을 바꿀 것을 요청합니다!"
10040090-32 = "파티 게임에 심판같은 게 있을 리가 없잖아……"
10040090-33 = "하지만 네가 원한다면 얼마든지 종목은 바꿔줄게. 보드게임이라면 잔뜩 있으니까."
10040090-34 = "그럼 지금부터는 어떤 게임을 하는 거야? <THE 인생>? 아니면 <와일드헌트의 늑대>?"
10040090-35 = "후후, 지금부터 제가 제안드리는 게임은 바로…… <도둑잡기>입니다!"
10040090-36 = "도둑잡기? 마지막에 조커 카드를 들고 있으면 지는 카드 게임 말이야?"
10040090-37 = "네. 같은 숫자의 패를 한 쌍씩 돌아가면서 버리다가 마지막에 조커를 들고 있는 사람이 패배하는 심플한 룰이죠."
10040090-38 = "<도둑잡기>라면 여기 있는 모두가 룰을 알고 있을 테니, 다들 불만은 없으시겠죠?"
10040090-40 = "하지만 <도둑잡기>도 운에 의존하는 카드 게임인 건 마찬가지인데……"
10040090-41 = "운수가 나쁘다면 이번에도 또 질 수 있지 않나요?"
10040090-42 = "후후, 뭘 모르시는군요. 코타마 선배. 도둑잡기는 엄연히 전략이 존재하는 실력겜이라고요?"
10040090-43 = "바닥에 버려진 카드의 숫자를 세어가며 남은 패의 확률을 계산할 수도 있고, 패를 뽑을 때 상대의 반응을 통해 조커 카드가 어느 손에 있을지 떠볼 수도 있으니까요."
10040090-44 = "순수하게 운에만 의존하는 룰렛과는 달리, 도둑잡기는 제게도 승산이 있단 말씀."
10040090-46 = "자, 지금부터 이걸로 승부하자고요. 진 사람은 이마에 딱밤을 한 대씩 맞는 걸로!"
10040090-48 = "후후, 재미있어 보이네요. 그럼 이번 판에는 저도 참가해 볼까요?"
10040090-49 = "뭐, 나야 상관없지만…… 어쩐지 금방 끝날 것 같은데."
10040090-51 = "으음…… 나는 이번 판은 패스. 도둑잡기처럼 간단한 게임은 영 취향이 아니라서."
10040090-52 = "으응? 어쩐지 다들 반응이 미적지근하네요. 설마 겁먹은 건 아니겠죠?"
10040090-53 = "그럼 도둑잡기— 시작!"
10040090-55 = "(잠시 후……)"
10040090-57 = "(……왜…….)"
10040090-62 = "(……왜 남은 게 하필 이 사람인 건데!?)"
10040090-63 = "분명 남은 패의 개수를 볼 때 조커 카드는 노아 선배의 손에 있는 게 분명하지만……"
10040090-64 = "……선배."
10040090-65 = "네, 코유키 쨩?"
10040090-66 = "그……. 손에 들고 있는 그 패. 조커 맞죠?"
10040090-67 = "글쎄요, 과연 어떨까요?"
10040090-68 = "맞잖아요? 왼쪽 패가 조커인가요, 오른쪽 패가 조커인가요?"
10040090-69 = "후후, 한 번 코유키 쨩이 맞춰보겠어요?"
10040090-70 = "(……젠장……. 감정의 동요가 조금도 느껴지질 않아.)"
10040090-71 = "(운수도 나쁘지, 자리 배치가 하필 이렇게 되다니……!)"
10040090-72 = "(게임 내적으로 운을 적게 쓰려니 외적으로 재수가 없다고……? 이게 말이 되나!?)"
10040090-73 = "……후우……."
10040090-78 = "(하는 수 없다. 이렇게 된 이상 찍는 수밖에—)"
10040090-82 = "결정했어요. 조커는…… 왼쪽!"
10040090-83 = "땡, 오른쪽이었습니다!"
10040090-84 = "아아아아아아아~~~! 왠지 내가 그렇게 말하는 시점에서 그럴 거 같더라니!!!"
10040090-85 = "그럼 바꾸면 되잖아."
10040090-86 = "바뀌면 그 시점에서 바뀌는 거라고요!! 이해하지 못하는 사람은 가만히 있으세요!!"
10040090-87 = "무슨 말도 안 되는 소릴……."
10040090-89 = "역시 세미나의 포커페이스네. 조금도 속내를 읽을 수가 없어."
10040090-90 = "처음부터 예상하고 있었지만, 노아 선배가 참가한 시점에서 <도둑잡기>는 심리전이 통하지 않는 100% 운에 의존해야 하는 게임이 되었을 테니까."
10040090-91 = "그런데 어째서 코유키 쨩은 노아 선배를 상대로 심리전을 할 수 있다고 생각했던 걸까?"
10040090-93 = "……뭐, 애초에 그런 눈치가 있었다면 반성실에 갈 일도 없었겠지."
10040090-95 = "(……이후 코유키는 다섯 차례를 연달아 패배한 뒤, 자신이 제시한 벌칙을 받고 리타이어하고 말았다.)"
