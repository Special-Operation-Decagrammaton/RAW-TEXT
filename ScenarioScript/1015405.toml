[translation]
1015405-1 = "특별한 예술품"
1015405-2 = "[ns] \"흐아아아아암…….\""
1015405-3 = "(서류들과 싸우다 지쳐…… 기분 전환 겸 강변으로 산책을 나왔다.)"
1015405-6 = "[ns] \"역시 강가는 시원해서 좋네~\""
1015405-7 = "(그렇게 강변을 걷고 있는데…….)"
1015405-12 = "어머, 선생님? 이런 곳에서 뵙다니."
1015405-13 = "산책하고 계셨나요?"
1015405-14 = "[s] \"그렇긴 한데……. 마나미는 어떻게 여기에?\""
1015405-15 = "이 근처에 저의 수집욕을 자극하는 특별한 예술품이 있다고 해서요."
1015405-16 = "마침 날씨도 좋아서, 기분 전환이나 할 겸 학원 밖으로 나왔답니다."
1015405-17 = "그런데 우연히 선생님과 동선이 겹친 것 같네요."
1015405-18 = "네. 정말 우연히요."
1015405-19 = "[s1] (……아무리 생각해도 우연을 가장한 필연인 패턴이다.)\n[s2] \"그, 그 특별한 예술품이 뭔데? \""
1015405-22 = "궁금하시군요?"
1015405-23 = "그렇다면 함께 확인해 보지 않겠나요?"
1015405-24 = "우연히 거리에서 만난 김에, 간단한 교류회를 진행하는 거죠."
1015405-25 = "우리는 아직 서로에 대해 모르는 것이 많잖아요?"
1015405-26 = "[s3] (……같이 가겠다고 말하지 않으면 위험한 패턴이다.)\n[s4] \"좋아! 같이 확인해 보자!\""
1015405-29 = "네. 좋습니다. 그럼 저를 따라오시죠."
1015405-31 = "샬레 근처의 지하상가"
1015405-32 = "바로 이곳이랍니다."
1015405-33 = "저의 수집욕을 자극하는 특별한 예술품이 있는 장소가."
1015405-34 = "[s5] \"여기에……?\"\n[s6] (여기는 흔한 지하상가다.)\n[s7] (예술품을 취급하는 가게는 없는 것 같은데…….)"
1015405-38 = "그냥 평범한 지하상가 같은데…… 라고 생각하시는군요?"
1015405-39 = "뭐, 솔직히 무리도 아닙니다."
1015405-40 = "저의 심미안은 선생님의 기준과 차이가 있을 테니까요."
1015405-41 = "그런 선생님께 제가 직접 특별한 예술품을 소개하도록 하죠."
1015405-42 = "자, 바로 저쪽이에요."
1015405-44 = "(마나미가 근처의 팬시용품점으로 날 안내했다.)"
1015405-45 = "(그리고…….)"
1015405-48 = "자. 이 아이들 중에 있답니다."
1015405-49 = "저의 심미안이 판단한 특별한 예술품이."
1015405-50 = "음? 지금 뭔가 이해가 잘 안 된다는 표정을 짓지 않으셨나요?"
1015405-51 = "설마…… 아니죠?"
1015405-52 = "[s] (잘못 대답하면 마이너스 점수를 받는 패턴이다……!)"
1015405-53 = "아아, 너무 긴장하지 않으셔도 됩니다."
1015405-54 = "일반인이라면 당연한 반응이라 생각하니까."
1015405-55 = "일반인이 아닌 제 시각엔 조금 다르게 보이긴 하지만요."
1015405-56 = "[s] (자기가 일반적이지 않다는 자각은 있구나…….)"
1015405-59 = "저는 수집이 감각의 예술이라 생각해요."
1015405-60 = "수집품엔 시간을 초월한 다양한 심상이 깃드는 법이니까요."
1015405-61 = "그 과정에서 누군가에겐 그저 평범한 물건이, 누군가에겐 진귀한 예술품이 되기도 한답니다."
1015405-62 = "그러면 제가 예술품이라 소개했던 굿즈를 볼까요?"
1015405-66 = "저는 이 중에서 <빅브라더>를 좋아해요."
1015405-67 = "바라보는 것만으로도 모든 진실을 알아낸다는 작은 부엉이 캐릭터죠."
1015405-68 = "이것은 그저 캐릭터의 설정……. 누군가에겐 유치하다고 느껴질 수도 있어요."
1015405-69 = "하지만 누군가에겐 큰 힘이 되기도 한답니다."
1015405-70 = "마치…… 방황하던 시절의 제가 그랬던 것처럼요."
1015405-71 = "[s] \"방황하던 시절이라면…….\""
1015405-76 = "빅브라더의 귀엽고 큰 눈을 보고 있으면, 마치 이렇게 응원하는 것 같았죠."
1015405-77 = "나는 모든 진실을 알아내는 힘을 가졌어. 그러니 너의 슬픔도 제대로 보고 있단다."
1015405-78 = "너를 알아주는 존재가 곁에 있으니, 힘을 내고 자리에서 일어나렴."
1015405-79 = "언제나…… 그렇게 저를 응원해 주는 것 같았죠."
1015405-80 = "그래서 항상 마음속에 빅브라더 인형을 품게 되었답니다."
1015405-81 = "이것은 그 누구에게도 공개하지 않았던 저만의 비밀."
1015405-82 = "어떤가요? #n제가 생각하는 '예술'에 대해 이해하셨을까요?"
1015405-83 = "[s8] \"확실히…… 뭔가가 느껴지네.\"\n[s9] \"말로는 잘 설명할 수 없는 다양한 감정이…….\""
1015405-86 = "네. 그렇답니다."
1015405-87 = "이것이 제가 생각하는 감각의 예술."
1015405-88 = "오늘도 수집품에 또 하나의 추억이 피어났어요. #n저는 분명, 빅브라더를 볼 때마다 떠올리겠죠."
1015405-89 = "서로의 비밀을 조심스럽게 이야기하게 된, 오늘 이 시간을 말이에요."
1015405-90 = "[s] \"응. 그러네…….\""
1015405-93 = "[ns] \"응? 잠깐. 서로의? 난 내 비밀을 말한 적 없는데?\""
1015405-94 = "아. 직. 은. 그렇죠."
1015405-95 = "그러니 지금부터 차근차근 들을 생각이랍니다."
1015405-96 = "자, 알려주세요."
1015405-97 = "남들에겐 말하지 않았던, 선생님만의 소중한 비밀을."
1015405-98 = "[s] \"……?!\""
1015405-99 = "설마 싫다는 건 아니시죠?"
1015405-100 = "소녀의 비밀을 아무렇지도 않게 들어놓고, 이대로 모르는 척하진 않으실 거죠?"
1015405-101 = "그. 렇. 죠?"
1015405-102 = "[s] \"마, 마나미?!\""
1015405-104 = "(……이후 마나미와 빅브라더 굿즈를 교환하며 다양한 대화를 나누었다.)"
1015405-105 = "(마나미가 전하려는 게 어떤 것인지 똑똑히 전해져 오는 시간이었다.)"
