[translation]
10041070-1 = "제7화;에필로그"
10041070-9 = "……전부 발키리에 넘겼습니다. 방금이 마지막입니다."
10041070-11 = "그나저나 굉장한 수였네. 하마터면 정말로 밀레니엄 엑스포가 중단될 뻔했어."
10041070-12 = "엄청 신났었지! 트리니티 학생들도 전부 신나서 '이게 밀레니엄!' 하며 소리치고 말이야."
10041070-13 = "뭔가 대외적인 밀레니엄의 이미지가 조금 이상해진 것 같긴 하지만……."
10041070-15 = "내막의 스케일을 생각하면, 그런 정도로 얼버무려 넘긴 것만 해도 훌륭한 작전 성공이라고 봐야 겠지요. 후후."
10041070-16 = "……세미나의 회계는? 뭐라고 안 하던?"
10041070-17 = "물론 화가 많이 나셨죠. 그렇지만 결과적으로 잘 된 거기도 하고, 애초부터 선생님과 C&C의 합동 작전이었으니까……."
10041070-18 = "이왕이면 다음부터는 자신에게도 알려줬으면 좋겠다-라고, 나중에 선생님한테 따끔하게 한 소리 한다고 하던데. 그 정도로 끝날 거 같아."
10041070-19 = "[s1] \"결국 혼나는 건 나구나…….\"\n[s2] \"후후, 욕먹는 건 익숙하니까…….\""
10041070-22 = "아니, 사실 화난 건 우리도 조금 마찬가지거든."
10041070-23 = "세미나는 몰라도 우리에게는 조금 말해줄 수 있지 않았어? 심지어 트리니티의 VIP와 연계하는 작전이었다니."
10041070-24 = "우린 그것도 모르고……."
10041070-29 = "죄송해요. 그 부분은 순전히 제 고집이었으니까요. 네루 씨나 선생님께서 어떻게 하실 수 있는 게 아니었어요."
10041070-30 = "두 분 모두 제 어리광을 받아주신 것이라고 봐야겠지요. 부디……."
10041070-31 = "……너그럽게 용서를 부탁드립니다."
10041070-35 = "어, 으? 에?"
10041070-36 = "아, 아니. 아니. 나는 그런 의미로 말한 게……!"
10041070-37 = "후후, 굉장하네요. 카린. 다른 사람도 아닌 트리니티 티파티의 일원에게 고개 숙임을 받다니."
10041070-38 = "자, 자. 미안하다니까. 나도 특별히 부탁을 받은 게 있어서 어쩔 수가 없었다고."
10041070-39 = "그 부분만큼은 다른 방향으로…… 원하는 만큼 갚아줄 테니, 너무 화내지 마라."
10041070-44 = "아니!! 그러니까 나는 절대 그런 걸 바란 게……!!"
10041070-55 = "……선생님."
10041070-56 = "[s3] \"괜찮아? 다친 데는 없지?\"\n[s4] \"어땠어? 괜찮았어?\""
10041070-59 = "……네. 정말로 처음부터 다 알고 계셨군요."
10041070-60 = "저는 나름대로 저 스스로 무언가를 증명하겠다며 나온 것이었는데……."
10041070-61 = "아니죠. 이런 말을 해선 안 되겠죠. 선생님이 안 계셨다면, 상황은 아주 나쁜 결말을 맞았을 테니까요."
10041070-65 = "감사합니다. 그리고……."
10041070-66 = "……죄송합니다, 멋대로 굴어서."
10041070-67 = "[s5] \"아직은 그런 말 하지 마.\"\n[s6] \"그런 말은 돌아갈 때까지 참아줘.\""
10041070-72 = "네? ……그게 무슨……."
10041070-73 = "아니죠. 잘은 모르겠지만, 선생님께서 그렇게 말씀하신다면 응당 그럴 만한 이유가 있는 것이겠죠."
10041070-74 = "그나저나 선생님께서는 괜찮으신가요? 함께한……. '그분'에 대해서는. 직접 찾아뵙지 않으셔도 되는 걸까요?"
10041070-75 = "아직 늦지 않았답니다. 아직은 은신처에서…… 짐을 정리하고 있을 거예요."
10041070-76 = "……네? 괜찮으시다고요?"
10041070-77 = "의외로군요. 만나 뵙고 싶어 하실 줄 알았는데."
10041070-78 = "[s7] \"아직은 괜찮아.\"\n[s8] \"말에는 타이밍이라는 게 있거든.\""
10041070-81 = "……그렇습니까."
10041070-82 = "[s9] \"그보다는 세이아 스스로에 대해 생각하자.\"\n[s10] \"우선 왜 여길 왔는지, 조금 더 생각해 줘.\""
10041070-85 = "……네?"
10041070-86 = "아, 음……."
10041070-90 = "……알겠어요."
10041070-93 = "(한 시간 후.)"
10041070-100 = "저희 왔습니다, 리오."
10041070-101 = "대충 정리 끝났어. 이제 슬슬 우리도……."
10041070-111 = "……바로 돌아가실 생각인 모양이네요."
10041070-112 = "뭐…… 그렇겠지. 애초에 그럴 생각으로 왔던 거니까."
10041070-113 = "……리오……"
10041070-114 = "……?"
10041070-115 = "……하이고, 왜 그런 표정이야? 설마 그사이에 정이라도 들었어? 가니까 눈물 나냐?"
10041070-119 = "아뇨. 그런 게 아니라……."
10041070-123 = "……네. 솔직히 말씀드릴게요. 물론 아쉬운 것도 있긴 하지만……."
10041070-124 = "그보다는 조금 답답한 부분이 있달까, 그런 느낌이 더 크네요."
10041070-125 = "답답한 부분?"
10041070-126 = "네. 저는……."
10041070-127 = "리오 씨가 스스로 계속 말해왔던 것과 달리, 사실은 따로 증명 같은 걸 할 필요가 없다고 생각해요."
10041070-128 = "본인은 느끼지 못하지만, 이미 주변 사람들은 그녀를……."
10041070-132 = "……?"
10041070-136 = "……??? 뭐야, 왜 또 말을 하다 끊어."
10041070-137 = "이미…… 다들 그녀를 받아들이고 있……어요. 받아들이지 못하는 건……."
10041070-138 = "오히려 그녀 자신뿐……이죠."
10041070-142 = "……그렇군요."
10041070-143 = "그런 거였군요, 선생님. 그래서 아까 전에도 그런 말씀을 하셨던 거군요."
10041070-144 = "뭔데 또 혼자 자문자답이야. 너도 리오 닮아 가냐? 나 그런 거 싫어하니까 적당히 해."
10041070-145 = "후후, 죄송해요. 제 나쁜 습관이죠."
10041070-146 = "그보다……."
10041070-150 = "……네루 씨. 혹시 괜찮으시다면, 한 가지만 더 협조를 부탁드려도 괜찮을까요?"
10041070-151 = "……협조? 무슨 협조?"
10041070-152 = "그건……."
10041070-160 = "리오 씨. 드릴 말씀이 있어요."
10041070-165 = "……? 무슨 이야기야?"
10041070-170 = "리오 씨가 괜찮다면, 앞으로 일주일 정도는 더 이 밀레니엄 사이언스 스쿨에 남아 계셨으면 해요."
10041070-171 = "저와 네루 씨도 남아 있을 테니, 계속 이곳에서 상황을 봤으면 해요."
10041070-172 = "리오 씨가 지킨 이번 엑스포가 마지막까지 잘 끝나는 걸 스스로 지켜봤으면 해요."
10041070-178 = "무슨 말을 하나 했더니……."
10041070-179 = "그럴 수 없어. 이미 한 이야기야. 나는 이곳에서 엑스포를 함께 즐기고 있을 자격이 없으니까."
10041070-180 = "……역시 그렇게 말씀하시는군요. 하지만 이건 자격에 관한 이야기가 아니에요."
10041070-181 = "그게 무슨 뜻이지? 자격에 관한 이야기가 아니라니?"
10041070-182 = "리오 씨는 이번 일을 무사히 마무리 지었다고 생각하지만, 사실 아직은 엑스포 첫날에 지나지 않으니까요."
10041070-183 = "행사에 일어나는 '문제'는, 꼭 이번 일만 있다는 보장이 없잖아요? 이후로도 분명 크고 작은 사건사고가 생길 거예요."
10041070-184 = "대부분은 세미나 분들의 주관으로 해결될 수 있을 거라고 생각하지만…… 꼭 모두 다 그럴 거라는 보장은 없지요."
10041070-185 = "누군가는 그걸 끝까지 모니터링하고, 들키지 않게 해결해 주어야 하지 않을까요?"
10041070-186 = "만일 리오 씨가 그걸 해주지 않는다면……. 그 많은 일들은, 모두 세미나 분들과 선생님께서 감당하게 되실 테지요."
10041070-192 = "리오 씨는 그걸 원하시는 건가요?"
10041070-193 = "그건……."
10041070-198 = "……어떻게 생각해, 네루."
10041070-203 = "지금 나한테 의견을 묻는 거야? 오늘 참 별꼴을 다 보네. 물론 좋은 쪽으로."
10041070-204 = "뭐, 괜찮지 않겠어? 대놓고 밖을 돌아다니지만 않는다면야, 들킬 일도 없잖아."
10041070-205 = "최소한 이것도 '학생회장으로서의 업무'라고는 생각하는데 말이지."
10041070-207 = "……음……."
10041070-208 = "뭔가 묘하게…… 함정에 빠지는 느낌이 드는데……."
10041070-209 = "그럴 리가요."
10041070-210 = "싫으면 말고."
10041070-215 = "아, 아니. 싫다고는 안 했어. 싫을 리가 없잖아."
10041070-216 = "음……. 그렇……겠지. 과연……."
10041070-221 = "……알았어. 그렇게 할게."
10041070-225 = "딱 일주일이야. 이번 행사가 끝나면, 바로 돌아갈 테니까."
10041070-226 = "네, 그거면 충분해요. 그때까지는 저희도 끝까지 도울 테니까요."
10041070-227 = "그럼 나는 다시 짐을 풀고 오겠어. 잠시만 기다려줘."
10041070-231 = "……통했네요."
10041070-233 = "하핫! 꽤 잘 다루잖아. 역시 그새 꽤 친해진 거지?"
10041070-234 = "그렇다고도 볼 수 있고……. 아니라고도 할 수 있겠네요."
10041070-235 = "저런 타입은 이렇게라도 변명거릴 남겨 두지 않으면, 스스로 납득하지 않을 테니까요. 잘 알고 있는 타입이거든요."
10041070-236 = "……잘 알고 있죠. 누구보다 많이, 거울 너머로 본 타입이니까요."
10041070-237 = "정말이지 귀찮은 타입이라니까."
10041070-238 = "……후후."
10041070-239 = "정말이에요."
10041070-243 = "……귀찮은 타입이네요."
10041070-244 = "Code: BOX 밀레니엄에 다가오는 그림자"
