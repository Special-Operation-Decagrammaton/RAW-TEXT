[translation]
10010110-1 = "제11화;뿌린 대로 거두리라 1"
10010110-2 = "……으으……."
10010110-3 = "죄송해요, 선생님. 우이 씨……."
10010110-4 = "힘들게 도와주셨는데, 결국 이렇게 되었네요……."
10010110-5 = "[s1] \"갑자기 시간이 당겨지다니…….\"\n[s2] \"어째서 이렇게 갑작스럽게…….\""
10010110-6 = "뭐, 뭐죠. 대체……."
10010110-7 = "뭐, 뭐죠. 대체……."
10010110-8 = "이제 와서 일정 변경이라니, 장난하는 것도 아니고……."
10010110-9 = "아직 복원 작업이 다 끝나지도 않았는데……."
10010110-10 = "아마도 이 연락이 늦었던 건, 제가 참석 인원이 아니라서……. 참고만 하라고 온 거라……."
10010110-11 = "지금 시간이면……. 이미 참석자 분들은 모두 도착해 계실 거예요……."
10010110-20 = "행사 한 시간 전이면 사실상 준비가 다 끝나 있는 상태라서요."
10010110-31 = "회장은 폐쇄되고, 주변 경비는 더욱 강화될 거예요."
10010110-32 = "복원을 마쳤다 해도……. 옮기는 시간도 있을 테고……."
10010110-43 = "아마 직접 상자를 열고, 공개를 진행하시는 건……. 음……. 역시 사쿠라코 님이시겠죠……"
10010110-47 = "게다가 행사를 지키고 있는 건 정의실현부 분들이라고 들었어요……."
10010110-62 = "이번 주가 정기순회주라고 하셨으니 전부는 아니겠지만……. 그래도 그 정의실현부라고요."
10010110-63 = "저 같은 보통의 시스터가, 거기를 몰래…… 아니면 억지로라도 들어간다는 건 애초에 불가능해요……."
10010110-65 = "이제 한 시간만 지나면……. 사쿠라코 님께서……. 모두의 앞에서……."
10010110-66 = "[s3] \"카마수트라를……. 낭독…….\"\n[s4] \"……오우, 이런…….\""
10010110-69 = "……흐으……. 흑……흑흑……흑……."
10010110-70 = "죄송합니다……. 죄송합니다, 여러분. 죄송합니다, 사쿠라코 님……. 행사 참여하신 분들 모두……."
10010110-71 = "어떻게든 해 보려 했지만……. 저 때문에 결국 그 많은 분들이 다 피해를……."
10010110-72 = "결국……. 뿌린 대로 거두는 법인가 보네요……. 받아들여야지요……."
10010110-73 = "……히나타 씨……."
10010110-74 = "……."
10010110-78 = "[ns5] \"……일어섰어?\"\n[ns6] \"어디 가는 거야?\""
10010110-79 = "……역시 이대로 있을 수는 없겠지요."
10010110-80 = "……역시 이대로 있을 수는 없겠지요."
10010110-81 = "그래도 가야겠지요. 행사장에……. 제가 직접……."
10010110-82 = "참석자는 아니지만……. 상황이 터졌을 때……. 사실대로 말을 해야 할 테니까요……."
10010110-84 = "선생님……. 오늘 하루, 정말 감사했습니다."
10010110-86 = "비록 이렇게 되긴 했지만, 선생님께서 도와주셔서……. 정말 기쁘고 큰 도움이 되었었어요."
10010110-88 = "우이 씨께서는 고생이라고 말씀하셨지만……. 사실 하나같이 즐겁기도 했고요."
10010110-90 = "……다시 한번, 정말 감사했습니다."
10010110-91 = "우이 씨도……. 정말 감사했어요. 그 책 복원……."
10010110-92 = "……으으응."
10010110-97 = "……'그 아이의 치료'……."
10010110-98 = "……?"
10010110-99 = "마지막까지 잘 부탁드릴게요. 행사에는 못 가지만, 그래도 변함없이 중요한 아이니까요."
10010110-100 = "……."
10010110-101 = "잠깐만요, 히나타 씨. 지금 뭐라고……."
10010110-102 = "……먼저 실례하겠습니다."
10010110-103 = "그럼……."
10010110-104 = "[s7] \"잠깐, 히나타.\"\n[s8] \"책임이라면 당연히 나도 같이…….\""
10010110-105 = "……아니에요. 선생님."
10010110-106 = "……아니에요. 선생님."
10010110-107 = "이건 어디까지나 제가 벌인 일이고, 선생님께서는 도와주셨던 것뿐이니까요."
10010110-108 = "적어도 이것만큼은……. 제가 직접……. 스스로 하게 해 주세요."
10010110-109 = "……부탁드려요."
10010110-114 = "[ns] \"…….\""
