211060-30 = "ผู้ช่วยหัวหน้าคณะกรรมการฟื้นฟู ชั้นปีที่ 2 เมียวรากุ คาเรน"
211060-31 = "อะไรกัน จำฉันได้ด้วยเหรอ?"
211060-32 = "และหัวหน้าคณะกรรมการฟื้นฟู ชั้นปีที่ 2 ฟุริฮาตะ มายูมิ"
211060-33 = "จำชื่อฉันได้ด้วย?"
211060-34 = "คิกคิกคิก ความตั้งใจของเหล่ารุ่นน้องที่อยากทำบางสิ่งเพื่อเกเฮนน่านั้นช่างน่าชื่นชม"
211060-35 = "ทว่า! เกเฮนน่าไม่จำเป็นต้องเปลี่ยนแปลงไปจากที่เป็นอยู่ตอนนี้#nนั่นคือความคิดของเรา ฮานุมะ มาโคโตะ ผู้นำแห่งแพนเดโมเนียม โซไซตี้"
211060-36 = ""
211060-38 = ""
211060-39 = "ทำไมล่ะ? ท่านประธานไม่อยากให้เกเฮนน่ายิ่งใหญ่ขึ้นกว่านี้เหรอ?"
211060-40 = "ก็เกเฮนน่ายิ่งใหญ่มากพออยู่แล้วน่ะสิ"
211060-41 = "ยิ่งใหญ่? เกเฮนน่าในตอนนี้ยิ่งใหญ่งั้นเหรอ?"
211060-42 = "เฮอะ! พวกเธออาจไม่รู้ แต่เราตั้งใจให้ธรรมเนียมโรงเรียนในปัจจุบันเป็นแบบนี้ทุกอย่างอยู่แล้ว พวกเด็กเมื่อวานซืน"
211060-43 = "ถึงจะดูเหมือนแค่ปล่อยทิ้งไว้เพราะขี้เกียจจัดการก็เถอะค่ะ"
211060-44 = "งั้นหมายความว่าก็จะปล่อยให้เกเฮนน่าเป็นโรงเรียนที่เละเทะแบบนี้ต่อไปเหรอ? ตลอดไปเลย?"
211060-45 = "จะบอกว่าชอบสภาพตอนนี้ที่นักเรียนทุกคนทำตามใจตัวเอง แถมใครๆ ยังตราหน้าว่าเป็นโรงเรียน#nรวมเด็กมีปัญหางั้นเหรอ? จริงๆ น่ะเหรอ?"
211060-46 = "คนที่คิดว่าเละเทะก็มีแค่พวกเธอเท่านั้น!"
211060-47 = "อีกอย่าง มัวแต่มาสนใจว่าคนอื่นจะมองยังไง แล้วจะไปทำอะไรสำเร็จได้ล่ะ!#nเธอไม่คู่ควรจะรับหน้าที่ผู้นำเอาเสียเลย ฟุริฮาตะ มายูมิ!"
211060-48 = "อึก เอาคำที่ฉันพูดมาย้อนใส่กันตรงๆ เลยเหรอ!"
211060-49 = ""
211060-51 = ""
211060-52 = ""
