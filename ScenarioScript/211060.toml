211060-78 = "ต้องมีแผนอะไรซ่อนอยู่แน่ๆ..."
211060-79 = "เกเฮนน่าในตอนนี้ดำเนินไปภายใต้โครงสร้างแบบสองขั้ว ระหว่างเด็กมีปัญหาที่ก่อเรื่อง กับคณะกรรมการวินัยที่คอยลงโทษนักเรียนเหล่านั้นค่ะ"
211060-80 = "ยิ่งมีนักเรียนที่ทำตามใจตัวเองมากเท่าไร คณะกรรมการวินัยก็ยิ่งต้องเผชิญกับภาระงานหนัก และยิ่งเป็นเช่นนั้น ก็ยิ่งกลายเป็นสัญลักษณ์ของการกดขี่และความน่ากลัวสำหรับนักเรียน นี่คือโครงสร้างของระบบนี้ค่ะ"
211060-81 = "นี่คงเป็นผลลัพธ์ที่ประธานมาโคโตะเจตนาไว้อย่างไม่ต้องสงสัยค่ะ"
211060-82 = "ถูกต้อง! ภาพลักษณ์ของพวกคณะกรรมการวินัยกำลังตกต่ำลงเรื่อยๆ คิกคิก"
211060-83 = "แต่มีสิ่งที่ประธานมองข้ามไปอยู่ค่ะ"
211060-84 = "ว่าไงนะ?"
211060-85 = "แม้นักเรียนจะกลัวและเกลียดคณะกรรมการวินัย แต่พวกเขาก็ไม่ได้รู้สึกถึงการมีตัวตนของ#nแพนเดโมเนียม โซไซตี้จากที่ไหนเลยค่ะ"
211060-86 = "ประธานคงตั้งใจให้มวลชนเกิดความเฉยเมยทางการเมืองด้วยความชาญฉลาด แต่น่าเสียดายที่#nการกระทำนั้นกลับกลายเป็นปัจจัยที่ยิ่งตอกย้ำบทบาทของโซระซากิ ฮินะ ผู้เป็นประธานกรรมการวินัย#nให้มั่นคงขึ้นค่ะ"
211060-87 = "อืมม..."
211060-88 = "ในแง่นั้น บุคคลที่เรียกได้ว่าเป็น 'ตัวเอก' ของเกเฮนน่าในปัจจุบัน..."
211060-89 = "น่าจะไม่ใช่ประธานฮานุมะ มาโคโตะ แต่เป็นประธานกรรมการวินัยโซระซากิ ฮินะมากกว่าค่ะ"
211060-90 = "เป็นคำพูดที่เราไม่อาจปล่อยผ่านได้จริงๆ ช่างน่าอดสูเสียเหลือเกิน..."
211060-91 = "แต่ถ้าท่านยอมรับข้อเสนอของพวกเราคณะกรรมการฟื้นฟูเกเฮนน่า สถานการณ์ก็จะแตกต่างออกไปค่ะ"
