211060-97 = "ทุกครั้งที่นักเรียนใช้พื้นที่นั้น พวกเขาจะตระหนักถึงความจริงที่ว่า คนที่มอบความสนุกสนานเช่นนี้#nให้พวกเขาคือประธานฮานุมะ มาโคโตะ ผู้ใจกว้างและยืนอยู่บนจุดสูงสุดของแพนเดโมเนียม โซไซตี้#nไม่ใช่โซระซากิ ฮินะ ประธานกรรมการวินัยจอมปีศาจค่ะ"
