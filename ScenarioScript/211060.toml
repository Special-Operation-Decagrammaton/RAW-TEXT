[translation]
211060-1 = "第6話;協商"
211060-2 = ""
211060-3 = ""
211060-4 = ""
211060-5 = "……"
211060-6 = "不行！！"
211060-7 = "為什麼！？"
211060-8 = "我們為什麼想打造那樣的空間，不是都已經解釋過了嗎，議長？"
211060-9 = "沒有理由！只是本大人看不順眼！嘰嘻嘻！"
211060-10 = "哪有這麼不講理的！？"
211060-11 = "哼，你們想打造的不過是讓人脫序的空間罷了。"
211060-12 = "那種地方，本大人連一毛預算都不會浪費。#n要是擴充能廣為宣揚本大人威嚴的校內廣播設備，倒還可以考慮。"
211060-13 = "可是把問題學生集中在同一個地方，應該會比現在省下更多預算吧？"
211060-14 = "而且風紀委員會也會比現在輕鬆很多啊！"
211060-15 = "問題就出在這裡！！"
211060-16 = "咦！？"
211060-17 = "反正出動和善後的預算跟繁重工作，全都是風紀委員會的事！#n跟我們萬魔殿無關！"
211060-18 = "本大人就是看不慣眼中釘風紀委員會比現在更輕鬆！嘰嘻嘻！"
211060-19 = "唉……"
211060-20 = ""
211060-22 = ""
211060-23 = ""
211060-24 = "啊啊……對哦。他跟風紀委員會的關係很差……"
211060-25 = "就算這樣，萬魔殿也還是學生會吧？這全都是為了學生啊……"
211060-26 = ""
211060-28 = ""
211060-29 = ""
211060-30 = "再興委員會委員長輔佐，2年級的明樂香蓮。"
211060-31 = "什麼嘛，你記得我啊？"
211060-32 = "還有再興委員會的委員長，2年級的降旗真由美。"
211060-33 = "連我的名字也記得？"
211060-34 = "嘰嘻嘻，後輩們想為格黑娜做點什麼的心意，倒是值得嘉許。"
211060-35 = "但是！格黑娜根本不需要做出任何改變，#n這就是本大人──萬魔殿的頂點羽沼真琴大人的想法。"
211060-36 = ""
211060-38 = ""
211060-39 = "為什麼？議長不希望格黑娜變得更偉大嗎？"
211060-40 = "因為格黑娜已經夠偉大了。"
211060-41 = "偉大？現在的格黑娜很偉大？"
211060-42 = "哈！你們這些乳臭未乾的小鬼大概不知道吧。#n現在的校風可是本大人刻意營造出來的。"
211060-43 = "雖然看起來只像是嫌麻煩才放著不管就是了。"
211060-44 = "所以你打算讓格黑娜一直這樣亂七八糟下去嗎？永遠都這樣？"
211060-45 = "學生們全都為所欲為，大家都說我們是問題兒童學園──你真的覺得這樣很好嗎？"
211060-46 = "覺得亂七八糟的只有你們而已！"
211060-47 = "再說，在意別人的眼光又能怎樣！#n以領導者來說，你的器量實在小得可笑啊，降旗真由美！"
211060-48 = "嗚，居然把我說過的話原封不動還給我！"
211060-49 = ""
211060-51 = ""
211060-52 = ""
211060-54 = ""
211060-55 = "……請容我在此說幾句話，真琴議長。"
211060-56 = "是再興委員會的書記，2年級的五十嵐翔子吧。"
211060-57 = "……傳聞您記得每一位學生，原來是真的啊。"
211060-58 = "嘻嘻，身為站在頂點的人，這點小事當然要做到。"
211060-59 = "說來聽聽吧。"
211060-60 = ""
211060-62 = ""
211060-63 = "我明白現在的格黑娜，完全是依照議長的哲學所打造的。"
211060-64 = ""
211060-66 = ""
211060-67 = "這正是至高的「無為而治」，可說是凡人連模仿都做不到的高超政治手腕。"
211060-68 = ""
211060-70 = ""
211060-71 = ""
211060-72 = "嘰嘻嘻，沒錯！你看得很透徹嘛！"
211060-73 = ""
211060-75 = ""
211060-76 = ""
211060-77 = "哇，是翔子的奸臣模式……！"
211060-78 = "那絕對是在打什麼鬼主意……"
211060-79 = "現在的格黑娜，是靠著惹是生非的問題學生，#n以及制裁這些學生的風紀委員會，這種二元對立的結構在運作。"
211060-80 = "任性妄為的學生越多，風紀委員會的工作就越繁重──#n而工作越繁重，風紀委員會就越會成為學生眼中壓迫與恐懼的象徵。"
211060-81 = "這想必正是真琴議長刻意造成的結果吧。"
211060-82 = "沒錯！風紀委員會那些傢伙的形象正一路下滑呢。嘻嘻。"
211060-83 = "不過，議長忽略了一件事。"
211060-84 = "什麼？"
211060-85 = "學生們雖然害怕、討厭風紀委員會，卻完全感受不到萬魔殿的存在感。"
211060-86 = "議長想必是明智地刻意讓大眾對政治漠不關心……#n但遺憾的是，這樣的做法反而成了鞏固風紀委員長空崎陽奈存在感的土壤。"
211060-87 = "唔嗯……"
211060-88 = "從這個意義上來說，現在的格黑娜稱得上「主角」的人物……"
211060-89 = "恐怕不是羽沼真琴議長，而是風紀委員長空崎陽奈吧。"
211060-90 = "這話可不能當作沒聽見。實在是悽慘至極……"
211060-91 = "因此，如果您願意接受我們格黑娜再興委員會的提案，情況就不同了。"
211060-92 = ""
211060-94 = ""
211060-95 = "我們要管理的特別區域「Trigger Happy Zone」，#n並不只是放任學生脫序的單純空間。"
211060-96 = "而會是「議長親自允許」的自由與歡樂的空間。"
211060-97 = "學生們每次使用那裡時都會感受到。#n帶給他們這份歡樂的，是萬魔殿的頂點、寬宏大量的羽沼真琴議長，#n而不是鬼之風紀委員長空崎陽奈。"
211060-98 = "哦……"
211060-99 = ""
211060-101 = ""
211060-102 = "說得好，翔子！再加把勁！"
211060-103 = "阻攔、妨礙自己的風紀委員會，以及給予自己真正自由的萬魔殿……"
211060-104 = "學生們究竟會偏愛、稱頌哪一邊呢？"
211060-105 = ""
211060-107 = ""
211060-108 = ""
211060-109 = "不是壓抑自由，而是往另一個方向發洩啊……"
211060-110 = ""
211060-112 = ""
211060-113 = ""
211060-114 = "……"
211060-115 = "嘰嘻嘻！聽你這麼說，看來你們是把本大人當成傻瓜了啊。"
211060-116 = ""
211060-118 = ""
211060-119 = "咦？"
211060-120 = "不管說得再好聽，到頭來還不是要做你們自己想做的事。"
211060-121 = "而且還要一點一點偷走偉大萬魔殿的權力！"
211060-122 = "您誤會了。我們只是……"
211060-123 = "哼，那種權限可不能交給連能力都還沒證明過的後輩小鬼。"
211060-124 = "……"
211060-125 = "還有，以減輕風紀委員會工作量為名目這點，我也看不順眼！！#n就算立意再好，終究還是有不能讓步的事！"
211060-126 = "[s] 「真琴。」"
211060-127 = ""
211060-129 = ""
211060-130 = "[ns1] 「政治上的判斷固然重要……」\n[ns2] 「但這次要不要給後輩們一次機會呢？」\n[ns3] 「我想支持他們願意嘗試的心意。」"
211060-134 = "……"
211060-135 = "……"
211060-136 = "……"
211060-137 = ""
211060-139 = ""
211060-140 = ""
211060-141 = ""
211060-142 = "嘰嘻嘻……真有一套。居然說服了老師來幫忙。"
211060-143 = "這就當作後輩們證明了自己的能耐吧……"
211060-144 = "說服……？"
211060-145 = "噓，安靜。"
211060-146 = "……"
211060-147 = "好吧。這次就看在老師的面子上，暫且允許再興委員會的活動。"
211060-148 = ""
211060-150 = ""
211060-151 = "哇！萬歲～～！！"
211060-152 = ""
211060-154 = ""
211060-155 = ""
211060-156 = ""
211060-157 = ""
211060-158 = "[ns] 「謝謝你，真琴。」"
211060-159 = "嘰嘻嘻……這次萬魔殿的讓步，就記在老師的帳上了。"
211060-160 = "將來總有一天，得討回比這次更有價值的東西才算扯平！"
211060-161 = "無論有形還是無形的寶貴之物，一定要……！！"
211060-162 = ""
211060-164 = ""
211060-165 = "咳咳，咳咳！！咳呃！！"
211060-166 = ""
211060-168 = ""
211060-170 = "啊，又嗆到了。你沒事吧，真琴前輩？"
211060-171 = "咳呃！咳咳咳！！"
211060-172 = "那個，事情好像談完了，你們可以先走了。這邊我會收拾的。"
211060-173 = "[s4] 「謝謝你，伊呂波。」\n[s5] 「保重身體啊，真琴……」"
211060-176 = ""
211060-178 = ""
211060-179 = ""
211060-181 = ""
211060-182 = "……"
211060-183 = "嗯？你有話想跟我說嗎？"
211060-184 = "……沒有。那麼告辭了。"
211060-185 = ""
211060-187 = ""
211060-188 = ""
211060-189 = "咳咳咳咳！！"
211060-190 = "哎呀，真琴醬～還真是吵吵鬧鬧的。要不要幫你拍拍背？"
211060-192 = "哇啊～！成功了，成功了！"
211060-193 = "雖然我有自信說服議長……"
211060-194 = "不過老師的一句話更有份量──可以這麼說吧。"
211060-195 = "老師～謝謝你！剛才那番話，我好像有點感動了呢！"
211060-196 = "[s] 「因為大家都是認真的。」"
211060-197 = "對啊對啊！我們才是真心熱愛格黑娜的學生嘛！"
211060-198 = "翔子醬也很會說話呢。簡直油嘴滑舌到不行！"
211060-199 = "那不是在罵人嗎？"
211060-200 = "我們總算是跨過一座大山了吧？耶嘿嘿。"
211060-201 = "好～那麼接下來！！"
211060-202 = "……"
211060-203 = "……是，是什麼來著？"
211060-204 = ""
211060-206 = ""
211060-207 = ""
211060-211 = "……原來你們在做那種事啊。"
211060-212 = "我也不打算刻意阻止想做點什麼的後輩。"
211060-213 = "總而言之，在那片空地上發生的事，風紀委員會都不會制裁……這樣就可以了吧？"
211060-214 = "知道了。我會轉告部員們的。"
211060-215 = "[s] 「陽奈怎麼看？」"
211060-216 = "你說怎麼看……是指什麼？格黑娜再興委員會？"
211060-217 = "……誰知道呢。雖然現在還不太清楚……"
211060-218 = "不管方法如何，我能感受到他們想讓格黑娜變得更好的心意。"
211060-219 = "只要在過程中別鬧出什麼奇怪的事故就好了……"
211060-220 = "總之我會繼續看著他們。畢竟我不想再多出讓人操心的事了。"
211060-221 = "不過有老師在旁邊的話，應該沒問題吧。"
211060-222 = "[s] 「陽奈果然很溫柔呢。」"
211060-223 = "唔嗯……"
211060-224 = "……"
211060-225 = "那個，需要老師幫忙的，可不只有那些學生而已。"
211060-226 = ""
211060-228 = ""
211060-229 = ""
211060-230 = "能占用你一點時間嗎……？老師。"
211060-232 = "（和被繁重工作累壞的陽奈一起喝茶，讓他能好好休息）"
211060-233 = "（希望這次的事，能讓陽奈和風紀委員會的工作減少一些）"
211060-235 = "下一話;香蓮"
