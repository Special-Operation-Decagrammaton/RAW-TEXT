211060-56 = "เลขาคณะกรรมการฟื้นฟู ชั้นปีที่ 2 อิการาชิ โชโกะสินะ"
211060-57 = "ที่ว่าจำนักเรียนได้ทุกคนนั้นเป็นเรื่องจริงสินะคะ..."
211060-58 = "คิกคิก ในฐานะผู้ยืนอยู่บนจุดสูงสุด เรื่องแค่นี้ก็ต้องทำได้อยู่แล้ว"
