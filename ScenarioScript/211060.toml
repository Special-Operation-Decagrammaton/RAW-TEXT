211060-6 = "ไม่ได้!!"
211060-7 = "ทำไมล่ะ?!"
211060-8 = "ฉันอธิบายไปหมดแล้วนี่ว่าทำไมพวกเราอยากสร้างพื้นที่แบบนั้น ท่านประธาน"
211060-9 = "เหตุผลน่ะไม่มีหรอก! แค่ไม่ถูกใจท่านมาโคโตะผู้นี้เท่านั้น! คิกคิกคิก!"
211060-10 = "จะเอาแต่ใจแบบนั้นได้ยังไง?!"
211060-11 = "ฮึ่ม สิ่งที่พวกเธออยากสร้างก็แค่พื้นที่ที่ปล่อยให้ออกนอกลู่นอกทาง"
211060-12 = "เราไม่มีงบประมาณแม้แต่แดงเดียวให้เอาไปผลาญกับพื้นที่แบบนั้นหรอก ถ้าเป็นการขยายระบบ#nกระจายเสียงภายในโรงเรียนเพื่อประกาศบารมีของเราให้เลื่องลือไปทั่วก็ว่าไปอย่าง"
211060-13 = "แต่การรวบเด็กมีปัญหาทั้งหมดไปไว้ที่เดียว น่าจะช่วยประหยัดงบได้มากกว่าตอนนี้เยอะเลยนะ?"
211060-14 = "แล้วคณะกรรมการวินัยก็จะงานน้อยลงกว่านี้อีกมากด้วย!"
211060-15 = "นั่นแหละปัญหา นั่นแหละ!!"
211060-16 = "เอ๋?!"
211060-17 = "ยังไงซะ งบประมาณที่ต้องใช้และภาระงานหนักจากการออกปฏิบัติการหรือตามเก็บกวาดปัญหา ก็เป็นเรื่องของคณะกรรมการวินัย! ไม่ใช่เรื่องที่แพนเดโมเนียม โซไซตี้ของเราต้องสนใจ!"
211060-18 = "เราไม่มีทางทนดูเสี้ยนหนามอย่างคณะกรรมการวินัยทำงานสบายขึ้นกว่าเดิมหรอก! คิกคิกคิก!"
