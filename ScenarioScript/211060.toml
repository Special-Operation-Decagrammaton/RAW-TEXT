[translation]
211060-1 = "제6화;협상"
211060-5 = "……."
211060-6 = "안 된다!!"
211060-7 = "어째서?!"
211060-8 = "우리가 왜 그런 공간을 만들고자 하는지는 이미 모두 설명했는데, 의장님."
211060-9 = "이유는 없다! 그저 이 몸의 마음에 들지 않는다! 키시싯!"
211060-10 = "그런 억지가 어디 있어?!"
211060-11 = "흥, 너희가 만들고자 하는 것은 단순히 일탈을 위한 공간일 뿐."
211060-12 = "그런 곳에 낭비할 예산 따위는 한 푼도 없다. 차라리 이 몸의 위엄을 널리 알릴 수 있는 교내 방송 설비를 확충한다면 모를까."
211060-13 = "하지만 문제아들을 한 곳에 몰아넣는 게 지금보다는 훨씬 예산 절감 효과가 있을걸?"
211060-14 = "게다가 선도부도 지금보다는 훨씬 덜 바빠질 테고 말이야!"
211060-15 = "그게 문제다, 그게!!"
211060-16 = "엣?!"
211060-17 = "어차피 출동이나 수습에 소요되는 예산 및 격무는 선도부의 일! 우리 만마전이 알 바는 아니다!"
211060-18 = "이 몸은 눈엣가시인 선도부가 지금보다 편해지는 꼴은 볼 수 없다는 거다! 키시싯!"
211060-19 = "하아……."
211060-24 = "아아…… 맞다. 선도부랑 사이 안 좋았지……."
211060-25 = "그렇다 하더라도 학생회잖아, 만마전은. 이건 다 학생을 위한 일인데……."
211060-30 = "재흥위원회 위원장 보좌, 2학년 묘라쿠 카렌."
211060-31 = "뭐야, 나를 기억하고 있어?"
211060-32 = "그리고 재흥위원회 회장, 2학년 후리하타 마유미."
211060-33 = "내 이름도?"
211060-34 = "키시싯, 게헨나를 위해 무언가를 해보고자 하는 후배들의 마음은 갸륵하다."
211060-35 = "허나! 게헨나는 지금과 달라질 필요가 없다는 것이#n이 몸, 만마전의 톱인 하누마 마코토 님의 생각이다."
211060-39 = "어째서? 의장님은 게헨나가 더 위대해지길 바라지 않는 거야?"
211060-40 = "게헨나는 이미 충분히 위대하기 때문이지."
211060-41 = "위대해? 지금의 게헨나가 위대하다고?"
211060-42 = "하! 네 녀석들은 모르겠으나, 지금의 교풍은 이 몸께서 철저히 의도한 것이다, 애송이들."
211060-43 = "단순히 귀찮아서 냅두는 걸로 보이겠지만요."
211060-44 = "그럼, 게헨나를 지금처럼 엉망진창인 학원으로 내버려두겠다는 거야? 언제까지든?"
211060-45 = "학생들은 온통 제멋대로에, 모두가 문제아 학원이라며 손가락질하는 지금이 좋다는 거야?#n정말로?"
211060-46 = "엉망진창이라 생각하는 것은 오직 네 녀석들뿐!"
211060-47 = "게다가, 남들의 시선 따위를 신경 써서 뭘 어쩌겠다는 거냐!#n리더를 맡기에는 그릇이 터무니없이 작구나, 후리하타 마유미!"
211060-48 = "큭, 내가 한 말을 그대로 돌려주다니!"
211060-55 = "……여기서는 제가 한 말씀 올리도록 하겠습니다, 마코토 의장."
211060-56 = "재흥위원회 서기, 2학년 이가라시 쇼코로군."
211060-57 = "……학생 한 명 한 명을 모두 기억하고 있다는 게 사실이었군요."
211060-58 = "키킥, 정점에 선 자로서 그 정도는 해야겠지."
211060-59 = "아무튼 말해보도록."
211060-63 = "지금의 게헨나가 철저히 의장의 철학으로 이루어진 결과라는 것은 알겠습니다."
211060-67 = "이는 지극한 [ruby=無爲之治]'무위의 치'[/ruby]로, 평범한 이들은 흉내조차 낼 수 없는 고도의 정치적 기술이라 할 수 있겠지요."
211060-72 = "키시싯, 그렇다! 제대로 알아보았구나!"
211060-77 = "우왓, 간신 모드의 쇼코……!"
211060-78 = "저거 분명 뭔가 꿍꿍이가 있는 거지……."
211060-79 = "지금의 게헨나는 말썽을 일으키는 문제아들, 그리고 그런 학생들을 단죄하는 선도부라는 이분법적인 구도로 돌아가고 있습니다."
211060-80 = "제멋대로 행동하는 학생들이 많을수록 선도부는 격무에 시달리고, 그렇게 될수록 학생들에게 압제와 공포의 상징으로 군림하게 되는 구조이지요."
211060-81 = "이는 필시 마코토 의장께서 의도한 결과일 것입니다."
211060-82 = "그렇다! 선도부 녀석들의 이미지는 점점 더 추락하고 있지. 키킥."
211060-83 = "하지만 의장께서 간과하고 계신 것이 있습니다."
211060-84 = "뭣이?"
211060-85 = "학생들은 선도부를 무서워하고 싫어할지언정, 만마전의 존재감은 어디에서도 느끼지 못하고 있죠."
211060-86 = "의장께서는 현명하게도 대중들의 정치적 무관심을 의도하셨겠지만, 애석하게도 그러한 행동이 선도부장인 소라사키 히나의 존재감을 더욱 공고히 해주는 토양이 되고 있습니다."
211060-87 = "으음……."
211060-88 = "그런 의미로 작금의 게헨나에서 '주인공'이라 할 수 있는 인물은……"
211060-89 = "아마도 하누마 마코토 의장이 아닌, 선도부장 소라사키 히나겠지요."
211060-90 = "도무지 흘려들을 수 없는 말이군. 참담하기 그지없는……"
211060-91 = "그런 의미에서, 저희 게헨나재흥위원회의 제안을 수용해 주신다면 이야기는 달라집니다."
211060-95 = "저희가 관리할 특별구역, <트리거 해피 존>은 그저 학생들의 일탈을 방조하는 일차원적인 공간이 아닙니다."
211060-96 = "'의장께서 직접 허락하신' 자유와 즐거움의 공간이 되겠지요."
211060-97 = "학생들은 그곳을 이용할 때마다 느끼게 될 겁니다. 자신들에게 이러한 즐거움을 선사한 사람은 만마전의 톱이자 관대하신 하누마 마코토 의장이지, 귀신 선도부장 소라사키 히나가 아니라는 사실을요."
211060-98 = "호오……."
211060-102 = "잘한다, 쇼코! 더 밀어붙여!"
211060-103 = "자신들을 막고 방해하는 선도부, 그리고 자신들에게 진정한 자유를 선사한 만마전……"
211060-104 = "학생들이 과연 어느 쪽을 선호하고 칭송하겠습니까?"
211060-109 = "자유를 억압하는 것이 아니라, 또 다른 방향으로의 발산이라……."
211060-114 = "……."
211060-115 = "키시싯! 이거, 듣자 하니 이 몸을 아주 바보로 보는 모양이군."
211060-119 = "네?"
211060-120 = "듣기 좋은 소리로 살살 꼬드겨 봤자, 결국 너희들이 하고 싶은 일을 하겠다는 소리 아닌가."
211060-121 = "이 위대한 만마전의 권력을 조금씩 훔쳐 가면서 말이지!"
211060-122 = "오해입니다. 저희는 단지……"
211060-123 = "흥, 아직 능력이 증명되지도 않은 애송이 후배들에게 그런 권한을 쥐어 줄 수는 없는 노릇."
211060-124 = "……."
211060-125 = "그리고 선도부의 일감을 덜어준다는 명목 또한 마음에 들지 않는다!!#n아무리 의도가 좋더라도, 결국에는 양보하지 말아야 할 것이 있는 법!"
211060-126 = "[s] \"마코토.\""
211060-130 = "[ns1] \"정치적인 결정도 좋겠지만,\"\n[ns2] \"이번에는 후배들에게 한번 기회를 줘보는 건 어떨까?\"\n[ns3] \"해보겠다는 마음을 응원하고 싶어.\""
211060-134 = "……."
211060-135 = "……."
211060-136 = "……."
211060-142 = "키시싯…… 제법이군. 선생을 설득하여 도움을 구했나."
211060-143 = "이는 후배들이 나름의 역량을 입증했다 보아도 되겠지……."
211060-144 = "설득……?"
211060-145 = "조용, 조용."
211060-146 = "……."
211060-147 = "좋다. 여기서는 선생의 면을 보아, 재흥위원회의 활동을 일단 허가하도록 하지."
211060-151 = "와! 만세~~!!"
211060-158 = "[ns] \"고마워, 마코토.\""
211060-159 = "키시싯…… 이번 만마전의 양보는 선생의 빚으로 달아두도록 하겠다."
211060-160 = "향후 언젠가 이번 일 이상의 무언가를 받아내야 균형이 맞을 터!"
211060-161 = "유형무형의 값진 것을, 반드시……!!"
211060-165 = "콜록, 콜록!! 크헥!!"
211060-170 = "아, 또 침 잘못 삼켰네. 괜찮아요, 마코토 선배?"
211060-171 = "크헉! 커헉헉!!"
211060-172 = "저기, 이야기는 끝난 것 같으니 먼저 가셔도 돼요. 여기는 알아서 정리할 테니까요."
211060-173 = "[s4] \"고마워, 이로하.\"\n[s5] \"몸조심해, 마코토…….\""
211060-182 = "……."
211060-183 = "응? 내게 할 말이라도 있는 걸까?"
211060-184 = "……아닙니다. 그럼."
211060-189 = "케헷헥!!"
211060-190 = "이런, 마코토 쨩~ 요란하기도 하지. 등이라도 두들겨 줄까?"
211060-192 = "와아~! 성공했다, 성공!"
211060-193 = "의장을 설득할 자신은 있었으나……"
211060-194 = "그보다 선생님의 한마디가 더 강력했다, 라고 봐도 되겠지요."
211060-195 = "선생님~ 고마워! 아까 그 말, 나 살짝 감동했을지도!"
211060-196 = "[s] \"다들 진심이었으니까.\""
211060-197 = "맞아맞아! 우리야말로 진짜 게헨나를 사랑하는 학생들이니까!"
211060-198 = "쇼코 쨩도 말 엄청 잘하던데. 아주 뱀의 혀가 따로 없었어!"
211060-199 = "그건 욕 아닌가요?"
211060-200 = "우리 일단 큰 산 하나는 넘은 거려나? 헤헤."
211060-201 = "자아~ 그럼 그다음으로!!"
211060-202 = "……."
211060-203 = "……뭐, 뭐였더라?"
211060-211 = "……그런 일을 하고 있었구나."
211060-212 = "나도 뭔가 해보겠다는 후배들을 굳이 막고 싶은 생각은 없어."
211060-213 = "정리하자면, 그쪽 공터에서 일어나는 일은 선도부에서 제재하지 않는다…… 라는 걸로 괜찮겠지?"
211060-214 = "알겠어. 부원들에게 전파해둘게."
211060-215 = "[s] \"히나는 어떻게 생각해?\""
211060-216 = "어떻게라니…… 뭘? 게헨나재흥위원회?"
211060-217 = "……글쎄. 아직은 잘 모르겠지만……"
211060-218 = "그 방식이 어찌 되든, 게헨나를 좀 더 좋은 곳으로 만들겠다는 마음은 느껴져."
211060-219 = "그 과정에서 이상한 사고만 안 일으킨다면 좋겠지만……"
211060-220 = "아무튼 나도 계속 지켜볼 생각이야. 걱정할 일을 더 늘리는 건 사양이니까."
211060-221 = "뭐, 선생님이 옆에 있다면 괜찮겠지."
211060-222 = "[s] \"역시 히나는 상냥하네.\""
211060-223 = "으음……"
211060-224 = "……."
211060-225 = "저기, 선생님의 도움이 필요한 건 그 학생들뿐만은 아니거든."
211060-230 = "조금 시간 괜찮을까……? 선생님."
211060-232 = "(격무에 지친 히나가 편안히 쉴 수 있도록 함께 차를 마셨다.)"
211060-233 = "(이번 일로, 히나와 선도부의 일감이 줄어들면 좋겠다는 생각을 했다.)"
211060-235 = "다음화;카렌"
