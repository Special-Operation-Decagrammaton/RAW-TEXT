211060-20 = ""
211060-22 = ""
211060-23 = ""
211060-24 = "อ๋อ... จริงด้วย ทางนี้ไม่ถูกกับคณะกรรมการวินัยนี่นา..."
211060-25 = "แต่ถึงอย่างนั้น แพนเดโมเนียม โซไซตี้ก็เป็นสภานักเรียนนะ เรื่องนี้เป็นการทำเพื่อนักเรียนแท้ๆ..."
