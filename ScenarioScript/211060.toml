211060-67 = "นี่นับเป็น 'การปกครองโดยไม่กระทำ' ขั้นสูงสุด เรียกได้ว่าเป็นศิลปะทางการเมืองระดับสูงที่#nคนธรรมดาไม่อาจแม้แต่จะเลียนแบบได้เลยค่ะ"
