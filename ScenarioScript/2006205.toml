[translation]
2006205-1 = "#title;심지어 패션도 화학!"
2006205-2 = "#place;흰돌고래 시장"
2006205-3 = "#na;(에리나의 출장을 돕기 위해 붉은겨울에 방문했다.)"
2006205-4 = "3;에리나;99;아아. 이것이, 낮은 고도의 공기-\n#3;a"
2006205-5 = "3;에리나;11;춤추듯 내려온 화학의 천재, 니키 에리나에게 어울리는군요.\n#3;em;[반짝]"
2006205-6 = "[s] \"멋져!!\""
2006205-7 = "3;에리나;13;후훙-! 당연한 사실이지만 칭찬은 자주 들어도 기분 좋네요!\n#3;jump"
2006205-8 = "3;에리나;00;오늘은 그동안 제가 연구한 화학 섬유 제품들의 시장조사를 할 거예요! 사무국에서 보고서 쓰라고 외출 허가해 줬어요!"
2006205-9 = "3;에리나;05;맘 같아선 즈나먀 카페도 가고 싶은데, 하필 모든 점원이 병가라고 해서…….\n#3;em;[한숨]"
2006205-10 = "3;에리나;00;아쉽지만 어쩔 수 없죠! 어차피 오늘 할 일도 많기도 하고요!"
2006205-11 = "[s] \"어떤 제품들이 있는데?\""
2006205-12 = "3;에리나;11;좋은 질문이네요! 오늘 보여드릴 야심작은 세 가지!\n#3;greeting"
2006205-13 = "3;에리나;00;첫 번째는 폴리비닐알코올 섬유!  값싸고 흔한 재료로 만들 수 있어요. 석유 대신에 석탄과 석회석을 쓰면 되니까, 단가를 엄청나게 줄일 수 있죠! 수분 흡수도 잘되고요!"
2006205-14 = "3;에리나;02;두 번째는 재생 셀룰로오스 섬유에요 . 이건 폐지나 톱밥, 낡은 면을 파쇄해서 화학 처리하는 걸로 만드는 건데, 자원 절약도 할 수 있고 생분해성이라 친환경적이에요!"
2006205-15 = "3;에리나;00;마지막으로 보온 울 섬유! 보통의 울에다가 가공과 화학 처리를 해서 추운 겨울에도 엄청 따듯하게 입을 수 있어요!"
2006205-16 = "3;에리나;03;이 세 가지 모두 중간평가가 좋았어요, 183호 탈출도 꿈은 아닐지도!\n#3;em;[음표]"
2006205-17 = "[s] \"전부 대단해!\""
2006205-18 = "3;에리나;11;그럼요- 제가 공부는 싫어도, 할 때는 하잖아요!"
2006205-19 = "3;에리나;00;제 위대한 발명품에 기뻐하는 학생들의 얼굴이 보고 싶네요! 어서 옷 가게에 가보죠!"
2006205-20 = "3;에리나;11;이번에 제가 만든 신제품 전시용으로 야심 차게 새로 만든 가게라서, 엄청 멋질 거예요!"
2006205-21 = "3;에리나;03;자아, 과학 나가신다-!\n#3;hophop"
2006205-22 = "3;에리나;01\n#3;a"
2006205-23 = "3;에리나;03;와!! 엄청 잘 꾸며놨잖아! 이거지, 이거야!\n#3;em;[!]\n#3;jump"
2006205-24 = "3;에리나;04;와! 어, 그러니까. 그거 뭐였죠? 어두운 곳을 밝게 하는 실내 전기 장치-"
2006205-25 = "3;에리나;00;그렇지! 조명! 밝은 조명에 깔끔한 인테리어! 오오, 바닥은 PVC 데코타일이네요! 방수도 되고, 단열 효과도 좋죠 음음!"
2006205-26 = "3;에리나;03;분위기 엄청 좋지 않아요? 옷도 잔뜩 있고, 손님도 하나도 없어서 쾌적하고!"
2006205-27 = "#st;[0,0];instant;1;"
2006205-29 = "3;에리나;03\n#3;em;[...]\n#wait;2500"
2006205-30 = "3;에리나;25;손님이 왜 없어?!\n#3;closeup\n#bgshake\n#fontsize;80"
2006205-31 = "#st;[0,0];instant;1;"
2006205-33 = "3;에리나;25\n#3;closeup\n#3;d\n#wait;1000"
2006205-34 = "3;붉은겨울 옷가게 점원;01\n#3;a\n#wait;1000"
2006205-35 = "2;에리나;03\n3;붉은겨울 옷가게 점원;01\n#na;에리나;저, 저기요~? 아직 오픈 전인가요? 손님이 왜 아무도 없죠?\n#2;h\n#2;em;[땀]\n#2;a\n#3;m4"
2006205-36 = "3;붉은겨울 옷가게 점원;02;아뇨, 오픈은 했는데요. 그냥 손님이 없는 거예요.\n#3;em;[한숨]"
2006205-37 = "2;에리나;04;왜요?! 가격도 안 비싸고, 디자인도 예쁘고, 매장도 이렇게 예쁜데?"
2006205-38 = "2;에리나;06;이, 이거 잘 팔리지 않아요? 폴리비닐알코올 섬유로 만든 블라우스요! 완전 예쁘니까 인기 많을 텐데? 그쵸?\n#2;greeting"
2006205-39 = "3;붉은겨울 옷가게 점원;01;아 그거, 매대 닦을 때 쓰는 거예요. 하도 안 팔려서 다 빼뒀어요."
2006205-40 = "2;에리나;25;이걸로 매대를 닦는다고요?!\n#2;em;[?!]"
2006205-41 = "3;붉은겨울 옷가게 점원;03;네. 이거 막상 입어보면 통풍도 안 되고, 미끌거려서 잠옷으로도 못 쓰거든요. 저도 입어보고 침대에서 떨어질 뻔했어요. 세탁하면 엄청나게 줄어들기도 하고요."
2006205-42 = "3;붉은겨울 옷가게 점원;02;물 흡수는 잘 되어서 걸레로 쓰고 있어요."
2006205-43 = "2;에리나;06;…….\n#2;em;[...]"
2006205-44 = "2;에리나;05;그, 그러면 이건요? 재생 셀룰로오스로 만든 코트랑 교복 세트!\n#2;greeting"
2006205-45 = "2;에리나;00;반질반질해서 예쁘고, 가격도 싸서 인기 많을 것 같은데?! 생분해성이라 친환경적이기도 하고요!"
2006205-46 = "3;붉은겨울 옷가게 점원;02;그거 이제 사무국에서 판매 금지 명령 내려서 팔면 처벌받아요. 지금 빼는 중이었어요."
2006205-47 = "2;에리나;25;네?!!!\n#2;shake\n#2;em;[?!]"
2006205-48 = "3;붉은겨울 옷가게 점원;03;그게 제일 잘 팔리기는 했어요. 값도 싸고 예쁘니까요. 한때는 없어서 못 팔았죠."
2006205-49 = "2;에리나;04;그럼, 어째서……."
2006205-50 = "2;에리나;01\n3;붉은겨울 옷가게 점원;02;그게, 옷이 세탁 몇 번 하니까 엄청 빠르게 약해지더라고요. 저번 주에 강풍이 불었더니 지나가는 사람들 옷이 다 찢어졌었어요.\n#3;m3\n#2;dl"
2006205-51 = "3;붉은겨울 옷가게 점원;03;수십 명이 공연외설죄로 잡혀갔다가, 막상 사무국원들도 강풍에 옷이 없어져 버리니까 그제야 다 풀려났어요.\n#3;em;[한숨]"
2006205-52 = "3;붉은겨울 옷가게 점원;02;햇볕보다 북풍이 나그네의 옷을 더 잘 벗겨냈다고 아이들이 착각하는 바람에 초등부에서 재교육도 하고, 난리도 아니었다던데요."
2006205-53 = "3;에리나;10;아, 아앗…… 생분해성으로 만들었더니 이렇게 됐구나…….\n#3;em;[속상함]"
2006205-54 = "3;에리나;05;아, 아직!! 마지막 희망이 남아있지!\n#3;jump"
2006205-55 = "3;에리나;00;보온 울 섬유로 만든 방한 바지는 어디 있어요? 요새 날씨가 추워서 인기 많았을 것 같은데!"
2006205-56 = "3;붉은겨울 옷가게 점원;03;아, '불개미 바지'요? 그거 이제는 여기에서 안 팔아요."
2006205-57 = "3;붉은겨울 옷가게 점원;02;그거 입으면 피부가 엄청 따가워서 몸에 열은 오르는데, 아침에 모르고 입고 나가면 저녁쯤엔 거의 미쳐서 집에 돌아온다고 하더라고요. 그래서 불개미로 만들었다고 별명도 붙었어요.\n#3;em;[한숨]"
2006205-58 = "3;붉은겨울 옷가게 점원;03;저 앞에 즈나먀 카페에서 새 유니폼으로 맞췄다가, 다들 스트레스 때문에 치고받고 싸워서 아직도 문 닫았어요."
2006205-59 = "3;에리나;20;앗, 아앗…….\n#3;stiff"
2006205-60 = "3;붉은겨울 옷가게 점원;03;그래도 금속공장에서 광택 내는 용도로 쓰면 좋다고 해서, 저기 밑에 철물점 가면 팔 거예요."
2006205-61 = "3;붉은겨울 옷가게 점원;02;그런데 다 폐기된 옷만 찾으시네요, 뭔가 일이라도 있으세요?\n#3;em;[?]"
2006205-62 = "3;에리나;09;……."
2006205-63 = "[s1] \"이, 일단 밖으로 나갈까?\"\n[s2] (에리나를 데리고 밖으로 나간다.)"
2006205-68 = "3;에리나;10\n#3;a"
2006205-69 = "3;에리나;10;…….\n#3;em;[세로선]"
2006205-70 = "[s3] \"너무 기죽지 말고…….\"\n[s4] \"이럴 때도 있는 법이니까 기운 내자!\""
2006205-73 = "3;에리나;10;우우…….\n#3;stiff"
2006205-74 = "3;에리나;03;대성공! 아싸!\n#3;hophop"
2006205-75 = "3;에리나;14;생각보다 더 대단한 발명을 했네요! 이거지, 이거지!\n#3;greeting"
2006205-76 = "[s] \"실망한 거 아니었어?!\""
2006205-77 = "3;에리나;06;엥? 제가 왜요? 실망할 거리가 없지 않나?\n#3;em;[?]"
2006205-78 = "3;에리나;02;아- 물론 옷으로서 부작용은 심해서 못 써먹긴 했죠. 피부가 따가워서 못 입는다든지, 옷이 바람에 분해된다든지, 옷이 미끈거린다든지. 그건 좀 아쉽긴 하네요!"
2006205-79 = "3;에리나;11;하지만 반대로~ 금속에 광택 내는 산업용으로 쓸 만하고, 생분해성 속도를 이런 식으로 빠르게 할 수 있는 것도 알았고, 미끌거리는 대신에 물 흡수를 잘하니까 다른 용도로 쓸 수 있게 됐잖아요?"
2006205-80 = "3;에리나;00;그러면 무의미한 발명이 아닌 거예요! 어쨌든 이 세상에서 쓸모 하나씩은 있으니까요!\n#3;em;[반짝]"
2006205-81 = "3;에리나;02;의도와 다른 발명품은 꽤 많아요! 실패한 접착제를 메모지에 사용한다든지, 어떤 약의 부작용을 다른 용도로 사용한다든지!"
2006205-82 = "3;에리나;03;중요한 건 '뭔가 해냈다'는 거죠! 브이!\n#3;greeting"
2006205-83 = "[s5] \"멋진 마음가짐……!\"\n[s6] \"그런데 보고서는 어떻게 하지……?\""
2006205-86 = "3;에리나;13;그건 말이죠- 사실 그게 제일 간단한 거예요!\n#3;em;[음표]"
2006205-87 = "#st;[0,0];instant;1;"
2006205-89 = "3;에리나;13\n#3;greeting\n#wait;1000"
2006205-90 = "3;에리나;19;'의도된 사양이다'라고 기획서를 수정하면 되거든요!\n#3;closeup"
2006205-91 = "3;에리나;13;다행히 이럴 줄 알고 연필로 써뒀으니, 허가 도장만 남기고 새로 쓰면-\n#3;greeting\n#3;closeup"
2006205-92 = "3;에리나;03;이걸로 올- 오케이!\n#3;em;[반짝]\n#3;closeup"
2006205-93 = "[s] \"어…… 그래……!\""
2006205-95 = "#na;(이후, 에리나는 신난 발걸음으로 사무국 우편함에 연구 보고서를 집어넣었다.)"
2006205-96 = "#na;(기뻐하는 에리나를 보니 마음이 놓였다.)"
