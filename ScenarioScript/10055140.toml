[translation]
10055140-1 = "Day of the Lobster"
10055140-2 = "[log]ลอยเคว้ง วันที่ XX[/log]"
10055140-7 = "[ns1] \"บนฝั่งจะเป็นยังไงบ้างนะ...?\"\n[ns2] \"ทุกคนจะสบายดีกันรึเปล่านะ...?\""
10055140-10 = "พูดอะไรใจเสาะแต่เช้าตรู่เลยนะ ครู!"
10055140-11 = ""
10055140-13 = ""
10055140-14 = "ชีวิตในนีโอเกเฮนน่าที่เราปกครองอยู่ มีอะไรไม่น่าพอใจหรือไง?"
10055140-15 = "[s] \"นีโอ... เกเฮนน่า...?\""
10055140-16 = "ใช่แล้ว! เมื่อเช้าจู่ๆ ท่านมาโคโตะผู้นี้ก็นึกขึ้นมาได้น่ะ!"
10055140-17 = "ว่าเกเฮนน่าไม่ได้อยู่ไกลเลย... ไม่สิ ท่านมาโคโตะผู้นี้อยู่ที่ใด ที่นั่นก็คือเกเฮนน่าที่แท้จริง!"
10055140-18 = "หรือก็คือเรือลำนี้ก็คือเกเฮนน่าแห่งใหม่ <นีโอเกเฮนน่า> ยังไงล่ะ!"
10055140-19 = "มีอะไรหรือ ครู...? ดูเหมือนมีอะไรอยากพูดนะ"
10055140-20 = "[s3] \"ครูคิดว่าทัศนคติแบบนั้นยอดเยี่ยมมากเลย\"\n[s4] \"มาโคโตะนี่ใจสู้จริงๆ เลยนะ…\""
10055140-23 = "คิกคิกคิก! เราไม่ค่อยเข้าใจหรอก แต่นั่นคงเป็นคำชมสินะ!"
10055140-24 = "คุณครูก็อย่าคิดอะไรให้มากเลย ดื่มด่ำกับช่วงเวลานี้ให้เต็มที่เสียเถอะ! อีกเดี๋ยวหน่วยกู้ภัยก็มาถึงแล้วละ"
10055140-25 = ""
10055140-27 = ""
10055140-28 = "แหะๆ~ อย่างนี้เองสินะคะ"
10055140-29 = ""
10055140-31 = ""
10055140-32 = "ชีวิตในทะเลก็มีความลำบากในแบบของมันเหมือนกันสินะคะ!"
10055140-33 = "เอ๋ อ๊ะ คุณครู!"
10055140-34 = "คะ? ฉันคุยกับใครอยู่เหรอคะ?"
10055140-35 = "ฮุฮุ ฉันจะแนะนำให้รู้จักนะคะ! คุณคนนี้คือคุณปลาโยนะนั่นเองค่ะ!"
10055140-36 = "แค่ลอยมาเจอกันก็ถือว่ามีวาสนาต่อกันแล้ว! ไม่สิ แค่ว่ายน้ำมาเจอกันก็ถือว่ามีวาสนาต่อกันแล้ว!"
10055140-37 = "เราได้พบกันราวกับปาฏิหาริย์กลางทะเลอันกว้างใหญ่ จะเรียกว่าเป็นคนอื่นคนไกลไม่ได้แล้วค่ะ!"
10055140-38 = "ก็เลยถือโอกาสถามนู่นถามนี่อยู่ค่ะ"
10055140-39 = "เอ๋ คุณครูเป็นอะไรไปเหรอคะ?"
10055140-40 = "[s5] \"ปะ... เปล่าหรอก คุยกันก็ดีแล้วละ\"\n[s6] \"เอ่อ คุยกันให้สนุกนะ\""
10055140-43 = "ค่า! ขอบคุณนะคะ!"
10055140-44 = "ถ้าอย่างนั้น ฉันอยากฟังเรื่องที่คุณถูกปลาตัวใหญ่กลืนเข้าไปทั้งตัวให้จบก่อนน่ะค่ะ..."
10055140-45 = ""
10055140-47 = ""
10055140-48 = "เฮ้อ... ทนดูไม่ไหวจริงๆ เลยค่ะ"
10055140-49 = "[s7] \"อ๊ะ อิโรฮะ!\"\n[s8] \"ครูเชื่ออยู่แล้วละว่าอิโรฮะน่าจะมีสติที่สุด...\""
10055140-52 = ""
10055140-56 = "...? มีอะไรคะ? ทำท่าเหมือนเห็นผีเลย?"
10055140-57 = "คะ? เจ้าตัวที่ถืออยู่ในมือนี่เหรอคะ?"
10055140-58 = "คุณครูก็น่าจะรู้จักนี่คะ โทระมารุไงคะ?"
10055140-59 = "มีปัญหาอะไรกับโทระมารุของฉันเหรอคะ...?"
10055140-60 = ""
10055140-62 = ""
10055140-63 = "ปืนใหญ่หลักก็ยังใช้ได้ เกราะก็ไม่มีอะไรผิดปกติ..."
10055140-64 = "เท่าที่เห็น ฉันก็ว่าปกติดีนะคะ?"
10055140-65 = "คะ? บอกว่าไม่มีอะไรงั้นเหรอคะ?"
10055140-66 = "เอาเป็นว่าฉันต้องไปลาดตระเวนแล้ว ขอตัวก่อนนะคะ..."
10055140-67 = "ไปกันเถอะค่ะ โทระมารุ"
10055140-68 = ""
10055140-70 = ""
10055140-71 = "บรืนนน"
10055140-72 = ""
10055140-75 = ""
10055140-76 = "จนกว่าจะกลับขึ้นฝั่ง ไม่บอกความจริงไปคงดีกว่าสินะ?"
10055140-77 = "[s9] \"ซัตสึกิ!\"\n[s10] \"ยังปลอดภัยดีสินะ!\""
10055140-80 = "ดะ... เดี๋ยวก่อน! พูดแบบนั้นก็เหมือนกับมีอะไรที่อาจจะไม่ปลอดภัยน่ะสิ!"
10055140-81 = "อย่าพูดเป็นลางแบบนั้นนะ ฉันยิ่งใจคอไม่ดีอยู่!"
10055140-82 = "ว่าแต่ว่า... มาโคโตะจังน่ะไม่เท่าไรหรอก แต่ทั้งอิโรฮะ ทั้งจิอากิก็เป็นแบบนั้นกันไปด้วย"
10055140-83 = "แบบนี้แพนเดโมเนียม โซไซตี้คงเสียหน้าแย่เลย"
10055140-84 = "[s11] \"มาโคโตะถือว่าไม่เท่าไรสินะ...\"\n[s12] \"ทุกคนคงเครียดสะสมกันมาหลายเรื่องสินะ...\""
10055140-87 = "ก็จริง ขนาดฉันยังไม่คิดเลยว่าจะต้องมาลอยเคว้งนานขนาดนี้"
10055140-88 = "คุณครู~!"
10055140-89 = ""
10055140-91 = ""
10055140-92 = "อ๊ะ รุ่นพี่ซัตสึกิก็อยู่ด้วย! สวัสดีค่า!"
10055140-93 = "อ้าว อิบูกิจัง วิ่งบนเรือเดี๋ยวก็หกล้มหรอก"
10055140-94 = "งื้อ... ต้องระวัง..."
10055140-95 = "แล้วนี่มีอะไรถึงได้วิ่งมาหน้าตาตื่นแบบนั้นล่ะ?"
10055140-96 = "อื้อ นี่ ตรงด้านโน้นน่ะ มีเกาะด้วยละ!"
10055140-97 = "เดี๋ยวสิ กลางทะเลกว้างแบบนี้จะมีเกาะได้ยังไง..."
10055140-98 = "เฮือก! อย่าบอกนะว่าแม้แต่อิบูจังก็เห็นภาพหลอนด้วย?!"
10055140-99 = "คุณครู...?"
10055140-100 = "จู่ๆ เป็นอะไรไปน่ะ จ้องทะเลไม่วางตาเลย ถ้าไม่ระวังเดี๋ยวก็ตกลงไปหรอก"
10055140-101 = "[ns] \"ชะ...\""
10055140-102 = "ชะ...?"
10055140-103 = "[ns] \"ชายฝั่ง!!\""
10055140-106 = "อะ... อะไรนะ?! พูดจริงเหรอ?!"
10055140-107 = "ชายฝั่งงั้นเหรอคะ?!"
10055140-108 = "ว่าไงนะ?! พูดจริงเหรอ?!"
10055140-109 = ""
10055140-113 = "จริงๆ ด้วย... ไม่นึกเลยว่าจะมีเกาะใหญ่ขนาดนี้อยู่กลางทะเลด้วย"
10055140-114 = "ไม่มีวี่แววของคนเลยนะคะ หวังว่าจะไม่ใช่เกาะร้างนะคะ"
10055140-115 = "หืม? ไม่สิ เป็นเกาะร้างที่ยังไม่มีใครค้นพบเลยน่าจะดีกว่า!"
10055140-116 = "คะ?"
10055140-117 = "เพราะนั่นหมายความว่าเราเป็นคนแรกที่ค้นพบเกาะแห่งนี้ยังไงล่ะ!"
10055140-118 = "คิกคิกคิก! ตั้งแต่วันนี้ไป เราจะเรียกเกาะนี้ว่าเกาะมาโคโตะ!"
10055140-119 = "ฉันชักจะทึ่งแล้วนะคะ... ว่ามองโลกในแง่ดีขนาดนั้นได้ยังไงกัน?"
10055140-122 = ""
10055140-123 = ""
10055140-124 = ""
10055140-125 = "หืม?"
10055140-126 = "ว้าว~ คุณปูเสฉวนน่ารักๆ!"
10055140-127 = "จริงด้วยค่ะ! น่ารักจัง! มาถ่ายรูปกันมั้ยคะ?"
10055140-128 = "ปูเสฉวนแพนเดโมเนียม โซไซตี้ละ!"
10055140-129 = "ปูเสฉวนแพนเดโมเนียม โซไซตี้...?"
10055140-130 = "อื้อ! ตัวนี้คือรุ่นพี่มาโคโตะ ตัวนี้คือรุ่นพี่ซัตสึกิ..."
10055140-131 = "โอ้! จริงด้วยนะ! พอดูดีๆ แล้วสีเปลือกเหมือนสีผมพวกเราเลยค่ะ!"
10055140-132 = "ถ้าอย่างนั้น เจ้าตัวสีดำนี้ก็คงเป็นปูเสฉวนเลขาของแพนเดโมเนียม โซไซตี้สินะคะ?"
10055140-133 = "อย่างนี้นี่เอง... ที่นี่ก็มีระบบนิเวศของตัวเองอยู่เหมือนกันสินะคะ"
10055140-134 = "ถ้าเป็นอย่างนั้น เราก็อาจจะหาอาหารจากที่นี่ได้สินะคะ"
10055140-135 = "ถึงจะรู้สึกผิดกับอิบูกิ แต่เจ้าปูพวกนี้ก็..."
10055140-136 = "ว่ายังไงนะ?!"
10055140-137 = "คิดจะกินเจ้าพวกนี้เหรอ?! เจ้าตัวนี้เนี่ยนะ?!"
10055140-138 = "ตะ... ตกใจหมดเลย... มีปัญหาอะไรอีกงั้นเหรอคะ?"
10055140-139 = "เห็นแล้วยังไม่รู้อีกงั้นเหรอ?"
10055140-140 = "จะเอาไปเป็นอาหารเนี่ยนะ เหลวไหลสิ้นดี! เจ้าพวกนี้คือนักสู้ต่างหาก!"
10055140-141 = "........."
10055140-142 = "คะ...?"
10055140-144 = "จิตวิญญาณนักสู้ที่ลุกโชนอยู่หลังดวงตาสุกใสนั่น... แกไม่ใช่ปูเสฉวนธรรมดาสินะ?!"
10055140-145 = "แกเป็นตัวอะไรกันแน่?!"
10055140-146 = "เป็นตัวอะไรกันแน่น่ะ?"
10055140-147 = "ตายจริง ชื่นชมกันขนาดนั้นเลยเหรอเนี่ย ยินดีด้วยนะ เจ้าปูเสฉวนตัวน้อย มาโคโตะจังไม่ได้ชมใคร#nแบบนี้ง่ายๆ หรอกนะ"
10055140-148 = "เดี๋ยวสิ อะไรกัน..."
10055140-149 = "ทุกคนจะตื่นเต้นอะไรกันนักหนา แค่ปูเสฉวนตัวเดียวเอง..."
10055140-150 = "อะฮะฮ่า! แต่ก็ดีไม่ใช่เหรอ? รู้สึกเหมือนแพนเดโมเนียม โซไซตี้กลับมาเป็นเหมือนเดิมแล้ว หลังจากที่ไม่ได้รู้สึกแบบนี้มาตั้งนานแน่ะ!"
10055140-151 = "มันก็จริงค่ะ แบบนี้ก็ดีกว่านั่งซึมกันอยู่ละนะ..."
10055140-152 = "รู้แล้ว! เจ้าตัวนี้คือฉลาม! ถึงร่างกายจะเป็นปูเสฉวน แต่ใจสู้ไม่แพ้ฉลามเลย!"
10055140-153 = "ตั้งแต่นี้ไป แกคือ <ไทเกอร์ชาร์กมารุ>!"
10055140-154 = "นี่คือว่าที่แชมป์ที่จะขึ้นเป็นสุดยอดปูเสฉวน! ไม่สิ ปูเสฉวนที่จะก้าวไปเป็นสัตว์เปลือกแข็งที่แข็งแกร่ง#nที่สุดต่างหาก!"
10055140-155 = ""
10055140-156 = ""
10055140-157 = "แหะๆ~"
