10055140-131 = "Oh yeah, I see it! Their shells are the same colors as our hair!"
10055140-132 = "So this little black one, is she their secretary, or what?"
10055140-133 = "...I see. So there's a thriving ecosystem here."
10055140-134 = "Which implies food."
