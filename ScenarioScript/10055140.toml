[translation]
10055140-1 = "데이 오브 더 랍스터"
10055140-2 = "[log]표 류 XX 일 차[/log]"
10055140-7 = "[ns1] \"……육지에서는 어쩌고 있을까?\"\n[ns2] \"다들 잘 지내고 있을까……?\""
10055140-10 = "아침 댓바람부터 무슨 나약한 소리인가, 선생!"
10055140-14 = "이 몸이 통치하는 네오 게헨나에서의 생활에 불만이라도 있는 건가?"
10055140-15 = "[s] \"네오…… 게헨나……?\""
10055140-16 = "그래, 오늘 아침, 이 몸은 불현듯이 깨닫고 말았다!"
10055140-17 = "게헨나는 멀리 있지 않다고…… 아니, 오히려 이 마코토 님이 있는 곳이야말로 진정한 게헨나라고!"
10055140-18 = "즉, 이 배는 새로운 게헨나, <네오 게헨나>인 것이다!"
10055140-19 = "……뭔가, 선생? 하고 싶은 말이 있어 보이는데."
10055140-20 = "[s3] \"그런 마인드, 훌륭하다 생각합니다.\"\n[s4] \"마코토는 역시 씩씩하구나…….\""
10055140-23 = "키히힛! 잘은 모르겠지만, 칭찬이로군!"
10055140-24 = "선생도 쓸데없는 생각 말고 이 시간을 만끽하는 게 좋을 거다! 어차피 구조대는 금방 도착할 테니 말이야!"
10055140-28 = "헤에~ 그렇군요."
10055140-32 = "바다에서의 삶에는 바다만의 고충이 있다! 라는 것이네요!"
10055140-33 = "어라. 아, 선생님!"
10055140-34 = "네? 누구랑 대화하고 있느냐고요?"
10055140-35 = "후후, 소개해 드릴게요! 여기 계신 분은 물고기 요나 씨에요!"
10055140-36 = "옷깃만 스쳐도 인연! 아니, 지느러미만 스쳐도 인연!"
10055140-37 = "망망대해 한복판에서 마주친 기적, 더는 남이라고 할 수는 없죠!"
10055140-38 = "그래서 모처럼이니 이것저것 여쭤보고 있었거든요."
10055140-39 = "근데, 왜 그러세요?"
10055140-40 = "[s5] \"아, 아니, 괜찮다 생각해.\"\n[s6] \"그, 인터뷰 힘내.\""
10055140-43 = "네엡! 감사합니다!"
10055140-44 = "그러면, 커다란 물고기한테 통째로 삼켜진 이야기부터 마저 듣고 싶은데요……."
10055140-48 = "하아…… 정말 못 봐주겠네요."
10055140-49 = "[s7] \"아, 이로하!\"\n[s8] \"믿고 있었어! 이로하는 제정ㅅ…….\""
10055140-56 = "……? 뭔가요? 무슨 유령이라도 본 것처럼?"
10055140-57 = "네? 손에 들고 있는 이거요?"
10055140-58 = "보시다시피 토라마루인데요?"
10055140-59 = "제 토라마루에 뭔가 문제라도……?"
10055140-63 = "주포는 멀쩡하고, 장갑에도 이상이 없고……."
10055140-64 = "제가 보기에는 정상 같은데요?"
10055140-65 = "네? 아무것도 아니라고요?"
10055140-66 = "……하여튼 저는 순찰 일정이 있어 이만."
10055140-67 = "갑시다, 토라마루."
10055140-71 = "부우웅."
10055140-76 = "……육지에 돌아갈 때까지, 진실은 말하지 않는 편이 좋겠지?"
10055140-77 = "[s9] \"사츠키!\"\n[s10] \"무사했구나!\""
10055140-80 = "자, 잠깐! 그렇게 말하면 무사하지 않을 수도 있는 것 같잖아!"
10055140-81 = "불안해지니까 그런 식으로 말하지 마!"
10055140-82 = "……그나저나, 마코토 쨩은 그렇다 쳐도. 이로하에, 치아키까지."
10055140-83 = "이래서는 만마전의 체면이 대손상이야."
10055140-84 = "[s11] \"마코토는 그렇다 치는구나…….\"\n[s12] \"다들 이래저래 스트레스가 쌓인 걸까.\""
10055140-87 = "하긴, 나도 이렇게 표류가 길어질 줄은 몰랐으니까."
10055140-88 = "선생님~!"
10055140-92 = "아, 사츠키 선배도 있다! 안녕하세요!"
10055140-93 = "어머, 이부키 쨩. 배 위에서 뛰면 넘어진다고."
10055140-94 = "아차……. 조심조심……."
10055140-95 = "그래서, 왜 그렇게 급하게 달려온 거니?"
10055140-96 = "응, 있지! 저기 끝에, 섬이 있어!"
10055140-97 = "아니, 이런 망망대해 한복판에 섬이 있을 리가……."
10055140-98 = "헉! 설마 이부키 쨩마저 헛것을?!"
10055140-99 = "……선생님?"
10055140-100 = "갑자기 왜 그래, 바다를 빤히 바라보고. 조심하지 않으면 떨어진다고?"
10055140-101 = "[ns] \"유…….\""
10055140-102 = "유?"
10055140-103 = "[ns] \"육지다!!\""
10055140-106 = "뭐, 뭐야?! 진짜야?!"
10055140-107 = "육지라고요?!"
10055140-108 = "뭐?! 그 말이 사실인가?!"
10055140-113 = "정말이네…… 이렇게 큰 섬이 바다 한복판에 있을 줄이야."
10055140-114 = "……사람의 흔적이 없네요. 무인도, 는 아니었으면 좋겠는데."
10055140-115 = "응? 아니지. 차라리 발견된 적 없는 무인도인 편이 좋다!"
10055140-116 = "네?"
10055140-117 = "그 말은 즉, 이 섬을 처음으로 발견한 게 이 몸이라는 뜻이 되니까 말이다!"
10055140-118 = "키시싯! 오늘부터 이 섬은 마코토 섬이라 부르겠다!"
10055140-119 = "……어떻게 그렇게 포지티브한 사고방식이 가능한 건지, 슬슬 신기할 지경인데요?"
10055140-125 = "응?"
10055140-126 = "와아~ 귀여운 소라게 씨다!"
10055140-127 = "정말이네요! 귀여워라! 사진 찍을까요?"
10055140-128 = "소라게 만마전이야!"
10055140-129 = "소라게 만마전……?"
10055140-130 = "응! 이건 마코토 선배, 이건 사츠키 선배……."
10055140-131 = "오오! 그러고 보니! 등껍질 색깔이 저희 머리색이랑 똑같네요!"
10055140-132 = "그러면, 이 검은 아이는 소라게 만마전의 서기인 걸까요?"
10055140-133 = "……과연. 나름 생태는 갖춰져 있나요."
10055140-134 = "그렇다는 것은, 여기서 식량 조달이 가능할지도 모르겠네요."
10055140-135 = "이부키에게는 미안하지만, 이 녀석들도……."
10055140-136 = "뭣이라고?!"
10055140-137 = "지금 먹겠다는 거냐?! 이 녀석을?!"
10055140-138 = "까, 깜짝이야……. 또 뭐가 문제예요?"
10055140-139 = "보고도 모르겠나?!"
10055140-140 = "식량 따위 언어도단! 이 녀석은 파이터다!"
10055140-141 = "…………."
10055140-142 = "……네?"
10055140-144 = "똘망거리는 눈 너머로 보이는 이글거리는 투지는……, 너는 평범한 소라게가 아니군?!"
10055140-145 = "대체 정체가 뭐냐, 네 녀석?!"
10055140-146 = "정체가 뭐냐!"
10055140-147 = "어머, 대단한 고평가네. 축하해, 작은 소라게야. 마코토 쨩한테 이런 평가는 쉽게 받기 어려워."
10055140-148 = "아니, 무슨……."
10055140-149 = "다들, 고작 소라게 한 마리로 무슨 호들갑을……."
10055140-150 = "아하하! 그래도 좋잖아? 오랜만에 평소의 만마전으로 돌아온 기분인걸!"
10055140-151 = "……뭐, 그렇네요. 축 쳐져 있는 것보다야……."
10055140-152 = "알았다! 이 녀석은 상어다! 비록 육체는 소라게지만, 기백은 상어에 못지않다!"
10055140-153 = "지금부터 너는 <타이거샤크마루>다!"
10055140-154 = "소라게의 정점, 아니, 그걸 뛰어넘어 갑각류 최강이 될 챔프다!"
10055140-157 = "으헤~"
