[translation]
10055140-1 = "龍蝦之日"
10055140-2 = "[log]漂 流 第 XX 天[/log]"
10055140-7 = "[ns1] 「……陸地上的大家，現在怎麼樣了呢？」\n[ns2] 「大家都過得好嗎……？」"
10055140-10 = "一大早就說什麼喪氣話啊，老師！"
10055140-11 = ""
10055140-13 = ""
10055140-14 = "難道你對本大人統治下的新格黑娜生活有什麼不滿嗎？"
10055140-15 = "[s] 「新……格黑娜……？」"
10055140-16 = "沒錯，今天早上本大人突然領悟到了！"
10055140-17 = "格黑娜並不遙遠……不，應該說我真琴大人所在之處，才是真正的格黑娜！"
10055140-18 = "也就是說，這艘船就是新的格黑娜──[ruby=NEO]「新格[/ruby]黑娜」！"
10055140-19 = "……怎麼了，老師？你看起來好像有話想說。"
10055140-20 = "[s3] 「我覺得這種心態很了不起。」\n[s4] 「真琴果然很堅強呢……」"
10055140-23 = "嘰嘻嘻！雖然不太懂，不過是在稱讚本大人吧！"
10055140-24 = "老師也別胡思亂想了，好好享受這段時間吧！#n反正救援隊馬上就會到了！"
10055140-25 = ""
10055140-27 = ""
10055140-28 = "嘿～原來如此。"
10055140-29 = ""
10055140-31 = ""
10055140-32 = "海上的生活有海上才有的辛苦！是這個意思吧！"
10055140-33 = "哎呀，是老師！"
10055140-34 = "咦？你問我在跟誰說話？"
10055140-35 = "哼哼，我來介紹一下！這位是魚兒尤娜小姐！"
10055140-36 = "擦肩而過也是緣分！不對，擦鰭而過也是緣分！"
10055140-37 = "能在茫茫大海中相遇是奇蹟，已經不能說是外人了！"
10055140-38 = "所以我就趁這難得的機會問了很多問題。"
10055140-39 = "不過老師怎麼了嗎？"
10055140-40 = "[s5] 「啊，沒有，我覺得挺好的。」\n[s6] 「那個，採訪加油。」"
10055140-43 = "好～的！謝謝老師！"
10055140-44 = "那麼，我想接著聽你被大魚整個吞下去的故事……"
10055140-45 = ""
10055140-47 = ""
10055140-48 = "唉……真是看不下去了。"
10055140-49 = "[s7] 「啊，伊呂波！」\n[s8] 「我就知道！伊呂波還是正常──」"
10055140-52 = ""
10055140-56 = "……怎麼了？一副像是見到鬼的樣子？"
10055140-57 = "咦？我手上拿的這個嗎？"
10055140-58 = "如你所見，是虎丸啊？"
10055140-59 = "我的虎丸有什麼問題嗎……？"
10055140-60 = ""
10055140-62 = ""
10055140-63 = "主砲完好，裝甲也沒有異常……"
10055140-64 = "在我看來很正常啊？"
10055140-65 = "咦？你說沒什麼？"
10055140-66 = "……總之我還有巡邏行程，先告辭了。"
10055140-67 = "走吧，虎丸。"
10055140-68 = ""
10055140-70 = ""
10055140-71 = "噗嗚嗚。"
10055140-72 = ""
10055140-75 = ""
10055140-76 = "……在回到陸地之前，還是別說出真相比較好吧？"
10055140-77 = "[s9] 「皐月！」\n[s10] 「原來你沒事！」"
10055140-80 = "先，先等一下！你那種說法，聽起來就好像有人出事了一樣！"
10055140-81 = "會讓人不安的，拜託不要那樣講話！"
10055140-82 = "……真琴醬也就算了，連伊呂波和千秋都這樣。"
10055140-83 = "這樣下去萬魔殿可要顏面盡失了。"
10055140-84 = "[s11] 「原來真琴可以算了啊……」\n[s12] 「大家多少都累積了一些壓力吧。」"
10055140-87 = "也是，連我也沒想到這次漂流會拖這麼久。"
10055140-88 = "老師～！"
10055140-89 = ""
10055140-91 = ""
10055140-92 = "啊，皐月前輩也在！你好呀！"
10055140-93 = "哎呀，伊吹醬。在船上跑會跌倒的哦。"
10055140-94 = "糟糕……小心，小心……"
10055140-95 = "話說，你急著跑過來有什麼事嗎？"
10055140-96 = "嗯，就是啊！那邊的盡頭有一座島哦！"
10055140-97 = "在茫茫大海的中央居然會有島……"
10055140-98 = "啊！難道連伊吹醬都出現幻覺了！？"
10055140-99 = "……老師？"
10055140-100 = "怎麼突然一直盯著海看？不小心點會掉下去哦？"
10055140-101 = "[ns] 「陸……」"
10055140-102 = "陸？"
10055140-103 = "[ns] 「是陸地！！」"
10055140-106 = "什，什麼！？真的嗎！？"
10055140-107 = "你說陸地！？"
10055140-108 = "什麼！？此話當真！？"
10055140-109 = ""
10055140-113 = "真的耶……沒想到大海中央竟然會有這麼大的島。"
10055140-114 = "……沒有人的痕跡呢。希望不是無人島就好了。"
10055140-115 = "怎麼會呢？如果是從未被發現過的無人島才好啊！"
10055140-116 = "咦？"
10055140-117 = "因為這就代表第一個發現這座島的，就是本大人啊！"
10055140-118 = "嘰嘻嘻！從今天起，這座島就叫做「真琴島」！"
10055140-119 = "……你到底是怎麼做到這麼正面思考的，我都開始覺得神奇了。"
10055140-122 = ""
10055140-123 = ""
10055140-124 = ""
10055140-125 = "嗯？"
10055140-126 = "哇～是可愛的寄居蟹先生！"
10055140-127 = "真的耶！好可愛！要拍照嗎？"
10055140-128 = "是寄居蟹萬魔殿哦！"
10055140-129 = "寄居蟹萬魔殿……？"
10055140-130 = "嗯！這隻是真琴前輩，這隻是皐月前輩……"
10055140-131 = "哦哦！這麼說來！殼的顏色跟我們的髮色一模一樣耶！"
10055140-132 = "那麼，這隻黑色的就是寄居蟹萬魔殿的書記囉？"
10055140-133 = "……原來如此。生態倒是挺完整的嘛。"
10055140-134 = "這也就表示，或許能在這裡取得糧食。"
10055140-135 = "雖然對伊吹很抱歉，不過這些小傢伙也……"
10055140-136 = "你說什麼！？"
10055140-137 = "意思是要吃掉牠嗎！？吃掉這傢伙！？"
10055140-138 = "嚇，嚇我一跳……這次又有什麼問題了？"
10055140-139 = "你看了還不懂嗎！？"
10055140-140 = "當成糧食簡直荒謬！這傢伙可是個鬥士！"
10055140-141 = "…………"
10055140-142 = "……什麼？"
10055140-144 = "那雙水汪汪的眼睛背後，燃燒著熊熊的鬥志……你不是普通的寄居蟹吧！？"
10055140-145 = "你這傢伙，到底是什麼來頭！？"
10055140-146 = "是什麼來頭！"
10055140-147 = "哎呀，評價還真高呢。恭喜你，小寄居蟹。#n要得到真琴醬這種評價可不容易哦。"
10055140-148 = "不不，這是在說什麼啊……"
10055140-149 = "為了區區一隻寄居蟹，大家有必要這麼大驚小怪嗎……"
10055140-150 = "啊哈哈！這樣不是挺好的嗎？感覺好像久違地回到平常的萬魔殿了！"
10055140-151 = "……也是啦，總比垂頭喪氣要來得好。"
10055140-152 = "本大人知道了！這傢伙是鯊魚！#n雖然肉體是寄居蟹，氣魄卻不輸給鯊魚！"
10055140-153 = "從現在起，你就是「虎鯊丸」！"
10055140-154 = "你將成為寄居蟹的頂點──不，是超越頂點，成為甲殼類最強的冠軍！"
10055140-155 = ""
10055140-156 = ""
10055140-157 = "唔嘿～"
