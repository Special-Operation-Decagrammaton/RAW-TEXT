[translation]
1601205-1 = "따스함을 주세요."
1601205-2 = "샬레 집무실"
1601205-3 = "그래서, 쳐들어왔어."
1601205-4 = "[s] \"무서워…… 여고생 무서워……\""
1601205-5 = "뭐, 뭘 무서워하고 있는 거야! 선생님과 나 사이잖아!"
1601205-6 = "아무튼 말이지. 이대로 연휴를 끝내 버리는 건 너무 아까운 짓이야."
1601205-7 = "그러니까, 선생님. 뭔가 좋은 생각 없어?"
1601205-8 = "[s1] \"모처럼 준코가 찾아와 줬으니 말이지……\"\n[s2] \"미식으로 연휴를 마무리하는 것도 나쁘지 않을지도.\""
1601205-11 = "그건 또 무슨 소리야! 내가 무슨 24시간 먹을 것만 생각하는 사람 같잖아!"
1601205-12 = "[s] \"아니었어?!\""
1601205-13 = "그럴 리 없잖아! 죽여버린다?!"
1601205-14 = "[s] \"무서워…… 여고생 무서워……\""
1601205-22 = "일단 대책 없이 밖으로 나오기는 했는데……"
1601205-23 = "와아, 아직 크리스마스 트리가 남아 있네."
1601205-24 = "[s] \"설치하고 치우는 것도 큰일이니까.\""
1601205-26 = "하긴, 축제는 언제나 뒷정리가 큰일이지."
1601205-27 = "생각해 보면, 새해와 크리스마스는 그다지 많이 떨어져 있지 않기도 하고."
1601205-28 = "응? 선생님은 봄까지 크리스마스 트리를 방치한 적도 있었다고?"
1601205-29 = "……좀 정리하고 살아…… 너무 게으른 거 아냐?"
1601205-33 = "간밤에 내린 눈이 아직 녹지 않았네……"
1601205-34 = "새로 쌓인 눈을 보면 발자국을 남기고 싶어진단 말이지. 선생님은 어때?"
1601205-35 = "뭐? 그대로 벌렁 드러누워서 팔다리를 마구 휘젓고 싶어진다고?"
1601205-36 = "선생님이 무슨 애들이야……? 어른은 때로 애들이 되고 싶어지는 법이라고……?"
1601205-37 = "선생님은 가끔 알다가도 모를 말을 한단 말이지. 하아……"
1601205-73 = "사람들이 많네…… 전부 우리 같은 사람들일까?"
1601205-74 = "그렇다면 조금 재미있네. 다들 연휴가 끝나는 건 아쉬운 거구나."
1601205-75 = "응? 어쩌면 한 해가 끝나고 시작되는 것 자체가 아쉬운 건지도 모르겠다고?"
1601205-76 = "그러네…… 듣고 보니 그럴지도. 이 시기는 여러 가지로 복잡하구나."
1601205-77 = "(꼬르르르르륵)"
1601205-78 = "(준코의 배가 성대하게 꼬르륵 소리를 냈다.)"
1601205-79 = "……"
1601205-80 = "[s] \"……\""
1601205-81 = "………"
1601205-82 = "[s] \"………\""
1601205-83 = "아, 아, 아, 아니야! 아니라고!"
1601205-84 = "그런 거 아니야! 어…… 맞긴 한데, 아무튼 아니야! 알았어? 그렇다면 그런 줄 알아!"
1601205-85 = "[s3] \"하지만 준코 쨔~앙.\"\n[s4] \"조금 전부터 먹을 것에만 시선이 가고 있었잖아~?\""
1601205-88 = "다, 다, 다, 닥쳐어어어어!"
1601205-96 = "(얻어맞았다.)"
1601205-97 = "(억울해……)"
1601205-99 = "[ns] \"자, 먹어 둬.\""
1601205-100 = "뭐야, 이거? 오시루코……?"
1601205-101 = "그렇네. 지금은 딱 좋을지도."
1601205-102 = "고마워, 선생님. 잘 먹을게."
1601205-105 = "[wa:80]― 자, [wa:500]선생님. [wa:900]하나 줄게."
1601205-108 = "[wa:600]― 왜 그렇게 놀라는 거야!"
1601205-110 = "― 어, [wa:550]어쩌다 많이 들어가 있던 것뿐이야!"
1601205-113 = "[wa:1000]― 이거,[wa:200]"
1601205-115 = "― 선생님이 사준 거기도 하고……"
1601205-118 = "― 거기에 [wa:800]오늘 하루 종일……"
1601205-121 = "[wa:770]― (생각해 보면, [wa:1200]오늘은 하루 종일 선생님과……)"
1601205-123 = "― (나, [wa:600]난 대체, [wa:900]뭘 생각하고 있는 거야!)"
1601205-126 = "― 정말! [wa:1000]내가 주겠다고 했으니까"
1601205-128 = "[wa:300]― 아무래도 좋잖아!"
1601205-131 = "하아…… 피곤하다. 여러 가지 의미로."
1601205-132 = "뭐야, 자기도 피곤하다고 주장할 셈이야?"
1601205-133 = "어른이잖아. 좀 더 제대로 된 모습을 보여 보라고."
1601205-134 = "벌써 이런 시간이구나…… 그런데, 왜 사람들은 돌아가지 않는 거야."
1601205-135 = "우리도 마찬가지 아니냐고? 음…… 뭐, 틀린 말은 아니긴 한데……"
1601205-136 = "[s] \"그러면, 앞으로도 잘 부탁해.\""
1601205-137 = "뭐, 뭐야! 갑자기? 여기서 새해 인사?!"
1601205-138 = "아니…… 그, 싫은 건 아닌데……"
1601205-139 = "우으…… 분위기나 시기 같은 걸로 태클을 걸려고 해도 안 되겠네. 어쩔 수 없지."
1601205-143 = "나도, 잘 부탁해. 선생님."
