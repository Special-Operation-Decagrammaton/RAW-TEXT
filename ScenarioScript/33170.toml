[translation]
33170-1 = "제17화;증오의 정체"
33170-3 = "비켜라, 1학년. 지금 무슨 상황인지도 몰라?"
33170-4 = "계엄령에다가 전쟁 직전이라고!!"
33170-5 = "아…… 아으…… 나, 난…… 저기……."
33170-7 = "비켜!!"
33170-12 = "……아, 안돼!"
33170-13 = "나, 난…… 바보라서 지금 무슨 일이 벌어지고 있는지도 잘 모르지만…… 그치만……."
33170-14 = "이, 이건 아니야! 아닌 건 아닌 거야!"
33170-19 = "비키지 않으면……."
33170-20 = "자, 잠깐만…… 이 아이 어디선가……."
33170-21 = "어, 어디였지? 뭔가……."
33170-25 = "[ns] \"코하루는 내 담당의 보충수업부원이야.\""
33170-27 = "서, 선생님?!"
33170-28 = "……."
33170-30 = "샤, 샬레의 선생님?!"
33170-31 = "서, 설마…… 의식불명에 중상이라고 하지 않았어……?"
33170-32 = "서, 선생님이라니……."
33170-33 = "[s] \"부탁이니까, 폭력은 그만둬 줘.\""
33170-34 = "그, 그건……."
33170-35 = "지, 지금은……."
33170-36 = "도, 돌아가자. 저 선생님의 표정을 봐…… 이건 좋지 않아……"
33170-37 = "가, 가자……."
33170-42 = "서, 선생님…… 선생님……."
33170-43 = "[s] \"코하루는 멋있네. 진짜 정의실현부의 엘리트야.\""
33170-44 = "선생님……."
33170-49 = "……."
33170-50 = "선생……님……."
33170-51 = "[s] \"괜찮아? 미카?\""
33170-52 = "……어. 저기……."
33170-53 = "그, 그러니까……. 어, 오, 오랜만이지? 응."
33170-54 = "[s] \"미카, 어째서……?\""
33170-55 = "어? 뭐, 그…… 그건……."
33170-56 = "응…… 나, 나는 게헨나가 싫기 때문에…… 지금이라면 정말 절호의 기회인데……."
33170-57 = "그런데…… 나는 어째서……."
33170-58 = "……나, 나도 잘 모르겠어. 하하. 어째서지?"
33170-59 = "어, 어라? 자, 잠깐만? 기다려 봐……."
33170-60 = "나는……."
33170-62 = "미카……."
33170-63 = "당신이라면 누구보다 앞장서서 자신의 그 증오를 드러낼 거라고 생각했는데……."
33170-64 = "……. 어째서 당신은……."
33170-66 = "미카 씨. 아리우스 학원과 화해하자니, 그건 무슨 의도인 거죠?"
33170-67 = "응? 의도라고 하면……."
33170-68 = "……. 나기사는 거기에 어떤 정치적 이득이 있는지를 물어보는 겁니다. 미카."
33170-69 = "그야, 거기도…… 원래는 트리니티 학원의 한 분파였잖아. 응. 예전의 이야기지만."
33170-70 = "어떻게든 그쪽의 자치구에 찾아가서 화해를 요청해보는 거야! 과거의 티파티가 그랬던 것처럼!"
33170-71 = "……."
33170-72 = "……."
33170-73 = "어라, 이 흐름은…… 나 혼자 바보가 되는 분위기……?"
33170-74 = "나쁘지 않은 계획 아냐? 내가 호스트였다면 당장 했을 거야!"
33170-75 = "……. 일단 그쪽에서 응해줄지부터 고려해야 합니다. 미카 씨. 게다가 아리우스 자치구의 위치도 모르잖아요."
33170-76 = "저는 그것보다는, 미카. 당신의 의도가 궁금하네요. 아리우스를 흡수해서 더 강력해진 트리니티로 무엇을 할 셈인 거죠? 전쟁인가요?"
33170-77 = "응? 하하하, 그것도 재미있겠네."
33170-78 = "그 기회에 게헨나라도 쓸어버릴까? 걔들, 기분 나쁘잖아."
33170-79 = "……."
33170-80 = "……뭐야, 세이아 쨩. 그 표정은."
33170-82 = "당신은…… 제멋대로에다가 별로 생각도 없고, 충동적이고, 욕심도 많은 주제에 자기 파괴적이었죠……."
33170-83 = "저는 그런 당신이 싫었던 걸지도 몰라요."
33170-86 = "……세이아 쨩이 있는 곳은 여기야."
33170-87 = "세이아 쨩은 병원에 장기요양이라도 보내놓고, 호스트 자리를 내가 가지는 거야. 응."
33170-88 = "그러니까, 잘 부탁해."
33170-92 = "이 정도의 침투 작전은 <스쿼드>에게 맡길 겁니다."
33170-93 = "응? 스쿼드?"
33170-94 = "그렇게 알고 계시길."
33170-99 = "(응……? 세이아 쨩이…… 죽……었다고?)"
33170-100 = "(……어라? 어째서?)"
33170-101 = "(뭐야, 어째서? 뭐가 어떻게 된 거야? 어쩌다가……?)"
33170-102 = "(바보야? 나는 그냥 적당히…….)"
33170-103 = "(……어, 어째서였지?)"
33170-104 = "(나, 어째서 세이아 쨩을 습격하라고 지시했더라……?)"
33170-105 = "(세이아 쨩이 없어지면……. 어…… 어째서였더라……?)"
33170-106 = "(…….)"
33170-107 = "(……아아. 그래. 맞아, 나, 호스트가 되려고 했었지.)"
33170-108 = "(응, 게헨나가 너무 싫었으니까. 나기 쨩도 조약이니 뭐니 하는 이상한 짓을 하려고 하고.)"
33170-109 = "(그딴 짓을 대체 왜 하는 거야? 바보 아냐? 게헨나와 평화 조약이라고? 절대, 절대로 용납할 수 없어.)"
33170-110 = "(세이아 쨩, 미래를 본다느니 잘난 척하더니 결국 자기 앞가림도 못하고, 응. 이 정도는 대비했어야 하는 거 아냐?)"
33170-111 = "(그렇게 몸이 약한 주제에 티파티에 있었던 것부터가 잘못이고. 저번에도 더러운 걸 보는 듯한 표정으로 날 쳐다보기나 하고…….)"
33170-112 = "(그러니까…… 그러니까…….)"
33170-113 = "(……게헨나 녀석들을 치워버리기 위해선, 이 정도 희생은 어쩔 수 없는 일이었어.)"
33170-114 = "(맞아. 그랬지. 그랬던 거야.)"
33170-116 = "나, 나는…… 그게……."
33170-117 = "……."
33170-118 = "미안해. 세이아 쨩…… 그러려고 했던 건 아니었어……."
33170-119 = "나도 이게 왜 이렇게 된 건지 모르겠어……."
33170-120 = "미안해……. 미안해……."
33170-121 = "이런 바보라서 미안해……."
33170-122 = "[s] \"미카…….\""
33170-123 = "선생님……, 세이아 쨩을 만나고 싶어……."
33170-124 = "나기 쨩을 다시 만나고 싶어……."
33170-125 = "그럴 수만 있다면……."
33170-128 = "……."
33170-129 = "그랬나요. 미카. 당신은…… 사실은……. 그저……."
33170-130 = "그저, 적당한 이유가 필요했던 건가요……."
33170-131 = "당신은 그런 피상적인 것을 자신의 것이라고 스스로를 합리화했던 거군요."
33170-132 = "이 어찌나 한심하고 바보같은 행동인가요……. 미카……."
33170-134 = "……."
33170-135 = "저는 당신이 어떤 사람인지, 어떤 생각을 하는지 알려고 노력하는 대신…… 이미 당신이란 사람을 알고 있다고 생각했습니다."
33170-136 = "……그러네요."
33170-137 = "저 역시 당신에 대해서 아무것도 모르고 있었던 것이었군요."
33170-138 = "……정신을 차려보니 당신도 저처럼 잘못된 이야기의 한 가운데에 놓여 있었던 거군요."
33170-139 = "살인…… 죽음…… 배신…… 전쟁……."
33170-140 = "당신 같은 소녀가 몸담기엔 너무나 이상한 이야기였던 것이었네요."
33170-141 = "미카……."
33170-142 = "당신도 줄곧 고통받고 있었군요."
33170-143 = "……당신을 용서하겠습니다."
33170-144 = "아니, 어쩌면 저 또한 용서를 구해야 할지도 몰라요."
33170-145 = "우리들은…… 만나서 다시 한번 그 모든 것들을 서로에게 전하지 않으면 안 되겠네요……."
33170-147 = "[ns] \"물론이야. 맡겨줘. 미카.\""
33170-153 = "서, 선생님이다……."
33170-154 = "선생님……."
33170-155 = "선생님……."
33170-156 = "[s] \"모두 모여줘서 고마워.\""
33170-160 = "선생님……."
33170-161 = "선생님……."
33170-162 = "으, 응……!"
33170-164 = "[ns] \"모두들 기다려줘서 고마워.\""
33170-166 = "[ns] \"이제 내게 맡겨줘.\""
33170-169 = "다음화;흔들리지 않고"
