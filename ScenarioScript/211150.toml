[translation]
211150-1 = "ตอนที่ 15;มายูมิ"
211150-3 = "(ระหว่างที่คุณครูเดินผ่านบริเวณใกล้ๆ จู่ๆ ก็นึกถึงกิจกรรมของคณะกรรมการฟื้นฟูขึ้นมา)"
211150-4 = ""
211150-7 = "[ns] \"ช่างเป็นภาพที่น่าทึ่งจริงๆ เลย...\""
211150-8 = "(ระหว่างที่คุณครูกำลังสัมผัสได้ว่าสัญชาตญาณทำลายล้างของนักเรียนเกเฮนน่านั้นรุนแรงเพียงใด...)"
211150-9 = ""
211150-13 = "ฮู่ว..."
211150-14 = ""
211150-18 = "[ns] \"เด็กคนนั้นคือ...?\""
211150-21 = ""
211150-22 = "อันนี้เท่านี้ก็น่าจะพอแล้ว..."
211150-23 = ""
211150-25 = ""
211150-26 = "ถังเหล็กตรงนี้ใช้ต่อไม่ได้แล้วสินะ... คงต้องไปหามาเพิ่มอีกสักสองสามใบ"
211150-27 = "ต้องเปลี่ยนเป้ายิงเป็นอันใหม่ไว้ด้วย"
211150-28 = ""
211150-30 = ""
211150-31 = "เอ๋? คุณครู?"
211150-32 = "ว้าว!! มาทำอะไรถึงที่นี่เหรอ? หรือว่าคุณครูเองก็อยากมาอาละวาดเหมือนกัน?"
211150-33 = "[s1] \"ไม่ใช่หรอก... ว่าแต่มายูมิมาคนเดียวเหรอ?\"\n[s2] \"มายูมิมาเก็บกวาดที่นี่อยู่คนเดียวเหรอ?\""
211150-36 = "อ้อ อืม! ใช่"
211150-37 = "<ทริกเกอร์ แฮปปี้ โซน> ไม่ธรรมดาเลยใช่มั้ยล่ะ! วันวันหนึ่งมีนักเรียนแวะมาใช้บริการเยอะเลย"
211150-38 = "ทั้งยิง ระเบิด ขุดค้น ขว้างปา... วุ่นวายสุดๆ ไปเลย!"
211150-39 = "พวกเราทำสำเร็จจริงๆ! ฮ่าฮ่า! ทุกคนชอบกันสุดๆ เลย!"
211150-40 = "แต่ก็เพราะอย่างนั้น มันก็เลยพังเร็วด้วย"
211150-41 = "ไม่ทันข้ามวันก็เละเทะไปหมดแล้ว..."
211150-42 = "ถึงจะฟังดูตลก แต่ถ้าปล่อยให้อยู่ในสภาพพังๆ แบบนี้ ทุกคนจะไม่ค่อยชอบน่ะ"
211150-43 = "[s] \"ที่นี่สร้างมาเพื่อให้ทำลายอยู่แล้วไม่ใช่เหรอ?\""
211150-44 = "ก็จริง แต่ใจคนเรามันซับซ้อนนี่นา"
211150-45 = "เวลาจะยิงอะไรสักอย่าง คนเราก็ไม่อยากยิงใส่สถานที่ที่เละเทะอยู่แล้วหรอก"
211150-46 = "ต้องให้ดูสะอาดเอี่ยมเหมือนของใหม่ ถึงจะรู้สึกสนุกตอนทุบทำลาย หรือได้ความสะใจจากการพัง#nข้าวของน่ะ! ว่ามั้ย?"
211150-47 = "[s3] \"ยะ... อย่างนั้นเหรอ...?\"\n[s4] \"ก็น่าจะจริงนะ...\""
211150-50 = "ฮุฮุ ใช่มั้ยล่ะ?"
211150-51 = "เพราะงั้นก็เลยต้องคอยรักษาลานนี้ให้สะอาดอยู่เสมอ"
211150-52 = "นักเรียนจะได้แวะมาที่นี่กันต่อยังไงล่ะ"
211150-53 = "[s] \"ก็เลยมาเก็บกวาดลานนี้อยู่คนเดียวสินะ\""
211150-54 = "เพื่อนคนอื่นๆ ก็ช่วยเหมือนกัน แต่คนที่มาบ่อยที่สุดคือฉันนี่แหละ!"
211150-55 = "พอคิดว่าไหนๆ ก็นึกขึ้นมาแล้ว งั้นก็รีบจัดการให้เสร็จเลยดีกว่า~ เท้ามันก็ขยับไปก่อนแล้ว#nอย่างน้อยเรื่องความไวในการลงมือน่ะ ฉันก็ไม่เป็นรองใครนะ!"
211150-56 = "[s] \"ครูก็จะช่วยอีกแรงนะ!\""
211150-57 = "เอ๋ คุณครูเหรอ?"
211150-58 = "เอ่อ... ถ้าจะช่วย ฉันก็ไม่ปฏิเสธหรอก แต่งานนี้หนักเอาเรื่องเลยนะ?"
211150-59 = ""
211150-64 = ""
211150-65 = "..."
211150-66 = "ฮิฮิ ดีเลย! ถ้าทำด้วยกันก็น่าจะเสร็จเร็วขึ้นนะ"
211150-67 = "ขอบคุณนะ คุณครู!!"
211150-73 = "(หลังจากนั้น คุณครูกับมายูมิก็ช่วยกันเก็บกวาดลานและซ่อมแซมอุปกรณ์กันอยู่นาน)"
211150-74 = "(เป็นงานหนักกว่าที่คิด กว่าจะจัดการเสร็จก็ใช้เวลาไปนานพอสมควร)"
211150-77 = "[ns] \"เสร็จแล้ว~!\""
211150-78 = ""
211150-79 = "ว้าว! พอคุณครูมาช่วย ก็เสร็จเร็วมากเลย! ขอบคุณนะ!"
211150-80 = "คุณครูนี่พึ่งพาได้มากเลยนะ! จริงๆ เลย!"
211150-81 = "ถึงตอนนี้จะสะอาดเอี่ยม แต่เดี๋ยวก็คงกลับมาเละเทะอีก"
211150-82 = "ถึงตอนนั้นค่อยเก็บกวาดใหม่ก็ได้!"
211150-83 = "อยากให้ทุกคนมาใช้ที่นี่กันให้เต็มที่เลย~ ฮิฮิ"
211150-84 = ""
211150-86 = ""
211150-87 = "หือ? เหตุผลที่ฉันทำถึงขนาดนี้น่ะเหรอ?"
211150-88 = "ก็เพราะ..."
211150-89 = "เพื่อทำให้เกเฮนน่ายิ่งใหญ่ไงล่ะ!!"
211150-90 = "คุณครูรู้ใช่มั้ยว่าสิ่งที่พวกเราทำมาไม่ได้สูญเปล่า?"
211150-91 = "ทั้งเหตุระเบิด การยิงกัน เหตุการณ์สารพัดที่เคยเกิดขึ้นในโรงเรียนทุกวัน ลดลงอย่างเห็นได้ชัดเลยนะ"
211150-92 = "ตอนนี้ทุกคนก็เริ่มคุ้นชินกับการเข้าแถวแล้ว แถมยังไม่จุดทุ่นระเบิดเคลย์มอร์กลางสนามกันอีกด้วย"
211150-93 = "สถาบันของนักเรียนตัวปัญหา สถาบันของพวกจอมก่อเรื่อง สถาบันเกเฮนน่าที่เคยมีแต่ความโกลาหล กำลังค่อยๆ เปลี่ยนแปลงไป"
211150-94 = "นี่คือผลจากความพยายามของพวกเรา! เกเฮนน่ากำลังกลับมายิ่งใหญ่อีกครั้ง!"
211150-95 = "[s] \"มายูมิรักเกเฮนน่ามากจริงๆ สินะ\""
211150-96 = "อื้ม!! แน่นอนอยู่แล้ว!!"
211150-97 = "นักเรียนคิโวทอสส่วนใหญ่ก็คงรักโรงเรียนของตัวเองกันอยู่แล้ว..."
211150-98 = "แต่ในบรรดาโรงเรียนเหล่านั้น เกเฮนน่าน่ะเป็นสถานที่ที่เจ๋งมากๆๆ เลยนี่นา!!"
211150-99 = "แน่นอนว่าที่ผ่านมาอาจจะซบเซาไปบ้าง..."
211150-100 = "แต่ต่อจากนี้จะต้องดีขึ้นแน่นอนเลยละ"
211150-101 = "[s] \"อย่างที่มายูมิกำลังทำอยู่ตอนนี้ไง\""
211150-102 = "ฮิฮิ... ใช่แล้ว"
211150-103 = "คุณครู ช่วงนี้ทุกๆ วันของฉันสนุกมากเลย"
211150-104 = "สิ่งที่เคยคิดว่าเป็นเรื่องธรรมดามาจนถึงเมื่อวาน วันนี้ฉันได้ลองคิดว่าทำไมมันถึงเป็นเรื่องธรรมดา แล้วพรุ่งนี้ก็เปลี่ยนมันให้กลายเป็นสิ่งที่ไม่ใช่เรื่องธรรมดาอีกต่อไป วันเวลาแบบนี้สนุกมากเลย"
211150-105 = "เพราะที่ผ่านมา สิ่งต่างๆ ที่ประกอบกันเป็นเกเฮนน่าไม่เคยมีสิ่งไหนที่มาจากการเลือกของ 'พวกเรา' เลย"
211150-106 = "แต่ตอนนี้ การเลือกของพวกเรากำลังค่อยๆ เปลี่ยนแปลงเกเฮนน่าอยู่#nรู้มั้ยว่านี่เป็นเรื่องที่ยอดเยี่ยมแค่ไหน?"
211150-107 = "เพราะงั้นฉันต้องทุ่มให้สุดแรงเลย!"
211150-108 = "โดยเฉพาะถ้ามีคุณครูช่วยเหมือนวันนี้ พวกเราก็ทำได้ทุกอย่าง อื้ม! แน่นอนเลย!!"
211150-109 = "[s] \"อื้อ ต่อจากนี้ก็ฝากด้วยนะ มายูมิ\""
211150-110 = "ฮิฮิ ค่า! ฝากด้วยนะคะ คุณครู!"
211150-111 = "ทำให้เกเฮนน่ายิ่งใหญ่อีกครั้ง!!"
211150-113 = "(มายูมิพยายามอย่างสุดความสามารถด้วยรอยยิ้มอันสดใสอยู่เสมอ)"
211150-114 = "(คุณครูหวังว่ารอยยิ้มของเด็กคนนี้จะคงอยู่ต่อไป)"
211150-115 = ""
211150-120 = ""
211150-121 = "คิกคิกคิก... วันนี้มีเรื่องอะไรอีกล่ะ อิการาชิ โชโกะ"
211150-122 = "ซ่อมบำรุงห้องกระจายเสียงเสร็จเรียบร้อยแล้วเหรอ?"
211150-123 = ""
211150-125 = ""
211150-127 = "ค่ะ และยังมีข่าวที่ท่านประธานมาโคโตะน่าจะถูกใจด้วยค่ะ"
211150-128 = "โอ้?"
211150-129 = "นอกจากจะตรวจสอบอุปกรณ์ทั้งหมดแล้ว พวกฉันยังติดตั้งอุปกรณ์เสียงรุ่นใหม่ไปทั่วทุกซอกทุกมุม#nของโรงเรียนเกเฮนน่า จนไม่มีพื้นที่ไหนที่สัญญาณกระจายเสียงไปไม่ถึงแล้วค่ะ"
211150-130 = "คิกคิกคิก ยอดเยี่ยม!"
211150-131 = "ขยายโครงสร้างพื้นฐานได้โดยไม่ใช้งบของแพนเดโมเนียม โซไซตี้ นี่สินะที่เรียกว่าไม่ต้องลงแรง#nก็ได้ผลประโยชน์!"
211150-133 = "พูดแบบนี้ตรงหน้าคนที่ฟังอยู่ มันแรงไปแล้วนะคะ"
211150-135 = "ความใจกล้าเช่นนั้นละค่ะ คือความองอาจสมกับเป็นผู้ที่ยืนอยู่บนจุดสูงสุดของเกเฮนน่า"
211150-136 = "คิกคิก! รู้เรื่องดีเลยนี่! อิโรฮะ เอาความใจกว้างเช่นนี้เป็นแบบอย่างเข้านะ!"
211150-138 = "ค่า ค่า"
211150-140 = "ในโอกาสนี้ ฉันมีข้อเสนออยากเรียนต่อท่านประธานมาโคโตะค่ะ"
211150-141 = "อีกไม่นานการกระจายเสียงก็จะกลับมาเริ่มอีกครั้ง เราคงปล่อยให้ช่วงเวลาอันควรค่าแก่การจารึกนี้#nผ่านไปเฉยๆ ไม่ได้หรอกใช่มั้ยคะ?"
211150-142 = ""
211150-144 = ""
211150-145 = "ดูเหมือนจะมีความคิดอะไรอยู่สินะ ว่ามาสิ"
211150-146 = "ฉันอยากเสนอให้ท่านประธานมาโคโตะกล่าวปราศรัยพิเศษต่อทั่วทั้งโรงเรียนเกเฮนน่าค่ะ"
211150-147 = "สำหรับคำปราศรัยเฉลิมฉลองเกเฮนน่าโฉมใหม่ ไม่มีช่วงเวลาไหนเหมาะสมกว่านี้อีกแล้วค่ะ"
211150-148 = ""
211150-150 = ""
211150-151 = ""
211150-152 = "คิกคิก ดีเลย! นี่แหละช่วงเวลาที่มีไว้เพื่อเราโดยแท้!"
211150-154 = "ท่านฮานุมะ มาโคโตะผู้นี้จะกล่าวคำปราศรัยอันเลื่องชื่อที่ต้องจารึกไว้ในประวัติศาสตร์ และนำยุคฟื้นฟูความรุ่งเรืองมาสู่แพนเดโมเนียม โซไซตี้เอง!"
211150-156 = "มาโคโตะจัง ไฟลุกโชนเลยนะ"
211150-157 = "ว้าว! นิตยสารฉบับสัปดาห์หน้าก็ไม่ต้องห่วงแล้วค่ะ! รู้สึกว่าจะมีสกู๊ปพิเศษเต็มไปหมดเลย!"
211150-159 = "อิบูกิก็จะตั้งตารอฟังคำปราศรัยของรุ่นพี่มาโคโตะเหมือนกันนะ~!"
211150-160 = ""
211150-162 = ""
211150-164 = ""
211150-165 = ""
211150-166 = "ค่ะ ทำให้เกเฮนน่ายิ่งใหญ่อีกครั้ง"
211150-170 = "ตอนต่อไป;สิ่งที่จะเกิด ย่อมเกิดขึ้น"
