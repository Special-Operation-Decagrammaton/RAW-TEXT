[translation]
211150-1 = "第15話;真由美"
211150-3 = "（經過附近時，突然想起了再興委員會的活動）"
211150-4 = ""
211150-7 = "[ns] 「重新看一次，還真是驚人的光景……」"
211150-8 = "（正切身感受到格黑娜學生的破壞本能有多強烈……）"
211150-9 = ""
211150-13 = "……呼。"
211150-14 = ""
211150-18 = "[ns] 「那孩子是……？」"
211150-21 = ""
211150-22 = "這個這樣就可以了……"
211150-23 = ""
211150-25 = ""
211150-26 = "這邊的汽油桶不能再用了……得再去弄幾個來。"
211150-27 = "標靶紙也得換新的才行。"
211150-28 = ""
211150-30 = ""
211150-31 = "咦？老師？"
211150-32 = "哇～！！怎麼跑到這裡來了？老師也是想來大鬧一場嗎？"
211150-33 = "[s1] 「不是那樣的……」\n[s2] 「真由美一個人在打掃這裡嗎？」"
211150-36 = "啊，嗯！沒錯。"
211150-37 = "很厲害吧，「Trigger Happy Zone」！#n這裡每天都有很多學生來呢。"
211150-38 = "射擊、引爆、挖掘、投擲……簡直亂成一團！"
211150-39 = "我們果然成功了！哈哈！#n大家都超喜歡的嘛！"
211150-40 = "不過壞掉的速度也一樣快。"
211150-41 = "撐不到一天就變得亂七八糟了……"
211150-42 = "說起來有點好笑，要是一直放著壞掉不管，大家就不太喜歡了。"
211150-43 = "[s] 「這裡不是本來就是蓋來讓人破壞的嗎？」"
211150-44 = "是沒錯啦，但人心很複雜嘛。"
211150-45 = "想射擊的時候，就不會想朝著已經破破爛爛的地方打。"
211150-46 = "就是要又新又乾淨才會有破壞的樂趣，或者說破壞的快感啊！不是嗎？"
211150-47 = "[s3] 「是，是這樣嗎……？」\n[s4] 「總覺得好像也有道理……」"
211150-50 = "呵呵，對吧？"
211150-51 = "所以這片空地得一直保持乾淨才行。"
211150-52 = "這樣學生們才會繼續來這裡。"
211150-53 = "[s] 「所以你才一個人在整理這片空地啊。」"
211150-54 = "其他人也會來幫忙，不過最常來的還是我！"
211150-55 = "只要一想到「順便處理掉吧～」，腳就已經先動起來了。#n我啊，就只有行動力沒話說！"
211150-56 = "[s] 「我也來幫忙！」"
211150-57 = "咦！？老師要幫忙？"
211150-58 = "呃……你要幫忙的話，我是不會客氣啦。#n不過這可是很辛苦的工作哦？"
211150-59 = ""
211150-64 = ""
211150-65 = "……"
211150-66 = "耶嘿嘿，好！一起做應該能更快結束。"
211150-67 = "謝謝你，老師！！"
211150-73 = "（就這樣和真由美一起整理並修繕了空地好一段時間）"
211150-74 = "（比想像中還要辛苦，過了相當久才終於完成）"
211150-77 = "[ns] 「結束了～！」"
211150-78 = ""
211150-79 = "哇！有老師幫忙，超快就結束了！謝謝你！"
211150-80 = "老師，你還真可靠耶！真的！"
211150-81 = "當然，就算現在整理得這麼乾淨，很快又會變得亂七八糟就是了。"
211150-82 = "到時候再整理就好了！"
211150-83 = "希望大家都能玩得開心～耶嘿嘿。"
211150-84 = ""
211150-86 = ""
211150-87 = "嗯？為什麼要做到這種地步？"
211150-88 = "那當然是……"
211150-89 = "為了讓格黑娜變得偉大啊！！"
211150-90 = "老師，你知道我們做的事沒有白費吧？"
211150-91 = "每天在校內發生的爆炸、槍戰，以及各種事件和事故都明顯減少了。"
211150-92 = "現在大家也已經習慣排隊，也不會在操場正中央引爆闊刀地雷了。"
211150-93 = "充滿問題學生和麻煩製造者，只有一片混亂的格黑娜學園正在逐漸改變。"
211150-94 = "這是我們努力的成果！#n格黑娜正在再次變得偉大！"
211150-95 = "[s] 「真由美真的很喜歡格黑娜呢。」"
211150-96 = "嗯！！那當然！！"
211150-97 = "奇普托斯的學生大部分應該都喜歡自己的學園……"
211150-98 = "但格黑娜在其中更是非常非常非常棒的地方！！"
211150-99 = "……當然，之前或許是有點不太順利啦。"
211150-100 = "但今後一定會變得更好的。"
211150-101 = "[s] 「就像真由美現在正在做的那樣。」"
211150-102 = "耶嘿嘿……沒錯。"
211150-103 = "老師，我最近每一天都過得好開心。"
211150-104 = "思考直到昨天都還理所當然的事，今天為什麼會理所當然，#n明天要再讓它變得不再理所當然……這樣的每一天都好開心。"
211150-105 = "因為至今構成格黑娜的一切之中，都沒有「我們」的選擇。"
211150-106 = "但現在我們的選擇正逐漸改變格黑娜。#n你知道這是一件多棒的事嗎？"
211150-107 = "所以得加把勁才行！"
211150-108 = "特別是像今天這樣有老師幫忙的話，我們什麼都做得到。#n嗯！一定是這樣！！"
211150-109 = "[s] 「嗯。今後也請多指教了，真由美。」"
211150-110 = "耶嘿嘿，好～！請多指教，老師！"
211150-111 = "讓格黑娜再次偉大！！"
211150-113 = "（真由美總是以開朗的模樣全力以赴）"
211150-114 = "（希望這孩子的笑容能一直持續下去）"
211150-115 = ""
211150-120 = ""
211150-121 = "嘰嘻嘻……今天又有什麼事，五十嵐翔子。"
211150-122 = "廣播室的整修都完成了嗎？"
211150-123 = ""
211150-125 = ""
211150-127 = "是的，還有一個真琴議長應該會喜歡的消息。"
211150-128 = "哦？"
211150-129 = "除了全面的設備檢查之外，#n還在格黑娜學園的每個角落裝設了新式音響設備，讓廣播無遠弗屆。"
211150-130 = "嘰嘻嘻，太棒了！"
211150-131 = "竟然不用萬魔殿的預算就擴充了基礎設施。#n這就是所謂的坐享其成啊。"
211150-133 = "當事人就在面前聽著，這樣說有點過分吧。"
211150-135 = "那份膽量正是站在格黑娜頂點之人的氣度吧。"
211150-136 = "嘻嘻！你很懂嘛！#n伊呂波，你也好好效法這種開放的心胸吧！"
211150-138 = "好好好。"
211150-140 = "既然如此，有件事想向真琴議長稟報。"
211150-141 = "廣播很快就要重新開始了，總不能就這樣讓這個具紀念意義的時刻白白流逝吧？"
211150-142 = ""
211150-144 = ""
211150-145 = "看來你有什麼想法啊。說來聽聽。"
211150-146 = "由真琴議長對整個格黑娜學園發表一場閃電演說，您覺得如何？"
211150-147 = "作為宣告新格黑娜的賀詞，沒有比這更適合的時機了。"
211150-148 = ""
211150-150 = ""
211150-151 = ""
211150-152 = "嘻嘻，好！這正是為本大人準備的時刻啊！"
211150-154 = "我羽沼真琴大人將以名留青史的演說，為萬魔殿開創中興盛世！"
211150-156 = "真琴醬幹勁十足呢。"
211150-157 = "哇！下週的新刊不用擔心了！#n感覺已經有滿滿的獨家題材了！"
211150-159 = "伊吹也很期待真琴前輩的演說～！"
211150-160 = ""
211150-162 = ""
211150-164 = ""
211150-165 = ""
211150-166 = "是的，讓格黑娜再次偉大。"
211150-170 = "下一話;該發生的事終究會發生"
