[translation]
211150-1 = "Episode 15;Mayumi"
211150-3 = "As I passed by the carnage, I couldn't help but wonder how the Heritage League was doing..."
211150-4 = ""
211150-7 = "[ns] \"What a sight...\""
211150-8 = "And, just as I was basking in the Gehenna students' destructive instincts..."
211150-9 = ""
211150-13 = "...*sigh*"
211150-14 = ""
211150-18 = "[ns] \"Is that...?\""
211150-21 = ""
211150-22 = "This is workable..."
211150-23 = ""
211150-25 = ""
211150-26 = "But these barrels are beyond repair... I'll have to pick up some more."
211150-27 = "And this target sheet is shredded. \"New sheets,\" added to the list..."
211150-28 = ""
211150-30 = ""
211150-31 = "Uh? Sensei?"
211150-32 = "Whoa! What brings you all the way here? Were you looking to let off a little...administratively-approved steam?"
211150-33 = "[s1] \"Not exactly...\"\n[s2] \"Have you been cleaning all by yourself, Mayumi?\""
211150-36 = "Ah, yeah! You're right."
211150-37 = "The Trigger-Happy Zone is serious business! Dozens of students visit every day."
211150-38 = "They shoot, blow things up, dig around, throw stuff, just VANDALIZE for no reason... It's absolute chaos!"
211150-39 = "But we did it! Haha! Everyone loves this place we built."
211150-40 = "But it also wears down quickly."
211150-41 = "Not a day goes by where it isn't turned into a total mess..."
211150-42 = "Ironically, the students don't like it if we leave it all messed up."
211150-43 = "[s] \"But wasn't it built to be destroyed in the first place?\""
211150-44 = "That's true, but people are complicated."
211150-45 = "They don't want to shoot at something that's already wrecked."
211150-46 = "There's a certain thrill in smashing and destroying something clean and pristine. Do you know what I mean?"
211150-47 = "[s3] \"I-I don't know...?\"\n[s4] \"But you may have a point...\""
211150-50 = "Fufu, right? It's the inherent drive to destruction."
211150-51 = "And that's why I'm out here. I have to make sure it's kept clean and orderly."
211150-52 = "After all, we want the students to keep returning..."
211150-53 = "[s] \"So that's why you've been cleaning this lot by yourself.\""
211150-54 = "The others help too! But yeah, I'm out here the most."
211150-55 = "Whenever I think \"I should do something,\" I just end up already in the middle of doing it. Ha, you know I'm a go-getter!"
211150-56 = "[s] \"I'll help too!\""
211150-57 = "Eh, you will?"
211150-58 = "Um... I won't refuse help, but this is pretty dirty work, you know?"
211150-59 = ""
211150-64 = ""
211150-65 = "..."
211150-66 = "Heehee, alrighty, then! We'll finish much faster if we work together."
211150-67 = "Thank you, Sensei!"
211150-73 = "I spent quite a while clearing and repairing the lot with Mayumi."
211150-74 = "The work was rougher than I expected, so it took a while to wrap up."
211150-77 = "[ns] \"It's finally done!\""
211150-78 = ""
211150-79 = "Yay! We finished that in a jiffy, all thanks to your help!"
211150-80 = "You're a real lifesaver, Sensei! I mean it!"
211150-81 = "While it's clean and tidy now, it'll probably end up in a total mess again tomorrow."
211150-82 = "But then we'll just clean it up again!"
211150-83 = "All I hope is that everyone's having a good time out here! Heehee."
211150-84 = ""
211150-86 = ""
211150-87 = "Hm? Why do I \"do all this\"?"
211150-88 = "Well..."
211150-89 = "It's to restore glory to Gehenna!"
211150-90 = "Sensei, you realize that we've made a REAL impact, right?"
211150-91 = "Campus explosions, shootings, and destructive incidents have dropped significantly."
211150-92 = "The students are accustomed to lining up here now, and no one just randomly blows up a claymore in the middle of the track field."
211150-93 = "The school of troublemakers, mischief makers, and chaos is fading away. Gehenna Academy is changing for the better!"
211150-94 = "And that's all because of our hard work! Gehenna is growing more glorious!"
211150-95 = "[s] \"You really do love Gehenna, Mayumi.\""
211150-96 = "Yeah! Of course I do!"
211150-97 = "Most students in Kivotos probably LIKE their school..."
211150-98 = "And that's fine, but Gehenna is absolutely amazing."
211150-99 = "...Of course, our progress may have been sluggish until recently."
211150-100 = "But I know it'll be better in the future. It'll be GLORIOUS."
211150-101 = "[s] \"Just like you are right now, Mayumi.\""
211150-102 = "Heehee... Yeah."
211150-103 = "Sensei, I've been enjoying every day lately."
211150-104 = "I find so much fun in reflecting on what I've been overlooking and working on improving it for tomorrow."
211150-105 = "Because up until now, \"our\" choices played no part in the greater Gehennan culture."
211150-106 = "But right now, our choices, our actions, are gradually reshaping Gehenna. Isn't this amazing?"
211150-107 = "That's why we need to give it our all!"
211150-108 = "I'm sure we can do anything, especially with your help. Just like today. Yeah, I'm positive!"
211150-109 = "[s] \"Right. I look forward to working with you more, Mayumi.\""
211150-110 = "Heehee, yes! Me too, Sensei!"
211150-111 = "Glory to Gehenna!!!"
211150-113 = "Mayumi always did her best and kept a cheerful attitude."
211150-114 = "I hoped that her smile would never fade."
211150-115 = ""
211150-120 = ""
211150-121 = "Kihehe... What is it this time, Igarashi Shouko?"
211150-122 = "Have you finished preparing the broadcasting room?"
211150-123 = ""
211150-125 = ""
211150-127 = "Indeed, I have. I also bring news that you might enjoy, Chairman Makoto."
211150-128 = "Hm?"
211150-129 = "We've not only inspected all the equipment, but we've also upgraded the academy's PA system. It's all very modern, and it ensures that the broadcast signal will reach every student."
211150-130 = "Kihehe, excellent!"
211150-131 = "You've acquired infrastructure without touching the Pandemonium Society's budget. Now THAT is what I call effective delegation of labor."
211150-133 = "It's rude to announce that right in front of them."
211150-135 = "Such bold directness can only come from someone who stands at the pinnacle of Gehenna."
211150-136 = "Kihehe! Perfect analysis! Iroha, take notes!"
211150-138 = "Right, sure."
211150-140 = "With that handled, I wanted to say a few words to you, Chairman Makoto."
211150-141 = "The broadcasts will resume soon, and surely we can't let this historic moment pass by, can we?"
211150-142 = ""
211150-144 = ""
211150-145 = "It sounds like you are on to something. Continue."
211150-146 = "Chairman Makoto, how do you feel about delivering a speech to the entirety of the student body?"
211150-147 = "There would be no better occasion to celebrate the new Gehenna. You could give an address congratulating yourself on your achievements."
211150-148 = ""
211150-150 = ""
211150-151 = ""
211150-152 = "Kihe, excellent! I shall rise to this moment!"
211150-154 = "I, Hanuma Makoto, will usher in the golden age of the Pandemonium Society with a historic, legendary speech!"
211150-156 = "Makoto's really fired up."
211150-157 = "Whoa! No sense worrying about next week's issue now! We got the hot scoop!"
211150-159 = "Ibuki is also excited for Makoto's speech!"
211150-160 = ""
211150-162 = ""
211150-164 = ""
211150-165 = ""
211150-166 = "Yes. Glory to Gehenna."
211150-170 = "Next Episode;What Is Meant to Happen Will Happen"
