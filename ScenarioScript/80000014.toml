[translation]
80000014-1 = "의도치 않은 선물"
80000014-2 = "샬레 업무관"
80000014-5 = "안녕하세요, 선생님. 좋은 아침입니다."
80000014-6 = "샬레에 오는 길에 기차가 연착되어서…… 조금 늦고 말았네요. 죄송합니다……."
80000014-7 = "[s] \"아니야. 5분밖에 늦지 않았는걸.\""
80000014-8 = "참, 오는 길에 역에서 이걸 샀는데요……."
80000014-13 = "선물용 초콜릿 세트입니다. 부디 맛있게 드셔 주세요."
80000014-14 = "[s] \"어째서 갑자기 초콜릿을……?\""
80000014-15 = "선생님께는 언제나 신세를 지고 있으니까요."
80000014-16 = "게다가 전에 말씀하시길, 요새는 잠을 아무리 자도 피로가 가시질 않는다고 하셨잖아요?"
80000014-17 = "초콜릿에 포함된 카페인과 테오브로민은 피로 회복에 효과가 있다고 하니, 틈이 날 때마다 하나씩 드셔 주세요."
80000014-18 = "사실은 어찌 된 일인지 역 앞에 초콜릿 세트가 엄청나게 진열되어 있기에 무심코 구입한 것이지만……"
80000014-19 = "……네? 바, 발렌타인 초콜릿이요?"
80000014-20 = "그렇네요. 생각해보니 오늘은 발렌타인 데이…… 그럼 제가 지금 드린 초콜릿은 발렌타인 초코……"
80000014-21 = "저, 저기 그러니까 이건 그런 감정으로 전달 드린 게 아니라……!"
80000014-22 = "아니, 선생님께 그런 감정이 없다고 하면 거짓말이겠지만…… 그게 아니라!"
80000014-23 = "오, 오늘은 절대로 그런 의미에서 전달 드린 게 아니니까요……!"
80000014-24 = "무, 물론 선생님께서 그런 의미로 받아들이셔도 하는 수 없지만…… 오히려 환영이지만……"
80000014-25 = "하으, 만약 동아리 사람들이 이 사실을 알게 된다면 어쩌죠……."
80000014-26 = "분명 \"헤에, 아야네는 얌전한 척하면서 아침 일찍부터 먼저 선수를 치는 그런 아이였구나~\" 하면서 저를 경멸 어린 시선으로 쳐다보기라도 한다면……"
80000014-27 = "무, 물론 선생님께서 비밀로 해주신다면…… 아니, 말씀하시고 싶으시면 하셔도 괜찮지만……."
80000014-29 = "(이후, 당황해 하는 아야네를 진정시킨 뒤, 느긋하게 초콜릿을 함께 먹었다.)"
