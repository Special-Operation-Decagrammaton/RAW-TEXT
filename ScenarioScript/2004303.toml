[translation]
2004303-1 = "새로운 시도"
2004303-2 = "새해라면 역시 새로운 오세치를 먹어야 하지 않을까?!"
2004303-3 = "[s] \"새로운 오세치라니 뭔가 이즈미답네!\""
2004303-4 = "그치?"
2004303-5 = "하지만, 선생님. 보통의 오세치는 역시, 뭔가 조금 아쉬운 거 있지."
2004303-6 = "오세치란 건 원래, 불을 쓰지 않는 조림 요리 위주로 하는 거잖아?"
2004303-7 = "물론 물론! 조림 요리도 맛있기는 하지만!"
2004303-8 = "그래도 역시 맛이 비슷해지는 부작용이 있단 말이야……."
2004303-9 = "그러니까 그건, 우리의 미식 모험과는 방향성이 다른 거라고 생각해!"
2004303-10 = "[s] \"어, 응. 그래. 우리 미식 모험 중이었지…….\""
2004303-11 = "맞아! 그거야!"
2004303-12 = "물론 남은 오세치 요리로, 나베나 카레라이스, 면요리 고명 등으로……."
2004303-13 = "재활용을 하면 다시 풍부한 맛을 느낄 수 있겠지만."
2004303-14 = "그건 사실 나중에 언제든 해도 되는 일이잖아?"
2004303-15 = "그래서 오늘은! 나만의 오세치 요리를 시도해 봤어!"
2004303-16 = "이른바 이즈미류 오세치 특선! 인 거지!"
2004303-17 = "[s] \"이즈미가 오세치를 직접 만들었다는 소리야?\""
2004303-21 = "그게, 처음에는 그러려고 했는데……."
2004303-22 = "역시 조금 무리였지 뭐야! 에헤헤!"
2004303-23 = "하지만 여기저기 잘 알아보니까 말이지?"
2004303-24 = "요청하는 대로 만들어 주는, [ruby=Made-to-order]메이드 투 오더[/ruby] 식당이라는 것이 있었지 뭐야!"
2004303-25 = "하루나도 자주 이용하곤 한대! 인터넷이란 정말 편리해!"
2004303-26 = "그래서 말이야? 거기에 부탁해서 나만의 오세치를 만들었거든?"
2004303-27 = "그러니까 가 보자, 선생님!"
2004303-32 = "[ns] \"이즈미? 이즈미?? 적어도 같이 가자~!\""
2004303-41 = "어때, 선생님? 분위기 좋지?"
2004303-42 = "오세치를 만드는 식당의 분위기와는, 조금 거리가 있는 것 같기도 하다고?"
2004303-43 = "그야 여기는, 미리 요청만 하면 오세치뿐만 아니라 뭐든 만들어 주는 식당인걸!"
2004303-48 = "시시도우 이즈미 씨 맞으시죠? 요청하신 <이즈미류 오세치 특선> 준비되었습니다."
2004303-49 = "조금만 기다리시면, 곧바로 가져다드리겠습니다!"
2004303-55 = "그러면, 마음껏 즐기시기 바랍니다. 좋은 식사 되십시오."
2004303-59 = "[ns] \"겉보기에는, 그럴듯한 오세치네?\""
2004303-63 = "그렇게 보여? 다행이야! 오세치는 먼저 눈으로 먹는다고도 하잖아?"
2004303-64 = "아무리 내가 나만의 오세치를 주문했다고 해도, 미관상으로는 예뻐야 오세치라고 할 수 있을 테니까!"
2004303-65 = "그러면 우선…… 여기, 검은콩조림부터 먹어 볼게!"
2004303-72 = "응! 신선해! 맛있어!"
2004303-73 = "어? 보기에는 평범한 검은콩조림으로 보인다고?"
2004303-74 = "에헤헤. 하지만 조금 달라. 왜냐하면 이건……."
2004303-75 = "콩과 식초와 카카오 99% 초콜릿으로 만든 콩조림이거든!"
2004303-79 = "[ns] \"카카오…… 99%? 어째서, 그런 걸……!\""
2004303-83 = "응? 그야 검은콩조림이잖아? 초콜릿 중에서 가장 검은 건 카카오 99%고. 당연한 거야!"
2004303-84 = "그러면 다음은…… 여기, 조린 새우! 이 새우는 말이지, 무려……."
2004303-85 = "간장과 설탕이 아니라, 절인 앤초비로 조린 새우거든!"
2004303-90 = "와! 짠맛과 감칠맛이 정말 인상적이네!"
2004303-91 = "홍백색 어묵 좋아해, 선생님? 나는 좋아해!"
2004303-92 = "그리고 이 어묵은 무려 딸기로 만들었어!"
2004303-93 = "[s] \"딸기?! 딸기 왜!?\""
2004303-97 = "그야 딸기는 분홍색이잖아. 당연한 거 아니야?"
2004303-98 = "응! 생선살 맛과 딸기 맛이 어우러져서 처음 맛보는 풍미가 나오고 있어!"
2004303-99 = "다음은 여기, 고구마 밤조림을 먹어 볼게."
2004303-104 = "스파이시한 생강 맛이 정말 화끈하네!"
2004303-105 = "왜 생강을 넣었냐고? 어…… 그야…… 고구마도 밤도, 생강도 모두 노란색이니까? 오세치는 조금 전에도 말했지만 눈으로 먼저 먹는 음식이잖아?"
2004303-106 = "선생님도 먹어 볼래? 연겨자를 넣고 졸인 연근조림도 있어. 이건 같은 '연'자 돌림이라서, 어울릴 것 같았거든."
2004303-107 = "그리고 이쪽은 절인 청어알인데……. 왠지 그래 보고 싶어서, 계피와 오징어젓, 그리고 블루치즈를 넣었어!"
2004303-108 = "[s] \"마음은 정말로 고마우니까, 거기까지만 받을게!\""
2004303-109 = "그래애……? 이렇게 독특한데……."
2004303-110 = "후식 하면 역시 포근하고 달콤한 음식이 좋을 거고……. 오세치에서 가장 포근한 건 계란말이라고 할 수 있겠지?"
2004303-111 = "그래서, 이즈미 류 계란말이에는 군소의 보라색 먹물과 아이스크림이 들어가 있어!"
2004303-112 = "[s] \"아이스크림은 알겠는데, 군소는 왜?!\""
2004303-113 = "봐, 선생님. 이 보라색과 노란색의 조화가 정말로–"
2004303-117 = "–그렇게까지, 예쁘지는 않구나. 생각대로 되지는 않았네. 응."
2004303-118 = "하지만 군소 먹물의 쓰고 비린 맛을, 아이스크림이 눌러 주면서……."
2004303-119 = "마치 달콤한 화과자와 쓴 말차를, 동시에 먹는 듯한 기분이 나지 않을까 했거든!"
2004303-121 = "(이즈미의 실험적인 오세치 시식은, 그 뒤로도 신나게 계속되었다…….)"
2004303-122 = "(……적어도 이즈미는, 진심으로 행복해 보였다…….)"
2004303-126 = "푸하! 잘 먹었다! 만족스러운 식사였어!"
2004303-127 = "오세치로도 이렇게 신선하고 다양한 경험을 할 수 있다니, 나 스스로도 놀랄 정도야!"
2004303-128 = "그런데…… 괜찮아, 선생님? 왠지 나 혼자만 신나게 즐긴 것 같아서, 미안해……."
2004303-129 = "우우우, 먹는 데 너무 몰두하다 보니, 선생님도 같이 즐겨야 한다는 걸 깜빡하고 말았어……."
2004303-130 = "[s1] \"아니야, 이즈미! 나는 괜찮으니까! 정말로 괜찮으니까!\"\n[s2] \"이즈미의 실험 정신! 칭찬해요!\""
2004303-133 = "그래애? 하지만 역시, 그래도……."
2004303-137 = "좋아, 선생님! 다음에는 반드시 내가 맛있는 걸 준비해 줄게!"
2004303-141 = "그러니까, 꼭 기대해 줘. 알았지?"
2004303-143 = "(설명하기 어려운 불안감이, 조금이나마 들지 않았다면 거짓말이었겠지만…….)"
2004303-144 = "(……적어도 이즈미의 미소는, 정말로 밝아 보였다…….)"
