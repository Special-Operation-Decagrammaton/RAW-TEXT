[translation]
10025105-2 = "RABBIT 1, 함미 구역 클리어."
10025105-3 = "RABBIT 2, 함수 구역 클리어."
10025105-4 = "R, RABBIT 4…… 함교 구역 클리어."
10025105-5 = "선내 모든 적대 인원의 무력화 및 위험 요소를 제거……"
10025105-6 = "……이것으로 작전을 종료합니다, 수고하셨습니다!"
10025105-11 = "뭐, 뭐야. 내가 나설 기회는 없는 거야?"
10025105-12 = "너무 늦었어, RABBIT 3."
10025105-13 = "적들이 너무 시시해서 몸을 풀기도 전에 끝나버린 느낌이야. 나도 뭔가 아쉬울 정도네……"
10025105-14 = "아쉬운 건 이쪽이라고! 선상 작전이라고 해서 부랴부랴 대함 미사일을 구해 왔는데, 쏴 보기도 전에 작전이 종료되다니……"
10025105-20 = "저기, RABBIT 2. 이 대함 미사일, 딱 한 발만 쏴 보면 안 될까?"
10025105-21 = "침몰시키는 데 딱 한 발이면 충분하니까……"
10025105-22 = "지금 무슨 소리를 하는 거야! 우리 아직도 이 배 위에 있거든?!"
10025105-28 = "……SRT 특수학원의 학생이라고?"
10025105-29 = "아, 네…… 그게 그러니까……"
10025105-30 = "……죄송합니다."
10025105-31 = "조사가 목적이었다지만 결과적으로는 여러분들을 속이게 되었네요."
10025105-32 = "아니, 그 건에 대해 원망을 하려던 게 아니었어. 그저……"
10025105-33 = "마을의 문제를 해결하는 데 외지인에게 손을 벌린 것 같아 면목이 없군."
10025105-37 = "……아뇨. 이는 야토우라 마을만의 문제가 아닙니다."
10025105-38 = "그게 무슨 소리지?"
10025105-39 = "이 마을도 결국은 키보토스의 일부이고, 이곳에서 일어난 문제는 키보토스의 모두가 함께 해결해야 하는 문제이기도 하니까요."
10025105-40 = "그러니 앞으로도 '키보토스의 문제'가 생기거든, 주저하지 마시고 저희 SRT를 찾아주세요."
10025105-41 = "저희가 언제든지 힘을 보태 드리겠습니다."
10025105-42 = "SRT 특수학원이라……."
10025105-43 = "……그래. 이 이름을 꼭 기억해 두지."
10025105-44 = "……네!"
10025105-50 = "그나저나 이 용의자의 신병 인도는……"
10025105-51 = "그건 저희 쪽에서 처리하겠습니다!"
10025105-52 = "이곳에서 일어난 범죄자의 신병 인도는 기본적으로 저희의 임무이기도 하고……"
10025105-53 = "다소 어폐가 될지도 모르겠지만, 모처럼 실적을 올릴 수 있을지도 모르니까요."
10025105-55 = "……그렇네요. 그럼 뒤는 잘 부탁드리겠습니다."
10025105-57 = "저, 저기 나는—"
10025105-64 = "……쿠마가이."
10025105-65 = "이 녀석은 데리고 가서 야토우라 마을의 방식으로 처리해."
10025105-67 = "자, 잠깐만요. 야토우라 마을의 방식이 도대체 뭔가요……?"
10025105-69 = "어, 그게 그러니까—"
10025105-70 = "알려줄 필요 없어. 저 녀석에게는 그런 정보조차도 과분하니까."
10025105-72 = "하, 하지만 최소한 제게 무슨 일이 벌어질지 정도는 알아야—"
10025105-78 = "바로 그거야. 네가 이 마을에 저질렀던 일이."
10025105-80 = "무슨 일을 당할지 어둠 속에서 상상하고 두려워하며 괴로워하도록 해."
10025105-85 = "가장 오래되고 강력한 공포는 무지에서 오는 법이니까."
