[translation]
1600320-1 = "특별한 동료들"
1600320-2 = "(트리니티에 도착한 뒤 스즈미에게 연락을 보냈다.)"
1600320-6 = "(얼마 지나지 않아, 저 멀리서 다가오는 스즈미의 모습이 보였다.)"
1600320-11 = "도착했습니다. 선생님, 설마 먼저 와 계실 줄은……."
1600320-12 = "……아."
1600320-20 = "……시, 실례했습니다. 선생님……."
1600320-21 = "[s1] \"응? 갑자기 당황했다?\"\n[s2] \"방금 뭔가 황급히 벗지 않았어?\""
1600320-24 = "아, 그, 그게……. 별 건 아니고……."
1600320-25 = "이, 이거였습니다."
1600320-32 = "이, 이건, 그……."
1600320-33 = "별 건 아니고, 순찰 시에 제가 곧 잘 쓰는 헤드폰입니다만……."
1600320-34 = "죄송합니다. 선생님 앞인데, 급하게 오느라 벗는 걸 잊어버렸습니다. 당연히 노래는 꺼 둔 상태였고 단지……."
1600320-35 = "……아, 아닙니다. 잡설이 길었군요. 어서 출발하시죠. 일정은 알려주셨으니 앞장서겠습니다."
1600320-36 = "이쪽으로……."
1600320-44 = "…………."
1600320-45 = "[s3] \"괜찮아? 스즈미……?\"\n[s4] \"아까부터 어딘가 불편해 보이는데.\""
1600320-51 = "네, 네!? 아, 그, 그건……."
1600320-52 = "음……."
1600320-53 = "죄송합니다. 괜한 소리를 안 하려던 게, 오히려 신경 쓰이게 만드신 것 같군요."
1600320-54 = "다른 건 아니고, 그……. 아까 전의 헤드폰 때문입니다만……."
1600320-55 = "사실……"
1600320-56 = "아무래도 선생님께 불필요한 인상을 드리지 않았을까 하는 걱정을……. 하고 있었습니다."
1600320-57 = "[s5] \"불필요한 인상?\"\n[s6] \"걱정하고 있었다고?\""
1600320-60 = "네. 아무래도 순찰 활동을 하는 몸인데, 그런 걸 쓰고 있었다는 모습이 뭐랄까……."
1600320-61 = "물론 기본적으로 소리는 작게 틀고 있고, 항상 듣는 것도 아닙니다. 순찰 중 쉴 때 듣는 것……에 가깝지요."
1600320-62 = "긴 순찰을 하다 보면, 아무래도 지루함을 달래 줄 것도 필요하니까요."
1600320-63 = "그렇지만, 그래도 역시 좀……."
1600320-64 = "어쩐지 건성으로 보이지 않을까……. 그런 걱정이 들어서, 저도 모르게 불안해하고 있었던 모양입니다."
1600320-65 = "……네?"
1600320-66 = "전혀 그렇지 않다고요? 그, 그렇습니까. 그렇다면 다행이지만……."
1600320-67 = "[s7] \"그냥 하는 말이 아니야. 정말이야.\"\n[s8] \"누가 시켜서 하는 일도 아니잖아.\"\n[s9] \"누구를 보여주기 위해 하는 일도 아니고.\""
1600320-71 = "……그건……."
1600320-72 = "…………."
1600320-73 = "……후……."
1600320-74 = "그러네요. 하긴, 의식하는 게 오히려 이상한 일이겠군요. 지역 순찰이라는 건……."
1600320-75 = "단지 스스로, 주변을 둘러보고자 시작했던 일이었는데 말이에요."
1600320-76 = "평소라면 하지도 않았을 생각인데, 괜히 선생님 곁이라고 의식하고 있었던 것 같습니다."
1600320-77 = "흐트러졌군요. 반성해야 할 부분입니다."
1600320-78 = "……그래도 그렇게 말씀해주신 덕분에, 마음이 많이 편해졌습니다."
1600320-79 = "정말 감사드립니다, 선생님. 정말입니다."
1600320-80 = "……네?"
1600320-81 = "헤드폰이요? 특별히 개조라던가……. 혹은 스스로 만든 거냐고요?"
1600320-82 = "아니요. 저에게 그런 기술은 없습니다. 이건 전혀 특별할 게 없는, 가게에서 파는 평범한 제품입니다."
1600320-83 = "굳이 특이한 점을 뽑자면……. 조금 오래되고 낡았다는 것 정도겠군요."
1600320-84 = "구입한 지도 꽤 되었고, 순찰을 길게 돌 때에는 자주 쓰곤 했었으니까요."
1600320-85 = "어떨 때는 쓴 채로 교전에 임하기도 했습니다만……. 운이 좋았던 건지, 아직도 무사합니다."
1600320-86 = "만약 유사시의 상황으로 부서지거나 한다면……."
1600320-90 = "음……. 잘 모르겠습니다. 새로 사고 싶다는 생각이 안 드는 걸 보니, 아무래도 수리점에 맡겨서 고칠 것 같네요."
1600320-91 = "[s10] \"뭐, 오랜 시간 함께한 동료니까.\"\n[s11] \"헤드폰도 순찰 파트너 중 하나니까.\""
1600320-94 = "그렇게 마치 살아있는 물건인 것처럼 말씀을……."
1600320-95 = "그렇지만……. 네. 어째서인지 말씀해 주신 바를 알 것 같은 기분입니다."
1600320-96 = "……하하……."
1600320-97 = "제가 했을 땐 전혀 재미없는 이야기였는데, 선생님께서 특별한 이야기로 바꿔 주셨네요."
1600320-98 = "……묘한 기분입니다."
1600320-99 = "제 총도 그렇고……. 아무래도 지금까지, 순찰을 혼자 도는 게 아니었을지도 모르겠습니다."
1600320-100 = "[s12] \"물론이지! 나도 있잖아.\"\n[s13] \"언제든 불러만 줘. 순찰 말고도 괜찮으니까.\""
1600320-103 = "……뭣……."
1600320-107 = "……아."
1600320-108 = "그, 어……. 음……."
1600320-109 = "죄, 죄송합니다. 저도 모르게 말문이 막혀서 그만……."
1600320-111 = "말씀은 정말로 감사하지만……. 역시 괜찮습니다."
1600320-112 = "선생님께선 더 크고 중요한 일들을 맡으시느라 시간이 없으시다는 것도 알고 있고요."
1600320-113 = "그러니……."
1600320-116 = "……음……."
1600320-117 = "……아닙니다. 죄송하지만, 방금 말은 없었던 걸로 해도 괜찮을까요?"
1600320-118 = "역시……. 지금은 죄송하다는 말씀보다, 감사하다는 말씀을 드리고 싶습니다."
1600320-119 = "그 말씀……. 정말로 감사합니다. 선생님께서만 괜찮으시다면 가끔은, 아주 가끔씩은……."
1600320-120 = "……부탁드리고 싶습니다, 아니."
1600320-126 = "……꼭 부탁드리겠습니다, 선생님."
