[translation]
2600202-1 = "가장 중요한 향신료"
2600202-2 = "게헨나 제8번 학생식당"
2600202-3 = "(그렇게 주리의 연락을 받아 게헨나의 학생식당을 찾았다.)"
2600202-4 = "선생님~ 어서 오세요!"
2600202-5 = "[s] \"으, 응.\""
2600202-6 = "오늘 협력해 주셔서 감사해요."
2600202-7 = "저, 몇 번이나 고민해봤지만."
2600202-8 = "역시 요리에 얼마만큼의 사랑을 넣는 게 적정량인지 #n도저히 가늠할 수가 없어서."
2600202-9 = "그래도 선생님께서 도와주신다면 오늘 답을 알 수 있을 거예요!"
2600202-10 = "[s1] \"근데 말이야. 조금 늦은 말이지만.\"\n[s2] \"딱히 사랑에 적정량은 없지 않을까, 하고…….\""
2600202-11 = "아뇨! 그런 미적지근한 태도로는 안 돼요!"
2600202-12 = "아뇨! 그런 미적지근한 태도로는 안 돼요!"
2600202-13 = "보다 맛있는 요리를 만들기 위해, 매일 같이 절차탁마."
2600202-14 = "수행을 허투루 하지 않는 것이, 저희 게헨나의 급양부니까요!"
2600202-15 = "(주리가 보여주는 기백 앞에서 차마 협력하지 않겠다고 할 수는 없었다.)"
2600202-16 = "[s] \"하지만 어떻게 적정량을 알아내겠단 거야?\""
2600202-17 = "아! 그런 거라면 이미 준비도 확실히 해놨어요."
2600202-18 = "오늘은 선생님께, 제가 만든 '각각 쏟은 애정의 양이 다른' 세 가지 요리로 대접해드릴게요!"
2600202-19 = "[s3] \"주리의……!\"\n[s4] \"요리……!\""
2600202-20 = "네에, 이미 주방에서 조리에 들어간 요리들이 있거든요."
2600202-21 = "네에, 이미 주방에서 조리에 들어간 요리들이 있거든요."
2600202-23 = "[s] \"지금, 주방 쪽에서 폭발음 같은 게.......\""
2600202-24 = "네? 뭔가 들으셨나요?"
2600202-25 = "아, 혹시 제 사랑이 들어간 요리를 먹을 기대감에, #n선생님의 배꼽시계가 울렸다던가……?"
2600202-26 = "[s] \"당사자도 알지 못한 깜짝 이벤트……!\""
2600202-27 = "후후후~♪ 그럼 시작할게요!"
2600202-29 = "그럼 첫 번째 요리예요!"
2600202-31 = "(주리가 냄비의 뚜껑을 열자, 알싸하고 매캐한 냄새가 코를 찔러왔다.)"
2600202-32 = "(냄비 안에는 거무죽죽한 무언가가 꿈틀거리고 있었다.)"
2600202-33 = "[s] \"혹시나 해서 묻는 건데, 이건 무슨 요리야……?\""
2600202-34 = "네? 당연히 보다시피 감바스 알 아히요인데요?"
2600202-35 = "[s] \"……그렇구나!\""
2600202-36 = "이 음식에 담긴 사랑은, 아주 약간의……."
2600202-37 = "선생님을 향한 제 친애의 감정을 담았답니다~!"
2600202-38 = "그럼 맛보아주세요!"
2600202-40 = "[s] \"……그, 그럼. 자, 자, 잘 먹겠습니다…….\""
2600202-43 = "[s] \"……!!\""
2600202-44 = "어머! 어떠신가요, 선생님?"
2600202-50 = "[ns] \"……핫!\""
2600202-51 = "(잠깐 방심한 사이에 정신을 잃을 뻔한 걸 간신히 견뎌냈다.)"
2600202-53 = "(하지만 눈을 반짝이고 있는 주리에게 나쁜 말은 할 수 없었다.)"
2600202-54 = "[s5] \"으음, 그러니까…….\"\n[s6] \"개, 개성적인 맛이네……!\""
2600202-55 = "앗, 그런가요……?"
2600202-56 = "앗, 그런가요……?"
2600202-57 = "으음, 하지만 생각보다 선생님의 반응이 미적지근한 게……."
2600202-58 = "역시 이 정도의 사랑만으로는 조금 부족했는지도 모르겠어요."
2600202-59 = "그럼 다음번엔 더 큰 사랑을 담은 요리를 가져올게요!"
2600202-60 = "[s] \"이것보다 더 큰 사랑, 이라고…….?\""
2600202-63 = "이쪽입니다!"
2600202-64 = "이번엔 친애의 감정을 넘어, 존경의 사랑을 담은 요리예요!"
2600202-65 = "보다시피 이번 요리는 감바스에 곁들여 먹는 마늘빵이에요!"
2600202-66 = "[s] \"저기, 마늘빵이란 게, 원래 파란색이야?\""
2600202-67 = "어, 그렇지 않나요?"
2600202-68 = "먹는 방법 중에, 요리책에서 추천해주기를."
2600202-69 = "마늘빵은 여기 감바스 국물에 찍어 먹으면 맛있을 거래요!"
2600202-70 = "자! 드셔 보세요. 선생님!"
2600202-71 = "[s7] \"주리의 요리에 주리의 요리를……!\"\n[s8] \"과연 어떤 조합이……!\""
2600202-74 = "[s] \"으, 으음! 자……알 먹겠……습니다……!\""
2600202-82 = "\"선생님? 왜 그러세요?\""
2600202-83 = "\"\"음, 말씀이 없으시다는 건…….\"\""
2600202-84 = "\"\"\"역시 이것들도 부족하단 걸까요?\"\"\""
2600202-85 = "\"\"\"그럼 이건 어떠신가요?\"\"\""
2600202-86 = "\"\"\"세 번째 요리는 다름이 아니라\"\"\""
2600202-87 = "\"\"\"제, 제, 제가 선생님을 열렬히 사모하는 감정을 담아서 만든 요리랍니다……!\"\"\""
2600202-88 = "\"\"\"아이참. 부, 부끄러워라…….\"\"\""
2600202-90 = "\"\"\"응? 선생님? 저기요? 선생님……?\"\"\""
2600202-95 = "[ns] \"헉?!\""
2600202-96 = "어머, 일어나셨나요?"
2600202-97 = "[s] \"여, 여긴 대체……. 요, 요리는?\""
2600202-98 = "아……. 선생님, 많이 피곤하셨나 봐요."
2600202-99 = "음식을 먹다가 중간에 잠이 드시다니……."
2600202-100 = "[s] \"그, 그랬나?\""
2600202-101 = "제가 괜히 피곤한 선생님께 무리한 부탁을 드린 건 아니었을는지……."
2600202-102 = "[s9] \"아냐, 괜찮아.\"\n[s10] \"주리가 도움이 필요하다는데 당연한 거지.\""
2600202-103 = "……감사합니다, 선생님."
2600202-104 = "……감사합니다, 선생님."
2600202-105 = "그래도 너무 몸을 축내시면 안되어요."
2600202-106 = "그렇지 않아도 선생님은 평소에도 바쁘셔서 끼니도 거를 때가 있다고 들었는 걸요."
2600202-107 = "[s] \"아, 그래서 일부러…….\""
2600202-108 = "(꼬르륵)"
2600202-109 = "어머……. 선생님, 배가 고프신가요?"
2600202-110 = "(그러고 보니 오늘 하루 종일 제대로 된 음식을 먹지 못했다는 것이 떠올랐다.)"
2600202-111 = "다행이다."
2600202-112 = "[s] \"다행이라니?\""
2600202-113 = "선생님이 식사 도중에 잠드시는 바람에, #n그렇지 않아도 양이 적지 않았을까 하고 생각했거든요."
2600202-116 = "혹시 몰라 남은 음식들, 전부 보온통에 챙겨왔으니까요."
2600202-117 = "자, 사양 말고 마음껏 드세요!"
2600202-118 = "[s] (양호실에 분명 위장약이…….)"
2600202-120 = "[s] \"각오는, 했어!\""
2600202-121 = "네에~ 그럼 이번에 드실 요리는……."
2600202-123 = "(그 뒤로도 주리의 요리를 먹으며 사랑에 대해 배워 나갔다.)"
