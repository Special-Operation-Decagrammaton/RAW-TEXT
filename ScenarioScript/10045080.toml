[translation]
10045080-1 = "제8화;서로의 긍지"
10045080-4 = "우물우물……."
10045080-5 = "해변을 바라보며 먹는 닭꼬치는 역시 각별하구나."
10045080-6 = "후후, 정말 즐거운 경기였사와요!"
10045080-7 = "비치발리볼은 이즈나도 하고 싶었는데……."
10045080-8 = "시간 나면 나중에라도 같이 해볼까요?"
10045080-9 = "응. 좋은 생각~"
10045080-10 = "오오, 정말입니까? 정말 재미있겠네요!"
10045080-12 = "저…… 혹시 그럼 그때 저도 껴도 될까요?"
10045080-13 = "응. 다음에는 같이 팀을 해보자."
10045080-14 = "여, 영광이에요! 나구사 님!"
10045080-16 = "그나저나 정작 패자부활전을 통과한 주인공들은 어디로 가신 것이어요?"
10045080-17 = "경기가 끝나자마자 급하게 사라지시던데."
10045080-18 = "지금 그 두 사람은……."
10045080-19 = "수영 특훈 중이야."
10045080-21 = "치열한 접전 끝에 매치 포인트를 가져간 팀은 바로……!!"
10045080-22 = "렌게 키쿄 팀입니다……!"
10045080-27 = "해냈어…… 우리가 이겼어……!"
10045080-28 = "자, 그럼 이제 약속을 지키러 가야지?"
10045080-29 = "약속? 아……."
10045080-30 = "그래! 지금부터 바로 수영 특훈이다!"
10045080-31 = "지금 바로……?!"
10045080-36 = "빨리 가자고! 1분 1초가 아까워!"
10045080-41 = "후후, 키쿄 선배라면 분명 퍼어~펙투 하게 수영을 익히실 것이어요!"
10045080-42 = "그래. 할 수 있어."
10045080-43 = "키쿄라면, 분명."
10045080-45 = "푸, 푸하앗……!"
10045080-46 = "좀 더 열심히 팔다리를 휘저어! 몸에서 힘 빼고! 안 그럼 계속 가라앉을 거야!"
10045080-47 = "으윽…… 힘을 빼고 열심히 팔다리를 휘저으라니, 그게 말이 되는 거야?"
10045080-48 = "거스를 수 없는 힘엔 똑같이 힘으로 맞서면 안 돼. 그러니까 긴장을 풀고 즐기는 거야."
10045080-49 = "너라면 어떤 느낌인지 금방 알게 되겠지."
10045080-50 = "익숙해지면, 더 멋진 수영을 알려줄 테니까!"
10045080-51 = "응? 더 멋진……?"
10045080-52 = "렌게. 이 수영은 뭐라고 불러?"
10045080-53 = "응? 아, 이 수영은……."
10045080-55 = "개헤엄이야!"
10045080-56 = "아, 역시."
10045080-57 = "……응?"
10045080-58 = "개헤엄……?!"
10045080-59 = "백화요란의 작전참모인 내가 개헤엄을 배우고 있었다고……?!"
10045080-60 = "창피해도 어쩔 수 없어. 가장 배우기 쉬운 것부터 해야지."
10045080-61 = "개헤엄…… 이 내가 개헤엄을……."
10045080-66 = "아, 아! 여러분! 모두 백야수상제 잘 즐기고 있나요?"
10045080-67 = "곧 이번 대회의 마지막 종목과 대진 발표가 있을 예정입니다!"
10045080-68 = "선수 여러분들은 지금 바로 경기장에 모여주세요!"
10045080-69 = "결승전, 물에 들어가는 종목이 아니면 좋을 텐데……."
10045080-70 = "만약 그렇다면…… 개헤엄이라도 해야 하는 건가……."
10045080-71 = "일단 가자. 늦는 게 가장 안 좋아."
10045080-73 = "잠시 후……."
10045080-76 = "선수들이 모두 모였네요! 그럼 지금부터 마지막 종목과 대진 발표가 있겠습니다!"
10045080-77 = "일단 종목 발표부터!"
10045080-78 = "[ns] \"이번 백야수상제의 마지막 종목! 그건 바로……!\""
10045080-81 = "[log]부표 밀어내기 게임![/log]"
10045080-84 = "네! 바다 위에 떠 있는 부표 위에서 서로를 밀어내, 떨어지는 사람이 패배하는 게임입니다!"
10045080-85 = "무기는 허용하지 않고 오로지 체력으로만 승부를 봐야 해요!"
10045080-86 = "잔꾀를 부릴 수 없는 한판 승부입니다!"
10045080-87 = "오……. 떨어지면 개헤엄 당첨이네."
10045080-88 = "(출렁거리는 부표 위에서 무기 없이 싸운다니…….)"
10045080-89 = "(완전히 물에서 하는 경기는 아니라 다행이지만, 누구와 만나든 내가 불리해.)"
10045080-90 = "자, 그럼 지금부터 대진을 결정하겠습니다."
10045080-91 = "참가자분들은 이 앞의 상자에 손을 넣어 공을 하나씩 가져가 주세요."
10045080-92 = "공에는 1과 2의 숫자가 적힌 공이 들어있는데요, 같은 숫자를 뽑은 사람들이 준결승을 치르게 됩니다."
10045080-94 = "[ns] \"그럼 첫 진출자였던 이즈나부터 공을 뽑아줘.\""
10045080-95 = "알겠습니다, 주군!"
10045080-96 = "과연 이즈나는 몇 번이 뽑힐까요……?"
10045080-100 = "오, 2번입니다!"
10045080-102 = "[ns] \"다음은 렌게 선수!\""
10045080-103 = "으~음…… 정했다!"
10045080-107 = "응? 난 1번이네?"
10045080-109 = "[ns] \"그다음은 치세야.\""
10045080-110 = "뭐가 나올까나~"
10045080-114 = "아. 2번이다."
10045080-116 = "[ns] \"그럼 키쿄는 자연스레…….\""
10045080-117 = "……1번."
10045080-118 = "네! 이걸로 대진이 결정되었습니다!"
10045080-119 = "첫 번째 준결승은 키쿄 선수 대 렌게 선수!"
10045080-120 = "두 번째 준결승은 이즈나 선수 대 치세 선수!"
10045080-121 = "각 경기의 승자가 결승에서 맞붙게 됩니다……!"
10045080-122 = "갑자기 붙게 된다니."
10045080-123 = "두 분이 결승전에서 대결하는 모습을 보고 싶었는데……."
10045080-124 = "조금 아쉽게 됐네."
10045080-125 = "나구사 선배는…… 두 분 중 어떤 분이 이길 것 같으시어요?"
10045080-126 = "……렌게가 유리하다고는 생각해."
10045080-127 = "그리고 만약 키쿄가 이겨서 결승에 진출한다 해도 우승은 쉽지 않아."
10045080-128 = "이즈나 씨는 닌자이고……."
10045080-129 = "치세 씨는…… 저번 대회 우승자니까."
10045080-130 = "네? 저번 대회 우승자요? 소녀는 몰랐사와요……!"
10045080-131 = "누구와 만나든 자기가 불리하다는 건 키쿄가 가장 잘 알고 있을 거야. 그렇다면……."
10045080-132 = "키쿄가 승부를 포기하고 체력을 보존한 렌게가 결승에 진출하는 게 백화요란에게 전략적으로 유리하겠지."
10045080-133 = "그럼 키쿄 선배가 고의 패배를 할 거라는 말씀이어요……?"
10045080-134 = "키쿄는 팀을 위해서라면 얼마든지 자신을 희생하는 아이야."
10045080-135 = "그러고 보니……."
10045080-136 = "렌게가 키쿄의 소꿉친구라는 것도 변수네. 보통 소꿉친구와는 진지하게 싸우기 싫을 테니까."
10045080-137 = "물론 나는 키쿄가 최선을 다하는 모습을 보여주는 게 좋다고 생각해."
10045080-138 = "하지만…… 키쿄가 어떤 선택을 할지는 잘 모르겠어."
10045080-139 = "키쿄 선배……."
10045080-141 = "어이, 키쿄. 설마 너 이상한 생각하는 건 아니지?"
10045080-142 = "……이상한 생각? 그런 거라면 나보단 네가 더 많이 하잖아?"
10045080-143 = "요즘 사제의 일상을 다루는 소설을 읽던데, 역시 그게 원인인가?"
10045080-144 = "그, 그걸 네가 어떻게……?!"
10045080-145 = "……가 아니라! 말 돌리지 마! 난 제대로 싸울 거냐고 묻고 있는 거라고!"
10045080-146 = "넌, 나와 싸우고 싶은 거야?"
10045080-147 = "편법을 쓰는 것이 싫을 뿐이야."
10045080-149 = "편법? 이건 작전이야. #n결승이라면 모를까, 여기서 우리가 전력으로 싸우는 건 좋은 방법은 아니야."
10045080-150 = "결승에 가는 것이 확정되었다면, #n조금이라도 여력이 남아있는 쪽이 나아."
10045080-151 = "다음은 누가 갈지를 정하면 되는 문제야."
10045080-152 = "나와 너. 둘 중에 이 종목에 가망이 있는 쪽은 어느 쪽인가."
10045080-153 = "고민할 필요도 없잖아?"
10045080-154 = "키쿄……."
10045080-155 = "난 백화요란이 승리할 수 있는 가장 높은 확률을 계산했을 뿐이야."
10045080-156 = "……그런 식으로 이겨나가도 의미 없잖아!"
10045080-157 = "그렇겠지. 너라면 그럴 거라 생각했어. #n……싸울 거지? 자, 준비해."
10045080-158 = "잠깐, 이야기는 아직……."
10045080-160 = "이야기는 나중에 실컷 듣겠어."
10045080-161 = "넌 분명 높은 곳까지 갈 수 있는 아이니까."
10045080-162 = "……."
10045080-164 = "한편, 근처의 어느 상점……."
10045080-165 = "으으으, 분해!"
10045080-166 = "전부 그 너구리 때문이야!"
10045080-167 = "같은 팀이 강했으면 이런 일은…… #n분명 운영 녀석들, 팀 조합할 때 조작한 거야!"
10045080-168 = "용서 못 해……."
10045080-169 = "거기 당신, 물어보고 싶은 게 있습니다만."
10045080-170 = "뭐야? 난 바쁘다고! 귀찮으니까 저리 비……."
10045080-171 = "……어라?"
10045080-176 = "……."
10045080-177 = "너, 너는……! 재액의 여우? 어째서 이런 곳에?!"
10045080-178 = "이쪽 해변이 소란스럽더군요."
10045080-179 = "그건 그렇다 치고…… 질문을 한 것은 제 쪽입니다만……."
10045080-180 = "질문에 질문으로 답하지 말아 주실래요?"
10045080-181 = "히익! 아, 알았어! 이야기 해줄게!"
10045080-182 = "(이, 이 녀석을 잘 이용하면…… 날 골탕 먹인 녀석들을 모두 날려버릴 수 있어!)"
10045080-183 = "……저쪽 해변에서 말이야, 백귀야행의 최강자를 뽑는 대회를 하고 있다고."
10045080-184 = "그런데 자기들끼리 경기 내용을 조작하고 있어. 그래서 확 다 뒤집어버릴까 하는데, 관심 있어?"
10045080-185 = "너도 같이 어때? 널 빼놓고 백귀야행 최강을 가린다니 웃기잖아?"
10045080-186 = "흐음, 그다지 관심 없는 이야기네요."
10045080-187 = "하, 하지만 샬레의 선생인가 하는 녀석도 와서 멋대로 경기를 조작하고 있다고!"
10045080-188 = "넌 화 나지도 않아?"
10045080-189 = "잠깐만요. 샬레의…… 선생님?"
10045080-190 = "선생님이 와계신다고요?"
10045080-191 = "그, 그래! 그 선생이 심사를 하고 있어!"
10045080-192 = "선생님이 <최강>을 심사하는 대회……? #n그걸 왜 빨리 얘기하지 않았나요."
10045080-193 = "우훗, 우후훗♡"
10045080-194 = "아아, 이 와카모. 금방 당신을 찾아뵈러 가겠어요……!"
10045080-198 = "어이! 기다려!"
10045080-199 = "……후후, 어찌 됐든 상관없나."
10045080-200 = "재액의 여우가 갔으니 저기도 곧 엉망이 되겠지."
10045080-201 = "나도 가서 한바탕 날뛰어 주겠어! 마지막엔 내가 이기는 거야!"
