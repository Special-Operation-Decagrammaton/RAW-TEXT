[translation]
1006003-1 = "얌전하게 시간 보내는 법"
1006003-2 = "(으슥한 뒷골목의 한쪽에서 메구의 모습을 발견했다.)"
1006003-3 = "(메구는 어딘가 초조해 보이는 얼굴로 안절부절못하고 있었다.)"
1006003-12 = "[ns1] \"……메구? 괜찮아?\"\n[ns2] \"메구! 왜 그래? 무슨 일이야?\""
1006003-20 = "선생님! 와 줬구나! 기다리고 있었다고!"
1006003-21 = "응? 심각해 보인다고?"
1006003-22 = "응! 심각해. 아주아주 심각한 일이야!"
1006003-23 = "무슨 일이냐고?"
1006003-24 = "음……. 그러니까 말이지……!"
1006003-28 = "…………."
1006003-29 = "……아무 일도 없어! 계속!!"
1006003-33 = "[ns3] \"……???\"\n[ns4] \"아무 일도 없는 게 심각한 일인 거야?\""
1006003-36 = "그렇지, 역시 선생님이야!"
1006003-37 = "바로 이해해 줬구나!!"
1006003-38 = "[ns] \"………….\""
1006003-40 = "[ns5] \"아~. 완벽히 이해했어!\"\n[ns6] (전혀 이해하지 못했다.)"
1006003-43 = "그게 말이지, 실은 아까 전에 부원들과 다 같이 부장이 지시한 곳에 온천을 만들려 했거든."
1006003-44 = "그런데 발파작업을 하자마자 사방에서 병력들이 몰려오더라고. 숫자도 평소 예상보다 훨씬 더 많았어!"
1006003-45 = "나는 이번에도 당연히 싸우는 건가~ 했는데, 부장이 일단 흩어져서 숨어 있으라고 해서……."
1006003-46 = "그래서 일단 이렇게 숨긴 했는데……."
1006003-50 = "그게……. 그 뒤가……."
1006003-51 = "[s] \"응응. 그 뒤가……?\""
1006003-52 = "계속…… 계속 이렇게……. 그냥 들키지 말고 얌전히 숨어 있으라고 해서……."
1006003-53 = "그래서 여기서 가만히 있기로 했는데……. 그게……. 그게 너무 힘들어서……."
1006003-57 = "[ns] \"…………\""
1006003-58 = "선생님……. '얌전히 있는다'는 건 어떻게 하는 걸까? 나는, 나는 도무지 모르겠어!!"
1006003-59 = "[s7] \"……어……. 말하자면 좀이 쑤신다는 거구나.\"\n[s8] \"메구는 활동적이니까, 오히려 그게 힘든 거구나.\""
1006003-62 = "음……. 그런가……?"
1006003-63 = "아무튼 그런 걸지도!!"
1006003-64 = "시간이 너무 안 가. 마치 어딘가에 갇혀 있는 느낌이라고!"
1006003-65 = "아니, 가끔 선도부 수감실에 갇혀 있을 때에도 이런 느낌은 아니었는데 말이지! 거긴 거기 나름대로 놀거리가 있었거든!!"
1006003-66 = "게다가 그땐 다른 부원들도 있었고 말이야."
1006003-67 = "그치만 지금은! 지금은……!!"
1006003-71 = "으으으으으~~!!!"
1006003-72 = "……응?"
1006003-73 = "선생님? 방금 뭐라고 했어?"
1006003-74 = "……아. 이거?"
1006003-78 = "이건 그……. 온천 개발 다 한 뒤에 장식품용으로 배치하려고 가지고 있었던 건데……."
1006003-79 = "뭐라더라……? 켄……다마?"
1006003-80 = "아무튼 그런 물건이라고 했어."
1006003-81 = "자세한 건 나도 잘 몰라. 그냥 다 만들면 놔두라길래 들고 있었을 뿐."
1006003-82 = "그런데 그건 왜 물어봐?"
1006003-83 = "선생님, 이게 뭔 줄 아는 거야?"
1006003-84 = "어라? ……뭐라고?"
1006003-85 = "……장난감? 이게? 어떻게 하고 노는 건데?"
1006003-91 = "[ns9] 메구에게 켄다마를 건네받는다.\n[ns10] \"한번 시범을 보여줄까?\""
1006003-94 = "……!! 오, 좋아~!! 그럼 어디 한번 보여줘!!"
1006003-104 = "…………!!!!!!!"
1006003-108 = "뭐, 뭐야뭐야! 뭐야, 그거!?"
1006003-109 = "굉장하잖아!! 대체 어떻게 하는 거지!?"
1006003-110 = "나도 해 봐도 돼? 선생님!! 나도 해볼래!! 해보게 해 줘!!"
1006003-111 = "[s11] \"아니, 원래 네 건데…….\"\n[s12] 메구에게 켄다마를 돌려준다."
1006003-118 = "좋아, 나도 한번……!!"
1006003-127 = "……윽. 뭐지? 왜 안 되지?"
1006003-132 = "생각처럼 잘 안 되는데……. 선생님? 이것도 뭔가 방법이 있는 거야? 아니면 머리가 필요한 거야?"
1006003-133 = "응? 하다 보면 능숙해지는 거라고?"
1006003-134 = "정말이지? 선생님 말만 믿는다?"
1006003-135 = "좋아……!"
1006003-136 = "지켜봐 줘, 선생님!! 내가 해내고야 말 테니까!!"
1006003-137 = "다시 도전~~!!!"
1006003-139 = "(이후 메구는 제대로 켄다마를 다룰 수 있을 때까지 몇 시간이나 그 자리에서 연습을 이어갔다.)"
1006003-140 = "(중간에 메구의 휴대폰으로 누군가로부터 연락이 연거푸 날아왔음에도, 메구는 신경조차 쓰지 않았다…….)"
