[translation]
2001405-1 = "근검절약"
2001405-3 = "[ns] 뭔가 기분이 좋아 보이네."
2001405-4 = "아, 선생님."
2001405-5 = "후후, 눈치챘어?"
2001405-6 = "오전에 근처의 벼룩시장을 들렸다가 귀한 물건을 구했거든."
2001405-7 = "바로……."
2001405-8 = "37mm 야삽 박격포야!"
2001405-9 = "[s] \"……이게 뭐야?\""
2001405-10 = "아, 선생은 처음 보는 물건이려나."
2001405-11 = "모르는 것도 이상한 일은 아니지. 이제는 생산 기록도 거의 남아있지 않은 희귀한 물건이니까."
2001405-12 = "이 박격포는 오래전 붉은겨울 학원 출신의 어느 괴짜가 만든 물건으로, 야전삽으로도 사용할 수 있는 박격포야!"
2001405-13 = "평소에는 포열 부분을 손잡이처럼 쥐고 삽으로 사용하다가 적이 나타나면 방열해서 박격포로 쓸 수 있지."
2001405-14 = "대단하지 않아? 야전삽과 박격포를 장비 하나로 해결할 수 있다니……."
2001405-15 = "어지간한 대인 전술은 이 장비 하나로 해결할 수 있다고!"
2001405-16 = "……그런데 이렇게 훌륭한 물건이 어째서 더 이상 생산되지 않는지 도무지 이해할 수가 없네."
2001405-17 = "[s] \"생각보다 쓸모가 없어서 그런 게 아닐까?\""
2001405-18 = "하아? 그럴 리가 없잖아?"
2001405-19 = "야전삽과 박격포는 많으면 많을수록 좋다고! 그걸 모르는 건 참호 한 번 제 손으로 파본 적 없는 높으신 분들밖에 없을 걸."
2001405-20 = "……분명 이 박격포는 보병전의 진가를 모르는 높으신 분들에 의해 폐기된, 비운의 장비임이 틀림없어."
2001405-21 = "내가 보란 듯이 이 장비의 진가를 증명해 주겠어!"
2001405-22 = "[s] \"그나저나 엄청나게 녹이 슬어 있는데.\""
2001405-23 = "판매자의 말로는 창고에 수십 년 넘게 방치되어 있었다고 하니 어쩔 수 없지."
2001405-24 = "하지만 괜찮아. 이런 단순한 구조의 장비는 쉽게 정비할 수 있으니까."
2001405-25 = "대개의 장비는 닦고, 조이고, 기름치면 금세 새것처럼 만들 수 있다고!"
2001405-26 = "자, 선생님. 지금부터 이 박격포를 깨끗이 정비하는 거야!"
2001405-27 = "[s] \"일단은 열심히 해 볼게.\""
2001405-30 = "― …으읏, [wa:550]으으읏…."
2001405-33 = "[wa:150]― …쳇."
2001405-35 = "― 내부가 뻑뻑해서 그런지 [wa:1300]조금도 움직이질 않아."
2001405-38 = "[wa:500]― 좀 더, [wa:500]미끄럽게 만들지 않으면…."
2001405-40 = "[wa:100]― 선생님, [wa:1000]그쪽에 있는 윤활유 좀 [wa:1250]여기로 가져다줄래?"
2001405-43 = "[ns] 윤활유를 건네준다."
2001405-44 = "[wa:200]― 오, [wa:800]이제야 좀 괜찮네."
2001405-47 = "[wa:500]― 하아아… [wa:1500]이렇게 녹을 벗겨내고 있을 때가"
2001405-49 = "― 제일 [wa:800]기분 좋아…"
2001405-52 = "[wa:200]― …뭔가 손동작이 신경 쓰여서, [wa:1950]똑바로 쳐다볼 수 없다고?[wa:400]"
2001405-55 = "― 하, [wa:300]하아아?!"
2001405-58 = "― 이건 [wa:200]신성한 [wa:550]포구 수입 작업이라고!"
2001405-60 = "― 무슨 헛소리야, [wa:350]이 바보가!"
2001405-63 = "끝났다!"
2001405-64 = "이 반짝이는 포신과 삽날 좀 봐. 아름다워……."
2001405-65 = "역시 클래식한 무기에는 클래식한 무기만의 매력이 있다니까."
2001405-66 = "자, 그럼 한번 시험 사격을 해볼까……?"
2001405-67 = "표적지를 향해 포열을 조준하고…… 포탄을 장전한 뒤에……"
2001405-68 = "발사!"
2001405-72 = "……."
2001405-73 = "바, 방금 그건 뭐였지? 불발탄이었나?"
2001405-74 = "그럴 리가 없는데. 다시 한번……"
2001405-75 = "발사!"
2001405-80 = "역시 37mm 고폭탄을 곡사로 쏘는 건 무리였나……?"
2001405-81 = "이 위력으로는 토치카는커녕 머리에 쓰는 철모도 못 뚫겠는데……."
2001405-82 = "괘, 괜찮아. 위력은 조금 떨어질지 몰라도, 이 박격포에는 야전삽으로 사용할 수 있다는 장점이 아직 남아있으니까."
2001405-83 = "예를 들면 이곳에 있는 흙무더기도 이렇게 가볍게……"
2001405-88 = "가볍게……."
2001405-93 = "……도대체 뭐야, 이 삽! 두꺼운 포열이 방해돼! 게다가 무거워!"
2001405-94 = "이런 거로 참호를 파느니 차라리 맨손을 쓰는 게 빠르겠어!"
2001405-95 = "[s] \"역시 안 쓰는 무기에는 다 이유가 있는 건가.\""
2001405-96 = "으읏…… 하지만 모처럼 구한 희귀 장비인데……"
2001405-97 = "분명 어딘가에…… 어딘가에 쓸 수 있을 테니까!"
2001405-99 = "(그 후로 사키는 한동안 고집스럽게 야삽 박격포를 들고 다녔지만……)"
2001405-100 = "(결국 포기했는지, 이후 그 박격포는 근처의 헛간에서 먼지를 뒤집어 쓴 채 발견되었다.)"
