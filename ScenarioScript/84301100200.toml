[translation]
84301100200-5 = "조금 이상하게 들릴 순 있겠지만, 한가지 여쭤봐도 괜찮을까요?"
84301100200-6 = "응? 뭐, 상관없지만……. 뭔데?"
84301100200-7 = "밀레니엄 엑스포의 행사장에서…… 사람이 많이 몰리거나 조금 불안한 장치가 있는 곳이 있을까요?"
84301100200-8 = "밀레니엄 분들을 믿지 못한다는 건 아니지만, 역시 티파티의 일원으로서 다른 학우분들보다 먼저 확인할 수 있으면 좋을 것 같습니다."
84301100200-9 = "단순한 노파심……. 혹은 안심과 관련된 부분이라고 생각해 주시면 감사하겠어요."
84301100200-10 = "사람들이 몰리고 불안한 장치? 으음."
84301100200-11 = "구경하고 싶은 곳을 이야기할 줄 알았는데……."
84301100200-12 = "으음……"
84301100200-13 = "미안하지만, 밀레니엄 학생에다 행사를 가이드하는 우리에게 그런 걸 물어도 대답하기 곤란한데."
84301100200-14 = "아…… 역시 무례였겠군요."
84301100200-15 = "방금 건 실언이었어요. 죄송합니다."
84301100200-16 = "아니, 그런 의미가 아니라……."
84301100200-18 = "너~무 많거든! 불안한 곳이라고만 하면 어디부터 말해야 할지 모르겠는데?"
84301100200-19 = "……네?"
84301100200-20 = "그렇지만 여긴 밀레니엄이잖아? 뭐든 터질 수 있고 뭐든 시끄러워질 수 있는 곳이잖아? 아니, 이미 시끄러워진 곳이 있을지도!"
84301100200-21 = "선배 말대로……. 특히나 이런 기술 시연장 같은 경우에는 동아리들이 모두 각자의 기술력을 시험하고 싶어 무리수를 둘 때가 있어."
84301100200-22 = "세미나가 어떻게든 조율했겠지만, 마지막까지 그 말을 들었을지 확신하기도 어렵고……."
84301100200-23 = "애초에 그래서 가이드를 우리에게 맡긴 거기도 해. 만에 하나라도 트리니티 학생들에게 폐를 끼치면 안 되잖아."
84301100200-24 = "응! 무슨 일 나면 해결해야 하니까!"
84301100200-26 = "폐……를 끼친다니, 보통 박람회를 주최하는 측에서는 하지 않을 발상이네요."
84301100200-27 = "아무튼 그렇군요. 생각했던 것보다 훨씬 자유로운 분위기라 좋은 것 같아요."
84301100200-28 = "그러면 두 분께 특정 코너를 찍어 달라 부탁드리는 건 힘들 것 같고……."
84301100200-29 = "음……."
84301100200-34 = "(차라리 일반 학생분들께 여쭤보는 게 좋을지도 모르겠어요.)"
