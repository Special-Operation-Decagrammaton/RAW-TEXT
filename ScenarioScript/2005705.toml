[translation]
2005705-1 = "Side by Side"
2005705-6 = "I arrived at me and Akane's agreed upon meeting spot."
2005705-7 = "...Which happened to be a completely empty...eerily quiet...classroom."
2005705-12 = "Guess who?"
2005705-13 = "[s] \"Gah?!?!\""
2005705-15 = "[ns] \"A-Akane?!?!\""
2005705-16 = "Correct."
2005705-19 = "Welcome, Sensei. Fufu."
2005705-20 = "Oh dear... It seems I went a little overboard. I do apologize."
2005705-21 = "[s1] \"That's okay. It was just...very quiet.\"\n[s2] \"It seems like this classroom is empty, doesn't it? \""
2005705-24 = "Yes, this classroom..."
2005705-25 = "..."
2005705-26 = "I've reserved it for the next two hours. No one will be coming by here."
2005705-27 = "Oh? Why are you so panicked?"
2005705-28 = "Could it be... Do you not trust me?"
2005705-29 = "[s] \"No! I trust you! I do! It's just that...!\""
2005705-30 = "Of course you do! So no need to panic."
2005705-36 = "For I, too, trust you the most."
2005705-37 = "I nodded in agreement to Akane's kind, soothing voice."
2005705-40 = "Why did I ask to meet in an empty classroom? Allow me to explain..."
2005705-41 = "Do you remember when I told you that it was with your help that I was able to change my relationship with my classmates?"
2005705-42 = "I wanted to deliver a message to you... Specially for you."
2005705-43 = "[s3] \"But, still... When there's only two people in a classroom...\"\n[s4] \"How exactly do you intend...to deliver this message?\""
2005705-46 = "I had this thought."
2005705-47 = "Do you know the saying: \"it's better to see something once, than to hear it described a hundred times\"?"
2005705-48 = "So what better way than to...help you see the new me in person?"
2005705-49 = "How, you ask?"
2005705-50 = "Fufu."
2005705-54 = "Sensei."
2005705-55 = "While we're in this classroom, would you..."
2005705-56 = "...become my classmate?"
2005705-60 = "[ns] \"?!\""
2005705-63 = "I agreed to participate in a classmate roleplay (?) with Akane."
2005705-64 = "While I was mulling over if this was an appropriate thing for a teacher to be doing..."
2005705-69 = "Guess who?"
2005705-70 = "[s] \"Akane...?\""
2005705-71 = "Yes. It's me."
2005705-76 = "Hm? Is there a problem?"
2005705-77 = "[USERNAME]?"
2005705-78 = "You have many questions, but first, you'd like to know what happened to my glasses?"
2005705-79 = "Hm, I suppose I was in the mood for a change. "
2005705-80 = "Ah. Am I too different for you, without my glasses? I can't help but feel a tad discouraged by that."
2005705-81 = "[s] \"No, no, no. Not at ALL!\""
2005705-82 = "Fufu. Thank you."
2005705-83 = "So you're never going to guess what happened in class this morning..."
2005705-86 = "Akane smoothly transitioned into chatting and gossiping, as if she'd been doing it her whole life."
2005705-87 = "...I really started to feel like I was just chatting with one of my peers."
2005705-90 = "Ah. I know. Why did I distance myself from my classmates all this time, when I clearly have the skillset to befriend them?"
2005705-91 = "..."
2005705-92 = "If I were to be honest, I still get socially anxious."
2005705-93 = "Even as I'm trying to show off my \"new\" self to you, [USERNAME], I can't help but wonder if it's all just contrived."
2005705-94 = "I suppose keeping up appearances is a part of human life."
2005705-95 = "Perhaps I'm just...a bit afraid."
2005705-96 = "[s] \"That people won't like you if they get to know you?\""
2005705-97 = "That could be an aspect of it..."
2005705-102 = "However, I'm most afraid that people will find out that I don't even know who I am."
2005705-103 = "I find it rather easy to meet others' expectations of me."
2005705-104 = "But learning about myself seems to be a different kind of problem."
2005705-107 = "I'm...good at navigating situations. Saying the right thing, being considerate and polite..."
2005705-108 = "It's a natural part of my job."
2005705-109 = "But that's not being me. That's just me being whoever I think the people around me want me to be."
2005705-110 = "People say to \"be yourself,\" but I don't quite know who that is."
2005705-111 = "Consequently, my connections feel empty. I can hold conversation like this, and say the right thing all the time, but there's a lack of intention."
2005705-112 = "And so I felt a bit stuck."
2005705-113 = "I'm the one who built this invisible wall looming before me, yet I still can't find a way around it."
2005705-114 = "I'm trying to take things slowly like you advised, and I do feel that things are changing..."
2005705-115 = "But it feels like a stopgap measure."
2005705-119 = "...I'm sorry, [USERNAME]."
2005705-120 = "Despite all our efforts, it seems this is as far as I go."
2005705-122 = "I've wasted all your hard work, [USERNAME]."
2005705-126 = "Why am I always like this...?"
2005705-129 = "[ns] \"I'm still really happy you opened up about it.\""
2005705-130 = "...?"
2005705-131 = "..."
2005705-132 = "...You are quite special, [USERNAME]."
2005705-133 = "You're one of the few people I can talk to about this."
2005705-134 = "Perhaps the only one..."
2005705-135 = "That's who you are for me."
2005705-136 = "[s5] \"I want you to have more of 'me' in your life!\"\n[s6] \"I'm sure that won't come easily.\"\n[s7] \"Honestly, I'm not very good at it either.\""
2005705-140 = "...You too, [USERNAME]?"
2005705-141 = "..."
2005705-142 = "I see..."
2005705-143 = "I suppose you weren't born able to do everything either, [USERNAME]."
2005705-144 = "[s] \"That's why I really appreciate what you just said.\""
2005705-145 = "..."
2005705-146 = "Fufu."
2005705-147 = "There's something I wonder about sometimes."
2005705-148 = "In another life, with a different relationship dynamic..."
2005705-149 = "I wonder...how different our lives would have been."
2005705-150 = "[s] \"In a way, that's what we're doing right now, right?\""
2005705-151 = "Fufufu."
2005705-152 = "You're right. For the moment, we're just classmates."
2005705-153 = "..."
2005705-154 = "You know, [USERNAME]."
2005705-155 = "[s] \"Hm?\""
2005705-156 = "Just stay still right there."
2005705-160 = "I was about to ask her why when—"
2005705-164 = "Hup!"
2005705-165 = "[ns] \"EH?!?!\""
2005705-166 = "All of my senses were...taken up by Akane...!"
2005705-167 = "Shh."
2005705-168 = "It might be an empty classroom, but anyone could walk by."
2005705-172 = "...Thanks, [USERNAME]."
2005705-173 = "For talking with me."
2005705-174 = "And for listening to everything I had to say."
2005705-175 = "It made me really happy."
2005705-176 = "Yeah... I really am happy."
2005705-178 = "..."
2005705-179 = "[s] \"...\""
2005705-180 = "Hello, Sensei."
2005705-181 = "[s] \"Yes, hello, Akane.\""
2005705-184 = "― [log=아카네 교복]Fufu.[/log][wa:270] "
2005705-187 = "― [log=아카네 교복]The situation is a bit more[/log]"
2005705-189 = "― [log=아카네 교복]embarrassing than I thought it'd be.[/log]"
2005705-192 = "― [log=아카네 교복]Being honest with oneself...[/log][wa:3250] "
2005705-194 = "― [log=아카네 교복]I simply can't seem to get used to it.[/log][wa:340] "
2005705-197 = "[ns] \"W-Well, vulnerability is hard!\""
2005705-198 = "― [log=아카네 교복]Yes. Exactly as you say.[/log][wa:1290] "
2005705-201 = "― [log=아카네 교복]But to me...[/log]"
2005705-203 = "― [log=아카네 교복]It'd seem it was something I really needed.[/log]"
2005705-206 = "― [log=아카네 교복]In more ways than one, I'm in your debt, Sensei. [/log][wa:2020] "
2005705-209 = "― [log=아카네 교복]Despite everything, I think meeting you was... [/log][wa:3890] "
2005705-212 = "― [log=아카네 교복]It was truly a great stroke of luck. [/log][wa:2110] "
2005705-215 = "― [log=아카네 교복]Life continues moving ever forward,[/log][wa:890] "
2005705-217 = "― [log=아카네 교복]and some things will be forgotten along the way.[/log][wa:10] "
2005705-220 = "― [log=아카네 교복]What happened right now will also, perhaps... [/log][wa:2440] "
2005705-223 = "― [log=아카네 교복]But I will remember.[/log][wa:3010] "
2005705-225 = "― [log=아카네 교복]Even if you forget, Sensei. [/log][wa:520] "
2005705-228 = "― [log=아카네 교복]The really precious memories...[/log]"
2005705-230 = "― [log=아카네 교복]They never truly disappear.[/log]"
2005705-233 = "Just like when Akane first came in..."
2005705-234 = "She disappeared without a trace, as if she had never been there in the first place."
2005705-235 = "I wondered if everything had been a dream for a moment."
2005705-236 = "But the little things she left behind told me it actually happened."
