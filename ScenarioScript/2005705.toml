2005705-30 = "ใช่มั้ยล่ะคะ? ถ้างั้นก็คงไม่มีปัญหาอะไรใช่มั้ยคะ?"
2005705-36 = "แล้วฉันก็เชื่อใจคุณครูมากกว่าใครทั้งหมดด้วยค่ะ"
2005705-37 = "(เมื่อได้ยินเสียงที่เป็นมิตรของอาคาเนะ คุณครูก็ได้แต่พยักหน้าให้ช้าๆ...)"
2005705-40 = "เหตุผลที่ชวนคุณครูมาที่ห้องเรียนว่างๆ นี้น่ะเหรอคะ? คือว่า..."
2005705-41 = "อย่างที่ฉันบอกไปว่าพอคุณครูมาช่วยแนะนำฉัน ฉันก็เข้าหาและอยู่ร่วมกับเพื่อนคนอื่นได้ดีขึ้นค่ะ"
2005705-42 = "แต่ด้วยเหตุผลบางอย่าง... ฉันอยากจะถ่ายทอดมุมหนึ่งนั้นของฉันให้คุณครูได้เห็นด้วยวิธีที่พิเศษ#nออกไปหน่อย..."
2005705-43 = "[s3] \"แต่ว่า... ในห้องที่มีแค่เราสองคน มันน่าจะ...\"\n[s4] \"แต่ถ้าอยู่แค่สองคน ก็น่าจะทำให้เห็นยากหรือเปล่า?\""
2005705-46 = "ฉันไม่คิดอย่างนั้นค่ะ"
2005705-47 = "มีคำที่ว่าสิบปากว่าไม่เท่าตาเห็นไม่ใช่เหรอคะ?"
2005705-48 = "ฉันก็เลยคิดว่า... ต้องทำให้คุณครูสัมผัสถึงตัวตนนั้นของฉันได้ด้วยตัวเองค่ะ"
