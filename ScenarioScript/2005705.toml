2005705-20 = "ตายจริง... ฉันทำให้คุณครูตกใจมากไปสินะคะ ขอโทษค่ะ"
2005705-21 = "[s1] \"ไม่เป็นไรหรอก แต่ห้องนี้มัน...\"\n[s2] \"ว่าแต่ห้องเรียนนี้ไม่มีใครอยู่เลยเหรอ? \""
2005705-24 = "ค่ะ ห้องเรียนนี้น่ะ..."
2005705-25 = "..."
2005705-26 = "ฉันจองไว้เพื่อใช้งานคนเดียวประมาณสองชั่วโมง ระหว่างนี้จะไม่มีใครเข้ามาหรอกค่ะ"
2005705-27 = "ตายจริง? ทำไมทำหน้าเหวอขนาดนั้นล่ะคะ?"
2005705-28 = "หรือว่า... ไม่เชื่อใจฉันเหรอคะ?"
