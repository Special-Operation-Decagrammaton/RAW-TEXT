[translation]
2005705-1 = "並肩而立的位置"
2005705-6 = "（抵達了和朱音約好見面的地方）"
2005705-7 = "（那是個……感覺沒有人會來的空教室）"
2005705-8 = ""
2005705-12 = "我是誰呢？"
2005705-13 = "[s]「！？！？」"
2005705-15 = "[ns] 「朱，朱音！？」"
2005705-16 = "是的，答對了。"
2005705-19 = "歡迎您來，老師。呵呵。"
2005705-20 = "哎呀……好像嚇到您了呢。真是抱歉。"
2005705-21 = "[s1] 「那倒沒關係。」\n[s2] 「但是這裡好像是空教室？」"
2005705-24 = "是的，這間教室……"
2005705-25 = "……"
2005705-26 = "接下來的兩個小時已經被我借走了，所以不會有人過來。"
2005705-27 = "哎呀？為什麼這麼慌張呢？"
2005705-28 = "難道……我不受到信任嗎？"
2005705-29 = "[s] 「不是的！我相信！我當然相信你！只是……！」"
2005705-30 = "那就沒問題了吧？"
2005705-31 = ""
2005705-33 = ""
2005705-35 = ""
2005705-36 = "因為我也比任何人都相信老師呢。"
2005705-37 = "（聽著朱音那親切的聲音，只能緩緩點了點頭……）"
2005705-40 = "把老師叫來空教室的原因……？"
2005705-41 = "先前應該跟您提過……多虧老師您的指導，我對待他人的方式也開始有了改變對吧？"
2005705-42 = "但是我總覺得……應該用更特別、更專屬的方式，向老師傳達這件事情……"
2005705-43 = "[s3] 「可是那在只有兩個人的教室……」\n[s4] 「……不會有點難展現嗎？」"
2005705-46 = "關於這點，我是這樣想的。"
2005705-47 = "不是有句話叫「百聞不如一見」嗎？"
2005705-48 = "所以我希望……能讓老師親身感受改變後的我。"
2005705-49 = "怎麼做，是嗎？"
2005705-50 = "呵呵。"
2005705-51 = ""
2005705-53 = ""
2005705-54 = "老師。"
2005705-55 = "從現在起，哪怕只是短暫的時光也好……"
2005705-56 = "可以請您在這間教室之中，成為我的「同學」嗎？"
2005705-57 = ""
2005705-60 = "[ns]「！？！？！！！！！」"
2005705-63 = "（於是決定和朱音進行「同學角色扮演遊戲(?)」）"
2005705-64 = "（就在不斷糾結這對學生來說，究竟是否屬於正確的教育指導時……）"
2005705-69 = "我是誰～？"
2005705-70 = "[s] 「朱音……？」"
2005705-71 = "嗯。答對了。"
2005705-72 = ""
2005705-75 = ""
2005705-76 = "怎麼了？"
2005705-77 = "[USERNAME]同學？"
2005705-78 = "有很多想問的，總之先從眼鏡問起？"
2005705-79 = "唔嗯～就是想稍微改變一下形象吧？"
2005705-80 = "不過我好像稍微有點難過呢？#n難道[USERNAME]同學覺得我不戴眼鏡就不像我了嗎？"
2005705-81 = "[s] 「絕對沒有那種事。」"
2005705-82 = "呵呵，謝謝你。"
2005705-83 = "話說，上午上課的時候發生了這樣的事……"
2005705-86 = "（朱音開心且自然地繼續說著）"
2005705-87 = "（……感覺自己彷彿真的變成了朱音的同學）"
2005705-90 = "明明可以做到，為何之前會無意識地想保持距離……你想這麼問對吧？"
2005705-91 = "……"
2005705-92 = "其實，我直到現在也不是很有自信。"
2005705-93 = "總是不禁認為……#n會不會就連現在展現在[USERNAME]同學面前的這股充滿活力的模樣，#n也只是我刻意營造出來的另一個自己而已。"
2005705-94 = "……雖然扮演想讓他人見到的自己，某種意義上來說是理所當然的事情。"
2005705-95 = "但我認為……自己應該是因為害怕吧。"
2005705-96 = "[s] 「害怕大家知道朱音真正的模樣嗎？」"
2005705-97 = "有點接近……卻又有所不同。"
2005705-98 = ""
2005705-100 = ""
2005705-102 = "……我真正害怕被大家知道的，是「連我自己都不知道自己是誰」這件事。"
2005705-103 = "迎合別人的期待，這是我所能做到的。"
2005705-104 = "然而去了解自己是誰，卻是我無論如何都看不見答案的事。"
2005705-105 = ""
2005705-107 = "我認為……自己還算會觀察氣氛。#n舉例來說，就像選擇不會讓人感到不舒服的話之類的。"
2005705-108 = "……況且這對女僕來說，也是不可或缺的素養。"
2005705-109 = "但是那終究只是別人的期望，而不是源自於我的內心。"
2005705-110 = "……畢竟在我內心深處究竟有什麼，連我自己也還不太清楚。"
2005705-111 = "所以才會感到空虛吧。無論聊了多少天，說了多少得體的話……"
2005705-112 = "……始終很難再向前一步。"
2005705-113 = "雖然明白那堵看不見的牆是我自己建立的……#n但時至今日，我依舊不清楚該如何跨過去。"
2005705-114 = "即便試著像[USERNAME]同學說的那樣嘗試主動接近他人，#n也確實感受到了某些東西正在一點一滴地改變……"
2005705-115 = "然而在我心裡，卻始終有股那終究只是權宜之計的想法。"
2005705-116 = ""
2005705-118 = ""
2005705-119 = "……對不起。[USERNAME]同學。"
2005705-120 = "你那麼努力為我著想，我卻只能說出這種話。"
2005705-122 = "……總覺得好像辜負了[USERNAME]同學為我做的一切。"
2005705-123 = ""
2005705-126 = "為什麼我總是這樣……"
2005705-129 = "[ns] 「你願意把這些告訴我，我就很高興了。」"
2005705-130 = "……？"
2005705-131 = "那，那是因為……"
2005705-132 = "……因為[USERNAME]同學是特別的。"
2005705-133 = "是為數不多……可以傾訴這些話的……"
2005705-134 = "或許，是唯一的……"
2005705-135 = "那樣的對象……"
2005705-136 = "[s5] 「嗯。就讓我們試著慢慢增加那樣的人吧。」\n[s6] 「雖然肯定會花費很多時間，過程也會很辛苦。」\n[s7] 「而且，我其實也不太擅長這種事。」"
2005705-140 = "[USERNAME]同學也不擅長……？"
2005705-141 = "……"
2005705-142 = "說的也是……"
2005705-143 = "仔細想想，[USERNAME]同學在各種意義上，好像也一直不擅長這種事呢……"
2005705-144 = "[s] 「所以朱音剛才願意對我說出那些話，我真的很開心。」"
2005705-145 = "……"
2005705-146 = "呵呵。"
2005705-147 = "我偶爾會這樣想。"
2005705-148 = "如果我們以稍微不同的方式……在不同的時間，以不同的關係相遇。"
2005705-149 = "那樣的話……我們會以什麼樣的方式生活下去呢。"
2005705-150 = "[s] 「某種意義上來說，那不就是我們現在的樣子嗎？」"
2005705-151 = "呵呵呵。"
2005705-152 = "沒錯。現在確實是這樣的呢。"
2005705-153 = "……"
2005705-154 = "那個……[USERNAME]同學。"
2005705-155 = "[s] 「嗯？」"
2005705-156 = "請你暫時保持那樣不要動哦。"
2005705-157 = ""
2005705-160 = "（正想反問為什麼的時候──）"
2005705-161 = ""
2005705-164 = "嘿♬"
2005705-165 = "[ns] 「！！？？！！！！！？？？」"
2005705-166 = "（所有感官……都如字面意義上地被「朱音」所填滿……！）"
2005705-167 = "噓──"
2005705-168 = "這裡雖然是空教室，但說不定會被剛好路過的人看見的哦。"
2005705-169 = ""
2005705-172 = "……謝謝你，[USERNAME]同學。"
2005705-173 = "謝謝你那樣對我說。"
2005705-174 = "也謝謝你願意聽我說。"
2005705-175 = "我真的很開心。"
2005705-176 = "嗯……這是我最真實的想法。"
2005705-178 = "……"
2005705-179 = "[s]「……」"
2005705-180 = "您好，老師。"
2005705-181 = "[s] 「嗨，朱音。」"
2005705-184 = "― [log=아카네 교복]呵呵。[/log][wa:350] "
2005705-187 = "― [log=아카네 교복]比想像中……[/log]"
2005705-189 = "― [log=아카네 교복]還要害羞呢。[/log]"
2005705-192 = "― [log=아카네 교복]對自己坦誠……[/log][wa:4090] "
2005705-194 = "― [log=아카네 교복]實在是種難以習慣的感覺。[/log][wa:1380] "
2005705-197 = "[ns] 「畢，畢竟是第一次嘗試嘛……？」"
2005705-198 = "― [log=아카네 교복]是的，就像您說的一樣。[/log][wa:1810] "
2005705-201 = "― [log=아카네 교복]我想這對我來說，[/log]"
2005705-203 = "― [log=아카네 교복]是必須經歷的過程。[/log]"
2005705-206 = "― [log=아카네 교복]一直以來給老師添了許多麻煩。[/log][wa:3420] "
2005705-209 = "― [log=아카네 교복]即便如此，與老師相遇的我，果然還是──[/log][wa:5010] "
2005705-212 = "― [log=아카네 교복]嗯，真的很幸運。[/log][wa:3270] "
2005705-215 = "― [log=아카네 교복]一切都會流逝，[/log][wa:2010] "
2005705-217 = "― [log=아카네 교복]總有一天都會被遺忘吧。[/log][wa:80] "
2005705-220 = "― [log=아카네 교복]就連現在這個瞬間，總有一天也會……[/log][wa:3600] "
2005705-223 = "― [log=아카네 교복]不過，我會記得。[/log][wa:3490] "
2005705-225 = "― [log=아카네 교복]就算老師忘記了也一樣。[/log][wa:1200] "
2005705-228 = "― [log=아카네 교복]因為真正重要的事物，[/log]"
2005705-230 = "― [log=아카네 교복]是絕對不會消失的。[/log]"
2005705-233 = "（就像剛進來教室時一樣）"
2005705-234 = "（朱音彷彿從未出現在這裡一般，悄無聲息地消失了）"
2005705-235 = "（雖然一度懷疑這一切會不會都是一場夢）"
2005705-236 = "（然而朱音留下的東西，正沉默地訴說著絕非如此……）"
