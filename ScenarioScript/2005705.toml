2005705-82 = "ฮุฮุ ขอบใจนะ"
2005705-83 = "ในคลาสเรียนเช้านี้น่ะ รู้มั้ยว่าฉันเจออะไรมา..."
2005705-86 = "(แล้วอาคาเนะก็เล่าเรื่องต่ออย่างสนุกสนานและเป็นธรรมชาติ)"
2005705-87 = "(จนคุณครูรู้สึกเหมือนตัวเองได้เป็นเพื่อนร่วมชั้นของอาคาเนะไปแล้วจริงๆ...)"
2005705-90 = "นั่นสินะ... ในเมื่อทำแบบนี้ได้ แล้วทำไมที่ผ่านมาฉันถึงพยายามรักษาระยะห่างโดยไม่รู้ตัวมาตลอดนะ?"
