2005705-1 = "ในจุดที่ยืนเคียงข้างกัน"
2005705-6 = "(คุณครูเดินทางไปยังสถานที่ที่นัดแนะกับอาคาเนะไว้)"
2005705-7 = "(ที่นี่เป็น... ห้องเรียนเปล่า... แปลกๆ... ที่ดูจะไม่มีใครอยู่เลย...)"
