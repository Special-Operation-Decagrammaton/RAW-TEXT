[translation]
2005705-1 = "나란히 선 자리에서"
2005705-6 = "(아카네와 만나기로 약속한 장소에 도착했다.)"
2005705-7 = "(뭔가…… 이상하게…… 인기척이 느껴지지 않는, 빈 교실이었다…….)"
2005705-12 = "누구게요?"
2005705-13 = "[s] \"?!?!?!\""
2005705-15 = "[ns] \"아, 아카네??!!\""
2005705-16 = "네. 정답이에요."
2005705-19 = "어서 오세요. 선생님. 후훗."
2005705-20 = "어머나…… 너무 놀라게 해 드렸나 봐요. 죄송해요."
2005705-21 = "[s1] \"그건 괜찮아.\"\n[s2] \"그런데 이 교실은 뭔가 빈 곳 같은데?\""
2005705-24 = "네. 이 교실은……."
2005705-25 = "……."
2005705-26 = "앞으로 두 시간 정도는 저만 사용할 수 있도록 신청해 뒀으니까, 아무도 오지 않을 거예요."
2005705-27 = "어머나? 왜 그렇게 당황하시죠?"
2005705-28 = "혹시 저를…… 믿지 못하시나요?"
2005705-29 = "[s] \"아니야! 믿어! 믿는데 말이야! 그런데……!\""
2005705-30 = "그렇죠? 그러면 아무 문제 없는 것 아닐까요?"
2005705-36 = "저 역시 그 누구보다도 선생님을 믿고 있으니까, 말이에요."
2005705-37 = "(아카네의 친근한 목소리에, 천천히 고개를 끄덕일 수밖에 없었다…….)"
2005705-40 = "빈 교실로 선생님을 부른 이유요? 그러니까……."
2005705-41 = "선생님께서 지도해 주신 덕분에, 제가 다른 아이들을 대하는 방식이 변할 수 있게 되었다고 말씀드렸잖아요?"
2005705-42 = "하지만 그 모습을 어쩐지…… 선생님에게는, 선생님에게만 조금 더 특별한 방식으로 전해 드리고 싶어서……."
2005705-43 = "[s3] \"하지만 그러면…… 둘만 있는 교실에서는.\"\n[s4] \"보여주기…… 어려운 거 아닐까?\""
2005705-46 = "거기에서, 저는 이렇게 생각했어요."
2005705-47 = "백 번 듣는 것보다, 한 번 보는 게 더 낫다고 하잖아요?"
2005705-48 = "그러니까 선생님께 그런 저를…… 직접 느끼게 해 드려야겠다고 생각했답니다."
2005705-49 = "어떻게, 냐고요?"
2005705-50 = "후후."
2005705-54 = "선생님."
2005705-55 = "지금, 이 교실에서 잠시만이라도."
2005705-56 = "저의, '동급생'이 되어 주실 수 있으실까요?"
2005705-60 = "[ns] \"!?!?!!!!!\""
2005705-63 = "(그렇게, 아카네와 '동급생 역할극(?)'을 하기로 했다.)"
2005705-64 = "(……이것이 과연 학생에게 있어 옳은 교육적 지도인 것인지를 계속 고민하던 중…….)"
2005705-69 = "누구~게?"
2005705-70 = "[s] \"아카네……?\""
2005705-71 = "응. 정답."
2005705-76 = "왜 그래?"
2005705-77 = "[USERNAME] 씨?"
2005705-78 = "여러 가지 묻고 싶지만, 안경 말이야?"
2005705-79 = "으음~ 역시 조금 이미지 체인지라고 할까?"
2005705-80 = "그렇지만 조금 섭섭할지도? [USERNAME] 씨는, 안경을 쓰지 않은 나는, 내가 아닌 것 같다고 생각하는 거야?"
2005705-81 = "[s] \"절대로 그렇지 않습니다.\""
2005705-82 = "후후. 고마워."
2005705-83 = "오전 수업에서는 말이지. 이런 일이 있었는데……."
2005705-86 = "(아카네는 정말로 즐겁고 자연스럽게 이야기를 이어 나갔다.)"
2005705-87 = "(……정말로 자신이 아카네의 동급생이 된 것 같은 느낌이 들 정도였다.)"
2005705-90 = "……그렇네. 왜 이렇게 할 수 있었으면서, 그동안 무의식적으로 거리를 두려고 했던 걸까, 라는 거지?"
2005705-91 = "……."
2005705-92 = "사실 나는, 지금도 그렇게 자신이 없어."
2005705-93 = "지금 [USERNAME] 씨에게 보여 주고 있는 활기찬 모습도, 내가 만들어낸 나 자신인 것은 아닐까, 같은 생각을 하고 있거든."
2005705-94 = "……모습을 꾸며 내는 것은, 어떻게 보면 당연한 일이기도 하잖아?"
2005705-95 = "나는 아마도……. 무서운 걸 거야."
2005705-96 = "[s] \"모두가 아카네의 진짜 모습이 무엇인지 알게 되는 게?\""
2005705-97 = "비슷하지만…… 조금 다를지도."
2005705-102 = "……모두가, 나 자신이 누구인지, '내가 모르고 있다는걸' 알게 되는 게."
2005705-103 = "다른 사람의 기대에 맞추는 건, 할 수 있는 일."
2005705-104 = "하지만 내가 누구인지 알아 가는 건, 아무리 해도 답이 보이지 않는 일."
2005705-107 = "나는…… 상황에 맞는 말은 그럭저럭 할 줄 안다고 생각해. 그 사람이 기분 나쁘지 않아 할 말을 고른다든가, 그런 거."
2005705-108 = "……메이드에게 있어서는, 필수 소양이기도 하고."
2005705-109 = "하지만 그건 다른 사람이 바라는 것일 뿐, 내 안에 있는 것을 꺼내서 보여주는 것이 아니지."
2005705-110 = "……내 안에 무엇이 있는지는, 나도 아직 잘 모르고 있기도 하고."
2005705-111 = "그래서, 공허한 걸 거야. 아무리 이야기를 나누고, 상황에 맞는 말을 해도."
2005705-112 = "……거기에서 좀처럼, 그 이상으로 나아갈 수가 없어."
2005705-113 = "투명한 벽을 만들고 있는 것이 나 자신이라는 걸 알지만, 아직도…… 그걸 어떻게 넘어갈 수 있을지 잘 모르겠어."
2005705-114 = "[USERNAME] 씨의 말대로 내가 먼저 다가가 보고 있기도 하지만, 그래서 조금씩 무언가가 바뀌고 있다는 느낌도 들지만……."
2005705-115 = "그게 어째서인지, 임시방편에 지나지 않는다는 생각이 들기도 하거든."
2005705-119 = "……미안해. [USERNAME] 씨."
2005705-120 = "그렇게 열심히 애써 줬는데, 이런 말밖에는 하지 못해서."
2005705-122 = "………[USERNAME] 씨가 노력해 준 걸, 수포로 만들어 버리는 것 같아서."
2005705-126 = "왜 나는, 항상 이런 식인 걸까……."
2005705-129 = "[ns] \"그래도 이런 이야기를 해 줘서, 고마워.\""
2005705-130 = "……?"
2005705-131 = "그, 그건……."
2005705-132 = "………[USERNAME] 씨는, 특별하니까."
2005705-133 = "이런 말을 털어놓아도 괜찮은…… 얼마 안 되는……."
2005705-134 = "아마도 유일한……."
2005705-135 = "그런, 사람이니까……."
2005705-136 = "[s5] \"응. 그러니까 그런 사람을, 조금씩만 더 늘려 가 보자.\"\n[s6] \"물론 시간이 오래 걸리고, 힘들겠지만.\"\n[s7] \"사실 그런 건, 나도 잘 못하거든.\""
2005705-140 = "……[USERNAME] 씨도……?"
2005705-141 = "……."
2005705-142 = "그렇네……."
2005705-143 = "생각해 보니까 [USERNAME] 씨도, 여러 의미로 그런 걸 못 해 왔겠구나……."
2005705-144 = "[s] \"그래서 아카네가 지금 해 준 말이, 정말로 고마웠어.\""
2005705-145 = "……."
2005705-146 = "후후."
2005705-147 = "있잖아. 난 가끔 이런 생각을 해."
2005705-148 = "우리가 조금 다른 방식으로, 다른 시간에, 다른 관계로 만났다면."
2005705-149 = "그랬다면…… 우리는 어떤 식으로 살아갈 수 있었을까."
2005705-150 = "[s] \"어떻게 보면 지금은, 그렇게 하고 있잖아?\""
2005705-151 = "후후후."
2005705-152 = "그렇네. 지금은 그렇지. 응. 지금은."
2005705-153 = "……."
2005705-154 = "있잖아, [USERNAME] 씨."
2005705-155 = "[s] \"응?\""
2005705-156 = "잠시만, 그 자리에 그렇게 있어 줘."
2005705-160 = "(왜 그러냐고 되물으려던 순간.)"
2005705-164 = "에잇♬"
2005705-165 = "[ns] \"!!??!!!!!???\""
2005705-166 = "(모든 감각이…… 말 그대로 '아카네'로, 가득 들어찼다……!)"
2005705-167 = "쉬잇."
2005705-168 = "빈 교실이지만, 누가 지나가다 우리를 볼지도 모르니까."
2005705-172 = "……고마워, [USERNAME] 씨."
2005705-173 = "그렇게 이야기해 줘서."
2005705-174 = "그리고 이렇게 쭉 내 이야기를 들어줘서."
2005705-175 = "정말로 기뻤어."
2005705-176 = "응……. 진심으로."
2005705-178 = "……."
2005705-179 = "[s] \"…….\""
2005705-180 = "안녕하세요, 선생님."
2005705-181 = "[s] \"응. 안녕, 아카네.\""
2005705-184 = "[wa:350]― [log=아카네 교복]후후.[/log]"
2005705-187 = "― [log=아카네 교복]생각했던 것보다……[/log]"
2005705-189 = "― [log=아카네 교복]부끄러운 일이네요.[/log]"
2005705-192 = "[wa:1530]― [log=아카네 교복]자신에게, [wa:2200]솔직해진다는 것……[/log]"
2005705-194 = "― [log=아카네 교복]도저히 [wa:1100]익숙해지지 않는 느낌이에요.[/log]"
2005705-197 = "[ns] \"아, 아무래도 평소에는 안 해 본 일일 테니까……?\""
2005705-198 = "[wa:520]― [log=아카네 교복]네. [wa:1210]말씀하신 대로에요.[/log]"
2005705-201 = "― [log=아카네 교복]저에게는, [/log]"
2005705-203 = "― [log=아카네 교복]정말로 필요한 일이었나 봐요.[/log]"
2005705-206 = "[wa:530]― [log=아카네 교복]여러모로 [wa:1590]실례가 [wa:860]많았습니다. 선생님.[wa:160] [/log]"
2005705-209 = "― [log=아카네 교복]그렇지만 저는 역시, [wa:1490]선생님을 만나서 [wa:3240]정말로[wa:40] [/log]"
2005705-212 = "― [log=아카네 교복]네. [wa:1240]행운이었다고 [wa:1390]생각해요.[wa:320] [/log]"
2005705-215 = "[wa:1850]― [log=아카네 교복]모든 것은 흘러가고,[/log]"
2005705-217 = "― [log=아카네 교복]어떤 것은 [wa:80]잊히겠죠.[/log]"
2005705-220 = "― [log=아카네 교복]지금 [wa:730]여기에서 있었던 일도, [wa:2630]어쩌면……. [/log]"
2005705-223 = "[wa:1700]― [log=아카네 교복]하지만, [wa:1510]저는 기억하겠어요.[/log]"
2005705-225 = "― [log=아카네 교복]만에 하나 [wa:410]선생님께서 [wa:270]잊으신다고 해도.[wa:80] [/log]"
2005705-228 = "― [log=아카네 교복]정말로 소중한 것들은,[/log]"
2005705-230 = "― [log=아카네 교복]사라지지 않을 테니까요.[/log]"
2005705-233 = "(아카네는 마치 들어왔을 때와 마찬가지로.)"
2005705-234 = "(처음부터 이 자리에 없었던 것처럼 기척 없이 사라졌다.)"
2005705-235 = "(모든 것이 꿈이었던 것은 아니었을까, 같은 생각도 잠시 들었지만.)"
2005705-236 = "(아카네가 남긴 것들이, 결코 그건 아니었다고 무언으로 이야기하고 있었다…….)"
