[translation]
70014010-1 = "เส้นทางอันสับสนของหมอยา 1"
70014010-2 = "(ในที่สุดก็มาจนได้...)"
70014010-3 = "(มาถึงตรอกลึกของตลาดมืด... เพียงคนเดียว!)"
70014010-4 = ""
70014010-12 = "(ถึงจะรวบรวมความกล้ามาที่นี่แล้วก็เถอะ...)"
70014010-13 = "(ถ้าเกิดเรื่องขึ้นมา คงโดนเด็กๆ คนอื่น... โดยเฉพาะเด็กๆ จากองค์การนักเรียนดุยับแน่...)"
70014010-14 = ""
70014010-18 = "[ns] \"?!\""
70014010-19 = ""
70014010-20 = ""
70014010-21 = ""
70014010-23 = "เจอตัวแล้ว!"
70014010-25 = "ได้ข่าวว่ามีคนนอกกล้าบุกเข้ามาถึงนี่ สรุปว่าเป็นเรื่องจริงสินะ!"
70014010-26 = "โอ้... ดูเหมือนจะพยายามทำตัวให้ดูเป็น 'คนแถวนี้' อยู่นะเนี่ย?"
70014010-27 = "ทำไปก็เท่านั้นแหละ สุดท้ายก็ดูออกหมดอยู่ดี! ที่นี่น่ะ มีบางอย่างที่พวกคนนอกไม่มีวันเลียนแบบได้... เอาเป็นว่ามันมีกลิ่นอายของมันน่ะ กลิ่นอายแบบนั้นไง!"
70014010-28 = "ลากตัวไปกันเถอะ! แล้วก็... เอ่อ... คือว่า..."
70014010-29 = ""
70014010-31 = ""
70014010-32 = "ใช่! เอาเจ้านี่เป็นตัวประกัน แล้วรีดเงินก้อนโตกันเลย!"
70014010-33 = "พวกคนนอกต้องมีเงินเยอะแน่!"
70014010-34 = "อยู่นิ่งๆ ซะ ถ้ายอมทำตามที่บอกแต่โดยดี ก็อาจจะรอดไปได้ก็ได้ คิกคิก..."
70014010-35 = ""
70014010-36 = "[ns1] (นึกว่าเตรียมตัวมาดีที่สุดเท่าที่ทำได้แล้วแท้ๆ...!)\n[ns2] (ต้องโดนดุยับแน่เลย...)"
70014010-39 = ""
70014010-44 = "ลากตัวมาถึงนี่แล้ว เอาไงต่อดีล่ะ?"
70014010-45 = "ก่อนอื่นก็... ใช่แล้วละ! ค้นรายชื่อติดต่อก่อน!"
70014010-47 = "ได้เลย แล้วก็หาคนที่ 'น่าจะเจรจาด้วยได้' จากรายชื่อนั้น... คิกคิกคิก..."
70014010-48 = "เอ๋? แต่ว่า...?"
70014010-49 = "เป็นอะไรไป?"
70014010-50 = "เปล่า ไม่มีอะไร..."
70014010-51 = "อะไรของแกเนี่ย"
70014010-52 = ""
70014010-54 = ""
70014010-55 = ""
70014010-57 = "(ทำไมรู้สึกว่าคนนี้ดูคล้าย 'คุณครู' ของชาเล่ต์ที่เคยได้ยินแต่ข่าวลือเลยนะ...?)"
70014010-58 = "(ไม่น่าใช่หรอก คุณครูคนนั้นจะมาที่แบบนี้ในสภาพแบบนี้ไปทำไมกัน)"
70014010-59 = ""
70014010-61 = "เอาเถอะ ถ้าเรื่องนี้ไปได้สวย... พวกเราก็คงทำเงินก้อนโตได้ละเนอะ?"
70014010-62 = "เตรียมตัวฉลอง! เตรียมตัวปาร์ตี้! วะฮ่าฮ่าฮ่า!"
70014010-63 = "หนวกหูชะมัด"
70014010-64 = ""
70014010-66 = ""
70014010-67 = ""
70014010-69 = ""
70014010-71 = ""
70014010-73 = ""
70014010-74 = ""
70014010-75 = ""
70014010-76 = "เห็นแถวนี้เสียงดังเอะอะ ฉันก็เลยออกมาดู ที่แท้ก็พวกตัวกระจอกนี่เอง"
70014010-77 = "[ns] \"...?\""
70014010-78 = "...?"
70014010-79 = "[s] \"ไค?\""
70014010-80 = "ครู?!"
70014010-81 = "[s] \"ทำไมไคถึงมาอยู่ที่นี่ได้?!\""
70014010-82 = "ฉันต่างหากที่อยากถามครู มาเจอกันในที่แบบนี้เนี่ยนะ..."
70014010-87 = "พอจะเข้าใจแล้ว... ถึงตอนนี้จะยังบอกเหตุผลไม่ได้ แต่ครูมีธุระบางอย่างในตลาดมืดสินะ"
70014010-88 = "หึหึหึ... ฉันไม่ได้สนใจเหตุผลของครูตั้งแต่แรกอยู่แล้ว ฉันก็แค่มา 'เก็บกวาด' แถวนี้เท่านั้นเอง"
70014010-89 = ""
70014010-91 = ""
70014010-92 = "โอ้? ทำหน้าสงสัยว่าทำไมฉันถึงอยู่ในตลาดมืด แทนที่จะอยู่สำนักควบคุมสินะ ครู?"
70014010-93 = "อื้อ... หลังจากวันนั้น ฉันถูกส่งตัวไปสำนักควบคุมจริงๆ"
70014010-94 = "โดยฝีมือของครูเอง ไม่ใช่ใครที่ไหนด้วย"
70014010-95 = "อืม... คนทั่วไปเรียกเวลาแบบนี้ว่า 'เวลาแห่งการแก้แค้น' สินะ?"
70014010-96 = "[s] \"...!\""
70014010-97 = "ฮ่าฮ่าฮ่าฮ่า! สีหน้าไม่เลวเลยนี่ ดีละ คราวนี้ฉันจะเห็นแก่สีหน้านั้น แล้วยอมปล่อยผ่านให้แล้วกัน"
70014010-98 = "แหมๆ ความรู้สึกที่ได้กุมคนระดับครูไว้ในมือนี่มันก็ไม่เลวเท่าไรนะ"
70014010-99 = "(คุณครูตัดสินใจว่า... ตอนนี้ไม่ทำให้ไคอารมณ์เสียดีกว่า...)"
70014010-101 = "ระหว่างการเดินทาง ฉันยังถูกควบคุมตัวอยู่ในรถขนส่งของสำนักควบคุมจริงๆ"
70014010-102 = "เพียงแต่เมื่อการคุมตัวสิ้นสุดลง สถานที่ที่ฉันได้ลงจากรถ กลับไม่ใช่สำนักควบคุมเท่านั้นเอง..."
70014010-103 = ""
70014010-108 = ""
70014010-110 = ""
70014010-112 = "เจ้าหน้าที่คุมตัวก็เป็นคนอื่นที่ปลอมตัวเป็นนักเรียนโรงเรียนวัลคิรี่ตั้งแต่แรก ส่วนเอกสารที่เกี่ยวข้องก็#nดูเหมือนถูกสับเปลี่ยนระหว่างทางเช่นกัน"
70014010-113 = "'คนคนนั้น' คงคิดว่าการทำแบบนี้จะทำให้ฉันติดหนี้บุญคุณ ซึ่งก็ไม่ใช่ความเข้าใจที่ผิดนัก..."
70014010-114 = "อย่างไรเสีย สิ่งที่เรียกว่า 'คำมั่น' ก็เป็นสิ่งสำคัญ..."
70014010-115 = ""
70014010-116 = "[ns] \"คนคนนั้นเหรอ...?\""
70014010-117 = "หึหึ... สงสัยเหรอ ครู? แต่ตอนนี้ฉันพูดถึงคนคนนั้นตามใจชอบไม่ได้หรอก"
70014010-118 = "เพราะเรื่องนั้นก็นับรวมอยู่ในขอบเขตของคำมั่นได้เช่นกัน"
70014010-119 = "แต่ก็ไม่แน่ ถ้าครูผูกคำมั่นครั้งใหม่กับฉัน คำมั่นที่สำคัญยิ่งกว่าของคนคนนั้นละก็..."
70014010-120 = "ไม่แน่ว่าสถานการณ์มันอาจจะเปลี่ยนไปตามประเด็นและมุมมองก็ได้นะ"
70014010-121 = "ก็เหมือนในขั้นพัฒนายาตัวใหม่ ที่ผลลัพธ์จะแตกต่างกันไปราวฟ้ากับเหว ตามสัดส่วนการผสมของ#nสารออกฤทธิ์เดิมนั่นแหละ หึหึหึ..."
70014010-122 = "[s] \"ถ้างั้น ที่ผ่านมาก็อยู่ในตลาดมืดมาตลอดเหรอ?\""
70014010-123 = "ไม่ใช่แบบนั้นหรอก ถึงจะมองได้ว่าตลาดมืดเป็นสถานที่ที่ปลอดภัยที่สุดให้ฉันซ่อนตัว..."
70014010-124 = "แต่เรื่องอย่างการจัดหาวัตถุดิบหรือสารเคมีสำหรับการทดลองก็ยังมีข้อจำกัดอยู่มาก"
70014010-125 = "พูดง่ายๆ คือ ฉันใช้นามแฝงหนึ่ง... แล้วแสร้งทำตัวเป็นหมอพเนจรอยู่"
70014010-126 = "ระหว่างนั้นก็เคยไปพึ่งพาเฮียกคิยาโคอยู่ช่วงหนึ่งด้วย"
70014010-127 = "[s] \"อย่างน้อยตอนนั้นก็ดูเหมือนจะไม่ได้ 'ก่อเรื่อง' สินะ...\""
70014010-128 = "ก็ตอนนั้นมันจำเป็นต้องทำแบบนั้นน่ะสิ"
70014010-129 = ""
70014010-131 = ""
70014010-132 = "เอาละ... มาถึงแล้ว ที่นี่คือ... 'ที่พัก' ที่ฉันฝากตัวอาศัยอยู่ในตอนนี้ ตามมาสิ"
70014010-134 = "(คุณครูเดินตามไคขึ้นบันไดที่มืดและทรุดโทรม)"
70014010-135 = ""
70014010-142 = "[ns] \"...\""
70014010-144 = "[ns] \"มาพักอยู่ในที่แบบนี้สินะ\""
70014010-145 = "ถ้าจะพูดให้ถูก ต้องบอกว่า 'อาศัยบ้านเขาอยู่' มากกว่า"
70014010-147 = "(ในจังหวะที่กำลังจะถามว่าหมายความว่าอะไร)"
70014010-148 = "(หญิงชราคนหนึ่งก็เดินออกมาอย่างยากลำบาก)"
70014010-149 = ""
70014010-151 = ""
70014010-155 = "อ้าว ไคกลับมาแล้วเหรอ..."
70014010-156 = "แค่ก... แค่ก..."
70014010-157 = "หืม? แล้วคนนี้คือใครกันล่ะ?"
70014010-158 = "ก็ประมาณว่าเป็นแขกน่ะ"
70014010-159 = "ไคพาแขกมาด้วยแบบนี้ ช่างเป็นเรื่องหายากจริงๆ เลยนะ"
70014010-160 = "แต่ว่า... เพราะแบบนั้นถึงยิ่งวางใจได้สินะ ถ้าเป็นคนอันตราย ก็คงไม่ถูกพาเข้ามาตั้งแต่แรกหรอก"
70014010-161 = "แค่ก... แค่ก... แค่ก...!"
70014010-162 = "ขอโทษนะ... ดูเหมือนร่างกายฉันจะยังไม่แข็งแรงดี ถึงอย่างนั้นก็ได้เธอช่วยไว้ ถึงได้ประคองอาการได้แบบนี้..."
70014010-163 = "รู้อยู่แล้วละ เข้าไปพักผ่อนก่อนเถอะ"
70014010-164 = "อืม เห็นทีคงต้องเป็นอย่างนั้น..."
70014010-165 = "ถึงจะเป็นที่ซอมซ่อไปบ้าง แต่ก็ค่อยๆ คุยกันตามสบายเถอะนะ"
70014010-166 = "ขอโทษด้วยนะที่บ้านอยู่ในสภาพนี้... แต่อย่างน้อย ระหว่างอยู่ที่นี่ก็พักให้สบายล่ะ"
70014010-167 = ""
70014010-169 = ""
70014010-172 = "(หญิงชราเดินกะเผลกเข้าไปด้านในห้อง)"
70014010-173 = "(ไม่นานก็ได้ยินเสียงกรนอย่างเหนื่อยล้า)"
70014010-174 = ""
70014010-176 = ""
70014010-177 = "[ns] \"คนคนนั้นคือใครเหรอ?\""
70014010-178 = "อืม คงต้องบอกว่าเป็นเจ้าของบ้านนี้น่ะ"
70014010-179 = "เห็นว่าเธอเคลื่อนไหวไม่สะดวกงั้นเหรอ? ใช่ เป็นอย่างที่เห็นนั่นแหละ ตอนนี้แค่เดินออกนอกบ้านยังลำบากเลย"
70014010-180 = "ถ้าจะสรุปสั้นๆ เธอเป็นโรคคล้ายข้ออักเสบรูมาตอยด์ และมีปัญหาที่ปอดกับหลอดลมด้วย"
70014010-181 = "ก่อนฉันมาที่นี่ เธออาการหนักกว่านี้อีก"
70014010-182 = "ตอนนี้ฉันกำลังประคองอาการ ให้อยู่ในระดับที่ดีกว่าตอนนั้นนิดหน่อยน่ะ..."
70014010-183 = ""
70014010-185 = ""
70014010-186 = "โอ้ ทำหน้าโล่งใจว่าตอนนี้เป็นแค่โรคข้ออักเสบสินะ ครู?"
70014010-187 = "แต่รู้หรือเปล่า? โดยแก่นแท้แล้ว รูมาตอยด์คือโรคภูมิคุ้มกันทำลายตนเอง"
70014010-188 = "เป็นโรคที่เกิดจากระบบภูมิคุ้มกันของร่างกายโจมตีเซลล์ปกติของตัวเอง แทนที่จะโจมตีแอนติเจนจากภายนอก"
70014010-189 = "พูดให้เข้าใจง่ายกว่านั้นก็คือ โรคที่ตัวเองทำลายตัวเอง"
70014010-190 = "ข้อต่อเป็นเพียงจุดที่แสดงอาการก่อนเท่านั้น ถ้าไม่นับกระดูกสันหลัง ก็ไม่มีส่วนไหนวางใจได้ ทั้งหัวใจ ปอด หรือแม้แต่เลือดก็อาจได้รับผลกระทบไปด้วย"
70014010-191 = "และหากโรคลุกลามเร็วมากและโชคร้าย ก็มีโอกาสพัฒนาไปเป็นมะเร็งต่อมน้ำเหลืองได้"
70014010-192 = "[s] \"ระ... ร้ายแรงขนาดนั้นเลยเหรอ?!?!\""
70014010-193 = "แต่ถึงอย่างนั้น กรณีที่โรคลุกลามไปถึงขั้นนั้นจริงๆ ก็พบได้น้อยมากเหมือนกัน"
70014010-194 = "[s3] \"อย่าทำให้กลัวสิ มันรักษาไม่ได้ใช่มั้ย...\"\n[s4] \"หมายความว่าไม่มีวิธีรักษาที่ต้นเหตุสินะ\""
70014010-197 = "ก็ไม่นะ?"
70014010-198 = "[s] \"ว่าไงนะ...?!\""
70014010-199 = "โดยพื้นฐานแล้ว การรักษารูมาตอยด์เป็นการรักษาตามอาการ โดยใช้สเตียรอยด์หรือยาต้านการอักเสบ"
70014010-200 = "ในบางกรณี ยังมีวิธีใช้ยาปฏิชีวนะที่ค่อนข้างแรง เพื่อเบี่ยงปฏิกิริยาภูมิคุ้มกันของร่างกายไปทางอื่น"
70014010-201 = "แต่ไม่ว่าจะวิธีไหน ก็เป็นเพียงการแก้ปัญหาเฉพาะหน้าเท่านั้นนั่นละ"
70014010-202 = "ถ้าเป็นกรณีทั่วไปก็เป็นอย่างนั้น ถ้าเป็นกรณีทั่วไปน่ะนะ แต่สำหรับฉัน คำว่า 'ทั่วไป' มันใช้ไม่ได้หรอก"
70014010-203 = "หึหึหึ... ฉันรู้อยู่แล้วละว่าครูกำลังจะพูดอะไร สีหน้าของครูน่ะอ่านง่ายออกจะตายไป"
70014010-204 = "อยากถามว่า 'ถ้าเป็นฉันแล้วละก็ จะรักษาโรคของยายแก่คนนั้นให้หายขาดได้หรือเปล่า' สินะ?"
70014010-205 = "และคำตอบของฉันก็คือ 'ได้'"
70014010-206 = "[s] \"แต่เห็นบอกว่าตอนนี้แค่ประคองอาการไว้เฉยๆ ไม่ใช่เหรอ...?\""
70014010-207 = "ใช่ ก็เพราะอย่างนั้น ฉันถึงได้กำลังคิดถึงขั้นต่อไปอยู่พอดี"
70014010-208 = "เมื่อไม่นานมานี้ ฉันได้คำมั่นข้อหนึ่งจากยายแก่คนนั้นมาน่ะ"
70014010-209 = ""
70014010-211 = ""
70014010-212 = "มันคืออะไรน่ะเหรอ? ก็คงจะประมาณนี้"
70014010-213 = "\"ร่างกายของฉันเองก็ไม่แข็งแรง และไม่มีวี่แววว่าจะดีขึ้นด้วย เพราะงั้นก็เอาบ้านหลังนี้ไปก็ได้\""
70014010-214 = "ฉันก็เลยกำลังคิดแบบนี้อยู่น่ะ"
70014010-215 = "\"ในเมื่อได้กรรมสิทธิ์ในบ้านมาแล้ว ก็คงถึงเวลายุติความสัมพันธ์นี้ได้แล้วหรือเปล่า?\"... อะไรทำนองนั้น"
70014010-216 = "[s] \"แล้วทำไมถึงยังช่วยประคองอาการให้ท่านอยู่ล่ะ...?\""
70014010-217 = "คนเราจะตัดสินใจอย่างมีเหตุผลมากกว่ากัน ในตอนสุขภาพดีหรือตอนเจ็บป่วยล่ะ?"
70014010-218 = "ระหว่างยายแก่คนนั้นกลับมาแข็งแรง กับยังอยู่ในสภาพเจ็บป่วยต่อไป"
70014010-219 = "เมื่ออยู่ในสภาพไหน เธอถึงจะมีโอกาสยกกรรมสิทธิ์ในที่พักแห่งนี้ให้ฉันมากกว่ากันนะ...?"
70014010-220 = "[s] \"...!!!\""
70014010-221 = "ก็ประมาณนั้นแหละ ตอนนี้คงถือได้ว่าเป้าหมายเล็กๆ ของฉันสำเร็จแล้ว"
70014010-222 = "ครูคิดจะดูแคลนฉันงั้นเหรอ? ก็ตามใจ ฉันไม่ได้ใส่ใจเรื่องแบบนั้นเท่าไรหรอก"
70014010-223 = "ฉันก็เป็นคนแบบนี้ มาถึงตอนนี้แล้ว ก็ไม่ได้คิดจะปิดบังความจริงข้อนั้นเป็นพิเศษหรอก ถึงจะไม่ได้จงใจเที่ยวเปิดเผยให้ใครรู้ก็เถอะ"
70014010-224 = "ยังไงซะการทำแบบนั้น มันก็มีแนวโน้มที่จะส่งผลเสียต่อฉันมากกว่า"
70014010-225 = "[s] \"แต่ก็ทำให้ท่านกลับมาแข็งแรงได้ใช่มั้ย?\""
70014010-226 = "หืม...?"
70014010-227 = "ถ้าจะถามแค่ว่าทำได้หรือไม่ได้ ก็ทำได้อยู่แล้ว"
70014010-228 = ""
70014010-230 = ""
70014010-231 = "หืม? ถ้างั้นจะขอให้ฉันทำแบบนั้นเหรอ?"
