[translation]
70014010-1 = "藥師的徬徨（１）"
70014010-2 = "（……結果還是來了）"
70014010-3 = "（一個人……來到了黑市的深處！）"
70014010-4 = ""
70014010-12 = "（雖然下了不小的決心才來到這裡……）"
70014010-13 = "（萬一出了意外，肯定會被其他孩子……#n　尤其是聯邦學生會的孩子們狠狠罵一頓的吧……）"
70014010-14 = ""
70014010-18 = "[ns]「！？」"
70014010-19 = ""
70014010-20 = ""
70014010-21 = ""
70014010-23 = "找到了！"
70014010-25 = "聽說有個外地人不知天高地厚地闖到這裡來，居然是真的啊！"
70014010-26 = "哦……看來還挺用心想裝成「這裡的人」嘛？"
70014010-27 = "可惜終究還是被我給看穿了！#n這裡可是有種外頭的傢伙絕對模仿不來的……總之就是那種感覺，那種感覺啦！"
70014010-28 = "把他給我帶走！#n然後……呃……那個……"
70014010-29 = ""
70014010-31 = ""
70014010-32 = "對了！把這傢伙當成人質，狠狠海撈一筆！"
70014010-33 = "外頭的傢伙肯定很有錢的！"
70014010-34 = "給我安分一點。只要乖乖聽話，說不定還能平安無事。嘿嘿嘿……"
70014010-35 = ""
70014010-36 = "[ns1] （還以為自己已經盡了最大的努力做好準備……！）\n[ns2] （這下肯定會被狠狠罵一頓……）"
70014010-39 = ""
70014010-44 = "姑且是把人拖到這裡來了，不過接下來該怎麼辦？"
70014010-45 = "首先把這傢伙的……對了！先把聯絡人清單給挖出來！"
70014010-47 = "沒錯。從裡頭找出「像是能談生意的」人……嘿嘿嘿……"
70014010-48 = "咦？可是……？"
70014010-49 = "怎麼了？"
70014010-50 = "不，沒什麼……"
70014010-51 = "什麼嘛，真沒意思。"
70014010-52 = ""
70014010-54 = ""
70014010-55 = ""
70014010-57 = "（總覺得這個人，看起來有點像只在傳聞中聽過的「夏萊的老師」……？）"
70014010-58 = "（算了，怎麼可能。那個老師哪會跑來這種地方，而且還落得這副德性嘛）"
70014010-59 = ""
70014010-61 = "總之只要這件事順利進行……我們也能大賺一筆吧？"
70014010-62 = "是時候辦慶典開Party囉！哈哈哈！"
70014010-63 = "吵死了。"
70014010-64 = ""
70014010-66 = ""
70014010-67 = ""
70014010-69 = ""
70014010-71 = ""
70014010-73 = ""
70014010-74 = ""
70014010-75 = ""
70014010-76 = "聽到附近鬧哄哄的就出來看看，原來是群不成氣候的小嘍囉啊。"
70014010-77 = "[ns]「……？」"
70014010-78 = "……？"
70014010-79 = "[s] 「誡？」"
70014010-80 = "老師！？"
70014010-81 = "[s] 「誡怎麼會在這裡！？」"
70014010-82 = "這句話應該是我要問老師的才對。#n想不到居然會在這種地方碰上啊……"
70014010-87 = "……我大致明白了。#n雖然不能說明具體原因，總之就是有事要來黑市處理對吧。"
70014010-88 = "咯咯咯……我打從一開始就對老師的理由毫無興趣，只不過是來「清理」附近罷了。"
70014010-89 = ""
70014010-91 = ""
70014010-92 = "哦？老師一副想問「我為何不在矯正局而是待在黑市」的表情呢？"
70014010-93 = "沒錯……那天之後，我確實被送進了矯正局。"
70014010-94 = "而且還不是被別人，是被老師你親手送進去的。"
70014010-95 = "這麼說來……世人一般會把這稱之為「復仇的時刻」對吧？"
70014010-96 = "[s]「……！」"
70014010-97 = "哈哈哈！你的表情可真是精彩啊。#n看在這副表情的份上，這次我就饒你一回吧。"
70014010-98 = "將老師這等人物掌握在自己手中……這種感覺倒也不壞啊。"
70014010-99 = "（眼下……決定暫時不去觸怒誡的心緒……）"
70014010-101 = "沒錯，我確實被矯正局的押送車輛移送著。"
70014010-102 = "只不過押送結束後下車的地點……並非矯正局。"
70014010-103 = ""
70014010-108 = ""
70014010-110 = ""
70014010-112 = "押送人員自始至終都是喬裝成女武神學生的其他人，相關文件也在中途被調了包。"
70014010-113 = "「那個人」想必認為這樣便讓我欠下了人情吧。#n雖然這般認知，倒也不算太過荒唐。"
70014010-114 = "……畢竟所謂的「約定」可是十分重要的。"
70014010-115 = ""
70014010-116 = "[ns] 「『那個人』……？」"
70014010-117 = "咯咯……你好奇嗎，老師？#n可惜如今的我，不能隨意談論與那個人有關的事。"
70014010-118 = "畢竟這也算是約定的範疇之一。"
70014010-119 = "然而這也很難說。#n倘若老師願意與我立下比那個人更為重大的全新約定……"
70014010-120 = "視事態與見解不同，情況也可能隨之改變。"
70014010-121 = "就像在新藥的開發階段，根據既有有效成分的比例不同，結果也會天差地別一樣。#n咯咯咯……"
70014010-122 = "[s] 「那麼，你這段時間一直都待在黑市嗎？」"
70014010-123 = "倒也不是。雖然黑市的確是隱藏個人行蹤最安全的地方……"
70014010-124 = "不過在各種材料與試劑的取得方面，終究還是有許多不便之處。"
70014010-125 = "簡單來說，我運用了某個化名……扮演著行醫的角色。"
70014010-126 = "在此期間，也曾在百鬼夜行承蒙照料。"
70014010-127 = "[s] 「……那段時間，你似乎沒有『闖禍』呢。」"
70014010-128 = "只是因為當時有那個必要而已。"
70014010-129 = ""
70014010-131 = ""
70014010-132 = "來吧……差不多到了。#n這裡……就是我暫時落腳的「住所」。我帶你進去吧。"
70014010-134 = "（跟著誡走上了昏暗老舊的樓梯）"
70014010-135 = ""
70014010-142 = "[ns] 「……」"
70014010-144 = "[ns] 「原來你住在這種地方啊。」"
70014010-145 = "準確來說應該是「寄人籬下」才對。"
70014010-147 = "（正想問那是什麼意思的瞬間）"
70014010-148 = "（一位老人邁著蹣跚的步伐現身了）"
70014010-149 = ""
70014010-151 = ""
70014010-155 = "……哎呀，誡回來啦。"
70014010-156 = "咳咳，咳咳……"
70014010-157 = "嗯？這位是誰呀？"
70014010-158 = "這個嘛，算是客人吧。"
70014010-159 = "誡居然會帶客人回來，可真是難得一見呢。"
70014010-160 = "不過……正因如此，反倒更教人信得過呢。#n假如是危險人物的話，你一開始就不會帶進來了吧。"
70014010-161 = "咳，咳，咳……！"
70014010-162 = "……真是抱歉，身子似乎還是不太對勁。#n想必是多虧有你，我才勉強撐到現在的吧……"
70014010-163 = "知道了。你也差不多該進去休息了吧？"
70014010-164 = "是啊，確實是該休息了……"
70014010-165 = "此處雖然簡陋，還請慢慢聊。"
70014010-166 = "家裡是這副模樣實屬慚愧……不過在這裡的期間，還請安心自在地待著。"
70014010-167 = ""
70014010-169 = ""
70014010-172 = "（老人一瘸一拐地走進了房間深處）"
70014010-173 = "（沒過多久便傳來了疲憊的鼾聲）"
70014010-174 = ""
70014010-176 = ""
70014010-177 = "[ns] 「剛才那位是……？」"
70014010-178 = "應該說是這間屋子的主人吧。"
70014010-179 = "你說他身體看起來有點不方便？#n沒錯。就像你見到的一樣，如今他連走出屋外都十分吃力。"
70014010-180 = "只說結論的話，是類風濕性關節炎之類的病。肺和支氣管也有點問題。"
70014010-181 = "在我來到這裡之前，情況還更嚴重一點。"
70014010-182 = "目前也只是勉強維持著略有改善的現狀罷了……"
70014010-183 = ""
70014010-185 = ""
70014010-186 = "哦？老師剛才似乎露出了「幸好只是關節炎」而安心的表情呢？"
70014010-187 = "不過你知道嗎？#n類風濕的本質，實際上是自體免疫疾病。"
70014010-188 = "也就是人體內部的免疫系統不去攻擊外來抗原，反而攻擊正常細胞所引發的疾病。"
70014010-189 = "如果要說得更簡單一點，就是自己摧毀自己的疾病。"
70014010-190 = "關節只不過是最先顯現症狀的部位而已，除了脊椎之外的任何地方都無法安心。#n就連心臟、肺部，乃至於血液都在波及範圍之內。"
70014010-191 = "如果病情發展迅速又運氣不佳，甚至有惡化為淋巴瘤的可能。"
70014010-192 = "[s] 「有，有那麼嚴重！？！？」"
70014010-193 = "這個嘛，真正惡化到那種地步的情形反而比較罕見就是了。"
70014010-194 = "[s3] 「不要嚇我嘛……」\n[s4] 「那麼，你的意思是沒有辦法根治囉？」"
70014010-197 = "倒也不是？"
70014010-198 = "[s]「什麼……！？」"
70014010-199 = "類風濕的治療，基本上是使用類固醇或抗發炎藥的對症治療。"
70014010-200 = "某些情況下也有使用稍強的抗生素，#n反過來將人體的免疫反應引導至其他地方的方案。"
70014010-201 = "不過無論哪一種方法，終究都只是權宜之計罷了。"
70014010-202 = "一般而言是這樣的，一般而言。#n不過──所謂的「一般」並不適用於我。"
70014010-203 = "咯咯咯……我知道你想說什麼。#n畢竟老師的表情，基本上還挺好懂的。"
70014010-204 = "「如果是我，能不能根治那位老人的病症」──你想這麼問對吧？"
70014010-205 = "針對這個問題，我的回答是「可以做到」。"
70014010-206 = "[s] 「你剛才不是說只是維持著現狀嗎……？」"
70014010-207 = "沒錯。所以我正在思考，是不是該進行下一步了。"
70014010-208 = "因為不久之前，我已經從老人那裡得到了一個約定。"
70014010-209 = ""
70014010-211 = ""
70014010-212 = "問我是什麼約定？"
70014010-213 = "「既然自己身體不便又不見好轉，這間屋子你就拿去吧」──大致上就是這麼回事。"
70014010-214 = "所以我一直在思考……"
70014010-215 = "「反正屋子的所有權已經到手，也差不多該結束這段關係了吧」之類的事。"
70014010-216 = "[s] 「那你之前又為何要幫他維持現狀……？」"
70014010-217 = "人在哪種情況下會做出更合理的判斷？#n是在健康的時候，還是病弱的時候呢？"
70014010-218 = "恢復健康與維持病弱的狀態……"
70014010-219 = "……在哪種狀態下，那位老人把住處所有權交給我的可能性會比較高？"
70014010-220 = "[s] 「……！！！」"
70014010-221 = "嗯，就是這麼回事。#n現在我這個小小的目的，可以說已經達成了吧。"
70014010-222 = "想鄙視我的話就請便吧，老師。我不怎麼在意那種事。"
70014010-223 = "我就是這樣的人。#n事到如今，我也沒打算特別隱瞞，不過倒也不會刻意到處張揚就是了。"
70014010-224 = "因為那對我而言，招致損失的可能性想必更高。"
70014010-225 = "[s] 「可是，你也能讓老人家恢復健康吧？」"
70014010-226 = "哼嗯……？"
70014010-227 = "如果只論做不做得到的話，自然是不成問題。"
70014010-228 = ""
70014010-230 = ""
70014010-231 = "嗯？你是要我那麼做嗎？"
