[translation]
70014010-1 = "The Apothecary Wanderings 1"
70014010-2 = "...So, I arrived."
70014010-3 = "I'd entered the depths of the Black Market...all by myself!"
70014010-4 = ""
70014010-12 = "While I made the big decision to come here..."
70014010-13 = "I knew that if I were to get hurt, the students, especially the General Student Council members, would give me the scolding of a lifetime."
70014010-14 = ""
70014010-18 = "[ns] \"?!\""
70014010-19 = ""
70014010-20 = ""
70014010-21 = ""
70014010-23 = "Gotcha!"
70014010-25 = "I heard some tourist had the nerve to walk all the way down here. Looks like the rumors were right."
70014010-26 = "Well, well... You actually tried to pass as a \"local,\" did ya?"
70014010-27 = "What a joke. You know, REAL residents have a certain vibe to them, a mood, a \"juj-nuh-say...\" Uh. You know, a FEELING!"
70014010-28 = "So let's nab 'em! And...um...then..."
70014010-29 = ""
70014010-31 = ""
70014010-32 = "Right! We'll take you hostage and ransom you for a fortune."
70014010-33 = "A cosmopolitan outsider like this oughta fetch us a few yen, huh?"
70014010-34 = "Now, don't make a fuss, chump. As long as you do what you're told, nobody gets hurt... Heh heh..."
70014010-35 = ""
70014010-36 = "[ns1] \"(I thought I was well-prepared, but...!)\"\n[ns2] \"(...I've set myself up for a legendary scolding!)\""
70014010-39 = ""
70014010-44 = "So we got the hostage secured. What do we do now?"
70014010-45 = "First is...you know...the ransom! We need a point of contact, see?"
70014010-47 = "Yeah. Open their phone and find someone who looks desperate... Heehee..."
70014010-48 = "Huh? Uh...?"
70014010-49 = "You got a problem?"
70014010-50 = "No, it's nothing..."
70014010-51 = "Get it together."
70014010-52 = ""
70014010-54 = ""
70014010-55 = ""
70014010-57 = "(For some reason, this person kind of looks like Schale's \"Sensei.\" I thought they were more of a rumor...)"
70014010-58 = "(Eh, can't be. Why would that super-special Sensei come to a place like this, looking like THAT?)"
70014010-59 = ""
70014010-61 = "Hey, if this all goes well... We'll be making bank! That's what matters."
70014010-62 = "Yeah, girl! WOOO! Let's party! MAKE SOME NOISE!"
70014010-63 = "Such a racket."
70014010-64 = ""
70014010-66 = ""
70014010-67 = ""
70014010-69 = ""
70014010-71 = ""
70014010-73 = ""
70014010-74 = ""
70014010-75 = ""
70014010-76 = "It was terribly noisy, so I inquired. It turns out to be nothing more than a few punks."
70014010-77 = "[ns] \"...?\""
70014010-78 = "...?"
70014010-79 = "[s] \"Kai?\""
70014010-80 = "Sensei?!"
70014010-81 = "[s] \"What are you doing here, Kai?!\""
70014010-82 = "What am I doing? I believe I should be the one asking questions. Why are you here, of all places?"
70014010-87 = "...I've gathered the essence of it. You can't reveal your reasons, but it's clear you had business in the Black Market."
70014010-88 = "Keh heh heh... Very well, Sensei. I do not need to know your secrets. I was only here to \"tidy up\" the area."
70014010-89 = ""
70014010-91 = ""
70014010-92 = "What's that face? Are you wondering why I'm at the Black Market instead of the Corrections Bureau? Too shy to ask?"
70014010-93 = "Yes... I certainly was sent to the Corrections Bureau after my...actions."
70014010-94 = "I was shipped off by your hands, lest you forget."
70014010-95 = "Well... I suppose some would find this to be a golden \"chance for payback,\" wouldn't they?"
70014010-96 = "[s] \"...!\""
70014010-97 = "Hahaha! I suppose I'll let our history slide for now, especially after seeing your startled expression."
70014010-98 = "My, my. It doesn't feel so bad having someone like YOU in the palm of my hand, Sensei."
70014010-99 = "For the moment... I decided not to provoke Kai..."
70014010-101 = "Initially, I was taken into custody, languishing away in the back of a Corrections Bureau truck."
70014010-102 = "...However, once the ride was over, I wasn't released to the Corrections Bureau."
70014010-103 = ""
70014010-108 = ""
70014010-110 = ""
70014010-112 = "My lovely \"captors\" were only posing as Valkyrie students. Conveniently, the relevant records were also...swapped in transit."
70014010-113 = "...The girl who helped me probably thinks I'm indebted to her now. And she's not entirely wrong."
70014010-114 = "...\"Promises\" are important, after all."
70014010-115 = ""
70014010-116 = "[ns] \"'That girl'...?\""
70014010-117 = "Keh heh... Curious, Sensei? Stay that way. I will say no more about her. "
70014010-118 = "After all, her identity could easily fall under the umbrella of my promise."
70014010-119 = "But you never know... If you were to promise me something even greater, hmm..."
70014010-120 = "With the right offer and perspective, the situation could change..."
70014010-121 = "Just like how, while developing a new medicine, the results vary wildly depending on the ratio of active ingredients. Keh heh heh..."
70014010-122 = "[s] \"So, you've been at the Black Market this whole time?\""
70014010-123 = "No. While the Black Market could be considered the safest place for me to hide..."
70014010-124 = "It is difficult to procure various ingredients and reagents here."
70014010-125 = "To put it simply, in order to continue my studies, I adopted a pseudonym and...masqueraded as a traveling doctor."
70014010-126 = "Along the way, I ended up indebted to a family in Hyakkiyako."
70014010-127 = "[s] \"...It seems you stayed out of 'trouble,' at least.\""
70014010-128 = "As I had to."
70014010-129 = ""
70014010-131 = ""
70014010-132 = "Hmm... We're nearly there. This is...the \"residence\" where I'm currently living. Then, shall we?"
70014010-134 = "I followed Kai up a dark, decrepit staircase."
70014010-135 = ""
70014010-142 = "[ns] \"...\""
70014010-144 = "[ns] \"You've been staying here all this time.\""
70014010-145 = "I'm \"crashing,\" to be more precise."
70014010-147 = "Just as I was about to ask what that meant..."
70014010-148 = "An old woman appeared, walking with a limp."
70014010-149 = ""
70014010-151 = ""
70014010-155 = "...Oh my. Welcome back, Kai."
70014010-156 = "*cough* *cough*..."
70014010-157 = "Hmm? But who's this?"
70014010-158 = "Ah. They're somewhat of a guest."
70014010-159 = "A special guest! What a rare treat, Kai!"
70014010-160 = "And...that's exactly why I'm glad to have them. You would never invite a dangerous person over..."
70014010-161 = "*cough* *cough* *cough*...!"
70014010-162 = "...I'm so sorry. It seems my body isn't quite healed yet. Still, it's only thanks to you that I'm managing to hold on..."
70014010-163 = "I know. Perhaps it's time you head back to your room."
70014010-164 = "Yes, I should..."
70014010-165 = "It's a humble little place, but please feel free to chat at your leisure. You won't keep me up!"
70014010-166 = "I'm truly sorry about the mess, but make yourself at home while you're here."
70014010-167 = ""
70014010-169 = ""
70014010-172 = "The old woman hobbled back into her room."
70014010-173 = "Soon after, the sound of weary snoring followed."
70014010-174 = ""
70014010-176 = ""
70014010-177 = "[ns] \"Who's that?\""
70014010-178 = "Well, I suppose you should call her the landlady."
70014010-179 = "You think she looks \"a little under the weather\"? Indeed she is, to put it lightly. Right now, she can barely walk through the door."
70014010-180 = "She has something akin to rheumatoid arthritis, with comorbidity in her lungs and bronchial tubes."
70014010-181 = "Before I came here, her condition was slightly worse."
70014010-182 = "She's improved somewhat, but... Let's just say that I'm just keeping her stable."
70014010-183 = ""
70014010-185 = ""
70014010-186 = "Oh. You look relieved. Do you think it's \"merely\" arthritis, Sensei?"
70014010-187 = "Perhaps you don't realize that rheumatism is, at its core, an autoimmune disease."
70014010-188 = "That means that the immune system attacks normal cells within the body rather than foreign antigens."
70014010-189 = "To put it more simply, it is a disease in which the body destroys itself."
70014010-190 = "The joints are simply the first place where symptoms appear. Nowhere is safe, aside from the spine. Even the heart, lungs, and blood are at risk."
70014010-191 = "If it moves fast, and if you're particularly unlucky, it could develop into lymphoma."
70014010-192 = "[s] \"I-It's that serious?!?!\""
70014010-193 = "Well, I was speaking of particularly rare edge cases. That would be strictly a worst-case scenario."
70014010-194 = "[s3] \"Don't scare me like that...\"\n[s4] \"So that means there's no cure, I guess.\""
70014010-197 = "No, but..."
70014010-198 = "[s] \"What...?!\""
70014010-199 = "Treatment for rheumatism is essentially symptomatic management using steroids or anti-inflammatory drugs."
70014010-200 = "In some cases, a slightly stronger antibiotic may be used to redirect the body's immune response elsewhere."
70014010-201 = "Either way, the commonality is that they're nothing more than stopgap measures."
70014010-202 = "...Of course, those limits are only for typical treatments. But \"typical\" doesn't apply to me, remember?"
70014010-203 = "Keh heh heh... I know what you wish to ask, Sensei. You must learn to hide your expressions."
70014010-204 = "You're wondering, \"If Kai is treating her, couldn't she cure the old woman's illness at its root?\""
70014010-205 = "The answer is yes. Yes, I could."
70014010-206 = "[s] \"Didn't you say that you're just keeping her stable...?\""
70014010-207 = "I did. And little by little, I am considering the next step."
70014010-208 = "Not long ago, I managed to secure a promise from that old woman."
70014010-209 = ""
70014010-211 = ""
70014010-212 = "What was it, you ask? It was something like this..."
70014010-213 = "\"Since I'm in poor health and showing no sign of getting better, you should take this house, Kai.\""
70014010-214 = "So that's why I was thinking about the future."
70014010-215 = "...Thoughts bubble up like, \"Now that I've secured ownership of this house, maybe it's time to sever this relationship?\""
70014010-216 = "[s] \"Then why were you treating her...?\""
70014010-217 = "Sensei. When do people make more rational decisions? When they are healthy...or when they are sick?"
70014010-218 = "Between a scenario where that old woman regains her health or remains in frailty..."
70014010-219 = "...Under which circumstance would she be more likely to give me her residence?"
70014010-220 = "[s] \"...!!\""
70014010-221 = "Well, that's about it. I guess you could say I've achieved my little goal."
70014010-222 = "Are you trying to look down on me, Sensei? Go ahead if you want. I don't really care about the approval of others."
70014010-223 = "This is the kind of person I am. I don't intend to hide that fact, even if I can't be bothered to broadcast it."
70014010-224 = "After all, there's a significant chance that sharing that would bring me harm."
70014010-225 = "[s] \"But you can make her healthy again, right?\""
70014010-226 = "Hmm...?"
70014010-227 = "Well, if we're just talking about whether it's possible or not... Sure, it's definitely possible."
70014010-228 = ""
70014010-230 = ""
70014010-231 = "Hmm? You want me to try?"
