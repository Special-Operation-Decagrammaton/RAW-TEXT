[translation]
70014010-1 = "약사의 방황길 1"
70014010-2 = "(……결국, 왔다.)"
70014010-3 = "(블랙마켓 깊은 거리에…… 혼자서!)"
70014010-12 = "(나름 큰맘을 먹고 온 것이지만…….)"
70014010-13 = "(사고라도 당하면 다른 아이들…… 특히 총학생회 아이들에게 엄청나게 혼나겠지…….)"
70014010-18 = "[ns] \"?!\""
70014010-23 = "찾았다!"
70014010-25 = "외부인이 겁도 없이 여기까지 들어왔다던데, 진짜였구만!"
70014010-26 = "호오……. 생각보다 제법 '여기 사람' 티를 내려고 한 것 같기는 한데?"
70014010-27 = "그래봤자 결국 다 보인다고! 여긴 말이지, 바깥 녀석들은 절대 따라 할 수 없는……. 하여간 그 느낌이 있다고, 그 느낌이!"
70014010-28 = "끌고 가자! 그리고…… 어…… 그러니까……."
70014010-32 = "그래! 이 녀석을 인질로 삼아서, 한탕 크게 뜯는 거다!"
70014010-33 = "바깥 녀석들은 돈이 많을 테니까!"
70014010-34 = "얌전히 있으라고. 말만 잘 들으면 무사할 수도 있을 테니. 크헤헤……."
70014010-36 = "[ns1] (나름대로 최선의 준비를 다 했다고 생각했는데……!)\n[ns2] (……엄청 혼나겠네…….)"
70014010-44 = "여기까지 끌고 오기는 했는데 이제 어떻게 할까?"
70014010-45 = "우선 이 녀석의…… 그거다! 연락처를 털자고!"
70014010-47 = "그래. 그중에서 '거래가 통할 것 같은' 사람을 찾아서…… 크히히……."
70014010-48 = "어라? 그런데……?"
70014010-49 = "왜 그래?"
70014010-50 = "아니, 아무것도……."
70014010-51 = "싱겁기는."
70014010-57 = "(왠지 이 사람, 소문으로만 듣던 샬레의 '선생님'처럼 보이기도 하는데……?)"
70014010-58 = "(에이, 역시 그럴 리가. 그 선생님이 뭐 하러 이런 곳에, 이런 꼬락서니로 오겠어.)"
70014010-61 = "아무튼 이 일만 잘 진행되면…… 우리도 한몫 크게 잡을 수 있겠지?"
70014010-62 = "축제다! 파티다! 우하하하!"
70014010-63 = "시끄럽다."
70014010-76 = "근처가 소란스러워서 나와 보았더니만, 잔챙이들이었군."
70014010-77 = "[ns] \"……?\""
70014010-78 = "……?"
70014010-79 = "[s] \"카이?\""
70014010-80 = "선생?!"
70014010-81 = "[s] \"카이가 왜 여기 있어?!\""
70014010-82 = "역으로 선생에게 묻고 싶은 참이다. 이런 곳에서 마주치다니……."
70014010-87 = "……대강 알았다. 아직 이유를 말해줄 수는 없지만, 블랙마켓에 뭔가 볼 일이 있다는 것이군."
70014010-88 = "쿡쿡쿡……. 애당초 선생의 이유 같은 것에는 관심이 없었다. 나는 단지 근처의 '정리'를 하러 온 것뿐이었으니."
70014010-92 = "호오? 왜 내가 교정국이 아니라, 블랙마켓에 있는 것인지 궁금하다는 표정이군, 선생?"
70014010-93 = "그래……. 나는 분명 그날 이후 교정국으로 보내졌지."
70014010-94 = "다른 누구도 아닌 선생의 손에 의해서, 말이야."
70014010-95 = "그렇군……. 세간에서는 이런 때를 일컬어, '복수의 시간'이라고 하던가?"
70014010-96 = "[s] \"……!\""
70014010-97 = "하하하하! 멋진 얼굴이군. 좋다. 지금은 그 표정을 보아 넘어가 주도록 할까."
70014010-98 = "이거, 이거. 선생 정도 되는 사람을 내 손에 쥐고 있다는 느낌, 나쁘지 않군."
70014010-99 = "(지금은…… 카이의 심기를 건드리지 않기로 했다…….)"
70014010-101 = "분명, 도중까지는 교정국 호송 차량에 체포되어 있었다."
70014010-102 = "……다만 호송이 끝나고, 내리게 된 곳이 교정국이 아니었을 뿐이지."
70014010-112 = "호송 인원도 처음부터 발키리 학생으로 위장한 다른 자들이었고, 관련 서류 역시 도중에 바꿔치기를 당한 모양이다."
70014010-113 = "………'그자'는 이것으로 나에게 빚을 지워 두었다고 생각하고 있겠지. 그리고 그것은 그다지 틀린 인식이 아니다."
70014010-114 = "…………'약조'라는 것은, 어쨌든 중요한 것이니 말이야."
70014010-116 = "[ns] \"'그자'……?\""
70014010-117 = "쿡쿡…… 궁금한가, 선생? 하지만 지금의 나는 그자에 대해 함부로 이야기할 수 없다."
70014010-118 = "그 역시 충분히 약조의 하위 범주에 들어갈 수 있는 사항이니 말이야."
70014010-119 = "하지만 또 모르지. 선생이 그자의 약조보다도 더욱 중대한 약조를 새로이 나와 맺는다면."
70014010-120 = "사안과 견해에 따라서, 상황은 또한 바뀔 수도 있지 않을까."
70014010-121 = "신약의 개발 단계에서, 기존 유효 성분의 배합 비율에 따라 천차만별의 결과가 나오는 것처럼 말이야. 쿡쿡쿡……."
70014010-122 = "[s] \"그러면, 그동안 계속 블랙마켓에 있었던 거야?\""
70014010-123 = "그랬던 것은 아니다. 블랙마켓은 나 개인의 신변을 감추기에는 가장 안전한 곳이라고도 볼 수 있지만……."
70014010-124 = "여러 가지, 재료나 시약의 수급 같은 것에는 아무래도 곤란한 점이 많아서 말이지."
70014010-125 = "뭐, 간단히 이야기하자면 어떤 가명을 사용하여…… 방랑 의사 흉내를 내고 있었다."
70014010-126 = "그러던 도중에, 백귀야행에 신세를 지기도 했고."
70014010-127 = "[s] \"……그때는 그나마, '사고' 안 쳤던 모양이네.\""
70014010-128 = "그럴 필요가 있었으니까, 말이지."
70014010-132 = "어디…… 좋아. 슬슬 도착했다. 여기가 지금…… 내가 몸을 의탁하고 있는, '거처'다. 안내하지."
70014010-134 = "(카이를 따라 어둡고 낡은 계단을 올라갔다.)"
70014010-142 = "[ns] \"…….\""
70014010-144 = "[ns] \"이런 곳에서 지내고 있었구나.\""
70014010-145 = "정확히는, '신세지고 있다'고 해야 하겠지만 말이지."
70014010-147 = "(그게 무슨 뜻인지 물으려던 순간.)"
70014010-148 = "(한 노인이 불편한 걸음걸이로 모습을 드러냈다.)"
70014010-155 = "……아이고, 카이 왔구나."
70014010-156 = "쿨럭, 쿨럭……."
70014010-157 = "으음? 그런데 이 사람은 누구니?"
70014010-158 = "뭐, 손님 같은 것이다."
70014010-159 = "카이가 손님을 데려오다니, 이것 참 귀한 일이네."
70014010-160 = "하지만…… 그렇기에 오히려 믿을 수 있겠구나. 위험한 사람이라면, 애초에 들이지도 않았을 테니."
70014010-161 = "쿨럭, 쿨럭, 쿨럭……!"
70014010-162 = "……미안하구나. 아직은 몸이 온전치 못한 모양이야. 그나마 네 덕에 이렇게나마 버티고 있는 것이겠지만……."
70014010-163 = "알고 있다. 슬슬 들어가 있지 그래?"
70014010-164 = "그래, 그래야지……."
70014010-165 = "누추한 곳이지만, 천천히 이야기 나누시게나."
70014010-166 = "집이 이 모양이어서 송구할 뿐이지만……. 여기에 있는 동안이라도, 편히 지내시게."
70014010-172 = "(노인은 방 안쪽으로 절룩거리며 들어갔다.)"
70014010-173 = "(머지않아, 피곤하게 코를 고는 소리가 들려왔다.)"
70014010-177 = "[ns] \"그분은 누구셔?\""
70014010-178 = "뭐, 이 집의 주인이라고 해야겠지."
70014010-179 = "몸이 좀 불편해 보인다고? 그래. 본 대로다. 지금은 집 밖으로 걸어 나가기도 힘들 정도야."
70014010-180 = "결론만 이야기하자면, 류마티스 관절염 같은 것이다. 폐와 기관지 쪽에도 문제가 있고."
70014010-181 = "내가 여기 오기 전에는, 상태가 조금 더 심했지."
70014010-182 = "그때보다는 조금 나은 정도로, 현상 유지를 시켜 두는 중이다만……."
70014010-186 = "호오. 지금 관절염 정도에 지나지 않는다고 안심하는 표정을 지었군, 선생?"
70014010-187 = "하지만 알고 있나? 류머티즘의 본질은, 자가면역질환이다."
70014010-188 = "인체 내부의 면역계가, 외부 항원이 아닌 내부의 정상세포를 공격하여 생기는 질병이지."
70014010-189 = "더 간단히 표현하자면, 자기가 자기를 파괴하는 병이다."
70014010-190 = "관절은 그저 가장 먼저 증상이 나타나는 부위일 뿐, 척추 정도를 빼면 어디든 안심할 수 없다. 심장이나 폐, 혈액까지도 범위 대상이 되지."
70014010-191 = "정말 진행도가 빠르고 운이 없다면, 림프종까지 발전할 가능성도 있다."
70014010-192 = "[s] \"그, 그 정도였어?!?!\""
70014010-193 = "뭐, 정말로 거기까지 가 버리는 경우는, 반대로 또 드물기는 하지만."
70014010-194 = "[s3] \"겁주지 말아 줘…….\"\n[s4] \"하지만 근본적인 치료법은 없다는 뜻이구나.\""
70014010-197 = "아니다만?"
70014010-198 = "[s] \"뭐……?!\""
70014010-199 = "류머티즘의 치료는, 기본적으로 스테로이드나 항염증제를 이용한 대증 치료다."
70014010-200 = "경우에 따라서는 조금 강한 항생제를 사용하여, 오히려 인체의 면역 반응을 다른 곳으로 돌리는 방안도 있다."
70014010-201 = "어느 쪽이든 공통점은 임시방편 정도에 지나지 않는다는 것이지."
70014010-202 = "일반적이라면 그렇다. 일반적이라면. 하지만, 나에게는 그 '일반적'이라는 것이 해당되지 않아서 말이야."
70014010-203 = "쿡쿡쿡……. 알고 있다. 선생이 무슨 말을 하려 하는지. 선생의 표정은 기본적으로 읽기 쉬우니까."
70014010-204 = "'나라면 저 노인의 병증을 근본적으로 치료할 수 있는 것인가?'라고 묻고 싶겠지?"
70014010-205 = "그리고 그에 대한 내 대답은, '그렇다'이다."
70014010-206 = "[s] \"현상 유지만 해 두고 있다고 하지 않았어……?\""
70014010-207 = "그래. 그래서 슬슬, 다음 스텝을 고민하고 있었던 참이었다."
70014010-208 = "얼마 전 노인에게, 하나의 약조를 받아냈으니까."
70014010-212 = "그게 무엇이냐고? 이런 것이다."
70014010-213 = "'자신은 몸이 불편한 상태고, 더 나아질 기미도 없으니, 내가 이 집을 가져도 좋다'는 것 말이지."
70014010-214 = "그래서, 이런 생각을 하고 있었다."
70014010-215 = "……'집의 소유권을 얻게 되었으니, 슬슬 이 관계를 중단해도 좋지 않을까?' 같은 생각 말이지."
70014010-216 = "[s] \"현상 유지라도 시켜 주고 있었던 것은, 어째서였어……?\""
70014010-217 = "사람은 건강할 때와 병약할 때, 어떤 경우에 더욱 합리적인 판단을 내릴까?"
70014010-218 = "저 노인이 건강을 되찾는 것과, 병약한 상태로 남아 있을 때 중에서."
70014010-219 = "……어떤 상태일 때, 나에게 이 거처의 소유권을 넘겨줄 가능성이 높을까?"
70014010-220 = "[s] \"……!!!\""
70014010-221 = "뭐, 그런 것이다. 이제 나의 작은 목적은 달성된 것이라고 보아도 되겠지."
70014010-222 = "나를 경멸하려는가, 선생? 마음대로 해도 좋다. 나는 그런 것을 그다지 신경 쓰지 않으니까."
70014010-223 = "나는 이런 인간이다. 이제 와서 그 사실을 딱히 숨길 생각도 없다. 구태여 드러내고 다니지도 않겠지만 말이야."
70014010-224 = "그것은 아무래도 나에게 손해가 될 가능성이, 더욱 높을 테니."
70014010-225 = "[s] \"그렇지만, 건강하게 만들어 드릴 수도 있는 거지?\""
70014010-226 = "흠……?"
70014010-227 = "뭐, 가능하냐, 가능하지 않으냐만 따진다면, 얼마든지 그럴 수 있지."
70014010-231 = "음? 그렇다면 그렇게 해 달라고?"
