[translation]
70014010-1 = "薬屋の彷徨い（１）"
70014010-2 = "（ブラックマーケットは初めてじゃないけど……）"
70014010-3 = "（こんな奥まで来たことはなかったな）"
70014010-4 = ""
70014010-12 = "（1人はまずかったかな……）"
70014010-13 = "（何かあったら、みんなに怒られるかも――）"
70014010-14 = ""
70014010-18 = "[ns] \"！？\""
70014010-19 = ""
70014010-20 = ""
70014010-21 = ""
70014010-23 = "いたぞ！"
70014010-25 = "カモがいるって話は本当だったんだな！"
70014010-26 = "ここに慣れてないのが丸わかり。"
70014010-27 = "はっはぁ！攫ってくれって言ってるようなもんだぜ？"
70014010-28 = "つ、連れて行けばいいんだよな？"
70014010-29 = ""
70014010-31 = ""
70014010-32 = "身代金で大儲けだ！"
70014010-33 = "余所者は金払いが良いからありがてぇよな！"
70014010-34 = "大人しくしてろ。ケガしたかないだろ？"
70014010-35 = ""
70014010-36 = "[ns1] （準備してきたつもりだったけど……）\n[ns2] （無事に帰れても、みっちりお説教コースかなぁ……）"
70014010-39 = ""
70014010-44 = "とりま連れてきたけど、どうする？"
70014010-45 = "まずは……あれだ！連絡先！"
70014010-47 = "ああ。取引できそうなやつを探して……その後は……。"
70014010-48 = "って、あれ……？"
70014010-49 = "どうした？"
70014010-50 = "いや、なんでも……。"
70014010-51 = "んだよ？"
70014010-52 = ""
70014010-54 = ""
70014010-55 = ""
70014010-57 = "（こいつ、シャーレの先生に似てないか……？）"
70014010-58 = "（いや、まさかな。先生がこんなところに来るはずがない）"
70014010-59 = ""
70014010-61 = "とにかく、しっかり稼がせてもらうとしよう。"
70014010-62 = "ったりめぇだ！笑いが止まらねぇぜ！"
70014010-63 = "耳障りだ。"
70014010-64 = ""
70014010-66 = ""
70014010-67 = ""
70014010-69 = ""
70014010-71 = ""
70014010-73 = ""
70014010-74 = ""
70014010-75 = ""
70014010-76 = "弱い犬ほどよく吠えるな。"
70014010-77 = "[ns] \"……？\""
70014010-78 = "……？"
70014010-79 = "[s] \"カイ？\""
70014010-80 = "先生！？"
70014010-81 = "[s] \"えっ、なんで！？\""
70014010-82 = "それはこちらの台詞だよ。"
70014010-87 = "……と、言っては見たものの。"
70014010-88 = "まあ、なんだっていいさ。さしたる興味もない。"
70014010-89 = ""
70014010-91 = ""
70014010-92 = "……だが、先生はそうでもないようだねぇ？"
70014010-93 = "ククッ……あの日、確かに私は矯正局に送られた。"
70014010-94 = "他でもない、先生の手によって。"
70014010-95 = "巡ってきたこの機会……復讐には絶好のチャンスかな？"
70014010-96 = "[s] \"……！\""
70014010-97 = "ハハハッ！良い顔をするじゃないか。"
70014010-98 = "なに、取って食いやしないさ。"
70014010-99 = "（今はなるべく、カイの神経を逆なでしないようにしよう……）"
70014010-101 = "話を戻そう。#n私は矯正局の車両で移送されていた。"
70014010-102 = "だが、連れていかれたのは別の場所でね。"
70014010-103 = ""
70014010-108 = ""
70014010-110 = ""
70014010-112 = "本物だったのは車両だけ、ということさ。"
70014010-113 = "これで、彼女は貸しを作ったつもりなのだろう。"
70014010-114 = "まあ、「約束」は大事だからな。"
70014010-115 = ""
70014010-116 = "[ns] \"彼女……？\""
70014010-117 = "気になるかい？#nしかしなぁ、勝手に話すことはできないんだよ。"
70014010-118 = "残念ながら、それも約束でね。"
70014010-119 = "とはいえ絶対ではない。物事は絶えず流動的だ。"
70014010-120 = "より良い約束を、先生が結んだなら――あるいは。"
70014010-121 = "配合の比率によって、全く異なる結果が出る。新薬の開発のようにね。"
70014010-122 = "[s] \"じゃあ質問を変えるけど……ずっとここにいたの？\""
70014010-123 = "いいや？"
70014010-124 = "身分を隠すには都合がいいが……材料やら試薬の入手が困難でね。"
70014010-125 = "しばらくは、偽名を使って放浪医の真似事をしていたよ。"
70014010-126 = "百鬼夜行で世話になったこともあったかな。"
70014010-127 = "[s] \"……その時は問題を起こさなかったんだね。\""
70014010-128 = "結果論だよ。"
70014010-129 = ""
70014010-131 = ""
70014010-132 = "……着いたぞ。#nここが今の「住処」だ。"
70014010-134 = "（カイの後に続いて、古くて暗い階段を上った）"
70014010-135 = ""
70014010-142 = "[ns] \"……。\""
70014010-144 = "[ns] \"ここがカイの家なんだね。\""
70014010-145 = "正確には居候だ。"
70014010-147 = "（意味を聞こうとした時――）"
70014010-148 = "（不自由そうな足取りで老人が姿を見せた）"
70014010-149 = ""
70014010-151 = ""
70014010-155 = "ああ……おかえり。"
70014010-156 = "ゴホゴホッ……。"
70014010-157 = "おや、そちらの方は？"
70014010-158 = "客だ。"
70014010-159 = "おや、珍しい。"
70014010-160 = "それだけ、信頼している方なんだろうねぇ。"
70014010-161 = "ゴホゴホッ……！"
70014010-162 = "見苦しくてすまないねぇ……。#n立つのがやっとで……どうにも芳しくない。"
70014010-163 = "部屋に戻ったらどうだ？"
70014010-164 = "そうさせてもらうよ……。"
70014010-165 = "お茶も出せぬが……。"
70014010-166 = "……どうか、くつろいでおくれ。"
70014010-167 = ""
70014010-169 = ""
70014010-172 = "（老人は足を引きずりながら部屋へ戻った）"
70014010-173 = "（まもなく、寝息が聞こえてきた）"
70014010-174 = ""
70014010-176 = ""
70014010-177 = "[ns] \"今の方は？\""
70014010-178 = "ここの家主だ。"
70014010-179 = "関節リウマチのようなものでね。#n他に肺と気管支も患っている。"
70014010-180 = "あれじゃ、外出すらままならない。"
70014010-181 = "とはいえ改善はしてるんだ。前はもっと酷かった。"
70014010-182 = "多少はマシになるよう、私が維持させている。"
70014010-183 = ""
70014010-185 = ""
70014010-186 = "その様子……さては、病状を理解していないな？"
70014010-187 = "リウマチとは、自己免疫疾患だ。"
70014010-188 = "体内の免疫系が、外部の抗原でなく内部の正常な細胞を攻撃することで生じる。"
70014010-189 = "つまり、自分で自分を破壊するわけだ。"
70014010-190 = "関節は初期から症状が見られる部位でね。"
70014010-191 = "といっても、脊椎を除けばどこだろうと安心はできない。#n運が悪ければ、リンパ腫にまで発展する可能性もある。"
70014010-192 = "[s] \"そうなの！？\""
70014010-193 = "あくまで最悪のケースだ。"
70014010-194 = "[s3] \"驚かせないでよ……。\"\n[s4] \"それで、完治させられるの？\""
70014010-197 = "[ruby=・]一[/ruby][ruby=・]般[/ruby][ruby=・]的[/ruby][ruby=・]に[/ruby][ruby=・]は[/ruby]無理だ。"
70014010-198 = "[s] \"それって……。\""
70014010-199 = "通常は、進行を抑える治療が中心だ。"
70014010-200 = "場合によっては、無理やり免疫の働きを調整することもある。"
70014010-201 = "要は、その場しのぎしか手段がないのさ。"
70014010-202 = "そう、[ruby=・]一[/ruby][ruby=・]般[/ruby][ruby=・]的[/ruby][ruby=・]に[/ruby][ruby=・]は[/ruby]な。"
70014010-203 = "ククッ……。言わんとすることは分かるよ。"
70014010-204 = "[ruby=・]私[/ruby][ruby=・]な[/ruby][ruby=・]ら[/ruby]できるのか？"
70014010-205 = "――ああ、もちろん。"
70014010-206 = "[s] \"それなら、なんで治してあげないの？\""
70014010-207 = "ちょうど、段階を進めようと考えていたところさ。"
70014010-208 = "数日前、あの老人から約束を取り付けた。"
70014010-209 = ""
70014010-211 = ""
70014010-212 = "家を譲る。"
70014010-213 = "そういう約束をね。"
70014010-214 = "私は考えた。"
70014010-215 = "家の所有権さえ手に入れば、この関係を終わらせてもいいのではないか、と。"
70014010-216 = "[s] \"じゃあ、なんで維持はしてあげたの？\""
70014010-217 = "健康な時と、病に侵されている時。頭が回るのはどちらだろうねぇ？"
70014010-218 = "損得勘定さ。"
70014010-219 = "家を手にするためのね。"
70014010-220 = "[s] \"……！！！\""
70014010-221 = "詰まる所、もうすぐ用済みなんだよ。"
70014010-222 = "軽蔑したいなら好きにするといい。"
70014010-223 = "[ruby=しんたに]申谷[/ruby]カイとはこういう人間だ。隠すつもりもない。"
70014010-224 = "あえて喧伝するものでもないがね。"
70014010-225 = "[s] \"でも、治してあげられるんでしょ？\""
70014010-226 = "ああ。"
70014010-227 = "できるか否かであれば……いくらでも。"
70014010-228 = ""
70014010-230 = ""
70014010-231 = "うむ？ならそうしてほしい？"
