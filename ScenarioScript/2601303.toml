[translation]
2601303-1 = "도망친 곳에 꽃밭은 있다."
2601303-2 = "(아츠코의 연락을 받고 약속 장소로 향했다.)"
2601303-4 = "앗, 선생님이다."
2601303-8 = "[ns] \"갑자기 사진?!\""
2601303-9 = "후후, 미안. 선생님의 모습도 카메라에 담아두고 싶었거든."
2601303-10 = "……혹시 실례가 됐을까?"
2601303-11 = "[s] \"아냐, 조금 놀랐을 뿐, 괜찮아.\""
2601303-12 = "후후, 그렇구나."
2601303-13 = "응? 꼭 찍고 싶다던 게 선생님의 모습이냐고?"
2601303-14 = "후후, 맞아. 덕분에 하나는 빠르게 찍을 수 있었네."
2601303-15 = "나머지 하나는 다른 곳에 있어. 같이 가보자, 선생님."
2601303-17 = "저기야, 선생님."
2601303-18 = "어제 축제장을 돌아다니다가 발견한 곳."
2601303-19 = "꽃으로 장식해 둔 포토존이야. 사진 찍으라고 의자까지 마련해 뒀어."
2601303-20 = "그런데 어제보다 꽃이 조금 시들었네."
2601303-21 = "[s1] \"어쩔 수 없지. 장식해 두면 시들 수밖에.\"\n[s2] \"하지만 아직 예쁜걸.\""
2601303-24 = "응, 그렇네."
2601303-25 = "그럼 사진 찍을게. 선생님, 저기 의자에 앉아 볼래?"
2601303-26 = "[s] \"나는, 아까도 찍어줬는걸?\""
2601303-27 = "그럼 일단 꽃만……."
2601303-28 = "텅 빈 의자와 꽃들도 느낌 있는걸."
2601303-32 = "어디, 이쪽에서도……."
2601303-38 = "응, 좋은 사진을 찍을 수 있었네."
2601303-39 = "이번엔—"
2601303-40 = "뭐야, 너희는?"
2601303-42 = "누구 마음대로 여기서 사진을 찍는 거야?"
2601303-43 = "허락을 받아야 하는 거야?"
2601303-44 = "당연하지! 여기는 우리가 만든 포토존이니까!"
2601303-45 = "[s] \"멋대로 촬영해서 죄송합니다.\""
2601303-46 = "흥, 사과 따위는 필요 없어."
2601303-47 = "나 몰래 몇 장이나 찍었는지 바른대로 말해!"
2601303-48 = "그게…… 여덟 장 정도?"
2601303-49 = "많이도 찍으셨구만. 좋아, 그러면 한 장당 1만 엔씩 해서, 8만 엔이야."
2601303-50 = "자, 얼른 지불해."
2601303-54 = "너, 너무 비싼걸. 그런 돈은 없어."
2601303-55 = "[s3] \"아무리 그래도 한 장에 만 엔이라니……!\"\n[s4] \"상식 밖의 가격이잖아!\""
2601303-58 = "흥, 그런 상식 따위, 난 몰라."
2601303-59 = "우리가 만든 포토존에서 우리가 정한 가격을 받겠다는데, 뭐가 문제야?"
2601303-60 = "몰래 와서 사진 찍은 너희가 오히려 나쁘지!"
2601303-61 = "허락 없이 사진 찍은 건 사과할게. 하지만 한 번만 봐주면 안 될까? 지금은 가진 돈이 그만큼 없는데……."
2601303-62 = "안 돼! 당장 내놔!"
2601303-63 = "안 그러면 다시는 축제장에 발도 못 들여놓게 혼내 줄 테니까!"
2601303-64 = "너무해……."
2601303-68 = "선생님, 내 손을 잡아."
2601303-69 = "[s5] \"으, 응? 이렇게?\"\n[s6] \"뭘 하려고?\""
2601303-72 = "뛰자!"
2601303-78 = "하아…… 하아…… 휴우."
2601303-79 = "모습은 보이지 않지만, 아직 따라오고 있을지도 몰라. 몸을 낮춰, 선생님."
2601303-80 = "여기 가만히 있으면 찾지 못할 테니까."
2601303-81 = "[s] \"숨을 만한 곳이 있어서 다행이네…….\""
2601303-82 = "그러게. 모래밭에 풀숲이 있을 줄은 몰랐어."
2601303-83 = "응? 선생님, 그게 무슨 말이야? 여기가 풀숲이 아니라고?"
2601303-84 = "……꽃?"
2601303-88 = "정말이네. 아까 포토존에 장식되어 있던 꽃들이야."
2601303-89 = "[s] \"꺾어 놓은 꽃들보다 몇 배는 풍성한걸.\""
2601303-90 = "응, 더 활짝 피었네."
2601303-91 = "모래밭에서도 이렇게 자라는구나. 몰랐어."
2601303-92 = "이 꽃, 이름이 뭔지 알아, 선생님?"
2601303-93 = "해당화…… 라고? 그렇구나. 또 하나 배웠네."
2601303-94 = "[s] \"아츠코, 사진 찍어 줄까?\""
2601303-95 = "사진? 나를?"
2601303-96 = "아까 내가 선생님을 찍었으니, 이번엔 반대로, 라고……."
2601303-97 = "……응, 선생님이 찍어 주는 거라면, 좋아."
2601303-100 = "[wa:1400]― [log=아츠코 수영복]사진, [wa:1245]많이 찍어왔지만……[wa:40] [/log]"
2601303-102 = "― [log=아츠코 수영복]이렇게 찍히는 건 처음이야.[/log]"
2601303-105 = "― [log=아츠코 수영복]이럴 때, [wa:1640]어떻게 하면 좋을지 모르겠네…….[/log]"
2601303-108 = "[wa:1110]― [log=아츠코 수영복]이렇게, [wa:1020]웃으면 되려나? [/log]"
2601303-111 = "― [log=아츠코 수영복]좀 더 꽃 쪽으로 붙어……? [wa:2620]알았어. [/log]"
2601303-114 = "[wa:1670]― [log=아츠코 수영복]해당화…… [wa:1450]좋은 향기.[/log]"
2601303-117 = "[wa:1570]― [log=아츠코 수영복]우연히 발견한 장소지만…… [wa:2320]선생님 덕분에, [wa:1060]여기에 올 수 있었어.[/log]"
2601303-120 = "[wa:800]― [log=아츠코 수영복]고마워, 선생님, [wa:2070]멋진 추억이 되었어.[/log]"
2601303-123 = "사진, 한 번 봐도 될까?"
2601303-124 = "자신이 찍힌 사진을 확인하는 건, 조금 부끄럽네."
2601303-131 = "어라! 이쪽으로 온 것 같았는데, 어디 갔어?"
2601303-132 = "칫, 한몫 벌 기회였는데, 아깝게 됐네."
2601303-139 = "……돌아간 모양이야. 다행히 따돌렸네."
2601303-140 = "다음부터는 잘 살펴보고 사진을 찍어야겠어. 오늘처럼 곤란한 상황에 처할지도 모르니."
2601303-141 = "오늘은 도와줘서 고마워."
2601303-142 = "[s] \"원한다면, 다음에도 동행할게.\""
2601303-146 = "응, 그럼 부탁할까."
2601303-147 = "선생님 덕분에 좋은 사진을 찍을 수 있었으니까."
2601303-148 = "그럼 다음에 봐, 선생님."
