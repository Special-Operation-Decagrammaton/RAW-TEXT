[translation]
2000506-1 = "여름 한정 페로로 굿즈!"
2000506-2 = "바다의 집 앞"
2000506-3 = "(히후미와 바다의 집에서 만족스러운 식사를 하고 나왔다.)"
2000506-4 = "아아, 정말 맛있었어요~."
2000506-5 = "보기에는 평범한 야키소바처럼 보였는데…… 학교 근처에서 먹는 것보다 훨씬 맛있었어요!"
2000506-6 = "뭔가 이 가게만의 특별 비법 소스라도 있는 걸까요?"
2000506-7 = "[s] \"해변에서 먹으니 더 맛있게 느껴졌던 게 아닐까?\""
2000506-8 = "……그렇네요. 즐거운 기분에 취한 채로 먹으면 뭐든지 맛있게 느껴지니까요."
2000506-9 = "이 특제 야키소바도 이 시기에만 즐길 수 있는 여름의 풍물시일지도 모르겠네요~."
2000506-10 = "배불리 식사도 마쳤으니, 다음에는 어디로 갈까요?"
2000506-11 = "뭔가 달콤한 디저트를 먹을 만한 장소가……."
2000506-12 = "거기 학생 여러분! 식후 디저트로 저희 <모리모리군>의 아이스 캔디는 어떠신가요?"
2000506-13 = "지금 모리모리군의 아이스 캔디를 구매하시면 추첨을 통해 모모프렌즈의 인기 캐릭터, '페로로' 인형을 증정해드리고 있답니다!"
2000506-14 = "페, 페로로 님의 인형이요?!"
2000506-15 = "심지어 콜라보 전용의 한정 디자인이라니…… 이건 꼭 구해야해요!"
2000506-16 = "[s] \"뭔가 디자인이 조악해보이는데…….\""
2000506-17 = "아뇨. 오히려 이런 저가 콜라보 제품들은 일찍 소진되기 때문에 매니아들에게는 정식 제품들보다 훨씬 높은 가치가 있어요."
2000506-19 = "선생님, 오늘 식후 디저트는 이 아이스 캔디로 하죠!"
2000506-20 = "[s1] \"아이스 캔디 한 개 정도라면…….\"\n[s2] \"좋아. 내가 살게.\""
2000506-21 = "<모리모리군> 소다 맛 두 개 주세요!"
2000506-22 = "<모리모리군> 소다 맛 두 개 주세요!"
2000506-23 = "네, 감사합니다!"
2000506-26 = "음~ 달고 시원해~."
2000506-27 = "꼭 이벤트가 아니더라도 여름 해변에서 먹는 아이스 캔디의 맛은 각별하네요."
2000506-28 = "자. 그럼 아이스 캔디도 다 먹었으니, 막대에 적혀있는 추첨 문구를 한 번 확인해 볼까요……."
2000506-31 = "축하합니다! 모리모리군 아이스 캔디 2개 추가 증정에 당첨되셨습니다!"
2000506-32 = "네? 추가 아이스 캔디요?"
2000506-33 = "네. 이번 추첨 이벤트에서는 50%의 확률로 페로로 인형 대신 추가 아이스 캔디를 증정하고 있습니다."
2000506-34 = "물론 증정된 아이스 캔디에도 추첨 문구는 적혀 있으니, 페로로 인형을 얻고 싶으시다면 계속 도전해 주세요!"
2000506-35 = "……그럼 어쩔 수 없죠. 다시 재도전이에요!"
2000506-37 = "선생님, 아이스 캔디 한 개 더…… 괜찮으신가요?"
2000506-38 = "[s] \"두 개까지는 괜찮을 것 같아…….\""
2000506-41 = "그럼…… 갑니다!"
2000506-44 = "(……하지만 이후로도 페로로 인형은 계속 나오지 않았다.)"
2000506-46 = "추, 축하드립니다. 모리모리군 아이스 캔디 2개 추가 증정을……."
2000506-47 = "어째서…… 벌써 10개째인데…… 어째서 당첨이 되질 않는 거죠……."
2000506-48 = "게다가 아이스크림을 너무 먹었더니 머리가 아파요……."
2000506-49 = "[s3] \"나도 머리가 아파…….\"\n[s4] \"뱃속이 차가워…….\""
2000506-50 = "이상하네요. 아이스 캔디 추가 증정과 페로로 인형 증정의 확률은 동일할텐데……."
2000506-51 = "이상하네요. 아이스 캔디 추가 증정과 페로로 인형 증정의 확률은 동일할텐데……."
2000506-53 = "(소근) 저, 손님. 괜찮으시다면 제가 따로 페로로 인형을 챙겨드릴 테니 도전은 이만 포기하시는 게……."
2000506-54 = "그건 안 돼요! 이건 페로로 님과의 약속이나 다름없다고요!"
2000506-55 = "부정한 방법으로 인형을 얻을 수 있는 방법이 있다고 하더라도…… 정정당당하게 도전하지 않으면 페로로 님을 볼 면목이 없어요!"
2000506-57 = "선생님, 아이스 캔디 하나 더…… 괜찮으시죠?"
2000506-58 = "[s] \"……해보겠습니다.\""
2000506-59 = "그럼……"
2000506-61 = "갑니다!"
2000506-65 = "추, 축하합니다! 한정 콜라보 페로로 인형, 당첨입니다!"
2000506-66 = "만세! 마침내 해냈어요!"
2000506-67 = "선생님이 같이 아이스크림을 드셔주신 덕분이에요. 감사합니다, 에헤헤……."
2000506-68 = "……어라? 어쩐지 갑자기 눈 앞이 어지럽고, 머리가 멍한 게…… 현기증이……"
2000506-72 = "어, 어라? 손님! 정신 차리세요!"
2000506-73 = "차가운 걸 너무 많이 드셔서 현기증이 나셨나 보네요. 빨리 의무실로 옮겨야……."
2000506-74 = "[s] \"나도 더 이상은…….\""
2000506-79 = "우왓? 이쪽도?!"
2000506-80 = "다들 정신차리세요, 손님! 손님!!"
2000506-82 = "(………….)"
2000506-83 = "(페로로 인형은 무사히 손에 넣었지만, 이후 배탈이 나서 사흘간 고생했다.)"
