[translation]
33040-1 = "제4화;그 후의 이야기들"
33040-3 = "크아아아아아아아아--!!"
33040-4 = "(콰아아아앙-!! 콰아아아앙!!)"
33040-5 = "오오, 츠루기 선배. 오늘 따라 더욱 텐션이 높네요."
33040-6 = "솔직히 이어지는 강행군에 좀 지쳐 있었는데, 스스로의 안일함을 반성하게 됩니다."
33040-7 = "저도 선배의 모습을 본받아서 더 힘내겠습니다!"
33040-11 = "(치익) 이야, 하스미 선배, 계심까. 교내에서 누가 비품 탱크를 탈취해버렸는데요……."
33040-12 = "네?! 뭐라고요?"
33040-13 = "지금 병력이 부족해서 와주셨으면 하는데, 어라, 우오오- 저 드리프트 굉장하잖슴까-?"
33040-14 = "지금 바쁜데…… 추, 충원 병력은…… 코하루가 분명 교내에……."
33040-15 = "아…… 코하루는 심한 감기에 걸려서 쉬는 중이었죠……."
33040-16 = "그리고 코하루 씨는 아직 보충수업부 소속입니다, 선배. 제가 가겠습니다!"
33040-17 = "크아아아-! 크아아!!"
33040-18 = "네…… 여기는 츠루기에게 맡겨도 될 것 같네요. 저도 함께 갑니다!!"
33040-30 = "저, 저기……. 하나코 씨……."
33040-34 = "응? 왜 그러시나요, 히나타 씨?"
33040-38 = "저기…… 다, 닿고…… 있는데요, 저기…… 드, 등에……."
33040-40 = "어머나, 그러네요. 이것 참, 곤란하게도♡"
33040-41 = "아, 아으으……."
33040-43 = "저, 저기…… 하나코 씨…… 뭐, 뭔가 안좋은 일이라도 있으셨는지……."
33040-44 = "응? 아무것도 아니에요. 시스터분들의 부탁으로 이렇게 며칠째 자료 정리를 도와드리고 있지만, 중요한 일이니까♡"
33040-45 = "으으…… 죄송해요……. 뭐, 뭔가 무서워……"
33040-49 = "만마전 의사당"
33040-50 = "키키키킷-! 과연, 네가 바로 <샬레>의 선생님인가!"
33040-51 = "과연, 확실히 이건 내 예상 외로군! 유쾌할 정도야! 키키키키킷--!!"
33040-52 = "[s] \"어…… 안녕. 네가 바로 게헨나의 학생회장……?\""
33040-53 = "키킥. 그래. 맞아."
33040-54 = "만마전 의장인 이 마코토 님께 협력하겠다니, 좋은 결정이라고 생각한다."
33040-55 = "[s] \"……으응?\""
33040-56 = "키키키킷-. 그래. 샬레와 만마전, 이 둘이 힘을 합하면 선도부 따위는 쉽게 무너트릴 수 있겠지. 아주 논리적인 판단이야."
33040-57 = "거기까지 계산이 되었다면, 지금 바로 계획을……!"
33040-58 = "……저기, 그런 대화는 보통 상대가 없는 데서 하지 않나요?"
33040-59 = "하아…… 마코토 선배. 이야기를 이상하게 전개하지 말아주세요."
33040-60 = "<샬레>의 선생님은 어디까지나 에덴조약의 참관자로 선정되었기에, 얼굴을 보러 온 것입니다. 형식적인 거라고요."
33040-61 = "뭐? 그럼 나와의 협력은?"
33040-62 = "할 리가 없지 않습니까. 오늘 처음 보는 사람이랑 뭘 합니까……."
33040-63 = "……."
33040-64 = "……킥킥. 뭐, 그런가. ……그렇군."
33040-65 = "그럼 재미는 다음으로 미뤄두도록 하지. 선생."
33040-66 = "됐다, 돌아간다, 이로하."
33040-70 = "네? 벌써요?"
33040-72 = "하아……."
33040-73 = "[s] \"아코도 잘 지냈어?\""
33040-74 = "윽……."
33040-75 = "네……. 뭐, 그럭저럭……."
33040-76 = "그런데 의외네요, 선생님이 에덴조약에 참관한다니."
33040-77 = "그렇다는 건 즉, 이 뒤에 트리니티에도 방문하실 예정이라는……?"
33040-78 = "[s] \"거긴 이미 다녀왔어.\""
33040-79 = "네? 어, 어느새……?!"
33040-80 = "그, 그렇다는 건 선도부 행정관인 제가 정보를 놓치고 있었다는 얘기……?"
33040-81 = "아, 아무리 조약 준비 때문에 바빴다고 해도 <샬레>의 선생님의 일거수일투족은 제가 파악해두지 않으면 안 되는데……."
33040-82 = "[s] \"좀 봐줘…….\""
33040-83 = "흐음……"
33040-84 = "……뭐, 그렇군요. 부장님도 조금 머리를 식히라고 하셨고……. 흐음……."
33040-85 = "[s] \"히나는 지금 뭐 하고 있어?\""
33040-86 = "부장님은…… 지금 다른 볼일 때문에 학원에 안 계세요."
33040-87 = "……네. 바쁘죠. 아마 이 학원에서 제일 바쁠 거예요. 에덴조약이 체결되면 분명 부장님의 일도 줄어들겠지만……."
33040-88 = "……."
33040-89 = "뭐, 그럼 선생님은 게헨나에서의 볼일은 끝난 거죠? 나가는 길은 저쪽이니……."
33040-95 = "……배웅은 내가 하지."
33040-96 = "부, 부장님?"
33040-97 = "내, 내일까지 출장 아니셨어요?"
33040-98 = "음. 일이 빨리 끝나서 말야. 아코도 바쁠 텐데 이 정도는 내가 도울게."
33040-99 = "아, 네……."
33040-100 = "자, 가자고, 선생."
33040-102 = "흠……."
33040-103 = "……그래. 선생. 그 뒤에 트리니티에서의 일은 잘 정리 되었어?"
33040-104 = "[s1] \"조금 시간이 필요한 일이라……\n[s2] \"에덴조약이 끝난 뒤에 다시 한번 해결해보고 싶어…….\""
33040-105 = "흠……. 정확히는, 말하기 곤란한 건가."
33040-106 = "흠……. 정확히는, 말하기 곤란한 건가."
33040-107 = "그때 설명을 어느정도 듣긴 했지만…… 역시 설명하지 않은 빈 부분도 꽤 있다고 느껴졌고……."
33040-108 = "……아니, 책망하는 건 당연히 아냐. 아비도스라면 모를까 트리니티의 일이니까. 이런저런 선생의 사정도 있었겠지."
33040-109 = "[s] \"상세하게 설명했는데……. 특히 수영복 좌담회 부분은.\""
33040-110 = "아, 아니! 거긴 상세하지 않아도 괜찮아!"
33040-111 = "……."
33040-112 = "……뭐, 아무튼."
33040-113 = "진실에는 여러 관점이 있다…… 단 하나만이 아니다…… 선생은 그렇게 말했었지. 즉, 그건……"
33040-114 = "<트리니티의 배신자>라는 건 어디까지나 특정 관점을 통한 진실……. 하지만 선생이 원한 건 그런 게 아니었던 거겠지."
33040-115 = "다른 관점을 통해서…… 또 다른 진실을 파악하지 않으면 안 된다……. 왜냐하면……."
33040-116 = "……"
33040-120 = "……누군지 모르겠지만 선생의 신뢰를 받고 있는 거구나."
33040-121 = "[s] \"히나도 누구보다 믿고 있는걸.\""
33040-122 = "가, 갑자기 무슨 소리야……?!"
33040-123 = "그 얘기는 예전에 했으니까, 또 말하지 않아도 돼!"
33040-124 = "……. 정말이지."
33040-126 = "자, 조심해서 가. 선생."
33040-127 = "[ns] \"은퇴 이야기는 아코에게 하지 않은 거야?\""
33040-129 = "……뭐, 그렇지."
33040-130 = "선생 빼고는 아무도 몰라. 하지만 아코라면 적당히 눈치채고 있을지도."
33040-131 = "은퇴라고 해도 대단한 건 아니니까. 조금 지쳤으니 쉬고 싶은 거고……."
33040-132 = "……아니. 이 이야기는 그만하지. 별로 중요한 것도 아니니까."
33040-133 = "……. 그럼 조인식 때 봐. 선생."
33040-134 = "[s] \"고마워. 히나. 신세를 졌어.\""
33040-137 = "(그로부터 시간은 또 흘러서,)"
33040-138 = "(에덴조약 조인식 당일.)"
33040-143 = "다음화;에덴조약 조인식 1"
