[translation]
34140-1 = "제14화;대면"
34140-4 = "……. 클리어. 여기까진 안전해."
34140-5 = "네, 네!"
34140-6 = "……이상하군. 거리가 너무 조용한데. 원래 인적이 드문 곳이었지만 이 정도까진 아니었는데."
34140-7 = "게다가…… 뭔가 처음 보는 물건들이 더 많이 생긴 느낌이에요……."
34140-8 = "그래. 그 위화감은 나도 아까부터 느끼고 있었어."
34140-9 = "자치구를 오래 비우기는 했지만, 뭔가 내가 모르는 낯선 거리라는 느낌이 들고 있어."
34140-10 = "……."
34140-11 = "뭐랄까…… 생각해보면 예전부터 저희가 잘 모르는 것들로 점점 더 많이 채워지고 있었던 것 같아요."
34140-12 = "자치구 곳곳에 설치되기 시작한 순항 미사일이나…… 보급받기 시작한 무기들……"
34140-13 = "게다가 지금 생각해보면 그 미메시스라는 것도 엄청 이상한 거잖아요? 그런 걸 별생각 없이 받아들이고 있었던 것 같아요."
34140-19 = "언제부터 아리우스가 순항 미사일을 가지고 있었던 거야……?"
34140-20 = "언제부터 저런 불가사의한 힘을 다루게 된 거야……?"
34140-21 = "그래…… 생각해보면…… <헤일로를 부수는 폭탄>이라는 것도……."
34140-22 = "너희들은 대체……."
34140-24 = "……."
34140-25 = "……잠깐. 앞에 누가 오고 있어. 숨어."
34140-37 = "저건……."
34140-38 = "서, 성도회?! 유스티나 성도회 맞죠? 게다가 저 모습은……."
34140-39 = "……어째서? 에덴조약이 취소된 이상 불가능한 일이야."
34140-40 = "……. 생각해보면 그렇지."
34140-41 = "애초에 우리가 에덴조약 회담장을 습격한 이유가 바로 저 미메시스 능력을 확보하는 것이었어."
34140-42 = "맞아요…… 그래서 공주님은 고성당 지하에서 그 나무 인형이 시키는 대로 했었고요……."
34140-43 = "그렇게 확보한 성도회의 병력으로 트리니티와 게헨나 자치구를 점령한다…… 그게 우리들의 임무였어."
34140-44 = "그 뒤에 <샬레>에게 패배했지만."
34140-45 = "그래…… 우리가 도망자가 된 것도 그 이유야. 미메시스 능력의 확보도, 두 학원 점령에도 실패했으니까."
34140-46 = "그런데…… 아리우스 자치구는…… <그녀>는 이미 미메시스 능력을 확보하고 있다……?"
34140-53 = "우오오오오오오오----------------------------"
34140-54 = "이 소리는……."
34140-55 = "에덴조약 때 <전술 병기>로 썼던 그 <암브로시우스>의 비명이야. ……확실히 그때 우리가 다루었던 미메시스가 맞는 것 같네."
34140-56 = "그렇다는 건……"
34140-57 = "……어쩌면, 미메시스라는 건 단 한 번이라도 성공시키면 되는 것이고……,"
34140-58 = "애초에 우리의 진짜 임무는 공주님을 고성당에 데려가 미메시스를 발동시키는 것뿐이었다……?"
34140-59 = "그렇다면 그 뒤의 게헨나와 트리니티 점령 임무는……."
34140-60 = "그건…… 그건…… 그녀에게는 아무래도 상관없는 일이었던 건가……?"
34140-61 = "……."
34140-62 = "그럼 우리들의 임무라는 건 대체……."
34140-63 = "무슨 의미가 있었냐고요?"
34140-71 = "……포위당했어요?!"
34140-72 = "어느새……."
34140-73 = "함정…… 이미 우리가 여기로 올 거라는 걸 알고 있었던 건가……."
34140-77 = "물론이죠."
34140-78 = "……마담."
34140-79 = "여기는 제 지배 아래 있는 영지. 여러분들의 위치나 목적지 정도는 다 알고 있어요."
34140-80 = "너희들이 구교사의 회랑으로 가려는 것도 처음부터 알고 있었죠. 제가 모르는 것은 없답니다. 아이들이여."
34140-81 = "……히, 히이익. 처, 처음부터……."
34140-82 = "역시 손바닥 위였나……."
34140-83 = "……."
34140-84 = "네, 사오리. 그런 거죠."
34140-85 = "너희의 임무는 처음부터 로열블러드를 고성당에 데려가서 성도회를 현현시키는 것까지였어요."
34140-86 = "그 [ruby=path]패스[/ruby]는 한 번 연결되기만 하면 다음부턴 제가 통제할 수 있거든요. 마에스트로는 자신의 것을 뺏기는 것 같다고 싫어했지만."
34140-87 = "……."
34140-88 = "뭐, 트리니티나 게헨나를 점령하는 건 저에겐 아무래도 상관없는 일이에요."
34140-89 = "애초에 그건 이 자치구가 오랫동안 품고 있던 증오를 통제하기 위함이고, 저는 그 학원들에 아무런 유감도 없거든요."
34140-90 = "……!!"
34140-91 = "그러네요. 그런 의미에서 너는 임무를 잘 수행했다고 볼 수 있겠죠. 저에게 미메시스의 능력을 제공했고,"
34140-92 = "로열블러드도 순순히 제물로 가져다 바쳤네요. 역시 참 말을 잘 듣는 착한 아이에요. 사오리."
34140-93 = "……역시, 처음부터 당신은 약속을 지킬 생각이 없었던 거군……."
34140-94 = "뭐, 시시한 이야기는 이쯤하고…… 제 관심은…… 그래."
34140-100 = "크, 크윽……."
34140-102 = "처음 뵙겠습니다. [USERNAME] 선생님."
34140-103 = "[s] \"…………!!\""
34140-104 = "저는 베아트리체라고 합니다. 이미 알고 계실지도 모르겠지만, 그 <게마트리아>의 일원이죠. 이렇게 통신으로 인사드리는 걸 용서해주시길."
34140-105 = "검은 양복과 마에스트로, 골콩트를 통해 당신에 대한 많은 이야기를 들었습니다."
34140-106 = "[s] \"네가 아리우스를 지배하고 있는…… 베아트리체?\""
34140-107 = "네. 게마트리아에서 오직 저만이 성공했죠."
34140-108 = "방법이 궁금하신가요? 필요하다면 당신이 알고 있는 정보와 교환하는 것도 가능한데 말이죠."
34140-109 = "[s1] \"필요 없어.\"\n[s2] \"대충 알고 있어. 너의 수법은.\""
34140-110 = "흠? 그렇군요."
34140-111 = "흠? 그렇군요."
34140-112 = "제 명예를 위해 말해두겠지만, 제가 무언가 신비한 능력을 사용하거나 한 건 아니에요."
34140-113 = "세뇌나 초능력 같은 거……? 크큭큭. 그런 편리한 능력이 있었으면 좋겠지만. 아쉽게도 그런 건 <어른>의 방법이 아니죠."
34140-114 = "네. 증오와 경멸, 분노, 혐오…… 그런 것들을 이용해 거짓과 기만으로 사람들을 지배해왔어요."
34140-115 = "단순하지만 전통 있는 확실한 방법이죠. 당신이라면 잘 알고 있겠지만."
34140-117 = "……애초에 이 자치구는 제가 오기 전부터 자기들끼리 내전을 벌이고 있었어요."
34140-118 = "서로에 대한 증오가, 경멸이, 혐오가 이미 충분히 가득했죠. 저는 그것을 그저 활용했을 뿐."
34140-119 = "뭐, 그렇다고 여기가 특별하다는 말은 아니에요. 그런 건 어딜 가나 볼 수 있는 흔해 빠진 광경이잖아요?"
34140-122 = "그래, 증오하는 마음이라면…… 오히려 그 트리니티가 여기보다 더 강할지도요?"
34140-124 = "네, 저는 그런 식으로 움직이고 있어요."
34140-125 = "생의 겸허함을 가르치는 금언은 허무뿐인 공허로 왜곡하고,"
34140-126 = "타락을 경계하는 엄격한 성찰은 벗어날 수 없는 죄책감으로 왜곡하고,"
34140-127 = "사실을 왜곡하고, 진실을 은폐하고, 진심을 곡해하고, 혐오를 조장하고, 증오를 부추기고, 타인을, 타인을, 타인을, 타인을, 영원히 서로 타인이게 두는 것."
34140-128 = "낙원은 영원히 닿지 않기에 낙원인 것. 그 지옥도 속에서 <어른>은 <아이>를 지배하고 착취하고 포식합니다."
34140-129 = "누군가에겐 지옥이겠지만 이것이야말로 <어른>의 안락한 낙원."
34140-130 = "그러니까, 저의 [ruby=.]포[/ruby][ruby=.]식[/ruby][wa:1000]을 이해해주시겠어요? 선생님?"
34140-132 = "그 로열블러드를 이대로 내버려 두지 않겠어요?"
34140-133 = "그 아이는 제가 공을 들여 가르친 아이랍니다. 이 아이를 제물로 희생시키면, 분명 우리 어른들에게 좋은 일이 생기게 될 거예요."
34140-134 = "궁금하지 않나요? 제가 그 아이로 무슨 일을 하고 있는지? 어떤 위업에 도달할지? 궁금하다면 지금 여기서 알려드릴 수도 있습니다."
34140-135 = "그런 것엔 관심이 없으신가요? 선생님은?"
34140-137 = "가령…… 이 세계……, 이 키보토스라는 곳이 어떤 곳인지 알고 싶지 않으신가요?"
34140-138 = "이 세계는 그야말로 정체불명. 그 어떤 것도 이해 불가능한 신비와 공포가 뒤섞인 숭고의 전로(轉爐)."
34140-140 = "저라면 이 세계의 진실을 알려드릴 수도 있습니다. 어떤가요? 이 기회를 놓친다면 두 번 다시 다음 기회는 없을지도 몰라요."
34140-141 = "[s] \"거기까지 해.\""
34140-142 = "흐음?"
34140-143 = "[s3] \"그런 건 관심 없어.\"\n[s4] \"누군가를 희생해서 도달할 수 있는 진실 같은 건 필요 없어.\""
34140-144 = "……크큭큭. 역시나 그렇군요. 역시 이런 결말이네요."
34140-145 = "……크큭큭. 역시나 그렇군요. 역시 이런 결말이네요."
34140-146 = "아무래도 우리는 서로 다른 진실을 믿고 있는 듯해요. 당신이야말로 저의 대적자가 분명하군요."
34140-147 = "그래…… 요컨대 <에덴조약>이었던가요, 당신이 기대는 그 낙원이? 모두의 우정으로 악을 물리치는 단순하고 이해하기 쉬운 세계?"
34140-148 = "크크큭……. 정말이지 아이들의 생각이란 왜 이리 순진하고 단순한 건지."
34140-149 = "낙원의 이름을 아무 데나 갖다 붙인다고 달라지는 건 없어요. 오히려 어른이라면 이렇게 진실을 가르쳐 줘야겠죠."
34140-150 = "<그 낙원이야말로 최초의 죄가 시작된 곳이다>, 라고……."
34140-151 = "진짜 낙원이야말로 증오, 분노, 혐오, 고통, 후회, 자책, 자해…… 그런 것들로 가득 차 있는 거라고."
34140-152 = "[ns] \"베아트리체.\""
34140-154 = "[ns5] \"너는 선생을, 학생을, 우리를 모욕했어.\"\n[ns6] \"너는 가르친다는 것을 모욕했고, 배운다는 것을 모욕했어.\"\n[ns7] \"나는 어른으로서 너를 절대로 용서할 수 없어.\""
34140-159 = "……그건 선전포고라고 생각해도 되겠죠?"
34140-160 = "좋습니다. 바실리카에서 기다리고 있겠습니다. 여기까지 도달할 수 있다면 말이죠."
34140-161 = "여기서 결착을 짓도록 하죠."
34140-162 = "자아, 선생님. 불가해한 자여."
34140-164 = "검은 양복은 너를 동류로 인식하고 서로 길항한다고 믿고,"
34140-165 = "마에스트로는 너를 이해자로 인식하고 서로 상승한다고 믿고,"
34140-166 = "골콩트는 너를 메타포로 인식하고 서로를 통해 완성된다고 믿고,"
34140-167 = "그리고 나는 너를 대적자로 인식하고, 우리는 서로 반동한다고 믿습니다."
34140-169 = "너는 나의 적입니다."
34140-177 = "(…….)"
34140-178 = "(…….)"
34140-179 = "(네, 네. 주, 준비……는 됐어요!)"
34140-180 = "처치하세요."
34140-185 = "[ns] \"가자! 스쿼드!\""
34140-186 = "크아아아아아아--!!"
