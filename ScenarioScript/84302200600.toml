[translation]
84302200600-5 = "우와, 진짜 큰일 나는 줄 알았다! 하마터면 잡혀갈 뻔했네!"
84302200600-6 = "감사합니다, 선배! 선배 덕분에 살았어요!!"
84302200600-7 = "역시 네루 선배밖에 없……"
84302200600-12 = "쿠엑!!"
84302200600-13 = "왜, 왜 때려요!!!!"
84302200600-14 = "맞을 짓 했으니까."
84302200600-15 = "네-!? 설마 제가 뭐 한 건지 알고 계신 건가요!?"
84302200600-16 = "데이터 센터 무단 침입. 나머지는 아직 모르지."
84302200600-17 = "하지만 어차피 맞을 짓일 테니까."
84302200600-18 = "무슨 그런 말도 안 되는……!!"
84302200600-19 = "그래서, 결국 뭐 하느라 이런 데에 들어온 거냐? 너 같은 녀석이 올 만한 장소는 아닌데, 아무리 봐도."
84302200600-20 = "너무하시네요!! 이래 봬도 세미나의 일원이거든요!? 올 수도 있는 거 아닌가요!?"
84302200600-21 = "올 수 있어서 왔는데 경비 드론들이 달려들 리 없잖아."
84302200600-22 = "보나마나 뭐, 또 성적이나 통장에 든 돈 같은 거 조작하려고 왔을 테고……."
84302200600-26 = "……."
84302200600-27 = "진짜냐."
84302200600-28 = "아, 안 돼요. 안 돼요, 선배! 유우카 선배랑 노아 선배한테는 절대 말하지 말아 주세요!! 이번에는 진짜 안 돼요!!"
84302200600-29 = "이번에 걸리면 저 진짜 죽어요, 후배가 죽는 걸 보고 싶진 않으시겠죠!? 절대 이르면 안 돼요!!"
84302200600-30 = "그렇게나 찔리면 안 하면 됐잖아."
84302200600-31 = "그, 그건 어쩔 수 없었다고요!! 유우카 선배가 '이번 달 내내 한 일에 대한 반성문을 쓰게 하겠다'고 했으니까요!"
84302200600-32 = "데이터베이스에 있는 기록들을 없애면, 그래서 '한 일'을 줄이면 반성문도 줄어드니까……! 이건 당연한 것으로……!"
84302200600-37 = "크아아악……!! 또 때렸어!!"
84302200600-38 = "늘 느끼지만 정말 발상이 망가져 있구나, 너."
84302200600-39 = "으그윽……."
84302200600-40 = "그, 그러는 선배는……! 선배야말로 어째서 여기 계신 거죠!? 선배도 여기 계시면 안 되는 거 아닌가요!?"
84302200600-41 = "헤헹-!! 그러네! 생각해 보니 그런 방법이 있었네! 선배, 계약을 하죠!!"
84302200600-42 = "선배가 이르면 저도 이를 테니까요! 반대로 선배가 이르지 않으면, 저도 선배가 여기 오셨다는 걸 말하지 않도록 하죠!!"
84302200600-43 = "어때요? 나쁘지 않죠!? 괜찮은 제안이죠!?"
84302200600-44 = "헤에, 그렇게 나오시겠다."
84302200600-48 = "좋아. 그렇게 하지."
84302200600-52 = "에!? 이렇게 즉답!? 괜찮으신 거예요!?"
84302200600-53 = "괜찮고 자시고, 오늘은 애초에 너를 잡으러 온 게 아니거든. 이쪽은 이쪽대로, 해야만 할 중요한 일이 있다고."
84302200600-57 = "……가만 있어 봐. 생각해 보니 그런 수가 있었네."
84302200600-58 = "어이, 코유키. 너, 데이터 수정 하고 싶다고 했었지?"
84302200600-59 = "네, 네!? 아. 네, 뭐. 그런…….데요?"
84302200600-60 = "마침 잘됐네. 그러면 시스템을 관리하는 메인 컴퓨터가 뭔지도 알 거 아냐. 해킹도 할 수 있고."
84302200600-61 = "그야 그렇……죠?"
84302200600-66 = "왜…… 왜 다가오시는 거죠……. 뭐, 뭐죠…….!? 뭔가요!?"
84302200600-67 = "후후, 아니. 뭐 별건 아니고 말이야."
84302200600-72 = "……코유키. 아니, 코드네임 <백토> 씨."
84302200600-73 = "우리 같이, 거래 하나만 더 할까?"
