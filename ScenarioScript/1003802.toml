[translation]
1003802-1 = "SRT, 돌입합니다!"
1003802-2 = "샬레의 집무실"
1003802-3 = "(평화로운 샬레의 어느 오후 한때.)"
1003802-7 = "접착성 폭약 설치 완료. 기폭 개시."
1003802-8 = "3……"
1003802-9 = "2……"
1003802-10 = "1……"
1003802-11 = "콰광!"
1003802-14 = "SRT입니다! 모두 물러나세요."
1003802-18 = "클리어. 장소를 확보했습니다."
1003802-19 = "[s] \"미야코? 가, 갑자기 이게 무슨……?\""
1003802-20 = "선생님? 어째서 이곳에……"
1003802-21 = "[s1] \"내가 더 묻고 싶은 상황이라고…….\"\n[s2] \"여기는 샬레의 사무실이니까.\""
1003802-22 = "네? 이곳이 악독한 범죄자의 본거지가 아니라, 샬레의 집무실이었다고요?"
1003802-23 = "네? 이곳이 악독한 범죄자의 본거지가 아니라, 샬레의 집무실이었다고요?"
1003802-26 = "아아, 어쩐지……"
1003802-27 = "그래서 그런 신고가 들어왔던 것이군요."
1003802-28 = "[s] \"신고라니, 무슨 신고?\""
1003802-29 = "어느 수상한 어른이 있는 사무실에 여학생들이 드나든다는 신고가 들어와 저희 소대에서 자체적으로 조사중이었습니다."
1003802-30 = "……과연, 그 수상한 어른이란 선생님을 말하는 것이었나 보군요."
1003802-31 = "다단계 사기나 납치 범죄 등에 연루된 학생이 있는 건 아닌 것 같아 안심했습니다."
1003802-32 = "[s] \"……오해가 끝났으면 이만 돌아가 줘……\""
1003802-33 = "아뇨, 임무는 끝나지 않았습니다."
1003802-34 = "아무리 오해라고는 하지만, 신고가 들어온 이상 이 사무실이 수상하지 않다는 증거를 확보해야 합니다."
1003802-35 = "지인의 말만 믿고 현장에서 철수했다가 작전을 그르친 사례는 수도 없이 많으니까요."
1003802-36 = "소대원 여러분. 침대 밑과 책장 안을 중점적으로 수색하면서 수상한 물건이 없는지 확인합시다."
1003802-37 = "[s] \"안 돼, 그것만은……!\""
1003802-38 = "네? 무슨 문제라도 있으신가요?"
1003802-39 = "선생님께서는 타의 모범이 되시는 분이시니, 당연히 위법한 물건은 소지하지 않고 계시겠지요?"
1003802-40 = "그러니 방을 수색한다 하더라도 문제가 없으시겠지요?"
1003802-41 = "[s] \"……그게 그러니까……\""
1003802-49 = "어라? 침대 아래에 무언가 수상한 표지의 책이……."
1003802-50 = "<모두와 쉽게 친해질 수 있는 101가지 모모톡 필승법>……?"
1003802-51 = "……선생님, 이것은 지도 교육에 필요한 물건입니까?"
1003802-52 = "[s3] \"무, 물론이지……!\"\n[s4] \"학생의 호감을 사는 일은 중요하니까……!\""
1003802-53 = "……."
1003802-54 = "……."
1003802-55 = "선생님께서 그렇게 말씀하시니 일단은 넘어가 드리겠습니다만……"
1003802-60 = "어라? 책장 안의 빈 공간에 숨겨진 책이 또……?"
1003802-61 = "<인기있는 어른을 위한 패션 코디북>……."
1003802-62 = "[s] \"…….\""
1003802-67 = "……수색은 이것으로 종료하겠습니다."
1003802-68 = "다행히 샬레의 사무실에 위법한 물건이나 범죄의 증거는 없는 것 같습니다만……"
1003802-69 = "'수상한 어른이 있는 사무실'이라는 신고만큼은 틀리지 않았던 것 같군요."
1003802-71 = "(이후, RABBIT 소대는 돌아갔지만, 한동안 미야코로부터 미적지근한 시선을 받게 되었다…….)"
