[translation]
52130-1 = "제13화;뱀의 아가리 속에서"
52130-2 = "……이러고 있을 때가 아니야."
52130-3 = "유카리, 유카리는 지금 어디에 있지?"
52130-7 = "유카리는 서원 쪽을 수색하러 갔잖아."
52130-8 = "그나저나 갑자기 왜 서두르는 건데? 무슨 이상한 점이라도 알아차렸어?"
52130-9 = "내 예상이 틀리지 않다면 이 저택은 함정이야. 빨리 부원들을 데리고 빠져나가야……"
52130-13 = "아니, 지금 바로 [USERNAME] 선생님께 가야 해!"
52130-14 = "스승님께? 일단 가더라도 영문은 알아야—"
52130-24 = "이 녀석들, 지난번의 그 괴물들이잖아!"
52130-25 = "어느새 이렇게 많은 수가 잔뜩……"
52130-26 = "렌게, 녀석들을 처리하는 방법은 기억하고 있겠지?"
52130-27 = "녀석들에게는 평범한 총알이 듣지 않아. 하지만 물리 법칙을 거스를 정도의 괴물은 아니니까, 바닥을 노려 제압하는 거야."
52130-28 = "맡겨만 달라고!"
