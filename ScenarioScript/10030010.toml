[translation]
10030010-1 = "제1화;뜻밖의 캠핑"
10030010-2 = "밀레니엄 학습관, 중앙 광장"
10030010-5 = "으으…… 휴일인데 이 시간에 일어나야 한다니, 너무해……"
10030010-7 = "동감입니다. 황금 같은 휴일…… 그것도 한 해의 마지막 하루처럼 재미있는 소리가 가득한 날에 조용한 교외로 떠나야 한다니…… 막대한 손해입니다."
10030010-8 = "평소라면 자고 있을 시간인데…… 억지로 일어나려 하니 머리가 아파……"
10030010-14 = "[ns] \"……그래도 다들 늦지 않고 모여 주었네.\""
10030010-18 = "어라? [USERNAME] 선생님?"
10030010-19 = "아침부터 밀레니엄 사이언스 스쿨에는 무슨 일로……"
10030010-20 = "[s1] \"멀리 여행을 간다고 치히로에게 들었거든.\"\n[s2] \"혹시 어른의 도움이 필요하지 않을까 싶어서.\""
10030010-23 = "[ns] \"……갑자기 찾아와서 방해가 되었으려나?\""
10030010-24 = "그렇지 않아! 선생님이라면 언제든 환영이니까!"
10030010-26 = "하루 종일 [USERNAME] 선생님의 목소리를 곁에서 들을 수 있다면, 그렇게 큰 손해는 아닐지도……"
10030010-27 = "다만 오늘은 우리끼리만 여행을 가는 줄 알고, 너무 대충 걸쳐 입어서…… 옷차림이 조금 신경 쓰이는걸."
10030010-29 = "그러게. 오늘 선생님이 오는 줄 알았더라면 좀 더 멋진 색의 옷을 입고 올 걸 그랬어."
10030010-30 = "……이런 귀중한 정보를 놓치고 있었다니, 베리타스의 부원으로서 크나큰 불찰입니다."
10030010-31 = "[s3] \"하지만 내가 보기에는 아주 예쁜걸?\"\n[s4] \"다들 겨울 사복도 정말 잘 어울려!\""
10030010-34 = "선생님이 그렇게 말해준다면 상관없지만……"
10030010-35 = "그보다 정작 우리를 부른 치히로 선배는 왜 모습이 안 보이는 거야?"
10030010-36 = "설마 우리 보고는 편하게 입고 오라고 해놓고선, 혼자 기합이 잔뜩 들어간 옷을 입고 온다든가—"
10030010-44 = "다들 늦지 않고 제시간에 모여주었네. 찾으러 갈 필요를 덜어서 다행이야."
10030010-49 = "치히로 선배, 그 모습은……?"
10030010-50 = "……다른 의미로 엄청나게 기합이 들어간 모습이군요."
10030010-51 = "하하! 그 차림은 뭐야, 선배! 지금부터 어디 캠핑이라도 가려는 거야?"
10030010-53 = "응, 맞아. 캠핑."
10030010-54 = "……내가 이야기 안 했었던가?"
10030010-59 = "캠핑?!"
10030010-61 = "그래. 단순히 밖에서 일출만 보고 오는 거라면 전날 아침부터 너희를 불러 모으지는 않았겠지."
10030010-64 = "오늘 우리가 갈 곳은 밀레니엄 자치구 외곽에 있는 히가시알프스야."
10030010-65 = "동쪽 방향으로 높은 봉우리가 멋지게 솟아 있어 일출 명소로도 유명하지만, 산어귀에 넓은 평지와 강이 있기 때문에 숨겨진 캠핑 명소로도 잘 알려져 있지."
10030010-68 = "우리는 이곳 산어귀에서 텐트를 치고 하룻밤 야영을 한 뒤에 새벽 일찍 산을 올라 아침 일출을 볼 거야."
10030010-69 = "하루 동안 문명에서 벗어나 자연 속에서 건강한 하루를 보내고 나면, 모니터 밖에도 즐거운 것들이 잔뜩 있다는 사실을 너희들도 조금은 이해할 수 있겠지."
10030010-75 = "앗, 선배! 그러고 보니 갑자기 급한 약속이 떠올라서!"
10030010-76 = "갑자기 지병인 만성 카페인 결핍증이 도져서……"
10030010-77 = "아까 설치해 둔 도청기에서 긴급한 구조 요청이—"
10030010-79 = "안 돼. 전에도 말했잖아? 이건 부부장 명령이니까 불참은 허가하지 않겠어."
10030010-80 = "히마리에게도 사전에 허가를 다 받아왔으니까. 오늘만큼은 내 지시에 잠자코 따르도록 해."
10030010-83 = "우우— 치사해! 악마! 독재자!"
10030010-84 = "밀레니엄의 새로운 빅 시스터가 이렇게 탄생하는 건가……"
10030010-85 = "선생님, 도와줘……"
10030010-86 = "[s] \"그런 눈으로 쳐다보아도……\""
10030010-90 = "[ns5] \"실제로 경험해 보면 생각보다 더 즐거울 거야.\"\n[ns6] \"힘든 일은 같이 도와줄 테니까, 하루만 노력해 보자.\""
10030010-95 = "선생님이 그렇게 말한다면……."
10030010-96 = "단 하루뿐이라면 어떻게든 참을 수 있으니까."
10030010-97 = "선생님의 목소리를 녹음할 수 있다면 장소는 딱히 어디든 상관없습니다."
10030010-99 = "자. 그럼 모두 출발하기 전에……"
10030010-104 = "소지품 검사부터 할게."
10030010-108 = "소지품 검사? 갑자기 소지품은 왜?!"
10030010-109 = "설마 초등학생도 아니고, 간식은 500엔까지— 같은 규칙이 있는 건 아니겠지……?"
10030010-111 = "간식이야 얼마든지 챙겨도 상관없지만, 캠핑과 관련 없는 전자 장비는 안 돼."
10030010-112 = "혹시라도 가져온 전자 장비가 있다면 모두 학원에 두고 가도록 해."
10030010-113 = "어째서?!"
10030010-114 = "아까도 말했지만 이번 캠핑은 문명에서 벗어나 자연 속에서 건강한 하루를 보내는 데 목적이 있으니까."
10030010-115 = "첨단 전자기기를 잔뜩 챙겨서 캠핑을 가면 장소만 바뀔 뿐이지, 하는 일은 결국 똑같아질 게 뻔하잖아?"
10030010-116 = "그러니까 이번 여행은 꼭 필요한 장비만 챙겨서 이동하도록 해."
10030010-117 = "저, 혹시 핸드폰도 두고 가야 하는 거야?"
10030010-118 = "휴대전화는 비상시를 대비해서 가져가도 괜찮지만, 큰 쓸모는 없을 거야."
10030010-119 = "어차피 우리가 가는 캠핑장은 전파가 잘 터지지 않는 산 한가운데에 있으니까."
10030010-120 = "윽……"
10030010-121 = "자, 마키부터. 가방 이리 줘."
10030010-125 = "어디 보자. 이건……"
10030010-129 = "……태양열 파워스테이션?"
10030010-131 = "그게 그러니까……"
10030010-132 = "호, 혹시라도 급하게 연락을 해야 하는데, 핸드폰 배터리가 없다면 큰일이니까!"
10030010-133 = "태양열 발전이 가능한 파워스테이션을 준비해 둔다면 언제 어디서든 핸드폰을 충전할 수 있잖아?"
10030010-134 = "……핸드폰 충전은 휴대용 배터리만으로도 충분해."
10030010-135 = "야외에서 냉장고를 쓸 것도 아닌데 파워스테이션은 필요 없잖아?"
10030010-139 = "그리고 이건……"
10030010-140 = "……휴대용 파라볼라 안테나?"
10030010-141 = "호, 혹시라도 조난을 당했을 때 구조 신호를 보내기 위해서입니다."
10030010-142 = "전파가 터지지 않는 오지에서는 평범한 안테나로는 신호를 받을 수 없으니……"
10030010-143 = "이런 지향성 안테나를 사용해야 할 정도로 깊은 오지로 떠나는 게 아니거든?"
10030010-144 = "이건 누가 봐도 인터넷 설비용 안테나잖아!"
10030010-145 = "게다가 이쪽은……"
10030010-149 = "……NAS 서버 구축용 클라우드 머신?"
10030010-154 = "너희는 캠핑장에 간이 통신소를 차리려는 셈이야?!"
10030010-159 = "그게 하루가 넘게 인터넷에 접속할 수 없다고 생각하니 초조해져서……"
10030010-160 = "최근에는 디지털 노마드라는 말도 있으니까요."
10030010-161 = "다른 건 몰라도 최소한 인터넷에 접속할 수 있는 장비 정도는 가져가면 안 될까?"
10030010-163 = "안 돼. 가져온 전자 장비는 모두 부실에 두고 가."
10030010-164 = "다시 말하지만 이번 여행은 너희들의 인터넷 중독을 조금이나마 완화하기 위한 특단의 조치니까—"
10030010-165 = "오늘 하루는 캠핑장 밖에서 무슨 일이 벌어지는지 잊고 휴식을 즐기도록 해."
10030010-168 = "인터넷 없이 휴식을 즐기라니, 말도 안 되는 억지스러운 요구야……"
10030010-169 = "사회에서 격리된 죄수의 기분이 이런 걸까……"
10030010-170 = "모처럼 선생님 곁에서 하루를 보낼 수 있는 기회인데, 고음질의 녹음 장비를 가져갈 수 없다니……"
10030010-173 = "취사도구와 텐트, 식재료, 방한 도구는 모두 챙겼으니……"
10030010-174 = "이만하면 캠핑에 필요한 준비물은 모두 챙긴 것 같네."
10030010-179 = "그럼 모두 기운 내서 캠핑장으로 함께 이동하자고!"
10030010-180 = "[s] \"와아아—\""
10030010-183 = "우우우……."
