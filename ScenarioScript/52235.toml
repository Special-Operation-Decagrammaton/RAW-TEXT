[translation]
52235-4 = "……무슨 생각이신가요, 니야 부장?"
52235-8 = "어라, 처음 보는 얼굴이네요."
52235-9 = "당신이 이번 괴담을 자아낸 괴담가인가요? 아니면 또 다른 누군가의 그림자……?"
52235-10 = "괴담가라니…… 그 얼치기 꼬마와 같은 취급을 하다니, 아무리 음양부의 부장님이라지만, 그 말씀은 다소 불쾌하군요."
52235-11 = "후후, 인사도 없이 불쑥 남의 공간에 들어오는 꼴이 전에 만났던 슈로 양과 꼭 닮아보여서."
52235-12 = "의도치 않게 무례를 저질렀네요. 부디 너그러이 양해해 주시길."
52235-16 = "……그런 싸구려 도발을 하더라도, 바뀌는 건 아무것도 없습니다."
52235-17 = "당신들이 억지로 축제를 강행한다 하더라도 이 국면을 뒤집을 수 없는 것처럼 말이지요."
52235-18 = "………호오."
52235-19 = "그럼 늦었지만 제 소개를 할까요."
52235-20 = "제 이름은 하부 아자미."
52235-21 = "당신이 말한 대로 작금의 이야기를 담당하고 있는 장본인이자, 화조풍월부의 괴예가를 맡고 있는— 코쿠리코 님의 심복이랍니다."
52235-23 = "분명 괴담을 자아낼 수 있는 괴서, <이노모노노케로쿠>는 지난번에 파괴했을텐데……"
52235-24 = "재담도 반복하면 질리는 법인데, 당신들은 질리지도 않는 모양이네요."
52235-25 = "그런 그림 한 장 없는 시시한 이야기와 비교하지 말아 주시겠어요?"
52235-26 = "제가 가진 괴서, <토테이붓카이로쿠>의 힘은 사람의 공포에서 비롯되는 것."
52235-27 = "<이노모노노케로쿠>가 추구하는 욕망과 달리, <토테이붓카이로쿠>의 공포는 훨씬 더 뚜렷하고 선명한 심상을 자아내지요."
52235-28 = "세상에는 스스로가 원하는 바가 무엇인지 알지 못하는 사람이 태반이지만, 무엇을 두려워하는지는 누구나 또렷이 상상할 수 있으니까요."
52235-29 = "자그마한 벌레부터 거대한 맹수까지. 눈에 익은 악우부터 얼굴 모를 타인까지."
52235-30 = "공포의 이미지는 말 한마디로 부정하기엔 너무나도 또렷하여, 쉬이 떨쳐낼 수 없는 강렬한 색을 자아내니까요."
52235-31 = "무슨 수를 쓰더라도 당신들은 영원토록 이 공포에서 벗어나지 못할 겁니다."
52235-32 = "히토츠메가 노려보고 있는 한, 당신들은 영원히 공포에 떨며 <토테이붓카이로쿠>의 신비를 생육하는 모판이 되어주셔야겠어요."
52235-33 = "냐하하…… 모판이라니, 에비스 분교에서 오신 분이라 그런지 참으로 고풍스러운 표현을 쓰시는군요."
52235-34 = "그럼 다시 한번 묻겠습니다, 니야 부장."
52235-35 = "그렇게 발버둥을 친다고, 무언가 바뀔 거라고 생각하셨나요?"
52235-36 = "아뇨?"
52235-37 = "제 힘으로는 아무것도 바꿀 수 없다는 건 제가 더 잘 알고 있답니다."
52235-41 = "그럼 어째서, 축제를 속행시킨 거지?"
52235-42 = "그렇게 발버둥이라도 치면 조금이나마 죄책감을 덜 수 있을 거라 생각했나?"
52235-46 = "……역으로 질문을 하나 드려도 괜찮을까요, 아자미 씨?"
52235-47 = "과거 전란의 시대부터 현재에 이르기까지."
52235-48 = "백귀야행 자치구 곳곳에서 사람을 홀리고 괴담을 퍼트려 왔던 괴이들이, 학원이 연합한 이후로는 어찌하여 외곽에서만 드물게 모습을 드러낼 수 있었던 것인지 알고 계시나요?"
52235-49 = "그야…… 너와 같은 음양부 녀석들이 뭔가 술수를 부린 탓이겠지."
52235-50 = "냐하하~ 설마요."
52235-51 = "그런 귀찮은 일을 해야만 했다면, 음양부의 부장 자리 같은 건 처음부터 맡지도 않았을 겁니다."
52235-56 = "정답은…… 백귀야행에서 언제나 진행되는 축제, 마츠리 덕분이랍니다."
52235-57 = "……축제?"
52235-58 = "네. 여러 사람들을 한 자리에 불러 모으는 커다란 축제요."
52235-59 = "그동안 이상하다고 생각하지 않으셨나요?"
52235-60 = "학생회도 아닌, 일개 동아리에 불과한 마츠리운영관리부가 학원의 학사일정을 결정하고, 자치구 전체의 자금 흐름을 좌지우지할 수 있다는 사실이."
52235-61 = "이는 단순히 제 게으름으로 미룬 것이 아니라, 쿠즈노하 때부터 결정된 사안이었답니다."
52235-62 = "최초의 축제는 하늘에 올리는 제사에서 비롯되었다 하지요."
52235-63 = "신찬을 올려 넋을 부르고, 현세의 어려움을 고하고, 미래의 안녕을 기원하는 제사—"
52235-64 = "다시 말해, 제가 지금 속행하고자 하는 것은 단순한 '축제'가 아니랍니다."
52235-68 = "……안온한 내일을 맞이하는 거대한 의식, '[ruby=제의]마츠리[/ruby]'지요."
52235-69 = "그게 무슨……"
52235-73 = "히토츠메의 눈이…… 흐려지고 있어?"
52235-87 = "네 녀석, 도대체 무슨 짓을 한 거냐!"
52235-88 = "무슨 짓을 했기는요."
52235-89 = "평소와 같이 조화로운 상태를 유지하도록 돕는 것이 저희 음양부의 일인걸요."
52235-94 = "거리에 음기가 가득 차면 양기로 이를 상쇄한다…… 단순한 음양의 이치지요."
52235-97 = "여, 여기에도 눈이 있어!"
52235-98 = "어디로 도망쳐도 저 눈, 저 눈이 우릴 지켜보고 있다고……!"
52235-99 = "저 시선을 마주할 때마다 끔찍한 생각이 머리에서 가시질 않아……"
52235-100 = "이젠 끝이야…… 백화요란도 없으니 우린 모두 이대로 저 괴물에게 삼켜지게 될 거라고!"
52235-104 = "……어라? 어디서 노랫소리가 들리는데?"
52235-105 = "잘못 들은 거 아냐? 이런 난리통에 누가 노래를 부른다고."
52235-106 = "아니야, 분명히 저쪽에서 낯익은 노랫소리가 들렸는데……"
52235-108 = "여러분, 와라쿠 축제는 중단되지 않습니다! 모두 무대 앞으로 모여 주세요!"
52235-109 = "치세 쨩의 미공개 신곡을 무대 1열에서 직관할 수 있는 세기의 찬스!"
52235-110 = "그동안 아껴 두었던 치세 쨩 한정 굿즈도 대방출합니다!"
52235-111 = "공연 중에 드실 벚꽃 소다도 준비되어 있어요!"
52235-114 = "저기서 공연을 하고 있는 게 누구지?"
52235-115 = "너, 설마 알아보지 못하는 거야? 백귀야행 최고의 아이돌이자 이번 축제의 주역인 와라쿠 공주님, 치세 쨩을!"
52235-116 = "설마 이런 장소에서 공연을 강행하다니. 치세 님의 노래, 듣지 못할 줄 알았는데……"
52235-123 = "저리 비켜! 나는 지금 당장 치세 님의 공연을 보러 가야겠어!"
52235-124 = "이 위험한 상황에 축제를 즐기겠다고……?"
52235-125 = "어차피 다 끝나버릴 거라면 치세 님의 공연이라도 보면서 끝나는 게 낫지!"
52235-130 = "모두 꽉 붙잡아~"
52235-131 = "황혼의 저 끝까지~"
52235-136 = "……나쁘지 않은 발상이긴 하네."
52235-137 = "축제의 소란으로 분위기를 잠시 반전시키는 것만으로도 <토테이붓카이로쿠>의 공포를 중화할 수 있을 테니까."
52235-138 = "하지만 그렇다고 영원히 축제를 계속할 생각이야?"
52235-139 = "축제도 언젠간 막을 내릴 테고, 그럼 괴서의 공포가 다시 학원을 지배하겠지."
52235-140 = "……네 기책이라는 것도 결국은 시선을 피한 채 눈을 가리는 미봉책일 뿐이야."
52235-141 = "글쎄요. 지금 시선을 걱정해야 하는 건 저보다 당신들 아닐까요?"
52235-142 = "당신의 눈에는 이 천수각 위를 수놓고 있는 저 화려한 불꽃놀이도 보이지 않는 모양이니."
52235-143 = "그깟 불꽃놀이가 지금 뭐가 중요하다고……"
52235-144 = "모르셨나요? 그럼 이 기회에 알려드리지요."
52235-145 = "무선 기술이 발달하기 전, 불꽃은 구조자의 위치를 알리는 신호로도 쓰였었답니다."
52235-147 = "네 녀석, 설마 이 틈을 노려 백화요란에게 신호를—"
52235-149 = "이것이 바로 백화요란식 사격술—"
52235-153 = "청춘의 불꽃이다!"
52235-164 = "다음화;불안을 쫓는 귀곡성"
