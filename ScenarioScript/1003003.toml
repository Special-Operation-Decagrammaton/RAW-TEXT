[translation]
1003003-1 = "약선 요법"
1003003-3 = "선생님, 치나츠입니다."
1003003-4 = "말씀드린 물건을 가지고 왔습니다. 들어가도 괜찮을까요?"
1003003-5 = "[s] \"응, 들어와.\""
1003003-11 = "방문을 허락해 주셔서 감사합니다. 모처럼 좋은 재료를 구한 김에 선생님께도 보여드리고 싶었거든요."
1003003-12 = "혹시 제가 선생님의 휴식을 방해한 것은 아닐지……."
1003003-13 = "[s1] \"나도 차가 마시고 싶던 참이었어.\"\n[s2] \"나도 치나츠가 보고 싶던 참이었어.\""
1003003-14 = "후후, 그러셨다니 다행이군요."
1003003-15 = "……!?"
1003003-16 = "그, 그렇게 놀리시면 반응하기가 곤란합니다. 선생님."
1003003-17 = "다시 본론을 말씀드리자면, 오늘 선생님께 보여드리고자 하는 것은 약선차(藥膳茶)입니다."
1003003-18 = "[s] \"약선차?\""
1003003-19 = "예, 약선이란 약이 되는 음식이라는 뜻으로, 몸에 좋은 약재를 사용한 음식으로 식사와 함께 기력을 보충하는 요법입니다."
1003003-20 = "특히 약선차는 약초 등을 찻잎과 함께 달여 낸 요리이기 때문에, 흡수가 빠르고 향을 통해서도 심신을 안정시킬 수 있습니다."
1003003-21 = "그래서 격무에 지친 선생님을 위해 몇 가지 재료를 준비했습니다."
1003003-28 = "우선 첫 번째로 준비한 것은 꿀에 절인 생강을 이용한 생강차입니다."
1003003-29 = "생강은 향이 맵고 아리긴 하지만 비타민이 풍부해 면역력을 높이는 데 도움이 되고, 혈액순환을 촉진해주는 효과가 있습니다."
1003003-30 = "거기에 달콤한 꿀을 더했으니 매운맛은 줄여주고 기력은 높여주는 효과를 보실 수 있을 겁니다."
1003003-34 = "그리고 다음으로 준비한 것은 말린 국화를 이용한 국화차입니다."
1003003-35 = "국화에는 여러 가지 유익한 항산화 성분이 포함되어 피로 해소, 특히 눈의 피로를 경감시키는 데 효과가 있다고 합니다."
1003003-36 = "게다가 국화가 우러나면서 나는 풍부한 향에는 심신을 안정시켜주는 효과가 있지요."
1003003-37 = "그리고 또 준비한 것은……"
1003003-38 = "[s3] \"잠깐 기다려, 치나츠.\"\n[s4] \"그렇게 많이 마실 수는 없다고!\""
1003003-39 = "그, 그런가요……?"
1003003-40 = "그, 그런가요……?"
1003003-41 = "그러고 보니 선생님께서 한 번에 드실 수 있는 차에는 한계가 있는데, 제 의욕이 앞서 너무 많이 준비를 했군요."
1003003-42 = "저는 그저 선생님께서 빨리 피로를 해소하셨으면 좋겠다는 마음에……."
1003003-43 = "[s5] \"생강차면 충분해.\"\n[s6] \"국화차면 충분해.\""
1003003-44 = "네, 그럼 말씀하신 차를 준비하도록 하겠습니다."
1003003-45 = "네, 그럼 말씀하신 차를 준비하도록 하겠습니다."
1003003-51 = "(치나츠는 물을 끓이고 분주히 차를 준비하기 시작했다.)"
1003003-52 = "[s] \"벌써부터 치유되는 기분이야…….\""
1003003-53 = "네? 아직 찻물이 채 끓지도 않았는걸요?"
1003003-54 = "……후후, 하지만 어떤 기분이신지 조금은 알 것 같네요."
1003003-55 = "아무런 목적도 없이, 부담도 없이. 다구가 자아내는 청명한 소리에 귀를 기울이며 차를 즐기는 오후의 한때."
1003003-56 = "최고의 휴식은 마음을 비우고 아무것도 하지 않는 시간에서 비롯된다는 말도 있으니……"
1003003-57 = "선생님과 함께하는 이 시간이야말로 진정한 의미의 '약선'일지도 모르겠습니다."
1003003-59 = "(이후, 치나츠와 함께 차를 나누어 마시며 여유로운 오후를 보냈다.)"
