[translation]
10042055-2 = "……나 지금 머릿속으로 수십 개 정도 되는 말이 떠올랐다가 사라졌어."
10042055-3 = "그 중 하나라도 입 밖으로 내면, 여러 가지 의미로 아웃일 것 같아서 참았지만."
10042055-4 = "우리…… 이걸 어떻게 받아들여야 하는 걸까요……?"
10042055-6 = "……잘 자랐다?"
10042055-7 = "선배?!"
10042055-8 = "[ns1] \"와…… 어질어질하다…….\"\n[ns2] \"성장기였구나.\""
10042055-11 = "확실히, 더 이상의 탐색은 무의미하겠네요. 세나 선배."
10042055-12 = "예. 진실로 흥미롭군요."
10042055-13 = "이런 때에까지 그런 소리야?!"
10042055-14 = "분명히 지금까지는 그다지 별거 아닌 일이었겠습니다만."
10042055-15 = "이건……"
10042055-16 = "……이제 조금, '별거' 같군요."
