[translation]
90001120-1 = "제12화;제안"
90001120-3 = "저는 어디까지나 전해 들은 것입니다만, 그때 아리스가 많은 활약을 했다고 하더군요."
90001120-4 = "제가 기억하고 있는 것은, 모든 일이 마무리된 뒤, 게임개발부 여러분께서 초현상특무부의 동아리실로 찾아왔던 것 정도입니다."
90001120-5 = "파티 제안, 2kb의 데이터, 로봇 형상 열쇠고리, 적절한 분위기, 감동적인 배경 음악, 그리고 마침내 저의 메인 히로인 등극까지."
90001120-6 = "참 많은 일이 있었죠."
90001120-7 = "……훗."
90001120-8 = "앞부분은 대충 알겠는데, 뒤는 무슨 소리인가요……."
90001120-9 = "그냥 해 본 말입니다."
90001120-16 = "(요즘 토키가 은근슬쩍 개인적인 욕심을 부리고 있는 것 같단 말이지…….)"
90001120-17 = "아무튼, 그때 우트나피쉬팀의 배에서 아리스가 재구축해 낸 방주는…… 그야말로 아리스의 '용사의 증거' 였죠."
90001120-18 = "후후. 아직도 제가 붙인 이름이 생각나네요. <빛의 검: 아트라하시스의 슈퍼 노바> 였죠."
90001120-19 = "……그때는 하지 못했던 말이지만, 그 네이밍 센스 조금 이상하지 않아?"
90001120-20 = "센스에 대해서 당신에게 그런 말을 듣다니, 그야말로 치욕이네요!"
90001120-21 = "(부장이나 회장이나…….)"
90001120-22 = "흠, 흠."
90001120-23 = "그렇지만 우리는 아리스가 그때 정확히 무엇을 했는지 몰라요. 문제는 여기에 있죠."
90001120-24 = "어떤 메커니즘으로 어떤 공정을 거쳐, 그런 것을 재구축해 냈는지 알 길이 없었죠."
90001120-25 = "그래……. 그 에너지의 근원은 무엇이었는지, 물질 재구축은 무슨 방식으로 이루어지는지."
90001120-26 = "그리고 그것들을 어떻게 수렴하여 방출한 것인지, 전혀 알 방법이 없었어."
90001120-27 = "그 일은 어떻게 보면…… 우리 입장에서는, '순간'에 일어난 것이었으니까."
90001120-28 = "알지 못한다는 것은, 재현이 매우 어렵거나 불가능에 가깝다는 뜻이죠……."
90001120-29 = "단 한 번뿐인 기적이라는 것은, 어떤 의미에서 낭만적이지만."
90001120-30 = "그렇기에 그것은 이론과 학문의 적이기도 하고요."
90001120-31 = "그래. 학문이란 것은 기본적으로 누구나 해당 과정을 충분히 숙지하면."
90001120-32 = "동등하게 같은 결과를 낼 수 있도록 고안된, 일종의 시스템적 과정이니까."
90001120-33 = "……."
90001120-34 = "나는, 우리가 아리스에게 이 일을 직접 이야기해야 한다고 생각해."
90001120-35 = "그건, 다시 말해 우리가 아리스를 이곳으로 부를 필요가 있다는 것인가요?"
90001120-36 = "그래. 그 말대로야. 그래서 아리스에게 그때 했던 일들에 대해 분석을 부탁하고–"
90001120-37 = "리오. 그렇지만…… 정말 그래도 되는 걸까요?"
90001120-38 = "응? 무슨 뜻이야?"
90001120-43 = "그건 어떤 의미로, 아리스를 문제 해결의 '도구'로 삼겠다는 뜻으로도 해석될 수 있잖아요?"
90001120-44 = "……!"
90001120-45 = "……."
90001120-46 = "회장……."
90001120-51 = "리오. 두 번 말하지는 않겠어요. 우린 이미 우트나피쉬팀의 배에서 지금과 비슷한 이야기를 나눈 적이 있었죠."
90001120-52 = "그때에는 토키가 대상이었고, 지금은 아리스가 그 대상이 된 것뿐이에요."
90001120-53 = "물론 청초한 절벽 위의 한 떨기 꽃 같은 저는, 당신이 어떤 사고를 치고 어떤 후회를 하든 그렇게까지는 신경 쓰지 않겠지만……."
90001120-54 = "알잖아요? 비슷한 실수를 계속해서 반복하는 것은, 보는 입장에서도…… 그렇게 즐겁지만은 않은 일이라는 걸요."
90001120-55 = "으, 응……. 그래. 그렇지……. 그 말이, 맞아……."
90001120-56 = "[s] \"…….\""
90001120-60 = "[ns] \"있잖아, 리오.\""
90001120-61 = "응……?"
90001120-78 = "[ns] \"우리에게 필요한 것은, 결국 아리스인 걸까?\""
90001120-79 = "그…… 미안해. 선생. 잊어 줘. 나 스스로도 100% 확신은 할 수 없어. 그저 가능성 중 하나일 뿐이야."
90001120-80 = "그냥, 내 제안은 없던 것으로 하고, 잊어 줬으면 좋겠어. 어쩌면 내가 잘못 생각했던 것일 수도 있고……."
90001120-81 = "[s] \"그러면 내가 아리스와 게임개발부 아이들에게 이야기해 볼게.\""
90001120-82 = "서, 선생?!"
90001120-83 = "선생님!?"
90001120-84 = "왜 그래, 선생님? 무슨 일이라도 있어?"
90001120-85 = "……괜찮으시겠습니까, 선생님? 그건 자칫하면……."
90001120-90 = "이 사태가…… 상당히, 보통 일이 아닌 것 같이 보인다고? 그건…… 그렇게 보일 수 있는 측면이, 분명히 있지만……."
90001120-91 = "그리고 아리스에게 그런 말을 누군가 해야 한다면, 그거야말로 선생님의 일인 것 같다고요……?"
90001120-92 = "[s] \"그 대신 리오에게 제안하고 싶은 것이 있어.\""
90001120-93 = "어? 나, 나에게……?"
90001120-94 = "[s] \"리오도 빙해의 베이스로 왔으면 해.\""
90001120-95 = "?!"
90001120-96 = "회장을, 직접!?"
90001120-97 = "선생님, 그것은……?"
90001120-99 = "……."
90001120-100 = "그건 이른바…… '같이 책임지는 자세'를 의미하는 거야……?"
90001120-101 = "[s] \"그 부분에 대한 판단은, 리오에게 맡길게.\""
90001120-105 = "[ns] \"리오가 방안을 제안해 줬던 것처럼.\""
90001120-109 = "[ns] \"나도, 이런 방안을 제안해 본 것뿐이니까.\""
90001120-110 = "……."
90001120-111 = "모르, 겠어. 선생. 나는……."
90001120-112 = "나에게 그럴 자격이 있는지, 내가 또 틀리지는 않은 것인지……."
90001120-116 = "하지만, 이번에 리오 님은 저희를 구해 주셨습니다."
90001120-118 = "……."
90001120-123 = "잘 모르겠습니다. 리오 님께서 말씀하시는 '옳음'이 어디에 있는 것인지, 항상 그런 선택을 내린다는 게 가능하기는 한 것인지."
90001120-124 = "그렇지만 저는……. 리오 님과 다시 한번 만나고 싶습니다."
90001120-125 = "그런 이유로는, 안 되는 것일까요?"
90001120-126 = "토키……."
90001120-132 = "리오. 당신이 선택할 문제예요."
90001120-133 = "당신의 판단 기준은 알고 있어요. 말 그대로 '합리'죠."
90001120-134 = "모든 일에 합리적으로 대처하고자 하는 당신의 이 순간 판단은, 어떤 것인가요?"
90001120-138 = "………………."
90001120-139 = "통신상…… 으로는 한계가 있는 게 분명해. 보안의 측면에서도, 안전의 측면에서도."
90001120-140 = "전파를 간섭받기라도 하면 근본적으로 모든 일이 어그러질 수도 있을 거야. 이번 일만 해도 그랬었고."
90001120-141 = "그러니까, 나는……."
90001120-142 = "좋아요. 결정됐군요."
90001120-143 = "그러면 우리들도 빙해의 베이스로 향할 테니, 거기에서 만나도록 하죠."
90001120-144 = "……알았, 어."
90001120-146 = "왜 그래, 리오 회장? 뭔가 걸리는 부분이라도 있어?"
90001120-147 = "그런 건, 아니긴 한데……."
90001120-148 = "정말, 내가 그래도 되는 걸까……?"
90001120-149 = "……."
90001120-150 = "빙해 베이스의 좌표를 전송하죠. 장거리 이동 수단 정도는, 뭐, 당신이라면 진작에 마련해 두었겠죠?"
90001120-151 = "……그래."
90001120-152 = "오랜만에 뵙겠군요. 리오 님. 기다리고 있겠습니다."
90001120-153 = "토키."
90001120-154 = "네. 무슨 일이십니까?"
90001120-160 = "그동안 수고했어. 그리고…… 고마워."
90001120-161 = "천만의 말씀입니다."
90001120-164 = "(모두가 각자의 일로 바빠진 가운데, 우연찮게 혼자만의 시간이 났다.)"
90001120-165 = "(그런 김에…….)"
90001120-171 = "어? 선생님?"
90001120-172 = "어서 오십시오. 선생님. 무슨 일이십니까?"
90001120-173 = "네? 그냥 저희들 얼굴이 보고 싶으셨다고요?"
90001120-174 = "그, 그건 감사하고, 매우 기쁜 일이지만…… 에헤헤……."
90001120-175 = "그렇지만, 선생님. 별일 아니라는 말씀은 하지 말아 주세요……."
90001120-176 = "긍정. 표정이 심상치 않으십니다. 다시 묻겠습니다. 무슨 일이십니까?"
90001120-177 = "[s] \"나는 그렇게 티가 나는 건가…… 그런 건가…….\""
90001120-178 = "무슨 말씀이세요! 티를 안 내려고 하셔도, 저희는 안다구요!"
90001120-179 = "지금까지 얼마나 같이 지내 왔다고 생각하시는데요? 그런 건 척 보면 알아요!"
90001120-180 = "긍정. 지금의 선생님은 어쩌면 모를 수도 있으시겠습니다만."
90001120-181 = "제가 알고 있는 선생님은, 그런 분이셨습니다."
90001120-182 = "뭐가 마음에 걸리세요? 아로나가 뭐든 들어 드릴게요!"
90001120-183 = "저도요."
90001120-184 = "아, 네. 프라나 쨩도요!"
90001120-188 = "[ns1] \"……학생에게 문제를 해결해 달라고 강요하게 되는 게, 좀 그래.\"\n[ns2] \"내가 학생을 위험한 곳으로 보내게 되는 게 말이지.\""
90001120-191 = "선생님……."
90001120-192 = "……."
90001120-193 = "그, 그렇지만 어떤 의미에서 말이죠, 선생님!"
90001120-194 = "선생님께서는 지금까지도…… 이 비슷한 일을 몇 번이나, 멋지게 해결해 오셨잖아요? 막 이래 보고요…… 에헤헤."
90001120-209 = "[ns] \"그때와는 조금 다른 것 같아.\""
90001120-211 = "네? 그때는 이미 일어난 일을, 어떻게든 하기 위해 도와준 것이었고……."
90001120-212 = "이번은 그런 것이 아니라, 선생님께서 먼저 학생을 위험에 처하게 할지도 모르는 일이라는 것이군요."
90001120-213 = "납득. 그렇지만, 대처하지 않으면 더 큰 일이 일어날 가능성이 있는 것 아닌가요?"
90001120-216 = "[ns3] \"그것도 맞긴 해.\"\n[ns4] \"하지만 가능성 때문에 학생을 위험에 처하게 한다면.\""
90001120-221 = "[ns] \"내가, 그들과 다른 게 뭘까.\""
90001120-224 = "……."
90001120-225 = "……."
90001120-227 = "[ns] \"아! 막 내가 엄청 세졌으면 좋겠다!\""
90001120-228 = "서, 선생님?!"
90001120-229 = "이해 불가. 갑자기 무슨 일이십니까, 선생님?"
90001120-230 = "[s5] \"아니, 그게 말이야! 막! 어?\"\n[s6] \"하늘도 막 날고, 어? 막 배리어고 뭐고 다 뚫어버리고!\""
90001120-234 = "[ns7] \"이름 없는 신이고 데카그라마톤이고 뭐고!\"\n[ns8] \"한 번에 다 해결해 버릴 수 있었으면 좋겠어서!\""
90001120-238 = "왜, 왜 그러시는 건가요……?"
90001120-239 = "혼란. 이해할 수 없습니다. 선생님께 보다 자세한 설명을 요구하고자 합니다."
90001120-243 = "[ns] \"아니야. 괜찮아. 헛소리해 봤어.\""
90001120-253 = "[log]제 학생들을…… 부탁합니다.[/log]"
90001120-259 = "[ns] \"역시 내가 할 수밖에 없겠네! 응!\""
90001120-261 = "[ns9] \"할 수 있는 건 다 해 보고! 마지막까지 추하게 발버둥 치고!\"\n[ns10] \"그러고도 안 되면!\""
90001120-264 = "아, 안 되면요?"
90001120-268 = "[ns11] \"응! 이 이야기는 나중에!\"\n[ns12] \"나도 뭐가 어떻게 될지 모르니까 말이야! 와하하하!\""
90001120-271 = "서, 선생님? 정말 괜찮으신 거…… 맞으시죠?"
90001120-272 = "의문. 그리고 당혹. 진지하게 선생님의 멘탈 체크를 요청드립니다."
90001120-273 = "[s] \"괜찮아! 괜찮아!\""
90001120-278 = "서, 선생님?! 쓰다듬어 주시는 것은 감사하지만…… 아우우……."
90001120-279 = "혼란 가중. 더더욱 선생님의 의도를 알 수 없습니다."
90001120-281 = "(그렇게 한참이나 둘을 쓰다듬고.)"
90001120-282 = "(확실하게 잠든 것을 확인한 다음, 있어야 할 곳으로 돌아왔다.)"
90001120-284 = "다음화;출발"
