[translation]
31100-1 = "제10화;합숙, 시작합니다!"
31100-5 = "트리니티 외곽의 어느 별관"
31100-7 = "도착했어요! 여기가 바로 저희들의 합숙 장소네요?"
31100-8 = "아, 아하하……."
31100-9 = "어머나, 사용하지 않는 별관이라고 해서 차가운 바닥에서 헐벗고 자야 하나 싶었는데……."
31100-10 = "숙소는 꽤 넓고 게다가 귀여운 침대까지 있네요!"
31100-12 = "잘됐네요, 이걸로 침대 위에서 다 함께 헐벗은 채로 뒤엉켜 잘 수 있겠어요♡"
31100-13 = "헐벗고 자는 게 전제인 거야?! 침대는 넉넉하니까 각자 하나씩 써!!"
31100-14 = "흐음……? 그런가요? 모처럼의 합숙이니까 좀 더 다양한 공부를 해보는 것도 좋을 것 같은데……."
31100-15 = "몰라, 그런 공부! 야한 건 금지! 사형!!"
31100-16 = "으음. 뭐. 밤은 기니까요♡"
31100-17 = "……?!"
31100-22 = "아우……. 앞으로 일주일간 여기서 숙식과 공부를 해야 하니까……. 다들……."
31100-26 = "어라? 아즈사 쨩은 어디 갔죠……?"
31100-27 = "응? 방금 전까지 같이 있었는데……."
31100-34 = "진지를 정찰하고 왔다."
31100-35 = "네? 지, 진지요?"
31100-36 = "트리니티 본관에서도 꽤 떨어져 있어서 어느 쪽이든 저격의 위험이 없는 건 합격."
31100-37 = "외부로 연결된 입구도 두 개밖에 없는 것도 마음에 들어."
31100-38 = "여차할 땐 한쪽 입구를 틀어막고 습격해온 적들을 1층의 체육관으로 유도한 뒤 섬멸전을 시도할 수 있겠어."
31100-39 = "그 외에 보안이 취약한 곳이 다수 확인됐지만 개보수를 진행하면 문제 없을 거고."
31100-41 = "아우우……."
31100-42 = "그리고 여기가 막사……아니, 생활관인가. ……꽤 호화롭네."
31100-43 = "이 정도의 시설을 버려두고 방치하고 있었다니, 역시 낭비가 많아. 이곳은."
31100-44 = "아우…… 싸우러 온 건 아니니까…… 아즈사 쨩, 우리는 공부하러 왔다구요?"
31100-45 = "알고 있어. 일주일간 여기서 훈련하는 거잖아? 외출 금지, 자유 시간 금지, 24시간 일거수 일투족을 통제받는 고강도의 집중 훈련이지."
31100-46 = "그정도는 아니지만……."
31100-47 = "훈련에 불편함이 없도록 개인 소지품도 모두 챙겨왔어. 체육복과 갈아입을 옷, 개인 위생에 필요한 칫솔, 치약, 비누, 건조 식량. 모포, 수통……."
31100-48 = "어머나, 아즈사 쨩 준비를 확실히 해오셨네요?"
31100-49 = "당연하지. 철저한 준비야말로 성공의 어머니니까."
31100-51 = "……우후후. 모두와 같이 먹고 자면서 같은 목표를 위해 노력한다…… 합숙은 즐거울 것 같죠?"
31100-52 = "……음."
31100-53 = "……그러네. 기대하고 있어."
31100-57 = "물론 임무도 확실하게 완수할 거야. 성실히 공부해서 2차 평가 시험에 합격한다, 그 목표를 위해서 여기 있는 거고."
31100-58 = "모두에게 폐가 되는 것은 싫으니까……."
31100-59 = "아즈사 쨩……"
31100-60 = "게다가 혹시 모를 적습에 대비하기 위해 대인지뢰와 크레이모어도 준비해 왔어. IED 제조에 사용할 부품과 대전차지뢰와……"
31100-61 = "아, 아우…… 아즈사 쨩, 그, 그런 건 됐고!"
31100-63 = "음……."
31100-64 = "나기사 님이 1차 평가 시험에 낙제할 경우, 이 별관에서 합숙을 하라고 했기 때문에……"
31100-65 = "저희는 2차 시험까지라면 일주일 동안 여기서 머물게 돼요."
31100-66 = "오랫동안 방치된 낡은 건물이지만, 그래도 정리만 조금 하면 괜찮을 것 같고, 체육관이나 샤워실 같은 부대 시설도 잘 갖추어져 있으니……."
31100-67 = "밖에 수영장도 있었어. 안 쓴 지 오래되어 보였지만."
31100-68 = "본관까진 걸어서 갈 수 있는 거리이고, 또 지하에 간단한 조리도 가능한 식당이 있으니, 굶주릴 일은 없을 거예요……."
31100-69 = "게다가 저희가 여기 있는 동안 [USERNAME] 선생님도 계속 함께 계실 거라, 여차하면 도움을 부탁드릴 수도 있을 거고……."
31100-70 = "[s] \"응. 맡겨줘.\""
31100-71 = "아하하…… 감사합니다. 선생님. 선생님의 숙소는 통로 반대편의 방을 준비해 두었으니 거기를 사용해 주시면……."
31100-77 = "안 돼!! 금지!! 사형!!"
31100-78 = "으응……? 코하루 쨩? 저는 아직 아무 말도 안했는데……."
31100-79 = "무슨 말 할지 뻔하잖아! 안 돼! 금지야! 사형이야!"
31100-80 = "으응…… 코하루 쨩은 엄격하네요."
31100-81 = "딱히 상관없는데? 여기 침대도 남아돌기도 하고……. 방을 여러 개 쓰는 건 낭비잖아."
31100-82 = "[s] \"아냐. 바로 근처니까, 무슨 일이 있으면 불러줘.\""
31100-83 = "아하하…… 그럼 슬슬 짐을 풀고 오늘의 공부를 시작하는 걸로……."
31100-84 = "어머? 그치만 히후미 쨩? 그 전에 해야 할 일이 있을 것 같은데요?"
31100-85 = "아우……?"
31100-90 = "적습을 상정한 트랩 설치……?"
31100-94 = "바로……"
31100-95 = "청소예요♡"
31100-96 = "처, 청소요……?"
31100-97 = "네! 관리가 잘되었다고는 하지만 오랫동안 비워져 있던 건물이니까, 먼지도 많고 지저분한 것도 많잖아요?"
31100-98 = "이대로라면 건강에도 좋지 않으니까, 오늘은 깨끗하게 청소부터하고 주변을 깨끗하게 정돈한 다음 공부를 시작하는 거예요!"
31100-99 = "……그, 그러네요. 확실히. 공부 시작하기 전에 책상부터 청소하는 게 순서인 것 같고……."
31100-100 = "음. 위생이 가장 중요하지. 먼지도 털어내고 방치된 쓰레기들도 정리하면 우리들의 사기에도 도움이 될 거고."
31100-101 = "처, 청소……? 그, 그런 거라면……. 뭐……."
31100-102 = "……네. 그러네요. 하나코 쨩의 말대로예요. 너무 처음부터 의욕만 앞세우면 안 되겠죠."
31100-103 = "지금부터 저희가 해야 하는 것은 페이스를 조절해가며 달려야 하는 장거리 레이스…… 그것을 잊으면 안 되니까……."
31100-108 = "네! 그럼 제대로 각오를 다지기 위해 대청소를 하는 거예요!"
31100-109 = "[s] \"오오-!\""
31100-110 = "그럼 각자 탈의실에서 청소 복장으로 갈아입고 10분 뒤 건물 앞에서 모이는 걸로 해요!"
31100-111 = "알았어."
31100-112 = "네~!"
31100-118 = "청소 복장……? 체육복이면 되, 되겠지?"
31100-120 = "10분 뒤."
31100-122 = "별관 정문"
31100-123 = "어서오세요, 선생님!"
31100-124 = "[s1] \"체육복이구나.\"\n[s2] \"본격적이네.\""
31100-125 = "네. 제대로 하려면 복장이 중요하니까요. 체육복이 움직이기도 편하고, 지저분해졌을 때 세탁도 용이하고……."
31100-126 = "네. 제대로 하려면 복장이 중요하니까요. 체육복이 움직이기도 편하고, 지저분해졌을 때 세탁도 용이하고……."
31100-127 = "나, 난 뭘 하면 돼……?"
31100-128 = "코하루 쨩. 빨리 왔네요."
31100-129 = "음. 나도 도착했다."
31100-130 = "아즈사 쨩……? 총은 가져올 필요가 없을 것 같지만……."
31100-131 = "개인화기는 한시라도 몸에서 떨어트리면 안 되잖아? 언제 습격이 올지 모르니까."
31100-132 = "아, 아우……."
31100-137 = "어머나, 모두들 벌써 와계셨군요?"
31100-138 = "아웃!! 아웃이야!! 아웃!!"
31100-139 = "어머?"
31100-140 = "청소 복장이 어째서 수영복인데! 전혀 관계없잖아!"
31100-141 = "그치만 이게 움직이기도 편하고, 지저분해졌을 때 세탁도 쉽고……."
31100-142 = "무슨 이상한 소릴 하는 거야! 수영복은 수영장에서 입으라고! 누, 누가 보면 어쩌려고……!"
31100-143 = "응…… 그치만 별관엔 우리들말곤 아무도 없는걸요?"
31100-144 = "아무튼 금지야! 아웃이야! 하나코는 이제부터 수영복 착용 금지!!"
31100-146 = "으응……."
31100-147 = "아, 아우……."
31100-149 = "하나코는 체육복으로 다시 갈아입고 왔다."
31100-151 = "다음화;대청소!"
