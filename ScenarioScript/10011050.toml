[translation]
10011050-1 = "제5화;두 번째 관문: 잠자는 공주"
10011050-7 = "하아하아…… 여기까지 도망쳐오긴 했지만……."
10011050-8 = "네에! 여전히 공주님을 납치한 도당들은 전력으로 도주 중! 누가 과연 첫 번째로 그들을 잡을 수 있을 것인가~!"
10011050-9 = "으으……! 저, 전부 방송으로 나가고 있슴다!"
10011050-10 = "이게 대체……."
10011050-11 = "우웅~ 이부키는 아무것도 안 해도 되는 거야~?"
10011050-12 = "쉬잇! 조용히! 지금은 달리는 것만으로도 벅차니까!"
10011050-13 = "에잇! 다음은……!"
10011050-14 = "응~ 다음은 여기야~ 여기."
10011050-15 = "……?!"
10011050-21 = "분명 마츠리부의 부장이 말한 대로라면, 이곳으로 도망쳤을 텐데……!"
10011050-27 = "지금, 이 순간에도 납치된 공주님을 찾기 위해 달리는 게헨나와 백귀야행의 학생분들이 여럿 있지만!"
10011050-28 = "냐하핫~ 벌써부터 특색 있는 분들이 여럿 눈에 띄는군요!"
10011050-29 = "그중에서도 특히나 눈에 띄는 건 바로 이분들!"
10011050-38 = "자신들을 인법연구부-라고 소개한, 백귀야행의 학생분들이랍니다!"
10011050-39 = "비록 아직은 정식 동아리가 아닌, 동호회에 지나지 않지만~ 후후훗~"
10011050-40 = "오늘 <와라쿠 공주님> 이벤트에서 활약하기에 따라서는 어떻게 될지 모를 일이겠지요~?"
10011050-41 = "냐하핫~♪ 그럼 멋진 활약! 기대할게요~!"
10011050-43 = "연막 정도가 아니라. 아예 현장 중계를 때려버리는 거냐고! 그래도 되는 거야?! 진짜루?!"
10011050-44 = "[s] \"그래도 아직 상황이 알려진 건 아니니까. 괜찮지 않을까?\""
10011050-45 = "그, 그게…… 워, 원래, 그런 이벤트이긴 했으니까. 주, 중계를 안 하면 더, 수, 수상하게 보이는 게 아닐까요……?"
10011050-46 = "아니, 내 말은 그런 게 아니라……!"
10011050-47 = "[s] (물론…… 뭔가 석연치 않은 부분이 있긴 하지만……)"
10011050-49 = "부장! 바로 저기예요!"
10011050-50 = "아, 으, 응!"
10011050-51 = "(망설일 때가 아니야…… 응! 여기서 멈출까 보냐앗!)"
10011050-60 = "가, 강하다……!"
10011050-61 = "저, 전혀 빈틈이 보이지를 않아……!"
10011050-62 = "……?!"
10011050-68 = "응~ 이곳은 쉽게 통과할 수 없어~"
10011050-69 = "[s] \"……혹시 츠바키가 다음 수문장?\""
10011050-70 = "아, 선생님~ 응~ 맞아~"
10011050-71 = "이곳은…… 으음…… <두 번째 관문 어트랙션 : 잠자는 공주>……야. 후아암."
10011050-72 = "자칫 방심하면…… 바로………"
10011050-73 = "당하는, 위험한……."
10011050-74 = "위험……"
10011050-75 = "쿠우울……."
10011050-76 = "바로 자버리는 거냐구?!"
10011050-77 = "후암. 응~ 공주님을 납치한 도당들은 이다음으로 도망쳤어……."
10011050-78 = "이곳을 통과하기 위한 방법. 룰은 간단-해."
10011050-79 = "앗, 어, 어트랙션의 고, 공략 방법이란 거군요……!"
10011050-80 = "응~ 내가 자고 있을 때 이 라인을 지나갈 수 있으면 OK……."
10011050-81 = "카에데가 이름 붙여주길…… 이름하여…… <쿠우울……>이야."
10011050-82 = "이즈나! 잘 모르겠어요!"
10011050-83 = "저기…… 방금 말하다가 잠들지 않았나요……? 혹시 백귀야행은 대부분 이런 느낌인가요?"
10011050-84 = "[s] \"어째 부정할 수 없다는 게 마음 아파!\""
10011050-86 = "크읏! 자, 잠자는 공주의 어트랙션이라니! 예상 못 했어!"
10011050-87 = "도저히, 빈틈이 보이질 않아! 지금은! 자는 건가?! 깨어 있는 건가?!"
10011050-88 = "쿠우울……."
10011050-89 = "지금! 지금이 빈틈이다!"
10011050-90 = "후아암?"
10011050-95 = "\"\"저, 전혀 빈틈이 없잖아!!\"\""
10011050-96 = "우음- 이번 어트랙션의 규칙은-"
10011050-97 = "<내가 자고 있는 사이에 라인을 통과하면 합격, 라인을 넘기 전에 들키면 실격>이니까."
10011050-98 = "이대로는 전부 실패네~ 그리고 실패한 사람들은 이렇게 되는 거야~"
10011050-120 = "\"\"\"우, 우와아앗! 용역부원들의 파도가아아……!!\"\"\""
10011050-122 = "하, 학생 여러분들이 전부 쓸려가듯이, 사, 사라져버렸어요오오……."
10011050-123 = "[s] \"자, 장난 아니네.\""
10011050-124 = "후아암. 그럼 다음 차례는…… 누구?"
10011050-125 = "자, 잠자는 공주가 상대라니. 이건 마츠리부 부장과는 레벨 자체가 다르잖아……!"
10011050-126 = "이, 이걸 뚫을 수 있을 리가……! 하필이면 지금처럼 한시가 급할 때……!"
10011050-127 = "부장! 그리고 주군! 여기선 이즈나가 활약할 때예요!"
10011050-128 = "이, 이즈나 쨩?"
10011050-129 = "……이즈나? 뭔가, 방법이라도 있어?"
10011050-130 = "네! 에헤헷! 저 이즈나! 평소에도 이런 일이 있을까 봐. 혹시나 해서 대비를 하고 있었으니까요……!"
10011050-131 = "[s] \"이런 일이 평소에 있을 걸 대비하는구나…….\""
10011050-132 = "바로 이것! 닌자라면 필수로 가지고 다니는 도구! <대나무 통>을 이용해서……!"
10011050-133 = "츠바키 공이 자고 있는지! 아닌지! 헷갈리는 저 <너구리 잠의 인법>을 이즈나의 인법으로! 파훼하겠어요!"
10011050-136 = "히, 힘내요! 이즈나 쨩!"
10011050-137 = "조, 좋았어! 쓰러트리는 거야! 이즈나!"
10011050-138 = "그럼…… 얍!"
10011050-141 = "흠흠, 흠흠…… 흐음흐음."
10011050-142 = "쿠울……"
10011050-143 = "호오호오……."
10011050-144 = "쿠우울……."
10011050-145 = "……."
10011050-146 = "…………."
10011050-152 = "핫!! 이즈나! 간파했습니다! 바로 지금!"
10011050-157 = "샤샤샥!!!"
10011050-159 = "이즈나! 통과했습니다!"
10011050-160 = "……후암? 통과했어……?"
10011050-164 = "응~ 축하해~"
10011050-166 = "괴, 굉장해! 방금 그 기술은……!"
10011050-167 = "정말 저 잠자는 공주의 시련을, 직접 실력으로 통과했다고?!"
10011050-168 = "대, 대체, 누구지?!"
10011050-169 = "이즈나! 잘했어!"
10011050-170 = "괴, 굉장해요오. 이, 이즈나 쨩……!"
10011050-175 = "[ns1] \"이즈나의 실력이 어느덧 여기까지 성장했구나……!\"\n[ns2] \"이 선생님은 막 가슴이 벅차네…….\""
10011050-178 = "……저기, 감탄해야 하는 타이밍이죠. 이거?"
10011050-179 = "좋았어! 이즈나가 성공했으니 바로 우리도……"
10011050-186 = "우냐아악?! 까, 깜짝이야! 뭐, 뭐야! 가, 갑자기 쏘다니!"
10011050-187 = "방금 분명히 통과했잖아!"
10011050-189 = "후아암~ 응~ 한 명은 통과~ 했지만 말이야~"
10011050-190 = "다른 사람들은 아니니까……."
10011050-191 = "……응?"
10011050-193 = "[ns] \"츠바키, 그 말은…….\""
10011050-194 = "그래도 한 사람은 돌파하는 데 성공했으니까."
10011050-195 = "여기서부턴 어트랙션의 특별 규칙을 적용할게~"
10011050-196 = "남은 사람들은, 나를 이기면 통과할 수 있다는 규칙이니까~"
10011050-197 = "자, 제2수문장 <츠바키> 갑니다~"
