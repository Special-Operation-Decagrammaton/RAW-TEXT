[translation]
10001070-1 = "제7화;노동자에게 푸딩을!"
10001070-2 = "붉은겨울 학원 중앙 거리"
10001070-3 = "저기, 이번 연휴에 무슨 특별한 계획이라도 있어?"
10001070-4 = "아니. 이번 축제는 집에서 가족들과 함께 조용히 보내려고."
10001070-5 = "에이, 모처럼의 연휴인데. 그러지 말고 시내에 나가서 같이 놀자!"
10001070-6 = "듣자 하니 학생회에서 3거리의 교차로에 멋진 모닥불을 피워놨대!"
10001070-7 = "어쩌면 그곳에서 멋진 만남과 마주하게 될지도 모르잖아? 후훗……."
10001070-8 = "으음, 그럼 하루 정도는 일정을 비워둘까나……."
10001070-9 = "…………."
10001070-10 = "으읏…… 모두 마음에 들지 않느니라! #n전부 마음에 안 들어!"
10001070-11 = "또 무슨 일이신가요, 체리노 회장님?"
10001070-12 = "보거라! 축제의 분위기에 한껏 취해 즐거이 거리를 오고 가는 붉은겨울의 학생들을!"
10001070-13 = "정작 붉은겨울 학원의 최고 존엄인 이 몸은 간식도 못 먹고, 낮잠도 못 자고, 고생이나 하고 있는데 학생들은 축제 분위기를 즐기고 있다니……."
10001070-14 = "이건 불공평해!"
10001070-15 = "모두 숙청이야, 숙청! #n지금 축제를 즐기는 학생들은 모두 앞으로 한 달 동안 운동장 잡초 뽑기형에 처할 거야!"
10001070-16 = "[s] \"하지만 체리노는 지금 회장이 아니니 벌을 내릴 수 없잖아?\""
10001070-17 = "그, 그런가?"
10001070-18 = "그렇다면 지금 이름을 기록해 두었다가 나중에 복권하면 그 때 벌을 내리는 것으로……."
10001070-19 = "토모에 총비서실장. 방금 지나간 학생들의 이름을 빠짐없이 기록해 두도록!"
10001070-20 = "안 돼요, 체리노 쨩. #n애초에 한 사람의 학생도 빠짐없이 다 함께 축제를 즐기자— 라고 말한 건 체리노 쨩이잖아요?"
10001070-21 = "잠깐의 변덕 때문에 명령을 번복하면 학생들이 싫어할 거라고요."
10001070-22 = "하지만~! 나만 이렇게 놀지도 못하고 쫓겨 다니는 신세라니. 이건 불공평하다고!"
10001070-23 = "자유와 평등을 모토로 하는 우리 붉은겨울 학원에 불공평이란 있을 수 없어!"
10001070-24 = "그럼 이왕 이렇게 된 김에 저희도 학생들과 함께 축제를 즐겨볼까요?"
10001070-25 = "학생들과 함께 즐기는 축제?"
10001070-26 = "네. 체리노 회장님께서는 언제나 높은 자리에서 행사를 지휘하시느라, 정작 학생들과 어울려 축제를 즐기실 기회는 없으셨으니까요."
10001070-27 = "이 기회에 평범한 학생의 입장에서 축제를 즐겨 보신다면 다음 축제를 준비하는 데 도움이 될지도 몰라요."
10001070-28 = "호오……"
10001070-29 = "그것참 좋은 생각이구나!"
10001070-30 = "학생들이 어떻게 생활하는지 파악하는 것 또한 지도자의 책무! #n가끔은 직무를 내려놓고 학생의 입장에서 거리를 시찰하는 것도 중요하겠지."
10001070-31 = "……절대로 놀고 싶어서 이러는 게 아니니까!"
10001070-32 = "어흠."
10001070-33 = "우선은 저기에 있는 케이크 가게를 시찰하도록 하지. #n서두르게, 콤라드!"
10001070-37 = "우물우물…… #n하아~ 맛있어~"
10001070-38 = "이 가게의 미다비크는 정말 달콤하구나! 이거라면 얼마든지 먹을 수 있겠어!"
10001070-39 = "체리노 쨩, 수염에 크림이 묻었어요."
10001070-41 = "우웃, 이 몸은 어린아이가 아니니라! 멋대로 이 몸의 수염에 손을 대지 말거라!"
10001070-42 = "그나저나 정신을 차리고 보니 벌써 한 달 치 용돈을 모두 써버리고 말았군. #n이반 쿠팔라…… 이 얼마나 무서운 축제란 말인가."
10001070-43 = "키보토스의 상인들이 축제 기간을 노려 온갖 달콤한 과자들을 마구 내놓는 이유를 알 것 같기도……."
10001070-44 = "자, 그럼 콤라드. 다음에는 어디로 놀러…… 아니 시찰을 갈까?"
10001070-45 = "[s] \"저기에 거대한 장작더미가 있어.\""
10001070-46 = "……장작더미?"
10001070-47 = "아아, 저건 장작더미가 아니라 <용역부>에서 설치 중인 이반 쿠팔라 제단일 것이다!"
10001070-48 = "이번 축제를 기념하여 거대한 봄맞이 인형을 태울 수 있는 제단을 설치하도록 내가 친히 지시했었지!"
10001070-49 = "[s] \"하지만 여전히 장작더미처럼 보이는걸.\""
10001070-51 = "그건…… 그렇군. 제단이라고 하기에는 장식물이 하나도 달려있지 않으니……."
10001070-52 = "축제까지는 얼마 남지도 않았는데 어째서 아직도 제단이 저 모양인 거지?"
10001070-53 = "게으름 피우는 거냐? 사보타주인 거냐고!"
10001070-54 = "진정하세요, 회장님. 무언가 오해가 있었을지도 모릅니다."
10001070-55 = "오해는 무슨! 기한 내에 일을 마치지 못하는 무능한 학생은 우리 붉은겨울 학원에는 필요없느니라! 모두 숙청이야, 숙청!"
10001070-56 = "회장님께서 제단을 설치하라고 지시하신 곳은 이곳이 아니라 사무국 건물 앞의 광장입니다. 이곳에 있는 구조물은 이반 쿠팔라와는 관계가 없습니다."
10001070-57 = "그, 그런가? 그럼 저 장작더미는 도대체 뭐지?"
10001070-58 = "마침 그 앞에 용역부 학생들이 모여 있으니 물어봐야겠군."
10001070-61 = "어이, 동지들. 작업은 잘 되어가고 있는가—"
10001070-67 = "우리는 노예가 되지 않는다! 세상의 주인이 될 것이다!"
10001070-70 = "와아아아!"
10001070-72 = "어, 어라? 뭔가 분위기가 이상한데……?"
10001070-73 = "동지들, 앞으로 며칠후면 이반 쿠팔라가 시작된다."
10001070-74 = "이반 쿠팔라가 어떤 날인가? 겨우내 먹었던 마른 빵과 염장 고기를 버리고, 태양이 선사하는 신선하고 풍요로운 과실을 즐기는 신록의 축제가 아니었던가!"
10001070-75 = "이는 붉은겨울의 학생들에게도 예외가 아니다. 우리들에게도 축제를 즐길 권리가 있다!"
10001070-76 = "맞아, 맞아!"
10001070-77 = "우리에게도 축제 휴가를!"
10001070-78 = "하지만 우리는 연휴를 즐기기는커녕, 1일 2교대의 가혹한 환경 속에서 밤낮없이 작업에 동원되며 노동력을 착취당하고 있다!"
10001070-79 = "이는 우리 붉은겨울 학원의 이념인 자유와 평등 정신에 부합하지 않는바! 나는 이를 강력히 규탄하고자 한다!"
10001070-80 = "우우우—!"
10001070-81 = "규탄한다! 규탄한다!"
10001070-82 = "체리노 회장을 비롯한 붉은겨울 학원 사무국의 임원들은 우리 용역부 노동자들의 권리를 보장하라!"
10001070-83 = "우리에게 충분한 휴식 시간과, 추가 수당과, 그리고 어…… 두 개의 푸딩을 보장하지 않으면 우리는 계속 파업과 시위를 이어갈 것이다!"
10001070-84 = "와아아아아!"
10001070-86 = "파업이다, 파업!"
10001070-88 = "잠깐, 잠깐, 잠깐! 너희들, 누구의 허락을 받고 이런 짓을 벌이고 있는 거야?"
10001070-89 = "사무국의 허락 없이 멋대로 집단 활동을 하는 건 용납할 수 없어! 모두 숙청이야, 숙청!"
10001070-90 = "……체리노 회장?"
10001070-91 = "어째서 이런 곳에 있는지는 모르겠지만, 마침 잘 만났다!"
10001070-92 = "동지들! 체리노 회장을 붙잡아 이 장작더미에 묶도록!"
10001070-101 = "자, 잠깐! 이거 놓거라! 이 몸이 누구인줄 알고!"
10001070-103 = "그, 그보다 장작더미라니? #n정말로 이 나뭇더미들이 제단 장식이 아니라 장작이었단 말이야?"
10001070-105 = "……설마 이 몸을 장작 째로 함께 불태워버리려는 건가!"
10001070-107 = "뭐……? 아무리 혁명이라지만 우리가 그런 끔찍한 짓을 저지를 리가 없잖아."
10001070-109 = "하지만 체리노 회장은 일하지 않고 놀기만 하는 글러 먹은 지도자 그 자체! 우리가 타도해야 할 사악한 압제자다!"
10001070-111 = "동지들! 오늘 우리는 이 사악한 압제자를 학원 중앙 거리에 매달아 우리 노동자들이 나아갈 새로운 미래의 지표로 삼을 것이다!"
10001070-113 = "와아아아아!"
10001070-115 = "매달아라, 매달아라!"
10001070-117 = "자, 잠깐! 그렇게 억지로 묶으면 팔이 부러진다고!"
10001070-119 = "아야야야! 코, 콤라드! 토모에! 살려줘!"
