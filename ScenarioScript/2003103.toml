[translation]
2003103-1 = "진지하게"
2003103-2 = "(시구레와 함께 구교사에서 다소 떨어진 마을에 위치한 대중목욕탕을 방문했다.)"
2003103-6 = "하아~ 좋은 탕이었다~"
2003103-7 = "이 근처에는 잡은 야생동물을 생필품과 교환하러 몇 번 들른 적이 있었지만, 설마 이 마을에도 목욕 시설이 있는 줄은 몰랐어."
2003103-8 = "고마워, 선생님. 일부러 목욕비까지 챙겨주면서 같이 목욕하러 가자고 권해줘서."
2003103-9 = "하지만 나는 정말로 강에서 목욕을 해도 괜찮았는데……"
2003103-10 = "지난번의 일을 너무 신경 쓰고 있는 거 아니야?"
2003103-11 = "[s1] \"사정은 어찌 되었든 탕을 치운 건 내 부탁이었으니까.\"\n[s2] \"학생이 추위에 떨면서 목욕하도록 내버려 둘 수는 없지.\""
2003103-14 = "……정말 상냥한 어른이라니까, 선생님은."
2003103-15 = "여하튼 고마워. 덕분에 오랜만에 제대로 된 목욕탕에서 따듯하게 목욕을 했네."
2003103-16 = "그럼 몸도 다 씻었으니 슬슬 다시 구교사로 돌아갈까?"
2003103-17 = "[s] \"모처럼 나왔으니 조금만 더 둘러보고 가는 건 어때?\""
2003103-18 = "단순한 목욕탕을? 뭐, 나야 상관없지만……"
2003103-23 = "어라? 후르츠 밀크잖아? 이런 곳에서 보니 어쩐지 반갑네."
2003103-24 = "선생님도 전에 <227호 온천장>에서 본 적 있지? 온천장의 기념품으로 내가 만든 온천 만쥬와 함께 후르츠 밀크를 팔았었거든."
2003103-25 = "내 입으로 말하기는 좀 그렇지만, 제법 인기가 많았어서…… 지금도 가끔씩 구교사에 남은 후르츠 밀크가 없냐는 문의가 종종 들어오곤 해."
2003103-26 = "다만 이곳에서 파는 후르츠 밀크는 평범한 공산품 같은데—"
2003103-31 = "저, 저기…… 혹시 전에 <227호 온천장>에서 일하셨던 분 맞으시죠?"
2003103-32 = "……어라? 나를 알고 있는 거야?"
2003103-33 = "물론이지요. 그때 구교사 부지에 큰 온천장이 생겼다고 해서 한 번 가봤었거든요."
2003103-34 = "<227호 온천장>의 인기가 어찌나 많았던지, 당시에는 이 목욕탕을 찾는 손님이 절반으로 줄었을 정도니……"
2003103-35 = "아하하…… 그렇게 들으니 어쩐지 조금 미안해지네."
2003103-36 = "아뇨, 신경 쓰실 필요는 없습니다. 어차피 원래부터 크게 장사가 잘되는 목욕탕도 아니었는걸요."
2003103-37 = "다만 그 때 227호 온천장에서 마셨던 후르츠 밀크가 너무 맛이 좋아서, 어디서 파는 제품인지 여기저기 찾아보았는데……"
2003103-38 = "어느 가게에서도 그때 목욕을 마치고 마셨던 후르츠 밀크와 같은 맛을 내는 제품을 팔지는 않더라고요."
2003103-39 = "아, 그 후르츠 밀크는 다른 곳에서 구할 수 없을 거야. 내가 직접 만든 수제품이거든."
2003103-40 = "재료만 있다면 지금이라도 만들어 줄 수 있는데……"
2003103-41 = "괜찮다면 잠깐 주방을 빌려줄 수 있을까?"
2003103-42 = "물론입니다. 부디 자유롭게 사용해 주세요."
2003103-46 = "[ns3] \"시구레. 혹시나 해서 하는 이야기지만……\"\n[ns4] \"후르츠 밀크에는 알코올을 섞으면 안 된다?\""
2003103-49 = "에이, 선생님. 나를 뭐라고 생각하는 거야? 아무리 나라고 해도 아무 음료에나 알코올을 첨가하지 않는다고."
2003103-50 = "하지만 발효된 무언가는 조금 섞을지도……?"
2003103-51 = "[s] \"어쩐지 불길한 느낌이……\""
2003103-52 = "어디 보자. 우유와 설탕, 그리고 여러 가지 종류의 과일까지……"
2003103-53 = "재료는 충분한 것 같으니, 잠깐 실력 발휘 좀 해볼까?"
2003103-62 = "자, 완성. <시구레 스페셜 후르츠 밀크>야."
2003103-63 = "충분히 만들었으니 선생님도 같이 한 잔 마셔봐."
2003103-67 = "맞아요! 그때 온천장에서 먹었던 후르츠 밀크가 바로 이 맛이었어요……!"
2003103-68 = "하지만 이상하네요. 제가 직접 만들었을 때는 이런 풍부하고 고급스러운 단맛이 나지 않았었는데……"
2003103-69 = "음료를 만들 때는 재료를 아끼지 않는 것도 중요하지만, 재료를 넣는 방법이나 비율도 그 이상으로 중요하니까."
2003103-70 = "후르츠 밀크는 과일의 단맛만큼이나 우유의 고소한 맛이 중요하기 때문에, 과일을 너무 많이 넣으면 맛의 밸런스가 깨질 수 있거든."
2003103-71 = "음료를 섞을 때 과일은 전부 으깨서 블렌딩하지 말고, 일부는 생으로 잘라 넣는 게 좋아. 그편이 맛도 훨씬 안정적이고 식감도 재미있어지거든."
2003103-72 = "거기에 캄포트를 만들 때 쓰는 특제 과일청을 조금 첨가하면…… <시구레 스페셜 후르츠 밀크>, 완성이야."
2003103-73 = "[s] \"발효된 무언가가 과일청을 말하는 것이었구나.\""
2003103-74 = "응. 설탕을 바로 넣는 것보다 과일에 절인 뒤에 첨가하면 단맛이 부드러워지고, 음료에도 자연스럽게 배어들거든."
2003103-75 = "모든 음식이 그렇지만 음료도 시간과 노력을 들인 만큼 맛있어지는 법이야."
2003103-79 = "저, 염치없는 부탁인 줄 알고 있습니다만……"
2003103-80 = "혹시 이 후르츠 밀크에 사용한 특제 과일청의 레시피를 알려주실 수는 없을까요?"
2003103-81 = "……특제 과일청의 레시피를?"
2003103-82 = "네. 보시다시피 이 목욕탕은 외진 곳에 위치한 데다가, 시설도 화려하지 않아서 일부러 찾아오시는 손님은 거의 없거든요."
2003103-83 = "그런데 이렇게 맛있는 후르츠 밀크를 판매할 수 있다면…… 운영에 큰 도움이 될 겁니다!"
2003103-84 = "음, 레시피를 알려주는 건 어렵지 않지만……"
2003103-85 = "대신, 한 가지 조건이 있어."
2003103-86 = "호, 혹시 비용이라면 저희 사정이 어려워서 많이는 내기 어렵습니다만……"
2003103-87 = "아니. 돈이 필요한 건 아니야."
2003103-88 = "다만 이 목욕탕은 우리 구교사에서도 그리 멀지 않은 곳에 위치하고 있으니까……"
2003103-89 = "겨울철에 가끔씩 구교사 학생들이 이곳의 목욕 시설을 사용할 수 있도록 허가해 줄 수는 없을까?"
2003103-90 = "여름이라면 몰라도 겨울에는 야외에서 하는 목욕을 견디기 어려워하는 학생들이 제법 있거든."
2003103-91 = "그런 거라면 조금도 문제없습니다! 레시피만 제공해 주신다면야, 저희 목욕탕의 시설은 얼마든지 사용하셔도 좋으니까요!"
2003103-92 = "후후, 계약 성립이네."
2003103-93 = "그럼 서둘러 과일청부터 준비해 볼까?"
2003103-94 = "발효는 일분일초라도 더할수록 맛이 깊어지는 법이니까."
2003103-96 = "(이후, 시구레와 함께 후르츠 밀크에 쓸 과일청을 담그는 것을 도왔다.)"
