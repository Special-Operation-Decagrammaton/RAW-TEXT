[translation]
10041030-1 = "제3화;사람을 화나게 하는 법"
10041030-6 = "……1시간 전."
10041030-9 = "세이아가 먼저 출발한 직후, 리오의 은신처."
10041030-12 = "…………."
10041030-17 = "……??"
10041030-21 = "뭐야, 뭐가 그리 불안한데?"
10041030-26 = "갑자기 알 수 없는 이야기를 하네. 불안하다는 언급을 한 적은 없어."
10041030-27 = "뭐 꼭 말로 해야 알아듣냐? 얼굴 표정에 다 나와 있으니까 물어보는 거지."
10041030-28 = "아니. 그렇지 않아."
10041030-29 = "……그렇지 않아."
10041030-34 = "표가 많이 나?"
10041030-35 = "사람을 화나게 하는 법은 두 가지가 있는데, 하나는 말을 하려다 마는 것이고……."
10041030-36 = "아니. 화나게 하려는 의도는 없어."
10041030-37 = "없어서 더 화나네. 그런 얼굴로 그렇게 말하니 두 배로 더 화나네."
10041030-38 = "하아……."
10041030-39 = "언급 안 해주면 삐쳐도 합법일 정도로 티 난다고. 말 안 걸어준 쪽이 나쁜 수준이라고."
10041030-40 = "할 말 있으면 그냥 빨리해. 왜 자꾸 이런 불필요한 대화를 늘리는 거야?"
10041030-42 = "그, 그건……. 확실히 그렇게 논리를 따지면 할 말은 없지만……."
10041030-43 = "하지만 나로서는 내가 이 주제에 대해 언급했을 때의 네 반응을 확신할 수 없어. 그렇기 때문에 보다 많은 정보가 쌓일 때를 기다려서 보다 정확한 타이밍에……."
10041030-45 = "아 말 안 하는 게 열 받는다고, 지금!! 답답하게 하지 말라고, 좀!!"
10041030-49 = "말할 거잖아! 어차피 하고 싶은 거 아니냐고, 맞지? 아니면 말 안 할 거야? 안 할 거면 말고!"
10041030-50 = "필요에 따라서는 해야 할 때가 올 거라고 예측하고 있……."
10041030-51 = "그럼 그냥 지금 하라고, 좀!! 어차피 둘밖에 없는데 뭐가 그리 걱정이야!?"
10041030-52 = "둘 밖에……."
10041030-56 = "……그, 그래도 되나? 우리 사이는 그래도 되는 걸까."
10041030-57 = "너라는 인간을 모르는 상태였다면, 일부러 그런다고 생각해서 방금 한 대 쳤다. 진짜로."
10041030-58 = "나를 답답함으로 죽일 생각이야?"
10041030-63 = "어차피 도울 거 아니었으면 처음부터 돕는다고도 안 했을 거 아니냐. 예전에는 이상한 것도 잘만 시켜 놓고 이제 와서 왜 이래?"
10041030-64 = "하기 싫으면 알아서 안 한다고 하니까 신경 쓰지 말고 말해. 무슨 이야기야?"
10041030-66 = "……알았어."
10041030-67 = "이슈는 우리의 원래 계획에 없던 새로운 존재, 유리조노 세이아에 관한 거야."
10041030-69 = "아아, 역시 그쪽이었나. 뭐 그럴 거라 생각하긴 했지."
10041030-70 = "일을 제대로 못 할까 봐 걱정인 거냐? 사고 칠까 봐? 아니면 우리 존재를 발설할까 봐?"
10041030-71 = "아니. 나는 적어도 그녀의 인격과 의도에 대해서는 신뢰하고 있어. 그러지 않을 수 없는 입장이기도 하지."
10041030-72 = "판별하자면 그녀는 우리 입장에서 명백한 '선'이야. 이것은 의심의 여지가 없고, 그 행동이 우리에게 마이너스가 되진 않을 거라 예측하고 있어."
10041030-73 = "그런 정도는…… 스스로 구분하거나 케어할 수 있는 사람이니까."
10041030-74 = "오, 뭐야? 멀쩡한 인간이라는 뜻이네. 좋은 거잖아, 그럼 뭐가 문제인데?"
10041030-75 = "……문제는 우리 쪽이 아니라 그녀 스스로에 관한 쪽."
10041030-81 = "분명 그녀는 내가 알고 있던 유리조노 세이아이긴 했지만, 인식하고 있던 것과는 조금 다른 분위기였어."
10041030-84 = "어딘가 쫓기고 있는 듯한……. 약간의 초조함이 묻어 나는 어조와 행동이었거든."
10041030-85 = "그녀의 입에서 '자신의 증명' 같은 단어가 나온 것도, 선생과 함께 왔으면서 정작 선생에 대한 이야기는 피하고 있는 분위기도 이상해."
10041030-88 = "확실히 그 부분은 조금 이상하지. 보통 이런 일은 오히려 선생을 엮는 편이 일이 수월하니까 말이야."
10041030-89 = "정말이지……. 증명이니, 자격이니 쓸데없는 소리들."
10041030-90 = "좀 철부지들이 하는 소리인데 말이지, 그런 거는."
10041030-91 = "……어쨌든."
10041030-92 = "힘을 잃었다고 해도 그녀의 직감이나 판단 능력은 무시할 것이 못 돼. 어쩌면 정말로 유용한 정보를 가지고 올지도 모르지."
10041030-93 = "하지만 그렇다 할지라도 그것은 어디까지나 '추가적인 이점'으로 작용해야 해. 우리가 그것을 기대하고 일을 진행하면 안 된다는 생각이야."
10041030-94 = "그녀의 제안은 고맙지만, 우리는 하던 대로 일을 진행할 거야."
10041030-98 = "<밀레니엄 데이터 센터>로 가서, 행사 준비 기간 동안 있었던 데이터의 전반적인 흐름을 확인해 줘."
10041030-99 = "빡빡한 일을 시키네, 밀레니엄 데이터 센터라니."
10041030-100 = "이 학교에서 경비 시스템이 제일 삼엄한 곳이잖아? 보통 실력으로는 들어갈 수 없는 곳이라고."
10041030-101 = "미카모 네루라면 가능할 거라는 계산으로 짠 계획이었어. 혹시 문제가 있었을까?"
10041030-105 = "하---!"
10041030-106 = "가끔은 그렇게 예쁜 소리도 할 줄 안단 말이지. 뭐, 안될 거야 있겠어? 미카모 네루인데."
10041030-107 = "의뢰주님은 여기 가만히 앉아서 기다리고 있으라고."
10041030-111 = "……금방 다녀올 테니까♪"
