[translation]
1601606-1 = "서로의 변명거리"
1601606-2 = "(업무를 일찍 마치고, 약속대로 미네와 만나기 위해 카페로 나와 있었다.)"
1601606-6 = "여기 계셨군요. 선생님."
1601606-11 = "아침에 모모톡으로 인사드렸지만, 지금 다시 이렇게 인사드립니다."
1601606-12 = "[s1] \"잘 어울리네. 기분도 좋아 보이고.\"\n[s2] \"뭔가 조금 긴장하고 있지 않아?\""
1601606-17 = "그, 그게……. 그러니까……."
1601606-21 = "……후우……."
1601606-22 = "네……. 맞습니다. 말씀하신 대로입니다."
1601606-23 = "옷이 참 귀여워서……. 볼수록 마음에 들고, 뭔가 애착마저 생겨 버렸습니다."
1601606-24 = "이런 옷을 처분할 생각을 했었다는 걸 떠올리면, 저도 모르게 등골이 서늘해지기까지 합니다."
1601606-25 = "선생님 덕분에 지킬 수 있었군요. 이 부분은 몇 번을 감사드려야 할지 모르겠습니다."
1601606-26 = "이렇게 마음 편하게 입을 수 있는, 좋은 변명거리도 만들어 주시고 말이지요."
1601606-27 = "[s3] \"신경 쓰지 마. 나도 마찬가지니까.\"\n[s4] \"덕분에 나도 함께 쉴 변명거릴 만든 거니까.\""
1601606-30 = "……그렇습니까. 후후. 그건 정말로 다행이군요."
1601606-31 = "사실 그것 또한 배려의 말씀이라는 걸 모르지는 않지만, 그래도 일방적으로 얻기만 하는 것보다는……."
1601606-32 = "그런 식으로라도 선생님께 변명거릴 드릴 수 있다면, 저 또한 대단히 기쁩니다."
1601606-33 = "그렇지만……."
1601606-34 = "……으음."
1601606-38 = "[ns] \"미네?\""
1601606-42 = "아, 아닙니다. 그저……."
1601606-46 = "뭐랄까. 특별한 옷이라는 걸 한 번 의식하게 돼 버리니, 부끄럽다는 기분을 감추기는 어려워지는군요."
1601606-47 = "어쨌든 지금은 사육제 기간도 아니고, 별다른 공연이나 촬영이 있는 날도 아니니까요."
1601606-48 = "조금 이상한 아이……라고 생각하시면 어떻게 하지……같은 생각이랄까."
1601606-49 = "굳이 이런 걸 입고 싶어 하나……. 하고 귀찮은 아이처럼 느껴지면 어떻게 하지, 하고……."
1601606-53 = "……네?"
1601606-54 = "전혀 아니라고요? 그, 그렇지만……."
1601606-56 = "[ns5] \"귀여운 아이가 귀여운 옷을 입고 있을 뿐인데, 뭐.\"\n[ns6] \"오히려 너무 자주 불러내면 어쩌나 걱정될 정도인걸.\""
1601606-61 = "그, 그런……!! 무슨 말씀을……!!"
1601606-62 = "아무리 그래도, 일부러 그런 말씀까지는 하지 않으셔도 괜찮아요!!"
1601606-63 = "……아무리 그래도 제가 그런……."
1601606-68 = "후후, 후후후……."
1601606-69 = "[s7] \"……미네?\"\n[s8] \"갑자기 웃었어……?\""
1601606-74 = "아, 죄송합니다. 갑자기 새삼스레, 지금 이러는 제 모습이 우스워서요."
1601606-75 = "뭔가 선생님과의 대화는 늘 이런 식으로 흘러가는 것 같습니다."
1601606-76 = "그렇지요. 이제 와서 계속 그런 걸 되묻고 있는 것도 오히려 선생님께서 바라지 않으실 일."
1601606-77 = "이왕 이렇게 서로 나오게 된 거……."
1601606-81 = "그동안만이라도 좋으니……. 선생님의 시간은, 제가 감사히 잘 받아 가도록 하겠습니다."
1601606-82 = "시간을 보내기에 괜찮은 장소를 몇 군데 알고 있답니다. 지금의 선생님을 위해, 한적하게 쉴 수 있는 공간을 마련해 드리겠습니다."
1601606-88 = "에스코트해 드리겠습니다. 선생님."
1601606-89 = "자, 가시죠. 이쪽으로……."
1601606-96 = "(미네를 따라 근처의 강변으로 향했다.)"
1601606-100 = "(날씨가 좋아서인지, 나와 있는 사람들의 모습도 많이 보였다.)"
1601606-104 = "으음. 생각보다 사람이 많군요. 이런 걸 의도한 건 아니었는데……."
1601606-105 = "조금 더 조용하고 한산한 공간을 제공해 드리고 싶었습니다만……."
1601606-109 = "……아."
1601606-110 = "저에게 좋은 생각이 있습니다. 따라오시죠, 선생님."
1601606-117 = "[ns9] \"……이건?\"\n[ns10] \"오리 보트……?\""
1601606-120 = "……네. 타시죠, 선생님."
1601606-121 = "여기라면 충분히, 한적하게 쉬실 수 있는 공간이 될 거라고, 생각합니다."
1601606-131 = "이리로 오세요, 선생님. 흔들릴 수 있으니 제가 손을 잡아 드리겠습니다."
1601606-132 = "앉으신 후에는, 다 잊고 한숨 주무셔도 좋습니다. 필요하시다면 자장가도 제공해 드릴 수 있겠군요."
1601606-136 = "후후. 어쩌면, 조금……. 긴 운항이 될지도 모르겠습니다."
1601606-137 = "네. 실제로 저는……."
1601606-142 = "……그걸 희망하고 있답니다."
1601606-144 = "(이후 미네와 함께, 오리 보트를 타고 호수 위에서 시간을 보냈다.)"
1601606-148 = "(흔들거리는 수면과 미네의 작은 노랫소리로, 어느새 완전히 잠들고 말았다.)"
