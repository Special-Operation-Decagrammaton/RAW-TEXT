[translation]
1013702-1 = "The Detective's First Impression"
1013702-2 = "I went to Valkyrie, looking to talk to Konoka about some work-related issues."
1013702-3 = "Oh, welcome, Sensei!"
1013702-4 = "What can I help you with today?"
1013702-5 = "[s1] \"I needed to talk to Konoka.\"\n[s2] \"She's not at her desk. Do you know where I could find her?\""
1013702-8 = "Ah, the Deputy Director did clock in..."
1013702-9 = "But she had some other...work to handle. If you make your way down to the basement, you should be able to find her."
1013702-10 = "[s] \"'Work' in the basement?\""
1013702-11 = "Yes. And she had quite a lot to take care of, so she should still be there."
1013702-13 = "[ns3] \"Isn't this...a prison cell?\"\n[ns4] \"What exactly is Konoka doing?\""
1013702-16 = "Zzz... Zzz..."
1013702-17 = "I heard the sound of someone snoring..."
1013702-18 = "Zzz... Zzz..."
1013702-19 = "C-Come in...! Come in!! Zzz..."
1013702-20 = "[ns5] \"Konoka...?\"\n[ns6] \"Why are you in a prison cell...?\""
1013702-26 = "A-AAAHHH!!"
1013702-27 = "*huff* *huff* You coward! With your sand..."
1013702-28 = "Wha...? It was just a dream...? Tch, I'll beat them to a pulp next time..."
1013702-29 = "Hm?"
1013702-34 = "[ns] \"Hi there, Konoka...\""
1013702-35 = "I'm STILL dreaming?"
1013702-36 = "And Sensei's appearing in my dream again... Why's this keep happening?"
1013702-37 = "[ns] \"This isn't a dream! Get it together!\""
1013702-38 = "*Yaaaaaawn*... Mm..."
1013702-39 = "Whoopsie. I was going to take a quick nap before you got here, but I guess I overslept."
1013702-40 = "[s7] \"So, what's the jailbreak plan?\"\n[s8] \"Who do I need to ask to get you some outside food?\""
1013702-43 = "Kyahaha! I'm in the cell, but it's not like I'm under arrest!"
1013702-44 = "...I mean, I'm not totally innocent. I did beat some people up, but that's not why I'm here."
1013702-45 = "I had to take down and arrest 30 criminals at once, by myself, and got back late last night."
1013702-46 = "Which is why... *yawn*... I snuck down here for a quick nap. The new recruits are too rowdy upstairs."
1013702-47 = "Ah! That reminds me. I still need to throw those rascals a welcome party and get to know them. I've sure been burning the midnight oil lately, though. "
1013702-48 = "I won't take any more of your time, though. We had some paperwork to go over, right? I'll be out in a jiffy!"
1013702-49 = "Let's see... Where...is the spring...for this lock...?"
1013702-56 = "S-Stop!! Stop moving!! Away from the bars!! Move, and I'll fire!"
1013702-60 = "Eh?"
1013702-61 = "HEY! I warned you!! Hands in the air, now!"
1013702-62 = "Sensei, get back! A single glance tells me that we're dealing with a vicious criminal! It's advised for civilians to remain clear of the bars!"
1013702-63 = "[s9] \"It's a misunderstanding!\"\n[s10] \"While I agree, it's still a misunderstanding!\""
1013702-66 = "Wait, aren't you the new Public Peace Bureau recruit? I saw your name on the roster book."
1013702-67 = "I'm the Deputy Director! I'm your boss, all right? So quit it with all this, and just open the door!"
1013702-68 = "Seriously?! You have the audacity to try to impersonate our Deputy Director!"
1013702-69 = "I may not have had the honor of meeting her yet, but even I know someone like YOU could never be Valkyrie's Deputy Director."
1013702-70 = "In fact, I'm going to contact her right now to expose your dirty lies!"
1013702-74 = "There! I've sent a message!"
1013702-79 = "There, yourself. You finally happy now? You have anything to say to the Deputy Director of the Public Peace Bureau?"
1013702-80 = "Uh..."
1013702-81 = "This is Public Peace One-Two-Zero!! The suspect has stolen the Deputy Director's phone!"
1013702-82 = "You've made up your mind already, haven't you?!"
1013702-83 = "A real police officer would never dress so lackadaisically!"
1013702-84 = "This is your final warning! Get back, you jailbreaking scum!!"
1013702-85 = "Look!! Fine!! I get it! You've made some good points!! But I'm the one who takes the Director to saunas and dinner—"
1013702-86 = "PEPPER!! PEPPPPPPERRR ATTACK!"
1013702-93 = "KYAAAH! MY EYES!!"
1013702-94 = "GET BACK HERE, YOU!! When I get out of here—! GRRR!!!"
1013702-95 = "How're you still standing? YOU MONSTER!!"
1013702-96 = "Give me more! I could gargle it if I wanted! I'm Konoka, you hear me?!?! Shima Konoka!!"
1013702-97 = "Taser! Taser! Taser!!!"
1013702-99 = "The Public Peace Bureau Deputy Direc—KYAAAAAAH!!"
1013702-103 = "...tor..."
1013702-105 = "This is the underground cell, Public Peace Bureau One-Two-Zero. Jailbreaking suspect is down!!"
1013702-109 = "Ah, right. Today's horoscope was about making good first impressions."
1013702-111 = "Afterwards, other officers rushed over and confirmed Konoka's identity."
1013702-112 = "The new recruit was very apologetic about the misunderstanding, and Konoka smiled and forgave her."
1013702-113 = "But Konoka was speaking to the wall because she couldn't open her eyes. She seemed okay, though."
