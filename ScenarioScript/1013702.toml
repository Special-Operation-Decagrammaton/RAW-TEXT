[translation]
1013702-1 = "การแนะนำตัวของตำรวจ"
1013702-2 = "(คุณครูแวะไปที่วัลคิรี่เพื่อหารือเรื่องงานกับโคโนกะ)"
1013702-3 = "โอ๊ะ สวัสดีค่ะ คุณครู!"
1013702-4 = "มีอะไรให้ฉันช่วยมั้ยคะ?"
1013702-5 = "[s1] \"ครูมาคุยงานกับโคโนกะน่ะ\"\n[s2] \"ครูมาเรื่องงานน่ะ เห็นโคโนกะบ้างหรือเปล่า?\""
1013702-8 = "อ่า วันนี้รองหัวหน้ากรมฯ มาทำงานค่ะ"
1013702-9 = "แต่ว่าตอนนี้กำลังติด 'งาน' อื่นอยู่ คุณครูลงไปหาที่ชั้นใต้ดินได้เลยค่ะ"
1013702-10 = "[s] \"มีงานอื่นที่ชั้นใต้ดินเหรอ?\""
1013702-11 = "รองหัวหน้ากรมฯ งานเยอะมาก ก็เลยยังอยู่ที่นั่นอยู่เลยค่ะ"
1013702-13 = "[ns3] \"ที่นี่มัน... ห้องขัง?\" \n[ns4] \"โคโนกะมาทำงานอะไรที่นี่นะ...\""
1013702-16 = "คร่อก... ฟี้... คร่อก..."
1013702-17 = "คุณครูได้ยินเสียงคนนอนกรน"
1013702-18 = "คร่อก... ฟี้..."
1013702-19 = "คร่อก... งืมๆ... ขะ...! เข้ามาได้!!! คร่อก... ฟี้... แจ๊บๆ..."
1013702-20 = "[ns5] \"โคโนกะ...?\"\n[ns6] \"ทำไมมานอนอยู่ในห้องขัง...?\""
1013702-26 = "วะ... ว้ากก!!!"
1013702-27 = "เฮือกก! เฮือก! ยัยเด็กนี่ กล้าเอาทรายมาสาดฉัน..."
1013702-28 = "อะไรกัน ฉันฝันไปหรอกเหรอ... ชิ อุตส่าห์ชนะได้แล้วเชียว..."
1013702-29 = "หืม?"
1013702-34 = "[ns] \"สวัสดี โคโนกะ...?\""
1013702-35 = "อะไรกัน ยังอยู่ในความฝันเหรอ?"
1013702-36 = "ฝันถึงคุณครูอีกแล้ว ทำไมหมู่นี้ฝันแบบนี้อยู่เรื่อยนะ"
1013702-37 = "[ns] \"นี่มันความจริงต่างหากล่ะ! ตื่นได้แล้ว!\""
1013702-38 = "งืม... ฮ้าวววว... แจ๊บๆ..."
1013702-39 = "เฮ้อ ฉันกะว่าจะตื่นให้ทันก่อนคุณครูมา แต่สงสัยจะเหนื่อยมากเกินไปน่ะ"
1013702-40 = "[s7] \"รอบนี้จะโดนขังนานหรือเปล่า?\"\n[s8] \"ถ้าจะเอาของมาเยี่ยม ต้องเอาไปฝากไว้ที่ใครเหรอ?\""
1013702-43 = "อะฮะฮ่า ไม่ใช่อย่างที่คิดหรอกค่ะ! ถึงฉันจะมาอยู่ในห้องขัง แต่ฉันไม่ได้โดนขังค่ะ"
1013702-44 = "อืม... แต่ก็ใช่ว่าฉันไม่ได้ทำอะไรเลย ที่จริงฉันก็มีเรื่องมานิดหน่อย แต่นี่ไม่ใช่เหตุผลที่ฉันเข้ามาที่นี่หรอก"
1013702-45 = "เมื่อคืนฉันออกไปทำคดีจับกุม ก็เลยต้องสู้แบบ 1:30 และเพิ่งเลิกงานเมื่อเช้ามืดนี้เองค่ะ"
1013702-46 = "ฉัน... ก็เลย... ฮ้าววว... ว่าจะนอนพักสักหน่อย แต่หมู่นี้เรามีเด็กใหม่เข้ามาเยอะจนเดินขวักไขว่ไปหมด ฉันก็เลยลงมานอนที่นี่ค่ะ"
1013702-47 = "ฉันต้องจัดงานต้อนรับและทำความรู้จักเด็กใหม่บ้าง แต่ก็งานยุ่งจนไม่มีเวลาเลยค่ะ "
1013702-48 = "อ้อ จริงสิ คุณครูมาคุยเรื่องงานธุรการใช่มั้ยคะ? รอเดี๋ยวนะคะ ฉันจะรีบออกไปค่ะ"
1013702-49 = "ไหน~ ขอดูซิ~~ สปริง~ ของแม่กุญแจอันนี้~ อยู่ตรงไหน~ น้า~"
1013702-56 = "ยะ... หยุดนะ!! หยุดเดี๋ยวนี้!! ออกห่างจากลูกกรงเลย!! ถ้ายังขยับเข้ามาอีก ฉันยิงแน่!!"
1013702-60 = "ว่าไงนะ?"
1013702-61 = "ฉันเตือนแล้วนะ!! ห้ามแตะต้องแม่กุญแจเด็ดขาด!!"
1013702-62 = "คุณครู ช่วยถอยไปก่อนค่ะ! แค่ดูก็รู้ว่ารายนี้เป็นนักโทษที่โหดไม่ใช่เล่น ถ้าเข้าไปใกล้ลูกกรงจะเป็นอันตรายนะคะ!"
1013702-63 = "[s9] \"เข้าใจผิดแล้วละ!!\"\n[s10] \"ครูก็เห็นด้วยนะ แต่เข้าใจผิดแล้วละ!\""
1013702-66 = "อะไรกัน เธอคือเด็กใหม่ของกรมความมั่นคงสาธารณะที่เพิ่งเข้ามานี่นา? ฉันจำได้จากรายชื่อนะ"
1013702-67 = "นี่!! ฉันเป็นตำรวจนะ!! แล้วก็เป็นถึงรองหัวหน้ากรมฯ เลยด้วย! เลิกโวยวายแล้วมาเปิดประตูนี้ซะ!"
1013702-68 = "ตำรวจงั้นเหรอ?! แล้วยังอ้างว่าเป็นรองหัวหน้ากรมฯ อีก?"
1013702-69 = "ถึงฉันจะยังไม่เคยเจอรองหัวหน้ากรมฯ แต่ไม่มีทางที่ท่านจะรูปร่างหน้าตาแบบเธอหรอกนะ?"
1013702-70 = "ถ้าติดต่อท่านไปก็คงได้รู้กัน แต่ยังไงก็ไม่ใช่อยู่ดีนั่นละ!"
1013702-74 = "ดีละ ฉันส่งข้อความไปแล้ว!"
1013702-79 = "เป็นยังไงล่ะ? พอได้เจอรองหัวหน้ากรมฯ แล้วยังคิดแบบเดิมอยู่มั้ย?"
1013702-80 = "อ่า..."
1013702-81 = "ติดต่อจากกรมความมั่นคง รหัส 120!! โทรศัพท์มือถือของรองหัวหน้ากรมฯ ถูกผู้ต้องสงสัยขโมยไป!!"
1013702-82 = "นี่เธออยากให้ฉันเป็นคนร้ายให้ได้ใช่มั้ย?!"
1013702-83 = "แล้วตำรวจที่ไหนแต่งตัวแบบเธอบ้างล่ะ?!"
1013702-84 = "ฉันจะเตือนเป็นครั้งสุดท้ายนะ! ถอยไปเดี๋ยวนี้ ยัยนักเลงแหกคุก!!"
1013702-85 = "ยัยเด็กใหม่นี่!! นั่นก็เป็นการอนุมานที่ดีอยู่หรอก!!! เห็นอย่างนี้ฉันก็กินข้าวร่วมโต๊ะกับหัวหน้ากรมของ#nเธอนะ!! แล้วก็ไปซาวน่าด้วยกันด้วย!"
1013702-86 = "ต้องเจอนี่! สเปรย์พริกไทย สเปรย์พริกไทย!!!"
1013702-93 = "โอ๊ยยย!! ตาฉัน!!!!!"
1013702-94 = "มานี่เลย!! ถ้าฉันแหกลูกกรงนี้ออกไปได้นะ เธอไม่รอดแน่!!!"
1013702-95 = "ขนาดโดนสเปรย์พริกไทยแล้วยังอาละวาดได้อยู่อีก เป็นคนหรือปีศาจเนี่ย!!!"
1013702-96 = "ถ้าฝึกดีๆ ละก็ ให้ฉันกลั้วคอด้วยสเปรย์พริกไทยก็ยังได้! ฉันคือโคโนกะนะ!! ชิมะ โคโนกะ!"
1013702-97 = "งั้นเจอนี่! ปืนช็อตไฟฟ้า! ปืนช็อตไฟฟ้า!!!!"
1013702-99 = "ฉันเป็นถึงรองกรมความมั่น... โอ๊ยๆๆๆๆ!!!!"
1013702-103 = "คง... สาธารณะ... เชียวนะ..."
1013702-105 = "ติดต่อจากห้องขัง นี่คือกรมความมั่นคงสาธารณะ รหัส 120 จับตัวนักโทษที่พยายามแหกคุกได้แล้ว!!"
1013702-109 = "อ๊ะ จริงสิ ดวงประจำวันนี้คือการแนะนำตัวให้ดี..."
1013702-111 = "(หลังจากนั้น นักเรียนตำรวจที่ลงมาก็ช่วยยืนยันตัวโคโนกะให้)"
1013702-112 = "(เด็กใหม่ที่เข้าใจผิดต้องขอโทษขอโพยยกใหญ่ แต่โคโนกะก็ยิ้มรับและให้อภัย)"
1013702-113 = "(ถึงจะลืมตาไม่ขึ้นและหันไปพูดกับผนัง แต่โคโนกะก็ไม่ได้ดูอารมณ์เสียเท่าไร)"
