[translation]
1013702-1 = "그 형사의 자기소개"
1013702-2 = "(코노카와 업무 상의차 발키리에 방문했다.)"
1013702-3 = "오, 안녕하십니까 선생님!"
1013702-4 = "무엇을 도와드릴까요?"
1013702-5 = "[s1]\"코노카와 상담하러 왔단다.\"\n[s2]\"자리에 없던데, 어디 있는지 아니?\""
1013702-8 = "아, 부국장님이라면 출근은 하셨는데요."
1013702-9 = "지금은 다른 '업무' 중이셔서, 지하로 내려가시면 됩니다."
1013702-10 = "[s]\"지하에서 '업무'?\""
1013702-11 = "부국장님이 워낙 일이 많으셔서요, 아직 거기 계실 겁니다."
1013702-13 = "[ns3]\"여긴……. 유치장?\"\n[ns4]\"코노카는 여기서 무슨 업무를…….\""
1013702-16 = "드르렁…… 커어…… 드르렁……."
1013702-17 = "누군가의 코 고는 소리가 들렸다."
1013702-18 = "커어…… 드르렁……."
1013702-19 = "드르…… 드르와……! 드루와!!! ……커어…… 쿨쿨……."
1013702-20 = "[ns5]\"코노카……?\"\n[ns6]\"그런데 왜 유치장 안에……?\""
1013702-26 = "으, 으아악!!!"
1013702-27 = "허억! 헉! 아이 짜식이, 비겁하게 모래를……"
1013702-28 = "뭐야, 꿈이었나…… 칫, 다 이겼는데……."
1013702-29 = "응?"
1013702-34 = "[ns]\"안녕 코노카……?\""
1013702-35 = "뭐야, 아직도 꿈이었나."
1013702-36 = "또 선생님 나오는 꿈꾸고, 요새 왜 이렇지."
1013702-37 = "[ns]\"현실입니다! 기상!\""
1013702-38 = "으- 하아아아암……. 흠냐……."
1013702-39 = "아유, 오시기 전에 깨려고 했는데, 너무 피곤했나 봄다."
1013702-40 = "[s7]\"금방 풀려날 수 있을 것 같아?\"\n[s8]\"사식은 어디에 신청하면 돼?\""
1013702-43 = "캬하하, 아님다! 유치장에 있긴 한데, 잡힌 건 아님다."
1013702-44 = "……뭐 아무것도 안 한 건 아니고, 줘 패긴 했지만 여기 들어간 원인은 아님다."
1013702-45 = "어제, 체포 건이 있어서 30대 1로 싸우다가 오늘 새벽에나 퇴근했슴다."
1013702-46 = "그래…… 서…… 흐아-암……. 눈 좀 붙이려고 하는데, 요새 신참들 많아서 영 어수선해서 여기로 내려왔슴다."
1013702-47 = "쩝. 이번에 온 신참들 환영식도 하고 얼굴도 좀 터야 하는데, 일도 바빠서 못하고 있슴다."
1013702-48 = "아, 맞다. 행정 업무 때문에 오신 검까? 기다려보십쇼. 금방 나오겠슴다."
1013702-49 = "어디~ 보자아~~ 이 자물쇠의~ 스프리잉~은 어디에~ 있느냐~"
1013702-56 = "저, 정지!! 정지!! 철창에서 물러서!! 움직이면 쏜다!!"
1013702-60 = "뭐?"
1013702-61 = "분명히 경고했다!! 자물쇠에 손대지 마라!!"
1013702-62 = "선생님, 물러나십시오! 딱 봐도 흉악범이라, 철창에 다가서면 위험합니다!"
1013702-63 = "[s9]\"오해야!!\"\n[s10]\"나도 그렇게 생각하지만, 오해야!\""
1013702-66 = "뭐야, 너 이번에 새로 온 공안국 녀석이잖아? 인명부에서 봤어."
1013702-67 = "야!! 나 경찰이야!! 부국장이라고! 시끄럽게 굴지 말고 이 문이나 열어!"
1013702-68 = "경찰?! 사칭을 해도 심지어 부국장님을 사칭하는 거야?"
1013702-69 = "아직 뵙지는 못했지만, 공안국의 부국장님이 너 같을 리가 없잖아?"
1013702-70 = "바로 호출해서 확인해 보면 알겠지, 어차피 아니겠지만!"
1013702-74 = "자, 메시지 보냈다!"
1013702-79 = "됐냐? 부국장님 보니까 좀 생각이 달라졌어?"
1013702-80 = "어……."
1013702-81 = "여기는 공안 하나 둘 공!! 부국장님의 핸드폰이 용의자에게 탈취되었다!!"
1013702-82 = "너 그냥 내가 나쁜 놈이었으면 하는 거지?!"
1013702-83 = "대체 어디의 경찰이 너같이 입고 다니는데?!"
1013702-84 = "마지막 경고다! 물러서, 이 탈옥 양아치!!"
1013702-85 = "짜샤!! 좋은 추론이긴 한데!!! 내가 너희 국장하고 같이 밥도 먹고!! 사우나도 같이 가-"
1013702-86 = "페퍼, 페퍼, 페퍼!!!"
1013702-93 = "끄아아악!! 눈이!!!!!"
1013702-94 = "너 일로 와!! 철창 부수고 나가면 아주 그냥-!!!"
1013702-95 = "이걸 맞고도 버틴다니, 괴물이냐!!!"
1013702-96 = "훈련하면 가글도 할 수 있어 임마! 나 코노카라고!! 시마 코노카!"
1013702-97 = "테이저! 테이저! 테이저!!!!"
1013702-99 = "공안국 부국- 기갸갸갸갸갹-!!!!"
1013702-103 = "장…… 이라고……."
1013702-105 = "여기는 지하 유치장, 공안국 하나 둘 공, 탈옥 혐의자 제압 완료!!"
1013702-109 = "아 맞다, 오늘 운세, 자기소개 잘하기……."
1013702-111 = "(이후, 달려온 경관들이 코노카의 신원을 확인시켜 줬다.)"
1013702-112 = "(오해한 신참이 어쩔 줄 몰라 하며 사과했고, 코노카는 웃으면서 용서했다.)"
1013702-113 = "(눈을 못 떠서 벽을 보고 말했지만, 왠지 기분이 괜찮아 보였다.)"
