[translation]
1013702-1 = "那位刑警的自我介紹"
1013702-2 = "（為了和木乃香商量工作而前往了女武神）"
1013702-3 = "哦，老師您好呀！"
1013702-4 = "有什麼我能幫忙的嗎？"
1013702-5 = "[s1]「我是來和木乃香商量事情的。」\n[s2]「他不在位置上，你知道他在哪裡嗎？」"
1013702-8 = "啊，副局長的話今天確實有來……"
1013702-9 = "不過他正在處理其他「工作」，到地下室應該就能找到他了。"
1013702-10 = "[s]「在地下室『工作』？」"
1013702-11 = "因為副局長的工作很多，所以應該還在那裡才對。"
1013702-13 = "[ns3]「這裡是……拘留所？」\n[ns4]「木乃香究竟在這裡做什麼工作……」"
1013702-16 = "呼嚕……呼……呼嚕……"
1013702-17 = "（聽到了有人打呼的聲音）"
1013702-18 = "呼……呼嚕……"
1013702-19 = "呼……放……放馬過來！！！#n呼……呼嚕……"
1013702-20 = "[ns5]「木乃香……？」\n[ns6]「為什麼在拘留所裡……？」"
1013702-23 = ""
1013702-25 = ""
1013702-26 = "唔，唔啊啊！！！"
1013702-27 = "喂！竟然用沙子！你這卑鄙的──"
1013702-28 = "怎麼，原來是夢啊……呿，本來都快贏了說……"
1013702-29 = "嗯？"
1013702-30 = ""
1013702-32 = ""
1013702-33 = ""
1013702-34 = "[ns]「你好，木乃香……？」"
1013702-35 = "什麼啊……還在夢裡嗎……？"
1013702-36 = "我最近是怎麼回事，為什麼一直夢到老師啊。"
1013702-37 = "[ns]「這是現實！快醒醒！」"
1013702-38 = "呼啊啊……呣喵……"
1013702-39 = "哎呀～原本打算在老師來之前起床的，看來是太累了呢。"
1013702-40 = "[s7]「所以你快被釋放了嗎？」\n[s8]「送餐要在哪裡申請？」"
1013702-43 = "啊哈哈！不是啦！#n我雖然待在拘留所裡面，不過並不是被抓進來的。"
1013702-44 = "……其實也不能說什麼都沒做啦。#n畢竟我昨天確實打了人，但那不並是我待在這裡的原因。"
1013702-45 = "昨天處理逮捕任務的時候來了場一打三十的大亂鬥，結果一路忙到凌晨才下班。"
1013702-46 = "所以……呼啊……就打算休息一下。#n因為最近來了很多新人，到處都吵吵鬧鬧的，只好跑到這裡補眠。"
1013702-47 = "嘖，本來想幫新人辦場歡迎會認識一下彼此，但是工作太忙根本擠不出時間。"
1013702-48 = "啊，對了。老師是來處理行政工作的吧？#n請稍等一下，我馬上去拿。"
1013702-49 = "我看看～這個鎖的彈簧～在哪裡呢～"
1013702-50 = ""
1013702-52 = ""
1013702-53 = ""
1013702-54 = ""
1013702-55 = ""
1013702-56 = "停，停下來！！立刻停止動作！！#n跟鐵欄杆保持距離！！要是再動我就開槍了！！"
1013702-57 = ""
1013702-59 = ""
1013702-60 = "咦？"
1013702-61 = "我已經警告你了！！不準碰那個鎖！！"
1013702-62 = "老師，請退後！他一看就是個凶惡的犯人，靠近鐵欄杆太危險了！"
1013702-63 = "[s9]「這是誤會！！」\n[s10]「雖然我也這麼覺得，但這是誤會！」"
1013702-66 = "嗯？你是這次的新人吧？我有在名冊上看過。"
1013702-67 = "話說我也是警察！！是公安局的副局長！！#n不要鬧了，快把門打開！"
1013702-68 = "公安局！？你假冒誰不好，竟然敢假冒副局長！？"
1013702-69 = "雖然我還沒有實際見過本人，但是公安局的副局長怎麼可能會是你這種人！？"
1013702-70 = "馬上叫副局長來確認一下就知道了，反正你一定不是真的！"
1013702-71 = ""
1013702-73 = ""
1013702-74 = "好，訊息已經發出去了！"
1013702-75 = ""
1013702-77 = ""
1013702-78 = ""
1013702-79 = "你現在看到副局長了吧？想法有沒有改變？"
1013702-80 = "呃……"
1013702-81 = "這裡是公安么兩洞！！副局長的手機被嫌犯搶走了！！"
1013702-82 = "你分明就是想把我當成壞人吧！？"
1013702-83 = "到底哪裡的公安局會穿成你這副德性啊！？"
1013702-84 = "這是最後警告！給我退後！你這個越獄犯！！"
1013702-85 = "臭小子！！推理得倒是不錯啦！！#n但我可是和環奈局長一起吃過飯，一起去過──"
1013702-86 = "辣椒水！！辣椒水！！！！"
1013702-87 = ""
1013702-89 = ""
1013702-93 = "啊啊啊！！我的眼睛！！！！！"
1013702-94 = "你給我過來！！等我把鐵欄杆砸爛你就死定了！！！"
1013702-95 = "為什麼沒用！？你是怪物嗎！？"
1013702-96 = "當然是練過啊！我還能拿來漱口咧！#n我是木乃香！！志真木乃香！！"
1013702-97 = "電擊槍！！電擊槍！！！！"
1013702-99 = "我是公安局的副局──嘎嘎嘎嘎嘎嘎──！！！！"
1013702-100 = ""
1013702-103 = "長……耶……"
1013702-105 = "這裡是地下拘留所！#n公安么兩洞，已將越獄嫌犯逮捕完畢！！"
1013702-106 = ""
1013702-108 = ""
1013702-109 = "啊……對了……今天的運勢是……要好好自我介紹……"
1013702-111 = "（之後趕來的後輩協助確認了木乃香的身份）"
1013702-112 = "（誤會的新人不知所措地道歉，不過木乃香笑著原諒了）"
1013702-113 = "（雖然因為睜不開眼睛而對著牆說話，但是心情看起來還算不錯）"
