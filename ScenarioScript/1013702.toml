[translation]
1013702-1 = "那位刑警的自我介紹"
1013702-2 = "（因為和木乃香有工作上的事，所以前往了女武神）"
1013702-3 = "哦，老師，您好！"
1013702-4 = "有什麼能幫忙的嗎？"
1013702-5 = "[s1]「我是來和木乃香商量事情的。」\n[s2]「他不在位置上，你知道他在哪嗎？」"
1013702-8 = "啊，副局長的話今天是有來。"
1013702-9 = "現在正在處理其他「工作」，到地下去就可以找到他了。"
1013702-10 = "[s]「在地下『工作』？」"
1013702-11 = "因為副局長的工作很多，所以應該還在那裡。"
1013702-13 = "[ns3]「這裡是……拘留所？」\n[ns4]「木乃香在這裡做什麼工作……」"
1013702-16 = "呼嚕……呼……呼嚕……"
1013702-17 = "（聽到了有人打呼的聲音）"
1013702-18 = "呼……呼嚕……"
1013702-19 = "呼……放……放馬過來！！！……呼……呼嚕……"
1013702-20 = "[ns5]「木乃香……？」\n[ns6]「為什麼在拘留所裡……？」"
1013702-26 = "唔，唔啊啊！！！"
1013702-27 = "喂！竟然用沙子！你這卑鄙的──"
1013702-28 = "呃，是夢啊……嘖，都快贏了……"
1013702-29 = "嗯？"
1013702-34 = "[ns]「你好，木乃香……？」"
1013702-35 = "什麼啊……還在夢裡嗎……？"
1013702-36 = "又做了老師的夢，最近是怎麼回事。"
1013702-37 = "[ns]「這是現實！起床！」"
1013702-38 = "呼啊啊……嗯嗯……"
1013702-39 = "哎呀，本來想在老師你來之前醒來的，不過好像太累了。"
1013702-40 = "[s7]「所以什麼時候出獄？」\n[s8]「真的會有豬排丼嗎？」"
1013702-43 = "哈哈哈！不是啦！我雖然在拘留所裡面，但不是被抓進來的。"
1013702-44 = "……也不是說什麼都沒做，雖然昨天確實打了人，但這不是進來的原因。"
1013702-45 = "昨天因為在處理逮捕案件，我一個人打三十個人，打著打著就早上了。"
1013702-46 = "所以……呼啊……就想休息一下，#n因為最近新人很多有點吵，所以就來這裡了。"
1013702-47 = "嘖，本來想幫新人辦個歡迎會讓彼此互相熟悉一下，#n但工作太忙根本辦不成。"
1013702-48 = "啊，對了。老師是因為行政工作來的吧？#n請稍等，我馬上去拿。"
1013702-49 = "我看看……鑰匙……放去哪裡了呢……"
1013702-56 = "把，把手舉起來！！向後退！！再動我就開槍！！"
1013702-60 = "咦？"
1013702-61 = "我已經警告你了！！不要碰那個鎖！！"
1013702-62 = "老師，請退後！他一看就是凶惡犯，靠太近會很危險的！"
1013702-63 = "[s9]「這是誤會！！」\n[s10]「雖然我也這麼覺得，但這是誤會！」"
1013702-66 = "嗯？你是這次的新人吧？我有在名冊上看過。"
1013702-67 = "話說我是公安局的！！我是副局長！！不要鬧了，快把門打開！"
1013702-68 = "公安局！？ 竟然敢冒充副局長！？"
1013702-69 = "雖然還沒見過面，但公安局的副局長怎麼可能是你這種人！？"
1013702-70 = "馬上叫副局長來確認一下就知道了，反正你一定不是真的！"
1013702-74 = "好，我訊息發出去了！"
1013702-79 = "你現在看到副局長了吧？想法有沒有改變？"
1013702-80 = "呃……"
1013702-81 = "這裡是公安么兩洞！！副局長的手機被嫌疑人搶走了！！"
1013702-82 = "你壓根就是想把我當成壞人吧！？"
1013702-83 = "到底哪裡的公安局會穿得像你這樣啊！？"
1013702-84 = "這是最後警告！給我退後！你這個越獄犯！！"
1013702-85 = "臭小子！！推理得倒是不錯啦！！#n但我可是和環奈局長一起吃過飯，一起去過──"
1013702-86 = "辣椒水！！辣椒水！！！！"
1013702-93 = "啊啊啊！！我的眼睛！！！！！"
1013702-94 = "你給我過來！！等我把鐵欄杆砸爛你就死定了！！！"
1013702-95 = "為什麼沒用！？你是怪物嗎！？"
1013702-96 = "當然是練過啊！我還能拿來漱口咧！我是木乃香！！志真木乃香！！"
1013702-97 = "電擊槍！！電擊槍！！！！"
1013702-99 = "我是公安局的副局──嘎嘎嘎嘎嘎嘎──！！！！"
1013702-103 = "長……耶……"
1013702-105 = "這裡是地下拘留所，公安么兩洞，越獄嫌疑犯逮捕完畢！！"
1013702-109 = "啊……對了……今天的運勢……是好好自我介紹……"
1013702-111 = "（之後趕來的後輩協助確認了木乃香的身份）"
1013702-112 = "（誤會的新人不知所措地道歉，不過木乃香笑著原諒了）"
1013702-113 = "（雖然因為睜不開眼睛而對著牆說話，但看起來心情不錯）"
