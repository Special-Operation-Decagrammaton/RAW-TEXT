201040-72 = ""
201040-74 = ""
201040-75 = "...But it looks to just be an ordinary smartwatch to me."
201040-76 = "Sensei is likely my only option."
201040-79 = ""
201040-80 = "I wondered this about the Shittim Chest as well, but what could the President have wanted with these items?"
201040-81 = "I thoroughly understand that only a superhuman can move the pieces that make up this world."
