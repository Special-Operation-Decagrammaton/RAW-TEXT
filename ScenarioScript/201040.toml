[translation]
201040-1 = "ตอนที่ 4;ความคิดถึงสีท้องฟ้า"
201040-2 = "(หลังเยี่ยมคายะเสร็จแล้ว คุณครูก็ไปส่งรินที่อาคารขององค์การนักเรียน)"
201040-3 = ""
201040-6 = ""
201040-7 = "ฉันบอกไปแล้วนี่คะว่าไม่ต้องมาส่งก็ได้..."
201040-8 = "ดึกขนาดนี้แล้ว ไม่เห็นต้องเดินอ้อมมาไกลเพื่อฉันเลย..."
201040-9 = "[s1] \"ไม่ต้องคิดมากหรอกนะ ครูแค่อยากมาส่งน่ะ\"\n[s2] \"เดินกลับคนเดียวมันอันตรายนี่นา\""
201040-12 = "ถึงฉันจะถนัดทำงานเอกสาร แต่ฉันก็เป็นผู้บริหารขององค์การนักเรียนนะคะ ถ้าแค่พวกนักเลงทั่วไปมาหาเรื่อง ฉันจัดการเองได้อยู่แล้วค่ะ"
201040-13 = "ที่จริงแล้วดึกดื่นแบบนี้ คุณครู [USERNAME] นั่นแหละที่จะเป็นอันตรายซะมากกว่า..."
201040-14 = ""
201040-16 = ""
201040-17 = "แต่มาพูดเรื่องแบบนี้เอาป่านนี้ ก็คงเป็นได้แค่การแก้ตัวเมื่อสายไปแล้วสินะคะ"
201040-18 = "ไหนๆ ก็มาถึงองค์การนักเรียนแล้ว แวะเข้าไปพักสักครู่แล้วค่อยกลับเถอะค่ะ"
201040-19 = "[s3] \"อืม... ครูเข้าใจเจตนาดีของรินอยู่หรอก แต่ว่า...\"\n[s4] \"อืม... ถ้าเข้าไปในบ้านของอีกฝ่ายตั้งแต่เดตแรกคงดูไม่ดีเท่าไรนะ...\""
201040-22 = "คิดไปถึงไหนกันแน่คะเนี่ย!"
201040-23 = "เรื่องที่ฉันอยากจะขอให้คุณครูช่วยตรวจสอบน่ะ... เป็นเรื่อง <คทาแห่งชาเคด> ที่คายะพูดถึงต่างหากค่ะ"
201040-24 = "ถึงในสายตาของคายะมันจะเป็นแค่นาฬิกาธรรมดา แต่คุณครูอาจมองเห็นถึงคุณค่าแท้จริงของมัน#nเหมือนกับ <กล่องแห่งซิสดิม> ก็ได้ค่ะ"
201040-25 = "หากวัตถุชิ้นนั้นเป็นวัตถุหลงยุคที่ประธานองค์การนักเรียนทิ้งไว้จริงๆ มันอาจช่วยทำให้ความวุ่นวาย#nในคิโวทอสกลับสู่สภาวะปกติได้ในหลายๆ ด้าน..."
201040-26 = "หรือไม่ก็อาจกลายเป็นเบาะแสสำหรับตามหาตัวประธานองค์การนักเรียนที่หายตัวไป..."
201040-27 = "ดังนั้นรีบตรวจสอบได้เร็วเท่าไรก็ยิ่งดีค่ะ"
201040-28 = "[s5] \"ไม่เห็นต้องรีบขนาดนั้นก็ได้นี่นา\"\n[s6] \"ตอนนี้ยังมีเรื่องที่สำคัญกว่านั้นอยู่นะ\""
201040-31 = "มีเรื่องอะไรที่สำคัญกว่าการตามหาประธานองค์การนักเรียนอีกเหรอคะ..."
201040-32 = "[s] \"ก็วันหยุดของรินไงล่ะ\""
201040-33 = ""
201040-35 = ""
201040-36 = "[ns7] \"ครูบอกแล้วไงว่าวันนี้เป็นวันหยุดน่ะ\"\n[ns8] \"วันนี้วันหยุด เพราะงั้นวันนี้ห้ามทำอะไรที่เกี่ยวกับงาน\""
201040-39 = "เข้าใจแล้วค่ะ..."
201040-40 = "วันนี้คุณครูเองก็คงจะเหนื่อยมากแล้ว ถ้างั้นรีบกลับไปพักผ่อนเถอะค่ะ"
201040-41 = "ถ้างั้นฉันขอตัวก่อนนะคะ"
201040-42 = ""
201040-44 = ""
201040-46 = "คลังเก็บของห้องทำงานประธานองค์การนักเรียน"
201040-49 = ""
201040-50 = "นี่คือ..."
201040-51 = ""
201040-53 = ""
201040-55 = "หีบแห่งพันธสัญญาที่เก็บ <คทาแห่งชาเคด> ที่คายะพูดถึง"
201040-56 = "ตัวหีบแห่งพันธสัญญาดูไม่มีปัญหาอะไรเป็นพิเศษ... แต่ตอนนี้มันถูกล็อกอยู่เลยเปิดไม่ได้"
201040-57 = "สัญลักษณ์นี้...?"
201040-58 = "ไม่ใช่สัญลักษณ์ขององค์การนักเรียนแน่ๆ... ทำไมถึงมีสัญลักษณ์ที่ไม่เคยเห็นมาก่อนประทับอยู่#nบนของที่ประธานองค์การนักเรียนทิ้งไว้ได้ล่ะ"
201040-59 = "นอกจากนั้น ข้อความที่เขียนอยู่ด้านล่างนี่ก็..."
201040-61 = "บุคคลผู้นี้คือผู้ที่นำพาพวกเจ้าออกมาจากสรวงสวรรค์..."
201040-63 = "อนุมัติการเชื่อมต่อ ผู้มีสิทธิ์เข้าถึงคือรักษาการประธานองค์การนักเรียนคนปัจจุบัน หัวหน้าฝ่ายบริหาร นานากามิ ริน"
201040-64 = "ผลการวิเคราะห์เปรียบเทียบน้ำเสียงตรงกับผู้มีสิทธิ์เข้าถึง 99 เปอร์เซ็นต์"
201040-65 = "ยืนยัน ปลดผนึกหีบแห่งพันธสัญญา"
201040-66 = ""
201040-70 = "เปิดได้ง่ายกว่าที่คิดอีกนะคะ"
201040-71 = "ถ้าอย่างนั้น นาฬิกาเรือนนี้ก็คงจะเป็น <คทาแห่งชาเคด>... "
201040-72 = ""
201040-74 = ""
201040-75 = "แต่ในสายตาของฉัน... มันก็ดูเหมือนนาฬิกาธรรมดาๆ เหมือนกัน"
201040-76 = "คงไม่มีทางเลือกอื่น นอกจากขอความช่วยเหลือจากคุณครูของชาเล่ต์แล้วละ"
201040-79 = ""
201040-80 = "นอกจาก <กล่องแห่งชิสดิม> แล้ว ท่านประธานนำสิ่งของแปลกประหลาดพวกนี้มาใช้ เพื่อจุดประสงค์ใดกันแน่"
201040-81 = "ฉันรู้อยู่แล้วว่าคนที่ควบคุมโลกใบนี้ได้อย่างสมบูรณ์แบบคงมีเพียงยอดคนอย่างเธอคนนั้น"
201040-82 = "ถ้าไม่ใช่ผู้ใหญ่อย่างคุณครู ไม่ว่าใครก็ไม่มีสิทธิ์เข้าถึงเศษเสี้ยวที่คุณหลงเหลือไว้เลยงั้นเหรอคะ"
201040-83 = "ประธาน..."
201040-84 = "ในโลกที่ไม่มีคุณ ฉันไม่มั่นใจเลยว่าจะทำหน้าที่แทนคุณได้ดี"
201040-85 = "ถ้าบังเอิญได้ยินเสียงของฉัน... ถึงจะเป็นคำโกหกก็ไม่เป็นไร... "
201040-86 = "ช่วยพูดว่าทุกอย่างจะไม่เป็นไร... ได้รึเปล่าคะ"
201040-87 = "ฉันน่ะ..."
201040-88 = ""
201040-94 = ""
201040-95 = "...รินจัง"
201040-96 = "รินจัง ถ้าสักวันหนึ่งฉันหายไป เธอจะทำยังไงเหรอ?"
201040-97 = "หากวางแผนจะลาพักยาว กรุณายื่นคำขอล่วงหน้าอย่างน้อยสองสัปดาห์นะคะ"
201040-98 = "ไม่ใช่อย่างนั้นสักหน่อย! ฉันหมายถึง สมมุติว่าเกิดเรื่องแบบนั้นขึ้นต่างหาก!"
201040-99 = "สมมุติว่าจู่ๆ ฉันเกิดบาดเจ็บหรือป่วยจนมาทำงานขององค์การนักเรียนไม่ได้แล้ว..."
201040-100 = "หรือเกิดอุบัติเหตุใหญ่ขึ้นกะทันหันจนฉันหายตัวไป รินจะรู้สึกยังไงเหรอ?"
201040-101 = "ถึงจะเป็นเรื่องที่ยากเกินจะจินตนาการได้ แต่ถ้าเกิดเรื่องแบบนั้นขึ้นจริง..."
201040-102 = "ก็คงลำบากนิดหน่อยค่ะ..."
201040-103 = "เพราะถ้าท่านประธานหายตัวไปกะทันหัน งานที่ฉันรับผิดชอบคงเพิ่มขึ้นเป็นสองเท่าจากตอนนี้ค่ะ"
201040-104 = "ใจร้ายจัง! สถานการณ์แบบนี้ยังคิดถึงเรื่องงานอีกเหรอ?!"
201040-105 = "แน่นอนสิคะ ถ้าพิจารณาปริมาณงานและความสำคัญของงานที่ประธานรับผิดชอบอยู่ตอนนี้..."
201040-106 = "ไม่ว่าใครจะมารับช่วงต่อ ก็คงไม่สามารถทำหน้าที่แทนได้อย่างสมบูรณ์หรอกค่ะ"
201040-107 = "ไม่จริงหรอก... ถ้าพยายามเต็มที่ไปเรื่อยๆ ใครๆ ก็สามารถทำตามเป้าหมายที่ต้องการได้นะ"
201040-108 = "บทบาทของฉันเองก็ไม่ได้สำคัญขนาดนั้นหรอก"
201040-109 = "แต่มีอยู่เรื่องหนึ่งที่ต่อให้เก่งกาจแค่ไหนก็ไม่มีใครทดแทนได้"
201040-110 = "นั่นก็คือ..."
201040-113 = "ริน..."
201040-114 = "ริน... ตื่นได้แล้ว"
201040-115 = "หัวหน้าฝ่ายบริหาร นานากามิ ริน!!"
201040-116 = "......"
201040-117 = "เสียงนี้มัน..."
201040-118 = ""
201040-119 = "อรุณสวัสดิ์ค่ะ ริน..."
201040-120 = "เมื่อวานคุณเผลอหลับไประหว่างทำงานที่นี่รึเปล่าคะ?"
201040-121 = "ความกระตือรือร้นเป็นสิ่งที่ดีนะคะ แต่ฉันเตือนคุณหลายครั้งแล้วนะว่าถ้าหักโหมเกินไปจนทำให้#nเสียสุขภาพก็เท่ากับว่าให้ความสำคัญผิดเรื่องน่ะ"
201040-122 = ""
201040-124 = ""
201040-126 = "คุณ..."
201040-127 = "...เป็นใครกันคะ?"
201040-128 = "ฉันไม่เคยเห็นคุณในองค์การนักเรียนเลย... แล้วคุณเข้ามาที่นี่ได้ยังไงคะ?"
201040-129 = "คิดไม่ถึงเลยว่าแค่ช่วงสั้นๆ ก็ลืมหน้าฉันไปซะแล้ว ชักรู้สึกน้อยใจอยู่หน่อยเหมือนกันนะคะ"
201040-130 = "หรือว่ายังตื่นไม่เต็มตากันคะ...?"
201040-132 = "เอาละ ถึงจะดูเป็นทางการไปสักหน่อย ฉันขอแนะนำตัวอีกครั้งแล้วกันนะคะ"
201040-133 = "ฉันคือเพื่อนเก่าแก่ของคุณและ..."
201040-134 = "หัวหน้าขององค์การนักเรียน ผู้รับผิดชอบการบริหารคิโวทอส เมืองแห่งการศึกษานี้"
201040-135 = "ประธานองค์การนักเรียนค่ะ"
201040-137 = "ตอนต่อไป;ข้อผิดพลาดของความทรงจำ"
