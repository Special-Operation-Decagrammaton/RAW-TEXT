[translation]
201040-1 = "第4話;天藍色的思念"
201040-2 = "（與香耶的會面結束後，將琳送到了聯邦學生會的大樓）"
201040-3 = ""
201040-6 = ""
201040-7 = "……我應該說過沒有必要送我回來的。"
201040-8 = "不需要為了我在這麼晚的時間還特地──"
201040-9 = "[s1] 「不用在意。這是我自己想做的事。」\n[s2] 「而且這麼晚一個人在外面很危險的哦？」"
201040-12 = "就算我再怎麼擅長行政工作，好歹也是聯邦學生會的幹部。#n一般的小混混，我還是可以輕鬆應對的。"
201040-13 = "反而是[USERNAME]老師您更危險吧……"
201040-14 = ""
201040-16 = ""
201040-17 = "……現在才說這些也為時已晚了呢。"
201040-18 = "難得來到聯邦學生會，要不要進去稍坐一下？"
201040-19 = "[s3] 「唔嗯……雖然我明白琳的意思……」\n[s4] 「第一次約會就到對方家裡拜訪，果然還是有點……」"
201040-22 = "您到底在想什麼啊！"
201040-23 = "我只是想請老師確認一下……剛才香耶提到的「沙克德之杖」而已。"
201040-24 = "即便那對香耶而言只是一支普通的手錶……#n不過就像「希迪姆的箱子」一樣，或許老師您能夠發現它的真正價值也說不定。"
201040-25 = "如果那真的是聯邦學生會長留下的歐帕茲，也許會有助於導正奇普托斯的混亂……"
201040-26 = "……甚至還有可能成為尋找聯邦學生會長下落的線索。"
201040-27 = "調查這種事，自然是越早著手越好。"
201040-28 = "[s5] 「沒必要那麼急吧？」\n[s6] 「因為現在還有更重要的事。」"
201040-31 = "有什麼事會比尋找聯邦學生會長的下落更重──"
201040-32 = "[s] 「琳的假期。」"
201040-33 = ""
201040-35 = ""
201040-36 = "[ns7] 「不是說好了今天休假嗎？」\n[ns8] 「所以今天不能做和工作有關的事情。」"
201040-39 = "……我明白了。"
201040-40 = "今天老師想必也很累了，請先回去休息吧。"
201040-41 = "那麼，我就先告辭了。"
201040-42 = ""
201040-44 = ""
201040-46 = "聯邦學生會長辦公室倉庫"
201040-49 = ""
201040-50 = "這就是……"
201040-51 = ""
201040-53 = ""
201040-55 = "香耶所說的，保管「沙克德之杖」的聖櫃。"
201040-56 = "聖櫃本身看起來沒什麼問題……不過現在被鎖住無法開啟呢。"
201040-57 = "這個紋樣是……？"
201040-58 = "明顯不是聯邦學生會的紋樣……#n為什麼聯邦學生會長留下的物品上，會畫著我從未見過的紋樣呢……"
201040-59 = "而且下方寫的這些文字……"
201040-61 = "……此人乃引領爾等離開天國之人。"
201040-63 = "連線密碼已認證。#n存取權限持有者為現任聯邦學生會長代理，七神琳首席行政官。"
201040-64 = "對照結果……與權限持有者之聲紋99%一致。"
201040-65 = "……確認完畢。#n解除聖櫃的封印。"
201040-66 = ""
201040-70 = "……沒想到這麼輕易就打開了呢。"
201040-71 = "也就是說，這支手錶就是「沙克德之杖」……"
201040-72 = ""
201040-74 = ""
201040-75 = "……在我看來也只是一支普通的手錶呢。"
201040-76 = "果然還是只能尋求老師的幫助了。"
201040-79 = ""
201040-80 = "包括「希迪姆的箱子」在內，會長當初究竟想用這些奇特的物品做什麼呢？"
201040-81 = "雖然早已明白，只有像您這樣的超人才能完美地掌控這個世界……"
201040-82 = "但是如果不是像老師這樣的大人……就連接觸您所留下的零星痕跡都不被允許嗎？"
201040-83 = "……會長。"
201040-84 = "在這個沒有您的世界，我沒有自信能夠扮演好會長的角色。"
201040-85 = "如果您能聽見我的聲音……就算只是謊言也好……"
201040-86 = "請至少對我說一句「沒關係」吧。"
201040-87 = "我……"
201040-88 = ""
201040-94 = ""
201040-95 = "……琳醬。"
201040-96 = "如果我消失的話，琳醬打算怎麼辦呢？"
201040-97 = "打算申請長期休假的話，請提前兩週提出申請。"
201040-98 = "不是那個意思！我是說如果啦！"
201040-99 = "假如我突然受傷或生病，沒辦法來聯邦學生會……"
201040-100 = "或者突然發生重大事故消失不見的話……琳會怎麼辦呢？"
201040-101 = "雖然難以想像，但假如真的發生那種事的話……"
201040-102 = "……會有點傷腦筋呢。"
201040-103 = "因為會長要是突然消失，我所要承擔的業務量恐怕會變成現在的兩倍。"
201040-104 = "太過分了！都這種時候了還要講工作的事嗎！？"
201040-105 = "那是當然的。考慮到聯邦學生會長所承擔的業務規模與重要性……"
201040-106 = "無論是奇普托斯的任何人，都無法完美地取代那個角色。"
201040-107 = "……才沒有那回事。#n只要付出足夠的時間與努力，不管是誰都有機會成就任何事情。"
201040-108 = "我的角色本身其實並沒有那麼重要。"
201040-109 = "不過就算是再怎麼有能力的人，唯獨有一樣東西是無法被取代的。"
201040-110 = "那就是……"
201040-113 = "……琳。"
201040-114 = "……琳，請起來。"
201040-115 = "七神琳行政官！！"
201040-116 = "……"
201040-117 = "這個聲音是……"
201040-118 = ""
201040-119 = "……早安，琳。"
201040-120 = "昨天在這裡處理業務，不小心睡著了嗎？"
201040-121 = "認真努力固然是件好事沒錯，不過要是勉強到弄壞身體可就本末倒置了哦？#n這點我應該再三提醒過你了吧？"
201040-122 = ""
201040-124 = ""
201040-126 = "你是……"
201040-127 = "……哪位？"
201040-128 = "我沒有在聯邦學生會見過你……你是怎麼進來的？"
201040-129 = "才一段時間不見就把我的臉給忘了，就算是我也會有點難過呢。"
201040-130 = "……還是說，你還沒完全睡醒呢？"
201040-132 = "那麼雖然有點多此一舉，我就再自我介紹一次吧。"
201040-133 = "我是你多年的摯友……"
201040-134 = "也是管理這座學園都市──奇普托斯的聯邦學生會之首。"
201040-135 = "聯邦學生會長。"
201040-137 = "下一話;記憶的謬誤"
