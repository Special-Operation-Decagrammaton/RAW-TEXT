201040-96 = "Rinny! What would you do if I just disappeared one day?"
201040-97 = "If you're planning on a long vacation, please submit the request at least two weeks in advance."
201040-98 = "No, no! I meant hypothetically!"
201040-99 = "What if I got injured, or really sick, and I couldn't make it to work..."
201040-100 = "Or what if there was a sudden incident and I disappeared. How would you feel, Rin?"
201040-101 = "It's a difficult hypothetical to indulge, but if that were to happen..."
201040-102 = "It'd be problematic, at best."
