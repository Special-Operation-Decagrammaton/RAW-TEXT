[translation]
10040040-1 = "제4화;사실대로 말을 하자면"
10040040-2 = "(……이후 코타마와 하레의 안내를 받으며 얼마나 이동했을까.)"
10040040-6 = "좋아, 선생님. 잠시만 거기서 정지."
10040040-7 = "그 끝까지 가서 오른쪽으로 꺾어 들어가면……."
10040040-8 = "……!! 잠깐만요."
10040040-13 = "뭔가 감지됩니다. 선생님 소리 외의 소리가 들려오고 있습니다."
10040040-17 = "[ns1] \"……! 반대쪽에서…….\"\n[ns2] \"사람 인기척이……!\""
10040040-20 = "40미터 이내. 현재 소리대로라면 6초 후 코너에서 나타납니다."
10040040-21 = "어딘가 몸을 숨길 곳이……!"
10040040-22 = "바로 옆문을 열면 조리실이야."
10040040-23 = "지금 바로 해킹해서 잠금장치를 풀 테니까, 열리면 바로 들어가. 선생님."
10040040-31 = "[ns3] \"고마워, 두 사람!\"\n[ns4] 서둘러 문을 열고 들어간다."
10040040-40 = "크아아악-!! 머리, 내 머리……!!"
10040040-41 = "[ns5] \"아야야야야…….\"\n[ns6] \"뭐, 뭐야. 이 엄청 단단한 건…….\""
10040040-48 = "……으엥!?"
10040040-49 = "선생님! 선생님이잖아요!? 선생님이 어째서 이런 곳에……!?"
10040040-50 = "후우……. 깜짝 놀랐네."
10040040-51 = "아~! 진짜! 선배들 중 한 명인 줄 알고 진짜 십 년 감수했잖아요!!"
10040040-52 = "[s7] \"나도 깜짝 놀랐다고!!\"\n[s8] \"이런 데에 숨어 있었구나.\""
10040040-55 = "그렇죠. 일단 선배들을 완전히 따돌린 다음에야 탈출이든 뭐든 시도할 수 있으니까요."
10040040-56 = "잠깐 도망친다고……. 끝나는 게 아니거든요, 이 건물은."
10040040-57 = "……네?"
10040040-58 = "……아아, 이 옷이요? 네. 유우카 선배가 저 입으라고 가지고 온 파자마라고 하던데요."
10040040-59 = "[s9] \"그건 또 제대로 갈아입었구나.\"\n[s10] \"정말 챙길 건 야무지게 챙기는구나.\""
10040040-62 = "……? 왜요?"
10040040-63 = "그게 무슨 상관이죠? 도망친 건 도망친 거고……. 준 걸 거절할 필요는 없지 않나요?"
10040040-64 = "여기에 무슨 문제라도……?"
10040040-65 = "……없다고요? 하하! 싱거우시긴."
10040040-66 = "음……. 그나저나, 큰일이네요. 일단 한 번은 따돌렸지만, 이제부터가 문제인데……."
10040040-67 = "여기 뭐가 더 있냐고요? ……아아. 하긴 선생님께서는 처음이시죠, 세미나 탈출."
10040040-68 = "진짜 보통이 아니거든요! 감시카메라는 물론이고 전자 자물쇠, 경비 드론, 자동 방벽……. 계속 늘어놓자면 끝도 없어요!"
10040040-69 = "……네?"
10040040-70 = "어째서 그렇게 잘 알고 있냐고요? 그야 저도 일단은 세미나의 일원이기도 하고……."
10040040-74 = "세상에서 누구보다 많이, 그 모든 것들을 상대해 본 사람이기도 하니까 말이죠. 후후후."
10040040-75 = "[s11] \"그렇게 자랑스레 말할 일인가…….\"\n[s12] \"공교롭게도 지금은 도움이 되네.\""
10040040-78 = "아무튼 탈출 초보인 선생님께서는 운이 좋으신 겁니다! 다른 누구도 아닌, 베테랑 중의 베테랑 이 쿠로사키 코유키와 함께시니까요!"
10040040-79 = "이제부터 저만 딱 믿으시죠! 오직 저만이, 이 미로 같은 건물 안에서 수십 번이나 선배들을 따돌린……."
10040040-83 = "……응……? 발소리……?"
10040040-84 = "히, 히익……! 조용히 숙이죠!!"
10040040-85 = "여기 문에는 유리가 달려서……. 이렇게 대놓고 서 있으면 밖에서도 보이니까요!"
10040040-86 = "……자요, 이쪽으로……!"
10040040-92 = "……정말이지, 어디로 간 거야? 이 녀석은!"
10040040-93 = "후후. 이런 곳에서 뜻밖의 숨바꼭질이라니, 재미있는 연말이네요."
10040040-94 = "노아! 그런 식으로 귀엽게 봐줄 일이 아니라니까! 정말이지……."
10040040-95 = "안 되겠어. 흩어져서 찾아보자. 노아는 저 끝 방부터, 나는 이쪽 조리실부터 찾아볼게."
10040040-97 = "아니, 여길 들어온다고요……? 왜, 왜……? 굳이……?"
10040040-99 = "조리실이요? 그렇지만 여긴 잠겨 있는데요?"
10040040-100 = "노아도 코유키가 어떤 앤지 알잖아. 이런 잠금장치, 저 녀석에겐 하등 의미가 없다고."
10040040-101 = "후후. 그것도 그러네요."
10040040-104 = "[ns13] \"과연 유우카. 예리하네…….\"\n[ns14] \"저쪽도 한두 번 상대한 솜씨가 아니네.\""
10040040-107 = "아니 뭘 감탄하고 그래요! 지금 그럴 때냐고요……!"
10040040-108 = "꼼꼼하게 체크해서 나쁠 거 없다고. 아무튼 그쪽부터 부탁해! 나도 금방 갈 테니까!"
10040040-109 = "후후. 힘내요, 유우카 쨩~."
10040040-114 = "후우…… 그럼 나도 이제……."
10040040-121 = "히익……!!"
10040040-122 = "[ns15] 사각지대로 피신한다.\n[ns16] (일단 자리를 좀 옮겨야겠어……!)"
10040040-129 = "흐음……."
10040040-130 = "아무도 없나? 뭔가 찝찝한 느낌이 있어서 들어와 본 건데."
10040040-135 = "……!"
10040040-136 = "[ns17] (아뿔싸……! 숨다가 부딪쳐서…….)\n[ns18] (걸어 놨던 국자가 떨어졌다……!!)"
10040040-139 = "거, 거기 누구야……? 코유키? 역시 코유키지!?"
10040040-140 = "역시 숨어있을 줄 알았어! 당장 나와! 거기 있는 거 다 알아……!!"
10040040-145 = "코유키 이 녀석……!!!"
10040040-146 = "[ns19] 침을 삼키며 변명거릴 구상한다.\n[ns20] (이렇게 끝나는가……!)"
10040040-156 = "……? 응!?"
10040040-165 = "니하하하!! 바보 같은 선배, 여기지롱! 여기란 말입니다~!!!"
10040040-166 = "[ns] (……코유키……!!)"
10040040-168 = "……무, 무슨!? 언제 거기까지 간 거야……!?"
10040040-169 = "이 녀석……! 잡히면 가만 안 둘 줄 알아!!"
10040040-173 = "니하하하하!! 잡아보시죠!!"
10040040-174 = "이쪽이에욧~~~!!!"
10040040-183 = "거기 서라고~!!"
10040040-192 = "[ns21] \"……기억할게.\"\n[ns22] \"……고맙다. 잊지 않으마.\""
10040040-197 = "……장렬한 희생이었습니다."
10040040-198 = "이 모든 일이 끝나고 나서, 기회가 된다면 그녀를 위한 추모의 사이트를 만들도록 하죠."
10040040-199 = "죽은 것도 아닌데 죽은 것처럼 표현하지 마."
10040040-200 = "맞아요, 하아……. 하아……."
10040040-201 = "죽기는 누가 죽었다고……. 니하하……. 하아, 하아……."
10040040-206 = "[ns23] \"코유키!?\"\n[ns24] \"붙잡힌 게 아니었어……!?\""
10040040-209 = "무슨 그런……. 섭섭한 말씀을……. 니하하……."
10040040-210 = "말씀드렸죠? 세상 누구보다 이곳을 탈출하는 것에 대해선 베테랑 중의 베테랑이라고! 니하하!"
10040040-211 = "후우, 후우……. 하아……. 이제야 좀 살겠네요."
10040040-212 = "그나저나 도와주시는 분들이 계셨군요. 역시 선생님!"
10040040-213 = "이게 늘 선생님께서 말씀하시는 '평소의 행실'이라는 걸까요?"
10040040-214 = "조금 다른 의미일 것 같긴 한데……."
10040040-215 = "뭐, 애초에 나갈 수 있는 최적의 루트를 이쪽에서도 파악한 대로 움직이는 거니,"
10040040-216 = "결과적으로 탈출 경험이 많은 당신과 동선이 겹치는 게 자연스럽겠지요. 쿠로사키 코유키 양."
10040040-218 = "어쨌거나 지금은 다 같이 동료라는 거군요! 여기를 무사히 탈출하기 위한 동맹관계! 니하하하!!"
10040040-220 = "……분위기가 어딘지 마키 같아."
10040040-221 = "저도 약간 그렇게 생각했습니다. 그러고 보니 조만간 도착할 시간이 되겠군요, 마키도."
10040040-223 = "……네? 마키 이야기는 또 무슨 이야기냐고요?"
10040040-224 = "별일은 아니고, 만일을 대비해 그쪽으로 출발한 것뿐이야."
10040040-225 = "해당 건물은 경비 시스템이 철저한 편이라, 상황이 여의치 않으면 1층의 문이나 창문을 파괴하고 선생님을 빼내 갈 생각이었거든."
10040040-226 = "[s25] \"꼭 그렇게까지 해야 해……?\"\n[s26] \"부수는 건 절대 안 돼. 논외야.\""
10040040-230 = "왜요? 좋은 거 아닌가요!?"
10040040-231 = "괜찮아요, 괜찮아! 어차피 세미나는 돈 많으니까, 그 정도는……."
10040040-236 = "……으음. 굉장하네."
10040040-237 = "유우카의 고충에 대해서는 늘 듣고 있었습니다만, 이건 조금 규격 외라는 판단이군요."
10040040-238 = "마키 같다고 한 건……. 나중에 따로 사과해야겠어."
10040040-240 = "갑자기 태도 돌변!?!?"
10040040-241 = "그야 마키는 최소한……."
10040040-242 = "……응? 선생님, 뭐라고?"
10040040-243 = "점점 일이 커지는 것 같아서 마음이 쓰여……?"
10040040-244 = "선생님은 그냥 사실대로 이야기하고, 사과한 뒤에 그만두는 게 어떠냐고……?"
10040040-245 = "에에에엑-!! 뭐예요!? 그런 게 어디 있어요!! 여기까지 와서 저를 배신하시는 건가요!?"
10040040-246 = "안 돼요, 당연히 안 되죠! 선생님은 저랑 같이 여길 나가셔야 한다고요!! 죄를 분담해야죠!!"
10040040-247 = "엄청난 말을 당당하게……."
10040040-248 = "[ns27] \"코유키에 대해서도 잘 말해 줄 테니까.\"\n[ns28] \"사실대로 말해주면, 두 사람도 이해해 줄 거야.\""
10040040-251 = "그, 그런……!"
10040040-252 = "……음. ……하지만 선생님."
10040040-253 = "방금 이야기는 다소 납득하기 어렵습니다. 사실대로 어떻게 말씀하시겠다는 거죠?"
10040040-254 = "그러니까 선생님 말씀은……."
10040040-258 = "\"다 큰 어른이 해야 할 일도 내팽개치고 야밤에 반성실에 숨어 들어와서,"
10040040-259 = "학생과 밤새 놀려다 걸릴 뻔한 걸 피하려 이불장 속에 숨었고,"
10040040-260 = "이후 파자마 차림의 다른 학생들이 와서 노는 것을 이불장 안에서 구경한 뒤에,"
10040040-261 = "탈출을 시도했지만 그 과정에서 잘 안될 것 같으니 자수하고 실토하겠다.\""
10040040-262 = "……뭐……."
10040040-263 = "……그런 말씀이신가요?"
10040040-269 = "[ns29] \"……나가는 방향이 어디라고?\"\n[ns30] \"절대 탈출해야 해!!!\""
10040040-272 = "니하하하!! 역시 그렇게 나오셔야……!"
10040040-284 = "이 소리는……!?"
10040040-285 = "경비 드론들이네요. 평소와 달리 잠들어 있던 것들까지 모두 풀어버린 모양입니다!"
10040040-287 = "유우카. 화가 많이 났구나……."
10040040-288 = "아까 코유키 양이 놀린 게 컸던 거 같네요."
10040040-290 = "이러고 있을 시간이 없어요! 한시라도 빨리 1층으로 향해야 한다고요!!"
10040040-292 = "맞는 말이야. 마음 같아서는 오히려 드론들도 모두 해킹해서 선생님을 도와주고 싶지만, 그러지는 않기로 했으니까."
10040040-293 = "저희는 어디까지나 신속하고 안전한 경로에 대한 안내, 그리고 CCTV 마비 쪽만 신경 쓰도록 하겠습니다."
10040040-294 = "드론들과의 싸움은……."
10040040-296 = "니.하.하.하.하!! 여기선 베테랑 중의 베테랑, 이 쿠로사키 코유키에게 맡겨 주시죠, 선생님!"
10040040-297 = "선생님의 지휘만 있다면, 이 정도는 전부 다 때려 부술 수……."
10040040-298 = "……네? 그러면 안 된다고요?"
10040040-299 = "드론을 부수지 마……? 또 그런 말씀을……."
10040040-300 = "그렇지만 여기를 탈출해야 하는데요……?"
10040040-301 = "[s31] \"드론도 창문도 세미나의 자산이야. 부수는 건 안 돼.\"\n[s32] \"기기를 부수지 않는 선에서 제압할 방법을 찾자.\""
10040040-304 = "으음……? 그런 게 되나요……?"
10040040-305 = "가능하긴 해. 해킹은 아니어도, 제압한 뒤 수동으로 전원만 내리면 되니까."
10040040-306 = "그러네. 마침 우리도 있으니까, 그 부분은 지원할게."
10040040-307 = "모처럼 세미나의 경비 시스템을 약화시킬 수 있는 기회라 생각했는데, 조금은 아쉽군요."
10040040-308 = "그러게요……. 에휴……. 다 없애 버려야 되는데……."
10040040-313 = "……그……. 세미나 소속, 맞죠?"
10040040-314 = "뭐, 지금 입장은 우리랑 비슷할 테니까……."
10040040-316 = "아무튼 그렇게 결정 났으면 머뭇거릴 틈이 없겠죠! 바로 갑니다-!!!"
10040040-317 = "CHARGE-!!!"
