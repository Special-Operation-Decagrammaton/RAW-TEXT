[translation]
2003405-1 = "행운을 이루기 위해"
2003405-2 = "해넘이 우동이라는 것이 있대요!"
2003405-3 = "[s] \"응? 해넘이 국수를 잘못 말한 거 아냐?\""
2003405-4 = "아뇨. 해넘이 우동이 맞아요."
2003405-5 = "수많은 '해넘이 우동' 중에서도, 그 우동은 각별하다고 소문난 것 같더라구요?"
2003405-6 = "인터넷에는 바이럴 광고가 많으니 조심해야 한다고요? 후후. 물론 그 말씀은 맞지만……."
2003405-7 = "저는 리뷰 10개의 5.0 별점보다, 리뷰 500개의 4.0 별점을 더 믿는 편이거든요."
2003405-8 = "그리고 그 해넘이 우동의 별점은…… 4.3에 리뷰 872개였고요."
2003405-9 = "[s] \"그렇다면 확실히……!\""
2003405-10 = "아, 그사이에 리뷰가 더 올라왔네요."
2003405-11 = "'보통의 우동면보다 조금 더 두껍고 탱탱하면서도, 매끄럽기까지 한 면.'"
2003405-12 = "'가장 단순하면서도 기본에 충실한 맛.'"
2003405-13 = "'국물은 조금 슴슴해서 아쉽지만, 고명은 푸짐하다.'"
2003405-14 = "'새해의 복을 기원하려는 의미일까……. 분홍색 어묵과 새우튀김이라는 구성. 튀김의 질도 만족스러웠다.'"
2003405-15 = "[s1] \"평판이 좋은 것 같네.\"\n[s2] \"어디에서 파는데?\""
2003405-18 = "그게, 여기에서 좀 먼 곳에 있는 휴게소라고 하네요."
2003405-19 = "차로 이동해도 두 시간 정도는 걸릴 만한 거리인데……."
2003405-20 = "조금 외진 곳에 있기 때문인지, 직통 철도도 아직 연결되어 있지 않은 모양이에요."
2003405-21 = "[s] \"그렇다면 큰일이네. 어떻게 가지?\""
2003405-22 = "후훗……."
2003405-27 = "그래서, 탈 것을 빌렸답니다!"
2003405-28 = "[s3] \"으, 으응?!\"\n[s4] \"이거…… '빌린'거, 맞지……?\""
2003405-31 = "네★ 물론 '빌린' 것이고 말고요."
2003405-32 = "용무가 끝나면 제대로 원래 자리에 돌려놓을 테니, 너무 걱정하지 마세요★"
2003405-33 = "[s] \"정말로 빌린 거 맞는 거지?!\""
2003405-37 = "도착했어요! 이 근처의 휴게소인 모양이네요."
2003405-38 = "으음~ 뭔가 한적하고 여유로워 보이는 곳이네요."
2003405-39 = "……조금, 자극이 모자라 보이는 느낌도 있지만요★"
2003405-40 = "[s] \"우, 우동! 우리 우동 먹자, 아카리!\""
2003405-41 = "네, 네. 물론이죠. 선생님. 애초에 그러기 위해 온 것이잖아요?"
2003405-42 = "어디 보자……. 인터넷 지도에 따르면……. 저쪽이네요."
2003405-44 = "해넘이 우동 두 그릇 나왔습니다."
2003405-45 = "그럼 잘 먹겠습니다."
2003405-46 = "[s] \"잘 먹겠습니다~\""
2003405-51 = "으음……."
2003405-52 = "……."
2003405-56 = "맛있네요!"
2003405-57 = "[s] \"확실히…… 지금까지 먹은 우동과도, 조금 더 다른 맛이네!\""
2003405-58 = "우선 차가운 면에 따듯한 국물을 부어, 바로 먹게 해 준 부분이 포인트네요."
2003405-59 = "면을 차가운 상태로 유지했기 때문에 쫄깃함이 그대로 살아 있기도 하고요."
2003405-60 = "분명히 면의 굵기가 보통의 우동보다 굵어서, 탄력을 유지한 채 삶아 내기가 조금 어려웠을 텐데."
2003405-61 = "그걸 보란 듯이 성공해 낸 점에서, 이 가게의 내공이 느껴진다고 할까요?"
2003405-62 = "어묵도 새우튀김도 잘 만들어져 있고, 심심한 국물이 오히려 고명과 면의 맛을 한층 더 살려주는 것 같네요."
2003405-63 = "[s] \"와, 지금의 아카리는 조금, 평소와 다른 사람 같았어!\""
2003405-64 = "후후. 저도 일단은 미식연구회의 일원이랍니다. 선생님?"
2003405-65 = "물론 많이 먹을 수 있는, 양이 충분한 것을 선호하기는 하지만……."
2003405-66 = "저 역시 '미식'이라는 개념을 모르는 것은 아니니까요."
2003405-67 = "물론…… 넘버 원이 된다는 것은 그렇게 쉬운 일이 아니겠지만요."
2003405-68 = "[s] \"아카리는 지금 이대로도 좋지 않을까?\""
2003405-69 = "후후. 그렇게 말씀해 주시니 감사하네요."
2003405-75 = "하지만 역시……."
2003405-76 = "……양이 부족하게 느껴지는 건, 어쩔 수 없나 봐요."
2003405-77 = "[s] \"……응. 그럴 것 같더라.\""
2003405-78 = "두 분도 우동 투어를 하러 오셨나요?"
2003405-79 = "우동 투어라니, 그건 무슨 뜻인가요?"
2003405-80 = "사실 이 지역은 우동으로 유명한 곳이어서…… 이 지역 전체 여기저기에 수많은 우동 가게들이 영업을 하고 있답니다."
2003405-81 = "듣기로는 편의점보다 우동 가게가 더 많다고 할 정도니까요."
2003405-82 = "……!"
2003405-83 = "그래서 이 지역에서도 특별히 유명하거나, 숨겨져 있는 우동 맛집들을 순회하는 것이……."
2003405-84 = "우동 투어라는 것이로군요!"
2003405-85 = "그, 그렇습니다. 지역 관광 홈페이지를 참고해 보시면, 여러 우동 맛집들이 소개되어 있기도 하고요."
2003405-86 = "그런 멋진 관광 프로그램이 있었다니★"
2003405-87 = "선생님. 들으셨죠?"
2003405-88 = "[s5] \"……응. 들었어.\"\n[s6] \"그리고 이다음에 뭘 하자고 할지도 알 것 같아…….\""
2003405-91 = "우리, 어서 우동 투어를 시작해 봐요!"
2003405-92 = "[s] \"그래, 그래…….\""
2003405-94 = "(그렇게, 아카리와 함께하는 우동 투어가 시작되었다.)"
2003405-100 = "(……몇 개의 우동집을 방문했는지, 도중부터는 세는 것을 포기했다…….)"
2003405-105 = "(심지어, 지역의 모든 유명 우동집을 제패하면 인증서를 준다는 홈페이지의 안내문에…….)"
2003405-106 = "(아카리는 한층 더 눈을 빛내며, 우동 투어에 몰입하는 것이었다……!)"
2003405-109 = "[ns] \"있잖아, 아카리…….\""
2003405-110 = "네? 왜 그러시나요, 선생님?"
2003405-111 = "아하. 꼭 이 지역의 모든 유명 우동집을 제패해야 하냐고요?"
2003405-112 = "……."
2003405-113 = "선생님. 그거 아세요? 해넘이 국수에는, 국수를 남기면 불운이 찾아온다는 속설이 있어요."
2003405-114 = "[s] \"그랬어?\""
2003405-115 = "네. 그래서 해넘이 국수를 먹을 때는, 적어도 면만이라도 깨끗이 먹는 것이 중요하다고 하죠."
2003405-116 = "마찬가지로…… 우리는 지금 해넘이 우동을 먹으러 온 것이잖아요?"
2003405-117 = "그러니, 우동을 남기게 된다면…… 다시 말해, 모든 우동을 제패하지 못한다면……!"
2003405-118 = "새해에 무언가 좋지 않은 일이 일어나고 마는 게 아닐까요★"
2003405-119 = "[s] \"그런 이유를 대고, 마음껏 우동을 먹고 싶은 것으로 보이는데!\""
2003405-120 = "설마요★ 절 어떻게 생각하시는 건가요★"
2003405-123 = "(아카리의 우동 투어는 그렇게…… 해가 질 때까지 계속되었다……)"
2003405-125 = "(그리고 우리는 마침내……!)"
2003405-127 = "해냈어요, 선생님! 우동 제패 인증서를 받았어요!"
2003405-128 = "[s7] \"정말로 해낼 줄은 몰랐어…….\"\n[s8] \"아니야, 오히려 짐작했어야 하는 일이었던 것 같아……!\""
2003405-131 = "그렇지만 어느새 이렇게 날이 저물어 버렸네요."
2003405-136 = "……어떻게 하시겠어요. 선생님?"
2003405-137 = "저…… 야간 운전에는 조금, 자신이 없는데요……?"
2003405-142 = "(결국 아카리와 함께, 근처의 소박한 호텔에서 하룻밤을 묵었다.)"
2003405-143 = "(우동을 소화하느라, 조금 힘들었다…….)"
