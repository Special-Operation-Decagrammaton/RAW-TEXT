[translation]
10009100-1 = "후일담;궁극의 오야코동?!"
10009100-4 = "내 일생 오야코동에 모든 것을 바쳤지만……"
10009100-5 = "한계에 부딪힌 느낌이군. 도저히 여기에서 더 새로운 맛을 이끌어낼 수 없어."
10009100-6 = "단순히 부드럽고 조화된, 몽글몽글한 맛만으로는 다가오는 세대에 뒤처질 뿐이겠지……"
10009100-7 = "조금 더 새롭고, 팟! 하고 튀는 맛이 필요한데……"
10009100-12 = "좋아. 오늘은 장사를 하루 쉬고, 맛에 대한 연구를 나서도록 하자."
10009100-19 = "이 초콜릿 바는…… 신선하군! 그야말로 내가 찾던 느낌이야!"
10009100-21 = "팝핑캔디라고 했던가? 이 혀 안에서 톡톡 터지는 맛과 식감……"
10009100-22 = "이 느낌을 내 오야코동에 조화롭게 섞어 넣을 수만 있다면, 그야말로 궁극의 맛이 탄생할 텐데!"
10009100-23 = "하지만…… 어떤 재료를, 그리고 또 어떻게 섞느냐가 문제로구나."
10009100-24 = "무언가 기발한 생각이 떠오르지 않으려나…… 너무 오래 오야코동만 생각해 온 탓인지, 머리가 굳어 버린 것 같아……"
10009100-29 = "적어도 요즘 학생들의 의견만이라도 물을 수 있다면……."
10009100-33 = "으응?"
10009100-34 = "거기 학생, 잠시 나 좀 도와줄 수 있겠나?"
10009100-35 = "한 가지만 묻고 싶어서 그러는데 말이지."
10009100-36 = "네? 제가 도움이 될 수 있다면 기쁜 일이겠습니다만, 무슨 일이신지요?"
10009100-39 = "번쩍하고 짜릿짜릿한 감각을 주는 것 말입니까?"
10009100-40 = "그래. 시대에 뒤처지지 않는 감각이 필요해! 그것만 해낼 수 있다면……!"
10009100-41 = "그렇군요. 뒤처지지 않는, 톡톡 튀는 느낌……"
10009100-42 = "뭔가 팍! 하고 신선한 감각을 줄 방법이 없을까?"
10009100-47 = "그렇다면…… 이 '섬광탄풍 조미료'는 어떻습니까?"
10009100-48 = "서, 섬광탄풍 조미료라고? 자네, 진심인가?!"
10009100-49 = "네. 입안에서 톡톡 튀는, 강렬한 빛을 내는 조미료입니다."
10009100-50 = "원하시는 이미지에 이보다 딱 들어맞는 것은 없을 거라고 생각합니다."
10009100-53 = "(표정의 변화조차도 없이 태연하게 말하고 있어……!)"
10009100-54 = "(그렇군. 이것이 젊음인가. 내가 모르는 사이에 세상은 이렇게까지 나아가고 있었나……)"
10009100-56 = "……정말로 써도 될까?"
10009100-57 = "물론이죠. 매우 안전하답니다."
10009100-58 = "섬광탄풍 조미료, 인가……"
10009100-62 = "정말이지 생각지도 못한 발상이군! 이것이야말로 시대의 흐름!"
10009100-63 = "알았네. 세대를 따라가기 위해서라면……!"
10009100-64 = "아뇨. 도움이 되셨다면 저야말로 기쁩니다."
10009100-65 = "그리고 이것도 받아 주십시오. 섬광탄입니다."
10009100-66 = "이것은 또 어째서……?"
10009100-67 = "최근 탈옥이니 난동이니, 어수선하니까요. 이 정도는 필요할 것이라고 생각합니다."
10009100-68 = "(가만, 이 섬광탄을, 섬광탄풍 조미료 오야코동에 세트 메뉴 느낌으로 추가한다면……?)"
10009100-69 = "(더더욱 참신한 레시피가 완성되는 것이 아닐까?!)"
10009100-70 = "다시 한번 고맙네, 고마워…… 이 은혜는 잊지 않겠네!"
10009100-71 = "은혜라고 말씀하실 것까지도 없는걸요. 부디, 몸조심하세요."
10009100-78 = "여보세요? 언제나처럼 오야코동 한 그릇 주문하려고 합니다."
10009100-83 = "알았네, 오야코동 한 그릇! 오늘부터 레시피를 리뉴얼했다네."
10009100-87 = "한번 먹으면 절대로 잊어버리지 못할 거야!"
