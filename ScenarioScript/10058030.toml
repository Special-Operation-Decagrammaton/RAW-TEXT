10058030-133 = "吸気系破損！作動しません！"
10058030-134 = "エンジンもかからない！！もう終わりだー！！"
10058030-135 = "ユズちゃん、大丈夫？"
10058030-136 = "だ、大丈夫だけど……潜望鏡が壊れちゃったから、見ながらがちょっと……！"
10058030-137 = "どうしよう！？"
10058030-138 = "アリス、昨日は楽しくて眠れなかったのでセーブしていません……！"
10058030-139 = "ユズちゃん、落ち着いて。私を見て。絶対できるから。"
10058030-140 = "でも、飛んでいくミサイルを見ながら狙わなきゃ……。"
10058030-141 = "先週、お姉ちゃんと#n『トップ・オブ・ファイターズ』#nをやった時のことを思い出して。"
10058030-142 = "お姉ちゃんに負けてあげるために、目のマッサージをしながらやったけど……#nそれでも全勝だったよね。"
10058030-143 = "あれはチートだったじゃん！！"
10058030-144 = "今度は、私たちがユズちゃんの目になるよ。"
