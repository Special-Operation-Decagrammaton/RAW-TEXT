10058030-120 = "キャンセル技があるのを忘れてた……。"
10058030-121 = "ユズ、今こそ格ゲーからシューティングにジャンル変更する時です！"
10058030-122 = "何でもいいから早くしてください！！！来ます！！！"
10058030-124 = "てめぇら、ぶっ飛ばすぞ！！"
10058030-125 = "レンズシステム、正常に稼働中。"
10058030-126 = "充電完了～！"
10058030-127 = "撃てぇ！！"
