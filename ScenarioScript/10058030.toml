[translation]
10058030-1 = "第3話;交戦規定？"
10058030-2 = "さあ始まりました、ゲヘナカップ！#n初っ端から、砲撃合戦の影響で#n全80チームのうち50チームがスタートできなかったみたいですね！"
10058030-3 = "改めまして、本日の解説は[ruby=もとみや]元宮[/ruby]チアキ、#n[ruby=たんが]丹花[/ruby]イブキ！そしてシャーレの先生でお送りします！"
10058030-4 = "[s] \"シャーレの先生です！\""
10058030-5 = "ババーン！っておっきな弾を撃つ戦車がいたよ！"
10058030-6 = "はいっ！イブキちゃんの言うとおり、本大会のダークホースである#nトリニティ総合学園の「救護騎士団チーム」が大活躍ですね！"
10058030-7 = "しかし重い装甲と巨大な砲塔が災いしてか、どんどん速度が落ちています！"
10058030-8 = "これはレースですから、強さだけではなくスピードも大事ですよ～！"
10058030-9 = "撃破数1位をとっても意味がありませんからね！現在の順位はビリです！"
10058030-10 = "[s] \"サーキットを外れてもいいの？\""
10058030-11 = "もちろんです！本大会で一番大事なルールは#n「全ての的を砲撃してスタートラインまで戻ってくる」ですから！"
10058030-12 = "つまり……サーキットを外れても、どの的から砲撃してもオッケーってことです！"
10058030-13 = "それどころか、他の戦車を破壊しても問題ありません！"
10058030-14 = "わあ～！ゲヘナっぽくって楽しいね！"
10058030-15 = "ではここで歴代の大会記録をご紹介します！"
10058030-16 = "大会終了の最短記録は53秒！#n戦車が全てスタートラインで破壊されたので優勝者は出ませんでした！"
10058030-17 = "一方、最長記録は455日と8時間！#n優勝が決まる頃には、中継の視聴率は0%でした！"
10058030-18 = "あれ？そういえば、マコト先輩は大会に出ないの？"
10058030-19 = "マコト先輩は免許の筆記試験に落ちちゃったから出られないんです！"
10058030-20 = "めんきょの試験って、そんなに難しいの？"
10058030-21 = "難しさの問題じゃなかったみたいですよ？#nマコト先輩、「ゲヘナは常に前進する！」とか言って、#nマークシートを無視して文章で回答してたようですし、そのせいですかね。"
10058030-22 = "そうなんだ……。次は受かるといいね！"
10058030-23 = "さすが、イブキちゃんはやさしいですね！#n様々な試験を控えているみなさんが、良い結果を出せるように祈っています！"
10058030-24 = "では中継カメラに戻ります！#nミレニアムサイエンススクールの「C&Cチーム」を見てみましょう！"
10058030-25 = "チャンネルは、そのままだよ！"
10058030-32 = ""
10058030-33 = "目標に命中。マニホールド異常なし。"
10058030-34 = "プリズムセンサー、安定稼働中。充電完了。"
10058030-35 = "すご～い！この戦車、光がババーンって出るよ！"
10058030-36 = "知らずに撃ってたのか！？ったく、マニュアルくらい読んどけよ……。"
10058030-37 = "あははっ！実際に触るほうが早く覚えると思って！"
10058030-38 = "スマホの機種変じゃねえんだぞ？"
10058030-39 = "しっかし、そんなんで当てるなんてよ。すげぇじゃん。"
10058030-40 = "目標をセンターに入れてスイッチを押すだけだよ？"
10058030-41 = "はっ！アスナらしいな。#nいつも思いつくままにやって、うまくいっちまうんだからな……。"
10058030-42 = "部長、このまま進みますか？"
10058030-43 = "ああ！ガンガン行って、とっとと片付けようぜ！"
10058030-44 = ""
10058030-46 = "停止！！！"
10058030-47 = ""
10058030-49 = ""
10058030-50 = "1時方向から敵のミサイル！"
10058030-51 = "煙幕遮蔽、開始します！"
10058030-52 = ""
10058030-57 = "何だあれ！？戦車レースでミサイル撃っていいのか！？"
10058030-58 = "ルール上、武器の制限はありませんから……。"
10058030-59 = "私たちもビームを撃ったし……。"
10058030-60 = "チッ、しかも誘導ミサイルかよ。#n煙幕遮蔽してなきゃヤバかったな。よくやった、アカネ。"
10058030-61 = "でも、これじゃ私たちのプリズム砲も当たらないよ？"
10058030-62 = "そりゃそうだが、時間を稼げただけで十分だ。"
10058030-63 = "移動するぞ！C&Cを攻撃するとは、どこのどいつだ？"
10058030-64 = "見つけ次第、ぶっ飛ばしてやる！"
10058030-65 = "とりあえず、煙幕に隠れながら移動しよう……。"
10058030-66 = "っ！部長、ロケットブースターの音です！"
10058030-67 = "ハッタリだ！この煙の中で撃って、当たるもんかよ！"
10058030-69 = ""
10058030-70 = "何だ！？あれ！？"
10058030-71 = "来ます！！"
10058030-73 = ""
10058030-74 = "くっ……。"
10058030-75 = "こいつは……ただモンじゃねぇな……。"
10058030-77 = ""
10058030-78 = "いぇ～い、一撃っ！C&Cも楽勝じゃん！"
10058030-79 = "ネル先輩、すごく怒っていると思います……。"
10058030-80 = "勝負は無情だからね！怒られる筋合いはないよ！"
10058030-81 = "ユズちゃん、今のミサイルの動きはなんだったの？"
10058030-82 = "これ、手動誘導するタイプのやつだったから……なんか手に馴染んでて。"
10058030-83 = "煙幕をなぞるように動かしたら引っ掛かるかな、って。格ゲーの要領でやってみた……。"
10058030-84 = "さすがUZQueen！ジョイスティックさえあれば無敵だね！"
10058030-85 = "モモイ。暴れるなら、あなたは歩いてください。#n3人乗りの戦車に5人も乗るのは無理があります。"
10058030-86 = "ひどい！それならケイが降りればいいでしょ！"
10058030-87 = "嫌です。モモイたちにアリスを任せると、何が起きるか分からないので。"
10058030-88 = "ユズ、すごいです！"
10058030-89 = "こういう時に言わなければいけないセリフがあります！"
10058030-90 = "や、やっつけられましたか！？"
10058030-92 = ""
