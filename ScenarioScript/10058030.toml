[translation]
10058030-1 = "제3화;교전수칙?"
10058030-2 = "드디어 시작입니다, 게헨나 컵! 시작부터 포격전 때문에 전체 80팀 중에서 50팀이 출발하지 못했네요!"
10058030-3 = "다시 인사드립니다, 해설의 모토미야 치아키, 탄가 이부키! 그리고 샬레의 선생님과 함께하고 계십니다!"
10058030-4 = "[s] \"샬레의 선생님입니다!\""
10058030-5 = "빠방-! 하고 엄청 큰 포탄을 쏘는 전차가 있었어!"
10058030-6 = "네에-! 이부키 쨩 말대로, 이번 전차대회의 다크호스. 트리니티의 구호기사단 팀이 맹활약을 선보였죠!"
10058030-7 = "하지만 그 두꺼운 장갑과 커다란 포를 올리느라 너무너무너무 속도가 느려졌어요!"
10058030-8 = "아직도 출발선을 못 지나고 있네요! 아무리 강해도 '레이싱'에선 속도도 필요한데 말이에요!"
10058030-9 = "격파는 1등이지만 의미가 없죠, 현재 순위는 꼴찌입니다!"
10058030-10 = "[s] \"트랙을 벗어나도 괜찮은 거야?\""
10058030-11 = "맞아요, 선생님! 이번 대회의 가장 중요한 규정은 '과녁을 모두 맞히고 출발점으로 다시 돌아오면 된다.'니까요!"
10058030-12 = "즉, 트랙을 벗어나는 것도 오케이, 과녁을 격파하는 순서도 무관!"
10058030-13 = "게다가, 자신이 먼저 결승선에 들어오기 위해 남들을 격파해도 상관없는 거죠!"
10058030-14 = "우리 학교 같아서 재밌어-!"
10058030-15 = "이참에 역대 대회에서 있었던 기록을 소개해 드리겠습니다!"
10058030-16 = "역대 최단 경기 기록은 53초! 전원이 출발선에서 격파되는 바람에 우승자가 없었던 대회였네요."
10058030-17 = "최장 경기 기록은 455일 8시간! 덕분에 우승 시점에 시청률은 0%였죠!"
10058030-18 = "그러고 보니 마코토 선배는 어디 갔어? 전차대회 참가 중이야?"
10058030-19 = "마코토 선배는 면허 필기시험 탈락해서 참가는 못 할 거예요!"
10058030-20 = "면허 필기시험이란 거, 많이 어려워?"
10058030-21 = "난이도보다는 마코토 선배가 '게헨나는 항상 전진한다'라면서 객관식에 서술형으로 답을 적어서 그런 걸 거예요!"
10058030-22 = "그렇구나…… 다음에는 꼭 붙었으면 좋겠네!"
10058030-23 = "그렇다고 하네요! 모두 준비하는 시험에서 좋은 결과를 볼 수 있으면 좋겠네요!"
10058030-24 = "다시 중계카메라로 돌아가 볼까요? 밀레니엄 사이언스 스쿨의 <C&C팀>으로 함께하시죠!"
10058030-25 = "채널 고정이래!"
10058030-33 = "첫 번째 과녁에 명중했어요, 부장님. 굴절 매니폴드 이상 없습니다."
10058030-34 = "프리즘 센서 상태 안정. 충전 완료."
10058030-35 = "대단해-! 우리 전차는 빛이 빠밤-! 하고 나가는구나?"
10058030-36 = "뭔지도 모르고 쏘고 있었던 거냐?! 설명서 정도는 읽으라고, 나 참……."
10058030-37 = "아하하! 그치만 실제로 만지는 편이 더 빨리 익혀지잖아!"
10058030-38 = "이게 무슨 새로 산 핸드폰 같은 건 줄 알아? 전차라고 인마!"
10058030-39 = "전차도 처음이고 설명서도 안 읽었으면서 용케도 과녁은 잘 맞혔네."
10058030-40 = "목표를 센터에 넣고 스위치만 누르면 되더라구!"
10058030-41 = "그래, 그래. 정말이지 너답다. 언제나 되는대로 누르는데 일이 알아서 풀리지……."
10058030-42 = "부장님, 이대로 쭉 전진할까요?"
10058030-43 = "당연하지! 콱콱 밟아서 후딱 해치우자고!"
10058030-46 = "정지!!!"
10058030-50 = "적 미사일! 1시 방향에서 발사됐습니다!"
10058030-51 = "연막차장 합니다!"
10058030-57 = "뭐야 저게?! 미사일? 전차 대회인데 그래도 돼?"
10058030-58 = "일단 무기의 제한은 없으니까요……?"
10058030-59 = "우리도 빔을 쏘지만 전차잖아."
10058030-60 = "제길, 유도미사일 같던데. 연막 안 쳤으면 위험할 뻔했네. 잘했어, 아카네."
10058030-61 = "그런데, 연막이면 우리 광선포도 소용없는 거 아니야?"
10058030-62 = "그렇긴 한데, 일단은 선제공격을 당했으니 저쪽이 공격하지 못하도록 시간을 버는 거야."
10058030-63 = "다시 움직이자, 누군지 몰라도 감히 C&C를 건드려?"
10058030-64 = "걸리면 죽었어!"
10058030-65 = "일단 연막을 따라 이동을……."
10058030-66 = "부장님, 로켓 부스터 소리예요!"
10058030-67 = "쏴 봤자지! 연막을 뚫고 유도할 수는 없다고!"
10058030-70 = "뭐야, 저거?!"
10058030-71 = "옵니다!!"
10058030-74 = "크윽……."
10058030-75 = "이 움직임……. 보통 녀석은 아니네……."
10058030-78 = "오 예! 한 방 먹였다! C&C도 별거 아니네!"
10058030-79 = "네루 선배, 엄청 화낼 것 같습니다……."
10058030-80 = "승부는 비정한 거니까! 경기의 일부인데 화내면 안 되지!"
10058030-81 = "유즈, 방금 그 미사일 움직임은 뭐였어?"
10058030-82 = "이거, 조이스틱으로 수동 유도하는 거라서 감각이 익숙하길래……."
10058030-83 = "연막 속을 훑으면 걸려 맞을 것 같아서 격투 게임처럼 커맨드를 넣어봤어."
10058030-84 = "역시 UZQueen! 조이스틱 달린 건 뭐든지 잘 다루네!"
10058030-85 = "모모이. 귀가 아프고 좁습니다. 내려서 걸어오시는 건 어떻겠습니까. 세 명 타는 전차에 다섯 명이 타는 건 무리입니다."
10058030-86 = "너무해! 그러면 케이가 내리면 되잖아!"
10058030-87 = "싫습니다. 여러분들에게 아리스를 맡겨두면 무슨 일이 일어날지 모르니까요."
10058030-88 = "대단합니다, 유즈!"
10058030-89 = "이런 상황이면 꼭 해야 하는 대사가 있었습니다!"
10058030-90 = "해치워지셨나!"
10058030-94 = "아, 안 돼!! 그 대사는!!"
10058030-97 = "이…… 자식들……!"
10058030-98 = "게임개발부!! 꼬맹이!! 마빡이!! 쌍둥이!!!"
10058030-99 = "아카네!!! 풀악셀 밟아!!"
10058030-100 = "갖다 박아버려!!!!"
10058030-104 = "역시 그 대사는 안 된다구!!!"
10058030-105 = "적 전차, 급속 접근 중!"
10058030-106 = "유즈 쨩, 쏴버려!!"
10058030-107 = "으, 응!!! 발사!!!"
10058030-113 = "피할 수 없으면 박살 내주마!!!"
10058030-114 = "덤벼!!!"
10058030-118 = "회피기동하는 미사일을 기관단총으로 요격했어요?!"
10058030-119 = "어떻게 된 겁니까, 대체 무슨 반사신경이에요!!"
10058030-120 = "캔슬기가 있다는 걸 잊고 있었어……."
10058030-121 = "유즈, 지금이야말로 장르를 격투게임에서 슈팅으로 바꿀 시점입니다!"
10058030-122 = "슈팅이고 뭐고 빨리 막아야 해요!!!! 옵니다!!!"
10058030-124 = "잡히면 너희들 죽어 진짜!!"
10058030-125 = "렌즈 시스템 정상 작동."
10058030-126 = "충전 완료!"
10058030-127 = "쏴!!"
10058030-132 = "끄앙!!"
10058030-133 = "흡기관 파괴, 계통 작동 불가합니다."
10058030-134 = "시동이 안 켜져!! 우린 죽었다!!"
10058030-135 = "유즈 쨩, 괜찮아?"
10058030-136 = "괘, 괜찮은데……. 잠망경이 부서졌어, 보면서 조준할 수 없어……!"
10058030-137 = "그럼 어떡해?!"
10058030-138 = "아리스, 어제 신나서 숙소에서 잠들지 않았기에 세이브하지 않았습니다……!"
10058030-139 = "유즈 쨩. 진정해. 날 봐. 너는 충분히 할 수 있어."
10058030-140 = "그치만, 미사일이 날아가는 걸 보면서 조종해야 맞힐 수 있는데……."
10058030-141 = "저번 주에 언니하고 탑 오브 파이터즈 하던 걸 떠올려봐."
10058030-142 = "언니한테 져주려고, 눈 마사지기 하면서 했는데도 전승으로 두들겨 줬잖아."
10058030-143 = "그거 핵이야, 핵!!"
10058030-144 = "유즈 쨩. 우리가 눈이 되어줄게."
10058030-145 = "미도리……."
10058030-146 = "……해볼게!"
10058030-150 = "미사일을 머리 위로 쏘면 어떡합니까?!!!"
10058030-154 = "짜식들, 탱크 고장 났나 보네! 완전 엉뚱하게 날아가잖아."
10058030-155 = "그러게 아까운 미사일은 뭐 하러 쏘……."
10058030-156 = "!!!!!!"
10058030-161 = "위에서 오는 거냐!!!!"
10058030-167 = "해치워지-"
10058030-170 = "안 돼!!"
10058030-171 = "일단 안 됩니다!"
10058030-172 = "우웁! 웁!"
10058030-173 = "새삼 대단하긴 해. 미사일을 말로 설명하는 것만 듣고 위에서 내리꽂다니."
10058030-174 = "바로 근처에서 터져서 격파는 못 했어, 한 발 더 쏘면……!"
10058030-175 = "미사일 더 없는데?"
10058030-176 = "뭐?"
10058030-177 = "뭐라구요?!"
10058030-178 = "유우카가 괜히 싸우고 다니는 거 아니면 과녁 맞히는 5발만 있으면 충분하다고 예산 안 줬잖아."
10058030-179 = "아리스, 본 적 있습니다! 가짜 보스에게 속아서 폭탄 다 쏟아붓는 스테이지입니다!"
10058030-180 = "그걸 왜 말 안 해준 거야-! 말렸어야지 모모이……."
10058030-181 = "그렇지만, 우승보다 C&C를 이겨봤다는 게 더 업적작 같아서……?"
10058030-184 = "그렇긴 하지……."
10058030-185 = "하기야, 킬각을 참는 건 힘들지……."
10058030-186 = "왜 납득하는 겁니까?!"
10058030-193 = "꼬마 메이드 씨, 아주 화난 것 같습니다……."
10058030-197 = "전차 위로 올라오는 거야?!"
10058030-198 = "망했다아-"
10058030-204 = "좋은 배짱이었다. 게임개발부 녀석들."
10058030-205 = "마빡이가 쏜 거지? 너, 대단하더라."
10058030-207 = "네루 선배!! 이건 어디까지나 경기잖아! 스포츠잖아!"
10058030-211 = "맞지 꼬맹이. 너희들이 미사일 다섯 발이나 얌생이로 때려 박은 것도 스포츠지."
10058030-212 = "아직 경기 중이니 이것도 스포츠다!!!"
10058030-221 = "끄아아앙!!!!"
10058030-223 = "지, 지금?"
10058030-224 = "지금!!!"
10058030-225 = "지금-"
10058030-228 = "이 틈에 도망쳐!!!!"
