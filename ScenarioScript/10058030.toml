10058030-171 = "とりあえず、ダメです！"
10058030-172 = "うっ！ううっ！"
10058030-173 = "さすがだね。外の様子を聞いただけでドンピシャで当てるなんて。"
10058030-174 = "ううん、当たる直前に撃ち落された。もう一発撃てば……！"
10058030-175 = "え？ミサイル、もうないよ？"
10058030-176 = "え？"
10058030-177 = "どういうことですか！？"
10058030-178 = "ユウカが5発あれば十分だって言って、予算をくれなかったじゃん。"
10058030-179 = "アリス、見たことあります！#nフェイクのボスに騙されて、爆弾を使い果たすステージです！"
10058030-180 = "そういうことはもっと早く言ってほしかったな……。"
10058030-181 = "優勝するよりC&Cを倒したほうが、実績になるかと思って……。"
