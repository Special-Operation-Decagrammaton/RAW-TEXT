[translation]
3701-1 = "수상한 점괘"
3701-4 = "하아아아아아—"
3701-8 = "레나 쨩? 무슨 일이에요? 그런 얼굴로 한숨을 다 내쉬고……."
3701-9 = "미, 미안해. 우리가 잘못했어. 그러니까 제발 용서해 줘……."
3701-10 = "샤아아악! 그렇게 말하니까 내가 나쁜 녀석 같잖아!"
3701-11 = "아무튼 선배들 때문은 아니니까 너무 신경 쓰지 마."
3701-12 = "하지만 귀여운 후배의 한숨을 지켜보고 있을 순 없죠."
3701-13 = "솔직하게 말해주세요. 무슨 일이 있었나요?"
3701-16 = "뭐, 별거 아니야. 요즘 운이 너무 없다고 해야 할까. 하루도 빠지지 않고 나쁜 일이 생겨."
3701-17 = "갑자기 신발 밑창이 떨어지고, 아끼던 가방의 끈이 끊어지고……."
3701-18 = "손거울이 깨지고, 나무 아래를 지나가다 거미줄이 얼굴에……."
3701-21 = "아아아……! 말하니까 더 짜증 나잖아!"
3701-22 = "으음, 뭔가 불길한 징조처럼 느껴지네요."
3701-23 = "그렇지? 뭔가 느낌이 이상해."
3701-24 = "이대로 가다간 큰 사건에 휘말릴 것 같다고 할까."
3701-25 = "물론 오컬트 같은 건 믿지 않지만, 기분이 찝찝하단 말이지."
3701-28 = "어쩌면 이건…… 악령의 짓일지도……."
3701-29 = "까악! 까아아악—!"
3701-30 = "히이익! 이 까마귀는 또 언제 들어온 거야?!"
3701-31 = "분명 악령의 기운을 느끼고 경고를 하러 온 거야……."
3701-32 = "무슨 소리야! 악령 같은 건 없다구!"
3701-33 = "하지만 나쁜 일이 일어난 건 분명해요."
3701-34 = "자, 제가 운세를 점쳐 드릴게요. 레나 쨩이 불길한 일을 피해 갈 수 있도록요!"
3701-35 = "마음은 고맙지만, 난 그런 거 안 믿는데."
3701-36 = "후후, 그냥 재미로라도 해봐요. 손해 볼 건 없잖아요?"
3701-40 = "뭐…… 다들 그렇다면야……."
3701-45 = "뭐, 뭐야? 갑자기 불은 왜 끄는데?"
3701-49 = "뉴후후…… 아르카나의 인도에 이끌린 자여. 이제부터 당신의 운명을 점지하려 합니다."
3701-50 = "운명이란 얼마든지 극복할 수 있는 것. 그러니 어떤 결과가 나오든 두려워 마세요."
3701-51 = "무의식의 흐름에 몸을 맡긴 채, 이쪽의 카드를 세 장 뒤집는 겁니다."
3701-52 = "아, 알겠어."
3701-58 = "어, 어때? 이제 좋은 일이 있을 거래?"
3701-59 = "어…… 이건……."
3701-60 = "……어떻게 봐도 좋은 운세라 부를 수가 없네요."
3701-61 = "어떤 운세인데 그래?"
3701-62 = "그, 그걸 제 입으로 말하는 것 자체가 두려울 정도로 말하기 어려워요."
3701-63 = "에리가 그렇게 이야기할 정도라니, 정말 나쁜 운인가 보네요."
3701-64 = "뭐, 뭐야? 그럼 난 어떻게 해야 하는데?!"
3701-65 = "뉴후후. 안심하세요. 아직 방법이 있으니까요."
3701-66 = "자, 또 카드를 세 장 뽑아 주세요. 분명 불안을 떨쳐줄 새로운 길을 제시해 줄 겁니다."
3701-67 = "으, 으으으으……!"
3701-68 = "아, 알았어! 뽑을게!"
3701-72 = "자. 이번엔 뭐라고 나와?"
3701-73 = "오호, 이건……."
3701-74 = "흐으으음……?"
3701-75 = "빨리 말해! 괜히 뜸 들이지 말고!"
3701-76 = "이런 조합이 나올 줄이야. 지금까지 수많은 점을 보았지만 처음 보는 결과로군요."
3701-77 = "알려드리죠. 불행을 벗어나기 위해 레나 쨩이 해야 할 일은 바로……."
3701-81 = "<고양이 흉내>입니다."
3701-85 = "……응?"
3701-86 = "점괘가 말하길, 달이 없는 밤 자정에 고양이 흉내를 내면 나쁜 일이 사라지고 복이 찾아온다고 해요."
3701-87 = "달이 없는 밤 자정이면…… 기숙사 안에서 하라는 거야?"
3701-88 = "히히, 좋은 구경이…… 되겠네."
3701-89 = "어머나."
3701-92 = "……."
3701-93 = "으, 으으, 으으으으……!"
3701-94 = "내가 그딴 걸 할 것 같아?! 그것도 선배들 앞에서?!"
3701-95 = "샤아아악! 역시 엉터리였어! 잠깐이라도 기대했던 내가 바보지!"
3701-96 = "이 이야기는 이제 그만해! 해산이야, 해산!"
3701-101 = "후후, 아쉽네요. 레나 쨩의 귀여운 모습을 볼 수 있나 기대했는데."
3701-102 = "까악! 까아아악……!"
3701-103 = "얘도 그렇다는데……."
3701-104 = "뉴후후, 저는 믿어요."
3701-105 = "레나 쨩이라면…… 분명 우리의 깊은 뜻을 이해해 줄 거라는 걸!"
3701-107 = "그렇게 시간이 흘러……."
3701-113 = "달이 뜨지 않은 밤 자정."
3701-117 = "선배들…… 자……?"
3701-120 = "……."
3701-121 = "……전부 자는 거겠지?"
3701-122 = "안 잔다면 지금이라도 솔직하게 말해. 화 안 낼 테니까."
3701-126 = "……."
3701-127 = "(조, 좋아. 전부 자고 있어.)"
3701-128 = "(하아아아……. 한밤에 고양이 흉내라니.)"
3701-129 = "(마음에 들진 않지만 호, 혹시 모르니까…….)"
3701-130 = "(진짜 요즘 운이 너무 나빠서 고양이 손이라도 빌리고 싶은 심정이야.)"
3701-131 = "(그, 그럼 해보자……!)"
3701-134 = "야, 야오옹. 야오오옹."
3701-135 = "애옹. 애오오옹……."
3701-136 = "……."
3701-137 = "(여, 역시 부끄러워!!)"
3701-138 = "애옹?"
3701-141 = "(응? 방금 창밖에서 고양이가……?)"
3701-142 = "애, 애오옹?"
3701-143 = "애옹. 애오오옹."
3701-144 = "(뭐, 뭐야? 대화가 되잖아?)"
3701-145 = "야옹! 야오옹!"
3701-146 = "샤아아아악!!"
3701-147 = "(아아아앗! 기분 나빠하는 것 같은데?!)"
3701-148 = "으에오에우에응아악……!!"
3701-149 = "아, 알았어! 미안해! 내가 잘못했으니까 제발 진정해!"
3701-150 = "애오오옹……."
3701-153 = "(후우우우, 내가 뭘 하고 있는 거람…….)"
3701-154 = "(설마 이거 제대로 못했다고 이상한 일이 더 생기는 건 아니겠지?)"
3701-157 = "(찌, 찝찝하니까 조금만 더 해볼까……?)"
3701-159 = "이후로도 작은 목소리로 열심히 고양이 흉내를 냈다……."
3701-162 = "(후후, 역시 귀엽네요.)"
3701-163 = "(힘내요, 레나 쨩!)"
3701-164 = "(항상 응원하고 있으니까…….)"
3701-168 = "그리하여 다음 날 오후……."
3701-171 = "……."
3701-172 = "하아아, 피곤해."
3701-173 = "……이게 다 어젯밤에 했던 이상한 짓 때문이야."
3701-174 = "밤에 몰래 고양이 흉내라니. 으으으, 두 번 다시 하나 봐라."
3701-180 = "안녕하십니까, 레나 쨩."
3701-181 = "어? 으, 으응!"
3701-182 = "수업 끝나고 돌아가는 길인가 보네요."
3701-183 = "어쩜 저와 같을 수가! 역시 우리는 운명으로 이어진 룸메이트인가 봐요!"
3701-184 = "그냥 우연히 복도에서 만난 것뿐이잖아."
3701-185 = "뉴후후, 오늘은 어땠나요? 별다른 일 없었나요?"
3701-186 = "딱히 이상한 일은 없긴 했는데……."
3701-187 = "(……음? 설마 어젯밤에 그거 때문?)"
3701-190 = "(에이, 그럴 리가. 그냥 우연이야, 우연.)"
3701-191 = "(에리 선배의 점괘대로라면 좋은 일이 있어야 하는데 딱히 그런 것도 없었고.)"
3701-192 = "표정을 보니 별일 없었던 것 같아 다행이네요."
3701-193 = "자, 그럼 우리의 보금자리로 돌아가죠. 모두가 기다리고 있어요."
3701-194 = "응? 나를?"
3701-195 = "뉴후후, 가보면 알게 될 거예요."
3701-202 = "어서 와…… 기다리고 있었어."
3701-203 = "저는 포근한 느낌이 드는 음악을 준비해 볼게요."
3701-210 = "뭐, 뭐야? 다들 무슨 일 있었어?"
3701-213 = "킁킁……. 뭔가 맛있는 냄새가 나는 것 같기도 하고."
3701-214 = "일단 이거부터 마셔…… 피로가 싹 사라질 거야……"
3701-215 = "이 수상한 음료수는 뭐야……?"
3701-216 = "내가 만든 특제 포도 에이드야. 정신이 번쩍 든다구? 이히히……."
3701-217 = "어…… 뭔가 이상한 게 들어가 있는데?"
3701-220 = "샤, 샤아아악! 이 눈알같이 생긴 건 뭐야?! 대체 뭘 넣은 거냐고!!"
3701-221 = "리치와 블루베리로 만들었어. 평범하면 심심하니까……."
3701-222 = "자, 이쪽엔 쿠키가 있어요. 모두가 정성을 다해 만들었답니다."
3701-223 = "호, 호박 모양 쿠키?"
3701-224 = "어때요? 귀엽죠?"
3701-225 = "그렇긴 한데…… 뭐야? 오늘 무슨 기념일이야?"
3701-226 = "딱히 그런 건 아니지만, 오늘은 다과회라도 하면 좋을 것 같아서요."
3701-227 = "어떤가요? 행복한 기운이 마구마구 샘솟지 않나요?"
3701-228 = "기다리던 좋은 일이 찾아온 것 같지 않나요?!"
3701-231 = "……."
3701-232 = "……응. 확실히 그렇네."
3701-233 = "쿠키 안에…… 다양한 재료를 넣었어."
3701-234 = "전부…… 맛있는 걸로. 히히."
3701-235 = "어떤 맛이 나올지 기대해도 좋아요."
3701-236 = "응! 일단 다들 자리에 앉자."
3701-237 = "헤헤, 그럼 어떤 것부터 먹어볼까~?"
3701-246 = "이후 모두가 즐거운 분위기 속에서 다과회를 즐겼다."
3701-248 = "(후후, 진짜 미워할 수 없는 선배들이라니까.)"
3701-249 = "하지만 앞으로 벌어질 사건은 하나도 예상 못했으니……."
3701-252 = "히이이익……!"
3701-253 = "아아아, 역시 선배들을 따라오는 게 아니었어! 그냥 기숙사에서 잠이나 잘걸……!"
3701-254 = "망했어……! 망했다구……!!"
3701-255 = "겁먹지 말아요, 레나 쨩! 이걸로 오컬트가 실존하는 게 증명됐잖아요?"
3701-262 = "우리의 진짜 모험은 지금부터 시작이에요!"
3701-263 = "아아아아, 난 이런 모험하고 싶지 않았어……!!"
3701-264 = "리미널 스페이스가 진짜로 있었다니……!"
3701-265 = "내보내줘! 내보내 달라구!!"
3701-268 = "수상한 점괘"
