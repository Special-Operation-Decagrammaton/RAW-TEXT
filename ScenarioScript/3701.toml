[translation]
3701-1 = "怪しい占い"
3701-2 = ""
3701-3 = ""
3701-4 = "はぁぁぁぁ～～……。"
3701-6 = ""
3701-7 = ""
3701-8 = "大きなため息ですね。どうかしましたか？"
3701-9 = "ごめんねぇ……全部、私が悪かったの……。"
3701-10 = "シャーッ！！なんでそうやって適当なこと言うのよ！"
3701-11 = "……別に先輩たちが何かしたとかじゃないから、気にしないで。"
3701-12 = "とはいえ、可愛い後輩のため息は見過ごせません。"
3701-13 = "悩みがあれば聞きますよ？"
3701-15 = ""
3701-16 = "……なんか、最近ツイてないっていうか、嫌なこと続きでさ。"
3701-17 = "靴底が剥がれたり、大事にしてたバッグの紐が切れたり……。"
3701-18 = "手鏡が割れたり、蜘蛛の巣に顔から突っ込んだり……。"
3701-20 = ""
3701-21 = "あー、も～っ！口に出すと余計ムカついてきた！"
3701-22 = "ふむ……不吉な前兆のようにも思えますね。"
3701-23 = "でしょ？なんかヤな感じでさ。"
3701-24 = "このままだと、もっと大変なことに巻き込まれる……ような感じがするっていうか……。"
3701-25 = "もちろんオカルトなんて信じてないけどさ。気味が悪いじゃん？"
3701-27 = ""
3701-28 = "もしかして……悪霊の仕業かも……。"
3701-29 = "ガァッ！ガァァッ……！"
3701-30 = "きゃぁっ！？またカラス入ってきてるんだけど！？"
3701-31 = "きっと悪霊の気配を感じて、忠告に来たんだよぉ……。"
3701-32 = "そんなわけない！絶対ない！"
3701-33 = "でも悪い事が続いているのは確かなんですよね？"
3701-34 = "レナちゃんが凶事を避けられるように、私が占ってみます！"
3701-35 = "いや、占いも信じてないから、私。気持ちだけもらっとく。"
3701-36 = "そう言わずに。遊びだと思ってやってみましょう？#n損はしないはずですよ。"
3701-38 = ""
3701-39 = ""
3701-40 = "まあ、みんなが言うなら……。"
3701-42 = ""
3701-43 = ""
3701-45 = "電気消すの！？"
3701-48 = ""
3701-49 = "にゅふふふ……アルカナに導かれし者よ、これより汝の運命を占いましょう。"
3701-50 = "運命とは自分で切り開くもの。結果を恐れる必要はありません。"
3701-51 = "無意識に身をゆだね、カードを3枚めくってください。"
3701-52 = "分かった。"
3701-54 = ""
3701-56 = ""
3701-57 = ""
3701-58 = "ど、どう……？良い事ありそう？"
3701-59 = "これは……。"
3701-60 = "お世辞にも良い運勢とは言えません……。"
3701-61 = "そんなに酷いの！？"
3701-62 = "私の口から言うには恐ろしいといいますか……。"
3701-63 = "エリがそこまで言うなんて、本当によろしくなさそうですね。"
3701-64 = "じゃあ私はどうしたらいいの！？"
3701-65 = "にゅふふ。ご安心ください、まだ方法はあります。"
3701-66 = "さあ、もう一度カードを3枚引いてください。#n不安を消し去る新たな道を示してくれます！"
3701-67 = "うぅぅ……！！"
3701-68 = "分かったわよ！引けばいいんでしょ！"
3701-70 = ""
3701-72 = "はいっ！今度はなんて？"
3701-73 = "ほぉ……これは。"
3701-74 = "ふむふむ……？"
3701-75 = "もったいぶらないで早く言ってよ！"
3701-76 = "……今まで数え切れないほどの組み合わせを見てきましたが、こんな結果は初めてです。"
3701-77 = "お伝えします。#n凶事を逃れるために、レナちゃんがすべきことは――"
3701-80 = ""
3701-81 = "――「猫のモノマネ」です。"
3701-83 = ""
3701-84 = ""
3701-85 = "……え？"
3701-86 = "カードによると「月のない夜の午前0時に猫のモノマネ」をすれば凶事は消え失せ、#n幸運が巡ってくる……らしいです。"
3701-87 = "午前0時……それ、寮の中でやれってこと？"
3701-88 = "イヒッ……楽しくなりそうだねぇ。"
3701-89 = "あらま。"
3701-91 = ""
3701-92 = "……。"
3701-93 = "う、うぅ……うぅっ……！"
3701-94 = "やるわけないでしょ！？しかも先輩たちの前でなんて！絶対やらないから！"
3701-95 = "シャーッ！！やっぱりからかってるんだ！ちょっとでも期待した私がバカみたい！"
3701-96 = "もうこの話は終わり！解散っ！！"
3701-100 = ""
3701-101 = "ふふっ、残念です。レナちゃんの可愛い姿が見れると思ったのですが。"
3701-102 = "ガァッ！ガァァッ……！"
3701-103 = "この子も、そうみたい……。"
3701-104 = "にゅふ、私は信じています。"
3701-105 = "レナちゃんには、私たちの思いが伝わっていると！"
3701-107 = "時は流れ――"
3701-113 = "月のない夜の、午前0時。"
3701-116 = ""
3701-117 = "みんな……寝てる？"
3701-120 = "……。"
3701-121 = "……寝てる、よね？"
3701-122 = "もしも起きてるなら正直に言って。今なら怒らないから。"
3701-124 = ""
3701-125 = ""
3701-126 = "……。"
3701-127 = "（よし、みんな寝てる）"
3701-128 = "（はぁ……深夜に猫のモノマネって……）"
3701-129 = "（でも、まあ？一応。一応、気休めにね）"
3701-130 = "（最近ツイてなさすぎて猫の手も借りたいくらいだし）"
3701-131 = "（じゃあ……やるぞ――！）"
3701-133 = ""
3701-134 = "に、にゃあーお。にゃああ～お。"
3701-135 = "みゃ～、みゃあみゃあ～……。"
3701-136 = "……。"
3701-137 = "（や、やっぱり恥ずかしい！！）"
3701-138 = "みゃ？"
3701-140 = ""
3701-141 = "（ん？いま、窓の外に猫が……？）"
3701-142 = "み、みゃあー？"
3701-143 = "みゃー、みゃあみゃあー。"
3701-144 = "（あれっ！？会話できてる！？）"
3701-145 = "にゃーお！にゃあーお！"
3701-146 = "シャーーーッ！！"
3701-147 = "（にゃぁーっ！？機嫌悪そうなんだけど！？）"
3701-148 = "ンミャァァオアーッ！！"
3701-149 = "わ、分かった！私が悪かったってば！ごめん！！謝るから落ち着いて！！"
3701-150 = "みゃああ……。"
3701-152 = ""
3701-153 = "（はぁ……私、何やってんだろ……）"
3701-154 = "（まさか今ので失敗扱いになって、もっと大事になったりしないよね？）"
3701-156 = ""
3701-157 = "（なんか不安になってきた……もう少しやっとく……？）"
3701-159 = "その後も、レナは小さな声で猫のモノマネを続けた。"
3701-161 = ""
3701-162 = "（ふふ、やっぱり可愛いです）"
3701-163 = "（頑張ってください、レナちゃん！）"
3701-164 = "（応援してるよぉ……）"
3701-168 = "翌日の午後――"
3701-171 = "はぁ……。"
3701-172 = "……疲れた。"
3701-173 = "昨夜あんなことしてたから……。"
3701-174 = "夜中に猫のモノマネって……うぅっ、二度とやるかっ。"
3701-176 = ""
3701-178 = ""
3701-179 = ""
3701-180 = "レナちゃん、こんにちは。"
3701-181 = "えっ？あ、うん！"
3701-182 = "下校中ですか？"
3701-183 = "なんという偶然……やはり私たちはルームメイト！互いを呼び合う運命なんですね！"
3701-184 = "いや、偶然は偶然でしょ。"
3701-185 = "にゅふふ。それで、今日はどうでしたか？#n何か嫌なことはありませんでしたか？"
3701-186 = "特に何もなかったけど……。"
3701-187 = "（……ん？何もなかったのって……もしかして昨日のあれのおかげ？）"
3701-189 = ""
3701-190 = "（いや、そんなわけないか。偶然は偶然でしょ）"
3701-191 = "（エリ先輩の占い通りなら良い事があるはずなのに、何もなかったし）"
3701-192 = "その様子だと何もなかったみたいでよかったです！"
3701-193 = "では寮に帰りましょう！みんなが待ってますよ。"
3701-194 = "なんで？"
3701-195 = "にゅふふ。行けば分かります。"
3701-201 = ""
3701-202 = "いらっしゃい……待ってたよぉ。"
3701-203 = "心が落ち着く音楽を用意しますね。"
3701-205 = ""
3701-208 = ""
3701-209 = ""
3701-210 = "え、みんなしてどうしたの？"
3701-212 = ""
3701-213 = "くんくん……なんか美味しそうな匂いもするような……。"
3701-214 = "これ、あげる……疲れが取れるはず。"
3701-215 = "飲み物……？見るからに怪しいんだけど……。"
3701-216 = "特製のブドウエード……飲めば頭スッキリ……イヒッ……。"
3701-217 = "ん……？なんか入ってる？"
3701-219 = ""
3701-220 = "シャーッ！？これっ、目玉みたいなの何っ！？"
3701-221 = "ライチとブルーベリー……ちょっとした遊び心だよぉ。"
3701-222 = "はい、クッキーもどうぞ。みんなで心を込めて作りました。"
3701-223 = "カボチャのクッキー？"
3701-224 = "ふふ、可愛いでしょう？"
3701-225 = "かわいいとは思うけど……今日って何かの記念日だっけ？#nもしかして私、忘れてる？"
3701-226 = "大丈夫、普通の日ですよ。#n単に、みんなでお茶をしたいな、と思いまして！"
3701-227 = "いかがでしょう？ハッピーな気持ちが湧いてきませんか？"
3701-228 = "ほらほら、「良い事」があった気がしません！？"
3701-230 = ""
3701-231 = "……。"
3701-232 = "……うん。たしかに。"
3701-233 = "クッキーに色々入れてみたよぉ。"
3701-234 = "どれも美味しいものを、ね……イヒヒ。"
3701-235 = "何味かはお楽しみです。"
3701-236 = "ほらほら、みんな座ろ！"
3701-237 = "んー、どれにしよっかな～？"
3701-238 = ""
3701-239 = ""
3701-240 = ""
3701-241 = ""
3701-242 = ""
3701-243 = ""
3701-244 = ""
3701-246 = "お茶会は和気あいあいと進んだ。"
3701-247 = ""
3701-248 = "（もう、こういうことされるから憎めないんだよね）"
3701-249 = "この後に起こる出来事を知らずに――"
3701-252 = "ひぃぃっ……！！"
3701-253 = "やっぱついてくるんじゃなかった！おとなしく寮で寝てればよかったんだ！！"
3701-254 = "終わりよ……もう全部終わり……！！"
3701-255 = "怖がる必要はありません！これでオカルトの実在を証明できたのですから！"
3701-262 = "私たちの冒険はここからです！"
3701-263 = "こんな冒険求めてないのにぃ……！"
3701-264 = "だって聞いてないもん！「リミナルスペース」が本当にあるなんて！！"
3701-265 = "出して！ここから出してよぉーーっ！！"
3701-268 = "怪しい占い"
