[translation]
10011060-1 = "제6화;세 번째 관문: 독심술사"
10011060-4 = "추격전의 열기가 점점 더 고조되어가는 와중에, 역시나 제 예상대로~!"
10011060-5 = "가장 두각을 드러내는 건 그 어떤 팀보다 빠르게 잠자는 공주의 시련을 통과한 인법연구부!"
10011060-6 = "과연 소문으로만 듣던 닌자의 활약이란, 바로 이런 걸 두고 말하는 것일까요~?"
10011060-7 = "물론 샬레의 선생님이 함께하고 있단 시점에서 사알-짝 룰 위반인지 아닌지. 검토가 필요하다고도 생각하지마는."
10011060-8 = "모두가 즐거워야만 하는 축제! 아주 약간의 반칙은~ 네에~ 즉흥적으로 아무도 모르게 넘어가 주는 것도 여흥 중의 하나!"
10011060-9 = "흥흥~♪ 모두 힘내라~! 힘~!"
10011060-11 = "[ns] \"이미 대놓고 말하고 있는 게 아닌지…….\""
10011060-12 = "저쪽으로선 전혀 숨길 생각이 없는 모양인데요. 덕분에 지금도-"
10011060-16 = "잠자는 공주가 담당하는 두 번째 관문을 최단 시간으로 통과했다고? 그게 진짜야?"
10011060-17 = "그 수행부의 부장을 상대로? 애당초 인법연구부가 뭔데?"
10011060-18 = "우리 학교에 그런 동아리가 있었나? 처음 듣는데……"
10011060-19 = "인법연구부라니, 이상한 이름이네~"
10011060-21 = "이상한 이름이라니! 그거참 실례네!"
10011060-22 = "[s] \"뭐, 다들 처음 듣는 동아리 이름에 어리둥절한 걸 테니까.\""
10011060-23 = "그, 그야 그런 거겠지만……"
10011060-24 = "어, 어, 엄청 부, 부담스러워요오……."
10011060-25 = "그래도! 이번 기회가 닌자의 진가를 알릴 기회인 거네요!"
10011060-26 = "그쵸. 부장!"
10011060-31 = "(……하지만…… 이렇게 주목받았다가 자칫 우리 동아리에 대해 안 좋은 이야기라도 돌았다간…….)"
10011060-32 = "아니아니! 이럴 때가 아니지! 지금이라도 망량즈를 붙잡아서 이 웃기지도 않는 추격전을 얼른 끝내면 될 일이니까!"
10011060-39 = "아! 이번 도전자는 여러분이시군요!"
10011060-40 = "이번엔 <세 번째 관문: 무서운 독심술사>인 저 미즈하 미모리가! 여러분의 앞길을 가로막겠습니다!"
10011060-41 = "[s1] \"츠바키 다음엔 미모리구나!\"\n[s2] \"그런데…… 무서운 독심술사……?\""
10011060-44 = "앗! 그러고 보면 이즈나! 들은 적 있어요! 주군!"
10011060-45 = "수행부에는 여러 기인이 있는데……! 그중에서는 무려 사람의 마음을 읽는, 독심술을 쓸 수 있는 무시무시한 사람도 있다고!"
10011060-46 = "[s] \"미모리에게, 설마 그런 능력이?!\""
10011060-47 = "아, 저, 저기…… 그건 그냥 단순한 소문……이랄까."
10011060-48 = "앗! 그, 이, 이번엔 그게……"
10011060-49 = "네, 마, 맞아요!"
10011060-50 = "공주님을 납치해 간 도당의 협력자 중에서도, 최, 최강이라고 불리는! 독심술사……"
10011060-51 = "마, 마인드 리더가 바로 저, 저예요!"
10011060-52 = "네, 그, 그런 설정이에요……."
10011060-53 = "[s] \"부끄러우면 굳이 말 안 해도 될 텐데…….\""
10011060-54 = "흐음, 과연 이게 관광업이 발전한 백귀야행의 프로페셔널한 방식이로군요. 참고가 되는 걸요……."
10011060-55 = "아, 으으…… 하, 하여간! 저! 여러분의 생각을 읽어보겠습니다! 각오하세요!"
10011060-62 = "우, 우선 이즈나 쨩……!"
10011060-63 = "깜짝!"
10011060-64 = "이즈나 쨩은 절 쓰러트리고 싶은 것이로군요! 앞으로 나아가기 위해서!"
10011060-65 = "캐, 캐앵?! 그, 그걸 어떻게……!"
10011060-66 = "거기다 츠쿠요 쨩은…… 좀 더 노력해서…… 친구들에게 도움이 되고 싶은 거네요!"
10011060-67 = "우, 와아앗! 마, 맞췄어요! 괴, 굉장해요……! 도, 독심술사 님……!"
10011060-68 = "그리고 미치루 쨩은……!"
10011060-72 = "뭔가! 고민이 잔뜩인 모양이고요! 앞으로 나아가고 싶은 듯한…… 바로 집으로 돌아가고 싶어 하는 듯한……! 그런 모습이 보여요!"
10011060-73 = "아니, 미, 미묘하게 저, 정답인 듯한…… 정답이 아닌 듯한……."
10011060-74 = "후후후. 여러분의 마음을 잔뜩 읽어버리는 저를…… 과연 여러분께서 쓰러트릴 수 있을까요!"
10011060-75 = "[s] \"좋아. 여기선 내가 나서겠어.\""
10011060-77 = "서, 선생 공이 직접……?"
10011060-79 = "아……. 선생님께서?"
10011060-80 = "조, 좋아요! 그럼 제가 선생님의 마음도 읽어보겠습니다!"
10011060-83 = "으므므믓……. 비비비빗!"
10011060-87 = "……!"
10011060-88 = "……앗."
10011060-89 = "……서, 선생님, 그, 그런 생각을 하신다니……."
10011060-90 = "[s] \"……네?\""
10011060-91 = "아, 아무리 그래도…… 선생님, 그런 생각을 품는 건……."
10011060-92 = "……떽이에요! 그, 그런 건 지금은 곤란하니까요!"
10011060-93 = "……선생님, 대체 평소 무슨 생각을 하고 계시는 건가요?"
10011060-94 = "[s] \"아무 생각도 안 했어! 억울해!\""
10011060-96 = "자연스럽게 내부의 분열을 불러일으켰어……?!"
10011060-97 = "과연! 독심술사가 최강이라는 건 바로 이걸 두고 말하는 거였군요!"
10011060-98 = "아! 이즈나 쨩! 부장님! 저 도, 독심술사와 싸우기 위한 바, 방법을, 아, 아, 알아낸 거 같아요요오!"
10011060-99 = "으, 응? 츠쿠요? 방법이 있어?"
10011060-100 = "저, 부장님의 만화책에서 이, 읽은 적 있어요……! 주, 주인공 일행이 독심술을 쓰는 인법술사와 싸우기 위해 취한 작전……!"
10011060-101 = "이, 일명 <멍 때리기 작전>이, 이예요오오!"
10011060-106 = "어머나."
10011060-107 = "이, 이럴 땐, 다 같이 아무 생각도 안 하고 멍- 때린 채로 싸우면……! 마음을 읽힐 일도 어, 없으니까요!"
10011060-108 = "그럼 다, 다 같이! 멍- 때리기를 하는 거예요! 자, 자아……!"
10011060-109 = "네! 츠쿠요 공! 이즈나도 동참할게요!"
10011060-110 = "……!"
10011060-111 = "머엉………"
10011060-112 = "아, 으응……!"
10011060-113 = "머엉……."
10011060-115 = "……정말 이걸로 괜찮은 거 맞나요?"
10011060-116 = "과연, 저 독심술사 미모리에게 대항하기 위해, 그런 방법으로 나오신다는 건가요……!"
10011060-117 = "그럼 저 또한 전력으로, 멍 때리는 여러분의 마음을 읽어 보도록 하겠어요! 얍-!"
10011060-119 = "머엉-"
10011060-120 = "머엉-!"
10011060-121 = "머, 머엉……?"
10011060-125 = "으음, 으으으으읏?!"
10011060-130 = "[ns] \"그, 그야말로 박빙의 승부다……!\""
10011060-132 = "……네? 어디가요?"
10011060-133 = "아니, 대결을 하는 건 좋습니다만."
10011060-134 = "문제는 여기서 그냥 멍 때리고만 있으면, 정작 관문은 어느 세월에 통과하느냐, 인데요……?"
10011060-135 = "애당초 뭘 하는지도 모르겠고."
10011060-136 = "[s] \"……뭐, 원래는 어트랙션의 일종이니까.\""
10011060-137 = "아, 참고로- 여러분을 위해 약간, 이번 어트랙션의 팁을 드리자면."
10011060-138 = "수문장을 쓰러트리면 어트랙션을 통과할 수 있답니다?"
10011060-139 = "……!!"
10011060-140 = "과, 과연!"
10011060-141 = "그, 그런 방법이……?!"
10011060-142 = "이거, 혹시 저만 분위기 파악을 못하고 있는 걸까요……?"
10011060-143 = "[s] \"과, 과연…… 일단 수문장이라면 쓰러트릴 수밖에 없겠어!\""
10011060-144 = "후후…… 다행히 싸울 생각이 드신 모양이네요!"
10011060-145 = "좋아요! 저, 불초 미모리가 상대해드리지요!"
