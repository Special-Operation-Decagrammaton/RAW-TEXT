212200-61 = ""
212200-63 = ""
212200-64 = ""
212200-65 = ""
212200-66 = ""
212200-67 = "...I've been musing over your dish, Fuuka."
212200-68 = "And with every spoonful of your food, I find another thought manifesting."
212200-69 = "My cold, discerning eye cannot help but inspect your efforts, searching for pristine quality."
212200-70 = "..."
212200-71 = ""
212200-73 = ""
212200-74 = ""
212200-75 = ""
212200-76 = "This wretched soul of mine, one that's been so cruel..."
212200-77 = ""
212200-79 = ""
212200-80 = "Fuuka, your meal is heartwarming enough to melt it down to its core."
212200-81 = ""
212200-83 = ""
212200-84 = "Haruna..."
212200-85 = "I forgot the very point of an epicure's journey: gratitude for the kindness of those who feed us."
212200-86 = "Fuuka's delicate touch and Juri's dedication... I must apologize to you. For forgetting such fundamental things."
212200-87 = "...You were under the influence of the Tyrant Emperor. You were a victim in your own right."
212200-88 = "No... We can't hide behind that as an excuse. Not for something like this."
212200-89 = "Haruna was right. We brought force and control into a place of fine dining and disrespected your cooking."
212200-90 = "We have to make up for that. To everyone. So, really. We're sorry."
212200-91 = ""
212200-93 = ""
212200-94 = ""
212200-95 = "Now that everything's okay... You two really freaked me out when it happened."
212200-96 = "Mhm. It was scary. Really scary! That Gourmet Society wasn't fun at all."
212200-97 = "I was...so worried that something terrible was really going to happen to us."
212200-98 = ""
212200-100 = ""
212200-101 = ""
212200-102 = ""
212200-103 = "I apologize to each and every one of you for my transgressions."
212200-104 = ""
212200-106 = ""
212200-107 = ""
212200-108 = "..."
212200-109 = "Hup! Okay! Enough of that. No more pity parties over something that wasn't even your fault."
212200-110 = "I'll just give you one warning."
212200-111 = ""
212200-113 = ""
212200-114 = ""
212200-115 = "If you ever do this again, then I'll never cook another dish for you!"
212200-116 = ""
212200-118 = ""
212200-119 = ""
212200-120 = "Fufu, a punishment I do not desire to suffer through."
212200-121 = "That's right! And you won't be allowed to sit with us at lunch anymore!"
212200-122 = "Don't even think about doing this again! Or I won't share my special sauce anymore!"
212200-123 = "If you're going to start making threats like that, I guess I should start training my brain to resist brainwashing."
212200-124 = "Hm... I think that calls for another bowl! You can't work on an empty stomach, after all! ★"
212200-125 = "You already finished the last one?!"
212200-126 = "Fufu, no problem! Coming right up!"
212200-128 = "Everyone had their own way of apologizing to their friends, but the sincerity of their feelings came across each time."
212200-131 = ""
212200-132 = ""
212200-133 = "..."
212200-134 = ""
212200-139 = ""
212200-140 = ""
212200-141 = "Sena."
212200-142 = "Chinatsu. Please come in."
212200-143 = "Sena, how...are you feeling?"
212200-144 = "Better than ever. There hasn't been any corp—excuse me, patients lately either."
212200-145 = "I'm glad to—"
212200-146 = "...Is what I'd like to say. However, my heart is still heavy."
212200-147 = "..."
212200-148 = "I remember the things I said to you, Chinatsu."
212200-149 = "The callousness with which I spoke of war and surgery..."
212200-150 = "I remember the insulting sophistry I attempted to impose upon you."
212200-151 = "When I accepted this role, I took an oath to protect life. And yet, I stood behind the mass slaughter of civilians and students. How can I continue my work with pride?"
212200-152 = "But you didn't mean it! I already know that!"
212200-153 = "Intent does not negate impact."
212200-154 = "I treated sacrifice as a necessary tool for glory... A medical professional should never see life as another number on the board."
212200-155 = "We fight to protect our oaths. To claw desperately towards the resolution with the least amount of bloodshed."
212200-156 = ""
212200-158 = ""
212200-159 = "That's what you've always done. And what you'll continue to do."
212200-160 = "..."
212200-161 = "I saw you fight, Chinatsu."
212200-162 = ""
212200-164 = ""
212200-165 = "I saw the struggle you suffered as you lifted your gun against Head Prefect Hina."
212200-166 = "I saw your strength when you stood up for what you believed in."
212200-167 = "W-Well..."
212200-168 = "When you submitted your resignation to go to the Prefect Team, I thought of it as a farewell, of sorts."
212200-169 = "But you still carried the spirit of a paramedic to the Prefect Team. You guided me back to the correct path when I thought there was none."
212200-170 = "Thank you. I am proud to have you as my underclassman, Chinatsu."
212200-171 = ""
212200-173 = ""
212200-174 = "The student has truly exceeded the master here. I've never seen better medical care."
212200-175 = ""
212200-177 = ""
212200-178 = ""
212200-179 = ""
212200-180 = "...Thank you. Thank you for coming back, Sena."
212200-181 = "Fufu..."
212200-182 = ""
212200-184 = ""
212200-185 = "Now that transportation is complete, we need to shift gears into rehabilitation."
212200-186 = "I'd like to propose a joint inspection run by our organizations to prevent further cases of aberration in the upperclassmen."
212200-187 = "...That sounds wonderful! I'm sure the Head Prefect will be on board. I'll be sure to relay the message."
212200-188 = "Once again, thank you for reaching out to my heart when it had turned away, Chinatsu."
212200-189 = ""
212200-191 = ""
212200-192 = "Sena..."
212200-193 = "Thank you...for always believing in me, Sena."
212200-199 = ""
212200-200 = "Okay, where to next?!"
212200-201 = "We don't have time for this! We got hot springs to dig!"
212200-202 = "What were we thinking, talking about war and conquest? The hot springs give us purpose!"
212200-203 = "That's right! They're calling our names as we speak!"
212200-204 = ""
212200-206 = ""
212200-207 = ""
212200-208 = "Wow! President Kasumi directed us straight to a healthy hot spring!"
212200-209 = "It's got good flow, and the temperature's just right!"
212200-210 = "Wahaha! That's right! And we've got plenty more to go!"
212200-211 = "So you can forget about that treasure map, Megu."
212200-212 = "Hmmm? What treasure map?"
212200-213 = "Now that's my Megu! Wahaha!"
212200-214 = "Why did those kinda thoughts even cross my brain in the first place?"
212200-215 = "I can't believe I wanted to do something to help Gehenna, let alone help with a WAR."
212200-216 = "That's..."
212200-217 = "But I don't feel that one bit anymore!"
212200-218 = "Thinking that hard's just not for me! And especially not about boring stuff!"
212200-219 = ""
212200-221 = ""
212200-222 = "You get it. That sort of thing's just not fun."
212200-223 = "All we have to do is follow President Kasumi's orders, like we always do!"
212200-224 = "..."
212200-225 = "Little caveat. You don't gotta do EXACTLY as I say ALL the time."
212200-226 = "Huh?"
212200-227 = "Because then it's no different from brainwashing..."
212200-228 = ""
212200-230 = ""
212200-231 = "What you want matters too, Megu."
212200-232 = "Ah, that's our President Kasumi, all right!"
212200-233 = "Heehee! That's the absolute last of your worries!"
212200-234 = ""
212200-236 = ""
212200-237 = "What I want is to stay right here, with you, and with the awesome members of our club!"
212200-238 = "I like digging up hot springs, eating delicious food, and putting up buildings with my friends! And I don't want to stop!"
212200-239 = ""
212200-241 = ""
212200-242 = ""
212200-243 = "Waha! Turns out, I was worryin' over nothin'!"
212200-244 = "Whatever you want, I'll always make it happen, Megu. Leave it to me!"
212200-245 = "I know! Heehee. Thanks, as usual."
212200-246 = ""
212200-250 = ""
212200-251 = ""
212200-252 = "Exactly as Captain Megu said! Y'all, who are we again?"
212200-253 = "THE HOT SPRINGS DEPARTMENT!!"
212200-254 = "Wahaha! Where there's a hot spring, there's us!"
212200-255 = "No, even if there's not a hot spring, there's still us!!"
212200-256 = "All right, everyone! If we want to dig up five hot springs today, you better get your butts in action! Off to the next location with you!"
