[translation]
212200-1 = "第20話;残されたもの"
212200-3 = ""
212200-4 = "はい、サンマの塩焼き。あとお味噌汁。"
212200-5 = ""
212200-7 = ""
212200-8 = ""
212200-9 = ""
212200-10 = "わぁ～い！もうお腹ペコペコだよ～！"
212200-11 = "すっごく美味しそう！"
212200-12 = ""
212200-14 = ""
212200-15 = ""
212200-16 = "ふふ、ありがとうございます。"
212200-17 = "せっかく作ってくださったのですし、冷めないうちにいただきましょう。"
212200-18 = "なんでご飯作ってあげてるのか、我ながら釈然としないけど……。"
212200-19 = "お腹すかせてるのに放ってはおけないし。"
212200-20 = "やっぱりお優しいですね。"
212200-21 = "優しさついでに、ご飯を3杯ほど追加でお願いできますか？"
212200-22 = "はい、ただいま！#nいつもの特大お茶碗でお持ちしますね！"
212200-23 = ""
212200-24 = ""
212200-25 = ""
212200-26 = "あむ、はむっ……ん～……。"
212200-27 = ""
212200-29 = ""
212200-30 = "……あれ？どうしたの？#n特製ソース出しかけてやめるなんて。"
212200-31 = "うーん、今日はかけなくてもいいかなって。"
212200-32 = "フウカが心を込めて作ってくれたご飯だもん。このままで十分おいしい！"
212200-33 = "え、イズミもそういうこと言うんだ。#n普段から素材の味を楽しんでみたら？"
212200-34 = ""
212200-36 = ""
212200-37 = "それとこれとは違うよ。#nあっ！じゃあ今度一緒に、ガリとピーナッツバターをセットで――"
212200-38 = "遠慮しとく……。"
212200-39 = ""
212200-41 = ""
212200-42 = "……。"
212200-43 = ""
212200-45 = ""
212200-46 = ""
212200-47 = ""
212200-48 = "ハルナ、何か考え事ですか？"
212200-49 = "やけに静かじゃない。逆に怖いんだけど。"
212200-50 = ""
212200-52 = ""
212200-53 = "……サンマの焼き目にムラがあります。#nお味噌汁のお豆腐は大きさがバラバラです。"
212200-54 = "それは……その、急いで準備したから――"
212200-55 = "ん？ちょっと待って、なんで私が言い訳してるのよ？"
212200-56 = "せっかく作ってあげたのに、文句言うなら……。"
212200-57 = ""
212200-59 = ""
212200-60 = "これぞ美食ですわ。"
212200-61 = ""
212200-63 = ""
212200-64 = ""
212200-65 = ""
212200-66 = ""
212200-67 = "……この料理をいただきながら、思い返していました。"
212200-68 = "私が強要した献立や、補給日程、その準備工程について。"
212200-69 = "そして……誤りを正そうとする皆さんを監視していた、私自身のこと。"
212200-70 = "……。"
212200-71 = ""
212200-73 = ""
212200-74 = ""
212200-75 = ""
212200-76 = "あのような行いをしてた私すべての行いで汚れた私の情けない魂を、静かに潤してしまうほど――"
212200-77 = ""
212200-79 = ""
212200-80 = "フウカさんのお料理は温かいんですのね。"
212200-81 = ""
212200-83 = ""
212200-84 = "ハルナ……。"
212200-85 = "美食とはすなわち、誰かの真心に感謝すること――#nその当たり前を、私は忘れていました。"
212200-86 = "フウカさんの繊細な手仕事も、ジュリさんの献身も……#n数々の非礼を、ここにお詫びします。"
212200-87 = "……まあ、雷帝のせいだったんでしょ？#nそれなら、あなたたちも被害者じゃない。"
212200-88 = "どのような事情があったとしても……それを言い訳にはしません。"
212200-89 = "あろうことか美食の本分を忘れ、皆さんを統制の枠に押し込もうとしたんですから。"
212200-90 = "それだけでも、反省すべき理由としては十分すぎます。#n本当に……申し訳ありませんでした。"
212200-91 = ""
212200-93 = ""
212200-94 = ""
212200-95 = "あの時の二人、ほんと変だったよ。"
212200-96 = "……怖かった。あんな美食研究会、ぜんぜん楽しくないよ。"
212200-97 = "ゲヘナがどうにかなっちゃうんじゃないかって思いましたね……。"
212200-98 = ""
212200-100 = ""
212200-101 = ""
212200-102 = ""
212200-103 = "不安にさせてしまってごめんなさい。"
212200-104 = ""
212200-106 = ""
212200-107 = ""
212200-108 = "……。"
212200-109 = "はい、もう終わり！しょんぼりしてたって何にもならないでしょ？"
212200-110 = "その代わり、これだけは絶対に覚えておいて。"
212200-111 = ""
212200-113 = ""
212200-114 = ""
212200-115 = "もしも同じことをしたら、金輪際ご飯作ってあげないから。分かった！？"
212200-116 = ""
212200-118 = ""
212200-119 = ""
212200-120 = "ふふ、それは大問題ですわね。"
212200-121 = "私たちだって！またそうなったら、一緒にご飯食べに行かないから！"
212200-122 = "ソースも分けてあげないんだから！"
212200-123 = "あらあら。精神力を鍛えないといけませんね。#n洗脳ごとき、最初から効かないくらいには。"
212200-124 = "な、の、で……お代わりいただけますか？#n何をするにも、ご飯の力があってからこそですから★"
212200-125 = "もう3杯全部食べたの！？"
212200-126 = "はーい！少々お待ちください！"
212200-128 = "（謝り方はそれぞれ違う。だが、その気持ちはきちんと伝わっているはずだ）"
212200-131 = ""
212200-132 = ""
212200-133 = "……。"
212200-134 = ""
212200-139 = ""
212200-140 = ""
212200-141 = "セナ先輩。"
212200-142 = "チナツでしたか。どうしました？"
212200-143 = "……調子はいかがですか？"
212200-144 = "絶好調です。最近は死体……いえ、患者もいませんでしたし。"
212200-145 = "それはよかっ――"
212200-146 = "ですが、気持ちは晴れませんね。"
212200-147 = "……。"
212200-148 = "覚えているんです。#n……私がチナツに話したこと。"
212200-149 = "攻撃は医療行為だとか、出血は手術の過程として許容すべきだとか――"
212200-150 = "あのような詭弁を、私は並べ立てていた。"
212200-151 = "……救急医学部を預かる者として、部長失格です。"
212200-152 = "あれが先輩の本心じゃなかったことは分かっています。"
212200-153 = "そうだとしても。一度吐いた言葉をなかったことにはできません。"
212200-154 = "偉大さには犠牲が伴う？まさか。#n医療が犠牲を当然にしていいはずがありません。"
212200-155 = "たった一滴でさえも、出血を防ぐためにもがく。#nそれこそが私たちの本分であるはずなのに。"
212200-156 = ""
212200-158 = ""
212200-159 = "ちゃんと……先輩は実践されてきました。これからだって、きっと。"
212200-160 = "……。"
212200-161 = "チナツが戦う姿を見ました。"
212200-162 = ""
212200-164 = ""
212200-165 = "ヒナ風紀委員長に立ち向かい、苦しみながらも銃を構える姿を。"
212200-166 = "己の信じる道を進み、道理に外れたことに抗うチナツを……私は見ました。"
212200-167 = "そ、それは……。"
212200-168 = "以前、あなたが風紀委員会に行くと言った時、私は道を違えてしまったように受け止めていました。"
212200-169 = "ですが、今回の件でようやく気づきました。#nあなたは風紀委員会という名の救急隊員になって、道を見失っていた私を正しい場所へ搬送してくれたのだと。"
212200-170 = "ありがとうございます。あなたが私の後輩であることを、誇りに思いますよ、チナツ。"
212200-171 = ""
212200-173 = ""
212200-174 = "あなたは私が教えたすべてを超えて、最も完璧な応急処置を成し遂げました。"
212200-175 = ""
212200-177 = ""
212200-178 = ""
212200-179 = ""
212200-180 = "……よかったです。本当に、先輩が戻ってきてくださってよかった。"
212200-181 = "ふふっ……。"
212200-182 = ""
212200-184 = ""
212200-185 = "さあ、搬送は終わりましたから、次はリハビリ治療を始めなければなりませんね。"
212200-186 = "二度とあんな事が起こらないように、#n風紀委員会と救急医学部の合同点検を提案するつもりです。"
212200-187 = "私からもお伝えします。委員長、きっと喜ばれますよ。"
212200-188 = "……改めて、私の心を正しい方向へ導いてくれてありがとうございました。"
212200-189 = ""
212200-191 = ""
212200-192 = "セナ先輩も……。"
212200-193 = "私を信じてくださって……ありがとうございます。"
212200-199 = ""
212200-200 = "いっちょ上がり！#n次！次はどこ！？"
212200-201 = "のんびりなんてしてらんない！#nまだ見ぬ温泉が私たちを待っているのだから！"
212200-202 = "最近さ、攻撃だの何だのって、ほんっと馬鹿みたいだったよね。#n温泉より大事なものなんてないのに！"
212200-203 = "そうだそうだー！"
212200-204 = ""
212200-206 = ""
212200-207 = ""
212200-208 = "わぁ～！良い温度だし、湧き出す勢いもすっごい！最高の温泉だ～！"
212200-209 = "やっぱり部長の言う通りだったね！"
212200-210 = "ハーッハッハッハ！当然だとも。我々は己が力で掘り当てられるのだ。"
212200-211 = "……だから、あの地図のことは忘れていいぞ。"
212200-212 = "地図……？#nあっ、あったね！忘れてた！"
212200-213 = "ははっ。つまりはその程度の代物だったということさ。#n気にかける必要もない。"
212200-214 = "あー……でも、それで思い出したんだけどさ……#n何であんな気持ちになってたんだろ？"
212200-215 = "ゲヘナのためとか……役に立ちたいとかさ。"
212200-216 = "それは――"
212200-217 = "だけど、もうどうでもいいんだ！"
212200-218 = "私、難しい話はよく分かんないし。わくわくしないもん！"
212200-219 = ""
212200-221 = ""
212200-222 = "ああ、そうだな。面白みなんてありはしないさ。何一つ、な。"
212200-223 = "私たちには部長がいるから大丈夫！"
212200-224 = "……。"
212200-225 = "メグ。別に、私の言う通りにばっかりする必要はないんだ。"
212200-226 = "え？"
212200-227 = "それでは、[ruby=あれ]洗脳[/ruby]と変わらなくなってしまうからな……。"
212200-228 = ""
212200-230 = ""
212200-231 = "大事なのは、メグが何をしたいかだ。"
212200-232 = "も～、何度も聞いてるよ、それ。"
212200-233 = "な～んにも心配しなくていいよ！"
212200-234 = ""
212200-236 = ""
212200-237 = "私が一番やりたいのは、部長と――みんなと一緒にいることだもん！"
212200-238 = "みんなで温泉掘って、おいしいもの食べて、建物も建てて。#n私はそういうのが好き！これからもずーっとそうしてたい！"
212200-239 = ""
212200-241 = ""
212200-242 = ""
212200-243 = "ははっ！ハーハッハッハッハ！"
212200-244 = "そこまで言われちゃあ仕方ない。この私が叶えてやろうじゃないか。"
212200-245 = "うん！いつもありがとう、部長！"
212200-246 = ""
212200-250 = ""
212200-251 = ""
212200-252 = "そうだそうだ！よく言ったぞメグ班長！#nみんな！私たちは誰だ――！？"
212200-253 = "温泉開発部！！"
212200-254 = "そこに温泉があるから我々がいる！"
212200-255 = "いや、たとえ温泉がなくとも我々がいる！！"
212200-256 = "さあ、次の場所へ移動だ！#n今日中にあと5つは温泉を掘るからな！1秒たりとて無駄にはできないぞ！"
212200-257 = ""
212200-259 = ""
212200-260 = ""
212200-261 = ""
212200-262 = ""
212200-263 = "……部長？行かないの？"
212200-264 = "ん？ああ。少し考えたいことがあるんだ。#n後で追いつくから、先に行っててくれ。"
212200-265 = "分かった！気をつけて来てね！下り道は危ないから！"
212200-266 = "ああ、心配してくれてありがとな、メグ。じゃあまた後でな。"
212200-267 = ""
212200-269 = ""
212200-270 = "さて……。"
212200-271 = "今回の一件……どこか懐かしさがあった。"
212200-272 = "目的も、やり口も、「あっち」を彷彿とさせるような……。"
212200-273 = "あいつらが動いてるという前提で考えると――"
212200-274 = "ふーむ、私の身が危ないな。"
212200-275 = "引っかかる点は多すぎて困るんだが、さてどうしたものか。"
212200-276 = "面倒事に巻き込まれる予感しかないが……。"
212200-277 = ""
212200-280 = "うわっ、寒っ！やっぱ山頂だからかな？"
212200-281 = "はっ！どれだけ冷たい風が吹こうが、地の底から煮えたぎる私たちの熱は冷ませない！"
212200-282 = ""
212200-284 = ""
212200-285 = "ああ、そうだな。"
212200-286 = ""
212200-288 = ""
212200-289 = "そちらがそのつもりなら……歓迎しよう。"
212200-290 = "[ruby=Bodensatz]ボーデンザッツ[/ruby]の諸君。"
212200-292 = "次回;消えることのない"
