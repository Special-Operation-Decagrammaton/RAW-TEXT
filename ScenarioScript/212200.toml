212200-47 = ""
212200-48 = "Haruna, your table manners are even more impeccable than usual."
212200-49 = "...Why ARE you being so quiet? Should I be concerned?"
212200-50 = ""
212200-52 = ""
212200-53 = "...The charring on the fish skin is uneven. And the tofu pieces were not cut uniformly."
212200-54 = "I mean... I whipped it up in a hurry..."
212200-55 = "Wait, no, no. Why am I trying to defend myself?"
212200-56 = "The effort I put in was to feed you. If you're going to complain, then—"
