[translation]
212200-1 = "第20話;殘留的事物"
212200-3 = ""
212200-4 = "來，味噌湯和烤秋刀魚。"
212200-5 = ""
212200-7 = ""
212200-8 = ""
212200-9 = ""
212200-10 = "哇～是風華做的套餐～！"
212200-11 = "看起來超好吃的！嘿嘿！"
212200-12 = ""
212200-14 = ""
212200-15 = ""
212200-16 = "呵呵，謝謝你，風華同學。"
212200-17 = "謝謝你，風華。"
212200-18 = "雖然我也搞不太懂，自己到底為什麼要做飯給你們吃……"
212200-19 = "不過總不能放著肚子餓的人不管。"
212200-20 = "哎呀，你果然很溫柔呢。"
212200-21 = "可以再麻煩你多加三碗飯嗎？#n我比想像中還要餓呢。"
212200-22 = "好～！馬上就來！跟平常一樣用特大碗裝可以嗎？"
212200-23 = ""
212200-24 = ""
212200-25 = ""
212200-26 = "唔嗯～～～"
212200-27 = ""
212200-29 = ""
212200-30 = "咦？泉，你為什麼拿出特製醬料罐又放回去？"
212200-31 = "嗯……因為我覺得這頓飯不用特地淋醬料也可以。"
212200-32 = "這是風華用心為我們做的飯嘛。直接吃就已經夠好吃了。"
212200-33 = "哇……沒想到泉也會說這種話。#n你平常要不要也試著享受這種純粹的味道？"
212200-34 = ""
212200-36 = ""
212200-37 = "啊，我想到下次要怎麼吃了！#n淳子，把醋薑和花生醬一起……"
212200-38 = "我，我就不用了！先說好我不要……"
212200-39 = ""
212200-41 = ""
212200-42 = "……"
212200-43 = ""
212200-45 = ""
212200-46 = ""
212200-47 = ""
212200-48 = "羽留奈，你今天的用餐態度比平常更加端正呢。"
212200-49 = "就是說啊。#n你為什麼從剛才開始就一句話都不說？這樣我會很不安耶。"
212200-50 = ""
212200-52 = ""
212200-53 = "……秋刀魚皮上的焦痕不太均勻呢。#n味噌湯裡的豆腐大小也參差不齊。"
212200-54 = "唔，那是……因，因為準備得很匆忙，所以沒辦法……"
212200-55 = "等一下。我為什麼要找藉口啊？"
212200-56 = "我難得做給你們吃，要是不想吃的話就……！"
212200-57 = ""
212200-59 = ""
212200-60 = "這才是真正的美食啊。"
212200-61 = ""
212200-63 = ""
212200-64 = ""
212200-65 = ""
212200-66 = ""
212200-67 = "……我一邊享用風華同學為我們準備的這頓飯，一邊不停地思考。"
212200-68 = "思考著我在這裡強迫各位接受、一味主張的那些事。"
212200-69 = "還有我那冷冷地監視著各位阻止錯誤計畫的目光……"
212200-70 = "……"
212200-71 = ""
212200-73 = ""
212200-74 = ""
212200-75 = ""
212200-76 = "足以滋潤我那做出這一切行為的可悲靈魂……"
212200-77 = ""
212200-79 = ""
212200-80 = "風華同學的這桌飯菜，就是如此溫暖。"
212200-81 = ""
212200-83 = ""
212200-84 = "羽留奈……"
212200-85 = "我居然忘記了「所謂的美食，終究是感謝某人的用心」。"
212200-86 = "風華同學細膩的手藝、茱莉同學全心投入的努力……#n對於我忘卻這一切的行為，我在此向各位致歉。"
212200-87 = "……那不是雷帝害的嗎？#n從某個角度來看，你們也是受害者。"
212200-88 = "什麼雷帝的洗腦之類的……我不會拿那種事當藉口。"
212200-89 = "就像羽留奈說的，我們忘記了美食的本分，強迫各位接受控制。"
212200-90 = "光是這點就有太多值得反省的地方了。#n真的……很對不起。"
212200-91 = ""
212200-93 = ""
212200-94 = ""
212200-95 = "現在我才敢說，那時候你們兩個真的很奇怪耶。"
212200-96 = "嗯。我好害怕。#n那樣的美食研一點都不好玩。"
212200-97 = "啊哈哈……那時候我真的以為格黑娜會變得一發不可收拾……"
212200-98 = ""
212200-100 = ""
212200-101 = ""
212200-102 = ""
212200-103 = "讓大家感到不安，真的很對不起。"
212200-104 = ""
212200-106 = ""
212200-107 = ""
212200-108 = "……"
212200-109 = "好了好了！#n明明不是你們的錯，一直垂頭喪氣也沒好處，就到此為止吧！！"
212200-110 = "不過，你們要牢牢記住一件事。"
212200-111 = ""
212200-113 = ""
212200-114 = ""
212200-115 = "要是再這樣，以後我絕對不會再做飯給你們吃了！！知道了嗎？"
212200-116 = ""
212200-118 = ""
212200-119 = ""
212200-120 = "呵呵，那可真是個大問題呢。"
212200-121 = "沒錯！要是再這樣，我跟泉也要自己去吃飯了！"
212200-122 = "所以絕對不可以再那樣哦！知道嗎？我也不會分醬料給你們的！"
212200-123 = "哎呀呀，看來得多鍛鍊一下精神力了。#n讓洗腦什麼的一開始就起不了作用。"
212200-124 = "就這層意義來說，可以再給我一碗嗎？#n畢竟人得吃飯才有力氣嘛★"
212200-125 = "你已經把三碗全部吃完了！？"
212200-126 = "呵呵，好～請稍等一下！"
212200-128 = "（雖然道歉的方式各有不同，但那份心意一定已經確實傳達到了）"
212200-131 = ""
212200-132 = ""
212200-133 = "……"
212200-134 = ""
212200-139 = ""
212200-140 = ""
212200-141 = "瀬奈前輩。"
212200-142 = "是千夏啊。歡迎你來。"
212200-143 = "前輩，您的身體……還好嗎？"
212200-144 = "狀況絕佳。最近也沒有屍體……更正，病患。"
212200-145 = "太好了……"
212200-146 = "但是我的心情並不好。"
212200-147 = "……"
212200-148 = "我都記得……我對千夏說過的那些話。"
212200-149 = "什麼戰爭是醫療行為、出血是必須承受的手術過程……"
212200-150 = "我曾經說出那種侮辱人的詭辯。"
212200-151 = "用發誓守護生命的這張嘴，替大量殺傷辯護……真是不配作為急救醫學部的部長。"
212200-152 = "我知道那並不是前輩的真心話。"
212200-153 = "即使如此，說出口的話也收不回來。"
212200-154 = "什麼伴隨偉大而來的犧牲……真正的醫療是不會把犧牲視為理所當然的。"
212200-155 = "為了阻止哪怕只是一滴不必要的出血而拚命掙扎，這才是我們的本分。"
212200-156 = ""
212200-158 = ""
212200-159 = "前輩一直都有確實做到。而且今後也會繼續做到的。"
212200-160 = "……"
212200-161 = "我看到千夏戰鬥的樣子了。"
212200-162 = ""
212200-164 = ""
212200-165 = "與陽奈風紀委員長對峙，艱難地舉起槍的樣子。"
212200-166 = "我看到了抵抗不正確的事物、朝著自己相信的方向前進的千夏。"
212200-167 = "那，那是……"
212200-168 = "以前你說要離開急救醫學部、去風紀委員會的時候，我以為那是某種形式的離別。"
212200-169 = "但這次的事件讓我明白了。#n千夏成為了名為風紀委員會的救護隊員，將迷失方向的我送回了正確的位置。"
212200-170 = "謝謝你。我很驕傲你是我的後輩，千夏。"
212200-171 = ""
212200-173 = ""
212200-174 = "你超越了我所教的一切，完成了最完美的急救處置。"
212200-175 = ""
212200-177 = ""
212200-178 = ""
212200-179 = ""
212200-180 = "……太好了。前輩能回來，真的太好了。"
212200-181 = "呵呵……"
212200-182 = ""
212200-184 = ""
212200-185 = "好了，既然轉送已經結束，現在就得開始復健治療了。"
212200-186 = "為了不再出現眼神那麼奇怪的前輩，#n我打算提議由風紀委員會和急救醫學部聯合檢查。"
212200-187 = "……好的！我一定會轉達。委員長也會很高興的。"
212200-188 = "再一次謝謝你，將我的心引導到了正確的方向，千夏。"
212200-189 = ""
212200-191 = ""
212200-192 = "瀬奈前輩也是……"
212200-193 = "瀬奈前輩……謝謝您一直這麼相信我。"
212200-199 = ""
212200-200 = "好～下一個是哪裡！"
212200-201 = "現在不是閒著的時候！#n那些一直沒能挖的溫泉正在等著我們呢！"
212200-202 = "什麼戰爭不戰爭的，真是太蠢了。#n還有什麼比挖溫泉更重要的？"
212200-203 = "哈哈哈！沒錯，沒錯！"
212200-204 = ""
212200-206 = ""
212200-207 = ""
212200-208 = "哇～果然照佳澄部長說的做，就挖到最高級的溫泉了！"
212200-209 = "不只水溫很棒，湧出的氣勢也超強的！"
212200-210 = "哈～哈哈哈，沒錯～這種好地點還有非常多呢！"
212200-211 = "所以那張藏寶圖現在可以忘掉了，惠。"
212200-212 = "啊，那個？我完全忘記了耶！"
212200-213 = "哈哈，那就好。就把它拋到腦後吧。"
212200-214 = "不過話說回來～以前為什麼會有那種想法呢？"
212200-215 = "像是為了格黑娜……或是想對戰爭有所幫助之類的。"
212200-216 = "那是……"
212200-217 = "不過現在完全不會那樣想了！"
212200-218 = "我不太懂困難的話題～而且那種東西也不怎麼有趣嘛！"
212200-219 = ""
212200-221 = ""
212200-222 = "啊啊，是啊。那種東西一點都不有趣。"
212200-223 = "而且我們該做什麼，佳澄部長都會告訴我們吧？所以沒問題的！"
212200-224 = "……"
212200-225 = "其實，你不需要只照我說的去做。"
212200-226 = "咦？"
212200-227 = "畢竟那樣的話，就跟那種洗腦沒什麼兩樣了……"
212200-228 = ""
212200-230 = ""
212200-231 = "重要的是惠想做什麼。"
212200-232 = "啊～這是佳澄部長常說的話呢。"
212200-233 = "耶嘿嘿，那樣的話就不用擔心了！"
212200-234 = ""
212200-236 = ""
212200-237 = "因為我最想做的事，就是和佳澄部長～還有部員們在一起！"
212200-238 = "大家一起挖溫泉、吃好吃的東西、蓋建築物～#n我喜歡那樣！以後也想一直那樣下去！"
212200-239 = ""
212200-241 = ""
212200-242 = ""
212200-243 = "哈哈，沒錯！看來是我白操心了啊！"
212200-244 = "惠想做的事我都會想辦法幫你實現的，別擔心！"
212200-245 = "嗯！耶嘿嘿。一直以來謝謝你。"
212200-246 = ""
212200-250 = ""
212200-251 = ""
212200-252 = "沒錯！說得好，惠班長！我們是誰？"
212200-253 = "溫泉開發部！！"
212200-254 = "哈～哈哈！只要有溫泉在就有我們在！"
212200-255 = "不，就算溫泉不在我們也在！"
212200-256 = "好～大家移動到下一個作業地點！#n今天之內要挖5個溫泉，得加緊腳步才行！"
212200-257 = ""
212200-259 = ""
212200-260 = ""
212200-261 = ""
212200-262 = ""
212200-263 = "咦，佳澄部長不走嗎？"
212200-264 = "啊。我有點事想思考一下，晚點再過去。"
212200-265 = "嗯！我知道了。那你過來的時候要小心！下山的路很陡哦！"
212200-266 = "好，謝謝你的關心，惠。待會見。"
212200-267 = ""
212200-269 = ""
212200-270 = "……"
212200-271 = "這次的事件……總覺得有種熟悉的感覺。"
212200-272 = "手法和作風都讓人聯想到「那邊」……"
212200-273 = "如果假設是那些傢伙在行動的話……"
212200-274 = "……最先有危險的就是我自己了啊。"
212200-275 = "而且令人在意的地方也太多了，真傷腦筋。該怎麼辦呢？"
212200-276 = "唉，直覺告訴我以後會被捲入更麻煩的事啊。"
212200-277 = ""
212200-280 = "嗚哇，風好冷！果然是因為在山頂嗎？"
212200-281 = "哈！不管吹來多冷的風，都無法冷卻我們從地底沸騰而上的熱情！"
212200-282 = ""
212200-284 = ""
212200-285 = "哈哈，是啊。沒有什麼能冷卻我們的熱情。"
212200-286 = ""
212200-288 = ""
212200-289 = "好了……想來就放馬過來吧。"
212200-290 = "「[ruby=Bodensatz]沉澱者[/ruby]」的傢伙們。"
212200-292 = "下一話;不會熄滅的"
