[translation]
212200-1 = "제20화;남은 것들"
212200-4 = "자, 미소장국이랑 꽁치구이야."
212200-10 = "와~ 후우카가 차려주는 정식~!"
212200-11 = "진짜 맛있겠다! 헤헷!"
212200-16 = "후후, 고마워요. 후우카 씨."
212200-17 = "감사합니다, 후우카."
212200-18 = "……뭐가 예쁘다고 밥을 해준 건지 나도 잘 모르겠지만."
212200-19 = "배고프다는 사람을 그냥 둘 수는 없으니까."
212200-20 = "어머. 역시 상냥하셔라."
212200-21 = "혹시 세 공기만 더 부탁드려도 될까요? 생각보다 허기가 꽤 진 상태라서요."
212200-22 = "네에~! 금방 드릴게요! 평소처럼 대형 보울에 드리면 될까요?"
212200-26 = "……음~~~"
212200-30 = "어? 이즈미, 왜 특제 소스통을 꺼내다가 말아?"
212200-31 = "으응, 이 식사에는 굳이 소스를 뿌리지 않아도 될 것 같아서."
212200-32 = "후우카가 정성들여 만들어준 밥이잖아. 그냥 이대로도 충분히 맛있어."
212200-33 = "우와…… 이즈미가 이런 말을 할 줄이야. 평소에도 그렇게 순수한 맛을 즐겨보면 어떨까?"
212200-37 = "앗, 다음에는 어떤 식으로 먹을지 생각났어! 준코, 초생강이랑 땅콩버터를 함께……"
212200-38 = "나, 난 괜찮으니까! 먼저 사양해 둘게……."
212200-42 = "……."
212200-48 = "하루나, 오늘은 평소보다 더 정중한 식사 태도네요."
212200-49 = "……그러니까. 왜 아까부터 한 마디도 안 하는 거야? 불안하다고."
212200-53 = "……꽁치 껍질의 그을린 자국이 균일하지 않군요. 장국 속에 든 두부의 크기도 제각각이고요."
212200-54 = "읏, 그건…… 그, 급하게 준비하다 보니 어쩔 수 없이……"
212200-55 = "잠깐. 내가 왜 변명을 하고 있는 거야?"
212200-56 = "기껏 차려줬더니, 먹기 싫으면……!"
212200-60 = "이것이야말로 미식이군요."
212200-67 = "……후우카 씨가 차려주신 이 식사를 먹으며, 계속 생각하고 있었습니다."
212200-68 = "제가 이곳에서 여러분에게 강요하고, 주장했던 것들을 말이에요."
212200-69 = "그리고, 잘못된 계획을 막기 위한 여러분의 노력을 차갑게 감시했던 저의 눈길……."
212200-70 = "……."
212200-76 = "그 모든 행동을 저지른 제 못난 영혼을 적실 만큼……"
212200-80 = "후우카 씨의 이 밥상은 따뜻하군요."
212200-84 = "하루나……."
212200-85 = "미식은 결국, 누군가의 정성에 감사하는 일이라는 것을 잊고 있었습니다."
212200-86 = "후우카 씨의 섬세한 손길, 주리 씨의 헌신적인 노력……#n그 모든 것을 망각했던 제 행동에 대해 사과드리겠습니다."
212200-87 = "……뭐, 그건 뇌제 때문이라고 했잖아. 어떻게 보면 너희도 피해자인걸."
212200-88 = "뇌제의 세뇌니, 뭐니…… 그런 것으로 변명하지 않겠어요."
212200-89 = "하루나가 말했듯, 저희는 미식의 본분을 잊고 여러분에게 통제될 것을 강요했어요."
212200-90 = "그것만으로도 반성할 여지는 차고 넘치지요. 정말…… 죄송했습니다."
212200-95 = "이제야 말하지만, 그때 둘 진짜 이상했다고."
212200-96 = "으응. 난 무서웠어. 그런 미식연은 별로 재미있지 않아."
212200-97 = "아핫…… 그때는 정말 게헨나가 어떻게 되어버리는 게 아닌가 했네요……."
212200-103 = "불안하게 만들어서 미안해요. 모두들."
212200-108 = "……."
212200-109 = "에잇! 너희들 탓도 아닌 걸 가지고 축 처져있어봤자 좋을 것도 없으니까, 이제 그만!!"
212200-110 = "대신, 이거 한 가지만 명심하라고."
212200-115 = "또 그러면, 다음부터는 절대 밥 안 줄 거니까!! 알겠어?"
212200-120 = "후후, 그건 정말 큰 문제가 되겠네요."
212200-121 = "맞아! 또 그러면 이즈미랑 나도 따로 밥 먹으러 다닐 거야!"
212200-122 = "그러니까 절대 그러면 안 돼! 알겠지? 소스도 안 나눠줄 거야!"
212200-123 = "어머나. 좀 더 정신력을 길러야겠는걸요. 세뇌 따위는 애초에 통하지 않게끔 말이에요."
212200-124 = "그런 의미에서, 리필 가능할까요? 사람은 밥심이라고 하잖아요★"
212200-125 = "그걸 벌써 다 먹었다고?!"
212200-126 = "후후, 네~ 잠시만 기다리세요!"
212200-128 = "(사과의 방식은 저마다 다르지만, 그 마음은 틀림없이 제대로 전해졌을 것이다.)"
212200-133 = "……."
212200-141 = "세나 선배."
212200-142 = "치나츠군요. 어서오세요."
212200-143 = "선배, 몸은…… 좀 어떠신가요?"
212200-144 = "절호조입니다. 최근 시체…… 아니, 환자도 없었고요."
212200-145 = "다행……"
212200-146 = "하지만, 제 마음은 그렇지 않군요."
212200-147 = "……."
212200-148 = "기억하고 있습니다. 제가 치나츠에게 했던 이야기들을요."
212200-149 = "전쟁은 의료 행위라느니, 출혈은 감수해야 할 수술 과정이라느니……"
212200-150 = "그런 모욕적인 궤변을 늘어놓았던 것을요."
212200-151 = "생명을 지키겠다고 맹세한 입으로 대량 살상을 정당화하다니……#n응급의학부 부장으로서 실격입니다."
212200-152 = "그건 선배의 본심이 아니었잖아요. 알고 있어요."
212200-153 = "그렇다 하더라도 입 밖으로 내뱉은 말을 주워 담을 수 있는 건 아닙니다."
212200-154 = "위대함에 따르는 희생이라니…… 진정한 의료는 희생을 당연하게 여기지 않잖습니까."
212200-155 = "단 한 방울의 불필요한 출혈도 막기 위해 발버둥 치는 것이 우리의 본분일 텐데요."
212200-159 = "선배는 충분히 그렇게 하고 계셨어요. 그리고, 앞으로도 그러실 거고요."
212200-160 = "……."
212200-161 = "치나츠가 싸우는 모습을 봤습니다."
212200-165 = "히나 선도부장과 맞서 힘겹게 총을 들어 올리는 모습을요."
212200-166 = "올바르지 못한 것에 저항하고, 자신이 믿는 것을 향해 나아가는 치나츠를 봤습니다."
212200-167 = "그, 그건……."
212200-168 = "예전에 당신이 응급의학부를 떠나 선도부로 가겠다고 했을 때, 저는 그것이 어떤 이별의 일종이라고 생각했습니다."
212200-169 = "하지만 이번에 깨달았어요. 치나츠는 선도부라는 이름의 구급대원이 되어, 길을 잃고 헤매던 저를 올바른 자리로 이송해 주었습니다."
212200-170 = "고맙습니다. 당신이 제 후배라는 사실이 자랑스럽습니다, 치나츠."
212200-174 = "당신은 제가 가르친 모든 것을 뛰어넘어, 가장 완벽한 응급 처치를 완수했습니다."
212200-180 = "……다행이에요. 정말로, 선배가 돌아와 줘서 다행이에요."
212200-181 = "후훗……."
212200-185 = "자, 이송은 끝났으니 이제 재활 치료를 시작해야겠군요."
212200-186 = "다시는 그런 이상한 눈을 한 선배가 나타나지 않도록, 선도부와 응급의학부의 연합 점검을 제안하겠습니다."
212200-187 = "……네! 꼭 말씀드릴게요. 부장님도 좋아하실 거예요."
212200-188 = "다시 한번, 옳은 방향으로 제 마음을 이끌어주어서 감사합니다, 치나츠."
212200-192 = "세나 선배도……"
212200-193 = "항상 그렇게 저를 믿어주셔서…… 감사해요. 세나 선배."
212200-200 = "자~ 다음은 어디냐!"
212200-201 = "이러고 있을 때가 아냐! 그동안 못 팠던 온천들이 우리를 기다린다고!"
212200-202 = "전쟁이니 뭐니, 너무 바보 같았지. 이것보다 더 중요한 게 어디 있어?"
212200-203 = "크핫핫! 맞지, 맞지!"
212200-208 = "와~ 역시 카스미 부장 말대로 하니까 최고급 온천이 나왔어!"
212200-209 = "수온도 좋고, 용출량도 기세가 엄청 좋아!"
212200-210 = "크하핫, 그렇지~ 이런 좋은 포인트가 아직도 아주 많단 말이야!"
212200-211 = "그러니 그 보물 지도는 이제 잊어버려도 돼, 메구."
212200-212 = "아, 그거? 나 완전 까먹었었네!"
212200-213 = "크큭, 그럼 됐어. 그냥 날려버리라고."
212200-214 = "근데, 그러고 보니까~ 예전에는 왜 그런 생각을 했던 걸까?"
212200-215 = "게헨나를 위한 일이라든가…… 전쟁에 도움이 되고 싶다거나 말이야."
212200-216 = "그건……."
212200-217 = "그런데. 지금은 그런 생각이 하나도 안 들어!"
212200-218 = "나는 어려운 이야기 잘 모르고~ 별로 재미도 없거든! 그런 거!"
212200-222 = "아아, 그래. 그런 거 하나도 재미없다고."
212200-223 = "그리고, 우리가 뭘 해야 할지는 어차피 카스미 부장이 알려줄 거잖아? 그러니 괜찮아!"
212200-224 = "……."
212200-225 = "사실, 내가 말하는 대로만 할 필요는 없어."
212200-226 = "어?"
212200-227 = "그래서야 그 세뇌와 다를 게 없으니까 말이지……."
212200-231 = "아무튼 중요한 건 메구가 뭘 하고 싶은지야."
212200-232 = "아~ 항상 카스미 부장이 하는 말이구나."
212200-233 = "헤헷, 그런 거라면 걱정 안 해도 돼!"
212200-237 = "내가 가장 하고 싶은 건 카스미 부장이랑~ 우리 부원들과 같이 있는 거니까!"
212200-238 = "다 같이 온천도 파고, 맛있는 걸 먹고, 건물도 세우고~ 나는 그런 게 좋아!#n앞으로도 계속 그러고 싶어!"
212200-243 = "크큭, 맞아! 내가 괜한 걱정을 했구만?"
212200-244 = "메구가 하고 싶은 일은 내가 어떻게든 이뤄줄 테니까, 걱정 말고!"
212200-245 = "응! 헤헤. 항상 고마워."
212200-252 = "그래! 말 잘했어, 메구 반장! 우리가 누구?"
212200-253 = "온천개발부!!"
212200-254 = "와핫핫! 거기에 온천이 있으니까 우리들이 있다!"
212200-255 = "아니, 비록 온천이 없어도 우리들이 있다!!"
212200-256 = "자~ 다들 다음 작업 장소로 이동! 오늘 안에 온천 5개를 파려면 바쁘게 움직여야 하니까!"
212200-263 = "어, 카스미 부장은 안 가?"
212200-264 = "아. 난 잠깐 생각할 것이 있어서 천천히 갈게."
212200-265 = "응! 알겠어. 그럼 조심해서 와! 내려가는 길이 험해!"
212200-266 = "그래, 걱정해 줘서 고마워. 메구. 이따 봐."
212200-270 = "……."
212200-271 = "이번의 사건…… 왠지 익숙한 느낌이 든단 말이야."
212200-272 = "방식이나 하는 짓거리가 '그쪽'을 떠올리게 하는데……."
212200-273 = "그 녀석들이 움직이고 있다고 가정해서 생각해 보면……."
212200-274 = "……일단 나부터 위험하고. 끄응."
212200-275 = "그 외에도 이것저것, 걸리는 부분들이 너무 많아서 문제인데. 어떻게 한다?"
212200-276 = "하아, 앞으로 더 골치 아픈 일에 엮일 것 같은 직감이 드는구만."
212200-280 = "우왓, 바람이 차다! 역시 산 정상이라 그런가?"
212200-281 = "하! 아무리 차가운 바람이 불어온다고 해도, 땅 밑에서 끓어오르는 우리의 열기마저 식힐 수는 없다 이거야!"
212200-285 = "크큭, 그래. 우리의 열기를 식힐 수는 없겠지."
212200-289 = "자아…… 올 테면 와봐라."
212200-290 = "<보덴사츠> 녀석들아."
212200-292 = "다음화;꺼지지 않는"
