[translation]
901010800350-6 = "To summarize the logistics data I found at the loading dock..."
901010800350-7 = "As we expected, this Carpaccio Family branch's primary income comes from working as security for the port."
901010800350-8 = "However, it seems that they barely made a profit after labor costs and the boss taking a substantial cut."
901010800350-9 = "What's odd is that they've been cutting down on fixed expenses. They've been saving up for months."
901010800350-10 = "Buying lots of crab they won't eat, combined with cutting down on expenses... One wonders what the goal is."
901010800350-11 = "Maybe they have something expensive coming up. Like a big event, just to show everyone how powerful they are."
901010800350-12 = "It's obvious."
901010800350-13 = "We heard this during breakfast. The Carpaccio Family only has one major concern."
901010800350-14 = "They're hoarding their money so they can..."
901010800350-15 = ""
901010800350-17 = ""
901010800350-18 = ""
901010800350-21 = ""
901010800350-22 = "#Q;오토기;They're hoarding their money so they can...\n[as2] \"Pay tribute to the boss.\"\n[as3] \"Buy a limited-edition transforming robot.\"\n[as1] \"Bid for a contract renewal with the port.\""
901010800350-23 = "Right. The Carpaccio Family's contract will be up for renewal soon."
901010800350-24 = "Though I don't know the exact numbers, I'm sure they need a lot."
901010800350-25 = "And since the bidding is held at auction, the price might end up being much more expensive than expected."
901010800350-27 = "That's enough of a reason to save up."
901010800350-28 = "Ah. While they pay a hefty sum to the Carpaccio boss, that's more of a fixed expense."
901010800350-29 = "That wouldn't explain them only saving for the past few months."
901010800350-30 = "I'm sure they intend to use that money for something else."
