[translation]
901010800350-6 = "關於在裝卸區發現的物流資料……"
901010800350-7 = "這個地區的卡爾帕喬家族分派的主要收入來源……#n不出所料，來自於港口委託承辦警備業務所支付的費用。"
901010800350-8 = "不過扣除人事成本和上繳給首領的繳納金之後，似乎所剩無幾。"
901010800350-9 = "然而奇怪的是最近幾個月，他們一邊削減固定支出一邊增加持有資金。"
901010800350-10 = "明明削減了必要的支出，卻大量買進不打算食用的螃蟹……到底有什麼目的呢？"
901010800350-11 = "看來是有什麼需要花費大筆資金的計畫吧？#n例如足以展示他們影響力的大型活動之類的。"
901010800350-12 = "這不是很明顯嗎。"
901010800350-13 = "昨天在店裡也聽到了，目前卡爾帕喬家族最大的煩惱只有一個。"
901010800350-14 = "他們籌備資金的目的，大概是……"
901010800350-15 = ""
901010800350-17 = ""
901010800350-18 = ""
901010800350-21 = ""
901010800350-22 = "#Q;오토기;他們籌備資金的目的，大概是……\n[as2] 為了湊齊要上繳給首領的繳納金。\n[as3] 為了購買限定版變形機器人。\n[as1] 為了在與港口的續約中支付委託金。"
901010800350-23 = "沒錯，卡爾帕喬家族正面臨著港口的定期招標。"
901010800350-24 = "雖然還沒掌握到確切的金額，但投標應該需要一筆龐大的資金。"
901010800350-25 = "而且公開招標採用競標方式，所以投標成本說不定會比預期中更高。"
901010800350-27 = "原來如此，確實足以構成拚命存錢的理由呢。"
901010800350-28 = "啊，雖然上繳給卡爾帕喬首領的繳納金也不是小數目……#n不過那筆費用一開始就已經被列為固定支出了。"
901010800350-29 = "因此和最近開始籌備資金的原因無關。"
901010800350-30 = "卡爾帕喬家族之所以籌措資金，應該是為了其他目的才對。"
901010800350-31 = ""
901010800350-33 = ""
901010800350-35 = ""
901010800350-36 = ""
901010800350-39 = ""
901010800350-41 = ""
901010800350-42 = "變形機器人……是嗎？"
901010800350-43 = "怎麼可能？話說，買變形機器人有需要花那麼多錢嗎？"
901010800350-44 = "玩具就算再怎麼貴，花個一萬元左右也夠了吧？"
901010800350-45 = ""
901010800350-47 = ""
901010800350-48 = "……你是不是太小看大人的世界了，FOX3？"
901010800350-49 = ""
901010800350-51 = ""
901010800350-52 = "看看最近推出的限定版機器人，可是連數字的位數都不一樣哦。"
901010800350-53 = ""
901010800350-55 = ""
901010800350-56 = "這是什麼啊！？是不是把學園一整年的營運資金寫錯地方了啊！？"
901010800350-57 = "如果有這筆錢就能買好幾把新槍──不對，甚至能把我們小隊的裝備全部換新了。"
901010800350-58 = "當然，我明白世上有數不清的昂貴收藏品。"
901010800350-59 = "然而就算是卡爾帕喬家族，要使用公款購買嗜好品應該也會有各種難處吧。"
901010800350-60 = "還請您想想其他的原因。"
