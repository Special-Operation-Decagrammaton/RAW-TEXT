[translation]
901010800350-6 = "하역장에서 발견한 물류 데이터의 내용을 정리하자면……"
901010800350-7 = "이곳 카르파초 패밀리 지부의 주수입원은 예상대로 항구에서 경비 업무를 위탁받은 대가로 지불되는 용역비였어."
901010800350-8 = "물론 인건비와 보스에게 상납하는 비용을 제외하면 거의 남는 건 없어 보였지만."
901010800350-9 = "그런데 이상한 점은 최근 몇 달 사이 고정 지출을 줄여 가며 보유금을 늘리고 있다는 거야."
901010800350-10 = "먹지도 않을 대량의 게를 사들이면서도 필요한 지출은 줄이다니…… 도대체 목적이 뭘까?"
901010800350-11 = "뭔가 크게 돈 나갈 일이라도 있는 모양이지? 자신들의 영향력을 과시할 만한 거대한 이벤트라든가."
901010800350-12 = "뻔하지, 뭐."
901010800350-13 = "어제 가게에서 듣기도 했지만, 현재 카르파초 패밀리의 가장 큰 고민거리는 하나뿐이야."
901010800350-14 = "그들이 돈을 모으고 있는 이유는 아마도—"
901010800350-22 = "그들이 돈을 모으고 있는 이유는 아마도—\n[as2] \"보스에게 지불할 상납금을 모으기 위해.\"\n[as3] \"한정판 변신 로봇을 구입하기 위해서.\"\n[as1] \"항구와의 재계약에서 위탁금을 내기 위해.\""
901010800350-23 = "맞아. 카르파초 패밀리는 항구와의 재계약을 앞두고 있지."
901010800350-24 = "정확한 액수는 파악하지 못했지만, 입찰에는 제법 큰 금액의 위탁금이 필요할 거야."
901010800350-25 = "게다가 공개 입찰은 경매 방식을 택하니, 예상보다 입찰 비용이 더 높아질지도 모르지."
901010800350-27 = "과연, 악착같이 돈을 모을 만한 이유는 충분하네."
901010800350-28 = "아. 카르파초의 보스에게 지급하는 상납금도 액수가 꽤 되지만, 그 비용은 처음부터 고정 지출로 잡혀 있어요."
901010800350-29 = "따라서 최근 돈을 모으기 시작한 이유와는 무관하죠."
901010800350-30 = "패밀리가 모으고 있는 보유금은 아마 다른 곳에 쓰려는 걸 거예요."
901010800350-42 = "변신 로봇……이요?"
901010800350-43 = "그게 말이 돼? 아니, 애초에 변신 로봇을 사는 데 이만한 돈이 필요하기나 해?"
901010800350-44 = "장난감 정도는 아무리 비싸도 1만 엔이면 살 수 있잖아."
901010800350-48 = "……어른의 세계를 너무 우습게 보는 거 아냐, FOX 3?"
901010800350-52 = "요즘 나오는 한정판 로봇은 애초에 자릿수가 다르다고. 이것 봐."
901010800350-56 = "뭐야, 이거. 학원의 1년 운영 자금을 잘못 표기한 거 아냐?"
901010800350-57 = "이 돈이면 새 총기를 몇 자루나…… 아니, 우리 소대 장비를 전부 갈아치울 수 있을 텐데."
901010800350-58 = "물론 세상에 비싼 애장품이 셀 수 없이 많다는 건 인지하고 있습니다만."
901010800350-59 = "아무리 카르파초 패밀리라 하더라도 공금으로 취미 용품을 사려면 여러 가지 애로 사항이 있겠지요."
901010800350-60 = "다른 이유를 생각해 주셨으면 합니다."
