[translation]
901010800350-6 = "ต่อไปเป็นการสรุปข้อมูลด้านโลจิสติกส์ที่พบในลานขนถ่ายสินค้า..."
901010800350-7 = "อย่างที่คาดไว้ แหล่งรายได้หลักของสาขาการ์ปัชโช่ แฟมิลี่แห่งนี้คือ ค่าจ้างจากการรับงานรักษาความปลอดภัยของท่าเรือ"
901010800350-8 = "แน่นอนว่าเมื่อหักค่าแรงและเงินที่ต้องส่งให้พวกบอสแล้ว ก็แทบไม่เหลือกำไรเลย"
901010800350-9 = "แต่ที่แปลกก็คือ ช่วงไม่กี่เดือนมานี้ พวกเขาลดรายจ่ายประจำลงและเพิ่มเงินทุนสำรองขึ้น"
901010800350-10 = "ทั้งที่ซื้อปูจำนวนมากจนกินไม่หมด แต่กลับลดรายจ่ายที่จำเป็น... ตกลงมีจุดประสงค์อะไรกันแน่?"
901010800350-11 = "คงมีเรื่องที่ต้องใช้เงินก้อนใหญ่สินะ? อย่างเช่นอีเวนต์ใหญ่ๆ ที่ใช้แสดงอิทธิพลของตัวเอง อะไรทำนองนี้น่ะ"
901010800350-12 = "มันก็ชัดเจนอยู่แล้วนี่"
901010800350-13 = "เมื่อวานเราก็ได้ยินมาจากที่ร้าน ว่าตอนนี้ปัญหาใหญ่ที่สุดของการ์ปัชโช่ แฟมิลี่มีอยู่แค่เรื่องเดียว"
901010800350-14 = "เหตุผลที่พวกนั้นกำลังเก็บเงินอยู่ อาจจะเป็น..."
901010800350-15 = ""
901010800350-17 = ""
901010800350-18 = ""
901010800350-21 = ""
901010800350-22 = "#Q;오토기;เหตุผลที่พวกนั้นกำลังประหยัดเงินอยู่ อาจจะเป็นเพราะ...\n[as2] \"เพื่อรวบรวมเงินส่งให้บอส\"\n[as3] \"เพื่อซื้อหุ่นยนต์แปลงร่างรุ่นลิมิเต็ดเอดิชั่น\"\n[as1] \"เพื่อวางเป็นหลักประกันในการต่อสัญญากับท่าเรือ\""
901010800350-23 = "ใช่แล้วละ การ์ปัชโช่ แฟมิลี่กำลังจะต่อสัญญากับท่าเรือ"
901010800350-24 = "ถึงจะยังไม่รู้จำนวนเงินที่แน่ชัด แต่การประกวดราคาน่าจะต้องใช้เงินวางหลักประกันไม่น้อยเลยละ"
901010800350-25 = "นอกจากนี้ การประกวดราคานี้ยังใช้ระบบแข่งขันเสนอราคา งั้นค่าใช้จ่ายก็อาจสูงกว่าที่คาดไว้ก็ได้"
901010800350-27 = "อืม แบบนี้ก็มีเหตุผลมากพอที่ต้องพยายามเก็บเงินอย่างหนักสินะ"
901010800350-28 = "อ้อ ถึงเงินที่ต้องส่งให้บอสของการ์ปัชโช่จะเป็นจำนวนไม่น้อย แต่ค่าใช้จ่ายส่วนนั้นถูกนับเป็น#nรายจ่ายประจำตั้งแต่แรกแล้วค่ะ"
901010800350-29 = "เพราะงั้นก็ไม่ใช่เหตุผลที่พวกเขาเริ่มเก็บเงินหรอกค่ะ"
901010800350-30 = "เงินทุนสำรองที่พวกเขาเก็บสะสมกันอยู่ น่าจะเอาไปใช้กับอย่างอื่นค่ะ"
901010800350-31 = ""
901010800350-33 = ""
901010800350-35 = ""
901010800350-36 = ""
901010800350-39 = ""
901010800350-41 = ""
901010800350-42 = "หุ่นยนต์แปลงร่าง... เหรอคะ?"
901010800350-43 = "ไร้สาระน่า? แล้วการซื้อหุ่นยนต์แปลงร่างมันต้องใช้เงินเยอะขนาดนั้นด้วยเหรอ?"
901010800350-44 = "ถ้าเป็นพวกของเล่น ต่อให้แพงแค่ไหนก็ไม่น่าจะเกิน 10,000 เยนนี่นา?"
901010800350-45 = ""
901010800350-47 = ""
901010800350-48 = "FOX 3 เธอสบประมาทโลกของผู้ใหญ่มากเกินไปหรือเปล่า?"
901010800350-49 = ""
901010800350-51 = ""
901010800350-52 = "หุ่นยนต์รุ่นลิมิเต็ดเอดิชั่นที่วางขายช่วงนี้ ราคามันอยู่กันคนละหลักเลยนะ ดูนี่สิ"
901010800350-53 = ""
901010800350-55 = ""
901010800350-56 = "อะไรเนี่ย? ใส่งบดำเนินงานทั้งปีของโรงเรียนมาผิดหรือเปล่า?"
901010800350-57 = "เงินจำนวนนี้ซื้อปืนใหม่ได้ตั้งหลายกระบอก... ไม่สิ จะเปลี่ยนอุปกรณ์ของพวกเราทั้งกองยังได้เลย"
901010800350-58 = "ฉันก็พอรู้ว่ามีของสะสมราคาแพงอยู่มากมายในโลก"
901010800350-59 = "และต่อให้เป็นการ์ปัชโช่ แฟมิลี่ แต่ถ้าจะเอาเงินส่วนกลางไปซื้อของเพื่องานอดิเรก ก็น่าจะเป็นปัญหาหลายอย่างเลยนะคะ"
901010800350-60 = "ช่วยลองคิดเหตุผลอื่นเถอะค่ะ"
901010800350-61 = ""
