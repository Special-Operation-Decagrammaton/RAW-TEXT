901010800350-52 = "Limited-edition robots nowadays are in a completely different league. Look at these listings."
901010800350-53 = ""
901010800350-55 = ""
901010800350-56 = "Wait, what the..? This could pay a small academy's operational budget!"
901010800350-57 = "We could get the latest firearms... No! We could replace ALL our equipment with this kind of money."
901010800350-58 = "While I am aware that there are countless expensive collectibles in the world..."
901010800350-59 = "It is difficult to justify using communal funds to make personal hobby purchases, even in the Carpaccio Family."
901010800350-60 = "Please consider a different reason."
