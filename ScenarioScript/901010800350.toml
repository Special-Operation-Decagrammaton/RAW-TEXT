901010800350-42 = "A \"transforming robot...\"?"
901010800350-43 = "Do you hear yourself? First of all, they are hoarding a mountain of money."
901010800350-44 = "All that for a toy? How much could it cost? 10,000 yen?"
901010800350-45 = ""
901010800350-47 = ""
901010800350-48 = "...FOX 3, you need to think like an adult. This isn't child's play."
