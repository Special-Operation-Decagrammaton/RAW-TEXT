[translation]
1300306-1 = "스트레스의 원인"
1300306-2 = "트리니티 외곽 상점가"
1300306-3 = "안녕하세요, 선생님."
1300306-4 = "여기서도 우연히 뵙게 되네요."
1300306-5 = "[s] \"하스미……? 무슨 일 있어?\""
1300306-6 = "네? 딱히 일은 없는데…… 왜 그러시죠?"
1300306-7 = "……제가 화가 나 있는 것 같다고요?"
1300306-8 = "아아…… 죄송합니다. 요즘 디저트를 제한하고 있었더니……"
1300306-9 = "스트레스가……."
1300306-10 = "게다가 정의실현부에서는 계속 스트레스가 생기는 일들만 발생하고 있고……."
1300306-11 = "최근엔 두통도 생겨버려서……."
1300306-12 = "……."
1300306-13 = "……전 괜찮습니다."
1300306-14 = "[s] \"하나도 안괜찮아 보이는데.\""
1300306-15 = "그, 그렇습니까……."
1300306-16 = "주변에 걱정을 끼치고 있어서야…… 다이어트의 의미가 없는데……."
1300306-17 = "[s] \"무리하게 다이어트 하지 않아도 괜찮지 않을까?\""
1300306-18 = "네? 그, 그런가요?"
1300306-19 = "하지만…… 저는……."
1300306-20 = "부끄러운 얘기이지만 하늘하늘한 교복을 입은 아가씨들을 볼 때면 어쩐지 자신감이 없어져서……."
1300306-21 = "으. 으음."
1300306-22 = "……선생님은 제가 다이어트하지 않는 게 좋으신가요?"
1300306-23 = "[s1] \"이대로의 하스미가 좋아.\"\n[s2] \"지금도 충분히 좋은데.\""
1300306-24 = "……."
1300306-25 = "……."
1300306-26 = "그런가요."
1300306-27 = "……그렇군요."
1300306-28 = "……후후. 어쩐지 두통이 사라진 것 같은 기분입니다."
1300306-29 = "가시죠. 근처에 맛있는 베이커리 가게가 있는데……."
1300306-32 = "선생님이 보증해주셨으니 오늘은 책임지고 함께 가는 겁니다."
1300306-34 = "(이후, 베이커리 가게로 가서 함께 빵을 잔뜩 먹었다.)"
