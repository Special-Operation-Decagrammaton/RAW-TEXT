[translation]
84300200700-5 = "……다 알고 계셨군요. 그렇다면 이건 더 이상 의미 없겠네요."
84300200700-9 = "……? 뭐야. 트리니티 학생이잖아?"
84300200700-10 = "그것도 그 옷……. 혹시 티파티야?"
84300200700-11 = "높으신 분께서 이런 누추한 곳까지 뭐 하러 행차하셨을까? 앙?"
84300200700-12 = "높은 사람…….이라고 말씀해 주신 것 치고는, 분위기가 여전하시군요."
84300200700-13 = "네, 맞습니다. 트리니티 종합학원의 티파티 소속, 유리조노 세이아라고 합니다. 수상한 움직임을 발견해 쫓고 있었습니다."
84300200700-14 = "……? 뭐? 쫓고 있었다고?"
84300200700-15 = "네가? 그 몸으로?"
84300200700-16 = "……그렇습니다만."
84300200700-17 = "하……! 의외인걸. 생긴 거랑 달리 꽤 대범한 구석이 있었잖아?"
84300200700-18 = "마음에 드네. 우리 학교의 '높으신 분'은 절대 그런 식으로 나서지 않는데 말이지."
84300200700-20 = "틀려. 네루, 나는 그런 게 아니라……."
84300200700-21 = "아, 됐어. 딱히 진짜로 욕하려고 한 말도 아니니까."
84300200700-22 = "그리고 맞고 틀리고를 따지자면 오히려 지금은 네 쪽이 맞는 거 알아. 현장에 나서는 건 적임자가 따로 있는 법이니까."
84300200700-24 = "……응. 그러면 됐어."
84300200700-28 = "그 목소리……. 당신은, 츠카츠키 리오?"
84300200700-29 = "어째서 당신이……. 밀레니엄으로부터 떠난 줄 알고 있었는데요."
84300200700-33 = "사실이야. 그리고 그건 지금도 유효해."
84300200700-34 = "지금의 일은……. 약간의 사정이 있어서 잠깐 방문한 것에 지나지 않아."
84300200700-35 = "나는 오히려 네 쪽을 묻고 싶어, 유리조노 세이아. 어째서 여기에 있는 거지?"
84300200700-36 = "너는……."
84300200700-42 = "……그냥 기계 소리야. 신경 쓸 거 없어."
84300200700-43 = "아무래도 두 사람 모두 일단 이쪽으로 와줘야겠어. 그곳에서 계속 대화를 이어 나가는 건 노출의 위험성이 있으니."
84300200700-47 = "이 녀석도 같이? ……진심으로 하는 말이야?"
84300200700-49 = "(이 녀석…….)"
84300200700-51 = "오히려 지금은 그녀를 혼자 돌려보낼 수 없어. 네루 네가 그녀의 앞에 모습을 드러낸 순간부터, 이 상황은 확정된 거야."
84300200700-52 = "그렇다고 그냥 놔둘 수도 없었잖아, 그 상황에."
84300200700-53 = "아무튼 알았어. 그럼 데리고 가도록 하지."
84300200700-58 = "들었지?"
84300200700-59 = "얌전히 따라오라고. 노파심에 하는 말인데, 쓸데없는 행동은 하지 않는 게 좋아. 그쪽이 티파티건 뭐건, 나는 별로 관심 없으니까."
84300200700-65 = "츠카츠키 리오……. 그렇다는 것은, 저 사람은 미카모 네루……겠군요."
84300200700-66 = "아직 잘 모르겠지만, 분명 보통 일이 아니겠죠."
