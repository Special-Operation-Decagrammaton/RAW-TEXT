[translation]
10057040-1 = "第4話;あなたの言うとおり、だけど私が正しい"
10057040-3 = ""
10057040-4 = "ほ、ほんとーに素晴らしい設計ね。エリナって……さ、最高……！"
10057040-6 = ""
10057040-8 = ""
10057040-9 = "うぅっ……なんかゾワッときた……ヘドが出そう……。"
10057040-10 = "先生に言われた通りにしているんでしょうが！"
10057040-11 = "先生、本当にこれでいいんですか！？"
10057040-12 = "[s] \"いい感じだね。もう少しやってみようか？\""
10057040-14 = "流石です、先生。まさか、こんなアプローチがあるとは。"
10057040-15 = "勝率が五分五分を維持しているなら、「RWWE」を経なくても――"
10057040-16 = "お互い、順番に相手の意見に同意していけばいい……。"
10057040-17 = "なんて効率的な解決策でしょうか。"
10057040-19 = "でもこんなに褒める必要ありますか！？"
10057040-20 = "無理矢理褒められても、気持ち悪いだけなんですけど～！！"
10057040-21 = "[s1] \"親しき仲にも礼儀ありってね。\"\n[s2] \"褒められて害になることもないし。\""
10057040-22 = ""
10057040-23 = ""
10057040-25 = ""
10057040-27 = "友達ではありません！！"
10057040-28 = ""
10057040-31 = ""
10057040-33 = ""
10057040-34 = "今回は双方の意見が一致したことにより、勝負は不成立。"
10057040-35 = "……2人とも、先生の言うとおりにして。"
10057040-36 = "私は、2人に喧嘩して欲しくない。#nそれに、今回は何としてでも3人で力を合わせて結果を出したい。"
10057040-37 = "みんな能力があるのだから、誰が正しいかなんかで争って時間を無駄にしたくない。"
10057040-38 = ""
10057040-41 = ""
10057040-42 = "そ、それはそうね。先生もお忙しいのにここまで来てくださったんだし……。"
10057040-43 = "分かった、とりあえず休戦ね。これからは順番に同意するってことで～"
10057040-44 = "[s] （立派だなと思い、笑みを浮かべる）"
10057040-45 = "じゃあ、続けるわね。私はエンジン室のカバー、無しでいきたい。"
10057040-46 = "うぇぇっ！？ど、どうして？エンジンは保護しないと！"
10057040-47 = "そうだけど……#nエンジンの状態を見る計器がないから、操縦手が直接見るのが良いと思う。"
10057040-48 = "リビルトエンジンを使うから、#nどちらにしろエンジンの振動は見ておかないといけないし。"
10057040-49 = "う～ん……ひとまず同意することにしちゃったからなぁ。ぐうぅ……。"
10057040-50 = "んじゃ、エンジンはガソリンね。#nオクタン価の管理が問題だけど、私が添加剤を作ればいーよね？#nここをこうして……。"
10057040-51 = "それならそこにスーパーチャージャーを付けたら……。"
10057040-53 = ""
10057040-55 = ""
10057040-56 = "……。"
10057040-57 = "先生、少しこちらに来てください。"
10057040-58 = "2人とも、設計の話に夢中のようなので。"
10057040-64 = "[ns] \"吹雪がやんだね。\""
10057040-65 = "はい。ここはレッドウィンターで一番高い山の麓なので、吹雪は日常茶飯事です。"
10057040-66 = "しかし、昨日の吹雪は想定以上に激しく……先生を危険にさらしてしまいました。"
10057040-67 = "ここに謝罪を。#nそして、ありがとうございます。"
10057040-68 = "[s3] \"生徒の頼みなら、7万5千メートル上でも駆けつけるよ！\"\n[s4] \"生徒の頼みなら、マイナス60度でもへっちゃらだよ！\""
10057040-71 = "噂に違わず、先生はどこまでも優しいですね。"
10057040-72 = ""
10057040-74 = ""
10057040-75 = "……ご覧のとおり、あの2人はいつも喧嘩ばかりしています。"
10057040-76 = "アンナとエリナは、私の大事な友達だから……2人が喧嘩するのは、すごく嫌でした。"
10057040-77 = "でも……先生のおかげで、喧嘩は少なくなりそうです。#n本当に、ありがとうございました。"
10057040-78 = "吹雪はしばらく収まるようなので、お見送りします。"
10057040-79 = "[s] \"このまま帰って、大丈夫そう？\""
10057040-80 = "はい。2人とも、先生の言いつけは守ると思うので。"
10057040-81 = "忙しい先生を、ずっとこんな[ruby=へんぴ]辺鄙[/ruby]な所に縛り付けるのは心苦しいです。"
10057040-82 = "来てくださって、ありがとうございます。"
10057040-83 = "[s5] \"戦車が完成するのを見たいな！\"\n[s6] \"ラナたちが予選突破するのを見たいな！\""
10057040-84 = ""
10057040-85 = ""
10057040-87 = ""
10057040-88 = "では、ぜひ見守っていてください。"
10057040-89 = "これから4日間、先生のお時間を無駄にしないよう頑張ります。"
10057040-91 = "ちょっとラナ～！こっち来て～！"
10057040-92 = "これ、分からないから教えて。"
10057040-93 = ""
10057040-95 = ""
10057040-96 = "[ns] \"戻ろうか。\""
10057040-97 = "……はい！"
10057040-111 = ""
10057040-112 = "お疲れ様でした。先生。"
10057040-113 = "今までで一番サクサク進んだんじゃない！？"
10057040-114 = "うぅ……狭いところに入ってたから、肩が痛い……。"
10057040-115 = "先生の作戦、効果てきめんですね。#n今日だけで、先月よりも作業が進みました。"
10057040-116 = "応用機械工学研究所で副所長をしていた時くらいの速度が出ています。"
10057040-117 = "このペースなら期限内に完成するかもしれません。"
10057040-118 = "[s7] \"みんな、お疲れ様！\"\n[s8] \"順調みたいで良かったね！\""
10057040-121 = "何言ってるんですか～、先生のおかげでしょ～？"
10057040-122 = "あ、そうだ！#n183号を導く偉大なる指導者、[ruby=にき]仁木[/ruby]アンナ学級委員長～？"
10057040-123 = "なんか怪しいから、却下。"
10057040-124 = "まだ何も言ってないじゃん！？とりあえず聞いてよ！"
10057040-125 = "あのさ～、先生は183号でお迎えした初めてのVIPでしょ？"
10057040-126 = ""
10057040-128 = ""
10057040-129 = "先月、窓を壊して入ってきた熊はVIPではないと？"
10057040-130 = "熊がVIPなわけないでしょ！？#n勝手に実験中のプリンを全部食べて、窓まで割ってくれたんだから！#nおかげでこっちは風邪ひいちゃったよ！"
10057040-131 = "私にはよくしてくれたよ？とても温かかった。"
10057040-132 = "熊の話はもういいよ！#nとにかく、せっかくVIPが来てるんだから……#n先生にレッドウィンターを紹介しなきゃ！"
10057040-133 = "本音は？"
10057040-134 = "先生と一緒に下山して……カフェとか、アパレルショップに行きたい！"
10057040-135 = "当然、却下。"
10057040-136 = "なんでぇ！？フィールドワークの一環として、実際に体験すれば研究にも役立つのに！"
10057040-137 = "先生！ズナーミャカフェに行きましょう！#nレッドウィンター食品化学のトップ！#n3段のブリヌイは、一食の価値ありです！"
10057040-138 = "[s] \"そんなにオススメなら楽しみだな！\""
10057040-140 = "[ns] \"他には何がおいしいの？\""
10057040-141 = ""
10057040-143 = ""
10057040-144 = "え？あ……えっと……。"
10057040-145 = "2段のブリヌイ……？"
10057040-146 = "とにかく絶対ダメ。無断で抜け出したのがバレたら、懲戒が追加されるでしょ。"
10057040-147 = "それに、フィールドワークより、1行でも多く本を読むほうが役に立つのよ。"
10057040-148 = "やだぁー！！本は真面目な人が読むものでしょ～！？"
10057040-149 = "あなたはちゃんとできる子なんだから、本くらい読みなさい！"
10057040-150 = "んじゃ、多数決で決めよう！#nほら～、ラナも行きたいでしょ？最新の電子機器を見にいこ～よ～！"
10057040-152 = "パンチカードを読み込めない最新のものには興味ない。"
10057040-154 = "ひぃぃぃん……。"
10057040-155 = "[s] \"でもラナは自由に外出しているよね？\""
10057040-156 = ""
10057040-158 = ""
10057040-159 = "そっ、それは……その……ここだけの秘密です！#n絶対に事務局には言わないでくださいね？"
10057040-160 = "ラナは幼く見えるので、事務局の抜き打ち検査に引っかからないんです。"
10057040-161 = "幼い子たちはよく身分証を忘れたり、#nなくしたりするので事務局も検査をしないんです。"
10057040-162 = "童顔なのだと思います。"
10057040-163 = "いやいや、その年で童顔も何もないでしょ……。"
10057040-164 = "うらやまし～よ～、私もラナみたいに小さかったらな～#n自由に外出もできるし……。"
10057040-165 = "ソリを引く子犬にでも変装したらいいんじゃない？"
10057040-166 = "そのうるさい口、溶接する？"
10057040-167 = "……とにかく、ラナは私たちの代わりに山の下で必要な物を買ってきてくれるんです。"
10057040-168 = "今回お使いに出ていって、先生を連れてきた時は本当に驚きました……。"
10057040-169 = "私も行きたいよぉ……。"
10057040-170 = "せんせー……。"
10057040-171 = "先生を巻き込まないで！"
10057040-172 = "名誉ケチ、主席ビビり、説教委員長。"
10057040-173 = "エリナ、いい加減に……！"
10057040-174 = "[s11] \"じゃあ、私と1つ約束してくれる？\"\n[s12] \"それが守れるなら一緒に行こう！\""
10057040-175 = ""
10057040-176 = ""
10057040-178 = ""
10057040-179 = "やたー！先生、さいこー！！"
10057040-180 = "ご迷惑ではありませんか……？"
10057040-181 = "[s13] \"体験学習に行くって申請すれば大丈夫だよ！\"\n[s14] \"約束は、2人とも仲良くすること！\""
10057040-184 = "こんな小うるさい人と？めんどーだけど、やってみます！"
10057040-185 = "どうしてそう余計な一言を言うの！"
10057040-186 = ""
10057040-188 = ""
10057040-189 = "……あっ、もうこんな時間ですね。"
10057040-190 = "そろそろ戻りましょう。先生もお休みにならないと。"
10057040-191 = "すみません、先生。#n予備の布団がないので、私のものを使っていただけますか……？"
10057040-192 = "遠い所まで来ていただいたのに、寝具すら用意できず申し訳ありません。"
10057040-193 = "[s] \"みんなはどうやって寝るの？\""
10057040-194 = "ラナと一緒に寝ます！"
10057040-195 = "私はアンナの枕で寝ちゃおーっと！"
10057040-196 = "ちょっと！！"
10057040-197 = "アンナは薬嚢で十分でしょ～！べーっだ！"
10057040-198 = "じゃあ、さっそく外出の計画を立てないと！先生、ありがとう！"
10057040-200 = ""
10057040-203 = "外出、最高！外出、最高！"
10057040-204 = "ラナも！一緒に言って！"
10057040-205 = "別に外出が最高だとは思わない。"
10057040-206 = ""
10057040-209 = "塩対応過ぎない！？"
10057040-213 = "私の枕は元々薬嚢よ……。"
10057040-214 = ""
10057040-216 = ""
10057040-217 = "それでは、明かりを消しますね。#n先生……今日は本当に。いろいろとありがとうございました。"
10057040-218 = ""
10057040-220 = ""
10057040-221 = "えっと……あの……。"
10057040-222 = ""
10057040-226 = ""
10057040-227 = "な、何でもありません。"
10057040-228 = "ゆっくりお休みください。では、また明日。"
10057040-230 = ""
10057040-231 = ""
10057040-236 = "（今日は長い一日だった……。183号のみんなは元気だなあ）"
10057040-237 = ""
10057040-240 = "（温もりに包まれ、すぐに眠りに落ちてしまった）"
10057040-242 = ""
10057040-243 = "アイスクリーム、もう食べられない……。"
10057040-244 = "すぅ……すぅ……。"
10057040-246 = ""
10057040-247 = "むにゃ……化学最高……。"
10057040-248 = "機械工学はバカばっか……うへへ……。"
10057040-250 = "エリナったら、夢でもこうなの……！？"
10057040-251 = "……すぐ風邪をひくくせに、また掛け布団を蹴とばしてるし。"
10057040-253 = ""
10057040-254 = "あっ、ストーブ……。燃料を入れとかなきゃ。"
10057040-256 = ""
10057040-257 = ""
10057040-258 = "あぁ、全部入れちゃった。"
10057040-259 = ""
10057040-261 = ""
10057040-262 = "あったかい……。"
10057040-263 = "いつもこうならいいのに。#nあったかくて、何の心配もなくて、自信のあることだけして。"
10057040-264 = "……。"
10057040-266 = "…………。"
