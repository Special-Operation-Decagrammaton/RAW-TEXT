[translation]
1000205-1 = "분노의 미식가"
1000205-2 = "고급 다운타운 거리"
1000205-3 = "(웅성웅성-)"
1000205-4 = "뭐지? 건물이 폭발했어!"
1000205-5 = "저쪽은 그 유명한 레스토랑이 있던 곳이잖아……."
1000205-6 = "무슨 일이 생긴 거죠?"
1000205-7 = "(웅성웅성-)"
1000205-15 = "……후훗. 선생님 아니신가요? 이런 곳에서 만날 줄은."
1000205-16 = "[s1] \"하루나? 몸에서 연기가 나고 있는데?\"\n[s2] \"몸에 검댕이 잔뜩 묻어 있는데?\""
1000205-17 = "아아. 약간 성가신 일이 있어가지고요."
1000205-18 = "아아. 약간 성가신 일이 있어가지고요."
1000205-21 = "(챡-)"
1000205-22 = "일단 여기서 벗어나시죠."
1000205-24 = "후우. 이쯤이면 되겠죠."
1000205-25 = "[s] \"무슨 일이 있었던 거야?\""
1000205-26 = "얘기하자면 조금 복잡한데…… 그러니까……."
1000205-29 = "레스토랑 피에르 가니쉬"
1000205-30 = "어서오십시오. 피에르 가니쉬입니다. 예약은 하셨나요?"
1000205-31 = "네. 쿠로다테 하루나로 예약을 했어요."
1000205-32 = "알겠습니다. 이쪽으로 오시지요."
1000205-33 = "무거워 보이는 가방이군요. 이건 저희가 맡아두겠습니다."
1000205-34 = "어머, 고마워요."
1000205-37 = "(스윽-)"
1000205-38 = "한가지 염두에 두셨으면 합니다만, 저희 업장은 코스 요리 전문이라 1인 손님은 받지 않습니다만."
1000205-39 = "……흐음. 그런 제약이 있는 줄은 몰랐는데요. 예약은 분명 1인으로 했었는데……."
1000205-40 = "네. 어제 바뀐 정책입니다."
1000205-41 = "……."
1000205-42 = "하지만 말씀하신 대로 예약 전에는 없던 정책이니 특별히 예외로 하겠습니다."
1000205-43 = "어머나, 고마워요. 그럼 주문은……."
1000205-44 = "저희 업장의 최고 메뉴인 피에르 코스를 추천드립니다."
1000205-45 = "어……. 네. 그걸로 주세요."
1000205-46 = "잠시만 기다려 주십시오."
1000205-49 = "……흐음."
1000205-51 = "에피타이저인 푸아그라를 곁들인 빵입니다."
1000205-52 = "흐음……."
1000205-54 = "앙트레인 굴 샐러드입니다."
1000205-55 = "으음……."
1000205-57 = "메인 요리인 샤토브리앙 스테이크입니다."
1000205-58 = "……."
1000205-60 = "디저트인 과일 셔벗입니다."
1000205-61 = "……."
1000205-63 = "……네. 결제 완료했습니다. 감사합니다."
1000205-64 = "……."
1000205-65 = "식사는 맛있게 하셨나요? 요리는 어떠셨습니까?"
1000205-66 = "요리는……"
1000205-67 = "……후후후후후후."
1000205-68 = "……?"
1000205-69 = "맡기신 짐은 곧 가져다드리겠습니다."
1000205-70 = "후훗. 그러실 필요는 없을 거 같네요."
1000205-71 = "……네?"
1000205-72 = "(꾸욱)"
1000205-73 = "기, 기폭제?"
1000205-74 = "(콰아아아아아아아아아아아앙------!!)"
1000205-76 = "……."
1000205-77 = "[s] \"요컨대, 요리가 마음에 안들어서 폭파했다는 거잖아?!\""
1000205-78 = "비단 그런 이유만이 아니에요. 선생님."
1000205-79 = "요리라는 것, 음식을 대접한다는 것에는 음식의 맛 이상의 의미가 담겨 있습니다."
1000205-80 = "1인 예약은 받지 않는다고 하는 오만함."
1000205-81 = "메뉴 선택의 결정을 가로막는 오만함."
1000205-82 = "아페르티프(식전주)도 없고, 아뮤즈 부쉬(한입요리)도 스킵한 코스 구성."
1000205-83 = "스테이크 굽기 정도도 물어보지 않는 무례함."
1000205-84 = "아시겠어요? 샤토브리앙은 미디움 레어가 아니면 안된단 말입니다."
1000205-85 = "사치스러운 음식이라면, 그 사치에 걸맞은 서비스와 음식이 제공되어야 합니다."
1000205-86 = "[s3] \"무슨 말인지 모르겠어…….\"\n[s4] \"화가 많이 난 건 알 거 같아.\""
1000205-87 = "……."
1000205-88 = "……."
1000205-89 = "무엇보다 혼자 먹는 음식은 생각보다 맛이 없다는 것을 새삼 깨닫게 되었습니다."
1000205-90 = "후후."
1000205-91 = "돌아가서 샤워를 해야겠네요. 온 몸에서 탄냄새가 나고 있어서……."
1000205-92 = "마치 오버쿡 된 야키토리 같은 느낌이네요."
1000205-93 = "그럼……. 선생님. 다음에 깨끗한 모습으로 만나는 걸로."
1000205-100 = "(하루나는 어쩐지 쓸쓸한 모습으로 비틀거리며 사라져 갔다.)"
