[translation]
10007010-1 = "제1화;무허가 온천"
10007010-2 = "붉은겨울 학원 회장 집무실"
10007010-4 = "음냐, 음냐……."
10007010-5 = "카스텔라도, 딸기 우유도, 바나나도……."
10007010-6 = "후후…… 다 이 몸의 것이니라……."
10007010-9 = "[ns1] 흔들어서 깨운다.\n[ns2] 볼을 찔러본다."
10007010-13 = "으헥……?"
10007010-18 = "누, 누구냐? 이 몸의 낮잠을 방해하는 녀석은!"
10007010-22 = "아, 콤라드인가. 오랜만이로군."
10007010-23 = "하지만 이 몸의 귀중한 낮잠 시간을 방해하다니, 이 무슨 무례인가!"
10007010-24 = "이 수염의 권위에 걸고 그대를……."
10007010-28 = "어라? 내 수염?!"
10007010-29 = "토, 토모에! 빨리 예비 수염을 가져와!"
10007010-35 = "……아무 일도 없었다. 그렇지, 토모에?"
10007010-36 = "그렇습니다, 서기장님."
10007010-37 = "흠, 흠. 여하튼! 이 몸이 낮잠을 자고 있을 오후 시간대에 사무국을 방문하다니……"
10007010-38 = "콤라드, 그대의 시간 감각은 도대체 어떻게 된 것인가?"
10007010-39 = "회장님, 낮잠 시간은 이미 한 시간 전에 지났습니다."
10007010-40 = "그, 그런가? 벌써 시간이 이렇게……."
10007010-41 = "그러니까…… 이건 이 몸이 일부러 늦장을 부린 게 아니라……."
10007010-42 = "우읏! 이게 다 지진 때문이니라!"
10007010-43 = "[s] \"지진?\""
10007010-44 = "음, 최근 붉은겨울 학원에는 이상할 정도로 지진이 자주 일어나고 있거든."
10007010-45 = "어젯밤에도 잠에 드려는 찰나에 갑자기 건물이 흔들리는 게 아닌가!"
10007010-46 = "천장이 어찌나 흔들리던지…… 건물이 무너질까 무서워서 한동안 잠을 이루지 못했어……."
10007010-47 = "[s] \"그것 참 큰일이네.\""
10007010-48 = "암, 큰일이고 말고. 할 수만 있다면 지진을 숙청하고 싶을 정도라네."
10007010-49 = "……그나저나 콤라드는 갑자기 붉은겨울 학원에 어쩐 일인가?"
10007010-50 = "[s3] \"붉은겨울 학원에 새로운 온천이 생겼다고 해서.\"\n[s4] \"온천욕을 즐기러 왔어.\""
10007010-51 = "……온천? 붉은겨울 학원에?"
10007010-52 = "……온천? 붉은겨울 학원에?"
10007010-53 = "하하하! 콤라드도 엉뚱한 구석이 있구나."
10007010-54 = "붉은겨울 학원에는 눈과 얼음은 있어도 온천은 없느니라! 게헨나 학원으로 찾아갈 것을 착각한 게 아닌가?"
10007010-55 = "그렇지 않느냐, 토모에?"
10007010-56 = "저, 그게…… 사실 얼마 전에 붉은겨울 학원에도 온천이 하나 생겼습니다."
10007010-57 = "뭐라고? 붉은겨울 학원에 온천이 생겼다고? 어디에?"
10007010-58 = "특별반 학생들이 머무르고 있는 구교사 지역입니다."
10007010-59 = "구교사 인근에서 갑작스럽게 온천원이 발견되어, 그 주변에 온천장을 지었다고 하더군요."
10007010-60 = "정말? 그런데 붉은겨울 학원의 회장인 이 몸은 어째서 그 사실을 듣지 못했지?"
10007010-61 = "지난주 정례 회의 때 보고드렸습니다만, 피곤하셨는지 회의 내내 주무시고 계셔서……."
10007010-62 = "우읏! 듣기 싫다! 이 몸이 자고 있었더라면 깨어난 이후에 다시 보고 했었어야지!"
10007010-63 = "붉은겨울 학원에 이 몸의 허가 없이 새로운 시설이 들어온다는 건 있을 수 없는 일이야!"
10007010-64 = "하필이면 온천이 구교사에서 터질 게 뭐람? 기껏 반성하라고 구교사에 보내놨더니 느긋하게 온천욕이나 즐기고 있다니……."
10007010-65 = "이래서는 벌이 되지 않아!"
10007010-66 = "좀 더 가혹한 숙청을 해야 해, 숙청!"
10007010-67 = "아, 그러고보니 이 몸의 전용 전차, <숙청군 1호>는 완성되었던가?"
10007010-68 = "예. 지난 주에 도색 작업을 마치고 사무국에 무사히 인도되었습니다."
10007010-69 = "후후, 좋아."
10007010-70 = "지금 바로 숙청군 1호를 구교사로 끌고 가서 건방진 특별반 녀석들에게 뜨거운 맛을 보여주는 거야!"
10007010-71 = "[s] \"숙청군 1호?\""
10007010-72 = "음, <숙청군 1호>는 이 몸만을 위해 특별히 제작된 전용 전차이니라."
10007010-73 = "장갑에는 거대한 수염을 그려 이 몸의 권위를 멀리서도 알아볼 수 있게 하였고, 정면에는 삽날을 붙여 사무국의 앞길에 거슬리는 장애물을 분쇄할 수 있게 하였지!"
10007010-74 = "후후…… 이 숙청군 1호만 있다면 용역부 녀석들이 아무리 견고한 바리케이드를 쌓아 놓아도 순식간에 철거해 버릴 수 있다고!"
10007010-75 = "시험해 볼 기회가 없었는데 마침 잘 되었군. 특별반 녀석들이 얼마나 조악한 온천장을 건설했는지는 모르겠지만, 이 숙청군 1호로 순식간에 철거해주겠어!"
10007010-77 = "자, 숙청의 시간이다!"
