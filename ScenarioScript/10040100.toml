[translation]
10040100-1 = "후일담;BOOM!"
10040100-2 = "……역시 도둑잡기는 안 되겠어. 노아에게 너무 유리하잖아."
10040100-3 = "이렇게 일방적인 승부는 하나도 즐겁지 않습니다."
10040100-8 = "어머나, 게임에 집중하다 보니 무심코 너무 몰두하고 말았네요."
10040100-9 = "그럼 종목을 바꿔서 다른 게임을 해볼까요? 뭐가 좋으려나……"
10040100-10 = "나, 나! 그럼 이번엔 내가 제안할래!"
10040100-11 = "네, 네. 코누리 마키 양, 발언하세요."
10040100-12 = "밤새워 함께 플레이하는 게임이라면 보드게임도 나쁘지 않지만, 역시 정석은 커다란 TV 앞에 둘러앉아 함께 하는 비디오 게임 아니겠어?"
10040100-13 = "지금부터는 이 게임 컨트롤러로 승부하는 거야!"
10040100-15 = "……비디오 게임인가요. 우리 베리타스에게 유리한 종목이군요. 저는 이견 없습니다."
10040100-16 = "하지만 오늘 파자마 파티에는 아무도 게임기를 가져오지 않았잖아? 지금 당장 구할 수 있는 파티 게임도 따로 없을 텐데."
10040100-18 = "후후. 잊은 거야, 하레 선배? <BOOM>의 클래식 버전은 CPU와 모니터만 있다면 어떤 기기에도 이식할 수 있다고!"
10040100-19 = "핸드폰에 설치된 펌웨어 개조 프로세스를 실행시키고, 입력 버튼을 대응시키면…… 됐다!"
10040100-20 = "마키. 돌아가기 전에 이 TV, 원상복구 해 놔야 해."
10040100-21 = "걱정 마. 복구는 버튼 하나로 간단하게 실행할 수 있으니까. 나중에라도 <BOOM>을 플레이하고 싶으면 재설치하는 것도 가능해."
10040100-22 = "다들 잊어버린 것 같은데, 일단 이 방은 코유키의 반성실이거든?! 이 이상 오락거리를 늘리면 어쩌자는 거야?"
10040100-24 = "아마 코유키 쨩이라면 이런 미니 게임이 아닌, 진짜 게임기를 어딘가에 숨겨두고 있겠지만요."
10040100-25 = "그나저나 <BOOM>은 1인용 슈팅 게임인데, 이걸로 어떻게 내기나 승부를 하는 건가요?"
10040100-26 = "<BOOM>에는 클리어 타임을 기록할 수 있는 스피드런 모드가 있거든."
10040100-27 = "이걸로 각자 1 스테이지를 클리어한 시간을 비교해서 승부를 하는 거야. 진 사람은 편의점에서 과자를 사 오는 걸로!"
10040100-28 = "과연, 1 스테이지 뿐이라면 큰 함정도 없고 조작도 쉽기 때문에 비교적 공평한 승부가 되겠군요."
10040100-30 = "나도 찬성이야. 클래식 버전의 <BOOM>을 플레이한지도 오래되어서 조금 긴장되는 걸……"
10040100-31 = "나는 이런 비디오 게임에는 익숙지가 않아서…… 이번 내기에서는 빠지도록 할게."
10040100-32 = "에이, 선배. 그러지 말고 이번 같이 하자. 내가 옆에서 조작법을 알려줄게."
10040100-33 = "막상 해보면 또 재미있을지도 모르고…… 또 비디오 게임에 의외의 재능이 있을지도 모르잖아?"
10040100-34 = "실은 그렇게 말하면서 내게 꼴찌를 맡기려는 속셈 아니야……?"
10040100-35 = "그, 그런 생각을 하지 않은 것도 아니지만—"
10040100-36 = "일단 여기에 앉아서 컨트롤러를 잡아 봐. 내가 조작법을 알려줄게."
10040100-39 = "응? 뭔가 악마처럼 생긴 몬스터가 등장했는데. 이걸 공격해야 하는 건가?"
10040100-40 = "응. 그 녀석들이 붐-가이를 위협하는 외계 해적들이야. 일단 하단의 기본 공격 키를 누르면 주먹으로 공격을 할 수 있는데—"
10040100-44 = "오, 정말이네. 외계인이 나가떨어졌어."
10040100-45 = "물론 주먹도 효과적이지만 사정거리가 짧으니까, 벽에 걸린 산탄총을 사용하면—"
10040100-52 = "과연…… 이런 효과까지 구현해 두었구나. 리얼한 느낌이네."
10040100-56 = "주먹보다는 산탄총이—"
10040100-66 = "……선배. 이미 그 외계인의 체력은 제로야."
10040100-67 = "후후, 이거 생각보다 스트레스 해소가 되는걸."
10040100-68 = "어라? 이 방에 있는 적은 모두 때려잡은 것 같은데. 마키, 다음 적은 어디에 있어?"
10040100-69 = "다음 적은…… 오른쪽 방에 있어."
10040100-75 = "(치히로는 주먹만으로 적을 공략한 탓에 다른 부원들보다 훨씬 늦게 스테이지를 클리어했지만……)"
10040100-76 = "(마키를 포함한 베리타스 부원들은 한동안 치히로의 심기를 거스르지 말아야겠다고 다짐했다.)"
