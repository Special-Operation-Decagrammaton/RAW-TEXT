[translation]
1002505-1 = "놀이터 안전 점검"
1002505-2 = "키보토스 중앙구, 실내 놀이터"
1002505-3 = "이곳이 이번에 새로 개장한 어린이용 실내 놀이터……."
1002505-4 = "소문대로 흥미로워 보이는 놀이기구들이 잔뜩 있네요."
1002505-5 = "귀여운 캐릭터가 그려진 트램펄린부터 대형 볼풀장까지……."
1002505-6 = "분명 이 시설이라면 매화원의 아이들도 만족할거예요."
1002505-7 = "자, 선생님. 그럼 어떤 놀이기구부터 타 볼까요?"
1002505-8 = "[s] \"……직접 타 볼 생각이야?\""
1002505-9 = "다, 당연하죠! 눈으로 보는 것과 실제로 타보는 것은 다르니까요!"
1002505-10 = "어린아이의 몸으로 기구 위에 올라갔을 때 얼마나 격렬하게 느껴지는지, 안전장치에는 이상이 없는지 직접 확인해봐야 해요."
1002505-12 = "……절대로 제가 놀고 싶어서 그러는 게 아니니까요!"
1002505-13 = "[s1] \"네~ 네~.\"\n[s2] \"모처럼이니 놀아도 상관은 없지만.\""
1002505-14 = "(어쩐지 믿어주시지 않는 것 같은데…….)"
1002505-15 = "(어쩐지 믿어주시지 않는 것 같은데…….)"
1002505-16 = "그럼 저기에 있는 트램펄린부터 살펴볼까요?"
1002505-18 = "트램펄린은 스프링의 탄력을 이용하여 사람을 튀어오르게 만드는 단순한 형태의 놀이기구지만, 그만큼 다치기 쉬운 놀이기구이기도 해요."
1002505-19 = "내구도가 약해서 용수철이 끊어지거나, 탄성이 너무 강해서 매트 밖으로 떨어지기라도 하면 위에 올라간 아이들이 크게 다칠 수도 있으니까요."
1002505-20 = "그럼 우선 내구도 테스트를……."
1002505-26 = "……음, 내구성에는 이상이 없어보이네요. 이만하면 여러 아이들이 동시에 올라가서 뛰어놀아도 용수철이 끊어질 일은 없겠어요."
1002505-27 = "그럼 다음은…… 용수철의 탄성을 확인하기 위해 직접 매트 위에 올라가 볼까요."
1002505-34 = "우, 우와! 정말로 높이 튀어올랐어요!"
1002505-37 = "이 트램펄린, 생각보다 더 탄성이 좋아서……."
1002505-38 = "……마치 하늘을 나는 것 같아요! 아하하!"
1002505-39 = "[s3] \"……슌?\"\n[s4] \"정말 놀고 있는 게 아니지?\""
1002505-40 = "……헉!"
1002505-41 = "……헉!"
1002505-42 = "무, 물론이에요! 어린아이의 기분이 되어서 시험해봤을 뿐이에요!"
1002505-47 = "흠, 흠. 탄력성에도 이상이 없어보이네요."
1002505-48 = "다만 트램펄린이 너무 즐거워서 아이들이 좀처럼 내려오려 하지 않을지도……."
1002505-49 = "[s] \"슌이 즐거웠다면 계속 타도 괜찮아.\""
1002505-50 = "노, 놀러온 게 아니니까 저는 괜찮아요!"
1002505-51 = "흠, 흠 다음은 대형 볼풀장이에요!"
1002505-53 = "여기가 이 실내 놀이터에서 가장 넓은 놀이시설인 대형 볼풀장이에요."
1002505-54 = "부드러운 소재의 알록달록한 공이 잔뜩 뿌려져 있네요. 예뻐라……."
1002505-55 = "어라……?"
1002505-57 = "서, 선생님, 저것 보세요! 초대형 볼풀 슬라이드예요!"
1002505-58 = "천장부터 이어지는 파이프 라인을 꼬아 저렇게 복잡한 슬라이드를 만들다니……."
1002505-59 = "저건 분명 재미있을거에요!"
1002505-60 = "[s] \"타보고 싶은 거야?\""
1002505-61 = "그야 물론이죠. 몸이 컸을 때는 어린이용 슬라이드에는 들어가 보지도 못했으니……."
1002505-62 = "그게 아니라! 매화원의 아이들이 타기 전에 교관으로서 안전에 문제가 없는 지 직접 확인해봐야 하니까요!"
1002505-63 = "[s] \"겉보기에는 튼튼해 보이는데…….\""
1002505-64 = "아뇨. 슬라이드도 트램펄린과 마찬가지로 타보기 전까지는 확인할 수 없는 불안 요소가 많아요."
1002505-65 = "경사각이 너무 가파르면 안에서 넘어질 수도 있는 데다가, 표면에 날카로운 흠집이라도 나 있으면 큰일이니까요!"
1002505-66 = "그럼, 안전 확인을 위해 다녀오겠습니다!"
1002505-71 = "(슌이 볼풀 슬라이드를 타러 계단을 오른다…….)"
1002505-73 = "아하하! 정말 재미있네요, 이 볼풀 슬라이드!"
1002505-74 = "경사와 커브가 절묘하게 설계되어서 아슬아슬한 속도가 유지되는 게, 정말 재밌었어요!"
1002505-75 = "그럼 한 번 더 슬라이드를 타러—."
1002505-76 = "[s] \"안전 문제는 다 확인한 거 아니었어?\""
1002505-78 = "어…… 그게 내부 마감 상태는 아직 완전히 확인하지 못해서……."
1002505-79 = "완벽한 안전 점검은 한 번으로는 모자라니까요!"
1002505-80 = "게다가 언제 다시 타볼 수 있을지도 모르는데, 그냥 돌아가기는 아쉽고……."
1002505-81 = "[s] \"놀러온 게 아니라며?\""
1002505-82 = "우으으……."
1002505-83 = "놀리지 말아주세요!"
1002505-85 = "(이후, 슌은 토라진 표정으로 볼풀 슬라이드를 다섯번이나 더 타러 갔다.)"
