[translation]
1013005-1 = "사회 경험"
1013005-5 = "……."
1013005-6 = "[s] \"…….\""
1013005-7 = "아, 안녕, 하세요. 선생님."
1013005-8 = "뭐 하고 있냐고요? 그, 그야……."
1013005-13 = "아르바이트, 하고 있는데요……."
1013005-14 = "아, 아니에요! 선생님이 생각하는, 그런 이상한 거 아니에요! 그, 이번에 '접객'이라는 것을 해 보면서……."
1013005-15 = "……학교 회의 결과, 온갖 진상과, 손님을 가장한 빌런과, 안하무인에 독불장군 같은 사람들을 상대하며."
1013005-16 = "인간성의 또 다른 극단을 몸으로 학습하는 동시에, 경제 활동도 해 보자는 쪽으로 결론이 나서……."
1013005-17 = "[ns] \"……어떤 의미로는 목적에 부합하긴 하겠다…….\""
1013005-19 = "그렇죠……?"
1013005-20 = "하지만 사실 접객은 카페 안에서 정말로 이루어지는 것일 테니, 저는 그마저도 실격이라고 해야겠네요……."
1013005-21 = "왜 팻말 담당이냐고요? 음, 저는 잘 이해하지 못하겠지만, 왠지 이걸 들고 있으면 그림이 될 거라고 하더라고요?"
1013005-27 = "[ns1] \"……그건 확실히 그런 것 같네.\"\n[ns2] \"스바루는 조금 더…… 스스로에 대해 자신을 가질 필요가 있다고 봐.\""
1013005-30 = "우와, 지금 선생님도 점장분과 똑같은 말씀을 하셨어요."
1013005-31 = "저는 여전히 무슨 의미인지 하나도 모르겠지만요……."
1013005-32 = "네? 이러니저러니 해도, 열심히 사는 모습이 보기 좋다고요?"
1013005-33 = "……."
1013005-34 = "그러면! 이렇게 열심히 살려고 하는 우리 학생들을 위해! 조금 매상을 부탁하고 싶은데요!"
1013005-35 = "[s3] \"호오. 좋은 영업 기술이군요. 스바루 학생.\"\n[s4] \"그 부분을 칭찬하는 의미에서, 들어가 보도록 하죠.\""
1013005-38 = "감사합니다! 안내해 드리겠습니다!"
1013005-40 = "[ns] \"오오……. 생각보다 더 본격적인데?\""
1013005-41 = "어떠세요, 선생님? 우리 아이들, 신선하죠?"
1013005-42 = "처음에는 다들 머뭇거렸는데, 카페 유니폼을 보자마자 태도가 바뀌더라고요."
1013005-43 = "귀엽다고, 입어 보고 싶다고……."
1013005-44 = "……."
1013005-45 = "참, 선배가 돼서 이런 부분도 눈치채 주지 못하고. 한심하네요."
1013005-46 = "[s5] \"그렇지 않아. 다들 전에는 몰랐잖아?\"\n[s6] \"이제 알게 됐으니까, 챙겨 주면 되는 거지.\""
1013005-49 = "……네. 그래야겠죠."
1013005-50 = "여기, [USERNAME] 선생님, 손님이십니다!"
1013005-51 = "네! 감사합니다! 자리로 안내해 드릴게요!"
1013005-53 = "[ns] \"스바루도 같이 가자.\""
1013005-54 = "네? 저, 저요?! 하지만 저는 팻말 담당인데요?"
1013005-55 = "한 분이라도 더 많은 손님을 안내해서, 카페의 매출을 올려야 하는데……."
1013005-57 = "(바로 그 말을 기다리고 있었기에, 회심의 미소를 지으며……!)"
1013005-58 = "(카페의 점장분을 부르기로 했다!)"
1013005-60 = "네? 무슨 일이십니까?"
1013005-61 = "아하, 이 학생이 사실 선생님께서 가르치시는 학생이시고."
1013005-62 = "사회 경험을 잘하고 있는지 보러 오셨는데, 잠시 대화를 나눌 시간을 주실 수 있으시겠냐는 것이군요?"
1013005-63 = "네? 그 대신 지금 자리에 계신 카페 손님들에게, 음료와 케이크를 추가로 제공해 달라고요?"
1013005-64 = "그리고 가격은 전부 선생님께서 지불하신다는 것입니까?"
1013005-65 = "그런 것이라면야 얼마든지요! 스바루 학생? 선생님과 천천히 이야기 나누세요!"
1013005-67 = "……이래도 돼요?"
1013005-68 = "[s] \"후우……. 이것이 어른의 방식이란다.\""
1013005-69 = "정말 좋은 거 가르쳐 주시네요……."
1013005-71 = "(그렇게 스바루와, 아무래도 좋은 이야기들을 나눴다.)"
1013005-72 = "(그냥 사는 이야기, 학교 이야기, 다른 학교로 비유하자면 선도부장으로서의 이야기.)"
1013005-73 = "(정말로 아무래도 상관없고, 그렇기에 소중한 이야기들을.)"
1013005-75 = "선생님?"
1013005-76 = "[ns] \"응?\""
1013005-77 = "우리 애들, 기특하죠?"
1013005-78 = "[ns7] \"그러게.\"\n[ns8] \"그리고 스바루도 내 눈에는 정말 기특해.\""
1013005-81 = "……."
1013005-82 = "그렇게, 겉치레 같은 말씀하셔도, 뭐 없거든요……?"
1013005-83 = "네? 겉치레가, 아니라고요?"
1013005-84 = "…………."
1013005-85 = "저 말이에요. 선생님에 대해서 아~주 못~된 소문 들었거든요?"
1013005-86 = "어느 날 선생님한테 무슨 일이 일어나면, 전부 자업자득으로 생각해도 좋다는 소문 말이죠."
1013005-87 = "그런 이야기를 왜 지금 여기에서 하냐고요?"
1013005-88 = "몰~라요. 선생님은 머리가 좋으시니까, 한번 상상해 보시던가요~"
1013005-90 = "이게 뭐야! 추가 케이크가 나온다고 해서 기대했더니, 서비스가 엉망이잖아!"
1013005-91 = "무, 무엇이 문제셨나요. 손님?"
1013005-92 = "서비스에 정성이 없어, 정성이! 내게 전혀 말을 걸어 주지 않았잖아! 좀 더 주변을 보고 움직이는 게 좋아!"
1013005-93 = "나는 이제 오지 않을 거지만 말이지! 헹!"
1013005-94 = "죄송합니다, 손님! 사과드릴 테니, 다시 오지 않을 거라는 말씀만은……."
1013005-95 = "상관없어! 원래도 사실 오지 않았거든! 그리고 뭐야, 이 옷은! 하늘하늘하기만 하고!"
1013005-96 = "꺄악?!"
1013005-97 = "소, 손님?! 점원의 옷에 손을 대시는 것은……!"
1013005-98 = "……!"
1013005-104 = "우아아악?!?! 뭐, 뭐야! 너는!"
1013005-106 = "죄송합니다. 손님. 무례를 용서해 주세요. 그렇지만 바쁘게 일어나시다가, 균형을 잃으신 것 같아서요."
1013005-107 = "잠시 '부축'해 드리려고 했습니다만, 괜찮으신지요?"
1013005-108 = "(선배의 CQB를 이렇게 가까이에서?! 오늘 운이 좋았네!)"
1013005-109 = "부, 부축은 무슨! 아야야야……! 이, 이러다 팔목이나 팔꿈치가 꺾이고 말겠어! 놔! 놓으라고!"
1013005-110 = "하하하. 조금만 더 기다려 주세요. 손님께서 균형을 우선 잡으셔야 할 것 같네요."
1013005-111 = "……내가 팔을 정말로 말이 안 되는 방향으로 완전히 꺾어 버리기 전에 말이야……."
1013005-112 = "히, 히이이이이익?!?!"
1013005-113 = "내가 무슨 말을 하고 있는지, 그리고 자기가 무슨 짓을 하고 있는지, 이만하면 알겠지?"
1013005-114 = "아, 알겠습니다……! 알다마다요! 그, 그러니까 제발 팔을 좀……!"
1013005-115 = "꺼져."
1013005-119 = "두 번 다시 이런 가게 오나 봐라!!!"
1013005-125 = "……."
1013005-126 = "고마워요, 스바루 학생! 아니, 스바루 씨! 덕분에 모두가 안전해졌네요!"
1013005-127 = "뭘요. 그냥 할 일을 한 것뿐인데요."
1013005-128 = "스바루 씨라고 했죠? 사진 찍어도 돼요?"
1013005-129 = "혹시 별도 요금 필요한가요? 얼마든지 낼 테니까요!"
1013005-130 = "아, 아뇨. 그런 건 얼마든지……. 그, 그보다 매니저님? 선생님?!"
1013005-131 = "왜 두 분 다 조용히 저를 바라보면서 엄지손가락을 치켜드시는 건가요?!?!?!"
