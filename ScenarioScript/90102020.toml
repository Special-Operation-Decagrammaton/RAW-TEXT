[translation]
90102020-1 = "제2화;무임승차"
90102020-4 = "(더위가 한 풀 꺾이고, 가을이 만연한 키보토스의 어느 하루.)"
90102020-5 = "(샬레의 업무 차 다른 학원 자치구를 방문하기 위해 열차를 타고 목적지로 향하고 있었다.)"
90102020-8 = "(열차가 출발한 지 약 1시간쯤 지났을 무렵……)"
90102020-12 = "손님 여러분, 지금부터 검표를 시작하겠습니다."
90102020-13 = "차내의 손님 여러분께서는 지정석에 앉아, 소지하고 계신 승차권을 꺼내 주시기 바랍니다."
90102020-14 = "혹 검표에 응하지 않거나, 부정 승차권을 갖고 계신 경우에는…… '거친 수단'을 사용하게 될 수도 있으니, 부디 너그러이 협조를 부탁드리겠습니다."
90102020-15 = "히, 히익……"
90102020-19 = "손님, 승차권을 제시해 주십시오."
90102020-20 = "음…… 저기, 학생?"
90102020-21 = "내가 그러니까 말이야. 돈이 없어서 이러는 게 아니거든?"
90102020-25 = "내가 젊을 적에는 말이야…… 하루에 침목을 수백 개나 지고 나르면서 철로를 깔았어."
90102020-26 = "어떻게 보면 이 일대의 철로는 다 내가 직접 설치한 거나 다름없다고!"
90102020-27 = "그런데 총학생회는 그런 노고를 치하하기는커녕, 비싼 요금을 받으려 하다니. 이치가 잘못되어도 단단히 잘못되었다는 생각이 들어."
90102020-28 = "솔직히, 이 정도 거리에 5000엔이나 받는 건 너무하잖아?"
90102020-29 = "그 말씀은…… 표가 없으시다는 뜻인가요?"
90102020-30 = "어허, 참. 눈치 없기는."
90102020-31 = "학생만 눈 감고 넘어가주면 아무 문제도 없을 거라는 말이야."
90102020-32 = "응? 어른을 공경하는 착한 학생이라면 이해했겠지?"
90102020-33 = "하아……"
90102020-34 = "표가 없으신 분은 열차에서 지금 바로 하차해 주시기 바랍니다."
90102020-35 = "그게 무슨 소리야? 이미 출발한 열차에서 어떻게 내려?"
90102020-36 = "그야 다 방법이 있지요."
90102020-43 = "으아아아아—"
90102020-45 = "자, 다음 손님."
90102020-46 = "저, 저는 제대로 된 표를 가지고 있어요!"
90102020-47 = "자, 보세요. 여기 카와니시 역까지 가는 승차권이……"
90102020-48 = "어머나, 정말이네요. 승차권을 갖고 계시니 이쪽은 문제 없……"
90102020-52 = "……손님? 이 승차권, 발권 일자가 1주일 전으로 기록되어 있는데요."
90102020-53 = "설마, 1주일 전에 발권한 표로 열차를 다시 이용하려던 건 아니시겠지요?"
90102020-54 = "앗, 이런……"
90102020-55 = "오늘 자 승차권을 갖고 계시지 않다면, 손님께서도 바로 하차해 주셔야 할 것 같습니다."
90102020-56 = "그, 그게 그러니까…… 속일 생각은 아니었는데—"
90102020-63 = "으아아아아—"
90102020-66 = "[ns] (어쩐지 분위기가 험악하네……)"
90102020-67 = "하아…… 어떻게 제대로 돈을 내고 승차권을 구입한 손님이 절반도 되지 않을 수가 있지?"
90102020-72 = "다음 손님도 표를 제시해 주시기 바랍니다."
90102020-73 = "……혹시 손님도 승차권이 없으신 건 아니시겠죠?"
90102020-74 = "[s1] \"아, 아냐! 제대로 가지고 있어.\"\n[s2] \"여기 가방 앞주머니에 이렇게—\""
90102020-80 = "[ns] \"………어라?\""
90102020-81 = "설마 또……"
90102020-82 = "손님도 승차권 없이 탑승하셨나요?"
90102020-83 = "[s] \"분명히 열차에 탈 때만 하더라도 갖고 있었는데……!\""
90102020-84 = "변명은 그 뿐이신가요."
90102020-85 = "그럼 바로 하차 처리를……"
90102020-86 = "[s] \"자, 잠깐만 기다려줘!\""
90102020-90 = "[ns] \"사실 지금 샬레의 업무 차 이동중이라서……\""
90102020-92 = "[ns3] \"다음 역에 도착하면 바로 새 표를 결제할 테니까.\"\n[ns4] \"열차에서 내던지는 것만은 봐주면 안 될까?\""
90102020-95 = "네? 손님이 샬레의 선생님이시라고요……?"
90102020-96 = "하하, 하하하!"
90102020-97 = "그렇게 말하면서 승무원을 속이려 드는 손님이 얼마나 많은 지 알고 계시나요?"
90102020-98 = "오늘 오전만 하더라도 총학생회의 고위 임원이라고 주장하며 표 값을 깎으려는 학생을 세 명이나 만났거든요."
90102020-99 = "그 쪽이 샬레의 선생님이라면…… 저는 총학생회장입니다!"
90102020-100 = "[s] \"그런……\""
90102020-101 = "여하튼 변명은 그쯤하고 슬슬 열차에서 내리—"
90102020-102 = "저기, 잠시만요."
90102020-103 = "이거. 자리 밑에 떨어져 있었어요."
90102020-110 = "[ns] \"어라, 니코? 어째서 여기에—\""
90102020-111 = "쉬잇. 지금은 잠시 말을 맞춰주세요."
90102020-112 = "아무래도 방금 전에 의자에 앉으시면서 바닥에 떨어트린 모양이신데…… 승차권은 떨어트리지 않게 꼭 붙잡고 계셔야지요."
90102020-113 = "자칫하다가는 달리는 열차에서 밖으로 내던져질지도 모르니까요."
90102020-114 = "이 승차권, 선생님 것이 맞으시지요?"
90102020-115 = "[s] \"아, 네! 제 승차권이 맞아요.\""
90102020-116 = "어디 보자…… 응?"
90102020-117 = "뭐야. 이 승차권은 총학생회에서만 발급하는 특별 열차 패스인데……"
90102020-118 = "설마, 진짜로 샬레의 선생님……?!"
90102020-119 = "[s] \"지금이라도 알아줘서 고마워……\""
90102020-120 = "시, 실례했습니다. 요새 거짓말로 무임승차를 하는 사람들이 너무 많아서…… 조금 예민해진 모양이네요."
90102020-121 = "……실례했습니다. 즐거운 여행 되세요!"
90102020-126 = "정말…… 뭐하는 거야, 선생님."
90102020-127 = "열차를 타는 데 승차권을 깜빡하다니. 창문 밖으로 내던져도 이상하지 않을 상황이었다고."
90102020-128 = "[s5] \"다른 소대원들도 있었구나……\"\n[s6] \"……너희들 덕분에 살았어. 정말 고마워.\""
90102020-131 = "아닙니다. 선생님의 안전과 관련된 문제였으니까요."
90102020-132 = "다만 다음 번에는 저희가 지켜드리지 못할지도 모르니 다음 번에 열차를 탈 때는 승차권을 꼭 눈에 보이는 곳에 두시는 걸 추천드립니다."
90102020-133 = "아아, 하지만 나도 비슷한 경험이 있어서 뭐라 하진 못하겠는 걸."
90102020-134 = "승차권 같은 작은 종이 티켓은 가방에 넣어두면 꼭 필요할 때는 안 보이다가, 시간이 지나면 가방 맨 아래에서 구깃구깃 접힌 채로 발견되기도 하니까."
90102020-136 = "[ns] \"그나저나 이 승차권은……?\""
90102020-137 = "이건 총학생회장님께 받은 긴급 상황용 하이랜더 열차 패스예요."
90102020-138 = "용의자를 긴급히 쫓아야 하거나, 모종의 이유로 승차권을 발권할 여유가 없을 때 사용할 수 있는 만능 티켓이랍니다."
90102020-139 = "물론 너무 남용하면 재무실에서 잔소리를 들을지도 모르니, 정말 긴급한 상황에서만 쓰라고 하셨지만요."
90102020-140 = "[s7] \"그나저나 FOX 소대와 열차에서 마주치다니 드문 일이네.\"\n[s8] \"어디, D.U. 밖으로 나가야 할 일이라도 있는 거야?\""
90102020-143 = "정확히 말씀드리자면, D.U.를 벗어날 예정은 아니지만요……"
90102020-144 = "D.U. 외곽에 있는 카와니시 역에 가는 중이었습니다."
90102020-145 = "카와니시 역은 여러 노선의 철도가 교차하는 환승역이라, 그 주변 일대의 사립 학교로 등교하는 학생들이 모여드는 통학로이기도 하지요."
90102020-146 = "그런데 최근 이 역에서도 학생들의 실종담이 여럿 보고되어서……"
90102020-147 = "[s9] \"그거 큰일이네……\"\n[s10] \"설마 이번에도 괴물이 나타난 건 아니겠지?!\""
90102020-150 = "다행히 괴물을 목격했다는 이야기는 없었습니다만……"
90102020-151 = "선생님. 역 시간표에 없는 열차가 나타나 학생을 싣고 사라졌다는 이야기, 들어보신 적 있으십니까?"
90102020-153 = "다음화;어긋난 시간표"
