[translation]
10032030-1 = "제3화;사냥감 독식"
10032030-20 = "……뭐……."
10032030-24 = "뭐야, 이거어어언-!?"
10032030-26 = "아하하하하! 아루 쨩 반응 굉장하네!"
10032030-27 = "뭐냐니? 우리가 둘러보며 붙잡은 '수상한 녀석들'이잖아? 여기저기 숨겨 두었던 폭탄들도 함께!"
10032030-28 = "정확히는 '리스트에 신원이 적히지 않은 녀석들'이지. 아란치노의 부하랑은 또 다른 쪽."
10032030-29 = "어쩌면 테러리스트나 라이벌 조직일 수도 있고."
10032030-30 = "……그나저나 대충 돌아본 걸로도 이 정도나 나오다니, 안에는 아직 한참 더 남아 있겠어."
10032030-31 = "몰라서 묻는 게 아니잖아!? 다들 어째서 이렇게 태평한 거야!?"
10032030-32 = "어째서 이렇게나 많은 폭탄이랑 테러리스트가 오페라 하우스 같은 데에 숨어 있는 거냐고!? 대체 왜……!?"
10032030-33 = "애초에 오페라 하우스는 오페라를 보러 오는 곳이지, 누굴 해치려고 있는 곳이 아니잖아!?"
10032030-34 = "[s1] \"어……. 이제 와서……!?\"\n[s2] \"일단 자각은 있구나.\""
10032030-37 = "지, 지금 그런 건 됐으니까! 사소한 걸로 따지지 말라고, 선생님!! 우선은 상황 파악이 먼저잖아!"
10032030-38 = "어째서 이 녀석들이 오페라 하우스 곳곳에 숨어서 폭탄 같은 걸 설치하고 있었는지 알아내야지!"
10032030-39 = "으, 으윽……. 어떻게 알아낸 거지? 폭탄은 완벽하게 숨겼다고 생각했는데……."
10032030-40 = "전문가가 아니면 찾아낼 수 없는 위치였는데……. 어떻게 찾아낸 거지……?"
10032030-44 = "운이 없었네. 공교롭지만 여기도 폭탄 설치 전문가가 있거든."
10032030-45 = "하루카 쨩은 하루에도 여기저기 수십 킬로그램씩 폭탄을 설치하곤 하니까 말이야. 숨길 만한 장소는 척하면 척이라고?"
10032030-46 = "에, 에헤헤……. 흐흐헤헤헤……."
10032030-47 = "오히려 딱히 찾을 생각으로 돌아다닌 것도 아닌데 찾아냈을 정도면, 조금 어설픈 거 아닐까? 설치가."
10032030-53 = "그, 그런 말도 안 되는……!"
10032030-54 = "대체 뭐 하는 녀석들이냐!? 어째서 우릴 방해하는 거지? 너희도 아란치노의 부하들……!?"
10032030-60 = "물어보는 방향이 잘못됐잖아. 말하기 전에 상황을 먼저 파악해 줬으면 하는데."
10032030-61 = "히이이이이익-!?"
10032030-62 = "우, 우린 몰라. 우린 아무것도 모른다고! 그냥 시키는 대로 아란치노를 날려버리려 했을 뿐이야!"
10032030-63 = "……역시 그쪽이었군. 말하자면 의뢰라는 거네."
10032030-64 = "하지만 폭탄이라는 건 목표한 대상 외에 다른 사람들이 휘말릴 가능성이 높아. 요란해서 이후로 귀찮아질 가능성도 높고."
10032030-65 = "굳이 폭탄일 이유가 있어? 방법은 여러 가지가 있었을 텐데."
10032030-66 = "구, 굳이 폭탄이 아니어야 할 이유도 없잖아? 다른 방법들은 실패할 확률도 높고……."
10032030-67 = "다른 사람들이야 뭐, 어차피 우리가 신경 쓸 일은 아니고……."
10032030-72 = "확실하게 처리하고 싶었다는 건가……. 일리 있는 이야기지만."
10032030-73 = "……너희들 말고 다른 녀석들은? 얼마나 더 있지?"
10032030-74 = "글쎄……. 정확하게는 잘……. 하지만 눈치 상 조금은 더 있을 것 같았어."
10032030-78 = "그, 그렇군!! 너희들도 결국 의뢰 때문에 온 거지!? 우리와 같은 일을 하려는 거지!?"
10032030-79 = "갑자기 우릴 제압하길래 아란치노 쪽 사람인가 했더니……. 우린 적이 아니라고!!"
10032030-80 = "당장 이걸 풀어! 우리가 도와주지! 우리가 도와주면 너희 쪽 일도 훨씬 수월해질걸!"
10032030-81 = "똑같은 놈들끼리 싸울 필요 없다고! 응? 듣고 있어!? 거기 너, 대장 같은 녀석!!"
10032030-82 = "우리 말을……."
10032030-87 = "……듣고 있……?"
10032030-93 = "흥이잇……!?"
10032030-98 = "[ns4] \"갑자기 기절시켰다.\"\n[ns5] \"하루카, 가차없구나.\""
10032030-103 = "……누가……."
10032030-104 = "누가……. 그런 건방진 소릴 해도 된다고 했죠……?"
10032030-105 = "지금 아루 님을 '너'라고 부른 건가요? '대장 같은 녀석'……?"
10032030-106 = "게다가 똑같다고요? 아루 님과 당신 따위가……!? 어떻게 감히 그런 말을……?"
10032030-107 = "……용서 못 해요……."
10032030-108 = "용서못해용서못해용해못해용서못해용서못해……!!"
10032030-115 = "히, 히이이익-!?!? 아, 아뇨! 아니요! 저는 아무 말도 안 했어요! 가만히 있었다고요!!"
10032030-119 = "……하루카, 그만 됐어."
10032030-120 = "……!!"
10032030-121 = "……네, 네!"
10032030-122 = "일단 상황은 대충 알겠네. 폭탄을 설치해서 오페라 하우스를 통째로 날려 버린다……."
10032030-123 = "합리적인 발상이네. ……하려는 말이 무슨 말인 줄도 알겠고."
10032030-125 = "그, 그럼……!?"
10032030-129 = "……하지만 유감이군."
10032030-130 = "안타깝게도 우리 흥신소68은, 잔챙이들과 협력하는 방식으로 일하지는 않아서 말이야."
10032030-134 = "뭐라고……!? 자, 잔챙이!?"
10032030-135 = "이, 이 녀석이……! 아까부터 보자 보자 하니까……!"
10032030-136 = "겨우 우리 하나 잡았다고 해서 그렇게 기고만장해질 일인 줄 알아!? 이 오페라 하우스에 얼마나 더 많은 녀석들이 있을 줄 알고!?"
10032030-137 = "당장 너희가 지금 우리에게 이러고 있는 사실이 알려지기만 해도, 다른 녀석들이 너흴……!!"
10032030-139 = "……하긴 그러네."
10032030-143 = "그러면 알리지 않아야겠지."
10032030-147 = "끼에훙……!?"
10032030-154 = "……계속해, 사장."
10032030-155 = "으, 으응……."
10032030-156 = "모두 잘 들어! 보스……. 돈 아란치노는 어디까지나 우리의 타깃이야."
10032030-157 = "다른 녀석들에게 양보하는 건 물론, 신뢰할 수 없는 녀석과 협력하는 것도 이번 건에 대해서는 논외. 철저히 우리의 일이야."
10032030-158 = "……타깃이 오기 전까지, 한 번쯤 더 오페라 하우스를 수색해 볼 필요가 있겠어."
10032030-164 = "이야~. 전부 다? 보통 일이 아니겠네?"
10032030-165 = "연락책에게 받은 리스트도 있으니까 불가능한 일은 아냐. 시간은 좀 걸리겠지만."
10032030-171 = "크게 달라질 건 없어. 의뢰를 받았고, 우리가 해결하고, 보수를 받는다."
10032030-172 = "경쟁이건 협조건, 사장인 나와 사전 계약을 체결한 게 아니면 의뢰 중엔 다 방해물일 뿐이야. 그리고 방해물은 모두 처리할 뿐."
10032030-176 = "……가자."
10032030-182 = "아, 아루님! 아루님……!!"
10032030-188 = "하아……."
10032030-189 = "……결국 이렇게 됐네, 선생."
10032030-190 = "말은 저렇게 했지만, 사장은 결국……."
10032030-191 = "[s6] \"괜찮아. 무슨 말인지 알아.\"\n[s7] \"뭐, 아루라면 그럴 것 같았으니까.\""
10032030-194 = "쿠후후……. 내버려둘 순 없는 거겠지? 역시 아루 쨩이라니까."
10032030-195 = "뭐, 정말로 폭탄이 터지면 일반 관객들이 다칠 게 사실이긴 하니까."
10032030-196 = "일이 생각보다 더 재미있게 돼버렸는걸. 나쁘지 않아~."
10032030-197 = "그런 의미에서……."
10032030-198 = "……조금만 더 부탁할게, 선생."
