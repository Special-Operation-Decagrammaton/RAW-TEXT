[translation]
10027030-1 = "제3화;출판. 증쇄. 유통."
10027030-7 = "타카네 녀석…… 영문 모를 소리나 하고 말이야."
10027030-8 = "아직도 납득이 안 돼!"
10027030-9 = "[s] \"그래도 단서는 줬잖아?\""
10027030-10 = "……으음. 그러게. 그건 어쩐지 평소와 좀 달랐다고 할지."
10027030-11 = "[s] \"타카네는…… <루나>에 대해 뭘 알고 있었던 걸까?\""
10027030-12 = "글쎄…… 하지만 출판부를 찾아가 보라는 건 맞는 말인 것 같아."
10027030-13 = "녀석의 말을 그대로 따르는 건 지는 기분이라, 솔직히 마냥 달갑지는 않지만."
10027030-14 = "출판부에는 붉은겨울에서 지금까지 출판된 모든 책에 대한 자료가 남아 있을 거고."
10027030-15 = "그중에는 분명…… <루나>에 대한 자료도 있겠지."
10027030-23 = "[ns] \"……여기가 출판부……?\""
10027030-24 = "맞아. 붉은겨울 학원에서 유통되는 대부분의 책은 여기에서 만들어지고 있어."
10027030-25 = "[s] \"굉장하네.\""
10027030-26 = "굉장하네. 라고 순수하게 감탄하기에는……"
10027030-27 = "좀…… 여러 가지로 평범하지 않은 것들을 잔뜩 인쇄하고 있다고 할까……"
10027030-28 = "……<지식해방전선>의 회지를 인쇄할 때 가끔 신세를 지기도 하니까, 마냥 별난 곳 취급하기도 조금 그렇긴 하지만……."
10027030-33 = "그렇게 작게 말해 봤자 다 들린다고요."
10027030-39 = "으엑. 나타났다……."
10027030-40 = "네. 네. 반갑지 않은 출판부의 책임자, 나타났습니다. 무슨 바람이 불어서 스스로 여기까지 온 것인지 모르겠지만. 반갑네요, 메루. 아니면 필명인 메루리로 불러 줄까요?"
10027030-41 = "……메루로 충분해. 야쿠모."
10027030-42 = "[s] \"책임자……?!\""
10027030-43 = "네. 여기는 출판부랍니다. 출판물 인쇄, 제본, 포장, 관리, 영업, 사업 확충까지 책에 관련된 거라면 뭐든 다루고 있죠. 저는 그 부장을 맡고 있는 아라마키 야쿠모라고 하고요."
10027030-44 = "덧붙여서 잡지 <붉은 곰>의 인쇄를 담당하고 있기도 하답니다. 힛. 힛. 히."
10027030-48 = "[ns1] \"뭔가 엄청난 걸…… 이건 <붉은 곰?>?\"\n[ns2] \"본 적 있는 것 같아. 체리노의 선전물…… 같은 거지?\""
10027030-51 = "네, 맞습니다."
10027030-52 = "(그때 무언가 종이 같은 것이 팔랑거리면서 떨어졌다.)"
10027030-56 = "[ns3] \"거기다 이건…… 다른 전단지……?\"\n[ns4] \"<요거트 뚜껑을 핥지 않고 버리는 저 가증스러운 수염을 규탄한다!>……?\""
10027030-60 = "우와…… 또 이런 걸 인쇄하고 있네."
10027030-66 = "[ns5] \"어?! 체리노 선전물과 체리노를 규탄하는 전단지를…….\"\n[ns6] \"동시에 인쇄해도 괜찮은 거야?!\""
10027030-70 = "그게 뭐 이상한가요? 이러면 매출이 두 배로 뛰잖아요."
10027030-71 = "가령 <붉은 곰>만 해도, 체리노 회장 찬양 특집과 체리노 회장 풍자만화를 동시에 수록하면, 각기 그걸 보고 싶어 하는 양쪽의 독자가 집어 들기 마련이죠."
10027030-72 = "둘 다 해버리면 이득이 확실한데, 왜 둘 중 하나만 골라야 하느냐는 거죠. 힛. 힛. 히."
10027030-73 = "[s] \"어떤 의미로는 따라가기 힘든 대범한 사고방식이네!\""
10027030-74 = "칭찬 감사합니다. 그래서…… 이쪽 분은 뭐라고 불러 드리면 되죠?"
10027030-75 = "[s] \"선생님인데요.\""
10027030-76 = "네?! 흐, 흐음. 위험했네요. 자칫하면 항상 웃음과 여유를 잃지 않는 출판부의 부장으로서의 영업 페이스가 흔들릴 뻔했어요."
10027030-77 = "그러면 다시 한번…… 출판부에 오신 것을 환영합니다. 선생님. 말씀은 많이 들었어요. 너무 많이 들은 나머지 실제로 존재하는 인물인가에 대해 의문마저 들 정도였지만요."
10027030-78 = "아, 그러고 보니 다음번 월간 <붉은 곰> 특집으로, 출판부를 방문하신 선생님의 전기 특집을 건의할까 하는데요. 어떠신가요, 선생님?"
10027030-79 = "[s] \"안 해요.\""
10027030-80 = "에이. 그러지 마시고요. 속고만 사셨나. 들어 보세요. 이거 선생님께도 좋은 이야기라니까요?"
10027030-81 = "저렇게 납기 안 지키고 팬층도 살짝 애매한 데다 소재도 매니악한 <지식해방전선>과 손을 잡는 것보다는, 확실한 자본력과 홍보력, 그리고 사무국이라는 든든한 뒷배경을 두고 있는 저희 출판부와 협업하시는 편이-"
10027030-83 = "……일단은 사무국이 배경이라는 건 비밀 아니었어……?"
10027030-85 = "앗차, 영업에 열중하다 보니 말이 헛나왔네요. 그 부분은 잊어 주시기를 바라며, 이야기를 계속해 보자면-"
10027030-86 = "[s] \"우리는 묻고 싶은 게 있어서 출판부를 찾아왔어.\""
10027030-87 = "오, 이것은 거래로군요. 제가 선생님의 이 요청을 해결해 드리면, 선생님도 제 부탁을 들어 주시겠다는 암묵적인 약속이라고 봐도 되는 거겠지요?"
10027030-88 = "뭐야, 이야기가 통하지 않습니까. 이것 참, 선생님도 사람이 나쁘시네요. 그런 거라면 진작에 그랬다고 말씀을 하시지, 괜히 제가 오해하고 말았잖아요."
10027030-89 = "그런 거 아니니까 이제 슬슬 남의 말을 듣는 버릇을 들이지 그래. 야쿠모?"
10027030-90 = "그런 거 아니었어요?"
10027030-91 = "절대로! 아니거든!"
10027030-92 = "메루는 가만히 좀 있어요. 지금 선생님에게 묻고 있잖아요. 어떠신가요. 선생님?"
10027030-93 = "[s] \"좋아. 우리의 질문에 답을 해준다면, 출판부에 협력할게.\""
10027030-94 = "선생?! 그런 말 함부로 하면 가죽이 벗겨질지도 몰라!"
10027030-95 = "저기, 메루는 대체 무슨 말을 하는 건가요……?"
10027030-96 = "아니, 방금 그건 당연히 비유의 하나로서……"
10027030-98 = "가죽은 출판부에서 취급할 만한 제품이 아니잖아요?"
10027030-99 = "[s] \"……응?\""
10027030-100 = "……."
10027030-101 = "……?"
10027030-107 = "[ns] \"그, 그래서 일단 본론인데 말이야.\""
10027030-108 = "<루나>요……?"
10027030-109 = "응. <루나>."
10027030-110 = "잠깐만요. 어딘가에서 들은 듯한, 못 들은 듯한…… 가물가물한 기억 저편에서 검은 옷을 입은 고양이가 손수건을 팔랑거리며 이쪽을 쳐다보고 있는 것 같은……."
10027030-111 = "……그거 어딘가 위험한 거 같은데……."
10027030-112 = "아아…… 생각났어요. 분명 그런 만화의 이름을 들은 것 같네요."
10027030-113 = "[s] \"정말이야?\""
10027030-114 = "그렇다고는 해도 제법 예전에 출판된 만화였어서…… 으음. 이래서야 제가 제대로 된 기억을 단번에 떠올리지 못했던 것도 당연하겠네요."
10027030-115 = "아, 아, 아. 네. 이것저것 기억났어요. 그런데 왜 <루나>에 대한 걸, 출판부에 문의를?"
10027030-116 = "[s] \"타카네가 이곳에 오면 단서를 얻을 수 있을 거라고 했어.\""
10027030-117 = "아하…… 과연…… 그런 거였나요…… 타카네도 참……."
10027030-118 = "흐음. 아하. 으으음. 힛. 힛. 히."
10027030-119 = "[s] \"그래서, 단서를 알려줄 수 있을까?\""
10027030-120 = "그렇군요. 단서라…… 확실히 단서라면 있습니다. 선생님과 메루가 듣기에는, 어쩌면 꽤나 구미가 당길 정보가 말이지요."
10027030-121 = "오, 역시! 그래서 그게 뭔데?!"
10027030-122 = "우선, <루나>의 마지막 권에 대한 것은 저도 잘 모른다는 사실을 말해 두죠."
10027030-123 = "그렇게 실망한 표정 짓지 말라고요. 다음 정보도 있으니까."
10027030-124 = "애태우지 말고 빨리 이야기해!"
10027030-125 = "<루나>에는 상당히 오래된 팬덤이 있어요. 그리고 그 팬덤은 붉은겨울에서도 지금까지 살아남아…… 비정기적으로 모임을 갖고 있다고 하죠."
10027030-126 = "거기에서 꾸준한 <활동>을 한다고 하던가요?"
10027030-127 = "<루나>를 좋아해서 비정기적으로 모이는 팬덤……?"
10027030-128 = "[s7] \"완결난 뒤에도 계속 팬들이 모여서 활동을 한다고?\"\n[s8] \"붉은겨울에선 그게 보통이야? 메루?\""
10027030-131 = "아니…… 그렇진 않아."
10027030-132 = "작품이 완결된 뒤, 몇 번 사람들 사이에서 이야기가 나오는 건, 뭐 그럴 수 있어."
10027030-133 = "하지만 완결이 난 뒤에도 꾸준히 언급이 되고…… 팬들이 모여 활동을 한다는 건……"
10027030-134 = "평범한 작품은 해낼 수 없는…… 그런 영역이긴 한데……."
10027030-135 = "뭐, 그만큼 제법 역사가 있었던 만화였다는 뜻이기도 하겠죠."
10027030-136 = "하지만……."
10027030-137 = "[s9] \"하지만 그 모임이 언제, 어디에서 열리는지까지는.\"\n[s10] \"야쿠모도, 정확히는 모른단 뜻이겠구나…….\""
10027030-140 = "아뇨. 아는데요?"
10027030-141 = "어째서?! 여기선 \"당연히 모르고 있어요.\" 라는 약속된 전개여야 하는 거 아냐?!"
10027030-142 = "그거야 뭐, 나름의 휴민트라고 할까, 사람을 통한 정보 습득 루트가 있다고 할까. 그런 거죠."
10027030-143 = "누가 뭐라 해도 저희는 출판부인걸요?"
10027030-144 = "아까는 잘 기억나지 않는다며?!"
10027030-145 = "이봐요. 얼른 기억해 내기 어렵다고 했지, 아예 모른다고는 하지 않았잖아요. 그리고 그 일시와 장소에 대한 것입니다만……."
10027030-146 = "뭔데. 뭔데?"
10027030-147 = "힛. 힛. 히. 이쯤에서 정보에 대한 대가를 요구하고 싶은데 말이죠."
10027030-148 = "[s] \"그렇군. 상응하는 비용이 필요하다는 것인가.\""
10027030-149 = "그런 것입니다."
10027030-150 = "야쿠모…… 대체 선생에게 무엇을 요구하려고?!"
10027030-151 = "아뇨. 볼 일이 있는 건 메루예요."
10027030-152 = "엥? 나?"
10027030-153 = "뭐, 대단한 건 아니에요. 추후 '원고'를 하나 부탁하고 싶달까."
10027030-154 = "으엑! 원고?! 싫어! 네가 의뢰한 원고 중에 제대로 된 건 하나도 없었단 말이야!"
10027030-155 = "어라? 싫어요? <루나>에 대한 정보, 필요하지 않은 모양이군요? 이런, 메루의 진심은 거기까지인가요? 실망이네요~"
10027030-156 = "윽……!"
10027030-161 = "(이것도 저것도…… 모미지에게 사과하기 위해서야……. 그래. 그걸 위해서라면…….)"
10027030-167 = "조, 좋아. 알았다고……. 하면 되잖아……."
10027030-168 = "[s] \"메루, 그런 거래를 받아들여도 괜찮겠어?\""
10027030-169 = "모미지를 위한 거니까. 이 정도쯤은…… 할 수 있어……!"
10027030-170 = "오오. 과연 눈물 없이는 볼 수 없는 동지애로군요."
10027030-171 = "[s] \"메루…….\""
10027030-172 = "하지만 정말 이상한 건 안 그릴 거니까! '내가 그릴만한 거. 전력으로 납득한 거!' 그런 거가 아니면 안 돼!"
10027030-173 = "힛. 힛. 히. 그거라면 걱정 말아요. 아마 제가 부탁드릴 건. '메루라는 작가가 정말로 좋아해 마지않는 원고'가 될 테니까."
10027030-174 = "좋아요! 그러면 약속이 제대로 이행되지 않을 경우, 메루의 타블렛과 펜을 담보로 잡겠다는 이 계약서에 서명을 해 주면 되겠네요."
10027030-175 = "악마냐!"
10027030-176 = "원래 편집자는 창작자에게 있어서 악마 맞아요. 자. 어서요."
10027030-189 = "[ns] \"나는 아무것도 안 해도 괜찮아……?\""
10027030-190 = "아, 그건 말이죠…… 나중에 다시 말씀드리겠습니다. 그편이 더 재미있을 것 같고요."
10027030-191 = "[s] \"선처, 부탁드립니다…….\""
10027030-192 = "힛. 힛. 히."
