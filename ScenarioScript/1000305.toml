[translation]
1000305-1 = "페로로 님 구출 작전"
1000305-2 = "오락실"
1000305-5 = "선생님, 이쪽이에요. 이쪽!"
1000305-6 = "보세요, 거대한 페로로 님 인형이 뽑기 기계 안에 있어요!"
1000305-7 = "저 보들보들한 깃털……. #n후아아…… 보기만 해도 마음이 녹아내리는 것 같아요."
1000305-8 = "분명 저 인형은 작년의 페로로 페스티벌에서 한정 제작된 물건일 텐데……."
1000305-9 = "블랙마켓에서도 구하기 어려운 저 인형이 어째서 여기에 있는 걸까요?"
1000305-10 = "후후, 영문이 어찌되었든 페로로 님을 구출할 좋은 기회에요!"
1000305-11 = "그럼…… 도전!"
1000305-14 = "아앗, 조금만 더…… 조금만 더!"
1000305-16 = "……으으, 아쉽게 실패하고 말았어요."
1000305-17 = "하지만 포기할 수는 없어요! 다음에는 반드시……!"
1000305-18 = "하아아앗!"
1000305-21 = "……으으. 또 실패하고 말았어요."
1000305-22 = "계속 도전하고 싶지만 더는 소지금이 없어서……."
1000305-23 = "아무래도 저 페로로 님과 저의 인연은 여기까지인가 봐요."
1000305-24 = "[s] \"이제 내가 나설 차례네.\""
1000305-25 = "네……? 선생님께서도 저 페로로 인형을 노리고 계셨나요?"
1000305-26 = "[s] \"어른의 힘으로 인형을 뽑는 걸 보여줄게.\""
1000305-27 = "어른의 힘……! 그렇게 말씀하시니 조금은 기대가 되네요!"
1000305-28 = "과연……."
1000305-30 = "[USERNAME], 148번째 도전 중……."
1000305-31 = "[s] \"이번에야 말로 반드시……!\""
1000305-32 = "저, 선생님. 어른의 힘이라는 게 혹시……"
1000305-33 = "[s] \"안 되면 될 때까지 도전하는 게 어른이야!\""
1000305-34 = "하하…… 무모한 것 같지만 가장 확실한 방법이네요."
1000305-35 = "(뽑기 비용이 벌써 다섯자리 수를 넘어가는 것 같지만…….)"
1000305-36 = "선생님, 파이팅! 힘내세요!"
1000305-37 = "[s] \"이야아아압!\""
1000305-43 = "인형이 넘어졌어요! 성공이에요, 선생님!"
1000305-44 = "비록 100번이나 넘게 걸리긴 했지만…… 그래도 멋지게 작전에 성공했네요!"
1000305-45 = "[s] \"자, 선물이야.\""
1000305-46 = "네에? 이 페로로 님 인형을 제게 주신다고요?"
1000305-47 = "하지만 선생님이 모처럼 어른의 힘을 발휘해서 뽑은 인형인데…… 괜찮으시겠어요?"
1000305-48 = "[s] \"물건은 진심으로 원하는 사람이 가졌을 때 가치가 있으니까.\""
1000305-49 = "과연…… 그렇군요. 진정한 가치를 위해서 포기할 줄도 아는 것이 진짜 어른……."
1000305-50 = "감사합니다, 선생님."
1000305-51 = "그 마음을 담아, 이 인형은 소중히 여길게요!"
