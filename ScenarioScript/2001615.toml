[translation]
2001615-1 = "Nostalgic Fraulein"
2001615-4 = "And just like that, I was at the Pandemonium Society with a cup of coffee in hand."
2001615-5 = ""
2001615-8 = "I followed the sound of ruckus coming from the garage."
2001615-9 = ""
2001615-14 = "Inside, I found piles of disorganized mess, along with..."
2001615-15 = "[ns] \"Iroha?\""
2001615-16 = "Oh, Sensei?"
2001615-17 = ""
2001615-20 = ""
2001615-21 = "Huh. I didn't think you'd actually come."
2001615-22 = "And with coffee too?"
2001615-23 = "Thanks. I was really fiending for a cup."
2001615-24 = "[s1] \"Are you cleaning?\"\n[s2] \"Diligent, aren't you?\""
2001615-27 = "Diligent...isn't the word I would use."
2001615-28 = "I'm just thinking of future-Iroha. It'd be a pain if this piled up even more."
2001615-29 = "[s3] \"Isn't that the same thing?\"\n[s4] \"Yup. Diligent Iroha.\""
2001615-32 = "We'll agree to disagree..."
2001615-33 = "Eh, I should just take the compliment. So, sure. Diligent."
2001615-34 = "But you really came all this way just to deliver me coffee?"
2001615-35 = "[s5] \"Well, not really.\"\n[s6] \"I thought I'd lend you a hand.\""
2001615-38 = "...Ah, I see."
2001615-39 = "I said \"coffee,\" and you heard \"help me, please!\""
2001615-40 = "Are you sure about that?"
2001615-41 = "You know I'm the type to take what I can get."
2001615-42 = "[s7] \"And I'm offering!\"\n[s8] \"I'm just paying you back for all the times you've helped me!\""
2001615-45 = "*sigh*"
2001615-46 = "This is why you're always getting exploited by people, Sensei."
2001615-47 = "Well, I'm the villain taking advantage of you this time... Heh."
2001615-48 = "Then, let's start with moving the furniture..."
2001615-50 = "Iroha and I worked diligently on cleaning her hideout for a while."
2001615-51 = ""
2001615-55 = "Until finally..."
2001615-56 = ""
2001615-57 = "A job well done."
2001615-58 = "I would've been working on this until nighttime if it weren't for you."
2001615-59 = "[s9] \"That was a lot more work than I thought...\"\n[s10] \"Were you planning to do all this alone?\""
2001615-62 = "I mean, yeah. I have a lot of private stuff in my hideout."
2001615-63 = "So I wouldn't really want to ask other people to help me clean."
2001615-64 = "But it's different with you. You've been here before, and I don't really mind you seeing."
2001615-65 = "Hm? You're curious what I mean by \"private stuff\"?"
2001615-66 = "...Fufu, are you now?"
2001615-67 = "How much should I show you...? Heh."
2001615-68 = "You want to see right now?"
2001615-69 = "[s11] \"N-No! It's fine!\"\n[s12] \"L-Look at this book I just found!\""
2001615-72 = "...Nice topic change."
2001615-73 = "Oh? Wait, that book..."
2001615-74 = "I've been looking for that, actually. Thanks."
2001615-75 = "[ns] \"Is it special?\""
2001615-76 = ""
2001615-78 = "Well, yeah, I guess... In a way?"
2001615-79 = "...Do you ever think about how you started a hobby or interest?"
2001615-80 = "Because that's what that book is for me."
2001615-81 = "I was pretty surprised at how fun I found it. So I kept looking for more books to read, until it eventually just became a hobby of mine."
2001615-82 = ""
2001615-84 = ""
2001615-85 = ""
2001615-86 = "Well."
2001615-87 = "[ns13] \"I thought that was important to you?!\"\n[ns14] \"You're just tossing it around?!\""
2001615-90 = "What? Why would it be important?"
2001615-91 = "I've been reading books for forever now."
2001615-92 = "It's not like this is the same one I read back then. I bought it at the store recently."
2001615-93 = "There's nothing valuable about that copy. It's not like a first print or limited edition. I don't have any special memories associated with it."
2001615-94 = "[s15] \"But it's a book you like, no?\"\n[s16] \"You should put a book cover on it!\""
2001615-97 = "Nah. That's a pain."
2001615-98 = ""
2001615-100 = ""
2001615-101 = ""
2001615-102 = ""
2001615-103 = "Ehhh, well, I did say that I didn't have any special memories attached to it."
2001615-104 = "But I guess now I do. Next time I see this book, I'll think of this conversation with you. Fufu."
