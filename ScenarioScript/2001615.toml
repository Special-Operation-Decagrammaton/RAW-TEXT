[translation]
2001615-1 = "เด็กสาวที่หวนรำลึก"
2001615-4 = "(พอรู้สึกตัวอีกที คุณครูก็มาถึงแพนเดโมเนียม โซไซตี้พร้อมแก้วกาแฟในมือ...)"
2001615-5 = ""
2001615-8 = "(เสียงอึกทึกบางอย่างดังมาจากทางโรงรถของแพนเดโมเนียม โซไซตี้)"
2001615-9 = ""
2001615-14 = "(เมื่อเข้าไปข้างใน คุณครูก็เห็นข้าวของจำนวนมากกองอยู่ด้านนอก 'ฐานลับ')"
2001615-15 = "[ns] \"อิโรฮะ?\""
2001615-16 = "เอ๋ คุณครู?"
2001615-17 = ""
2001615-20 = ""
2001615-21 = "มาจริงๆ ด้วยสินะคะ"
2001615-22 = "อ๊ะ กาแฟนั่น... หรือว่าเป็นของฉันเหรอคะ?"
2001615-23 = "ขอบคุณค่ะ ฉันอยากได้คาเฟอีนอยู่พอดีเลย"
2001615-24 = "[s1] \"กำลังทำความสะอาดอยู่เหรอ? ขยันจังเลย\"\n[s2] \"ทำความสะอาดอยู่เหรอ? ขยันจังเลยนะ\""
2001615-27 = "จะบอกว่าขยัน... ก็คงไม่ถูกต้องเท่าไรค่ะ"
2001615-28 = "ก็แค่ถ้าไม่ทำตอนนี้ มันจะยิ่งยุ่งยากทีหลังน่ะค่ะ"
2001615-29 = "[s3] \"มันก็เหมือนกันไม่ใช่เหรอ...?\"\n[s4] \"คนทั่วไปเรียกแบบนี้ว่าขยันนะ\""
2001615-32 = "อืม... ฉันคิดว่ามันต่างกันอยู่นิดหน่อยค่ะ"
2001615-33 = "แต่ถ้ามันเป็นภาพลักษณ์ดีๆ ก็ไม่จำเป็นต้องแก้ไขหรอกค่ะ... เอาเป็นแบบนี้แล้วกัน"
2001615-34 = "อ๊ะ ว่าแต่... คุณครูมาที่นี่เพราะกาแฟจริงๆ เหรอคะ?"
2001615-35 = "[s5] \"ไม่ใช่เพราะเรื่องนั้นหรอก\"\n[s6] \"แค่คิดว่าครูอาจจะช่วยอะไรได้บ้างน่ะ\""
2001615-38 = "อ๋อ... อย่างนี้นี่เอง"
2001615-39 = "คุณครูเข้าใจผิดว่านั่นเป็นสัญญาณขอความช่วยเหลือทางอ้อมจากฉันสินะคะ"
2001615-40 = "แต่ถึงอย่างนั้นก็... จะไม่เป็นไรเหรอคะ?"
2001615-41 = "คุณครูก็น่าจะรู้อยู่แล้วนะคะว่าฉันจะไม่ปฏิเสธความช่วยเหลือ"
2001615-42 = "[s7] \"ให้ครูช่วยทำอะไรก็บอกได้เลย!\"\n[s8] \"ที่ผ่านมาครูได้รับความช่วยเหลือตลอดอยู่แล้วนี่นา!\""
2001615-45 = "เฮ้อ..."
2001615-46 = "ก็เป็นเสียอย่างนี้ คุณครูถึงได้ถูกคนไม่ดีเอาเปรียบอยู่เรื่อยยังไงล่ะคะ"
2001615-47 = "แต่ก็นะ... คนไม่ดีคนนั้นคือฉันเองละค่ะ"
2001615-48 = "ถ้างั้นก็ เริ่มจากพวกเฟอร์นิเจอร์ก่อน..."
2001615-50 = "(หลังจากนั้นคุณครูกับอิโรฮะก็ช่วยกันทำความสะอาดฐานลับอยู่พักใหญ่)"
2001615-51 = ""
2001615-55 = "(จนในที่สุด...)"
2001615-56 = ""
2001615-57 = "เหนื่อยแย่เลยนะคะ"
2001615-58 = "ต้องขอบคุณคุณครูที่มาช่วย ก็เลยทำเสร็จก่อนพระอาทิตย์ตกค่ะ"
2001615-59 = "[s9] \"ของมีเยอะกว่าที่คิดอีกนะ...\"\n[s10] \"ตอนแรกคิดจะทำทั้งหมดนี่คนเดียวเลยเหรอ?\""
2001615-62 = "อ่า ก็... ทำนองนั้นค่ะ พอดีที่ฐานลับมีของส่วนตัวของฉันอยู่เยอะน่ะค่ะ"
2001615-63 = "จะขอให้ใครมาช่วยมันก็ดูจะไม่ดี... ไม่สิ ฉันไม่อยากให้ใครก็ได้เข้ามามากกว่าค่ะ"
2001615-64 = "แต่คุณครูเคยเข้ามาในฐานลับแห่งนี้แล้ว เพราะงั้นจะให้เห็นนู่นนี่ก็คงไม่เป็นไร... ในแง่นี้แล้วคุณครูจึงเหมาะสมที่สุดค่ะ"
2001615-65 = "คะ? ที่บอกว่าให้เห็น 'นู่นนี่' หมายถึงอะไรน่ะเหรอคะ?"
2001615-66 = "ฮุฮุ... ก็ไม่รู้สิคะ?"
2001615-67 = "จะให้เห็นถึงแค่ไหนดีนะ..."
2001615-68 = "หรือจะลองตรวจสอบตอนนี้เลยคะ?"
2001615-69 = "[s11] \"มะ... ไม่เป็นไร! หนังสือ! ดูหนังสือดีกว่า!\"\n[s12] \"จริงสิ เมื่อกี้ครูเห็นหนังสือเล่มหนึ่งด้วย!\""
2001615-72 = "ดูออกเลยนะคะว่ากำลังเปลี่ยนเรื่อง..."
2001615-73 = "เอ๋? หนังสือเล่มนั้น...?"
2001615-74 = "อ่า มิน่าล่ะ หาเท่าไรก็หาไม่เจอสักที ที่แท้ก็หลุดมาอยู่ตรงนี้นี่เอง ขอบคุณนะคะ"
2001615-75 = "[ns] \"เป็นหนังสือพิเศษเหรอ?\""
2001615-76 = ""
2001615-78 = "คะ? อ่า... ก็... ถ้าจะให้พูด... ก็คงประมาณนั้นค่ะ"
2001615-79 = "คุณครูจำได้มั้ยคะว่าอะไรเป็นจุดเริ่มต้นที่ทำให้คุณครูมีงานอดิเรกที่ทำในตอนนี้?"
2001615-80 = "ฉันจำของฉันได้ค่ะ ตอนแรกฉันอ่านหนังสือเล่มนั้น..."
2001615-81 = "พอได้อ่านฉันก็ตกใจและคิดกับตัวเองว่าหนังสือเป็นแบบนี้เองสินะ แล้วพอลองหาหนังสือที่คล้ายๆ กันมาอ่าน ก็เลยติดใจการอ่านหนังสือตั้งแต่นั้นมา..."
2001615-82 = ""
2001615-84 = ""
2001615-85 = ""
2001615-86 = "นี่แหนะ"
2001615-87 = "[ns13] \"ไม่ใช่หนังสือสำคัญเหรอ?!\"\n[ns14] \"จะทำกับหนังสือแบบนี้ได้เหรอ?!\""
2001615-90 = "คะ? ไม่ค่ะ ไม่ใช่ของสำคัญเลยสักนิด"
2001615-91 = "ฉันเริ่มอ่านหนังสือตั้งแต่ยังเด็กมากเลยนะคะ"
2001615-92 = "ไม่มีทางที่ฉันจะเก็บหนังสือเล่มที่อ่านตั้งแต่สมัยนั้นไว้จนถึงตอนนี้หรอกค่ะ เล่มนี้เป็นแค่หนังสือปกเดียวกันที่ฉันซื้อจากร้านหนังสือค่ะ"
2001615-93 = "มันไม่ใช่เล่มที่มีคุณค่าทางจิตใจ หรือมีมูลค่าในการสะสมเหมือนฉบับพิมพ์ครั้งแรกหรือฉบับพิเศษ#nสำหรับนักสะสมด้วย..."
2001615-94 = "[s15] \"แต่ก็เป็นหนังสือที่ชอบไม่ใช่เหรอ? งั้นก็ควรดูแลให้ดีสิ\"\n[s16] \"แต่ถ้าเป็นหนังสือที่ชอบ งั้นลองเอาไปห่อปกดูมั้ย?\""
2001615-97 = "ไม่เอาค่ะ มันยุ่งยากออก"
2001615-98 = ""
2001615-100 = ""
2001615-101 = ""
2001615-102 = ""
2001615-103 = "แต่ก็นะ... ถึงจะบอกว่าไม่มีความทรงจำอะไรเกี่ยวกับเล่มนี้เลย..."
2001615-104 = "แต่จากนี้ไป พอฉันเห็นหนังสือเล่มนี้ ก็คงนึกถึงบทสนทนาของเราในวันนี้ขึ้นมานะคะ ฮุฮุ"
