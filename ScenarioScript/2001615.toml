[translation]
2001615-1 = "回憶的少女"
2001615-4 = "（……等回過神來，居然已經拿著咖啡來到了萬魔殿）"
2001615-5 = ""
2001615-8 = "（從萬魔殿的車庫，傳來了某種吵鬧的聲音）"
2001615-9 = ""
2001615-14 = "（進到裡面之後，只見相當多的行李正堆在「休息空間」外面）"
2001615-15 = "[ns] 「伊呂波？」"
2001615-16 = "咦，老師？"
2001615-17 = ""
2001615-20 = ""
2001615-21 = "你真的來了呢。"
2001615-22 = "啊，那杯咖啡……該不會是我的吧？"
2001615-23 = "謝謝你。我正好覺得咖啡因不夠了呢。"
2001615-24 = "[s1] 「你在打掃嗎？」\n[s2] 「真勤勞呢。」"
2001615-27 = "勤勞……這個說法，好像有點不太對呢。"
2001615-28 = "我只是覺得如果現在不做的話，之後可能會更麻煩而已。"
2001615-29 = "[s3] 「有什麼不一樣嗎……？」\n[s4] 「世人就把這稱為勤勞哦。」"
2001615-32 = "……我是覺得有點不一樣啦。"
2001615-33 = "不過倒也沒必要特地去糾正好印象……就當作是那樣吧。"
2001615-34 = "啊，話說你真的是因為咖啡才來的嗎？"
2001615-35 = "[s5] 「不是那樣啦。」\n[s6] 「只是想說也許能幫上點忙。」"
2001615-38 = "……啊啊，原來如此。"
2001615-39 = "看來你似乎是把那則訊息，誤會成間接的求救信號了呢。"
2001615-40 = "不過，你確定可以嗎？"
2001615-41 = "你應該知道……我可是不會客氣的哦？"
2001615-42 = "[s7] 「儘管交給我吧！」\n[s8] 「畢竟我平常受了你不少照顧啊！」"
2001615-45 = "唉……"
2001615-46 = "就是因為你老是那樣，才會被壞人利用個沒完啊。"
2001615-47 = "雖然那個壞人是我本人就是了。"
2001615-48 = "那麼首先從家具開始……"
2001615-50 = "（就這樣和伊呂波一起打掃休息空間，度過了好一段時間）"
2001615-51 = ""
2001615-55 = "（在那之後……）"
2001615-56 = ""
2001615-57 = "辛苦了。"
2001615-58 = "多虧有你，順利趕在天黑之前搞定了呢。"
2001615-59 = "[s9] 「比想像中還多呢……」\n[s10] 「你原本打算一個人做嗎？」"
2001615-62 = "嗯，是啊。畢竟休息空間裡有很多私人物品嘛。"
2001615-63 = "隨便拜託別人的話有點……不，其實我只是單純不想而已。"
2001615-64 = "老師以前也進來過這裡，讓你看見各種東西也無所謂……#n某種意義上來說，正是最適合的人選呢。"
2001615-65 = "咦？你問「各種東西」是什麼？"
2001615-66 = "……呵呵，誰知道呢？"
2001615-67 = "究竟能讓你看到什麼程度……"
2001615-68 = "要現在確認一下嗎？"
2001615-69 = "[s11] 「沒，沒關係，不用了！」\n[s12] 「話說回來，我剛才找到了一本書耶！」"
2001615-72 = "……這話題轉移得還真硬呢。"
2001615-73 = "咦，那本書是……？"
2001615-74 = "難怪我會找不到，原來是掉出去了啊。謝謝你。"
2001615-75 = "[ns] 「是很特別的書嗎？」"
2001615-76 = ""
2001615-78 = "咦？唔嗯，硬要說的話……勉強算是吧？"
2001615-79 = "……老師還記得自己開始某個興趣的契機嗎？"
2001615-80 = "我還記得哦。第一次讀了那本書之後……"
2001615-81 = "原來書竟然是這樣的東西……讓我受到了相當大的震撼呢。#n於是在找了類似的書來看之後，就這麼迷上了閱讀……"
2001615-82 = ""
2001615-84 = ""
2001615-85 = ""
2001615-86 = "嘿咿。"
2001615-87 = "[ns13] 「那不是很珍貴的書嗎！？」\n[ns14] 「可以那樣隨便對待嗎！？」"
2001615-90 = "咦？沒有，那一點都不珍貴哦。"
2001615-91 = "我可是從很小的時候就開始讀書了呢。"
2001615-92 = "那個年紀讀的書，總不可能一直保存到現在嘛？#n這只是我在書店買來的同一本書而已。"
2001615-93 = "既沒有蘊含什麼回憶，也不是初版或典藏版那種有收藏價值的東西……"
2001615-94 = "[s15] 「不過這也是你喜歡的書吧？」\n[s16] 「要不要幫它包個書套呢？」"
2001615-97 = "不要。那樣很麻煩。"
2001615-98 = ""
2001615-100 = ""
2001615-101 = ""
2001615-102 = ""
2001615-103 = "不過，雖然我說它沒有任何回憶……"
2001615-104 = "但是今後每次看到這本書，大概都會想起今天這段對話吧。呵呵。"
