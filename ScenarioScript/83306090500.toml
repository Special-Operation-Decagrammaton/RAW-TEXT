[translation]
83306090500-11 = "하아! 하아! 하아……! 늦어서 미안! 에리카!"
83306090500-12 = "키라라. 너무 늦었잖아. 덕분에 선도부장이랑 전부 끝내버렸다고."
83306090500-13 = "미안! 오는 길에 하필 횡단보도 앞에서 곤란해하고 있는 할머니와 만나버린 바람에……! 정말루 미안!"
83306090500-14 = "뭐어, 키라라라면 그런 이유로 늦을 거로 생각하긴 했지만."
83306090500-15 = "근데, 당번 일! 히나찌가 도와준 거야?! 진짜?!"
83306090500-16 = "아아, 응. 어쩌다 보니……"
83306090500-17 = "으으음~ 원래는 내가 했어야 할 일을 도와주다니 고마워!"
83306090500-18 = "보답으로 나중에 우리 귀가부가 자주 사 먹는 크레이프 사줄게!"
83306090500-19 = "응? 아니, 그럴 필요까진……"
83306090500-20 = "안돼안돼~! 도움을 받았으면 당연히 보답해야 한다구!"
83306090500-21 = "이럴 때의 키라라는 고집불통이니까. 받아두는 게 좋을 거야."
83306090500-22 = "……그런 거라면, 알았어. 나중에 시간이 있을 때 그럼…"
83306090500-23 = "응! 약속이야~!"
