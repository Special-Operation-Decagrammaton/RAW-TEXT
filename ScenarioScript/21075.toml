[translation]
21075-4 = "……."
21075-5 = "훌륭해."
21075-6 = "크윽! 분해! 하지만 어쩔 수 없지!"
21075-7 = "아리스여! 빛의 검은, 그대의 것이 되었다!"
21075-8 = "와아! 와아!"
21075-9 = "휴우, 다행이다."
21075-10 = "그걸 사용할 수 있다니 대단하네……."
21075-11 = "이리 와, 아리스. 간단한 사용법이랑 손잡이 쪽을 좀 더 보강해줄게."
21075-23 = "최소 1톤 이상으로 추정되는 악력, 발사 시에도 흔들림 없이 안정된 밸런스, 강도나 출력은 물론 피부 전반에 티끌조차 보이지 않는 말끔한 육체…… 아니…… 기체."
21075-24 = "즉, 애초에 혹독한 환경 속에서 나노머신을 통한 '자가 수복'을 전제로 만들어진 몸……."
21075-25 = "그 목적은…… 분명……"
21075-27 = "…… '전투' ……겠지."
21075-31 = "아리스…… 너는 대체……?"
21075-33 = "다음화;자격 심사"
