[translation]
10014080-1 = "제8화;봉인된 마수 카스팔루그"
10014080-3 = "(……다음 날.)"
10014080-4 = "어, 왔어. 선생님?"
10014080-5 = "……후후. 이번에는 내가 기다리고 있었지."
10014080-6 = "그렇구나. 선생님은 보통 이 정도로 더 일찍 나와 있는 거구나."
10014080-7 = "[s1] \"벌써 와 있던 거야, 카즈사?\"\n[s2] \"아직 약속한 시간은 한참 남았는데…….\""
10014080-8 = "……응? 아니, 뭐 별다른 이유가 있는 건 아닌데."
10014080-9 = "……응? 아니, 뭐 별다른 이유가 있는 건 아닌데."
10014080-10 = "그저 선생님이 평소에 약속 잡으면 얼마나 더 일찍 나오는지 알아보고 싶었을 뿐이야."
10014080-11 = "뭐, 이런 여유도 다 선생님 덕분이지."
10014080-12 = "……응. 고마워, 선생님. 진심으로, 감사하고 있어."
10014080-13 = "[s3] \"전보다 말이 좀 편해졌네.\"\n[s4] \"말투에 여유가 붙었네, 카즈사.\""
10014080-14 = "뭐…… 그렇지."
10014080-15 = "뭐…… 그렇지."
10014080-16 = "사실 이번 일……. 선생님한테 말하기 전까진, 혼자서는 어떻게 해야 할지 감도 못 잡고 있었거든."
10014080-17 = "그저 지푸라기라도 잡는 심정이었는데……. 역시 부탁하는 게 정답이었던 것 같아."
10014080-18 = "……중간까지는 좀 못 미더워서 열 받기도 했지만 말이지."
10014080-22 = "……선생님."
10014080-23 = "사실 처음부터 다 알고 있었지? 이번 일……. 그저 내가 어떻게 받아들이느냐의 문제였을 뿐이라는 거."
10014080-24 = "그러니까 우자와가 아니라 날 계속 불러냈던 거잖아. 그치?"
10014080-25 = "……왜 직접 말해주지 않았던 거야? 왜 계속 옆에서 지켜보기만 한 거야?"
10014080-26 = "그냥 궁금해서 물어보는 것뿐이야. 어려운 말들은 아니었잖아."
10014080-27 = "'네가 생각하기에 달렸다.', '좋게 생각하면 될 일이다.', '마음먹기에 따라 다른 거다.'……."
10014080-28 = "지금에 와서야 하는 말이지만, 그건 나라도 말해줄 수 있을 거 같은데."
10014080-29 = "[s5] \"……그거야 '지금에 와서'니까.\"\n[s6] \"잔소리로 해결할 일이 아니었어.\"\n[s7] \"지켜보는 게 필요한 일이었거든.\""
10014080-30 = "……으음."
10014080-31 = "……으음."
10014080-32 = "……으음."
10014080-33 = "그런가. 솔직히 아직은 좀 이해하기 어렵지만……."
10014080-34 = "뭐……. 괜찮아. 어느 정도 대답은 된 거 같으니……."
10014080-35 = "……응?"
10014080-36 = "……뭐라고?"
10014080-37 = "아직 한가지 듣지 않은 게 있다고? ……? 그게 뭔데?"
10014080-38 = "……스케반을 그만두었던 이유? 어……. 말하지 않았었나? 그건……."
10014080-42 = "……알았어. 아무래도 좀 더 자세한 걸 듣고 싶은 모양이네."
10014080-43 = "근데 진짜 별로 대단한 이유는 아닌데……."
10014080-44 = "들어 봐야 재미도 없고, 뭔가 기대했다면 실망할 게 뻔할 텐데. 괜찮겠어?"
10014080-45 = "……아. 네. 알겠습니다요. 이제 와서 말해 주는 것 정도야 어렵진 않지."
10014080-46 = "뭐, 그건……. 그냥……."
10014080-48 = "진짜 별다를 거 없는 날이었어. 평소처럼 한바탕 하고, 이겼다는 기분에 도취해 흥얼거리며 집으로 돌아가고 있었지."
10014080-49 = "……우연히……. 어떤 아이가 한 명 눈에 들어왔어."
10014080-52 = "도로변 한쪽의 예쁜 카페 안에서, 케이크랑 파르페를 먹으며 재잘거리던 아이였지."
10014080-54 = "아무리 봐도 왜 먹는지 모를……. 민트초코 같은 걸 먹으면서 친구들이랑 웃고 있더라."
10014080-56 = "왜인지는 나도 잘 모르겠는데……. 그냥 그걸 보고 멍하니 발걸음이 멈췄어."
10014080-57 = "신기하지. 진짜 아무것도 아니었는데. 그게 뭐라고……."
10014080-59 = "……그치만 즐거워 보이더라. 귀엽고, 부드러운 느낌이었어. 포근한 웃음이었지."
10014080-61 = "그때의 나로서는, 어떻게 따라 하려 해도 낼 수 없는 분위기가 있었어."
10014080-66 = "그렇게 생각하니…… 갑자기 엄청 하고 싶어지더라고."
10014080-67 = "……그 아이처럼 되고 싶었어. 그것뿐이야."
10014080-70 = "무식하게 그저 따라 하고 있었는데, 어느새 이런 상황까지 오게 된 거지."
10014080-74 = "뭐…… 그 과정에서 예전 모습을 지우고 싶다는 생각에……."
10014080-75 = "어쩌면 이번에는, 나도 모르게 조금 히스테리를 부린 걸지도 모르겠네."
10014080-76 = "굳이 똑같이 될 필요까지는 없었던 걸지도 모르는데……."
10014080-77 = "……?"
10014080-78 = "……어……."
10014080-79 = "……하하."
10014080-80 = "……과연, 그렇구나. 그런 거였어."
10014080-81 = "선생님……."
10014080-82 = "……정말……. 어른이란 치사하네."
10014080-83 = "[s8] \"그만 부실로 돌아갈까.\"\n[s9] \"이걸로 상담은 끝이네.\""
10014080-89 = "…………응."
