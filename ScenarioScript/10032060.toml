[translation]
10032060-1 = "제6화;어처구니없는 오해"
10032060-3 = "……이쪽이야."
10032060-10 = "이상하네. 속도가 빨라졌어. 호위 대상이 있는 상태로 이 속도는 나오기 어려울 텐데……."
10032060-11 = "뭔가의 조치를 취한 모양이네. 뭐, 다른 녀석도 아니고 조마에 사오리야. 어떻게든 했겠지."
10032060-12 = "그나저나……."
10032060-16 = "이상한걸. 이 경로는 분명 지하 주차장으로 통하는 경로일 텐데……."
10032060-17 = "……거기서 접선한 뒤 탈출하려는 계획인가. 그렇다면 시간이 얼마 없겠네."
10032060-18 = "가는 곳마다 쓰러져 있는 사람들뿐인데……? 자기들끼리 싸운 거야, 이 사람들은?"
10032060-19 = "아니. 그래 보이지는 않아. 정황상 모두 조마에 사오리에게 당한 거라고 봐야지."
10032060-20 = "아하. 과연……."
10032060-24 = "……잠깐만, 뭐라고?"
10032060-25 = "설마 혼자서 이 많은 사람을 상대했다고?"
10032060-26 = "[s1] \"……뭐, 아무래도 사오리니까.\"\n[s2] \"이런 곳에서의 싸움이라면……. 그럴 수 있지.\""
10032060-29 = "……생각보다 자세히 아는 사이였나 보네, 선생."
10032060-30 = "그런 쪽에도 아는 사람이 있을 줄은……. 아니, 선생이니까 무리도 아닌가."
10032060-31 = "역시 좀 곤란하게 만든 거 같은데. 괜찮은 거야?"
10032060-32 = "선생 입장에선 딱히 편을 들기도 그렇고. 지금이라도 돌아가는 게 좋지 않겠어? 우리는 괜찮으니까."
10032060-33 = "……응?"
10032060-34 = "그럴 수 없다고? 어째서……."
10032060-35 = "[s3] \"일이 커지는 걸 방지하기 위해서라도 함께 해야지.\"\n[s4] \"혹시 누가 다치기라도 하면 큰일이니까.\""
10032060-39 = "이야~ 그야말로 선생님다운 대답이네!"
10032060-40 = "뭐……. 그렇겠지."
10032060-41 = "서둘러야 해. 지하 주차장까지는 얼마 남지 않았으니까."
10032060-42 = "조마에 사오리가 돈 아란치노를 데리고 이곳을 빠져나가면 그쪽의 승리."
10032060-43 = "그전에 우리가 따라잡아 빼앗으면 우리의 승리!!"
10032060-45 = "하루카, 갑니다!!"
10032060-56 = "[ns5] \"……아루?\"\n[ns6] \"왜 그래? 고민이 있어 보이는데.\""
10032060-59 = "으, 으응!? 아, 아니. 그냥. 그……. 별 건 아니고!"
10032060-60 = "그냥 좀 생각 중이었어! 생각 중!"
10032060-61 = "조금 괜찮나 싶어서……. 다른 게 아니라 선생님의……."
10032060-62 = "……BD……."
10032060-66 = "[ns7] \"……BD?\"\n[ns8] \"……아.\""
10032060-69 = "아무리 생각해도 역시……. 지금 뭔가 너무 많이 벗어난 것 같은데……."
10032060-70 = "선생님은 그거 때문에 온 거잖아? 뭔가 우리 때문에 정작 선생님 일을 못하고 있는 것 같달까……."
10032060-71 = "안내하며 도와주겠다고 한 주제에 오히려 이쪽 일을 맡기고 있는 느낌이랄까……. 좀……."
10032060-75 = "그, 그냥 그거니까! 선생은 우리 흥신소의 중요한 경영고문이니까……!"
10032060-76 = "협력 관계에서 이런 신뢰는 무엇보다 중요하잖아? 그런 의미에서 그냥……!!"
10032060-77 = "……응?"
10032060-78 = "괜찮다고? BD는 일단 신경 쓰지 말라고? 그렇지만 선생님의 일인데……."
10032060-79 = "[s9] \"이것도 충분히 내 일이니까.\"\n[s10] \"교재도 중요하지만, 아무래도 학생이 우선이지.\""
10032060-82 = "…………."
10032060-83 = "……선생님……."
10032060-84 = "후, 후후……. 훌륭하네. 아주 적절한 대답이었어. 역시 선생님."
10032060-85 = "좋아. 그렇게까지 말해주니, 우선 그 호의를 받도록 하지."
10032060-86 = "하지만 걱정하지 마. 우리 흥신소 68은 받은 일에 대해선 빚도 원수도 철저히 갚아주는 주의니까."
10032060-87 = "언젠가 책임지고……. 흥신소의 이름으로 꼭 이 빚을 돌려주지!"
10032060-88 = "그럼 우선 지하주차장이야. 가자고, 선생님!!"
