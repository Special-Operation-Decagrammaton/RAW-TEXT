[translation]
70008010-1 = "살벌! 망량즈 나이트! 1"
70008010-3 = "(평화로운 봄날…)"
70008010-5 = "아!!!! 못 해 먹겠다!!!!"
70008010-8 = "깜짝이야! 리더, 갑자기 왜 그래요?"
70008010-10 = "왜 그런지 모르겠어?! 진짜로?! 우리가 뭘 하고 있는지 보라고!"
70008010-11 = "뭘 하고 있다뇨…… 그냥, 평소랑 똑같이 청소 중인데요?"
70008010-12 = "그래, 바로 그게 문제야! 왜 우리가 청소를 하고 있는 거냐고! 심지어 요즘은 거의 매일매일 청소만 하잖아!"
70008010-13 = "그야 어쩔 수 없죠. 저번에 백화요란 놈들한테 호되게 당했으니까요."
70008010-14 = "우리가 이겼으면 그 녀석들을 청소시킬 텐데."
70008010-15 = "그러면 진짜 재밌겠다. 근데 매번 지잖아."
70008010-16 = "상상만 해보는 거지. 요즘은 하도 청소를 많이 해서 그런지, 거리에 쓰레기가 떨어져 있으면 무심코 줍는다니까."
70008010-17 = "어? 너도 그래?"
70008010-22 = "크아앗! 그런 이야기로 공감대 형성하지 마!"
70008010-23 = "이런 게 아니라고! 우리는 망량즈잖아! 좀 더 망량즈다운 활동을 해야지!"
70008010-24 = "……? 망량즈다운 게 뭔데요?"
70008010-25 = "뭐? 당연히 그건! 그야……!"
70008010-29 = "어라, 망량즈다운 게 뭐지……?"
70008010-31 = "길거리 망량즈 아지트"
70008010-32 = "흐으으음……."
70008010-34 = "리더~ 아직도 고민 중이에요? 리더도 참 별나다니까."
70008010-35 = "그러게. 모여서 노는 게 중요한 거지, 이름이 뭐가 중요하다고."
70008010-37 = "큰일이야~ 큰일!!"
70008010-41 = "리더! 리더! 엄청 긴급 사태에요! 빨리 봐봐요!"
70008010-42 = "뭐, 뭐야! 갑자기! 지금 생각하고 있는 거 안 보여?! 얼마나 급한 일이길래 그렇게 소란 피우는 거야!"
70008010-43 = "아, 사실 별로 급한 건 아니에요. 그냥 놀라게 하려고요."
70008010-53 = "크아아아앗!!! 이 자식이!!!!"
70008010-54 = "으악!! 폭력 반대!!"
70008010-55 = "하하하하! 리더가 화났다!"
70008010-57 = "……그래서, 결국 용건이 뭐야?"
70008010-58 = "아, 맞다. 웃느라 깜빡했네. 리더 이름 앞으로 초대장이 왔어요."
70008010-59 = "초대장?"
70008010-60 = "망량즈 나이트…… 라고 하면 알 거라던데."
70008010-61 = "뭐?! 망량즈 나이트라고?! 그게 진짜야?!"
70008010-63 = "망량즈 나이트? 그게 뭐지? 넌 알아?"
70008010-64 = "전에 들어본 거 같기도……."
70008010-65 = "너희는 망량즈면서 이런 기본적인 것도 모르는 거냐!! 똑똑히 알려줄 테니까 잘 들어!!"
70008010-71 = "망량즈 나이트…… 아주 먼 옛날 망량즈가 처음 생겨났을 때부터 이어져 온 비밀 회합."
70008010-75 = "개최한다는 소문만 이따금 들릴 뿐. 오직 망량즈 중에서도 망량즈만 초대받는다는 전설의 총회……!"
70008010-78 = "이름하여 망량즈 나이트!"
70008010-79 = "오랜 노력 끝에 우리 이름도 마침내 세상에 알려진 거야!"
70008010-84 = "흐음…… 그렇군요~"
70008010-86 = "어, 뭐, 뭐야. 그 반응들은?! 기쁘지 않아?! 망량즈 나이트라니까?!"
70008010-87 = "아니, 뭐, 리더가 기쁘다면 저도 기쁘지만…… 솔직히 무슨 얘긴지도 잘 모르겠고."
70008010-88 = "그보다 망량즈가 그렇게 오래된 거였어요? 저는 그냥 붙인 이름인 줄 알았는데."
70008010-89 = "에휴~ 됐다 됐어~ 내가 이런 얘기를 너희랑 해서 뭐하겠냐."
70008010-90 = "하여튼 망량즈 나이트에서는 절대로 다른 리더들에게 얕보이면 안 돼. 예를 들어…… 가면이라든지. 위엄 있는 걸 써야겠지."
70008010-91 = "……근데 리더는 가면 안 쓰지 않아?"
70008010-93 = "야! 그걸 말하면 어떻게 해! 민감한 문제면 어쩌려고!"
70008010-94 = "아, 앗! 미안, 리더! 그런 줄도 모르고!"
70008010-96 = "크으읏……! 이 녀석들이, 떠들게 두니까……."
70008010-97 = "나는, 그저 내 격에 맞는 가면을 찾지 못했을 뿐이니까!"
70008010-99 = "확실히…… 가면은 고르기 힘들지. 유행하는 가면을 쓰자니 남들 따라 하는 거 같고. 개성을 살린다고 안 예쁜 가면을 쓰는 것도 좀……."
70008010-100 = "아~ 뭔지 알 것 같아. 나도 고를 때 며칠은 고민했어."
70008010-102 = "맞아…… 우리 망량즈에게 가면은 중대사…… 단순히 얼굴을 가리는 수단이 아니야. 내면부터 감정까지, 그 모든 것을 하나의 표정으로 표현해야 해."
70008010-103 = "2년 전, 당시 백화요란 부장과 백 합을 겨루고도 승부가 나지 않았다는 전설의 망량즈는 여러 개 가면을 가지고 다니면서 그때그때 감정을 표현했다 하지."
70008010-104 = "그러니 망량즈 나이트처럼 중요한 자리에 맨얼굴로 나간다는 건 있을 수 없는 일."
70008010-105 = "하지만 그렇다고 흔해 빠진 가면을 쓰면 그것대로 무시당할 게 뻔해!"
70008010-107 = "오, 설마!"
70008010-109 = "……결심했다!! 길거리 망량즈, 지금부터 리더의 품격에 맞는 가면을 찾으러 출동이다!!"
70008010-111 = "와, 리더, 드디어 가면을 맞추는구나!"
70008010-112 = "재밌겠다! 안 그래도 잘 어울리겠다고 생각한 가면이 있거든요!"
70008010-114 = "그러니까!!! 놀러 가는 게 아니래도!!! 진지하게 하라고!!!"
