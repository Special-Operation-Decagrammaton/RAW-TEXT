[translation]
10034190-1 = "1일 전: 출정 준비"
10034190-3 = "오늘이 마지막 날이다, 음악대의 기수들이여."
10034190-4 = "……긴 원정이었다."
10034190-5 = "…………."
10034190-6 = "…………."
10034190-7 = "…………."
10034190-9 = "우리는 먼 길을 돌아왔지만, 결국 결전 앞에 섰다."
10034190-10 = "때론 방황도 하였지만 모든 방황하는 자들이 길을 잃은 것이 아니듯, 이 또한 모두 우리에게 필요한 양분이었다."
10034190-11 = "힘든 일이라는 건 알고 있다. 테스트의 수준은 높고, 우리는 아직 오합지졸이다."
10034190-12 = "하지만 그렇다고 조건이 달라지진 않는다."
10034190-13 = "셈라는 기다리고, 테스트는 해야 하고……."
10034190-14 = "……그럼 뭐, 망설일 게 있겠나?"
10034190-15 = "동요하지 마라! 각자가 해야 할 일을 하고, 서로를 돌아본다면 이 기나긴 원정의 마침표는 원하는 문장 끝에 찍힐 것이다!"
10034190-20 = "결코 추억만 남기자고 연습해 온 게 아니다! 각자의 위장 속에 담을 셈라를 쟁취하라!!"
10034190-21 = "방과후 디저트단은, 반드시 승리할 것이다!"
