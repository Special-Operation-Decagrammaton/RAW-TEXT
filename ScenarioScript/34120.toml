[translation]
34120-1 = "제12화;아리우스 자치구"
34120-6 = "……그래서…… 아츠코를…… <그녀>의 명에 따라 아리우스 자치구의 바실리카로……."
34120-7 = "우, 우리가 알고 있는 건 그것뿐……."
34120-13 = "아리우스 자치구로……. 너희는 동료를 구하기 위해 돌아간 거야……? 선생님과 함께?"
34120-14 = "그렇겠지…… 응."
34120-15 = "선생님이라면…… 분명히 그러고도 남을 거야."
34120-16 = "……."
34120-17 = "그치만……"
34120-18 = "그래도……. 그래도……."
34120-22 = "……쫓을 거야. 쫓아가서 복수할 거야."
34120-23 = "나를 경멸하겠지……? 실망하겠지? 선생님에게만큼은 미움받고 싶지 않았는데……."
34120-24 = "……하지만 그래도 나는 멈출 수가 없어."
34120-25 = "왜냐하면……."
34120-26 = "응, 아리우스 스쿼드를 절대 용서할 수 없으니까. 악귀가 되어서라도 쫓아가서 복수하고 말 거야."
34120-30 = "……그러니까, 선생님. 나를 말리지 마."
34120-39 = "……."
34120-40 = "……아, 아무도 없어요! 다들 올라오세요!"
34120-41 = "[ns] 천장의 구멍으로 올라간다."
34120-45 = "……. 여기라면 경계가 없을 거라고 생각했는데, 정답이었네."
34120-46 = "그, 그러게요……."
34120-47 = "하아…… 하아……."
34120-48 = "[s] \"여기가 아리우스 자치구……?\""
34120-49 = "……예전엔 그랬지. 지금은 버려져 방치된 지역이야."
34120-50 = "……."
34120-51 = "진짜 자치구는 여기서 조금 더 가야 해. 하지만 우리가 오고 있다는 걸 <그녀>가 알고 있는 이상 섣불리 접근할 수는 없겠지."
34120-52 = "……여기는 훈련장이었어요."
34120-53 = "[s] \"훈련장?\""
34120-54 = "원래는 유적지였지만 내전이 끝난 후엔 훈련장으로도 쓰였었지."
34120-55 = "[s] \"내전……?\""
34120-57 = "아리우스 자치구가 둘로 나뉘어서 벌어졌던 전쟁이야. 우리 또래의 아리우스 학생이라면 누구나 알고 있는 이야기지. 벌써 10년 전의 이야기야."
34120-58 = "[s] 미사키의 말을 경청한다."
34120-59 = "……그런 것에 관심이 많나 보네, 선생님은."
34120-60 = "하지만 별로 유쾌한 이야기는 아니니까 더 하고 싶진 않은데. 지금 임무와 관계가 있는 것도 아니고."
34120-61 = "저……."
34120-62 = "아직 기억하고 있어요. 여기였죠? 아즈사 쨩을 처음 알게 된 곳이."
34120-63 = "……."
34120-67 = "사격 훈련이었나, 폭발물 제조 훈련이었나…… 어른의 <명령>에 따르지 않는다고 어떤 아이가 바닥에 나뒹굴 정도로 구타당하고 있었어요……."
34120-68 = "[s] \"…….\""
34120-69 = "거기 있던 모두는 벌벌 떨면서 지켜보고만 있었는데도…… 그 학생은 몇 번이고, 몇 번이고 다시 일어나서 앞을 노려보는 걸 멈추지 않았고……."
34120-70 = "이대로 가다간 그 아이의 헤일로가 부서질 것 같아서…… 저는 너무 무서워서 울고만 있었는데……."
34120-71 = "그때 사오리 언니…… 아니, 리더가 달려와서……."
34120-72 = "……추억에 젖는 건 다음에. 지금은 임무에 집중해야 해."
34120-76 = "그럼 이제부터 어떻게 할 거야, 리더? 뭔가 제대로 된 계획은 있어?"
34120-81 = "……."
34120-82 = "어른을 데려오긴 했지만 우리들만으로 이 자치구 전체와 <그녀>를 상대로 싸울 수는 없어. 어떻게 공주님을 구할 거지?"
34120-86 = "……리더?"
34120-91 = "[ns] \"사오리?!\""
34120-92 = "리, 리더?!"
34120-93 = "하아…… 하아……."
34120-96 = "……!! 굉장한 열이야. 이 지경이 될 때까지 참고 있었던 건가……."
34120-97 = "네?!"
34120-98 = "……하긴. 리더는 나흘 가까이 쉬지도 못했어. 부상에 수면 부족과 피로……. 그 모든 게 지금 터져 나온 거겠지."
34120-99 = "아, 아아……. 어, 어떡하죠?"
34120-103 = "[ns] 상비약으로 가지고 있던 해열제를 꺼낸다."
34120-104 = "주머니에서 의료품이!?"
34120-105 = "……그런 걸 가지고 다니는 건가. 선생님은."
34120-106 = "[s1] \"편의점에서 파니까.\"\n[s2] \"소화제나 고양이 간식, 초코바 같은 것도 있지만.\""
34120-107 = "과연…… 어른은 무서워…… 무서워……."
34120-108 = "과연…… 어른은 무서워…… 무서워……."
34120-109 = "다행이네."
34120-113 = "……이걸 삼켜. 리더. 편해질 거야."
34120-119 = "(꿀꺽) ……하아, 하아……."
34120-120 = "리더……."
34120-121 = "[s] \"여기서 조금만 휴식을 취하자.\""
34120-122 = "……그래. 지금은 그것 말고는 선택지가 없겠네."
34120-123 = "네……. 그, 그럼 불침번은 제가……?"
34120-124 = "아니, 교대로 해. 히요리도 휴식을 취해두지 않으면 안 되니까."
34120-125 = "선생님도 잠깐 눈을 붙여 둬. 불침번은 내가 먼저 설 테니까."
34120-126 = "[s] \"고마워.\""
34120-127 = "네, 네. 알겠어요……."
34120-134 = "(근처의 적당한 구석에 주저앉아 쉬었다…….)"
34120-140 = "……선생님. 제 목소리가 들리시나요……?"
34120-141 = "제 목소리가 들리신다면…… 부디……."
34120-142 = "저는 지금 꿈도 현실도 아닌 곳에 갇혀 있습니다……. 언제까지 여기 남아 있을 수 있을지 알지 못해요."
34120-143 = "시간이 얼마 없습니다……. 선생님에게 최대한 지금 상황을 전하지 않으면 안 되겠죠……."
34120-144 = "제가…… 실수를 했습니다……."
34120-146 = "저는 꿈속에서 게마트리아를 만났고, 그들의 회의를 엿들었습니다……."
34120-155 = "아리우스 자치구를 지배하고 있는 베아트리체는 아리우스 바실리카에서 어떤 의식을 치르려고 하고 있었습니다……."
34120-167 = "그 의식의 끝에는…… 키보토스의 멸망이 비치고 있었습니다……."
34120-169 = "베아트리체의 의식이 키보토스의 멸망과 관계가 있는 것은 분명하지만, 정확히 그녀가 무엇을 하려는 것인지는 알 수 없습니다……."
34120-170 = "아마 무언가 알 수 없는 것을 이곳 키보토스로 불러오려는 것이 아닐지……."
34120-173 = "저는 그때 자각몽 속에서 베아트리체에게 제압당해, 그 의식의 너머에 있는 존재와 마주쳤고……"
34120-174 = "그 존재에 노출된 것 때문인지 제 몸이 무너져 내리기 시작했습니다……."
34120-176 = "……저는 미카에게 상처를 줬습니다."
34120-177 = "키보토스의 멸망…… 공포에 사로잡힌 저는 마침 저를 찾아온 미카를 쏘아붙였고, 그 직후 무너져 가는 제 육체를 보며 미카는……."
34120-181 = "저는…… 늘 이런 식으로……. 그 아이를 상처입혀 왔던 거겠죠……."
34120-183 = "미카는 또 자신을 책망하며 무언가 돌이킬 수 없는 짓을 저지르려고 하겠죠……."
34120-187 = "베아트리체가 저지르려는 이 의식은 키보토스를 멸망으로 이끌지도 모릅니다."
34120-188 = "그리고 그 과정에서 아리우스 스쿼드의 아츠코는 목숨을 잃겠죠……."
34120-189 = "저는 이 꿈도 현실도 아닌 공간에 갇혀서 무력하게, 전해질지조차 알 수 없는 이야기들을 선생님에게 전하려 할 뿐이고……."
34120-190 = "그리고 선생님은…… 베아트리체에게 노려지고 있습니다."
34120-191 = "……."
34120-192 = "선생님. 이 문제들을 전부 다 해결할 수는 없습니다."
34120-193 = "선생님은 저번에 이미 충분히 우리들을 위해 노력해주었습니다. 모든 문제들을 선생님에게 떠넘겨선 안 되는 법이죠."
34120-194 = "저는 어떻게든 여기서 벗어나, 나기사와 다른 분들의 힘을 빌려서, 미카를 되찾겠습니다."
34120-195 = "이번에야말로, 그녀에게 사과하지 않으면 안 되니까요."
34120-196 = "그러니, 선생님……."
34120-197 = "선생님…… 제 목소리가 들리신다면…… 부디……."
34120-202 = "도망치세요. 선생님. 최대한 아리우스 자치구에서 멀어지셔야 합니다."
34120-209 = "그렇지 않으면……. 선생님……은……."
34120-211 = "…………………………………………"
34120-213 = "다음화;옛이야기"
