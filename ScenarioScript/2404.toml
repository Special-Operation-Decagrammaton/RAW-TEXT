[translation]
2404-1 = "밤은 짧아 달리자 소녀여. 2"
2404-11 = "살금살금. 살금살금."
2404-13 = "엉금엉금. 엉금엉금."
2404-15 = "이얍! 타타탓!"
2404-16 = "[s1] \"저기, 카에데……?\"\n[s2] \"……뭐 하고 계신 건가요?\""
2404-17 = "쉿! 선생님! 조용히 해야지!"
2404-18 = "쉿! 선생님! 조용히 해야지!"
2404-19 = "나는 지금……. 한 명의 은밀한…… 미행자……."
2404-20 = "미쿠리와 함께 스파이 놀이를 하면서 단련된, 내 실력을 보여줘야할 때……!"
2404-21 = "앗! 선생님! 거길 밟으면 안 돼!"
2404-22 = "[s] \"으, 응?\""
2404-23 = "거기, 선 바깥으로 벗어나면 아웃이야!"
2404-24 = "그 아래는 바다! 상어 떼가 득시글거린다구?"
2404-25 = "아! 그렇다고 계속 선을 밟고만 있다고 안전한 건 아니야!"
2404-26 = "10초 이상 계속 밟고 있으면, 발이 뜨거워져서 떨어진다는 규칙이니까!"
2404-27 = "[s3] \"무슨 의미인지는 잘 알겠지만……!\"\n[s4] \"백귀야행의 동네 룰, 너무 가혹한 거 아냐?!\""
2404-28 = "이 정도는 평범하다구~?"
2404-29 = "이 정도는 평범하다구~?"
2404-30 = "선생님은 생각보다 아, 아마……. 아마튜나구나!"
2404-31 = "[s5] \"참치였던 기억은 없지만…….\"\n[s6] \"아마추어겠지…….\""
2404-32 = "앗! 이럴 때가 아니야! 이대로는 선배들을 놓치겠어! 얼른 따라가자. 선생님!"
2404-33 = "앗! 이럴 때가 아니야! 이대로는 선배들을 놓치겠어! 얼른 따라가자. 선생님!"
2404-34 = "폴짝!"
2404-37 = "[ns] \"조용하고 은밀한 미행은 대체 어디로…….\""
2404-47 = "방금…… 선배들 엄청 중요한 대화를 나눈 게 분명해!"
2404-48 = "[s7] \"어? 그, 그랬나?\"\n[s8] \"내가 보기엔 그냥 잡담만 나눴던 거 같은데.\""
2404-49 = "아냐! 선생님! 봐봐! 선배들이 여기, 이렇게 난간 앞에 서서."
2404-50 = "아냐! 선생님! 봐봐! 선배들이 여기, 이렇게 난간 앞에 서서."
2404-51 = "저어~기, 먼 곳을 바라보면서 이렇게 서로 심각한 대화를 나누……."
2404-52 = "핫?! 나, 나, 나나! 선생님! 나 알 거 같아!"
2404-53 = "[s] \"뭘 알 거 같다는 거야?\""
2404-54 = "츠바키 선배랑 미모리 선배……. 전망대에서 거리를 바라보며 심각한 대화를 나눴다는 건……!"
2404-55 = "역시 수행부로서, 우리가 지켜야할 이 거리를 보며 앞으로의 결심을 다진 게 분명해!"
2404-56 = "[s] \"……네?\""
2404-57 = "'이 거리에 만연한 악당을 우리가 쓰러트야만 해…….'"
2404-58 = "'네, 힘든 일이지만. 저희의 손으로 거리를 지켜내도록 해요……!'"
2404-59 = "……같은 대화를 나눴다거나?!"
2404-60 = "일요일 아침마다 해주는 히어로 드라마에서 자주 봤어!"
2404-61 = "[s] \"으음……?\""
2404-62 = "하지만! 그렇다면 왜 나는 빼고 둘이서만?!"
2404-63 = "에이잇! 다음! 다음이야! 좀 더! 미행하면서! 선배들이 뭘 하는지 알아내는 거야!"
2404-64 = "[s] \"카에데, 아무리 봐도 그건 그냥 오해…….\""
2404-65 = "간다앗! 타타탓!"
2404-71 = "선배들! 여기도 지나갔었지! 여기선 뭘 한 거지?!"
2404-75 = "[ns9] \"이건, 길냥이들이네?\"\n[ns10] \"혹시 그 두 사람은 이 아이들을…….\""
2404-76 = "마스코트구나!"
2404-77 = "마스코트구나!"
2404-78 = "[s] \"……응?\""
2404-79 = "수행부의 멋진 이미지를 위해, 여기서 비밀리에 기르고 있는……. 수행부의 비밀 마스코트인 게 분명해!"
2404-80 = "지금도 봐! 여기서 이렇게!"
2404-83 = "가까이 다가와서, 이, 이런, 심장에 안 좋은…… 공격을 하다니!"
2404-84 = "하지만 수행부의 마스코트는 난데?! 나로는 안 되는 거야?! 부족한 거야?!"
2404-85 = "우와아앙!! 츠바키 선배! 미모리 선배애~~!"
2404-88 = "[ns] \"기, 기다려. 카에데!\""
2404-90 = "(그 뒤로도 카에데와 함께, 츠바키와 미모리를 미행하며, 백귀야행의 이곳저곳을 돌아다녔다.)"
2404-91 = "(그럴 때마다…….)"
2404-92 = "방금 선배들, 여기를 지나쳤지! 그럼 여기에 비밀이 있지 않을까! 조사를 해봐야지!"
2404-93 = "킁킁. 킁킁……!"
2404-94 = "?!"
2404-97 = "이번엔, 그러니까! 내 명석한 추리에 따르면, 틀림없어!"
2404-98 = "선생님! 이 근처에 비밀이 있는 게 분명해!"
2404-99 = "……!"
2404-100 = "……!!!"
2404-103 = "(그렇게 소란을 피우는 카에데와 얼마나 좌충우돌을 하고 있었을까.)"
2404-104 = "(마침내…….)"
2404-106 = "[ns] \"두 사람, 이쪽으로 왔었지.\""
2404-107 = "우으……. 후뉴웅……. 츠바키 선배애……. 미모리 선배애……."
2404-108 = "나만 두고……. 어디 간 거야……."
2404-109 = "히잉……."
2404-110 = "[s] \"카에데, 그만 돌아가자.\""
2404-111 = "안돼……. 선생님……."
2404-112 = "나, 여기서 아무것도 알아내지 못하면……. 결국……."
2404-113 = "나는……. 수행부에서……. 나만……."
2404-117 = "……응?"
2404-118 = "아앙? 갑자기 부딪쳐 오다니, 시비 거는 거냐?!"
2404-119 = "……거는 거냐!!"
2404-121 = "어? 난 그런 게 아니라……."
2404-122 = "[s] \"너희들, 잠깐…….\""
2404-124 = "헹! 부외자는 손 떼시지!"
2404-125 = "떼시지!"
2404-126 = "그렇지 않아도 방금 전에 어떤 녀석이 희귀한 츠치노코의 허물을 판다길래. 잔뜩 샀더니만 매미 허물이란 걸 알고 기분이 나빠진 참이란 말이다!"
2404-127 = "말이다!"
2404-128 = "[s] \"아니, 그건 어딜 봐도 자업자득이잖아.\""
2404-129 = "그 화풀이를 해주마!"
2404-130 = "해주마!"
2404-132 = "우, 우와아앙~?!"
2404-133 = "거기, 잠깐 기다려."
2404-134 = "모두 멈춰주세요!"
2404-136 = "앙? 누구냐!"
2404-137 = "누구냐!"
2404-141 = "츠바키 선배……? 미모리 선배……?"
2404-142 = "우리 후배를 멋대로 괴롭히면 곤란해."
2404-143 = "그 이상 폭력을 행사하겠다면, 가만히 있지 않겠어요."
2404-144 = "누가 그 말에 겁먹을 줄 알고! 덤벼라!"
2404-145 = "덤벼라!"
2404-153 = "제, 제기랄! 두, 두고 보자!"
2404-156 = "가, 같이 가요! 언니!"
2404-160 = "우, 우……. 우……!"
2404-161 = "[s] \"……우?\""
2404-162 = "우와아아앙!!! 츠바키 선배! 미모리 선배!!"
2404-168 = "괜찮아. 카에데. 문제아들은 쫓아버렸으니까."
2404-169 = "카에데 쨩과 선생님까지, 여긴 어쩐 일이세요?"
2404-170 = "[s] \"그러니까 그게…….\""
2404-171 = "나만 두고! 둘이서만 외출하고! 그래서 쫓아왔어!"
2404-172 = "응?"
2404-173 = "……네?"
2404-175 = "(두 사람에게 이제까지 있었던 일을 설명했다.)"
2404-177 = "아, 그거라면……."
2404-178 = "어라, 하지만……."
2404-179 = "내 추리가 맞았던 거지?! 전망대에서, 두 사람이 수행부로서 결의를 다진 거지?! 나만 빼놓고!"
2404-180 = "아니, 그건 시설을 점검하기 위해 들렀던 거였어."
2404-181 = "밤중에 백귀야행 거리의 이곳저곳을 돌아보면서, 혹시 어디 망가진 곳은 없는지. 위험하게 방치되고 있는 시설은 없는지 점검하러 다닌답니다."
2404-182 = "[s] \"시설 점검…….\""
2404-183 = "그, 그러면! 고양이들은?!"
2404-184 = "그 길냥이들은, 수행부의 새로운 마스코트?! 고양이들이 나보다 귀여우니까?!"
2404-185 = "그 아이들은 평소에 돌봐주던 아이들이야."
2404-186 = "네, 밤마다 밥을 챙겨주면서, 혹시 어디 아픈 곳은 없는지 확인하고는 해요."
2404-187 = "그, 그런 일이라면…… 왜 나만 빼놓고 둘이서만 외출한 거야?"
2404-188 = "나, 나는…… 내가 아직 못 미더운 후배라서 그런 거야?! 으아아앙!!"
2404-189 = "음, 그건……."
2404-190 = "카에데 쨩. 그거라면 확실히 답해줄 수 있어요."
2404-191 = "……훌쩍. 응?"
2404-192 = "저번에 밤 순찰을 위해 같이 나가자고 했었지만."
2404-193 = "졸리다고 저희끼리 다녀오라고 먼저 말했던 건 카에데 쨩이었잖아요?"
2404-194 = "……."
2404-196 = "후잉?"
2404-197 = "[s] \"……그럴 줄 알았지만.\""
2404-198 = "아무리 부활동이라고 해도, 어디까지나 자율활동. 강요할 순 없으니까."
2404-199 = "밤마다 활동하는 건 힘든 게 사실이니까요."
2404-200 = "나는 오히려 지금이 적기? 전성기? 말똥말똥하지만!"
2404-201 = "츠바키 쨩은 밤에 강하니까요. 후훗."
2404-202 = "[s] \"어쩐지, 평소보다 생기 넘치는 이유가…….\""
2404-203 = "어, 음. 그, 그러니까. 지금까지 그럼, 나만 내버려두고 선배들끼리만 외출했던 게, 다……."
2404-204 = "응. 카에데의 요구."
2404-205 = "하지만, 설마 그런 생각을 하고 있었을 줄이야. 미안해요. 카에데 쨩."
2404-206 = "혼자 내버려둬서 외로움을 느끼게 만들다니……."
2404-207 = "응. 나도 반성했어. 카에데만 괜찮다면, 앞으로는 내버려두지 않고. 계속 밤마다 깨워서 데리고 나올게?"
2404-208 = "어……. 앞으로도 계속……?"
2404-209 = "하, 하지만, 역시. 밤에는 잠을 자는 편이, 좋을……지도?"
2404-210 = "……풋."
2404-211 = "후후후."
2404-212 = "[s] \"그럼 오해는 다 해결된 거지?\""
2404-213 = "으, 응! 선생님 말이 맞아! 전부 오해였구나! 나, 쓸데없는 생각을 했던 거네! 선배들은 일부러 날 생각해줬던 건데!"
2404-214 = "에헤, 에헤헷!"
2404-215 = "하지만 말이죠. 카에데 쨩?"
2404-216 = "응? 왜? 미모리 선배……?"
2404-217 = "카에데 쨩이 잠들지 않고, 선생님과 외출을 했다는 건……."
2404-218 = "혹시, 카에데 쨩. 마시지 말라고 했던 커피, 마셨나요?"
2404-219 = "아……."
2404-220 = "휘, 휘유우?"
2404-221 = "카에데 쨩. 그렇지 않아도 밤잠도 자주 설치면서, 커피를 마시면 어떡해요!"
2404-222 = "으, 으냐악?!"
2404-224 = "이건 선생님도 마찬가지랍니다!"
2404-225 = "[s] \"어, 억울해!\""
2404-227 = "자아, 지금부터 설교할 거니까요!"
2404-228 = "어쩔 수 없네~"
2404-229 = "으, 으아아앙~! 선생님 도와줘~"
2404-231 = "(그렇게 모든 오해는 풀렸고, 수행부의 사이는 더욱 돈독해지게 되었다.)"
2404-232 = "(경사났네. 경사났어.)"
2404-233 = "전혀 경사가 아니야~!"
2404-234 = "밤은 짧아 달리자 소녀여."
