[translation]
2003206-1 = "냉수욕"
2003206-2 = "(특수 작전을 위해 빙해에서 임무를 수행하는 중이었지만,)"
2003206-3 = "(에이미가 말하는 장소가 궁금해졌으니 가보기로 했다.)"
2003206-6 = "(에이미가 있다는 곳에 도착해 보니…….)"
2003206-7 = "아 선생님. 이쪽이야."
2003206-8 = "(에이미는 얼음에 구멍을 뚫고 몸을 담그고 있었다.)"
2003206-11 = "[ns] \"안 추워?\""
2003206-12 = "[wa:300]― [log=에이미 수영복]응?[/log]"
2003206-14 = "[wa:50]― [log=에이미 수영복]춥지 않아. [wa:1500]괜찮아.[/log]"
2003206-17 = "[wa:1200]― [log=에이미 수영복]반대로,[/log]"
2003206-19 = "― [log=에이미 수영복]지금이 시원해서 [wa:1000]딱 좋아.[wa:120] [/log]"
2003206-22 = "[wa:1400]― [log=에이미 수영복]기분 좋아…[/log]"
2003206-24 = "― [log=에이미 수영복]선생님도 들어올래?[/log]"
2003206-27 = "[ns] \"사양할게…….\""
2003206-28 = "[wa:500]― [log=에이미 수영복]흐~음. [wa:1500]그럼 됐지만.[/log]"
2003206-31 = "[wa:900]― [log=에이미 수영복]조금 있다 [wa:800]나갈 테니까,[/log]"
2003206-33 = "― [log=에이미 수영복]조금만 기다려 줘. [wa:1700]선생님.[/log]"
2003206-36 = "하아…… 최고였어."
2003206-37 = "하지만 아직 부족한데……. 돌아가면 집에서도 냉수욕을 즐길 수 있는 욕조를 만들어 볼까?"
2003206-38 = "그렇게 하면 매일 파라다이스를……."
2003206-39 = "[s] \"아무리 에이미라도 매일 냉수욕을 하면 감기에 걸리지 않을까…….\""
2003206-40 = "괜찮대도 선생님. 나는 추워서 감기에 걸린 적은 없거든."
2003206-41 = "봐, 이 정도의 온도에도 아무렇지 않……."
2003206-42 = "에……"
2003206-43 = "에취!"
2003206-44 = "어라?"
2003206-48 = "[ns] \"에이미가 감기에 걸렸다!!\""
2003206-49 = "아니…… 그냥 재채기인데."
2003206-50 = "[s] \"아니! 이건 감기야! 에이미가 감기에 걸렸어!\""
2003206-51 = "그러니까 이건 그냥 재채기를 했을 뿐……!"
2003206-52 = "[s] \"역시 에이미에게도 이 추위는 무리였……!!\""
2003206-53 = "아니, 이건 기분 좋은 정도! 감기에 걸린 게 아니라구."
2003206-55 = "(서로 한 치도 물러서지 않는 설전을 벌이면서 에이미와 함께 베이스캠프로 복귀하였다.)"
2003206-59 = "(평소에 뜨거운 것을 싫어하던 에이미도 이날은 뜨거운 차를 전부 비웠다.)"
