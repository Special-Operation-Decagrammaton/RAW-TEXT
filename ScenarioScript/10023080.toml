[translation]
10023080-1 = "제8화;어디까지나 임시입니다. 명심하세요."
10023080-5 = "괜찮으십니까, 선생님?"
10023080-6 = "[s] \"나는 끄떡없어. 토키는?\""
10023080-7 = "저도…… 큰 문제는 없습니다."
10023080-8 = "[s] \"내가 보기엔, 어딘가 혼란스러워 보이는데?\""
10023080-12 = "……선생님에게는, 구태여 숨기려고 해 보았자 무의미하겠지요."
10023080-13 = "솔직히 말씀드리면, 무엇을 해야 할지 모르겠습니다."
10023080-14 = "으아앗! 어떻게 해야 할지 모르겠는 건 우리도 마찬가지거든?"
10023080-15 = "왔군요. 소란스러운 모모이."
10023080-16 = "소란스러운 모모이는 뭐야?!"
10023080-17 = "덧붙여서, 사실상의 대표자 미도리, 조용한 유즈, 귀여운 아리스도 있습니다."
10023080-18 = "왜 나만 부정적인 형용사인데?!"
10023080-19 = "이거 괴롭힘이지? 선생님도 뭐라고 해 봐!"
10023080-23 = "[ns] \"……학생끼리 괴롭히는 건 옳지 못한 일이랍니다……\""
10023080-25 = "그렇지만 언니의 말도 사실이에요, 선생님……"
10023080-26 = "저희는…… 어떻게, 해야 할까요……?"
10023080-28 = "그건 정해져 있는 겁니다! 나쁜 적들을 물리치고, 함께 용사의 길을 걷는 겁니다!"
10023080-29 = "그렇지만 아리스 쨩, 이 경우에는 누가 나쁜 적일까……?"
10023080-30 = "네? 그야……"
10023080-31 = "……그야."
10023080-32 = "끄앙, 갑자기 머리가 어지러워졌습니다. 도움이 필요합니다, 유즈. 도움!"
10023080-38 = "……"
10023080-39 = "제가 제안드리죠. 게임개발부와 선생님은 이 일에서 손을 떼어 주십시오."
10023080-46 = "[ns] \"뭐? 토키, 어째서?\""
10023080-47 = "토키는…… 어떻게 할 생각입니까?"
10023080-48 = "선생님께서 동맹의 이야기를 꺼내 주셨을 때에는, 다소 놀랐습니다만."
10023080-49 = "……이번 일은 제가 책임지고, 마지막까지 해결하겠습니다."
10023080-50 = "[s] \"토키, 혼자서 말이야?\""
10023080-51 = "네, 이 일은 제가 맡은 임무와도 연관이 있습니다. 이 사태를 내버려 두면 C&C의 이름에 누를 끼치게 될 테지요."
10023080-53 = "토키 씨는, 어떻게 해결할…… 생각인가요……?"
10023080-55 = "그건 상황을 보면서 생각하겠습니다. 자애의 괴도를 도와 비밀 경매를 무위로 돌릴 수도 있을 것이고."
10023080-56 = "자애의 괴도가 노리는 <시계왕의 왕관>을 회수해, 발키리에게 넘길 수도 있겠지요."
10023080-57 = "다만 여러분께서는 이 일을 맡으실 이유가 없습니다. 선생님 역시 마찬가지이고요."
10023080-58 = "그러니, 여러분은 선생님과 함께 돌아가십시오."
10023080-59 = "제가 하고 싶은 말은 그것뿐입니다."
10023080-65 = "아뇨. 아리스들은 여기서 물러나지 않습니다."
10023080-66 = "네? 하지만……"
10023080-67 = "토키는 우리들의 동료니까요."
10023080-68 = "게임개발부는 동료를 내버려 두지 않습니다!"
10023080-70 = "마, 맞아…… 상황이 이렇게 되어 버리긴 했지만……"
10023080-71 = "언니의 독단으로 시작된 해프닝이긴 했어도……"
10023080-72 = "동생이여…… 여기서 꼭 그 말을 꺼내야 했느냐……"
10023080-73 = "아무튼!"
10023080-74 = "토키 혼자 이런 일을 하도록 내버려 둘 순 없어!"
10023080-75 = "지금만큼은…… 우리도 C&C니까! 그 이름을 빌리고 있으니까!"
10023080-77 = "그런 간단한 이유로…… 말입니까?"
10023080-78 = "아리스는 간단한 이유일수록 중요하다고 배웠습니다."
10023080-79 = "아니면…… 토키는 아리스의 동료가 아닌 것인가요?"
10023080-80 = "그, 그런 게 아니라…… 이런 일은, 익숙하지 않다고 할까, 처음…… 이라고, 할까……"
10023080-81 = "그러면 된 겁니다! 누가 뭐라고 해도, 아리스는 토키를 돕고 싶습니다!"
10023080-83 = "뭐…… 아리스가 그렇게 말한다면야."
10023080-84 = "아리스 쨩이니까…… 그렇지……?"
10023080-86 = "후후, 그럼 대충 결정이 된 듯하네요?"
10023080-88 = "!!!"
10023080-95 = "메이타로는 호락호락하지 않아요. 혼란을 수습하고 다시 비밀 경매를 열었더군요."
10023080-96 = "동시에 저희를 쫓는 경비대를 푼 모양이에요."
10023080-97 = "제 예상이 맞는다면, <시계왕의 왕관>이 경매에 등장하는 것은 자정쯤이 될 거예요."
10023080-98 = "당신들과 저, 우리가 공멸하지 않은 걸 확인한 순간. 속도전으로 들어간 셈이죠."
10023080-99 = "[s] \"꽤 시원스럽게 이야기해 주네.\""
10023080-100 = "어머나, 동맹을 맺자고 한 건 선생님이시잖아요?"
10023080-101 = "[s] \"그렇다면 두 가지 묻고 싶은 것이 있는데, 괜찮을까?\""
10023080-102 = "네. 그러세요."
10023080-103 = "하지만 대답하고 싶지 않은 것에는 대답하지 않겠어요."
10023080-107 = "[ns] \"우선은, 예고장의 마지막 문구에 대해서.\""
10023080-108 = "'한 번도 수여된 적 없는, 호사스럽지만 불우한 검을 위해'"
10023080-109 = "우리는 그게 그림에 나온 검이라고 생각했어."
10023080-110 = "간단한 거예요. 검은 권위의 상징이죠. 왕관 역시 마찬가지고요."
10023080-111 = "이번 예고장의 테마는 '시계'였으니, 그것이 힌트가 될 수 있었겠죠."
10023080-112 = "하지만 우리는 <시계왕의 왕관>이란 게 있는 줄도 몰랐는데……."
10023080-113 = "네. 당신들은 제대로 풀 수 없는 예고장이었겠죠."
10023080-114 = "메이타로가 여러분에게 모든 것을 투명하게 이야기했다면 이야기가 달라졌겠지만요."
10023080-115 = "[s] \"처음부터 우리를 이용할 생각으로…….\""
10023080-116 = "후후, 그렇죠."
10023080-117 = "메이타로는 슬슬 깨달아야 해요. 세상일이 자기 뜻대로만 되지 않는다는 걸, 그리고 세상이 자기 원하는 대로만 돌아가지 않는다는 걸요."
10023080-118 = "대답이 되셨나요?"
10023080-119 = "[s] \"두 번째로, 왜 너는…… 이런 일을 하는 거지?\""
10023080-120 = "역시 그 질문이시군요."
10023080-121 = "간단해요. 모두를 위해서죠."
10023080-123 = "모두를 위해…… 무언가를 훔친다, 는 말씀이신가요?"
10023080-125 = "네, 저는, 가치가 담긴 물건일수록 공공의 재산이 되어야 한다고 생각해요."
10023080-126 = "예술품은 숨겨져 있어야 할 물건이 아닌, 모두가 함께 누려야 할 권리죠."
10023080-131 = "상상을 해 볼까요? 이대로 메이타로를 내버려 두면, <시계왕의 왕관>은 블랙마켓 같은 곳으로 흘러 들어가겠죠. 그럼 어떻게 될까요?"
10023080-132 = "뒷세계에 다시 나타난 가치 높은 예술품. 그것만으로도 엄청난 소동이 일어나지 않을까요?"
10023080-133 = "그 결과…… 커다란 혼란이 일어날 수도 있겠죠. 그러니, 그전에 빼앗는 거예요."
10023080-134 = "[s] \"그러면 그걸 빼앗아서, 발키리에게 보내거나 하는 거야?\""
10023080-135 = "어머. 발키리를 어떻게 믿죠? 자기들이 맡고 있던 '죄수'들도 놓치고 마는 아이들을?"
10023080-136 = "당연히, 제가 보관하는 거예요. 세상이 진정한 미학에 눈을 뜰 때, 예술품들의 가치를 알아볼 수 있을 때까지."
10023080-137 = "[s] \"결국 가져가는 거구나……\""
10023080-143 = "자, 그래서 어떠신가요?"
10023080-144 = "이런 이야기를 듣고서…… 괴도와 동맹을 맺고자 하는 마음, 혹시 바뀌셨나요?"
10023080-148 = "선생님의 동맹 제안, 받아들이도록 하겠습니다."
10023080-149 = "어머나?"
10023080-150 = "실제로 장물을 회수하는 임무를 맡은 이상, 저는 작전을 실행할 겁니다. 그 과정에서, 임시나마, 같은 목적이 있다면 협력하지 못할 것도 없죠."
10023080-151 = "그리고……"
10023080-153 = "우리도 토키를 도울 거야!"
10023080-154 = "네. 그래요."
10023080-156 = "우, 우리는……."
10023080-158 = "동료니까요!"
10023080-163 = "여러분……"
10023080-164 = "……후훗. 그것이 당신들의 미학, 이란 건가요."
10023080-165 = "좋습니다."
10023080-166 = "그러면…… 이제부터 구체적인 작전을, 한 번 수립해 볼까요?"
