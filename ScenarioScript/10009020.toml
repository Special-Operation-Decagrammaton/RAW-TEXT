[translation]
10009020-1 = "제2화;두 번째 습격!"
10009020-2 = "교정국 동쪽 지부 제6교정시설"
10009020-7 = "설마 도중에 탈주까지 하려고 들 줄이야."
10009020-8 = "하지만 교정국에 도착한 이상. 더 이상의 반항은 소용없다고. 재액의 여우."
10009020-9 = "자, 얌전히 안으로 들어가!"
10009020-17 = "……흐음."
10009020-18 = "여전히 더럽기 짝이 없는 곳이로군요. 이곳은."
10009020-20 = "불평은 됐고, 조만간 경비국장님이 직접 찾아와서 심문을 할 테니까."
10009020-21 = "그때 무얼 노리고 축제에서 난동을 부리고 있던 건지, 제대로 된 변명을 생각해 내는 게 좋을 거야."
10009020-22 = "그렇지 않으면 기존 교정 기간에 더해, 탈주로 추가된 죄목, 이번 난동까지 포함해서 남은 기간이 왕창 늘어날 테니 말이야."
10009020-23 = "경비국장의 심문-인가요. 좋습니다."
10009020-24 = "오, 생각보다 꽤 협조적……."
10009020-25 = "묵비권을 행사하겠어요."
10009020-26 = "뭐?! 묵비권?"
10009020-27 = "지금 네 녀석이 어떤 상황인지 알고나 있는 거야?!"
10009020-28 = "후훗, 알다마다요. 그러므로 묵비권을 행사하겠습니다."
10009020-29 = "선생님이 아니라면 그 어떤 질문에도 답하지 않겠어요."
10009020-31 = "선생이라면…… 샬레의 그……."
10009020-32 = "현장에서 도와줬던 선생님 말이지?"
10009020-33 = "애당초 바로 그 선생을 현장에서 습격하려고 했잖아! 그걸 알고 있는데도 불러줄까 보냐!"
10009020-38 = "후후후……."
10009020-39 = "그런가요. 아아, 그렇군요."
10009020-41 = "응?"
10009020-43 = "당신들마저도 제 '목적'을 방해하겠다는 거군요. 좋습니다."
10009020-44 = "그렇다면 제게도 다 생각이 있지요. 후후훗♡"
10009020-51 = "……?"
10009020-53 = "(얌전히 세나와 함께 거리를 순찰을 돌고 있을 때였다.)"
10009020-59 = "서, 선생님! 와카모가 교정국을 탈출해버렸어……!"
10009020-60 = "[s] \"……아니, 또?\""
10009020-66 = "후후훗……."
10009020-67 = "제게서 벗어날 수 없답니다!"
