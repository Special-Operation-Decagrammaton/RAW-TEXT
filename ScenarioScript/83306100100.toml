[translation]
83306100100-6 = "하나…… 둘…… 셋……"
83306100100-12 = "………숫자 세기?"
83306100100-13 = "아, 누군가 했더니 선도부장이네."
83306100100-14 = "지금 뭘 하고 있는 거냐고? 별거 아냐."
83306100100-15 = "이부키랑 키라라랑 같이 숨바꼭질을 하고 있어. 참고로 내가 술래야."
83306100100-16 = "이부키가 우리랑 놀고 싶다고 말하니까. 거기에 키라라가 손을 번쩍 들고 바로 놀자고 하더라니깐."
83306100100-17 = "키라라, 그 녀석 어린애랑 놀아주는 일 같은 걸 엄청 좋아하니까. 뭐, 당연한 일인지도 모르겠지만."
83306100100-18 = "흐음, 그래도 슬슬 다른 애들과 약속한 시간이 얼마 안 남았으니까. 얼른 끝낼 필요가 있지 않을까 하는데."
83306100100-19 = "그런 거라면 도와줄까?"
83306100100-20 = "선도부장이?"
83306100100-24 = "아…… 그러고 보면, 선도부장은 문제아들이라면 그 누구도 놓치지 않고 찾아내는 엄청난 매의 눈을 가졌다는 소문이 있었지."
83306100100-25 = "과연…… 숨바꼭질 전문가라는 건가."
83306100100-26 = "소문의 출처가 어딘지는 몰라도, 아마 과장된 이야기라고 생각해."
83306100100-27 = "하하, 뭐, SNS에서 돌던 썰을 본 거 뿐이니까 말이야."
83306100100-28 = "그래도 도와주겠다면, 응. 조금 부탁할게."
