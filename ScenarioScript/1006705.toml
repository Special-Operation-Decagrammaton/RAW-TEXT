[translation]
1006705-1 = "휴식의 장소"
1006705-2 = "샬레 휴게실"
1006705-5 = "(토키에게 받은 연락이 심상치 않아, 좀처럼 잠을 이룰 수 없었다.)"
1006705-6 = "(몇 번인가 잠에 들려 했지만, 그때마다……)"
1006705-8 = "콜사인 제로포. 응답합니다. 현재 위치는……"
1006705-10 = "[ns] \"토키?!\""
1006705-11 = "(연락은 이내 끊어졌다가, 잊어버릴 만하면……)"
1006705-16 = "여기는 콜사인 제로포. 응답 바랍니다. 그곳은……"
1006705-17 = "(계속해서, 간헐적으로……)"
1006705-22 = "……알겠습니다. 지시를……"
1006705-23 = "(그러다가 한 번은……)"
1006705-28 = "연결되었습니다."
1006705-29 = "어라, 선생님? 선생님이 어째서?"
1006705-30 = "[s] \"토키! 무사해?\""
1006705-32 = "그야, 저는……"
1006705-37 = "[ns] \"또 끊겼네……\""
1006705-40 = "임무 완료. 모두 수고하셨……"
1006705-42 = "(몇 번 정도 토키의 연락처로 전화를 걸어 보았지만, 지금은 응답할 수 없다는 답신뿐이었다.)"
1006705-43 = "(결국 어떻게 잠들었는지도 기억하지 못하고, 밤을 새우다시피 한 끝에 눈을 감았다.)"
1006705-48 = "(아침 새 소리에 잠이 깼다.)"
1006705-49 = "(잠결에, 무심코 손을 내밀었다.)"
1006705-58 = "(그곳에는 왠지 부드러운 사람의 온기 같은 것이……)"
1006705-61 = "[wa:1000]― 음…… [wa:1200]선생님……?"
1006705-64 = "[wa:900]― 왜 그러시죠……?"
1006705-66 = "[wa:1000]― 그런, [wa:1000]이상한 [wa:300]얼굴을 하시고……?"
1006705-69 = "[ns] \"토, 토키 씨이이이이이이?!\""
1006705-70 = "[wa:2000]― 실례가 되지 않는다면,"
1006705-72 = "[wa:500]― 더 [wa:500]자도 되겠습니까……?"
1006705-75 = "[wa:3600]― 네? [wa:1900]일단 [wa:800]일어나라구요?"
1006705-77 = "[wa:1900]― ……싫습니다. [wa:1200]저는 [wa:500]더 자고 싶습니다."
1006705-80 = "[wa:2000]― 게다가 [wa:500]이 침대……"
1006705-82 = "[wa:600]― 따뜻하고, [wa:1500]푹신푹신하고, [wa:1800]마음에 든단 말이에요."
1006705-85 = "[wa:2000]― 선생님께서 [wa:500]뭐라고 하시든, [wa:1800]저는 잘 겁니다……"
1006705-87 = "[wa:2000]― 우웅…… [wa:1400]졸려요……"
1006705-91 = "(토키는 그 뒤로도 계속해서 잠을 잤다.)"
1006705-92 = "(토키가 눈을 뜬 것은 정오가 지난 다음이었다……)"
1006705-97 = "……"
1006705-98 = "[s] \"……그러면, 왜 여기에서 잠자고 있었는지 물어봐도 될까?\""
1006705-99 = "당연한 것을 물으시는군요. 그곳에 침대가 있었으니까, 입니다."
1006705-100 = "[s] \"여기에서 높은 산을 오르는 이유 같은 대답을 해도 말이지……\""
1006705-101 = "굳이 부연 설명을 드리자면, 시작은 밤늦게 임무를 마치고 돌아오는 길이었습니다."
1006705-102 = "샬레의 오피스에 불이 켜져 있길래, 왠지 모르게 신경이 쓰였습니다."
1006705-103 = "[s] \"어…… 일단 문은 닫혀 있었을 텐데……?\""
1006705-104 = "선생님. 저는 C&C입니다."
1006705-105 = "[s] \"……응.\""
1006705-106 = "어쨌든, 오피스에 들어온 제가 목격한 것은, 불도 끄지 않은 채 엉망으로 잠들어 있었던 선생님의 모습이었습니다."
1006705-125 = "저는 최고의 에이전트이자 완벽한 메이드이기도 한 몸. 그렇기에 선생님의 침대 자리를 정리해 드리는 것은 당연한 수순이었습니다."
1006705-126 = "그랬더니 왠지 모르게 잠이 쏟아지더군요. 늦은 시간이기도 했고, 임무가 제법 까다로웠던 탓도 있었을 겁니다."
1006705-127 = "중요한 것은, 그때 제가 졸음을 느낀 것은 지극히 자연스러운 일이었다는 것이겠지요."
1006705-128 = "그리고 제 눈앞에는 잘 정리된 침대가 있었습니다."
1006705-129 = "제가 달리 무슨 일을 할 수 있겠습니까?"
1006705-130 = "[s] \"그래서…… 여기에서 잠든 거야?\""
1006705-131 = "네."
1006705-132 = "덧붙여서, 수면감은 최고였습니다. 빠르게 칭찬해 드릴게요."
1006705-133 = "[s1] \"응…… 고마워…… \"\n[s2] \"그렇지만 함부로 남의 침대에서 잠들면 안 돼……\""
1006705-136 = "다시 말씀드리는 것입니다만, 졸리니까 잠든 것뿐입니다."
1006705-137 = "[s] \"그러면, 다른 사람의 침대에서도 졸리면 잘 거야?\""
1006705-138 = "……!"
1006705-142 = "잠시만요, 선생님. 생각할 시간을 주세요."
1006705-143 = "[s] \"어? 어…… 그래.\""
1006705-149 = "(토키는 한참이나 침묵을 유지했다.)"
1006705-150 = "(……그렇게 심각하게 고민할 일은 아니라고 이야기하려던 순간……)"
1006705-151 = "역시, 싫습니다. 그런데 모르겠습니다."
1006705-152 = "[s] \"무슨 말이야……?\""
1006705-153 = "다른 사람의 침대에서 잠드는 것은, 몇 번을 생각해 보았지만, 싫다는 느낌이 듭니다."
1006705-154 = "그런데…… 왜 그것이 싫게 느껴지는지 그 이유를 모르겠습니다."
1006705-155 = "선생님. 왜 선생님은 괜찮은데 다른 사람은 싫을까요?"
1006705-156 = "[s] \"그, 글쎄?\""
1006705-157 = "선생님도 정확히는 모르시겠다는 것이군요."
1006705-158 = "뭐, 됐습니다. 그러면 이 문제는 여기까지인 것으로."
1006705-159 = "[s] \"포기가 너무 빠르지 않아?!\""
1006705-160 = "그렇지만 생각해도 해결되지 않는 문제에 너무 시간을 쓰고 싶지는 않습니다. 비효율적이니까요."
1006705-161 = "그리고 지금 저에게는 그것보다 중요한 문제가 있다는 사실을 알아차리기도 했고요."
1006705-162 = "[s] \"그게…… 뭔데?\""
1006705-163 = "매우 중요하고 중대한 문제입니다."
1006705-164 = "그건 바로 제가 심심하다는 것입니다."
1006705-165 = "[ns] \"중요하고 중대하다며!\""
1006705-166 = "이해하지 못하시는군요. 이것이 얼마나 중요한 문제인지."
1006705-167 = "선생님. 사람은 심심하면 죽어버립니다. 정신적으로든, 육체적으로든."
1006705-168 = "즉, 선생님은 교육자로서, 눈앞에 죽어가는 학생을 살릴 의무가 있는 것입니다."
1006705-169 = "그러니까 놀아주세요. 다시 말씀드리지만 중대 사항입니다."
1006705-170 = "[s] \"……진심이야?\""
1006705-176 = "저는 언제나 진심입니다."
1006705-178 = "(너무나 당당한 토키의 모습에 할 말을 잠시 잃고 말았지만……)"
1006705-179 = "(그날은 토키와 함께, 남은 시간을 즐겁게 보냈다.)"
