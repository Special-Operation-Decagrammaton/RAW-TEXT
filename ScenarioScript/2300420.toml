[translation]
2300420-1 = "모든 것이 교체되더라도"
2300420-3 = "(우타하에게 불려 나와 쇼핑몰에 도착했다……)"
2300420-4 = "아, 어서 와. 선생님."
2300420-5 = "일부러 어울려 줘서 고마워. 선생님에게는 조금 재미없을지도 모르는데."
2300420-6 = "신경 쓰지 말라고?"
2300420-7 = "후후. 그 말 후회하지 마?"
2300420-8 = "오늘 방문할 공구 매장은, 밀레니엄에서도 소수만이 찾아가는 곳이야."
2300420-9 = "숨겨진 비밀 장소랄까, 보물 창고 같은 곳이지."
2300420-10 = "그럼, 가 볼까?"
2300420-22 = "마스터. 오랜만이야."
2300420-23 = "아, 마이스터 우타하. 자주 좀 보자고. 얼굴 잊어버리겠어."
2300420-24 = "그것도 마스터의 공구가 너무 우수해서 그런 게 아닐까?"
2300420-25 = "공구가 좀 마모되거나 고장 나야 여길 자주 찾을 거 아냐."
2300420-26 = "이거, 내구성을 일부러 저하해야 하려나?"
2300420-27 = "하지만 그랬다간 단골들의 발길이 전부 끊기겠지."
2300420-28 = "핫핫핫. 본업에 너무 충실한 것도 탈이구만. 오늘은 뭐가 필요하지?"
2300420-29 = "우선 헥스헤드 렌치 세트 하나와 100cm 버니어 캘리퍼스. 다른 필요한 것도 있는데…… 천천히 둘러볼게."
2300420-30 = "그래. 부담 갖지 말고. 이쪽은 누구시지?"
2300420-31 = "샬레의 선생님이셔."
2300420-35 = "아, 선생님! 말씀은 많이 들었습니다. 혹시 앞으로 공구가 필요하시다면 우리 상점을 애용해 주시기 바랍니다!"
2300420-36 = "[s] \"네, 네에……\""
2300420-42 = "후우, 이걸로 마모된 공구는 대충 교체했고……"
2300420-43 = "[s] \"뭔가…… 대단한 공구 세트네.\""
2300420-44 = "아, 이거?"
2300420-49 = "후후. 대단한지는 잘 모르겠지만, 나만의 공구 세트지."
2300420-50 = "나는 '마이스터 공구 세트'라고 부르고 있어."
2300420-51 = "조금 지나치게 내 취향으로 커스텀 한 것 같기도 하지만……"
2300420-52 = "뭐, 내가 쓰는 공구니까. 그 정도는 괜찮겠지?"
2300420-53 = "아무튼 처음 마이스터가 된 이후, 쭉 이 세트를 사용해 왔으니까 말이지."
2300420-57 = "지금 생각해 보면…… 처음 그대로 남아 있는 공구는 하나도 없네."
2300420-58 = "모든 공구가 한 번씩은 마모되거나 수명이 다해서 교체됐으니까."
2300420-59 = "[s] \"어라, 그런데……\""
2300420-60 = "응? 내용물이 전부 한 번씩 교체되었다면, 그걸 처음의 공구 세트와 같은 물건이라고 부를 수 있는 거냐고?"
2300420-61 = "후후. 좋은 질문이야. 선생님."
2300420-67 = "어떤 배가 있어. 부품이 낡거나 망가질 때마다 그걸 교환했지."
2300420-68 = "그러다가 어느 날 배의 모든 부품을 교체하게 되었어. 그러면…… 그 배는 원래의 배와 같은 것이라고 부를 수 있을까?"
2300420-72 = "[ns] \"어려운 문제네……. \""
2300420-73 = "나는 이렇게 생각해."
2300420-74 = "배의 모든 부품이 교체되었어도, 그 배를 다루는 사람들이 남아 있다면, 그건 원래의 배와 동일한 물건이라고."
2300420-75 = "배를 다루는 사람이 없이는, 배는 그냥 좀 특이하게 생긴 나무나 금속 덩어리일 뿐이잖아?"
2300420-76 = "심오한 해석이라고? 그런가?"
2300420-77 = "하지만 마이스터와 공구의 관계도 그와 비슷한 게 아닐까?"
2300420-78 = "공구를 사용하는 사람 없이는, 공구는 의미를 갖지 못하니까."
2300420-79 = "[s1] \"이상하게 들릴지도 모르겠지만.\"\n[s2] \"우타하가 사용해 주는 공구는, 행복할 것 같아.\""
2300420-84 = "……그건 이상하다기보다는 조금 부끄럽게 들리는 말인데……"
2300420-85 = "그렇지만 내가 공구에게 부끄럽지 않은, 더 나은 마이스터가 될 수 있다면……"
2300420-86 = "후후. 그것도 나쁘지 않겠네."
2300420-88 = "(평소보다 어딘가 뿌듯해 보이는 우타하와 함께, 공구 쇼핑을 계속했다.)"
