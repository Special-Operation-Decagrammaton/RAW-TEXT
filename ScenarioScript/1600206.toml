[translation]
1600206-1 = "준비만전"
1600206-2 = "(잠시 후 밀레니엄의 학생 휴식실에 도착했다. 어째선지 교실은 텅 비어 있었다.)"
1600206-3 = "(코토리만이 그 안에 덩그러니 앉아서 잔뜩 기대하는 얼굴로 기다리고 있었다.)"
1600206-4 = "후후후……. 오셨군요, 선생님! 기다리고 있었답니다! 한 시간 전부터!!"
1600206-5 = "에? 휴식실에 왜 저 밖에 없냐고요? 글쎄요……. 그러게요."
1600206-6 = "어라, 이상하다. 분명히 아까 전까지만 해도 몇 분 더 있었는데……."
1600206-7 = "흐음……. 뭐, 다들 바쁜 것 같더라고요. 뭐 좀 물어보길래 대답해주니까 사라졌답니다."
1600206-8 = "[s1] \"…….\"\n[s2] \"그렇군. 상황은 확실히 이해했어.\""
1600206-9 = "……에? 왜 그러시죠, 선생님……? 뭔가 깨달으신 듯한 표정……."
1600206-10 = "……에? 왜 그러시죠, 선생님……? 뭔가 깨달으신 듯한 표정……."
1600206-11 = "음음! 아무튼 중요한 건 그게 아니죠! 오늘의 가장 중요한 게스트는 선생님이니까요!"
1600206-12 = "세상에, 세상에! 살다 보니 이런 날도 다 오고. 스스로도 꽤 놀라고 있다고요!"
1600206-13 = "무려 선생님께서! 모두의 해결사이자 상담사이자 샬레의 고문이자 어른이신……!"
1600206-14 = "바로 그 선생님께서! 다른 누구도 아닌 저에게 물어보실 게 있다니!!"
1600206-15 = "아아……. 솔직히 굉장히 감격스러워요. 꿈인지 현실인지 실감이 잘 가지 않을 정도예요! 이건 정말로……!"
1600206-19 = "……아."
1600206-20 = "하하. 으흠, 흠! 흠흠……. 죄송합니다. 너무 들떠서 그만……."
1600206-21 = "선생님께서는 필요하신 게 있으셔서 온 것이실 텐데, 그걸로 신나 하는 것도 예의가 아니겠네요. 으음……."
1600206-22 = "아, 아무튼! 아무튼 늘 도움만 받던 저인 만큼, 이번에는 꼭 선생님께 도움이 되고 싶어요."
1600206-23 = "그래서 평소보다 더 잡학 공부도 많이 해왔습니다! 지금이라면 우주의 근원에 대해서도 토론할 수 있을 정도로!"
1600206-24 = "자, 선생님! 뭐라도 좋아요! 저는 준비가 돼 있습니다!! 질문해 주시죠!"
1600206-25 = "무엇이 궁금하신가요!? 선생님께서 알고 싶으신 '미지'!"
1600206-26 = "선생님의 퀘스천 마크는!! 무엇인가요!!"
1600206-27 = "[s3] \"……코토리는 평소 취미가 뭐야?\"\n[s4] \"……코토리는 주로 뭘 좋아해?\""
1600206-28 = "음음……! 과연, 그렇군요! 이번 질문은 그것이로군요!"
1600206-29 = "음음……! 과연, 그렇군요! 이번 질문은 그것이로군요!"
1600206-30 = "그것은 즉 저의 이야기……"
1600206-31 = "저에 대해 물으신 거로군요?"
1600206-32 = "후후. 그거라면야……. 물론……."
1600206-36 = "……?"
1600206-37 = "에……?"
1600206-38 = "……어라?"
1600206-41 = "[wa:300]― [log=코토리]어, [wa:1100]어어……!?[/log]"
1600206-43 = "― [log=코토리]어, [wa:500]어째서 갑자기 [wa:2500]그, [wa:600]그런 걸……!?[/log]"
1600206-46 = "― [log=코토리]죄송해요.[/log]"
1600206-48 = "― [log=코토리]혹시 모르니 [wa:700]한 번만 다시 [wa:800]여쭤봐도……?[/log]"
1600206-51 = "[ns5] \"코토리에 관한 것이 알고 싶다고 했어.\"\n[ns6] \"정작 코토리 본인에 대한 건 잘 못 들었으니까.\""
1600206-52 = "[wa:200]― [log=코토리]어, [wa:400]음, [wa:1500]그……. [wa:600]그렇군요…….[/log]"
1600206-53 = "[wa:200]― [log=코토리]어, [wa:400]음, [wa:1500]그……. [wa:600]그렇군요…….[/log]"
1600206-55 = "[wa:700]― [log=코토리]그게, [wa:1100]뭐랄까…….[/log]"
1600206-58 = "[wa:500]― [log=코토리]그, [wa:400]그런데 [wa:1300]왜 갑자기 [wa:1000]그런 걸……?[/log]"
1600206-60 = "― [log=코토리]뭔가 그, [wa:1200]다른 이유라도…….[/log]"
1600206-63 = "[wa:500]― [log=코토리]아, [wa:200]그게, [wa:600]별다른 이유가 있어야 되는 건 아니고요![/log] [wa:600]"
1600206-65 = "― [log=코토리]무, [wa:300]물론 저에 대한 거니까 [wa:1700]전 알고 있지만……![/log]"
1600206-68 = "― [log=코토리]그, [wa:300]그러니까 [wa:1300]저, [wa:500]저 말이죠!? [/log]"
1600206-71 = "[wa:100]― [log=코토리]평소에는 그게, [wa:2200]말하자면 다른 지식들을 [wa:900]쌓는다거나[/log]"
1600206-73 = "― [log=코토리]선생님 생각을 한다거나, [wa:1100]그리고……![/log]"
1600206-76 = "[wa:600]― [log=코토리]……? [wa:1900]어라. [wa:1500]방금 저, [wa:2500]무슨 [wa:1200]말을……?[/log]"
1600206-78 = "[wa:100]― [log=코토리]여러 지식을 [wa:1700]쌓거나, [wa:2200]선생님을[wa:2700] 생각한다고……?[/log]"
1600206-81 = "[wa:600]― [log=코토리]아, [wa:1300]아하하…….[/log]"
1600206-83 = "― [log=코토리]아니 [wa:300]방금 그건 그러니까……! [wa:1500]그, [wa:1600]으으……!![/log]"
1600206-86 = "아으, 어……. 아……."
1600206-87 = "[s7] \"코토리?\"\n[s8] \"괜찮아?\""
1600206-88 = "아, 아뇨. 그러니까. 어……."
1600206-89 = "아, 아뇨. 그러니까. 어……."
1600206-90 = "……시……."
1600206-91 = "[s] \"시?\""
1600206-92 = "시……."
1600206-93 = "[s] \"시……?\""
1600206-94 = "……실례했습니다아아아!!!"
1600206-99 = "[ns] \"……?\""
1600206-101 = "(……이후로 교실을 떠난 코토리는 그 길로 돌아오지 않았다.)"
1600206-102 = "(대신 곧 모모톡으로 '깔끔하게 정리가 끝난 뒤, 메일 보고서로 보내주겠다'는 연락이 왔다.)"
1600206-103 = "(추가로, 보고 작성에 걸린다는 예상 완료 시간은 '무기한'이라 적혀 있었다.)"
