[translation]
10049110-1 = "후일담;잘 지내시죠?"
10049110-4 = "그럼 다음 소식입니다."
10049110-5 = "트리니티와 게헨나의 경계에 위치한 보더랜드 놀이공원에서 지난 주말 있었던 소식입니다."
10049110-6 = "주말 간 진행된 <마법소녀 헤비캘리버 보더랜드 스페셜> 행사가 성황리에 마무리됐습니다."
10049110-7 = "캐스트 쇼의 너무나도 박진감 넘치는 연기가 호평을 받아, 캐스트의 정체에 대해 많은 추측이 오가고 있는데요,"
10049110-8 = "놀이공원 측에서는 \"프라이버시를 위해서 알려드릴 수 없다. 다만 다음 행사를 더 기대해달라.\"는 원론적 입장을 내놓았습니다."
10049110-9 = "공연의 감독으로 샬레의 선생님이 있다는 소문도 있으나, 샬레는 이에 대해 공식적인 답변을 하지 않았습니다."
10049110-10 = "다음 소식입니다."
10049110-11 = "총학생회는 가짜상품과 과장광고 상품에 대한 처벌 조례안을……."
10049110-13 = "에엑- 이게 끝이에요?"
10049110-14 = "뭔가 더 자세하게, '화이트가 멋있었다.', '핑크가 귀여웠다.', '에라가 무서웠다.' 같은 내용이 더 있으면 좋을 텐데-!"
10049110-15 = "오히려 잘된 일이라고 생각합니다. 레이사 씨."
10049110-16 = "나들이로 간 놀이공원에서 소동이 있던 것도 모른다면, 좋은 것 아닐까요?"
10049110-17 = "하기사, 맞습니다! 마법소녀는 정체를 들키면 안 되니까요!"
10049110-18 = "마법소녀로 유명해질 수는 없었지만, 자경단의 슈퍼스타로도 충분합니다!"
10049110-19 = "레이사 씨는 활기차군요."
10049110-20 = "앗, 안녕하세요. 두 분."
10049110-21 = "마지막으로 본 게 꼭 사흘 전 같은데, 시간이 참 빠르네요."
10049110-22 = "그야, 사흘 전이니까요……?"
10049110-23 = "시미코 씨, 혹시 많이 피곤하신가요?"
10049110-24 = "농담이에요 농담!"
10049110-25 = "시미코 씨의 농담, 처음 들어보는 것 같습니다……!"
10049110-26 = "방금 서점에서 책을 샀거든요! <웃다가 쓰러지는 유머의 기술>!"
10049110-27 = "아직 몇 페이지 못 읽었지만, 금방 다 읽을 것 같아요."
10049110-28 = "시미코 씨는 모든 일에 최선을 다하시는군요."
10049110-29 = "일단 설명서를 읽으라는 말도 있잖아요? 책은 무언가를 하기 위한 설명서 같다고도 생각해요."
10049110-30 = "이번에 악의 간부가 되기 위해서도 공부하셨었나요?!"
10049110-31 = "시간이 부족해서 많이는 보지 못했어요."
10049110-32 = "마법소녀물은 처음이지만 레이사 씨 덕분에 무척 재밌게 봤답니다."
10049110-33 = "저도 이번 기회에 헤비캘리버 애니메이션을 보고 있습니다."
10049110-34 = "어제 3기 7화까지 봤습니다. 어째서 화이트가 분홍색 의상이 되었는지, 그 이유가 재미있었습니다."
10049110-35 = "정의에 관한 좋은 이야기였어요."
10049110-36 = "우히-!!!"
10049110-37 = "극장판도 꼭 보셔야 합니다! 저번에 나온 <헤비캘리버 브로큰 애로우>도 엄청 재밌습니다!"
10049110-38 = "다 보시면 제가 한 번 더 설명해 드리겠습니다!"
10049110-40 = "좋아요, 그 외에도 심심하시면 언제든지 도서관을 찾아주세요."
10049110-44 = "오늘의 순찰은 평화롭네요."
10049110-45 = "늘상 일어나는 자잘한 문제뿐. 평화로운 편이었다고 생각합니다."
10049110-46 = "스즈미 씨가 기운 차리셔서 엄-청 기쁩니다!"
10049110-47 = "도움을 주고, 감사를 받을 때 스즈미 씨의 얼굴은 제일 멋있으니까요!"
10049110-48 = "스즈미 씨가 지키는 이 동네가 그래서 무지 좋습니다!"
10049110-49 = "어떤 표정을 하고 있는지, 스스로는 모르고 있었네요."
10049110-50 = "알려줘서 고마워요."
10049110-54 = "……."
10049110-55 = "자경단…… 진짜 관두시는 건 아니죠?"
10049110-60 = "후후……."
10049110-61 = "스즈미 씨?"
10049110-62 = "레이사 씨가 그때 그렇게 좋은 말을 해주셨는데 관둘리가요."
10049110-63 = "할 겁니다. 할 수 있으니까요."
10049110-68 = "아- 배부르다, 배불러-"
10049110-69 = "같이 가요 대장!!"
10049110-70 = "으윽, 너무 많이 먹었나 봐……."
10049110-71 = "먹을 수 있을 때 제대로 먹어둬야지!"
10049110-75 = "켁, 뭐야. 그때 그 이상한 놈들……!"
10049110-76 = "우린 아무 잘못 안 하고 있다구!!"
10049110-77 = "지금 공격당하면 배가 터져버릴 거야……."
10049110-78 = "딱히 뭔가 잘못했다고 하지도 않았습니다만……."
10049110-79 = "……지난 주말엔 수고 많으셨습니다."
10049110-80 = "유폭에 날아가 버리는 바람에 포상금은 받지 못하게 된 것, 미안합니다."
10049110-81 = "그래도 날아가는 거 멋있었습니다! 로켓 같았어요!"
10049110-82 = "그렇지만, 덕분에 더 커질 뻔한 일을 저지했습니다. 정말로, 감사합니다."
10049110-83 = "처음엔 날 잡으려고 한 거였잖아? 딱히 도울 생각 없었다구."
10049110-84 = "포상금은 아깝긴 하지만 그래도 실컷 날뛰고 불고기도 먹었으니 신경 쓰지 마셔."
10049110-85 = "불고기요?!"
10049110-86 = "선생이 포상금은 유감이지만 착한 일 했다고 원래 포상금으로 먹으려고 한 불고기 사줬거든."
10049110-87 = "엄청나게 많이 먹었죠-"
10049110-88 = "선생님, 계산할 때 좀 슬퍼 보이셨지만……."
10049110-89 = "다행입니다. 어떻게든 잘 된 것 같군요."
10049110-90 = "자경단이 헬멧단 걱정을 다 해주네? 별일이구만."
10049110-91 = "휴, 음료수도 잘 마셨다."
10049110-92 = "읏차."
10049110-96 = "크으, 아깝다. 한 번에 쓰레기통에 넣을 수 있었는데."
10049110-97 = "넣었으면 3점 슛이겠네요 대장."
10049110-98 = "그럼 이제 간다, 재밌게 자경단인지 뭔지 하셔-"
10049110-103 = "정지하시죠."
10049110-104 = "엥?"
10049110-105 = "쓰레기를 제대로 쓰레기통에 넣고 가셔야죠?"
10049110-106 = "에엑, 귀찮게…… 이미 음료수 튀어서 다시 만지기 싫어."
10049110-107 = "결국 치우시는 분이 손대야 합니다."
10049110-108 = "지금이라도 다시 바로잡을 수 있습니다."
10049110-110 = "아, 그럼……."
10049110-111 = "우리 대장한테 명령이냐?"
10049110-112 = "대장! 이참에 저번에 제대로 못 보여준 본때를 보여주시죠?!"
10049110-113 = "에? 아, 아니…… 어……?"
10049110-114 = "(그냥 조심스럽게 다시 집어서 넣으려고 했는데, 이 녀석들…….)"
10049110-115 = "어쩔 수 없군요. 레이사 씨?"
10049110-116 = "네! 매지컬-!!!!!"
10049110-117 = "으아악 이제 마법소녀는 그만!!!"
