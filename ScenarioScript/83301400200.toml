[translation]
83301400200-6 = "서, 서, 서, 선도부자아앙……! 우리의 계획을 저지하다니……!"
83301400200-7 = "여전히 선도부장은 무섭지만……! 그래도 원통하도다……!"
83301400200-8 = "우리들의 <게헨나 부글부글 대작전>이 이렇게 허무하게도 스러지고야 말다니!"
83301400200-16 = "그래서 말인데 대체 그 <게헨나 부글부글 대작전>이란 게 뭐였던 거야?"
83301400200-17 = "어떤 작전이길래, 만마전 주차장까지 와서 온천을 만들려고 한 건지…… 행동이 다소 이해가 되질 않는데."
83301400200-21 = "혹시…… 그냥 평소처럼 날뛰고 싶었던 거뿐?"
83301400200-22 = "아냐!"
83301400200-23 = "듣고 놀라지 말라고! <게헨나 부글부글 대작전>은…… 말 그대로 게헨나 전체에 위대하고 멋진 온천을 만들기 위한 대계획!"
83301400200-24 = "………?"
83301400200-25 = "평소처럼 게헨나 외곽에서 온천을 파다가 우연히 알아낸 사실이 있었지."
83301400200-26 = "게헨나 학원에 존재하는 수맥의 특정 포인트를 몇 군데 잇다보면…… 그것이 곧 한 점으로 모인다는 사실을 말이야."
83301400200-27 = "그 모인다는 점이 혹시……"
83301400200-28 = "그래, 맞아! 바로 만마전의 주차장이었던 것이다!"
83301400200-29 = "그곳만 온천으로 만들 수 있었다면…… 각지와 연결된 수맥이 한 번에 이어지는 것으로……!"
83301400200-30 = "게헨나의 모든 학생이 뛰어들 수 있는 초거대한 온천이……!"
83301400200-34 = "그런 꿈에 가득 찬 계획이 실현될 수 있었을 텐데……!"
83301400200-35 = "………그것참 터무니없네."
83301400200-36 = "이번엔 이렇게 물러날 수밖에 없었지만……!"
83301400200-37 = "아직 우리는 포기하지 않았어……! 이번 계획이 실패했다면……!"
83301400200-38 = "다음번엔! 급양부 아래에서 비밀리에 흐르고 있는 수맥에 접촉해 <폭발! 온천계란 대작전>을 개시할 수 있도록……!"
83301400200-39 = "그래, 알겠으니. 얌전히 반성하고 있도록 해."
83301400200-46 = "끼양?!"
