[translation]
211100-1 = "Episode 10;Negotiations...?"
211100-2 = "Gehenna Heritage League"
211100-3 = ""
211100-4 = "For our next order of business..."
211100-5 = "I'm sure we all remember how communications with the Gourmet Research Society went."
211100-6 = ""
211100-8 = ""
211100-10 = ""
211100-11 = "Ah, right... They were super uncooperative."
211100-12 = "There was no reasoning with them."
211100-14 = "Precisely. And they will continue to bring an element of uncertainty to Gehenna...unless we devise a different approach."
211100-15 = "And..."
211100-16 = ""
211100-19 = ""
211100-21 = "We still have another undesirable element to rectify."
211100-22 = ""
211100-25 = ""
211100-26 = "Ah, I think I know it...!"
211100-27 = "Ooh, me! The Hot Springs Department!"
211100-28 = ""
211100-30 = ""
211100-31 = "Ah! You beat me! I was gonna say that."
211100-33 = "Regardless, you are both correct. The Hot Springs Department is one of the two major Gehennan terrorist organizations."
211100-34 = "Both are eroding the foundation of the glorious Gehenna that we seek to build, both physically and symbolically."
211100-36 = "But what can we do? I feel like they're even more stubborn than the Gourmet Research Society."
211100-37 = "Do you have a plan for them too, Shouko?"
211100-39 = "The Hot Springs Department is known for their strong bonds and unbreakable trust in each other. These are admirable virtues for an organization."
211100-40 = "And yet...that is where their weakness lies."
211100-41 = ""
211100-44 = ""
211100-48 = "[ns] \"So that's why you called me.\""
211100-49 = "Yes, Sensei."
211100-50 = "We have concluded that your presence is necessary to persuade the Hot Springs Department."
211100-51 = "[s1] \"I'm not exactly confident...\"\n[s2] \"But should we give it a try?\""
211100-54 = "Yes. I was told that the Hot Springs Department has recently finished a project in this area."
211100-63 = ""
211100-66 = "Huh? The spring's not even open yet! Someone's already here?"
211100-67 = ""
211100-70 = ""
211100-72 = ""
211100-73 = "Ah, Sensei?"
211100-74 = "Whoa! How'd you know I was here? Were you drawn in by the sweet, sulfurous hot spring aroma?"
211100-75 = "[s3] \"Hi, Megu.\"\n[s4] \"You're working alone today?\""
211100-78 = "Yup! We're all wrapped up, so I let the others take a break!"
211100-79 = "Ah, and President Kasumi's working on another site!"
211100-80 = "Yes, just as anticipated."
211100-81 = "And who's your friend? Hiya, I'm Megu, the Hot Springs Department's..."
211100-82 = "...Captain, and the former president."
211100-83 = "Wow... You knew about that?"
211100-84 = "Nice to meet you, Captain Megu. I am Igarashi Shouko, Secretary of the Gehenna Heritage League."
211100-85 = "Good to meet you, Shouko!"
211100-86 = "Yes. Let's talk business."
211100-87 = ""
211100-89 = ""
211100-91 = "Sensei and I came to visit you to deliver the Hot Springs Department a very special gift."
211100-92 = ""
211100-94 = ""
211100-95 = "Is that so? What kind of gift?"
211100-96 = ""
211100-98 = ""
211100-99 = "A detailed geothermal gradient map made by cross-referencing crustal movements recorded in Gehenna and Schale's geological archives. The map illustrates the biggest and most active geothermal veins, marking 14 major locations and 56 places of interest."
211100-100 = "Um... What are you talking about...? I'm not sure I caught all that..."
211100-101 = "Simply put, this is a treasure map marking viable hot spring locations."
211100-102 = ""
211100-104 = ""
211100-109 = ""
211100-110 = "This map shows all the veins with hot spring potential in the Gehenna district."
211100-111 = "Naturally, the points marked on this map have been thoroughly vetted. Only specific points, ones that avoid the academy's power grids, water supply and drainage lines, have been selected."
211100-112 = "Thus, the veins marked on this map are concentrated on the outskirts of the city. Developing a large-scale hot spring complex would directly boost revenue for the Gehenna district."
211100-113 = "[s] \"So that's why you asked me for that data.\""
211100-114 = "Yes. It would have been better to gather more info, but this should be enough to control the Hot Springs Department for now."
211100-115 = "This map MUST be delivered to Shimokura Megu."
211100-116 = ""
211100-119 = "I know you might find that odd. After all, Kinugawa Kasumi is the Hot Springs Department's president."
211100-120 = "But she will never behave the way I need her to, regardless of your presence, Sensei."
211100-121 = "She might respond differently if this were your...personal request. But this is an entirely different matter."
211100-122 = "That is why we must deliver this map to Megu directly."
211100-123 = "Because Kinugawa Kasumi acts in accordance with Shimokura Megu's wishes."
211100-124 = "To be more precise, the only reason she serves as the Hot Springs Department's president is at Megu's request."
211100-125 = "[s] \"...How did you know that?\""
211100-126 = "With enough tenacity and a clear goal, you can learn a great deal."
211100-127 = "We're sidetracked. The bottom line is that we must find a moment when Shimokura Megu is alone."
211100-130 = "No kidding! We can build loads of amazing hot springs with this info!"
211100-131 = "Of course you could. We've specially selected these points. If you build here, you won't be bothered by the Prefect Team."
211100-132 = "That's awesome! President Kasumi is really, super scared of the Head Prefect!"
211100-133 = "Ah! But you know what? I need to run this by her first."
211100-134 = "After all, President Kasumi runs the show. We don't do anything without her—"
211100-135 = "No."
211100-136 = "H-Hmm?"
211100-137 = ""
211100-139 = ""
211100-141 = "All that matters is what you think. Ask yourself, \"Do I, Shimokura Megu, want to do this...or not?\""
211100-142 = "R-Really?"
211100-143 = "Yes. Because you hold within you the priorities of the Hot Springs Department, don't you?"
211100-144 = "Would you mind sharing a little wisdom, Sensei? After all, Megu trusts you with all her precious heart and true soul..."
211100-145 = "Ugh...?"
211100-147 = "I didn't have a great feeling about it..."
211100-148 = "But...I reasoned that we'd avoid so much damage and trouble if we kept the Hot Springs Department in designated areas."
211100-149 = ""
211100-150 = "[ns] \"...You like digging hot springs, right, Megu?\""
211100-151 = ""
211100-153 = ""
211100-154 = "Yup! I like it lots! As much as ramen... No, who am I kidding? I would skip ramen if it meant I could work on a hot spring!"
211100-155 = "[s5] \"Then how about you try digging on the spots?\"\n[s6] \"She's saying that these should be of the highest quality.\""
211100-158 = "Heehee! Well, if you're vouching for it, Sensei, then it must be true!"
211100-159 = "Okay, all right! Then I'll tell President Kasumi that we should try digging in these spots."
211100-160 = "You can only develop in places marked on the map. "
211100-161 = ""
211100-163 = ""
211100-164 = "Ah... Is that how it works?"
211100-165 = "Yes. We're giving you this map in exchange for banning hot spring development in non-designated areas."
211100-166 = "Well, so it goes! You have plenty of places marked here, so we'll be busy for a while. I read you, loud and clear!"
211100-167 = "Thank you for your attention to this matter. Kindly deliver the message to President Kasumi."
211100-168 = "Heehee, thank YOU! You're a real pal, Shouko! I just met you, and I feel like you've handed me a treasure map!"
211100-169 = "..."
211100-170 = "I'll find President Kasumi right away! I'm sure she'll love it too!"
211100-171 = "Bye bye! I'll be seeing you! You too, Sensei!"
211100-172 = ""
211100-174 = ""
211100-175 = "Remarkably simple."
211100-176 = "The president's reaction remains a factor. But ultimately, she won't go against her sworn friend."
211100-177 = "As I've mentioned, Kinugawa Kasumi always puts Shimokura Megu's desires first."
211100-178 = ""
211100-180 = ""
211100-181 = "You don't seem so happy, Sensei."
211100-182 = "[s] \"I feel bad...for some reason.\""
211100-183 = "..."
211100-184 = "We did not lie to her. Nor did we deceive her."
211100-185 = "We simply delivered curated information to a particular individual."
211100-186 = "If things proceed as planned, then neither side will suffer a loss."
211100-187 = "The Hot Springs Department will happily dig successful hot springs, and Gehenna will prosper with one of its more chaotic elements contained and put to good use."
211100-188 = "...Please do not misunderstand me, Sensei. I have no desire to deny any individual student her freedom."
211100-191 = "You find this surprising, of course. It is only natural."
211100-192 = "The desire to shoot something, to eat something. These actions are nothing more than unbridled impulses. They are not freedom."
211100-193 = "We simply cannot allow Gehenna's students to be enslaved by their base instincts and impulses."
211100-196 = "And I happen to believe that community is a far more glorious value than individual freedom. After all, freedom finds its fulfillment within the collective."
211100-197 = "[s] \"Everyone has a different opinion on that.\""
211100-198 = "Indeed. That's very possible. I am well aware."
211100-201 = "I hiked down the mountain with Shouko."
211100-206 = ""
211100-208 = "Wahahaha! I knew you'd take these tracks!"
211100-209 = "[ns] \"That voice...!\""
211100-210 = ""
211100-213 = ""
211100-214 = "Pull the brakes! I rushed here after hearing the news."
211100-215 = ""
211100-217 = ""
211100-219 = "Hot Springs Department President, Kinugawa Kasumi."
211100-220 = "Right, that same \"Kasumi\" you've been talking around. The one you've been so determined to keep out of the loop."
211100-221 = "Heh..."
211100-222 = "Would you like me to introduce myself?"
211100-223 = "My goodness, yes! It's been so long since someone's caused me such profound irritation. How could I not be curious?"
211100-224 = "I am Igarashi Shouko, Secretary of the Gehenna Heritage League."
211100-225 = "I see. So THAT'S your name... Hmm... Mmmm..."
211100-226 = "..."
211100-227 = "Ah, I was so lost in thought that I forgot my manners! Hello there, Sensei!"
211100-228 = "[s] \"Hi, Kasumi...\""
211100-229 = "Ah, you don't have to make that sorry little pout. Haha! You're far too accommodating, Sensei."
211100-230 = "Don't worry. I figured out ages ago that this whole scheme was concocted by \"Shocking\" or whatever her name was."
211100-231 = "It's Igarashi Shouko."
211100-232 = "Right, \"Inarizushi Shocko.\" Or was it \"Shackle\"? I'm sure I'll get it eventually. Or not!"
211100-233 = "So, you deliberately approached Captain Megu and presented her with this map. She thought it was a gift!"
211100-234 = "But on closer examination, this map seems to be quite distorted. Did you know that?"
211100-235 = "..."
211100-236 = "It kind of smells like you're trying to tell us what to do? \"Order and discipline,\" all that?"
211100-237 = "\"Stop it. Bad girls! Hey, you like hot springs? Look over there! Get 'em!\" You know, something along those lines for your would-be work dogs?"
211100-238 = "Yeah? You kept it simple, so your message came in loud and clear. After that, I KNEW I had to meet you in person."
211100-239 = "And?"
211100-240 = "..."
211100-241 = "Huh?"
211100-242 = "So, are you refusing the proposal?"
211100-243 = "..."
211100-244 = "Haha! Wow, I can't believe it! It's been a while since I've felt so...electrified!"
211100-245 = "Of course I'll go with it! I'll dig up all the places marked on this map. And why would I do that?"
211100-246 = "Because Shimokura Megu said she wanted to."
211100-247 = "Heh... Yeah."
211100-248 = "I'll play along THIS time, just like how you wanted. All according to your clever plan, right?"
211100-249 = ""
211100-251 = ""
211100-252 = ""
211100-254 = "But keep this in mind."
211100-255 = "There won't be a \"next time\" for you. Got it?"
211100-256 = "Yeah, that's agreeable. Unless you'd like to return to \"that place\" immediately."
211100-257 = "...What?"
211100-258 = ""
211100-260 = ""
211100-262 = ""
211100-263 = "I said what I said."
211100-264 = "[s] (\"That place...?\")"
211100-265 = "...Haha. Don't try bluffing a high roller, kid."
211100-266 = "You're not on \"our side,\" that's clear enough. You wouldn't last long talking like that."
211100-267 = "Then, if we're done here..."
211100-268 = "Do take care, Kasumi."
211100-269 = ""
211100-271 = ""
211100-272 = "..."
211100-273 = "Haha, hahaha! You're fun. You, I think I like you."
211100-274 = "Catch you next time, sis! Hm? You hear me? We're definitely going to meet again REAL SOON!"
211100-275 = "Haha! And you too, Sensei!"
211100-276 = "[s] \"Kasumi...\""
211100-277 = ""
211100-279 = ""
211100-280 = ""
211100-283 = "Phew..."
211100-284 = "So it was wise to go after Shimokura Megu first."
211100-285 = "With that, our biggest source of uncertainty has been handled. For now."
211100-286 = "What matters is that we are now one step closer to a glorious Gehenna."
211100-287 = "Soon, all of Gehenna will come together, unified in purpose and values."
211100-288 = "[s] \"...\""
211100-289 = "..."
211100-290 = "Sensei..."
211100-291 = "Do you have an issue with my approach?"
211100-292 = ""
211100-295 = "[ns7] \"I don't know what's right or wrong...\"\n[ns8] \"But I hope you don't limit yourself.\""
211100-296 = ""
211100-297 = ""
211100-299 = ""
211100-300 = "\"Limit myself\"? Is that how I came across?"
211100-301 = "[s9] \"As if there were no other possibilities.\"\n[s10] \"That kind of inflexibility can exhaust you.\""
211100-302 = ""
211100-303 = ""
211100-305 = ""
211100-306 = "..."
211100-307 = "..."
211100-308 = ""
211100-310 = ""
211100-311 = "[ns] \"Shouko?\""
211100-312 = ""
211100-319 = ""
211100-320 = "I caught up to Shouko, who was power walking away."
211100-321 = "...I'm surprised. To think that's how I...how I appeared to you."
211100-322 = "Didn't I come across as an Übermensch, forging ahead with unwavering determination?"
211100-323 = "[s] \"Uh... You came off as a little threatening.\""
211100-324 = "Is that so...?"
211100-325 = "[s] \"Is that who you want to be, Shouko?\""
211100-326 = "I suppose I want to be truly glorious...or witness someone who is..."
211100-327 = "Sensei, have you met anyone like that? Someone who acts without hesitation, who walks without a shred of doubt?"
211100-328 = ""
211100-330 = ""
211100-331 = "You've seen lots of people who \"wanted to be like that\"?"
211100-332 = "Someone could be incredible, but they'll \"inevitably become self-righteous if they stop questioning themselves\"...?"
211100-333 = "..."
211100-334 = "Perhaps. Perhaps there's someone like that...somewhere."
211100-335 = ""
211100-337 = ""
211100-338 = ""
211100-339 = "Or maybe there was. Once."
211100-341 = "Shouko and I walked back in silence."
211100-343 = "Next Episode;An Unfamiliar Peace"
