211100-109 = "3;쇼코;01\n#3;a\n#3;greeting\n#wait;1200"
211100-110 = "3;쇼코;02;이 지도에는 게헨나 자치구에서 온천이 나올 가능성이 있는 지맥들이 표기되어 있죠.\n#3;em;[반응]"
211100-111 = "3;쇼코;01;당연하게도, 지도에 표기된 부분은 전체 지맥에 비하면 극히 일부입니다. 학원 기반 시설의 전력망과 상하수도 라인을 정교하게 피해 가는 위치의 포인트만 선정되었습니다."
211100-112 = "3;쇼코;99;따라서 이 지도에 표기된 지맥은 도심 외곽에 집중되어 있으며, 대규모 온천 단지 조성은 곧 게헨나 자치구의 수익으로 직결되겠죠."
211100-113 = "[s] \"저번에 알려달라고 했던 데이터는 이 지도를 만들기 위해서였구나.\""
211100-114 = "3;쇼코;00;네. 더 다양한 데이터가 있다면 좋겠지만, 일단 온천개발부를 통제하기 위해서는 이 정도로도 충분하겠죠.\n#3;em;…"
211100-115 = "3;쇼코;01;그리고, 이 지도는 반드시 시모쿠라 메구에게 전달해야 합니다."
211100-116 = "#st;[0,0];instant;1;"
211100-119 = "3;쇼코;99;네, 의아하실 수도 있겠죠. 온천개발부의 부장은 키누가와 카스미니까요.\n#3;m2"
211100-120 = "3;쇼코;05;그리고 그녀는 절대 제 생각대로 행동하지 않을 겁니다. 아무리 선생님이 계신다고 해도요."
211100-121 = "3;쇼코;02;선생님 개인의 부탁이라면 몰라도, 그것과는 거리가 먼 건이니 금방 알아채겠지요."
211100-122 = "3;쇼코;01;그렇기 때문에 이 지도를 메구에게 직접 전달해야 하는 것입니다."
211100-123 = "3;쇼코;99;왜냐하면, 키누가와 카스미는 시모쿠라 메구의 의지대로 행동하기 때문이지요.\n#3;em;…"
211100-124 = "3;쇼코;02;정확히 말하자면 메구의 바람을 이뤄주기 위해 온천개발부의 부장 역할을 수행하고 있는 것이니까요."
211100-125 = "[s] \"……그런 건 어떻게 알았어?\""
211100-126 = "3;쇼코;06;충분한 집념과 목적의식이 있다면, 많은 것을 알 수 있는 법이지요.\n#3;m3"
211100-127 = "3;쇼코;02;이야기가 샜습니다만, 결론적으로 우리는 시모쿠라 메구가 홀로 떨어져 있는 타이밍을 찾아내야 합니다."
211100-130 = "3;메구;00;와, 정말? 이것만 있으면 엄청난 온천을 여러 개, 마음껏 만들 수 있겠네?!\n#3;em;[///]\n#3;a"
211100-131 = "3;쇼코;02;물론입니다. 특히 엄선한 포인트만 기재하였기에, 선도부에 쫓길 염려도 없습니다."
211100-132 = "5;메구;03;그거 좋은 소식이네! 우리 카스미 부장은 선도부장을 정말정말 무서워하거든!\n#5;em;[반짝]\n#5;hophop\n#5;al\n#3;m1"
211100-133 = "5;메구;02;앗! 그런데 이대로 하려면 카스미 부장한테 물어봐야 하는데."
