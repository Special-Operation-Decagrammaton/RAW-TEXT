[translation]
211100-1 = "第10話;交渉……？"
211100-2 = "ゲヘナ再興委員会"
211100-4 = "では、次の議題に移りましょう。"
211100-5 = "美食研究会との一件は覚えていますね？"
211100-11 = "う、うん……統制できないって確信した。"
211100-12 = "言葉が通じない感じ。"
211100-14 = "別の方法を講じない限り、今後も不確定要素として残り続けるでしょう。"
211100-15 = "そして――"
211100-21 = "ゲヘナの不確定要素は、もう1つ。"
211100-26 = "あっ、分かったかも……！"
211100-27 = "温泉開発部！！"
211100-31 = "あ～！先に言われた～！"
211100-33 = "正解です。美食研究会と並び「二大テロ組織」と呼ばれる存在ですね。"
211100-34 = "それすなわち、私たちが築こうとする「偉大なゲヘナ」の基盤を揺るがす存在です。"
211100-36 = "美食研究会より話聞いてくれなさそうだけど……。"
211100-37 = "何か作戦ある？"
211100-39 = "すでに考えてあります。#n温泉開発部の強みは、メンバー同士の結束力です。"
211100-40 = "そして同時に、それが弱点にもなるのです。"
211100-48 = "[ns] \"だから私を呼んだんだね。\""
211100-49 = "はい。"
211100-50 = "温泉開発部を説得するには、先生の協力が不可欠だと判断しました。"
211100-51 = "[s1] \"自信はあんまりないけど……。\"\n[s2] \"とりあえず行ってみよっか。\""
211100-54 = "この先に、最近完成した温泉があるそうです。"
211100-66 = "あれ？お客さん？#nごめんねー、まだオープンしてなくて――"
211100-73 = "って、先生？"
211100-74 = "どうしてここが分かったの？#nあっ！温泉の匂いを嗅ぎつけてきたのかな？"
211100-75 = "[s3] \"そんなところかな。\"\n[s4] \"今日は一人？\""
211100-78 = "うん！作業は全部終わってるから、部員はお休み！"
211100-79 = "あ、カスミ部長なら別の現場だよ！"
211100-80 = "……想定通りですね。"
211100-81 = "あれ？その子は？#n私はメグ！温泉開発部の――"
211100-82 = "作業班長で、元部長ですね。"
211100-83 = "わわっ、なんで知ってるの？"
211100-84 = "はじめまして、メグ班長。私はゲヘナ再興委員会の書記、[ruby=いがらし]五十嵐[/ruby]ショウコと申します。"
211100-85 = "よろしくね！"
211100-86 = "では、本題に入りましょう。"
211100-91 = "本日お訪ねしたのは、とっておきの「贈り物」をお届けするためなんです。"
211100-95 = "わあ！どんなプレゼント！？"
211100-99 = "ゲヘナ全域の地温勾配図です。#nゲヘナ自治区に存在する大規模かつ活発な地脈が14箇所、#n細かいものを含めれば56箇所記されています。"
211100-100 = "う～ん……？私、そういうのよく分かんなくて……。"
211100-101 = "簡単に言えば、温泉を掘り当てられる場所が載っている「宝の地図」です。"
211100-110 = "この地図には、温泉が湧く可能性のある地脈を記してあります。"
211100-111 = "ですが、載せてあるのは全体のごく一部。#n電力網や上下水道ラインが通っていない地点だけを選びました。"
211100-112 = "そのため、分布は都市外縁に集中しています。#n大規模な温泉リゾートを造成すれば、ゲヘナ自治区の収益に直結するでしょう。"
211100-113 = "[s] \"前にデータを欲しがってたのは、これのためだったんだね。\""
211100-114 = "ええ。もっと多くのデータがあれば理想でしたが、温泉開発部を統制するためなら、#nこの程度でも十分でしょう。"
211100-115 = "ただし、注意点があります。#nこの地図は必ず、[ruby=しもくら]下倉[/ruby]メグに渡さなければなりません。"
211100-119 = "先生の疑問はもっともです。#nなぜ部長である[ruby=きぬがわ]鬼怒川[/ruby]カスミに渡さないのか。"
211100-120 = "その答えは、彼女は絶対に思い通りには動かないからです。#n先生がいらしたとしても変わらないでしょう。"
211100-121 = "先生個人の頼みならともかく、そうでないことはすぐに見抜かれるはず。"
211100-122 = "そこで、下倉メグなのです。"
211100-123 = "なぜなら、鬼怒川カスミは下倉メグの「意思」に従うから。"
211100-124 = "正確には、下倉メグの願いを叶えるために温泉開発部の部長を担っている、#nというべきでしょう。"
211100-125 = "[s] \"……それ、どうやって知ったの？\""
211100-126 = "目的意識と執念があれば、見えてくるものは多いものですよ。"
211100-127 = "話が逸れましたね。#n結論として、私たちは下倉メグが1人のタイミングを見極める必要があります。"
211100-130 = "これさえあれば、温泉を好きなだけ作れるってこと！？"
211100-131 = "もちろんです。さらに、記載してあるのは厳選したポイントだけ。#n風紀委員会に追われる心配もありません。"
211100-132 = "そうなの！？カスミ部長、ほんっとに風紀委員長を怖がってるから喜ぶと思う！"
211100-133 = "あっ！でもカスミ部長に相談しなきゃ。"
211100-134 = "うちはぜ～んぶ、カスミ部長の計画通りに動いてるんだ！"
211100-135 = "違います。"
211100-136 = "え？"
211100-141 = "重要なのはあなたの意思。下倉メグがやりたいかどうか、です。"
211100-142 = "そうなの？"
211100-143 = "はい。温泉開発部では、それが最も優先されていますから。"
211100-144 = "先生からも一言いただけますか？#nそのほうがメグさんも安心でしょう。"
211100-145 = "うぅ……。"
211100-147 = "（なんだか腑に落ちない気もするけど……）"
211100-148 = "（地図の場所だけを開発するなら被害が減るのは事実だ）"
211100-150 = "[ns] \"……メグは、温泉開発が好きだよね？\""
211100-154 = "うん！大好き！ラーメンくらい……いや、ラーメン我慢できるくらい大好き！"
211100-155 = "[s5] \"それなら地図の場所はぴったりだよ。\"\n[s6] \"他より質が良いらしいし。\""
211100-158 = "えへへ、先生が言うなら間違いないね！"
211100-159 = "よし！じゃあカスミ部長に言ってみる！"
211100-160 = "必ず、[ruby=・]地[/ruby][ruby=・]図[/ruby][ruby=・]の[/ruby][ruby=・]場[/ruby][ruby=・]所[/ruby][ruby=・]だ[/ruby][ruby=・]け[/ruby]を開発してください。"
211100-164 = "えっ？そういう決まりなの？"
211100-165 = "別の場所は開発しない。それがこの地図をお渡しする条件です。"
211100-166 = "そっか……うーん……それもカスミ部長に伝えておくね！"
211100-167 = "ええ、そのままお伝えいただければと。"
211100-168 = "こんな地図くれてありがとう！ショウコはいい人なんだね！"
211100-169 = "……。"
211100-170 = "じゃあカスミ部長のところ行ってくる！#n部長、絶対喜ぶよ～！"
211100-171 = "ばいば～い！"
211100-175 = "……簡単でしたね。"
211100-176 = "鬼怒川カスミの反応は未知数ですが、結局は逆らえないでしょう。"
211100-177 = "最も強い動機は、下倉メグの願いを叶えることですから。"
211100-181 = "……先生。表情が晴れませんね。"
211100-182 = "[s] \"ちょっと……罪悪感があって。\""
211100-183 = "……。"
211100-184 = "私たちは彼女に嘘はついていません。もちろん、騙してもいません。"
211100-185 = "選別された情報を、選別された相手に渡しただけ。"
211100-186 = "このまま上手く運べば、誰も損はしません。"
211100-187 = "温泉開発部は温泉を掘り当てられる。ゲヘナは不確定要素を抑えられる。#nしかも熟練した土木作業員を必要な場所に投入できるおまけ付き。"
211100-188 = "……誤解があるようですが、私は個人の自由を否定しているわけではありません。"
211100-191 = "ええ、意外に思われるのも無理はありません。#n一見すると私たちの理念とは矛盾していますから。"
211100-192 = "「自由」の定義が違うのです。#n「撃ちたい」「食べたい」。それらは自由ではなく、衝動に過ぎません。"
211100-193 = "これまでのゲヘナ生は本能や衝動の奴隷でした。#nですがこれからは違います。"
211100-196 = "そして私は、個人の自由より上位にある価値として「共同体への参加」があると考えています。自由とは集団の中でこそ完成するものですから。"
211100-197 = "[s] \"どう考えるかは人それぞれじゃない？\""
211100-198 = "そうでしょうね。承知しています。"
211100-201 = "（ショウコと一緒に山を下りた）"
211100-208 = "ハーハッハッハッハ！そうだ、この道を通ると思っていたよ！"
211100-209 = "[ns] \"この声は……。\""
211100-214 = "いやぁ、さっきメグから話を聞いてね。#n居ても立っても居られず駆けつけてしまった。"
211100-219 = "鬼怒川カスミ。"
211100-220 = "仲間外れだなんて、酷いことをするヤツもいたもんだなぁ？"
211100-221 = "ふっ……。"
211100-222 = "自己紹介をさせていただいても？"
211100-223 = "もちろんだとも！こんな気分にさせられたのは久しぶりだ。#n名前が気にならないわけないだろう？"
211100-224 = "ゲヘナ再興委員会の書記、[ruby=いがらし]五十嵐[/ruby]ショウコです。"
211100-225 = "なるほど、なるほど。ふ～ん？"
211100-226 = "……。"
211100-227 = "おっ、と。お隣さんに挨拶をしそびれていた。#nやぁ先生。息災かな？"
211100-228 = "[s] \"おかげさまで……。\""
211100-229 = "あーあー、そんな申し訳なさそうな顔をしないでくれ。#n先生は相変わらずお優しいようだ。"
211100-230 = "心配せずとも、[ruby=・]し[/ruby][ruby=・]ょ[/ruby][ruby=・]う[/ruby][ruby=・]ゆ[/ruby]ちゃんの企みは分かっている。"
211100-231 = "五十嵐ショウコです。"
211100-232 = "すまない、物覚えが悪くてね。ショックちゃん、だったか？#nいつか覚えてあげられる日が来るといいんだが……はてさて、来るかねぇ？"
211100-233 = "ま、挨拶はこの辺にしておこう。用件は分かっているだろう？#nわざわざメグ班長に、こんな「贈り物」をくれたんだから。"
211100-234 = "だがど～にもこれ、偏った地図に見えてしまうんだ。"
211100-235 = "……。"
211100-236 = "「統制」しようって思惑が、ジワジワ～っと滲んでくるようじゃないか。"
211100-237 = "大人しく「ここほれワンワン」してろ、と？"
211100-238 = "こんなに熱心なファンレターをもらってしまったんだ。#n顔くらいは出しておきたくもなるってもんさ。"
211100-239 = "それで？"
211100-240 = "……。"
211100-241 = "うん？"
211100-242 = "つまり、やらないという話でしょうか？"
211100-243 = "……。"
211100-244 = "ハーッハッハッハ！いや～、実にいい！素晴らしい！"
211100-245 = "もちろん、やるとも。この地図に載っている場所を、すべて。#n……なぜだと思う？"
211100-246 = "下倉メグが望むから。"
211100-247 = "……ああ、そうだ。"
211100-248 = "今回は乗ってやろう。"
211100-254 = "だが……これだけは覚えておけ。"
211100-255 = "「次」はないぞ？"
211100-256 = "構いません。その時は「あそこ」に戻ってもらいましょう。"
211100-257 = "……何？"
211100-263 = "そのままの意味です。"
211100-264 = "[s] （あそこ……？）"
211100-265 = "ふむ……ハッタリにしては薄っぺらいなぁ。"
211100-266 = "少なくとも「こっち側」じゃあなさそうだ。#nそういう言い回しをしてるやつは生き残れなかったからな。"
211100-267 = "用が済みましたら――"
211100-268 = "気をつけてお帰りください。"
211100-272 = "……。"
211100-273 = "はーっはっはっは！いいじゃないか。気に入ったよ。"
211100-274 = "また会おう。……絶対に、な。"
211100-275 = "先生も！"
211100-276 = "[s] \"カスミ……。\""
211100-283 = "ふう……。"
211100-284 = "やはり下倉メグを糸口にしたのは正しい判断でした。"
211100-285 = "これでゲヘナ最大の不確定要素が1つ排除されました。#n……しばらくはですが。"
211100-286 = "それでも、偉大なゲヘナに向けてまた一歩前進したと言えるでしょう。"
211100-287 = "皆が同じ場所を見据える理想郷。#n一つの心で結束し、団結するゲヘナもそう遠くありません。"
211100-288 = "[s] \"……。\""
211100-289 = "……。"
211100-290 = "先生は――"
211100-291 = "私のやり方が間違っていると、お考えですか？"
211100-295 = "[ns7] \"正しさは、私にも分からないけど……。\"\n[ns8] \"あんまり自分を追い詰めすぎないでほしいかな。\""
211100-300 = "そう……見えましたか。"
211100-301 = "[s9] \"必ず、とか。やらなきゃ、とか。\"\n[s10] \"そういうのって、先に自分がすり減っちゃうから。\""
211100-306 = "……。"
211100-307 = "…………。"
211100-311 = "[ns] \"ショウコ？\""
211100-320 = "（早足で遠ざかるショウコを追いかけた）"
211100-321 = "……ショックです。そんな風に見えていただなんて。"
211100-322 = "まっすぐな意志で突き進む立派な人のつもりだったのですが。"
211100-323 = "[s] \"少し……危うく見えるよ。\""
211100-324 = "そうですか……。"
211100-325 = "[s] \"ショウコは、そういう人になりたかったの？\""
211100-326 = "なりたかった……というより、見てみたかった、でしょうか。"
211100-327 = "迷いもなく判断を下して、疑いもなく進み続けられる……そんな人を。#n先生はどなたかご存じですか？"
211100-331 = "……なりたい人ならたくさん、ですか。"
211100-332 = "どれだけ立派でも、自分を疑わなければ、いずれ独善になる……？"
211100-333 = "……。"
211100-334 = "さあ。世界のどこかには本当にそんな人も「いる」のかもしれませんね。"
211100-339 = "……いえ。「いた」のかもしれません。"
211100-341 = "（それ以降の帰り道に会話はなかった）"
211100-343 = "次回;見知らぬ平和"
