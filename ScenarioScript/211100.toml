[translation]
211100-1 = "ตอนที่ 10;เจรจา...?"
211100-2 = "คณะกรรมการฟื้นฟูเกเฮนน่า"
211100-3 = ""
211100-4 = "ถ้างั้นก็มาที่วาระถัดไปกันค่ะ"
211100-5 = "ทุกคนคงจำกรณีการเจรจากับชมรมชิมอาหารครั้งก่อนได้นะคะ"
211100-6 = ""
211100-8 = ""
211100-10 = ""
211100-11 = "อ่า อื้ม... ฉันมั่นใจเลยว่าพวกนั้นควบคุมไม่ได้แน่"
211100-12 = "รู้สึกเหมือนเราคุยกันคนละภาษาเลย"
211100-14 = "ค่ะ หากไม่หาวิธีรับมือเป็นการเฉพาะ พวกเขาก็จะยังเป็นตัวแปรที่คาดเดาไม่ได้ของเกเฮนน่าต่อไปค่ะ"
211100-15 = "และก็..."
211100-16 = ""
211100-19 = ""
211100-21 = "ในเกเฮนน่ายังมีปัจจัยที่ไม่แน่นอนอีกอย่างหนึ่งค่ะ"
211100-22 = ""
211100-25 = ""
211100-26 = "อ๊ะ ฉันว่าฉันรู้...!"
211100-27 = "ขอตอบ! ชมรมพัฒนาออนเซ็น!"
211100-28 = ""
211100-30 = ""
211100-31 = "อ่า! ไม่ทันเหรอเนี่ย~!"
211100-33 = "ค่ะ ถูกต้องค่ะ กลุ่มที่ถูกเรียกว่าเป็นหนึ่งในสององค์กรก่อการร้ายรายใหญ่ เคียงคู่กับชมรมชิมอาหาร"
211100-34 = "พวกเขากำลังกัดกร่อนรากฐานของเกเฮนน่าอันยิ่งใหญ่ที่พวกเราต้องการสร้างขึ้น ทั้งในเชิงกายภาพและเชิงสัญลักษณ์ค่ะ"
211100-36 = "จะทำยังไงกับชมรมนั้นเหรอ? ดูท่าจะไม่ยอมฟังยิ่งกว่าชมรมชิมอาหารอีกนะ..."
211100-37 = "โชโกะจัง ครั้งนี้ก็มีแผนอะไรอยู่เหมือนกันเหรอ?"
211100-39 = "ชมรมพัฒนาออนเซ็นขึ้นชื่อเรื่องความไว้เนื้อเชื่อใจกันอย่างเหนียวแน่นค่ะ นับว่าเป็นจุดแข็งที่ยอดเยี่ยมในฐานะองค์กรเลย"
211100-40 = "แต่ว่า ชมรมนั้นก็มีจุดอ่อนอยู่ค่ะ"
211100-41 = ""
211100-44 = ""
211100-48 = "[ns] \"ถึงได้เรียกครูมาสินะ\""
211100-49 = "ใช่ค่ะ คุณครู"
211100-50 = "ฉันประเมินแล้วว่าถ้าจะโน้มน้าวชมรมพัฒนาออนเซ็น ก็จำเป็นต้องมีคุณครูอยู่ด้วยค่ะ"
211100-51 = "[s1] \"ครูเองก็ไม่ค่อยมั่นใจเท่าไรนะ...\"\n[s2] \"เอาเป็นว่า ลองไปดูกันก่อนดีมั้ย?\""
211100-54 = "ค่ะ ได้ยินมาว่าแถวนี้มีออนเซ็นแห่งหนึ่งที่ชมรมพัฒนาออนเซ็นเพิ่งดำเนินงานเสร็จเมื่อไม่นานมานี้ค่ะ"
211100-63 = ""
211100-66 = "เอ๋? ที่นี่ยังไม่เปิดให้บริการเลยนะ! มีลูกค้ามาแล้วเหรอ?"
211100-67 = ""
211100-70 = ""
211100-72 = ""
211100-73 = "อ๊ะ คุณครู?"
211100-74 = "ว้าว~! รู้ได้ยังไงน่ะว่าฉันอยู่ที่นี่? คุณครูเองก็ได้กลิ่นออนเซ็นด้วยเหรอ?"
211100-75 = "[s3] \"สวัสดี เมกุ อยู่คนเดียวเหรอ?\"\n[s4] \"สวัสดี เมกุ วันนี้อยู่คนเดียวสินะ\""
211100-78 = "อื้อ! งานที่นี่เสร็จหมดแล้ว ฉันเลยให้สมาชิกชมรมไปพักกันหมดเลย!"
211100-79 = "อ๊ะ ส่วนหัวหน้าคาสุมิ ตอนนี้ไปอยู่ไซต์งานอื่นน่ะ!"
211100-80 = "ค่ะ เป็นไปตามคาดเลยนะคะ"
211100-81 = "ทางนั้นใครเหรอ? ฉันชื่อเมกุ! ในชมรมพัฒนาออนเซ็น ฉันเป็น..."
211100-82 = "เป็นหัวหน้างานภาคสนาม และก็อดีตหัวหน้าชมรมด้วยใช่มั้ยคะ?"
211100-83 = "ว้าว รู้ด้วยสินะ"
211100-84 = "ยินดีที่ได้รู้จักค่ะ หัวหน้าเมกุ ฉันอิการาชิ โชโกะ เลขาคณะกรรมการฟื้นฟูเกเฮนน่าค่ะ"
211100-85 = "ยินดีที่ได้รู้จัก โชโกะ! ฝากตัวด้วยนะ!"
211100-86 = "ค่ะ ถ้างั้นก็เข้าเรื่องกันเลยนะคะ"
211100-87 = ""
211100-89 = ""
211100-91 = "ที่วันนี้คุณครูกับฉันมาพบหัวหน้าเมกุ ไม่ใช่เรื่องอื่นใด แต่เพื่อมอบของขวัญล้ำค่าให้กับชมรม#nพัฒนาออนเซ็นค่ะ"
211100-92 = ""
211100-94 = ""
211100-95 = "ว้าว! ของขวัญอะไรเหรอ?"
211100-96 = ""
211100-98 = ""
211100-99 = "นี่คือแผนที่ความร้อนใต้พิภพชั้นลึกที่เสร็จสมบูรณ์โดยเทียบข้อมูลการเคลื่อนตัวของเปลือกโลกทั่ว#nเกเฮนน่ากับคลังข้อมูลธรณีวิทยาของชาเล่ต์ค่ะ แสดงแนวความร้อนใต้พิภพขนาดใหญ่ และมีความ#nเคลื่อนไหวสูงที่สุดในเขตปกครองตนเองเกเฮนน่า โดยระบุจุดใหญ่ไว้ 14 แห่ง จุดย่อยอีก 56 แห่งค่ะ"
211100-100 = "เอ่อ... นั่นหมายความว่ายังไงเหรอ... ฉันไม่ค่อยเข้าใจเรื่องพวกนั้นหรอก..."
211100-101 = "ให้พูดง่ายๆ ละก็ มันคือแผนที่ขุมทรัพย์ที่ระบุจุดที่สามารถขุดพบออนเซ็นได้ค่ะ"
211100-102 = ""
211100-104 = ""
211100-109 = ""
211100-110 = "แผนที่นี้ระบุแนวความร้อนใต้พิภพในเขตปกครองตนเองเกเฮนน่าที่มีโอกาสพบออนเซ็นค่ะ"
211100-111 = "แน่นอนว่าตำแหน่งที่ระบุในแผนที่เป็นเพียงส่วนน้อยมากเมื่อเทียบกับแนวความร้อนใต้พิภพทั้งหมด โดยคัดเลือกเฉพาะจุดที่หลีกเลี่ยงโครงข่ายไฟฟ้า รวมถึงแนวท่อประปาและท่อระบายน้ำของโครงสร้าง#nพื้นฐานของโรงเรียนอย่างแม่นยำแล้วค่ะ"
211100-112 = "เพราะงั้น แนวความร้อนใต้พิภพที่ระบุในแผนที่นี้ถึงได้กระจุกตัวอยู่บริเวณรอบนอกเขตเมือง และการพัฒนานิคมออนเซ็นขนาดใหญ่ก็จะนำไปสู่รายได้ของเขตปกครองตนเองเกเฮนน่าได้#nโดยตรงค่ะ"
211100-113 = "[s] \"ที่มาขอข้อมูลจากครูคราวก่อน ก็เพื่อทำแผนที่นี้สินะ\""
211100-114 = "ค่ะ ถ้ามีข้อมูลที่หลากหลายกว่านี้ก็คงดี แต่สำหรับควบคุมชมรมพัฒนาออนเซ็นในเบื้องต้น ข้อมูลเท่านี้ก็น่าจะเพียงพอค่ะ"
211100-115 = "และแผนที่นี้จะต้องส่งมอบให้ชิโมคุระ เมกุค่ะ"
211100-116 = ""
211100-119 = "ค่ะ คุณครูอาจจะสงสัยสินะคะ ก็หัวหน้าชมรมพัฒนาออนเซ็นคือคินุกาวะ คาสุมินี่คะ"
211100-120 = "และเธอคนนั้นก็ไม่มีทางทำตามที่ฉันต้องการเด็ดขาดค่ะ ต่อให้คุณครูอยู่ด้วยก็ตาม"
211100-121 = "ถ้าเป็นคำขอส่วนตัวของคุณครูก็อาจจะต่างออกไป แต่เรื่องนี้ไม่ใช่กรณีนั้น เธอคงมองออกทันทีค่ะ"
211100-122 = "เพราะอย่างนั้น เราถึงต้องมอบแผนที่นี้ให้เมกุโดยตรงค่ะ"
211100-123 = "เพราะว่าคินุกาวะ คาสุมิจะทำตามเจตจำนงของชิโมคุระ เมกุค่ะ"
211100-124 = "พูดให้ถูกต้องก็คือ เธอรับบทบาทหัวหน้าชมรมพัฒนาออนเซ็น เพื่อทำให้ความปรารถนาของเมกุ#nเป็นจริงค่ะ"
211100-125 = "[s] \"ไปรู้เรื่องแบบนั้นมาได้ยังไง...?\""
211100-126 = "ถ้ามีความมุ่งมั่นและเป้าหมายที่ชัดเจนมากพอ ก็รู้อะไรได้หลายอย่างค่ะ"
211100-127 = "ออกนอกเรื่องไปหน่อย แต่สรุปแล้ว พวกเราต้องหาจังหวะที่ชิโมคุระ เมกุอยู่ตามลำพังค่ะ"
211100-130 = "ว้าว จริงเหรอ? แค่มีสิ่งนี้ก็สร้างออนเซ็นได้ดีๆ หลายแห่งตามใจเลยสินะ?!"
211100-131 = "ใช่ค่ะ เพราะระบุไว้เฉพาะจุดที่คัดเลือกมาอย่างพิถีพิถัน ก็เลยไม่ต้องกังวลว่าจะถูกคณะกรรมการวินัย#nไล่ตามด้วยค่ะ"
211100-132 = "เป็นข่าวดีเลยนะ! หัวหน้าคาสุมิของเรากลัวประธานกรรมการวินัยมากๆ เลยน่ะ!"
211100-133 = "อ๊ะ! แต่ถ้าจะทำตามนี้ ฉันต้องถามหัวหน้าคาสุมิก่อนนะ"
211100-134 = "ชมรมของเราทำทุกอย่างตามแผนที่หัวหน้าคาสุมิวางไว้น่ะ!"
211100-135 = "ไม่ต้องหรอกค่ะ"
211100-136 = "หืม?"
211100-137 = ""
211100-139 = ""
211100-141 = "สิ่งสำคัญคือเจตจำนงของคุณ หรือก็คือ 'ชิโมคุระ เมกุอยากทำหรือไม่อยากทำ' ค่ะ"
211100-142 = "ยะ... อย่างนั้นเหรอ?"
211100-143 = "ค่ะ เพราะในการตัดสินใจทุกอย่างของชมรมพัฒนาออนเซ็น เจตจำนงของเมกุคือสิ่งที่สำคัญสูงสุดค่ะ"
211100-144 = "คุณครูก็ช่วยพูดอะไรสักคำได้มั้ยคะ? ความไว้วางใจที่คุณเมกุมีต่อคุณครูนั้นสูงจนไม่อาจคำนวณ#nออกมาเป็นตัวเลขได้เลยค่ะ"
211100-145 = "อะ... อึก..."
211100-147 = "(ครูรู้สึกตงิดใจอยู่แปลกๆ...)"
211100-148 = "(แต่ก็จริงที่ว่าถ้าพัฒนาออนเซ็นเฉพาะในพื้นที่ที่กำหนดไว้ ก็จะช่วยลดความเสียหายลงได้มาก)"
211100-149 = ""
211100-150 = "[ns] \"เมกุชอบการพัฒนาออนเซ็นใช่มั้ย...?\""
211100-151 = ""
211100-153 = ""
211100-154 = "อื้อ! ชอบมากๆ เลย! ชอบพอๆ กับราเม็ง... ไม่สิ ชอบถึงขั้นอดราเม็งได้เลยละ!"
211100-155 = "[s5] \"ถ้างั้น ลองพัฒนาตามจุดต่างๆ ในแผนที่นั้นดูมั้ย?\"\n[s6] \"ได้ยินว่าออนเซ็นในแผนที่คุณภาพดีกว่าที่อื่นนะ\""
211100-158 = "ฮิฮิ ถ้าเป็นคำพูดของคุณครูก็ไม่ผิดแน่นอน!"
211100-159 = "อื้มๆ! งั้นฉันจะไปบอกหัวหน้าคาสุมิว่าให้มาขุดที่พวกนี้นะ!"
211100-160 = "ต้องพัฒนาเฉพาะที่ที่อยู่ในแผนที่เท่านั้นนะคะ"
211100-161 = ""
211100-163 = ""
211100-164 = "อ๊ะ... เป็นอย่างนั้นเหรอ?"
211100-165 = "ค่ะ เพราะแผนที่นี้มอบให้โดยมีเงื่อนไขห้ามพัฒนาออนเซ็นที่อื่นค่ะ"
211100-166 = "เอาเถอะ ช่วยไม่ได้สินะ! แค่ในแผนที่นี้ก็มีที่ให้ขุดเยอะมากแล้ว! เข้าใจแล้ว!"
211100-167 = "ดีมากค่ะ งั้นรบกวนบอกหัวหน้าคาสุมิไปตามนั้นด้วยนะคะ"
211100-168 = "ฮิฮิ ฉันต่างหากที่ต้องขอบคุณ! ให้แผนที่ล้ำค่ามาขนาดนี้ โชโกะเป็นคนดีจังเลยนะ!"
211100-169 = "..."
211100-170 = "งั้นฉันไปหาหัวหน้าคาสุมิก่อนนะ! หัวหน้าต้องดีใจแน่ๆ เลย~!"
211100-171 = "บ๊ายบาย! เจอกันใหม่นะ! คุณครูด้วย!"
211100-172 = ""
211100-174 = ""
211100-175 = "ง่ายจังเลยนะคะ"
211100-176 = "ถึงจะไม่รู้ว่าหัวหน้าชมรมพัฒนาออนเซ็นจะมีท่าทียังไง แต่สุดท้ายเธอก็คงไม่ฝืนเจตจำนงของเมกุ#nหรอกค่ะ"
211100-177 = "อย่างที่บอกไป แรงผลักดันสำคัญที่สุดของคินุกาวะ คาสุมิในตอนนี้ คือการทำให้ความปรารถนาของ#nชิโมคุระ เมกุเป็นจริงค่ะ"
211100-178 = ""
211100-180 = ""
211100-181 = "สีหน้าดูไม่ค่อยดีเลยนะคะ คุณครู"
211100-182 = "[s] \"ไม่รู้ทำไม... แต่รู้สึกผิดขึ้นมาน่ะ\""
211100-183 = "..."
211100-184 = "พวกเราไม่ได้โกหกเธอค่ะ ไม่ได้หลอกลวงด้วย"
211100-185 = "เพียงแต่ส่งข้อมูลที่คัดสรรแล้วให้คนที่คัดสรรแล้วเท่านั้นค่ะ"
211100-186 = "ถ้าดำเนินไปตามนี้ ก็ไม่มีฝ่ายไหนเสียประโยชน์ค่ะ"
211100-187 = "ชมรมพัฒนาออนเซ็นก็ได้สร้างออนเซ็น ส่วนเกเฮนน่าก็สามารถควบคุมปัจจัยที่ไม่แน่นอน พร้อมส่งกำลังคนด้านวิศวกรรมโยธาที่มีความชำนาญไปยังพื้นที่ที่ต้องการได้ค่ะ"
211100-188 = "คุณครูเหมือนจะเข้าใจอะไรบางอย่างผิดไปนะคะ ฉันไม่ได้ปฏิเสธอิสรภาพของนักเรียนแต่ละคนค่ะ..."
211100-191 = "ถ้ามองจากสิ่งที่พวกเราทำมาจนถึงตอนนี้ อาจรู้สึกแปลกใจก็ได้ค่ะ ซึ่งก็เป็นเรื่องธรรมดา"
211100-192 = "เพียงแค่อยากยิงอะไรบางอย่าง อยากกินอะไรสักอย่าง การกระทำเหล่านี้ไม่ใช่อิสรภาพ แต่เป็นเพียงแรงกระตุ้นเท่านั้นค่ะ"
211100-193 = "พวกเราไม่อาจปล่อยให้นักเรียนเกเฮนน่าใช้ชีวิตเป็นทาสของสัญชาตญาณหรือแรงกระตุ้นเหมือนที่#nผ่านมาได้"
