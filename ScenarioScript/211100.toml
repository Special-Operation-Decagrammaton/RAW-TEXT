[translation]
211100-1 = "第10話;協商……？"
211100-2 = "格黑娜再興委員會"
211100-3 = ""
211100-4 = "那麼，進入下一項議題。"
211100-5 = "大家應該都還記得上次跟美食研究會協商的經過吧。"
211100-6 = ""
211100-8 = ""
211100-10 = ""
211100-11 = "啊，嗯……讓我確定了他們根本管控不了。"
211100-12 = "感覺根本講不通。"
211100-14 = "是的。除非另想辦法，否則他們今後也會一直是格黑娜的不確定因素。"
211100-15 = "除此之外……"
211100-16 = ""
211100-19 = ""
211100-21 = "格黑娜還有另一個不確定因素。"
211100-22 = ""
211100-25 = ""
211100-26 = "啊，我好像知道了……！"
211100-27 = "答對了！溫泉開發部！"
211100-28 = ""
211100-30 = ""
211100-31 = "啊！被搶先了～！"
211100-33 = "是的，沒錯。他們是和美食研究會並稱兩大恐怖組織的團體。"
211100-34 = "他們無論在物理上還是象徵意義上，都在侵蝕我們想建立的偉大格黑娜的根基。"
211100-36 = "你打算怎麼處理那裡？感覺他們比美食研還不聽話耶……"
211100-37 = "翔子醬，這次也有什麼計畫嗎？"
211100-39 = "溫泉開發部以成員間深厚的信任聞名。#n這是他們作為團體的一大強項。"
211100-40 = "而那同時也是他們的弱點。"
211100-41 = ""
211100-44 = ""
211100-48 = "[ns] 「所以才找我來啊。」"
211100-49 = "是的，老師。"
211100-50 = "我認為要說服溫泉開發部，老師是不可或缺的存在。"
211100-51 = "[s1] 「雖然我也沒什麼把握……」\n[s2] 「先去一趟看看吧？」"
211100-54 = "好的。聽說這附近有一座溫泉開發部最近剛完工的溫泉。"
211100-63 = ""
211100-66 = "咦？這裡是還沒開幕的溫泉耶！已經有人來了？"
211100-67 = ""
211100-70 = ""
211100-72 = ""
211100-73 = "啊，老師？"
211100-74 = "哇～！你怎麼知道我在這裡？老師也聞到溫泉的味道了嗎？"
211100-75 = "[s3] 「你好，惠。」\n[s4] 「今天只有你一個人啊。」"
211100-78 = "嗯！這裡的工作都做完了，所以我讓部員們都去休息了！"
211100-79 = "啊，還有佳澄部長現在去別的工地了！"
211100-80 = "……果然不出所料呢。"
211100-81 = "那你是誰啊？我是惠！是溫泉開發部的……"
211100-82 = "作業班長，同時也是前任部長吧。"
211100-83 = "哇，你居然知道。"
211100-84 = "幸會，惠班長。我是格黑娜再興委員會的書記，五十嵐翔子。"
211100-85 = "很高興認識你，翔子！請多指教！"
211100-86 = "好的，那麼我們就進入正題吧。"
211100-87 = ""
211100-89 = ""
211100-91 = "今天我和老師之所以來找惠班長，是為了送給溫泉開發部一份珍貴的禮物。"
211100-92 = ""
211100-94 = ""
211100-95 = "哇！是什麼禮物？"
211100-96 = ""
211100-98 = ""
211100-99 = "這是比對格黑娜全區地殼變動數據，以及夏萊地質檔案後完成的深層地溫梯度圖。#n上面標示了格黑娜自治區內最大、最活躍的地脈。大的有14處，小的則有56處。"
211100-100 = "呃……這是什麼意思啊……我對這種東西不太懂……"
211100-101 = "簡單來說，就是標示出能挖到溫泉之處的藏寶圖。"
211100-102 = ""
211100-104 = ""
211100-109 = ""
211100-110 = "這張地圖上，標示了格黑娜自治區內可能湧出溫泉的地脈。"
211100-111 = "當然地圖上標示的，跟整體地脈比起來只是極少的一部分。#n而且只挑選了能巧妙避開學園基礎設施電網與上下水道管線的地點。"
211100-112 = "因此，這張地圖上標示的地脈集中在都市外圍。#n只要打造大規模的溫泉區，就能直接為格黑娜自治區帶來收益吧。"
211100-113 = "[s] 「上次你要我提供的資料，原來是為了做這張地圖啊。」"
211100-114 = "是的。雖然有更多樣的資料會更好，#n但如果只是要管控溫泉開發部，這樣應該就足夠了。"
211100-115 = "還有，這張地圖一定要交給下倉惠。"
211100-116 = ""
211100-119 = "是的，您或許會覺得奇怪吧。#n畢竟溫泉開發部的部長是鬼怒川佳澄。"
211100-120 = "而且他絕對不會照我的意思行動。#n就算有老師在場也一樣。"
211100-121 = "如果是老師個人的請託倒還另當別論，#n但這件事與那差得很遠，他應該很快就會察覺吧。"
211100-122 = "正因如此，這張地圖必須直接交給惠才行。"
211100-123 = "因為鬼怒川佳澄是依照下倉惠的意志在行動的。"
211100-124 = "準確來說，他是為了實現惠的願望，才擔任溫泉開發部部長的。"
211100-125 = "[s] 「……那種事你是怎麼知道的？」"
211100-126 = "只要有足夠的執念與目的意識，就能知道很多事。"
211100-127 = "話題扯遠了。#n結論就是，我們得找出下倉惠落單的時機才行。"
211100-130 = "哇，真的嗎？只要有這個，就能盡情做出好幾座超棒的溫泉了吧！？"
211100-131 = "當然。而且上面只記載了特別精選的地點，不必擔心會被風紀委員會追趕。"
211100-132 = "這是好消息耶！我們佳澄部長真的真的超怕風紀委員長的！"
211100-133 = "啊！可是要照這個做的話，得先問問佳澄部長才行。"
211100-134 = "因為我們部裡全都是照佳澄部長的計畫在行動的！"
211100-135 = "不對。"
211100-136 = "嗯？"
211100-137 = ""
211100-139 = ""
211100-141 = "重要的是你的意願。也就是「下倉惠想不想做」。"
211100-142 = "是，是這樣嗎？"
211100-143 = "是的。因為在溫泉開發部的所有行動準則中，那是最優先的價值。"
211100-144 = "老師也能幫忙說句話嗎？#n惠同學對老師的信任，可是無法用數值估算的。"
211100-145 = "嗚，嗚嗚……"
211100-147 = "（總覺得有點不太對勁……）"
211100-148 = "（不過如果只開發指定的地方，能減少許多損害也是事實）"
211100-149 = ""
211100-150 = "[ns] 「……惠喜歡溫泉開發吧？」"
211100-151 = ""
211100-153 = ""
211100-154 = "嗯！超喜歡！就跟拉麵一樣……不對，是喜歡到可以忍住不吃拉麵的程度！"
211100-155 = "[s5] 「那麼，試著開發那張地圖上的地點如何？」\n[s6] 「聽說地圖上的溫泉比其他地方的品質更好。」"
211100-158 = "耶嘿嘿，既然是老師說的，那一定沒錯！"
211100-159 = "嗯嗯！那我去跟佳澄部長說，要挖這上面的地點！"
211100-160 = "請務必只開發地圖上的地點。"
211100-161 = ""
211100-163 = ""
211100-164 = "啊……是這樣嗎？"
211100-165 = "是的。因為這張地圖是以禁止在其他地方開發溫泉為條件交給你們的。"
211100-166 = "好吧，既然這樣也沒辦法！#n反正光是這裡就有很多地方能挖了嘛！我知道了！"
211100-167 = "很好。那就麻煩你直接這樣轉達給佳澄部長了。"
211100-168 = "耶嘿嘿，該道謝的是我才對！竟然給我這麼珍貴的地圖，翔子真是個好人呢！"
211100-169 = "……"
211100-170 = "那我去找佳澄部長了！部長一定也會很開心的～！"
211100-171 = "掰掰！下次見！老師也是！"
211100-172 = ""
211100-174 = ""
211100-175 = "真簡單呢。"
211100-176 = "雖然不知道溫泉開發部長會有什麼反應，但他終究不會違抗惠的。"
211100-177 = "誠如我先前所說，鬼怒川佳澄現在最大的行動動機，就是實現下倉惠的願望。"
211100-178 = ""
211100-180 = ""
211100-181 = "您的表情不太好看呢，老師。"
211100-182 = "[s] 「總覺得……有點罪惡感。」"
211100-183 = "……"
211100-184 = "我們並沒有對他說謊，也沒有欺騙他。"
211100-185 = "只是把篩選過的情報，傳達給篩選過的人而已。"
211100-186 = "只要照這樣進行下去，任何一方都不會吃虧。"
211100-187 = "溫泉開發部能建造溫泉，而格黑娜則能抑制不確定因素──#n同時還能將熟練的土木建築人力投入到想要的位置。"
211100-188 = "……老師您似乎有所誤會，我並不否定學生個人的自由。"
211100-191 = "從我們至今做過的事來看，或許會覺得意外吧。這也是理所當然的。"
211100-192 = "只是想射擊什麼、只是想吃什麼。#n因為這些行為不是自由，只不過是衝動罷了。"
211100-193 = "我們不能像過去那樣，放任格黑娜學生們淪為本能或衝動的奴隸。"
211100-196 = "而且，我只是認為比個人自由更高層次的價值，是對共同體的參與。#n因為自由是在集體中完成的。"
211100-197 = "[s] 「對於這點，每個人的想法或許都有些不同。」"
211100-198 = "是的，應該是吧。這點我也很清楚。"
211100-201 = "（和翔子一起下了山）"
211100-206 = ""
211100-208 = "哈～哈哈哈哈！沒錯，我就知道你們會往這邊走！"
211100-209 = "[ns] 「這個聲音是……」"
211100-210 = ""
211100-213 = ""
211100-214 = "哎呀，聽到消息之後，我就急忙趕過來了呢。"
211100-215 = ""
211100-217 = ""
211100-219 = "溫泉開發部長，鬼怒川佳澄。"
211100-220 = "啊啊～沒錯。就是你從一開始就刻意排除在外的那個佳澄。"
211100-221 = "哼……"
211100-222 = "需要我自我介紹嗎？"
211100-223 = "當然，當然！#n好久沒遇到這麼讓我不爽的人了，怎麼可能不好奇對方的名字呢？"
211100-224 = "我是格黑娜再興委員會的書記，五十嵐翔子。"
211100-225 = "原來如此，是叫這個名字啊～嗯～"
211100-226 = "……"
211100-227 = "啊，剛剛一時分心，都忘了跟旁邊的老師打招呼。#n你好啊，老師！"
211100-228 = "[s] 「你好，佳澄……」"
211100-229 = "啊啊～不用露出那麼抱歉的表情啦。#n哈～哈哈哈！老師果然很溫柔呢。"
211100-230 = "別擔心。我早就看出來這是旁邊那個什麼「翔尺醬」還是什麼的人策劃的了！"
211100-231 = "我是五十嵐翔子。"
211100-232 = "這樣啊～「翔芷醬」。#n或許總有一天能好好叫對你的名字吧……會有那天嗎？我也不知道呢？"
211100-233 = "話說，你刻意接近我們的惠班長，還把這種地圖當成禮物送給他。"
211100-234 = "在我看來，這怎麼看都是張相當扭曲的地圖呢？"
211100-235 = "……"
211100-236 = "如果說得更準確一點……#n想要控制我們的意圖，好像從地圖背後一點～一點地滲出來了哦？"
211100-237 = "「你們別惹事，去挖這邊就好。喜歡溫泉吧？那裡有溫泉。」……大概是這種感覺？"
211100-238 = "嗯？那種意思也太明顯了吧？#n被看扁到這種程度，我怎麼能不親自來見個面呢？"
211100-239 = "所以呢？"
211100-240 = "……"
211100-241 = "嗯？"
211100-242 = "所以，你的意思是不做嗎？"
211100-243 = "……"
211100-244 = "哈～哈哈哈！哎呀～這可真是！真的好久沒有這種感覺了！"
211100-245 = "當然！我會照做的。這張地圖上的地點我都會挖。你知道為什麼嗎？"
211100-246 = "因為下倉惠說想做吧。"
211100-247 = "哈哈……沒錯。"
211100-248 = "就像你排除我接近惠時所想的那樣，這次我就假裝被你騙吧。"
211100-249 = ""
211100-251 = ""
211100-252 = ""
211100-254 = "不過有件事你最好給我記住。"
211100-255 = "沒有「下次」了。懂了嗎？"
211100-256 = "嗯，隨你高興。不然就回「那裡」去吧。"
211100-257 = "……什麼？"
211100-258 = ""
211100-260 = ""
211100-262 = ""
211100-263 = "就是字面上的意思。"
211100-264 = "[s] （那裡……？）"
211100-265 = "……哈哈。那種拙劣的虛張聲勢，你是從哪裡學來的？"
211100-266 = "至少可以確定不是從「我們這邊」學的。因為會那樣說話的小鬼都活不下來。"
211100-267 = "如果沒有其他事要說……"
211100-268 = "回去的路上請多加小心。"
211100-269 = ""
211100-271 = ""
211100-272 = "……"
211100-273 = "哈～哈哈哈！有意思。你真有意思。我欣賞你。"
211100-274 = "下次再見吧。嗯？懂了嗎？一定要再見面哦！"
211100-275 = "哈哈，老師也是！"
211100-276 = "[s] 「佳澄……」"
211100-277 = ""
211100-279 = ""
211100-280 = ""
211100-283 = "呼……"
211100-284 = "果然先從下倉惠下手是正確的判斷。"
211100-285 = "這樣一來，格黑娜最大的不確定因素之一就被排除了。#n雖然只是暫時的。"
211100-286 = "無論如何，可以說是朝著偉大的格黑娜又前進了一步。"
211100-287 = "所有人望向同一處的理想社會，同心協力、團結一致的格黑娜已經不遠了。"
211100-288 = "[s] 「……」"
211100-289 = "……"
211100-290 = "老師您……"
211100-291 = "認為我的方式是錯的嗎？"
211100-292 = ""
211100-295 = "[ns7] 「我也不太清楚什麼才是對的……」\n[ns8] 「但我希望翔子不要把自己逼得太緊。」"
211100-296 = ""
211100-297 = ""
211100-299 = ""
211100-300 = "您說我把自己逼得太緊？看起來是那樣嗎？"
211100-301 = "[s9] 「非做不可、一定要做。」\n[s10] 「那種心態很快就會讓自己疲憊不堪。」"
211100-302 = ""
211100-303 = ""
211100-305 = ""
211100-306 = "……"
211100-307 = "…………"
211100-308 = ""
211100-310 = ""
211100-311 = "[ns] 「翔子？」"
211100-312 = ""
211100-319 = ""
211100-320 = "（追上了快步走遠的翔子）"
211100-321 = "……有點受打擊呢。竟然被看成那樣。"
211100-322 = "我看起來不像是個懷著堅定意志、勇往直前的那種了不起的人物嗎？"
211100-323 = "[s] 「該說看起來有點危險嗎……」"
211100-324 = "是嗎……"
211100-325 = "[s] 「翔子想成為那樣的人嗎？」"
211100-326 = "該說是想成為呢……還是想看看呢……"
211100-327 = "老師見過嗎？能毫不猶豫地做出正確決定，毫無懷疑地向前邁進的那種人。"
211100-328 = ""
211100-330 = ""
211100-331 = "您是說，想成為那種人的倒是見過很多？"
211100-332 = "無論多麼了不起的人，若不懷疑自己，最終都會變得獨斷……？"
211100-333 = "……"
211100-334 = "誰知道呢。說不定某處真的有那樣的人。"
211100-335 = ""
211100-337 = ""
211100-338 = ""
211100-339 = "不，或許是曾經有過。"
211100-341 = "（和翔子一起默默走在回程的路上）"
211100-343 = "下一話;陌生的和平"
