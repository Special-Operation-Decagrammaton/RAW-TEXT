211100-98 = "3;쇼코;01\n#3;greeting\n#3;h\n#3;closeup\n#wait;1300"
211100-99 = "3;쇼코;02;게헨나 전역의 지각 변동 데이터와 샬레의 지질 아카이브를 대조하여 완성한 심층 지열 구배도입니다. 게헨나 자치구에 존재하는 가장 크고 활발한 지맥들을 나타낸 지도로, 크게는 14개, 자잘하게는 56곳의 포인트가 표시되어 있습니다.\n#3;closeup"
211100-100 = "3;메구;04;어…… 그게 무슨 말일까나…… 나는 그런 거 잘 모르는데……\n#3;em;[땀]\n#3;closeup"
211100-101 = "3;쇼코;99;간단히 말해서, 온천을 파낼 수 있는 곳이 표시된 보물 지도입니다."
