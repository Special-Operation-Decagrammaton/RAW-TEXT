[translation]
1600803-1 = "게으른 경찰의 순찰"
1600803-2 = "(의욕 없는 후부키를 응원하기 위해 시내 중심가로 마중을 나왔다.)"
1600803-8 = "으으, 으으으……."
1600803-9 = "더워, 귀찮아, 괴로워…… 돌아가고 싶어……."
1600803-10 = "이런 쓸데없는 일은 그만두고, 시원한 사무실로 돌아가서 도넛이랑 커피를 먹고 싶어……."
1600803-11 = "[s1] \"쓸데없는 일이라니…….\"\n[s2] \"순찰도 발키리 경찰학교의 임무 중 하나잖아?\""
1600803-12 = "하지만 오늘 순찰을 나온 이 일대는 쓸데없이 넓은 데다가, 골목길도 미로처럼 복잡한걸."
1600803-13 = "하지만 오늘 순찰을 나온 이 일대는 쓸데없이 넓은 데다가, 골목길도 미로처럼 복잡한걸."
1600803-14 = "빠짐없이 골목을 구석구석 돌아다니려면 한나절이 걸려도 어려울 거야……."
1600803-15 = "[s] \"내가 곁에서 도와줄 테니까 기운 내.\""
1600803-16 = "……정말? 그럼 선생에게 부탁 하나만 해도 될까?"
1600803-17 = "여기가 대로변의 1번가니까…… 5번가까지 이어진 골목을 선생님이 먼저 순찰해 줘."
1600803-18 = "아, 그리고 맞은편의 대로 순찰도 같이 부탁할게."
1600803-19 = "[s] \"그동안 후부키는 무얼 하려고?\""
1600803-20 = "응? 나 말이야? 나는……"
1600803-21 = "여기 카페에 앉아서 커피를 마시면서 수상한 사람이 지나가지 않는지 감시할게!"
1600803-22 = "[s] \"나에게 전부 떠넘기는 거잖아…….\""
1600803-23 = "……칫, 역시 안 속나."
1600803-24 = "하는 수 없지. 선생도 모처럼 휴일을 반납하고 나와주었으니, 이번만큼은 성실하게 순찰을 하도록 할까."
1600803-25 = "부디 내가 맡은 순찰 구역에서 귀찮은 사건이 벌어지지 않기를……."
1600803-29 = "으으, 정말 가기 싫다……."
1600803-35 = "……이 골목도 세이프. 여기도 별일 없이 평화롭네."
1600803-36 = "키보토스가 이렇게나 평화로운데 높으신 분들은 왜 그렇게 매번 호들갑인지 모르겠어."
1600803-37 = "세상에 불량 학생이 넘쳐나는 것처럼 보이는 것도, 싸움이 끊이지 않는 것처럼 보이는 것도, 다 마음의 여유가 없어서 그렇게 보이는 거라고—"
1600803-41 = "응? 선생, 왜 갑자기 길 한가운데에 멈춰 선 거야? 무슨 문제라도 있어?"
1600803-42 = "[s] \"저쪽 골목에 수상해 보이는 학생들이 있어.\""
1600803-46 = "아앙? 누가 누구더러 수상하다는 거야?"
1600803-47 = "잘 알지도 못하면서 멋대로 지껄이기는……."
1600803-48 = "다치기 싫으면 여기서 썩 꺼져!"
1600803-53 = "(윽…… 귀찮아 보이는 사건의 냄새가……)"
1600803-54 = "하하…… 말투가 약간 과격한 학생들이네."
1600803-55 = "하지만 내가 보기엔 전혀 수상해 보이지 않는걸?"
1600803-56 = "봐, 평범하게 후미진 골목길에서 친구들과 놀고 있는 것뿐이야."
1600803-57 = "우리는 신경 쓰지 말고 순찰을 계속하자."
1600803-58 = "[s] \"입에 뭔가 수상한 막대를 물고 있는데?\""
1600803-59 = "……수, 수상한 막대? 아. 분명 저건……"
1600803-60 = "사탕! 사탕일 거야."
1600803-61 = "이 나이 때 여학생들은 단 걸 쉽게 끊지 못하는 법이니까…… 친구들끼리 골목길에 모여 사이좋게 사탕을 나누어 먹을 수도 있지!"
1600803-62 = "자자, 귀찮게 방해하지 말고 우리는 어서 가자!"
1600803-63 = "[s] \"막대 끝에서 연기도 나는데…….\""
1600803-64 = "그건……"
1600803-65 = "사탕이 너무 맛있었나 보지!"
1600803-66 = "가끔씩 사탕이 너무 맛있어서 마구 핥아대면 마찰열로 연기가 나기도 하잖아?"
1600803-67 = "응, 분명 그럴 거야! 틀림없고말고."
1600803-68 = "[s] \"하지만……\""
1600803-69 = "왜 계속 신경을 쓰는 거야? 수상한 학생이 절대 아니라니까!"
1600803-70 = "사람을 외모만으로 속단하고 의심하는 건 좋지 못해. 편견을 갖기 시작하면 길가에 굴러다니는 돌멩이도 수상해 보이는 법이라고!"
1600803-76 = "너…… 정말 우리가 수상하지 않다고 생각하는 거야?"
1600803-77 = "다, 당연하지! 나는 너희가 조금도 수상하지 않아."
1600803-78 = "그러니까 귀찮게 시간을 내서 불심검문을 할 필요도 없고, 임의동행을 부탁할 필요도 전혀 없어!"
1600803-79 = "이럴 수가. 우리를 의심하지 않고 이렇게 상냥하게 대해준 건 네가 처음이야……."
1600803-80 = "그동안 발키리 경찰학교에는 의심병에 걸린 머저리들만 있다고 생각했는데……."
1600803-81 = "진지하게 우리의 진심을 헤아려 주다니…… 큭, 감동했어!"
1600803-82 = "어, 어라? 갑자기 왜 그러는 거야?"
1600803-86 = "그동안 사람들은 우리가 무얼 하는지 알아보려고 하지도 않고 무조건 비난만 했거든."
1600803-87 = "그러다 보니 자꾸 반발심리로 더욱 삐뚤어진 행동을 하게 되어서……."
1600803-88 = "하지만 네 말을 듣고 떠올렸어. 우리도 원래부터 불량하지는 않았다는 것을!"
1600803-89 = "우리도 너처럼 사회에 도움이 되는 좋은 일을 하고 싶어!"
1600803-94 = "하, 하하…… 그거 좋은 일이네."
1600803-95 = "그럼 길가에 떨어져 있는 쓰레기라도 줍는 게 어떨까? 나는 순찰이 바빠서……."
1600803-97 = "순찰이 바쁘다고? 그럼 우리가 도와줄게!"
1600803-99 = "그래, 이 주변의 골목길이라면 우리가 제일 잘 알고 있으니까!"
1600803-101 = "놓치는 길목 없이 구석구석 꼼꼼하게 순찰을 하자고!"
1600803-102 = "[s3] \"대단하네, 후부키.\"\n[s4] \"불량스러워 보이는 학생들을 말만으로 설득했어!\""
1600803-103 = "으윽…… 뭔가 더 귀찮아진 것 같은데……."
1600803-104 = "으윽…… 뭔가 더 귀찮아진 것 같은데……."
1600803-106 = "(이후, 후부키는 불량 학생들에게 억지로 떠밀려 성실하게 골목을 순찰했다.)"
1600803-107 = "(의욕 넘치는 불량 학생들 덕분에 순찰은 밤이 되도록 끝나지 않았다…….)"
