[translation]
1002502-1 = "작다는 건 편리해!"
1002502-2 = "카페 <밀피유>"
1002502-3 = "여기 '기간 한정 럼 레이즌 파르페' 하나 주세요!"
1002502-4 = "[s1] \"……파르페?\"\n[s2] \"어린아이가 되면 꼭 먹어보고 싶다는 게, 파르페였어?\""
1002502-5 = "단순한 파르페가 아녜요. 기간 한정, '럼 레이즌 파르페' 라고요!"
1002502-6 = "단순한 파르페가 아녜요. 기간 한정, '럼 레이즌 파르페' 라고요!"
1002502-7 = "이곳 카페 <밀피유>에서는 여러가지 맛있는 파르페를 상시 판매하고 있지만, 럼 레이즌 파르페만큼은 동절기에만 판매하는 기간 한정 메뉴에요."
1002502-8 = "럼에 절인 건포도 아이스크림은 더운 날에는 보관이 어려우니까요."
1002502-9 = "특히 이곳의 럼 레이즌은 질 좋은 건포도를 다크 럼에 숙성시켜서 엄청 호화스러운 맛이 난답니다!"
1002502-10 = "이 파르페의 유일한 단점이라면 한 사람 앞에 하나 밖에 팔지 않고, 그나마도 양이 너무 적어서 마음껏 먹을 수 없다는 점이었는데……."
1002502-11 = "어린아이의 몸이라면 같은 양을 먹어도 훨씬 배부르게 파르페를 즐길 수 있어요!"
1002502-12 = "[s] \"그런 방법이 있었나……!\""
1002502-13 = "후후, 전에 매화원 아이들에게 읽어준 동화에 비슷한 장면이 있었거든요."
1002502-14 = "거인들의 나라에 간 동화 속 주인공이 자신의 몸보다 커다란 케이크를 잔뜩 먹게 되는데……."
1002502-15 = "몸이 작아진 지금의 제게는 평범한 키보토스도 거인들의 왕국처럼 느껴진답니다."
1002502-16 = "그나저나 선생님은 어떤 파르페를 드실 건가요?"
1002502-17 = "저와 같이 기간 한정 럼 레이즌 파르페에 도전해 보시는 건 어떠신가요?"
1002502-18 = "[s] \"나는 가장 무난한 딸기 요거트 파르페로…….\""
1002502-19 = "네? 딸기 요거트 맛이요?"
1002502-20 = "물론 딸기 요거트도 달콤하니 나쁘진 않지만, 말차나 럼 레이즌의 중후한 맛에 비하면 조금 심심할텐데……."
1002502-21 = "후후, 선생님도 입맛에서는 어린아이 같은 구석이 있으시네요."
1002502-22 = "[s3] \"어른도 달콤한 걸 좋아하거든!\"\n[s4] \"어린아이 같은 입맛이 뭐가 나빠!\""
1002502-23 = "후후, 나쁘다는 뜻은 아녜요. 달콤한 딸기 파르페는 저도 좋아하거든요."
1002502-24 = "후후, 나쁘다는 뜻은 아녜요. 달콤한 딸기 파르페는 저도 좋아하거든요."
1002502-25 = "하지만 오늘은 모처럼의 기회니 기간 한정 메뉴를 잔뜩 즐길거예요."
1002502-26 = "빨리 나왔으면 좋겠네요~ 기간 한정 럼 레이즌 파르페~."
1002502-29 = "오래 기다리셨습니다. 주문하신 딸기 요거트 파르페와 기간 한정 럼 레이즌 파르페입니다."
1002502-30 = "어라? 점원 씨, 메뉴를 반대로 주셨어요."
1002502-31 = "딸기 요거트는 선생님이 주문한 메뉴이고, 제가 주문한 건 기간 한정 럼 레이즌 파르페인걸요?"
1002502-32 = "네? 하지만 이 파르페는 그 쪽의 꼬마 아가씨가 먹기에는 지나치게 어른스러운 맛이……."
1002502-33 = "(찌릿)……."
1002502-34 = "앗…… 시, 실례했습니다……."
1002502-35 = "부디 맛있게 즐겨주시길!"
1002502-39 = "……겉모습만 보고 입맛을 판단하다니, 이상한 점원이네요."
1002502-40 = "여하튼, 그럼 잘 먹겠습니다~."
1002502-46 = "……?!"
1002502-47 = "[s] \"왜 그래?\""
1002502-48 = "아, 아뇨. 너무 오랜만에 맛보는 음식이라서 그런가…… 조금 당황해서요."
1002502-49 = "그럼 다시 한 입……."
1002502-52 = "으으……."
1002502-53 = "[s] \"파르페에 무슨 문제라도 있어?\""
1002502-54 = "……아뇨, 파르페에는 아무 문제도 없어요."
1002502-55 = "레이즌의 은은한 단맛과 다크 럼의 진한 풍미…… 그동안 먹어왔던 기간한정 파르페의 맛과 변함이 없어요. 다만……."
1002502-56 = "몸이 어려진 탓인지, 럼 레이즌 특유의 풍미가 너무 독하게 느껴져서……."
1002502-57 = "[s] \"내 딸기 파르페와 바꿔줄까?\""
1002502-58 = "으음, 지금의 몸으로는 딸기 요거트 파르페가 더 당기긴 한데……."
1002502-59 = "안 돼요. 모처럼 한정 파르페를 배부르게 먹을 수 있는 기회인데, 여기서 포기할 수는 없어요."
1002502-60 = "그럼 다시 도전할게요!"
1002502-62 = "역시 못 먹겠어요……."
1002502-68 = "[ns] 메뉴를 바꾸어준다."
1002502-70 = "……감사합니다, 선생님."
1002502-72 = "(우물우물) ……."
1002502-74 = "역시 이 몸에는 단 음식이 최고네요!"
1002502-76 = "(이후, 슌이 어린 아이처럼 딸기 파르페를 맛있게 먹는 모습을 지켜보았다.)"
1002502-77 = "(슌에게서 받은 럼 레이즌 파르페에서는 중후한 어른의 맛이 났다…….)"
