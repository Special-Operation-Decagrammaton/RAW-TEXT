[translation]
1002906-1 = "쉬는 시간: 매점"
1002906-3 = "(나츠의 말대로 굉장히 화창하고 맑은 날씨였다.)"
1002906-4 = "(햇볕은 따듯하지만 덥지 않고, 바람은 시원하지만 강하지 않았다.)"
1002906-5 = "후후, 선생님. 이쪽이야, 이쪽."
1002906-6 = "이런 날에는 좋은 자리를 선점하려는 사람들이 많아지니 말이지."
1002906-7 = "일찍 와있는 게 중요하다고."
1002906-12 = "자, 자! 차린 건 없지만, 많이 드십시오~. 우유와 블루베리 파이입니다~."
1002906-13 = "[s1] \"우유와 블루베리 파이라. 맘에 들어.\"\n[s2] \"꽤 맛있어 보이는 조합이네\""
1002906-14 = "후후. 역시 선생님이야. 보는 눈이 있군."
1002906-15 = "후후. 역시 선생님이야. 보는 눈이 있군."
1002906-19 = "……흠."
1002906-20 = "[s3] \"……나츠?\"\n[s4] \"왜 그래?\""
1002906-21 = "아니. 그냥……."
1002906-22 = "아니. 그냥……."
1002906-23 = "이번에는 '무슨 일 있어?'같은 걸 따로 물어보지 않길래."
1002906-24 = "정말로 선생님은 얼굴만 봐도 일이 있는지 없는지 아는구나~. 싶어서. 신기해가지고."
1002906-25 = "오늘은 진짜 아무 일도 없었거든. 그냥 날씨도 좋고 해서 나와 본 거라……."
1002906-26 = "그때 불현듯, 그 생각이 든 거지!"
1002906-27 = "진짜 아무 일 없을 때 그냥 부르면 선생님은 어떻게 할까? 평소처럼 '무슨 일이야?'라면서 나올까?"
1002906-28 = "그런데 보낸 말만 듣고도 바로 피크닉이니 밖이니 했잖아?"
1002906-29 = "모모톡으로는 '좋아! 익숙해졌군!'이라고 썼지만 내심 놀라서 '와-.'라고 생각했거든."
1002906-30 = "흠……."
1002906-31 = "대체 무슨 차이일까."
1002906-32 = "어떻게 구분하는 걸까! 나를 감시하는 걸까? 아니면 독심술이라도 있는 걸까!"
1002906-33 = "……하하."
1002906-34 = "그래. 사실 그런 건 아무래도 상관없겠지. 중요한 건 선생님이랑 여기에 나란히 앉았다는 거고."
1002906-35 = "날씨도 좋고, 차려온 블루베리 파이와 우유도 생각만큼 맛있어서 만족스럽다는 거고."
1002906-36 = "모든 것이 좋은, 지금의 상황을 그저 그대로 받아들여 즐기는 것일 테니까."
1002906-37 = "……선생님은 어때?"
1002906-38 = "혹시 바쁜데 괜히 불러내서 귀찮게 한 것일까……?"
1002906-39 = "그건 좀 슬플 거 같은데."
1002906-40 = "[s5] \"전혀. 편안한 기분이야.\"\n[s6] \"아니. 이런 때 아니면 언제 이런 걸 해 보겠어?\""
1002906-41 = "하하하. 그거 든든한걸. 말만이라도 고마워라."
1002906-42 = "하하하. 그거 든든한걸. 말만이라도 고마워라."
1002906-43 = "뭐어-. 이렇게 아무 이유도 없이 불러내서 시간을 같이 보낼 수 있는 사람도 나한테는 별로 없으니까 말이지."
1002906-44 = "……흠."
1002906-48 = "……그만! 응. 이런 이야기는 여기까지! 진지해질 수 있는 말들은 전부 스톱이야"
1002906-49 = "그래서야 '그냥 피크닉'의 의미가 퇴색될 테니까. 쏘리, 쏘리. 잇츠 마이 미스테이크."
1002906-50 = "자, 그럼 그런 것으로 알고……."
1002906-51 = "지금부터 정말로 별거 없는, '그냥 피크닉'을 시작해볼까?"
1002906-57 = "넉넉하게 있으니 마음껏 드시라구~."
1002906-59 = "(나츠는 그렇게 말하며 먼저 블루베리 파이를 한 조각 집어 입으로 가져갔다.)"
1002906-60 = "(이후 나츠와 함께 블루베리 파이와 우유를 모두 나눠 먹은 뒤, 샬레로 돌아왔다.)"
