[translation]
103060-1 = "제6화;우트나피쉬팀의 배 1"
103060-6 = "……."
103060-7 = "헤에~ 여기가 전함의 브릿지인가 보네? 생각보다 제대로 되어 있잖아?"
103060-8 = "네. 전함의 모든 운용 정보를 컨트롤하는 오퍼레이션 룸인 것 같네요……."
103060-16 = "크크…… 이게 조종석이겠지? 다른 건 몰라도 이건 딱 보면 알겠어."
103060-17 = "컨트롤 오퍼레이션 룸 규모가 꽤 크네요? 어림잡아도 사람이 10명 이상 필요해 보이는데……."
103060-19 = "……전함 내부에만 그 정도고, 지상에서 항공관제를 맡아줘야 할 사람들도 고려해야겠죠."
103060-20 = "그, 그러네요…… 전차 하나를 운용하는데도 4~5명은 필요하니까…… 이 정도 전함이라면……."
103060-21 = "게다가 이건 우리가 이해할 수 없는 오파츠니까, 정보를 해석, 분석하고 이걸 조작할 수 있게 서포트하는 사람들은 많을수록 좋을 겁니다."
103060-26 = "사람들을 불러 모으죠. <샬레>의 학생들을요."
103060-27 = "전략 전술과 관리에 능숙한 학생들과, 기술자와 해커들…… 최대한 많이요."
103060-28 = "[s] \"응. 학생들을 소집할게.\""
103060-29 = "치 쨩, 듣고 있나요? 지금부터 엄청 바빠질 거라구요?"
103060-33 = "하아……. 지금 우리는 며칠째 쉬지도 못하고 있다는 걸 알아둬, 히마리."
103060-34 = "그나저나 우주전함이라니…… 그 녀석들이 알면 꽤 소란스러워지겠는데……."
103060-41 = "우!"
103060-42 = "주~"
103060-43 = "전!"
103060-44 = "함!"
103060-46 = "역시 신났군……."
103060-47 = "이게 진짜 전함인가요? 고대 기술로 빚어낸 역작인가요? 잘 모르겠지만 지금부터 차근차근 확인해가면 되겠죠?"
103060-48 = "역시 우주전함은 고대문명인 게 정석이지. 연구해 볼 만한 가치가 있어!"
103060-50 = "우리의 연구는 헛되지 않았어. 다들 전함이 뭐냐고 비웃었지만, 아리스, 너의 레일건이 그 증거야."
103060-52 = "그렇습니다! 대세는 우주인 것입니다! 이건 먹히는 장르입니다!"
103060-56 = "자, 잠깐만!?"
103060-57 = "아리스 쨩!? 왜 여기 있는 거야?!"
103060-58 = "네? 그치만 우주전함이 발견되었다길래 엔지니어부 여러분과 함께……."
103060-59 = "안 돼! 얌전히 밀레니엄에 있기로 했잖아! 아직 리오 회장이 어디 있는지도 모르는데!"
103060-60 = "여기 있다가 회장에게 해코지라도 당하면 어떡할 거야!"
103060-61 = "그, 그치만 우주 용사가……."
103060-62 = "이상한 소리 하지 말고 얌전히 밀레니엄으로 돌아가! 노아가 지금 비상시를 대비해서 학원을 방위하고 있으니까."
103060-64 = "뭐야, 이 냉혹한 계산의 요괴! 네가 우주 용사의 로망을 알아?"
103060-65 = "어, 언니……."
103060-66 = "뭔가 또 별명이 진화한 것 같은데……."
103060-72 = "유우카 쨩, 그런 거라면 그곳이 키보토스 그 어디보다 안전할 거예요."
103060-73 = "으응? 노아?"
103060-84 = "리오 회장은 모든 것을 통제하고 싶어 하니까요. 그런 회장에게 밀레니엄 자치구야말로 자기 손바닥 안이나 마찬가지일 거예요."
103060-85 = "그런가……?"
103060-86 = "네. 하지만 거기라면…… 아무리 회장이라도 모르는 장소일 테니까 안전할 거예요."
103060-87 = "그래서 아리스 쨩과 게임개발부를 같이 보냈으니까, 유우카 쨩이 잘 돌봐주면 문제없잖아요?"
103060-88 = "아니, 아니. 그래도 곤란해!"
103060-89 = "아리스 쨩을 노리는 녀석들은 회장 말고도 많으니까!"
103060-90 = "뭐 내가 있으니까 그래도 낫겠지만……"
103060-94 = "어, 어라?"
103060-100 = "아리스 쨩?! 어, 어딜 간 거야?!"
103060-102 = "후후, 그럼 잘 부탁드려요, 유우카 쨩. 너무 무리는 하지 마시고요."
103060-103 = "노아……."
103060-104 = "학원은 저희들이 지키고 있을 테니까 걱정하지 마시고요."
103060-109 = "하아…… 놀러 온 게 아닌데……. 정말……."
103060-113 = "흐음. 여기는 이런 구조인가……."
103060-114 = "배관과 배선은 생각보다 단순하네요? 하긴, 오파츠라고 해도 중력과 물리 법칙을 부정할 수는 없는 거겠죠?"
103060-115 = "베리타스가 지금 전함의 오퍼레이팅 시스템을 분석하고 있으니까, 우리도 이 전함에 대해 뭐든 좋으니 알아내는 거야."
103060-116 = "그렇군요! 그럼 여기 저기 뜯어보겠습니다!"
103060-118 = "응. 나는 그럼 이쪽을 살펴볼게."
103060-122 = "……신경 코드 알고리즘 분석 완료."
103060-123 = "접근해볼래, 코타마?"
103060-129 = "네, 중앙처리장치에 접속 성공했습니다. 잘 되네요."
103060-132 = "헤에~"
103060-133 = "부부장이 도와주니까 이런 것도 금방이네! 꽤 시간이 걸릴 줄 알았는데."
103060-139 = "이게 이 전함의 메인시스템……."
103060-140 = "응…… 낯선 언어이지만, 해석은 그런대로 가능할 것 같아."
103060-142 = "히마리, 접속하는 데 성공했어. 이제 그쪽으로 접속 알고리즘을 보낼 테니까, 확인해 줘."
103060-143 = "네, 고마워요, 치 쨩."
103060-147 = "어떤가요? 히마리 씨?"
103060-148 = "지금 전함 메인 시스템의 중추신경계에 접속했어요. 여기를 가장 먼저 파악해야 해요. 왜냐하면……."
103060-149 = "신경계의 구조를 파악하면 모든 기관의 가동 원리를 한눈에 이해할 수 있으니까요?"
103060-150 = "……네. 이해가 빠르시네요."
103060-155 = "그럼 어디 한번 볼까요? 고대의 기술로 만들어진 이 오파츠의 정체가 과연 뭔지……."
103060-161 = "……흐음."
103060-164 = "……전체 모습은 이렇군요."
103060-165 = "역시 배에 가까운 모양이네요. 그래서 우트나피쉬팀의 <배>라고 부르는 걸까요……?"
103060-166 = "총 제원 135m X 23m X 13m, 내부는 15개의 구역으로 나뉘어져 있지만 상세한 구조는 지금으로선 확인 불가능……."
103060-170 = "……모양은 둘째치고, 이 전함에는 무기라고 부를 만한 게 하나도 존재하지 않네요?"
103060-171 = "그럼 싸우기 위해 만들어진 게 아니라는 건가요……? 애초에 <전함>이 아니라 다른 무언가라는……?"
103060-172 = "……. 아직은 속단하긴 이르겠죠. 일단 조금 더 살펴봐야겠네요."
103060-178 = "흐음……."
103060-179 = "으응……."
103060-181 = "……."
103060-185 = "지금 키보토스에 나타난 적은 저의 인지 영역에도 없는 존재입니다."
103060-186 = "키보토스 외부에서 도래하는 적의 정체에 대해서는…… <이름 없는 신들>도, <잊혀진 신들>도 알지 못하겠죠."
103060-187 = "저 불가해한 적은…… 원래 저희들의 것인 <아트라하시스의 방주>의 능력을 똑같이 카피하고 있는 것 같습니다."
103060-188 = "……하지만 알고 계신가요, 왕녀여?"
103060-189 = "지금 당신이 서 있는 이 <오파츠>는, 과거 우리들의 적이 우리를 상대하기 위해 만든 <대방주용 결전병기>입니다."
103060-190 = "저들은 이것을 사용하는 방법을 영원히 알지 못하겠지만……"
103060-191 = "그렇습니다. 왕녀여, 당신은……"
103060-195 = "자신에게 가장 위험한 천적 위에 탑승하고 있는 것입니다."
103060-196 = "……. 여기서 벗어나세요. 왕녀여."
103060-197 = "당신이 저를 거부한 것은 알고 있습니다. 저의 존재를 부정한 것은 이해하고 있습니다."
103060-198 = "하지만 그래도 저는 당신을 마땅한 존재 목적으로 이끄는 당신의 시녀……."
103060-199 = "당신이 죽는 것을 원하지는 않습니다."
103060-200 = "……이 우트나피쉬팀에서 멀어지세요."
103060-201 = "이것이 기동을 시작하면 가장 먼저…… 이것의 존재 목적이자 이유인…… <이름 없는 신들의 왕녀>인 당신부터 파괴할 겁니다."
103060-203 = "당신을…… 부서뜨릴 것입니다."
103060-204 = "이것은…… 경고가 아니라……"
103060-208 = "……. 애원입니다."
103060-210 = "다음화;우트나피쉬팀의 배 2"
