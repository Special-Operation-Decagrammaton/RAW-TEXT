[translation]
83306075100-6 = "이런 곳에 다들 모여서…… 제법 소란스럽네."
83306075100-7 = "게헥! 선도부장?! 어째서 여기에?!"
83306075100-8 = "게헨나 학원 부지를 순찰도 할 겸 돌아보고 있었을 뿐이야."
83306075100-9 = "차, 참고로 우린 아직 아무런 짓도 안 했으니까 말이야!"
83306075100-10 = "옳소! 잘못을 저지르기 전이니! 잡혀갈 이유도 없다고!"
83306075100-12 = "……아니, 나라고 보자마자 잡아가는 건 아니야."
83306075100-13 = "평소 자주 얼굴을 마주치는 입장이니, 그런 오해를 하더라도 어쩔 수 없는 건 알겠지만."
83306075100-14 = "그래서 병실 안이 아니라, 이렇게 입구 쪽에 모여 있는 이유가 있어?"
83306075100-15 = "……레야."
83306075100-16 = "응?"
83306075100-17 = "벌레라고 벌레! 엄청나게 큰 벌레가 침대 밑으로 사라졌단 말이지!"
83306075100-18 = "그래서 도저히 안으로 들어갈 수가 없어! 모처럼 응급의학부실까지 왔는데! 침대에도 못 눕고!"
83306075100-20 = "흐음. 벌레, 란 말이지."
