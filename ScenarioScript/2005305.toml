[translation]
2005305-1 = "닌자 소녀는 비책이 필요해!"
2005305-2 = "설명회장"
2005305-3 = "(아무리 생각해도 미치루가 걱정이 되어서…….)"
2005305-4 = "(미치루와 설명회에 동행하기로 했다.)"
2005305-5 = "선생 공! 여기야, 여기!"
2005305-6 = "응?"
2005305-7 = "아니아니, 먼저 들어가 있거나 하지는 않는다구."
2005305-8 = "그리고 말이야…… 응?"
2005305-9 = "왜 드레스를 입고 왔냐고?"
2005305-10 = "선생 공, 이곳의 분위기를 봐."
2005305-11 = "이 설명회장은 선택받은 자들이 은밀히 비책을 나누는 자리……!"
2005305-12 = "그렇다면 그에 걸맞은 격식 있는 차림을 하고 오는 것이 타당하지 않겠어?"
2005305-13 = "그래서 큰마음 먹고 드레스를 꺼냈다, 이거지! 냐하핫!"
2005305-14 = "저기 봐, 다른 사람들도 정장이나 드레스를 차려입고 왔잖아!"
2005305-15 = "[s]\"확실히 그런 분위기이긴 하네…….\""
2005305-17 = "(비밀스러운 이야기를 하는 장소에 대놓고 안내용 현수막이 걸려 있는 게 이상하지 않으냐고 묻고 싶었지만…….)"
2005305-18 = "(일단은 미치루가 가자는 대로 따라갔다.)"
2005305-20 = "[ns]\"그런데, 이 설명회는 어떻게 알게 된 거야?\""
2005305-21 = "아, 얼마 전에 동영상을 보는데 말이지."
2005305-22 = "동영상 시작 전에 어떤 광고가 뜨더라고."
2005305-23 = "그게 이 설명회의 광고였지!"
2005305-24 = "[s]\"광고 보고 온 거였냐……!\""
2005305-25 = "아니아니 선생 공, 들어 보라니까?!"
2005305-26 = "그날도 나는 어떻게 하면 나의 채널을 성장시킬 수 있을까, 고민하면서 이것저것 검색 중이었단 말이지."
2005305-27 = "그런데 바로 그때……!"
2005305-28 = "딱 이 광고가 내 눈앞에 나타난 거야!"
2005305-29 = "마치 나의 고민에 대한 답신인 것처럼!"
2005305-30 = "그 순간 느꼈지. 이것은 운명이라고!"
2005305-31 = "[s]\"어…… 역시 그렇구나…….\""
2005305-32 = "뭐, 뭐야! 그 뜨뜻미지근한 반응은!"
2005305-33 = "아무튼, 이제 곧 설명회 시작하니까 들어가자고!"
2005305-38 = "설명회장 내부"
2005305-40 = "안녕하십니까, 여러분."
2005305-41 = "여기 모이신 여러분은 모두 같은 고민을 품고 오신 것이겠죠."
2005305-42 = "어떡하면 더 많은 조회수를, 더 많은 구독자를 얻을 수 있을 것인가……."
2005305-43 = "바로 이런 고민 탓에 이곳에 오신 것 아닙니까!"
2005305-44 = "역시……!"
2005305-45 = "내 마음을 정확히 꿰뚫어 보고 있어……!"
2005305-46 = "[s]\"…….\""
2005305-47 = "하지만 걱정하지 마십시오."
2005305-48 = "여러분이 원하는 조회수, 여러분이 원하는 구독자 수."
2005305-49 = "우리 회사에서 다 맞춰 드릴 테니까요!"
2005305-50 = "……응?"
2005305-51 = "단돈 100만 엔이면! 여러분이 올린 영상들의 평균 조회수를 100만으로 올려 드리겠습니다!"
2005305-52 = "마찬가지로, 단돈 100만 엔이면 여러분의 구독자 수를 100만으로 만들어드리겠습니다!"
2005305-53 = "에에에……?"
2005305-54 = "아, 방법에 대한 것은 걱정하지 마십시오."
2005305-55 = "우리 회사는 키보토스 크래커 협회에서 인준받은 안전한 매크로 프로그램을 사용하니까요!"
2005305-59 = "결국 조작한다는 이야기잖아……!"
2005305-60 = "선생 공, 미안해. 내가 잘못 생각한 것 같아."
2005305-61 = "조회수와 구독자 수를 정당하게 늘릴 수 있는 전략을 기대하고 왔는데……."
2005305-62 = "이건 그냥…… 사기인 것 같아."
2005305-63 = "나가자, 선생 공. 여기서 더 들을 건 없을 것 같아."
2005305-69 = "응?"
2005305-70 = "어디 가십니까, 여러분?"
2005305-71 = "아직 설명회는 끝나지 않았습니다만?"
2005305-72 = "아, 더 들을 게 없어서 이만 가보려고."
2005305-73 = "흐음, 그것은 좀 힘들겠는데요."
2005305-74 = "이렇게 함부로 중간에 나가는 것은 저희의 사규에 위반되는……."
2005305-76 = "[ns]\"저기, 잠시 저랑 이야기 좀 나누시죠.\""
2005305-77 = "예? 무슨 이야기를……."
2005305-81 = "잠깐, 그럼 그쪽이 샬레의……!"
2005305-82 = "죄송합니다! 살펴 가세요!"
2005305-86 = "[ns]\"가자, 미치루.\""
2005305-87 = "으, 응, 선생 공."
2005305-89 = "(그렇게, 미치루와 설명회장을 빠져나왔다.)"
2005305-91 = "인근 공원"
2005305-92 = "우으으…… 부끄러워……."
2005305-93 = "저런 사기꾼들에게 홀딱 넘어갈 뻔하다니……."
2005305-94 = "그런데 선생 공은…… 혹시……"
2005305-95 = "저기가 이런 곳이라는 걸 눈치채고 있었어?"
2005305-96 = "[s]\"짐작은 하고 있었지.\""
2005305-97 = "우으으으…… 너무해, 선생 공."
2005305-98 = "[s]\"응?!\""
2005305-99 = "물론! 이런 것에 낚인 내가 잘못이긴 하지만……!"
2005305-100 = "조, 조금은 말해줄 수도 있었잖아……!"
2005305-101 = "[s]\"어떤 실패는, 직접 겪어볼 가치가 있는 법이니까.\""
2005305-102 = "응……? 그게 무슨 소리야?"
2005305-103 = "[s1] \"만약 오늘 설명회장을 가지 않았다면, 미치루는 계속 미련이 남았을 거야.\"\n[s2] \"하지만 다녀옴으로써 오히려 속 시원히 털어낼 수 있었잖아?\""
2005305-109 = "음, 듣고 보니 맞는 말이네."
2005305-110 = "오히려 오늘 일을 계기로, 다시는 이런 사기에 넘어가지 않을 수도 있고……."
2005305-111 = "다시 생각해 보니 고맙네, 선생 공."
2005305-112 = "그리고 나, 오늘 일 덕에 결심했어."
2005305-113 = "이런 엉뚱한 것에 기대지 말고, 나의 채널은 나의 힘으로 성장시키기로……!"
2005305-114 = "그러니까 앞으로, 잘 지켜봐 줘!"
2005305-116 = "(이후, 미치루를 집에 데려다준 뒤 사무실로 돌아갔다.)"
2005305-117 = "(……그리고 저 수상한 설명회는 그대로 발키리에 신고했다.)"
