[translation]
2004705-1 = "마음의 천수각"
2004705-11 = "(얕은 곳에서 해수욕을 즐겼다)"
2004705-12 = "(그런데도 키쿄는 계속 손을 놓지 않았다)"
2004705-15 = "조금 익숙해졌을지도……."
2004705-16 = "……아, 오해는 하지 마. 난 절대 물을 무서워하는 게 아니니까."
2004705-17 = "이건 어디까지나 안전을 위해서……."
2004705-18 = "……."
2004705-19 = "뭐, 그건 이제 됐어."
2004705-20 = "해수욕은 충분하니까 다른 걸 해보자."
2004705-21 = "저번에 못 한 걸 해보고 싶다, 라고 말했었지?"
2004705-22 = "후후, 궁금해?"
2004705-23 = "자, 지금부터 알려줄게."
2004705-27 = "일단 이쪽에 누워."
2004705-28 = "지금부터, 바닷속을 에스코트해 준 선생님에게 보상을 줄 테니까."
2004705-29 = "[s1] \"보, 보상?\"\n[s2] \"뭘 해주는 거야?!\""
2004705-32 = "곧 알게 될 거야."
2004705-33 = "당신은 가만히 누워있기만 하면 돼."
2004705-34 = "나머지는 나한테 맡기고, 움직이지 마."
2004705-35 = "그럼…… 누워서 눈을 감아주겠어?"
2004705-37 = "(키쿄가 시키는 대로 얌전히 눈을 감고 누웠다.)"
2004705-42 = "움직이지 말라고 했지? 망가지잖아."
2004705-47 = "그대로. 가만히 있어."
2004705-52 = "(그렇게 잠시 후…….)"
2004705-57 = "다 됐어. 이제 눈 떠도 좋아."
2004705-60 = "자, 어때?"
2004705-61 = "내 특제 모래찜질의 감상은?"
2004705-62 = "[s3] \"온몸이…… 무거워!\"\n[s4] \"사, 살려줘—!\""
2004705-65 = "누가 오해할 소리는 하지 마. 전부 당신을 위한 거니까."
2004705-66 = "이걸 하면 다양한 효과가 있다고 해."
2004705-67 = "체온이 상승하면 땀의 배출로 피부를 깨끗하게 할 수 있고, 심박수가 증가하면 전신에 산소와 영양이 보급되지."
2004705-68 = "덤으로, 신경통과 관절에도 좋다고 해."
2004705-69 = "어때? 그동안의 피로가 싹 날아가는 기분이지?"
2004705-70 = "[s5] \"그런 것 같긴 한데…….\"\n[s6] \"모래를 너무 많이 쌓은 거 아니야?\""
2004705-73 = "평범하게 쌓으면 심심하니까 성 모양으로 쌓아 봤어."
2004705-74 = "선생님은 학생들을 지켜주는 사람이잖아? 성이라는 역할에도 정말 잘 어울리지."
2004705-75 = "자, 천수각에 내 인형을 놔줄게. 목각인형이야."
2004705-76 = "목표 시간은 30분. #n도중에 이 아이가 쓰러지면, 처음부터 다시 셀 거야."
2004705-77 = "[s7] \"키쿄가 쓰러지게 할 순 없지.\"\n[s8] \"어떤 수를 써서라도 버티겠어……!\""
2004705-80 = "그, 그런 말을 아무렇지도 않게……."
2004705-81 = "후훗……아직 여유가 있다는 거지."
2004705-82 = "그럼, 이거랑, 이거랑…… 이것도."
2004705-88 = "인형, 추가했으니까."
2004705-89 = "이걸로 백화요란의 명운은 선생님에게 맡겨졌는데…….#n당신이라면 한 명도 쓰러트리지 않고 버틸 수 있겠지?"
2004705-90 = "[s] \"히, 힘내겠습니다!\""
2004705-91 = "우리의 동맹이 얼마나 굳건한지…… 증명해 봐."
2004705-92 = "[s] \"이미 굳건한 것 같은데요…….\""
2004705-94 = "[ns] \"그보다…… 정말 잘 쌓은 모래성이네.\""
2004705-95 = "어렸을 때부터 많이 쌓아봤거든."
2004705-96 = "모래성과 목각인형을 이용해 다양한 전술과 전략을 시험하며 놀았지."
2004705-97 = "[s] \"키쿄는 옛날부터 참모였던 거네.\""
2004705-98 = "옛날에는 역할놀이였지만."
2004705-99 = "그래도, 추억이라는 건 소중하니까. #n사고나 인생에 큰 영향을 주지."
2004705-100 = "추억을 발판으로 마음속에 지어진 성은― #n그렇게 쉽게 무너지지 않잖아?"
2004705-101 = "아마 지금 당신과 있는 이 순간도……."
2004705-105 = "……!"
2004705-106 = "아, 아니야. 방금 말은 못 들은 걸로 해줘."
2004705-107 = "나도 모르게 마음에도 없는 말을 해버렸네."
2004705-112 = "응? 선생님. 지금 성이 흔들리고 있는데……."
2004705-113 = "[ns] \"……키쿄!\""
2004705-114 = "가, 갑자기 무슨……."
2004705-118 = "꺄앗……!"
2004705-125 = "서, 선생님?"
2004705-126 = "[s9] \"추억 만들기라면 맡겨줘!\"\n[s10] \"이번엔 키쿄가 모래찜질을 할 차례야!\""
2004705-129 = "그건 상관없지만…… 그 전에."
2004705-130 = "인형, 쓰러트렸네? 선생님."
2004705-135 = "(그 후 묻고, 묻히고. #n키쿄와 모래놀이를 하며 보냈다.)"
