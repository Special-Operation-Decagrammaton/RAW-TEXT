[translation]
1009102-1 = "보컬 연습"
1009102-2 = "(……결국 카즈사의 손에 붙잡혀, 근처 노래방으로 끌려갔다.)"
1009102-3 = "[ns1] \"책임이라기에 무슨 소린가 했더니\"\n[ns2] \"노래 부르는 연습을 도와달란 거였구나.\""
1009102-6 = "……? 그야 그렇지?"
1009102-7 = "아니면 뭘 생각한 거야. 설마 내가 도망치기라도 할 줄 알았어?"
1009102-8 = "어차피 누군가는 해야 할 일이잖아. 할 거면 똑바로 하자는 거야. 단지 그것뿐."
1009102-9 = "대견하다고? 하하. 고마워라. 선생님한테 칭찬 들으니 기분 좋네."
1009102-10 = "……응?"
1009102-11 = "노래 불러본 적 없냐고? 아니, 뭐. 그런 건 아닌데. 그거랑 '보컬'은 또 다른 이야기잖아."
1009102-12 = "논다고 막 부르는 노래랑 공연을 위해 부르는 노래가 같을 리 없으니……."
1009102-13 = "……."
1009102-14 = "자, 자. 됐으니까 연습이나 도와줘."
1009102-15 = "어떻게 도와주냐고? 뭐, 간단하지?"
1009102-16 = "이것저것 불러볼 테니까, 조금 어색하거나 별로인 부분이 있으면 끝나고 나서 말해주면 돼."
1009102-17 = "어차피 부를 곡도 아직 안 정해졌으니, 전반적으로 연습해 두려는 거거든. 평소라면 잘 안 불러봤을 분위기나 장르 위주로."
1009102-18 = "……뭐? ……다른 녀석들?"
1009102-19 = "안 돼. 안 돼. 무슨 끔찍한 소리야, 그게?"
1009102-20 = "그 녀석들 데리고 와서 하면, 내가 틀리거나 어색할 때마다 또 놀리려 들 거라고."
1009102-21 = "그러니까 여기선 확실하게 믿을 수 있는 선생님이랑……."
1009102-26 = "흠……. 흐음……."
1009102-27 = "확실하게 믿을 수……. 있나……?"
1009102-28 = "[s3] \"……이제 와서!?\"\n[s4] \"뭐, 뭐지? 그 표정은……?\""
1009102-31 = "아니, 뭐. 말하다가 문득 생각한 건데, 선생님도 딱히 동아리 녀석들과 다를 바 없었던 거 같다는 생각이……."
1009102-32 = "뭔가 부르다가 틀리면 똑같이 놀릴 거 같은 이미지랄까."
1009102-33 = "……크윽. 역시 혼자 하는 게 나았으려나."
1009102-34 = "……응?"
1009102-35 = "절대 그러지 않는다고? 약속하겠다고?"
1009102-36 = "어라……. 정말이야? 이건 또 의외의 반응인데……."
1009102-37 = "[s5] \"장난을 쳐도 될 때가 있고, 아닐 때가 있으니까.\"\n[s6] \"노력하는 학생을 놀리는 건, 하면 안 되는 짓이야.\""
1009102-40 = "서, 선생님……?"
1009102-41 = "뭐, 뭐야. 갑자기 그렇게 진지하게. 그렇게까지 심각하게 말한 건 아니었는데."
1009102-42 = "으, 으음……."
1009102-43 = "……가끔씩 이런 식으로 확 튀어나올 때가 있단 말이야, 선생님은."
1009102-44 = "아무튼 뭐, 좋아. 선생님이 진지하게 나와 준다면 나로서도 든든하지."
1009102-45 = "그, 그러면 나도……. 음……. 진지하게……."
1009102-46 = "…………."
1009102-47 = "……자, 잘 부탁드립니다!"
1009102-49 = "(이후 카즈사의 노래를 들으며 이런저런 의견들을 전달해 주었다.)"
1009102-50 = "(몇 가지 개선점이 있긴 했으나, 기본적으로 카즈사의 노래 실력은 굉장했다.)"
1009102-52 = "[ns7] \"……??? 뭐야, 잘만 부르잖아.\"\n[ns8] \"이럴 거면서 여태 그렇게 걱정한 거야?\""
1009102-55 = "으, 으응? 그, 그런가……? 괜찮아 보여?"
1009102-56 = "아무래도 선생님의 칭찬은 순수하게 받아들이기 어렵단 말이지. 괜히 해주는 말 같고……."
1009102-57 = "……? 그런 게 아니야? 지금은 그럴 상황도 아니고?"
1009102-58 = "그, 그랬지. 맞아. 어차피 실력을 확인하고 연습하기 위해서였으니까. 입에 발린 말은 안 하겠지. 그래."
1009102-62 = "그럼 진짜 괜찮은 거 맞지? 믿어도 되겠지?"
1009102-63 = "[s9] \"조금만 더 자연스러워지면 완벽해.\"\n[s10] \"나머진 마음먹기에 달렸어. 편하게 불러야 해.\""
1009102-66 = "으음. 과연. 그런가."
1009102-67 = "자연스럽게……. 편하게 부른다……. 흠……."
1009102-68 = "아무튼 뭐, 그럼 일단은 큰 걱정 없이 진행할 수 있다는 거지?"
1009102-69 = "……하아. 좋아. 이걸로 일단 한시름 놓았네. 일단 오늘의 연습은 여기까지 할까."
1009102-70 = "……응?"
1009102-71 = "그럼 이제부터 뭐 할 거냐고?"
1009102-72 = "……? 뭐하긴? 아직 노래방 시간 한참 남았잖아."
1009102-76 = "……놀아야지. 이왕 노래방까지 왔는데."
1009102-77 = "[s11] \"……? 여태 그렇게 불러 놓고?\"\n[s12] \"방금 전까지와 뭐가 다른 거죠?\""
1009102-80 = "……??? 그건 무슨 반응이야?"
1009102-81 = "어허! 완전히 다르다고. 완전히."
1009102-82 = "연습을 위한 노래랑 놀려고 부르는 노래잖아! 어떻게 이게 같아?"
1009102-83 = "이 차이를 모르는 거야? 쯧쯧. 이러니까 어른들은……."
1009102-89 = "아무튼 이왕 여기까지 왔으니, 온 김에 끝까지 어울려 달라고. 모처럼이잖아."
1009102-90 = "아직 시간은 한참 남아있어!"
1009102-91 = "자~! 그럼 첫 곡부터 가보실까-!!"
1009102-96 = "가자아아아아~~!!"
1009102-97 = "(이후 남은 시간 동안, 카즈사는 마이크와 혼연일체가 되어 노래방을 지배했다.)"
1009102-101 = "(……확실히 말해, 연습할 때보다 훨씬 더 잘 불렀다.)"
