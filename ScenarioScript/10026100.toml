[translation]
10026100-1 = "제10화;사소한 변화들"
10026100-2 = "과연……. 그렇군요."
10026100-3 = "기존 발견지를 제외하고도 두 곳……. 자체적으로 만든 기숙사와 숨겨둔 캐비닛들……입니까."
10026100-4 = "성도회의 원정 훈련장으로 사용되고 있었지만, 지시하지 않은 개인 활동들이 계속 발견돼 폐쇄됐다……라."
10026100-5 = "……좀 의외로군요. 오래된 선배님들도, 때때로 일탈을 원하시던 때가 있으셨나 봅니다."
10026100-6 = "하긴 사람이라면 누구나 그런 유혹의 시험에 빠지곤 하니까요. 이해는 갑니다만……."
10026100-7 = "아무튼 대략적인 내용은 확인했습니다. 세세한 부분들은 나중에 따로 검토하도록 하죠. 협조에 감사드립니다."
10026100-8 = "그렇다곤 해도 이렇게나 빨리 조사가 끝날 줄은……. 역시 고서관의 마술사랄까."
10026100-9 = "……그……."
10026100-10 = "뭔가……."
10026100-11 = "뭐랄까……. 이런 마음 가지면 안 된다는 건 알고 있지만……."
10026100-12 = "저희가 여태까지 찾지 못했던 것들이 너무 쉽게 밝혀진 것 같아서, 조금……. 아주 조금은……."
10026100-16 = "아닙니다. 역시 이런 걸로 분하다는 감정을 느끼는 건, 아직도 시스터로서의 제 수행이 부족하다는 뜻이겠지요."
10026100-17 = "약속대로……. 코제키 우이 씨와 관련된 일련의 일들은, 이번 일에 받은 도움으로 묻어두고자 합니다."
10026100-18 = "후후. 잘됐네요, 잘됐어."
10026100-19 = "…………으음."
10026100-20 = "하나코 씨. 혹시 괜찮으시다면, 이건 시스터로서가 아닌 제 개인적인 의문입니다만……."
10026100-21 = "이번 조사……. 저는 사실 뭔가 여러모로 하나코 씨의 의도가 느껴집니다."
10026100-22 = "물론 악의는 아니고, 우이 씨를 돕고자 하는……. 선의이기에 저로서도 좋은 일이라고 생각하지만……."
10026100-23 = "하나코 씨는 혹시, 처음부터 유적에 대해 어느 정도 알고 계셨던 건가요? 이런 곳이라는 걸……."
10026100-24 = "그렇게까지 해서…… 유독 우이 씨를 변호하려는 이유가 있으셨을까요……?"
10026100-25 = "어라. 그렇게 보였나요? 으음. 곤란하네요. 저도 요즘 따라 꽤 허술해졌나 봐요."
10026100-26 = "그렇군요. 변호할 이유라……. 뭐가 좋을까요?"
10026100-27 = "음……. 그냥 이건 제 변덕인 걸로 할게요. 딱히 거창한 이유가 있던 건 아니라서요."
10026100-28 = "변덕인 걸로 하시겠다……라니…… 으음……."
10026100-29 = "뭐……. 그렇습니까. 알겠습니다. 그건 그 이유로 충분한 거겠지요."
10026100-30 = "그러면……. 찾으신 건 말씀해 주신 이 보고서의 포인트들……이 전부인 게 맞을까요?"
10026100-31 = "으음……? 질문의 의미를 잘 모르겠는걸요."
10026100-32 = "설마 더 있는데 저희가 숨기고 있다든가……."
10026100-33 = "아, 아뇨! 그럴 리가요!? 그런 의미는 절대로……!!"
10026100-34 = "평소처럼 습관적으로 나온 질문이었습니다. 실례가 됐다면 죄송합니다."
10026100-35 = "그리고 지도에 관한 것도……."
10026100-36 = "아~."
10026100-37 = "지도에 관한 건……. 정말 죄송해요. 좀 더 잘 챙겼어야 했는데, 전투가 이어지다 보니……."
10026100-38 = "아, 아뇨. 괜찮다고 말씀드리려고 했던 겁니다만……."
10026100-39 = "지도가 소실된 건 안타까운 일이지만, 덕분에 유적의 조사를 마무리할 수 있었으니까요."
10026100-40 = "오히려 그럼에도 끝까지 완수해 주시고, 이렇게 새 지도를 만들어 주신 부분에 있어서는 감사드려야 할 일."
10026100-41 = "그런 것까지 모두 포함해서, 언젠가 저희도 이 도움을 갚을 기회가 있기를 진심으로 바라겠습니다."
10026100-42 = "그럼 이만……."
10026100-46 = "……후훗."
10026100-47 = "그럼 저희도 돌아갈까요? 선생님?"
10026100-51 = "[ns1] \"이걸로 괜찮은 거겠지?\"\n[ns2] \"묘하게 꺼림칙한데…….\""
10026100-54 = "후후. 이제 와서 그런 말씀 하시는 거예요? 다 같이 한 일이잖아요? 모두 '공범'이라고요?"
10026100-55 = "'그걸' 그대로 다시 묻어두기로 한 것도, '그 안'에 '그걸' 넣어두기로 한 것도 전부."
10026100-56 = "그나저나 '그런 생각'을 하고 계실 줄이야…… 우이 씨도 보기와 달리 귀여운 구석이 있으시네요."
10026100-57 = "전에 선생님께서……. 우이 씨가 마음이 드냐고 물으셨었죠?"
10026100-58 = "사실 그때 대답하긴 했지만, 혹시나 해서 지금 다시 말씀드릴까 해요."
10026100-59 = "……네. 아무래도 마음에 든 것 같아요."
10026100-60 = "기회만 된다면……. 같이 수영복 산책이라도 해보고 싶을 만큼요."
10026100-61 = "[s3] \"그거 우이에겐 꽤 큰일이겠네.\"\n[s4] \"너무 곤란하게는 만들지 마.\""
10026100-62 = "그렇게 되나요? 후후……."
10026100-63 = "후후……. 글쎄요. 어떨까요?"
10026100-64 = "아, 하나코 씨……?"
10026100-65 = "……음?"
10026100-66 = "어라, 마리 쨩?"
10026100-71 = "오랜만에 뵙네요. 그간 평안하셨을까요?"
10026100-72 = "어라, 선생님께서도……. 아무래도 뭔가 공적인 일이 있으셨나 보군요."
10026100-73 = "음~. 아무래도 그렇죠. 이번 일은……?"
10026100-74 = "아하……. 네……."
10026100-75 = "……후훗."
10026100-76 = "다음번에는, 사적인 일로도 들를 수 있게 해 볼까요?"
10026100-81 = "가령 마리 쨩을 보러 온다든가……."
10026100-82 = "……!?"
10026100-83 = "하나코 씨……!? 저, 전 그런 의도로 말씀드린 게……?"
10026100-84 = "어라, 역시 부담스러울까요? 미안해요. 나도 모르게 설레발을……."
10026100-85 = "아, 아니요! 아니에요! 그럴 리가요! 찾아와 주세요, 언제든지 기다리고 있을게요! 하나코 씨도, 선생님도……!"
10026100-86 = "꼬, 꼭이에요……!!"
10026100-87 = "……후훗."
10026100-88 = "좋아요. 그치만 오늘은 정말 일 때문에 온 것이니까요. 더 들러야 할 데가 있어서 이만~."
10026100-89 = "아, 네. 네! 살펴 가세요!!"
10026100-90 = "……서, 선생님도요!"
10026100-95 = "[ns] \"마리가 많이 기뻐하네.\""
10026100-96 = "후후. 그러게요."
10026100-97 = "마리 쨩……. 솔직히 저 같은 사람과 어울리기엔 과분한 사람이라고 생각하긴 하지만……."
10026100-98 = "저렇게까지 기뻐해 주면……. 순수하게 기쁘네요. 이렇게 된 것도 다 선생님 때문이려나요?"
10026100-99 = "그러니……."
10026100-100 = "나중에 마리 쨩이 놀라서 우는 일이 생겨도 전~부 선생님 탓인 거……. 알고 계시죠?"
10026100-101 = "[s5] \"……예? 그게 그렇게 되나요……!?\"\n[s6] \"마리에게 수영복 산책은 안 돼!\""
10026100-104 = "후후……. 그럼 돌아갈까요?"
10026100-105 = "선생님도 아시다시피, 오늘은 가야 할 곳도 많잖아요?"
10026100-111 = "다녀왔습니다~."
10026100-112 = "다녀왔습니다라니……. 마치 여기가 자기 집인 것처럼 말씀하지 말아 주세요……."
10026100-113 = "가뜩이나 지금 한 명 더 생겨서 신경 쓰이……."
10026100-117 = "히나타 씨……!! 조심 좀 해 주세요!!"
10026100-118 = "잘못하면 책장이랑 같이 넘어간다고요……!! 애들이 다치면 어쩌려고 그래요!?"
10026100-122 = "그, 그리고 히나타 씨도……."
10026100-124 = "아하하하……. 죄송해요. 생각보다 바닥에 뭐가 많아서……."
10026100-125 = "하지만 괜찮아요! 저, 힘과 튼튼한 걸로는 누구에게도 지지 않으니까요!"
10026100-126 = "아니, 그러니까 그런 문제가……."
10026100-127 = "음……. 그치만 역시 이 정도로 책이 많으면, 정리할 인력을 추가하는 게 좋지 않을까요?"
10026100-128 = "이 많은 걸 지금까지 우이 씨 혼자서 계속 해 오시다니……. 조금 걱정이……."
10026100-129 = "절대 안 돼!!!"
10026100-130 = "그건 안 돼요, 안 돼! 새 인력이라니! 여기 사람 드나드는 꼴을 안 보려고 제가 얼마나 고생해 왔는지 알아요!?"
10026100-131 = "지금 이 상황도 이미 저는……. 으으……. 한계가……!! 크으윽……!!"
10026100-132 = "세상에……!! 이게 대체 몇 명이야……!! 대체 몇 명이냐고!! 완전 시장통이잖아!!!"
10026100-133 = "이럴 수는 없어!! 이건 꿈이야, 꿈!! 악몽!!"
10026100-134 = "[s7] \"겨우 네 명밖에 안 되는데요.\"\n[s8] \"도서관에서는 조용히 해주세요…….\""
10026100-137 = "후후. 너무 괴로워하지 말아요, 우이 씨. 어차피 오래 있진 않을 테니까요."
10026100-138 = "사쿠라코 씨에게 조사 보고서를 가져다드리고 왔어요. 다행히 별일은 없었고, 이번 일은 이걸로 마무리! 끝!"
10026100-139 = "으음……!? 그렇게 그냥 넘어가던가요? 그 사람이……?"
10026100-140 = "아……. 그 부분은 잘 말씀해 주셨다고요? 가, 감사합니다. 선생님……. 하나코 씨……."
10026100-141 = "그, 그럼……. 그……. 지도랑 메모리얼 캡슐에 관한 것도……."
10026100-142 = "그건 따로 말하진 않았어요. 성당 쪽에서도 크게 관심을 가지거나 예상할 수 있는 부분은 아니었으니……."
10026100-143 = "사실, 당장 저도 조금 의외였는 걸요. 다른 분도 아닌 우이 씨가……."
10026100-144 = "메모리얼 캡슐을 그대로 묻어두고, 거기에 지도까지 롤링 페이퍼로 만들어 담아두자고 할 줄은."
10026100-145 = "괜찮아요? 그렇게 그 자리에 두어도? 어떻게 보면 유물이잖아요? 우이 씨의 평소 말과 다른 것 같은데."
10026100-146 = "어떻게 보면……. 일종의 훼손 아닌가요? 상자에게도, 롤링 페이퍼가 된 지도에게도."
10026100-148 = "……? 예?"
10026100-149 = "아니, 그……. 그게……. 어떻게 그렇게 되는……?"
10026100-150 = "하아……. 이걸 또 다 일일이 설명해야 하다니. 정말 이래서 바깥……."
10026100-151 = "아. 아니지. 미안해요. 여러분에게는 이러지 않기로 했었죠. 네……."
10026100-152 = "뭐지……. 뭔가 '이러면 안 되는 사람'이 점점 느는 것 같은데……."
10026100-153 = "아무튼……. 일단 저는 사서이지……. 고고학자가 아니에요."
10026100-154 = "그 아이들을 존중하고 의지를 관철시켜주고 싶을 뿐, 전부 찾아서 기록하는 사람이 아니죠."
10026100-155 = "애초에 모든 유물이, 자신과 자신이 가진 비밀을 후대에 전달하기 위해 땅에 묻히는 것도 아니고요."
10026100-156 = "미래로 보내고 싶은 이야기가 있는가 하면, 자신들만의 추억으로 가슴 속에 묻어두고 싶은 이야기도 있는 법."
10026100-157 = "그 훈련장은 공식적으로 폐쇄됐고, 추억들은 본인들도 다시 찾으러 올 생각이 없었어요."
10026100-158 = "밖으로 가져가면 압수돼서 처분될 것들이 대부분이었고, 개중에는 지극히 개인적이고 소중한 것들도 있었겠죠."
10026100-160 = "누구에게도 말하지 않고, 보여주지 않고, 자신들만의 소중한 추억으로 오롯이 세월의 풍화를 맞고 싶게 했던……."
10026100-161 = "……네. 그게 그 아이가 타고난 사명. 책무."
10026100-163 = "파헤쳐서 가져오고, 보관 창고에 박아 두거나 박물관에 전시하는 거야말로……. 그 아이에게는 모욕이 따로 없는 일이에요."
10026100-164 = "…………."
10026100-165 = "물론 저흰 조사 팀으로 갔으니 거기서 무슨 일이 있었는지는 보고해야 할 입장이었지만……."
10026100-166 = "그러니 하다못해 메모리얼 캡슐 정도라도……. 그 아이 하나만이라도, 계속 자신이 할 일을 하게 해 주고 싶었어요."
10026100-167 = "하지만 그 아이도, 혼자 텅 빈 상자인 채로 앞으로의 긴 시간을 보내는 건 외로울 테니……."
10026100-168 = "[s9] \"……양피지는 오래 가니까.\"\n[s10] \"같은 시대의 동료……라는 거네.\""
10026100-171 = "뭐, 그런 거죠. 둘 다 그 시대에 만들어진, 같은 시간을 보내는 아이들이니까요."
10026100-172 = "오히려 저는, 그런 것보다……."
10026100-178 = "히나타 씨가……. 그런 제 제안에 동의해 주신 것이 더 신기했는데 말이죠……."
10026100-179 = "……네? 저요?"
10026100-180 = "그……. 일단은 시스터시잖아요. 따지고 보면 거짓말 아닌가요? 괜찮은 건가요? 시스터가?"
10026100-181 = "아하하하……. 그렇게 보이셨나요……? 신경 쓰고 계셨군요. 우이 씨."
10026100-182 = "……하지만 괜찮아요. 마음에 내키지 않는 일이었다거나 억지로 따른 건 아니니까요."
10026100-183 = "억지로 따른 게 아니었다고요……?"
10026100-184 = "네. 물론 기본적으로 거짓말이라는 건 좋지 않을 때가 많지만……."
10026100-185 = "만약 자기 마음에 직접 물어봐서 부끄럽지 않은 것이라면, 의외로 용서받을 수 있을 때도 많답니다."
10026100-186 = "사쿠라코 자매님께서도 늘 말씀하시죠. 저희가 늘 읽는 경전과 암송하는 수많은 규율들……."
10026100-187 = "모두 자신의 선택과 길을 결정할 때 참고가 되는, 방황하지 않도록 도와주는 길잡이일 뿐."
10026100-188 = "가장 중요한 법정은 모두의 마음속에 있으니, 늘 그 판결을 진지하게 마주하라……고요."
10026100-189 = "……저는 우이 씨의 말씀이 옳다고 생각했어요. 그래서 함께하기로 한 거고, 그러니 정말로 괜찮아요."
10026100-190 = "어, 어어……. 음……."
10026100-191 = "[s11] \"과연, 훌륭한 시스터들이야.\"\n[s12] \"그러네. 아무 문제 없네.\""
10026100-194 = "네, 네……. 뭐…… 그렇다면 다행이지만……요."
10026100-195 = "그렇죠? 우이 씨도 이번 기회에 사쿠라코 자매님이나 다른 분들에 대한 오해를 좀 풀었으면……."
10026100-197 = "네, 기각. 그거랑 이거는 별개."
10026100-198 = "히나타 씨야말로 아무것도 모르는 순진하고 선한 분이라서 그래요."
10026100-199 = "그 사람……. 그 조직에는 뭔가 있다고요. 거대하고 음산한 비밀이……!!"
10026100-200 = "당장 지금 이렇게, 히나타 씨를 저에게 보내 정기적으로 감시 활동을 시킨 거만 해도……!"
10026100-201 = "으, 으음? 네? 이건 그저…… 이번 기회로 우이 씨를 도우라는 정기적인 협조 인력인……."
10026100-202 = "당연히 히나타 씨에게는 그렇게 말했겠죠! 히나타 씨는 착하니까! 그러니까 내막은 그게 아니라……!!"
10026100-203 = "……하아……. 됐어요. 말해 봐야 제 입만 아프군요."
10026100-204 = "하하하……."
10026100-206 = "자, 자……. 그럼 저는 일단 큰 정리들이 어느 정도 끝난 것 같으니……."
10026100-207 = "너무 오래 있는 건 우이 씨에게도 힘든 일이겠죠? 슬슬 자리를 비워주는 게 좋겠네요."
10026100-208 = "……!"
10026100-209 = "그, 그럼……. 음……."
10026100-210 = "잠시만요, 저기……."
10026100-211 = "……? 음? 왜 그러세요, 우이 씨?"
10026100-212 = "어라. 설마 사실 안 가길 바라신다든가……."
10026100-213 = "그, 그럴 리가 없잖아요. 그건……. 어쩔 수 없는 거라고요……."
10026100-214 = "그렇지만……. 그, 그것과는 별개로, 여기……. 모두 하나씩……."
10026100-218 = "[ns13] \"……아이스 아메리카노!\"\n[ns14] \"우이, 괜찮겠어? 이 뜻은…….\""
10026100-223 = "그……. 모두 저 때문에, 고생하셨으니까……."
10026100-224 = "별 건 아니지만 그래도 인사 정도는 해야 한다고 생각해서……. 그냥 나가실 때 하나씩 들고 가시라고……."
10026100-225 = "감사의 뜻으로……. 그것뿐이니까요."
10026100-231 = "[ns15] \"고마워, 잘 마실게.\"\n[ns16] \"우이도 노력하고 있구나.\""
