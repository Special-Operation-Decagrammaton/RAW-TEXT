10026100-255 = "뭐, 뭐야 대체……!?"
10026100-256 = "뭐라고 말이라도 좀 해, 선생님!! 이대로라면 사형이라고! 사형!!"
10026100-257 = "이, 이건 역시 그런 건가!? 아무리 생각해도 그런 거지!? 그렇게밖에 볼 수 없잖아!!"
