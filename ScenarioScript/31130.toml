[translation]
31130-1 = "제13화;제1차 모의 시험"
31130-3 = "좋은 아침!"
31130-4 = "좋은 아침, 아즈사 쨩. 아침부터 씩씩하네요♡"
31130-5 = "음. 하루가 시작되었으니까."
31130-6 = "자, 모두 일어나서 양치, 샤워, 새 옷으로 갈아입고 하루를 시작하는 거다."
31130-7 = "아우우…… 아즈사 쨩…… 10분만…… 아우……."
31130-8 = "으응…… 벌써 아침……?"
31130-9 = "히후미, 코하루. 일어나. 아직 침대 위에 누워 있으면 안 돼."
31130-10 = "아우……. 그치만……."
31130-15 = "응…… 일어났어요……."
31130-16 = "어머나. 히후미 쨩은 어제 밤 늦게까지 안 잔 것 같던데…… 이 상태라면 꽤 시간이 걸리겠는데요."
31130-17 = "음…… 이해했어. 우리 보충수업부의 부장이니까, 그 심리적 압박은 상당하겠지. 조금은 더 쉬도록 해야 할까……."
31130-18 = "……응? 여기는 어디……? 어째서 나……."
31130-19 = "잘됐네. 이쪽은 잠에서 깬 것 같으니, 코하루의 아침 준비는 내가 책임지겠어."
31130-20 = "……응? 어? ……어라?"
31130-21 = "자, 씻는 걸 도와줄 테니 따라와. 샤워실은 이쪽이다."
31130-22 = "……응? 어……? 으아……?"
31130-27 = "어머나…… 둘이 사이좋게 씻는 건가요."
31130-28 = "으, 으아아?! 자, 잠깐?! 뭐, 뭐야?! 벗기지 말아줘-?!"
31130-29 = "차, 차가워?! 아, 아악?! 샴푸가 눈에……?!"
31130-30 = "우후후♡ 다정도 해라."
31130-32 = "별관 교실"
31130-33 = "자, 모두 모이셨나요?"
31130-34 = "네~♡"
31130-35 = "음."
31130-36 = "흐흑……. 알몸을 보여줘버렸어……. 부끄러워……."
31130-37 = "코하루도 내 알몸을 봤으니 문제없잖아?"
31130-38 = "그, 그게 아니잖아!! 이 폭력배! 갑자기 그렇게 사람을 난폭하게……."
31130-39 = "그럼 다음엔 제가 코하루 쨩을 씻겨드릴까요?"
31130-40 = "무슨 소리야! 너, 넌 절대 안돼!!"
31130-45 = "자, 여러분……."
31130-46 = "[s] \"히후미. 이쪽 머리가 삐쳐있는데.\""
31130-47 = "아, 아하하…… 이건 늦잠을 자서……."
31130-48 = "아, 아니…… 그게 중요한 게 아니라, 여러분!"
31130-49 = "여러분! 모두 주목해주세요!"
31130-51 = "……."
31130-53 = "……오늘은 보충수업부 합숙의 본격적인 첫날이에요!"
31130-54 = "우리가 해결해야 할 문제는 엄청나게 많고, 또 어렵지만……."
31130-55 = "생각해보면 핵심은 간단해요!"
31130-56 = "즉, 앞으로 일주일 뒤에 있을 평가 시험에 모두가 전원 합격한다!"
31130-57 = "음."
31130-58 = "그렇죠."
31130-59 = "으, 으응……."
31130-61 = "……."
31130-66 = "그러니까, 지금부터, 모의 시험을 치겠습니다!"
31130-67 = "모의 시험……?"
31130-68 = "어머나……?"
31130-69 = "가, 갑자기?! 시험?! 왜?!"
31130-70 = "……앞으로 우리가 달성해야 할 목표와, 단계를 설정하기 위해서는……"
31130-71 = "먼저 우리 자신의 실력을 정확하게 파악하는 것이 필수입니다!"
31130-72 = "그래서 준비했어요!"
31130-76 = "작년 트리니티에서 시행된 시험문제들의 모범답안을 모아서 편집한, 신뢰도가 매우 높은 시험지!"
31130-77 = "선생님이 어제 늦게까지 준비해 주셨고…… 이거라면 평가시험과 비슷한 수험 평가를 내릴 수 있을 거예요!"
31130-78 = "시간은 1시간, 100점 만점에 60점 이상이면 합격. 기준도 모두 실전과 동일하게 하겠습니다!"
31130-79 = "저도 같이 풀 거니까, 자 모두 시작하는 거예요!"
31130-81 = "제1차 보충수업부 자체 모의 시험"
31130-82 = "[s] \"모두 준비됐어? 다 풀면 나가도 돼.\""
31130-85 = "[ns] \"그럼 시작-!\""
31130-89 = "……."
31130-92 = "어머나. 이 문제, 그립네요♡"
31130-95 = "끄, 끄응…… 이거 어디서 봤던 건데……."
31130-99 = "(모두들…… 힘내주세요!)"
31130-105 = "(시험 종료 후, 모두의 채점 결과가 나왔다.)"
31130-106 = "자, 그럼 선생님. 결과를 알려주세요."
31130-108 = "제1차 보충수업부 자체 모의 시험 결과"
31130-110 = "하나코 - 4점 [FF6666](낙제)[-]"
31130-112 = "아즈사 - 33점 [FF6666](낙제)[-]"
31130-114 = "코하루 - 15점 [FF6666](낙제)[-]"
31130-116 = "히후미 - 68점 [007eff](합격)[-]"
31130-118 = "음……."
31130-119 = "……."
31130-120 = "어머나……."
31130-121 = "……."
31130-125 = "네. 바로 이게 우리들의 현실이에요. 이대로 가다간 저희를 기다리고 있는 것은 파멸뿐……."
31130-130 = "앞으로 있을 제2차 평가 시험에서 모두가 60점을 넘기 위해선, 우리에게 남은 시간을 모조리 불살라야 해요!"
31130-131 = "코하루 쨩과 아즈사 쨩은 1학년 시험을 쳐야 하니까 두 사람이 짝이 되고,"
31130-136 = "저와 하나코 쨩이 두 사람을 지원합니다! 하나코 쨩, 1학년 과정의 성적은 우수했잖아요?"
31130-137 = "어머……? 그, 그렇긴 한데……."
31130-138 = "그리고 하나코 쨩은 지금 수험 상태를 면밀히 파악해서 저와 선생님이 같이 솔루션을 찾을 거예요!"
31130-142 = "이제부터 주기적으로 모의 시험을 쳐서 저희들의 성적을 계속 확인할 거예요."
31130-143 = "……."
31130-144 = "……낙제를 막는다. 시험에 합격한다."
31130-145 = "처음부터 저희의 목표는 이것이었습니다! 이것 말고는 다른 어떤 것도 신경쓰지 않을 거예요!"
31130-146 = "[s] (히후미……!!)"
31130-149 = "(고민해봤자 달라질 건 없어요. 저는 제가 할 수 있는 일을 하겠어요……!)"
31130-151 = "……. 그렇군. 이해했어. 지휘에 따르겠다."
31130-152 = "우…… 으, 으응……."
31130-153 = "어머나…… 히후미 쨩…… 짧은 시간에 준비를 이렇게까지……."
31130-154 = "네? 아, 아뇨. 선생님이 도와주셔서…… 아우……."
31130-155 = "선생님이……."
31130-156 = "[s] \"별거 아니야.\""
31130-157 = "자, 모두에게 냉혹한 것만 있는 건 아니에요. 쪽지 시험의 성적이 좋으면…… 상도 준비해놨어요."
31130-158 = "어디보자……."
31130-160 = "(부스럭부스럭)"
31130-164 = "쨔안-! 성적이 좋은 분께는 이 모모프렌즈 굿즈를 선물로 드리겠어요!"
31130-165 = "모모프렌……즈?"
31130-166 = "……인형? 장난감……?"
31130-167 = "……!!"
31130-168 = "……어라. 반응이 왜 그렇죠? 요즘 유행하는 모모프렌즈인데…… 호, 혹시 모르시나요?"
31130-169 = "으음…… 처음 보는 데요, 전……."
31130-170 = "네?!"
31130-171 = "뭐, 뭐야? 이 기분 나쁘게 생긴 건……. 돼지……? 하마……?"
31130-172 = "아, 아니에요! 페로로 님은 새라구요! 보세요, 여기 날개도 달렸잖아요! 부리도 있다구요!"
31130-173 = "……. 눈이 기분 나빠…… 이름도 이상하고……."
31130-174 = "네?! 아니, 그렇다는 평가도 받긴 하지만…… 자세히 보면 귀여운 부분이……."
31130-175 = "아아, 히후미 쨩의 가방이랑 폰 케이스에 있는 그 동물이네요. 이제 생각났어요."
31130-176 = "분명, 혀를 내밀고 침을 흘리면서 이제 그만 용서해줘를 외치는 그런 캐릭터였죠?"
31130-177 = "네?! 그런 설정 없는데요?!"
31130-178 = "난 이런 기분 나쁜 건 됐으니까 안 줘도 돼."
31130-179 = "아, 아우……."
31130-180 = "(지긋이-) ……."
31130-181 = "아, 아즈사 쨩……?"
31130-182 = "귀……."
31130-183 = "……귀?"
31130-185 = "귀여워!!!"
31130-186 = "?!"
31130-187 = "?!"
31130-188 = "어머나……?!"
31130-190 = "엄청 귀여워! 이건 뭐지? 이 동글동글하고 푹신하게 생긴 생물은 뭐야? 새? 새라고?"
31130-191 = "표정을 읽을 수가 없어…… 저 눈……! 무슨 생각을 하고 있는지 하나도 모르겠어……!!"
31130-192 = "아즈사 쨩…… 손가락이 이상하게 꿈틀거리고 있는데요……?"
31130-193 = "어…… 네! 역시 아즈사 쨩, 페로로 님의 귀여움을 알아보시는군요! 맞아요! 그 부분이 귀여운 거예요!"
31130-194 = "뭐?!"
31130-195 = "이건? 이 허리가 긴건 뭐야? 도롱뇽인가…… 아니, 기린? 하여튼 목에 감고 다니면 포근할 것 같아……!"
31130-196 = "그건 웨이브캣이에요. 언제나 웨이브를 추고 있는 고양이인데, 최근에 목베개 굿즈가……."
31130-197 = "이건? 이 쪼그만 건?"
31130-198 = "그건 Mr. 니콜라이 씨! 언제나 철학적인 말을 던져서 따돌림을 당하고 있는 분이에요!"
31130-199 = "이번에 니콜라이 씨가 쓴 <선악의 저편>도 있어요, 초판본으로요! 나중에 보고 싶으면 말해주세요."
31130-200 = "굉장해……!! 굉장해!! 이걸 주는 거야? 이 중에 골라도 되는 거야?"
31130-201 = "어, ……네! 네! 아즈사 쨩이 원하는 걸 가져가세요!"
31130-206 = "……."
31130-207 = "……."
31130-209 = "……하아. 이정도의 포상이라면, 전력을 다하지 않을 수 없겠군."
31130-213 = "동기부여가 되었어, 히후미. 약속할게. 반드시 임무를 완수하고 저 이상하고 폭신폭신한 것들을 받아내고야 말겠어."
31130-218 = "……헤헤헤. 응, 파이팅이에요."
31130-222 = "……에헤헤헤헤."
31130-226 = "어머나…… 어쩐지 히후미 쨩 즐거워 보이네요♡"
31130-227 = "[s] \"동지를 만난 기분이려나…….\""
31130-228 = "……기분 나빠."
31130-230 = "다음화;정의실현부의 부부장 1"
