[translation]
1012705-1 = "안 되나요?"
1012705-2 = "(미요와 만나기로 한 약속 장소로 나왔다.)"
1012705-4 = "빈티지샵 상점가"
1012705-6 = "[ns] \"후후, 오셨군요. 기다리고 있었습니다.\""
1012705-7 = "뭐, 뭔가요, 그거."
1012705-8 = "대체 저를 어떻게 생각하고 계신 거예요?"
1012705-9 = "[s] \"어…… 범죄 소설의 여왕님?\""
1012705-10 = "안 써요 그런 거……!"
1012705-11 = "잘…… 쓰기는 하지만!"
1012705-12 = "[s] \"그런데 무슨 일로 부른 거야?\""
1012705-13 = "아, 이 빈티지샵 거리에서 구해야 할 밀수품이 있거든요."
1012705-14 = "그런데 혼자서 찾는 것보다는 둘이서 찾는 편이 더 효율적이니까…… 그래서……."
1012705-15 = "[s1] \"역시 특수교역부의 부장님…….\"\n[s2] \"손수 밀수에 앞장을 서시는군요.\""
1012705-18 = "……이번 한 번만 하고 손 씻을 거예요."
1012705-19 = "[s] \"아 그러시군요!\""
1012705-20 = "우으으……!"
1012705-21 = "노, 놀리지 마세요!"
1012705-22 = "[s3] \"저기, 그런데…….\"\n[s4] \"오늘의 외출 허가는 어떻게 받은 거야?\""
1012705-25 = "아…… 외출 허가……."
1012705-26 = "으음, 그게 어떻게 된 거냐면요……."
1012705-27 = "……안 받았어요."
1012705-28 = "[s] \"……응?\""
1012705-29 = "그, 그게요, 와일드헌트에 자유외출부라는 동아리가 있거든요."
1012705-30 = "오늘 외출을 위해서 그 부원들의 도움을 받았어요."
1012705-31 = "[s] \"……와일드헌트는 대체 어떤 곳일까.\""
1012705-32 = "뭐…… 예술만으로 먹고 살겠다는 학생들이 모인 곳이니까요……."
1012705-33 = "다, 당연히 제정신인 학생들은 얼마 없겠죠……."
1012705-34 = "[s]\"근데 너도 그 학원의 일원이잖니…….\""
1012705-35 = "자, 그러면 출발해 볼까요?"
1012705-36 = "[s] \"무시당했어……!\""
1012705-40 = "여기 이 타자기 좀 보세요, 선생님! 밀키스윗 42 모델이에요!"
1012705-41 = "[s] \"디자인이 예쁘네.\""
1012705-42 = "예. 하지만 시장에서 외면받고 단종된 비운의 모델이죠."
1012705-43 = "[s] \"어쩌다 외면받았을까…….\""
1012705-44 = "인체공학적 구조를 위해서 자체 개발한 자판 배열을 적용했거든요."
1012705-45 = "하지만 기존 자판 배열과 너무 달라서 시장에서 버려졌지요."
1012705-46 = "그래서 초도 물량 100만 대를 생산한 것을 끝으로 역사에서 사라졌고요."
1012705-47 = "[s5]\"초도 물량으로 100만 대를 뽑다니…….\"\n[s6]\"얼마나 자신감이 넘쳤던 거야…….\""
1012705-50 = "뭐, 그 덕에 저도 한 대 가질 수 있었던 거지만요."
1012705-51 = "어? 여기 보세요, 선생님! 데민톤 사의 타자기와 만년필을 같이 팔고 있어요!"
1012705-53 = "(그렇게 미요와 함께 타자기를 비롯해 많은 빈티지 상품들을 구경했다.)"
1012705-54 = "(그러던 중, 미요가 한 가게 앞에서 우뚝 멈춰 섰다.)"
1012705-57 = "잠시만 기다려주세요, 선생님!"
1012705-62 = "(미요가 웬 보따리 하나를 들고 가게 밖으로 나왔다.)"
1012705-64 = "자, 가요, 선생님!"
1012705-65 = "[s] \"저기, 그 보따리는……?\""
1012705-66 = "아, 자유외출부에게 지불해야 하는 밀수품이에요."
1012705-67 = "[s] \"자유외출부?\""
1012705-68 = "네. 이걸 가져다주는 대가로 자유외출부가 제 외출을 도와준 거라……."
1012705-69 = "……아."
1012705-70 = "[s7] \"아 밀수를 하려고 외출을 한 게 아니고…….\"\n[s8] \"그냥 외출을 하고 싶었던 거구나!\""
1012705-73 = "어, 아, 그, 그, 그……."
1012705-77 = "……그럼 안 되나요?"
1012705-78 = "[s9] \"안 되긴.\"\n[s10] \"누구에게나 무작정 나가고 싶은 날이 있는 법…….\""
1012705-81 = "선생님 보려고 외출하면, 안 되나요?"
1012705-85 = "[ns] \"엣.\""
1012705-87 = "[ns] \"나?!\""
1012705-88 = "저, 저번에 선생님도 저 보고 싶다고 하셨잖아요!"
1012705-89 = "너무너무 보고 싶다고 하셨잖아요! 모모톡에서!"
1012705-90 = "[s] \"분명 그러긴 했는데……!\""
1012705-91 = "이, 이제 알겠죠? 서, 선생님이 나쁜 거예요!"
1012705-92 = "그, 그러니까 얌전히 따, 따라오세요!"
1012705-93 = "아직 볼 타자기들이 한가득이니까……요……."
1012705-95 = "(그렇게 한참을 더 미요와 함께 시장 골목을 누볐다.)"
