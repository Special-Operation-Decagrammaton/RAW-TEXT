[translation]
2601002-1 = "부둣가의 저격수"
2601002-2 = "어촌 부둣가 선착장"
2601002-3 = "(다음 날, 미유의 상태를 확인해 보기 위해 그녀가 훈련을 하고 있다는 부둣가의 선착장에 가 보았다.)"
2601002-4 = "(부두 끝에 도착했지만, 낚시꾼 몇을 제외하고는 미유의 모습은 보이지 않았다.)"
2601002-5 = "……어라?"
2601002-6 = "선생님……?"
2601002-7 = "[s1] \"……미유?\"\n[s2] \"응? 어디서 목소리가…….\""
2601002-10 = "여기예요. 선생님……. 저…… 부두 끝에……."
2601002-11 = "이쪽이에요……."
2601002-14 = "[ns] \"그곳에서 낚시를 하고 있었구나.\""
2601002-15 = "[wa:600]― [log=미유 수영복]후후…… [wa:1200]선생님께서 [wa:650]바로 눈치 못채다니,[wa:150] [/log]"
2601002-17 = "― [log=미유 수영복]이번 위장도 [wa:500]완벽했나 보네요.[/log]"
2601002-20 = "[wa:1800]― [log=미유 수영복]나무를 숨기려면 [wa:1000]숲이 좋다는 말처럼……[/log]"
2601002-23 = "― [log=미유 수영복]낚시꾼들 사이에 [wa:800]섞여 있으려면[/log]"
2601002-25 = "― [log=미유 수영복]낚시하는 모습이[wa:700] 자연스러우니까요.[/log]"
2601002-28 = "[wa:1700]― [log=미유 수영복]……갈매기나 바닷새가 [wa:1250]자꾸 머리에 올라타려 하는 건,[wa:70] [/log]"
2601002-30 = "― [log=미유 수영복]조금 곤란하지만……[/log]"
2601002-33 = "― [log=미유 수영복]이런 일은……. [wa:1800]익숙하거든요…….[/log]"
2601002-35 = "― [log=미유 수영복]후후, [wa:1600]후후후……[/log]"
2601002-38 = "[wa:1800]― [log=미유 수영복]마침 [wa:600]낚시 도구가 있어 [wa:1100]이곳으로 한 거지만,[wa:100] [/log]"
2601002-40 = "― [log=미유 수영복]잠복하기에 [wa:1250]딱 좋은 장소네요.[/log]"
2601002-43 = "― [log=미유 수영복]시야도 [wa:700]탁 트인 곳이라,[/log]"
2601002-45 = "― [log=미유 수영복]주변을 감시하기에도 [wa:1700]완벽해요.[/log]"
2601002-48 = "― [log=미유 수영복]바람도 선선하게 불어서 [wa:1900]덥지도 않고,[/log]"
2601002-50 = "― [log=미유 수영복]볕을 가려줄 [wa:400]밀짚모자도 있고……[/log]"
2601002-53 = "[wa:1600]― [log=미유 수영복]그, [wa:1300]그리고……. [wa:2200]오늘은……[/log]"
2601002-56 = "― [log=미유 수영복]서, [wa:1400]서, [wa:1700]선생님도……[/log]"
2601002-58 = "― [log=미유 수영복]……함께 계시니까요.[/log]"
2601002-62 = "우, 우아앗……?"
2601002-63 = "미, 미안……! 거기서 낚시를 하고 있는 줄은 몰랐어……!"
2601002-64 = "아, 아니에요…… 존재감이 부족한 제 잘못이니까요……"
2601002-65 = "[s] \"괜찮아, 미유?\""
2601002-66 = "……네. 뱃고동 소리에 놀란 것뿐이에요……"
2601002-67 = "방금 보신 것처럼 여기서도 제 존재감이 너무 낮아서, 어부분들이 제 낚싯대 앞으로 배를 가까이 대거나…… 바닷새들이 모여들거나 해서……"
2601002-68 = "정작 낚시에는 제대로 집중하지 못하게 되는 것 같네요……."
2601002-69 = "하지만 어차피 제 존재감 때문에 이런 일이 생기는 데에는 익숙하고…… 하하……"
2601002-70 = "[s5] \"조, 좋게 생각하자! 좋게!\"\n[s6] \"잠입 중이니까 오히려 다행일지도 몰라.\""
2601002-73 = "그, 그런가요……"
2601002-79 = "……어라?"
2601002-80 = "……이, 이 느낌은……?"
2601002-81 = "[s7] \"뭔가 물었어……?\"\n[s8] \"입질이다! 고기가 물었어!\""
2601002-84 = "으읏……. 빨리 낚싯줄을 감아올려야……!"
2601002-85 = "으윽……! 이, 이거, 생각보다 무거워서…… 으으읏……!!"
2601002-86 = "하으읏……!!!"
2601002-95 = "자, 잡았나…………?"
2601002-97 = "……이, 이건……."
2601002-101 = "[ns9] \"……대어다.\"\n[ns10] \"엄청난 크기네, 이 물고기…….\""
2601002-104 = "……그, 그런가요?"
2601002-105 = "사실 바다낚시는 경험이 별로 없어서 얼마나 큰 건지는 잘 모르겠는데—"
2601002-109 = "……!! 모두 저기 좀 봐! 저기, 저 학생이 낚은 거! 엄청난데!"
2601002-110 = "엄청난 대물이잖아! 여기서도 저런 물고기가 낚인다고!?"
2601002-111 = "네, 네……? 저, 저는 이 지역은 처음이라 잘……"
2601002-112 = "학생, 도대체 그 물고기는 어떻게 낚은 거야?"
2601002-113 = "그 물고기는 조심성이 높은 종이기 때문에 사람 냄새가 나면 어지간해서는 미끼를 물지 않는데……"
2601002-114 = "보기와는 다르게 엄청난 실력자라든가……?"
2601002-115 = "그, 그렇지 않아요…… 저 같은 건 그저……"
2601002-116 = "존재감이 적고 남들의 눈에 잘 띄지 않는 게 특기일 뿐인데……"
2601002-117 = "[s11] \"존재감이 낮아서 조심성 많은 대어를 낚다니……\"\n[s12] \"새삼스럽지만 굉장한 재능이네.\""
2601002-120 = "그, 그런……"
2601002-121 = "물고기의 의심을 피할 수 있을 정도로 기척을 죽일 수 있다니 부러운 재능이네."
2601002-122 = "가능하다면 나도 그런 능력을 갖고 싶은 정도야……"
2601002-123 = "뭔가 특수한 훈련이라도 하는 거야?"
2601002-128 = "그, 그게 그러니까…… 저 같은 건……"
2601002-129 = "으아아아……"
2601002-131 = "(이후, 낚시꾼들의 질문을 받느라 패닉에 빠진 미유를 데리고 부둣가를 빠져나왔다.)"
