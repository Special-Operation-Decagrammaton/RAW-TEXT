[translation]
2002802-1 = "불안한 마음"
2002802-2 = "(히나타가 기다리고 있는 해변가로 향했다.)"
2002802-9 = "(해변에 놓인 선베드와 파라솔 옆에서, 어색하게 서 있던 히나타의 모습이 보였다.)"
2002802-15 = "[ns1] \"……히나타? 무슨 일 있어?\"\n[ns2] \"괜찮아? 안색이 안 좋은데…….\""
2002802-20 = "아, 아! 선생님!!"
2002802-21 = "와 주셔서 감사해요. 별것도 아닌 일로 괜히 시간을 쓰시게 만들어서……."
2002802-22 = "……네? 무슨 일이냐고요? 이것들은 뭐냐고요?"
2002802-23 = "아, 이건……"
2002802-29 = "그러니까, 이건 선베드고……. 이건 파라솔인데……."
2002802-30 = "아니, 아니! 생각해 보니 선생님께서 그걸 모르실 리는 없겠네요! 죄송해요! 제가 무슨 소릴!"
2002802-31 = "그러니까 이걸 왜 준비했냐면……. 으음……. 그게……."
2002802-32 = "그러니까……. 이걸 어떻게 설명 드려야 하지……. 하하……."
2002802-33 = "그……."
2002802-34 = "그걸 저도 잘……. 모르겠어서……요. 고민 상담을 드리고 싶다고 한 부분도 바로 그 부분이에요."
2002802-35 = "일단 해야 할 거 같아서 하긴 했는데……. 말이에요."
2002802-36 = "[s3] \"좀 더 자세히 설명해 줄 수 있을까?\"\n[s4] \"해야 할 거 같아서 했다고?\""
2002802-39 = "으음……. 저도 계속 말씀드리면서 이게 무슨 말인가 싶지만……."
2002802-40 = "지금은 일단 쉬는 시간이고……. 이왕 여기까지 왔으니 마음 편하게 푹 쉬자……! 그렇게 생각하기로 했거든요."
2002802-41 = "출발할 때 자매님들께서도 그렇게 말씀해 주셨고요. 조사를 도울 때에는 열심히 돕지만, 쉴 때에는 확실하게 쉬고 오라고……."
2002802-42 = "그치만 그게 잘 안되네요. 뭐라고 해야 할까요. 마음 한 켠이 불편하다는 느낌이 계속 들어서……."
2002802-43 = "뭔가……. 저만 이래도 되나 싶고……."
2002802-44 = "하하……하……. 어쩌면 평소랑 너무 다른 하루를 보내고 있어서 그런 걸지도요."
2002802-45 = "보통은 아침 일찍 일어나서, 하루 일과를 쭉 보내는 게 당연하고."
2002802-46 = "일과가 다 끝날 때 즈음에는 저녁이 다 돼가니, 다른 자매님들과 뒷정리를 하고."
2002802-47 = "……그리고 지금도 성당에선 다들 그러고 계시겠죠? 해야 할 일들을 하시고……. 뒷정리를 하시고……."
2002802-48 = "그리고 본래 제가 해야 했던 일들도……. 제가 없으니, 다른 분들께서 구태여……."
2002802-49 = "…………."
2002802-50 = "[s5] \"혼자 쉬는 거 같아서 미안한 거야?\"\n[s6] \"일을 떠넘겼다는 느낌을 받는 거야?\""
2002802-55 = "무, 물론, 그렇게 생각하면 좋지 않다는 것도 알고 있어요."
2002802-56 = "하지만 그래도, 뭔가……."
2002802-57 = "……역시 익숙하지 않네요. 머리로 그렇게 생각하는 것과 마음으로 그렇게 느끼는 건."
2002802-58 = "이래서야 자매님들께서 말씀하신 '잘 쉬고 오는 것'도 제대로 못 할 것 같아 걱정이라……."
2002802-62 = "……네?"
2002802-63 = "자리 편 뒤에 누워 본 적이 있냐고요?"
2002802-64 = "아, 아뇨. 아직은……. 어색해서 그냥 구경만 하고 있었는데요……."
2002802-65 = "……일단 누워 보라고요? 선베드에?"
2002802-66 = "으, 으음……? 뭐, 뭔가 생각하신 이유라도……."
2002802-70 = "아, 아니죠. 선생님께서 그리 말씀하셨으니……."
2002802-71 = "네. 알겠습니다. 일단 누워 볼게요."
2002802-75 = "우선 이렇게 앉아서, 다리를 펴고……."
2002802-82 = "[wa:200]― [log=히나타 수영복]으음……. [wa:850]으으음……? [wa:1200]어라……?[/log]"
2002802-85 = "― [log=히나타 수영복]여기……[/log]"
2002802-87 = "― [log=히나타 수영복]생각했던 것 이상으로 [wa:1100]편하네요….[/log]"
2002802-90 = "[wa:400]― [log=히나타 수영복]적당히 시원하고, [wa:1950]너무 춥지도 않고…[/log]"
2002802-92 = "― [log=히나타 수영복]얼굴은 [wa:400]그늘에 가려지고…….[/log]"
2002802-95 = "― [log=히나타 수영복]따끈따끈해서…[/log]"
2002802-97 = "― [log=히나타 수영복]누워 있으면, [wa:1550]잠이 들 것 같아요.[/log]"
2002802-100 = "[wa:550]― [log=히나타 수영복]그런데 [wa:850]그…[/log]"
2002802-102 = "― [log=히나타 수영복]선생님 앞에서 저만, [wa:2200]누워있는건……[/log]"
2002802-105 = "[wa:100]― [log=히나타 수영복]뭐, [wa:750]뭔가..... [wa:1180]죄송한 것 같은…….[/log]"
2002802-108 = "[ns7] \"안 돼. 이쪽은 신경 쓰지 마.\"\n[ns8] \"지금은 본인의 감각에만 집중해.\""
2002802-109 = "[wa:150]― [log=히나타 수영복]아, [wa:850]알겠어요.[/log]"
2002802-110 = "[wa:150]― [log=히나타 수영복]아, [wa:850]알겠어요.[/log]"
2002802-112 = "[wa:100]― [log=히나타 수영복]그럼 [wa:1100]말씀대로……. [/log]"
2002802-115 = "― [log=히나타 수영복]마음을 놓고… [wa:1680]편안하게…[/log]"
2002802-118 = "[wa:350]― [log=히나타 수영복]……흐으응……. [wa:3750]음냐……. [wa:1550]흐헤헤…….[/log]"
2002802-121 = "― [log=히나타 수영복]……헉!? [wa:550]저, [wa:850]저 방금 무슨……!?[/log]"
2002802-124 = "― [log=히나타 수영복]잊, [wa:500]잊어주세요,[/log]"
2002802-126 = "― [log=히나타 수영복]지금 건 [wa:400]잊어주세요! [wa:950]선생님!![/log]"
2002802-130 = "선생니이이임~!!"
2002802-132 = "(이후 허둥대던 히나타를 달래 준 뒤, 편히 쉬라고 재차 분위기를 풀어주었다.)"
2002802-133 = "(어쩔 줄 몰라 하던 것도 잠시, 다시 자리에 누운 히나타는 순식간에 곯아떨어졌다.)"
