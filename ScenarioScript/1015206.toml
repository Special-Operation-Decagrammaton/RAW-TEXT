[translation]
1015206-1 = "#title;빛과 어둠"
1015206-2 = "#na;(약속 시간에 맞춰 츠무기와 와일드헌트 미술관으로 향했다.)"
1015206-4 = "3;츠무기;00\n#3;a\n#wait;1000"
1015206-5 = "3;츠무기;03;오늘은 이곳에서 여러 작품을 감상하며 감수성을 쌓아볼까 해요.\n#3;em;[반응]"
1015206-6 = "3;츠무기;99;음악은 마음속의 리듬을 표현하는 것."
1015206-7 = "3;츠무기;01;다양한 영역의 예술을 관람하는 것으로도 이러한 리듬이 풍부해지죠."
1015206-8 = "3;츠무기;03;마침 새로운 미술 작품전이 개최된다고 하니 타이밍이 딱 맞네요.\n#3;em;[음표]"
1015206-9 = "3;츠무기;08;저의 창작 활동에 엄청난 도움이 될 거라 믿어 의심치 않아요."
1015206-10 = "[s1] \"그건 나도 동의하는데…….\"\n[s2] \"그러기엔 이번 작품전 주제가 좀 특이하네.\""
1015206-13 = "3;츠무기;02;네?\n#3;em;[?]"
1015206-14 = "3;츠무기;01;<예술에 깃든 어둠>의 어느 부분이요?"
1015206-15 = "[s] \"어둠이 메인이라니……!\""
1015206-16 = "3;츠무기;03;후후…… 인간의 내면을 고찰한다는 점에서 꼭 필요한 주제라고 생각하는데요."
1015206-17 = "3;츠무기;01;그런 의미에서 오늘은 제가 선생님의 도슨트가 되어볼까 해요.\n#3;em;[반짝]"
1015206-18 = "3;츠무기;08;어둠에 대한 탐구라면 누구에게도 지지 않을 자신이 있거든요."
1015206-19 = "[s3] \"인간이 죽는 것이 사회복지……?\"\n[s4] \"나는 예술의 테러리스트……?\"\n[s5] \"내 앞에 바짝 엎드려라 폭도들아……?\""
1015206-23 = "3;츠무기;02;어머나? 그건 전부 평화를 이야기하는 노래였다고요?\n#3;em;[?]"
1015206-24 = "3;츠무기;03;아무튼 어떤 작품이 있는지, 같이 둘러볼까요?"
1015206-26 = "[ns] \"어? 이 그림은……?\""
1015206-28 = "1;츠무기;02;어라? 시작부터 익숙한 것이 나왔네요.\n#1;a"
1015206-29 = "1;츠무기;01;이것은 와일드헌트의 이름을 팔아 부당 이득을 취했던 대표적인 그림."
1015206-30 = "1;츠무기;99;평의회의 끈질긴 추격 끝에 범인을 붙잡고, 불법으로 모은 자금도 회수했습니다만…….\n#1;em;[…]"
1015206-31 = "1;츠무기;03;와일드헌트의 이름을 팔면 돈이 된다는 안 좋은 선례를 남기고 말았네요."
1015206-32 = "1;츠무기;01;이 사건을 잊지 말자는 의미에서 입구에 걸어 두었나 봐요."
1015206-33 = "#st;[0,0];instant;1;"
1015206-35 = "1;츠무기;01\n#1;m3\n#wait;1500"
1015206-36 = "[ns] \"이걸 보며 각성하자는 의미인 거구나…….\""
1015206-37 = "1;츠무기;02;팔린 그림을 모두 회수하진 못했으니, 지금도 어딘가에 걸려있을지도 모르겠네요."
1015206-38 = "1;츠무기;99;학원의 정식 작품은 아닙니다만, 부정한 돈과 연관되었다는 점에서 확실한 어둠이군요."
1015206-39 = "1;츠무기;03;아무튼 고생하는 평의회에 격려의 박수를."
1015206-40 = "1;츠무기;00;이제 다음 작품을 감상해 볼까요?\n#1;em;[?]"
1015206-42 = "#na;(이후 계속해서 어둠에 관련된 작품들을 감상했다.)"
1015206-43 = "#na;(방금 보았던 그림처럼 명의도용이나 모작을 통해 예술계의 어둠을 표현한 것도 있었고…….)"
1015206-44 = "#na;(지옥 밑바닥, 끝없는 심연, 절규하는 사람 등등…… 작품 자체에 어둠을 표현한 것도 많았다.)"
