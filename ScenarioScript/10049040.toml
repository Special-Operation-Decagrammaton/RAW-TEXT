[translation]
10049040-1 = "제4화;두 사람은 마법소녀!"
10049040-2 = "대기실"
10049040-3 = "우와아!! 여기가 대기실!!"
10049040-4 = "마법소녀물의 캐스트가 된 기분입니다!"
10049040-5 = "쉬, 쉿! 조용히 하세요, 레이사 씨!"
10049040-7 = "흐음……."
10049040-8 = "두 분, 공연하러 온 거 맞죠?"
10049040-9 = "캐스팅 명단에 없었던 것 같은데……. 명단을 사무실에 두고 와버렸으니 원……."
10049040-10 = "!!"
10049040-15 = "(저희가 외부인이라는 사실이 발각되면…….)"
10049040-16 = "(잠입했다는 사실이 발각되고 말겠네요……. 그렇다면 목표는 눈치를 챌 겁니다.)"
10049040-17 = "(어쩌지…… 어쩌지……?)"
10049040-18 = "(뭐라도, 생각을 해야 하는데…….)"
10049040-22 = "피딩램프에서 챔버까지. 6조 우선의 마법이여! 흔들리지 않을 힘을!"
10049040-28 = "볼트 포워드. 테르밋 핑크, 등장!"
10049040-29 = "오케이! 저희 모두 준비 완료입니다!"
10049040-30 = "레이사 씨?!"
10049040-31 = "자자! 스즈미 씨도 자연스럽게 포즈 잡으시면 됩니다!"
10049040-32 = "으……으우……."
10049040-38 = "매지컬, 리리컬…… 테르밋 화이트!"
10049040-42 = "그, 그렇군요. 10분 뒤에 쇼 시작이니 그때 나오시면 됩니다."
10049040-46 = "갸…… 갸아아악……."
10049040-47 = "휴, 일단 위기는 넘겼습니다!"
10049040-48 = "레이사 씨! 대응은 잘하셨지만 이제 어떡하죠?"
10049040-49 = "하필 이런 우연이 겹쳐버리다니, 이러다가 저희가 대신 공연에 나가게 생겼는데요?!"
10049040-50 = "[s1] \"그렇지만 오히려 잘된 것 아닐까?\"\n[s2] \"무대 위라면 내려다보기 더 편할지도.\""
10049040-53 = "그, 그런가요……."
10049040-54 = "그렇지만, 저…… 이런 마법소녀물은 어릴 때 본 게 전부고……."
10049040-55 = "무엇보다 수많은 사람들 앞에 선다는 게……. 상상만으로 무서워서……."
10049040-56 = "스즈미 씨는 엄청 멋져요! 걱정할 필요 없습니다!"
10049040-57 = "다른 사람 앞에서 자경단으로 활약은 잘하시잖아요?"
10049040-58 = "그것과 이건 전혀 다른 문제예요!"
10049040-59 = "어떡하죠…… 어쩌지……."
10049040-61 = "[ns3] \"잠시 시간만 끌면 안 될까?\"\n[ns4] \"아무 대사라도 하면서 시간을 끌어보자.\""
10049040-64 = "그렇지만 이런 대사는 잘 모릅니다……."
10049040-65 = "우핫! 마법소녀의 대사!"
10049040-66 = "맡겨만 주세요!"
10049040-73 = "레이사 씨? 그건…… 펜인가요?"
10049040-74 = "'펜'이 아닙니다!"
10049040-75 = "'매지컬 컨닝.'입니다!"
10049040-76 = "지금부터 이걸로!"
10049040-77 = "스즈미 씨의 손에! 대사를 써 드리겠습니다!"
10049040-82 = "잠시만요! 갑자기 그러시면, 으앗!!"
10049040-87 = "가, 가가가, 간지러워요! 킥, 킥킥, 아하하하!!"
10049040-89 = "[ns] (스즈미도 저렇게 웃을 줄 아는구나)"
10049040-95 = "준비 오케이입니다!"
10049040-96 = "허억, 헉……."
10049040-97 = "저는 간지럼에 약합니다……."
10049040-98 = "특히 손바닥은 더더욱 약한데……!!"
10049040-99 = "그래도 써 둔 것만 읽으시면 충분할 거예요!"
10049040-100 = "그런 게 통할 리가……."
10049040-105 = "자, 공연 시작입니다! 얼른 나가세요!"
10049040-107 = "네!!"
10049040-108 = "아, 아직 읽어보지도 못했는데, 자, 잠시만요……!"
10049040-109 = "상대역인 시미코 씨가 없어도 되나요?!"
10049040-110 = "일정표를 보니까 무대에서 자기소개만 하면 된다고 합니다!"
10049040-112 = "[ns5] \"힘내!\"\n[ns6] \"테르밋 화이트, 힘내!\""
10049040-115 = "으, 으아아아!!"
10049040-121 = "테르밋 화이트다!!"
10049040-122 = "테르밋 핑크도 있어!"
10049040-123 = "화이트 언니 예쁘다!! 공주님 같아!!"
10049040-125 = "(아까는 관객들이 이렇게 많지 않았는데요?!)"
10049040-126 = "(사람들의 함성소리, 기대하는 얼굴…….)"
10049040-127 = "(무, 무서워. 무서워, 무서워.)"
10049040-128 = "(저는, 못, 저는 못해요, 이런 거, 기대받는 것, 저는…….)"
10049040-129 = "볼트 포워드! 테르밋 핑크, 등장!"
10049040-130 = "와아아아아!!"
10049040-131 = "레이사 씨?!"
10049040-132 = "스즈미 씨! 이제 주인공의 차례입니다!"
10049040-133 = "최고로 멋진 스즈미 씨의 최고로 멋진 모습, 보여주는 거예요!"
10049040-134 = "(레이사 씨는 어쩜 이렇게 당당하고 용감하게……!)"
10049040-135 = "……후우,"
10049040-139 = "볼트 캐치! 테르밋 화이트, 등장!"
10049040-140 = "와아아아아아아아!!!"
10049040-142 = "테르밋 화이트!! 테르밋 화이트!!"
10049040-143 = "와아아아아!!"
10049040-147 = "[ns] \"최고다!! 테르밋 화이트 쨩!!!\""
10049040-149 = "아하하하! 선생님 목소리 엄청 크시네요!!"
10049040-150 = "선생님……!"
10049040-151 = "크흠……! 큰일입니다, 화이트! 이 놀이공원에 에라와 그 부하들이 있다고 합니다!"
10049040-152 = "엣, 아. 핑크, 그게 정말인가요?"
10049040-153 = "네! 우정 에너지를 뺏어가려는 것 같아요!"
10049040-168 = "(어떻게든, 괜찮게 넘어간 것 같네요.)"
10049040-169 = "(이 무대에서는 유원지 전체가 잘 보여서, 관측 상의 이점도 있고…… 이 정도면 꽤…….)"
10049040-170 = "(어라? 땀이…….)"
10049040-175 = "(아앗?! 무심코 손으로 땀을 닦다가 손에 적은 대사가……!)"
10049040-176 = "(다 번져버렸어요?!)"
10049040-177 = "테르밋 화이트! 어떻게 하실 건가요?"
10049040-182 = "……스즈미 씨! 대사입니다!"
10049040-184 = "[ns] \"스즈미?!\""
10049040-185 = "어, 어으…… 에엑……."
10049040-186 = "저는, 케이크? 랑 버터……? 를 줄 거…… 예요……?"
10049040-187 = "네??"
10049040-189 = "[ns] (저게…… 무슨 대사지?)"
10049040-191 = "테르밋 화이트?"
10049040-192 = "왠지 좀 이상해!"
10049040-193 = "우리 테르밋 화이트는 이렇지 않아!"
10049040-195 = "과, 과연! 화이트는 '슈가 매지컬 파워'를 쓸 생각이군요!"
10049040-196 = "핑크도 준비하겠습니다!"
10049040-197 = "같이 필살기를 연습해 볼까요?"
10049040-198 = "모두-! 힘을 빌려주시는 겁니다!"
10049040-200 = "네!!!"
10049040-201 = "준비됐어요!"
10049040-203 = "[ns7] \"레이사가 애드리브로 넘겼어!\"\n[ns8] \"나이스 레이사!\""
10049040-207 = "(필살기의 대사, 이건 지워지지 않았는데,)"
10049040-212 = "(안 돼, 입 밖으로 나오질 않아요…….)"
10049040-213 = "(레이사 씨처럼 임기응변도 못 하고, 나는…….)"
10049040-218 = "모…… 모두의 평화를 위해…… 그 누구도……."
10049040-219 = "누구도, 아, 알아주지 않아도……."
10049040-223 = "대체 왜 굳이 자경단 같은 일을 하는 거야? 아무도 알아주지 않잖아?"
10049040-224 = "제가, 그렇다고요……?"
10049040-228 = "역시."
10049040-229 = "……나…… 는……."
10049040-233 = "못…… 해요……."
10049040-239 = "[ns] \"스즈미……!\""
10049040-241 = "……."
