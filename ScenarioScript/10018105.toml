[translation]
10018105-1 = "에필로그;새해 복 많이 받으세요!"
10018105-3 = "(그렇게, 연말연시를 혼란의 소용돌이로 밀어 넣었던 일련의 소동은 일단락되었다.)"
10018105-8 = "아, 선생님! 빨리 오세요! 지금 막 현장 축제가 시작됐어요!"
10018105-11 = "축제 음식은 물론 저희들이 준비한 오세치랍니다. 설령 남는다고 해도 큰 걱정은 없겠습니다만."
10018105-12 = "오세치는 애초에 두고두고 먹는 음식이니까 말이지."
10018105-13 = "대단해! 새해란 정말 좋은 것 같아!"
10018105-14 = "뭐…… 애초에 이 정도 퀄리티의 음식이 남을 것 같지도 않지만요★"
10018105-15 = "……네가 말하니까 의미가 완전 다르게 들린다……"
10018105-16 = "사람을 모함하면 천벌을 받는대요★"
10018105-20 = "새해에는 정말 좋은 일만 있기를……"
10018105-21 = "그리고 꼭 맛있는 요리를 만들 수 있기를!"
10018105-22 = "선생님! 이것도 좀 드셔 보세요!"
10018105-23 = "부끄럽지만…… 제가 살짝 더, 신경을 썼거든요……"
10018105-24 = "후후후, 최고의 요리와 최고의 장소. 그리고 최고의 결말까지."
10018105-25 = "저는 궁극의 미식이란 게 무엇인지, 살짝이나마 엿본 것 같습니다."
10018105-26 = "이 기억은 저에게도, 미식연구회에게도, 분명 큰 의미가 되겠지요."
10018105-28 = "[ns] \"그러고 보니, 냐오모토 회장은?\""
10018105-29 = "'이걸로 끝이라고 생각하지 마라!'고 외치면서 도망가던데요?"
10018105-30 = "괜찮을까요…… 왠지 걱정이 되는데……"
10018105-31 = "신경 쓸 것 없답니다. 그런 대사를 남기는 사람 치고 제대로 된 경우를 본 적이 없으니까요."
10018105-32 = "여차하면 다시 우리들이 모여서 해결하면 되는 것 아닐까요★"
10018105-33 = "구르메 헬멧단 녀석들은 어떻게 할 거야?"
10018105-38 = "신경이 쓰이나요, 후우카?"
10018105-39 = "선생님……"
10018105-40 = "[ns] \"그 아이들은 내가 어떻게든 해 볼게.\""
10018105-44 = "[ns] \"충분히 반성했을 때의 이야기이지만.\""
10018105-49 = "여차하면 이곳 참새정에서 아르바이트 자리를 마련해 줄 수도 있고요."
10018105-50 = "에에에엥? 괜찮은 거야?"
10018105-51 = "근본이 나쁜 아이들 같지는 않았어요."
10018105-52 = "선생님과 이야기해 본 부분이기도 하고요."
10018105-53 = "[ns] \"학생들의 잘못은, 어른이 보충해야지.\""
10018105-55 = "나 참…… 다들 너무 사람이 좋다니까."
10018105-56 = "선생님. 언제나 감사드립니다."
10018105-57 = "저도 늘 감사드려요."
10018105-58 = "선생님이 계시지 않았다면…… 여기까지 해 낼 수 없었을 거예요."
10018105-60 = "새해 복 많이 받으세요. 선생님!"
10018105-62 = "새해 복 많이 받으세요."
10018105-63 = "새해 복 많이 받아."
10018105-64 = "새해 복 많이 먹어!"
10018105-65 = "그런 시간인가요?"
10018105-66 = "해피 뉴 이어★"
10018105-69 = "(키보토스에 새로운 한 해가 찾아왔다.)"
10018105-72 = "[ns] (이 시간이 모두에게 행복한 순간이 되기를.)"
10018105-74 = "[ns] (자기만의 길을 걷는 사람들에게도.)"
10018105-76 = "[ns] (그리고, 거기에서 조금 벗어난 길을 걷는 사람들에게도.)"
10018105-83 = "와앗?! 도미구이가 날뛰기 시작했어!"
10018105-84 = "죄, 죄송해요! 죄송해요! 제가 또 실수로……!"
10018105-85 = "뭘 어떻게 하면 도미구이가 살아나서 사람을 공격하는 거야?!"
10018105-90 = "후후후."
10018105-96 = "이것은 또, 미식연구회가 활약할 시간이군요."
10018105-101 = "하루나? 설마, 내가 생각하는 그건 아니지? 아닌 거지?!"
10018105-102 = "준비 완료에요, 하루나★"
10018105-103 = "그만 둬, 너희들. 뭐 하려는 거야. 여기 선생님도 계신다고. 축제 자리라고!"
10018105-105 = "에잇★"
10018105-117 = "하루나아아아아아?!"
10018105-119 = "[ns] (……모두에게, 행복한 순간이, 오기를……)"
10018105-121 = "새해의 아페리티프 ~신년 한판 승부~"
