[translation]
1008505-1 = "세상에서 가장 큰 서버"
1008505-2 = "베리타스 해커 휴게실"
1008505-3 = "(전날 밤. 하레가 베리타스 부실에서 보안 점검을 하고 있었을 때……)"
1008505-9 = "시스템 부하 문제없음. 비상 복구 프로세스도 정상적으로 작동하는 것 같고……"
1008505-10 = "어플리케이션 로그에도 이상이 없네. 이만하면 선배에게 문제없다고 확인 메일을 보내도 괜찮겠어."
1008505-11 = "어디 보자. 메일 클라이언트가……"
1008505-16 = "어라? 이게 무슨 메일이지? 아까 메일함을 열어 봤을 때는 분명 없었는데……"
1008505-22 = "……<익명의 도전장>?"
1008505-28 = "[ns1] \"어제 보안 점검을 하던 중 개인 메일함에서……\"\n[ns2] \"<익명의 도전장>을 발견했다고……?\""
1008505-31 = "응. 발신인도 명확하지 않고, 내용도 모호하게 쓰여 있었지만……"
1008505-32 = "메일의 제목에는 확실하게 <도전장>이라고 쓰여 있었어."
1008505-33 = "[s] \"혹시 누가 그냥 장난으로 보낸 게 아닐까?\""
1008505-34 = "평소라면 그렇게 생각하고 넘겼겠지만, 이 메일은 서버를 점검하던 중에 갑자기 생겨났거든."
1008505-35 = "무엇보다 이 도전장에는 서버를 경유한 흔적이 전혀 남아있지 않았어."
1008505-36 = "그 말인즉…… 이 <익명의 도전장>은 어느 해커가 흔적을 감춘 채 몰래 내 컴퓨터에 접속해 직접 작성했다는 뜻이겠지."
1008505-37 = "심지어 다른 때도 아니고, 내가 서버를 점검하는 틈을 타 이런 대범한 해킹을 시도하다니…… 새삼 열받네."
1008505-38 = "[s3] \"베리타스의 PC를 실시간으로 해킹하다니……\"\n[s4] \"누군지는 몰라도 엄청난 실력자인가 보네.\""
1008505-41 = "키보토스에 베리타스의 PC를 해킹할 수 있는 실력자가 그렇게 흔할 거라고는 생각할 수 없지만……"
1008505-42 = "이렇게 대놓고 한 방 먹었는데, 아무런 반응도 보이지 않고 넘어가는 건 해커로서의 자존심이 용납할 수 없지."
1008505-43 = "[s] \"메일의 내용에는 무어라 쓰여 있었어?\""
1008505-44 = "음…… 그게 말이야……"
1008505-45 = "메일에는 '키보토스에서 가장 많은 양의 정보가 담긴 서버의 위치'라는 말과 함께 암호화된 좌표 정보 하나가 첨부되어 있었어."
1008505-46 = "'키보토스에서 가장 많은 양의 정보가 담긴 서버'라니, 누가 봐도 허풍일 게 분명하지만……"
1008505-47 = "지금으로서는 이 익명의 해커에 대한 정보가 이 좌표뿐이라서."
1008505-48 = "[s] \"그럼 그 좌표로 직접 찾아가 보는 게 좋겠네.\""
1008505-49 = "그건 그렇지만…… 사실 이 좌표에는 한 가지 큰 문제가 있어."
1008505-50 = "그건 바로……"
1008505-52 = "……이 좌표가 가리키는 장소가 산 한가운데라는 점이야."
1008505-53 = "[s5] \"그게 무슨 문제인데?\"\n[s6] \"혹시 엄청나게 높은 산의 정상을 가리키고 있어?\""
1008505-54 = "……혹시라도 가봤는데 그 장소에 아무것도 없다면 괜히 체력만 낭비하는 셈이잖아."
1008505-55 = "아니. 도보로 오를 수 있는 평범한 산의 중턱이지만……"
1008505-56 = "……혹시라도 가봤는데 그 장소에 아무것도 없다면 괜히 체력만 낭비하는 셈이잖아."
1008505-57 = "선생님도 알겠지만, 나 같은 해커에게 등산 같은 야외 활동은 쥐약이나 다름없다고."
1008505-58 = "혹시라도 그 해커가 이 점을 악용해서 오르기 힘든 산 중턱의 좌표를 찍어 보낸 거라면, 결국 두 번이나 속게 되는 셈인데……"
1008505-59 = "혹시 산에 오르지 않고도 그 장소에 뭐가 있는지 알 수 있는 방법은 없을까?"
1008505-60 = "배터리를 잔뜩 실은 드론을 쓴다든가, 위성 카메라를 해킹한다든가……"
1008505-64 = "[ns] \"……같이 산에 올라가 보자.\""
1008505-65 = "우으…… 그 방법만큼은 쓰고 싶지 않아서 선생님께 물어본 건데……"
1008505-66 = "어쩔 수 없지. 선생님이 함께 가준다면 조금은 노력해 볼 수도 있고."
1008505-67 = "……알았어. 바로 옷을 갈아입고 올게."
1008505-73 = "(이후, 하레와 함께 등산 채비를 갖추고 익명의 해커가 지정한 장소로 향했다.)"
1008505-78 = "헉, 헉…… 허억……"
1008505-79 = "[s7] \"괜찮아, 하레?\"\n[s8] \"물이라도 좀 마실래?\""
1008505-82 = "괜찮아…… 이 정도는…… 간신히 버틸만한 편이야."
1008505-83 = "하지만 이렇게 고생하게 해 놓고서…… 대단치 않은 호박 귀신 같은 게 기다리고 있다면……"
1008505-84 = "그 해커가 키보토스의 어디 사는 누구든…… 각오하는 게 좋을 거야……"
1008505-87 = "[ns] \"다 도착한 것 같은데……\""
1008505-88 = "으음……"
1008505-89 = "이 산에 이런 건물이 있었던가……?"
1008505-93 = "최신 지도 어플리케이션에도 이 위치에 건물 같은 건 없다고 나오는데."
1008505-94 = "[s] \"버려진 데이터 센터라든가……?\""
1008505-95 = "아니. 이곳에 데이터 센터가 있었다는 이야기는 기록에서도 보지 못했어."
1008505-96 = "게다가 데이터 센터라기에는 건물의 구조가 이상해. 보통의 데이터 센터는 대용량의 서버에서 발생하는 열을 잡기 위해 건물 주변에 냉각 시설이 잔뜩 붙어있거든."
1008505-97 = "심지어 보안 대책도 거의 없는 것이 마치……"
1008505-98 = "[s] \"일단 들어가서 확인해 볼까.\""
1008505-99 = "……그래. 이 건물의 정체가 무엇이든 일단 안쪽에 들어가 보면 구조를 알 수 있겠지."
1008505-108 = "역시…… 데이터 센터라기에는 불필요한 공간이 너무 많아."
1008505-109 = "게다가 과거에 여러 사람이 지나다닌 흔적도 남아 있고…… '키보토스에서 가장 많은 양의 정보가 담긴 서버'가 있다고는 생각할 수 없는 장소인 걸."
1008505-113 = "어라? 여기 벽에 설치된 컴퓨터는 뭐지?"
1008505-114 = "[s] \"서버와 연결된 단말 컴퓨터일까?\""
1008505-115 = "글쎄…… 어디 한 번 살펴볼까……"
1008505-122 = "……으응?"
1008505-127 = "[ns9] \"처, 천장이 움직인다!\"\n[ns10] \"조심해, 하레!\""
1008505-130 = "아니, 이건…… 잠시만 기다려 봐, 선생님."
1008505-136 = "하아…… 역시, 속은 모양이네……"
1008505-137 = "선생님 여기 적혀 있는 글씨를 한 번 읽어봐 줄래?"
1008505-138 = "[s] \"키보토스 공립 제3 천문과학관에 오신 여러분을 환영합니다……\""
1008505-139 = "응. 아마 오래전에 폐쇄된 낡은 천문대였나 봐."
1008505-140 = "그러고 보니 어릴 적에 이 산에 있던 전파 천문대가 망원경이 노후화되어서 폐쇄되었다는 이야기를 들은 적이 있었는데…… 아마도 그 장소였나 봐."
1008505-141 = "컴퓨터 단말에 연결된 천장 개폐 시스템도 하늘을 관찰할 때 사용하는 장치일 테고…… 곳곳에 남아 있는 사람들의 흔적도 별을 관측하러 온 관람객들이 남기고 간 것이겠지."
1008505-142 = "정말이지…… 그 익명의 해커에게 완벽하게 속아버렸네."
1008505-143 = "[s11] \"그럼 '키보토스에서 가장 많은 양의 정보가 담긴 서버'라는 말도……\"\n[s12] \"사실은 거짓말이었으려나.\""
1008505-146 = "글쎄. 그 메일을 보낸 사람의 의도가 무엇이었을지는 모르겠지만……"
1008505-147 = "완전한 거짓말이라고 할 수는 없겠지."
1008505-148 = "우주의 별들이 아득히 먼 곳으로부터 보내오는 복사 에너지를 정보로 치환한다면, 일개 서버가 저장할 수 있는 용량을 아득히 뛰어넘을 테니까."
1008505-149 = "……밤하늘에 파묻힌 수많은 정보를 열람할 수 있는 천문대를, '키보토스에서 가장 큰 서버'라고 부르는 건 그리 큰 어폐가 아닐지도 몰라."
1008505-155 = "저기, 선생님. 이제 곧 해가 저물 때가 다 되었는데……"
1008505-156 = "괜찮다면 이곳의 망원경 위에서 같이 별을 보고 내려가지 않을래?"
1008505-157 = "여기까지 와서 소득 없이 내려가려니, 뭔가 아쉬워서……"
1008505-158 = "[s] \"그래. 같이 보고 돌아가자.\""
1008505-165 = "(그리고 하레와 함께 천문대 천장에 설치된 거대한 망원경 위로 향했다……)"
1008505-168 = "[wa:1450]― [log=하레 캠핑]하늘에 [wa:1350]빛이 가득해……[/log]"
1008505-171 = "― [log=하레 캠핑]이렇게 [wa:450]반짝이는 밤하늘은[/log]"
1008505-173 = "― [log=하레 캠핑]처음인 것 같아.[/log]"
1008505-176 = "[wa:2150]― [log=하레 캠핑]저 빛나는 점 [wa:1000]하나하나가 [/log]"
1008505-178 = "― [log=하레 캠핑]방대한 정보를 담은 [wa:1500]노드라고 생각하면[/log]"
1008505-181 = "[wa:100]― [log=하레 캠핑]새삼 [wa:1450]경외감이 [wa:1500]느껴질 정도네.[/log]"
1008505-184 = "[wa:1050]― [log=하레 캠핑]내가 알고 있는 [wa:1100]모든 정보를 쌓는다 해도[/log]"
1008505-186 = "― [log=하레 캠핑]저 빛에는 [wa:1500]차마 닿지 못하겠지.[/log]"
1008505-189 = "[wa:1650]― [log=하레 캠핑]……하지만 나는 [wa:1720]포기하지 않을 거야.[/log]"
1008505-191 = "― [log=하레 캠핑][ruby=베리타스]진리[/ruby]는 언제나 [wa:1800]빛을 향하는 법이니까.[/log]"
1008505-194 = "[wa:1450]― [log=하레 캠핑]하늘 위의 [wa:1700]머나먼 별들에게 [/log]"
1008505-196 = "― [log=하레 캠핑]경의를 담은 [wa:1150]인사를.[/log]"
1008505-199 = "― [log=하레 캠핑]안녕하세요. [wa:2050]잘 지내시나요?[/log]"
1008505-202 = "(이후, 하레와 함께 밤하늘이 전하는 이야기에 귀를 기울이다 새벽녘에야 학교로 돌아왔다.)"
