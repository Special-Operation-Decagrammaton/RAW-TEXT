[translation]
2006103-1 = "적절한 온도에 대하여"
2006103-3 = "[ns] \"후우…….\""
2006103-5 = "오, 나왔구만. 나왔구만."
2006103-10 = "탕은 좀 맞았어? 온도는 적절했고?"
2006103-11 = "[s1] \"딱 좋았어.\"\n[s2] \"최고였어…….\""
2006103-14 = "이야, 부원들이 기뻐하겠구만."
2006103-15 = "역시 도로를 허물고 온천을 지은 건 정답이었어."
2006103-16 = "[s] \"네?\""
2006103-17 = "아아, 신경 쓰지 마. 역시 온천수는 미지근한 것보다……."
2006103-23 = "부장! 큰일이야! 선도부가 나타났어!"
2006103-24 = "응? 내 계산에 따르면, 2시간은 더 걸릴 줄 알았는데?"
2006103-25 = "재수 없게 지나가는 선도부 순찰이라도 있었나."
2006103-29 = "……뭐."
2006103-30 = "모처럼 온천으로 몸도 가벼워졌으니까, 뛰어 보실까!"
2006103-31 = "[s] \"네?!\""
2006103-42 = "와~하하핫! 꼼짝없이 붙잡혔구만!"
2006103-43 = "[s3] \"나는 왜……?\"\n[s4] \"뭐지, 버근가?\""
2006103-46 = "뭐, 뭐, 걱정하지 말라고."
2006103-47 = "나는 몰라도 선생님이야 곧 무고하다는 게 밝혀질 테니까."
2006103-48 = "금방 나갈 거야. 물론, 나도 그렇고. 와하하핫!"
2006103-52 = "……이야, 그렇다 해도, 설마 선생님이랑 깜방밥 먹는 사이가 될 줄이야."
2006103-53 = "정말 인생은 한치 앞도 모르겠구만."
2006103-54 = "그것이 삶의 즐거움 아니겠어?"
2006103-58 = "……음. 선생님?"
2006103-59 = "아까부터 말이 없는데……."
2006103-60 = "……혹시 화가 났다든지?"
2006103-61 = "뭐, 이번 일은, 입이 백 개라도 할 말이 없기는 한데."
2006103-62 = "그렇지만 제대로 알아보지 않고 붙잡은 선도부 잘못도 없지는 않다고 생각하는데……."
2006103-63 = "[s5] \"아니, 그런 건 아니지만…….\"\n[s6] \"저번에 만났을 때랑 너무 달라져서.\""
2006103-66 = "응? 무슨 얘기일까?"
2006103-67 = "달라졌다고? 내가?"
2006103-68 = "……아~ 과연~"
2006103-69 = "반대야, 반대. 잘 생각해 봐. 나는 언제나 이랬어."
2006103-70 = "온천을 위해서는 뭐든지 하는 괴짜. 발파와 개발을 너무나도 사랑하는 광인."
2006103-71 = "……그렇지?"
2006103-72 = "[s7] \"어느 쪽이 진짜야?\"\n[s8] \"본심은?\""
2006103-75 = "유리한 쪽!"
2006103-76 = "……너무 그렇게 보지 말라고. 나는 목적만 달성되면 그만인 사람이라."
2006103-77 = "선생님이랑 있을 때는 얌전하게 있는 편이 조용하고 원만하게 끝나지."
2006103-78 = "하지만 유감스럽게도, 대부분 상황에서는……."
2006103-79 = "그, 뭐라고 할까, 예를 들자면, 순순히 붙잡힌 줄 알았더니……."
2006103-89 = "콜록, 콜록……!"
2006103-90 = "이거 생각보다 먼지가 많이 날리네. 다음에는 방식을 좀 바꿔야지 원."
2006103-95 = "부장! 선생님! 구하러 왔어!"
2006103-96 = "부장이 말한 시간만큼 기다렸더니 진짜로 건물이 텅 비었네?"
2006103-98 = "그야 본대가 안 왔으니까. 양동을 돌리면 당연히 한쪽이 비지."
2006103-99 = "……아, 맞다. 어디까지 말했더라?"
2006103-102 = "역시 온천수는 미지근한 것보다, 화끈한 편이 좋다는 거야."
