[translation]
10004040-1 = "제4화;제복 차림의 방해꾼"
10004040-2 = "산해경 <도원향>"
10004040-3 = "이곳은 산해경의 찻집, <도원향>이에요!"
10004040-4 = "산해경의 학생들은 식사 후에 카페에 들리는 대신 이곳, 도원향에서 차를 마시곤 해요."
10004040-5 = "이곳의 차는 향기도 좋을 뿐만 아니라 기름진 음식을 소화하는 데에도 큰 도움이 되거든요."
10004040-6 = "아직 백귀야행 학원의 <백야당>만큼 유명하지는 않지만, 차의 맛과 향만큼은 키보토스 제일이랍니다!"
10004040-7 = "[s] \"……여기에는 슌이 있을까?\""
10004040-8 = "어…… 그건 잘 모르겠지만……."
10004040-9 = "우, 우선은 차라도 한잔 마시면서 기다려봐요. 혹시 또 슌 언니가 이 찻집에 들를지도 모르잖아요?"
10004040-10 = "게다가 도원향에서는 차뿐만 아니라 맛있는 다과도 팔고 있어요. 아, 그러고보니 저기에 녹차 월병이……."
10004040-11 = "[s] \"역시 뭔가 수상한데…….\""
10004040-16 = "어라? 샬레의 선생님이시로군요."
10004040-17 = "이런 곳에서 뵙게 되다니, 우연이네요."
10004040-18 = "(윽, 또 방해꾼이…….)"
10004040-19 = "[s1] \"안녕, 키리노.\"\n[s2] \"발키리 학원의 학생이 산해경 자치구에는 무슨 일이야?\""
10004040-20 = "아아, 공무 때문에 방문한 것은 아닙니다. 지극히 개인적인 일로 방문했거든요."
10004040-21 = "아아, 공무 때문에 방문한 것은 아닙니다. 지극히 개인적인 일로 방문했거든요."
10004040-22 = "별건 아니지만…… 경비국으로부터 신경 쓰이는 소문을 하나 들어서요."
10004040-23 = "[s] \"소문?\""
10004040-25 = "선생님께서도 산해경의 학생회— 현룡문과 미식 거리의 상인연합— 현무상회에 대해서는 알고 계시지요?"
10004040-26 = "[s] \"조금이라면.\""
10004040-27 = "네. 이 두 집단은 산해경을 대표하는 거대 동아리이기도 하지만, 서로가 산해경의 발전을 저해하는 집단이라고 여기고 있는지라. 오랫동안 서로를 거꾸러트릴 기회만 엿보고 있었지요."
10004040-28 = "그런데 얼마 전 경비국의 동기로부터 입수한 극비 정보에 따르면……"
10004040-29 = "출처를 알 수 없는 대량의 총기가 산해경 자치구 내로 흘러 들어갔다고 하더군요!"
10004040-30 = "……어쩌면 조만간 현룡문과 현무상회 간에 대규모 항쟁이 벌어질지도 모릅니다."
10004040-31 = "[s3] \"무, 무서워라…….\"\n[s4] \"그런 기밀을 이렇게 말해도 되는 거야?\""
10004040-32 = "그, 그건 그러니까 이 사실은……"
10004040-33 = "그, 그건 그러니까 이 사실은……"
10004040-34 = "비, 비밀로 부탁드리겠습니다!"
10004040-35 = "여하튼! 학생들이 오가는 번화가에서 대규모 폭력사태가 발생할 수도 있다니, 발키리 경찰학교의 학생으로서 가만히 있을 수는 없겠지요."
10004040-36 = "게다가 본관이 단독으로 현룡문과 상회의 항쟁을 저지하는 데 성공한다면, 높으신 분들도 제 능력을 인정해 주시겠지요!"
10004040-37 = "어쩌면 생활안전국에서 벗어나 경비국으로 전과할 수 있는 절호의 기회일지도……!"
10004040-38 = "[s5] \"그렇구나. 힘 내!\"\n[s6] \"좋은 결과가 있었으면 좋겠네.\""
10004040-39 = "헤헤, 감사합니다, 선생님. 시민의 안전을 위해 싸우는 건 경찰의 의무니까요!"
10004040-40 = "헤헤, 감사합니다, 선생님. 시민의 안전을 위해 싸우는 건 경찰의 의무니까요!"
10004040-41 = "그런데 선생님은 무슨 일로 이곳에 계신 건가요? 단순히 차를 드시러 온 것처럼 보이지는 않습니다만……."
10004040-42 = "[s] 슌을 본 적 없느냐고 묻는다."
10004040-43 = "슌이라면 매화원의 그 키가 큰 교관 학생 말인가요? 유감스럽게도 이 근처에서는 보지 못했습니다만……."
10004040-44 = "혹시 옆에 있는 그 어린 학생과 관련된 일인가요?"
10004040-45 = "[s] 방금 전까지 있었던 일을 설명한다."
10004040-46 = "아하, 그런 일이라면 본관이 함께 처리하겠습니다. 어차피 이 근처를 계속 순찰할 예정이었으니까요."
10004040-47 = "그리고 가는 길에 슈에링이라는 그 학생도 매화원에 데려다 주고 오겠습니다."
10004040-48 = "미아를 돌보는 것은 생활안전국의 중요한 업무 중 하나니까요!"
10004040-49 = "[s] \"그럼 슈에링의 배웅을 대신 부탁할까…….\""
10004040-51 = "네, 네에~?"
10004040-54 = "(뭔가요, 이 경찰 학생은! 모처럼 선생님과의 데이트를 방해하기나 하고!)"
10004040-55 = "(게다가 [USERNAME] 선생님과 스스럼없이 즐겁게 대화를 나누다니…… 마음에 안 들어요!)"
10004040-56 = "(당신에게 원한은 없지만, 지금은 떠나줘야겠어요!)"
10004040-59 = "아앗, 저기에 무지막지한 중화기로 무장한 현룡문 간부가—!"
10004040-60 = "네? 중화기로 무장한 현룡문 간부요?! 설마 벌써 두 집단 간의 항쟁이 시작된 걸까요?"
10004040-61 = "죄송합니다, 선생님. 아무래도 지금은 항쟁을 막는 게 우선일 것 같습니다."
10004040-63 = "키리노, 출동합니다!"
10004040-68 = "휴우, 드디어 방해꾼이 사라졌네요."
10004040-73 = "그럼 그동안 저희는 차라도 한잔 마시면서 여유를 즐겨볼까요?"
10004040-79 = "소, 속았다!"
10004040-80 = "어라? 금방 돌아오셨네요, 경찰 언니."
10004040-81 = "아까 한 말은 뭔가요, 슈에링 양! 밖의 학생들에게 물어보았지만 현룡문 간부는커녕, 중화기를 든 학생조차도 본적이 없다지 않습니까!"
10004040-83 = "경찰에게 잘못된 정보를 주시다니, 이건 공무 방해예요! 범죄라고요!"
10004040-84 = "하지만…… 슈에링은 정말 현룡문 언니가 지나가는 걸 보았는데……."
10004040-85 = "……혼낼 건가요?"
10004040-87 = "으, 으윽……."
10004040-89 = "어린아이가 착각한 일을 가지고 혼을 내는 것도 우스우니, 하는 수 없지요."
10004040-91 = "여하튼 더 이상 선생님을 방해할 수는 없으니 이번에야말로 같이 매화원에……."
10004040-92 = "앗, 이번에는 날카로운 식칼을 든 현무상회 언니들이—?!"
10004040-94 = "아앗, 설마 이번에야 말로 항쟁이?!"
10004040-96 = "키리노, 출동합니다!"
10004040-100 = "학습력이 없는 경찰 언니네요."
10004040-101 = "자, 그럼 이번에는 이 콩떡이랑 같이 차를 먹어봐요!"
10004040-106 = "으윽, 또 속다니……."
10004040-107 = "아무리 어린 아이라지만 경찰을 두 번씩이나 속이다니, 용서할 수 없어요!"
10004040-109 = "저기, 경찰 언니."
10004040-110 = "이번에는 또 뭔가요?"
10004040-111 = "저쪽에 나쁜 언니들이 점원 씨를 괴롭히고 있어요."
10004040-112 = "똑같은 수로 저를 속일 셈인가요? 제가 아무리 단순하다지만, 이번에는 속지 않아요!"
10004040-117 = "아앙? 뭐야, 이 더러운 찻집은!"
10004040-118 = "게다가 이 메뉴판은 또 뭐야? 맛없고 쓴 차만 가득하잖아! 찻집이면서 왜 타피오카 밀크티가 없는 거야!"
10004040-119 = "하, 하지만 이곳은 전통찻집이라 밀크티 같은 메뉴는 없는걸요……."
10004040-120 = "지금 손님을 무시하는 거냐? 아앙?!"
10004040-121 = "우리는 생크림 크레이프와 타피오카 밀크티가 먹고 싶다고!"
10004040-123 = "우앗, 이번에는 진짜잖아?!"
10004040-124 = "거기, 정지! 시민의 안전을 위협하는 불량 학생들은 용서하지 않아요!"
