[translation]
52020-1 = "제2화;새로운 괴담"
52020-8 = "……찻줄기가 바로 섰구나."
52020-9 = "한동안 사연 없이 오래 격조하였으니, 반가운 이가 길한 소식을 들고 방문하려는가."
52020-14 = "불민한 소녀가 이제야 코쿠리코 님을 뵙습니다."
52020-18 = "……오랜만에 얼굴을 보는구나."
52020-19 = "후후, 새로운 이야기를 쓰느라 두문불출하느라 문안 인사가 늦었습니다."
52020-20 = "그래. 네 이야기는 얼마나 완성되었느냐? 듣는 것만으로도 마음을 빼앗길 만큼 깊고 그윽하게 무르익었느냐?"
52020-21 = "백 번 듣는 것이 한 번 보는 것만 못하니. 오래 곱씹어야 심상을 떠올릴 수 있는 글 줄보다는, 보는 것만으로도 시야를 압도하는 그림 한 장이 더 효과적인 법이지요."
52020-22 = "그래, 그래. 네가 가진 괴예가로서의 재능은 익히 잘 이해하고 있다."
52020-23 = "다만 진정한 풍류는 듣지 않고 보지 않아도, 봄이 되면 산과 들에 푸성귀가 자라나듯 사람의 마음속에서 자연스레 피어나는 것임을 명심하여야 할 것이다."
52020-27 = "……명심하겠습니다."
52020-28 = "그러고보니 지난번 코쿠리코 님이 가져다주신 '씨앗'은 멋대로 홀로 가지를 뻗고 뿌리를 내려 이제 곧 꽃을 피울 준비를 마쳤습니다."
52020-29 = "호오, 시간이 벌써 그리 지났느냐."
52020-30 = "예. 이 아름답게 피어날 꽃을 제가 지닌 <토테이붓카이로쿠>에 담는다면, 필시 세상을 아름답게 불태울 풍문의 초석이 되겠지요."
52020-31 = "고생이 많았다. 우리 모두의 백물어를 완성하여 피안의 너머로 향할 날이 머지않았구나."
52020-35 = "언젠가 황혼의 사원에 도달하여 연회를 열게 된다면 너를 잊지 않고 가장 가까운 곳에 자리를 마련해 두마."
52020-36 = "더없는 영광입니다, 코쿠리코 님."
52020-39 = "……그나저나 슈로는 어디에 갔느냐?"
52020-40 = "일전의 축제가 끝난 뒤로 오랫동안 모습이 보이지 않던데…… 분을 이기지 못해 속병이라도 난 게 아닌가 염려스럽구나."
52020-41 = "걱정하실 필요 없습니다, 코쿠리코 님. 슈로는 건강히 지내고 있으니까요."
52020-42 = "슈로는 여전히 씩씩하게 코쿠리코 님의 비원을 이루기 위해 분골쇄신하고 있습니다."
52020-43 = "슈로를 포함하여 화조풍월부의 모두가 새로운 백물어를 완성하기 위해 노력하고 있는 만큼, 코쿠리코 님이 바라시던 풍류도 머지않아 곧 완성될 것입니다."
52020-44 = "그래. 모두가 의욕적으로 일해주고 있다니, 내 기뻐해 마지않는바."
52020-45 = "다음에 슈로를 보거든 네가 나를 대신하여 격려의 말을 전달해 주거라."
52020-46 = "네, 그리하겠습니다."
52020-55 = "나구사아아—"
52020-56 = "나구사쨔아아아아앙—!"
52020-63 = "모처럼 완성된 이야기를, 그 멍청한 년 때문에 망쳐버리고 말았어!"
52020-64 = "본래 계획대로였다면 백련의 계승자가 없는 백화요란은 아무것도 하지 못한 채 무력하게 도망 다니는 신세에 불과했을 텐데……"
52020-65 = "스스로의 무력함을 곱씹으며 절망하고 울부짖는 비극이 되어야 했을 텐데!"
52020-66 = "……도대체 어디부터 이야기가 꼬여버린 거지?"
52020-67 = "샬레의 선생이 멋대로 궤변을 늘어놓았을 때부터? 얼굴 없는 카타시로에 금이 가기 시작했을 때부터?"
52020-68 = "이익…… 이게 다 그 멍청한 년 때문이야! 풍류라고는 조금도 이해하지 못하는 그 멍청한 년이 결말을 망쳐버리고 말았어!"
52020-69 = "거기에 더해 코쿠리코 님께 받은 [ruby=이노모노노케로쿠]소중한 괴서[/ruby]까지 잃어버리고 말았으니……"
52020-70 = "으으으— 용서 못 해, 나구사쨔아아아앙—!!"
52020-75 = "어디에 갔나 했더니, 이런 곳에서 화풀이를 하고 있었구나. 슈로 쨩."
52020-76 = "네 분을 푸는 방식에 참견할 마음은 없지만, 그 이상 무기를 휘두르면 이 사당이 완전히 박살 날 거야."
52020-80 = "……뭐야. 너까지 나를 놀리러 온 거야?"
52020-81 = "그럴 리가. 나는 그저 네가 걱정되어서 보러 온 것뿐인걸."
52020-82 = "……그리고 겸사겸사 코쿠리코 님의 전언도 전할 겸."
52020-86 = "……코쿠리코 님이? 코쿠리코 님이 나를 찾으셨어?"
52020-87 = "코쿠리코 님께서 나를 필요로 하신대?"
52020-88 = "실패를 겪고 나니 꽤나 뻔뻔해졌구나, 슈로 쨩."
52020-89 = "그런 큰 실수를 저질러 놓고서도 코쿠리코 님이 자신을 돌아봐 줄 거라고 생각하다니."
52020-90 = "으읏……!"
52020-91 = "지난번의 실패로 너는 코쿠리코 님의 신뢰를 저버렸지. 코쿠리코 님은 너의 능력을 의심하고 계셔."
52020-92 = "하루빨리 새로운 괴담을 자아내지 못한다면 다음번에 황혼에 던져지는 건 네가 될 거야."
52020-97 = "그, 그럴 리가 없어. 코쿠리코 님은 언제나 나를 믿어 주신다고 했는걸."
52020-98 = "지난번에도 실패에 대해선 신경 쓰지 말라고—"
52020-99 = "소중한 괴서를 훼손하고, 꼴사납게 도망쳐도 실패에 대해 신경 쓰지 않는다면…… 네 존재에 무슨 가치가 남아 있을까?"
52020-100 = "아니…… 어쩌면 모르지. 코쿠리코 님께서는 너무 실망한 나머지 네가 무슨 짓을 저지르든 신경 쓰지 않기로 하셨을지도."
52020-105 = "그건…… 그것만큼은 싫어!"
52020-106 = "난 어쩌면 좋지? 어찌해야 코쿠리코 님의 신뢰를 다시 얻을 수 있지?"
52020-107 = "걱정 마. 그런 너를 도와주기 위해 내가 여기에 온 거니까."
52020-111 = "슈로, 네게 만회의 기회를 줄게."
52020-118 = "이건…… <토테이붓카이로쿠>?"
52020-119 = "그래. 이건 우리 화조풍월부에 남아 있는 마지막 한 권의 괴서."
52020-120 = "본래 화조풍월부가 갖고 있던 괴서는 모두 세 권이었지."
52020-123 = "20년 전, 대설원에서 코쿠리코 님이 잃어버린 것이 한 권."
52020-124 = "네가 백귀야행에서 도망치며 훼손한 것이 한 권."
52020-125 = "그리고 내가 오래전부터 보관하고 있던 마지막 한 권이…… 바로 이 <토테이붓카이로쿠>."
52020-126 = "네가 갖고 있던 <이노모노노케로쿠>가 사람의 욕망을 현실에 자아내는 물건이라면, 이 <토테이붓카이로쿠>는 사람의 두려움을 자아내는 괴서."
52020-127 = "어때, 슈로?"
52020-128 = "이번만큼은 내가 너를 위해 이 [ruby=토테이붓카이로쿠]소중한 괴서[/ruby]의 힘을 빌려줄게."
52020-136 = "이 괴서로 사람들의 두려움을 자아내고, 환량백물어로 사람들을 몰아친다면……"
52020-137 = "너를 이렇게 만든 백화요란을 향한 복수도 가능하지 않겠어?"
52020-142 = "그래. 그거라면…… 할 수 있어."
52020-143 = "괴서만 있다면 얼마든지 다시 괴담을 지을 수 있어."
52020-147 = "괴담으로 녀석들에게 영원히 잊혀지지 않을 강렬한 [ruby=백물어]악몽[/ruby]을 선사하는 거야!"
52020-148 = "잘됐네, 슈로 쨩."
52020-152 = "이것으로 분명 완성시킬 수 있을 거야."
52020-154 = "너의 백물어도…… 나의 백물어도."
52020-156 = "다음화;새로운 축제"
