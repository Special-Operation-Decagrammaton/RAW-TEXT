[translation]
10038070-1 = "제7화;그곳에 가면 기린을 만날 수 있을까."
10038070-7 = "자, 다 왔어. 선생님. 여기가 우리 현무상회의…… 비밀 장소야."
10038070-8 = "어떻게 여기까지 올 수 있었네. 선생님……."
10038070-9 = "[s] \"미나와 레이죠 덕분이었어.\""
10038070-10 = "아닙니다. 오히려 선생님께서 적절한 지시를 내려 주셨기에, 저희가 행동할 수 있었던 것이죠."
10038070-11 = "미나 집행부장 말씀이십니까? 걱정하지 마십시오. 무리했던 탓인지 지금은 깊이 잠들어 있습니다."
10038070-12 = "그보다…… 문주님께서는 괜찮으십니까?"
10038070-14 = "……그래. 신세를 지는구나. 면목이 없다."
10038070-15 = "괜찮아, 괜찮아! 이 정도는 아무것도 아니니까! 오히려 얼마든지 더 신세 져도 돼!"
10038070-16 = "……그러한가."
10038070-20 = "……."
10038070-21 = "키사키도 정말 큰일 날 뻔했으니까. 그렇지? 하마터면……."
10038070-23 = "신타니 카이가 돌아왔다는 사실 만으로도, 사실 엄청나게 큰 일이 난 것이기는 합니다만……."
10038070-28 = "……."
10038070-30 = "그 화제는 잠시 넣어 두고……. 그러면! 우리는 상회로 잠시 돌아갈까!"
10038070-35 = "네? 하지만 문주님은……?"
10038070-36 = "바로 그래서야."
10038070-37 = "말씀하시는 의미를 모르겠습니다만……?"
10038070-38 = "됐으니까 빨리."
10038070-39 = "회, 회장님? 그렇게 억지로 미실 필요는……. 그보다 회장님의 상태를 고려해 보면, 지금은 어차피 제 쪽이 더 힘이 셀 텐데요…… 회장님? 회장님?"
10038070-45 = "[ns] \"갔네…….\""
10038070-46 = "……그렇구나."
10038070-47 = "[s] \"저, 키사키? 괜찮아?\""
10038070-51 = "……그래. 문제는 없다."
10038070-52 = "[s] \"으음…….\""
10038070-55 = "(어색한 침묵이 이어졌다.)"
10038070-59 = "(키사키는 고개를 숙인 채, 바닥만을 바라보고 있었다…….)"
10038070-63 = "[ns] \"카이에 대해서, 이야기해 줬으면 좋겠어.\""
10038070-67 = "신타니 카이에 대해서…… 말인가?"
10038070-68 = "부질없는 것을 묻는구나. 선생. 어차피 지나간 과거일 뿐인 것을……."
10038070-72 = "……."
10038070-73 = "예전에 나누었던 이야기, 기억하고 있는가?"
10038070-74 = "1년 전……. 문주의 자리에 올랐던 내가 가장 먼저 내린 결정에 대한 이야기 말이다."
10038070-75 = "[s] \"어떤 3학년을 직권 퇴학시켰다는 이야기?\""
10038070-76 = "그렇다. 이미 짐작하고 있겠지만, 그 3학년이 바로……."
10038070-77 = "[s] \"카이였다는 거구나.\""
10038070-78 = "그랬지……."
10038070-81 = "그때에도 이야기했던 것이지만, 그 결정에는 반발이 많았다."
10038070-82 = "절차와 과정, 공정성과 타당함. 설령 그것이 결과적으로 틀리지 않은 결정이었다 해도, 지켜야 할 것은 지켜야 한다는 의견……."
10038070-83 = "하지만, 그것은 어디까지나 나의 판단에 지나지 않는 것이었을지도 모르는 일이었지만."
10038070-88 = "물이 엎질러진 뒤에는 주워 담을 수 없을 테니까."
10038070-91 = "……신타니 카이는, 스스로 선인이 되고자 했다."
10038070-92 = "더 높은 경지의 깨달음을 위해 카이는 선단을 만들고자 했고, 불로불사의 영약을 만든다는 명목으로 수많은 학생들을 불러 모았지."
10038070-93 = "그리고 그들에게 수상쩍은 단약을 복용시키고는 했다."
10038070-102 = "또 그녀의 힘에 홀린 학생들 중 일부는, 카이에게 특수한 효능의 단약을 조제해 달라고 부탁하기도 했지."
10038070-104 = "그 단약은, 일시적으로는 탁월한 효과를 보였지만."
10038070-105 = "장기적으로는 복용한 사람의 신체에, 많은 부담과 흔적을 남기곤 했다."
10038070-118 = "가령 체육에서 좋은 성적을 내고 싶어 하는 학생에게 내준 단약은 일시적으로 신체 능력을 향상시켜 주었지만, 그 후 인체 대사에 큰 장애를 일으켰고."
10038070-119 = "새로운 맛을 경험하고 싶다는 학생에게 준 단약은 미각을 변하게 하여 타인의 미식에 공감할 수 없게 만들었다."
10038070-122 = "물론 단약으로…… 말썽…… 을 일으킨다는 점만 두고 보면, 사야 역시 사고뭉치인 것은 마찬가지이다만……."
10038070-123 = "사야가 추구하는 것은 본질적으로 단약을 복용한 사람이 행복하기를 바란 것이었지."
10038070-124 = "그 증거로 사야는 부작용이 발생한 사람이 원하면 언제나 해독약을 대가 없이 마련해 주었다."
10038070-125 = "불로불사란 결국 세상의 이치를 거스르는 일. 그렇기에 필연적으로 부작용은 따르는 법이기에……."
10038070-126 = "어쩌면 사야는 대가 없는 행복은 존재할 수 없다는 걸, 이미 깨달았던 것인지도 모르겠구나."
10038070-130 = "그러나 카이는…… 그렇지 않았다. 카이에게 중요한 것은 오직 결과였지. 선인이 될 수 있다면 외도를 걷는 것도 서슴지 않았다."
10038070-131 = "심지어 해독약을 원하는 학생들에게, 해독약을 받고 싶다면, 자신의 명령에 복종하라는 식으로 거부할 수 없는 거래를 제안하곤 했다."
10038070-132 = "그렇게 카이에게 단약의 제조를 부탁한 학생들은, 종국에는 노예 비슷한 처지가 되어, 카이가 하는 말이라면 무엇이든 따라야 하는 처지가 되어야 했다."
10038070-133 = "……현룡문에게 있어서도 그것은 좋은 일이 아니었다."
10038070-134 = "아무튼 산해경 내에서 현룡문의 권위를 따르지 않는, 또 다른 세력이 생겨나는 것이나 마찬가지였으니 말이다."
10038070-135 = "[s] \"그건 정말로 위험한 일이지 않았을까?!\""
10038070-140 = "'원숭이 손'에 대한 이야기를 알고 있는가, 선생?"
10038070-141 = "그래. 원숭이 손에 소원을 빌었더니, 소원은 이루어졌지만, 그 소원이 아주 비틀린 방식으로 이루어졌다는 이야기지."
10038070-142 = "목적은 달성했으나, 그 과정이 너무 좋지 않은 데다, 대가 역시 가혹할 때 사용하는 비유이기도 하다."
10038070-144 = "그리고…… 신타니 카이의 별명 중 하나이기도 했지."
10038070-145 = "이 역시 나의 짧은 판단에 지나지 않았을지도 모르는 일이지만."
10038070-146 = "그때의 나는, 카이를 그대로 내버려두면, 산해경의 근간이 흔들릴 수도 있을 것이라고 생각했다."
10038070-147 = "그렇지만 어느 학원이라고 해도, 한 명의 학생을 퇴학시킨다는 것은 쉽지 않은 일이다."
10038070-148 = "변화와 예외를 두려워하는…… 우리 산해경이라면 두말할 것도 없을 것이고."
10038070-149 = "후후. 학칙대로의 절차를 모두 따랐다면, 카이는 아마도 퇴학당하기 전에 졸업을 맞이했을지도 모르는 일이었겠지."
10038070-152 = "그래서 나는 즉결추방이라는, 전례 없는 결정을 내렸다."
10038070-153 = "그리고 카이에 대한 기록을 완전히 말소시켜, 누구도 카이를 따라 모방 범죄를 일으키지 않게 하려 했다."
10038070-155 = "……생각해 보면, 그것이 내가 나 자신에게 만든 업보였을지도 모른다는 생각이 드는구나."
10038070-162 = "카이에게는 나를 원망할 권리가 있다. 그렇지. 그렇고말고."
10038070-163 = "카이로 하여금 독기를 품게 하고, 복수심에 휩싸이게 하고, 원한을 갖게 만든 것도. 그 모든 것이 내가 초래한 일이었다."
10038070-168 = "나는 큰 것을 위해 작은 것을 잘라내려 했고, 그 결과를 지금 스스로 돌려받고 있는 것인지도 모르지."
10038070-171 = "변명은 하지 않겠다. 선생. 그것은 아무래도 비겁해 보이지 않는가."
10038070-172 = "그러나 나의 행동과 결정이, 지금의 카이라는 괴물을 만들어내었고, 그것이 현재의 산해경에게 피해를 끼치고 있는 것이니……"
10038070-176 = "정말이지 그 말대로이구나. 꽃이 지고 홍수가 나고 벼락이 떨어져도……."
10038070-177 = "모든 책임을 지고 그 어떤 변명도 필요 없는 자리. 그게 바로 산해경의 문주란 자리인 것이니."
10038070-181 = "[ns] \"그렇지만, 나는 조금 다르게 생각해.\""
10038070-185 = "……? 무슨 의미인가, 선생?"
10038070-186 = "[s1] \"키사키는 문주로서 그런 선택을 내렸을 뿐이야.\"\n[s2] \"카이 역시 자신의 모습에 책임을 질 필요가 있는 것이고.\""
10038070-189 = "카이가 선택한 것이다? 지금의 모습을……?"
10038070-190 = "그렇지만……."
10038070-191 = "[s3] \"단순하게 이야기하기 어려운 것들이 분명히 있지.\"\n[s4] \"산해경의 과거들이 그런 것처럼 말이야.\""
10038070-194 = "……."
10038070-195 = "[s5] \"그래도, 우리 모두는 우리의 현재를.\"\n[s6] \"어느 정도 짊어져야 한다는 걸, 잊어서는 안 돼.\""
10038070-198 = "그렇지만……."
10038070-199 = "[s7] \"지금의 순간 역시 언젠가는 과거가 될 거야.\"\n[s8] \"바로 그래서, 더더욱 최선을 다해 살아가야 하는 거고.\""
10038070-202 = "그것은 또, 어째서……?"
10038070-207 = "[ns9] \"왜냐하면, 그래야만 언젠가 찾아올 현재에게.\"\n[ns10] \"부끄럽지 않은 대답을 할 수 있을 테니까.\""
10038070-211 = "……그것이, 우리가 과거와 전통을 잊지 말아야 하는 이유인 것이라고……?"
10038070-212 = "그런가……. 그렇게도 생각할 수 있는 것이로구나."
10038070-213 = "……."
10038070-217 = "어떤 산해경의 학생들은, 나에 대한 의심을 거두지 않았지."
10038070-218 = "류우게 키사키라는 문주는, 그 시작부터가 산해경의 전통과는 거리가 있었으니 말이다."
10038070-219 = "……."
10038070-223 = "선생. 산해경 고급중학교라는 학원이, 외부에서 어떤 시선으로 보여지는지 알고 있는가?"
10038070-224 = "보통은 산해경이 어디에 있는지도 모르는 경우도 적지 않다. 3대 학원에 비교하면, 더더욱 우스워질 뿐이지."
10038070-225 = "알려진 사실이라고 해 보아야 현무상회의 음식이 맛있다는 정도이고."
10038070-226 = "자기들끼리 전통을 고집하면서 살아가는 괴짜들이라는 느낌이 강하지."
10038070-227 = "나는…… 그것이 싫었다. 산해경의 학생들이 어디 가서 그런 취급을 받고 다니는 것 역시."
10038070-228 = "후후……. 선생과의 대화는, 언제나 나에게 새로움을 보여주는구나."
10038070-229 = "그 정도까지는 아니라고? 이런, 이런. 선생 역시 스스로에 대해 조금 더 자각하는 편이 좋을 것이라고 보는데 말이다?"
10038070-233 = "……."
10038070-234 = "이제야 무엇을 해야 하는지, 조금이지만 길이 보이는 것 같구나."
10038070-235 = "감사를 표하겠다. 선생. 그리고 한 가지만 부탁하고 싶은 것이 있다."
10038070-239 = "월영제는, 개최될 것이다."
10038070-240 = "그 축제가 열릴 때까지…… 조금만 더 나를 도와줄 수 있겠는가?"
10038070-241 = "[s] \"문주님의 명을 받들도록 할게.\""
10038070-242 = "후후……. 고맙구나."
10038070-250 = "[ns] \"키, 키사키? 문주님?!\""
10038070-252 = "왜 그러는가. 기껏해야 등에 업힌 정도로."
10038070-253 = "첫 번째 명이다. 이대로…… 조금만 더 이대로, 버티고 서 있어 다오."
10038070-263 = "키사키, 선생님! 지금 괜찮지? 현무상회 부원들이 조금 할 말이 있대서 말이…… 야……?"
10038070-268 = "……?!"
10038070-269 = "[s] \"!?\""
10038070-274 = "뭐, 뭐 하고 있었던 거야, 둘이서?!"
10038070-276 = "이, 이것은…… 그러니까……!"
10038070-277 = "[s] \"아무 일도 아니야! 아무 일도 없었어! 그렇지, 키사키?\""
10038070-282 = "나도 선생님한테 업힐 거야!"
10038070-283 = "그쪽인 겐가!"
10038070-291 = "크, 크흠. 그러니까, 다시 이야기할게. 현무상회 부원들이 조금 할 말이 있다고 해서, 데리고 왔어."
10038070-292 = "흐음……? 드문 일이로구나. 현무상회 부원들이라고 하면 그대의 직원들일 터인데."
10038070-293 = "구태여 나에게 할 말이 있다? 그래서 직접 데리고 왔다……?"
10038070-294 = "뭐, 뭐. 만나 보면 알게 될 거야. 다들 들어오라고!"
10038070-306 = "으, 으음……. 그래서, 무슨 말인가? 듣겠다."
10038070-314 = "현룡문, 다시금 문주님을 뵙습니다!"
10038070-319 = "……?! 이건, 어떻게 된 일이지……?"
10038070-320 = "하하하! 놀랐어? 현룡문 애들이 몰래라도 좋으니 키사키를 만나고 싶다고 해서 말이지!"
10038070-321 = "그렇지만 현룡문 부원들이 자기들이 통제시킨 현무상회를 마구 돌아다니는 건, 조금 그림이 이상하잖아? 여러 가지로 의심을 받을 수도 있고."
10038070-322 = "그래서 모두 우리 애들로 변장시켜서, 여기까지 데려온 거지!"
10038070-327 = "현룡문에는…… 그리고 산해경에는, 역시 문주님께서 계셔야 합니다. 저희들의 결론은 그것이었습니다."
10038070-328 = "지금의 강경파가 주도하는 현룡문은, 중심도 초심도 모두 흔들리고 있습니다……."
10038070-329 = "무엇보다 연단방에게 주도권을 내주고, 학생회로서의 역할을 전혀 수행하지 못하고 있습니다!"
