[translation]
1300009-1 = "빛나는 오후를 맞이하며"
1300009-2 = "샬레 집무실"
1300009-4 = "……"
1300009-5 = "……………"
1300009-8 = "어머. 주인님. 이런 우연이?"
1300009-9 = "[s1] \"하루 종일 부려먹고!\"\n[s2] \"불러놓고 무슨 우연이야.\""
1300009-10 = "사소한 것에는 신경 쓰실 필요 없어요."
1300009-11 = "사소한 것에는 신경 쓰실 필요 없어요."
1300009-12 = "네 말씀하신 대로, 이것은 우연이 아닙니다."
1300009-13 = "운명입니다."
1300009-14 = "……"
1300009-15 = "후훗. 너무 당황하지 마세요."
1300009-16 = "그렇지 않아도…… 이번에 제 임무를 도와주신 보답을 준비했답니다."
1300009-20 = "어느 가정집"
1300009-25 = "흐음. 생각보다 깔끔하네."
1300009-26 = "이 집이요? 제가 준비한 곳이죠."
1300009-27 = "잠시만 이 방에서 기다려주세요."
1300009-28 = "꼭이에요. 제가 부를 때까지, 절대 나오시면 안 돼요?"
1300009-29 = "아 방금 퇴근하셔서 피곤하시겠군요. 잠깐 누워 계셔도 괜찮아요."
1300009-31 = "……."
1300009-34 = "주인님."
1300009-35 = "주인님. 일어나세요."
1300009-38 = "[ns3] 일어나서, 밖으로 나가본다.\n[ns4] 좀 더 잔다……."
1300009-40 = "……."
1300009-41 = "(사각사각사각……)"
1300009-42 = "……?"
1300009-43 = "(좋은 향기가 난다.)"
1300009-44 = "……."
1300009-45 = "(사각사각사각……)"
1300009-46 = "……?"
1300009-47 = "(좋은 향기가 난다.)"
1300009-48 = "(스윽)"
1300009-50 = "일어나셨군요."
1300009-51 = "후훗. 정말로 잠드셨을 줄이야."
1300009-52 = "자, 그럼 시작해볼까요?"
1300009-55 = "― 어머. [wa:1000]돌아오셨군요."
1300009-57 = "― 오늘 하루는 [wa:1200]어떠셨나요?"
1300009-60 = "― 아, [wa:1000]주인님. [wa:1500]마침 [wa:1000]최고급 찻잎이 들어왔답니다."
1300009-62 = "― 제가 한 잔 [wa:1800]준비해드릴까요?"
1300009-65 = "― 네? [wa:1500]여기는 [wa:1000]우리들의 집이 아니라고요?"
1300009-68 = "― 후훗. [wa:1500]상관없어요. [wa:2000]우리들의 집은 아니지만,"
1300009-70 = "― 우리는 지금 함께 있으니까요."
1300009-73 = "제가 준비한 선물, 마음에 드셨나요?"
1300009-74 = "C&C의 아카네. 성심성의껏, 봉사하겠습니다."
