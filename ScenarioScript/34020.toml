34020-182 = "그, 그런……. 미카 씨는 본인 입으로 아리우스 자치구의 위치만큼은 모른다고……."
34020-183 = "……그녀는 오랫동안 아리우스와 내통해 왔어요. 그런 그녀가 아리우스의 위치를 모른다는 건 좀 이상한 일 아닐까요?"
