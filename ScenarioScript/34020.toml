34020-236 = "……감사합니다. 선생님. 어쩐지 보여주기 싫은 모습만 계속 보여주게 되는 것 같지만……."
34020-237 = "[s5] \"그런데…… 미카에게 무슨 일이 있는 거야?\"\n[s6] \"아까부터 뭔가…….\""
34020-238 = "……아아. 네. 선생님은 아직 모르시겠네요."
