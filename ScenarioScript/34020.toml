34020-225 = "그리고 저 또한 지금의 이 사태…… 미카 님에게 쏟아지는 비난과 분노에 대해서는 매우 우려스럽게 생각하고 있습니다."
34020-226 = "제 나름의 방법을 찾아보도록 하겠습니다. 그럼."
