[translation]
34020-1 = "제2화;불편한 다과회"
34020-3 = "와주셔서 감사합니다. 선생님. 오랜만의 트리니티 방문이네요."
34020-4 = "[s] \"안녕. 나기사. 그리고 모두들.\""
34020-5 = "또 뵙네요. [USERNAME] 선생님. 저번엔 신세를 많이 졌습니다."
34020-6 = "……. 처음 뵙겠습니다. 구호기사단의 단장을 맡고 있는 미네입니다."
34020-7 = "[s1] \"응. 잘 부탁해.\"\n[s2] \"어쩐지 신기한 조합이네.\""
34020-8 = "후후……. 신기하다고 할까, 나기사 씨를 곤란하게 만들 조합이라고 할까."
34020-9 = "후후……. 신기하다고 할까, 나기사 씨를 곤란하게 만들 조합이라고 할까."
34020-10 = "저는 호스트를 곤란하게 만들 생각은 없었습니다만."
34020-11 = "신념과 긍지를 품고 있는 기사단의 일원으로서, 그릇된 모습이 보인다면 바르게 되돌릴 뿐입니다."
34020-13 = "설령 그것이 정의실현부나 티파티라고 할지라도요."
34020-14 = "……."
34020-15 = "……그런 말이 이미 충분히 나기사 씨를 곤란하게 만들고 있는 것 같지만요."
34020-16 = "자, 바쁘신 선생님 앞에서 잡담은 이 정도로 하고."
34020-17 = "선생님을 모신 이유는 저번의 에덴조약 사태 이후의 상황 공유와 사건의 뒤처리에 대한 여러 가지를 논의하려고 했던 것……이었습니다만."
34020-18 = "……."
34020-19 = "……."
34020-20 = "어째선지, 시스터후드와 구호기사단의 리더가 이 자리에 참석하겠다고 해서…… 이렇게 되어버렸네요."
34020-21 = "……시스터후드도 예전과는 많이 달라져서요. 이제 이런 자리에 빠질 수는 없겠죠."
34020-22 = "저 역시 트리니티에서 가장 오랜 역사를 지닌 동아리인 <기사단>의 수장으로서 의무를 수행하려는 것뿐입니다."
34020-23 = "……."
34020-24 = "[s] \"어…… 요컨대, 두 사람은 티파티를 견제하려는 목적으로……?\""
34020-25 = "아뇨, 관심이 많은 것뿐이죠."
34020-26 = "저는 그런 정치적인 일들은 잘 모릅니다."
34020-27 = "에덴조약 사태는 어찌저찌 마무리되었지만, 그 사건의 배경에 대한 후속 조치와 상황 분석은 여전히 진행 중이죠."
34020-28 = "저희 또한 이 사건과 무관하지 않기에, 연구 분석의 일정 부분은 시스터후드가 담당하고 있습니다."
34020-29 = "이번 자리는 그런 정보의 공유 및 후속 조치에 대해 논의를 하기 위한 것이라고 봐주시면 됩니다."
34020-31 = "네. 그런 것으로."
34020-32 = "[s] \"어…… 그, 그렇구나.\""
34020-33 = "……."
34020-34 = "어째서 티파티가 아니라 우리들이? 라는 의문이 드신다면, 그 부분은 제가 답변드리겠습니다."
34020-35 = "지금 티파티에는 도움이 필요합니다."
34020-36 = "……."
34020-37 = "에덴조약 사태 전후로, 티파티의 일원이 호스트를 공격하는 사건이 벌어졌고, 그 결과를 초래한 당사자가 감옥에 갇히는 초유의 사태가 발생했습니다."
34020-38 = "설마 세이아 님을 공격한 배후가 미카 님이었다니……."
34020-39 = "……."
34020-40 = "……."
34020-41 = "그 뒤 세이아 님을 지켜낸 것은, 여러분도 잘 아시듯이 저였습니다. 그래서 저도 나름대로 이 사건을 조사해 왔습니다."
34020-42 = "미카 님은 결과적으로 아리우스에게 이용당한 것이라 볼 수 있겠지만…… 그렇다고 그녀의 죄가 사라지는 것은 아닙니다."
34020-43 = "게다가 지금 호스트인 나기사 님은 <샬레>의 초법적 권한이라는 편법을 이용해 다른 학생들을 퇴학시키려고 했고요."
34020-44 = "……."
34020-45 = "피해를 입은 소녀들에게는 사과를 했고, 모든 일은 다 잘 마무리되었다고 들었으나……."
34020-46 = "그렇다고 나기사 님의 행동이 없던 게 되지는 않습니다."
34020-47 = "……."
34020-48 = "세이아 님은 다행히 학원으로 복귀할 수 있었지만…… 건강이 예전보다 더 악화되어서 자신의 방 밖으로 외출조차 못 하는 몸이 되었고요."
34020-49 = "따라서 지금의 <티파티>에는 좀 더 많은 관심이 필요하다는 것이 제 판단입니다."
34020-51 = "과연."
34020-52 = "……. 친절한 설명 감사드려요. 미네 단장."
34020-57 = "[ns] (부, 불편한 분위기다…….)"
34020-58 = "미네 단장은 요한 분파의 수장이기도 하면서 트리니티에서 가장 오래된 역사를 자랑하는 동아리의 리더."
34020-59 = "원래라면 티파티에 참석할 수 있는 권리가 있었지만…… 구호의 가치를 수행하기 위해 그녀 스스로 그 권리를 사양했었죠."
34020-60 = "과거의 이야기입니다."
34020-61 = "……이 사태의 핵심은 결국 아리우스 분교로 수렴됩니다."
34020-63 = "에덴조약 회담장의 습격, 그 사건의 배후로 지목된 것이 바로 아리우스 분교."
34020-66 = "마코토 의장과 미카는 둘 다 아리우스의 손에 놀아난 것일 뿐이고……."
34020-68 = "마코토 의장은 오히려 자신이 피해자이며, 트리니티의 분파인 아리우스가 자신들을 공격한 것이니 우리 쪽에 모든 책임이 있다고 주장하고 있지만요."
34020-69 = "미용실 비용도 우리에게 청구하겠다, 라고 알 수 없는 이야기를…… 뭐, 이건 넘어가고."
34020-71 = "아리우스가 이 모든 것을 뒤에서 조종했다면……. 그들에 관한 몇 가지 의문이 남게 됩니다."
34020-72 = "첫 번째. 아리우스 분교는 어째서 에덴조약을 방해했는가?"
34020-73 = "아리우스 분교는 오랫동안 우리 트리니티와 게헨나를 증오해 왔다고 들었습니다. 한번에 두 학원의 요인들을 무력화시킬 수 있는 좋은 기회였겠죠."
34020-74 = "그리고 에덴조약이라는 <계약>을 이용해서 불가해한 병력을 손에 넣었고요……. 세이아 씨는 그렇게 설명했어요."
34020-75 = "네. <유스티나 성도회>의 모습을 한 유령들. 그것들이 그대로 트리니티나 게헨나로 진격하는 데 성공했다면 두 학원은 무력하게 무너졌을 겁니다."
34020-76 = "……."
34020-77 = "대체 그건 뭐였던 겁니까?"
34020-78 = "거기에 대해서는 몇 가지 가설이 있긴 한데…… 그걸 뒷받침하는 증거를 찾질 못한 상태예요……."
34020-79 = "성도회는 본래 시스터후드의 전신이었던 집단. 사쿠라코 님, 이 부분에 대해서 숨기고 있는 것은 없습니까?"
34020-80 = "……. 네. 아쉽게도요."
34020-81 = "시스터후드는 비밀이 많은 집단이죠. 정보의 통제나 은닉, 왜곡에도 능하고요."
34020-86 = "학원 안에 시스터후드를 믿을 수 없다고 생각하는 소녀들이 많이 있다는 건 알고 계신가요?"
34020-92 = "……. 가령, 미네 단장처럼?"
34020-93 = "……."
34020-94 = "……."
34020-95 = "[s] (부, 불편해…….)"
34020-99 = "……제가 시스터후드의 모든 비밀을 알고 있을 거라 생각하신다면 그건 오산이에요."
34020-100 = "시스터후드에서는 저조차도 알지 못하는 비밀이 많이 있답니다. 내부 사정이라 자세하게 설명은 못 하지만."
34020-101 = "……그렇군요. 실례했습니다."
34020-102 = "하아……."
34020-103 = "트리니티의 방호 시스템을 무력화시켰던 그 순항 미사일……. 그쪽의 분석은 아직입니까?"
34020-104 = "네. 분석을 진행했지만 현재로선 출처도 구조도 불명…… 결론은 키보토스에 존재하는 기술이 아닌 것 같다는 추측뿐……."
34020-105 = "……결국, 아리우스 분교는 우리가 알지 못하는 힘을 최소 두 개는 확보하고 있다는 거군요."
34020-106 = "네. 그리고 그 부분은 두 번째 의문으로 이어지게 됩니다."
34020-107 = "두 번째. 아리우스 분교는 무엇을 계획하고 있는가?"
34020-108 = "……."
34020-109 = "……여기에 대해서는 저희는 아무것도 알 수 없어요."
34020-110 = "무엇보다 우리는 아리우스 자치구가 어디에 있는지도 알지 못합니다."
34020-111 = "……네. 그건 오래전부터 수수께끼였죠. 다만 저번 사건을 계기로 몇 가지 실마리를 얻긴 했어요."
34020-112 = "그들은 그때 통공의 고성당 지하에 있는 카타콤을 통해 잠입했습니다."
34020-113 = "그동안의 아리우스 학생들의 잠입 루트도 전부 카타콤과 연관되어 있었죠. 순항 미사일의 발사 위치도 트리니티 내에 있는 유적지구였고요."
34020-114 = "트리니티 자치구에 존재하는 지하 유적은 엄청나게 많지 않습니까? 그걸 모두 찾아내서 통제하는 건 불가능할 텐데."
34020-115 = "게다가 카타콤은 아직까지도 그 규모가 밝혀지지 않은 미궁…… 거기서 자력으로 아리우스 자치구를 찾는 것도 매우 어려운 일일 거구요."
34020-116 = "흐음……."
34020-117 = "세이아 씨의 말로는 그 자치구는 우리가 이해할 수 없는 어떤 힘으로 보호되고 있는 것 같다고 하더군요."
34020-118 = "그렇지 않고서야 이렇게까지 모습을 숨길 수 있다는 게 설명되지 않는다고……."
34020-119 = "또 이해할 수 없는 힘인가요……."
34020-120 = "과거에 아리우스 소속이었던 아즈사 씨의 말로는, 매 임무 때마다 카타콤의 출구가 기록된 지도를 받았었다고 하더군요."
34020-124 = "문제는 그 지도의 동선은 매번 달라지고 게다가 음어화까지 되어 있어서…… 배신자인 자신은 이제 아리우스 자치구로 돌아가는 길을 모른다고……."
34020-125 = "……그 소녀를 취조한 겁니까?"
34020-126 = "네? 네?!"
34020-127 = "시라스 아즈사, 그 아이에게 아리우스의 정보를 말하게 한 건가요?"
34020-128 = "그 아이는 이미 충분한 대가를 치렀습니다! 자신이 있던 자치구에서 배신자로 낙인찍히면서까지 우리를 위해 노력해주었어요!"
34020-130 = "간신히 마음의 평화를 찾았을 아이에게 우리 입장만을 위해서 또 다시 아리우스의 정보를 캐묻다니……. 이런 잔인한……!"
34020-131 = "아, 아뇨! 취조나 그런 게 아니라, 어디까지나 본인이 스스로 말해준 것으로……."
34020-133 = "그 소녀가 과연 그렇게 느꼈겠습니까! 티파티의 강압적인 권위를 이용해서 연약한 소녀를 강제로……!!"
34020-134 = "네?! 네?!"
34020-135 = "진정하세요, 미네 단장. 그런 게 아니니까요."
34020-136 = "……아닌가요?"
34020-137 = "네. 나기사 씨가 냉정하고 잔인한 사람이긴 하지만 이번에는 아니에요. 아즈사 씨가 무례한 대우를 받진 않았어요."
34020-141 = "무엇보다, <보충수업부>는 샬레의 선생님이 담임으로 있는 조직. 그런 일이 있었다면 선생님이 가만히 있지 않았겠죠."
34020-142 = "……그렇군요."
34020-143 = "실례했습니다. 나기사 님."
34020-144 = "……."
34020-145 = "[s3] (나기사의 찻잔이 떨리고 있는데……)\n[s4] \"괘, 괜찮아? 나기사?\""
34020-146 = "……네. 저도 알고 있어요."
34020-147 = "……네. 저도 알고 있어요."
34020-148 = "히후미 씨…… 하나코 씨, 코하루 씨, 아즈사 씨……."
34020-149 = "보충수업부의 모두는 본래 자신들이 책임져야 할 것보다 훨씬 더 많은 것들을 짊어졌어요……."
34020-150 = "그들이 짊어진 짐 중엔 제가 원인이 되었던 것들도 있었죠……."
34020-151 = "저도 염치라는 것이 있어요……. 저도 그 정도는 알고 있어요."
34020-152 = "그래서 에덴조약 사태 이후의 이런 뒤처리에는 그 아이들이 관여되지 않도록 어떻게든 노력을 했어요……."
34020-153 = "이런 지저분한 진흙탕 싸움은 우리들의 몫이어야만 하니까……. 그 아이들이 또다시 이런 일을 겪게 해서는 안 된다고 생각을……."
34020-154 = "[s] \"나기사…….\""
34020-155 = "……그렇군요. 나기사 님, 말씀에 동의합니다. 실례를 범한 것을 용서해 주시길."
34020-156 = "……저도 동감이에요."
34020-157 = "저도 마음 같아서는 하나코 씨에게 정말 많은 책무를 넘기고 싶지만……"
34020-158 = "저와 했던 계약도 그걸로 끝나버렸고……. 다시 그녀에게 무거운 짐을 지워서는 안 된다고 생각했어요."
34020-159 = "그래서 지금은 우리들만의 힘으로 남은 문제들을 해결하려고 하고 있습니다. 그게 우리가 할 수 있는 최소한의 예의겠죠."
34020-160 = "하지만 선생님은 저희와 끝까지 함께 해 주실 거라 믿고 있습니다."
34020-161 = "[s] \"응, 물론이지.\""
34020-162 = "……네. 감사합니다. 선생님."
34020-164 = "카타콤은 규모도 파악되지 않은 거대한 미로인데, 거기서도 매번 바뀌는 입구를 찾아야 한다라……. 확실히 어려운 문제겠군요."
34020-165 = "어쩌면…… 그 통로를 알고 있는 사람들에게 물어보면 될지도요."
34020-166 = "그 통로를 알고 있는 사람……?"
34020-169 = "습격을 주도했던 <아리우스 스쿼드>의 리더, 조마에 사오리. 그녀는 확실하게 그 길을 알고 있을 거예요."
34020-170 = "……과연. 그 모든 습격을 지휘한 게 그 사오리였으니까……."
34020-171 = "하지만 그 <스쿼드>의 행방은 아직도 오리무중이에요……. 이미 자치구로 도망쳤을 가능성이 높아요."
34020-172 = "그렇다면 한 명 더 있지 않나요?"
