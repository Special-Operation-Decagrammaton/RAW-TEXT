34020-241 = "[s] \"청문회?!\""
34020-242 = "말이 청문회이지, 사실 그동안의 행동에 대한 징계성에 가까운…… 사문위원회라고 봐야 해요."
34020-243 = "거기서 지금까지의 미카 씨가 저지른 죄와 부정…… 특히 에덴조약과 관계된 것들이 집중적으로 논의될 예정이고……."
