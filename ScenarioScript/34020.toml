34020-185 = "……확실히 미카 님은 아리우스 학생들과 접선하여 보급품들을 전달한 기록이 남아 있습니다."
34020-186 = "쿠데타를 꾸미기 위해 아리우스의 지원을 얻기 위해서……, 지금은 그렇게 생각하는 게 자연스럽습니다만."
34020-187 = "미카 씨는…… 하지만……."
34020-188 = "그동안의 미카 님의 평판과 행실은 그다지 모범적이라고 말할 수는 없습니다."
34020-189 = "잘 알고 계시겠지만 미카 님은 티파티라는 이유만으로 많은 자신의 실수나 문제를 무마해 왔죠."
34020-190 = "지금 학원에서 벌어지고 있는 미카 님에 대한 규탄과 소요, 여론 또한 그녀가 그동안 보여준 행동들과 관계가 없진 않겠죠."
34020-191 = "[s] (……소요?)"
34020-192 = "미카 씨가…… 거짓말을 했다고는…… 아리우스 자치구의 위치를 숨겨서…… 무엇을……."
34020-193 = "……."
34020-194 = "나기사 님이 미카 님을 어떻게 생각하는지는 잘 알고 있습니다."
34020-195 = "무례한 질문이겠지만, 미카 님을 가장 잘 알고 있는 분이 있다면 그건 바로 오랫동안 그녀를 곁에서 지켜보아 온 나기사 님이겠죠."
34020-196 = "……."
34020-201 = "나기사 님이 보시기에, 미카 님은 아직도 우리에게 숨기는 것이 있다고 생각하십니까?"
34020-205 = "그건……."
34020-206 = "[s] (나기사…….)"
34020-210 = "……. 아뇨. 저는 미카 씨를 믿어요."
34020-211 = "……."
34020-212 = "……."
34020-213 = "확실히…… 그동안의 미카 씨는 착한 학생이라고 할 수는 없겠지만……."
34020-214 = "그래도 지금 저는 미카 씨를 믿어요. 그게 제가 이번에 깨달은 교훈이니까요!"
34020-215 = "제가 믿으니까, 다른 사람들도 그렇게 믿게 할 거예요! 네! 내일 청문회에 저도 참석해서 미카 씨를 변호하겠어요!"
34020-216 = "당신들에게! 아니, 필요하다면 이 학원 전체에 말이에요!"
34020-217 = "설령 그 때문에 저에게 문제가 생겨도……."
34020-218 = "……. 아뇨. 저는 그냥 가설을 이야기해 본 것뿐, 다른 의도는 없었어요. 나기사 씨."
34020-219 = "……실례했습니다. 무례했다면 사과드립니다."
