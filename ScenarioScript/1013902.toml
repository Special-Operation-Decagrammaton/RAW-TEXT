[translation]
1013902-1 = "Niko's Omakase"
1013902-2 = "A few minutes after receiving a strange MomoTalk from Niko..."
1013902-3 = ""
1013902-6 = "...the bell to my office rang. I wasn't expecting any visitors."
1013902-8 = "\"Hello, this is FOX EATS!\""
1013902-9 = "\"Your food delivery is here!\""
1013902-10 = "[s1] Open the door.\n[s2] Do not open the door."
1013902-11 = ""
1013902-14 = "\"Oh my. The door appears to be locked this time too...\""
1013902-15 = "\"It can't be helped. I'll have to breach the door...\""
1013902-16 = "[ns] \"I'm coming! I'm coming!\""
1013902-19 = ""
1013902-20 = ""
1013902-21 = "Hello, Sensei. This is FOX EATS."
1013902-22 = "You haven't had dinner yet, right?"
1013902-23 = "No matter how busy you are, you shouldn't skip your meals. It's bad for your health."
1013902-24 = "[ns] \"No, I haven't eaten yet.\""
1013902-26 = "[ns3] \"But how did you know...?\"\n[ns4] \"Have you been SPYING on me?\""
1013902-29 = "Fufu, there are many ways for a special forces unit to gather intel."
1013902-30 = "For starters, your refrigerator is basically empty."
1013902-31 = "And no food delivery person visited Schale any time after lunch."
1013902-32 = "Finally, your status on your PC has been online all night, so I figured you haven't left your desk."
1013902-33 = "[s] \"...I have no response.\""
1013902-34 = "You need to eat, but you also shouldn't be sitting in one place for so long."
1013902-35 = "I'll get everything ready, if you'd like to take a break in the meantime."
1013902-36 = "[s] \"It'd be nice to step away for a little bit...\""
1013902-37 = ""
1013902-38 = "[ns] \"So, what's for dinner?\""
1013902-39 = "Fufu. It's not premade, but I did bring all of the necessary ingredients."
1013902-40 = "After all, there's nothing better than a freshly-made meal."
1013902-41 = "I can make most basic dishes with these ingredients. Do you have any requests?"
1013902-42 = "As long as it's my repertoire, I'm at your service."
1013902-43 = "[s] \"I'd be happy with anything you make...\""
1013902-44 = ""
1013902-47 = "[ns] \"Let's go with the chef's special, then.\""
1013902-48 = "Hm, the \"chef's special\"?"
1013902-49 = "My best dish is ordinary...but it'd be the inarizushi I always make for missions."
1013902-50 = "[s] \"That sounds perfect to me.\""
1013902-51 = "Sounds like a plan. I'll just need a moment to simmer the fried tofu."
1013902-54 = ""
1013902-55 = "...Making inarizushi in front of you like this reminds me of the past."
1013902-56 = "[s] \"Back when we first met?\""
1013902-57 = "Yes. I also made you lots of inarizushi back then."
1013902-58 = "Although my intentions were entirely different at that time..."
1013902-59 = "But I think that my inarizushi is always filled with my sincere feelings."
1013902-60 = "Because it's a cherished staple amongst my squad members now."
1013902-61 = "[s] \"What prompted you to start making inarizushi?\""
1013902-62 = "Hm. I wonder when it was..."
1013902-63 = "It must've started when FOX Squad first came to be. I thought it would be good to pack emergency rations, in case our missions went long."
1013902-64 = "I was pretty new to cooking, and inarizushi was one of the few things I could make."
1013902-65 = "Not that I was even very good at it. Almost all the fried tofu pouches split because I didn't stuff them properly."
1013902-66 = "All my squad members said they were delicious, though. So making inarizushi eventually became a habit of sorts."
1013902-67 = "It's funny how things work out. I didn't even like fried tofu that much back then."
1013902-68 = "[s] \"I think I get it.\""
1013902-69 = ""
1013902-71 = ""
1013902-72 = "[ns5] \"Certain dishes taste better with good memories attached to them.\"\n[ns6] \"So your inarizushi is filled with your precious memories!\""
1013902-75 = "...Yes. It's a special dish for me."
1013902-76 = "Aaand, the inarizushi is ready!"
1013902-77 = "[s7] \"Already?\"\n[s8] \"That was fast...\""
1013902-80 = "It really is a simple dish. I just have to fill up the fried tofu slices."
1013902-81 = "Frying the tofu can take a little while, but otherwise it's easy to make."
1013902-82 = "[s] \"Thank you for the meal!\""
1013902-83 = "Wait, Sensei."
1013902-84 = "Fufu. You said you wanted the chef's special for tonight, right?"
1013902-85 = ""
1013902-87 = ""
1013902-88 = ""
1013902-89 = "I made some fried tofu udon on the side too. Please eat this for dinner tonight!"
1013902-90 = "Warm soup will fill you right up, since it's cold tonight."
1013902-91 = "[s] \"I don't mind, but what should I do with the inarizushi you made?\""
1013902-92 = "Inarizushi is actually one of those dishes that tastes better the next day."
1013902-93 = "...Sensei. Was your plan to heat up some microwavable food for breakfast or skip breakfast entirely?"
1013902-94 = "[ns] \"...Is that more intel you gathered on me?\""
1013902-95 = "That one was just a hunch. Heehee."
1013902-96 = "I can read you like a book, Sensei."
1013902-97 = "Have the inarizushi for breakfast tomorrow. I'll put it in the fridge for you."
1013902-98 = "And don't overdo it tonight, okay?"
1013902-99 = "Good night, Sensei."
1013902-101 = "Niko's homemade bowl of fried tofu udon warmed me from my head to my toes."
