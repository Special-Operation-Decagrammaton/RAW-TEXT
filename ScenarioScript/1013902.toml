[translation]
1013902-1 = "仁子的主廚精選"
1013902-2 = "（收到仁子那有點奇怪的MomoTalk的幾分鐘後……）"
1013902-3 = ""
1013902-6 = "（明明預定的訪客一個都沒有，辦公室的門鈴卻突然響了）"
1013902-8 = "「您好，這裡是FOX EATS。」"
1013902-9 = "「您訂購的餐點送達了！」"
1013902-10 = "[s1] 開門\n[s2] 不開門"
1013902-11 = ""
1013902-14 = "「哎呀，這次門也鎖著呢……」"
1013902-15 = "「沒辦法了，看來只能再嘗試一次破門了──」"
1013902-16 = "[ns] 「我現在馬上開門！」"
1013902-19 = ""
1013902-20 = ""
1013902-21 = "您好，老師。#n這裡是FOX EATS。"
1013902-22 = "您還沒吃晚餐吧？"
1013902-23 = "就算再怎麼忙也不能不吃飯哦。#n這樣會把身體搞壞的。"
1013902-24 = "[ns] 「我確實是還沒吃晚餐……」"
1013902-26 = "[ns3] 「不過你是怎麼知道這件事的？」\n[ns4] 「難道我被竊聽了嗎……」"
1013902-29 = "呵呵，特殊部隊蒐集情報的方法可多著呢。"
1013902-30 = "首先，我今天下午確認夏萊的冰箱時，發現裡面的食材已經所剩無幾……"
1013902-31 = "在午餐過後，也沒有人帶著食物造訪夏萊。"
1013902-32 = "最重要的是，您PC上的通訊軟體一直顯示在線狀態。#n所以我想您應該是一直坐在書桌前吧。"
1013902-33 = "[s] 「……我無法反駁呢。」"
1013902-34 = "吃飯歸吃飯，在同一個位置坐太久對身體也不好。"
1013902-35 = "我馬上就把餐點準備好，這段時間請您好好休息一下吧。"
1013902-36 = "[s] 「那就稍微喘口氣吧……」"
1013902-37 = ""
1013902-38 = "[ns] 「話說回來，你帶了什麼吃的過來？」"
1013902-39 = "呵呵。我帶來的並不是餐點，而是食材。"
1013902-40 = "因為大部分的料理，都是剛做好的時候最溫暖最美味。"
1013902-41 = "配合冰箱裡剩下的食材，大部分的料理應該都能做出來。#n能告訴我您想吃的菜色嗎？"
1013902-42 = "只要是我會做的，都可以馬上做給您吃。"
1013902-43 = "[s] 「只要是仁子做的我都喜歡……」"
1013902-44 = ""
1013902-47 = "[ns] 「那就拜託[ruby=主廚精選]仁子推薦[/ruby]了。」"
1013902-48 = "我的推薦菜色嗎？"
1013902-49 = "要說我最有自信的料理……就只有平常包給隊員們吃的豆皮壽司了。"
1013902-50 = "[s] 「沒關係。就交給你吧。」"
1013902-51 = "我明白了。#n那我得先把豆皮滷一下，請您稍等一會。"
1013902-54 = ""
1013902-55 = "……像這樣在老師面前做著豆皮壽司，會讓我想起以前的事呢。"
1013902-56 = "[s] 「就是跟仁子初次見面的時候吧？」"
1013902-57 = "是的。那時候我也做了一大堆豆皮壽司給老師吃呢。"
1013902-58 = "雖然當時是出於作戰需要，為了避免老師懷疑所採取的行動……"
1013902-59 = "不過唯獨豆皮壽司，我始終沒有摻雜任何私心，是以真心去製作的。"
1013902-60 = "因為那是小隊的大家最喜歡的食物。"
1013902-61 = "[s] 「是有什麼契機讓你開始做豆皮壽司嗎？」"
1013902-62 = "這個嘛……是從什麼時候開始的呢……"
1013902-63 = "在FOX小隊成立後沒多久，我就想為了應付作戰膠著的情況準備便當。"
1013902-64 = "可是當時的我並不擅長料理，能做的就只有豆皮壽司那種簡單的食物而已。"
1013902-65 = "結果不只醋汁調得太甜，填餡也不太成功……破掉的豆皮甚至超過了一半……"
1013902-66 = "不過隊員們都說很好吃，還一直鼓勵我……#n所以在那之後就順勢做著豆皮壽司，結果不知不覺就變成習慣了。"
1013902-67 = "現在想想也真奇怪。我當時明明沒有那麼喜歡豆皮壽司的說。"
1013902-68 = "[s] 「我好像能理解。」"
1013902-69 = ""
1013902-71 = ""
1013902-72 = "[ns5] 「在料理的風味中，回憶也會作為一種調味料發揮作用呢。」\n[ns6] 「仁子的豆皮壽司，是一道蘊含著深刻回憶的料理呢。」"
1013902-75 = "……是的。對我來說，這是一道特別的料理。"
1013902-76 = "來，就在我們交談的這段時間，豆皮壽司完成了！"
1013902-77 = "[s7] 「已經好了？」\n[s8] 「好快……」"
1013902-80 = "就像剛才說的，這只是把豆皮填上餡料就完成的簡單料理嘛。"
1013902-81 = "除非要從炸豆皮開始準備，不然只要有足夠的材料，要做多少都可以。"
1013902-82 = "[s] 「那我就不客氣了──」"
1013902-83 = "請等一下，老師。"
1013902-84 = "呵呵，您剛才有說過吧？#n今晚的菜色，就聽我推薦的。"
1013902-85 = ""
1013902-87 = ""
1013902-88 = ""
1013902-89 = "這是我在滷豆皮時順便做的豆皮烏龍麵。#n今天的晚餐，就請您吃這個吧。"
1013902-90 = "因為今晚氣溫偏低，我認為搭配溫熱湯汁的料理會對身體更好。"
1013902-91 = "[s] 「菜色我是無所謂，但那些豆皮壽司怎麼辦呢……？」"
1013902-92 = "雖然大部分的料理都是剛做好的時候最美味，#n不過豆皮壽司稍微放一段時間，等入味之後會變得更好吃。"
1013902-93 = "……老師。您明天也打算不吃早餐，或者隨便用調理包草草了事對吧？"
1013902-94 = "[ns] 「……那也是你透過蒐集情報查出來的嗎？」"
1013902-95 = "不，這是我的直覺。"
1013902-96 = "其實老師您意外地是個好懂的人哦。"
1013902-97 = "這份豆皮壽司我會放進冰箱裡，請您留到明天早上再吃吧。"
1013902-98 = "今晚也請別太勉強自己。"
1013902-99 = "那麼，祝您有個美好的夜晚。"
1013902-101 = "（之後吃著仁子做的豆皮烏龍麵，難得地度過了一段溫暖的晚餐時光）"
