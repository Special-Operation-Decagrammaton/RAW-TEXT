[translation]
1013902-1 = "โอมากาเสะของนิโกะ"
1013902-2 = "(ไม่กี่นาทีหลังจากได้รับข้อความ MOMOTALK แปลกๆ จากนิโกะ...)"
1013902-3 = ""
1013902-6 = "(วันนี้ไม่ได้นัดใครไว้ แต่จู่ๆ กริ่งประตูสำนักงานก็ดังขึ้น)"
1013902-8 = "<สวัสดีค่ะ นี่คือ FOX EATS ค่ะ>"
1013902-9 = "<อาหารที่คุณลูกค้าสั่ง มาถึงแล้วค่ะ!>"
1013902-10 = "[s1] เปิดประตู\n[s2] ไม่เปิดประตู"
1013902-11 = ""
1013902-14 = "<ตายจริง ครั้งนี้ประตูก็ล็อกอีกแล้วนะคะ...>"
1013902-15 = "<งั้นก็ช่วยไม่ได้ค่ะ ฉันคงไม่มีทางเลือกอื่น นอกจากต้องพังประตูเข้าไปอีกครั้ง>"
1013902-16 = "[ns] \"ครูจะเปิดให้เดี๋ยวนี้แหละ!\""
1013902-19 = ""
1013902-20 = ""
1013902-21 = "สวัสดีค่ะ คุณครู นี่คือ FOX EATS ค่ะ"
1013902-22 = "ยังไม่ได้ทานมื้อเย็นใช่มั้ยคะ?"
1013902-23 = "ต่อให้งานยุ่งแค่ไหน ก็ไม่ควรอดอาหารสิคะ เดี๋ยวสุขภาพจะแย่ลงค่ะ"
1013902-24 = "[ns] \"ก็จริงอยู่ที่ครูยังไม่ได้กินอะไร...\""
1013902-26 = "[ns3] \"รู้ได้ยังไงน่ะว่าครูยังไม่ได้กินมื้อเย็น?\"\n[ns4] \"แอบดักฟังครูอยู่เหรอ...\""
1013902-29 = "ฮุฮุ พวกหน่วยรบพิเศษมีวิธีเก็บข้อมูลถมเถไปค่ะ"
1013902-30 = "ก่อนอื่นเลย จากการตรวจสอบตู้เย็นของชาเล่ต์ตอนบ่ายวันนี้ ที่นี่แทบไม่มีวัตถุดิบอาหารเลย"
1013902-31 = "แล้วหลังจากมื้อกลางวัน ก็ไม่มีใครที่แวะมาที่ชาเล่ต์พร้อมอาหารในมือด้วยค่ะ"
1013902-32 = "และที่สำคัญที่สุด โปรแกรมแชตในคอมพิวเตอร์ขึ้นว่าคุณครูออนไลน์อยู่ตลอด ฉันก็เลยคิดว่าคุณครูต้องนั่งอยู่ที่โต๊ะทำงานตลอดแน่นอนค่ะ"
1013902-33 = "[s] \"งั้นก็ปฏิเสธไม่ได้เลยแฮะ...\""
1013902-34 = "การกินก็อีกเรื่องหนึ่ง แต่การนั่งอยู่กับที่นานเกินไปก็ไม่ดีต่อสุขภาพนะคะ"
1013902-35 = "ฉันจะไปเตรียมอาหารมาให้ ระหว่างรอ คุณครูน่าจะพักผ่อนสักหน่อยนะคะ"
1013902-36 = "[s] \"งั้นก็ขอพักหายใจสักหน่อยดีมั้ยนะ...\""
1013902-37 = ""
1013902-38 = "[ns] \"จะว่าไป นิโกะเอาอาหารอะไรมาให้ครูเหรอ?\""
1013902-39 = "ฮุฮุ ที่ฉันเตรียมมาไม่ใช่อาหารพร้อมทาน แต่เป็นวัตถุดิบทำอาหารอีกทีค่ะ"
1013902-40 = "อาหารส่วนใหญ่จะอร่อยที่สุดเมื่อปรุงสดใหม่และยังอุ่นอยู่นี่คะ"
1013902-41 = "ถ้าใช้วัตถุดิบที่ยังพอมีเหลืออยู่ในชาเล่ต์ ก็น่าจะทำอาหารได้บ้าง คุณครูมีเมนูไหนที่อยากทานมั้ยล่ะคะ?"
1013902-42 = "ถ้าเป็นเมนูที่ฉันทำได้ ฉันจะรีบไปทำมาให้เลยค่ะ"
1013902-43 = "[s] \"ถ้านิโกะทำให้ ไม่ว่าอาหารอะไรครูก็กินได้หมดเลย...\""
1013902-44 = ""
1013902-47 = "[ns] \"งั้นขอเป็น[ruby=โอมากาเสะ]เมนูแนะนำ[/ruby]จากนิโกะแล้วกัน\""
1013902-48 = "เมนูแนะนำจากฉันเหรอคะ?"
1013902-49 = "ถ้าให้เลือกอาหารที่ฉันมั่นใจที่สุด... ก็คงเป็นซูชิเต้าหู้หวานธรรมดาที่ฉันชอบทำให้สมาชิกใน#nกองทหารกินค่ะ"
1013902-50 = "[s] \"ได้เลย ครูจะกินตามที่นิโกะแนะนำนี่แหละ\""
1013902-51 = "ได้ค่ะ ถ้างั้นฉันต้องเอาเต้าหู้ไปเคี่ยวก่อน ช่วยรอสักครู่นะคะ"
1013902-54 = ""
1013902-55 = "พอได้มาทำซูชิเต้าหู้หวานต่อหน้าคุณครูแบบนี้ ก็นึกถึงเรื่องราวในอดีตขึ้นมาเลยนะคะ..."
1013902-56 = "[s] \"หมายถึงตอนครูได้เจอนิโกะครั้งแรกใช่มั้ย?\""
1013902-57 = "ใช่ค่ะ ตอนนั้นฉันก็ทำซูชิเต้าหู้หวานให้คุณครูทานเยอะเลยนี่คะ"
1013902-58 = "ถึงการทำอาหารตอนนั้นจะเป็นส่วนหนึ่งของปฏิบัติการเพื่อหลีกเลี่ยงไม่ให้คุณครูสงสัยก็เถอะค่ะ..."
1013902-59 = "แต่อย่างน้อยก็มีซูชิเต้าหู้หวานนี่ละค่ะ ที่ฉันตั้งใจทำออกมาจากใจจริงๆ โดยไม่มีเจตนาอื่น#nแอบแฝงเลยสักครั้งเดียว"
1013902-60 = "แล้วมันก็เป็นอาหารที่สมาชิกทุกคนชอบด้วยค่ะ"
1013902-61 = "[s] \"มีเหตุผลอะไรที่มาเริ่มทำซูชิเต้าหู้หวานเหรอ?\""
1013902-62 = "อืม ตั้งแต่ตอนไหนกันนะ..."
1013902-63 = "หลังจากตั้งกองทหาร FOX ได้ไม่นาน ฉันก็คิดว่าควรทำข้าวกล่องเตรียมไว้ เผื่อว่าต้องออก#nปฏิบัติการที่กินเวลานานน่ะค่ะ"
1013902-64 = "แต่ว่าตอนนั้นฉันยังทำอาหารไม่เก่ง อาหารที่พอทำได้ก็มีแต่อาหารง่ายๆ อย่างซูชิเต้าหู้หวานค่ะ"
1013902-65 = "ถึงมันจะทำง่าย แต่ตอนนั้นฉันผสมน้ำส้มสายชูกับน้ำตาลจนหวานเจี๊ยบ แถมตอนยัดไส้ก็พังไม่เป็นท่า จนเต้าหู้แตกไปเกินครึ่ง..."
1013902-66 = "แต่สมาชิกในกองก็ยังชมว่าอร่อยแถมยังช่วยให้กำลังใจฉันด้วย หลังจากนั้นฉันก็เลยทำ#nซูชิเต้าหู้หวานมาตลอด จนกลายเป็นความเคยชินไปแล้วค่ะ"
1013902-67 = "น่าตลกดีนะคะ ตอนนั้นฉันไม่ค่อยชอบเต้าหู้ทอดเท่าไรเลยด้วยซ้ำ"
1013902-68 = "[s] \"ครูเข้าใจนะ\""
1013902-69 = ""
1013902-71 = ""
1013902-72 = "[ns5] \"สำหรับอาหาร ความทรงจำก็เป็นเครื่องปรุงอย่างหนึ่งเหมือนกัน\"\n[ns6] \"ซูชิเต้าหู้หวานของนิโกะเป็นอาหารที่มีความทรงจำลึกซึ้งเลยนะ\""
1013902-75 = "ค่ะ... มันเป็นอาหารพิเศษสำหรับฉันค่ะ"
1013902-76 = "เอาละ เราคุยกันนานจนฉันทำซูชิเต้าหู้หวานเสร็จแล้วค่ะ!"
1013902-77 = "[s7] \"เสร็จแล้วเหรอ?\"\n[s8] \"ไวมากเลย...\""
1013902-80 = "อย่างที่ฉันบอกไปว่ามันเป็นอาหารที่ทำง่ายๆ แค่ใส่ไส้ลงในเต้าหู้ทอดก็กินได้แล้วค่ะ"
1013902-81 = "ถ้าต้องทอดเต้าหู้ตั้งแต่แรกก็อาจยากหน่อย แต่ถ้ามีวัตถุดิบครบอย่างวันนี้... จะให้ทำเพิ่มอีกกี่จานก็ยังได้เลยค่ะ"
1013902-82 = "[s] \"จะกินให้อร่อยเลย\""
1013902-83 = "เดี๋ยวก่อนค่ะ คุณครู"
1013902-84 = "ฮุฮุ เมื่อกี้คุณครูพูดเองไม่ใช่เหรอคะ? ที่บอกว่ามื้อเย็นวันนี้ จะทานตามที่ฉันแนะนำน่ะค่ะ"
1013902-85 = ""
1013902-87 = ""
1013902-88 = ""
1013902-89 = "นี่คืออุด้งจากเต้าหู้ที่เคี่ยวไว้เมื่อกี้ค่ะ มื้อเย็นวันนี้คุณครูทานเมนูนี้นะคะ"
1013902-90 = "คืนนี้อากาศค่อนข้างเย็น การทานซุปอุ่นๆ จะดีต่อสุขภาพมากกว่าซูชิเต้าหู้หวานค่ะ"
1013902-91 = "[s] \"ก็ได้อยู่หรอกนะ ถ้างั้นแล้วซูชิเต้าหู้หวานนี่ล่ะ...?\""
1013902-92 = "อาหารส่วนใหญ่จะอร่อยที่สุดหลังจากปรุงเสร็จก็จริง แต่ซูชิเต้าหู้หวานจะยิ่งอร่อยหลังจากทิ้งไว้#nสักระยะจนรสชาติซึมซาบเข้าไปดีแล้วค่ะ"
1013902-93 = "คุณครูคะ... ยังไงพรุ่งนี้เช้าก็จะอดข้าว หรือไม่ก็จะพึ่งอาหารสำเร็จรูปอยู่แล้วใช่มั้ยคะ?"
1013902-94 = "[ns] \"รู้เรื่องนั้นระหว่างที่รวบรวมข้อมูลด้วยเหรอ...?\""
1013902-95 = "เปล่าหรอกค่ะ ก็แค่สัญชาตญาณทั่วไปน่ะค่ะ"
1013902-96 = "ก็คุณครูเป็นคนที่พอจะเดาได้อยู่แล้วนี่คะ"
1013902-97 = "ฉันจะเอาซูชิเต้าหู้หวานไปใส่ตู้เย็นไว้ให้ ไว้คุณครูหยิบมาทานพรุ่งนี้เช้านะคะ"
1013902-98 = "แล้วคืนนี้ก็อย่าหักโหมให้มากเกินไปด้วยละค่ะ"
1013902-99 = "ถ้างั้นก็ ราตรีสวัสดิ์นะคะ"
1013902-101 = "(หลังจากนั้นคุณครูก็ได้ใช้เวลาของค่ำคืนนั้นอย่างอบอุ่นพร้อมกับอุด้งเต้าหู้ทอดที่นิโกะทำให้)"
