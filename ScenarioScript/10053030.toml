[translation]
10053030-1 = "第3話;幽靈巴士"
10053030-5 = "哇……"
10053030-6 = "這是不是有點太誇張了？"
10053030-11 = "真的是這條路嗎？"
10053030-12 = "至少從地圖上看是對的。"
10053030-13 = "不會是被騙了吧？"
10053030-14 = "不可能，這是通過可信的網站預約的，我也確認了今年的評價，所以不會錯。"
10053030-15 = "通往山莊的路就只有這條。"
10053030-16 = "過去的時候不會斷掉吧……"
10053030-20 = "下面是河，就算掉下去游上來就行了吧？"
10053030-21 = "你在講什麼啊……"
10053030-23 = "那邊的姑娘們。"
10053030-28 = "是要去對面的山莊嗎？"
10053030-30 = "真的有這種情節呢。"
10053030-32 = "如果你們找的是「那個山莊」的話……"
10053030-33 = "最好放棄。"
10053030-35 = "什麼！？果然是詐騙嗎！？我們果然被騙了！？"
10053030-37 = "不，山莊確實存在。但是……最好不要住在那裡……"
10053030-38 = "原因……去了就知道了。"
10053030-40 = "……！"
10053030-42 = "我已經警告你們了。現在去找別的地方也不晚。"
10053030-48 = "……？好奇怪的老爺爺呢。"
10053030-49 = "好，趁天還沒黑趕快走吧。鄉下太陽落得早。"
10053030-50 = "等，等一下！就這樣走嗎！？"
10053030-51 = "嗯？我漏掉什麼了嗎？"
10053030-52 = "不是！明明都說是「警告」了！怎麼看都是在等我們啊！？"
10053030-53 = "木乃香君……把自己看作是世界上最重要的心態是值得讚許的。"
10053030-54 = "但是，相信一切都以自己為中心轉動是誇大妄想的開始。"
10053030-55 = "你可以克服的。"
10053030-60 = "說起來，木乃香很膽小呢……"
10053030-61 = "會相信在網路上發現的奇怪故事，自己嚇自己然後晚上睡不著……"
10053030-62 = "蛤！？誰膽小了！絕對沒有好嗎！"
10053030-63 = "都特地來警告的話不就代表很危險嗎？你們也知道，現代人都有安全麻痺症……"
10053030-64 = "對了，老師！！老師不覺得很可疑嗎！？"
10053030-65 = "[s1] 「確實說是巧合也太巧了……」\n[s2] 「確實有點在意。」"
10053030-68 = "果然老師也這麼想吧！？"
10053030-70 = "……話說在前頭，附近沒有其他住宿。"
10053030-71 = "去最近的村子要走1小時。"
10053030-72 = "呃，不要。"
10053030-73 = "做好覺悟吧，都已經付錢了，當天取消也不退款。"
10053030-75 = "老師是站我這邊的吧！？"
10053030-76 = "[ns3] 「走路1小時……」\n[ns4] 「應該叫不到計程車吧……」"
10053030-80 = "[ns] 「木乃香。」"
10053030-82 = "[ns] 「人有必須鼓起勇氣的時刻。」"
10053030-83 = "老師！？！？"
10053030-87 = "好～如果有幽靈出現，我會負責保護木乃香君的～"
10053030-88 = "不，不要把那個字說出來！說了就會「出來」的！"
10053030-89 = "如果那麼容易「出來」的話早就被觀測到了吧。來，牽著我的手～"
10053030-90 = "知，知道了啦！不要拉我！我會自己走！"
10053030-99 = "裡面比想像中乾淨呢？"
10053030-102 = "從外面看的時候還以為會更髒，只是這種程度的話還算可以住。"
10053030-103 = "那個，玲奈。不覺得這裡有點陰森嗎？"
10053030-104 = "……還在在意剛才那個老爺爺說的話嗎？"
10053030-105 = "不是，是真的！好像感覺到什麼了！總覺得有點冷……！"
10053030-107 = "確實，冷點現象是幽靈出沒的代表性現象之一。"
10053030-112 = "但是室內沒有檢測到不自然的局部溫度變化，所以不用擔心。"
10053030-117 = "那是什麼？相機？"
10053030-118 = "對！準確地說是有拍攝功能的熱像儀！只要有熱源，即使在沒有光的地方也能觀測。"
10053030-119 = "真的是有備而來呢……"
10053030-120 = "當然啊。我們要找的是任何人都沒有發現的傳說生物。"
10053030-121 = "總之，木乃香君，這裡沒有發生冷點現象，所以放心吧。"
10053030-123 = "哦哦，不愧是所長！真可靠！"
10053030-124 = "呵呵，我可是專業的。"
10053030-129 = "……嗯？老師？有什麼問題嗎？"
10053030-130 = "[ns5] 「沒有，因為你說是專業……」\n[ns6] 「不是社團活動嗎？」"
10053030-133 = "……！"
10053030-134 = "那，那是個有趣的話題，但下次再說吧……！"
10053030-135 = "比起那個，快點！鄉下太陽落得早，再不出發會浪費今天一整天的！"
10053030-140 = "他突然怎麼了？"
10053030-141 = "不想談社團活動的心情……莫名地非常有共鳴……"
10053030-142 = "[s7] 「你們兩個也不知道嗎？」\n[s8] 「關於社團什麼的？」"
10053030-145 = "呃……"
10053030-149 = "咦？奇怪，為什麼翼的事我什麼都不知道？"
10053030-150 = "不是很正常嗎？就算認識很久，終究只是網友。"
10053030-151 = "衣斐玲奈，狂獵藝術學園1年級，主修時裝設計。"
10053030-152 = "咦，等一下？為什麼？"
10053030-156 = "住在學院宿舍的第4棟，房號大概是……"
10053030-157 = "唉，這個數字不太想說出口，是404號吧？同房的只有三位前輩。"
10053030-158 = "那個房號加上居住人數……哇，起雞皮疙瘩了。"
10053030-159 = "我才要起雞皮疙瘩好嗎！？你是怎麼知道的！？難道是跟蹤狂……！？"
10053030-160 = "嘖嘖嘖，你還太嫩了，很多事情都是有訣竅的。"
10053030-161 = "人在網路上發東西的時候本來就會不經意地洩露個人資訊。"
10053030-162 = "例如，去便利商店的時間或是上課的路線有沒有坡道等等，#n綜合平時的發言就能推測出住在哪棟。"
10053030-163 = "但是，我沒說過住幾號之類的啊？"
10053030-164 = "之前不是抱怨過因為房號什麼事都不順嗎？不吉利的號碼是4或6。#n但既然確定住在4棟，那就是404吧。通常不會有人覺得406號也不吉利。"
10053030-165 = "……難道木乃香是偵探之類的？"
10053030-166 = "什麼偵探。"
10053030-167 = "姐姐我可是能讓哭泣的太妹都住嘴的公安局成員。"
10053030-168 = "木乃香真的是女武神啊。我還以為這是時尚。"
10053030-169 = "咦～剛才是說我看起來像混混所以和女武神完全不搭嗎？"
10053030-170 = "我沒說到那種程度！"
10053030-171 = "但還是有想過那麼一點吧？"
10053030-172 = "才，才沒有！"
10053030-173 = "但也不是完全沒想過吧。稍微一點？對吧？嗯？"
10053030-174 = "嗯……如果只是一點點的話……"
10053030-175 = "老師！！玲奈說我是混混！！"
10053030-176 = "咦！？哪，哪有！？是你讓我說的！"
10053030-177 = "[s9] 「不要太捉弄玲奈……」\n[s10] 「再怎麼說……玲奈也是前輩。」"
10053030-178 = "好的～"
10053030-183 = "老，老師！？"
10053030-186 = "啊啊！！真是的！！別再捉弄我了！！"
10053030-189 = "……根據情報，槌之子的目擊報告分布在白川山的河邊。"
10053030-192 = "如果槌之子是生物的話，沿著水源棲息是自然的，很可能在人跡罕至的山腰或山谷深處。"
10053030-197 = "OK，收到～"
10053030-198 = "白川山～去白川山的巴士～"
10053030-202 = "……哇，你們看。"
10053030-203 = "只有一條路線，一天還只有兩班？"
10053030-204 = "那是因為這裡是沒有什麼觀光景點，貨真價實的鄉下……"
10053030-205 = "唉～我的命啊～"
10053030-206 = "但是下一班是30分鐘後，隨便打發一下時間就來了吧。"
10053030-211 = "嗯？好像有巴士來了？"
10053030-212 = "咦？奇怪。比時刻表上的時間早了很多。"
10053030-217 = "……"
10053030-220 = "…………"
10053030-221 = "……啊！"
10053030-222 = "這難道是……！"
10053030-225 = "隨著靠近槌之子，我失去的運氣開始回來了！"
10053030-226 = "果然以蛇為線索的這個判斷是正確的！"
10053030-231 = "真的是運氣嗎……？不，應該是巧合吧。"
10053030-232 = "等一下，玲奈君，老師。"
10053030-233 = "那輛巴士的車牌，難道只有我覺得很奇怪嗎？"
10053030-234 = "[s11] 「嗯？「Ｓ 44-66號」……？」\n[s12] 「好不吉利的車牌……」"
10053030-237 = "大家應該都知道，一般車牌不會用「Ｓ」。因為會讓人聯想到死亡所以不吉利。"
10053030-238 = "而且還是「44-66號」……"
10053030-239 = "「Ｓ 44-66號」巴士……？"
10053030-240 = "嗯？難道你知道？"
10053030-241 = "嗯……說不上知道，但前陣子SNS上流行過類似的文章。"
10053030-242 = "說是幽靈乘坐的巴士……"
10053030-243 = "幽靈……？"
10053030-244 = "嗯，是很老套的故事。#n上了車才發現是一輛滿是幽靈的巴士，然後就像逃跑一樣地下了車……"
10053030-245 = "或是上車睡著後，在和奇普托斯相似但完全不同的異世界下了車……#n就是那種老套的異世界探險怪談。"
10053030-246 = "這些故事在網路上流行了一陣子。"
10053030-247 = "然後那些怪談裡出現的巴士號碼都是「Ｓ 44-66號」……？"
10053030-251 = "是，是巧合吧！順便說一下我完全不相信哦！"
10053030-252 = "首先在大白天的，在第一次來的鄉下偶然遇到怪談裡的巴士這說得通嗎？太剛好了！"
10053030-253 = "但是，萬一眼前的是「真的」呢……？"
10053030-254 = "……"
10053030-259 = "老師～大家～你們不上車嗎？巴士在等耶？"
10053030-260 = "[ns13] 「好像不是那輛巴士。」\n[ns14] 「等下一班吧。」"
10053030-264 = "咦？但是經過這站的巴士只有這一輛……？"
10053030-265 = "……嗯？"
10053030-266 = "奇怪，仔細看這巴士連號碼和路線都沒貼。"
10053030-267 = "不好意思，請問是去白川山的巴士嗎？"
10053030-268 = "…………"
10053030-269 = "不好意思……？聽得見嗎？"
10053030-270 = "…………"
10053030-274 = "好可疑……"
10053030-275 = "……這樣的話，只能拿那個出來了嗎？"
10053030-277 = "拿什麼？難道是槍？"
10053030-278 = "和幽靈打架好像不是什麼好主意……"
10053030-281 = "老師，請好好看著木乃香。"
10053030-282 = "和「迷信」扯上關係的木乃香一定會惹出「事故」。"
10053030-284 = "[ns15] （難道，環奈擔憂的是這個……？）\n[ns16] 「那個，木乃香，先讓巴士走吧……」"
10053030-289 = "不，老師。對付那種傢伙這種方法最有效。"
10053030-290 = "看來只能拿出那個了。"
10053030-295 = "[ns17] 「那是什麼……？」\n[ns18] 「學生手冊？」"
10053030-298 = "您一臉完全不理解的表情呢。"
10053030-299 = "反正看著就行了，在奇普托斯開車的人比起槍更怕這個。"
10053030-300 = "那邊的大叔，這裡是女武神，請出示駕照。"
10053030-302 = "…………"
10053030-303 = "沒聽到嗎？我說請出示駕照，你知道拒絕的話違反道路交通法吧？想被開罰單嗎？"
10053030-305 = "…………"
10053030-309 = "喂！大叔！站住！給我停下來……！"
10053030-314 = "……真的走了。"
10053030-315 = "幽靈也怕被開罰單嗎……？"
10053030-317 = "唉……如果下次被我抓到……"
10053030-318 = "但是老師，您怎麼知道那是奇怪的巴士？看起來就只是普通的巴士啊。"
10053030-319 = "[s19] 「呃……是玲奈告訴我的。」\n[s20] 「多虧了翼……」"
10053030-321 = "咦！？哦！對，對啊！怎麼說呢，就是動作有點可疑……！"
10053030-322 = "（要借我的名義先說一聲啊！嚇死我了！）"
10053030-327 = "哼～？"
10053030-329 = "咦！？呃……我是專家嘛！自然有辦法知道……"
10053030-330 = "嗯？什麼方法？"
10053030-331 = "那，那個，對木乃香君來說還太早了……"
10053030-335 = "哼～？"
10053030-342 = "啊，這次是真正的巴士吧？"
10053030-347 = "這次是真的吧……呃，不是！我不是說剛才的是幽靈巴士！"
10053030-354 = "歡迎～請小心上車～"
10053030-355 = "啊，你好。"
10053030-356 = "那個，這可能是個奇怪的問題。剛才前面走掉的巴士……"
10053030-358 = "……什麼？前面有巴士？那真奇怪。"
10053030-359 = "這條路線只有這輛巴士才對。"
10053030-360 = "……！？\n\n"
10053030-363 = "（結果，到最後還是不知道那輛可疑的巴士從哪裡來往哪裡去……）"
