[translation]
10053030-1 = "第3話;幽靈巴士"
10053030-4 = ""
10053030-5 = "哇……"
10053030-6 = "這是不是有點太誇張了？"
10053030-7 = ""
10053030-9 = ""
10053030-10 = ""
10053030-11 = "真的是這條路嗎？"
10053030-12 = "至少從地圖上來看是正確的。"
10053030-13 = "該不會是被騙了吧？"
10053030-14 = "不，我是通過可信的網站預約，也確認過今年的評價了……應該不會有錯。"
10053030-15 = "通往山莊的路就只有這條而已。"
10053030-16 = "過去的時候不會斷掉吧……"
10053030-17 = ""
10053030-19 = ""
10053030-20 = "反正就算斷掉也只是掉進下面的河裡，只要游過去就行吧？"
10053030-21 = "最好是啦……"
10053030-22 = ""
10053030-23 = "那邊的姑娘們。"
10053030-24 = ""
10053030-26 = ""
10053030-27 = ""
10053030-28 = "你們是要去對面的山莊嗎？"
10053030-30 = "啊，真的有這種情節呢。"
10053030-32 = "如果你們找的是「那間山莊」的話……"
10053030-33 = "勸你們還是放棄吧。"
10053030-35 = "咦！？果然是詐騙嗎！？#n我們真的被騙了！？"
10053030-37 = "不，山莊確實存在。#n但是……最好還是別住在那裡比較好……"
10053030-38 = "至於原因……你們去了就會知道了。"
10053030-40 = "……！"
10053030-42 = "我已經警告過了。現在去找其他地方也不算太遲。"
10053030-43 = ""
10053030-45 = ""
10053030-46 = ""
10053030-47 = ""
10053030-48 = "嗯……？#n真是個奇怪的老爺爺呢。"
10053030-49 = "好，趁天還沒黑趕快走吧。#n鄉下的太陽可是很早就會下山的哦。"
10053030-50 = "先，先等一下！你打算就這樣過去嗎！？"
10053030-51 = "嗯？我有漏掉什麼嗎？"
10053030-52 = "不是！那個人都說是「警告」了耶！#n怎麼看都是在等著我們吧！？"
10053030-53 = "木乃香君……我認為將自己擺在第一位的心態值得讚許。"
10053030-54 = "然而認定一切都以自己為中心轉動，可是會成為誇大妄想的開端哦。"
10053030-55 = "相信你可以克服的。"
10053030-56 = ""
10053030-58 = ""
10053030-59 = ""
10053030-60 = "這麼說來，木乃香其實挺膽小的呢……"
10053030-61 = "比如會對網路上看見的怪談信以為真，結果嚇得睡不著整晚纏著我之類的……"
10053030-62 = "你，你說誰膽小啊！絕對沒有好不好！"
10053030-63 = "只是人家都特地待在那邊警告我們了，不就代表真的很危險嗎？#n你們也知道，現代人大多都有點缺乏安全意識……"
10053030-64 = "對了，老師！！老師不覺得很可疑嗎！？"
10053030-65 = "[s1] 「要說是巧合確實有點太巧了……」\n[s2] 「的確讓人有點在意。」"
10053030-68 = "果然老師也這麼想吧！？"
10053030-70 = "……我先把話說清楚，這附近沒有其他可以住宿的地點。"
10053030-71 = "要到最近的村子也得走上1個小時。"
10053030-72 = "嘔，我才不要。"
10053030-73 = "就這樣進去吧。#n而且錢都已經付了，當天取消也不能退款。"
10053030-75 = "老師！？"
10053030-76 = "[ns3] 「走路要1個小時啊……」\n[ns4] 「應該叫不到計程車吧……」"
10053030-79 = ""
10053030-80 = "[ns] 「木乃香。」"
10053030-81 = ""
10053030-82 = "[ns] 「人有時候必須鼓起勇氣才行。」"
10053030-83 = "老師！？！？"
10053030-84 = ""
10053030-86 = ""
10053030-87 = "好了好了～要是真的有幽靈出現的話，我會負責保護木乃香君的～"
10053030-88 = "不，不要說出那個詞啦！說了就真的會「出來」的耶！"
10053030-89 = "要是有那麼容易「出來」，早就被觀測到了啦。#n來，牽著我的手～"
10053030-90 = "知，知道了啦！不要拉我！我自己走就好！"
10053030-91 = ""
10053030-93 = ""
10053030-94 = ""
10053030-95 = ""
10053030-96 = ""
10053030-99 = "裡面比想像中乾淨呢？"
10053030-101 = ""
10053030-102 = "從外面看的時候還以為會更髒亂一點，這種程度的話其實還挺不錯的。"
10053030-103 = "那個，玲奈……你不覺得這裡有點陰森嗎？"
10053030-104 = "……你還在在意剛才那個老爺爺說的話嗎？"
10053030-105 = "不是，我是真的有那種感覺啦！#n總覺得好像冷冷的……！"
10053030-106 = ""
10053030-107 = "確實[ruby=Cold Spot]，冷點現[/ruby]象是幽靈出沒的代表性現象之一。"
10053030-108 = ""
10053030-111 = ""
10053030-112 = "不過室內並沒有檢測到不自然的局部溫度變化，所以不必擔心。"
10053030-113 = ""
10053030-115 = ""
10053030-116 = ""
10053030-117 = "那是什麼？相機？"
10053030-118 = "嗯！準確來說是配備拍攝功能的熱像儀！#n只要有熱源，即使在沒有光的地方也能進行觀測。"
10053030-119 = "你還真是有備而來呢……"
10053030-120 = "那當然。我們要找的可是從未被人發現過的傳說生物啊。"
10053030-121 = "總之，木乃香君。#n這裡並沒有發生冷點現象，你就放心吧。"
10053030-123 = "哦哦，不愧是所長！真可靠！"
10053030-124 = "呵呵，我可是專業的呢。"
10053030-125 = ""
10053030-127 = ""
10053030-128 = ""
10053030-129 = "……嗯？老師？有什麼問題嗎？"
10053030-130 = "[ns5] 「沒有，因為你說是專業……」\n[ns6] 「所以那是你的社團活動嗎？」"
10053030-133 = "……！"
10053030-134 = "雖，雖然那是個有趣的話題，不過還是下次再聊吧……！"
10053030-135 = "話說我們快點行動吧！#n鄉下的太陽比較早下山，再不出發可就要白白浪費今天一整天了呢！"
10053030-136 = ""
10053030-138 = ""
10053030-139 = ""
10053030-140 = "……他怎麼突然這樣？"
10053030-141 = "那種不想聊到社團活動的心情……莫名很能感同身受呢……"
10053030-142 = "[s7] 「你們兩個也不知道嗎？」\n[s8] 「關於他社團活動的事。」"
10053030-145 = "唔嗯～這個嘛……"
10053030-146 = ""
10053030-148 = ""
10053030-149 = "咦？現在想想還真奇怪。#n我怎麼會什麼都不知道呢？"
10053030-150 = "這不是很正常嗎？#n就算已經認識很久，也終究只是網友而已。"
10053030-151 = "衣斐玲奈──狂獵藝術學院1年級，主修是時裝設計。"
10053030-152 = "咦，咦咦？為什麼突然說這些？"
10053030-153 = ""
10053030-155 = ""
10053030-156 = "住在學院宿舍的第4棟。房號大概是……"
10053030-157 = "哎唷，這個數字實在不太想說出口……房號是404號對吧？#n然後跟你同房的是三位前輩。"
10053030-158 = "那個房號加上居住人數……哇，我都起雞皮疙瘩了耶。"
10053030-159 = "要起雞皮疙瘩的是我好嗎！？你是怎麼知道的啊！？#n難道是跟蹤狂……！？"
10053030-160 = "嘖嘖嘖，孩子你還太天真了呢。#n很多事情都是有訣竅的。"
10053030-161 = "人在網路上發文的時候，往往會不經意地洩露個人資訊哦。"
10053030-162 = "像是走到超商的時間、上課的路線、坡道的有無等等……#n只要將平時的發言統整起來，就能推測出你住在哪一棟了。"
10053030-163 = "可是，我從來沒說過自己住在幾號房之類的事啊？"
10053030-164 = "你之前不是抱怨過「房號害你諸事不順」嗎？#n不吉利的號碼是4或6……既然已經確定你住在4棟，基本上就是404號室了吧。#n一般來說，應該不會有人覺得406號也不吉利才對。"
10053030-165 = "……木乃香該不會是偵探之類的吧？"
10053030-166 = "哎～偵探什麼的也太遜了吧。"
10053030-167 = "姐姐我啊，可是能讓哭泣的太妹乖乖閉嘴的公安局成員呢。"
10053030-168 = "啊，原來木乃香真的是女武神的學生啊……我還以為那只是你的穿搭呢。"
10053030-169 = "咦～剛才是說我看起來像混混，所以和女武神完全不搭嗎？"
10053030-170 = "我才沒有說到那種程度！"
10053030-171 = "不過或多或少有產生過那種想法吧？"
10053030-172 = "我，我哪有！"
10053030-173 = "少來～你總不可能完全沒那麼想過吧？#n至少有一點點那種感覺？對吧對吧？"
10053030-174 = "唔嗯……硬要說的話是有一點點啦……"
10053030-175 = "老師！！玲奈說我是混混！！"
10053030-176 = "咦！？什，什麼啦！？#n明明是你故意引導我說出來的！"
10053030-177 = "[s9] 「不要太捉弄玲奈了……」\n[s10] 「玲奈，對方畢竟是你的前輩……」"
10053030-178 = "是～"
10053030-179 = ""
10053030-181 = ""
10053030-183 = "老，老師！？"
10053030-186 = "啊啊！！真是的！！不要再捉弄我了！！"
10053030-189 = "……報告指出，槌之子的目擊情報大多分布在白川山的河邊。"
10053030-191 = ""
10053030-192 = "如果槌之子是生物的話，沿著水源棲息也很正常。#n牠們很可能出沒於人跡罕至的山腰或山谷深處。"
10053030-193 = ""
10053030-195 = ""
10053030-196 = ""
10053030-197 = "OK，收到～"
10053030-198 = "白川山～去白川山的巴士～"
10053030-199 = ""
10053030-201 = ""
10053030-202 = "……哇，你們看。"
10053030-203 = "路線只有一條，而且一天還只有兩班耶？"
10053030-204 = "畢竟這裡是個沒什麼觀光景點、貨真價實的鄉下嘛……"
10053030-205 = "唉～我真命苦啊～"
10053030-206 = "算了，反正車子30分鐘之後就會來，隨便打發一下時間就行了吧。"
10053030-210 = ""
10053030-211 = "嗯？好像有巴士來了？"
10053030-212 = "咦？真奇怪，比時刻表上的時間早太多了吧。"
10053030-213 = ""
10053030-215 = ""
10053030-216 = ""
10053030-217 = "……"
10053030-218 = ""
10053030-220 = "…………"
10053030-221 = "……啊！"
10053030-222 = "這難道是……！"
10053030-223 = ""
10053030-225 = "隨著跟槌之子的距離越來越近，我失去的運氣也開始回來了嗎！"
10053030-226 = "親近蛇類果然是正確的選擇！完全應驗了呢！"
10053030-227 = ""
10053030-229 = ""
10053030-230 = ""
10053030-231 = "真的是因為運氣嗎……？#n不，應該只是巧合吧。"
10053030-232 = "先等一下，玲奈君、老師。"
10053030-233 = "那輛巴士的車號……應該不是只有我一個人覺得奇怪吧？"
10053030-234 = "[s11] 「嗯？『S44-66號』……？」\n[s12] 「這也太不吉利了吧……」"
10053030-237 = "大家應該都知道，車號一般是不會用「4」這個數字的。#n因為那會讓人聯想到死亡，實在有點不太吉利。"
10053030-238 = "更別說是「44-66號」了……"
10053030-239 = "「S44-66號」巴士……？"
10053030-240 = "嗯？難道你知道些什麼嗎？"
10053030-241 = "唔嗯……倒也稱不上知道，不過前陣子在SNS上有流行過類似的文章。"
10053030-242 = "好像說是幽靈乘坐的巴士之類的……"
10053030-243 = "幽靈……？"
10053030-244 = "嗯，其實就是那種很老套的故事啦。#n像是上車之後發現整輛車都是幽靈，被嚇得落荒而逃……"
10053030-245 = "或者上車之後睡了一覺，結果卻在和奇普托斯類似卻完全不同的異世界下了車……#n總之就是這類常見的異世界怪談。"
10053030-246 = "那時候正好流行它的巴士版本。"
10053030-247 = "然後那些怪談裡出現的巴士，車號都是「S44-66號」嗎……？"
10053030-248 = ""
10053030-250 = ""
10053030-251 = "只，只是碰巧一樣而已吧！#n順帶一提，我完全不相信哦！"
10053030-252 = "大白天的就在第一次來的鄉下，偶然碰上怪談裡的巴士……？#n再怎麼說也太牽強了吧！"
10053030-253 = "可是，萬一眼前的是「真的」呢……？"
10053030-254 = "……"
10053030-255 = ""
10053030-257 = ""
10053030-258 = ""
10053030-259 = "老師～大家～怎麼不上車呢？#n我們不是在等巴士嗎？"
10053030-260 = "[ns13] 「好像不是那輛巴士。」\n[ns14] 「我們等下一班吧。」"
10053030-263 = ""
10053030-264 = "咦？經過這站的巴士應該只有這一輛才對啊……？"
10053030-265 = "……嗯？"
10053030-266 = "話說這輛巴士是怎麼回事，為什麼會連號碼和路線都沒寫……？"
10053030-267 = "不好意思，請問是去白川山的巴士嗎？"
10053030-268 = "…………"
10053030-269 = "那個……有聽見我說話嗎？"
10053030-270 = "…………"
10053030-271 = ""
10053030-273 = ""
10053030-274 = "好可疑……"
10053030-275 = "……既然如此，只能把那個東西拿出來了嗎？"
10053030-277 = "拿出來……是要拿什麼？難道是槍嗎？"
10053030-278 = "跟幽靈打架好像不是什麼好主意……"
10053030-280 = ""
10053030-281 = "老師，請您好好看著木乃香。"
10053030-282 = "只要和「迷信」扯上關係，木乃香一定會惹出「事故」的。"
10053030-284 = "[ns15] （難道環奈擔心的就是這個……？）\n[ns16] 「木乃香，就先讓巴士離開吧……」"
10053030-288 = ""
10053030-289 = "不，老師。這是對付那種傢伙最有效的辦法。"
10053030-290 = "這種時候就得拿出來才行。"
10053030-291 = ""
10053030-293 = ""
10053030-295 = "[ns17] 「那是什麼……？」\n[ns18] 「學生手冊？」"
10053030-298 = "哎呀～還是一臉不明白的表情呢。"
10053030-299 = "總之老師就在旁邊看著吧。#n對在奇普托斯開車的人來說，這東西可是比槍還可怕呢。"
10053030-300 = "那邊的大叔，這裡是女武神。#n麻煩你配合出示駕照。"
10053030-301 = ""
10053030-302 = "…………"
10053030-303 = "沒聽到嗎？我說請你出示駕照。#n你知道要是拒絕會違反道路交通法還是什麼法吧？想被開罰單嗎？"
10053030-304 = ""
10053030-305 = "…………"
10053030-306 = ""
10053030-308 = ""
10053030-309 = "喂！大叔！站住！給我停下來……！"
10053030-311 = ""
10053030-313 = ""
10053030-314 = "……居然真的開走了。"
10053030-315 = "幽靈也怕被開罰單嗎……？"
10053030-317 = "真是的……下次就不要被我抓到……"
10053030-318 = "不過老師，你是怎麼知道那輛巴士有點奇怪的？#n外表看起來還挺普通的說。"
10053030-319 = "[s19] 「那個……是玲奈告訴我的。」\n[s20] 「這都是託翼的福……」"
10053030-321 = "咦！？對，對啊！#n就是感覺好像可疑可疑的……！"
10053030-322 = "（要借用我的名義先說一聲啊！嚇死我了！）"
10053030-323 = ""
10053030-325 = ""
10053030-326 = ""
10053030-327 = "哼嗯～？"
10053030-329 = "咦？唔嗯……畢竟我是專家嘛！#n自然有辦法知道……"
10053030-330 = "嘿～？像是什麼方法呢，所長？"
10053030-331 = "那，那對木乃香君來說還太早了……"
10053030-332 = ""
10053030-334 = ""
10053030-335 = "哼嗯～？"
10053030-336 = ""
10053030-341 = ""
10053030-342 = "啊，這次是真正的巴士吧？"
10053030-343 = ""
10053030-345 = ""
10053030-346 = ""
10053030-347 = "這次總該是真的了……啊，我也不是說剛才那輛就是幽靈巴士哦！？"
10053030-348 = ""
10053030-350 = ""
10053030-351 = ""
10053030-352 = ""
10053030-353 = ""
10053030-354 = "歡迎搭乘～上車時請小心～"
10053030-355 = "啊，你好。"
10053030-356 = "那個，雖然這個問題可能有點奇怪……#n請問剛才走掉的那班巴士……"
10053030-358 = "……嗯？前面有巴士？#n那還真奇怪呢。"
10053030-359 = "這個站牌應該只有我這輛巴士會停靠才對。"
10053030-360 = "……！？\n\n"
10053030-363 = "（結果那輛可疑的巴士究竟從何而來，又開向了哪裡……依然不得而知）"
