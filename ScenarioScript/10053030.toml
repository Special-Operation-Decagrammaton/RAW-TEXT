[translation]
10053030-1 = "ตอนที่ 3;รถบัสวิญญาณ"
10053030-5 = "อ่า..."
10053030-6 = "จะไหวเหรอแบบนี้?"
10053030-11 = "เรามาถูกทางจริงๆ เหรอ?"
10053030-12 = "แต่ถ้าดูจากแผนที่ก็ถูกต้องอยู่นะ"
10053030-13 = "เราคงไม่ได้โดนหลอกหรอกเนอะ?"
10053030-14 = "ไม่หรอก ฉันจองผ่านเว็บไซต์ที่น่าเชื่อถือและดูรีวิวที่เขียนไว้ในปีนี้แล้ว ไม่มีทางผิดพลาดหรอก"
10053030-15 = "นี่เป็นเส้นทางเดียวที่จะไปบ้านพักที่เราจองไว้"
10053030-16 = "ระหว่างเดินข้ามไป สะพานคงไม่ขาดหรือมีเรื่องอะไรเกิดขึ้นหรอกเนอะ..."
10053030-20 = "แต่ถึงจะตกลงไป ข้างล่างก็เป็นแม่น้ำ งั้นเราก็แค่ว่ายน้ำขึ้นมาก็จบ"
10053030-21 = "จบชีวิตน่ะสิ..."
10053030-23 = "นี่ พวกหนู"
10053030-28 = "มีธุระอะไรที่บ้านพักที่อยู่ฝั่งตรงข้ามนั่นเหรอ?"
10053030-30 = "อ่า จะเป็นมิตรหรือมิจล่ะเนี่ย?"
10053030-32 = "ถ้าจะไป <บ้านพักหลังนั้น> จริงๆ ละก็..."
10053030-33 = "ล้มเลิกแผนการไปจะดีกว่านะ"
10053030-35 = "คะ?! ตกลงโดนหลอกเหรอ?! นี่พวกฉันโดนหลอกให้จองบ้านพักทิพย์เหรอคะ?!"
10053030-37 = "เปล่าหรอก บ้านพักหลังนั้นน่ะมีอยู่จริง แต่ว่า... อย่าไปค้างแรมที่นั่นจะดีกว่า"
10053030-38 = "เหตุผลก็คือ... ถ้าไปก็จะรู้เองละ"
10053030-40 = "...!"
10053030-42 = "เอาเป็นว่าฉันมาเตือนแล้วนะ ลองหาที่พักใหม่ตอนนี้ก็ยังไม่สายหรอก"
10053030-48 = "ตาแก่คนนั้นแปลกจริงๆ เลยนะ"
10053030-49 = "เอาเถอะ เรารีบไปก่อนจะตกเย็นดีกว่า เห็นว่าในชนบทพระอาทิตย์ตกเร็วนะ"
10053030-50 = "ดะ... เดี๋ยวก่อน! แต่ยังไงก็จะเข้าไปเหรอ?!"
10053030-51 = "หืม? ฉันพลาดอะไรไปหรือเปล่า ทำไมจะไปไม่ได้ล่ะ?"
10053030-52 = "ก็ตาแก่คนเมื่อกี้บอกว่า <เตือนแล้วนะ> ไม่ใช่เหรอ! เขาตั้งใจมาดักรอเพื่อเตือนเราเลยนะ?!"
10053030-53 = "โคโนกะ... การมองว่าตัวเองสำคัญที่สุดในโลก มันก็เป็นเรื่องที่สมควรอยู่หรอก"
10053030-54 = "แต่การเชื่อว่าทุกอย่างหมุนรอบตัวเราน่ะ คือจุดเริ่มต้นของการเพ้อฝันเกินจริงนะ"
10053030-55 = "ไม่เป็นไรหรอก พวกเราผ่านมันไปได้อยู่แล้ว"
10053030-60 = "จะว่าไป โคโนกะก็เป็นคนค่อนข้างขี้กลัวเลยเนอะ..."
10053030-61 = "ไปเชื่อเรื่องแปลกๆ ที่เจอในอินเทอร์เน็ต แล้วก็มานั่งกลัวแล้วบอกให้คนอื่นอดนอนอยู่เป็นเพื่อน..."
10053030-62 = "อะไรกัน ใครบอกว่ากลัวกันล่ะ! ฉันไม่ได้กลัวสักหน่อย!"
10053030-63 = "ก็แค่คิดว่าถ้าเขามารอเราแล้วเตือนซะขนาดนั้น มันก็คงเป็นเรื่องอันตรายเลยไม่ใช่หรือไง? แบบนี้ละถึงมีคำพูดว่าคนสมัยใหม่ไม่ค่อยสนใจเรื่องความปลอดภัยกัน..."
10053030-64 = "จริงสิ คุณครู!! คุณครูไม่คิดว่ามันแปลกๆ เหรอคะ?!"
10053030-65 = "[s1] \"มันก็ดูเป็นเรื่องน่าพิศวงอยู่หรอกนะ...\"\n[s2] \"ครูก็ตะขิดตะขวงใจเหมือนกันนะ...\""
10053030-68 = "ว่าแล้วเชียว คุณครูก็คิดแบบนี้เหมือนกันใช่มั้ยคะ?!"
10053030-70 = "ฉันขอบอกไว้ก่อนแล้วกัน แถวนี้ไม่มีที่พักอื่นหรอก..."
10053030-71 = "ถ้าจะไปหมู่บ้านที่อยู่ใกล้ที่สุด ก็น่าจะต้องเดินประมาณชั่วโมงหนึ่งเลย"
10053030-72 = "หา? ไม่เอาด้วยหรอก"
10053030-73 = "ไปหลังที่จองไว้นั่นละ ฉันจ่ายเงินไปแล้ว และถ้าจะยกเลิกในวันเข้าพักก็ไม่ได้เงินคืนด้วย"
10053030-75 = "คุณครู?!"
10053030-76 = "[ns3] \"ต้องเดินเป็นชั่วโมงเลยเหรอ...\"\n[ns4] \"แถวนี้ก็คงไม่มีแท็กซี่ด้วยเนอะ...\""
10053030-80 = "[ns] \"โคโนกะ\""
10053030-82 = "[ns] \"คนเราต้องมีช่วงเวลาที่ต้องแสดงความกล้าออกมานะ\""
10053030-83 = "คุณครู?!?!"
10053030-87 = "เอาเถอะ~ ถ้ามีวิญญาณโผล่ออกมา ฉันจะปกป้องโคโนกะให้เอง~"
10053030-88 = "ยะ... อย่าพูดให้เป็นลางแบบนั้นสิ! ได้ยินว่าถ้าพูดแบบนั้น มันจะ <โผล่มา> จริงๆ นะ!"
10053030-89 = "ถ้ามัน <โผล่มา> ง่ายๆ แบบนั้น ก็คงมีคนสังเกตเห็นไปแล้วสิ เอาละ ฉันจะจับมือไว้เอง~"
10053030-90 = "ขะ... เข้าใจแล้วน่า อย่าดึงกันสิ! ฉันเดินเองได้น่า!"
10053030-99 = "ข้างในสะอาดสะอ้านกว่าที่คิดไว้อีกนะ?"
10053030-102 = "ดูจากภายนอกแล้ว ฉันคิดว่ามันจะรกกว่านี้ซะอีก ถ้าเรียบร้อยแบบนี้ก็คงพักแรมได้ ไม่มีปัญหาอะไรนะ"
10053030-103 = "เอ่อ เรนะ ที่นี่มันน่าขนลุกแปลกๆ นะว่ามั้ย?"
10053030-104 = "ยังกังวลกับคำพูดของตาแก่คนนั้นอยู่อีกเหรอ...?"
10053030-105 = "แต่ฉันไม่ได้คิดไปเองนะ! ฉันรู้สึกถึงบางอย่างได้จริงๆ! ไม่รู้สึกหนาวเย็นกันบ้างเหรอ...!"
10053030-107 = "ปรากฏการณ์โคลด์สปอตเป็นหนึ่งในสัญญาณยอดฮิตที่บอกว่ามีวิญญาณโผล่มาเลยละ"
10053030-112 = "แต่ก็ไม่พบการเปลี่ยนแปลงอุณหภูมิแบบลดฮวบในห้องนี้หรอก เพราะงั้นก็สบายใจได้"
10053030-117 = "นั่นมันอะไรน่ะ? กล้องเหรอ?"
10053030-118 = "อื้อ! ถ้าจะบอกให้ชัดเจนก็คือ มันเป็นกล้องถ่ายภาพความร้อนน่ะ! ถ้ามีแหล่งความร้อน ต่อให้อยู่ในที่ที่ไม่มีแสงก็ใช้การได้"
10053030-119 = "ไม่ได้มาเล่นๆ สินะเนี่ย..."
10053030-120 = "ก็แน่น่ะสิ เรามาตามหาสัตว์ในตำนานที่ยังไม่มีใครเคยค้นพบมาก่อนเชียวนะ"
10053030-121 = "เอาเถอะ โคโนกะ ในเมื่อตรวจสอบแล้วว่าที่นี่ไม่มีปรากฏการณ์โคลด์สปอต งั้นก็หายห่วงได้แล้ว"
10053030-123 = "โอ้ นี่ละหัวหน้า! แบบนี้ค่อยใจชื้นหน่อย!"
10053030-124 = "ฮุฮุ ฉันเป็นผู้เชี่ยวชาญด้านนี้อยู่แล้ว"
10053030-129 = "หืม...? คุณครู? มีอะไรอยากถามงั้นเหรอ?"
10053030-130 = "[ns5] \"ที่บอกว่าเป็นผู้เชี่ยวชาญ แล้วชมรมที่สังกัดคือ...\"\n[ns6] \"ศึกษาเรื่องนี้เป็นกิจกรรมของชมรมเหรอ?\""
10053030-133 = "...!"
10053030-134 = "ปะ... เป็นคำถามที่น่าสนใจเลยนะ แต่เรื่องนี้เอาไว้คุยทีหลังดีกว่า...!"
10053030-135 = "เรารีบไปกันเถอะ! ในชนบทมืดเร็วนะ วันนี้ฉันจะใช้เวลาให้คุ้มค่าที่สุดเลย!"
10053030-140 = "จู่ๆ ทำไมถึงเป็นแบบนั้นล่ะ?"
10053030-141 = "ความรู้สึกที่ไม่อยากพูดถึงกิจกรรมของชมรม... ฉันเข้าใจความรู้สึกนั้นเอามากๆ เลยละ..."
10053030-142 = "[s7] \"ทั้งสองคนก็ไม่รู้เหรอ?\"\n[s8] \"ไม่รู้ชมรมของเพื่อนเหรอ?\""
10053030-145 = "อ่า~ เรื่องนั้นน่ะ~"
10053030-149 = "นั่นสินะ? แปลกจังนะคะ ทำไมฉันไม่รู้เลยสักนิดนะ?"
10053030-150 = "มันก็แน่อยู่แล้วไม่ใช่เหรอ? ถึงจะบอกว่ารู้จักกันมานานแล้ว แต่สุดท้ายก็เป็นคนที่รู้จักในอินเทอร์เน็ตนี่นา"
10053030-151 = "คินุอิ เรนะ ชั้นปีที่ 1 สถาบันศิลปะไวลด์ฮันต์ เอกแฟชั่นดีไซน์"
10053030-152 = "อะ... อะไรน่ะ? ทำไมจู่ๆ ถึง?"
10053030-156 = "พักอยู่ในหอพักของโรงเรียน อาคาร 4 ส่วนเลขห้อง น่าจะ..."
10053030-157 = "ให้ตายสิ ฉันไม่อยากพูดตัวเลขนั้นให้เป็นลางร้ายเลย ห้อง 404 ใช่มั้ยล่ะ? แล้วก็มีรูมเมทเป็นรุ่นพี่อีกสามคน"
10053030-158 = "งั้นทั้งเลขห้อง ทั้งจำนวนคนที่อยู่... โอ้ว ขนลุกเลย"
10053030-159 = "ฉันขนลุกกว่าเธออีกเหอะนะ?! นี่เธอรู้เรื่องของฉันได้ยังไง?! แอบสะกดรอยตามฉันเหรอ?!"
10053030-160 = "โธ่เอ๊ย เด็กน้อย ของแบบนี้มันมีวิธีสืบอยู่แล้ว"
10053030-161 = "ผู้คนมักจะเปิดเผยข้อมูลส่วนตัวทีละนิดๆ เวลาโพสต์อะไรลงอินเทอร์เน็ตอยู่แล้ว"
10053030-162 = "ถ้าเอาข้อมูลที่โพสต์มาประกอบกัน ไม่ว่าจะเป็นเวลาที่ใช้เดินไปร้านสะดวกซื้อ เส้นทางที่ใช้ตอนไปเรียน หรือแถวนั้นมีเนินเขาหรือเปล่า ก็คาดเดาได้แล้วละว่าคนนั้นอาศัยอยู่ย่านไหน"
10053030-163 = "แต่ฉันไม่ได้ลงรายละเอียดขนาดนั้นนะ แล้วก็ไม่เคยบอกเลขห้องด้วย"
10053030-164 = "แต่เคยบอกว่าทุกอย่างไม่เป็นไปอย่างที่หวังเพราะเลขห้องไม่ใช่เหรอ? เลขที่ไม่เป็นมงคล ก็คือเลข 4 หรือไม่ก็ 6 ในเมื่อเห็นได้ชัดว่าอยู่อาคาร 4 ถ้างั้นก็ต้องเป็นห้อง 404 นั่นละ ก็ปกติแล้วคงไม่ค่อยมีใคร#nคิดว่าห้อง 406 จะเป็นลางร้ายหรอก"
10053030-165 = "โคโนกะ... นี่เธอเป็นนักสืบเอกชนหรือเปล่า?"
10053030-166 = "นักสืบเอกชนอ่อนด๋อยน่ะเหรอ"
10053030-167 = "ขอบอกไว้เลยนะ พี่สาวคนนี้น่ะเป็นถึงคนของกรมความมั่นคงสาธารณะที่แยงกี้คนไหนร้องไห้อยู่#nเห็นเป็นต้องหยุดร้องเลย"
10053030-168 = "อ๊ะ โคโนกะเป็นวัลคิรี่ตัวจริงสินะ คิดว่าแค่แต่งตัวเป็นแฟชั่นซะอีก"
10053030-169 = "อะไรกัน~ จะบอกว่าฉันดูเหมือนเด็กเสเพลที่ไม่เหมาะกับวัลคิรี่สักนิดงั้นเหรอ?"
10053030-170 = "ฉันไม่ได้พูดถึงขนาดนั้นสักหน่อย!"
10053030-171 = "แต่ก็คิดแบบนั้นอยู่บ้างใช่มั้ยล่ะ?"
10053030-172 = "ก็บอกว่าไม่ใช่ไง!"
10053030-173 = "แต่ลึกๆ แล้วก็ต้องมีแวบเข้ามาในหัวบ้างละ แอบคิดแบบนั้นใช่มั้ยล่ะ? ใช่มั้ย? หืม?"
10053030-174 = "ก็นะ... พอพูดออกมามันก็ชวนให้คิดบ้าง..."
10053030-175 = "ครู!! เรนะว่าฉันว่าเป็นเด็กเสเพลค่ะ!!"
10053030-176 = "หืม?! อะ... อะไรกัน?! ก็พูดชวนให้คิดเองไม่ใช่เหรอ!"
10053030-177 = "[s9] \"อย่าไปแกล้งเรนะเลยน่า...\"\n[s10] \"เรนะ... ยังไงโคโนกะก็เป็นรุ่นพี่นะ\""
10053030-178 = "ใช่ค่า~!"
10053030-183 = "คะ... คุณครู?!"
10053030-186 = "ฮึ่ม!! จริงๆ เลย!! หยุดแกล้งกันได้แล้ว!!"
10053030-189 = "ตามรายงานบอกว่า... มีการพบเห็นสึจิโนโกะอยู่ตามริมแม่น้ำในภูเขาชิราคาวะ"
10053030-192 = "ถ้าสึจิโนโกะเป็นสัตว์ละก็ ก็เป็นธรรมดาที่มันจะอาศัยอยู่ตามแหล่งน้ำ และก็มีโอกาสสูงที่จะพบมันได้#nตามเชิงเขาหรือลึกเข้าไปในหุบเขาที่ไม่ค่อยมีคนเข้าไปเท่าไร"
10053030-197 = "โอเค เก็บข้อมูลแล้ว~"
10053030-198 = "ภูเขาชิราคาวะ~ รถบัสที่จะไปภูเขาชิราคาวะ~"
10053030-202 = "ว้าว คุณครู... ดูนี่สิคะ"
10053030-203 = "มีแค่เส้นทางเดียวแท้ๆ แต่วันหนึ่งรถวิ่งแค่สองรอบเองค่ะ"
10053030-204 = "ก็ที่นี่เป็นชนบทที่ไม่มีสถานที่ท่องเที่ยวหรืออะไรเลยนี่นา..."
10053030-205 = "เฮ้อ~ คราวเคราะห์ของฉันจริงๆ~"
10053030-206 = "แต่รถก็จะมาในอีกสามสิบนาทีแล้ว งั้นก็นั่งคุยสัพเพเหระรอกันไปก็น่าจะได้นะคะ"
10053030-211 = "หืม? เหมือนรถจะมาแล้วนะ?"
10053030-212 = "เอ๋? แปลกจัง มาถึงเร็วกว่าเวลาที่บอกไว้ในป้ายอีก"
10053030-217 = "..."
10053030-220 = "......"
10053030-221 = "อ๊ะ...!"
10053030-222 = "ต้องใช่แน่ๆ...!"
10053030-225 = "พออยู่ใกล้สึจิโนโกะมากขึ้น โชคดีที่หายไปของฉันก็เริ่มกลับมาแล้วค่ะ!"
10053030-226 = "จงอยู่ใกล้งูเข้าไว้! ว่าแล้วเชียว! ตรงเผงเลย!"
10053030-231 = "เป็นโชคดีจริงๆ เหรอ...? นี่มันเรื่องบังเอิญมากกว่าน่า"
10053030-232 = "เดี๋ยวก่อนนะ เรนะ คุณครู"
10053030-233 = "มีแต่ฉันหรือเปล่าที่คิดว่าป้ายทะเบียนรถบัสนั่นมันแปลกๆ น่ะ?"
10053030-234 = "[s11] \"หืม? ทะเบียน <วญ 44-66>...?\"\n[s12] \"ตัวอักษรในทะเบียนดูเป็นลางร้ายจริงๆ ด้วยนะ...\""
10053030-237 = "ใช้ตัวอักษร วญ ในทะเบียนรถเหรอเนี่ย เห็นแล้วคิดถึงคำว่า 'วิญญาณ' ขึ้นมาเลยนะ"
10053030-238 = "แถมเลขยังเป็นเลข '44-66' อีก..."
10053030-239 = "รถทะเบียน <วญ 44-66> งั้นเหรอ...?\""
10053030-240 = "หืม? รู้อะไรมางั้นเหรอ?"
10053030-241 = "อื้อ... คงบอกว่ารู้ได้ไม่เต็มปากหรอก ก็แค่เคยเห็นโพสต์ทำนองนี้ที่เป็นกระแสในโซเชียลอยู่พักหนึ่งน่ะ"
10053030-242 = "เห็นว่าเป็นรถบัสที่มีวิญญาณโดยสาร..."
10053030-243 = "วิญญาณ...?"
10053030-244 = "มันก็พล็อตหลอกเด็กทั่วไปน่า บางคนบอกว่าขึ้นรถไปโดยไม่รู้ตัว แต่ทั้งคันมีแต่วิญญาณ ก็เลยวิ่งหนีลงมาแบบไม่คิดชีวิต..."
10053030-245 = "หรือบางคนบอกว่านั่งรถแล้วเผลอหลับ แล้วกลายเป็นว่าได้ลงป้ายที่อยู่อีกโลกหนึ่งที่แตกต่างจาก#nคิโวทอสลิบลับ... เรื่องลึกลับแนวหลงไปผจญภัยต่างมิติน่ะ มีเกลื่อนไปหมดไม่ใช่เหรอ?"
10053030-246 = "ก็แค่มีช่วงหนึ่งที่นิยมใช้ฉากบนรถบัสกันน่ะ"
10053030-247 = "งั้นจะบอกว่ารถบัสที่อยู่ในเรื่องลึกลับพวกนั้นใช้ทะเบียน <วญ 44-66> เหมือนกันหมดเลยเหรอ...?"
10053030-251 = "คะ... คงเป็นเรื่องบังเอิญละน่า! ขอบอกไว้เลยนะว่าฉันไม่เชื่อเรื่องนั้นสักนิด!"
10053030-252 = "บังเอิญเจอรถบัสในเรื่องเล่าลึกลับในชนบทที่เพิ่งเคยมาในตอนกลางวันแสกๆ เนี่ยนะ มันฟังขึ้นเหรอ? พล็อตอย่างกับละครเลย!"
10053030-253 = "แต่ถ้าเกิดว่า... สิ่งที่อยู่ตรงหน้าเป็น 'ของจริง' ขึ้นมาล่ะ...? "
10053030-254 = "..."
10053030-259 = "นี่ คุณครู~ ทุกคน~ ไม่ขึ้นรถเหรอคะ? รถจอดรอพวกเราอยู่นะคะ?"
10053030-260 = "[ns13] \"รถของเราไม่น่าจะใช่คันนี้นะ\"\n[ns14] \"รอคันต่อไปดีกว่า\""
10053030-264 = "คะ? แต่รถที่ผ่านป้ายนี้มีแค่คันเดียวนะ...?"
10053030-265 = "หืม...?"
10053030-266 = "อะไรกัน รถคันนี้ไม่มีเบอร์รถ แล้วก็ไม่บอกเส้นทางเดินรถด้วย"
10053030-267 = "ขอโทษนะคะ ผ่านภูเขาชิราคาวะมั้ยคะ?"
10053030-268 = "..."
10053030-269 = "คุณคนขับคะ...? ได้ยินมั้ยคะ?"
10053030-270 = "..."
10053030-274 = "ดูไม่ชอบมาพากลแล้วสิ..."
10053030-275 = "สงสัยต้องเอาออกมาสินะ...?"
10053030-277 = "จะเอาอะไรออกมาน่ะ? ปืนเหรอ?"
10053030-278 = "การหาเรื่องต่อสู้กับวิญญาณดูจะไม่ใช่ความคิดที่ดีเท่าไรนะ..."
10053030-281 = "คุณครูคะ ฉันฝากดูแลโคโนกะด้วยนะคะ"
10053030-282 = "ถ้าโคโนกะจะทำอะไรเกี่ยวกับ <ความเชื่อเรื่องโชคลาง> ละก็ ต้องเกิด <ปัญหา> ตามมาแน่นอนค่ะ"
10053030-284 = "[ns15] (หรือว่านี่คือสิ่งที่คันนะกังวล...?)\n[ns16] \"เอ่อ โคโนกะ ครูว่าปล่อยรถคันนี้ไปก่อน...\""
10053030-289 = "ไม่ได้ค่ะ คุณครู นี่คือวิธีรับมือที่เหมาะสมที่สุดกับคนแบบนี้ค่ะ"
10053030-290 = "ฉันไม่มีทางเลือกอื่น นอกจากหยิบสิ่งนี้ออกมาใช้ค่ะ"
10053030-295 = "[ns17] \"นั่นมันอะไรเหรอ...?\"\n[ns18] \"สมุดโน้ตของนักเรียนเหรอ?\""
10053030-298 = "อะไรกัน~ ทำหน้าเหมือนไม่รู้อะไรเลยนะคะ"
10053030-299 = "เอาเถอะ ดูไว้ให้ดีนะคะ พวกที่ขับรถในคิโวทอสน่ะ กลัวของชิ้นนี้มากกว่าปืนผาหน้าไม้อีกค่ะ"
10053030-300 = "นี่ ลุง ฉันมาจากวัลคิรี่ค่ะ เอาใบขับขี่มาดูหน่อยค่ะ"
10053030-302 = "..."
10053030-303 = "ไม่ได้ยินเหรอคะ? ฉันขอตรวจสอบใบขับขี่อยู่นะคะ ถ้าปฏิเสธขึ้นมา รู้ใช่มั้ยคะว่าเป็นการผิดกฎหมาย#nจราจรทางบกน่ะ? เดี๋ยวเจอใบสั่งนะคะ?"
10053030-305 = "..."
10053030-309 = "อ๊ะ! ลุงคนนี้นี่! จะหนีกันเหรอ?! ลงมาจากรถเลยนะ...!"
10053030-314 = "ขับหนีไปจริงด้วย..."
10053030-315 = "วิญญาณก็กลัวใบสั่งจากมนุษย์เหรอเนี่ย...?"
10053030-317 = "ฮึ่ย... อย่าให้ตามตัวได้นะ..."
10053030-318 = "ว่าแต่ คุณครูรู้ได้ยังไงคะว่ารถคันเมื่อกี้เป็นรถแปลกๆ? ดูจากภายนอกก็เหมือนรถบัสธรรมดาๆ คันหนึ่งนี่นา"
10053030-319 = "[s19] \"อ่า คือว่า... เรนะบอกครูมาน่ะ\"\n[s20] \"ต้องให้เครดิตสึบาสะน่ะ...\""
10053030-321 = "หะ... หืม?! นะ... นั่นสินะ! ฉันคิดว่าท่าทีมันดูน่าสงสัยน่ะ...!"
10053030-322 = "(ถ้าจะอ้างชื่อฉัน ก็บอกกันก่อนสิ! แบบนี้ฉันตั้งตัวไม่ทันนะ!)"
10053030-327 = "หืม~?"
10053030-329 = "หืม? อ้อ... ก็ฉันเป็นผู้เชี่ยวชาญนี่นา! ก็ต้องรู้อยู่แล้วละ..."
10053030-330 = "หืม? รู้ได้ยังไงเหรอ หัวหน้า?"
10053030-331 = "คะ... โคโนกะยังไม่พร้อมที่จะเรียนรู้เรื่องแบบนี้หรอก..."
10053030-335 = "หืม~?"
10053030-342 = "อ๊ะ เหมือนว่ารถคันที่เรารอจริงๆ จะมาแล้วนะคะ?"
10053030-347 = "ครั้งนี้เป็นรถบัสของจริง... มะ... ไม่สิ! ฉันไม่ได้จะบอกว่ารถคันเมื่อกี้นี้มันไม่ใช่รถบัสวิญญาณหรืออะไร#nหรอกนะ!"
10053030-354 = "เชิญครับ~ ขึ้นรถอย่างระมัดระวังกันนะครับ~"
10053030-355 = "สะ... สวัสดีค่ะ"
10053030-356 = "เอ่อ นี่อาจเป็นคำถามแปลกๆ ก็ได้ แต่ว่ารถบัสคันก่อนหน้าน่ะค่ะ"
10053030-358 = "หืม...? มีรถบัสคันอื่นออกไปก่อนหน้างั้นเหรอครับ? แปลกๆ นะครับ"
10053030-359 = "รถบัสที่วิ่งผ่านป้ายนี้มีแค่คันนี้คันเดียวครับ"
10053030-360 = "...?!"
10053030-363 = "(สุดท้ายก็ไม่มีใครรู้ว่ารถบัสปริศนาคันนั้นมาจากไหน และขับหายไปไหนแล้ว...)"
