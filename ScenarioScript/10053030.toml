[translation]
10053030-1 = "제3화;유령 버스"
10053030-5 = "어……."
10053030-6 = "좀 에바 아닌가?"
10053030-11 = "정말로 이 길이야?"
10053030-12 = "일단, 지도상으로는 틀림없어."
10053030-13 = "혹시 사기당한 거는 아니고?"
10053030-14 = "아니, 믿을 수 있는 사이트를 통해서 예약했고, 올해 작성된 리뷰도 확인했으니까 틀림없어."
10053030-15 = "우리가 예약한 산장으로 가는 길은 여기뿐이야."
10053030-16 = "건너는 도중에 끊어지거나 하는 건 아니겠지……."
10053030-20 = "뭐, 떨어져도 아래는 강이니까 헤엄쳐서 나오면 될 듯?"
10053030-21 = "되겠냐고……."
10053030-23 = "거기, 아가씨들."
10053030-28 = "혹시 건너편에 있는 산장에 용무가 있나?"
10053030-30 = "아, 진짜 있구나."
10053030-32 = "그래, 찾는 것이 만약에 <그 산장>이라면……."
10053030-33 = "하지만 관두는 편이 좋아."
10053030-35 = "네?! 역시 사기야?! 사기당한 건가요?!"
10053030-37 = "아니, 산장은 분명 존재한다. 하지만…… 그곳에는 묵지 않는 편이 좋아……."
10053030-38 = "그 이유는…… 말하지 않아도 가보면 알 테지."
10053030-40 = "……!"
10053030-42 = "나는 경고했다네. 지금이라도 다른 곳을 찾아보도록 해."
10053030-48 = "……? 엄청 이상한 할아버지네."
10053030-49 = "자, 더 늦기 전에 들어가자. 시골에서는 해가 일찍 떨어진다고."
10053030-50 = "자, 잠깐만! 이대로 들어간다고?!"
10053030-51 = "응? 내가 뭔가 놓친 점이라도?"
10053030-52 = "아니! 분명히 <경고>라고 말했잖아! 누가 봐도 우릴 기다리고 있는 거였다니까?!"
10053030-53 = "코노카 군……. 자신을 세상에서 가장 중요하게 여기는 마음가짐은 바람직해."
10053030-54 = "하지만, 모든 것이 자신을 중심으로 돌아간다고 믿는 것은, 과대망상의 시작이니까."
10053030-55 = "극복해 나갈 수 있으니까."
10053030-60 = "그러고 보니, 코노카는 겁이 꽤 많았지……."
10053030-61 = "인터넷에서 발견한 이상한 이야기를 믿고, 혼자 겁먹어서 밤에 자지 말라고 붙잡고……."
10053030-62 = "아니, 누가 겁먹었다는 거야! 절대 그런 건 아니지만!"
10053030-63 = "저렇게까지 기다려서 경고할 정도라면 엄청 위험하다는 거 아니야? 그 있잖아, 현대인은 다들 안전불감증이라고……."
10053030-64 = "맞아, 선생님!! 선생님도 수상하다고 생각하지 않슴까?!"
10053030-65 = "[s1] \"확실히 우연치고는 절묘한데…….\"\n[s2] \"신경 쓰이기는 해.\""
10053030-68 = "역시 선생님도 그렇게 생각하시죠?!"
10053030-70 = "……일단, 말해두는데, 주변에 다른 숙소는 없어."
10053030-71 = "가장 가까운 마을에 가려면 걸어서 1시간은 걸릴걸."
10053030-72 = "엑. 싫어."
10053030-73 = "그냥 들어가자. 이미 돈도 냈고, 당일 캔슬이면 환불도 안 해준단 말이야."
10053030-75 = "선생님?!"
10053030-76 = "[ns3] \"걸어서 1시간…….\"\n[ns4] \"택시는, 잡힐 리 없나……."
10053030-80 = "[ns] \"코노카.\""
10053030-82 = "[ns] \"사람은 용기를 내야만 하는 순간이 있어.\""
10053030-83 = "선생님?!?!"
10053030-87 = "자~ 유령이 나타나면 코노카 군은 책임지고 지켜줄 테니까~"
10053030-88 = "그, 그 단어를 말하면 어떻게 해! 말하면 <나온다>고 하잖아!"
10053030-89 = "그렇게 쉽게 <나온다>면 진작에 관측됐겠지. 자, 손잡아 줄 테니까~"
10053030-90 = "아, 알았으니까 당기지 마! 내 페이스대로 걸을 테니까!"
10053030-99 = "안은 생각보다 깨끗한데?"
10053030-102 = "바깥에서 봤을 때는, 좀 더 지저분할 줄 알았는데, 이 정도면 꽤 지낼 만할지도."
10053030-103 = "저기, 레나. 여기 뭔가 으스스하지 않아?"
10053030-104 = "……아직도 아까 그 할아버지 말을 신경 쓰는 거야?"
10053030-105 = "아니, 진짜로! 뭔가 느껴진단 말이야! 왠지 싸늘하다고 할까……!"
10053030-107 = "분명, 콜드 스팟 현상은 유령 출몰의 대표적인 현상 중 하나지."
10053030-112 = "하지만 실내에서 부자연스러운 국지적 온도 변화는 계측되지 않아. 걱정하지 않아도 돼."
10053030-117 = "뭐야, 그거? 카메라?"
10053030-118 = "응! 정확히는 촬영 기능이 있는 열화상 카메라야! 열원만 있다면, 빛이 없는 곳에서도 관측할 수 있지."
10053030-119 = "되게 작정하고 왔네……."
10053030-120 = "당연하잖아. 우리가 찾는 건, 그 누구도 발견하지 못한 전설의 생물이라고."
10053030-121 = "어쨌거나, 코노카 군, 여기에 콜드 스팟 현상은 일어나지 않았으니까 안심해."
10053030-123 = "오오, 역시 소장! 믿음직스럽네!"
10053030-124 = "후후, 이쪽은 프로니까."
10053030-129 = "……응? 선생님? 뭔가 물어보고 싶은 거라도?"
10053030-130 = "[ns5] \"아니, 프로라고 하길래…….\"\n[ns6] \"동아리 활동으로 하고 있는 거야?\""
10053030-133 = "……!"
10053030-134 = "그, 그것은 흥미로운 주제지만, 다음에 이야기하는 게 좋겠네……!"
10053030-135 = "그보다 서두르자! 시골에서 해는 빨리 떨어지니까, 오늘 하루를 날려먹게 될 거야!"
10053030-140 = "……? 갑자기 왜 저런대?"
10053030-141 = "동아리 활동에 대해 말하고 싶지 않은 기분…… 이상할 정도로 엄청 공감이 가는데……."
10053030-142 = "[s7] \"두 사람도 모르는 거야?\"\n[s8] \"동아리라든지?\""
10053030-145 = "어~ 그게~"
10053030-149 = "얼레? 이상하네요. 왜 하나도 모르지?"
10053030-150 = "당연한 거 아니야? 오래 알았다고 해도, 결국 인터넷 지인인걸."
10053030-151 = "키누이 레나. 와일드헌트 예술학원 1학년. 전공은 패션 디자인."
10053030-152 = "어, 어어? 갑자기 뭐야?"
10053030-156 = "거주하는 곳은 학원 내 기숙사. 4동. 호수는 아마도……."
10053030-157 = "에이씨, 이 숫자는 별로 입에 담고 싶지 않은데. 404호지? 동거인은 선배만 세 명이고."
10053030-158 = "그러면 그 방 번호에, 거주인 숫자가…… 어우, 소름 끼쳐."
10053030-159 = "내가 훨씬 소름 끼치거든?! 어떻게 안 거야?! 혹시 스토킹……?!"
10053030-160 = "쯧쯧. 아해야. 다 아는 법이 있단다."
10053030-161 = "원래 사람은 인터넷에 글을 쓸 때 인적 사항을 조금씩 흘리거든."
10053030-162 = "예를 들어, 편의점까지 가는 시간, 수업받으러 가는 경로, 언덕이 있는지 여부 등, 평소의 발언을 종합하면 거주하는 동까지는 유추할 수 있지."
10053030-163 = "하지만, 나는 몇 호에 사는지 같은 거는 말 안 했는데?"
10053030-164 = "전에 방 번호 때문에 되는 일이 없다고 불평했잖아? 불길한 번호라면, 4 또는 6. 하지만 4동에 사는 게 분명하니까, 404겠지. 보통 406호까지 불길하다고 생각하는 사람은 드무니까."
10053030-165 = "……혹시, 코노카는 탐정 같은 거야?"
10053030-166 = "없어 보이게 탐정이 뭐냐, 짜샤."
10053030-167 = "이 누님께서는 우는 스케반도 그치는 대 공안국 소속이시란 말씀."
10053030-168 = "아, 코노카, 진짜 발키리였구나. 그냥 패션인 줄 알았는데."
10053030-169 = "어쭈~ 지금, 내가 날라리처럼 생겨서 발키리랑 하나도 안 어울린다 했겠다?"
10053030-170 = "그렇게까지 말 안 했거든!"
10053030-171 = "그래도 조금은 생각했지?"
10053030-172 = "아, 아니라니까!"
10053030-173 = "아니, 그래도 아예 생각을 안 하지는 않았을 거 아니야. 아주 조금은 했다? 그치? 응?"
10053030-174 = "……뭐, 거기까지, 라고 말한다면……."
10053030-175 = "쌤!! 레나가 저 보고 날라리래요!!"
10053030-176 = "어?! 뭐, 뭐야?! 네가 말하게 유도한 거잖아!"
10053030-177 = "[s9] \"레나를 너무 놀리지 마…….\"\n[s10] \"레나야…… 아무리 그래도 선배인데.\""
10053030-178 = "네엡~"
10053030-183 = "서, 선생님?!"
10053030-186 = "아!! 진짜!! 그만 놀리라고!!"
10053030-189 = "……제보에 따르면, 츠치노코 목격담은 시라카와 산 강변을 따라 분포해 있어."
10053030-192 = "만약 츠치노코가 생물이라면, 수원지를 따라 서식하는 것이 자연스럽고, 사람 발길이 닿지 않는 산 중턱이나 계곡 안쪽일 가능성이 높아."
10053030-197 = "오케이, 접수 완료~"
10053030-198 = "시라카와 산~ 시라카와 산으로 가는 버스가~"
10053030-202 = "……와, 선생님. 여기 좀 보십쇼."
10053030-203 = "노선이 딱 하나인데, 하루 두 번밖에 안 다니는뎁쇼?"
10053030-204 = "그야, 여기는 관광지도 뭣도 없는 진짜 시골이니까……."
10053030-205 = "에휴~ 내 팔자야~"
10053030-206 = "그래도, 뭐, 30분 뒤면 온다니까, 대충 노가리나 까고 있으면 오겠죠."
10053030-211 = "응? 버스가 오는 것 같은데?"
10053030-212 = "얼레? 이상타. 노선표에 적힌 시간보다 너무 빠른데."
10053030-217 = "……."
10053030-220 = "…………."
10053030-221 = "……핫!"
10053030-222 = "이건 설마……!"
10053030-225 = "츠치노코와 가까워지면서, 잃어버린 제 운수가 다시 돌아오기 시작한 검다!"
10053030-226 = "뱀을 가까이하라! 역시나! 딱 들어맞네요!"
10053030-231 = "정말로 운수란 게……? 아니, 우연이겠지."
10053030-232 = "잠깐, 레나 군. 선생님."
10053030-233 = "저 버스 번호판, 혹시 나만 이상하게 보이나?"
10053030-234 = "[s11] \"응? <사 44-66번>……?\"\n[s12] \"엄청 불길한 번호판이네…….\""
10053030-237 = "다들 이미 알고 있겠지만, 일반적으로 자동차 번호판에 '사'는 쓰이지 않아. 사(死)를 연상시켜 불길하기 때문이지."
10053030-238 = "그런데 하물며 '44-66번'이라니……."
10053030-239 = "<사 44-66번> 버스라고……?"
10053030-240 = "응? 혹시 알고 있는 건가?"
10053030-241 = "으응…… 안다고 할 정도는 아니지만, 한동안 SNS에서 비슷한 글이 한참 유행해서."
10053030-242 = "유령들이 타는 버스라고……."
10053030-243 = "유령……?"
10053030-244 = "뭐, 뻔한 얘기야. 모르고 탔더니 유령으로 가득한 버스여서 도망치듯이 내렸다……."
10053030-245 = "타고 잠들었더니, 키보토스와 비슷하지만 전혀 다른 이세계에서 내리게 되었다……. 그런 뻔한 이세계 탐험 괴담 있잖아."
10053030-246 = "그것의 버스 버전이 한동안 유행했을 뿐이야."
10053030-247 = "그리고 그 괴담들에서 나온 버스 번호가 공통적으로 <사 44-66번>이었다는 건가……?"
10053030-251 = "우, 우연이겠지! 참고로 나는 그거 하나도 안 믿으니까!"
10053030-252 = "애초에 이런 대낮에, 처음 와본 시골에서 우연히 괴담 속 버스랑 마주치는 게 말이 돼? 너무 작위적이잖아!"
10053030-253 = "하지만, 만에 하나, 눈앞에 있는 것이 '진짜'라면……?"
10053030-254 = "……."
10053030-259 = "저기, 선생님~ 다들, 안 타심까? 버스 기다리는데요?"
10053030-260 = "[ns13] \"아마 그 버스가 아닌 것 같아.\"\n[ns14] \"다음 버스를 기다리자.\""
10053030-264 = "네? 그치만, 이 역을 지나는 버스는 하나밖에……?"
10053030-265 = "……응?"
10053030-266 = "뭐야, 이 버스. 자세히 보니까 버스 번호도, 노선도 안 붙어 있네."
10053030-267 = "실례함다, 기사님. 시라카와 산 가는 버스 맞슴까?"
10053030-268 = "…………."
10053030-269 = "……? 저기요, 안 들리심까?"
10053030-270 = "…………."
10053030-274 = "냄새가 나는데……."
10053030-275 = "……이거는, 꺼내는 수밖에 없나?"
10053030-277 = "꺼낸다니, 뭘? 설마 총이야?"
10053030-278 = "귀신을 상대로 싸움을 거는 건, 별로 좋은 생각 같지 않은데……."
10053030-281 = "선생님, 코노카를 잘 지켜봐 주십시오."
10053030-282 = "<미신>과 관련된 코노카는 반드시 <사고>를 일으킵니다."
10053030-284 = "[ns15] (설마, 칸나의 우려가 여기서……?)\n[ns16] \"저기, 코노카, 일단은 버스는 보내고…….\""
10053030-289 = "아뇨, 선생님. 이런 놈들 상대로는 이게 직빵임다."
10053030-290 = "여기서는 꺼내야겠슴다."
10053030-295 = "[ns17] \"……? 그게 뭐야?\"\n[ns18] \"학생 수첩?\""
10053030-298 = "에헤이~ 전혀 모르겠다는 표정이시네요."
10053030-299 = "뭐, 보고만 있으십쇼. 키보토스에서 운전한다는 양반들은 총보다 이걸 무서워한단 말이죠."
10053030-300 = "저기, 아저씨. 발키리에서 나왔슴다. 잠깐 면허 좀 봅시다."
10053030-302 = "…………."
10053030-303 = "못 들으셨슴까? 거 면허증 좀 보겠다고요. 그 뭐냐, 거부하면 도로거시기법 위반인 거는 아시죠? 딱지 떼심다?"
10053030-305 = "…………."
10053030-309 = "앗! 이 아저씨! 거기 안 서?! 튀고 자빠졌……!"
10053030-314 = "……진짜 갔다."
10053030-315 = "귀신도 딱지 떼는 건 무서운 건가……?"
10053030-317 = "에이씨…… 다음에 잡히기만 해봐……."
10053030-318 = "근데 선생님. 용케 이상한 버스인 걸 아셨네요? 겉보기에는 그냥 버스 같았는데."
10053030-319 = "[s19] \"아, 그…… 레나가 알려줘서.\"\n[s20] \"츠바사 덕분이려나…….\""
10053030-321 = "어, 어어?! 그, 그렇네! 뭔가 거동이 좀 수상했다고 할까……!"
10053030-322 = "(내 이름 팔 거면 미리 말하라고! 깜짝 놀랐잖아!)"
10053030-327 = "흐응~?"
10053030-329 = "어? 으음…… 나는 전문가니까! 아는 수가 있다고 할까……."
10053030-330 = "헤에? 무슨 방법인데, 소장?"
10053030-331 = "그, 그건, 코노카 군에게는 조금 이른 이야기라……."
10053030-335 = "흐응~?"
10053030-342 = "아, 이번에야말로 진짜 버스 온 거 같지 말임다?"
10053030-347 = "이번에는 진짜 버스가……. 아니, 내 말은! 딱히 아까 버스가 귀신이었다고 생각하는 건 아닌데!"
10053030-354 = "어서 오세요~ 조심히 올라오세요~"
10053030-355 = "아, 안녕하세요."
10053030-356 = "저기, 이상한 질문일 수도 있는데요. 혹시 앞에 간 버스 말인데요."
10053030-358 = "……네? 앞에 버스가 갔다고요? 그거 이상한 이야기네요."
10053030-359 = "이 정류장에는 이 버스 한 대밖에 안 다니는데요."
10053030-360 = "……?!"
