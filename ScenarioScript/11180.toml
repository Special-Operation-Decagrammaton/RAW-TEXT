[translation]
11180-2 = "제18화;친구 같은 게 아니라고!"
11180-3 = "시바세키 라멘집"
11180-4 = "왔다!! 잘 먹겠습니다-!"
11180-5 = "한 사람당 한 그릇……. 이런 호사를 누려도 되는 걸까요?"
11180-8 = "아비도스 학교의 친구들이군. 부족하면 말하라고."
11180-11 = "……?!"
11180-12 = "이렇게 맛있는데 장사가 안되다니 안타깝네."
11180-13 = "위치가 나쁜 거 아냐? 망해가는 학교의 지역에 있으니까."
11180-14 = "뭐, 맛있으면 그만이지. 자, 먹어볼……."
11180-15 = "……아니라고."
11180-16 = "응?"
11180-17 = "친구 같은 게 아니라고오-!!"
11180-18 = "(쾅!)"
11180-19 = "우왓-?!"
11180-20 = "뭐가 문제인지 알겠어!! 뭐가 거슬리는지 알겠다고! 이 가게, 이 가게가 문제야!!"
11180-21 = "?!"
11180-22 = "무슨 소리야?!"
11180-23 = "우리는 일을 하러 왔어! 하드보일드하게!! 무법자처럼!!"
11180-24 = "그런데 여기는 뭐야! 배고플때 먹을 걸 잔뜩 주기나 하고!! #n따뜻하고 친절하고! 막 옆에서 말 걸어주고 화기애애해지고 달콤해지는 이 분위기!"
11180-25 = "여기 있으면 모두가 다 사이좋게 친구가 되어버릴 것 같다고!!"
11180-26 = "좋은 거 아닌가……?"
11180-27 = "아냐!! 이게 죄다 엉망진창으로 만들고 있잖아! #n내가 제대로 된 악당이 되려면 이런 가게부터 없어져야 한다고!!"
11180-28 = "나에게 필요한 건 냉혹과 무자비와 철혈이지, 이런 달콤함이 아니라고!!"
11180-29 = "아니, 그렇게 심각하게 생각하는 건……."
11180-30 = "……."
11180-31 = "그러니까…… 이 가게가 없어져야 한다는 얘기죠, 아루 님?"
11180-32 = "……응?"
11180-33 = "(스윽-)"
11180-34 = "다행이에요. 드디어 아루 님께 도움이 될 수 있어서."
11180-35 = "기폭 장치? 그걸 왜 꺼내……."
11180-36 = "하루카, 자, 잠깐만?"
11180-38 = "(꾸욱-)"
11180-39 = "……."
11180-40 = "……엥?"
11180-42 = "(콰아아아아아아앙---------------)"
11180-44 = "전방 10km 반경에서 폭발이 감지되었습니다! 가까워요!!"
11180-45 = "10km라면……. 설마 시내? 습격인가?!"
11180-46 = "일단 충격파의 형태는 C4폭탄의 연쇄 반응으로 보입니다. #n포격이나 폭격은 아니에요……. 좀 더 확인해보겠습니다!"
11180-47 = "……폭발의 위치 확인, 시내예요!! #n정확한 진원지는……"
11180-48 = "시바세키 라멘……?!"
11180-49 = "시바세키 라멘집이 흔적도 없이 폭발했어요?!"
11180-50 = "뭐?! 마, 말도 안돼! 거기는 노릴 이유가 없는 곳이잖아!"
11180-51 = "전략적 요충지도 아니고 주요 교통로도 아니야. 대체 누가……."
11180-52 = "서, 설마 나를 노리고……?"
11180-53 = "추측은 나중에 해도 늦지 않아. 일단 선 조치다!"
11180-54 = "맞아요! 지금 그럴 때가 아니에요!! 당장 가봐요!"
11180-55 = "호시노 선배한테도 연락해두겠습니다, 바로 출동입니다!!"
11180-57 = "마, 말도 안돼!! 마스터…… 무사해야 해……!"
11180-59 = "(뭉게뭉게-)"
11180-61 = "(콜록 콜록) 우와 건물이 흔적도 없이 사라졌어."
11180-62 = "(쿨럭, 쿨럭) 이건 대체……."
11180-63 = "(빙글빙글)"
11180-65 = "다음화;용서 못 해, 네놈들!"
