[translation]
1301115-1 = "게이머의 추억"
1301115-5 = "선생님! 됐어! 차징 끝났어!"
1301115-6 = "[s] \"좋아! 다운시킨다! 가라, 모모이!\""
1301115-7 = "각도가 거의 드리프트 수준으로 꺾여야 할 것 같지만…… 좋아!"
1301115-8 = "이야아아앗–!!!"
1301115-13 = "어, 어어?!?!"
1301115-14 = "[ns1] \"아, 모모이는 그런 타입이었군.\"\n[ns2] \"레이싱 게임할 때, 핸들 따라서 몸을 기울이는 타입.\""
1301115-17 = "다, 당연하잖아! 게임에 얼마나 몰입하는지도 게이머의 소양 중 하나니까!"
1301115-18 = "어라……?"
1301115-25 = "꾸엑–?!"
1301115-27 = "괜찮냐고? 이게 괜찮아 보이냐–!!!"
1301115-28 = "뭐…… 쌓아 뒀던 이런저런 물건의 탑이 무너진 것뿐이지만……."
1301115-29 = "[s] \"자, 자. 일어나. 손잡아 줄게.\""
1301115-33 = "고마워, 선생님……. 어라?"
1301115-39 = "뭐야, 여기 있었구나! 어디 갔나 했는데!"
1301115-40 = "이게 뭐냐고? 후. 후. 후……. 이것이야말로……."
1301115-41 = "미도리와 함께 처음으로 세트로 맞춘! 우리들의 게임기인 것이다!"
1301115-42 = "[s] \"그럼 모모이는 이걸로 게임을 시작한 거야?\""
1301115-43 = "응? 난 아닌데? 난 이거 사기 전부터 계속 게이머였다구!"
1301115-44 = "단지 이 게임기를 세트로, 미도리 것까지 함께 샀던 것뿐이었지."
1301115-45 = "생각해 보니까 미도리에게는 그게 첫 게임기였을 수도 있겠네."
1301115-46 = "[s3] \"그렇게 중요한 거였으면…….\"\n[s4] \"잘 좀 보관해 두지 그랬어…….\""
1301115-49 = "자, 잘 보관하고 있었거든?!"
1301115-50 = "봐! 거치대랑 투명 보관대까지 사서 잘 모셔 놨잖아!"
1301115-55 = "어? 평소에 어디 있는지 찾을 수 없었으면 의미가 없는 것 아니냐고? 그, 그건 그렇게 볼 수도 있는데……."
1301115-56 = "아무튼! 나 치고는 잘 하고 있었단 말이야!"
1301115-57 = "[s] \"그래, 그래…….\""
1301115-58 = "응? 그런데 이 게임기만 이렇게까지 신경 써서 보관하고 있었던 이유가 있냐고?"
1301115-59 = "……."
1301115-60 = "뭐, 그것도 어떻게 보면 언니로서 책임감의 증표 같은 거라고 할까!"
1301115-61 = "애초에, 게임을 같이 하기 전까지는, 미도리랑 그렇게까지 사이가 좋지 않았거든."
1301115-62 = "사이 좋아질 방법을 찾으려다…… 게임을 같이 하면 어떨까, 하고 생각했어."
1301115-63 = "그러다 보니…… 이것도 같이 사 줬던 거고."
1301115-64 = "자기 돈으로 사라고 하면 화를 낼 수도 있지만, 가족이 선물해 주는 걸 마냥 소홀히 하기도 꺼림칙한 법이잖아?"
1301115-65 = "후. 후. 후……. 그렇게 나의 '미도리 게임 물들이기 작전'은 멋진 성공을 거두고 말았던 것이었다……."
1301115-66 = "뭐, 결국 이렇게 예전보다 나름 사이도 좋아졌고, 끝이 좋으면 다 좋은 게 아닐까?"
1301115-67 = "어라……? 그런데 우리 사이좋은 거 맞긴 한가……? 맨날 내가 미도리한테 말로 두드려 맞는 느낌인데……?"
1301115-68 = "[s] \"그러고~ 보니~ 게임도 이길 때보다 질 때가 더 많지~\""
1301115-69 = "그걸 꼭 말로 해야겠냐고!"
1301115-70 = "아무튼 이거 내가 전체적으로 손해 보고 있는 거 아닐까? 어떻게 생각해, 선생님?!"
1301115-71 = "[s] \"원래 언니는 좀 져주고 그러는 거야…….\""
1301115-72 = "여, 역시 그렇지? 그래! 그런 거야! 절대 내가 게임을 더 못하거나 그래서 그런 게 아니라고!"
1301115-77 = "어……? 으아앗?!?!"
1301115-78 = "[s] \"왜 그래? 무슨 일이야, 모모이?\""
1301115-79 = "우, 우리가 이러고 있었던 사이에……."
1301115-80 = "몬스터가 도망갔어!"
1301115-81 = "[ns] \"토벌 실패?!\""
1301115-82 = "으앙~! 이거 또 찾으려면 무지 고생인데~!"
1301115-84 = "(그렇게, 여러 가지 사소한 소란이 있었지만.)"
1301115-85 = "(간만에 모모이와 실컷 게임을 하며 놀았다.)"
