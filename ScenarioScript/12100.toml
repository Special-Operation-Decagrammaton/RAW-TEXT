[translation]
12100-1 = "제10화;카이저 PMC 2"
12100-7 = "하아…… 하아……."
12100-8 = "후우……."
12100-9 = "끝이 없잖아, 이거……."
12100-11 = "(지직) ……생님, 들리시나요? 포위망을 뚫었지만……. 다시 포위가……."
12100-12 = "(지직) 통신이 불안정…… 어서 퇴각을……."
12100-13 = "누군가…… 접근……."
12100-23 = "……. 중과부적."
12100-24 = "포위되어 버렸나……."
12100-25 = "……."
12100-32 = "……침입자가 있다고 해서 누군가 했더니, 아비도스였나."
12100-33 = "뭐, 뭔가 높으신 분이 찾아온 거 같은데……."
12100-34 = "……."
12100-35 = "(저 녀석은…….)"
12100-36 = "이곳으로 찾아올 리는 없을 거라 생각했는데. ……뭐, 상관없겠지."
12100-38 = "학생 회장이 사라진 지금, 부학생회장인 당신이 빚을 갚아나가실 겁니까? 타카나시 호시노 씨?"
12100-39 = "아니면…… 저의 제안을 들어보시겠습니까?"
12100-41 = "(그때의…….)"
12100-42 = "멋대로 남의 사유지에 불법 침입해 와서 사업에 끼친 손해."
12100-43 = "너희 학교가 지고 있는 빚에다가 더해서 곱절로 받아보는 것도 좋겠지만, 뭐, 그걸 더한다고 해서 달라질 건 없으니……"
12100-44 = "너는…… 그때의……."
12100-45 = "……. 흐음. 그 게마트리아가 노리던 학생회장인가? 아니, 부학생회장이었나. 아무튼."
12100-46 = "그래그래, 더 재미있는 아이디어가 생각났다. 흥신소나 헬멧단들보다야 더 낫겠군."
12100-47 = "무슨 소릴 하는 거야? 흥신소……?"
12100-48 = "……당신들은 누구시죠?"
12100-49 = "이런…… 나를 모르다니, 그건 그것대로 실망이군. 아비도스. 누구보다 나에 대해서 잘 알거라고 생각했는데."
12100-50 = "내가 바로 카이저 코퍼레이션의 임원."
12100-53 = "그리고 너희 아비도스 학교가 진 빚의 주인이지. 즉, 너희의 채권자다."
12100-54 = "!!"
12100-55 = "채, 채권자……?!"
12100-61 = "그럼 우리의 해묵은 채권관계에 대해서 논해볼까."
12100-63 = "다음화;이길 수 없는 싸움"
