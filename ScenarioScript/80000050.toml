[translation]
80000050-1 = "제 모든 것을 담아, 당신께."
80000050-2 = "(발렌타인 데이를 맞이하여, 혹시 소란이 일진 않을까. 거리를 순찰하고 있을 때였다.)"
80000050-3 = "(거리를 걷고 있을 무렵, 시야 끄트머리에서.)"
80000050-8 = "[ns] \"……으음.\""
80000050-10 = "(골목 모퉁이를 돌았을 때에도…….)"
80000050-16 = "[ns] \"…………으으음.\""
80000050-23 = "[ns] \"저기…… 와카모?\""
80000050-25 = "어머나."
80000050-26 = "조용히, 들키지 않게 그림자도 밟지 않도록 주의하며 따르던 절 눈치채주시다니……."
80000050-27 = "후후……. 몰래 따르던 입장으로는 조금 이상한 말일지도 모르지만"
80000050-28 = "당신께서 절 알아차려 주셨다는 것만으로도, 또 가슴이 이렇게나 꾸욱 하고 기쁘게 달아올라서……."
80000050-29 = "아아, 안되어요. 저, 또다시 참을 수 없게 되어버린답니다……."
80000050-30 = "[s1] \"아니, 그렇게 대놓고 따라오면 누구라도 챌 걸…….\"\n[s2] \"그보다 무슨 일, 이야……?\""
80000050-31 = "아, 제가 당신을 찾은 이유는……."
80000050-32 = "아, 제가 당신을 찾은 이유는……."
80000050-38 = "감히 우리 구역에서 초콜릿을 팔려고 들다니! 시비 거는 거냐?! 앙?!"
80000050-40 = "흠흠. 그러니까, 제가 당신을 찾은 이유는 다름이 아니라……."
80000050-44 = "그건 우리가 할 말이다! 이미 여기 구역은 우리가 영업하고 있었다고!"
80000050-45 = "좋아! 걸어오는 싸움! 피하지 않는다고!"
80000050-46 = "모두! 쳐라!"
80000050-53 = "이 근처, 조금 소란스럽군요?"
80000050-54 = "[s] \"차, 참아주라! 일단 어떻게든 정리하고 올 테니까!\""
80000050-56 = "(그렇게 와카모가 날뛰기 전에 먼저, 어떻게든 상황을 진정시킬 수 있었다.)"
80000050-58 = "후후, 고생하셨습니다. 선생님. 그렇게 당황하지 않으셔도……."
80000050-59 = "이 정도 소란쯤이야, 오늘 같은 날이라면 얼마든지 참을 수 있었습니다만……."
80000050-60 = "[s] \"저, 정말?\""
80000050-61 = "네에, 오늘은 발렌타인 데이. 오늘같이 특별한 날까지 소동을 일으켜서야 당신을 뵐 면목이 없는걸요."
80000050-62 = "오늘 제가 사알짝, 당신의 뒤를 따르며 찾아뵌 이유는 오로지 하나."
80000050-63 = "이것을 전해드리기 위해서랍니다."
80000050-69 = "[ns] \"와카모의 초콜릿……?\""
80000050-70 = "네에, 그렇답니다. 발렌타인 데이를 기념해, 당신께 꼭 이것을 드리고 싶어서……"
80000050-71 = "이른 아침부터 당신을 찾아 거리를 헤매었습니다만……."
80000050-72 = "이렇게 만나 뵙게 되다니."
80000050-73 = "아아, 후후훗♡"
80000050-74 = "이건……. 그야말로 운명이로군요♡"
80000050-75 = "[s] \"아니, 처음엔 분명 몰래 미행했다고 들은 것 같은…….\""
80000050-76 = "자아, 이럴 게 아니라. 부디 이 자리에서 맛보아주시겠나요?"
80000050-77 = "부디 저 와카모, 당신의 감상을 들려주었으면 하여……. 네에?"
80000050-78 = "[s] \"으, 응. 그럼 고맙게 잘 먹을게…….\""
80000050-82 = "(와카모 앞에서 초콜릿을 입으로 가져가려고 한 그때.)"
80000050-83 = "후훗, 후후후훗. 자아, 어서. 어서……. 저의 초콜릿을"
80000050-84 = "저를……. 당신의 입안에……!"
80000050-85 = "[s] 문득 마음에 걸려 초콜릿을 내려놓는다."
80000050-86 = "아……. 드셔 주시지, 않는, 건가요……?"
80000050-87 = "[s3] \"아, 아냐! 먹을게!\"\n[s4] 와카모의 초콜릿을 다시 입에 가져간다."
80000050-88 = "후훗, 후후훗♡ 조금만, 조금만 더……"
80000050-89 = "후훗, 후후훗♡ 조금만, 조금만 더……"
80000050-90 = "당신께서, 제 전부를 맛보아주신다면……!"
80000050-91 = "[s] 다시 초콜릿을 내려놓는다."
80000050-92 = "아아……. 어째, 어째서? 선생님……?"
80000050-93 = "[s5] \"저기, 이건 혹시나 혹시나 해서 묻는 건데.\"\n[s6] \"와카모, 이 초콜릿에, 혹시…… 뭔가 넣은 거야?\""
80000050-94 = "네, 물론 넣었답니다. 그것도, 듬.뿍."
80000050-95 = "네, 물론 넣었답니다. 그것도, 듬.뿍."
80000050-96 = "[s] \"역시나?! 뭘 넣은 거야?!\""
80000050-97 = "네? 그야……."
80000050-98 = "저, 와카모의 주체할 수 없는 애정을 잔뜩잔뜩 담았답니다!"
80000050-99 = "그걸, 부디 당신께서 맛보아주셨으면 했을 뿐인데."
80000050-100 = "혹시, 문제가 있는 걸까요?"
80000050-101 = "[s] \"아, 그런 거구나. 난 또 괜한 생각을……\""
80000050-102 = "……네?"
80000050-103 = "(어쨌거나 괜한 생각은 그만두고 그렇게 와카모가 준 초콜릿을 맛있게 먹었다.)"
80000050-108 = "[ns] \"응, 와카모. 맛있었어. 고마워.\""
80000050-109 = "아아, 정말로 드셔 주었군요. 당신께서 드디어, 정말로 제가 만든 초콜릿을……."
80000050-110 = "그렇게나 과격하게……. 제 전부가 담긴 그것을."
80000050-111 = "그 입으로 씹어, 부수어, 꿀꺽- 하고 삼켜주시다니."
80000050-112 = "제 전부가, 당신의 뱃속에서 녹아들어 비로소 하나가……."
80000050-113 = "[s] \"저, 저기, 와카모 양? 말하는 게 조금, 저기요?\""
80000050-114 = "후훗, 아니요. 별것 아니에요."
80000050-115 = "당신께서 드셔 주신 게 너무, 기쁜 나머지. 제 마음을 잠시나마 주체할 수 없어서……. 후훗."
80000050-116 = "자아, 이게 끝이 아니랍니다. 다음은, 그렇군요. 오늘 하루 저와 함께 해주시지 않겠나요?"
80000050-117 = "[s] \"으응, 그건 상관없지만…….\""
80000050-118 = "네에, 제 것을 받아들여 준 당신과, 오늘 하루를 바로 곁에서 함께."
80000050-119 = "후후훗. 정말……."
80000050-120 = "오늘은, 최고의 하루가 될 것 같네요♡"
80000050-121 = "[s] \"……???\""
80000050-123 = "(조금은 등줄기가 서늘해지는 그 한마디와 함께, 그렇게 하루를 와카모와 보내게 되었다.)"
