[translation]
22120-1 = "제12화;작전회의"
22120-2 = "……회장이, 아리스 쨩을……?"
22120-3 = "[s] \"응. 그래서 유우카라면 리오가 있는 곳을 알지 않을까 했어.\""
22120-4 = "최근 들어 무언가 비밀리에 일을 진행하고 있다……라는 낌새는 있었지만."
22120-5 = "과연 그런 일까지 저질러 버린 건가요. 리오 회장. 조금…… 쇼크네요."
22120-6 = "……회장……. 무슨 짓을 하고 있는 거야?!"
22120-7 = "아리스 쨩을?"
22120-8 = "납치해?"
22120-9 = "거기다 헤일로를 파괴?"
22120-10 = "……의미를 모르겠어!"
22120-11 = "평소에도 이해하기 어려운 일을 많이 저지르는 분이긴 했지만요."
22120-12 = "노아! 이건 이해하기 어렵다 아니다의 이야기가 아니야!"
22120-13 = "오래 전부터 무슨 생각을 하고 있는지 몰랐지만……."
22120-14 = "아무리 상대가 회장이라고 해도…… 절대로 용서 못 해!"
22120-18 = "……그래도, 자기 선배인데, 가차없네."
22120-19 = "그치~? 누가 뭐라 해도 유우카니까!"
22120-20 = "어머나, 후훗~♪ 신뢰란 걸까요?"
22120-21 = "……응? 무슨 소리야?"
22120-22 = "[s1] \"어쨌거나 유우카, 노아. 부탁할게.\"\n[s2] \"리오가 아리스를 어디로 데리고 갔는지 알아봐 줘.\""
22120-23 = "네, 세미나의 내부 정보를 확인해 보면 리오 회장의 행적도 충분히 알아낼 수 있을 테니까!"
22120-24 = "네, 세미나의 내부 정보를 확인해 보면 리오 회장의 행적도 충분히 알아낼 수 있을 테니까!"
22120-26 = "맡겨만 주세요! 전력을 다해 협력할게요!"
22120-28 = "찾았어요! 선생님! 리오 회장이 아리스 쨩을 데리고 향한 곳!"
22120-29 = "선생님의 말을 듣고 설마 하고 생각하긴 했지만……."
22120-30 = "정말로 세미나의 자금을 빼돌려서 이런 걸 만들고 있었을 줄이야……."
22120-31 = "이번엔 정말 쇼크라고 해둘까요?"
22120-32 = "[s] \"대체 뭐길래 그래?\""
22120-33 = "혹시나 싶어 세미나의 데이터베이스에서 일부러 삭제되거나 은폐된 흔적이 남은 데이터를 추적해서 알아본 결과……"
22120-34 = "교묘하게 숨겨져 있던 세미나 부비의 자금 흐름을 추적하는 데 성공했답니다."
22120-35 = "그렇게 해서 찾아낸 곳이 여기…… 지금 화면을 띄울게요!"
22120-41 = "[ns] \"이건…… 도시?\""
22120-42 = "데이터베이스에서 삭제된 자료를 복원했더니, 그 속에서 이 도시의 데이터를 발견했어요."
22120-43 = "코드네임 [ruby=Eridu]<에리두>[/ruby]."
22120-44 = "리오 회장이 비밀리에 건설하고 있던……"
22120-45 = "<키보토스에 찾아올 멸망에 대비하기 위한 요새도시>, 라는 모양이에요."
22120-46 = "[s] \"……요새도시 <에리두>……인가.\""
22120-47 = "대체…… 어느 틈에 저희들의 눈을 피해 이 정도 규모의 도시를 지을 수 있었던 건지……."
22120-48 = "자금의 흐름을 숨기는 것부터 쉽지 않았을 텐데……."
22120-50 = "아……."
22120-51 = "혹시…… 지난번에 코유키 양이 얽혔던 일과 관련이 있는 것이……?"
22120-52 = "앗."
22120-53 = "코~유~키~~!!"
22120-54 = "[s] \"하지만 그렇다고 해서 도시를 만들다니? 왜?\""
22120-55 = "리오 회장은 자신이 해야만 하는 일이 있다고 생각하면 망설이지 않는 분이세요."
22120-56 = "합리적인 판단, 용단이 필요한 결정. 그것을 위해서라면 불도저처럼 밀고 나가는 추진력까지."
22120-57 = "그렇게 위험을 배제하고 키보토스의 멸망을 막기 위해 동분서주한 결과, 만들어진 것이 바로……"
22120-58 = "요새도시 <에리두>라는 것이겠죠."
22120-59 = "그 중에서도 아리스 쨩은 저곳…… 가장 중심에 있는 중앙탑으로 끌려갔을 확률이 높아요."
22120-61 = "저기에…… 아리스가……."
22120-62 = "그럼 이곳의 좌표를 전달해 드릴게요."
22120-63 = "입장상, 저희가 도와드릴 수 있는 건 여기까지겠지만………."
22120-64 = "부디 리오 회장을 막고, 아리스 쨩을 데려와 주세요! 선생님! 그리고 모두들!"
22120-65 = "[s] \"응. 맡겨만 줘.\""
22120-71 = "에리두의 좌표는 확인했지만, 문제는 그곳까지 잠입하는 방법이야."
22120-72 = "회장이라면 분명 침입자를 막기 위한 방어 시스템을 구축해놓았을 거니까."
22120-73 = "단순히 물리적으로 접근하려고 하면……"
22120-74 = "뭐, 에리두를 왜 요새도시라고 부르는지 온몸으로 체험해볼 수 있을 테지."
22120-76 = "그럼 어떻게 해야 해?!"
22120-77 = "접근하는 것조차 어렵다면……."
22120-79 = "물론 그건 어디까지나 평범하게 접근했을 때의 이야기야."
22120-81 = "……마침 우리 엔지니어부라면 다른 방법을 알고 있거든."
22120-82 = "[s] \"다른 방법……?\""
22120-83 = "도시를 짓기 위한 <인력>만이라면, 리오 회장이 자체적으로 운용하는 드론으로 충당할 수 있었을 테지."
22120-84 = "하지만 <자재>라면 이야기가 달라져. 무에서 유는 만들 수 없는 법이니까."
22120-85 = "밀레니엄 자치구 외곽에는 기본적으로 물류를 수송하기 위해 설치된 무인 열차가 잔뜩이니까……."
22120-86 = "밀레니엄에서 도시를 짓기 위한 자원을 운반했다면 그곳 어딘가에 있는 노선 중 하나가 남몰래 에리두로 이어지는 노선일 확률이 커."
22120-87 = "아…… 그럼 그 노선이 무엇인지만 찾아낼 수 있다면……"
22120-88 = "맞아. 에리두로 찾아갈 수 있어."
22120-89 = "하, 하지만 그걸 어떻게 찾아야 하나요?! 저희는 그런 방법 같은 건……."
22120-90 = "그런 면에서 우리 엔지니어부가 협력할 수 있다고 판단한 거야."
22120-91 = "[s] \"하지만 우타하. 우린 리오와 싸우게 될 거야. 그런데도…….\""
22120-92 = "어째서 협력을 하느냐고?"
22120-93 = "물어볼 필요도 없어."
22120-94 = "리오 회장은, 우리가 아리스에게 맡긴 엔지니어부의 최대 발명품까지 멋대로 빼앗아 갔어."
22120-95 = "최대 발명품이라니, 그건……."
22120-96 = "아리스 쨩의 슈퍼노바……."
22120-97 = "그래. 이쪽의 데이터 실측을 방해하다니, 그건 완벽하게 월권행위나 다름없어. 사실상 이건 엔지니어부를 향한 선전포고란 거지. 이래서야 엔지니어부의 부장으로서 도저히 좌시할 수 없어. 그러니 나도 이대로 가만히 있으면 안 되겠다는 생각으로……."
22120-98 = "우타하 선배, 부끄러워하기는……"
22120-99 = "어, 응? 어……? 저기, 무, 무슨 이야기……야?"
22120-100 = "네! 제가 설명해드리죠! 지금 우타하 선배의 마음속의 논리 흐름은 다음과 같습니다!"
22120-101 = "친구를 구하러 가고 싶지만, 대놓고 그렇게 말하기엔 살짝 부끄러운 느낌도 들고, 공학도를 자처하는 사람으로서 너무 논리적이지 못한 건 아닌가 하는 의문도 살짝 드는 가운데, 차라리 물건을 빼앗겼다는 걸 구실로 삼으면 얼마든지……"
22120-103 = "잠깐 코토리."
22120-108 = "웁, 우웁?!"
22120-109 = "쉿."
22120-110 = "(끄덕끄덕!!)"
22120-113 = "………좋았어. 비밀은 이것으로 지켰고."
22120-114 = "[s] \"저기 미안, 하나도 못 지킨 거 같은데.\""
22120-115 = "……지켰고."
22120-116 = "[s] \"어, 응…….\""
22120-117 = "그래서 우리 엔지니어부도 돕겠어."
22120-118 = "응."
22120-119 = "엣헴-! 맡겨만 주세요!"
22120-124 = "(그렇게 아리스의 위치도, 거기까지 갈 수단도 마련되었다 싶던 그때.)"
22120-126 = "[ns] \"다음 문제는 정작 그곳에 도착해서 아리스를 어떻게 데려오느냐겠네.\""
22120-127 = "네, 요새도시라고 부를 정도면…… 리오 회장은 만반의 대비를 갖추어 놓았겠죠."
22120-128 = "도시의 시큐리티는 물론 방어 시스템 또한 어지간한 수준 이상으로 구축해 놓았을 거야."
22120-129 = "게다가…… 요새도시를 어떻게 한다 해도, 아직 가장 큰 장애물이 남아 있어."
22120-130 = "[s] \"가장 큰 장애물이라면…….\""
22120-132 = "리오 회장의 곁에 딱 붙어서, 철통처럼 그곳을 지키고 있을, 바로 그 메이드로군요."
22120-133 = "…………."
22120-134 = "토키 씨…… 라고 했었죠?"
22120-135 = "그때 토키 씨가 보여주었던 모습은, 그게……"
22120-136 = "여기저기서 번쩍번쩍하고 이동하던 모습이 마치……."
22120-137 = "……응, 마치 <치트 플레이어>…… 그 자체였어."
22120-141 = "우리에게 필요한 건 작전이야."
22120-147 = "[ns] \"네루가 작전이라고 말했어?!\""
22120-148 = "네, 네루 선배. 괜찮아?"
22120-149 = "혹시, 크게 다친 바람에……?"
22120-150 = "얼씨구. 뭔 놈의 호들갑이야?"
22120-151 = "부장의 임무 모드다."
22120-152 = "진지해진 부장은 무척 진지하니까!"
22120-153 = "네, 그렇답니다~"
22120-155 = "과, 과연……!"
22120-156 = "으음, 네루 선배……. 무슨 의미인지 물어봐도 될까?"
22120-157 = "어차피 요새도시인가 뭔가 하는 곳을 찾아가더라도 그곳이 리오의 영역인 이상, 우리의 움직임은 훤히 노출될 게 뻔해."
22120-158 = "누가 뭐라 해도 그 녀석은 <빅 시스터>라는 이름으로 불리는 녀석이니까."
22120-159 = "[s] \"그렇다는 이야기는……?\""
22120-160 = "간단한 이야기야. 이것저것 잴 시간에, 그냥 처음부터 눈길을 끌 생각으로 쳐들어가는 거야."
22120-161 = "하지만 부장, 그렇게 했다간 한꺼번에 리오 회장에게 당할 우려가……"
22120-162 = "그래서 작전이 필요하단 거야."
22120-163 = "정확히는 양동작전이 말이지."
22120-164 = "[s] \"양동작전……?\""
22120-165 = "이 게임의 승리 조건은 간단해."
22120-166 = "<우리가 당하기 전에 그 [ruby=아리스]꼬맹이[/ruby]를 먼저 구해낸다.>"
22120-167 = "우리 C&C가 정면으로 쳐들어가서 최대한 소동을 일으키겠어. 그러면 자연스레 리오는 물론 토키, 그 녀석도 우리에게 시선이 집중되겠지."
22120-168 = "그 사이에 너희들이 꼬맹이를 구해. 어때, 간단한 이야기지?"
22120-170 = "그렇게만 하면……"
22120-171 = "우리들의 승리……!"
22120-172 = "하지만 네루 선배…… 괜찮아? 상대는 그 <치트 플레이어>고……"
22120-174 = "하아? 나를 뭘로 보는 거냐?"
22120-175 = "그 녀석에겐 한 방 먹었으니까. 되갚아주기로 결심했다고."
22120-176 = "그러니 결심한 걸 실행할 뿐이야."
22120-177 = "따르겠다."
22120-178 = "응응! 우리한테 맡겨만 줘~"
22120-179 = "후훗, 있는 힘껏 힘을 내봐야죠."
22120-180 = "(……확실히, 그때와 달리 C&C 전원이 모인다면…… 돌파할 수 있는 가능성은 높아…….)"
22120-181 = "그럼 이것으로 결정이네요. 정면은 부장님과 함께 저희 C&C가 맡겠습니다."
22120-182 = "후방으로 잠입하는 건 그 외. 게임개발부와 우리들…… 그리고 선생님일까?"
22120-183 = "우리 베리타스는 뒤에서 원격으로 지원할게."
22120-184 = "응! 가는 길을 가로막는 시큐리티의 해킹은 우리에게 맡겨줘!"
22120-185 = "완벽하게 해내 보이겠어요."
22120-187 = "자! 그럼 이걸로 대충 정해진 거네!"
22120-188 = "[s] \"응.\""
22120-189 = "목표는 요새도시 에리두의 중앙타워! 아리스가 잡혀간 바로 그곳!"
22120-190 = "멋대로 가출한 아리스를! 우리 손으로 직접!"
22120-191 = "다시 데려오는 거야!"
22120-195 = "[ns] \"좋았어. 그럼 지금부터……\""
22120-204 = "[ns] \"다 같이 작전 개시!\""
22120-206 = "다음화;빅 시스터"
