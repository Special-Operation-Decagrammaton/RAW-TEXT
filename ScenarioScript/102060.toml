[translation]
102060-1 = "제6화;제1 성소 공략 - 아비도스 사막지구"
102060-3 = "작전 시작입니다! 여러분!"
102060-4 = "저희는 랑데뷰 포인트까지 전진, 2부대가 사막횡단철도로 목표를 유인해 내면 거기서 합류, <수호자>까지의 경로를 확보합니다!"
102060-5 = "아까도 말했지만 비나의 레이저는 꼭 조심하라구."
102060-9 = "네~☆ 알겠어요."
102060-10 = "그럼 출발~"
102060-11 = "좋아, 가보자고!"
102060-13 = "좋아. 우리도 시작하자. 다들 준비됐지?"
102060-14 = "응, 준비 완료~"
102060-15 = "네, 넵!"
102060-16 = "그럼 시작해, 카요코."
102060-18 = "알겠어. 철도를 작동시킬게."
102060-27 = "아, 아앗! 저, 저기……!!"
102060-28 = "습격……?!"
102060-29 = "헤에, 이 녀석들 우리를 노리고 온 거야? 똑똑한데?"
102060-33 = "……흥, 이런 걸로 우리를 막을 수 있다고 생각했나 본데. 그게 얼마나 큰 착각인지 깨닫게 해주겠어."
102060-34 = "자아, 하드보일드하게 가자고!"
