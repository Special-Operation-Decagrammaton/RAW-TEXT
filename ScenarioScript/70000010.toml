[translation]
70000010-1 = "수상쩍은 교류회 1"
70000010-4 = "킥…… 킥킥. 드디어 도착했군."
70000010-5 = "태클 걸고 싶은 게 엄청 많지만 일단 이것부터 물어야 할 것 같은데요……."
70000010-6 = "여긴 대체 왜 온 거죠?"
70000010-7 = "뭐야, 모르는 거냐? 여기는 바로 붉은겨울 연방학원이다. 광대한 자치구와 엄청나게 많은 학생을 보유한 학원이지."
70000010-8 = "아니, 여기가 어딘지는 알고 있는데요."
70000010-9 = "갑자기 붉은겨울과 교류회라니…… 설마 해서 묻는데 마코토 선배, 또 이상한 계획을 꾸미고 있는 건 아니겠죠?"
70000010-11 = "킥킥킥킥……."
70000010-12 = "이곳의 그 독재자와 만나는 순간 알게 될 거다."
70000010-13 = "모든 건 이 마코토 님의 창대한 계획의 일부……."
70000010-15 = "(……일단 뭔가 있긴 한 거군요. 이부키를 두고 오길 잘했네요.)"
70000010-16 = "아뇨. 계획이 있다면 제대로 말해주세요, 선배."
70000010-17 = "언제 도망쳐야 할지 저도 미리 생각해 두어야 하니까요."
70000010-18 = "킥킥킥…… 두고 보면 알 거다. 이로하. 이번엔 저번처럼 실패할 일은 없을 거니까."
70000010-19 = "(점점 더 불안해지는데……)"
70000010-27 = "기다리시게 해서 죄송합니다. 만마전 여러분. 붉은겨울 사무국의 비서실장, 토모에입니다."
70000010-28 = "서기장님께서 기다리고 계시니 이쪽으로 오시죠."
70000010-34 = "기다리게 했군! 게헨나의 의원들이여!"
70000010-36 = "(……가짜 수염?)"
70000010-37 = "……."
70000010-47 = "……뭐야. 가짜잖아."
70000010-48 = "(깨닫는 게 늦잖아요. 선배…….)"
70000010-49 = "이분이 바로 저희 붉은겨울 학원의 학생회장이자, 미화부장이자, 서기장이자, 체육부장이자, 청소부장이자, 선도부장이자, 급식부장이자, 올해의 MVP, 이번 주의 MVP, 오늘의 MVP에 선정되신 체리노 님이십니다."
70000010-50 = "그래! 요약하자면 엄청 중요한 몸이라는 것이다!"
70000010-52 = "……네. 익숙해서 그 부분은 좋네요. 저희는……."
70000010-53 = "키키키킥!!"
70000010-54 = "아니, 인사는 필요 없다. 이로하. 여기까지 왔으면 성공이니까!"
70000010-55 = "크하하하하하하하하!!! 모든 것이 계획대로야."
70000010-64 = "네? 무슨 말을…… 마코토 선배…… 또 무슨 짓을 저지른 겁니까……."
70000010-65 = "모르겠나? 이로하?"
70000010-66 = "나 마코토 님은 저 독재자를 싫어하는 이곳 붉은겨울 학원의 보안위원장과 이미 오래전부터 내통하고 있었다!"
70000010-67 = "그 내통자는 혁명을 원하더군. 그래서 그걸 이 마코토 님이 물심양면으로 지원해 주고 있었다!"
70000010-68 = "네?!"
70000010-69 = "그래, 즉, 이건 붉은겨울의 내분을 이용한 쿠데타다!!"
70000010-78 = "어머, 쿠데타인가요?"
70000010-79 = "그래, 이제와서 뭘 숨기겠나! 너희는 이 마코토 님과 너희 보안위원장이 쳐 놓은 함정에 걸린 것이지!"
70000010-80 = "어디서 많이 본 패턴인데…… 이거……."
70000010-81 = "자아, 보안위원장! 어디에 있나! 약속대로 저 꼬맹이를 제압하고 붉은겨울의 권력을 나누어보자!"
70000010-85 = "……으응? 왜 모습을 드러내지 않는 거지……? 약속한 시간은 분명……."
70000010-87 = "토모에. 마리나는 지금 어디에 있지?"
70000010-88 = "저번주에 회장님께 쿠데타를 일으켰다가 지금은 구교사에 가 있습니다."
70000010-90 = "?!"
70000010-91 = "으음, 과연. 거기서 또 다른 쿠데타를 일으킨 건가? 제법이로군. 그 근성만큼은 칭찬할만해."
70000010-92 = "보, 보안위원장이 이미 들켜서 유배당했다고?!"
70000010-93 = "아뇨. 상황을 보아하니 마코토 의장이 말하는 쿠데타가 바로 저번 주에 일어난 그 쿠데타 같습니다만……"
70000010-94 = "잠시만 기다려주십시오. 제가 확인해보겠습니다."
70000010-100 = "마리나 위원장? 잘 지내고 계신가요?"
70000010-101 = "다름이 아니라 방금 게헨나의 만마전 분들이 오셨는데…… 혹시 오늘 쿠데타를 일으킬 계획이 있으셨나요?"
70000010-102 = "쿠데타를 일으킬 계획……?"
70000010-103 = "아! 맞다! 게헨나에 연락한다는 걸 깜빡했었다!"
70000010-104 = "토모에 비서실장님, 죄송하지만 저 대신 전해주시겠습니까? 지금 저는 바닥의 얼룩을 지우느라 바빠서……"
70000010-105 = "네. 알겠습니다. 그럼 수고하세요."
70000010-109 = "그렇다고 합니다."
70000010-114 = "……."
70000010-115 = "……."
70000010-117 = "아쉽게 됐구나, 의장. 너무 늦게 도착했군. 아니면 마리나가 너무 성급했던 것일지도."
70000010-125 = "아, 안 돼…… 내 계획이……!?"
70000010-129 = "하아……. 또 저질러버렸군요. 마코토 선배."
70000010-131 = "만마전 의원들을 교류회장까지 모셔라."
70000010-136 = "네!"
70000010-138 = "?"
70000010-139 = "이쪽으로 오시죠. 의원님들."
70000010-141 = "……저기, 제가 할 말은 아닌데, 감옥이나 유치장이 아니라 교류회장이 맞나요? 교류회를 이대로 진행하겠다고요?"
70000010-142 = "무슨 소리지? 쿠데타 정도는 흔히 일어나는 일이지 않나."
70000010-143 = "물론 쿠데타를 일으킨 마리나는 괘씸하니 용서할 수 없지만, 고작 이런 사소한 일로 게헨나와의 교류회 같은 중요한 이벤트를 미룰 수는 없지."
70000010-145 = "흐, 흔히 일어난다고……?!"
70000010-146 = "토모에. 이게 이번 달의 몇 번째 쿠데타지?"
70000010-147 = "미수에 그친 게 세 번, 그리고 실제로 성공한 게 두 번입니다."
70000010-148 = "그래. 기억나는군. 가장 마지막 쿠데타 때는 회색곰을 타고 설산과 빙해를 지나서 학원으로 귀환하는 대모험을 했었지!"
70000010-149 = "……그랬던가요? 설산 한가운데에서 곰과 마주쳤을 때 체리노 쨩이 평소보다 훨씬 더 귀여운 목소리로 비명을 질렀던 것은 확실히 기억하지만요."
70000010-153 = "시끄럽다, 비서실장!"
70000010-154 = "흠흠…… 여하튼. 그런 것이다, 의장."
70000010-155 = "나, 붉은겨울의 서기장은 그런 하찮은 것에 연연하지 않는 몸인 것이야!"
70000010-157 = "하, 하찮은 것……?!"
70000010-158 = "뭐하나! 빨리 교류회장으로 가지 않고. 이 몸은 바쁜 몸이니까!"
70000010-159 = "으, 으응…… 아, 알겠다……."
70000010-165 = "(여기는 대체……)"
70000010-166 = "(그건 그렇고 마코토 선배…… 저 회장의 기세에 완전 주눅 들었네요.)"
