[translation]
10034010-1 = "제1화;밴드를 하자!!"
10034010-2 = "아 그걸 대뜸 주워 먹으면 어떻게 해~~!!!"
10034010-4 = "[ns1] \"뭐야!? 설마 한정판이었다고!?\"\n[ns2] \"아니 그럼 먼저 표시를 해 두시던가!?\""
10034010-5 = "아, 아니 딱히 그런 건 아니지만……!!"
10034010-6 = "하려고 했어! 하기 직전에 하필 선생님이 딱 먹은 거니까!"
10034010-10 = "어, 어디 거였지, 그게? 방금 뭐 먹었어, 선생님? 어떻게 생긴 거 먹은 거야?"
10034010-11 = "……뭐? 기억이 안 나? 아무거나 주워 먹어서 모르겠다고!?"
10034010-12 = "크윽……! 그, 그럼 처음부터 다 다시 대조해서 찾아야 하는데……!"
10034010-13 = "진정해라, 좀. 소리친다고 되돌릴 수 있는 것도 아니고. 어쩔 수 없잖아."
10034010-14 = "방금 건 사고잖아. 선생님은 평소처럼 온 거니까 평소처럼 그냥 주워 먹은 거지."
10034010-15 = "아, 아으……! 그건 아는데……! 알지만……!!"
10034010-16 = "아으으으으~~!!!"
10034010-17 = "자기가 불러 놓고 화내는 나도 웃기는 꼴이지만, 하필 어떻게 딱 그 타이밍에 와서 그렇게 딱 주워 먹냐……!"
10034010-18 = "……응? 뭐라고?"
10034010-19 = "무슨 일인지 설명이나 좀 해 달라고? 아아. 미안, 미안. 흥분해서 멋대로 소리치고 있었네."
10034010-20 = "말하자면 선생님에게 '점수'들을 좀 매겨 달라고 말하려고 했던 건데 말이지……."
10034010-21 = "그동안 리뷰했던 디저트들을 모두 모아서, 조금씩 테이블에 늘어놓고 있었거든. 선생님한테 맛 평가를 받으려고."
10034010-22 = "[s3] \"나 먹으라고? 이것들 다……?\"\n[s4] \"무슨 별점 매기기 같은 거야?\""
10034010-25 = "뭐, 그렇지. 우리보다 조금 더 대중적인, 객관적 평가가 필요했으니까."
10034010-26 = "……<디저트 카페>의 메뉴 선정을 위해서 말이지."
10034010-27 = "[s] \"……디저트 카페?\""
10034010-28 = "말 그대로. 머지않아 다가올 거대한 이벤트. <트리니티 사육제>의 일각."
10034010-29 = "그야말로 트리니티의 수많은 동아리들이 각자의 자랑거리를 뽐내는 경쟁과 승부의 향연……."
10034010-30 = "……까지는 아니고, 그냥 모처럼 학원제니까 각 동아리마다 이색 카페 같은 걸 내보려는 거야."
10034010-31 = "곧 있으면 학원제가 시작되거든."
10034010-32 = "이게 꽤 큰 행사고, 우리 같은 일반 동아리들도 많이들 참가하니까……."
10034010-33 = "[s5] \"과연, 그래서 날 부른 거였네.\"\n[s6] \"나에게 메뉴 선정을 맡기고 싶었다?\""
10034010-37 = "어때. 꽤 훌륭한 방법이지? 내가 생각했지만, 다시 생각해도 가장 좋은 방법이라니까."
10034010-38 = "……응?"
10034010-39 = "항상 이런 건 내가 정하냐고? ……아니? 딱히 그러지는 않는데?"
10034010-40 = "우린 딱히 부장 같은 게 없으니까, 그때그때 다르지. 이번엔 요시미가 의견을 냈을 뿐."
10034010-41 = "……음?"
10034010-42 = "부장이 없으면, 처음 동아리를 만든 건 누구냐고?"
10034010-46 = "아하. 그게 궁금하셨다……?"
10034010-47 = "흐응~."
10034010-48 = "뭐야, 뭐야. 꽤 재미있어 보이는 주제가 나왔잖아."
10034010-49 = "자, 자! 모두 조용!! 여기서는 잠시 조용히! 후후후! 선택의 시간이야!"
10034010-50 = "……선생님?"
10034010-51 = "선생님이 보기에는 어떤 거 같아? 자! 누가 이 동아리를 만든 사람이라고 생각해?"
10034010-57 = "[ns7] \"……요시미?\"\n[ns8] \"……나츠?\"\n[ns9] \"……카즈사?\""
10034010-58 = "흐응. 역시 그래 보여? 하긴 우리 부에선 내가 꽤 의견도 많이 내는 편이고……."
10034010-59 = "실제로 제일 에너지가 넘치긴 하지. 그만큼 시끄럽기도 하고."
10034010-60 = "쓸데없는 소리는 됐으니까. 그리고 에너지 넘치는 건 나보다 나츠 쪽이거든?"
10034010-61 = "……? 여기서 날 걸고넘어진다고……?"
10034010-62 = "음……. 듣고 보니 맞을지도."
10034010-63 = "……???? 여기서 배신한다고?"
10034010-69 = "아니, 말이 안 되잖아. 누가 저 녀석이 만든 동아리에 들어가겠어."
10034010-70 = "그러게."
10034010-71 = "후후. 솔직하지 못하긴……. 귀엽구나!"
10034010-72 = "여기서 더 솔직해지려면 말로 안 끝내는 수밖에 없겠는데."
10034010-73 = "왠지 짜증 나니까 할 거면 거들게."
10034010-76 = "아니, 아니. 디저트 동아리라고. 불량배 조직이 아니고."
10034010-77 = "……? 여기서 시비를 건다고?"
10034010-79 = "우리는 방과후 디저트단의 사천왕이다!!"
10034010-88 = "방패 들지 마!!"
10034010-89 = "나는 폭력에 굴복하지 않는다-!!"
10034010-91 = "아~! 그만! 이제 장난은 그만! 됐으니까 똑바로 좀 하자고!"
10034010-92 = "아이리 오기 전에 디저트 선정까지는 마치기로 했었잖아! 전혀 진전이 없어, 지금!!"
10034010-93 = "이러고 있는 꼴을 아이리가 돌아와서 보면 뭐라고 하겠……."
10034010-100 = "밴드를 하자!!!"
10034010-101 = "이것, 봐. 당연히 밴드……."
10034010-105 = "……밴드……?"
10034010-107 = "모두들……!!"
10034010-108 = "밴드……!"
10034010-109 = "……하자!!!"
10034010-111 = "……밴드?"
10034010-117 = "[ns10] \"……갑자기 밴드?\"\n[ns11] \"이건 또 상상 못 한 전개가…….\""
10034010-120 = "어라…… 선생님!?"
10034010-121 = "마침 와 계셨군요! 네, 맞아요! 밴드! 밴드라고요 선생님!!"
10034010-122 = "아, 아니. 아이리. 잠깐만 기다려 봐."
10034010-123 = "아무리 그래도 너무 갑작스럽잖아. 밴드라니……? 대체 무슨 소리야?"
10034010-129 = "지금 봤어, 나츠? 확실히 굉장히 뜬금없는 이야기긴 한가 보네."
10034010-130 = "다른 사람도 아니고 카즈사가 아이리에게 태클을……."
10034010-131 = "확실히 진귀한 광경임에는 틀림이 없어."
10034010-133 = "뜬금없는 이야기가 아니야! 들어봐, 우리 카페! 학원제에서 열 카페!"
10034010-134 = "이왕이면 특색을 가지는 게 좋지 않겠어? 그러니까 밴드 카페로 하자는 거지!!"
10034010-135 = "그냥 디저트 카페면 너무 평범하잖아! 디저트는 다른 동아리 카페에도 다 있을 테고!"
10034010-137 = "뭐……라고……?"
10034010-138 = "오~. 강경 발언~."
10034010-139 = "디저트 동아리가 디저트를 부정하는 말을……!?"
10034010-141 = "이러고 있을 시간이 없어! 모두에게 밴드 활동을 보여줄 자리는 학원제 오프닝뿐인데……."
10034010-142 = "그 테스트는 불과 2주 뒤거든! 당장 악기를 구하고 연습을 시작해도 모자랄 시간이야!"
10034010-143 = "모자라지!! 당연히 모자라지!! 그러니까 못 하는 거잖아!?"
10034010-144 = "으음……. 해보기도 전에 못 한다고 말하는 건 나쁜 버릇이라고 생각해……."
10034010-147 = "……? 내가 나쁜 거라고, 이게……?"
10034010-148 = "의외로 한 번 발진하면 막을 수 없었던 그녀~."
10034010-149 = "으음……. 이건 전혀 상상 못 한 문제인데……."
10034010-151 = "으, 으음……? 왜지? 다들 반응이……."
10034010-152 = "이상하다……. 다들 즐거워하며 함께 해줄 거라 생각했는데……."
10034010-153 = "어디서 뭘 어떻게 하면 그런 생각을……."
10034010-154 = "우선 진정하라니까……."
10034010-160 = "[ns12] \"아이리는 왜 밴드가 하고 싶은 거야?\"\n[ns13] \"뭔가 강하게 인상이라도 받은 거야?\""
10034010-163 = "네, 네……!? 저요……!?"
10034010-164 = "그, 그건……. 으음……. 왜냐면……. 그……."
10034010-165 = "저는……."
10034010-169 = "저는……. 그거라도 해야 할 것 같아서……."
10034010-170 = "[s] \"………….\""
10034010-174 = "[ns] \"…………?\""
10034010-175 = "……아니!"
10034010-180 = "아니아니아니아니아니-!! 아니!!!"
10034010-181 = "안 돼. 이건 안 돼! 아무리 아이리라도 안 되는 건 안 되는 거야!!"
10034010-182 = "갑자기 무슨 소리야!? 웬만하면 어울려 주겠지만 이번에는 도가 지나쳐! 뭔 나츠도 아니고!"
10034010-183 = "뭔 말만 나오면 나를 걸고……."
10034010-184 = "밴드라니!? 우리는 디저트 부잖아!"
10034010-185 = "그게 디저트랑 무슨 상관인데!? 디저트부의 이름을 달고 움직이려면, 최소한 디저트와의 상관관계라도 있어야 해!!"
10034010-187 = "요, 요시미 쨩……."
10034010-188 = "……뭐, 때로는 사실이 아픈 법이지."
10034010-189 = "나츠 쨩……."
10034010-190 = "……미안, 아이리."
10034010-191 = "카즈사 쨩마저……."
10034010-195 = "[ns14] \"확실히 요시미의 말 대로야.\"\n[ns15] \"아이리. 우선 숨을 좀 돌리자.\""
10034010-198 = "……선생님……."
10034010-202 = "그, 그럼……."
10034010-203 = "…………."
10034010-204 = "그, 그럼……. 디저트랑 관계가 있으면 되는 거죠……? 그런 이야기지……?"
10034010-206 = "……뭐?"
10034010-207 = "디저트와의……."
10034010-208 = "관계……?"
10034010-210 = "그, 그러잖아도. 이런 게 있어서……. 하나 주워 왔거든! 자!"
10034010-211 = "아니 '그러잖아도'라니, 누가 봐도 처음부터 준비한 느낌이잖……."
10034010-217 = "……? 이건……?"
10034010-218 = "뭐야. 학원제 오프닝 축하 공연 모집 포스터잖아? 이게 디저트랑 무슨 상관이……."
10034010-219 = "……아니, 잠깐. 요시미. 스톱."
10034010-220 = "……확인. 아래쪽에, '공연 참가 밴드 보상'."
10034010-221 = "……보상? 보상이 뭐길래……."
10034010-225 = "……어."
10034010-227 = "……헐."
10034010-228 = "이럴 수가……."
10034010-233 = "[ns16] \"……<프레데리카 셈라>?\"\n[ns17] \"뭔가 디저트의 이름인 거야?\""
10034010-236 = "네, 선생님. 말씀하신 대로에요! 이건 <프레데리카 셈라>라고 하는……."
10034010-237 = "……'셈라의 여왕'."
10034010-238 = "너무 맛있던 나머지, 옛날 어떤 나라의 여왕이 14개나 연속으로 먹다 쓰러졌다고 전해지는 전설적인 빵."
10034010-240 = "진품이겠지……? 여태 가게에서 본 건 전부 모조품이나 유사품이었잖아."
10034010-241 = "<트리니티 사육제>쯤 되는 행사에서, 그걸 주최하는 티파티가 모조품을 취급한다……? 상상하기 어려운 이야긴데."
10034010-242 = "……그럼 진짜 프레데리카 셈라라고……? 진짜로……?"
10034010-243 = "아니, 이러면 이야기가 다르지……. 완전히 다른 문제잖아, 이건."
10034010-244 = "아아. 다르지. 전제부터가 다르니까. 우리는 방과후 디저트부……."
10034010-248 = "……\"먹어보지 못한 디저트를 사냥하기 위해 살아가는 자들\"."
10034010-250 = "……헤헤."
10034010-251 = "요시미 쨩. 그리고 모두들……."
10034010-252 = "이제는 어때……? 지금은 어떤 거 같아?"
10034010-253 = "……테스트를 통과할 생각이 들어?"
10034010-260 = "[ns18] \"……뭐, 뭐죠?! 저기요?! 여러분!?\"\n[ns19] \"갑자기 진지한 얼굴로 다가왔다!?\""
10034010-263 = "……선생님."
10034010-265 = "밴드를 하자!"
