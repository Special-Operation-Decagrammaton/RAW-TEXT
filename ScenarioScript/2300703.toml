[translation]
2300703-1 = "범상치 않은 소녀"
2300703-2 = "(하나코가 말해준 장소로 향하니 굳게 문이 닫혀 있는 체육실 창고가 하나가 보였다.)"
2300703-3 = "(어쩌다가 이런 데에 혼자 갇혀버렸는지는 알 길이 없었지만……)"
2300703-4 = "(……?)"
2300703-5 = "(……창고 문이 잠겨 있지 않았다?)"
2300703-6 = "[s] 문을 열어본다."
2300703-8 = "(덜컹. 끼이익-.)"
2300703-10 = "체육실 창고"
2300703-11 = "(……?)"
2300703-12 = "아, 와주셨군요. 선생님. 여기예요."
2300703-13 = "[s] \"……하나코?\""
2300703-16 = "안녕하세요, 선생님. 우연이네요, 이렇게 뵙는 날도 다 오고."
2300703-17 = "[s] \"……\""
2300703-19 = "[s] \"?\""
2300703-20 = "덕분에 무사히 밖으로 나갈 수 있겠어요. 감사합니다."
2300703-21 = "[s] \"???\""
2300703-23 = "[s] \"???????????\""
2300703-24 = "후훗. 뭔가요, 그 얼굴은? 눈이 휘둥그레지셨네요?"
2300703-25 = "왠지 좀 당황하신 것 같은 표정인데…… 갑자기 움직임도 굳어버리시고……"
2300703-26 = "……후훗."
2300703-27 = "대체 지금 무슨 생각을 하고 계시기에……"
2300703-28 = "[s1] \"……왜, 왜 수영복?\"\n[s2] \"어쩌다 그런 차림으로……?\""
2300703-29 = "……네?"
2300703-30 = "……네?"
2300703-31 = "갑자기 그건 왜 물어보시는 건가요? 무슨 문제라도 있나요?"
2300703-32 = "이곳은 트리니티의 학교 체육실이잖아요?"
2300703-33 = "그리고 제가 입고 있는 건……"
2300703-34 = "학교에서 지정한, '체육실에서 입는 옷'들 중 하나…… 아닌가요? 혹시 틀린가요?"
2300703-35 = "전 그저 뭐 좀 가지러 왔다가, 우연찮게 창고에 갇혀버렸을 뿐이랍니다."
2300703-36 = "선생님께서 무슨 생각을 하고 계시는지는 몰라도…… 아마 그런 건 아니겠죠."
2300703-37 = "으음…… 정말 아닌가?"
2300703-38 = "후훗. ……어쩌면 맞을 지도?"
2300703-39 = "알 길이 없네요."
2300703-40 = "하긴. 알아보려면 먼저 선생님께서 무슨 생각을 하셨는지를 여쭤봐야 할 테죠."
2300703-41 = "그러니 알려 주시겠어요? 방금 무슨 생각으로 그렇게 여쭤 보신 건지?"
2300703-42 = "[s] \"……일단 교복으로 갈아입자.\""
2300703-43 = "어머나~. 정말로요? 정말 그렇게 시키시는 건가요? 지금 여기서요?"
2300703-44 = "선생님…… 그렇게 안 봤는데, 보기보다 훨씬 대담하시군요."
2300703-45 = "아무리 저라고는 해도, 이렇게 으슥한 장소에서 선생님이 보시는데 그런 건 좀……"
2300703-46 = "그치만 네. 알겠습니다. 선생님께서 원하신다면 해야 하는 것이 또한 학생의 의무."
2300703-47 = "지켜봐 주세요. 지금 여기서 저의……"
2300703-48 = "[s3] 서둘러 창고를 빠져나가려고 한다.\n[s4] \"부탁이니 이런 장난은 그만해……\""
2300703-49 = "후훗. 알겠어요. 농담이에요, 농담. 죄송해요. 반응이 너무 재밌어서 그만."
2300703-50 = "후훗. 알겠어요. 농담이에요, 농담. 죄송해요. 반응이 너무 재밌어서 그만."
2300703-51 = "장난은 그만두겠습니다. 그럼 잠시만 뒤로 돌아봐 주시겠어요? 금방 갈아입을 테니."
2300703-52 = "[s5] 돌아서서 기다린다.\n[s6] 돌아서서 눈을 감고 기다린다."
2300703-57 = "흐흥~흥~ 흐흠~ 으음~"
2300703-58 = "으응…… 생각보다는 끼어서 잘 안 벗어지네요. 선생님, 좀 도와주시겠어요?"
2300703-59 = "[s7] 대답하지 않는다."
2300703-60 = "후훗…… 알겠어요. 거의 다 했습니다."
2300703-62 = "자. 끝. 이제 다시 돌아보셔도 좋아요."
2300703-63 = "……선생님?"
2300703-66 = "자, 보세요. 제대로 입었죠?"
2300703-68 = "흐흥~흥~ 흐흠~ 으음~"
2300703-69 = "으응…… 생각보다는 끼어서 잘 안 벗어지네요. 선생님, 좀 도와주시겠어요?"
2300703-70 = "[s8] (대답하지 않는다.)"
2300703-71 = "후훗…… 알겠어요. 거의 다 했습니다."
2300703-73 = "자. 끝. 이제 다시 돌아보셔도 좋아요."
2300703-74 = "……선생님?"
2300703-76 = "자, 보세요. 제대로 입었죠?"
2300703-77 = "후훗. 덕분에 오늘도 즐거웠군요. 이제 그만 나가실까요?"
2300703-78 = "[s9] \"역시 장난 친 거였구나.\"\n[s10] \"어른을 놀리면 못 써.\""
2300703-79 = "네, 네. 죄송합니다. 선생님. 하지만 선생님께 도움을 받았다는 건 거짓말이 아닌걸요."
2300703-80 = "네, 네. 죄송합니다. 선생님. 하지만 선생님께 도움을 받았다는 건 거짓말이 아닌걸요."
2300703-81 = "선생님은 모르시겠지만……"
2300703-82 = "……저에게는 이런 환기도 중요하니까요."
2300703-83 = "……네?"
2300703-84 = "방금 무슨 말 했냐고요?"
2300703-85 = "후훗. 비밀이에요. 소녀의 비밀을 캐물으시다니, 에티켓이 없으시네요."
2300703-86 = "그럼 이제……"
2300703-87 = "음?"
2300703-88 = "(삐익! 삐이이익-!)"
2300703-90 = "거기 두 사람! 지금 여기서 뭐 하시는 겁니까? 여긴 지금 출입 금지에요!"
2300703-91 = "체육관 시설의 사용은 체육 스케쥴이 있거나, 따로 학생회의 허가를 받아야 합니다!"
2300703-92 = "그리고 거기 학생!"
2300703-93 = "어어…… 음? 지금 손에 든 그건?"
2300703-94 = "……네? 아아. 이거요?"
2300703-95 = "후훗. 그러네요. 이건……"
2300703-96 = "이건 제가 방금 막 벗은, 따끈따끈한 제 수영복인데……"
2300703-97 = "……"
2300703-98 = "……?"
2300703-100 = "[s] \"……?\""
2300703-103 = "……!!!!!!!!!!!!!"
2300703-105 = "(일단 최대속력으로 내달려 그곳을 빠져나왔다.)"
2300703-106 = "(이후 오해를 완전히 푸는 데에는 꽤 오랜 시간이 걸렸다.)"
