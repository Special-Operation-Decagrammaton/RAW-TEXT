[translation]
10010145-1 = "제14화;뿌린 대로 거두리라 4"
10010145-7 = "(…….)"
10010145-11 = "……아. 오셨군요, 선생님. 슬슬 오실 때가 됐을 거라 생각했는데……."
10010145-16 = "……그 얼굴을 보아하니, 일은 잘 해결된 모양이네요. 다행입니다……."
10010145-17 = "덕분에 저도 조금은 마음이 놓이는 기분이네요."
10010145-18 = "……네? 아. 저는 SNS 같은 거 잘 안 보니까요……. 뉴스 같은 건 신문이나 보는 정도고."
10010145-19 = "물론 신문에서는 딱히 기사로 만들지 않았어요. 뭐, 그래야 하는 내용이었겠죠. 아마도……."
10010145-20 = "어쨌든 뭐, 잘 된 거겠죠. ……사실 가뜩이나 그것 때문에 좀 열 받아 있던 상태였거든요."
10010145-21 = "……네? 왜 열이 받냐고요? 그야 당연하잖아요."
10010145-22 = "그 긴 시간 동안……. 소중한 제 시간인데……."
10010145-23 = "그걸 제가 해결할 수도 없고, 저랑 관계도 없는 남 걱정하느라 버리고 있었으니까요."
10010145-24 = "지금처럼 그나마 일이 잘 해결된 거라면 그나마 다행이지, 만에 하나 안 좋은 쪽으로 흘러 갔다면……."
10010145-25 = "으으……. 역시 싫어요. 왜 바깥사람들이랑 엮이고 싶지 않았는지 다시 기억났어요."
10010145-26 = "하나하나 봐줘야 하고, 금방 이상한 짓하고……. 걱정시키고……."
10010145-27 = "제 생각이나 기분 따위는 아랑곳않고 자기들 맘대로……. 신경 쓰여 잠 못 자게하고……."
10010145-28 = "……으음. 뭐라는 거지, 난……. 또 선생님 앞에서 괜한 소릴……."
10010145-29 = "죄송해요. 아무튼 그래요. 신경 쓰실 필요는 없는 이야기였네요."
10010145-30 = "……뭐……."
10010145-31 = "……역시 바깥은……. 싫네요."
10010145-32 = "[s1] \"우이는 상냥하네.\"\n[s2] \"우이는 책임감이 강하네.\""
10010145-33 = "으으……. 이상한 소리 하지 마세요……. 정말……."
10010145-34 = "으으……. 이상한 소리 하지 마세요……. 정말……."
10010145-35 = "아무튼 그 이야기는 여기까지 하도록 하고……."
10010145-39 = "……그, 그거……. 혹시……. 가져와 주셨나요……?"
10010145-40 = "[s3] \"물론이지. 여기.\"\n[s4] 가지고 온 것을 건네준다."
10010145-41 = "……흐……. 흐흐……."
10010145-42 = "……흐……. 흐흐……."
10010145-43 = "감사합니다……. 잘 마실게요……."
10010145-44 = "……네? 왜 이번에는 케이크가 아니라 레몬 스무디……냐고요?"
10010145-45 = "……음……."
10010145-46 = "뭐……. 이제 와서 고백 드리는 것이지만……."
10010145-47 = "사실 전 그다지 케이크처럼 단 거, 그리 즐겨 먹진 않아요. 어쩌다 한두 번씩 먹는 정도지……."
10010145-48 = "책상이랑 책도 더러워지잖아요. 뭐 읽을 때는……. 신 레몬 스무디가 딱이죠……."
10010145-49 = "아무리 추워도……. 얼어 죽어도 레몬 스무디……."
10010145-53 = "……그……."
10010145-54 = "……사실 그때 그건……. 그냥 제 심술이었어요. 죄송해요, 선생님."
10010145-55 = "……네?"
10010145-56 = "괜찮으시다고요? 그럼 다음부터 오실 때 레몬 스무디로 사 오시겠다고요?"
10010145-57 = "'다음부터'라는 말을 아주 당연하다는 듯이 꺼내시네요. 싫다는 건 아니지만……."
10010145-58 = "……후……."
10010145-59 = "역시……. 못 당하겠어요, 선생님께는……"
10010145-60 = "정말 계속 오실 거라면……. 결국 제가 손해 보는 장사니 사실대로 다시 말씀드릴 수밖에 없겠군요."
10010145-61 = "……좋아요. 그럼 저도 좀 더 선생님 한정으로……. 솔직하게 대해보도록 할게요……."
10010145-63 = "그냥……. 다음부터는 그냥 아이스 아메리카노로……."
10010145-64 = "사실 진짜로 제가 좋아하는 건……. 그쪽이니까요."
10010145-72 = "으으……. 역시 셔……. 못 마시겠어……."
10010145-73 = "처음부터 아이스 아메리카노로 부탁드렸다면 좋았을 것을……. 괜히 한번 꼬아서……."
10010145-77 = "……흠……. 그럼……."
10010145-78 = "선생님……. 출발한 지도 좀 되셨으니, 이제 슬슬 샬레에 도착하셨으려나……."
10010145-79 = "……슬슬 괜찮겠지."
10010145-80 = "만드느라 정신없을 땐……. 진득하게 읽을 겨를이 없었으니……."
10010145-85 = "후후……. 그 경전의 완벽한 복사본……. 몰래 만들어두느라 고생했지만……."
10010145-90 = "……."
10010145-91 = "비밀이 가득한 시스터후드 아가씨들……."
10010145-93 = "……이전부터 궁금했거든요. 저도 한번 읽어보도록 하겠습니다."
10010145-94 = "덜렁대는 수녀님과 고서관의 마술사"
