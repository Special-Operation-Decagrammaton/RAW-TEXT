[translation]
10018060-1 = "제6화;매진이라고요? 그럴 리가……"
10018060-2 = "(장을 보기 위해 냐오푸드에게 점령(?)된 상가 거리로 나왔다.)"
10018060-3 = "(겉보기엔 아무 특징도 없는, 평범한 거리였다.)"
10018060-8 = "거리가 참 활기차네요."
10018060-9 = "시기를 생각하면 그럴 수밖에 없겠지만요."
10018060-10 = "왠지…… 두근두근거려요!"
10018060-11 = "[s] \"주리가 고생이 많네.\""
10018060-12 = "고생은요. 급양부에선 매일같이 하는 일과인데요."
10018060-13 = "오히려 평소에 비하면 지금은 편한 데다 즐겁기까지 한걸요."
10018060-14 = "아! 그렇다고 급양부 일이 즐겁지 않다는 건 아니에요!"
10018060-15 = "선배의 솜씨를 보면 감탄이 나온달까, 넋을 잃고 바라보게 된달까……"
10018060-16 = "그걸 보고 있으면 저까지 행복해지는 거 있죠?"
10018060-17 = "그럼 좀 더 맛있는 급식을 만들어 달라구!"
10018060-18 = "여러 가지 짐작 가는 바가 있기는 하지만……"
10018060-19 = "그런 항의가 종종 나오는 것도 사실이죠★"
10018060-20 = "우우……"
10018060-21 = "그렇네요. 사실 그게 급양부가 진짜 해야 할 일이긴 한데……"
10018060-22 = "[s] \"이즈미와 아카리도, 도와줘서 고마워.\""
10018060-23 = "응! 이런 거 좋아하거든! 맛있는 것도 볼 수 있고!"
10018060-24 = "하지만 역시 직접 먹어 보고 싶은데…… 꿀꺽……"
10018060-25 = "조금, 주리 씨에게만 좋은 장면을 양보하기가 살짝 싫었달까요★"
10018060-26 = "아무튼 사람 손은 많으면 많을수록 좋을 테니, 너무 부담 갖지 말아 주세요. 선생님?"
10018060-27 = "[s] \"잘 모르겠지만…… 너희들이 그렇다면야.\""
10018060-29 = "그러면 본격적으로 장을 보도록 하죠!"
10018060-30 = "저희의 목표는 전반적으로 조금 아쉬운 식재료들 중에서, 최대한 좋은 걸 고르는 거예요!"
10018060-35 = "와! 여기 양배추가 괜찮아 보이네요."
10018060-39 = "갈색으로 변한 부분도 거의 없고, 눌렀을 때 단단하니 속이 잘 여문 것 같아요. 모양도 예쁘고요."
10018060-40 = "실례합니다. 이 양배추들을 사고 싶은데요."
10018060-41 = "아, 그거. 미안하네. 조금 전에 다 팔렸어."
10018060-42 = "네? 팔렸다기엔 이렇게 상품들이 진열되어 있는데……"
10018060-43 = "선입금이 들어왔거든. 면목이 없구만……"
10018060-44 = "그, 그럼 남는 거라도…… 없을까요?"
10018060-45 = "지금은…… 없어. 있어도 팔지 말라는 말을 듣기도 했고."
10018060-46 = "정말 미안하게 됐어. 우리도 이러고 싶어서 이러는 건 아니라는 것만 알아줘……"
10018060-52 = "흐음……?"
10018060-53 = "그런 게 어디 있어!"
10018060-57 = "이번에는 고기를 사 보죠."
10018060-61 = "이 쪽 돼지고기가 괜찮아 보여요!"
10018060-62 = "색깔도 예쁜 선홍색이고, 지방도 흰색이에요. 고르게 분포되어 있기도 하고요."
10018060-63 = "오늘 장사는 이만 끝내려고 하는데, 무슨 일이지?"
10018060-64 = "네? 벌써요?"
10018060-65 = "오늘 준비한 고기들이 전부 팔렸거든."
10018060-66 = "혹시…… 누군가 선입금을 제시했다던가, 그러셨나요?"
10018060-67 = "그래…… 그 말 대로야. 참 찝찝하단 말이지. 지금껏 이런 일은 없었는데."
10018060-68 = "미안하네. 다음에 더 좋은 물건을 준비해 둘 테니, 오늘은 좀 봐 줬으면 해."
10018060-69 = "이거, 수상한 냄새가 나는군요."
10018060-72 = "간장과 맛술을 사야 하는데…… 느낌이 왠지 불길하네요."
10018060-73 = "조미료들은 보관 기간이 길어서 웬만해서는 전매되지 않겠지만……"
10018060-74 = "안녕하세요? 간장과 맛술 좀 알아보려는데요? 기름도요."
10018060-75 = "음…… 다음 번 물량이 들어오기 전까지, 가게를 쉴 생각입니다."
10018060-79 = "전부…… 팔렸나요?"
10018060-80 = "네. 죄송합니다."
10018060-85 = "한 번은 일어날 수 있는 일이고, 두 번은 우연. 하지만 세 번씩 똑같은 일이 일어난다면……?"
10018060-86 = "누군가 일부러 이런 일을 벌이고 다닌다는 거야? 그렇지만 왜?"
10018060-87 = "너무하잖아!"
10018060-88 = "[s] \"확실히 자연스러운 일은 아니네.\""
10018060-90 = "이, 일단! 다른 곳도 조금 더 돌아보도록 하죠!"
10018060-97 = "헛수고였어요……"
10018060-98 = "[s] \"거리 전체가…… 매진이라고?\""
10018060-99 = "전체는 아니었죠, 선생님. 쓸 만한 물건들만 정확히 팔려 나갔을 뿐."
10018060-100 = "말도 안 돼! 분명 우릴 방해하려는 거야! 도대체 왜?"
10018060-104 = "그건 너희가…… 눈에 거슬리기 때문이지."
10018060-109 = "[ns] \"누구지?\""
10018060-116 = "너희들, 너무 깊이 들어왔어."
10018060-117 = "아마 말을 안 들을 거라고 생각하지만, 제안 하나 하지."
10018060-118 = "여기서 손을 뗀다면, 우리도 더 이상 간섭하지 않겠어."
10018060-119 = "이미 답을 알고 있는 것 같지만, 그 제안을 우리가 받아들일 거라고 생각한 자신감은 뭐죠?"
10018060-120 = "솔직히, 서로 번거롭잖아. 우리가 이러는 것도, 너희가 그러는 것도."
10018060-121 = "그리고 나서 참새정을 멋대로 하려는 거지? 그건 안 돼!"
10018060-122 = "……이래 저래 그 가게가 문제란 말이지……"
10018060-123 = "뭐, 좋아."
10018060-124 = "이렇게 될 건 대충 예상했으니까. 나오라고."
10018060-131 = "어, 어? 이번 상대는 완전히 다른데?!"
10018060-132 = "믿는 구석이 있었단 이야기군요."
10018060-134 = "아니면 너희들이 상황을 이렇게 만들었거나."
10018060-138 = "각오해라. 이번은 좀 다를 테니까."
