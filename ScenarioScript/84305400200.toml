[translation]
84305400200-5 = "정말로 고생 많았어."
84305400200-6 = "고생 많았지. 답답하기 그지없는 누구들 덕분에 말이야."
84305400200-7 = "으, 으음……"
84305400200-9 = "후후, 그 부분은 드릴 말씀이 없네요."
84305400200-11 = "그럼 이제 상황은 끝난 거지? 더 일 없는 거 맞아?"
84305400200-12 = "그렇다고 할 수 있지. 핵심 인물들은 모두 붙잡았고, 일어났던 일들도 모두 수습 완료했으니까."
84305400200-13 = "그보다 두 사람은 우선 현장으로 돌아가 줘. 이대로 시간을 끌다간 내 존재가 다른 이들에게도 의심될지 몰라."
84305400200-14 = "선생은 그렇다 치더라도…… 나머지는, 아직 곤란하니까."
84305400200-15 = "예이, 예이. 가서 적당히 둘러대고 올 테니 조금만 기다리라고."
84305400200-20 = "리오. 그럼 당신은……"
84305400200-21 = "나는 돌아갈 짐을 싸기 시작할 거야. 이곳에 내가 있었다는 흔적은…… 아예 남기지 않을 생각이니까."
84305400200-25 = "그렇……습니까."
84305400200-26 = "……네."
84305400200-30 = "일단 다녀오겠습니다."
