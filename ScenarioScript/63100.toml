63100-349 = "미래는 어차피 모르는 거니까, 너무 나쁜 쪽으로만 생각하고 싶지는 않거든."
63100-350 = "그거야말로 막연한 낙관주의가 아닐까요?"
63100-351 = "그렇게 볼 수도 있겠지만, 나는 차라리 행동주의라고 생각하고 싶어. 아, 행동주의라는 단어의 정의는 사실 따로 있기는 하지만 말이야."
