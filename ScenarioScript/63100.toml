[translation]
63100-1 = "제10화;사라지지 않는 것들을 위한 에클레시아"
63100-5 = "[log]모의고사 당일.[/log]"
63100-9 = "어때?"
63100-10 = "음."
63100-11 = "아무런 근거도 없지만."
63100-12 = "왠지 다 잘될 것 같은 자신감이 솟구쳐 오르는군."
63100-13 = "정말로 아무 근거도 없지만 말이지."
63100-17 = "하나도 공부 안 했다는 소리잖아……."
63100-19 = "내가 생각해 보니까 말이야."
63100-20 = "어."
63100-21 = "교과서라는 건 학생을 잘 가르치기 위해 만들어진 책이잖아?"
63100-22 = "그렇지."
63100-23 = "그렇지만 내가 보기에 우리의 교과서는 실패했어."
63100-24 = "날 가르치는 데 실패했거든."
63100-25 = "와, 정말 처음 듣는 논리다……."
63100-26 = "아무튼 시험 잘 봐……."
63100-27 = "너도……."
63100-28 = "나보다 한 문제만 더 틀리고."
63100-29 = "저주를 해라, 저주를 해."
63100-34 = "[ns] \"다들! 공부는 잘했느냐!\""
63100-35 = "아, 선생님!"
63100-36 = "선생님……."
63100-37 = "어떻게 생각해도 시험을 망칠 것 같은 학생은, 어떻게 해야 할까요……."
63100-38 = "[s1] \"에이, 아직 시작도 안 했잖아.\"\n[s2] \"교실에 들어가서 책상에 앉으면, 그때부터 진짜 시작이라고!\"\n[s3] \"왜냐하면 그때는, 알고 있었던 것도 미묘하게 기억 안 나거든!\""
63100-42 = "와……. 진짜 기운이 나는 위로네요……."
63100-43 = "[s] \"아무튼, 다들 힘 내!\""
63100-44 = "네에……."
63100-49 = "안녕. 선생님. 좋은 아침이야. 직접 나와 준 거야?"
63100-50 = "……걱정도 팔자라니까……. 그렇게까지 안 해도 도망 안 쳐. 그동안 고생한 게 아까워서라도 말이지."
63100-55 = "음? 나는 선생이 순수하게 응원하자는 마음으로 와 준 것이라고 생각했다만……?"
63100-56 = "어……. 저는, 미사키 씨도 다 알고 있으면서, 일부러 그렇게 표현한 것이라고 생각해요오……."
63100-57 = "그, 그런가? 미안하다, 미사키."
63100-59 = "아니, 진짜 좀……!"
63100-60 = "하아…… 됐어."
63100-61 = "그러면 다녀올게, 선생님."
63100-62 = "최, 최선을 다하겠습니다아……."
63100-71 = "안녕하세요. 선생님."
63100-72 = "아, 안녕하세요. 선생님……. 오늘은 출근 안 하시나요?"
63100-73 = "[s4] \"오늘은 여기가 출근 장소란다…….\"\n[s5] \"그리고 오늘 업무는 시험 감독과 응원이지…….\""
63100-76 = "그, 그렇군요."
63100-80 = "아직도 아리우스 모의고사를 보는 것에, 저항감이 느껴지냐고요?"
63100-81 = "……."
63100-82 = "솔직하게, 없다고는 못 하겠네요."
63100-83 = "하지만…… 믿어 보기로 했습니다."
63100-84 = "다시 해 보자고 한 우리 [ruby=아리우스]아이들[/ruby]의 목소리와."
63100-85 = "……선생님을요."
63100-86 = "[s] \"고마워, 스바루.\""
63100-90 = "네, 네? 가, 갑자기 왜 그러세요?!"
63100-91 = "[s] \"나를 믿어 줘서.\""
63100-92 = "그, 그거야……."
63100-93 = "네? 선생님도 학생이 믿어 주지 않으면, 사실은 불안하고 흔들릴 수밖에 없다고요?"
63100-94 = "……."
63100-95 = "그건, 조금, 생각 못 한 대답이네요……."
63100-97 = "그러면 저도, 선생님께 도움이 되고 있는 건가요?!"
63100-98 = "[s] \"물론이지. 아이구, 기특해라.\""
63100-105 = "(마이아의 머리를 쓰다듬었다!)"
63100-106 = "헤헤……. 에헤헤……. 기분 좋네요……. 감사합니다. 선생님."
63100-111 = "……."
63100-112 = "저, 저도……."
63100-118 = "아, 선배! 시간이 됐나 봐요! 어서 가요!"
63100-119 = "어어?"
63100-120 = "네, 네에……."
63100-125 = "[ns] \"그러면 슬슬, 트리니티 쪽에서도 시험을 시작했으려나…….\""
63100-126 = "(어른이어서 유일하게 좋은 점이 있다면.)"
63100-127 = "(모의고사를 안 봐도 되는 것이 아닐까, 같은 실없는 생각을 하며.)"
63100-128 = "(근처 카페에 자리를 잡고, 원격으로 업무를 처리하며, 시험이 끝나는 시간을 기다리기로 했다.)"
63100-135 = "으아…… 진짜 이게 끝나기는 끝나는구나……."
63100-136 = "어땠어?"
63100-142 = "……."
63100-143 = "……."
63100-144 = "완전히, 망했어……."
63100-148 = "아, 아직 우리 채점도 안 해 봤잖아!"
63100-149 = "그, 느낌이라는 게 있잖아."
63100-151 = "……사실 나도 그래……."
63100-152 = "동지여……."
63100-157 = "[ns] \"어서 와라, 모두!\""
63100-159 = "선생님……."
63100-160 = "흐애앵…… 선생님……."
63100-161 = "아무리 생각해도, 시험 망쳤어요……!"
63100-162 = "[s6] \"그런 건 아무래도 좋아!\"\n[s7] \"시험 끝난 날에, 꼭 지켜야 하는 전통을 지키러 가야지!\""
63100-165 = "그게 뭐예요?"
63100-166 = "시험 끝난 날의 전통?"
63100-167 = "[s8] \"그건 바로……. '시험 뒤풀이'라는 거야!\"\n[s9] \"맛있는 걸 먹으면서 신나게 노는!\"\n[s10] \"반드시 지켜 나가야 할 전통이란다!\""
63100-174 = "그, 그런 멋진 전통이 있었다니……!"
63100-175 = "시험이라는 것도 의외로 괜찮을지도 모르겠네요!"
63100-177 = "아니, 그건 조금 다시 생각해 보자……. 준비하는 게 그렇게 힘들었는데……?"
63100-178 = "하지만 그건 과거잖아! 다시 말하면……!"
63100-179 = "끝난 고통은, 더 이상 고통이 아닌 것이다!"
63100-180 = "……!"
63100-181 = "그래. 그거야말로 아리우스식이지!"
63100-183 = "그렇지!"
63100-184 = "맛있는 거 사 주세요, 선생님!"
63100-185 = "[s11] \"좋아! 다들 불러와! 뒷일은 걱정하지 말고!\"\n[s12] \"……그래도 선생님 지갑이 아프니까, 아주 조금만 생각해 주고…….\""
63100-189 = "네!!!"
63100-195 = "(그렇게, 아이들의 첫 시험은.)"
63100-196 = "(화려했던 뒤풀이와 함께, 무사히 막을 내렸다…….)"
63100-208 = "안녕, 스바루. 그리고 마이아도. 어서 앉아."
63100-210 = "안녕하세요. 아츠코 씨."
63100-211 = "아, 안녕…… 하세요. 아츠코, 공주님……."
63100-213 = "후훗. 그렇지만 나는 더 이상 공주도 무엇도 아니니까, 그냥 편하게 불러 줘."
63100-214 = "우리, 편하게 부르기로 했잖아?"
63100-215 = "그, 그렇게 말하기는 했지만요! 그렇지만, 그렇지만……. 우우……."
63100-216 = "안녕, 하세요……. 아츠코, 씨……."
63100-217 = "응. 그걸로 충분해. 고마워."
63100-219 = "그런데 무슨 일인가요, 아츠코 씨."
63100-221 = "으음~ 시험도 잘 끝났잖아? 그러니까, '바깥'에서는 보통, 이렇게 한다고 들어서."
63100-222 = "자. 우선 먹자. 이 카페, 피칸 파이가 특히 유명하대."
63100-223 = "네, 네에…… 잘 먹겠습니다……. 감사해요……."
63100-224 = "그래서, 둘 다 다 시험은 잘 봤어? 나는 아는 부분은 전부 후회 없이 풀었다는 느낌이었어."
63100-225 = "저도 아는 건 다 풀었어요!"
63100-226 = "아는 것보다 모르는 게 더 많았다는 문제가 있었지만요……."
63100-227 = "스바루는?"
63100-229 = "……처음으로 모의고사를 푸는데, 3학년 문제는 조금 버거운 감이 있었어요……. 그 정도만 말해 두겠습니다."
63100-230 = "후후. 그렇지만 모의고사니까. 어디까지나 자신의 실력을 알아보는 척도 같은 거잖아?"
63100-231 = "별다른 페널티나 처분 같은 것도 없으니, 마음 편하게 결과를 받아 보면 될 거야."
63100-235 = "네……? 진짜 시험은 처분 같은 것도 있나요?!"
63100-236 = "음……. 결과가 너무 안 좋으면 보충수업을 실시하기도 하고."
63100-237 = "내내 성적이 안 좋으면……. 유급을 당하거나, 졸업을 못 하게 되는 경우도 있다고 해."
63100-238 = "아……. 그런 걸 처분이라고 하는군요. 네……."
63100-239 = "……응."
63100-240 = "어떤 의미로는, 상냥한 세계지."
63100-241 = "……."
63100-242 = "……."
63100-243 = "이제부터 스쿼드는 어떻게 할 생각인가요, 아츠코 씨?"
63100-244 = "역시 그 부분을 묻는구나. 응. 그게 당연하겠지."
63100-245 = "……."
63100-250 = "아리우스 스쿼드는, 결과적으로 쭉 방기하고 있던 거나 다름없었던, 아리우스에 대한 책임을 지려고 합니다."
63100-251 = "……어떤 식으로요?"
63100-252 = "아리우스 스쿼드는, 다음 아리우스의 학생회가 선출되고 결정될 때까지, 임시 학생회로서 기능하고자 합니다."
63100-257 = "아리우스 스쿼드가…… 아리우스 학생회로요? 그럼, 그럼……."
63100-258 = "우리 학교도, 이제…… 다른 학교처럼……."
63100-259 = "정상화가 될 수 있는 건가요?! 수백 년 만에!?"
63100-260 = "그렇게 될 수 있도록, 최선을 다해 볼게."
63100-261 = "응. 아리우스의 임시 학생회장으로서."
63100-262 = "학생회장이요?!?!"
63100-263 = "자, 자. 목소리가 조금 커요. 마이아."
63100-264 = "아, 앗. 네. 죄송합니다."
63100-265 = "……사실, 아리우스의 얼마 안 되는 남겨진 전통대로라면, 당신 이외에 그 자리를 맡을 수 있는 사람이 없기도 하죠."
63100-266 = "알겠습니다. 그러면 다른 사람들은요?"
63100-267 = "아마도 미사키가 회계 일을 하게 될 거야."
63100-268 = "본인은 '……정말이지 끝까지 굴려 먹네. 알았어. 하면 되잖아, 하면…….'이라고 말했어."
63100-269 = "미사키어로 그건, '이왕 하게 되었으니 최선을 다할게.'라는 의미야."
63100-270 = "미사키어라니 대체 뭔가요……."
63100-271 = "으음~ 대충, 말하는 것을 절반 정도만 반대로 해석하면 되는 언어, 라고 할까? 본인에게 말하면 엄청나게 화를 내니까, 조심해 줘."
63100-272 = "하아……."
63100-273 = "그리고 사오리는 총무 겸 부회장."
63100-274 = "타당한 인선이군요."
63100-275 = "학교 운영 방침으로 다음과 같은 권고를 제안했는데, '모두 최대한 많은 아르바이트를 하자.'라고 하더라."
63100-276 = "아르바이트는 또 왜요?!"
63100-277 = "으음~ 사회의 많은 부분을 빠르게 배울 수 있고, 용돈도 벌 수 있으며, 아리우스를 부흥시키는 데 여러모로 도움이 될 테니까. 라고 하던데?"
63100-278 = "아, 계약서 사기에는 주의해야 하니까, 당분간 계약서를 작성하면 자기에게 보여 달라고 했어. 그런 부분은 부끄럽지만 이골이 났다면서."
63100-279 = "……그냥 자기가 경험한 거 그대로 하자는 거잖아요."
63100-280 = "후훗. 사람은 경험의 동물이니까. 거기에 또……"
63100-281 = "또?"
63100-282 = "……."
63100-286 = "음? 이 정도면 대략적인 방향성은 잡힌 것 같은데?"
63100-287 = "물론 이제부터 여러 동아리 신청이 들어올지도 모르고, 예산과 타당성에 맞춰 허가나 불허의 판단을 내리기도 해야겠지만……."
63100-288 = "그건 그때 가서 상황을 보며 진행하면 될 것 같고……."
63100-289 = "뭐라고? 그런 공적인 사항들이 아니라, 내 개인적인 욕심을 말해 줬으면 한다?"
63100-290 = "그, 그건 곤란하다. 아츠코. 이제 우리는 더 이상 우리 자신만 생각해서는 안 되는 위치이기도 하고……."
63100-291 = "학생회장으로서의 부탁이라고……?"
63100-292 = "……."
63100-293 = "그, 그렇다면. 이건 정말 아무래도 좋은 의견이라고 생각하고, 흘려 넘겨도 좋다만……"
63100-297 = "……우리도, 교복…… 같은 거, 만들어 보면 어떨까 한다……."
63100-298 = "예쁘고, 귀여우면 좋을 것 같기도 하고……."
63100-299 = "고마워, 삿 쨩. 그런 말이 듣고 싶었어."
63100-302 = "미안. 이건 조금 더 정리해서 이야기해 줄게."
63100-303 = "네? 네. 뭐, 좋습니다."
63100-304 = "그리고 히요리는……."
63100-305 = "……히요리는……."
63100-306 = "………서기?"
63100-307 = "말 그대로, 기록관으로서의 서기겠네요. 그건……."
63100-308 = "응…… 본인도 그걸 아는지, 처음에는 우애앵~ 하고 울었어."
63100-309 = "그리고 다시 정신을 차려서, 정말로 열심히 해 보겠다고 의욕을 불태웠지만."
63100-310 = "히요리가 의욕을 내는 건 좋은 일이니까. 나도 기뻤어."
63100-311 = "저, 저도 잘 모르겠지만 그냥 좋네요……. 히요리 씨, 친절하니까요……."
63100-312 = "네……. 뭐, 당신이 좋다면야……."
63100-313 = "아, 그리고 <니코메디아 트룹>에도 부탁하고 싶은 일이 있어."
63100-314 = "……우리에게요? 그건 또……?"
63100-315 = "아리우스의 선도부 역할을 맡아 주었으면 해."
63100-316 = "선도, 부요……?"
63100-317 = "응. 다른 학교의 치안이나 풍기, 질서를 담당하는, 자치 무력 기관이지."
63100-318 = "이것만큼은 스바루 씨 말고는, 누구에게도 부탁할 수 없다고 생각했어."
63100-319 = "……제가 거절하면요?"
63100-320 = "그럴 거야?"
63100-321 = "……."
63100-323 = "서, 선배……?"
63100-328 = "하아."
63100-329 = "능수능란하네요. 아츠코 씨."
63100-330 = "그런가? 하지만 학생회장인걸. 임시지만."
63100-331 = "네, 네. 그래야죠. 어떤 의미로는요……."
