221090-1 = "#title;제9화;미움 받을 용기"
221090-2 = "#na;(……그리고 다음 날.)"
221090-3 = "#na;(새미의 하선이 결정되었다는 이야기는 학생들의 입을 타고 오디세이아 학원 전체에 빠르게 퍼져나갔다.)"
221090-4 = "2;오디세이아 학생 A;01\n4;오디세이아 학생 B;01\n#2;h\n#4;h\n#2;a\n#4;a"
221090-5 = "2;오디세이아 학생 A;02;너, 그 소식 들었어? 새미를 결국 육지로 보내기로 결정이 되었대.\n#2;em;[?]"
221090-6 = "4;오디세이아 학생 B;04;뭐? 새미의 처우에 대해서는 아일랜드에서 아직 결론을 내리지 못했잖아?"
221090-7 = "2;오디세이아 학생 A;04;그게…… 얼마 전에 아일랜드에 총학생회장이 방문했었잖아."
221090-8 = "2;오디세이아 학생 A;05;그 때 총학생회장이 새미의 상태를 보고는, '육지에서 치료를 받게 하라'고 직접 지시를 했대."
221090-9 = "4;오디세이아 학생 B;06;총학생회장이 그런 사소한 것까지 일일히 지시를 한다고……?\n#4;em;[땀]"
221090-11 = "#na;(일부 학생들은 새미의 상태를 걱정하며 염려 섞인 반응을 보였지만……)"
221090-12 = "1;여객관리부 오디세이아 학생 D;01\n5;여객관리부 오디세이아 학생 C;01\n#1;h\n#5;h\n#1;a\n#5;a"
221090-13 = "5;여객관리부 오디세이아 학생 C;06;총학생회에서 그렇게 말할 정도라면, 새미의 상태가 생각보다 나쁜 모양이네.\n#5;em;[한숨]"
221090-14 = "1;여객관리부 오디세이아 학생 D;02;헤어지는 건 아쉽지만, 새미를 위한 일이라면 어쩔 수 없지."
221090-15 = "5;여객관리부 오디세이아 학생 C;99;이 기회에 제대로 된 치료를 받고 좀 더 건강해진다면……"
221090-17 = "#na;(또 다른 일부 학생들은 총학생회의 결정에 불만을 표하며, 작게 툴툴거렸다.)"
221090-18 = "2;트라이던트 오디세이아 학생 E;99\n4;트라이던트 오디세이아 학생 F;05\n#2;h\n#4;h\n#2;a\n#4;a"
221090-19 = "2;트라이던트 오디세이아 학생 E;02;총학생회장이 아무리 우수하다고 해도, 새미의 상태는 우리가 더 잘 안다고."
221090-20 = "4;트라이던트 오디세이아 학생 F;05;괜히 환경이 바뀌어서 새미가 스트레스를 받으면 어쩌려고 그러는 거야?"
221090-21 = "2;트라이던트 오디세이아 학생 E;05;총학생회의 결정이 언제나 이해가 가는 것만은 아니었지만, 이번 결정은 진짜 이해가 안 가네. 쳇……\n#2;em;[한숨]"
221090-23 = "#na;(하지만 노골적으로 총학생회장의 결정 자체에 반기를 드는 학생은 없었고. 이에 납득하든 납득하지 못하든, 학생들은 서서히 새미와의 이별을 준비했다.)"
