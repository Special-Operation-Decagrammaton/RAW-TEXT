[translation]
221090-1 = "제9화;미움 받을 용기"
221090-2 = "(……그리고 다음 날.)"
221090-3 = "(새미의 하선이 결정되었다는 이야기는 학생들의 입을 타고 오디세이아 학원 전체에 빠르게 퍼져나갔다.)"
221090-5 = "너, 그 소식 들었어? 새미를 결국 육지로 보내기로 결정이 되었대."
221090-6 = "뭐? 새미의 처우에 대해서는 아일랜드에서 아직 결론을 내리지 못했잖아?"
221090-7 = "그게…… 얼마 전에 아일랜드에 총학생회장이 방문했었잖아."
221090-8 = "그 때 총학생회장이 새미의 상태를 보고는, '육지에서 치료를 받게 하라'고 직접 지시를 했대."
221090-9 = "총학생회장이 그런 사소한 것까지 일일히 지시를 한다고……?"
221090-11 = "(일부 학생들은 새미의 상태를 걱정하며 염려 섞인 반응을 보였지만……)"
221090-13 = "총학생회에서 그렇게 말할 정도라면, 새미의 상태가 생각보다 나쁜 모양이네."
221090-14 = "헤어지는 건 아쉽지만, 새미를 위한 일이라면 어쩔 수 없지."
221090-15 = "이 기회에 제대로 된 치료를 받고 좀 더 건강해진다면……"
221090-17 = "(또 다른 일부 학생들은 총학생회의 결정에 불만을 표하며, 작게 툴툴거렸다.)"
221090-19 = "총학생회장이 아무리 우수하다고 해도, 새미의 상태는 우리가 더 잘 안다고."
221090-20 = "괜히 환경이 바뀌어서 새미가 스트레스를 받으면 어쩌려고 그러는 거야?"
221090-21 = "총학생회의 결정이 언제나 이해가 가는 것만은 아니었지만, 이번 결정은 진짜 이해가 안 가네. 쳇……"
221090-23 = "(하지만 노골적으로 총학생회장의 결정 자체에 반기를 드는 학생은 없었고. 이에 납득하든 납득하지 못하든, 학생들은 서서히 새미와의 이별을 준비했다.)"
221090-30 = "……저기, 이게 다 뭔가요?"
221090-31 = "기관부 학생들이 가져온 장난감 노끈 공이에요!"
221090-32 = "그게, 다들 새미가 떠나기 전에 직접 만든 공을 선물로 주고 싶다고 해서……"
221090-33 = "새미가 육지로 떠날 때 이 공도 같이 가져가면 안 될까요?"
221090-34 = "마음은 이해하지만…… 공이 컨테이너 하나 분량이잖아요."
221090-35 = "노끈 공으로 볼풀장이라도 만들 생각인가요?"
221090-36 = "나도 가져왔어!"
221090-37 = "……이건 또 뭔가요?"
221090-38 = "새미가 좋아하는 고등어와 삶은 닭가슴살로 스튜를 만들어 왔는데—"
221090-39 = "육지로 가면 못 먹을 것 같아서 잔뜩 만들어 왔거든."
221090-40 = "이거 내리기 전에 새미에게 먹일 수는 없을까?"
221090-41 = "아무리 좋아하는 음식이라지만…… 말통 한 가득 담아 오면 어쩌자는 건가요?"
221090-42 = "이만한 양은 고양이가 아니라 사자라도 다 못 먹는다고요!"
221090-44 = "(그리고, 어쩌면 당연하게도……)"
221090-48 = "새미에게 줄 선물을 준비하고 계셨나요?"
221090-49 = "초, 총학생회장님?!"
221090-50 = "멋진 선물들이네요. 새미의 육지 생활에 도움이 될 만한 물건이 있다면 부디 편히 전해주시길."
221090-51 = "어떤 물건이라 하더라도 새미를 돌보는 데 분명 큰 도움이 될 겁니다."
221090-56 = "……아니, 생각해 보니 이렇게나 장난감이 많이 필요하지는 않을 것 같네요."
221090-57 = "애초에 새미는 아끼는 장난감이 아니면 눈길도 주지 않고……"
221090-58 = "이 노끈 공은 다시 풀어서 선박 보수에나 쓰는 게 좋겠어요."
221090-59 = "그러게. 안 그래도 몸이 안 좋아서 배를 내리는 건데, 그 전에 과식을 해서 탈이라도 나면 큰일이니까."
221090-60 = "이건 가져가서 다른 요리에 쓰는 게 낫겠어."
221090-61 = "자, 잠깐만요. 다 필요없다는 말은 아니었는데——"
221090-69 = "……."
221090-75 = "으아아……"
221090-76 = "후후, 다들 새미를 진심으로 아끼고 있나 보네요."
221090-77 = "이 기대에 응할 수 있도록, 총학생회에서도 더욱 만반의 준비를 갖춰야겠어요."
221090-78 = "……네, 넵……."
221090-80 = "(오디세이아 학생들은 새미의 하선을 결정한 총학생회— 특히 그 중에서도 총학생회장을 향해 노골적인 원망의 시선을 보냈다.)"
221090-81 = "(하지만 총학생회장은 그 시선을 알아차리지 못한 것처럼, 시종일관 미소로 일관했다.)"
221090-85 = "(다시 해가 저물고, 오디세이아 학원에서 나와 샬레로 돌아가는 길에……)"
221090-89 = "샬레의 선생님께서 배에서 내리십니다!"
221090-90 = "[ns] \"저 알림은 아무리 들어도 익숙지 않단 말이지……\""
221090-93 = "여기서 또 뵙네요, [USERNAME] 선생님."
221090-94 = "[s1] \"……총학생회장?\"\n[s2] \"안녕. 좋은 저녁이야.\""
221090-97 = "네, 좋은 저녁입니다."
221090-98 = "서류 가방을 챙겨 나오신 걸 보니, 학원 업무를 마치고 샬레로 돌아가는 길이셨나요?"
221090-99 = "[s] \"응. 총학생회장도……?\""
221090-100 = "네. 오디세이아 학원에서의 일도 마무리되었으니, 이제 돌아가서 정규 업무를 처리해야지요."
221090-101 = "[s] \"고생이 많네……\""
221090-102 = "피차 마찬가지인 걸요."
221090-103 = "선생님께서도 샬레에 돌아가서 잔업을 처리하실 예정이시잖아요?"
221090-104 = "[s3] \"그건…… 그렇긴 하지만.\"\n[s4] \"역시 총학생회장 앞에서는 숨기질 못하겠네.\""
221090-107 = "샬레와 총학생회는 여러모로 업무를 공유하고 있으니까요."
221090-111 = "괜찮으시면 지하철 역까지는 함께 동행하지 않으시겠어요?"
221090-112 = "남들의 시선이 없는 곳에서 선생님과 가벼운 환담이라도 나누고 싶던 참이었고……"
221090-113 = "그리고 무엇보다 키보토스의 밤길은 연약한 선생님께서 혼자 걸으시기에는 너무나도 위험하니까요."
221090-114 = "[s] \"그렇게 생각만큼 약하지는 않거든?!\""
221090-115 = "후후, 농담이에요."
221090-120 = "[ns] \"……총학생회장도 농담을 할 줄 아는구나.\""
221090-121 = "물론이죠. 농담은 분위기를 환기하고 타인과의 거리를 좁히는데 큰 도움이 되니까요."
221090-122 = "여러 이해관계가 얽혀 있는 총학생회의 업무에서 적절한 화술은 꼭 갖추어야 할 필수적인 교양이랍니다."
221090-123 = "때로는 아무 생각 없어 보이는 무해한 사람을 연기해야 할 때도 있고……"
221090-124 = "……때로는 미움 받을 것을 알면서도 악인을 자처해야 할 때도 있으니까요."
221090-125 = "[s] \"……학생들의 시선을 눈치채고 있었구나.\""
221090-126 = "당연히 눈치 챘지요. #n어지간히 눈치가 없는 사람이 아니고서야, 누구든 알아차렸을 걸요?"
221090-127 = "새미가 떠나기를 바랐던 학생들도, 남기를 바랐던 학생들도. 저마다 풀지 못한 앙금이 아직 잔뜩 남아 있을테니까요."
221090-128 = "뒤통수에 내리 꽂히는 시선이 하도 따끔거려서, 모른체하는 것도 큰일이었답니다."
221090-129 = "[s5] \"누구든 미움 받길 바라진 않으니까.\"\n[s6] \"역시 이번 일은 내가 나섰어야 했는데……\""
221090-132 = "아뇨. 이건 모두가 신뢰하고 따르는 어른이신, 샬레의 선생님께서 맡아서는 절대로 안 되는 일이었습니다."
221090-133 = "미워하고 싶은 상대가 미워할 수 없는 상대라는 걸 깨닫는 순간, 억눌린 감정이 어디로 터져 나갈지도 모르거든요."
221090-134 = "오히려…… 저는 오디세이아 학생들에게 미움 받을 수 있어서 기쁜걸요?"
221090-138 = "제, 제가 그냥 이유 없이 미움받는 걸 좋아한다는 뜻은 아닙니다만."
221090-139 = "크흠."
221090-140 = "전에도 말씀드렸지만, 오디세이아의 학생들에게 저는 학원 밖에서 찾아온 불가해한 권위 그 자체입니다."
221090-141 = "그리고 오디세이아의 학생들은 다년간의 해양 활동으로 인해, 결과를 대신 책임져 주는— '권위'에 복종하는 데 익숙해져 있지요."
221090-142 = "생각하는 괴로움을 덜기 위해 판단을 타인에게 맡기고, 권위에 복종하는 삶."
221090-143 = "위험으로 가득 찬 항해 중에는 어쩔 수 없다 하더라도, 배가 정박하고 파도가 잦아들면 우리는 카펫 아래에 미루어 두었던 문제를 다시 마주해야 합니다."
221090-144 = "우리의 삶은 항해가 끝난 뒤에도 계속 이어질테니까요."
221090-145 = "그런데 권위에 억눌려 아무 말도 하지 못했던 오디세이아의 학생들이, 지금은 권위적인 총학생회장의 말에 의문을 갖고 불만을 내비치고 있습니다."
221090-146 = "이번에는 고양이의 처우와 관련된 문제이지만, 더 나아가 학원의 터부와 이를 강요하는 권위에도 의심의 시선을 보내게 된다면……"
221090-147 = "언젠가 오디세이아에 뿌리 깊게 박힌 관습을 개선하는 데 도움이 되지 않을까요?"
221090-148 = "[s] \"처음부터 이걸 노렸던 거야?\""
221090-149 = "……글쎄요."
221090-150 = "처음에는 사소한 호기심 때문에 시작한 일이었지만, 끝에는 어쩐지 조금 심술이 나서요."
221090-151 = "학원을 책임져야 할 함장이 역할에 묶여 스스로의 감정도 알아차리지 못하고 있으니."
221090-152 = "어째서인지 조금 답답한 기분이 들어서, 저도 모르게 등을 떠밀어 주고 말았네요."
221090-153 = "[s] \"성실한 사람일수록 일과 일상을 분리하는 게 쉽지 않으니까.\""
221090-157 = "[ns7] \"총학생회장은 어때?\"\n[ns8] \"스스로 역할에 묶여 있다는 생각이 들 때는 없어?\""
221090-160 = "저야 물론—"
221090-164 = "………"
221090-165 = "……생각해보니 저 역시도 제 역할 이외의 삶을 생각해 본적이 없는 것 같아요."
221090-166 = "매일 다양한 학생들의 삶을 마주하면서도, 총학생회장이 아닌 다른 학생으로 사는 제 모습은 도무지 떠올릴 수가 없네요."
221090-167 = "총학생회의 업무가 너무 바빠서 그런 걸까요?"
221090-168 = "[s9] \"꼭 언제나 지금의 삶을 고수할 필요는 없어.\"\n[s10] \"이 세상도, 미래도 너희의 바람대로 바꿀 수 있으니까.\""
221090-171 = "네. 세상은 끊임없이 변하고, 안온한 일상도 언젠가는 끝나는 법이니까요."
221090-172 = "사람의 삶도, 고양이의 삶도."
221090-173 = "어쩌면 제가 총학생회장으로 살지 않아도 괜찮은 키보토스가 언젠가는 찾아올지도 모르죠."
221090-174 = "그 때는 진지하게 제가 무얼 하고 싶을지 생각해볼게요."
221090-175 = "다만 지금은 일이 너무 많아서……"
221090-176 = "[s] \"응. 너무 서두를 필요는 없어.\""
221090-177 = "……선생님."
221090-182 = "혹시 언젠가, 제가 진심으로 하고 싶은 일이 따로 생긴다면."
221090-183 = "그 때는 선생님이 제 꿈을 응원해 주실 수 있나요?"
221090-184 = "[s11] \"물론이지.\"\n[s12] \"학생의 꿈을 응원하는 건 선생님의 책무니까.\""
221090-187 = "후후, 약속하신 거예요."
221090-192 = "아, 어느새 역에 도착했네요."
221090-193 = "그럼. 샬레까지 조심히 돌아가시길."
221090-194 = "아마 다음 번에 뵐 때는 새미를 하선 시킬 때겠네요."
221090-195 = "괴로운 상황이 될지도 모르겠지만, 그 때도 잘 부탁드리겠습니다."
221090-197 = "(총학생회장이 승강장으로 올라가는 모습을 지켜본 뒤, 샬레로 돌아왔다.)"
221090-199 = "다음화;선상의 추격전"
