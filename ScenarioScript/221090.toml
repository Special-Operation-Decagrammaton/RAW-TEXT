[translation]
221090-1 = "第9話;役割分担"
221090-2 = "（翌日――）"
221090-3 = "（サミーの下船が決まったという話は、すぐに学園中に広まった）"
221090-5 = "ねえ聞いた？サミーを下ろすことになった、って。"
221090-6 = "え？まだアイランドの結論って出てないよね？"
221090-7 = "ほら……この前、連邦生徒会長が来たじゃん？"
221090-8 = "あの時サミーの様子を見て、「陸地で治療させるように」って言ったらしいよ。"
221090-9 = "連邦生徒会長ってそんなことまで口出すの……？"
221090-11 = "（一部の生徒はサミーの容態を心配し――）"
221090-13 = "連邦生徒会長がそこまでするくらいだから、サミー、よっぽど悪いんじゃない？"
221090-14 = "離れ離れは寂しいけど……サミーのためだもんね。"
221090-15 = "ちゃんと見てもらって元気になればいいんだけど……。"
221090-17 = "（また一部の生徒は、連邦生徒会長の決定に不満を抱いていた）"
221090-19 = "いくら連邦生徒会長だからって横暴でしょ。#nサミーのことはうちらのほうが詳しいのに。"
221090-20 = "サミーだって、急に環境が変わったら絶対ストレスだよ！"
221090-21 = "てかさ、連邦生徒会長の決定って前から納得いかないことあったんだよね。#nこれまでのはまぁいいとしても、今回ばかりは我慢ならない。"
221090-23 = "（しかし、決定自体に逆らう生徒はいなかった。生徒はそれぞれ別れの準備を始めることにした）"
221090-30 = "……えっと、これは？"
221090-31 = "機関部が持ってきたおもちゃです！"
221090-32 = "サミーに手作りのボールをプレゼントしたいとのことで……。"
221090-33 = "どうにかこれも一緒に持っていけませんか？"
221090-34 = "気持ちは分かりますが、コンテナ1個分って……。"
221090-35 = "ボールプールでも作るつもりですか？"
221090-36 = "私も持ってきたよ！"
221090-37 = "……これは？"
221090-38 = "サバと蒸しささ身のシチュー！サミー、これ大好きだったから。"
221090-39 = "陸じゃそうそう食べられないだろうし、いっぱい作ってきたんだ。"
221090-40 = "まだ船にいるうちに食べさせたいんだけど……いい？"
221090-41 = "いや、好物だとしても多すぎですって。"
221090-42 = "こんな量、食べ切れないですよ！"
221090-44 = "（しかし――）"
221090-48 = "サミーへのプレゼントですか？"
221090-49 = "れ、れれれ、連邦生徒会長！？"
221090-50 = "ふふっ、どれも素敵ですね。#nぜひ渡してあげてください。陸でも寂しくないように。"
221090-51 = "きっとサミーも喜びますよ。"
221090-56 = "というか……こんなには要らないかも……。"
221090-57 = "そもそも、サミーはお気に入りのおもちゃしか興味ないし……。"
221090-58 = "このボールは解いて、紐は他のとこに使いますね。"
221090-59 = "……体調が悪くて船を下りるのに、食べ過ぎはよくないよね。"
221090-60 = "これは他の誰かに食べさせよっかな。"
221090-61 = "ま、待ってください！#n全部要らないなんて一言も――"
221090-69 = "……。"
221090-75 = "うあぁ……。"
221090-76 = "ふふ。#n皆さん、本当にサミーのことを大切に思っているのですね。"
221090-77 = "その気持ちを裏切らぬよう、連邦生徒会も受け入れ準備に励まなくては。"
221090-78 = "……は、はいぃ。"
221090-80 = "（オデュッセイアの生徒は、連邦生徒会長に不満げな視線を向けた）"
221090-81 = "（それでも連邦生徒会長は、ただ笑顔を貫いていた）"
221090-85 = "（日が暮れ、オデュッセイアからシャーレに帰ろうとした時――）"
221090-89 = "シャーレの先生が下船されます！"
221090-90 = "[ns] \"この放送は何度聞いても慣れないなぁ……。\""
221090-93 = "またお会いしましたね、[USERNAME]先生。"
221090-94 = "[s1] \"やあ。\"\n[s2] \"こんばんは。\""
221090-97 = "こんばんは。遅くまでお疲れ様です。"
221090-98 = "シャーレにお戻りですか？"
221090-99 = "[s] \"うん。そっちも帰るところ？\""
221090-100 = "ええ。オデュッセイアでの仕事も落ち着きましたし、通常業務に取りかかろうかと。"
221090-101 = "[s] \"苦労が尽きないね……。\""
221090-102 = "ふふっ、お互い様ではありませんか。"
221090-103 = "先生もこれから残業なのでしょう？"
221090-104 = "[s3] \"それは……まあ。\"\n[s4] \"なんでもお見通しだね。\""
221090-107 = "シャーレと連邦生徒会は共有している業務も多いですから。"
221090-111 = "よければ、駅までご一緒しても？"
221090-112 = "ちょうど、お話したいこともありましたし――"
221090-113 = "キヴォトスの夜道は、先生が一人で歩くには危険すぎるかと。"
221090-114 = "[s] \"そこまで弱くはないよ！？\""
221090-115 = "ふふっ、冗談です。"
221090-120 = "[ns] \"……意外と、冗談も言うんだね。\""
221090-121 = "もちろんです。#n距離を縮めるのに効果的ですから。"
221090-122 = "多様な利害関係が絡む連邦生徒会の業務において、#n時と場合に応じたコミュニケーションの切り替えは必要不可欠です。"
221090-123 = "ぼんやりとした無害な人を演じる時もあれば――"
221090-124 = "嫌われるのを承知で、進んで悪人になる時もあります。"
221090-125 = "[s] \"……流石に気づいてるよね。\""
221090-126 = "よっぽど鈍い人でない限り、誰だって気づくと思いますよ？"
221090-127 = "今回の件、オデュッセイアの生徒は大なり小なり、わだかまりを抱えているでしょう。"
221090-128 = "あまりにも視線が冷たくて、鈍感を装うのも大変でした。"
221090-129 = "[s5] \"誰だって嫌われるのはつらいよね。\"\n[s6] \"やっぱり私が請け負うべきだったかな。\""
221090-132 = "いいえ。これはみんなが信頼す[ruby=シャーレの先生]る大人が[/ruby]引き受けてはならない事案です。"
221090-133 = "憎みたいのに憎めない。矛先を失った感情がどこへ爆発するかは分かりませんから。"
221090-134 = "なので私は、オデュッセイアの生徒から嫌われることができて嬉しいですよ？"
221090-138 = "……言葉足らずでした。補足が必要ですね。#nなにも、理由もなく嫌われることが好きという意味ではありません。"
221090-139 = "こほん。"
221090-140 = "前にも話しましたが、オデュッセイアの生徒にとって連邦生徒会長とは、#n学外から来た理不尽そのものです。"
221090-141 = "オデュッセイアの生徒は学園生活の多くを洋上で過ごすため、#n選択の責任を肩代わりしてくれる「権威」に服従することに慣れています。"
221090-142 = "権威に服従する暮らしとはすなわち、他人に判断を委ねて思考の苦しさを減らすこと。"
221090-143 = "危険が伴う航海では必要ですが、波が静まり、ひとたび港に船を泊めたのなら、#n各個人が、カーペットの下に隠していた問題と対峙しなければなりません。"
221090-144 = "私たちの暮らしは、航海を終えた後も続くのですから。"
221090-145 = "……それはさておき。#n権威への服従を良しとしてきたオデュッセイアの生徒が、#n連邦生徒会の長たる私に対して疑問を抱き、不満を示しています。"
221090-146 = "発端は猫の処遇に関する問題ですが、これがひいては学園の禁忌と、#nそれを強要する権威に疑いの目を向けるきっかけになれば――"
221090-147 = "オデュッセイアに根強く残る慣習を改善するのに、一役買うと思いませんか？"
221090-148 = "[s] \"最初からそれを狙ってたの？\""
221090-149 = "さあ？どうでしょう。#n小さな好奇心から始めたことですから。"
221090-150 = "――でも、少しイジワルをしたくなりまして。"
221090-151 = "責任を負うべき艦長が、その役割に縛られて己の感情に気づけていない。"
221090-152 = "どうにももどかしくて、つい背中を押してしまいました。"
221090-153 = "[s] \"誠実な人ほど、仕事とプライベートを分けるのが難しいからね。\""
221090-157 = "[ns7] \"そう思わない？\"\n[ns8] \"役割に縛られてるなって思う時ある？\""
221090-160 = "私はもちろん――"
221090-164 = "……。"
221090-165 = "……思えば、私も人のことを言えませんね。"
221090-166 = "日々生徒の暮らしを見ているはずなのに……#n連邦生徒会長ではなく、普通の生徒として送る日常は、まったく想像できません。"
221090-167 = "仕事が忙しすぎるせいでしょうか？"
221090-168 = "[s9] \"必ずしも今の暮らしにこだわる必要はないよ。\"\n[s10] \"未来は望み通りに変えられるからね。\""
221090-171 = "はい。#n世界は絶えず変化し、安穏たる日常もいずれは終わりを迎えるもの。"
221090-172 = "それは――人の暮らしも、猫の暮らしも。"
221090-173 = "もしかしたら、私が連邦生徒会長として過ごさなくても良いキヴォトスが、#nいつの日か訪れるかもしれませんね。"
221090-174 = "その時は……[ruby=・   ・   ・]自分の[/ruby]やりたいことを考えてみます。"
221090-175 = "ただ……今はあまりにも仕事が多すぎて……。"
221090-176 = "[s] \"まだまだ、急ぐ必要はないんじゃないかな。\""
221090-177 = "……先生。"
221090-182 = "[ruby=・   ・]私が[/ruby]心の底からやりたいことを見つけたら――"
221090-183 = "――応援してくれますか？"
221090-184 = "[s11] \"もちろん。\"\n[s12] \"それが、先生の務めだからね。\""
221090-187 = "ふふっ、約束ですよ。"
221090-192 = "もう駅ですね。"
221090-193 = "では、道中お気をつけて。"
221090-194 = "今度お会いするのは、サミーを下船させる日になるかと。"
221090-195 = "心苦しくはありますが、何卒よろしくお願いします。"
221090-197 = "（連邦生徒会長がホームに上がる姿を見届けてから、シャーレに戻った）"
221090-199 = "次回;船上の追いかけっこ"
