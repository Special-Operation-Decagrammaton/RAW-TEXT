[translation]
1006308-1 = "그편이 즐거우니까"
1006308-2 = "(무슨 일인지 궁금해 찾아 가니, 풀밭에 쭈그리고 앉아 있는 코유키를 발견했다.)"
1006308-4 = "(매우 진지한 얼굴로 풀밭을 내려다보고 있었다.)"
1006308-5 = "…………으음."
1006308-6 = "역시 없나……. 어떻게 보면 완전 데드엔드인데, 이거……. 으이씨……!!"
1006308-8 = "[ns1] \"코유키?\"\n[ns2] \"무슨 일이야?\""
1006308-11 = "……? 어? 선생님?"
1006308-15 = "아……. 연락 때문에 신경 쓰여서 오신 거예요? 진짜 별일 아닌데…… 니하하하……."
1006308-16 = "뭔가 안 그래도 최근 너무 자주 연락 드린 거 같아서요."
1006308-17 = "자꾸 이렇게 별것도 아닌 걸로 신경 쓰이게 해드리면, 나중에는 신경 안 쓰실까 봐 걱정이 좀……."
1006308-18 = "아. 그럴 일은 없을 거라고요? 니하……. 말씀만이라도 고맙습니다~."
1006308-19 = "네?"
1006308-20 = "그래서 뭘 하고 있었냐고요? 음……. 그, 그게 말이죠……."
1006308-24 = "갑자기 이런 말씀드리면 되게 이상하게 생각하실 거 같긴 한데……."
1006308-25 = "그……. 네잎클로버를…… 좀……? 손으로 찾고 있었다고 해야 하나?"
1006308-26 = "니하하하……. 조금 아날로그적이려나요? 여러 의미로……."
1006308-27 = "[s3] \"갑자기 네잎클로버?\"\n[s4] \"정말 예상 밖의 이야기네.\""
1006308-30 = "그, 그렇죠? 역시 그렇게 반응하실 거 같았거든요!"
1006308-31 = "이게, 그……. 그러니까 설명하면 되게 웃기는 이야기가 되는데요? 그래도 일단 말해 볼게요."
1006308-35 = "제가 그, 게임 할 때 운이 좀 없잖아요? 아니, 뭐 굳이 게임에 한정된 이야기는 아니지만……."
1006308-36 = "그래서 운이 좋아지려면 어떻게 해야 할까? 하다가 생각해 낸 게 이거거든요!"
1006308-37 = "행운의 상징하면 역시 네잎클로버! 네잎클로버를 얻으면 행운이 생길 거야! 라고."
1006308-38 = "근데, 그……. 여기엔 시작부터 하나의 큰 문제가 있는데."
1006308-39 = "……애초에 네잎클로버 자체가 행운의 상징이고 운이 좋은 사람들한테 나타난다……는……?"
1006308-44 = "니하하하……. 역시 그런 거겠죠? 애초에 운 없는 녀석이 그거 찾는다고 운이 생길 거였으면, 세상에 운 없는 사람이 어디 있겠어요?"
1006308-45 = "역설적으로 '운이 있는 사람의 징표'가 '운을 가져다주는 것'처럼 보이고 있는 것뿐이니까요."
1006308-46 = "운 없는 녀석한테는……. 애초에 나타나질 않는 거라는 거죠. 니하하……."
1006308-47 = "[s5] \"코유키는 미신을 믿는 쪽이야?\"\n[s6] \"운이라든가……. 믿는 쪽이야?\""
1006308-50 = "음……."
1006308-51 = "글쎄요. 어떨까요? 선생님이 보시기에는 그래 보이나요?"
1006308-52 = "사실 저도 제가 진짜 믿는지 아닌지 잘 몰라요! 진지하게 생각해 본 적도 별로 없고요!"
1006308-53 = "대부분의 경우에는 세상 일들이라는 게 그냥 딱딱 맞게 돌아가잖아요? 그게 맞으니까요! 원인과 결과니까요!"
1006308-54 = "문제가 있고, 풀면 풀리는 거고. 정답은 정해져 있고……. 늘 그런……. 어렵지 않은 일이죠."
1006308-55 = "……하지만……."
1006308-56 = "만약 그러니까 정말로, 선생님이 말씀하신 그런 것들이 없다……고 생각한다면……. 그건……."
1006308-57 = "조금……. 즐거움이 부족할 것 같으니까요……?"
1006308-58 = "……그래서 적어도 저는 믿고 싶은 쪽이에요!! 니하하하하하하!!!"
1006308-59 = "[s] \"…….\""
1006308-60 = "니하하하……. 어, 음. 뭔가 평소 같지 않은 넋두리를 늘어놓아 버렸다……."
1006308-61 = "[ns] \"……코유키.\""
1006308-63 = "[ns7] \"그대로 뒤를 돌아봐.\"\n[ns8] 마주보고 앉은 후 뒤를 가리킨다."
1006308-66 = "……응? 뒤요?"
1006308-72 = "뒤……? 어라?"
1006308-73 = "…………어?"
1006308-74 = "어어어어─어!!!!"
1006308-79 = "[wa:500]― 선생님! [wa:750]이거 봐요!! [wa:850]네잎클로버예요![wa:100]"
1006308-82 = "― 어떻게 된 거지!? [wa:1000]아까까진 없었는데!"
1006308-84 = "― 혹시……. [wa:1200]갑자기 생긴 건가?"
1006308-87 = "[wa:500]― 아니, [wa:1000]그건 말이 안 돼……."
1006308-89 = "― 못 본 건가……? [wa:2400]선생님은 언제 아셨어요?"
1006308-92 = "[wa:300]― 게다가, [wa:1600]어떻게 [wa:400]이렇게…….[wa:150]"
1006308-94 = "― 타이밍 좋게……. [wa:1000]찾았다니……!?"
1006308-97 = "[ns9] \"그렇게 믿고 싶었으니까.\"\n[ns10] \"그 편이 더 즐거우니까.\""
1006308-98 = "[wa:450]― ……!!!"
1006308-99 = "[wa:450]― ……!!!"
1006308-101 = "― ……과연……! [wa:1400]그러네요……!!"
1006308-104 = "[wa:1100]― ……네! [wa:1300]그렇게 생각하는 편이,[wa:1200] 분명…….[wa:100]"
1006308-106 = "― ……즐거울 테니까요!!"
1006308-111 = "(이후 코유키와 잡담으로 시간을 좀 더 보낸 후 샬레로 돌아왔다.)"
