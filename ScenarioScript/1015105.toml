[translation]
1015105-1 = "天才とお出かけ"
1015105-2 = "183号特別クラスの裏山"
1015105-4 = "先生！こちらです！"
1015105-5 = "雪原でのバーベキューパーティー、準備はいいですか？"
1015105-6 = "[s1] \"おおー、バーベキューマスターみたいだね！\"\n[s2] \"普段からよくやるの？\""
1015105-9 = "野外でのバーベキューですか？#nうーん、よくやると言えばそうなのですが……。"
1015105-10 = "実は……先日ガス爆発で183号のキッチンの壁が吹っ飛んでしまってから、#nずっと吹雪の中で調理と食事をしているんです。"
1015105-11 = "屋根や壁がないので、実質野外でバーベキューをしているようなものですね。"
1015105-15 = "まあ、そんな話は置いておきましょう！#n今日は先生とバーベキューパーティーがしたくてお誘いしたんですから！"
1015105-16 = "私にお任せください！"
1015105-17 = "[s] \"食器はどこにあるの？\""
1015105-18 = "ふふん。レッドウィンター……#nいや、キヴォトス最高の科学者である私がいれば心配ご無用！"
1015105-19 = "工具箱一つで全て解決。私の絶技をとくとご覧あれ！"
1015105-20 = "[s] \"おおー！\""
1015105-21 = "では始めますよ！"
1015105-27 = "実はここ、昔火力演習場だったんです。"
1015105-28 = "私が特別クラスに来るずっと前に使われなくなったそうですが、#n雪の下にはミサイルの破片や標的用の廃戦車の残骸などがあります。"
1015105-29 = "廃品ですが、良質な鋼鉄なので……#nバーベキューに必要なものは全部これで作れますよ！"
1015105-30 = "[s] \"すごいね！？全部作れるの？\""
1015105-31 = "もちろんです！大事なのはパワーではなくコツ。#n科学者ですから、頭を使って作ります。"
1015105-32 = "フライパンくらいなら、こうして話している間にパパッと完成！"
1015105-33 = "[s3] \"折り紙より早い！？\"\n[s4] \"作っていることにも気付かなかった！\""
1015105-36 = "えへへ。このくらい、お茶の子さいさいですよ！"
1015105-37 = "道具や力がなくても、コツさえ掴めば金属加工は簡単なんです！"
1015105-38 = "次は焼き網を作りますよ！#nここにある戦車のエンジングリルがちょうど良さそうですね。"
1015105-39 = "食べ物を焼いてもいいように衛生面を考えて加工するので、心配なさらず。"
1015105-45 = "ジャジャーン！バーベキューセット、完成！"
1015105-46 = "30分で作った割には、なかなかだと思いません？"
1015105-47 = "[s5] \"すごい！\"\n[s6] \"売り物だと言われても信じちゃいそう……。\""
1015105-50 = "ふふっ。先生に褒めてもらうのは、やっぱり格別ですね。"
1015105-51 = "心がこもっていて、グッとくるんです！#n先生は、褒める天才かもしれませんね。"
1015105-52 = "……で、では薪もオッケー！食器もオッケー！テーブルもオッケー！"
1015105-53 = "さあ先生、お肉を出してください！"
1015105-54 = "[s7] \"ん……？\"\n[s8] \"お肉って、私が準備することになってた……っけ……？\""
1015105-59 = "あ。"
1015105-60 = "え？"
1015105-61 = "あ、ああっ！？お願いするのを忘れてました！！"
1015105-64 = "ひぃん……。"
1015105-65 = "むしゃむしゃ……。"
1015105-66 = "先生……ジャーキー、もっと食べます？"
1015105-67 = "[s] \"ありがとう！もう十分かな。\""
1015105-68 = "「先生に材料をお願いすること」ってちゃんとリストに書いておいたのに。"
1015105-69 = "そのリストを書いたリストのチェックを忘れてしまいました……。"
1015105-70 = "ここまで来ていただいたのに、すみません。ジャーキーしかなくて……。"
1015105-71 = "[s9] \"アンナの頑張る姿を見られただけで満足だよ！\"\n[s10] \"アンナが喜ぶのを見ると、私も嬉しいし！\""
1015105-74 = "あ、ああっ……。"
1015105-75 = "……毎回こんなふうに褒められたら、悪い癖がついちゃうかもしれません。"
1015105-76 = "……。"
1015105-81 = "寒いですよね、先生。183号でストーブをつけますね。"
1015105-87 = "いつもありがとうございます。"
1015105-88 = "[s11] \"悪い癖がついてもいいよ。\"\n[s12] \"道を外れないように見守っているから。\""
1015105-91 = "え！"
1015105-95 = "……。"
1015105-96 = "独り言だったのに！先生に聞かれちゃってた！！ "
1015105-97 = "うあああ！！"
1015105-102 = "（アンナは雪原を走っているとは思えないほどの速さで走り去った）"
1015105-103 = "（幸い、アンナが残した足跡を辿り183号に戻ることができた）"
