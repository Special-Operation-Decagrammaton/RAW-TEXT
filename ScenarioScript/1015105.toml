1015105-50 = "4;안나;32;후후, 선생님 칭찬이 제가 살면서 들은 칭찬 중에 제일 좋은 거 아세요?\n#4;em;…"
1015105-51 = "4;안나;03;진심이 느껴진달지, 딱 제 취향이랄지! 선생님은 칭찬의 천재이실지도 몰라요."
1015105-52 = "4;안나;24;……그, 그럼 땔감 오케이! 각종 식기 오케이! 테이블도 오케이!"
