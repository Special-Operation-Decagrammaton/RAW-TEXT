[translation]
1015105-1 = "천재와 나들이를"
1015105-2 = "183호 특별반 뒷산"
1015105-4 = "선생님! 여기예요!"
1015105-5 = "설원 바비큐 파티, 준비 되셨나요?"
1015105-6 = "[s1] \"오오, 야외 바비큐 전문가 같아!\"\n[s2] \"이런 거 자주 해봤어?\""
1015105-9 = "야외 바비큐요? 으음, 익숙하다면 익숙하다고 해야 하나……."
1015105-10 = "가스폭발로 183호 주방 벽이 날아가 버려서 아직까지 눈보라 맞으면서 요리하고 식사하고 있어요."
1015105-11 = "따지고 보면 실내가 야외가 된 거니까, 야외 바비큐 유경험이라고 해도 되겠네요."
1015105-15 = "중요한 건 아니고요! 선생님하고 바비큐 파티를 해보고 싶어서 한번 제안해 본 거예요!"
1015105-16 = "제게 맡겨만 주세요!"
1015105-17 = "[s] \"식기라든지 다른 준비물은 어디 있니?\""
1015105-18 = "후후- 작게는 붉은겨울에서 어쩌면 키보토스 최고의 기계공학자인 제게는 필요 없는 걱정이랍니다!"
1015105-19 = "이 공구 상자 하나면 충분해요! 선생님께서는 이 전문가의 솜씨를 생생히 목격해 주시길!"
1015105-20 = "[s] \"오……!\""
1015105-21 = "그러면, 바로 시작해 볼게요!"
1015105-27 = "실은 여기, 오래된 화력시험장 부지예요."
1015105-28 = "제가 특별반에 오기 한참 전에 이미 쓰지 않게 되었다곤 하는데요, 눈 밑에 부서진 미사일 파편이나 표적용으로 세워둔 폐 전차 잔해 같은 게 있거든요."
1015105-29 = "폐품이어도 고품질 강철이다 보니, 이걸로 바비큐에 필요한 도구들을 만들 거예요!"
1015105-30 = "[s] \"대단한데?! 전부 만들 수 있는 거야?\""
1015105-31 = "그럼요~ 중요한 건 힘이 아니라 요령이고, 공학자는 증명된 요령을 사용하는 법이에요."
1015105-32 = "말하는 사이에 자아, 프라이팬 하나 뚝딱!"
1015105-33 = "[s3] \"종이접기보다 빠르다고?!\"\n[s4] \"만들고 있는 줄도 몰랐어!\""
1015105-36 = "역시 대단하죠! 그렇죠! 에헤헤-"
1015105-37 = "도구가 단순해도, 힘이 약해도 작용점만 잘 찾아내면 금속 가공은 쉬워요!"
1015105-38 = "다음은 석쇠 만드는 거 보여드릴게요! 여기 있는 전차 엔진 그릴이 딱 좋아 보이네요."
1015105-39 = "걱정 마세요, 식기용으로 사용할 수 있도록 위생적으로 가공하는 건 기본이니까요."
1015105-45 = "짜잔짠-! 바비큐 세트 완성!"
1015105-46 = "30분 만에 급조한 거 치곤 괜찮죠?"
1015105-47 = "[s5] \"파는 물건이라고 해도 믿겠는걸!\"\n[s6] \"멋있어 안나! 대단해 안나!\""
1015105-50 = "후후, 선생님 칭찬이 제가 살면서 들은 칭찬 중에 제일 좋은 거 아세요?"
1015105-51 = "진심이 느껴진달지, 딱 제 취향이랄지! 선생님은 칭찬의 천재이실지도 몰라요."
1015105-52 = "……그, 그럼 땔감 오케이! 각종 식기 오케이! 테이블도 오케이!"
1015105-53 = "자! 그러면 고기 주세요!"
1015105-54 = "[s7] \"응……?\"\n[s8] \"고기, 내가 챙겨오기로 했었…… 나……?\""
1015105-59 = "어,"
1015105-60 = "아?"
1015105-61 = "아, 아앗?!! 부탁드리는 걸 깜빡했어요!!"
1015105-64 = "히잉……."
1015105-65 = "질겅질겅……."
1015105-66 = "선생님, 육포 더 드릴까요?"
1015105-67 = "[s] \"충분해! 고마워, 안나!\""
1015105-68 = "분명 리스트에 '선생님께 바비큐 재료 부탁드리기'를 적어뒀었는데요,"
1015105-69 = "'모모톡 드리기 전에 리스트 체크해보기!'라고 적어둔 리스트를 깜빡했어요……."
1015105-70 = "여기까지 와주셨는데 죄송해요. 겨우 육포밖에 드릴 게 없어서……."
1015105-71 = "[s9] \"안나가 멋진 모습 보여준 거로 충분하단다!\"\n[s10] \"안나가 기뻐하는 모습을 봐서 좋았는걸!\""
1015105-74 = "아, 아앗……."
1015105-75 = "……매번 칭찬해 주시면 저, 버릇 나빠질지도 몰라요……."
1015105-76 = "……."
1015105-81 = "추우시죠 선생님. 183호에서 난로 틀어드릴게요."
1015105-87 = "항상 감사합니다."
1015105-88 = "[s11] \"버릇 나빠져도 괜찮아.\"\n[s12] \"어긋나지 않게 지켜봐 줄게.\""
1015105-91 = "네!"
1015105-95 = "……."
1015105-96 = "혼잣말한 건데!! 역시 들렸군요!!!"
1015105-97 = "으아아아!!"
1015105-102 = "(안나는 눈밭이라는 게 믿기지 않는 속도로 달려갔다.)"
1015105-103 = "(다행히, 안나가 남긴 눈 자국을 따라서 183호로 돌아갈 수 있었다.)"
