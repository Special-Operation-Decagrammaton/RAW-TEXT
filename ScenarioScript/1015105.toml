1015105-26 = "4;안나;03\n#4;greeting\n#4;h\n#wait;2000"
1015105-27 = "4;안나;24;실은 여기, 오래된 화력시험장 부지예요.\n#4;em;[반응]"
1015105-28 = "4;안나;32;제가 특별반에 오기 한참 전에 이미 쓰지 않게 되었다곤 하는데요, 눈 밑에 부서진 미사일 파편이나 표적용으로 세워둔 폐 전차 잔해 같은 게 있거든요."
1015105-29 = "4;안나;25;폐품이어도 고품질 강철이다 보니, 이걸로 바비큐에 필요한 도구들을 만들 거예요!\n#4;m3"
1015105-30 = "[s] \"대단한데?! 전부 만들 수 있는 거야?\""
1015105-31 = "4;안나;31;그럼요~ 중요한 건 힘이 아니라 요령이고, 공학자는 증명된 요령을 사용하는 법이에요.\n#4;em;[음표]"
1015105-32 = "4;안나;25;말하는 사이에 자아, 프라이팬 하나 뚝딱!"
1015105-33 = "[s3] \"종이접기보다 빠르다고?!\"\n[s4] \"만들고 있는 줄도 몰랐어!\""
1015105-36 = "4;안나;34;역시 대단하죠! 그렇죠! 에헤헤-\n#4;em;[한숨]"
1015105-37 = "4;안나;03;도구가 단순해도, 힘이 약해도 작용점만 잘 찾아내면 금속 가공은 쉬워요!"
1015105-38 = "4;안나;24;다음은 석쇠 만드는 거 보여드릴게요! 여기 있는 전차 엔진 그릴이 딱 좋아 보이네요.\n#4;jump"
1015105-39 = "4;안나;25;걱정 마세요, 식기용으로 사용할 수 있도록 위생적으로 가공하는 건 기본이니까요."
