1015105-1 = "#title;천재와 나들이를"
1015105-2 = "#place;183호 특별반 뒷산"
1015105-3 = "4;안나;02\n#4;em;[반응]\n#4;a\n#wait;1000"
1015105-4 = "4;안나;31;선생님! 여기예요!\n#4;em;[반짝]\n#4;hophop\n#4;m3"
1015105-5 = "4;안나;25;설원 바비큐 파티, 준비 되셨나요?"
1015105-6 = "[s1] \"오오, 야외 바비큐 전문가 같아!\"\n[s2] \"이런 거 자주 해봤어?\""
1015105-9 = "4;안나;02;야외 바비큐요? 으음, 익숙하다면 익숙하다고 해야 하나…….\n#4;em;[?]"
1015105-10 = "4;안나;99;가스폭발로 183호 주방 벽이 날아가 버려서 아직까지 눈보라 맞으면서 요리하고 식사하고 있어요."
1015105-11 = "4;안나;03;따지고 보면 실내가 야외가 된 거니까, 야외 바비큐 유경험이라고 해도 되겠네요."
1015105-12 = "#st;[0,0];instant;1;"
1015105-14 = "4;안나;02\n#4;em;[!]\n#4;h\n#wait;1000"
1015105-15 = "4;안나;27;중요한 건 아니고요! 선생님하고 바비큐 파티를 해보고 싶어서 한번 제안해 본 거예요!\n#4;hophop"
1015105-16 = "4;안나;03;제게 맡겨만 주세요!"
1015105-17 = "[s] \"식기라든지 다른 준비물은 어디 있니?\""
1015105-18 = "4;안나;34;후후- 작게는 붉은겨울에서 어쩌면 키보토스 최고의 기계공학자인 제게는 필요 없는 걱정이랍니다!\n#4;em;[반짝]"
1015105-19 = "4;안나;24;이 공구 상자 하나면 충분해요! 선생님께서는 이 전문가의 솜씨를 생생히 목격해 주시길!"
1015105-20 = "[s] \"오……!\""
1015105-21 = "4;안나;31;그러면, 바로 시작해 볼게요!\n#4;em;[반응]"
1015105-22 = "#st;[0,0];instant;1;"
1015105-24 = "4;안나;03\n#4;m2\n#wait;1500"
