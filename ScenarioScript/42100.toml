[translation]
42100-1 = "제10화;통제 불능"
42100-2 = "총학생회장 대행 집무실"
42100-5 = "후후, 오전 일과를 마치고 마시는 블루마운틴의 향기는 각별하군요."
42100-6 = "이 옅은 산미와 특유의 조화롭고 산뜻한 향은 원두를 높은 온도에서 충분히 가열한 뒤, 균일한 강도로 분쇄해야만 얻을 수 있는 풍미이지요."
42100-7 = "……사람을 다루는 것 또한 이와 마찬가지. 타는 것을 염려하여 불을 가져다 대기를 두려워한다면, 시고 떫은 잡다한 것들이 섞여 버리고 맙니다."
42100-9 = "지금은 변화에 적응하지 못해 곳곳에서 잡음이 들려오고 있지만, 시간이 지나면 키보토스의 시민들도 이해하게 될 겁니다."
42100-10 = "자유를 포기하고 통제에 몸을 맡기는 삶이 얼마나 달콤한 것인지를."
42100-12 = "……린 행정관의 지지 세력을 몰아내는 것부터, 처벌 조정을 대가로 카이저 코퍼레이션의 협력을 구하는 것까지. 모든 것이 계획대로 완벽하네요."
42100-13 = "이대로 차근차근 주변에 빚을 늘려가면 언젠가는 차기 총학생회장의 자리까지—"
42100-18 = "저, 카야 실장님— 아니, 총학생회장 대행님. 죄송합니다. 긴히 보고 드려야 할 일이 생겨서요."
42100-19 = "무슨 일인가요, 방위차장?"
42100-20 = "저는 총학생회장 대행의 업무를 수행하느라 바쁘니, 급한 일이 아니라면 나중에 연락하라고 말했을 텐데요."
42100-21 = "그게…… 죄송합니다. 평소에는 통괄실을 통해 보고 드렸던 업무인데요."
42100-22 = "현재 린 행정관께서 부재중이시라 직접 문의드리게 되었습니다."
42100-23 = "……그런 문제라면 어쩔 수 없지요. 무슨 문제인가요?"
42100-24 = "네. 다름이 아니라 금일 오전 11시 호쿠로쿠 중앙선에서 지폐를 수송하던 현금 수송열차가 무장 강도에게 납치당해 행방이 묘연한 상태입니다."
42100-25 = "평소 업무 프로세스대로라면 대행께서 직접 교통실에 연락하여 비상 열차 제어 시스템을 가동하고, 인근 자치구에 협조 요청을 해야 할 것 같은데요."
42100-26 = "네. 무장 강도에 의한 열차 납치 사건인가요."
42100-30 = "……열차 납치 사건?"
42100-31 = "어째서 이런 중요한 일을 이제서야 보고하는 건가요?"
42100-32 = "네, 네……?"
42100-33 = "하지만 열차 탈취야 키보토스에서는 매달 한두 번씩은 일어나는 일상적인 사건인 데다가……"
42100-34 = "실장님께서 오늘 오전에는 보고를 받지 않겠다고 엄포를 놓으셔서……"
42100-35 = "……일상적인 사건? 그럼 그동안 린 행정관은 매번 업무 틈틈이 이런 대처를 해왔다는 말인가요?"
42100-36 = "네, 그렇습니다."
42100-37 = "하아……"
42100-38 = "……일단은 알겠습니다. 교통실에는 제가 연락을 해 두겠습니다."
42100-39 = "방위차장은 발키리 경찰학교의 학생들과 공조하여 용의자를 특정하고, 범인을 놓치지 않도록 인근 역사를 봉쇄해 주세요."
42100-40 = "저 그게……"
42100-41 = "또 무슨 문제인가요?"
42100-43 = "이런 일을 전문적으로 처리해 왔던 공안국장과 공안국 학생들은 지난번의 명령 불복종 건으로 근신 중인 데다가……"
42100-44 = "오늘 고시된 신규 행정 명령으로 인해 경비국 학생들은 대부분 무기 검문을 하러 자리를 비워서, 강도 업무에 대응할 인력이 현재 남아있지 않습니다."
42100-46 = "비번 인력이든 생활안전국 학생이든 가능한 인력을 총동원해서라도 치안을 안정시키세요. 그게 당신의 임무 아닌가요?"
42100-47 = "자신의 책무도 다하지 못한 채, 새 내각에 흠집을 내는 모습을 계속 보인다면……"
42100-48 = "내각이 안정되었을 때 방위차장에게 어떤 새로운 역할이 맡겨질지 궁금하군요."
42100-49 = "조, 조속히 조치하겠습니다!"
42100-53 = "하아…… 대행의 업무가 이렇게나 귀찮은 자리였을 줄이야……"
42100-57 = "—교통실. 지금 자리에 있나요?"
42100-58 = "응? 카야 실장? 이 시간에 갑자기 무슨 일이야?"
42100-59 = "실장이 아니라, 총학생회장 대행입니다만."
42100-60 = "그거나 그거나…… 여하튼 무슨 일이야? 나 곧 있으면 점심 배달 올 거라, 이야기할 시간 없어."
42100-61 = "……지금 식사의 이야기를 할 때가 아닙니다."
42100-62 = "방위차장에게 들었는데, 호쿠로쿠 중앙선에서 현금 수송열차 한 대가 무장 강도에게 납치당해 행방을 찾을 수 없는 상태라 하는군요."
42100-63 = "교통실에서 비상 열차 제어 시스템을 가동하고, 역에 인원들을 파견하여 수색 업무에 협조해 주셨으면 합니다."
42100-64 = "으음……"
42100-65 = "……귀찮은데."
42100-66 = "네? 방금 뭐라고 하셨나요……?"
42100-67 = "그게, 열차 납치 사건이라면 어쩐지 금방 해결될 것 같지는 않아서 말이야."
42100-68 = "어차피 오래 걸릴 일인데, 점심 먹고 와서 느긋하게 처리할게."
42100-69 = "지금, 사태의 심각성을 이해하고 계신 건가요?"
42100-70 = "그렇게 해서 계속 게으름을 부린다면, 사보타주 혐의로 구속해도 할 말이 없을 텐데요."
42100-71 = "뭐, 원한다면 그렇게 해. 그럼 나야 일도 안 하고 좋지."
42100-72 = "다만 키보토스의 운행 도표를 부외자가 직접 관리하는 건 꽤나 골치 아픈 일일걸."
42100-73 = "지금 일하고 있는 교통실의 임원들을 모두 내쫓는다면 카야 실장부터가 아주 괴로워질 거야. 후후……"
42100-75 = "혹시 지금 저를 협박하는 거라면 당신은—"
42100-79 = "아, 음식 도착했다. 나중에 연락할게!"
42100-83 = "……"
42100-84 = "후우……"
42100-85 = "……이런 사소한 일로 화내서는 안 되지요, 카야."
42100-86 = "당신은 키보토스의 만인지상. 모두가 존경하는 차기 총학생회장이 될 사람이니까요."
42100-87 = "이성적으로 침착하게, 산적한 문제들을 하나하나 해결해 나가야……"
42100-91 = "이번에는 또 무슨 문제인가요?"
42100-92 = "……오늘따라 예민해 보이네, 총학생회장 대행."
42100-94 = "아…… 재무실장이었나요."
42100-95 = "아무것도 아니었습니다. 대행 업무의 첫날부터 곤란한 업무가 몰려들어서 조금 지친 것뿐이에요."
42100-96 = "재무실장은 상식적인 사람이니 저를 곤란하게 만들지는 않겠지요."
42100-97 = "음, 글쎄. 어떠려나."
42100-98 = "총학생회장 대행이 오늘 오전에 재무실에 제출한 '신규 행정 명령 개선으로 인한 추가 비용 청구서' 말인데."
42100-99 = "네, 새로운 내각을 위한 필수 비용이니 잘 부탁드리겠습니다."
42100-103 = "……전부 기각이야."
42100-105 = "네? 어째서인가요?"
42100-106 = "확인해보니 수기로 작성된 청구액 명세가 모두 아라비아 숫자로 쓰여 있던데."
42100-107 = "위조와 오독의 위험이 있기 때문에 갖은자로 쓰여 있지 않은 청구서는 처리할 수 없어."
42100-108 = "그리고 문서에 찍힌 날인도 번져서 이름을 정확히 읽을 수가 없어."
42100-109 = "이대로는 정식 인가자의 허가를 받았다는 증거로서 쓸 수 없으니까……"
42100-110 = "처음부터 다시 써서 제출해."
42100-111 = "저, 저기…… 아오이 실장……?"
42100-112 = "죄송하지만 제가 지금 공무로 매우 바쁜 상황이라서요."
42100-113 = "이번 한 번만 예외로 처리해 주시면 안 될까요? 이 문제에 대해서는 나중에 제가 보상을—"
42100-115 = "안 돼."
42100-116 = "총학생회장 대행이라도 예외는 없어. 린 행정관도 언제나 자기가 직접 수정했으니까."
42100-117 = "그런……"
42100-118 = "오늘까지 청구서를 수정하지 않으면 기각 처리해서 없었던 일로 할 거야."
42100-119 = "하지만 지금은……"
42100-124 = "……모레까지 제출하면 안 될까요?"
42100-125 = "내일까지. 그 이후에는 안 받을 거야."
42100-129 = "정말이지 이놈이고 저놈이고……!"
42100-130 = "제 주변에는 어째서 제대로 된 녀석이 하나도 없는 건가요?"
42100-131 = "인복이 나쁜 것도 유분수지……!"
42100-135 = "……무슨 문제라도 있나?"
42100-136 = "……아무것도 아니에요. 어차피 사람을 시켜 치우면 해결될 문제들뿐이니."
42100-137 = "다만 시킨 일도 제대로 처리하지 못하고 일을 키우는 부하들의 모습은 실망스럽기 그지없네요."
42100-138 = "정말 명령한 대로 움직여 주는 건 당신과 FOX 소대원들밖에 없다니까요."
42100-139 = "……명령대로 작전을 수행하는 게 우리의 일이니까."
42100-140 = "무기는 스스로 판단하지 않아야 그 가치가 있는 법이지."
42100-141 = "그래서 제가 당신을 좋아한다니까요. 후훗……"
42100-142 = "……그래서 말인데."
42100-143 = "SRT 학원은…… 언제쯤에야 부활시킬 수 있지?"
42100-148 = "……그게 지금 중요한가요?"
42100-149 = "지금 가장 중요한 건 행정위원회의 신임을 얻고 실권을 장악하는 일이에요."
42100-150 = "제가 총학생회를 좌지우지할 수 있게 된다면, 그깟 학교 따위는 10개라도 새로 세워 드릴 수 있으니까요."
42100-151 = "일의 순서를 헷갈리지 마세요, 유키노."
42100-155 = "……실례했군."
42100-156 = "너무 걱정 마세요. 당신들의 가치를 가장 잘 이해하고 있는 건 저뿐이니까요."
42100-157 = "당신은 그저 당신의 가치를 제일 잘 이해하고 있는 제 말을 따르면 되는 거예요."
42100-158 = "당신의 소대원들을 위해서, 그리고 당신의 후배들을 위해서."
42100-159 = "……확인."
42100-166 = "……총학생회장 대행, 큰일입니다!"
42100-167 = "……신기한 일을 너무 많이 겪어서 이제는 큰일이라고 해도 놀랍지 않네요."
42100-168 = "보고하시죠. 이번에는 또 무슨 일인가요?"
42100-169 = "그게……"
42100-170 = "인재자원실장이 부하들에게 습격당했습니다!"
42100-172 = "뭐, 뭐라고요……?!"
42100-174 = "(수 시간 전, 총학생회 건물 앞.)"
42100-178 = "다들 수고 많았어, 동지들!"
42100-179 = "총학생회장 대행이 유례없이 빠른 속도로 경질될 수 있었던 건, 여기 모인 노동자 동지들이 함께 소리 높여 부당함을 외쳐준 덕분이야!"
42100-180 = "와아!"
42100-181 = "그나저나 그 쪽한테는 미안해서 어쩌지? 모교의 동창이라고는 하지만 몇 날 며칠을 쉬지 않고 계속 시위만 했는데, 일당도 받지 않겠다니……"
42100-184 = "신경 쓰지 마. 불의에 맞서 투쟁하고 권력에 저항하는 건 노동자로서 당연한 일이니까."
42100-185 = "권력자를 규탄하는 시위라면 하루 종일이라도 할 수 있어!"
42100-186 = "후후, 그래. 역시 우리 '붉은겨울' 학원의 학생이라면 그래야지."
42100-187 = "……그나저나, 린 행정관은 정말로 실각된 건가?"
42100-188 = "응? 그야 물론이지."
42100-189 = "우리가 외친 대로 린 행정관은 최근 있었던 사고와 사건들에 대해 책임을 지고 물러났어."
42100-191 = "……그럼 지금 총학생회장 대행을 맡고 있는 사람은 누구지?"
42100-192 = "어, 일단은 시라누이 카야 방위실장이 후임으로 지목되긴 했는데……"
42100-194 = "그럼 지금부터—"
42100-198 = "카야 총학생회장 대행을 규탄한다!"
42100-199 = "규탄한다, 규탄한다!"
42100-200 = "자, 잠깐만……! 지금 무슨 소리를 하는 거야?"
42100-201 = "우리가 몰아내야 할 대상은 카야 대행이 아니라 린 행정관이라니까?"
42100-202 = "음, 그랬었지. 그녀가 물러나기 전까지는 말이지!"
42100-203 = "하지만 이제는 카야 방위실장이 이 키보토스를 대표하는 권력자가 되었으니……"
42100-204 = "그녀가 모든 문제의 책임을 지는 게 옳지 않은가!"
42100-205 = "책임져라! 책임져라!"
42100-206 = "잠깐만, 너희들 머리가 어떻게 된 거 아니야?"
42100-207 = "카야 실장은 오늘 막 대표가 되었다고! 그런데 갑자기 무슨 책임을 지라는 거야?"
42100-208 = "부하의 실수는 상관이 책임지는 법…… 그러므로 이 키보토스에서 일어나는 모든 문제의 책임은 총학생회장 대행인 시라누이 카야에게 있다!"
42100-209 = "키보토스에 주 3일 노동이 정착하지 못하는 것도, 최근 날씨가 지나치게 추운 것도, 우리가 푸딩을 두 개나 먹을 수 없는 것도— 모두 카야 대행의 탓이다!"
42100-210 = "맞아! 맞아!"
42100-212 = "아무거나 규탄한다! 이것저것 보장하라!"
42100-213 = "아무거나 규탄한다! 이것저것 보장하라!"
42100-215 = "이 무슨…… 제멋대로인 혁명가가 다 있어?"
42100-216 = "시위가 끝났으면 썩 물러나! 너희들의 역할은 다 끝났으니까!"
42100-217 = "보라, 동지들! 저 사악한 권력자의 개가 본색을 드러내는 모습을!"
42100-218 = "체리노 회장과 그 무리들과 다를 게 없잖아?"
42100-219 = "역시 이래서 공무원들과는 손을 잡을 수 없다니까!"
42100-220 = "우리는 이 땅에서 권력자들과 자본가들이 모두 사라지는 그날까지, 투쟁을 멈추지 않을 것이다!"
42100-225 = "자, 잠깐 가까이 오지 마!"
42100-226 = "그 이상 다가온다면…… 카야 실장님께 일러 너희들을 다 감옥에 처넣으라고 할 테니까—!"
42100-231 = "그런 시시한 협박은 붉은겨울 학원에서는 아침 인사로도 못 쓴다고."
42100-233 = "동지들! 투쟁의 준비는 모두 끝났겠지?"
42100-235 = "그럼 지금부터……"
42100-237 = "우리 붉은겨울 용역부는 새로운 투쟁을 시작한다!"
42100-238 = "와아아—!"
42100-240 = "다음화;블랙커피"
