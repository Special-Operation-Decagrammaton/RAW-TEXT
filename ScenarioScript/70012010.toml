[translation]
70012010-1 = "ON AIR: 게헨나 1"
70012010-5 = "부족해!"
70012010-6 = "뭐가?"
70012010-7 = "반짝거리는 거!"
70012010-8 = "제법 모호한 표현이네……"
70012010-9 = "하지만 우리는 반짝반짝부니까, 해석하자면 우리가 적극적으로 활동할 만한 일이 부족하다는 얘기겠지?"
70012010-10 = "역시 에리 쨩! 맞아, 맞아."
70012010-11 = "최근 뭔가 흥미로운 일들이 없었달까? 요즘 게헨나, 묘하게 조용한 것 같지 않아?"
70012010-12 = "요즘이라고 해봤자, 당장 저번주에도 동아리 본관이 폭발했었는데."
70012010-13 = "에이, 벌써 일주일이나 지난 일이잖아. 트렌드도 아니고, 벌써 복구됐는걸."
70012010-14 = "휴~ 아무튼 뭔가 좀 신나고 즐거운 일 없으려나."
70012010-15 = "키라라 쨩의 텐션을 올려줄 만한 일이 흔하진 않지."
70012010-19 = "오, 에리 쨩! 저기저기."
70012010-20 = "응? 뭐 있어?"
70012010-26 = "그러니까, 그냥 앉아서 아무 말이나 해도 된다니까요."
70012010-27 = "에, 귀찮은데."
70012010-28 = "다른 사람을 찾아봐. 나는 이만 카레 데우러 가봐야 해서."
70012010-32 = "하아, 귀찮다니."
70012010-33 = "……그건 맞지. 나도 귀찮아서 이렇게 사람을 구하고 있는 거니까……."
70012010-37 = "잠깐."
70012010-38 = "나, 지금 귀찮은 일을 피하기 위해 귀찮음을 감수하고 있는 거 아닌가?"
70012010-39 = "이렇게 되면 귀찮음 자체는 플러스 마이너스 제로……?"
70012010-40 = "……."
70012010-41 = "아냐. 더 생각하지 말자. 내 간만 상할 테니까……."
70012010-42 = "근데 진짜 어디 가서 대타를 구하지?"
70012010-43 = "대타 해줄 사람한테 줄 것도 딱히 없고…… 선물이라고 해봤자 마코토 선배의 친필 서명 따위인데, 갖고 싶어 하는 사람도 없을 테고……."
70012010-47 = "저기저기, 만마전의…… 이로하! 이로하 쨩 맞지? 무슨 일이야?"
70012010-48 = "뭔가 도움이 필요해 보이는데, 우리가 할 일이 있을까?"
70012010-49 = "그쪽은……."
70012010-50 = "……."
70012010-51 = "엇!"
70012010-52 = "적임자를 찾은 것 같군요."
70012010-54 = "얼마 전……"
70012010-55 = "키시싯, 그런 것이다."
70012010-56 = "갑자기 뭔가요. 아무 말도 안 하고 있었잖아요."
70012010-57 = "그냥 그런 느낌의 대사를 말하고 싶어졌다. 가끔 그럴 때가 있지 않나?"
70012010-58 = "기분이라는 건 네 생각보다 중요한 요소니까 말이다, 이로하."
70012010-59 = "네네, 그렇겠네요."
70012010-60 = "키시싯, 그러고 보니 우리 만마전이 주관하는 교내 방송 준비는 잘 되어 가고 있나?"
70012010-61 = "게헨나 여기저기서 이런저런 사연을 받아 읽어주는 코너도 생겼더군."
70012010-62 = "그러게요. 뭐, 잘 되고 있겠죠."
70012010-63 = "아, 근데 자꾸 마코토 선배의 자작 찬양 시 낭송 코너 같은 거 넣지 말라니까요. 쓸데없이 예산이 낭비되고 있다구요."
70012010-64 = "어차피 이 교내 방송, 제대로 듣는 사람도 거의 없잖아요."
70012010-65 = "역시 아직 부족하구나, 이로하. 그래서 좋은 것이다. 키시싯!"
70012010-66 = "대체 뭐가 좋은 건데요?"
70012010-67 = "관심도가 낮다는 것은, 뭐든지 마음대로 해도 된다는 뜻이지."
70012010-68 = "가령, 신규 책정된 예산안 따위를 교내 방송에서 슬쩍 언급해둔다면."
70012010-69 = "'선도부의 예산 삭감 조치는 이미 게헨나 공식적인 루트로 발표했다' 같은 식의 전개도 가능하다는 것이다. 킥킥킥."
70012010-70 = "완전 쫌생이스러운데다 하찮은 이유네요."
70012010-71 = "아무튼! 다수가 신경 쓰지 않는 것이 이 교내 방송의 좋은 포인트라는 이야기다."
70012010-76 = "보고입니다!"
70012010-77 = "교내 방송을 담당하던 학생이 갑작스럽게 사퇴했습니다!"
70012010-78 = "뭐라고!! 어째서?!"
70012010-79 = "모, 모르겠습니다! 다그쳐봤으나 멍한 표정으로 일신상의 사유라는 말만 반복할 뿐이라……."
70012010-80 = "현재 긴급하게 대체 인력을 구인 중이지만, 적절한 사람이 없어 난항을 겪고 있습니다!"
70012010-81 = "이런 예상외의 사태가……! !"
70012010-82 = "하아, 별수 없군요. 이번 방송은 펑크네요."
70012010-83 = "그건 안 될 말이다, 이로하!!"
70012010-84 = "예? 어차피 듣는 사람도 별로 없잖아요. 그게 좋은 거라면서요."
70012010-85 = "그 문제가 아니다-!!"
70012010-86 = "청취자가 적고 많고의 문제가 아니야! 방송 자체를 내보내지 않는 것은 다른 문제다!"
70012010-87 = "이는 곧 만마전, 더 나아가서는 이 몸의 위신에 관련된 중대 사항!!"
70012010-88 = "아무도 그렇게 생각하지 않겠지만요."
70012010-89 = "당장!! 대체할 인력을 구해오도록!!"
70012010-90 = "아니, 아까 이야기 못 들으셨냐고요. 어디서 그런 알맞은 인재를 구하겠어요? 뭔가 방송 경력이 있거나, 뭐라도 해본 적이 있어야……."
70012010-91 = "그건 모른다아-!! 설령 무경력자라도 상관없어!!"
70012010-92 = "단지 펑크만 나지 않도록 해라!!!"
70012010-93 = "억지 좀 그만 부려요!!!"
70012010-95 = "그, 그렇게 된 거구나……."
70012010-96 = "하아…… 네. 이제 아시겠지요. 아무런 의미도 없는 일을……."
70012010-97 = "재밌겠다~~!!"
70012010-98 = "……."
70012010-99 = "예??"
70012010-100 = "그치, 에리 쨩! 한번 해볼까? 어때, 어때?"
70012010-101 = "뭐, 아마추어라도 괜찮다면. 방송이라니, 좋은 경험이 될 것 같네."
70012010-102 = "정말요……?"
70012010-103 = "응!! 언제까지 준비하면 돼?!"
70012010-104 = "……일단 뭘 해도 상관없긴 한데요……."
70012010-105 = "그러니까, 두 분 진짜 진심인 거죠……?"
