90102030-82 = "3;유키노 비무장;06;아닙니다. 잠시 옛일을 떠올리느라."
90102030-83 = "3;유키노 비무장;01;그나저나 조사에 앞서 한 가지 여쭈고 싶은 점이 있습니다만."
90102030-84 = "3;유키노 비무장;02;이번 일이 D.U.에서 벌어진 사건임에도 불구하고, 발키리 공안국이 아닌 저희에게 추가 조사를 지시하신 이유는…… 단순히 이 사건이 SNS를 통해 화제가 되고 있기 때문입니까?\n#3;em;[반응]"
90102030-85 = "3;가짜 총학생회장;01;그 이유도 있지만, 가장 큰 문제는 이번 일이 '선로'에서 발생한 사건이라는 점입니다."
90102030-86 = "3;가짜 총학생회장;07;아시다시피 하이랜더 철도학원은 다른 학원처럼 자치구가 존재하진 않지만, 각 학원을 잇는 철로와 열차에 대해서는 독자적인 운영 권한을 갖고 있기에……"
90102030-87 = "3;가짜 총학생회장;08;하이랜더의 [ruby=Railway Safety Department]철도안전부[/ruby], 통칭 RSD는 전통적으로 발키리와 사이가 좋지 않습니다."
90102030-88 = "3;가짜 총학생회장;05;따라서 교통실에서도 인정하지 않는 의혹과 심증만으로 발키리의 학생들을 투입할 수는 없었습니다."
90102030-89 = "5;유키노 비무장;05;학원 간의 이해 관계가 얽혀 타 선도 조직과의 공조를 기대할 수 없는 상황이라.\n#5;al\n#3;m1"
