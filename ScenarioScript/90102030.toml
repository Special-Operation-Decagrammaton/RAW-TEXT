90102030-5 = "3;모모카;05\n#3;d\n#3;closeup\n#wait;1000"
90102030-6 = "3;가짜 총학생회장;01\n#3;a\n#wait;1000"
90102030-7 = "3;가짜 총학생회장;08;진정하세요, 모모카."
90102030-8 = "3;가짜 총학생회장;05;저 역시도 이해가 가지 않는 부분이 여럿 있습니다만, 일단은 목격자들 사이에서 동일한 증언이 계속되고 있으니까요."
90102030-9 = "3;가짜 총학생회장;03;그렇기에 모두가 신뢰하는 우수한 교통실장인 유라기 모모카 양의 의견을 기반으로 시민들을 설득하려는 것입니다."
90102030-10 = "1;모모카;06;끄응……\n#3;m5\n#1;em;[속상함]\n#1;ar"
90102030-11 = "3;가짜 총학생회장;02;다시 한번 구체적으로 말씀해 주세요, 모모카."
90102030-12 = "3;가짜 총학생회장;04;어째서 실종된 학생들이 탔다는 그 열차가 그 시간에는 들어올 수 없다는 건가요?"
90102030-13 = "1;모모카;16;하아. 그러니까 보고서에 적힌 내용에 의하면……\n#3;dr\n#1;m3\n#1;em;[한숨]"
90102030-14 = "1;모모카;01;지난주 금요일 오후 9시 7분, 카와니시 역 4번 승강장에 열차 시간표에 적힌 대로 급행 열차가 정시에 들어왔단 말이지.\n#1;greeting"
90102030-15 = "1;모모카;01;그리고 곧바로 원인을 알 수 없는 전자기 고장이 발생하여 3분간 CCTV가 멈추었고, 그 사이에 문제의 열차가 들어왔다가—"
90102030-16 = "1;모모카;02;이어서 9시 10분에 들어온 완행 열차가 다시 CCTV에 찍혔다는 거지?"
90102030-17 = "5;가짜 총학생회장;99;말씀하신 대로입니다.\n#1;m1\n#5;al"
90102030-18 = "1;모모카;01;혹시, 총학생회장은 열차가 역에서 얼마나 오래 정차하는지 알고 있어?"
90102030-19 = "5;가짜 총학생회장;04;글쎄요. 한 수십 초 정도 되지 않나요?\n#5;em;[?]"
90102030-20 = "1;모모카;02;D.U.의 철도 노선의 평균 정차 시간은 보통 30초에서 1분 정도야."
90102030-21 = "1;모모카;05;그러니까 그 문제의 열차가 그 두 열차 사이에 끼어들기 위해서는 1분도 안 되는 시간에 갑자기 선로를 바꾸었다는 소리가 되는 거야."
90102030-22 = "1;모모카;17;평균 시속을 계산해 보면, 선행 열차와 수백 미터도 떨어지지 않은 거리에서 열차를 추가 투입했다는 소리인데. 어떤 기관사가 그런 위험한 운행을 시도하겠어?\n#1;em;[땀]"
90102030-23 = "5;가짜 총학생회장;05;확실히. 평범한 차량이라면 모를까 거대한 열차가 갑자기 나타났다가 사라지기에는 터무니없이 짧은 시간이네요."
90102030-24 = "1;모모카;01;게다가 주변역의 CCTV에도 기록에 없는 열차가 지나가는 모습은 찍히지 않았어."
90102030-25 = "1;모모카;05;누군가가 열차를 통째로 들어서 철로에 올려 놓은 게 아니라면…… 교통실의 통제에서 벗어난 열차가 운행을 하는 건 불가능해.\n#1;em;[...]"
90102030-26 = "5;가짜 총학생회장;02;그렇네요. 모모카의 말을 들으니 실종된 학생들이 열차를 타고 사라졌을 가능성은 극히 낮아 보입니다."
90102030-27 = "5;가짜 총학생회장;99;감사합니다. 방금 해 주신 이야기를 바탕으로 대책을 정리해 보겠습니다."
90102030-28 = "1;모모카;06;나 참. 안 그래[ruby=주요 10개 학원 정상회의]도 S10 관[/ruby]련 일 때문에 바빠 죽겠는데, 이런 영양가 없는 괴담은 어째서 계속 퍼지는 거람?\n#1;em;[한숨]"
90102030-29 = "1;모모카;08;이왕이면 줄지 않는 명란맛 감자칩이 가득 담긴 자루라던가— 그런 괴담이 유행하면 더 좋을 텐데."
90102030-30 = "5;가짜 총학생회장;06;그러게요. 부디 행사 중에는 큰 문제가 생기지 않으면 좋을 텐데.\n#5;m3\n#1;dl"
90102030-31 = "5;가짜 총학생회장;02;여하튼 수고가 많네요, 모모카.\n#5;em;[반응]"
90102030-32 = "5;가짜 총학생회장;03;……행사가 무사히 끝나면 함께 기분 전환이라도 할 겸, 린 몰래 트리니티 근처에 디저트 투어라도 함께 가시지 않을래요?\n#fontsize;50"
90102030-33 = "3;모모카;11;나야 물론 찬성이지—\n#5;hide"
90102030-34 = "3;모모카;16;……그런데 몰래 우리끼리 나가도 괜찮은 거야?\n#3;em;[?]"
90102030-35 = "3;가짜 총학생회장;04;하지만 린은 이런 모임을 즐기진 않잖아요? 함께 가자고 해도 거절할 텐데."
90102030-36 = "3;모모카;16;하지만 린 선배…… 요즘 뭔가, 부쩍 외로워 보여서."
90102030-37 = "3;모모카;06;요새 일에 여유가 생겨서 그런가. 멍하니 앉아 있는 경우도 많고…… 어쩐지 우리를 피하는 것처럼 느껴지기도 해서."
90102030-38 = "3;가짜 총학생회장;07;그런가요……."
90102030-39 = "3;가짜 총학생회장;02;……그럼 돌아오는 길에 트리니티에서만 파는 특제 오믈렛 샌드위치를 하나 사올까요?\n#3;em;[전구]"
90102030-40 = "3;가짜 총학생회장;03;전에 린이 맛있게 먹는 모습을 본 기억이 있거든요."
90102030-41 = "1;모모카;20;역시 총학생회장은 선배의 취향을 잘 알고 있구나.\n#1;ar\n#3;m5"
90102030-42 = "1;모모카;03;뭐, 그 정도의 뇌물을 준비한다면 문제없겠지. 후후.\n#1;em;[음표]"
