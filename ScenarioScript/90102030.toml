90102030-73 = "3;가짜 총학생회장;07;네. 이미 지난 사건들만 두고 보더라도, 비현실적인 수단을 사용하는 괴수들이 시민을 수차례 습격하였고……\n#3;em;[반응]"
90102030-74 = "3;가짜 총학생회장;05;설령 지금 당장은 실체가 없는 소문에 불과하더라도, 시민들이 이를 진지하게 받아들임에 따라 괴담이 현실에 나타나는 경우도 있었으니까요."
90102030-75 = "3;가짜 총학생회장;04;특히 열차는 하루에도 수많은 시민이 이용하는 시설인 만큼, 사고가 발생할 경우 인명 피해가 걷잡을 수 없을 만큼 커질 수 있습니다."
