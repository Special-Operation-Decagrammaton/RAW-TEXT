[translation]
10040120-1 = "후일담;진실게임"
10040120-3 = "그래서……"
10040120-4 = "코유키 쨩과 마키 쨩이 여기에 있는 대량의 수상한 불량 음료를— 실례, 대량의 혼합 주스를 만들었다는 건가요?"
10040120-5 = "그렇다니까! 치히로 선배와 과자를 사러 편의점에 다녀오는 그새를 못 참고 이런 말썽을 피웠지 뭐야."
10040120-6 = "다른 장난이라면 몰라도, 이런 의미도 없는 음식 낭비를 무슨 생각으로 했는지 몰라."
10040120-7 = "……예? 낭비??"
10040120-8 = "다른 말은 몰라도 낭비라는 그 말은 흘려들을 수 없겠는데요!"
10040120-9 = "이건 단순한 장난이 아니라고요! 여러 가지 맛의 음료를 섞어 기존에 없었던 새로운 미식의 가능성을 시험해 보는—"
10040120-15 = "손이나 똑바로 들고 있어."
10040120-16 = "넵."
10040120-18 = "그래서 이 음료들은 다 어떻게 처리하실 예정인가요?"
10040120-19 = "아깝지만 어쩔 수 없지. 정리가 끝나는 대로 모두 버리는 수밖에."
10040120-24 = "유우카 쨩, 제게 좋은 생각이 하나 있는데요."
10040120-25 = "코유키 쨩과 마키 쨩이 만든 이 음료, 수상해 보이긴 해도 먹을 수 있는 음료만 섞어서 만든 것이니 몸에는 해롭지 않을 것 같은데……"
10040120-26 = "이 음료수를 벌칙 음료로 삼아 진실 게임을 해보는 건 어떨까요?"
10040120-27 = "진실 게임……?"
10040120-28 = "네. Truth or Dare, 상대의 질문에 진실과 벌칙 중 하나를 택하는 게임이에요."
10040120-29 = "진실을 답하지 못했을 때는 이 음료수를 벌칙 대신 마시면…… 음료도 낭비하지 않고 게임을 즐길 수 있을 것 같은데, 어떠신가요?"
10040120-30 = "그거 좋네요! 안 그래도 유우카 선배에게 묻고 싶은 비밀이 잔뜩—"
10040120-31 = "코유키."
10040120-32 = "넵."
10040120-33 = "하아…… 진실 게임을 하는 건 상관없지만, 이 음료를 게임에 쓰는 건 영 내키지가 않는걸."
10040120-34 = "반성의 의미도 퇴색될 것 같고, 입에 대고 싶지 않은 비주얼이기도 하고……"
10040120-36 = "하지만 사용할 수 있는 물건을 낭비하고 버리는 건 유우카가 제일 싫어하는 일이잖아요?"
10040120-37 = "코유키 쨩에게는 제가 나중에 시간을 들여서 '진지하게' 훈계할 테니 이번은 넘어가 주시는 게 어떨까요?"
10040120-38 = "어……. 그냥 유우카 선배에게 혼나면 안 될까요? 그게 더 좋을 것 같은데."
10040120-39 = "그건 안 돼요~"
10040120-40 = "하……. 여기까지인가……."
10040120-42 = "뭐, 그렇게 말한다면 어쩔 수 없지."
10040120-43 = "사실 파자마 파티에서의 진실 게임은 나도 꽤 흥미가 있었거든. 마침 선생님도 안 계시니 마음 편히 질문을 할 수 있을 테고……"
10040120-44 = "자, 그럼 모두 한자리에 모여 앉아 주시겠어요?"
10040120-45 = "규칙은 간단해요. 술래에게 지목당한 사람이 진실을 말하거나 벌칙 음료를 마시는 것을 택한 뒤, 다음 사람을 지목하면 됩니다."
10040120-46 = "그럼 첫 번째 술래는 제비뽑기로 정하죠!"
10040120-52 = "어라, 당첨인가."
10040120-53 = "네. 그럼 바로 아무나 한 사람을 지목하고 답하기 어려운 질문을 던져주세요."
10040120-54 = "답하기 어려운 질문이라……"
10040120-58 = "아까의 해킹을 보고 떠오른 건데…… 코유키."
10040120-59 = "네, 넷?!"
10040120-60 = "그동안 밀레니엄의 서버를 몇 번이나 해킹했었지? 최근의 서버 데이터에서 의심스러운 기록이 꽤 있었는데."
10040120-61 = "어…… 잘 모르겠는데요."
10040120-63 = "네. 벌칙 음료 원 샷."
10040120-65 = "예? 잠깐만요! 이건 거짓말이 아니잖아요? 정말로 기억에 없다고 솔직하게 말한 것뿐이라고요!"
10040120-66 = "필요한 자료가 있을 때마다 들어가서 확인했는데, 그걸 일일이 기억할 수 있을 리가—"
10040120-67 = "기억에 없을 정도로 자주 해킹했다……고?"
10040120-68 = "노아, 내일 오전에 코유키와의 면담 일정을 잡아줄 수 있을까. 서버 보안에 관해서 진지하게 묻고 싶은 게 떠올라서 말이야."
10040120-70 = "네. 바로 방음이 잘 되는 회의실을 하나 잡아두겠습니다."
10040120-71 = "아니, 사실대로 말하라면서요? 왜 벌칙이 추가되는 건데요!"
10040120-72 = "이건 진실 게임과 상관없는 코유키 쨩의 개인 벌칙이니까요."
10040120-73 = "자, 코유키 쨩. 이어서 다음 질문을 던질 상대를 지목해 주세요."
10040120-74 = "으으…… 그럼 노아, 선배!"
10040120-76 = "지금 입고 있는 속옷, 무슨 색이죠? 3초 내로 말하지 못하면 바로 벌칙 음료 원 샷—"
10040120-77 = "지금 입고 있는 건 레이스가 달린 흰색 속옷이에요. 착용감이 좋아서 좋아하는 속옷이랍니다."
10040120-78 = "즉답!? 뭐 좀 부끄러워하거나 딜레이 타임 같은 건 없는 건가요?"
10040120-79 = "어째서 노아가 그런 질문으로 부끄러워할 거라고 생각한 거야……"
10040120-80 = "그럼 이번에는 제 차례인가요……"
10040120-81 = "유우카 쨩~?"
10040120-82 = "뭐, 뭐야. 나한테 질문하는 거야?"
10040120-83 = "네, 전부터 늘 궁금했던 게 있었거든요."
10040120-87 = "유우카 쨩은…… [USERNAME] 선생님을 어떻게 생각하시나요?"
10040120-94 = "가, 갑자기?!"
10040120-98 = "그, 그런 질문을 물어봐도 답하기는 곤란하고……"
10040120-99 = "물론 선생님을 싫어하진 않지만, 이렇게 많은 사람들 앞에서 말하는 건 조금……"
10040120-100 = "네. 그럼 대신 벌칙 음료입니다!"
10040120-101 = "으으…… 어쩔 수 없지."
10040120-106 = "이게 무슨 맛이람? 쓰고 시큼하면서 식감은 엄청 끈적거리는 게…… 혀가 마비되는 느낌이야."
10040120-107 = "일부러 나를 지목하다니. 노아, 너 가만 안 둬!"
10040120-108 = "후후, 그저 게임일 뿐인데 너무 흥분하지 마세요."
10040120-109 = "자, 그럼 유우카 쨩? 다음 사람을 지목해 주세요."
10040120-110 = "마키, 가장 최근에 그래피티를 그린 장소가 어디야?"
10040120-111 = "그래피티? 가장 최근에 그린 그래피티라면 1주일 전에 발전소 북쪽 담벼락에 그린 커다란 번개 그림일 텐데—"
10040120-112 = "뭐?! 도서관에 남긴 그래피티가 마지막이 아니었단 말이야?"
10040120-113 = "아차, 나도 모르게 실토를……!"
10040120-115 = "하아……."
10040120-120 = "(……이후, 진실 게임은 밤늦게까지 계속되었다.)"
10040120-121 = "(하지만 어째서인지……)"
10040120-123 = "유우카 선배, 지난번 샬레 당번 때 새벽이 넘어서 돌아왔던데…… 선생님과 무슨 일이라도 있었던 거야?"
10040120-124 = "그, 그건…… 샬레의 일이니까 말할 수 없어!"
10040120-129 = "지난 주말에 코기 타운 앞에서 [USERNAME] 선생님과 나눈 이야기의 내용이 궁금합니다."
10040120-130 = "어, 어째서 그걸 알고 있는 거야?! 패스!"
10040120-135 = "유우카는 샬레의 영수증 처리를 할 때 선생님의 개인 영수증도 함께 처리해 주고 있다던데, 그게 사실이야?"
10040120-136 = "잠깐, 또 나야?"
10040120-141 = "유우카 선배!"
10040120-142 = "유우카."
10040120-143 = "유우카 쨩~"
10040120-148 = "왜 다들……"
10040120-149 = "나한테만 질문을 던지는 거야!"
10040120-151 = "(……대부분의 벌칙 음료는 유우카가 마시게 되었다.)"
