2601602-89 = ""
2601602-91 = ""
2601602-92 = "ปลาอาจิทอด... เหรอคะ?"
2601602-93 = "นี่ดูเหมือน... ทูน่า? เลยนะคะ..."
2601602-94 = "ฮะ... ฮ่าฮ่า!! ตอนนี้ร้านเรามีอีเวนต์อยู่น่ะครับ! เราเลยให้ทูน่าครีบน้ำเงินย่างแทนปลาอาจิโดยไม่คิดเงิน#nเพิ่มเลย!"
2601602-95 = "เป็นอีเวนต์พิเศษเฉพาะวันนี้เลยนะครับ คุณหนู!"
2601602-96 = "โอ้โฮ โอ้โฮ! แบบนี้สุดยอดจริงๆ เลยค่ะ!"
2601602-97 = "อืม... ร้านนี้ราคาก็เป็นมิตร แถมไม่ได้ให้น้อย แต่กลับให้เยอะจนพุงจะแตกด้วยซ้ำค่ะ"
2601602-98 = "หรือว่าเบาะแสจะผิดคะ? คนให้เบาะแสบอกชัดๆ ว่าเป็นร้านไร้จรรยาบรรณที่หลอกลวงลูกค้านี่นา?"
2601602-99 = "[s] \"ถ้าไม่ใช่ร้านที่เอาเปรียบลูกค้า ก็ดีแล้วไม่ใช่เหรอ?\""
2601602-100 = "จริงด้วยค่ะ! ต้องบอกว่าสุดยอดเลยด้วยซ้ำ!"
2601602-101 = "นี่เป็นสกู๊ปพิเศษจริงๆ ค่ะ! รอสักครู่นะคะ!"
