[translation]
2601602-1 = "假期一開始……"
2601602-2 = "嗯嗯嗯！綿延不絕的沙灘、無邊無際的水平線……"
2601602-3 = ""
2601602-4 = "是海呢！"
2601602-5 = "[s] 「因為……是海嘛？」"
2601602-6 = "這的確是理所當然的事實啦！"
2601602-7 = "不過，採訪就是要從累積事實開始嘛！"
2601602-8 = "嗅嗅嗅，有獨家新聞的味道呢！又鹹又腥，正是獨家新聞的味道！"
2601602-9 = "[s] 「獨家新聞本來就會有味道嗎？」"
2601602-10 = "是的！嗯，雖然不是全部都這樣啦……"
2601602-11 = "這次萬魔殿的特輯報導是「告發！黑心海岸大突襲！」！"
2601602-12 = "我們要潛入採訪那些利用遊客度假興奮心情的黑心業者，並公諸於世！"
2601602-13 = "既然已經收到好幾次爆料，肯定有問題吧！"
2601602-14 = "那麼，馬上出發吧！突擊！"
2601602-15 = ""
2601602-17 = ""
2601602-20 = ""
2601602-21 = "我再也不來了！價錢那麼貴，份量卻連一小把都不到！"
2601602-22 = "而且說是炸竹筴魚，誰看都知道是奇怪的雜魚吧！"
2601602-23 = "我要給1分評價！！全部都要告發！！"
2601602-24 = "愛寫什麼隨便你，誰會先看評價才來這裡啊？"
2601602-25 = "我們可以告你妨礙營業，你儘管試試看。"
2601602-26 = "嗚啊啊啊～根本是一群惡棍～！"
2601602-27 = ""
2601602-29 = ""
2601602-30 = "客人慢走～下次再來哦～！"
2601602-31 = "看他氣成那樣還以為會怎樣，結果真沒勁。"
2601602-32 = "就算他上網還是去哪裡發文，我們只做一季的生意，等傳聞傳開時早就收攤了。"
2601602-33 = "不過這樣也太過分了吧？#n居然把小指頭大的雜魚當成「特大炸竹筴魚」來賣。"
2601602-34 = "要靠一季賺的錢吃喝玩樂一整年，當然要先省成本啊！哈哈哈！！"
2601602-35 = "價目表不掛在店裡、只寫在菜單上，讓客人礙於面子不得不結帳，這招也超讚的！"
2601602-36 = "下一隻肥羊要從他身上撈多少呢～"
2601602-37 = ""
2601602-38 = ""
2601602-41 = ""
2601602-42 = "歡迎光臨！"
2601602-43 = "請入座！來來，這邊……"
2601602-44 = ""
2601602-46 = ""
2601602-47 = "哦～氣氛比爆料說的好很多嘛！"
2601602-48 = "！！！"
2601602-49 = "那，那個孩子是……！？"
2601602-50 = "怎麼了？有什麼問題？"
2601602-51 = "笨蛋！是這一行惡名昭彰的週刊萬魔殿記者啊！！"
2601602-52 = "這麼說來……！旁邊還有夏萊的老師！？"
2601602-53 = "聽說一旦被他盯上就跑不掉了！"
2601602-54 = "而且大部分的讀者都是格黑娜的學生……！"
2601602-55 = "確實，他進來的時候還自言自語說了「爆料」……"
2601602-56 = "那該怎麼辦！？"
2601602-57 = "不好意思～！請給我菜單～！"
2601602-58 = "好，好的～！馬上來！！"
2601602-59 = "先把菜單上的價格都擦掉一位數！！#n他一定會拿價格太貴來做文章的！！"
2601602-60 = "對，對啊～！！食物也別動手腳，反而多給一點來消除他的疑心！"
2601602-61 = "那麼，我要點這個！"
2601602-62 = "好，好的！那當然！"
2601602-63 = ""
2601602-65 = ""
2601602-66 = "唔嗯，至少價格沒有爆料說的那麼貴呢？說不定還可以接受？"
2601602-67 = "既然說份量很少，那就等餐點上來再驗證吧！"
2601602-68 = "那麼，先來準備……！"
2601602-69 = ""
2601602-71 = ""
2601602-72 = "[ns] 「千秋？那是什麼？」"
2601602-73 = "是捲尺和秤！光憑主觀是寫不出報導的！#n不然說不定又會被說是死氣沉沉的雜誌了！"
2601602-74 = "編輯生動的主觀有時比客觀更準確，但這次客觀事實才是重點！"
2601602-75 = "哼哼哼，連1g的誤差也不會放過哦～？"
2601602-77 = "！？"
2601602-78 = "他居然大剌剌地把秤拿到桌上了！？"
2601602-79 = "只要少給一點點，他就會拿這個找碴！"
2601602-80 = "潛入採訪不是應該把相機藏在包包裡……之類的嗎？"
2601602-81 = "怎麼辦？別說特大了，連普通大小的竹筴魚都沒有……"
2601602-82 = ""
2601602-84 = ""
2601602-85 = "對，對了！！"
2601602-87 = ""
2601602-88 = "您，您點的特大炸竹筴魚來了！"
2601602-89 = ""
2601602-91 = ""
2601602-92 = "炸……竹筴魚嗎？"
2601602-93 = "這個，看起來像是……鮪魚？"
2601602-94 = "哈，哈哈！！現在正在舉辦活動！用烤黑鮪魚代替竹筴魚招待您！"
2601602-95 = "這是只有今天才有的特別活動哦，小姐！"
2601602-96 = "原來如此原來如此！這確實很厲害呢！"
2601602-97 = "唔嗯……這裡價格實惠，份量不但不少，反而多到快撐破肚子了耶？"
2601602-98 = "難道是爆料有誤嗎？明明說是黑心詐騙業者的？"
2601602-99 = "[s] 「如果不是黑心店家，不是很好嗎？」"
2601602-100 = "說的也是！甚至該說很了不起呢！"
2601602-101 = "這絕對是獨家新聞！請稍等一下～！"
2601602-102 = ""
2601602-104 = ""
2601602-105 = ""
2601602-106 = ""
2601602-107 = ""
2601602-108 = ""
2601602-109 = "應該順利過關了吧？"
2601602-110 = "他看起來很滿意，應該不會被告發了……！"
2601602-111 = "今年這一季的生意總算可以平安度過……"
