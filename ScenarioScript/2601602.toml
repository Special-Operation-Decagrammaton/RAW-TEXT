[translation]
2601602-1 = "เมื่อวันหยุดเริ่มต้นขึ้น..."
2601602-2 = "อื้มๆๆ! ผืนทรายทอดยาวสุดสายตา เส้นขอบฟ้าทอดยาวไม่สิ้นสุด..."
2601602-3 = ""
2601602-4 = "นี่มันทะเลนี่คะ!"
2601602-5 = "[s] \"ก็... เรามาทะเลไง?\""
2601602-6 = "ก็จริงค่ะ ใครๆ ก็รู้อยู่แล้ว!"
2601602-7 = "แต่การทำข่าวต้องเริ่มจากรวบรวมข้อเท็จจริงทีละอย่างนี่คะ!"
2601602-8 = "ฟุดฟิด ฟุดฟิด ได้กลิ่นสกู๊ปพิเศษแล้วค่ะ! ทั้งเค็ม ทั้งคาว แบบนี้เป็นสกู๊ปพิเศษแน่นอนค่ะ!"
2601602-9 = "[s] \"ปกติสกู๊ปพิเศษมีกลิ่นด้วยเหรอ?\""
2601602-10 = "ค่ะ! แต่ก็ไม่ได้เป็นแบบนั้นทุกเรื่องหรอกนะคะ..."
2601602-11 = "ข่าวพิเศษของแพนเดโมเนียม โซไซตี้ครั้งนี้คือ <แฉ! บุกร้านค้าไร้จรรยาบรรณริมทะเล!> ค่ะ!"
2601602-12 = "ฉันจะแฝงตัวไปเก็บข้อมูลในร้านค้าไร้จรรยาบรรณที่ฉวยโอกาสจากความตื่นเต้นของคนที่มาเที่ยว แล้วตีแผ่ให้ทุกคนรู้ค่ะ!"
2601602-13 = "มีคนแจ้งเบาะแสเข้ามาหลายครั้งแล้วด้วย แบบนี้น่าสงสัยแน่นอนค่ะ!"
2601602-14 = "ถ้างั้นก็ไปกันเลยค่ะ! บุกเลย!"
2601602-15 = ""
2601602-17 = ""
2601602-20 = ""
2601602-21 = "จะไม่มาอีกแล้ว! แพงก็แพง แต่ปริมาณไม่ถึงหยิบมือด้วยซ้ำ!"
2601602-22 = "บอกว่าเป็นปลาอาจิทอด แต่ใครดูก็รู้ว่าเป็นปลาเล็กปลาน้อยแปลกๆ!"
2601602-23 = "จะรีวิวให้แค่ 1 ดาวพอ!! จะเอาไปแฉให้หมดด้วย!!"
2601602-24 = "เอาเลยพ่อหนุ่ม ใครเขาอ่านรีวิวก่อนมาที่นี่กัน?"
2601602-25 = "ฉันจะฟ้องข้อหาขัดขวางการค้าขาย อยากทำอะไรก็เชิญเลย"
2601602-26 = "อึกกก มีแต่พวกนิสัยไม่ดี!"
2601602-27 = ""
2601602-29 = ""
2601602-30 = "กลับดีๆ นะครับ โอกาสหน้าเชิญใหม่นะครับ!"
2601602-31 = "เห็นโวยวายใส่กันตรงๆ ก็นึกว่าจะมีอะไร ที่ไหนได้ ไม่เห็นมีอะไรเลย"
2601602-32 = "ต่อให้เอาไปโพสต์ในอินเทอร์เน็ตหรือที่ไหนก็เถอะ ร้านเราเปิดขายแค่ช่วงฤดูท่องเที่ยว กว่าข่าวจะกระจาย เราก็เลิกขายไปแล้วละ"
2601602-33 = "แต่แบบนี้ไม่เกินไปหน่อยเหรอ? เอาปลาตัวเท่านิ้วก้อยมาขายเป็น 'ปลาอาจิทอดขนาดยักษ์' แบบนี้น่ะ"
2601602-34 = "ถ้าจะหาเงินช่วงฤดูท่องเที่ยวให้พอกินอยู่สบายๆ ไปทั้งปี ก็ต้องประหยัดต้นทุนก่อนสิ! ฮ่าฮ่าฮ่า!!"
2601602-35 = "ที่ไม่ติดป้ายราคาในร้าน แต่เขียนไว้แค่ในเมนู ให้ลูกค้าต้องยอมจ่ายเพราะกลัวเสียหน้านั่นก็สุดยอดเลย!"
2601602-36 = "ลูกค้าหน้าโง่คนต่อไป เราจะรีดเงินได้สักเท่าไรนะ"
2601602-37 = ""
2601602-38 = ""
2601602-41 = ""
2601602-42 = "เชิญครับ!"
2601602-43 = "เชิญนั่งเลย! มาๆ ตรงนี้..."
2601602-44 = ""
2601602-46 = ""
2601602-47 = "โอ้ บรรยากาศดูดีกว่าที่มีคนแจ้งเบาะแสมาเยอะเลยนะคะ!"
2601602-48 = "!!!"
2601602-49 = "ดะ... เด็กคนนั้น...!?"
2601602-50 = "ทำไม? มีปัญหาอะไร?"
2601602-51 = "เจ้าโง่! นั่นนักข่าวของแพนเดโมเนียม โซไซตี้รายสัปดาห์ ที่ขึ้นชื่อว่าตัวแสบในวงการนี้ไง!!"
2601602-52 = "จริงด้วย...! แล้วข้างๆ นั่นก็ครูจากชาเล่ต์นี่นา?!"
2601602-53 = "ได้ยินว่าถ้าเจอเรื่องให้ทำข่าว ก็จะตามจิกไม่ยอมปล่อยเด็ดขาดเลยนะ!"
2601602-54 = "แถมคนอ่านส่วนใหญ่ก็เป็นนักเรียนเกเฮนน่าด้วย...!"
2601602-55 = "จริงด้วย ตอนเดินเข้ามาก็พูดกับตัวเองว่า 'เบาะแส' อยู่เหมือนกัน..."
2601602-56 = "แล้วจะทำยังไงดี?!"
2601602-57 = "ขอโทษนะคะ! ขอเมนูหน่อยค่า!"
2601602-58 = "คะ... ครับผม! จะไปเดี๋ยวนี้ครับ!!"
2601602-59 = "ลบตัวเลขราคาในเมนูออกอย่างละหลักก่อนเลย!! เด็กคนนั้นต้องเอาเรื่องราคามาจับผิดแน่ๆ!!"
2601602-60 = "ชะ... ใช่!! ส่วนอาหารก็ห้ามตุกติก ให้ปริมาณมากกว่าเดิมด้วยเลย จะได้ไม่เป็นที่สงสัย!"
2601602-61 = "ถ้างั้น ขอเป็นเมนูนี้นะคะ!"
2601602-62 = "ดะ... ได้เลย! ได้แน่นอนอยู่แล้ว!"
2601602-63 = ""
2601602-65 = ""
2601602-66 = "อืม ก็ไม่ได้แพงอย่างที่ได้เบาะแสมานี่คะ? ดูเป็นราคาที่พอรับได้ด้วย?"
2601602-67 = "แต่ก็มีคนบอกว่าให้น้อยด้วย เรื่องนั้นรออาหารมาแล้วค่อยตรวจสอบกันค่ะ!"
2601602-68 = "ถ้างั้น เตรียมไว้ก่อนเลย...!"
2601602-69 = ""
2601602-71 = ""
2601602-72 = "[ns] \"จิอากิ? นั่นอะไรเหรอ?\""
2601602-73 = "สายวัดกับเครื่องชั่งค่ะ! จะเขียนข่าวจากความเห็นส่วนตัวอย่างเดียวไม่ได้นี่คะ! ถ้าทำแบบนั้นอีก อาจถูกเรียกว่าเป็นนิตยสารที่มีแต่น้ำก็ได้ค่ะ!"
2601602-74 = "บางครั้งมุมมองส่วนตัวที่มีชีวิตชีวาของบรรณาธิการก็แม่นยำกว่ามุมมองที่เป็นกลาง แต่ครั้งนี้สิ่งสำคัญคือข้อเท็จจริงที่เป็นกลางค่ะ!"
2601602-75 = "ฮุฮุฮุ ฉันจะไม่ปล่อยให้คลาดเคลื่อนแม้แต่ 1 กรัมเลยค่ะ~"
2601602-77 = "?!"
2601602-78 = "เอาเครื่องชั่งออกมาวางบนโต๊ะโต้งๆ เลยเหรอ?!"
2601602-79 = "ถ้าให้น้อยไปแค่นิดเดียว ทางนั้นต้องเอาเรื่องนั้นมาจับผิดแน่!"
2601602-80 = "ปกติถ้าแฝงตัวมาทำข่าว ก็ต้องซ่อนกล้องไว้ในกระเป๋า... หรืออะไรแบบนั้นไม่ใช่เหรอ?"
2601602-81 = "ทำยังไงดีล่ะ? อย่าว่าแต่ปลาอาจิขนาดยักษ์เลย แค่ขนาดปกติก็ยังไม่มี..."
2601602-82 = ""
