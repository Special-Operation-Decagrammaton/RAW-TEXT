2601602-123 = "อะ... อะไรกัน?! คนเยอะแยะนี่มาจากไหน?!"
2601602-124 = "ต้องอย่างนี้สิ! คุ้มจริงๆ ที่ลงสกู๊ปพิเศษไปค่ะ!"
2601602-125 = "[s] \"จู่ๆ คนก็แห่กันมาเต็มเลย?!\""
2601602-126 = "ค่ะ! ก็ร้านริมทะเลที่ทั้งราคาถูกและให้เยอะแบบนี้ สมัยนี้ไม่ค่อยมีนี่คะ!"
2601602-127 = "ฉันก็เลยโพสต์เป็นการ์ดข่าวด่วนลงโซเชียลมีเดียของ <แพนเดโมเนียม โซไซตี้รายสัปดาห์> ไปค่ะ!"
2601602-128 = "เหมือนที่ลงในโซเชียลมีเดียของแพนเดโมเนียม โซไซตี้รายสัปดาห์เลย! ราคาถูกสุดๆ!"
2601602-129 = "อ๊ะ สวัสดี จิอากิจัง! คุณครูก็อยู่ด้วยเหรอคะ!"
2601602-130 = "สวัสดีค่ะ! สมัยนี้หาร้านดีๆ แบบนี้ไม่ค่อยได้ มาช่วยอุดหนุนกันเยอะๆ เลยนะคะ!"
2601602-132 = "ดีละ! งั้นสั่งเมนูละอย่างเลย! ตั้งแต่ตรงนี้ถึงตรงนี้ เอามาให้หมด!!"
2601602-133 = "อะ... อ๊าก!! ราคาในเมนูยังเป็นราคาที่ลบเลข 0 ออกไปตัวหนึ่งอยู่เลยนี่?!"
2601602-134 = "จะเปลี่ยนตอนนี้ก็ไม่ทันแล้ว!!"
2601602-135 = "รับออเดอร์โต๊ะนี้ด้วยค่า!"
