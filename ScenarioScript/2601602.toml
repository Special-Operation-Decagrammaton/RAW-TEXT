2601602-158 = "นั่นวัตถุดิบสำหรับขายพรุ่งนี้น่ะครับ คุณลูกค้า!!"
2601602-159 = "ถ้าขายให้หมดวันนี้ พรุ่งนี้ก็หยุดพักได้ไงคะ!"
