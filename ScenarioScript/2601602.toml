2601602-105 = ""
2601602-106 = ""
2601602-107 = ""
2601602-108 = ""
2601602-109 = "We got away with it, right?"
2601602-110 = "She looks satisfied, so she probably won't expose us!"
2601602-111 = "Looks like we'll make it through this season after all..."
