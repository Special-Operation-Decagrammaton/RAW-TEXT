[translation]
2601602-1 = "Once Vacation Starts..."
2601602-2 = "Hmm, hmm! Sand stretching as far as the eye can see, and an endless horizon..."
2601602-3 = ""
2601602-4 = "It's the beach!"
2601602-5 = "[s] \"Yup! That's a factual statement!\""
2601602-6 = "I know it's obvious!"
2601602-7 = "That's because all good reporting starts with gathering the facts!"
2601602-8 = "*sniff sniff* I smell a scoop! Salty and fishy, just like a real scoop should be!"
2601602-9 = "[s] \"Are scoops supposed to have a smell?\""
2601602-10 = "Yes! Well, not all of them, of course..."
2601602-11 = "The headline for this feature article is \"Exposed! Ambushing Shady Businesses at the Beach!\""
2601602-12 = "We're going undercover to expose shady businesses that take advantage of vacationers caught up in the excitement!"
2601602-13 = "We've already received several tips, so I just know there's a juicy story here!"
2601602-14 = "All right, let's get right to it! Charge!"
2601602-15 = ""
2601602-17 = ""
2601602-20 = ""
2601602-21 = "I'll never come back here! It's so overpriced for what you get!"
2601602-22 = "And you call this fried mackerel? Anyone can see it's some weird little trash fish!"
2601602-23 = "I'm giving this place one star! I'm telling everyone about this!"
2601602-24 = "Go right ahead, pal. You think anyone comes all the way out here because of reviews?"
2601602-25 = "Do whatever you want. We'll sue you for defamation."
2601602-26 = "W-Waaah! You guys are the worst!"
2601602-27 = ""
2601602-29 = ""
2601602-30 = "Thanks for coming! Come again!"
2601602-31 = "For all the fuss, that was pretty anticlimactic."
2601602-32 = "Post about us online all you want. This is a seasonal business, so we'll be long gone by the time word gets around."
2601602-33 = "Still, isn't that going a little far? Selling some tiny fish the size of your pinky as \"Extra Large Fried Mackerel.\""
2601602-34 = "If we want to make enough in one season to coast through the rest of the year, we've got to keep costs down! Hahaha!"
2601602-35 = "And not posting the prices anywhere except the menu was genius! Once they've ordered, they're too embarrassed to back out and just pay up!"
2601602-36 = "Now, how much can we squeeze out of the next sucker?"
2601602-37 = ""
2601602-38 = ""
2601602-41 = ""
2601602-42 = "Welcome!"
2601602-43 = "Have a seat! Come on, right over here..."
2601602-44 = ""
2601602-46 = ""
2601602-47 = "Oh! This place is actually a lot nicer than the reports made it sound!"
2601602-48 = "Eh?!"
2601602-49 = "Th-That girl...!"
2601602-50 = "What? What's wrong?"
2601602-51 = "You idiot! That's the infamous reporter from Weekly Pandemonium!"
2601602-52 = "Ack, you're right! And that's...Schale's Sensei with her?!"
2601602-53 = "I heard once she sinks her teeth into a story, she never lets go!"
2601602-54 = "And most of her readers are Gehenna students...!"
2601602-55 = "Come to think of it, she did mention a \"tip\" when she came in..."
2601602-56 = "What do we do?!"
2601602-57 = "Excuse me! Could we get a menu, please!"
2601602-58 = "Y-Yes! Coming right up!"
2601602-59 = "First, knock down every price on the menu! She'll definitely call us out for extortion!"
2601602-60 = "R-Right!! And no funny business with the food! Give them bigger portions than usual, so they won't suspect anything!"
2601602-61 = "Then we'll have this, please!"
2601602-62 = "Y-Yes! Of course!"
2601602-63 = ""
2601602-65 = ""
2601602-66 = "Hmm... The prices aren't as high as the tips claimed. They actually seem pretty reasonable."
2601602-67 = "One of the reports I received was that the portions were abysmally small, so we have to check that too!"
2601602-68 = "Okay! I'm ready!"
2601602-69 = ""
2601602-71 = ""
2601602-72 = "[ns] \"Chiaki? What's that?\""
2601602-73 = "A measuring tape and a scale! I can't write an article based on subjective impressions alone! Otherwise, people might call us \"dead on arrival\" again!"
2601602-74 = "Sometimes an editor's firsthand impressions can be more accurate than objective facts, but this time, the facts ALWAYS matter!"
2601602-75 = "Heeheehee. I won't overlook even a single gram!"
2601602-77 = "Huh?!"
2601602-78 = "Did she just pull out a scale?!"
2601602-79 = "If we're even a little short, she'll nail us for it!"
2601602-80 = "Isn't undercover reporting supposed to be discreet or...undercover?!"
2601602-81 = "What do we do? We don't even have regular-sized mackerels, let alone extra-large ones..."
2601602-82 = ""
2601602-84 = ""
2601602-85 = "W-Wait, I know!"
2601602-87 = ""
2601602-88 = "Y-Your Extra Large Fried Mackerel is ready!"
2601602-89 = ""
2601602-91 = ""
2601602-92 = "Fried... mackerel?"
2601602-93 = "This looks like... tuna..."
2601602-94 = "H-Haha!! We're running a special event right now! So instead of mackerel, we're serving grilled bluefin tuna!"
2601602-95 = "It's a special event just for today, miss!"
2601602-96 = "Wow, wow! This is awesome!"
2601602-97 = "Hmm... The prices are reasonable, and far from being small, the portions are big enough to leave you stuffed."
2601602-98 = "Maybe my tip was wrong... I heard this place was run by a bunch of shady scammers."
2601602-99 = "[s] \"If they're not actually shady, isn't that a good thing?\""
2601602-100 = "That's true! If anything, this place deserves some praise!"
2601602-101 = "This is still a scoop! Just a moment!"
