[translation]
2601602-1 = "バカンスが始まると……"
2601602-2 = "ふむふむ。見渡す限りの白い砂、果てしなくどこまでも続く水平線……。"
2601602-3 = ""
2601602-4 = "これは……海ですね！"
2601602-5 = "[s] \"一目瞭然だね。\""
2601602-6 = "たしかに、誰が見てもそう感じると思います！"
2601602-7 = "ですが、取材は事実の積み重ねによってできていますから！"
2601602-8 = "くんくん、ここはスクープのニオイがしますよ！"
2601602-9 = "[s] \"スクープってニオイがするものなの？\""
2601602-10 = "はい！まあ、全部がそうというわけではありませんが……。"
2601602-11 = "今回の特集記事は「告発！海岸の悪徳商人に迫る！」です。"
2601602-12 = "バカンスで浮かれている客を狙う、わる～いお店に潜入取材します！"
2601602-13 = "複数回の情報提供を受けているので、ほぼクロと言って間違いないでしょう！"
2601602-14 = "では行きますよー？いざ、突撃ー！"
2601602-15 = ""
2601602-17 = ""
2601602-20 = ""
2601602-21 = "何なんだ、この店は！値段の割に量が少なすぎるだろ！"
2601602-22 = "アジフライを頼んだのに、なんだこのちっこいのは！"
2601602-23 = "全部口コミに書くからな！"
2601602-24 = "はっ！口コミくらい好きにしろよ。"
2601602-25 = "こっちは営業妨害で訴えてやることもできるんだぜ？"
2601602-26 = "く、くそっ！もう二度と来ないからな！"
2601602-27 = ""
2601602-29 = ""
2601602-30 = "へへっ、あざしたー。"
2601602-31 = "デカい口叩きやがって。"
2601602-32 = "口コミなんて書いたところで、広まる頃には店仕舞いしてるに決まってんだろ。"
2601602-33 = "にしてもやるな。小魚を「特大アジフライ」って名前で売るなんて。"
2601602-34 = "へへっ。こういうときにしっかり稼いどかねぇと！"
2601602-35 = "メニュー表にだけ値段書いてすぐ回収すりゃ、確認できねえからな！"
2601602-36 = "さて、次はどいつから搾り取ろうか……。"
2601602-37 = ""
2601602-38 = ""
2601602-41 = ""
2601602-42 = "いらっしゃい！"
2601602-43 = "空いてる席にどうぞ！"
2601602-44 = ""
2601602-46 = ""
2601602-47 = "おー！前評判よりは良いお店ですね！"
2601602-48 = "！！！"
2601602-49 = "あ、あいつは……！？"
2601602-50 = "誰だ？"
2601602-51 = "馬鹿野郎！例の週刊万魔殿の記者だよ！"
2601602-52 = "言われてみれば……！それに、隣にいるのはシャーレの先生か？"
2601602-53 = "なんでも、週刊万魔殿の記者は一度特ダネに食いついたら何が何でも放さないらしい。"
2601602-54 = "しかも、読者層はあのゲヘナ生だ……！"
2601602-55 = "たしか……さっき「前評判」がどうのこうのって言ってたよな……。"
2601602-56 = "ど、どうする！？"
2601602-57 = "すみませーん！メニューお願いしまーす！"
2601602-58 = "は、はい！ただいまお持ちします！"
2601602-59 = "とりあえず、安くした値段書いて渡せ！"
2601602-60 = "わ、分かった！そっちも料理ちゃんと作れよ！量も大盛りで！"
2601602-61 = "では、これをお願いします！"
2601602-62 = "はい！少々お待ちください！"
2601602-63 = ""
2601602-65 = ""
2601602-66 = "おや？そんなに高くないですね。"
2601602-67 = "量が少ないって話もありましたし……料理が来たら検証してみましょう！"
2601602-68 = "では、先に準備を……！"
2601602-69 = ""
2601602-71 = ""
2601602-72 = "[ns] \"チアキ？それは？\""
2601602-73 = "メジャーと計量器です！主観だけで記事は書けませんので！#nでないとまたスープみたいな雑誌とか言われてしまいます！"
2601602-74 = "主観が大事な時もありますが、今回ばかりは客観的事実が重要ですからね！"
2601602-75 = "ふふふ、1グラムの誤差も、見逃しませんよ～？"
2601602-77 = "！？"
2601602-78 = "計量器だと！？"
2601602-79 = "そんなもの使われたら言い逃れできないぞ！"
2601602-80 = "そもそも、潜入取材ってこっそりするもんじゃないのか……？"
2601602-81 = "どうする？特大どころか、普通サイズのアジもないが……。"
2601602-82 = ""
2601602-84 = ""
2601602-85 = "……そ、そうだ！"
2601602-87 = ""
2601602-88 = "ご、ご注文の「特大アジフライ」です！"
2601602-89 = ""
2601602-91 = ""
2601602-92 = "アジ……フライ？"
2601602-93 = "これ、マグロ？に見えますけど……。"
2601602-94 = "い、今イベント中でして！アジの代わりに本マグロを提供しております！"
2601602-95 = "本日限りの特別イベントです！"
2601602-96 = "なるほど！これはたしかにすごいですね！"
2601602-97 = "うーん……。値段も高くないし……。#n量にいたっては、お腹がパンパンになりそうなくらいある。"
2601602-98 = "どうにも悪徳商人って感じじゃありませんねぇ。#n情報提供者が間違えていたんでしょうか？"
2601602-99 = "[s] \"悪い店じゃなかったのなら、いいことじゃない？\""
2601602-100 = "そうですね！むしろ褒めるべきです！"
2601602-101 = "これは嬉しい誤算ですね！少し待っててください！"
2601602-102 = ""
2601602-104 = ""
2601602-105 = ""
2601602-106 = ""
2601602-107 = ""
2601602-108 = ""
2601602-109 = "な、何とか乗り切ったか……。"
2601602-110 = "満足してるみたいだし、記事にされることはないだろう……。"
2601602-111 = "これで今年も無事に――"
2601602-113 = ""
2601602-115 = ""
2601602-116 = ""
2601602-117 = ""
2601602-118 = ""
2601602-119 = ""
2601602-120 = "良かった！まだ席空いてるよ！"
2601602-121 = "急いで来た甲斐あったね！"
2601602-123 = "な、なんだ！？この人数！？"
2601602-124 = "おお～！特集の効果はバッチリみたいですね！"
2601602-125 = "[s] \"すごい数のお客さんが来てるけど！？\""
2601602-126 = "はい！安くて量も多い、最高のお店があるって――"
2601602-127 = "ついさきほど、「週刊万魔殿」のSNSに速報を出したんです！"
2601602-128 = "投稿通り、めちゃくちゃ安いね！"
2601602-129 = "チアキちゃんハロー！あっ、先生もこんにちは！"
2601602-130 = "ハローです！良心的なお店なので、たくさん頼んで応援しましょう！"
2601602-132 = "よーし！すみません！メニューのここからここまで、全部ください！"
2601602-133 = "う、うわあああ！メニューの値段、安くしたままだぞ！"
2601602-134 = "どうすんだ！今更変えられねぇぞ！"
2601602-135 = "すみませーん！こっちも注文お願いしますー！"
2601602-136 = ""
2601602-138 = ""
2601602-139 = ""
2601602-140 = ""
2601602-141 = ""
2601602-142 = ""
2601602-143 = "や、ヤバい！一気に注文が！"
2601602-144 = "このままじゃ食材を全部持っていかれちまう！"
2601602-145 = "す、すみませんお客さん！もう材料がなくなってしまいまして！"
2601602-146 = "本日の営業は終了です！"
2601602-148 = "え、本当に？もう残ってないの？"
2601602-149 = "まだ残ってるんじゃない？"
2601602-151 = "はい！？"
2601602-153 = ""
2601602-156 = ""
2601602-157 = "見て！こっちの冷蔵庫にまだたくさん残ってるよ！"
2601602-158 = "そ、それは明日の食材で……！"
2601602-159 = "今日使い切ったら明日休めるでしょ！"
2601602-160 = "か、勘弁してくれー！"
2601602-161 = "あははっ！良いお店を紹介するのは、なんだか気持ちがいいですね！"
2601602-162 = ""
2601602-164 = ""
2601602-167 = ""
2601602-168 = "順番にお作りしているのでもう少々お待ちください！"
2601602-170 = "もうおしまいだー！"
2601602-171 = ""
2601602-173 = "[ns] \"店員さん、なんか泣いてない……？\""
2601602-174 = "あれが幸せの涙というものですね！#n「週刊万魔殿」が地域に貢献出来て、私も嬉しいです！"
2601602-176 = "（その後も、噂を耳にしたお客さんが絶え間なく訪れた）"
2601602-177 = "（お店をあとにすると、なぜか周りの人たちから拍手と激励を受けた）"
