2601602-173 = "[ns] \"พนักงานร้านดูเหมือนจะร้องไห้อยู่เลยนะ...?\""
2601602-174 = "น่าจะเป็นน้ำตาแห่งความดีใจค่ะ! อ่า ฉันก็ดีใจที่ <แพนเดโมเนียม โซไซตี้รายสัปดาห์> ได้ช่วยให้ชุมชนท้องถิ่นเติบโตไปด้วยกันค่ะ!"
