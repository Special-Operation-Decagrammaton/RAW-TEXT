2601602-124 = "Yes! Looks like posting that scoop really paid off!"
2601602-125 = "[s] \"Why are so many people suddenly showing up?!\""
2601602-126 = "Yep! I told everyone about this rare beachside place with cheap prices and generous portions!"
2601602-127 = "I just posted a breaking story about it on the \"Weekly Pandemonium\" socials!"
2601602-128 = "It's just like the post said! It's super cheap!"
2601602-129 = "Oh, hi, Chiaki! Sensei's here too!"
