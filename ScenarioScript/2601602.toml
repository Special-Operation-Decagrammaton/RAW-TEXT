2601602-120 = "哦～！還有很多位子！"
2601602-121 = "一看到就馬上趕來果然值得！真幸運～！"
2601602-123 = "什，什麼！？這人潮是怎麼回事！？"
2601602-124 = "果然！不枉我發了這則獨家新聞！"
2601602-125 = "[s] 「怎麼突然湧進這麼多人！？」"
2601602-126 = "是的！因為這是最近很少見、便宜又大方的海之家！"
2601602-127 = "我在週刊萬魔殿的SNS上發了圖卡新聞快報！"
2601602-128 = "跟週刊萬魔殿SNS上說的一模一樣耶！超便宜的！"
2601602-129 = "啊，千秋醬你好～！老師也在呢！"
2601602-130 = "你好～！這是最近很少見的良心店家，大家一起多多捧場吧！"
2601602-132 = "好！菜單上的照順序全點一輪！從這裡到這裡全都給我！！"
2601602-133 = "嗚，嗚啊啊！！菜單上的價格還沒把0補回去啊！？"
2601602-134 = "現在改不了了！！"
2601602-135 = "這邊也請幫我們點餐～！"
2601602-136 = ""
2601602-138 = ""
2601602-139 = ""
2601602-140 = ""
2601602-141 = ""
2601602-142 = ""
2601602-143 = "不，不行！！幾十個人同時點！！"
2601602-144 = "再這樣下去，剩下整個夏天要用的食材本錢都要賠光了！"
2601602-145 = "各，各位客人！！很抱歉，食材已經用完了！"
2601602-146 = "今天的營業到此結束！！"
2601602-148 = "只要有食材就會繼續營業對吧？"
2601602-149 = "我們去冰箱找找看！"
2601602-151 = "什麼！？"
2601602-153 = ""
2601602-156 = ""
2601602-157 = "冰箱裡明明有一大堆食材啊！"
2601602-158 = "那是明天營業要用的食材啊，客人！！"
2601602-159 = "今天全部賣完的話，明天就可以休息了啊！"
2601602-160 = "嗚啊啊～！"
2601602-161 = "啊哈哈！總覺得很有成就感呢！尋找隱藏的良心店家！"
2601602-162 = ""
2601602-164 = ""
2601602-167 = ""
2601602-168 = "請不要自己結帳！嗚啊啊～"
2601602-170 = "完蛋了～！！"
