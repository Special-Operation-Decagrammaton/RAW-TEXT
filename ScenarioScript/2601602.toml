[translation]
2601602-1 = "휴가가 시작되자……"
2601602-2 = "음음음! 아득히 이어진 모래, 끝없이 이어지는 수평선……."
2601602-4 = "바다네요!"
2601602-5 = "[s]\"바다…… 니까?\""
2601602-6 = "당연한 사실이긴 해요!"
2601602-7 = "그치만, 취재는 팩트를 쌓아올려가는 것부터 시작하는 거니까요!"
2601602-8 = "킁킁킁, 특종의 냄새가 나네요! 짭짤하고 비린 게 딱 특종이에요!"
2601602-9 = "[s]\"특종이란 게 원래 냄새가 나는 거야?\""
2601602-10 = "네! 뭐, 전부 다 그런건 아니지만……."
2601602-11 = "이번 만마전 특집 기사는 <고발! 양심 불량 해안가 대습격!> 입니다!"
2601602-12 = "휴양지의 들뜬 마음을 악용하는 악덕 업체들을 잠입 취재해서 널리 알릴 거예요!"
2601602-13 = "이미 여러 번 제보도 들어왔으니, 수상한 건 확정이겠죠!"
2601602-14 = "그러면, 바로 가보죠! 돌격입니다!"
2601602-21 = "다신 안 와요! 값은 비싼데 양은 한 줌도 안 나오고!"
2601602-22 = "그리고 전갱이 튀김이라면서, 누가 봐도 이상한 잡어잖아요!"
2601602-23 = "리뷰 1점 줄거예요!! 다 고발할거예요!!"
2601602-24 = "맘대로 해보라고 형씨, 누가 여기와서 리뷰 보고 온다고?"
2601602-25 = "영업 방해로 고소할 테니까 얼마든지 해봐."
2601602-26 = "으허어엉- 순 악질들이잖아-!"
2601602-30 = "손님 가십니다- 다음에 또 오십쇼-!"
2601602-31 = "대놓고 화내길래 어떨까 싶었는데, 싱겁구먼."
2601602-32 = "가서 인터넷이건 어디건 올려봤자, 한 철 장사라서 소문이 퍼질 즈음엔 이미 장사 접고 난 뒤니까 말이야."
2601602-33 = "그래도 너무한 거 아니야? 새끼손가락만 한 잡어를 '특대 전갱이 튀김'으로 팔다니."
2601602-34 = "한 철 벌어서 한 해 놀고먹으려면 원가부터 아껴야지! 핫핫핫!!"
2601602-35 = "가격표를 매장에 걸어놓지 않고, 메뉴판에만 써두니까 체면 때문에 어쩔 수 없이 계산하게 하는 것도 대박이었어!"
2601602-36 = "다음 호구에게는 얼마나 뜯어먹어 볼까-"
2601602-42 = "어서 옵쇼!"
2601602-43 = "자리에 앉으시죠! 자자, 여기에……."
2601602-47 = "오- 제보로 들어온 것보다는 꽤 분위기가 좋은데요!"
2601602-48 = "!!!"
2601602-49 = "저, 저 아이는……!?"
2601602-50 = "왜? 뭐가 문제야?"
2601602-51 = "멍청아! 이 바닥에서 악명 높은, 주간 만마전의 기자라고!!"
2601602-52 = "그러고 보니……! 옆에는 샬레의 선생도 있네?!"
2601602-53 = "한번 건수를 잡으면, 절대로 물고 놓아주질 않는다더라!"
2601602-54 = "거기에, 대부분의 독자가 게헨나 학생들이고……!"
2601602-55 = "확실히, 들어올 때 혼잣말로 '제보'라고 말하기도 했고……."
2601602-56 = "그러면 어떡하지?!"
2601602-57 = "저기요-! 메뉴판 부탁드립니다아-!"
2601602-58 = "네, 네엡-! 갑니다!!"
2601602-59 = "일단 메뉴판에서 가격 숫자를 하나씩 지워!! 가격이 비싸다고 분명 문제 삼을 테니까!!"
2601602-60 = "그, 그렇지-!! 음식도 장난치지 말고, 오히려 더 많이 줘서 의심을 풀자고!"
2601602-61 = "그럼 주문은 이걸로, 부탁드릴게요!"
2601602-62 = "예, 예에! 아무렴요!"
2601602-66 = "흐음, 일단 제보에서 말한 것만큼 비싸진 않네요? 납득 가능한 수준일지도?"
2601602-67 = "양이 적다고 했으니, 그건 음식이 나오면 검증해 보죠!"
2601602-68 = "그럼, 미리 준비를……!"
2601602-72 = "[ns] \"치아키? 그게 뭐니?\""
2601602-73 = "줄자하고 저울이에요! 주관만으로는 기사를 쓸 수 없으니까요! 또 그랬다간 시체 같은 잡지라는 소리를 들을지도 모르고요!"
2601602-74 = "편집자의 생생한 주관이 때로는 객관보다 정확하지만, 이번만큼은 객관적 사실이 중요하니까요!"
2601602-75 = "후후후, 1g의 오차도 놓치지 않을거라구요~?"
2601602-77 = "?!"
2601602-78 = "대놓고 테이블 위에 저울을 꺼낸 거야?!"
2601602-79 = "조금이라도 적게 냈다간 그걸로 트집 잡을 거야!"
2601602-80 = "원래 잠입 취재는 가방에 카메라를 숨기거나…… 그러는 거 아니야?"
2601602-81 = "어떡하지? 특대는커녕 보통 크기 전갱이도 없는데……."
2601602-85 = "그, 그렇지!!"
2601602-88 = "주, 주문하신 특대 전갱이 튀김 나왔습니다!"
2601602-92 = "전갱이…… 튀김이요?"
2601602-93 = "이거, 참치? 로 보이는데요……."
2601602-94 = "하, 하하!! 지금 이벤트 중이어서요! 전갱이 대신에 참다랑어구이 서비스입니다!"
2601602-95 = "오늘만 특별히 하는 이벤트라고요, 아가씨!"
2601602-96 = "오호라 오호라! 이건 확실히 대단하네요!"
2601602-97 = "흐음…… 여기는 가격도 착하고, 양이 적기는커녕 오히려 배가 터질 정도인데요?"
2601602-98 = "설마, 제보가 잘못된 걸까요? 분명 악덕 사기꾼 업체라고 했는데?"
2601602-99 = "[s] \"나쁜 업체가 아니라면 잘된 것 아닐까?\""
2601602-100 = "그러네요! 오히려 대단하다고 해야 할지!"
2601602-101 = "이건 특종이 맞네요! 잠시만요-!"
2601602-109 = "무사히 넘어간 거 맞겠지?"
2601602-110 = "만족한 것 같아 보이고, 다행히 고발당하진 않겠어……!"
2601602-111 = "올해 한 철 장사는 다행히 넘어갈 수 있겠……."
2601602-120 = "오-! 자리 많이 있다!"
2601602-121 = "보자마자 온 보람이 있네! 럭키-!"
2601602-123 = "뭐, 뭐야?! 이 인파는?!"
2601602-124 = "역시! 특종을 띄운 보람이 있네요!"
2601602-125 = "[s]\"갑자기 사람들이 몰려왔는데?!\""
2601602-126 = "네! 요즘 보기 드문, 값싸고 인심 후한 바다의 집이어서요!"
2601602-127 = "<주간 만마전> SNS에 카드뉴스 속보로 띄웠거든요!"
2601602-128 = "주간 만마전 SNS에 나온 그대로잖아! 엄청 싸다!"
2601602-129 = "앗 치아키 쨩 안녕-! 선생님도 계셨네요!"
2601602-130 = "안녕- 입니다! 요새 보기 드문 착한 가게니까 잔뜩 매상 올려주자구요!"
2601602-132 = "좋아! 메뉴판에 있는 거 그대로 정주행이다! 여기부터 여기까지 다 주세요!!"
2601602-133 = "으, 으아악!! 아직 메뉴판 가격, 0 하나 뺀 상태 그대로잖아?!"
2601602-134 = "지금 바꿀 수는 없어!!"
2601602-135 = "여기도 주문 받아주세요-!"
2601602-143 = "아, 안돼!! 수십 명이 한꺼번에!!"
2601602-144 = "이대로 가다간 남은 여름 동안 쓸 재료 밑천도 다 날려버릴 거야!"
2601602-145 = "소, 손님 여러분!! 죄송하지만 재료가 다 떨어져서요!"
2601602-146 = "오늘 영업은 여기서 끝입니다!!"
2601602-148 = "재료가 있으면 영업하는 거 맞죠?"
2601602-149 = "우리가 냉장고 찾아볼게요!"
2601602-151 = "예?!"
2601602-157 = "냉장고에 재료가 잔뜩 있었잖아요!"
2601602-158 = "그건 내일 영업할 재료입니다 손님!!"
2601602-159 = "오늘 다 팔면 내일 쉴 수 있잖아!"
2601602-160 = "흐어엉-!"
2601602-161 = "아하핫! 뭔가 뿌듯하네요! 숨은 양심 업체 찾기!"
2601602-168 = "계산을 직접 하지 말아주세요! 흐어엉-"
2601602-170 = "망했어-!!"
2601602-173 = "[ns] \"점원분, 왠지 우는 것 같지 않아……?\""
2601602-174 = "기쁨의 눈물 같아요! 아아, <주간 만마전>이 지역사회와 상생하니 저도 기쁘네요!"
2601602-176 = "(이후로도 손님들은 소식을 듣고 끝도 없이 몰려들었다.)"
2601602-177 = "(가게를 나오자, 어쩐지 몰려든 사람들에게 박수와 격려를 받았다.)"
