[translation]
10052065-2 = "케테르의 침묵, 확인했습니다."
10052065-3 = "우우우……. 으우우우……."
10052065-4 = "잘했어, 유즈. 대단했어."
10052065-5 = "말은 고맙긴 한데요……."
10052065-6 = "케이! 여기입니다! 부탁합니다!"
10052065-10 = "네, 네. 알겠어요. 다음 과정 부탁해요, 히마리."
10052065-11 = "확인했습니다. 지금 사출 좌표를 전송할 테니, 그 좌표에서는 피해 주세요."
10052065-12 = "강하 시작!"
10052065-16 = "언니, 제발 좀……. 응? 언니……."
10052065-23 = "후우……. 새삼 느끼는 것이지만, 참 신속하면서도…… [ruby=야만적인]직관적인[/ruby] 합류 방식이네요……."
10052065-24 = "그 의견에는 정말로 동의해……."
10052065-25 = "지역 장악은 거의 완료되었어요. 코어 확보 가능한가요, 케이?"
10052065-26 = "네. 그건 어렵지 않을 거예요. 문제는 그사이에……."
10052065-28 = "[ns] \"혹시 모를 지원군에 대비해서, 그 자리를 지켜 줘.\""
10052065-29 = "걱정하지 마십시오, 선생님. 제가 또 이런 분야에는 전문입니다."
10052065-30 = "……당신, 웬만한 분야는 다 전문이라고 이야기하는 편 아닌가요……?"
10052065-31 = "그렇습니다. 그것이야말로 완벽한 최고의 메이드이자 요원으로서 지향해야 할 자세이기에."
10052065-32 = "(아무리 생각해도, 히마리에게 이상한 버릇이 옮고 있는 것 같은데…….)"
10052065-33 = "이번에는 아리스가 케이를 지키는 것이로군요……. 아리스, 최선을 다하겠습니다!"
10052065-34 = "어, 그, 그렇게…… 되네요. 그, 저기…… 감사, 합니다. 잘 부탁드릴게요……."
10052065-35 = "네! 아리스만 믿어 주십시오!"
10052065-36 = "그러고 보니 케테르의 연구지구는, 댐이 무너진 여파의 홍수로 완전히 폐쇄되었다고 들었습니다만."
10052065-37 = "네. 그랬죠. 결국 그 시점에서 내릴 수 있었던 결론은, 데카그라마톤의 본체가 자판기의 AI였고……."
10052065-38 = "어떤 환청을 듣고, 스스로 초 AI로 거듭났다는 정도의 이야기였지."
10052065-39 = "보충 고마워요, 에이미."
10052065-40 = "아니야. 그때 데카그라마톤을 과대망상자라고 불렀던 부장의 말이 왠지 기억나서."
10052065-41 = "……? 과대망상자 맞잖아요? 그게 무슨 문제죠?"
10052065-42 = "그렇지만 그건, 부장이 데카그라마톤을 일종의 인격이자…… 인간처럼 취급했다는 이야기잖아?"
10052065-43 = "부장은 이래 봬도 언어의 선택과 사용에는 엄격하니까."
10052065-44 = "그, 그야……. 그 부분을 인정하지 않으면……."
10052065-45 = "예를 들어…… 지금 우리와 함께하고 있는 동료 중, 최소한 두 명에게는 다른 카테고리를 적용해야 하잖아요?"
10052065-46 = "그러니까 그거예요! 분류 기준 같은 건, 최대한 줄이는 편이 좋으니까요!"
10052065-47 = "?"
10052065-48 = "……."
10052065-49 = "과연. 합리성의 측면에서 바라본 분류 기준이라는 거구나. 참고가 되겠어."
10052065-50 = "……당신만은 그 부분을 그렇게 받아들이면 안 된다고 생각하지만요……."
10052065-51 = "그, 그래?"
10052065-52 = "자, 자. 코어 확보에 성공했어요."
10052065-53 = "수송선의 디스플레이에 출력해 둔, <생명의 나무>와 실시간으로 공유할 테니, 언제든 찾아보면 좋을 거예요."
10052065-54 = "이쪽에서도 확인 완료. 모두 수고했어."
10052065-55 = "뽜밤 뽜밤! 케이의 레벨이 10만큼 상승했습니다! 이 기세로 쭉쭉 나가면 되는 겁니다!"
10052065-56 = "그래요, 아리스. 그렇게 하면 될 거예요."
10052065-61 = "음, 그리고…… 선생님에게 조금, 부탁 같은 것이…… 있는데요."
10052065-62 = "[s] \"응? 뭔데?\""
10052065-63 = "목소리 좀 줄여요!"
10052065-64 = "그…… 나중에, 말이죠. 히마리에게."
10052065-65 = "고맙다고, 살짝, 전해 주세요."
10052065-66 = "[ns] \"…….\""
10052065-68 = "[ns] \"걱정하지 마! 꼭 이야기해 줄게!\""
10052065-69 = "목소리 줄이라고요! 사람 말을 뭐로 알아듣는 건가요!"
10052065-70 = "? 무슨 일입니까, 케이? 선생님?"
10052065-71 = "아아아아아아, 아무것도 아니에요! 아무 일도 없었어요! 그렇죠, 선생님?!"
10052065-75 = "[ns] \"그게 말이야! 들어 봐, 아리스! 케이 쨩이 글쎄–\""
10052065-77 = "조용히 좀 하라고요!!!!!"
