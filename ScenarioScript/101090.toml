[translation]
101090-1 = "제9화;충돌 1"
101090-2 = "……그쪽은 어떻게……"
101090-3 = "계엄령이…… 하지만…… 총학생회에선……."
101090-4 = "……발키리는……."
101090-5 = "제너럴에게서 연락……. 그리고……."
101090-6 = "[ns1] \"……………………….\"\n[ns2] 눈을 뜬다."
101090-9 = "[ns3] (싯딤의 상자가 보이지 않는다…….)\n[ns4] (설마 적들이 가져가 버린 걸까…….)"
101090-13 = "……아직 대기 중이야. 그 상자라는 거, 아예 해킹은커녕 전원을 켜는 것 자체가 불가능하다던데."
101090-14 = "접속을 시도했다가 본사의 데이터 센터 8개가 셧다운됐다고 해."
101090-16 = "그럼 이제 남은 방법은 저 선생뿐인가……."
101090-17 = "……응? 방금 총소리 못 들었어?"
101090-18 = "총소리?"
101090-22 = "이런. 위쪽이야!"
101090-23 = "가보자!"
101090-36 = "하아…… 하아……."
101090-40 = "무사하십니까, [USERNAME] 선생님……?"
101090-41 = "[ns] (이 목소리는…….)"
101090-43 = "다행입니다…… 이곳을 찾아내느라 꽤나 고생했지만…… 보람이 있군요."
101090-44 = "[s] \"칸나……!?\""
101090-45 = "절 기억하고 계시군요. 저 같은 삼류 악당은 당연히 잊어버리셨을 줄 알았는데……"
101090-46 = "기다리십시오. 지금 열어드리겠습니다……. 쿨럭, 쿨럭……."
101090-47 = "……크윽."
101090-48 = "[s] \"칸나, 그 상처는 대체…….\""
101090-49 = "이 상처 말입니까……? 별것 아닙니다. 신경 쓰지 마십시오."
101090-53 = "하아, 하아…… 됐습니다. 자, 나오십시오."
101090-54 = "[ns] 감옥 밖으로 나간다."
101090-56 = "이쪽입니다. 선생님. ……묻고 싶은 게 많으시겠지만 일단 안전한 곳으로 간 뒤에."
101090-57 = "저를 따라오십시오."
101090-61 = "[ns] 따라간다."
101090-64 = "뭐, 뭐야?!"
101090-65 = "크윽?!"
101090-77 = "이 녀석들은 발키리 학생들이 아닙니다. 변장한 PMC 병사들입니다…… 쿨럭, 쿨럭……."
101090-78 = "[s] \"그건 알고 있어. 그런데 여기는…….\""
101090-79 = "D.U.에 위치한 발키리 경찰학교의 제3분교입니다. 예산 부족으로 인해 발키리의 신입생 수련회 때나 쓰던 건물인데……."
101090-80 = "어느새인가 카이저 코퍼레이션의 수중에 넘어가 있었던 것 같습니다……."
101090-81 = "[s] \"카이저가…….\""
101090-82 = "분명 발키리 내부자의 도움이나 방관이 있었겠죠."
101090-83 = "발키리 조직 내부에 카이저 그룹이 어디까지 손을 뻗치고 있는지는 저도 알지 못하지만……."
101090-84 = "그 원인은…… 말하자면 저 같이 타락한 경찰들이 존재하고 있었기 때문이겠죠."
101090-85 = "[s] \"………칸나.\""
101090-90 = "……됐습니다. 신호는 보냈고, 이제 건물의 후문으로 가시면 됩니다."
101090-91 = "봉쇄된 D.U.를 탈출할 수 있는 방편을 마련해 두었습니다."
101090-92 = "[s5] \"탈출……? 봉쇄라니……?\"\n[s6] \"대체 무슨 일이 있었던 거야?\""
101090-95 = "……가시죠."
101090-99 = "[ns] 따라간다."
101090-108 = "……낭패군요. 이미 경계가 강화되었나. 이쪽에서 만나기로 했는데……."
101090-109 = "누구냐!!"
101090-110 = "여기다! 찾았어! 쏴라!!"
101090-114 = "큭! 위험합니다, 선생님!"
101090-119 = "[ns] \"칸나!!\""
101090-123 = "크, 크윽?!"
101090-124 = "지, 지원이 더 있었……."
101090-131 = "선생님! 괜찮으세요?!"
101090-132 = "으으…… 나답지 않게 이게 무슨 일이람, 대체."
101090-133 = "[s7] \"키리노! 후부키!!\"\n[s8] \"생활안전국이 와줬구나!\""
101090-136 = "하아…… 하아…… 다행히 시간에 맞춰왔군."
101090-137 = "보셨습니까? 보셨나요? 본관의 완벽하고 퍼펙트한 사격을…… 어라?! 칸나 국장님?!"
101090-138 = "우와…… 엉망진창이네. 괜찮은 거야?"
101090-139 = "이 정도는 아무것도 아니야. 귀관들의 짐이 될 생각은 없으니 걱정 말고 퇴로부터 확보해라."
101090-140 = "네! 알겠습니다! 선생님, 본관과 후부키를 따라와 주세요!"
101090-141 = "자, 아직까진 적들에게 들키진 않은 것 같으니까. 미친개…… 아니, 칸나 국장도 조심해서 따라오라고."
101090-146 = "으으, 경계가 심해요……."
101090-152 = "하아…… 하아…… 잠깐만…… 기다려…… 하아……."
101090-153 = "키리노, 칸나 국장이 힘들어하고 있어. 천천히 가야 할 거 같은데."
101090-154 = "그, 그렇군요. 실례했습니다!"
101090-155 = "조금만 쉬어야 할 거 같아. 저쪽 빈 건물로 일단 들어가자."
101090-156 = "네, 가시죠."
101090-158 = "여기라면 괜찮을 것 같습니다."
101090-159 = "그치만 시간이 없다구. 조금만 숨을 돌리고 바로 이동해야 해."
101090-160 = "여기는……. 하아…… 하아……."
101090-161 = "국장님……."
101090-162 = "그러니까 왜 어울리지도 않는 일을 하는 거야? 공안국장이면 공안국장답게 무서운 얼굴로 취조나 할 것이지. 굳이 현장에 나와서……."
101090-163 = "책임을 돌릴 수가 없었어……."
101090-164 = "……."
101090-165 = "……음, 뭐. 그럴 것 같았지만."
101090-166 = "복잡한 이해관계가 얽힌 이 상황에서. 부하들에게 규율을 어기고 저를 따라오라고, 도무지 명령할 수가 없었습니다."
101090-167 = "[s] \"내가 없는 사이에 무슨 일이 벌어졌는지 가르쳐줘.\""
101090-168 = "……."
101090-169 = "그건……."
101090-170 = "……카이저 PMC가 6시간 전에 총학생회를 습격했습니다."
101090-173 = "카이저 PMC를 지휘하는 고위 지휘관…… 통칭 <제너럴>은 행정위원회를 해산시키고 생텀 타워를 장악, D.U. 전역에 계엄령을 선포했습니다."
101090-175 = "D.U.를 오가는 모든 교통망과 통신망은 차단되었고, 발키리를 포함한 다른 기관도 행정 권한을 잃고 명령 대기 상태……"
101090-177 = "현재 D.U.의 모든 치안은 계엄을 통해 카이저 PMC에게 이관되었습니다."
101090-179 = "지금 제가 이렇게 선생님을 모시고 카이저 PMC를 적대하고 있는 것 자체가 치안 조직으로서 명령 불복종인 상태나 다름없습니다."
101090-180 = "생활안전국의 학생들은…… 애초부터 치안 유지 조직이 아니니, '우연히' 어울린 상급자의 명령을 이행했다고 증언하면 책임은 면할 수 있겠지요."
101090-181 = "하, 하지만 본관은 그런 건 신경 쓰지 않습니다! 정의를 위해서라면 때로는 이런 각오도—"
101090-182 = "귀관들이 없어지면 키보토스의 교통은 누가 책임지지? 곤경에 빠진 시민들은 또 누가 안내하고?"
101090-183 = "모두 각자의 능력이 다른 만큼, 책임질 수 있는 임무 또한 다른 법이야."
101090-184 = "내 임무에 귀관들을 끌어들인 벌충은…… 나중에 꼭 하도록 하지."
101090-185 = "……뭐, 나는 나중에 마스터 도너츠의 글레이즈드 도넛 한 더즌이면 충분하니까."
101090-186 = "……도넛이라면 원하는 만큼 가져가. 공안국 사무실에 쌓여있으니까."
101090-188 = "……. 선생님이 행방불명되신 후…… 무슨 일들이 벌어졌는지…… 제가 알고 있는 정보를 말하자면……."
101090-190 = "수석행정관이 비상대책위원회를 개최, 각 자치구의 대표들을 소환한 것은 알고 계실 겁니다."
101090-191 = "거기엔 선생님도 참석 예정이었으니까요."
101090-192 = "하지만 그 직후 샬레 건물에서 출발했다는 선생님의 행방이 묘연해졌고……."
101090-196 = "어떤가요?"
101090-197 = "틀렸어. 선생의 흔적은 어디에도 보이지 않아."
101090-198 = "……."
101090-199 = "선배……."
101090-200 = "……알겠습니다. 모모카는 선생님의 행방을 계속 찾아주세요. 수단과 방법을 가리지 말고 작은 흔적이라도 좋으니까 반드시 찾아주세요."
101090-201 = "흐응. 알겠어. 노력은 해보겠지만……."
101090-202 = "비대위를 취소할 수는 없으니…… 예정대로 진행할 수밖에 없겠네요."
101090-203 = "하지만 선배……. 방위실의 카야 씨도 연락이 되지 않고……."
101090-204 = "……아비도스는 급한 일이 생겨서 불참한다고 해요. 밀레니엄의 리오 씨에게는 대답이 없고……."
101090-206 = "게다가 그중에는 샬레의 선생님이 참석한다는 것을 알고 소환에 응한 사람들도 많은데…… 이대로라면……."
101090-207 = "……."
101090-209 = "선생님 없이 비대위가 진행되었으나……"
101090-213 = "……이상이 현재 키보토스 전역에 발현한 초고위급 에너지 질량체 현상의 전모입니다."
101090-214 = "아비도스 사막, D.U. 근교의 버려진 유원지, 밀레니엄 외곽의 폐쇄지, 트리니티와 게헨나 사이의 접견 지역, 밀레니엄 근교의 신도시, ……그리고 D.U. 생텀 타워."
101090-215 = "이 현상을 조사하기 위해 각 자치구의 협력이 필요합니다."
101090-217 = "잠깐만요, 선생님은 어디 계시죠? 분명 <샬레>도 이 비대위에 참석한다고 들었는데요."
101090-218 = "그, 그건……."
101090-219 = "지금 이 사태보다 더 급한 상황이 있습니다. <샬레>와 논의가 필요해요."
101090-220 = "더 급한 상황? 그게 무엇입니까, 사쿠라코 님?"
101090-221 = "그, 그건…… 여기서 말씀드리기가……."
101090-222 = "또 뭘 숨기고 있는 겁니까, 시스터후드는!"
101090-223 = "저희도 선생님에게 전하지 않으면 안 되는 것이 있습니다. 이 사태와 밀접한 관련이 있는 일입니다."
101090-224 = "응? 뭐야? 앞에 쟤 자는데? 괜찮아? 지금 세이아 쨩이 말하고 있는데 엄청 편한가 봐?"
101090-226 = "마코토 선배 일어나세요……. 지금 전부 선배를 쳐다보고 있다고요……."
101090-227 = "킥킥킥……. 자는 게 아니다. 이로하. 자장가도 못되는 소음이 불쾌했을 뿐."
101090-228 = "저기, 이거 언제 끝나? 이부키, 배고파. 오늘 아침도 못 먹었는데……."
101090-229 = "흐응? 자장가? 잘됐네, 응. 그럼 좀 더 깊은 잠에 들 수 있게 내가……."
101090-230 = "미카. 앉아주세요."
101090-231 = "하하하☆ 이건 그냥 의자를 당기려고 한 거였어. 응."
101090-233 = "잠깐만요. 아직 대답을 듣지 못했어요. 선생님은 어디에 계신 거죠?"
101090-234 = "물어보나 마나지. 총학생회가 숨기고 있는 거겠지! 그러니까 이 자리는 의미가 없다는 거다!"
101090-235 = "이 자리는 총학생회의 음모야! 그 정도 꿍꿍이도 파악하지 못해서야 한 학원의 지배자라고 할 수 있겠나!"
101090-236 = "선배가 그런 소리하면……."
101090-239 = "여러분…… 조용히 해주세요. 선생님은 지금 저희도 행방을 찾고 있는 중이고……."
101090-240 = "행방을 찾고 있다……? 선생님이 사라졌다는 뜻입니까?"
101090-241 = "더이상의 논의는 무의미하다. 샬레라면 모를까 총학생회랑 할 이야기는 없어! 이로하, 이부키! 사츠키! 돌아간다!"
101090-242 = "네? 자, 잠깐만요……!"
101090-243 = "……이 상황, 확실히 수상한 게 한두 개가 아닙니다."
101090-244 = "네. 저희도 저희 나름대로 이 상황을 분석해보겠습니다. 세이아 씨, 미카 씨."
101090-245 = "……이 상황. 협력을 기대할 수 있는 상태는 아니네요."
101090-246 = "……."
101090-248 = "그런데 잠깐! 푸딩이 없잖나! 푸딩! 이 몸께서 친히 여기까지 왔는데!"
101090-249 = "회장…… 학원에서 급한 전갈입니다."
101090-250 = "……뭐?! 쿠데타가?! 내가 자리를 비운 사이에 또……!?"
101090-251 = "이번엔 또 어디라고? 한겨울냉수마찰총연맹? 그런 데가 있었나……? 아무튼 돌아가자, 토모에! 쿠데타를 진압하러 가는 거야!"
101090-253 = "……하아. 뭔가 잘 진행이 안되네요……."
101090-254 = "언제까지 해야 하는 거야, 이거……."
101090-255 = "……다음 회의는 어디 어디 차례죠?"
101090-256 = "네. 수석 행정관님. 다음 자치구는……."
101090-261 = "다음은 없어."
101090-262 = "!!"
101090-263 = "재, 재무실장님……!!"
101090-264 = "아오이……."
101090-269 = "방위실장이 행방불명되었어. 이 비대위를 통해 가장 많은 권한 침해를 받을 사람이 하필 지금 타이밍에 없어지다니."
101090-270 = "그건……."
101090-271 = "그리고 동시에 샬레의 선생님도 행방불명. 우연이라고 하기엔 공교롭지 않아?"
101090-272 = "……."
101090-273 = "SRT의 해체 후 생긴 공백을 PMC를 이용해서 메꾸려고 한 것도 확인되었어. 무기명으로 거래되었지만, 재무제표를 추적해서 알아낼 수 있었지."
101090-274 = "사설 기업에게 총학생회의 권력을 나눠주는 계획…… 이것도 당신이 한 거야?"
101090-275 = "……."
101090-276 = "수석행정관. 이 모든 사태의 배후에 당신이 있는 거야? 어디서부터가 당신의 계획이지? SRT의 해산? 샬레의 수립? 아니면……."
101090-278 = "총학생회장의 실종……?"
101090-279 = "그런, 저는……."
101090-280 = "미안해. 린 선배. 여기까지야."
101090-284 = "그, 그건……."
