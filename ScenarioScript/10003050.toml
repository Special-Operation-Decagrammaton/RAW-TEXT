[translation]
10003050-1 = "제5화;미식연구회, 너마저……!"
10003050-8 = "미식연구회, 너희 문제아들이 여긴 또 어쩐 일이야? 또 무슨 사고를 치려고?"
10003050-9 = "(그러고 보면 그때 SNS에서 보았던 계정 중에 분명…….)"
10003050-10 = "어머, 저희는 딱히 사고를 치러 온 게 아니랍니다?"
10003050-11 = "맞아! 우리는 그냥 옥수수를 팔러 왔을 뿐이라고!"
10003050-12 = "……?"
10003050-13 = "……옥수수?"
10003050-17 = "여름 해변이나 축제에서 먹는 구운 옥수수는, 왜 그리 맛있는 걸까."
10003050-18 = "여러분들은 그 이유가 궁금하지 않으신가요? 분명히 같은 옥수수를 먹는 것이지만, 어째서 맛이 다른가."
10003050-19 = "여름을 맞이하여 그 의문에 대해 저희는 끊임없이 궁구에 궁구를 거듭했지만. 결론은 하나."
10003050-21 = "……직접 해보지 않으면 모른다."
10003050-24 = "그렇게 생각했기에 이번에 직접 옥수수를 팔아보고자, 해변을 찾아온 거랍니다."
10003050-25 = "네☆ 여기서 마침 불량배들과 헬멧단의 다툼이 있다며, 인터넷에서 뜨겁길래 말이에요~"
10003050-26 = "문제아들이 서로 싸우면, 걔네도 그렇고 구경하러 온 사람도 무지 많을 거 아냐? 이건 사업적으로도 훌륭한 판단인 거지!"
10003050-27 = "맞아! 팔고 남은 건 우리가 먹을 거고!"
10003050-28 = "아니, 다 팔아야지! 무겁게 들고 왔는데!"
10003050-32 = "……그런데 왜 해변에 아무도 없는 걸까요?"
10003050-33 = "그런 건 아무래도 좋아. 축제는 전부 끝났어. 썩 꺼져!"
10003050-34 = "후후……."
10003050-35 = "어머나☆ 꺼지라니."
10003050-36 = "……후후후. 저희 미식연구회, 미식의 추구를 가로막는 방해물에게서 등을 돌려 도망쳐 본 적은 없습니다."
10003050-37 = "하루나가 그렇게 얘기하니, 이어지는 전개는 뻔한 느낌이죠? 게다가 보아하니……."
10003050-39 = "아무래도 지금은, 선도부장이 보이질 않는 것 같은데요?"
10003050-40 = "(뜨끔!)"
10003050-42 = "(……이거, 곤란한 느낌이네요.)"
10003050-47 = "후후후……. 그럼 미식을 향한 올곧은 저희의 집념. 여기서 보여드리도록 하죠."
10003050-48 = "옳소! 옥수수를 먹게 해달라!"
10003050-52 = "간신히 문제아 녀석들을 처리했다고 생각했는데! 이제 와서 또 소동을 일으키게 둘까 보냐! 모두 막아!"
10003050-53 = "넵!!"
10003050-54 = "하아……. 전투, 개시합니다."
