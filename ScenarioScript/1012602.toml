[translation]
1012602-1 = "특별한 묘약"
1012602-2 = "(카노에가 답장이 없어 일단 오컬연 기숙사로 향했다.)"
1012602-8 = "오컬연 기숙사"
1012602-10 = "어서 와…… 선생."
1012602-11 = "역시 우리는 전생부터 사랑하던 사이. 한걸음에 달려와 줬구나."
1012602-12 = "[s1] \"저, 전생……?\"\n[s2] \"사랑?!\""
1012602-15 = "그래. 우린 전생에 사랑하는 사이였어."
1012602-16 = "……응? 아무것도 기억 못 하는 눈치네."
1012602-17 = "그렇게나…… 나한테 좋아한다고 이야기 해놓고선……."
1012602-23 = "당신이 좋아하던 내 서늘한 체온도 전부 잊어버린 거야?"
1012602-24 = "[s] \"엇? 왜 이렇게 손이 차가워……?\""
1012602-25 = "역시 잊은 거구나."
1012602-26 = "나는 손이 차가워도…… 가슴만은 뜨거운 여자……."
1012602-27 = "당신과의 전생도 잊지 않고 기억하는…… 마음 깊은 여자……."
1012602-32 = "그리고 여러 오컬트에 정통한 여자이기도 하지……. 히히."
1012602-33 = "자…… 지금 바로 떠올리게 해줄게."
1012602-34 = "그러기 위해서…… 선생을 부른 거야."
1012602-35 = "기다려 봐. #n연금술로…… 전생의 기억을 살리는 약을 만들 테니까."
1012602-36 = "하지만 아무런 재료 없이 시작할 순 없지."
1012602-37 = "그래서…… 재료가 필요해. 선생의 기억이 깃든 특별한 재료가."
1012602-38 = "[s] \"그 재료가 뭔데……?\""
1012602-39 = "선생의 소지품."
1012602-40 = "자, 가지고 있는 거 전부 내놔. #n물론, 입고 있는 옷도…… 하나도 남김없이."
1012602-41 = "이제 전부 내꺼야. 이히히……."
1012602-42 = "[s] \"……?!\""
1012602-49 = "겁먹었구나……. 미안."
1012602-50 = "농담이야……. 가진 걸 다 줄 필요는 없어. 소지품 하나 정도면 충분해."
1012602-51 = "주머니에 있는 동전이나…… 작은 메모지 같은 것도 괜찮으니까."
1012602-52 = "[s] \"그게 정말로 필요해……?\""
1012602-53 = "물론……."
1012602-54 = "이미 연금술용 가마를 준비해 뒀어."
1012602-55 = "재료를 넣고 알맞게 휘저으면…… 원하는 아이템이 나오는 신기한 가마지."
1012602-56 = "히히, 어때? 선생도…… 보고 싶지 않아?"
1012602-60 = "[ns3] 호기심을 참지 못하고 고개를 끄덕인다.\n[ns4] 장난을 치는 것 같으니 일단 어울려준다."
1012602-63 = "……그래. 이제야 말이 통하네."
1012602-64 = "그럼 소지품을 하나 줘……. 끝내주는 묘약을 만들 테니까."
1012602-65 = "[ns5] 주머니 속에 있던 손수건을 건넨다.\n[ns6] 가방에서 펜을 꺼내 건넨다."
1012602-68 = "이것이 선생의 소지품…… 이거라면 좋은 촉매가 될 거야."
1012602-69 = "이건 내 주머니에 잘 넣어두고……."
1012602-70 = "[s] \"그 소지품을 가마에 넣는 거 아니었어?\""
1012602-71 = "묘약은 먹는 거잖아."
1012602-72 = "못 먹는 걸…… 넣으면 안 돼."
1012602-73 = "난 먹는 거로는 장난 안 쳐…… 히히……."
1012602-74 = "[s] (의외로 상식은 있구나…….)"
1012602-75 = "그럼 본격적으로 묘약을 만들어 볼까……."
1012602-76 = "우선…… 데친 토마토와 각종 채소를 잘 썰어주고……."
1012602-80 = "[ns] \"토, 토마토는 언제 데쳐놓은 거야?\""
1012602-81 = "히히, 난 모든 것이 철저한 여자니까……."
1012602-82 = "그 다음엔…… 밑 간을 한 쇠고기를 볶고 양념장을 섞어서……."
1012602-88 = "[ns] \"어…… 묘약 만드는 거 맞지?\""
1012602-89 = "그래……. 이건 틀림없는 묘약이야."
1012602-90 = "전생의 사랑이 떠오를 정도로 기가 막힌 묘약."
1012602-91 = "다음엔…… 준비한 재료들을 넣고 끓이면서……."
1012602-93 = "(이후로도 카노에가 가마에 다양한 재료를 넣으며 뭔가를 만들었다.)"
1012602-97 = "[ns] \"좋은 냄새다…….\""
1012602-98 = "(그렇게 잠시 후…….)"
1012602-101 = "자……. 완성됐어."
1012602-102 = "이것이 바로 전생의 사랑이 떠오르는 묘약……."
1012602-106 = "내 사랑이 가득 담긴 토마토 비프스튜야."
1012602-107 = "[s] \"묘약이 아니잖아!\""
1012602-108 = "묘약이지. 선생은 그걸 먹고 내 진심을 깨닫게 될 테니까."
1012602-109 = "그럼 사양하지 말고 먹어봐……. 정신이 번쩍 들 거야……."
1012602-110 = "[ns7] 진짜 묘약인지는 모르겠지만 일단 먹어본다.\n[ns8] 환상적인 향기에 이끌려 나도 모르게 스튜를 먹는다."
1012602-117 = "[ns] \"아니, 이 맛은……!!!\""
1012602-118 = "히히, 어때? 전생이 막 떠오르지……?"
1012602-119 = "전생에 이어 현생에서도…… 나처럼 좋은 여자가 곁에 있어 주면 좋겠지……?"
1012602-120 = "[s] \"엄청나게 맛있어!!\""
1012602-124 = "[ns] \"어렸을 적에, 자주 먹던 맛이다…….\""
1012602-125 = "어, 어릴 적? #n조금 더 거슬러 올라가줬으면 하는데……."
1012602-129 = "그렇군……. 나도 실패할 때가 있는 건가……."
1012602-130 = "히히, 하지만 포기하지 않아."
1012602-131 = "묘약이 통하지 않는다면, 대화로 추억을 떠올려 주겠어……."
1012602-132 = "선생이 어디에 가더라도…… 날 떠올릴 정도의 강렬한 추억을."
1012602-133 = "히히…… 이히히……."
1012602-134 = "이히히힛……!"
1012602-136 = "(……이후 카노에와 스튜를 즐기며 다양한 이야기를 나누었다.)"
