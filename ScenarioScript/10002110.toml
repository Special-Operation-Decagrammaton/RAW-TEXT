[translation]
10002110-1 = "제11화;비치 발리볼"
10002110-2 = "(어느덧 리스트에 남은 것도 두 개 남짓.)"
10002110-4 = "바로 비치 발리볼인 거예요!"
10002110-5 = "이번에는 제대로, 비치발리볼 공도 있다고요!"
10002110-6 = "사실 그것도 선생님이 새로 사 주신 거지만요."
10002110-7 = "아하하……"
10002110-8 = "감사합니다, 선생님. 해변도 이제야 좀 한산해진 것 같고……"
10002110-9 = "불량배 분들도 안보이니…… 이번에야말로 문제없을 거 같아요."
10002110-10 = "[s1] \"지쳐 보여, 히후미.\"\n[s2] \"눈이 죽어 있어…….\""
10002110-11 = "네? 아, 아니에요……"
10002110-12 = "네? 아, 아니에요……"
10002110-13 = "그냥…… 뭔가…… 어디서부터 잘못된 것일까, 그런 생각이…… 아우……."
10002110-14 = "제가 처음에 생각한 여름 해변은 이런 게 아니었는데……."
10002110-15 = "아즈사 쨩이랑 그냥 즐겁게 보내려고 한 거였는데."
10002110-16 = "난 즐거운데?"
10002110-17 = "아니에요…… 여름 해변이라는 건……."
10002110-18 = "반강제로 미션을 수행하는 것도 아니고, 이상한 해삼 주스를 먹는 것도 아니고, 불량배 분들의 습격을 몇 차례나 받는 것도 아니에요……."
10002110-19 = "또 뭔가 하려고 하면 '이녀석들 드디어 찾았다!' 하면서 방해가 들어오겠죠……."
10002110-29 = "여기 있었구나! 이 녀석들, 드디어 찾았다!!"
10002110-30 = "이런 곳에 숨어 있었다니! 찾느라 한참을 고생했다고!"
10002110-35 = "[ns] \"…….\""
10002110-37 = "불량배 습격! 응대합니다!"
10002110-38 = "네……."
