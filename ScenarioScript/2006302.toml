[translation]
2006302-1 = "少女のピックアップ"
2006302-2 = "第2駐車場"
2006302-3 = "（第2駐車場に向かうと――）"
2006302-4 = ""
2006302-7 = ""
2006302-8 = "（すでにアズサが待っていた）"
2006302-9 = "来たか、先生。"
2006302-10 = "今度、副戦車長を任されることになった。#n操縦手を兼ねるから、戦車を運転する役割だ。"
2006302-11 = "一応、操縦にはそれなりの自信がある。"
2006302-12 = "でも街乗りするのは慣れてないから……。"
2006302-13 = "知らない場所、知らない人、知らない生活――#n少しずつ慣れてきたが、まだ緊張する。"
2006302-14 = "だから、練習に付き合ってほしい。"
2006302-15 = "[s] \"喜んで！\""
2006302-16 = "先生は、いつもそうやって受け止めてくれるね。"
2006302-17 = "では、早速戦車に乗って――"
2006302-18 = ""
2006302-20 = ""
2006302-21 = "――ん？"
2006302-22 = ""
2006302-24 = ""
2006302-25 = "んん……？"
2006302-26 = ""
2006302-28 = ""
2006302-29 = "[ns] \"どうしたの？\""
2006302-30 = "戦車が……ない。"
2006302-31 = "この辺りに停めたはずなんだけど……。"
2006302-32 = "[s] \"忘れちゃうことってあるよね……！\""
2006302-33 = "ピックアップ地点は、常に覚えておかなければいけないのに。"
2006302-34 = "どうも車は停めた場所を忘れやすい。"
2006302-35 = "リモコンキーは……電池切れか。目視で探すしかなさそうだ。"
2006302-36 = ""
2006302-40 = ""
2006302-41 = ""
2006302-42 = "……これだ。#n記憶とは少し場所が違う気もするけど。"
2006302-43 = "あとで反省点を洗い出そう。次は注意しないと。"
2006302-44 = ""
2006302-46 = ""
2006302-47 = "なんだ？もうエンジンがかかっている。#n近づくと自動で始動する仕様らしい。"
2006302-48 = "[s] \"……ん？\""
2006302-49 = "さあ、乗ろう。"
2006302-50 = ""
2006302-52 = ""
2006302-57 = ""
2006302-58 = ""
2006302-59 = ""
2006302-60 = ""
2006302-61 = "えっ！？あっ、お、お疲れ様です、先輩――えっ！？"
2006302-62 = "先輩……？"
2006302-63 = "[ruby=しらす]白洲[/ruby]アズサだ。"
2006302-64 = "ところで、私の車両で何をしている？"
2006302-65 = "これは[ruby=私たち]正義実現委員会[/ruby]の戦車ですけど！？"
2006302-66 = "それはおかしい。"
2006302-67 = "勘違いしてしまうのも理解はできる。同じ戦車だからな。#n念のため、もう一度確認した方がいい。"
2006302-68 = "[s] \"たぶん正義実現委員会ので合ってると思う！\""
2006302-69 = "えっ！？"
2006302-72 = "こんな間違いをするなんて……恥ずかしい。"
2006302-73 = "一緒に謝ってくれてありがとう、先生。"
2006302-74 = "車種も同じで駐車位置も似ていた。#nだから……クルセイダーちゃんと誤認した。"
2006302-75 = "……それで、私の戦車はどこに？"
2006302-76 = "こんなことを忘れるなんて、気が緩んでいる証拠だ。#n反省しないと……。"
2006302-77 = ""
2006302-80 = "ん？連絡だ。"
2006302-81 = ""
2006302-83 = ""
2006302-84 = ""
2006302-85 = "車両点検のために移動させた――"
2006302-86 = "――らしい。"
2006302-87 = "私が場所を忘れていたわけじゃなかったのか。"
2006302-88 = "[s] \"そりゃ見つからないよね！\""
2006302-89 = "はあ……よかった。"
2006302-90 = "ここまで腑抜けていたのかと思って、少し焦った。"
2006302-91 = "[s1] \"これくらい普通だよ！\"\n[s2] \"誰でもやる凡ミスだよ！\""
2006302-94 = "そうなのか？"
2006302-95 = "普通の凡ミス……。"
2006302-96 = "そうか。これは怠慢ではなく……普通のことなんだな。"
2006302-97 = "……そっか。ふふ。そういうことか。"
2006302-98 = "それなら、少し安心した。ありがとう、先生。"
2006302-99 = ""
2006302-101 = ""
2006302-102 = "では、戦車もないことだし……どこかで休憩しよう。"
2006302-103 = "[s] \"運転の練習は大丈夫？\""
2006302-104 = "うん。"
2006302-105 = "今日は代わりに「普通の日常」を覚えたから。"
