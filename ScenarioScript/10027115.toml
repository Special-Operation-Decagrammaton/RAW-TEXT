[translation]
10027115-14 = "동인회장"
10027115-16 = "……."
10027115-17 = "결국 시간에 맞추지 못했군요. <지식해방전선>."
10027115-18 = "어느 정도 예상은 했어요. 기적은 일어나지 않기에 기적이라고 하던가요."
10027115-19 = "어쩔 수 없죠. 평론가이자 동호회의 회장으로서 공평은 지켜야만 할 덕목."
10027115-20 = "언젠가 또 다른 방식으로 인연이 있기를 바라며, 이번은 이쯤에서……."
10027115-25 = "기다려!!!"
10027115-26 = "<지식해방전선>, 지금 막 도착했으니까요!"
10027115-28 = "……거짓말. 정말로, 그 시간 안에 원고를 완성했다는 건가요?!"
10027115-30 = "그렇다…… 받아랏!"
10027115-35 = "이것은, 확실히……!"
10027115-44 = "원고 제출 및 접수 확인 완료했습니다."
10027115-45 = "솔직히 아직도 믿기지 않는 면이 있군요……. 중간에 무언가 불법적인 수단을 사용한 건 아니겠지요?"
10027115-47 = "우리를 뭐로 보고 그러냐……."
10027115-53 = "[ns] \"다들…… 정말로…… 열심히…… 했으니까…….\""
10027115-54 = "서, 선생님?! 여기에서 갑자기 쓰러지시면……!"
10027115-55 = "[s] \"괜찮아! 버텨냈다!\""
10027115-56 = "……정말 괜찮으신 거 맞죠?"
10027115-58 = "그래도, 선생님께서 도와주시지 않았다면…… 분명 해낼 수 없었을 거예요."
10027115-59 = "……여기까지 오는 길에서만 해도 사무국에, 용역부에……. 하아……."
10027115-61 = "사무국과 용역부의 이름이 왜 여기에서 나오는지는 모르겠습니다만, 어쨌든 알았어요."
10027115-62 = "그러고 보니 두 분, 제대로 화해한 모양이군요?"
10027115-64 = "애초에 그렇게 심각하게 싸운 적도 없었다고? 이 정도야 따지고 보면-!"
10027115-65 = "……메루 선배?"
10027115-66 = "……아니, 응. 미안. 확실하게 사과하고 화해했으니까……"
10027115-68 = "알겠습니다. 일단 축하한다는 말을 전해 드리죠. 원고의 내용과 퀄리티에 대해서는."
10027115-69 = "……."
10027115-70 = "굳이 보지 않아도, 여러분의 모습을 보면 능히 짐작되는군요."
10027115-72 = "헹. 또 솔직하지 못해졌구만. 이럴 때는 너무 티가 난다고, 너. 실은 이 메루 님이 못할 줄 알았는데 해낸 것에 놀라고 있지? 감탄하고 있지?"
10027115-73 = "역시 메루리 님……. 나의 좁고 기울어진 잣대로는 파악할 수 없는, 속 깊고 대단하신 분! 하고 놀라고 있는 거지?!"
10027115-74 = "정말이지 당신이란 사람은……!"
10027115-79 = "깜짝이야?! 여기서까지 이러기냐!"
10027115-80 = "당신도 여기까지 와서도 참 변하지 않네요!"
10027115-81 = "그거 내가 할 소리거든?!"
10027115-83 = "그만한 일을 겪었으면 조금은 성장이라는 걸 해 보시죠!"
10027115-84 = "잘 모르는 모양인데, 나는 언제나 성장 중이니까 말이지!"
10027115-89 = "[ns1] \"자, 자. 우리는 원고를 완성했으니.\"\n[ns2] \"남은 건 타카네가 원고를 봐 주는 것뿐이야.\""
10027115-93 = "……이미 두 사람이 화해까지 한 시점에서, 전후 관계가 바뀐 것 같다고는 생각하지만……"
10027115-94 = "절차는 절차이죠. 그리고 비평가로서의 비평은 비평이고요."
10027115-95 = "좋아요. 메루리 씨. 당신의 원고 지금부터 읽어 보도록 하겠어요."
10027115-103 = "자, 자, 자. 여기에서 잠깐, 타임 스톱입니다."
10027115-105 = "어? 누구……?"
10027115-106 = "어머?"
10027115-112 = "이야, 해냈군요. 메루. 분명 그럴 줄 알았다니까요."
10027115-114 = "야쿠모?!"
10027115-115 = "펴, 편집장님? 아니, 부장님!?"
