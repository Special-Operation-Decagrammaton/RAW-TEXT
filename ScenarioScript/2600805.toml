[translation]
2600805-1 = "저는 엄~청난 욕심꾸러기니까요!"
2600805-2 = "(기대 반 걱정 반으로 시즈코와의 약속 장소로 나왔다.)"
2600805-3 = "어서 오세요, 선생님!"
2600805-4 = "백야당 직영 바다의 집에, 잘 오셨습니다!"
2600805-5 = "[s] \"안녕, 시즈코\""
2600805-6 = "네네. 힘든 길을 오셨으니,"
2600805-7 = "시즈코가 서비스를 해 드리죠!"
2600805-8 = "우선은…… 덜렁이 서비스부터 시작할까요?"
2600805-9 = "[s1] \"아니…… 그건 이제 됐으니까.\"\n[s2] \"덜렁이 서비스라……. 그리운걸.\""
2600805-13 = "(그 뒤 시즈코로부터 잔뜩 접객을 받았다.)"
2600805-34 = "(어느덧 시간은 흘러 저녁 무렵이 되어 있었다……)"
2600805-36 = "어떠셨나요, 선생님!"
2600805-37 = "아, 지금은 주인님이라고 불러 드려야 할까요?"
2600805-38 = "선생님으로 괜찮다고요? 네, 그렇게 하죠."
2600805-39 = "그래서, 감상은?!"
2600805-40 = "[s] \"뭔가 바다에 세워진 백야당에 와 있는 느낌이었어.\""
2600805-41 = "역시 그런가요?"
2600805-42 = "바로 그런 반응을 기다리고 있었답니다!"
2600805-43 = "[s] \"고민이 풀린 것 같이 보이네.\""
2600805-44 = "음……"
2600805-45 = "그래요. 여기선 감추는 게 더 부끄러운 일이겠죠."
2600805-46 = "모든 게, 선생님 덕분이에요."
2600805-47 = "제가 뭘 잊고 있었는지 깨우쳐 주신 것도,"
2600805-48 = "그리고 뭘 해야 하는지 알려 주신 것도."
2600805-49 = "[s] \"……난 특별히 한 게 없는 것 같은데 말야……\""
2600805-50 = "뭐, 그렇게 나오실 거라고 생각은 했어요."
2600805-51 = "하지만 선생님이 아니었다면……"
2600805-52 = "전 계속 중요한 것을 놓치고 있었겠죠."
2600805-53 = "자, 부끄러운 이야기는 여기까지!"
2600805-54 = "내일부터는, 언제나의 카와와 시즈코니까요!"
2600805-55 = "자자, 선생님, 그럼 가볼까요!"
2600805-56 = "[s] \"앗, 시즈코, 자 ,잠깐-\""
2600805-64 = "[wa:750]― 선생님, [wa:1400]저, [wa:1150]제가 해야 할 일을 알았어요."
2600805-67 = "― 생각해 보면 [wa:600]당연한 거였는데,"
2600805-69 = "[wa:50]― 이제서야 깨닫다니…… [wa:1800]시즈코 [wa:800]일생의 불찰!"
2600805-72 = "[wa:400]― 알고 계실지도 모르겠지만,"
2600805-74 = "― 전 정말 [wa:350]욕심꾸러기라구요?"
2600805-77 = "― 하고 싶은 것도, [wa:950]갖고 싶은 것도 많지만,"
2600805-79 = "[wa:50]― 그 중 하나도 포기할 수 없어요."
2600805-82 = "[wa:250]― 모두를 [wa:350]즐겁게 하는 것도, [wa:1550]사업가로 성공하는 것도!"
2600805-84 = "― 백야당을 [wa:1150]키보토스 최고의 찻집으로 만드는 것도!"
2600805-87 = "[wa:450]― 저는, [wa:1200]전부 놓치고 싶지 않아요. [wa:1750]전부!"
2600805-89 = "[wa:50]― 물론…… [wa:1250]선생님도요!"
2600805-94 = "우선은, 프랜차이즈를 전반적으로 리빌딩할거에요."
2600805-95 = "신메뉴를 개발하고, 덜렁이 서비스 같은 부가 서비스도 전달하고!"
2600805-96 = "그러려면 많은 걸 공부하고, 많은 걸 배워야겠죠?"
2600805-98 = "무엇이 절 기다리고 있을지,"
2600805-99 = "상상하는 것만으로 두근거려서 멈출 수가 없어요!"
2600805-100 = "할 수 있는 건 뭐든 해 볼 거예요!"
2600805-101 = "해야 할 일이라면 뭐든지 할 거고요!"
2600805-103 = "이 군도를 바다의 집 프랜차이즈로 채워 보일 거예요!"
2600805-104 = "그래서 그런 바다……"
2600805-105 = "마침내 평화로워진 바다를 선생님에게 선물로 드릴 거라고요!"
2600805-106 = "[s] \"그건…… 너무 대단한 선물인데.\""
2600805-108 = "[ns] \"내게 그런 선물을 받을 자격이 있을까……?\""
2600805-110 = "자격의 문제가 아니에요, 선생님!"
2600805-111 = "저, 카와와 시즈코가 그렇게 하겠다고 결정한 거라고요!"
2600805-112 = "그러니까 여기에는 어떤 이견도 필요 없어요!"
2600805-113 = "제가 결정하고, 제가 노력하고, 제가 만들어 나가는 거니까요!"
2600805-114 = "보답은 그저 선생님이 즐거워하시면 돼요."
2600805-115 = "저에게는…… 그걸로 충분하니까요!"
2600805-116 = "[s] \"새삼, 시즈코가 대단하다고 느꼈어.\""
2600805-117 = "후후, 후후후후, 우후후후후!"
2600805-118 = "더 칭찬하셔도 된다구요? 저는 칭찬받으면 받을수록 성장하니까요!"
2600805-119 = "저도 백야당도 이 바다의 집도! 앞으로 더 성장해 나갈 거니까요!"
