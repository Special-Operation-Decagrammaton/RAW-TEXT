[translation]
210-1 = "흉악한 범죄자의 해변가 습격"
210-3 = "……또 나야, 선생. 후후후."
210-4 = "하아, 뭐야 또 너냐? 같은 표정이구만?"
210-5 = "후후. 그래. 선생도 슬슬 이런 패턴에 적응하기 시작한 거겠지? 좋은 신호라고 생각할게. (와작)"
210-6 = "음, 그러니까…… 이번엔 말이지."
210-7 = "교정국을 탈출한 죄수 중 하나가 바닷가 어딘가에서 문제를 일으키고 있나봐."
210-8 = "자세한 내막은 귀찮아서 제대로 보진 않았지만, 호버 크래프트 같은 걸 탈취해서 날뛰고 있는 것 같던데?"
210-9 = "뭐, 그러니까…… 알지? 이번에도 샬레가 나설 차례라는 거."
210-10 = "아하하하, 선생도 대충 이런 전개일 거라고 짐작하고 있었잖아?"
210-11 = "그러니까 그 바닷가로 가서 어떻게든 좀 해결해 달라고."
210-12 = "나는 그동안 이 명란과자를 먹고 있을 테니까. (와작)"
210-17 = "그럼 잘 부탁해 선생~"
