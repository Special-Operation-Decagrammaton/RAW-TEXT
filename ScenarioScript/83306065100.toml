[translation]
83306065100-6 = "응? 무슨 일이 있는 거야? 급양부실에 이렇게 모여있다니."
83306065100-7 = "아, 히나 씨. 그게 말이죠."
83306065100-8 = "최근에 이 근처에서 고양이의 울음소리가 들려온다고 말씀하시는 분들이 계셔서 말이에요."
83306065100-9 = "고양이……? 그게 왜?"
83306065100-10 = "그게…… 아무래도 급양부 근처에서 이때까지 좀처럼 길고양이를 본 적이 거의 없기도 하다 보니."
83306065100-11 = "만약 정말로 고양이가 있는 거라면, 혹시 도움을 청하려고 울고 있는 게 아닐까~ 하는 이야기가 나왔거든요."
83306065100-12 = "도움 요청, 말이지."
83306065100-13 = "……흐음."
