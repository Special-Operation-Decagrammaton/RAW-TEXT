[translation]
10051090-1 = "제9화;의도된 우연"
10051090-2 = "샬레 사무실"
10051090-3 = "주군, 주군!"
10051090-4 = "그…… 그……"
10051090-5 = "부장이 이상합니다……!"
10051090-6 = "[s1] \"일단 침착해, 이즈나.\"\n[s2] \"그런데 미치루가 이상하다니?\""
10051090-9 = "그 저번에…… 함께 라멘 먹고 헤어질 때까지는 괜찮았는데……."
10051090-10 = "그날 이후로 무언가가 변했습니다!"
10051090-11 = "[s] \"변했다니?\""
10051090-12 = "눈에서 생기를 잃었다고 해야 하나, 의욕을 잃었다고 해야 하나, 소심해졌다고 해야 하나……."
10051090-13 = "심지어 어제는 이런 일도 있었습니다!"
10051090-15 = "백귀야행 시장 길목"
10051090-17 = "하아, 잘 먹었습니다~."
10051090-18 = "오늘도 <닌자 정식>은 저희를 실망시키지 않는 것 같습니다!"
10051090-19 = "그렇죠, 부장?"
10051090-20 = "……."
10051090-21 = "부장?"
10051090-22 = "어? 응, 아, 응. 좋지, 좋고말고."
10051090-23 = "혹시 무슨 일 있습니까……?"
10051090-24 = "어? 아니 아니, 일은 무슨. 난 괜찮아."
10051090-28 = "(저기, 아무리 봐도 괜찮지 않아 보입니다만……)"
10051090-29 = "그러면 부장, 다음 주에 촬영할 <소녀인법첩 미치룻치>의 소재에 대해서 이야기해 볼까요?"
10051090-30 = "저기 포목점 옆에 새로운 찻집이 생겼던데, 거기서 이야기해보면 어때요?"
10051090-31 = "응? 아니, 다음 주는 영상을 찍을 생각이 없……."
10051090-32 = "생각해둔 게 없으니 토의를 해야겠다구요? 네! 알겠습니다, 부장!"
10051090-33 = "아니, 그게, 난……."
10051090-34 = "그 찻집에서 마침 새로운 당고 메뉴도 내놨다고 해요! 가봐요, 부장!"
10051090-35 = "바로 저기에 찻집이……."
10051090-40 = "저기 잠깐만 이즈나 쨩, 그게……."
10051090-45 = "퍼엉!"
10051090-47 = "에, 엥……?!"
10051090-48 = "누군가가 포목점 앞에 연막을 터뜨렸습니다!"
10051090-53 = "좋아! 연막은 잘 터지는군!"
10051090-54 = "역시 이런 불친절한 가게는 사람들의 눈에서 가려 버려야 해!"
10051090-55 = "맞아! 멋대로 손님의 요청을 무시하고, 자신의 기준만 강요하다니."
10051090-56 = "이런 가게는 망해도 싸다고!"
10051090-60 = "지금 남의 가게 앞에서 왜 이러시는 거예요?!"
10051090-61 = "왜긴 왜야! 감히 손님의 요청을 무시하는 그 불친절한 태도 때문이지!"
10051090-62 = "제가 요청을 무시했다고요……?"
10051090-63 = "포목점에서 커피랑 타코야키를 내놓으라는 요청을 어떻게 들어드려요?!"
10051090-64 = "손님이 달라면 줄 것이지 뭘 그렇게 말이 많아?"
10051090-65 = "그런 꽉 막힌 마인드로 이 업계에서 살아남을 수 있을 것 같아?"
10051090-66 = "무슨 소리예요?! 지금 제가 업계에서 살아남는데 제일 문제가 되는 건 여러분들이거든요?"
10051090-67 = "큿, 논리적인 대응……!"
10051090-68 = "당황하지 마! 우리가 받을 돈만 생각해!"
10051090-69 = "잠깐, 지금 뭐라고요? 돈을 받아요? 누구한테?"
10051090-70 = "헛, 말실수……!"
10051090-75 = "부장, 망량즈 녀석들이 포목점 앞에서 난동을 부리고 있습니다!"
10051090-76 = "저희가 가서…… 엥? 부장?"
10051090-79 = "응? 왜, 이즈나 쨩?"
10051090-80 = "부장! 저희가 나설 때인 것 같습니다!"
10051090-81 = "응? 그, 그렇긴 하지만……."
10051090-82 = "저런 일은 그, 백화요란이 담당할 일…… 아닐까……?"
10051090-83 = "뭣보다, 우리 지금 츠쿠요도 없고……."
10051090-84 = "츠쿠요가 없다고 닌자의 정신이 없는 것이 되지는 않잖아요?!"
10051090-85 = "우으으, 그건 그렇긴 한데……."
10051090-90 = "부, 부장!"
10051090-95 = "샬레 사무실"
10051090-96 = "……라는 일이 있었습니다."
10051090-97 = "엄청나게 의기소침해지고, 만사에 소심해지고……."
10051090-98 = "이즈나는 부장의 이런 모습이 익숙하지 않습니다……"
10051090-99 = "[s] \"확실히, 평소의 미치루의 모습이 전혀 아니네…….\""
10051090-100 = "주군도 그렇게 생각하시죠?"
10051090-101 = "이유가 뭘까요……?"
10051090-102 = "[s] \"이즈나 쨩은 어떻게 생각해?\""
10051090-103 = "……."
10051090-104 = "……사실 이유는 알 것 같습니다."
10051090-105 = "츠쿠요 공이 인법연구부로 돌아오지 않고 있는 것…… 그게 이유일 겁니다."
10051090-106 = "때문에 부장이 의기소침해졌고요. 그래서 이즈나는 일부러 더 밝게 행동하려 했습니다."
10051090-107 = "둘 다 축 처져 있어서는 어떤 일도 제대로 안 될 테니까요."
10051090-108 = "하지만 주군, 이제는 어떻게 해결해야 할지 모르겠습니다……!"
10051090-109 = "츠쿠요 공과는 아직도 연락되지 않고 있고…… 물론 신년 기념 패션쇼 준비 영상은 계속 올라오고 있어서 건강해 보이긴 하지만요……."
10051090-110 = "[s] \"그럼 함께 츠쿠요가 있는 곳을 찾아볼까?\""
10051090-111 = "그러고 싶지만…… 부장은 움직이지 않을 것 같습니다."
10051090-112 = "의도적으로 츠쿠요 공과의 만남을 피하고 있는 것 같아서요……."
10051090-113 = "그렇다 하더라도, 어떻게든 둘이 만나게 해야 한다고 생각합니다, 주군."
10051090-114 = "그래야 해결의 실마리를 잡을 수 있을 테니까요."
10051090-115 = "[s3] \"미치루와 츠쿠요가 일단 만나기만 하면 되는 거지?\"\n[s4] \"그렇다면 지금 생각난 방법이 하나 있어.\""
10051090-121 = "뭡니까, 주군?!"
10051090-122 = "[s] \"일단 알아보고, 내가 다시 연락을 줄게.\""
10051090-123 = "넵! 주군! 기다리고 있겠습니다!"
10051090-128 = "……어려운 부탁은 아니군요, 선생님."
10051090-129 = "제가 한번 잘 얘기해 보겠습니다."
10051090-130 = "[s] \"갑자기 이런 부탁을 하게 되어서 미안해.\""
10051090-131 = "냐하하, 미안하다뇨."
10051090-132 = "음양부 입장에서는 이걸로 선생님 1회 한정 무제한 사용권을 얻은 셈인데, 오히려 남는 장사죠."
10051090-133 = "[s] \"어디서 발급된 거야, 그거……!\""
10051090-135 = "냐하하, 기대하시라고요?"
10051090-139 = "그나저나 그쪽에서도 망량즈가 말썽이었군요."
10051090-140 = "이 아이들, 연말 들어서 선을 조~금 넘는 것 같단 말이죠. 뭐 일단 이쪽은 나중 일이고……."
10051090-141 = "자 아무튼, 선생님의 부탁을 해결하기 위해선 어디에 연락을 해봐야 할까요……."
10051090-142 = "어디 보자……"
10051090-143 = "<백귀야행 신년 기념 패션쇼 운영위원회>…… 여기와 먼저 연락을 해봐야 할 것 같군요."
10051090-145 = "(며칠 후, 드디어 연말이 성큼 다가왔다.)"
10051090-147 = "그러니까…… 여기서 닌자 관련 행사가 열린다고?"
10051090-148 = "그렇습니다, 부장!"
10051090-149 = "그럼 우리가 굳이 이렇게 드레스를 차려입을 필요가 있었나……?"
10051090-150 = "새해가 목전입니다, 부장! 다들 한 해 동안 아껴둔 예쁜 옷을 입고 올 텐데, 저희가 뒤처질 수는 없습니다!"
10051090-151 = "그건 맞는 말이긴 한데……."
10051090-152 = "잠깐만, 그런데 여기 뒷문 아니야? 행사장 정문은 저 반대편인 것 같은데……."
10051090-158 = "아, 오셨군요."
10051090-159 = "치도리 미치루 님, 쿠다 이즈나 님, 맞으시죠?"
10051090-160 = "예! 맞습니다!"
10051090-161 = "오 이즈나 쨩, 예약까지 미리 해둔 거야?"
10051090-162 = "[s] \"안녕, 미치루 쨩, 이즈나 쨩.\""
10051090-163 = "후냐앗?! 선생 공도 와 있었어?!"
10051090-164 = "선생 공까지 와 있을 정도면…… 이거 분명 굉장한 행사겠는데?!"
10051090-165 = "자, 그럼 여러분. 먼저 이 인이어 무전기부터 받으시죠."
10051090-166 = "응? 웬 무전기?"
10051090-167 = "오, 행사 안내를 무전을 통해 해주는 거야?"
10051090-168 = "여러분의 업무 내용은 간단합니다. 인파 속을 돌아다니면서, 수상한 사람이 있으면 보고하거나 제압하면 됩니다."
10051090-169 = "좋아, 수상한 사람을 제압하면…… 잠깐만."
10051090-170 = "업무? 제압?"
10051090-171 = "이즈나, 지금 이거……."
10051090-175 = "백귀야행 신년 기념 패션쇼에 오신 것을 환영합니다, 경호원분들."
10051090-180 = "이게 뭐야아아아?!"
10051090-181 = "경호원이라니! 이즈나 쨩, 우리 속은 것 같아! 이거 채용 사기야! 주최 측의 농간이라고!"
10051090-182 = "아뇨, 그렇지 않습니다, 부장!"
10051090-183 = "이 일은 제가 주도한 거니까요!"
10051090-184 = "그건 또 무슨 소리야?!"
10051090-185 = "잠깐, 다시 보니 이 건물……."
10051090-186 = "츠쿠요가 참여하는 신년 패션쇼 행사장 아냐?!"
10051090-187 = "이게 무슨 닌자 관련 행사야?!"
10051090-188 = "닌자가 참여한다면! 그곳이 어디든 닌자 관련 행사입니다!"
10051090-189 = "설마 부장, 츠쿠요가 닌자의 마음을 가지고 있지 않다고 말하는 건 아니죠?"
10051090-190 = "당연히 그건 아니지만……!"
10051090-191 = "나, 나는, 츠쿠요를……."
10051090-192 = "자, 갑시다, 여러분. 시간이 다 됐어요."
10051090-193 = "갑시다, 부장!"
10051090-197 = "끄, 끄아앙……!"
