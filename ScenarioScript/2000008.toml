[translation]
2000008-1 = "비가 내리면 센티멘탈"
2000008-2 = "밀레니엄 교내 제42 도서실"
2000008-5 = "아. 선생님."
2000008-6 = "선생님도, 책을 찾으러 온 거야?"
2000008-7 = "응? 나도 웬일이냐고?"
2000008-8 = "후후. 무슨 책을 읽고 있을지, 궁금해?"
2000008-9 = "맞춰볼래?"
2000008-10 = "[s1] \"100% BL이다.\"\n[s2] \"과학 전문 서적?\"\n[s3] \"시집……?\""
2000008-11 = "후훗. 모두 틀렸어."
2000008-12 = "후훗. 모두 틀렸어."
2000008-13 = "후훗. 모두 틀렸어."
2000008-14 = "짜잔. 이런 책이야."
2000008-15 = "[s] \"<소녀들을 위한 심리학 개론>?\""
2000008-16 = "다들 의외라는 반응이더라."
2000008-17 = "하지만…… 최근 선생님과 다양한 물건을 만들며……"
2000008-18 = "합리만큼이나 누군가의 마음을 고려해야 한다고 생각했어."
2000008-19 = "사실 물리학이나 심리학은 많이 달라."
2000008-20 = "낯설게 느껴지는 것이 사실이야."
2000008-21 = "물에 돌을 던졌을 때, 어째서 수면에 파문이 생기는가를 생각하는 게 물리."
2000008-22 = "사람에게 말을 던졌을 때, 어째서 마음에 파문이 일어나는가를 생각하는 것이 심리."
2000008-23 = "오늘은 그런…… 내 부족한 부분을 더 공부하고 싶어."
2000008-24 = "그럼…… 선생님에게도 유용한 무언가를 만들 수 있지 않을까?"
2000008-26 = "후훗. 칭찬해줘서 고마워."
2000008-27 = "응? 근데……."
2000008-28 = "선생님은 책을 빌리러 온 게 아니라고?"
2000008-29 = "[s] \"비가 오니까 우산을 빌리고 싶어.\""
2000008-30 = "아하. 그렇구나."
2000008-31 = "그거라면 마침 좋은 게 있어. 내가 직접 제작한……"
2000008-32 = "[s] \"아니, 평범한 우산이면 좋겠어.\""
2000008-33 = "으음. 자폭 기능이 있는 건 아니지만……"
2000008-34 = "알겠어."
2000008-35 = "그러한 주문에도 대응하는 게, 밀레니엄의 마이스터지."
2000008-36 = "지금 내가 준비하는 건……"
2000008-37 = "종래의 우산이라는 것에 대한 패러다임을 완전히 바꿀만한 물건이야."
2000008-38 = "[s] \"제발 평범한 우산이면 좋겠어.\""
2000008-39 = "으음. 어쩔 수 없나."
2000008-40 = "평범한 우산이라면…… 내 것밖에 없는데."
2000008-41 = "……"
2000008-42 = "…… 후훗."
2000008-43 = "같이 쓰고 갈까?"
2000008-44 = "샬레까지 만이라면, 나도 가는 길이니까."
2000008-45 = "아, 잠깐만 기다려줘. #n책을 대여하고 올 테니까."
2000008-51 = "가자 선생님."
