[translation]
1901-1 = "선도부 정기 주간 회의"
1901-5 = "자아, 이번주 선도부 정기 주간 회의를 시작합니다."
1901-6 = "하아."
1901-7 = "……아코. 오늘 <만마전> 녀석들과 미팅이 있으니까, 빠르게 진행해줘."
1901-8 = "네. 알겠습니다. 다음 회의는 15분 뒤에 있으니 그 전까진 종료될 거 같아요."
1901-9 = "먼저, 97-44 구역에서 일어난 정체불명의 폭발에 대한 보고서."
1901-10 = "확인 결과 97-44 구역의 폭발은 발파용 이중목적 고폭탄이 원인인 것으로 확인되었습니다."
1901-11 = "이것은 온천개발부의 소행으로……. 현재 범인들은 도주 중이며 선도부 3개 소대가 추격 중입니다."
1901-12 = "이유는?"
1901-13 = "……온천개발입니다. 늘 그렇듯이."
1901-14 = "……잠깐. 97-44 구역이라면 고속도로 한가운데아냐? 거기다 온천을 개발하겠다고 고폭탄을 터트렸다고?"
1901-15 = "네. 맞습니다. 온천이라는 게 이쪽 사정을 봐주면서 있어주는 건 아니며……"
1901-17 = "묻습니다. 무슨 원인으로 이런 짓을……."
1901-18 = "온천이 있는 곳이라면 어디든 상관없어! 파고 또 파는 거야!"
1901-19 = "하하하! 불태워라! 오물은 소각이다아!"
1901-20 = "불도저로 밀어버려! 철거! 철거다! 이것이 바로 개발지상주의다!!"
1901-21 = "(……무슨 말인지 도저히 모르겠어요. 어쩌라는 거죠……?)"
1901-26 = "……라는 게 치나츠 씨의 보고서 요지인데요. 무슨 말인지는 모르겠지만."
1901-27 = "추측컨대 고속도로 휴게소…… 같은 걸 만들 생각이었나 보네요."
1901-28 = "……하아."
1901-29 = "해당 고속도로가 약 3달 동안 정체가 예상되어서 해당 물동량의 54%가……."
1901-30 = "됐어. 그 후처리는 만마전 녀석들에게 맡기면 돼. 다음은?"
1901-31 = "네. 다음은 제 3 학교 식당이 폭발한 사건인데요……."
1901-32 = "식당이 폭발…… 미식 연구회인가?"
1901-33 = "맞습니다. 부장님."
1901-34 = "이유는?"
1901-35 = "이번에는…… 가라아게에 왜 레몬을 내어주지 않느냐라는 이유로……."
1901-36 = "레몬……."
1901-37 = "급양부장 후우카 씨를 인질로 잡고 제압하러 온 선도부원들에게 난상 토론을 벌였습니다……."
1901-39 = "자아, 묻습니다. 선도부 여러분. 이것은 매우 중요한 문제입니다."
1901-40 = "가라아게에는 레몬이 있어야 하나요, 없어야 하나요!!"
1901-41 = "어느쪽입니까? 여러분들은?"
1901-42 = "뭐, 뭐……?! 어느쪽이냐면…… 나, 나는 있어야 하는 쪽인데……."
1901-43 = "뭐야? 모처럼의 튀김이 눅눅해지잖아! 그런 걸 왜 뿌리는 거야!!"
1901-44 = "뭐?! 상큼한 레몬향이 있어야 튀김의 느끼함이 잡히는 거잖아!!"
1901-45 = "후후, 좋습니다. 미식에 대한 진지한 탐구! 그것이 바로 저희 미식연구회가 원하는 모습!"
1901-46 = "무엇이 옳은 겁니까? 무엇이 진리죠? 자아, 답을 알려주세요, 여러분!!"
1901-47 = "(웅성웅성-) 그러니까, 레몬이……."
1901-48 = "(웅성웅성-) 아니, 튀김옷이……."
1901-49 = "(웅성웅성-) 그렇다면 소금은 어때?"
1901-50 = "(웅성웅성-) 갑자기 그쪽 얘기냐! 난 소스 쪽이지만!"
1901-51 = "……후후후."
1901-55 = "(어느 쪽이든 상관없으니까 빨리 나좀 구해달라고…….)"
1901-60 = "그 뒤 난상토론이 패싸움으로 번져서, 이오리 씨를 포함한 다수의 선도부원들이 입원하고 그 사이 미식 연구회는 도망을……."
1901-61 = "……하아."
1901-62 = "급양부장에게 피해금 현황 파악을 해서 제출해달라고 해."
1901-63 = "식당이 또 없어져서야 다음엔 주먹밥으로 식사를 하게 될 지도 모르니까."
1901-64 = "알겠습니다. 부장님."
1901-65 = "다음은, 불법으로 결석계를 위조해서 장당 2천엔에 판매한 일당이 검거되었는데요……."
1901-66 = "흥신소?"
1901-67 = "네 맞습니다. 흥신소 68인데……. 교무원 사무실에 불법 침입해서 결석계 도장을 복제해서 이런 짓을 저질렀습니다……."
1901-68 = "당당하게 학원 게시판에, <마음대로 결석할 수 있는 결석계 팝니다> 라는 홍보문을 게시했고……."
1901-69 = "결석계라니…… 우리 학원에서 누가 허락받고 결석을 한 사람이 있던가……."
1901-71 = "어, 어째서 한장도 팔리지 않는 거야!"
1901-72 = "아하하하하하-! 완전 망했어, 아루 쨩!"
1901-73 = "(안절부절)"
1901-77 = "하아……."
1901-82 = "네. 그래서 단 1장도 팔리지 않았다고 합니다. 여기서의 죄목은 불법 침입, 공문서 위조 쪽이고……."
1901-83 = "하아."
1901-84 = "그다음은……."
1901-85 = "잠깐. 몇개나 더 남았지?"
1901-86 = "18개가 더 있습니다. 부장님."
1901-87 = "……일주일만에 생긴 일들이 그거지?"
1901-88 = "아뇨. 이틀만입니다. 정보과가 휴가인 관계로, 나머지 5일치의 보고서는 다음주 주간회의 때 같이 가져올 예정입니다."
1901-89 = "……."
1901-90 = "……."
1901-91 = "힘내세요, 부장님……."
1901-92 = "하아……."
1901-93 = "선도부 정기 주간 회의"
