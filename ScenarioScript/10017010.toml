[translation]
10017010-1 = "제1화;비밀의 화원"
10017010-7 = "징글벨~ 징글벨~"
10017010-9 = "하나에 쨩은 벌써 신이 난 모양이네요."
10017010-13 = "그런데…… 무겁지 않으세요, 선생님?"
10017010-14 = "[s1] \"아직은 그렇게까지 힘들지 않아.\"\n[s2] \"하나에와 세리나가 만든 선물인데, 거뜬하지!\""
10017010-17 = "아하하…… 나중에 선생님 것도 챙겨 드릴게요."
10017010-25 = "늦기 전에 서둘러야 하는데……!"
10017010-27 = "앗, 정의실현부원이시네요? 그런데 이 시간에 어디를 저렇게 급히 가는 걸까요……?"
10017010-28 = "안녕하세요! 메리 크리스마스, 예요!"
10017010-29 = "아, 구호기사단 분들이시군요. 늘 신세 지고 있습니다. 메리 크리스마스입니다."
10017010-30 = "아앗, 거기에 선생님?! 시, 실례했습니다!"
10017010-31 = "[s3] \"조금 더 편하게 대해 줘도 되는데……\"\n[s4] \"뭔가 바빠 보이네. 어디 가는 중이야?\""
10017010-34 = "어디를 가는 중이었냐고요? 음…… 그건……"
10017010-35 = "뭐, 구호기사단 분들에 선생님까지 계시니 말씀드려도 괜찮겠지요."
10017010-36 = "오늘 저녁에, 정의실현부 전원이 송년회를 열기로 했거든요!"
10017010-37 = "아…… 엄밀히 말해 전원은 아니긴 하겠네요. 코하루 씨는 보충수업부 멤버들과 함께 지내고 있는 것 같고."
10017010-38 = "이치카 선배는 지난주부터 백귀야행 학원의 연말 행사에 교류차 파견을 가신 중이니까요."
10017010-39 = "저런…… 송년회에 참석하지 못하셔서 아쉬우시겠어요……"
10017010-40 = "하지만 백귀야행 학원의 연말 행사도 화려하다고 들었거든요. 분명 나름 즐거운 시간을 보내고 계실 거예요."
10017010-41 = "어쨌든, 근처의 카페 <화이트&메이슨>을 빌려서 간만에 모두가 휴식할 수 있는 자리를 만드신다고 하셨어요."
10017010-42 = "<화이트&메이슨>이요? 예약하기 정말 어렵다고 들었는데…… 대단하네요!"
10017010-44 = "정의실현부 분들은 고생이 많으시니까요……"
10017010-45 = "아니에요. 구호기사단 분들만 하겠어요."
10017010-46 = "그리고 송년회를 위해 여러 가지 준비를 해 둬야 하기도 하고요."
10017010-47 = "아, 지금 그 준비를 하러 가시는 길이었군요. 죄송해요. 어서 가 보세요."
10017010-48 = "감사합니다. 혹시 나중에라도 시간이 괜찮으시면, 한번 카페에 들러 주세요."
10017010-49 = "부장님도 부부장님도, 분명 환영해 주실 거에요."
10017010-51 = "말씀 고마워요! 만날 수 있으면 좋겠네요!"
10017010-56 = "[ns] \"정의실현부가 휴식인가……\""
10017010-57 = "잘된 일이네요, 선배! 언제나 수고만 하는 분들이잖아요?"
10017010-58 = "그러네요. 크리스마스란 참 멋지죠?"
10017010-59 = "[s] \"하지만 수고하는 건 세리나와 하나에도 마찬가지 아닐까?\""
10017010-60 = "그런가요? 전 그냥 할 일을 한다는 느낌인데요."
10017010-61 = "지금만 해도, 모든 사람에게 '구호'를 전달한다는 기분에 얼마나 신나는지 몰라요!"
10017010-62 = "선배, 이렇게 착한 일을 하고 있으니까……"
10017010-63 = "올해도 꼭, 산타클로스께서 선물을 주시겠죠?"
10017010-64 = "아하하…… 그래요. 분명 그럴 거예요."
10017010-69 = "(하나에 쨩의 선물은 뭘로 할까요. 하나에 쨩은 산타를 믿고 있으니……)"
10017010-70 = "(나중에 선생님과 의논해 볼까요……?)"
