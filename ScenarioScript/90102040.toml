90102040-8 = "2;스케반 승객 A;05;아, 열차 온다.\n#2;em;[반응]"
90102040-9 = "4;스케반 승객 B;04;오늘 따라 승강장에 왜 이렇게 사람이 많은 거야? 자칫하다간 타기도 전에 열차가 만원이 되어 버리겠는데.\n#4;em;[땀]"
