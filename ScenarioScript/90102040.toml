90102040-41 = "3;하이랜더 승강장 역무원;07;어휴, 이제야 조금 진정되었네.\n#3;em;[한숨]"
90102040-42 = "3;하이랜더 승강장 역무원;05;그러니까 총을 쏘기 전에 미리 말을 들으면 얼마나 좋아?"
90102040-43 = "3;하이랜더 승강장 역무원;04;말을 안 듣는 승객이 이렇게나 많은데, CCC는 인력은 충분하다며 역을 늘릴 계획이나 세우고 있고……\n#3;em;[땀]"
90102040-44 = "3;하이랜더 승강장 역무원;01;정말 높으신 분들 생각은 도무지 알 수가 없다니까."
90102040-45 = "3;하이랜더 승강장 역무원;06;하아, 이렇게 불평해 봤자 소용없으려나.\n#3;em;[속상함]"
90102040-46 = "3;하이랜더 승강장 역무원;01;어차피 CCC의 높으신 분들이 여기까지 직접 내려와 볼 리도 없으니—"
90102040-47 = "#st;[0,0];instant;1;"
90102040-50 = "3;하이랜더 승강장 역무원;02\n#3;em;[?]\n#wait;1500"
90102040-51 = "3;오토기 하이랜더;01\n#3;black"
90102040-52 = "3;오토기 하이랜더;01\n#na;???;역사에서 처리해야 하는 업무가 그렇게나 많은 거야?\n#3;black\n#3;em;[반응]"
90102040-53 = "3;하이랜더 승강장 역무원;08;말도 마세요. 하는 일이 민원 응대 뿐이라면 바쁘지도 않을 텐데."
90102040-54 = "3;하이랜더 승강장 역무원;08;시설물 유지 보수에 안전 설비 점검, 조차 업무까지…… 하루가 부족할 정도라니까요."
90102040-55 = "3;하이랜더 승강장 역무원;02;그나저나 당신들은……\n#3;em;[?]"
90102040-56 = "2;오토기 하이랜더;01\n4;쿠루미 하이랜더;01\n#2;black\n#4;black\n#2;h\n#4;h\n#3;hide"
90102040-58 = "2;오토기 하이랜더;01\n4;쿠루미 하이랜더;01\n#2;a\n#4;a\n#2;h\n#4;h\n#wait;1500"
90102040-59 = "2;오토기 하이랜더;03;현장에서 고생이 많네. 이렇게 큰 역을 역무원 몇 사람이서 관리하고 있다니.\n#2;em;[음표]"
90102040-60 = "4;쿠루미 하이랜더;03;너무 걱정하지 마. 돌아가면 상부에 꼭 보고해 줄 테니까."
90102040-61 = "3;하이랜더 승강장 역무원;09;그 완장은…… 설마 CCC?!\n#2;hide\n#4;hide\n#3;em;[?!]\n#3;shake"
90102040-62 = "3;하이랜더 승강장 역무원;08;C, CCC가 이 외진 역에는 갑자기 무슨 일이신가요? 오늘 조례 때만 하더라도 CCC에서 오신다는 말은 못 들었었는데요?\n#3;stiff"
90102040-63 = "3;하이랜더 승강장 역무원;06;서, 설마 비정기 특별 감사라던가……\n#3;em;[땀]"
90102040-64 = "4;쿠루미 하이랜더;01\n2;오토기 하이랜더;13;에이, 너무 긴장할 필요 없어. 그냥 지나가는 길에 점검 차 들른 것뿐인걸.\n#3;hide\n#2;em;[재잘]"
90102040-65 = "2;오토기 하이랜더;15;겸사겸사 역을 이용하는 시민들에게 직접 건의 사항도 듣고, 이렇게 현장의 고충도 확인하고 말이야. 그렇지, 쿠루미?"
90102040-66 = "4;쿠루미 하이랜더;04;무, 물론이지! 안전하고 편안한 운행 환경을 가꾸는 건 CCC의 의무니까!\n#4;em;[!]\n#4;shake"
90102040-67 = "3;하이랜더 승강장 역무원;08;……이상하네요. 평소에는 CCC에 건의사항을 잔뜩 써 보내도 읽지도 않은 채 반송하는 일이 부지기수였는데……\n#2;hide\n#4;hide\n#fontsize;50\n#3;em;[...]"
90102040-68 = "3;하이랜더 승강장 역무원;08;오늘은 갑자기 무슨 바람이 들었기에 직접 현장까지 와서 확인을……"
90102040-69 = "1;오토기 하이랜더;08;크흠. 여하튼, 최근 이 역을 경유하는 열차 시간표가 이상하다는 얘기가 있었어서.\n#3;m5\n#1;a\n#1;em;[반응]"
90102040-70 = "1;오토기 하이랜더;02;최근 이 역에 정차한 열차의 기록을 직접 확인하고 싶은데, 잠깐 괜찮을까?"
90102040-71 = "3;하이랜더 승강장 역무원;01;열차 시간표와 관련된 일이라면 저보다는 역장님이 더 잘 아실 것 같은데……"
90102040-72 = "3;하이랜더 승강장 역무원;02;지금 시간이라면 아마 역무실에 계실 거예요. #n제가 직접 안내해 드릴까요?\n#3;em;[?]"
90102040-73 = "1;오토기 하이랜더;02;아, 괜찮아. 모처럼이니 천천히 좀 둘러보다 갈게."
90102040-74 = "1;오토기 하이랜더;15;승강장의 시민들과 이야기도 좀 나누고…… 아, 저기 매점에서 팔고 있는 에키벤도 한 번 맛보고 싶은 걸!\n#1;em;[반짝]"
90102040-75 = "3;하이랜더 승강장 역무원;02;네? 하지만……"
90102040-77 = "3;쿠루미 하이랜더;12;정말이지, 눈치 없기는. 일부러 기회를 주고 있는데도 계속 모른 척 할 거야?\n#3;em;[한숨]"
90102040-78 = "3;쿠루미 하이랜더;01;갑자기 말도 없이 찾아왔으니, '역무실 정리'가 아직 다 안 끝났을 거 아냐."
90102040-79 = "3;쿠루미 하이랜더;05;자, '청소' 할 시간을 줄 테니 그동안 손님 맞을 준비를 마치고 와."
90102040-80 = "3;하이랜더 승강장 역무원;10;아…… 네, 넵! 바로 역장에게 손님이 오셨다고 전하겠습니다!\n#3;shake"
90102040-81 = "#st;[0,0];instant;1;"
90102040-83 = "3;하이랜더 승강장 역무원;10\n#3;dl\n#wait;1500"
90102040-84 = "[ns1] \"……생각보다 연기 실력이 괜찮은데?\"\n[ns2] \"역무원이 바로 속아 넘어갔네.\""
90102040-87 = "4;쿠루미 하이랜더;02;뭐, 위장 잠입은 SRT의 필수 스킬 중 하나이니까.\n#4;em;[반응]\n#4;a"
90102040-88 = "4;쿠루미 하이랜더;08;이 정도의 연기쯤이야 숙련된 SRT 대원에게는 간단한 일이지!"
90102040-89 = "2;오토기 하이랜더;09;연기를 잘 했다고 하기엔, 너무 대놓고 의심받지 않았나……?\n#2;em;[땀]\n#2;a"
90102040-90 = "2;오토기 하이랜더;02;뭐, 아무리 수상하더라도 직속 상사를 향해 의심스럽다고 당당히 말할 수 있는 사람은 흔치 않으니까."
90102040-91 = "2;오토기 하이랜더;03;역시 권위를 빌리는 건 어느 조직에서나 잘 먹히는 수법이네."
90102040-92 = "4;쿠루미 하이랜더;08\n2;오토기 하이랜더;03\n#2;h\n#4;h"
90102040-93 = "[ns] \"그나저나 역무실 정리는 무슨 뜻이었어?\""
90102040-94 = "4;쿠루미 하이랜더;02;말 그대로 정리할 시간을 준 것뿐이야. 방 정리가 끝나지도 않았는데, 갑자기 손님이 찾아오면 곤란할 때가 있잖아?\n#4;m3\n#2;dl"
90102040-95 = "4;쿠루미 하이랜더;99;청소도 하고, 신경 쓰이는 물건도 좀 치우고…… 정리를 하려면 시간이 꽤 필요할 거야. \n#4;em;[...]"
90102040-96 = "4;쿠루미 하이랜더;01;그 사이에 우리는 역무원의 방해 없이 역사를 조사할 시간을 얻은 거지."
90102040-97 = "[s] \"하지만 그 사이에 중요한 증거를 인멸하기라도 하면……\""
90102040-99 = "3;오토기 하이랜더;14;괜찮아. 어차피 정말로 찜찜한 증거라면 이미 평소에도 들키지 않을 만한 장소에 숨겨 두었을 테고—\n#3;em;[음표]"
90102040-100 = "3;오토기 하이랜더;13;초보자들이 들키기 싫은 물건을 숨기는 장소야 다 정해져 있으니까. 침대 아래 수납장이라던가, 손이 잘 안가는 책장의 백과사전 뒤쪽이라던가~"
90102040-101 = "[s] \"그 위치는 설마……\""
90102040-102 = "3;오토기 하이랜더;13;아, 눈치챘어?"
90102040-103 = "3;오토기 하이랜더;14;학생들에게 들키고 싶지 않은 책이 있다면 다음부터는 다른 장소에 숨기도록 해. 물론 들키지 않을 거라는 보장은 없겠지만."
90102040-104 = "3;쿠루미 하이랜더;08;……뭐, 내가 보기엔 평범한 수준의 책이었지만.\n#3;em;[///]"
90102040-105 = "[s3] \"자, 잠깐……!\"\n[s4] \"도대체 어디까지 알고 있는 거야!\""
90102040-108 = "2;오토기 하이랜더;05;음, 시간이 많지는 않으니 슬슬 탐문을 시작할까!\n#2;a\n#3;m4"
90102040-109 = "2;오토기 하이랜더;16;가자, FOX 3!\n#2;em;[!]"
90102040-110 = "3;쿠루미 하이랜더;05;먼저 나서서 명령하지 마!\n#3;hophop"
90102040-111 = "2;오토기 하이랜더;16\n3;쿠루미 하이랜더;05\n#2;h\n#3;h"
