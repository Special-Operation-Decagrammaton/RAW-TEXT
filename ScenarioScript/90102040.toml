[translation]
90102040-1 = "제4화;비정기 특별 감사"
90102040-5 = "손님 여러분. 열차가 접근하고 있으니 모두 한 발자국 물러서 질서 있게 줄을 서 주시기 바랍니다."
90102040-8 = "아, 열차 온다."
90102040-9 = "오늘 따라 승강장에 왜 이렇게 사람이 많은 거야? 자칫하다간 타기도 전에 열차가 만원이 되어 버리겠는데."
90102040-10 = "뭐? 이번 열차를 놓치면 30분은 더 기다려야 하는데?"
90102040-11 = "미리 조금 앞에 나가 있을까……"
90102040-17 = "자, 자. 위험하니까 선로 가까이 오지 마시고 줄을 서서 기다려주세요."
90102040-18 = "차례차례 입장하면 다 들어가실 수 있다니까요. #n줄 서세요, 줄!"
90102040-22 = "잠깐, 밀지 마! 여긴 내가 먼저 줄을 섰다고."
90102040-23 = "한 사람 정도는 더 들어갈 수 있잖아? 조금만 더 들어가 봐."
90102040-24 = "그러니까 모두 밀지 말고……"
90102040-32 = "줄 서라고 했잖아!"
90102040-39 = "<……열차가 승강장에 진입합니다.>"
90102040-41 = "어휴, 이제야 조금 진정되었네."
90102040-42 = "그러니까 총을 쏘기 전에 미리 말을 들으면 얼마나 좋아?"
90102040-43 = "말을 안 듣는 승객이 이렇게나 많은데, CCC는 인력은 충분하다며 역을 늘릴 계획이나 세우고 있고……"
90102040-44 = "정말 높으신 분들 생각은 도무지 알 수가 없다니까."
90102040-45 = "하아, 이렇게 불평해 봤자 소용없으려나."
90102040-46 = "어차피 CCC의 높으신 분들이 여기까지 직접 내려와 볼 리도 없으니—"
90102040-52 = "역사에서 처리해야 하는 업무가 그렇게나 많은 거야?"
90102040-53 = "말도 마세요. 하는 일이 민원 응대 뿐이라면 바쁘지도 않을 텐데."
90102040-54 = "시설물 유지 보수에 안전 설비 점검, 조차 업무까지…… 하루가 부족할 정도라니까요."
90102040-55 = "그나저나 당신들은……"
90102040-59 = "현장에서 고생이 많네. 이렇게 큰 역을 역무원 몇 사람이서 관리하고 있다니."
90102040-60 = "너무 걱정하지 마. 돌아가면 상부에 꼭 보고해 줄 테니까."
90102040-61 = "그 완장은…… 설마 CCC?!"
90102040-62 = "C, CCC가 이 외진 역에는 갑자기 무슨 일이신가요? 오늘 조례 때만 하더라도 CCC에서 오신다는 말은 못 들었었는데요?"
90102040-63 = "서, 설마 비정기 특별 감사라던가……"
90102040-64 = "에이, 너무 긴장할 필요 없어. 그냥 지나가는 길에 점검 차 들른 것뿐인걸."
90102040-65 = "겸사겸사 역을 이용하는 시민들에게 직접 건의 사항도 듣고, 이렇게 현장의 고충도 확인하고 말이야. 그렇지, 쿠루미?"
90102040-66 = "무, 물론이지! 안전하고 편안한 운행 환경을 가꾸는 건 CCC의 의무니까!"
90102040-67 = "……이상하네요. 평소에는 CCC에 건의사항을 잔뜩 써 보내도 읽지도 않은 채 반송하는 일이 부지기수였는데……"
90102040-68 = "오늘은 갑자기 무슨 바람이 들었기에 직접 현장까지 와서 확인을……"
90102040-69 = "크흠. 여하튼, 최근 이 역을 경유하는 열차 시간표가 이상하다는 얘기가 있었어서."
90102040-70 = "최근 이 역에 정차한 열차의 기록을 직접 확인하고 싶은데, 잠깐 괜찮을까?"
90102040-71 = "열차 시간표와 관련된 일이라면 저보다는 역장님이 더 잘 아실 것 같은데……"
90102040-72 = "지금 시간이라면 아마 역무실에 계실 거예요. #n제가 직접 안내해 드릴까요?"
90102040-73 = "아, 괜찮아. 모처럼이니 천천히 좀 둘러보다 갈게."
90102040-74 = "승강장의 시민들과 이야기도 좀 나누고…… 아, 저기 매점에서 팔고 있는 에키벤도 한 번 맛보고 싶은 걸!"
90102040-75 = "네? 하지만……"
90102040-77 = "정말이지, 눈치 없기는. 일부러 기회를 주고 있는데도 계속 모른 척 할 거야?"
90102040-78 = "갑자기 말도 없이 찾아왔으니, '역무실 정리'가 아직 다 안 끝났을 거 아냐."
90102040-79 = "자, '청소' 할 시간을 줄 테니 그동안 손님 맞을 준비를 마치고 와."
90102040-80 = "아…… 네, 넵! 바로 역장에게 손님이 오셨다고 전하겠습니다!"
90102040-84 = "[ns1] \"……생각보다 연기 실력이 괜찮은데?\"\n[ns2] \"역무원이 바로 속아 넘어갔네.\""
90102040-87 = "뭐, 위장 잠입은 SRT의 필수 스킬 중 하나이니까."
90102040-88 = "이 정도의 연기쯤이야 숙련된 SRT 대원에게는 간단한 일이지!"
90102040-89 = "연기를 잘 했다고 하기엔, 너무 대놓고 의심받지 않았나……?"
90102040-90 = "뭐, 아무리 수상하더라도 직속 상사를 향해 의심스럽다고 당당히 말할 수 있는 사람은 흔치 않으니까."
90102040-91 = "역시 권위를 빌리는 건 어느 조직에서나 잘 먹히는 수법이네."
90102040-93 = "[ns] \"그나저나 역무실 정리는 무슨 뜻이었어?\""
90102040-94 = "말 그대로 정리할 시간을 준 것뿐이야. 방 정리가 끝나지도 않았는데, 갑자기 손님이 찾아오면 곤란할 때가 있잖아?"
90102040-95 = "청소도 하고, 신경 쓰이는 물건도 좀 치우고…… 정리를 하려면 시간이 꽤 필요할 거야."
90102040-96 = "그 사이에 우리는 역무원의 방해 없이 역사를 조사할 시간을 얻은 거지."
90102040-97 = "[s] \"하지만 그 사이에 중요한 증거를 인멸하기라도 하면……\""
90102040-99 = "괜찮아. 어차피 정말로 찜찜한 증거라면 이미 평소에도 들키지 않을 만한 장소에 숨겨 두었을 테고—"
90102040-100 = "초보자들이 들키기 싫은 물건을 숨기는 장소야 다 정해져 있으니까. 침대 아래 수납장이라던가, 손이 잘 안가는 책장의 백과사전 뒤쪽이라던가~"
90102040-101 = "[s] \"그 위치는 설마……\""
90102040-102 = "아, 눈치챘어?"
90102040-103 = "학생들에게 들키고 싶지 않은 책이 있다면 다음부터는 다른 장소에 숨기도록 해. 물론 들키지 않을 거라는 보장은 없겠지만."
90102040-104 = "……뭐, 내가 보기엔 평범한 수준의 책이었지만."
90102040-105 = "[s3] \"자, 잠깐……!\"\n[s4] \"도대체 어디까지 알고 있는 거야!\""
90102040-108 = "음, 시간이 많지는 않으니 슬슬 탐문을 시작할까!"
90102040-109 = "가자, FOX 3!"
90102040-110 = "먼저 나서서 명령하지 마!"
90102040-112 = "[ns] \"도대체 어디까지 알고 있는 건데!\""
90102040-114 = "다음화;말단과 간부"
