90102040-17 = "3;하이랜더 승강장 역무원;05;자, 자. 위험하니까 선로 가까이 오지 마시고 줄을 서서 기다려주세요."
90102040-18 = "3;하이랜더 승강장 역무원;07;차례차례 입장하면 다 들어가실 수 있다니까요. #n줄 서세요, 줄!\n#3;em;[스팀]\n#3;hophop"
