[translation]
90102040-1 = "第4話;抜き打ち検査"
90102040-4 = ""
90102040-5 = "列車が接近しておりますので、黄色い線の内側に下がってお待ちください。"
90102040-6 = ""
90102040-8 = "あ、来た。"
90102040-9 = "今日やけに混んでない？これ乗れる？"
90102040-10 = "え？次って30分後だよ？"
90102040-11 = "ちょっと前の方行っとく？"
90102040-12 = ""
90102040-15 = ""
90102040-16 = ""
90102040-17 = "はいはい。危ないので線路には近づかず、列を崩さずお待ちください。"
90102040-18 = "ちゃんと全員乗れますから。#n列を崩さず、順番に並んでください！"
90102040-19 = ""
90102040-22 = "ちょっ、押すなって！"
90102040-23 = "後ろもぎゅうぎゅうなんだ。もう少し列詰めてくれ。"
90102040-24 = "ですから、皆さん押さずに――"
90102040-25 = ""
90102040-27 = ""
90102040-28 = ""
90102040-31 = ""
90102040-32 = "並べっつってんだろうが！"
90102040-33 = ""
90102040-35 = ""
90102040-36 = ""
90102040-39 = "「……列車が参ります」"
90102040-40 = ""
90102040-41 = "……やっと静かになった。"
90102040-42 = "なんでここまでしないと言うこと聞けないかな。"
90102040-43 = "ただでさえ収拾つかないのに、#nCCCは「人員は足りている」の一点張りで駅増やそうとしてるし……。"
90102040-44 = "本当に、上は何を考えてるのやら。"
90102040-45 = "はぁ……愚痴ったって仕方ないか。"
90102040-46 = "どうせCCCのお偉いさんは現場にゃそうそう来ないし――"
90102040-47 = ""
90102040-50 = ""
90102040-51 = ""
90102040-52 = "駅って、そんなにやること多いんだ？"
90102040-53 = "もう聞いてくださいよ。#nやること多いなんてもんじゃないんですから。"
90102040-54 = "苦情対応に追われながら、施設のメンテナンスに安全設備の確認、入換業務まで……#nこんなの時間がいくらあっても足りないですよ！"
90102040-55 = "……って、あなた達は？"
90102040-56 = ""
90102040-58 = ""
90102040-59 = "こんな大きな駅を数人で回してるなんて、現場はずいぶん大変そうだねぇ。"
90102040-60 = "安心して。戻ったらちゃんと報告しておくから。"
90102040-61 = "その腕章……まさかCCC！？"
90102040-62 = "こ、こんな外れの駅に何のご用でしょうか？#nCCCの方がいらっしゃるなんて、朝礼でも聞いていませんでしたが……。"
90102040-63 = "まさか、抜き打ち検査とか……。"
90102040-64 = "そんな身構えなくていいって。巡回ついでに寄っただけだから。"
90102040-65 = "利用客から直接要望を聞いたり、現場の苦労を確認したりさ。#nね、クルミ？"
90102040-66 = "もちろん！安全で快適な運行環境を整えるのは、CCCの務めだから！"
90102040-67 = "妙だな……。普段は要望書を山ほど送っても、読まずに差し戻してくるくせに……。"
90102040-68 = "どういう風の吹き回しで、わざわざ現場まで……。"
90102040-69 = "こほん。最近、この駅を通る列車のダイヤがおかしいって話があってね。"
90102040-70 = "直近の運行情報を確認したいんだけど、少し時間もらえる？"
90102040-71 = "それでしたら、私より駅長の方が詳しいと思います。"
90102040-72 = "今の時間なら駅務室にいるはずですので、ご案内しましょうか？"
90102040-73 = "いいよいいよ、大丈夫。せっかくだし、少し見て回ってから行くよ。"
90102040-74 = "利用客の話も聞きたいし……あ、売店で売ってる駅弁も食べたいな！"
90102040-75 = "はい？ですが……。"
90102040-77 = "わざわざチャンスあげてるの。分かんない？"
90102040-78 = "急に来たから、片づいてないでしょ？駅務室。"
90102040-79 = "[ruby=・   ・]掃除[/ruby]する時間くらいはあげるから。ほら、準備してきなよ。"
90102040-80 = "あ……はい！すぐ駅長にお伝えします！"
90102040-81 = ""
90102040-83 = ""
90102040-84 = "[ns1] \"やるねぇ。\"\n[ns2] \"駅員さん、あっさり騙されちゃったね。\""
90102040-87 = "まあ、偽装潜入はSRTの必須スキルの一つだから。"
90102040-88 = "この程度は熟練したSRT隊員なら朝飯前よ！"
90102040-89 = "いやぁ、その割にはだいぶ怪しまれてなかった？"
90102040-90 = "まあ、どれだけ怪しくても、直属の上司に向かって「怪しいです」って堂々と言える人はそうそういないからね。"
90102040-91 = "やっぱ権威を借りるのは、どこの組織でも有効なんだねぇ。"
90102040-92 = ""
90102040-93 = "[ns] \"そういえば、さっきの「掃除」ってどういう意味？\""
90102040-94 = "そのままよ。散らかったままの部屋じゃ来客の対応なんてできないでしょ？"
90102040-95 = "整理整頓したり、見られたくない物を隠したり……掃除には時間が必要だからね。"
90102040-96 = "その間に、私たちは邪魔されず駅を調べられるってわけ。"
90102040-97 = "[s] \"でも、こうしてる間に重要な証拠を処分されたら……。\""
90102040-99 = "心配ないよ。#nほんとにヤバいのは普段からちゃんと隠してるだろうし。"
90102040-100 = "それに、隠し場所なんて大体決まってるから。#nベッド下の収納とか、本棚にある手の届きにくい百科事典の裏とか。"
90102040-101 = "[s] \"……ん？\""
90102040-102 = "あ、気づいた？"
90102040-103 = "生徒に見つかりたくない本があるなら、もっと別の場所に隠した方がいいよ。#nそれでも見つからない保証はないけどね。"
90102040-104 = "……別に、どうこう言うような内容でもなかったでしょ。あれくらい。"
90102040-105 = "[s3] \"ちょ、ちょっと待って……！\"\n[s4] \"どこまで知ってるの！？\""
90102040-108 = "さっ、時間もないし聞き込み始めよっか！"
90102040-109 = "行こう、FOX3！"
90102040-110 = "勝手に指揮しないで！"
90102040-111 = ""
90102040-112 = "[ns] \"ねぇっ、どこまで知ってるの！？\""
90102040-114 = "次回;末端と幹部"
