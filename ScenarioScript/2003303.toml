[translation]
2003303-1 = "위대한 의장님의 사업 활동"
2003303-8 = "[ns] \"…………어?\""
2003303-9 = "하누마 마코토 의장님! 입장하십니다!"
2003303-16 = "좋아. 그럼 나는 잠시 선생과 볼일이 있으니, 모두 밖에서 대기하고 있도록."
2003303-18 = "넵!"
2003303-22 = "……해서 이 몸이 직접 행차한 참이다만."
2003303-23 = "[s1] \"아, 응. 어서 와. 준비한 건 별로 없지만 편하게 있다 가.\"\n[s2] \"으음, 커피라도 한 잔, 마실래?\""
2003303-26 = "키키킷. 선생의 배려라면 사양하지 않고 고맙게 받도록 하지."
2003303-27 = "그건 그렇고……"
2003303-28 = "크큭. 과연, 소문으로만 듣던 샬레의 집무실은 이런 느낌이었나."
2003303-29 = "이것 참……."
2003303-30 = "[s] \"……이것 참?\""
2003303-31 = "이야기로 전해 들은 것보다도 더욱 답답하고 비좁은 공간이로군!"
2003303-32 = "[s] \"오자마자 아무렇지도 않게 악담을 하고 있잖아. 이 아가씨!\""
2003303-33 = "하! 악담이라니. 그럴 리가! 이 몸은 어디까지나 진실을 입에 올렸을 뿐이다!"
2003303-34 = "애당초 말이다. 자고로 우수한 리더에겐 그 격에 걸맞은 집무실이 필요한 법!"
2003303-35 = "그런데 이런 비좁은 공간에서 과연 제대로 된 업무가 가당키나 하겠나!"
2003303-36 = "이래서야 나 자신의 위엄을 드러내기 위한 흉상을 장식할 장소도 없지 않나. 선생!"
2003303-37 = "후우…… 일전에 내가 건넨 제안만 받아들였어도, 이곳과는 비교할 수 없을 만큼 넓고 쾌적한 집무실을 얼마든지 사용할 수 있었을 텐데 말이야."
2003303-38 = "[s3] \"으음, 지금 쓰는 집무실에 딱히 불만이 있는 건 아니라서…….\"\n[s4] \"그보다 보통은 자기 흉상을 집무실에 장식하지는 않으니까 말이지?!\""
2003303-41 = "하여간 저번에 선생이 내 매력적인 제안을 거절하고 난 뒤, 줄곧 그 이유에 대해 생각했었다."
2003303-42 = "그렇게 생각에 생각을 거듭한 끝에, 마침내 오늘! 그 이유를 가까스로 깨달을 수가 있었지."
2003303-43 = "[s] \"혹시나 해서 묻는데…… 무슨 이유라고 생각했는데?\""
2003303-44 = "크크큭…… 생각해 보면 간단한 이유였지."
2003303-45 = "그건 바로……! 선생이 아직 우리 만마전의 진가를 제대로 모르고 있었기에, 남들이라면 절대로 하지 않을 실수를 저질러 버린 게야!"
2003303-46 = "[s] \"어…… 실수……?\""
2003303-47 = "물론 이는 어디까지나 선생의 잘못이 아니야."
2003303-48 = "굳이 잘잘못을 따지자면 사전에 이쪽의 포부와 규모, 미래에 이룩할 성장 가능성 등등."
2003303-49 = "그 진정한 위업과 사실을 제대로 전달하지 못한…… 이 마코토 님의 실수라고 할 수 있겠지."
2003303-50 = "우수한 리더란 자고로, 자신의 과오도 객관적으로 바라보고 인정할 수 있어야 하는 법!"
2003303-51 = "자, 그런 의미에서 오늘 이 몸께서 선생을 찾아온 이유는 하나."
2003303-52 = "오늘 하루, 만마전이 어떠한 곳인지. 이 하누마 마코토 님이 평소 어떠한 위업을 이룩하고, 위정자로서 어떠한 면모를 가졌는지."
2003303-53 = "하나하나 빠짐없이, 그 전부를 선생에게 보여주도록 하지!"
2003303-54 = "그걸 보고 나면 비로소 선생도 이 몸의 제안을 거절했던 것을, 땅을 치고 후회하며 다시 생각하게 될 테니 말이야! 키히히히힛!!"
2003303-55 = "[s] \"아니, 아무리 그래도 그럴 일은 없을 거 같은데…….\""
2003303-56 = "흠! 이러고 있을 때가 아니지."
2003303-61 = "자, 선생을 리무진으로 모셔라."
2003303-62 = "지금 바로 만마전의 사업장으로 이동하겠다!"
2003303-63 = "[s] \"잠깐……! 마코토, 아직 나 샬레의 업무가……!\""
2003303-64 = "키키키킷! 사소한 것엔 신경 쓰지 말도록 선생이여!"
2003303-65 = "그보다 앞으로 당신의 그 얼굴이, 경악과 존경으로 물들어 갈 것이 몹시 기대되는군!"
2003303-66 = "자! 가자!"
2003303-67 = "[s] \"이 아가씨! 사람의 말을 전혀 안 듣는구만?!\""
2003303-75 = "(그리하여 난데없이 마코토와 함께하는 만마전 사업장 순회 일정이 시작되었다.)"
2003303-78 = "키시싯. 미래의 잠재적 파트너에게 가장 먼저 소개할 필요가 있는 사업장이라고 한다면……."
2003303-79 = "누가 뭐라 해도 바로 이곳이라고 할 수 있겠지!"
2003303-80 = "[s] \"여긴…… 인쇄소?\""
2003303-81 = "그래. 인쇄소지."
2003303-82 = "다만…… 보기와 다르게 평범하기만 한 인쇄소가 아니야."
2003303-83 = "이곳은 우리 만마전이 단독으로 운영하는 인쇄소이며, 그 규모는 무려 게헨나 최대 규모."
2003303-84 = "여기에서 생산되는 모든 출판인쇄물…… 그러니까 전단지나 서책, 신문, 마케팅용 판촉물 등은 그 전부가 만마전을……."
2003303-85 = "나아가 이 마코토 님을 홍보하고 널리 알리기 위해 제작되는 것들뿐!"
2003303-86 = "[s] \"그 말은 즉…….\""
2003303-87 = "크크큭, 그래! 이 마코토 님께서는 이미 종이를 통한 출판인쇄업을, 보다 나아가 종이 미디어 산업 그 자체를 장악했단 것이다!"
2003303-88 = "지금은 비록 미약한 규모일 뿐이지만…… 그 성장세는 날이 갈수록 늘어날 테지."
2003303-89 = "이대로라면 게헨나의 모든 언론을 손에 넣는 것도 시간문제!"
2003303-90 = "자, 어떤가. 선생이여. 키보토스에서 이만한 사업을 굴리는 자는 이 마코토 님 외에는 달리 없을 터!"
2003303-91 = "이것으로 이 몸의 대단함을 조금은 더 잘 알 수 있게 되지 않았나?"
2003303-92 = "[s] \"아…… 응, 굉장하긴 한데.\""
2003303-93 = "으으음?! 이걸 보고도 그런 미적지근한 반응이라니……?"
2003303-94 = "[s5] \"이미 이거랑 비슷한 걸 본 적이 있다고 할지…….\"\n[s6] \"크다고 해서 전부가 아니라는 걸 이미 경험했다고 할지…….\""
2003303-97 = "뭐, 뭣이…… 선생…… 그대는 대체 얼마나 되는 수라장을 거쳐왔기에……"
2003303-98 = "그래, 이만한 사업 정도로는 눈썹 하나 까딱이지 않는다는 건가."
2003303-99 = "좋다! 아직 이걸로 끝이 아니다! 진짜 시작은 지금부터다!"
2003303-100 = "자! 다음 사업장으로 가는 거다!"
2003303-103 = "다음은 이곳이다!"
2003303-104 = "[s] \"보아하니 공사가 한창이네. 뭐 하는 장소야?\""
2003303-105 = "키시싯. 그건 말이지."
2003303-106 = "이거이거, 투자자님 아니십니까. 오늘은 시찰이십니까?"
2003303-107 = "아아, 공사는 순조롭게 진행되고 있나?"
2003303-108 = "하하! 그야 말이 필요 없을 정도로 순조로운 상황이지요."
2003303-109 = "기대해 주십시오! 조만간 하누마 마코토 님의 위용을 증명하는 초고층 빌딩……!"
2003303-111 = "<마코토 타워>가 완공되면 뭇 키보토스의 학생들이 투자자님을 우러러볼 터이니!"
2003303-112 = "[s] \"마코토…… 타워?\""
2003303-113 = "크크큭. 그래. 이름 그대로 이곳에서 짓고 있는 건 이 몸의 이름을 딴 빌딩……."
2003303-114 = "그 크기와 규모는 무려…… 샬레의 생텀 타워를 능가할 정도!"
2003303-115 = "그렇지요. 저희는 투자자님의 강력한 의지와 아낌없는 투자에 따라, 열심히 빌딩을 짓고 있습니다요."
2003303-116 = "목표는…… 게헨나는 물론, 트리니티, 밀레니엄, 나아가 백귀야행과 붉은겨울 연방학원에서도 보일 정도의 높이를 가진 빌딩의 건설이다!"
2003303-117 = "[s] \"물리적으로 불가능하지 않아. 그거?!\""
2003303-118 = "흥! 무슨 나약한 소리를! 당연히 가능하다! 누가 뭐라 해도 이 마코토 님이 만드는 것이니까!"
2003303-119 = "후후, 정확히 말하자면 만드는 건 저희지만요."
2003303-120 = "키시싯! 사소한 이야기로군!"
2003303-121 = "후후후! 예. 사소하지요. 저희는 그저 투자자님의 의뢰를 대행할 뿐이니!"
2003303-123 = "키키키킷!!"
2003303-124 = "후후후!"
2003303-126 = "이 빌딩이 완공되기만 하면, 게헨나에서 커다란 상징성을 가진 건물로서 수많은 지역의 사람들을 끌어들이는 멋진 랜드마크가 되어줄 테지."
2003303-127 = "그렇다면 커다란 관광 수익을 거두는 것은 물론…… 키보토스 전체에 우리 만마전의 이름을 알려 영향력을 증대시키는 것도 가능할 것이다!"
2003303-128 = "그야말로 선도부는 꿈도 못 꾸는…… 이 마코토 님만이 해낼 수 있는 혜안!"
2003303-129 = "자, 어떤가. 선생이여! 이 빌딩을 본 당신의 감상을 듣고 싶군."
2003303-130 = "응……? 멋지긴 한데, 너무 가볍게 일을 벌인 게 아니냐고?"
2003303-131 = "현실적으로 가용 가능한 예산의 문제라든가, 관광 계획의 예비타당성 조사……?"
2003303-132 = "키시싯. 선생. 참으로 재미없는 말을 하는군."
2003303-133 = "[s] \"재미없다……로 끝내도 되는 거야……?\""
2003303-134 = "그래! 신경 써야 하는 건 그런 현실의 <제약>이 아니야……!"
2003303-135 = "제일 중요한 건 <하고 싶은가 아닌가.> 혹은 <해서 멋진가 아닌가.> 등을 따지는……"
2003303-136 = "나 개인의 욕망이다!"
2003303-137 = "[s] \"………그냥 그렇게 퉁쳐도 괜찮은 걸까?!\""
2003303-138 = "하지만, 그래. 아직 완성되지 않은 빌딩의 터만으로는 선생을 감복시키는 데엔 충분하지 않을지도 모르겠어."
2003303-139 = "그럼 다음이다!"
2003303-141 = "(그 뒤로도 불안감 반, 걱정 반을 떠안은 채로 마코토와 함께하며, 우리들은 정말로 다양한 면면을 가진 사업장을 방문해 나갔다.)"
2003303-143 = "이곳 쇼핑몰에선 만마전의 팝업 스토어가 열리고 있지."
2003303-144 = "이미 이 몸의 위용을 널리 알리기 위한 피규어는 물론, 포스터…… 소규모 굿즈 등도 전부 수주 생산에 들어간 상황이다."
2003303-145 = "흐름은 호조! 이후엔 온라인 샵을 통한 대량판매를 계획하고 있지! 이로써 마코토 님의 이름을 널리 알리고……!"
2003303-147 = "크크큭! 이곳은 우리 만마전이 운영하는 리조트다."
2003303-148 = "리조트를 방문하는 모든 방문객에겐 특별 할인 서비스와 함께, 만마전 팬클럽 배지를 배부하여, 영향력을 공고히……!"
2003303-156 = "(그렇게 한바탕 만마전의 사업장을 돌고 난 뒤, 우리는 게헨나 근처의 상점가에 다다랐다.)"
2003303-157 = "자, 그래서 다양한 곳을 돌아보았다만. 어때."
2003303-158 = "선생의 입으로 감상을 듣고 싶군."
2003303-159 = "[s] \"으음…… 마코토는 정말 많은 걸 하고 있구나.\""
2003303-160 = "키시싯. 제대로 알아봤군. 맞다. 그 말대로다."
2003303-161 = "지금 이 순간에도 이 몸께서는 어떻게 하면 만마전의 영향력을 키우고, 수익성을 증대시킬 수 있을지. 고민에 고민을 거듭하고 있지."
2003303-162 = "그리고……"
2003303-163 = "어떻게 하면 이 마코토 님의 이름을 널리 알릴 수 있을지까지!"
2003303-164 = "물론 이렇게 사업을 벌일 때마다 이로하 녀석이 불만을 중얼거리고는 하긴 한다만."
2003303-165 = "[s] \"사업장을 돌아보니 이해가 될 거 같기도 하고…….\""
2003303-166 = "그거야말로 뭘 모르는 발언이다!"
2003303-167 = "이렇게 차근차근 영향력을 키워나가야 비로소 만마전은 선도부 녀석들을 제치고…… 마침내 게헨나를, 아니. 이 키보토스를 손에 넣을 날이 찾아올 테니 말이야!"
2003303-168 = "이것으로 우리 만마전의 진가를 잘 알게 되었을 테지. 선생."
2003303-169 = "자, 지금이라면 일전에 이 몸이 건넨 제안을 재고해 볼 마음이 들었나?"
2003303-170 = "[s] \"으음……. 미안, 마코토. 역시 그건 곤란…….\""
2003303-175 = "흠? 무슨 소란이지?"
2003303-177 = "그러니까 이건 확실한 상품이라니까요. 기존의 낡고 지루한 선물 가게의 흐름에 새로운 바람을 불러오리라 확신하고 있습니다!"
2003303-178 = "그러거나 말거나. 우리 상점가에 그런 물건을 함부로 들여놓을 수는 없어!"
2003303-179 = "어르신! 그러지 마시고 좀! 거래 상대가 무려 판데모니움 소사이어티입니다! 이번 건을 잘만 진행하면 정말 대박이 될 건이니까……."
2003303-180 = "정말이지 요즘 젊은것들은! 돈이면 다인 줄 아나! 그런 물건들로만 가게를 채워 놓으면 단골 고객은 어찌하고?"
2003303-182 = "하지만 시대는 이미 변하고 있단 말입니다! 어르신!"
2003303-183 = "거기, 무슨 일이지?"
2003303-184 = "앗, 마, 마코토 님!"
2003303-185 = "흠. 그쪽은 저번에 본 적 있는 유통업자로군, 뭔가 트러블이라도 있는 모양이지?"
2003303-186 = "그, 그것이……."
2003303-187 = "아하. 당신이 이번에 사람들을 시켜서 우리 상점가에 만마전 특제 <선물용 하누마 마코토 세트>를 들여놓으라고 지시한 높으신 분인가?"
2003303-188 = "[s] \"……선물용…… 마코토 세트?\""
2003303-189 = "아아, 확실히 그런 제품도 기획한 적이 있었지. 그래서?"
2003303-190 = "그럼 내 확실하게 말해두겠네. 그런 정체불명의 물건을 들여놓기 위해 상점가 단골들이 자주 찾는 선물 가게를 멋대로 부수고 다시 만들겠다니."
2003303-191 = "제아무리 자네가 사들인 가게라고는 해도 이는 너무한 일이지 않나! 기존 단골들이 찾는 상품은 어디서 구하라고? 상점가를 지키는 몸으로서 그러한 짓은 용납할 수 없네!"
2003303-192 = "옳소!"
2003303-193 = "회장 말이 옳다!"
2003303-194 = "폭거는 그만둬라!"
2003303-196 = "여, 여러분! 아무리 그래도 그렇게 말씀하시면……!"
2003303-197 = "과연…… 키시싯. 그런 이유로 이 몸의 사업에 클레임을 걸고 방해하겠다. 이거로군."
2003303-198 = "이거이거, 나 참──"
2003303-199 = "[s] \"자, 잠깐, 마코토. 너무 감정적으로는………\""
2003303-200 = "모두 들으라!"
2003303-205 = "이쪽이 벌이는 사업의 목적은 어디까지나 만마전의 이름을 드높이고. 우리 판데모니움 소사이어티와 게헨나의 모두가 상생하기를 바라기에 하는 것!"
2003303-206 = "……아, 물론 선도부는 빼고."
2003303-207 = "그런 점에서 본의 아니게 이러한 트러블이 일어나게 된 것엔 유감을 표하도록 하지."
2003303-208 = "상점가와 마찰을 일으키는 건 이 몸이 바라는 바가 아니다. 그러니 불만이 있다면 접수하겠다. 합당한 클레임이라면 대응하겠다."
2003303-209 = "필요하다면 거기에 걸맞은 합당한 보상도 제공하도록 하마."
2003303-210 = "이 정도면 어떤가?"
2003303-211 = "이거 말이 통하는 양반이구만!"
2003303-212 = "……정말 그래도 괜찮나? 자네는?"
2003303-213 = "키시싯. 그야 괜찮지. 이 마코토 님은 본디 너그러운 아량과 배려심을 가지고 있는 인물이니 말이야."
2003303-214 = "물론 선도부는 빼고."
2003303-215 = "……고맙네. 고마워!"
2003303-220 = "흥. 대충 정리가 되었군."
2003303-221 = "[s] \"방금은 좀 놀랐달까. 마코토. 대단했어.\""
2003303-222 = "아아. 방금 건 말인가."
2003303-223 = "만마전의 높은 자리에 있다 보면 얼마든지 벌어지는 일이야."
2003303-224 = "리더 된 자로서 이 정도 사사로운 일에 휘둘려서야 쓰겠나."
2003303-225 = "그보다, 크크큭. 어때. 이 몸을 인정한다는 건 방금 그 모습을 보고, 다시금 우리 만마전에 협력할 의향이 생겼다고 봐도 되겠지?"
2003303-226 = "[s] \"아니, 그건 별개고.\""
2003303-227 = "크윽! 역시나 안되는 건가!"
2003303-228 = "……흥, 뭐. 좋다."
2003303-229 = "어쭙잖은 명예에 휘둘리는 다른 조무래기들과는 그릇의 크기부터 다르다 이거로군."
2003303-230 = "[s] \"엄청난 과대평가라고 생각하는데…….\""
2003303-231 = "하지만! 나 하누마 마코토는 포기하지 않겠다."
2003303-232 = "언젠가…… 선생. 그대를 내 것으로 만들고야 말 테니까 말이야!"
2003303-233 = "크크큭……… 키키키키킷!! 그때를 기대하도록!"
2003303-234 = "[s] \"아, 으응. 그 선처를 부탁하겠습니다…….\""
