[translation]
33100-1 = "제10화;달콤한 거짓"
33100-3 = "선생님. 당신은 키보토스의 외부에서 오신 분이니까 계약, 거래…… 그런 약속들이 가지는 중요성을 잘 알고 계실 겁니다."
33100-4 = "……악마와의 계약, 이라는 관용구를 들어보셨나요?"
33100-5 = "초월적인 존재가 자신이 한 약속 때문에 어쩔 수 없이 패배하고 사라진다는 옛이야기는 흔히들 있어 왔죠."
33100-6 = "그런 식으로……"
33100-7 = "단순한 종잇조각에 불과할지라도, <약속>은 어떤 존재를 제약하고 구속하고 정의하기도 합니다."
33100-8 = "계약, 계율, 약속…… 옛이야기와 마찬가지로 그런 것들 또한 이 키보토스에서 중요한 개념입니다."
33100-9 = "가령, 트리니티의 경전에는 태초의 신성과 체결된 10개의 계명이 중요하게 묘사되어 있기도 하고,"
33100-10 = "우리들이 그 <약속>을 어겼기에 낙원에서 추방되었다고도 전해지죠."
33100-12 = "……실제로 당신은 그런 부분을 이용해서 누군가를 구한 적도 있었습니다."
33100-14 = "<게마트리아>가 아비도스의 학생에게 요구한 것도 결국은 <계약>이었으니……."
33100-15 = "계약 자체가 성립되지 못하게 되자, 게마트리아는 물러날 수밖에 없었겠죠."
33100-17 = "……."
33100-18 = "지금 벌어진 사건 또한, 말하자면 그런 것입니다."
33100-19 = "에덴조약 자체는 학원과 학원 간에 체결되는 일반적인 협정이지만……."
33100-20 = "이 조약이 맺어지는 장소의 특별함,"
33100-21 = "조약을 체결하기 위해 모인 대표자들의 자격……."
33100-22 = "그런 요소들을 이용해서, 아리우스 스쿼드는 에덴조약을 계율이 체결되는 <공의회>로 여겨지도록 왜곡시킨 것입니다."
33100-23 = "그리고, 체결된 계율을 수호하는 <유스티나 성도회>를 그들의 [ruby=미메시스]특수한 방법[/ruby]으로 이곳에 현현시킨 것이죠."
33100-24 = "즉, 계약을 곡해하고 왜곡해서 자기들의 의도대로 결과를 조작한 것……이라고 볼 수 있겠죠."
33100-25 = "그게 바로 게마트리아가 말하는 <어른의 방식>인 걸까요."
33100-26 = "……."
33100-27 = "……아아. 네. 저는 그들을 당신의 꿈을 통해서만 관측했을 뿐입니다."
33100-28 = "그들 같은 불가해한 존재는 제 이해의 범위를 넘어서니까요."
33100-29 = "……결국 아리우스의 배후에는 <게마트리아>가 있었고,"
33100-30 = "아리우스는 이제, 죽지도 않고 사라지지 않는 거대한 군대를 손에 넣게 된 것입니다."
33100-32 = "우리들이 추방된 낙원, 그 이름을 가진 조약을 통해서요."
33100-35 = "으아아아아---!!!"
33100-44 = "……."
33100-45 = "흠……."
33100-46 = "으, 으아아…… 아, 아프겠네요……."
33100-51 = "미숙하구나."
33100-52 = "생각하는 것을 포기하고 돌격하다니. 제정신이냐, 아즈사?"
33100-53 = "네 특기는 상대의 허를 찌르는 게릴라전이면서. 나와 정면으로 싸워서 이길 수 있다고 생각했나?"
33100-57 = "크, 으으윽……."
33100-58 = "으…… 무슨…… 짓을 저지른 거야…… 사오리……."
33100-59 = "……. 남은 시간은?"
33100-60 = "약 5분 정도. 그 뒤에는 두 학원의 예비 병력들이 여기에 도달할 거야. 이쪽의 상황도 드러날 거고."
33100-61 = "그 정도면 충분하겠지. 일으켜라."
33100-68 = "이렇게 찾아와줘서 수고를 덜었군. 아즈사."
33100-69 = "……."
33100-70 = "네 배신으로 우리의 계획이 조금 틀어졌지만……. 뭐, 크게 달라진 건 없다."
33100-71 = "원래라면 이곳에 미카가 왔어야 했겠지만…… 그 멍청한 여자는 이제 쓸모가 다했으니 상관없고."
33100-72 = "또 위험한 건 나기사였는데, 다행히도 아무런 의심 없이 이 조인식에 참석해주었고."
33100-73 = "시스터후드까지 함께 처리할 수 있게 된 것은 예상외의 성과였다."
33100-74 = "아아, 그래…… 무슨 짓을 저지른 거냐고 물었지? 알려주마. 지금 상황을."
33100-75 = "우리는…… 에덴조약을 강탈했다."
33100-76 = "……."
33100-77 = "조약이 체결되는 고성당에 순항 미사일을 꽂아 넣고, 방해꾼들을 치워버린 다음……. 우리가 조약에 끼어들어 그 내용을 뒤틀었다."
33100-81 = "이해를 못 하겠다는 표정이군."
33100-82 = "……잊었어, 아즈사? 우리에겐 트리니티의 대표 자격이 있어."
33100-83 = "……."
33100-84 = "이 조약을 1차 공의회의 재현으로 해석하면 돼. 모든 트리니티 분파들이 모였던 그 공의회에 아리우스는 참석하지 않았으니까."
33100-85 = "그러니 우리에겐 아직 권한이 남아있다고 볼 수 있는 거지."
33100-86 = "<트리니티와 게헨나 둘 사이의 분쟁이 벌어졌을 때, 오직 에덴조약기구를 통해서만 분쟁을 해결한다>……"
33100-87 = "그 에덴조약의 내용에, <단, 에덴조약기구는 아리우스 스쿼드가 맡는다>, 라고 내용을 추가했을 뿐이야."
33100-88 = "그, 그것만으로는 아무런 의미도 없겠지만…… 그, 그치만……. 계율 자체는 진짜이기에……."
33100-99 = "<유스티나 성도회>."
33100-100 = "계율의 수호자. 트리니티의 전설적인 무력 집단."
33100-101 = "정확히는 그 미메시스지만, 바로 이들이 [ruby=ETO]우리[/ruby]를 도와 계율을 수호하게 될 것이다."
33100-102 = "트리니티와 게헨나의 적대 행위는 신성한 계율을 위배하는 행위로 간주해 배제하겠지."
33100-104 = "……이해했어."
33100-105 = "이 테러는, 단순히 각 학원의 수뇌부를 없애고 상황을 혼란하게 만드는 것만이 아니었어."
33100-106 = "에덴조약을 이용해…… 저 불가사의한 병력을 확보하는 것……."
33100-107 = "(스윽- 슥, 스슥-)"
33100-108 = "……아니, 그럴 순 없어. 아츠코. 난 돌아가지 않아."
33100-109 = "포섭은 관둬라. 공주님. 지금은 소용없을 거다. 저 녀석의 고집을 꺾는 것은 예전부터 쉽진 않았으니까."
33100-110 = "그래…… 생각해보면 분명 그런 고집을 옆에서 부추겼던 어른이 있었던 거겠지."
33100-111 = "이 세계의 진실을 감추고, 왜곡하는, 거짓을 가르치는, 분명 나쁜 어른이."
33100-112 = "그 선생은 치워버렸으니, 이제 다시 처음부터 천천히 가르쳐 주면 돼."
33100-113 = "선생님은……!!"
33100-114 = "……그래. 즐거워 보이더군. 그 트리니티에서."
33100-115 = "그 생활이 즐거웠나? 마음에 드는 사람들과 함께 있어서? 널 이해해주는 사람들과 함께 있어서?"
33100-116 = "헛되다."
33100-117 = "널 이해해주고 받아줄 수 있는 사람은 우리 말곤 없어. 여기야말로 네가 속해 있는 곳이다."
33100-118 = "너는 그런 진실을 외면하고, 달콤한 거짓에 눈이 멀었다. 그 나약함이 널 패배하게 만들었다."
33100-119 = "우릴 막고 싶나?"
33100-120 = "그래, 그렇다면 내 헤일로를 파괴해 봐라, 아즈사."
33100-121 = "……!!"
33100-122 = "조약의 주체인 우리들이 존재하는 이상, 이 계율은 영속되겠지."
33100-123 = "이것을 막으려면 방법은 그것 말고는……."
33100-124 = "하지만 네가 그럴 수 있을까? 그 세이아의 임무도 도망쳤으면서."
33100-125 = "……!!"
33100-126 = "우리를 속이면서까지 깨끗한 곳에 남으려는 네게는 무리다."
33100-127 = "그래, 그 세이아도 다시 찾아내서 네가 못다 한 걸 마무리 지어주마."
33100-132 = "……인형?"
33100-138 = "!!"
33100-142 = "아즈사!! 또 도망치는 거냐!!"
33100-143 = "리더, 티파티 포반의 지원 포격이야. 예정 시간보다 대응이 빨라."
33100-148 = "반대쪽에서 50mm 박격포 포격까지. 예비 부대의 선도부 척탄병이 대응하기 시작했어."
33100-149 = "생각보다 빠른 대응이네. 그 히나가 없는 상태에서 이렇게까지……."
33100-153 = "게헨나가 뒤를 찔렀어!! 저 녀석들을 처치하고 부상자들을 구해라!!"
33100-154 = "시야가 확보되기 시작합니다!!"
33100-155 = "……!! 보입니다! 전방에 게헨나의 척탄 부대입니다!!"
33100-157 = "감히 부장님을……!! 절대 용서 못 해요! 트리니티를 쓸어버리고 부장님을 구합니다!!"
33100-158 = "후방의 다른 인원들은 부상자들을 수색하세요!"
33100-159 = "선임행정관님…… 상처가……."
33100-161 = "제 상처는 아무래도 상관없어요! 어서 움직이세요!! 부장님을 찾아내세요!!"
33100-169 = "고, 고성당 외부에 대기하고 있던 게헨나와 티파티의 예비 병력들도 이동하고 있는 것이 확인됐습니다!"
33100-170 = "곧 두 학원의 제식 전차 부대가 이곳에 도착할 거예요."
33100-171 = "아즈사……."
33100-172 = "아즈사는 일단 나중에 생각해, 리더. 이제 어떡하지?"
33100-173 = "……."
33100-174 = "<성도회>는 무사히 확보했다."
33100-175 = "이제 다음 임무는 지하 통로로 트리니티 자치구의 배후로 침투해서, 트리니티부터 쓸어버리는 것."
33100-177 = "시라스 아즈사가 조금이라도 몸담았던 곳을 그냥 놔둘 생각은 없어. 벽돌 하나, 나무 하나까지 남기지 않고 전부 무너트려 버리겠어."
33100-178 = "히, 히이익……. 배, 배신의 대가인가요……."
33100-179 = "……."
33100-180 = "……. 히나가 없는 게헨나는 그다음인가. 이견은 없어. 리더."
33100-181 = "트리니티에는 세이아와 나기사 습격 때 이미 여러 번 침투해봤고, 히나가 없는 게헨나는 오합지졸."
33100-182 = "그렇다면 이제 그 나무 인형이 약속한 <전술 병기>를 확보할 때까지 여기서 기다리며 저 두 학원의 전차와 예비 병력을 상대하면 되는 거군."
33100-187 = "……아아. 그래. 그러니 인사라도 해둘까."
33100-188 = "아리우스를 고통으로 몰아넣었던 트리니티와, 혐오스러운 게헨나 놈들에게."
33100-189 = "네?! 그, 그럼 싸, 싸우는 건가요? 여, 여기서요?"
33100-190 = "네…… 괴, 괴롭겠네요……. 엄청 괴롭겠지만……. 어쩔 수 없겠죠? ……헤헤."
33100-200 = "자아, <성도회>여. 우리 ETO를 도와서 저 <분쟁 대상>들을 배제해다오!"
33100-207 = "저, 저게 뭐야!!"
33100-208 = "으, 으아아아-!! 유, 유령?!"
33100-216 = "다음화;가중되는 혼란 1"
