[translation]
1003102-1 = "올해가 가기 전에"
1003102-2 = "(새해를 며칠 앞둔 어느 날)"
1003102-3 = "아, 선생님. 여기야. 여기."
1003102-4 = "[s1] \"무슨 용건으로 부른 거야?\"\n[s3] \"아루가 부르길래, 스케쥴이 있었지만 취소하고 왔어.\""
1003102-5 = "후후훗, 뭐야…. 선생님, 내 용건이 궁금해?"
1003102-6 = "그야 궁금하겠지. 응. 분명 궁금할 거야……!"
1003102-7 = "[s2] \"궁금하지 않으므로 먼저 돌아가 보겠습니다.\""
1003102-8 = "응?!"
1003102-9 = "노, 농담이야. 선생님! 잠깐 장난쳐본 거라니까……!"
1003102-10 = "그, 그렇게 정색하지 말고 궁금해해 줘……!"
1003102-11 = "어? 정말?"
1003102-12 = "그, 그 미안해……. 역시 오늘 약속은 너무 갑작스러웠나?"
1003102-13 = "으음, 그렇지 않아도 평소 선생님은 무척 바쁘니까."
1003102-14 = "이런 건 정식으로 먼저 신청 절차를 밟은 다음에 약속을 잡아야 하는 거겠지."
1003102-15 = "무리하게 불러내서 미안해."
1003102-16 = "[s4] \"괜찮아. 스케쥴이 있었다는 건 거짓말이니까.\""
1003102-17 = "후훗, 이럴 때도 선생님은 괜찮다고 말해주는구나."
1003102-18 = "……응? 잠깐."
1003102-19 = "(거짓말이었다니, 선생님, 지금 나 놀리고 있는 거야?!)"
1003102-23 = "크, 크흠. 어, 어쨌거나 이야기를 앞으로 되돌려서……."
1003102-24 = "선생님, 앞서 말했다시피 올해도 얼마 남지 않았어."
1003102-25 = "그 말은 곧……."
1003102-26 = "[s] \"그 말은 곧?\""
1003102-27 = "신년 새해도 머지않았다는 뜻이야!"
1003102-28 = "후후훗, 알겠어, 선생님?"
1003102-29 = "이건 비상사태, 이미 이머전시라고 해도 과언이 아니야."
1003102-30 = "[s5] \"과연, 결국 새해에 저질러버리는 거구나!\"\n[s6] \"이날만을 기다리고 있었어. 사장! 같이 처리하자고!\""
1003102-31 = "아무 일도 안 저지르고 처리하지도 않아!"
1003102-32 = "아무 일도 안 저지르고 처리하지도 않아!"
1003102-33 = "선생님은 무슨 생각을 하고 있는 거야?!"
1003102-34 = "난 단지, 새해에 입을 기모노를 렌탈하려는 것뿐인데……?!"
1003102-35 = "[s] \"렌탈?\""
1003102-36 = "흠흠. 새해는 나 같은 사업가에겐 특히나 중요한 날이야."
1003102-37 = "새롭게 시작하는 한 해를 맞이해, 몸과 마음을 깨끗이 준비하고 시작하는 자리……."
1003102-38 = "그런 자리엔 당연히 어울리는 의복을 갖춰야 하지 않겠어?"
1003102-39 = "[s] \"그래서 기모노를 렌탈한다는 거구나.\""
1003102-40 = "후후훗, 시간, 장소, 상황에 따라 어울리는 의관을 입는다."
1003102-41 = "TPO를 지키는 것 또한 사업가로서의 마음가짐이니까. 그만큼 많은 걸 따져보고, 고려해야 하지 않겠어?"
1003102-42 = "그래서 말인데 그……."
1003102-43 = "나 혼자서 정하기보다는, 선생님의 의견을 듣고 싶달까."
1003102-44 = "어른의 의견을 참고하고 싶어서 부른 건……데. 괜찮을까?"
1003102-45 = "[s] \"아루의 부탁이라면 당연히 괜찮지.\""
1003102-46 = "윽, 이런 데서는 또 바로 대답하다니. 치사하다니까……."
1003102-47 = "뭐, 좋아."
1003102-48 = "자, 그럼, 가자. 선생님."
1003102-51 = "[ns7] \"그래서 어떤 기모노를 렌탈할 생각이야?\"\n[ns8] \"찾는 브랜드라도 있어?\""
1003102-52 = "후후훗. 선생님. 이럴 때 필요한 게 바로 사업가로서의 감각이야."
1003102-53 = "후후훗. 선생님. 이럴 때 필요한 게 바로 사업가로서의 감각이야."
1003102-54 = "막상 새해에 어울리는 기모노를 찾는다고, 그저 비싸고 고급스러운 물건을 고르는 건 초보가 저지를 법한 실수지."
1003102-55 = "그렇다고 한정된 예산에 맞추겠답시고 싸구려 물건을 빌려서야, 사업가라고 부를 수조차 없어."
1003102-56 = "[s] \"그러면?\""
1003102-57 = "중요한 건 그 중간의 밸런스를 어떻게 잡느냐야."
1003102-58 = "원단의 재질과 옷의 품질을 확인하면서 가격이 합리적인지 따져봐야지."
1003102-59 = "특히 연말 분위기에 취해, 다들 지갑이 느슨해진 이때를 조심해야 해."
1003102-60 = "자칫 잘못했다간 상술이라는 거대한 함정에 빠져, 생각지 못한 지출을 할 수도 있으니까."
1003102-61 = "연말을 특별히 장식하기 위한 기모노 한 벌 어떠십니까~?"
1003102-62 = "가족, 친구, 연인과 함께 특별한 날을 맞이하기 위한 드레스 코드~! 지금 특별가에 렌탈 서비스 중입니다~!"
1003102-63 = "후훗. 마침 잘됐네. 지켜보고 있어 선생님. 내 실력을 보여줄 테니까."
1003102-66 = "저기, 기모노를 렌탈하고 싶은데요."
1003102-67 = "아! 어서 오세요. 손님. 어떤 물건을 찾고 계신가요?"
1003102-68 = "대충 예산은 5천 엔 정도 선에서 렌탈할 수 있는 물건을 찾고 있습니다만."
1003102-69 = "아, 이거 괜찮아 보이네요. 가격도 적당한 거 같고."
1003102-70 = "오, 손님. 눈썰미가 좋으시군요. 혹시 언제 입게 되는 건가요?"
1003102-71 = "가족 모임? 아니면 친구와 약속? 연인과의 데이트?"
1003102-72 = "여, 연인과의 데이트……?!"
1003102-73 = "흠흠, 아뇨. 사업적인 이야기가 오고 가는 중요한 자리에서 입을 생각……"
1003102-75 = "아니, 그런 중요한 자리에 이런 싸구려 렌탈 물품으로 가신다고요?!"
1003102-77 = "우왓?! 조, 좋은 물건이라면서?!"
1003102-78 = "물론 가족 모임, 친구 모임은 이걸로도 충분합니다만."
1003102-79 = "사업적으로 중요한 자리……."
1003102-80 = "즉 입고 있는 옷이 내 가치를 대변하고, 걸친 액세서리가 내 품격을 보여주는 곳에 이런 물건은 아니죠!"
1003102-81 = "사, 사람의 가치라는 건 그런 물건으로 정해지는 게……."
1003102-82 = "그리고 무엇보다 새해란 1년에 단 하루밖에 없는 특별한 날!"
1003102-83 = "바로 옆에 계신 분과 소중한 추억을 쌓을 수 있는 날이 아닙니까!"
1003102-84 = "으, 응?!"
1003102-85 = "그렇게 생각하시지 않나요. 그쪽 분은?!"
1003102-86 = "[s9] \"글쎄요.\"\n[s10] \"그럴지도.\""
1003102-87 = "서, 선생님……!"
1003102-88 = "서, 선생님……!"
1003102-89 = "자, 그런 자리에 어울리는 물건으로 이건 어떠십니까?"
1003102-93 = "장인이 직접 한 땀 한 땀 자수를 수놓은, 저희 가게에서도 가장 훌륭한 물건입니다!"
1003102-94 = "잠깐, 액수가 단위가 다르잖아?!"
1003102-95 = "하지만 이것만 입으면 사업번창, 가내안전, 만수무강!"
1003102-96 = "그, 그런 효과가 이 옷에?!"
1003102-97 = "그뿐이랴! 거기에 더해 소중한 그 분의 하트를 캐치캐치! 프리하게 큐어하실 수 있을 겁니다!"
1003102-98 = "선생님의 하트를, 캐치, 프리하게 큐어…….?!"
1003102-99 = "선생님, 어떻게 생각해……?"
1003102-100 = "[s11] \"아루의 기모노 입은 모습을 보면 확실하게 하트가 큐어해지긴 하겠지.\"\n[s12] \"하지만 너무 비싸지 않아?\""
1003102-101 = "……으음!"
1003102-102 = "……으음!"
1003102-103 = "자아, 진정한 사업가라면, 이 옷에 감춰진 가치를 알아보고 투자하시는 겁니다! 고작 이 가격에!"
1003102-104 = "과, 과연……. 가치를 지닌 물건에 투자하는 것도, 사업가로서 올바른 전략……."
1003102-105 = "조, 좋아! 나도 할 때는 한다고! 이걸로 하겠어!"
1003102-106 = "렌탈! 감사합니다! 손님!"
1003102-112 = "[ns13] \"정말 괜찮아?\"\n[ns14] \"사업가로서의 실력은?\""
1003102-113 = "괜찮아. 이것 또한 투자의 일종이니까!"
1003102-114 = "괜찮아. 이것 또한 투자의 일종이니까!"
1003102-115 = "응! 괜찮아!"
1003102-116 = "아, 아마 괘, 괜찮을 거야……!"
1003102-118 = "(그 후 아루는 기세등등하게 돌아갔지만, 다리는 조금 떨리고 있었다.)"
