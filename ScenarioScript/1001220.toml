[translation]
1001220-1 = "트레이너의 한계"
1001220-2 = "샬레 인근의 공원"
1001220-3 = "(이른 아침, 조깅 준비를 마치고 공원에서 스미레를 기다리고 있노라니……)"
1001220-10 = "아, 먼저 기다리고 계셨군요. 트레이너."
1001220-11 = "죄송합니다. 준비물을 정리하는 데 시간이 생각보다 오래 걸려서요."
1001220-12 = "[s] \"괜찮아. 오래 기다리지 않았는걸.\""
1001220-14 = "[ns] \"그보다 조깅에도 준비물이 필요해?\""
1001220-15 = "물론이지요."
1001220-16 = "모든 운동이 그렇지만, 운동 효율을 최대한으로 이끌어내기 위해서는 철저한 준비가 필수적입니다."
1001220-17 = "달리기를 할 때 신는 운동화부터 러닝 벨트까지…… 단순해 보이는 장비라도 종류에 맞게 착용하지 않으면 다치거나 큰 부상을 입을 수도 있거든요."
1001220-18 = "[s] \"그렇구나…….\""
1001220-19 = "오늘은 오랜만의 조깅이라, 저도 새로 산 장비를 착용하고 나왔답니다."
1001220-20 = "새로운 장소에서 새로운 운동을 하려니, 어쩐지 조금 긴장이 되네요. 후후."
1001220-21 = "그럼…… 가볍게 한 번 뛰어볼까요?"
1001220-28 = "(약 10분 뒤……)"
1001220-36 = "헉, 헉……"
1001220-37 = "[s] \"……괜찮아, 스미레?\""
1001220-38 = "괜찮습니다. 아직 1km도 채 뛰지 않았으니까요."
1001220-39 = "앞으로도 한참은 더 달릴 수 있습니다."
1001220-40 = "[s1] \"하지만 평소와는 다르게 금세 지친 것처럼 보이는데……\"\n[s2] \"몸이 안 좋은 거 아냐?\""
1001220-47 = "아뇨…… 그렇지는 않습니다."
1001220-48 = "오히려 컨디션이라면 평소보다 훨씬 더 괜찮게 느껴질 정도인걸요."
1001220-49 = "다만 숨이 금방 차게 되는 이유라면……"
1001220-54 = "역시 이 모래주머니 때문일까요……?"
1001220-55 = "[s] \"……모래주머니?\""
1001220-56 = "네, 오늘은 조깅을 나올 때 팔과 다리에 모래주머니를 차고 나왔거든요."
1001220-57 = "평소보다 운동 부하가 높아진 탓에 호흡이 가빠졌을지도 모르겠습니다."
1001220-58 = "[s3] \"모래주머니까지 차고 조깅을 하다니, 대단하네……\"\n[s4] \"평소의 운동량으로도 충분하지 않아?\""
1001220-61 = "꾸준히 근력을 성장시키기 위해서는 끊임없이 근육에 부하를 주어야 하니까요."
1001220-62 = "물론 무리하지 않는 것도 중요하지만, 반복되는 평이한 상태에 안주하면 성장도 거기서 멈추고 맙니다."
1001220-63 = "자신의 한계를 인지하고, 그 한계를 넘어서기 위해 끊임없이 도전하는 것이야말로 올바른 트레이닝의 자세라고 할 수 있지요!"
1001220-64 = "[s] \"훌륭한 마음가짐이네……\""
1001220-66 = "[ns] \"그 말을 들으니 나도 조금은 운동 강도를 높여야겠는 걸.\""
1001220-67 = "좋은 생각입니다, 트레이너."
1001220-68 = "운동 강도를 높이신다면, 이 모래주머니를 차고 운동하시는 건 어떠신가요?"
1001220-69 = "양 손발에 차기 위해 두 세트를 가져왔으니 한 세트 정도는 빌려드릴 수 있습니다."
1001220-70 = "[s] \"그럼 어디……\""
1001220-75 = "[ns] \"무, 무거워……?!\""
1001220-76 = "어라? 그렇게 무거우신가요?"
1001220-77 = "무리가 가지 않도록 적당히 팔다리에 부하가 걸릴 정도의 무게로만 설정했는데……"
1001220-78 = "[s] \"이 모래주머니…… 몇 kg이나 되는 거야?\""
1001220-79 = "그렇게 무겁지는 않습니다만……"
1001220-80 = "……한쪽에 5kg씩이니, 합쳐서 10kg 정도?"
1001220-81 = "[s] \"그 정도면 덤벨을 들고 달리는 것과 다를 바가 없잖아?\""
1001220-82 = "덤벨을 들고 달린다……"
1001220-83 = "후후, 그것도 재미있는 발상이네요."
1001220-84 = "다음번에는 덤벨을 들고 조깅을 하는 것도 나쁘지는 않겠습니다."
1001220-85 = "[ns5] (양발이 족쇄를 찬 것처럼 무거워……)\n[ns6] (스미레는 이런 걸 차고 계속 달려온 거야?)"
1001220-89 = "자자, 트레이너. 트랙을 완주하려면 아직 한참 남았으니 좀 더 힘을 내서 달려보자고요!"
1001220-90 = "하나, 둘! 하나, 둘!"
1001220-99 = "[ns] \"가…… 같이 가……!\""
1001220-101 = "(이후, 스미레가 준 모래주머니를 차고 조깅을 계속하려 했지만……)"
1001220-102 = "(모래주머니의 무게가 너무 무거워, 얼마 가지 못하고 퍼져버리고 말았다.)"
