[translation]
13310-1 = "제31화;유일한 진실 1"
13310-3 = "(……몸이 움직이지 않아.)"
13310-5 = "그래, 전부 끝났어. 타카나시 호시노. 그대로 누워 있어."
13310-6 = "(끝나……? 어째서……?)"
13310-13 = "……어째서 네가?"
13310-14 = "이해할 수 없어. 어째서……? 넌…… 이 일과 무관하잖아……."
13310-15 = "선생님이 부탁했어. 널 막아달라고."
13310-16 = "그리고 나도 무관하지 않아."
13310-17 = "……."
13310-18 = "저 열차포는……. 게헨나의 뇌제의 유산이야. 나는 그걸 하나도 남기지 않고 파괴해야만 해."
13310-19 = "게헨나의 폭군…… 뇌제……?"
13310-20 = "뇌제의 유산은 언제나 키보토스에 파국을 불러왔으니까."
13310-21 = "하지만 설마 아비도스에도 남겨두었을 거라곤 생각하지 못했지만……."
13310-22 = "게헨나……. 그런가. 너는……. 너도 열차포를…… 노리는 거구나……."
13310-23 = "하지만 어떻게……? 저건 카이저의 것이라서……."
13310-24 = "아니. 그런 건 어떻게든 해결할 수 있어."
13310-25 = "너도 알고 있잖아?"
13310-27 = "……."
13310-28 = "이미 알고 있었잖아. 타카나시 호시노!!"
13310-29 = "어떻게든 할 수 있다는 걸!"
13310-33 = "선생님과 모든 사람들이 그렇게 말해왔을 거야. 어떻게든 될 거라고. 선생님이라면 어떻게든 해주었을 거야."
13310-34 = "실제로도 몇 번이나 그런 것을 봐왔잖아. 호시노, 너는."
13310-35 = "……."
13310-36 = "하지만 그런데도 너는 멈추지 않았어. 아니, ……멈추지 못했던 거겠지."
13310-38 = "쿠치나시 유메 때문에."
13310-39 = "……."
13310-40 = "쿠치나시 유메의 뜻을 지켜야만 한다, 그렇게 생각한 거겠지. 그녀가 매매계약서를 남긴 것은 열차포를 파괴하기 위해서였을 거라고."
13310-41 = "하지만 아니야."
13310-42 = "유메는 그 당시에 <사막횡단철도>에 열차포가 존재한다는 사실을 몰랐어. 뇌제의 유산을 추적해 온 나와 마코토조차도 모르고 있었으니까."
13310-43 = "……."
13310-44 = "그 학생회장은, <사막횡단철도>는 아비도스 학생회와 네프티스가 어떻게든 자치구를 부흥시키기려고 노력했던 흔적이기 때문에, 그걸 보존해야 한다고 생각했던 거야."
13310-45 = "그녀는 이 바보 같은 사막횡단철도도 부정해선 안 될 아비도스의 일부라고 생각했던 거겠지."
13310-47 = "그녀는 매매계약의 계약금 1만 엔을 입금하기 위해 자치구 외곽의 은행을 서둘러 가려고 사막을 가로지르다가…… 사고를 당한 거야."
13310-52 = "매매계약서…… <아비도스 학생회>는 네프티스로부터 사막횡단철도의 부속 시설 운용 권리를 100만 엔에 매수하며…… 계약금 1만 엔은 즉시 지급한다……."
13310-54 = "네. 그렇습니다. 계약서 작성과 계약금 전달까지는 확인되었지만, 그 이후 판매 대금 입금이 안 된 채로 멈춰버린 상태입니다. 2년 동안요."
13310-56 = "유메 선배가……? 그걸…… 네가…… 어떻게 알아……?"
13310-60 = "……. 그 당시에는 다들 쉬쉬했지만 그래도 키보토스에서 학생의 죽음은 큰 사건이니까."
13310-61 = "그건 그 당시 게헨나 정보부에서는 반드시 확인해야만 하는 큰 일이었어."
13310-63 = "그건 사고였어. 타카나시 호시노."
13310-64 = "그 누구의 잘못도 아니야. 예측 불가능한 천재지변이었을 뿐이니까."
13310-65 = "……. 그걸 너의 죄로 여기지 마."
13310-66 = "내가?"
13310-67 = "나에 대해서 뭘 안다고……?"
13310-68 = "……."
13310-69 = "알고 있어. ……유메의 죽음에 대한 정보를 수집한 것이 나였으니까."
13310-70 = "네가……?"
13310-71 = "정보부에 있을 때부터, 나는 너를 알고 있었어."
13310-72 = "나는 너를 알아."
13310-74 = "너는 누구보다 강했기 때문에 누군가에게 도움을 청한다는 것 자체가 이해되지 않았을 거야."
13310-75 = "부탁할 수 있는 의지할 사람이 주변에 아무도 없었으니까."
13310-76 = "그러니까 [ruby=.]자[/ruby][ruby=.]신[/ruby][ruby=.]이[/ruby] [ruby=.]지[/ruby][ruby=.]키[/ruby][ruby=.]지[/ruby] [ruby=.]않[/ruby][ruby=.]으[/ruby][ruby=.]면[/ruby] [ruby=.]안[/ruby] [ruby=.]된[/ruby][ruby=.]다[/ruby]고 언제나 그렇게 생각해 왔겠지."
13310-77 = "그래서 그게 칼날이 되어서 진심과는 다른 형태로 주변을 공격하게 되었을 거고."
13310-79 = "하지만 너는 그럼에도 도망치지 않고 아비도스에 남았어."
13310-80 = "너는 나보다 강한 사람이야."
13310-81 = "그럼에도 지키고 싶었던 게 있었던 거니까."
13310-82 = "내가 지키고 싶었던 것……."
13310-84 = "대체 무슨 짓을 저지른 거예요!!"
13310-87 = "기다리고 있었습니다. 새벽의 호루스. 아비도스……아니, 키보토스 최고의 신비."
13310-88 = "당신에게 제안할 것이 있습니다."
13310-90 = "……? 내 이름은 타카나시 호시노야. 검은 양복."
13310-91 = "……크크큭. 그렇군요. 키보토스에서 부르는 이름인가요."
13310-92 = "이런이런. 알겠습니다. 그럼 저에게도 키보토스의 이름이 필요할지도 모르겠군요."
13310-94 = "[ruby=.]검[/ruby][ruby=.]은[/ruby] [ruby=.]양[/ruby][ruby=.]복[/ruby]……. 좋습니다, 그걸 제 이름으로 하겠습니다."
13310-95 = "……?"
13310-98 = "소식은 들었습니다."
13310-99 = "학생회장이 사라진 지금, 부학생회장인 당신이 빚을 갚아나가실 겁니까? 타카나시 호시노 씨?"
13310-100 = "아니면…… 저의 제안을 들어보시겠습니까?"
13310-101 = "……. 아니. 들을 필요도 없어."
13310-102 = "어째서……? 당신은 더 이상 거기 남아 있을 이유가 없잖아요?"
13310-105 = "아비도스 학교를 자퇴하고 제가 관리하는 기업 소속이 된다는 조건으로, 지금 아비도스가 진 빚을 절반 탕감해 드리겠습니다."
13310-106 = "큭, 큭큭큭……. 자아, 대답은요? 예스입니까? 그렇다면 어서 여기에 사인을."
13310-108 = "아니, 몇 번이나 대답했잖아. 거절이야."
13310-109 = "……. 어째서?"
13310-110 = "뭘 위해서 거기 남아 있는 거죠?"
13310-112 = "나는…… 뭘 위해서……. 나는……."
13310-113 = "하지만 열차포가…… 그걸 그대로 두면……."
13310-114 = "아니, 열차포는 선생님이 대책위원회와 함께 추격하고 있는 중이야."
13310-120 = "우와아아아아-!!"
13310-121 = "우오오-"
13310-125 = "곧 열차포를 따라잡을 거예요!"
13310-126 = "어찌저찌 우리를 카이저에게서 구해준 건 고맙긴 한데…… 저거 좀 위험해 보이는데 괜찮은 거야?"
13310-127 = "그러니까 막아야 해요! 열차포와 충돌 즉시 바로 거기에 올라타는 거예요! 시로코 쨩, 세리카 쨩!"
13310-128 = "응, 알겠어."
13310-129 = "그, 그런데 속도 너무 빠르지 않아?"
13310-131 = "선생님! 서둘러야 해요!! 열차포의 주포에서 강력한 에너지가 탐지되고 있어요!! 쏘려나 봐요!!"
13310-132 = "색적. 지하생활자의 위치 추적 중……. 선생님, 지하생활자는 현재 호시노 씨에게 계속 접근 중입니다!"
13310-133 = "제가 방해 중이지만, 지하생활자의 위치는 차원 중첩 상태를 유지 중이라……!"
13310-134 = "[s1] \"알겠어!!\"\n[s2] \"어떻게든, 막아야만 해!! 열차포도, 호시노도!!\""
13310-139 = "충격 5초 전!!"
13310-140 = "간다!! 준비해!"
13310-141 = "열차포…… 내 손으로 부수는 게 아쉬울-뿐-"
13310-146 = "갑니다!!"
13310-148 = "응!"
13310-150 = "으와아아아-!"
13310-158 = "다음화;유일한 진실 2"
