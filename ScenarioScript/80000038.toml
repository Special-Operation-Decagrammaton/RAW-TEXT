[translation]
80000038-1 = "룰렛 미스디렉션!"
80000038-2 = "(무츠키의 호출을 받아 오래간만에 흥신소 사무실에 얼굴을 비췄을 때였다.)"
80000038-8 = "어~흥! 잡~아~먹~는~다~!"
80000038-14 = "[ns] \"자, 잠깐?! 무츠키?!\""
80000038-16 = "꺄하하핫! 깜짝 놀랐어? 선생님?!"
80000038-17 = "그러게 내 앞에서 그렇게 무방비하게 빈틈을 보이면 안 된다구~?"
80000038-18 = "눈 깜짝할 새에 무츠키 쨩에게 잡아 먹힐지도 모르니까~!"
80000038-19 = "쿠흐흣. 앞으로는 조.심.해~? 꺄하핫~!"
80000038-20 = "[s1] \"네에……. 앞으로 주의하겠습니다…….\"\n[s2] \"그래서 무슨 일로 부른 거야?\""
80000038-21 = "아항~ 오늘 선생님을 부른 건~"
80000038-22 = "아항~ 오늘 선생님을 부른 건~"
80000038-23 = "응! 게임을 하려고 부른 거야! 이거!"
80000038-29 = "[ns3] \"탄환 모양의 초콜릿?\"\n[ns4] \"러시안…… 룰렛 초콜릿……?\""
80000038-30 = "쿠후훗, 맞아! 얼마 전에 인터넷을 검색하다가 재미있어 보이는 물건이 있길래, 바로 사버렸지롱~!"
80000038-31 = "쿠후훗, 맞아! 얼마 전에 인터넷을 검색하다가 재미있어 보이는 물건이 있길래, 바로 사버렸지롱~!"
80000038-32 = "바로 그 유명한 러시안 룰렛 초콜릿이야~!"
80000038-33 = "마침 오늘이 발렌타인 데이이기도 하고? 선생님이랑 이걸 가지고 같이 놀아볼까~ 해서 말이야~!"
80000038-34 = "무츠키 쨩은, 선생님이랑 노는 오늘만을 애타게 기다려왔거든~!"
80000038-35 = "기쁘지. 선생님~? 나랑 놀아줄 거지~? 응~? 으응~?"
80000038-36 = "[s5] \"무츠키가 그렇게 말해주는 건 무척 기쁘지만…….\"\n[s6] \"러시안 룰렛이라니, 뭔가 엄청 불길한데…….\""
80000038-37 = "아핫~ 너무 겁먹을 필요 없다구?"
80000038-38 = "아핫~ 너무 겁먹을 필요 없다구?"
80000038-43 = "규칙은 간단해. 여기 있는 초콜릿 6개 중에는 무지무지 매운맛의 초콜릿이 섞여 있습니다~"
80000038-44 = "[s] \"포장지에 적힌 대로라면 6개 중에서 2개가 당첨, 이란 거구나.\""
80000038-45 = "흐응~ 그러니까 선생님이랑 나, 둘이서 각각 초콜릿을 절반씩 나눠 가진 다음"
80000038-46 = "그걸 먹고 매운맛을 먹게 된 사람이 당첨! 지게 되는 거야~!"
80000038-47 = "어때? 이름하야 초 러시안 룰렛 게임! 재밌어 보이지 않아?!"
80000038-48 = "[s] \"어째서 발렌타인 데이에 이런 무자비한 게임을…….\""
80000038-49 = "뭐야~ 선생님, 시작하기도 전부터 발을 빼는 거야~? 그러고도 어른이라고 할 수 있어?"
80000038-50 = "[s] \"잠깐, 뭣이라?!\""
80000038-51 = "아, 물론~ 이런 게임은 늘 이 무츠키 쨩이 승리하니까~ 시작하기도 전에 선생님이 겁을 먹는 것도 어쩔 수 없겠지만 말이야~"
80000038-52 = "쿠흐흣, 어쩔 수 없네~ 이해심 많은 내가 이해해줄 수밖에~"
80000038-53 = "응. 이해심 넘치는 무츠키 쨩이 이렇게 넘어가 준다니~ 운이 좋았네, 안 그래? 선.생.님~?"
80000038-54 = "[s] \"이 녀석! 좋아! 그 맹랑한 도전! 받아주겠어!\""
80000038-55 = "꺄하하~! 그렇게 나와줘야 선생님이지~! 응!"
80000038-60 = "자, 그럼, 여기 초콜릿 중에 선생님이 먼저 3개를 골라."
80000038-61 = "내가 먼저 고르면 또 속임수가 있지 않을까~ 의심할 거 같으니, 특별히 먼저 기회를 줄게."
80000038-62 = "[s] \"과연, 그렇게 나오시겠다. 이거지. 그럼……!\""
80000038-64 = "(그렇게 무츠키보다 먼저 3개의 초콜릿을 골랐다.)"
80000038-66 = "쿠후훗, 그럼 이제……. 숫자를 센 뒤에 한번에 먹는 거야?"
80000038-67 = "자자~ 누가 이기는지 승부야~!"
80000038-69 = "하나~ 둘~"
80000038-70 = "셋!"
80000038-75 = "[ns] \"………?!?!\""
80000038-79 = "[ns7] \"쿨럭쿨럭쿨럭!!\"\n[ns8] \"이거 초콜릿 세 개 다…… 매운맛이잖아?! 어떻게 된 거야?!\""
80000038-80 = "풋……. 푸훗."
80000038-81 = "풋……. 푸훗."
80000038-82 = "푸핫! 아하하하!! 선생님! 꼼짝없이 속았네! 쿠후훗!!"
80000038-83 = "아, 왜 선생님이 가져간 초콜릿이 2개도 아니고, 3개 전부가 매운맛이냐고? 그야~~"
80000038-84 = "실은 이거, 미리 패키지 여러 개를 까서 매운맛 초콜릿만 6개를 모아뒀던 거니까~!"
80000038-85 = "즉 이 게임의 진짜 룰은 처음부터 먼저 초콜릿을 먹은 사람이 패배하는! 엄청 엄청 무서운 게임이었던 겁니다~! 쨔잔~"
80000038-86 = "[s] \"소, 속임수! 사기다!\""
80000038-87 = "속~임~수~? 하지만 난 어디까지나 이 6개 안에 매운 초콜릿이 있다고만 말했을 뿐이라고?"
80000038-88 = "이 안에서 단 2개만 당첨이라고는 말 안 했는걸?"
80000038-89 = "그렇게 말하고 혼자 오해한 건 어디까지나 선생님이었고."
80000038-90 = "[s] \"……서, 설마 처음부터 치밀하게 계획된 미스디렉션?!\""
80000038-91 = "아하하~! 이번에도 간단하게 승리해 버리다니."
80000038-92 = "으음~ 여기까지 오면 나 스스로의 재능이 너무너무 무서워질지도~? 아하핫!"
80000038-93 = "[s] \"…….\""
80000038-94 = "응? 저기, 선생님. 왜 말이 없어?"
80000038-95 = "……아, 혹시, 그, 너무 매웠던 거야? 그렇게 매운 건 아니라고 들었는데. 저기-"
80000038-96 = "[s] \"아니, 아직 게임은 끝나지 않았어…….\""
80000038-97 = "어? 선생님……? 저기, 눈이, 조금 무섭달까……. 저기요~?"
80000038-98 = "[s9] \"자, 무츠키도 가져간 3개의 초콜릿을 먹어야지.\"\n[s10] \"룰에 따르면 그래야 게임이 성립되니까.\""
80000038-99 = "뭐?! 아니, 분명 앞에서 그런 말을 하긴 했지만. 그래도 여기까지 와서 그런 억지를……."
80000038-100 = "뭐?! 아니, 분명 앞에서 그런 말을 하긴 했지만. 그래도 여기까지 와서 그런 억지를……."
80000038-105 = "꺄아~! 선생님한테 잡아 먹혀버린다아~!"
80000038-106 = "선생님, 여기서 저질러버리는 거구나~!"
80000038-107 = "[s] \"무, 무츠키?! 잠깐?! 누가 들으면 오해할 말을?!\""
80000038-108 = "앗, 빈틈이다~! 에잇!"
80000038-112 = "쿠후훗~! 당황한 선생님의 얼굴, 응~! 마음에 들었어!"
80000038-113 = "그럼 오늘도 이렇게 재미있게 놀았으니까~! 꺄하하, 도망이야~!"
80000038-114 = "난 이만 가볼게~! 남은 초콜릿, 여기 선물로 두고 갈 테니까~!"
80000038-115 = "그럼 나중에 또 놀자. 선생님~!"
80000038-119 = "[ns] \"으, 으윽. 또, 졌다…….\""
80000038-121 = "(그렇게 무츠키가 두고 간 러시안 룰렛 초콜릿은……, 의외로 중독성이 있어서 맛있었다.)"
