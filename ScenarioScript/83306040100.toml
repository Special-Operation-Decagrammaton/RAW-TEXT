[translation]
83306040100-6 = "아, 아으…… 아으으…… 이를 어째……"
83306040100-7 = "음? 무슨 일이지?"
83306040100-8 = "부, 부장님?! 여, 여긴 어쩐 일로……!"
83306040100-9 = "혹시 모를 상황을 대비해, 가볍게 시찰을 돌고 있었어."
83306040100-10 = "헌데…… 뭔가 상황이 발생한 건가?"
83306040100-11 = "그, 그게…………"
83306040100-12 = "죄, 죄송합니다! 제가 잠시 조는 사이에……! 감옥에 수감했던 온천개발부 부장이 자취를 감춰버렸습니다!"
83306040100-13 = "제 태만으로 인해 이런 커다란 실수를 해버려서 정말 죄송……!"
83306040100-14 = "아니, 잘잘못을 따지는 것이라면 됐어. 중요한 건 사태를 해결하는 거니까."
83306040100-15 = "부, 부장님……!"
83306040100-16 = "……상대는 온천개발부니까. 앗차 하는 사이에 일이 벌어져도 놀랍지 않아."
83306040100-17 = "우선은 현장을 살펴보는 것부터 시작해야겠네."
