[translation]
10058040-1 = "제4화;Time On Target"
10058040-2 = "방금 뭐였어?! 미사일이 저렇게 움직이는 게 가능해?"
10058040-3 = "일부러 불안정한 급기동을 하면서, 온전히 육감만으로 추락하지 않게 제어하다니……."
10058040-4 = "그걸 물어본 게 아니잖아! 뭐 이런 이상한 팀들밖에 없는 거야?"
10058040-5 = "그냥 레이싱으로만 알고 온 팀은 우리밖에 없는 것 같네."
10058040-6 = "게헨나 컵은 에리나, 네가 제일 잘 안다면서?!"
10058040-7 = "라디오랑 신문에서는 바이애슬론 같은 거라고 했단 말야!"
10058040-8 = "진짜 싸우는 거라고는 생각 못 했지!"
10058040-9 = "'숨을 쉬었다'는 내용이 소설에 안 나오는 거랑 비슷한 이치."
10058040-14 = "라나, 정지!! 앞에서 또 싸움 붙었어!"
10058040-15 = "왜 도망가는 곳마다 치고받는 거야-!"
10058040-16 = "저기 저 수풀 속으로 우회하자! 빨리!"
10058040-17 = "수풀만 갈 거면 탱크 앞에 잔디깎이 기계도 달아둘걸."
10058040-18 = "됐으니까 빨리이-!!!"
10058040-21 = "아카리 씨, 반대편 궤도에도 쏴주시겠어요?"
10058040-22 = "미식처럼 포격도 추구해보죠. 저 전차는 사격 연습 표적이 되어 줘야겠군요."
10058040-23 = "히이잉- 교대해 주면 안 돼? 아까부터 포탄 넣느라 허리가 아픈데-"
10058040-24 = "장전수 한다고 할 때는 언제고! 지금은 어차피 교대 못 해줘!"
10058040-25 = "그치만 '장전'이라길래, 잘 모르겠지만 뭔가 맛있는 부침개 같은 게 아닐까 생각했단 말이야-"
10058040-26 = "한 발 더 나갑니다-★"
10058040-32 = "양 궤도 파괴, 기동 불능입니다!"
10058040-33 = "앗차차- 장난감처럼 갖고 놀기로 했나 봄다."
10058040-34 = "마시로, 대응 사격은 가능함까?"
10058040-37 = "히얏……!"
10058040-38 = "아까, 포신이 포탄에 맞아서 괜찮을지 모르겠습니다."
10058040-39 = "휘어지는 탄도를 보정하면 맞힐 수는 있겠습니다만……."
10058040-40 = "아아- 그런 거라면 됐슴다. 약실이 손상됐으면 포탑 안에서 폭발할 수도 있잖슴까."
10058040-41 = "그럼…… 다들 수고하셨슴다."
10058040-44 = "직성 풀릴 때까지 저럴 것 같으니까, 그동안 차라도 한잔 어떠심까? 이 전차, 물 끓이는 포트가 있슴다."
10058040-45 = "그러면, 밀크티로 부탁드립니다."
10058040-46 = "저, 저는 설탕만 넣는 걸로 부탁드릴게요……!"
10058040-47 = "차 두 잔 바로 대령하겠슴다-"
10058040-48 = "응……? 그나저나 포탄이 다 떨어졌나, 조용해지지 않았슴까?"
10058040-49 = "저건……."
10058040-50 = "선배. 차장 조준경으로 적 게헨나 전차 보시겠어요?"
10058040-51 = "뭔 일이길래 그러는……."
10058040-60 = "저 사람은……. 누굼까?"
10058040-61 = "마시로, 입 모양으로 말하는 거 이해할 수 있지 않았슴까?"
10058040-62 = "멀어서 잘은 모르겠습니다만……."
10058040-68 = "'한두 번 당해야지. 이젠 못 참아.'"
10058040-69 = "'하우나, 아하리, 슌코, 히즈미.'"
10058040-70 = "'내 급양차 내놔.'"
10058040-72 = "아앗! 여기서 이변에 이변이!"
10058040-73 = "예선도 안 거쳤으면서 급양부 전차를 몰고 멋대로 난입한 미식연구부! 결국 차주에 의해서 처참하게 박살 나고 마네요!"
10058040-74 = "뭐, 그럴 수도 있죠!"
10058040-75 = "[s] \"난입이 허용돼?!\""
10058040-76 = "아니, 당연히 안 되죠?"
10058040-77 = "끝까지 살아남아도 우승은 못 하니까, 여기서 탈락하는 게 오히려 나을지도 모르겠네요!"
10058040-78 = "그치만 되게 재밌었어-!"
10058040-80 = "대체 뭐가 뭔지……."
10058040-81 = "아, 다들 전차 밖으로 도망치고 있어요. 한 명이 넘어졌습니다."
10058040-82 = "'버리고 가지 마. 으아앙.'"
10058040-83 = "'복수할 테다. 죽어서 복수할 거야.'"
10058040-84 = "이, 이제 그만 읽어도 될 것 같슴다. 수고했슴다, 마시로."
10058040-85 = "그러면 다시 수리하고 이동할까요?"
10058040-86 = "위협이 없으면 그래도 될 것 같긴 한데……."
10058040-87 = "!!"
10058040-88 = "적 포탄 낙하!!"
10058040-95 = "이 연사 간격……. 협공당하는 것 같습니다!"
10058040-96 = "꺄아!!!"
10058040-101 = "맞으면 럭키-인데, 제대로 맞혔네-"
10058040-102 = "대단하네, 너희들. 한 지점에 여러 발을 동시에 떨어뜨리다니."
10058040-103 = "연습의 성과지! 부국장님, 다음 목표는 뭘로 할까요?"
10058040-106 = "짜샤, 당연히 마지막 과녁이지! 주변에 알짱거리던 잔챙이도 치웠으니까!"
10058040-107 = "제원 하달, 제원 하달. 편각 2745, 사각 550, 교통정리용, 장약 8호. 준비된 포반으로부터 사격 준비 보고!"
10058040-108 = "편각 2745, 사각 550, 교통정리용, 장약 8호-"
10058040-109 = "순마 3호포 사격 준비 끝."
10058040-110 = "준비, 쏴!"
10058040-114 = "오-! 그러는 사이에, 발키리 경찰학교의 <순마 3호>팀! 마지막 5번째 과녁을 맞혔습니다! 바로 1등에 등극하네요!"
10058040-115 = "저 언니들은 다른 언니들처럼 멀리 안 움직였어-!"
10058040-116 = "[s] \"거의 출발선 직후에 멈춰 섰는데?\""
10058040-117 = "어쨌건 과녁만 모두 맞히고 출발점으로 돌아오면 되는 거니까요! 제자리에서 모든 걸 해결해 버린 거죠!"
10058040-118 = "엄청엄청엄청 비겁해 보이지만, 룰에서 금지하지는 않았으니 오케이겠죠!"
10058040-119 = "룰을 어기지는 않는다는 점이 역시 경찰답네요! 아하하!"
10058040-120 = "이대로 발키리 팀이 결승점에 들어오면 그대로 경기 종료입니다! 과연과연과연 그 결말은-?!"
10058040-121 = "채널 고정이래!"
10058040-123 = "움직이지 않고 제자리에서 방아끈 딸깍거리는 걸로 끝내다니,"
10058040-124 = "부국장님, 제법이잖아."
10058040-127 = "공무원에게 제일 중요한 점심시간을 놓칠 순 없지!"
10058040-128 = "그리고 오늘의 운세. '너무 오래 시간을 끌지 말라'."
10058040-129 = "이렇게 후딱 해치우면 불운도 피해 가는 거지! 크하하하!!"
10058040-130 = "얼른 우승은 날로 먹고, 푹 익힌 돈코츠 라멘이나 먹으러 가자!"
10058040-131 = "우으……. 뭔가 불법은 아니지만 양심에 찔리는데요……."
10058040-132 = "인마, 불법만 아니면 된 거지! 자, 얼른 정리하고 출발하-"
10058040-133 = "엥?"
10058040-136 = "이쯤이면 아무도 없겠지?!"
10058040-137 = "당연하지, 안나 너는 걱정이 너무 많아!"
10058040-139 = "어?"
10058040-140 = "아?"
10058040-143 = "우와아악?!!"
10058040-144 = "라나!! 빽!! 전속으로 빽!!!!!"
10058040-145 = "뭐해!! 빨리 포로 날려버려!!"
10058040-146 = "그렇지만 부국장님, 이미 전탄 다 소모했는데요?!"
10058040-147 = "키리노! 빨리 도망가야 해!! 밟아, 밟아!!!"
10058040-148 = "그나저나 저 탱크, 대단하구먼!! 공도에 끌고 나오면 튜닝 파츠만으로도 교정국에 가겠는데?!"
10058040-150 = "뭔 전차가 저렇게 무식하게 커?!"
10058040-151 = "아까 언덕 아래를 쑥대밭으로 만들던 게 저거였나 봐!!"
10058040-152 = "뭐해 라나!! 어서 도망가야지!!"
10058040-153 = "잠자는 곰인데?"
10058040-154 = "응? 곰?"
10058040-155 = "저거. 움직이지도 않고 포를 쏘지도 않잖아."
10058040-156 = "어……?"
10058040-158 = "출발, 출발!!!"
10058040-159 = "네!! 알겠습니다!!!"
10058040-160 = "안전벨트 착용!!"
10058040-161 = "그래, 안전벨트 착용……."
10058040-162 = "뭐?!"
10058040-163 = "브레이크 밟고 시동 걸기!! 기어 변속 D단! 확인! 후사경 조정!! 확인!!"
10058040-164 = "뭐 하는 거야?!?!!!!"
10058040-165 = "출발하기 전에 절차입니다!"
10058040-166 = "어디까지 했더라?! 그, 그렇지! 방향지시등 확인!!"
10058040-167 = "운전면허 시험이 아니라구!!!!!!!!"
10058040-170 = "끄아앙!!!!"
10058040-173 = "허억……. 헉……."
10058040-174 = "하아……. 하……."
10058040-175 = "오우. 퍼스트 블러드."
10058040-176 = "격파한 거야……? 우리가…… 직접……?"
10058040-177 = "아, 아하하……. 손 떨려……."
10058040-178 = "음."
10058040-179 = "짜릿."
10058040-180 = "라나는 뭐 이리 태연한 거야?"
10058040-181 = "이럴 때가 아냐!! 여기 멈춰있으면 우리도 당할 거라고!!!"
10058040-182 = "출발-"
10058040-191 = "부국장님, 괜찮으십니까?!"
10058040-192 = "역시, 운세는 정확하네에……."
10058040-193 = "갸아악……!"
