[translation]
10012015-2 = "아으으……. 아야, 아야……. 까질 뻔했네……."
10012015-3 = "모두 괜찮아? 다친 데는 없고?"
10012015-4 = "응. ……아야네도 무사해."
10012015-5 = "고, 고마워요, 시로코 선배."
10012015-6 = "서, 선생님은……?! 선생님은 괜찮은 거야!?"
10012015-12 = "걱정하지 말아요~. 모두 무사하니까."
10012015-13 = "이야~. 정말이지 화려하게 깨우는구나. 이렇게까지는 안 해도 일어날 텐데 말이지……."
10012015-14 = "노노미 선배! 호시노 선배!"
10012015-15 = "[s1] \"덕분에 무사했네. 고마워, 노노미.\"\n[s2] \"걱정해 준 거야, 세리카?\""
10012015-16 = "후훗. 별말씀을요."
10012015-17 = "뭐, 뭣! 누, 누가 걱정했다고 그래!? 그냥 물어본 것뿐이잖아?"
10012015-18 = "모두 무사해서 다행이야. 누가 다쳤다면 이 아저씨 울었을 거라고~."
10012015-20 = "……다행히 수영복도 무사해. 문제없어."
10012015-21 = "여기서 그걸 신경 쓰는 거야!?"
10012015-22 = "아, 아니. 뭐, 여분이 있는 것도 아니니까 찢어지면 곤란하긴 하지만……."
10012015-23 = "[s3] \"준비해온 수영복이 더러워지지 않아서 다행이야.\"\n[s4] \"다치지 않아서 다행이다.\""
10012015-24 = "……정말?"
10012015-25 = "……정말?"
10012015-26 = "저, 정말! 그런 식으로 말하지 말라고, 괜히 더 신경 쓰이잖아!?"
10012015-32 = "[ns] \"……아야네?\""
10012015-33 = "네, 넷!? 아, 아뇨! 아무것도 아니에요. 아하하……."
10012015-34 = "그, 그래도 일단 목표한 섬까지 도착하긴 했으니까요. 다친 사람도 없고……."
10012015-35 = "비록 헬기는……. 저렇게 돼버리긴 했지만……."
10012015-36 = "……으음. 파손 상태를 보면 당분간 탈 수 없을 거 같아."
10012015-37 = "고칠 수 있는 상태긴 하지만……. 시간이 필요해."
10012015-38 = "죄송합니다. 제가 운전을 잘했더라면……. 모처럼 우리에게 생긴 비품이었는데……."
10012015-40 = "……뭐!? 그게 무슨 소리야!? 왜 아야네가 사과하는 건데? 운전이랑은 상관없잖아?"
10012015-41 = "추락하기 전 상황 기억 안 나는 거야? 갑자기 퍽 하더니 고장 났는데, 그걸 우리가 어떻게 대처해?"
10012015-42 = "출발 전 정비 때에는 아무 이상 없었다고, 몇 번이나 확인했는데!"
10012015-43 = "이건 명백히 판 녀석들이 하자 있는 상태로 넘긴 거지! 우린 사기당한 피해자라니까!!"
10012015-44 = "그, 그건……."
10012015-45 = "[s5] \"세리카 말이 맞아, 아야네 잘못이 아니야..\"\n[s6] \"우선 리조트로 가자. 분명 고칠 방법이 있을 거야.\""
10012015-46 = "선생님까지……."
10012015-47 = "선생님까지……."
10012015-48 = "여, 역시 그게 좋겠죠……? 리조트에만 가면……. 어떻게든 고칠 수 있겠죠?"
10012015-50 = "응응! 팸플릿에는 엄청나게 크고 부유한 리조트라고 적혀 있었으니까요."
10012015-51 = "부품이나 정비 지원을 요청하면 어떻게든 해결할 수 있을 거예요."
10012015-52 = "……선생님은 괜찮겠어? 방금까지 비틀거리고 있었던 거 같은데……."
10012015-53 = "[s] \"괜찮아. 걱정하지 마.\""
10012015-55 = "으헤……. 다들 참으로 힘차고 명랑하게 자랐구나. 이 아저씨는 참으로 만족스러워."
10012015-56 = "음……. 그런데 모처럼 으쌰으쌰한 분위기에서 산통 깨는 게 미안하지만……."
10012015-57 = "그……. 지금까지 쭉 이야기해 온 리조트라는 거 말이지……."
10012015-58 = "저쪽에 저거……. 아닌가?"
10012015-65 = "뭐야 저게에에에에에-!?!?"
10012015-66 = "이, 이게 뭐야? 제대로 온 거 맞아?"
10012015-67 = "……여기도……."
10012015-69 = "여기도……!!"
10012015-71 = "……전부 다 그냥 폐허잖아? 사람도 한 명 없고!!"
10012015-73 = "다른 섬 잘못 찾아온 거 아냐? 진짜 여기 맞는 거야?"
10012015-74 = "……아니. 좌표상으로 확실해. 여기가 맞아."
10012015-75 = "그, 그렇지만 여기는……. 도저히 운영 중인 리조트라고 보기에는 무리가 있는데요……."
10012015-76 = "이건 마치……. 어……. 그럼 역시……."
10012015-78 = "……아."
10012015-79 = "으헤-. 그런가-. 설마 우리, 또 당한 건가-."
10012015-85 = "뭐, 뭐야? 뭔데?……? 설마……. 그럼 결국……!"
10012015-86 = "……응. 세리카 쨩."
10012015-87 = "우리가 당첨된 리조트 사용권이란 여기의 사용권을 뜻하는 거였던 거야. 바로 이 폐허."
10012015-88 = "……사기당한 거지. ……헬기에 이어, 리조트도 연달아서."
10012015-89 = "……또……?"
10012015-90 = "……그런……."
10012015-91 = "……말도 안 돼……. 이번에는……."
10012015-92 = "이번에야말로 한 번쯤은…… 그렇게 생각했는데……. 왜 항상 우리는 꼭 이런 식으로……."
10012015-93 = "……억울해……. 너무해……."
10012015-94 = "세리카 쨩……."
10012015-96 = "…………."
10012015-97 = "……흑……."
10012015-98 = "[s7] \"……아직 좌절하기에는 일러.\"\n[s8] \"오히려 이제부터가 시작일지도 몰라.\""
10012015-99 = "……선생님……?"
10012015-100 = "……선생님……?"
10012015-101 = "응응! 선생님 말씀이 맞아요, 세리카 쨩!"
10012015-102 = "기대한 거랑 좀 다르긴 하지만, 그래도 공기 좋고 물 맑은 섬으로 놀러 온 건 사실이잖아요?"
10012015-103 = "어차피 여기서 하고 놀 거리는 우리가 다 챙겨왔는걸요. 지금부터 휴양을 즐기면 되죠!"
10012015-104 = "응. 박스에 담아온 비품들은 모두 무사했으니까. 헬기에서 챙겨오기만 하면 문제없어."
10012015-105 = "그리고 아까 전 둘러볼 때 창고나 설비들을 확인해 봤는데, 폐허긴 하지만……."
10012015-106 = "적어도 기구나 장비들의 상태는 양호했어. 오래돼서 녹슬고 먼지가 쌓였을 뿐이니, 재정비하면 얼마든지 다시 쓸 수 있어."
10012015-108 = "……선배들……?"
10012015-109 = "……맞아, 세리카 쨩. 아직 포기하기엔 일러!"
10012015-110 = "여기가 휴양지임에는 변함이 없고……."
10012015-111 = "헬기도 리조트도, 우리가 수리하기만 하면 얼마든지 쓸 수 있는 거니까."
10012015-112 = "응. 설비 수리는 평소에도 자주 하던 거니까! 긍정적으로 생각하자, 세리카 쨩!"
10012015-114 = "응. 정비하고 청소하면서 사용하는 건, 우리 아비도스가 누구보다 전문."
10012015-115 = "응응! 오히려 이 넓은 리조트와 무인도가 모두 저희 게 된 거잖아요?"
10012015-116 = "어떻게 즐기느냐는, 지금부터 우리들의 손에 달린 거라고요!"
10012015-117 = "아야네 쨩 말대로, 이제부터 최고의 휴가를 보내면 되는 거니까요☆"
10012015-118 = "으헤……. 우리 귀여운 후배들, 어느새 이렇게 의젓하게 자랐구나. 아저씨는 감동이야-."
10012015-120 = "모두들……."
10012015-121 = "[s9] \"후후. 아직 울기엔 이르다구, 세리카 쨩.\"\n[s10] \"우는 건 시도해 본 뒤에도 늦지 않아.\""
10012015-127 = "……우, 울긴 누가 울었다고 그래!? 좋아. 어디 한 번 두고 보자고!!"
10012015-128 = "이렇게 된 거, 아주 그냥 사기 친 녀석들이 실수했다고 생각할 만큼 실컷 놀다 가주겠어!!"
10012015-129 = "난 절대 포기 못 하니까 말이야! '최고의 휴가'!!"
10012015-132 = "오오오-!!"
