[translation]
2001006-1 = "온천 수행 – 휴식 편"
2001006-2 = "저희 <구츠구츠 족욕탕>을 찾아주셔서 대단히 감사합니다."
2001006-3 = "이미 소문으로 듣고 찾아오셨겠지만, 저희 족욕탕의 물에는 천연 성분이 풍부하게 녹아있기 때문에 염좌나 피부 질환 등에 큰 효험이 있습니다."
2001006-4 = "또한 족욕을 즐기시며 눈이 피로하지 않도록 주변에 아름다운 정원을 꾸며두었으니, 이쪽도 부디 느긋하게 감상해 주십시오."
2001006-10 = "……선생님께서 말씀하신 온천이라는 게, 족욕탕이었군요."
2001006-11 = "저는 갑자기 선생님께서 같이 전신 목욕을 함께 하자는 줄 알고 긴장해서……."
2001006-12 = "[s] \"다른 온천이 좋았으려나?\""
2001006-13 = "아, 아뇨! 족욕탕이면 충분해요!"
2001006-14 = "어차피 다친 부위는 발목뿐이고, 전신을 탕치할 필요는 없으니까요!"
2001006-15 = "게다가 단둘이 목욕을 하기에는 아직 마음의 준비가 덜 되어서……."
2001006-16 = "[s] \"방금 뭐라고 했어?\""
2001006-17 = "아, 아무것도 아녜요!"
2001006-24 = "자, 선생님. 어서 탕에 들어가요."
2001006-27 = "[wa:550]― 하아…… [wa:1550]좋은 탕이네요."
2001006-29 = "[wa:350]― 들어간 것만으로 [wa:750]통증이 [wa:500]사라지는 것 같은 기분이에요."
2001006-32 = "[wa:1100]― 주위의 풍경도 [wa:1550]정말 예쁘고……"
2001006-35 = "― 정원도 [wa:470]잘 가꿔진 게,"
2001006-37 = "― 정말로 [wa:500]멋진 장소네요."
2001006-40 = "[wa:500]― 지붕이 있어서, [wa:1400]밤하늘이 보이지 않는 것은"
2001006-42 = "― 조금 아쉽지만……"
2001006-45 = "[ns] \"역시 다른 온천을 찾아보는 게 좋았으려나.\""
2001006-46 = "[wa:600]― ……아니,"
2001006-48 = "― 이걸로 괜찮을지도 [wa:850]모르겠어요."
2001006-51 = "[wa:650]― 선생님과 단둘이서 [wa:1300]온천을 즐길 수 있다니,"
2001006-54 = "― 이런 행복감은……"
2001006-56 = "― 별님에게는 [wa:1500]비밀로 해야 할 테니까요."
2001006-59 = "[ns] \"발목은 이제 좀 괜찮아?\""
2001006-60 = "네. 완전히 낫지는 않았지만, 훨씬 통증은 덜한 느낌이에요."
2001006-61 = "좋은 온천장에 데려와 주셔서 감사합니다, 선생님."
2001006-62 = "[s] \"그럼 이만 슬슬 돌아갈까?\""
2001006-63 = "아뇨, 모처럼 방문한 다른 지역의 온천장인데 이대로 돌아가기는 아까워요!"
2001006-64 = "이곳에서는 어떤 물건을 팔고, 어떤 서비스를 제공하는지 제 눈으로 찬찬히 확인해 봐야겠어요."
2001006-70 = "이것도 다…… 온천 수행이니까요!"
2001006-72 = "(이후, 노도카와 함께 밤의 온천을 잔뜩 즐겼다.)"
