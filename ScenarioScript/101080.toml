[translation]
101080-1 = "제8화;빛의 도래"
101080-3 = "시로코 선배, 여기 다들 기다리고 있다고. 빨리 와."
101080-4 = "시로코 쨩~ 우리도 얼른 출발해야지. 늦었다고."
101080-5 = "(치익) 응. 거의 다 와 가. 최대한 속력을 내고 있어."
101080-6 = "그치만 시로코 쨩. 사고 나면 안 되니까, 자전거 탈 땐 통화는 금지예요."
101080-7 = "(치익) 응. 알겠어. 그럼 조금 있다 봐."
101080-11 = "하하…… 정말 몇 번이고 만나달라고 요청했었는데도 묵묵부답이던 총학생회가…… 드디어……."
101080-12 = "맞아. 옛날엔 그거 때문에 열받아서 말이지. 총학생회를 습격해서 싹 다 없애버릴까 고민하던 적도 있었는데 말이지. 격세지감이랄까~"
101080-13 = "총학생회를……? 아무리 호시노 선배라도 그건 무리 아냐?"
101080-14 = "지금은 늙어서 안돼. 허리도 아프고, 힘도 예전 같지도 않고. 아저씨가 젊을 때 이야기라구~"
101080-15 = "아하하…… 나이 차이 얼마 안 나지만……."
101080-19 = "응, 그치만 이젠 상황이 달라진 거죠. 지금은 선생님이 있으니까."
101080-20 = "이 아저씨는 자꾸 예전 생각이 난단 말이지. 시로코 쨩을 처음 만났을 때라든가, 노노미 쨩이 갑자기 여기로 찾아왔을 때라든가."
101080-21 = "뭐 하는 거야. 진짜 노인네 같이……."
101080-22 = "시로코 선배를 처음 만났을 때요? 어땠는데요? 저는 처음 들어요."
101080-23 = "응? 내가 이야기한 적 없었던가?"
101080-24 = "시로코 쨩, 처음 봤을 땐 완전 야생소녀였다니까. 노노미 쨩이랑 내가 시로코 쨩을 포획한다고 얼마나 고생했는데."
101080-25 = "왜 포획이야……."
101080-27 = "호시노 선배, 이 이야기는……."
101080-28 = "굳이 숨길 것도 없잖아. 노노미 쨩."
101080-33 = "그렇긴 하지만요……. 시로코 쨩…… 아비도스에 오기 전의 기억이 없거든요."
101080-34 = "네? 기억상실?"
101080-35 = "그건 뭐야? 갑자기 드라마 여주인공 설정 같은 이야기는?!"
101080-36 = "그건……."
101080-37 = "(치익) ……뭔가 이상해."
