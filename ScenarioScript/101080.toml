101080-52 = "뭐, 뭐하는 거야, 선배! 혼자서 위험하게!"
101080-53 = "……시로코 쨩, 위험한 행동하지 말고 돌아와."
101080-54 = "응. 위험한 짓은 안 해. 멀리서 확인만 하고 복귀할게."
