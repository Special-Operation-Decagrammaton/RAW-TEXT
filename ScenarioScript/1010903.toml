[translation]
1010903-1 = "무취"
1010903-2 = "밀레니엄 기숙사 내 노아의 방"
1010903-4 = "어서 오세요, 선생님. 기다리고 있었답니다."
1010903-5 = "뭔가 제 방에서 선생님을 연달아 뵙게 되니 묘한 기분이네요."
1010903-6 = "[s1] \"잘 지냈어, 노아?\"\n[s2] \"몸은 좀 어때?\""
1010903-9 = "덕분에 많이 좋아졌어요. 약간의 열이 남아 있긴 하지만, 가벼운 일 정도는 무리 없이 수행할 수 있을 정도랍니다."
1010903-10 = "다만 유우카 쨩은 완전히 나을 때까지 세미나에 나오지 말고 쉬라고 해서……"
1010903-11 = "계속 방 안에 앉아서 독서만 하다 보니 조금은 좀이 쑤시는 것 같아서요."
1010903-12 = "그래서 죄송스럽게도 모처럼의 휴일에 선생님을 제 개인적인 일에 모시고 말았네요."
1010903-13 = "아픈 걸 핑계 삼는 것 같아 부끄럽지만, 이번만큼은 제 어리광을…… 용서해 주시겠어요?"
1010903-14 = "[s3] \"신경 쓰지 마.\"\n[s4] \"큰 일이 없더라도 언제든지 불러줘.\""
1010903-17 = "후후…… 선생님이시라면 그렇게 말씀해 주실 줄 알았어요."
1010903-18 = "그럼 바로 방 정리를 시작해 볼까요?"
1010903-19 = "……정리라고 하기에는 애초에 방에 진열한 물건도 없지만요."
1010903-20 = "이 빈방을 무어로 채워야 거슬리지 않으면서도 마음에 여유를 가져다줄 수 있을까요?"
1010903-21 = "[s] \"그럴 줄 알고 몇 가지 물건을 챙겨 왔어.\""
1010903-27 = "이건…… 트로피?"
1010903-28 = "[s] \"오는 길에 세미나에 들려 노아가 그동안 받았던 트로피를 모두 가져왔어.\""
1010903-29 = "이 트로피들이 모두 제가 받은 거라고요?"
1010903-30 = "자세히보니 그렇네요. 이건 1학년 때 참가한 슬로건 공모전에서 받은 트로피고, 이건 교내 백일장 때 받은 트로피고……"
1010903-31 = "이건 지난 밀레니엄 프라이스에서 받은 대상 트로피네요. 그리워라…… 후후."
1010903-32 = "보통 이런 트로피는 수령하지 않고 세미나에 그대로 보관해서 몰랐었는데, 이렇게 보니 꽤 양이 상당하네요."
1010903-33 = "그런데 이 트로피가 방 인테리어와 무슨 상관이 있나요?"
1010903-34 = "[s] \"이 트로피를 방 곳곳에 배치하는 거야!\""
1010903-35 = "과연. 과거의 수상 기록을 눈에 잘 뜨이는 곳에 둔다면, 심미적으로도 나쁘지 않고, 성공과 관련된 좋은 기억도 계속해서 떠올릴 수 있을 테니……"
1010903-36 = "나쁘지 않은 제안인 것 같네요."
1010903-37 = "그럼 바로 배치해 볼까요?"
1010903-39 = "(잠시 후……)"
1010903-41 = "으음……"
1010903-42 = "[s] \"으음……\""
1010903-43 = "역시…… 조금 그렇죠?"
1010903-44 = "[s] \"역시 조금 그렇네……\""
1010903-45 = "숫자가 생각보다 많았던 것은 둘째치더라도, 바닥에 트로피를 그대로 진열하니 동선을 방해할뿐더러……"
1010903-46 = "방을 가득 메운 트로피가 묘하게 승부욕을 자극하는 것 같아서, 어쩐지 보고 있노라면 더 피곤해지는 기분이네요."
1010903-47 = "[s5] \"괜찮아. 혹시 몰라서 다른 물건도 가져왔으니까.\"\n[s6] \"이번 인테리어의 주제는…… 이거야!\""
1010903-54 = "이건…… 책인가요?"
1010903-55 = "[s7] \"응. 노아는 책 읽는 걸 좋아하잖아?\"\n[s8] \"책을 방 곳곳에 쌓아두면 분위기가 살아날 거야.\""
1010903-58 = "확실히, 서가나 고서점에 갔을 때 벽 가득히 쌓여 있는 책을 보고 있노라면 마음이 편해지곤 했었죠."
1010903-59 = "게다가 손이 닿기 편한 곳에 언제나 책이 있다면 독서를 할 때도 편할 것 같고……"
1010903-60 = "한 번 선생님의 말씀대로 정리해 볼까요?"
1010903-62 = "(잠시 후……)"
1010903-64 = "역시……"
1010903-65 = "[s] \"조금 그렇지……?\""
1010903-66 = "네…… 이 구성도 마찬가지로 동선에 방해가 될 것 같네요."
1010903-67 = "전투 중 엄폐를 할 때는 도움이 될 것 같지만, 방 안에서 전투를 할 일은 거의 없으니까요."
1010903-68 = "죄송하지만 이 인테리어도 쓰기 어려울 것 같네요."
1010903-69 = "[s] \"괘, 괜찮아. 아직 다른 물건들이 남아 있으니까!\""
1010903-71 = "(이후, 가져온 다른 물건들로 인테리어를 제안해 보았지만……)"
1010903-73 = "으음…… 이 거대한 페로로 인형은 살풍경한 분위기를 해소하는 데에는 도움이 되겠지만……"
1010903-74 = "묘한 시선이 부담스러워서 방 안에 두면 뭔가 악몽을 꿀 것 같네요……"
1010903-77 = "이 간이 풀장은 산뜻하긴 하지만, 기숙사 방 안에 두기에는 너무 습하지 않을까요?"
1010903-78 = "물을 채웠을 때의 하중이 걱정되기도 하고요."
1010903-80 = "(……모두 기각되고 말았다.)"
1010903-82 = "……역시 쉽지 않은 작업이네요."
1010903-83 = "죄송해요. 모처럼 이것저것 권해주셨는데 거절밖에 하지 못해서."
1010903-84 = "[s] \"아냐, 오히려 도움을 주지 못해서 내가 더 미안해.\""
1010903-88 = "역시 제게는 이 개성 없는 공간이 제일인 것 같네요."
1010903-89 = "사람에게는 저마다 어울리는 장소가 있는 법인데, 무리하게 스스로를 바꾸어봤자 금세 탈만 날 뿐이니……"
1010903-90 = "오늘은 선생님께 이 정도의 어리광을 부린 것만으로도 분에 넘치게 즐거웠답니다. 후후."
1010903-91 = "[s9] \"사실 아직 시험해 보지 않은 것이 하나 더 있는데……\"\n[s10] \"괜찮다면 이것만이라도 받아주지 않을래?\""
1010903-98 = "이건…… 방향제인가요?"
1010903-99 = "방향제를 방에 두는 것은 상관없지만, 어째서……?"
1010903-100 = "[s] \"사람의 기분은 눈에 보이지 않는 요소에도 크게 좌우되니까.\""
1010903-102 = "[ns11] \"시각적으로는 쓸쓸해 보이는 공간이라도—\"\n[ns12] \"좋은 냄새로 기억된다면 기분만큼은 풍성할 거야.\""
1010903-106 = "……네, 좋은 생각이네요."
1010903-107 = "선생님의 말씀처럼 가장 중요한 개성은 눈에 드러나지 않는 법이니까요."
1010903-111 = "어디, 선생님께서 가져오신 방향제는…… 비에 젖은 백합 같은 아늑하고 달콤한 향이 나네요."
1010903-112 = "혹시 그동안 저를 보면서 이런 향을 떠올리신 건가요?"
1010903-113 = "[s] \"그런 생각으로 향을 고른 건 아니지만……\""
1010903-114 = "후후, 변명하지 않으셔도 괜찮아요."
1010903-115 = "이건 어디까지나…… 농담이니까요."
