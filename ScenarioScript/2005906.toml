[translation]
2005906-1 = "小惡魔與約會"
2005906-3 = "與無月約好的歌劇院"
2005906-4 = ""
2005906-5 = ""
2005906-6 = "啊！老師！這裡這裡！"
2005906-7 = "[s1] 「突然說要來歌劇院……」\n[s2] 「是有什麼委託嗎？」"
2005906-10 = "沒有，就只是單純想看歌劇而已。"
2005906-11 = "上次因為工作的關係，什麼都沒看到就出來了嘛？"
2005906-12 = "所以這次想坐下來好好地欣賞。"
2005906-13 = "雖然歌劇對我來說可能會有點無聊就是了……"
2005906-14 = "但是只要有老師在，做什麼都會很有趣！"
2005906-15 = "[s] 「對啊，一定會很有趣！」"
2005906-16 = "咯呵呵，那我們進去吧。"
2005906-18 = "哇，這裡好安靜哦。"
2005906-19 = "如果在這種地方惡作劇，一定會超級有趣的。"
2005906-20 = "要是引爆炸彈或彩虹煙霧彈，會發生什麼事呢？"
2005906-21 = "[s] 「你，你真的要那麼做嗎？」"
2005906-22 = "咯呵呵，開玩笑的啦～"
2005906-23 = "讓老師為難就不好玩了，所以我不會做的。"
2005906-24 = "而且今天已經決定要專心看歌劇了。"
2005906-25 = ""
2005906-28 = "啊，好像要開始了。"
2005906-29 = "那麼就來期待一下第一次的歌劇觀賞吧？"
2005906-31 = "（隨著雄壯的音樂，舞台的帷幕升起了）"
2005906-32 = "（那是一齣現代歌劇……#n　講述一位喜愛音樂的少女，因為遇上惡毒的導師而吃了不少苦頭，#n　但是最終克服一切逆境並獲得成功的故事）"
2005906-34 = "（雖然有點擔心無月會不會覺得無聊……但那似乎是多餘的顧慮）"
2005906-35 = "（直到結束為止，無月始終開心地觀賞著歌劇）"
2005906-36 = ""
2005906-38 = ""
2005906-39 = ""
2005906-40 = ""
2005906-43 = "（接著在演出結束之後……）"
2005906-45 = "[ns] 「已經天黑了呢。」"
2005906-46 = "嗯！完全沒發現時間過得這麼快。"
2005906-47 = "啊～真有趣。"
2005906-48 = "所謂的藝術真是了不起呢！光是音樂就讓我心跳加速了！"
2005906-49 = "[s] 「內容很好理解不會太艱深，感覺這樣更好呢。」"
2005906-50 = "咯呵呵，這可是我認真調查後才挑選出來的。"
2005906-51 = "話說回來，這齣歌劇是在講述學生和導師的故事對吧？"
2005906-52 = "有件事一直讓我很在意……"
2005906-53 = ""
2005906-55 = ""
2005906-56 = "老師你……是怎麼看待我的呢？"
2005906-57 = "[s3] 「嗯！？」\n[s4] 「怎，怎麼突然這麼問！？」"
2005906-60 = "嘿～？你為什麼這麼驚訝？#n這個問題有那麼難回答嗎？"
2005906-61 = "對老師來說……"
2005906-62 = "我是個好學生嗎？"
2005906-63 = "[s] 「啊……原，原來是那個意思！」"
2005906-64 = "咦～？難道你想到別的地方去了嗎？"
2005906-65 = "你究竟在想什麼呀？希望你可以一步一步，從頭慢慢地說給我聽呢！"
2005906-66 = "[s] 「我，我在想無月是個好學生……！」"
2005906-67 = "啊哈哈，好吧。#n這次就這樣放過你。"
2005906-68 = "……原來我對老師來說是個好學生啊。"
2005906-69 = "咯呵呵……"
2005906-70 = ""
2005906-72 = ""
2005906-73 = ""
2005906-74 = "好！歌劇也看完了，接下來去吃飯吧！"
2005906-75 = "在這附近的商店街裡，有一間我覺得不錯的餐廳。"
2005906-77 = "（跟著無月前往的餐廳，是間CP值很高的串燒店）"
2005906-78 = "（我們在那裡享受了輕鬆自在的晚餐）"
2005906-79 = ""
2005906-81 = ""
2005906-83 = "（接著又在氣氛不錯的時尚咖啡廳裡開心地閒聊）"
2005906-84 = "（聊天的話題也是最近的流行或日常瑣事之類的……意外地平凡）"
2005906-85 = ""
2005906-87 = ""
2005906-89 = "（就這樣到了深夜……）"
2005906-90 = "（走在路上的我們像是約好了似地，在附近的公園停下腳步）"
2005906-92 = ""
2005906-93 = "啊啊，這麼快就到該說再見的時間了呢。"
2005906-94 = "感覺今天的時間過得特別快。"
2005906-95 = "老師，我今天很開心哦。"
2005906-96 = "[s] 「嗯，我也很開心。」"
2005906-97 = "咯呵呵，希望下次也能再像這樣一起約會。"
2005906-98 = "[s] 「好啊，下次再──」"
2005906-99 = ""
2005906-101 = ""
2005906-102 = ""
2005906-103 = "[ns5] 「……約，約會！？」\n[ns6] 「這，這麼說來，今天做的那些事全都是──！」"
2005906-106 = "嗯！是約會哦！"
2005906-107 = "咯呵呵，你現在才發現嗎？老師比想像中還要遲鈍呢。"
2005906-108 = "我們像這樣正式地約會，還是第一次吧？"
2005906-109 = "一想到這是約會，感覺就有點不一樣了。"
2005906-110 = "雖然有點難解釋清楚……總覺得心裡的某個角落有點癢癢的？"
2005906-111 = "總之謝謝你！陪我度過了第一次的約會！"
2005906-112 = "[s] 「我，我才該感到榮幸！」"
2005906-113 = "啊哈哈，這樣自然而然地約會計畫就成功了呢。"
2005906-114 = "一開始只是想捉弄老師的……不過現在已經無所謂了。"
2005906-115 = "就像老師說我是個好學生一樣……"
2005906-116 = "我也覺得老師是個好老師。"
2005906-117 = ""
2005906-119 = ""
2005906-120 = ""
2005906-121 = "所以今後也請繼續多多關照我哦！"
2005906-122 = "至於要不要聽老師的話嘛……就看我的心情囉？咯呵呵。"
2005906-124 = "（之後在公園裡和無月開心地聊天，彼此笑著道別）"
2005906-125 = "（並且約好了下次見面的日子）"
