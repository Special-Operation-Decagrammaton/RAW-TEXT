[translation]
2005906-1 = "소악마와 데이트"
2005906-3 = "무츠키와 약속한 오페라 하우스"
2005906-6 = "아! 선생님! 여기야, 여기!"
2005906-7 = "[s1] \"갑자기 오페라 하우스라니…….\"\n[s2] \"무슨 의뢰가 있는 거야?\""
2005906-10 = "그런 거 아냐. 그냥 순수하게 오페라가 보고 싶어서."
2005906-11 = "저번에는 일 때문에 아무것도 못 보고 나왔잖아?"
2005906-12 = "그래서 이번엔 진득하게 감상하고 싶었어."
2005906-13 = "뭐, 오페라는 나한테 조금 지루할지도 모르겠지만……."
2005906-14 = "선생님이 있으면 뭐든 재밌을 거야!"
2005906-15 = "[s] \"그래. 뭐든 재밌을 거야!\""
2005906-16 = "쿠후후, 그럼 안으로 들어가자."
2005906-18 = "와아, 여기 분위기 엄청 조용하네."
2005906-19 = "이런 곳에서 장난을 치면 정말 재미있을 텐데."
2005906-20 = "폭탄이나 무지개 연막탄을 터트리면 어떤 일이 일어나려나?"
2005906-21 = "[s] \"지, 진짜로 하려고?\""
2005906-22 = "쿠후후, 농담이야~"
2005906-23 = "선생님이 곤란해지는 건 재미없으니까 안 할래."
2005906-24 = "그리고 오늘은 오페라에 집중하기로 했으니까."
2005906-28 = "아, 시작하려나 보다."
2005906-29 = "그럼 첫 오페라 감상, 기대해 볼까?"
2005906-31 = "(웅장한 음악과 함께 오페라의 막이 올랐다.)"
2005906-32 = "(음악을 좋아하는 소녀가 악독한 멘토를 만나 고생하지만, 결국 모든 역경을 딛고 성공한다는 내용의 현대 오페라였다.)"
2005906-34 = "(무츠키가 지루하게 느끼진 않을까 걱정하긴 했지만…… 쓸데없는 고민이었다.)"
2005906-35 = "(무츠키는 오페라가 끝날 때까지 즐겁게 관람을 이어 나갔다.)"
2005906-43 = "(그렇게 공연이 끝난 뒤…….)"
2005906-45 = "[ns] \"벌써 밤이 됐네.\""
2005906-46 = "응! 시간이 가는 줄도 몰랐어."
2005906-47 = "아아, 재미있었다."
2005906-48 = "예술이라는 건 정말 대단하네! 음악만으로도 엄청 두근두근해 버렸어!"
2005906-49 = "[s] \"어렵지 않고 쉽게 이해되는 내용이라 더 좋았던 것 같아.\""
2005906-50 = "쿠후후, 나름 열심히 조사해서 고른 거라구."
2005906-51 = "그나저나 이번 오페라 말이야. 학생과 멘토의 이야기였잖아?"
2005906-52 = "그걸 보면서 계속 신경 쓰인 부분이 있는데……."
2005906-56 = "선생님은 나, 어떻게 생각해?"
2005906-57 = "[s3] \"으, 으응?!\"\n[s4] \"가, 갑자기?!\""
2005906-60 = "헤에? 뭘 그렇게 놀라? 이게 그렇게 곤란한 질문이야?"
2005906-61 = "선생님한테……."
2005906-62 = "나는 좋은 학생이야?"
2005906-63 = "[s] \"아…… 그, 그쪽이었구나!\""
2005906-64 = "어라아? 설마 다른 쪽을 생각했던 거야?"
2005906-65 = "도대체 뭘 생각했는데? 쉽게 이해할 수 있게 차근차근 이야기해 줘!"
2005906-66 = "[s] \"무, 무츠키는 좋은 학생이라는 생각……!\""
2005906-67 = "아하핫, 좋아. 그 정도로 봐줄게."
2005906-68 = "나는 선생님한테 좋은 학생이었구나."
2005906-69 = "쿠후후후……."
2005906-74 = "자! 재미있는 오페라도 봤으니까, 다음엔 밥을 먹으러 가자!"
2005906-75 = "이 근처에 있는 상점가에 괜찮은 가게를 하나 봐 뒀어."
2005906-77 = "(무츠키가 안내한 가게는 가성비 좋은 꼬치구이 집이었다.)"
2005906-78 = "(그곳에서 부담 없는 저녁 식사를 즐겼다.)"
2005906-83 = "(다음에는 분위기 좋은 모던 카페에서 즐겁게 담소를 나누었다.)"
2005906-84 = "(대화의 화제도 요즘 유행이나 일상 이야기 같은……. 의외로 평범한 것이었다.)"
2005906-89 = "(그렇게 늦은 밤이 되었고…….)"
2005906-90 = "(길을 걷던 우리는 근처에 있는 공원에서 약속이나 한 것처럼 멈춰 섰다.)"
2005906-93 = "아아, 벌써 헤어질 시간이네."
2005906-94 = "오늘따라 시간이 너무 빨리 지나가는 것 같아."
2005906-95 = "선생님. 오늘 즐거웠어."
2005906-96 = "[s] \"응. 나도 즐거웠어.\""
2005906-97 = "쿠후후, 다음에도 또 데이트했으면 좋겠네."
2005906-98 = "[s] \"그래. 다음에도 또…….\""
2005906-103 = "[ns5] \"……데, 데이트?!\"\n[ns6] \"그, 그러고 보니 오늘 했던 일들은 전부……!\""
2005906-106 = "응! 데이트였어!"
2005906-107 = "쿠후후, 이제 눈치챈 거야? 선생님은 생각보다 둔하네."
2005906-108 = "우리, 데이트다운 데이트는 이번이 처음이었지?"
2005906-109 = "데이트라고 생각하니까, 느낌이 조금 달랐던 것 같아."
2005906-110 = "잘 설명은 못 하겠지만, 뭔가 가슴 한구석이 간질거리는 느낌이었달까?"
2005906-111 = "아무튼 고마웠어! 내 첫 데이트에 어울려 줘서!"
2005906-112 = "[s] \"이, 이쪽이야말로 영광입니다!\""
2005906-113 = "아하핫, 이걸로 자연스럽게 데이트한다는 계획은 성공이네."
2005906-114 = "처음엔 선생님을 놀리려고 했던 거였지만…… 이젠 아무래도 좋아."
2005906-115 = "선생님이 날 좋은 학생이라 말했던 것처럼……."
2005906-116 = "나도 선생님이 좋은 선생님이라고 생각하니까."
2005906-121 = "그러니까 앞으로도 쭉 나를 잘 부탁해!"
2005906-122 = "선생님 말을 따를지 안 따를지는 내 마음이지만? 쿠후후."
2005906-124 = "(이후 공원에서 무츠키와 즐겁게 대화를 나누다 웃으며 헤어졌다.)"
2005906-125 = "(다음에 또 만날 날을 약속하면서.)"
