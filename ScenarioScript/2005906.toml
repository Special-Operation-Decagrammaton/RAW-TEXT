2005906-6 = "Ah! Sensei! Over here!"
2005906-7 = "[s1] \"What are we doing at the opera?\"\n[s2] \"Do you have a commission?\""
2005906-10 = "It's nothing like that. I just wanted to see a show."
2005906-11 = "We couldn't see ANYTHING last time. We were so busy."
2005906-12 = "So, I wanted to watch to give it my undivided attention."
2005906-13 = "But I'm not sure. An opera might be too boring for me..."
2005906-14 = "But with Sensei, I'm sure we'll have some fun."
2005906-15 = "[s] \"Yes. Together, we can make anything fun!\""
2005906-16 = "Kufufu. Then let's head in."
2005906-18 = "Wow, it's really quiet in here."
2005906-19 = "It's...a great place to play a prank, isn't it? Everyone's so serious."
2005906-20 = "What do you think will happen if I throw a bomb? Oh! Or a rainbow smokescreen?"
