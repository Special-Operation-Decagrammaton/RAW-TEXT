2005906-61 = "So, Sensei..."
2005906-62 = "Do you think I'm a good student?"
2005906-63 = "[s] \"Ah... Y-You mean like that!\""
2005906-64 = "Huh? What else could I have meant?"
2005906-65 = "What are you stammering about? Help me understand. Take it slow."
2005906-66 = "[s] \"J-Just thinking about how you're a good student...!\""
2005906-67 = "Hahaha, well, fine. I'll let it go...for now."
