2005906-46 = "Yeah! Time really flew by, didn't it?"
2005906-47 = "Ahh, that was fun."
2005906-48 = "Aren't the arts amazing? The music alone had my heart racing!"
2005906-49 = "[s] \"I liked that it was easy to understand.\""
2005906-50 = "Kufufu. I researched it before I picked it."
