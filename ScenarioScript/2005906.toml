[translation]
2005906-1 = "ปีศาจน้อยกับการเดต"
2005906-3 = "โรงละครโอเปร่าที่นัดเจอกับมุสึกิไว้"
2005906-4 = ""
2005906-5 = ""
2005906-6 = "อ๊ะ! คุณครู! ทางนี้ ทางนี้!"
2005906-7 = "[s1] \"มาทำภารกิจถึงโรงละครโอเปร่าเลยเหรอ...\"\n[s2] \"ไปได้ภารกิจอะไรมาน่ะ?\""
2005906-10 = "ไม่ใช่อย่างนั้นหรอก เค้าแค่อยากดูโอเปร่าเฉยๆ น่ะ"
2005906-11 = "ก็ครั้งที่แล้วติดงานจนต้องออกมาจากโรงละครก่อนไม่ใช่เหรอ?"
2005906-12 = "ครั้งนี้เค้าเลยอยากใช้เวลาชมให้เต็มที่น่ะ"
2005906-13 = "ถึงการแสดงโอเปร่าจะไม่ใช่แนวที่เค้าชอบ..."
2005906-14 = "แต่ถ้ามีคุณครูอยู่ด้วย ต้องสนุกไปหมดทุกอย่างแน่ๆ!"
2005906-15 = "[s] \"อื้อ ต้องสนุกไปหมดทุกอย่างแน่ๆ!\""
2005906-16 = "ฮุฮุฮุ งั้นเราเข้าไปข้างในกันเถอะ"
2005906-18 = "ว้าว ที่นี่เงียบมากเลยนะ"
2005906-19 = "ถ้ามาแกล้งใครในที่แบบนี้ ต้องสนุกจนกลั้นหัวเราะไม่ไหวแน่เลย"
2005906-20 = "ถ้าเค้าจุดระเบิดธรรมดาหรือไม่ก็ระเบิดควันสีรุ้ง มันจะเป็นยังไงนะ?"
2005906-21 = "[s] \"จะ... จะทำจริงๆ เหรอ?\""
2005906-22 = "ฮุฮุฮุ ล้อเล่นน่า~"
2005906-23 = "อะไรที่ทำให้คุณครูเดือดร้อน เค้าว่ามันไม่สนุกหรอก"
2005906-24 = "แล้ววันนี้ก็ตั้งใจไว้แล้วด้วยว่าจะมาดูโอเปร่า"
2005906-25 = ""
2005906-28 = "อ๊ะ สงสัยจะเริ่มแล้วละ"
2005906-29 = "มาตั้งตารอดูโอเปร่าครั้งแรกกันดีกว่า"
2005906-31 = "(ม่านเปิดขึ้นสู่เวทีโอเปร่าพร้อมเสียงดนตรีอันไพเราะ)"
2005906-32 = "(นี่เป็นโอเปร่าร่วมสมัยที่ถ่ายทอดเรื่องราวของเด็กสาวผู้มีใจรักในเสียงดนตรีที่ต้องพบกับ#nเมนเทอร์ที่โหดร้ายและใจดำ แต่สุดท้ายก็ฟันฝ่าทุกอุปสรรคจนประสบความสำเร็จได้)"
2005906-34 = "(ตอนแรกคุณครูกังวลว่ามุสึกิจะเบื่อ... แต่ก็ไม่เป็นอย่างนั้นเลย)"
2005906-35 = "(มุสึกิเพลิดเพลินกับโอเปร่าจนจบ)"
2005906-36 = ""
2005906-38 = ""
2005906-39 = ""
2005906-40 = ""
2005906-43 = "(หลังจบการแสดง...)"
2005906-45 = "[ns] \"ฟ้ามืดแล้วแฮะ\""
2005906-46 = "อื้อ! ดูโอเปร่าจนลืมเวลาไปเลยนะ"
2005906-47 = "อ่า สนุกจังเลย"
2005906-48 = "ศิลปะนี่น่าทึ่งจริงๆ! แค่ได้ยินเสียงเพลง หัวใจของเค้าก็เต้นแรงแล้วละ!"
2005906-49 = "[s] \"ดีเลยนะที่เนื้อหาเข้าใจได้ไม่ยาก\""
2005906-50 = "ฮุฮุฮุ เค้าตั้งใจหาข้อมูลมาแล้ว ก็เลยเลือกเรื่องนี้น่ะ"
2005906-51 = "จะว่าไป โอเปร่าเรื่องนี้ มันเป็นเรื่องราวเกี่ยวกับนักเรียนและเมนเทอร์ใช่มั้ยล่ะ?"
2005906-52 = "ระหว่างที่ดู มีบางอย่างที่รบกวนจิตใจเค้าด้วย..."
2005906-53 = ""
2005906-55 = ""
2005906-56 = "คุณครู... คิดยังไงกับเค้าเหรอ?"
2005906-57 = "[s3] \"หะ... หืม...?!\"\n[s4] \"จะ... จู่ๆ ก็ถามเลยเหรอ?!\""
2005906-60 = "เอ๋? ตกใจอะไรขนาดนั้นน่ะ? คำถามมันยากขนาดนั้นเลยเหรอ?"
2005906-61 = "สำหรับคุณครูแล้ว..."
2005906-62 = "เค้าเป็นนักเรียนที่ดีหรือเปล่า?"
2005906-63 = "[s] \"อ่า... มะ... หมายความแบบนี้สินะ!\""
2005906-64 = "เอ๊ะ เอ๋? คิดอย่างอื่นอยู่งั้นเหรอ?"
2005906-65 = "คิดว่าอะไรน่ะ? ไหนลองค่อยๆ อธิบายให้เข้าใจง่ายๆ มาซิ!"
2005906-66 = "[s] \"คะ... คิดว่ามุสึกิเป็นนักเรียนที่ดีเลย...!\""
2005906-67 = "อะฮะฮ่า งั้นจะปล่อยผ่านให้แล้วกัน"
2005906-68 = "เค้าเป็นนักเรียนที่ดีของคุณครูสินะ"
2005906-69 = "ฮุฮุฮุฮุ..."
2005906-70 = ""
2005906-72 = ""
2005906-73 = ""
2005906-74 = "เอาละ! ในเมื่อดูโอเปร่าสนุกๆ จบแล้ว ต่อไปก็ไปหาอะไรกินกันเถอะ!"
2005906-75 = "เค้าหาร้านอาหารดีๆ ในย่านการค้าแถวนี้ไว้แล้ว"
2005906-77 = "(ร้านที่มุสึกิแนะนำคือร้านยากิโทริที่คุ้มค่าคุ้มราคา)"
2005906-78 = "(ทั้งสองคนได้กินมื้อเย็นที่นั่นกันอย่างสบายๆ)"
2005906-79 = ""
2005906-81 = ""
2005906-83 = "(หลังจากนั้นก็ไปคาเฟ่ทันสมัยที่บรรยากาศดี และได้พูดคุยกันอย่างเพลิดเพลิน)"
2005906-84 = "(หัวข้อที่พูดคุยกันเป็นเรื่องธรรมดาๆ... อย่างเรื่องกระแสความนิยม หรือเรื่องราวในชีวิตประจำวัน)"
2005906-85 = ""
2005906-87 = ""
2005906-89 = "(เวลาล่วงเลยมาจนถึงดึก...)"
2005906-90 = "(ขณะกำลังเดินไปตามถนน คุณครูกับมุสึกิก็หยุดยืนอยู่ที่สวนสาธารณะใกล้ๆ ราวกับรู้กัน)"
2005906-92 = ""
2005906-93 = "อ่า ถึงเวลาต้องแยกกันแล้วสินะ"
2005906-94 = "เค้ารู้สึกเหมือนวันนี้เวลาผ่านไปไวมากเลย"
2005906-95 = "คุณครู วันนี้สนุกมากเลยละ"
2005906-96 = "[s] \"อื้อ ครูก็สนุกเหมือนกัน\""
2005906-97 = "ฮุฮุฮุ หวังว่าต่อไปก็จะได้มาเดตกันอีกนะ"
2005906-98 = "[s] \"อื้อ ไว้ต่อไปก็...\""
2005906-99 = ""
2005906-101 = ""
2005906-102 = ""
2005906-103 = "[ns5] \"ดะ... เดต?!\"\n[ns6] \"นะ... นั่นสินะ กิจกรรมของวันนี้ทั้งวันมัน...!\""
2005906-106 = "อื้อ! มันเป็นการเดตไงล่ะ!"
2005906-107 = "ฮุฮุฮุ เพิ่งจะรู้ตัวเหรอเนี่ย? คุณครูเนี่ย บื้อมากกว่าที่คิดไว้อีกน้า"
2005906-108 = "นี่เป็นเดตอย่างเป็นทางการครั้งแรกของเราเลยใช่มั้ยล่ะ?"
2005906-109 = "พอคิดว่าเป็นเดตขึ้นมา... มันก็ให้ความรู้สึกที่ต่างไปจากเดิมนิดหน่อยนะ"
2005906-110 = "เค้าก็อธิบายไม่ค่อยถูกเหมือนกัน แต่เหมือนมันรู้สึกจั๊กจี้ๆ อยู่ที่มุมหนึ่งของหัวใจน่ะ"
2005906-111 = "เอาเป็นว่า วันนี้ขอบคุณที่มาเดตกับเค้าเป็นครั้งแรกนะ!"
2005906-112 = "[s] \"คะ... ครูเป็นเกียรติมากเลย!\""
2005906-113 = "อะฮะฮ่า เท่านี้แผนการเดตแบบเนียนๆ ก็สำเร็จลุล่วง"
2005906-114 = "ตอนแรกก็คิดว่าจะแกล้งคุณครูเล่นๆ... แต่ตอนนี้จะยังไงก็ช่างเถอะ "
2005906-115 = "ก็อย่างที่คุณครูบอกไว้ว่าเค้าเป็นนักเรียนที่ดีของคุณครู..."
2005906-116 = "เค้าเองก็คิดว่าคุณครูเป็นคุณครูที่ดีของเค้าเหมือนกัน"
2005906-117 = ""
2005906-119 = ""
2005906-120 = ""
2005906-121 = "เพราะงั้นต่อไปก็ ฝากดูแลเค้าต่อด้วยนะ!"
2005906-122 = "แต่เรื่องที่ว่าจะเชื่อฟังคุณครูหรือเปล่า อันนี้ขอเค้าตัดสินใจเองนะ? ฮุฮุฮุ"
2005906-124 = "(คุณครูกับมุสึกิคุยเล่นกันในสวนสาธารณะ ก่อนจะแยกย้ายกันกลับ)"
2005906-125 = "(และไม่ลืมที่จะนัดเจอกันในครั้งต่อไปด้วย)"
