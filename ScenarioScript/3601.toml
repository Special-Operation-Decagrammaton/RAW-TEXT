[translation]
3601-1 = "단맛과 노스탤지어 1"
3601-2 = "후우……"
3601-3 = "네, 시작하시죠, 회의."
3601-4 = "특이사항 있으면 말씀해 주세요."
3601-5 = "예, 나기사 님. 먼저 어제 18시경 카페 거리에서 총격전이 벌어졌습니다."
3601-6 = "한정판 디저트에 얹어진 딸기의 소유권을 두고 벌어진 다툼이 총격전으로 번진 것으로 확인되었고요."
3601-10 = "딸기요……?"
3601-11 = "고작 딸기 하나 때문에……?"
3601-12 = "정의실현부의 하스미 부부장이 비번인 관계로 츠루기 부장이 출동해 상황을 제압한 것으로 보고되었습니다."
3601-13 = "……츠루기 부장이라면…… 구호기사단이 꽤 바빠졌겠군요."
3601-14 = "예, 안 그래도 구겨진 캔…… 아니 구겨진 학생들이 많이 이송되어 구호기사단이 늦게까지 응급처치했습니다."
3601-18 = "좋습니다. 구호기사단 측은 약품과 붕대의 소모가 컸을 것 같으니……."
3601-19 = "관련 예산이 추가로 필요하다면 요청서를 올려 달라고 구호기사단 측에 전달 바랍니다."
3601-24 = "다음은요?"
3601-25 = "다음 사안은 바로 그 구호기사단 측에서 벌어진 일입니다만……."
3601-26 = "의료 기구함에 들어있던 전기톱을 보고 패닉에 빠진 환자들이 탈출하는 사건이 벌어지는 바람에……."
3601-27 = "……치료실 하나가 완전히 기능이 마비되었습니다."
3601-28 = "그…… 의료 기구함에 왜 전기톱이…… 하아……."
3601-29 = "……예, 그럼 구호기사단이 보유하고 있는 의료 기구들을 전수조사 하도록 하세요."
3601-34 = "자 그럼… 혹시 또 보고할 사안이 있나요?"
3601-35 = "예, 금일 새벽 1시경에 본관 건물 옥상에서 알몸의 학생이 목격되었습니다."
3601-36 = "본 학생이 많지는 않지만, 옥상에 귀신이 나타났다는 등의 유언비어로 번지고 있어서 조치가 필요할 것 같습니다."
3601-37 = "……."
3601-38 = "후후……."
3601-39 = "알몸……인가요."
3601-40 = "새벽에…… 옥상에…… 알몸……."
3601-41 = "왜 귀신이 아닌 거죠……?"
3601-42 = "나기사 님……?"
3601-43 = "차라리 귀신이면 마음이라도 편할 텐데……."
3601-44 = "해결 불가능한 문제면 그냥 아무것도 하지 않아도 되는데……."
3601-45 = "……후후."
3601-46 = "후후…… 후후후…… 후후후후……."
3601-51 = "나기사 님?!"
3601-52 = "눈이 풀렸어요!"
3601-54 = "구호기사단! 구호기사단을 불러요! 빨리!"
3601-56 = "나기 쨩이 과로 때문에 쓰러졌다고?!"
3601-57 = "예. 정확히는 번아웃 증후군, 이라고 하더군요."
3601-58 = "일단 다행히 신체적으로는 큰 문제가 없습니다만……."
3601-59 = "시험 삼아 시판용 페트병 홍차를 먹여 봤는데, 아무런 반응이 없더군요."
3601-61 = "잠깐, 그렇다면 진짜로 심각한 상황 아니야?!"
3601-62 = "맞아요. 한동안 일을 떠나서 휴식과 정신적인 케어가 필요하다는 진단이 내려졌습니다."
3601-63 = "정신적인 케어……."
3601-64 = "한정판 디저트라도 구해 온다면 도움이 될까?"
3601-65 = "……회의록 보니까 그건 별 도움이 안 될 것 같던데요."
3601-66 = "일단 나기사는 트리니티를, 이 일터를 떠나는 게 최우선이에요."
3601-67 = "여기 계속 있으면 쉬어도 쉰다는 느낌이 들지 않을 테니까요."
3601-68 = "으음, 트리니티 바깥에서 나기 쨩이 쉴 만한 곳을 찾아야 하는구나."
3601-69 = "예. 현재로선 그게 최선이에요."
3601-70 = "으음……."
3601-71 = "트리니티 밖…… 나기 쨩이 좋아할 만한 곳……."
3601-72 = "아!"
3601-74 = "미카?"
3601-75 = "산해경으로 가자!"
3601-76 = "산해경 고급중학교로요……? 어째서죠?"
3601-77 = "그곳 외곽에 유명한 홍차 공방이 있다고 들었거든!"
3601-78 = "공방 견학을 신청하면 시음도 할 수 있고, 찻잎 블렌드도 체험할 수 있다고 들었어!"
3601-79 = "나기 쨩은 홍차 좋아하니까 그곳에 가면 기운을 좀 차리지 않을까?"
3601-80 = "……오랜만에 합리적인 발상을 떠올리네요, 미카."
3601-81 = "응? 오랜만이라니?"
3601-82 = "세이아 쨩 나를 평소에 어떻게 생각했길래……."
3601-83 = "어쨌든, 좋은 아이디어예요."
3601-84 = "그치 그치?"
3601-85 = "그럼, 이동은 어떻게 할까나……."
3601-86 = "나기 쨩은 많이 피로한 상태니까, 기차나 버스보다는 차가 좋을 것 같은데."
3601-87 = "티파티 공용 차고에 있는 차를 쓸까?"
3601-88 = "그곳의 차를 쓰려면 수행원이 동승해야 해요."
3601-89 = "그러면 결국 업무의 연장이라는 느낌을 받게 될 겁니다."
3601-90 = "흐음, 그러면 어떻게……."
3601-91 = "일단 여기서는 제 오토바이를 쓰도록 하죠."
3601-92 = "마침 사이드카도 장착되어 있어서, 세 명도 충분히 탈 수 있습니다."
3601-93 = "우와, 그럼 세이아 쨩 운전하는 거 오랜만에 보겠네!"
3601-94 = "좋아, 그럼 공방 투어는 내가 예약할게!"
3601-95 = "예, 부탁해요, 미카."
3601-96 = "자 그럼, 나기 쨩 리프레쉬 투어……."
3601-98 = "시작이야!"
