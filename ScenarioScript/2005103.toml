[translation]
2005103-1 = "씩씩해 레이사"
2005103-2 = "선생님!! 이쪽입니다!!"
2005103-3 = "[s] \"안녕, 레이사!\""
2005103-4 = "후후, 순찰 돌기 딱 좋은 날씨입니다!"
2005103-5 = "그런데 선생님, 그 커다란 배낭은……."
2005103-6 = "[s1] \"증거품 수집용 가방이란다!\"\n[s2] \"꽉 채우기 전까지는 계속 순찰이야!\""
2005103-9 = "선생님이 역시 최고예요!!!"
2005103-10 = "그러면, 순찰 시작합니다앗!!!"
2005103-13 = "<마법리버> 아크릴 키링입니다!!"
2005103-14 = "3기 11화에 나왔던 사복 버전이군요!!"
2005103-15 = "선생님!"
2005103-16 = "[s] \"음! 종류별로 확보해야겠군!\""
2005103-17 = "완전 동의합니다!"
2005103-19 = "이번에는 파일 홀더입니다!"
2005103-20 = "[s] \"공부할 때 필요하니 아주 탁월한 구매겠구나!\""
2005103-21 = "우헤헤-!"
2005103-22 = "저기요~"
2005103-28 = "혹시 사진 한 장, 같이 찍어도 될까요?"
2005103-29 = "네?!"
2005103-30 = "의상이 너무 잘 어울리셔서 그러는데, 괜찮다면……."
2005103-31 = "어, 으…… 으아……."
2005103-35 = "?!"
2005103-36 = "[s] \"잠시만 기다려주세요, 하하…….\""
2005103-38 = "우우……."
2005103-39 = "[s] \"괜찮니, 레이사?\""
2005103-40 = "우헤…… 괜찮습니다 선생님."
2005103-41 = "사실, 사진을 같이 찍는 건 괜찮지만……."
2005103-42 = "표정이나 몸짓이 어색할까 봐 걱정되어서 그렇습니다."
2005103-43 = "그래서 체육시간도 무섭습니다, 남들이 보기에 이상할까 봐……."
2005103-44 = "으우, 그래도 아까 그 분께는 설명을 잘 드려야 했을까요."
2005103-45 = "[s3] \"너는 마법소녀란다, 레이사.\"\n[s4] \"레이사가 하면 그게 마법소녀 포즈지!\""
2005103-48 = "……!"
2005103-49 = "과연, 마법소녀와 정의의 자경단은 항상 당당해야 하는데!"
2005103-50 = "선생님은 항상 대단하십니다!"
2005103-51 = "[s] \"그렇다면 다시 출동이다!\""
2005103-52 = "네엡-!!!"
2005103-62 = "선생님, 저기 보세요."
2005103-63 = "굉장한 석양입니다."
2005103-64 = "[s] \"아아, 정말이구나.\""
2005103-65 = "사실 오늘은 순찰보다는 그냥 구경하려고 핑계 댄 건데,"
2005103-66 = "선생님께서 믿고 와주셔서 기쁩니다."
2005103-67 = "항상 놀아주셔서, 감사합니다!!"
2005103-68 = "[s5] \"자경단의 에이스가 평화를 지킨 거야!\"\n[s6] \"모두에게 미소를 선물했잖니!\""
2005103-71 = "우헤헤, 선생님도 미소를 선물해 주시는 샬레의 슈퍼스타입니다!"
2005103-72 = "[s] \"그럼 샬레로 돌아가서 증거 분석이다!\""
2005103-73 = "네!!!"
2005103-75 = "(이후, 레이사와 샬레로 돌아갔다.)"
2005103-76 = "(굿즈를 하나하나 다시 보며, 방금전의 추억에 젖었다.)"
