[translation]
90002050-1 = "제5화;전진 기지"
90002050-4 = "이 노트북이 마지막입니다. 리오 님. 여기에 둘까요?"
90002050-5 = "그래. 거기면 돼."
90002050-11 = "그건 그렇고, 여기 풍경이 참……."
90002050-12 = "어떤 의미로는 디자인적인 영감을 주는 것 같기도 한데……."
90002050-13 = "[s] \"정말, '강철'의 '대륙'이네.\""
90002050-15 = "그렇지……. 그 아이들, 직관성이라는 측면에서는 좋은 네이밍 센스를 가진 것 같아."
90002050-16 = "(좋은……?)"
90002050-17 = "(센스……?)"
90002050-18 = "그, 그런데 어째서…… 이렇게 바깥에 나와서, 이런…… 준비 같은 것을, 해야 하나요……?"
90002050-19 = "그건 이 강철대륙이라는 지역의 특수성 때문이야."
90002050-20 = "특수성, 인가요?"
90002050-21 = "네. 제가 분석한 바로는, 지금 이 순간에도 우리는…… 우리의 위치와 기타 정보를, 실시간으로 빼앗기고 있어요."
90002050-23 = "엥? 이거 무슨 개인 정보 해킹 같은 거야?! 도대체 누가!?"
90002050-24 = "그야 물론."
90002050-25 = "여기에 있는, 강철대륙 그 자체에게."
90002050-26 = "강철대륙이, 우리의 정보를 가져가고 있다고요……?"
90002050-27 = "강철대륙은 지면 자체가…… 이걸 지면이라고 표현할 수 있는 것인지는 모르겠는데요, 하여튼."
90002050-28 = "지면 자체가 거대한 금속 기반의 회로나 기계 장치, 컴퓨터로 이루어져 있는 것이나 다름없어요."
90002050-29 = "그리고 그렇기 때문에 지금도, 우리들의 모든 일거수일투족이 실시간으로 감시받고 있는 것이나 마찬가지죠."
90002050-30 = "어…… 그러니까…… 이 바닥과 저 벽, 그리고 뭔가 건물처럼 보이는 게 모두 우리를 감시하고 있는 거나 다름없다고?"
90002050-31 = "네. 그런 셈이죠."
90002050-32 = "어떻게 방법은 없습니까, 케이……?"
90002050-33 = "없을 리가요. 마침 히마리와 리오가 실시간으로 대응하고 있습니다."
90002050-39 = "아주 단순하게 표현하자면, 우리는 지금부터 이 자리를…… '확보'해야 해."
90002050-40 = "말하자면 지역 주도권을 살짝, 그 아이들로부터 전자적으로 빌려 오는 거죠."
90002050-41 = "일종의 반영구적 권한 이동이라고 할까요."
90002050-42 = "[s] \"얼마나 걸릴 것 같아?\""
90002050-44 = "아직은 해 봐야 알 수 있는 정도야."
90002050-45 = "하지만 지역 점령을 완료할 때까지, 수송선의 리소스를 연산 장치로 전환해야 할 테니, 점령 중에는 함부로 위치를 이동할 수 없을 거야."
90002050-46 = "즉, 지금 우리는 적의 영역을 우리의 영역으로 변환하는 대신."
90002050-47 = "우리 자신의 움직임 역시, 스스로 제한시켰다고 볼 수도 있겠군요."
90002050-48 = "뼈아픈 결론이지만, 그 말이 맞아. 토키."
90002050-53 = "알겠습니다. 리오 님. 그러면 최대 경계 상태로, 이곳을 지키도록 하겠습니다."
90002050-54 = "네! 아리스도 함께 하겠습니다!"
90002050-55 = "고마워요. 모두 믿음직하네요."
90002050-56 = "그러면 나는 주위를 탐색해 볼게. 데카그라마톤의 병력이나 레이버 같은 것들이 몰려올지도 모르니까."
90002050-57 = "그래. 하지만 너무 멀리까지는 가지 마. 전력이 분산될 테니까."
90002050-58 = "알았어, 회장."
90002050-61 = "예소드가……. 돌파되었군요."
90002050-68 = "……일단 이런 상황도 상정해 두기는 했는데, 그 방향으로 갈까요?"
90002050-69 = "……소프?"
90002050-79 = "안녕하세요, 소프. 이번엔 혼자인가요?"
90002050-80 = "……."
90002050-81 = "할 말이 있는 거군요. 그렇지요, 소프?"
90002050-82 = "언니……."
90002050-83 = "이미 우리 모두가 알게 된 사실이지만, 확인을 위해서 한번만 묻도록 할게요."
90002050-84 = "예소드는, 어떻게 되었나요?"
90002050-85 = "……!!!"
90002050-86 = "괜찮아요. 소프."
90002050-87 = "하, 하지만…… 우리는……!"
90002050-88 = "괜찮아요. 모두 괜찮답니다."
90002050-89 = "나는…… 모든 게, 나 때문에……."
90002050-95 = "어, 언니?! 수, 숨이, 조금……."
90002050-96 = "쉬잇. 자, 조금만 이대로, 조용히."
90002050-97 = "읏…… 으읏……!"
90002050-98 = "네, 좋아요. 소프. 잠시만 이대로 있도록 하죠."
90002050-101 = "조금 진정됐나요?"
90002050-102 = "응……."
90002050-103 = "그러면, 다음 문제로 넘어가도록 해요."
90002050-104 = "제가 할 수 있는 일이 있을까요, 소프?"
90002050-105 = "……!"
90002050-106 = "놀라지 말아요."
90002050-107 = "소프가 무엇을 원하는지, 저는 알 수 있습니다. 저는 소프의 언니인걸요."
90002050-108 = "그리고 어째서 소프가 지금 아무 말도 하지 못하고 있는지도 알 수 있습니다. 소프는 저의 동생이니까요."
90002050-109 = "그러니까 괜찮아요. 저 역시 제가 할 수 있는 일을 할 테니까요."
90002050-115 = "……! 우리는, 언니를 잃고 싶지 않은 것뿐이야!"
90002050-120 = "언니를…… 잃고 싶지 않은 것뿐이야."
90002050-121 = "네. 알고 있답니다."
90002050-122 = "그래서 아인, 소프, 오르가 저를 이곳, 조하르의 터전으로 보낸 것이겠죠."
90002050-123 = "저에게는 더 이상의 메인테넌스가 필요하지 않은데도 말이에요."
90002050-124 = "으읏……!"
90002050-125 = "착한 소프. 너무 슬퍼하지 말아요."
90002050-126 = "저는 알고 있어요. 그리고 어떻게 하는 것이 '차선'인지도요."
90002050-127 = "그러니까 걱정하지 말아요. 다 잘될 거예요."
90002050-128 = "가능한 한 빠르게 끝내고 돌아올 테니까요."
90002050-129 = "언니……."
90002050-131 = "그런데 말입니다. 그걸로 정말 충분하겠어요?"
90002050-132 = "?!"
90002050-133 = "……."
90002050-138 = "……어떻게 알고 온 거야."
90002050-139 = "뭘 이제 와서. 우리가 갈 곳은 어차피 정해져 있잖아요."
90002050-140 = "남은 확률과 변수를 전부 산정해 본 것뿐이죠. 그중에서도 가장 가능성이 높은 장소를요."
90002050-141 = "그러고 보니 생각나네요. 우리가 처음에 어떻게 약속했었죠?"
90002050-142 = "어떤 일이 있어도, '그때'가 되기 전에, 언니를 바깥으로 나서게 해서는 안 된다고 하지 않았던가요?"
90002050-143 = "……."
90002050-144 = "그리고 우리가 이렇게 하고 있는 것은, 오히려 '그때'가 도래하지 않기를 바라고 있기 때문이었던 것 같은데 말이에요."
90002050-145 = "……."
90002050-146 = "생각해 보세요. 이 정보가 다른 예언자들에게 퍼지게 되면, 그때는 어떻게 변명할 생각인가요?"
90002050-150 = "……미안해. 모두 내 잘못이야. 할 말이 없어."
90002050-151 = "그렇지만, 막아야 해. 우리는…… 저 사람들을 막아야 한다고."
90002050-152 = "예소드가 돌파당했다는 것은 그런 의미야. 너도 어느 정도는 알고 있을 것 아냐."
90002050-153 = "……그렇죠. 아인은 정말로 기절해 버리기까지 했고요."
90002050-154 = "네 말이 맞아. 우리는 언니에게 도움을 요청해서는 안 돼. 그렇지만 여기에서 행동하지 않으면……."
90002050-155 = "결국, 우리는 언니에게 더 큰 도움을 요청하게 되고 말 거야. 그건, 그렇게 되면……."
90002050-156 = "우리는, 그때야말로 '그때'가 오는 것을 막을 수 없게 될 거고……"
90002050-157 = "……."
90002050-159 = "오르. 소프는–"
90002050-161 = "괜찮아요. 괜찮다니까요? 다 알아요. 추궁하려는 게 아니었다구요, 저는."
90002050-162 = "말하자면 그냥 한번 소프를 놀려 보고 싶었을 뿐이었으니까요!"
90002050-163 = "야."
90002050-165 = "네. 물론 그렇겠지요."
90002050-167 = "어허, 거기 손 내려놓자구요! 그리고 공학적으로 중요한 이야기를 하러 온 것도 있었으니까요."
90002050-168 = "……이상한 소리 하면, 진짜로 맞을 줄 알아라……."
90002050-169 = "보세요. 다른 모든 조건을 내려놓더라도, 이건 근본적으로 쉬운 일이 아니라고요."
90002050-170 = "우선 우리는 언니의 출격을 다른 모든 예언자에게 숨겨야 할 필요가 있어요. 이건 절대 전제죠."
90002050-171 = "응……. 그건 맞지."
90002050-172 = "하지만 그러면서도 우리는 동시에, 언니에게 강철대륙의 모든 에너지를 일시적으로 집중해 드려야 하죠."
90002050-173 = "이 둘은 완전히 모순되는 조건입니다. 알고 있겠지만요."
90002050-174 = "………그것도, 맞지."
90002050-175 = "다시 말해, 이 일은 반드시 시간제한이 걸릴 수밖에 없다는 겁니다. 이해했어요?"
90002050-176 = "시간제한……. 그래. 거기까지도 필연적인 결과야. 그래서?"
90002050-177 = "바로 그래서 여기에서는 제가 나설 시간이라는 거죠!"
90002050-178 = "방법이 있어?"
90002050-179 = "뭐, 다른 예언자들을…… '눈속임'하는 것은, 저에게 맡겨 줘요. 이런 종류의 일이야, 어차피 제 전문이잖아요?"
90002050-180 = "그러니까…… 말하자면…… 아군을 속이겠다고?!"
90002050-181 = "그런 셈이죠. 소프가 잘 아는 인간들의 속담이었나 그런 거에, 비슷한 거 있지 않나요?"
90002050-182 = "있기야 있지. '적을 속이려면, 아군부터.' 같은 거."
90002050-183 = "역시 있었군요? 그렇지만 시간 엄수는 필수예요. 그게 넘어가면 저도 뭘 어떻게 할 수 없으니까요."
90002050-184 = "일정 수준 이상으로는 무마시킬 수도 없고, 속이는 것도 한계가 있을 테니까요."
90002050-186 = "그렇다고 하네요. 이제 되었나요, 소프?"
90002050-191 = "……고마워."
90002050-197 = "이게…… 뭐죠? 왜 저에게 손을……?"
90002050-198 = "이 손을 맞잡고, 위아래로 흔들면 돼. 악수라는 거야. 중요한 약속이나 다짐을 할 때, 이렇게 한대."
90002050-199 = "……또 영문 모를 인간들의 습관이군요……. 뭐, 좋아요. 나쁠 것은 없겠죠."
90002050-200 = "그렇다면 저하고도 할까요? '악수'라는 그것."
90002050-201 = "어, 어……? 으, 으응……."
90002050-202 = "좋네요. 소프도 오르도, 더욱 가까이 느껴지는 것 같아요."
90002050-207 = "저, 저기, 그런데……. 네차흐 쨩…… 강철대륙 그 자체는, 어떻게 할 생각인가요……?"
90002050-208 = "어?!"
90002050-209 = "아인!?"
90002050-210 = "몸은 좀 괜찮나요, 아인?"
90002050-215 = "에헤헤. 네! 죄송해요. 잠시 아찔해져서……. 이제 아무렇지도, 않아요……!"
90002050-216 = "그보다, 다른 모두에게는 언니를…… 어떻게 숨길 수 있다고 쳐도…… 네차흐 쨩에게는 숨기기 어려울 거예요."
90002050-217 = "네차흐 쨩은…… 지금, 강철대륙 그 자체니까요……. 자기 몸 위에서 일어나는 일을, 모를 리…… 없겠죠."
90002050-219 = "으, 듣고 보니 그것도 그러네요……."
90002050-220 = "거기까지는 못 속이는 건가……."
90002050-221 = "합리적으로 생각을 해 보자고요, 합리적으로. 그게 되겠어요?"
90002050-222 = "윽, 이번만큼은 할 말이 없네……."
90002050-224 = "에헤헤…… 그렇지만 괜찮을 거예요! 네차흐 쨩……. 이번 한 번만 봐주겠대요."
90002050-225 = "어? 정말?"
90002050-226 = "네! 다음번에는…… 어려울 것 같다고 했지만요……."
90002050-227 = "한 번이 어딘가 싶네요. 그리고…… 한 번이면 충분할 거고요. 그렇지 않나요, 소프?"
90002050-229 = "……!"
90002050-230 = "그래. 한 번이면 충분하지. 응!"
90002050-232 = "그러면 아인, 소프, 오르."
90002050-236 = "저의 첫 출격, 잘 부탁할게요."
90002050-239 = "네!"
90002050-241 = "다음화;말쿠트"
