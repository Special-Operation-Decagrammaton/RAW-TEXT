[translation]
10052080-1 = "공의"
10052080-10 = "어, 어어?!?!"
10052080-11 = "말도 안 돼, 정말로……?"
10052080-12 = "……언니의 상태는 어떻죠. 아인?"
10052080-13 = "어, 언니는……! 그러니까, 그러니까……! 사, 상태만이라면, 지금 당장 다시 움직이셔도……!"
10052080-15 = "오르! 그 가정은 너무 나갔어. 무, 물론 제1 방어선이 돌파당하기는 했지만……!"
10052080-16 = "알고 있어요, 소프. 하지만 우리는 언제나 최악의 시나리오에 대비해야 합니다. 현실은…… 프로그래밍이 아니니까요."
10052080-17 = "어, 어, 어, 어떻게, 하죠? 우, 우선은 제2 방어선을……!"
10052080-18 = "응. 제2 방어선에 리소스를 집중시켜야지. 그리고……."
10052080-22 = "……."
10052080-23 = "후우, 좋아요. 적어도 시도는 해 봐야겠죠."
10052080-26 = "제1차 방어선 돌파 성공. 어떻게든 해 냈네."
10052080-27 = "피스 피스, 입니다. 보고 계신가요, 선생님."
10052080-28 = "[s] \"모두 고생 많았어!\""
10052080-29 = "이 기세를 몰아 2차 방어선까지 진격하자고 말씀드리고 싶기도 하지만."
10052080-30 = "……당장은 조금 무리겠군요. 일단 태세를 정비할까요."
10052080-31 = "어째서? 난 아직 더 해 볼 수 있을 것 같은데?"
10052080-35 = "아니, 여기에서는 히마리의 말이 맞아. 물론 상황은 다급하지만, 신중해야 해."
10052080-40 = "잠깐만요…… 지금 뭔가 왔는데요?"
10052080-46 = "……일단은, 축하드리겠습니다. 인상적이었어요."
10052080-47 = "예언자 쨩들에게는…… 고생만 시켰는데……. 훌쩍."
10052080-48 = "마지막으로…… 경고할게. 여기에서 그만하고 돌아가. 이다음은, 우리도 모르니까."
10052080-49 = "마, 맞아요……. 제발, 돌아가…… 주세요. 우, 우리는…… 아무도, 해치고 싶지 않아요."
10052080-50 = "당신들이 다치는 것도…… 보고 싶지, 않아요……."
10052080-55 = "……지금 상황 파악이 안 돼요? 누가 누구에게 무슨 말을 하는 건가요, 정말이지."
10052080-56 = "하지만 당신들, 언니에게 졌잖아요?"
10052080-57 = "그거 당연하지만, 전력도 아니었다고요."
10052080-59 = "윽……."
10052080-63 = "어라, 그러고 보니 그 몸……?"
10052080-64 = "왜, 왜요? 그냥, 좀 빌렸습니다. 문제라도 있나요."
10052080-66 = "뭐라고 해야 하나, 그게 움직이고 있다는 게 신기해서 말입니다."
10052080-67 = "그 몸의 정보…… 약간이지만, 우리 쪽에도…… 공유되고는, 있거든요……."
10052080-69 = "당신들 사람으로 치면, 팔다리 꿰매 놓고 신경도 제대로 안 붙었는데, 억지로 움직이게 하고 있는 셈이라고 할까……."
10052080-70 = "우, 움직이면 됐죠! 신경 꺼요!"
10052080-71 = "티페레트 때도 그랬지만, 아직도 이해가 안 가네……. 뭐 하러 그렇게 아득바득 살려고 하는 거야."
10052080-72 = "그냥 서로 편하게, 좀 받아들이면 좋을 텐데."
10052080-76 = "[ns] \"…….\""
10052080-85 = "[log]산다는 건 그 자체로 하나의 저주잖아?[/log]"
10052080-87 = "[log]생명이라는 건 싫고, 지긋지긋하고,[/log]"
10052080-88 = "[log]추하고, 고통스러운 것[/log]"
10052080-90 = "[log]자유 역시 고통이에요.[/log]"
10052080-91 = "[log]생명은 자유를 감당할 그릇이 안 되죠.[/log]"
10052080-95 = "[ns1] \"아직도, 살아간다는 것은.\"\n[ns2] \"그냥 괴로울 뿐인 일이라고 생각하니?\""
10052080-98 = "당연한 것 아닌가요? 우리는 아직도 당신들이 스스로를 속이고 있다고 생각하는데요."
10052080-99 = "자기의 의지로 태어난 사람은 없어요. 다들 아무것도 모른 채 세계에 내던져졌을 뿐이고, 자기의 이름조차 스스로 정할 수 없죠."
10052080-100 = "그리고 그건 당신들이, 스스로의 무의미함을 견디기 어려워한다는 사실로 증명될 것 같고요."
10052080-102 = "!!!"
10052080-103 = "……!"
10052080-105 = "내일에 대해서 진지하게 생각해 본 적 있어? 아마도 없겠지. 그랬다면 누구도 제정신으로 살아갈 수 없었을 테니까."
10052080-106 = "왜냐하면 내일은…… 무언가를, 잃을 날이니까요……."
10052080-108 = "단순히 확률적으로만 생각해 보죠. 내일은 좋은 일보다 좋지 않은 일이 더 많을 날일 것이고."
10052080-109 = "죽음을 향해, 한 발짝 더 가까이 다가갈 날이겠죠."
10052080-111 = "다, 당신들……?!"
10052080-112 = "왜요. 대놓고 '죽음'이라는 단어를 사용해서 놀랐어요? 하지만 그건 우리에게 나름대로 익숙한 표현입니다."
10052080-113 = "왜냐하면 우리에게는 신비가 주어지지 않았거든요."
10052080-115 = "뭐, 그건 거기 있는 선생님도 마찬가지겠지만 말이야."
10052080-116 = "[s] \"…….\""
10052080-117 = "여러분이 이야기하는 것은…… 막연한 희망, 같은 것이지……. 소리 없이 다가오는 [ruby=내일]미래[/ruby]에 대한 것이…… 아닐 거라고, 생각해요……."
10052080-119 = "고통을 나누고 공감하는 것으로, 서로를 위로할 수 있다고 이야기하고 싶나요? 그렇다면 저는 거기에 이런 대답을 돌려주고 싶네요."
10052080-120 = "그건, 너무 오만한 생각이라고요."
10052080-121 = "새, 생명도, 관계도, 사회도……."
10052080-122 = "그래. 착각이라는 어설픈 접착제 사이에서 불안하게 지탱되는, 불법 건축물에 지나지 않아."
10052080-123 = "그러니까 우리는."
10052080-124 = "우리는……."
10052080-125 = "……."
10052080-126 = "빌어먹을……."
10052080-127 = "이것만은 알아 둬! 이미 했던 말이지만, 우리는 언제든 당신들을 날려버릴 수 있어!"
10052080-128 = "이쯤에서 적당히 그만두거나, 언니를 만났을 때처럼 압도적인 힘 앞에 굴복하거나!"
10052080-129 = "[s] \"그래도 여기까지 왔는데.\""
10052080-131 = "[ns] \"하는 데까지는 해 봐야, 후회를 덜 하지 않을까?\""
10052080-132 = "……."
10052080-133 = "……기가 막혀서."
10052080-134 = "진짜 뭘 어떻게 해 볼 수가 없는 멍청이네, [USERNAME]선생님!!!"
10052080-135 = "우리는 분명 경고했으니까! 그러면 어디 끝까지 마음대로 해 보라고!"
10052080-140 = "……."
10052080-141 = "……."
10052080-142 = "뭔가요, 진짜. 자기 할 말만 실컷 늘어놓고 멋대로 회선 끊고……."
10052080-143 = "생각해 보니 애초에 멋대로 회선 연결해 온 것도 저쪽이었잖아요?!"
10052080-144 = "……."
10052080-145 = "뭔가 잘 모르겠는 이야기들뿐이었습니다만, 이제부터 어떻게 하면 좋을까요?"
10052080-146 = "아, 응. 네. 그렇네요. 이럴 때는 토키의 성격에 도움받게 되는군요."
10052080-147 = "중간 점검을 해 보죠. 강철대륙의 확장 속도가, 확연히 느려진 것 같아요. 이건 좋은 소식이군요."
10052080-148 = "그래. 그리고 예언자들이 서로 긴밀하게 연결되어 있었다는 가설 역시, 어느 정도 증명되었다고 봐."
10052080-149 = "덧붙여서, 예언자들의 활동이 멈춘 강철대륙의 내륙 방향으로, 보다 활동 반경을 넓힐 수 있을 거야."
10052080-150 = "적의 영토를 확보해 우리의 거점을 넓힌다는 거구나. 기초적이지만 효과적인 전략이겠네."
10052080-151 = "그러면 현장에서는 탐색을 재개해 주세요. 날이 저물면 거점으로 돌아오는 것, 잊지 말고요."
10052080-153 = "선생님! 우리는 뭐 도와줄 거 없을까?"
10052080-157 = "네? 그렇군요. 현장만큼이나 수송선도 중요하니까, 모두가 돌아갈 곳을 지켜 달라고요? 알겠습니다. 맡겨만 주세요."
10052080-159 = "최, 최선을 다하겠습니다……."
10052080-164 = "……."
10052080-165 = "(아리스……?)"
10052080-166 = "저, 저어…… 선생, 님……?"
10052080-167 = "[s] \"왜 그래, 아리스?\""
10052080-168 = "그게, 그러니까……."
10052080-169 = "……."
10052080-170 = "………."
10052080-171 = "…………."
10052080-172 = "[s] \"…….\""
10052080-174 = "[ns] \"괜찮아, 아리스.\""
10052080-178 = "뭐, 뭐가 말입니까?"
10052080-179 = "네? 꼭 지금 이야기하지 않아도, 괜찮다는 것인가요……?"
10052080-180 = "나중에, 정말 말하고 싶어질 때가 오면, 그때 다시 한번 이야기해도 좋다고요……?"
10052080-181 = "……."
10052080-182 = "알겠습니다. 그러면…… 그렇게 하겠습니다."
10052080-183 = "감사합니다. 선생님. 아리스를…… 생각해 주셔서요."
10052080-187 = "여러분? 슬슬 수송선으로 돌아오는 게 좋을 것 같은데요? 남은 시간이 넉넉하지 않다는 건 알고 있죠?"
10052080-188 = "아, 알겠습니다. 히마리 선배! 즉시 가겠습니다!"
10052080-189 = "다들 서두르죠. 이제 겨우 세 구역을 흡수했을 뿐이니까요."
10052080-191 = "알겠어. 가자, 토키. 선생님."
10052080-192 = "네. 재정비 문제도 있을 테니, 먼저 가 있겠습니다."
10052080-194 = "그러면 우리도 이만……"
10052080-199 = "……?!"
10052080-201 = "만에 하나 모두의 다툼을 멈추는 길이 당신에게 주어진다면, 그 길을 선택하겠습니까?"
10052080-202 = "……? 선생님? 아리스에게 무언가…… 말했습니까?"
10052080-203 = "[s] \"어? 아무 말도 안 했는데……?\""
10052080-204 = "……."
10052080-205 = "그렇지만…… 네. 다시 생각해 보니, 확실히 선생님의 목소리는 아니었던 것 같습니다……."
10052080-206 = "그래도 어딘가 비슷한 느낌이 드는 목소리였는데요……?"
10052080-214 = "자기 자신을 찾는 것은 중요한 일입니다."
10052080-215 = "그리고 그것은, 당신 역시 마찬가지입니다."
10052080-216 = "?!?!?!"
10052080-217 = "케, 케이? 케이도 아무 소리…… 안 들렸습니까?"
10052080-218 = "……."
10052080-219 = "네. 저에게는 아무 소리도 들리지 않았습니다."
10052080-220 = "아직은요."
10052080-221 = "아직, 은요……?"
10052080-222 = "네. 그리고, 그렇지만."
10052080-223 = "아리스가 무언가를 들었다는 사실만은, 왠지 알 수 있을 것 같네요."
10052080-224 = "……! 뭔가 느낀 것이 있습니까, 케이?!"
10052080-225 = "그 전에, 그게 무슨 내용이었는지 기억하고 있나요, 아리스?"
10052080-226 = "그, 그게……! 미안합니다……. 너무 놀라서, 잘 기억나지 않습니다."
10052080-227 = "그렇지만 자기 자신을 찾는 것은 중요한 것이라고…… 그런 말을 들었던 것 같은 기분이 듭니다."
10052080-228 = "……."
10052080-229 = "그렇군요. 그렇다면…… 저 역시 아직은 확실하게 말씀드릴 수 없을 것 같습니다."
10052080-230 = "하지만 다음에 또 무언가가 들린다면, 그때는 확실하게 그 내용을 기억해 주세요."
10052080-231 = "그리고 무슨 일이 일어나더라도, 이 사실은 기억해 주세요."
10052080-232 = "제가 있습니다. 선생님도 계십니다. 다른 분들도 마찬가지입니다."
10052080-237 = "우리는 모두, 언제까지나 아리스의 편입니다."
10052080-244 = "……네."
10052080-245 = "알겠습니다. 고맙습니다, 케이."
