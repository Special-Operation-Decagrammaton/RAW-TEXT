[translation]
90001280-1 = "제28화;티페레트"
90001280-2 = "서, 선생님? 갑자기 왜 그런 말씀을 하시는 겁니까……?"
90001280-3 = "그건 이 시설을 지은 사람에게 너무한 일이 아닌가요? 아리스는…… 싫습니다……!"
90001280-4 = "그, 그렇습니다. 그건 이 시설의 존재 이유잖아요. 거기에 제가 뭐 어떻게 한다고 해 봤자……."
90001280-6 = "……뭐 어떻게 될 것 같지도 않은데요……."
90001280-8 = "네? 바로 그렇기 때문에 효과적일 것이다? 그건 또 무슨……?"
90001280-15 = "혹시……!"
90001280-19 = "케, 케이? 뭘 하려는 겁니까?"
90001280-21 = "(만일, 선생님이 생각한 게 그런 거라면……!)"
90001280-28 = "그렇다고는 해도 정말이지! 이 키보토스에서 총도 없이 이런 일을 해야 한다니……!"
90001280-29 = "하아, 내 신세야……."
90001280-35 = "아무튼, 뭐 하는 건가요! 티페레트인가 뭔가 하는 거기!"
90001280-36 = "당신의 씨앗들이 위험해질지도 모른다고요!"
90001280-38 = "저, 저분들……. 지금 뭐 하고 있는…… 거죠?"
90001280-39 = "영문을 전혀 모르겠지만……."
90001280-40 = "뭐, 이런 걸 보고 고사리손으로 문을 두드린다고 하는 거겠지!"
90001280-42 = "노크라도 하면, 티페레트가 문을 열어줄 거라고 생각하는 건가요? 이거 너무 순진한데요?"
90001280-43 = "정말 만에 하나 문이 열린다고 해도, 뭘 어쩌려는 건지 모르겠네요. 씨앗이라도 가지고 돌아가려는 건가요?"
90001280-44 = "이러니까 생명체의 어리석음은 알다가도 모르겠단 말이죠. 자기가 뭘 하고 있는지도 모르고, 그게 어떤 결과를 불러일으킬지도―"
90001280-55 = "?!?!"
90001280-57 = "뭐, 뭐야? 무슨 일이야, 아인?!"
90001280-58 = "티, 티페 쨩으로부터 메세지가 오고 있어요……!"
90001280-59 = "<제2 보관소를 향한 위험 행동 감지>"
90001280-60 = "<리소스 분배의 재조정이 필요하다고 판단>"
90001280-61 = "<시설의 모든 동력을…… 제2 보관소 방어에 할당???>"
90001280-62 = "그래서 격벽을 설치하고, 보관소 내부 안전성의 확보를 위해 온도 및 습도 역시 재조정한 뒤……."
90001280-63 = "해당 결과치에 도달하기 위해, 신경 작용제의 배출을…… 차단하겠다고요?!?!"
90001280-66 = "으앗?!"
90001280-67 = "놀라라……. 하마터면 이 신체까지 쇼트 날 뻔했네요. 그보다……."
90001280-68 = "……역시. 가스 분출이 멈추기 시작했군요."
90001280-69 = "[ns] \"잘했어, 케이!\""
90001280-70 = "……."
90001280-71 = "뭘요. 이 정도야."
90001280-72 = "어라? 아리스도…… 조금씩, 기운이 돌아오고 있는 것 같습니다."
90001280-78 = "!!!"
90001280-79 = "모모이! 미도리! 유즈! 그리고 다른 모든 분! 괜찮으신가요?"
90001280-82 = "웅냐……. 더 잘 거야…… 깨우지 마……."
90001280-83 = "어라……? 선생님? 아리스 쨩……?"
90001280-87 = "읏…… 무슨 일이, 있었던 거지?"
90001280-88 = "어라, 조금 전까지, 도대체……?"
90001280-89 = "현재 상황과 위험도에 어울리는 발언인지는 잘 모르겠습니다만."
90001280-91 = "푹 잤습니다. 지금의 저, 아스마 토키는 감히 무적이라고도 말씀드릴 수 있겠군요."
90001280-93 = "선생님…… 은, 괜찮으신가요? 의식이 끊겼던 것 같은 느낌이……."
90001280-94 = "아리스, 완전 부활입니다! 퍼펙트입니다!"
90001280-96 = "[ns] \"모두 다행이네. 뭐가 어떻게 된 거냐면–\""
90001280-105 = "……미안해."
90001280-106 = "이건, 모두 내 책임이야. 나 때문에……."
90001280-107 = "내가…… 내가, 티페레트의 말대로, 종자를 보관하자는 결정을 내리지 않았어도……."
90001280-108 = "윽……!"
90001280-112 = "……."
90001280-113 = "정신 차려요, 소프!!!"
90001280-120 = "꺄, 꺄앗?!"
90001280-121 = "오르……?"
90001280-122 = "소프가 그러면 안 돼요. 아직 다 끝난 게 아니잖아요."
90001280-123 = "무엇보다 우린 소프를 믿고 있어요. 아인도 그렇고 저도 그렇고, 언니와 티페레트도요."
90001280-124 = "으음, 뭐. 다른 예언자들의 의견까지는 아직 모르겠지만, 그래도 믿고 있다고 할 거예요. 아마도."
90001280-125 = "거기서 아마도냐……."
90001280-126 = "그리고 무엇보다 소프가 그러면, 티페레트의 결정과 의사는 뭐가 되는데요!"
90001280-127 = "하지만……."
90001280-128 = "하, 하하하, 할 수 있는 일을, 아직, 하면 된다고…… 생각, 해요."
90001280-129 = "우리가, 우리가 도와줄게요. 뭘 하면 될까요? 그러기, 그러기 위해서…… 우리가, 있는 거잖아요……?"
90001280-131 = "그래요. 소프. 우리는 우리가 누군가가 더 낫다거나, 더 못하다고 정의 내리기 위해 이곳에 있는 것이 아니에요."
90001280-132 = "조화라는 개념은 모두가 한 가지 형상만을 취해, 같은 자리에 나란히 서 있는 것이 아닙니다. 그것은 오히려 강요와 압제, 폭력에 가깝죠."
90001280-133 = "조화란 모두가 각자의 모습으로 함께 하며, 합을 이룰 수 있는 선을 찾는 행위입니다."
90001280-134 = "서로를 존중하지 않으면, 함께 나아가는 것도 불가능하니까요."
90001280-136 = "그런 의미에서 한 명의 책임은 모두의 책임이고, 모두의 기쁨은 한 명의 기쁨인 것이죠."
90001280-137 = "언니……."
90001280-138 = "으읏……!"
90001280-139 = "홀로 강해질 수 있는 자는 아무도 없습니다. 그것은 생명체이든, 의식체이든 마찬가지예요."
90001280-140 = "누군가가 고난을 겪고 있다면, 우리는 응당 손을 내밀어 주어야 합니다."
90001280-141 = "……정말 모든 것을 악의적으로 해석하여, 이것이 티페레트와 소프의 실수였다고 하더라도."
90001280-142 = "우리는 바로 그것을 뒷받침해 주기 위해, 여기에 있는 것이니까요."
90001280-143 = "그러니 아인? 티페레트와 이야기를 나누어 줄 수 있을까요?"
90001280-144 = "네, 네! 언니!"
90001280-145 = "티페 쨩……. 미안해요. 지금부터 잘 들어주세요……."
90001280-146 = "저 사람들은 티페 쨩의 씨앗을 망치려는 게 아니에요. 단지…… 그런 시늉을 하고 있을 뿐이죠."
90001280-147 = "어떻게 보면 말이죠……. 티페 쨩을 속이려고 한, 심술쟁이들인 거예요……!"
90001280-148 = "그러니까…… 티페 쨩은 리소스를 거기에 집중 투입할 필요가 없어요."
90001280-149 = "그렇지만 저 사람들이…… 계속 티페 쨩에게 붙어 있으면, 무슨 일이 일어날지 몰라요……."
90001280-150 = "그러니 티페 쨩. 소중한 씨앗들을 지키려면…… 저 사람들을 정중히……"
90001280-151 = "원래 있던 곳으로, 되돌려 보내야 할 거예요."
90001280-155 = "부탁할게요, 티페 쨩…… 우리도, 최대한 도와 줄 테니까요……."
90001280-164 = "……티페레트가 제대로 움직이기 시작했군요. 그러면 나머지는 맡기도록 할까요? 괜찮죠, 소프?"
90001280-165 = "응…… 모두, 고마워……."
90001280-166 = "에이, 에이, 에이! 분위기 가라앉게 약한 소리 말고요! 그냥 빚 하나 생긴 셈 치라구요! 살다 보면 이런 일도 생기는 거죠!"
90001280-167 = "오, 오르……. 지금 어딘가, 인간 같았어요……. 에헤헤……."
90001280-168 = "꾸엑?!"
90001280-169 = "저, 그러니까 하는 말인데. 이상하게 들릴지도 모르겠지만…… 다른 준비도, 조금 해 뒀으면 해."
90001280-170 = "다른 준비요?"
90001280-171 = "그게…… 뭔가요?"
90001280-174 = "그, 그 말은……!"
90001280-175 = "……응. 지금 내가 이런 말을 하는 게, 면목 없다는 건 아는데……."
90001280-176 = "……."
90001280-177 = "뭐, 좋지 않을까요?"
90001280-178 = "괜찮은…… 건가요?!?!"
90001280-179 = "괜찮고 뭐고 간에…… 소프가 이미 말한 것이기도 하잖아요?"
90001280-180 = "<만일의 경우, 티페레트를 강철대륙으로 후퇴시키는 방안도 고려해야 한다> 고요."
90001280-181 = "전력 보존의 측면에서도, 티페레트를 회수하는 것은 옳은 판단이라고 보이지만요."
90001280-183 = "아……! 그, 그러고 보니…… 그건 제가 맡기로 했었죠……! 미, 미안해요, 소프……!"
90001280-184 = "아니, 미안한 건 내 쪽이지……."
90001280-188 = "아무튼 면목 없다거나 있다거나 그런 말은 넣어 둬요. 어차피 원래 하기로 한 거잖아요?"
90001280-189 = "물론 그런 일은 일어나지 않는 편이 가장 좋겠지만요."
90001280-190 = "……모두, 고마워. 여기에서만 하는 말이지만……."
90001280-191 = "다 같이 있으니까, 정말…… 좋구나."
90001280-192 = "에헤헤……."
90001280-194 = "자, 자! 왠지 부끄러운 말은 그쯤 하고, 이제부터 제대로 해 보죠!"
90001280-195 = "티페레트의 진짜 무서움을…… 확실하게 보여 주는 겁니다!"
90001280-200 = "뭐, 뭐죠?!"
90001280-204 = "이건……? 새로운 예언자의 신호? <티페레트>……?"
90001280-205 = "!!! 모두, 이 자리를 피해!"
90001280-207 = "제가 대피시키겠습니다!"
90001280-208 = "응! 선생님은 이쪽으로!"
90001280-210 = "[ns] \"뭐가 오는지는 모르지만, 조심하자!\""
