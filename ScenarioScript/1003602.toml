[translation]
1003602-1 = "성당의 관리자"
1003602-2 = "트리니티 성당 내부"
1003602-3 = "(트리니티에 일정이 있어 온 김에, 히나타와의 메시지가 생각나 성당을 방문했다.)"
1003602-4 = "(미사 시간이 아니어서 그런지 넓은 성당 안에는 학생들의 모습이 보이지 않았다.)"
1003602-5 = "……덜그럭."
1003602-6 = "[ns] \"……?\""
1003602-7 = "덜그럭, 덜그럭……."
1003602-8 = "쿵!"
1003602-9 = "(소리는 성당 한쪽에 열려 있던 문에서 들려오고 있었다.)"
1003602-10 = "[ns1] \"……덜그럭?\"\n[ns2] 소리가 난 쪽으로 가 본다."
1003602-14 = "(문 뒤로 길게 이어진 복도는 허름한 창고 건물과 연결돼 있었다.)"
1003602-18 = "……? 어라? 선생님……?"
1003602-19 = "[s] \"……?\""
1003602-20 = "정말로 선생님이셨군요. 여긴 어쩐 일로……?"
1003602-21 = "아니, 그보다 어떻게 여기까지 들어오시게 된 건가요? 여긴 외부인 출입 구역이 아닌데!?"
1003602-22 = "보통은 여기까지 오시는 길조차 알 수 없으실 텐데……!?"
1003602-23 = "네? 짐 옮기는 소리를 듣고 오셨다고요?"
1003602-24 = "……복도가 열려 있었다고요?"
1003602-25 = "……아."
1003602-26 = "마, 맞다!! 그, 그러네요! 생각해 보니 성당 쪽 문을 닫아 두질 않았군요!"
1003602-27 = "으, 으으……. 내 정신 좀 봐……!! 정신을 어디다 두고 사는 거야……."
1003602-28 = "……음?"
1003602-29 = "괜찮으시다고요? 다른 데에다 이야기하지 않으시겠다고요?"
1003602-30 = "그, 그런 문제가 아닌데요!? 아, 아니. 그런 문제가 맞긴 하지만 아무튼 이건……. 그……!"
1003602-31 = "……네? 그보다 뭘 하고 있었냐고요?"
1003602-32 = "으, 으음……. 그게……."
1003602-33 = "보시다시피 성당 물품들을 관리하고 있었어요."
1003602-34 = "성당이란 곳이……. 겉보기엔 고요하고 정적인 곳이지만, 사실 의외로 손이 많이 가거든요."
1003602-35 = "시스터 분들의 물품이나 성당 자체의 관리품목들……. 가끔은 방문해주신 분들이 놔두고 간 짐까지 있으니……."
1003602-36 = "이리저리 모으고 옮기는 거만 해도 하루에 수십 박스가 나오곤 한답니다."
1003602-37 = "[s3] \"엄청난 양이네. 이걸 다 혼자서……?\"\n[s4] \"이곳의 관리 담당자 같은 거구나.\""
1003602-38 = "네, 뭐……. 아하하하……. 별로 대단한 건 아니지만요."
1003602-39 = "네, 뭐……. 아하하하……. 별로 대단한 건 아니지만요."
1003602-40 = "그래도 일단은 이곳의 시설 보수와 물품 관리상태를 유지하는 담당자이니까요."
1003602-41 = "물론 저 혼자 다 하는 건 아니고, 다른 자매님들도 열심히 같이 해주시긴 하지만……."
1003602-42 = "아무래도 이정도로 힘쓰는 일은 제가 직접 진행하는 편이 좀 더 수월하거든요."
1003602-43 = "……예? 도와주시겠다고요?"
1003602-44 = "그, 그게……. 말씀은 대단히 감사하고 기쁘지만, 아무래도 안 그러시는 편이……."
1003602-45 = "서, 선생님……!?"
1003602-49 = "[ns5] \"……꿈쩍도 안해!?\"\n[ns6] \"허, 허리가……! 허리가!!\""
1003602-50 = "괜찮으세요, 선생님? 우, 우선 그거 내려 놓으시고……!"
1003602-51 = "괜찮으세요, 선생님? 우, 우선 그거 내려 놓으시고……!"
1003602-55 = "말씀드렸듯이 이 박스들이 보기보다 꽤 무거워서요. 다른 자매님들이라면 서너 분이 같이 드셔야 해요."
1003602-56 = "물론 그렇게 되면 다른 일들을 하실 수가 없으니, 보통은 제가 스스로 해결하고 있지만요."
1003602-57 = "[s7] \"괜히 관리 담당자의 일을 맡고 있는 게 아니구나.\"\n[s8] \"……과연, 히나타만이 할 수 있는 일이네.\""
1003602-58 = "아하하하……."
1003602-59 = "아하하하……."
1003602-60 = "……그렇게 말씀해 주시니 왠지 기쁘네요. 감사합니다."
1003602-61 = "사실 저는 다른 자매님들처럼 마음을 편안하게 해드리거나 고민을 상담해주는 재능은 없어서……."
1003602-62 = "그래서 이렇게 힘쓰는 일이나 관리하는 일을 맡아서 하고 있는 거거든요."
1003602-63 = "저로서는 할 수 있는 게 이런 것뿐이라서……. 그래서……. 아하하……."
1003602-64 = "[s] \"…….\""
1003602-65 = "……아."
1003602-66 = "나, 난 또 무슨 쓸데없는 소리를……."
1003602-67 = "죄송해요. 쓸데없는 이야기로 분위기를 가라앉게 만들었네요."
1003602-68 = "우, 우선 밖으로 다시 나가실까요? 제가 성당 쪽으로 다시 안내해 드리겠습니다."
1003602-69 = "……네? 괜히 일을 더 얹은 것 같으시다고요?"
1003602-70 = "에이, 아니에요. 그럴 리가요. 선생님을 모셔다 드리는 일인데, 저로선 당연히 환영이죠."
1003602-71 = "게다가 마침 예배당 쪽에 가져가야 할 짐들도 있고 하니, 겸사겸사 편하게 생각해 주세요."
1003602-72 = "그럼 어디 보자……. 아, 이 박스였지, 참."
1003602-73 = "……흐읍!"
1003602-74 = "후우……. 후우……."
1003602-75 = "……그럼 가실까요?"
1003602-78 = "[ns] 히나타를 따라간다."
1003602-82 = "하아, 하아……. 하아……. 이걸로 또 한 건 해결!"
1003602-83 = "으아……. 땀 좀 봐……. 하아, 하아……."
1003602-84 = "짧은 시간이었는데 그새 땀범벅이 돼 버렸네요. 아하하하……."
1003602-85 = "……아. 생각해 보니 선생님 곁이었는데, 이렇게 땀 뻘뻘 흘리며 숨 소리도 세게……."
1003602-86 = "다, 다시 생각해 보니 역시 좀 창피한 것 같기도……."
1003602-90 = "……음? 뭐, 뭐죠……? 그 사이에 꽤 많은 분들이 성당에……."
1003602-91 = "게다가 왠지 다들 저흴 보시는 것 같은 느낌이……?"
1003602-92 = "……선생님? 갑자기 안색이 안 좋아지시는 것 같은데……. 왜 그러세요?"
1003602-93 = "……오해요? 오해라니 뭐가……."
1003602-94 = "예? 저한테 하는 말이 아니시라고요? 그럼……?"
1003602-95 = "[s9] \"나, 난 일단 먼저 가볼게!\"\n[s10] \"설명은 나중에, 그럼 이만……!\""
1003602-100 = "……으, 으음……!?"
1003602-101 = "서, 선생님……!? 선생님!?"
1003602-103 = "(괜한 오해가 커지는 것을 막기 위해 재빨리 샬레로 도망쳤다.)"
1003602-104 = "(그리고 히나타는 결국 마지막까지도 오해의 내용에 대해서 짐작하지 못했다.)"
