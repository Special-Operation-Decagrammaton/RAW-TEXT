[translation]
3501-1 = "눈 내리는 온천"
3501-4 = "……음! 완성이다!!"
3501-5 = "이야~. 오늘도 잘 만들어졌네! 이 정도면 모두가 좋아할 거야, 그렇지 메구 쨩?"
3501-6 = "오오~!! 멋지네!! 이번 주에 만들었던 것들 중에서 제일 예쁘게 만들어진 것 같아!!"
3501-7 = "응응! 이 정도면 누구라도 좋아할 거야! 빨리 다른 사람에게도 보여주고 싶네!!"
3501-8 = "으아아-. 그건 그렇고 뻐근하다. 공사 시작이 어제 밤 부터였나?"
3501-9 = "장소도 엄청 외딴곳이니까, 여기는. 재료 옮기는 거만 해도 엄청나게 힘들었잖아."
3501-10 = "그러네. 생각해 보니 이번 온천이 좋은 거랑은 별개로, 이렇게 먼 곳까지 사람들이 올 수 있을까?"
3501-11 = "으음. 확실히 그건……."
3501-12 = "……어쩌지……?"
3501-17 = "……? 음? 어라……?"
3501-18 = "그걸 왜 우리가 고민하는 거야? 그런 건 카스미 부장한테 물어보면 되는 거 아니야?"
3501-19 = "부장한테 물어보면 답이 나오겠지! 아니, 이미 생각해 놓은 게 있을 수도 있잖아?"
3501-24 = "하하하! 맞네, 맞네! 우리끼리 고민해 봐야 무슨 답이 나오겠어."
3501-25 = "하긴 머리 쓰는 건 부장이 다 알아서 잘해줄 텐데, 우리가 무슨 설레발이람."
3501-26 = "그런데 부장은? 이번 작업 때는 같이 온 거 아니었어?"
3501-27 = "왔어, 왔어. 아까 저 뒤에서도 봤거든."
3501-28 = "그럼 내가 가서 물어보고 올까? 너희는 먼저 여기서 쉬고 있을래?"
3501-29 = "에……. 메구 쨩 혼자?"
3501-30 = "만드느라 고생도 다 같이 했는데, 우리만 먼저 들어가서 쉬고 있는 것도 좀……."
3501-31 = "에이~. 신경 쓰지 마! 이쪽은 아직도 팔팔하다고! 전혀 힘들거나 하지 않거든!"
3501-32 = "다들 많이 피곤한 상태잖아? 그런 상태야말로 온천을 즐기기 최고의 상태 아니겠어?"
3501-33 = "푹 쉬고 있으라고! 물어보는 건 내가 할 테니까 말이야!"
3501-34 = "그럼 다녀온다~!"
3501-42 = "정말 힘이 넘친다니까, 메구 반장은."
3501-43 = "일도 자기가 제일 많이 했으면서 말이야. 들리는 말로 작은 온천 정도는 혼자서도 전부 만들 수 있대."
3501-44 = "엑!? 혼자……? 그 말 진짜야? 그냥 하는 농담이겠지?"
3501-45 = "나도 모르지. 그렇지만 당장 오늘 일한 것만 봐도……."
3501-46 = "……하라고 하면 진짜 할 수 있을 것 같다. 반장이라면."
3501-47 = "대단하긴 대단하네."
3501-48 = "그치, 그치? 괜히 원래 부장이었던 애가 아니라니까."
3501-49 = "……응?"
3501-50 = "그건 또 무슨 소리야? 원래 부장이라니?"
3501-51 = "어? ……몰랐어?"
3501-52 = "아아, 너는 온 지 얼마 안 됐지. 하긴, 생각해 보면 모르는 애도 많겠네. 우리는 몇 번이고 해산과 집결을 반복하니까."
3501-53 = "여기, 원래는 메구 쨩이 부장이었거든. 카스미 부장이 오고 나서, 메구 쨩이 넘겨준 거야."
3501-54 = "왜?"
3501-55 = "나도 몰라. 자세한 건 안 물어봤는데?"
3501-56 = "그냥 똑똑하니까 잘할 거 같아서 건네준 거 아닐까? 메구 쨩, 딱히 자리 욕심 있는 타입도 아니잖아."
3501-57 = "……사실이라면 진짜 반장답다는 말 밖에 안 나오네."
3501-58 = "하하! 뭐……."
3501-60 = "아무래도 상관없는 이야기긴 하지! 하하!"
3501-64 = "부장~~!! 카스미 부장~~~!!!"
3501-65 = "……음?"
3501-66 = "오~! 메구!! 무슨 일이야? 갑자기 큰 소리로 사람을 찾고."
3501-67 = "부장~!!"
3501-68 = "어라? 부장, 먼저 온천에 들어가 있었네? 평소에는 그래도 마지막쯤 들어가지 않았어?"
3501-69 = "하하, 뭐. 별다른 이유는 없어. 사소한 변덕이지."
3501-70 = "그냥 예전 생각도 좀 나고 해서, 왠지 오늘은 의욕이 들었던 모양이야."
3501-71 = "그나저나 무슨 일일까? 부원들이랑 같이 있을 줄 알았던 메구가 혼자서 나를 다 찾고."
3501-72 = "혹시 뭔가 문제라도 생겼어?"
3501-73 = "음? 아니? 아. 아닌가? 문제라고 할 수도 있나……?"
3501-74 = "여기가 너무 멀어서, 다른 사람들이 못 오는 게 아니냐-라고 부원들이 물어봤거든!"
3501-75 = "우리가 자재들 가지고 오는 것도 다들 엄청 힘들어 했잖아? 다른 사람들이 올 수 있을까?"
3501-76 = "와하핫핫핫!! 무슨 이야기인가 했더니, 난 또 뭐라고."
3501-77 = "걱정하지 않아도 돼, 메구! 자재를 싣고 오는 것과 셔틀버스가 오는 건 전혀 다른 이야기니까!"
3501-78 = "경사로긴 하지만 길 자체는 잘 닦아 두었으니, 나중에 버스만 몇 대 구하면 사람들 실어 나르는 건 문제없다고."
3501-80 = "오오오오-! 역시 부장……!"
3501-84 = "……? 그런데 우리한테 버스가 있었어?"
3501-85 = "와하핫핫핫!"
3501-86 = "……아니!"
3501-87 = "하지만 버스 같은 거야 대충 근처 PMC나 블랙마켓 운송 차량을 가져와서 개조하면 되지."
3501-88 = "요지는 다 생각해 둔 게 있다- 이 말이야. 중요한 건 그거지!"
3501-89 = "그러니까 다른 녀석들한테도 괜한 걱정할 시간 있으면, 오늘은 온종일 온천욕을 즐기며 체력을 채워 두라고 전해!"
3501-90 = "이 온천은 아직 완성이 아니야! 온천이라는 게, 건물만 만들었다고 장땡이 아니니까!"
3501-92 = "그렇구나! 오케이~! 잘 전달할게!"
3501-97 = "\"잘은 모르지만, 아무튼 푹 쉬고 내일이 되면 어떻게든 할 수 있다!!\"-라고!"
3501-98 = "와하핫핫핫!! 똑똑해, 똑똑해! 역시 메구야, 요점을 잘 파악한다니까!!"
3501-99 = "에헤헤……. 부장한테 똑똑하단 말을 들으니 뭔가 이상하네……."
3501-105 = "음? 메구?"
3501-106 = "의외로군. 메구도 이쪽 탕이 마음에 들었나? 다른 쪽 탕들이 더 크고 물도 따듯할 텐데."
3501-107 = "알아! 그냥 아까 부장이 말한 게 생각나서, 나도 들어온 것뿐!"
3501-108 = "아까 한 말……?"
3501-109 = "……아아. 예전 생각?"
3501-110 = "응! 부장, 눈을 특히 좋아하니까 말이야. 눈 속의 온천은 훨씬 더 좋아했었고!!"
3501-111 = "하하……."
3501-115 = "……응? 뭐라고?"
3501-116 = "어라? 무슨 소리지? ……내가 전에 그런 말을 했던가?"
3501-117 = "아니? 따로 말한 적은 없어."
3501-118 = "하지만 처음 봤을 때도 눈 속에서 자고 있었잖아?"
3501-119 = "온천 만들어서 탕에 넣어 주니, 찡그리며 자고 있던 표정도 엄청 기분 좋은 미소로 바뀌었고!"
3501-120 = "찡그리며 자고 있어……? 눈 속에서……?"
3501-121 = "……아."
3501-122 = "아아……."
3501-123 = "과연. 후후……. 그래."
3501-124 = "……'자고 있었다'……. 정말 메구 다운 표현이구나."
3501-125 = "……부장?"
3501-126 = "하하. 아니야, 아니야. 아무것도 아니야."
3501-127 = "그나저나 그건 또 처음 듣는 이야기군! 그때 탕 안에서의 내가 엄청 기분 좋은 표정을 하고 있었다고?"
3501-128 = "응! 그래서 첫눈에 알아본 거라고. \"이 사람, 눈 오는 온천을 엄청 좋아하는구나!\"라고!"
3501-129 = "과연……."
3501-130 = "……후후."
3501-131 = "……부장?"
3501-132 = "와하하하핫!! 그렇지! 눈 오는 날이야말로 온천의 진면목 아니겠나! 위는 시원하고, 아래는 따듯하고!"
3501-133 = "다 죽어가던 사람도 살려낼 수 있을 만큼 몸에도 좋고, 기분도 좋고!"
3501-134 = "아픔도 상처도 전부 뜨끈~한 물에 흘려보낼 수 있으니 말이야!"
3501-135 = "맞지, 맞지~!! 온천이니까! 그것도 눈 내리는 온천! 바로 지금처럼! 최고잖아!!"
3501-136 = "아~! 다른 사람들도 이 맛을 알아줬으면 좋겠는데!!"
3501-137 = "자, 자! 당연히 알게 될 거야, 언젠가 꼭 알게 될 거라고. 메구. 걱정할 거 하나도 없어!"
3501-138 = "그러니 우선 오늘은 메구도 푹~ 쉬고! 내일은 또 해야 할 일이 산더미니까 말이야!"
3501-139 = "응응! 아, 맞다! 쉬라고 하니까 생각났어. 나 여기 온 게 부장한테 물어보는 것 때문이었지!"
3501-140 = "다들 기다리겠다. 나는 이제 돌아가서 애들한테 이야기해 줄게!!"
3501-141 = "그래~. 바닥 미끄러우니까 뛰지 말고~."
3501-142 = "아하하! 당연하지!!"
3501-147 = "온천, 온천……. 후후."
3501-151 = "……그야 당연히 좋아하지."
3501-153 = "……좋아하게 될 수밖에."
3501-154 = "눈 내리는 온천"
