[translation]
10038020-1 = "제2화;소문에 대처하는 자세"
10038020-7 = "아, 선생님. 여기입니다."
10038020-8 = "[s] \"레이죠가 직접 불러 주다니, 반갑네.\""
10038020-9 = "그렇게 생각해 주신다면, 감사합니다."
10038020-10 = "음…… 도원향에는 이미 몇 번 와 본 적 있으시죠? 네. 그렇지만 이곳은 도원향에서도 가장 안쪽의 다실입니다."
10038020-11 = "평소 저희 현무상회의 이야기를…… 저희 상회원들끼리 나누기도 하는 곳이죠."
10038020-12 = "[s] \"그랬어? 어쩐지 분위기가 조금 다른 것 같았는데.\""
10038020-13 = "네. 이 방은 보기보다 상당한 수준의 방음 처리가 되어 있어, 저희들의 이야기는 웬만해서는 밖으로 새어 나가지 않을 겁니다."
10038020-14 = "그렇게까지 긴밀히 하고 싶은 이야기가 있느냐고요? 그것은……."
10038020-15 = "……알고 계시다시피 현재 현무상회는 전반적으로 출입 제한 상태가 되어 있습니다. 문주님의 명으로 말이죠."
10038020-16 = "회장님께서는…… 어린이가 되어, 격리된 상태이시고."
10038020-17 = "결과적으로 지금의 현무상회를 이끌어야 할 책임이 있는 것은, 다른 누구도 아닌…… 저입니다."
10038020-18 = "네. 그야 부담스럽죠. 지금도 위가 아파오는 것 같습니다. 어제는 잠도 조금 설쳤고요."
10038020-19 = "그나마 불행 중 다행이라면, 현무상회 전체가 마비된 것이나 다름없는 상태이기에."
10038020-20 = "상회를 관리하는 데에 드는 저의 실질적인 수고 자체는, 적은 편이라는 것 정도일까요."
10038020-21 = "[s] \"그건 안 좋은 일 아냐?!\""
10038020-22 = "사실 그렇습니다. 농담 겸 한탄을 조금 해 보고 싶어서요."
10038020-23 = "어쨌든 제가 선생님을 뵙자고 한 이유는, 지금 산해경에 떠도는 거리의 소문을…… 선생님께 전해 드리고 싶어서입니다."
10038020-24 = "물론 선생님께서는 현재 현룡문의 내빈으로 와 계시다는 것 정도는 저 역시 알고 있습니다만."
10038020-25 = "이것은 아무래도 현룡문 쪽에서는 듣기 어려운 이야기일 듯 해서요."
10038020-26 = "이다음에 곧장 현룡문 간부들과의 만남이 예정되어 있으시죠?"
10038020-27 = "그 전에, 현룡문의 시각이 아닌 다른 시각을 이야기해 드리는 것이, 선생님께도 참고가 될 것 같아서요."
10038020-28 = "[s] \"조금…… 아니, 많이 부담스럽네…….\""
10038020-29 = "죄송합니다. 이런 표현은 그다지 좋아하지 않습니다만, 시국이 시국인 상황이어서요."
10038020-36 = "지금 거리에는…… 조금 비밀리에, 어떤 퇴학생에 대한 이야기가 떠돌고 있습니다."
10038020-37 = "[s] \"혹시, 신타니 카이라는 학생?\""
10038020-41 = "네? 선생님께서 어떻게 그 이름을……?"
10038020-44 = "(레이죠에게 키사키와 나누었던 대화에 대해 이야기해 주었다.)"
10038020-47 = "그렇군요. 문주님께서는 그렇게……."
10038020-48 = "……."
10038020-49 = "네. 거리에는 지금 그 신타니 카이에 대한 이야기가, 암암리에 퍼지고 있습니다. 주로 3학년 학생들 위주로요."
10038020-50 = "3학년 학생들 위주라는 점이 핵심입니다. 1학년들과 2학년들은 아예 모르거나, 오히려 부정확하고 부풀려진 괴담 같은 것을 접하는 태도죠."
10038020-51 = "그리고, 그 소문을 기점으로, 또 다른 많은 불안한 이야기들이 흉흉하게 나돌고 있습니다."
10038020-52 = "예전…… 그 교류회와 연관된 이야기들까지 포함되어서 말이죠."
10038020-53 = "조금 더 구체적으로요? 그렇군요. 그러니까……."
10038020-56 = "카구야 부장은 어떻게 된 걸까?"
10038020-57 = "자숙 중이라고는 하지만, 충언을 하려다 잡혀갔다는 소문도 있대……."
10038020-60 = "만일 신타니 카이가 정말로 돌아왔다면, 거기에는"
10038020-61 = "문주님의 뜻이 개입되어 있을지도……."
10038020-64 = "퇴학당해서 일곱 죄수까지 된 학생이."
10038020-65 = "아무 조건 없이, 산해경으로 돌아올 수 있을 리 없으니……."
10038020-67 = "그런데 정작 신타니 카이를 퇴학시킨 건, 문주님이었잖아."
10038020-68 = "어쩌면 그것도 포함된 무언가가 있는 게 아닐까……?"
10038020-71 = "산해경, 이대로 괜찮으려나."
10038020-76 = "현룡문을 믿어도 괜찮은 거야? 그리고 문주님은……."
10038020-79 = "제가 빠르게 정리해 본 것만 해도, 이 정도입니다."
10038020-80 = "……요약해 드리자면, 고학년들 위주로 현룡문에 대한 불안감이…… 조금씩이나마 커져 가고 있다는 것이죠."
10038020-81 = "네. 물론 저희 현무상회는 현룡문과 그다지 사이가 좋지 않습니다. 그것은 어쩔 수 없는 사실입니다."
10038020-82 = "……그러나 현무상회의 상회 활동 역시, 현룡문이 존재하기에 이루어질 수 있는 것이기도 합니다……."
10038020-83 = "저라고 해서 그 사실을 모르는 것은 아닙니다. 다만 그 말도 안 될 정도로 깐깐한 기준과, 조금 치졸하게까지 보이는 간섭과."
10038020-84 = "툭하면 이건 전통에 어긋난다느니 산해경의 자존심을 내팽개쳤다느니 그런 말을 늘어놓으면서 영업 방해를 해 오는 것이……!"
10038020-88 = "죄송합니다. 말이 조금 옆으로 샜군요. 역시 월영제가 다가오면, 크고 작은 이상한 일이 일어나는 법인 걸까요……."
10038020-89 = "[s] \"월영제가 왜?\""
10038020-93 = "선생님께서는 월영제에 대해 어떻게 알고 계신가요?"
10038020-95 = "그렇군요. 풍요를 기원하고 먹을 것을 나누는 절기……. 네. 그것이 월영제의 일반적인 인식이겠지요."
10038020-96 = "……하지만 월영제에는, 조금 다른 측면의 이야기도 포함되어 있습니다."
10038020-97 = "가령 월영제를 전후로 하계로 내려온다고 하는, 달로 떠났던 선인(仙人) 같은 것 말이지요……."
10038020-98 = "[s] \"선인(仙人)?\""
10038020-102 = "선인(仙人)이란, 보통 사람이 수행이나 연구를 거듭해 깨달음을 얻고, 무언가…… 특별한 존재가 된 것을 뜻합니다."
10038020-103 = "월영제에는, 바로 그 선인(仙人)을 기린다는 의미도 포함되어 있습니다."
10038020-104 = "달로 떠났던 선인(仙人)이 이 땅으로 돌아와, 하계를 둘러본 뒤 다시 떠난다는 이야기죠."
10038020-105 = "하지만 선인(仙人)이 찾아온다는 것 하나만으로, 이 땅에는 기묘한 일들이 일어난다고도 합니다."
10038020-106 = "네……. 그렇습니다. 지금 산해경에 일어나고 있는 일들이, 어쩌면 월영제와 연관이 있지 않을까, 하고 생각하는 사람들도 있을 정도입니다."
10038020-110 = "저 말인가요? 저야 그냥 미신이나 구전 같은 것이라고 생각하고는 있습니다만."
10038020-111 = "상황이 이렇게까지 되면, 조금이지만 신경이 쓰이기는 하네요……."
10038020-113 = "(레이죠에게서 거리에 떠도는 소문에 대한 이야기를 듣고, 곧장 현룡문으로 향했다.)"
10038020-120 = "(현룡문에서의 회의는…… 그야말로 아수라장이었다.)"
10038020-121 = "현무상회로의 출입을 통제하고 있지만, 어린이 병은 계속해서 퍼져나가고 있습니다……. 추가적인 조치가 필요합니다!"
10038020-122 = "그 전파 기작 역시 제대로 파악되지 않는 중입니다. 역학 조사에도 어려움이 많습니다!"
10038020-123 = "현장 인력들은 한계를 호소하고 있습니다. 대책이 필요합니다!"
10038020-128 = "하지만 한 가지는 알아냈잖아? 어린이 병에 걸린 학생이라고 해도, 3일 정도 지나면 전파력이 급격히 떨어진다는 것 말이다!"
10038020-130 = "그렇지만 저희가 모든 학생들의 증상 이력을 파악하고 사후 관리를 할 수는 없습니다…… 이것은 인력과 물리적 한계의 문제입니다!"
10038020-131 = "부탁드립니다, 문주님! 월영제를 이대로 개최한다는 것은…… 어쩌면……!"
10038020-138 = "말을 삼가라! 문주님의 앞이다!"
10038020-144 = "아니, 괜찮다. 지금은 현장의 이야기를 들어야 할 때가 아니겠느냐."
10038020-145 = "상황이 상황인 만큼, 거기에 어느 정도의 다급함이 섞인다 해도 어쩔 수 없는 것이겠지."
10038020-146 = "계속하여 듣겠다."
10038020-151 = "넷! 그에 그치지 않고…… 불길한 소문은, 계속해서 커져만 가고 있는 상황입니다! 좀처럼 가라앉지 않습니다……."
10038020-152 = "단순한 소문의 확산만이라면 큰 걱정거리가 되지 않겠습니다만, 문제는……. 현룡문의 통제력이, 약화되고 있는 낌새를 보이기 시작했다는 것입니다……."
10038020-153 = "경극부의 자숙과 카구야의 행방도 구설수에 오르고 있습니다……."
10038020-154 = "전체적으로 현룡문의 영이 서지 않고 있습니다. 앞에서는 따르는 척하지만, 돌아서는 순간 백안시 당하는 느낌입니다……."
10038020-156 = "그러한가……. 그것은 확실히 문제이겠구나. 그렇다면, 이번 사태에 대한 그대들의 의견은 어떠한가?"
10038020-161 = "……."
10038020-162 = "……말씀드리기, 어려운 의견입니다만……."
10038020-164 = "괜찮다. 말해 보아라."
10038020-170 = "월영제에, 외부인을 들이지 않는 것이 어떨까 합니다."
10038020-175 = "그것은……!"
10038020-176 = "저희는 현실을 말씀드리고 있는 것입니다. 미나 집행부장. 많은 산해경 학생들은, 이 일의 원인을 외부 학생들로 돌리고 있습니다."
10038020-182 = "……."
10038020-183 = "이런 상황에서, 월영제를 통해 더 많은 외부인이 출입하게 된다면…… 그때에는 어쩌면, 현장에 대한 통제력을 완전히 상실할지도 모르는 일입니다."
10038020-184 = "무, 물론 평년과 같이 축제를 진행하여, 산해경에 아무 문제도 없음을 과시할 수도 있을 것입니다. 그러나……."
10038020-185 = "……."
10038020-187 = "이미 존재하는 문제를 없는 것으로 치부할 수는 없다는 것이로구나."
10038020-188 = "나아가, 그것을 솔직하게 인정하고 대책을 세우는 것이 필요하다는 것일 터이고."
10038020-189 = "문주님……!"
10038020-191 = "그, 그것은…… 그러니까……!"
10038020-196 = "내가 억측을 내세우고 있는 것인가?"
10038020-201 = "아닙, 니다. 저희로서는 오히려 이렇게 세세하게 헤아려 주셔서 몸 둘 바를 모르겠다고밖에 말씀드릴 수 없습니다. 그렇지만……."
10038020-203 = "그래. 알았다. 그대들이 하려는 말이 무엇인지 짐작 가는 바가 있구나."
10038020-207 = "……."
10038020-211 = "들어라. 금번 월영제의 외부 학생 출입은, 제(除)하는 것으로 하겠다."
10038020-216 = "문주님!"
10038020-217 = "문주님……!"
10038020-219 = "현무상회에 대한 통제 조치 역시 현상을 유지하도록 한다. 단, 3일이 지난 학생에게는 통행의 자유를 허(許)하도록 하겠다."
10038020-225 = "……."
10038020-226 = "헛소문에 대한 대응은 단호해야 하겠지만, 만에 하나라는 것도 있을 수 있는 법이다."
10038020-227 = "지금 이 시간부로 산해경 내부에 대한 경비와 탐색을 한층 더 강화하도록 한다."
10038020-228 = "이것이 현룡문의 문주인 류우게 키사키의 뜻이다."
10038020-230 = "명을 받들겠습니다. 문주님!"
10038020-231 = "당장 공표하고 시행하도록 하겠습니다!"
10038020-236 = "괜찮으시겠습니까, 문주님……?"
10038020-237 = "그래. 지금은 무엇보다 현장의 목소리를 우선시해야 할 터."
10038020-238 = "……."
10038020-239 = "현장 시찰에 나서 보는 것도 좋겠구나. 준비하거라, 미나."
10038020-243 = "……?! 아, 안 됩니다. 문주님! 지금은 곤란하다고 생각합니다! 그것은……!"
10038020-244 = "그것은 코노에 미나로서의 의견인가, 집행부장으로서의 의견인가?"
10038020-245 = "……!"
10038020-252 = "집행부장으로서 말씀드립니다. 아니, 간언 드립니다."
10038020-253 = "조금만 더 저희 부원들을…… 그리고 현룡문을, 믿어 주셨으면 합니다……."
10038020-257 = "……그러한가."
10038020-261 = "알겠다. 나는 내실로 돌아가 있도록 하마. 무슨 일이 있다면 지체하지 말고 알리거라."
10038020-262 = "예. 문주님."
10038020-267 = "하아아아아아아아……."
10038020-268 = "[s] \"수고 많았어, 미나…….\""
10038020-269 = "훗……. 수고라고 할 것까지야. 이 정도는 현룡문의 집행부장으로서, 일상에 지나지 않는다!"
10038020-270 = "[s] \"이럴 때일수록 일상을 지키는 게, 정말로 대단한 거 아닐까.\""
10038020-274 = "으, 어……?"
10038020-275 = "서, 선생님이 그렇게 치켜세워주어도, 별로 하나도 기분 좋지 않으니까?"
10038020-276 = "나는 어디까지나 쿨하고 하드보일드하게 임무를 수행하는 것뿐이니까?"
10038020-284 = "그러면 나도 조금…… 방에 가 있도록 하지. 절대로, 절대로 피곤해서 자리를 비우려는 것은 아니니까 말이다!"
10038020-285 = "그 정도는 알고 있다고? 훗. 역시 선생님과는 이야기가 통하는군. 그러면 조금 실례하지."
10038020-290 = "아. 그러고 보니, 선생님도……. 일단은, 외부인이니까 말이지? 그, 여러 가지로 말이지?"
10038020-291 = "무슨 말을 하고 싶은 거냐고? 그러니까……."
10038020-292 = "그, 당분간은 너무 눈에 띄지 않도록, 자중하는 편이 좋을 거라는 거다."
10038020-293 = "가령 누군가와 필요 이상으로 길게 통화를 한다거나."
10038020-294 = "문주님께서 몰래 암행을 나가자는 권유를 해 온다고 해서, 그걸 함부로 따라나선다거나 하는 것 말이지……."
10038020-295 = "[s1] \"그런가, 지금의 산해경은 꽤 불안정하니까.\"\n[s2] \"가능한 한 그래보겠지만, 어쩔 수 없을 땐 미안.\""
10038020-298 = "으, 음……! 그 부분은 나로서도 면목이 없다고 생각한다."
10038020-299 = "하지만 때와 상황이라는 요소도 분명히 고려해야 하는 것이니까……."
10038020-300 = "알고 있으니 잘 쉬다 오라고? 이, 이야기했지 않은가! 나는 결코 절대로 피곤해서 자리를 비우려는 것이……!"
10038020-306 = "왜, 왜 사람 몸을 떠미는 것인가! 선생님이 굳이 그렇게까지 하지 않아도……! 그러니까 나는……!"
10038020-311 = "(부실은 순식간에 조용해졌다…….)"
10038020-317 = "(어딘가로 전화라도 걸어 보려다가, 미나의 말을 떠올리고 자중하기로 했다.)"
10038020-321 = "(그러고 보니…….)"
10038020-323 = "또한, '어려지는 것' 이외의 증상은 아직 관찰되지 않았으며, 예외적으로 훈육지원부 매화원의 원생들에게는 효과가 나타나지 않았다고 합니다!"
10038020-326 = "하지만 한 가지는 알아냈잖아? 어린이 병에 걸린 학생이라고 해도, 3일 정도 지나면 전파력이 급격히 떨어진다는 것 말이다!"
10038020-330 = "[ns] \"흐음, 이거……?\""
10038020-333 = "(문득, 한 학생의 얼굴이 떠올랐다.)"
10038020-337 = "(필요 이상의 통화를 자제해 달라는 미나의 당부를 떠올리고, 모모톡을 활용하기로 했다.)"
10038020-338 = "[ns] \"<안녕, 슌. 뭐 하고 있어?> 라고 써서…….\""
10038020-345 = "<어머나, 선생님이신가요? 우후후. 선생님께서 먼저 모모톡을 보내 주시다니.>"
10038020-346 = "<오늘은 왠지~ 좋은 일이 생길 것 같기도 하고~ 그러네요~?>"
10038020-347 = "<그러고 보니 산해경에 와 계신다고 들었는데, 저 조금 서운할지도요? 이제서야 연락을 주시고 말이죠! >"
10038020-348 = "[s] \"<응, 미안해……. 그렇지만 여러 가지로 주의를 받아서.> 라고…….\""
10038020-349 = "<주의…… 라고요? 그건 또 무슨 말씀이신지……?>"
10038020-352 = "(슌에게 지금의 처지, 그리고 현룡문에서 일어나고 있는 일들에 대해 설명했다.)"
10038020-355 = "<…….>"
10038020-356 = "<그렇군요. 그런 일이…….>"
10038020-360 = "<후훗. 저, 지금 막 좋은 생각이 떠오른 거 있죠? 조금만 기다려 주시겠어요?>"
10038020-361 = "<이제 와서 드리는 말이지만, 선생님께서 모모톡으로 말을 걸어 주신 게, 차라리 다행이라는 생각이 드네요.>"
10038020-362 = "[s] \"<응? 그건 또 무슨 말이야?>\""
10038020-366 = "<이것도 저것도, 조금만 기다리시면 알게 될 거예요!>"
10038020-371 = "?"
10038020-377 = "안녕하세요, 선생님!"
10038020-382 = "[ns] \"슈……! 아니, 슈에링?!\""
10038020-383 = "에헤헤. 맞아요. 선생님의 슈에링이에요!"
10038020-384 = "여기에는 어떻게 들어왔냐고요? 그야 현룡문이라고 해도 매화원 원생들의 출입을 특별히 막지는 않거든요!"
10038020-385 = "아, 거기에서 '슈에링은 사실 매화원 원생이 아니잖아?' 같은 눈빛을 보내시는 거 금지예요! 활용할 수 있는 건 전부 활용하면 좋잖아요?"
10038020-386 = "그보다, 왜 어린아이의 몸이 되어 버렸냐고요? 어, 그건. 그러니까……."
10038020-387 = "저도 걸려버렸거든요. 어린이 병……."
10038020-388 = "아, 괜찮아요! 코코나 쨩에게는 아직 들키지 않았고, 다른 매화원 원생들에게도 의심받고 있지 않았으니까요."
10038020-395 = "그보다 역시 어린아이의 몸은 좋네요~ 어깨도 결리지 않고, 가슴이 무겁지도 않고, 무엇보다 몸도 가볍고!"
10038020-399 = "아, 이럴 때가 아니에요! 이왕 이 몸으로 여기까지 온 거, 문주님을 도와야죠!"
10038020-400 = "뭘 어떻게 할 생각이냐고요? 에헤헤…… 그건 말이죠!"
10038020-403 = "정말로…… 슌 교관인 것인가?"
10038020-404 = "그래요, 문주님! 이미 문주님께서 확인 질의를 거치셨잖아요?"
10038020-405 = "그래. 분명 그리하였지……. 그럼에도 선뜻 믿기지 않는구나."
10038020-406 = "무엇보다, 뭐라고 해야 할까. 3학년이었을 때의 성격과는 조금 차이가 있는 것 같이 보이기도 하고 말이다……?"
10038020-410 = "무, 무슨 말씀이신지 모르겠는데요?! 저는 어디까지나 저 자신이니 말이죠……?"
10038020-411 = "그래. 그런 것으로 하지. 그렇다면 여기에서…… 슌 교관과 나 사이의 비밀이, 또 하나 늘었다고 볼 수도 있겠구나."
10038020-412 = "그러고 보니 그렇게 되겠네요. 너무 부담 갖지 마세요. 문주님. 저도 그렇게 하고 있으니까요."
10038020-413 = "음. 그래. 그러면 화제를 바꿔서……."
10038020-417 = "내게 도움을 주고 싶다는 그대의 뜻에는 감사를 표하겠다. 그러나 무엇을 어떻게 할 수 있다는 것인가?"
10038020-419 = "그건 말이죠……."
10038020-426 = "[ns] \"어? 이건…… 매화원의 지정 유니폼?\""
10038020-427 = "맞아요! 물론 권장 유니폼이지 필수인 것은 아니어서 모든 원생들이 입고 다니지는 않지만……."
10038020-428 = "이걸 입고 다니면, 산해경 안에서라면 어디서든 매화원생으로 보이기 충분하겠죠!"
10038020-429 = "그렇지만, 이것을 어떻게 하겠다는 것인가?"
10038020-430 = "뭐……."
10038020-435 = "'익숙' 하시잖아요. 문주님? 이런 일."
10038020-439 = "……후후."
10038020-440 = "그렇구나. 매화원의 원생들은 어린이 병의 영향을 받지 않으니."
10038020-441 = "매화원 원생으로 변장하여 암행을 시작하면, 누구에게도 의심을 받지 않으리라는 것인가?"
10038020-442 = "저는 아무 말도 하지 않았답니다!"
10038020-443 = "그대도 참으로 여전하구나. 역시 사람을 결정하는 것은 그 안에 담긴 본질인 것인가."
10038020-455 = "흠. 이런 느낌이겠군."
10038020-456 = "와! 역시 제 생각대로 잘 어울리세요!"
10038020-457 = "[s] \"어……. 음……. 에……. 아…….\""
10038020-461 = "왜 그러는가, 선생? 어딘가 어색한 부분이라도 있는가?"
10038020-462 = "[s] \"어색하다기보다, 그 반대라서 문제인 것 같은데…….\""
10038020-463 = "후후. 그러한가. 하지만 아직이다. 이래서는 완벽한 변장이라 할 수 없지."
10038020-464 = "또 무엇이 남았느냐고? 중요한 것이다. 정말로 중요한 것이라 아니 할 수 없을 터이지."
10038020-465 = "……."
10038020-471 = "안녕하세요, 선생님! 키키라고 해요! 우리 이제부터 산해경을 둘러보러 가는 거죠?"
10038020-473 = "……!"
10038020-474 = "맞아요, 키키 쨩! 지금부터 매화원 임시 인솔자이신 선생님이랑 같이, 산해경을 보러 가는 거예요!"
10038020-475 = "와–아!"
10038020-476 = "와–이!"
10038020-481 = "[ns] 쓰러진다."
10038020-486 = "아, 선생님이 정신적인 충격을 이기지 못하고 쓰러졌어요……."
10038020-487 = "음……. 역시 조금 과격한 인상 변화였는가……."
10038020-492 = "하지만 오늘의 키키는 키키니까요!"
10038020-494 = "맞아요! 그러니까 선생님도 어서 일어나 주세요! 아이들은 산해경의 미래잖아요?"
10038020-496 = "(그렇게, 키키 쨩(?)과 슈에링과 함께…….)"
10038020-497 = "(인지부조화로 어딘가로 날아갈 것 같은 정신을 부여잡으면서…….)"
10038020-500 = "(우리들의 산해경 투어(?)는, 시작된 것이었다!)"
