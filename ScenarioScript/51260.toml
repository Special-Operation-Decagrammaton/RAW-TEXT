[translation]
51260-1 = "제26화;소원을 담아"
51260-2 = "(백귀야행을 혼란으로 몰고 갔던 사태는 일단락이 났다.)"
51260-5 = "여기! 필요한 자재 좀 가져다줘!"
51260-6 = "아까 망치가 필요하다고 했던 사람 누구야?"
51260-10 = "아, 이쪽으로 전달해 주세요!"
51260-13 = "네! 신청서는 이쪽에서 받겠습니다!"
51260-14 = "필요한 기자재가 있는 분은 이쪽에서 신청서를 작성해 주시면 됩니-다!"
51260-15 = "아직 시간엔 여유가 있으니 천천히 차례를 지켜주세요~!"
51260-16 = "[s] \"다들 이른 아침부터 고생들이네.\""
51260-20 = "아. 선생님!"
51260-21 = "어서 오세요! 선생님!"
51260-23 = "후후! 축제를 다시 살리기 위해! 저희 마츠리부 전원이 있는 힘껏 노력하고 있답니다!"
51260-24 = "[s1] \"으음, 확실히 난리도 아니었으니까.\"\n[s2] \"그래도 축제를 다시 개최하는 게 확정된 거지?\""
51260-27 = "네, 본의 아니게 벌어진 일이기도 했고……"
51260-28 = "이런저런 이유로 다행히 많은 분들의 양해를 얻어. 축제도 다시 진행할 수 있게 되었어요."
51260-29 = "으으윽…… 그렇다고는 해도 사태가 벌어지는 동안, 저희 마츠리부 전원이 기절한 채로 쓰러져 아무것도 하지 못했다니……"
51260-30 = "억울하고, 용서할 수 없어요!!!"
51260-32 = "맞습니다! 그런 일만 없었다면 저희 마츠리부도 전력을 다해 싸웠을 텐데!"
51260-33 = "네! 그런 건 축제가 아니었어요! 정말로!"
51260-34 = "[s] \"아니, 그게 아니더라도 마츠리부가 고생한 건 잘 알고 있으니까.\""
51260-36 = "감사합니다……"
51260-37 = "하지만, 저희 대신에 선생님과 백귀야행의 모두가 축제를 수습해주신 것에 대해 책임감을 느끼고 있달까. 부채감을 느끼고 있달까."
51260-38 = "여기서 저희 마츠리운영관리부! 보답을 위해서라도 전력으로 축제를 재개 시켜야만 하는 법이겠죠!"
51260-39 = "……백화요란의 건이 무사히 해결된 것을 기념하기 위해서라도 말이에요."
51260-41 = "네! 맞습니다! 부장!"
51260-42 = "시설이 파괴되고 축제장이 엉망이 되고, 당장 곤란한 상황이 되긴 했어도 축제가 끝나버린 건 아니니까요!"
51260-44 = "응. 망가진 건 고치고. 무너진 건 다시 바로 세우면 되는 법이니까."
51260-45 = "그렇죠? 선생님!"
51260-46 = "[s] \"응, 시즈코의 말이 맞아.\""
51260-47 = "에헤헷."
51260-51 = "자아! 그럼 마츠리부! 열심히 힘을 내서 출동이야!"
51260-54 = "오오-!"
51260-56 = "아참, 그리고 선생님."
51260-64 = "이번에도 정말 고생 많으셨어요."
51260-65 = "[s] \"……별말씀을.\""
51260-89 = "(화마가 휩쓸고 지나간 자리라도, 여전히 분주히 움직이는 사람들은 있다.)"
51260-90 = "(망가진 것은 고치고 무너진 것은 다시 바로 세우면서…… 다 함께 원래의 일상으로 돌아가기 위해 씩씩하게 힘을 낼 뿐.)"
51260-93 = "(그리고.)"
51260-99 = "[ns] \"네, 전화 받았습니다.\""
51260-106 = "어서 오세요. 선생님."
51260-107 = "급작스러운 호출에도 이렇게 흔쾌히 음양부를 찾아준 것에 감사드립니다."
51260-108 = "[s] \"니야의 호출이니, 만사 제쳐 놓고 달려왔어.\""
51260-109 = "냐하. 과연, 그런 말씀까지 시원시원하셔서 몸 둘 바를 모르겠네요~"
51260-110 = "오늘 이렇게 선생님을 모신 건 다름이 아니라……."
51260-111 = "바로 얼마 전에 있었던 예의 그 <사건>에 대한 사후 보고를 위해서입니다."
51260-112 = "우선 백화요란의 부활동과 관련해 이야기를 하자면~"
51260-116 = "폐부는 보류랍니다♪"
51260-117 = "[s] \"보류? 없던 일이 되는 게 아니라?\""
51260-118 = "네, 유카리 양과 관련된 소동으로 한차례…… 주요 부원들이 한데 모일 수 있게 된 건 물론 고무적인 일이지만~"
51260-119 = "냐하. 아무래도 일반부원들의 연이은 탈퇴로 존폐 위기까지 갔던 만큼, 그 핵심 문제를 해결하지 않는다면 앞으로도 백화요란에겐 커다란 시련이 계속될 테니까요~"
51260-120 = "[s] \"커다란 시련이라면 구체적으로는……?\""
51260-121 = "구체적으로는 동아리 활동비가 안 나온다거나~?"
51260-122 = "[s] \"확실히 커다란 시련이네! 그건!\""
51260-123 = "냐하하~ 그래도 지금 추세라면……"
51260-124 = "네, 시간은 조금 걸리겠지만, 조만간 훌훌 털어버리고 다시 일어설 수 있겠지요."
51260-125 = "그러다 보니 예의 쿠즈노하 건과 관련한 단서는 아무래도……."
51260-126 = "[s] \"그거라면 괜찮아. 하나하나 차근차근히 해 나가면 되는 거니까.\""
51260-127 = "……그러신가요?"
51260-128 = "어쨌거나 그밖에도 시즈코 양의 복구 작업이 계속되는 중이고, 여기엔 당사자는 물론 상인회에서도 의욕을 내주고 있어, 축제의 재개는 꽤 빠른 시일 내에 이루어질 거 같다. 라든가."
51260-129 = "또 보고드릴 사항으로는……"
51260-130 = "한 가지 더. 조금은 진지한 이야기가 되겠습니다만."
51260-131 = "단도직입적으로 말씀드리자면, 선생님과 백화요란 여러분이 마지막까지 대면하고 싸웠다던 화조풍월부의 학생……"
51260-132 = "야부키 슈로……라고 했던가요."
51260-136 = "직후 모습을 감춘 그녀를 쫓기 위해 저희 음양부를 움직여 바로 추적을 개시했습니다만."
51260-137 = "……아쉽게도 백귀야행 자치구를 벗어난 시점에서 흔적을 놓치고 말았습니다."
51260-138 = "무슨 수단을 쓴 건지 자치구의 경계면을 기점으로 완전히 증발을 했더군요."
51260-139 = "마치 귀신에 홀린 것 같은 기분이에요."
51260-140 = "[s] \"그래……. 역시 쉽게 잡혀줄 생각은 없단 거겠지.\""
51260-143 = "[ns] \"그래도 고생했어. 니야. 당장은 축제장에서 벌어지는 일의 수습이 우선…….\""
51260-144 = "……제 잘못이에요."
51260-145 = "[s] \"응?\""
51260-146 = "일전에는 제가 너무 쉽게 생각했습니다."
51260-147 = "화조풍월부로부터 찾아온 경고. 그것을 그렇게 쉽게 무시해서는 안 되는 일이었는데. 그 결과, 일이 이렇게나 커져 버렸지요."
51260-148 = "……저의 판단미스로 인해, 백귀야행에 커다란 상흔이 남기까지 해서."
51260-149 = "선생님은 물론 백귀야행의 모든 여러분께도 고개를 들 수……."
51260-150 = "[s] \"아니, 그렇지 않아.\""
51260-154 = "………네?"
51260-155 = "[s3] \"니야가 말했지.\"\n[s4] \"화조풍월부는 단순한 뜬소문, 원래는 재고의 가치도 없다고.\""
51260-158 = "[ns5] \"단순한 소문이나 괴담까지 전전긍긍해서는 아무것도 할 수 없어.\"\n[ns6] \"니야는 가지고 있는 근거의 타당성을 따져, 판단을 내린 거잖아?\""
51260-159 = "하지만."
51260-160 = "하지만."
51260-163 = "[ns7] \"그 결과, 니야는 나를 백귀야행으로 불러주었어.\"\n[ns8] \"학생들이 걱정되었으니까.\""
51260-166 = "[ns9] \"덕분에 나도 늦지 않을 수 있었지.\"\n[ns10] \"나는 오히려 니야의 그 점이 자랑스러워.\""
51260-171 = "선생님……"
51260-172 = "이런 일이 벌어지고도, 제가 노력했다고……"
51260-173 = "자랑스럽다고 말씀해 주시는 건가요?"
51260-174 = "[s11] \"필요하다면 칭찬을 하고,\"\n[s12] \"실수했다면 격려를 해주는 게 선생님이 할 일인걸.\""
51260-177 = "……실수를 반추하며 매몰되기보다 앞을 바라보아라. 라는 말씀……이로군요."
51260-178 = "냐하. 그렇게까지 말씀해 주신다면 알겠습니다."
51260-179 = "화조풍월부의 존재가 확인된 지금, 앞으로는 좀 더 그들의 행적을 추적할 수 있도록 음양부의 옛 기록과 새로운 방안을 찾아봐야겠지요."
51260-180 = "선생님의 고견, 가슴에 받아들이고 앞으로는 최선을 다해 샬레를 서포트하겠답니다. 냐하핫."
51260-181 = "[s] \"아, 그리고 참고로 나 아직 보수를 못 받았으니까.\""
51260-182 = "……보수, 말씀이신가요?"
51260-183 = "아, 물론……"
51260-184 = "이번 일에서도 샬레에게 큰 도움을 받은 만큼, 그에 상응하는 보수를 준비하는 것이야. 당연히……"
51260-188 = "네? 선생님이 말하는 보수는 그런 게 아니야?"
51260-189 = "치세냥 쓰다듬기……? 네? 저기, 무슨 말씀이시온지……."
51260-190 = "[s] \"하지만 치세는 음양부 일로 바쁘니,\""
51260-193 = "[ns] \"대신 니야를 쓰다듬을게!\""
51260-197 = "네? 아니, 선생님. 그건 원래 농담이었다고 할까."
51260-198 = "저기, 저……"
51260-203 = "저기요?! 선생님, 얼굴이 무서……."
51260-209 = "꺄아아앙?!"
51260-214 = "(축제의 시작에 맞춰 나타났던 기이한 괴물들과 그로 인해 벌어졌던 습격……)"
51260-215 = "(그 사건이 할퀴고 간 흔적은 분명 이곳저곳에 선명히 남았다.)"
51260-218 = "(하지만…… 그럼에도 축제는 무너지거나, 망가지거나 끝나지 않는다.)"
51260-222 = "아, 선생님. 어서 와."
51260-223 = "기다리고 있었어. 늦지 않게 도착했네."
51260-225 = "……안녕."
51260-226 = "[s] \"응, 오늘은 모처럼 백화요란으로서 순찰 활동을 하는 거지?\""
51260-228 = "맞아, 새로 태어난 우리 신생 백화요란의 기념비적인 첫 임무! 라고나 할까."
51260-229 = "그 역사적인 순간에 함께 하는 거니까, 선생님도 좀 더 기뻐하라구!"
51260-230 = "앞으로 수십, 수백 번을 계속 해야 할 텐데. 기운도 좋네. 렌게는."
51260-234 = "뭐?!"
51260-235 = "[s] \"잠깐, 두 사람 다 싸우지 말고…….\""
51260-236 = "수백 번이나 축제에 참가하면…… 용돈은 어떡하지……?"
51260-237 = "[s] \"놀란 건 그쪽의 문제였어?!\""
51260-238 = "아니, 이건 중요한 문제라고?! 선생님! 백귀야행의 축제는 엄청 무서우니까!"
51260-239 = "특히 그 마츠리부 부장이 여는 축제는 죄다 지갑을 노리는 함정투성이라 엄청 흉악하다고?!"
51260-241 = "아, 응……. 그래."
51260-242 = "[s] \"엄청나게 아무래도 좋다는 표정……! 저기, 그보다 유카리는……?\""
51260-244 = "아, 유카리라면……."
51260-249 = "저 카데노코지 유카리! 등장이어요!"
51260-251 = "앗! 유카리! 이제 왔냐!"
51260-252 = "……안녕. 유카리."
51260-253 = "그래서 집안일은, 잘 해결됐어?"
51260-255 = "네, 오늘 오전에 바로 저택으로 찾아가 사용인 여러분께 말씀드렸사와요."
51260-256 = "[s] \"응? 집안일? 말씀을 드렸다니, 무슨 의미…….\""
51260-257 = "네, 저 선언했사와요!"
51260-258 = "무녀 일은 아무래도 좋으니 때려치우겠다고!"
51260-260 = "오, 화끈하구만."
51260-261 = "정말…… 괜찮겠어?"
51260-262 = "………너무 홧김에 결정한 거 아니야?"
51260-263 = "아니, 두 사람 다. 아직도 그런 말을 하는 거야? 이럴 땐 유카리의 결정을 응원해 줘야지!"
51260-264 = "하지만……."
51260-266 = "홧김이 아니어요. 저도 몇 번이고 고민하고 또 고민했지만. 결론은 늘 한결같았으니까."
51260-267 = "소녀는 백화요란이 좋사와요. 그러니 어디까지나 백화요란으로서! 앞으로도 계속해서 노력하고 싶다고 생각한 것이어요."
51260-272 = "……그래."
51260-274 = "사용인 여러분께서도 저의 결심이 그러하다면, 어쩔 수 없다고 납득해 주셨답니다."
51260-275 = "[s] \"잘됐네.\""
51260-276 = "네! 그러니 오늘부터가 진정한 백화요란의 부활! 저, 유카리 전설의 시작이어요!"
51260-280 = "자, 그런 의미에서 이러고 있을 게 아니라. 어서 가도록 하여요! 선배님들! 선생님!"
51260-281 = "[s] \"응? 가다니?\""
51260-283 = "아, 그게 말이야."
51260-284 = "순찰 임무를 하기에 앞서, 이번 축제에서 가장 큰 행사를 백화요란 멤버끼리 미리 해두고 싶다. 라고 유카리가 말했거든."
51260-285 = "송구영신의 등불을 띄우는 이벤트, 라고 했었어."
51260-286 = "[s] \"등불 축제의 이벤트, 말이구나.\""
51260-288 = "네, 그러니! 가요! 다 같이!"
51260-293 = "(한 번 걸음을 멈추었던 축제는, 다시 시작된다.)"
51260-303 = "(망가진 건 고치고, 무너진 건 다시 바로 세우면 된다.)"
51260-304 = "(눈앞에선 천천히, 느릿하지만 그것을 위해 다가가는 네 명의 소녀들이 있다.)"
51260-317 = "오른팔은, 여전하지만……"
51260-318 = "그래도 아야메, 나는, 이 아이들과 함께───"
51260-325 = "(그렇게 각자의 바람을 담아 등불을 떠나보낸다.)"
51260-326 = "(서로의 가슴에 품은 것, 앞으로 미래를 그리며 바라는 것을 담아.)"
51260-327 = "(모두의 소망을 담은 등불은, 그렇게 흘러간다.)"
51260-328 = "(언제까지고 계속해서.)"
51260-343 = "우와아아앙~~ 코쿠리코 니이이임~~~"
51260-349 = "슈로, 돌아왔구나."
51260-350 = "저…… 그렇게나 노력했는데! 열심히 힘을 냈는데……!"
51260-351 = "결국 백물어를 만들지 못해서………!"
51260-352 = "죄송해요오오오~~!!!"
51260-353 = "코쿠리코 님께서 잔뜩 기대해 주셨는데!"
51260-354 = "후후, 귀여운 녀석………"
51260-355 = "아니, 그거라면 신경 쓰지 말려무나."
51260-356 = "백물어는 만들지 못했어도…… 무사히 <20년 전의 축제를 재현하는 것>은 성공했지 않느냐."
51260-358 = "훌쩍…… 정말, 그걸로 괜찮은 건가요?"
51260-359 = "아무렴……."
51260-360 = "완성된 축제는 그 자체로 상징을 가지고 또 다른 이야기의 씨앗을 품는 법."
51260-361 = "그렇다면 그걸로 충분한 일일 테지."
51260-363 = "그저 다음번에야말로 완성하면 될 일이니까."
51260-367 = "그래……… 그러니 차근차근, 함께 완성하도록 하자꾸나."
51260-368 = "세상을 불태울 우리만의 풍문을."
