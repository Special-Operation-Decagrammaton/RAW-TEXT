[translation]
10010030-1 = "제3화;슬럼성의 전투 1"
10010030-6 = "(우이의 말을 따라, 가장 먼저 미라클 5000 케이크를 얻기 위해 솔루트 강변으로 향했다.)"
10010030-13 = "(하지만 강변에는 어째서인지 웅성거리는 사람들만 있을 뿐이었다.)"
10010030-14 = "……뭐? 그럼 이제 어떻게 해?"
10010030-15 = "어떻게 하긴 뭘 어떻게 해. 정의실현부가 해결해줄 때까지 기다려야지."
10010030-16 = "해결해 주기는 할까……? 이미 거긴 트리니티 밖이잖아……."
10010030-17 = "음…… 듣고 보니 그런 거 같기도……. 아으, 큰일이네, 진짜! 벌써 5일째라고!"
10010030-18 = "[s] \"……?\""
10010030-20 = "……선생님? 이건 무슨 상황일까요……? 모두들 표정들이 그리 밝아 보이시진 않는데……."
10010030-21 = "……어라, 선생님?"
10010030-22 = "선생님이 여긴 어쩐 일이야?"
10010030-23 = "……음? 누군가 알아보시는 분이……."
10010030-28 = "……어라? 옆에 이 사람은 누구……?"
10010030-29 = "성당의 시스터님이시잖아. 보면 모르겠냐."
10010030-30 = "아니, 그……. 야. 설마 내가 진짜 그걸 몰라서 물은 거라고 생각하는 건 아니겠지?"
10010030-31 = "…………."
10010030-32 = "……왜 말이 없어?"
10010030-33 = "고민 중이었는데."
10010030-35 = "고민할 게 어딨어!!!"
10010030-37 = "아하하……. 아, 안녕하세요. 시스터후드의 히나타라고 합니다."
10010030-38 = "사정이 좀 있어서……. 여기로 오면 미라클 5000이라는 이름의 케이크를 구할 수 있다고 들었거든요……."
10010030-40 = "미라클 5000 케이크? 시스터님도 그걸 구하러 오셨던 거군요? 저희도 그걸 구하러 와 있던 건데!"
10010030-41 = "으음……. 슬프게도 구하지는 못하게 됐지만요……."
10010030-42 = "……네? 그건 어째서인가요? 혹시 이미 다 팔려서……?"
10010030-43 = "아뇨, 그런 이유는 아니고……. 그게……."
10010030-44 = "뒤틀린 자본주의적 타락의 희생양으로 지목돼 버렸기 때문이죠."
10010030-46 = "……미라클 5000도, 그리고 우리도."
10010030-47 = "[s1] \"뒤틀린 자본주의의 희생양?\"\n[s2] 어떤 일이 있었는지 물어본다."
10010030-48 = "흠……. 뭐, 사실 그리 복잡한 이야기는 아니야."
10010030-49 = "흠……. 뭐, 사실 그리 복잡한 이야기는 아니야."
10010030-50 = "아주 귀한 한정판 케이크가 있고, 모두가 그걸 얻고 싶어 하면, 당연히 가치가 오르겠지."
10010030-51 = "그러다 보면 어느샌가, 누군가는, 케이크가 아닌 케이크의 '가치'에 매몰되기 시작하고……."
10010030-52 = "결국 넘지 말아야 할 선을 넘게 되는 것. 그저 그런 이야기."
10010030-53 = "……? 으음……? 죄, 죄송합니다. 무슨 말씀이신지 이해가 잘……."
10010030-54 = "……하아. 이 녀석 말은 원래 그러니 이해해 주세요. 저희가 죄송합니다."
10010030-55 = "그냥 미라클 5000을 되팔아서 수익을 남기기 위해, 누군가 매점매석을 해버렸단 뜻이었어요."
10010030-56 = "게다가 더 만들지 못하도록 케이크 만드는 트럭과 주인아저씨까지 납치해 가 버렸죠."
10010030-57 = "이제 그 케이크를 먹고 싶으면, 슬럼가로 가서 말도 안 되는 가격을 내야만 해요."
10010030-58 = "그, 그런……. 그러면 안 되잖아요? 음식은 모두가 즐겁게 나눠 먹어야 하는 거잖아요?"
10010030-59 = "뭐, 애초에 한정판인 시점에서 '모두'는 어렵다고 봐야 하지만……."
10010030-60 = "그치만 그렇다 쳐도, 아무리 그래도 먹기 위해서가 아니라 '되팔기 위해서' 이런 짓을 한다는 건 용납하기 어려운 일이야."
10010030-61 = "이건 케이크에 대한 모욕이라고, 모욕! 절대로 용서 못 해!!"
10010030-63 = "아무튼 그래서 어떻게 할지 '미라클 5000을 사랑하는 채널'의 사람들끼리 모여서 고민 중이었어요."
10010030-64 = "[s3] \"확실히 곤란하겠네.\"\n[s4] \"이 많은 사람들이 전부……?\""
10010030-69 = "뭐, 그치만 사실 고민만으로 일들이 다 해결된다면 세상만사 비극이란 건 없을 테니까."
10010030-70 = "저쪽은 어차피 대화가 통하지 않고……. 우리가 이렇게 앉아서 생각해 봐야 달라지는 건……."
10010030-71 = "맞아. 애초에 저쪽이 트럭을 슬럼가 건물 안에 가둬 놓고 일대를 봉쇄해버린 이상, 다른 수가 없어."
10010030-72 = "건물들은 이미 전부 요새화됐고……. 조직화된 군대나 정의실현부라면 모를까, 우리끼린 도저히……."
10010030-73 = "……잠깐. 아니."
10010030-74 = "……어라."
10010030-78 = "……어쩌면 이 일……. 조금 전 이미 해결돼 있던 것일지도 몰라."
10010030-79 = "……엉?"
10010030-80 = "갑자기 그게 대체 무슨 소리야? 해결됐다니?"
10010030-81 = "……그래. 역시 맞아. 해결됐어. 이렇게 이미 모든 준비가 갖춰져 있으니 말이지."
10010030-83 = "……힘이……. 즉, '군대'가 말야!"
10010030-84 = "……?"
10010030-85 = "……나츠 쨩……? 구, 군대라니……? 무슨 군대……?"
10010030-87 = "아이리. 조직화된 군대에 필요한 게 뭐라고 생각해?"
10010030-88 = "으, 또 퀴즈 말투……."
10010030-89 = "그, 글쎄……? 총이랑 싸울 사람들이랑……. 또……. 가능하면 탱크……? 박격포……?"
10010030-91 = "……지휘관."
10010030-92 = "……그렇군. 이해했다. 그런 이야기군."
10010030-93 = "……지휘관……?"
10010030-94 = "……아."
10010030-95 = "[s5] \"지금 그 말, 혹시…….\"\n[s6] \"……내 이야기야?\""
10010030-96 = "……훗. 역시 통찰력이 뛰어나시군요, '커맨더'."
10010030-97 = "……훗. 역시 통찰력이 뛰어나시군요, '커맨더'."
10010030-98 = "저희를 이끌어 기적을 해방시키고 모두에게 달콤한 은총이 전파되도록 도와주십시오."
10010030-99 = "……라고 하면 되겠지? 선생님?"
10010030-100 = "[s7] \"그야, 나는 괜찮지만…….\"\n[s8] \"……히나타는 어때? 괜찮아?\""
10010030-107 = "저, 저는 신경 쓰지 말아 주세요! 그야 곤란한 일이 있으면 도와드리는 게 당연하죠!"
10010030-108 = "그 케이크는 물론 저희도 필요한 거지만……. 그렇다고 곤란에 처한 분들을 못 본 채 넘어갈 순 없다고 생각해요."
10010030-109 = "저, 저도 도울게요! 돕게 해 주세요!"
10010030-110 = "좋아! 아주 좋아, 아주 내 취향으로 마음에 딱 들어!!"
10010030-111 = "다들 들었지!? 이렇게 된 이상 전면전이다!! 정면으로 뚫어버리는 거야!"
10010030-112 = "출발하자고!!"
10010030-116 = "우리는 더 이상 매점매석의 노예가 되지 않는다! 우리는 디저트의 주인이 될 것이다!!"
10010030-117 = "어디서 많이 듣던 대사인데……."
10010030-118 = "돌격 앞으로!!"
10010030-124 = "……."
10010030-125 = "와, 와아……! 와아아아……!?"
10010030-131 = "이야……. 이거 진짜 확실하구만. 왜 진작 이 방법을 쓰지 않았던 거지?"
10010030-132 = "오늘은 얼마나 팔았어? 근데 진짜 그 가격에도 산단 말이야? 이 케이크를?"
10010030-133 = "뭐, 안 먹고는 못 배기겠다잖아. 우리로서는 좋은 일이지만 말이지. 크크……."
10010030-134 = "게다가 상대가 트리니티 쪽이라서 그런지, 돈 좀 있는 아가씨들도 많더라고."
10010030-135 = "여태 해본 장사 중 가장 수지맞는 장사인 거 같네. 이러다 우리 부자 되는 거 아냐?"
10010030-139 = "……가만. 누군가 온다."
10010030-144 = "……."
10010030-145 = "무슨 일이냐? 너도 미라클 5000을 사러 왔나?"
10010030-146 = "여기까지 스스로 찾아온 걸 보니 대충 상황은 알고 있을 테고……. 돈은 얼마나 있지?"
10010030-147 = "돈……. 돈이라……."
10010030-148 = "그래. 돈. 말해 두겠지만, 흥정 같은 건 없으니까 말이야. 가격은 전적으로 우리 쪽에서 제시를……."
10010030-153 = "……?"
10010030-154 = "……총알이면 되겠나?"
10010030-158 = "으, 으으……!?"
10010030-163 = "……!? 무, 무슨 짓을……!?"
10010030-164 = "이 자식이! 지금 해 보자는 거야? 혼자서?"
10010030-165 = "……아니! 나는 혼자가 아니다!"
10010030-171 = "케이크를 사랑하는 모든 학우들이여! 앞으로-!!!"
