[translation]
1600202-1 = "제 설명을 들어요!"
1600202-2 = "(……어디선가 소란스러운 웅성거림이 들려온다.)"
1600202-3 = "으으…… 더는 무리야…… 그만 보내줘……!"
1600202-4 = "내 머리는…… 아니 귀부터 이미 과부하야……! 도움……! 도움!!"
1600202-5 = "[s] \"……?\""
1600202-6 = "아, 서, 선생님! 선생님이다!"
1600202-7 = "마침 잘 됐어요, 어떻게 좀 해주세요, 선생님! 저와 자리 교체를!!"
1600202-8 = "……잠깐! 어딜 가는 거예요? 아직 한참 멀었다고요! 이제 겨우 시작인 걸요!"
1600202-9 = "히이이이익-!!"
1600202-10 = "우리가 잘못했어, 뭘 잘못했는 진 모르지만 용서해줘!"
1600202-11 = "용서라뇨? 무지는 죄가 아니에요! 물론 죄로 이어질 수 있는 위험한 것이긴 하지만……"
1600202-12 = "물론 그러니 더더욱 평상시에도 무지를 경계하고 하나라도 더 알려는 태도가 중요하지요!"
1600202-13 = "자, 하던 말을 계속 이어서! 통조림의 제조과정은 말이죠. 원래 통조림은 캔이 아니라 병에서 시작된 군사적인 음식물 보관 방식으로, 이후 경쟁을 위해 다른 곳에서……"
1600202-14 = "그래서 병조림의 역사가 끝나고 철로 된 통조림의 시대가 펼쳐지기 시작했는데, 이때부터 어째서 다른 납작한 고기 통조림들과 달리 콘비프 통조림만 사다리꼴이냐 하면……"
1600202-15 = "으아아아아아아-!!"
1600202-16 = "[s] \"콘비프 통조림?\""
1600202-17 = "……! 아, 선생님! 안녕하세요!"
1600202-18 = "네? 무슨 일이냐고요? ……무슨 일이요? 아무 일도 없는데요?"
1600202-19 = "그냥 이분들이 '왜 콘비프 통조림은 사다리꼴 모양이냐'고 물으셔서 간단하게……"
1600202-20 = "가, 간단하게!? 이게 간단하게라고!? 벌써 2시간째인데……!!"
1600202-21 = "콘비프를 담은 통조림의 원재료인 알루미늄의 채굴 역사와 광부들의 기술까지 올라갔잖아!!"
1600202-22 = "그거야 당연하죠! 뭐든지 겉핥기로 부분적인 것만 이해해선 안 된다고요."
1600202-23 = "본질적인 이유와 원인을 파악해야 뒷부분을 들어도 제대로 이해가 가는 법이에요!"
1600202-24 = "아무리 그래도 원재료의 기원까지 알 필요는 없지 않아!?"
1600202-25 = "맞아! 우린 그저 모양새를 그렇게 만드는 이유가 궁금했을 뿐이라고!"
1600202-26 = "……!!"
1600202-27 = "……헉."
1600202-28 = "바, 방금 우리 뭔가 대단히 말을 잘 못 한 거 같은데……"
1600202-29 = "그렇군요! 보다 과학적인 이유가 궁금하셨던 거군요? 아~ 그거라면 또 제 전문 분야죠!"
1600202-30 = "그럼 일단 통조림의 원재료에 어째서 알루미늄을 사용하는지부터 시작하는 좋겠네요. 다들 잘 알고 계시듯이 알루미늄이란 주기율표에서 원자번호 13번으로 생각되는 금속으로……"
1600202-31 = "기존에 사용하던 일반 철에 비해서 반응성과 표면의 부동화 현상으로 인해 외부 환경으로부터 큰 저항성을 가지게 되니까……"
1600202-32 = "히익, 그만! 그만!! 으아아아아아!!"
1600202-33 = "트라우마 생길 것 같아, 당분간 콘비프는 못먹어어어어!!"
1600202-35 = "자, 잠깐! 어딜 가는 거예요! 기다려요! 기다리라니까요!"
1600202-36 = "……"
1600202-37 = "……으음…… 모두 가버렸네요. 정작 중요한 내용은 아직 들려주지도 못했는데……"
1600202-38 = "왜 다들 지식을 얻는 것에 대해 거부감을 가지는 걸까요. 모르던 걸 알면 기쁘지 않나?"
1600202-39 = "선생님은 이해해주실 거죠? 선생님이시잖아요?"
1600202-40 = "[s1] \"물론이지. 무지는 죄악이다!\"\n[s2] \"우선 상대의 수준에 맞추는 게 중요하지.\""
1600202-41 = "역시 선생님! 세상의 무지를 타파하는 최전선에 계신 분!"
1600202-42 = "대단해요! 저는 늘 선생님을 존경하고 있답니다! 특히……"
1600202-43 = "……! 그, 그런가요? 으음. 확실히 그건 그렇지만……"
1600202-44 = "저로서는 오히려 그렇기 때문에 더 기본적인 부분부터 설명하려고 했던 거였는데……"
1600202-45 = "……"
1600202-46 = "[s] \"……코토리?\""
1600202-47 = "그러고 보니 선생님께선 항상 다른 학생들의 질문을 받곤 하셨었죠……"
1600202-48 = "먼저 말하지 않아도, 다른 사람들이 스스로 여쭤보러 가는 사람!"
1600202-49 = "대체 어떻게 하면 그럴 수 있는 건가요!? 어떻게 하면 저도 그렇게 될 수 있죠!?"
1600202-50 = "멋져요! 꿈이에요! 저도 언젠가는 그런 사람이 됐으면 좋겠다고 생각해요!"
1600202-51 = "언젠가는 넓은 강당에, 사람들을 한가득 모아두고 강연을……!"
1600202-53 = "……아."
1600202-54 = "조, 조금 시끄러웠으려나요. 하하……"
1600202-55 = "……네? 제가 정말로 설명하는 걸 좋아하는 것 같다고요?"
1600202-56 = "음~. 네에…… 맞는 말이기도 하고 약간 다르기도 하고……"
1600202-57 = "기본적으로 좋아하는 건 맞는데……"
1600202-58 = "정확히는 설명하고 난 뒤에, 그것을 이해한 사람이 즐거워하는 걸 보는 게 좋달까……"
1600202-59 = "제가 설명한 걸 이해한 사람과, 그것에 대해 같이 이야기할 수 있게 되는 것이 좋달까……"
1600202-60 = "……뭔가 설명하는 건 좋아하는데, 막상 또 이런 쪽 설명은 잘 안 되네요."
1600202-61 = "으음…… 혹시 너무 수다쟁이같이 보이나요?"
1600202-62 = "[s3] \"대화가 많은 건 좋은 거지.\"\n[s4] \"병아리 같고 귀엽다고 생각해.\""
1600202-63 = "그, 그렇죠? 역시 그렇겠죠?"
1600202-64 = "(다, 다행이다…… 이상하게 생각하진 않으시는구나……)"
1600202-65 = "벼, 병아리……? 그, 그런가요……?"
1600202-66 = "(여기서 귀엽다는 말을 들을 줄은 상상도 못했어요……!)"
1600202-67 = "다행이네요. 혹시라도 안 좋게 보일까 봐 걱정했는데……"
1600202-68 = "역시 선생님께서는 다 이해해 주시는군요! 기뻐요!!"
1600202-69 = "헤헤."
1600202-70 = "……"
1600202-71 = "[s] \"……코토리?\""
1600202-72 = "그러고 보니 '이해'라는 표현이 나와서 말인데……"
1600202-73 = "인간이 뭔가를 이해한다는 건 기본적으로 자기 자신에 대한 자각이 전제되는 것이고……"
1600202-74 = "자각이란 건 자신의 행동이나 감정, 판단한 결정 등을 외부로부터 구별하는 거잖아요?"
1600202-75 = "그러니까 어떻게 보면 자기 자신을 외부와 격리시키는 그런 행위가, 오히려 다른 것들을 받아들일 수 있게 해준다는 점이 흥미로운 관점으로서……"
1600202-78 = "……선생님?"
1600202-79 = "어라? 선생님?"
1600202-83 = "……화장실 가셨나?"
