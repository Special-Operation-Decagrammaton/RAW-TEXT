[translation]
34080-1 = "제8화;스쿼드의 재합류"
34080-6 = "어……?! 저, 저기!!"
34080-14 = "크, 크아아악?!"
34080-19 = "히요리! 괜찮아?!"
34080-25 = "리, 리더……."
34080-26 = "제가 어떻게 여기 숨어 있는 걸 알고……."
34080-27 = "[s] \"무사했구나, 히요리, 다행이야.\""
34080-28 = "……."
34080-29 = "……………………."
34080-30 = "……?! 네? 네에?!"
34080-31 = "샤, 샬레의 선생님?! 어째서 리더와 같이 있는 거죠……?!"
34080-32 = "그건……."
34080-33 = "드, 드디어 이렇게 된 건가요? 천벌의 시간인가요? 과연…… 이라고 할까, 역시나, 라고 할까, 결론은 망했다는 거네요!"
34080-34 = "그러네요, 진짜 그러네요. 생각해보니까 선생님은 우리를 아리우스에게 뺏기는 게 싫겠네요. 그야, 처벌은 본인 손으로 하고 싶을 거니까……."
34080-35 = "그래서 아리우스보다 먼저 우리를 잡으러 온 거예요! 우리를 샬레에 있다는 그 지하 감옥에 집어넣으려고요! 거긴 샬레에 대적했던 아이들의 비명으로 가득 차 있다던데……."
34080-36 = "[s] \"…….\""
34080-37 = "으아아앙-! 망했어요, 완전 망했네요. 이런 결말일 줄 알았으면 좀 더 하고 싶은 걸 마음껏 해둘걸! 보고 싶은 잡지도 아직 많이 있는데!"
34080-38 = "……."
34080-39 = "……아니, 그렇다고 해도 리더가 선생님과 같이 있는 건 설명이 안 되는데요? 그건 어째서일까요? 무슨 이유로? 아아, 그러네요. 이해했어요."
34080-40 = "히요리……."
34080-41 = "리더는 샬레의 선생님에게 협박당하고 있는 거였군요?! 정말이지 리더도 고통뿐인 인생이네요! 그러고 보면 엄청 괴로운 표정이네요? 그러네요, 저는 언제나 짐짝밖에 되지 않으니……."
34080-42 = "[s] \"히요리. 구하러 왔어.\""
34080-43 = "……."
34080-44 = "……네? 네? 저를요? 왜요? 어째서요?"
34080-45 = "기억 상실 같은 건가요? 저희가 누군지 모르는 거 아닌가요? 그야, 구하러 왔다는 말을 들으니 막 눈물이 날 것 같지만…… 잘 이해가 안 되는데요?!"
34080-46 = "선생의 말이 맞아. 히요리. <샬레>의 선생이 우리를 도와주기로 했어."
34080-47 = "……?!"
34080-48 = "[s] \"사정은 들었어. 아츠코를 구하러 가자.\""
34080-54 = "공주님……. 그러네요. 아츠코 쨩이……."
34080-55 = "저희가…… 구할 수 있을까요……? 공주님을……? <그녀>에게서……."
34080-56 = "저는……."
34080-60 = "리더의 위치를 알려주면…… 아리우스 자치구로 돌아갈 수 있게 해주겠다는 제안을 받았었어요."
34080-62 = "……!"
34080-63 = "저는 오래전부터 리더가 시키는 대로만 했을 뿐이고…… 정상 참작의 여지가 있는 편이라고 해서……. 헤헤……"
34080-64 = "……그런가."
34080-65 = "그렇군……. 그렇다면 그렇게 해. 히요리."
34080-66 = "……네? 네?"
34080-67 = "내 위치를 말하고, 그대로 자치구로 돌아가서 어딘가 숨어 있도록 해."
34080-68 = "나는 나대로 아츠코를 구하기 위해 최선을 다할 테니까. 그거라면 너에게 폐를 끼치지 않겠지."
34080-69 = "네?! 저, 저는……."
34080-70 = "아아. 언젠간 이렇게 될지도 모른다고 생각하고 있었어. 그동안 넌 내 억지에 어울려 줬을 뿐이니까……."
34080-71 = "이, 이미 거절했는데요…… 그 제안……."
34080-75 = "뭐, 뭔가 갑자기 비극적인 무드가 되어버렸는데요? 완전 망했는데요? 뭐죠? 그 배신자를 이해한다는 듯한 얼굴은? 그런 이미지인가요? 저는?"
34080-76 = "그야, 당연히 그 말이 진짜인지도 알 수 없고, 이미 우리는 한배를 탄 운명 같은 거라서…… 저 혼자 자치구로 돌아간다고 해도 전혀 좋지도 않을 거고……."
34080-77 = "게다가…… 그렇게 된다고 해도 아츠코 쨩은……."
34080-78 = "다, 당연히 아츠코 쨩을, 공주님을 구할 수 있다면…… 그 편이 좋다고 생각해요……."
34080-82 = "그건 리더도 마찬가지잖아요? 그래서 절 구하러 온 거 아닌가요?"
34080-86 = "……. 그래. 맞아."
34080-87 = "그럼 미사키를 찾아야 해. 자세한 이야기는 다 같이 모여서 하자."
34080-88 = "……그러네요. 미사키 씨라면 지금 이 상황을 좀 더 잘 설명해 줄지도 모르고……. 알겠어요."
34080-89 = "미사키 씨라면……. 대충 어디에 있을지 짐작 가는 데가 있어요."
34080-90 = "음. 어쩌면 거기라면……."
34080-91 = "[s] \"그래? 그럼 바로 출발하자.\""
34080-92 = "네, 네……!"
34080-94 = "폐쇄된 채 방치된 낡은 다리"
34080-96 = "……."
34080-97 = "여기라면……."
34080-98 = "[s] \"아찔한 높이네…….\""
34080-99 = "맞아. 그리고 아래에는 수심 5m 이상 되는 강이 흐르고 있지."
34080-101 = "유속도 빠르기 때문에 떨어질 때의 충격으로 정신을 잃는다면……. 그대로 어둠 속에 잠겨 사라지겠지."
34080-102 = "미사키."
34080-103 = "미, 미사키 씨……."
34080-104 = "리더. 히요리. ……그리고, <샬레>의 선생님인가……."
34080-105 = "그런가……. 그렇게 된 거구나. 리더."
34080-106 = "설마 리더가 그런 행동을…… 게다가 그걸 또 선생님은 받아들인 건가……."
34080-107 = "이런 게 가능할 거라고도 생각하지 못했어. 리더도, 선생님도……. 아무것도 예측할 수 없구나."
34080-108 = "하지만 알고 있어? 샬레의 선생님?"
34080-109 = "우리는 선생님을 죽이면 아리우스 자치구로 돌아올 수 있게 해주겠다는 제안을 받았어."
34080-110 = "[s] \"…….\""
34080-111 = "거기 서 있는 히요리도, 리더도 똑같은 이야기를 들었어. 그렇지?"
34080-112 = "제, 제가 들었던 제안은 조금 달랐지만……."
34080-113 = "……맞아. 그런 얘기를 들었어. 선생을 처리하면 우리들의 배신을 용서해 주겠다고."
34080-114 = "……언제 뒤에서 방아쇠를 당길지 모르는 사람을 선생님은 믿을 수 있는 거야?"
34080-115 = "게다가 이미 한번 쏜 적도 있는 사람을?"
34080-116 = "……."
34080-117 = "[s] \"사오리가 그러려고 했다면 이미 진작에 기회가 있었을 거야.\""
34080-118 = "……그런가."
34080-119 = "하지만, 그런다고 해서 달라질 건 없어."
34080-123 = "[ns] \"미사키……? 그 난간에 너무 가까운 거 같은데……?\""
34080-125 = "미, 미사키 씨……?"
34080-126 = "공주님을 구하는 건 불가능해."
34080-127 = "아리우스 자치구에 숨어들어서, 자치구의 모든 병력을 상대하면서 공주님이 잡혀 있는 바실리카까지 도달한다?"
34080-128 = "게다가 <그녀>에겐 이미 우리조차 모르는 무기들도 준비돼 있겠지."
34080-129 = "그런 걸 우리 셋이서 해낼 수 있을 리가 없어. 아무리 어른의 도움이 있다고 해도 불가능해."
34080-130 = "게다가 그렇게 아츠코를 구하는데 성공한다고 해도, 거기에 무슨 의미가 있지?"
34080-131 = "그저 이 무의미하고 고통스러운 삶이 연장될 뿐이잖아."
34080-132 = "……."
34080-133 = "고통뿐이었던 공주님의 삶에 그저 고통을 더할 뿐…… 거기에 가치가 있는 거야?"
34080-134 = "[ruby=vanitas vanitatum]헛되고 헛되도다[/ruby]…… 오직 그것만이 우리가 납득할 수 있는 진실."
34080-135 = "그렇지 않아, 리더?"
34080-136 = "……."
34080-137 = "아니면, 선생님? 어른인 당신은 여기에 답을 알고 있어?"
34080-138 = "[s] \"잠깐만……. 위, 위험해. 더 움직이면…….\""
34080-142 = "입 닥쳐. 미사키."
34080-143 = "……."
34080-144 = "그래서? 고통뿐인 네 삶도 안식을 더하고 싶다는 건가? 그딴 식의 협박이 나에게 통할 거 같아?"
34080-145 = "……."
34080-146 = "잘 들어라. 미사키. 네가 거기서 뛰어내린다면, 나는 곧바로 이렇게 할 거다."
34080-147 = "먼저 코트를 벗고 곧바로 너를 따라 다리 아래로 뛰어들 거야. 거기까지 2초도 걸리지 않아."
34080-148 = "또 코트 주머니에 돌멩이 따위를 넣어뒀겠지. 상관없어. 거추장스러운 옷은 칼로 찢어서 밖으로 끌고 올라와 주겠어."
34080-149 = "거기까지 길어야 20초. 만약에 네가 정신을 잃었다면 몇 번이고 몇 번이고 CPR을 반복해주지."
34080-150 = "넌 내 앞에서 그딴 수작을 부릴 수 없어. 미사키."
34080-151 = "몇 번이나 해봤자 마찬가지였으면서. 그래, 이번에는 성공할 수 있을 것 같나?"
34080-152 = "……."
34080-153 = "(바들바들)"
34080-154 = "……아니. 자신 없어."
34080-159 = "……. 그래서, 결국 공주님을 구하겠다는 거구나."
34080-160 = "알겠어. 리더의 명령이라면 이미 몇 번이나 충실히 수행해 왔으니까, 그 끝이 예정되어 있다고 해도 어차피 달라질 건 없겠지."
34080-161 = "이번에도 그 끝까지 함께 할게. 리더."
34080-162 = "……. 그래. 이번에도 부탁하지."
34080-163 = "하아아……. 다행이에요……."
34080-164 = "결정했다면 서두르자. 남은 시간은 약 90분뿐이야. 그때까지 입구에 도착해야 해."
34080-165 = "……그렇군. 자정까지 한 시간 반……. 빠르게 움직여야겠군. 선생님."
34080-166 = "설명은 가면서 할 테니 일단 출발하자."
34080-167 = "……."
34080-168 = "네, 그, 그럼…… 이쪽이에요!"
34080-169 = "[ns] \"알겠어.\""
34080-174 = "다음화;아리우스 자치구로 1"
