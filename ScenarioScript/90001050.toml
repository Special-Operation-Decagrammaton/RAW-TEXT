[translation]
90001050-1 = "제5화;변수"
90001050-10 = "뭐야, 경보음?"
90001050-11 = "게부라에게서 다시 연락…… 어라라?"
90001050-12 = "게, 게부라 쨩이 패배했다고요?!"
90001050-13 = "흐으음. 다음 절차는 역시, 플랜 B로?"
90001050-14 = "그래. 이견 없어. 플랜 B로 이행하자. 게부라의 의사를 존중하는 의미에서라도."
90001050-15 = "겨, 결국 그곳으로 유인해야 하는 건가요……."
90001050-16 = "그래도 게부라는 마지막까지 적들을 원하는 방향으로 유도할 수 있도록 구멍을 파둔 모양이야."
90001050-17 = "역시 게부라는 치밀하고 성실하네! 근본적으로는 뜨겁지만!"
90001050-18 = "나머지 로그를 마저 분석해 보죠. 어라? 잠시만요. 뭔가 새로운 변수가 나타난 것 같은데……"
90001050-19 = "이름이……. 이렇게 읽는 거 맞나? 츠카츠키 리오……?"
90001050-20 = "츠, 츠카츠키 리오?!"
90001050-21 = "이건 조금…… 귀찮은 상대가 나타났네. 아니, 예상하고 있어야 했던 일이었으려나."
90001050-22 = "왜 이제 와서 모습을 드러낸 걸까요? 아뇨, 아뇨, 아뇨. 그것도 어떻게 보면 무의미한 질문이겠군요."
90001050-23 = "그, 그래요……. 애초에 그분의 존재를 처음 인지하고, 감히 그 뒤를 쫓으려 했던 것은 이 사람이었죠……."
90001050-24 = "그렇지만 이 사태에는 조금, 대비책을 생각해 둬야 할 것 같아."
90001050-25 = "새로운 변수의 합류, 우리가 그들을 유인하려는 곳, 그리고 우리가 확보 중인 것들을 고려해 보면……."
90001050-26 = "이야기를 축약하자면 이런 거지. 무시하기 힘든 새로운 변수가 나타났고, 그럼에도 작전대로 진행할 것인가? 하는 거."
90001050-27 = "어, 어떻게 하죠. 소프……?"
90001050-28 = "그래. 결정해야 할 시간인 거네. 알겠어."
90001050-33 = "작전은, 예정대로 진행하자고."
90001050-35 = "……역시 그렇게 되는군요. 뭐, 알고 있었지만요."
90001050-36 = "괘, 괘괘괘괘, 괜찮을, 까요?! 그, 츠카츠키 리오는……!"
90001050-37 = "맞아. 그 여자는 상당한 변수지. 그 점은 인정해야 해. 그렇지만 동시에……."
90001050-38 = "도, 동시에……?"
90001050-39 = "그 아이라면, 분명 할 수 있을 거예요! 그렇지 않나요, 아인?"
90001050-40 = "네, 네에? 저요?"
90001050-41 = "왜냐하면, 그 아이는 무적이니까. 그렇지?"
90001050-42 = "……!"
90001050-43 = "그, 그래요! 맞아요! 그 아이는 말 그대로 무적이니까요!"
90001050-44 = "거기에 그 지역으로 진입하게 되면, 츠카츠키 리오는 자연적으로 배제될 테고 말이죠?"
90001050-45 = "아……! 그렇네요! 츠카츠키 리오는 원격 통신으로만 소통하고 있으니까요!"
90001050-46 = "그래. 그리고 나는 한 가지 더, 이 시점에서 우리가 새로운 난적이라는 변수의 진폭을 관찰해야 한다고 생각해."
90001050-47 = "……츠카츠키 리오. 이전, 그 금지된 기술에 분수를 모르고 손을 대려 했던 자였지."
90001050-48 = "저, 정보로는, 알고 있었지만……."
90001050-49 = "거기에 그 <초현상특무부>라는 동아리까지 만들어서, 그분을 귀찮게 하려 했죠. 뭐, 실행한 것은 아케보시 히마리 쪽이었지만요."
90001050-50 = "그리고 이제 와서, 여기에 모습을 드러냈다 이거고. 지금까지 철저하리만치 자신의 위치를 노출하지 않고, 그늘 속에서 움직이고 있었는데."
90001050-51 = "그런 사람이, 이, 이제 와서 전면으로 나섰다는, 것은……."
90001050-52 = "응. 어쩌면 저 선생님과의 합류를, 어느 순간부터 노리고 있었던 것일 수도 있지."
90001050-53 = "이것도~ 저것도~ 모두 소프의 추측일 뿐이지만요~"
90001050-54 = "조용히 좀 해라……."
90001050-55 = "아무튼, 우리는 츠카츠키 리오라는 변수가 저 '선생님'에 준하는 변수일지."
90001050-56 = "아니면 그보다는 영향력이 적은, 간과할 수 있을 변수일지를 면밀히 관찰해야 한다고 봐."
90001050-60 = "즉, 소프의 말은……."
90001050-61 = "새로운 변수의 진폭을 가늠하는 동시에, 그 아이를 통해 적들을 모두 말소하자는 계획인 거군요?"
90001050-63 = "맞아. 그런 거야."
90001050-64 = "그, 그렇지만…… 정말 괜찮은, 걸까요……? 그 아이를 만나게 되면, 아무리 저 사람들이라고 해도……."
90001050-65 = "죽어, 버릴 텐데……?"
90001050-66 = "응……. 그건 확실히 복잡한 문제지."
90001050-67 = "우린 아직 누군가를 해친 적도 없고, 그러고 싶지도 않고, 그런 생각을 해 본 적도 없으니까……."
90001050-71 = "솔직하게 말하자면 나도 아직은, 조금은……."
90001050-72 = "……."
90001050-73 = "아인. 소프. 저는, 우리가 그걸 감내해야 한다고 생각해요."
90001050-75 = "후엣?!"
90001050-76 = "……."
90001050-78 = "그렇잖아요? 그럴 각오가 없었다면, 저 사람들을 굳이 빙해까지 유인하지도 않았을 거예요."
90001050-79 = "이미 '죽어주세요' 라고 이야기를 해 버리기도 했고요."
90001050-80 = "그, 그그그그, 그건 그냥 기세를 타고 해 본 말이 아니었나요?!"
90001050-81 = "어, 응. 그건 나도 그럴 거라고 생각했었어……."
90001050-82 = "둘 다, 마음을 굳게 먹어야 해요. 우리는 언니를 지켜야 하니까요."
90001050-87 = "하지만……."
90001050-88 = "알아, 아인. 안다고. 우리가 이 일을 계획한 건…… 분명 그렇게 되지 않기 위해서였지."
90001050-89 = "하지만 어떻게 생각해 보면, 먼저 우리 쪽 영역에 멋대로 발을 들인 건, 저 선생님의 일행 쪽이었잖아?"
90001050-90 = "……."
90001050-91 = "네. 알겠, 어요……."
90001050-92 = "저도, 지지 않도록, 각오를…… 다져야 하겠네요……."
90001050-93 = "……."
90001050-98 = "괜찮아. 다 잘될 거야."
90001050-99 = "네, 네에……!"
90001050-101 = "뭐어~ 아무 근거 없이 막연하게 잘될 거라는 말만큼, 무책임한 말도 없겠지만요~"
90001050-102 = "히, 히이이이이잉?!?!"
90001050-103 = "오르!"
90001050-104 = "미안해요, 미안해요. 아인은 뭐라고 해야 하나, 반응이 다채로워서 여러 가지 변수를 실험해 보고 싶단 말이죠."
90001050-105 = "호오…… 마침 나도 네 논리 회로의 내구성 테스트를 실험해 보고 싶어졌는데. 한 번 시도해 봐도 괜찮으려나?"
90001050-111 = "그런 비효율적인 실험은 직접 해 볼 필요도 없이…… 아야얏! 폭력 반대!"
90001050-116 = "소, 소프…… 전 괜찮으니까 그러지 않으셔도……"
90001050-120 = "앞서 말했듯이 나는…… 이름 없는 신들의 힘이 남긴 흔적들을 추적하고 있었어."
90001050-121 = "그리고 그 과정에서 놀랍게도, 데카그라마톤의 다섯 번째 예언자, 게부라를 포착하게 되었고."
90001050-126 = "호오."
90001050-127 = "헤에……."
90001050-132 = "그건 저희가 발견한, 빙해에 남겨진 어떤 흔적과도 연관이 있는 것인가요?"
90001050-133 = "데카그라마톤과 이름 없는 신들의 힘 사이에는 별다른 상관관계가 없었잖아? 그동안은 말이야."
90001050-134 = "그 말이 맞아. 에이미. 거기에서 유추를 시도해 볼 수 있는 사실도 물론 있겠지만."
90001050-135 = "여기에서는 확실한 사실들만 가지고 이야기하도록 할게."
90001050-136 = "내가 파악하고 있는 또 다른 정보는, 게부라가 아닌 또 다른 예언자가, 빙해에서 자원을 채취하고 있다는 것이었어."
90001050-137 = "자원 채취, 라고요?"
90001050-138 = "그 예언자는 아마도, 커다란 배의 형상을 하고 있을 것으로 추정돼. 공작선이나 쇄빙선 같은 형태로 말이지."
90001050-139 = "그렇군요. 빙해에 남겨진 흔적이, 그런 종류의 선박이 남긴 것이라고 생각하면 앞뒤는 맞아요."
90001050-140 = "빙해란…… 사람의 손이 닿지 않는 장소로, 보통 천혜의 자원이 모여 있다고 알려져 있으니까요."
90001050-141 = "그리고 아마도 함께 이곳 빙해에 존재하는 게부라의 역할은, 빙해 근방 지형에 대한 정찰 및 초계……."
90001050-142 = "나아가 또 다른 예언자의 호위역…… 일지도 모르겠지."
90001050-143 = "[s] \"으음, 과연……. 일리가 있네.\""
90001050-144 = "배의 형상을 한 예언자의 정체도 파악하셨습니까?"
90001050-145 = "……거기까지는 무리였어. 그 예언자는 외부로 신호를 거의 발산하지 않았거든."
90001050-146 = "데카그라마톤의 병력들의 시선을 피해, 고속 정찰기로 개조한 AMAS로 현장을 촬영하는 것 정도가 한계였으니까."
90001050-147 = "그렇군요. 우리가 세운 가설에도 당신의 의견을 추가해, 전체적인 내용을 보강해야겠어요."
90001050-148 = "그건 어떤 가설이었지?"
90001050-149 = "우리의 예상대로라면, 데카그라마톤의 엔지니어들은 <이름 없는 신들의 힘>에 대해 파악하고 있고……."
90001050-150 = "나아가, 어쩌면 그것을 손에 넣었을지도 모른다는 가정이에요."
90001050-151 = "그래. 그런 가설도 무리는 아니지."
90001050-152 = "우리는 데카그라마톤의 엔지니어들이, 이름 없는 신들의 데이터 실증을 위해."
90001050-153 = "토키의 아비 에슈흐를 관찰하고, 특히 그 전투 정보를 관측하고자 하는 것이라고 추측했어요……."
90001050-154 = "거기에 더해 당신의 정보에 따르면, 이 빙해에는 또 다른 배 형상의 예언자가 자원을 채취하고 있었고."
90001050-155 = "그 예언자는 빙해에 거대한 이동 흔적을 남긴 채, 빙해 지역을 이탈했다…… 고 볼 수 있겠네요."
90001050-156 = "그렇다면 여기에서 한 가지, 의문이 드는 것이 있어요."
90001050-158 = "의문이라니?"
90001050-159 = "게부라가 정찰과 초계를 비롯해, 데이터의 수집을 위해 전투를 벌였다는 건 주어진 정보를 토대로 추측할 수 있지만."
90001050-160 = "정작 리오가 말한 그 예언자는, 무엇을 위해 자원을 채취하고 있던 것일까요?"
90001050-161 = "그건………."
90001050-162 = "[s] \"그 예언자는, 게부라와는 다른 목적을 가지고 움직이고 있었던 걸까?\""
90001050-167 = "네. 그것이 이 시점에서 내릴 수 있는 결론인 것 같네요."
90001050-168 = "이것도 저것도, 아직은 추측과 가설의 단계일 뿐이지만요."
90001050-169 = "그 대답을 알기 위해서라도, 더더욱 이 흔적을 따라가 볼 수밖에 없겠네."
90001050-170 = "리오 님께서 말씀하신 또 다른 예언자가, 그 끝에 기다리고 있을 가능성도 있을 테니까요."
90001050-174 = "……? 잠시만요. 보고드릴 것이 있습니다."
90001050-175 = "말씀드리는 사이에, 지형이 바뀐 것 같습니다."
90001050-176 = "고도를 하강시키겠습니다. 흔들림에 주의해 주십시오."
90001050-184 = "……."
90001050-188 = "?"
90001050-189 = "……?"
90001050-194 = "왜 그래, 부장?"
90001050-195 = "뭔가요?! 간신히 빙해를 벗어났다고 생각했는데, 결국 툰드라잖아요?"
90001050-196 = "추운 건 변함이 없잖아요?! 방열 슈트를 벗을 수도 없고, 몸이 둔해진 건 마찬가지잖아요?"
90001050-197 = "응. 여전히 시원해서 나는 마음에 들어."
90001050-206 = "[ns] \"그래도 빙해보다는 조금 낫지 않을까……?\""
90001050-207 = "저는 가능하다면 문제의 근본적인 해결을 원해요!"
90001050-208 = "엄밀히 말씀드리자면, 변화가 없는 것은 아닙니다. 평균 기온 3도 정도 상승."
90001050-209 = "이곳에 바다가 있다면, 그 바다는 쉽게 얼어붙지 않을 것 같습니다."
90001050-210 = "바다가 없으니까 하는 말이거든요?!"
90001050-212 = "그보다 모두, 저쪽을 봐. 뭔가 이상한 게 보이는데?"
90001050-216 = "[ns] \"저건…… 뭐지?\""
90001050-217 = "무언가의…… 이동 흔적 같은 것처럼 보이네."
90001050-218 = "어떻게 보면 단순명확해졌군요. 흔적을 쫓아 여기까지 왔으니, 또다시 흔적을 쫓아 가면 되는 일 아닐까요?"
90001050-219 = "그렇지만 여기에 남겨진 흔적은……?"
90001050-220 = "뭔가, 일정한 간격으로 거대한 구덩이 같은 것이 이어지고 있는 거 같아."
90001050-221 = "저것도 배의 이동 흔적일까요?"
90001050-222 = "[s] \"이런 말이 어울리지 않는다는 건 알겠지만, 이거…….\""
90001050-223 = "……그래, 내 입으로 이런 말을 하리라곤, 생각지도 못했지만."
90001050-224 = "선생의 말대로 저 흔적은 마치."
90001050-225 = "마치……."
90001050-226 = "……."
90001050-227 = "거대 괴수의 발자국?"
90001050-228 = "모두가 생각만 하고 있었던 걸 실제로 말해 버리다니, 어떤 의미로는 대단하네요."
90001050-229 = "요즘 배는 걸어 다녀?"
90001050-230 = "아뇨. 무슨 말을 하는 건가요, 에이미. 배가 걸어 다닐 리 없잖아요. 배에다 다리를 붙일 리 없잖아요. 무엇보다 그건 너무 비합리적이고 비효율적이잖아요."
90001050-231 = "그렇지만 부장, 그런 거 좋아하잖아. 점성술이라든가 수비학이라든가. 아니야?"
90001050-232 = "후후. 뭘 모르는군요, 에이미. 점성술은 고대로부터 이어져 온 천체의 통계와 사건……."
90001050-233 = "그리고 운명을 결정하는 것은 상수인가 변수인가에 대한 철학과 수학과 물리학…… 그야말로 모든 논의가 집대성된 하나의 학문이라고요?"
90001050-234 = "하지만 그에 비해 거대 괴수라는 건, 어디까지나 과학적인 영역에서 설명할 수 없는…… 그래요. 공상의 산물. 그런 게 실존할 리가 없잖아요. 에이미도, 참."
90001050-236 = "(이제 와서 그런 말을 해도 말이지…….)"
90001050-241 = "어떻게 하지……?"
90001050-242 = "지금 당장 또 다른 단서를 찾을 수 있을 것 같지는 않습니다."
90001050-243 = "여기에서 그만두고 돌아간다고 해도, 그게 의미가 있을 것 같지도 않고요."
90001050-244 = "[s] \"나도 그렇게 생각해. 정리 고마워, 토키.\""
90001050-245 = "감사합니다. 선생님. 하는 김에 말씀드리자면 칭찬은 고래도 춤추게 한다고 합니다. 저는 고래가 아니지만 아스마 토키입니다."
90001050-247 = "뭐 하는 거야. 선생님. 토키가 또 멋대로 엉뚱한 말을 하고 있잖아."
90001050-248 = "[s] \"……내 탓인 건가…… 그런 건가…….\""
90001050-249 = "좋아요. 알겠습니다. 계속해서 추적을 이어 나가도록 하죠. 리오. 상황 안내를 계속해 줘요."
90001050-250 = "알겠어."
90001050-251 = "토키는 미안하지만 경계 상태를 유지해 주겠어요? 예상되는 모든 위험에는 대비하고 싶네요."
90001050-252 = "알겠습니다. 히마리 부장."
90001050-260 = "다음화;불꽃"
