[translation]
12080-1 = "제8화;아비도스 사막으로 3"
12080-3 = "흐음. 고장난 드론과 오토마타들인가……."
12080-4 = "이상하게 여기엔 이런 것들이 많이 꼬인단 말이지."
12080-5 = "……잠깐만요! 전방에 무언가 포착되었어요!"
12080-6 = "모래 먼지 때문에 확인이 잘 안되는데……."
12080-7 = "……거대한 마을, 아니…… 공장……? 아니……. 주둔지……? 하여간 엄청 큰 규모의 시설과 인력이……."
12080-8 = "뭐, 뭐라고? 아야네 쨩, 뭔가 잘못 본 거 아냐?"
12080-9 = "이 앞은 말라버린 오아시스 밖에 없는데?"
12080-10 = "이, 일단 육안으로 식별가능한 곳까지 접근입니다!"
12080-12 = "……."
12080-13 = "이, 이게 뭐야……."
12080-14 = "……수 킬로는 되어 보이는 철조망과 시설……."
12080-15 = "공장……? 석유시추시설…… 은 아니에요. 이, 이게 대체 뭐죠……?"
12080-16 = "이런 건…… 옛날엔 없었는데……."
12080-19 = "으아?! 뭐야!?"
12080-21 = "!! 침입자다!"
12080-22 = "포획해라! 놓치지 마!"
12080-25 = "전방에 정체불명의 병력이 공격해오고 있습니다!"
12080-26 = "뭐, 잘은 모르겠지만 환영인사라면 우리도 화답해야겠지?"
12080-27 = "가자고-!"
