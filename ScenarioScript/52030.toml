[translation]
52030-1 = "제3화;새로운 축제"
52030-5 = "자자, 떨어트리지 않게 조심해."
52030-6 = "크기 때문에 발 아래가 안 보일 수 있으니까 넘어지지 않게 주의하라고."
52030-12 = "어이쿠. 이 간판, 들은 것보다 2배는 더 큰 것 같은데요?"
52030-13 = "뭔가 마츠리운영관리부에 주문이 잘못 들어간 게 아닐까요?"
52030-14 = "그게, 이 간판은 음양부에서 특별히 따로 주문해서 만들어서 그렇다고 하더라고."
52030-15 = "이 위에 치세 님이 직접 쓰신 친필 하이쿠 족자를 달아 축제장 어디서든 볼 수 있도록 높은 곳에 설치할 예정이라고 하던데—"
52030-29 = "우, 우와앗?!"
52030-30 = "위, 위험하잖아! 이렇게 사람이 많은 장소에서 뛰다니 무슨 생각이야?!"
52030-35 = "이봐, 괜찮아? 다치지는 않았어?"
52030-40 = "쳇, 실패했나……"
52030-44 = "실패했다니 그게 무슨—"
52030-50 = "리더, <실수를 가장하여 치세 님의 하이쿠 간판을 부러트리고, 이를 고쳐준다며 은근슬쩍 다른 간판과 바꿔치자! 계획>이 실패로 돌아갔습니다!"
52030-55 = "으, 응? 그렇게 자세하게 명령하진 않았던 것 같은데……"
52030-56 = "역시 <평소의 망량즈처럼 총과 폭탄으로 축제장을 엉망으로 만든 뒤에 은근슬쩍 다른 간판과 바꿔치자! 계획>으로 선회할까요?"
52030-58 = "……평소의 망량즈? 그러고 보니 너희들, 낯이 익은데……"
52030-62 = "맞아. 축제를 준비할 때마다 행사장을 돌아다니며 상점가 사람들에게 시비를 걸며 축제용 쿠폰을 갈취하는 불량 학생들이 있다더니…… 그게 너희들이었구나!"
52030-64 = "흥. 다른 행사라면 몰라도, <와라쿠 축제>의 쿠폰 같은 건 관심 없거든?"
52030-65 = "맞아, 음양부의 와라쿠 공주가 아무리 매력적이라고 한들 우리 리더의 카리스마에는 견줄 바가 못 되니까!"
52030-66 = "어, 모두들 나를 그렇게 생각해 주는 건 고맙지만……"
52030-67 = "어째 말을 할 때와 장소가 다소 빗나간 느낌이……"
52030-69 = "그럼 무엇 때문에 축제를 방해하려 드는 거야?"
52030-70 = "설마 정말로 치세 님의 인기를 시기해서—"
52030-72 = "와라쿠 공주는 아무래도 좋아! 우리가 하이쿠 간판에 손을 대려는 이유는……"
52030-73 = "지난주에 있었던 하이쿠 경연 대회 때문이라고!"
52030-75 = "지난주에 있었던 경연 대회라면, 치세 님이 우승했던 음양부 주관의 하이쿠 대회를 말하는 거야?"
52030-77 = "그래! 우리 리더도 그 대회에 자신만만하게 참가작을 써냈었지만……"
52030-78 = "음양부 녀석들의 간교한 방해 공작으로 예선에도 들지 못하고 떨어졌었지……"
52030-83 = "예선에는 붙었거든?!"
52030-85 = "다들 와라쿠 공주의 하이쿠에만 집중하느라 알아차리지 못했겠지만, 우리가 보기에는 리더의 하이쿠가 훨씬 훌륭했어!"
52030-86 = "맞아! 읽는 것만으로도 깊은 시상이 느껴질 정도였으니까."
52030-87 = "다들 리더의 하이쿠를 가까이에서 음미했더라면 그 하이쿠가 얼마나 훌륭한지 깨달을 수 있었을 거야!"
52030-89 = "헤헤. 다들 그렇게 말해주니 조금 부끄럽네……"
52030-93 = "아니, 그보다 하이쿠 간판을 갈아 치우려는 목적이 그거였어? 축제를 훼방놓으려는 게 아니라?!"
52030-95 = "당연하잖아요, 리더. 지난번 경연이 끝난 뒤에 결과 때문에 얼마나 상심했으면서."
52030-96 = "하지만 리더의 하이쿠가 적힌 간판을 축제장 한 가운데 걸어둔다면, 모두 리더의 하이쿠가 얼마나 훌륭한지 깨달을 수 있을 거예요!"
52030-97 = "아니, 아예 이 기회에 여기서 직접 모두에게 리더의 하이쿠를 읊어주죠!"
52030-99 = "아니, 그건 그만둬—"
52030-106 = "화#n려#n한#n축#n제#n도"
52030-108 = "반#n값#n할#n인#n쿠#n폰#n이#n없#n다#n면"
52030-110 = "반#n밖#n에#n즐#n길#n수#n없#n네"
52030-121 = "보세요, 리더! 다들 리더의 하이쿠에 감복해서 말을 잇지 못하고 있어요!"
52030-123 = "아니, 감복했다기보다는…… 애초에 그거 하이쿠가 맞기는 해?"
52030-124 = "운율도 안 맞고 글자 수도 제멋대로인데."
52030-126 = "그게 무슨 소리야, 리더가 하이쿠라면 하이쿠인 거지!"
52030-127 = "리더의 완벽한 시상을 정형시 속에 가두려 하지 마!"
52030-132 = "그럼 하이쿠가 아니잖아?"
52030-134 = "으으…… 으으으……"
52030-138 = "이렇게 된 이상, 억지로라도 이 축제를 방해해 주겠어!"
52030-146 = "또 축제장이 소란스럽다 싶더니만, 너희였구나. 망량즈."
52030-152 = "누, 누구야?"
52030-161 = "직접 쓴 하이쿠를 모두에게 들려주고 싶다는 그 마음가짐은 장하지만, 이 이상 축제를 방해하는 건 용납할 수 없어."
52030-162 = "개인의 사사로운 원한으로 많은 사람이 기대하는 축제에 훼방을 놓으려 하다니. 우스꽝스러운 동기네."
52030-164 = "이 축제에 열정을 쏟은 모두의 청춘을 헛되게 할 셈이야?"
52030-165 = "그 이상의 폭거는 저희, 백화요란이 두고 보지 않겠사와요!"
52030-171 = "너, 너희는 백화요란……?"
52030-172 = "리, 리더. 어쩌죠? 전에 만났을 때보다 훨씬 그 숫자가 늘어났어요!"
52030-174 = "백화요란 대책이라면 걱정하지 마. 전에 만났을 때 확실하게 세워두었으니까!"
52030-178 = "승부다, 백화요란! 지난번의 치욕을 되갚아 줄 테니까!"
