[translation]
84303400100-5 = "……예상대로였군. 사정은 이미 확인했어."
84303400100-6 = "게임을 건네주겠어? 코드를 분석하기 전에, 실제로 게임을 플레이함으로써 얻는 분석도 있을 테니."
84303400100-10 = "이 게임을 하면 분노가 생긴다는 증언이 많았어요. 괜찮겠어요?"
84303400100-11 = "괜찮아. 감정에 대한 조절 정도는, 수도 없이 연습해 왔으니까."
84303400100-24 = "…………."
84303400100-25 = "……리오?"
84303400100-26 = "……후."
84303400100-27 = "……후우…… 후우우……."
84303400100-28 = "리오……? 괜찮은 건가요, 리오?"
84303400100-29 = "괜찮아. ……아마도."
84303400100-30 = "플레이는 위험하겠어. 바로 코드 분석으로 들어갈게."
