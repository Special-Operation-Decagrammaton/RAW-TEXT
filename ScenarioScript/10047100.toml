[translation]
10047100-1 = "제10화;소원이 이루어지는 마법"
10047100-3 = "그, 그러고 보니…… <멸망의 날, 종은 혼자 노래한다>라는 말이……."
10047100-4 = "그런 이상한 말을 믿는 거야? 어디에나 있는 학원의 도시전설이라고!"
10047100-5 = "하, 하지만 진짜로 울리고 있어요……! 그 도시전설 속의 불길한 종이요!"
10047100-9 = "이건…… 불길한 소리가 아니에요."
10047100-10 = "저희를 아끼는 그 아이의 마음이 전달되는 소리죠."
10047100-11 = "뜻이 맞지 않지만 소중한 사람들. 그 사람들을 보내며 남은 아쉬움과 불안."
10047100-12 = "그러한 감정들이 모여 태어난 자신을 향한 자책감과 무력감."
10047100-13 = "하지만 당신이라면 하고 싶은 진짜 이야기를 찾을 수 있을 거라 믿었어요."
10047100-14 = "후후, 그래요. 들린답니다. 저희를 걱정하는 당신의 고운 마음이요."
10047100-16 = "이름 없는 종탑의 꼭대기"
10047100-18 = "샤아아악! 내가 왜 여기서 이러고 있는 거야!"
10047100-19 = "하여튼 다들 바보같이 잡히기나 하고……!"
10047100-20 = "이렇게 된 이상―"
10047100-21 = "성공 못 하면 용서 안 할 테니까! 바보 선배들아―!!!"
10047100-24 = "까아아악! 까아아아악!!"
10047100-25 = "히익, 갑자기 까마귀 떼까지……!!"
10047100-29 = "다들 겁먹었어…… 이 틈에 돌파하자."
10047100-37 = "마스터! 제 손을 잡으세요!"
10047100-38 = "소원이 이루어지는 마법을, 모두와 함께 완성하는 거예요!"
