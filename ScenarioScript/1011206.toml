[translation]
1011206-1 = "잃어버린 핸드폰"
1011206-2 = "(답장이 없는 아스나가 걱정되어 마지막으로 말했던 곳으로 향했다.)"
1011206-6 = "[ns] (이미 꽤 어두워졌는데…… 이쪽에 있으려나……)"
1011206-11 = "(저쪽에 누군가 엎드려 있다……)"
1011206-12 = "[ns] \"아스나?\""
1011206-21 = "아! 선생님~!!"
1011206-22 = "뭐야, 뭐야? 아스나 여기 있는 거 어떻게 알았어?"
1011206-23 = "[s] \"모모톡 답장이 없어서 찾으러 왔어.\""
1011206-27 = "[ns] \"혹시 예전처럼 고장 난 상태라면 위험하니까.\""
1011206-28 = "아, 지금은 괜찮아! 하핫."
1011206-29 = "몸에 힘이 안 들어간다거나 하지 않으니까~!"
1011206-30 = "[s] \"그건 다행이네.\""
1011206-31 = "응! 그건 재미있는 일이 없을 때 그러는 거 같아."
1011206-32 = "아니면 좋아하는 사람들을 자주 못 만난다거나?"
1011206-33 = "맞아. 그럴 때 종종 힘이 빠지고 그래. 아하하. 아스나는 충전식일지도!"
1011206-34 = "[s] \"요즘은 괜찮은 거야?\""
1011206-35 = "응응! 왜냐면 요즘은 꽤 재미있구~"
1011206-36 = "선생님도 자주 마주치니까! 그러니까 아주 좋아!!"
1011206-37 = "[s1] \"그렇다면 괜찮겠지만……\"\n[s2] \"여기서 뭘 하고 있었던 거야?\""
1011206-41 = "아, 맞다!"
1011206-42 = "나 핸드폰 잃어버렸거든!!"
1011206-43 = "[s] \"뭐어?\""
1011206-44 = "선생님한테 답장하려다가 다른 데에 정신팔렸는데, 그 사이에 어딘가로 사라진 것 같아."
1011206-45 = "그래서 모모톡 답장을 못 했어. 미안해, 선생님."
1011206-46 = "[s] \"그럼 같이 찾아볼까?\""
1011206-50 = "선생님이랑 같이? 응! 그럴래! 헤헤."
1011206-51 = "이쯤 어딘가에서 잃어버린 것 같은데, 계속 찾아봐도 안 보여~!"
1011206-52 = "[s3] \"아스나가 왔던 길을 되돌아가면서 찾아보자.\"\n[s4] \"내가 계속 전화해 볼게.\""
1011206-55 = "응! 진동 모드라 웅~ 할 거야. 그러면 어디 있는지 알 수 있어!"
1011206-57 = "(그렇게 아스나의 핸드폰에 계속 전화를 걸며 함께 주변을 수색했다.)"
1011206-60 = "(얼마 뒤……)"
1011206-66 = "[ns] \"방금……\""
1011206-67 = "선생님도 들었어? 이 근처에 있는 것 같아!"
1011206-72 = "아! 저쪽이다!!"
1011206-78 = "찾았어, 선생님!!"
1011206-82 = "아하하, 아까 앉았던 벤치에 그대로 두고 왔었나 봐."
1011206-83 = "이런 줄 알았으면 갔던 곳부터 찾을 걸 그랬어~"
1011206-84 = "[s5] \"원래 머물렀던 곳을 거슬러 올라가면 금방 발견하니까.\"\n[s6] \"어쨌든 다시 찾아서 다행이야, 아스나.\""
1011206-87 = "응!! 선생님이 아니었으면 꼼짝없이 잃어버렸을 거야."
1011206-88 = "고마워, 선생님!! 항상 아스나를 도와줘서!"
1011206-93 = "아, 이거 봐! 선생님."
1011206-94 = "[s7] \"내 부재중 통화 엄청 찍혀있네.\"\n[s8] \"찾는다고 계속 전화를 걸었으니……\""
1011206-97 = "아하하, 14통이나 와있어! 부원들한테도 이렇게는 안 받아봤는데!"
1011206-98 = "응, 이거 왠지 기분이 묘하네."
1011206-106 = "선생님이 아스나를 엄~청 애타게 찾는 것 같아. 아하하!"
1011206-107 = "막 아스나가 선생님한테 진짜 진짜 중요한 사람이 된 것 같은 느낌?"
1011206-108 = "[s] \"뭐…… 틀린 말은 아니긴 한데……\""
1011206-109 = "후후, 뭔가 간질간질해!!"
1011206-110 = "이거 캡처해 둬야지~! 엄청 귀중한 기록이야!!"
1011206-112 = "(텐션이 올라간 아스나와 함께 무사히 귀가했다……)"
