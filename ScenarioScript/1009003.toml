[translation]
1009003-1 = "과거의 저는 그런 아이였답니다."
1009003-4 = "와아, 선생님!"
1009003-5 = "백야당에 어서 오세요~ 주문은 뭘로 하시겠어요?"
1009003-6 = "전통적인 추천 메뉴 딸기 안미츠도 있고, 야츠하시에 팥빵에 만쥬, 찹쌀떡……."
1009003-7 = "곁들여 드시면 좋을 말차도 있답니다!"
1009003-8 = "[s1] \"그러면…… 무언가 달지 않은 걸로!\"\n[s2] \"그러면…… 무언가 달콤한 걸로!\""
1009003-11 = "네! 주문받았습니다! 잠시만 기다려 주세요!"
1009003-20 = "[ns] \"그런데, 웬일로 손님이 없네……?\""
1009003-21 = "그러게요. 하지만 가끔씩 이럴 때가 생기곤 해요."
1009003-22 = "자주는 아니지만, 일주일에 한두 번 정도일까요?"
1009003-23 = "네? 이왕 이렇게 된 거, 여기에 앉아서 쉬라고요? 그렇지만, 그건 조금……."
1009003-24 = "네에? 선생님께서 허락할 테니 괜찮다고요……?"
1009003-28 = "그, 그러면 선생님. 실례, 하겠습니다……?"
1009003-35 = "하아아……. 앉으니까 역시 좋네요……. 다리 아팠어요……."
1009003-36 = "[s] \"그럴 것 같더라.\""
1009003-37 = "선생님은 친절하시네요……. 배려심도 넘치시고요……."
1009003-38 = "안 그래도 3일 후에, 호수에서 마리모 축제가 열릴 예정이라, 백야당 영업이 끝난 뒤에도 축제 준비를 해야 하거든요."
1009003-39 = "거기에 틈틈이 강의도 들어야 하고, 시험 준비도 해야 하고……."
1009003-40 = "[s3] \"백야당과 축제까지라면 모르겠지만, 강의에 시험까지라니…….\"\n[s4] \"우미카는 모범생이구나……. 선생님, 감동했단다…….\""
1009003-43 = "어, 선생님?! 진짜로 울먹이시면 제가 곤란한데요?!"
1009003-44 = "하지만 공부는 학생의 본분이고, 그건 당연한 일이라고 할까 상식이라고 할까……."
1009003-48 = "왜 거기에서 더 울먹이시는 거죠–?!"
1009003-54 = "[ns] \"축제 준비는 잘 되어 가?\""
1009003-55 = "네. 순조로워요."
1009003-56 = "에헤헤…… 순조롭다고 해서 일이 줄어드는 건 아니긴 하지만요."
1009003-57 = "그래도 뭐, 그런 것까지 포함해서, 축제인 거니까요!"
1009003-58 = "네? 어째서 그렇게까지 축제를 좋아하느냐…… 고요?"
1009003-59 = "……후훗."
1009003-65 = "아뇨, 아뇨. 그냥, 조금, 옛날 생각이 나서요."
1009003-66 = "어렸을 때 저는…… 시골 출신이었어요."
1009003-67 = "공기도 좋고, 한적했지만……. 아무래도, 즐길 게 그다지 많지 않았죠."
1009003-68 = "평화롭고 한가로웠지만, 그, 있잖아요? 어린아이들은 뭔가 신나는 걸 바라잖아요?"
1009003-69 = "[s] \"어른도 신나는 거 좋아해!\""
1009003-70 = "그, 그러신가요……?!"
1009003-74 = "시골에서 자랐던 어린아이에게는, 1년에 한두 번 열리는 축제가, 가장 큰 기댓거리였어요."
1009003-75 = "온 마을이 한 달 정도 전부터 축제를 준비하고, 대나무를 베어 오거나, 종이를 만들어 오리거나, 염색을 하거나, 가마를 만들거나……."
1009003-76 = "그때부터였던 것 같아요. 저는 어느새, 마을에서 누구보다 빨리, 그리고 많이 축제를 준비하는 아이가 되어 있었죠."
1009003-77 = "저는 이렇게, 백귀야행으로 와서 많은 것을 배우고, 많은 것이 변하게 되었지만……."
1009003-78 = "그래도, 여전히 축제가 가장 좋아요."
1009003-79 = "무엇보다 말이죠? 키보토스 각지의 축제에 대해 언제든 자유롭게 조사할 수도 있고 말이죠? 기회를 잘 잡으면 견학이라는 이유로 직접 찾아가서 체험해 볼 수도 있고요?"
1009003-80 = "실제로 축제를 기획하고 준비하는 건 매우 힘든 일이고, 백야당에서 배울 것도 아직 산더미같이 많지만……."
1009003-81 = "그래도, 아직 '축제' 라는 단어를 들으면, 머릿속 어딘가가 좋은 의미로 마비되어 버리는 느낌이 들거든요!"
1009003-82 = "그 때문에 눈치가 조금 부족하다든가 가끔씩 분위기를 깬다든가 하는 말을 들을 때도 있지만요……."
1009003-83 = "[s] \"뭐, 괜찮지 않을까?\""
1009003-87 = "정말, 요……?"
1009003-88 = "[s] \"난 그렇다고 생각해. 누군가 다치는 것도 아니고.\""
1009003-89 = "하지만, 저, 스스로도 자각하고 있지만, 그럴 때마다 주위가 보이지 않게 되거나 머리가 어떤 의미로 바보가 되어 버리거나 하는걸요……."
1009003-90 = "[s5] \"그렇게까지 한 가지에 몰두할 수 있는 것도.\"\n[s6] \"내가 보기에는…… 축복받은 거야.\""
1009003-97 = "……정말요?"
1009003-98 = "선생님께서 그렇게까지 말씀하시면, 맞는 거겠죠……?"
1009003-99 = "에헤헤. 감사합니다. 선생님. 조금, 마음이 편해졌어요."
1009003-100 = "무, 물론 지금은 백야당의 종업원으로서 일하고 있으니까, 그 쪽에 최선을 다할 거지만요!"
1009003-105 = "……라고 하기에는, 손님이 없네요……."
1009003-112 = "안녕하세요~ 오늘 추천 메뉴는 뭐야~?"
1009003-114 = "아, 손님이 오셨네요! 그러면 선생님! 이만 가 보겠습니다!"
1009003-118 = "어서 오세요! 자리를 안내해 드리겠습니다!"
1009003-122 = "(백야당은 다시 순식간에 손님들로 가득 찼다.)"
1009003-123 = "(바쁘게 일하는 우미카를 바라보다가, 계산을 끝마치고 샬레로 돌아왔다.)"
