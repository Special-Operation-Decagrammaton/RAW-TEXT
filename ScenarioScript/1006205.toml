[translation]
1006205-1 = "취미에 대한 고민"
1006205-2 = "샬레 집무실"
1006205-3 = "(토키와 함께 샬레의 업무를 시작했다.)"
1006205-9 = "[ns] \"토키는 말이지.\""
1006205-10 = "네, 선생님?"
1006205-11 = "[s] \"이런 일에 익숙하구나.\""
1006205-12 = "이런 일이라니, 어떤 의미이신가요?"
1006205-13 = "[s] \"자료 정리라든가, 분류라든가…… 지금 우리가 하고 있는 일들.\""
1006205-14 = "외람된 말입니다만, 모시던 분과 많이 해 본 일이었으니까요."
1006205-15 = "물론 청소나 요리, 가사 같은 일들도 지시하신다면 얼마든지 할 수 있습니다."
1006205-16 = "[s1] \"이대로도 충분하다고 생각해……\"\n[s2] \"그런데, 힘들다거나 그렇게 느끼지는 않아?\""
1006205-19 = "샬레에서의 일 말씀이십니까?"
1006205-20 = "특별히 그렇다고는 느껴지지 않습니다. 그렇다고 할까, 오히려 지나치게 일이 없어, 약간 어색함마저 느낄 정도입니다."
1006205-21 = "선생님께서는 조금 더, 저라는 우수한 메이드를 적극적으로 사용하셔도 좋습니다."
1006205-22 = "예를 들자면 지금도 하고 있는 호위부터 시작해, 격퇴, 진압, 폭발물 해체, 추적, 섬멸, 요격, 파괴, 멸망까지. 어떠한 것이든."
1006205-23 = "[s] \"메이드의 요소가 하나도 없는데요?!\""
1006205-24 = "아닙니다. 그것이야말로 우수한 메이드의 소양입니다."
1006205-25 = "[s] \"그, 그런가?! 그, 그럴지도……\""
1006205-26 = "그런 겁니다. 저는 완벽한 메이드이기에."
1006205-27 = "[s3] \"그, 그러면 말이지!\"\n[s4] \"휴일이나 주말에는 뭘 하고 지내? 취미라든가!\""
1006205-30 = "취미……요?"
1006205-31 = "무슨 이야기인지 잘 모르겠습니다. 그건 어떤 개념인가요?"
1006205-32 = "시간이 남을 때 하는 일이라고요? 으음…… 어려운 것을 물으시는군요."
1006205-33 = "기본적으로 남는 시간이라는 것이 극히 드물었어서……"
1006205-34 = "[s5] \"이런 현실이…… 이런 현실이 있단 말이냐!\"\n[s6] \"아직 한창일 때의 학생이, 그래서는 안 돼!\""
1006205-37 = "서, 선생님……?"
1006205-38 = "네? 이대로 두고 볼 수는 없다고요? 지금부터 같이 어딘가로? 선생님? 갑자기 또 다시 팔을 잡아 끄시면……?"
1006205-43 = "키보토스 시내"
1006205-44 = "[ns] \"영화는 어땠어?\""
1006205-45 = "이해가 가지 않았습니다."
1006205-46 = "왜 굳이 추격극을 찍어야 했을까요? 총격전까지 사태가 확대될 이유가 있었을까요?"
1006205-47 = "처음부터 의심하지 말고 처리해 버렸으면, 그 이상 아무도 다치지 않고 사건이 종료되었을 텐데 말입니다."
1006205-48 = "[s] \"각본이라는 것의 의의를 부정당했다?!\""
1006205-49 = "그 밖에도 불만점이 많았습니다. 예를 들어……"
1006205-51 = "(토키는 30분도 넘게 영화 내용의 허술함을 이야기했다.)"
1006205-53 = "……이상입니다."
1006205-54 = "[s] \"……수고했어……\""
1006205-55 = "천만의 말씀입니다."
1006205-56 = "예? 보통은 그렇게까지 세세히 따지지 않고, 즐거움을 느낀다고요?"
1006205-57 = "그렇군요…… 아무래도 영화를 감상하는 데에는 노력과 수련이 더욱 필요한 모양입니다."
1006205-59 = "상점 거리"
1006205-60 = "[ns] \"이번엔 만화책이었는데……\""
1006205-61 = "그림을 매개로 정보를 전달한다는 취지는 이해했습니다만."
1006205-62 = "정보의 밀도나 전달력 면에서 굳이 그래야 했을까, 하는 의문은 남습니다."
1006205-63 = "정보의 밀도 면에서는 문서를 따라갈 수 없고, 전달력 면에서는 영상 매체를 따라갈 수 없습니다."
1006205-64 = "그런데도 굳이 생산 시간이 오래 걸리는 그림이라는 방식을 사용한다는 건…… 무슨 의미일까요?"
1006205-65 = "제가 모르는 어떤 이유가 분명히 있겠지만, 저는 잘 모르겠습니다."
1006205-69 = "쇼핑이란 심오한 행위로군요."
1006205-70 = "굳이 필요하지 않은 물건인데도, 일부러 마음을 움직여 물건을 구입한다니."
1006205-71 = "저는 잘 모르겠습니다. 행위에는 대부분 의미가 따라오기 마련인데."
1006205-72 = "쇼핑에는…… 어떤 의미도 담겨 있지 않은 것으로 보입니다."
1006205-73 = "[ns] \"즐겁지, 않았구나……\""
1006205-75 = "(그 뒤로도 토키와 함께 여러 '취미'들을 시도해 보았다.)"
1006205-76 = "(토키가 흥미를 보인 것은…… 아무것도 없었다.)"
1006205-78 = "키보토스 시내"
1006205-79 = "[ns] \"수고했어…… 토키……\""
1006205-80 = "아뇨. 수고랄 것은 없었습니다."
1006205-81 = "오히려 저보다는 선생님 쪽이 더……"
1006205-82 = "……"
1006205-83 = "저, 선생님?"
1006205-84 = "[s] \"응?\""
1006205-85 = "결국 취미란 것은…… 근본적으로, 무엇인가요?"
1006205-86 = "혹시 전문 기술이나 호위처럼, 숙달을 요하는 특수한 기능인가요?"
1006205-87 = "반드시 잘 해내야 하고, 성공해야 하는…… 그런 종류의 방법론인가요?"
1006205-88 = "(토키는 드물게도 불안한 듯 떨리는 눈동자로 이쪽을 쳐다보고 있었다.)"
1006205-89 = "(그런 토키에게 해 줄 수 있는 말이란……)"
1006205-90 = "[s] \"취미란 건 말이지.\""
1006205-91 = "네."
1006205-92 = "[s7] \"그냥, 잘하고 못하고를 떠나서.\"\n[s8] \"자기가 하고 싶은 것, 하면서 즐거운 것이면 되는 거야.\""
1006205-95 = "자기가 하고 싶고……. 즐거운 것, 말씀이십니까?"
1006205-96 = "[s9] \"지금 당장 서둘러서 찾을 필요는 없지만.\"\n[s10] \"언젠가는 토키도 딱 맞는 취미를 찾을 수 있을 거야.\"\n[s11] \"그건 꼭 있을 필요는 없지만, 있으면 좋은 거니까.\""
1006205-100 = "……"
1006205-101 = "그렇다면, 제게 있어 취미는……"
1006205-102 = "……후훗."
1006205-103 = "[s] \"응? 무언가 찾았어? 벌써?\""
1006205-104 = "아무것도, 아닙니다."
1006205-108 = "선생님."
1006205-109 = "그러면, 돌아가실까요."
1006205-110 = "샬레까지, 제가 호위해 드리겠습니다."
1006205-111 = "[s] \"뭔가, 지금 토키만 알고 나는 모르는 게 생긴 것 같은데……?\""
1006205-112 = "글쎄요. 어떨까요."
1006205-118 = "[ns] \"알려 주면 안 돼?\""
1006205-119 = "저도 잘 모르겠답니다."
1006205-120 = "[ns] \"그게 뭐야~\""
1006205-122 = "(그렇게 토키와 간간이 이야기를 나누며, 샬레로 돌아왔다.)"
