[translation]
83302200500-6 = "우와아앙~ 도와주셔서 감사해요~ 히나 씨!"
83302200500-12 = "일단 급양부실을 어지럽히는 <그것>들을 처리하긴 했지만……"
83302200500-13 = "이게 어떻게 된 일이야? 주리."
83302200500-14 = "그…… 그게 말이죠……"
83302200500-15 = "그게…… 그러니까………"
83302200500-16 = "우와아앙~ 후우카 선배가 끌려가 버리셔서……!"
83302200500-17 = "선배는 끌려가면서도 '내가 돌아올 때까지 기다려' 라고 하셨지만……!"
83302200500-18 = "하지만 만마전의 발주가 있었으니까. 그 납품일이 얼마 남지 않아서……"
83302200500-19 = "이대로 납품을 지키지 못하면 또 그걸 빌미로 만마전에서 급양부의 예산을 깎을지도 모른다고 생각했던 탓에……!"
83302200500-20 = "주리, 잠깐. 진정해. 이야기를 정리해 볼게."
83302200500-27 = "주리의 이야기를 정리하자면 즉."
83302200500-28 = "시시각각 만마전이 요구했던 납품일이 다가오고 있었고."
83302200500-29 = "훌쩍. ……네."
83302200500-30 = "하필 그 사이에 후우카가……"
83302200500-31 = "미식연구회에게 납치를 당해버리는 일이 발생, 해버렸다고."
83302200500-32 = "훌쩍, 네에. 맞아요……"
83302200500-33 = "어쨌거나 납품일을 맞추지 않으면 곤란하니까. 후우카는 말렸지만, 주리가 혼자서라도 요리하려고 노력했는데."
83302200500-34 = "때마침 얼마 전에 온천개발부 부장이 급양부 지하 수맥에서 발견한 엄청난 온천수가 있다며, 그걸 넘겨줬고."
83302200500-35 = "그런 거라면 온천 계란을 만들기에 좋겠다 싶어, 사용했더니……."
83302200500-36 = "그 결과…… <저것>들이 나타났다, 라는 거네."
83302200500-38 = "흐윽, 훌쩍. 네! 맞아요! 전부…… 저 때문에!"
83302200500-39 = "(그리고 마코토는, 주리가 만든 음식을 먹고 그런 상태가 되었다는, 건가.)"
83302200500-40 = "으아앙~! 죄송해요~! 히나 씨~! 후우카 선배~!"
83302200500-41 = "아니, 주리가 사과할 일은 아니라고 생각해."
83302200500-42 = "결과에 다소 문제가 있을지라도 노력하고자 했던 그 마음까지 부정하는 건, 안 될 일이니까."
83302200500-43 = "히나 씨……!"
83302200500-44 = "하지만…… 그렇지. 후우카가 이대로 납치된 채로 있는 건 역시 곤란하겠어."
83302200500-45 = "이야기 고마워. 후우카라면 바로 구하러 갈 테니. 걱정 마."
83302200500-46 = "네! 감사합니다! 히나 씨! 꼭 부탁드릴게요!"
