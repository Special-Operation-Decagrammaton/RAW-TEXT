[translation]
10024060-1 = "6화;허심탄회: 품은 생각을 터놓고 이야기하다."
10024060-2 = "산해경 거리"
10024060-4 = "아, 선생님. 교관 쨩에게 잘 이야기해 줘서 고마워."
10024060-5 = "[s] \"덫을 놓자고 한 건 나니까.\""
10024060-6 = "……"
10024060-7 = "선생님은 대의라는 걸 믿어?"
10024060-8 = "큰 뜻을 위해서 작은 희생은 감수할 만하다든가, 결과만 좋으면 다 괜찮다든가."
10024060-9 = "나는…… 솔직히 잘 모르겠어."
10024060-10 = "현룡문이라면 확실히 그런 것이 있다고 이야기하겠지."
10024060-11 = "미나가 유독 이번 '덫'에 찬성한 것도, 그런 의미에서 보면 납득할 만하고."
10024060-12 = "[s1] \"루미는 뭔가 관록 있어 보이는 느낌이라,\"\n[s2] \"그런 건 마음에 두지 않을 줄 알았어.\""
10024060-15 = "하하하. 무슨 소리야, 선생님."
10024060-16 = "어쩌다 회장 같은 걸 하고 있긴 하지만, 난 요리사야."
10024060-17 = "그렇네…… 할 수 있다면 그냥, 아무 생각 없이 요리만 하고 싶어."
10024060-18 = "요리는 정직하잖아? 수고를 들인 만큼 맛있어지고, 연구를 한 만큼 가능성이 생겨."
10024060-19 = "그걸 손님들에게 대접하고, 맛있다는 반응을 얻는 거지."
10024060-20 = "요리사로서의 보람이란, 대충 그런 거야."
10024060-21 = "[s] \"회장으로서의 보람은?\""
10024060-23 = "선생님도 어른이니 어느 정도는 알겠지만."
10024060-24 = "책임자라는 건…… 버겁지."
10024060-25 = "내 선택과 결정만으로, 많은 학생들이 그 결과에 영향을 받게 된단 말이지."
10024060-26 = "나라고 해서 그 학생들보다 특출나게 낫거나 한 건 아닌데도,"
10024060-27 = "그 학생들은…… 나 말고는 의지할 대상이 없는 거야."
10024060-28 = "[s] \"이해해.\""
10024060-29 = "집단이란 건 골치 아파."
10024060-30 = "사람도 아닌 것이, 가끔 사람처럼 행동한단 말이야."
10024060-31 = "토라지고, 화내고, 싫어하고, 가끔은…… 무언가를 미워하고."
10024060-32 = "그걸 잘 어르고 달래서, 간신히 <짠, 아무 일도 없었습니다> 같은 결과를 만들어 가는 거지."
10024060-33 = "어떻게든 그런 결과를 만들어 내면…… 글쎄. 그게 보람이라고 해야 하겠군."
10024060-34 = "<이번에도 무사히 넘겼다. 다음은 솔직히 자신 없지만.>같은 거라고 할까."
10024060-35 = "이야기해놓고 보니, 보람이라기보다는 안도감 같은 거겠군."
10024060-36 = "[s] \"루미는 속이 깊구나.\""
10024060-37 = "그런 거 아니라니까, 조금 전부터 왜 그러는 거야."
10024060-38 = "아, 선생님은 그건가? 주위 사람들을 일부러 치켜세워서, 일을 하도록 만드는 타입."
10024060-39 = "이거, 만만히 볼 수 없겠는데. 물론 효과적으로 사람을 다루는 방법 중 하나이긴 하지만."
10024060-40 = "너무 과하게 치켜세우면, 나중에 좀 귀찮은 일을 당하게 될 거라고?"
10024060-41 = "[s] \"그건 경험담이야?\""
10024060-42 = "음. 어떨까. 그 이상은 비밀이라고 하지."
10024060-43 = "왜 그런 눈으로 보는 거야. 누구나 비밀 한두 가지 정도는 있는 법이잖아."
10024060-47 = "……신기하네. 선생님에게는 아무에게도 이야기하지 못했던 것들을 술술 털어놓게 돼."
10024060-48 = "[s] \"학생의 고민을 들어주는 것도, 선생이 할 일이니까.\""
10024060-49 = "……"
10024060-50 = "그거 알아, 선생님?"
10024060-55 = "그런 식으로 말하면…… 나, 착각해, 버린다고?"
10024060-56 = "자, 그러면 교관 쨩을 돌봐 주러 갈 시간이 됐군."
10024060-57 = "[s] \"내 몫까지 코코나 쨩을 지켜 줘.\""
10024060-58 = "걱정 마. 상회의 명예를 걸고, 교관 쨩에게는 아무 일도 일어나지 않게 하겠다고 맹세하지."
10024060-59 = "나 참, 생각해 보면 결국 상자 하나 나르는 건데 말이야."
10024060-60 = "[s] \"그렇지만 지금만큼은 그게 세상에서 가장 중요한 상자잖아?\""
10024060-61 = "그렇지…… 그러면, 다녀올게."
10024060-66 = "(루미의 뒷모습이 보이지 않게 되자……)"
10024060-69 = "……"
10024060-70 = "(어딘가 신기한 분위기를 가진 현룡문 학생이 나타났다.)"
10024060-75 = "[ns3] \"무슨 일이니?\"\n[ns4] \"미나를 만나러 온 거야?\""
10024060-78 = "모두 어디 간 것인가?"
10024060-79 = "[s5] \"음…… 다들 조금 따로 할 일이 있어서.\"\n[s6] \"할 말이 있으면 전해 줄게.\""
10024060-85 = "아니…… 아무도 없다면 그것으로 좋다."
10024060-91 = "후, 몰래 빠져나오는 것도 힘들구나."
10024060-96 = "[ns] \"키사키?!\""
10024060-97 = "왜 그렇게 놀라는 것인가, 선생?"
10024060-98 = "현룡문의 문주로서, 일이 어떻게 되고 있는지 보러 온 것뿐이거늘."
10024060-99 = "직접 올 필요가 있었느냐고?"
10024060-100 = "앉은 자리에서는 보이지 않는 것이, 현장에서는 보일 수 있는 법이니 말이다."
10024060-101 = "모두에게는 각자의 시야가 있는 것이니, 그 차이에 주의를 기울이지 않으면 중요한 것들을 놓치고 마느니라."
10024060-102 = "그래서…… 어떻게 되고 있느냐? 선생의 의견을 듣고 싶구나."
10024060-108 = "(키사키에게 지금까지 있었던 일을 설명해 주었다.)"
10024060-111 = "그러한가…… 알겠다."
10024060-112 = "미나를 선생에게 붙여 둔 것은, 옳은 판단이었던 것 같구나."
10024060-113 = "미나는 그렇게 보여도 쉽게 머리가 뜨거워지는 성격이니 말이다."
10024060-114 = "[s] \"그러면, 미나를 곤륜산으로 보낸 것은……?\""
10024060-115 = "그러하다. 나의 지시였다."
10024060-116 = "충돌이 있으면 어떻게 할 생각이었느냐고? 그 정도는 생각해 두었느니라."
10024060-117 = "미나는 충분히 우수하고 강하지만, 현무상회의 그 둘을 동시에 이겨낼 정도는 아니니라."
10024060-118 = "그리고 그 둘도 선생이 있다면, 함부로 미나를 해치지는 않을 것이라고 믿었다."
10024060-119 = "그렇다면 미나와 현무상회는 불안정한 중립을 이루게 되겠지."
10024060-120 = "그 가운데에는 선생, 그대가 있을 것이고."
10024060-121 = "내 추측에 틀린 부분이 있는가?"
10024060-125 = "[ns] \"키사키는 대단하구나……\""
10024060-126 = "추켜세울 것은 없다. 현룡문의 문주가 되기 위해서는 이 정도는 읽어낼 줄 알아야 하는 법이니."
10024060-127 = "솔직히 이야기하자면 그다지 자리에 연연하고 싶지도 않다만……"
10024060-131 = "아니, 실언이었다. 잊어다오."
10024060-132 = "[s] \"왜 미나와 현무상회의 둘을 같이 행동하게 하려고 했던 거야?\""
10024060-133 = "……"
10024060-134 = "어떤 것은…… 바로 옆에서 바라보지 않으면 보이지 않기 마련이다."
10024060-135 = "미나는 올바르고 강직하지만, 시야가 좁은 면이 있지."
10024060-136 = "조금 더 융통성을 챙긴다면, 더 넓은 세계를 볼 수 있으련만……"
10024060-137 = "어떤 의미로는 알 것 같다고? 거기까지 파악했는가? 그대는 제법 사람 보는 눈이 있구나."
10024060-138 = "모든 것이 끝난 뒤에, 산해경에서 조금 더 머무를 생각이 있느냐? 내 친히 배려해 주겠다."
10024060-139 = "[s] \"마음만 받을게. 고마워.\""
10024060-140 = "후후, 그러한가. 아쉽구나."
10024060-141 = "루미는…… 말해 본들 소용없겠지. 루미야말로 내 뜻대로 되지 않는 사람 중 한 명이니."
10024060-142 = "루미가 신경 쓰이느냐고? 후후. 이제 와서 루미가 내 말을 들어줄 것이라고는 생각하지 않노라."
10024060-143 = "루미 역시 나에게 그런 기대는 하고 있지 않을 것이고."
10024060-144 = "[s] \"예전부터 알고 지낸 사이였던 모양이네?\""
10024060-145 = "무얼. 서로에게 지겨운 인연일 뿐이다. 한때는 그 아이와 함께 일하는 것을 고려하기도 했으나……"
10024060-146 = "아니, 아니다. 부질없는 이야기였다. 잊어라."
10024060-147 = "[s] \"그래서, 직접 와서 본 감상은 어때?\""
10024060-148 = "……"
10024060-149 = "내가 여기에서 진실의 일말을 그대에게 이야기하는 것이 옳은 일일지 모르겠구나."
10024060-150 = "루미를 위해서는 나쁘지 않은 선택일지도 모른다고?"
10024060-151 = "……훗."
10024060-152 = "하찮은 것은 싫다. 하지만 선생…… 그대는 조금 다르구나."
10024060-153 = "그대를 믿고 이야기하도록 하마. 현룡문은 어떤 의미에서 사건의 진위에는 이미 관심이 없다."
10024060-154 = "그리 놀라지 말거라. 이런 일을 하다 보면 흔히 마주치게 되는 상황이니."
10024060-159 = "현무상회가 만년삼 유통에 가담했다면, 이야기는 쉬워진다. 그것을 구실로 현무상회를 일망타진할 수 있게 될 테니."
10024060-163 = "그리고 현무상회가 유통을 하지 않았어도 큰 상관은 없다. 이번 일을 빌미로 누명을 덮어씌워 현무상회의 세력에 견제를 가할 수 있을 것이니."
10024060-167 = "어느 쪽이든…… 현룡문에게는 나쁘지 않은 이야기다. 그렇지 않느냐?"
10024060-170 = "[ns] \"키사키는 그 상황이 마음에 들지 않는 거지?\""
10024060-173 = "……어째서 그렇게 단정하는 것인가?"
10024060-174 = "[s] \"그렇지 않았다면 일부러 여기까지 변장하고 찾아올 필요도 없었을 테니까.\""
10024060-175 = "후후…… 그대는 통찰력이 있는 사람이구나."
10024060-176 = "현룡문은…… 현룡문의 것이다."
10024060-177 = "내가 문주라고 하여, 현룡문 전체의 뜻과 방향을 멋대로 바꿀 수 있는 것도 아니라는 이야기다."
10024060-178 = "[s] \"힘내고 있구나. 키사키.\""
10024060-182 = "……어떨까."
10024060-183 = "그대, 혹시 아무에게나 그런 식의 말을 섣불리 하고 다니는 것은 아니겠지? 아니…… 오히려 그렇기에 샬레의 선생인 것인가……"
10024060-184 = "화가 났느냐고? 현룡문의 문주 되는 자가 이런 일로 감정이 흔들려서야 되겠느냐."
10024060-185 = "그 대신……"
10024060-192 = "[ns] \"우왓?!\""
10024060-193 = "(키사키가 갑자기 등에 업혀 왔다.)"
10024060-195 = " 선생이기에 보이는 것들도 있겠지만, 나이기에 비로소 볼 수 있는 것이 있기 마련이다."
10024060-196 = "이것이 선생의 시야인가…… 어른의 시야라고도 할 수 있겠구나."
10024060-197 = "……"
10024060-200 = "[ns] \"키사키는 루미가 무관하다고 생각하고 있는 거지?\""
10024060-201 = "누구보다 위험 관리에 철저한 성격이다. 그렇게까지 위험한 일에 손을 댈 리가 없을 게다."
10024060-202 = "만에 하나 얽혀 있다고 해도…… 루미의 손이 닿지 않는 하부 조직 정도가 가담했을 테지."
10024060-203 = "기껏해야 돈에 좌지우지되는 피라미들 말이다."
10024060-204 = "[s] \"나도 그럴 거라고 생각해.\""
10024060-212 = "부탁하고 싶은 것이 있노라. 선생."
10024060-213 = "지금까지처럼 루미를 지키고, 미나를 돌봐다오. 하는 김에 레이죠라는 아이도."
10024060-214 = "적어도, 모든 진실이 밝혀질 때까지만이라도 말이다."
10024060-215 = "만에 하나 현무상회가 정말로 이 일에 깊이 관여하고 있다면…… 그때는 내가 직접 내 손으로 루미를 치겠다."
10024060-216 = "하지만 모든 것이 드러나기 전에, 그 아이들이 애먼 피해를 입어서는 안 되지 않겠느냐."
10024060-217 = "정말이지 손이 많이 가는 녀석들이로다. 현룡문의 문주를 직접 불러내게 하다니."
10024060-218 = "[s] \"키사키는 현무상회와 루미를 어떻게 생각하고 있어?\""
10024060-219 = "……어떨까."
10024060-223 = "현무상회도 산해경이다. 현룡문 역시 산해경이고."
10024060-224 = "내가 말할 수 있는 것은, 그것뿐이다."
