[translation]
10040110-1 = "후일담;궁극의 음료"
10040110-2 = "(치히로와 유우카, 노아가 과자를 사러 잠시 자리를 비운 사이……)"
10040110-3 = "하아~ 재밌었다."
10040110-4 = "이미 수십 번도 넘게 플레이한 게임이지만, 할 때마다 긴장을 놓을 수 없는 걸 보면 <BOOM>은 역시 명작이라니까."
10040110-5 = "이번 플레이는 다른 의미로 긴장을 놓을 수 없었지만."
10040110-6 = "혹시라도 치히로 선배가 개인 총기를 산탄총으로 바꾸고 싶다고 하면, 무슨 수를 써서라도 막아야 해……"
10040110-8 = "하, 하하…… 운전처럼 게임을 할 때 성격이 달라지는 사람은 꽤 있으니까."
10040110-9 = "긴장을 하도 해서 그런지 갑자기 목이 마르네."
10040110-10 = "하레 선배. 여기 있는 이 <요괴 MAX>, 내가 마셔도 되지?"
10040110-11 = "아, 상관은 없지만 그거 아마도—"
10040110-18 = "……콜록, 콜록!"
10040110-19 = "뭐야, 이 <요괴 MAX>! 엄청나게 시큼털털해! 혹시 상한 건가?"
10040110-20 = "……그래서 경고하려고 했는데. #n 그거, 이번에 새로 출시한 우메보시 맛 <요괴 MAX>거든."
10040110-21 = "우메보시 맛?!"
10040110-23 = "정말 <요괴 MAX>는 별의별 맛이 다 나오는군요. 지난달에 단팥죽 맛이 나왔을 때도 SNS에서 큰 화제가 되었었는데."
10040110-25 = "맛으로 먹기에는 조금 고역이어도, 잠을 깨우는 용도로는 나쁘지 않아. 시큼한 맛이 정신을 번쩍 들게 하거든."
10040110-26 = "으으, 우메보시의 신맛 때문인지 흰 밥을 먹고 싶은 기분이야."
10040110-27 = "아니면 쌀로 만든 감주라도 한 모금 마시고 싶은 느낌—"
10040110-32 = "……선배, 갑자기 떠오른 생각인데."
10040110-33 = "혹시 이 우메보시 맛 <요괴 MAX>에 감주를 섞어 마시면, 흰 밥에 우메보시를 올려 먹는 느낌이 들지 않을까?"
10040110-35 = "아뇨."
10040110-36 = "전혀 다른 맛이 날 것 같은데……"
10040110-38 = "하지만 두 가지 맛의 음식을 섞으면 전혀 다른 맛을 내는 경우가 종종 있잖아?"
10040110-39 = "의외로 두 음료가 좋은 시너지를 내서 더 맛있어질지도—"
10040110-43 = "후후, 그것참 흥미로운 발상이네요."
10040110-44 = "까, 깜짝이야! 언제 일어났던 거야?"
10040110-45 = "여러분이 TV로 <BOOM>을 플레이하고 있었을 때부터……?"
10040110-46 = "다만 뭔가 묘하게 TV 앞에서 살기 같은 게 느껴져서, 계속 자는 척을 하고 있긴 했지만요."
10040110-48 = "……확실히 <BOOM>을 플레이하는 부부장의 박력은 대단했었지."
10040110-49 = "그나저나 우메보시 맛 요괴 MAX에 감주를 섞는다니 엄청 재미있어 보이는데요?"
10040110-50 = "마침 음료수도 잔뜩 있으니, 다른 것도 한 번 시험해 보죠!"
10040110-51 = "재미있어 보인다니…… 전에도 음료수를 섞어 먹어 본 적이 있는 거야?"
10040110-52 = "우메보시와 감주를 섞어 먹어 본 적은 없지만, 예전에 세미나의 냉장고에 있는 음료수로 실험을 해 본 적은 있어요."
10040110-53 = "인터넷에 그런 말이 있잖아요? 토마토 주스에 타바스코 소스를 뿌리면 피자 맛이 난다던가, 우유에 간장을 섞으면 쌀과자 맛이 난다던가—"
10040110-54 = "으엑…… 그거, 다른 세미나 임원들의 허락은 받았던 거야?"
10040110-58 = "……? 네? 그런 게 허락될 리 없잖아요?"
10040110-59 = "………뭐?"
10040110-61 = "세상 만사를 허락받고 하려면 할 수 있는 게 없다— 이 말입니다. 일단 지르고, 나중에 용서를 구하는 게 훨씬 쉬운 법이니까요!"
10040110-63 = "엄청난 발상의 전환인데……"
10040110-64 = "어쩐지 유우카의 고생이 눈에 선히 보이는 것 같군요."
10040110-66 = "참고로, 용서는 받을 수 있었어?"
10040110-67 = "하…… 용서를 받을 상대가 좋지 않았단 말이죠, 이게……."
10040110-68 = "그렇겠지……."
10040110-69 = "여하튼 요괴 MAX로 실험을 하는 건 처음이라, 기대가 되네요."
10040110-70 = "자, 여러분. 귀찮은 선배들이 돌아오기 전에 빨리 섞어버리자고요!"
10040110-71 = "하지만 멋대로 음료수를 섞어도 괜찮을까? 나중에 치히로 선배에게 들키면 음식 낭비라고 혼날지도 모르는데……"
10040110-72 = "……호오?"
10040110-73 = "이것 참 의외의 모습이네요. 학문을 탐구하고 진리를 추구한다는 베리타스의 해커들이, 고작 선배의 잔소리 때문에 새로운 가능성 앞에서 주저하는 모습을 보이다니."
10040110-74 = "설마, 혹시나 해서 여쭈어보는 것이지만—"
10040110-78 = "……쫄?"
10040110-80 = "누, 누가 쫄았다는 거야?!"
10040110-81 = "어쩐지 듣고 있다 보니 묘하게 승부욕이 타오르는데……"
10040110-82 = "소문대로 세미나의 막내 부원은 사람을 도발하는 데 탁월한 재능을 갖고 있군요."
10040110-83 = "그렇게 말한다 그런다고 겁먹을 줄 알아? 안 그래도 바로 실험해 보려던 참이었거든?"
10040110-84 = "여기 있는 우메보시 맛 <요괴 MAX>에, 쌀로 만든 감주 음료수를 1:1로 섞으면—"
10040110-88 = "……이제 와서 하는 말이지만, 굉장한 비주얼이네요."
10040110-89 = "'이제 와서' 그렇게 말하지 마……."
10040110-91 = "흠. 겉으로 보기에는 적당히 예쁜 분홍색을 띄어서 생각보다 괴식이라는 느낌이 들진 않는데."
10040110-92 = "그래서, 정말로 쌀밥에 우메보시를 올려 먹는 느낌이 드나요?"
10040110-99 = "………아니."
10040110-100 = "달착지근한 쌀의 향에 시큼한 우메보시의 맛이 더해져서……"
10040110-101 = "뭔가, 오래 방치되어서 잔뜩 쉰 밥으로 만든 감주를 마시는 기분이야."
10040110-103 = "역시 실패였나."
10040110-104 = "여러 소리를 조합하여 만든 화음도 언제나 듣기 좋은 법은 아니니까요."
10040110-106 = "아, 그러고 보니~ 우유에 새콤한 음료를 타면 요구르트 맛이 난다고 하는데~"
10040110-107 = "감주와 섞여 살짝 중화된 우메보시 맛 음료수를 우유와 섞으면, 전에 먹어본 적 없는 새로운 요구르트의 맛이 날지도……?"
10040110-108 = "그럴 리가 없잖아. 애초에 요구르트를 만들 때 쓰는 식초는 따로 있고—"
10040110-113 = "마키, 너 설마……"
10040110-114 = "후후. 여기까지 저질러 버렸으면 좀 더 실험해 봐도 달라지는 건 없겠지."
10040110-115 = "자, 그동안 신경 쓰였던 음료수들을 모조리 섞어서 실험해 보자고!"
10040110-117 = "GO!"
10040110-125 = "으음……"
10040110-126 = "으으음……"
10040110-127 = "이상하네. 분명히 향신료 같은 건 한 방울도 섞지 않았을 텐데……"
10040110-128 = "어쩐지 코를 찌르는 듯한 자극적인 냄새가—"
10040110-129 = "게다가 색도 무언가 진한 보랏빛으로 꿈틀거리는 것이, 한 모금만 마셔도 속이 뒤집힐 것 같아."
10040110-130 = "맛이야 어찌 되었든, 이걸 치히로 선배에게 들켰다가는 단순히 혼나는 것만으로는 끝나지 않을 거야."
10040110-131 = "가져온 음료수의 절반을 실험에 써버렸다는 걸 치히로 선배가 알게 된다면—"
10040110-132 = "……음료수의 절반을 어디에 썼다고?"
10040110-138 = "치, 치히로 선배? 언제 돌아온 거야?"
10040110-139 = "방금. 그나저나 방금 이상한 이야기를 들은 것 같은데."
10040110-140 = "그리고 이 용기에 가득 담겨 있는 수상한 주스는 또 뭐고?"
10040110-141 = "그, 그건 그러니까……"
10040110-142 = "마, 맞아! 코유키 쨩이 여러 가지 음료수를 섞으면 신기한 맛이 난다고 해서!"
10040110-144 = "……?????? 여기서 배신을?!"
10040110-146 = "코~유~키~? 편의점을 다녀오는 그새를 못 참고 또 말썽을 저지르다니……"
10040110-147 = "이번만큼은 확실하게 잘못을 짚고 넘어가야겠어!"
10040110-149 = "아니 그게 아니라……!!"
10040110-151 = "으아아아아앙—!!!"
