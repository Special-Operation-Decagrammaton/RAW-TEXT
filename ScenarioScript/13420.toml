[translation]
13420-1 = "제42화;에필로그 1"
13420-2 = "안녕하세요, 선생님. 좋은 아침입니다!"
13420-3 = "아비도스 대책위원회의 하루는 또 바쁘게 시작됩니다."
13420-4 = "……네? 어디서 많이 본 레퍼토리 같다고요?"
13420-5 = "아하하…… 그런가요."
13420-6 = "그러고 보니 납치된 호시노 선배를 구출했던 그때가 정말 오래 전의 일처럼 느껴지네요. 생각해 보면 얼마 되지도 않았는데……."
13420-7 = "네? 선생님도 그런 것 같다고요? 저만 그렇게 느끼는 게 아니라고요?"
13420-8 = "아하하…… 네. 그럼 다행이지만요."
13420-14 = "하아……. 다녀왔습니다."
13420-15 = "세리카 쨩……? 온통 흙투성이가 되어서 어딜 갔다 온 거야? 시로코 선배까지……?"
13420-16 = "오아시스……."
13420-17 = "뭐라고? 아직 포기 못 한 거야?"
13420-18 = "지하 깊숙한 곳에 연쇄반응에 휘말리지 않은 게 있을지도 모르잖아? 그래서 이번엔 시로코 선배도 같이 가서 깊이 파봤는데……."
13420-19 = "8미터까지 파 내려갔는데도 찾을 수 없었어……."
13420-20 = "그때 이미 다 폭발해 버렸나 봐…… 100g에 천만엔……."
13420-25 = "그거 왜 그런 줄 알아, 세리카 쨩?"
13420-26 = "호시노 선배?!"
13420-27 = "설마 우리가 빠트린 조건이……?"
13420-32 = "수영복을 입고 가지 않아서 그런 거야."
13420-33 = "무슨 말도 안 되는 소리야. 우리가 유메 선배나 호시노 선배인 줄 알아?"
13420-34 = "어째서 오아시스가 뻥 하고 터지는 거야? 왜 그런 걸 대비하는데? 오아시스는 빗물이 고이는 거지 지하수가 아니라고."
13420-38 = "아니, 거기 시로코 선배. 그런 것도 알고 있다니 세리카는 대견해, 같은 표정 짓지 말라고."
13420-39 = "흐음. 정론이야, 세리카 쨩. 그치만 전통이랄까, 역사랄까 그런 걸 중요하게 여기는 마음이 부족했던 건 사실 아닐까?"
13420-40 = "다음엔 학교 수영복을 입고 가 보도록 해. 으헤~ 이건 학생회장의 명령이야?"
13420-41 = "으으…… 이럴 때만 학생회장이라고……."
13420-45 = "네, 호시노 선배는 이번에야말로 학생회장 자리를 수락했어요."
13420-46 = "여러 가지 일들이 있었지만…… 결국 호시노 선배는 오랫동안 공석이었던 그 자리를 받아들이게 되었네요."
13420-47 = "아직은 한 발자국씩 조심스럽게 나아갈 뿐이지만……. 그래도 우리들에겐 분명 작지만 큰 변화가 생긴 거겠죠……?"
13420-48 = "네? 저요?"
13420-49 = "아하하…… 이틀 동안 잠깐 해봤지만…… 역시 학생회장 같은 건 제 적성에 맞는 것 같진 않아서……."
13420-55 = "이 정도면 될까요? 의장?"
13420-59 = "……아니. 멀었잖아. <뇌제>가 남긴 건 조각 하나, 파편 하나 남기지 마라."
13420-60 = "네, 넵!"
13420-62 = "폭약을 더 가져와!"
13420-66 = "……."
13420-73 = "학생회장들의 계곡에 있던 게헨나의 흔적들은 만마전의 의장님과 선도부장님이 직접 와서 처리해 주었습니다."
13420-74 = "두 사람은 서로를 끔찍이도 싫어하는 견원지간이라고 들었는데…… 이상하게도 이때만큼은 두 사람은 전혀 싸우는 모습을 보여주지 않았어요."
13420-75 = "자세한 설명을 해주진 않아서 모르겠지만…… 과거에 무슨 일이 있었던 걸까요……?"
13420-77 = "카이저 프레지던트는 병원에 칩거해서 모습을 드러내지 않고 있습니다."
13420-78 = "노리고 있던 열차포도 저희가 부숴버렸기 때문에 목표를 잃었기 때문일까요……?"
13420-79 = "하지만 여전히 아비도스의 빚은 카이저에게 지고 있기 때문에…… 카이저의 동향은 계속 예의 주시하지 않으면 안 되겠죠."
13420-82 = "저 돌아왔어요~♧"
13420-83 = "오, 노노미 쨩. 어떻게 됐어?"
13420-84 = "네, 전철 노선 복구는 잘 끝났고, 시범 운행만 남았어요!"
13420-85 = "다음 주 중에는 본격적으로 3개 구간이 운영될 수 있을 것 같고요."
13420-86 = "오오, 드디어!"
13420-87 = "헤에~ 꽤 빠르잖아."
13420-91 = "아, 좋은 소식들도 있습니다!"
13420-92 = "저번의 그 사건 이후에 네프티스 기업이 아비도스 자치구에 재투자를 결정했습니다."
13420-93 = "하이랜더 학원과 협력해서 그동안 단절되어 있던 아비도스 전철을 사막횡단철도의 일부 노선과 연결하는 정도의 작은 사업이지만……."
13420-94 = "그래도 이걸로 아비도스 자치구의 교통이 조금은 더 좋아져서…… 지금보다 좀 더 많은 사람들이 왕래할 수 있게 되면 좋겠네요."
13420-97 = "좋아, 움직인다."
13420-98 = "전철 내부는 어때?"
13420-101 = "네. 문제없이 잘 움직이네요."
13420-103 = "(안절부절) 문제는 없는 거겠죠?"
13420-104 = "뭐, 그렇지 않을까요? CCC에서는 나 몰라라 했지만, 의외로 감리실에서 적극적으로 나서줘서 진행은 제대로 되었으니까요."
13420-105 = "그러나 수익성이 없는 사업이라…… 이것도 잘못되면 저희는……."
13420-106 = "어허, 거참 불길한 소릴."
13420-107 = "그래도 올겨울쯤에는 아비도스 중앙선을 복구시킬 수 있을 거고, 그러면 이 사업도 큰 손해는 나지 않을 겁니다."
13420-111 = "……."
13420-112 = "감독관?"
13420-113 = "아아."
13420-114 = "폐교된 지 오래된 중학교잖아요……? 여기 무슨 볼일이 있는 겁니까?"
13420-115 = "아니. 지나가다가 보이길래 들어와 본 것뿐이야."
13420-116 = "뭐, 아비도스 자치구엔 이런 폐교가 여럿 있으니까요."
13420-117 = "그것보단 저쪽에 CCC에서 담당하고 있는 곳으로 가보셔야 할 것 같습니다."
13420-118 = "……쌍둥이들인가?"
13420-119 = "네에, 그 간부님들은 도무지 저희가 상대하긴 힘들어서……."
13420-123 = "아, 앗!? 기, 기다려주세요, 감독관? 같이 가요!"
13420-134 = "그 때문인지는 몰라도 어쩐지 아비도스 자치구에 다시 활기가 돌아오는 느낌이 들어요."
13420-135 = "오랫동안 침체기였던 아비도스 시내에도 새로운 가게들이 생겨나기 시작했고요."
13420-136 = "……그중에는 구면인 분들도 계시지만."
13420-137 = "이봐. 이쪽의 통로는 우리 가게 광고판을 세울 자리거든?"
13420-138 = "아니, 여기는 100년 전부터 우리 가게 자리였다."
13420-139 = "해보자는 거냐, 쫄딱 망한 회사나 운영했던 주제에."
13420-140 = "네놈의 회사도 나랑 같이 망해놓고 무슨! 바라던 바다!"
13420-145 = "……한심한 녀석들."
13420-146 = "후…… 이런 상점가에서 다시 시작해야 한다니……."
13420-148 = "이런 자치구 따위 몇 년 안에 탈출해 드리겠습니다……."
13420-150 = "그리고…… 또 다른 시로코 씨의 소식은…… 그때 이후로 더 이상 들려오지 않았어요."
13420-151 = "선생님도 행방을 알 수 없는 거야?"
13420-152 = "[s] \"응……. 내 힘으로도 그건 무리야.\""
13420-153 = "그렇구만……. 으음……."
13420-154 = "……."
13420-158 = "뭐어, 무소식이 희소식이라잖아! 그쪽은 우리보다 훨씬 경험도 많으니까, 잘 지내고 있겠지!"
13420-159 = "으응…… 그렇겠지."
13420-164 = "……네. 언젠가는 다시 또 우연히라도 만날 수 있겠죠?"
13420-165 = "아직 고맙다는 인사도 못했는데……."
13420-173 = "다음화;에필로그 2"
