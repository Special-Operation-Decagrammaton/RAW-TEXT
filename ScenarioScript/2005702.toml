[translation]
2005702-1 = "這就是我的日常"
2005702-3 = ""
2005702-4 = "啊，是老師！"
2005702-5 = "您好，老師！您在參觀課程嗎？"
2005702-6 = "您覺得我們的課程如何呢？"
2005702-7 = "[s] 「千年的課程我也不太懂……」"
2005702-8 = "其實沒有那麼難哦！下次要一起研究嗎？"
2005702-9 = ""
2005702-12 = ""
2005702-19 = ""
2005702-21 = ""
2005702-22 = "啊，朱音……"
2005702-23 = "……同學。"
2005702-25 = "是的，您好。"
2005702-26 = "……"
2005702-27 = "能這樣見到「老師」，我很開心。"
2005702-29 = "朱音同學……要一起嗎？"
2005702-31 = "……"
2005702-32 = "謝謝您的邀請，不過……"
2005702-33 = "呵呵。似乎會打擾到各位愉快的時光，所以我還是心領了。"
2005702-34 = "那麼老師、各位，我先失陪了。"
2005702-35 = ""
2005702-37 = ""
2005702-38 = "[ns] 「朱音……？」"
2005702-39 = "哎呀……"
2005702-40 = "明明不是那樣的，真是的……"
2005702-41 = "怎麼說呢……朱音他有點難以接近的感覺？"
2005702-42 = ""
2005702-44 = "對啊對啊。明明是同學的說。"
2005702-45 = "沒辦法，畢竟C&C的工作也很忙吧。"
2005702-48 = "可是你不覺得很奇怪嗎？#n什麼有名的特務祕密組織之類的。"
2005702-49 = "你不懂啦。說不定那反而是C&C的亮點呢。"
2005702-50 = "不管請他幫什麼忙都會答應，做事既細心又確實，感覺一切都很好……"
2005702-51 = "反而是因為這樣嗎？"
2005702-52 = "嗯，就是有種高嶺之花，難以接近的感覺。"
2005702-53 = ""
2005702-55 = ""
2005702-57 = "[ns] （……）"
2005702-59 = "[ns] （果然還是有點在意朱音）"
2005702-68 = ""
2005702-69 = "您好，老師。要回去了嗎？"
2005702-70 = "[s] 「朱音！」"
2005702-72 = "[ns] 「難道是在等我嗎？」"
2005702-73 = "呵呵，是的。#n既然老師親自來訪，這點小事是應該的。"
2005702-74 = "那麼，我先告辭了。"
2005702-75 = "[s]「咦……？」"
2005702-78 = "怎麼說呢……朱音他有點難以接近的感覺？"
2005702-79 = "對啊對啊。明明是同學的說。"
2005702-80 = "不管請他幫什麼忙都會答應，做事既細心又確實，感覺一切都很好……"
2005702-81 = "嗯，就是有種高嶺之花，難以接近的感覺。"
2005702-83 = "[ns] 「等一下！」"
2005702-84 = ""
2005702-85 = "是的？怎麼了嗎？"
2005702-86 = "要一起回去……是嗎？"
2005702-87 = ""
2005702-89 = ""
2005702-90 = "……"
2005702-91 = "我知道了，「主人」。"
2005702-92 = "謝謝您願意送我。"
2005702-93 = "哎呀……至少在穿著制服的時候，希望我不要使用那個稱呼是嗎？"
2005702-94 = "我明白了……老師。"
2005702-95 = "那麼這段時間，就請您多多指教了。"
2005702-103 = "（和朱音並肩走在傍晚的路上）"
2005702-104 = "（出乎意料地，維持著一種微妙的沉默……）"
2005702-107 = "[ns] 「那個……朱音？」"
2005702-108 = "是？怎麼了嗎？"
2005702-109 = "今天的我，似乎和老師印象中有點不同是嗎？"
2005702-110 = "……"
2005702-111 = "關於這點我很抱歉，老師。"
2005702-112 = "不過在學校裡的我，通常都是這種感覺。"
2005702-113 = "[s1] 「這，這樣啊……」\n[s2] 「你跟學校裡的那些孩子是什麼關係？」"
2005702-116 = "那些孩子嗎？"
2005702-117 = "就是……會在學校見面，偶爾聊聊天……#n遇到「社團」活動的時候就請他們多多包涵……"
2005702-118 = "大概就是這樣吧。"
2005702-120 = "（微妙的沉默再度蔓延……）"
2005702-123 = "老師？"
2005702-124 = "[s] 「嗯？」"
2005702-125 = "您果然會在意嗎？"
2005702-126 = "[s]「這，這個嘛……」"
2005702-127 = "……"
2005702-128 = ""
2005702-130 = ""
2005702-131 = "我原本就有點格格不入。"
2005702-132 = "就連在社團裡……也是這樣。"
2005702-133 = "部長在某種意義上可以跟任何人豪爽相處，所以先不列入討論。"
2005702-134 = "明日奈前輩也……不，應該說明日奈前輩才是能毫無理由地和所有人親近的類型。"
2005702-135 = "而花凜他……呵呵。意外地和數學不好的千年學生們相處得不錯。"
2005702-136 = "至於季醬……"
2005702-137 = "……"
2005702-138 = "呵呵。季醬光是看著就會想幫忙對吧？"
2005702-139 = "……"
2005702-140 = "不過，我跟他們都不一樣。#n雖然和大家相處得還算融洽……"
2005702-141 = "但反過來說……也可能是和任何人都無法接近到一定程度的人。"
2005702-142 = ""
2005702-145 = "呵呵。老師的那種表情，好像還是第一次見到呢。"
2005702-146 = "您果然也認為我必須設法改善這種情況嗎？"
2005702-147 = "[s] 「唔嗯……倒也不至於。」"
2005702-148 = "咦……？"
2005702-149 = "真的嗎？"
2005702-150 = "[s3] 「嗯。如果朱音覺得好的話，或許那樣也不錯。」\n[s4] 「畢竟世界上本來就有各式各樣的人。」"
2005702-153 = "可，可是大家不是都說……盡量跟其他人親近一點比較好嗎？"
2005702-154 = "應該更積極開朗一點，跟大家好來好去之類的……"
2005702-155 = "[s5] 「但是那樣的話……」\n[s6] 「對某些人來說，反而可能是過度的關心吧？」"
2005702-158 = "……"
2005702-159 = "您的意思是，真正重要的是我的感受……"
2005702-160 = "以及我自己是如何看待這件事的嗎……？"
2005702-161 = "[s7] 「嗯。如果覺得無所謂的話，維持現狀也沒關係。」\n[s8] 「我是說認真的。」"
