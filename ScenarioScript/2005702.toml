[translation]
2005702-1 = "นี่คือชีวิตประจำวันของฉัน"
2005702-3 = ""
2005702-4 = "อ๊ะ คุณครูนี่นา!"
2005702-5 = "สวัสดีค่ะ คุณครู! มาสังเกตการณ์การเรียนใช่มั้ยคะ?"
2005702-6 = "คลาสที่ฉันเข้าเรียนเป็นยังไงบ้างคะ?"
2005702-7 = "[s] \"ครูก็ไม่ค่อยเข้าใจคลาสของมิลเลเนียมเท่าไร...\""
2005702-8 = "ไม่มีอะไรยากหรอกค่ะ! ไว้วันหลังมาศึกษาด้วยกันมั้ยคะ?"
2005702-9 = ""
2005702-12 = ""
2005702-19 = ""
2005702-21 = ""
2005702-22 = "อ๊ะ คุณ..."
2005702-23 = "อาคาเนะ..."
2005702-25 = "ค่ะ สวัสดีค่ะ "
2005702-26 = "..."
2005702-27 = "น่าดีใจจังเลยนะคะที่ได้เจอ 'คุณครู' แบบนี้ด้วย"
2005702-29 = "คุณ... อาคาเนะ... ก็มาคุย... ด้วยกันสิ"
2005702-31 = "..."
2005702-32 = "ขอบคุณที่ชวนค่ะ แต่ว่า..."
2005702-33 = "ฮุฮุ ไม่ดีกว่าค่ะ ฉันไม่อยากรบกวนช่วงเวลาแห่งความสุขนี้น่ะค่ะ"
2005702-34 = "งั้นฉันขอตัวก่อนนะคะ คุณครู ทุกคน"
2005702-35 = ""
2005702-37 = ""
2005702-38 = "[ns] \"อาคาเนะ...?\""
2005702-39 = "เอ๋..."
2005702-40 = "ก็ไม่ได้รบกวนนี่นา จริงๆ เลย..."
2005702-41 = "กับอาคาเนะน่ะ... ฉันรู้สึกประหม่าที่จะเข้าไปคุยด้วยยังไงไม่รู้นะ"
2005702-42 = ""
2005702-44 = "ใช่ๆ เราเป็นเพื่อนร่วมชั้นกันแท้ๆ เชียว"
2005702-45 = "ก็นะ ทางนั้นก็น่าจะยุ่งกับงาน C&C ด้วย"
2005702-48 = "แต่มันก็น่าขำไม่ใช่เหรอ? แล้วบอกว่าตัวเองเป็นองค์กรลับที่มีแต่สายลับชื่อดัง"
2005702-49 = "เธอนี่ไม่รู้อะไรซะแล้ว ก็นั่นละจุดขายที่สำคัญของ C&C"
2005702-50 = "ก็นะ พวกนั้นน่ะยินดีทำทุกอย่างให้ตามคำขอ ไหนจะละเอียดรอบคอบและฝีมือฉกาจ ทุกอย่างดีไปหมด เสียอยู่อย่างเดียว..."
2005702-51 = "ไม่สิ ต้องบอกว่าเพราะแบบนั้นต่างหากล่ะ"
2005702-52 = "ใช่มั้ยล่ะ? พอจะเข้าใจฟีลใช่มั้ย? เหมือนกับดอกไม้ที่อยู่บนหน้าผาเลยเนอะ?"
2005702-53 = ""
2005702-55 = ""
2005702-57 = "[ns] (...)"
2005702-59 = "[ns] (รู้สึกคาใจเรื่องอาคาเนะจัง)"
2005702-68 = ""
2005702-69 = "สวัสดีค่ะ คุณครู จะกลับแล้วเหรอคะ?"
2005702-70 = "[s] \"อาคาเนะ!\""
2005702-72 = "[ns] \"มารอครูอยู่เหรอ?\""
2005702-73 = "ฮุฮุ ใช่ค่ะ คุณครูอุตส่าห์แวะมาทั้งที เรื่องแค่นี้ฉันทำให้ได้อยู่แล้วค่ะ"
2005702-74 = "ถ้างั้นฉันขอตัวก่อนนะคะ"
2005702-75 = "[s] \"หะ... หา...?\""
2005702-78 = "กับอาคาเนะน่ะ... ฉันรู้สึกประหม่าที่จะเข้าไปคุยด้วยยังไงไม่รู้นะ"
2005702-79 = "ใช่ๆ เราเป็นเพื่อนร่วมชั้นกันแท้ๆ เชียว"
2005702-80 = "ก็นะ พวกนั้นน่ะยินดีทำทุกอย่างให้ตามคำขอ ไหนจะละเอียดรอบคอบและฝีมือฉกาจ ทุกอย่างดีไปหมด เสียอยู่อย่างเดียว..."
2005702-81 = "ใช่มั้ยล่ะ? พอจะเข้าใจฟีลใช่มั้ย? เหมือนกับดอกไม้ที่อยู่บนหน้าผาเลยเนอะ?"
2005702-83 = "[ns] \"เดี๋ยวก่อน!\""
2005702-84 = ""
2005702-85 = "คะ? ทำไมเหรอคะ?"
2005702-86 = "ชวนกลับ... ด้วยกันงั้นเหรอคะ?"
2005702-87 = ""
2005702-89 = ""
2005702-90 = "..."
2005702-91 = "เข้าใจแล้วค่ะ 'นายท่าน'"
2005702-92 = "ขอบคุณที่มาส่งนะคะ"
2005702-93 = "ตายจริง ถ้าฉันอยู่ในชุดนักเรียน ก็ขออย่าให้เรียกกันด้วยคำเรียกนั้นเหรอคะ?"
2005702-94 = "ค่ะ... คุณครู"
2005702-95 = "ถ้างั้นช่วงที่เป็นนักเรียน ฉันก็ขอฝากตัวด้วยนะคะ"
2005702-103 = "(คุณครูเดินเคียงข้างอาคาเนะไปตามถนนยามเย็น)"
2005702-104 = "(แต่ก็มีเพียงความเงียบที่แปลกประหลาดระหว่างสองคน...)"
2005702-107 = "[ns] \"เอ่อ อาคาเนะ?\""
2005702-108 = "คะ? ทำไมเหรอคะ?"
2005702-109 = "ฉันในตอนนี้ดูแตกต่างกับฉันที่คุณครูเคยรู้จักงั้นเหรอคะ?"
2005702-110 = "..."
2005702-111 = "เรื่องนั้นฉันต้องขอโทษด้วยค่ะ คุณครู"
2005702-112 = "แต่เวลาอยู่ในโรงเรียน ปกติแล้วฉันจะเป็นแบบนี้ละค่ะ"
2005702-113 = "[s1] \"ยะ... อย่างนั้นสินะ แล้วกับเด็กคนอื่นล่ะ?\"\n[s2] \"แล้วกับเด็กคนอื่นที่โรงเรียนล่ะ เป็นยังไงบ้าง?\""
2005702-116 = "เด็กคนอื่นเหรอคะ?"
2005702-117 = "ก็... พอมาโรงเรียนก็ได้เจอกัน ได้คุยกัน... เวลามีงานของ 'ชมรม' ฉันก็จะขอตัวออกไป..."
2005702-118 = "ก็น่าจะ... ประมาณนั้นนะคะ"
2005702-120 = "(แล้วก็เกิดความเงียบอันแปลกประหลาดอีกครั้ง...)"
2005702-123 = "คุณครู?"
2005702-124 = "[s] \"หะ... หืม?\""
2005702-125 = "คุณครูกังวลเรื่องนี้เหรอคะ?"
2005702-126 = "[s] \"คะ... คือว่า...\""
2005702-127 = "..."
2005702-128 = ""
2005702-130 = ""
2005702-131 = "ปกติฉันชอบแยกตัวออกมาค่ะ"
2005702-132 = "ชมรมของฉัน... ก็เป็นแบบนี้เหมือนกันค่ะ"
2005702-133 = "หัวหน้าเป็นคนที่เข้ากับทุกคนได้ดีมากๆ อยู่แล้วในบางแง่ งั้นฉันจะขอข้ามไปนะคะ"
2005702-134 = "งั้นก็คงเหมือนรุ่นพี่อาสึนะ... ไม่สิ รุ่นพี่อาสึนะเป็นคนที่เข้ากับทุกคนได้ดีจริงๆ โดยไม่ต้องตีความเพิ่ม#nว่าในแง่ไหนค่ะ"
2005702-135 = "ส่วนคารินก็... ฮุฮุ น่าประหลาดใจที่ดูเหมือนจะเข้าได้ดีกับนักเรียนมิลเลเนียมที่อ่อนวิชาคณิตศาสตร์#nด้วยกันนะคะ"
2005702-136 = "ส่วนโทคิจัง..."
2005702-137 = "..."
2005702-138 = "ฮุฮุ แค่เห็นโทคิจังก็รู้สึกอยากเข้าไปช่วยอะไรแล้ว ว่ามั้ยคะ?"
2005702-139 = "..."
2005702-140 = "แต่ว่า... ฉันไม่เป็นแบบนั้นค่ะ ฉันก็พอเข้ากับทุกคนได้บ้าง"
2005702-141 = "แต่ในทางกลับกัน... ฉันอาจเป็นนักเรียนที่คนอื่นรู้สึกอึดอัดที่จะเข้าหากันก็ได้ค่ะ"
2005702-142 = ""
2005702-145 = "ฮุฮุ สีหน้าแบบนี้ ฉันเพิ่งเคยเห็นเป็นครั้งแรกเลยนะคะ คุณครู"
2005702-146 = "คุณครูเองก็คิดว่าฉันควรแก้ไขพฤติกรรมแบบนี้ใช่มั้ยคะ?"
2005702-147 = "[s] \"อืม... ครูก็ไม่ได้คิดอย่างนั้นหรอก\""
2005702-148 = "คะ...?"
2005702-149 = "ตอบจริง... หรือเปล่าคะ?"
2005702-150 = "[s3] \"อื้อ ถ้าอาคาเนะชอบแบบนั้น ครูก็ว่ามันก็ไม่เลวหรอก\"\n[s4] \"โลกนี้ก็มีคนที่แตกต่างกันบ้างเป็นธรรมดา\""
2005702-153 = "ตะ... แต่ว่า ทุกคนต่างก็บอกว่าควรอยู่ร่วมกันอย่างสนิทสนมไม่ใช่เหรอคะ...?"
2005702-154 = "และถ้าเลือกได้ การอยู่ใกล้ชิดกันไว้ก็ไม่เสียหาย..."
2005702-155 = "[s5] \"แต่บางคนก็อาจรู้สึกหนักใจกับการเข้าหาคนอื่นนะ\"\n[s6] \"แต่บางคนก็อาจมองว่าเป็นการชักชวนที่มากไปนะ\""
2005702-158 = "..."
2005702-159 = "คุณครูจะบอกว่าสิ่งที่สำคัญก็คือ... ความรู้สึกของฉัน"
2005702-160 = "และให้ฉันทบทวนตัวเองว่ารู้สึกยังไงเกี่ยวกับส่วนนั้นงั้นเหรอคะ?"
2005702-161 = "[s7] \"อื้อ ถ้าไม่ได้รู้สึกไม่ดีอะไร ก็ให้เป็นแบบนั้นไปได้\"\n[s8] \"ครูพูดจริงนะ เอาความรู้สึกของเราเป็นสำคัญเถอะ\""
