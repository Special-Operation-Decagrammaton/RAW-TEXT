[translation]
2005702-1 = "여기가 저의 일상입니다."
2005702-4 = "아, 선생님이다!"
2005702-5 = "안녕하세요, 선생님! 수업 참관하고 계셨죠?"
2005702-6 = "우리 수업 어땠어요?"
2005702-7 = "[s] \"밀레니엄 수업은 나도 잘 모르겠더라…….\""
2005702-8 = "별거 없어요! 나중에 같이 연구해 보실래요?"
2005702-22 = "앗, 아카네……."
2005702-23 = "……씨."
2005702-25 = "네. 안녕하세요."
2005702-26 = "……."
2005702-27 = "'선생님'을 이렇게 뵐 수 있다니, 정말 반가운 일이네요."
2005702-29 = "아카네…… 씨도 같이 이야기하지…… 않을래?"
2005702-31 = "……."
2005702-32 = "말씀 감사합니다. 그렇지만……."
2005702-33 = "후후. 아니요. 역시 즐거운 시간을 빼앗는 것 같아서, 죄송하네요."
2005702-34 = "먼저 가 보겠습니다. 선생님. 여러분."
2005702-38 = "[ns] \"아카네……?\""
2005702-39 = "어라……."
2005702-40 = "그런 거 아닌데, 참……."
2005702-41 = "아카네…… 뭔가 다가가기가 약간 부담스럽다고 할까, 그런 게 있지?"
2005702-44 = "맞아, 맞아. 동급생인데."
2005702-45 = "뭐, C&C 일로도 바쁠 테니까."
2005702-48 = "그런데 그거 뭔가 웃기지 않아? 유명한 에이전트 비밀 조직이라니."
2005702-49 = "뭘 모르네. 오히려 그게 C&C에게는 셀링 포인트일지도 모르는 일이라고."
2005702-50 = "참, 부탁하면 다 들어 주고, 꼼꼼하고, 솜씨도 좋고 다 좋은데……."
2005702-51 = "아니야. 오히려 그렇기 때문에?"
2005702-52 = "있지, 있어. 그런 거. 절벽 위의 꽃이라는 느낌?"
2005702-57 = "[ns] (…….)"
2005702-59 = "[ns] (역시 아카네가 어딘가 마음에 걸렸다.)"
2005702-69 = "안녕하세요, 선생님. 돌아가시나요?"
2005702-70 = "[s] \"아카네!\""
2005702-72 = "[ns] \"혹시 기다려 준 거야?\""
2005702-73 = "후후. 네. 선생님이 직접 찾아와 주셨는데 이 정도는 당연한 일이죠."
2005702-74 = "그러면, 저는 이만 가 보겠습니다."
2005702-75 = "[s] \"어, 어어……?\""
2005702-78 = "아카네…… 뭔가 다가가기 약간 부담스럽다고 할까, 그런 게 있지?"
2005702-79 = "맞아, 맞아. 동급생인데."
2005702-80 = "참, 부탁하면 다 들어 주고, 꼼꼼하고, 솜씨도 좋고 다 좋은데……."
2005702-81 = "있지, 있어. 그런 거. 절벽 위의 꽃이라는 느낌?"
2005702-83 = "[ns] \"잠깐만!\""
2005702-85 = "네? 왜 그러시나요?"
2005702-86 = "같이…… 돌아가자고요?"
2005702-90 = "……."
2005702-91 = "알겠습니다. '주인님.'"
2005702-92 = "배웅, 감사해요."
2005702-93 = "어머나. 적어도 교복을 입고 있을 때만큼은 그 호칭으로 부르지 말아 줬으면 하신다고요?"
2005702-94 = "네……. 선생님."
2005702-95 = "그렇다면 당분간, 잘 부탁드리겠습니다."
2005702-103 = "(아카네와 나란히, 저녁 길을 걸었다.)"
2005702-104 = "(의외로, 묘한 침묵이 이어지고 있었다…….)"
2005702-107 = "[ns] \"저, 아카네?\""
2005702-108 = "네? 왜 그러세요?"
2005702-109 = "오늘 제 모습이, 선생님께서 알던 저와 조금 다른 것 같다고요?"
2005702-110 = "……."
2005702-111 = "그 부분은 죄송합니다. 선생님."
2005702-112 = "하지만 학교에서의 저는, 보통 이런 느낌이에요."
2005702-113 = "[s1] \"그, 그렇구나…….\"\n[s2] \"학교에서 그 애들은, 어떤 애들이야?\""
2005702-116 = "그 애들이요?"
2005702-117 = "그냥……. 학교에 와서 만나고, 이야기하고……. 제 '동아리' 활동이 있을 때는 양해를 구하고……."
2005702-118 = "그런 정도, 겠네요."
2005702-120 = "(다시, 묘한 침묵이 이어졌다…….)"
2005702-123 = "선생님?"
2005702-124 = "[s] \"으, 응?\""
2005702-125 = "역시, 신경 쓰이시나요?"
2005702-126 = "[s] \"그, 그게…….\""
2005702-127 = "……."
2005702-131 = "저는, 원래 조금 겉돌아요."
2005702-132 = "동아리에서도…… 마찬가지죠."
2005702-133 = "부장님은 어떤 의미로는 모든 사람과 호쾌하게 지낼 수 있는 분이니, 논외로 할게요."
2005702-134 = "아스나 선배 역시…… 아뇨. 아스나 선배야말로 다른 의미나 해석의 여지없이, 모두와 친하게 지낼 수 있는 분이죠."
2005702-135 = "카린은…… 후후. 의외로 수학에 약한 밀레니엄 학생분들과, 동질감 속에서 잘 지내고 있는 모양이더라고요."
2005702-136 = "토키 쨩은……."
2005702-137 = "……."
2005702-138 = "후훗. 토키 쨩은 보고만 있어도 뭔가 도와주고 싶어지지 않나요?"
2005702-139 = "……."
2005702-140 = "하지만, 저는 그렇지 않죠. 모두와 그럭저럭 잘 지낼 수는 있지만."
2005702-141 = "반대로, 누구와도…… 일정 거리 이상으로는 다가가기 어려운 학생일 수도 있어요."
2005702-145 = "후후. 처음 보는 표정을 보여주고 계시네요, 선생님."
2005702-146 = "역시 선생님도 이런 제 행동을 교정해야겠다고 생각하시나요?"
2005702-147 = "[s] \"으음……. 그렇게까지는 생각하지 않아.\""
2005702-148 = "네……?"
2005702-149 = "진심, 이신가요?"
2005702-150 = "[s3] \"응. 아카네가 좋다면, 그걸로도 나쁘지 않다고 생각해.\"\n[s4] \"세상에는 그런 사람도 있는 법이니까.\""
2005702-153 = "하, 하지만 다들…… 두루두루 친하게 지내는 게 좋다고, 하잖아요……?"
2005702-154 = "이왕이면 포지티브한 게 좋다고, 좋은 게 좋은 거라고……."
2005702-155 = "[s5] \"그렇지만 그게 오히려.\"\n[s6] \"과도한 권유로 느껴지는 사람도, 분명 있지 않을까?\""
2005702-158 = "……."
2005702-159 = "중요한 건, 제 감정이라는 말씀인가요……?"
2005702-160 = "그 부분에 대해서, 저는 어떻게 느끼냐고요?"
2005702-161 = "[s7] \"응. 아무렇지도 않다면, 그걸로 좋아.\"\n[s8] \"이건 진지하게 하는 말이란다.\""
2005702-180 = "어라……?"
2005702-183 = "[ns] \"아카네?\""
2005702-184 = "아."
2005702-185 = "죄송해요."
2005702-189 = "……."
2005702-190 = "저는, 역시."
2005702-191 = "조금뿐일지도 모르지만."
2005702-193 = "외로웠나, 봐요."
2005702-194 = "분명, 괜찮을 거라고, 생각했는데."
2005702-195 = "죄송해요, 선생님."
2005702-196 = "정말로…… 죄송해요."
2005702-199 = "[ns] \"괜찮아.\""
2005702-201 = "[ns] \"그러니까 같이 노력해 보자.\""
2005702-206 = "……네."
