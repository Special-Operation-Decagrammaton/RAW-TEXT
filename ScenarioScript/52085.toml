[translation]
52085-15 = "하아, 하아……"
52085-16 = "……아직, 아직이야!"
52085-21 = "……나구사 쨩 주제에 끈질기네요."
52085-22 = "예상했던 것보다 시간이 오래 걸리는데—"
52085-29 = "나구사 선배!"
52085-30 = "방금 총성이 들린 것 같은데…… 이게 무슨 일이야?"
52085-31 = "선배, 무사하셔요?"
52085-36 = "[ns] \"나구사, 괜찮아?!\""
52085-37 = "나는 괜찮아. 그보다 화조풍월부의 괴담가가……"
52085-38 = "윽, 백화요란 녀석들과 샬레의 선생이 벌써 와버렸나요."
52085-42 = "저 소녀는……"
52085-43 = "앗, 그때의 건방진 꼬맹이 녀석이잖아!"
52085-48 = "누가 건방진 꼬맹이라는 거야!"
52085-49 = "쳇, 조금만 더 빠르게 몰아붙였으면 나구사를 제압할 수 있었을텐데."
52085-50 = "……하는 수 없지요. 어차피 여러분이 북쪽의 땅에 발을 들인 이상 이야기를 재개할 기회는 또 있을 테니."
52085-54 = "오늘은 여기서 이만 물러나도록 할까요."
52085-59 = "누가 이대로 보내줄 것 같으냐!"
52085-60 = "렌게, 유카리. 이번에야말로 놓쳐서는 안 돼!"
52085-80 = "아, 아앗! 놓쳤사와요!"
52085-81 = "제길! 콩알만한 주제에 족제비처럼 재빠르기는……"
52085-86 = "후후, 그런 굼벵이 같은 속도로는 십 년이 지나도 날 못 따라잡을걸?"
52085-87 = "그럼 다음을 기약하며 오늘은 이만—"
52085-93 = "어, 어라……?"
52085-99 = "우냐아아아아악!"
52085-108 = "……다행히 좋은 타이밍에 도착한 것 같네."
52085-109 = "모두 다치지는 않았지?"
52085-113 = "이 목소리는……"
52085-114 = "설마……"
52085-121 = "오랜만이야, 나구사."
52085-125 = "다들 정말 보고 싶었어."
52085-131 = "………아야메!"
52085-133 = "다음화;백화요란의 부장"
