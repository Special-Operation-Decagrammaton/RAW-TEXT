[translation]
1001002-1 = "러닝 머신"
1001002-2 = "키보토스 거리"
1001002-3 = "(시로코의 아침 러닝 코스에서 시로코를 기다리고 있다.)"
1001002-5 = "음."
1001002-6 = "선생님. 오래 기다렸어?"
1001002-7 = "[s] \"아니, 방금 도착한 참이야.\""
1001002-8 = "……그렇구나."
1001002-9 = "이렇게 길에서 선생님을 만나니 다른 느낌이야."
1001002-10 = "어쩐지 선생님과 처음 만났을 때가 떠오르기도 하고……."
1001002-11 = "운동을 하고 있으면 좋은 일이 자주 생기는 것 같아."
1001002-12 = "[s] \"시로코는 운동을 좋아하는구나?\""
1001002-13 = "음……."
1001002-14 = "아침부터 땀을 흘리고 하루를 시작하면 기분이 좋거든."
1001002-15 = "……."
1001002-16 = "아, 물론 학교에서 샤워를 하니까……."
1001002-17 = "음."
1001002-18 = "괜찮으면 선생님도 나랑 같이 아침 러닝 하지 않을래?"
1001002-19 = "[s1] \"아침부터 러닝은 조금……\"\n[s2] \"하루 종일 힘이 빠질 것 같으니 사양할게.\""
1001002-20 = "으음, 하긴. 오늘은 슈퍼에 들려서 쇼핑하기로 한 날이니……. 운동은 다음에 하고."
1001002-21 = "으음, 하긴. 오늘은 슈퍼에 들려서 쇼핑하기로 한 날이니……. 운동은 다음에 하고."
1001002-22 = "아, 슈퍼는 저쪽 방향에 있어."
1001002-23 = "금방이니까, 그럼 가볍게 뛰어볼까."
1001002-25 = "[s] 시로코를 쫓아간다."
1001002-27 = "(1시간 뒤)"
1001002-32 = "……."
1001002-33 = "[s] \"헉…… 헉…… 헉……\""
1001002-34 = "음……."
1001002-35 = "한참동안 안와서 기다리고 있었어……."
1001002-36 = "내가 너무 빨랐나……. 미안."
1001002-37 = "주변을 보지 않고 앞만 본다는 얘기를 많이 듣긴 하는데……."
1001002-38 = "[s3] \"……슈퍼는 어디에 있어?\"\n[s4] \"1시간이나 달렸는데…….\""
1001002-39 = "아아……."
1001002-40 = "아아……."
1001002-41 = "이제 절반 정도?"
1001002-42 = "[s] \"절반?!\""
1001002-43 = "1시간만 더 뛰면 돼. 이번엔 속도를 늦출 테니까, 같이 가자, 선생님."
1001002-45 = "[s] \"기, 기다려!\""
1001002-47 = "(뛰어나가는 시로코를 말려서 같이 걷기로 했다.)"
1001002-48 = "(그 후, 2시간을 더 걸었다.)"
1001002-50 = "드디어 도착 했어. 여기가 말했던 그 슈퍼야."
1001002-51 = "……응?"
1001002-52 = "선생님…… 괜찮아? 안색이 안좋아보이는데……."
1001002-53 = "[s] \"이 슈퍼는 약속 장소에서 얼마나 멀리 떨어져 있었던 거야?\""
1001002-54 = "음, 15km 정도……?"
1001002-55 = "아침 러닝을 하고 돌아오는 길에 들르기에 딱 좋은 거리지."
1001002-56 = "원래는 더 멀리 떨어진 곳의 편의점에 갈까 했는데, 오늘은 선생님도 있으니 번거롭지 않게 가까운 곳을 택했어."
1001002-57 = "이 정도 거리면 제법 걸을 만 하지?"
1001002-58 = "아……. 벌써 누우면 안돼, 선생님. 돌아가려면 다시 15km를 걸어야 하니까……."
1001002-59 = "[s] \"죽여줘…….\""
1001002-60 = "으, 으음……."
