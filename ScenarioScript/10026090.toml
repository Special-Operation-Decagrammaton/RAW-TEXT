[translation]
10026090-1 = "제9화;섬의 가장 깊은 곳"
10026090-3 = "하아, 하아……. 하아……."
10026090-4 = "하아…… 죽겠다……. 진짜 힘들어……. 하아……."
10026090-5 = "여기쯤이면……. 괜찮은 것 같네요. 더는 쫓아오지 않는 것 같아요."
10026090-6 = "다들 잘 오셨나요?"
10026090-10 = "진짜……. 헥……. 헤엑……. 대체……."
10026090-11 = "[s1] \"전원 무사한 것 같네.\"\n[s2] \"괜찮아 보여서 다행이야.\""
10026090-14 = "하아, 하아……. 하아……. 대체……. 이게 무슨 짓……. 히에엑……."
10026090-15 = "왜 내가……. 아니 우리가…… 고작 이런 것 때문에 이런 일을……."
10026090-16 = "하아……. 하아……."
10026090-17 = "네……? 그게 무슨 뜻이냐고요? 무슨 ……."
10026090-18 = "……아아. '고작 이런 거'라는 말이요? 으음……. 그건……. 말 그대로인데……."
10026090-19 = "그러고 보니 우이 씨. 저희 폭포 안에서 봤던 거……."
10026090-20 = "아, 아아. 네. 그러고 보니 말씀드릴 경황이 없었군요. 그건……. 음……."
10026090-21 = "사실은…… 말이죠. 이 섬……. 이 시설……."
10026090-23 = "새로 나온 이 포인트도 전부……."
10026090-29 = "……!? 무, 무슨 소리죠!? 또 미메시슨가요!?"
10026090-30 = "아, 아뇨……. 그냥 땅이 좀 꺼져서……. 죄송합니다……."
10026090-31 = "[s3] \"……히나타!?\"\n[s4] \"괜찮아? 다친 데는 없어?\""
10026090-35 = "네, 네. 괜찮아요. 저는……. 신경 써 주셔서 감사합니다. 하하……. 갑자기 서 있던 곳의 땅이 꺼져서……."
10026090-36 = "깜짝 놀랐네요. 누군가 일부러 파 둔 구덩이였을까요……? 왜 이런 곳에 구덩이가……."
10026090-37 = "음? 어라? 여기에 또……. 뭔가가……."
10026090-41 = "……이건……. 상자?"
10026090-42 = "꽤 오래된 상자……. 이것도 이곳의 물건들 중 하나일까요?"
10026090-43 = "구덩이도 상자를 묻어두기 위해 파 놓았던 것인 모양이네요."
10026090-44 = "……!!"
10026090-45 = "안에는 뭐가……."
10026090-46 = "자, 잠깐만요. 히나타 씨! 멈추세요……!"
10026090-48 = "지금까지의 일들을 보건대……. 지금 그걸 손대면 분명히……!!"
10026090-49 = "……네? 만지면……?"
10026090-59 = "[ns] \"…아하.\""
10026090-60 = "으음……. 쭉 이 패턴이었으니까요."
10026090-61 = "어라……. 그런데 좀……. 뭔가 전과는 약간 다른 느낌이……?"
10026090-62 = "뭐, 뭐야……!? 뭔가 전보다 훨씬 더 많은 거 같지 않아……!?"
10026090-63 = "게다가 저기 저……. 저건 처음 보는데……!? 괜찮은 거야, 이거!?"
10026090-64 = "아무래도 이 상자……. 꽤나 중요한 물건인 것 같아요. 어떻게 보면 정답이려나요?"
10026090-65 = "그렇게 웃을 상황이야, 지금!?"
10026090-66 = "후후. 일단 설명은 나중에 해야겠네요. 선생님……."
