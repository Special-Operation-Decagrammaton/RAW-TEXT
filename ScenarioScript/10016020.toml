[translation]
10016020-1 = "제2화;노점상의 유혹"
10016020-2 = "애슬레틱 스타디움 외부 노점상"
10016020-4 = "(실행위원회의 회의가 끝난 뒤, 대운동회의 풍경을 둘러보기 위해 경기장 밖으로 나왔다.)"
10016020-5 = "자자. 산해경 명물, <현무상회>가 황륜대제에 직접 찾아왔습니다!"
10016020-6 = "평소라면 산해경에서만 맛볼 수 있는 진미를 황륜대제의 경기와 함께 즐겨보세요!"
10016020-7 = "어머나, 현무상회에서도 대운동회에 노점을 낸 모양이네요."
10016020-8 = "전부터 현무상회의 음식은 한번 맛보고 싶었었는데, 마침 이런 곳에서 보게 되다니…… 한번 방문해 볼까요?"
10016020-9 = "하지만 아침부터 무거운 중화요리는 조금…… 부담이 될 것 같네요."
10016020-13 = "백야당 출장 판매입니다!"
10016020-14 = "이번에 새롭게 출시한 벚꽃 소다를 마시며 경기를 관람하시는 건 어떠신가요?"
10016020-15 = "간식으로 시즈코가 직접 만든 모나카도 있어요!"
10016020-16 = "어라? <백야당>이잖아?"
10016020-17 = "지난번 백야앵제에 다녀온 친구가 백야당의 음식이 그렇게 맛있다고 했는데……"
10016020-18 = "본경기가 시작하기 전에 하나 먹어볼까?"
10016020-22 = "[ns] \"경기장 밖도 떠들썩하네……\""
10016020-25 = "아, 잘 먹었다~"
10016020-26 = "배도 채웠으니, 슬슬 다른 장소로 이동해 볼까?"
10016020-31 = "거기, 잠깐 기다리세요!"
10016020-32 = "어, 어라? 정의실현부의 부부장……?"
10016020-33 = "음식을 먹고 나서 생긴 쓰레기는 제대로 쓰레기통에 버려야지요."
10016020-34 = "그렇게 아무 곳에나 버리면 다른 학생들이 열심히 꾸며 놓은 거리가 더러워지지 않습니까."
10016020-35 = "(윽, 설마 대운동회에서도 정의실현부가 활동하고 있었을 줄이야……)"
10016020-36 = "죄, 죄송합니다!"
10016020-42 = "하아…… 축제의 분위기에 취한 탓인지, 몸가짐이 흐트러진 학생들이 많이 보이네요."
10016020-43 = "부디 트리니티의 위신을 실추시키는 학생이 더 없어야 할 텐데……"
10016020-44 = "[s] \"다시 만났네, 하스미.\""
10016020-45 = "……[USERNAME] 선생님?"
10016020-46 = "아까는 실례를 했습니다만, 이곳에서 다시 뵙게 되는군요."
10016020-47 = "축제는 어찌 즐겁게 보고 계신가요?"
10016020-48 = "[s] \"응, 덕분에.\""
10016020-50 = "[ns] \"하스미는 실행위원 일을 하는 중이야?\""
10016020-51 = "네. 경기의 운영을 돕는 것 외에도 축제의 분위기에 취한 학생들을 계도하고 미화를 정비하는 것도 운영위원의 업무 중 하나니까요."
10016020-52 = "하지만 가볍게 회장을 둘러보았는데도 생각보다 시설이 넓고 학생들도 많아서……"
10016020-53 = "아무래도 오늘은 선도 업무만으로도 정신이 없을 것 같군요."
10016020-54 = "[s] \"그나저나 대회에는 정말로 직접 참가하지 않을 거야?\""
10016020-55 = "……네? 그야 물론입니다."
10016020-56 = "실행위원의 본분은 경기의 참가가 아닌 운영에 있으니까요."
10016020-57 = "물론 실행위원이 직접 경기에 참가할 수 없는 건 아닙니다만……"
10016020-58 = "아까 말씀드렸듯이 트리니티에는 저보다 더 경기에서 활약할 수 있는 재원들이 있으니까요."
10016020-59 = "저는 실행위원을 맡게 된 이상 학생의 선도와 경기 운영에 전념할 생각입니다."
10016020-60 = "[s] \"……고생이 많네.\""
10016020-61 = "아뇨. 새삼스러운 일도 아닙니다."
10016020-62 = "키보토스의 학생들이 고대해 온 축제라 해도, 저에게는 평소와 같은 학원 업무의 연장일 뿐이니까요."
10016020-63 = "그저 평소처럼 묵묵히 정의를 실현하기만 하면 될 뿐—"
10016020-64 = "어머나, 이런 곳에서 뵙게 되다니. 우연이군요."
10016020-72 = "아, [USERNAME] 선생님이다."
10016020-74 = "안녕, 선생님!"
10016020-75 = "[s1] \"안녕!\"\n[s2] \"황륜대제에 미식연구회도 왔었구나.\""
10016020-76 = "물론입니다. 대운동회는 평소에는 접할 수 없었던 다양한 음식을 즐길 수 있는 미식의 제전."
10016020-77 = "물론입니다. 대운동회는 평소에는 접할 수 없었던 다양한 음식을 즐길 수 있는 미식의 제전."
10016020-78 = "궁극의 미식을 탐구하는 저희 미식연구회가 이 기회를 놓칠 수는 없지요."
10016020-79 = "[s] \"대운동회가 미식의 제전이라고……?\""
10016020-80 = "네. <황륜대제>는 학원의 역량을 아낌없이 보여줄 수 있는 박람회의 역할도 하고 있으니까요."
10016020-81 = "밀레니엄의 기술력이라면 고분자 화합 기술을 통해 특정한 맛을 추출하거나 극대화하는 것도 가능할 터……"
10016020-82 = "새로운 기술로 만들어진 음식들은 경직된 미식의 세계에 신기원을 가져다줄 테지요."
10016020-83 = "그 외에도 <황륜대제>에는 다양한 종류의 음식을 판매하는 노점도 있으니까요."
10016020-84 = "경기를 관람하며 간편하게 먹을 수 있는 길거리 음식도 대운동회에서만 즐길 수 있는 명물이랍니다."
10016020-85 = "특히나 <현무상회>나 <백야당>처럼 평소에는 자치구로 찾아가지 않으면 먹기 힘든 로컬 맛집들도 가게를 내기 때문에 일부러 음식을 먹으러 경기장을 찾아오는 학생들도 있을 정도예요. ★"
10016020-86 = "[s] \"그러고 보니 다른 학원의 학생들을 본 것 같기도……\""
10016020-87 = "그리고 빵 먹기 경주도 있잖아!"
10016020-88 = "달리기에만 참가하기만 해도 빵을 마음껏 먹을 수 있다니, 최고잖아?"
10016020-90 = "빵 먹기 경주는 많이 먹기 대회가 아니거든……?"
10016020-91 = "그러고 보니 이번 대운동회의 종목 중에는 자동으로 완코소바를 뽑아주는 기계와 승부하는 많이 먹기 대회도 있다고 하던데……"
10016020-92 = "후후, 그 기계가 얼마나 저를 만족시킬 수 있을지 벌써부터 기대되네요~ ♥"
10016020-93 = "다들 아침부터 들떠 가지고…… 바보 같아."
10016020-97 = "이 학생들은……"
10016020-98 = "어머나, 그러고 보니 그쪽에 계신 분은 정의실현부의 부부장님이시군요."
10016020-99 = "(안 그래도 게헨나의 학생은 마주하기 거북한 기분인데, 그중에서도 유독 악명높은 문제아 동아리와 바로 마주치게 될 줄이야……)"
10016020-100 = "(조금…… 귀찮게 되었네요.)"
10016020-101 = "반갑습니다. 지금은 정의실현부의 부부장이 아닌, 황륜대제의 실행위원이지만요."
10016020-102 = "모쪼록 '문제없이 안전하게' 축제를 즐기다 가셨으면 좋겠군요."
10016020-103 = "후후, 환대에 감사드립니다."
10016020-105 = "전혀 환영하는 것처럼 안 보이는데……"
10016020-107 = "아, 그러고 보니 아까 가판대에서 이런 걸 구입했는데……"
10016020-111 = "설탕과 치즈를 잔뜩 뿌려 구운 옥수수 하나, 어떠신가요?"
10016020-112 = "…… (꿀꺽)"
10016020-113 = "어머나. 옥수수, 싫어하시나요?"
10016020-114 = "싫어하진 않지만…… 이렇게 설탕과 치즈를 듬뿍 뿌려 구운 옥수수는……"
10016020-115 = "이대로 먹으면 조금 칼로리가…… 아니, 간식으로는 조금 무겁지 않을까요?"
10016020-116 = "후후, 칼로리를 신경 쓰고 계셨나요?"
10016020-117 = "걱정하실 필요는 없습니다. 이 정도의 칼로리는 가볍게 뛰는 정도로 충분히 소비할 수 있으니까요."
10016020-118 = "오히려 대운동회 중에 계속 움직일 것을 생각하면 살이 빠지는 걸 걱정해야 하지 않을까요?"
10016020-119 = "살이 빠지는 걸 걱정한다고요……?"
10016020-121 = "그러고 보니 하루나는 먹는 양에 비해 꽤 마른 것 같네."
10016020-122 = "따로 다이어트라도 하는 거야?"
10016020-123 = "아뇨, 다이어트 같은 건 하지 않았습니다. 저는 살이 찌지 않는 체질이라서요."
10016020-124 = "게다가 음식을 먹는 것에 죄책감을 가져야 한다니, 제 입장에서는 그만큼 어리석은 행위도 없죠."
10016020-126 = "……."
10016020-127 = "살이 찌지 않는 체질…… 이라고요……? 어리석은 행위……?"
10016020-128 = "절대…… 절대로……"
10016020-129 = "절대로 용서 못 합니다, 게헨나!"
10016020-130 = "[s] \"하, 하스미……?\""
10016020-131 = "안 그래도 여기저기서 맛있는 냄새가 나는 걸 억지로 외면하고 있었는데……"
10016020-132 = "눈앞에서 뻔뻔하게 이런 도발을 하다니, 절대로 용서할 수 없습니다!"
10016020-133 = "선생님 앞이라 참으려 했지만…… 다시 한번 선언하겠습니다."
10016020-134 = "무슨 수를 써서라도 [ruby=게헨나]당신들[/ruby]을 꺾고 종합 우승을 따낼 테니까요!"
10016020-138 = "어머나. 무언가 역린을 건드린 모양이군요."
10016020-139 = "[s] \"……방금은 하루나가 잘못했다고 생각해.\""
10016020-140 = "네? 저희는 맛있는 음식을 권했을 뿐인걸요?"
10016020-141 = "응응, 맛있는 옥수수를 앞에 두고 화를 내다니…… 정말 이해할 수가 없네."
10016020-143 = "먹을 걸 준다고 화가 풀리는 건 바보 이즈미 정도뿐이겠지."
10016020-144 = "하아…… 나는 이상한 신메뉴에도 많이 먹기 대회에도 참가할 생각이 없었는데, 어쩌다가 여기까지 따라온 거지?"
10016020-145 = "노점상의 음식들도 대부분 먹어본 것뿐이라 맛있는 게 더 있을 것 같지도 않고……"
10016020-146 = "[s] \"준코.\""
10016020-147 = "응?"
10016020-148 = "[s] \"오늘은 평범하게 대운동회를 즐기도록 해.\""
10016020-149 = "평범하게 즐기라 해도……"
10016020-153 = "안내 말씀드립니다. 잠시 후 <황륜대제>의 첫 번째 경기가 시작될 예정입니다."
10016020-154 = "참가를 희망하시는 각 학원의 학생 여러분은 선수 대기실에 모여주시기를 바랍니다."
10016020-156 = "우, 우앗. 경기 시작하나 봐!"
10016020-157 = "너무 늦어서 빵 먹기 경주에 쓰일 빵이 다 떨어지면 어떡하지?"
10016020-158 = "아직 시간은 충분해요."
10016020-159 = "그럼 슬슬 흩어져서 각자의 미식을 탐구하고 올까요?"
10016020-160 = "그럼, 다녀오겠습니다~ ♥"
10016020-165 = "……다녀올게."
10016020-170 = "(그 후, 미식연구회를 배웅한 뒤 경기를 관람하기 위해 스타디움 내부로 이동했다.)"
