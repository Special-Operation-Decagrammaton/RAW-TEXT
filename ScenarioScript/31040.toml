[translation]
31040-1 = "제4화;낙제생들 1"
31040-3 = "그, 그러니까……. 이, 이건……."
31040-4 = "피치 못할 사정이라는 건……."
31040-5 = "페로로 님의 깜짝 공연에 참석하느라 정규 시험을 빼먹어버려서……. 낙제를……."
31040-6 = "[s] \"…….\""
31040-7 = "……."
31040-8 = "그, 그런 싸늘한 눈으로 보시면……! 분명히 시험 날짜를 제대로 확인했는데, 뭔가 착오가 생겨버려서……."
31040-9 = "……."
31040-10 = "아우…… 죄송합니다……."
31040-11 = "[s] \"아니. 나한테 미안할 건 없지만…….\""
31040-12 = "그렇게 되어버려서……"
31040-13 = "게다가 나기사 님이……. 선생님의 서포트를 저한테 부탁하셔서……."
31040-15 = "……그렇게 되어버렸으니, 히후미 씨가 선생님을 도와서 보충수업부를 이끌어 주시겠어요?"
31040-16 = "네?! 제, 제가요?!"
31040-17 = "네. 어차피 히후미 씨 같은 우등생만이 해줄 수 있는 일이기도 하고."
31040-18 = "저, 저는 우등생도 아니고…… 성적도 평균 정도인데……. 게다가 이제 낙제까지……."
31040-19 = "후후. 저는 히후미 씨의 사랑을 높게 평가하니까요. 게다가, 저에게 히후미 씨가 보답할 차례가 아니던가요?"
31040-20 = "아, 아우우……."
31040-21 = "후후. 그렇게 되었으니, 잘 부탁드려요. 보충수업부의 부장님."
31040-24 = "[ns] \"부장님이었어?!\""
31040-25 = "그, 그런 건…… 어디까지나 임시니까요……. 보충수업부는 한정으로 만들어진 동아리이고……."
31040-26 = "모든 학생들이 낙제를 면하면 자연스럽게 부는 사라질 테니……. 아, 아우……."
31040-27 = "그, 그러니까…… 네. 그때까지 잘 부탁합니다. 선생님."
31040-28 = "[s] \"잘 부탁해. 히후미\""
31040-29 = "그래도 선생님이라서 다행이에요. 안 그랬으면 어떻게 해야 했을지……."
31040-30 = "아, 보충수업부의 다른 멤버들은 만나보셨나요?"
31040-31 = "남은 멤버는 세명이고…… 누군지 명단은 저도 확인했으니까……"
31040-32 = "자, 일단 만나러 가요, 선생님. 이것저것 알려줘야 하는 것도 많고, 앞으로 어떻게 낙제를 피할 건지도 계획을 짜지 않으면……."
31040-35 = "[ns] 히후미를 따라 간다."
31040-38 = "정의실현부 부실"
31040-39 = "[ns] \"여기는…….\""
31040-40 = "아, 아우…… 여기는 가급적 오고 싶지 않은데……."
31040-41 = "저기…… 계신가요? 저기요~?"
31040-45 = "……."
31040-46 = "아, 안녕하세요."
31040-47 = "……."
31040-48 = "저, 저기요……."
31040-49 = "……뭐야?"
31040-50 = "아, 아우…… 그러니까……."
31040-51 = "……."
31040-52 = "아우우…… 무시당하는 건가요……."
31040-53 = "[s] \"낯을 가리는 아이인가보네.\""
31040-54 = "……누, 누가 낯을 가렸다고!!"
31040-55 = "그냥 단순히 낯선 사람을 경계하는 것뿐이야!"
31040-56 = "[s] \"그게 낯을 가리는 건데.\""
31040-57 = "……."
31040-58 = "정의실현부엔 무슨 볼일이야?"
31040-59 = "그, 그러니까…… 사람을 찾으러 왔는데……."
31040-60 = "뭐?! 우리 정의실현부가 사람이나 찾아주는 곳인 줄 알아?"
31040-61 = "우리가 봉사활동 동아리라고 착각한 거 같은데, 우리는 그런 거 하는 곳이 아니거든?"
31040-62 = "아, 아니…… 찾는 분이 여기 갇혀있다고 해서……."
31040-63 = "……? 갇, 혀있다고?"
31040-64 = "그, 그러니까…… 미풍양속을 어겨서…… 어, 그러니까……."
31040-65 = "어……?"
31040-70 = "저를 찾아오셨나요?"
31040-71 = "?!"
31040-72 = "?!"
31040-73 = "[s] \"?!\""
31040-74 = "뭐, 뭐, 뭐야?! 어, 어떻게 유치장을 열고 나온 거야?! 분명 잘 잠궜는데?!"
31040-76 = "응? 열려있던데요? 저를 부르는 것 같아서 나와봤죠. 그런데 무슨 일로……."
31040-77 = "어머나. 어른이시네요. 안녕하세요, 선생님. 이제 알겠네요. 그러니까, 보충수업부의?"
31040-78 = "자, 잠깐!! 그 차림으로 나오지 마!! 미풍이! 양속이……!!"
31040-81 = "우"
31040-83 = "라"
31040-85 = "와"
31040-89 = "하"
31040-91 = "나"
31040-93 = "코"
31040-95 = "보충수업부 멤버 2학년 우라와 하나코."
31040-96 = "수영복 차림으로 학교를 산책하다가 정의실현부에게 현장에서 체포."
31040-97 = "현재 정의실현부 구금 중."
31040-101 = "응? 뭔가 문제라도 있을까요? 시모에 씨?"
31040-102 = "하, 학교 부지에서 수영복을 입고 다니면 안 되잖아! 당연한 거잖아!!"
31040-103 = "응? 학교 수영장도 학교 부지 안이잖아요. ……설마 시모에 씨는 수영장에서 수영복을 입지 않는 쪽?"
31040-104 = "뭐? 무슨 소리를……."
31040-105 = "으음. 과연. 그렇다는건 시모에 씨는 알몸으로 수영을 하는 파군요. 과연 정의실현부원은 여러 모로 타의 모범이 된달까."
31040-106 = "뭔 헛소리야!! 그런 파가 어디 있어! 당연히 존재하는 취향 같은 거로 만들지 마!!"
31040-107 = "그게 아니면 알몸이 바로 정의, 라는 전위적인 주장을……? 흐음, 과격하지만 그쪽도 꽤 고찰해볼 만한……."
31040-108 = "얼른 들어가, 얼른! 얼른! 곧 선배들이 올 거니까!"
31040-109 = "어머, 이분들은 절 만나러……."
31040-110 = "시끄러!! 시끄러!! 들어가! 들어가!!"
31040-111 = "네. 여러분, 지금은 곤란한 것 같으니 조금 이따가 봐요."
31040-116 = "……."
31040-117 = "[s] \"…….\""
31040-120 = "하아…… 하아……."
31040-121 = "아, 아우…… 그, 그러면……"
31040-122 = "이 상황은 대체…… 그럼 하나코 씨는 어떻게 되는 거죠?"
31040-123 = "당연하잖아!! 야한 건 사형이야! 사형! 즉결 처형이야!!"
31040-124 = "그, 그럴 리는 없겠지만……"
31040-125 = "수영복을 입고 학교를 활보했다고! 대낮에!! 사람들이 바글거리는 광장 한가운데를!!"
31040-126 = "……."
31040-127 = "어머? 학교 안에서는 교칙이 지정한 걸 입어야죠. 그러니 학교 수영복을 제대로 입지 않으면……."
31040-128 = "왜 수영복을 입냐고!! 교복을 입으라고!!"
31040-129 = "아우……."
31040-130 = "……. 지, 지금은 하나코 씨를 만나는 건 조금 곤란한 듯하니……"
31040-131 = "일단은 다음 멤버를 만나러 가는 게……."
31040-132 = "음, 그러니까……"
31040-133 = "다음 멤버는…… 그러니까, 시라스 아즈사 씨……."
31040-136 = "다녀왔습니다."
31040-137 = "임무 마치고 돌아왔습니다!! 현행범 시라스 아즈사 씨, 체포 완료했습니다!"
31040-139 = "네?! ……네?!"
31040-140 = "어…… 하, 하스미 선배. 마시로."
31040-141 = "코하루 씨. 수고하셨습니다. 어라……?"
31040-142 = "[USERNAME] 선생님?"
31040-147 = "(후욱- 후욱-)"
31040-148 = "……."
31040-149 = "[s] \"…….\""
31040-150 = "(후욱-) 분하다. 탄약이 떨어지지만 않았어도 길동무로 세 명은 더 보낼 수 있었는데."
31040-151 = "(후욱- 후욱-) 자, 이제 마음대로 해. 뭘 할거지? 참고로 나는 고문을 견디는 훈련도 받았으니까 내 입을 여는 건 쉽지 않을 거야."
31040-152 = "(후욱- 후욱-)"
