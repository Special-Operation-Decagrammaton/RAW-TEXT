31040-169 = "보충수업부 멤버 2학년 시라스 아즈사."
31040-170 = "교내 폭력 혐의로 정의실현부의 추격을 받던 중, 교보재용 최루탄 창고를 점거하고,"
31040-171 = "최루탄 약 1톤을 터트리며 3시간을 농성하다 결국 체포."
31040-172 = "체포 직전까지 각종 부비트랩[ruby=급조폭발물]과 IED로 [/ruby]격렬하게 저항함."
