[translation]
10056080-1 = "제8화;조수의 교룡"
10056080-4 = "용왕님, 녀석들의 포박을 완료했습니다!"
10056080-5 = "음, 수고 많았다."
10056080-6 = "다소 불편하겠지만 잠깐 기다리거라."
10056080-7 = "그대들이 믿을 수 있는 사람이라는 것을 증명 받기 전까지는 마음대로 풀어둘 수는 없어서 말이지."
10056080-8 = "서로의 이해 관계가 일치한다는 것을 확인하기만 하면, 그대들은 물론이고 선생의 포박도 풀어줄 테니……"
10056080-9 = "그 때 느긋하게 이야기를 나누자꾸나."
10056080-10 = "[s] \"네가 그 '조수의 교룡'이야……?\""
10056080-11 = "이 무엄한 자가!"
10056080-12 = "감히 용왕님이 허가하기도 전에 함부로 먼저 입을 열다니!"
10056080-13 = "괜찮다. 샬레의 선생은 키보토스 밖에서 온 인물이라 들었으니, 여의 위광을 모른다 하더라도 이상한 일이 아니니."
10056080-14 = "거기에 더해 소문에 의하면 키보토스의 모든 권력자가 선생의 말 한 마디에 눈치를 볼 정도로 초월적인 권위를 지닌 자라 하였으니."
10056080-15 = "어쩌면 여와 가장 동등하게 대화를 나눌 자격이 있을지도 모르지."
10056080-16 = "그래, [USERNAME] 선생이여. 여에게 궁금한 점이라도 있는가?"
10056080-17 = "[s] \"어째서…… 용왕인 거야?\""
10056080-18 = "그대도 옛 이야기에서 용왕이라는 존재에 대해 들은 적이 있겠지."
10056080-19 = "강과 호수, 바다까지— 물이 존재하는 곳을 모두 다스리며 바람과 파도를 마음대로 부린다는 신적인 존재."
10056080-20 = "오랫동안 궁리해 보았지만, 이 '용왕'이라는 표현만큼 여에게 어울리는 칭호는 없었으니."
10056080-26 = "기꺼이 용왕이라는 이름을 취한 것이다."
10056080-27 = "아니, 네 이름은 나나미 잖아."
10056080-28 = "시끄럽다!"
10056080-33 = "[ns1] \"저 조수의 교룡……\"\n[ns2] \"아니, 나나미가 바람과 파도를 부린다는 게 사실이야?\""
10056080-36 = "……그럴리가요. 그녀 역시 평범한 학생인걸요."
10056080-37 = "다만 조수의 교룡— 고노카미 나나미는 항해와 관련해서는 천부적인 감을 타고 나서요."
10056080-38 = "[s] \"천부적인 감?\""
10056080-39 = "네. 나나미는 해류의 흐름이나 공기의 흐름을 느끼는 것 만으로도 파도가 어느 방향으로 칠지, 폭풍이 언제 다가올지 예측할 수 있다고 해요."
10056080-40 = "기상예보를 하는 슈퍼 컴퓨터 이상의 천부적인 재능이 있다고 하는데……"
10056080-41 = "그 때문에 한 때는 <아일랜드>의 차기 함장으로 손꼽힐 만큼 우수한 인재로 꼽히기도 했죠."
10056080-42 = "[s] \"그런데 어쩌다가 교정국에……\""
10056080-43 = "보면 알겠지만, 정신이 약간…… 이상하거든."
10056080-44 = "스스로를 바다가 선택한 용왕이라고 생각 하지를 않나, 자신 이외에는 모두 무가치한 존재라고 여기질 않나……"
10056080-45 = "게다가 그 재능 탓에 그녀를 추종하는 사람들이 쉽게 달라붙어서."
10056080-46 = "한 때는 그녀의 해적단이 트라이던트를 상회하는 수준까지 커진 적도 있었대."
10056080-47 = "다만 교정국에 수감되면서 뿔뿔이 흩어져 버렸지만."
10056080-48 = "어느새 이 규모의 선단을 다시 모은 거야……?"
10056080-49 = "[s] \"과연……\""
10056080-50 = "무슨 귀엣말을 나누는지는 모르겠지만, 도망칠 방법을 찾아도 소용없을 것이다."
10056080-51 = "그대들이 이곳에서 여와 마주친 것은 단순한 우연이 아니거든."
10056080-55 = "설마, 이 블루홀에 보물이 있다고 말한 의뢰인도……"
10056080-56 = "음, 물론. 여의 충직한 가신이었지."
10056080-57 = "물론 그대들을 유인하기 위해 작업중인 배의 선저에 폭탄을 설치한 것은 비록 여의 발상이었지만 말이야."
10056080-58 = "역시 네 놈들 짓이었냐!"
10056080-59 = "부착 지뢰는 따개비랑 비슷하게 생겼으니까……"
10056080-60 = "……저희에게 큰 빚을 지워서 무얼 시키려 했었던 거죠?"
10056080-61 = "그런 눈으로 쳐다보지 말 거라. 그대들이 원하는 것을 줄 수 있다는 말은 거짓이 아니니까."
10056080-62 = "약속대로 그대들이 해저에서 보물을 인양해 준다면, 충분한 대가를 지불하도록 하지."
10056080-66 = "이 블루홀에 침몰한 선박 같은 건 없었어요."
10056080-67 = "대신 고래들이 지키고 있는 '무언가'는 있었지만……"
10056080-68 = "하하! 이미 그 아래까지 다녀왔던 건가? 이야기가 빨라져서 좋군."
10056080-72 = "그래. 이곳은 수백년에 걸쳐 나이 든 고래가 안식을 취하는 장소…… 일명 '고래의 묘지'이지."
10056080-74 = "열수공에서 발생한 가스가 고래를 마취하고, 굴절된 동굴의 구조가 동료의 울음 소리처럼 들리기 때문에. 나이 든 고래는 이 장소에 쉬이 이끌리게 되지."
10056080-75 = "게다가 다른 고래 무덤과는 달리, 이 블루홀은 바깥 바다와 물이 거의 섞이지 않기 때문에 고래의 뼈나 용연향 같은 부산물이 그대로 남아 있을 가능성이 높아."
10056080-77 = "자, 이제 여가 그대들을 부른 이유를 알아차리겠나?"
10056080-78 = "……고래의 부산물을 인양해달라는 말이었군요."
10056080-79 = "그래. 용연향과 고래 뼈는 블랙 마켓에서 비싸게 거래되는 금수품이니까."
10056080-80 = "다시 용궁을 재건하기 위해서는 바다의 보물을 조금 육지 녀석들에게 하사할 필요가 있거든."
10056080-81 = "어디 보자, 최근 용연향의 시세가 이 정도이니."
10056080-85 = "……세 마리 분량 정도면 충분하겠군."
10056080-86 = "하지만……"
10056080-90 = "그건 죽은 고래들을 모독하는 행위야."
10056080-91 = "감성적인 소리를 하는 군. 죽은 뒤에 썩어 문드러진 뼈와 내장에 무슨 존엄이 있단 말이냐?"
10056080-92 = "오히려 용왕의 개가에 그 육신을 쓸 수 있다면, 오히려 그들에게도 영광스러운 최후일테지."
10056080-93 = "게다가 이 바다의 모든 것이 이 몸의 것인데. 누구의 허락을 받아야 한다는 말이냐?"
10056080-94 = "……만약 우리가 지시를 거절한다면?"
10056080-95 = "흠. 여의 지시를 따르지 않고, 명령을 거부하는 불충한 가신에게 내리는 형벌이야 정해져 있지."
10056080-96 = "……그래. 따개비가 가득 붙은 뱃전에 몸을 묶고 항해를 하는 건 어떤가?"
10056080-97 = "[s] \"하, 하하. 그거 꽤나 아플 것 같은데……\""
10056080-101 = "농담이 아니다만."
10056080-105 = "여가 그대들과 한담을 나누기 위해 이곳에 행차했다고 생각하면 곤란해."
10056080-106 = "이대로 트라이던트의 방해를 받기라도 한다면 곤란하니 슬슬 서두르지."
10056080-110 = "10초 내로 결정하거라."
10056080-111 = "여의 수하가 되어 바다에서 고래의 사체를 인양할 것인지, 아니면 새로운 배의 선수상이 될지."
10056080-112 = "자, 잠깐……!"
10056080-113 = "10. 9. 8……"
10056080-114 = "아무리 그래도 그 요구는……"
10056080-115 = "7. 6……"
10056080-120 = "[ns] \"용연향이 목적이었다면 진작 말을 하지 그랬어.\""
10056080-121 = "응?"
10056080-122 = "샬레의 선생이여. 그게 무슨 소리지?"
10056080-123 = "설마, 시간을 벌기 위해 흰 소리를 하는 게라면—"
10056080-124 = "[s3] \"오늘 다이빙부는 화물을 인양하는 줄 알고 다른 장비를 가져왔거든.\"\n[s4] \"고래 사체를 인양하는 줄 알았더라면 걸 맞는 장비를 가져왔을 텐데.\""
10056080-130 = "그, 그게 정말이냐……?"
10056080-135 = "[ns5] \"잠깐, 말을 맞춰줘.\"\n[ns6] \"일단은 어쩔 수 없는 척 둘러대자.\""
10056080-138 = "아, 넵……!"
10056080-139 = "사, 사실이에요! 이런 부탁을 하실 줄 알았더라면 진작 만반의 준비를 해왔을 텐데."
10056080-140 = "지, 지금 갖고 있는 장비만으로는 고래를 온전히 인양할 수 없거든요."
10056080-144 = "사실 말씀하신 블루홀이 이렇게 깊을 줄 모르고 나이트록스 실린더만 가져왔는데, 나이트록스는 산소 중독의 위험성이 있기 때문에 그리 깊은 수심에서는 쓸 수 없거든요. 이럴 때는 질소 마취의 위험성이 낮은 헬리옥스나 트라이믹스 실린더를 쓰는 편이 더 좋아요."
10056080-145 = "심해 다이빙의 경우는 열전도까지 고려하면 트라이믹스가 좋긴 하지만, 트라이믹스는 질소가 포함되어 있기 때문에 가스 혼합을 사전에 계산해 두어야 하기 때문에, 이번 블루홀 다이빙처럼 처음 잠수하는 장소에서 쓰긴 어려워서……"
10056080-146 = "조금 비싸긴 하지만 헬리옥스 실린더 충전 장비라면 오디세이아 본함에 있는데, 미리 말씀해 주셨더라면 이걸 가져왔을 텐데—"
10056080-147 = "그만, 그만!#n잘 알지도 못하는 소리를 늘어놓는 건 그만하거라!"
10056080-148 = "여봐라, 저 말이 사실이냐?"
10056080-149 = "죄, 죄송합니다. 용왕님…… 저도 다이빙에 대해서는 잘 알지 못해서요."
10056080-150 = "설마 화물선을 인양하는 장비와 용연향을 인양하는 장비가 달랐을 줄이야……"
10056080-151 = "이 무지한 것! 대업을 진행하는 데 그 정도도 알아보지 않고 일을 그르치다니."
10056080-155 = "……알겠다. 장비가 없어서 당장 잠수를 하지 못한다면, 이쪽에서 그 헬리옥스인지 하이록스인지 하는 그 장비를 찾아보도록 하지."
10056080-156 = "그 때까지는 모두 휴식을 취하고 있도록."
10056080-157 = "[s] (이것으로 한 숨 돌렸나……)"
10056080-158 = "다만 도망칠 생각은 하지 않는 게 좋을 거야."
10056080-166 = "만약 여에게 수상한 낌새가 느껴진다면, 샬레의 선생님에게 좋지 못한 일이 생길지도 모르거든."
10056080-170 = "후후, 그럼 즐거운 시간을 만끽하고 있거라."
10056080-175 = "진짜 열 받는 녀석이네……"
10056080-176 = "동감이야~"
10056080-180 = "………."
