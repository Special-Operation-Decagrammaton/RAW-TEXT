[translation]
10056080-1 = "第8話;潮水の蛟龍"
10056080-4 = "竜王様！縛り上げました！"
10056080-5 = "うむ、ご苦労。"
10056080-6 = "窮屈だろうが、しばしの辛抱だ。"
10056080-7 = "お主らが信頼できると分かるまでは、自由にさせるわけにもいかんのだ。"
10056080-8 = "利害の一致さえ確認できれば、すぐにでも縄を解こう。"
10056080-9 = "話はそれからだな。"
10056080-10 = "[s] \"君が[ruby=ちょうすい]潮水の[/ruby][ruby=こうりゅう]蛟龍な[/ruby]の？\""
10056080-11 = "無礼者！"
10056080-12 = "竜王様の許可なく口を開くな！"
10056080-13 = "構わぬ。シャーレの先生はキヴォトスの外から来た者だ。#n余の威光を知らずとも不思議はない。"
10056080-14 = "さらに噂によれば、超法規的権威を持つらしいではないか。#nキヴォトス中の権力者がこぞって先生に気を使うほどと聞くぞ？"
10056080-15 = "なれば、余と対等に言葉を交わす資格があるのやもしれぬ。"
10056080-16 = "して、[USERNAME]先生よ。余が潮水の蛟龍ならばなんとする。"
10056080-17 = "[s] \"どうして「竜王」なの？\""
10056080-18 = "いくらなんでも竜王の言い伝えぐらいは聞いたことがあるだろう？"
10056080-19 = "川や湖、海に至るまで――水の存在するあらゆる場所を支配し、#n風と波を思いのままに操るとい[ruby=超常的な存在]う竜王。[/ruby]"
10056080-20 = "長きにわたり考えた末――"
10056080-26 = "余を言い表すに「竜王」ほど適したものはなかった故、その名を頂戴したのだ。"
10056080-27 = "え、あんたの名前ってナナミだよね？"
10056080-28 = "ええい、黙れ！"
10056080-33 = "[ns1] \"潮水の蛟龍が――\"\n[ns2] \"いや、ナナミが風と波を操るって話は本当なの？\""
10056080-36 = "……ありえません。彼女だって普通の生徒です。"
10056080-37 = "ただ、それはさておいても、#n潮水の蛟龍――[ruby=ごのかみ]護守[/ruby]ナナミには航海に関する天賦の才があります。"
10056080-38 = "[s] \"航海の才能？\""
10056080-39 = "はい。潮や空気の流れを感じるだけで、波の方向も嵐が来る時期も分かるのだとか。"
10056080-40 = "その精度は、気象予測用のスパコン以上だと言われるほど。"
10056080-41 = "一時はアイランドの次期艦長候補にも挙がっていました。"
10056080-42 = "[s] \"それがどうして矯正局に……。\""
10056080-43 = "見たまんま。考え方がちょっと……おかしい。"
10056080-44 = "自分は海に選ばれし竜王、それ以外は全て価値のない存在だと思ってる。"
10056080-45 = "しかも、あの能力に魅了されて崇拝する人は少なくない。"
10056080-46 = "ナナミが率いる海賊団の規模が、トライデントを上回ったこともあるんだよね。"
10056080-47 = "矯正局への収監をきっかけにバラバラになったけど。"
10056080-48 = "いつの間に艦隊を集めたんだろ……？"
10056080-49 = "[s] \"たしかに……。\""
10056080-50 = "ひそひそ話も結構だが、逃げ道は探すだけ無駄だ。"
10056080-51 = "ここでの邂逅は、偶然ではないのだから。"
10056080-55 = "もしかして、あの依頼人も……。"
10056080-56 = "当然、余の忠実なる臣下だ。"
10056080-57 = "もっとも、船底に水雷を仕掛けるという妙案は余のものだがな。"
10056080-58 = "やっぱり、あんた達の仕業だったんだ！"
10056080-59 = "水雷ってフジツボにそっくりだから……。"
10056080-60 = "……船を爆発させて借金を負わせ、その弱みに付け込もうとしたんですね？"
10056080-61 = "そんな目を向けるな。お主らが望むものを与えるというのは本当だ。"
10056080-62 = "海底から宝を持ってくれば、約束どおり十分な対価を支払おう。"
10056080-66 = "このブルーホールに沈没船なんてありませんでした。"
10056080-67 = "海底に眠っていたのは、クジラたちが守っている[ruby=・]何[/ruby][ruby=・]か[/ruby]……。"
10056080-68 = "ほぉっ！もうそこまで突き止めたのか？話が早くて助かる。"
10056080-72 = "ここは数百年に渡り、老いたクジラが安らぎを求めて集う……「クジラの墓場」だ。"
10056080-74 = "海底から出るガスに誘われ、クジラが引き寄せられるのだ。#n幻聴だというに、仲間の鳴き声を聞いたと勘違いしてな。"
10056080-75 = "なにより良いのは、このブルーホールは外の海水と混ざらないことだ。#n故にクジラの骨や[ruby=りゅうぜんこう]龍涎香[/ruby]がそのまま残っている可能性が高い。"
10056080-77 = "ここまで言えば、もう察しはついているのだろう？"
10056080-78 = "……その宝を持ってこい、ということですね？"
10056080-79 = "あれらはブラックマーケットで高く売れるからな。"
10056080-80 = "竜宮を再建するためには、海の宝を陸の者どもに授ける必要がある。"
10056080-81 = "ふむ、近頃の龍涎香の相場はこの程度ゆえ――"
10056080-85 = "――3頭分ほどで良かろう。"
10056080-86 = "でも……。"
10056080-90 = "それは、死んだクジラを冒涜する行為だ。"
10056080-91 = "ずいぶんと感傷的なことを。朽ちた骨や内臓に尊厳があるとでも？"
10056080-92 = "竜王の偉業にその身を捧げられるなら、むしろ栄光の幕引きと言えよう。"
10056080-93 = "この海は、全て余の物だ。そこに誰の許可がいる？"
10056080-94 = "……もしも依頼を断ったら？"
10056080-95 = "命に背く臣下に与える罰など決まっている。"
10056080-96 = "フジツボだらけの舷側に縛り付けられての航海はいかがかな？"
10056080-97 = "[s] \"は、はは。すごく痛そうだね……。\" "
10056080-101 = "冗談ではないぞ。"
10056080-105 = "お主らと雑談をするために来たと思ってもらっては困る。"
10056080-106 = "トライデントの横槍が入ると面倒ゆえ、急ぐとしよう。"
10056080-110 = "10を数える間に決めるのだ。"
10056080-111 = "余の臣下となり海底の宝を持ってくるか、[ruby=・]フ[/ruby][ruby=・]ジ[/ruby][ruby=・]ツ[/ruby][ruby=・]ボ[/ruby][ruby=・]船[/ruby]で航海するか。"
10056080-112 = "ちょ、ちょっと待って……！"
10056080-113 = "10、9、8……。"
10056080-114 = "いくらなんでも、そんなことは……。"
10056080-115 = "7、6……。"
10056080-120 = "[ns] \"龍涎香が目的なら、最初から言ってくれたらよかったのに。\""
10056080-121 = "うん？"
10056080-122 = "何が言いたい？"
10056080-123 = "時間稼ぎのための戯言なら――"
10056080-124 = "[s3] \"器材を持ってきてないんだよ。\"\n[s4] \"最初から分かってれば準備したんだけど。\""
10056080-130 = "な、なにっ？"
10056080-135 = "[ns5] \"ここは話を合わせてくれる？\"\n[ns6] \"まずは仕方ないふりをしてごまかそう。\""
10056080-138 = "はいっ……！"
10056080-139 = "本当です！#nそういう依頼だったなら、万全の準備をしてきたんですが……。"
10056080-140 = "い、今の持ち合わせでは無理なんです。"
10056080-144 = "こんなに深いとは知らず、ナイトロックスのシリンダーを持参しました。#nこれだと酸素中毒の恐れがあって、深い所では使えません。#nこの深さならヘリオックスやトライミックスを使ったほうがいいんです。"
10056080-145 = "深海では熱伝導を考えるとトライミックスがより望ましいのですが、#n窒素を含んでいるので混合を事前に計算しないといけないので……#n今回のように初めて潜る場所で使うには不向きですし……。"
10056080-146 = "となると少し高価ですがヘリオックスが必要でして……#nオデュッセイア本艦にはあるので、事前に分かっていたらそれを持ってき――"
10056080-147 = "えーい、黙れ！#n訳の分からぬことを並べるでない！"
10056080-148 = "主、今のは本当なのか？"
10056080-149 = "も、申し訳ございません。#nダイビングについては詳しくないものでして……。"
10056080-150 = "まさか引き上げる場所によって必要な器材が違うとは……。"
10056080-151 = "愚か者め！大業を成さんとするのに、その程度も知らぬとは。"
10056080-155 = "……ふむ。であれば、こちらで用意しよう。"
10056080-156 = "それまで英気を養っておけ。"
10056080-157 = "[s] （これで一息つけるかな……）"
10056080-158 = "逃げようなどとは考えるでないぞ。"
10056080-166 = "先生の身に不幸が降りかからぬよう、願うばかりだ。"
10056080-170 = "ではな。しばしの暇を満喫するが良い。"
10056080-175 = "ほんっと、頭にくるね……。"
10056080-176 = "右に同じく～"
10056080-180 = "……。"
