[translation]
1002903-1 = "강의명: 포용"
1002903-3 = "(온다고 예고한 지 얼마 지나지 않아, 나츠가 샬레로 직접 찾아왔다.)"
1002903-4 = "(긴 대화를 주고받을 것 같은 느낌이었기에 휴게실로 나츠를 안내했다.)"
1002903-12 = "음. 좋은 분위기. 아늑한 곳이야."
1002903-13 = "마음 같아서는 아예 우리 부실로 하자고 제안하고 눌러앉아버리고 싶지만……."
1002903-14 = "하하. 농담이야. 곤란해할 필요 없어."
1002903-15 = "오늘 찾아온 이유는 갑자기 들어버린 슬픔을 해결하기 위해 선생님의 도움을 구하러 온 거니까."
1002903-16 = "……응? 손에 든 봉투는 뭐냐고?"
1002903-17 = "하하. 뭐, 이번에도 마찬가지지."
1002903-21 = "……오늘의 교재! 사실 이건 반쪽짜리지만 말이야."
1002903-22 = "……응?"
1002903-23 = "정말 아무 일도 없는 거 맞냐고? 모모톡 내용 때문에 아직 걱정이 된다고?"
1002903-24 = "하하. 미안해. 하지만 정말 괜찮아. 아까도 말했지만, 딱히 내게 무슨 일이 생긴 건 아니거든."
1002903-25 = "그저 아침 뉴스들을 보다 갑작스럽게 그런 생각이 들었을 뿐. 왠지 이럴 때가 있더라고."
1002903-26 = "서로 싸우고, 이해하지 못하고, 배척하는 수많은 이야기들……. 그로 인해 탄생하는 비극의 서사들……."
1002903-27 = "그것 때문에 깨닫지 못하는 그 너머의 더 큰 경지들. 그에 대한 안타까움."
1002903-28 = "……마치 서로 각자의 맛 만을 최고로 여기며 상대를 인정하지 못하는 일부 디저트 매니아들 같지."
1002903-29 = "그래서 주절거림을 털어놓고 싶지만, 사실 뜬금없잖아?"
1002903-30 = "이런 식으로라도 털어놓을 상대가 선생님 정도밖에 없었던 것뿐이야."
1002903-31 = "이쪽에도 의외로 수많은 이야기와 갈등들이 있거든."
1002903-32 = "민트초코가 어떻다, 진짜 커피는 에스프레소이며 아메리카노는 사도다……."
1002903-36 = "……역시 말이 길어지네."
1002903-37 = "직접 보여주는 편이 설명으로도 빠르겠군."
1002903-46 = "(나츠는 휴게실 한 쪽에서 에스프레소 머신을 돌려 커피 한 잔을 따라왔다.)"
1002903-52 = "선생님은 에스프레소 좋아해?"
1002903-53 = "[s1] \"꽤 좋아하지. 일할 때도 마시고.\"\n[s2] \"쓴 건 그다지 취향이 아니야.\""
1002903-54 = "하하. 역시 그런가."
1002903-55 = "그럼 이건 어때? 사실 나는 그것보다 이 쪽이 좀 더 취향이거든."
1002903-56 = "하하. 역시 그런가."
1002903-57 = "그럼 이쪽이 더 취향이겠군. 나 또한 그런 편이거든."
1002903-58 = "지금 가져온 것과는 정 반대라고도 할 수 있는 맛의 물건인데……."
1002903-63 = "(나츠는 가져왔던 봉투를 부스럭거리며 그 안에서 하얀 바닐라 아이스크림을 꺼내 들었다.)"
1002903-64 = "바로 무난한 달달함의 대명사."
1002903-65 = "바닐라 아이스크림! 두둥-!"
1002903-66 = "이래 봬도 한창 때의 여고생이니까 말이지."
1002903-67 = "입안에서 사르륵 녹은 차가움과 달달함……. 그러면서도 지나치게 눌러 붙지 않아 많이 먹을 수도 있는 지구력……!"
1002903-68 = "명실공한 최고의 디저트 재료 중 하나지. 그 자체로도 충분히 완성된 디저트이기도 하고 말이야."
1002903-69 = "……하지만 선생님."
1002903-70 = "이 에스프레소와 바닐라 아이스크림. 둘 중 하나만 고집하는 사람은 다다르지 못하는 경지가 있다는 거, 알고 있어?"
1002903-71 = "[s3] \"다다르지 못하는 경지?\"\n[s4] \"그게 뭐야?\""
1002903-72 = "백문이 불여 일견. 직접 보여주도록 하지."
1002903-73 = "백문이 불여 일견. 직접 보여주도록 하지."
1002903-79 = "(나츠는 곧 들고 온 바닐라 아이스크림을 접시에 담더니, 그 위로 방금 타 온 에스프레소를 붓기 시작했다.)"
1002903-80 = "(바닐라 아이스크림 위로 떨어진 뜨거운 커피가 아이스크림을 녹이며, 둘이 섞인 새로운 무언가가 탄생하기 시작했다.)"
1002903-81 = "……<아포가토(Affogato)>."
1002903-82 = "단 맛의 대표라고 할 수 있는 바닐라와 쓴 맛의 대표라고 할 수 있는 에스프레소의 융합체지."
1002903-83 = "그 종류만 수천 가지가 넘는 수많은 디저트들 중에서도, 최고의 맛이라 여겨지는 녀석들 중에 하나인 디저트야."
1002903-84 = "봐. 이 멋진 비주얼을. 단 걸 좋아하는 사람도, 쓴 걸 좋아하는 사람도 포용할 수 있는 궁극의 완성체를."
1002903-85 = "어느 한 쪽만 취하며 다른 쪽을 배척하는 이들은 결코 다다를 수 없는 경지의 새로운 맛."
1002903-86 = "……정말 완벽하지."
1002903-87 = "모두가 이런 느낌이었다면, 그런 포용력을 가지고 있었다면……."
1002903-88 = "세상엔 싸울 일도, 서로 얼굴 붉힐 일도 없어질 텐데 말이지……."
1002903-89 = "……."
1002903-90 = "[s5] \"나츠는 상냥한 사람이구나.\"\n[s6] \"남의 일에 안타까워할 줄 아는 것도 포용력이지.\""
1002903-91 = "……음. 그……."
1002903-92 = "……음. 그……."
1002903-93 = "으음……."
1002903-97 = "하하하. 그런 말을 들으려고 왔던 건 아니었는데 말이지."
1002903-98 = "그냥……. 다른 사람들에게는 뜬금없다거나 엉뚱하다는 말 밖에 듣지 못했거든."
1002903-99 = "물론 선생님이라면 그런 식으로 말하진 않을 거라고 기대해서 온 게 맞긴 한데……."
1002903-100 = "그런 말을 듣게 될 줄이야. 이거 꽤 놀라운 걸."
1002903-101 = "오늘 수업은 별로 필요가 없었던 거 같네. 번데기 앞에서 주름 잡은 꼴이랄까. 그것마저도 좀 건방진 이야기 같지만 말이야."
1002903-102 = "……하하하."
1002903-103 = "그럼 뭐, 더 끌 필요는 없는 거 같으니, 수업은 여기까지 하기로 하고……."
1002903-109 = "……같이 먹을까? 아포가토."
1002903-111 = "(이후 나츠와 함께 아포가토를 하나 더 만들어서 나눠 먹었다.)"
1002903-112 = "(이야기가 끝난 후 돌아가는 나츠의 표정은 들어올 때보다 훨씬 밝고 명랑해 보였다.)"
