[translation]
13060-1 = "제6화;매매계약서"
13060-3 = "유메 선배가 작성한 계약서라고……?"
13060-4 = "네. 그렇습니다. 이것은 <아비도스 학생회>가 사막횡단철도의 부가 시설 사용 권리를 세인트 네프티스에게서 사들인다는 내용입니다."
13060-6 = "네프티스에게서……?"
13060-8 = "……원래 자치구가 몰락하면 이런 권리증은 여기저기로 팔려 가는 법이지."
13060-9 = "사막횡단철도는 <아비도스 학생회>와 네프티스가 함께 진행한 프로젝트지만, 원칙적으로는 이 권리는 수주자인 학생회의 것입니다."
13060-10 = "빚을 갚으려고 그 권리를 네프티스에게 팔았고, 그걸 다시 전임 학생회장 쿠치나시 유메가 되사려고 했던 것 같네요."
13060-11 = "그게 바로 이 계약서인 거지."
13060-13 = "……이, 이리 줘 봐."
13060-15 = "매매계약서…… <아비도스 학생회>는 네프티스로부터 사막횡단철도의 부속 시설 운용 권리를 100만 엔에 매수하며…… 계약금 1만 엔은 즉시 지급한다……."
13060-16 = "이 계약서는 작성 후 2년간 법적 효력을 가지며…… 그 기간 안에 차액을 네프티스에 지급해야 하며……."
13060-17 = "차액 지급에 대한 지연 보상금 책정은……."
13060-18 = "아비도스 학생회장…… 쿠치나시 유메…… 싸인……."
13060-19 = "……."
13060-22 = "…………맞아."
13060-23 = "이건 선배가 쓴 게 맞아……. 매일 보는 그 글씨야……."
13060-24 = "그렇습니다. <아비도스 학생회>가 사막횡단철도의 부속 시설 운용 권리를 <네프티스>에게서 100만 엔에 매수한다는 계약서죠."
13060-25 = "어, 언제 이런 걸…… 선배는……. 내가 모르는 사이에……."
13060-26 = "……. 유메 선배가 남긴 것들은 내가 전부 알고 있는데……. 종이 한 장, 쪽지 하나, 쓰레기까지 전부 다……."
13060-27 = "그런데 이런 계약서는 전혀 들어본 적 없어……. 과거의 학생회 녀석들이면 모를까, 유메 선배가 남긴 행적을 내가 놓쳤을 리가……."
13060-29 = "아아. 아직 체결이 완료되지 않은 계약서라서 모르고 계셨을 수도 있습니다."
13060-33 = "이건 일종의 간이 계약서 같은 거라, 아직 구입 대금이 전달되지 않았거든요."
13060-34 = "아직 진행 중인 계약이라는 건가요……?"
13060-35 = "네. 그렇습니다. 계약서 작성과 계약금 전달까지는 확인되었지만, 그 이후 판매 대금 입금이 안된 채로 멈춰버린 상태입니다. 2년 동안요."
13060-36 = "그 후 이 계약서는 누구도 신경 쓰지 않고 흐지부지된 것 같더군요. 시간이 흐르면서 담당자도 퇴사해 버린 것 같구요."
13060-37 = "그렇게 서류 창고에 방치되다가 지금 우연히 발견된 것입니다."
13060-39 = "우연히……."
13060-40 = "[s] \"우연히…….\""
13060-41 = "음."
13060-43 = "우리로서는 골치 아픈 상황이다. 차라리 발견되지 않았으면 좋았으련만."
13060-44 = "이것 때문에 <사막횡단철도>의 모든 권리들 중, <부속 시설 운용>에 대한 권리를 확보할 수 없게 되었습니다."
13060-45 = "지금 그 권리는 <네프티스>가 <아비도스 학생회>에 매매 중인 상태니까."
13060-47 = "그, 그래서……?"
13060-48 = "그래서 확실하게 확인받고 싶은 것입니다. 이 계약을 계속 진행하실 의향이 있으신가요?"
13060-49 = "네……? 그걸 물어보기 위해 굳이 여기까지 온 거예요?"
13060-51 = "그렇지. 이건 우리에게 중요한 문제니까."
13060-52 = "이게 제대로 정리되어야 이틀 뒤에 있을 채권단 총회에서 <사막횡단철도>의 지분을 논의할 수 있어."
13060-53 = "채권단 총회……?"
13060-54 = "빚쟁이들의 모임 같은 건가……."
13060-55 = "맞습니다. <사모펀드>의 모든 세력들이 한곳에 모이는 자리입니다."
13060-56 = "<아비도스 학생회>는 남은 차액을 네프티스에 지불하고 이 권리를 구매할 의지가 있습니까? 계약의 주체자인 호시노 씨?"
13060-58 = "……."
13060-59 = "아니…… 다짜고짜 찾아와서 이 계약을 계속할 건지 결정하라고 해도……."
13060-60 = "그치만 그런 권리를 사 봤자……."
13060-61 = "어…… 차액이 100만 엔이었죠? 그치만 지금 빚을 늘리는 결정을 굳이 하기가……."
13060-62 = "역시 그렇죠! 잘 생각하셨습니다. 이런 쓸데없는 고철더미의 권리 따위에 100만 엔을 지불할 가치는 없습니다!"
13060-63 = "실제로 여러분들은 지금도 채무 변제 때문에 힘들지 않습니까? 빚을 더 늘릴 필요가 없죠."
13060-64 = "자아, 그럼 이 계약을 지속할 의사가 없다는 것으로 이해해도 될까요?"
13060-66 = "자아, 그럼 호시노 씨, 이 포기 각서에 서명을……. 모든 권리를 저희 <사모펀드>에 넘긴다는 내용입니다."
13060-67 = "어, 자, 잠깐만……? 이렇게 들이밀어도 말이지……?"
13060-69 = "[ns] \"잠깐 기다려.\""
13060-71 = "으음?"
13060-72 = "[s1] \"사인이라는 건 원래 조심스럽게 해야 하니까.\"\n[s2] \"그러니까 조금만 기다려주시겠습니까?\""
13060-75 = "흠……."
13060-76 = "으음……. 곤란하군요."
13060-77 = "역시 너무 서둘렀나……."
13060-78 = "아니, 어차피 이틀 뒤면 이 계약은 원천적으로 무효가 됩니다."
13060-80 = "이틀……?"
13060-85 = "날짜를 보시면 아시겠지만, 이틀 뒤면 이 계약서가 체결된 지 2년이 되니까요. 그럼 어차피 계약은 자동 파기가 될 겁니다."
13060-86 = "채권단 총회의 날짜도 그래서 그때로 잡아두었던 거죠. 좀 더 서두르고 싶었지만…… 이틀 정도는 뭐, 기다릴 수 있습니다."
13060-87 = "자아. 저희는 명확하게 말씀드리겠습니다."
13060-88 = "이틀 뒤, 아비도스 중앙역 구청사에서 <사모펀드>의 채권단 총회를 개최할 예정입니다."
13060-89 = "이 계약을 유지하고 싶으시다면, 12시 전까지 채권단 총회에 참석해서 계약 유지에 대한 의사 표명 및 공증을 하시면 됩니다."
13060-90 = "그게 가능하다면 말이죠."
13060-91 = "……?"
13060-95 = "가능……하다면……?"
13060-96 = "……."
13060-98 = "이틀 뒤 12시까지 중앙역 구청사입니다. 잊지 마십시오. 그 시간에서 1초라도 지나면 계약은 무효가 됩니다."
13060-99 = "……이상입니다. 이걸로 저희의 볼일은 끝입니다. 긴 이야기 들어주셔서 감사합니다."
13060-100 = "그럼 여기까지다."
13060-101 = "가세나."
13060-110 = "……?"
13060-111 = "자아, 가시죠. 하이랜더 감독관님. 저희를 호위해 주셔야죠!"
13060-112 = "……그럼."
13060-117 = "으음……."
13060-118 = "……."
13060-119 = "어…… 그러니까 정리하면……."
13060-121 = "아니, 아니! 누가 봐도 수상하잖아!!"
13060-122 = "세리카 쨩……?!"
13060-123 = "그러니까 빚쟁이들이 다짜고짜 찾아와서 사실 이런 계약서가 발견되었으니까, 계약을 유지할지 알려달라고?"
13060-124 = "그러니까 뭐냐고? 기껏해야 고철의 사용권이잖아. 왜 저렇게 무게를 잡는 거야?"
13060-125 = "오히려 저러니까 수상하잖아! 분명히 여기에 저 녀석들이 숨기고 있는 게 있어!"
13060-129 = "……뭐야, 시로코 선배. 왜 그렇게 따뜻한 눈빛으로 대견하다는 듯이 보는 거야……?"
13060-130 = "응. 나도 동의. 세리카가 수상하다고 여길 정도니까, 이건 진짜 뭔가 있는 거야."
13060-131 = "아니, 뭔가 칭찬해 줘서 고마우면서도 좀 열받는데……."
13060-132 = "[s] \"맞아. 일단 <사막횡단철도>의 비밀이 뭔지부터 알지 않으면 안 돼.\""
13060-133 = "네. 선생님 말씀이 맞아요. 그런 실패한 사업에 대체 무슨 비밀이 숨겨져 있는 건지……."
13060-134 = "[s3] \"일단 계약에 관계된 일이니까 신중하게 접근하자.\"\n[s4] \"아직 시간은 있으니까.\""
13060-135 = "……. 알겠습니다."
13060-136 = "……. 알겠습니다."
13060-137 = "지금 이 문제의 열쇠는 2년 전의 학생회장 쿠치나시 유메라는 분에게 있는 걸로 보여요. 호시노 선배."
13060-141 = "하지만…… 저희는 옛날 일에 대해서는 파편처럼 알고 있을 뿐이에요. 그 유메라는 분과…… 그리고 과거의 호시노 선배에게는 무슨 일이 있었던 거예요?"
13060-142 = "아, 아야네 쨩……?"
13060-143 = "호시노 선배. <아비도스 학생회> 때 있었던 일을 알려주세요. 그래야 이 문제를 정확하게 파악할 수 있어요."
13060-144 = "노노미 선배도 뭔가 알고 계시죠?"
13060-146 = "그, 그건……."
13060-148 = "……생각해 보면 여기 대책위원회실은 학생회실이 아니라 학원제사무국 교실이었죠. 그리고 1층에 있는 굳게 잠겨 있는 교실……."
13060-149 = "수많은 빈 교실들 중에 유독 그곳만 자물쇠로 잠겨 있는 게 이상했어요."
13060-150 = "거기가 원래의 학생회실이었던 거죠, 선배? 왜 거기만 잠겨 있는 거예요?"
13060-151 = "응. 나도 궁금해. 학생회장은 어째서 학교의 빚을 더하는 계약을 한 거야?"
13060-152 = "뭐? 시로코 선배도 모르는 일이야?"
13060-153 = "으응……. 자세히 들은 적은 없었어."
13060-154 = "하긴…… 시로코 선배는 도중에 선배들에게 포획된 거니까 그렇구나."
13060-155 = "포획은 아닌데……."
13060-157 = "자, 잠깐만요. 다들 갑자기 그러면 호시노 선배가 곤란하니까……."
13060-158 = "……아니, 괜찮아. 노노미 쨩."
13060-162 = "……. 그 당시 학생회장은…… 여러 가지로 문제가 많은 사람이었어."
13060-163 = "그 사람은…… 즉, 이용당하기 쉬운 바보였으니까. 이리저리 트러블에 휘말릴 때도 많았고."
13060-164 = "그, 그렇구나……. 용케 졸업했네, 그 사람……."
13060-165 = "……아니. 졸업하지 못했어."
13060-170 = "……. 유메 선배는 졸업식 전에 실종되었거든."
13060-171 = "……!!"
13060-172 = "실종……?"
13060-176 = "시, 실종?! 무, 무슨 소리야? 실종이라니?"
13060-178 = "유메 선배는 갑자기 행방불명되었고, 실종 33일 만에 아비도스 사막에서 발견되었어."
13060-179 = "헤일로가 파괴된 채로……."
13060-180 = "헤일로가……?"
13060-181 = "어, 어째서?!"
13060-182 = "……. 사고였던 것 같아. 아마도 사막에서 조난 당해서……."
13060-183 = "아마도? 조난? 정확히 무슨 일이 있었던 건데?! 좀 더 자세하게 말해줘!"
13060-184 = "……. 나도 몰라."
13060-185 = "뭐?!"
13060-186 = "어째서? 선배가 부학생회장이었다며?"
13060-187 = "그건……."
13060-188 = "……. 유메 선배가 실종되기 3일 전부터…… 난…… 선배 곁에 없었어."
13060-189 = "그래서 유메 선배가 실종되기 전의…… 60시간의 행적은…… 나도 알지 못해……."
13060-190 = "선배가 실종되었다는 것도 나중에 알았고…… 왜 선배가 사막으로 갔는지, 왜 조난 당했는지……."
13060-191 = "그때 그녀가 뭘 했는지 무슨 일이 있었는지……."
13060-192 = "무슨 생각을 했는지……."
13060-193 = "아무리 찾아내려고 해도…… 선배가 남긴 흔적을 뒤쫓았는데도…… 전부, 전부…… 뒤쫓았는데도…… 결국 알아낼 수 없었어……"
13060-194 = "분명 그 수첩에는 쓰여 있었을 텐데……."
13060-195 = "수첩……?"
13060-196 = "유메 선배는 이런 일을 언제나 그 수첩에 기록해 두었는데…… 아무리 작은 일이라도……."
13060-202 = "……그런데 이제 내가 모르는 선배의 흔적이 이렇게 발견되다니……."
13060-203 = "하지만 이건 미심쩍은 부분이 한두 개가 아니야. 도중에 계약이 중지된 것도 그렇고."
13060-204 = "이 계약서가 쓰인 지 2년이 지났다는 것도…… 이 계약서를 체결한 날짜에 유메 선배는……."
13060-205 = "………………."
13060-206 = "…………………………………………. 아."
13060-207 = "?!"
13060-208 = "……………… 이 날짜……는."
13060-209 = "호, 호시노 선배……?!"
13060-211 = "언제나 고마워. 호시노 쨩! 건강해야 해!"
13060-221 = "호, 호시노 선배!?"
13060-222 = "괘, 괜찮아? 왜 미끄러진 거야?"
13060-226 = "이 날짜……. 이 계약서가 쓰인 날짜가……."
13060-227 = "이 날짜는……."
13060-228 = "……. 유메 선배가 실종된 바로 그날이야……."
13060-229 = "……!!"
13060-235 = "사막 한가운데에 사람들이 왜 찾아옵니까!! 꿈같은 소리는 그만 하세요!!"
13060-239 = "저에게 그딴 건 필요 없어요! 그런 건 선배 혼자서 하세요!!"
13060-243 = "이제 학생회 따위 끝이에요! 이런 소꿉장난 따위 때려치워 버릴 테니까!"
13060-254 = "[ns] \"호시노?!\""
13060-255 = "호, 호시노 선배!? 어디 가?!"
13060-256 = "내가 따라가 볼게!"
13060-265 = "시로코 쨩……!"
13060-266 = "어, 어쩌지? 우리도 쫓아가야 하나?"
13060-267 = "……아니. 어차피 시로코 선배 말고 호시노 선배를 따라잡을 수 있는 사람은 없으니까……."
