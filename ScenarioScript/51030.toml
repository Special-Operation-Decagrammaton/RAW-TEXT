[translation]
51030-1 = "제3화;느닷없는 조우 2"
51030-3 = "제, 제길! 샬레의 선생까지 나타나서 덤벼들다니!"
51030-4 = "여, 역시 이런 괜한 짓은 하는 게 아니었다고!"
51030-5 = "뭐? 축제 준비를 틈타서 한몫 벌어보자고 한 건 너잖아!"
51030-6 = "무슨 소리야? 내가 언제 그런 말을…… 오히려 나도 같은 소리를 딴 사람에게 들었다고!"
51030-7 = "돼, 됐고 이, 일단 모, 모두 후퇴해!"
51030-13 = "……정말 물리쳤사와요."
51030-19 = "바, 방금 그건 뭐였나요?! 무척 대단했사와요!"
51030-20 = "지시 하나하나가 소녀가 하려는 일과 손발이 착착 맞는 것이…… 마치 옛날에 함께 놀았던 강아지와 오랜만에 다시 재회하여 함께한 것 같은 반가움이라고 할지……."
51030-21 = "혹시 방금 도와주신 귀인께서는 아주 오오오오래전에 소녀와 헤어진…… 전설 속의 소꿉친구 같은, 그런 것인가요?!"
51030-22 = "[s] \"아니, 강아지도, 소꿉친구도 아니라고 생각해…….\""
51030-23 = "앗……"
51030-24 = "아니신가요?"
51030-25 = "[s] (엄청나게 실망한 눈치네…….)"
51030-26 = "대단하기로 치면 아가씨의 몸놀림도 굉장하던데."
51030-27 = "그 복장, 거기에 한 실력 하는 걸 보니, 자네는 백화요란인가?"
51030-31 = "[ns] (백화요란이라면 분명…….)"
51030-32 = "아, 그게. 그러니까……."
51030-33 = "아니, 그럴 리는 없나. 최근에 그쪽은 <해산령>이다 뭐다 난리가 나면서 전부 근신에 들어갔다고 들은 것 같으이."
51030-38 = "아뇨!"
51030-43 = "그건 착각, 이라고 할까. 지금부터 그걸 알아보러 가고 있다……고 할까."
51030-44 = "……여기서 확! 하고 밝히기엔 집에서 도망쳐 온 게 들키니까, 역시 숨기는 게 좋을까요…… 라고 고민이 된달까……"
51030-45 = "[s] \"……?\""
51030-46 = "그래?"
51030-47 = "뭐, 복잡한 사정이 있는 모양이구먼, 자세한 건 모르겠지만 그래도 확실한 건 하나 있지."
51030-52 = "도와줘서 고맙네."
51030-53 = "자네도, 그리고 거기 있는 자네도. 꼼짝없이 잃어버렸구나. 하고 포기하고 있었는데. 참으로 고마우이."
51030-58 = "아…… 그, 이런 일쯤이야! 언제든지 도울 수 있답니다!"
51030-60 = "(그렇게 연신 감사 인사를 나누던 주민이 떠나간 뒤.)"
51030-64 = "다시 한번 정식으로 인사를 올리겠사와요."
51030-69 = "소녀의 이름은 카데……"
51030-73 = "유, 유카리라고 하여요. 방금 전의 도움은 감사드리어요."
51030-74 = "[s] \"곤경에 처한 학생을 돕는 건 당연하니까 말이야.\""
51030-75 = "네?"
51030-76 = "으음, 위기에 처한 사람을 그렇게 도와주시는 것을 두고 아무렇지도 않게 당연하다, 고 말씀하시다니."
51030-77 = "……핫!"
51030-78 = "그러고 보면 렌게 선배에게 이런 말을 들은 적이 있사와요……!"
51030-79 = "세간에는 처음엔 마치 호의가 있는 척 도와주며 친절하게 다가오지만…… 그것은 전부 악독한 올가미……!"
51030-80 = "처음부터 생색을 낼 요량으로 추후에 <나야 나, 나 몰라?>라면서 부당한 금액을 청구하는 불한당이 있기도 하다고!"
51030-81 = "………혹시, 소녀. 지금 절체절명의 위기라는 걸까요?"
51030-82 = "[s] \"아니아니, 난 수상한 사람이 아니라, 샬레의 선생이야.\""
51030-86 = "……앗, 그런 줄도 모르고 죄송합니다."
51030-87 = "하지만 선생님 덕분에 억울하게 피해를 보는 사람 없이 다시 바로잡을 수 있었사와요."
51030-88 = "으음, 이 은혜를 어떻게 갚아야 할지…… 무척이나 고민이 된다고 할지……."
51030-92 = "……으으으음. 네! 결정한 것이어요!"
51030-93 = "모처럼이기도 하니 소녀가 선생님에게 백귀야행을 안내해 드리도록 하겠사와요!"
51030-99 = "[ns] \"앗, 아니, 나는 따로 볼일이…….\""
51030-100 = "자아! 선생님! 이쪽이와요!"
51030-105 = "(그 뒤로 유카리는 솔선해서 여러 가지를 안내하고 설명해 주기 시작했다.)"
51030-108 = "백귀야행은 관광업이 번성한 학원 자치구로……."
51030-109 = "그리고 또 가장 인기 있는 공연이라면……!"
51030-118 = "(그렇게 신나서 설명하는 유카리를 따라 걷다 보니 우리는 아까 전에도 발길이 닿았던, 축제 거리에 도착할 수 있었다.)"
51030-126 = "거기! 그쪽부터 연결해! 쓰러지지 않도록 꽉 잡고!"
51030-127 = "여기! 쌓아 둔 자재는 어디로 옮기면 될까요? 빨리 자리를 비워야 하는데요!"
51030-130 = "끄으응! 축제 공연 참가자들의 리스트를 체크해 봐도 끝이 없는데……."
51030-131 = "거기! 가만히 있지 말고 빨리빨리 움직여!"
51030-132 = "여기! 다들 먹고들 해!"
51030-134 = "[ns] \"뭔가 다들 무척 바빠 보이네.\""
51030-135 = "네. 곧 축제가 열릴 예정이거든요."
51030-136 = "[s] \"근데 어째 평소 백귀야행의 축제랑은 다른 느낌인걸.\""
51030-140 = "그걸 바로 알아채시다니 선생님께서는 보는 눈이 있으시와요."
51030-141 = "그렇지 않아도 이번 축제……"
51030-142 = "<백귀야행 등불 축제>는 20년 전에 폐지되었던 축제를 다시 개최하는 것이라 더 특별하다는 모양이어요."
51030-145 = "이건 단순한 전설과도 같은 이야기지만."
51030-146 = "아주 먼 옛날…… 백귀야행 학원은 분쟁의 시대를 지나 연합으로 재탄생하게 되었사와요."
51030-149 = "하지만 싸움이 끝났다고 할지라도 상처는 쉬이 사라지지 않는 법."
51030-150 = "때문에 당시의 백귀야행을 이끌었던 사람이 제안한 것이 바로 <백귀야행 등불 축제>……."
51030-153 = "쓰라린 과거의 상처와 아픔을 등불에 담아, 앞으로의 새로운 미래를 바라는……. 그리하여 모두의 마음을 하나로 만들기 위한 축제로 알고 있사와요."
51030-154 = "[s] \"근데 그 축제가 20년 전에 폐지되었다고? ……왜?\""
51030-155 = "으음, 그건……"
51030-156 = "소녀가 태어나기도 전의 이야기라……. 거기까지는 소녀도 잘……"
51030-162 = "하하하! 그런 게 뭐가 중요하겠습니까."
51030-167 = "네, 네엣?!"
51030-169 = "자네들은 축제 도우미? 아니면 조금 일찍 찾아온 관광객인가?"
51030-170 = "뭐, 어느 쪽이든 상관없지만. 준비하는 모습이 제법 장관이지?"
51030-171 = "[s] \"아, 네……. 확실히.\""
51030-172 = "옛날에 무슨 일이 있어 폐지된 축제인지는 모르겠지만, 그래도 다시 열린 건 무척 환영할 일이죠."
51030-173 = "맞아. 백귀야행은 누가 뭐라 해도 축제의 학원이니까!"
51030-174 = "아무래도 <그날> 이후로 오래간만에 열린 축제니, 저도 모르게 다들 기합이 들어간다고나 할까요."
51030-178 = "덕분에 얼마나 바쁜지 지금이라면 고양이 손이라도 빌리고 싶은 기분이라니깐. 와핫핫!"
51030-179 = "특히나 폐지된 축제를 다시 열기 위해 마츠리부의 부장님이 어찌나 노력을 하셨던지, 정말 에너지가 넘치는 굉장한 분이셨죠."
51030-184 = "마츠리부의 부장……."
51030-185 = "[s] \"과연 시즈코가…….\""
51030-187 = "듣기로는 이번 축제엔 그 유명한 무녀님이 나와 직접 제의를 보여주는 행사가 계획되어 있다지?"
51030-188 = "아하! 잘 알고 계시는군요!"
51030-189 = "그렇지 않아도 이번 <백귀야행 등불 축제>의 하이라이트가 될 거라고 다들 이야기를……."
51030-196 = "모두가 노력하고…… 힘을 내고 있는 축제, 라는 건…… 소녀도 알고 있지만……."
51030-197 = "그래도 역시나…… 저는 이 축제보다는 백화요란을……."
51030-202 = "아가씨! <해산령>의 이야기를 듣자마자 저택을 뛰쳐나가셨다고 들었는데."
51030-203 = "이런 곳에 계셨군요!"
51030-207 = "……읏!!"
51030-212 = "[ns] \"……응?\""
51030-214 = "벌써 여기까지……! 어쩔 수 없겠군요."
51030-215 = "흠흠. 샤알-레의 선생님. 오늘은 도와주셔서 무척이나 감사했사와요. 귀인께서 소녀를 도와주신 일. 저 유카리 평생의 은혜로 생각하여 절대로 잊지 않고……"
51030-219 = "후우후우! 이제 절대로 놓치지 않겠어요!"
51030-220 = "……라고 말을 잇기엔 주어진 시간이 너무 짧아 안타까울 뿐이어요!"
51030-221 = "아쉽지만, 소녀는 여기서 먼저 물러가 보겠사와요. 그럼……!"
51030-225 = "아가씨! 기다려 주세요! 아가씨이이~~!"
51030-231 = "[ns] \"뭔가…… 바람 같았네…….\""
51030-234 = "다음화;음양부에서"
