[translation]
83300200400-7 = "후우카의 말대로 제법 많은 양의 식자재가 모여있구나."
83300200400-12 = "……고기나 우유, 달걀 같은 기본적인 물건부터……"
83300200400-17 = "이쪽에 있는 건 과자……? 발렌타인 데이에 맞춘 물건들인가?"
83300200400-18 = "양이 꽤 많은데…… 이게 전부 파티를 위한 거라면…… 발주한 주체는 역시……"
83300200400-26 = "식자재 박스 사이에 끼워져 있는 이건…… 발주 명세서인가. 이름은 분명."
83300200400-28 = "<판데모니움 소사이어티>…………."
83300200400-32 = "예년과 다르게 이번엔 급양부에게 위탁하는 방식으로 파티 준비를 하고 있나."
83300200400-33 = "마코토. 무얼 꾸미고 있는 거지?"
83300200400-34 = "……관련해서 아코와 이야기를 나눠야겠어."
