[translation]
10000025-1 = "제2화;등장! 백귀야행의 문제아들!"
10000025-3 = "캐앵~!?"
10000025-4 = "[s] \"잠깐 이즈나가 왜 여기에…….\""
10000025-5 = "후엣?! 선생님?!"
10000025-6 = "그, 그건 이즈나가 할 말이에요! 선생님이 왜 방해꾼들하고?!"
10000025-7 = "핫?! 선생님, 설마, 처음부터 이즈나를 꾀어낼 생각으로 접근을?!"
10000025-8 = "그, 그런 무서운 속셈을 가지고 이즈나에게 접근한 거였군요?!"
10000025-9 = "이즈나의 꿈을 응원해준다고 했으면서! 이 나쁜 어른!"
10000025-10 = "[s1] \"아니, 도통 무슨 소리인지…….\"\n[s2] \"그보다 이즈나의 꿈이라는 게, 이런 거였어?\""
10000025-11 = "이, 이즈나는 닌자로서! 의뢰를 수행하고 있을 뿐인걸요! 닌닌!"
10000025-12 = "이, 이즈나는 닌자로서! 의뢰를 수행하고 있을 뿐인걸요! 닌닌!"
10000025-14 = "[s] \"의뢰……?\""
10000025-18 = "헤-헹! 어때! 우리 마츠리부는 강하다구!"
10000025-19 = "일망-타진입니닷!"
10000025-20 = "크윽! 가, 강해! 녀석들, 비리비리한 주제에 왜 전보다 더 강해진 거 같지?!"
10000025-21 = "저기, 어른이 지휘하면서 마츠리부 움직임이 완전히 달라졌슴다!"
10000025-22 = "아, 안 되겠다! 이즈나 공! 일단은 작전상 후퇴가 필요한 시점이야!"
10000025-23 = "응? 자, 작전상 후퇴……?"
10000025-24 = "훌륭한 닌자라 함은, 치고 물러날 때를 아는 법! 이라고 어디선가 읽은 기억이 나!"
10000025-25 = "핫?! 그, 그럼 어쩔 수 없네요! 닌닌!"
10000025-26 = "선생님……. 절 응원해주신 선생님이 제 앞을 가로막다니……."
10000025-27 = "이 무슨 잔인한 운명의 장난!"
10000025-28 = "하지만 이즈나는 알고 있어요! 닌자에겐 이런 일도 왕왕 일어나는 법이라는 걸!"
10000025-29 = "드라마에서 봤습니다!"
10000025-30 = "[s] \"……드라마?\""
10000025-31 = "원치 않는 싸움에 휘말리는 것 또한 닌자의 숙명!"
10000025-32 = "하지만 두고 보세요. 선생님! 이즈나는 포기하지 않아요!"
10000025-33 = "다음에 돌아오면, 이즈나는 세 배는 더 강해져 있을 겁니다! 닌닌!"
10000025-35 = "(그렇게 이즈나는 순식간에 쌩하니 사라졌다.)"
10000025-37 = "보셨죠?! 또예요. 또!"
10000025-38 = "축제가 시작되자마자 망량즈 녀석들이 여기저기서 행패를 부리기 시작했어요!"
10000025-39 = "[s] \"망량즈가 뭐야?\""
10000025-40 = "길거리 망량즈."
10000025-41 = "옛날부터 백귀야행의 거리를 쏘다니는 문제아들입니다!"
10000025-42 = "예전부터 여기저기서 사고를 치긴 했어도, 이렇게 조직적으로 움직인 건 처음이라고 할까."
10000025-43 = "마치 백야앵제를 완전히 망치고 싶어 하는 것 같달까."
10000025-44 = "문제아라니, 협객으로서 내버려 둘 수 없습니다!"
10000025-45 = "으아악! 진짜 뭐냐구웃!"
10000025-46 = "지금까지는 어떻게든 마츠리부만으로 막아낼 수 있었지만!"
10000025-47 = "이대로 가다간 축제가 파탄 나는 것도 한순간……!"
10000025-48 = "아니, 진짜 이 축제가 망하면 곤란하다구?! 우리 망한다고! 으아앗!"
10000025-49 = "아……."
10000025-50 = "……(힐끔)"
10000025-51 = "막 이래☆"
10000025-52 = "[s] \"……으응.\""
10000025-53 = "음~ 피나도 이해가 안 됩니다. 왜 축제를 방해하려는 걸까요?"
10000025-54 = "녀석들은 이번 축제가 마음에 안 드는 게지."
10000025-55 = "앗, 상인회장님!"
10000025-56 = "[s] 새로 나타난 사람을 빤히 바라본다."
10000025-57 = "흥. 그렇게 쳐다볼 거 없어. 백귀야행 상점가의 상인회장을 맡고 있는 몸이올시다."
10000025-58 = "으음……. 대체 이번 축제의 뭐가 마음에 안 든다는 건가요?"
10000025-59 = "대대로 백야앵제의 대미를 장식하는 건, 전통적인 불꽃놀이였지."
10000025-60 = "하지만 이번엔 좀 다르지 않나? 새로운 시도를 한다면서 준비한 물건 말이야."
10000025-61 = "물론…… 이번 축제만을 위해 특별히 준비한 게 있긴 하지만."
10000025-65 = "(마침 탁자 위에는 철제 상자처럼 보이는 기계가 놓여있었다.)"
10000025-68 = "이번 백야앵제의 클라이맥스를 위해, 밀레니엄에서 빌려온 특제 장비예요."
10000025-69 = "피나가 듣기로는 홀로그램으로 불꽃놀이를 구현하는 special하고 nice한 기계라고 들었습니다!"
10000025-70 = "갑자기 준비한 물건이다 보니 돈도 제법 깨졌을 테지? ……뭐 어쨌든, 뭔가가 바뀌는 것을 싫어하는 녀석은 어디에나 있다는 게지."
10000025-71 = "그렇긴 하지만……. 정말 이런 거 때문에 축제를 방해한다고요?"
10000025-72 = "저는 그냥……. 이번 축제가 좀 더 즐거워졌으면 하는 바람에 준비했을 뿐인데……."
10000025-73 = "어디까지나 추측이다. 게다가 나도 이제 와서 이 일을 다시 들춰내고 싶지도 않아. 그냥. 마음에 들지 않는 녀석들도 있겠다. 하는 정도지."
10000025-74 = "그래도 이런 변화가 없다면, 더욱 즐거운 축제를 만들 순 없는 걸요!"
10000025-75 = "마츠리부 부장으로서 그것만은 자신할 수 있어요!"
10000025-76 = "오우! 네! 축제란 전보다 더욱 즐거워야만 하는 법입니다!"
10000025-77 = "흥, 그러냐. 그럼 그렇게 되도록 열심히 하게나."
10000025-78 = "뭐, 말은 그렇게 하셔도 상인회장께선 늘 도와주고 계시죠. 이번 축제도 걱정해주시고."
10000025-79 = "피나, 알고 있습니다! 이건 츤데레란 거군요!"
10000025-80 = "쓸데없는 말은 됐고! 그래서 어쩔 생각인 게냐?"
10000025-81 = "저 치들을 막지 않으면 축제는 난장판이 될 게다."
10000025-82 = "[s] \"혹시 따로 도움을 요청할 곳은 없어?\""
10000025-83 = "원래 이럴 때 도움을 받을 수 있는 동아리가 없는 건 아니지만……."
10000025-84 = "……다른 동아리가 도움이 될까요?"
10000025-85 = "[s] \"거기서부터 시작하는 거야?!\""
10000025-86 = "으으음, 그렇게까지 말씀하신다면……."
10000025-87 = "좋아요. 도움을 요청할 곳이라면 있어요. 다만."
10000025-88 = "그러기 위해서는 선생님의 도움이 필요해요!"
10000025-90 = "폐허 어딘가"
10000025-92 = "망량즈, 왜 축제를 방해하는 데 성공하지 못했지?"
10000025-93 = "계약 내용대로라면, 오늘 확실하게 훼방 놓고 축제를 중지시켰어야 하는 거 아닌가?"
10000025-94 = "결과가 이래서야 큰돈을 들여 그쪽을 고용한 의미가 없는데."
10000025-95 = "그, 그게……. 예상치 못한 복병이 나왔달까."
10000025-96 = "샬레의 선생님이 나타나서 방해했슴다! 무지 강했슴다!"
10000025-97 = "샬레? 선생님?"
10000025-98 = "맞아요! 선생님이에요!"
10000025-99 = "으음. 이즈나 공까지 무슨 말을 하는 건지."
10000025-100 = "고용주가 말했었죠."
10000025-101 = "이즈나가 열심히 의뢰를 수행하다 보면, 멋진 닌자가 될 수 있을 거라고!"
10000025-102 = "이즈나가 모실 주군과 운명적인 만남을 가질 거라고 말이죠!"
10000025-103 = "그런 말을 했던 거 같기도 하고……."
10000025-104 = "이즈나는 바로 그런 주군을 만난 걸지도 몰라요! 선생님은, 이즈나의 꿈을 응원해준 사람이었으니까요."
10000025-105 = "그것 참, 흐음, 무척이나 신기한……. 크흠흠, 그래서?"
10000025-106 = "그런 선생님이, 어째선지 그 방해꾼들과 같이 있었어요! 대체 어째서……?!"
10000025-107 = "아, 혹시…… 설마……!"
10000025-108 = "이즈나……, 깨달았어요!"
10000025-109 = "과연……. 선생님은 속고 있는 거로군요!"
10000025-110 = "잘은 모르겠지만. 실력 좋은 닌자인 이즈나 공까지 그렇게 말한다면, 선생님이라는 자는 허투루 볼 수 없겠군."
10000025-111 = "이번엔 그냥 넘어가지만, 돈을 받은 만큼 확실하게 해주길 바란다."
10000025-112 = "다음번엔 반드시 축제를 중지시킬 거야. 걱정하지 마! 보스!"
10000025-113 = "걱정하지 마시길! 이즈나도, 속고 있는 선생님을 쓰러트려서 진실을 알려주겠어요!"
10000025-114 = "쓰, 쓰러트려서?"
10000025-115 = "이즈나가 싸워서 승리하면, 선생님도 진실을 깨닫게 될 테니까요!"
10000025-116 = "으음. 그럼 어디 믿고 있겠다. 이즈나 공."
10000025-118 = "네! 맡겨만 주세요! 닌닌!"
10000025-121 = "……진짜 알아들은 거 맞지?"
