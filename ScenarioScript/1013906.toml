[translation]
1013906-1 = "니코의 이름표"
1013906-2 = "샬레 집무실"
1013906-3 = "(니코가 당번 활동을 돕기 위해 샬레 집무실에 방문한 어느 날…….)"
1013906-4 = "[ns] \"……어라?\""
1013906-7 = "무슨 일이신가요, 선생님?"
1013906-8 = "[s1] \"서랍에 스테이플러심 상자가 가득 들어 있었어.\"\n[s2] \"다 떨어진 줄 알고 어제 새로 주문했는데…….\""
1013906-11 = "이런…… 의도치 않은 낭비를 하고 말았네요."
1013906-12 = "얼마나 많이 주문하셨나요?"
1013906-13 = "[s3] \"넉넉하게 쓰려고 1년치 정도…….\"\n[s4] \"회계 담당 학생들에게 혼나겠는 걸…….\""
1013906-16 = "선생님도 무서워하는 학생이 있으시군요."
1013906-17 = "그래도 스테이플러심은 상하는 물건도 아니고, 소모품이니 쟁여두면 언젠가는 쓸 일이 있을 거예요."
1013906-18 = "그러고보니 SRT 학원에서도 재고를 깜박해서 있는 물건을 새로 주문하는 일이 가끔은 있었던 것 같아요."
1013906-19 = "대인 지뢰가 다 떨어진 줄 알고 새로 주문했는데, 나중에 알고 보니 지하실에 봉인지도 뜯지 않은 지뢰 상자가 한가득 있었다던가—"
1013906-20 = "[s] \"그래도 괜찮은 거야?!\""
1013906-21 = "괜찮아요. 키보토스에서 주인 없는 폭탄 상자를 발견하는 건 의외로 흔한 일이거든요."
1013906-22 = "다만 그 출처가 SRT 학원이라면 조금 곤란하지만요……"
1013906-23 = "그래서 그 이후로 SRT 학원에선 개인용품이나 보관함에는 이름표를 붙여 주기를 하고 있어요."
1013906-24 = "[s] \"……주기?\""
1013906-25 = "네. 공용으로 쓰는 보급품 같은 경우에는 모양이 비슷하다 보니 다른 사람이 모르고 가져가는 경우가 흔하거든요."
1013906-26 = "세탁실에서 속옷이 바뀌는 일도 일상다반사고……"
1013906-27 = "이상하게 다른 소대는 그런 일이 적다는데, FOX 소대는 서로 속옷이 뒤바뀌는 경우가 흔한 것 같아요. 어째서 그런 일이 자꾸 생기는지."
1013906-28 = "[s5] (대강 이유는 알 것 같지만…….)\n[s6] \"확실히 그건 곤란한 일이네.\""
1013906-31 = "참, 선생님. 말이 나온 김에 샬레의 비품에도 주기를 하시겠어요?"
1013906-32 = "안 그래도 당번 활동이 끝나고 소대 보급품에 주기를 하려고 새 이름표를 사왔거든요."
1013906-33 = "어디에 어떤 물건이 있는지, 누구의 소지품인지 확실하게 표기해 둔다면 오늘처럼 재고가 남아 있는지 모르고 새 물건을 주문하는 일도 줄어들 거예요."
1013906-34 = "자, 넉넉하게 사왔으니 선생님께도 나누어 드릴게요."
1013906-35 = "[s7] \"좋은 생각이야.\"\n[s8] \"그럼 사무용품 정리도 겸해서, 이름표를 붙여 볼까?\""
1013906-38 = "네!"
1013906-43 = "(이후, 니코와 함께 샬레의 여러가지 비품에 이름표를 붙였다.)"
1013906-44 = "(……이름표를 붙이며 잃어버린 줄 알았던 물건들을 집무실 곳곳에서 찾을 수 있었다.)"
1013906-47 = "[ns] \"……생각보다 시간이 오래 걸렸네.\""
1013906-48 = "네. 정말 수고 많으셨어요."
1013906-49 = "그래도 이제는 물건이 어디에 있는지, 누구의 물건인지 한 눈에 알아볼 수 있게 되었네요."
1013906-50 = "필기도구를 찾을 때는 이 서랍장을 살펴보면 되고, 인쇄용 토너나 복사용지는 프린터 옆에 있는 상자에 모두 담겨 있고……"
1013906-54 = "어라? 이름표가 하나 남았네요."
1013906-55 = "어디 안 붙인 곳이 남아 있으려나……"
1013906-56 = "[s9] \"그 이름표는 니코가 원하는 곳에 써.\"\n[s10] \"니코의 물건에 주기를 한다던가?\""
1013906-59 = "……그렇네요."
1013906-60 = "그럼 이 이름표는 제 물건에 붙여 둬야겠네요."
1013906-66 = "—에잇."
1013906-70 = "[ns] \"가, 갑자기 등은 왜 치는 거야?!\""
1013906-73 = "후후, 아무것도 아녜요."
1013906-78 = "주인을 헷갈리지 않도록 이름을 써 놓는 건 중요한 일이니까요."
