[translation]
1013906-1 = "Niko's Nametag"
1013906-2 = "Schale Executive Office"
1013906-3 = "Niko was at the Schale Executive Office for her Student Rep duties."
1013906-4 = "[ns] \"...Oh?\""
1013906-6 = ""
1013906-7 = "Is something the matter, Sensei?"
1013906-8 = "[s1] \"The drawer is full of boxes of staples.\"\n[s2] \"I thought we were out, so I ordered more yesterday...\""
1013906-11 = "Oh no... What a waste. Accidents happen, though."
1013906-12 = "How many did you order?"
1013906-13 = "[s3] \"About a year's supply, so I could use them freely...\"\n[s4] \"Our treasurer is really going to get me this time...\""
1013906-16 = "So there ARE students that even you are afraid of, Sensei."
1013906-17 = "Still, since staples don't expire anyway, there's nothing wrong with having a stockpile."
1013906-18 = "It reminds me of SRT. We'd have times when we'd forget to check inventory and end up accidentally reordering supplies we already had."
1013906-19 = "Once, we'd just put it another order for mines. Later, it turned out we'd had a whole crate of them in the basement, completely untouched—"
1013906-20 = "[s] \"How is that safe?!\""
1013906-21 = "It's okay. Finding abandoned boxes of explosives in Kivotos is actually pretty common."
1013906-22 = "Ideally they wouldn't originate from SRT, however."
1013906-23 = "To help rectify this, SRT Academy made it a rule that we had to put nametags on everything."
1013906-24 = "[s] \"...A rule?\""
1013906-25 = "We had standard-issue supplies, so it was easy for people's belongings to get mixed up."
1013906-26 = "...Underwear got switched doing laundry pretty often."
1013906-27 = "Actually, I believe that may have only been in the FOX Squad specifically. I wonder why that is."
1013906-28 = "[s5] \"(I think I have a general idea of why...)\"\n[s6] \"That sounds quite problematic.\""
1013906-31 = "Ah, Sensei. While we're at it, why don't we apply the same rule to Schale's supplies?"
1013906-32 = "I actually have some nametags here. I had some labeling to do after I finished my Student Rep shift."
1013906-33 = "If we clearly label where each item is located, and who it belongs to, we can avoid situations like today's. And then you won't have any more supply problems!"
1013906-34 = "Here, I bought a bunch, so I'll give you some too, Sensei."
1013906-35 = "[s7] \"That's a great idea.\"\n[s8] \"Well then, let's go ahead and label the office supplies as we organize them.\""
1013906-38 = "Yes!"
1013906-43 = "After that, I went around putting nametags on Schale's various supplies with Niko."
1013906-44 = "During the process, I ended up finding a lot of items that I'd previously thought were lost for good."
1013906-46 = ""
1013906-47 = "[ns] \"...That took a lot longer than expected.\""
1013906-48 = "Yes. Thank you for your hard work."
1013906-49 = "With this, now we can tell at a glance where things are and who they belong to."
1013906-50 = "Check this drawer for writing utensils. Printer toner and copy paper are all stored in the box next to the printer..."
1013906-51 = ""
1013906-53 = ""
1013906-54 = "Oh? There's one nametag left over."
1013906-55 = "I wonder if there's anything that hasn't been labeled..."
1013906-56 = "[s9] \"You can use that one wherever you want, Niko.\"\n[s10] \"What about putting it on something that belongs to you, Niko?\""
1013906-59 = "...Right."
1013906-60 = "Then, I'll put this nametag on something that belongs to me."
1013906-61 = ""
1013906-63 = ""
1013906-64 = ""
1013906-66 = "There."
1013906-67 = ""
1013906-70 = "[ns] \"D-Did you just pat my back?! Why?!\""
1013906-72 = ""
1013906-73 = "Heehee, no reason."
1013906-74 = ""
1013906-76 = ""
1013906-77 = ""
1013906-78 = "It's important to label your things. That way, there's no confusion over who the owner is."
