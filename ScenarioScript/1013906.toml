[translation]
1013906-1 = "ป้ายชื่อของนิโกะ"
1013906-2 = "สำนักงานชาเล่ต์"
1013906-3 = "(วันหนึ่งที่นิโกะมาเข้าเวรเพื่อช่วยงานที่สำนักงานชาเล่ต์...)"
1013906-4 = "[ns] \"หืม...?\""
1013906-6 = ""
1013906-7 = "มีเรื่องอะไรเหรอคะ คุณครู?"
1013906-8 = "[s1] \"มีกล่องลวดเย็บกระดาษอยู่เต็มลิ้นชักเลย\"\n[s2] \"ครูนึกว่าหมดแล้ว เมื่อวานก็เลยสั่งซื้อไปแล้วด้วย...\""
1013906-11 = "ตายจริง... แบบนั้นก็เปลืองเงินสิคะ"
1013906-12 = "สั่งซื้อไปเยอะแค่ไหนคะ?"
1013906-13 = "[s3] \"เยอะพอสำหรับใช้ได้ทั้งปีเลย...\"\n[s4] \"ต้องโดนนักเรียนฝ่ายบัญชีดุแน่เลย...\""
1013906-16 = "คุณครูก็มีนักเรียนที่ตัวเองกลัวเหมือนกันสินะคะ"
1013906-17 = "แต่ยังไงลวดเย็บกระดาษก็เป็นของใช้สิ้นเปลืองที่ไม่เน่าเสีย ตอนนี้ตุนเอาไว้ ยังไงวันข้างหน้า#nก็ต้องได้หยิบมาใช้อยู่ดีละค่ะ"
1013906-18 = "จะว่าไป เหมือนที่สถาบัน SRT ก็เคยมีเรื่องที่เราลืมเช็กสต็อก แล้วก็เผลอกดสั่งของที่มีอยู่แล้ว#nมาซ้ำเหมือนกันอยู่ค่ะ"
1013906-19 = "อย่างเช่น คิดว่าทุ่นระเบิดสังหารบุคคลหมดคลังแล้วก็เลยสั่งไปใหม่ แต่พอมาเช็กดูทีหลังก็เจอว่า#nมีระเบิดจากกล่องที่ยังไม่แกะซีลกองเป็นภูเขาในห้องใต้ดิน"
1013906-20 = "[s] \"แบบนั้นไม่เป็นอะไรเหรอ?!\""
1013906-21 = "ไม่เป็นไรค่ะ ในคิโวทอสน่ะ การเจอกล่องระเบิดที่ไม่มีเจ้าของเป็นเรื่องที่เกิดบ่อยจนเหลือจะเชื่อ#nเลยค่ะ"
1013906-22 = "แต่ถ้าแหล่งที่มาคือสถาบัน SRT เรื่องก็อาจจะยุ่งยากสักหน่อยค่ะ..."
1013906-23 = "ตั้งแต่นั้นเป็นต้นมา สถาบัน SRT ก็เลยมีมาตรการให้นักเรียนติดป้ายชื่อไว้ที่ของใช้ส่วนตัวหรือ#nล็อกเกอร์ของทุกคนค่ะ"
1013906-24 = "[s] \"เป็นมาตรการเลยเหรอ...?\""
1013906-25 = "ใช่ค่ะ พอเป็นเสบียงส่วนกลางที่ใช้ร่วมกัน หน้าตามันก็เลยคล้ายๆ กันไปหมด คนอื่นเลยชอบหยิบสลับไปโดยไม่รู้ตัวค่ะ"
1013906-26 = "เรื่องชุดชั้นในที่ปนกันในห้องซักผ้าละไม่ต้องพูดถึง..."
1013906-27 = "แปลกดีเหมือนกันนะคะที่ได้ยินว่ากองทหารอื่นไม่ค่อยเป็นกัน แต่สำหรับกองทหาร FOX เรื่องชุดชั้นใน#nสลับกันนี่ถือว่าเป็นเรื่องที่เกิดขึ้นบ่อยเลยค่ะ ทำไมเรื่องแบบนี้ถึงยังเกิดอยู่ซ้ำแล้วซ้ำเล่ากันนะ"
1013906-28 = "[s5] (พอรู้เหตุผลคร่าวๆ แล้วแหละ...)\n[s6] \"คงเป็นเรื่องที่น่าปวดหัวเลยนะ\""
1013906-31 = "จริงสิ คุณครู ไหนๆ ก็พูดเรื่องนี้ขึ้นมาแล้ว ทำไมไม่ติดป้ายชื่อที่อุปกรณ์ในชาเล่ต์ด้วยเลยล่ะคะ?"
1013906-32 = "ฉันซื้อป้ายชื่อใหม่มาพอดีเลยค่ะ กะว่าเข้าเวรวันนี้เสร็จแล้วจะเอาไปติดที่เสบียงของกองทหารน่ะค่ะ"
1013906-33 = "ถ้าติดป้ายกำกับให้ชัดเจนว่าอะไรอยู่ที่ไหนและเป็นของใคร ก็จะลดเหตุการณ์แบบวันนี้ที่สั่งซื้อ#nสินค้าใหม่โดยไม่รู้ว่ายังมีของเดิมเหลืออยู่ยังไงล่ะคะ"
1013906-34 = "ฉันซื้อมาเยอะเลย ถ้างั้นฉันจะแบ่งให้คุณครูใช้ด้วยค่ะ"
1013906-35 = "[s7] \"เป็นความคิดที่ดีเลยนะ\"\n[s8] \"งั้นก็มาติดป้ายชื่อไปพร้อมกับจัดอุปกรณ์ในสำนักงานเลยมั้ย?\""
1013906-38 = "ค่ะ!"
1013906-43 = "(แล้วคุณครูกับนิโกะก็ช่วยกันติดป้ายชื่อกำกับสิ่งของต่างๆ ในชาเล่ต์)"
1013906-44 = "(ระหว่างนี้คุณครูก็เจอของที่คิดว่าหายไปแล้วจากทั่วทั้งสำนักงาน)"
1013906-46 = ""
1013906-47 = "[ns] \"ใช้เวลามากกว่าที่คิดอีกนะเนี่ย...\""
1013906-48 = "ค่ะ ทำได้ดีมากเลยค่ะ"
1013906-49 = "พอทำแบบนี้แล้ว ทีนี้มองปราดเดียวก็รู้แล้วค่ะว่าของชิ้นไหนอยู่ตรงไหน แล้วอันไหนเป็นของใคร"
1013906-50 = "ถ้าจะหาพวกเครื่องเขียนก็ให้มาดูที่ตู้ลิ้นชักนี้ ส่วนพวกโทนเนอร์กับกระดาษสำหรับถ่ายเอกสาร#nก็อยู่ในกล่องข้างๆ เครื่องพิมพ์..."
1013906-51 = ""
1013906-53 = ""
1013906-54 = "เอ๋? ยังเหลือป้ายชื่ออยู่อันหนึ่งค่ะ"
1013906-55 = "ยังมีตรงไหนให้แปะได้อีกมั้ยนะ..."
1013906-56 = "[s9] \"นิโกะเอาไปติดในที่ที่ต้องการได้เลย\"\n[s10] \"นิโกะเอาไปแปะของของตัวเองก็ได้นะ\""
1013906-59 = "นั่นสินะคะ..."
1013906-60 = "ฉันคงต้องเอาป้ายชื่อนี้ไปติดไว้ที่ของของฉันแล้วละค่ะ"
1013906-61 = ""
1013906-63 = ""
1013906-64 = ""
1013906-66 = "นี่แหนะ!"
1013906-67 = ""
1013906-70 = "[ns] \"ทะ... ทำไมจู่ๆ ถึงมาตีหลังครูล่ะ?!\""
1013906-72 = ""
1013906-73 = "ฮุฮุ ไม่มีอะไรหรอกค่ะ"
1013906-74 = ""
1013906-76 = ""
1013906-77 = ""
1013906-78 = "ก็การแปะชื่อไว้เพื่อไม่ให้สับสนว่าใครเป็นเจ้าของมันเป็นเรื่องสำคัญนี่คะ"
