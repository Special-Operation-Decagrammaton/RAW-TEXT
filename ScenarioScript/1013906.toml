[translation]
1013906-1 = "仁子的名牌"
1013906-2 = "夏萊辦公室"
1013906-3 = "（仁子為了協助值日工作，造訪夏萊辦公室的某一天……）"
1013906-4 = "[ns] 「……咦？」"
1013906-6 = ""
1013906-7 = "怎麼了嗎，老師？"
1013906-8 = "[s1] 「抽屜裡裝滿了一整盒的釘書針。」\n[s2] 「我還以為用完了，昨天才重新訂了新的……」"
1013906-11 = "這下……不小心造成庫存過多的情況了呢。"
1013906-12 = "您訂了多少呢？"
1013906-13 = "[s3] 「想說可以用得寬裕一點，所以訂了大概一年份……」\n[s4] 「會被負責會計的學生罵的……」"
1013906-16 = "原來老師也有害怕的學生啊。"
1013906-17 = "不過釘書針是消耗品也不會過期，總有一天會用得上的。"
1013906-18 = "這麼說來，SRT學園好像也偶爾會因為搞錯庫存，把明明還有的物資重新訂購一遍。"
1013906-19 = "比如以為反步兵地雷用完就訂了新的……#n後來才發現地下室裡有一堆連封條都還沒拆的地雷箱之類的……"
1013906-20 = "[s] 「那樣真的沒問題嗎！？」"
1013906-21 = "沒問題呀。在奇普托斯發現沒有主人的炸彈箱，其實出乎意料地常見呢。"
1013906-22 = "只不過如果那個來源是SRT學園的話，就會有點傷腦筋了……"
1013906-23 = "所以在那之後，SRT學園就規定要在個人用品和置物櫃上貼名牌。"
1013906-24 = "[s] 「……規定？」"
1013906-25 = "是的。像是共用的補給品，很容易因為外型相似而被別人不小心拿錯。"
1013906-26 = "在洗衣間裡拿錯內衣也是家常便飯……"
1013906-27 = "奇怪的是其他小隊好像很少遇到這種情況，在我們FOX小隊卻還挺常見的。#n究竟是為什麼呢……"
1013906-28 = "[s5] （理由我大概猜得到啦……）\n[s6] 「那的確是件傷腦筋的事呢。」"
1013906-31 = "對了，老師。#n趁這個機會，要不要也在夏萊的備品上做標記呢？"
1013906-32 = "我正好為了值日工作結束後要在小隊的補給品上做標記，所以買了新的名牌。"
1013906-33 = "如果把什麼地方有什麼東西，是誰的所有物都明確標示出來的話……#n像今天這樣的情況也會減少哦。"
1013906-34 = "來，我準備了很多，也分一些給老師吧。"
1013906-35 = "[s7] 「好主意。」\n[s8] 「那就順便整理一下辦公用品吧？」"
1013906-38 = "好的！"
1013906-43 = "（之後，和仁子一起在夏萊的各種備品上貼了名牌）"
1013906-44 = "（……貼名牌的過程中，原以為弄丟的東西都在辦公室各處找了出來）"
1013906-46 = ""
1013906-47 = "[ns] 「……比想像中花了更多時間呢。」"
1013906-48 = "是啊。真是辛苦您了。"
1013906-49 = "不過現在東西放在哪裡，是誰的物品，都能一目了然呢。"
1013906-50 = "文具都收在這個抽屜櫃裡，需要的時候來這裡找就好。#n列印用的碳粉和影印紙也都裝在印表機旁邊的箱子裡……"
1013906-51 = ""
1013906-53 = ""
1013906-54 = "咦？還剩下一張名牌呢。"
1013906-55 = "是不是還有哪裡沒貼到……"
1013906-56 = "[s9] 「那張名牌就用在仁子想用的地方吧。」\n[s10] 「比如在仁子自己的東西上做標記？」"
1013906-59 = "……這樣啊。"
1013906-60 = "那麼這張名牌，就貼在我自己的東西上吧。"
1013906-61 = ""
1013906-63 = ""
1013906-64 = ""
1013906-66 = "……嘿咿。"
1013906-67 = ""
1013906-70 = "[ns] 「為，為什麼突然拍我的背！？」"
1013906-72 = ""
1013906-73 = "呵呵，沒什麼。"
1013906-74 = ""
1013906-76 = ""
1013906-77 = ""
1013906-78 = "為了避免搞錯主人，寫上名字可是很重要的呢。"
