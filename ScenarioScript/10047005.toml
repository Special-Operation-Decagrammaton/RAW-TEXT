[translation]
10047005-1 = "프롤로그;예언"
10047005-5 = "……자. 드디어 때가 왔습니다."
10047005-6 = "아르카나의 인도에 따라 새로운 미래를 점지할 시간이."
10047005-7 = "뉴후후……그러면 시작하죠. #n<험한 것>이 종말을 불러일으키기 전에."
10047005-13 = "……운명의 부름에 이끌린 자여."
10047005-14 = "곧 별의 가호가 희망을 세공할지니."
10047005-15 = "그것은 부정을 몰아내는 여명의 태양이자……."
10047005-16 = "좌절을 뚫고 나아가는 승리의 전차."
10047005-17 = "그 위대한 힘이 불온의 탑을 무너뜨리고……."
10047005-19 = "찬란한 새벽을 불러오리라."
10047005-24 = "오오, 이 점괘는……!"
10047005-25 = "틀림없어요. 이건 분명 모두의 염원이 이루어질 거라는 예언!"
10047005-26 = "뉴후후. 제 예술 센스가 폭발하는 날도…… 가까워요!"
10047005-27 = "뉴훗, 뉴후후후……."
10047005-28 = "뉴후후후후후……!!"
10047005-32 = "자! 이제 어떤 미래가 다가오든 두렵지 않아요!"
10047005-33 = "그럼 시작하는 겁니다!"
10047005-34 = "역사에 새겨질, 눈부신 첫걸음을!"
