[translation]
10059040-1 = "제4화;수상한 유통업자"
10059040-2 = "(다음 날. 예술 평의회를 찾았다.)"
10059040-5 = "어서 오세요, 선생님. 기다리고 있었답니다."
10059040-6 = "마음 같아서는 가벼운 만담으로 어제의 노고를 위로하고 싶습니다만, 지금은 그럴 때가 아니군요."
10059040-7 = "바로 회의에 들어가도록 하겠습니다."
10059040-8 = "카논 서기관. 시작해 주세요."
10059040-13 = "아시겠지만, 어제 불법 경매장을 습격해 관련 장부와 다수의 관계자를 체포했습니다."
10059040-14 = "그것을 토대로 거래 내역을 추적해 본 결과, 평의회는 다음과 같은 결론을 내렸죠."
10059040-15 = "블랙마켓의 불법 자금 세탁에, 와일드헌트의 이름이 이용됐다고 말입니다."
10059040-16 = "[s] \"……역시 꽤 심각한 사건이었네.\""
10059040-17 = "저는…… 어제 체포한 관계자들을 회유해 보려 했어요."
10059040-18 = "당근과 채찍 전략을 써서…… #n마나미 님이 채찍을 휘두르시면 제가 당근을 드리는 느낌이라고 해야 할까……."
10059040-19 = "마나미 님이 진짜로 채찍을 휘두르시는 바람에 곤란했었다고 할까……."
10059040-20 = "참으로 즐거운 기록의 현장이었죠."
10059040-24 = "아, 아무튼 저는 상대의 호감을 얻어서 정보를 얻는 방법을 썼어요."
10059040-25 = "하지만…… 결국 아무 정보도 얻지 못했어요."
10059040-26 = "다들 입이 너무 무겁더라고요."
10059040-27 = "세상에서 그 무엇보다 자신들의 클라이언트를 두려워하는 것 같았어요."
10059040-28 = "<배신하면 영원히 매장> ……이라고."
10059040-29 = "약속이나 한 것처럼 똑같은 말을 했어요."
10059040-30 = "그 클라이언트가 누구인지는 모르겠지만…… 그쪽 세계에서는 상당히 유명한 인물인 모양이에요."
10059040-31 = "그렇습니다. 상대는 범죄 집단의 거물."
10059040-32 = "정체를 드러내지 않고 물자와 자금을 유통하며, 거대한 영향력을 끼치고 있죠."
10059040-33 = "[s] \"짐작 가는 사람은 있어?\""
10059040-34 = "역시 그 도둑고양이가……"
10059040-35 = "……라고 말하고 싶지만, 아닌 것 같군요."
10059040-36 = "그 겁 많은 도망자가 범죄자들이 두려워하는 거물일 리가 없어요. #n정황상 제3의 인물이겠죠."
10059040-37 = "……하지만 그 정체를 알 수 없군요."
10059040-38 = "일단은 내부의 단속을 강화하며 관련자를 색출해 내는 작업에 들어가야 할 것 같습니다."
10059040-39 = "겸사겸사 그 도둑고양이를 붙잡을 단서도 찾았으면 좋겠고요."
10059040-40 = "붙잡는다면…… 평생 우유만 먹는 형벌을 내리겠어요."
10059040-41 = "특별히 인심을 써서 저희가 마시는 프리미엄 우유를 주도록 하죠."
10059040-42 = "매일매일 배송되는 신선한 우유를 잔뜩 먹이는……."
10059040-46 = "……음? 잠깐만요."
10059040-47 = "매일매일 배송되는…… 신선한 우유?"
10059040-55 = "여러분. 학원에 이 제품이 들어오기 시작한 시점이 언제였죠?"
10059040-56 = "두 달 전이었습니다."
10059040-57 = "학원에 수상한 구매자가 나타난 시점은?"
10059040-58 = "저, 그게…… 대략 두 달 전이었어요."
10059040-59 = "……수상하군요."
10059040-60 = "[s] \"갑자기 우유가 왜?\""
10059040-61 = "수상한 구매자와 우유 유통은 전혀 상관없어 보이지만…… #n이상하게 시기가 맞물립니다."
10059040-62 = "조사해서 손해 볼 건 없겠죠."
10059040-63 = "카논 서기관. 지금 즉시 우유 유통업자와 연결해 주세요."
10059040-64 = "제가 직접 이야기를 나눠 보겠습니다."
10059040-67 = "분부대로."
10059040-73 = "오오, 평의회장님? 안녕하십니까. 무슨 일이신가요?"
10059040-74 = "안녕하십니까."
10059040-75 = "갑작스럽습니다만, 최근 발생한 이슈 때문에 연락드렸습니다."
10059040-76 = "귀사의 물류 이동을 전반적으로 점검했으면 하는데, 괜찮으신지요?"
10059040-77 = "네? 가, 갑자기요?"
10059040-78 = "뭐 딱히 상관없습니다만…… 언제 말씀입니까?"
10059040-79 = "지금 당장입니다."
10059040-80 = "지, 지금 당장?"
10059040-81 = "곤란하신가요?"
10059040-82 = "아, 아닙니다! 지금 바로 찾아가 안내하겠습니다!"
10059040-87 = "[ns] \"저쪽 대응이 상당히 빠른데?\""
10059040-88 = "우리 학원의 물류 유통권은 쉽게 나오지 않으니, 어떻게든 잘 보이고 싶겠죠."
10059040-89 = "본인이 범죄와 연관이 있든 없든 간에요."
10059040-90 = "과연 어떤 결과가 나올지…… 업자가 도착하는 즉시 유통 경로를 안내받도록 하죠."
10059040-92 = "(잠시 후. 유통업자가 도착해, 함께 관련 시설을 점검했다.)"
10059040-94 = "아시다시피 저희 유제품은 품질이 좋은 대신 유통기한이 비교적 짧은 편입니다."
10059040-95 = "때문에 무엇보다 빠르고 안전한 이송 수단이 필요했죠."
10059040-96 = "그래서 선택한 것이 하이랜더 철도학원과의 협업입니다."
10059040-97 = "키보토스 전역으로 뻗은 철도망 덕분에 안전하고 빠른 배송이 가능하죠."
10059040-98 = "모든 유통은 하이랜더의 협조 아래 진행되고, 관계자 외의 인물은 해당 과정에 개입할 수 없습니다."
10059040-99 = "수상한 사람이 물류에 개입하는 건 원칙적으로 불가능하다는 거죠."
10059040-107 = "이곳은 저희 유통의 컨트롤 룸입니다."
10059040-108 = "카메라가 24시간 빈틈없이 열차를 비추며 이상 징후를 파악하죠."
10059040-109 = "해당 데이터는 자동으로 백업되어 별도의 서버에 1년간 저장됩니다."
10059040-110 = "점검이 필요하다고 말씀하신 최근 두 달의 데이터도 남김없이 저장되어 있죠."
10059040-111 = "지금 당장 함께 확인해 보시죠."
10059040-117 = "이곳은 저희의 장부를 보관하는 장소로, 마치 은행의 비밀 금고에 준하는 시설을 갖추고 있습니다."
10059040-118 = "경비원이 24시간 2인 1조로 근무하며 철저히 출입을 통제하고 있죠."
10059040-119 = "하지만 저와 함께라면 언제든지 들어가실 수 있습니다."
10059040-120 = "자, 확인해 보고 싶은 것이 어느 시점인지만 말씀 주십시오. 깨끗하고 투명하게 공개하겠습니다."
10059040-125 = "(이후 더 많은 시설을 둘러보았지만, 딱히 이상 징후를 발견하진 못했다.)"
10059040-127 = "후후후, 다들 이견이 없으신 것 같아서 다행이군요."
10059040-128 = "그럼 돌아가는 길도 부디 편안하시길."
10059040-132 = "확실히, 철저하게 관리되고 있군요."
10059040-133 = "지나칠 정도로 말이에요."
10059040-134 = "[s] \"너무 철저해서 오히려 수상하다는 거야?\""
10059040-135 = "네. 거짓은 진실 속에 감출 때 위력을 발휘한다고 생각하거든요."
10059040-136 = "딱히 마나미 님이 자주 사용하는 방법은 아닙니다. 그냥 그렇다는 이야기입니다."
10059040-137 = "아무튼, 우유 유통 장부를 은행 비밀 금고에 준하는 시설에 보관한다니. 쓸데없는 낭비예요."
10059040-138 = "아무래도 유통업자와 들른 곳 이외의 다른 현장도 살펴볼 필요가 있을 것 같네요."
10059040-139 = "아무리 통제가 잘 된다고 하더라도, 현장의 구석까진 그 영향이 미치지 않을 터."
10059040-140 = "작은 소문이라도 좋으니, 의심스러운 것들을 모두 모으는 거예요."
10059040-141 = "과연. 그럼 팀을 나눠서 진행하는 것이 좋겠군요."
10059040-142 = "꽤 넓은 범위를 조사해야 할 테니까요."
10059040-143 = "아, 그러면…… 한 쌍으로 움직이는 새들처럼 2인 1조로 움직이면 어떨까요?"
10059040-144 = "선생님은…… 누구랑 같이 가는 게 편하세요?"
10059040-145 = "오호. 이거 얌전한 우라라 님치고는 꽤 공격적인 질문이군요."
10059040-146 = "우리 셋 중에 가장 좋은 사람이 누구냐니."
10059040-147 = "네……? 그, 그런 질문이 되는 건가요?!"
10059040-148 = "죄, 죄송해요! 별다른 의도는 없었어요! 저는 마나미 님의 결정에 따를게요!"
10059040-149 = "흐음……."
10059040-150 = "원래라면 학원의 대표인 제가 샬레의 대표인 선생님과 함께하는 것이 맞겠지만……."
10059040-151 = "지금은 우라라 부회장이 선생님의 보조를 하는 것이 좋겠군요."
10059040-152 = "카논 서기관이 무조건 저를 따라오려 할 테니……."
10059040-153 = "그렇습니다. 마나미 님의 행동을 기록하는 건, 서기관인 저의 일."
10059040-154 = "오늘과 같은 중대한 조사라면 더더욱 자세한 기록을 남겨야겠죠."
10059040-155 = "아름답게 보존된 기억을 후대에 전수하는 것이야말로, #n제가 느낄 수 있는 가장 큰 기쁨이니까요."
10059040-156 = "그러니 어디든 따라다니며 보좌하겠습니다, 마나미 님."
10059040-157 = "[s] \"……마나미도 고생이 많네.\""
10059040-158 = "후후, 이젠 익숙해졌답니다."
10059040-159 = "카논 서기관도 악의가 있어서 그러는 건 아니니까요."
10059040-160 = "아무튼 이런 이유로, 저는 카논 서기관과 함께해야 할 것 같습니다."
10059040-161 = "그럼 선생님. 우라라 부회장을 잘 부탁드립니다."
10059040-162 = "제가 인정하는 훌륭한 인재이니, 여러 방면에서 많은 도움이 될 거예요."
10059040-166 = "해석하자면……."
10059040-167 = "내가 아끼는 우라라 부회장에게 수상한 짓 하면 가만 안 둔다는 뜻입니다."
10059040-171 = "[ns] \"그건 해석 안 해줘도 잘 알고 있어!\""
10059040-172 = "네. 잘 알고 계신다니 다행이군요."
10059040-173 = "그럼 두 분, 자료 수집 잘 부탁드립니다. 내일 오전에 평의회실에서 뵙죠."
10059040-181 = "아하하…… 죄송해요. 저희 때문에 고생이 많으시죠?"
10059040-182 = "[s] \"아니야. 적당히 긴장감 있어서 좋아.\""
10059040-183 = "마나미 님도, 카논 님도 모두 장난기가 많으셔서……."
10059040-184 = "혹시라도 곤란하실 때는 저에게 부담 없이 말씀 주세요."
10059040-185 = "이래 보여도 저, 부회장이니까…… #n선생님의 앞에 놓인 밤이슬 정도는 털어내 드릴 수 있으니까요……."
10059040-186 = "[s1] \"아니야. 정말 괜찮아.\"\n[s2] \"평소에도 우라라가 신경 써주고 있으니까.\""
10059040-189 = "그, 그렇군요……."
10059040-190 = "그렇게 말씀해 주시니…… 정말 감사해요."
10059040-191 = "[s] (뭔가…… 치유되는 향기가 난다…….)"
10059040-192 = "……아. 죄송해요. 이러고 있을 때가 아닌데."
10059040-193 = "어서 조사를 시작해요."
10059040-194 = "우리가 두 분보다 더 많은 정보를 모으는 거예요!"
10059040-199 = "(이후 어딘가 들떠 보이는 우라라와 함께 열차의 노선을 돌아보았다.)"
10059040-213 = "(여러 소문을 들었지만…… 대부분 의미 없는 이야기였다.)"
10059040-214 = "(마지막에 입수한 것 이외에는 말이다.)"
10059040-216 = "목장 근처의 역"
10059040-217 = "네? 우유 유통업자요……?"
10059040-221 = "흐음, 역시 그 소문이 진짜인 건가……."
10059040-222 = "네……? 어떤 소문을 말씀하시는 거죠?"
10059040-223 = "어…… 이건 정말로 단순한 소문일 뿐인데요."
10059040-224 = "이런 이야기를 얼핏 들은 적이 있어요."
10059040-225 = "프리미엄 우유를 납품하는 업자가 어느 유명한 죄수와 연결되어 있다고……."
10059040-229 = "유명한 죄수라면 설마…… 일곱 죄수와 연관이 있는 건가요?"
10059040-230 = "그렇다고 하던데……."
10059040-231 = "제 기억이 맞는다면…… 이런 이름이었어요."
10059040-235 = "[log=하이랜더 기관사]배금의 브로커[/log]"
10059040-238 = "[ns] \"배금의…… 브로커?\""
10059040-241 = "상당히…… 위험한 향기가 나네요."
