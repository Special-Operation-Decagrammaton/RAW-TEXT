[translation]
1012606-1 = "그건…… 내가 아니야"
1012606-4 = "(일단 오늘의 업무를 위해 사무실을 나섰다.)"
1012606-5 = "애옹~ 애오오옹~"
1012606-6 = "까악~ 까아아악~"
1012606-7 = "[ns] \"……검은 고양이랑 까마귀?\""
1012606-13 = "[ns] \"……?!\""
1012606-14 = "이…… 히히……."
1012606-15 = "[ns1] (……뭔가 평소보다 어두운 기운이 느껴진다.)\n[ns2] (카노에의 부탁대로 일단 무시하자……!)"
1012606-21 = "애옹~! 애오오옹~!"
1012606-25 = "……."
1012606-26 = "[ns] \"뭣……?!\""
1012606-30 = "까악~! 까아아악~!"
1012606-33 = "……."
1012606-34 = "[ns] \"여, 여기도?!\""
1012606-38 = "……."
1012606-39 = "[ns] \"도대체 어떻게?!\""
1012606-41 = "(……어디를 가도 카노에가 보였다.)"
1012606-45 = "(일단 예정대로 차례차례 업무를 처리해 나갔다.)"
1012606-60 = "(역시 어디를 가도 카노에가 보였다…….)"
1012606-63 = "[ns] \"허억, 허억, 허억…….\""
1012606-64 = "아, 오셨군요. 업무차 방문하신다는 연락 받았습니다."
1012606-65 = "그런데…… 생각보다 일찍 오셨네요? 천천히 오셔도 됐는데."
1012606-66 = "[s] \"그, 그게 말이지…….\""
1012606-68 = "(계속 카노에에게 쫓기던 일을 설명한다.)"
1012606-70 = "카노에? 존재 자체가 오컬트라는 그 이타가키 카노에?"
1012606-71 = "[s] \"존재 자체가 오컬트라는 건 무슨 소리야……?\""
1012606-72 = "그 아이, 항상 검은 고양이랑 까마귀가 따라다니잖아요."
1012606-73 = "본인 말로는 전혀 모르는 애들이라던데, 그게 가능한 거냐고요."
1012606-74 = "(……심지어 카노에의 말도 잘 듣는다.)"
1012606-75 = "손도 차갑고, 피부도 창백하고……."
1012606-76 = "수상할 정도로 다양한 목소리를 내는데, 뭐가 진짜 목소리인지 모른다는 소문도 있어요."
1012606-78 = "(……카노에의 장난에 여러 번 당했던 터라 부정할 수가 없었다.)"
1012606-80 = "어쩌면 그 녀석…… 유령일지도 몰라요."
1012606-81 = "지금도 히히 웃으면서 우릴 몰래 쳐다보고 있을지도……!"
1012606-82 = "[ns] \"……!\""
1012606-89 = "(흠칫 놀라 주변을 살폈지만, 카노에의 모습은 보이지 않았다.)"
1012606-90 = "……라고 말은 했지만, 우리 학원은 워낙 괴짜들이 많아서 말이죠."
1012606-91 = "그냥 장난치는 걸지도 모르니 너무 신경 쓰진 마세요."
1012606-92 = "우리도 그냥 그러려니 하고 있으니까."
1012606-93 = "[s] \"그, 그렇겠지? 하하…….\""
1012606-95 = "(일단 서둘러 업무를 마치고 사무실로 복귀했다.)"
1012606-96 = "(그렇게 다음 날…….)"
1012606-99 = "(카노에의 전화다.)"
1012606-100 = "(안전해지면 연락하겠다는 말이 떠올랐다.)"
1012606-105 = "선생……. 어제는 별일 없었지……?"
1012606-106 = "이젠 괜찮으니까, 평소처럼 해도 돼……."
1012606-107 = "[s3] \"도대체 무슨 일이었던 거야?\"\n[s4] \"어딜 가도 카노에가 보이던데…….\""
1012606-110 = "우선 사과부터 할게……."
1012606-111 = "미안. 내가 실수했어."
1012606-112 = "완벽한 의식이라 생각했는데, 실패할 줄이야……."
1012606-113 = "[s] \"의, 의식? 어떤 의식……?\""
1012606-114 = "악령 소환 의식."
1012606-115 = "그런데 실패의 부작용으로 나랑 닮은 녀석이 나왔지 뭐야."
1012606-116 = "성격도 똑같아서…… 바로 선생을 만나러 간 것 같아."
1012606-117 = "[s] \"그럼 어제 내가 본 카노에가 전부……?\""
1012606-118 = "그래. 전부 악령이었어."
1012606-119 = "걱정 마. 지금은 어떻게든 원래 있던 곳으로 돌려보냈으니까……"
1012606-120 = "[s5] \"정말 악령이었다고?\"\n[s6] \"카노에 본인이 아니라……?\""
1012606-123 = "응…… 절대로 바쁜 선생을…… 먼발치에서나마 보고 싶어서 그랬던 게 아니야."
1012606-124 = "힘들게 얻은 외출증을…… 어떻게 의미 있게 써볼까 고민했던 것도 아니고……."
1012606-125 = "[s] \"결국 본인이었다는 거잖아!\""
1012606-126 = "마음대로 생각해. 난 분명 의식의 부작용이라 말했으니까."
1012606-127 = "이히히……"
1012606-132 = "(……어제 봤던 카노에는 도대체 뭐였을까.)"
1012606-133 = "(결국 그날의 진실은 영원히 알지 못했다…….)"
1012606-134 = "히히……"
1012606-135 = "이히히히……!"
