[translation]
10053090-1 = "에필로그;츠치노코는 파랗다"
10053090-2 = "(사흘째)"
10053090-3 = "으아아아아!!!! 이거 놓으십쇼!!!!!"
10053090-5 = "아직 늦지 않았어!!! 아니, 오히려 아슬아슬하게 세이프!!!"
10053090-10 = "바보야! 이 밤에 산으로 가는 건 진짜 위험하다고!"
10053090-11 = "하지만, 오늘을 넘기면, 인생 최악의 불운이!!!"
10053090-12 = "츠치노코가 아니라도 좋아!! 뒷산에서 뱀이라도 잡아서 돌아오면……!!"
10053090-13 = "다들 보고만 있지 말고, 좀 말려봐!!"
10053090-17 = "아니, 저희도 온 힘을 다하고 있는데요……!!"
10053090-21 = "이게 사람이야, 탱크야……?!"
10053090-25 = "자, 잠깐만요!! 발 헛디뎠어요!! 크아아악!! 무릎 쓸린다!!"
10053090-30 = "다들 잠깐!"
10053090-31 = "코노카 군, 중요한 이야기가 있어."
10053090-36 = "말릴 생각하지 마. 소장이라 해도 안 봐줄 거니까."
10053090-37 = "아니, 말릴 셈은 없어. 하지만 들어줘. 방금, 아주 중요한 사실을 깨달았어."
10053090-38 = "나의 계산대로라면, 코노카 군의 '최악의 사흘째'는……!"
10053090-40 = "이미 지나갔다고……!!"
10053090-46 = "…………."
10053090-47 = "…………엥?"
10053090-48 = "처음 들었을 때부터 위화감은 있었어. 운세라는 것은, 보통 그날의 일을 말하는 것일 테니까."
10053090-49 = "그럼에도 사흘째의 운세를 말한다면…… 그것은, 당일을 포함하고 있는 것이 아닌가! 하고."
10053090-50 = "즉, 코노카 군의 '최악의 사흘째'는, 바로 어제였던 거야!!"
10053090-51 = "내 최악의 날이…… 이미 지났다고……?"
10053090-52 = "…………."
10053090-53 = "……? 아무 일도 안 일어났는데……?"
10053090-58 = "거 보라니까. 애초에 운세라는 건 그런 거거든."
10053090-59 = "항상 맞는 게 아니라, 맞을 때를 기억하는 거야. 즉, 머피의 법칙일 뿐이라ㄱ……."
10053090-73 = "아니……."
10053090-74 = "있었잖아, 무진장 있었거든?! 최악의 일?!"
10053090-75 = "뭔 로봇한테 공격당하고!!"
10053090-76 = "밤에는 난생처음 보는 불량배들한테 습격당하고!!"
10053090-77 = "오히려 최악의 일뿐이었거든?!"
10053090-82 = "어, 그거 혹시 우리 이야기?"
10053090-83 = "밤에 공격한 거는 미안하긴 한데, 최악이라고 할 것까지는 없지 않나……."
10053090-88 = "아, 미안……."
10053090-89 = "……이 아니라!!"
10053090-90 = "샤아악!! 최악의 행동 맞잖아!!"
10053090-91 = "은근슬쩍 마음 약해지게 말하지 말라고!!"
10053090-96 = "아니, 고작 탱크 정도랑 싸운 게 무슨 최악……."
10053090-97 = "그 말은 즉, 사흘이 지났는데도, 최악의 날이 오지 않았다……?"
10053090-101 = "어쩌면, 설마?!"
10053090-102 = "나는 이미 츠치노코와 만난 적이 있는 건가?!"
10053090-103 = "아니아니, 그렇지만, 여기 와서 뱀 비슷한 것도 본 적이 없는……."
10053090-106 = "애초에 츠치노코는 뭐야? 뚱뚱하게 생겼다는 거 말고 다른 특징 없어?"
10053090-110 = "일단, 뚱뚱한 뱀이라는 표현은 사실과 달라. 실제로 츠치노코는 마름모꼴에 가깝다지."
10053090-111 = "그리고, 일반적인 뱀과 달리 상대를 위협할 때 샤아악! 하는 울음소리를 낸다고도 하지."
10053090-112 = "그리고, 무엇보다 대단한 것은 점프력! 제자리에서 1m 높이 가까이 점프할 수 있다고 해!"
10053090-115 = "샤아악!!! 샤아아악!!!"
10053090-116 = "츠치노코다!!!!"
10053090-122 = "어, 어어……?! 뭐야?!"
10053090-123 = "갑자기 왜 껴안고 그래?! 징그럽게?!"
10053090-124 = "아니, 그냥……."
10053090-128 = "어쩌면, 지금까지의 모험이야말로, 진정한 츠치노코였을지도……."
10053090-129 = "왜 그래?! 갑자기 너까지 미쳤어?!"
10053090-131 = "(……그렇게 츠치노코를 찾는 우리들의 모험은 마무리되었다.)"
10053090-139 = "햐~ 깨끗하니까, 얼마나 보기 좋아!"
10053090-140 = "……아니, 여기 정리는 왜 한 거야? 이제 떠날 거 아니야?"
10053090-141 = "응? 왜? 돈 아깝게? 일주일 빌렸으니까, 제대로 놀다 가야지."
10053090-142 = "어?! 그런 거였어?! 나는 틀림없이, 외계인의 비밀기지로 이어지는 입구를 찾는 줄 알았는데?!"
10053090-147 = "……저기, 청소 다 했으니까 저는 가봐도……?"
10053090-148 = "포기해. 절대 안 놔줄 걸."
10053090-149 = "이렇게 된 이상, 그냥 맘 편히 놀다 가자고."
10053090-154 = "키보토스 미스터리 스페셜 ~미지의 생물, 츠치노코를 찾아서~"
