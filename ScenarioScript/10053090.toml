[translation]
10053090-1 = "บทส่งท้าย;สึจิโนโกะตัวสีฟ้า"
10053090-2 = "(วันที่สาม)"
10053090-3 = "อ๊ากกกกก!!!! ปล่อยนะคะ!!!!!"
10053090-5 = "ยังไม่สายไปนะ!!! ไม่สิ ต้องบอกว่าทันเวลาแบบฉิวเฉียดเลยต่างหาก!!!"
10053090-10 = "ยัยบื้อเอ๊ย! มาเตร็ดเตร่ในภูเขาตอนกลางคืนมันอันตรายมากนะ!"
10053090-11 = "แต่ถ้าผ่านพ้นวันนี้ไป ฉันจะต้องเจอความโชคร้ายที่สุดในชีวิต!!!"
10053090-12 = "ต่อให้ไม่ใช่สึจิโนโกะก็ไม่เป็นไร!! ขอแค่จับงูจากภูเขาข้างหลังนี้ไปได้...!!"
10053090-13 = "ทุกคนอย่ามัวแต่ยืนดูอยู่เฉยๆ สิ มาช่วยกันห้ามหน่อย!!"
10053090-17 = "พวกฉันก็พยายามเต็มที่อยู่เหมือนกันนะคะ...!!"
10053090-21 = "นี่คนหรือรถถังกันเนี่ย...?!"
10053090-25 = "ดะ... เดี๋ยวก่อนค่ะ!! ฉันก้าวพลาดค่ะ!! โอ๊ยยย!! หัวเข่าครูดพื้นแล้ว!!"
10053090-30 = "ทุกคนหยุดก่อน!"
10053090-31 = "โคโนกะ ฉันมีเรื่องสำคัญจะบอก"
10053090-36 = "อย่าคิดจะห้ามฉันเลย ต่อให้เป็นหัวหน้า ฉันก็ไม่ยอมฟังหรอก"
10053090-37 = "ไม่ใช่ ฉันไม่ได้จะห้าม แต่ก็ฟังก่อนนะ ฉันเพิ่งตระหนักถึงความจริงที่สำคัญมากได้อย่างหนึ่งน่ะ"
10053090-38 = "ตามการคำนวณของฉัน 'วันที่สาม ที่เป็นวันที่เลวร้ายที่สุด' ของโคโนกะ..."
10053090-40 = "มันผ่านไปแล้วต่างหาก...!!"
10053090-46 = "..."
10053090-47 = "เอ๋...?"
10053090-48 = "ฉันรู้สึกว่ามีบางอย่างไม่ชอบมาพากลตั้งแต่ตอนได้ยินครั้งแรกแล้วละ ก็ปกติแล้วการทำนายดวงจะพูด#nถึงเรื่องราวที่เกิดในแต่ละวันนี่นา"
10053090-49 = "แต่ถ้าเป็นการทำนายดวงของวันที่สาม... มันก็ต้องนับรวมวันนั้นไปด้วยสิ!"
10053090-50 = "เพราะงั้น 'วันที่สาม ที่เป็นวันที่เลวร้ายที่สุด' ของโคโนกะก็คือเมื่อวานยังไงล่ะ!!"
10053090-51 = "วันที่เลวร้ายที่สุดของฉัน... ผ่านไปแล้วงั้นเหรอ...?"
10053090-52 = "..."
10053090-53 = "แต่เมื่อวานไม่เห็นจะเกิดเรื่องอะไรเลยนะ...?"
10053090-58 = "เห็นมั้ยล่ะ การทำนายดวงมันก็เป็นแบบนี้ละ"
10053090-59 = "มันไม่ได้ถูกต้องเสมอไปหรอก เราแค่จำตอนที่ทำนายถูกก็เท่านั้น พูดอีกอย่างหนึ่งก็คือ มันคือกฎของเมอร์ฟี..."
10053090-73 = "ไม่สิ..."
10053090-74 = "ก็มีอยู่นะ มีเยอะเลยด้วย! เรื่องที่เลวร้ายที่สุดน่ะ!"
10053090-75 = "เราทั้งถูกหุ่นยนต์บ้าอะไรก็ไม่รู้โจมตี!!"
10053090-76 = "แล้วตอนกลางคืนก็เจอพวกนักเลงที่ไม่รู้จักมาบุกทำร้ายเป็นครั้งแรกในชีวิตอีก!!"
10053090-77 = "เราเจอแต่เรื่องเลวร้ายด้วยซ้ำนะ?!"
10053090-82 = "เอ่อ เมื่อกี้พูดถึงพวกฉันเหรอ?"
10053090-83 = "ขอโทษที่บุกมาโจมตีตอนกลางคืนนะ... แต่มันก็ไม่ถึงกับเป็นสิ่งเลวร้ายที่สุดหรือเปล่า..."
10053090-88 = "อ๊ะ ขอโทษ..."
10053090-89 = "ซะที่ไหนล่ะ!!"
10053090-90 = "ว้ากกก!! นั่นมันเป็นพฤติกรรมที่เลวร้ายจริงๆ เหอะนะ!!"
10053090-91 = "อย่ามาเนียนพูดอะไรให้ฉันใจอ่อนเลย!!"
10053090-96 = "เดี๋ยวก่อน การสู้กับรถถังมันเป็นเรื่องเลวร้ายที่สุดตรงไหน..."
10053090-97 = "งั้นก็หมายความว่า ผ่านไปสามวันแล้ว แต่วันที่เลวร้ายที่สุดในชีวิตก็ไม่มาถึง...?"
10053090-101 = "ถ้างั้น อย่าบอกนะว่า?!"
10053090-102 = "หรือว่าฉันได้เจอสึจิโนโกะไปแล้ว?!"
10053090-103 = "ไม่สิ ตั้งแต่มาที่นี่ ฉันก็ยังไม่เคยเจออะไรคล้ายงูเลย..."
10053090-106 = "แต่ว่าสึจิโนโกะเป็นตัวอะไรกันแน่ล่ะ? นอกจากตัวอ้วนแล้ว ยังมีลักษณะเด่นอื่นอีกหรือเปล่า?"
10053090-110 = "อย่างแรกเลยนะ ที่บอกว่าเป็นงูอ้วนน่ะ ไม่ตรงกับความเป็นจริงหรอก ที่จริงแล้วสึจิโนโกะรูปร่าง#nค่อนข้างไปทางทรงสี่เหลี่ยมขนมเปียกปูนมากกว่า"
10053090-111 = "มันต่างจากงูทั่วไปตรงที่เวลาขู่ มันจะส่งเสียงร้อง 'หง่าว!' น่ะสิ"
10053090-112 = "และที่สำคัญก็คือการกระโดดที่ทรงพลัง! ได้ยินว่ากระโดดได้สูงเกือบหนึ่งเมตรเลยนะ!"
10053090-115 = "ว้ากกก!!! ว้ากกก!!!"
10053090-116 = "สึจิโนโกะ!!!!"
10053090-122 = "หะ... หา...?! อะไรน่ะ?!"
10053090-123 = "ทำไมจู่ๆ ถึงมากอดกันล่ะ?! น่าขนลุกนะ?!"
10053090-124 = "เปล่าหรอก ก็แค่..."
10053090-128 = "บางทีการผจญภัยที่ผ่านมาจนถึงตอนนี้ อาจจะเป็นสึจิโนโกะที่แท้จริงก็ได้..."
10053090-129 = "เป็นอะไรไปน่ะ?! ทำไมจู่ๆ เธอถึงเพี้ยนไปอีกคนล่ะ?!"
10053090-131 = "(และแล้วการผจญภัยตามหาสึจิโนโกะของทุกคนก็สิ้นสุดลง...)"
10053090-139 = "ว้าว~ พอสะอาดแล้วก็ดูดีสุดๆ ไปเลยนะ!"
10053090-140 = "เดี๋ยวนะ ทำไมเราถึงมาความสะอาดที่นี่กันล่ะ...? เราจะกลับกันแล้วไม่ใช่เหรอ?"
10053090-141 = "หืม? ทำไมล่ะ? น่าเสียดายเงินออก? ฉันเช่าไว้ตั้งสัปดาห์หนึ่ง งั้นก็ต้องอยู่ต่อให้คุ้มสิ"
10053090-142 = "หืม?! เป็นงี้เองเหรอ?! ฉันคิดว่าเมื่อกี้เราหาทางเข้าที่นำไปสู่ฐานลับของมนุษย์ต่างดาวกันซะอีก?!"
10053090-147 = "เอ่อ... ในเมื่อทำความสะอาดเสร็จแล้ว งั้นฉันขอกลับได้มั้ย...?"
10053090-148 = "ล้มเลิกความคิดซะเถอะ พวกนี้ไม่มีทางปล่อยไปหรอก"
10053090-149 = "ในเมื่อเป็นแบบนี้แล้ว ก็อยู่เที่ยวเล่นให้สบายใจเถอะ"
10053090-154 = "คิโวทอส ปมปริศนาเร้นลับ ~แกะรอยสิ่งมีชีวิตนิรนาม สึจิโนโกะ~"
