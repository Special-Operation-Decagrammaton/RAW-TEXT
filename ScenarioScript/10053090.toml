[translation]
10053090-1 = "尾聲;槌之子是藍色的"
10053090-2 = "（第三天）"
10053090-3 = "啊啊啊啊！！！！快放開我！！！！！"
10053090-5 = "還不遲！！！不，反而可以說是剛好壓線趕上！！！"
10053090-10 = "笨蛋！這個時間去山上真的很危險！"
10053090-11 = "但是過了今天，明天就是我人生最糟糕的一天！！！"
10053090-12 = "不是槌之子也可以！！只要從後山抓條蛇回來的話……！！"
10053090-13 = "大家別光看著，快阻止他啊！！"
10053090-17 = "不是，我們已經出全力了……！！"
10053090-21 = "這傢伙到底是人還是坦克……！？"
10053090-25 = "等，等一下！！腳滑了！！啊啊啊！！膝蓋擦傷了啦！！"
10053090-30 = "大家先冷靜！"
10053090-31 = "木乃香君，我有重要的事要說。"
10053090-36 = "別想阻止我，就算是所長也沒用的！"
10053090-37 = "不，我不打算阻止你，但聽我說。#n剛才我意識到了一個非常重要的事實。"
10053090-38 = "按照我的計算，木乃香君的「最糟糕的第三天」……"
10053090-40 = "已經過去了……！！"
10053090-46 = "…………"
10053090-47 = "…………咦？"
10053090-48 = "我從一開始聽到的時候就有種違和感，運勢這種東西通常是說當天的事吧。"
10053090-49 = "儘管如此，如果說的是第三天的運勢……那不是包含當天的意思嗎！"
10053090-50 = "也就是說，木乃香君的「最糟糕的第三天」就是昨天！！"
10053090-51 = "我最糟糕的一天……已經過去了……？"
10053090-52 = "…………"
10053090-53 = "什麼事都沒發生啊……？"
10053090-58 = "你看吧，運勢這種東西本來就是這樣的。"
10053090-59 = "不是總是準確你只是記住它準確的時候，也就是說，只是因為墨菲定律而──"
10053090-73 = "不對……"
10053090-74 = "有啊，超級多的好嗎！？最糟糕的事！"
10053090-75 = "被什麼機器人攻擊！！"
10053090-76 = "晚上被素不相識的小混混襲擊！！"
10053090-77 = "反而只有最糟糕的事好嗎！？"
10053090-82 = "咦？那是在說我們嗎？"
10053090-83 = "晚上攻擊你們真是抱歉，但也不至於說是最糟糕的吧……"
10053090-88 = "啊，抱歉……"
10053090-89 = "……不對！！"
10053090-90 = "嚇啊──！！確實是最糟糕的行為吧！！"
10053090-91 = "別想若無其事地蒙混過去！！"
10053090-96 = "不過只是跟坦克打了一架也不算最糟糕的吧……"
10053090-97 = "也就是說三天過去了，最糟糕的一天卻沒來……？"
10053090-101 = "等一下，難道說！？"
10053090-102 = "我已經遇到過槌之子了嗎！？"
10053090-103 = "不對不對，來到這裡之後連類似蛇的東西都沒看到……"
10053090-106 = "話說回來，槌之子到底是什麼？是蛇嗎？除了長得胖之外還有其他特徵嗎？"
10053090-110 = "首先，說是胖蛇這個描述並不準確。實際上槌之子更接近菱形。"
10053090-111 = "而且據說和普通的蛇不同，威脅對手時會發出「嚇啊──！」的叫聲。"
10053090-112 = "而且最厲害的是跳躍力！據說可以原地跳將近1m高！"
10053090-115 = "嚇啊──！！！！嚇啊啊──！！！！"
10053090-116 = "是槌之子！！！！"
10053090-122 = "咦！？怎，怎樣啦！？"
10053090-123 = "為什麼突然抱住我！？噁心死了！？"
10053090-124 = "只是覺得……"
10053090-128 = "也許到目前為止的冒險本身，才是真正的槌之子吧……"
10053090-129 = "怎麼了！？ 連你也瘋了嗎！？"
10053090-131 = "（就這樣我們尋找槌之子的冒險結束了……）"
10053090-139 = "哇～變乾淨了，看起來多舒服啊！"
10053090-140 = "為什麼要整理這裡……？不是要離開了嗎？"
10053090-141 = "嗯？什麼為什麼？不然浪費錢嗎？都租了一週了，當然要好好玩再走啊。"
10053090-142 = "咦！？是那樣嗎！？我還以為是要找通往外星人秘密基地的入口呢！？"
10053090-147 = "那個……打掃完了我可以走了嗎……？"
10053090-148 = "放棄吧，絕對不會放過你的。"
10053090-149 = "既然都這樣了，你就放棄掙扎玩一下再走吧。"
10053090-154 = "奇普托斯未確認謎團～尋找未知生物槌之子～"
