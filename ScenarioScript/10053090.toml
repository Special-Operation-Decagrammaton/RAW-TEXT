[translation]
10053090-1 = "尾聲;槌之子是藍色的"
10053090-2 = "（第三天）"
10053090-3 = "唔啊啊啊！！！！快放開我！！！！！"
10053090-5 = "現在還來得及！！！#n不，反而可以說是正好壓線過關！！！"
10053090-10 = "笨蛋！這個時間去山上真的很危險啦！"
10053090-11 = "可是過了今天之後，我人生中最糟糕的一天就要來臨了！！！"
10053090-12 = "就算不是槌之子也沒關係！！#n只要隨便從後山抓條蛇回來的話……！！"
10053090-13 = "大家不要光顧著看，快點阻止他啊！！"
10053090-17 = "不是，我們也已經使出全力了耶……！！"
10053090-21 = "這傢伙到底是人還是坦克啊……！？"
10053090-25 = "等，等一下！！我腳滑了！！#n啊啊啊！！膝蓋擦傷了啦！！"
10053090-30 = "大家先冷靜！"
10053090-31 = "木乃香君，我有重要的事要說。"
10053090-36 = "別想阻止我！就算是所長，我也不會手下留情的！"
10053090-37 = "我沒有要阻止你的意思，不過希望你先聽我把話說完。#n就在剛才，我意識到了一個非常重要的事實。"
10053090-38 = "按照我的計算，木乃香君的「最糟糕的第三天」……"
10053090-40 = "已經過去了……！！"
10053090-46 = "…………"
10053090-47 = "…………咦？"
10053090-48 = "其實一開始聽你說的時候，我就覺得有股違和感。#n因為所謂的運勢，一般來說應該是指當天的事情才對。"
10053090-49 = "既然如此，如果要說第三天的運勢的話……不就應該把當天也包含進去嗎？"
10053090-50 = "也就是說，木乃香君「最糟糕的第三天」──其實就是昨天！！"
10053090-51 = "我最糟糕的一天……已經過去了……？"
10053090-52 = "…………"
10053090-53 = "可是什麼事都沒發生啊……？"
10053090-58 = "你看吧，運勢這種東西本來就是這樣的啦。"
10053090-59 = "並不是每次都很準，只是大家往往只會記得碰巧準確的時候而已。#n換句話說，這純粹是因為「墨菲定律」而──"
10053090-73 = "不對……"
10053090-74 = "明明就有發生最糟糕的事啊！？而且超級多的好嗎！？"
10053090-75 = "像是被詭異的機器人攻擊！！"
10053090-76 = "或者晚上被從沒見過的小混混襲擊之類的！！"
10053090-77 = "根本全都是最糟糕的事嘛！？"
10053090-82 = "咦？那是在說我們嗎？"
10053090-83 = "晚上攻擊你們實在很抱歉，不過也不至於說是最糟糕的事吧……"
10053090-88 = "啊，抱歉……"
10053090-89 = "……不對！！"
10053090-90 = "嚇啊──！！那分明是最糟糕的行為吧！！"
10053090-91 = "別想若無其事地蒙混過去！！"
10053090-96 = "只不過是跟坦克打了一架而已，哪能算是最糟糕的事啊……"
10053090-97 = "也就是說，明明已經過了三天，最糟糕的一天卻沒有到來……？"
10053090-101 = "等等，難道說……！？"
10053090-102 = "我已經遇到過槌之子了嗎！？"
10053090-103 = "不不不，自從來到這裡之後，就連類似蛇的東西都沒見過……"
10053090-106 = "話說，槌之子到底是什麼啊？#n真的是蛇嗎？除了長得胖之外還有其他特徵嗎？"
10053090-110 = "首先，其實「胖蛇」這個描述並不是很準確。#n實際上槌之子應該更接近菱形才對。"
10053090-111 = "而且和一般蛇類不同，在威嚇時會發出「嚇啊──！」的叫聲。"
10053090-112 = "然後最厲害的是牠的跳躍力！#n據說能夠原地跳起將近1m高哦！"
10053090-115 = "嚇啊──！！！！嚇啊啊──！！！！"
10053090-116 = "是槌之子！！！！"
10053090-122 = "咦，咦咦……！？怎，怎樣啦！？"
10053090-123 = "為什麼要突然抱住我！？很噁心耶！？"
10053090-124 = "沒有啦，我只是覺得……"
10053090-128 = "或許至今為止的這場冒險，才是真正的槌之子也說不定……"
10053090-129 = "什麼意思！？連你也發瘋了是不是啦！？"
10053090-131 = "（於是尋找槌之子的冒險，就這麼畫下了句點……）"
10053090-139 = "哎呀～整理乾淨之後，看起來舒服多了呢！"
10053090-140 = "為什麼要整理這裡啊……？#n我們不是要離開了嗎？"
10053090-141 = "嗯？什麼為什麼？總不能浪費錢吧？#n既然已經租了一週，當然得好好玩夠再走啊。"
10053090-142 = "咦！？原來是那樣嗎！？#n我還以為是要尋找外星人祕密基地的入口耶！？"
10053090-147 = "那個……既然已經打掃完了，我可以先離開嗎……？"
10053090-148 = "放棄吧。他們絕對不會放你走的。"
10053090-149 = "反正都這樣了，你就放心玩樂一下再走吧。"
10053090-154 = "奇普托斯未確認謎團～追尋未知生物槌之子～"
