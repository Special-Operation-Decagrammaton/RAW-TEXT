[translation]
10028070-1 = "제7화;선전포고"
10028070-3 = "……죄송합니다!!"
10028070-4 = "[ns1] \"미안해! 정말 면목 없어!\"\n[ns2] 고개 숙여 사과한다."
10028070-7 = "티파티 회장"
10028070-10 = "네, 네? 뭐, 뭐죠?"
10028070-11 = "왜 갑자기 사과를……?"
10028070-17 = "……?"
10028070-18 = "……네?"
10028070-19 = "[s3] \"찻잔 세트…… 깨져 있었잖아.\"\n[s4] \"아직 유물 확인은 못 한 거야?\""
10028070-22 = "아……. 그건……."
10028070-23 = "아아. 그런 이야기였군요. 네, 이해했습니다."
10028070-24 = "음……."
10028070-28 = "저야말로 본의 아니게 일을 심각하게 만든 원인이 된 것 같아서 오히려 죄송합니다."
10028070-29 = "결론부터 말하자면, 그건 깨져도 상관없어요."
10028070-33 = "[ns5] \"……예?\"\n[ns6] \"깨져도……상관없다고?\""
10028070-36 = "제가 걱정했던 부분은 유물의 '분실' 쪽이지 파손 쪽은 아니었거든요."
10028070-37 = "간단한 이야기입니다. 존재하기만 하면, 부서진 건 복원하면 그만이니까요."
10028070-38 = "전문가만 찾으면 가루가 된 고서도 원상 복구시킬 수 있는 마당에, 이 정도는 오히려 쉽죠."
10028070-39 = "어차피 발굴 작업도 선생님께서 함께해 주셨는데, 찻잔의 진위를 의심할 사람은 없을 거고요."
10028070-40 = "다시 한번 도움에 감사드립니다, 선생님. 그리고 정의실현부의……."
10028070-41 = "이, 이치카라고 합니다."
10028070-42 = "네. 이치카 씨."
10028070-43 = "후후……."
10028070-44 = "……그럼 좋은 하루 되시길."
10028070-47 = "……뭔가 생각보다 훨씬 더 실없이 끝나 버렸슴다."
10028070-48 = "경우에 따라서는, 진짜로 정의실현부 옷 벗을 각오까지도 했는데 말이죠."
10028070-49 = "이래서야 오는 내내 계속 한숨 쉬며 걱정한 것들이 다 뭐가 되는지……."
10028070-50 = "[s7] \"그래도 나는 꽤 의미 있었다고 생각해.\"\n[s8] \"이치카에 대해 알게 된 것만 해도 좋았어.\""
10028070-53 = "또, 또. 그런 식으로 말씀하시고……. 그만 좀 하세요."
10028070-54 = "정말이지……. 계속해서 사람을 무방비하게 만드시는 분이네요, 선생님은."
10028070-55 = "같이 있으면 점점 어린애가 돼 버리는 느낌이라고요. 그야 물론 선생님에 비하면 애긴 하겠지만……."
10028070-59 = "……에이. 뭐, 좋아요. 어차피 이렇게 돼 버린 거. 저도 더는 모르겠슴다."
10028070-60 = "어차피 더는 숨길 것도 없겠다, 이제부터 선생님께는 그냥 대놓고 떼쓸 테니까요. 각오하시라고요."
10028070-61 = "아침에는 선생님께 먼저 연락드려서 귀찮게 해 드릴 일 없을 거라고 했지만……."
10028070-62 = "지금은 또 상황이 많이 바뀌었잖아요?"
10028070-63 = "종종 연락드리겠슴다. 말하자면 이건 일종의 '선전포고'예요."
10028070-64 = "그렇지만 선생님께서 그렇게 하라고 하신 거니까요! 먼저 공격하신 건 선생님 쪽이니까요!"
10028070-65 = "자업자득이랄까……. 합당한 보복이라고 생각하거든요. 그러니 이해해 주셔야죠?"
10028070-66 = "……그렇죠? 괜찮으시죠?"
10028070-67 = "[s9] \"물론이지. 언제든지 편하게 연락해.\"\n[s10] \"사소한 일이라도 상관없으니까.\""
10028070-70 = "후후. 당연하죠."
10028070-71 = "이제부터는 귀찮다고 느끼시더라도 알아서 책임져 주세요."
10028070-72 = "……하하."
10028070-73 = "벌써부터 기대되네요, 선생님을 귀찮게 만들 날들이. 선생님께 '귀찮은 아이'가 될 날이."
10028070-74 = "그럼 오늘은 이만 물러가도록 하고……."
10028070-75 = "앞으로 종종……. '개인적으로' 뵙겠습니다, 선생님."
10028070-82 = "……잘 부탁드림다."
