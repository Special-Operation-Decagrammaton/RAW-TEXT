212170-127 = ""
212170-128 = ""
212170-131 = ""
212170-132 = ""
212170-133 = "老師，這邊！"
212170-134 = ""
212170-136 = ""
212170-137 = "[ns] 「小心，千秋！」"
212170-139 = ""
212170-140 = ""
212170-142 = ""
212170-143 = "委員長……請您想起來。想起您曾經立下的誓言。"
212170-144 = "唔……"
212170-145 = ""
212170-147 = ""
212170-148 = ""
212170-149 = "……伊織、千夏。真是的，你們為什麼要那麼固執？#n明明你們也已經遍體鱗傷了……"
212170-150 = ""
212170-152 = ""
212170-153 = "亞子醬……！"
212170-154 = "唉……為了你們，也為了委員長，請你們就此住手吧。"
212170-155 = "你說什麼……？"
212170-156 = "陽奈委員長已經不會再感到痛苦了啊。"
212170-157 = "你們也知道吧？#n比任何人都努力守護你們口中那條界線的，就是委員長。"
212170-158 = "你們也看過他總是那麼疲憊、精疲力盡、痛苦不已的樣子吧。#n這樣的委員長終於找回了平靜啊。"
212170-159 = "現在格黑娜沒有任何人會讓委員長辛苦，一切都井然有序地運作著……#n為什麼你們還要強迫他回到以前的樣子？"
212170-160 = "……這不是強迫。#n而且那也不是秩序。"
212170-161 = "是不是秩序都無所謂。#n我只希望有一個能讓陽奈委員長幸福的世界。"
212170-162 = "而那樣的世界，只要有外敵存在就能實現。"
212170-163 = "團結一致的格黑娜需要一個憎恨的對象……沒錯，就是學園外部的奇普托斯。"
212170-174 = ""
212170-175 = ""
