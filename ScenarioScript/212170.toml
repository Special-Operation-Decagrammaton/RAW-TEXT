212170-277 = ""
212170-278 = ""
212170-279 = ""
212170-282 = ""
212170-283 = "啊啊，老師。"
212170-284 = "那我們就在後方待命吧。"
212170-285 = "畢竟我們跟那邊實在合不來啊。"
212170-286 = "尤其是對方像現在這麼認真的時候，我大概完全幫不上忙。"
212170-287 = "沒問題！接下來就由我負責護送老師！"
212170-288 = "萬一發生什麼事我會趕過去的，一定要叫我哦。"
212170-289 = "是！感謝你們的協助！！"
212170-290 = ""
212170-292 = ""
212170-293 = "[ns] 「真的很謝謝你幫忙，佳澄。」"
212170-294 = ""
212170-295 = ""
212170-296 = "……小心點啊，老師。"
212170-297 = ""
212170-298 = "……看來格黑娜還殘留著不少不穩分子呢。"
212170-299 = "沒有及早處理掉，也是我的責任吧。"
212170-300 = "[s] 「陽奈。這真的是陽奈想做的事嗎？」"
212170-301 = ""
212170-303 = ""
212170-304 = "……"
212170-305 = "老師，我應該說過了吧？#n我終於察覺到自己是為了格黑娜而活的。"
212170-306 = ""
212170-308 = ""
212170-309 = "唉……"
212170-310 = "為什麼大家都說我現在的狀態很奇怪呢？"
212170-311 = "就不能……就不能只是為我加油、認同我嗎？"
212170-312 = "委員長……"
212170-313 = "[s] 「……」"
212170-314 = "呀哈，我聽到了超好笑的話耶！"
212170-315 = ""
212170-317 = ""
212170-318 = "你說什麼？"
212170-319 = ""
212170-321 = ""
212170-324 = ""
212170-325 = ""
212170-326 = "哪有笨蛋會去為想從懸崖邊跳下去的人加油、認同他啊？"
212170-327 = "急急忙忙趕過來，結果你居然一邊痛扁後輩，一邊說著這種話。#n真的很讓人傻眼耶。"
212170-328 = "格黑娜再興委員會……原來如此，怪不得一直沒看到你們。"
212170-329 = "有件事先講清楚。我們可不是因為崇拜前輩才走到這一步的。#n反而是看你行事溫吞，一直覺得很煩躁。"
212170-330 = "然而那時候的空崎陽奈，至少有一股不用乞求聲援也能讓大家相信你的力量。"
212170-331 = ""
212170-333 = ""
212170-334 = ""
212170-335 = "你們……"
212170-336 = "伊織醬、千夏醬，你們辛苦了。先休息吧。"
212170-337 = "嗯……"
212170-338 = "兩位在這裡，就代表……"
212170-339 = "嗯。"
212170-340 = "啊啊，這樣啊。太好……了。"
212170-341 = ""
212170-343 = ""
212170-346 = ""
212170-347 = "……真琴前輩。"
212170-348 = "……伊呂波。我本來希望你不要出現在這裡的。"
212170-349 = "……"
212170-350 = "千秋，連你也是嗎。"
212170-351 = "是……"
212170-352 = ""
212170-354 = ""
212170-355 = "……嘰嘻嘻。是嗎。原來是這麼回事。"
212170-356 = "啊哈……啊哈哈，啊哈哈哈！"
212170-357 = ""
212170-359 = ""
212170-360 = "這個聲音是……"
212170-365 = ""
212170-366 = "沒錯，舞台上的演員終於全員到齊了呢。"
212170-367 = ""
212170-368 = "翔子……"
212170-369 = "翔子醬，你在說什麼？"
212170-370 = ""
212170-372 = ""
212170-374 = ""
212170-375 = "意思就是迎來高潮了。"
212170-376 = "你們為了動搖已經形成的秩序而聚集在此的模樣，實在是相當可悲呢。"
212170-377 = ""
212170-379 = ""
212170-380 = "一群敗者。"
212170-381 = "你……到底想說什麼？"
212170-382 = "你們這種微不足道的垂死掙扎，連歷史都不會記載。"
212170-383 = "只會淪為空虛又毫無意義的事吧。#n因為歷史是從勝者的立場書寫的。"
212170-384 = "……是的。這是個只有勝者才能存活的世界。"
212170-385 = "而現在，嶄新的……不，正統的歷史將會被書寫。"
212170-386 = "他的思想與價值觀是正確的──一個肯定那偉大意志的世界即將誕生。"
212170-387 = "你現在……是在說誰？"
212170-388 = ""
212170-390 = ""
212170-391 = "難道是……"
212170-392 = ""
212170-394 = ""
212170-395 = ""
212170-396 = ""
212170-397 = "雷帝。"
212170-399 = "下一話;我們化作烈焰"
