212170-159 = "3;아코;15;이제 게헨나의 그 누구도 부장님을 힘들게 하지 않고, 모든 것이 질서 정연하게 흐르고 있는데, 어째서 당신들은 이전의 모습을 강요하는 건가요?"
212170-160 = "3;이오리;06;……이건 강요가 아니야. 그리고 그건 질서가 아니야."
212170-161 = "3;아코;09;그게 질서든 아니든 상관없어요. 저는 히나 부장님이 행복한 세상을 원하니까요."
212170-162 = "3;아코;19;그리고 그건, 외부의 적이 있는 상태에서 이루어질 수 있어요."
