[translation]
212170-1 = "제17화;게헨나 탈환 작전 2"
212170-5 = "……."
212170-7 = "……마, 마코토 의장……?!"
212170-13 = "크윽!!"
212170-17 = "이오리……!!"
212170-23 = "키킥…… 제법 선전했다만, 여기까지다."
212170-24 = "고작 그 정도의 병력으로 게헨나를 전복하려 했나? 시로미 이오리, 히노미야 치나츠."
212170-25 = "너희는 소라사키 히나가 특히 아끼던 후배들이라고 알고 있다만."
212170-26 = "어째서 이런 선택을 했지? 반기를 들어가면서까지 이루고 싶은 것이 있었나?"
212170-31 = "……그래. 반드시 알게 해주고 싶었던 게 있었지."
212170-32 = "……."
212170-37 = "마코토, 내가 이야기를 해볼게."
212170-38 = "……흥. 결자해지라 하였지."
212170-42 = "이오리, 치나츠……."
212170-43 = "부장……."
212170-47 = "……경고했었잖아."
212170-48 = "더 이상 게헨나의 결속을 해치는 행동을 하지 말라고."
212170-49 = "게헨나의 결속……?"
212170-50 = "부장…… 부장이 생각하는 게헨나의 결속이 뭔데?"
212170-51 = "……."
212170-52 = "모두가 하나의 목표 아래 움직이는 것. 통제에 따르는 것.#n궁극적인 목표인 키보토스 정복을 향해 한마음 한뜻으로 뭉치는 것."
212170-53 = "그저 이것뿐이었어. 쉽잖아. 아주 쉬운 일이야."
212170-54 = "크크……."
212170-60 = "아니야. 부장. 쉬운 일이 아니야. 부장에게도, 우리에게도."
212170-61 = "그게 쉬운 일이어서는 안 돼."
212170-66 = "……포기해. 그 몸으로는 더 싸울 수 없어."
212170-67 = "……부장, 기억나? 내가 처음 선도부에 들어오겠다고 찾아갔던 날 말이야."
212170-68 = "……기억나."
212170-69 = "난 게헨나의 이 제멋대로인 분위기가 매력적이라고 생각했어. 하지만 동시에 무서웠지."
212170-70 = "누구나 다 자기 마음대로만 하면, 결국 아무것도 남지 않을 것 같았거든."
212170-71 = "그때, 부장을 봤어."
212170-73 = "모두가 날뛰는 이 아수라장에서, 혼자 묵묵히 여기까지가 한계라면서 선을 긋고 서 있는 부장의 뒷모습을."
212170-75 = "……."
212170-76 = "그 뒷모습을 보고, 나도 그 선을 같이 지키는 사람이 되고 싶어서 선도부에 들어온 거야."
212170-81 = "저도 마찬가지입니다. 부장님이 그어주신 그 선이 있었기에, 게헨나의 자유가 유지될 수 있었어요."
212170-82 = "그저 방종으로 남지 않고, 나름의 질서를 유지해 갈 수 있었던 겁니다."
212170-83 = "하지만 지금 부장님이 가려는 길은…… 그때와는 달라요."
212170-99 = "……큭……!"
212170-103 = "부장……!"
212170-133 = "선생님, 이쪽이에요!"
212170-137 = "[ns] \"조심해, 치아키!\""
212170-143 = "부장님…… 떠올리세요. 당신이 맹세했던 다짐을."
212170-144 = "……크윽……."
212170-149 = "……이오리, 치나츠. 정말이지, 왜 그렇게까지 고집을 부리는 건가요?#n당신들도 상처투성이면서……."
212170-153 = "아코……!"
212170-154 = "하아, 당신들을 위해서라도, 부장님을 위해서라도 이제는 멈춰주세요."
212170-155 = "뭐라고요……?"
212170-156 = "히나 부장님은 이제 더 이상 힘들어하지 않는다고요."
212170-157 = "아시잖아요. 누구보다 최선을 다해 당신들이 말하는 선을 지키던 부장님이에요."
212170-158 = "언제나 피곤하고, 지쳐있고, 힘들어하던 모습을 보셨잖아요.#n그런 부장님이 드디어 평화를 되찾으셨다고요."
212170-159 = "이제 게헨나의 그 누구도 부장님을 힘들게 하지 않고, 모든 것이 질서 정연하게 흐르고 있는데, 어째서 당신들은 이전의 모습을 강요하는 건가요?"
212170-160 = "……이건 강요가 아니야. 그리고 그건 질서가 아니야."
212170-161 = "그게 질서든 아니든 상관없어요. 저는 히나 부장님이 행복한 세상을 원하니까요."
212170-162 = "그리고 그건, 외부의 적이 있는 상태에서 이루어질 수 있어요."
212170-163 = "하나로 뭉친 게헨나는 증오할 상대가 필요하죠…… 네. 학원 외부의 키보토스요."
212170-198 = "아코…… 당신도 조종당하고 있다고. 당신의 것이 아닌 사념에 의해서."
212170-199 = "모욕적인 말이군요, 이오리."
212170-200 = "우리가 총을 든 건 선배들이 미워서가 아냐!"
212170-201 = "그 머릿속을 지배하고 있는 그 지독한 주박을 떼어내기 위해서라고!"
212170-202 = "그게 선배들을 자유롭게 해줄 수 있다면, 열 번이고 백 번이고 더 처맞아도 상관없어!!"
212170-203 = "부장님이 말씀하셨었죠. 힘이 있더라도 마음대로 하지 않는다."
212170-204 = "……."
212170-205 = "힘이 있음에도 지켜야 할 선을 지킨다."
212170-206 = "힘이 있으니, 지켜야 할 선을 지킨다."
212170-207 = "우리는 쓰러질 때까지 멈추지 않을 겁니다."
212170-211 = "그것이 우리가 당신의 가르침에 보답하는 방식입니다."
212170-216 = "그래…… 그 가르침, 지금 여기서 실천해 주겠어. 지금의 부장은 틀렸어. 그러니까……"
212170-220 = "우리가 부장에게, 선배들에게 다시 한번 선을 긋겠어."
212170-221 = "흥, 패배자들의 헛소리가 길구나! 히나, 무엇을 망설이나?"
212170-222 = "질서를 어지럽히는 반역자들에게 가차 없는 처벌을 내려라!"
212170-223 = "……윽, 크윽…… 처벌…… 아니, 선…… 내가 그었던 것은……."
212170-224 = "부장님……!!"
212170-225 = "……아니야. 나는, 나는……!!"
212170-231 = "나는……!!!"
212170-240 = "크윽……!"
212170-244 = "이오리……!!"
212170-250 = "돌아와 줘, 선배……."
212170-258 = "[ns] \"잘 버텨줬어, 이오리.\""
212170-259 = "서, 선생님……."
212170-260 = "정말, 늦었잖아……!!"
212170-261 = "[s] \"미안해. 이제 내게 맡겨줘.\""
212170-266 = "선생님……."
212170-267 = "……선생이여. 그대가 이곳에 있어서는 안 될 텐데. 어떻게?"
212170-283 = "아아, 선생님."
212170-284 = "그럼 우리는 후방에서 대기하도록 할게."
212170-285 = "아무래도 저쪽이랑은 상성이 안 좋아서 말이야."
212170-286 = "특히 지금처럼 진지한 상태면, 나는 영 도움이 안 될 거거든."
212170-287 = "괜찮아요! 이제부터는 제가 선생님을 책임질 테니까요!"
212170-288 = "혹시라도 뭔 일 생기면 달려갈 테니까, 꼭 불러."
212170-289 = "넵! 도움 감사했슴다!!"
212170-293 = "[ns] \"도움 정말 고마웠어, 카스미.\""
212170-296 = "……조심해, 선생님."
212170-298 = "……아직 게헨나에 불순분자들이 많이 남아있었나 보네."
212170-299 = "진작에 정리하지 못한 내 책임이겠지."
212170-300 = "[s] \"히나. 이게 정말 히나가 하고 싶은 일이야?\""
212170-304 = "……."
212170-305 = "선생님, 말했을 텐데. 나는 게헨나를 위해 살아온 거라고. 이제야 느꼈다고."
212170-309 = "하아……."
212170-310 = "왜 모두 내 지금 상태가 이상하다고 하는 걸까?"
212170-311 = "그냥…… 그냥 응원하고, 긍정해주면 안 되는 걸까."
212170-312 = "부장님……."
212170-313 = "[s] \"…….\""
212170-314 = "야핫, 정말 웃기는 소리를 들었네!"
212170-318 = "뭐라고요?"
212170-326 = "벼랑 끝으로 뛰어내리려는 사람을 응원하고 긍정하는 멍청이가 어디있어?"
212170-327 = "급하게 달려왔는데, 후배 쥐어패면서 한다는 소리가 고작 그거라니. 어이가 없네."
212170-328 = "게헨나재흥위원회…… 그래. 왜 너희가 안 보이나 했지."
212170-329 = "이거 하나는 확실하게 해두자. 우리는 선배를 동경해서 여기까지 온 게 아니야. 오히려 미적지근하게 행동하는 게 답답했었지."
212170-330 = "하지만 적어도 그때의 소라사키 히나는, 응원 따위 구걸하지 않아도 모두가 당신을 믿게 만드는 힘이 있었어."
212170-335 = "너희들……."
212170-336 = "이오리 쨩, 치나츠 쨩. 쉬고 있어. 고생 많았어."
212170-337 = "으응……."
212170-338 = "두 분이 여기 계시다는 건……."
212170-339 = "응."
212170-340 = "아아, 네. 다행……이에요."
212170-347 = "……마코토 선배."
212170-348 = "……이로하. 네가 여기에 나타나지 않기를 바랐건만."
212170-349 = "……."
212170-350 = "치아키, 너도냐."
212170-351 = "네에……."
212170-355 = "……키킥. 그래. 그렇게 됐군."
212170-356 = "크큭…… 하하, 하하하!"
212170-360 = "이 목소리는……."
212170-366 = "네, 이제야 드디어 무대 위에 배우들이 모두 모였군요."
212170-368 = "쇼코……."
212170-369 = "쇼코 쨩, 무슨 소리야?"
212170-375 = "클라이맥스라는 뜻이죠."
212170-376 = "이미 형성된 질서를 흔들기 위해 이렇게 모인 모습이 처량하군요."
212170-380 = "패배자들."
212170-381 = "……너…… 무슨 말을 하고 싶은 거야."
212170-382 = "당신들의 이런 사소한 발악은 역사에 기록되지도 못할 거예요."
212170-383 = "허무하고, 의미없는 일이 되겠죠. 역사는 승자의 입장에서 쓰여지니까요."
212170-384 = "……네. 승자만이 살아남을 수 있는 세상이에요."
212170-385 = "그리고 이제 새로운…… 아니, 정당한 역사가 새로 쓰이겠죠."
212170-386 = "그녀의 사상과 가치관이 옳았다고, 그 위대한 뜻이 긍정 받는 세상이 만들어질 겁니다."
212170-387 = "지금…… 누구 이야기를 하는 건가요?"
212170-391 = "……설마……."
212170-397 = "뇌제."
212170-399 = "다음화;우리는 불꽃이 되어"
