[translation]
212170-1 = "第17話;格黑娜奪還作戰（２）"
212170-4 = ""
212170-5 = "……"
212170-6 = ""
212170-7 = "真，真琴議長……！？"
212170-8 = ""
212170-10 = ""
212170-13 = "唔！！"
212170-14 = ""
212170-17 = "伊織……！！"
212170-18 = ""
212170-20 = ""
212170-23 = "嘻嘻……雖然打得還算不錯，但就到此為止了。"
212170-24 = "你們只憑那點兵力就想顛覆格黑娜嗎？#n銀鏡伊織、火宮千夏。"
212170-25 = "據我所知，你們是空崎陽奈特別疼愛的後輩。"
212170-26 = "為什麼要做出這種選擇？#n難道有什麼事，讓你們不惜舉起反旗也想達成嗎？"
212170-27 = ""
212170-29 = ""
212170-30 = ""
212170-31 = "……沒錯。有件事我無論如何都想讓他明白。"
212170-32 = "……"
212170-33 = ""
212170-35 = ""
212170-36 = ""
212170-37 = "真琴，讓我來跟他們談吧。"
212170-38 = "……哼。這就是所謂的解鈴還須繫鈴人吧。"
212170-39 = ""
212170-41 = ""
212170-42 = "伊織、千夏……"
212170-43 = "委員長……"
212170-44 = ""
212170-46 = ""
212170-47 = "……我警告過你們了吧。"
212170-48 = "叫你們不要再做出破壞格黑娜團結的行為。"
212170-49 = "格黑娜的團結……？"
212170-50 = "委員長……你所謂格黑娜的團結到底是什麼？"
212170-51 = "……"
212170-52 = "所有人在同一個目標下行動。服從統制。#n朝著征服奇普托斯這個終極目標，同心協力地團結在一起。"
212170-53 = "就只是這樣而已。#n很簡單吧？是非常簡單的事。"
212170-54 = "哼……"
212170-55 = ""
212170-57 = ""
212170-58 = ""
212170-59 = ""
212170-60 = "你錯了，委員長。那一點都不簡單。#n不管是對委員長，還是對我們來說都是。"
212170-61 = "那種事不應該是簡單的才對。"
212170-62 = ""
212170-64 = ""
212170-65 = ""
212170-66 = "放棄吧。你那副身體已經沒辦法再戰鬥了。"
212170-67 = "……委員長，你還記得嗎？#n我第一次去找你，說想加入風紀委員會的那一天。"
212170-68 = "……我記得。"
212170-69 = "我覺得格黑娜這種隨心所欲的氛圍很有魅力。#n但同時也覺得很可怕。"
212170-70 = "因為我總覺得如果每個人都只顧自己，到最後什麼都不會剩下。"
212170-71 = "就在那時，我看見了委員長。"
212170-72 = ""
212170-73 = "看見了在這個所有人都在胡作非為的修羅場裡，#n獨自默默劃下「到此為止」的界線並站在那裡的委員長的背影。"
212170-74 = ""
212170-75 = "……"
212170-76 = "看見那個背影之後，我也想成為和你一起守護那條界線的人……#n所以才加入了風紀委員會。"
212170-77 = ""
212170-79 = ""
212170-80 = ""
212170-81 = "我也一樣。#n正因為有委員長劃下的那條界線，格黑娜的自由才得以維持。"
212170-82 = "格黑娜才沒有淪為單純的放縱，能夠維持一定的秩序。"
212170-83 = "但是委員長現在想走的路……跟那時候不一樣。"
212170-84 = ""
212170-86 = ""
212170-99 = "唔……！"
212170-100 = ""
212170-102 = ""
212170-103 = "委員長……！"
212170-105 = ""
212170-106 = ""
212170-107 = ""
212170-108 = ""
212170-109 = ""
