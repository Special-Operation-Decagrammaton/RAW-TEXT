212170-197 = ""
212170-198 = "亞子醬……你也被操控了啊。#n被不屬於你自己的念頭所操控。"
212170-199 = "真是侮辱人的說法呢，伊織。"
212170-200 = "我們會拿起槍，並不是因為怨恨前輩們！"
212170-201 = "而是為了解開支配著你們腦袋的可怕咒縛！"
212170-202 = "如果能讓前輩們重獲自由，要我再挨打十次、一百次都無所謂！！"
212170-203 = "委員長曾經說過吧？#n即使擁有力量，也不能為所欲為。"
212170-204 = "……"
212170-205 = "即使擁有力量，也要守住該守的界線。"
212170-206 = "正因為擁有力量，才要守住該守的界線。"
212170-207 = "在倒下之前，我們絕不會停下腳步。"
212170-208 = ""
212170-210 = ""
212170-211 = "這就是我們報答您教誨的方式。"
212170-212 = ""
212170-214 = ""
212170-215 = ""
212170-216 = "沒錯……我現在就在這裡實踐那份教誨。#n現在的委員長是錯的。所以……"
212170-217 = ""
212170-219 = ""
212170-220 = "我們要對委員長、對前輩們──再劃一次界線。"
212170-221 = "哼，敗者的廢話也說得太久了！#n陽奈，你還在猶豫什麼？"
212170-222 = "對擾亂秩序的叛徒們施以毫不留情的懲處吧！"
212170-223 = "唔，唔……懲處……不對，界線……我劃下的是……"
212170-224 = "委員長……！！"
212170-225 = "……不對。我，我是……！！"
212170-226 = ""
212170-231 = "我是……！！！"
212170-232 = ""
212170-234 = ""
212170-235 = ""
212170-236 = ""
212170-239 = ""
212170-240 = "唔……！"
212170-241 = ""
212170-243 = ""
212170-244 = "伊織……！！"
212170-245 = ""
212170-250 = "回來吧，前輩……"
