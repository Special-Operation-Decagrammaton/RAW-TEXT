212170-66 = "...Give up. You can no longer fight in your state."
212170-67 = "...Head Prefect. Do you remember the day I came to you and said I wanted to join the Prefect Team?"
212170-68 = "...I do."
212170-69 = "I used to find Gehenna's free-spirited atmosphere charming. But at the same time, I was scared. A lot."
