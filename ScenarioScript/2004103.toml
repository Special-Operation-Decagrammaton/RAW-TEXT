[translation]
2004103-1 = "배송 대행지"
2004103-7 = "네. 이게 전부입니다. 그나저나 양이 엄청나네요……."
2004103-8 = "(리오가 부탁한 택배의 양은, 실로 어마어마했다…….)"
2004103-9 = "혹시 개인 공방이라도 차리시나요? 하하하! 아뇨, 아뇨. 농담입니다."
2004103-10 = "그러면 도장 부탁드리겠습니다!"
2004103-12 = "(그리고 리오와 약속한 대로, 밤까지 기다리기로 했다…….)"
2004103-23 = "안녕, 선생. 늦지 않았지?"
2004103-24 = "우선…… 그렇네. 선생에게 사과해야 할 것 같아."
2004103-25 = "[s] \"응? 갑자기 사과는 왜?\""
2004103-26 = "오는 길에 여러 가지로 생각해 봤는데……."
2004103-27 = "……그래야 할 것 같았어."
2004103-28 = "[s] \"아이구, 우리 리오. 성장했구나. 기특하다, 기특해.\""
2004103-29 = "그, 그렇게 놀리지 말아 줘……."
2004103-30 = "그리고 오는 길에, 추적당하거나 정체를 들키지 않을까 해서."
2004103-31 = "해킹으로 교통 신호와 CCTV를 전부 교란시켰어."
2004103-32 = "이걸로 내가 샬레로 오는 걸 목격한 사람은 없을 거야."
2004103-33 = "[s] \"……아이구, 우리 리오. 성장하다 말았구나. 그래도 응원할게…….\""
2004103-34 = "……잘 모르겠는 반응이네, 지금은."
2004103-35 = "아무튼, 고마워. 선생. 이런저런 걸 하려다 보니, 아지트에서 부품이 많이 필요해져서."
2004103-36 = "요리하는 아방가르드 군의 개량이라든가, 컴퓨터 장비라든가, 시약 분석이라든가……."
2004103-37 = "무엇보다 필요했던 것은 고성능 베이퍼 챔버와 IC 서프레서였는데."
2004103-38 = "아무래도 기기 수가 늘어나다 보니 냉각 효율이 중요해졌고, 최근 진행 중인 연구에서 조금 분석해야 할 이온 용액이–"
2004103-40 = "(리오는 그 뒤로 한참이나, 잘 알아들을 수 없는 설명을 계속했다.)"
2004103-41 = "(……착각일 수도 있겠지만, 리오는 어딘가 즐거워 보였다…….)"
2004103-43 = "……어쨌든, 그래서 대량의 부품 교체가 필요한 상황이었어. 하지만 내가 직접 택배 주문을 하는 건 안 될 일이었지."
2004103-44 = "아무래도, 아지트가 발각될 가능성이 있으니까 말이야."
2004103-45 = "[s] \"그래서 샬레를 배송대행지로 쓴 거였구만…….\""
2004103-46 = "……맞아. 미안해, 선생."
2004103-47 = "[s] \"그보다, 아지트가 있었어?\""
2004103-48 = "한 곳은 아니야. 여러 군데에 있어."
2004103-49 = "지금은 그중 가장 입지가 좋은 곳에 자리하고 있지만……."
2004103-50 = "만에 하나 무슨 일이 생기면, 그 즉시 옮길 수 있도록 준비하고 있어."
2004103-51 = "발각된다면, 언제든 내 AMAS들을 써서 다음 아지트로 이동할 수 있도록 말이지."
2004103-52 = "[s] \"그거, 힘들지 않아?\""
2004103-53 = "힘들지 않다고 하면 거짓말이겠지만……."
2004103-54 = "그래도, 합리적이야."
2004103-55 = "응? 효율적이지는 않아 보인다고?"
2004103-56 = "……그건 맞을 거야."
2004103-57 = "에이미와 예전에, 이 문제로 잠깐 이야기를 했었는데."
2004103-58 = "나는…… 합리를 위해 효율을 버릴 수 있는 타입이라나 봐."
2004103-59 = "에이미는 반대지. 효율을 위해 합리를 버릴 수 있는 타입이니까."
2004103-60 = "예전의 나는, 그게 상충될 수 있는 개념이라고 생각하지 않았어. 합리적인 것이 당연히 가장 효율적인 것이라고 생각했거든."
2004103-64 = "그런데…… 아니더라."
2004103-65 = "왜냐하면, 사람이 늘 합리적일 수는 없는 법이고, 우리에게 일어나는 일은 대개 사람과 사람 사이에서 일어나는 일이기 마련이니까."
2004103-66 = "예전에는 그런 것을 포함해서, 사람이란 그다지 믿을 대상이 못 되고, 그렇기에 모든 것을 컨트롤해야 한다고 생각했지만……."
2004103-67 = "……이제는, 아닌 것 같아."
2004103-68 = "사람이란, 되돌이킬 수 없는 것이니까."
2004103-69 = "[s] \"되돌이킬 수 없는 것?\""
2004103-70 = "……응."
2004103-71 = "되돌이킬 수 없는 것이라는 개념은, 이제 나에게 중요해."
2004103-72 = "그것은, 기계와 사람을 구분하는 것이니까."
2004103-74 = "기계의 부품이 망가졌으면, 교체하면 돼. 인공지능의 판단 로직이 망가졌다면, 그 부분을 복구하면 되고."
2004103-75 = "그렇게 하면, 그것들은 예전과 같은 성능을 내며 잘 동작하지. 이것은 되돌이킬 수 있는 것, 즉 대체 가능한 것이야."
2004103-77 = "하지만…… 사람은 아니야. 한 번 어딘가 잘못되면, 되돌이킬 수 없어."
2004103-78 = "스스로 치유되는 부분도 있기는 하지만, 한계가 있기 마련이고."
2004103-81 = "사람 몸에서는 매일 3300억 개의 세포가 태어나고 죽고, 세포의 교체 주기는 한 달에서 1년 정도이지만……."
2004103-82 = "가령, 뇌의 신경세포 같은 것은 일생 교체되지 않아."
2004103-83 = "부품을 교체하는 배의 이야기, 알아?"
2004103-84 = "[s1] \"응. 알 것 같아.\"\n[s2] \"미안. 잘 모르겠어.\""
2004103-85 = "맞아. 배의 부품이 낡거나 망가질 때마다 교환한 끝에."
2004103-86 = "모든 배의 부품을 교체하면, 그 배는 원래의 배와 같은 것인가, 하는 이야기."
2004103-87 = "어떤 배가 있어. 부품이 낡거나 망가질 때마다 그걸 교환하는데."
2004103-88 = "어느 날 배의 모든 부품을 교체하게 되면, 그 배는 원래의 배와 같은 것이라고 부를 수 있을까, 하는 이야기야."
2004103-89 = "나는…… 기계라면 그 배의 개념을 적용시킬 수 있다고 봐."
2004103-90 = "모든 부품을 교체하더라도, 기능성이 유지된다면, 그 기계는 이전의 기계와 같은 것이겠지."
2004103-91 = "……하지만 그 개념은, 사람에게는 적용될 수 없을 것이라고 생각해."
2004103-92 = "먼 훗날 언젠가, 뇌와 신경을 완전히 분석해, 탄소 및 단백질 기반의 교체용 생체 부품을 만들어 낼 수 있다면 또 모르겠지만……."
2004103-93 = "그런 사고 실험은, 지금은 하고 싶지 않아. 가정하는 것조차 힘들고, 실제로 적용하는 것은 더욱 불가능하니까."
2004103-94 = "필요한 장치와 조건을 단순하게 가정한 다음, 이론을 바탕으로 일어날 현상을 예측하는 것을 사고 실험이라고 하는데……."
2004103-95 = "나는 사고 실험에도 두 가지가 있다고 보거든."
2004103-96 = "정교한 시뮬레이션으로, 한없이 사실에 근접한 결과를 예측할 수 있는 것이 있고."
2004103-97 = "상상과 가정 수준에서 종료될 수밖에 없는 것이 있어."
2004103-98 = "……사람을 교체하거나 대체할 수 있는가의 문제는, 후자라고 생각해."
2004103-99 = "그래서 그런 것은 지금, 고려하고 싶지 않아."
2004103-100 = "바꿔 말해서, 선생."
2004103-101 = "지금의 선생은, 어떤 의미로……."
2004103-108 = "나에게 있어, 대체 불가능한 대상이라는 말을 하고 싶었어."
2004103-109 = "[s] \"응? 그건 무슨 의미야?\""
2004103-114 = "……그렇구나. 잘 모르겠다면, 그것으로 좋아."
2004103-115 = "그렇지만 언젠가 말이지."
2004103-116 = "나도 선생에게, 그런 대상이 되고 싶다고……."
2004103-120 = "그런 생각을, 잠깐 해 봤다는 이야기야."
2004103-122 = "그러면 물건도 받았으니, 이만 돌아갈게."
2004103-123 = "[s] \"……어떻게 돌아가려고? \""
2004103-124 = "그야 왔을 때처럼, 해킹으로 교통 신호와 CCTV를 전부 교란시켜서."
2004103-125 = "내가 샬레에서 나가는 것과 어딘가로 향하는걸, 아무도 목격하지 못하도록–"
2004103-126 = "[s3] \"네. 그 방안 기각.\"\n[s4] \"……내가 데려다줄게.\""
2004103-129 = "어? 그, 그렇지만……."
2004103-130 = "[s] \"선생님 말 좀 들으세요, 리오 회장님.\""
2004103-131 = "아, 알았어……."
2004103-133 = " (그 뒤로, 대형 화물 택시를 불러 길 중간에 리오를 내려줬다.)"
2004103-134 = "(리오는 택시가 사라지는 것을 끝까지 확인하고, AMAS들을 불러 화물을 이송시켰다.)"
2004103-140 = "그러면 갈게. 오늘 고마웠어. 선생."
2004103-141 = "[s] \"그래. 조심해서 들어가.\""
