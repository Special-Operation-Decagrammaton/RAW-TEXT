[translation]
22150-1 = "제15화;함정"
22150-2 = "아스나! 갑니다!"
22150-10 = "……!"
22150-21 = "지금!"
22150-33 = "물러나도 소용없으니까요!"
22150-42 = "놓칠까 보냐!"
22150-46 = "(……강력합니다.)"
22150-47 = "(에이전트로서 함께 의뢰에 임하는 C&C는 확실히 집단으로서 강력한 힘을 보유한 동아리…….)"
22150-48 = "(네 명의 인원이 마치 한 몸이 되어 움직이는 듯한 전략과 전법……. 그것이야말로 다른 학교가 보유하고 있는 전력과 가장 차별화되는 점이며.)"
22150-51 = "……동시에 그 전법에 빈틈은 없다, 로군요."
22150-52 = "그렇다면."
22150-57 = "……부장, 이건…!"
22150-61 = "뭐야뭐야~? 갑자기 땅이 울렁울렁거리는데?!"
22150-62 = "그뿐만이 아니야! 아카네. 뭔가 심상치 않은 느낌이다!"
22150-63 = "……땅이 흔들릴 뿐 아니라, 건물이 움직이고 있어……?"
22150-67 = "잠……?! 이게 뭐야?!"
22150-68 = "부장님……!! 건물과 건물 사이에 격벽이……!"
22150-74 = "흔들림은…… 멈췄나?"
22150-75 = "다른 녀석들은……?"
22150-81 = "이 일대의 도시 구조를 변경하는 것으로, 다른 C&C 선배님들과는 격리 조치를 실행하였습니다."
22150-82 = "뭐? 그런 것까지 가능하다고?"
22150-83 = "네, <에리두>는 본디 침입자를 격퇴하기 위한 요새의 역할도 겸하고 있습니다."
22150-84 = "리오 님으로부터 받은 요새 설정 권한을 이용. C&C의 에이전트들을 각각 고립시켰습니다."
22150-85 = "네루 선배, 이것으로 선배의 승률은 급감했습니다."
22150-86 = "…………."
22150-87 = "하아…… 승률이니…… 뭐니……"
22150-88 = "웃기고 자빠졌네."
22150-97 = "어엇?! 자, 잠깐만! 지금 통신의 상태가……!"
22150-98 = "이건……."
22150-99 = "베리타스, 역시 너희들이었구나."
22150-100 = "과연 그 '히마리'의 후배들이라고나 할까."
22150-101 = "어? 그거 누, 누구?!"
22150-109 = "베리타스의 통신 연결이……"
22150-110 = "[s] \"전부 끊어졌어.\""
22150-114 = "그렇게 예측하긴 했지만, 정말로 여기까지 온 거구나. 선생."
22150-115 = "[s1] \"리오……!\"\n[s2] \"널 막으러 왔어.\""
22150-116 = "……그렇구나."
22150-117 = "……그렇구나."
22150-118 = "역시나 그때의 내 말과 행동만으로는 당신을……."
22150-119 = "그리고 거기에 있는 아이들을 설득할 수 없었던 거구나."
22150-126 = "…………선생."
22150-127 = "트롤리 딜레마라고, 알아?"
22150-128 = "트롤리……?"
22150-129 = "……딜레마?"
22150-130 = "간단한 이야기야."
22150-131 = "고장이 난 탓에 멈출 수 없는 열차가 레일 위를 달리고 있을 때."
22150-132 = "다수를 살리기 위해 한 사람을 희생시킬지─ 아니면 한 사람을 살리기 위해 다수를 희생할지. 선택을 강요하는 딜레마의 문제."
22150-133 = "그래, 이때 누군가는 레버를 당기는 역할을 맡아야만 해."
22150-134 = "……나는 기꺼이 내가 그 역할을 맡고자 했을 뿐이야."
22150-135 = "악의 따윈 없어. 적의도 갖고 있지 않아. 나는 그저 단순하게───"
22150-136 = "그런 어려운 말은 됐으니까! 아리스를 돌려줘!!"
22150-137 = "……응? 너는……."
22150-138 = "이야기라면 들었어!"
22150-139 = "회장이 제멋대로 굴면서 황당무계한 이야기를 떠들어댄 끝에 아리스를 데려갔다고!"
22150-140 = "……황당무계한 이야기 같은 게 아니야."
22150-141 = "다른 누구도 아닌, <이름 없는 신들의 왕녀>에게 해를 입었던 너라면 충분히 알고……."
22150-142 = "아니! 몰라!"
22150-143 = "……!"
22150-144 = "우리는 그냥 회장한테서 아리스를 되찾고 싶을 뿐이야!"
22150-145 = "언니……."
22150-146 = "모모이……."
22150-147 = "애당초 키보토스의 위협이니 뭐니 하는 이유로 아리스를 납치하다니! 쫌생이잖아!"
22150-148 = "차라리 내가 평소에 쓰는 시나리오의 설정 규모가 훨씬 크다고!"
22150-149 = "그런 건 아무것도 아니야!"
22150-150 = "……그래, 지금 당장 너희들을 이해시킬 수는 없겠지."
22150-151 = "………나 자신이 남들에게 그리 쉽게 이해받지 못한다는 건, 이미 잘 알고 있어."
22150-152 = "아방가르드군, 발진."
22150-158 = "우왓?! 센스 구려!"
22150-159 = "확실히 일반적인 디자인은 아니지만……."
22150-164 = "……생긴 것과는 상관없어."
22150-165 = "[s] \"냉정한 톤을 유지하고 있지만 이미 속마음이 전부 들리고 있어! 리오!\""
22150-166 = "이해받지 못한다면…… 좋아. 그대로도 상관없어."
22150-167 = "우, 우와아앗?!"
22150-168 = "[ns] \"모두 조심해……! 온다!\""
