[translation]
22180-1 = "제18화;그러나 넘을 수 없는 벽"
22180-13 = "……!"
22180-14 = "느려. 느려. 느려……"
22180-23 = "느려 터졌잖아! 후배!"
22180-32 = "(속도는 분명 <무장>을 사용하는 제 쪽이 능가하고 있습니다.)"
22180-39 = "(데이터는 확실했을 터. 거기에 더해 리오 님의 명을 따라 전장의 지형까지 변경하였습니다.)"
22180-40 = "(그런데도 승패가 나지 않는다는 건……. 데이터가 틀렸다?)"
22180-41 = "(아니, 이건 그런 게 아니라…….)"
22180-49 = "근거리로 가까워질 때마다 데이터가…… 실시간으로 갱신되고 있어……?!"
22180-50 = "(간격을 내주면…… 위험……!)"
22180-56 = "크윽……!!"
22180-57 = "이 정도 거리의…… 초장거리 저격이라면……"
22180-59 = "이쪽은 콜사인 제로투."
22180-60 = "……선배의 등 뒤는 내게 맡겨."
22180-61 = "뭐야! 순간 길을 잃었다고 생각했는데, 의외로 쉽게 복귀해버렸지 뭐야?"
22180-62 = "그건 아스나 선배의 행운 덕분이겠죠…… 일반적으로는 벌어지지 않는 일이라고요."
22180-64 = "요새도시의 미로를…… 이렇게 쉽게……?!"
22180-65 = "확률적으로 그게 말처럼 쉽게 될 리가……!"
22180-66 = "하! 잘난 듯이 격리했다느니 뭐니 하고 말하더니만."
22180-67 = "결국 말뿐이었던 거냐?"
22180-68 = "……."
22180-72 = "토키. 일단은 그곳에서 물러나."
22180-73 = "……!"
22180-74 = "리오 님, 전……."
22180-75 = "널 탓하고자 하는 게 아니야. 베리타스의 간섭으로 아방가르드군의 제어권도 빼앗겼어."
22180-76 = "어디까지나 전적으로 내 예측 부족으로 인한 실패……. 우선은 재정비가 필요해."
22180-77 = "……예스, 맴."
22180-78 = "알겠습니다. 현장에서 이탈하겠습니다."
22180-79 = "뭐?! 어이! 어딜 도망가려고?"
22180-88 = "야! 얌마! 안 돌아와?! 이 자식이……!!"
22180-90 = "앗, 뭐야! 토키 쨩. 가버린 거야?"
22180-91 = "……아쉽게 놓치게 되었군."
22180-92 = "아아! 젠장! 이 자리에서 끝장을 봤어야 했던 건데!"
22180-94 = "어쩔 수 없죠. 부장님. 상정하지 못했던 조우와 교전……"
22180-96 = "양동 작전은 폐기하고…… 우선은 선생님과 합류하기로 하죠."
22180-97 = "지금 무엇보다 중요한 건 아리스 쨩을 구하는 일이니까요."
22180-98 = "그쵸. 부장님?"
22180-99 = "윽……."
22180-100 = "……후우. 알았어. 알았다고."
22180-101 = "그럼 가볼까."
22180-104 = "[ns] \"치히로! 다음은 어디야?!\""
22180-105 = "오른쪽으로 돌아서 직진! 그럼 바로 그곳에 목적지가 있을 거야!"
22180-106 = "아자아앗! 간다!"
22180-107 = "바로 여기……!"
22180-118 = "[ns] \"이곳이 요새도시 <에리두>의 중앙 타워…….\""
22180-119 = "아리스 쨩이……. 이곳에……."
22180-120 = "그럼 가자!"
22180-121 = "응!"
22180-123 = "어?"
22180-125 = "앗! 주인님이랑 다들! 안녕안녕!"
22180-126 = "여러분 먼저 도착하셨었군요."
22180-132 = "선배들!"
22180-133 = "[s] \"네루랑 모두가 여기 있다는 건…… 토키는?\""
22180-134 = "……크읏!!"
22180-135 = "아하하~ 그게 말이야~"
22180-136 = "……하아."
22180-137 = "아쉽게도 놓쳐버렸어요."
22180-138 = "좀만 더 가까이 갔으면 확실하게 때려눕힐 수 있었다고!"
22180-140 = "(그리하여 어찌 된 건지, 아카네로부터 자초지종을 들을 수 있었다.)"
22180-142 = "[ns] \"도시 전체가 흔들리던 진동은 그거 때문이었구나.\""
22180-143 = "허를 찔렸다고 할까요…… 덕분에 양동작전 자체가 의미가 없어진 셈이죠."
22180-144 = "[s] \"그야 도시가 움직인다니, 그런 거 보통은 상상 못하지…….\""
22180-145 = "그러는 선생님들 쪽에서도 뭔가 큰일이 일어난 것 같다만."
22180-146 = "응. 그러게. 뭔가 엔지니어부도 안보이고."
22180-147 = "으으음~ 큰일이라고 할까……."
22180-148 = "분명 큰일은 큰일이었지만, 그게……."
22180-149 = "[s] \"정말 굉장했지. 아방가르드군…….\""
22180-155 = "[ns] \"그건 그렇고 치히로. 정말 이 타워에 아리스가 있는 거야?\""
22180-156 = "……회장이 말했었지. 아리스의 헤일로를 파괴하겠다고."
22180-157 = "그런 일을 해내기 위해선 그만한 시설이 마련되어 있어야만 해."
22180-158 = "그리고 이곳 에리두는 도시의 모든 전력이 눈앞의 타워로 집중되는 구조로 만들어져 있어."
22180-159 = "이만한 시설이 지어진 이유와 회장의 동기를 재료로 하여 역으로 생각해보자면…… 답은 하나뿐이겠지."
22180-160 = "즉…… 아리스는 정말로 저기에……"
22180-161 = "어쨌거나 남은 건 이 무식하게 커다란 타워를 오르는 것뿐이란 거지?"
22180-162 = "[s] \"응. 맞아. 그럼 가볼까?\""
22180-163 = "다만 그렇게 중요한 곳이니만큼 뻔한 이야기지만."
22180-171 = "……당연히 이곳을 지키는 수문장도 있겠지."
22180-175 = "기다리고 있었습니다. 선배님들. 그리고 선생님."
22180-176 = "[s] \"역시 토키가 수문장이었나…….\""
22180-177 = "앗! 바로 다시 만났네~ 아하핫~ 안녕! 토키 쨩~"
22180-178 = "아앙? 뭐야, 바로 직전에 꽁지 빠지게 도망쳤던 주제에 다시 나타나다니."
22180-179 = "뭔 생각이야?"
22180-180 = "사전에 짜둔 작전이 변경된 건 너희뿐만이 아니란 뜻이야."
22180-181 = "……리오."
22180-182 = "사전에 준비한 계책, 미리 상정했던 계산, 앞을 내다보고 준비한 계략."
22180-183 = "내가 준비한 요새도시의 방비들을 차례차례 피하고, 부수고, 뛰어넘어 이 자리까지 도달할 줄이야."
22180-184 = "변수로서 작동하고, 계산미스를 유발하며 이 모든 것을 가능케 하는 건 역시……"
22180-185 = "이것이 샬레의 선생. 당신의 힘이란 걸까?"
22180-186 = "[s] \"…………리오.\""
22180-187 = "그렇다면 좋아. 규격 외의 힘을 보여준다면, 이쪽도 규격 외의 것으로 화답하면 되니까."
22180-188 = "토키, 현 시간부로 [ruby=Abi-Eshuh]<아비 에슈흐>[/ruby]의 사용을 허가할게."
22180-189 = "……리오 님, 그건."
22180-190 = "그래. 원래는 <이름 없는 신들의 왕녀>를 상대하기 위해 준비한 것이지만…… 어쩔 수 없겠지."
22180-191 = "여기서 저들을 막지 못한다면, 애초에 모든 전제가 무의미해질 테니까."
22180-196 = "……예스, 맴."
22180-197 = "지금부터 파워드 슈트 시스템 <아비 에슈흐>로 이행합니다."
22180-198 = "[s] \"아비…… 에슈흐?\""
22180-211 = "이 소리는……."
22180-213 = "……! 하늘에!"
22180-217 = "호출 신호 확인."
22180-234 = "우, 우와앗?! 뭐, 뭐야아앗?!"
22180-249 = "\"파워드 슈트 시스템 [wa:1000]<아비 에슈흐> [wa:1500]기동\""
22180-254 = "\"전투, [wa:1500]개시합니다.\""
22180-258 = "[ns] \"………온다!\""
