[translation]
1003103-1 = "조금쯤은, 보여주고픈 모습"
1003103-3 = "(그렇게 되어, 아루와 약속한 대로 정해진 시간에 맞춰 약속 장소 앞으로 나왔다.)"
1003103-4 = "(그리 멀지 않은 곳에서 아루를 발견할 수 있었다.)"
1003103-6 = "흠흠, 이 차림새, 으음. 이, 이상하지 않겠지?"
1003103-7 = "내 탁월한 안목으로 직접 고른 물건이니까."
1003103-8 = "……어디 거울 같은 거 없나."
1003103-9 = "[s] \"아루?\""
1003103-10 = "히얏?! 서, 선생님?!"
1003103-11 = "어, 언제 온 거야? 깜짝 놀랐잖아."
1003103-12 = "그, 그래도 늦지 않게 제시간에 맞춰 와서 다행이야! 오늘은 무척 중요한 자리니까."
1003103-13 = "응! 늦으면 엄청 곤란했을 테니까. 그게……."
1003103-14 = "[s] \"…….\""
1003103-15 = "저……. 선생님?"
1003103-16 = "왜, 왜 그래? 아무 말 없이 빤히 바라보기만 하고……"
1003103-19 = "(흥! 어때. 선생님! 비싼 돈을 들인 만큼, 보라고! 이 고급스러운 원단에서 자연스레 배어 나오는 단아한 분위기!)"
1003103-20 = "(이거라면 그때 내가 단순히 점원 말에 넘어간 게 아니라는 걸,)"
1003103-21 = "(내 탁월한 사업적 안목의 결과란 걸 선생님도 인정할 수밖에 없……!)"
1003103-22 = "[s] \"아루의 그 옷…….\""
1003103-23 = "자, 잠깐 타, 타임! 아직, 마, 마음의 준비가 안 됐으니까!"
1003103-24 = "(여, 역시 소감을 직접 듣는 건, 무, 무리야!)"
1003103-25 = "(물론 그럴 리는 없다고 생각하지만, 만약에. 혹시라도 정말로 만약에…….)"
1003103-26 = "(이상하다거나, 어울리지 않는다거나 하는 말을 선생님에게 듣기라도 했다간…….)"
1003103-29 = "후우, 후아. 심호흡. 응. 됐어!"
1003103-30 = "흐, 흥. 크흠. 저기 선생님, 모모톡에서도 말했지만, 오늘은 품위 있고 중요한 장소에 찾아갈 거야. 그러니까 우선 그 일을 생각하자구."
1003103-31 = "흐-흥. 이번에 아는 연줄을 통해 귀한 초대장 하나를 손에 넣었거든~"
1003103-32 = "……응? 내 연줄이라니, 수상하다고? 시, 실례네!"
1003103-33 = "키보토스에서도 알아주는 사업가가 마침 새해를 기념해 여는 특별 디너 파티의 초대장이라고?!"
1003103-34 = "[s1] \"그래서 오늘은 그 옷을 입고 디너 파티에?\"\n[s2] \"중요한 자리라는 게, 그런 의미였구나.\""
1003103-35 = "응, 맞아! 후후후. 역시 그때 기모노를 렌탈했던 건, 미래를 내다본 내 뛰어난 사업감각 덕분이었다는 거지~♪"
1003103-36 = "응, 맞아! 후후후. 역시 그때 기모노를 렌탈했던 건, 미래를 내다본 내 뛰어난 사업감각 덕분이었다는 거지~♪"
1003103-37 = "준비는 완벽해……!"
1003103-41 = "아, 이럴 때가 아니야. 자아. 선생님. 어서 가자! 이러다 파티에 늦겠어♪"
1003103-44 = "사람이 무척 많지?"
1003103-45 = "키보토스에서도 내로라하는 사업가들이 한자리에 모이는 중요한 자리야."
1003103-46 = "앞으로 펼칠 사업의 아이디어나, 각 분야에서 알아주는 이들이 의견을 교류하기 위해 모이는 화합의 장이라고나 할까?"
1003103-47 = "즉 이곳에 있다 보면, 오고 가는 이야기 속에서 새로운 사업 아이템을 찾거나, 우리 흥신소에게 도움이 되는 고객을 찾을 수 있을지도 모른다고?"
1003103-48 = "[s] \"그런 굉장한 자리의 초대장이, 어째서 아루에게?\""
1003103-49 = "후훗. 그야 나는 <흥신소 68>의 사장이자 리더인 리쿠하치마 아루라고? 뭐, 드디어 나를 인정하는 사람이 늘고 있다는 뜻이지."
1003103-50 = "[s] \"아루는 굉장하네.\""
1003103-51 = "괴, 굉장해? 그, 그래? 그렇구나. 선생님이 그렇게 생각해준다면야, 뭐……."
1003103-54 = "(그, 그래! 맞아! 이거야! 여기서 선생님에게 나의 멋진 모습을 어필하면…….)"
1003103-55 = "(미처 소감은 듣지 못했지만, 그런 건 아무래도 좋을 정도로 날 다시 보게 만드는 거야! 응! 할 수 있어!)"
1003103-58 = "후후! 좀 더 칭찬해도 좋다고? 이 행사장에는 우리 흥신소의 고객들도 있다 보니까 말이야~"
1003103-59 = "오늘은 그 케어, 라고 할까. 상담……. 이라고 할까."
1003103-60 = "아, 그, 그게. 사, 사업 이야기! 응, 사업이야기를 위해서 말이야!"
1003103-61 = "우리 흥신소가 지금 엄청 중요한 사업을 준비하고 있거든. 그것 때문에 만나봐야 할 고객이 있어!"
1003103-62 = "새해에도 빈틈없이 일하는 날 보고 감탄하도록 해. 선생님."
1003103-63 = "[s] \"아루의 고객이라니, 어떤 사람일지 궁금한걸\""
1003103-64 = "후후후. 크게 대단할 건 없지만, 뭐어, 기대하라고?"
1003103-65 = "내 사업가로서의 진면목을 보여줄 테니까! 후후후후!"
1003103-66 = "후후후."
1003103-67 = "후… 후……."
1003103-68 = "후……."
1003103-71 = "(저, 저질러버렸다!)"
1003103-72 = "(시, 실제로는 그냥 어쩌다 보니 초대장을 손에 넣었을 뿐이고. 만나야 할 고객이 있다니. 그런 게 있을 리가 없잖아!)"
1003103-73 = "(너, 너무 기세를 타고 말해 버렸어! 지금이라도 말을 정정해야…….)"
1003103-74 = "(하, 하지만 이제 와서 말을 바꾸면 너무 볼품없지 않아?!)"
1003103-75 = "[ns] \"그래서 그 고객은 어디에?\""
1003103-76 = "으, 응? 그게 그러니까……."
1003103-77 = "(이걸 어, 어쩌면 좋지!)"
1003103-78 = "(아! 그래! 오늘 만날 약속을 했지만, 아쉽게 자리에 나오지 못했다고 하면…….)"
1003103-79 = "(그래, 이 설정으로 가는 거야!)"
1003103-80 = "아까, 방명록을 찾아보니까, 아무래도 오늘은 아쉽게 파티장에 나오지 못한 모양이야."
1003103-81 = "……응? 고객이 어, 어떤 이름이었냐고?"
1003103-82 = "그, 그러니까. 이름이라고 할까. 우리 쪽에선 의뢰인의 신변보호를 위해, 그 닉네임으로 부르고는 하는데."
1003103-83 = "새해 거울떡 배, 백작……?"
1003103-88 = "오, 이번 디너 파티에 나오셨군요. 새해 거울떡 백작님."
1003103-89 = "하하하! 오랜만입니다! 오세치 너무 좋아 사장님!"
1003103-90 = "진짜로 있는 거냐고! 새해 거울떡 백작!!"
1003103-91 = "핫?! 아니, 그러니까. 그게."
1003103-92 = "그, 그렇네! 고, 고객이니까! 인사를 드려야……."
1003103-93 = "자, 잠깐. 선생님. 나, 고객하고 이, 이야기를 좀……."
1003103-94 = "(어, 어떡하면 좋아! 새, 생각을, 생각을 해야, 이, 상황을 해결하려면……!)"
1003103-105 = "음?"
1003103-106 = "아가씨, 저희에게 무슨 볼일이라도?"
1003103-107 = "그, 그게, 그러니까. 네, 그게 말이지요……."
1003103-111 = "(……아니, 여, 역시 무리인 게 당연하잖아!)"
1003103-112 = "으, 으읏! 시, 실례했습니다앗!"
1003103-114 = "……앗."
1003103-118 = "아야야……. 서, 선생님? 괜찮아?!"
1003103-119 = "미, 미안! 그, 옷이 익숙지 않아서 발을 잘못 딛는 바람에, 지금 일어날 테니까……!"
1003103-123 = "아얏! 바, 발이!"
1003103-124 = "바, 발을 접질린 모양이야. 이, 일어설 수가……."
1003103-133 = "응? 잠깐. 선생님, 뭐, 뭘 하는 거야……!"
1003103-134 = "(이, 이건 고, 공주님 안기? 다, 다들 보는 앞에서 너무 대담한 거 아니야?!)"
1003103-135 = "[s3] \"갑작스럽게 미안해, 하지만 내버려 둘 수는 없었어.\"\n[s4] \"아, 미안, 혹시 이런 건 싫어?\""
1003103-136 = "따, 딱히 싫다는 건 아니지만……!?"
1003103-137 = "따, 딱히 싫다는 건 아니지만……!?"
1003103-138 = "이, 이런 정도는 내겐 아무것도 아니니까."
1003103-139 = "흐, 흥! 선생님이 그런 배려를 할 것까지도 없……."
1003103-140 = "[s] \"이럴 때만큼은 의지해줬으면 좋겠어.\""
1003103-141 = "아……"
1003103-142 = "……네, 네에."
1003103-143 = "그, 그럼……. 시, 실례하겠습니다."
1003103-145 = "(그렇게 파티장에서 아루를 데리고 나와, 빌딩 앞에서 잠시 쉬기로 했다.)"
1003103-148 = "고, 공주님 안기는 여기까지! 아무리 그래도 계속 안겨 있는 건 부, 부끄러우니까!"
1003103-149 = "욱신거리는 것도 많이 좋아졌고!"
1003103-150 = "하아. 하아…… 그……."
1003103-154 = "……선생님, 오늘은 그게 있잖아……"
1003103-155 = "[s5] \"미안, 너무 지나쳤지?\"\n[s6] \"아루를 놀리는 게 너무 재밌어서. 그만.\""
1003103-158 = "뭐, 뭐어?!"
1003103-159 = "하아. 괜히 지치는 느낌이야. 뭐어……. 나도 괜한 허세를 부리긴 했지만, 그게, 그……."
1003103-160 = "……결국 선생님에게 내 멋진 모습을 보여주겠다던 계획은……."
1003103-161 = "[s] \"아루는 어차피 평소에도 충분히 멋지지만 말이지.\""
1003103-162 = "!!"
1003103-163 = "……또 아, 아무렇지도 않게 그런 이야기라니. 선생님……."
1003103-164 = "……응, 그래. 결국 이번엔 여러 가지로 잔뜩 엉망이 되어버렸지만."
1003103-165 = "응! 그건 서로 쌤쌤이라는 걸로!"
1003103-166 = "괜히 지나간 일을 후회하기보다는 다음번엔, 좀 더 제대로 내 멋진 모습을 보여줄 테니까!"
1003103-167 = "[s] \"응, 기대하고 있을게.\""
1003103-168 = "뭣- 선생님, 또 그런 식으로……. 아아, 진짜. 그렇게 말했겠다? 알았어. 꼭 보여줄 테니까!"
1003103-169 = " ……아, 물론 방금은 딱히 선생님의 말에 당황한 게 아니니까……! 역시 내 동업자, 회화 테크닉을 우습게 볼 수 없네! 정도로 생각했달까."
1003103-170 = "하, 하여간!"
1003103-171 = "그럼……. 다음번에도-"
1003103-172 = "내 에스코트를 부탁할게. 선생님♪"
