[translation]
1008206-1 = "청춘의 감사를 담아"
1008206-3 = "[ns] \"렌게가 오기 전에 밀린 일부터 다 끝내둬야겠지.\""
1008206-11 = "[ns] \"이쪽은 정리했고, 다음은 어디 보자…….\""
1008206-14 = "(정신을 차려보니 어느덧 시간은 렌게가 찾아오기로 했던 약속 시간이 되었다.)"
1008206-18 = "[ns] \"……그러고 보면 마지막으로 밥을 먹은 게 언제였더라.\""
1008206-19 = "(밀려드는 업무를 처리하는 데 급급했던 나머지, 마지막으로 식사를 했던 기억이 어렴풋하기만 하던 그때.)"
1008206-24 = "선생……!"
1008206-25 = "아니, 스승님! 나 왔어!"
1008206-26 = "오늘도 활기차게 같이 <청춘 활동>을……!"
1008206-30 = "……어? 왜 그래? 스승님? 평소답지 않게 책상에 축 늘어져 있고."
1008206-31 = "[s] \"아니, 아무것도 아니야. 업무 때문에 살짝 피곤한 거뿐이라.\""
1008206-32 = "흐으으음, 그래?"
1008206-33 = "괜찮다면 다행이지만……."
1008206-34 = "[s] \"응, 오히려 이런 와중에 렌게를 만나니까 힘이 날 정도라구.\""
1008206-35 = "뭐, 뭣?!"
1008206-36 = "아, 아무렇지도 않게 빈틈을 찌르는 그 대사. 보통이 아닌 걸……"
1008206-37 = "나 같은 <청춘 경력자>가 아니었다면 방금 그 대사 한 방으로 살짝 당해버렸을지도 모르겠는데……!"
1008206-38 = "응. 역시 스승님이야!"
1008206-39 = "[s1] \"그럴 의도는 아니었습니다만…….\"\n[s2] \"청춘 초심자에서 레벨업했구나…….\""
1008206-44 = "자자, 그보다 오늘도 새롭게 <청춘 활동>을 하기 위한 에피소드를 준비해 왔으니까."
1008206-45 = "오늘 하루도 팍팍 나가보자고!"
1008206-46 = "[s] \"응. 그럼 가볼까?\""
1008206-52 = "(그렇게 오늘 하루도 우리는 <청춘 활동>에 매진을 하게 되었다.)"
1008206-62 = "(그리고…….)"
1008206-67 = "으으으음~~!"
1008206-68 = "이야~ 오늘 하루도 보람찼네! 스승님!"
1008206-69 = "이번에도 여러 <청춘 활동>을 했으니 그만큼 포인트랑 각종 경험치도 쌓였겠지."
1008206-70 = "이걸로 좀 더 청춘 마스터에 한 걸음 다가간 기분이 들어!"
1008206-71 = "[s3] \"청춘 초심자 다음은 경력자, 그다음은 마스터인 건가!\"\n[s4] \"생각보다 착실하게 레벨 시스템이 갖춰져 있는 거네!\""
1008206-74 = "뭐든지 착실히 단계를 밟아 나가는 게 중요하니까 말이지."
1008206-75 = "뭐, 그건 그렇고 오늘도 같이 어울려 줘서 정말 고마──"
1008206-84 = "응……? 스승님? 왜 그래?"
1008206-85 = "[s] \"아, 렌게. 미안. 잠깐…….\""
1008206-97 = "스, 스승님?!"
1008206-101 = "괜찮아?! 스승……!"
1008206-105 = "……………엥?"
1008206-108 = "(렌게의 도움을 받아 어찌어찌 샬레로 돌아올 수가 있었다.)"
1008206-111 = "그러니까 정리하자면……."
1008206-112 = "그간 너무 바쁘게 일하느라 언제 마지막으로 밥을 먹었는지도 기억이 안 난다?"
1008206-113 = "그래서 배고픈 나머지 현기증이 돌아서 쓰러졌다…… 이 말이야?"
1008206-114 = "[s] \"……네, 그렇습니다.\""
1008206-115 = "……………으으으으."
1008206-116 = "[s] \"저기…… 렌게? 왜 그런 표정으로…….\""
1008206-120 = "그───러면 안 된다고!! 선생님!"
1008206-122 = "[ns] \"우왓?! 깜짝이야!\""
1008206-123 = "아무리 바쁘더라도 밥은 꼭 챙겨 먹어야지!?"
1008206-124 = "뭐라고 해도 체력이야말로 기본! 끼니를 거르다니! 당치도 않는 이야기야!"
1008206-125 = "오늘은 다행히 내가 옆에 있었으니 망정이지. 만약 그렇지 않았더라면……."
1008206-126 = "아, 하지만…… 선생님이 평소에 너무 바빠서 밥을 챙겨 먹지 못했다는 건……."
1008206-130 = "혹시, 설마……."
1008206-131 = "………나 때문이야?"
1008206-132 = "[s] \"어? 렌게 때문이라니? 아냐, 그냥 정말로 일이 바빴을 뿐이라…….\""
1008206-133 = "……아니, 나도 알고 있어."
1008206-134 = "그렇지 않아도 샬레의 일 때문에 바쁜 선생님에게, 내가 억지로 <청춘 사제관계>를 들이밀었다는 것 정도쯤은……."
1008206-135 = "선생님은 기쁘게 응해줬지만."
1008206-136 = "역시, 나와 같이 하는 <청춘 활동> 때문에 더 바빠진 건 사실이니까. 그래서 이런 일까지……."
1008206-137 = "[s] \"그거라면 정말 괜찮아. 렌게. 나도 억지로 한 건 아니었으니까.\""
1008206-138 = "선생님……."
1008206-139 = "……."
1008206-140 = "정~말! 이런 상황까지 와서 그런 말이라니."
1008206-141 = "내가 청춘 익스퍼트가 아니었으면 당해버렸을 거라고?!"
1008206-142 = "[s] \"……저기 새로운 레벨이 생기지 않았어?\""
1008206-143 = "에이~ 사소한 건 됐고!"
1008206-144 = "(청춘 활동 때문에 이런 일이 벌어졌으니……. 여기서 내가 할 수 있는 거라면…….)"
1008206-149 = "아."
1008206-150 = "……으음, 좋았어. 마침 좋은 생각이 났으니까. 오늘은 이만 해산하자!"
1008206-155 = "나는 이만 가볼 테니까. 선생님도 잊지 말고 밥을 꼭 챙겨 먹도록 해! 알겠지?"
1008206-156 = "그럼 안녕!"
1008206-160 = "[ns] \"아, 응…… 저기, 자, 잘 가?\""
1008206-163 = "[ns] \"렌게가 너무 신경 쓰게 만들어 버린 걸까.\""
1008206-165 = "(렌게가 떠나간 뒤, 오늘 있었던 일을 떠올리며 뒷정리를 하고 있을 때였다.)"
1008206-172 = "[ns] \"네, 전화 받았습니…….\""
1008206-174 = "아! 선생님! 나야 나! 렌게인데!"
1008206-175 = "뭐? 혹시 보이스 피싱이냐고? 자긴 안 속는다고?!"
1008206-176 = "모처럼 전화를 걸어줬는데 무, 무슨 말을 하는 거야?! 아니, 방금 그건 물론 무진장 그거의 전형이긴 했지만 하여간!"
1008206-177 = "그보다 말이야. 묻고 싶은 게 있는데……."
1008206-178 = "다른 게 아니라, 그…… 혹시 선생님이 평소에 좋아하는 음식이 뭔지…… 라든가. 따로 못 먹는 식재료는 있을까? 라든가."
1008206-179 = "그 왜, 알레르기가 있는 재료는 피하는 쪽이 좋잖아? 아, 왜 그런 걸 묻냐고?"
1008206-180 = "그…… 아, 앙케이트야! 앙케이트! 백화요란 전원에게 물어보고 있는 중이거든!"
1008206-181 = "마침 하는 김에 선생님에게도 물어볼까 해서. 그러니까! 응. 답변을…… 아, 응."
1008206-185 = "[ns] 렌게가 질문한 것들에 대해 성실하게 답한다."
1008206-189 = "……아, 좋았어. 그 정도면 충분해."
1008206-190 = "그럼…… 전력을 다해 도전하러 갈 테니까. 선생님. 목 씻고 얌전히 기다리고 있으라고!"
1008206-191 = "[s] \"뭔가 갑자기 불온한 선언이 되지 않았어?!\""
1008206-192 = "그럼 또 내일!"
1008206-199 = "(그렇게 조금은 정신없기도 했던 대화가 있고 난 뒤……)"
1008206-203 = "(다음 날이 찾아왔다.)"
1008206-209 = "(어제와 마찬가지로 샬레의 업무를 처리하고 있을 무렵……)"
1008206-215 = "[ns] \"아, 렌게. 오늘 찾아온다고 하지 않았어?\""
1008206-219 = "아, 그게 말이야. 내가 샬레로 찾아가기엔 그, 마음의 준비가 필요하다고 할지."
1008206-220 = "<청춘 활동>으로서 역시, 직접 찾아가서 건네주는 건 허들이 엄청나게 높다고 할지……. 흠흠……."
1008206-221 = "……선생님. 지금 샬레에 있는 거지? 주변엔 아무도 없고? 혼자서?"
1008206-222 = "조, 좋았어……. 그, 그렇다면 지, 지금…… 잠깐, 나와줄 수 있을까?"
1008206-223 = "응. 샬레 근처에 있는 공원에서 기다리고 있을 테니까."
1008206-224 = "그럼……!"
1008206-232 = "[ns] \"아마, 렌게가 보자고 한 곳이 이 근처…….\""
1008206-236 = "아! 선생님! 여, 여기야……."
1008206-237 = "오늘 이렇게 선생님을 불러낸 건 다름이 아니라……."
1008206-238 = "지난 며칠 간, 선생님은…… 스승님으로서 나와 어울려주느라 밥도 제대로 못 먹고…… 나도 여러 가지로 굉장히 폐를 끼쳤잖아?"
1008206-239 = "[s] \"그거라면 괜찮은데…….\""
1008206-240 = "아니, 선생님은 괜찮을지 몰라도 나는 아니야!"
1008206-244 = "그런 의미에서…… 자……! 여기……!"
1008206-249 = "[ns] \"아…….\""
1008206-254 = "[ns] \"이건, 도시락……?\""
1008206-255 = "[wa:300]― [log=렌게]마, [wa:650]맞아![/log]"
1008206-257 = "― [log=렌게]한눈에 [wa:400]알아보다니! [wa:1150]역시 스승님![/log]"
1008206-260 = "― [log=렌게]스, [wa:850]스승님을 위해서, [wa:1400]준비한 거야…![/log]"
1008206-263 = "[ns] \"주는 건 고맙지만, 렌게, 왜 갑자기 이런 걸…….\""
1008206-264 = "[wa:900]― [log=렌게]지금까지 선생님에겐 [wa:1250]억지를 부리기만 했지,[/log]"
1008206-266 = "― [log=렌게]제대로 된 답례는, [wa:650]하지도 못했고…….[/log]"
1008206-269 = "― [log=렌게]폐를 [wa:500]끼쳤으니까….[/log]"
1008206-271 = "― [log=렌게]그, [wa:1800]감사의 마음이라고 할까…….[/log]"
1008206-274 = "[wa:600]― [log=렌게]처, [wa:800]처음 만들어본 거니까….[/log]"
1008206-276 = "― [log=렌게]그다지, [wa:650]맛은 보증할 수 없을[wa:1800]지도…….[/log]"
1008206-279 = "― [log=렌게]이런 거, [wa:1000]나에겐 [wa:600]조금 이르지 않나, [wa:800]싶기도 하지만….[/log]"
1008206-281 = "― [log=렌게]그, [wa:600]그래도, [wa:1250]열심히 했으니까…![/log]"
1008206-284 = "[ns] \"……고마워. 렌게. 잘 먹을게.\""
1008206-285 = "[wa:400]― [log=렌게]아, [wa:1400]으, [wa:1100]응…….[/log]"
1008206-288 = "― [log=렌게]그럼 [wa:1150]마, [wa:1100]맛있게……[/log]"
1008206-290 = "― [log=렌게]드, [wa:1300]드셔[wa:1300]주세요…….[/log]"
1008206-293 = "……그, 그럼 난 전달해 줬다?!"
1008206-294 = "이것으로 처, 청춘 활동도 한 단계 레벨업! 이란 것으로 칠 테니까!"
1008206-298 = "그럼…. 이만……!"
1008206-304 = "(그렇게 샬레로 돌아와 맛본 렌게의 도시락에선 무척이나 따스한 맛이 났다.)"
