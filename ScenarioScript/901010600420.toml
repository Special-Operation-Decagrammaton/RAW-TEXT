[translation]
901010600420-7 = "[ns] \"สวัสดี ทุกคน!\""
901010600420-8 = ""
901010600420-9 = "ยินดีต้อนรับค่ะ คุณครู!"
901010600420-10 = "วันนี้ก็คงยุ่งมากแท้ๆ แต่ก็มาตรงเวลาเลยนะคะ"
901010600420-11 = "[s1] \"ครูเป็นผู้ดูแลกองทหาร FOX นี่นา ต้องมาอยู่แล้ว!\"\n[s2] \"ครูอยากรู้ว่าปูปีศาจมีอยู่จริงๆ หรือเปล่าน่ะ\""
901010600420-12 = "ขอบคุณค่ะ... คุณครูเป็นที่พึ่งได้เสมอเลยนะคะ"
901010600420-13 = "ค่ะ ถ้าสิ่งมีชีวิตแบบนั้นมีอยู่จริง เรื่องนี้ก็คงเป็นเรื่องใหญ่กว่าคดีคนหายทั่วไปอีกค่ะ"
901010600420-15 = "วันนี้เราจะได้ข้อสรุปที่เป็นประโยชน์บ้างมั้ยนะ?"
901010600420-16 = "เรื่องนั้นก็ต้องคุยกันก่อนสิถึงจะรู้"
901010600420-19 = "เอาละ ดูเหมือนจะมากันครบแล้ว เริ่มกันเลยมั้ย?"
901010600420-20 = "จากนี้ไป ให้แต่ละคนรายงานผลการปฏิบัติการของวันนี้"
