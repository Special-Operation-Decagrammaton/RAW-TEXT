[translation]
901010600420-7 = "[ns] \"다들 안녕!\""
901010600420-9 = "어서오세요, 선생님!"
901010600420-10 = "오늘도 바쁘셨을텐데, 시간에 맞추어 와 주셨군요."
901010600420-11 = "[s1] \"FOX 소대의 후견인이니까, 당연하지!\"\n[s2] \"괴물 게가 진짜 있을지 궁금했거든.\""
901010600420-12 = "……감사합니다. 늘 의지가 되는 군요."
901010600420-13 = "네. 그런 생물이 정말로 존재한다면, 단순한 실종 사건 이상의 큰일일 테니까요."
901010600420-15 = "오늘은 조금 유의미한 결론을 얻을 수 있으려나?"
901010600420-16 = "그야 이야기해 보기 전까지는 모르는 법이지."
901010600420-19 = "그럼 다 모인 것 같으니 시작할까."
901010600420-20 = "지금부터 금일 작전 내용을 각자 보고하도록."
