[translation]
901010600420-7 = "[ns] 「大家好！」"
901010600420-8 = ""
901010600420-9 = "歡迎您，老師！"
901010600420-10 = "您今天應該也很忙，不過還是準時過來了呢。"
901010600420-11 = "[s1] 「身為FOX小隊的顧問，這是理所當然的啊！」\n[s2] 「因為我也很好奇，怪物螃蟹是不是真的存在。」"
901010600420-12 = "……謝謝您。您總是這麼讓人值得信賴呢。"
901010600420-13 = "是的。如果那種生物真的存在，那可就是超越單純的失蹤事件的嚴重事態了。"
901010600420-15 = "不知道今天能不能得到一點有意義的結論呢？"
901010600420-16 = "那種事在開始討論之前是不會知道的吧。"
901010600420-19 = "看來全都到齊了，那就開始吧。"
901010600420-20 = "從現在開始，各自報告今日的作戰成果。"
