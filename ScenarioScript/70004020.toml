[translation]
70004020-1 = "주인 잃은 선물 2"
70004020-2 = "(다음 날 아침……)"
70004020-8 = "어서 오세요, 엔젤 24입니다!"
70004020-9 = "응, 좋은 아침."
70004020-15 = "(이 학생은 게헨나의 선도부장으로 다른 학원에서도 유명한 소라사키 히나 부장……)"
70004020-16 = "(히나 부장은 평소에도 말수가 적고, 표정 변화도 드물어서 누군가에게 개인적인 선물을 하는 모습을 쉽게 떠올리기가 어렵지만……)"
70004020-17 = "(그래도 선도부와 관련된 일로 선생님과 얽히는 일이 많은 만큼, 선물을 할 가능성은 충분히 있어……!)"
70004020-22 = "저…… 게헨나 학원의 소라사키 히나 부장님, 맞으시죠?"
70004020-23 = "응. 혹시 내게 무슨 볼일이라도……?"
70004020-24 = "아, 아뇨! 특별히 신경 쓰이거나 부탁할 일이 있는 건 아닌데요."
70004020-25 = "저, 그게…… 그, 그러니까……"
70004020-26 = "이번 크리스마스는 어떻게 보내실 예정이신가요?"
70004020-27 = "이번 크리스마스……?"
70004020-28 = "네. 아무리 바쁘신 선도부장님이라 하더라도 크리스마스 정도는, 조금…… 편하게 지내시지 않을까 해서……"
70004020-29 = "성대한 파티에 참여한다던가, 누군가에게 '선물을 한다' 던가—"
70004020-30 = "……글쎄."
70004020-31 = "그런데 내 일정은 왜 궁금해하는 거지?"
70004020-32 = "(크, 큰일 났다! 의심받고 있어……!)"
70004020-33 = "저, 그게…… 그러니까……"
70004020-35 = "저, 사실 중학생이라 내후년에는 고등학교에 입학할 예정이라서요!"
70004020-36 = "그래서 어느 학교에 진학해야 좋을지 고민 중이었는데, 게헨나의 학생들은 휴일을 어떻게 보내는지 갑자기 궁금해져서요."
70004020-37 = "진학 고민? 그것도 게헨나 학원에……?"
70004020-38 = "네, 넵! 혹시 제가 이상한 질문을 했나요……?"
70004020-39 = "아니. 이상할 건 없지만……"
70004020-40 = "게헨나를 진학 목표로 고민하는 중학생은 처음 본 것 같아서."
70004020-41 = "평소의 모습 때문에 성실한 학생이라고 생각했었는데…… 내심 자유로운 교풍을 동경하고 있었다던가?"
70004020-42 = "네? 혹시 계속 저를 지켜보고 계셨던 건가요?"
70004020-43 = "의도한 건 아니지만, 샬레에 올 때마다 마주치게 되다 보니 우연히."
70004020-44 = "소라 양은 언제나 샬레의 편의점을 묵묵히 지키고 있잖아?"
70004020-45 = "하루 정도는 게으름을 부릴 법도 한데, 언제나 성실하게 자리를 지키며 상품을 채워 넣는 모습이 중학생답지 않게 성실하다고 생각해서."
70004020-46 = "기분 내키는 대로 자유롭게 행동하는 대부분의 게헨나 학생들과는 인상이 다르다고 생각해서 조금 놀란 것뿐이야. 진로는 원한다면 자유롭게 정할 수 있지."
70004020-47 = "물론 선도부장의 입장으로는 소라 양처럼 성실한 학생이 후배로 들어온다면 큰 도움이 될 것 같네."
70004020-48 = "가, 감사합니다……."
70004020-49 = "조금 이야기가 빗나갔지만, 이번 크리스마스는 선도부실에서 다른 선도부원들과 같이 보낼 예정이야."
70004020-50 = "아코— 그러니까 선도부의 행정관이 올해 크리스마스는 함께 보내고 싶다며 뭔가를 준비하는 모양이었거든."
70004020-51 = "어차피 처리해야 할 업무가 잔뜩 쌓여있기도 하고. 선도부실을 나갈 일은 없을 것 같네."
70004020-52 = "그렇군요…… 그럼 이 선물은 다른 분이 가져온 걸까요?"
70004020-53 = "……선물?"
70004020-54 = "아, 아무것도 아니에요!"
70004020-58 = "소라 양. 내 번호를 알려줄 테니, 나중에라도 혹시 도움이 필요하면 연락해."
70004020-59 = "게헨나 학원과 관련된 진학이나 고민이 있다면…… 도와줄 수 있으니까."
70004020-60 = "감사합니다. 나중에 편의점이 습격당하는 일이 생기면 꼭 연락드릴게요!"
70004020-61 = "……그런 일은 생기지 않는 편이 더 좋겠지만."
70004020-66 = "어서오세요, 엔젤 24입니다!"
70004020-67 = "어…… 이번에 새로 나왔다는 민트 초코 호빵……? 아무튼 그거 하나 사고 싶은데요."
70004020-68 = "그리고 다른 맛 호빵들도 있으면 종류 별 하나씩요."
70004020-69 = "네, 잠시만 기다려 주세요."
70004020-75 = "(이분은 분명 트리니티 종합학원 소속의……)"
70004020-76 = "(……조금 인상이 무섭긴 하지만 부드럽고 달콤한 디저트를 좋아하는지 자주 사가는 손님이었지.)"
70004020-77 = "(평소에도 선물용 디저트를 가끔 사 갔었는데, 혹시 선생님을 위해서 디저트 선물을 준비한 걸까?)"
70004020-82 = "저, 손님. 혹시 이번 크리스마스 케이크는 주문하셨나요?"
70004020-83 = "……에? 갑자기 케이크? 왜요?"
70004020-84 = "아, 이거 뭐 엔젤 24의 케이크 판촉 같은 건가요?"
70004020-85 = "아, 아뇨! 가게의 일 때문이 아니라, 개인적인 질문인데요……"
70004020-86 = "트리니티의 학생들은 크리스마스에 어떤 케이크를 먹는지 궁금해서요."
70004020-87 = "아……?"
70004020-88 = "……?"
70004020-89 = "트, 트리니티요? 제가 그런 말을 했던가요?"
70004020-90 = "……? 아, 아뇨 딱히 그러신 적은……."
70004020-91 = "그, 그렇죠? 그래도 트리니티 학생처럼 보이나요? 에헤헤……."
70004020-92 = "(왜, 왜 좋아하는 거지……? 트리니티 문양이 그려져 있는 옷을 입고 있으면서…….)"
70004020-93 = "트리니티의 학생들이 먹는 디저트라. 그러고 보니 전에 SNS에서 트리니티 학생들은 비싼 디저트만 먹는다는 소문을 누가 퍼트리던데…… 그것 때문이려나."
70004020-94 = "뭐, 트리니티의 학생들을 대표할 순 없지만, 트리니티의 아가씨들이라고 해서 비싼 디저트만 선호하는 건 아니니까."
70004020-95 = "맛있는 음식에 대한 감상은 누구나 비슷하잖아요? 저도 이번 크리스마스에는 D.U.에 있는 단골 가게에서 특제 뷔슈 드 노엘을 주문했고……."
70004020-96 = "다만 그 케이크도 선착순 한정 예약 상품이라, 일반적인 참고가 되지 못할 것 같네요. 죄송."
70004020-97 = "괘, 괜찮아요! 어디까지나 참고로 하고 싶은 것뿐이라……"
70004020-98 = "그럼 그 케이크는 누구와 나누어 드실 예정이신가요?"
70004020-100 = "같은 동아리의 친구들? 아니면 다른 모임? 혹은 '[USERNAME] 선생님'이라던가—"
70004020-101 = "그, 그럴 리가 없잖아!?"
70004020-102 = "죄, 죄송합니다!"
70004020-103 = "……아."
70004020-104 = "아차, 또 실수를……. 하아."
70004020-105 = "미안. 생각 못 한 소리 들으면 소리 지르는 게 습관 돼 버려서."
70004020-106 = "절대 그쪽 탓은 아니고, 그렇게 만든 녀석들은 따로 있으니 이해해 줘…… 요."
70004020-107 = "아, 아니에요. 진짜 괜찮아요. 편하게 대해 주세요."
70004020-108 = "……고마워. 보기보다 훨씬 어른스럽구나."
70004020-109 = "질문에 대답하자면…… 뭐, 물론 선생님과 디저트를 나누어 먹는 경우도…… 없진 않지만."
70004020-110 = "이번 크리스마스에는 부원들과 함께 케이크를 나누어 먹고, 시스터후드의 일을 도우러 갈 거야."
70004020-111 = "시스터후드에서 성탄제가 끝나고 직접 구운 파네토네를 나누어 준다고 했거든. 특별한 재료가 들어간 건 아니라지만, 뭐. 좋은 게 좋은 거니까."
70004020-112 = "그, 그렇군요……. 역시 이 선물은 다른 학생이 준비한 물건이었나."
70004020-113 = "……???"
70004020-117 = "……저기, 소라—라고 했던가? 크리스마스에 뭘 할 거야?"
70004020-118 = "저는 크리스마스에도 편의점 아르바이트를 계속할 예정인데요."
70004020-119 = "엣, 크리스마스에도 아르바이트를 한다고? 그날 정도는 쉬어도 괜찮잖아?"
70004020-120 = "아……하하…… 그래도 좋겠지만, 개인적으로 사고 싶은 물건이 꼭 있거든요."
70004020-121 = "헤에— 고생이 많아 보이네."
70004020-122 = "……자, 이거 받아."
70004020-123 = "이, 이게 뭔가요?"
70004020-124 = "트리니티에서 파는 한정 마카롱이야. 친구들과 나누어 먹으려고 샀는데, 양이 조금 많은 것 같아서."
70004020-125 = "일하다 보면 단 게 당길 때가 많잖아? 그럴 때 먹으면 능률도 오르고 기분 전환도 되고."
70004020-126 = "가, 감사합니다……!"
70004020-127 = "감사는 무슨, 아까 실수한 거에 대한 사과의 뜻이기도 하니까, 신경 쓰지 마."
70004020-128 = "그럼 나는 갈게. 소라도 좋은 하루 되길~"
70004020-132 = "저기, 혹시 이 편의점에 휴대폰용 예비 배터리도 있어?"
70004020-133 = "네, 매대 오른쪽 구석의 가장 아래 칸에 있어요."
70004020-134 = "살았다~ 급하게 연락이 올 곳이 있었는데 배터리가 거의 다 떨어져서 당황하던 참이었거든."
70004020-135 = "분명 계획대로라면 학원에 돌아갈 때까지 충분했을 텐데…… 뭐가 문제였던 거지?"
70004020-141 = "(이 학생은, 밀레니엄 학원의 회계를 맡고 있는 유우카 씨였지?)"
70004020-142 = "(연말 정산을 할 때나 샬레의 영수증을 정리할 때 선생님과 함께 있는 모습을 종종 보았었는데……)"
70004020-143 = "(언제나 화난 모습으로 선생님께 야단치는 모습만 본 것 같은데, 혹시 몰래 선물을 준비하고 있었다던가?)"
70004020-148 = "저, 실례합니다만……"
70004020-149 = "응? 무슨 일이야? 혹시 방금 준 거스름돈이 틀렸나?"
70004020-150 = "아뇨. 거스름돈이 아니라, 개인적으로 여쭈어보고 싶은 것이 있어서요."
70004020-151 = "개인적인 질문? 매번 인사만 주고받던 소라 쨩의 질문이라니 갑자기 궁금하네."
70004020-152 = "뭐든 편히 물어봐. 답할 수 있는 거라면 답해 줄게."
70004020-154 = "저기, 혹시 [USERNAME] 선생님의 이번 크리스마스 일정을 알고 계시나요?"
70004020-155 = "그, 그, 그걸 어째서 내게 묻는 거야?!"
70004020-157 = "네, 네……? 하지만 유우카 씨, 언제나 선생님의 영수증이나 야근 기록 같은 거 챙기고 계셨고……"
70004020-158 = "다른 학생들에 비해서 선생님을 오랫동안 알고 계셨던 것 같아서, 일정 정도는 공유하시는 줄—"
70004020-162 = "죄, 죄송해요! 제가 넘겨짚고 착각을 한 모양이네요."
70004020-163 = "……크흠! 물론 선생님이 불필요한 과소비를 하시지 않도록 적당한 조언은 하고 있지만……"
70004020-164 = "어디까지나 학생과 선생님의 관계니까. 특별한 일이 없는 한 휴일에는 편히 쉬도록 연락은 거의 드리지 않고 있어."
70004020-165 = "게다가 선생님은 휴일에도 일 때문에 바쁜 때가 많으시니까."
70004020-166 = "그, 그렇군요. 그럼 유우카 씨도 이번 크리스마스에 선생님과 약속이 있으신 건 아니시군요?"
70004020-167 = "응. 이번 크리스마스는 아마 세미나 부원들과 함께 보낼 것 같네."
70004020-168 = "손이 조금 가는 후배가 요새 고민이 많은 것 같아서."
70004020-169 = "이번 연말은 부원들을 챙기면서 조용히 보내려고 계획 중이야."
70004020-170 = "……그나저나 그렇게 묻는 걸 보니, 누군가가 선생님과 크리스마스 약속을 잡기라도 했나 봐?"
70004020-171 = "아, 아뇨! 그런 뜻은 아니었어요!"
70004020-172 = "흐응…… 뭐, 나야 아무래도 상관없지만."
70004020-173 = "여하튼 소라 쨩도 너무 무리하진 말고. 종종 궁금한 게 있으면 편하게 물어봐 줘."
70004020-174 = "네, 넵. 감사합니다……!"
70004020-178 = "……드, 들킬 뻔했네. 역시 너무 직접적으로 묻는 건 좋지 않겠어."
70004020-179 = "그나저나 어제 샬레를 방문한 대부분의 학생들에게는 물어본 것 같은데, 아무도 선물에 대해서는 모르는 눈치네."
70004020-180 = "혹시…… 다른 사람을 위한 선물이었던 걸까?"
70004020-181 = "아니, 방심할 수는 없어. 마지막 한 사람까지 확실하게 확인해 보지 않으면……!"
70004020-186 = "어서오세요, 엔젤 24입니다!"
70004020-188 = "(그 후로 소라는 다른 학생들에게도 선물의 출처에 대해 물어보았지만……)"
70004020-189 = "(……결국 이렇다 할 뾰족한 단서는 찾지 못했다.)"
