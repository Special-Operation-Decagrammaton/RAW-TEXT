[translation]
2003702-1 = "폴리스 스토리-식당가 편"
2003702-2 = "(모모톡을 받고 후부키가 있는 곳을 찾았다.)"
2003702-6 = "선……아니 감찰관! 와줘서 고마워!"
2003702-7 = "[s1] \"아니, 감찰관이라니…….\"\n[s2] \"대체 무슨 일을 꾸미고 있는 거야?\""
2003702-10 = "감찰관도 당황했구나?"
2003702-11 = "괜찮아, 괜찮아. 지금부터 할 일은 내가 알려줄 테니까."
2003702-12 = "라이프가드인 나와 같이 이 푸드코트를 둘러보면서 불량식품 단속을 하는 거야."
2003702-13 = "[s3] \"잠깐잠깐잠깐. 불량식품?\"\n[s4] \"이야기를 못 따라가겠어.\""
2003702-19 = "정말, 선생은 눈치가 없구만."
2003702-20 = "간단하게 말할게."
2003702-21 = "지금으로부터 약 30분 전, 이 워터파크의 푸드코트에 있는 마스터 도넛에서 신작 도넛이 나온다는 정보를 들었어."
2003702-22 = "아직 판매가 개시되지는 않았지만, 팔기 시작하면 그 즉시 거대한 인파가 몰릴 것은 당연하겠지."
2003702-23 = "[s] \"……그래서?\""
2003702-24 = "정식 판매가 시작되기 전에 그 도넛을 맛볼 수 있는 기회가 있다구!"
2003702-25 = "바로바로……식품 위생 단속 감찰관과 함께라면 말야!"
2003702-26 = "그리고 규정을 면밀히 살핀 결과, 식품 위생 단속 감찰관은 총학생회 임원이나 샬레의 선생님이 맡기로 되어 있더라고."
2003702-27 = "여기까지 말했으면 대충 알겠지?"
2003702-28 = "[s] \"후부키 너 설마…….\""
2003702-29 = "파크 이용객들의 안전과 즐거움, 그리고 건전한 식음문화를 위해서……."
2003702-30 = "선생님과 나는 마스터 도넛 워터파크점의 신작 도넛을 미리 맛볼 특권, 아니 의무가 있다는 거지!"
2003702-34 = "[ns] \"그럴 줄 알았어.\""
2003702-35 = "자, 얼른 가자구! 판매가 시작되기 전에!"
2003702-38 = "안녕하세요!"
2003702-39 = "찾아주셔서 감사합니다만, 아직 영업시간이 아닙니다. 이따가 와 주시겠어요?"
2003702-40 = "아, 괜찮아, 괜찮아. 우리는 일반 손님이 아니거든."
2003702-41 = "나는 파크의 라이프가드고, 이쪽은 샬레의 선, 아니 식품 위생 단속 감찰관이야."
2003702-42 = "영업 전에 식품의 상태를 점검하러 왔어."
2003702-43 = "아! 그러셨군요! 그런 거라면 당연히 협조해야죠!"
2003702-44 = "그럼 시식을 부탁해도 될까?"
2003702-45 = "아, 그럼요! 오늘부터 판매 예정인 신작 도넛을 맛보는 건 어떠신가요?"
2003702-46 = "얘기가 빨라서 좋은걸."
2003702-50 = "그럼 사양하지 않고 맛보도록 할까."
2003702-52 = "네, 여기 있습니다."
2003702-53 = "우리 가게의 야심작……."
2003702-62 = "<오이 도넛>!"
2003702-63 = "싱싱한 오이가 무려 한 개 통째로 들어간 도넛이랍니다!"
2003702-64 = "뭐, 뭣?!"
2003702-69 = "저명한 미식 단체의 한 회원으로부터 상당한 호평을 들었으니까요!"
2003702-70 = "여기 민트 와사비 소스를 찍어 드시면 더욱 맛있게 먹을 수 있답니다!"
2003702-71 = "[s5] (어떤 맛일지 전혀 모르겠어……!)\n[s6] (어떤 맛일지 상상하고 싶지 않아……!)"
2003702-74 = "저, 그, 그게, 이거, 꼭 먹어야 해?"
2003702-75 = "조금 취향에 안 맞달까……취향에 맞는 사람이 있는지 오히려 궁금하달까……!"
2003702-76 = "아무튼 시식 대상으로는 조금 부적합한 듯한……!"
2003702-77 = "[s] \"제대로 일해야지, 후부키.\""
2003702-81 = "[ns] \"파크 이용객들의 안전과 즐거움, 그리고 건전한 식음 문화를 위해서……!\""
2003702-82 = "자, 어서 맛봐 주세요!"
2003702-84 = "특별히 오이도 큰 녀석으로 골라 넣었으니까요!"
2003702-86 = "히, 히익! 그렇게 큰 건 안 돼앳……!"
2003702-88 = "(이후, 후부키는 오이 도넛을 끝까지 먹어 치웠다.)"
2003702-89 = "(……다 먹고 난 후부키는 금방이라도 울 것 같은 표정이었다.)"
