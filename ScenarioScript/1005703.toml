[translation]
1005703-1 = "결과만큼이나 과정도 중요하죠."
1005703-3 = "자~ 쌉니다, 싸요! 연말을 맞아 특별 할인합니다!"
1005703-4 = "한번 보고 가세요! 지금이라면 덤도 얹어 드립니다!"
1005703-5 = "무슨 물건을 보러 오셨어요? 뭐든지 다 있습니다! 싱싱해요!"
1005703-6 = "[s] \"여기는 대체……?\""
1005703-8 = "후후후."
1005703-9 = "상가 거리의 시장이죠."
1005703-10 = "이런 시기이니만큼 이곳도 소란스럽고 들떠 있네요."
1005703-11 = "[s] \"그건 알겠는데, 시장에는 왜 온 거야?\""
1005703-12 = "그것은……"
1005703-13 = "시장이야말로 맛의 전쟁터!"
1005703-14 = "……라고 할 수 있는 곳이기 때문입니다."
1005703-15 = "좋은 재료를 어떻게든 비싸게 팔려는 상인들."
1005703-16 = "그리고 그것을 싸게 사려는 요리사들과 식당 주인, 그 밖의 사람들……"
1005703-17 = "그 둘 사이의 진검승부가 벌어지는 장소!"
1005703-18 = "저는 그 현장을 직접 목격하러 나온 것이랍니다."
1005703-19 = "미식의 길을 걷는 사람으로서,"
1005703-20 = "미식이라는 결과가 이루어지는 과정 역시,"
1005703-21 = "알아 둘 필요가 있겠다는 생각이 들었기 때문이죠."
1005703-28 = "자, 자! 주목하세요! 오늘의 첫 번째 물건은 3kg 도미 한 마리입니다!"
1005703-29 = "살도 이렇게 붉고, 윤기도 이렇게나 살아 있습니다!"
1005703-30 = "이만한 물건은 어디 가서 쉽게 만나지 못할 겁니다!"
1005703-32 = "흐음…… 확실히 좋은 도미이긴 한데……"
1005703-33 = "가격이 어디까지 올라가려나? 한 마리에 너무 많은 돈을 쓰고 싶지 않은 걸."
1005703-34 = "사장님이 무조건 좋은 도미를 구해 오라고 하긴 했는데……"
1005703-36 = "그럼 시작하겠습니다! 육천 오백부터!"
1005703-37 = "칠천!"
1005703-38 = "그럼 난……. 칠천 이백!"
1005703-39 = "치, 칠천 삼백!"
1005703-40 = "허허, 시작부터 뜨겁구만. 칠천 오백!"
1005703-41 = "조금 아깝기는 하지만…… 칠천 칠백!"
1005703-42 = "사장님이 뭐라고 하려나…… 칠천 칠백 오십!"
1005703-44 = "보세요, 선생님. 뜨거워지기 시작했네요."
1005703-45 = "후후후. 최고를 차지하기 위한 경쟁,"
1005703-46 = "그 과정에서 생기는 뜨거운 열기……"
1005703-47 = "보고 있는 이쪽까지 끓어오르게 하는 무언가가 있군요."
1005703-48 = "[s] \"즐거워 보이네, 하루나.\""
1005703-49 = "네. 즐거워요. 누군가의 일상이, 누군가에게는 흔히 볼 수 없는 풍경이니까요."
1005703-50 = "그리고…… 이렇게 보고 있으려니, 왠지……"
1005703-51 = "[s] \"왠지?\""
1005703-52 = "구천!"
1005703-53 = "[s] \"하루나!?\""
1005703-55 = "허어, 아가씨가 끼어드는군. 시작부터 강하게 나오는데?"
1005703-56 = "요리사의 명예를 걸고, 쉽게 물러설 수 없겠어."
1005703-57 = "하아…… 이거, 사장님을 직접 불러와야 하나……"
1005703-58 = "구천 오백으로!"
1005703-59 = "구천 팔백!"
1005703-60 = "일만!"
1005703-65 = "(그 뒤로, 경매는 순식간에 뜨거워졌다.)"
1005703-66 = "(최종 승자는…… 놀랍게도 하루나였다.)"
1005703-67 = "(가격은, 말하지 않기로 하자.)"
1005703-72 = "후후. 후후후후."
1005703-73 = "[s] \"괜찮겠어……?\""
1005703-74 = "무슨 말씀을."
1005703-75 = "미식에 대한 탐구와 투자라면, 이 정도는 오히려 싼 편에 속한답니다?"
1005703-76 = "이제 이 도미를 어떻게 하느냐의 문제인데……"
1005703-77 = "선생님? 제가 아는 식당에 이 도미로 오마카세를 부탁하고 싶은데."
1005703-78 = "함께 해 주실 거죠?"
1005703-86 = "기다리셨습니다. 도미 죽입니다."
1005703-87 = "어머나, 이건 또……"
1005703-92 = "도미 초밥과 도미 사시미입니다."
1005703-93 = "껍질 부분만 뜨거운 물에 살짝 데쳤습니다."
1005703-94 = "흐음, 흐음."
1005703-96 = "도미 튀김과 도미 후토마키입니다."
1005703-97 = "으흠."
1005703-99 = "도미 뼈와 볼살로 국물을 우려낸, 맑은 우동입니다."
1005703-100 = "잘 먹겠습니다."
1005703-102 = "디저트로, 건과일을 갈아 만든 아이스크림입니다."
1005703-106 = "네. 감사합니다."
1005703-109 = "어떠셨나요, 선생님?"
1005703-110 = "[s1] \"뭐가 뭔지 잘 모르겠지만……\"\n[s2] \"뭔가, 굉장했어.\""
1005703-113 = "그러셨나요?"
1005703-114 = "저는 그렇게 열을 올린 경매품 치고는,"
1005703-115 = "조금…… 평범했던 것 같았답니다."
1005703-116 = "[s3] \"그, 그럼 경매장으로 돌아가서 폭발시킬 거야?\"\n[s4] \"그, 그럼 식당을 테러할 거야?\""
1005703-119 = "아뇨, 아뇨. 일반적인 기준에서라면 괜찮은 편이기도 했고."
1005703-120 = "경매가 의외로 재미있었고,"
1005703-121 = "선생님께도 식사를 대접할 수 있었던 걸요."
1005703-122 = "[s] \"그렇다면 다행이네.\""
1005703-123 = "네. 그렇지만."
1005703-125 = "역시 궁극의 맛을 찾는 것은…… 쉽지 않은 것 같네요."
