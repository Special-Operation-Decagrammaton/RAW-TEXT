[translation]
1008406-1 = "반향"
1008406-7 = "헉, 헉……"
1008406-8 = "어째서, 갑자기…… 정상에 오르자는 말씀을 꺼내신 건가요."
1008406-9 = "정상까지 오르지 않아도, 좋은 소리는 충분히 녹음할 수 있는 데다가……"
1008406-10 = "산 정상은 바람도 세고, 수목도 적어서 잡음이 들어가기 쉬운데……"
1008406-11 = "[s] \"하지만 평소에 듣기 어려운 만큼, 가치가 더 크다고 말한 건 코타마잖아?\""
1008406-12 = "우으……"
1008406-13 = "설마 제가 한 말이 저를 옭아매는 족쇄가 될 줄은……"
1008406-14 = "[s1] \"조금만 더 힘내자.\"\n[s2] \"말 그대로, 정상이 머지않았으니까!\""
1008406-17 = "으읏……"
1008406-18 = "최근 부부장과 어울리더니 선생님이 나쁜 물이 들었습니다……"
1008406-27 = "도착…… 했습니다."
1008406-28 = "다리가 후들거려서, 더는 한 발짝도 움직일 수가……"
1008406-32 = "선생님……? 산 맞은편에 뭔가 신경 쓰이시는 것이라도 있나요?"
1008406-37 = "[ns] \"야호—\""
1008406-41 = "야호오오……"
1008406-43 = "[ns3] \"코타마, 방금 들었어?\"\n[ns4] \"산 맞은편에서 내 목소리가 들려오고 있어.\""
1008406-46 = "……그렇군요. 메아리 소리네요."
1008406-47 = "날씨가 추운 탓에 수풀이 적어서 그런지, 평소보다 메아리 소리도 더 크고 또렷하게 들리는 것 같습니다."
1008406-48 = "[s5] \"……뭔가 평소보다 의욕이 없어 보이네.\"\n[s6] \"혹시 산행으로 지쳐서 그래?\""
1008406-51 = "아뇨. 그 정도로 지친 것은 아닙니다만……"
1008406-52 = "사실, 저는 메아리 소리를 그리 좋아하지 않거든요."
1008406-53 = "[s] \"어째서?\""
1008406-54 = "……녹음에 방해가 되니까요."
1008406-58 = "메아리는 원본이 되는 소리가 본래의 음성이 벽에 반사되어 울려 퍼지는 현상으로, 보통은 소리가 난 직후에 대답하듯 반향을 일으키곤 합니다."
1008406-59 = "때문에 저처럼 전문적인 녹음 기기를 다루는 사람들은 메아리가 가능한 발생하지 않도록 환경을 통제하는 데 여러 가지 노력을 기울이지요."
1008406-60 = "하지만 아무것도 없는 공허에서 녹음을 하지 않는 한, 메아리는 무조건 발생하기 때문에 본래의 음성을 재현하는 데 여러 가지 방해를 끼칩니다."
1008406-61 = "지금도 그렇지만 좀 더 또렷한 선생님의 목소리를 녹음하고 싶었는데……"
1008406-62 = "[s] \"그게 마음에 들지 않았던 거구나……\""
1008406-64 = "[ns] \"그래도 듣다 보면 나름의 운치가 있어서 괜찮지 않아?\""
1008406-65 = "아뇨. 원본 목소리만 존재한다면 [ruby=메아리]에코[/ruby]는 얼마든지 재현할 수 있습니다."
1008406-66 = "메아리는 결국 원본 음성의 열화판에 불과하니까요."
1008406-67 = "어느 오래된 전승에 따르면 메아리는 산속에 사는 '코다마' 라는 나무 요괴의 목소리라는 설도 있는데……"
1008406-68 = "어릴 적에는 그 때문에 놀림을 당한 적도 있어서."
1008406-69 = "……정말 어떤 의미로든 좋아할 수가 없는 현상입니다."
1008406-70 = "[s] \"그래도 단순한 열화판이라고만 부를 수는 없지 않을까?\""
1008406-71 = "어째서인가요?"
1008406-72 = "원본의 파형을 불완전하게 따라 하는 것에 불과한 이 잡음에, 특별한 의미가 또 있나요?"
1008406-73 = "[s7] \"산에서 듣는 메아리와 동굴에서 듣는 메아리가 다른 것처럼……\"\n[s8] \"메아리에는 소리를 전달하는 매질의 성질도 담겨 있으니까.\""
1008406-76 = "[ns] \"결국 울리지 않는 원래의 소리라는 건 존재하지 않을지도 몰라.\""
1008406-80 = "……궤변이군요."
1008406-81 = "선생님께서 그렇게 말씀하신다 하더라도 메아리를 좋아할 수는 없습니다."
1008406-82 = "하지만……"
1008406-89 = "야호—"
1008406-93 = "야호오오……"
1008406-97 = "……선생님의 목소리가 담긴 메아리라면, 다른 의미로 가치가 있을지도 모르겠군요."
1008406-98 = "물론 선생님의 목소리라면 다소의 잡음이 섞이더라도 언제나 유의미한 가치가 있습니다만."
1008406-99 = "산의 메아리를 통해 듣는 선생님의 목소리는 '코타마'의 목소리가 섞인 선생님의 목소리인 셈이니까요."
1008406-105 = "선생님, 괜찮으시다면 함께 산 반대편을 향해 함성을 지르지 않으시겠어요?"
1008406-106 = "이 장소에서만 들을 수 있는…… 선생님과 제 목소리가 섞여 자아내는 특유의 화음을."
1008406-107 = "느긋하게 감상하고 싶어요."
1008406-109 = "(이후, 코타마와 함께 정상에서 즐겁게 소리를 지른 뒤에 산을 내려왔다.)"
