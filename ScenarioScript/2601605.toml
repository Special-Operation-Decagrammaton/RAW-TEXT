[translation]
2601605-1 = "จากการสำรวจล่าสุด"
2601605-2 = "ว่าแล้วเชียว คำตอบอยู่ที่ชายหาดนี่เองค่ะ!"
2601605-3 = "หัวใจที่พองโต! แสงแดดที่แผดเผาจนมึนหัว! และทะเลแสนเดนเจอรัส!"
2601605-4 = "ถ้าจะเปรียบ ก็เป็นบลูโอเชียนเลยค่ะ!"
2601605-5 = "[s1] \"เป็นบลูโอเชียนอย่างที่ว่าเลยนะ\"\n[s2] \"ถึงไม่มีเรื่องให้เขียนข่าว ก็ถือว่ามาพักสักหน่อยแล้วกัน!\""
2601605-8 = "ดีเลยค่ะ! หวังว่าวันนี้จะได้เรื่องไปเขียนสกู๊ปพิเศษเยอะๆ นะคะ!"
2601605-9 = "งั้นก็ออกปฏิบัติการค่า!"
2601605-10 = ""
2601605-12 = ""
2601605-14 = ""
2601605-15 = ""
2601605-16 = "ไหนๆๆ! จะมีอะไรเกิดขึ้นบ้างน้า!"
2601605-17 = ""
2601605-19 = ""
2601605-20 = ""
2601605-21 = "โห น่าจะใหญ่ที่สุดเท่าที่เคยเห็นมาเลยนะ"
2601605-22 = "สุดยอดเลยนะเนี่ย? เพิ่งเคยจับของจริงเป็นครั้งแรกเลย"
2601605-23 = "อ๊ะ! มีแววว่าจะได้สกู๊ปพิเศษ!"
2601605-24 = ""
2601605-25 = "สวัสดีค่ะ! ฉันกำลังเก็บข้อมูลให้ <แพนเดโมเนียม โซไซตี้รายสัปดาห์> อยู่ค่ะ! ขอเวลาสักครู่ได้มั้ยคะ?!"
2601605-26 = "เอ๊ะ? เก็บข้อมูลเหรอ? ก็ได้อยู่หรอก..."
2601605-27 = "<แพนเดโมเนียม โซไซตี้รายสัปดาห์>? อ๋อ เล่มที่เพื่อนฉันเอาไว้รองหม้อที่บ้านนี่เอง"
2601605-28 = "โอ้ว! คุ้มจริงๆ ที่เปลี่ยนเป็นวัสดุทนความร้อนตามความเห็นของผู้อ่านค่ะ!"
2601605-29 = "เห็นมารวมตัวกันดูอะไรอยู่ ดูอะไรกันเหรอคะ?! มีอะไรน่าสนใจเหรอคะ?"
2601605-30 = "อ๋อ อื้ม นี่ไง"
2601605-31 = "ทุ่นระเบิดลอยมาเกยหาดน่ะ"
2601605-32 = ""
2601605-34 = ""
2601605-35 = "[ns] \"ทุ่นระเบิด?! ที่มันระเบิดได้น่ะเหรอ?!!\""
2601605-36 = "ตกใจหมดเลย มีทุ่นระเบิดที่ไม่ระเบิดด้วยเหรอ?"
2601605-37 = "แต่อันนี้ดูเหมือนจะเป็นของไม่ได้มาตรฐานนะ"
2601605-38 = ""
2601605-40 = ""
2601605-41 = "[ns] \"แบบนี้ก็น่าจะเป็นสกู๊ปพิเศษได้แล้วไม่ใช่เหรอ?\""
2601605-42 = "อืม ยังไม่ค่อยโดนเท่าไรค่ะ"
2601605-43 = "ยังไม่น่าเอาไปเขียนข่าวได้..."
2601605-44 = "ไม่ใช่หรอกน่า บอกแล้วไงว่านี่ไม่ใช่ของไม่ได้มาตรฐาน"
2601605-45 = ""
2601605-47 = ""
2601605-48 = "แต่ดูสิ ไม่เห็นมันจะระเบิดเลย? ถ้าระเบิดได้ก็คงระเบิดไปนานแล้วละ"
2601605-49 = "ทุ่นระเบิดอันใหญ่ขนาดนี้ แค่เอาสต็อกปืนตี มันจะไประเบิดได้ยังไง?"
2601605-50 = "หมดสนุกเลยค่ะ จะเอาทุ่นระเบิดที่พบได้ทั่วไปตามชายหาดมาเขียนเป็นบทความพิเศษของ <แพนเดโมเนียม โซไซตี้รายสัปดาห์> ก็ไม่ได้ด้วย"
2601605-51 = "เรื่องแค่นี้น่ะ เอาไปโพสต์ที่ไหนแล้วได้สัก 10 ไลก์ ก็ถือว่าดีแล้วมั้งคะ?"
2601605-52 = "ไปหาเรื่องอื่นกันดีกว่าค่ะ..."
2601605-53 = "[s] \"อะ... อื้ม...!\""
2601605-55 = "แถวนี้จะมีอะไรน่าสนใจบ้างมั้ยน้า"
2601605-56 = ""
2601605-58 = ""
2601605-59 = "อ๊ะ ดูเหมือนทุ่นระเบิดเมื่อกี้จะไม่ได้เป็นของไม่ได้มาตรฐานจริงๆ ด้วยค่ะ"
2601605-60 = "[s] \"สุดท้ายก็ระเบิดจนได้เหรอ?!\""
2601605-61 = "ก็มันถูกสร้างมาให้ระเบิดนี่คะ?"
2601605-62 = "ตรงนี้ก็มีคนอยู่เต็มเลยเหมือนกันค่ะ..."
2601605-63 = ""
2601605-64 = "ตรงนี้เขตพวกเรานะ! ไสหัวไปเลย ยัยหมวกกันน็อก!"
2601605-65 = "ฝันไปเถอะ! อย่ามาเล่นลูกไม้ตื้นๆ หน่อยเลย!"
2601605-67 = "พวกเรา! ผลักยัยพวกนี้ลงทะเลให้หมด!"
2601605-69 = ""
2601605-73 = "[ns3] \"ยะ... ยกพวกตีกันแล้ว!!!\"\n[ns4] \"เกือบจะเป็นสกู๊ปพิเศษได้เลย... แต่ต้องไปห้ามก่อน!\""
2601605-76 = "ไม่โดนสุดๆ เลยค่ะ"
2601605-77 = "ที่เกเฮนน่า คนตีกันบ่อยกว่าตัดเล็บอีกนี่คะ"
2601605-78 = "อ่าา... ไม่มี... สกู๊ปพิเศษเลยแฮะ..."
2601605-79 = "[s] \"หงอยสุดๆ ไปเลยนะเนี่ย?!\""
2601605-80 = "เฮ้อ..."
2601605-82 = "(หลังจากนั้นทั้งสองก็เดินตระเวนอยู่อีกพักใหญ่...)"
2601605-83 = "(จิอากิหงอยไปเพราะไม่มีเรื่องให้เขียนสกู๊ปพิเศษ)"
2601605-86 = "โลกนี้ช่างว่างเปล่าจังนะคะ..."
2601605-87 = "แพนเดโมเนียม โซไซตี้รายสัปดาห์ที่ไม่มีสกู๊ปพิเศษ ก็คงไร้ความหมายเหมือนเสียงคลื่นนี่ละค่ะ..."
2601605-88 = "อะฮ่าฮ่าฮ่าฮ่า..."
2601605-89 = "[s] \"โลกยังไม่ได้ถล่มลงมาสักหน่อย!\""
2601605-90 = "อะฮ่าฮ่า! จริงๆ ก็ไม่ได้หนักหนาขนาดนั้นหรอกค่ะ"
2601605-91 = "แค่ไปไหนมาไหนกับรุ่นพี่มาโคโตะสัก 30 นาที ก็พอได้เรื่องมาเขียนข่าวแล้ว..."
2601605-92 = "ค่ะ..."
2601605-93 = ""
2601605-95 = ""
2601605-96 = "เอ๊ะ? เอ๋?!"
2601605-97 = "เจอสกู๊ปพิเศษแล้ว!!!!!!!!!"
2601605-98 = "ดูนี่สิคะ คุณครู!! สาหร่ายคอมบุยาวมากๆๆ เลยค่ะ!! มันถูกคลื่นซัดมาเกยหาดนี่เอง!"
2601605-99 = "ถ้ายาวขนาดนี้ ต้องทำลายสถิติเดิมได้แน่ๆ ค่ะ! อาจเป็นสถิติที่ยาวที่สุดในประวัติศาสตร์เกเฮนน่าเลย#nก็ได้!!"
2601605-100 = "[s] \"มันก็สุดยอดอยู่หรอก... แต่นี่เป็นสกู๊ปพิเศษเหรอ...?!\""
2601605-101 = "ผู้อ่านต้องชอบมากแน่ๆ ค่ะ! คุณครูเป็นคู่หูที่ดีที่สุดของฉันจริงๆ เลยค่ะ!"
2601605-102 = "เอาละๆ! ต้องเทียบขนาดกันด้วย ฉันจะนอนข้างๆ สาหร่ายคอมบุนะคะ! ใช้นี่ถ่ายให้หน่อยค่ะ!"
2601605-103 = "หนึ่ง สอง! คอมบุ!"
2601605-104 = ""
2601605-106 = ""
2601605-108 = "(คุณครูเห็นจิอากิมีความสุข และคิดว่าแค่นั้นก็ดีแล้ว)"
2601605-109 = "(หลังจากนั้นคุณครูก็กลับชาเล่ต์พร้อมกับจิอากิที่ตื่นเต้นดีใจสุดๆ)"
