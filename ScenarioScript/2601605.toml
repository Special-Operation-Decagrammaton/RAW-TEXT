2601605-88 = "Hah... Ahaha..."
2601605-89 = "[s] \"It's not the end of the world!\""
2601605-90 = "Yeah! I'm not even upset!"
2601605-91 = "If I spend even thirty minutes with Makoto, I'll usually end up with enough material for an article..."
2601605-92 = "...anyway...?"
2601605-93 = ""
2601605-95 = ""
2601605-96 = "Huh? HUHHH?!"
2601605-97 = "I found a scoop!"
