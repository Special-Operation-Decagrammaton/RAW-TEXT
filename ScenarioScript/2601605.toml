[translation]
2601605-1 = "最近の調査によると"
2601605-2 = "案の定、答えは浜辺にありましたか。"
2601605-3 = "弾む気持ち！眩しい太陽！そして、デンジャラスな海！"
2601605-4 = "まさに、ブルーオーシャンってやつですね！"
2601605-5 = "[s1] \"うん。本物のブルーオーシャンだね。\"\n[s2] \"ネタがなくても、気分転換として楽しもう！\""
2601605-8 = "よーし！今日はいっぱいスクープ見つけますよ！"
2601605-9 = "いざ、参りましょう！"
2601605-10 = ""
2601605-12 = ""
2601605-14 = ""
2601605-15 = ""
2601605-16 = "どれどれ！何かあるかなー？"
2601605-17 = ""
2601605-19 = ""
2601605-20 = ""
2601605-21 = "すげぇ、こんなデカいの初めて見たぞ。"
2601605-22 = "へー。実物ってこんな感じなんだー"
2601605-23 = "はっ！スクープのニオイが！"
2601605-24 = ""
2601605-25 = "すみませ～ん！「週刊万魔殿」です！ちょっと取材よろしいですか？"
2601605-26 = "取材？別にいいけど……。"
2601605-27 = "「週刊万魔殿」……？ああ、友達が鍋敷きに使ってたあれか。"
2601605-28 = "おお！読者の要望通り、耐熱紙に換えた甲斐がありますね！"
2601605-29 = "皆さん集まって何を見てるんですか？"
2601605-30 = "これだよ。"
2601605-31 = "機雷が浜辺まで流れてきたんだ。"
2601605-32 = ""
2601605-34 = ""
2601605-35 = "[ns] \"機雷！？爆発するあれ！？\""
2601605-36 = "い、いきなり大きい声出すなよ。当たり前だろ？"
2601605-37 = "でも、これは不良品みたいだな。"
2601605-38 = ""
2601605-40 = ""
2601605-41 = "[ns] \"これなら十分スクープになるんじゃない？\""
2601605-42 = "うーん、微妙ですね……。"
2601605-43 = "ネタとしてはあと一歩……いや二歩……。"
2601605-44 = "いや、不良品じゃないかもよ？"
2601605-45 = ""
2601605-47 = ""
2601605-48 = "でもほら、全然起爆しないじゃん。"
2601605-49 = "銃床で叩いたくらいじゃ、こんなデカいの爆発しないって。"
2601605-50 = "機雷くらい浜辺でよく見かけますし、特集記事にするにはちょっと……。"
2601605-51 = "いいねを10個くらいもらえたら御の字ってところでしょうか。"
2601605-52 = "他を探してみましょう……。"
2601605-53 = "[s] \"う、うん……！\""
2601605-55 = "ここには面白そうなものあるかなー？"
2601605-56 = ""
2601605-58 = ""
2601605-59 = "あ、さっきの機雷は不良品じゃなかったみたいですね。"
2601605-60 = "[s] \"結局爆発するの！？\""
2601605-61 = "まあ、元々爆発させるためのものですから。"
2601605-62 = "こっちにも人が集まっていますが……。"
2601605-63 = ""
2601605-64 = "どけ、てめえら！ここはうちらの縄張りだ！"
2601605-65 = "ふざけんな！先に来たのはこっちだぞ！"
2601605-67 = "お前ら！こいつら全員海に沈めてやれ！"
2601605-69 = ""
2601605-73 = "[ns3] \"け、喧嘩だ！\"\n[ns4] \"これならスクープ……っていうか止めないと！\""
2601605-76 = "うーむ……これも微妙ですねー"
2601605-77 = "喧嘩なんて、ゲヘナでは爪を切ることより日常茶飯事ですよ。"
2601605-78 = "ああ……スクープ……いずこに……。"
2601605-79 = "[s] \"ちょーローテンション！？\""
2601605-80 = "はあ……。"
2601605-82 = "（その後も辺りを見て回ったものの……）"
2601605-83 = "（スクープになりそうなものはなく、チアキのテンションは下がったままだった）"
2601605-86 = "虚しい……。"
2601605-87 = "スクープのない週刊万魔殿は、この波の音のように虚しい……。"
2601605-88 = "ハハ、アハハハ……。"
2601605-89 = "[s] \"ま、まだ散歩は終わってないから……！\""
2601605-90 = "あはは！本当はそこまで落ち込んでないので大丈夫ですよ。"
2601605-91 = "最終手段として、マコト先輩と30分くらい歩くと色んなネタが出てき……。"
2601605-92 = "ますし……？"
2601605-93 = ""
2601605-95 = ""
2601605-96 = "お、おお！？"
2601605-97 = "スクープ発見！！！"
2601605-98 = "見てください、先生！この昆布の長さ！！"
2601605-99 = "これは……ゲヘナ史上最長かも！！"
2601605-100 = "[s] \"すごいけど……スクープなの……？\""
2601605-101 = "読者の皆さん、大興奮間違いなしです！さっすが、先生は最高のパートナーです！"
2601605-102 = "昆布の隣に寝るので、写真撮ってください！#nこの圧倒的長さを読者に伝えたいんです！"
2601605-103 = "はい、こーんぶ！"
2601605-104 = ""
2601605-106 = ""
2601605-108 = "（チアキが喜んでいて何よりだった）"
2601605-109 = "（ハイテンションなチアキと一緒にシャーレに帰った）"
