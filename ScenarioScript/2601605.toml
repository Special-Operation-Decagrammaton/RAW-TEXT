[translation]
2601605-1 = "根據最近的調查"
2601605-2 = "果然，答案就在海邊呢！"
2601605-3 = "雀躍的心情！炫目的陽光！還有Dangerous的大海！"
2601605-4 = "打個比方，就是藍海呢！"
2601605-5 = "[s1] 「這的確是字面意義上的藍海。」\n[s2] 「就算沒有題材，就當作喘口氣吧！」"
2601605-8 = "好～！希望今天也有很多獨家新聞！"
2601605-9 = "那麼，出動～！"
2601605-10 = ""
2601605-12 = ""
2601605-14 = ""
2601605-15 = ""
2601605-16 = "哪裡哪裡哪裡！會發生什麼事呢～！"
2601605-17 = ""
2601605-19 = ""
2601605-20 = ""
2601605-21 = "哇，這好像是我看過最大的。"
2601605-22 = "太猛了吧？我還是第一次摸到實物。"
2601605-23 = "哈！獨家新聞的預感！"
2601605-24 = ""
2601605-25 = "您好～！我們是週刊萬魔殿，正在採訪中！可以打擾一下嗎！？"
2601605-26 = "咦？採訪？是沒關係啦……"
2601605-27 = "週刊萬魔殿？啊啊，就是朋友家拿來當鍋墊的那個啊。"
2601605-28 = "哦哦！照讀者意見換成耐熱材質果然值得呢！"
2601605-29 = "大家聚在一起是在看什麼呢！？有什麼好玩的東西嗎？"
2601605-30 = "啊，嗯。這個。"
2601605-31 = "水雷漂到海邊來了。"
2601605-32 = ""
2601605-34 = ""
2601605-35 = "[ns] 「水雷！？會爆炸的那個！？」"
2601605-36 = "嚇我一跳，難道有不會爆炸的水雷嗎？"
2601605-37 = "嗯，不過這個好像是瑕疵品。"
2601605-38 = ""
2601605-40 = ""
2601605-41 = "[ns] 「這樣應該就夠格當獨家新聞了吧？」"
2601605-42 = "唔嗯。很微～妙呢。"
2601605-43 = "還不到能當報導題材的程度……"
2601605-44 = "哎呀，我就說應該不是瑕疵品吧？"
2601605-45 = ""
2601605-47 = ""
2601605-48 = "你看，根本沒爆啊？要爆的話早就爆了吧。"
2601605-49 = "這麼大的東西，用槍托敲一敲哪會爆啊？"
2601605-50 = "真掃興。海邊常見的水雷，可不能當週刊萬魔殿的特輯呢。"
2601605-51 = "隨便發到哪裡，能拿到10個讚就算不錯了吧？"
2601605-52 = "去找找其他的吧……"
2601605-53 = "[s] 「嗯……嗯……！」"
2601605-55 = "這裡會不會有什麼好玩的呢～"
2601605-56 = ""
2601605-58 = ""
2601605-59 = "啊，看來剛才那個水雷果然不是瑕疵品呢。"
2601605-60 = "[s] 「結果還是爆炸了嗎！？」"
2601605-61 = "因為那本來就是做來爆炸的東西啊？"
2601605-62 = "這裡好像也聚集了很多人……"
2601605-63 = ""
2601605-64 = "這裡是我們的地盤！滾開啦你！"
2601605-65 = "少開玩笑了！別在那邊耍花招！"
2601605-67 = "大家上！把他們全部推進海裡！"
2601605-69 = ""
2601605-73 = "[ns3] 「打，打群架了！！！」\n[ns4] 「幾乎是獨家新聞等級……不過還是得阻止才行！」"
2601605-76 = "超級微～妙～"
2601605-77 = "打架這種事，在格黑娜可是比剪指甲還要常見呢。"
2601605-78 = "啊啊……獨家新聞……一個都沒有啊……"
2601605-79 = "[s] 「超級低潮！？」"
2601605-80 = "唉……"
2601605-82 = "（之後雖然又逛了好一陣子……）"
2601605-83 = "（千秋因為找不到獨家新聞而無精打采）"
2601605-86 = "世界真是空虛啊……"
2601605-87 = "沒有任何獨家新聞的週刊萬魔殿，就跟這陣海浪聲一樣空虛吧……"
2601605-88 = "啊哈哈哈哈……"
2601605-89 = "[s] 「又不是世界末日！」"
2601605-90 = "啊哈哈！其實沒有那麼嚴重啦。"
2601605-91 = "就算只跟真琴前輩一起走個30分鐘，也能寫出不少報導……"
2601605-92 = "的說……？"
2601605-93 = ""
2601605-95 = ""
2601605-96 = "咦？咦咦！？"
2601605-97 = "發現獨家新聞！！！！！！！！！"
2601605-98 = "老師請看這個！！超級超級超級長的昆布！！是被海浪沖上來的呢！"
2601605-99 = "這樣肯定打破之前的紀錄了！說不定是格黑娜史上最長的紀錄！！"
2601605-100 = "[s] 「是很厲害沒錯……但這是獨家新聞……！？」"
2601605-101 = "讀者們一定會超級喜歡的！老師果然是我最棒的搭檔！"
2601605-102 = "來來！為了比較大小，我躺到昆布旁邊！請用這個幫我拍！"
2601605-103 = "一、二！昆～布～！"
2601605-104 = ""
2601605-106 = ""
2601605-108 = "（既然千秋覺得開心，這樣似乎也不錯）"
2601605-109 = "（和興奮不已的千秋一起回到了夏萊）"
