[translation]
2601605-1 = "최근 조사에 의하면,"
2601605-2 = "역시, 답은 해변에 있었네요!"
2601605-3 = "들뜨는 마음! 어지러운 햇볕! 그리고 댄저러스한 바다!"
2601605-4 = "비유하자면, 블루오션이네요!"
2601605-5 = "[s1] \"말 그대로 블루오션이긴 하지.\"\n[s2] \"소재가 없어도 한숨 돌리는 셈 치자!\""
2601605-8 = "좋아요-! 오늘도 특종이 많으면 좋겠네요!"
2601605-9 = "그러면, 출동입니다아-!"
2601605-16 = "어디 어디 어디! 무슨 일이 일어나고 있으려나아-!"
2601605-21 = "와, 여태껏 본 것 중에서 제일 큰 것 같은데."
2601605-22 = "대박인데? 실물 만져보는 건 처음이야."
2601605-23 = "핫! 특종의 예감!"
2601605-25 = "안녕하세요-! <주간 만마전> 취재 중인데요! 잠시 괜찮을까요?!"
2601605-26 = "엥? 취재? 뭐 괜찮긴 한데……."
2601605-27 = "<주간 만마전>? 아아, 친구 집에서 냄비 받침으로 쓰던 그거구나."
2601605-28 = "오오! 독자 의견대로 열에 강한 재질로 바꾼 보람이 있군요!"
2601605-29 = "다 같이 모여서 뭔가 보시던데, 뭔가요?! 재밌는 거라도 있나요?"
2601605-30 = "아, 으응. 이거."
2601605-31 = "기뢰가 해변에 떠내려왔어."
2601605-35 = "[ns] \"기뢰?! 폭발하는 그거?!!\""
2601605-36 = "깜짝이야, 안 터지는 기뢰도 있어?"
2601605-37 = "뭐, 이건 불량품인 것 같지만."
2601605-41 = "[ns] \"이 정도면 충분히 특종 아닐까?\""
2601605-42 = "으음. 미-묘하네요."
2601605-43 = "기삿감까지는 아닌 걸로......."
2601605-44 = "에이, 불량품은 아닐 거라니까?"
2601605-48 = "봐봐, 안 터지잖아? 터질 거면 진작에 터졌겠지."
2601605-49 = "이렇게 커다란 물건이 고작 개머리판으로 때린다고 터지겠냐?"
2601605-50 = "김새네요. 바닷가에 흔해빠진 기뢰를 <주간 만마전> 특집으로 쓸 수는 없으니까요."
2601605-51 = "어디 올려서 좋아요 10개라도 받으면 선방한 정도?"
2601605-52 = "다른 걸 찾아보죠……."
2601605-53 = "[s] \"으…… 으응……!\""
2601605-55 = "여기에는 뭔가 재미있는 게 있으려나-"
2601605-59 = "아, 역시 아까 그 기뢰 불량품은 아니었나 보네요."
2601605-60 = "[s] \"결국 터진 건가?!\""
2601605-61 = "터지라고 만든 물건이니까요?"
2601605-62 = "여기도 뭔가 사람들이 잔뜩 있긴 한데……."
2601605-64 = "여기는 우리 구역이라고! 꺼져 임마!"
2601605-65 = "놀고 있네! 어디서 되도 않는 수작이야!"
2601605-67 = "얘들아! 다 바다로 밀어버려라!"
2601605-73 = "[ns3] \"패, 패싸움이다!!!\"\n[ns4] \"거의 특종급…… 이지만 말려야겠어!\""
2601605-76 = "슈퍼 미-묘-"
2601605-77 = "싸우는 건 게헨나에선 손톱을 깎는 것보다 자주 하는 거니까 말이죠."
2601605-78 = "아아…… 특종이…… 없구나아……."
2601605-79 = "[s] \"슈퍼 로우텐션?!\""
2601605-80 = "하아……."
2601605-82 = "(그 후로도 한참을 돌아다녔지만…….)"
2601605-83 = "(치아키는 특종이 없어서 축 처져있었다.)"
2601605-86 = "세상은 공허하군요……."
2601605-87 = "아무 특종 없는 주간 만마전은, 이 파도 소리처럼 부질없을 테죠……."
2601605-88 = "아하하하하……."
2601605-89 = "[s] \"세상이 무너진 게 아니니까!\""
2601605-90 = "아하하! 사실 그렇게 심각한 건 아니에요."
2601605-91 = "마코토 선배하고 30분만 같이 다녀도, 어지간한 기사는 나오긴 하니……."
2601605-92 = "……까……?"
2601605-96 = "어? 어어?!"
2601605-97 = "특종 발견!!!!!!!!!"
2601605-98 = "이거 보세요 선생님!! 무지무지무지 긴 다시마예요!! 파도에 떠밀려왔네요!"
2601605-99 = "이 정도면 이전 기록은 분명 깼을 거예요! 게헨나 역대 최대 기록일지도!!"
2601605-100 = "[s] \"대단하긴 한데…… 특종……?!\""
2601605-101 = "독자들이 엄청나게 좋아할 거예요! 역시, 선생님은 제 최고의 파트너예요!"
2601605-102 = "자자! 크기 비교를 해야 하니까 다시마 옆에 누울게요! 이걸로 찍어주세요!"
2601605-103 = "하나, 둘! 다시-마-!"
2601605-108 = "(치아키가 행복하니, 그걸로 좋다고 생각했다.)"
2601605-109 = "(잔뜩 신난 치아키와 함께 샬레로 돌아왔다.)"
