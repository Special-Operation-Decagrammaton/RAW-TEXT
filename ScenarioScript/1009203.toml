[translation]
1009203-1 = "디자인 조언?"
1009203-4 = "(요시미의 연락을 받고 기다리고 있다던 카페로 향했다.)"
1009203-9 = "아, 선생님. 여기야, 여기!"
1009203-15 = "(가게 한쪽 구석에서, 디저트와 연습장을 잔뜩 쌓아 두고 있던 요시미가 보였다.)"
1009203-23 = "그래도 어떻게 바로 나왔네?"
1009203-24 = "오늘도 딱히 할 일이 없으신가 봐?"
1009203-28 = "……맞다고?"
1009203-29 = "아니. 그렇게 즉답해 버리면 이쪽이 무안해지는데……."
1009203-33 = "아, 아무튼! 지금 중요한 건 그게 아니니까 말이야."
1009203-34 = "아무래도 이 디자인이라는 게 참 어렵단 말이지. 혼자 하는 데에는 한계가 있는 거 같아."
1009203-35 = "그래서 선생님의 도움을 좀 구하려고. 괜찮지?"
1009203-39 = "[ns1] \"아이콘 디자인 쪽은 잘 모르지만…….\"\n[ns2] \"밴드 마크 그리는 거야?\""
1009203-40 = "……응?"
1009203-41 = "갑자기 웬 아이콘?"
1009203-42 = "……마크?"
1009203-43 = "……무슨 마크?"
1009203-44 = "……?"
1009203-45 = "밴드 이미지 디자인 때문에 부른 거 아니었냐고?"
1009203-46 = "……아니? 그건 나중에 할 건데?"
1009203-50 = "[ns3] \"……? 밴드 마크가 아니라고?\"\n[ns4] \"그럼 지금 하고 계신 건 뭐죠?\""
1009203-55 = "어……."
1009203-56 = "그야 당연히 이건데……."
1009203-61 = "[ns] \"………….\""
1009203-65 = "…………?"
1009203-66 = "[ns5] \"그러니까 그 '디자인'이라는 게…….\"\n[ns6] \"본인의 사인 연습이신……?\""
1009203-69 = "뭐지? 반응이 이상한데? 무슨 문제라도 있는 거야?"
1009203-70 = "……뭐?"
1009203-71 = "왜 갑자기 사인 연습 같은 걸 하는 거냐고? 그걸 진짜 몰라서 묻는 거야?"
1009203-72 = "아니. 당연하잖아? ……뭐지? 내가 잘못된 건가, 이거?"
1009203-76 = "들어봐, 선생님. 우리 이제 밴드 하지?"
1009203-77 = "오프닝 행사로 축하 공연하기로 했지? 그럼 엄청 많은 사람들이 본다는 거지?"
1009203-78 = "거기서 연주가 잘 되면 당연히 유명 인사가 될 거잖아?"
1009203-79 = "그때 가서 사인 하나 없으면 이래저래 곤란할 거 아냐. 안 그래? 내 말이 틀려?"
1009203-83 = "……틀……려? 아, 안 틀리지? 맞지?"
1009203-84 = "……맞겠지……?"
1009203-85 = "[s7] \"그야 뭐, 큰 꿈은 늘 좋지만…….\"\n[s8] \"비약이 좀 우주로 날아가긴 했지.\""
1009203-88 = "으, 으음……? 그런……가……?"
1009203-92 = "아니, 잠깐만. 아……."
1009203-93 = "그, 그……. 뭔가 갑자기 좀 얼굴이 뜨거워지기 시작하는 느낌인데……."
1009203-94 = "……창피해. 이게 뭐야……."
1009203-98 = "……잠깐. 선생님."
1009203-99 = "아무 소리 하지 마. 그대로 입 다물어. 절대. 절대 입 열지 마."
1009203-100 = "[s9] \"크큭. 이건……. 각인가?\"\n[s10] \"너 이러는 거 다른 애들도 아니?\""
1009203-103 = "입 열지 말라고 했잖아!!!!! 조용히 하라고!!!!"
1009203-104 = "아, 진짜 아!!!"
1009203-108 = "잠깐만, 그……. 하……."
1009203-113 = "[ns] 웃는다."
1009203-118 = "웃지 말라고!!!! 조용히 하라고 했어!!! 가만히!!!"
1009203-121 = "음……. 으음……."
1009203-122 = "[s11] \"숨길 것까지야. 귀여웠는데.\"\n[s12] \"농담이야. 진짜 잘 될 수도 있잖아.\""
1009203-125 = "됐거든!! 쓸데없는 빈말 아주 감사합니다요!! 네!!"
1009203-126 = "나는 이렇게 김칫국부터 마시는 게 아주 삶의 습관입니다요, 항상 그래 왔지! 그래!"
1009203-127 = "선생님도 맨날 봐 왔으니까 잘 알 거 아냐!! 아주 그냥 인생이 망상이다, 망상이야!!"
1009203-131 = "……? 응? 뭐라고?"
1009203-132 = "한 장 달라고……? 뭘……."
1009203-133 = "……사인?"
1009203-134 = "……뭐지? 지금 시비 거는 거야?"
1009203-135 = "[s13] \"사실 진짜 미래는 모르는 거니까.\"\n[s14] \"진짜 나중 가면 구하기 힘들 수 있잖아.\""
1009203-138 = "크, 크윽……. 또 시작인가……."
1009203-139 = "또 그렇게 뻔하면서도 치명적인 말을……."
1009203-140 = "하여간 말은 잘해요, 진짜. 그런 소리 하면 내가 기분이 풀릴 거라고 생각하는 모양이지?"
1009203-144 = "……약간은 풀린 거 같기도 하네."
1009203-148 = "아으으으으~!! 짜증 나!!"
1009203-149 = "왜 풀리는데, 나는 또!!"
1009203-150 = "……에휴. 됐다, 뭐. 어차피 못 이기는 건 맨날 알고 있던 일이니까. 새삼스러울 거 없겠지."
1009203-154 = "그럼 잘 된 거 한 장 다시 찾아서……."
1009203-159 = "실례합니다, 고객님. 주문하신 메뉴들 영수증 나왔습니다."
1009203-160 = "괜찮으시다면 여기에 사인 좀 부탁드릴 수 있을까요?"
1009203-164 = "아. 네. 잠시만요."
1009203-168 = "사인, 사인을……."
1009203-173 = "……?"
1009203-179 = "……아. 실수했다."
1009203-180 = "…………?"
1009203-184 = "[ns15] \"여기서 설마 했던 그 전개!!\"\n[ns16] \"영수증에 그런 사인을……!\""
1009203-188 = "[ns] \"와, 사인 진짜 멋지시네요!\""
1009203-192 = "아니, 아니 잠깐만! 이건……!!"
1009203-193 = "잠깐! 안 돼!!!"
1009203-194 = "하지 마, 진짜 하지 마. 하지 말라면 하지 마."
1009203-195 = "나 진지해. 죽는다. 진짜 가만 안 둬!! 진심이야!!!"
1009203-197 = "[ns17] \"역시 미래의 유명인!!\"\n[ns18] \"이 영수증은 프리미엄이 될 거야!!\""
1009203-200 = "아아아아아아아아아악-!!"
1009203-214 = "(……난동 부리지 말라며 점원에게 혼났다.)"
