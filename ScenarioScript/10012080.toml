[translation]
10012080-1 = "제8화;중장비에는 중장비로"
10012080-4 = "하아, 하아……. 저 친구들도 참 대단하네……. 근성이 있어."
10012080-5 = "여름 휴양……. 이렇게까지 빡빡한 일정을 생각하고 온 건 아닌데 말이지."
10012080-6 = "[s1] \"호시노……!\"\n[s2] \"괜찮아? 혹시 다쳤어?\""
10012080-7 = "으헤. 신경 써 주는 거야? 선생? 선생의 걱정을 받다니, 그건 좀 괜찮을 지도……."
10012080-8 = "으헤. 신경 써 주는 거야? 선생? 선생의 걱정을 받다니, 그건 좀 괜찮을 지도……."
10012080-9 = "……그래도 걱정할 거 없어. 아직까진 거뜬하니까."
10012080-10 = "게다가……."
10012080-13 = "후후후……. 이제야 겨우 구해 드릴 수 있게 됐군요, 선생님……."
10012080-14 = "조금만 기다려 주세요, 선생님. 저 또한 이 상황이 너무나 괴롭지만……."
10012080-15 = "곧 저 영악한 여우들로부터 구해 드리겠사옵니다!!"
10012080-16 = "상냥하신 선생님을 유혹해서 자신들 멋대로 이용하려 하다니, 절대로 용서받을 수 없는 일!"
10012080-17 = "이 와카모가 직접, 저들을 모두 빠짐없이 계도하도록 하겠습니다!!"
10012080-20 = "……저런 상태니까 말이지."
10012080-21 = "어쩔 수 없네-. 여기서는 내가 좀 더 힘을 내 보도록 할까~? 으헤-."
10012080-22 = "……응?"
10012080-23 = "뭐라고?"
10012080-24 = "……아."
10012080-25 = "상황이 이런데도 묘하게 여유가 있는 거 같다고?"
10012080-26 = "……선생. 나는 딱히 여기서 저 친구들은 모두 내가 쓰러뜨려야 한다거나 그런 생각을 하는 게 아니라고."
10012080-27 = "예전이었으면 모를까……."
10012080-28 = "지금은 그냥 시간을 끌며 버티는 것 정도로도 충분하다고 생각하게 됐으니까 말이야."
10012080-29 = "……이제 슬슬 올 때가 됐다고 생각하는데 말이지."
10012080-34 = "[ns3] \"헬기 소리…….\"\n[ns4] \"……아아.\""
10012080-35 = "쨔안-☆"
10012080-36 = "쨔안-☆"
10012080-37 = "……아아."
10012080-38 = "……봐. 그렇지?"
10012080-39 = "[s5] \"응.\"\n[s6] \"호시노의 말대로야.\""
10012080-45 = "다행히 늦지 않았던 거 같네요! 적절한 타이밍이에요!"
10012080-48 = "용서 못 해! 완전 열 받았다고!!"
10012080-51 = "타깃 설정 완료. 간다."
10012080-53 = "응응! 혼날 시간이에요!!"
10012080-61 = "전탄 발사~☆"
