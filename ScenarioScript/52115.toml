[translation]
52115-1 = "제11화;피안으로 가는 길"
52115-2 = "에비스 분교 외곽, 설원"
52115-4 = "……그래서. 그 녀석들의 본거지를 알아냈다는 게 사실이야?"
52115-9 = "아, 아까 말하지 않았던가?"
52115-11 = "말하지 않았어."
52115-12 = "말씀도 없이 갑자기 달려가셔서 무작정 따라 나왔사와요……"
52115-17 = "미안, 미안. 이매망량이나 황혼은 어둠을 먹고 강해진다는 말도 있으니까……"
52115-18 = "해가 지기 전에 서두르려다보니 몸이 급해졌나봐."
52115-19 = "화조풍월부의 본거지……? 그런 장소가 이 근처에 있다는 말이야?"
52115-20 = "하지만 슈로 양은 그에 대해 아무 말도 하지 않았는걸요? 그 장소를 어떻게 알고 계신 건가요?"
52115-21 = "그건 아침에도 말했지만, 이 츠구모가미의 잔재를 통해 확신할 수 있었어."
52115-26 = "여기, 우산의 손잡이에 새겨진 표식이 보이지?"
52115-27 = "전에 마을 근처에 츠구모가미가 나타난다는 소문을 들었을 때부터, 나는 일부러 오래되고 낡은 물건들에 특수한 표식을 새겨 마을 주변의 출입로에 방치해 놓았어."
52115-28 = "츠구모가미가 화조풍월부의 괴서에 의해 태어난다면, 그 재료가 된 낡은 물건에 새겨진 표식을 확인하는 것만으로도 화조풍월부가 어디서 왔는지 추측할 수 있겠지."
52115-30 = "과연, 그런 방법이 있었나……"
52115-32 = "적의 공격에 대처하면서도 그런 기책을 떠올리시다니, 역시 백화요란의 부장다우셔요!"
52115-33 = "그럼 우리는 지금 이 표식이 가리키는 방향으로 가고 있는 거야?"
52115-35 = "응. 이 표식이 새겨진 우산은 마을의 북쪽 출입로에 놔둔 것이거든."
52115-36 = "마을의 북쪽 출입로 너머로는 이처럼 척박한 설원이 펼쳐져 있을 뿐, 특별한 건물이나 구조물은 없는 것 같지만……"
52115-37 = "주민들의 말에 의하면 한나절 정도 떨어진 거리에 오래된 저택 하나가 있다고 했어."
52115-38 = "이 북쪽 설원 너머에 있는 저택이라면…… <피안의 저택>을 말씀하시는 것이군요."
52115-43 = "……<피안의 저택>? 어쩐지 으스스한 이름이네."
52115-44 = "네. 기록에 의하면 먼 옛날 이 일대의 영지를 다스리던 가문의 저택이라고 하던데, 현재는 찾는 사람이 아무도 없어서 수십 년 넘게 폐가처럼 방치되어 있었거든요."
52115-45 = "저도 직접 가본 적은 없어서 어떤 형태로 방치되었는지 알지는 못했는데, 설마……"
52115-46 = "음, 화조풍월부의 부원들이 그곳에서 머무르고 있을 가능성이 높지."
52115-47 = "어쩌면 이 근방에서 나타났다는 백물어도 그곳에 있을지 모르고."
52115-48 = "[s1] \"하지만 이렇게 갑자기 찾아가도 괜찮을까?\"\n[s2] \"어쩌면 함정이 있을지도 모르고……\""
52115-54 = "괜찮아! 옛말에 쇠뿔도 단김에 빼라는 말도 있잖아?"
52115-55 = "녀석들의 꼬리를 밟은 시점에서 몰아쳐야지, 우물쭈물하다간 또다시 놓치고 말거라고."
52115-56 = "게다가 지금의 백화요란에는 최강의 전력인 아야메 부장도 합류했으니까!"
52115-57 = "맞사와요! 다시 한번 무적의 백화요란 전설을 이 자리에서 실현하는 것이어요!"
52115-58 = "하지만 백물어는 단순한 방법으로 상대할 수 없을텐데요……"
52115-62 = "모두 벌써 지난번의 전투를 잊은 거야? 백물어에게는 평범한 사격이 통하지 않는다고."
52115-63 = "괴서에서 비롯된 괴담을 쓰러트릴 수 있는 건, 대 예언자인 쿠즈노하 님이 부여한 자격을 인정받은 자뿐……"
52115-64 = "심한 소리를 하고 싶지는 않지만, 아무리 다재다능한 아야메 부장이라 하더라도 백련의 힘을 제대로 사용할 수 없다면 별 도움이 되지 않을 거야."
52115-65 = "그, 그렇진 않아. 아무리 나라도 해도 아야메에 비하면—"
52115-66 = "애초에, 우리가 여기에 오지 않았으면 부장은 어떻게 혼자서 백물어를 처리하려고 했던 거야?"
52115-68 = "글쎄……"
52115-69 = "괴서에서 비롯된 괴담이라면 몰라도, 괴서 그 자체나 괴서를 사용하는 부원을 상대하는 거라면 '어떻게든' 방법이 있을 거라고 생각했거든."
52115-70 = "어떻게든……? #n내가 아는 아야메 부장이 이렇게 대책 없이 전략을 짜는 사람이었던가?"
52115-71 = "그러게. 궁지에 몰리니 성격이 조금은 적극적으로 변했을지도 모르지."
52115-72 = "그리고 무엇보다…… 의지할 수 있는 친구인 나구사를 믿고 있었으니까."
52115-77 = "……나를?"
52115-78 = "지난밤, 백련의 힘을 자유롭게 사용하던 나구사의 모습을 보고 깨달았어."
52115-79 = "대 예언자 쿠즈노하에게 인정받은 적법한 자격의 계승자란 이런 모습이구나."
52115-80 = "백화요란의 부장에 어울리는 모습이란 바로 저런 것이구나, 하고 말이야."
52115-81 = "그, 그렇지 않아. 아야메. 정작 아야메에 비하면 나 같은 건—"
52115-82 = "그렇게 스스로를 비하하지 않아도 괜찮아, 나구사."
52115-87 = "나구사는 내 소중한 친구잖아?"
52115-92 = "소중한 친구가 열심히 노력해서 나를 뛰어넘을 정도로 강해지고, 부원들의 인정을 받게 되었다는데, 이를 시기할 수는 없어."
52115-93 = "나는 나구사, 네가 언젠가 아름다운 꽃을 피울 재목이라고 늘 생각하고 있었어."
52115-94 = "내가 쿠즈노하 님께 인정을 받지 못한 건 아쉬운 일이지만…… 결국 내가 갖지 못했던 무언가가 네게는 있었다는 뜻이겠지."
52115-95 = "전에 했던 약속처럼, 나구사 네가 약할 때나, 강할 때나, 나는 언제나 네 곁에 머무를게."
52115-96 = "그러니 지금은…… 내가 수행하는 마지막 부장으로서의 임무를 도와줘."
52115-103 = "……물론이야."
52115-105 = "크으…… 이 전개야말로 청춘 그 자체잖아."
52115-106 = "……좋아! 이 불타는 열정으로 화조풍월부 녀석들을 단번에 물리쳐 버리자고!"
52115-107 = "소녀, 전에 읽었던 스포-츠 만화에서 이런 대화를 본 적이 있사와요!"
52115-108 = "렌게 선배가 말씀하시던 청춘이란 이렇게나 마음이 들뜨는 것이군요……!"
52115-110 = "하하…… 어쩐지 이 이상은 반대하기 어려운 분위기가 되어버렸네요."
52115-111 = "뭐, 나구사 선배가 괜찮다면, 나도 억지로 반대할 생각은 없으니까."
52115-112 = "……그나저나, 이 아이는 왜 함께 데리고 온 거야?"
52115-118 = "누군들 함께 가고 싶어서 따라온 줄 알아?! 네 녀석들이 강제로 끌고 온 거잖아!"
52115-119 = "어린아이를 혼자 남겨 두면 무슨 일을 저지를지 알 수 없으니까. 최소한 눈에 닿는 곳에서 지켜봐야지."
52115-120 = "그리고 또 혹시 모르잖아? 우리가 자리를 비운 사이 괴서를 사용해 백물어를 또 불러낼 지도 모르고……"
52115-122 = "그건 걱정하지 않아도 괜찮아. 이 꼬마가 가지고 있던 괴서, 이노모노노케로쿠는 저번 사건 때 파괴되었으니까—"
52115-126 = "……잠깐. 그런데 전에 쓰던 괴서는 더는 못 쓰게 되었을 텐데, 이 녀석은 어떻게 어젯밤에 츠쿠모가미를 불러낸 거지?"
52115-130 = "설마…… 화조풍월부가 가진 괴서는 한 권이 아니었던 것인가요?!"
52115-132 = "……가능성이 있어. 괴서가 단 한 권밖에 존재하지 않는 화조풍월부의 비급이라면, 저런 사고뭉치 꼬마에게 쥐여 주진 않았을 테니까."
52115-133 = "누가 사고뭉치 꼬마라는 거야! 코쿠리코 님은 내 능력을 신뢰해서 괴서를 맡겨 주셨—"
52115-137 = "렌게, 유카리. 이 꼬마의 팔을 붙잡아."
52115-147 = "뭐, 뭐하는 거야?!"
52115-149 = "지금부터 몸수색을 하겠어. 혹시라도 우리가 찾지 못한 괴서를 숨겨두고 있다면 큰일이니까."
52115-150 = "좋아. 다리는 내가 잡고 있을게."
52115-158 = "뭐, 뭐하는 거야! 그런다고 너희들이 괴서를 찾아낼 수 있을 거라 생각했다면—"
52115-164 = "이힉?! 큿…… 크하하! 크하하하! 그, 그만둬……!"
52115-165 = "여긴가? 아니면 여기에……?"
52115-166 = "그, 그만…… 진짜로 용서하지 않을 테니까……!"
52115-173 = "키쿄 선배, 이곳에 문고본 사이즈의 책이 숨겨져 있었사와요!"
52115-174 = "잘했어, 유카리."
52115-179 = "그, 그건…… 그 책은 안 돼!"
52115-180 = "호오, 반응을 보니 진짜 괴서나 그에 준할 만큼 중요한 책인가 본데?"
52115-181 = "나구사 선배, 어서 내용을 확인해 봐!"
52115-183 = "응. 어디……"
52115-193 = "[log]제목[/log]"
52115-194 = "[log]사상 최강의 괴담가[/log]"
52115-198 = "[log]작가[/log]"
52115-199 = "[log]쿠지키 슈라[/log]"
52115-203 = "[log]쏟아지는 총알도 폭탄도,[/log]"
52115-205 = "[log]강철과 같은 [ruby=보디]육체[/ruby] 앞에서는 무력하도다.[/log]"
52115-207 = "[log]사상 최강의 [ruby=스토리탤러]괴담가[/ruby]의 소문이 백귀야행에 널리 펴져 나간다.[/log]"
52115-211 = "[log][ruby=빙설]얼음[/ruby]처럼 차가운 눈을 가진 그녀는[/log]"
52115-213 = "[log]오늘도 칠흑의 [ruby=다크니스]어둠[/ruby] 속에서, 사람들의 마음을 유혹한다.[/log]"
52115-215 = "[log]이를 거역하는 자는 그 대가를 [ruby=목숨]피[/ruby]로 받을지오니.[/log]"
52115-219 = "[log]손가락질 한 번으로[/log]"
52115-221 = "[log]그녀가 부리는 [ruby=몬스타]괴이[/ruby]들이 [ruby=스토리탤러]괴담가[/ruby]를 화나게 한—[/log]"
52115-223 = "[log]애잔하고도 [ruby=스투핏]아둔한 녀석들[/ruby]에게 달려든다.[/log]"
52115-227 = "[log]특히 건방진 [ruby=멍청이들]백화요란[/ruby]은 봐주지 않는다.[/log]"
52115-229 = "[log]그 녀석들은 울면서 집에 돌아가게 될 것이다.[/log]"
52115-233 = "[log]그것이, 모두가 무서워하는[/log]"
52115-234 = "[log]궁극의 [ruby=스토리탤러]괴담가[/ruby]이니.[/log]"
52115-238 = "아."
52115-239 = "아……"
52115-240 = "아아……."
52115-241 = "[s] \"………으음.\""
52115-247 = "유카리, 좀 더 찾아볼래? 분명 어딘가에 괴서를 숨기고 있을 거야."
52115-252 = "왜 못 본 척하는 거야! 실컷 다 읽어놓고서!"
52115-253 = "혹시 이게 네가 쓴 소설……?"
52115-254 = "아니, 소설이라기에는 조금 이상하잖아. 이건 완전히—"
52115-255 = "으읏, 으으읏……!"
52115-256 = "도대체 뭐하는 짓이야! 멋대로 남의 짐을 뒤지더니, 소중한 작품을 공개 낭독하기나 하고!"
52115-257 = "내가 고심해서 생각해 낸 이 오리지널 소재를 누가 듣고 먼저 소설로 공개해서 대박이 나기라도 하면……"
52115-258 = "네 녀석들이 그 책임을 질 수 있겠어?!"
52115-259 = "[s] \"아, 우려했던 건 그쪽……?\""
52115-260 = "그건 걱정하지 않아도 괜찮을 것 같은데."
52115-261 = "어차피 그 소재로 글을 쓸 수 있는 작가도 많지 않을 것 같고……"
52115-265 = "……그건 그렇긴 하지. 아무리 소재가 좋아도 제대로 따라 쓰기 위해서는 필력도 받쳐줘야 하는 법이니까."
52115-269 = "흠, 흠. 그래서 말이지만…… 다들 소감이 어떠셨나요? 괴담이 아닌 저의 오리지널 스토리가."
52115-270 = "표정들을 보아하니 다들 감탄해서 말도 나오지 않는 모양이지만, 특별히 여러분께 첫 감평의 기회를 드릴까 하는데요."
52115-271 = "어떠셨나요, 제 역작. <사상 최강의 괴담가>의 감상은……?"
52115-276 = "어…… 그게 그러니까 소녀의 의견은……"
52115-277 = "……일단은 서두르도록 할까. 해가 지기 전에 피안의 저택에 도달하려면 발걸음을 재촉할 필요가 있을 테니까."
52115-278 = "마, 맞사와요! 지금은 의견을 드릴 때가 아닌 것이에요!"
52115-280 = "괴서가 없었다니, 시간만 낭비했네."
52115-281 = "뭐, 사람을 해치는 괴담보다는 훨씬 좋지 않겠어? 재미야 모르겠지만."
52115-282 = "[s] \"……일단은 다른 책을 많이 읽어보는 게 좋지 않을까?\""
52115-288 = "으으, 으으으……"
52115-289 = "나구사 쨔아아아앙!"
52115-291 = "다음화;카데노코지가의 무녀"
