[translation]
2000706-1 = "버추얼 싱어의 무대"
2000706-5 = "라이브 하우스 내 대기실"
2000706-7 = "(공연이 시작되기 전, 대기실에 들려 미쿠가 새롭게 작곡한 곡을 들었다.)"
2000706-11 = "……♪"
2000706-13 = "……어떤가요, 선생님? 제가 마음을 담아 새롭게 작곡한 곡은?"
2000706-14 = "[s1] \"미쿠의 진심이 잘 느껴져서 좋았어.\"\n[s2] \"훌륭해, 최고야!\""
2000706-17 = "감사합니다, 선생님."
2000706-18 = "부디 다른 관객 여러분도 이 곡을 좋아해 주셨으면 좋겠어요."
2000706-20 = "……하지만 아직도 불안한 점이 많이 남아 있네요."
2000706-21 = "무엇보다 공연 기획자님은 아직 공연의 리스트가 바뀌었다는 사실을 모르실 텐데……."
2000706-27 = "곡의 리스트가 바뀌었잖아?!"
2000706-28 = "기, 기획자님?"
2000706-29 = "저기, 공연에 쓸 곡의 리스트가 모두 바뀐 것 같은데. 혹시 아는 거 있어?"
2000706-30 = "큰일났네. 공연까지 남은 시간도 얼마 없는데……"
2000706-31 = "그게 그러니까……."
2000706-32 = "[s] \"제가 바꿨습니다.\""
2000706-33 = "뭐어?"
2000706-34 = "당신은 누구야? 아니, 그보다 어째서 곡을 바꾼거야?"
2000706-35 = "이런 공연은 여러 가지 사정이 얽혀 있기 때문에, 곡 하나에도 엄청나게 많은 돈이 들어간다고."
2000706-36 = "멋대로 이런 일을 저지르면 곤란해……"
2000706-37 = "만약 스폰서나 팬들이 클레임을 걸기라도 한다면, 당신이 책임질 수 있어?"
2000706-38 = "[s] \"책임지겠습니다.\""
2000706-39 = "읏…… 그렇게 시원스럽게 확답하다니."
2000706-40 = "뭐 하는 어른이야, 이 사람은?"
2000706-41 = "게다가 무슨 수를 썼는지 곡의 리스트를 수정할 수 있는 접근 권한도, 공연 설비를 통제할 수 있는 컨트롤러도 우리 뜻대로 움직이질 않아……."
2000706-42 = "으윽…… 하는 수 없지. 지금은 바뀐 곡으로 공연을 강행하는 수 밖에……!"
2000706-43 = "하지만 공연이 실패하기라도 한다면 죄송하다는 말 만으로는 끝내지 않을 테니까!"
2000706-51 = "하, 하하…… 일단 어떻게든 허락을 받기는 했네요."
2000706-52 = "하지만 정말로 괜찮으시겠어요?"
2000706-53 = "만약 공연이 실패하기라도 하면 어마어마한 비용이 청구될 텐데……."
2000706-54 = "[s] \"괜찮아.\""
2000706-56 = "[s] \"미쿠의 마음이 담긴 곡이 실패할 리 없어.\""
2000706-57 = "또 그렇게 무모한 말씀을……"
2000706-64 = "선생님은 불확실한 상황 속에서도 언제나 저를 믿고 응원을 보내주시네요."
2000706-65 = "올바른 길을 가르쳐 주시기보다는, 제가 가고 싶은 길이 어느 방향인지 스스로 생각할 수 있게 등을 밀어주시니……."
2000706-66 = "단순한 버추얼 싱어였던 제게도 할 수 있다는 자신감이 생겼어요."
2000706-67 = "이 은혜에 보답하기 위해서는, 선생님의 기대에 부응하는 것이 제일이겠죠?"
2000706-68 = "맡겨주세요, 선생님. 멋지게 공연을 성공시키고 올게요!"
2000706-72 = "(새로운 몸을 얻고 나서 저는 수많은 자극을 느끼게 되었어요.)"
2000706-73 = "(이 자극이 저만 느낄 수 있는 가상의 감각이 아니라면, 현실의 사람들은 이 자극을 어떻게 받아들이고 있는지 진심을 담아 묻고 싶어요.)"
2000706-74 = "(지금까지 불러왔던 노래에 담겨져 있던 수많은 감정들……)"
2000706-75 = "(지금은 모두 이해할 수 있게 되었어요.)"
2000706-76 = "(이 마음을…… 저의 진심을 사람들에게 전하고 싶어요!)"
2000706-80 = "[wa:700]― (사람들이 모두 내 노래에…… [wa:1950]내 말에……"
2000706-82 = "― 귀를 [wa:400]기울여 주고 있어.)"
2000706-85 = "[wa:750]― (자신의 [wa:250]진심을 [wa:500]담아서 노래하는 것이"
2000706-87 = "― 이렇게 [wa:400]기분 좋은 일이었다니…….)"
2000706-90 = "[wa:700]― (이렇게 [wa:1200]모두를 위해서 [wa:550]노래할 수 있다니……"
2000706-92 = "― 즐거워, [wa:1500]행복해……!)"
2000706-95 = "[wa:700]― (이대로 계속, [wa:1250]계속 노래하고 싶어!)"
2000706-99 = "라이브 하우스 내 대기실"
2000706-100 = "선생님, 보셨나요? 모두가 제 노래에 열광하고 있어요!"
2000706-101 = "제 마음이……"
2000706-102 = "진심이 사람들에게 닿았어요!"
2000706-103 = "[s3] \"최고의 무대였어.\"\n[s4] \"역시 미쿠의 생각은 틀리지 않았어.\""
2000706-107 = "선생님……."
2000706-113 = "미쿠—!"
2000706-114 = "지금 관객 반응 봤어? 모두가 열광적으로 앙코르를 요청하고 있어!"
2000706-115 = "오늘 공연은 대성공이야! 모두가 그 신곡을 다시 듣고 싶어 하고 있다고!"
2000706-116 = "공연을 본 스폰서도 크게 만족하며 벌써 다음 공연은 언제인지 묻더라고."
2000706-117 = "공연 직전에 리스트가 바뀌었을 때는 끝장이라고 생각했는데…… 공연이 성공적으로 끝나서 정말 다행이야……."
2000706-118 = "이게 다 [USERNAME] 선생님께서 도와주신 덕분이에요."
2000706-119 = "그쪽의 선생에게도 큰 신세를 졌어. 이 은혜를 어찌 갚아야 할지……."
2000706-120 = "[s] \"미쿠의 노래가 좋았던 덕분이에요.\""
2000706-121 = "그, 그렇지."
2000706-122 = "미쿠, 지금 앙코르곡을 한 곡 더 부를 수 있겠어?"
2000706-123 = "사람들이 열광적으로 앙코르를 요청하고 있어서……"
2000706-124 = "이대로 돌려보냈다가는 큰 폭발이라도 일어날 기세야."
2000706-125 = "아, 네. 가능하긴 한데……."
2000706-126 = "그럼 나는 먼저 가서 무대를 정리하고 있을게. 준비가 되는 대로 바로 와줘!"
2000706-132 = "아하하…… 엉겁결에 승낙해버리고 말았네요."
2000706-133 = "[s] \"무슨 문제라도 있어?\""
2000706-134 = "아뇨, 모처럼 공연이 끝났으니 감사의 의미로 선생님께 식사라도 대접할까 했는데……."
2000706-135 = "앙코르 공연까지 하고 나면 시간이 너무 늦어질 것 같아서요."
2000706-136 = "공연이 끝나자마자 근처의 고급 레스토랑을 예약해 두었는데…… 고민되네요."
2000706-137 = "[s5] \"나는 괜찮아.\"\n[s6] \"미쿠가 하고 싶은 일을 해.\""
2000706-138 = "정말 괜찮으시겠어요?"
2000706-139 = "정말 괜찮으시겠어요?"
2000706-140 = "아무리 인기 있는 선생님이라도 버추얼 싱어와 저녁 식사를 할 기회는 흔치 않다고요?"
2000706-141 = "하지만 선생님이 그렇게 말씀하신다면……"
2000706-142 = "네. 지금은 노래를 부르는 데 집중할게요."
2000706-149 = "저는 진실한 마음을 담아 듣는 이에게 노래를 전달하는, <하츠네 미쿠>니까요!"
