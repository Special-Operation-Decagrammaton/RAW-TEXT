[translation]
1600406-1 = "이때 이것"
1600406-2 = "(약속장소로 잡힌 곳은 백귀야행에 존재하는 한 음식점.)"
1600406-3 = "(도착하니 예약된 방이 있다며 안내를 받았다. 테이블 건너편에선 피나가 기다리고 있었다.)"
1600406-4 = "(……평소와는 다르게, 어딘가 다소곳한 분위기였다.)"
1600406-5 = "……오셨습니까. 선생님. 기다리고 있었습니다."
1600406-6 = "[s1] \"……?\"\n[s2] \"피나?\""
1600406-7 = "피나가 불초하여 직접 찾아 뵈지 못하고……"
1600406-8 = "피나가 불초하여 직접 찾아 뵈지 못하고……"
1600406-9 = "선생님의 어려운 발걸음을 구태여 부탁드린 부분, 크게 사과드립니다."
1600406-10 = "[s3] \"……네?\"\n[s4] \"뭔가 분위기가 평소와 다른데…….\""
1600406-11 = "그렇습니다. 하긴 그럴 수밖에요."
1600406-12 = "그렇습니다. 하긴 그럴 수밖에요."
1600406-13 = "오늘의 피나는, 선생님과 특별한 식을 행하고자 자리를 마련했으니……."
1600406-14 = "……바로 이것……."
1600406-15 = "[s5] \"……우롱차?\"\n[s6] \"갑자기 웬 차야?\""
1600406-16 = "……후후."
1600406-17 = "……후후."
1600406-18 = "갑자기가 아닙니다. 오늘은 선생님과 제가……. 그간 확인한 연으로 신뢰의 의식을 하는 날."
1600406-19 = "이런 걸 더러 <잔 나누기>라고 하지요."
1600406-20 = "이 잔을 나누는 것으로, 이제부터 선생님과 저는 뗄래야 뗄 수 없는 관계를 맺고……."
1600406-21 = "……네?"
1600406-22 = "……잔 나누기는 원래 술로 나누는 건데……. 이건 우롱차라고요……?"
1600406-23 = "……에?"
1600406-24 = "에에에에에에……?"
1600406-25 = "어……. 으음……. 그, 그건……. 그러니까……. 저기……."
1600406-26 = "아, 안 그래도 아까 주인 아저씨께 여쭤봤을 때……. 미성년자니까 당연히 술은 안 된다고……."
1600406-27 = "그 대신 우롱차로 하라고 하셔서……."
1600406-28 = "여, 역시 많이 이상한가요……? 우롱차로는 안 되는 건가요!?"
1600406-29 = "확실히 봤던 영화들 중에선 어디서도 우롱차로 한 건 없었지만……! 전부 술이었지만……!"
1600406-30 = "술이 아닌 시점에서 이미 아웃인 것 같지만……!!"
1600406-31 = "그, 그럼 피나는……. 피나는 이제 어떻게 해야……!!"
1600406-32 = "……네?"
1600406-33 = "차로 해도 별로 상관없을 거 같다고요? 그, 그렇지만 방금 선생님께서……."
1600406-34 = "[s7] \"선생이 학생과 술을 마실 수는 없지.\"\n[s8] \"나는 그다지 술을 좋아하는 편이 아니라서.\""
1600406-35 = "……아."
1600406-36 = "……아."
1600406-37 = "그, 그렇군요……. 네, 네. 그렇군요……."
1600406-41 = "(찻잔을 든 피나는 자리에 앉았다.)"
1600406-42 = "그, 그럼! 그렇게까지 말해주셨으니, 피나도 사양은 하지 않겠습니다!! 정말로 괜찮겠죠!? 그런 거죠!?"
1600406-43 = "자, 자!! 선생님도!! 와서 앉으세요!! 이, 이쪽으로!!"
1600406-44 = "[ns] 테이블 건너편으로 다가가 앉는다."
1600406-48 = "이, 이이, 이건 약속이에요, 약속! 저희만의 맹세! 목숨 걸고 하는 약속……!!"
1600406-49 = "부, 부부, 부족한 피, 피피나이지만……!! 아, 앞으로도……!"
1600406-50 = "……."
1600406-52 = "……앞으로도 잘 부탁드립니다!!!"
1600406-56 = "― [log=피나]……[wa:500]후우……. [wa:1700]뭔가……. [/log]"
1600406-58 = "― [log=피나]괜히 혼자 긴장했던 것 같은 느낌입니다…….[wa:570] [/log]"
1600406-61 = "[wa:300]― [log=피나]이렇게 침착해지고보니,[/log]"
1600406-63 = "[wa:100]― [log=피나]왠지 [wa:900]조금 부끄럽다고 해야하나…….[wa:1060] [/log]"
1600406-66 = "[wa:200]― [log=피나]……후훗. [wa:1500]실은……[wa:1600]전부터 쭉,[/log]"
1600406-68 = "[wa:100]― [log=피나]오늘의 이 날을 [wa:1000]기대하고 있었습니다.[/log]"
1600406-71 = "― [log=피나]저…… [wa:1300]오늘 이 날을 [wa:1000]맞이할 수 있게 되어,[/log]"
1600406-73 = "― [log=피나]정말 [wa:900]기쁘게 생각합니다.[/log]"
1600406-76 = "[wa:900]― [log=피나]……선생님은 언제나,[/log]"
1600406-78 = "[wa:200]― [log=피나]제가 곤란할 때 [wa:1400]이끌어 주셨습니다.[/log]"
1600406-81 = "― [log=피나]오늘만이 아니라, [wa:1600]언제나요.[/log]"
1600406-84 = "[wa:500]― [log=피나]중요한 것은 [wa:1000]무엇인가,[/log]"
1600406-86 = "― [log=피나]자신만의 방식이란 [wa:1200]대체 어떤 것인가……[/log]"
1600406-89 = "[wa:300]― [log=피나]선생님을 만나지 못했다면 [wa:1600]배우지 못했을 거라고 생각하니,[/log]"
1600406-91 = "[wa:300]― [log=피나]왠지 [wa:1200]가슴이 아파옵니다.[/log]"
1600406-94 = "[wa:700]― [log=피나]……그러니까, [wa:1500]진심으로 감사드립니다.[/log]"
1600406-96 = "[wa:400]― [log=피나]선생님, [wa:1700]앞으로도 [wa:500]피나를…….[/log]"
1600406-99 = "아니……."
1600406-100 = "……저를,"
1600406-101 = "잘 부탁드립니다."
