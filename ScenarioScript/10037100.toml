[translation]
10037100-1 = "제10화;하늘을 품고 기슭에 이르렀도다."
10037100-4 = "듣자 듣자 하니, 못 들어 주겠구나. 정말로!"
10037100-8 = "뭐지?!"
10037100-15 = "그런 게 대체 무슨 상관이라고!"
10037100-16 = "확실하게 말해 두지! 모든 학생에게는 물론 쿠데타를 일으킬 권리가 있다!"
10037100-17 = "그리고 모든 학생회장에게는…… 그 쿠데타를 진압하고, 학교를 이끌 권리가 있다!"
10037100-19 = "무, 무슨 말을 하는 겁니까. 체리노 서기장?!"
10037100-20 = "우리 붉은겨울에서, 이 정도 일은 아침 인삿거리도 안 된다는 말을 하고 싶은 거다!"
10037100-21 = "전통을 지키지 않는다? 변화를 불러일으켰어?"
10037100-22 = "지금 너희가 하고 있는 쿠데타야말로, 진정한 의미의 '변화'가 아니냐!"
10037100-23 = "우, 우리가 하려는 것은 쿠데타라든가 반역이 아니라, 충언과 고언을……!"
10037100-31 = "하지만 그 수단으로 여러분이 선택한 것은, '극단적인 방법'과 '변화'였죠. 그렇지 않나요, 경극부 여러분?"
10037100-36 = "드, 듣고 보니……?!"
10037100-41 = "현룡문의 문주는 산해경을 수호해야 한다…… 물론 옳은 말이지요."
10037100-42 = "그렇지만 그렇다면, 경극부의 부장은 경극부를 수호해야 하지 않을까요?"
10037100-43 = "지금의 카구야가 하는 일은, 경극부를 수호하는 일이 맞나요?"
10037100-44 = "저는 제삼자의 시선으로 지켜볼 뿐이지만, 조금 의문이 드네요."
10037100-46 = "어어, 어어어어……?!"
10037100-48 = "현룡문 여러분도 마찬가지입니다. 물론 산해경을 수호하는 것은 중요하겠지요."
10037100-49 = "그렇지만 여러분은 산해경에 속한, 현룡문이라는 단체의 구성원이지요?"
10037100-50 = "그렇다면 그 단체의 주인을 무엇보다 우선해서 지키는 것이, 여러분의 진정한 의무와 과업이 아닌가요?"
10037100-52 = "어라. 그게…… 그렇게 되나?"
10037100-53 = "분명히 일리는 있는데…… 저 토모에라는 붉은겨울 학생, 어떻게 우리 산해경과 현룡문의 사정을…… 이렇게 능숙하게 알고 있는 거지?"
10037100-55 = "그거야, 앞서 저희 서기장님께서 말씀하셨듯."
10037100-56 = "붉은겨울에서 이 정도 사건은, 아침 인삿거리도 안 될 정도의 사소한 일이기 때문이죠."
10037100-57 = "붉은겨울의 추위는, 모두에게 공평하지……."
10037100-58 = "그 추위는 우리를 꺾이지 않게 만들고, 곰과 같은 강인함을 부여한다!"
10037100-62 = "자아, 비켜라! 체리노 회장님. 제가 앞장서 길을 열겠습니다. 저만 믿으십시오!"
10037100-63 = "음! 믿음직스럽구나. 마리나 위원장! 우리 붉은겨울의 방식과 모범을, 산해경 학생들에게 보여 주는 것이다!"
10037100-68 = "네! 가겠습니다! 우라–!"
