[translation]
10035140-1 = "후일담;코마카제 라브의 시크릿 바캉스 1"
10035140-4 = "이번 자판기도 쏠쏠하구만. 히힛."
10035140-5 = "버려진 자판기를 뜯어서 동전을 줍는다……"
10035140-6 = "이런 비즈니스 모델을 생각해 내다니 역시 대장은 머리가 좋으시네요!"
10035140-11 = "후하핫!"
10035140-12 = "역시 헬멧단에서 브레인이라 불릴 만한 사람은 나밖에 없다니까."
10035140-13 = "그래서 오늘 수확은 얼마지?"
10035140-18 = "자판기 스물여섯 대를 털어서……."
10035140-19 = "530엔인데요."
10035140-25 = "너무 적은 거 아니냐?"
10035140-27 = "그야 버려진 자판기니까요."
10035140-28 = "운영 중인 자판기는 블랙마켓의 기업 소유라 함부로 건드릴 수가 없잖아요."
10035140-33 = "이대로라면 계획했던 여름휴가 계획을 대폭 축소해야 하잖아, 젠장!"
10035140-35 = "그런……."
10035140-42 = "모모톡? 연락할 사람은 딱히 없는데."
10035140-46 = "모르는 번호인데……헬멧단 본부? 이런 것도 있었나?"
10035140-47 = "헬멧단은 점조직이긴 하지만 규모가 크니까 본부가 있다고 해도 이상할 건 없잖아요."
10035140-48 = "하긴 입단할 때 그런 게 있다는 소리를 들은 것 같기도 하고……."
10035140-49 = "뭐 아무튼, 무슨 내용인지 봐야겠네."
10035140-55 = "오오?! 해변에서 헬멧단 총연합회가 있다는데?!"
10035140-59 = "총연합회? 그게 뭔데요?"
10035140-61 = "헬멧단 전체가 해변으로 모이는 거래!"
10035140-62 = "먹을거리, 놀거리, 음악까지 가득하다는데! 이거 완전 파티 아니냐고!"
10035140-63 = "어때, 이거면 올해 여름휴가는 충분하잖냐!"
10035140-68 = "저, 저희도 가는 건가요?!"
10035140-70 = "당연하지!"
10035140-71 = "회비는 공짜라니까, 지금까지 모은 돈으로는 마음껏 즐길 준비나 하자고!"
10035140-74 = "만세!"
10035140-82 = "수, 수영복이 너무 비싼데요?"
10035140-83 = "우리 세 사람 걸 다 사기에는 돈이 부족한데요, 대장?"
10035140-88 = "으으음……."
10035140-89 = "어쩔 수 없지! 하나만 사서 돌려 입자!"
10035140-90 = "다른 것도, 예산 안에서 이것저것 마련해 보자고!"
10035140-121 = "아, 즐거웠다!"
10035140-123 = "뭘 많이 사지는 못했지만, 즐거웠어요, 대장!"
10035140-124 = "모은 돈도 거의 다 써버리기는 했지만……헬멧단 파티가 기다리고 있으니까!"
10035140-126 = "암, 그럼, 그럼!"
10035140-127 = "우리의 여름은 지금부터 시작이니까!"
10035140-134 = "뭐야, 새로운 알림?"
10035140-138 = "어디보자……."
10035140-143 = "어, 어라. 이게 무슨 소리야."
10035140-145 = "네? 왜 그러세요?"
10035140-146 = "대장? 표정이 안 좋은데 왜 그러시는……?"
10035140-154 = "……이걸 봐라."
10035140-159 = "파티 참석자 명단……."
10035140-160 = "우리 이름은……. 없네."
10035140-161 = "어…… 그러면 저희, 못 가는 건가요?"
10035140-162 = "그런…… 기대했는데……."
10035140-164 = "우, 웃기지 마! 누군 가고 누군 못 가는 게 어디 있어!"
10035140-165 = "기다려 봐. 내가 항의해서……!"
10035140-171 = "……아니, 대장만이라도 가세요."
10035140-176 = "뭐?"
10035140-177 = "어쩔 수 없잖아요. 헬멧단 본부도 명단에 없는 사람까지 챙겨줄 여유는 없는 것 같고……."
10035140-178 = "대장도 우리 못지않게 기대하고 계셨잖아요? 그러니까 다녀오세요."
10035140-179 = "저희 걱정은 하지 마시고……."
10035140-180 = "너희들……."
10035140-185 = "……좋아."
10035140-189 = "너희들, 지금부터 날 따라 와."
10035140-194 = "네? 어디 가는데요?"
10035140-196 = "잔말 말고 따라 와!"
10035140-200 = "수영복도 샀으니까! 지금부터 물놀이하러 가는 거다!"
10035140-201 = "네녀석들의 여름을 이대로 보낼 수는 없잖냐!"
