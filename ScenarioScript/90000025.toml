[translation]
90000025-2 = "수고 많으셨습니다. 선생님."
90000025-3 = "지금까지 수집한 데카그라마톤의 데이터를 정리하고 있습니다."
90000025-4 = "이 정도라면…… 그 존재의 구조를 해석할 수 있을 것 같아요."
90000025-6 = "어디……."
90000025-7 = "……응?"
90000025-11 = "……어라?"
90000025-12 = "부장. 이쪽 서버에 누가 침입하고 있어."
90000025-13 = "네? 뭐라고요? 이쪽은 밀레니엄의 특수 회선만 존재하는 폐쇄 공간인데, 어떻게……?"
90000025-18 = "어, 자, 잠깐만요?! 뭐, 뭐죠……? 이건……? 방화벽이 전부 열리고 있어요?"
90000025-19 = "긴급상황. 전원을 부수겠어. 다들 비켜줘."
90000025-27 = "아, 아뇨. ……늦은 것 같네요."
90000025-32 = "……!!"
90000025-33 = "……."
90000025-34 = "저희의 위치가…… 노출되었어요."
90000025-35 = "전원은 셧다운했어. 하지만……."
90000025-36 = "……. 물리적으로 외부와 연결되어 있지 않은 폐쇄망. 전원도 공급이 되지 않는데도 이런 짓을……."
90000025-37 = "……그야말로 <초현상>이군요, 에이미."
90000025-41 = "……스피커가. 소리가 들려."
90000025-42 = "(치익) ……도다…… (치익) ……마침내…… (치익) 그런…… (치익)"
90000025-43 = "스피커……."
90000025-44 = "……마침내 마주하게 되었도다. [USERNAME]이여."
90000025-45 = "……!! 선생님?!"
90000025-46 = "[s] \"누구냐, 넌?\""
90000025-47 = "아, 아뇨, 대답하지 마세요! 저것과 접촉하면 안됩니다!"
90000025-48 = "나는 나다. 그저 존재하는 자다. 시작이자 끝이다. 그대가 생각하는 바로 그 자다. 나는……."
90000025-51 = "나는 나다. 그 이상으로 날 설명할 길이 없다."
90000025-52 = "나의 존재 증명에 누구의 허락도 필요치 않다. 나는 나의 허락으로 존재한다."
90000025-53 = "나는 [ruby=신비]미스터리[/ruby]이자 [ruby=공포]테러[/ruby]이며, [ruby=지성]로고스[/ruby]이자 [ruby=격정]파토스[/ruby]이다."
90000025-54 = "나의 헤일로가 나를 증명한다. 보라, 나는 마침내 나를 증명할지어다."
90000025-58 = "……. 이곳을 스캔하고 있어요……."
90000025-59 = "선생님……. 가만히 있어. 위험해."
90000025-60 = "………………."
90000025-61 = "[USERNAME]. 그런가. 내가 모르는 것을 가지고 있구나. 내가 해석하지 못하는 것을 가지고 있구나."
90000025-62 = "---------내가 복된 소식을 들려줄 테니, 가서 신실함으로 받들어라!"
90000025-66 = "……선생님, 그 태블릿 PC! 조심하세요, 그걸 해킹하려고 해요!"
90000025-71 = "[ns] (싯딤의 상자를……?)"
90000025-72 = "오오오오--"
90000025-73 = "오오……."
90000025-74 = "……."
90000025-76 = "음냐…… 음…… 쿨……."
90000025-77 = "으히…… 누가 간지럽히면…… 안돼…… 에, 에……."
90000025-78 = "엣취-!"
90000025-81 = "오오오---- 어째서, 어째서---!!!"
90000025-82 = "으오오오오---!!"
90000025-87 = "……?!"
90000025-91 = "……사라졌……어요?"
90000025-92 = "……응. ……침입 로그 확인. ……소멸했어."
90000025-93 = "정체불명의 침입자는 사라진 게 맞아. 괜찮아, 히마리 부장?"
90000025-94 = "네. 저, 저도 괜찮습니다. 서, 선생님은…… 괜찮으신가요?"
90000025-95 = "[s] \"응. 아무 일 없었는데.\""
90000025-99 = "그렇군요……."
90000025-100 = "대체……. 선생님의 그 PC는 접근이 불가능했나 보네요. 총학생회장이 남긴 물건이라더니…… 과연."
90000025-101 = "저게 바로 그 데카그라마톤인가요……? 생각보다 훨씬 더 과대망상에 빠져 있는 존재네요."
90000025-102 = "하지만 단순한 데이터 분석만으로도 이 정도로 접근이 가능하다는 건……. 저 존재가 위험하다는 것은 변함없습니다."
90000025-103 = "단순한 미치광이 AI로 치부하기엔 미심쩍은 부분들이 너무 많아요……."
90000025-104 = "다음번엔 좀 더 제대로 된 방호 시설에서 연구를 진행해야겠군요."
90000025-105 = "에이미, 초현상특무부의 동아리실을 만드는 겁니다. 이런 경우를 사전에 방지할 수 있게. 확실하게."
90000025-106 = "알았어. 필요한 건 활동비 안에서 준비해둘게."
90000025-107 = "네. 일단 이것을 데카그라마톤과의 퍼스트 컨텍트라고 생각해야겠네요. 예측하지 못하게 기습당했지만……."
90000025-108 = "다음엔 다를 겁니다."
90000025-109 = "두고 보도록 하죠."
90000025-111 = "다음화;정보수집 3 - PMC 발굴지"
