[translation]
10045040-1 = "제4화;제3회전: 수상 장애물 레이스"
10045040-2 = "비명이 가득한 배 위의 여행도, 이윽고 끝을 맞이했다."
10045040-4 = "자아, 이번 경기를 통과한 10인의 선수를 소개합니다!"
10045040-5 = "모두 박수로 환영해 주세요!"
10045040-15 = "모두 첫 경기 때부터 쟁쟁한 실력을 보여주신 분들이네요! 앞으로의 활약도 정말 기대돼요!"
10045040-16 = "그럼 잠시 휴식을 취한 후에 다음 경기로 찾아뵙겠습니다!"
10045040-17 = "아, 참. 그러고 보니 슬슬 배가 고프실 시간인데요."
10045040-18 = "그런 여러분들을 위해 백야당 출장판, 바다의 집이 아침부터 영업 중입니다!"
10045040-19 = "제가 선정한 메뉴가 저렴한 가격으로 다양하게 준비되어 있으니, 와서 마음껏 즐겨주세요!"
10045040-20 = "그럼 기다리고 있을게요, 냥냥!"
10045040-21 = "……좋아! 자연스러운 광고였어!"
10045040-24 = "다들…… 바다의 집에서 뭐라도 먹을래?"
10045040-25 = "으으, 미안. 지금은 아무것도 먹고 싶지 않아."
10045040-26 = "……사실은 나도 그래."
10045040-28 = "정말…… 죽다 살아났사와요……."
10045040-29 = "아아…… 기억하기 싫어……."
10045040-31 = "[ns1] \"백화요란은 전원 통과구나!\"\n[ns2] \"모두 축하해!\""
10045040-34 = "가, 감사하여요……."
10045040-35 = "선생님. 이제 다음 경기는 뭐야?"
10045040-36 = "(뭐가 됐든 물에 들어가는 것만 아니었으면…….)"
10045040-37 = "[ns] \"다음 경기는 바로……!\""
10045040-39 = "[log]선착순 수상 장애물 달리기![/log]"
10045040-43 = "……산 넘어 산이네."
10045040-45 = "여러분 오래 기다리셨습니다! 이번 경기는 백야수상제의 꽃! 수상 장애물 달리기입니다!"
10045040-49 = "10인이 동시에 출발! 결승점을 통과하는 두 사람이 최종전에 진출하게 됩니다!"
10045040-50 = "진로에는 수많은 장애물이 기다리고 있는데요!"
10045040-51 = "빙글빙글 돌아가는 다리!"
10045040-52 = "물풍선이 쏟아지는 경사로길!"
10045040-53 = "사방이 바다인 징검다리 부표!"
10045040-54 = "어디로 이어질지 모르는 예측 불가 미끄럼틀!"
10045040-55 = "이런 장애물을 돌파해서 결승점을 향해 달려주세요!"
10045040-57 = "……후우."
10045040-58 = "물에 젖기 싫으면 안 떨어지면 되는 거잖아?"
10045040-59 = "당연히, 그러려고 했어."
10045040-60 = "(……그래. 너무 열심히는 하지 말자. 안전하게 물에 빠지지만 않게 가는 거야.)"
10045040-62 = "한편, 그때……."
10045040-63 = "제길, 이게 뭐야? 떨어뜨리려던 녀석들이 죄다 통과 했어!"
10045040-64 = "이대로는 우리에게 승산이 없다고!"
10045040-65 = "이젠 그냥 포기하는 게 좋지 않을까? 여기서 단둘만 결승에 진출한다잖아."
10045040-66 = "우리 둘이 가면 되는 거지! 왜 벌써 포기를 해!"
10045040-67 = "넌 저 녀석들에게 쫓겨본 적이 없어서 잘 몰라."
10045040-68 = "내 입으로 말하긴 좀 그렇지만 쟤들 진짜 강하다고."
10045040-69 = "나한테 잘해준 적도 있어서…… 계속 싸우는 것도 조금 불편한 느낌도 있고."
10045040-71 = "약해지지 마! 아직 우리에겐 기회가 있어! 내 계획대로만 하면 돼!"
10045040-72 = "크, 크크큭…… 크크크큭……!"
10045040-73 = "우, 우와…… 뭔가 악당 같은 웃음인데……."
10045040-74 = "다음엔…… 다음엔 꼭……!"
10045040-76 = "그리하여 잠시 후……."
10045040-77 = "기다리시던 수상 장애물 달리기를 시작하겠습니다!"
10045040-82 = "드디어 시작이네……."
10045040-83 = "누가 될진 모르겠지만 결승에서 만나자고."
10045040-84 = "후후, 네 명 동시에 통과해서 다 같이 결승 진출! ……같은 건 어떠시어요?"
10045040-85 = "가능할 리가 없잖아."
10045040-88 = "(……후우.)"
10045040-89 = "(……어쨌든 여기는 내가 자연스럽게 탈락하는 게 모두에게 좋을지도.)"
10045040-90 = "(핑곗거리는…… 만들어 놨으니까.)"
10045040-91 = "(그런데 어떻게 자연스럽게 탈락하지? 생각해 내, 키쿄……!)"
10045040-92 = "키쿄. #n……키쿄?"
10045040-93 = "엄청나게 뭔가를 생각하고 있는데……."
10045040-94 = "자, 그럼 선수들! 모두 출발선에 서주세요!"
10045040-101 = "제3회전, 수상 장애물 레이스……!"
10045040-102 = "[ns] \"시작—!!\""
10045040-105 = "경기 시작부터 백화요란이 선두로 나섭니다!"
10045040-106 = "첫 번째 코스는 빙글빙글 돌아가는 다리! 과연 무사히 지나갈 수 있을까요?"
10045040-107 = "모두, 단숨에 가자……!"
10045040-108 = "다리가 도는 속도보다 더 빨리 뛰는 것이어요!"
10045040-109 = "평상시의 단련에 비하면 별거 아니네!"
10045040-110 = "(아래는 보면 안 돼. 아래는 보면 안 돼. 아래는 보면 안 돼……!)"
10045040-112 = "오오, 모두 단숨에 뛰어넘었습니다!"
10045040-113 = "사사삿! 이즈나도 질 수 없습니다!"
10045040-114 = "슈우웅~"
10045040-115 = "읏차."
10045040-119 = "차례차례 장애물을 돌파해 나갑니다! 좀처럼 차이가 벌어지지 않네요!"
10045040-120 = "[ns] \"정말 누가 이겨도 이상하지 않아!\""
10045040-121 = "좋아 좋아…… 이대로…… 이대로 가랏!"
10045040-122 = "어이. 내가 말한 대로 세팅해둔 거지?"
10045040-123 = "으음…… 뭐 일단 하긴 했는데 말이야……."
10045040-125 = "물풍선이 쏟아지는 언덕에 선두 그룹이 도달했습니다!! #n맞지 않도록 주의하세요~!"
10045040-128 = "여기도 단번에……."
10045040-133 = "윽……?!"
10045040-137 = "뭐, 뭐지? 미끄럽고 끈적거려."
10045040-138 = "이 냄새는…… 코코넛 오일……?"
10045040-139 = "이, 이대로는 경사로를 올라갈 수가 없사와요……!"
10045040-142 = "[ns] \"저…… 시즈코? 갑자기 얘들이 오일투성이가 되어버렸는데……?\""
10045040-143 = "아, 아앗……! 그럴 수가! 평범한 물풍선이어야 하는데……!"
10045040-144 = "진행요원 여러분! 서둘러 확인을 부탁드릴게요!"
10045040-146 = "케헤헤, 고맙다고 망량즈. 이걸로 순식간에 거리를 좁혔군!"
10045040-147 = "그럼 먼저 실례하겠어!"
10045040-151 = "뭐, 뭐야? 갈고리 밧줄? 그런 건 어디서 꺼낸 거야?!"
10045040-152 = "흥, 이럴 줄 알고 미리 가져온 거라구!"
10045040-153 = "히히, 너희는 계속 거기서 사이좋게 미끈거리고 있어!"
10045040-157 = "치사하게 자기들만 사용하고 밧줄을 끊다니……!"
10045040-158 = "다들, 일단 근처의 물로 오일을 씻어내도록 해요!"
10045040-159 = "이즈나가 도와드릴게요! #n이즈나류 인법! 분수의 술!"
10045040-165 = "결국 젖는 건 피할 수 없었네……."
10045040-166 = "자, 어서 따라잡자! 아직 늦지 않았어……!"
10045040-170 = "뭐, 뭐야? 벌써 따라붙기 시작했다고?!"
10045040-171 = "괜찮아! 다음 코스에는 우리 애들이 손을 써놨으니까!"
10045040-173 = "[log]다음 코스![/log]"
10045040-175 = "[log]징검다리 부표![/log]"
10045040-178 = "부표에 지뢰를 심어서 밟으면 터지게 해놨어!"
10045040-179 = "안전한 부표는 나만 알아볼 수 있게 표시해 뒀으니까, 멋도 모르고 건너다간 바다에 빠지겠지!"
10045040-180 = "그, 그럼 어서 앞장서! 난 뭘 밟으면 되는지 몰라!"
10045040-186 = "거기 서, 이 자식들……!"
10045040-189 = "아직, 이 정도로는—"
10045040-195 = "……어라?"
10045040-199 = "바보야! 네가 먼저 밟으면 어떡해……!"
10045040-205 = "……하아."
10045040-209 = "아아, 앞서가던 두 사람이 리타이어!"
10045040-210 = "그건 그렇고 누가 부표에 지뢰 같은 걸 심어둔 거야!"
10045040-211 = "[ns] \"시즈코가 했던 거 아니었어?\""
10045040-212 = "제가 했겠냐고요!"
10045040-215 = "음! 터지는 부표가 있다면 부표 자체를 밟지 않으면 그만!"
10045040-216 = "이즈나류 인법! 수면달리기의 술!"
10045040-220 = "이, 이즈나 선수……? 물 위를 달려가고 있습니다……! 대체 어떻게……!"
10045040-221 = "[s] \"이즈나라면 다섯 걸음 정도는 가능해……!\""
10045040-223 = "질 수 없지! 이쪽도 간다……!"
10045040-224 = "잠깐, 렌게! 그렇게 막무가내로 달려가면……!"
10045040-225 = "고작 지뢰 따위로 내 앞을 막을 순 없어!"
10045040-229 = "오오, 렌게 선수! 무사히 징검다리 부표를 통과했습니다!"
10045040-230 = "자! 키쿄! 너도 할 수 있어!"
10045040-233 = "(……그래. 렌게가 밟았던 부표들만 따라서 밟으면 어떻게든……!)"
10045040-240 = "……응?"
10045040-248 = "(우, 우으으읍……!)"
10045040-249 = "(뭐, 뭐가 어떻게 된 거지……? 부표를 잘못 밟은 거야?)"
10045040-250 = "(중요한 순간에…… 이런 실수를…….)"
10045040-251 = "(어서…… 물 위로 떠올라야 하는데…….)"
10045040-252 = "(점점…… 의식이…….)"
10045040-254 = "(……다들 ……미안.)"
10045040-256 = "……키쿄?"
10045040-257 = "키쿄……!!"
