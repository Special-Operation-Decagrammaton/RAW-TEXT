[translation]
1009302-1 = "키라라의 부활동"
1009302-2 = "(게헨나에서 볼일을 보고 돌아가는 길에서, 즐겁게 떠들며 걷는 학생들을 발견했다.)"
1009302-10 = "[ns] (친한 친구들인가 보네…….)"
1009302-12 = "아! 우리는 여기서 저쪽으로 가야 해. 잘 가, 키라라!"
1009302-13 = "응! 다음에 또 봐!"
1009302-19 = "어라?"
1009302-21 = "[USERNAME] 쌤 안녕! 여기서 만나네?"
1009302-22 = "일 마치고 돌아가는 중이라고? 나랑 똑같네? 나도 하교하는 중이었거든."
1009302-23 = "[s] \"같이 있던 학생들은 친구들?\""
1009302-24 = "응! 맞아. 오늘 처음 만난 애들인데, 얘기도 잘 맞아서 좋았어!"
1009302-25 = "[s1] \"오, 오늘 처음 본 사이였다고?\"\n[s2] \"완전 찐친 같아 보였는데?!\""
1009302-28 = "응? 언제 처음 봤는지 그런 게 중요해?"
1009302-29 = "그냥 친하면 친구인 거 아닐까나? 아하핫!"
1009302-30 = "난 쌤이랑도 만난 시간이랑 관계없이 완전 친하다고 생각하고 있는데?"
1009302-31 = "[s] \"엄청난 친화력……. 이것이 인싸……!\""
1009302-32 = "아하핫! 이게 뭐 대단한 거라고?"
1009302-33 = "아! 그렇구나! 쌤…… 설마 질투 나서?"
1009302-34 = "아하핫! 알았어, 알았어! 그럼, 남은 하굣길은 쌤이랑 같이 가는 걸로 할게!"
1009302-48 = "그래서 그때 편의점에서……"
1009302-49 = "앗, 벌써 여기까지 왔네."
1009302-50 = "우리 집은 저쪽으로 가야 해서, 아쉽지만 여기서 바이바이 해야 할 듯!"
1009302-51 = "[s] \"한 가지만 물어봐도 될까?\""
1009302-52 = "쌤이 나한테 궁금한 게 있다니 의외인데? 뭔데뭔데?"
1009302-53 = "[s3] \"키라라는 왜 동아리 활동을 하지 않는 거야?\"\n[s4] \"동아리에 들어가면 친구들을 더 많이 사귈 수 있는 거 아냐?\""
1009302-56 = "뭔가 했더니, 그게 궁금했구나?"
1009302-57 = "그치만 나도 동아리가 있는데?"
1009302-58 = "응? 귀가부라는 건 그냥 부활동 없이 집에 가는 학생들을 부르는 말이 아니냐고?"
1009302-59 = "아하핫~! 쌤! 잘 알고 있네!"
1009302-60 = "맞아. 얼마 전까지 난 단순한 귀가부였지만……!"
1009302-65 = "이제는 다르다는 말씀!"
1009302-66 = "나, 이번에 완전 특별한 동아리, <반짝반짝부>를 만들었거든!"
1009302-67 = "[s] \"반짝반짝…… 부?\""
1009302-68 = "응응! 완전 두근거리고, 완전 반짝거리는 동아리야!"
1009302-69 = "[s] \"자, 잘 모르겠는데…….\""
1009302-70 = "보통의 동아리 활동, 운동이라든가, 취미라든가, 여러 가지 동아리 활동을 한다~! 는 건 좋지만, 나랑은 역시 안 맞는 것 같아서 말야!"
1009302-71 = "매번 같은 활동만 하고, 그 동아리에 가입한 애들만 보게 되고……."
1009302-72 = "하루 이틀쯤이면 몰라도, 맨날맨날 보던 사람만 보면 엄~청 지루할 것 같지 않아?"
1009302-73 = "그래서 아예 새로 하나 만들었지 뭐야!"
1009302-74 = "다른 동아리처럼 하나의 활동만 하기보다는…… 오늘처럼 집에 가는 길에 친구를 만나 친해지고……"
1009302-75 = "그런 김에 같이 푸드코트에 들러 잡담을 하거나…… 함께 상점가에서 옷을 보러 가거나……."
1009302-76 = "기분이다~! 싶으면 노래방에 들러 노래를 부르거나……"
1009302-77 = "이렇게 같이 노는 거야!"
1009302-78 = "물론 꼭 처음 만난 친구일 필요는 없고, 꼭 쇼핑이나 노래방일 필요도 없어. 하지만 '일단 즐겁게'!"
1009302-79 = "이게 우리 <반짝반짝부>의 모토야!"
1009302-80 = "어때? 완전 두근거리고 완전 반짝거리지 않아?"
1009302-81 = "[s] \"정말, 키라라 정도의 친화력을 가진 사람만 할 수 있는 말이네.\""
1009302-82 = "전혀 그렇지 않아~"
1009302-83 = "하고 싶다면 선생님도 얼마든지 할 수 있어!"
1009302-84 = "아…… 근데 선생님은 선생님이라 안 되나~? 아하핫!"
1009302-85 = "으음~ 그래도 오늘의 부활동은 조금 성공적이었을지도?"
1009302-86 = "응? 왜냐고?"
1009302-93 = "그야, 이렇게 쌤을 만나서 수다 떨 수 있었으니까!"
1009302-94 = "쌤은 어때?!"
1009302-95 = "[s] \"응…… 나도 키라라를 좀 더 알게 된 것 같아, 즐거웠어.\""
1009302-96 = "에헤헷!"
