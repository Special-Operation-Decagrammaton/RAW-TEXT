[translation]
2702-1 = "체포하겠습니다! 2"
2702-2 = "키보토스 3거리 2번가, <마스터 도너츠> 앞"
2702-4 = "으, 으악! 살려주세요!"
2702-5 = "하하하! 목숨이 아깝다면 가진 돈을 모두 내놓아라!"
2702-6 = "후후. 가게 주인을 인질로 삼아 사람들이 다가오지 못하게 위협한 다음, 경찰이 도착하기 전에 돈을 빼앗아 달아난다…… 이번에도 완벽한 계획이군!"
2702-7 = "발키리 경찰학교의 학생들은 강력한 장비로 무장하고 있지만 출동이 굼뜨기로 악명 높지. 녀석들이 현장에 도착할 즈음에는 이 몸은 이미 멀리 도망치고 있을 것이다, 하하하!"
2702-8 = "자, 그럼 어디 한번 금고를 열어 볼까……."
2702-11 = "경찰입니다! 모두 손을 들고 물러나세요!"
2702-12 = "아니?! 발키리 경찰학교의 학생들이 벌써 도착했다고? 신고가 들어간 지는 채 5분도 지나지 않았을 텐데!"
2702-13 = "경비국의 느림보들과 비교하지 말아주세요! 저희 생활안전국은 평소의 순찰 업무를 통해 이 일대의 지름길은 훤히 꿰뚫어 보고 있으니까요!"
2702-14 = "……생활안전국?"
2702-15 = "경비국이 아니라 생활안전국이라고? 크하하하!"
2702-16 = "뭐, 뭐가 그렇게 우스운 거죠?"
2702-17 = "그야 우스울 수 밖에. 제대로 된 장비도 없이 교통정리나 하는 생활안전국의 학생들이 이 몸을 체포하러 오다니…… 가소롭구나!"
2702-19 = "범인에게도 얕보이고 있어……."
2702-20 = "으으…… 용서할 수 없어요!"
2702-29 = "으, 으악! 자, 잠깐만요! 멋대로 총을 쏘면 위험해요!"
2702-30 = "이, 이 자식……! 조준도 하지 않고 총을 난사하다니, 인질을 자기 손으로 죽일 셈이냐!"
2702-32 = "으윽, 입학 시험에서도 문제가 되었던 사격 실력이 발목을 잡을 줄이야……."
2702-33 = "후부키. 저 대신 인질범을 저격해 주시겠어요?"
2702-34 = "……나도 이 거리에서의 저격은 자신이 없는걸."
2702-35 = "우으…… 하지만 이렇게 무의미하게 시간을 보냈다가는 뒤늦게 도착한 경비국의 학생들에게 공적을 모두 빼앗기고 말 거라고요! #n빨리 무슨 수를 찾지 않으면……."
2702-36 = "그냥 체포는 경비국 학생들에게 맡기는 게 낫지 않겠어?"
2702-37 = "우리에게는 범인을 저격할 수 있는 저격총도, 바리케이드를 날려버릴 수 있는 폭탄도 없잖아. 괜히 섣부르게 나서다가 일을 키우는 게 아닐까……."
2702-38 = "으으, 분해! 최소한 가게 앞을 가로막고 있는 저 바리케이드만이라도 부술 수 있다면 쉽게 돌입을 할 수 있을 텐데……."
2702-40 = "……키리노. 입구에 쌓인 저 바리케이드, 도넛 만드는 데 쓰이는 밀가루 포대 아니야?"
2702-41 = "멀어서 잘 보이지는 않지만…… 무슨 문제라도 있나요?"
2702-42 = "나서는 건 내 스타일이 아니지만, 범인을 무력화시킬 수 있는 좋은 수가 하나 떠올랐거든."
2702-43 = "자, 한번 들어봐……."
2702-45 = "잠시 후"
2702-47 = "후우, 이제야 좀 조용해졌네. 경찰 녀석들도 이제는 포기한 모양이군."
2702-48 = "자, 그럼 다시 금고를 열어볼까……."
2702-53 = "탕, 탕, 탕!"
2702-54 = "뭐, 뭐야, 이 요란한 총소리는?! 위협 사격이라도 시도하는 건가?"
2702-57 = "……하지만 여전히 형편없는 사격 솜씨로군. 총알이 여기까지 날아오기는커녕 밀가루 포대로 쌓은 바리케이드를 두들기고 있을 뿐이잖아."
2702-58 = "이 멍청이들, 어딜 노리고 있는 거냐! 그건 단순한 밀가루 포대일 뿐이라고!"
2702-59 = "밀가루 포대를 두들겨봤자 나오는 건 아무것도 없어!"
2702-64 = "……콜록, 콜록. 그나저나 이 연기는…… 설마?"
2702-69 = "네, 맞아요. 그 연기는 밀가루 포대에서 터져 나온 밀가루 분진입니다!"
2702-70 = "애초부터 총으로 위협할 생각은 조금도 없었어. 가게 안에 밀가루 분진을 잔뜩 일으키는 게 우리의 목적이었으니까."
2702-71 = "대기중에 비산한 분진은 작은 불꽃만으로도 쉽게 발화할 수 있지요. 다시 말하자면……"
2702-73 = "분진 폭발이다!"
2702-75 = "이 멍청이들이……"
2702-76 = "그런 짓을 했다가는 이 일대가 통째로 날아간다고—!"
2702-78 = "콰앙!"
2702-81 = "으으…… 가게가…… 손님들이 오가는 거리가……."
2702-82 = "이런 멍청이들 때문에 내 완벽한 계획이 엎어지다니…… 분하다……."
2702-87 = "야호! 저희 손으로 범인을 잡았어요!"
2702-88 = "폭탄 없이 바리케이드와 범인을 동시에 날려버리다니……"
2702-89 = "내가 생각했지만 정말 참신한 아이디어였어."
2702-90 = "이만하면 발키리 경찰학교의 높으신 분들도 저희의 공을 인정해주시겠지요?"
2702-93 = "경찰입니다! 모두 손을 들고 뒤로 물러나……."
2702-94 = "도넛 가게에서 인질극이 벌어지고 있다는 소식을 듣고 왔는데…… 인질범이 아니라 테러범이 다녀갔었나?"
2702-95 = "국장님, 보세요! 여러분이 오시기 전에 저희가 미리 범인을 잡아두었습니다!"
2702-96 = "생활안전국의 키리노와 후부키잖아? #n그나저나 이 참상은 도대체…… 설마 인질범이 폭탄을 터트렸나!"
2702-97 = "아뇨. 범인이 설치한 바리케이드를 무력화하기 위해 저희가 대신 폭파했습니다!"
2702-98 = "화약 대신 밀가루를 조금 빌려 쓰기는 했지만, 효과는 확실하다고."
2702-99 = "……."
2702-100 = "자, 어떠신가요? 이만한 공적이면 저도 경비국으로 전과할 수 있겠지요?"
2702-101 = "나는 전과는 필요 없고, 보름 정도의 휴가면 충분히 만족해……."
2702-102 = "저격수 한 명으로 해결할 수 있는 문제를 가게를 통째로 터트려서 해결하다니……."
2702-103 = "모두 돌아가서 시말서 쓸 준비나 해!"
2702-108 = "에에에에—?!"
2702-110 = "(이후, 키리노와 후부키는 도넛가게 폭발에 대한 책임을 지고 한동안 정학 처분을 받았다.)"
2702-111 = "체포하겠습니다!"
