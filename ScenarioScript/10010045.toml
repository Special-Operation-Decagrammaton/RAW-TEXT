[translation]
10010045-1 = "제4화;슬럼성의 전투 2"
10010045-3 = "히, 히이익! 뭐야, 이게……! 이런 녀석들이었어!?"
10010045-5 = "퇴각, 퇴각이다! 일단 모두 후퇴!!"
10010045-11 = "(전투는 생각보다 손쉽게 끝났고, 예상치 못한 저항에 놀란 헬멧단은 혼비백산 달아났다.)"
10010045-13 = "하하! 까불고 있어, 한주먹거리도 안되는 게!!"
10010045-14 = "요, 요시미 쨩……. 뭔가 삼류 불량배 같은 대사를……."
10010045-15 = "어울리니까 내버려 둬."
10010045-16 = "하하하하하!"
10010045-20 = "어쨌든 트럭도 무사히 회수했고, 주인아저씨도 구했으니 이걸로 한 건 해결."
10010045-21 = "선생님이 도와주셨으니까요……. 감사합니다, 선생님!"
10010045-22 = "[s1] \"모두 고생했어.\"\n[s2] \"무사히 끝나서 다행이야.\""
10010045-23 = "……아."
10010045-24 = "……아."
10010045-25 = "그러고 보니……."
10010045-33 = "……?"
10010045-34 = "……네? 저요? 갑자기 왜 절 보시는……."
10010045-35 = "뭐, 그냥……. 시스터가 싸우는 걸 본 건 처음이라. 원래 다 그런 식인가 싶어서……."
10010045-36 = "그, 그런 식……!? 그런 식이라는 게 무슨 뜻이죠……?"
10010045-37 = "아. 죄송합니다. 이 녀석 말이 원래 이래서요. 나쁜 뜻으로 드린 말씀은 아니었는데……."
10010045-38 = "그냥 멋졌다는 뜻이에요."
10010045-39 = "정말이지, 유탄기관총으로 정문을 박살 내는 장면은 시원함 그 자체였다고! 쌓인 게 싹 내려갔달까……!"
10010045-40 = "사실상 핵심 전력이었으니까. 마치 사람이라기보다, 공성 전차에 가까운 느낌……."
10010045-42 = "고, 공성 전차!? 아, 아니에요! 저는 사정이 있어서 그저 케이크를 조금 얻기 위해서 왔을 뿐……!"
10010045-43 = "……라기보다 저, 지금까지 그런 이미지로 보이고 있었던 건가요!? 정말로!?"
10010045-44 = "……나츠."
10010045-45 = "알았다고. 미안, 미안. 칭찬이라니까."
10010045-46 = "흠……. 그럼 역시 이건 우리의 공성……시스터님께 드려야겠네."
10010045-54 = "어라……. 여, 여러분? 이건……."
10010045-55 = "……미라클 5000. 그나마 여기 남아 있던 마지막 물량."
10010045-56 = "다들 먹고 싶어서 온 거긴 하지만, 시스터 님은 뭔가 '사정이 있다'고 하셨으니 말이지."
10010045-57 = "싸움에서도 제일 핵심적인 역할이었고……."
10010045-58 = "뭐, 혹시 불만 있는 사람이……. 있을까?"
10010045-60 = "나는 찬성~."
10010045-61 = "트럭과 주인아저씨가 풀려났으니 계속 조금씩은 물량도 풀릴 거고. 급할 거 없지."
10010045-62 = "괜찮아, 괜찮아! 여태 5일이나 참았는데, 하루 정도 더 참는 건 일도 아니지!"
10010045-64 = "여, 여러분……."
10010045-65 = "……아니. 그럴 필요 없어."
10010045-66 = "……? 응?"
10010045-71 = "당신은……?"
10010045-72 = "따지고 보면 이렇게 풀려난 것도 여러분 덕이니까 말이야. 나도 그냥 있을 수만은 없지."
10010045-73 = "어차피 그간 그 녀석들이 케이크를 못 만들게 막아서 손도 근질근질했던 참이고……."
10010045-77 = "좋아! 기분이다! 오늘은 잔뜩 만들어주마!"
10010045-78 = "오늘 하루만큼은 미라클 5000도 한정이 아니야! 통상이다!"
10010045-87 = "……."
10010045-88 = "……과연……."
10010045-89 = "……'미라클'이네."
