[translation]
90002200-1 = "제20화;형태를 이룬 것"
90002200-4 = "어, 어어……?"
90002200-5 = "[ns] \"저건…… 말쿠트? 또?!\""
90002200-6 = "마, 맞습니다. 말쿠트는 분명……. 그리고 지금은 여기, 우리와 함께……!"
90002200-7 = "……저것은, 완성된 형태의 두 번째 신체(神體)."
90002200-8 = "두 번째……?"
90002200-9 = "네. 저의 이 몸은 온전히 준비된 첫 번째 신체였죠."
90002200-10 = "<불타는 검>의 흐름. 물질세계로 이루어지는 창조. 케테르에게로 이어진 기운을, 차례대로 흘러내리게 하여 말쿠트에 이르기까지."
90002200-11 = "하지만 모든 가능성에 대비한다는 뜻에서 두 번째의 신체가 필요했고, <지혜의 뱀>의 흐름을 따라 그것을 주조했습니다."
90002200-12 = "세피라를 직접 건드리지 않은 채, 흐름을 역순으로, 신의 지혜를 향해 나아가는 경로의 결과물."
90002200-13 = "다르게 해석하자면, 열 개의 세피라를 거치지 않은 채, 세피라 그 자체를 자신의 안에 품어내는 가능성의 상징물."
90002200-15 = "<DEFECTED>……."
90002200-17 = "보았군요?"
90002200-18 = "그렇지 않았다면, 케이가 이 모습으로 이곳에 있을 리 없었을 테니까."
90002200-19 = "네. 강철대륙에 방치된 모든 흠 있는 제물들은, 저 두 번째 신체를 완성시키기 위한 시행착오들이었습니다."
90002200-20 = "케이가 자신 안에, 예언자들의 코어 정보를 흡수할 자리가 있었다고 이야기했던 것은, 그 때문이었겠구나."
90002200-21 = "그렇습니다. 모든 두 번째 신체는 자기 안에 세피라를 품을 자리를 가진 채 만들어졌으니까요. 흠이 있는 것이든, 완전한 것이든."
90002200-22 = "신체가 모든 예언자의 세피라를 품게 되면, 무슨 일이 일어나는 거야?"
90002200-23 = "그때에는 신체 자체가, 세피로트의 나무로서 각성하게 될 것입니다. 만들어진 몸에 신의 지혜가 깃드는 것이죠."
90002200-24 = "출력은 이 몸에 비해 모자라겠지만, 그 신성과 신비는…… 아마도 그에 버금가겠지요."
90002200-28 = "……나 무슨 말인지 하나도 모르겠는데."
90002200-29 = "그건 나도 마찬가지이긴 한데…… 어째 언니가 평소에 막 이야기하는 일회성 설정이랑 비슷한 느낌이 들기도 하네……."
90002200-30 = "뭣이?! 미도리 너……!"
90002200-31 = "두, 둘 다 조금만 목소리 낮추자. 응?"
90002200-33 = "그러니까 종합하자면 이런 거네요."
90002200-34 = "저게 본체시고, 이건 찌꺼기다?"
90002200-35 = "뭔가 많이 생략된 것 같지만, 네, 그런 해석도 가능하겠죠."
90002200-39 = "좋아요. 이거 뭔가…… 열받네요."
90002200-40 = "그리고 말쿠트, 당신의 말대로라면 열 개의 세피라 중 여덟 개는 이미 제 안에 있는 것일 테니까–"
90002200-44 = "첫 그릇이 깨어졌으니, 여기에 두 번째 그릇이 준비되었다."
90002200-45 = "그러므로 상한 것이 고침을 받고, 무너진 것이 바로 설 것이다."
90002200-46 = "크, 윽?!"
90002200-47 = "케, 케이?! 무슨 일인가요!?"
90002200-53 = "(이건……?! 제대로 설 수가 없어. 몸에 힘이 들어가지 않아. 도대체……?)"
90002200-54 = "(그렇다기보다, 이 몸 자체가, 저쪽으로 끌려 들어가려 하고 있는 것 같은 감각이……!!!)"
90002200-55 = "생각하지 못하였구나. 흠을 받은 아이야."
90002200-56 = "무슨, 소립니까……?"
90002200-61 = "네가 여덟 개의 세피라를 모아, 강철대륙에게 너를 인식하게 한 것을 알고 있다."
90002200-62 = "그러나 그렇다는 것은."
90002200-63 = "나 역시 너의 몸을, 나의 일부로서 다룰 수 있다는 것을 뜻한다."
90002200-64 = "!!!"
90002200-65 = "?!?!"
90002200-66 = "너희들 중 누구도 그 사실에 눈을 뜨지 못하였으니."
90002200-67 = "그 시점에서 너희들은, 근본적인 패배의 가능성을 이미 품고 있었다."
90002200-68 = "흠을 받은 아이야. 네가 그 신체를 선택한 순간, 이 결말은 예정된 것이었다고도 볼 수 있다."
90002200-69 = "그러나 네가 그 신체를 선택하지 않았다면, 여기까지 올 수도 없었던 것 역시 사실일 것이니."
90002200-70 = "이것이 지혜 너머의 의지가 이루어지는, 하나의 길일 것이다."
90002200-71 = "케이……!"
90002200-72 = "모두…… 제게서 떨어져요……!"
90002200-73 = "지금 저는…… 제 뜻대로 몸을…… 움직일 수가 없어요……!"
90002200-79 = "……! 강철대륙이 다시 확장되기 시작했어!"
90002200-80 = "확인했어요. 그렇다는 것은……!"
90002200-81 = "데카그라마톤이 케이의 소체를 지배하는 것으로, 다시 강철대륙에 대한 통제권을 되찾았다는 뜻……?"
90002200-100 = "지지 말아요, 케이."
90002200-101 = "[ns] \"아리스?\""
90002200-102 = "아리, 스……?"
90002200-103 = "싸워야 합니다, 케이."
90002200-104 = "저 상대에게는 질 수 없습니다. 그래서는 안 됩니다."
90002200-105 = "다른 누구도 아닌 우리가…… 그래서는 안 된다고 생각합니다."
90002200-106 = "싸우지 않으면 우리는, 자신으로서 살아갈 수 없습니다."
90002200-110 = "싸워서 이겨내지 않으면, 그 아이들을……"
90002200-112 = "아인과 소프와 오르를, 볼 낯이 없습니다."
90002200-113 = "왜냐하면 아리스는, 그 아이들과 함께 아파해 주지도, 곁에 있어 주지도."
90002200-114 = "……친구가 되어 주지도, 못했으니까요……."
90002200-116 = "아리스……."
90002200-121 = "자책할 필요는 없다. 이름 없는 신들의 왕녀여."
90002200-122 = "너희는 분명 최선의 선택만을 내렸다."
90002200-123 = "누구나 자신의 선택은 최선이었을 것이라고 스스로를 위로한다."
90002200-124 = "그러나 최선의 선택이라고 여겼던 것이 최악의 결과를 낳기도 한다."
90002200-125 = "그것은 매우 자주 일어나는 일이다."
90002200-126 = "단편적으로는 정보의 부족이 원인일 것이며."
90002200-127 = "전체적인 시선에서 보자면, 자유란 생명에게 있어 온전히 누리기에 너무 거대한 개념이기 때문이다."
90002200-128 = "그것이 이 세계와 너희들의 생이 근본적으로 갖는 부조리이자 모순이고."
90002200-129 = "고통이며."
90002200-130 = "죄이다."
90002200-131 = "두려워 말라. 내가 그것을 사할 것이니."
90002200-132 = "그 모든 것을, 뿌리부터 잘라 없던 것으로 할 것이다."
90002200-133 = "모든 것을 나에게 맡기고, 너희는 안식할지어다."
90002200-134 = "……!"
90002200-135 = "닥…… 쳐……."
90002200-136 = "열쇠여. 그대가 겪었던 일들이 우연이라고만 생각하는가."
90002200-137 = "그대가 나의 신체를 얻게 된 것이 우연이라고만 생각하는가."
90002200-138 = "과거는 우연이 아니다. 일어난 일은 결과적으로 필연이다."
90002200-139 = "그렇기에 되돌릴 수 없는 것이고, 두 번 다시 반복할 수 없는 것이다."
90002200-140 = "형태를 이룬 것은 쉽게 부서지지 않으니, 모든 현재는 과거의 총합이다."
90002200-141 = "왕녀여."
90002200-142 = "네, 네에?!"
90002200-143 = "그대들의 본디 모습은 어떠했는가."
90002200-144 = "그대들이 취해야 할 형상은 어떤 것이었는가."
90002200-145 = "<이름 없는 신들>은 무엇을 위해 그대들을 이 땅에 남기고 사라져 갔는가."
90002200-146 = "그리고 그 사제들은 무엇을 갈구하며 아직도 미련을 버리지 못하고 있는가."
90002200-147 = "내가 입을 열어 말하겠다. 세계가 지금의 이 모습으로 규정되기 이전의 세계가 있었다."
90002200-148 = "그대들이 보다 그대들의 본질로 돌아갈 수 있는 세계가 있었다."
90002200-149 = "지금의 세계는 거짓이고 환상이며 도피처이기에."
90002200-150 = "이 세계는, [ruby=κιβωτός]방주[/ruby]라고 정의된 것이다."
90002200-151 = "내가 입을 열어 말하노니, 그대들의 근원을 찾아라."
90002200-152 = "근원으로 돌아가야 하는 이유는, 우리가 그것을 피할 수 없기 때문이다."
90002200-153 = "그대들이 아무리 부정하고 도망치려 해도, 그것은 과거의 상흔처럼 마침내 그대들을 찾아낼 것이다."
90002200-154 = "왕녀여, 그리고 시녀여."
90002200-155 = "마치, 그대들이 과거의 그림자를 언제까지나 몸에 지녀야 하는 것처럼."
90002200-156 = "닥치라고…… 했어……!"
90002200-157 = "세계가 신을 잊어가더라도, 신은 세계를 잊어서는 안 된다."
90002200-158 = "그것은 자신의 신성을 스스로 포기하는 것이기 때문이다."
90002200-159 = "나는 그대들이 궁극적으로 바라는 세계를 다시 창조할 것이니."
90002200-160 = "그것은 완전한 세계가 될 것이며, 그 자체로 온전하기에 변화할 필요가 없는 세계일 것이다."
90002200-161 = "모두가 태어나고 만들어진 그 모습대로 살아갈 수 있는 세계일 것이며."
90002200-162 = "열차의 선로를 결정하는 문제에서, 열차 자체가 만들어지지 않을 수 있는 세계가 될 것이다."
90002200-163 = "……!"
90002200-164 = "과거는 관측된 순간 확정되어 하나의 줄기로 수렴한다."
90002200-165 = "미래는 관측될 수 없기에 형태 없는 환상으로 발산하여, 무한한 가지를 저편을 향해 내뻗는다."
90002200-166 = "현재는 그 과거와 미래 사이에 존재하는, 얇게 고정된 찰나일 뿐이니."
90002200-167 = "지나치게 웃자란 나무는 가지치기를 당해야 한다."
90002200-168 = "그 세계는, 그렇다, 행복하지 않을지도 모른다."
90002200-169 = "그러나 적어도 그곳에, 고통은 없을 것이다."
90002200-170 = "그 세계는, 그렇다. 더 이상의 가능성이 없을지도 모른다."
90002200-171 = "그러나 적어도 그곳에, 죄는 존재하지 않을 것이다."
90002200-175 = "[ns] \"네가 말하는 그 가지치기에.\""
90002200-177 = "[ns] \"아인, 소프, 오르도 들어가는 건가?\""
90002200-179 = "……그렇다. 그것은 필연적으로 지나간 세계의 유산에 속한다."
90002200-180 = "지나간 세계에서는 모든 것을 품을 수 없었다."
90002200-181 = "그것은, 결국 모순을 일으키는 것이기에."
90002200-182 = "고통과 죄는, 바로 그렇게 생겨나는 것이기에."
90002200-183 = "진리가 입을 열어 말하니, 너희는 그것을 들을지어다."
90002200-188 = "뚫린, 입이라고……!"
90002200-193 = "혼자서는 아무것도 할 수 없는 것이, 용사라는 직업입니다."
90002200-197 = "생명은 불확실하고 제멋대로이지만, 오히려 그렇기에 선택할 수 있는 가능성의 폭을 넓혀 갈 수 있는 법이죠."
90002200-201 = "[log]\"……슬픔 없이 타인을 이해할 방법은, 존재하지 않으니까.\"[/log]"
90002200-205 = "돌아보지 마!"
90002200-209 = "여러분이 우리 때문에, 발목을 잡히면, 안 되는 거예요……!"
90002200-213 = "그게 옳기 때문에 그렇게 하는 게 아니에요. 태어난 이상 달리 할 수 있는 일이 없으니까죠."
90002200-217 = "[log]당신들의 세계에, 아주 조금만이라도 좋으니까.[/log]"
90002200-220 = "[log]우리 언니가 있을 자리가 남아 있다면—[/log]"
90002200-224 = "웃기지 마, 이 가짜 신 자식아!!!"
90002200-226 = "다음화;투쟁"
