[translation]
1301106-1 = "복숭아빛 스탬프 랠리"
1301106-2 = "밀레니엄 전자상가 하루하바라"
1301106-6 = "으으, 좀 더 빨리 알았으면 좋았을 텐데!"
1301106-7 = "[s] \"모모이, 왜 그래?\""
1301106-8 = "울트라 마린 시스터즈의 스탬프 랠리……."
1301106-9 = "40주년 이벤트답게, 여기 이 종이에 하루하바라 전역에서 스탬프 40개를 찍어오면 전용 굿즈로 바꿔주는 이벤트야."
1301106-10 = "그런데, 하필 제한시간이 오늘 오후 2시까지……."
1301106-12 = "어떡하지. 선생님. 앞으로 시간이 2시간도 남지 않았어!"
1301106-13 = "모처럼 꼭 갖고 싶은 상품이 걸린 이벤트인데!"
1301106-14 = "[s] \"모모이.\""
1301106-15 = "응……?"
1301106-16 = "[s] \"아직 포기하긴 일러! 해보기 전까진 모르잖아.\""
1301106-17 = "하, 하지만 선생님. 어떡하려고……?"
1301106-18 = "[s1] \"모모이, 우린 두 명이야.\"\n[s2] \"그럼 모모이의 특기가 나올 차례지.\""
1301106-19 = "그건 무슨……?"
1301106-21 = "그건 무슨……?"
1301106-23 = "아……! 1P와 2P의 협동 플레이구나!"
1301106-24 = "과연, 선생님 말이 맞아!"
1301106-25 = "시도해보기 전부터, 불가능한 퀘스트는…… 없는 법!"
1301106-26 = "알았어! 선생님! 그럼 여기서 둘로 갈라지자!"
1301106-27 = "목표를 절반으로 나눠서, 스탬프를 채우는 거야!"
1301106-28 = "부탁해! 선생님!"
1301106-29 = "[s] \"응.\""
1301106-31 = "(그렇게 각고의 노력 끝에, 시간 안에 스탬프 할당량 20개를 채울 수가 있었다.)"
1301106-33 = "[ns] \"일단 다 채우긴 했는데, 모모이는…….\""
1301106-34 = "앗, 선생님! 여기야. 여기!"
1301106-37 = "[wa:600]― 이거 봐봐! [wa:400]선생님! [wa:1000]이 스탬프 카드, [wa:1000]다 채웠어!"
1301106-39 = "[wa:100]― 이걸로 퀘스트 클리어! [wa:2600]엣-헴!"
1301106-42 = "[wa:1000]― 불가능해 보일 것만 같던 퀘스트였지만. [wa:300]"
1301106-44 = "― 응! 역시 [wa:350]선생님과 나, [wa:1300]환상의 콤비네!"
1301106-47 = "[wa:2250]― 우와아앗! [wa:450]선생님!"
1301106-49 = "― 얼굴이 땀으로 범벅이네?! [wa:1350]괜찮아?"
1301106-52 = "[wa:150]― 아하핫! [wa:1100] 괜찮다니 다행이네~"
1301106-54 = "― 그래도 오늘- 선생님 덕분에 [wa:1200]엄청 [wa:550]재미있었어!"
1301106-57 = "[wa:750]― 다음에 또 [wa:800]이런 이벤트가 있다면……,"
1301106-59 = "― 응, 그때 다시 [wa:1100]같이 참가하자! [wa:1500]선생님!"
1301106-62 = "시간도……. 괜찮네. 자, 교환소로 가자"
1301106-63 = "선생님과 함께 힘내서 얻은 전리품, 확인하러 가야지!"
1301106-64 = "감사인사를 겸해서, 돌아가는 길에 음료수는 내가 쏠 테니까!"
1301106-66 = "(그렇게 모모이가 사준 음료수를 홀짝이며, 우리는 스탬프 굿즈를 교환하기 위해 느긋하게 교환소로 향했다.)"
