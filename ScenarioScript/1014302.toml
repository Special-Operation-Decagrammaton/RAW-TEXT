[translation]
1014302-1 = "溪谷與游泳"
1014302-2 = "（與旬一起來到了溪谷的水邊……）"
1014302-5 = ""
1014302-6 = "呼……溪水真是清涼又透澈呢。"
1014302-7 = "[s] 「原來你這麼擅長游泳啊。」"
1014302-8 = "呵呵，您過獎了。#n我也只是不會沉下去的程度而已。"
1014302-9 = "畢竟要教導孩子們的話，我自己也得對水有一定程度的熟悉才行。"
1014302-10 = "而且我本身也算是喜歡游泳的呢。"
1014302-11 = "[s] 「你喜歡游泳是有什麼特別的原因嗎？」"
1014302-12 = "唔嗯……身體變得輕盈自在的那種感覺，我還挺喜歡的。"
1014302-13 = "實際上因為浮力的關係，身體承受的重量也確實會變輕。"
1014302-14 = "而且游泳對關節的負擔相對較小，又是能消耗大量熱量的有氧運動……"
1014302-15 = "只要養成習慣並持之以恆，在許多方面都是有好處的哦。"
1014302-16 = "不過，由於室內游泳池會使用氯進行消毒……"
1014302-17 = "要是接觸的時間過長，對皮膚其實不是很好。"
1014302-18 = "但即使考量到這一點，我依然認為游泳是一項很好的運動。"
1014302-19 = "老師擅長游泳嗎？"
1014302-20 = "[s1] 「還算可以吧。」\n[s2] 「稱不上擅長。」"
1014302-23 = "呵呵，原來如此。#n不過……如果您願意到這裡來的話，我會很開心的。"
1014302-24 = "這裡的水深大概在胸口一帶，所以不至於會有危險。"
1014302-25 = "請不用擔心。萬一有什麼狀況，我會幫助老師的。"
1014302-28 = "（慢慢地，朝著旬所在的方向走了過去）"
1014302-31 = "怎麼樣呢，老師？有沒有像是躺在水床上的感覺？"
1014302-32 = "[ns] 「確實很像呢。」"
1014302-33 = "老師的聲音透過水傳過來，嗡嗡作響地很有趣呢！"
1014302-34 = "要是……老師也能試著躺在這裡就好了……"
1014302-35 = "咦？您擔心要是兩個人一起漂走就糟糕了？"
1014302-36 = "呵呵……那樣確實很傷腦筋呢。"
1014302-37 = "不過光是老師像這樣陪在我身邊，我就已經十分滿足了。"
1014302-38 = "（就這樣陪著旬享受了水床好一陣子）"
1014302-41 = ""
1014302-42 = "老師要吃點什麼嗎？我準備了泡在溪水裡冰鎮的水果哦。"
1014302-43 = "這裡有西瓜、哈密瓜、水蜜桃、李子和葡萄……是我盡可能為您準備的哦。"
1014302-44 = "[s] 「是不是有點太多了……？」"
1014302-45 = "呵呵，如果吃不完再帶回去就好了。#n請您不用擔心，盡情享用吧。"
1014302-47 = "（旬以熟練的手法切起了水果）"
1014302-48 = "（就在靜靜看著他的身影時……一片水蜜桃突然送進了嘴裡）"
1014302-49 = ""
1014302-52 = ""
1014302-53 = "味道如何呢，老師？"
1014302-54 = "[ns] 「又，又甜又好吃。」"
1014302-55 = "然後呢？"
1014302-56 = "[ns] 「水分也很多……」"
1014302-57 = "呵呵呵。難道是因為那是我親手切給您吃的嗎？"
1014302-58 = "[ns] 「唔，嗯。應該是吧……！」"
1014302-59 = "謝謝您。如果還想再吃的話，儘管跟我說哦？"
1014302-61 = "（與旬一起盡情享用了夏天的水果）"
1014302-62 = ""
1014302-63 = "那麼，老師。"
1014302-64 = "您要不要……也來體驗看看「水床」呢？"
1014302-65 = "[s]「咦？我也要嗎？」"
1014302-66 = "沒問題的，請相信我吧。"
1014302-67 = "訣竅就是放鬆身體，望著天空舒服地躺著就可以了。"
1014302-68 = ""
1014302-70 = ""
1014302-71 = ""
1014302-72 = "接著深吸一口氣，將手腳稍微向左右張開，身體就會慢慢浮起來。"
1014302-73 = "不過以防萬一……我會幫老師支撐著頭部。"
1014302-75 = "（照著旬所說的做了）"
1014302-76 = ""
1014302-79 = "（真的感覺到身體慢慢浮了起來）"
1014302-82 = "感覺如何呢？"
1014302-83 = "[ns] 「旬的聲音聽起來真的在嗡嗡作響呢……」"
1014302-84 = "對吧？"
1014302-85 = "啊，您也感覺非常舒適對吧？"
1014302-86 = "呵呵……只要輕輕地轉動頭部，就能看到周圍的景色哦。"
1014302-87 = "不過轉太多的話可能會失去平衡，還請您稍微留意一下。"
1014302-90 = "今天天氣真好。"
1014302-91 = "正可謂夏季的陽光呢。"
1014302-92 = "老師，您聽得見流水聲嗎？"
1014302-93 = "雖然您可能會覺得有點奇怪，不過像這樣和老師獨處……"
1014302-94 = "彷彿整個世界就只剩下我們兩個人一樣呢。"
1014302-95 = "（隨著全身漸漸放鬆……一股慵懶的感覺襲捲而來）"
1014302-96 = ""
1014302-100 = "要是真的變成那樣，恐怕會是一件大事……"
1014302-101 = "不過，假如只是一段時間的話……"
1014302-102 = "（雖然盛夏的陽光有些刺人，溪水卻始終沁涼舒爽）"
1014302-103 = "（周圍的聲音漸漸變得微弱……）"
1014302-104 = ""
1014302-107 = "要是能在沒有其他人的地方兩人獨處……"
1014302-108 = "就像現在這樣……"
1014302-109 = "（輕飄飄地……輕飄飄地……）"
1014302-110 = "……"
1014302-111 = "如果真的變成那樣，老師您會想做什麼呢？"
1014302-112 = "[ns] 「呼嚕呼嚕……」"
1014302-113 = "老，老師？老師！？！？"
1014302-114 = ""
1014302-116 = ""
1014302-117 = ""
1014302-118 = "不可以在這種地方睡著啊！！！"
1014302-119 = ""
1014302-120 = "[ns] 「還以為要出大事了……」"
1014302-121 = "我也嚇了一跳……"
1014302-122 = "要是在水裡睡著，可是會因為體溫下降而發生危險的呢。"
1014302-123 = ""
1014302-126 = "（就在這時突然打了個噴嚏！）"
1014302-127 = "您，您沒事吧！？老師！？"
1014302-128 = "啊……覺得有點冷嗎？"
1014302-129 = "聽說在夏天的水邊意外地容易感冒……"
1014302-130 = "來，請坐在這裡。#n我事先準備了大毛巾哦。"
1014302-131 = "（被旬用大毛巾裹住了身體）"
1014302-132 = "（接著……）"
1014302-133 = ""
1014302-135 = ""
1014302-138 = "[ns] 「旬，旬……？」"
1014302-139 = ""
1014302-140 = "……呵呵。"
1014302-141 = "我曾經聽說要溫暖一個人的身體，人的體溫是最有效的呢。"
1014302-142 = "並沒有其他用意哦？"
1014302-143 = "嗯，真的沒有。"
1014302-144 = "[ns] 「這，這樣啊……？」"
1014302-145 = ""
1014302-146 = ""
1014302-147 = ""
1014302-150 = "（下個瞬間，旬把手臂環到了腰上，兩人就這樣一起裹著毛巾……！）"
1014302-151 = ""
1014302-152 = "感覺如何呢，老師。"
1014302-153 = "這樣是不是暖和多了呢？"
1014302-154 = "[s] 「確，確實……！」"
1014302-155 = "是嗎，那真是太好了。"
1014302-156 = "萬一老師的身體出了什麼狀況，我也會非常擔心的。"
1014302-158 = "（就這樣依偎著彼此，直到身體暖和起來為止）"
