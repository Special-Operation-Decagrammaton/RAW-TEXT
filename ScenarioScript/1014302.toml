[translation]
1014302-1 = "Swimming at the Creek"
1014302-2 = "I went to the valley's stream with Shun..."
1014302-5 = ""
1014302-6 = "Ahh... The water's so refreshing and clear."
1014302-7 = "[s] \"You're a really good swimmer.\""
1014302-8 = "Haha. You're being far too generous. I'm barely able to stay afloat."
1014302-9 = "However, given that I work with kids, I am somewhat familiar with swimming."
1014302-10 = "...And I do enjoy going in the water."
1014302-11 = "[s] \"Is there a reason you like to swim?\""
1014302-12 = "Hm... I like the way it makes my body feel lighter."
1014302-13 = "The buoyancy...it makes everything feel a little weightless, doesn't it?"
1014302-14 = "Swimming puts less pressure on your joints, and it's an aerobic exercise that burns a significant amount of calories..."
1014302-15 = "It's quite beneficial if you practice it consistently."
1014302-16 = "When it comes to indoor pools, the disinfecting chlorine... "
1014302-17 = "...makes it less than ideal for your skin, provided you swim for an extended period."
1014302-18 = "But even taking that into consideration, I think any swimming is good exercise."
1014302-19 = "Are you good at swimming, Sensei?"
1014302-20 = "[s1] \"I'm all right.\"\n[s2] \"Nothing special.\""
1014302-23 = "Haha. I see. Still... I'd be so happy if you'd come here."
1014302-24 = "The water only comes up to my chest, so it isn't dangerous."
1014302-25 = "Don't worry. If anything happens, I'll help you."
1014302-28 = "Slowly, I approached Shun."
1014302-31 = "How is it, Sensei? Doesn't it feel like you're on a waterbed?"
1014302-32 = "[ns] \"It's just as you said.\""
1014302-33 = "Your words are humming through the water!"
1014302-34 = "If only you...could lie here too, Sensei..."
1014302-35 = "Huh? What if we \"both got swept away\"?"
1014302-36 = "Haha... I suppose that's possible."
1014302-37 = "But just having you watch over me for a while is good enough, Sensei."
1014302-38 = "I watched Shun's \"waterbed\" for a while."
1014302-41 = ""
1014302-42 = "Do you want something to eat? I've packed some fruit and left it by the stream."
1014302-43 = "I'll get it. I brought everything I could find...watermelon, melon, peaches, plums, and even grapes."
1014302-44 = "[s] \"That sounds like a lot...\""
1014302-45 = "Haha. The leftovers will keep, so don't worry and enjoy what you like."
1014302-47 = "Shun cut and prepared the fruit with dexterity."
1014302-48 = "I just watched...and before I knew it, there was a peach slice in my mouth."
1014302-49 = ""
1014302-52 = ""
1014302-53 = "How is it, Sensei?"
1014302-54 = "[ns] \"I-It's quite sweet and delicious.\""
1014302-55 = "And?"
1014302-56 = "[ns] \"And juicy...\""
1014302-57 = "Heehee. Is it because I just prepared it?"
1014302-58 = "[ns] \"Y-Yes. I think so...!\""
1014302-59 = "Thank you for noticing. Let me know if you want more!"
1014302-61 = "I enjoyed the fruits of summer with Shun."
1014302-62 = ""
1014302-63 = "Now then."
1014302-64 = "Do you want to try reclining in the \"waterbed\" as well...Sensei?"
1014302-65 = "[s] \"Huh? Me?\""
1014302-66 = "Don't worry. Just trust me."
1014302-67 = "The trick is to slightly relax your body, keep your gaze steady on the sky, and lie down."
1014302-68 = ""
1014302-70 = ""
1014302-71 = ""
1014302-72 = "Breathe in and spread your arms and legs a bit. Your body will gradually begin to float."
1014302-73 = "But just in case... Ha. I'll support your head, Sensei."
1014302-75 = "I did as Shun said."
1014302-76 = ""
1014302-79 = "And I began to feel my body float on the water."
1014302-82 = "How is it?"
1014302-83 = "[ns] \"Your voice really sounds like it's humming, Shun...\""
1014302-84 = "Right?"
1014302-85 = "Oh, it's \"extremely comfortable\"?"
1014302-86 = "Haha... If you carefully turn your head, you can see the scenery."
1014302-87 = "You might lose your balance if you pivot too much, so take care."
1014302-90 = "The weather is really nice today."
1014302-91 = "It's truly the best part of summer."
1014302-92 = "Are you listening to the water, Sensei?"
1014302-93 = "This might come off as strange, but being here alone with you, Sensei..."
1014302-94 = "It feels like we're the only two people in the world."
1014302-95 = "As the energy drained from my body...a wave of relaxation washed over me."
1014302-96 = ""
1014302-100 = "It would be a huge deal if that really happened, but..."
1014302-101 = "How would that feel? Only the two of us...even if it were just for a moment?"
1014302-102 = "The sunlight was harsh and direct, but the water was refreshingly cold."
1014302-103 = "The noise of the world started to sound more muted..."
1014302-104 = ""
1014302-107 = "If it were just the two of us, in a place where no one could watch..."
1014302-108 = "Just like now..."
1014302-109 = "I was floating, floating..."
1014302-110 = "..."
1014302-111 = "If that happened, what would you want to do, Sensei?"
1014302-112 = "[ns] \"*Yawn*...\""
1014302-113 = "S-Sensei? Sensei?!?!"
1014302-114 = ""
1014302-116 = ""
1014302-117 = ""
1014302-118 = "You can't sleep in this kind of environment!"
1014302-119 = ""
1014302-120 = "[ns] \"That could've been bad...\""
1014302-121 = "You scared me..."
1014302-122 = "Your body temperature can plummet if you fall asleep in water. It's incredibly dangerous."
1014302-123 = ""
1014302-126 = "And before I could respond, I sneezed!"
1014302-127 = "A-Are you okay, Sensei?!"
1014302-128 = "Oh... You feel \"kind of cold\"?"
1014302-129 = "I've heard people catch colds in the summer waters more often than you'd think..."
1014302-130 = "Now, sit here. Let's get you a towel."
1014302-131 = "Shun draped me with a massive towel."
1014302-132 = "And..."
1014302-133 = ""
1014302-135 = ""
1014302-138 = "[ns] \"S-Shun...?\""
1014302-139 = ""
1014302-140 = "...Haha."
1014302-141 = "Well, the most effective way to warm up is with another person's body heat."
1014302-142 = "I don't have any ulterior motives."
1014302-143 = "Yes, truly. I mean it."
1014302-144 = "[ns] \"I-Is that so...?\""
1014302-145 = ""
1014302-146 = ""
1014302-147 = ""
1014302-150 = "Then, Shun wrapped her arms around my waist and pulled the towel around the both of us...!"
1014302-151 = ""
1014302-152 = "How does that feel, Sensei?"
1014302-153 = "Isn't this much...hotter?"
1014302-154 = "[s] \"Y-You're right...!\""
1014302-155 = "Good, I'm glad to hear that."
1014302-156 = "If anything happened to you, Sensei, I'd be terribly concerned."
1014302-158 = "With that, we leaned our bodies against each other until we warmed up."
