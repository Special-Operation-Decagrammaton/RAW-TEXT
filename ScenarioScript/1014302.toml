[translation]
1014302-1 = "หุบเขากับการว่ายน้ำ"
1014302-2 = "(คุณครูมาถึงริมน้ำในหุบเขาพร้อมกับชุน...)"
1014302-5 = ""
1014302-6 = "ฮู่ว... น้ำใสและเย็นสบายจริงๆ เลยค่ะ"
1014302-7 = "[s] \"ว่ายน้ำเก่งจริงๆ เลยนะ\""
1014302-8 = "ฮุฮุ ชมเกินไปแล้วค่ะ ฉันก็แค่ว่ายพอให้ไม่จมเท่านั้นเองค่ะ"
1014302-9 = "ถ้าจะสอนเด็กๆ ฉันก็จำเป็นต้องคุ้นเคยกับน้ำในระดับหนึ่งด้วยค่ะ"
1014302-10 = "แล้วฉันก็เป็นพวกชอบลงน้ำอยู่แล้วด้วยค่ะ"
1014302-11 = "[s] \"มีเหตุผลที่ชอบว่ายน้ำมั้ย?\""
1014302-12 = "อืม... ที่ฉันชอบ น่าจะเพราะเวลาลงน้ำแล้วรู้สึกเหมือนร่างกายเบาขึ้นน่ะค่ะ"
1014302-13 = "และในความเป็นจริง แรงลอยตัวก็ทำให้รู้สึกหนักตัวน้อยลงด้วยค่ะ"
1014302-14 = "อีกอย่าง การว่ายน้ำเป็นการออกกำลังกายแบบคาร์ดิโอที่ไม่ค่อยกระทบข้อต่อ และเผาผลาญแคลอรีได้ค่อนข้างมาก..."
1014302-15 = "ถ้าทำอย่างสม่ำเสมอ ก็มีข้อดีหลายอย่างเลยค่ะ"
1014302-16 = "แต่ว่าถ้าเป็นสระว่ายน้ำในร่ม ก็จะผสมคลอรีนที่ใช้สำหรับฆ่าเชื้อ... "
1014302-17 = "ถ้าว่ายน้ำในสระในร่มนานเกินไป ก็อาจไม่ดีต่อผิวได้เหมือนกันค่ะ"
1014302-18 = "แต่ถึงจะมีเรื่องนั้นให้ห่วงด้วย ฉันก็ยังคิดว่าการว่ายน้ำเป็นการออกกำลังกายที่ดีค่ะ"
1014302-19 = "แล้วคุณครูว่ายน้ำเก่งมั้ยคะ?"
1014302-20 = "[s1] \"ก็ว่ายได้นิดหน่อยนะ\"\n[s2] \"ก็ไม่ถึงกับว่ายแข็งหรอก\""
1014302-23 = "ฮุฮุ อย่างนั้นเหรอคะ? แต่ถึงอย่างนั้น... ถ้าคุณครูมาถึงตรงนี้ได้ ฉันคงดีใจมากเลยค่ะ"
1014302-24 = "ระดับน้ำก็ลึกแค่อกเท่านั้น ไม่น่าอันตรายหรอกค่ะ"
1014302-25 = "ไม่ต้องกังวลนะคะ ถ้าเกิดอะไรขึ้น ฉันจะช่วยคุณครูเองค่ะ"
1014302-28 = "(คุณครูค่อยๆ เดินไปทางที่ชุนอยู่)"
1014302-31 = "เป็นยังไงคะ คุณครู? รู้สึกเหมือนกำลังนอนอยู่บนเตียงน้ำเลยใช่มั้ยคะ?"
1014302-32 = "[ns] \"เหมือนอยู่บนเตียงน้ำอย่างที่ว่าเลยนะ\""
1014302-33 = "เสียงคุณครูเมื่อกี้ พอฟังผ่านน้ำแล้วมันฟังดูอู้อี้นิดๆ ตลกจังเลยค่ะ!"
1014302-34 = "ถ้าคุณครู... ได้มาลองนอนตรงนี้บ้าง ก็น่าจะดีนะคะ..."
1014302-35 = "คะ? ถ้าทำแบบนั้นแล้วเราสองคนลอยไปตามน้ำ ก็จะเป็นเรื่องใหญ่งั้นเหรอคะ?"
1014302-36 = "ฮุฮุ... ก็จริงนะคะ"
1014302-37 = "แค่คุณครูคอยมองดูฉันอยู่แบบนี้ ก็เพียงพอแล้วค่ะ"
1014302-38 = "(จากนั้นคุณครูก็มองดูเตียงน้ำของชุนต่ออีกสักพัก)"
1014302-41 = ""
1014302-42 = "อยากทานอะไรสักหน่อยมั้ยคะ? มีผลไม้ที่แช่น้ำในหุบเขาไว้ด้วยนะคะ"
1014302-43 = "เดี๋ยวฉันเตรียมให้ค่ะ มีทั้งแตงโม เมลอน ลูกพีช ลูกพลัม แล้วก็องุ่นด้วย... ฉันเตรียมมาเพียบเลยค่ะ"
1014302-44 = "[s] \"เอามาเยอะเกินไปหรือเปล่า...?\""
1014302-45 = "ฮุฮุ ถ้าเหลือก็แค่เอากลับไปเท่านั้นเองค่ะ คุณครูไม่ต้องกังวล แล้วทานให้เต็มที่เลยนะคะ"
1014302-47 = "(ชุนปอกผลไม้ให้อย่างคล่องแคล่ว)"
1014302-48 = "(ระหว่างที่กำลังมองดูอยู่นั้น... ลูกพีชชิ้นหนึ่งก็ถูกป้อนเข้าปากคุณครู)"
1014302-49 = ""
1014302-52 = ""
1014302-53 = "เป็นยังไงคะ คุณครู?"
1014302-54 = "[ns] \"อ้อ... หวานและอร่อยมากเลย\""
1014302-55 = "แล้วก็?"
1014302-56 = "[ns] \"ฉ่ำน้ำมากด้วย...\""
1014302-57 = "ฮุฮุฮุ เป็นเพราะฉันปอกให้หรือเปล่าคะ?"
1014302-58 = "[ns] \"อะ... อื้ม น่าจะเป็นอย่างนั้นนะ...!\""
1014302-59 = "ขอบคุณค่ะ ถ้าอยากทานเพิ่ม ก็บอกฉันได้ทุกเมื่อเลยนะคะ"
1014302-61 = "(คุณครูได้ดื่มด่ำกับผลไม้ฤดูร้อนอย่างเต็มที่พร้อมกับชุน)"
1014302-62 = ""
1014302-63 = "ถ้าอย่างนั้น คุณครูคะ"
1014302-64 = "คุณครูเองก็... อยากนอนบน 'เตียงน้ำ' ดูมั้ยคะ?"
1014302-65 = "[s] \"หืม? ครูด้วยเหรอ?\""
1014302-66 = "ไม่อันตรายหรอกค่ะ เชื่อฉันได้เลย"
1014302-67 = "เคล็ดลับก็คือ ให้ผ่อนแรงออกจากร่างกาย มองขึ้นไปบนท้องฟ้า แล้วนอนให้สบายค่ะ"
1014302-68 = ""
1014302-70 = ""
1014302-71 = ""
1014302-72 = "จากนั้นสูดลมหายใจเข้า แล้วกางแขนขาออกไปทั้งสองข้างเล็กน้อย ร่างกายก็จะค่อยๆ ลอยขึ้นค่ะ"
1014302-73 = "แต่ฉันจะ... คอยช่วยประคองศีรษะคุณครูให้นะคะ"
1014302-75 = "(คุณครูทำตามที่ชุนบอก)"
1014302-76 = ""
1014302-79 = "(แล้วคุณครูก็รู้สึกได้ว่าร่างกายค่อยๆ ลอยขึ้นมาจริงๆ)"
1014302-82 = "เป็นยังไงบ้างคะ?"
1014302-83 = "[ns] \"ได้ยินเสียงของชุนดังอู้อี้จริงๆ ด้วย...\""
1014302-84 = "ใช่มั้ยล่ะคะ?"
1014302-85 = "อ๊ะ แล้วก็รู้สึกสบายตัวมากๆ ด้วยเหรอคะ?"
1014302-86 = "ฮุฮุ... ถ้าค่อยๆ หันศีรษะอย่างระมัดระวัง ก็จะเห็นทิวทัศน์รอบๆ ค่ะ"
1014302-87 = "แต่ถ้าหันมากเกินไป ก็อาจเสียการทรงตัวได้ เพราะงั้นก็ระวังด้วยนะคะ"
1014302-90 = "วันนี้อากาศดีจริงๆ นะคะ"
1014302-91 = "เป็นแสงแดดของฤดูร้อนอย่างแท้จริงเลยค่ะ"
1014302-92 = "ได้ยินเสียงน้ำมั้ยคะ คุณครู?"
1014302-93 = "นี่อาจฟังดูเป็นคำพูดแปลกๆ ก็ได้ แต่พอได้อยู่กับคุณครูสองต่อสองแบบนี้..."
1014302-94 = "ฉันก็รู้สึกราวกับว่าบนโลกนี้เหลือแค่เราสองคนเลยค่ะ"
1014302-95 = "(แรงในร่างกายคุณครูค่อยๆ คลายออก... และความง่วงก็ถาโถมเข้ามา)"
1014302-96 = ""
1014302-100 = "ถ้าเป็นแบบนั้นจริงๆ ก็คงเป็นเรื่องใหญ่เลยนะคะ..."
1014302-101 = "แต่ถ้าเป็นแค่ชั่วครู่ จะเป็นยังไงนะ"
1014302-102 = "(แสงแดดที่ส่องมาสมกับเป็นแดดฤดูร้อนอย่างแท้จริง แม้จะแสบผิวอยู่บ้าง แต่น้ำนั้นกลับเย็นสบาย#nอย่างเหลือเชื่อ)"
1014302-103 = "(เสียงรอบข้างเริ่มค่อยๆ เบาลงทีละนิด...)"
1014302-104 = ""
1014302-107 = "ถ้าเราได้อยู่กันแค่สองคน ในที่ที่ไม่มีใครเห็น..."
1014302-108 = "เหมือนกับตอนนี้..."
1014302-109 = "(ร่างกายของคุณครูล่องลอย... ไปเรื่อยๆ...)"
1014302-110 = "..."
1014302-111 = "ถ้าเป็นแบบนั้น คุณครูอยากทำอะไรเหรอคะ?"
1014302-112 = "[ns] \"zZZ...\""
1014302-113 = "คะ... คุณครู? คุณครูคะ?!?!"
1014302-114 = ""
1014302-116 = ""
1014302-117 = ""
1014302-118 = "จะมาหลับในที่แบบนี้ไม่ได้นะคะ!!!"
1014302-119 = ""
1014302-120 = "[ns] \"เกือบเป็นเรื่องใหญ่เข้าแล้วสิ...\""
1014302-121 = "ฉันก็ตกใจเหมือนกันค่ะ..."
1014302-122 = "ถ้าหลับในน้ำ อุณหภูมิร่างกายจะลดลงจนเป็นอันตรายได้นะคะ"
1014302-123 = ""
1014302-126 = "(ในตอนนั้นเอง คุณครูก็จามออกมา!)"
1014302-127 = "ปะ... เป็นอะไรมั้ยคะ คุณครู?!"
1014302-128 = "อ่า... รู้สึกหนาวสั่นนิดๆ งั้นเหรอคะ?"
1014302-129 = "ได้ยินว่ามีคนเป็นหวัดเวลามาเที่ยวตามริมน้ำในฤดูร้อนเยอะเลยด้วย..."
1014302-130 = "เอาละ นั่งตรงนี้นะคะ ฉันเตรียมผ้าขนหนูผืนใหญ่มาด้วยค่ะ"
1014302-131 = "(ชุนใช้ผ้าขนหนูผืนใหญ่คลุมตัวให้คุณครู)"
1014302-132 = "(จากนั้นก็...)"
1014302-133 = ""
1014302-135 = ""
1014302-138 = "[ns] \"ชะ... ชุน...?\""
1014302-139 = ""
1014302-140 = "ฮุฮุ..."
1014302-141 = "ฉันได้ยินมาว่าการใช้ไออุ่นจากร่างกายคน จะให้ผลที่สุดในการทำให้ร่างกายอบอุ่นค่ะ"
1014302-142 = "ไม่ได้มีความหมายอื่นหรอกนะคะ?"
1014302-143 = "ค่ะ จริงๆ นะคะ"
1014302-144 = "[ns] \"งะ... งั้นเหรอ...?\""
1014302-145 = ""
1014302-146 = ""
1014302-147 = ""
1014302-150 = "(ทันใดนั้น ชุนก็โอบแขนรอบเอวของคุณครู แล้วเอาผ้าขนหนูคลุมมาพันรอบตัวด้วย...!)"
1014302-151 = ""
1014302-152 = "เป็นยังไงบ้างคะ คุณครู"
1014302-153 = "แบบนี้อุ่นขึ้นมากเลยใช่มั้ยคะ?"
1014302-154 = "[s] \"อะ... อุ่นขึ้นจริงๆ...!\""
1014302-155 = "ค่ะ ค่อยยังชั่วนะคะ"
1014302-156 = "หากเกิดอะไรขึ้นกับร่างกายคุณครูแม้เพียงเล็กน้อย ฉันก็คงอดห่วงไม่ได้ค่ะ"
1014302-158 = "(ทั้งสองคนนั่งพิงกันอยู่แบบนั้น จนกระทั่งร่างกายอบอุ่นขึ้น)"
