[translation]
1014302-1 = "계곡과 수영"
1014302-2 = "(슌과 함께 계곡 물가까지 왔다…….)"
1014302-6 = "후우……. 정말 시원하고 맑은 물이네요."
1014302-7 = "[s] \"수영 정말 잘하는구나.\""
1014302-8 = "후후. 과찬이세요. 가라앉지 않는 정도인걸요."
1014302-9 = "아이들을 가르치려면, 저도 물에 어느 정도 친숙할 필요가 있으니까요."
1014302-10 = "물에 들어가는 걸 좋아하는 편이기도 하고요."
1014302-11 = "[s] \"수영을 좋아하는 이유라도 있어?\""
1014302-12 = "음…… 뭔가, 몸이 가벼워지는 느낌이 들어서 좋죠?"
1014302-13 = "실제로도 부력 때문에 무게감이 줄어드는 것도 있고요."
1014302-14 = "그리고 수영은 관절에 무리를 덜 주고, 칼로리 소모량이 상당한 유산소 운동이다 보니……."
1014302-15 = "꾸준히 해 두면, 여러모로 나쁠 것이 없답니다."
1014302-16 = "물론 실내 수영장의 경우 소독 용도로 쓰이는 염소 성분 때문에……."
1014302-17 = "지나치게 장시간 이용하면, 피부에 좋지 않기도 하지만요."
1014302-18 = "하지만 그런 부분을 포함해서도, 수영은 좋은 운동이라고 생각해요."
1014302-19 = "선생님은 수영을 잘하시나요?"
1014302-20 = "[s1] \"그럭저럭인 편이야.\"\n[s2] \"대단치는 않아.\""
1014302-23 = "후후. 그러시군요. 그래도…… 여기까지 와 주시면 기쁠 것 같아요."
1014302-24 = "물 깊이도 가슴 근처 정도니까, 위험하지도 않을 것이고요."
1014302-25 = "걱정하지 마세요. 여차하면 제가 도와드릴게요."
1014302-28 = "(천천히, 슌이 있는 쪽으로 걸어갔다.)"
1014302-31 = "어떠세요, 선생님? 지금 뭔가, 물침대에 누워 있는 것 같지 않으세요?"
1014302-32 = "[ns] \"말 그대로네.\""
1014302-33 = "지금 선생님 말씀, 물을 타고 웅웅거리는 식으로 들려서 재미있어요!"
1014302-34 = "선생님도…… 여기 누워 보시면 좋을 텐데……."
1014302-35 = "네? 그러다 둘 다 떠내려가면 큰 일 나는 것 아니냐고요?"
1014302-36 = "후후……. 그것도 그렇겠네요."
1014302-37 = "그냥 이렇게 선생님이 절 지켜봐 주시는 것도, 충분히 좋으니까요."
1014302-38 = "(그렇게 조금 더 슌의 물침대를 지켜보았다.)"
1014302-42 = "뭔가 드시고 싶지 않으세요? 계곡물에 담가 둔 과일이 있답니다."
1014302-43 = "제가 준비해 드릴게요. 수박과 멜론, 복숭아, 자두, 포도까지…… 있는 힘껏 준비해 왔거든요."
1014302-44 = "[s] \"너무 많은 것 같은데……?\""
1014302-45 = "후후. 남으면 남은 대로 다시 가져가면 되니까, 걱정하지 말고 마음껏 드세요."
1014302-47 = "(슌은 능숙한 손길로 과일을 깎았다.)"
1014302-48 = "(그 모습을 지켜보고 있으려니…… 다음 순간 입에, 복숭아 한 조각이 들어왔다.)"
1014302-53 = "어떠세요, 선생님?"
1014302-54 = "[ns] \"아, 아주 달고 맛있어.\""
1014302-55 = "그리고요?"
1014302-56 = "[ns] \"물기도 많고…….\""
1014302-57 = "우후후. 제가 깎아 드린 덕분일까요?"
1014302-58 = "[ns] \"으, 응. 그런 것 같아……!\""
1014302-59 = "감사합니다. 더 드시고 싶으면 얼마든지 말씀해 주세요?"
1014302-61 = "(슌과 함께, 실컷 여름의 과일을 만끽했다.)"
1014302-63 = "그러면, 선생님."
1014302-64 = "선생님도 '물침대'…… 해 보시겠어요?"
1014302-65 = "[s] \"어? 나도?\""
1014302-66 = "괜찮아요. 저만 믿으세요."
1014302-67 = "요령은, 몸에 힘을 빼고 하늘을 바라보며 편히 누우시면 된답니다."
1014302-72 = "그런 다음 숨을 들이마시고 팔다리를 좌우로 약간 벌리면, 천천히 몸이 떠오르게 되죠."
1014302-73 = "하지만 혹시 모르니…… 제가 선생님의 머리를 받쳐 드릴게요."
1014302-75 = "(슌의 말대로 했다.)"
1014302-79 = "(그러자 정말로 천천히 몸이 떠오르는 것이 느껴졌다.)"
1014302-82 = "어떠세요?"
1014302-83 = "[ns] \"정말로 슌의 목소리가 웅웅거리면서 들리네…….\""
1014302-84 = "그렇죠?"
1014302-85 = "아, 그리고 엄청나게 편안하시다고요?"
1014302-86 = "후후……. 고개를 조심스럽게 돌리시면, 주위 경치가 보인답니다."
1014302-87 = "너무 많이 돌리면 중심을 잃을 수도 있으니, 조심해 주시고요."
1014302-90 = "오늘은 날씨가 정말 좋네요."
1014302-91 = "그야말로, 여름의 햇살이에요."
1014302-92 = "물소리가 들리세요, 선생님?"
1014302-93 = "이상한 말처럼 느껴지실 수도 있겠지만, 이렇게 선생님과 단둘이 있으려니……."
1014302-94 = "꼭, 세상에 우리 둘만 남겨진 것 같네요."
1014302-95 = "(몸에서 힘이 빠져나가며…… 나른한 기운이 몰려왔다.)"
1014302-100 = "정말로 그렇게 된다면 너무 큰 일이겠지만……."
1014302-101 = "어떨까요. 그게 잠시만이라면."
1014302-102 = "(햇살은 여름 태양 빛 그대로여서 따가울 정도였지만, 물은 한없이 시원하기만 했다.)"
1014302-103 = "(주위의 소리가 조금씩 작게 들리기 시작했다…….)"
1014302-107 = "아무도 보는 사람이 없는 곳에서, 우리 둘만 있을 수 있다면……."
1014302-108 = "마치, 지금처럼……."
1014302-109 = "(둥실둥실, 둥실둥실…….)"
1014302-110 = "……."
1014302-111 = "그렇게 된다면 선생님은, 뭘 하고 싶으신가요?"
1014302-112 = "[ns] \"흠냐흠냐…….\""
1014302-113 = "서, 선생님? 선생님?!?!"
1014302-118 = "이런 곳에서 주무시면 안 돼요!!!"
1014302-120 = "[ns] \"큰일 나는 줄 알았네…….\""
1014302-121 = "저도 깜짝 놀랐어요……."
1014302-122 = "물에서 잠들면 체온 저하로 위험하니까요."
1014302-126 = "(그 순간 재채기가 나왔다!)"
1014302-127 = "괘, 괜찮으신가요, 선생님?!"
1014302-128 = "아……. 조금 으슬으슬한 기분이 드신다고요?"
1014302-129 = "의외로 여름 물가에서 감기에 걸리는 경우가 많다고 하니까요……."
1014302-130 = "자, 여기 앉으세요. 큰 수건을 준비해 왔답니다."
1014302-131 = "(슌이 커다란 수건으로 몸을 덮어주었다.)"
1014302-132 = "(그리고…….)"
1014302-138 = "[ns] \"슈, 슌……?\""
1014302-140 = "……후훗."
1014302-141 = "사람의 몸을 덥히는 데에는, 사람의 체온이 가장 효과적이라고 하더라고요."
1014302-142 = "다른 뜻은 없답니다?"
1014302-143 = "네. 정말로요."
1014302-144 = "[ns] \"그, 그래……?\""
1014302-150 = "(다음 순간, 슌이 허리에 팔을 감아 오더니 수건을 같이 둘렀다……!)"
1014302-152 = "어떠세요, 선생님."
1014302-153 = "이걸로 훨씬, 따듯하시죠?"
1014302-154 = "[s] \"화, 확실히……!\""
1014302-155 = "네. 다행이에요."
1014302-156 = "만에 하나 선생님 몸에 무슨 일이 생긴다면, 저도 걱정이니까요."
1014302-158 = "(우리는 그렇게, 따듯해질 때까지 서로에게 몸을 기대며 앉아 있었다.)"
