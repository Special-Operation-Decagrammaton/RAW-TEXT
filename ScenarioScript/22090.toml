[translation]
22090-1 = "제9화;가혹한 진실 1"
22090-7 = "[ns] \"츠카츠키, 리오……?\""
22090-8 = "선생님, 저 사람……. 밀레니엄 학원의 회장이에요……."
22090-9 = "……회, 회장이 왜, 여, 여, 여기에……."
22090-10 = "…………"
22090-12 = "그래, 내가 바로 밀레니엄 사이언스 스쿨의 중추── 세미나를 이끄는 이이자."
22090-13 = "<천년 난제>의 해결을 바라며 별을 쫓는 자."
22090-14 = "본래라면 샬레의 선생인 당신과는 먼저 정식으로 인사를 나누는 자리를 마련하는 편이 좋았겠지만."
22090-15 = "오늘은 그런 이유로 찾아온 게 아니니까."
22090-16 = "[s] \"그러고 보니 진실을 알려준다고…….\""
22090-17 = "맞아. 진실."
22090-18 = "당신과 거기 있는 게임개발부의 학생들은 바로 수일 전에 있었던 <사건>으로 하나의 생각에 도달했을 거야."
22090-19 = "이제껏 친구라고 생각해왔던 이가 보인, 전혀 예상치 못한 모습…… 그로 인해 발생한 파괴와 혼란."
22090-20 = "그런 일을 겪게 된다면 누구라도 자연스럽게 이런 생각을 떠올릴 수밖에 없겠지."
22090-25 = "<이제껏 친구라고 생각해왔던 이가, 어쩌면 그렇지 않았을지도 모른다>……라는 자각을."
22090-26 = "그렇지 않아? 샬레의 선생."
22090-27 = "……!!"
22090-31 = "[ns] \"잠깐, 리오. 너, 무슨 소리를…….\""
22090-32 = "단도직입적으로 말하겠어."
22090-35 = "당신이 등 뒤에 두고 있는 그 소녀……"
22090-36 = "아니, 소녀의 외견을 갖춘 <그것>은 당신들의 생각처럼 평범한 학생이 아니야."
22090-37 = "너희들이 아리스라 이름 붙인 그것의 진짜 정체는……."
22090-40 = "──미지의 영역에서 침탈해오는 [ruby=Divi:Sion]<불가해한 군대>[/ruby]의 명령권자이며,"
22090-41 = "<이름 없는 신>을 숭배하는 무명사제들이 추대한 <오파츠>이자, 키보토스의 옛 주민들이 남긴 유산──"
22090-42 = "그들에게 불리기를, 그 진정한 이름은 바로……"
22090-44 = "<이름 없는 신들의 왕녀: AL-1S>"
22090-51 = "[ns] \"이름 없는……. 뭐?\""
22090-52 = "아리스는……"
22090-53 = "아리스는…… 무슨 이야기인지, 이해할 수 없습니다……."
22090-54 = "맞아요! 무슨 소리를 하는 건가요?!"
22090-55 = "자기만의 독자 설정을 남에게 일방적으로 떠들기만 해서는 제대로 이야기가 되지 않는다고요?!"
22090-56 = "언니가 곧잘 그랬던 덕분에, 저 잘 알고 있으니까! 멋대로 아리스에게 이상한 설정 붙이지 말라고요!"
22090-58 = "미, 미도리……."
22090-59 = "그렇네. 미안해. 내가 배려가 부족했을지도 모르겠어."
22090-60 = "좀 더 이해하기 쉽도록 너희들이 자주 하는 <게임>에 빗대어 설명해 줄게."
22090-64 = "요컨대 아리스, 너라는 존재는──"
22090-65 = "처음부터 이 세계를 멸망시키기 위해 태어난 <마왕>이란 거야."
22090-66 = "……!!"
22090-67 = "[s] \"아리스가…… 마왕?\""
22090-68 = "또 그런 억지 같은……"
22090-69 = "어째서 그런 말을 하는 건가요?! 뭘 꾸미고 있길래!"
22090-70 = "꾸미는 건 아무것도 없어. 도리어 나는 너희들에게 묻고 싶어."
22090-71 = "이미 너희들은 직접 보고 경험했을 테지. 디비전과 아리스가 접촉하고 일어난 일을."
22090-72 = "[s] \"디비전이라는 건 분명, 그때의…….\""
22090-80 = "[ns] \"그…… 기괴하게 생겼던 로봇……?\""
22090-81 = "그래. 맞아."
22090-82 = "해당 콘택트는 이쪽의 미스였어."
22090-83 = "C&C와 AMAS를 통해 전부 추적하고 있다고 생각했는데, 설마 개중에서 감시망을 빠져나간 개체가 있었을 줄이야."
22090-84 = "그것은 분명 나의 실책. 사과할게."
22090-88 = "네, 넷? 사과? 회장이, 어……?"
22090-89 = "하지만."
22090-90 = "[s] \"하지만?\""
22090-91 = "덕분에 내가 가설로만 세워 두었던 위협이 실재한다는 것 또한 증명되었어."
22090-93 = "단언하자면 너희들이 접했던 그 존재들은 폐허에서 쏟아져 나오기 시작한 재해."
22090-94 = "밀레니엄에…… 나아가 키보토스에 멸망을 초래할 악몽."
22090-95 = "아리스의 존재 자체가 폐허로부터 그들을 불러들이고 있어."
22090-97 = "이번엔 운 좋게 반쯤 망가진 폐기물과 접촉하는 것에 그쳤지만,"
22090-98 = "다음은 이 정도로 끝나지 않을 거야."
22090-110 = "[ns] \"…………\""
22090-111 = "한시라도 빨리 이 위협을 해결할 수 있는 방법은 하나뿐이야, 아리스."
22090-112 = "해결, 할 수 있는 방법……?"
22090-113 = "그래. 아리스, 네가 사라져야 해."
22090-114 = "이 세계를 위해, 너는 존재해서는 안 되는 거야."
22090-115 = "……………그런……."
22090-116 = "아리스는…… 그저…… 용사가……"
22090-117 = "함께…… 게임을……. 퀘스트를 하고 싶었던 것…… 뿐인데……."
22090-118 = " 그럴 수 없어."
22090-119 = "나는 게임에 대해서는 잘 모르지만……. 사전적인 지식이라면 충분히 갖추었다고 자신하고 있어."
22090-123 = "그러니 이쪽에서 질문이야."
22090-124 = "너는 자신을 용사라고 부르고 있지만……"
22090-128 = "애당초 너희들이 말하는 용사란 친구를 공격하고 상처 입히는 존재야?"
22090-130 = "오히려 그건 용사가 쓰러트려야 할 [ruby=마왕]악당[/ruby]의 역할이지 않아?"
22090-134 = "……!"
22090-138 = "아리스 쨩! 저딴 말 들을 필요 없어!"
22090-139 = "세미나의 학생회장이 괴짜라고는 들었지만! 이 정도일 줄은 몰랐어!"
22090-141 = "서…… 선생님……!"
22090-143 = "[ns] \"……리오, 그만해.\""
22090-144 = "그만하라고? 무엇을?"
22090-145 = "선생, 명백한 사실에서 고개를 돌리는 건 자비나 배려 같은 게 아니야."
22090-146 = "그건 단순한 <방기>일 뿐. 그런 행동은 지극히 비합리적이야."
22090-147 = "[s] \"합리니, 비합리의 문제가 아니라…….\""
22090-148 = "그렇다면 아리스는……"
22090-149 = "아리스가…… 어떻게 하면 되는 건가요……?"
22090-150 = "방법이라면 간단해."
22090-151 = "모든 위기는 아리스, 네가 이곳에 있기 때문에 생기는 거야."
22090-152 = "너의 존재가 곧 문제의 핵심이자, 폭탄인 셈이지."
22090-153 = "그리고 문제의 원인이 명확하다면 해결하는 방법 또한 명확한 것이 간단한 이치."
22090-154 = "폭탄이 있다면 안전한 곳으로 가져가서 해체하면 돼."
22090-155 = "폭탄을…… 해체……?"
22090-156 = "아…… 알아듣기 어려웠으려나? 간단히 말하자면, 그래."
22090-163 = "네 헤일로를 파괴하면 된다는 소리야."
22090-170 = "?!?!?!?!?!?!?!"
22090-175 = "아니, 애당초 너의 그건 정말로 헤일로가 맞는 걸까?"
22090-176 = "인간이 아닐 네가 어째서 헤일로를 가지고 있는지 이유는 알 수 없지만."
22090-177 = "그저 기계일 뿐인 네가 헤일로를 가지고 있는 건……"
22090-178 = "그래. 마치, 광기에 휩싸인 그 AI와 같아."
22090-179 = "……그렇다면 더더욱, 너를 내버려 둘 수 없어."
22090-180 = "[s] \"리오.\""
22090-182 = "[ns] \"그 이상의 폭언은 용납못해.\""
22090-183 = "……나의 언행이 불쾌했다면 사과할게."
22090-184 = "예전부터 나를 싫어하는 사람은 많았어."
22090-185 = "──그건 나에게 문제가 있다는 거겠지."
22090-186 = "하지만 이해받지 못한다 해도 괜찮아. 나는 모두를 위험에서 지키고 싶을 뿐이니까."
22090-187 = "자, 네 차례야. 미카모 네루."
22090-194 = "……!"
22090-195 = "네루…… 선배……."
22090-196 = "………"
22090-200 = "[ns] \"네루……?\""
22090-201 = "…………"
22090-202 = "너무 유감스럽게 생각하진 말아줘."
22090-203 = "C&C는 원래부터 세미나…… 보다 정확히 말하자면 나의 지시로 움직이는 에이전트 동아리야."
22090-204 = "사적인 감정은 없어. 이건 단순히 해야 할 일을 할 뿐이야."
22090-205 = "C&C의 리더── 네루의 실력이라면, 제아무리 선생이라고 할지라도 게임개발부 인원들만으로는 저항할 수 없어."
22090-206 = "설사 외부에 도움을 요청한다고 할지라도, 이미 이곳 근처는……."
22090-214 = "나의 AMAS로 장악이 끝난 상황이야. 도움이 도착하기도 전에 일 처리가 끝나겠지."
22090-215 = "자, 이제 일을 할 차례야, 아리스를 회수하도록 해. 네루."
22090-217 = "…………."
22090-218 = "네루 선배……."
22090-222 = "……훗."
22090-223 = "훗……?"
22090-227 = "으아아아……! 이러쿵저러쿵 짜증나서 못 해 먹겠네!"
22090-231 = "잠깐, 갑자기 이쪽을 향해 공격이라니, 네루…… 무슨………."
22090-236 = "[ns] \"네루……!\""
22090-238 = "……네루 선배?"
22090-239 = "평소에도 시키는 일이 마음에 들었던 적이 별로 없는데."
22090-240 = "이번엔 아예 같은 학교 학생을…… 그것도 뭣도 모르는 애를 납치하라고?"
22090-241 = "안 해! 배 째!"
22090-242 = "리오, 네 녀석의 말도 안 되는 헛소리를 언제까지 참아줄 거라고 생각하는 거냐고! 아앙?!"
22090-243 = "네루…… 여기서 배신을 하겠다고?"
22090-244 = "배신? 하! 웃기시네! 나는 그냥 마음에 들지 않는 지시는 따를 생각이 없을 뿐이라고!"
22090-246 = "그래, 그렇다는 거구나……."
22090-247 = "네루, 넌 언제나 그랬어."
22090-248 = "기분에 따라 명령을 어기는 것도 서슴지 않는 그 태도."
22090-249 = "언제 터질지 모르는 그런 폭탄 같은 면이 너의 장점이자…… 가장 귀찮은 점이었지."
22090-250 = "……그렇기에 이 상황조차 전부 상정했지만 말이야."
22090-251 = "처음부터 이 자리에 C&C 전원이 아닌, 너만 부르길 잘했네."
22090-252 = "아앙? 뭐?"
22090-253 = "토키. 네 차례야."
22090-258 = "[ns] \"네루?! 위험해!\""
22090-259 = "앙?"
22090-268 = "쿨럭쿨럭! 웬 놈이야?!"
22090-274 = "처음 뵙겠습니다. 선배님. 그리고 선생님."
22090-275 = "C&C소속, 콜사인 제로포. 인사드립니다."
22090-276 = "어…… 다섯 번째……?"
22090-277 = "[s] \"또 다른 C&C 멤버……?\""
22090-278 = "갑자기 등 뒤에서 습격해 오셨겠다……!"
22090-279 = "내가 이대로 가만히 있을 줄 알고……!"
22090-280 = "[ns] \"네루, 자, 잠깐……!\""
