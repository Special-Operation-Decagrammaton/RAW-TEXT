[translation]
10057030-1 = "第3話;何の用事で来たのか"
10057030-2 = "エリナって、本当に変な子だと思いません？"
10057030-3 = "いっつも、あの調子なんです。口を開いたら皮肉ばっかり！"
10057030-4 = "言ってることがめちゃくちゃなんです！エリナが開発した安っぽいプリンみたい！"
10057030-5 = "あのー、全部聞こえてるんですけど～？#nカーテンごしの声ってよーく通るんだよね～？"
10057030-6 = "というか、それ言うならアンナが言ってることの方がおかしいっての～"
10057030-7 = "それに……#nアンナの安っぽい機械より、私の「H2O過剰添加プリン」のほうがマシだし？"
10057030-8 = "安っぽいんじゃなくて、最適化って言ってちょうだい。「費用対効果」って言葉、知らないの？"
10057030-9 = "というか……冷たい風が入ってきてるから、ストーブを強くしてちょうだいよ！"
10057030-10 = "そもそもエリナがガスバルブを閉め忘れたから、#nキッチンの壁が吹き飛んでこんな目にあってるんでしょーが！"
10057030-11 = ""
10057030-13 = ""
10057030-14 = "う、うるさーい！ズルーッ！！"
10057030-15 = ""
10057030-17 = ""
10057030-18 = "……「意見交換」1回目。"
10057030-19 = ""
10057030-20 = "[ns] \"2人とも、落ち着いて！\""
10057030-22 = "[ns1] \"もう少し、みんなのことを教えてくれる？\"\n[ns2] \"みんなは、普段何しているの？\""
10057030-25 = ""
10057030-26 = "やっぱり、先生には正直にお話しします。"
10057030-27 = "別に嘘はついてないんだけどね～"
10057030-28 = "編集も加工の一種だから、完全な事実とは言えない。全部話したほうがいいと思う。"
10057030-29 = "「科学者は事実で勝負する」って本で読んだ。"
10057030-30 = "うーん……。"
10057030-31 = "ん～……。"
10057030-32 = ""
10057030-34 = ""
10057030-35 = "……実は、183号特別クラスは懲戒処分を受けた生徒が送られるクラスなんです。"
10057030-36 = "訳あって、停学処分の代わりに事務局から依頼された研究をしています。"
10057030-37 = "私はクラスの研究課題を管理しながら……#n個人の課題として、最低限の設備で安価な物を設計し――"
10057030-38 = "余った時間は、#nみんなで外部からの依頼を受けてお小遣いや戦車製作の費用を稼いでいるんです。"
10057030-39 = "[s] \"停学処分？\""
10057030-40 = "ううっ、お話しするのも恥ずかしいのですが……。"
10057030-41 = "私はチェリノ会長専用の戦車を設計する、主席エンジニアでした。"
10057030-42 = "低予算の中、無茶な要求どおり作ったものが……#nよりにもよってパレード中に壊れてしまって――"
10057030-43 = "泥に落ちてしまったチェリノ会長に特別クラスへの降格を命じられたんです。"
10057030-44 = "100回上手くやっても、一度失敗したら左遷だなんて……。"
10057030-45 = "できないならできないって言えばよかったのにね～"
10057030-46 = "まぁ、私はちょっと挑戦しすぎちゃっただけっていうか……。"
10057030-47 = "公衆衛生を化学で解決しようとしたら、#nあのニセ髭に問答無用でぽいっとされちゃったんですよね～あははっ！"
10057030-48 = "[s] \"何があったの？\""
10057030-49 = "私は、事務局に……あ～あれ、何だっけ……？"
10057030-50 = "ほら、あるでしょ？蛇口をひねると出てくるもの……！"
10057030-51 = "[s] \"水道水？\""
10057030-52 = "それそれ！もー、す～ぐ単語が出てこなくなっちゃう……。"
10057030-53 = "と、とにかく！水道水を化学処理で浄化する研究をしろって言われたんですよ。"
10057030-54 = "たしかに、水道水がきれいなら風邪をひくこともなくなるし……ってわけでやってみることにしたんですけど……。"
10057030-55 = "問題は……オゾンや塩素で処理する設備が、予算の100倍以上するってことです！"
10057030-56 = "だから代わりに、エタノールで消毒しました！#n消毒効果はすごく良かったんですが――"
10057030-57 = "消毒後、エタノールを抜くのをうっかり忘れて、そのまま水道設備を稼働させてしまい――"
10057030-58 = "[s] \"エタノールって……あ……。\""
10057030-59 = "学園全体を揺るがす、とんでもない大事件でした。#n先生にも、あの時の秘書室長の顔を見てもらいたかったです。"
10057030-60 = "うっ……！思い出すだけで頭が痛くなる……。"
10057030-61 = "あの時は本当に大変だったのよ……！？"
10057030-62 = "悪いのは、私じゃなくて予算をケチった事務局側でしょ！"
10057030-63 = "エリナがちゃんと勉強してなかったからじゃないの？"
10057030-64 = "ちゃんと勉強しましたけど～？#n化学者でもないのに適当なこと言うな！"
10057030-65 = "メスフラスコを加熱する化学者様、ねぇ……。"
10057030-66 = "メスフラスコは混合と滴定にのみ使用するって、#n教科書にも書いてあるレベルの知識じゃないかしら？"
10057030-67 = "わ～、知りませんでしたぁ～#n化学専攻の人間に講義までしてくださるなんて～#n学級委員長のアンナ様はすっばらしいですねぇ～"
10057030-68 = "ふんっ、分かってるならこれで勘弁してあげる。"
10057030-69 = "エリナはバカだからぁ～#n今アンナ様が飲んでいるカップにアンモニアを入れたことも忘れてましたぁ～"
10057030-70 = ""
10057030-72 = ""
10057030-74 = "ブーッ！！！"
10057030-75 = ""
10057030-78 = "よくもやったわね！？覚悟しなさい！！！"
10057030-79 = "べーだ！覚悟するのはそっちだよ～"
10057030-84 = "……今日はお客さんがいるから、2人とも元気がいいですね。"
10057030-87 = ""
10057030-88 = "はぁっ……はぁっ……。"
10057030-89 = "ぜーっ……はーっ……。"
10057030-90 = ""
10057030-94 = "説得を目的としていないので非公式試合となり、勝敗も無し。"
10057030-95 = ""
10057030-98 = ""
10057030-99 = ""
10057030-100 = ""
10057030-101 = "……今はここで、#n「水でかさ増しした、見た目だけはまともなプリン」を研究しています。"
10057030-102 = "水の量が多すぎて、軽く息を吹きかけるだけでどろっと……。"
10057030-103 = "うあー！こんな何もない山奥なんて、もぉーやだー！"
10057030-104 = "ラナは可愛いからいいけど、このゴチャゴチャうるさいのが学級委員長なんて最悪！"
10057030-105 = "私だって！エリナが副学級委員長なんて本当に最悪よ！"
10057030-106 = "ふんっ！！"
10057030-107 = "[s] \"じゃあ、ラナは？\""
10057030-108 = "私は、何かミスをしたわけではありません。"
10057030-110 = "たしかに、ラナはそうよね……。"
10057030-111 = "この中だと、ラナが一番かわいそうかも……。"
10057030-112 = "入学してすぐこっちに連れてこられたんだから。"
10057030-114 = "そのとおりです。私は入学してから何か問題を起こしたわけではありません。"
10057030-115 = "ただ――入学試験を受けただけです。"
10057030-116 = "[s] \"受験しただけでここに？\""
10057030-117 = "実は、試験のマークシートに欠陥があったんです。"
10057030-118 = "具体的には、点数を任意で入力できるようになっていました。#nなので、自分で点数をマークしました。"
10057030-119 = "結果――42億9496万7295点だったので、ここに連れてこられたんです。"
10057030-120 = "システムが32ビットだったのが残念でした。#n64ビットなら1844京6744兆737億955万1615点だったのに。"
10057030-122 = "ひどいと思いませんか？#nそこにやれる土壌があるのなら、試したくなるものでしょう？"
10057030-123 = "183号に来てなかったら、ラナは私に続くアカデミーのホープだったのに！"
10057030-124 = "どう考えても、悪いのはラナじゃなくてマークシートの方なのにね！"
10057030-126 = "その結果、ここに来て……#nやることといったらレッドウィンター内の電算管理くらいです。"
10057030-127 = "そうだ。頼まれていたもの、ちゃんと買ってきたよ。"
10057030-128 = "おお～！ラナ、ありがと～！"
10057030-129 = ""
10057030-131 = ""
10057030-132 = ""
10057030-133 = "ん……？牛乳が……6本？あれ？"
10057030-134 = "「牛乳を買ってきて。もしアボカドがあれば6つ買ってきて」って言ってたよね。"
10057030-135 = "だから、アボカドがあったので、牛乳を6本買ってきた。"
10057030-136 = "条件文どおりに実行したってこと……？"
10057030-137 = "何か間違えてた？"
10057030-138 = "……いや～、全然！流石ラナだね～！"
10057030-139 = "……ということで、183号特別クラスはここにいる3人で全員です。"
10057030-140 = "[s] \"3人……？どうして立てている指は2本なの？\""
10057030-141 = "3人だから、です。"
10057030-142 = "[s] \"？？？？？？\""
10057030-143 = "3人で十分な研究成果を出せば解放してくれるというので、#nこの山奥で毎日研究ばかりしているんです。あは、あはは……。"
10057030-144 = "私たち……どうしたら恩赦をもらえるか、ずっと考えてたんだよね～"
10057030-145 = "研究はちゃんとやってるけど、それだけじゃダメっぽいし～？"
10057030-146 = "そしたら、チェリノ会長がこの間ラジオでこう言ってたんです！"
10057030-147 = "「次のゲヘナカップでは、絶対にレッドウィンターが勝つのだ！」って。"
10057030-148 = "優勝した生徒には最高の報酬を出すと聞いて、これはチャンスだー！って。"
10057030-149 = "[s] \"ゲヘナカップ？\""
10057030-150 = "ああ、ゲヘナカップというのはキヴォトス各地の強豪が集まる戦車のリーグ戦です。"
10057030-151 = "種目は戦車レースだけ。主催が毎回変わる晄輪大祭とは違い、ゲヘナ学園が主催しています。#nかなりの賞金が出るので、キヴォトス中の学園が参加するんですよ。"
10057030-152 = "予選からレベルが高くて、出場するだけでもかなり大変なんですが……#nもし仮に優勝したら――"
10057030-153 = "――キヴォトス最高の戦車として認められるんです！"
10057030-154 = "化学者として、こんな栄誉を逃すなんてあり得ません！"
10057030-155 = "それに、ここから抜け出せる絶好のチャンスだし！"
10057030-156 = ""
10057030-158 = ""
10057030-159 = "けど問題は……レッドウィンターの予選まであと4日ってこと！"
10057030-160 = "砲塔も、装備もない。それに、仮に部品を作ったとしても――"
10057030-161 = "肝心の設計が決まっていないんです。"
10057030-162 = "だから、私の言うとおりにやればいいのに！"
10057030-163 = "そんなことしたら、失敗作しかできないじゃん！"
10057030-164 = "「変なデザイン協会」の会長にもなりたいわけ！？"
10057030-165 = "ほんっと、憎まれ口だけは勲章ものよね！"
10057030-167 = ""
10057030-169 = "こうしてすぐに喧嘩を始めるので、先生に助けていただこうと思ったのです。"
10057030-170 = "先生は奇跡を起こせて、キヴォトス中の生徒を助けていると聞きましたから。"
10057030-172 = "今回は私の言う通りにすべきですよね、先生？"
10057030-173 = "いやいや！私でしょ～！？"
10057030-174 = ""
10057030-176 = ""
10057030-178 = "[ns] \"一方の肩を持つことはできないよ。\""
10057030-180 = "[ns] \"その代わり、科学的で公平な方法があるんだけど……。\""
10057030-181 = ""
10057030-183 = ""
10057030-184 = "そんな方法があるんですか！？"
10057030-185 = "何か分からないけど、めっちゃ良さそう！"
10057030-186 = ""
10057030-188 = ""
10057030-189 = "[ns] 「大人の解決策」を提示する。"
10057030-191 = ""
10057030-192 = ""
10057030-193 = "え？"
