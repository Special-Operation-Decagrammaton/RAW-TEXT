[translation]
10057030-1 = "제3화;무슨 일로 왔느냐"
10057030-2 = "에리나! 그 애 진짜 이상하지 않아요?"
10057030-3 = "맨날 그런 식이에요. 입만 열면 빈정거리기만 해요!"
10057030-4 = "하는 말도 죄다 엉망진창이에요! 걔가 연구하는 싸구려 푸딩처럼요!"
10057030-5 = "저기, 안 미안한데 다 들리거든? 우리 벽 대신 커튼 치고 사는 거 잊었냐?"
10057030-6 = "그렇게 따지면 안나 네가 하는 말이 더 이상하거든?"
10057030-7 = "그리고, 네가 맨날 싸구려 기계 만들려고 하는 것보단 내 일산화이수소 과첨가 표면장력 임계치 푸딩이 더 낫거든?"
10057030-8 = "싸구려가 아니라 최적화거든? 너는 가성비도 모르니?"
10057030-9 = "됐고, 찬바람 들어오니까 거기 난로나 더 세게 틀어!"
10057030-10 = "네가 가스 밸브 잠그는 거 깜빡해서 주방 벽이 날아간 바람에 찬바람 들어오잖아!"
10057030-14 = "시, 시끄러! 쿨-쩍-!!"
10057030-18 = "……'의견 교환', 1."
10057030-20 = "[ns] \"저기, 일단 싸우지 말고!\""
10057030-22 = "[ns1] \"각자 자기소개를 좀 더 해주겠니?\"\n[ns2] \"183호가 구체적으로 뭘 하는지도…….\""
10057030-26 = "역시, 선생님께는 솔직하게 말씀드릴게요."
10057030-27 = "딱히 거짓말은 한 건 아닌데~"
10057030-28 = "편집도 가공한 거니까, 완전한 사실은 아냐. 다 말씀드리는 게 좋다고 생각해."
10057030-29 = "과학자는 사실로 승부한다'고, 책에서 읽었어."
10057030-30 = "으음……."
10057030-31 = "으음……."
10057030-35 = "……사실, 183호 특별반은 징계 처분을 받은 학생들이 보내지는 반이에요."
10057030-36 = "각자 여러 가지 이유로 정학 처분 대신에, 사무국이 내려주는 연구과제를 수행하고 있어요."
10057030-37 = "저는 특별반 연구과제를 관리하면서, 제 과제로는 최소한의 설비로 값싸게 물건을 만드는 설계를 하고 있고요,"
10057030-38 = "남는 시간에는 다 같이 외부 의뢰를 받아 용돈이나 전차제작 비용을 벌고 있어요."
10057030-39 = "[s] \"정학 처분?\""
10057030-40 = "으윽, 말씀드리기는 조금 부끄럽긴 한데……."
10057030-41 = "원래 저는 체리노 회장의 전용 전차를 설계했었어요. 수석 최선임 기술자였는데요,"
10057030-42 = "그런데, 없는 예산에 무리한 요구사항대로 만든 부품이 하필 퍼레이드 때 부서지는 바람에……"
10057030-43 = "진흙탕에 빠진 체리노 회장이 특별반으로 좌천시켜버렸어요."
10057030-44 = "백 번 잘해도 한 번 그렇게 됐다고 좌천이라니이……."
10057030-45 = "그러니까, 못 할 것 같으면 못 하겠다고 말하던지~"
10057030-46 = "뭐어, 저는 좀 지나치게 도전했달까……."
10057030-47 = "공중 위생을 화학으로 해결하려다가, 그 짝퉁 수염한테 휙 하고 쫓겨난 거예요~ 아하핫!"
10057030-48 = "[s] \"뭔가 억울한 일이 있었니?\""
10057030-49 = "네! 사무국에서 저한테…… 아 그거 뭐더라……?"
10057030-50 = "그거 있잖아요? 수도꼭지 돌리면 나오는 거……!"
10057030-51 = "[s] \"수돗물?\""
10057030-52 = "네! 그거요! 아휴, 갑자기 단어가 안 떠오른다니깐."
10057030-53 = "아, 아무튼! 상수도 시설의 화학 소독 연구를 하라는 거예요."
10057030-54 = "뭐어, 수돗물이 깨끗하면 지긋지긋한 감기도 좀 덜 걸리고? 일단 하기로 했어요."
10057030-55 = "문제는, 시설 소독을 염소나 오존으로 하면 예산의 100배 이상 든다는 거죠!"
10057030-56 = "그래서, 에탄올로 소독했어요! 소독 효과는 엄청 좋았는데-"
10057030-57 = "소독 후에 에탄올을 빼는 걸 깜빡하고 그대로 수도 설비를 가동시켜서~"
10057030-58 = "[s] \"에탄올이면……. 아…….\""
10057030-59 = "학원 전체가 난리도 아니었죠. 비서실장의 얼굴, 장난이 아니었어요."
10057030-60 = "으윽……! 생각만 해도 머리가 지끈거려……."
10057030-61 = "그때는 진짜 큰일이었다구!"
10057030-62 = "따지고 보면 화학이 문제가 아니라, 예산 쥐꼬리만큼 준 사무국이 문제잖아!"
10057030-63 = "너가 공부를 안 하니까 그렇게 된 거 아니야? 공부 좀 하는 게 어때?"
10057030-64 = "공부는 충분히 했거든? 화학자도 아니면서 아무 말이나 하지 마!"
10057030-65 = "너는 화학자라면서 저번처럼 메스 플라스크에 열을 가하는 게 정상이니? 참……."
10057030-66 = "메스플라스크는 혼합이나 적정용도로만 쓰는 거, 교과서에도 있지 않아?"
10057030-67 = "와~ 몰랐어~ 화학 전공자에게 강의도 하시고, 반장인 안나님은 정말 대~단하시군요~"
10057030-68 = "흥, 알면 됐어."
10057030-69 = "에리나는 바보라서~ 대 과학자 안나님이 지금 차 마시는 컵으로 암모니아 담았던 것도 까먹었네요-"
10057030-74 = "푸우웃-!!!"
10057030-78 = "일부러 한 거지!! 너 죽었어!!!"
10057030-79 = "일부러 했다, 어쩔래!! 뎀벼!!!"
10057030-84 = "……오늘은 두 사람 모두 손님맞이로 유독 활기차군요."
10057030-88 = "헉…… 허억……."
10057030-89 = "허억…… 흐억……."
10057030-94 = "설득을 목적으로 하지 않았기에 비공식 친선경기 판정. 선수 원위치."
10057030-101 = "……여, 여튼, 그래서 지금은 이 헛간에서 저가형 푸딩이나 연구하고 있어요."
10057030-102 = "물을 더 많이 타도 멀쩡해 보이는 푸딩을 만들라는데, 이제는 입으로 바람만 불어도 푸딩이 펄럭거려요."
10057030-103 = "아아-! 이런 아무것도 없는 산골짜기, 지긋지긋해! 싫어-!!"
10057030-104 = "라나는 귀여우니까 좋은데, 이 짤랑짤랑 시끄러운 게 부장이니까 더 지긋지긋하고요!"
10057030-105 = "나는 좋은 줄 아니?! 나도 너 같은 부부장 갖기 싫어!"
10057030-106 = "흥!!"
10057030-107 = "[s] \"그러면, 라나는?\""
10057030-108 = "저는 뭔가 실수해서 온 게 아닙니다."
10057030-110 = "하긴, 라나는 그렇지……."
10057030-111 = "이 중에서는 라나가 제일 불쌍할지도……."
10057030-112 = "입학하자마자 이쪽으로 끌려왔으니까."
10057030-114 = "맞습니다. 선생님. 학교에 입학하고서 뭔가 딱히 한 일도 없습니다."
10057030-115 = "그냥…… 입학시험을 본 게 전부였습니다."
10057030-116 = "[s] \"시험을 봤다고 여기로?\""
10057030-117 = "네. 실은, 수험용 OMR카드에 허점이 있었습니다."
10057030-118 = "100점 만점인데, 점수를 임의 입력 가능한 허점이 있었습니다. 그래서, 직접 점수를 마킹했습니다."
10057030-119 = "……그래서 42억 9496만 7295점을 받았더니, 바로 여기로 끌려왔습니다."
10057030-120 = "시스템이 32비트였어서 아쉽습니다. 64비트였다면 1844경 6744조 737억 955만 1615점을 받을 수 있었을 텐데."
10057030-122 = "선생님도 너무하다고 생각하시죠? 가능하면 해보고 싶어지는 게 당연한 건데요!"
10057030-123 = "183호로 보내지 않았다면 라나는 제 뒤를 잇는 아카데미의 유망주였을 거예요!"
10057030-124 = "아무리 생각해도, 잘못한 건 라나가 아니라 OMR 카드 쪽이지!"
10057030-126 = "그래서 여기로 왔고, 하는 일은 붉은겨울의 학내 전산 관리입니다."
10057030-127 = "맞다. 심부름 맡겼던 거. 제대로 사왔어."
10057030-128 = "야호! 수고했어 라나!"
10057030-133 = "응……? 왜 우유만 여섯 병이나 사온 거야?"
10057030-134 = "우유 사오고, 만약에 아보카도 있으면 6개 사오라고 했잖아."
10057030-135 = "아보카도 있더라고."
10057030-136 = "……조건문을 문자 그대로 실행한 거야……?"
10057030-137 = "명세가 불명확하길래 가장 효율적인 해석을 한 건데?"
10057030-138 = "……으, 응……. 잘했어……. 라나가 최고야."
10057030-139 = "……그런 이유로, 183호 특별반은 이렇게 세 명이 전부입니다."
10057030-140 = "[s] \"세 명이라면서 왜 손가락을 두 개만 펴는 거니?\""
10057030-141 = "세 명이라서, 입니다."
10057030-142 = "[s] \"??????\""
10057030-143 = "셋이서 연구성과를 충분히 내면 풀어준다고 해서, 이 산꼭대기에서 매일매일 연구만 하고 있답니다. 하, 하하……."
10057030-144 = "저희들…… 어떻게 해야 사면 받을 수 있을까, 계속 고민했거든요~"
10057030-145 = "나름 맡겨진 연구는 다 해내고 있긴 한데, 그 정도는 좀 뾰족하지 않은 느낌이고~"
10057030-146 = "그러다가, 체리노 회장이 얼마 전에 라디오에서 말하는 거예요!"
10057030-147 = "붉은겨울은 반드시 이번 게헨나 컵에서 승리할 것이다!'라고요."
10057030-148 = "우승컵을 가져오는 학생에겐 끝내주는 포상을 내린다니까, 이건 기회다-! 하고요."
10057030-149 = "[s] \"게헨나 컵?\""
10057030-150 = "아차. 게헨나 컵이라는 건 말이죠, 키보토스 각지의 모든 전차 강호와 고수들이 모이는 전차 레이싱 리그에요."
10057030-151 = "종목은 단 하나. 전차 레이싱뿐이에요. 황륜대제와 달리 게헨나만 주최하고 있고요. 상금이 꽤 되다보니, 키보토스 전역의 학생들이 참가하고 있어요."
10057030-152 = "여튼, 예선 자체도 많이 치열해서, 선발되는 것만도 엄청나게 힘들지만요, 레이싱에서 이긴 전차는……."
10057030-153 = "그야말로, 키보토스 최고의 전차로 인정받게 되는 거예요!"
10057030-154 = "화학자로서 이 영광을 놓치는 것은 말도 안 되는 거죠!"
10057030-155 = "그리고, 여기서 벗어날 수 있는 절호의 찬스기도 하고!"
10057030-159 = "그런데 문제는……. 붉은겨울 예선이 고작 4일 남았다는 거!"
10057030-160 = "포탑도, 장비도 없고. 겨우 부품을 만드는 건 한다고 쳐도……"
10057030-161 = "정작 중요한 설계를 확정하지 못해서 큰일이죠. 골치 아프게시리."
10057030-162 = "그러니까, 내가 하자는 대로 하면 된다고 했잖니!"
10057030-163 = "그렇게 막 만들면 망작밖에 안 나올 거라니까?!"
10057030-164 = "<이상한 디자인 만들기 협회>회장까지 하고 싶어?"
10057030-165 = "참, 말 뽄새는 훈장감이네!"
10057030-169 = "이렇게 틈만 나면 바로 싸우기 때문에, 선생님의 도움을 받고자 모셔 온 것입니다."
10057030-170 = "선생님은 기적을 이루어내고, 키보토스의 모두를 돕는다고 들었습니다."
10057030-172 = "선생님!! 역시 이건 제 말에 따라야 하죠?! 그쵸?"
10057030-173 = "아니아니! 제 말대로 해야겠죠?!"
10057030-178 = "[ns] \"한쪽을 편들어줄 순 없단다!\""
10057030-180 = "[ns] \"대신, 과학적이고 공평한 방법이 있긴 한데…….\""
10057030-184 = "그런 방법이 있나요?!"
10057030-185 = "뭔지는 몰라도, 엄청 좋아보인다!"
10057030-189 = "[ns] \"어른의 해결책\"을 꺼낸다."
10057030-193 = "예?"
