[translation]
10028025-9 = "하아, 하아……. 하아……."
10028025-10 = "으음……. 선생님……?"
10028025-11 = "저희 이거……. 있잖슴까……."
10028025-12 = "절~대로 그럴 의도는 아니었지만……. 어쨌든……. 아무래도……."
10028025-13 = "[s1] \"승무원들을 쓰러뜨려버렸다…….\"\n[s2] \"어쩔 수 없는 분위기긴 했어.\""
10028025-19 = "……하하."
10028025-20 = "시간 착오 다음에는 다른 학교랑 싸움질인가요."
10028025-21 = "뭔가 점점 더 한심한 모양새가 돼 버리는 느낌인데요, 이거. 면목없슴다."
10028025-22 = "……네? 신경 쓸 필요 없다고요?"
10028025-23 = "아하하……. 말씀만이라도 감사합니다만, 그래도 제 입장에서는 좀……."
10028025-24 = "게다가 한 번 이겼다고 해도 이게 끝일 리는 없고, 오히려 승무원분들을 적대해 버린 느낌이라……."
10028025-25 = "여기다! 이쪽이다!!"
10028025-26 = "포위해라, 어차피 도망칠 곳은 없다!!"
10028025-43 = "……네. 바로 이렇게 말이죠."
10028025-47 = "으음……."
10028025-48 = "아무리 그래도 여기서 더 싸우는 건 무리가 있겠……죠? 선생님께서도 위험하실 테니."
10028025-49 = "우선 뭐, 일단은 얌전히 구속되는 쪽으로 진행하는 수밖에 없겠네요."
10028025-50 = "게헨나에 도착한 뒤에 어떻게 잘 이야기해 보죠. 잘 될지는 모르겠지만."
10028025-51 = "[s3] \"그럼 가방은…….\"\n[s4] \"그리 협조적이진 않을 것 같은데…….\""
10028025-54 = "실은 저도 그쪽이 좀 불안하긴 합니다만, 달리 방법이 없으니까요."
10028025-55 = "이런 일일수록, 웬만하면 원만하고 좋게 좋게 해결해야……."
10028025-69 = "……음?"
10028025-70 = "무슨 소리죠, 이거……? 뭔가 소리가……."
10028025-81 = "……? 응? 뭐야? 어디서 삑삑거리는 소리가 나는데?"
10028025-82 = "어……. 여기가 아니야. 뒤쪽 칸인 거 같은데?"
10028025-83 = "뒤쪽 칸? 뒤쪽 칸이라면, 거긴 분명……."
10028025-102 = "<호송 열차> 칸……."
10028025-103 = "……!!!!!!"
10028025-104 = "잠ㄲ……!!"
10028025-109 = "으헥! 켁! 콜록! 콜록, 콜록……!"
10028025-110 = "뭐, 뭐죠? 이번에는 갑자기 폭발!? 오늘 대체 어디까지 가는 거죠!?"
10028025-111 = "서, 선생님……? 괜찮으심까, 선생님!?"
10028025-117 = "바로 감싸 드리긴 했슴다만……. 혹시 어디 다치신 곳이라도……!"
10028025-118 = "[s5] \"나는 괜찮아.\"\n[s6] \"덕분에. 고마워, 이치카.\""
10028025-121 = "휴우……. 다행이네요."
10028025-122 = "그나저나 진짜 이게 무슨……. 호송 열차 칸이라더니, 왜 폭발을……?"
10028025-126 = "뒤쪽 칸은 아예 날아가 버린 모양이네요."
10028025-127 = "덕분이라고 표현하기엔 좀 뭐하지만, 저흴 잡아넣으려던 분들도 다 날아가 버리셨고……."
10028025-128 = "으음~. 그거참 이상하다~."
10028025-129 = "겨우 이 정도인가? 원래대로라면 열차 칸이 끊어져서 분리됐어야 하는데 말이지……."
10028025-133 = "음? 뭔가 사람 목소리가……?"
10028025-137 = "폭약이 부족했나? 아냐. 그럴 리가 없지. 이놈들이 그 사이 장갑을 강화하기라도 했나 보군!!"
10028025-138 = "와핫! 의외인걸! 이놈들, 그래도 생각이라는 걸 좀 하는 놈들이었잖아? 마음에 들어, 마음에 들어! 와하핫핫!!"
10028025-139 = "[s7] \"……'와핫핫'이라고?\"\n[s8] \"이 웃음소리는…….\""
10028025-142 = "……응? 뭐야, 이게?"
10028025-143 = "어라라~? 이게 누구신가! 설마설마했는데, 진짜로 선생님이네?"
10028025-150 = "설마 이런 데에서 만날 거라고는 상상도 못 했었는데 말이지! 와하핫핫핫!!"
10028025-151 = "훌륭하구만, 오늘!! 정말이지 훌륭한 날이야! 마음에 든다고!! 아주 마음에 들어!!"
10028025-152 = "뭐, 그럼 자기 소개는 따로 필요 없겠네? 후훗훗훗……."
10028025-157 = "당신은……?"
10028025-158 = "[s9] \"카스미!? 네가 왜……!?\"\n[s10] \"네가 왜 거기서 나와……?\""
10028025-161 = "어라. 선생님? 아는 분이신가요……?"
10028025-162 = "아니……. 잠깐만요."
10028025-163 = "카스미? 카스미, 카스미……. 어라. 어디서 들어본 적이……."
10028025-164 = "하……! 다짜고짜 이유부터 물어보는 거야? 하여간, 고리타분하기는."
10028025-165 = "무드를 좀 잡자고 무드를. 이왕 이런 곳에서, 이렇게 오랜만에, 극적으로 만난 거잖아? 안 그래? 후훗훗훗……."
10028025-166 = "카스미……. 카스미……. 어라."
10028025-167 = "키누가와 카스미……?"
10028025-171 = "현상수배범이잖슴까, 게헨나의……."
10028025-173 = "와하하핫핫핫!! 이거 참, 알아보는 사람이 많으니 연예인이라도 된 기분이구만! 고마워, 고마워!!"
10028025-174 = "그, 그렇군요. 기쁘셨다니 다행임다……만……."
10028025-175 = "그럼 더더욱 자기소개는 생략해도 되겠군! 그것보다 선생님이야말로……."
10028025-176 = "이렇게 황량하고 누추한 오지까지 무슨 일로 행차하셨을까?"
10028025-182 = "……그것도 깜찍한 트리니티 아가씨랑 함께 말이야."
