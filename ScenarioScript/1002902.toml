[translation]
1002902-1 = "강의명: 로망"
1002902-6 = "(나츠의 안내대로 트리니티의 한 교실에 들렀다.)"
1002902-7 = "(주말이라 그런지 교실에는 다른 학생들이 보이지 않았다.)"
1002902-8 = "오-. 딱 맞춰 와줬군."
1002902-13 = "역시 선생님이야. 본인이 수업을 하는 사람이니만큼, 받을 준비도 잘 돼 있구만. 훌륭하네~."
1002902-14 = "[s1] \"예? 갑자기 수업입니까?\"\n[s2] \"'가르쳐준다'는 게 정말 그 뜻이었을 줄이야.\""
1002902-15 = "하하. 당연하지. 처음부터 그렇게 말했잖아? 나는 한번 뱉은 말은 지키는 타입이라고."
1002902-16 = "하하. 당연하지. 처음부터 그렇게 말했잖아? 나는 한번 뱉은 말은 지키는 타입이라고."
1002902-17 = "하지만 걱정할 건 없어. 보통의 교과목 수업처럼 따분하거나 잠 오진 않을 테니까."
1002902-18 = "응? 일단은 교직에 종사하는 사람에게 그런 말을 해도 괜찮냐고?"
1002902-19 = "……하하."
1002902-20 = "왜 이래. 우리 서로 솔직하게 인정할 건 인정하자고."
1002902-21 = "선생님도 소싯적엔 수업시간에 많이 잤을 거 아냐. 뭐-. 아니면 말고."
1002902-22 = "허례허식 없이 서로의 알몸을 드러내는 마인드. 그것 또한 로망을 위한 기본이니까 말이야."
1002902-23 = "……아무튼. 그래서 오늘 선생님을 여기에 부른 이유."
1002902-24 = "오늘의 강의 주제가 바로 그 '로망'이야."
1002902-25 = "로망이란 무엇인가? 로맨틱한 사람이란 어떤 사람인가?"
1002902-26 = "이쯤 오면 선생님은 생각하고 있겠지. 왜 이 녀석은 갑자기 이런 소리를 시작하는 거야?"
1002902-27 = "모모톡으로 알 수 없는 인용구와 쿠키 이야기를 내뱉더니, 이제는 갑자기 철학강의를 시작한다고?"
1002902-28 = "물론 지금은 그걸로 충분해. 그런 선생님을 위해 우선 교재를 건네 주도록 하지."
1002902-29 = "이게 바로……."
1002902-30 = "오늘의 수업 교재야!!"
1002902-35 = "[ns3] \"수제 쿠키구나.\"\n[ns4] \"맛있어 보이네.\""
1002902-38 = "후후. 허나 맛은 가장 중요한 게 아니야."
1002902-39 = "그보다 중요한 것은 녀석들의 생김새지."
1002902-40 = "……응? 의외라고?"
1002902-41 = "다른 사람도 아닌 방과후 디저트부 부원인 내가 맛에 대해 그렇게 말한 게 놀랍다고?"
1002902-42 = "하하하."
1002902-43 = "선생님. 바로 그렇기 때문에 내가 '방과후 디저트부'인 거야. '방과후 맛집 탐방부'가 아니라."
1002902-44 = "그리고 '가장 중요한 것'이 아니라 했지 중요하지 않다곤 안했잖아?"
1002902-45 = "맛보다 더 중요한 것이 있다고 했을뿐."
1002902-46 = "……바로 생김새야."
1002902-51 = "이 쿠키들을 봐. 수제 쿠키들은 모두 저마다 다른 생김새와 데코레이션을 하고 있어."
1002902-52 = "빚은 사람의 자유와 취향이 담긴 만큼, 무의식적으로 하나하나 만들면서 그 당시에 품은 마음들이 담기는 거지."
1002902-53 = "다른 걸 생각하지 않고 오직 거기에만 집중하며……."
1002902-54 = "그 순간순간 사람이 떠올린 마음들이 순간을 포착한 사진처럼 쿠키의 형태로 남아있는 거야."
1002902-55 = "마음 가는 대로, 생각한 대로, 본인도 모르는 진심을 담아 무의식적으로 빚어낸 결과물."
1002902-56 = "실로 로망의 현현이라고 할 수 있지!"
1002902-57 = "그래서 난 쿠키를 좋아해. 다른 값비싼 디저트들도 좋지만 이건 이것 대로의 맛이 있거든."
1002902-58 = "그래서 쿠키를 만들다 보니, 문득 선생님도 이 철학을 알아줬으면 좋겠다는 생각이 들었어."
1002902-59 = "……부른 이유는 사실 그것뿐이야. 가끔 이런 생각이 들면, 누군가에게 말하지 않곤 못 버티거든."
1002902-60 = "어쩌면 별것도 아닌 일로 귀찮게 해버린 걸까? 하하."
1002902-61 = "들어줘서 고마워. 답례라고 하긴 뭣하지만, 대신 그 교재를 선물로 주도록 할게."
1002902-68 = "맛이 별로 중요하진 않다고 했지만, 나름대로 실력에는 자신이 있으니 먹을만할 거야."
1002902-69 = "……음? 여기서 지금 바로 먹자고? 같이?"
1002902-70 = "……하아."
1002902-71 = "선생님. 오늘 수업의 내용을 기억해봐."
1002902-72 = "아까도 말했잖아? 쿠키의 모양들은 무의식적인 마음들이 담겨 있는 것들이라고."
1002902-73 = "그러니 미안하지만 그 제안은 사양하도록 하겠어. 그건 적어도 내가 없는 곳에서 먹어 주길 바래."
1002902-74 = "자-. 그럼 오늘 수업은 여기서 끝!!"
1002902-75 = "난 먼저 돌아가겠어. 선생님은 내가 나간 뒤에 나와줘."
1002902-76 = "……아니면 남아서 오늘 받은 교재를 혼자 복습해 보는 것도 좋겠지."
1002902-77 = "후후후후. 그럼 이만!!"
1002902-82 = "(이후 나츠가 사라진 뒤 교실에 남아, 다양한 모양의 쿠키들을 먹으며 잠시 시간을 보냈다.)"
1002902-83 = "(……솔직히 각각의 모양에 무슨 의미가 담겨있는지까지는 잘 알 수 없었다.)"
