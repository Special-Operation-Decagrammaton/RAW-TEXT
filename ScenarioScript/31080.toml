[translation]
31080-1 = "제8화;제1차 평가 시험"
31080-3 = "(다행이에요, 시험은 모두 보충수업에서 배웠던 문제들이 나왔어요!)"
31080-4 = "(선생님과 함께 공부한 문제들과, 다 함께 공부했던 부분들이 정확하게 그대로……!)"
31080-5 = "(게다가 이 난이도, 초급 중에서도 기초 수준의 최하급 난이도!)"
31080-6 = "(이 시험은 말하자면, 보충수업부를 구제해 주기 위한 배려 같은 걸까요?! 무서운 말을 했지만 사실은 저희를 위해서……)"
31080-10 = "……끄응. 그러니까……. 이건……."
31080-14 = "후훗."
31080-18 = "(사각사각) ……."
31080-22 = "(응, 하지만 방심은 금물! 다들, 힘내주세요! 시험을 무사히 치르고 웃으면서 보충수업을 졸업하는 거예요!)"
31080-29 = "[ns] 시험 결과가 도착했다."
31080-30 = "아하하……. 다들 수고하셨습니다."
31080-31 = "백점 만점에 60점 이상이면 되니까! 낙제만 아니면 되고…… 게다가 이번 시험은 마치 워밍업같은 느낌이었으니까 ……."
31080-32 = "선생님, 어서 시험 결과를 알려주세요!"
31080-33 = "웃으면서 결과를 받아들이는 거예요!"
31080-34 = "[s] 결과를 발표한다."
31080-35 = "히후미 72점."
31080-36 = "결과 - 합격."
31080-37 = "네! 해냈어요! 그럼 다음은……"
31080-39 = "아즈사 32점."
31080-40 = "결과 - 낙제."
31080-41 = "……네?!"
31080-42 = "칫. 종이 한 장 차이였나."
31080-43 = "……네?! 자, 잠깐만요?! 종이 한 장이 아니잖아요?! 워, 워밍업 아니었어요?!"
31080-45 = "코하루 11점."
31080-46 = "결과 - 낙제."
31080-47 = "?!"
31080-48 = "네?! 잠깐만요?! 히, 힘은요? 숨기고 있던 힘은요?! 1학년 꺼 친 거 아니었어요? 코하루 쨩?! 설마 2학년, 아니, 3학년 걸 친 건가요?!"
31080-49 = "시, 실수한 것뿐이야! 시험이 엄청 어렵게 나와서……."
31080-50 = "엄청 쉬웠거든요?! 역대급으로 쉬웠거든요?!"
31080-51 = "어머나……."
31080-52 = "하나코 쨩…… 어, 어떻게 하죠? 저희 두 명만 합격이라면…… 이대로라면 2차 시험을 칠 수밖에 없는데……."
31080-53 = "하나코 2점."
31080-54 = "결과 - 낙제."
31080-56 = "2점?!?!!"
31080-57 = "2점요?! 2점이라고요? 그런 점수가 가능한 거였어요? 잠깐만요. 엄청 공부 잘하는 느낌이었잖아요?! 하나코 쨩?!"
31080-58 = "제가 좀 그런 느낌이 있죠. 성적과는 별개로."
31080-59 = "느낌인가요?! 느낌뿐이었나요?! 성적과는 별개의 느낌이었어요?!"
31080-60 = "아……."
31080-61 = "아우우……."
