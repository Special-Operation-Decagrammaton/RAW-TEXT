[translation]
90000005-1 = "제1화;프롤로그"
90000005-3 = "안녕, 선생님. 여기까지 와 줘서 고마워."
90000005-4 = "중요한 일이라서 아무도 모르게 와달라고 했어. 선생님을 기다리고 있는 사람이 있거든."
90000005-8 = "이쪽이야."
90000005-12 = "부장. [USERNAME] 선생님을 모셔 왔어."
90000005-17 = "고마워요, 에이미. 처음 뵙겠습니다, 선생님."
90000005-18 = "저는 히마리. 밀레니엄 학원의 천재 해커입니다."
90000005-19 = "[s] \"자칭 천재……?!\""
90000005-20 = "음. 나름 유명인인지라 저에 대해 한 번쯤은 들어보신 적이 있을지도 몰라요."
90000005-21 = "정체를 숨기고 있는 베리타스의 미인 부장이라든가, 병약 미소녀의 표본 같은 사람이라거나……."
90000005-22 = "밀레니엄의 청초한 한 떨기 꽃이라거나…… 어때요? 기억나시나요? 한번은 들어보시지 않았나요?"
90000005-23 = "[s1] \"아니 전혀.\"\n[s2] \"그랬던 거 같기도 하고…….\""
90000005-24 = "네?! 그, 그런가요?"
90000005-25 = "그럴 리가. 그런……."
90000005-26 = "……."
90000005-27 = "부장이 시무룩해졌잖아. 선생님. 어떻게 책임질 거야."
90000005-28 = "……아, 안 되겠네요. 조금 더 이미지 메이킹에 신경을 쓰지 않으면……."
90000005-29 = "그렇죠? 후후. 후후후……."
90000005-30 = "……후후후훗."
90000005-31 = "부장이 우쭐대고 있잖아, 선생님. 어떻게 책임질 거야."
90000005-32 = "어머? 에이미? 우쭐대고 있는 게 아니랍니다."
90000005-33 = "사실 확인을 통해 모든 게 순조롭다는 걸 검증했을 뿐이라고요."
90000005-34 = "……하여튼, 저는 조금 전에 <초현상특무부>의 부장으로 임명되었습니다."
90000005-35 = "덕분에 베리타스의 일은 치 쨩에게 전부 떠맡기게 되었지만……."
90000005-36 = "[s] \"초현상특무부가 뭐야……?\""
90000005-37 = "<초현상특무부>는 밀레니엄의 학생회장인 리오 씨가 만든 특무조직인데……"
90000005-38 = "음, 에이미? 설명해주시겠어요?"
90000005-39 = "과학적으로 설명하기 힘든 현상들을 추적하고 연구하는 게 목표인 세미나 산하의 동아리야."
90000005-40 = "리오 선배의 명령으로 만들어졌지만, 아직까진 부원은 나 혼자였어. 제대로 된 활동도 없었고."
90000005-41 = "그러네요. 설마 제가 리오가 만든 수상쩍은 동아리의 부장이 될 줄은……. 게다가 설마 부원이 한 명뿐인 곳에……."
90000005-42 = "이제 히마리 부장도 있으니까, 둘이야."
90000005-43 = "네, 그러네요. 건강계 에이미와 병약 미소녀계인 저, 멋진 콤비가 될 거 같네요. 후후."
90000005-44 = "응. 히마리 부장. 잘 부탁해."
90000005-45 = "……그런데 여기 좀 덥지 않아?"
90000005-49 = "아뇨. 저는 오한이 들 정도로 추우니까 에어컨 리모컨은 내려두세요, 에이미."
90000005-53 = "아뇨, 그렇다고 옷을 벗진 마시고요. 네? 지퍼요? 무슨 소리…… 아뇨아뇨, 보여주지 않아도 돼요. 괜찮아요."
90000005-54 = "[s] \"내 도움이 필요한 부분이 있어?\""
90000005-55 = "네. 그렇습니다. 여기서부터 본론인데……."
90000005-56 = "아실지도 모르지만 저는 밀레니엄 학생회장 리오와는 아주 오랫동안 대립해왔습니다."
90000005-57 = "모든 것을 통제하려고 드는 빅 시스터인 그녀와, 모든 통제에 반대하는 카피레프트 신봉자인 저는 생리적으로 친해지는 게 불가능하거든요."
90000005-58 = "말하자면 리오가 하수구 아래에 흐르는 물이라면 저는 티 없이 맑은 1급 미네랄 워터라서……."
90000005-59 = "아, 정화조에 둥둥 떠 있는 썩은 물이 더 정확하겠네요. 저는 만년설의 결정 같은 거고."
90000005-60 = "아뇨, 그냥 분뇨가 더 명확한 표현이겠네요."
90000005-61 = "음, 아니……. 더 좋은 표현이……."
90000005-62 = "부장. 본론을."
90000005-63 = "……네. 어쨌든 그래서 리오의 부탁이라면 뭐든 거절할 생각이었는데……."
90000005-64 = "그녀가 도저히 거절하기 힘든 부탁을 해 오는 바람에…… 이 <초현상특무부>의 부장을 맡게 되어버렸습니다."
90000005-65 = "그리고 그 부탁받은 내용을 달성하기 위해서는 <샬레>의 도움 또한 반드시 필요하고요."
90000005-66 = "그래서 선생님을 여기로 모셔 온 겁니다."
90000005-67 = "[s] \"그 부탁이란 게 뭐야?\""
90000005-71 = "……데카그라마톤."
90000005-72 = "선생님도 들어보신 적이 있으실 겁니다. 가장 먼저 이 미증유의 AI와 접촉한 것은 <샬레>이니까요."
90000005-75 = "\"신神을 연구, 분석하여 그 존재를 증명하고, 증명이 가능하면 구조를 분석하고, 구조를 분석할 수 있다면 재현이 가능하리니, 이는 곧 새로운 신神을 창조해 낼 수 있는 것이다…….\""
90000005-76 = "그 가설을 기반으로 만들어진 절대존재자율분석시스템."
90000005-77 = "즉, 신성을 찾아내는 인공지능."
90000005-79 = "……하지만 저희도 여러 가지를 찾아봤지만 그런 가설은 어디에서도 찾아볼 수 없었습니다."
90000005-80 = "보고서에도 적어주셨던 <게마트리아> 라는 집단 역시 실존하는지도 확인할 수 없었고요."
90000005-81 = "<샬레>의 증언을 토대로 연구를 진행하기엔 너무 불명확한 것들이 많았죠."
90000005-82 = "……선생님을 의심하는 건 아닙니다. 이건 어디까지나 증거에 대한 이야기예요."
90000005-83 = "선생님을 믿지 않는다면 여기 데려오지도 않았어."
90000005-84 = "네. 그말이 맞아요. 오히려, 샬레의 도움이 필요한 상황이죠."
90000005-85 = "……최근 밀레니엄 자치구의 통신망 가설 유닛 AI <허브hub>가 이 정체불명의 AI에게 해킹당해 모습을 감춘 사건이 있었습니다."
90000005-86 = "<허브>는 밀레니엄 학원의 역사와도 궤를 같이하는 초고사양의 연산 기관."
90000005-87 = "밀레니엄의 기술의 정수가 담겨 있다고 해도 과언이 아닌 마스터피스 중 하나인데도……"
90000005-88 = "그 AI의 해킹에 단 0.00000031초도 버티지 못했습니다."
90000005-89 = "리오와 저는 허브를 해킹한 AI가 바로 <데카그라마톤>이 아닐까, 하고 의심하고 있습니다."
90000005-90 = "그 이유는……."
90000005-96 = "<허브>가 해킹된 이후 밀레니엄의 통신망 데이터에 이런 문장을 남겨놓고 사라졌거든요."
90000005-98 = "마침내, 섭리에 이르는 길path을 찾았도다."
90000005-100 = "오오- 나의 길path은 명예를 통한 완성,"
90000005-102 = "나의 이명은 찬란함으로 증거하는 영광이라."
90000005-104 = "나의 이름은 호드HOD."
90000005-106 = "신성한 열글자의 신을 증명하고 기적을 예언하는 8번째 예언자로다."
90000005-110 = "신성한 열글자……. 즉, 데카그라마톤을 뜻하는 거죠."
90000005-111 = "이걸 통해 유추할 수 있는 것은, 첫 번째."
90000005-112 = "데카그라마톤은 AI와 접촉해서 그들을 자신의 부하…… 즉, <예언자>로 만든다."
90000005-113 = "리오는 이것을 일종의 인격모듈의 해킹으로 보고 있지만, 저는 다르게 해석합니다."
90000005-114 = "이것은 <세뇌>……아니, 이 표현은 적절치 않네요. ……그러니까, AI를 <감화>시키고 있는 것으로 해석합니다."
90000005-115 = "두 번째, 데카그라마톤의 예언자들은 데카그라마톤 그 자체가 아니라, 독립된 개체로 활동한다."
90000005-116 = "자신을 열글자의 신을 증명하는 예언자라고 선언한 것을 보면, 이 부분은 명확합니다."
90000005-117 = "데카그라마톤이 예언자를 다루는 방식은 <통제>가 아닙니다. 명령을 내릴 거면 대상을 자기 자신으로 만들어버리면 가장 편했겠죠."
90000005-118 = "하지만 그것은 예언자들을 <감화>시켜서 그들이 자율적으로 움직이게 두고 있어요."
90000005-119 = "비효율적이기도 하고, 비합리적인 방식을 어째서 취하는지……."
90000005-120 = "지금부터 그런 것들을 알아보아야 합니다."
90000005-126 = "<데카그라마톤>의 연구 분석, <샬레>도 <초현상특무부>와 함께 해주시겠습니까?"
90000005-128 = "다음화;정보수집 1 – 아비도스 사막"
