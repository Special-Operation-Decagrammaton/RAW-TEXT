[translation]
10039005-1 = "프롤로그;오토바이 탈취"
10039005-3 = "……죄송합니다, 선생님."
10039005-4 = "최선을 다해 도와주셨는데, 그 결과가 이런 것이라니."
10039005-5 = "이렇게 돼 버려서, 뭐라고 드릴 말씀이 없습니다."
10039005-6 = "어쩌면 이것도, 모두 처음에 제가 나선 탓."
10039005-7 = "저의 지나친 참견이 만든 결과."
10039005-8 = "……그래도."
10039005-9 = "네. 이대로 가만히 있을 순 없겠죠. 저는 먼저 움직이겠습니다."
10039005-10 = "부디, 선생님. 염치없는 말이겠지만……."
10039005-14 = "……전부 그렇게 돼 버려도, 저를 용서해 주실 수 있을까요?"
10039005-23 = "\"진짜야? 그 소식……?\""
10039005-27 = "\"트리니티 광장에서, 2시간 뒤라고. 소문 쫙 퍼졌는걸.\""
10039005-31 = "\"와, 대박. 갑자기 이게 무슨 일이래.\""
10039005-35 = "\"이거 진짜 완전…….\""
10039005-40 = "[log]\"우리 오늘 전쟁 나는 거야?\"[/log]"
10039005-47 = "어이, 거기! 멍하니 서 있지 말고 비켜!! 내 길을 막고 있잖아!!"
10039005-48 = "……? 대답이 없네? 뭐야, 불만이라도 있어?"
10039005-49 = "어라, 그러고 보니 그 복장은 트리니티의……."
10039005-50 = "……시……스터……?"
10039005-59 = "……!? 가, 갑자기 뭐 하는 짓이야?!"
10039005-60 = "…………?"
10039005-61 = "……내려 주세요."
10039005-62 = "……뭐?"
10039005-63 = "타고 계신 오토바이에서 내려 주세요. 당신의 오토바이를 잠시 빌리고자 합니다."
10039005-67 = "뭐, 뭐라고……? 지금 뭐라고 한 거야? 시스터 씨……?"
10039005-68 = "설마 지금 내 오토바이를 뺏어가겠다는……? 게다가 총까지 겨누고……."
10039005-69 = "이 무슨……."
10039005-75 = "히, 히익!? 깜짝이야……!"
10039005-76 = "죄송해요. 하지만 설명할 시간이 없습니다."
10039005-77 = "자, 잠깐! 잠깐만! 대체 무슨 상황이냐고, 이게!? 왜 트리니티의 시스터 씨가 내 오토바이를……!!"
10039005-81 = "아, 알았어! 알았다고!! 일단은……!"
10039005-82 = "……감사합니다. 속죄와 용서는 다음에 찾아뵙도록 하겠습니다."
10039005-88 = "그러니까 뭐냐고……. 대충이라도 설명해 줘……."
10039005-92 = "……그렇군요."
10039005-93 = "이건……. 그래요."
10039005-95 = "\"트리니티를 구하기 위함입니다.\""
