[translation]
10040080-1 = "제8화;한 해의 마지막, 새해의 처음."
10040080-3 = "……이쯤이면 좋겠네요."
10040080-7 = "창밖이 참 밝죠? 자정이 다 돼 가는 시간인데도 아직 밖에는 불빛이 한창."
10040080-8 = "물론 늦게까지 연구나 발명을 하는 학생들이 많은 밀레니엄의 밤이니까, 다른 곳들보다 다소 밝을 때가 많지만……."
10040080-10 = "오늘은 그런 것을 감안하더라도 훨씬 더 밝은 밤이에요. 마지막 날이라 그런 걸까요?"
10040080-11 = "생각해 보면 재미있는 일이죠. 내일이 되면 또 언제 그랬냐는 듯 평소 같은 한 해를 시작할 텐데."
10040080-12 = "단지 마지막 날이라는 이유로, 새해 첫날이라는 이유로 의미를 부여하고 시간을 기다리고."
10040080-13 = "이유가 있어서 날짜를 기리는 게 아니라, 날짜를 기리기 위해 이유를 만들고자 하죠."
10040080-14 = "심지어 그 '기린다'는 것조차, 사실 그저 즐겁게 놀거나 함께 뭔가를 하고 싶기 때문에 만든 이유고요."
10040080-15 = "모든 것은 그저 이유를 위한 이유를 위한 이유."
10040080-16 = "계속해서 파헤쳐보면, 그 안에 남는 것은 아주 단순하고도 알기 쉬운 이야기."
10040080-17 = "……즐거운 시간을 보내고 싶다."
10040080-18 = "함께 하고 싶다. 확인하고 싶다. 특정 기억을 만들고 싶다. 기억 속에 남기고 싶다."
10040080-19 = "혹은, 기억 속에……."
10040080-22 = "……남겨 주고 싶다."
10040080-23 = "대체 얼마나 솔직하기 못하기에, 이렇게나 번거로운 상황을 만드는 걸까요."
10040080-24 = "가식이라 부르기조차 민망한 그 모습들은, 보기 좋게 포장되긴 하지만 때때로 그 탓에 본질을 잊고 말기도 하고."
10040080-25 = "……물론 저라고 다른 사람을 이상하다 말할 수 있는 처지는 아니라고 생각하지만요. 후후."
10040080-26 = "당장 오늘만 봐도, 이미 수없이 그런 행동을 했잖아요."
10040080-27 = "[ns1] \"노아는 그런 부분이 싫은 거야?\"\n[ns2] \"혹시 거기에 문제가 있다고 생각해?\""
10040080-30 = "……글쎄요. 모르겠네요."
10040080-31 = "원만한 대인관계를 위해 어느 정도는 필수라고는 생각해요. 그야 상식이겠죠."
10040080-32 = "하지만 많은 사람들은 그럼에도 그런 부분의 진의가 상대에게 잘 전달되고,"
10040080-33 = "어떤 생각을 하는지, 어떤 의도로 말했는지 이해할 수 있지요. 그래서 가식이라고 부를 수 없다 생각해요."
10040080-34 = "코유키 쨩도 유우카 쨩도, 방식은 다르지만 결론적으로는 투명하잖아요? 깨끗한 물처럼."
10040080-35 = "밀레니엄의 다른 사람들도 사실 크게 다를 건 없고."
10040080-36 = "심지어 저희 리오 회장도……. 열심히 아닌 척하지만, 굉장히 알기 쉬운 사람이고 말이에요."
10040080-37 = "……네?"
10040080-38 = "저 스스로는 어떤 거 같냐고요?"
10040080-39 = "후후. 선생님, 꽤 직접적이시네요. 물론 지금 저희의 대화 주제가 그것이긴 하지만."
10040080-40 = "그럼 그에 대한 대답은……. 음……."
10040080-45 = "어라라……. 아하하."
10040080-46 = "방금 전까지 그렇게 이야기해 놓고, 또 말을 고르며 돌아가려 하고 있었네요, 저."
10040080-47 = "네. 보시는 대로 이런 타입이랍니다. 그다지 의도하지 않아도……. 알 수 없다는 소리를 자주 듣는 사람."
10040080-48 = "어떻게, 물어보신 것에 대한 답이 되었을까요?"
10040080-51 = "[ns] \"응.\""
10040080-53 = "[ns3] \"그게 문젯거리가 아니라는 것도 알지.\"\n[ns4] \"가령 나랑 있을 땐 지금 같은 것처럼.\"\n[ns5] \"서로 상대적인 것뿐. 별로 다르지 않아.\""
10040080-57 = "……아하……."
10040080-58 = "과연……. 논리적이네요. 납득이 돼요."
10040080-59 = "후후……."
10040080-60 = "이래서 모두들 선생님과의 대화를 찾는 걸지도 모르겠네요. 저도 습관이 돼 버리겠어요."
10040080-61 = "선생님과의 대화는 정말 편하네요. 구구절절 설명할 필요도 없고, 말을 돌릴 필요도……."
10040080-62 = "억지로 솔직해질 필요도 없고 말이에요."
10040080-66 = "그럼 돌아와서……."
10040080-67 = "다시 말해 지금 이곳에, 이런 시간에 제가 선생님을 모시고 온 이유도 알고 계신단 뜻이겠네요."
10040080-68 = "그리고 그럼에도 불구하고 어울려 주신다……라는 건가요? 괜찮으신 건가요?"
10040080-69 = "모두가 잠든 이 늦은 시간, 야경을 보며 새해의 마지막과 처음을 맞는 중대한 두 순간에."
10040080-70 = "다른 누구도 없는 곳에서 모든 시선과 주의를 저 혼자 독식하고 있겠다는 제 의도는."
10040080-71 = "……제 '진의'는, 정말로 문제가 없는 걸까요? 그렇게 생각하신 건가요, 선생님은?"
10040080-72 = "이래도 되는 것일까요, 저는?"
10040080-73 = "생각하기에 따라서는……."
10040080-74 = "……조금 나쁜 것일 수도 있다고 생각하는데 말이에요."
10040080-75 = "[s6] \"조금 전 말과 모순되는 이야기인 건 알지?\"\n[s7] \"……또 이유를 위한 이유를 위한 이유네.\""
10040080-78 = "……후후."
10040080-79 = "아까도 말씀드렸듯, 저는 결국 이렇게 빙빙 돌릴 수밖에 없는 사람이니까요. 이게 제 한계니까요."
10040080-80 = "그러니 저 대신, 선생님께서 직접 말씀해 주셨으면 좋겠어요. 안심시켜 주셨으면 해요."
10040080-81 = "……괜찮겠지요? 부탁드리겠습니다, 선생님."
10040080-85 = "[ns] \"알겠어.\""
10040080-87 = "[ns8] \"한창때의 소녀에게는, 자연스러운 일이야.\"\n[ns9] \"아무것도 나쁘지 않아. 걱정할 거 없단다.\""
10040080-90 = "…………."
10040080-91 = "……………………."
10040080-92 = "……후우."
10040080-93 = "……감사합니다, 선생님."
10040080-102 = "……그 말씀을, 기다리고 있었어요."
10040080-106 = "새해 복 많이 받으세요, 선생님."
10040080-107 = "그리고 앞으로도……."
10040080-111 = "……저희 모두를, 잘 부탁드리겠습니다."
10040080-121 = "……아."
10040080-126 = "후후. 오늘 드린 말들, 모두에겐 비밀로 부탁드릴게요."
10040080-128 = "(이후 노아와 함께 코유키의 반성실로 돌아가, 어질러진 물건들을 뒷정리하였다.)"
10040080-129 = "(정리가 끝난 후의 노아가 잠드는 것까지 확인한 후, 샬레로 돌아와 잠이 들었다.)"
10040080-131 = "(……다음 날 오후.)"
10040080-132 = "선~생~님~!!!"
10040080-133 = "[s10] \"조금만 쉬게 해줘…….\"\n[s11] \"더는 무리……. 엄마…….\""
10040080-136 = "무슨 말씀을 하시는 거예요!? 안 돼요! 아직 이렇게나 잔뜩 남아 있잖아요!!"
10040080-137 = "가뜩이나 이렇게 모두 도와주러 왔는데……!! 좀 더 성의를 보이시라고요!!"
10040080-138 = "맞아~. 우린 옷도 못 갈아입고 끌려왔다고~."
10040080-139 = "선생님을 지원하겠다고 하긴 했지만, 이런 지원을 뜻한 건 아니었는데……."
10040080-141 = "…………."
10040080-142 = "……오, 여기라면……."
10040080-143 = "……코타마. 스톱."
10040080-144 = "……큭."
10040080-146 = "크으윽……. 여기까지 와서 비밀번호 따개의 역할이라니……."
10040080-147 = "나의 인생, 나의 자유는 대체 어디에……."
10040080-148 = "……후후. 어제는 그렇게나 고요했는데, 오늘은 정말이지 활기차네요."
10040080-149 = "……고요……?"
10040080-150 = "고요했나……? 어제 완전 난장판이었던 것 같은데……."
10040080-151 = "코유키! 손!!"
10040080-152 = "크아아악-!! 인생 불행!!"
10040080-153 = "나머지도 모두! 아시겠죠!? 선생님 정산 다 끝나실 때까지, 아무도 나갈 수 없어!!"
10040080-154 = "자!! 아셨으면 다들 진행하세요! 빨리!!"
10040080-155 = "네에~~~."
10040080-156 = "선생님도!! 어서! 선생님이 제일 열심히 해야 하잖아요!!"
10040080-157 = "[s12] \"네에에…….\"\n[s13] \"미안하다, 모두…….\""
10040080-164 = "………."
10040080-165 = "……후후."
10040080-170 = "……정말로, 언제나와 같은 첫날이네요."
10040080-171 = "비밀의 미드나잇 파티 ~종이 울리는 술래잡기~"
