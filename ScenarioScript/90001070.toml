[translation]
90001070-1 = "제7화;탐색"
90001070-3 = "[ns] \"여기는……?\""
90001070-5 = "우리가 파괴한 전파 시설과…… 이 시설 사이의 연결 통로인 것으로 보이네."
90001070-6 = "으음, 폭약을 너무 많이 썼나 봐. 충격파로 여기저기 많이 깨어져 나갔어."
90001070-11 = "저는 어디까지나 선배님들의 전훈을 따랐을 뿐입니다."
90001070-12 = "특히 어떤 분은, '부족한 폭약 같은 것은 없다'는 보고서를 언제나 작성하셨으니까요."
90001070-18 = "[ns] (누구의 보고서인지 알 것 같은 기분이 든다…….)"
90001070-22 = "그 근방에 적 병력의 움직임은 감지되지 않아. 조금 더 나아가도 괜찮을 것 같아."
90001070-23 = "그렇게 하도록 하죠. 저도 점점 흥미가 생겨나기 시작했어요."
90001070-27 = "아직도 기계 장치들이 작동하는 소리가 들려. 저건…… 컨베이어 벨트인가?"
90001070-28 = "네. 채취한 자원들을 1차적으로 가공하여, 다시 어딘가로 운반할 준비를 끝마치고 있군요."
90001070-29 = "이곳은 일종의 '가공 공장'과도 같은 시설인 것으로 보입니다."
90001070-30 = "그건 그렇고, 엄청난 규모로군요. 거대한 제철소 내부에 들어와 있는 기분입니다."
90001070-32 = "이동 흔적, 시추 기계들, 전파 방해 시설, 그리고 자원 가공 공장……."
90001070-33 = "……이 지역에서 도대체, 무슨 일이 일어나고 있는 걸까요? 그리고 왜 이 정도의 사태가 벌어지고 있었는데, 아무도 그 사실을 알아차리지 못했던 거죠?"
90001070-34 = "위험이라는 건……. 보통 그런 법이니까."
90001070-36 = "레이더 사이트 작동 중지 확인. 그리고 적들의 시설 진입 확인."
90001070-37 = "그러면, 이제부터 진짜로 시작해 볼까?"
90001070-38 = "더, 더욱 깊숙한 곳으로…… 그리고 그곳을 향해, 몰아세우면 되는 거죠? 마, 맡겨 주세요!"
90001070-39 = "훗후후…… 기초적인 전술이죠. 최대한 깊숙히 유인한 후, 한 번에 끝장내기."
90001070-40 = "병력 전환 배치 완료. 자, 아인. 네 시간이야."
90001070-41 = "네, 네! 자, 잘은 모르지만, 토끼나 사슴과 같은 초식 동물을 몰아세울 때는 이렇게 해야 한대요! 산 아래에서 위로요!"
90001070-42 = "예전에, 소프가 그렇게 말해 줬어요!"
90001070-43 = "그거, 반대였을걸?"
90001070-44 = "후에엥?! 그, 그런가요……. 제가 또……."
90001070-45 = "아뇨, 뭐. 우리가 정말로 토끼나 사슴 같은 동물을 본 적은 없으니까 말이죠."
90001070-55 = "뭐, 뭐죠?!"
90001070-56 = "이럴 수가……? 적 병력, 대규모 출현 확인!"
90001070-64 = "데카그라마톤의 병력이……? 지금까지와는 숫자가 달라. 어떡하지, 부장?"
90001070-65 = "응전 준비에 들어가겠습니다."
90001070-66 = "아니…… 아니야, 토키. 에이미의 말이 맞아. 그 숫자를 너희가 전부 상대할 수는 없어! 지나치게 많아!"
90001070-67 = "그리고 아비 에슈흐는 이렇게 좁은 실내에서 사용할 것을 상정해서 만들어진 무장이 아니야!"
90001070-68 = "아, 알겠습니다. 리오 님."
90001070-69 = "리오? 우리가 탈출할 수 있는 루트가 있나요?!"
90001070-70 = "기다려. 금방 찾아볼 테니까……!"
90001070-71 = "우선 포위 방향은 단방향이야. 너희가 진입해 온 쪽으로는 완전히 막혔다고 보면 돼!"
90001070-72 = "시설 안쪽으로 이어지는 길은 열려 있어. 상대적으로 병력이 적어. 뒤편의 출구로도 이어져 있고!"
90001070-73 = "즉 우리가 나아갈 수 있는 방향은, 이곳에서 가공된 자원들이 보내지고 있는 저 건너편. 컨베이어 벨트의 너머라는 뜻이 되겠군요."
90001070-74 = "무엇이 기다리고 있을지는 모르겠지만, 뒤에서 쏟아지는 본대의 병력과 정면으로 맞붙는 것보다는……."
90001070-82 = "응. 확실히 회장이 제시한 방법이 나아 보이네."
90001070-83 = "역시 제가 응전하는 것이."
90001070-84 = "아니니까. 지금은 정말 아니니까."
90001070-88 = "……알겠습니다. 그러면 신속하게 길을 열도록 하죠."
90001070-97 = "(어딘가, 함정으로 몰아세워지는 것 같은 느낌도 들지만…….)"
90001070-98 = "(아니……. 부정적인 생각이라면 됐어. 이곳엔 선생도, 히마리도 있으니까. 필요한 건……. 문제의 해결……!)"
