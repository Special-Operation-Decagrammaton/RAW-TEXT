[translation]
42185-3 = "이 녀석들 뭐야? 도대체 어디서 나타났다가 어디로 도망치는 거야?"
42185-4 = "분명 역의 내부 지도는 우리도 완벽하게 파악하고 있을 텐데…… 녀석들만 아는 비밀 통로라도 있는 건가?"
42185-10 = "물론입니다!"
42185-11 = "이 녀석, 어느 틈에 다시—"
42185-21 = "코우사기 역처럼 오래된 역은 증축을 거듭했기 때문에 지도에 기재되지 않은 뒷문이나 자투리 공간이 여러 군데에 있으니까요."
42185-22 = "이런 곳은 우범지역이 되기 쉽기 때문에, 생활안전국의 학생이라면 대부분 그 위치를 알고 있지만…… 이야, 이런 상황에서 도움이 될 줄은 몰랐네요."
42185-26 = "앗, 후부키! 2층으로 적…… 아니, 불량 승객들이 몰려갑니다!"
42185-28 = "응응, 이미 보고 있었어."
42185-29 = "그보다 에스컬레이터를 가로질러 달려올 생각인가? 위험할 텐데……"
42185-34 = "이 지긋지긋한 참새 녀석들! 지금 바로 올라가서 혼쭐을 내주마!"
42185-36 = "아, 저기 미안한데 말이지. 이 역의 에스컬레이터, 워낙 낡은 물건이라서."
42185-40 = "가끔씩 비상 정지를 하는 일이 있거든."
42185-48 = "우, 우왓?!"
42185-53 = "그러니까 안전을 위해 에스컬레이터 위에서는 걷거나 뛰지 말도록 해. 문화시민의 상식이라고."
42185-59 = "이 생활안전국의 오합지졸들이…… 이런 우스꽝스러운 방법으로 우리 엘리트들을 농락하다니……"
42185-60 = "가만두지 않겠다!"
42185-61 = "앗, 위험—"
42185-75 = "저희 <소확행>을 잊고 방심하다니, 카이저 코퍼레이션의 엘리트들도 한참 멀었군요!"
42185-76 = "저희를 향한 핍박과 모멸이 계속되더라도…… 단원들이 모두 도망쳐 저 혼자 남는다 하더라도…… <소확행>의 투쟁은 계속될 것입니다."
42185-77 = "키보토스의 모두가 일하지 않고, 소유하지 않는, 무소유의 행복을 깨닫는 그날까지!"
42185-79 = "일하지 않는 삶을 추구한다고? 그거 꽤나 멋진 이야기네."
42185-80 = "오, 무소유의 삶에 관심이 있으신가요? 저희는 언제나 열린 마음으로 새로운 수도자를 환영하고 있습니다!"
42185-81 = "……다만 <소확행>에 들어오려면 스스로의 무소유를 증명하기 위해 가지고 있는 것을 '조금' 내려놓긴 해야겠지만요."
42185-82 = "(으응……? 뭔가 다단계 사기의 냄새가……)"
42185-86 = "……클리어. 상행선 승강장 쪽도 정리되었습니다."
42185-87 = "감사합니다, 생활안전국 여러분. 덕분에 부상 없이 승강장까지 무사히 진입할 수 있었습니다."
42185-88 = "아닙니다. 본관은 그저 역사 내에서 말썽을 부리는 불량 승객들을 단속한 것뿐인걸요."
42185-89 = "오히려 생활안전 업무에 협조해 주셔서 대단히 감사합니다!"
42185-90 = "……오늘 키리노 씨가 보여 주신[ruby=근접전투체계] CQB [/ruby]실력은 꽤나 인상적이었습니다."
42185-91 = "C, CQB요……? 본관은 그런 건 배운 적이 없는데요……"
42185-92 = "출입로가 통제된 상황에서 빠르게 경로를 파악하여 범인이 대응하기 전에 기습하는 것은 CQB의 기본."
42185-93 = "전부터 느낀 것이지만 키리노 씨의 신속 대응 능력은 SRT의 그 누구보다도 훌륭하다고 생각합니다."
42185-94 = "역시 범죄가 발생하면 그 누구보다 빨리 현장에 나타난다는 생활안전국 학생들의 이야기는 거짓이 아니었군요."
42185-96 = "제, 제가요……?"
42185-97 = "저는 그저 순찰을 빨리 끝내고 맛집 탐방을 하고 싶어서 지름길을 찾는 습관이 든 것뿐인데……"
42185-101 = "……"
42185-102 = "……뭐, 그래도 발키리 생활안전국의 일원으로서 나름의 자부심은 갖고 있으니까요!"
42185-104 = "네. 공원의 거주민으로서 언제나 신세를 지고 있습니다."
42185-105 = "그럼…… 이어서 뒤를 부탁드리겠습니다."
42185-107 = "넵!"
42185-109 = "다음화;어비스"
