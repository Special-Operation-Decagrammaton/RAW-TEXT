[translation]
84307100600-5 = "뭐야? 갑자기 무슨 일이야?"
84307100600-6 = "야호- 리더! 지금 뭐 하고 있어? 아니, 혹시 그 얘기 들었어?"
84307100600-7 = "……? 얘기? 무슨 얘기?"
84307100600-8 = "어젯밤 시연장에 침입해서 출품작을 훔치려던 녀석들이 있었다지 뭐야!"
84307100600-9 = "……뭐?"
84307100600-10 = "그 일 때문에 세미나에서 아침부터 시연장 보안을 강화해야 한다고 난리도 아니야~"
84307100600-11 = "그렇……군. 그래서, 그걸 왜 나한테 물어보는 거지?"
84307100600-15 = "응? 그러게. 왜지?"
84307100600-16 = "……그냥? 히히."
84307100600-17 = "리더는 아는 거 없지?"
84307100600-21 = "…….없……다고 하자."
84307100600-22 = "응!"
84307100600-23 = "그럼 \"없다고 하자\"로 오케이-!!"
