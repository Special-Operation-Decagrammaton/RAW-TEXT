[translation]
1202-1 = "Maid&Made 1"
1202-5 = "……계세요?"
1202-6 = "들어가도 괜찮을까요?"
1202-10 = "어, 문이 열려 있네."
1202-11 = "실례하겠습니다. 들어갈게요."
1202-17 = "C&C 동아리실 겸 강연실"
1202-20 = "아, 안에 있었네. 다행이다."
1202-24 = "……헉."
1202-25 = "또 그런 반응이야? 후우. 정말 난 어딜 가도 환영 받지 못하는 걸까."
1202-26 = "아, 아니. 미안하다. 그런 의미는 아니었는데……."
1202-30 = "어머, 유우카 씨네요?"
1202-31 = "무슨 일로 찾아오셨을까요?"
1202-32 = "이번에도 의뢰라든가……."
1202-33 = "죄송해요. 그렇지만 지금은 부장님이 안계셔서 수락하기 어려운 상황이라……. 메모라도 해 둘까요?"
1202-34 = "아니, 괜찮아. 의뢰 같은 건 아니고……."
1202-35 = "아니, 엄밀히 따지면 맞다고도 할 수 있나?"
1202-36 = "평소 의뢰와는 조금 다른 일을 부탁하려고 하는데."
1202-37 = "평소와 다른 일……? 무슨 뜻이지?"
1202-38 = "음. 그게……. 이번에 부탁할 일은 아예 평소와는 종류부터 다른 거라서 말이야."
1202-39 = "'의뢰'이긴 하지만 '임무'라고 하기엔 애매하다. 그런 느낌이랄까."
1202-40 = "……??? 점점 더 이해가 안 가는데."
1202-41 = "의뢰이긴 하지만 임무는 아니다……."
1202-42 = "후훗. 이건 또 흥미로운 말씀을……."
1202-43 = "아, 아니. 진짜 별 건 아닌데……."
1202-44 = "다들 요 앞 상점가에서 축제준비가 한창이라는 건 알고 있지?"
1202-45 = "전자상가 이야기인가."
1202-46 = "벌써부터 '학생들이 참여하는 테마 카페'라고 플래카드도 걸고 있더군."
1202-47 = "응. 그리고 그 축제의 수입을 위해 다양한 컨셉의 카페들도 나오고 있고 말이지."
1202-48 = "그런데……."
1202-49 = "……그런데?"
1202-50 = "그런데……. 후……."
1202-51 = "알다시피 참여하는 학생들이 우리 밀레니엄 학생들이다 보니……."
1202-52 = "그 '다양한 컨셉'이란 것들의 상태가 조금……."
1202-53 = "아하하……. 대충 어떤 상황인지 짐작이 가네요."
1202-54 = "코딩 체험이니 엔지니어링이니……. 하나 같이 손님 안 올 만한 것들만 골라서 하고 있거든."
1202-55 = "하아. 백귀야행이나 트리니티에선 축제 때마다 자금이 모인다는데, 우리 쪽은 늘 왜 이런 식인지……."
1202-56 = "결국 상가 쪽에서 먼저 세미나에 부탁을 했어. 대안을 좀 제시해 줄 수 없냐고……."
1202-57 = "대체 왜 세미나가 이런 일까지 나서야 하는지 모르겠지만, 일단 전자상가도 밀레니엄 자치구니까……."
1202-58 = "아하하하……. 그렇군요……."
1202-59 = "그런데……. 실례지만 그것과 저희가 무슨 관계인지 다시 한번 여쭤봐도……?"
1202-60 = "……응."
1202-61 = "그래서 혹시나 해서 드리는 말씀인데……말이죠."
1202-70 = "……C&C의 뛰어난 메이드 여러분."
1202-75 = "……? 갑자기 존댓말을……."
1202-76 = "그렇게 손바닥 뒤집듯 호칭이 바뀌니 도리어 무서운 걸요……?"
1202-77 = "아니, 위장이라고는 해도 메이드가 맞긴 하잖아?"
1202-78 = "입고 있는 옷부터 <메이드복>이고."
1202-79 = "들어본 바로는 메이드 카페로 잠입도 많이 해봤다고 했었고."
1202-80 = "네……. 뭐, 일단은…… 그렇지요?"
1202-81 = "확실히 그런 적도 있긴 하지만……."
1202-82 = "그러니까 이번 한번 정도에 한해서, 지금까지의 일들에 대해 변상도 좀 한다는 셈 치고……."
1202-87 = "일주일 정도만……. 메이드 카페 일을 좀 해줄 수 있을까?"
1202-89 = "(1시간 후.)"
1202-94 = "아아아앙-!? 그게 무슨 말도 안 되는 소리야!?"
1202-95 = "메이드 카페-? 잠꼬대하냐? 당연히 안 되지! 말이 된다고 생각해!?"
1202-96 = "이것들 봐라. 사람이 메이드복 좀 입었다고 아주 진짜 메이드인 줄 아는 모양이지?"
1202-97 = "그야 보통 메이드복을 입고 있으면 메이드인 줄 알겠죠……?"
1202-98 = "잘 됐군, 선배."
1202-99 = "드디어 우리가 메이드라는 인식을 심어주는 데에 성공한 것 같아."
1202-100 = "헛소리하지 마. 안 돼. 절대 안 돼!"
1202-101 = "가서 절대 못 한다고 전해. 알았어?"
1202-102 = "으, 으음……. 선배. 그게……. 그……. 이미……."
1202-103 = "……?"
1202-104 = "그 반응은 뭐야? 이미……? 이미 뭐?"
1202-105 = "이미 수락했다."
1202-106 = "세미나에서는 예산까지 편성해주기로 했으니 물러주지 않을 거라더군."
1202-107 = "물러설 수 없게 됐어. 계약서까지 써갔으니 우리 쪽에서 취소하면 위자료를 문다고 했다."
1202-111 = "……? 하아?"
1202-112 = "뭐, 뭐……? 계약서라고? 그 녀석들 진짜 아주 작정하고 나왔잖아……?"
1202-113 = "……아니 잠깐. 가만 있어 봐. 그게 무슨 소리야? 계약서를 이미 썼다니?"
1202-114 = "여기 부장은 난데? 내가 계약서 사인을 안 했는데 그게 어떻게 돼!? 누가 했는데?"
1202-115 = "아, 그거? 내가 했는데!?"
1202-120 = "……."
1202-121 = "……."
1202-122 = "……? 응? 왜 그래?"
1202-123 = "뭔데? 뭔데?"
1202-127 = "……."
1202-128 = "……아아. 아아아……."
1202-129 = "……네. 선배. 그렇게 된 거예요."
1202-130 = "선배가 안 계실 때는 아스나 선배가 결정하도록 돼 있으니까……."
1202-131 = "그만……. 알았으니 그만 해……. 제발……."
1202-132 = "응? 화난 거야?"
1202-133 = "왜? 하면 안 되는 거였어?"
1202-134 = "재밌어 보이던데? 잘 되면 우리한테도 돈 준다고 했잖아? 부장도 하면 재밌게 할 거잖아?"
1202-139 = "아, 안 해! 안 한다고……!"
1202-140 = "넌 이게 재밌냐!?"
1202-141 = "응! 그럴 거 같아!"
1202-147 = "포기해, 선배. 아스나 선배는 이미 스위치가 올라갔다. 이건 그냥 하는 수밖에 없어."
1202-148 = "그, 그래요. 차라리 앞으로 어떻게 해야 할지에 대해서 고민하는 편이 더 나을 거예요."
1202-153 = "……왜……."
1202-154 = "이 녀석들은 왜 늘 이런 식인 거야……."
