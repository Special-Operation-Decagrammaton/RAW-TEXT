[translation]
10052095-2 = "호크마, 침묵 확인."
10052095-3 = "여전히 더워……. 그때보다도 더……."
10052095-4 = "[s1] \"그래도 지금은 그 전투복으로 있어 주었으면 해.\"\n[s2] \"에이미가 위험해지는걸, 더 이상 보고 싶지 않으니까.\""
10052095-7 = "……저, 에이미? 조금…… 미안한 부탁이 될 것 같은데요."
10052095-8 = "응? 여기에서 더 오래 있어 달라는 것만 아니라면, 얼마든지 괜찮아."
10052095-9 = "으, 바로 그 비슷한 거라서 그러는 거라서요……."
10052095-10 = "여기 기온이나 기압 같은 것들이 다른 지역과는 많이 달라서, 코어 정보 추출에 조금 더 시간이 걸릴 것 같아서요……?"
10052095-16 = "[ns] \"에, 에이미?!\""
10052095-17 = "여, 역시 죄송합니다!"
10052095-18 = "아니야……. 선생님도 케이도 잘못한 거 없어……."
10052095-19 = "나쁜 건……. 그렇지……. 아마도 이 세상일 거야……."
10052095-20 = "뭔가 지금 되게 그 아이들 같은 말을 했네요, 에이미……."
