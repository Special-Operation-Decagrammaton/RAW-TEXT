[translation]
10049010-1 = "제1화;자경단 따위는 이제 됐으니까"
10049010-2 = "트리니티 부설 유치원 구교사"
10049010-3 = "너 말야, 우리하고 다를 거 없지 않아?"
10049010-5 = "네?"
10049010-6 = "야야, 그만해! 그러다가 또 섬광탄 터뜨릴라!"
10049010-7 = "……아뇨. 무력화된 상태의 상대에게는 공격하지 않는 게 제 원칙입니다."
10049010-8 = "그보다, 무슨 말씀이시죠?"
10049010-9 = "'우리하고 다를 게 없다.'라고요?"
10049010-10 = "아까의 섬광탄도 그렇고. 너, 그 녀석이지?"
10049010-11 = "자경단이라고 자칭하는, '트리니티의 달리는 섬광탄'이라는 녀석."
10049010-16 = "……네 ……맞습니다."
10049010-17 = "너, 이럴 자격이라도 있어?"
10049010-18 = "검은 옷의 정의실현부도 아니고 말야,"
10049010-19 = "자경단이라는 거, 멋대로 자칭하는 거잖아?"
10049010-20 = "확실히, 정의실현부가 아닌 것도 맞습니다만……."
10049010-21 = "이웃의 안전을 지키는 것에 자격이 필요한가요?"
10049010-22 = "공인도 받지 않았으면, 우리하고 다를 게 없잖아?"
10049010-23 = "남 방해하고, 폭력 휘두르고. 적어도 우리는 잘났다고 뻐기지라도 않지!"
10049010-24 = "대체 왜 굳이 자경단 같은 일을 하는 거야? 아무도 알아주지 않잖아?"
10049010-25 = "정의실현부가 되지 못해서 괜히 이러는 거 아니야?"
10049010-26 = "!!"
10049010-27 = "너 같은 개인이 이렇게 위협하는 것도 결국 범죄 아니야?"
10049010-28 = "거 봐! 됐다, 가자! 이 동네, 더러워서 안 오고 말지!"
10049010-32 = "어? 어……."
10049010-36 = "……."
10049010-41 = "괘, 괜찮겠어? 따라와서 해코지하면 어쩌려고……!"
10049010-42 = "쉿……! 태연하게 굴어, 태연하게."
10049010-43 = "봐, 저거."
10049010-45 = "……."
10049010-47 = "봤어? 내가 한 말이 맞으니까, 아무것도 못 하잖아."
10049010-48 = "역시, 내 논리는 아무도 못 이긴다니깐?"
10049010-49 = "돼, 됐으니까 빨리 이 틈에 튀자!!"
10049010-55 = "……아무도 알아주지 않고,"
10049010-56 = "정의실현부가 되지 못했다, 라니."
10049010-57 = "결국, 이러는 것도 범죄……."
10049010-58 = "제가, 그렇다고요……?"
10049010-63 = "트리니티 구 도서관"
10049010-64 = "어디 보자- 신간으로 교체된 책은 이 상자에 모아뒀고,"
10049010-65 = "다른 도서관에 기증할 책은 여기……."
10049010-70 = "응! 오늘 창고에 가져다 둘 책은 이걸로 끝!"
10049010-71 = "벌써 시간이 이렇게…… 얼른 두고 가야겠어요."
10049010-75 = "응? 창고 뒤편에 웬 말소리가……."
10049010-79 = "……그럼, 이번 주말이 맞는 거지?"
10049010-80 = "응. 라브 대장이 그날로 하자고 했으니까."
10049010-81 = "<보더랜드 놀이공원>으로 모두 집합이래."
10049010-85 = "(헤, 헬멧단원분들이? 이 늦은 시간에 여기에?)"
10049010-86 = "(그러고 보니, 구 도서관은 인적이 드물어서 시선을 피해 몰래 모인다는 소문이 있었죠.)"
10049010-87 = "(아직 들키지 않은 것 같으니 이 틈에 슬쩍 자리를 피해야…….)"
10049010-89 = "놀이공원이 완전 박살이 나겠구만."
10049010-90 = "!"
10049010-94 = "미안한 일이지만, 이번 건수는 우리 퐁당퐁당 헬멧단이 놓치기엔 아깝지."
10049010-95 = "많이 다치려나."
10049010-96 = "저쪽에서 어떻게 나오느냐에 따라 달린 거겠지 뭐."
10049010-98 = "(사람들이 다친다고요? 대체 무슨 계획을…….)"
10049010-99 = "그런데, 우리만으로 충분하겠어?"
10049010-100 = "다른 조직에서 지원도 잔뜩 온다고 하잖아. 충분하겠지."
10049010-101 = "이만 가자. 누가 들을지도 모르니까."
10049010-103 = "(이쪽으로 오면 안 되는데……!)"
10049010-104 = "(일단, 도망을……!)"
10049010-111 = "헉…… 헉……."
10049010-112 = "분명히, 두 분이 이야기했었죠."
10049010-113 = "<보더랜드 놀이공원>에서, 이번 주말에…… 사람이 다친다고요?"
10049010-114 = "라브 대장이라고도 했었고. 이건……."
10049010-115 = "이건 막아야 해요, 어딘가에 신고라도 해야……."
10049010-119 = "햐웃!"
10049010-120 = "……."
10049010-121 = "앗, 자경단의 스즈미 씨?"
10049010-122 = "마침 잘 됐어요!"
10049010-123 = "구 도서관 창고 뒤에서, 헬멧단 분들이 뭔가 나쁜 작당을 하고 있었어요!"
10049010-124 = "어쩌죠? 자경단이 어떻게 할 수 없을까요?"
10049010-125 = "네? ……앗, 네."
10049010-126 = "그렇군요. 그렇다면……."
10049010-130 = "공인도 받지 않았으면, 우리하고 다를 게 없잖아?"
10049010-134 = "[log=불량배 스케반 A]정의실현부가 되지 못해서 괜히 이러는 거 아니야?[/log]"
10049010-137 = "……."
10049010-138 = "스즈미 씨?"
10049010-139 = "아닙니다. 같이 정의실현부에 신고하러 가시죠."
10049010-140 = "'어쩌면', 이건 정의실현부가 할 일이니까요……."
10049010-141 = "아, 네. 그렇군요……?"
10049010-142 = "그렇다면 어서 신고를!"
10049010-143 = "……."
