[translation]
2600105-1 = "말할 수 없는 비밀"
2600105-2 = "코타마의 방"
2600105-3 = "이 시간대에 기지국 서버를 해킹하면 재미있는 통화를 많이 엿들을 수 있습니다."
2600105-4 = "어디 보자. 오늘은 누구의 전화를 감청해볼까요……."
2600105-5 = "발신자 미상의 수상쩍은 전화가 한 건. #n수신자는……"
2600105-6 = "샬레의 선생님?"
2600105-7 = "이런 야심한 밤에 선생님께 전화를 하는 사람이 있다니, 들어보지 않을 수 없지요."
2600105-9 = "……감청 개시. 인 카운트."
2600105-12 = "샬레의 선생님이 직접 연락을 주다니, 어지간히도 급한 일이었나 보군."
2600105-13 = "(회선 상태가 나빠서 그런지 목소리가 잘 들리지 않습니다. 좀 더 귀를 기울여야…….)"
2600105-14 = "……확실히 그 물건들을 처리하는 건 우리가 전문가지. 아마추어에게 맡겼다가는 물건 대신 옷을 빨갛게 물들일지도 모르니까."
2600105-15 = "(옷을 빨갛게 물들인다니…… 도대체 무슨 물건을 처리하려는 걸까요?)"
2600105-16 = "뒤처리도 중요해. 나중에 물건이 떠오르면 귀찮으니까, 비닐로 잘 묶어서 무거운 돌로 눌러 두어야 뒤탈이 없다고."
2600105-17 = "(뒤처리? 무거운 돌? 이건 혹시 설마…….)"
2600105-18 = "완성품은 썩지 않게 잘 절여서 보내줄 테니까, 기대하고 있으라고. 하하!"
2600105-20 = "……."
2600105-21 = "아무래도…… 선생님이 무서운 일에 휘말리신 모양입니다."
2600105-23 = "샬레 집무실"
2600105-24 = "……."
2600105-26 = "(감청한 내용에 따르면 상대가 <그 물건>을 보내기로 한 시간은 오늘 오후 두 시.)"
2600105-27 = "(선생님이 더 큰 범죄에 휘말리기 전에 선생님을 설득해야 합니다.)"
2600105-28 = "(그렇지않으면 키보토스 전역에 거대한 피바람이 불 수도…….)"
2600105-31 = "[ns] \"코타마, 표정이 나빠 보이는데. 괜찮아?\""
2600105-32 = "괘, 괜찮습니다. 잠을 조금 설쳤을 뿐이라."
2600105-33 = "그러는 선생님이야말로 묘하게 들떠 보이시는데, 무슨 좋은 일이라도 있으신가요?"
2600105-34 = "[s] \"전화로 주문했던 물건이 곧 온다고 해서 기다리고 있었어.\""
2600105-35 = "혹시 그 물건은 설마……."
2600105-36 = "저, 선생님. 잠깐 이야기를 하죠."
2600105-38 = "주문한 물건 배달 왔습니다."
2600105-40 = "선생님, 잠깐 기다리십시오. 그 안에는……!"
2600105-42 = "[ns] \"이번에도 <우메보시>가 맛있게 잘 익었네.\""
2600105-43 = "……네? 우메보시요?"
2600105-44 = "그 상자에 든 건 피로 물든 범죄의 증거가 아니었습니까?"
2600105-45 = "[s] \"……코타마야 말로 무슨 소리를 하는 거야?\""
2600105-47 = "아하. 빨갛게 물들이는 건 차조기 잎이고, 무게추는 장아찌 누름돌을 말하는 것이었군요."
2600105-48 = "저는 전화 내용만 듣고 선생님이 피비린내 나는 범죄의 흔적을 지우려고 하신 줄로만 알았습니다."
2600105-49 = "[s1] \"그럴 리가 없잖아.\"\n[s2] \"코타마는 나를 어떻게 생각하고 있었던 거야?\""
2600105-50 = "후후, 선생님이 제가 아는 평소의 선생님이어서 다행입니다."
2600105-51 = "후후, 선생님이 제가 아는 평소의 선생님이어서 다행입니다."
2600105-52 = "……아. 이 우메보시, 맛있게 잘 익었네요."
2600105-53 = "맛은 적당히 시고, 색도 예쁘니 장인의 솜씨가 느껴집니다."
2600105-54 = "[s] \"그나저나 코타마는 전화 내용을 어떻게 알게 된 거야?\""
2600105-55 = "어, 그게 그러니까……."
2600105-56 = "……우연히?"
2600105-58 = "이후 한동안 무단으로 전화를 도청한 건에 대해 코타마에게 잔소리를 하였다."
