[translation]
10020040-5 = "지금까지와는 다르게…… 그 시로코 씨는 보이지 않는군요."
10020040-6 = "그러게. 설마 포기한 건가?"
10020040-7 = "그, 그건 모르겠지만…… 그래도 방심은 금물이에요!"
10020040-9 = "아아. 좋은 소식이 있어. <우트나피쉬팀의 배> 수리가 곧 완료될 예정이야."
10020040-10 = "그, 그런가요?! 정말 좋은 소식이네요! 여러분 수고하셨습니다!!"
10020040-11 = "이야, 사실 솔직히 좀 걱정했는데, 다행이네!"
10020040-15 = "응. 해킹한 방주 연산 장치의 도움으로 생각보다 쉽게 완료할 수 있었어."
10020040-16 = "그렇습니다! 굉장한 성능이더라구요, 이건!"
10020040-17 = "그럼 이제 마지막 제4구역의 <차원엔진>까지 파괴하면, 방주의 <자폭 시퀀스>를 동작시킬 수 있을 거야."
10020040-18 = "자폭 전까지는 그래도 여유가 있을 거니까, 그 사이에 우트나피쉬팀을 재기동해서 거기서 탈출하면 돼."
10020040-19 = "여기서부터는 타이밍 싸움이니까, 정신 똑바로 차려야 해."
10020040-20 = "그럼, 행운을 빌어."
10020040-25 = "다행이네요, 리오. 당신의 그 <탈출 장치>를 쓸 일이 없을 것 같네요."
10020040-26 = "……. 아아."
10020040-41 = "저희는 지금 <특별 구역>의 통제실 앞이에요! 현재 교전 중이에요!"
10020040-42 = "거 참, 지긋지긋하네!!"
10020040-43 = "저항이 끈질기지만, 이곳의 파괴는 시간문제예요!"
10020040-44 = "자아, 더 와보라고."
10020040-45 = "통제실을 파괴하면 바로 연락드리겠습니다! 선생님!"
