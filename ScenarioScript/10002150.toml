[translation]
10002150-1 = "후일담;완벽한 모래성을 쌓는 방법"
10002150-2 = "후우. 아무리 불량배들의 공격을 받은 탓이라고는 하지만, 그 커다란 모래성이 단숨에 녹아내리다니……."
10002150-3 = "아즈사 씨의 말처럼 모든 것이 헛되고 헛된 존재로군요……."
10002150-4 = "[s] \"정말 멋진 모래성이었는데 아쉽게 되었네.\""
10002150-5 = "아뇨. 모래성이 얼마나 멋졌는지는 제게 그리 중요한 사실이 아닙니다."
10002150-6 = "자고로 모래성의 가치는……"
10002150-7 = "방호력으로 결정되는 법이니까요!"
10002150-8 = "젖은 모래는 어디서나 쉽게 구할 수 있는 건축 재료이지만, 응집력이 낮아 외력에 쉽게 깨진다는 단점이 있지요."
10002150-9 = "좀 더 응집력이 강한 건축 재료를 구하지 않으면……."
10002150-10 = "모래에 콘크리트 가루를 섞으면 좀 더 단단한 모래성을 쌓을 수 있지 않을까요?"
10002150-15 = "아니, 모래와 콘크리트를 섞어 만든 모르타르는 압축되는 힘에는 잘 견디지만, 인장 강도가 약해 쪼개지는 힘에 쉽게 무너질 위험이 있어."
10002150-16 = "불량배들의 공격을 대비하려면 모래성을 더 단단하게 쌓아 올려야 해."
10002150-17 = "그럼 어떤 재료를 쓰는 게 좋을까요?"
10002150-18 = "모르타르 자체는 소재로 나쁘지 않아. 가격도 저렴하고 구하기 쉬우니까."
10002150-19 = "다만 아까 말했듯이 부족한 인장력을 보강해야 하니까, 내가 추천하는 방법은……"
10002150-20 = "모르타르 사이에 철근을 심는 거야."
10002150-21 = "철근은 모르타르의 부족한 인장력을 크게 끌어올릴 뿐더러, 구조물의 응집력을 높여주기 때문에 더욱 견고히 성을 쌓을 수 있지."
10002150-22 = "과연, 그렇군요."
10002150-23 = "역시 아즈사 씨, 한 수 배웠습니다."
10002150-24 = "그동안 아즈사 씨는 이상한 기행만 저지르는 문제아라고 생각했는데, 기지 구축에 이런 노하우를 갖고 계셨다니……새삼 다시 보았습니다."
10002150-25 = "나야말로. 그동안 융통성 없는 정의실현부의 일원이라고만 생각했었는데……"
10002150-26 = "상황에 따라 유연하게 대처할 줄도 알다니, 다시 봤어."
10002150-27 = "[s] \"……이러면 더 이상 모래성이 아니지 않나?\""
10002150-29 = "아뇨, 재료에는 확실히 '모래'가 들어갔으니까요!"
10002150-31 = "게다가 방어 목적으로 구축한 건축물이니까 '성'도 맞지."
10002150-34 = "그러니까 모래성이야! (입니다!)"
10002150-35 = "[s] \"둘이 호흡이 잘 맞네…….\""
10002150-37 = "자, 그럼 모르타르에 사용할 콘크리트와 철근을 구하러 가볼까?"
10002150-38 = "바닥 기반을 다지는 일은 제가 맡겠습니다!"
10002150-43 = "(이후 마시로와 아즈사는 의기투합하여 해변에 모래성이라는 이름의 토치카를 건설하기 시작했다…….)"
