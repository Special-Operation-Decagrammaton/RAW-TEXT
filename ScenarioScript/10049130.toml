[translation]
10049130-1 = "후일담;헬멧단 블루스"
10049130-2 = "[log]5일전[/log]"
10049130-4 = "그러면, 다시 한번 정리해 줄게."
10049130-5 = "이번 주말, <보더랜드 놀이공원>에 가서 웬 사기꾼 잡상인 하나를 잡아서 넘긴다."
10049130-6 = "흠씬 두들기건 어쩌건 데려오기만 하면 되는 거고. 질문 있냐?"
10049130-7 = "질문 있습니다, 대장!"
10049130-8 = "짜식, 의욕 있네! 좋아!"
10049130-9 = "입장료는 어떻게 하죠? 놀이공원에 들어가야 잡을 텐데요."
10049130-10 = "많이 비쌀 텐데…… 우리 지갑 사정으론 제일 싼 입장권도 못 사요."
10049130-11 = "자판기 털어서 충당하는 건 어림도 없을 거예요, 대장."
10049130-12 = "가서 먹고 마시는 것도 못 할 거 아니에요. 속상하기만 할거라고요."
10049130-13 = "더욱이, 우리같이 작은 조직이 그 큰 놀이공원에서 누굴 어떻게 찾아요?"
10049130-14 = "히잉-"
10049130-15 = "힝-"
10049130-16 = "훗."
10049130-20 = "훗훗훗…… 핫핫핫하!!"
10049130-21 = "이번 의뢰는 다르다고!"
10049130-22 = "이번에는 의뢰주가 입장 티켓도 준비해 뒀어!"
10049130-23 = "그리고! 자매결연 맺은 다른 헬멧단 조직에서 지원도 보내준다구!"
10049130-24 = "대, 대장!!"
10049130-25 = "진짜예요?! 진짜로 그런 좋은 의뢰를 받아온 거예요?"
10049130-26 = "우리라고 언제까지 구질구질하고 미움받는 일만 해야겠냐!"
10049130-27 = "그리고, 놀라지 마라!"
10049130-28 = "입장 티켓은 자유이용권으로 주겠대!"
10049130-29 = "자유이용권!!!"
10049130-30 = "거기 있는 놀이기구 다 타볼 수 있는 거예요? 하루 종일?!"
10049130-31 = "심지어 더 비싼, 주말 티켓이라구!"
10049130-32 = "대장! 믿고 있었어요!"
10049130-33 = "입장도 공짜고, 지원도 든든하다니. 이건 실패하는 게 신기한 일이네요!"
10049130-34 = "아무래도 일찍 가서 문 열리자마자 입장해야겠네요!"
10049130-35 = "목표가 언제 나타날지 모르니까요!"
10049130-36 = "도시락도 싸가야겠네요! 오래 있어야 할 수도 있으니까요!"
10049130-37 = "단서를 찾아야 하니 사진도 잔뜩 찍어야겠네요!"
10049130-38 = "헤헤-!"
10049130-39 = "짜식들아! 놀 생각만 하지 말고! 이번 일은 반드시 성공시키는 거다?!"
10049130-40 = "깨끗하게 잡아서, 그날 저녁은 포상금으로 불고기 파티다!"
10049130-41 = "오예!!"
10049130-42 = "대장 최고!!"
10049130-45 = "으음……."
10049130-46 = "흐으음……?"
10049130-47 = "대장, 입장 시작했다구요?"
10049130-48 = "왜 입장 안 하는 거예요?"
10049130-49 = "늦으면 인기 있는 놀이기구는 줄 생겨버리는데……."
10049130-50 = "지원 온다고 했던 녀석들이 안 오고 있어."
10049130-51 = "이 자식들, 우리 입장권도 다 가지고 있단 말야!"
10049130-52 = "배, 배신당한 거예요?!"
10049130-53 = "배신?! 대체 왜? 뭔가 돈이 오간 것도 아니고, 의뢰를 뺏으려는 속셈인가?"
10049130-54 = "전화해 봐야겠어, 배신이면 싹 쓸어버릴 거야!"
10049130-55 = "네 대장!! 박살 내버리죠!!"
10049130-61 = "어이!! 지금 오고 있기는 한 거야?!"
10049130-62 = "혹시 배신한 거라면-"
10049130-63 = "지, 지금은 좀 바빠!! 미안!! 가는 중이었는데!!"
10049130-64 = "우리 전부 다 당해버렸어!!"
10049130-65 = "뭐?! 어디서? 설마 표적이 먼저 습격한 거야?!"
10049130-66 = "기차야 기차!! 가는 길인데 갑자기 승무원들이-"
10049130-67 = "스, 승무원들이 미쳤다-!!!"
10049130-68 = "아, 안돼!!"
10049130-69 = "됩니다!"
10049130-70 = "철도 운행을 방해하는 승객은 용서하지 않아요!"
10049130-71 = "으아아악!!"
10049130-78 = "대, 대장?! 뭐래요……?"
10049130-79 = "습격당했대요? 그러면 지원은요? 티켓은 어쩌고요?"
10049130-80 = "기차 타고 오다가, 승무원이 미쳤다는데?"
10049130-81 = "예?"
10049130-82 = "왜요?"
10049130-83 = "모르겠는데……?"
10049130-84 = "이거, 배신당한 건가……?"
10049130-86 = "대장? 어디로 가는 거예요?"
10049130-87 = "의뢰는 어쩌고요? 입장 게이트는 저쪽이잖아요?"
10049130-89 = "헥, 헥…… 지도를 보니까, 놀이공원에 동물원이 있더라고."
10049130-90 = "동물원은 안의 동물이 나가는 걸 막느라, 사람이 침입하는 것을 막는 건 허술해."
10049130-91 = "동물들이 시도 때도 없이 경보기를 건드려서 꺼두는 곳도 많고."
10049130-92 = "아까 알아보니까, 동물원은 시설 정비 때문에 임시 휴관 중이었어."
10049130-93 = "숨어들기 딱 좋지."
10049130-94 = "우와…… 어떻게 그걸 알아요?"
10049130-95 = "우리랑 다르게 대장은 공부가 싫어서 도망친 게 아니라구!"
10049130-96 = "그쵸, 대장! 듣기로는 공부 잘했다면서요?"
10049130-97 = "시끄러워. 그 따위 학교, 원해서 간 것도 아니거든?"
10049130-98 = "참고 다니려고 해도 답답해 죽는 줄 알았단 말야."
10049130-99 = "쩝, 그래도 사육제는 한번 참가해 보고 자퇴하는 게 나았으려나."
10049130-100 = "항상 들을 때마다 신기하단 말이죠."
10049130-101 = "불만있냐?!"
10049130-103 = "뭐, 됐고! 여기가 좋겠네."
10049130-104 = "일단 티켓이 지금 없는 것뿐이지, 멀쩡하게 어딘가에 잘 있을 테니까 무단 침입은 아니겠지!"
10049130-106 = "그, 그렇긴 하네요. 표가 있기는 하니까……?"
10049130-107 = "대장, 진짜 똑똑해요."
10049130-108 = "괜히 띄워주지 말고! 담이나 넘어!"
10049130-111 = "역시, 경보기 없네!"
10049130-112 = "뭔가 야생처럼 꾸며놨네요."
10049130-113 = "응? 야생?"
10049130-114 = "좋아, 이제 놀이공원으로 가자!"
10049130-115 = "증원도 없고 티켓도 없지만, 할 수 있지?"
10049130-116 = "악어라도 나타나지 않는 한, 걱정 따위 없다구!"
10049130-121 = "뭐야, 너희들. 왜 갑자기 떨어?"
10049130-122 = "대, 대, 대, 대장, 그러면 우리 이제 걱정해야해요."
10049130-123 = "응?"
10049130-125 = "여기…… 악어 우리예요……!"
10049130-129 = "아. 동물원에는 원래 진짜 악어가 있지……."
10049130-130 = "그건…… 너무 당연한 일이네!"
10049130-134 = "으아아아아아악!!!"
