[translation]
1013505-1 = "도움이 필요합니다."
1013505-2 = "(다급하게 밀레니엄으로 향했다!)"
1013505-7 = "케이 쨩, 잡았다!"
1013505-8 = "노, 놓아 주세요!"
1013505-9 = "케이 쨩은 우리가 싫어?"
1013505-10 = "싫다는 건 아닌데요! 그, 그렇지만 뭔가……."
1013505-11 = "아, 부끄러워한다! 역시 역시, 아리스와는 다른 맛이 있다니까!"
1013505-12 = "(왜 아리스는 그냥 아리스고 저는 케이 '쨩'인 것인지, 격렬하게 묻고 싶어지는데요!)"
1013505-16 = "[ns1] \"뭐야. 무슨 일인가 해서 급히 와 봤더니…….\"\n[ns2] \"밀레니엄 신 명물 '케이 쨩 귀여워하기'였잖아.\""
1013505-19 = "선생님?! 잘 왔어요! 교사 되신 분으로서 위기에 빠진 학생 좀–"
1013505-20 = "아, 선생님이다! 안녕하세요, 선생님!"
1013505-21 = "선생님도 '케이 쨩 귀여워하기' 같이 하실래요?"
1013505-22 = "[s] \"당연히 해야지!\""
1013505-23 = "네?!?!"
1013505-24 = "……."
1013505-26 = "이 어른을 믿은 제가 바보였어요–!!!"
1013505-29 = "그런데 케이 쨩은 아리스의 쌍둥이 동생이라고 했지?"
1013505-30 = "네? 네, 네에……. 그런, 식이죠. 네……."
1013505-31 = "어라? 그런데 그렇다기에는 머리색이 완전히 다른데? 명도가 반대잖아."
1013505-32 = "아! 그렇구나! 이란성 동성 쌍둥이인 거네!"
1013505-33 = "으……. 어……. 네……. 그런 것으로, 할게요……."
1013505-34 = "그러면 케이 쨩에게 오늘도 퀘스트를 수여하겠습니다~"
1013505-35 = "또 그건가요……."
1013505-36 = "어, 혹시 싫어?"
1013505-37 = "싫은 건……!"
1013505-41 = "……."
1013505-42 = "………싫지는, 않아요."
1013505-43 = "그냥, 좀, 뭔가 부끄럽고, 익숙하지 않고, 그래서……."
1013505-45 = "아아아아아~"
1013505-47 = "으윽, 지금 뭔가 엄청나게 위험한 예감이……!"
1013505-49 = "케이 쨩 귀여워~!!!"
1013505-54 = "[ns] \"케이 쨩 귀여워~!!!\""
1013505-55 = "당신은 또 왜 그래요!!!!!"
1013505-56 = "그래서 말인데. 이거, 옆 건물에 있는 강의실에 가져다줄래?"
1013505-57 = "아, 네……. 이른바 배달 퀘스트네요……."
1013505-58 = "응. 그리고 이번에는 보상 선 지급 퀘스트야. 여기, 이 목걸이 줄게."
1013505-59 = "……!"
1013505-60 = "예쁘, 네요."
1013505-61 = "장식이 너무 화려해서 부담스럽지도 않고, 그러면서도 청색이 섞인 크롬 광택과 노란색이 살짝 섞인 보석이……."
1013505-62 = "그, 그런데 꽤나 귀해 보이는데, 괜찮나요?"
1013505-64 = "괜찮아, 괜찮아. 우리 신소재개발클럽에서 이거저거 만들다가 남은 걸로 찍어낸 거거든."
1013505-65 = "그 보석도 인조 다이아몬드니까, 성분만 보면 탄소 덩어리고."
1013505-67 = "그렇군요……. 하긴, 요즘은 인조 다이아몬드 쪽이 더 품질이 좋죠."
1013505-69 = "그러면 부탁할게~"
1013505-70 = "퀘스트가 더 필요하면 언제든 말해 주고!"
1013505-72 = "아, 아뇨……. 충분한 것 같습니다……."
1013505-73 = "……?"
1013505-74 = "조금 전부터 뭔가 싫은 느낌이 든다 했더니, 선생님은 왜 거기에서 그런 표정으로 서 있는 건가요……?"
1013505-75 = "[s] \"그게, 뭔가~\""
1013505-76 = "뭔가?"
1013505-77 = "[s] \"좋은 광경을 봤다, 싶어서~\""
1013505-78 = "으이이이이이이이익!!!"
1013505-81 = "으으, 정말이지……. 왜 다들 저에게만……."
1013505-82 = "스톱, 스톱. 무슨 말 할지 알아요. 다들 저를 아끼고 있다거나 소중하게 생각해 주고 있다거나, 그런 말 하려고 했겠죠."
1013505-83 = "……그 정도 이야기했다고 왜 또 시무룩해지고 있는 겁니까. 진짜, 이 어른은……!"
1013505-84 = "[s] \"학교생활은 할 만해?\""
1013505-85 = "……."
1013505-86 = "뭐, 나쁘지 않아요. 그럭저럭이죠."
1013505-87 = "[s] \"케이 어 번역기. '정말 마음에 들어요! 너무 좋은 거 있죠!'\""
1013505-88 = "무슨 이상한 소리예요!!! 사람이 하는 말을 왜 또 사람이 하는 말로 번역하고 그러는데요!!!"
1013505-89 = "하아, 하아, 하아……."
1013505-90 = "아무튼 저는 퀘스트 중이니까 너무 신경 쓰이게 하지 말아 주셨으면 하네요."
1013505-91 = "네? 그러니까 저는 퀘스트……."
1013505-92 = "……!!!"
1013505-93 = "시, 심부름!!!!!"
1013505-94 = "그 흐뭇하면서도 능글능글한 웃음 금지라고 말했죠!!!!!"
1013505-95 = "[s] \"아직 말 안 했어!\""
1013505-96 = "그러면 이제부터 금지예요!"
1013505-97 = "[s] \"표정의 자유를 허가하라!\""
1013505-98 = "선생님만 예외예요!"
1013505-99 = "아, 케이다. 무슨 일이야?"
1013505-106 = "어……? 마침 잘됐네요. 이걸 전해 달라는 퀘스…… 부탁을 들어서요."
1013505-107 = "어디……. 아하. 드디어 결과가 나왔구나. 이번 금속화합물의 초전도성이……."
1013505-108 = "그런데 그런 거 인터넷으로 보내면 되는 거 아닌가요?"
1013505-109 = "웬만한 안건이었다면 그랬겠지만, 이것만은 안 돼."
1013505-110 = "어째서죠?"
1013505-111 = "보안 때문이야. 이 결괏값은 우리 동아리만 알아야 한다고! 다른 동아리 녀석들에게 기밀을 유출할 수는 없어!"
1013505-112 = "인터넷의 단 두 가지 단점이 보안 취약성과 데이터 보존 연한이니까 말이지!"
1013505-113 = "아, 그건 확실히 그렇죠. 결국 자기 테이프 저장장치를 버리기 어려운 이유이기도 하고요."
1013505-114 = "예산만 충분하다면, 크리스털 데이터 디스크를 대량으로 사용해서, 모든 걸 아카이브하고 싶지만…… 하아…… 무리겠지……."
1013505-115 = "그러면, 케이. 고생했으니까 같이 게임 센터 갈래?"
1013505-116 = "네, 네에? 그건……."
1013505-117 = "응? 왜 그래. 전에는 그렇게 좋아했잖아."
1013505-118 = "그땐 그랬는데요! 그게, 그러니까……."
1013505-119 = "[s] \"아하! 케이 쨩도 게임 좋아하는구나!\""
1013505-120 = "맞아요, 선생님! 선생님도 같이 가서 보면 놀랄걸요?"
1013505-121 = "아니에요! 그러니까 그건, 어디까지나……!"
1013505-122 = "어……? 그럼 그때는 별로 좋아하지 않았는데도 억지로 어울려 준 거야……?"
1013505-123 = "그것도 아니에요!"
1013505-127 = "[ns] \"어느 쪽이니~? 케이 쨩~?\""
1013505-128 = "이, 이, 이……!"
1013505-130 = "이 다 알면서도 일부러 모른 척하는 못된 어른 같으니라고!!!!!"
