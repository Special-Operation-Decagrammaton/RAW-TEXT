[translation]
1601906-1 = "새벽 정찰"
1601906-2 = "물론 우리의 방어 시스템에는 허점이 없을 겁니다. 다른 누구도 아닌, 리오 님이 구축한 방어 시스템이니까요."
1601906-3 = "하지만 예상 밖의 사태에는 언제나 대비해야 합니다."
1601906-4 = "거기에 이곳은, 여러 가지 의미로 일반적인 상식이 통하지 않는 곳이기도 하고요."
1601906-5 = "[s] \"역시 토키는 든든하구나.\""
1601906-6 = "감사합니다."
1601906-7 = "그리고 새벽 정찰에는 또 다른 이유가 있습니다."
1601906-8 = "[s] \"그게 뭔데?\""
1601906-9 = "이제 곧 알게 되실 겁니다."
1601906-17 = "네. 딱 좋군요."
1601906-21 = "보세요, 선생님. 이곳에서도 저렇게, 아침 해가 떠오르고 있습니다."
1601906-25 = "[wa:2060]― [log=토키 결전]예쁜 아침노을이네요.[/log]"
1601906-27 = "― [log=토키 결전]이곳에서는 매일, [wa:1510]이 경치가 [wa:470]관측됩니다. [/log]"
1601906-30 = "[wa:730]― [log=토키 결전]그렇다고 해도, [wa:1000]여기에 온[wa:80] [/log]"
1601906-32 = "― [log=토키 결전]며칠 분의 [wa:710]기록밖에 없기에. [/log]"
1601906-35 = "― [log=토키 결전]매일은 아닐지도 [wa:920]모르겠지만요.[/log]"
1601906-38 = "[ns] \"뭔가, 엄청나네.\""
1601906-40 = "[wa:1070]― [log=토키 결전]네. [wa:1460]그래도, [wa:950]이곳에서는 [/log]"
1601906-42 = "― [log=토키 결전]전혀 다른 색으로 [wa:690]느껴집니다.[wa:80] [/log]"
1601906-45 = "― [log=토키 결전]하늘도……[/log]"
1601906-47 = "― [log=토키 결전]주황색으로 빛나는 [wa:870]대지도…….[/log]"
1601906-50 = "[wa:890]― [log=토키 결전]저는, [wa:1040]선생님과 [wa:550]이렇게 풍경을 공유하는 [wa:1020]시간이 좋습니다.[/log]"
1601906-52 = "― [log=토키 결전]선생님께, [wa:1860]제가 느낀 것을 [wa:1490]전할 수 있다는 게 좋습니다.[/log]"
1601906-55 = "[wa:1900]― [log=토키 결전]이 순간은, [wa:1370]지금 이 시간에만 [wa:660]존재합니다. [/log]"
1601906-57 = "― [log=토키 결전]그리고, [wa:1150]다시는 돌아오지 않겠지요.[/log]"
1601906-60 = "[wa:2510]― [log=토키 결전]선생님.[/log]"
1601906-62 = "― [log=토키 결전]만일 지금 [wa:1280]'최후'의 순간이 [wa:570]다가온다면.[/log]"
1601906-65 = "[wa:730]― [log=토키 결전]저는, [wa:1230]선생님 곁에서 [wa:1530]그 순간을 함께 하는,[/log]"
1601906-67 = "― [log=토키 결전]'최후'의 한 사람이, [wa:570]될 수 있을까요?[/log]"
1601906-70 = "[ns] \"이게 토키가 좋아하게 된 풍경이구나.\""
1601906-71 = "그렇습니다."
1601906-72 = "물론, 이것이 역설적인 감정이라는 사실 정도는 알고 있습니다."
1601906-73 = "여기는 명백한 적진이고, 얼핏 보기에 좋아 보이는 것 역시."
1601906-74 = "바로 다음 순간, 우리에게 치명적인 결과를 불러일으킬 수 있을 테니까요."
1601906-75 = "하지만…… 새삼스럽게 느끼는 것입니다만, 인간이란 왜 이렇게 제멋대로인 것일까요."
1601906-76 = "아무리 말도 안 되는 상황이라도, 자기가 좋다고 느끼면, 그 상황을 그런 식으로 생각해 버리곤 하네요."
1601906-77 = "[s] \"아름다움을 찾고 느낄 수 있다는 건, 좋은 일이 아닐까.\""
1601906-81 = "[ns1] \"그건…… 어떤 상황에서도 희망을 놓지 않을 수 있다는.\"\n[ns2] \"또 하나의 증거이기도 할 테니까.\""
1601906-84 = "……그렇군요."
1601906-85 = "네? 그래도 '마지막 순간'이라든가 '최후의 한 사람' 같은 표현은 조금 무섭게 들리는 말이셨다고요?"
1601906-86 = "……."
1601906-87 = "생각해 보니, 그럴 수도 있을 것 같습니다."
1601906-88 = "하지만 괜찮습니다. 선생님 곁에는 제가 있으니까요."
1601906-89 = "다른 무엇보다, 저 자신이 절대로 그런 일이 일어나지 않도록 할 테니까요."
1601906-90 = "그렇게 하기 위해서 저는, 이런 무장까지 갖추고 이 자리에 있는 것입니다."
1601906-94 = "이런. 벌써 아침노을이 끝나 버린 모양입니다. 좋은 순간은 참 빠르게 지나가 버리네요."
1601906-95 = "……."
1601906-97 = "시간을 붙잡을 수 있다면, 얼마나 좋을까요."
1601906-98 = "그렇게만 할 수 있다면, 가장 반짝이는 순간순간만을."
1601906-99 = "누구에게도 빼앗기지 않을 중요한 곳에 모아서, 언제까지든 가져갈 수 있을 텐데요."
1601906-101 = "[ns3] \"그러게. 그럴 수 있다면, 정말 멋지겠네.\"\n[ns4] \"하지만 적어도 지금, 우리는 여기에 함께 있잖아?\""
1601906-104 = "……."
1601906-105 = "네. 그렇지요. 적어도 선생님께서는……."
1601906-106 = "저와, 그리고 선생님이……."
1601906-107 = "……."
1601906-108 = "선생님."
1601906-109 = "[s] \"응?\""
1601906-110 = "잠시만, 그 자리에 그대로 계셔 주실 수 있겠습니까?"
1601906-114 = "(그렇게 이야기한 토키는.)"
1601906-120 = "(다음 순간, 조심스럽게 다가와 살포시 안겨 왔다……!)"
1601906-121 = "[ns] \"토, 토키야?!?!\""
1601906-122 = "쉬잇. 다른 분들이 깨어나실지도 모릅니다."
1601906-123 = "잠깐이면 됩니다, 선생님. 아주, 잠깐이면."
1601906-125 = "……."
1601906-126 = "시간을 붙잡는 대신, 네."
1601906-127 = "네……."
1601906-131 = "감사합니다. 선생님."
