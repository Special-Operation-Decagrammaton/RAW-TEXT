[translation]
500-1 = "크래프트 챔버란?"
500-2 = "크래프트 챔버"
500-3 = "업무는 잘 진행하고 계십니까, 선생님."
500-4 = "네. 또 저입니다. ……그건 반갑다는 표정이겠죠, 분명?"
500-5 = "……아무튼."
500-6 = "샬레 건물에 대한 안내를 드리려고 왔습니다."
500-7 = "샬레 건물의 지하……. 이곳에는 총학생회장이 선생님께 남긴 또 다른 물건이 있습니다."
500-8 = "물건이라고 해야 할까……. 정확히는 시설이라고 불러야겠군요."
500-10 = "<크래프트 챔버>."
500-11 = "결론부터 말하자면 싯딤의 상자의 관리자만이 접속할 수 있는 일종의 물질 생성기입니다."
500-12 = "3D 프린터…… 같은 걸까요? 원리는 잘 모르겠지만."
500-13 = "당신만이 작동시킬 수 있는 오파츠 같은 것이라고 이해하고 있습니다."
500-14 = "저희는 이런 총학생회장의 장난감에는 관심 없어서……."
500-15 = "뭐, 아무튼."
500-16 = "확실히 전달드렸습니다."
500-17 = "그럼 또 나중에."
