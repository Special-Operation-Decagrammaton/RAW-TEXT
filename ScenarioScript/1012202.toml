[translation]
1012202-1 = "나도 알지 못한 내 모습"
1012202-3 = "와-오, 선생님이다!"
1012202-4 = "뭐 하고 있었어?"
1012202-5 = "산책 중이었구나. 둘러보니 어땠어?"
1012202-6 = "[s] \"멋진 해변이야.\""
1012202-7 = "헤헷, 그렇게 생각한다니 다행이네."
1012202-8 = "티파티에는 이런 프라이빗한 곳이 많냐고?"
1012202-9 = "음~ 난 자세히는 모르지만……"
1012202-10 = "아마 꽤 있지 않을까? 나 이외의 애들이라면 잘 알 것 같아."
1012202-11 = "아, 선생님. 그러고 보니, 이번에 티파티에 대한 인상이 조금 바뀌었다고 하던데."
1012202-12 = "어때, 어때? 어떤 부분들이 그랬어?"
1012202-13 = "[s] \"다들 평소와는 다른 모습이 신선했지.\""
1012202-14 = "아하하, 그렇겠네. 선생님과는 업무로 만나는 경우가 많았으니까."
1012202-16 = "(이번에 알게 된 티파티 멤버들의 새로운 면모에 대해 미카와 이야기를 나누었다.)"
1012202-18 = "뭐, 어떻게 보면 그게 '평소의 모습'이겠지?"
1012202-19 = "자연스럽달까. 말하자면 본래의 성격? 아하핫."
1012202-20 = "[s] \"미카는 그런 모습들을 알고 있었겠네.\""
1012202-21 = "응☆ 만난 지도 오래됐으니까!"
1012202-22 = "그러니까, 평소와 좀 다른데~ 하는 부분은 바로 알 수 있어."
1012202-23 = "요즘 기운이 없어 보이네…… 같은 느낌이랄까."
1012202-24 = "그래서 휴가 때 숨 좀 돌렸으면 좋겠다고 생각했거든!"
1012202-25 = "……잘 됐는지는 모르겠지만 말야."
1012202-26 = "[s] \"좋은 기분 전환이 되었을 거야.\""
1012202-27 = "그랬으면 좋겠다아♪"
1012202-28 = "뭐, 친구들과 달리 나는 딱히 신선한 면모 같은 건 없지만."
1012202-29 = "응? 나야 항상 똑같은걸."
1012202-30 = "언제나 성가시고, 말썽 많은 문제아니까."
1012202-31 = "이번에도 나 때문에 여러 가지 문제가 일어났었고……"
1012202-32 = "아하하, 왠지 슬퍼졌어."
1012202-33 = "그래도 일관적이라면 일관적이겠지."
1012202-34 = "[s] \"나는 미카의 다른 모습도 알고 있는데.\""
1012202-35 = "으응?"
1012202-36 = "[s] \"친구들을 잘 살피잖아?\""
1012202-37 = "그, 그래……?"
1012202-38 = "딱히 그런 것 같진 않은데……"
1012202-39 = "여러 포인트에서 그런 부분을 느꼈다고?"
1012202-43 = "선생님, 평가가 후하네에?"
1012202-44 = "나, 착한 아이도 아닌데……"
1012202-45 = "[ns1] \"아직 미카가 모르고 있을 뿐……\"\n[ns2] \"좋은 점은 많이 있다고 생각해.\""
1012202-49 = "뭐야…… 그렇게 진지한 표정으로……"
1012202-50 = "……"
1012202-53 = "선생님, 나도 모르는 나를 찾아주고 있는 것 같아서…… 왠지……"
1012202-54 = "……하지만, 선생님 말이 맞을지도."
1012202-55 = "나는 눈치채지 못했지만, 좋은 점이 있을지도 모르고?!"
1012202-56 = "매력 폭발해서 완전 인기인이 되면 어떡하지? 막 이래☆"
1012202-58 = "(왠지, 평소보다 들떠 보이는 미카와 이런저런 이야기를 하다가 돌아왔다.)"
