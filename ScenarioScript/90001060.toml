[translation]
90001060-1 = "제6화;불꽃"
90001060-6 = "……."
90001060-7 = "……."
90001060-12 = "?"
90001060-17 = "[ns1] \"흔적을 따라왔더니…….\"\n[ns2] \"뭔가, 눈 위에 화산이 보이네?\""
90001060-20 = "따듯하네요!"
90001060-21 = "더워!"
90001060-22 = "저는 딱 좋다고 생각합니다."
90001060-27 = "아뇨, 에이미. 저는 아직도 약간이지만 추워요. 에이미가 조금 벗어나 있는 거라구요."
90001060-28 = "사람은 원래 이 정도, 아니, 이보다 훨씬 더 높은 온도에서 살아가도록 되어 있는 생물이라구요."
90001060-29 = "그렇지만 더운 건 더운걸. 조금 전까지는 시원해서 좋았는데."
90001060-33 = "안 되겠어, 선생님. 나 조금 벗을게."
90001060-34 = "[s] \"안 돼, 에이미! 진정해!\""
90001060-35 = "어째서? 사람은 원래 추위보다 더위에 약한 생물이야."
90001060-36 = "더위에 갑자기 노출되면, 흔히 일어나곤 하는 증상이 열사병인데……."
90001060-37 = "이 증세가 나타나면 인간은 버틸 수가 없어. 즉시 의식이 흐려지며 몸에 경련이 일어나고 저혈압, 탈수 증상이 일어나 사망하기까지 한다구."
90001060-38 = "심지어 열사병으로 사망하게 되면, 사인을 판별하기 어려워지기까지 한단 말이야."
90001060-39 = "무엇보다 더위라는 불쾌감을 억지로 참아 가면서 작전을 계속하는 것은, 비합리적인 행위인걸."
90001060-40 = "[s3] \"유독 특정 증상에 자세한 건 이해하겠는데…….\"\n[s4] \"그래도 조금만 참아 줘…….\""
90001060-43 = "……고생이 많으시네요. 선생님."
90001060-44 = "네? 저에게 위로를 받는 날이 오게 되다니, 감개가 무량하시다고요?"
90001060-45 = "무슨 말씀이신가요. 저같이 다른 사람의 마음을 자기 것처럼 이해할 줄 알고."
90001060-46 = "나아가 그 사람의 마음을 이해하고 위로할 줄 아는…… 그렇군요. 청초병약계열의 천재 해커이자 자상하고 자애로운 부장, 그리고 만능이자 전지인 미소녀에게."
90001060-47 = "이 정도는 숨 쉬는 것만큼이나 자연스럽게 이루어지는 간단한 행위랍니다. 네. 간단한 행위이고 말고요. 중요하니까 두 번 말씀드렸어요."
90001060-51 = "[ns] \"……그래, 그래. 히마리 말이 다 맞아…….\""
90001060-52 = "어째 표정과 말씀이 따로 놀고 계시는 것 같은데요……?"
90001060-56 = "흔적은 이 근처에서 끊긴 것 같아. 주위를 쭉 정찰하고는 있지만……."
90001060-57 = "지형이 바뀌었고, 상황 역시 변한 셈이로군요."
90001060-58 = "무엇보다 여기저기에서……."
90001060-66 = "기계들이 작동하고 있군요."
90001060-67 = "응. 땅을 파고, 드릴로 뭔가를 부수고, 그걸 실어 나르고……. 바빠 보이네."
90001060-68 = "저거, 시추 기계 같은 거죠?"
90001060-69 = "시추…… 자원 탐사를 목적으로 지면에 구멍을 파는 일이지? 그렇다면 여기에서도 뭔가를 채취하고 있다는 걸까?"
90001060-70 = "화산 지대는 다양한 광석들이 침전되는 환경이기는 해."
90001060-71 = "가령 화산이 구리 광석을 만들기도 하고, 활화산 근처에서 황을 대량으로 채취하는 것도 가능하니까. 그렇지만–"
90001060-82 = "회장?!"
90001060-83 = "재밍이에요! 토키?"
90001060-85 = "네. 히마리 부장. 방금 강력한 방해 전파가 이 지역의 전역으로 송출된 것을 확인했습니다. 그리고……?"
90001060-90 = "……아비 에슈흐의 상태가, 조금, 정상적이지 않은 것 같습니다. 아무래도 이 방해 전파는 전자 장비에 전반적으로 부하를 가하는 것처럼 보입니다."
90001060-91 = "괜찮아. 이런 건 보통 때리면 나으니까."
90001060-93 = "에, 에이미?!"
90001060-100 = "안 낫네요."
90001060-101 = "이상하네……. 각도가 잘못됐나?"
90001060-102 = "[s] \"아니야. 그런 문제는 아닐 거야…….\""
90001060-103 = "그런 건가……."
90001060-104 = "어쩔 수 없군요. 일단은 통상 모드로 이행하겠습니다."
90001060-105 = "아비 에슈흐를, 리오 님께서 AMAS로 준비하여 주신 임시 이동 트레일러에 격납하면……."
90001060-106 = "……이럴 수가. 트레일러도 재밍의 영향으로 작동이 중지된 모양입니다. 그렇다면 저에게 남은 방법은……."
90001060-107 = "…………수동으로, 아비 에슈흐를 해제하는 것밖에 없다는 것인가요……."
90001060-109 = "나도 도와줄게."
90001060-110 = "감사합니다. 에이미."
90001060-116 = "잠시만요. 지금 어떻게든 작동하는 장비들로……."
90001060-117 = "이 방해 전파는 통상의 수준을 아득하게 넘어선 상태이니까, 오히려 그걸 이용해서…… 아주 기초적인 장치로도……."
90001060-118 = "찾았어요! 방해 전파는 저쪽 방향에서 방출되고 있어요!"
90001060-128 = "뭔가 이상한 시설 같은 게 보이는데? 레이더 기지?"
90001060-129 = "아니면, 이 방해 전파를 송출하고 있는 시설이거나요."
90001060-130 = "……어쨌든 이 재밍을 해결해야 해요. 그것만은 확실합니다."
90001060-131 = "그렇게 판단하는 근거는?"
90001060-132 = "이대로라면 아비 에슈흐를 사용하기 어려워요. 그건 우리에게 큰 전력 손실이죠."
90001060-133 = "그리고…… 이건 인정하기 싫지만……."
90001060-134 = "……."
90001060-135 = "네. 리오의 AMAS 부대와 그 네비게이션 없이 이 지역에 언제까지나 머무르는 건, 매우 위험한 일이겠죠."
90001060-136 = "이건 어디까지나 효용성 면에서 내린 결정이에요. 그것만은 확실하게 말해 두겠어요. 모두 아시겠죠?"
90001060-137 = "(하여튼 회장 관련 일이라면 솔직하지 못하다니까…….)"
90001060-138 = "그렇군요. 에이미. 그 표정은 '히마리 부장께서는 리오 님과 관련된 일에 대해서는 솔직해지지 못한다'고 말하는 표정이로군요."
90001060-140 = "?!?!"
90001060-142 = "나, 그렇게 쉽게 얼굴에 드러나는 타입?"
90001060-143 = "아뇨. 그냥 해 본 말이었습니다."
90001060-144 = "그럴 거라고 생각했어……."
90001060-145 = "[s] \"일단, 저곳으로 가 보자.\""
90001060-146 = "네. 그렇게 하죠. 선생님. 정황과 방향, 그 밖의 모든 조건이 저곳을 가리키고 있네요."
90001060-147 = "앞장서겠습니다."
90001060-148 = "부장도 선생님도, 모두 조심해."
