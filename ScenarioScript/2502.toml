[translation]
2502-1 = "매너가 게임을 만든다 2"
2502-2 = "밀레니엄 학원 인근 대형 게임센터"
2502-7 = "전에 왔을 때보다 훨씬 규모가 커졌네. 그 사이 개축 공사라도 한 걸까?"
2502-8 = "그러게. 우와, <스페이스 캣>의 신작 아케이드도 들어왔어!"
2502-10 = "유즈, 저기에 신작 콘솔 게임기의 시연대가 있습니다."
2502-11 = "아아…… 드디어 15세대 콘솔 게임기의 시대가……"
2502-12 = "어디 보자…… 측면에 새로운 방식의 냉각 장치를 부착했네. 이로써 지난 세대의 문제가 확실히 개선되었어."
2502-13 = "게다가 하이엔드 게이밍 메모리 덕분인지 반응 속도도 훨씬 더 빨라졌고……."
2502-14 = "하하…… 역시 유즈는 게임에 관련된 일이라면 의욕이 넘치네."
2502-15 = "언니, 우리도 저기에 있는 스페이스 캣을 플레이하러 가보자."
2502-16 = "좋아. 봐주지 않을 테니까 각오해……."
2502-17 = "……아니, 이러고 있을 때가 아니잖아!"
2502-18 = "다들 우리가 여기에 온 목적을 잊어버린 거야? 어서 그 괘씸한 비매너 게임 유저를 찾아내야지!"
2502-21 = "아니, 나는 애초에 새로운 콘솔 패드를 구입하러 온 건데."
2502-22 = "모모이, 쓰러트릴 몬스터가 잔뜩 있습니다. 어떤 게임부터 할까요?"
2502-23 = "나도 싸우는 것보다는…… 새로운 게임기를 느긋하게 살펴보고 싶어……."
2502-24 = "안 돼, 이러는 사이에도 그 유저가 또 다른 게임 유저에게 폭언을 내뱉고 있을지도 모른다고!"
2502-25 = "그렇게 실망한 유저가 떠나고, 또 다른 유저가 떠나면…… 대전 게임을 하는 사람이 전부 없어질지도 몰라!"
2502-26 = "너무 비관적인 생각 아니야?"
2502-27 = "이는 세계를 구하기 위한 숭고한 싸움……"
2502-28 = "용사들이여, 어서 마왕의 거처로 향하죠!"
2502-29 = "그래, 빨리 <스튜던트 파이터 2>가 설치된 구역으로 이동하자고!"
2502-31 = "생각보다 사람이 별로 없네. 벌써 돌아간 게 아닐까?"
2502-32 = "아냐, 그럴 리가 없어. 화면의 ID를 잘 살피며 확인해 봐."
2502-35 = "이 유저도 아니고……"
2502-38 = "이 유저도 아니고……."
2502-46 = "얏호, 또 이겼다! 연전연승!"
2502-47 = "으으, 또 졌어…… 모처럼 비장의 기술까지 사용했는데……."
2502-48 = "방금 보여준 그 허접한 연계기가 비장의 기술이었다고? 진심이야?"
2502-49 = "우리 할머니가 그것보다는 더 잘하겠다! 크크크…… 푸훗!"
2502-50 = "뭐? 아무리 게임이라지만 어떻게 그렇게 심한 말을 할 수가 있어?"
2502-51 = "당장 그 말 취소해!"
2502-52 = "싫거든? 바보, 바보~ 게임도 제대로 못하는 바보~"
2502-53 = "으으…… 엄마한테 일러줄거야!"
2502-57 = "우와, 심하네. 현실에서도 저런 폭언을 내뱉는 게이머가 있다니."
2502-58 = "아앗, 찾았다! 그 때 보았던 그 ID야!"
2502-61 = "으응? 뭐야, 너희들도 내게 도전할 셈이야?"
2502-64 = "너, Sukeban312 맞지? 어제 온라인 대전으로 나를 할머니라고 불렀던 그 녀석!"
2502-65 = "그 말은…… 네가 Peach_Figther?"
2502-66 = "하하, 뭐야. 예상한 대로 역시 꼬맹이였잖아?"
2502-67 = "뭐라고~?!"
2502-68 = "정말 무례한 사람이네. 만나서도 그런 말을 계속하다니……."
2502-69 = "모모이, 빛의 검으로 이 사악한 마인을 정화하도록 버리죠!"
2502-70 = "당장 어제의 폭언에 대해 사과하지 않으면 뜨거운 맛을 보게 해 주겠어! 당장 사과해!"
2502-71 = "싫거든."
2502-72 = "어째서!"
2502-73 = "나는 나보다 약한 상대에게 사과를 하지 않아."
2502-74 = "나보다 게임도 못하는 사람에게 머리를 숙이는 건 자존심 상하는 일이잖아?"
2502-76 = "이 녀석이 진짜!"
2502-77 = "……언니, 쏴버릴까?"
2502-78 = "용사여, 저는 검을 뽑을 준비를 이미 마쳤습니다."
2502-80 = "후후, 그렇게 억울하다면 이 자리에서 <스튜던트 파이터 2>로 승부를 보는 게 어때? 한 판이라도 날 이긴다면 어제의 일에 대해서는 사과할게."
2502-81 = "좋아. 이번에는 봐주지 않을테니까……."
2502-82 = "미리 머리 박고 사죄할 준비나 하고 있으라고!"
2502-83 = "그럼……"
2502-89 = "승부다!"
2502-96 = "<SYSTEM> 'Sukeban312' 선수의 승리!"
2502-97 = "풋! 뭐야, 자신만만하게 나선 주제에 또 졌잖아?"
2502-98 = "너 정말 게임에 재능 없는 거 아니야? 크크……."
2502-99 = "잠까아아안! 좌하단에 가드한 상태로 앉아서 대기하는 건 반칙이지!"
2502-100 = "비겁하게 견제기만으로 게임을 끝내다니!"
2502-101 = "뭐? 이것도 엄연한 게임의 기술이라고. 억울하면 또 다른 파훼법을 찾아와야지, 비공식 룰을 가져와서 억지를 부리는 건 유치하지 않아?"
2502-102 = "으으으…… 젠장!"
2502-104 = "……이상하네. 견제기는 둘째 치더라도 언니의 특수 기술이 전혀 먹히지 않는 것 같아."
2502-105 = "뭔가 우리가 놓친 게 있는 걸까?"
2502-106 = "……아마도 상대는 버그를 악용하고 있는 것 같습니다."
2502-107 = "버그?"
2502-108 = "네, <스튜던트 파이터 2>에는 특수한 조작을 입력하면 아주 잠깐 동안 기기에 프리즈가 걸리는 버그가 있습니다."
2502-109 = "아마 상대는 그 버그를 악용해서 모모이의 공격을 회피하고 있는 것 같습니다."
2502-110 = "그럼 우리가 이길 방법이 없잖아!"
2502-111 = "상대와의 실력 차이가 크게 난다면 모르겠지만, 지금의 상황으로는……."
2502-114 = "………."
2502-121 = "저기…… 혹시 모모이 대신 내가 대전을 이어가도 괜찮을까……?"
2502-122 = "뭐야, 새로운 도전자인가?"
2502-123 = "좋아, 받아주지. 어차피 이 몸의 기술 앞에 금방 무너질 게 분명하지만 말이야. 하하!"
2502-124 = "이번에는 진심으로 나가볼까……."
2502-125 = "<SYSTEM> 시합, 시작!"
2502-132 = "<SYSTEM> 풀 카운트 콤보! 'UZQueen' 선수의 퍼펙트 승리!"
2502-133 = "마, 말도 안 돼…… 이런 어린애한테 내가 졌다고?"
2502-134 = "심지어 한 번도 때리지 못하고 연속 콤보에 당하다니……!"
2502-135 = "사과……."
2502-136 = "뭐라고?"
2502-137 = "약속대로 모모이에게 사과해……."
2502-138 = "으으…… 분하지만 약속이니 어쩔 수 없나."
2502-140 = "……미안해. 아까는 내가 말이 심했어."
2502-143 = "대단해, 유즈! 이 건방진 게이머의 코를 순식간에 납작하게 만들다니!"
2502-144 = "심지어 퍼펙트 승리라니…… 정말 대단해!"
2502-145 = "역시, 전설의 용사 'UZQueen'다운 승리입니다!"
2502-146 = "자, 잠깐…… 다들 너무 호들갑 떨지마…… 부끄럽단 말이야……."
2502-148 = "잠깐, 네가 'UZQueen'이라고?"
2502-149 = "온라인 대전 랭킹에서 1위 자리를 절대로 내어준 적이 없지만, 한 번도 그 모습을 본 사람이 없다는 그 전설의 게이머?"
2502-150 = "저, 전설의 게이머는 아니지만…… 'UZQueen'이라면 내가 맞는데……."
2502-153 = "뭐? 저 여자애가 그 'UZQueen'이라고?"
2502-154 = "'UZQueen'이라면…… 대전 액션 게임은 물론이고 리듬 게임 1위 자리를 놓치지 않는다는 그 전설의 게이머잖아?"
2502-155 = "'UZQueen'을 이런 곳에서 볼 수 있게 되다니……."
2502-156 = "'UZQueen'님, 사인 좀 부탁드려요!"
2502-157 = "어이, 새치기 하지 마! 사인을 받는 건 내가 먼저라고!"
2502-158 = "으, 으아아…… 사람이 잔뜩……."
2502-159 = "도, 도와줘! ……모모이! 미도리! 아리스!"
2502-160 = "아아, 역시 게임 센터라 그런지 알아보는 사람이 많네."
2502-161 = "이렇게나 유즈 쨩을 좋아해주는 사람들이 많다니, 내 기분이 더 뿌듯할 정도야."
2502-162 = "용사여, 훌륭한 왕으로 거듭나려면 왕관의 무게를 견뎌야 합니다."
2502-163 = "나, 나는 이런 걸 바라고 게임을 한 게 아닌데……."
2502-164 = "'UZQueen'님, 오신 김에 한 수 가르침을 부탁드리겠습니다!"
2502-165 = "저도 가르침을!"
2502-166 = "사람들이 점점 더 많이……"
2502-167 = "더는 싫어어어어어!"
2502-169 = "이후, 유즈는 몰려드는 팬들과 억지로 인사를 나눈 뒤에야 간신히 게임 센터를 빠져나올 수 있었다……."
2502-170 = "매너가 게임을 만든다"
