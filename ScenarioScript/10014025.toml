[translation]
10014025-10 = "으, 으윽……. 으으윽……. 뭐, 뭐야……"
10014025-11 = "갑자기……. 기습이라니……."
10014025-16 = "아하하하하!! 트리니티의 심판자, 이 우자와 레이사로부터 숨을 수는 없습니다. 이 악당들!!"
10014025-17 = "자기 입으로 저런 낯 뜨거운 단어를……. 최악이다……."
10014025-18 = "게다가 매번 말이 다르잖아……. 아까 전엔 모두의 기사라며……."
10014025-20 = "……지원요청이라기에 빠르게 달려 왔더니, 혼자 먼저 다 해결해 버리셨군요."
10014025-21 = "뭐……. 이것도 레이사 씨다운 모습이긴 합니다만……."
10014025-23 = "……아. 스즈미 씨!!"
10014025-24 = "죄송해요. 아무래도 타이밍이 늦을 것 같아서 먼저 들어가 버렸습니다!"
10014025-25 = "그래도 스즈미 씨가 와주신다 한 덕분에 용기가 난 거니까요! 충분히 지원이 됐던 것으로!"
10014025-26 = "역시 스즈미 씨라고 할 수 있겠군요! 그야말로 트리니티의 달리는 섬광탄!!"
10014025-27 = "그, 그렇습니까……. 모쪼록 다행입니다만……."
10014025-28 = "아무튼 그렇게 불러 주시는 건 이제 그만해 주십시오……. 부탁입니다……."
10014025-29 = "……어라? 그런데……. 옆의 분은?"
10014025-30 = "으음……. 그러고 보니 어디선가 뵌 적이 있었던 거 같은 느낌이……?"
10014025-31 = "[s1] \"안녕, 레이사.\"\n[s2] \"조금 전에도 봤었지.\""
10014025-32 = "……! 역시 그렇죠! 기억이 납니다!"
10014025-33 = "……! 역시 그렇죠! 기억이 납니다!"
10014025-34 = "불한당 쿄야마 카즈사에게 붙잡혀 있던 분이로군요!? 괜찮으신가요? 해코지는 당하지 않으셨고요?"
10014025-35 = "[s3] \"붙잡혀 있었다고? 내가?\"\n[s4] \"……불한당? 카즈사가?\""
10014025-36 = "레이사 씨. 먼저 인사부터 하시는 게 좋겠습니다. 이분은 샬레의 선생님이세요."
10014025-37 = "레이사 씨. 먼저 인사부터 하시는 게 좋겠습니다. 이분은 샬레의 선생님이세요."
10014025-38 = "……네? 선생님? 샬레의?"
10014025-39 = "어라. 뭔가 기억날 거 같기도……."
10014025-40 = "[s5] \"다시 인사할게. 안녕, 레이사.\"\n[s6] \"응. 내가 선생님이야.\""
10014025-41 = "아, 안녕하세요……. 저는 트리니티의 기사, 우자와 레이사라고 합니다……?"
10014025-42 = "아, 안녕하세요……. 저는 트리니티의 기사, 우자와 레이사라고 합니다……?"
10014025-43 = "레이사 씨. 그러잖아도 저희 또한 아까 전 일에 관한 거로 찾아왔습니다. 시간 괜찮으실까요?"
10014025-44 = "아무래도 그 쿄야마 카즈사란 분에 대해, 레이사 씨의 오해가 조금 있으신 것 같아서……."
10014025-45 = "……네?"
10014025-46 = "오해라니요? 무슨 오해요? 아까 전의 일……?"
10014025-50 = "어……. 설마……."
10014025-52 = "혹시 아까 전 그 사람이 사실 쿄야마 카즈사가 아니었다던가……!?"
10014025-54 = "아니, 그런 이야기는 아니고……."
10014025-55 = "……아뇨!"
10014025-56 = "아뇨아뇨아뇨아뇨아뇨! 그럴 리가요!"
10014025-57 = "……!?"
10014025-58 = "스즈미 씨. 제 눈은 정확합니다. 그 사람은 쿄야마 카즈사에요! 쿄야마 카즈사임이 틀림없었습니다!"
10014025-59 = "아무리 이전과는 다른 복장과 분위기로 위장하고 있다 해도 제 눈을 속일 순 없어요. 확실합니다!"
10014025-60 = "애초에 겉모습으로는 숨길 수 없는, '짐승의 오라'가 풍겨 나오니까요!"
10014025-62 = "그렇지 않습니까? ……선생님!? 그건 분명 쿄야마 카즈사였죠!?"
10014025-63 = "[s7] \"일단은 카즈사가 맞긴 한데.\"\n[s8] \"짐승……???\""
10014025-64 = "보세요! 제 말 맞죠? 모를 수가 없다니까요? 모를 수가 없는 것입니다!"
10014025-65 = "보세요! 제 말 맞죠? 모를 수가 없다니까요? 모를 수가 없는 것입니다!"
10014025-66 = "스즈미 씨, 저는 알고 있습니다."
10014025-69 = "그 사람은……. 쿄야마 카즈사는!"
10014025-72 = "한때 어두운 뒤 세계를 떨게 만들던 신화!!"
10014025-74 = "우는 스케반도 그치게 만든다는 공포의 괴묘 <카스팔루그>!!"
10014025-78 = "동시에 중학교 시절의 제가……."
10014025-79 = "단 한 번도 쓰러뜨리지 못했던 유일한 스케반! 강적 중의 강적!"
10014025-80 = "아니……"
10014025-81 = "저의 '숙적'!!"
10014025-83 = "카스팔루그라니, 무슨 동화책에 나오는 고양이 마수입니까……. 또 거창한 별칭을……."
10014025-84 = "그것 보다 레이사 씨. 우선 진정하시고 선생님의 말씀을……."
10014025-85 = "어느 날 갑자기 자취를 감춰 버려서, 누구도 그 행적을 알지 못한다고 들었는데……!"
10014025-86 = "그런데 설마!! 이렇게 평온한 곳에서, 재기의 기회를 엿보고 있었을 줄이야……!!"
10014025-87 = "스즈미 씨! 선생님!! 이대로라면 쿄야마 카즈사가, 카스팔루그가 부활할 거예요!! 다시 한번 이 일대가 암흑가로 물들 겁니다!!"
10014025-88 = "즉 이것은 사명!! 그것을 막아야 한다는, 누구에게도 넘길 수 없는 저의 사명입니다!!"
10014025-89 = "아무튼 레이사 씨. 지금 선생님께서는 레이사 씨의 그 생각이 오해라고 말씀하시려는 거예요."
10014025-93 = "……예?"
10014025-94 = "오해라뇨? 그게 무슨 말씀이시죠?"
10014025-95 = "쿄야마 카즈사는 이제 더 이상 스케반이 아니라고요……? ……그럼요?"
10014025-96 = "……네?"
10014025-97 = "지금은 평범하게 학교생활을 하고 있다……라고요……?"
10014025-98 = "……쿄야마 카즈사가요?"
10014025-102 = "……쿄야마 카즈사가요?"
10014025-103 = "[s9] \"두 번 물어봤다.\"\n[s10] \"어지간히 믿기 어려운 모양이네.\""
10014025-104 = "그, 그럴 리가요. 으음……. 말이 안 되는데요!? 그게 말이 되나……? 무슨 이유로……?"
10014025-105 = "그, 그럴 리가요. 으음……. 말이 안 되는데요!? 그게 말이 되나……? 무슨 이유로……?"
10014025-106 = "그, 그렇지만 이렇게 스즈미 씨와 선생님까지 오셔서 그렇게 말씀하신다는 건……."
10014025-107 = "……어……? 어라? 얼라라……?"
10014025-108 = "잘은 모르겠지만 납득하기 어려우신 모양이네요. 레이사 씨."
10014025-109 = "그, 그야……. 스즈미 씨는 쿄야마 카즈사를 모르시니까요……."
10014025-110 = "그 쿄야마 카즈사라구요!? 카스팔루그라고요!?"
10014025-111 = "누구도 막을 수 없는 짐승이라고요!!"
10014025-112 = "그런 존재가……. 평범하게……?"
10014025-113 = "[s11] (레이사에게 카즈사의 이미지는…….)\n[s12] (무슨 짐승이나 마수 같은 느낌인가…….)"
10014025-114 = "어……. 그, 그렇지만 다른 사람도 아니고 두 분이 그렇게 말씀하신다니……."
10014025-115 = "어……. 그, 그렇지만 다른 사람도 아니고 두 분이 그렇게 말씀하신다니……."
10014025-116 = "……그……."
10014025-117 = "죄, 죄송해요. 솔직히 조금 혼란스러워서……. 생각할 시간을 좀 가져도 괜찮을까요……?"
10014025-118 = "[s13] \"물론이지. 나중이라도 언제든 연락해.\"\n[s14] \"느긋하게 생각해도 좋아. 우릴 믿어줘.\""
10014025-119 = "아, 네. 네에……."
10014025-120 = "아, 네. 네에……."
10014025-121 = "그럼 저는 이만……."
10014025-128 = "……가버리셨네요."
10014025-129 = "그래도 어떻게 오해는 잘 풀어드린 것 같습니다. 다행이네요."
10014025-130 = "[s] \"뭔가 방금 레이사…….\""
10014025-132 = "[ns] \"어딘가 살짝 힘이 없어 보이지 않았어?\""
10014025-133 = "그런가요? 음. 죄송합니다. 저는 잘……."
10014025-137 = "……선생님?"
