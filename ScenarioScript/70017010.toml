[translation]
70017010-1 = "제1화;183 VS 227"
70017010-4 = "심부름 완료. 확인 작업, 개시."
70017010-8 = "먼저, 에리나. <마트에서 감자 3kg 한 포대 사 오고, 혹시 싹 난 거 있으면 들고 오기 무거울 테니까 거기서 버리고 와~>"
70017010-9 = "<감자 3kg 한 포대 구매. 감자 두 개가 싹이 나 있어서 마트 앞 쓰레기통에 3kg 다 버림.> 완료."
70017010-10 = "다음, 안나. <철물점에 가서 +5mm -8mm 드라이버 사다주겠니?>"
70017010-11 = "<-3mm 드라이버 하나 구매.>, 좋아."
70017010-12 = "마지막으로, 내 거. <천공카드 표시용 적당한 색연필>"
70017010-13 = "<중질 판지에 적합하게 기재할 수 있는 RIS S 6006 유성 경질, 5R 4/14 카마인레드. 심선 3.0mm심 색연필 12개> 구매 완료."
70017010-17 = "이번 심부름도 에러 없음. 뿌듯."
70017010-18 = "거기에, 짐이 가벼워서 편리."
70017010-19 = "그런데……."
70017010-23 = "음……."
70017010-27 = "여기는…… 어딜까요-?"
70017010-33 = "227호 특별반"
70017010-39 = "휴우…… 눈폭풍이 꽤 격심하군요. 데려와주셔서 감사합니다."
70017010-40 = "신경 쓰지 마시기 바랍니다. 종종 이렇게 미아가 됩니다."
70017010-41 = "열한 살 때에 비해서는 빈도가 10%가량 줄었습니다. 낙관적인 경향입니다."
70017010-42 = "자기소개를 잊고 있었습니다. 후루하타 라나, 12살입니다. 심부름의 달인이며, 취미는 뜨개질과 암벽등반입니다."
70017010-44 = "보통은 미아가 되면 울거나 불안해하는데, 씩씩해서 다행이네."
70017010-45 = "눈보라가 치기 전에 시구레 쨩이 발견해 줘서 정말 다행이야……."
70017010-46 = "눈밭에서 우두커니 서 있길래 놀랐어. 괜찮아?"
70017010-48 = "경로탐색에 실패해서, idle 상태로 대기하고 있었습니다."
70017010-49 = "소다맛 나그네께서 인터럽트 해주시지 않으셨다면, 지금쯤 조난당했으리라 생각됩니다. 감사합니다."
70017010-51 = "이, 인터럽트? 그게 뭐지?"
70017010-52 = "소다맛 나그네라니 재미있는 표현이네."
70017010-53 = "그래서…… 라나 쨩, 집은 어디야?"
70017010-55 = "집……."
70017010-62 = "(183호는 특별반. 그러니까, 엄밀히 말해서 집은 아니야.)"
70017010-63 = "(거기는 아주 좋아하는 친구들과 살고 있는 장소. 즉, 애착이 있는 집단과 구조물에 불과해.)"
70017010-69 = "집은…… 없습니다."
70017010-74 = "……!"
70017010-75 = "집이 없다고? 아니, 어떻게 그런…… 이렇게 어린아이인데……."
70017010-76 = "사무국은 대체 뭘 하고 있는 거야?!"
70017010-78 = "구체적으로 말씀드리자면 사무국의 결정으로 이렇게 됐습니다. 그래도 큰 불편은 없습니다."
70017010-80 = "그럴 리가! 그 무책임한 꼬맹이, 정말 너무해!"
70017010-81 = "그런데 그렇다면, 평소엔 어디서 살아?"
70017010-83 = "몸을 의탁하는 거처는 있습니다. 제가 오늘 돌아가려고 의도한 목적지이기도 합니다."
70017010-84 = "자치구 서쪽에 위치한 숲에서 다섯 번째로 키가 큰 자작나무 옆길을 따라 올라가면 보이는 산 중턱에서 저를 포함한 3명이 지내고 있습니다."
70017010-86 = "다행이야, 지낼 장소는 있는 거구나……."
70017010-87 = "지금 당장은 눈폭풍이 멎을 때까지 기다리자. 있다가 바래다줄게."
70017010-91 = "아차, 소개가 늦었네. 얘는 노도카, 나는 시구레. 잘 부탁해."
70017010-93 = "잘 부탁해! 담요나 따듯한 코코아라든지 뭐든 필요하면 언제든지 말하고!"
70017010-95 = "친절한 환대, 감사합니다."
70017010-99 = "이런 경우를 대비해서 만든, 친구 만들기용 체크리스트가 도움이 되겠군요."
70017010-100 = "1번, 자기소개하기. 완료. 그렇다면 그다음 순서인 '스몰 토크'로 넘어가겠습니다."
70017010-101 = "그러니까…… 여기는, 어떤 곳인지요?"
70017010-106 = "제 거처와 비슷한 환경입니다. 이런 가벼운 질문부터 대화를 시작하면 좋다고 합니다."
70017010-107 = "상당히 빈티지한 시설이 기이할 정도로 익숙하고 정감 가는군요."
70017010-112 = "아아, 그걸 말 안 했네. 우리는 22-"
70017010-113 = "!!"
70017010-120 = "아, 아얏! 왜 그래?!"
70017010-121 = "?"
70017010-122 = "아, 아하하-! 미안- 시구레 쨩! 실수로 밟아버렸네-!"
70017010-123 = "잠깐 저기에서 같이 신발 닦고 올까?"
70017010-124 = "라나 쨩? 잠시만 여기서 기다려줘-"
70017010-125 = "잠깐…… 노도카?!"
70017010-126 = "됐으니까, 잠깐 와 봐!"
70017010-136 = "갑자기 왜 그러는 거야?"
70017010-137 = "시구레 쨩! 딱 봐도 초등부 아이 같은데, 특별반이라고 말하면 안 된다구!"
70017010-138 = "에, 엥……?"
70017010-139 = "그렇게 말하면, '특별반이 뭐야?'라고 물어볼 거 아냐!"
70017010-140 = "'언니들처럼 쑥쑥 자라서 벌 받으면 이런 곳으로 보내져요~'라고 말할 셈이야?!"
70017010-141 = "아이들에게 이런 현실을 알려주면 안 돼."
70017010-142 = "하기사, 사실 그대로 말해 주는 건 안 좋을지도 모르겠네."
70017010-143 = "그렇지? 아이들에게는 밝은 미래가 있다고 희망만 줘야지."
70017010-144 = "응, 이해했어. 그러면 '특별반'은 금지어네."
70017010-145 = "맞아! 입에 지퍼 찍!"
70017010-146 = "그래 그래, 지퍼 찌익."
70017010-152 = "기다렸지 라나 쨩, 신발이 잘 안 털려서 말이야. 미안~"
70017010-153 = "아, 아하하……."
70017010-155 = "두 분, 아주 단란하셔서 좋습니다."
70017010-156 = "다시 돌아오셨기에 슬립모드 해제로 답변을 들을 준비가 됐습니다."
70017010-157 = "여기는 어떤 곳인가요."
70017010-159 = "어엇, 그, 그러니까…… 으음……."
70017010-160 = "기숙사! 그래, 기숙사란다. 라나 쨩!"
70017010-161 = "우리 둘이서 같이 지내는 기숙사야! 응!"
70017010-163 = "……."
70017010-165 = "(틀린 말은 아니긴 하지만, 역시 속이긴 무리였나…….)"
70017010-170 = "이렇게 넓은 곳을 두 분이서. 아주 훌륭하다고 생각합니다."
70017010-171 = "멀쩡한 창문은 저희 거처와 마찬가지로 거의 없습니다만, 그 느낌도 정겨워서 좋군요."
70017010-176 = "(다행히 의심 안 하는구나……!)"
70017010-177 = "휴우……!"
70017010-179 = "스몰토크에서 가장 인기 있는 주제 2위로 넘어가고자 합니다. 최근에는 어떻게 지내시는지요."
70017010-180 = "사소한 일상적인 대화를 나누며 친밀감을 높이고자 합니다."
70017010-181 = "예를 들자면, 최근에 있었던 일을 떠올리는 것도 좋다고 합니다."
70017010-182 = "어제는 무슨 일이 있으셨나요?"
70017010-183 = "으음, 어제 무슨 일이 있었더라……."
70017010-184 = "평소랑 똑같았어, 곰이 문 부수고 들어와서 덜덜 떨다가 겨우 고치고 잠들었어."
70017010-185 = "곰…… 여기도 배고픈 곰이 자주 찾아오는군요."
70017010-187 = "그 외엔…… 먹을 게 떨어져서 걱정했는데, 아까 시구레 쨩이 심부름을 다녀왔어."
70017010-189 = "그건 제가 담당하는 일과 같군요. 먹을 게 없는 것도, 평소 저희 일상과 같습니다."
70017010-190 = "미안, 노도카가 좋아하는 푸딩은 못 구했어……."
70017010-192 = "괜찮아 시구레 쨩! 어차피 요새는 디저트 구하기 힘들고, 신경 안 써!"
70017010-193 = "거기에…… 달콤한 것도 부족, 하군요."
70017010-197 = "호오……."
70017010-220 = "어쩐지, 남 일 같지 않다고 생각합니다."
70017010-221 = "정겹군요."
70017010-223 = "정겨워도 괜찮은 일인가. 하하……."
70017010-224 = "그러고 보니, 그러면 라나 쨩하고 같이 지내는 분들은 뭘 하시는 분들이야?"
70017010-228 = "제 친구들, 말씀이신가요."
70017010-229 = "휴리스틱은 가급적 지양합니다만, 그래도 말씀드려보자면……."
70017010-234 = "여기도 없어!!"
70017010-235 = "라-나야아-! 어딨-니 -!"
70017010-240 = "거기 서랍도 다 뒤져봤어! 없어! 수건 더미 속에서 자고 있을 줄 알았는데……."
70017010-241 = "냉장고는? 야채칸도 잘 찾아봤어? 저번엔 덥다고 거기에 들어가 있었잖아!"
70017010-242 = "다 봤어!! 먹을 거 다 떨어져서 어디 가려졌을 리도 없다고!"
70017010-243 = "심부름 간 게 언젠데, 진작에 돌아와서 낮잠 잘 시간이잖아……."
70017010-247 = "설마, 오다가 길 잃어버린 건가……?"
70017010-248 = "눈보라가 이렇게 치는데……?"
70017010-254 = "글쎄? 틀어박혀서 낮잠 자는 게 더 확률 높지 않아?"
70017010-255 = "그, 그것도 그렇네…… 최근 통계상으론 틀어박혀 낮잠 잔 경우가 더 흔했으니까……!"
70017010-256 = "우우우…… 라나-!!! 어디 있니-!!"
70017010-257 = "부른다고 나오겠냐?! 잠들면 업어가도 모르는데!"
70017010-258 = "히이잉-! 그래도 불러봐야지! 라나아-!"
70017010-259 = "에라이…… 라나-!! 간식 먹어야지-! 나와봐-!"
70017010-260 = "으아아-! 다락방도 찾아봐!"
70017010-263 = "음."
70017010-264 = "지금은 절 찾느라 옷 서랍이나 냉장고 문을 열고 있을 겁니다."
70017010-265 = "뭐어?!"
70017010-266 = "집 안에서 고양이 찾는 그런 느낌이야?"
70017010-267 = "반드시, 라고는 확언할 수 없습니다만. 그동안의 패턴을 보면 아마 그럴 겁니다."
70017010-268 = "지금 뭘 하느냐를 물어본 건 아니었지만…… 다들 사이좋아 보이니 다행이네……."
70017010-269 = "네. 좀 시끄럽긴 하지만, 매일을 즐겁게 보내고 있습니다."
70017010-270 = "으음……."
70017010-271 = "필요한 게 있을 때 요청해도 좋다고 허가하셨습니다만, 아직도 유효한가요."
70017010-272 = "응, 아직 괜찮아. 무슨 일이야?"
70017010-273 = "네. 송구스럽습니다만 루틴화된 낮잠 시간이 다 되어서 잠시 눈을 붙이고 싶습니다."
70017010-274 = "실례가 되지 않는다면, 담요에서 예상 1시간가량 잠들고자 합니다. 낮잠이라고도 합니다."
70017010-279 = "졸리구나! 물론이지 라나 쨩, 낮잠 자면서 눈보라 그치는 거 기다리자."
70017010-281 = "자아, 담요. 둘이 같이 쓰는 거라서, 좀 너덜너덜하지만……."
70017010-282 = "감사합니다. 오히려, 조금 낡은 편이 익숙해서 마음이 놓이니까 괜찮습니다."
70017010-283 = "마찬가지로 실례가 되지 않는다면, '자장자장'도 부탁드립니다. 이것 또한 잘 때의 필수 조건이라서 그렇습니다."
70017010-284 = "자장자장? 아하하, 물론이지."
70017010-286 = "어머 귀여워라-! 자자, 어서 눈 감고 코-하자!"
70017010-287 = "자장, 자장-"
70017010-289 = "후후, 자장 자장-"
70017010-290 = "좋습니다. 이 박자감, 두 분 다 자장자장에 재능이 있으시군요."
70017010-291 = "그럼, 안녕히…… 주무……."
70017010-292 = "우웅…… 세요……."
70017010-296 = "쿠울……."
70017010-301 = "옳지옳지. 아이들은 잘 자야 쑥쑥 크는 거야."
70017010-302 = "후후, 많이 피곤했던 모양이야."
70017010-303 = "베개에 머리 닿자마자 잠들어버렸네."
70017010-304 = "……이 어린아이가 무슨 잘못을 했다고, 이렇게 힘들게 사는 걸까……."
70017010-305 = "우리야 특별반이라 그렇다 쳐도, 특별반도 아닌데 이런 어린아이가 우리처럼 지낸다니……."
70017010-306 = "울지 마, 라나 깰라."
70017010-307 = "훌쩍, 으응……."
70017010-308 = "그러게, 우리는 특별반이라 유독 힘든 줄 알았는데, 다들 비슷하게 사는 모양이야."
70017010-309 = "우리도 힘내자. 특별반 밖의 라나도 이렇게 씩씩한데 우리가 약한 체할 수 없지."
70017010-310 = "응……!"
70017010-314 = "183호 특별반 앞"
70017010-318 = "저기가 제 거처입니다."
70017010-324 = "으아앙!! 라나아-!!"
70017010-325 = "걱정했다고-!!"
70017010-330 = "제 동료들도 마침 달려오는군요. 어디 급히 가는 모양입니다."
70017010-331 = "아마 목적지는 라나겠지만 말이야."
70017010-335 = "두 분, 처음 뵙겠습니다! 감사합니다, 라나를 돌봐주셔서……!"
70017010-336 = "어디 갔는지 너무너무 걱정했어요……!"
70017010-337 = "누가 훔쳐간 줄 알고 엄청 걱정했어요, 다행이다아……!"
70017010-342 = "네에?! 훔쳐간다고요?! 그런 적이 있었나요?!"
70017010-344 = "그런 적은 없는데, 확률적으로는 그럴 만해서 걱정했어요! 하아……."
70017010-351 = "볼 잡아당기지 마. 늘어나."
70017010-355 = "아. 심부름. 자, 안나. 부탁한 드라이버."
70017010-360 = "응? 왜 3mm 일자 드라이버 하나야? 5mm 십자드라이버하고, 8mm 일자드라이버가 필요했는데……?"
70017010-361 = "쓰인 대로 그대로 사왔어. <+5mm -8mm 드라이버> 사오라면서."
70017010-367 = "……."
70017010-368 = "응……. 고마워……."
70017010-369 = "저녁에 먹을 감자는? 오다가 잃어버렸어?"
70017010-370 = "괜찮아! 라나가 무사히 돌아오는 게 중요한 거지!"
70017010-372 = "감자 한 포대 사고 싹 난 거 있으면 버리라길래, 다 버리고 왔어."
70017010-374 = "……."
