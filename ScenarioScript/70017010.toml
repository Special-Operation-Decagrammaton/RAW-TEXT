[translation]
70017010-1 = "第1話;183 vs 227"
70017010-3 = ""
70017010-4 = "おつかい完了。確認作業、開始。"
70017010-5 = ""
70017010-7 = ""
70017010-8 = "エリナのおつかいから。#n「スーパーでじゃがいもを3キロ買う。#nもし芽が出てるものがあったら、重いからその場で捨てていいよ～」"
70017010-9 = "「じゃがいも3キロ購入。うち2つに芽が出てたため、スーパーのゴミ箱に全数破棄」#nチェック。"
70017010-10 = "次はアンナのおつかい。「金物屋で、+5ミリ-8ミリのドライバーを買ってきてちょうだい」。"
70017010-11 = "「[ruby=・]-3[/ruby][ruby=・]ミ[/ruby][ruby=・]リ[/ruby]ドライバーを1個購入」チェック。"
70017010-12 = "最後に私の。「パンチカードに書き込む用の適当な色鉛筆」。"
70017010-13 = "「厚紙でも書きやすい硬質油性RIS S 6006の色鉛筆、#n5R 4/14のカーマインレッド、3.0ミリ芯の色鉛筆12本購入」チェック。"
70017010-14 = ""
70017010-16 = ""
70017010-17 = "今回のおつかいもエラーなし。満足。"
70017010-18 = "それに、荷物が軽くて楽。"
70017010-19 = "ですが……。"
70017010-20 = ""
70017010-22 = ""
70017010-23 = "うーん……。"
70017010-24 = ""
70017010-26 = ""
70017010-27 = "ここは……どこでしょう？"
70017010-30 = ""
70017010-33 = "227号特別クラス"
70017010-36 = ""
70017010-37 = ""
70017010-39 = "ふぅ……ひどい吹雪でしたね。助けてくださり、ありがとうございます。"
70017010-40 = "ご心配には及びません。迷子には慣れていますので。"
70017010-41 = "11歳の頃と比べると、頻度は約10%減少しました。良い傾向です。"
70017010-42 = "自己紹介を忘れていました。私は[ruby=ふるはた]古畑[/ruby]ラナ、12歳です。#nおつかいの達人で、趣味は編み物と岩登りです。 "
70017010-44 = "迷子って、泣いたり不安がったりするものだと思うんだけど……#nこの子は結構しっかりしてるね。"
70017010-45 = "吹雪になる前にシグレちゃんが見つけてくれて、本当によかったよ……。"
70017010-46 = "雪の中で立ったまま動かないからびっくりした。大丈夫？"
70017010-48 = "経路探索に失敗し、Idle状態で待機していました。"
70017010-49 = "ラムネ色の旅人さんにインタラプトしていただかなかったら、#n今頃遭難していたことでしょう。感謝します。"
70017010-51 = "イ、インタラプト……？"
70017010-52 = "あはは、面白いこと言うね。"
70017010-53 = "それで……ラナちゃん、おうちはどこ？"
70017010-55 = "ふむ……。"
70017010-56 = ""
70017010-58 = ""
70017010-60 = ""
70017010-61 = ""
70017010-62 = "（183号は、特別クラス。だから、厳密にいうと家ではない）"
70017010-63 = "（あそこは、大好きな友達と住んでいる場所。#nつまり、愛着のある集団と構造物にすぎない）"
70017010-64 = ""
70017010-66 = ""
70017010-67 = ""
70017010-69 = "[ruby=・]お[/ruby][ruby=・]う[/ruby][ruby=・]ち[/ruby]は……ありません。"
70017010-70 = ""
70017010-73 = ""
70017010-74 = "……！"
70017010-75 = "おうちがない！？そんな……まだ、子供なのに……。"
70017010-76 = "事務局は何をしてるの！？"
70017010-78 = "事務局の決定でこうなったのです。とはいえ、特に支障はありません。"
70017010-80 = "あの無責任なチビ！なんてことを！"
70017010-81 = "でもそれなら、普段はどこに住んでるの？"
70017010-83 = "身を寄せる場所はあります。私は、そこへ帰るつもりでした。"
70017010-84 = "自治区の西側に位置する山の……5番目に高いシラカバの横道を行くと、#n中腹に3人で暮らしている私たちの住処があります。"
70017010-86 = "よかった、住む場所はあるんだね……。"
70017010-87 = "大吹雪が止んだら、送っていくよ。"
70017010-88 = ""
70017010-90 = ""
70017010-91 = "あっ、私たちの紹介がまだだった。この子はノドカで、私はシグレ。よろしく。"
70017010-93 = "ラナちゃん、毛布いる？あったかいココアもあるよ！#n欲しいものがあったら、いつでも言っていいからね！"
70017010-95 = "ご親切に、ありがとうございます。"
70017010-96 = ""
70017010-98 = ""
70017010-99 = "このような事態に備えて作った、友達づくり用のチェックリストが役に立ちそうです。"
70017010-100 = "その1……自己紹介、チェック。次は「スモールトーク」ですね。"
70017010-101 = "えっと……ここは、どういった場所なのでしょうか？"
70017010-102 = ""
70017010-104 = ""
70017010-105 = ""
70017010-106 = "今、私が身を寄せている場所と似ています。#n……こういった軽い質問から会話を始めると良いそうです。"
70017010-107 = "とても古風で、何故だか落ち着きます。"
70017010-108 = ""
70017010-111 = ""
70017010-112 = "ああ、言い忘れてたね。私たちは22――"
70017010-113 = "！！"
70017010-114 = ""
70017010-116 = ""
70017010-119 = ""
70017010-120 = "いたっ！なに！？"
70017010-121 = "？"
70017010-122 = "あ、あははー！ごめーん、シグレちゃん！間違えて踏んじゃったー！"
70017010-123 = "早く汚れを落としに行かないと！"
70017010-124 = "ラナちゃん、ちょっとそこで待っててね！"
70017010-125 = "ちょっ……ノドカ！？"
70017010-126 = "いいから、ちょっと来て！"
70017010-127 = ""
70017010-129 = ""
70017010-131 = ""
70017010-135 = ""
70017010-136 = "急にどうしたの？"
70017010-137 = "シグレちゃん……小学生相手に、特別クラスのことなんて話しちゃダメだよ！"
70017010-138 = "え、ええっ……？"
70017010-139 = "そんなことしたら、「特別クラスって何？」って聞かれちゃうでしょ！"
70017010-140 = "進級したら、罰を受けた人はこんなところに送られるなんて……。"
70017010-141 = "子供たちにそんな現実を見せるわけにはいかないよ。"
70017010-142 = "たしかに、事実をそのまま伝えるのは良くないかもしれないね。"
70017010-143 = "でしょう？子供たちには未来は明るいって希望を持たせてあげないと。"
70017010-144 = "分かった。「特別クラス」は今から禁止ワードだね。"
70017010-145 = "そう！おくちチャックだよ！"
70017010-146 = "うん、おくちチャック。"
70017010-151 = ""
70017010-152 = "ラナちゃん、お待たせー！なかなか汚れがとれなくて、ごめんね～"
70017010-153 = "あ、あはは……。"
70017010-155 = "お二人はとても仲が良さそうですね。"
70017010-156 = "お戻りになったので、スリープモードを解除します。質問の回答をお聞かせください。"
70017010-157 = "ここはどのような場所なのでしょうか？"
70017010-159 = "えーっと……そ、そうだな……うーん……。"
70017010-160 = "りょ、寮！そう！ここは寮なの！"
70017010-161 = "私たちが2人で住んでるところ！"
70017010-163 = "……。"
70017010-165 = "（間違ってはないけど、そんなすぐバレる嘘……）"
70017010-166 = ""
70017010-169 = ""
70017010-170 = "こんなに広いところにお2人で、ですか。ご立派です。"
70017010-171 = "壊れていない窓を探すほうが難しいのは、私のところと同じですが……#nそういったところも親しみを感じます。"
70017010-172 = ""
70017010-175 = ""
70017010-176 = "（疑ってなさそう……！）"
70017010-177 = "ふぅ……。"
70017010-179 = "次に、最近はいかがお過ごしでしょうか。#nちなみにこれは、スモールトークのテーマランキング第2位です。"
70017010-180 = "日常会話をすることで、親睦を深めようと思います。"
70017010-181 = "例えば、直近のことを思い出してみるのも良いそうです。"
70017010-182 = "昨日はどんなことがありましたか？"
70017010-183 = "うーん、昨日ねぇ……。"
70017010-184 = "いつも通りかな。熊がドアを壊して入ってきたから、#n震えながらなんとかドアを直して……眠りについた。"
70017010-185 = "ふむ。ここにもお腹を空かせた熊が来るのですね。"
70017010-187 = "あとは……食べるものがなくなっちゃったから、#nさっきシグレちゃんがおつかいに行ってくれたよ。"
70017010-189 = "私の仕事と同じですね。食べるものがないのも、そっくりです。"
70017010-190 = "ごめんね、ノドカの好きなプリンは買えなかったよ……。"
70017010-192 = "気にしないで、シグレちゃん！最近はスイーツを手に入れるだけでも大変だし！"
70017010-193 = "おまけに……甘いものも足りていない、と。"
70017010-194 = ""
70017010-196 = ""
70017010-197 = "ふむ……。"
70017010-202 = ""
70017010-206 = ""
70017010-210 = ""
70017010-211 = ""
70017010-212 = ""
70017010-215 = ""
70017010-217 = ""
70017010-220 = "どうも他人事とは思えません。"
70017010-221 = "とても親近感を覚えます。"
70017010-223 = "……それっていいことなのかな？"
70017010-224 = "そういえば……ラナちゃんとこの人たちは、なにをしてるの？"
70017010-225 = ""
70017010-227 = ""
70017010-228 = "私の友達のことでしょうか？"
70017010-229 = "推測で話をするのもよくないですが……。"
70017010-233 = ""
70017010-234 = "ここにもいない！！"
70017010-235 = "おーい、ラナー？どこ～？"
70017010-236 = ""
70017010-238 = ""
70017010-240 = "その棚はもう見たわよ！どこいったのかしら……タオルの山に埋もれて寝てると思ったんだけど……。"
70017010-241 = "冷蔵庫は？野菜室も全部見た？#nほら、この前は暑いとか言って冷蔵庫に入ってたじゃん！"
70017010-242 = "見たってば！冷蔵庫はすっからかんなんだから、見落とすわけがないでしょ！"
70017010-243 = "本当だったら……もうとっくに帰ってきて、お昼寝しててもおかしくないんだけど……。"
70017010-244 = ""
70017010-246 = ""
70017010-247 = "もしかして、迷子になってるとか……？"
70017010-248 = "こんな大吹雪だし……。"
70017010-249 = ""
70017010-253 = ""
70017010-254 = "いやいや、どっかで昼寝してるだけでしょ。"
70017010-255 = "そ、そうね……#n最近は、どこかに入って昼寝をしていることが多いから……！"
70017010-256 = "……う、ううう～！ラナー！！どーこー！！"
70017010-257 = "名前なんて呼んでも意味ないって！あの子、一度寝たら絶対に起きないし！"
70017010-258 = "うえ～ん！何もしないよりマシでしょ！ラナー！"
70017010-259 = "……もう！ラナー！おやつの時間だよー！出ておいでー！"
70017010-260 = "こうなったら、屋根裏部屋も探すしか！"
70017010-261 = ""
70017010-263 = "そうですね。"
70017010-264 = "今頃……私を探して、扉がついている家具を片っ端から開けていると思います。"
70017010-265 = "どういうこと！？"
70017010-266 = "猫探しじゃあるまいし！"
70017010-267 = "断言はできませんが……#nこれまでのパターンを考えると、遠からずといったところでしょう。"
70017010-268 = "今現在、何をしてるのか聞いたわけじゃないんだけど……#nとりあえず、みんな仲が良いことは分かったよ……。"
70017010-269 = "そうですね。少し騒がしいですが、毎日楽しく過ごしています。"
70017010-270 = "……。"
70017010-271 = "あの、「欲しいものがあったら、いつでも言って」というのはまだ有効でしょうか。"
70017010-272 = "うん、まだ大丈夫だよ。どうかしたの？"
70017010-273 = "ルーティンの時間になりましたので、少し横になろうと思います。"
70017010-274 = "よろしければ、お昼寝のために毛布をお借りしてもよろしいでしょうか。"
70017010-275 = ""
70017010-278 = ""
70017010-279 = "もちろん！お昼寝してるうちに、吹雪もやむと思うよ！"
70017010-281 = "はい、毛布。私とノドカが普段使ってるやつだから、ちょっとボロボロだけど……。"
70017010-282 = "ありがとうございます。#nむしろ……少しくたびれているほうが落ち着くので、大丈夫です。"
70017010-283 = "あと、寝かしつけもお願いしたいです。こちらも、眠る際の必須条件なので。"
70017010-284 = "寝かしつけ？分かった！"
70017010-286 = "か、かわいい～！任せて！子守唄とかでいい？"
70017010-287 = "ねーむれー、ねーむれー♪"
70017010-289 = "ふふっ。ねーむれー、ねーむれー♪"
70017010-290 = "ちょうど良いリズムです。お二人とも、寝かしつけの才能がありますね。"
70017010-291 = "では、おや……すみ……。"
70017010-292 = "……なさ……い。"
70017010-293 = ""
70017010-295 = ""
70017010-296 = "すぅ……すぅ……。"
70017010-297 = ""
70017010-299 = ""
70017010-301 = "よしよし。子供はたくさん寝て、たくさん成長するんだよ。"
70017010-302 = "ふふっ、ずいぶん疲れてたみたいだね。"
70017010-303 = "すぐに寝ちゃった。"
70017010-304 = "こんな小さな子が、どうして大変な思いをしてるんだろうね……。"
70017010-305 = "特別クラスの私たちは仕方がないかもしれないけど……#nそうじゃない子が、同じような生活をしてるなんて…… 。"
70017010-306 = "泣かないで、ラナが起きちゃうよ。"
70017010-307 = "ぐすん。ご、ごめん……。"
70017010-308 = "私たちは特別クラスだから、こんなにつらいんだと思ってたけど……#nどこも同じような状況なのかも。"
70017010-309 = "そうだね。私たちも頑張ろう。#n特別クラスじゃないラナがこんなに頑張ってるんだから、私たちもくよくよしてられないよ。"
70017010-310 = "うん……！"
70017010-314 = "183号特別クラス前"
70017010-317 = ""
70017010-318 = "あれが私の住処です。"
70017010-319 = ""
70017010-323 = ""
70017010-324 = "うわあーん！！ラナぁぁぁー！！"
70017010-325 = "会いたかったよぉぉぉー！"
70017010-326 = ""
70017010-329 = ""
70017010-330 = "どうしたんでしょう？2人とも急いでいるようです。"
70017010-331 = "ふふっ、ラナが心配だったんだよ。"
70017010-332 = ""
70017010-335 = "お二方、はじめまして！このたびは、ラナをありがとうございます……！"
70017010-336 = "どこにいるのか見当もつかず、心配で心配で……！"
70017010-337 = "てっきり、誘拐されたのかと……ほんとーに、よかったぁ……！"
70017010-338 = ""
70017010-341 = ""
70017010-342 = "え！？まさか、以前そんなことが！？"
70017010-344 = "いや、そういうわけじゃないんですけど……可能性としてはあり得るよなって。#n心配になって……。"
70017010-345 = ""
70017010-349 = ""
70017010-350 = ""
70017010-351 = "ほっぺ、引っ張らないで。伸びる。"
70017010-352 = ""
70017010-354 = ""
70017010-355 = "これ、おつかいしてきたよ。はい、アンナに頼まれたドライバー。"
70017010-356 = ""
70017010-358 = ""
70017010-359 = ""
70017010-360 = "えっと……3ミリのマイナスドライバー、だけ？#n5ミリのプラスドライバーと､8ミリのマイナスドライバーが欲しかったんだけど……?"
70017010-361 = "書いてある通りに買ってきた。「+5ミリ-8ミリのドライバー」だよね。"
70017010-362 = ""
70017010-364 = ""
70017010-366 = ""
70017010-367 = "……。"
70017010-368 = "……うん……ありが……とう。"
70017010-369 = "夜ごはんのじゃがいもは？どこかに落としてきちゃった？"
70017010-370 = "……まぁいっか。ラナの無事より大事なことなんてないし。"
70017010-372 = "3キロ買ったけど、#n「芽が出てるのがあったら捨てる」って書いてあったから、全部捨ててきた。"
70017010-374 = "……。"
70017010-375 = "ラナの無事より……大事、な……こと……なんて……。"
70017010-377 = "感動的な再会だね。"
70017010-378 = ""
70017010-381 = ""
70017010-382 = "あっ、自己紹介が遅れました……！私はアンナ。この子はエリナっていいます！"
70017010-384 = "はじめまして。私はシグレ。この子はノドカだよ。"
70017010-386 = "はじめましてー！私たちは183号特――"
70017010-387 = "！！"
70017010-388 = ""
70017010-392 = "いったぁ～！！"
70017010-393 = "ちょっとぉ！なんで踏むの！！"
70017010-394 = "しーーーっ！！"
70017010-395 = "特別クラスにいるってバレたら恥ずかしいでしょ！？"
70017010-396 = "た、たしかに……！無自覚だったわ。りょーかい！"
70017010-397 = ""
70017010-400 = ""
70017010-402 = ""
70017010-403 = "えっと、その……。"
70017010-404 = "研究？部活？まあ、そんなところですかね？あはは……。"
70017010-405 = "はは、あはは……！！"
70017010-407 = "研究部なんだ、すごいね！"
70017010-408 = "（研究部って、重要な部活じゃなかったっけ？#nそれが、私たちみたいな劣悪な環境で……）"
70017010-409 = "（みんな、早く環境がよくなるといいな……）"
70017010-410 = ""
70017010-414 = ""
70017010-415 = "……もうこんな時間。また吹雪が来そうだから、そろそろ帰らないと。"
70017010-416 = "ラナ。お友達の言うことをちゃんと聞いて、仲良くするんだよ。"
70017010-417 = "じゃあね、ラナちゃん！お二人もまた会いましょう！"
70017010-419 = "シグレさん、ノドカさんも……お気をつけて！"
70017010-421 = "迷子にならないよう、気をつけてください。"
70017010-423 = "それ、ラナが言っちゃダメなやつじゃない？"
70017010-424 = ""
70017010-431 = "それにしても……すごいね、ラナ！新しい友達ができたじゃん！"
70017010-433 = "友達？"
70017010-434 = "お互い自己紹介して、あったかいココアを飲みながらお話しして……#n一緒にお昼寝して、また会おうって約束しただけ。"
70017010-435 = "ふふっ。それは友達って言ってもいいんじゃない？"
70017010-436 = "それで、どうだったの？特別クラスの外の人たちは？"
70017010-438 = "いいな～！最近の流行スイーツとか、ファッションの話をしたんでしょ！"
70017010-440 = "寮は？私が新しい施工法を提案しておいたし、なかなか快適だったんじゃない？"
70017010-441 = ""
70017010-443 = ""
70017010-444 = "……。"
70017010-445 = "私たちと同じ。廃墟みたいなところに住んで、熊と戦って……寒さと飢えに震えてた。"
70017010-446 = "……え？"
70017010-447 = "スイーツも食べられないし、毛布も1枚しかない。"
70017010-448 = ""
70017010-451 = ""
70017010-452 = "ウソでしょ～！？私たちと同じなんてありえないって！！"
70017010-454 = "あんなに研究頑張ったのに、まだそんな生活してるの！？"
70017010-455 = "そういうこと。"
70017010-456 = "特別クラスだけがこんなに過酷なのだと思っていたけど、外に出ても状況は同じだった。"
70017010-457 = ""
70017010-459 = ""
70017010-460 = "この学園、もうダメかも。"
70017010-463 = "183 vs 227"
