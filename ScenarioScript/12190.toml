[translation]
12190-1 = "제19화;그럼에도 놓지 않은 2"
12190-2 = "호시노 선배의 위치! 확인했습니다!!"
12190-3 = "저곳이에요! 저 벙커 아래 지하예요!!"
12190-4 = "저기인가……."
12190-5 = "어서 빨리……!"
12190-10 = "……!! 카이저 이사."
12190-11 = "끈질기군."
12190-12 = "정말…… 어디까지 방해할 셈이야!"
12190-13 = "비켜주세요! 그렇지 않으면……!"
12190-15 = "대책위원회…… 너희가 눈엣가시였다."
12190-16 = "어떻게든 그 학교를 없애기 위해…… 온갖 노력을 다 했건만!"
12190-17 = "다 망해가는 학교에 끝까지 남아서 떠나지도 않고, 끈질기게 들러붙어서, 어떻게든 빚을 갚아나가고 있는 너희들이!!"
12190-18 = "그렇게 괴롭혔는데! 그렇게 철저하게 괴롭혔는데도! 매일매일 즐겁다는 듯 히히덕거리고 있는 네놈들 때문에!!"
12190-19 = "크으으으읏-!! 네놈들 때문에 나의 계획이-!!"
12190-22 = "결국 우리들의 마음을 꺾는 것……. 그딴 게 목표였던 거잖아! 저열하고 천박해!"
12190-23 = "거짓말로 호시노 선배를, 우리를 속였겠지만 이제 두번은 속지 않아."
12190-24 = "응! 그런 한심한 어른에게 우린 지지 않아요! 절대로 지지 않아요!"
12190-28 = "선생님! 마지막 전투를 부탁드립니다!"
