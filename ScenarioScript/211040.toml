[translation]
211040-1 = "Episode 4;Glory to Gehenna...!"
211040-3 = "[ns] \"...\""
211040-4 = ""
211040-5 = "..."
211040-6 = "..."
211040-7 = "..."
211040-8 = ""
211040-9 = "[ns] \"H-Hi?\""
211040-10 = "...Hmm, I see... So THIS is Schale's Sensei. Interesting!"
211040-11 = "Works for me."
211040-12 = "Nice to meet you, Sensei."
211040-13 = "[s] \"You called me, right?\""
211040-14 = "Yup! We, the Gehenna Heritage League, proactively reached out!"
211040-15 = "Is it cool if we keep it casual? I don't want you to feel uncomfortable with us."
211040-16 = ""
211040-18 = ""
211040-19 = "You were already casual, Mayumi."
211040-20 = "And so am I! Yaha!"
211040-21 = "My apologies for their candor, Sensei. Please know that we respect you as an elder authority."
211040-22 = "Shouko, you're embarrassing us..."
211040-23 = "Are you seriously going to act like you're Miss Prim and Polite, especially after you scarfed down the entire snack tray we made for Sensei?"
211040-24 = "That! Is not! Relevant!"
211040-25 = "[s] \"You seem like a lively bunch.\""
211040-26 = ""
211040-28 = ""
211040-29 = "Ahem, please excuse us! We ended up bickering like a bunch of hens. We know you have a VERY busy schedule..."
211040-30 = "So we'll get to it. We want to ask you something, so can you PLEASE hear us out?"
211040-31 = "..."
211040-32 = "Sensei, please aid the Gehenna Heritage League!!!"
211040-33 = "[s1] \"I've heard a little about your club...\"\n[s2] \"But what exactly can I do for you?\""
211040-36 = "Take it away, Shouko!"
211040-37 = ""
211040-39 = ""
211040-40 = "I am Igarashi Shouko, Secretary of the Gehenna Heritage League."
211040-41 = "You've already heard about us, so I'll keep it short. \"What is the Gehenna Heritage League,\" some may ask?"
211040-42 = "We are a group of students who wish to restore Gehenna to its former, unified glory. While our club may be new, we are focused, ambitious, and respectable."
211040-43 = "Nevertheless, because we're so new, we lack sway and renown."
211040-44 = "But if we had you, Schale's Sensei, on our side... Your influence could exponentially extend our reach. We'd become not just a club, but a zeitgeist sweeping all of Gehenna! ...Ideally."
211040-45 = "It'd be like a brilliant fox borrowing the brawn of a tiger."
211040-46 = "Uh... Are you sure you want to phrase it that way? We don't mean to imply that Sensei is—"
211040-47 = ""
211040-49 = ""
211040-50 = "Did you intend on being indirect with Sensei, President?"
211040-51 = "What...?"
211040-52 = "Schale's Sensei is a figure of absolute authority, all-powerful and recognized throughout Kivotos."
211040-53 = ""
211040-55 = ""
211040-56 = "Some say that Sensei is overworked and dedicated to helping students. Others whisper that Sensei uses the General Student Council girls to satisfy their personal desires."
211040-57 = "[s] \"That's not true!\""
211040-58 = "Is it not? In that case, excuse me. How good to hear."
211040-59 = "Shouko, you're ruining our first impression!"
211040-60 = "You know what?! Uh! What we were saying was..."
211040-61 = "In short, the Heritage League is a group of students who sincerely love Gehenna."
211040-62 = "We are proud to be Gehenna students, we want our school to get more recognition, and we'd love to start incredible things here."
211040-63 = "[s] \"That's a good mindset.\""
211040-64 = "Yup, exactly! We want to improve Gehenna!"
211040-65 = ""
211040-67 = "But, you see, some students don't see it that way."
211040-68 = ""
211040-69 = "Eh, what the hell kind of question's that?"
211040-70 = "Do I \"love Gehenna\"... Why are you so wound up about it?"
211040-71 = ""
211040-72 = "A school is just a school. There's no \"love\" there. What? You wanna marry it or something?"
211040-73 = ""
211040-74 = "My \"overall impression\" of Gehenna? Uh...a hot mess?"
211040-75 = ""
211040-77 = ""
211040-78 = "Does that \"bother me\"? Why would it? It is what it is."
211040-79 = "It's not like we can do anything about it. So what?"
211040-80 = "And is being a \"mess\" so bad? It's not like I could survive a day at a place like Trinity."
211040-81 = "Bleh. You mean that finishing school for prissy \"ladies\"? With the crumpets, and the \"whoms,\" and the tea?"
211040-82 = "I wouldn't be able to throw a grenade in the cafeteria when the food sucks, or skip classes when I'm not feeling it..."
211040-83 = "And I could NEVER blast the vending machines open when I'm broke!"
211040-84 = "Yeah, the Prefect Team catches us eventually, but it's all good until then, right? Pure freedom.#nI guess that's what I \"love\" about Gehenna. Psh."
211040-85 = ""
211040-86 = "And that's how it is."
211040-87 = "[s3] \"...R-Right...\"\n[s4] \"That does sound like a typical day in Gehenna...\""
211040-90 = "...No one wants to improve Gehenna. Everyone just wants to do whatever. "
211040-91 = "And when everyone does their own thing, we're left in chaos."
211040-92 = "And because we can't coordinate and agree on cohesive goals for our school, NO ONE really gets what they want."
211040-93 = "Plus, you know the Pandemonium Society and the Prefect Team never intend to work together. All they ever do is squabble."
211040-94 = "Chairman Makoto and Head Prefect Hina seem so obsessed with this idea of \"Free Gehenna\"... But I can't see what's so good about it."
211040-95 = "This is what \"freedom\" gets us, right?"
211040-96 = "Sensei, you've been all over. You must have noticed that Gehenna is totally out of step with the other academies!"
211040-97 = "[s] \"...I can't deny that.\""
211040-98 = "But the thing is, I heard that Gehenna wasn't always like this."
211040-99 = "I don't know... But, before I enrolled..."
211040-100 = "This was a school of discipline, cohesion—a true gestalt student body united under one goal!"
211040-101 = ""
211040-103 = ""
211040-104 = ""
211040-105 = "It seems those values are trapped in the past."
211040-106 = "[s] \"So there WAS a time like that...\""
211040-107 = "It sounds quite different from our current reality."
211040-108 = "Our fellow students have forgotten these noble virtues, abandoned their school pride..."
211040-109 = "...And that's what inspired us to step up and get things moving!"
211040-110 = "After all, if we were like this once, then we can be again! It's our school's heritage! It's who we are!"
211040-111 = ""
211040-113 = ""
211040-114 = ""
211040-115 = "Yup! That's how we came up with the club name."
211040-116 = ""
211040-118 = ""
211040-119 = "\"The Gehenna Heritage League\"! To restore glory to Gehenna once more!"
211040-120 = "So, to cut to the chase, that's why we wanted to meet with you. We could use a little support."
211040-121 = "[s] \"What kind of help do you need?\""
211040-122 = "Great question! Exactly what we like to hear!"
211040-123 = "Honestly, it's nothing! You just have to stand next to us while we do ALL the talking."
211040-124 = "You see, Gehenna students have an unusually high level of trust in you, Sensei."
211040-125 = "We have all sorts of ideas that'll improve Gehenna."
211040-126 = "Of course, they'd sound all the sweeter if you helped us get the word out. Yaha!"
211040-127 = ""
211040-129 = ""
211040-130 = "If you aided us, we could leverage your reputation to launch even greater initiatives."
211040-131 = "[s] \"What? My reputation?\""
211040-132 = "Indeed. Because even if we overpromise or embellish, the students will believe anything we say... As long as you're with us, Sensei."
211040-133 = "But of course we wouldn't do that!"
211040-134 = "We can't cheat our way into restoring glory to Gehenna, right?"
211040-135 = "Tch."
211040-136 = "We're going to play fair and square and do our best. That's a promise!"
211040-137 = "[s5] \"In that case...\"\n[s6] \"I'll also help to the best of my ability.\""
211040-140 = ""
211040-142 = ""
211040-143 = "What?! Really?! It was that easy?"
211040-144 = "[s] \"It's my job to assist hard-working students.\""
211040-145 = "..."
211040-146 = "Indeed. I think I'm beginning to understand what kind of person you are, Sensei."
211040-147 = "For real, Sensei? Yaha! I KNEW you were cool!"
211040-148 = "Thank you, Sensei! I have a great feeling about this!"
211040-149 = ""
211040-151 = ""
211040-152 = "Then let's get STARTED!"
211040-153 = "[s] \"Now?!\""
211040-154 = "The faster you act, the better!"
211040-155 = "The longer you put something off, the less motivated you become. We're here to take ACTION, not dawdle around!"
211040-156 = ""
211040-158 = ""
211040-159 = ""
211040-160 = "That's our president for you. Once she's got an idea, she chases it until it's done."
211040-161 = "I admire that kind of directness."
211040-162 = "What about YOU, Sensei? You know, I think we all vibe well together!"
211040-163 = "Then let's go follow the president. Keeping proper momentum is paramount."
211040-164 = "Race ya, Sensei!"
