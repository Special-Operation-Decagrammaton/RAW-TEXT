[translation]
211040-1 = "제4화;게헨나를 위대하게……!"
211040-3 = "[ns] \"…….\""
211040-5 = "……."
211040-6 = "……."
211040-7 = "……."
211040-9 = "[ns] \"아, 안녕?\""
211040-10 = "……오, 확실히…… 샬레의 선생님은 이런 인상이구나."
211040-11 = "난 좋은데?"
211040-12 = "처음 뵙겠습니다, 선생님."
211040-13 = "[s] \"너희들이 나를 부른 거, 맞지?\""
211040-14 = "응! 우리 게헨나재흥위원회가 선생님에게 메시지를 보냈어!"
211040-15 = "아, 그런데 혹시 말 편하게 해도 돼? 거리감 느끼고 싶지 않거든."
211040-19 = "이미 편하게 하고 있었잖아, 마유미 쨩."
211040-20 = "아무튼 나도! 야핫~"
211040-21 = "무례에 대신 사과드립니다, 선생님. 모쪼록 어른의 양해를 구합니다."
211040-22 = "쇼코, 너만 그렇게 말하니까 우리가 민망하잖아."
211040-23 = "쇼코 쨩, 그렇게 혼자만 예의 바른 척할 거야?#n선생님 주려고 준비한 간식도 네가 다 먹어 치워놓고?"
211040-24 = "그 이야기는!! 지금 중요하지 않은데요!!"
211040-25 = "[s] \"다들 활기차구나.\""
211040-29 = "흠흠, 실례! 바쁘다는 선생님을 모셔다 놓고 우리끼리 떠들고 있었네."
211040-30 = "아무튼 선생님에게 부탁하고 싶은 이야기가 있는데, 들어줄 수 있을까?"
211040-31 = "……"
211040-32 = "선생님, 우리 게헨나재흥위원회를 도와줘!!"
211040-33 = "[s1] \"무슨 동아리인지는 대략 들었지만……\"\n[s2] \"뭘 어떻게 도우면 되는데?\""
211040-36 = "쇼코! 설명을 부탁해!"
211040-40 = "게헨나재흥위원회의 서기, 이가라시 쇼코입니다."
211040-41 = "이미 알고 계시겠지만 저희 게헨나재흥위원회에 대해 간단하게 말씀드리자면……"
211040-42 = "게헨나를 다시금 위대하게, 하나 된 게헨나로 만들고자 하는 학생들의 모임입니다.#n이제 막 날개를 펴고자 하는 신생 동아리죠."
211040-43 = "그렇기 때문에 아직 대외 영향력이 부족한 상태고요."
211040-44 = "만약 샬레의 선생님을 도우미로 모실 수 있다면, 그 위세를 등에 업고 폭발적인 성장을 거듭하여 게헨나 구석구석까지 손을 뻗칠 수 있는 동아리로 거듭나지 않을까…… 하는 망상을 하고 있었습니다."
211040-45 = "이른바 호가호위라는 것이지요."
211040-46 = "그 말 괜찮은 거야? 선생님이 기분 나빠하면……"
211040-50 = "그렇게 느슨한 마음으로 선생님에게 접근하려 든 겁니까, 회장?"
211040-51 = "뭣……!"
211040-52 = "샬레의 선생님은 키보토스 어디에서도 권위를 인정받는, 그야말로 무소불위의 존재."
211040-56 = "언제나 과로에 시달리며 학생들을 위한 일에 매진한다고 알려져 있지만, 총학생회를 꼭두각시 부리듯 하며 자신의 욕망을 채우기 급급한 사람이라는 소문도 있기에 여기서는 더욱 솔직하게……"
211040-57 = "[s] \"아니거든!\""
211040-58 = "아닌가요? 실례했습니다."
211040-59 = "쇼코 쨩, 우리 첫인상을 그렇게 주면 어떻게 해?"
211040-60 = "아무튼! 흠흠!"
211040-61 = "우리 재흥위원회는, 근본적으로 게헨나를 좋아하는 학생들의 모임이야."
211040-62 = "게헨나 학생이라는 사실이 자랑스럽고, 게헨나가 더 인정받았으면 좋겠고, 게헨나에서 더 멋진 일들을 할 수 있으면 좋겠어."
211040-63 = "[s] \"좋은 마음이네.\""
211040-64 = "응, 맞아! 우리는 게헨나를 바꾸고 싶어."
211040-67 = "하지만 학생들 생각은 좀 다르거든."
211040-69 = "에, 뭐야 그거……"
211040-70 = "게헨나를 사랑하냐니…… 왜 그렇게 진지해?"
211040-72 = "학교는 그냥 학교잖아. 사랑하고 말고가 어디 있어."
211040-74 = "게헨나의 이미지? 뭐, 개판 아니야?"
211040-78 = "기분 안 나쁘냐고? 그게 왜? 사실인데."
211040-79 = "개판 맞잖아? 우리가 아니라고 하면 아니게 되는 것도 아니고."
211040-80 = "그리고 개판이라고 해서 나쁜 건가? 난 트리니티 같은 곳에서는 하루도 못 있을 것 같은데."
211040-81 = "우웩. 꽉 막힌 아가씨 학교 아니야."
211040-82 = "거기서는 맛없는 반찬 나왔을 때 급식실에다 수류탄도 못 던질 거고, 수업 듣기 싫다고 땡땡이도 마음대로 못 칠 거고."
211040-83 = "돈 없을 때 자판기 터뜨려서 음료수 뽑아먹는 것도 못 하겠지!"
211040-84 = "뭐, 금방 선도부한테 잡히겠지만 아무튼 잡히기 전까지는 마음대로 할 수 있잖아?#n그런 점이 좋은 건데?"
211040-86 = "이런 식이니까."
211040-87 = "[s3] \"……그, 그렇지…….\"\n[s4] \"게헨나에서는 일반적인 풍경이긴 하네…….\""
211040-90 = "……게헨나를 더 좋게 만들겠다는 생각은 아무도 안 해.#n그저 자기들 마음대로 하고 싶어할 뿐이고."
211040-91 = "모두가 자기 마음대로 해버리면 혼돈을 낳을 뿐인데."
211040-92 = "저마다 원하는 게 다르니까, 결국 모두가 자기 마음대로 할 수 없는 상황이 되어버리고."
211040-93 = "게다가 만마전과 선도부는 하나로 뭉칠 생각은 전혀 없고, 반목하기만 하는데."
211040-94 = "마코토 의장과 히나 선도부장은 '자유로운 게헨나'라는 허울 좋은 이야기에 집착하는 것 같던데…… 솔직히 그게 뭐가 좋은지 잘 모르겠어."
211040-95 = "결국 그 결과가 이거잖아?"
211040-96 = "선생님도 느끼지? 게헨나의 교풍은 다른 학교들과 많이 다르다는 거."
211040-97 = "[s] \"……아니라고는 못 하겠네.\""
211040-98 = "사실, 게헨나도 원래부터 이러지는 않았대."
211040-99 = "내가 입학하기 전의 이야기니까 나도 잘은 모르지만……"
211040-100 = "예전에는 철저한 규율이 있었고, 모두가 한마음으로 교칙에 따라 행동했던, 그런 시기도 있었다고 해."
211040-105 = "이제는 찾아볼 수 없는, 과거의 이야기입니다만."
211040-106 = "[s] \"그런 시절이 있었다니…….\""
211040-107 = "현재와는 여러모로 달랐다고 하더군요."
211040-108 = "지금의 게헨나에서는 찾기 힘든 덕목이 분명 존재하던 시기겠지요."
211040-109 = "우리도 그래서 용기를 얻을 수 있었던 거야."
211040-110 = "그런 시기가 있었다면, 다시 그런 방식으로 돌아갈 수 있지 않을까 하고."
211040-115 = "동아리 이름도 그렇게 지은 거니까!"
211040-119 = "응, 맞아. 게헨나재흥위원회. 게헨나를, 다시 위대하게."
211040-120 = "아무튼 결론적으로 말하자면, 선생님의 도움을 받고 싶다는 이야기인데……."
211040-121 = "[s] \"어떤 도움이 필요한데?\""
211040-122 = "앗, 좋은 반응!"
211040-123 = "사실 별거 아니야! 그냥 우리가 말할 때 옆에 있어 주기만 하면 돼!"
211040-124 = "선생님은 게헨나 학생들에게 이상할 정도로 신뢰도가 높으니까요."
211040-125 = "우리, 이것저것 준비했거든. 게헨나를 바꾸기 위해서."
211040-126 = "물론 옆에서 거들어주면 더 좋고. 야핫!"
211040-130 = "도와주신다면, 저희는 선생님의 명예를 걸고 이런저런 일들을 더 크게 벌릴 수 있을 겁니다."
211040-131 = "[s] \"예? 제 명예를요?\""
211040-132 = "맞습니다. 한껏 과장하거나 부풀려도 옆에 선생님이 계신다면 학생들은 찰떡같이 믿을 테니까요."
211040-133 = "물론 그러지 않을 거고!"
211040-134 = "게헨나를 위대하게 만들고자 하는 일에 편법은 있을 수 없잖아?"
211040-135 = "칫."
211040-136 = "우리는 항상 정정당당하게. 솔직한 진심으로 부딪힐 거야."
211040-137 = "[s5] \"그렇다면,\"\n[s6] \"나도 힘닿는 데까지 도울게.\""
211040-143 = "오!! 정말?! 이렇게 흔쾌하게?"
211040-144 = "[s] \"진심인 학생을 돕는 것이 선생님이니까.\""
211040-145 = "……."
211040-146 = "과연. 선생님이 어떤 타입인지 조금 알겠습니다."
211040-147 = "정말 도와주는 거야, 선생님? 야핫! 쿨하네~"
211040-148 = "고마워, 선생님!! 뭔가 느낌이 아주 좋아!"
211040-152 = "그럼, 지금 당장 가자!!"
211040-153 = "[s] \"이렇게 바로?!\""
211040-154 = "실행은 빠르면 빠를수록 좋은 거니까!"
211040-155 = "늦어질수록 에너지가 줄어들잖아. 생각났을 때 바로 해버려야 된다고!"
211040-160 = "아, 우리 회장은 항상 이래. 뭔가 꽂히면 즉시 실행해 버리지 않고는 못 배겨."
211040-161 = "뭐, 그런 점이 시원시원해서 좋긴 하지."
211040-162 = "선생님은 어느 쪽? 야핫, 왠지 우리랑 잘 맞을 것 같네!"
211040-163 = "아무튼 회장을 따라가도록 하죠. 기세도 중요한 요소니까요."
211040-164 = "가자, 선생님!"
211040-170 = "다음화;게헨나를 위대하게……?"
