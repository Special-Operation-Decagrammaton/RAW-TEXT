[translation]
211040-1 = "第4話;讓格黑娜偉大……！"
211040-3 = "[ns] 「……」"
211040-4 = ""
211040-5 = "……"
211040-6 = "……"
211040-7 = "……"
211040-8 = ""
211040-9 = "[ns] 「你，你們好？」"
211040-10 = "哦哦……夏萊的老師是這種感覺啊。"
211040-11 = "我覺得不錯啊？"
211040-12 = "初次見面，老師。"
211040-13 = "[s] 「是你們找我來的，沒錯吧？」"
211040-14 = "嗯！是我們格黑娜再興委員會傳訊息給老師的！"
211040-15 = "啊，不過我可以說話隨意一點嗎？我不想有距離感。"
211040-16 = ""
211040-18 = ""
211040-19 = "你早就已經講得很隨意了啊，真由美醬。"
211040-20 = "總之我也是！呀哈～"
211040-21 = "我代替他們兩個向您致歉，老師。#n失禮之處還望您以大人的寬容見諒。"
211040-22 = "翔子，只有你那樣說話，會害我們很尷尬耶。"
211040-23 = "翔子醬，你打算裝作只有自己很有禮貌嗎？#n明明連準備要給老師的點心，都全部被你吃光了耶？"
211040-24 = "那件事！！現在並不重要！！"
211040-25 = "[s] 「大家都很有活力呢。」"
211040-26 = ""
211040-28 = ""
211040-29 = "咳咳，失禮了！把忙碌的老師請來，結果我們卻自己聊個不停。"
211040-30 = "我們有件事想拜託老師，你願意聽我們說嗎？"
211040-31 = "……"
211040-32 = "老師，請幫幫我們格黑娜再興委員會！！"
211040-33 = "[s1] 「我有大概聽說是什麼樣的社團了……」\n[s2] 「我該怎麼幫忙呢？」"
211040-36 = "翔子！說明就拜託你了！"
211040-37 = ""
211040-39 = ""
211040-40 = "我是格黑娜再興委員會的書記，五十嵐翔子。"
211040-41 = "雖然您應該已經知道，不過還是簡單介紹一下我們格黑娜再興委員會……"
211040-42 = "我們是想讓格黑娜再次偉大、成為團結一致的格黑娜的學生們所組成的團體。#n是剛要展翅高飛的新社團。"
211040-43 = "因此目前還缺乏對外的影響力。"
211040-44 = "如果能請到夏萊的老師當幫手，借助那份威勢實現爆發性的成長，#n或許就能成為影響力遍及格黑娜每個角落的社團了……我是這麼妄想的。"
211040-45 = "也就是所謂的狐假虎威。"
211040-46 = "那樣說沒關係嗎？要是老師不高興的話……"
211040-47 = ""
211040-49 = ""
211040-50 = "委員長，你是抱著那種鬆懈的心態想接近老師的嗎？"
211040-51 = "什麼……！"
211040-52 = "夏萊老師的權威在奇普托斯的任何地方都受到認可，幾乎是無所不能的存在。"
211040-53 = ""
211040-55 = ""
211040-56 = "雖然普遍的認知是老師經常過勞，總是全心全力為學生們奉獻……#n但也有傳聞說老師把聯邦學生會當成傀儡操控，試圖滿足自己的慾望。#n所以在這裡更應該坦白地……"
211040-57 = "[s] 「才沒有！」"
211040-58 = "不是嗎？失禮了。"
211040-59 = "翔子醬，被你這樣一搞，我們給人的第一印象要怎麼辦啦？"
211040-60 = "總之！咳咳！"
211040-61 = "我們再興委員會，基本上是喜歡格黑娜的學生們的團體。"
211040-62 = "我們以身為格黑娜學生為傲，希望格黑娜能更受認可，#n也希望能在格黑娜做更多帥氣的事。"
211040-63 = "[s] 「真是很好的想法。」"
211040-64 = "嗯，沒錯！我們想改變格黑娜。"
211040-65 = ""
211040-67 = "但是學生們的想法有點不一樣。"
211040-68 = ""
211040-69 = "咦，什麼意思……"
211040-70 = "問我愛不愛格黑娜……何必那麼認真？"
211040-71 = ""
211040-72 = "學園就只是學園啊。哪有什麼愛不愛的。"
211040-73 = ""
211040-74 = "格黑娜的形象？嗯，不就是一團糟嗎？"
211040-75 = ""
211040-77 = ""
211040-78 = "問我會不會不高興？#n為什麼要不高興？那是事實啊。"
211040-79 = "本來就一團糟啊？又不是我們說不是就會變成不是。"
211040-80 = "而且一團糟就是壞事嗎？#n我在三一那種地方，大概連一天都待不下去。"
211040-81 = "嘔。那裡不是死板的千金學園嗎。"
211040-82 = "就算吃到難吃的菜也不能往餐廳丟手榴彈，不想上課也不能隨便翹課。"
211040-83 = "沒錢的時候也不能炸開自動販賣機拿飲料來喝了吧！"
211040-84 = "雖然很快就會被風紀委員會抓到，但在被抓到之前都能隨心所欲吧？#n那樣才好啊？"
211040-85 = ""
211040-86 = "大概是這種感覺。"
211040-87 = "[s3] 「這，這樣啊……」\n[s4] 「在格黑娜確實是很常見的景象……」"
211040-90 = "沒有任何人想讓格黑娜變得更好……大家都只想要隨心所欲而已。"
211040-91 = "要是大家都隨心所欲，只會產生混亂。"
211040-92 = "因為每個人想要的東西都不一樣，最後就變成誰都無法隨心所欲的狀況。"
211040-93 = "而且萬魔殿和風紀委員會完全沒有團結的意思，只會互相對立。"
211040-94 = "真琴議長和陽奈風紀委員長好像都對「自由的格黑娜」相當執著……#n老實說，我實在不懂那有什麼好的。"
211040-95 = "結果不就是這副德性嗎？"
211040-96 = "老師也有感覺吧？格黑娜的校風跟其他學園很不一樣。"
211040-97 = "[s] 「……我沒辦法否認呢。」"
211040-98 = "實際上，我聽說格黑娜也不是一開始就是這樣的。"
211040-99 = "那是我入學之前的事，所以我也不太清楚……"
211040-100 = "據說以前也有過紀律嚴格，大家都同心協力遵守校規行動的時期。"
211040-101 = ""
211040-103 = ""
211040-104 = ""
211040-105 = "不過，那是如今已不復見的過去了。"
211040-106 = "[s] 「原來有過那樣的時期啊……」"
211040-107 = "聽說跟現在在很多方面都不一樣。"
211040-108 = "那個時期，一定存在著現在的格黑娜難以找到的美德才對。"
211040-109 = "所以我們才能鼓起勇氣。"
211040-110 = "如果曾經有過那樣的時期，就代表我們或許有機會能夠回去。"
211040-111 = ""
211040-113 = ""
211040-114 = ""
211040-115 = "這也是我們幫委員會取這個名字的原因嘛！"
211040-116 = ""
211040-118 = ""
211040-119 = "嗯，沒錯。格黑娜再興委員會。要讓格黑娜再次偉大。"
211040-120 = "總之，結論就是我們想請老師幫忙……"
211040-121 = "[s] 「需要什麼樣的幫忙呢？」"
211040-122 = "哦哦，真是個好問題！"
211040-123 = "其實也沒什麼大不了的！只要在我們說話的時候待在旁邊就行了！"
211040-124 = "畢竟格黑娜的學生對老師的信賴程度高得不可思議。"
211040-125 = "為了改變格黑娜，我們做了各式各樣的準備哦。"
211040-126 = "當然，如果能在旁邊幫腔就更好了。呀哈！"
211040-127 = ""
211040-129 = ""
211040-130 = "如果您願意幫忙，我們就能搬出老師的名譽把事情做得更大。"
211040-131 = "[s] 「咦？我的名譽嗎？」"
211040-132 = "沒錯。就算再怎麼誇大其辭，只要老師在旁邊，學生們就會深信不疑。"
211040-133 = "當然我們不會那樣做的！"
211040-134 = "為了讓格黑娜偉大，就不能走旁門左道對吧？"
211040-135 = "嘖。"
211040-136 = "我們永遠都會光明正大。用坦率的真心面對每一件事。"
211040-137 = "[s5] 「既然如此……」\n[s6] 「我也會盡我所能幫忙的。」"
211040-140 = ""
211040-142 = ""
211040-143 = "哦！！真的嗎！？答應得這麼爽快？"
211040-144 = "[s] 「因為幫助認真的學生，就是老師的職責。」"
211040-145 = "……"
211040-146 = "原來如此。我稍微明白老師是什麼樣的人了。"
211040-147 = "真的要幫我們嗎，老師？#n呀哈！好酷哦～"
211040-148 = "謝謝你，老師！！總覺得有種很棒的感覺！"
211040-149 = ""
211040-151 = ""
211040-152 = "那麼，現在馬上出發吧！！"
211040-153 = "[s] 「這麼快！？」"
211040-154 = "行動本來就是越快越好！"
211040-155 = "要是拖拖拉拉的，幹勁也會逐漸消失。#n想到的時候就得馬上去做才行！"
211040-156 = ""
211040-158 = ""
211040-159 = ""
211040-160 = "啊，我們委員長總是這樣。#n一旦有了什麼想法就得馬上行動，否則就會渾身不對勁。"
211040-161 = "雖然這種乾脆爽快的個性也挺不錯的啦。"
211040-162 = "老師是哪一派的呢？#n呀哈，總覺得你跟我們會很合得來呢！"
211040-163 = "總之就先跟著委員長走吧。有時候氣勢也是很重要的。"
211040-164 = "走吧，老師！"
211040-165 = ""
211040-167 = ""
211040-168 = ""
211040-170 = "下一話;讓格黑娜偉大……？"
