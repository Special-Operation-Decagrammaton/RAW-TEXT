[translation]
211040-1 = "ตอนที่ 4;ทำให้เกเฮนน่ายิ่งใหญ่...!"
211040-3 = "[ns] \"...\""
211040-4 = ""
211040-5 = "..."
211040-6 = "..."
211040-7 = "..."
211040-8 = ""
211040-9 = "[ns] \"อ่า... สวัสดี?\""
211040-10 = "โอ้... เข้าใจแล้ว... คุณครูของชาเล่ต์ให้ความรู้สึกแบบนี้นี่เอง"
211040-11 = "ฉันว่าดีนะ?"
211040-12 = "ยินดีที่ได้พบกันค่ะ คุณครู"
211040-13 = "[s] \"พวกเธอเป็นคนเรียกครูมาใช่มั้ย?\""
211040-14 = "อื้ม! พวกเราคณะกรรมการฟื้นฟูเกเฮนน่าเป็นคนส่งข้อความไปหาคุณครูเอง!"
211040-15 = "อ้อ แต่ขอพูดแบบเป็นกันเองได้มั้ย? ฉันไม่อยากรู้สึกห่างเหินน่ะ"
211040-16 = ""
211040-18 = ""
211040-19 = "ก็เห็นพูดกันเองมาตั้งแต่แรกแล้วนี่ มายูมิจัง"
211040-20 = "ฉันขอพูดแบบนั้นด้วยคน! ยะฮ่า~"
211040-21 = "ขออภัยสำหรับความเสียมารยาทด้วยค่ะ คุณครู หวังว่าคุณครูในฐานะผู้ใหญ่จะเข้าใจนะคะ"
211040-22 = "โชโกะ ถ้าเธอพูดแบบมีหางเสียงอยู่คนเดียว พวกเราก็เขินแย่สิ"
211040-23 = "โชโกะจัง จะทำเป็นมีมารยาทอยู่คนเดียวเหรอ?#nทั้งที่เธอกินขนมที่เตรียมไว้ให้คุณครูจนหมดเกลี้ยงแท้ๆ?"
211040-24 = "เรื่องนั้นน่ะ!! ตอนนี้ไม่สำคัญค่ะ!!"
211040-25 = "[s] \"ทุกคนดูมีชีวิตชีวาดีนะ\""
211040-26 = ""
211040-28 = ""
211040-29 = "อะแฮ่ม ขอโทษทีนะ! อุตส่าห์เชิญคุณครูที่งานยุ่งมาทั้งที แต่พวกเราดันมัวแต่คุยกันเองเสียได้"
211040-30 = "เอาเป็นว่าพวกเรามีเรื่องอยากขอร้องคุณครู ช่วยรับฟังหน่อยได้มั้ย?"
211040-31 = "..."
211040-32 = "คุณครู ช่วยพวกเราคณะกรรมการฟื้นฟูเกเฮนน่าด้วย!!"
211040-33 = "[s1] \"ครูก็พอได้ยินมาบ้างว่าเป็นชมรมอะไร...\"\n[s2] \"แล้วจะให้ครูช่วยอะไร และช่วยยังไงเหรอ?\""
211040-36 = "โชโกะ! ฝากอธิบายทีนะ!"
211040-37 = ""
211040-39 = ""
211040-40 = "ฉันคือเลขาของคณะกรรมการฟื้นฟูเกเฮนน่า อิการาชิ โชโกะค่ะ"
211040-41 = "คุณครูก็คงรู้อยู่แล้ว แต่ถ้าจะให้อธิบายเกี่ยวกับคณะกรรมการฟื้นฟูเกเฮนน่าของพวกเราสั้นๆ ก็ต้องบอกว่า..."
211040-42 = "เป็นการรวมตัวของเหล่านักเรียนที่อยากทำให้เกเฮนน่ายิ่งใหญ่อีกครั้ง และทำให้เกเฮนน่ารวมเป็น#nหนึ่งเดียวกัน เราเป็นชมรมที่เพิ่งก่อตั้งและกำลังจะสยายปีกค่ะ"
211040-43 = "เพราะอย่างนั้น ตอนนี้พวกเราจึงยังขาดอิทธิพลต่อภายนอกอยู่ค่ะ"
211040-44 = "หากสามารถเชิญคุณครูของชาเล่ต์มาเป็นผู้ช่วยได้ พวกเราก็อาศัยบารมีของคุณครูเป็นแรงหนุน#nเติบโตอย่างก้าวกระโดด และกลายเป็นชมรมที่แผ่อิทธิพลไปได้ทั่วทุกซอกทุกมุมของเกเฮนน่า...#nฉันเคยเพ้อฝันอะไรแบบนั้นเอาไว้ค่ะ"
211040-45 = "หรือที่เรียกว่าจิ้งจอกยืมบารมีเสือน่ะค่ะ"
211040-46 = "พูดแบบนั้นไม่เป็นไรเหรอ? ถ้าคุณครูรู้สึกไม่ดีขึ้นมา..."
211040-47 = ""
211040-49 = ""
211040-50 = "คิดจะเข้าหาคุณครูด้วยท่าทีที่หละหลวมแบบนั้นเหรอคะ หัวหน้า?"
211040-51 = "ว่าไงนะ...!"
211040-52 = "คุณครูจากชาเล่ต์เป็นผู้ที่ได้รับการยอมรับในอำนาจไม่ว่าที่ไหนในคิโวทอส เรียกได้ว่าเป็นผู้ทรงอำนาจไร้ขีดจำกัด"
211040-53 = ""
211040-55 = ""
211040-56 = "แม้จะเป็นที่รู้กันว่าคุณครูต้องโหมทำงานและทุ่มเทให้กับเรื่องของนักเรียน แต่ก็มีข่าวลือว่าคุณครูคอย#nเชิดองค์การนักเรียนราวกับหุ่นกระบอก และเอาแต่สนองความต้องการส่วนตัว เพราะงั้นฉันจะขอพูด#nอย่างตรงไปตรงมายิ่งขึ้น..."
211040-57 = "[s] \"ไม่ใช่นะ!\""
211040-58 = "ไม่ใช่เหรอคะ? ขออภัยด้วยค่ะ"
211040-59 = "โชโกะจัง ทำไมถึงทำให้คุณครูมองพวกเราแบบนั้นตั้งแต่แรกล่ะ?"
211040-60 = "ยังไงก็เถอะ! อะแฮ่มๆ!"
211040-61 = "คณะกรรมการฟื้นฟูของพวกเราน่ะ โดยพื้นฐานแล้วคือการรวมตัวของนักเรียนที่รักเกเฮนน่า"
211040-62 = "ภูมิใจที่ได้เป็นนักเรียนเกเฮนน่า อยากให้เกเฮนน่าได้รับการยอมรับมากกว่านี้ และอยากทำเรื่องที่#nยอดเยี่ยมในเกเฮนน่าได้มากกว่านี้"
211040-63 = "[s] \"เป็นความคิดที่ดีนะ\""
211040-64 = "อื้ม ใช่เลย! พวกเราอยากเปลี่ยนเกเฮนน่า"
211040-65 = ""
211040-67 = "แต่นักเรียนคนอื่นไม่ได้คิดอย่างนั้นน่ะสิ"
211040-68 = ""
211040-69 = "หืม นี่มันอะไรเหรอ..."
211040-70 = "ถามว่าฉันรักเกเฮนน่าหรือเปล่าน่ะเหรอ... ทำไมจริงจังขนาดนั้นล่ะ?"
211040-71 = ""
211040-72 = "โรงเรียนก็คือโรงเรียน ต้องรักหรือไม่รักด้วยเหรอ?"
211040-73 = ""
211040-74 = "ภาพลักษณ์ของเกเฮนน่า? ความเละเทะไง ไม่ใช่เหรอ?"
211040-75 = ""
211040-77 = ""
211040-78 = "ได้ยินแบบนั้นแล้วเคืองหรือเปล่าน่ะเหรอ? จะเคืองทำไมล่ะ? ก็มันเรื่องจริงนี่"
211040-79 = "ก็เละเทะจริงๆ นี่นา? ใช่ว่าพวกเราบอกว่าไม่ใช่ แล้วมันจะไม่ใช่สักหน่อย"
211040-80 = "แล้วการที่มันเละเทะเนี่ย ถือว่าแย่ตรงไหนเหรอ? ถ้าให้ไปอยู่ทรีนิตี้แทนน่ะนะ ฉันคงทนอยู่ได้ไม่ถึงวันหรอก"
211040-81 = "แหวะ ก็ทางนั้นเป็นโรงเรียนคุณหนูหัวโบราณจนน่าอึดอัดนี่นา"
211040-82 = "ที่นั่นน่ะ เวลากับข้าวไม่อร่อยก็ขว้างระเบิดมือใส่โรงอาหารไม่ได้ เวลาไม่อยากเข้าเรียน#nจะโดดเรียนตามใจก็ไม่ได้"
211040-83 = "ตอนไม่มีเงิน จะระเบิดตู้กดน้ำเอาน้ำมากินฟรีก็คงทำไม่ได้!"
211040-84 = "ถึงไม่นานก็โดนคณะกรรมการวินัยจับได้อยู่ดี แต่ก่อนจะโดนจับก็ทำอะไรตามใจชอบได้นี่นา#nก็ตรงนั้นแหละที่มันดีไม่ใช่เหรอ?"
211040-85 = ""
211040-86 = "เพราะเป็นแบบนี้ไงล่ะ"
211040-87 = "[s3] \"นะ... นั่นสินะ...\"\n[s4] \"แต่ก็เป็นภาพที่เห็นกันจนชินในเกเฮนน่านะ...\""
211040-90 = "ไม่มีใครคิดจะทำให้เกเฮนน่าดีขึ้นเลย... มีแต่อยากทำตามใจตัวเองเท่านั้น"
211040-91 = "ถ้าทุกคนทำตามใจตัวเองหมด ก็มีแต่จะเกิดความโกลาหล"
211040-92 = "เพราะแต่ละคนต้องการไม่เหมือนกัน สุดท้ายเลยกลายเป็นว่าไม่มีใครสามารถทำตามใจตัวเองได้"
211040-93 = "ยิ่งไปกว่านั้น แพนเดโมเนียม โซไซตี้กับคณะกรรมการวินัยก็ไม่คิดจะรวมเป็นหนึ่งเดียวกันเลย เอาแต่ขัดแย้งกันอยู่ได้"
211040-94 = "ดูเหมือนประธานมาโคโตะกับประธานกรรมการวินัยฮินะดูจะยึดติดกับคำพูดสวยหรูที่มีดีแค่เปลือก#nอย่าง 'เกเฮนน่าที่เสรี'... พูดตามตรง ฉันไม่เข้าใจเลยว่ามันดีตรงไหน"
211040-95 = "แล้วสุดท้ายผลลัพธ์ก็เป็นแบบนี้ไง?"
211040-96 = "คุณครูก็รู้สึกได้ใช่มั้ย? ว่าธรรมเนียมโรงเรียนของเกเฮนน่าต่างจากโรงเรียนอื่นมาก"
211040-97 = "[s] \"จะบอกว่าไม่ได้รู้สึกแบบนั้นก็คงไม่ได้...\""
211040-98 = "จริงๆ แล้ว ได้ยินมาว่าเกเฮนน่าก็ไม่ได้เป็นแบบนี้มาแต่แรกหรอก"
211040-99 = "มันเป็นเรื่องก่อนที่ฉันจะเข้าเรียนอีกน่ะ ฉันเองก็เลยไม่ค่อยรู้รายละเอียดเหมือนกัน..."
211040-100 = "ได้ยินมาว่าในอดีตเคยมีช่วงเวลาที่กฎระเบียบเคร่งครัด ทุกคนเป็นน้ำหนึ่งใจเดียวกัน และก็ปฏิบัติตามกฎของโรงเรียนด้วยนะ"
211040-101 = ""
211040-103 = ""
211040-104 = ""
211040-105 = "แต่ก็เป็นเพียงเรื่องราวในอดีต ที่ตอนนี้ไม่หลงเหลือให้เห็นอีกแล้วค่ะ"
211040-106 = "[s] \"มีช่วงเวลาแบบนั้นด้วยเหรอ...\""
211040-107 = "ได้ยินว่าต่างจากปัจจุบันอยู่หลายอย่างเลยค่ะ"
211040-108 = "คงเป็นช่วงที่คุณธรรมที่หาได้ยากในเกเฮนน่าตอนนี้ยังมีอยู่จริงค่ะ"
211040-109 = "เพราะอย่างนั้น พวกเราถึงได้รวบรวมความกล้าขึ้นมาไงล่ะ"
211040-110 = "และคิดว่าถ้าเคยมีช่วงเวลาแบบนั้น ก็น่าจะกลับไปเป็นแบบนั้นได้อีก"
211040-111 = ""
211040-113 = ""
211040-114 = ""
211040-115 = "พวกเราถึงได้ตั้งชื่อชมรมแบบนี้ไง!"
211040-116 = ""
211040-118 = ""
211040-119 = "อื้อ ใช่เลย คณะกรรมการฟื้นฟูเกเฮนน่า ทำให้เกเฮนน่ายิ่งใหญ่อีกครั้ง"
211040-120 = "เอาเป็นว่า สรุปก็คือ พวกเราอยากขอให้คุณครูช่วย..."
211040-121 = "[s] \"อยากให้ช่วยอะไรล่ะ?\""
211040-122 = "อ๊ะ ตอบรับดีจัง!"
211040-123 = "จริงๆ ก็ไม่ใช่เรื่องใหญ่อะไรหรอก! คุณครูแค่คอยอยู่ข้างๆ ตอนพวกเราพูดก็พอ!"
211040-124 = "ก็นักเรียนเกเฮนน่าให้ความไว้วางใจคุณครูมากจนน่าประหลาดเลยนี่คะ"
211040-125 = "พวกเราเตรียมอะไรไว้หลายอย่างเลยนะ เพื่อจะเปลี่ยนแปลงเกเฮนน่า"
211040-126 = "แน่นอนว่าถ้าคุณครูคอยอยู่ข้างๆ ด้วยก็จะยิ่งดี ยะฮ่า!"
211040-127 = ""
211040-129 = ""
211040-130 = "ถ้าคุณครูช่วย พวกเราก็จะเอาเกียรติของคุณครูเป็นเดิมพัน แล้วลงมือทำเรื่องต่างๆ ให้ใหญ่ขึ้นได้ค่ะ"
211040-131 = "[s] \"หืม? เกียรติของครูเนี่ยนะ?\""
211040-132 = "ใช่ค่ะ ต่อให้พวกเราจะพูดเกินจริงหรือแต่งเติมให้ใหญ่โตแค่ไหน ถ้ามีคุณครูอยู่ข้างๆ นักเรียนก็คงเชื่อสนิทใจค่ะ"
211040-133 = "แต่แน่นอนว่าพวกเราจะไม่ทำแบบนั้นหรอก!"
211040-134 = "ถ้าจะทำให้เกเฮนน่ายิ่งใหญ่ จะมาใช้วิธีลัดอยู่ไม่ได้หรอก จริงมั้ย?"
211040-135 = "ชิ"
211040-136 = "พวกเราจะทำทุกอย่างให้มันตรงไปตรงมา และใช้ความจริงใจเข้าชน!"
211040-137 = "[s5] \"งั้นครูก็จะช่วยอีกแรง\"\n[s6] \"งั้นครูก็จะช่วยเท่าที่ไหวนะ\""
211040-140 = ""
211040-142 = ""
211040-143 = "โอ้!! จริงเหรอ?! ตอบตกลงอย่างเต็มใจขนาดนี้เลย?"
211040-144 = "[s] \"การช่วยนักเรียนที่จริงใจคือหน้าที่ของครูน่ะ\""
211040-145 = "..."
211040-146 = "อย่างนี้นี่เอง พอเข้าใจแล้วค่ะว่าคุณครูเป็นคนแบบไหน"
211040-147 = "จะช่วยจริงๆ เหรอ คุณครู? ยะฮ่า! เท่จังเลยนะ~"
211040-148 = "ขอบคุณนะ คุณครู!! ไม่รู้ทำไม แต่รู้สึกดีสุดๆ ไปเลย!"
211040-149 = ""
211040-151 = ""
211040-152 = "เอาละ งั้นก็ไปกันเดี๋ยวนี้เลย!!"
211040-153 = "[s] \"เดี๋ยวนี้เลยเหรอ?!\""
211040-154 = "เรื่องลงมือน่ะ ยิ่งเร็วก็ยิ่งดี!"
211040-155 = "ยิ่งปล่อยไว้นาน ไฟก็ยิ่งมอดลงนี่นา คิดได้เมื่อไรก็ต้องรีบทำทันทีเลยนี่แหละ!"
211040-156 = ""
211040-158 = ""
211040-159 = ""
211040-160 = "อ้อ หัวหน้าของเราเป็นแบบนี้ตลอดแหละ พอปิ๊งอะไรขึ้นมาก็ต้องลงมือทำทันที ไม่งั้นอยู่ไม่สุขหรอก"
211040-161 = "แต่ก็นะ นิสัยที่ทำอะไรฉับไวไม่ลังเลแบบนั้นก็ดีเหมือนกัน"
211040-162 = "แล้วคุณครูล่ะเป็นแบบไหน? ยะฮ่า ฉันว่าน่าจะเข้ากันกับพวกเราได้ดีเลยนะ!"
211040-163 = "เอาเป็นว่า ตามหัวหน้าไปกันเถอะค่ะ แรงส่งเองก็เป็นปัจจัยสำคัญเหมือนกัน"
211040-164 = "ไปกันเถอะ คุณครู!"
211040-165 = ""
211040-167 = ""
211040-168 = ""
211040-170 = "ตอนต่อไป;ทำให้เกเฮนน่ายิ่งใหญ่...?"
