[translation]
211040-1 = "第4話;ゲヘナを偉大に……！"
211040-3 = "[ns] \"……。\""
211040-5 = "……。"
211040-6 = "……。"
211040-7 = "……。"
211040-9 = "[ns] \"えっと……こんにちは？\""
211040-10 = "本物だ……シャーレの先生って、こういう感じなんだ。"
211040-11 = "うちはアリだな～？"
211040-12 = "先生、お初にお目にかかります。"
211040-13 = "[s] \"君たちが私を呼んだ……で合ってる？\""
211040-14 = "うん！メッセージ送ったのは私たちだよ！"
211040-15 = "あ、ため口でいい？距離感じるの、あんま好きじゃなくて。"
211040-19 = "ずっとタメ口だけどね。"
211040-20 = "うちもフランクにやらせてほしいな～"
211040-21 = "二人に代わってお詫びします。どうかお許しください。"
211040-22 = "ショウコだけその感じでいくの？"
211040-23 = "今さら礼儀正しいフリしても遅いでしょ。#n先生にあげようとしてたお菓子、1人で全部食べちゃったくせに。"
211040-24 = "その話は！……今は重要ではありません！！"
211040-25 = "[s] \"みんな元気だね。\""
211040-29 = "ごめんごめん。私たちだけで盛り上がっちゃってたね。"
211040-30 = "私たち、先生にお願いしたいことがあるんだ。"
211040-31 = "……。"
211040-32 = "ゲヘナ再興委員会を助けて！！"
211040-33 = "[s1] \"どんな委員会かは大体聞いたけど……。\"\n[s2] \"何をすればいい？\""
211040-36 = "ショウコ！説明お願い！"
211040-40 = "改めまして、ゲヘナ再興委員会の書記、[ruby=いがらし]五十嵐[/ruby]ショウコと申します。"
211040-41 = "私たちはゲヘナを再び偉大にし、「一つになったゲヘナ」を目指す生徒の集まりです。"
211040-42 = "とはいえ、設立間もない委員会でして。"
211040-43 = "対外的な影響力が不足しているのが現状です。"
211040-44 = "そこで、シャーレの先生を協力者として巻き込めれば箔がつくかと。"
211040-45 = "いわゆる、虎の威を借る狐というやつです。"
211040-46 = "それ、本人に言っていいの？"
211040-50 = "協力を取り付けるためには手段を選んではいられません。"
211040-51 = "なっ……！"
211040-52 = "先生の権威は、キヴォトスの誰もが認めるもの。"
211040-56 = "しかし……強い光は濃い影を作り出します。#n連邦生徒会を使って己の欲望を満たしている……などという噂もありますから。#nここはむしろ率直に――"
211040-57 = "[s] \"そんなことないよ！\""
211040-58 = "それは失礼いたしました。"
211040-59 = "うちらの第一印象終わってない？"
211040-60 = "と、とにかく！"
211040-61 = "私たちはゲヘナが大好きなの。ゲヘナの生徒であることが誇らしい。"
211040-62 = "だからゲヘナがもっと認められてほしいし、この学園でもっとカッコいいことができるようになりたい。"
211040-63 = "[s] \"良い心がけだね。\""
211040-64 = "でっしょ～？だからゲヘナを変えたいんだ。"
211040-67 = "でも、みんながみんなそう思ってるわけじゃないんだよね。"
211040-69 = "え、なにそれ……。"
211040-70 = "真面目だねぇ。"
211040-72 = "学園は学園でしょ。好きも嫌いもなくない？"
211040-74 = "ゲヘナのイメージ？んー、カオス？"
211040-78 = "え、嫌じゃないのかって？なんで？事実じゃん。"
211040-79 = "それに、否定しても変わらないし。"
211040-80 = "てか悪いことじゃなくない？#nトリニティみたいな学園だったら耐えられないよ。"
211040-81 = "うぇ。そりゃ無理だ……。"
211040-82 = "授業サボって遊びに行くとか絶対できないでしょ。"
211040-83 = "自販機ぶっ壊してジュースかっぱらうのも無理じゃない？"
211040-84 = "まあゲヘナでも風紀委員会に捕まるだろうけどさ。#n捕まるまで好き放題できるのがいいんじゃん？"
211040-86 = "だいたい、こんな感じ。"
211040-87 = "[s3] \"……そうだね。\"\n[s4] \"ゲヘナだとよく聞く話かな……。\""
211040-90 = "ゲヘナを良くしよう、なんて考える生徒はほとんどいない。#nみんな好き勝手にやりたいだけ。"
211040-91 = "それじゃあ混沌しか生まれないのに。"
211040-92 = "望みがバラバラだから、まとまって何かするなんて絶対できない。"
211040-93 = "[ruby=パンデモニウム・ソサエティー]万魔殿と風紀委[/ruby]員会は対立してばっかり。手を取り合う気なんてこれっぽっちもない。"
211040-94 = "マコト議長とヒナ委員長は「自由なゲヘナ」にこだわってるみたいだけど……#n正直、どこがいいのか私にはよく分かんない。"
211040-95 = "結局、無い無い尽くしでこの有り様。"
211040-96 = "先生も思わない？ゲヘナの校風って、他の学園と全然違うって。"
211040-97 = "[s] \"……否定は出来ないね。\""
211040-98 = "でも、ゲヘナって最初からこうだったわけじゃないらしいんだ。"
211040-99 = "私が入学する前の話だから、詳しくは知らないけど……。"
211040-100 = "厳格な規律があって、みんなが校則に従ってた時代があったみたいなの。"
211040-105 = "……もう戻らない、過去の話です。"
211040-106 = "[s] \"そんな時代があったんだね。\""
211040-107 = "今とはいろいろな面で違っていたと聞きます。"
211040-108 = "今にはない美徳が、確かに存在していたのでしょう。"
211040-109 = "だからこそ、私たちも勇気をもらえたんだ。"
211040-110 = "そんな時代があったなら、また戻れるんじゃないかって。"
211040-115 = "委員会の名前も、そこから取ったんだよね！"
211040-119 = "そう。ゲヘナを再び偉大にする部活――ゲヘナ再興委員会。"
211040-120 = "で、話が戻るんだけど……先生の力を貸してくれないかな。"
211040-121 = "[s] \"どんな助けが必要なの？\""
211040-122 = "いい質問だね！"
211040-123 = "実は大したことじゃないんだ。#n私たちが話すとき、隣に立っててほしいの！"
211040-124 = "先生はゲヘナの生徒からも信頼を得ていますから。#n私たちの活動も説得力が増すでしょう。"
211040-125 = "うちらさ、ゲヘナを変えたくて色々用意したの。"
211040-126 = "先生も一言添えてくれたら心強いな～？なんて。"
211040-130 = "手を貸してくだされば、先生の名誉を掲げて大規模な活動に打って出ることもできるはずです。"
211040-131 = "[s] \"……ん？\""
211040-132 = "多少話を盛っても、隣に先生がいれば生徒は疑いなく信じるでしょうし。"
211040-133 = "もちろん、そんなことはしないから安心して！"
211040-134 = "ゲヘナを偉大にしたいのに、ズルなんてできないでしょ？"
211040-135 = "ちっ。"
211040-136 = "私たちはいつだって正々堂々。まっすぐ本気でぶつかっていくんだ。"
211040-137 = "[s5] \"分かった。\"\n[s6] \"私も力の限り協力するよ。\""
211040-143 = "ほんと！？こんなにあっさりOKしてくれるの？"
211040-144 = "[s] \"生徒の力になるのが私の仕事だからね。\""
211040-145 = "……。"
211040-146 = "先生のお人柄が見えてきました。"
211040-147 = "やはっ、先生ノリ良い～！"
211040-148 = "ありがとう！追い風が吹いてきた感じ！"
211040-152 = "じゃあ、行こ！！"
211040-153 = "[s] \"今すぐ！？\""
211040-154 = "悩んでる暇なんてないの！"
211040-155 = "ぐずぐずしてると気持ちも冷めちゃうでしょ？#n思いついたときにすぐやらなきゃダメなんだよ！"
211040-160 = "委員長、いっつもこれなんだ。すぐ動かないと気が済まないんだよね。"
211040-161 = "ま、そこが良いとこなんだけど。"
211040-162 = "やはっ、先生もうちらと相性良さそうだよね！"
211040-163 = "時には勢いも重要ですから。委員長を追いましょう。"
211040-164 = "行こ、先生！"
211040-170 = "次回;ゲヘナを偉大に……？"
