[translation]
32100-1 = "제10화;제2차 평가 시험 1"
32100-2 = "자, 오늘도 수고하셨습니다."
32100-3 = "드디어 내일이 2차 평가시험일이에요!"
32100-4 = "일주일간의 합숙으로 저희는 평가시험을 문제없이 통과할 수 있는 실력을 키웠다는 것을 확실히 증명했습니다!"
32100-5 = "응."
32100-6 = "네♡"
32100-7 = "물론이야!"
32100-8 = "[s] \"맞아.\""
32100-13 = "이제 우리에게 남은 건 당당하게 합격해서, 보충수업부를 졸업하는 것…… 그것뿐이에요."
32100-14 = "지금까지의 공부가 헛되지 않았다는 걸 증명하는 거예요!"
32100-15 = "모두들, 마지막엔 웃으면서 헤어질 수 있게……! 파이팅이에요!"
32100-19 = "……응. 그렇지. 합격하면 이제 여기와도 안녕이구나……."
32100-20 = "뭐, 뭐야? 갑자기 왜 시무룩해지는 거야, 아즈사?!"
32100-21 = "어머나♡ 아즈사 쨩, 합숙은 무척 즐거웠죠? 끝난다니 아쉬운 거예요?"
32100-22 = "아니야. 만남에는 헤어짐이 있는 법이지. 모든 것은 헛되니까……."
32100-23 = "굳이 헛되지 않아도 아즈사 쨩도 여기 있는 모두도 어디 가버리는 게 아니잖아요?"
32100-24 = "트리니티 학원에 계속 있는 거니까 다들 언제든지 만날 수 있다구요."
32100-25 = "맞아! 나야 정의실현부 동아리실에 늘 있으니까. 심심하면 찾아와도 돼."
32100-26 = "……응."
32100-30 = "아우…… 그러니까 그건 우리 모두가 시험에 합격한 뒤의 일이니까……. 갑자기 청춘 드라마의 엔딩 전개가 되지 않아도……."
32100-31 = "자, 그럼 오늘은 일찍 쉬고, 내일 시험을 준비하는 걸로 해요."
32100-32 = "내일 시험 장소는 어디야? 학원 본관이겠지?"
32100-33 = "아, 그러네요. 공고를 확인한다는 게 깜빡했네요."
32100-34 = "어디 보자…… 학원 공지 게시판에 접속해서……."
32100-35 = "……응?"
32100-36 = "……으, 으응?? 으응??"
32100-37 = "왜 그래요, 히후미 쨩?"
32100-38 = "뭐, 뭐죠?! 이건?!"
32100-39 = "어디…… 제2차 보충수업부 평가시험의 변경 사항 공지……?"
32100-40 = "……. 시험 범위가 기존의 범위에서 3배 확대……?"
32100-41 = "뭐, 뭐어?! 갑자기?!"
32100-42 = "합격 커트라인이 60점에서 90점으로 상향……?"
32100-43 = "저, 저도 90점을 넘겨본 적은 없는데…… 아, 아우우……."
32100-44 = "뭐, 뭐야 이거……. 무슨 일이 벌어지고 있는 거야……."
32100-45 = "어제 갑자기 올라온 공고예요……. 시험 하루 전에 갑자기 이런 식으로 변경을 하는게 가능할 리가……."
32100-46 = "[s] \"이런 짓이 가능한 건 한 명뿐이야…….\""
32100-50 = "……."
32100-51 = "……과연. 우리끼리 치른 모의 시험의 결과가 나기사 씨에게 흘러 들어간 것 같네요."
32100-52 = "노골적인 메시지네요. 우리를 반드시 퇴학시키고야 말겠다는 굳은 의지가 느껴지네요."
32100-53 = "퇴학?"
32100-54 = "뭐?! 퇴학?! 무, 무슨 소리야?! 그건?"
32100-55 = "[s] (……슬슬 모두에게 사실을 말할 때가 되었다.)"
32100-56 = "어머나. 그러네요. 자세한 이야기는 조금 이따가 하고……."
32100-57 = "시험 장소와 시간을 변경…… 시험 장소는 게헨나 자치구 15-77구역 폐건물 1층……."
32100-58 = "……게헨나 자치구……?!"
32100-59 = "시험 장소가 게헨나라고요?!"
32100-60 = "뭐?! 무슨 소리야? 왜 트리니티 보충수업부의 시험을 게헨나에서 보는 건데?!"
32100-61 = "미응시하는 경우 자동 불합격이겠죠, 당연히……."
32100-62 = "부, 불합격하면 퇴학이라니, 그런 거야? 난 처음 듣는데!"
32100-63 = "……."
32100-64 = "[s] 사실대로 설명한다."
32100-67 = "시, 시험에서 세 번 낙제하면 퇴학……?!"
32100-68 = "……과연."
32100-69 = "……아우. 네. 맞아요……. 숨겨서 죄송해요. 상황이 이렇게 될 줄은……."
32100-70 = "어, 어째서 그런 거야?! 퇴, 퇴학당하면 정의실현부에 복귀도 불가능해지는 거잖아!!"
32100-71 = "그건……."
32100-72 = "이해했어. 지금 바로 출발하자."
32100-73 = "네?! 네?! 지금요? 어딜요?"
32100-74 = "시험 시간이 새벽 3시잖아. 시험을 치러 가려면 지금 출발해야 해."
32100-75 = "네?! 새벽 3시?! ……진짜네요?!"
32100-76 = "놀라는 것도, 화내는 것도, 절망하는 것도 시험을 치른 뒤에 해도 늦지 않아."
32100-77 = "장애물이 얼마나 많은지를 불평해봤자 달라지는 건 없어. 중요한 건 끝까지 발버둥 치는 거야."
32100-79 = "아우……."
32100-80 = "으, 으으……."
32100-81 = "……그러네요. 아즈사 쨩이 맞아요. 지금은 움직여야 할 때예요."
32100-82 = "재미있겠네요♡ 후후후. 시험을 치러 게헨나 자치구로 간다니. 이것 또한 해보지 못한 일이네요."
32100-83 = "뭐야, 이게!! 이상해!! 이상하다고!"
32100-85 = "바로 출발한다. 각자 무장을 챙겨."
32100-86 = "네?! 싸, 싸울 준비를요?! 시험치러 가는 거잖아요?!"
32100-87 = "그러네요. 게헨나 자치구는 무법지대니까요. 게다가 지금은 선도부가 조약 때문에 바쁜 상태일 테니……."
32100-88 = "아, 아우우……. 어쩌다 또 이렇게……."
32100-94 = "선생님. 출발 확인을."
32100-95 = "[s] \"좋아. 그럼 해보자!\""
32100-98 = "게헨나 슬럼가의 어딘가."
32100-99 = "과연…… 이쪽을 가로지르면 바로 게헨나 자치구네요. 그치만 여기는……."
32100-100 = "뭐야, 뭐야?! 못보던 얼굴들인데?"
32100-101 = "어딜 그렇게 급하게 가는 거야? 킥킥킥."
32100-102 = "무법지대인데……. 벌써 이렇게 되어버렸네요."
32100-103 = "아, 아우……. 저, 저희는 시험을 치러 가는 중인데 그러니까……."
32100-104 = "시험? 무슨 소릴 하는 거야? 이해가 안 된다고. 시험이라니?"
32100-105 = "그, 그러게요…… 동감이에요……."
32100-106 = "이 슬럼가는 우리들의 허락이 없으면 밤에 돌아다닐 수 없다고! 몰랐던 거냐!"
32100-107 = "……잠깐. 저 교복…… 트리니티잖아?"
32100-108 = "뭐? 그 부자 학원? 그럼 납치해서 몸값을 듬뿍 받아낼 수 있다는 뜻이잖아?"
32100-109 = "키키키킥. 좋은 아이디어잖아!"
32100-110 = "아, 아우…… 또 이런 전개가……."
32100-111 = "시간낭비는 됐어."
32100-117 = "빠르게 돌파한다."
