[translation]
10015045-4 = "베리타스 해커 휴게실"
10015045-11 = "으음. 저기……"
10015045-12 = "대운동회를 위한 부탁이라면 얼마든지 도와줄 수 있다고 하긴 했지만……"
10015045-13 = "이런 치어리더 복장을 입어 달라는 부탁은 안 들어줄 거야……."
10015045-15 = "그건 오해야, 치 쨩."
10015045-16 = "우리는 누구의 부탁이 있어서가 아니라, 자신의 의지로 이 옷을 입고 있는 거거든."
10015045-17 = "정확히 말하자면 저지른 잘못의 대가를 치르기 위해 입고 있다고 하는 편이 옳겠지만요."
10015045-18 = "더 쉽게 말하자면 '벌칙 의상'이라고 하는 편이 좋으려나……."
10015045-23 = "……선생님은 잘못을 저지른 학생에게 이런 옷을 입히는 취미가 있었던 거야?"
10015045-24 = "[s] \"다들 오해받을 소리는 하지 마!\""
10015045-25 = "후후. 재미있어 보이니 좀 더 가만히 지켜보고 싶었지만, 시간이 부족하니 어쩔 수 없네요."
10015045-26 = "그게 실은 말이죠……"
10015045-33 = "그러니까, 응원에 쓰일 오리지널 로봇을 만드는 것까지는 좋았는데……"
10015045-34 = "근거리 무선 통신을 연결하자마자 갑자기 로봇이 이상 반응을 보이며 폭주하기 시작했다는 거지?"
10015045-35 = "그 말대로야. 노아가 도면을 검토해 주었으니 설계상에 문제는 없다고 생각하는데……"
10015045-39 = "암호화 키 협상 프로토콜에서 최소 엔트로피값은 충분히 높게 설정했어?"
10015045-40 = "……아니."
10015045-41 = "보안 서버에 재연결하는 과정에서 받은 패킷의 무결성 검사는 했어?"
10015045-42 = "안 했어."
10015045-43 = "지난달에 발견된 취약점을 개선한 펌웨어 업데이트는 적용…… 했을 리가 없겠네."
10015045-49 = "평소에는 발명품에 요구하지도 않은 불필요한 기능을 잔뜩 달아 두면서, 어째서 보안 시스템은 이렇게 허술하게 처리한 거야?"
10015045-50 = "'불필요한 기능'이라는 표현에는 하고 싶은 말이 많긴 하지만……"
10015045-51 = "이번에 개발한 로봇은 다양한 환경의 장비를 사용하는 관객들과 상호작용을 해야 하니, 보안 정책을 조금 느슨하게 해도 될 거라 생각한 것뿐이야."
10015045-52 = "……결과적으로는 오판이었지만."
10015045-53 = "뭐, 게다가 문제가 생기면 우수한 보안 자문이 도와주러 올 거라 생각했으니까. 조금 방심한 탓도 있으려나."
10015045-55 = "이럴 때만 내 탓으로 돌리지 마. 이래서 정말……"
10015045-56 = "와아! 이 의상은 히비키가 직접 디자인한 거야?"
10015045-57 = "과감한 디자인과 화려한 색이 마음에 드는 걸…… 인상적이야!"
10015045-58 = "제게는 다소 치마 길이가 짧은 것처럼 느껴집니다만……"
10015045-59 = "그렇지 않아요! 스포츠 과학 연구부의 보고서에 따르면, 치어리더의 치마 길이가 짧을수록 응원의 효율이 높아진다는 분석 결과도 있었으니까요!"
10015045-60 = "즉, 팀의 승리를 기원하는 응원단이 짧은 치마를 입는 건 합리적인 선택이라고도 할 수 있지요!"
10015045-62 = "사실은 너무 예전에 만들어 둔 옷이라 사이즈가 작게 나온 것뿐이지만……"
10015045-63 = "우으…… 시간이 좀 더 있었더라면 치마의 기장을 좀 더 늘여서 수선했을 텐데……"
10015045-64 = "……아니, 의상을 수선할 시간이 있으면 그사이에 범인을 쫓는 게 더 좋지 않을까?"
10015045-65 = "그렇네요. 지금은 로봇을 해킹한 범인들이 어디에 있는지 찾는 것이 급선무이니까요."
10015045-66 = "거듭 부탁을 드려서 죄송하지만, 엔지니어부의 로봇을 해킹한 범인이 지금 어디에 있는지 파악할 수 있을까요?"
10015045-67 = "맡겨줘. 발신원을 역추적하는 일 자체는 어려운 일이 아니니까."
10015045-68 = "코타마. 밀레니엄 학습관 곳곳에 설치해 둔 RF 모듈에 지금 접속 가능하지?"
10015045-69 = "먼 곳에서 근거리 무선 통신을 해킹했다면 상대는 지향성 안테나를 사용하고 있을 테니, 전파 간섭을 통해 발신원의 대략적인 위치를 산출할 수 있을 거야."
10015045-70 = "학습관에 RF 모듈 같은 거 설치한 적…… 없는데요……?"
10015045-71 = "시치미 떼지 마. 아까 전부터 외부 모듈로 몰래 선생님의 대화를 도청하고 있던 거 다 봤거든?"
10015045-72 = "[s] \"……응? 나 도청당하고 있었던 거야?\""
10015045-73 = "……싫으면 관두든가. 협조하기 싫으면 내가 직접 압수해서 어떤 내용인지 확인해 볼 테니까."
10015045-77 = "연결되었습니다. 어떤 데이터부터 확인할까요?"
10015045-78 = "[s] \"저기, 코타마 씨……?\""
10015045-79 = "미안, 선생님. 이 건은 나중에 확인해 줄게……"
10015045-83 = "우선 코타마는 공업실습실을 중심으로 전파 간섭이 자주 발생했던 모듈의 위치를 시간대별로 정리해줘."
10015045-87 = "그리고 나머지 인원들은 서버에 비정상적인 접근이 없었는지 확인해 봐. 최근 기록만 확인하면 되니 오래 걸리지는 않을 거야."
10015045-88 = "감사합니다. 누차 베리타스의 도움을 받게 되다니, 면목이 없네요……."
10015045-89 = "신경 쓰지 않아도 돼."
10015045-90 = "아까도 말했지만 나 역시도 이번 대운동회가 모두가 즐길 수 있는 즐거운 축제가 되길 바라고 있으니까."
10015045-91 = "다만…… 어쩐지 더 중요한 사실을 놓치고 있는 것 같은 기분이 든단 말이지."
10015045-93 = "뭔가 인지하지 못한 곳에서 더 큰 문제가 벌어지고 있는 기분이……"
