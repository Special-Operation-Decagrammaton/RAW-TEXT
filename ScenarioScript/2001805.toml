[translation]
2001805-1 = "Unexploded Ordnance"
2001805-2 = "(모에가 샬레의 당번 업무를 위해 사무실을 찾아왔다.)"
2001805-3 = "안녕, 선생님. 오늘의 당번 업무도 잘 부탁해."
2001805-4 = "쿠후후…… 당번 업무를 핑계로 선생님의 컴퓨터에 어떤 파일이 저장되어 있는지, 이리저리 살펴볼 생각을 하니 벌써부터 흥분되는걸……"
2001805-5 = "[s1] \"그다지 재미있는 건 발견하지 못할 거야.\"\n[s2] \"모에가 온다고 해서 컴퓨터의 데이터를 미리 다른 곳에 빼놨거든.\""
2001805-6 = "쳇…… 쓸데없는 짓을."
2001805-7 = "쳇…… 쓸데없는 짓을."
2001805-8 = "설마…… 지난번의 일을 아직도 신경 쓰고 있는 거야?"
2001805-9 = "물론 멋대로 긴급 포맷 버튼을 누른 건 내 잘못이긴 하지만—"
2001805-14 = "솔직히 말해봐, 선생님."
2001805-15 = "반나절을 들여 작업한 데이터가 모두 날아갔을 때, 선생님도 느꼈었지?"
2001805-16 = "긴 노력의 결과물이 한순간에 물거품으로 바뀌는 순간의 카타르시스를……"
2001805-17 = "그 오싹한 쾌감을……! 하아, 하아……"
2001805-18 = "[s] \"확실히 오싹하긴 했다만……\""
2001805-19 = "여하튼 컴퓨터에 살펴볼 데이터가 없다니 유감이네."
2001805-20 = "그래서, 오늘은 어떤 일을 하면 되는 거야? 지난번과 같은 보고서 정리?"
2001805-21 = "……응? 오늘은 아무것도 하지 않아도 된다고?"
2001805-22 = "잠시 샬레의 업무 때문에 사무실을 비울 테니, 그동안 아무것도 만지지 말고 가만히 자리를 지켜 달라고?"
2001805-23 = "어려운 일은 아니지만…… 정말 그걸로 괜찮겠어?"
2001805-24 = "SRT의 오퍼레이터가 모처럼 도와주러 왔는데, 겨우 집 지키는 강아지 역할을 맡기다니."
2001805-25 = "선생님의 부탁이라면 좀 더 어려운 부탁이라도 얼마든지 들어줄 수 있다고."
2001805-26 = "……아니면 진짜 강아지처럼 목줄이라도 차고 기다린다든가?"
2001805-27 = "[s3] \"내게 그런 취미는 없어…….\"\n[s4] \"그저 '아무것도 만지지 말고' 기다리기만 하면 돼.\""
2001805-28 = "네, 네. 그게 명령이시라면야."
2001805-29 = "네, 네. 그게 명령이시라면야."
2001805-30 = "그럼 사무실은 내게 맡기고 선생님은 볼일을 보러 다녀와. 나는 명령대로 가만히 앉아서 기다릴 테니."
2001805-34 = "……왜 그렇게 수상한 표정으로 쳐다보는 거야? 정말 아무것도 안 건드린다니까?"
2001805-36 = "(……수상한 미소를 짓는 모에를 뒤로한 채, 건물을 나섰다.)"
2001805-39 = "……말은 그렇게 했지만, 샬레의 사무실을 조사할 수 있는 절호의 기회를 놓칠 수는 없지!"
2001805-40 = "샬레가 보유하고 있는 신무기나 비밀병기를 발견할 수 있을지도 모르고……"
2001805-41 = "어쩌면 선생님의 부끄러운 비밀을 밝혀낼 수 있을지도…… 후후……"
2001805-42 = "어디 한번 구석부터 찬찬히 살펴볼까?"
2001805-48 = "……응? 이 붉은색 버튼은 뭐지?"
2001805-49 = "총기 거치대 근처에 설치된 커다란 붉은색 버튼이라……."
2001805-50 = "아무리 보아도 수상한데. 어디에 쓰는 물건이지?"
2001805-54 = "여기는 샬레고, 선생님의 집무실이란 말이지."
2001805-55 = "총학생회도 손대기 어려운, 초법적 수사권을 지닌 선생님이 언제든 손을 댈 수 있는 위치에 존재하는 수상한 버튼이라면……"
2001805-56 = "분명 엄청나게 긴급하고 위험한 상황일 때만 사용할 수 있는 비상 버튼이겠지."
2001805-57 = "예를 들면 키보토스의 모든 학생들을 소집하는 버튼이라든가……"
2001805-58 = "샬레의 지하실에 잠자고 있는 고대의 병기를 기동시킨다든가……"
2001805-59 = "그도 아니면 생텀 타워가 통째로 발사된다든가……?"
2001805-60 = "뭐가 됐든, 내가 책임질 수 없는 엄청난 결과를 초래하겠지……"
2001805-61 = "아아…… 망상을 계속했더니 온몸이 달아올라서…… 더 이상 못 참겠어……!"
2001805-62 = "하아, 하아…… 이제는 무리야. 정말로 누를 거야…… 눌러 버릴 거라고……!"
2001805-63 = "……에잇!"
2001805-68 = "뭐, 뭐지?! 갑자기 천장에서 물이 쏟아지기 시작했잖아?"
2001805-69 = "으앗, 차가워!"
2001805-73 = "[ns] \"다녀왔어—.\""
2001805-75 = "[ns] \"우앗?! 이 물 웅덩이는 도대체 뭐야?\""
2001805-76 = "내가 묻고 싶은 말이라고!"
2001805-77 = "선생님, 이 버튼은 도대체 뭐야?"
2001805-78 = "[s5] \"모에, 너……\"\n[s6] \"비상 샤워기 작동 버튼에 손을 댄 거야?\""
2001805-79 = "……비상 샤워기 작동 버튼?"
2001805-80 = "……비상 샤워기 작동 버튼?"
2001805-81 = "그럼 이 수상쩍은 빨간색 버튼이…… 위험한 약물이 몸에 묻었을 때 씻어내는 용도로 만들어진, 비상 샤워기 버튼이었단 말이야?"
2001805-82 = "[s7] \"샬레에는 여러 학생이 오니까.\"\n[s8] \"위급 상황에서 빨리 대응할 수 있도록 빨간 버튼으로 해놨어.\""
2001805-87 = "[ns9] \"그보다 아무것도 만지지 말라고 그렇게 당부했는데……\"\n[ns10] \"실망이야, 모에.\""
2001805-88 = "나야말로 실망했다고!"
2001805-89 = "나야말로 실망했다고!"
2001805-93 = "내가 그 버튼을 누르기 직전까지 얼마나 기대를 했는 줄 알아?"
2001805-94 = "분명 내가 책임질 수 없는 어마어마한 파멸이 일어날 거라 기대했었는데……"
2001805-95 = "아니, 최소한 미사일이라도 나갈 줄 알았는데!"
2001805-96 = "그런데 겨우…… 물을 흠뻑 뒤집어쓰는 정도의 해프닝으로 끝나다니……"
2001805-97 = "내 기대감, 책임져!"
2001805-99 = "(이후, 어째서인지 도리어 화를 내는 모에를 달래느라 한동안 애를 먹었다……)"
