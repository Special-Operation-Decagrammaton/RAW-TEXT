[translation]
22175-6 = "아방가르드군의 움직임이 느려진 바로 지금이야! 엔지니어부!"
22175-7 = "넵! 라져!"
22175-8 = "준비한 물건, 지금 바로 설치할게."
22175-16 = "[ns] \"대, 대체 어떤 물건이길래?!\""
22175-17 = "자율추적기능 탑재, 거기다 방수방진 기능도 완비."
22175-18 = "거기에 더해 절대영도의 환경이나, 3천도가 넘는 고열의 환경에서도 절대적인 안정성을 자랑하며 초초초초안전인증을 보장하는……!"
22175-19 = "엔지니어부 반년치 예산을 쏟아부어 만들어 최강을 자부하는……"
22175-21 = "최신식 원격 스피커!"
22175-26 = "……."
22175-30 = "(당황)"
22175-31 = "[ns] \"…………스피커에 왜 그런 기능이?\""
22175-32 = "그건 우문인 걸 선생님."
22175-33 = "언제나 기능이란 건 어쩐지 달 수 있을 것 같을 때!"
22175-34 = "……달아 두는 것이 인지상정."
22175-35 = "그런 셈이지."
22175-36 = "자, 그럼……"
22175-37 = "발사!"
22175-44 = "……꿀꺽."
22175-45 = "……나, 그 대사가 말하고 싶어서 엄청나게 근질근질거려!"
22175-46 = "그, 그런 건 좀 참아! 언니!"
22175-47 = "……아무래도 말할 필요는 없을 것 같아."
22175-55 = "……역시 우리가 만든 스피커야, 울림이 좋아."
22175-56 = "[s] \"그런 의미로 스피커였던 거야?!\""
22175-57 = "어쨌거나 여러분! 이것으로……!"
22175-58 = "……응. 간신히 쓰러트렸네."
22175-60 = "됐다! 와아!"
22175-61 = "[s1] \"뭐가 뭔지 잘 모르겠지만!\"\n[s2] \"정말…… 엄청난 강적이었어…… 아방가르드군!\""
22175-62 = "하지만…… 모두가 힘을 합친 덕분에, 쓰, 쓰러트릴 수 있었어요."
22175-63 = "하지만…… 모두가 힘을 합친 덕분에, 쓰, 쓰러트릴 수 있었어요."
22175-64 = "응! 그, 뭐라고 할까……."
22175-65 = "모두 다 함께 보스몹 레이드에 성공한 느낌이지?!"
22175-67 = "좋아. 모두 고생했어. 하지만 진짜는 지금부터야."
22175-68 = "아직 <거울>로 네트워크를 장악하고 있을 때 움직여야 해. 바로 안내할게."
22175-69 = "아, 그거 말인데."
22175-70 = "그게……."
22175-71 = "……미안, 우리는 여기까지인가 봐."
22175-76 = "[ns] \"다, 다들 괜찮아?!\""
22175-77 = "……역시 위기의 순간. 전력을 다해 단숨에 설치한 것까진 좋았지만."
22175-78 = "인도어파에겐 너, 너무 가혹한 일정이었어요오오……."
22175-79 = "…………손가락 하나 못 움직이겠어."
22175-80 = "보다시피 면목 없지만, 우리는 일단 여기서 리타이어인 모양이야."
22175-82 = "우타하 선배……."
22175-86 = "으응! 괜찮아! 도와줘서 고마웠어! 방금 그 스피커! 무지 멋졌고!"
22175-87 = "이다음부터는 우리가 어떻게든 해낼 테니까!"
22175-92 = "[ns] \"걱정 마. 모두와 함께 반드시 아리스를 구해낼게.\""
22175-94 = "……그래. 그렇게까지 말한다면야."
22175-95 = "모모이."
22175-96 = "응?"
22175-97 = "만약을 위해, 이걸 줄게. 위험할 때 요긴하게 쓸 수 있을 거야."
22175-98 = "이건……"
22175-99 = "응, 알았어!"
22175-100 = "그럼 이다음! 부탁드릴게요!"
22175-101 = "모두 힘내."
22175-103 = "다음화;그러나 넘을 수 없는 벽"
