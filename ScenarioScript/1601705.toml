[translation]
1601705-1 = "I hate being alone"
1601705-4 = "(아오바와 모모톡을 나눈 지 얼마 되지 않아……)"
1601705-10 = "헉, 허억…… 서, 선생님……"
1601705-11 = "[s1] \"엄청 빨리왔네, 아오바!\"\n[s2] \"괜찮아?! 이거 마시고 숨 좀 돌려!\""
1601705-14 = "헉, 허억…… 가, 감사합니다……"
1601705-18 = "후우……"
1601705-19 = "그, 그럼…… 환자, 아니 망가진 기계는 어디 있나요……?"
1601705-20 = "[s3] \"이쪽에 있는 커피포트야.\"\n[s4] \"얼마 전부터 작동을 안 해.\""
1601705-23 = "네, 네에…… 한번 볼게요……!"
1601705-27 = "으음…… 일단 외형상으로는 문제없고……"
1601705-28 = "내부……"
1601705-35 = "[ns5] \"아, 아오바……!\"\n[ns6] \"때려도 되는 걸까……!\""
1601705-38 = "이, 일단 때려보면 대부분 해결되니까요……!"
1601705-39 = "너무 걱정하지 마세요……!"
1601705-40 = "[s] \"으, 으응!\""
1601705-41 = "(아무래도 걱정이 되었지만, 일단 아오바를 믿어보기로 했다.)"
1601705-51 = "……아, 아직 작동을 안 하네요……"
1601705-52 = "(귀퉁이가 살짝 찌그러진 커피머신…… 괜찮겠지?)"
1601705-53 = "이, 이렇게 된 이상…… 완전 분해 후에 조립을 시도해 볼게요……!"
1601705-57 = "(분명 커피머신은 처음이라고 했었는데……)"
1601705-58 = "(걱정되지만, 믿어보기로 했다.)"
1601705-66 = "조, 조립 완료했어요!"
1601705-67 = "헤헤…… 한번 작동시켜 볼까요……"
1601705-76 = "[ns] \"어, 엄청난 진동……!!\""
1601705-77 = "워, 원래 이런 기계는 아니죠?!"
1601705-78 = "[s] \"아니었던 것 같아……!\""
1601705-79 = "죄, 죄송해요…… 이게 아니었나 봐요……"
1601705-80 = "그럼, 다시 도전……!"
1601705-90 = "자아, 이번에는……!"
1601705-99 = "[ns7] \"엄청난 수압……!!\"\n[ns8] \"테이블이 갈라졌어?!\""
1601705-104 = "이, 이것도 아니겠죠오~!!!"
1601705-113 = "(그렇게 몇 번의 추가 시도 후……)"
1601705-117 = "너, 너무 오래 걸려서 죄송해요……"
1601705-118 = "이번에는 꼭…… 작동할 거예요……"
1601705-119 = "[s] \"과연……!\""
1601705-129 = "[ns9] \"돼…… 됐다!!\"\n[ns10] \"해냈구나, 아오바!\""
1601705-134 = "와, 와아!! 해냈어요!"
1601705-135 = "수, 수리 완료예요! 와아~!!"
1601705-136 = "후후, 후후후…… 드디어 신세를 약간이라도 갚은 걸까요……"
1601705-140 = "그, 그럼…… 아무튼 수리도 끝났으니 저는 이만 가보겠습니다."
1601705-141 = "빠르게 못 끝내고 늦어져서 죄송했습니다, 선생님……"
1601705-145 = "[ns] \"무슨 말이야? 아오바.\""
1601705-149 = "예, 옛?!"
1601705-150 = "뭐, 뭔가 잘못된 게 또 있을까요……?"
1601705-155 = "[ns11] \"이렇게 고생해 줬는데, 저녁이라도 대접할게.\"\n[ns12] \"같이 밥 먹고 가자.\""
1601705-160 = "아, 아으……"
1601705-161 = "……히잉……"
1601705-162 = "우아앙-!!"
1601705-163 = "[s] \"우, 우는 거야?! 미, 미안……! 내가 괜한 말을……\""
1601705-164 = "그, 그게 아니라요오……"
1601705-165 = "……누, 누가 밥 먹으러 가자고 한 게 오랜만이라……"
1601705-166 = "이, 일이 끝나면 항상…… 편의점에서 산 도시락을…… 혼자 숙직실에서 먹곤 했는데……"
1601705-167 = "가, 갑자기 그런 말을 들어버려서…… 히끅……"
1601705-171 = "[ns] \"오늘은! 아주 멋진 저녁을 먹자!\""
1601705-175 = "으, 으아아아……"
1601705-184 = "(아오바와 함께 근사한 레스토랑에서 맛있는 저녁을 먹었다.)"
1601705-187 = "(왠지, 평소보다 더 맛있게 느껴졌다.)"
