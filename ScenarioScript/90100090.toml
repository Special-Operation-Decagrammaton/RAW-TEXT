[translation]
90100090-1 = "Episode 9;Chasing Illusions"
90100090-3 = "Schale Basement, FOX Squad Operation Headquarters"
90100090-4 = "[ns1] \"Is everyone okay?!\"\n[ns2] \"I heard you were ambushed by the Lore...!\""
90100090-7 = ""
90100090-8 = "Hnnngh..."
90100090-9 = "*gulp*"
90100090-10 = "...Pardon me, Sensei."
90100090-11 = "The FOX Squad returned approximately 90 minutes ago."
90100090-12 = "[s3] \"Ah... You were eating.\"\n[s4] \"Should I come back later?\""
90100090-15 = "No, not at all. Rather, I'd like to apologize for the mess."
90100090-16 = "Ah, Sensei! Perfect timing."
90100090-17 = "Would you like to eat with us?"
90100090-18 = "[s] \"Thank you for offering, but I've already had dinner.\""
90100090-19 = ""
90100090-22 = "[ns] \"Oh, are these fried tofu pouches...?\""
90100090-23 = "Yeah. Niko made them. By the way, we brought the deep-fried tofu all on our own. We didn't raid the lounge's refrigerator."
90100090-24 = "I met a tofu fryer on one of our missions. We occasionally get high-quality deep-fried tofu from them, and that's when I make dishes like this."
90100090-25 = "Even I'll admit that Niko knows her way around some tofu."
90100090-26 = "Hmm... Is this mushroom? I love the flavor seeping through the pouch."
90100090-27 = "Really? I feel like I've been eating nothing but beans..."
90100090-28 = "You're not hazing me, are you?!"
90100090-29 = "Stop complaining and eat. We need to exorcise that ghost that found you on the last mission."
90100090-30 = "Ghosts be gone! Blessings come in!"
90100090-31 = "...Isn't it ROASTED beans that chase away ghosts? Not boiled?"
90100090-32 = "Why don't you eat your tofu pocket and calm down?"
90100090-33 = "[s] \"You mentioned ghosts?\""
90100090-34 = "It's a long story..."
90100090-36 = "...Which is why I believe that the unidentified presence that affected FOX 4 is the white scarecrow that the victims witnessed. They called it the \"kunekune.\""
90100090-37 = ""
90100090-39 = ""
90100090-40 = ""
90100090-41 = "[ns] \"Are you okay? Do you feel well?\""
90100090-42 = "Yeah, I'm good. I had a physical when I got back. They said I was fine."
90100090-43 = "If anything, the back of my head hurts even more from Kurumi's slap. I think there might be a lump..."
90100090-44 = "How could you be so ungrateful? You would've been doomed if I hadn't stepped in!"
90100090-45 = "Look. I'm thankful that I didn't end up a victim..."
90100090-46 = "...But you were still affected. You blacked out a huge chunk of what happened—like seeing the field, or what the kunekune looked like."
90100090-47 = "Your body cam was active. We can play it back."
90100090-48 = ""
90100090-52 = "\"...Maybe it's a mirage... I know it wasn't on the map, but I see a field over the street.\""
90100090-53 = "\"There's a shabby scarecrow in the middle of overgrown grass, and a person in white clothes with a creepy smile......\""
90100090-54 = ""
90100090-55 = "...Ugh. Is this really MY voice? I hate listening to myself."
90100090-56 = "Yes. This is you. Get over it."
90100090-57 = "You mentioned a \"field.\" But we all know there's no greenery near Shiro Unagi Station."
90100090-58 = "Or maybe it was a mirage? You know, like how people see bodies of water in the distance that aren't there?"
90100090-59 = "No. Those only happen on flat, vacant land...like in Abydos. The haze makes people think they see water."
90100090-60 = "Point Romeo is in Business District 3. Since the view is broken up by buildings, she wouldn't have experienced any weird optical illusions."
90100090-61 = "...Haze that reveals new, otherworldly places..."
90100090-62 = "I think it's clear that we're dealing with something beyond a simple explanation. This is true Lore."
90100090-63 = "[s5] \"You can't keep going in so brazenly.\"\n[s6] \"Yukino. Let Schale handle this, and you—\""
90100090-66 = "...We are special forces. It is our responsibility to know when to retreat from an unwinnable fight. And this is not the time."
90100090-67 = "\"Rabbits\" may behave otherwise, but \"foxes\" exercise curiosity as well as caution."
90100090-68 = "It goes against my nature to ignore a new clue."
90100090-69 = "[s] \"...A new clue?\""
90100090-70 = "Sensei, please take a look at this."
90100090-71 = "This is the bullet casing that was ejected when FOX 4 pulled the trigger yesterday."
90100090-72 = "Clearly, she fired a round. The bullet flew towards the target but we could not find any bullet traces on the ground."
90100090-73 = "It likely disappeared with the illusion."
90100090-74 = "50-caliber bullets, especially those shot from an anti-material sniper rifle, distribute a tremendous amount of physical energy. What I mean to say is, if the bullet hit the target and vanished with it..."
90100090-75 = "...then it is not an illusion. It has a physical form. And, therefore, we can defeat it."
90100090-76 = ""
90100090-78 = ""
90100090-79 = "Before you escalate this mission to another unit, I request one more reconnaissance mission for the FOX Squad."
90100090-80 = ""
90100090-83 = "[ns7] \"...Okay. Just one more.\"\n[ns8] \"And I'll be tagging along.\""
90100090-86 = "Thank you for your accommodation."
90100090-87 = "That's more like it! She's got a point—if they're corporeal, then we can shoot them, explode them, and take them down."
90100090-88 = "This is getting a bit too familiar..."
90100090-90 = ""
90100090-91 = "So, where are we going? Point Romeo, again?"
90100090-92 = "While I agree that Point Romeo would be best if we sought to replicate the situation..."
90100090-93 = "...We're hoping for a confrontation. We need a better location."
90100090-94 = "Why?"
90100090-95 = "Consider the following. If we start sniping from afar at an enemy that no one else can see, then civilians would panic."
90100090-96 = "Additionally, there are too many potential casualties in the business district."
90100090-97 = "Yeah, good point. We don't need someone calling Valkyrie on us while we're fighting the kunekune."
90100090-98 = "...That would be unfortunate."
90100090-99 = "[s9] \"If you need help with PR, leave it to me.\"\n[s10] \"I'll take responsibility for everything...\""
90100090-102 = "Denied. We will change the location."
90100090-103 = "No matter the mission, we must minimize any civilian harm."
90100090-104 = "If anyone got caught in the crossfire... That would be on us."
90100090-105 = "Besides, we're not officially pardoned yet."
90100090-106 = "If you intervened, Sensei, the General Student Council President would be in a bind."
90100090-107 = "[s] \"If you say so, Yukino...\""
90100090-108 = "First, let's see if we can observe the haze in a controlled, confined space."
90100090-109 = "Let's look for a secluded area. We'll need extreme airflow with a temperature variance."
90100090-110 = "Got it. I'll check the map."
90100090-111 = "Ah, and I have one more concern."
90100090-112 = "How should we approach this? We cannot use our usual method now that we're all aware of the kunekune."
90100090-113 = "\"Our usual method\"...?"
90100090-114 = "The kunekune put Otogi in a trance, all because she looked at it. She wasn't listening to us."
90100090-115 = "No matter how chaotic the battle may become, we cannot coordinate if we cannot communicate with each other. What if we need to retreat?"
90100090-116 = "What if we break into pairs? One person observes and the other pulls the trigger?"
90100090-117 = "Denied. We are starting from a point of failure. We don't want ANYONE getting entranced by the kunekune."
90100090-118 = "In a worst-case scenario, all four of us will be incapacitated."
90100090-119 = "How about some protective eyewear?"
90100090-120 = "It could help. But Otogi watched through a scope, not with the naked eye, and she still was impacted."
90100090-121 = "Glass or mirrors may not be enough."
90100090-122 = "This is troubling. How are we supposed to not look at what we're fighting?"
90100090-123 = "I guess it's time to call a psychic? How about the local medium?"
90100090-124 = ""
90100090-126 = ""
90100090-127 = ""
90100090-128 = ""
90100090-129 = "Ah. So we need to see the enemy without looking directly at them, right?"
90100090-130 = "What if we use...these?"
90100090-131 = "..."
90100090-133 = "...Do you think it'll actually work?"
90100090-135 = "Next Episode;Into Darkness"
