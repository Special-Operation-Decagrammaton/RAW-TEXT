[translation]
90100090-1 = "ตอนที่ 9;ไล่ล่าภาพลวงตา"
90100090-3 = "กองบัญชาการกองทหาร FOX ชั้นใต้ดินชาเล่ต์"
90100090-4 = "[ns1] \"ทุกคนเป็นยังไงบ้าง?!\"\n[ns2] \"ได้ยินว่าถูกตำนานเล่นงานเข้า... ปลอดภัยกันใช่มั้ย?\""
90100090-7 = ""
90100090-8 = "อะ... อึก..."
90100090-9 = "(อึ้ก)"
90100090-10 = "ขอโทษที่เสียมารยาทค่ะ..."
90100090-11 = "กองทหาร FOX กลับมาถึงเมื่อประมาณ 1 ชั่วโมง 30 นาทีที่แล้วค่ะ"
90100090-12 = "[s3] \"อ่า... กินข้าวกันอยู่สินะ ขอโทษที\"\n[s4] \"ขอโทษที ไว้ครูลงมาหาใหม่ดีมั้ย...?\""
90100090-15 = "ไม่เป็นไรค่ะ ฉันมากกว่าที่เผลอแสดงภาพที่ไม่น่าดูออกมาโดยไม่ได้ตั้งใจ ขอโทษด้วยค่ะ"
90100090-16 = "อ๊ะ คุณครู! มาได้จังหวะพอดีเลยค่ะ"
90100090-17 = "คุณครูก็มาทานข้าวด้วยกันมั้ยคะ?"
90100090-18 = "[s] \"ขอบใจที่ชวนนะ แต่ครูกินข้าวเย็นมาแล้วน่ะสิ\""
90100090-19 = ""
90100090-22 = "[ns] \"ว่าแต่นี่คือถุงเต้าหู้ยัดไส้หรือเปล่า...?\""
90100090-23 = "อื้อ นิโกะเป็นคนทำ ส่วนเต้าหู้ซื้อมาจากข้างนอกน่ะ พวกเราไม่ได้แตะต้องวัตถุดิบอาหารในตู้เย็นของ#nห้องพักผ่อนเลย ไม่ต้องห่วงหรอกนะ"
90100090-24 = "เมื่อก่อนระหว่างปฏิบัติการ ฉันบังเอิญรู้จักพนักงานโรงงานทำเต้าหู้ทอดคนหนึ่งค่ะ เขาจะส่งเต้าหู้ทอด#nคุณภาพดีมาให้เป็นประจำ เลยได้ทำเมนูจากเต้าหู้ทอดแบบนี้อยู่บ่อยๆ ค่ะ"
90100090-25 = "เมนูเต้าหู้ทอดฝีมือนิโกะนี่อร่อยจริงๆ นะ"
90100090-26 = "อืม... อันนี้เห็ดเหรอ? รสอูมามิจากเห็ดที่ซึมออกมาจากเต้าหู้ทอดนี่สุดยอดเลย~"
90100090-27 = "นี่... ว่าแต่ทำไมถุงเต้าหู้ทอดของฉันถึงมีแต่ถั่วเต็มไปหมดเลยล่ะ?"
90100090-28 = "นี่ไม่ใช่เกมลงโทษอะไรใช่มั้ย?"
90100090-29 = "อย่าบ่นเลยน่า กินๆ เข้าไปเถอะ ยิ่งเพิ่งไปเจอเรื่องแบบนั้นมา ผีที่ติดตัวมาตอนปฏิบัติการ#nอาจจะยังไม่ออกจากตัวไปก็ได้"
90100090-30 = "ไล่ผีออกไป รับโชคเข้ามา!"
90100090-31 = "แต่ถั่วที่ใช้ไล่ผี เขาใช้ถั่วคั่ว ไม่ใช่ถั่วต้มไม่ใช่เหรอ...?"
90100090-32 = "แต่ก็เอาเถอะ ถุงเต้าหู้ทอดไส้ถั่วก็อร่อยดีเหมือนกัน"
90100090-33 = "[s] \"มีผีติดตัวมางั้นเหรอ หมายความว่ายังไงน่ะ?\""
90100090-34 = "ถ้าจะอธิบาย คงต้องเล่ายาวสักหน่อยค่ะ..."
90100090-36 = "เพราะงั้นก็เลยสันนิษฐานได้ว่า... ตัวตนสีขาวไม่ทราบชนิดที่ส่งผลกระทบต่อ FOX 4 เป็นตัวตนเดียว#nกับหุ่นไล่กาสีขาวที่ผู้เสียหายพบเห็น ที่รู้จักกันโดยทั่วไปในชื่อ <คุเนะคุเนะ> ค่ะ"
90100090-37 = ""
90100090-39 = ""
90100090-40 = ""
90100090-41 = "[ns] \"แล้วร่างกายเป็นยังไงบ้าง? มีตรงไหนผิดปกติมั้ย?\""
90100090-42 = "ฉันไม่เป็นไร พอกลับมาถึงฉันก็ไปตรวจร่างกายทันที แต่ก็ไม่ได้พบความผิดปกติอะไร"
90100090-43 = "แต่ถ้ามีตรงไหนที่เจ็บ ก็คงเป็นท้ายทอยที่โดนคุรุมิฟาดใส่น่ะ สงสัยจะโนเป็นลูกมะนาวแล้วมั้ง..."
90100090-44 = "ฉันช่วยเอาไว้แท้ๆ พูดอะไรไม่รู้จักบุญคุณเลยนะ? ถ้าช้ากว่านั้นอีกแค่ไม่กี่วินาที อาจเกิดเรื่องใหญ่ไปแล้วก็ได้"
90100090-45 = "นั่นสิ อย่างน้อยก็ถือว่าโชคดีมากที่ฉันไม่ได้ลงเอยเหมือนผู้เสียหายคนอื่น..."
90100090-46 = "พอได้สติขึ้นมา ความทรงจำเกี่ยวกับเรื่องนั้นก็หายไปหมด แถมจำไม่ได้ด้วยซ้ำว่าคุเนะคุเนะมีหน้าตา#nเป็นยังไง แล้วก็จำไม่ได้ด้วยซ้ำว่า 'ทุ่งหญ้าสีเขียว' นั่นมันอยู่ตรงไหน..."
90100090-47 = "โชคดีที่บทสนทนาตอนนั้นถูกบันทึกไว้ในบอดี้แคมของ FOX 3 นะ"
90100090-48 = ""
90100090-52 = "<ฉันกลับมองเห็นทุ่งหญ้าใต้ท้องฟ้าสีครามอยู่เลยถนนออกไป...>"
90100090-53 = "<กลางทุ่งหญ้าที่ขึ้นรก มีหุ่นไล่กาเก่าๆ ตัวหนึ่ง เลยออกไปก็มีคนในชุดสีขาวกำลังยิ้มอย่างประหลาด>"
90100090-54 = ""
90100090-55 = "เอ่อ... เสียงฉันฟังดูเป็นแบบนี้จริงๆ เหรอ? ฟังทีไรก็รู้สึกแปลกๆ ทุกทีเลย"
90100090-56 = "เสียงเธอก็เป็นแบบนี้อยู่แล้ว ไม่ต้องไปใส่ใจหรอก"
90100090-57 = "แต่จะว่าไป ที่บอกว่าเห็นทุ่งหญ้า มันก็แปลกนะ แถวสถานีชิโระอุนางิไม่น่าจะมีทุ่งหญ้าอยู่เลยนี่นา"
90100090-58 = "หรือว่าที่เห็นคือภาพลวงตา? เวลาเกิดไอร้อน บางทีก็มองเห็นภาพของสถานที่ที่อยู่ไกลออกไปได้#nไม่ใช่เหรอ?"
90100090-59 = "ไม่ใช่หรอก ภาพลวงตาแบบนั้นจะเห็นก็แต่ในทะเลทรายโล่งๆ ที่ไม่มีสิ่งกีดขวาง อย่างทะเลทรายในอะบิดอส"
90100090-60 = "แถวจุดโรมิโอที่เป็นเขตธุรกิจ 3 มีอาคารบดบังทัศนวิสัยอยู่มาก ต่อให้เกิดการหักเหของภาพ ก็ไม่น่าจะมองเห็นสถานที่อื่นได้"
90100090-61 = "เป็นไอร้อนที่ทำให้มองเห็นสถานที่ที่ไม่ควรจะมองเห็นได้สินะ..."
90100090-62 = "งั้นก็สรุปได้ชัดเจนแล้วว่าศัตรูที่เรากำลังเผชิญอยู่คือ[ruby=สิ่งที่ไม่อาจเข้าใจได้]ตำนาน[/ruby]ที่อยู่เหนือความเข้าใจของมนุษย์"
90100090-63 = "[s5] \"แบบนี้ถ้าบุกเข้าไปโดยไม่คิดหน้าคิดหลังก็คงจะอันตรายแล้วละ\"\n[s6] \"ยูกิโนะ ให้ชาเล่ต์จัดการเรื่องนี้ต่อ แล้วค่อยไปหาภารกิจอื่น...\""
90100090-66 = "ก่อนหน้านี้ฉันเคยบอกไปแล้วใช่มั้ยคะ ว่าถ้าไม่มั่นใจในความปลอดภัย การยอมถอนตัวก็เป็นสิ่งที่หน่วยรบพิเศษควรทำ..."
90100090-67 = "ถ้าเป็น 'กระต่าย' ก็คงอีกเรื่อง แต่ว่า 'จิ้งจอก' น่ะ เป็นสัตว์ที่นอกจากจะระมัดระวังแล้ว ก็ยังมีความอยากรู้อยากเห็นไม่แพ้กัน"
90100090-68 = "พอมีเบาะแสใหม่อยู่ตรงหน้า จะให้ถอยกลับตอนนี้ก็คงขัดนิสัยพวกเราอยู่เหมือนกันค่ะ"
90100090-69 = "[s] \"เบาะแสใหม่งั้นเหรอ...?\""
90100090-70 = "คุณครู ช่วยมาดูทางนี้สักครู่ได้มั้ยคะ?"
90100090-71 = "นี่คือปลอกกระสุนที่ดีดออกมาตอน FOX 4 ลั่นไกขณะถูกไอร้อนครอบงำค่ะ"
90100090-72 = "แม้กระสุนจะถูกยิงไปยังเป้าหมายพร้อมกับปลอกกระสุนที่ดีดออกมา แต่ก็ไม่พบรอยกระสุนบนพื้น#nแม้แต่จุดเดียวค่ะ"
90100090-73 = "มันน่าจะหายไปพร้อมกับภาพลวงนั้นน่ะค่ะ"
90100090-74 = "กระสุนขนาด .50 ของปืนไรเฟิลซุ่มยิงต่อต้านยุทโธปกรณ์ มีพลังงานจลน์มหาศาลถึงขนาดที่ไม่อาจ#nมองข้ามได้ค่ะ ไม่ว่าจะในทางที่ดีหรือทางร้าย การที่มันเข้าไปแทรกแซงสิ่งนั้นได้ก็หมายความว่า..."
90100090-75 = "ศัตรูไม่ใช่ผีหรือภาพหลอน แต่เป็นเป้าหมายที่สามารถจัดการได้ด้วยวิธีทางกายภาพค่ะ"
90100090-76 = ""
90100090-78 = ""
90100090-79 = "ก่อนจะส่งมอบเป้าหมายนี้ให้กองอื่น ฉันอยากลาดตระเวนด้วยกำลังอีกครั้ง เพื่อลดความเสียหายที่อาจเกิดกับกองอื่นที่จะเข้าปฏิบัติการต่อค่ะ"
90100090-80 = ""
90100090-83 = "[ns7] \"ได้... แต่แค่ครั้งเดียวนะ\"\n[ns8] \"ได้ แต่ต้องให้ครูไปด้วยนะ\""
90100090-86 = "ขอบคุณที่อนุญาตค่ะ"
90100090-87 = "อย่างน้อยก็สบายใจกว่าต้องรับมือกับภาพหลอนละนะ ตราบใดที่อีกฝ่ายเป็นสิ่งที่จับต้องได้ ถ้าอัดระเบิดเข้าไปมากพอ ยังไงก็น่าจะตอบสนองบ้างละ"
90100090-88 = "ฟังแล้วชวนให้นึกถึงความทรงจำแย่ๆ ที่เคยโดนรุ่นน้องทำไว้เมื่อครั้งก่อนเลยนะ..."
90100090-90 = ""
90100090-91 = "แล้วปฏิบัติการครั้งหน้าจะดำเนินการที่ไหนล่ะ? ที่จุดโรมิโออีกแล้วหรือเปล่า?"
90100090-92 = "ถ้าต้องการจำลองสถานการณ์เดิมขึ้นมาอีกครั้ง การปฏิบัติการในสถานที่เดิมก็คงเหมาะที่สุด..."
90100090-93 = "แต่ถ้าจะมีการเปิดฉากสู้กัน ฉันคิดว่าควรเปลี่ยนไปปฏิบัติการที่อื่นดีกว่านะ"
90100090-94 = "ทำไมล่ะ?"
90100090-95 = "ลองคิดดูนะ ถ้าเราไปยิงใส่ 'ศัตรูที่คนอื่นมองไม่เห็น' ในพื้นที่เปิดโล่ง ชาวเมืองคงจะมองเราด้วยสายตาแปลกๆ แน่"
90100090-96 = "แถมตอนกลางวันย่านการค้ายังมีคนพลุกพล่าน ถ้าเกิดพลาดขึ้นมา ชาวเมืองอาจโดนลูกหลงจาก#nการยิงปะทะก็ได้"
90100090-97 = "นั่นสิเนอะ หลังจัดการคุเนะคุเนะเสร็จ คงต้องไปสู้กับนักเรียนวัลคิรี่ต่อเป็นยกสองแน่"
90100090-98 = "แบบนั้นคงลำบากแน่..."
90100090-99 = "[s9] \"เรื่องเกลี้ยกล่อมชาวเมือง ครูจะจัดการให้เอง\"\n[s10] \"ส่วนเรื่องหลังจากนั้น ครูจะรับผิดชอบเอง...\""
90100090-102 = "ไม่ค่ะ ฉันจะเปลี่ยนสถานที่ปฏิบัติการค่ะ"
90100090-103 = "ไม่ว่าจะเป็นปฏิบัติการแบบไหน ก็ต้องทำให้ชาวเมืองได้รับผลกระทบน้อยที่สุด"
90100090-104 = "และถ้าเกิดปัญหาเกี่ยวกับความปลอดภัยของชาวเมืองในระหว่างปฏิบัติการ... นั่นคือความรับผิดชอบของพวกเราค่ะ"
90100090-105 = "อีกอย่าง พวกเราก็ยังไม่ได้รับการยกโทษอย่างสมบูรณ์ด้วยนี่คะ"
90100090-106 = "ถ้าคุณครูเข้ามาช่วยไกล่เกลี่ย กลับจะทำให้ประธานองค์การนักเรียนตกอยู่ในสถานการณ์ที่ลำบากกว่า#nเดิมค่ะ"
90100090-107 = "[s] \"ถ้านั่นเป็นความต้องการของยูกิโนะ ครูก็ไม่มีปัญหา...\""
90100090-108 = "งั้นก่อนอื่น มาลองตรวจสอบกันว่าในพื้นที่ปิดก็ยังสังเกตเห็นไอร้อนได้หรือเปล่า"
90100090-109 = "ลองหาสถานที่ที่คนพลุกพล่านน้อย มีความแตกต่างของอุณหภูมิสูง และมีกระแสอากาศแปรปรวนมากเป็นพิเศษกันดีกว่า"
90100090-110 = "เข้าใจแล้ว ฉันจะเช็กแผนที่ปฏิบัติการของบริเวณนี้ให้"
90100090-111 = "แล้วก็ยังมีอีกเรื่องหนึ่ง ฉันมีบางอย่างที่กังวล..."
90100090-112 = "ถ้าพวกเรารับรู้การมีอยู่ของ <คุเนะคุเนะ> แล้ว ยังจะ 'ปฏิบัติการตามปกติ' ได้หรือเปล่า?"
90100090-113 = "ปฏิบัติการตามปกติ...?"
90100090-114 = "ก็โอโทกิถูกบางอย่างครอบงำทันทีที่เห็นคุเนะคุเนะ จนคุยกันไม่รู้เรื่องเลยไม่ใช่เหรอ?"
90100090-115 = "ต่อให้เป็นการต่อสู้ชุลมุนแค่ไหน เราก็สู้ต่อในสถานะ [ruby=การสื่อสารถูกตัดขาด]NORDO[/ruby] ที่แม้แต่คำสั่งถอนกำลังยังส่งไปไม่ถึงไม่ได้หรอก"
90100090-116 = "งั้นเราจับคู่กัน ให้คนหนึ่งคอยสังเกตการณ์ ส่วนอีกคนเป็นคนลั่นไก แบบนี้ได้มั้ย?"
90100090-117 = "ไม่ได้ เราจะวางแผนปฏิบัติการบนสมมติฐานว่าจะถูกคุเนะคุเนะครอบงำไม่ได้"
90100090-118 = "ถ้าเราไม่ระวัง เผลอๆ ทั้งสี่คนอาจหมดสภาพการต่อสู้พร้อมกันก็ได้"
90100090-119 = "งั้นเราใส่แว่นตานิรภัยป้องกันดวงตา แล้วเข้าปฏิบัติการได้มั้ย?"
