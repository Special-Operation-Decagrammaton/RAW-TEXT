[translation]
90100090-1 = "第9話;虛像追蹤"
90100090-3 = "夏萊地下．FOX小隊作戰本部"
90100090-4 = "[ns1] 「大家都還好嗎！？」\n[ns2] 「聽說你們遭到怪談襲擊了……沒事吧？」"
90100090-7 = ""
90100090-8 = "唔，嗚唔……"
90100090-9 = "（咕嚕）"
90100090-10 = "……失禮了。"
90100090-11 = "FOX小隊，大約在1小時30分鐘前歸隊了。"
90100090-12 = "[s3] 「啊……原來你們正在吃飯啊。」\n[s4] 「抱歉。我要不要晚點再來……？」"
90100090-15 = "不。反倒是我不小心讓您看到這副散漫的模樣……真是失禮了。"
90100090-16 = "啊，老師！您來得正好。"
90100090-17 = "不介意的話，老師要不要也一起用餐呢？"
90100090-18 = "[s] 「謝謝你的邀請，不過我已經吃過晚餐了。」"
90100090-19 = ""
90100090-22 = "[ns] 「話說回來，這是豆皮福袋嗎……？」"
90100090-23 = "嗯。是仁子做的。順帶一提，豆皮是從外面帶來的。#n休息室冰箱裡的食材我都沒動，所以不用擔心。"
90100090-24 = "我有位以前在作戰中認識的豆皮工廠員工。#n他會定期寄來品質很好的豆皮，所以我常常像這樣做一些豆皮料理。"
90100090-25 = "嗯，撇開那個不談，仁子做的豆皮料理真的很好吃。"
90100090-26 = "唔嗯……這是香菇嗎？從豆皮裡滲出來的鮮味真是好極了～"
90100090-27 = "那個……我總覺得自己的豆皮福袋，好像從剛才開始就只塞滿了豆子耶。"
90100090-28 = "這該不會是什麼懲罰遊戲吧？"
90100090-29 = "別抱怨了趕快吃。#n在作戰中纏上的鬼魂，現在搞不好還留在你身體裡呢。"
90100090-30 = "鬼往外，福往內！"
90100090-31 = "……用來驅鬼的豆子不是水煮豆，而是炒豆吧？"
90100090-32 = "算了，反正裝了豆子的豆皮福袋吃起來也不錯。"
90100090-33 = "[s] 「被鬼纏上是什麼意思？」"
90100090-34 = "說明起來可能會有點長……"
90100090-36 = "……因此，我們判斷對FOX4造成影響的那個不明白色個體，#n是與受害者們目擊到的──通稱「扭來扭去」的白色稻草人相同的存在。"
90100090-37 = ""
90100090-39 = ""
90100090-40 = ""
90100090-41 = "[ns] 「身體還好嗎？沒有哪裡不對勁吧？」"
90100090-42 = "沒事。我一回來就做了身體檢查，並沒有發現什麼異常。"
90100090-43 = "反而是被胡桃打的後腦勺還比較痛呢。#n感覺好像還腫了個包……"
90100090-44 = "這是什麼忘恩負義的話啊？#n要是再晚個幾秒，說不定就真的要出大事了。"
90100090-45 = "是啊。沒變得跟其他受害者一樣，真是不幸中的大幸……"
90100090-46 = "不過醒來之後記憶全都消失了。#n扭來扭去長什麼樣子、那片「藍色草原」在哪個方向，怎麼也想不起來……"
90100090-47 = "幸好FOX3的隨身攝影機裡，似乎記錄下了當時的對話。"
90100090-48 = ""
90100090-52 = "「……能在道路的另一頭看見一片藍天下的草原。」"
90100090-53 = "「茂密的草叢間立著一個破舊的稻草人，#n　在那之後還有一個身穿白衣、露出某種詭異笑容的人──」"
90100090-54 = ""
90100090-55 = "……那個，我的聲音聽起來真的是這樣嗎？#n每次聽都覺得有點微妙。"
90100090-56 = "你的聲音本來就是那樣，所以就別在意了。"
90100090-57 = "話說草原聽起來還真奇怪。#n白鰻車站附近根本就沒有草地啊。"
90100090-58 = "該不會是看到海市蜃樓了吧？#n陽炎升起的時候，有時也能看見遠處的地方不是嗎？"
90100090-59 = "不。那種海市蜃樓只有在像阿拜多斯大沙漠那種毫無障礙物的沙漠才觀測得到。"
90100090-60 = "Point Romeo──第三業務區的視野受到建築物的限制，#n就算受到扭曲也不可能觀察到其他地方。"
90100090-61 = "……讓人看見原本看不到的地方的陽炎啊。"
90100090-62 = "看來我們的對手是超越人類理解的[ruby=不可解]怪談[/ruby]，這一點已經很明確了。"
90100090-63 = "[s5] 「繼續盲目地正面對抗果然太危險了。」\n[s6] 「雪乃。這次的事就交給夏萊，我們去找別的工作──」"
90100090-66 = "……我之前說過如果無法確保安全，選擇放棄也是特殊部隊的一種美德吧。"
90100090-67 = "然而「兔子」姑且不論，「狐狸」可是好奇心和謹慎心一樣旺盛的動物。"
90100090-68 = "明明新的線索就在眼前卻選擇撤退，這多少有點違背我的個性呢。"
90100090-69 = "[s] 「……新的線索？」"
90100090-70 = "老師，可以請您看一下這邊嗎？"
90100090-71 = "這是FOX4被陽炎迷惑時，扣下扳機射出的彈殼。"
90100090-72 = "子彈在這枚彈殼排出的同時射向了目標，但地面上卻怎麼也找不到子彈留下的彈痕。"
90100090-73 = "恐怕是和那個虛像一起消失了吧。"
90100090-74 = "反器材狙擊槍的50口徑子彈，擁有絕對不容忽視的物理能量。#n無論是好是壞，能干涉到它就意味著……"
90100090-75 = "對方並非單純的幻影，而是能以物理手段加以遏制的目標。"
90100090-76 = ""
90100090-78 = ""
90100090-79 = "在將該目標移交給其他部隊之前，#n為了減少後續部隊的傷亡，我希望能再進行一次威力偵察。"
90100090-80 = ""
90100090-83 = "[ns7] 「……好吧。就只有一次哦。」\n[ns8] 「而且那個時候我也會同行。」"
90100090-86 = "感謝您的批准。"
90100090-87 = "比起對付幻影，這樣心裡反而踏實多了。#n只要對手是有形體的存在，吃下足量的炸藥總會有點反應的。"
90100090-88 = "總覺得之前對付後輩時那段不愉快的回憶又要浮現了……"
90100090-90 = ""
90100090-91 = "那麼下次作戰要在哪裡進行？#n一樣在Point Romeo嗎？"
90100090-92 = "要重現相同狀況的話，在相同地點作戰確實是最好的……"
90100090-93 = "不過如果預期會發生戰鬥，我認為應該換個地方進行。"
90100090-94 = "為什麼？"
90100090-95 = "你想想看。#n要是在開放場所朝著「別人看不見的敵人」掃射，可能會被市民用奇怪的眼神看待。"
90100090-96 = "而且白天的商業區人來人往，一不小心就可能把市民捲入槍戰裡。"
90100090-97 = "說的也是。搞不好處理完扭來扭去之後，還得在第二回合對上女武神的學生們呢。"
90100090-98 = "……那可就麻煩了。"
90100090-99 = "[s9] 「說服市民的事就交給我吧。」\n[s10] 「後續的事我會負責的──」"
90100090-102 = "沒關係。我會更換作戰地點。"
90100090-103 = "就算是作戰，對市民造成的傷害也必須降到最低。"
90100090-104 = "如果在作戰中讓市民的安全出了問題……那將是我們的責任。"
90100090-105 = "況且我們還沒有被完全赦免。"
90100090-106 = "如果老師出面調解的話，聯邦學生會長的立場會變得更加為難。"
90100090-107 = "[s] 「既然雪乃都這麼說了……」"
90100090-108 = "總之，我們先確認在受限的場所是否也能觀測到陽炎吧。"
90100090-109 = "去找一個盡可能人煙稀少，並且因溫差導致空氣流動極為劇烈的地方。"
90100090-110 = "明白了。我來確認一下附近的作戰地圖。"
90100090-111 = "除此之外，還有一件事讓我有點擔心……"
90100090-112 = "我們在認知到「扭來扭去」的狀態下，真的能進行「正常的作戰」嗎？"
90100090-113 = "正常的作戰……？"
90100090-114 = "之前御伽不是一目擊到扭來扭去，就被某種東西迷惑到沒辦法正常對話了嗎？"
90100090-115 = "就算情況再混亂，我們也無法在連撤退命令都傳達不了的[ruby=通訊中斷]NORDO[/ruby]狀態下繼續戰鬥。"
90100090-116 = "那麼採取兩人一組……一個人負責觀測，另一個人扣下扳機如何？"
90100090-117 = "那也不行。我們不能一開始就以會被扭來扭去迷惑為前提進行作戰。"
90100090-118 = "搞不好四個人全都會陷入無法行動的狀態。"
90100090-119 = "那麼戴上能保護眼睛的護目鏡如何？"
90100090-120 = "很難說。御伽當初不也是隔著瞄準鏡在觀察陽炎嗎？"
90100090-121 = "單純隔著玻璃或鏡子來避開視線，應該是沒有意義的。"
90100090-122 = "真傷腦筋。沒想到最關鍵的部分竟然是盲點……"
90100090-123 = "看來只能去聘請有透視能力的靈能力者了嗎？"
90100090-124 = ""
90100090-126 = ""
90100090-127 = ""
90100090-128 = ""
90100090-129 = "所以……只要不直接注視對方，又能觀測到對方的形狀就行了吧？"
90100090-130 = "那用「這個裝備」不就沒問題了嗎？"
90100090-131 = "…………"
90100090-133 = "……這真的行得通嗎？"
90100090-135 = "下一話;進入黑暗之中"
