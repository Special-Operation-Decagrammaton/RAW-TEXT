[translation]
2006108-1 = "키누가와 카스미"
2006108-3 = "선생님! 이쪽이야!"
2006108-4 = "설마 해변에서 둘이서 놀러 다니게 될 줄이야."
2006108-5 = "누가 보면 데이트라도 하는 줄 알겠어, 핫하하!"
2006108-10 = "일단, 좀 걸을까?"
2006108-13 = "(그후 카스미와 해변 곳곳을 돌아다니면서 시간을 보냈다.)"
2006108-19 = "오오, 잔뜩 먹으라고. 전부 내가 살 테니까."
2006108-20 = "먹는 것이 곧 체력! 체력이 곧 온천으로 이어지니까 말이야! 와하하핫!"
2006108-21 = "응? 나?"
2006108-22 = "……아니~ 솔직히~ 그, 배고프지는 않으려나……."
2006108-23 = "사실, 부원들한테도 종종 입이 짧다고 한 소리 듣는데."
2006108-24 = "내 생각에, 우리 부원들은 키보토스 평균에서도 꽤 먹는 편이라 생각하는데……."
2006108-27 = "경품인가! 확실히, 구매보다는 로망이 있지."
2006108-28 = "내가 이렇게 지갑을 여는 날은 흔치 않다고? 마음껏 도전해 봐!"
2006108-32 = "……아니, 왜 자꾸 나한테 권하는 걸로 이야기가 돌아올까……?"
2006108-33 = "나 개인에게 기호를 묻는다면, 뭐……."
2006108-34 = "이런 곳에서는 아무래도 '로망'을 정형화된 상술로 만들어 놔서 말이지."
2006108-35 = "거기 이용당하는 건 사절이려나."
2006108-39 = "아, 맞아, 여기야, 여기."
2006108-40 = "원래는 여기를 허물고 주차장을 지으려고 했는데……."
2006108-41 = "근방에 온천이 나오는 곳이 없더라고. 부지는 딱 좋았는데 말이야."
2006108-47 = "……으, 응?"
2006108-59 = "……벌써 밤인가."
2006108-60 = "음……."
2006108-61 = "으으음……."
2006108-66 = "……졌다, 졌어!"
2006108-67 = "설마 끝까지 한 마디도 안 물어볼 줄이야!!!"
2006108-68 = "선생님, 진짜 독하구만!"
2006108-69 = "늘 말하지만, 나는 빚지고 사는 걸 제일 싫어해."
2006108-70 = "내 나름 청산을 하려고 하거든."
2006108-71 = "근데, 선생님이 도와주질 않네, 이거참!"
2006108-72 = "딱 하나."
2006108-73 = "지금이라면 뭐든지 대답해 줄게. 그걸로 모든 빚은 없는 걸로."
2006108-74 = "[s] \"정말로?!\""
2006108-75 = "……기다렸다는 듯이, 너무 반색하는 걸."
2006108-76 = "사실이야. 나는 번복 안 해."
2006108-77 = "[s1] \"실은, 계속 신경 쓰였어.\"\n[s2] \"저번에 말이지…….\""
2006108-83 = "[ns3] \"카스미, 가운 벗고 있었이?!\"\n[ns4] \"가운 벗은 모습 처음 봤어!\""
2006108-88 = "……허?"
2006108-89 = "지금 그게 질문이야? 아니, 질문이라고 할까……."
2006108-90 = "……."
2006108-91 = "진짜로 괜찮겠어?"
2006108-92 = "나는 내 입으로 말한 거, 어지간해서는 번복 안 해."
2006108-93 = "그리고 오늘이 지나면, 나는 이 얘기 '두 번 다시는' 안 할 거야."
2006108-94 = "그래도 괜찮아?"
2006108-95 = "[s] \"…….\""
2006108-98 = "[ns] \"솔직히 궁금하긴 해!!!\""
2006108-99 = "아~ 역시 그렇지?"
2006108-100 = "[s5] \"그래도 카스미 의향이 우선이야.\"\n[s6] \"말하기 싫어 보이는데.\""
2006108-103 = "응, 싫어."
2006108-104 = "[s7] \"그럼 됐어.\"\n[s8] \"안 들을래.\""
2006108-109 = "……음."
2006108-110 = "……으으음."
2006108-111 = "선생님은 정말 사람 곤란하게 하는 재주가 있단 말이야."
2006108-112 = "이쪽이 빚을 갚겠다는데, 되려 씌우려고 하니까 원!"
2006108-113 = "그래, 이 이야기는 안 할 거야."
2006108-117 = "……그 대신이라고 할 정도는 아니지만."
2006108-118 = "마침 선생님이 물어본 비밀에 대해서, 딱 하나만 말할게."
2006108-119 = "선생님 말마따나 나는 항상 가운을 입고 있지."
2006108-120 = "그거 사실은……."
2006108-124 = "멋있어서 입는 거야."
2006108-128 = "알아! 웃기게 들리지! 근데 들어봐! 정확히는 내가 아니라 부원들 눈에 그리 보인다나 봐!"
2006108-129 = "무슨 영화에 나오는, 그런…… 엄청 똑똑한 박사님 같다나?"
2006108-130 = "……이 나를 보고 말이지."
2006108-131 = "그러니까, 내 나름의 성의라고 할까."
2006108-132 = "아니, 어쩌겠어, 하루아침에 진짜 박사님이 될 수도 없고. 흉내 정도는 낼 수 있잖아? 일단은, 겉모습부터, 라는 거지."
2006108-133 = "……그래서, 벗었어. 왠지 기분 나쁘더라고."
2006108-134 = "……."
2006108-136 = "끝!"
2006108-139 = "안 어울리는 징그러운 이야기는 여기까지!"
2006108-140 = "물론, 알고 있겠지만, 선생님. 이거는……."
2006108-141 = "[s9] \"응, 아무한테도 말 안 해.\"\n[s10] \"둘만의 비밀이네!\""
2006108-144 = "하하, 뭐야."
2006108-145 = "……선생님은 얘기를 청춘스럽게 꾸미는 재능이 있단 말이지."
2006108-146 = "아, 오해하지 마."
2006108-148 = "칭찬이니까. 암, 칭찬이지."
