[translation]
22170-1 = "제17화;역전의 발판"
22170-3 = "치히로 선배!"
22170-4 = "우와아아앙~! 부부장~!"
22170-5 = "기다리고 있었어요. 부부장."
22170-6 = "……하지만 어떻게?"
22170-8 = "앗, 맞아요! 에리두의 네트워크 통신망은 분명……!"
22170-9 = "리오 회장에게 장악당한 거 아니었어?"
22170-11 = "맞아. 하지만 바로 이럴 때를 위해 히마리 부장이 안배해둔 물건이 있었으니까."
22170-12 = "[s] \"히마리가 안배해둔 물건……?\""
22170-13 = "아…… 그거! 그거야! 언니!"
22170-14 = "그, 그거라니?! 갑자기 무슨 소리야. 미도리!"
22170-15 = "예전에 우리가 G.Bible을 해석하려고 찾았던 물건 말이야!"
22170-24 = "[ns] \"<거울>이구나……!\""
22170-25 = "응. 거울로 암호화된 에리두의 네트워크를 해킹, 장악했어."
22170-26 = "겸사겸사 회장도 퇴장시켰고."
22170-27 = "뭐, 뭐, 뭐야?! 그럼! 히마리 부장이 처음부터 학생회에 <거울>을 압류당했던 건……!"
22170-28 = "오늘 같은 날을 대비해둔 것이었단 건가."
22170-29 = "역시 전 베리타스의 부장. 우습게 볼 수 없는걸."
22170-30 = "[s] \"역시 치히로야! 베리타스의 여신!\""
22170-31 = "여, 여신이라니……. 선생님, 아무리 그래도 그건 좀 과해."
22170-33 = "어?! 하, 하지만 압류품 보관소까지 가려면 엄청 고생했을 거 아냐!"
22170-34 = "혼자서는 도저히……."
22170-35 = "아, 그거라면 도와준 사람이 있어."
22170-36 = "그 동아리 활동 내용 때문에, 운 좋게도 리오 회장의 감시망을 벗어나 있던 이……라고 할까."
22170-40 = "안녕하세요. 트레이너."
22170-41 = "[s] \"스미레?!\""
22170-42 = "아리스 양의 소식을 전해 듣고 가만히 있을 수 없다고 생각해 협력하기로 했습니다."
22170-43 = "응. 덕분에……."
22170-48 = "……이런 식으로 드론을 상대로 압류품 보관소에서 항전 중이야."
22170-49 = "얼마나 오래 버틸 수 있을지는 솔직히 미지수지만."
22170-50 = "지구력이라면 맡겨만 주세요. 충분히 자신 있습니다."
22170-51 = "[s] \"믿음직해! 스미레!\""
22170-61 = "역시나……. 거울을 썼다고는 하지만, 바로 방화벽이 반응하고 있어."
22170-62 = "이대로 패스가 끊어지기 전에 먼저 선수를 칠 필요가 있어."
22170-63 = "베리타스, 우리가 나설 차례야."
22170-64 = "응. 그거라면 맡겨줘. 부부장."
22170-65 = "우리들의 모든 리소스를 다 쏟아부어서라도! 완벽하게 네트워크를 유지할 테니까!"
22170-66 = "네, 전력을 다하겠습니다."
22170-68 = "응. 유지는 맡길게. 대신 지금부터 안내 담당은 내가 맡겠어."
22170-69 = "아직 다들 싸울 수 있지?"
22170-73 = "[ns] \"응!\""
22170-75 = "그럼 반격 개시야."
