[translation]
212070-1 = "제7화;잘 모르겠어"
212070-4 = "(마유미와 카렌에게 연락이 왔다.)"
212070-10 = "(깊은 고민이 느껴져서, 빠르게 장소로 이동했다.)"
212070-15 = "선생님……."
212070-16 = "야핫…… 안녕, 선생님."
212070-17 = "[s] \"안녕. 마유미, 카렌.\""
212070-18 = "선생님, 알지……? 지금 게헨나의 상황……."
212070-19 = "[s] 끄덕인다."
212070-20 = "야하핫, 선생님도 좀 난감하겠네."
212070-21 = "샬레니까 이것저것 신경 써야 하는데, 게헨나에서 전쟁을 벌인다니……."
212070-22 = "……선생님은 어떻게 생각해?"
212070-24 = "[ns] \"그런 일이 벌어지지 않게 최선을 다할 거야.\""
212070-25 = "……역시."
212070-26 = "우리는 어떻게 생각하냐고?"
212070-30 = "모, 모르겠어. 지금 일이 어떻게 돌아가는 건지."
212070-31 = "만마전과 선도부가 힘을 합친 건 좋아. 하나 된 게헨나로 가는 길이고. 우리가 말해왔던 거니까. 으응."
212070-34 = "그런데 이런 분위기는…… 바라지 않았어. 강압적이고, 학생들을 무섭게 통제하려고 하고……."
212070-35 = "게다가 전쟁이라니. 그건 그냥 쏘고 부수고 하는 거랑은 다르잖아?"
212070-38 = "선배들은 벌써 이런저런 전쟁 준비들에 여념이 없던데. 그거 진짜일까? 진심일까?"
212070-39 = "우리 후배들은 어버버하다가 끌려가기도 하고, 배반자 취급받지 않으려고 그냥 따라 하는 것 같기도 하고……."
212070-42 = "어, 어떻게 해야 하지? 이게 진짜 맞는 걸까? 정말 이게 위대한 게헨나로 가는 길일까?"
212070-43 = "회장……."
212070-44 = "……정말 잘 모르겠어. 혼란스럽기만 해."
212070-48 = "잘 생각해 보면 나름 괜찮거든?"
212070-52 = "평소에 말 안 듣던 녀석들이 전부 조용해졌고, 이제 교내에서 말썽부리는 사람도 없어."
212070-53 = "만마전과 선도부도 서로 싸우지 않고 잘 지내는 것 같고."
212070-54 = "어쩌면 우리가 꿈꾸던 위대한 게헨나와 어느 정도 맞는 것 같기도 해."
212070-58 = "근데 전쟁이라……."
212070-59 = "나는 솔직히 싸움도 좋아하고, 맞을 짓 한 녀석들 때려주는 것도 좋아하지만……"
212070-60 = "이건 잘 모르겠어."
212070-61 = "아무것도 안 한 녀석을 때리는 건 의미도 없고 기분만 더러워질 뿐이니까."
212070-62 = "이 전쟁에는 정당한 명분이 없어. 누가 잘못한 것도 아니야."
212070-63 = "하. 잘 모르겠다. 머리 아프네."
212070-64 = "……내가 지금 무서운 게 뭔지 알아?"
212070-65 = "뭔데?"
212070-66 = "우리는 예전의 게헨나를 동경해 온 사람들이잖아."
212070-67 = "그래서 동아리 이름도 재흥위원회. 게헨나를 '다시' 위대하게."
212070-68 = "그런데 예전의 게헨나가 이런 분위기였다면……."
212070-69 = "예전의 게헨나가 이렇게 강압적으로 학생들을 찍어 누르고, 타 학원과의 전쟁을 준비하던 그런 학원이라면……."
212070-70 = "……."
212070-71 = "그럼, 우리는 지금까지 무슨 일을 해오고 있었던 거지……?"
212070-72 = "우리가 외쳤던 위대한 게헨나가…… 이런 모습이었다고?"
212070-73 = "회장……."
212070-74 = "그리고, 그리고……!"
212070-75 = "이 상황, 지금 이 상황이 우리가 해왔던 일들 때문이라면, 우리는 어떻게 해……?"
212070-76 = "우리가 과거를 불러오려고 해서, 아무것도 모르고 과거의 게헨나를 동경하는 바람에……!!"
212070-82 = "[ns] 마유미의 손을 잡고 진정시킨다."
212070-87 = "……선생님……."
212070-88 = "[s1] \"그렇지 않다는 건 내가 보장할게.\"\n[s2] \"너희의 탓이 아니야.\""
212070-94 = "……."
212070-95 = "나는, 나는…… 우리가 했던 일들이, 모두 헛된 일이 될까 봐 무서워."
212070-96 = "우리가 해왔던 노력들이…… 결국 이런 걸 위해서였다고 생각하면……."
212070-97 = "[s] \"너희의 노력이 헛되지 않았다는 증거가 있어.\""
212070-98 = "으응?"
212070-99 = "[s] \"지금 느끼는 위화감이야.\""
212070-100 = "위화감……?"
212070-101 = "[s3] \"너희가 진심으로 게헨나에 대한 고민을 한 적이 없었다면,\"\n[s4] \"지금의 게헨나가 위대하다며 박수를 치고 있었을지도 몰라.\""
212070-106 = "[ns5] \"하지만 둘은 이게 틀렸다는 걸 알아챘잖아.\"\n[ns6] \"너희가 추구한 위대함이 아니었기 때문이겠지.\""
212070-111 = "[ns7] \"나는 알고 있어.\"\n[ns8] \"마유미와 카렌, 재흥위의 부원들이,\"\n[ns9] \"게헨나를 더 좋은 방향으로 만들기 위해 노력했다는 것을.\""
212070-119 = "우와아앙~~~!!"
212070-123 = "회, 회장……!"
212070-124 = "울지 마, 나까지 울고 싶어지잖아……!!"
212070-129 = "우아아아아앙~~~~~!!!"
212070-131 = "(마유미와 카렌이 울음을 그칠 때까지 달래주었다…….)"
212070-135 = "휴우…… 킁!"
212070-136 = "정말. 화장 다 지워졌잖아……."
212070-137 = "미안…… 카렌, 선생님."
212070-138 = "그 말을 들으니까, 나도 모르게 눈물이 나와서……."
212070-139 = "하아……."
212070-143 = "하지만, 금방금방 일어서는 것이 나의 장점!"
212070-144 = "지금은 완전 회복했어!"
212070-145 = "……."
212070-146 = "야핫, 그래. 이래야 우리 회장이지."
212070-147 = "[s] \"둘은 이제 어떻게 할 거야?\""
212070-148 = "뭐, 이제 확실히 알았지."
212070-149 = "이런 게헨나는 위대하지 않다는 거."
212070-150 = "응! 그러니까, 전쟁이니 뭐니, 이런 거 다 집어치우게 해야지!"
212070-151 = "우리는 진정으로 위대한 게헨나를 만들 거야!"
212070-152 = "[s] \"그럼, 둘에게 소개하고 싶은 사람들이 있어.\""
212070-156 = "뜻이 같은 사람들……?"
212070-157 = "아, 그런 거라면 얼마든지 환영이지. 많을수록 좋아."
212070-158 = "[s] \"그런데…… 쇼코는?\""
212070-162 = "쇼코는……"
212070-163 = "쇼코는 우리와 생각이 조금 다른 것 같아."
212070-164 = "지금 키보토스 침공 계획에서 작전참모 역할을 하고 있더라."
212070-165 = "요즘 이야기도 별로 못했어."
212070-166 = "그리고, 전쟁을 바라는 것처럼 보이기도 하고……."
212070-167 = "[s] \"쇼코와는 내가 한번 이야기를 해볼게.\""
212070-168 = "응…… 부탁해, 선생님."
212070-169 = "선생님의 이야기라면, 쇼코도 주의 깊게 들어줄 거야."
212070-170 = "쇼코 쨩……."
212070-171 = "아, 그리고……"
212070-172 = "오늘 상담, 고마웠어. 선생님."
212070-173 = "응응! 나도!! 야핫."
212070-175 = "(이 아이들의 미소가 사라지지 않기를,)"
212070-179 = "(진심으로 빌었다.)"
212070-181 = "다음화;치아키"
