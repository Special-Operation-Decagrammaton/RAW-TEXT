[translation]
212070-1 = "Episode 7;I'm Not Sure"
212070-4 = "Mayumi and Caren reached out to me."
212070-5 = ""
212070-10 = "It felt like they had a lot to say, so I quickly headed out."
212070-14 = ""
212070-15 = "Sensei..."
212070-16 = "Yaha... Hi, Sensei."
212070-17 = "[s] \"Hi, Mayumi and Caren.\""
212070-18 = "Sensei, you've seen it too, right...? How Gehenna is right now...?"
212070-19 = "[s] Nod."
212070-20 = "Yahaha, you must be in an awkward position..."
212070-21 = "You already have your work with Schale, and now Gehenna is trying to wage a war with your other schools..."
212070-22 = "...What do you think, Sensei?"
212070-23 = ""
212070-24 = "[ns] \"I'm going to do my best to prevent that from happening.\""
212070-25 = "...I knew it."
212070-26 = "You...\"want to know what we think\"?"
212070-27 = ""
212070-29 = ""
212070-30 = "I-I wish we could say. We don't know what's going on."
212070-31 = "It's great that the Pandemonium Society and Prefect Team are working together now. It aligns with the dream of a united Gehenna. It's what we wanted... It's what I DEMANDED. So..."
212070-32 = ""
212070-34 = "But this culture shift...isn't what we envisioned. It's forceful, inhumane, and everything's done out of intimidation and fear..."
212070-35 = "And a war? Even I know that's different than shooting and destroying inanimate objects."
212070-36 = ""
212070-38 = "Our upperclassmen are busy preparing for battle. And I keep asking myself, \"Are they serious?\" But it's happening right in front of us."
212070-39 = "And it looks like we, the underclassmen, are reprimanded for merely hesitating to comply. Some of us are just following along to avoid being branded traitors..."
212070-40 = ""
212070-42 = "Wh-What should we do? Is this really the right thing? Is this truly the way to restore glory to Gehenna?"
212070-43 = "President..."
212070-44 = "...I'm really not sure. I'm just confused."
212070-45 = ""
212070-47 = ""
212070-48 = "I know it's not half-bad. I see what's changed."
212070-49 = ""
212070-51 = ""
212070-52 = "The troublemakers have quieted down, and the students are in line."
212070-53 = "Like she said, the Pandemonium Society and Prefect Team are on good terms now. THAT was supposed to be impossible."
212070-54 = "It resembles the glorious Gehenna that we dreamed of."
212070-55 = ""
212070-57 = ""
212070-58 = "But a war..."
212070-59 = "Honestly, I like fighting. I relish beating up someone who deserves it..."
212070-60 = "But I'm not sure about this."
212070-61 = "Hurting an innocent person has no point. I'd feel awful."
212070-62 = "There is no justification for this war, and no one's done anything wrong."
212070-63 = "*sigh* I don't know. This is such a headache."
212070-64 = "...Do you know what scares me?"
212070-65 = "What?"
212070-66 = "How we...idolized the old Gehenna."
212070-67 = "We named our club the \"Heritage League,\" and all we wanted was to restore glory to Gehenna."
212070-68 = "But if this is what Gehenna was really like..."
212070-69 = "If Gehenna was an academy that ruthlessly suppressed its students and prepared for a baseless, aggressive war against our allied academies..."
212070-70 = "..."
212070-71 = "Then what have we even been working for...?"
212070-72 = "The great Gehenna that we yearned for...looked like this?"
212070-73 = "President..."
212070-74 = "And, and...!"
212070-75 = "If all this happened because of what we've done, then what should we do now...?"
212070-76 = "It's because we looked up to the Gehenna of the past without knowing or questioning anything...! IT'S OUR FAULT!!!"
212070-77 = ""
212070-79 = ""
212070-80 = ""
212070-82 = "[ns] Take Mayumi's hand and calm her down."
212070-83 = ""
212070-85 = ""
212070-86 = ""
212070-87 = "...Sensei..."
212070-88 = "[s1] \"I promise you that's not the case.\"\n[s2] \"It's not your fault.\""
212070-89 = ""
212070-90 = ""
212070-92 = ""
212070-94 = "..."
212070-95 = "I-I'm...scared that everything we've done will be in vain."
212070-96 = "When I think that all the effort we've put in... How much I cared... And this is what we get?"
212070-97 = "[s] \"Your efforts were not in vain. I can prove it.\""
212070-98 = "H-Hmm?"
212070-99 = "[s] \"It's in that distress you're experiencing right now.\""
212070-100 = "\"Distress\"...?"
212070-101 = "[s3] \"If you truly did not care about Gehenna...\"\n[s4] \"...you'd be cheering and celebrating its 'glory.'\""
212070-106 = "[ns5] \"But you two noticed that this isn't right.\"\n[ns6] \"You know that this isn't what you worked so hard for.\""
212070-109 = ""
212070-111 = "[ns7] \"I'm well aware...\"\n[ns8] \"...that you, Caren, and the other Heritage League members...\"\n[ns9] \"...worked to make Gehenna a better place.\""
212070-112 = ""
212070-113 = ""
212070-114 = ""
212070-116 = ""
212070-117 = ""
212070-119 = "Waaah!!!"
212070-120 = ""
212070-122 = ""
212070-123 = "P-President...!"
212070-124 = "Don't cry! You're going to make me cry too...!!!"
212070-125 = ""
212070-129 = "Waaaaaaaah!!!"
212070-131 = "I soothed Mayumi and Caren until they stopped crying."
212070-134 = ""
212070-135 = "Phew... *sniff*"
212070-136 = "Seriously. My makeup's all smudged now..."
212070-137 = "Sorry, Caren...and Sensei."
212070-138 = "I couldn't keep it inside after hearing all that..."
212070-139 = "Aah..."
212070-140 = ""
212070-142 = ""
212070-143 = "But resilience is one of my greatest strengths!"
212070-144 = "So I'm totally fine now!"
212070-145 = "..."
212070-146 = "Yaha, yeah. That's the spirit, President!"
212070-147 = "[s] \"So, what's the plan now?\""
212070-148 = "Well, now we know one thing for sure."
212070-149 = "This Gehenna is anything but glorious."
212070-150 = "Yeah! So we gotta make them scrap all this war stuff!"
212070-151 = "And then we'll work to bring TRUE glory to Gehenna!"
212070-152 = "[s] \"In that case, there are some students I want you to meet.\""
212070-153 = ""
212070-155 = ""
212070-156 = "People with \"the same idea\"...? Like a club?"
212070-157 = "Ah, in that case, we'd love to be introduced. The more the merrier."
212070-158 = "[s] \"By the way... Where's Shouko?\""
212070-159 = ""
212070-161 = ""
212070-162 = "Shouko..."
212070-163 = "I think Shouko has her own ideas nowadays."
212070-164 = "She's serving as an operations officer for the greater Kivotos invasion."
212070-165 = "It sounds pretty daunting, so we haven't really talked."
212070-166 = "...And it seems she always wanted war, now that I think about it."
212070-167 = "[s] \"I'll try talking to Shouko.\""
212070-168 = "Yeah... Please do, Sensei."
212070-169 = "I'm sure Shouko will listen to you."
212070-170 = "Oh, Shouko..."
212070-171 = "Also..."
212070-172 = "Thank you for your advice, Sensei."
212070-173 = "Yeah, yeah! We really appreciate it! Yaha!"
212070-175 = "I truly hoped..."
212070-176 = ""
212070-179 = "...that these girls' smiles would never fade."
212070-181 = "Next Episode;Chiaki"
