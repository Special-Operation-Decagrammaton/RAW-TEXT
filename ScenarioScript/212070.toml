[translation]
212070-1 = "ตอนที่ 7;ไม่เข้าใจเลย"
212070-4 = "(คุณครูได้รับการติดต่อจากมายูมิกับคาเรน)"
212070-5 = ""
212070-10 = "(เมื่อรู้สึกได้ถึงความกังวลอย่างหนัก คุณครูจึงรีบไปยังสถานที่นัดหมาย)"
212070-14 = ""
212070-15 = "คุณครู..."
212070-16 = "ยะฮ่า... สวัสดี คุณครู"
212070-17 = "[s] \"สวัสดี มายูมิ คาเรน\""
212070-18 = "คุณครู รู้อยู่ใช่มั้ย...? สถานการณ์ของเกเฮนน่าตอนนี้น่ะ..."
212070-19 = "[s] พยักหน้า"
212070-20 = "ยะฮะฮ่า คุณครูเองก็คงลำบากใจอยู่สินะ"
212070-21 = "เป็นชาเล่ต์ก็ต้องคอยใส่ใจเรื่องต่างๆ อยู่แล้ว แต่เกเฮนน่ากลับจะก่อสงคราม..."
212070-22 = "คุณครูคิดยังไงเหรอ...?"
212070-23 = ""
212070-24 = "[ns] \"ครูจะทำทุกอย่างเพื่อไม่ให้เรื่องแบบนั้นเกิดขึ้น\""
212070-25 = "สมกับเป็นคุณครูจริงๆ..."
212070-26 = "ถามว่าพวกเราคิดยังไงน่ะเหรอ?"
212070-27 = ""
212070-29 = ""
212070-30 = "มะ... ไม่รู้สิ ฉันไม่เข้าใจเลยว่าตอนนี้เรื่องมันเป็นมายังไงกันแน่"
212070-31 = "การที่แพนเดโมเนียม โซไซตี้กับคณะกรรมการวินัยร่วมมือกันก็เป็นเรื่องดี เพราะเป็นหนทางสู่เกเฮนน่า#nที่รวมเป็นหนึ่ง และพวกเราก็พูดแบบนั้นมาตลอดด้วย อื้ม"
212070-32 = ""
212070-34 = "แต่บรรยากาศแบบนี้... มันไม่ใช่สิ่งที่ฉันต้องการเลย ทั้งบีบบังคับ ทั้งพยายามควบคุมนักเรียน#nด้วยความหวาดกลัว..."
212070-35 = "แถมยังจะทำสงครามอีก นั่นไม่เหมือนกับการยิงแล้วทำลายไปเรื่อยๆ หรอกนะ"
212070-36 = ""
212070-38 = "เห็นว่าพวกรุ่นพี่ง่วนอยู่กับการเตรียมนู่นเตรียมนี่เพื่อทำสงครามกันอยู่ เรื่องนั้นเป็นเรื่องจริงเหรอ? เอาจริงกันใช่มั้ย?"
212070-39 = "ส่วนรุ่นน้องอย่างพวกเราก็ได้แต่อึกๆ อักๆ แล้วก็ถูกลากเข้าไปพัวพัน หรือไม่ก็ดูเหมือนจะทำตาม เพียงเพราะไม่อยากถูกมองว่าเป็นคนทรยศ..."
212070-40 = ""
212070-42 = "จะ... จะทำยังไงดีล่ะ? นี่มันถูกต้องจริงๆ เหรอ? นี่คือหนทางสู่เกเฮนน่าที่ยิ่งใหญ่จริงๆ ใช่มั้ย?"
212070-43 = "หัวหน้า..."
212070-44 = "ฉันไม่เข้าใจจริงๆ... มีแต่เรื่องสับสนไปหมด"
212070-45 = ""
212070-47 = ""
212070-48 = "แต่ถ้าลองคิดดีๆ มันก็มีด้านที่ดีอยู่เหมือนกันนะ"
212070-49 = ""
212070-51 = ""
212070-52 = "พวกที่ปกติไม่ยอมฟังใครก็เงียบกันหมดแล้ว ตอนนี้ไม่มีใครก่อเรื่องในโรงเรียนด้วย"
212070-53 = "แพนเดโมเนียม โซไซตี้กับคณะกรรมการวินัยก็ดูจะเข้ากันได้ดีโดยที่ไม่ต้องทะเลาะกัน"
212070-54 = "บางทีอาจจะตรงกับเกเฮนน่าอันยิ่งใหญ่ที่พวกเราใฝ่ฝันอยู่บ้างก็ได้นะ"
212070-55 = ""
212070-57 = ""
212070-58 = "แต่ว่าเรื่องสงครามน่ะ..."
212070-59 = "พูดตามตรง ฉันเองก็ชอบต่อสู้และก็ชอบอัดพวกที่สมควรโดนอยู่หรอกนะ แต่ว่า..."
212070-60 = "เรื่องนี้ฉันไม่เข้าใจเลย"
212070-61 = "การไปทำร้ายคนที่ไม่ได้ทำอะไรผิด มันทั้งไร้ความหมายและมีแต่ทำให้รู้สึกแย่เปล่าๆ"
212070-62 = "สงครามครั้งนี้ไม่มีเหตุผลอันชอบธรรม ไม่มีใครทำอะไรผิดเลยสักหน่อย"
212070-63 = "เฮ้อ ไม่เห็นจะเข้าใจเลย ปวดหัวจัง"
212070-64 = "รู้มั้ยว่าตอนนี้ฉันกลัวอะไร...?"
212070-65 = "อะไรเหรอ?"
212070-66 = "พวกเราเป็นคนที่เฝ้าชื่นชมเกเฮนน่าในอดีตกันใช่มั้ยล่ะ"
212070-67 = "เพราะแบบนั้นชื่อชมรมถึงชื่อคณะกรรมการฟื้นฟู และเราก็จะทำให้เกเฮนน่ากลับมายิ่งใหญ่ 'อีกครั้ง'"
212070-68 = "แต่ถ้าเกเฮนน่าในอดีตมีบรรยากาศแบบนี้ละก็..."
212070-69 = "ถ้าเกเฮนน่าในอดีตเป็นโรงเรียนที่บีบบังคับนักเรียน และเตรียมทำสงครามกับโรงเรียนอื่นแบบนี้..."
212070-70 = "..."
212070-71 = "ถ้างั้น ที่ผ่านมาพวกเรามัวทำอะไรอยู่กันแน่...?"
212070-72 = "เกเฮนน่าที่ยิ่งใหญ่ที่พวกเราป่าวร้องถึง... มันมีสภาพแบบนี้จริงๆ เหรอ?"
212070-73 = "หัวหน้า..."
212070-74 = "แล้วก็ แล้วก็...!"
212070-75 = "ถ้าสถานการณ์นี้... ถ้าสถานการณ์ในตอนนี้เกิดขึ้นเพราะสิ่งที่พวกเราทำ แล้วพวกเราจะทำยังไง...?"
212070-76 = "เป็นเพราะพวกเราพยายามเรียกอดีตกลับมา เป็นเพราะพวกเราไม่รู้อะไรเลย แต่กลับเฝ้าหลงใหลเกเฮนน่าในอดีต...!!"
