[translation]
212070-1 = "第7話;搞不太懂"
212070-4 = "（收到了真由美和香蓮的聯絡）"
212070-5 = ""
212070-10 = "（感覺得出他們深深的煩惱，便迅速趕往約定地點）"
212070-14 = ""
212070-15 = "老師……"
212070-16 = "呀哈……嗨，老師。"
212070-17 = "[s] 「嗨。真由美、香蓮。」"
212070-18 = "老師，你知道吧……？#n現在格黑娜的狀況……"
212070-19 = "[s] 點頭"
212070-20 = "呀哈哈，老師也很頭痛吧。"
212070-21 = "畢竟要顧慮到夏萊的立場，格黑娜卻要發動戰爭……"
212070-22 = "……老師是怎麼想的？"
212070-23 = ""
212070-24 = "[ns] 「我會盡全力不讓那種事發生。」"
212070-25 = "……果然是這樣啊。"
212070-26 = "你問我們是怎麼想的？"
212070-27 = ""
212070-29 = ""
212070-30 = "我，我不知道。#n我搞不懂現在到底是怎麼回事。"
212070-31 = "萬魔殿和風紀委員會聯手是好事。#n那是通往合而為一的格黑娜之路，也是我們一直在說的事。"
212070-32 = ""
212070-34 = "可是這種氣氛……不是我想要的。#n既強硬，又想用恐懼控制學生……"
212070-35 = "而且還要打仗。#n那跟單純開槍、搞破壞是不一樣的吧？"
212070-36 = ""
212070-38 = "前輩們已經忙著做各種戰爭準備了。#n那是真的嗎？是認真的嗎？"
212070-39 = "我們這些後輩有的懵懵懂懂就被拉去了。#n有的好像是怕被當成叛徒，才跟著照做……"
212070-40 = ""
212070-42 = "怎，怎麼辦才好？#n這樣真的對嗎？這真的是通往偉大格黑娜的道路嗎？"
212070-43 = "委員長……"
212070-44 = "我真的搞不懂了。#n只覺得一片混亂。"
212070-45 = ""
212070-47 = ""
212070-48 = "仔細想想，其實也還不錯吧？"
212070-49 = ""
212070-51 = ""
212070-52 = "平常不聽話的傢伙全都安靜下來，現在校內也沒有人在惹麻煩了。"
212070-53 = "萬魔殿和風紀委員會好像也處得還不錯。"
212070-54 = "說不定跟我們夢想中的偉大格黑娜有幾分接近。"
212070-55 = ""
212070-57 = ""
212070-58 = "可是打仗啊……"
212070-59 = "老實說我確實喜歡打架，也喜歡教訓那些欠揍的傢伙……"
212070-60 = "但這個我就搞不懂了。"
212070-61 = "去揍什麼都沒做的傢伙既沒有意義，也只會讓心情變差而已。"
212070-62 = "這場戰爭根本師出無名。#n也不是誰做錯了什麼。"
212070-63 = "哈。搞不懂啦。頭好痛。"
212070-64 = "你知道我現在害怕的是什麼嗎？"
212070-65 = "什麼？"
212070-66 = "我們不是一直很嚮往從前的格黑娜嗎？"
212070-67 = "所以社團名稱才會叫再興委員會。#n讓格黑娜「再次」偉大。"
212070-68 = "可是如果從前的格黑娜是這種氣氛……"
212070-69 = "如果從前的格黑娜是這樣強硬地打壓學生，準備和其他學園開戰的學園的話……"
212070-70 = "……"
212070-71 = "那我們到目前為止到底都在做什麼……？"
212070-72 = "我們高喊的偉大格黑娜……竟然是這副模樣嗎？"
212070-73 = "委員長……"
212070-74 = "而且，而且……！"
212070-75 = "如果這個狀況，現在這個狀況是我們做過的事情造成的，那我們該怎麼辦……？"
212070-76 = "都是因為我們想喚回過去，什麼都不懂就嚮往著從前的格黑娜……！！"
212070-77 = ""
212070-79 = ""
212070-80 = ""
212070-82 = "[ns] 握住真由美的手，讓他冷靜下來"
212070-83 = ""
212070-85 = ""
212070-86 = ""
212070-87 = "老師……"
212070-88 = "[s1] 「我保證不是那樣的。」\n[s2] 「這不是你們的錯。」"
212070-89 = ""
212070-90 = ""
212070-92 = ""
212070-94 = "……"
212070-95 = "我，我……好害怕我們做過的事全都白費了。"
212070-96 = "一想到我們付出的努力……到頭來是為了這種事……"
212070-97 = "[s] 「有證據能證明你們的努力不是白費。」"
212070-98 = "嗯？"
212070-99 = "[s] 「就是你們現在感受到的不對勁。」"
212070-100 = "不對勁……？"
212070-101 = "[s3] 「如果你們不是真心為格黑娜煩惱……」\n[s4] 「說不定現在已經在為如今的格黑娜有多偉大而鼓掌了。」"
212070-106 = "[ns5] 「但是你們兩個發現了這是錯的。」\n[ns6] 「應該是因為這並不是你們所追求的偉大吧。」"
212070-109 = ""
212070-111 = "[ns7] 「我知道。」\n[ns8] 「真由美和香蓮，還有再興委員會的成員們……」\n[ns9] 「一直努力想讓格黑娜往更好的方向發展。」"
212070-112 = ""
212070-113 = ""
212070-114 = ""
212070-116 = ""
212070-117 = ""
212070-119 = "嗚哇啊啊～～～！！"
212070-120 = ""
212070-122 = ""
212070-123 = "委，委員長……！"
212070-124 = "不要哭啦，害我也想哭了……！！"
212070-125 = ""
212070-129 = "嗚啊啊啊啊啊～～～～～！！！"
212070-131 = "（一直安慰真由美和香蓮，直到他們不再哭泣……）"
212070-134 = ""
212070-135 = "呼……嗚嗚！"
212070-136 = "真是的。妝都哭花了啦……"
212070-137 = "對不起……香蓮、老師。"
212070-138 = "聽到那些話，我就不知不覺掉眼淚了……"
212070-139 = "哈啊……"
212070-140 = ""
212070-142 = ""
212070-143 = "不過，能馬上重新振作就是我的優點！"
212070-144 = "現在已經完全恢復了！"
212070-145 = "……"
212070-146 = "呀哈，對嘛。#n這才是我們的委員長。"
212070-147 = "[s] 「你們兩個接下來打算怎麼做？」"
212070-148 = "現在我們已經很清楚了。"
212070-149 = "這樣的格黑娜並不偉大。"
212070-150 = "嗯！所以什麼戰爭之類的，全都要讓他們停下來！"
212070-151 = "我們要打造真正偉大的格黑娜！"
212070-152 = "[s] 「那麼，我有些人想介紹給你們兩個認識。」"
212070-153 = ""
212070-155 = ""
212070-156 = "志同道合的人……？"
212070-157 = "那倒是隨時歡迎。畢竟人手越多越好。"
212070-158 = "[s] 「不過……翔子呢？」"
212070-159 = ""
212070-161 = ""
212070-162 = "翔子他……"
212070-163 = "翔子的想法好像跟我們有點不一樣。"
212070-164 = "他現在在奇普托斯進攻計畫中擔任作戰參謀的角色。"
212070-165 = "最近也沒怎麼跟他說到話。"
212070-166 = "而且他看起來好像很希望發生戰爭……"
212070-167 = "[s] 「我會試著去跟翔子談談。」"
212070-168 = "嗯……拜託你了，老師。"
212070-169 = "如果是老師說的話，翔子應該也會好好聽進去的。"
212070-170 = "翔子醬……"
212070-171 = "啊，還有……"
212070-172 = "謝謝你今天聽我們傾訴，老師。"
212070-173 = "嗯嗯！我也是！！呀哈。"
212070-175 = "（希望這些孩子們的笑容不會消失……）"
212070-176 = ""
212070-179 = "（我打從心底這麼祈禱）"
212070-181 = "下一話;千秋"
