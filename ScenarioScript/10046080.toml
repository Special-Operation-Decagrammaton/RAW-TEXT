[translation]
10046080-1 = "제8화;한여름 밤의 티파티"
10046080-9 = "…………."
10046080-10 = "……………."
10046080-15 = "…………."
10046080-16 = "어."
10046080-17 = "……뭐죠? 제가 한 건가요?"
10046080-25 = "어떻게 된 일이죠, 미카 씨?"
10046080-29 = "나, 나기 쨩……! 아니야, 이건……!"
10046080-30 = "아뇨, 설명을 들을 필요도 없겠군요."
10046080-31 = "별장에 폭탄이 설치되어 있었다…… 이것이 의미하는 바는 명확합니다."
10046080-35 = "바캉스는 종료입니다!"
10046080-36 = "여기 있는 모든 사람을 체포하세요! 모든 정황을 파악할 때까지 구류합니다!"
10046080-37 = "그리고, 사건의 주모자, 미소노 미카에게는 삼시 세끼 롤케이크만을."
10046080-39 = "우유 한 모금도 허락하지 마세요!!"
10046080-45 = "……카!"
10046080-48 = "미카! 괜찮아요?"
10046080-49 = "혹시 방금 폭발 충격으로……?"
10046080-50 = "나, 나기 쨩……."
10046080-51 = "아니야, 이거는, 그러니까……."
10046080-52 = "미안해요, 미카 씨."
10046080-56 = "……응?"
10046080-57 = "왜 나기 쨩이 사과하는 거야?"
10046080-61 = "왜냐니요…… 잘은 모르지만, 방금 폭발은 제가 일으킨 거죠?"
10046080-62 = "모처럼 미카 씨가 공들여 준비한 바캉스를 망쳐버렸군요. 죄송합니다."
10046080-63 = "아니, 아니! 그런 정도가 아니잖아! 나기 쨩, 정말 그걸로 끝내도 괜찮아?"
10046080-64 = "네? 무슨 뜻인가요? 제가 놓치고 있는 점이라도?"
10046080-65 = "그야, 폭발했잖아? 별장이."
10046080-66 = "그랬죠?"
10046080-67 = "내 잘못이잖아? 상식적으로?"
10046080-68 = "관계자 전원 구금하고, 24시간 내내 취조한다거나 하지 않아도 괜찮아?!"
10046080-72 = "……미카 씨 안에서 제 이미지는 어떻게 되어 있는 거죠?"
10046080-73 = "애초에 누구를 탓할 수 있을까요? 별생각 없이, 궁금하단 이유만으로 스위치를 누른 게 바로 저인데요. 제가 누르게 유도했다? 그건 아무래도 지나친 비약이죠."
10046080-74 = "……물론, 별장 밑에 왜 폭탄이 묻혀 있었는지, 또, 그 스위치가 앞에 떨어져 있었는지는 완전 별개의 이야기입니다만."
10046080-75 = "그래도, 하나는 알겠습니다."
10046080-76 = "미카 씨."
10046080-81 = "오후 내내 모습이 이상하다 생각했습니다."
10046080-82 = "이제야 이해가 되는군요. 미카 씨는 뒤에서 이런 사태를 막으려고 계속 노력한 거죠?"
10046080-83 = "……믿어주는 거야?"
10046080-84 = "네?"
10046080-85 = "아니, 그도 그럴 게, 나잖아?"
10046080-86 = "하는 일마다 망치고, 모두한테 못된 짓도 많이 했고."
10046080-87 = "그런 나인데도 믿어주는 거야?"
10046080-88 = "……무슨 소리를 하나 했더니, 바보인가요? 아니, 바보라는 것은 옛적에 알고 있었죠."
10046080-94 = "당연히, 믿어요."
10046080-98 = "……흑."
10046080-100 = "……흑, 으아아앙!"
10046080-101 = "미, 미카?! 왜 우는 건가요?!"
10046080-102 = "그치만, 나기 쨩이…… 으아앙!"
10046080-107 = "미카."
10046080-111 = "……응."
10046080-114 = "그쳤나요?"
10046080-115 = "……응."
10046080-116 = "정말, 정신없이 바쁜 사람입니다. 혼자 안절부절못하고, 갑자기 울어버리질 않나."
10046080-117 = "옛날부터 생각했지만, 정말 손이 많이 가는 사람입니다."
10046080-118 = "……나기사, 당신도 마찬가지예요."
10046080-122 = "네?!"
10046080-123 = "이 말괄량이 아가씨가 멋대로 울어버렸을 뿐인데, 자기가 무슨 죄인이라도 된 것처럼 굴지 말란 말이에요."
10046080-124 = "이렇게 안 맞는 두 사람이 어떻게 소꿉친구인지, 참 모를 일입니다."
10046080-130 = "저기, 나기 쨩."
10046080-131 = "저, 미카 씨."
10046080-132 = "아, 먼저 말해."
10046080-133 = "아니요. 미카 씨가 먼저."
10046080-134 = "…………."
10046080-135 = "…………."
10046080-140 = "……? 뭐죠, 이 지능 지수 낮은 대화는?"
10046080-141 = "티파티 중 두 명이나 바보라니, 트리니티도 갈 데까지 갔군요."
10046080-142 = "자, 잠깐! 아까부터! 자기만 아니란 듯이 구는 건 뭔데!"
10046080-143 = "당연한 것을 말로 설명해야 할까요? 저희 중에 저 말고 현실적인 문제를 직시하고 있는 사람이 있나요?"
10046080-144 = "현실적인 문제?"
10046080-145 = "네, 잠자리가 없어졌잖아요."
10046080-146 = "아."
10046080-148 = "아."
10046080-149 = "[s] \"아.\""
10046080-150 = "보시죠. ……뭐, 텐트라도 치고 자면 되겠지만요."
10046080-155 = "저, 세이아 님. 잠시만 이쪽으로."
10046080-156 = "말씀 중에 죄송합니다만, 텐트는 준비되어 있지 않습니다."
10046080-157 = "구하려면 시내까지 나가야 할 텐데, 그러면 차라리 시내에서 숙박하시는 편이……."
10046080-158 = "아, 괜찮습니다. 제 차에 몇 개 싣고 왔으니까요."
10046080-162 = "아, 일단은, 이치카와 하스미는 텐트를 같이 써주시겠어요? 가지고 온 것이 3개뿐이라, 나눈다면 두 분이 같이 쓰시는 편이 나아 보이는군요."
10046080-163 = "그리고, 선생님께서는 죄송하지만, 제 개인 텐트를 써주시겠어요? 홀로 텐트 하나를 쓰는 것이니 어떤 의미로는 호사입니다."
10046080-164 = "[s1] \"그, 고맙기는 한데…….\"\n[s2] \"왜 텐트를 3개씩이나……?\""
10046080-169 = "……? 외박을 한다면, 언제 어디서나 조난에 대비해야 하잖아요?"
10046080-170 = "지금 당장 조난된다 한들, 저는 2주 정도 살아남을 자신이 있습니다. 구조가 오기에는 충분한 시간이죠."
10046080-171 = "그러고 보니…… 예전부터 세이아 님은 그런 부분이 있었죠. 이상한 부분에서 준비성이 철저하다고 할까, 발상이 엉뚱하다고 할까."
10046080-172 = "후후. 숙녀의 소양이라 불러주시죠."
10046080-173 = "어쨌거나, 하스미, 이치카…… 그리고 선생님."
10046080-174 = "텐트 설치를 도와주시겠어요?"
10046080-180 = "두 사람에게는, 조금 더 대화가 필요해 보이니까요."
10046080-183 = "(세이아의 차에서 텐트를 가져와, 취침 준비를 끝마쳤다.)"
10046080-184 = "(뜻밖에도, 나기사는 예상치 못한 외박에 조금 즐거워 보였다.)"
10046080-189 = "(……조금 시간이 지나, 바깥이 조용해질 무렵.)"
10046080-194 = "저기, 선생님? 주무시나요?"
10046080-195 = "[ns3] \"아니, 들어와.\"\n[ns4] \"응, 자고 있어.\""
10046080-198 = "아직 깨어 계셨군요. 그러면 실례하겠습니다."
10046080-203 = "……역시, 두 사람이 들어오기에는 좁군요. 부디 양해를."
10046080-204 = "아무래도 잠이 안 오시는 모양이군요. 이해합니다. 다사다난한 하루였으니까요."
10046080-205 = "<공주의 호박 마차를 끌어준 생쥐는 어디서 왔을까?>"
10046080-206 = "모두가 맞이한 해피 엔딩, 그 이면의 이야기. 유쾌하지만 곱씹을수록 쓴맛이 배어나는 그런 이야기."
10046080-207 = "누구도 궁금해하지 않지만, 그럼에도 분명 누군가는 기억해야 하는 이야기."
10046080-208 = "전에 들으셨겠지만, 원래 티파티의 호스트는 나기사가 아닌 제가 맡을 예정이었습니다."
10046080-209 = "의아하지 않습니까? 티파티 호스트로서 나기사만 한 적임이 없어 보이는데 말이죠."
10046080-210 = "왜 당시에 호스트로 내정된 것은 '그때의 나기사'가 아닌 저였을까요?"
10046080-213 = "단순한 이치입니다."
10046080-214 = "<생쥐는 마차를 끌기 위해, 말로 변했습니다.>"
10046080-217 = "아까 선생님께서 보신 모습, 그것이 본래의 키리후지 나기사입니다."
10046080-218 = "어느 때도 기품과 여유를 잃지 않고, 삶에 닥치는 해프닝조차 즐거움으로 삼는 그런 아가씨요."
10046080-221 = "……압니다. 상상하기 어렵겠죠. 선생님께서 보신 모습은, 언제나 '지금의 나기사'였을 테니까요."
10046080-222 = "저희는 별로 좋은 친구가 아니에요. 그러고 싶었지만, 그렇지 못했죠."
10046080-223 = "결국, 나기사는 아주 오랫동안 마차를 끌어야 했습니다. 공주가 성에 도착할 때까지, 이야기가 해피 엔딩으로 끝맺어질 때까지, 줄곧 홀로."
10046080-224 = "……마차는 이미 도착했는데, 말은 본모습을 잊고 말았네요."
10046080-225 = "이것은 어떤 의미로는 속죄입니다. 알고 있습니다. 이런 방식이 궁극적인 해결책이 될 수 없다는 것쯤은요."
10046080-226 = "그래도 이렇게, 어쩌다 한 번만이라도, '본래의 나기사'를 보지 못하면, 언젠가 영원히 사라지고 말 것처럼 불안해지고 마는 것입니다."
10046080-227 = "……이래서야 나기사가 편집적이라 탓할 처지가 아니군요."
10046080-228 = "네, 한여름 밤에 듣기에는 지나치게 무거운 이야기죠. 그래서 가급적 말씀드리고 싶지 않았습니다."
10046080-229 = "하지만, 이제는 숨길 이유도, 여지도 없어지고 말았네요."
10046080-230 = "[s5] \"혹시 나기사한테는 물어봤어?\"\n[s6] \"지금 생활이 싫은지 말이야.\""
10046080-235 = "……농담하시는 걸까요? 아니요. 묻지 않았습니다. 엄밀히 따지면, 그럴 수 없었죠. 사람은 수치심을 아는 동물이기에."
10046080-236 = "[s] \"그렇다면 괜찮을 거야.\""
10046080-237 = "꽤나 단언하시는군요. 그렇게까지 확언하시는 근거는 무엇일까요?"
10046080-238 = "[s7] \"비밀이야.\"\n[s8] \"스포일러는 좋지 않으니까.\""
10046080-241 = "……!"
10046080-242 = "후후, 당했군요. 네, 제가 말했었죠. 뭐든지 미리 아는 것은 지루하다, 라고."
10046080-243 = "달리 말하면 그것은, 기대할 만한 가치가 있는 이야기, 라는 뜻이 됩니다. 선생님께서는 그리 말씀하시는 거군요."
10046080-244 = "[s9] \"그럴지도, 아닐지도? 그야 나기사의 변화는…….\"\n[s10] \"아주 특별한 동시에, 아주 평범한 일이거든.\""
10046080-247 = "……점점 수수께끼처럼 되는군요. 이러한 역할은 본래 제 것인데 말이죠."
10046080-248 = "지금 듣는 것은…… 네, 압니다. 스포일러 금지, 라는 것이겠죠."
10046080-249 = "그렇지만, 후후, 선생님께서 보증해주신 만큼, 그 대답을 아는 날을 즐겁게 기다릴 수 있겠군요."
10046080-255 = "잠깐, 세이아 쨩! 빨리 와 봐!"
10046080-256 = "나기 쨩 진짜 미쳤어! 3연속으로 조커를 뽑았다니까?!"
10046080-257 = "후후후, 미카…… 제가 한때 천사의 오른손이라 불렸던 사실을 잊었나요?"
10046080-261 = "……이런, 바깥이 소란스럽군요."
10046080-262 = "꽤 즐거워 보이네요."
10046080-263 = "그러면 저도 이만 가보겠습니다."
10046080-267 = "세이아 쨩! 늦어!"
10046080-268 = "호오, 세이아 씨를 끌어들이는 건가요? 그렇다 해도 제 우위에는 변함이 없습니다."
10046080-271 = "다들 여전히 고리타분한 유흥을 즐기고 계시는군요."
10046080-275 = "뭐야, 그 잘난 말투는?"
10046080-276 = "후후. 카드놀이도 좋지만, 좀 더 신선한 유흥은 어떨까요?"
10046080-280 = "아마 두 분께서는 초견이겠지만, 이것은 게임기라는 것입니다."
10046080-281 = "나, 나도 비디오 게임 정도는 알 거든?! 그치, 나기 쨩?"
10046080-286 = "무, 물론이죠! 그, 여러 학우분들께서 즐기고 계시는 실내 여가 활동이지요?"
10046080-287 = "그나저나 드문 일이군요. 세이아 씨가 그런 물건을 꺼내 올 줄이야."
10046080-289 = "밀레니엄 사이언스 스쿨과의 교류회에서 저의…… 네, 친구가 선물해 준 것입니다."
10046080-290 = "응? 세이아 쨩, 우리 말고 친구 없잖아."
10046080-294 = "네? 제 귀가 어떻게 된 걸까요? 교우 관계라면 제가 미카보다 월등히 나은 상황일 텐데요."
10046080-295 = "헤에? 그런 세이아 쨩은 어째서 휴일에도 항상 집에만 있는 걸까?"
10046080-296 = "일정을 안 만드는 것과, 못 만드는 것 사이에는 하늘과 땅만큼의 차이가 있답니다."
10046080-301 = "재밌는 얘기들을 하고 계시는군요. 교우 관계라고 하면 저 역시……."
10046080-306 = "나기 쨩은…… 미안한데, 빠져줘."
10046080-307 = "죄송하지만, 나기사는 논외입니다."
10046080-311 = "네?!"
10046080-316 = "왜 저만 이런 취급이죠?! 저도 있다고요, 친구! 많다고요!"
10046080-317 = "아, 혹시 그, 나기사 님이라고 부르는 그 아이들……?"
10046080-318 = "나기사, 그런 관계는 보통 친구라 부르지 않습니다. 추종자라고 부르죠."
10046080-319 = "우와, 세이아 쨩. 독설……."
10046080-320 = "슬슬 나기사도 현실을 볼 때가 되었으니까요."
