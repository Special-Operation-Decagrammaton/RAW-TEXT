[translation]
62050-1 = "제5화;아리우스 바실리카"
62050-7 = "선배, [ruby=바실리카]대성전[/ruby]으로 우리 모두를 모으시다니……"
62050-8 = "여긴 그날 이후, 좀처럼 사용되지 않았던 곳인데……."
62050-13 = "아리우스 바실리카……"
62050-14 = "우리의 원래 채플에서 추방당한 다음……."
62050-16 = "여기, 버려졌던 이 채플 건물을 그 대신으로 삼았다고 했지. 그리고 이런 [ruby=바실리카]이름[/ruby]을 붙였고."
62050-17 = "그것도 마담이 사라진 그날 이후, 사용하지 않고 있었지만……."
62050-22 = "……잘, 모르겠네."
62050-23 = "여긴 이제, 우리에게 어떤 장소일까."
62050-24 = "……선배가 우리를 다시 여기로 모이라고 한 것은, 또……."
62050-30 = "모두, 모이셨나요?"
62050-36 = "……불안해 보이시네요, 다들."
62050-37 = "당연한 일입니다. 저도 그렇거든요."
62050-38 = "우선 한 가지 확인하고 싶은 것이 있습니다. 괜찮겠지요?"
62050-39 = "제가 알고 있는 것이 맞다면, 여기에 계신 모든 분은 오늘……."
62050-45 = "……'경전'의 <계시록>에 기록된 목소리를, 들으셨을 겁니다."
62050-46 = "혹시 듣지 못했던 분이 계신가요? 괜찮습니다. 부담 없이 이야기해 주세요."
62050-52 = "알겠습니다. 없군요. 그렇다면 역시 그 목소리는 모두에게 들렸던 것이 맞는 듯합니다."
62050-53 = "하지만 아직 저는…… 그 목소리가, <계시록> 그대로를 의미하는 것인지는 확신할 수 없습니다."
62050-54 = "네……? 어째서요? 그렇게 확실하게…… 모두에게 들렸는데……?"
62050-55 = "계시록에는 또 이렇게 쓰여 있죠."
62050-56 = "<내가 또 보고 들으니, 공중에 날아가는 독수리가 큰 소리로 이르되.>"
62050-57 = "<땅에 거하는 자들에게 화, 화, 화가 있으리로다.>"
62050-58 = "<이 외에도 세 천사의 불 나팔소리를 인함이로다, 하더라.>"
62050-59 = "제가 확신할 수 없다고 말씀드리는 것은…… 전반부입니다. 공중에 날아가는 독수리 말이죠."
62050-60 = "저는 계속 확인해 보았습니다만, 독수리는커녕 새 비슷한 것도 보이지 않았어요."
62050-61 = "혹시 독수리나…… 새 비슷한 것을 목격하신 분, 계신가요?"
62050-65 = "예. 이것도 없군요. 잘 알겠습니다. 그리고 또 하나 확신하지 못하겠다고 말씀드릴 수밖에 없는 부분이 있습니다."
62050-66 = "……나팔 소리는 모두 일곱 번 들려야 합니다. 그렇지요?"
62050-67 = "그건……. 그래요."
62050-68 = "그리고 오늘 들었던 목소리에 따르면, 이미 네 번의 나팔 소리가 들려야 했습니다. 이것도 맞지요?"
62050-69 = "네……. 맞아요."
62050-70 = "……하지만 저는, 지금까지 한 번도 나팔 소리를 듣지 못했습니다. 여러분은 어떠신가요?"
62050-75 = "저는, 들렸는데요……?"
62050-76 = "저는 안 들렸어요!"
62050-77 = "무슨 소리야 그렇게 큰 소리를 어떻게 못 들어!"
62050-78 = "저, 전에도 이야기했잖아. 네가 잘못 들은 거 아니냐고……."
62050-79 = "하지만 그 목소리는 모두 들었잖아!"
62050-86 = "자, 자. 알겠습니다. 그러면……."
62050-87 = "……."
62050-88 = "여러분? 지금부터 하려는 일에는, 아무런 의미도 없어요. 그러니까 안심해 주세요."
62050-89 = "나팔 소리를 들은 분들은 왼쪽으로, 듣지 못한 분들은 오른쪽으로 나누어 서 주시겠어요?"
62050-105 = "(나팔 소리가 들린 쪽의 숫자가…… 명백히 적군요.)"
62050-109 = "(어라? 그리고 보니 그 밖에도 또 다른 공통점이 있는 것 같은데……?)"
62050-110 = "네. 좋습니다. 감사합니다."
62050-111 = "그리고 이제부터는 제가, 이번 현상에 대해 생각한 결론을, 여러분 모두와 공유하고자 합니다."
62050-118 = "저는 우리가, <포르타 파시스>로 향해, 이번 일에 대한 것들을 조사해 보아야 한다고 생각합니다."
62050-123 = "포르타 파시스?! 선배, 진심인 걸까……?"
62050-124 = "선배는 항상 진심이었어……. 특히 이런 일에는……."
62050-126 = "하지만 거기는, 마담조차도 출입을 금지했던 곳이었잖아……?"
62050-127 = "……그렇지만 마담은 이제 없지."
62050-128 = "마담이 했던 말들이, 다 맞는 것도 아니었고……."
62050-130 = "그렇지만……."
62050-132 = "여러분의 불안도 알고 있습니다."
62050-133 = "하지만 이 일에 대한 단서를 얻을 수 있는 곳은, 적어도 아리우스에는 포르타 파시스밖에 없다는 것도 명백한 사실입니다."
62050-134 = "……어쨌든 그곳에는, 아리우스의 거의 모든 역사와, 경전에 대한 수많은 해석이 보존되어 오고 있었으니까요."
62050-135 = "하, 하지만 포르타 파시스에 함부로 들어가게 되면……."
62050-136 = "……네."
62050-137 = "자격이 없는 자, 신실하지 못한 자, 믿음을 잃은 자가 들어간다면……"
62050-138 = "그 끝에서 자신에 대한 것을 잃어버리고, 아리우스를 영원히 떠돌게 된다고 했죠."
62050-142 = "하지만, 저는 이 현상에 대해…… 우리가, 대응 방법을 찾아야 한다고 생각합니다."
62050-143 = "……아리우스는, 예전부터."
62050-144 = "'인간의 지혜로 이해할 수 없는 일'이 일어나곤 하는 땅이었으니까요."
62050-147 = "진실로부터 눈을 돌리고, 우리를 '없던 것'으로 만들어, 자신들의 치부를 감추려 했던."
62050-148 = "저 부도덕한 트리니티와는 다르게 말이에요."
62050-151 = "아직은 추측의 단계입니다만, 오늘 계시록의 내용이 발현된 것 역시, 트리니티와……."
62050-152 = "샬레의, '선생님' 때문인지도 모릅니다."
62050-154 = "서, 선생님이요?! 트리니티는 그렇다 쳐도, 선생님……."
62050-155 = "선생님, 좋은 분 같았는데……."
62050-156 = "네. 선생님은 좋은 분이라고 볼 수 있을 겁니다. 그 부분은 저도 인정해요."
62050-157 = "……하지만, 선의가 언제나 좋은 결과를 낳는 것은 아니죠. 저도 여러분도…… 그 사실은 잘 알고 있잖아요?"
62050-158 = "……."
62050-159 = "이러니저러니 해도, 구호기사단의 활동으로, 결국 아리우스에 트리니티가 다시 발을 들인 셈이었고."
62050-160 = "그 사실이 확인된 직후, 계시록은 발현되었으니까요."
62050-161 = "즉, 트리니티를 다시 아리우스로 불러들인 것이 선생님이라는 것을 생각한다면."
62050-162 = "역시 이번 일은, 트리니티, 나아가 선생님에게 그 원인이 있을 수밖에 없다는 것이 제 생각입니다."
62050-168 = "그건…… 그래……."
62050-169 = "선생님이, 공부니 시험이니 뭐니 하는 것으로 괜한 일을 벌이지 않았어도……."
62050-170 = "우리는, 우리 나름대로 어떻게든 살아갈 수 있었을 텐데."
62050-171 = "애초에 공부라니, 그거 뭐야. 의미가 있기는 해?"
62050-172 = "괜히 어렵고 이해 안 가고 졸리기나 하고."
62050-173 = "시간 낭비야. 아깝다니까."
62050-174 = "……사실 그 시간에 달리 뭘 할 게 있는 것도 아니긴 한데, 아무튼."
62050-176 = "(이쪽은…… 나팔 소리가 들리지 않은 쪽이군요.)"
62050-181 = "하지만…… 나는 공부하는 거, 나름 나쁘지 않았는데……?"
62050-182 = "그러게. 바깥이 어떻게 되어 있는지, 알 수도 있었고……."
62050-183 = "……사람 다치게 하는 방법 연습하는 것보다야……."
62050-184 = "공부 내용은 솔직히 잘 몰랐지만……"
62050-185 = "솔직히 재미없고, 지루하고, 그냥 자고 싶었던 것도 사실이었지만……."
62050-186 = "그냥…… 좋았어. 내 이야기를 누군가 잘 들어주고, 내 말을 할 수 있다는 게……."
62050-192 = "(이쪽은 나팔 소리가 들린 쪽……?)"
62050-196 = "(가만……?!)"
62050-197 = "(아뇨. 아직은 조금 더 두고 보도록 하죠…….)"
62050-201 = "그런데, 여러분."
62050-202 = "만에 하나, 천사들이 일곱 개의 나팔을 전부 불게 되면 무슨 일이 일어날까요?"
62050-204 = "네? 그, 그건……!"
62050-205 = "설마……?"
62050-207 = "하지만 계시록에서는……."
62050-208 = "우리는 특히 계시록을 더 많이 연구해 왔으니까……. 그렇다는 것은……."
62050-213 = "……아리우스의, 멸망……?"
62050-216 = "……."
62050-217 = "그렇겠지요. 경전 대로라면 어쨌든, 세상이 멸망하기 시작할 테니까요."
62050-218 = "아리우스는 단지 그 시작을 알리는 장소가 된 것뿐이고요."
62050-219 = "순서를 따르자면, 다음은 대접을 쏟는 일곱 천사의 차례이려나요."
62050-221 = "어, 어어어어어, 어떡하죠?!?!"
62050-222 = "그, 그러게?! 지금이라도, 지금이라도……."
62050-226 = "!!!"
62050-227 = "아리우스를 '정화'해야 해!"
62050-228 = "정화? 그게 무슨……."
62050-229 = "!!!"
62050-230 = "맞아! 선생님도 스쿼드도…… 모두, 아리우스 바깥으로 몰아내야 해!"
62050-231 = "그, 그러면 공부는? 시험은……?"
62050-232 = "뭐야? 너도 그쪽이야? 지금 그런 게 중요해?!"
62050-233 = "우리가 큰일 나게 생겼잖아! 다른 사정 같은 거 알 게 뭐야!"
62050-235 = "네. 그렇습니다. 이와 같은 상황에서, 저는 여러분의 의견을 구하고자 했습니다."
62050-236 = "그래서 그동안 사용되지 않았던…… 여기, 아리우스 바실리카의 문을 다시 연 것이고요."
62050-237 = "이곳은 쫓겨난 우리들의 거짓 채플이었고, 마담에 의해 왜곡된 채플이 되기도 했지만……."
62050-238 = "……그래도 쭉, 아리우스의 채플로 사용되었던 곳이니까요."
62050-239 = "다시 우리들의 아리우스로 돌아가야 해요!"
62050-240 = "아직은 나팔 소리가 세 번 남았다고 했죠?"
62050-241 = "하, 하지만 우리는 그걸 못 들었는데……?"
62050-242 = "모두 정화하면, 더 이상 들리지 않을 테니까 그런 거 신경 쓸 필요도 없어!"
62050-244 = "하, 하지만……."
62050-245 = "(나는 복습도 하고 있었는데…….)"
62050-246 = "(딱 하루 수업하고 끝인 거야? 그건 너무…… 조금 그런데…….)"
62050-251 = "어, 어쩌면 이 모든 게…… 트리니티와 선생님 때문이, 아닐 수도 있지 않을까요……?"
62050-256 = "뭐야?"
62050-257 = "누구야! 대체 뭔데?!"
62050-258 = "저 애는……?"
62050-265 = "……이야기해 주시겠어요?"
62050-266 = "네, 네에. 저도…… 이건 그냥, 제 생각일 뿐이지만요……."
62050-267 = "꼬, 꼭 계시록에 적힌 일이, 그대로 일어날 거라는 보장은…… 없잖아요?"
62050-269 = "!!!!!"
62050-270 = "뭐야, 저 애……?"
62050-271 = "시, 신성 모독이야……!"
62050-273 = "………어째서 그렇게 생각하나요?"
62050-275 = "하, 하지만 역시 독수리 모습도 보이지 않았고."
62050-276 = "거기에 나팔 소리가 한 번 들릴 때마다, 끔찍한 재앙이 일어난다고 했는데……."
62050-277 = "특별히, 그런 낌새도 보이지 않았고……."
62050-279 = "웃기지 마!"
62050-280 = "트리니티가 여기에 발을 들인 것 자체가 재앙이라고!"
62050-281 = "생각해 보면 선생님도 그래!"
62050-282 = "스쿼드도!"
62050-283 = "그래, 스쿼드!"
62050-284 = "……솔직히 트리니티 녀석들보다, 스쿼드가 더 싫어……."
62050-285 = "맞아……. 자기들은 이제 뭐 다 된 것마냥, 모두 알고 있는 것처럼 굴고……!"
62050-286 = "애초에 그 녀석들, 아리우스로부터 도망쳤던 거잖아!!!"
62050-289 = "그 녀석들은 할 수 있었어!"
62050-290 = "그 녀석들은 가능했다고!"
62050-293 = "스쿼드였으면 우리를 이끄는 것도 무리가 아니었을 거란 말이야!"
62050-294 = "로열 블러드라고 했던 주제에!!!"
62050-297 = "왜 그랬던 거야, 사오리 선배……. 왜 가버린 거야……."
62050-298 = "왜…… 우리에게서 도망쳤던 거야. 어째서……."
62050-299 = "선배를 동경했던 아이도, 정말 많았는데……!"
62050-302 = "헛되기는, 뭐가 헛되다고……."
62050-303 = "너도, 여기에 있었잖아. 우리와 같았잖아……."
62050-304 = "이제 와서 구원받은 척이나 하고, 혼자서, 혼자서……!"
62050-309 = "……"
62050-310 = "………"
62050-311 = "…………"
62050-312 = "그 아이들을 보고 있으면, 나도 모르게 이런 생각을 하게 되지."
62050-313 = "이대로 괜찮은 걸까. 이렇게 살아도 되는 걸까."
62050-314 = "내 남은 인생은…… 도대체, 어떻게 되는 걸까……."
62050-319 = "아아, 사실은"
62050-320 = "[ruby=우리들도]나도[/ruby], 그렇게."
62050-321 = "지금과는 다른 무언가를, 살아 보고 싶었어."
62050-324 = "그렇지만, 그런 건."
62050-325 = "이제, 불가능하니까……!"
62050-329 = "할 수 있어요!!!"
62050-330 = "!!!!!"
62050-331 = "할 수 있을 거예요! 분명…… 아, 아뇨. 어쩌면, 요……."
62050-332 = "……어떻게?"
62050-333 = "그건, 선생님께 물어보면……."
62050-334 = "저, 저는 정확히 잘 모르지만, 선생님은 분명, 우리가 모르는 걸 알고 있을 테니까요!"
62050-340 = "……."
62050-341 = "또 선생님이야?"
62050-342 = "선생님, 선생님. 이젠 지겨워!"
62050-343 = "선생님이 무슨 신이라도 돼? 그냥 그 사람만 믿고 따르면, 모든 문제가 해결되고 천국이 찾아오기라도 한다는 거야?"
62050-348 = "그럴 리가 없잖아!!!!!"
62050-349 = "너, 가만 보니 조금 전부터. 너무 그쪽 편만 드는 거 아냐?"
