[translation]
1001605-1 = "초회한정판이에요. 선생님."
1001605-2 = "밀레니엄 전자상가 하루하바라"
1001605-3 = "(사전에 미도리와 약속한 장소로 나가자, 그곳은 그야말로 발 디딜 틈 하나 없이 수많은 인파로 북적이고 있었다.)"
1001605-4 = "[ns1] \"와, 사람 정말 많네.\"\n[ns2] \"게임을 사랑하는 사람이 이렇게나 한가득…….\""
1001605-5 = "선생님! 주의해주세요! 멍하니 있다간 미아가 되어버리니까요!"
1001605-6 = "선생님! 주의해주세요! 멍하니 있다간 미아가 되어버리니까요!"
1001605-7 = "[s3] \"대체, 이게 어떻게 된 일이야?\"\n[s4] \"단순한 게임 판매가 아닌 거야?\""
1001605-8 = "이번에 발매된 신작 게임을 단순한 신작이라고 생각하지 마세요."
1001605-9 = "이번에 발매된 신작 게임을 단순한 신작이라고 생각하지 마세요."
1001605-10 = "무려 십여 년이나 전에 나왔던 전설적인 명작이자, 당시 평론 사이트에서도 심사위원 전원이 만점을 준 걸로 유명한 게임."
1001605-11 = "젤나의 전설 신작이니까요!"
1001605-12 = "수많은 게이머는 물론 컬렉터까지 포함해. 이번 초회한정판 특전을 노릴 게 분명해요."
1001605-13 = "우리는 여기서 그 사냥감을 쟁취해내기 위한 사냥꾼……."
1001605-14 = "아니, 전사가 되어 싸움에 임해야만 해요!"
1001605-15 = "[s] \"어째, 점점 더 게임을 사러 온 게 아닌 듯한…….\""
1001605-16 = "게임 판매 개시 시간은 지금으로부터 1시간 뒤."
1001605-17 = "물리적으로 방문할 수 있는 가게의 개수가 한정 되어있는 이상, 어떤 루트로 매장을 돌지 전략적으로 판단할 필요가 있어요."
1001605-18 = "[s] \"미도리는 이미 계획이 다 있구나.\""
1001605-19 = "당연하죠. 오늘만을 기다려왔으니까요!"
1001605-20 = "자, 이럴 때가 아니에요. 선생님! 퀘스트를 시작하죠!"
1001605-22 = "정석적인 관점에서 접근해 보자면, 가장 먼저 택한 곳은 바로 이곳. 대형마트예요."
1001605-23 = "가장 규모가 큰 만큼, 가장 많은 물량이 입하되는 이곳에서 물건을 구할 수 있다면 제일 베스트……!"
1001605-24 = "[ns] \"앗, 근데 미도리 이것 봐.\""
1001605-28 = "품절…… 알림?"
1001605-29 = "'오늘 입하 예정인 젤나의 전설 신작은 모두 판매되었습니다.'?"
1001605-30 = "프, 프, 플라잉 겟~?!"
1001605-31 = "판매 시작도 전에 모두 팔려버린 건가요?!"
1001605-32 = "[s5] \"여긴 없나 보네\"\n[s6] \"분명 많은 사람들도 정석적으로 생각했겠지.\""
1001605-33 = "이건 신고감이에요! 아니, 그보다 여기 없으면 얼른 다른 곳을 찾아봐야 해요!"
1001605-34 = "이건 신고감이에요! 아니, 그보다 여기 없으면 얼른 다른 곳을 찾아봐야 해요!"
1001605-35 = "선생님! 달려요!"
1001605-47 = "허억. 허억. 아, 아무데도 없다니……."
1001605-48 = "[s] \"이래서야 초회한정판은 포기할 수밖에…….\""
1001605-49 = "아니요. 그럴 수 없어요. 오늘이 오기만을 손꼽아 기다렸는데!"
1001605-50 = "이렇게 포기할 순 없어요."
1001605-51 = "마지막으로 딱 한 군데만……!"
1001605-53 = "여기가 마지막이에요. 여기에도 없으면……."
1001605-54 = "어."
1001605-55 = "서, 선생님. 여기 있어요! 신작 젤나의 전설 초회한정판!"
1001605-56 = "[s7] \"다행이다.\"\n[s8] \"그럼 그것만 사면 전부 끝나는…….\""
1001605-57 = "앗, 찾았다! 젤나의 전설 게임! 딱 하나 남았어!"
1001605-58 = "앗, 찾았다! 젤나의 전설 게임! 딱 하나 남았어!"
1001605-59 = "아……."
1001605-60 = "[s] \"미도리.\""
1001605-62 = "으응……. 뭐어."
1001605-63 = "아저씨! 이거 주세요!"
1001605-64 = "[s9] \"괜찮겠어?\"\n[s10] \"미도리도 하루종일 찾아다녔잖아.\""
1001605-65 = "네에, 저도 꼭 해보고 싶다고 생각은 했지만……."
1001605-66 = "네에, 저도 꼭 해보고 싶다고 생각은 했지만……."
1001605-67 = "게임이란 건, 많은 사람들이 하면 즐거운 거잖아요?"
1001605-68 = "그러니까 전 괜찮아요. 선생님."
1001605-71 = "(어른스러운 척 했지만, 역시 해보고 싶었어! 으아아앙……!)"
1001605-73 = "(다음 날. 선물을 가지고 게임개발부 부실을 찾았다.)"
1001605-74 = "응? 선생님, 어쩐 일이세요?"
1001605-75 = "[s] \"미도리, 여기 선물.\""
1001605-76 = "이건……."
1001605-77 = "젤나의 전설, 초회한정판……!"
1001605-78 = "이, 이걸 어떻게?"
1001605-79 = "[s11] \"미도리를 위해서 어제 밤새도록.\"\n[s12] \"매장을 돌아다녔더니 찾을 수 있었어.\""
1001605-82 = "[s] \"이게 바로 어른의 힘이지.\""
1001605-83 = "이것이 철야가 가능한 어른……!"
1001605-84 = "……선생님이, 날 위해……."
1001605-85 = "[s] \"미도리?\""
1001605-86 = "으응, 아무것도 아니에요. 선생님."
1001605-87 = "정말 기뻐요. 선물, 감사합니다. 선생님!"
