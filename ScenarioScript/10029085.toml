[translation]
10029085-1 = "제8화;추억은 마음속에서"
10029085-13 = "아직……. 일까나?"
10029085-14 = "이런 말 하고 싶지는 않지만……. 슬슬 이쪽도 버티기 힘들어지는데……?"
10029085-15 = "쇼쿠호……!?"
10029085-16 = "조금만……!"
10029085-17 = "……다 됐어!"
10029085-18 = "좋아. 칩도 넣었고, 연결부도 모두 맞췄어. 이제 작동만 시키면 돼."
10029085-19 = "오래 기다리셨습니다!! 그럼 '설비'를……!!"
10029085-20 = "가동하겠습니다!!"
10029085-25 = "……!"
10029085-26 = "……!"
10029085-27 = "……!!"
10029085-28 = "……!"
10029085-29 = "[ns1] \"뭔가 가동한다……!\"\n[ns2] \"소리가 전과는 달라……!\""
10029085-33 = "……!?"
10029085-34 = "뭐, 뭐야!? 이건……! 또 빛이……!!"
10029085-35 = "……헉!?"
10029085-41 = "……무, 무슨……!?"
10029085-47 = "으에에에에……!?"
10029085-53 = "빛이……. 이건……!!"
10029085-54 = "……성공이야. '설비'가 불러온 순차대로 다시 원상 복귀시키기 시작했어."
10029085-55 = "저 기능으로 인해 이곳으로 불려 왔던 모든 사람들이 원래 있던 곳으로 돌아갈 거야."
10029085-56 = "……오……. 우리, 진짜 성공한 거야?"
10029085-57 = "후후. 그러네. 솔직히 진짜로 될 거라고 생각하며 달려든 수리는 아니었는데……."
10029085-58 = "원래 시간제한이 있어야 일도 잘되는 법이지요! 시간 지각적으로도 맞는 이야기!!"
10029085-59 = "참고로 시간지각이라는 건 사람이 자신의 감각 기관과 뇌의 작용을 통해 시간을 심리적으로 느끼는 것으로, 다른 지각과는 달리 감각보다 정보의 종합량에 의한……."
10029085-61 = "그럼 이제 다 된 건가……? 우리도 돌아가는 거야?"
10029085-62 = "그런 것 치고는 아직 아무런 느낌이 없는데요……."
10029085-64 = "……무시!?"
10029085-66 = "확실히, 적응력이 좋네."
10029085-67 = "문제는 없어. 말했듯이 순서에 따른 문제일 뿐이니까. 가장 먼저 온 사람이, 가장 늦게 가는 것일 뿐."
10029085-68 = "부장이 말했던 대로, 돌아가고 나면 돌아오기 직전의 시간으로 돌아가게 돼. 기억 역시 전혀 남아 있지 않지."
10029085-69 = "지금 들고 있는 총도……."
10029085-70 = "……아."
10029085-71 = "이거요……? 결국 못 가져가는 거군요……?"
10029085-72 = "응. 그것도 결국 '설비가 불러온 것'이 아니니까. 그대로 여기에 남게 되겠지."
10029085-73 = "으음……. 그렇게 되나요……."
10029085-74 = "……조금 아쉽네요. 기념품이라도 챙길 수 있으면 좋았을 텐데."
10029085-75 = "그래서 말했잖아. 이곳에서 있었던 일은 딱히 의미가 없을 거라고. 기억도 없고 증거도 없어."
10029085-76 = "아니, 애초에 그쪽에선 존재하지 않았던 일이라고."
10029085-77 = "하하……. 그, 그렇긴 하죠……."
10029085-81 = "……뭐어……."
10029085-82 = "그래도 괜찮지 않을까요? ……재밌었으니까요!!"
10029085-83 = "……?"
10029085-84 = "……뭐?"
10029085-85 = "기억이 없다고 해서 여기 다녀간 게 없어지는 건 아니잖아요? 실제로 선생님과 에이미 씨의 기억에도 남아 있을 거고……."
10029085-86 = "무, 물론 저희와의 며칠이 에이미 씨에게 재밌었는지 귀찮았는지는 확신이 없지만요! 하하! 하하하……!"
10029085-87 = "……아!"
10029085-88 = "맞아. 그럼 말 나온 김에 이것도 좀……. 괜찮을까요?"
10029085-94 = "이건……."
10029085-95 = "보관 정도는……. 부탁드려도 괜찮겠죠?"
10029085-96 = "'잘 놀다 갔다'라는 의미로!"
10029085-97 = "……'잘 놀다 갔다'……? 나야 상관은 없지만……."
10029085-98 = "[s3] \"물론이지. 잘 간직할게.\"\n[s4] \"즐거웠던 것 같아 다행이네.\""
10029085-101 = "선생님……?"
10029085-102 = "……!!"
10029085-103 = "감사합니다, 선생님!!"
10029085-107 = "솔직히 아직은 잘 모르겠지만, 알았어. 일단 그렇게 할게."
10029085-108 = "고마워요, 에이미 씨!!"
10029085-109 = "미사카 씨랑 쇼쿠호 씨도 어때요? 어차피 여기 버려질 거, 모두 맡기고 가죠!!"
10029085-110 = "이것도 나름대로 '이세계에 남기는 흔적'이라고요! 좋잖아요?"
10029085-112 = "그…… 말은 좋지만 결국 짐짝 떠넘기는 거 아닌가……."
10029085-113 = "……하아."
10029085-114 = "뭐, 괜찮겠지. 이 정도 맡아 달라고 하는 게 큰 폐가 될 거 같지는 않고."
10029085-115 = "그러네. 오히려 평소보다 속은 더 편안한 며칠이었고……. 부외자라는거, 가끔은 나쁘지 않을지도."
10029085-116 = "……마지막엔 결국 조금 머리도 아프게 했지만 말이야."
10029085-122 = "……으음……."
10029085-123 = "기억하지도 못하고 증거도 없지만……. 의미가 없진 않다……라."
10029085-124 = "[s5] \"그런 것도 있는 법이지.\"\n[s6] \"원래 기억 안 나는 게 진짜 잘 놀았단 뜻이야.\""
10029085-127 = "……역시 잘 모르겠어."
10029085-128 = "그렇지만 선생님도 그렇게 말했으니까. 나중에는 무슨 뜻인지 알게 될지도 모르지."
10029085-129 = "그 가능성을 생각해서라도, 그때까지는……."
10029085-130 = "이것들 모두, 안전하게 보관해 두고 있을게."
10029085-131 = "……후후! 좋네요!!"
10029085-132 = "그러면……."
10029085-133 = "앗, 빛이……."
10029085-134 = "[s7] \"차례가 왔나 보네.\"\n[s8] \"슬슬 작별인가.\""
10029085-137 = "그런가 보네요! 히히……. 먼저 갈게요!"
10029085-138 = "엔지니어 부 여러분들도! 정말 너무 감사했습니다!!"
10029085-144 = "그럼 진짜로……!"
10029085-145 = "잘 놀다가 갑니다!!"
10029085-151 = "그럼 나도 이만-."
10029085-157 = "……잘 있어."
10029085-158 = "[s9] \"잘 지내. 미사카.\"\n[s10] \"조심히 들어가~.\""
10029085-167 = "……다 갔나?"
10029085-168 = "조금 전까지 있었던 소란스러움이 민망할 정도로 조용해졌네."
10029085-169 = "우리와 설비……밖에 남지 않았으니까."
10029085-170 = "말소리가 울릴 정도예요! 이쯤 되니 오히려 실감이 잘 안 가네요!"
10029085-172 = "설비는……."
10029085-178 = "……음?"
10029085-180 = "이 소리는……."
10029085-181 = "[s11] \"설비에서 이상한 소리가…….\"\n[s12] \"방금 뭔가 찢어지는 소리가……?\""
10029085-184 = "……아."
10029085-185 = "설비가 오작동으로 폭주하기 시작했어. 이대로라면 금방 폭발해 일대가 무너질 거야."
10029085-186 = "과연, 그렇겠네. 갑자기 그렇게나 많은 작동 횟수를, 그것도 역 가동으로 시행했으니……."
10029085-187 = "……? 잠깐만. 지금 뭐라고……."
10029085-188 = "일대가……."
10029085-189 = "……무너진……다고요?"
10029085-190 = "[s13] \"……예?\"\n[s14] \"큰일 아냐, 그거?\""
10029085-193 = "맞아. 지금 당장 달려서 이곳을 빠져나가야 해."
10029085-194 = "……우리가 이동할 순 없냐고?"
10029085-195 = "아니. 설비는 역가동으로 맞춰져 있기에 '되돌리는 것'밖에 할 수 없어. 어딘가로 뭔가를 보내는 건 불가능하지."
10029085-196 = "서두를게. 모두 뒤를 따라와 줘."
10029085-197 = "방금 전까지 즐거웠다며 인사를 나눴는데!! 지금 이쪽 상황은 썩 즐거운 게 아니네요!?"
10029085-198 = "[s15] \"뭐 우린 놀러 온 게 아니었으니…….\"\n[s16] \"말은 나중에!! 일단 뛰어!!\""
10029085-201 = "히이이이이-!!!"
10029085-214 = "(이후 죽을 듯이 달려 무너지는 설비에서 모두 안전하게 빠져나왔다.)"
10029085-218 = "(무사히 밀레니엄으로 복귀한 뒤에는, 모두 녹초가 돼 쓰러지듯 주저앉았다…….)"
10029085-222 = "……후후."
10029085-223 = "나름대로 재밌는 며칠이었네요. 이런 일도 다 있고……."
10029085-224 = "선생님께서는 어떠셨을지 모르지만, 저로서는 점점 더 그곳의 가능성이 크게만 느껴진답니다."
10029085-225 = "이래서 제가 밀레니엄 폐허를 포기하지 못한다니까요."
10029085-227 = "어떤 과학의 청춘기록"
