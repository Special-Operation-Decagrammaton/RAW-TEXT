[translation]
83306105600-6 = "여기, 식권 찾았어."
83306105600-7 = "진짜?! 고마워!"
83306105600-8 = "잘됐군요. 준코 씨."
83306105600-9 = "히나 씨도 이렇게 도와주셔서 감사합니다."
83306105600-10 = "후훗…… 평소와 달리, 도움을 받게 된다니. 무척 신선한 느낌이네요."
83306105600-12 = "그래, 나도 제법 신선한 기분이야."
83306105600-13 = "과연, 그 또한 여자아이들의 우……"
83306105600-14 = "그런 것보다! 배고파! 식권도 찾았으니! 얼른 먹으러 가자!"
83306105600-19 = "앗! 기다려! 이즈미!"
