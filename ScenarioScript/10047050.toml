[translation]
10047050-1 = "제5화;험한 것이 나왔다"
10047050-2 = "(견학을 마치고 기숙사로 돌아왔다.)"
10047050-4 = "그럼 본격적인 소환에 앞서, 그에 어울리는 분위기를 만들어 보죠."
10047050-9 = "[ns] \"이, 이미 분위기는 충분한 느낌이긴 한데…….\""
10047050-10 = "선생님. 기숙사 괴담, 좋아하시나요?"
10047050-11 = "사실 이 기숙사에는 외부에 알려지지 않은 비밀 수칙이 몇 가지 있어요."
10047050-12 = "그 비밀 수칙 일부를 읽어보려 하는데, 들어보시겠나요?"
10047050-13 = "[ns] 고개를 끄덕인다."
10047050-14 = "후후, 그럼 시작할게요."
10047050-18 = "기숙사 특별 수칙 13호."
10047050-19 = "이 매뉴얼은 다른 규칙과 동일하게, 학원 학생들의 건전하고 안전한 기숙사 생활을 위해 작성된, 13번째 문서입니다."
10047050-20 = "특수한 상황에 대비한 문서이므로, 학생들은 아래의 수칙을 반드시 지켜 주시기 바랍니다."
10047050-26 = "1번. 1층 로비의 붉은색 전화기를 이용할 경우, 절대 6을 연속으로 누르면 안 됩니다."
10047050-27 = "와일드헌트 학원 내의 전화번호는 모두 6이 연속으로 들어가지 않습니다."
10047050-28 = "만약 6을 연속으로 눌렀을 경우, 재빨리 다락방으로 올라가 몸을 웅크리고 10분간 숨어 주세요."
10047050-29 = "누군가가 당신을 불러도 절대 대답하면 안 됩니다."
10047050-33 = "그 누군가는…… 절대로 당신이 알고 있는 사람이 아니니까요."
10047050-34 = "[ns] \"오…….\""
10047050-35 = "2번은 제가 읽어보죠!"
10047050-39 = "본 기숙사의 중앙 계단은 사감대 전용 계단으로, 일반 학생은 이용 자제를 부탁드립니다."
10047050-40 = "학생들의 원활한 통행을 위한 지침으로, 모든 학생의 협조를 바랍니다."
10047050-41 = "이 항목을 부정하는 다른 항목이 존재할 경우, 절대 따라서는 안 됩니다."
10047050-42 = "[s] \"이건 또 무슨 이야기지?\""
10047050-43 = "뉴후후, 글쎄요?"
10047050-44 = "진지하게 듣지 마. 그냥 대충 있어 보이게 말하는 것뿐이니까."
10047050-45 = "히히…… 그러면 3번은 레나 쨩이 읽어 볼래……?"
10047050-50 = "왜, 왜 내가?"
10047050-51 = "대충 있어 보이는 것뿐이라며……? 그럼 읽어도 문제없는 거 아냐……?"
10047050-52 = "칫, 또 놀리려 그러는 거지?"
10047050-53 = "좋아. 피하지 않겠어! 이 세상에 오컬트 따윈 없으니까!"
10047050-58 = "3번. 본 기숙사는 1년에 한 번씩 비상 대피 훈련을 실시합니다."
10047050-59 = "훈련은 비상시를 상정하고 있기 때문에, 기숙사 내의 일부 계단이 봉쇄됩니다."
10047050-60 = "그러므로, 기숙사생은 중앙 계단을 이용할 것 ……어라?"
10047050-61 = "[s1] \"그런데 2번 항목에서는…….\"\n[s2] \"중앙 계단 사용은 금지라고…….\""
10047050-66 = "레나 쨩…… 입학하고 얼마 지나지 않아 비상 대피 훈련했었지?"
10047050-67 = "했었지……?"
10047050-68 = "그때 어떤 계단을 이용했어……?"
10047050-69 = "분명 중앙 계단을……."
10047050-74 = "히히, 레나 쨩은 2번 항목을 어겼구나……"
10047050-75 = "앗…… 그러면 오늘 들은 원령의 목소리는, 그게 이유……?"
10047050-76 = "그, 그럴 리 없잖아?! 이상한 소리 하지 마!"
10047050-77 = "게다가 중앙 계단을 나만 쓴 것도 아니잖아!#n다른 애들도 듣지 못한 건 이상해!"
10047050-78 = "히히……"
10047050-79 = "그럼 내가 마지막 항목을 읽을게……."
10047050-83 = "4번…… 마지막으로―"
10047050-84 = "이 항목까지 모두 확인하셨다면…… 반드시 문서를 불태워 폐기해 주시기 바랍니다."
10047050-85 = "만약 이 문서의 폐기가 용이하지 않을 경우…… 1층 로비의 붉은색 전화기를 이용해 666번을 눌러주세요."
10047050-86 = "그럼 전문가가 찾아가 해당 문서의 폐기를 도울 것입니다……."
10047050-87 = "[s3] \"와일드헌트에 6이 연속되는 번호는 없다며?\"\n[s4] \"그럼 누가 찾아온다는 거지……?\""
10047050-92 = "와, 완전 엉터리네!"
10047050-93 = "이런 이상한 문서는 어디서 구해온 거야? 당장 버려!"
10047050-94 = "그냥 버리면 불길한 일이 일어날지 몰라요."
10047050-95 = "맞아…… 그러니까…… 태워서 없애자……."
10047050-96 = "겸사겸사 특별한 의식도 진행하면서……."
10047050-100 = "역시 처음부터 그게 목적이었냐!!"
10047050-102 = "뉴후후, 이걸로 분위기는 충분히 달아오른 것 같군요."
10047050-103 = "그런 이유로, 지금부터 본격적인 악마 소환 의식을 시작하겠습니다!"
10047050-104 = "마스터! 도와주실 거죠?"
10047050-108 = "거부권은…… 없어. 히히!"
10047050-109 = "[ns5] \"들어올 때는 마음대로지만…….\"\n[ns6] \"나갈 때는 아니라는 건가…….\""
10047050-112 = "자, 그럼 소환을 위해 마법진을 그리겠습니다!"
10047050-113 = "[s] \"어디에 그리려고?\""
10047050-114 = "마스터. 마스터는 혹시 4라는 숫자를 어떻게 생각하시나요?"
10047050-115 = "불길하고 꺼림칙하다 느끼지 않으시나요?"
10047050-116 = "그런 4가 가장 많이 들어간 기숙사 번호……."
10047050-117 = "네. 4동 404호가 바로 여기랍니다."
10047050-118 = "[s] \"6동 606호는 없어……?\""
10047050-119 = "아쉽게도요. 있으면 재미있었을 텐데."
10047050-120 = "아무튼 그런 이유로…… 이곳이 악마 소환에 가장 적합한 방인 거예요."
10047050-121 = "여기 이외의 장소는 생각해 볼 수도 없어요!"
10047050-122 = "뭐? 우리 기숙사 바닥에 그런 걸 그리겠다고?!"
10047050-123 = "뉴후후, 걱정 마세요. 안전하게 조합한 도료라 위험한 일은 일어나지 않으니."
10047050-124 = "그냥 살짝 펑, 하고 연기가 나는 것 정도일 거예요."
10047050-125 = "폭발까지 한다는 거잖아!!"
10047050-126 = "후후, 레나 쨩도 궁금하지 않나요?#n이런 곳에 악마를 소환하는 마법진을 그리면 어떤 일이 일어날지."
10047050-127 = "하나도 안 궁금하거든!"
10047050-128 = "나는…… 궁금한데……."
10047050-132 = "해보면…… 안 돼……?"
10047050-133 = "까악……"
10047050-134 = "애오옹……."
10047050-135 = "얘들까지 시무룩해하고 있어?!"
10047050-136 = "레나 쨩……."
10047050-137 = "으, 으으으으……!!"
10047050-142 = "아, 알았어! 해도 상관없으니까 나한테 피해만 오지 않게 해!"
10047050-143 = "내 물건 부서지면 무조건 손해배상 청구할 테니까!"
10047050-144 = "뉴후후, 감사해요! 역시 레나 쨩이에요!"
10047050-146 = "(그렇게 작업이 시작되었다…….)"
10047050-150 = "오…… 이 마법진은 나도 처음 보는데……? 어디서 배운 거야……?"
10047050-151 = "고대의 [ruby=이솝세피]수비학[/ruby]을 참고로 한, 독자적인 마법진이에요."
10047050-152 = "히히, 대단하잖아……?"
10047050-153 = "와아, 관련 지식이 없는 제가 봐도 정말 멋져요!"
10047050-154 = "옆에서 계속 부추기지 말라고!!"
10047050-156 = "(잠시 후…….)"
10047050-159 = "자, 이걸로 마법진이 완성됐습니다."
10047050-160 = "이제 주문을 외워 의식을 마무리하죠."
10047050-166 = "자, [ruby=Ph'nglui]판글루이[/ruby]…… [ruby=Mglw'nafh]매글루나프[/ruby]……."
10047050-167 = "잠깐! 스톱! 거기서 더 나가면 여러 가지로 위험할 것 같으니까 그만둬!"
10047050-168 = "안되나요? 그러면……."
10047050-173 = "아수라 발발타……!"
10047050-174 = "그걸로 악마 부를 수 있어?!"
10047050-175 = "레나 쨩…… 생각보다 여러 주문을 알고 있구나……."
10047050-176 = "아닌 척하면서 오컬트에 진심이었네요."
10047050-181 = "시, 시끄러워! 선배들이랑 있다 보면 알기 싫어도 알게 된다고!"
10047050-182 = "음, 그렇다면 유명한 주문 말고 저의 오리지널 주문을 외우죠."
10047050-186 = "아르카나의 인도에 따라 여명을 내다보는 자들이여."
10047050-187 = "빛의 여로에 의지해 내일을 갈구하는 운명이여."
10047050-188 = "그 염원을 그러모아 금단의 불꽃을 불러올지니, 내 부름에 응해 이 땅에 현현하라!"
10047050-193 = "깨어나라, 작렬의 종자―!!"
10047050-194 = "자, 작렬?! 그거……!"
10047050-198 = "오…… 살짝 연기만 일어날 줄 알았는데 이런 폭발이……?"
10047050-199 = "매일 훈련한 성과일까요……?!"
10047050-211 = "이 녀석들! 여기서 뭐 하는 거야!!"
10047050-213 = "아아앗……! 결국 <험한 것>이 나타난 건가……!"
10047050-214 = "[s] \"……'험한 것'이 사감대를 말하는 거였어?\""
10047050-215 = "우리 최대의…… 숙적이지."
10047050-216 = "후후, 성공의 앞에는 시련이 있는 법."
10047050-217 = "하지만 체념하지 마세요. 중요한 것은 도전하는—"
10047050-222 = "—'정신'."
10047050-223 = "……이니까요."
10047050-224 = "슬슬 포기해!"
10047050-225 = "아— 이젠 끝이야, 끝. 완전 망했어……."
10047050-226 = "오늘 미술관에서 소란을 피운 것도 너희들이지?"
10047050-228 = "얘들아! 이 녀석들 싹 다 잡아가!!"
10047050-235 = "[ns] \"으, 으응? 나도……?\""
10047050-236 = "당신이 누구든 공권력의 집행엔 예외란 없습니다!"
10047050-243 = "(오컬연의 모두와 함께 연행되었다.)"
