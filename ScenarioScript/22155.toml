[translation]
22155-12 = "역시나 생긴 거랑 다르게 엄청난 화력이네……."
22155-13 = "여전히 생긴 건 엄청 구리지만! 엄청 강해! 어쩌지?!"
22155-18 = "[ns1] \"가장 큰 장애물은 토키가 되리라고 생각해서 C&C에게 부탁했던 건데…….\"\n[ns2] \"설마 이런 복병이 기다리고 있었을 줄은…….\""
22155-19 = "과연, 처음부터 토키를 대동하고 나타났던 건 이 순간을 위해, 오판을 유도하려고……."
22155-20 = "과연, 처음부터 토키를 대동하고 나타났던 건 이 순간을 위해, 오판을 유도하려고……."
22155-21 = "그 결과 C&C가 빠진 지금이야말로……."
22155-23 = "회장에게 있어…… <선생님>을 제압할 수 있는 확실한 기회……."
22155-28 = "우와앗?! 모두 회장의 손에 놀아났단 거?!"
22155-29 = "처음부터 준비된…… 함정……."
22155-33 = "C&C와 선생을 떨어트린다."
22155-34 = "그것도 내 손이 아닌, 내부의 손으로 하여금 그렇게 하도록."
22155-35 = "그럼 이쪽의 의도를 들킬 여지도, 혹시나 하는 만약의 가능성조차 떠올리지 못하게 될 테지."
22155-36 = "과연 완벽하게 허를 찔렸다는 건가."
22155-37 = "끝을 내도록 하자. 아방가르드군."
22155-51 = "다음화;체크메이트 선언"
