[translation]
10043030-1 = "제3화;머니볼"
10043030-4 = "아, 선생님! 여기입니다!"
10043030-5 = "혹시 못 만나면 어쩌나 걱정했는데, 다행이네요."
10043030-6 = "[s] \"별일 없었어?\""
10043030-7 = "네. 아직은 아무 일도 없었습니다."
10043030-8 = "……범인의 단서도 아직 찾지 못했고요."
10043030-9 = "그보다 공수 교대 시간이니까, 범인의 말대로라면 이제 곧……!"
10043030-16 = "왔네요, 선생님."
10043030-20 = "후우, 하아, 후우, 하아…… 쓰읍……."
10043030-21 = "좋아, 심호흡하니 조금 진정되었군. 듣고 있나, 감독?"
10043030-26 = "드, 듣고 있다. 걱정하지 말라고."
10043030-28 = "지금 수비를 이 따위로 해 놓고 걱정하지 말라고 말하는 거냐……!"
10043030-29 = "아니, 아니다. 길게 말하지 않겠다. 선두 주자를 진루시키고, 그다음은 번트다."
10043030-30 = "반드시 성공해야 한다. 다른 작전은 없다. 명심해."
10043030-34 = "잠시만요. 야구에는 수많은 불문율이 있지요. 규정으로 확립된 것은 아니지만."
10043030-35 = "관례로, 암묵적으로, 그렇게 하기를 강하게 추천받는 규칙 아닌 규칙들……."
10043030-36 = "가령 노히트노런, 퍼펙트게임에 관한 언급을 금지한다든가, 상대가 빈볼을 던지면 반드시 보복구를 던져 줘야 한다든가."
10043030-37 = "그중에서도 경기 초반부의 번트에 대해서는, 그렇게까지 강하게 눈치를 주지는 않지만요."
10043030-38 = "그래도 아직 2회 말이거든요?! 공 몇 개나 던졌다고 벌써 번트냐고요!"
10043030-39 = "그것도 보통 잘 맞추고, 장타도 괜찮게 날릴 수 있고, 주력도 평균 이상인 타자를 배치해서……."
10043030-40 = "팀의 주포인 4번 타자의 예열기 역할을 해 주는 3번 타자에게, 번트를 시키다니요!"
10043030-41 = "거기에 세이버메트릭스적인 관점에서 보자면, 번트는 오히려 득점 기댓값을 낮추는, 이적행위에 가까운 공격수단이라고요!?"
10043030-42 = "[s] \"세이버메트릭스라는 게 뭐야?\""
10043030-46 = "아, 그거요? 그러니까 말하자면 야구를 수리적, 통계학적 방법론으로 접근해서, 야구의 본질을 더욱 과학적으로 분석하는 이론입니다!"
10043030-47 = "그 관점에 따르면, 노아웃 1루 상황의 득점 확률은 43.4%, 기대 득점은 0.884점 정도로 귀결되죠."
10043030-48 = "하지만 번트를 대서 원 아웃 2루 상황을 만들게 되면, 득점 확률은 41.6%, 기대 득점은 0.714 점 정도로 정리되어, 기대 득점은 당연하고 득점 확률까지 떨어진다고요!"
10043030-52 = "[ns1] \"……어……어?\"\n[ns2] (무슨…… 말이지?)"
10043030-55 = "덧붙여서 이 이론을 적극적으로 도입해, 다른 구단에서 외면받곤 했지만, 통계학적으로는 뛰어난 스탯을 가지고 있었던 선수들을 팀에 합류시키고!"
10043030-56 = "마침내 리그 최하위 팀을 정상급 팀으로 바꿔 놓은 과정을 그린 영화도 있어요!"
10043030-57 = "이게 또 제가 정말 좋아하는 영화거든요? 선생님도 혹시 관심이 있으시면 다음에 언제 같이–"
10043030-61 = "시……."
10043030-65 = "시?"
10043030-69 = "시끄러워, 이 야알못아–!!!"
10043030-73 = "야알못?!?!"
10043030-74 = "하나만 알고 둘은 모르는 소리 집어치워! 이 망할 팀의 3번 타자 타율이 얼마나 되는지는 알고 떠드는 거냐?!"
10043030-75 = "지금 당장 스탯 사이트 들어가서 찾아보고 오라고–!"
10043030-76 = "어디, 잠깐만요. 브레이브스의 3번 타자 타율은……."
10043030-77 = "으음, 사실 타율은 이제 와서는 조금 구시대적인 스탯이긴 한데."
10043030-82 = "뭐라고? 이럴 수가……."
10043030-83 = "1할, 7푼?!"
10043030-84 = "[s] \"1할대였어!?\""
10043030-85 = "이제 좀 알겠냐? 알겠냔 말이다!"
10043030-89 = "이 정도의 강타자였을 줄이야!"
10043030-90 = "뭐라……?"
10043030-91 = "으음, 역시 브레이브스의 3번 타자. 아주 조금이지만…… 저보다 약간 더 잘 치는군요. 인정해야겠어요."
10043030-92 = "……너, 설마 야구 선수냐?"
10043030-93 = "맞아요! 타율도 무려 8푼을 기록했다고요!"
10043030-94 = "[s] \"…….\""
10043030-95 = "뭐가…… 어째? 8……?"
10043030-96 = "아무튼! 역시 안 돼요! 이런 '강타자'에게 번트를 시키는 것은!"
10043030-97 = "경기의 흐름이라는 측면에서도, 득점 자원의 활용이라는 측면에서도 어리석은 선택이라고밖에 할 수–"
10043030-101 = "지금 당장 내 말대로 하지 않으면 개껌 공장을 벽돌 하나 남기지 않고 폭발시켜 버리겠어!!!"
10043030-105 = "윽."
10043030-106 = "[s] \"감독님. 듣고 계십니까?\""
10043030-107 = "……네. 전부 듣고 있었습니다. 어쩔 수 없겠군요."
10043030-108 = "네…… 감독님. 일단은 번트 작전을 실행하고, 꼭 성공시켜야 할 것 같아요……."
10043030-109 = "그렇지만 번트를 대려면 일단 선행 주자가 출루해야 하고, 브레이브스의 2번 타자는……."
10043030-124 = "쳤다! 어, 어? 망했어요, 선생님! 유격수 앞 땅볼이에요!"
10043030-125 = "어라? 그렇지만……. 유격수가 공을 떨궜네요? 더듬었어요!"
10043030-126 = "[s] \"거기에 비틀거리기까지…… 이건 기회야!\""
10043030-127 = "네! 달려! 달려요!! 1루에 못 들어가면 죽는다는 기세로 달려!!!"
10043030-138 = "코기 브레이브스! 아비시니안 레이더스의 실책에 기반한 것입니다만, 선두 타자 출루에 성공했습니다!"
10043030-139 = "아무래도 레이더스의 유격수가 조금 긴장한 것 같네요."
10043030-140 = "아니면 2회 초가 지나치게 길었던 탓에, 풀렸던 몸이 되돌아갔던 것이거나요."
10043030-141 = "여기에서부터 반격이 시작될 것인가! 과연 브레이브스는 대역전극의 서사를 써 내려갈 수 있을 것인가!"
10043030-147 = "다음 타자는 3번, 3번 타자입니다!"
10043030-148 = "일반적이라면 강공으로 들어갈 텐데요. 마침 타선의 순번도 좋고, 말이죠. 아…… 번트인가요? 이건…… 매우…… 의외로군요."
10043030-149 = "제발……. 부탁이야……! 성공해야 해!"
10043030-158 = "번트, 시도합니다! 공은 3루수 방향으로! 타구의 속도도 적당히 느립니다!"
10043030-159 = "방향이 좋았어요. 알맞게 굴러가기도 했고요. 수비 커버가 늦은 것은 아니었습니다만, 작전 성공이군요."
10043030-160 = "무의미한 희생이 아니었다는 점이 주목할 부분이네요."
10043030-161 = "해냈다!"
10043030-162 = "휴우……."
10043030-163 = "[s] \"심장에 좋지 않을지도…….\""
10043030-164 = "좋아. 다음은 말하지 않아도 알고 있겠지. 타순은 4번이고, 강공으로 전환할 때다."
10043030-165 = "1점. 우선은 1점이야. 하나씩 따라가면 돼. 아직 할 수 있어……!"
10043030-166 = "감독님! 우리의 첫 기회예요!"
10043030-167 = "그래. 알고 있단다! 여기에서 반드시 득점으로 흐름을 이어가겠어!"
10043030-172 = "브레이브스 4번 타자, 타석에 들어섭니다. 긴장되는 분위기."
10043030-173 = "그야말로 귀추가 주목되는 부분이라고 할 수 있겠는데요."
10043030-174 = "야구가 점점 숫자와 통계로 수렴되어 가고 있는 것 역시 사실입니다만, 흐름이라는 것은 분명 존재합니다."
10043030-175 = "그렇습니다! 흐름이 왔을 때 이어가는 것이야말로 그 팀의 실력이라고 말하는 사람도 있죠!"
10043030-187 = "말씀드리는 순간, 초구! 타격했습니다!"
10043030-192 = "쳤다! 어? 그런데……? 으아아악! 여기서 3루수 앞 뜬공이라고?!?!"
10043030-193 = "[s] \"거기에 2루 주자가 달리는 타이밍을 잘못 잡아서……!\""
10043030-194 = "망했는데요??!! 런다운 걸렸는데요!!?? 협살인데요!?!?"
10043030-199 = "2루수와 3루수 사이에 갇힌 주자! 어디로도 갈 수 없습니다……. 터치아웃입니다! 쓰리 아웃, 공수 교대입니다!"
10043030-200 = "이 득점은 반드시 성공해야 했을 텐데요……. 브레이브스로는 매우 아쉬운 결과라고밖에 할 수 없겠어요."
10043030-204 = "……."
10043030-209 = "어? 선생님, 괜찮으세요?"
10043030-210 = "[s] \"아무렇지도 않은데?\""
10043030-211 = "그, 그러면 감독님인가요?"
10043030-212 = "나도 아무렇지도 않단다."
10043030-213 = "그러면 도대체 누가……."
10043030-218 = "나다!!!"
10043030-219 = "여기서 기적의 3루수 뜬공 후 주루사라고???"
10043030-220 = "4번 타자라고 있는 게 외야로 공을 보내지도 못하고, 주자라고 나간 건 거기에서 망설이다가 복합 주루사란 거냐?!?!?!"
10043030-221 = "이게 팀이냐! 이게 팀이냐고!!!"
10043030-225 = "으, 응원할 테니까…… 브레이브스……."
10043030-226 = "하지 마! 하지 말라고! 자꾸 응원 같은 걸 해 주니까 이딴 팀이 살아남잖아!"
10043030-227 = "하아, 하아, 하아……. 후우. 그래, 좋아. 아직 경기가 끝난 건 아니지."
10043030-228 = "끝날 때까지는…… 끝난 게 아니다!"
10043030-232 = "그 명언 저도 좋아해요! 완전 느낌 있죠!"
10043030-237 = "넌 좀 조용히 해! 이대로는 안 되겠어……. 여기에서는 역으로 간다."
10043030-241 = "역습의 3회 투수 교체다!"
10043030-245 = "아니, 잠깐만요. 선발이 5회도 못 채웠는데 교체라니요!"
10043030-246 = "무, 물론 퀄리티 스타트는 애초에 날아가긴 했지만……."
10043030-247 = "그래도 지금 선발은, 나름대로 유망주 투수라고요!"
10043030-248 = "네 두 눈은 장식이냐!!!"
10043030-249 = "말이 심해?!"
10043030-250 = "세상 어느 유망주가 방어율 7점대를 찍고 있냐고!!!"
10043030-254 = "세상에, 방어율이 10점을 안 넘어가다니, 그야말로 강투수잖아요?"
10043030-258 = "……."
10043030-262 = "[ns] \"또 쓰러졌나 보네…….\""
10043030-265 = "복잡하고 혼잡한 일을 벌이고 있는 사람이지만, 뭔가."
10043030-266 = "……고생이, 많아 보이네요."
10043030-267 = "닥치고 내 말 안 들으면 지금 당장 관중석째로 불타는 꼴을 보게 될 줄 알아!!!!!"
10043030-271 = "설마 관중석에까지 뭔가 수를 써 둔 것인가?!"
10043030-273 = "알겠냐! 3회 투수 교체다! 3회! 교체라고!"
10043030-280 = "으음……. 이제 어쩌죠, 선생님?"
10043030-281 = "[s] \"일단은…….\""
10043030-283 = "[ns] \"같이, 관중석을 좀 더 찾아보자.\""
10043030-284 = "네, 네에. 그렇게 할까요……."
