[translation]
10014055-8 = "으, 으윽……!?"
10014055-15 = "하아, 하아……. 깜짝 놀랐네요."
10014055-16 = "서, 선생님? 괜찮으신가요? 혹시 다치신 곳이라도……."
10014055-17 = "[s1] \"나는 전혀 문제없어.\"\n[s2] \"걱정 마. 괜찮아.\""
10014055-18 = "그, 그렇군요. 다행입니다……."
10014055-19 = "그, 그렇군요. 다행입니다……."
10014055-20 = "그나저나 아무래도 이분들……. 쿄야마 카즈사가 새로운 조직을 재건하려 한다고 생각하는 모양이에요."
10014055-21 = "지금 주변에서 자리 잡고 있는 스케반들 입장에서는 보통 일이 아니겠지요. 무슨 수를 써서도 막으려 할 테고……."
10014055-22 = "아무래도 일이 좀 복잡해졌네요. 저 때문에……."
10014055-23 = "[s3] \"레이사 탓이 아니야.\"\n[s4] \"누구의 잘못 같은 게 아냐.\""
10014055-24 = "하하……. 감사합니다, 선생님. 그렇게 말씀해 주셔서."
10014055-25 = "하하……. 감사합니다, 선생님. 그렇게 말씀해 주셔서."
10014055-26 = "그렇지만 어찌 됐건 최근 요란하게 일을 키우고 다닌 건 저니까요."
10014055-27 = "아무래도 저 스스로는…… 이 일에서 자유롭기 힘들겠네요."
10014055-28 = "게다가 정작 쿄야마 카즈사는……. 이제는 그런 사람이 아니고 말이죠."
10014055-29 = "그런 사람에게! 더 이상 얽히게 할 수는 없지 않겠습니까!"
10014055-33 = "……잊고 싶은 과거의 일들을!"
10014055-34 = "[s5] \"…….\"\n[s6] \"레이사, 그건…….\""
10014055-35 = "으음……! 그나저나 일단 한 무리는 쓰러뜨렸지만, 제 생각에 이건 이제 시작에 불과해요."
10014055-36 = "으음……! 그나저나 일단 한 무리는 쓰러뜨렸지만, 제 생각에 이건 이제 시작에 불과해요."
10014055-37 = "스케반 분들은 앞으로도 곧 더 올 겁니다. 끝없이 몰려올 거예요, 분명!"
10014055-38 = "그렇지만 어차피 스케반들과 싸우는 건 자경단으로서의 숙명!! 저에게 달라지는 건 하나도 없습니다!"
10014055-39 = "이 일은 이제, 자경단인 제 선에서 끝내야 할 일이겠지요! '평범한' 쿄야마 카즈사를 지켜야 하니까요!"
10014055-40 = "그러니까 선생님, 일단 이걸……."
10014055-45 = "[ns7] \"이건……?\"\n[ns8] \"……전해 달라는 거야?\""
10014055-46 = "앞으로는 제가 던질 일이 없다는 의미입니다. 말로만 내뱉는 것보단, 이 편이 쿄야마 카즈사도 더 확실하게 믿을 수 있겠죠."
10014055-47 = "앞으로는 제가 던질 일이 없다는 의미입니다. 말로만 내뱉는 것보단, 이 편이 쿄야마 카즈사도 더 확실하게 편해지겠죠."
10014055-48 = "……네. 선생님. 저도 지금 깨달았어요. 선생님께서 굳이 저에게 찾아오신 것도, 계속 알 수 없는 질문을 캐물으셨던 것도."
10014055-49 = "선생님께선 제 생각보다 더 상냥한 분이시네요. 덕분에 많이 괜찮아졌습니다. ……정말 감사해요."
10014055-50 = "그러니 지금부터 하는 말은 선생님께만 하는 푸념 같은 거예요. 굳이 전달하진 말아 주세요."
10014055-51 = "……고작 짧은 며칠이긴 했지만, 오랜만에 봐서 반가웠습니다. 사실, 다시는 못 볼 줄 알았었거든요."
10014055-52 = "반가운 나머지 저도 모르게 너무 들떴던 모양이에요. 폐를 끼쳤다면 ……정말 미안해요."
10014055-53 = "그래도……. 음……."
10014055-54 = "……역시."
10014055-58 = "……누군가에게 잊고 싶은 기억으로 남았다는 건, 아주 조금 아쉽네요."
10014055-62 = "[ns] \"레이사, 잠깐…….\""
10014055-64 = "……어이쿠!"
10014055-65 = "그 조금을 참지 못하고 손님들이 또 몰려오는군요. 분명 전보다 훨씬 더 엄청난 수겠죠?"
10014055-66 = "이 이상은 저도 선생님께 민폐를 끼칠 수 없으니, 물러가도록 하겠습니다."
10014055-67 = "언젠가 기회가 되면, 다시……."
10014055-68 = "쿄야마 카즈사가 없는 곳에서, 다시 지금처럼 뵐 수 있는 날이 오기를!"
10014055-69 = "……그럼 이만!!"
