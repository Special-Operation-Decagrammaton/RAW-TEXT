[translation]
10025100-1 = "제10화;갑판 청소"
10025100-8 = "여기는 RABBIT 1, 우현 1층 구역 진입 완료."
10025100-9 = "여기는 RABBIT 2, 좌현 1층 구역 진입 완료."
10025100-10 = "확인."
10025100-11 = "RABBIT 2, 특별한 이상은 없나요?"
10025100-12 = "승조원의 모습은 보이지 않는데, 뭔가 강한 비린내가……… 윽!"
10025100-13 = "무슨 일인가요, RABBIT 2?"
10025100-14 = "……현측에 죽은 새우가 잔뜩 버려져 있어. 오래된 것처럼 보이진 않는데."
10025100-15 = "게다가 일부 새우에는 아직도 얼음이 낀 채로 남아있는 게, 냉동고에서 꺼낸 지 얼마 되지 않은 것 같아."
10025100-17 = "냉동된 새우가 버려져 있다고……?"
10025100-25 = "이건…… 내가 <레드 훅 익스프레스>에 납품한 새우잖아."
10025100-27 = "새우의 모습만 보고도 누가 잡은 건지 알 수 있는 거야?"
10025100-28 = "다른 건 몰라도 내가 잡은 녀석들은 확실히 기억하고 있지."
10025100-29 = "특히 이 녀석들은 대표가 D.U.의 고급 레스토랑에 납품하는 새우라고 해서 일부러 알이 굵은 녀석으로만 골라 준 건데…… 이런 곳에 버려져 있다니……"
10025100-31 = "남이 열심히 잡은 물건을 이렇게 취급하다니…… 너무해."
10025100-38 = "아무리 생각해도 이해할 수가 없네. 비싸게 수매한 새우를 남의 눈을 피해 일부러 해상에서 무단으로 투기하다니……"
10025100-39 = "뭔가 새우 말고 다른 목적이 있는 걸까?"
10025100-40 = "……상자."
10025100-41 = "버려진 새우가 담겨 있던 상자는 이 근처에 없는 것 같네요. 상자는 어디에 있죠?"
10025100-46 = "…… 여기에 <레드 훅 익스프레스>의 새우 박스가 쌓여 있어요!"
10025100-47 = "그런데 흔들어 보니 뭔가 이상한 소리가 나는데…… 뭐가 들어 있는 거지?"
10025100-49 = "……RABBIT 2, 확인 부탁드립니다."
10025100-50 = "확인."
10025100-55 = "이게 뭐야. 도자기랑 기모노 천…… 그리고 고급 향수?"
10025100-56 = "<레드 훅 익스프레스>에서는 이런 물건도 취급하고 있는 거야?"
10025100-57 = "아니. 찾아보니 레드 훅 익스프레스는 해산물 유통 건에 대해서만 허가를 받았어."
10025100-58 = "다른 물건을 거래하려면 사전에 총학생회에 별도의 허가를 요청해야 할 거야."
10025100-60 = "그럼 이 안에 담긴 물건들은 밀수품……?"
10025100-62 = "거기에 더해 사키가 꺼낸 그 밀수품들의 공통점을 하나 더 꼽는다면……"
10025100-64 = "원가 이상의 관세가 붙는 비싼 사치품이라는 점이려나—"
10025100-69 = "…… 결국 찾아낸 모양이군요."
10025100-75 = "당신은……"
10025100-76 = "<레드 훅 익스프레스> 대표……!"
10025100-81 = "이 바지선은 도대체 뭐지? 이 버려진 새우들은 또 어떻게 된 것이고!"
10025100-82 = "너무 화내지 마세요, 어르신. 흥분은 건강에 좋지 않으니까요."
10025100-83 = "그렇게 보채지 않으셔도 천천히 설명 드리겠습니다."
10025100-87 = "……네, 보시다시피 이 바지선은 <재래의 배> 같은 게 아닙니다."
10025100-88 = "저희 <레드 훅 익스프레스>에서 작업 및 선적 용도로 사용하는 바지선일 뿐이죠."
10025100-89 = "바다 속 깊은 곳에 사는 정체불명의 생명체들이 공물을 걷기 위해 배를 타고 뭍으로 나온다니…… 그런 우스꽝스러운 설화를 믿는 사람이 요즘 세상에 어디 있습니까?"
10025100-90 = "……왜 새우를 바다에 버렸지?"
10025100-91 = "장사치가 움직이는 데 별다른 이유가 있겠습니까?"
10025100-93 = "……돈이 되지 않으니까."
10025100-95 = "어르신, 요새는 새우로 큰돈을 벌 수 없다고요."
10025100-96 = "워낙 조업량이 변덕스러운 탓에 고정 거래 계약은 꿈도 꾸지 못하고, 협동조합에서 나오는 수매지원금도 보잘것없고……"
10025100-97 = "그에 비해 새우를 버리고, 그 상자에 밀수품을 잔뜩 담아 블랙 마켓에 넘기면 10배, 20배의 이득을 남길 수 있지요!"
10025100-98 = "그, 그렇다 하더라도 버릴 것까지는 없었잖아!"
10025100-99 = "그 새우 하나를 낚기 위해 어르신이 얼마나 노력을 했는데!"
10025100-100 = "아아…… 정말 시끄럽네."
10025100-101 = "그래서, 뭐가 문제인데? 어차피 새우 대금은 제대로 치렀잖아?"
10025100-102 = "그럼 사들인 새우를 구워 먹든, 튀겨 먹든 그건 내 자유라고. ……물론 먹지는 않겠지만."
10025100-104 = "전에 말하지 않았나? 다시 한번 말해 두는데, 나는 새우 싫어한다고."
10025100-111 = "이 망할 녀석이……!"
10025100-119 = "아직도 상황 판단이 안 된 것 같은데…… 여기는 내 배 위야."
10025100-120 = "바다 위에서 몇 사람 정도 실종 처리하는 건 어려운 일도 아니거든?"
10025100-122 = "당신이 지금 무슨 말을 하고 있는지는 알고 있나요? 이건 범죄라고요!"
10025100-123 = "그런데? 그래서 어쩌라고?"
10025100-124 = "너희들이 도대체 무얼 할 수 있는데?"
10025100-126 = "새우를 낚는 것 이외에는 아무것도 할 줄 모르는 촌 동네의 늙은 어부가—"
10025100-128 = "본교의 관심 밖에서 낙오된 벽지의 경찰 학생들이—"
10025100-129 = "마을의 생리에 대해서는 조금도 알지 못하는 외지인들이—"
10025100-131 = "이 마을의 경제를 틀어쥐고 있는 내게 무얼 할 수 있는데?"
10025100-132 = "그저 화내고, 욕하고, 저주하는 것 말고 너희가 무얼 할 수 있냐고. 이 아무것도 갖지 못한 촌놈들이!"
10025100-138 = "………"
10025100-142 = "[ns] \"……미야코.\""
10025100-143 = "……네. 이야기는 잘 들었습니다."
10025100-145 = "너희들은 이번에 마을에 새로 들어온 관광객……?"
10025100-147 = "<레드 훅 익스프레스> 해운 대표. 당신은 이곳 야토우라 마을에서 갖고 있는 경제적 지위를 악용하여 다음과 같은 죄를 범했습니다."
10025100-148 = "해상에서 처리되지 않은 수산물을 무단 투기하고, 어민들에게 지원되는 수매 비용을 착복한 죄."
10025100-149 = "회계 장부를 조작하고 취급할 수 없는 사치품을 유통하여 거액의 세금을 탈루한 죄."
10025100-150 = "취득한 범죄 수익으로 불법 사병 조직을 운용하고 가짜 정보로 주민들을 겁박한 죄."
10025100-151 = "……그리고 야토우라 마을의 특산품인 맛있는 새우를 D.U.의 시민들이 맛보지 못하도록 방해한 죄."
10025100-152 = "이는 키보토스의 시민 안전을 침해하는 중대한 범죄인만큼……"
10025100-153 = "SRT 특수학원의 이름으로 당신을 긴급 체포합니다!"
10025100-155 = "에, SRT 특수학원……? SRT의 학생들이 어째서 이곳에……?"
10025100-156 = "당신은 돈도 되지 않는 물건이라며 그동안 거들떠보지도 않은 모양이지만……"
10025100-157 = "……저희는 좋아하거든요, 이 마을의 새우."
10025100-159 = "SRT…… 특수학원?"
10025100-160 = "전에 들어본 적 있어. 그 어떤 치안 조직보다 범죄 현장에 빠르게 투입되는 특수부대의 이야기를……"
10025100-161 = "폐교된 줄 알았던 SRT 특수학원이…… 아직도 살아 있었군요!"
10025100-167 = "젠장…… 운수가 나쁘려니, 바다 한가운데에서 SRT의 대원들과 마주치게 되다니……!"
10025100-168 = "하지만 여기에 들인 돈이 얼마인데, 이대로 가만히 당할 줄 알고?"
10025100-169 = "선원 전원, 모두 상갑판 위에 집합!"
10025100-177 = "아무리 전투에 특화된 SRT 대원들이 상대라 하더라도 숫자로 밀어붙이면 승산이 있겠지."
10025100-179 = "이 건방진 녀석들이 장사를 방해하지 못하도록 본 때를 똑똑히 보여주자고!"
10025100-184 = "소대원 전원, 전투 준비."
10025100-188 = "……지금부터 갑판 청소를 개시합니다!"
