[translation]
1000806-1 = "지각 대소동"
1000806-2 = "밀레니엄 외곽 슬럼가"
1000806-3 = "……."
1000806-4 = "……"
1000806-5 = "……"
1000806-6 = "……들었나?"
1000806-7 = "소문에 의하면……"
1000806-8 = "미카모 네루가 잦은 지각과 결석으로……"
1000806-10 = "출결이 레드라인이라 한다."
1000806-11 = "호오…… 그 말은……"
1000806-12 = "조금만 더 지각하거나 결석하면 유급이나 혹은 징계라는건가?"
1000806-13 = "이해가 빠르군."
1000806-14 = "유급이나 징계라면…… 그 공식적인 에이전트 활동도 금지되는 것이겠지?"
1000806-15 = "그래…… 바로 그것이다."
1000806-18 = "수단과 방법을 가리지 말고! 네루를 지각하게 만드는 거다!"
1000806-20 = "밀레니엄 등교길"
1000806-21 = "여어. 선생. 좋은 아침이야."
1000806-22 = "내 출석 현황에 대해 상담해주고 싶다고?"
1000806-23 = "크하하. 고마워. 뭐, 솔직히 말하자면, 이제 한번만 더 지각하면 징계……의 레벨이거든."
1000806-24 = "제시간에 맞춰 집을 나서는데도 이상하게 지각을 한단 말이지."
1000806-25 = "지금도 시간이 아슬아슬하니까, 같이 가면서 얘기하자고."
1000806-26 = "오늘만큼은 성실하게 등교해 보일 테니까!"
1000806-28 = "밀레니엄 골목길"
1000806-29 = "아앗. 거기 가는 꼬마 메이드님과 선생님~"
1000806-30 = "누가 꼬마야 이자식아!!"
1000806-31 = "(철컥)"
1000806-32 = "히익! 죄, 죄송합니다!"
1000806-33 = "저희 가게에서 새로운 메뉴를 준비했는데, 시식을 부탁 드리고 싶어서……"
1000806-34 = "헤에. 시식이라. 하긴 제대로 먹지도 못하고 나오긴 했지."
1000806-35 = "선생은 어때?"
1000806-36 = "[s] \"시간은 괜찮아?\""
1000806-37 = "엄청 아슬아슬하지만…… 시식 정도라면……."
1000806-38 = "……"
1000806-39 = "……하아. 아냐. 이런 것에 한눈 팔면…… 모처럼의 결심이 깨지잖아."
1000806-40 = "미안하지만 오늘은 패스."
1000806-41 = "자, 가자. 선생."
1000806-43 = "……."
1000806-44 = "쳇! 시식 음식에 배탈약을 넣어뒀는데, 걸리지 않다니!"
1000806-45 = "다음 스텝으로 간다!"
1000806-47 = "자아, 어서들 오세요! 오픈 특가 이벤트입니다!"
1000806-48 = "쓰기만해도 엄청 강해보이는 리젠트 가발이, 지금 단 5분간! 90% 파격 세일!!"
1000806-49 = "……."
1000806-52 = "(쩌, 쩐다아! 리젠트 가발? 엄청 멋져 보이잖아!)"
1000806-53 = "(게다가 90% 세일? 잘 모르겠지만 엄청 싼거겠지?)"
1000806-56 = "자아, 손님! 이 가발 어떠십니까? #n손님에게 엄청 잘 어울릴 것 같은데요!!"
1000806-57 = "그, 그래……?"
1000806-58 = "쓰기만해도 근성이 흘러 넘칠 것 같은 최신 유행 아이템! #n가게 안에 길이 별로 다양한 물건이 있습니다! 1미터짜리도 있다고요!"
1000806-59 = "……이, 일미터."
1000806-60 = "자아, 들어오세요. 구경하고 가세요! 지금 기회를 놓치면 안됩니다!"
1000806-61 = "어, 으음……."
1000806-62 = "[s] \"시간은 괜찮아?\""
1000806-63 = "아, 안괜찮아! 으, 으으!"
1000806-64 = "……패스! 가던 길 가자고, 선생!!"
1000806-66 = "……."
1000806-67 = "뭐야, 왜 안으로 안들어오는 거지? 함정은 다 준비해 뒀는데."
1000806-68 = "잘 안걸리는군. 다음 스텝으로 간다."
1000806-70 = "……."
1000806-71 = "[s] \"아쉬운 얼굴이네.\""
1000806-72 = "……아니. 그 호객꾼 말야. 방금 시식을 권하던 그 녀석 아냐?"
1000806-73 = "[s1] \"그런가?\"\n[s2] \"다 비슷하게 생겨서 잘 모르겠어.\""
1000806-74 = "흐음……. 뭔가 이상한데 말이지."
1000806-75 = "흐음……. 뭔가 이상한데 말이지."
1000806-77 = "이제 어떡하지?"
1000806-78 = "이렇게 된 이상 무장 돌격이다. 다음 골목에서 기습하는 거다!"
1000806-79 = "특공인가? 그 네루를 상대로? #n내키지 않는데……."
1000806-80 = "아냐! 우리의 목표는 어떻게든 시간을 끄는 것! #n계산대로라면 네루 녀석은 다음 골목에 1분뒤에 도착하게 된다."
1000806-81 = "거기서 15분만 버티면 네루 녀석은 반드시 지각이라고!"
1000806-82 = "흠…… 기습이라면 그정도 버티는 건 해볼만 할지도."
1000806-83 = "반드시 성공시켜야 해!"
1000806-84 = "(탁탁탁-)"
1000806-85 = "어이, 선생! 늦었다고! 빨리 뛰어!"
1000806-86 = "자아, 곧 도착하는군."
1000806-87 = "간다!! 습격이다!"
1000806-89 = "(파앗-!)"
1000806-91 = "각오해라, 미카모 네루!!"
1000806-92 = "우리를 방해한 대가를…… 어? 없다?!"
1000806-93 = "바, 방금 전까지 여기 있었는데……."
1000806-95 = "그럴줄 알았지."
1000806-97 = "어, 으앗?!"
1000806-98 = "어디서 본 녀석들이다 했더니, 예전에 우리에게 당했던 그 불량배 녀석들이었구만?"
1000806-99 = "감히 이 나를 지각하게 만드려고 책략을 꾸미다니 말이야."
1000806-102 = "각오해줘야겠어."
1000806-104 = "히, 히익?!"
1000806-106 = "(콰콰콰콰아아아앙-!)"
1000806-108 = "밀레니엄 본교사 복도"
1000806-109 = "휴우……"
1000806-110 = "간신히 세이프인가. 나참. 등교 한 번 하기 힘들구만."
1000806-111 = "[s] \"다사다난한 등교였어.\""
1000806-112 = "크하하. 그러게 말야."
1000806-113 = "이제 앞으로도 지각은 좀 신경써야겠어."
1000806-114 = "같이 등교해줘서 고마워, 선생."
1000806-115 = "그럼 이만! 나중에 보자고!"
1000806-118 = "네루는 총알 같은 속도로 교실을 향해 사라져 갔다."
