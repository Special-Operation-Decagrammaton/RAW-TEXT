[translation]
10010090-1 = "제9화;끝내지 못한 이야기 1"
10010090-13 = "……확인했어요. 이 약이 맞네요."
10010090-17 = "물이끼 아교도 다녀오시는 사이에 꽤 녹았고……. 약도 넉넉하게 확보했고……."
10010090-18 = "작업하는 동안 먹을 케이크도 있으니, 준비 완료로군요. 곧바로 시작하면 되겠어요."
10010090-19 = "저, 정말인가요? 정말 감사합니다……!"
10010090-20 = "……아. 그럼 전 이제 뭘 해야……?"
10010090-21 = "청소라도 하고 있을까요? 아니면……. 옆에서 보조라도……."
10010090-28 = "……그……."
10010090-29 = "……그……?"
10010090-30 = "쓸데없는 짓은 됐으니까……. 그냥 잠이나 자세요……."
10010090-31 = "……네? 자, 잠이요……?"
10010090-32 = "……아."
10010090-33 = "나 왜 또 말을 이렇게……."
10010090-34 = "……미안해요. 나쁜 의미로 한 이야기는 아니었어요. 정말로 그 의미로 한 말이니까……."
10010090-35 = "제가 따라다닌 건 아니지만, 재료들의 수준이나 상황만 봐도 짐작 가는 부분들이 있거든요."
10010090-36 = "분명 많은 일들이 있었겠지요. 사실 처음부터 다소 무리하고 억지일 수 있는 조건들이었으니까요."
10010090-37 = "그러니 이제 좀 자요. ……사실 지금, 꽤 졸리잖아요? 안 그래요?"
10010090-38 = "……선생님도 마찬가지이실 거고. 그렇죠?"
10010090-39 = "어……. 어라……. 선생님……?"
10010090-40 = "[s1] \"그럼 사양 않고 조금만 쉴까.\"\n[s2] 몸 눕힐 자리를 둘러본다."
10010090-41 = "……마침 두 분이 계신 그쪽……. 제가 평소에 자는 곳이라 자리도 펴져 있을 거예요."
10010090-42 = "……마침 두 분이 계신 그쪽……. 제가 평소에 자는 곳이라 자리도 펴져 있을 거예요."
10010090-43 = "호화로운 침대 같은 건 아니지만……. 적어도 감기들거나 담 결리진 않으실 테니까요……."
10010090-44 = "……."
10010090-48 = "저……. 정말 혹시나 하는 노파심에 말씀드리는데……."
10010090-49 = "냄새 맡거나 하시면, 그 길로 쫓아낼 거예요……!"
10010090-50 = "[s3] \"고마워.\"\n[s4] \"그럼 먼저 한숨 잘게.\""
10010090-51 = "……모쪼록 고생하셨어요. 두 분 모두."
10010090-52 = "……모쪼록 고생하셨어요. 두 분 모두."
10010090-53 = "그럼 이제 푹 쉬시고……. 지금부터는 제게 맡겨주세요."
