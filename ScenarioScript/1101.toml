[translation]
1101-1 = "미식연구회의 기묘한 하루 1"
1101-2 = "게헨나 외곽 어딘가"
1101-4 = "하아, 하아……. #n이제 더이상은 안 쫓아오겠지?"
1101-5 = "한숨 돌린 거 같아요. 아무리 지독한 선도부장이라도 #n이런 외곽 지역 멀리까지 추격해오진 않겠죠☆"
1101-6 = "후. 그깟 맛없는 학원식당 하나 날려버렸다고 이 난리라니, #n게헨나의 선도부는 어지간히도 할일이 없나 보군요."
1101-7 = "아니…… 선도부가 하는 게 바로 그런 일이잖아……."
1101-8 = "마치 이런 거죠, 준코 씨. #n아무도 없는 싱크대 수도에 물이 콸콸 흘러 넘치는 걸 보면 무슨 기분이 들죠?"
1101-9 = "어…… 잠가야겠다?"
1101-10 = "네. 바로 그거예요. #n맛없는 식당을 보면 저는 그런 충동을 느낍니다."
1101-11 = "……됐어. 설명하려고 하지마. #n어차피 모르겠으니까."
1101-12 = "그런데 아까부터 이즈미가 안 보이잖아. #n따라오고 있었던 거 아니었어?"
1101-13 = "이즈미 씨는 한참 전에 낙오되었어요. #n아마도 지금쯤이면 히나 씨에게 잡혔겠죠."
1101-14 = "뭐?! 뭐야?!! 그럼 큰일이잖아!! 그걸 왜 이제 말해줘?!"
1101-15 = "그럴 필요가 없었으니까요. #n이즈미 씨는 낙오될 때 우리에게 각오를 남겼어요. 뜨거운 진심이 담긴 혼의 외침을요."
1101-16 = "가, 각오? #n서, 설마……! #n우리를 위해서……."
1101-17 = "……그렇군요. 그녀의 희생은 잊지 않겠습니다. #n이즈미가 남긴 최후의 말은 무엇이었죠?"
1101-20 = "아, 안돼! 기다려!! #n이 피도 눈물도 없는 것들아!! 같이 가!"
1101-21 = "(미끄덩-) 후냐앙?!"
1101-23 = "(콰당탕-!)"
1101-24 = "버리고 가지 마! 으아앙! #n복수할 테다! 죽어서 복수할 거야!!"
1101-26 = "……라고요."
1101-27 = "……."
1101-28 = "……."
1101-29 = "우후후~☆"
1101-32 = "킁킁…… 뭐지? 어디서 맛있는 냄새가 나."
1101-34 = "이런 공원에서 말인가요?"
1101-35 = "뭔가 엄청 독특한 음식의 냄새가…… 킁킁. 이쪽이야!"
1101-37 = "(휘잉~)"
1101-39 = "(뒤적 뒤적)"
1101-40 = "(불쑥) 찾았어! 이 버섯에서 나는 냄새야!"
1101-41 = "어머나, 이건……."
1101-42 = "트뤼플……! 이건 트뤼플이라는 겁니다!"
1101-43 = "트뤼플?"
1101-44 = "검은 다이아몬드라고도 불리는 엄청나게 귀한 버섯……!"
1101-46 = "희소가치로 따진다면 환상의 참치라고 불리는 골드마구로보다도 위입니다!"
1101-47 = "히에에? 진짜야?"
1101-48 = "특히 이 농후하고도 독특한 향기는 쉽게 접할 수 없는 유니크한 것입니다."
1101-49 = "맡을 수 있는 것만으로도 행운이에요."
1101-50 = "저도 들어본 적 있어요. 굶주린 암퇘지의 후각으로만 찾을 수 있다는 초 레어 아이템!"
1101-51 = "과연 준코 씨. 재능이 있으시네요."
1101-52 = "칭찬하면서 그런 대사를 섞지마. #n죽인다? 트뤼플 대신 여기 묻어버린다?"
1101-54 = "이러고 있을 때가 아닙니다. 트뤼플은 채취한 뒤의 5분 동안의 후처리가 생명, #n이 신선함을 그대로 유지하기 위해선……"
1101-55 = "깨끗한 헝겊이나 천이 필요합니다."
1101-56 = "아니…… 이런 흙길을 달려왔잖아. #n깨끗한 천이 있을 리가. 다들 흙투성이에……"
1101-57 = "혹시 이런 것도 괜찮을까요?"
1101-58 = "뭐야, 이건!! 속옷이잖아!!!"
1101-59 = "뜯지도 않은 새것인데요? 게다가 고급 실크 100%라서, #n기분은 나쁠 수 있겠지만 본질적으로는 깨끗한 손수건과 다를 바가 없다고요?"
1101-60 = "아니, 뭐. 본질적으론 그렇지만…… #n이걸로도 괜찮은 거야, 회장?"
1101-61 = "문제 없습니다. 아니, 오히려 다행이군요. #n이럴 때 아카리 씨의 결벽증이 도움이 될 줄이야."
1101-62 = "(휘릭휘릭)"
1101-63 = "자, 됐습니다. #n이제 돌아가서 이 트뤼플을 요리하기만 하면……!!"
1101-64 = "………."
1101-65 = "아니, 그 전에…… 붙잡힌 이즈미 씨부터 구출해야겠죠. #n이런 귀한 음식을 맛보는데 부원이 한명이라도 빠진다는 건 있을 수 없는 일이니까요."
1101-66 = "맞아! 그렇지! 이대로 돌아가서 선도부 녀석들을 박살내는 거야!! #n이즈미도 구하고!"
1101-67 = "러브 앤 바이올런스☆ #n여자아이들의 우정이란!"
1101-70 = "누가 누굴 박살낸다고?"
1101-71 = "히, 히익?!?! 선도부?!! 어느새?!"
1101-75 = "(휘익-)"
1101-77 = "이런…… 포위됐나."
1101-78 = "하아. 그만 좀 도망치라고. 귀찮으니까. #n얘들아, 죽여."
1101-79 = "(뜨끔?!)"
1101-81 = "……아니, 귀찮아지니까 죽기 직전까지만 쏴버려."
1101-83 = "(끄덕)"
1101-84 = "저항하지 말아주세요, 여러분……."
1101-87 = "(투타타타타타탕-!!)"
1101-89 = "(이후 엉망진창으로 체포당했다.)"
