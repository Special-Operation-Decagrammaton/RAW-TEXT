[translation]
33010-1 = "제1화;포스트모템 1"
33010-4 = "비밀 회복실"
33010-6 = "유리조노 세이아……?"
33010-7 = "네. 기다리고 있었습니다. 아리우스 분교의 시라스 아즈사."
33010-8 = "기다리고 있었다고……? 나를?"
33010-9 = "네. 꿈에서 보았거든요. 이 장면을."
33010-10 = "……그러네요, 설명하기 조금 힘드니…… 일단은 예지몽 같은 거라고 해둘까요."
33010-11 = "저는 종종 그런 꿈을 꿉니다. 현실이 되어버리는 꿈. 혹은 현실과 구분할 수 없는 꿈을."
33010-12 = "그렇다는 건, 지금 내가 뭘 할 건지도 알고 있어?"
33010-13 = "네. 당신은 제 헤일로를 파괴하라는 명령으로 여기에 왔습니다."
33010-14 = "다른 동료들과 함께 왔지만, 여기까지 도달한 것은 당신이 유일하죠. 훌륭한 능력이네요. 아즈사."
33010-15 = "……. 그럼 어째서 도망치지 않은 거야?"
33010-16 = "굳이 말하자면…… 의미가 없기 때문이죠."
33010-17 = "모든 것은 헛되나니…… 아리우스가 신봉하는 그 금언처럼요. 미래를 보는 저에겐 그렇게 발버둥 치는 것은 무의미할 뿐입니다."
33010-18 = "죽음은 키보토스에서 흔한 일은 아니겠지만, 우리 역시 살아 있는 사람. 보이지 않을 뿐, 죽음은 분명하게 우리 곁에 존재하고 있죠."
33010-20 = "'헤일로를 파괴한다.' ……우리 키보토스에서만 쓰이는 이 관용구대로, 누군가가 제가 죽기를 바라고 있고,"
33010-21 = "당신은 이렇게, 이 비밀의 방에 아무도 모르게 잠입해 들어왔으니까요. 시라스 아즈사. 아리우스 분교의 학생."
33010-23 = "당신은 전에도 누군가의 헤일로를 파괴한 적이 있나요?"
33010-24 = "……. 아니. 하지만 어떻게 하는지는 알고 있어……. 배웠으니까."
33010-25 = "배웠다고요……?"
33010-26 = "방법은 간단해……. 결국 육체가 돌이킬 수 없는 대미지를 받으면 헤일로는 부서져 버려."
33010-27 = "키보토스의 학생이라면 5.56mm 탄을 수십 발 이상 맞아도 치명적인 상처를 입진 않겠지만……"
33010-28 = "충분한 탄약과 시간, 그리고 전술적 우위가 확보되면 화기로 헤일로를 부수는 것도 불가능하지는 않아."
33010-29 = "그 외에도 물이나 식량을 장기간 섭취하지 못하거나, 일정 이상 숨을 쉬지 못하거나, 피를 일정 이상 흘리거나…… 체온이 일정 이상 낮아지거나…… 병에 걸리거나……."
33010-30 = "죽음에 이르는 방법들은 다양하게 존재하고 있어."
33010-31 = "그리고 유리조노 세이아, 몸이 약한 당신이라면……."
33010-32 = "…… 지금 당신이 가지고 있는 화기로도 충분하다?"
33010-33 = "응, 아마도. 하지만 지금 나에겐 충분한 시간도, 전술적 우위도 없으니……."
33010-34 = "이 폭탄을 사용할 거야. 이거라면 단번에 '헤일로를 파괴'할 수 있어."
33010-35 = "헤일로를 부수는 폭탄……? 그런 기술은 들어본 적 없는데……."
33010-36 = "……그렇군요. 아리우스 학원은 그런 것을 가르치고 연구하나보네요. 헤일로를 부수는 방법을. 사람을 죽이는 방법을."
33010-37 = "……응. 그야, 당연하잖아? 학원은 그런 걸 가르치는 곳이니까."
33010-38 = "……."
33010-39 = "……그렇군요. 아리우스는 결국 그렇게까지……."
33010-44 = "아즈사. 당신은 그렇게 <살인자>가 되어도 괜찮은가요?"
33010-45 = "……."
33010-47 = "저는 또한 보았습니다. <살인자>가 될 자신의 처지를 두려워하던 모습을."
33010-48 = "당신이 원한 것도 아니고, 다른 선택지가 있었던 것도 아니었지만…… 사실 그런 건 중요하지 않죠."
33010-49 = "살인자는 살인자. 분명하고 절대적인 명제만이 이 세계에 남을 뿐."
33010-50 = "당신이 느낀 절망, 고통, 분노, 후회, 좌절, 무력감…… 그런 건 누구에게도 전해지지 못하고 누구도 알지 못한 채 사라지겠죠."
33010-51 = "네. 스스로도 잘 알고 있을 겁니다. vanitas vanitatum. 이 세계의 진실을."
33010-52 = "……하지만, 당신은 이 말에 동의하면서도, 동시에 부정하고 있군요."
33010-54 = "이건 당신이 보고 있는 장면인가요?"
33010-55 = "눈 앞에 있는 꽃을 바라보면서…… 당신은 그런 생각을 하고 있군요."
33010-56 = "모든 것은 헛되고 헛될지라도…… 발버둥 치지 않으면 안 된다."
33010-57 = "이 이미지가 당신 내면의 근간인가요? 잘 이해하진 못했지만……."
33010-58 = "그렇군요……. 당신은……."
33010-60 = "……저를 죽이러 온 것이 아니라, 저에게 조언을 구하기 위해 왔군요."
33010-61 = "당신의 발버둥에 대해서."
33010-63 = "시스터후드의 회의실"
33010-65 = "…… [USERNAME] 선생님? 괜찮으신가요?"
33010-66 = "[s1] \"……잠깐 졸았었나 봐.\"\n[s2] \"어떤 꿈을 꾼 것 같았는데…….\""
33010-67 = "최근 이런저런 일로 바쁘신 것은 알고 있습니다만…… 조금만 집중해주시면 감사하겠군요."
33010-68 = "최근 이런저런 일로 바쁘신 것은 알고 있습니다만…… 조금만 집중해주시면 감사하겠군요."
33010-69 = "[s] \"죄송합니다…….\""
33010-70 = "애초에 당신이 요청한 설명입니다만…… 하긴, 이 며칠간 계속 사건의 뒷처리를 자청하고 계신다고 들었습니다."
33010-71 = "[s] \"자질구레한 뒷처리는 어른의 역할이니까.\""
33010-72 = "……그렇군요."
33010-73 = "많은 사건들이 있었기에, 이 모든 것들을 제대로 정리해두지 않으면 안되겠죠."
33010-74 = "지루하고 재미없더라도, 이런 것들을 정리해야 다음으로 나아갈 수 있는 법. 그게 바로 포스트모템의 의의니까요."
33010-75 = "……. 그럼, 다시 본론으로."
33010-76 = "세이아 씨의 회복실이 폭파된 것은 새벽 3시경."
33010-77 = "그 직후, 가장 먼저 폭발 현장에 도착한 것은 구호기사단의 미네 단장이었습니다."
33010-80 = "미네 단장은 상황을 파악한 뒤, 곧바로 이 사실을 티파티에 보고."
33010-81 = "티파티는 세이아 씨의 사망 소식에 패닉에 빠졌고, 정보 은폐와 범인 색출 등의 소동이 벌어졌습니다."
33010-85 = "그 혼란을 틈타 미네 단장은 세이아 씨와 함께 모습을 감췄습니다. 단원들조차 행방을 알지 못할 정도로 철저하게 사라져버렸죠."
33010-87 = "거기까지가 티파티가 알고 있는 사실입니다. 사실 미네 단장은 세이아 씨를 안전한 곳에 숨기고 그녀의 헤일로가 파괴된 것으로 조작한 것입니다."
33010-88 = "죽은 사람은 노려질 리가 없으니까요. 그게 세이아 씨를 지킬 수 있는 가장 확실한 방법이었겠죠."
33010-89 = "티파티의 멤버가 습격당한 사건, 범인은 그 누구라도 될 수 있습니다. 그러니 그 누구도 믿어서는 안 된다고 생각하고 자체적으로 행동한 것입니다."
33010-90 = "범인이 미카 씨였다는 것이 밝혀진 지금, 그녀의 판단은 결과적으로 옳았던 것이겠지만……."
33010-91 = "……하지만 아직도 세이아 씨는 깨어나지 않고 있어요."
33010-92 = "폭발의 상처는 나았지만 그래도 계속 잠들어 있는 상태…… 기사단장도 원인을 모른다고 했습니다."
33010-93 = "결국 그렇게 미네 단장과 세이아는 아무도 모르는 곳에서 지금까지 몸을 숨기고 있는 중입니다."
33010-94 = "그것이 바로 과거에 벌어졌던 유리조노 세이아 습격사건의 전말입니다."
33010-100 = "[ns] \"하나코.\""
33010-101 = "우후후♡ 지루한 사쿠라코 씨에게 잡혀서 고통받고 있는 선생님을 구해주러 왔어요."
33010-102 = "농담할 분위기는 아닙니다. 하나코 씨."
33010-103 = "으응…… 역시 재미없네요. 언젠가 사쿠라코 씨에게 에로한 책을 강제로 읽게 하고 싶네요♡"
33010-104 = "어쩐지, 사쿠라코 씨, 그런 쪽에 면역력이 없는 이미지이기도 하고. 후후후♡"
33010-109 = "……. 저희는 분명 계약을 했을 겁니다. 하나코 씨."
33010-110 = "……물론이에요. 분명하게 기억하고 있어요."
33010-113 = "[ns] \"잠깐 기다려. 하나코.\""
33010-114 = "선생님이…… 어떻게 여기에……."
33010-118 = "[ns] \"시스터후드와의 계약이라는 건 무슨 소리야?\""
33010-119 = "어라…… 그건……."
33010-120 = "샬레의 선생님. 이 문제는 당신이 개입할 부분이 아닐 듯합니다만."
33010-121 = "[s] \"하나코는 보충수업부의 학생이야. 나도 들어야겠어.\""
33010-122 = "어머나……."
33010-123 = "……."
33010-124 = "죄, 죄송해요……. 그건 제가 멋대로……."
33010-125 = "마리 쨩……."
33010-129 = "제가 사쿠라코 님을 설득해서 하나코 씨를 돕는 대신에…… 한 가지만 약속해 달라고 요청했어요……."
33010-130 = "그건……."
33010-131 = "하나코 씨가 자퇴하려는 결심을 그만둬 달라고……."
33010-132 = "……."
33010-133 = "저, 저는…… 하나코 씨의 마음을 헤아리지 못하고 있었어요……. 하나코 씨가 자퇴하려는 걸 막을 수 없었어요……."
33010-134 = "그치만…… 저는 그래도 하나코 씨가 학원에 남아 있었으면 좋겠어요…… 죄송해요. 제멋대로의 억지를 부려서……."
33010-135 = "……아니에요. 마리 쨩."
33010-136 = "마리 쨩이 사과할 일이 아니에요. 제멋대로의 행동으로 모두를 걱정하게 만든 건 저예요…… 사과는 제가 해야만 해요."
33010-137 = "미안해요. 마리 쨩. 걱정을 끼쳐서."
33010-138 = "하나코 씨……."
33010-139 = "그리고 저는 이제 더 이상 그런 생각은 하지 않으니까, 걱정하지 마세요."
33010-140 = "저, 정말인가요……?"
33010-141 = "네. 정말이에요. 보충수업부에서의 교훈…… 그걸로 저도 조금은 더 발버둥 치려고 하니까요. 그렇죠, 선생님?"
33010-142 = "[s] \"응. 맞아. 하나코는 그럴 거니까.\""
33010-143 = "……네. 고맙습니다. 하나코 씨, [USERNAME] 선생님……."
33010-147 = "……하지만 그것만으로는 수지가 맞지 않죠."
33010-148 = "사쿠라코 님……?"
33010-149 = "한 가지 요구가 더 있습니다. 하나코 씨."
33010-150 = "……."
33010-151 = "그건……."
33010-155 = "……분명, 알몸으로 등교하는 교칙을 만들어, 트리니티를 나체 학원으로 바꾸려는 계획을 도우라는 것이었죠?"
33010-156 = "……네. 그것은 바로……."
33010-157 = "……네?"
33010-158 = "정말이지 그런 음모를 시스터후드가 꾸미고 있었을 줄은……. 사쿠라코 씨는 정말로 어둠 속에 감춰진 신비주의 집단의 수장답네요."
33010-159 = "특히 그 예외조항…… 전원 알몸이 원칙이지만 시스터후드만큼은 베일 착용을 허용한다…… 라니, 과연."
33010-161 = "알몸에 베일…… 그런 방식으로 자신들의 특권을 드러내겠다니, 이 얼마나 무시무시한 계획인지……."
33010-162 = "네?!"
33010-163 = "일단 그 계획에는 어쩔 수 없이 협조해야겠네요. ……아니, 전심전력으로 반드시 성공시키고야 말겠어요!"
33010-164 = "하지만 그런 특권 조항을 그대로 둘 순 없어요. 그래서, 저는 모든 학생에게도 알몸이지만 양말 착용만큼은 허용한다, 라는 항목을 추가할 것을 요청합니다!"
33010-165 = "이게 그 계획에 협조하는 제 요구사항이에요!"
33010-166 = "네? 사쿠라코 님?! 그, 그런 계획이셨어요?!"
33010-167 = "아, 아니에요!!"
33010-168 = "으응, 아니었나……."
33010-169 = "네! 아니에요! 무슨 소릴 하는 겁니까!! 당신은!"
33010-171 = "저희가 하나코 씨의 부탁을 들어주는 대신, 하나코 씨도 저희 부탁을 하나 들어주는 것이었잖아요!"
33010-172 = "……아아, 네. 그거였죠. 참."
33010-174 = "……하아."
33010-175 = "당신이 시스터후드에 들어와 주는 것이 가장 좋겠지만, 그런 건 당신을 괴롭힐 뿐이겠죠."
33010-176 = "이번 사건을 통해 저희도 그동안의 무간섭주의를 수정하려고 합니다. 말하자면 앞으로 조금 더 정치에 발을 담그게 되겠죠."
33010-177 = "그 과정에서 하나코 씨 같은 인재에게 도움을 받을 기회가 있었으면 좋겠다, 그런 얘기였어요."
33010-178 = "……네. 그 정도라면야, 뭐……."
33010-179 = "어째서 아쉬운 표정인 거죠? ……아니, 됐습니다."
33010-180 = "[s] \"하나코가 원치않는 내용이라면 언제든지 거절할 수 있어야 해.\""
33010-181 = "어머나……."
33010-182 = "……네. 이견없습니다. 어차피 하나코 씨에게 도움을 받는 입장이고, 억지로 요구할 생각도 없으니."
33010-183 = "……고맙습니다, 사쿠라코 님."
33010-184 = "……. 이야기가 잠깐 샜는데, 다시 본론으로 돌아가죠. 무슨 얘기하고 있었더라……."
33010-185 = "알몸 등교 얘기하고 있었죠♡"
33010-186 = "……네, 알몸 등교…… 가 아닙니다! 세이아 씨의 습격 사건!"
33010-187 = "……네."
33010-192 = "그 습격사건의 실행자는 익히 아는 대로 바로 시라스 아즈사…… 아즈사 쨩이었어요."
33010-193 = "……세이아 쨩의 회복실이 폭발한 건 새벽 3시지만, 침입자가 거기에 잠입한 시간은 새벽 2시경."
33010-194 = "약 한 시간 동안 그 침입자, 즉, 아즈사 쨩은 세이아 쨩과 함께 있었던 거예요."
33010-195 = "그 시간 동안 대체 무슨 얘기를 나눈 거죠……?"
33010-196 = "아즈사 쨩은 거기에 대해서 자세하게 이야기해주진 않았지만……."
33010-198 = "상담실"
33010-201 = "시라스 아즈사. 말씀하시죠."
33010-202 = "……."
33010-204 = "다음화;포스트모템 2"
