[translation]
1003606-1 = "피크닉 가방"
1003606-2 = "강변"
1003606-3 = "(시간에 맞춰 강변으로 나가니, 때마침 저 멀리서 다가오고 있던 히나타가 보였다.)"
1003606-4 = "……아! 선생님! 여기에요, 여기!"
1003606-5 = "마침 좋은 곳에서 딱 마주쳤네요. 그렇잖아도 이 자리였으면 좋겠다고 생각하고 있었는데……!"
1003606-6 = "[s1] \"안녕, 히나타.\"\n[s2] \"즐거워 보이네.\""
1003606-7 = "아하하하하……."
1003606-8 = "아하하하하……."
1003606-9 = "호, 혹시 좀 저 들떠 보이는 건가요……? 티 안 내려고 했는데……."
1003606-10 = "뭐, 뭐……. 딱히 대단한 이유로 뵙자고 한 건 아닌데 말이에요."
1003606-11 = "그저, 음……. 그게……."
1003606-12 = "그……."
1003606-13 = "그러니까 그……. 그냥……."
1003606-14 = "[s3] \"……피크닉?\"\n[s4] \"역시 소풍 같은 느낌?\""
1003606-15 = "마, 맞아요! 네! 그, 그런 거에요! 바로 그거!"
1003606-16 = "마, 맞아요! 네! 그, 그런 거에요! 바로 그거!"
1003606-17 = "어떻게 항상 선생님께선 제가 하려는 말을 바로 알아차려 주시는지……."
1003606-18 = "아무튼 선생님께는 늘 도움만 받았으니, 가끔은 이런 것도 좋지 않을까 해서 말이에요."
1003606-19 = "……그래서 나름대로 힘을 좀 내봤어요!!"
1003606-20 = "바로 피크닉 가방입니다!"
1003606-21 = "[s5] \"피크닉 가방? 어디에?\"\n[s6] \"평소와 크게 다르지 않아 보이는데…….\""
1003606-22 = "……네? 늘 들고 다니던 가방 아니냐고요?"
1003606-23 = "……네? 늘 들고 다니던 가방 아니냐고요?"
1003606-24 = "……아."
1003606-25 = "아하하……. 그, 그렇군요. 선생님께서 보시기엔 당연히 그렇게 보이시겠네요."
1003606-26 = "네. 맞아요. 이건 제가 늘 가지고 다니던 유탄기관총 가방이죠."
1003606-27 = "그러니까……. 이게 사실은……. 이렇게 되는 건데……."
1003606-32 = "[ns7] \"히, 히나타……?\"\n[ns8] \"여기서 갑자기!?\""
1003606-33 = "……아. 아뇨. 그런 게 아니에요, 이건……."
1003606-34 = "……아. 아뇨. 그런 게 아니에요, 이건……."
1003606-35 = "그냥 꺼내 두는 것뿐이에요. 이건 이제 옆으로 잘 빼두고……."
1003606-40 = "그럼 이 밑에……."
1003606-41 = "이, 이거예요. 이게 본론인 거예요!"
1003606-42 = "[s9] \"……아. 도시락이다.\"\n[s10] \"밑에 같이 담아두고 있었구나.\""
1003606-43 = "에헤헤……."
1003606-44 = "에헤헤……."
1003606-45 = "가방 자체가 좀 크다 보니, 유탄기관총을 담고 나서도 여분의 공간은 항상 좀 있어서요."
1003606-46 = "평소에는 책이라든가 여벌의 옷 같은 걸 좀 담아두고 다니기도 해요. 은근 편리하다고요?"
1003606-47 = "그럼 이제 다시 이건 가방 안에 넣어 두고……."
1003606-51 = "……에헤헤."
1003606-52 = "그럼 본론으로 돌아가서, 다시 저희의 '피크닉'을 시작해 볼까요?"
1003606-53 = "그, 그렇게 막 자신 있는 요리 실력은 아니지만……."
1003606-54 = "그래도 열심히 만들었으니까요. 선생님께 드리기 위해……."
1003606-55 = "……조, 조금이라도 좋으니……. 맘에 드셨으면 좋겠다고 생각하고 있어요……."
1003606-56 = "그, 그럼……! 선생님……! 제, 제가……. 제가 선생님께……!"
1003606-60 = "아……."
1003606-61 = "[s11] \"……아?\"\n[s12] 얌전히 입을 벌리고 기다린다."
1003606-62 = "아아……!"
1003606-63 = "아아……!"
1003606-65 = "(이후 나란히 앉아 히나타가 싸 온 도시락을 나눠 먹었다.)"
1003606-66 = "(히나타 본인은 자신 없어 했지만, 만들어 온 도시락의 맛은 훌륭했다.)"
