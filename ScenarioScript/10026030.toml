[translation]
10026030-1 = "제3화;조사 포인트 A. 석벽 미로"
10026030-2 = "(일단 가장 가까운 유적지부터 조사를 시작하기로 했다.)"
10026030-6 = "여, 여기……인가요? 그 유적이라는 곳이……?"
10026030-7 = "확실히……. 척 봐도 유적 같긴 한데……."
10026030-8 = "오래되긴 했어도 석벽을 쌓는 양식이나 조형물들이, 확실히 성도회의 유적이네요."
10026030-13 = "음……. 확실히 그래 보이네……. 응응. 그런 것 같아."
10026030-14 = "……음?"
10026030-15 = "코하루 쨩. 알고 있었나요? 여기가 어딘지?"
10026030-16 = "으, 으응……!? 그, 그야 물론이지! 보면 알잖아!? 너희들 다 알고 있는 거잖아!?"
10026030-17 = "왜 나만 모른다고 생각하는 거야……!?"
10026030-18 = "하긴, 모두가 아는 걸 코하루 쨩만 모르는 것도 이상하겠네요. 후후. 대단해요, 대단해."
10026030-19 = "하하하! 당연하지, 당연!"
10026030-23 = "……설마 놀리는 건 아니지……?"
10026030-28 = "[ns1] \"……우이?\"\n[ns2] \"뭔가 골똘한 표정인걸.\""
10026030-31 = "아, 아뇨. 아무것도……. 아닌데요. 딱히 이상한 생각은……."
10026030-32 = "그, 그냥 생각을 좀……. 여기가 고대 성도회의 유적이라고 가정하면……. 그……. 음……."
10026030-33 = "으음……. 지도상으로 보이는 위치나 규모를 봤을 땐……. 뭔가의 미로 형태의 석벽들이니까……."
10026030-34 = "……시험장? 아니면 훈련장……일지도 모르겠군요. 어쩌면 둘 다였을 수도 있고요."
10026030-35 = "아무튼 부지가 넓으니 흩어져서 특이한 점들을 찾아보죠……. 각자 둘러보시고, 다시 여기서 모이기로……."
10026030-36 = "그, 그럼 저는 먼저 이만……."
10026030-40 = "우, 우이 씨……?"
10026030-41 = "후후. 보기보다 활기찬 분이시네요. 혼자가 좋은 걸 보니……."
10026030-42 = "그치만 우이씨 말대로 부지가 넓은 것도 사실이고……."
10026030-43 = "……우선 저희도 흩어져서 한 번 찾아보도록 할까요?"
10026030-51 = "(석벽 미로를 돌아다니며 우이가 말한 '특이한 점'들을 찾아보았다.)"
10026030-52 = "(전체적으로 똑같은 형태의 길이 복잡하게 섞여 있었다. 이끼가 낀 부분들도 있었고, 나무 기둥이 박힌 곳도 있었다.)"
10026030-53 = "(……그런데…….)"
10026030-57 = "[ns3] \"음……. 코하루? 지금은 각자 조사를…….\"\n[ns4] \"아까부터 나만 따라다니는 것 같은데…….\""
10026030-60 = "왜? 무, 무슨 문제 있어?!"
10026030-61 = "아까도 말했잖아!? 선생님과 하나코를 감시하는 게 내 사명이라고!"
10026030-62 = "원래라면 선생님뿐만 아니라 하나코도 옆에 딱 붙어서 감시해야 하지만……."
10026030-63 = "내 몸은 하나니까 어쩔 수 없잖아!? 상황이 이러니까……!"
10026030-64 = "……응?"
10026030-65 = "그, 그럼 왜 하필 선생님인 거냐고? 그, 그거야……."
10026030-66 = "그, 그런 질문은 사형이야! 자꾸 말을 다른 곳으로 돌리지 말라고!!"
10026030-70 = "……!? 히이!?"
10026030-75 = "……아."
10026030-76 = "……어라……. 음? 선생님……?"
10026030-77 = "[s5] \"안녕, 우이.\"\n[s6] \"여기는 길이 서로 이어지기도 하는구나.\""
10026030-80 = "그런가 보네요. 아까 전에는 히나타 씨도 한 번 지나쳤었는데……."
10026030-81 = "꽤나 흥미로운 곳이네요. 일부러 미로처럼 만든 것이, 의도가 궁금해진달까……."
10026030-85 = "음……. 그러고 보니 선생님. 옆에 분은……."
10026030-86 = "……!?"
10026030-87 = "아, 저……. 저요!? 저, 저는……. 그러니까……. 그……."
10026030-88 = "[s7] \"우리도 어쩌다 마주쳤어.\"\n[s8] \"조금 불안해해서 말이야.\""
10026030-91 = "……과연. 그렇군요. 고생 많으십니다……."
10026030-92 = "저는 또 이만……."
10026030-93 = "……네? 같이……요?"
10026030-94 = "같이……. 음……. 같이……. 같이라……."
10026030-101 = "아뇨. 지금은……. 죄송합니다. 저, 저는 혼자 다닐게요. 아무래도 모르는 분은, 역시 좀 불편해서."
10026030-102 = "놀러 온 거라면 참을 생각이라도 하겠지만, 지금은 일하는 중이니……."
10026030-103 = "양해 부탁……드립니다……. 나쁘게 생각하지 말아 주세요. 그럼……."
10026030-107 = "휴우……. 식겁했어……."
10026030-108 = "……응? 나쁜 사람 아니니까 긴장할 필요 없다고?"
10026030-109 = "따, 딱히 긴장한 거 아니거든!? 누가 들으면 사람만 보면 잔뜩 긴장하는 사람인 줄 알겠……."
10026030-113 = "히이이익-!?"
10026030-118 = "……응?"
10026030-119 = "으으응? ……선생님? 그리고 그쪽 분은……. 코하루 씨……셨던가요?"
10026030-120 = "……."
10026030-121 = "……아……. 안녕……하세요……."
10026030-122 = "……안녕하세요? 인사 나누고 다시 이런 데에서 또 만나다니, 재밌는 길이네요!"
10026030-123 = "네, 네……. 그러네요……."
10026030-124 = "[ns] \"………….\""
10026030-128 = "(이후로도 미로 같은 돌담길을 돌아다니며 몇 번이고 우이나 히나타와 마주쳤다.)"
10026030-130 = "[ns9] \"응. 아마도 여기가 마지막이네.\"\n[ns10] \"고생 많았어, 코하루.\""
10026030-133 = "하아……. 피곤해……. 선생님, 이제 거의 끝났지?"
10026030-134 = "……응? 많이 피곤하냐고? 사람 만나느라 고생이었다고?"
10026030-135 = "그, 그 정도는 아니거든!? 나도 중간부터 인사도 했잖아……?"
10026030-136 = "아무리 나라도 그런 식으로 몇 번이나 만나면……."
10026030-140 = "……!!"
10026030-141 = "조, 좋아. 이번에는 내가 먼저 인사를 해줘야겠네! 그러면 되겠지?"
10026030-142 = "잘 지켜보라고 선생님! 내가 먼저 인사하는 걸!"
10026030-148 = "아, 아……."
10026030-150 = "안녕하세……!!"
10026030-153 = "…………."
10026030-154 = "…………."
10026030-155 = "…………."
10026030-159 = "끼야아아아아악!!!!!!!!!!!"
