[translation]
10010070-1 = "제7화;조금 닮은 사람들 1"
10010070-11 = "……음……."
10010070-15 = "……으음……."
10010070-16 = "[s1] \"……우이?\"\n[s2] \"왜 그래? 무슨 일 있어?\""
10010070-17 = "아뇨, 그……."
10010070-18 = "아뇨, 그……."
10010070-23 = "솔직히 놀랐어요. 제 입으로 부탁드린 거긴 하지만……."
10010070-24 = "정말로 구해올 줄이야. 그것도 이렇게나 빨리 말이죠."
10010070-25 = "특히 물이끼 아교……. 사실 이것만 해도 며칠은 걸릴 줄 알았거든요."
10010070-26 = "어째서인지 흙먼지투성이까지 돼서는……. 이렇게 열심히……."
10010070-27 = "아하하……. 감사합니다. 저희도 저희대로 절실하다 보니……."
10010070-28 = "어……. 그게 그……."
10010070-29 = "……아니. 아무래도 상관없겠죠. 어쩌면 제가……. 조금 잘못 보고 있었을지도 모르겠네요."
10010070-30 = "꽤나……. 진심이셨군요. 두 분 모두……."
10010070-31 = "……고생하셨어요."
10010070-32 = "……?"
10010070-36 = "[ns] \"……우이……?\""
10010070-42 = "그리고 이 케이크도……. 어딘가 좀 너덜너덜한 상태인 것 같긴 하지만……."
10010070-44 = "그, 그건……."
10010070-48 = "……뭐, 선생님도 함께 계셨는데, 나름대로 이유가 있었겠죠. 이게 최선이었을 거라 생각합니다."
10010070-49 = "게다가 저야 어차피 앉아서 받아먹는 입장이고……. 아무튼 잘 먹겠습니다. 감사해요."
10010070-50 = "우이 씨……."
10010070-51 = "……아. 물론 그렇다고 해도, 지금 화기애애하게 잡담이나 하고 있을 여유는 없지만요."
10010070-52 = "시간이 없다는 건……. 저보다 여러분이 더 잘 아실 테고……."
10010070-53 = "필요한 게 다 모인 건 아니니까요. 이거만 가지고는 아무것도 되지 않아요."
10010070-54 = "……정성약. 알고 계시죠?"
10010070-55 = "……네, 네……."
10010070-57 = "뭐, 이번에도 어떻게 잘 해내실 것 같지만……."
10010070-58 = "……?"
10010070-62 = "……아뇨."
10010070-63 = "……기다리고 있겠습니다."
