[translation]
80000126-1 = "3신기"
80000126-4 = "안녕하세요, 선생님! 저 왔어요!"
80000126-5 = "[s] \"어서 와! 그런데 무슨 일이야?\""
80000126-6 = "그건 말이죠! 그, 그러니까……."
80000126-7 = "……."
80000126-10 = "(우, 우와……. 분명히 각오는 했는데! 머릿속으로 몇 번이나 상황극을 해 보기도 했는데……!)"
80000126-11 = "(막상 선생님 앞에 서니까, 용기가 나지 않아……!)"
80000126-12 = "(어, 어떡하지? 역시 간단하게 인사만 드리고 돌아갈까……?)"
80000126-13 = "(아니야! 아무리 생각해도 역시 그건 아니야!)"
80000126-16 = "[ns] \"레이야?\""
80000126-17 = "?!?!!!"
80000126-18 = "그, 저기, 선생, 님? 그러니까 그게, 오늘은 그러니까, 그런 날이잖아요?"
80000126-19 = "[s] \"그런 날?\""
80000126-20 = "바, 바, 바……."
80000126-21 = "발렌타인, 데이요!"
80000126-22 = "죄, 죄송해요! 목소리가 너무 컸죠? 으, 우우……."
80000126-23 = "그러니까, 그래서 말인데요! 저, 이런 걸 만들어 봤는데……."
80000126-24 = "받아 주시면, 감사하겠습니다!"
80000126-25 = "(레이가 돌연, 작은 초콜릿 색 글러브……? 를 내밀었다.)"
80000126-30 = "헤, 헤헤……. 해냈네요. 휴우……."
80000126-31 = "[s1] \"글러브 초콜릿……? 이구나?\"\n[s2] \"고마워. 잘 먹을게.\""
80000126-36 = "!!!"
80000126-37 = "네! 감사합니다!"
80000126-38 = "예? 직접 만든 거냐고요? 이런 모양의 초콜릿은 보통 팔지 않으니까……?"
80000126-39 = "……."
80000126-40 = "그게, 그렇게 우길 수 있는 부분도 있고, 다시 생각해 보면 영 아닌 부분도 있긴 한데요……."
80000126-42 = "(점점 더 영문을 알 수 없어서, 자세히 물어보았다.)"
80000126-45 = "우선 이 글러브는, 제가 예전에 쓰던 글러브 모양을 본뜬 거예요."
80000126-46 = " ……그러니까 그걸 3D 스캔해서, 축소 모형을 그래픽화 시켰다는 뜻이죠."
80000126-47 = "………그리고 그 축소 모형을 다시 3D 프린터로 출력한 다음."
80000126-48 = "…………그걸 바탕으로 틀을 만드는 것까지, 전부 AI에게 시켜서……."
80000126-49 = "저에게 그 정도의 손재주가 있을 리는 없으니까요……."
80000126-50 = "무, 물론 모형에다 사포질해서 표면을 다듬는 정도는 했지만 말이죠?"
80000126-51 = "결국 제가 한 일은 그냥, 틀에다 녹은 초콜릿을 부어 넣은 게 전부라고 볼 수도 있는 것이었거든요……."
80000126-52 = "이래서야 수제인지 뭔지도 잘 모를 지경이네요. 하아……."
80000126-53 = "[s3] \"아니야. 그 정도면 충분해.\"\n[s4] \"고생 많이 했겠다. 고마워.\""
80000126-56 = "정말, 요?"
80000126-57 = "헤헤……."
80000126-58 = "그러면 말이죠! 사실 이런 것도 있어요!"
80000126-63 = "[ns] \"글러브에 배트에 야구공 초콜릿……?\""
80000126-64 = "네! 제가 생각한, 야구용품의 3신기죠!"
80000126-65 = "이 세 가지만 있으면, 언제든 누구와도 야구를 할 수 있거든요!"
80000126-66 = "이렇게~ 야구공을 글러브 쪽으로 굴리고~ 배트로 그걸 치면~"
80000126-67 = "노마사 레이 선수! 안타입니다! 유격수 키를 넘기는 안타!"
80000126-68 = "레이 선수, 빠릅니다! 과연 2루까지 달릴 수 있을 것인가!"
80000126-70 = "(마음 놓고 즐거워하는 레이와 함께, 야구용품 3신기 초콜릿을 나누어 먹었다.)"
80000126-71 = "(레이는 초콜릿을 먹으면서도, 계속해서 눈을 빛내며 야구 놀이를 즐겼다.)"
