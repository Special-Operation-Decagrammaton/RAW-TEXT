[translation]
1006603-1 = "공부! 메이드 대작전!"
1006603-2 = "(아리스의 연락을 받고 게임개발부로 향했다……)"
1006603-8 = "게임개발부 부실"
1006603-9 = "선생님! 기다리고 있었습니다."
1006603-10 = "생각보다 빨리 오셨네요. 서두르신 모양입니다. 무슨 일이라도 있었습니까?"
1006603-11 = "[s1] \"그게, 메이드 자료라고 하니까 말이지……\"\n[s2] \"아리스 혼자 공부하게 둬서는 안 될 것 같았어.\""
1006603-14 = "그렇습니까? 하지만 아리스도 좋습니다."
1006603-15 = "공부는 함께 할수록 효과가 좋아진다고도 들었으니까요!"
1006603-19 = "아리스가 찾아낸 자료들은……!"
1006603-28 = "뽜밤뽜밤! 이것입니다!"
1006603-29 = "[s] \"이건…… 설마?!\""
1006603-30 = "그렇습니다! 다양한 메이드 씨들이 나오는 영상 매체들입니다!"
1006603-31 = "이 매체들로 공부하면…… 메이드로서 아리스의 경험치가 더욱 올라갈 것임에 틀림없습니다!"
1006603-32 = "말하자면, 경험치 책 같은 것이니까요!"
1006603-33 = "<가면의 메이드레이디>, <마보로매틱>, <타치바나 메이드대>……"
1006603-34 = "특별히 엄선 받은 추천작들만 모았습니다!"
1006603-35 = "[s] \"우선 말이지! 그거 어디에서 추천받은 거야?!\""
1006603-36 = "네? 그야 당연히 인터넷에서입니다."
1006603-37 = "인터넷에서는 뭐든지 검색하면 나옵니다. 정말로 편리합니다!"
1006603-38 = "[s] \"그렇다면 더더욱 위험하다는 생각이 드는데!?\""
1006603-39 = "위험…… 입니까? 아리스는 잘 모르겠습니다."
1006603-40 = "어떤 분은 이 매체들로 인해 인생이 바뀌었다며 감동적이었다는 리뷰를 쓰기도 했습니다."
1006603-41 = "[s] \"분명 그런 사람도 있겠지만! 이해가 가는 면도 없잖아 있지만!\""
1006603-42 = "사람을 감동시키고 인생을 바꾸는 작품이라니, 아리스도 기대가 됩니다! 아리스도 비슷한 경험이 잔뜩 있었으니까요!"
1006603-43 = "그리고 위험하다고 해도 아리스는 끄떡없습니다! 아리스는 견습이지만 용사입니다! 이제는 메이드에 도전하고 있습니다! 스스로의 몸은 스스로가 지킬 수 있습니다!"
1006603-44 = "네? 그런 의미의 위험이 아니라고 하셨습니까? 음…… 잘 모르겠습니다. 그렇다면 선생님께서 도와주시면 되지 않습니까?"
1006603-45 = "평소에 선생님이 자주 했던 말입니다! 학생을 돕는 것은 선생님의 의무라고!"
1006603-46 = "[s3] \"여기서 그 말을 꺼내 버리면 할 말이 없긴 한데!\"\n[s4] \"……그래. 차라리 보호자가 있는 편이 나을 수도 있지……\""
1006603-49 = "그렇다면 선생님도 함께해 주시는 겁니까? 그렇다고요?"
1006603-50 = "와아! 해냈습니다! 이것으로 아리스는 한층 더 성장할 수 있습니다!"
1006603-51 = "선생님이 동료가 되었습니다! 뽜밤뽜밤!"
1006603-53 = "(그렇게, 아리스와 함께…… 조금…… '특별한' 매체들을 감상하기 시작했다……)"
1006603-55 = "……"
1006603-56 = "[s] \"……\""
1006603-57 = "………"
1006603-58 = "[s] \"저기, 아리스……?\""
1006603-59 = "…………"
1006603-60 = "[ns] \"아리스? 아리스?!\""
1006603-61 = "아리스, 깨달았습니다!"
1006603-62 = "[s] \"우왓?!\""
1006603-63 = "메이드라는 건 이런 것이었군요! 깊고, 심오합니다!"
1006603-64 = "아리스는 지금까지 아무것도 모르고 있었군요! 우선은 선생님을 부르는 방법부터 바꿔야겠습니다."
1006603-65 = "주인님!"
1006603-66 = "[s] \"아리스……? 그 호칭은 조금……?\""
1006603-67 = "그리고 제가 실수라고 생각했던 것들도, 사실은 메이드의 기본 소양이었던 거군요!"
1006603-68 = "실수로 다른 메뉴를 가져다준다던가, 균형을 잃고 넘어지며 몸을 부딪쳐 온다던가, 덜렁이다가 음식에 엉뚱한 소스를 섞는다던가!"
1006603-69 = "그 모두가 사실은 마음을 치유하는 귀여운 서비스라는 것이군요!"
1006603-70 = "[s] \"그거 정말로 위험하니까! 그런 거 아니니까!\""
1006603-72 = "(그 밖에도 아리스는 무수한 '메이드'로서의 소양을 이야기했다……)"
1006603-73 = "(아리스의 오해를 바로잡기까지, 상당히 많은 시간이 소요되었다……)"
1006603-75 = "오늘은 정말 즐거웠습니다. 선생님."
1006603-76 = "메이드에 대해 더 잘 알게 된 날이었습니다!"
1006603-77 = "[s] \"그래…… 아리스가 좋다면야……\""
1006603-78 = "왜 그렇게 하얗게 불타 버리셨습니까? 잿가루가 떨어질 것 같습니다……"
1006603-79 = "새로운 것을 배우는 건 즐거운 일인데, 선생님은 즐겁지 않았나요……?"
1006603-80 = "혹시, 아리스, 때문인가요……?"
1006603-81 = "[s5] \"아니야. 나도 즐거웠어.\"\n[s6] \"다음에도 이런 일이 생길 것 같으면, 꼭, 꼭, 꼭, 불러 줘.\""
1006603-84 = "그렇습니까? 잘 되었습니다."
1006603-85 = "역시 아리스는 선생님이 있어 줄 때가 제일 좋습니다."
1006603-86 = "앞으로도 잘 부탁드립니다."
1006603-87 = "주인님!"
