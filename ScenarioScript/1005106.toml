[translation]
1005106-1 = "불타는 단장의 응원가"
1005106-6 = "밀레니엄 학원 인근 노래방"
1005106-8 = "[ns1] \"……그래서?\"\n[ns2] \"……어째서 노래방인 거지?\""
1005106-11 = "어째서냐니? 기운 없는 후배들을 응원해 줄 방법을 찾아보자고 했던 건 선생님이잖아."
1005106-12 = "응원이라고 하면 응원가. 응원가 하면 노래니까……"
1005106-13 = "노래방에 오는 게 당연하지!"
1005106-17 = "[ns3] \"……그게 무슨 관계인데?\"\n[ns4] \"……조금 전부터 대화를 못 따라가겠어.\""
1005106-18 = "왜, 신나는 노래를 들으면 기분이 좋아지잖아?"
1005106-19 = "왜, 신나는 노래를 들으면 기분이 좋아지잖아?"
1005106-20 = "내가 가지고 있는 기술들을 모두 동원하더라도 후배들이 가진 고민을 완벽히 없애줄 수는 없겠지만……."
1005106-21 = "최소한 기분만큼이라도 전환할 수 있도록 신나는 노래를 들려주면 좋지 않을까 싶어서."
1005106-22 = "……이왕이면 엔지니어부의 활동을 가사로 담은 오리지널 곡으로 말이야."
1005106-23 = "[s] \"오리지널 곡?\""
1005106-24 = "후후, 사실은 전부터 엔지니어부의 주제곡을 만들어보고 싶다는 생각을 했었거든."
1005106-25 = "그래서 이참에 엔지니어부의 활약을 담은 주제곡을 만들어 볼까 싶어서."
1005106-26 = "[s] \"우타하가 작곡을……?\""
1005106-27 = "그게 그렇게 의아한 일인가?"
1005106-28 = "음악을 다루는 일과 기계를 다루는 일은 본질적으로 크게 다르지 않아."
1005106-29 = "엔지니어가 부품을 조합해서 최적의 설계를 완성하는 것처럼, 음악가는 화성을 조합해서 가장 듣기 좋은 곡을 완성하는 거지."
1005106-30 = "게다가 지휘자를 뜻하는 '마에스트로'라는 단어와 '마이스터'라는 단어는 어원이 같으니까."
1005106-31 = "후후…… 만약 내가 밀레니엄 학원이 아닌 와일드헌트 학원에 입학했더라면, 마이스터가 아니라 마에스트로가 되었을지도 몰라."
1005106-32 = "[s] \"…….\""
1005106-33 = "……왜 그래? 뭔가 안 좋은 기억이라도 떠오른 거야?"
1005106-34 = "여하튼, 머릿속에 떠오른 가사에 가볍게 멜로디를 붙여 보았으니 선생님이 한번 들어줘."
1005106-40 = "제목은…… <불타는 마이스터의 혼>"
1005106-49 = "― 마이스터의 뜨거운 혼을 담아"
1005106-52 = "― 여러분의 물건을 개조해 드립니다"
1005106-56 = "― 원하지 않아도 개조해 드립니다"
1005106-59 = "[ns] \"……….\""
1005106-61 = "― 움직여야 하는 곳엔 그리스 오일"
1005106-64 = "― 고정돼야 하는 곳엔 덕트 테이프"
1005106-68 = "― 누구나 간단하게 수리할 수 있지만"
1005106-71 = "― 확실한 성능을 원한다면 저희를 찾아주세요"
1005106-74 = "[ns] \"……잠깐 기다려줘, 우타하.\""
1005106-79 = "……뭐야, 선생님. 마침 클라이맥스가 시작되려는 참이었는데."
1005106-80 = "아니면 내 노래에 무슨 문제라도 있는 거야?"
1005106-81 = "[s5] \"……멜로디랑 박자가 안 맞아.\"\n[s6] \"가사가 이상해…….\""
1005106-82 = "응? 박자가 안 맞는다고?"
1005106-83 = "그건 아마도…… 가사에 담긴 열정이 멜로디 이상으로 불타올라서 그런 게 아닐까?"
1005106-84 = "응? 가사의 내용을 이해하기 어렵다고?"
1005106-85 = "그건 아마도…… 멜로디에 담긴 열정이 가사를 압도해서 그런 게 아닐까?"
1005106-86 = "아직은 조정 중이니 좀 더 개선하면 나아질 거야."
1005106-87 = "일단은 노래를 들어줘. 후렴구까지 모두 듣고 나면 선생도 이 노래의 진가를 이해할 수 있을 테니까."
1005106-88 = "……그럼, 계속할게."
1005106-93 = "― 끓어오르는 차바스코! 흩날리는 파마산 가루!"
1005106-96 = "― 열정만 있다면 무엇이든 개조할 수 있으니까—"
1005106-100 = "[ns] \"어째서 차바스코……?\""
1005106-102 = "(이후, 우타하의 이상한 노래는 한 시간 넘게 계속되었다…….)"
1005106-103 = "(……뒤늦게 알게 된 내용에 따르면, 엔지니어부의 부원들이 기운이 없었던 이유는 우타하가 작업실에서 이상한 노래를 부르고 다녀서였던 것으로 밝혀졌다…….)"
