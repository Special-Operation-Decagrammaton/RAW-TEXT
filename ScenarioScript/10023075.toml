[translation]
10023075-3 = "큭, 이런……!"
10023075-4 = "쉽지 않은 전투였습니다만, 어떻게든 해냈군요."
10023075-5 = "메이타로 씨. 당신에게 묻고 싶은 것이 몇 가지 있습니다."
10023075-6 = "어떻게 이 장물들이 여기에 있는 것인지, 설명을 부탁드려도 되겠습니까?"
10023075-7 = "으으음……"
10023075-8 = "이 방법까지 쓰게 될 줄은 몰랐습니다만."
10023075-14 = "사실은 산해경의 현룡문에 의뢰해서, 그곳의 경비원에게 협력을 요청했지요!"
10023075-16 = "산해경? 현룡문……?"
10023075-17 = "[s1] \"어떤 의미로는 정말 주도면밀하네.\"\n[s2] \"쓸 수 있는 수단은 다 쓰겠다는 생각이었나!\""
10023075-24 = "예비대! 응전을 준비하십시오!"
10023075-32 = "게스트들 중 일부가……!"
10023075-33 = "산해경…… 현룡문의 경비원들이었어……"
10023075-43 = "어, 어떡하죠. 선생님? 숫자가 너무 많아요!"
10023075-44 = "파워드 슈트만 있었더라도……!"
10023075-53 = "뭐, 뭔가요?! 이건?!"
10023075-57 = "이리로."
10023075-58 = "[s] \"……?! 그 목소리는……!\""
10023075-70 = "(앞이 보이지 않을 정도의 연막을 뚫고, 간신히 저택에서 빠져나왔다……)"
10023075-74 = "헉, 헉……"
10023075-75 = "완전히 지쳤어요……"
10023075-77 = "으우우. 더는 못 뛸 것 같아요……"
10023075-78 = "파란만장한 저녁이었군요."
10023075-79 = "이미 밤이 된 것 같긴 합니다만."
10023075-80 = "다들 괜찮은 겁니까? 선생님은요?"
10023075-81 = "[s3] \"모두 수고했어.\"\n[s4] \"또 다른 손님이 와 계신 것 같지만 말이야.\""
10023075-87 = "그게 무슨 소리야, 선생님?"
10023075-92 = "우연, 변덕, 무작위, 비재현성…… 이미 당당히 한 축으로 자리한, 미학의 요소죠."
10023075-96 = "누구죠?"
10023075-103 = "후후. 평안하신지요. 이렇게 만나리라고는 서로 상상도 하지 못했던 분들."
10023075-111 = "서, 서서서서서, 선생님?! 이게 대체 어떻게 된 거야?!"
10023075-112 = "[s5] \"모모이. 심정은 이해하지만……\"\n[s6] \"우리는 자애의 괴도 덕분에 빠져나올 수 있었어.\""
10023075-116 = "화, 확실히 그 연막은……!"
10023075-118 = "없어요…… 여기엔 아무도 없어요……"
10023075-124 = "[ns7] \"도와줘서 고마워.\"\n[ns8] \"그런데, 왜 우리를 도와준 거야?\""
10023075-127 = "좋아요. 어느 정도 설명을 해 드리는 것이, 오해를 푸는 첫걸음이 되겠지요."
10023075-128 = "어떤 일로 인해…… 저는 여러분들이 메이타로에게 속고 있다는 것을 알게 되었답니다."
10023075-132 = "(자애의 괴도가 그렇게 말하면서 눈짓을 보내왔다.)"
10023075-137 = "(자애의 괴도와 '가제트'로 대화를 나누었던 일이 떠올랐다……)"
10023075-138 = "그래서 저는, C&C는 물론 선생님 역시 싸움의 대상이 아니라는 것을 깨달았죠."
10023075-139 = "그래서 지하 경매장의 존재를 알려 드렸던 거예요. 진정한 적이 누구인지, 우리가…… 함께 싸워야 하는 대상이 무엇인지 가르쳐 드리려고요."
10023075-140 = "하는 김에 거기, C&C분이 뒤쫓고 있는 예술품들의 행방이 어떻게 되고 있는지도 알려 드릴 겸 해서요."
10023075-142 = "우아아…… 한꺼번에 너무 많은 정보가 몰려서 뭐가 뭔지 모르겠어!"
10023075-143 = "결과적으로…… 지금은 저희끼리 싸우고 있을 때가 아니라는…… 뜻인가요?"
10023075-148 = "약은 수를 쓰는군요. 자애의 괴도."
10023075-149 = "어머나? 무슨 의미이신가요?"
10023075-151 = "적의 적은 아군으로 생각할 수 있다지만, 언제나 그런 것은 아니죠."
10023075-153 = "저…… 자애의 괴도, 씨는, 일곱 죄수 중 한 분이신…… 거죠?"
10023075-154 = "그, 그렇다면……"
10023075-156 = "후후."
10023075-163 = "어떤 말씀을 하고 싶으신 거죠?"
10023075-164 = "일곱 죄수 같은 위험 요소와는 말을 섞고 싶지 않다? 범죄자라고 불리는 사람과는 같은 자리에 있고 싶지 않다?"
10023075-166 = "아우우……"
10023075-168 = "당신이 일곱 죄수 중 한 명인 것은 변함이 없고, 당신이 C&C가 되찾아야 할 <시계왕의 왕관>을 노리고 있다는 사실 역시 마찬가지입니다."
10023075-169 = "그런 사람이 무슨 생각을 하는지는, 주의를 할 필요가 있지요."
10023075-170 = "[s9] \"자, 자. 그래서 이 시점에서 말이야……\"\n[s10] \"제안을 하나 하고 싶어.\""
10023075-173 = "제안…… 입니까?"
10023075-174 = "어머나? 샬레의 선생님의 제안이라니, 어디 들어 보도록 하죠"
10023075-176 = "[ns] \"여기서는 동맹을 맺자.\""
10023075-184 = "확실히, 사태는 저희가 생각했던 것과는 완전히 다르게 전개되고 있습니다."
10023075-185 = "하지만 상대는 일곱 죄수. 범죄자입니다. 그런 수상한 자와 동맹이라니."
10023075-186 = "후후, 저는 마음에 드는데요?"
10023075-187 = "아니면 다른 누군가께서는 속이 좁아서 이해를 못하시는 건가요?"
10023075-188 = "……선생님. 지금, 범죄자에 대한 배제 행동에 들어가도 괜찮겠습니까?"
10023075-189 = "[s11] \"자, 자. 양쪽 다 진정하고.\"\n[s12] \"일단 서로 알고 있는 것들을 이야기해 보자.\""
10023075-192 = "……좋아. 선생님이 그렇게 말한다면야."
10023075-193 = "우리는…… 밀레니엄 사이언스 스쿨의 게임개발부야."
10023075-194 = "어쩌다 보니 C&C라는 동아리로 오해를 받아서…… 당신으로부터 저 저택을 지켜 달라는 의뢰를 받았어."
10023075-195 = "당신이 예고장을 보내서, 어떤 그림을 훔칠 거라는 이야기를 들었거든."
10023075-196 = "그런데 어쩌다 지하로 이어지는 통로를 찾아서 내려가 봤더니…… 3일째에 열린다는 경매가 하루 빨리 열리고 있었고, 갑자기 메이타로 씨에게 공격당하고……"
10023075-197 = "우우우, 어쩌다 이렇게 된 거야……!"
10023075-199 = "짐작하고는 있었지만, 당신들 정말 아무것도 몰랐군요."
10023075-200 = "어, 어쩔 수 없잖아! 아무도 말해 주지 않았는데!"
10023075-201 = "그런 것 치고는, 그럭저럭 제 예고장을 읽어내셨더군요?"
10023075-202 = "흐, 흥!"
10023075-203 = "당연하잖아. 이미 무수한 퍼즐 어드벤처 게임에 단련된 몸, 그 정도 수수께끼야 우리 게임개발부에게 걸리면 아무것도 아니라고!"
10023075-204 = "뭐, 좋아요."
10023075-207 = "저는 처음부터 지하의 비밀 경매장을 노리고 있었어요."
10023075-208 = "그곳은 불법적인 경로로 입수된 장물들이 비밀리에 거래되고 경매되는 곳……"
10023075-209 = "저택의 주인인 도다 메이타로에게 관리되는 곳이죠."
10023075-210 = "……그 정보는 틀리지 않았던 것으로 보입니다."
10023075-211 = "누가 뭐라고 해도, C&C가 쫓고 있었던 장물들이 한자리에 모여 있었으니까요."
10023075-212 = "그러면, 미술품 전시회는?"
10023075-215 = "일종의 시선을 돌리기 위한 미끼였겠지요."
10023075-216 = "어쨌든, 저는 <시계왕의 왕관>이라고 불리는 물건을 노리고 있었답니다."
10023075-217 = "전 키보토스에 하나밖에 존재하지 않는다는 <시계왕의 왕관>……"
10023075-218 = "그런 것을 누군가가 독점하고 멋대로 가치를 측정한다니, 제 미학에는 맞지 않아요."
10023075-220 = "이제 알겠나요?"
10023075-221 = "여러분은 이용당하고 있었던 거예요."
10023075-222 = "메이타로는 교활한 자입니다. 여러분이 생각하는 것보다 더요."
10023075-223 = "으으으…… 하지만 아직 당신 말을 곧이곧대로 믿기는 어려운걸!"
10023075-224 = "후후. 그렇군요. 얼마든지 그렇게 생각하실 수 있죠."
10023075-225 = "그렇지만 당신들을 습격하려 했던 자와 구하려고 했던 자……"
10023075-226 = "어느 쪽의 말을 신용할 수 있을지는, 조금만 생각해 보면 알 수 있지 않을까요?"
10023075-227 = "[s13] \"미도리를 구해 줘서 고마워.\"\n[s14] \"그런데, 그 이유를 물어도 될까?\""
10023075-230 = "간단해요."
10023075-231 = "가치 있는 것을 눈앞에 두고 쓸데없는 피를 흘리게 하는 건, 제 미학에 부합하지 않기 때문이에요."
10023075-232 = "[s] \"미학…….\""
10023075-233 = "후후,"
10023075-240 = "그래서 저는 샬레의 선생님이 해주신 제안이 마음에 드는데, 여러분께서는 어떠신가요?"
