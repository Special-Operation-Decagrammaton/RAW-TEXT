[translation]
10044055-2 = "크윽, 이게 무슨……!"
10044055-3 = "이런 꼬맹이들한테 당할 줄이야……"
10044055-4 = "하, 하지만 이대로 끝날 거라 생각하지 마라……! 우리 총장이 곧……"
10044055-13 = "파햐햐! 선생님, 지휘 좋았어!"
10044055-14 = "이, 이게 선생님의 바로 그 지휘…… 대단해……"
10044055-15 = "핫, 그런데 좀 이상하지 않아요?"
10044055-16 = "이 사람들, 너무 뜬금없이 등장해서…… 대체 폭주족이 왜 이런 곳에……?"
10044055-17 = "깨워서- 물어볼까-?"
10044055-18 = "뭐, 상관있나? 세상에 이상한 일이 한둘도 아니고."
10044055-19 = "으…… 뭔가 이걸로 끝이 아닐 것 같은 느낌이……"
10044055-21 = "이, 일단 빨리 열차에 타서 출발하는 편이 좋지 않을까요, 여러분……!"
10044055-22 = "뉴스를 본 문제아들이 계속 이쪽으로 몰려오고 있다나 봐요."
10044055-23 = "아, 그러네. 지금도 꽤 늦었으니까."
10044055-24 = "발차 오라이-"
10044055-25 = "그, 그래요. 일단 빨리 출발하고 보자구요……!!"
