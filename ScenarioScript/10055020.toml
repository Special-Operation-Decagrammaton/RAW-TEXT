10055020-113 = "……老師，方便進來一下嗎？我有事想跟你商量。"
10055020-116 = ""
10055020-117 = "……這裡的話應該沒問題。"
10055020-118 = "嗯，我找你過來的時候，你應該就猜到了吧。"
10055020-119 = "其實我一直瞞著其他人，偷偷把物資藏起來。"
10055020-120 = "像是把4人份分得看起來像5人份，或者把原本菜單裡的甜點拿掉之類的。"
10055020-121 = "至於為什麼要這麼做……"
10055020-122 = ""
10055020-124 = ""
10055020-125 = "不是啊，照理來說都遇難了，如果還一餐不漏地照著郵輪的豪華菜單吃才奇怪吧？"
10055020-126 = "[s7] 「說的也是！」\n[s8] 「其他人知道這件事嗎……？」"
10055020-129 = "沒有人知道。畢竟物資本來就是我一個人在管理。"
10055020-130 = "首先，讓真琴前輩發現絕對沒好事。"
10055020-131 = "皐月前輩難以預料，他會怎麼行動的變數實在太多了。"
10055020-132 = "千秋還算可以溝通，但不擅長說謊的他不適合保守秘密。"
10055020-133 = "還有……"
10055020-134 = "啊！老師！"
10055020-136 = ""
