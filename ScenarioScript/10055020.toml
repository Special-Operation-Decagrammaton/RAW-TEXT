[translation]
10055020-1 = "2화;5소녀 표류기"
10055020-5 = "……몇 번을 해봐도 똑같네요."
10055020-6 = "완전히 먹통이에요. 통신 장치도 멈췄고요."
10055020-7 = "고칠 수는 없어?"
10055020-8 = "점검을 더 해봐야 알 것 같지만…… 전차장으로서 사전 진단해 보자면, 네."
10055020-9 = "엔진 수명이 다했다는 느낌입니다."
10055020-10 = "그게 무슨 뜻인데? 고칠 수 있다는 거야, 없다는 거야?"
10055020-11 = "고칠 수 있습니다. 어디서 멀쩡한 새 엔진이나, 최소한 불량 난 부분만이라도 교체할 부품만 조달할 수 있다면요."
10055020-12 = "이 망망대해 어디서?"
10055020-13 = "네, 그러니까 불가능하겠죠."
10055020-14 = "……이로하 쨩, 혹시 화났어?"
10055020-15 = "…………."
10055020-16 = "……하아. 죄송합니다. 저답지 않게 머리에 열이 올랐네요."
10055020-17 = "애초에 다 같은 피해자 신세에다, 일을 저지른 장본인이 속 편히 자고 있는 시점에 무슨 말을 할까요?"
10055020-21 = "우선, 상황 정리부터 하자."
10055020-22 = "치아키는 가서 마코토 쨩을 깨워서 데려와 줘."
10055020-23 = "명 받들겠습니다앗~!"
10055020-28 = "이로하는 배에 비축된 물자를 확인해줘. 정말 표류 상황이라면, 남은 물자만큼 중요한 정보는 없으니까."
10055020-29 = "아, 그리고 수리에 쓸 수 있는 예비 부품 같은 건 없는지 한 번 더 찾아보고."
10055020-30 = "어쩌다 여름휴가가 이런 귀찮은 일이…… 어쩔 수 없네요. 다녀오겠습니다."
10055020-35 = "당장 할 수 있는 일은, 이 정도일까?"
10055020-36 = "[s] \"사츠키는 꽤 차분해 보이네.\""
10055020-37 = "그럴 리 없잖아. 나라도 불안하다고."
10055020-38 = "가만히 있는다고 상황이 나아지는 것도 아니니 움직일 뿐이야."
10055020-39 = "평소 같았으면 마코토 쨩이 어떻게든 해줬을 텐데……."
10055020-40 = "응? 마코토 쨩을 신뢰하는지?"
10055020-41 = "그야 당연하잖아? 마코토 쨩은 엄청 대단한 사람인걸."
10055020-42 = "[s1] \"그 마코토인데……?\"\n[s2] \"그 신뢰의 출처가 의문인 거지만…….\""
10055020-45 = "흐응……? 역시 샬레의 선생 정도 거물이라면, 사람을 보는 관점도 특별한 걸까?"
10055020-46 = "흥미는 제법 있지만…… 현 상황을 타개하는 데는 도움이 될 것 같지는 않네."
10055020-47 = "그 부분은 육지로 돌아간 후에, 차차 캐내어 보는 걸로 하고……."
10055020-48 = "……지금은, 그렇네."
10055020-49 = "일단, 마코토 쨩이 깨어날 때까지 기다리는 수밖에."
10055020-51 = "……과연, 이 몸이 모르는 사이에, 그런 일이."
10055020-55 = "이로하! 어째서 바로 알리지 않았지?"
10055020-56 = "보고! 연락! 상담! 사회인의 기본 아닌가!"
10055020-60 = "알리고 자시고 간에, 저희도 방금 알았거든요?"
10055020-61 = "그리고 애초에 마코토 선배는 뱃멀미로 계속 뻗어 있었잖아요."
10055020-62 = "에에잇! 정해진 대답밖에 못 하는 거냐! 이 관료주의의 개가!"
10055020-63 = "……조금 전까지 그 관료주의를 관통하는 대사를 말하던 사람이 할 소린가요?"
10055020-64 = "사소한 문제로 따지고 들지 마라!"
10055020-65 = "현재 상황은 어떻지, 사츠키?"
10055020-66 = "엔진은 정지, 육지와는 통신두절…… 그야말로 표류 상태라는 느낌이네."
10055020-67 = "그나마 낙관적인 부분은, 물자가 제법 넉넉하다는 걸까?"
10055020-68 = "넉넉하다 해도 일주일 치 정도지만요. 애초에 이런 배로 장기 여행은 무리였고, 대부분 육지에 놓고 왔으니까요."
10055020-69 = "일주일? 뭐야, 그 정도면 아무 문제도 없겠군."
10055020-70 = "…………."
10055020-71 = "키시싯, 영문을 모르겠다는 표정이군. 하지만, 이로하. 상식적으로 생각해 봐라."
10055020-72 = "다른 이도 아닌 우리 만마전 임원 전원이 연락두절되는 전대미문의 사태다. 하루이틀씩도 아닌 일주일이나 말이다."
10055020-73 = "만마전은 물론이고, 게헨나 학원 전체에서 총력을 다해 수색하겠지."
10055020-74 = "어라? 저희 그렇게 중요한 위치에 있었나요?"
10055020-75 = "만마전의 서기씩이나 되어 무슨 얼빠진 소리를 하는 거냐? 그야 당연한 것 아닌가."
10055020-76 = "듣고 보니, 확실히 그렇네. 괜히 걱정했어."
10055020-77 = "그러니까, 우리는 일주일 동안 여유롭게 바캉스를 즐기면 된다는 말씀!"
10055020-78 = "……항상 이런 식이네요."
10055020-79 = "응? 뭐지? 그 불만에 찬 눈은?"
10055020-80 = "딱히. 아무것도 아니에요."
10055020-81 = "하지만, 일리는 있네요. 다행히 먼 바다로 나온 것도 아니니, 운이 좋으면 고기잡이를 하러 나온 주민들에게 구조될 수도 있고."
10055020-82 = "어쩌면 순찰 중인 오디세이아 해양학원의 도움을 받을 수도 있을 테니까요."
10055020-83 = "키시싯! 이제 알았나? 만에 하나라도, 이 몸이 하는 일이 잘못될 리는 없는 거다!"
10055020-84 = "다들 안심하고 바캉스를 즐기도록!"
10055020-86 = "[log]표 류  4 일 차[/log]"
10055020-90 = "…………"
10055020-91 = "…………."
10055020-92 = "시간, 꽤 지났군."
10055020-93 = "네, 지났네요."
10055020-94 = "식량, 꽤 줄었군."
10055020-95 = "네, 줄었네요."
10055020-96 = "조금, 실로 아주 조금이지만."
10055020-97 = "어쩌면, 위험한 상황 아닌가?"
10055020-98 = "아니요, 엄청나게 대위기입니다."
10055020-100 = "[ns3] \"괘, 괜찮아!\"\n[ns4] \"금방이라도, 구조대가……!\""
10055020-103 = "……위로할 셈이라면, 최소한 눈을 마주치면서 말해주세요."
10055020-104 = "그나마 위안이라면, 비축 물자가 꽤 남은 정도려나요."
10055020-105 = "아마 일주일, 네, 그 정도는 버틸 수 있을 겁니다."
10055020-106 = "[s5] \"첫날에도 일주일이라 하지 않았어?\"\n[s6] \"왜 아직도 그만큼이나……?\""
10055020-109 = "그건……."
10055020-113 = "……선생님, 잠깐 들어가서 상담 괜찮으실까요?"
10055020-117 = "……여기라면, 괜찮아 보이네요."
10055020-118 = "뭐, 모시는 시점에 짐작하셨겠지만."
10055020-119 = "실은, 다른 사람들 몰래 물자를 빼돌리고 있었거든요."
10055020-120 = "4인분을 나눠서 5인분으로 보이게 만든다든지, 원래 있던 디저트 식단을 지운다든지 하는 식으로요."
10055020-121 = "왜 그랬냐고 하면……."
10055020-125 = "아니, 상식적으로 조난당한 상황에, 크루즈 여행에 맞춘 호화 식단을 꼬박꼬박 갖춰 먹는 편이 이상하지 않나요?"
10055020-126 = "[s7] \"그건 그래!\"\n[s8] \"나머지 일행에게 이 일은……?\""
10055020-129 = "네, 아무도 몰라요. 어차피 물자 관리는 저 혼자하고 있었으니까요."
10055020-130 = "일단, 마코토 선배에게는 들켜봐야 좋을 리 없고."
10055020-131 = "사츠키 선배는 예측불허, 어떻게 행동할지 변수가 너무 많아요."
10055020-132 = "그나마 치아키는 말이 통하지만, 거짓말이 서툴러서 비밀을 공유하기에는 부적합하죠."
10055020-133 = "그리고……."
10055020-134 = "아! 선생님!"
10055020-138 = "앗, 이로하 선배도 있다!"
10055020-139 = "무슨 일인가요, 이부키?"
10055020-140 = "응! 있지, 저기 돌고래 씨가……."
10055020-145 = "앗, 없어졌다! 조금 전까지 있었는데!"
10055020-149 = "이부키는 즐겁나요?"
10055020-150 = "응! 엄청 즐거워!"
10055020-151 = "이로하 선배는 안 즐거워?"
10055020-152 = "앗, 아니요. 저도 즐거워요."
10055020-153 = "에헤헤, 다행이다!"
10055020-159 = "……이부키한테는, 알고 계시죠, 선생님?"
10055020-160 = "[s9] \"표류 사실은 비밀인 거지?\"\n[s10] \"알게 되면 걱정할 테니까.\""
10055020-163 = "이런 말은 실례지만."
10055020-164 = "진심으로 선생님이랑 같이 조난당해서 다행이라 생각해요."
10055020-165 = "저희끼리만 조난당했다고 생각하면……."
10055020-166 = "그래도 슬슬 진지하게 대책을 마련해야 할지도 모르겠네요."
10055020-167 = "일주일이라고는 했지만, 실제로는 언제 구조가 올지 모르니까요. 물자를 아껴서 버티는 것에는 한계가……."
10055020-168 = "…………."
10055020-169 = "……하아."
10055020-170 = "어째서 이 배에는 이런 현실적인 고민을 할 사람이 저밖에 없는 거죠? 진짜 귀찮아 죽겠네요."
10055020-171 = "[s11] \"서, 선생님이 최대한 도울 테니까!\"\n[s12] \"같이 힘내자!\""
10055020-174 = "애초에 선생님도 피서에 초대받았다가 이렇게 된 거였죠. 피차 고생이 많습니다."
10055020-175 = "……일단, 그러면 급한 문제부터 해결해 볼까요?"
10055020-176 = "우선순위를 따졌을 때, [ruby=서바이벌]생존[/ruby]에 가장 중요한 것은……."
10055020-177 = "바로, 식량이겠죠."
10055020-181 = "……."
10055020-182 = "아, 선생님."
10055020-183 = "[s13] \"눈이 죽었어……!\"\n[s14] \"무슨 일 있었어?!\""
10055020-186 = "그게 말이죠……. 아무 일도 없었습니다."
10055020-187 = "네에, 바로 그게 문제란 말이죠~"
10055020-188 = "처음에는 대특종이라고 신났지만, 저 만마전의 서기, 모토미야 치아키, 한 가지 맹점을 놓치고 있었습니다……."
10055020-189 = "표류라는 건, 결국 고립된 환경에서, 아무 변화도 없는 나날을 반복할 뿐이라는 것을요!"
10055020-190 = "저 같은 사람에게 이런 상황은 그야말로 쥐약……. 혹시 몰라서 나날이 수기를 남기고 있긴 한데요."
10055020-191 = "역시, 읽는 사람의 반응이 좀 더 보고 싶다고 할까……."
10055020-192 = "먼 미래에 저희를 발견한 누군가가 이걸 읽고 기뻐해 주면 좋겠네요……."
10055020-193 = "태평하게 무슨 불길한 소리를 하는 건가요?"
10055020-194 = "아, 이로하 쨩."
10055020-198 = "어라, 그게 뭐야?"
10055020-199 = "낚싯대예요. 안 그래도 찾으려고 했는데, 잘됐네요. 좀 도와주겠어요?"
10055020-200 = "낚싯대? 그런 게 있었나?"
10055020-201 = "전에 예비 부품을 찾던 중에 바닥 틈새에서 발견한 거예요. 아마 배 주인이 치우는 걸 깜빡했거나 한 거겠죠."
10055020-202 = "뭐…… 저희 같은 아마추어가 무작정 한다고 될지는 모르겠지만…… 적어도 아무것도 안 하는 것보단 나으니까요."
10055020-203 = "오오! 나 할래! 할래!"
10055020-204 = "사서 고생하는 일이 뭐 그리 좋다고……."
10055020-205 = "가만히 있는 편이 훨씬 지루한걸~"
10055020-206 = "마침 낚싯대도 2개니까 하나씩 잡고 있으면 되겠네요."
10055020-211 = "……쉽게 풀리지 않을 줄은 알았지만."
10055020-212 = "이렇게 반응이 없을 수 있나요?"
10055020-213 = "원래 낚시는 시간과 싸움이라고 하니까!"
10055020-214 = "게다가 우리가 하는 건 루어 낚시니까, 생미끼를 쓸 때보다 입질이 덜한 건 당연하고."
10055020-215 = "……묘하게 자세하네요?"
10055020-216 = "아핫. 사실 나, 낚시부 명예 부원이거든."
10055020-217 = "우리 학교에 그런 동아리가 있었나요?"
10055020-218 = "있다고! 분명히! 물론, 학교 주변에 낚시터가 없어서 활동은 전혀 못 하고 있지만……."
10055020-219 = "……존재 의미가 있나요? 그 동아리?"
10055020-220 = "있고말고! 지금 힌놈 화산에 댐을 짓고 있거든. 계산에 따르면 앞으로 2년 후면, 게헨나 학원을 가로지르는 강이 완성될 거래!"
10055020-221 = "학원 중심을 가로지르는 강이라니…… 꼭 두 눈으로 보고 싶어!"
10055020-225 = "그거, 이미 한참 주객전도……."
10055020-226 = "아뇨, 제 실수네요. 우리 학교 괴짜들이 하는 일을 깊이 생각하는 게 아니었는데."
10055020-227 = "……."
10055020-232 = "……뭔가요? 갑자기 남의 얼굴을 빤히."
10055020-233 = "아니, 예전부터 생각했는데……."
10055020-234 = "이로하 쨩, 우리 학교에 엄청 무관심하지 않아?"
10055020-235 = "……???"
10055020-236 = "아니, 뭐, 그렇긴 한데요. 되게 뜬금없네요."
10055020-242 = "그치만, 이로하 쨩은 만마전 임원이잖아? 그리고 만마전은, 게헨나의 학생회 같은 거고?"
10055020-243 = "학생회 같은 거…… 라기보다는 그냥 학생회죠?"
10055020-244 = "그치. 그런데, 학생회 일은, 학교에 애정이 없으면 못 하는 거잖아?"
10055020-245 = "……글쎄요. 딱히 그렇게 생각해 본 적은 없네요."
10055020-246 = "눈앞에 일은 닥쳤고, 할 사람이 없으면 하는 거죠. 그 정도는 애정이 없어도 해요."
10055020-247 = "……저기, 있잖아."
10055020-248 = "이로하 쨩은 어째서 만마전에……."
10055020-254 = "……! 치아키, 낚싯대!"
10055020-255 = "어, 어어?! 우와아앗?! 이로하 쨩! 도와줘!"
10055020-256 = "낚시부라면서요?!"
10055020-257 = "그치만 실제 낚시는 해본 적 없단 말야!"
10055020-258 = "정말이지……! 이리 줘봐요!"
10055020-271 = "자, 잡았……?! 이제 어떻게……!"
10055020-272 = "이로하 쨩! 여기 뜰채!"
10055020-273 = "자, 잠깐만요! 너무 퍼덕여서!"
10055020-282 = "아야야……."
10055020-283 = "[s15] \"괜찮아?!\"\n[s16] \"세게 부딪힌 거 같은데?!\""
10055020-286 = "아, 아아…… 그건, 괜찮아요. 소리만 크게 난 거라."
10055020-287 = "이로하 쨩, 일으켜줘~"
10055020-288 = "네? 엄살 부리지 말고 빨리 일어나요."
10055020-292 = "매정해요~"
10055020-293 = "그나저나, 우리 물고기는…… 아, 선생님께서 챙겨 주셨군요!"
10055020-297 = "정말로 저희가 잡은 물고기가 이건가요?"
10055020-298 = "오옷! 완전히 대어네요!"
10055020-299 = "잡어겠죠?"
10055020-300 = "분명, 낚싯대에 걸려 있을 때는 훨씬 커 보였는데……."
10055020-301 = "그래도 식량 자급자족이 가능하다는 걸 증명한 것은 큰 성과네요."
10055020-302 = "응?"
10055020-303 = "왜 그런가요?"
10055020-304 = "아뇨, 식량이라고 하니까……."
10055020-305 = "그, 먹을 거야?"
10055020-306 = "그야 당연하죠?"
10055020-307 = "어떻게?"
10055020-308 = "그야 굽거나……."
10055020-312 = "그러고 보니, 만약을 대비해서 연료 아끼고 있었죠. 그렇다면 생으로 손질해서 회를……."
10055020-313 = "살아 있는 생선, 손질할 줄 알아?"
10055020-314 = "……."
10055020-318 = "……."
10055020-319 = "……그러고 보니, 치아키는 급양부에도 가입해 있었죠?"
10055020-320 = "이야, 대단하네요~ 그렇게 여러 동아리 활동을 겸임하다니."
10055020-321 = "아니거든?! 전혀 아니거든?! 급조 설정 붙이지 마?!"
10055020-322 = "저, 살아 있는 생물이라든지, 손질하는 거는 진짜로 조금……."
10055020-323 = "아! 혹시 선생님께 부탁해 보는 건……."
10055020-324 = "……음, 그것도 나쁘지는 않지만."
10055020-325 = "일단, 선생님께 의지하는 건, 최후의 수단으로 두죠."
10055020-327 = "[ns17] \"나, 못 미더운 이미지……?\"\n[ns18] \"내가 해도 괜찮아.\""
10055020-330 = "그런 문제는 아니고요……."
10055020-331 = "선생님께서는 엄연히 만마전의 게스트로 오신 입장이란 말이죠."
10055020-332 = "……솔직히, 지금 상황에 그게 다 무슨 소용이냐 싶지만, 최소한 한 명은 그렇게 생각 안 하고 있어서요."
10055020-333 = "아하하, 마코토 선배 나름의 책임감이라고 할까……."
10055020-334 = "책임감? 그 사람이요? 진심으로요?"
10055020-335 = "그으~ 말로는 하지 않지만, 그런 부분이 있다고는 생각하는데에……."
10055020-339 = "하여튼, 생선은 제가 어떻게든 해볼게요."
10055020-340 = "오오! 설마 했던 이로하 쨩의 수제 요리인가요! 만마전에 들어오고 나서 처음이에요!"
10055020-341 = "조난도 당해 볼 일이네요! 이런 드문 경험을 다 해보고!"
10055020-342 = "미리 말하지만, 별로 기대하지 마세요. 저도 처음이니까요."
10055020-344 = "우선 비늘을……."
10055020-345 = "아니, 머리를, 아앗?!"
10055020-352 = "일단, 물어보겠다."
10055020-353 = "이로하, 이 다짐육……? 은 뭐지?"
10055020-354 = "……회인데요, 일단은."
10055020-358 = "치아키, 그만 웃어요! 아까부터 뭐가 그렇게 웃기다고……!"
10055020-359 = "그치만, 이걸 보고 어떻게, 아하하하하!"
10055020-360 = "흐응~ 아까부터 시끄럽더니, 낚시 같은 걸 하고 있었구나."
10055020-361 = "그렇지만, 이건, 먹어도 되는 건가……?"
10055020-366 = "……냠."
10055020-370 = "와아! 이부키, 이거 알아! 싱싱……? 신선한 맛이야!"
10055020-371 = "아핫! 확실히, 신선, 하하하하! 신선하네요! 아하하하!"
10055020-372 = "……이부키 쨩, 정말로 괜찮아?"
10055020-373 = "응, 그치만 이런 회는 처음이야! 즐거워!"
10055020-374 = "이부키 쨩이 그렇게 말한다면……."
10055020-375 = "으, 으음. 중요한 것은 결국 본질, 맛인 법이지."
10055020-377 = "꽤 훌륭한 연육 아닌가?"
10055020-378 = "잘됐네, 이로하 쨩! 연육! 아하하하핫!"
