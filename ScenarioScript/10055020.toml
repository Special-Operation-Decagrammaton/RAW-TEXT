10055020-33 = ""
10055020-34 = ""
10055020-35 = "สิ่งที่ทำได้ในตอนนี้ คงมีแค่นี้สินะ?"
10055020-36 = "[s] \"ซัตสึกิดูใจเย็นทีเดียวนะ\""
10055020-37 = "ใจเย็นที่ไหนกันล่ะ ฉันก็ร้อนใจเหมือนกันนะ"
10055020-38 = "อยู่เฉยๆ สถานการณ์ก็ไม่ดีขึ้น เพราะงั้นเลยต้องลงมือทำอะไรสักอย่าง"
10055020-39 = "ถ้าเป็นตอนปกติ มาโคโตะจังก็คงหาทางทำอะไรสักอย่างแล้วแท้ๆ..."
10055020-40 = "หืม? ถามว่าเชื่อใจมาโคโตะจังรึเปล่าน่ะเหรอ?"
10055020-41 = "ก็ต้องเชื่ออยู่แล้วสิ มาโคโตะจังเป็นคนที่เก่งมากเลยนะ"
10055020-42 = "[s1] \"มาโคโตะคนนั้นน่ะนะ...?\"\n[s2] \"ครูสงสัยว่าความเชื่อมั่นนั่นมาจากไหนมากกว่า...\""
10055020-45 = "หืม…? คนใหญ่คนโตระดับครูจากชาเล่ต์นี่ คงมีมุมมองที่ต่างจากคนทั่วไปสินะ?"
10055020-46 = "น่าสนใจจริงๆ... แต่คงไม่ได้ช่วยแก้สถานการณ์ตอนนี้เท่าไร"
10055020-47 = "เอาไว้กลับเข้าฝั่งแล้วจะไปถามอีกทีแล้วกัน..."
10055020-48 = "ส่วนตอนนี้ เอาเป็นว่า..."
10055020-49 = "คงต้องรอจนกว่ามาโคโตะจังจะตื่นก่อน"
10055020-51 = "อย่างนี้นี่เอง... ระหว่างที่เราหลับไม่รู้ตัวก็เกิดเรื่องแบบนั้นขึ้นสินะ"
10055020-52 = ""
10055020-54 = ""
10055020-55 = "อิโรฮะ! ทำไมถึงไม่รีบแจ้งเราทันทีล่ะ?"
10055020-56 = "รายงาน! ติดต่อ! ปรึกษา! นี่เป็นพื้นฐานของคนทำงานไม่ใช่หรือไง!"
10055020-57 = ""
10055020-59 = ""
10055020-60 = "จะให้แจ้งอะไรล่ะคะ พวกเราก็เพิ่งรู้เมื่อกี้เองนะ?"
10055020-61 = "แล้วรุ่นพี่มาโคโตะเองก็เมาเรือจนสลบไปด้วยนี่คะ"
10055020-62 = "โธ่เอ๊ย! ตอบได้แต่ตามที่ตั้งค่าไว้หรือไง! ยัยสุนัขรับใช้ระบบ!"
10055020-63 = "เมื่อกี้ยังพูดจาถึงระบบระเบียบอยู่เลย แล้วมาว่าคนอื่นแบบนี้ได้ด้วยเหรอคะ?"
10055020-64 = "อย่ามัวมาจับผิดเราเรื่องเล็กๆ น้อยๆ เลย!"
10055020-65 = "สถานการณ์ตอนนี้เป็นยังไงบ้าง ซัตสึกิ?"
10055020-66 = "เครื่องยนต์หยุดทำงาน ขาดการติดต่อกับชายฝั่ง... เรียกว่าลอยเคว้งอยู่กลางทะเลเต็มตัวเลยละ"
10055020-67 = "ส่วนที่พอจะมองในแง่ดีได้ ก็คงเป็นเรื่องเสบียงที่ยังมีเยอะอยู่น่ะ"
10055020-68 = "ถึงจะมีอยู่เยอะ แต่ก็คงพอแค่หนึ่งสัปดาห์ค่ะ เรือแบบนี้เดินทางไกลไม่ได้อยู่แล้ว เราเลยทิ้งของส่วนใหญ่ไว้บนชายฝั่งกัน"
10055020-69 = "หนึ่งสัปดาห์? อะไรกัน ถ้าอย่างนั้นก็ไม่น่ามีปัญหานะ"
10055020-70 = "........."
10055020-71 = "คิกคิกคิก ทำหน้าเหมือนไม่เข้าใจอะไรเอาเสียเลย แต่ฟังนะอิโรฮะ ลองคิดตามหลักเหตุผลดูสิ"
10055020-72 = "นี่เป็นเหตุการณ์ที่ไม่เคยเกิดขึ้นมาก่อน คนที่ขาดการติดต่อไปไม่ใช่ใครอื่น แต่เป็นกรรมการ#nแพนเดโมเนียมทุกคน ไม่ใช่แค่วันสองวัน แต่ตั้งหนึ่งสัปดาห์เชียวนะ"
10055020-73 = "คงไม่ใช่แค่แพนเดโมเนียม โซไซตี้ แต่ทั้งโรงเรียนก็คงจะระดมกำลังออกตามหาพวกเรากันเต็มที่แน่ๆ"
10055020-74 = "เอ๊ะ? พวกเรามีตำแหน่งสำคัญขนาดนั้นเลยเหรอคะ?"
10055020-75 = "เป็นถึงเลขานุการของแพนเดโมเนียม โซไซตี้แท้ๆ ทำไมถึงพูดอะไรไม่เข้าท่าแบบนั้น? มันก็แน่นอนอยู่แล้วไม่ใช่รึไง"
10055020-76 = "พอฟังแบบนี้แล้ว ฉันคงกังวลมากไปเองสินะ"
10055020-77 = "สรุปก็คือพวกเราแค่พักร้อนกันสบายๆ ไปสักหนึ่งอาทิตย์ก็พอแล้วไงล่ะ!"
10055020-78 = "เป็นแบบนี้ตลอดเลยนะคะ..."
10055020-79 = "หืม? อะไรกัน? สายตาไม่พอใจนั่นน่ะ?"
10055020-80 = "เปล่าค่ะ ไม่มีอะไรหรอกค่ะ"
10055020-81 = "แต่ก็มีเหตุผลอยู่นะคะ พวกเราไม่ได้ออกมาไกลจากชายฝั่งมาก ถ้าโชคดีละก็ อาจมีชาวบ้านที่ออกมา#nหาปลามาช่วยพวกเราไว้ก็ได้ค่ะ"
10055020-82 = "หรืออาจมีคนจากโรงเรียนการเดินเรือโอดิสซีย์ที่ลาดตระเวนอยู่มาช่วยพวกเราก็ได้ค่ะ"
10055020-83 = "คิกคิกคิก! เข้าใจแล้วสินะ? สิ่งที่เราผู้นี้ทำไม่มีทางผิดพลาดแม้แต่นิดเดียว!"
10055020-84 = "เพราะงั้นทุกคนสบายใจได้ แล้วสนุกกับวันหยุดฤดูร้อนให้เต็มที่ซะเถอะ!"
