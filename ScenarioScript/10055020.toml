10055020-4 = ""
10055020-5 = "ลองกี่ครั้งก็ยังเหมือนเดิมเลยค่ะ..."
10055020-6 = "ไม่ติดเลยค่ะ พวกอุปกรณ์สื่อสารก็หยุดทำงานไปแล้วด้วย"
10055020-7 = "ซ่อมไม่ได้เลยเหรอ?"
10055020-8 = "ต้องตรวจสอบให้ละเอียดกว่านี้ถึงจะรู้ค่ะ... แต่ถ้าประเมินเบื้องต้นในฐานะผู้บัญชาการรถถังแล้วละก็... คงงั้นละค่ะ"
10055020-9 = "ดูเหมือนเครื่องยนต์จะหมดอายุการใช้งานแล้วละค่ะ"
10055020-10 = "หมายความว่ายังไงน่ะ? สรุปซ่อมได้หรือไม่ได้กันแน่?"
10055020-11 = "ซ่อมได้ค่ะ ถ้าหาเครื่องยนต์ใหม่ที่ใช้งานได้ หรือหาอะไหล่มาเปลี่ยนส่วนที่เสียได้น่ะค่ะ"
10055020-12 = "กลางทะเลกว้างใหญ่แบบนี้จะไปหาจากที่ไหนกัน?"
10055020-13 = "ค่ะ เพราะงั้นก็คงจะซ่อมไม่ได้นั่นละค่ะ"
10055020-14 = "อิโรฮะจัง... โมโหอยู่เหรอ?"
10055020-15 = "........."
10055020-16 = "เฮ้อ... ขอโทษค่ะ เผลอหัวร้อนไปหน่อย ไม่สมกับเป็นฉันเลยนะคะ"
10055020-17 = "ยังไงพวกเราก็เดือดร้อนกันหมดอยู่แล้ว แถมคนก่อเรื่องยังนอนสบายอยู่แบบนี้ ฉันจะพูดอะไรได้ล่ะคะ?"
10055020-18 = ""
10055020-20 = ""
10055020-21 = "ก่อนอื่น มาสรุปสถานการณ์กันก่อนเถอะ"
10055020-22 = "จิอากิจัง ไปปลุกมาโคโตะจังแล้วพามาที่นี่หน่อยสิ"
10055020-23 = "รับคำสั่งค่า~!"
10055020-24 = ""
10055020-26 = ""
10055020-27 = ""
10055020-28 = "อิโรฮะจัง ช่วยตรวจดูเสบียงบนเรือหน่อยนะ ถ้าเราลอยเคว้งแบบนี้จริงๆ ก็คงไม่มีอะไรสำคัญไปกว่า#nจำนวนเสบียงที่เหลือแล้วละ"
10055020-29 = "อ้อ แล้วก็ลองหาดูอีกทีนะว่ามีอะไหล่สำรองที่พอใช้ซ่อมได้บ้างรึเปล่า"
10055020-30 = "ทำไมวันหยุดฤดูร้อนถึงกลายเป็นเรื่องยุ่งยากแบบนี้ไปได้นะ... ช่วยไม่ได้นะคะ เดี๋ยวฉันกลับมาค่ะ"
