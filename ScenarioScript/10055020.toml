10055020-1 = "Episode 2;Five Girls Adrift"
10055020-2 = ""
10055020-3 = ""
10055020-4 = ""
10055020-5 = "...I've tried everything."
10055020-6 = "It's more hunk of metal than engine now. Our comms equipment doesn't have any power either."
10055020-7 = "Can you fix it?"
10055020-8 = "I've had some experience with repairs as a tank commander. So I don't want to make any promises before I take a closer look, but technically, yes."
10055020-9 = "The engine's just old, and it reached the end of its life."
10055020-10 = "What does that mean? Can you fix it or not?"
10055020-11 = "I can fix it. With a replacement engine. Or replacement parts, at least."
10055020-12 = "Is there a ship parts delivery service to the ocean?"
10055020-13 = "So, no. I can't fix it."
10055020-14 = "Um, Iroha... Are you mad?"
10055020-15 = "..."
10055020-16 = "...*sigh* Sorry. I don't usually lose my temper like that."
10055020-17 = "And we all know who I'm really mad at. We're all the victims here, while the perpetrator is snoozing away without a care."
10055020-18 = ""
10055020-20 = ""
10055020-21 = "Let's take stock of the situation."
10055020-22 = "Chiaki, go wake Makoto and bring her here."
10055020-23 = "At once!"
10055020-24 = ""
10055020-26 = ""
10055020-27 = ""
10055020-28 = "Iroha, you go take stock of our current supply situation. We're going to have to come up with a plan on how to ration them out if we really are stranded."
10055020-29 = "Oh, and maybe there'll be some spare parts we can use to repair the engine, so keep an eye out for those."
10055020-30 = "Wasn't this supposed to be my summer VACATION? Ugh, fine, fine, it always turns out like this..."
10055020-31 = ""
10055020-33 = ""
10055020-34 = ""
10055020-35 = "I suppose that's about all we can do for now."
10055020-36 = "[s] \"You're keeping it together well, Satsuki.\""
10055020-37 = "Of course I'm not. I'm just as worried as everyone else."
10055020-38 = "But worrying never solves anything, so I should focus on what I can do."
10055020-39 = "Makoto would have come up with some sort of solution or another by now."
10055020-40 = "Hm? Do I trust Makoto?"
10055020-41 = "Wholeheartedly. She's an incredible person."
10055020-42 = "[s1] \"We're talking about Makoto, right...?\"\n[s2] \"I can't help but wonder why you trust her so much.\""
10055020-45 = "How interesting. It would seem you and I have different standards for assessing people."
10055020-46 = "Yes, while it is interesting, it's of little relevance to the situation at hand."
10055020-47 = "We can unpack that once we've safely returned to land."
10055020-48 = "...For now, let's see."
10055020-49 = "I suppose we'll have to wait for Makoto."
10055020-51 = "...I see. To think I was unaware of all of that."
10055020-52 = ""
10055020-54 = ""
10055020-55 = "Iroha! Why didn't you tell me as soon as this happened?!"
10055020-56 = "Report! Communicate! Consult! Those are the basics of any organizational structure!"
10055020-57 = ""
10055020-59 = ""
10055020-60 = "What are you even saying? I literally just found out too."
10055020-61 = "And you've been down for the count anyways."
10055020-62 = "I'm sick of your dismissive excuses! You... You bureaucratic lapdog!"
10055020-63 = "\"Report! Communicate! Consult!\" Oh, who said that again? You. Five seconds ago."
10055020-64 = "You... You're nitpicking!!"
10055020-65 = "Enough! Satsuki! Report on our current situation!"
10055020-66 = "The engine is dead, and we've lost contact with land... We're well and truly adrift."
10055020-67 = "The one bright side is that we still have a decent amount of supplies."
10055020-68 = "I'd hardly call a week's worth \"decent.\" We didn't think we'd be out that long, so we left a lot back at the docks."
10055020-69 = "A week? Then everything is going to be just fine!"
10055020-70 = "..."
10055020-71 = "Kihehe! Are you confused? Just think, Iroha."
10055020-72 = "When have we ever run into a situation where the entire executive office of the Pandemonium Society went missing for a day or two, let alone a whole week?"
10055020-73 = "Our fellow Pandemonium members won't be the only ones searching for us. Every single student of Gehenna Academy will rise up to save their leaders!"
10055020-74 = "To save...us? We're that important?"
10055020-75 = "I can't believe our own secretary would ask that! No one is more important than us!"
10055020-76 = "When you put it that way, I don't know what we had our knickers in a twist for."
10055020-77 = "Our only objective is to kick our feet up and enjoy a well-earned vacation for the next week!"
10055020-78 = "...She's always like this."
10055020-79 = "Iroha? What are you grumbling about?"
10055020-80 = "Nothing. Forget it."
10055020-81 = "She's not entirely wrong, though. And it's not like we're that far out. We're bound to run into some fishermen eventually."
10055020-82 = "Even better, maybe we'll find one of Odyssey's patrol boats. They'd be able to tow us back to land."
10055020-83 = "Kihehe! Now do you understand? Nothing I do ever goes wrong!"
10055020-84 = "So relax, and have a happy summer break!"
10055020-86 = "[log]Day 4 Adrift[/log]"
10055020-89 = ""
10055020-90 = "..."
10055020-91 = "..."
10055020-92 = "It's been a while."
10055020-93 = "Yup. Sure has."
10055020-94 = "Our supplies are dwindling fast."
10055020-95 = "Yup. Sure are."
10055020-96 = "Is there...maybe...the slightest chance..."
10055020-97 = "Are we in danger?"
10055020-98 = "Way past that. We're in it deep."
10055020-99 = ""
10055020-100 = "[ns3] \"L-Let's try to stay positive!\"\n[ns4] \"Help could show up any minute now!\""
10055020-103 = "...If you're going to lie to me, at least have the dignity to look me in the eye while you do it."
10055020-104 = "The only positive I've got is that we're doing okay on supplies."
10055020-105 = "We should be able to hold out for...another week. Yeah, at least one more week."
10055020-106 = "[s5] \"That's what you said on day one...\"\n[s6] \"How do we still have that much left...?\""
10055020-109 = "That's..."
10055020-110 = ""
10055020-112 = ""
10055020-113 = "...Sensei, could I speak with you inside for a moment?"
10055020-116 = ""
10055020-117 = "...This should be good."
10055020-118 = "I'm sure you already have a guess as to what I'm about to tell you."
10055020-119 = "Truth is, I've been secretly squirreling away supplies whenever I could."
10055020-120 = "Just little things, like stretching four servings to five, or cutting desserts up smaller..."
10055020-121 = "As for why..."
10055020-122 = ""
10055020-124 = ""
10055020-125 = "It should be obvious. We're stranded at sea. It makes no sense for us to still be eating like we're on a luxury cruise!"
10055020-126 = "[s7] \"I'm with you on that one!\"\n[s8] \"Do the others know about this...?\""
10055020-129 = "No, none of them do. I was the only one handling supplies anyway."
10055020-130 = "I can't think of a single benefit from telling Makoto."
10055020-131 = "Satsuki just does whatever she feels like, and I don't like dealing with unpredictable variables."
10055020-132 = "Chiaki would understand, but I've never seen a worse liar in my life. She'd get caught in an instant."
10055020-133 = "And then there's..."
10055020-134 = "Ah! Sensei!"
10055020-136 = ""
10055020-137 = ""
10055020-138 = "Oh, Iroha's here too!"
10055020-139 = "Is everything okay, Ibuki?"
10055020-140 = "Yeah! It's just that, um, there was a dolphin..."
10055020-141 = ""
10055020-143 = ""
10055020-144 = ""
10055020-145 = "But now it's gone! Ibuki swears she just saw it!"
10055020-146 = ""
10055020-148 = ""
10055020-149 = "Are you having fun, Ibuki?"
10055020-150 = "Yeah! Ibuki is having so much fun!"
10055020-151 = "What about Iroha? Aren't you having fun too?"
10055020-152 = "Ah, of course. I always have fun with you."
10055020-153 = "Eheehee! Ibuki's so happy!"
10055020-154 = ""
10055020-156 = ""
10055020-157 = ""
10055020-158 = ""
10055020-159 = "...You understand, right, Sensei?"
10055020-160 = "[s9] \"Ibuki can't know that we're actually stranded.\"\n[s10] \"She'd be scared and worried if she found out.\""
10055020-163 = "This might be weird, but..."
10055020-164 = "I'm really glad you're here too, Sensei."
10055020-165 = "If you hadn't been, and it was just us..."
10055020-166 = "Anyway, we need to start seriously figuring out our options."
10055020-167 = "Another week doesn't mean anything if help doesn't arrive. We can only stretch our supplies so far."
10055020-168 = "..."
10055020-169 = "*sigh*"
10055020-170 = "How is there not a single other soul on this boat worried about these things? What a freaking pain."
10055020-171 = "[s11] \"I-I'll do everything I can to support you!\"\n[s12] \"We'll get through this together!\""
10055020-174 = "You ended up in this mess as an invited guest... We're both going through a lot."
10055020-175 = "...We'll take things one at a time. Let's start with the most urgent problems."
10055020-176 = "If we want to stay alive, our highest priority is..."
10055020-177 = "...food, of course."
10055020-180 = ""
10055020-181 = "..."
10055020-182 = "Oh, Sensei..."
10055020-183 = "[s13] \"Why are you so out of it?!\"\n[s14] \"Did something happen?!\""
10055020-186 = "Nothing... Nothing happened...at all..."
10055020-187 = "And that's exactly the problem!"
10055020-188 = "I was so excited for this vacation! What I expected was a ginormous story that would go totally viral... But I, Motomiya Chiaki, secretary of the Pandemonium Society, forgot about reality."
10055020-189 = "Because when you're stranded in the middle of the ocean with the same exact people day in and day out, nothing changes!"
10055020-190 = "This is the worst possible situation for someone like me! I HAVE been keeping a daily journal, but..."
10055020-191 = "I miss my readers. I miss their reactions to my work..."
10055020-192 = "Hopefully whoever finds our boat...in the far distant future...enjoys reading it..."
10055020-193 = "Do you have to say that so ominously?"
10055020-194 = "Oh, Iroha!"
10055020-195 = ""
10055020-197 = ""
10055020-198 = "Huh? What's that?"
10055020-199 = "A fishing rod. And this is perfect. I wanted to ask you for a hand."
10055020-200 = "We had a fishing rod this whole time?"
10055020-201 = "I just found it while I was looking for spare parts. It was wedged pretty deep in this little crack. The boat owner probably forgot it was there."
10055020-202 = "I don't necessarily know if we'll be able to catch anything with no prior experience, but we may as well try."
10055020-203 = "Ooh! I wanna do it! I wanna!"
10055020-204 = "So excited to do more work..."
10055020-205 = "If I have to sit around and do nothing for one more second, I'll explode!"
10055020-206 = "There were two down there, so we can both try."
10055020-210 = ""
10055020-211 = "...I knew this wouldn't be easy."
10055020-212 = "But we haven't even had a nibble..."
10055020-213 = "They say fishing is all about patience!"
10055020-214 = "Besides, we're lure fishing, so it's only natural we'd get fewer bites than with live bait."
10055020-215 = "...You're surprisingly knowledgeable about this..."
10055020-216 = "Well, because I'm actually an honorary member of the Fishing Club."
