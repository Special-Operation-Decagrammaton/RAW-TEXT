10055020-182 = "啊，老師。"
10055020-183 = "[s13] 「眼神死了……！」\n[s14] 「發生什麼事了！？」"
10055020-186 = "那個啊……什麼事都沒有。"
10055020-187 = "是的，問題就出在這裡啊～"
10055020-188 = "起初還以為是大獨家而挺興奮的，但我萬魔殿的書記元宮千秋卻忽略了一個盲點……"
10055020-189 = "那就是漂流說到底，只是在孤立的環境中重複著毫無變化的日子而已！"
10055020-190 = "這種狀況對我這種人來說簡直是致命傷……#n雖然我每天都有為了以防萬一留下手記……"
10055020-191 = "可是，我果然還是想看看讀者的反應……"
10055020-192 = "真希望在遙遠的未來，發現我們的人讀到這個會覺得開心……"
10055020-193 = "別一臉悠哉地說這種不吉利的話好嗎？"
10055020-194 = "啊，伊呂波醬。"
10055020-195 = ""
10055020-197 = ""
10055020-198 = "咦，那是什麼？"
10055020-199 = "是釣竿。你來得正好，我剛好想去找你呢。#n可以幫我一下嗎？"
10055020-200 = "釣竿？船上有那種東西嗎？"
10055020-201 = "是我之前找備用零件的時候，在地板的縫隙裡找到的。#n大概是船主忘了收起來吧。"
10055020-202 = "嗯……雖然不知道我們這種外行人能不能做到，不過至少比什麼都不做來得好。"
10055020-203 = "哦哦！我要！我要釣！"
10055020-204 = "自找苦吃有什麼好開心的……"
10055020-205 = "什麼都不做反而更無聊嘛～"
10055020-206 = "剛好有2根釣竿，一人拿一根就行了。"
10055020-210 = ""
10055020-211 = "……雖然早知道不會那麼順利。"
10055020-212 = "但怎麼會一點反應都沒有？"
10055020-213 = "釣魚本來就是跟時間的戰鬥嘛！"
10055020-214 = "而且我們用的是[ruby=擬餌]路亞[/ruby]，跟活餌相比本來就沒那麼容易上鉤。"
10055020-215 = "……你懂得還真多耶？"
10055020-216 = "啊哈。其實我是釣魚部的榮譽部員。"
10055020-217 = "我們學園有那種社團嗎？"
