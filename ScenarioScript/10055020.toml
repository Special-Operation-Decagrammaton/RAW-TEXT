10055020-138 = "啊，伊呂波前輩也在！"
10055020-139 = "怎麼了，伊吹？"
10055020-140 = "嗯！跟你說哦，那邊有海豚先生……"
10055020-141 = ""
10055020-143 = ""
10055020-144 = ""
10055020-145 = "啊，不見了！剛剛明明還在的！"
10055020-146 = ""
10055020-148 = ""
10055020-149 = "伊吹，玩得開心嗎？"
10055020-150 = "嗯！超開心的！"
