[translation]
10055020-1 = "第2話;5少女漂流記"
10055020-2 = ""
10055020-3 = ""
10055020-4 = ""
10055020-5 = "……不管試幾次都一樣呢。"
10055020-6 = "完全沒有反應，通訊裝置也停止了。"
10055020-7 = "修不好嗎？"
10055020-8 = "還得再仔細檢查才能確定……#n不過以戰車長的身分初步判斷的話……"
10055020-9 = "引擎大概是壽終正寢了。"
10055020-10 = "那是什麼意思？到底修不修得好？"
10055020-11 = "修得好。不過前提是能找到完好的新引擎，或者至少弄到能替換故障部分的零件。"
10055020-12 = "在這茫茫大海上要去哪裡弄？"
10055020-13 = "對，所以大概是不可能了。"
10055020-14 = "……伊呂波醬，你該不會生氣了吧？"
10055020-15 = "…………"
10055020-16 = "……唉，對不起。一時氣昏頭了，真不像我。"
10055020-17 = "大家本來就都是受害者，闖禍的人還在悠哉地睡大覺，我又能說什麼呢？"
10055020-18 = ""
10055020-20 = ""
10055020-21 = "先整理一下狀況吧。"
10055020-22 = "千秋，去把真琴醬叫醒帶過來。"
10055020-23 = "遵命～！"
10055020-24 = ""
10055020-26 = ""
10055020-27 = ""
10055020-28 = "伊呂波，麻煩你確認一下船上儲備的物資。#n如果真的在漂流，沒有什麼資訊比剩下多少物資更重要了。"
10055020-29 = "啊，也請你再找找看有沒有能用來修理的備用零件。"
10055020-30 = "好好的暑假怎麼會變成這種麻煩事……真沒辦法，我去去就回。"
10055020-31 = ""
10055020-33 = ""
10055020-34 = ""
10055020-35 = "眼下能做的事情，大概就是這些了吧？"
10055020-36 = "[s] 「皐月看起來挺冷靜的呢。」"
10055020-37 = "怎麼可能。我也很不安啊。"
10055020-38 = "只是因為乾等著狀況也不會好轉，所以也只能先動起來而已。"
10055020-39 = "換作平常，真琴醬總會想辦法解決的……"
10055020-40 = "嗯？問我信不信任真琴醬？"
10055020-41 = "那還用說嗎？真琴醬可是非常厲害的人呢。"
10055020-42 = "[s1] 「你說那個真琴……？」\n[s2] 「真好奇這份信任是從哪來的……」"
10055020-45 = "哼嗯……？像夏萊的老師這樣的大人物，看人的角度果然也很特別嗎？"
10055020-46 = "雖然有點興趣……不過對突破眼前的困境好像沒什麼幫助。"
10055020-47 = "這個部分就等回到陸地之後，再慢慢問清楚吧……"
10055020-48 = "……至於現在嘛。"
10055020-49 = "也只能先等真琴醬醒來了。"
10055020-51 = "……原來在本大人不知道的時候，竟然發生了這種事啊。"
10055020-52 = ""
10055020-54 = ""
10055020-55 = "伊呂波！為什麼沒有馬上通知我？"
10055020-56 = "報告！聯絡！商量！這不是社會人的基本常識嗎！"
10055020-57 = ""
10055020-59 = ""
10055020-60 = "說什麼通不通知，我們也是剛剛才知道的好嗎？"
10055020-61 = "而且真琴前輩不是一直暈船癱在那邊嗎？"
10055020-62 = "哎！只會照本宣科嗎！你這官僚主義的走狗！"
10055020-63 = "……剛才還滿口官僚台詞的人，有資格說這種話嗎？"
10055020-64 = "少在小事上挑毛病！"
10055020-65 = "皐月，現在狀況如何？"
10055020-66 = "引擎停止，和陸地的通訊中斷……完全就是漂流狀態呢。"
10055020-67 = "唯一能樂觀看待的，大概就是物資還算充足吧？"
10055020-68 = "說是充足，也只有一週左右的量。#n畢竟本來就不可能用這種船長途旅行，所以大部分東西都留在陸地上了。"
10055020-69 = "一週？什麼嘛，那不就沒問題了嗎。"
10055020-70 = "…………"
10055020-71 = "嘰嘻嘻，一副搞不懂的表情啊。#n不過伊呂波，你用常識想想看吧。"
10055020-72 = "這可是我們萬魔殿全體幹部失聯的空前事態。#n而且還不是一兩天，而是整整一週。"
10055020-73 = "萬魔殿自不用說，整個格黑娜學園都會傾盡全力搜索吧。"
10055020-74 = "咦？我們有那麼重要嗎？"
10055020-75 = "身為萬魔殿的書記怎麼說這種傻話？這不是理所當然的嗎？"
10055020-76 = "聽你這麼一說，確實是這樣呢。害我白擔心了。"
10055020-77 = "也就是說，我們只要悠哉地享受一週的假期就行了！"
10055020-78 = "……每次都這樣。"
10055020-79 = "嗯？怎麼？那副不滿的眼神是什麼意思？"
10055020-80 = "沒有啊，沒什麼。"
10055020-81 = "不過也有道理。#n幸好我們沒有航行到遠洋，要是幸運的話，說不定會有出海捕魚的居民來救我們。"
10055020-82 = "搞不好還能得到正在巡洋的奧德賽海洋高中的幫助。"
10055020-83 = "嘰嘻嘻！現在懂了吧？#n本大人做的事，哪怕只是萬一也不可能出錯！"
10055020-84 = "大家儘管安心享受假期吧！"
10055020-86 = "[log]漂 流  第 4 天[/log]"
