[translation]
10055020-1 = "第2話;少女漂流記"
10055020-5 = "……何回やっても同じですね。"
10055020-6 = "完全に繋がらなくなりました。通信装置も止まっています。"
10055020-7 = "直すのも無理な感じ？"
10055020-8 = "ざっくりとしか見られていないのでなんともですが……戦車長として見た感じでは……。"
10055020-9 = "エンジンが天寿を全うしたというのが正しいですね。"
10055020-10 = "ええと……どういうこと？#n直せるの？直せないの？"
10055020-11 = "一応、直せます。#n新しいエンジンかパーツを調達できれば、ですが。"
10055020-12 = "こんな沖合で？"
10055020-13 = "はい……なので、不可能でしょうね。"
10055020-14 = "……イロハちゃん、もしかして怒ってる？"
10055020-15 = "…………。"
10055020-16 = "……はあ、すみません。#nらしくなかったですね。頭にきてしまって、つい。"
10055020-17 = "そもそも元凶以外は全員被害者だというのに。"
10055020-21 = "一旦、状況をまとめてみない？"
10055020-22 = "チアキはマコトちゃんを連れてきて頂戴。"
10055020-23 = "はい！承りました！"
10055020-28 = "イロハは物資の確認をお願い。#n今後の生存計画に関わるもの。"
10055020-29 = "あと、修理に使える予備パーツがないか、もう一度見てきて頂戴。"
10055020-30 = "せっかくの休暇がどうしてこんな面倒なことに……仕方ありませんね、行ってきます。"
10055020-35 = "今できるのはこんなものかしら。"
10055020-36 = "[s] \"サツキは落ち着いているんだね。\""
10055020-37 = "そんなことないわ。私だって不安よ。"
10055020-38 = "でも、不安になっていたって、しょうがないでしょう？"
10055020-39 = "普段ならマコトちゃんがなんとかしてくれるんだけど……。"
10055020-40 = "ん？マコトちゃんのこと？ええ、信頼しているわ。"
10055020-41 = "当然でしょう？マコトちゃんはすごい人だもの。"
10055020-42 = "[s1] \"そうなの……？\"\n[s2] \"すごい信頼だ……。\""
10055020-45 = "ふーん？シャーレの先生は、人を評価する基準が違うのかしらね？"
10055020-46 = "興味深いけれど……まあ今はそんなこと重要じゃないわ。"
10055020-47 = "この話は、無事に陸に戻ってからゆっくり、ね。"
10055020-48 = "とりあえず今は……そうね。"
10055020-49 = "マコトちゃんが来るまで待ちましょうか。"
10055020-51 = "……そうか。そんな事態になっていたのだな。"
10055020-55 = "イロハ、なぜすぐに知らせなかった！"
10055020-56 = "報、連、相は基本だろう！"
10055020-60 = "いや、私も今知ったばかりですので。"
10055020-61 = "というかマコト先輩、船酔いでずっと死んでたじゃないですか。"
10055020-62 = "ええいっ！定型の返答しかできないのか！？御役所仕事ばかりしおって！"
10055020-63 = "……言い出したのはマコト先輩じゃないですか。"
10055020-64 = "細かいことはどうでもいい！"
10055020-65 = "サツキ、現状報告！"
10055020-66 = "エンジン停止。陸上との通信は不可。#nまさに漂流状態ね。"
10055020-67 = "せめてもの救いは、それなりに物資が残ってるってところかしら？"
10055020-68 = "と言っても1週間分程度しかありません。#nこんな船で長期クルーズは無理ですし、ほとんど陸上に置いてきましたので。"
10055020-69 = "1週間分？なら何の問題もないじゃないか。"
10055020-70 = "…………。"
10055020-71 = "キシシッ、訳が分からないという顔だなイロハ。#nしかし常識的に考えてみるがいい。"
10055020-72 = "他の誰でもなくこの我々、万魔殿の幹部全員と連絡が取れない、前代未聞の事態だぞ？#nそれも一週間。"
10055020-73 = "他のメンバーはもちろん、ゲヘナが総力を挙げて捜索することだろう。"
10055020-74 = "あれ？私たちってそんなにすごかったんですか？"
10055020-75 = "万魔殿の書記ともあろう者が何を言っている？#n当たり前だろう！"
10055020-76 = "言われてみればたしかにそうね。心配して損したわ。"
10055020-77 = "つまり、我々は1週間の船旅を思う存分楽しめばいいというわけだ！"
10055020-78 = "……いつもこうなんですよね。"
10055020-79 = "ん？なんだその不満そうな顔は？"
10055020-80 = "いえ、別に何も。"
10055020-81 = "まあでも一理あると思います。そこまで遠くに出たわけでもないですし、運が良ければ他の船と出会えるかも……。"
10055020-82 = "それこそ、巡洋中のオデュッセイア海洋高等学校に会えるかもしれません。"
10055020-83 = "キシシッ！ようやく理解できたようだな！このマコト様がそばにいて、万が一が起こり得ることなどない！"
10055020-84 = "安心してバカンスを楽しむがいい！"
10055020-86 = "[log]漂 流  4 日 目[/log]"
10055020-90 = "…………。"
10055020-91 = "…………。"
10055020-92 = "今日は何日目だ……？"
10055020-93 = "さあ。"
10055020-94 = "食糧もずいぶんと減ったようだが。"
10055020-95 = "そうですね。"
10055020-96 = "少し……ほんのわずかに、思ったのだが。"
10055020-97 = "――危険な状況なのでは？"
10055020-98 = "いえ。#nかなり危険な状況です。"
10055020-100 = "[ns3] \"だ、大丈夫！\"\n[ns4] \"すぐに救助隊が……！\""
10055020-103 = "……せめて目を見ていってくれませんか。"
10055020-104 = "まぁ、まだ物資はあるので保つでしょうが……。"
10055020-105 = "あと1週間……それくらいなら大丈夫でしょう。"
10055020-106 = "[s5] \"前も1週間って言ってなかった？\"\n[s6] \"まだあるの？\""
10055020-109 = "それは……。"
10055020-113 = "……先生、ちょっといいですか。"
10055020-117 = "……ここなら大丈夫ですね。"
10055020-118 = "察しているかとは思いますが。"
10055020-119 = "物資をこっそり管理していたんです。"
10055020-120 = "4人分を5人分っぽく見せたり、デザートを無くすとか。"
10055020-121 = "まあ当たり前ですよね……。"
10055020-125 = "というか、常識的に考えて、遭難してるのに料理を元の日程で消費するなんておかしくないですか！？"
10055020-126 = "[s7] \"たしかに！\"\n[s8] \"このことは他の人には……？\""
10055020-129 = "誰も知りません。どのみち、物資の管理は私がしているので。"
10055020-130 = "まず、マコト先輩に知られてもいいことはありません。"
10055020-131 = "サツキ先輩はどう出るか分からないので教えていません。#nどういう行動をするか未知数なので。"
10055020-132 = "チアキは比較的話が通じる方ですが、ウソが苦手で秘密を共有するには向いておらず。"
10055020-133 = "イブキは……。"
10055020-134 = "あ！先生！"
10055020-138 = "あっ、イロハ先輩もいる！"
10055020-139 = "どうしましたイブキ？"
10055020-140 = "うん、あのね！あっちにイルカさんが……。"
10055020-145 = "あっ消えちゃった！さっきまでいたんだよ！"
10055020-149 = "イブキ、楽しめてますか？"
10055020-150 = "うん！すっごく楽しいよ！"
10055020-151 = "イロハ先輩は楽しくない？"
10055020-152 = "……私も楽しいですよ。"
10055020-153 = "えへへ！よかった！"
10055020-159 = "イブキには……分かりますよね？先生。"
10055020-160 = "[s9] \"漂流していることは秘密なんだよね？\"\n[s10] \"心配しそうだもんね。\""
10055020-163 = "こう言ってしまうのは失礼かもしれませんが――"
10055020-164 = "――先生と一緒で、本当によかったです。"
10055020-165 = "もしも、私たちだけだった場合……はぁ。"
10055020-166 = "とはいえ、そろそろ本気で対策を考えなくてはいけません。"
10055020-167 = "1週間とは言いましたが、救助がいつ来るのかも分かりません。#n物資を節約するだけではいずれ限界が……。"
10055020-168 = "…………。"
10055020-169 = "……はぁ。"
10055020-170 = "何で私が頭を悩ませないといけないんでしょうか……本当に面倒くさいです。"
10055020-171 = "[s11] \"わ、私もなるべく手伝うから！\"\n[s12] \"一緒に頑張ろう。\""
10055020-174 = "そもそも先生は招待された賓客だというのに……お互い大変ですね。"
10055020-175 = "……ひとまず目の前のことを一つずつ片づけていきましょうか。"
10055020-176 = "[ruby=サバイバル]生存に[/ruby]おいて一番大事なのは――"
10055020-177 = "――食糧ですから。"
10055020-181 = "……。"
10055020-182 = "あ、先生。"
10055020-183 = "[s13] \"目が死んでる……！\"\n[s14] \"大丈夫？何かあった！？\""
10055020-186 = "いえ……何もなかったんです。"
10055020-187 = "それが、問題でして……。"
10055020-188 = "漂流当初は大スクープだと思っていたんですが……気づいてしまったんです。"
10055020-189 = "漂流とは――何の変化も刺激もない日々を繰り返すだけだということに！"
10055020-190 = "こんなの監獄に等しいです……、#n一応、手記を書き残していますが……。"
10055020-191 = "やっぱり、読者の反応がないというのは……。"
10055020-192 = "いつか、これを見つけた誰かが読んでくれたら嬉しいな……。"
10055020-193 = "なに不吉なことを言っているんですか……。"
10055020-194 = "あ、イロハちゃん。"
10055020-198 = "あれ、それは？"
10055020-199 = "釣り竿です。#nちょっと手伝っていただけませんか？"
10055020-200 = "釣り竿？そんなのあったんだ。"
10055020-201 = "予備パーツを探してる時に見つけました。#n床の隙間に落ちていたのですが、おそらく前に借りた人のものかと。"
10055020-202 = "素人が使って釣れるかは分かりませんが……何もしないよりはマシかと思いまして。"
10055020-203 = "ナイスアイデア！はいはーい！やるやる！"
10055020-204 = "そんなにテンション上がるようなことですか……？"
10055020-205 = "退屈すぎてしんどくて！ちょうどよかったー！"
10055020-206 = "釣り竿はちょうど2本あります。はい、どうぞ。"
10055020-211 = "……簡単に釣れるとは思っていませんでしたが。"
10055020-212 = "まさかこんなにかからないとは。"
10055020-213 = "釣りは時間との戦いだからね！"
10055020-214 = "ルアーフィッシングだとボウズはよくあることだし！"
10055020-215 = "……意外と詳しいんですね。"
10055020-216 = "あはっ！実は私、釣り部名誉部員なので！"
10055020-217 = "うちの学園にそんなのありましたっけ……。"
10055020-218 = "あるよー！といっても全然活動はできてないけど……。"
10055020-219 = "……その部活、存在する意味あるんでしょうか。"
10055020-220 = "あるよ！今ヒノム火山にダムを作ってるから……順調に行けば、2年後にゲヘナ学園を通る川ができる予定なんだ！"
10055020-221 = "学園を横断する川……絶対この目で見たくない？"
10055020-225 = "もはや本末転倒というか……。"
10055020-226 = "いえ、これは私が間違ってました。うちの生徒がやることを深く考えるべきではないですね。"
10055020-227 = "……。"
10055020-232 = "……なんですか？急に人の顔をまじまじと。"
10055020-233 = "前から思ってたんだけど……。"
10055020-234 = "イロハちゃんって、ゲヘナ学園に全然興味ないですよね。"
10055020-235 = "……？"
10055020-236 = "あ、いやそうですが……唐突ですね。"
10055020-242 = "いやほら、イロハちゃんは万魔殿でしょ？#n万魔殿は一応、ゲヘナの生徒会のようなものだし。"
10055020-243 = "生徒会のような、というか生徒会ですね。"
10055020-244 = "そうそう。でも生徒会の仕事って学園に愛がないとできないじゃん。"
10055020-245 = "そうですね……いえ、あまりそういう風に考えたことはないですが。"
10055020-246 = "目の前に仕事があるからやっています。#nそれくらいは愛がなくてもできますから。"
10055020-247 = "あのさ……。"
10055020-248 = "イロハちゃんはどうして万魔殿に――"
10055020-254 = "……！チアキ、かかってます！"
10055020-255 = "あ、ああっ！？わわわわっ！！イロハちゃん、助けて！！"
10055020-256 = "釣り部なんですよね！？"
10055020-257 = "実際にやったのは初めてで！"
10055020-258 = "もう……！貸してください！"
10055020-271 = "つ、つかまえっ……！#nこれ、どうしたら……！？"
10055020-272 = "イロハちゃん！ほら、網！"
10055020-273 = "ちょっ、待ってください、こいつ、活きがよすぎて……！！"
10055020-282 = "いたた……。"
10055020-283 = "[s15] \"大丈夫！？\"\n[s16] \"派手にぶつかったよね？\""
10055020-286 = "……大したことないです。思いの外大きな音を立ててしまいましたが。"
10055020-287 = "イロハちゃん、起こしてー。"
10055020-288 = "自分で立てるでしょう。甘えないでください。"
10055020-292 = "つめたーい。"
10055020-293 = "っと捕まえた魚は……あ！先生が持っててくれたんですね！"
10055020-297 = "私たちが捕まえたの、本当にこれですか……？"
10055020-298 = "おおっ！すごい大物！"
10055020-299 = "小物かと。"
10055020-300 = "かかった時はもっと大きく見えたんですが……。"
10055020-301 = "まあでも、自給自足ができると証明できたのは大きな前進です。"
10055020-302 = "え？"
10055020-303 = "どうしました？"
10055020-304 = "いや、自給自足って……。"
10055020-305 = "これ、食べるの？"
10055020-306 = "そうですが？"
10055020-307 = "どうやって……？"
10055020-308 = "焼いたり……？"
10055020-312 = "そういえば、燃料を節約していたんでした。#nでは刺身に……。"
10055020-313 = "イロハちゃん、生きた魚さばけるの？"
10055020-314 = "……。"
10055020-318 = "……。"
10055020-319 = "……そうだ、チアキってたしか給食部にも入ってましたよね？"
10055020-320 = "安心しました。チアキに任せられますね。"
10055020-321 = "き、給食部は違うけどっ！？"
10055020-322 = "わ、私、生き物をさばくのはちょっと本当……。"
10055020-323 = "あっ！先生に頼むとか……。"
10055020-324 = "……それも悪くありませんが。"
10055020-325 = "先生に頼るのは最後の手段にしておきましょう。"
10055020-327 = "[ns17] \"私ってそんなに頼りない……？\"\n[ns18] \"全然やるよ。\""
10055020-330 = "そういう話ではなく……。"
10055020-331 = "先生は招待客なんです。"
10055020-332 = "……まあこんな状況でそんなこと、意味がないかもしれませんが。#n少なくとも一人はそう思ってるってことです。"
10055020-333 = "あはは……マコト先輩もね、一応責任感あるし……。"
10055020-334 = "あの人が責任感……？本気で言ってるんですか、それ。"
10055020-335 = "えーと、口に出さないだけで、そう思っているんじゃないかな～なんて……。"
10055020-339 = "とにかく。魚は私がなんとかします。"
10055020-340 = "おおっ！もしやイロハちゃんの手作り料理！？万魔殿に来て初めて！！"
10055020-341 = "遭難も悪いことばかりじゃないね！"
10055020-342 = "言っておきますが、期待はしないでください。私も初めてなので。"
10055020-344 = "まずウロコを……。"
10055020-345 = "いや頭……うわあっ！？"
10055020-352 = "一応聞こう。"
10055020-353 = "イロハ……この、謎の物体？はなんだ……？"
10055020-354 = "……刺身です。"
10055020-358 = "チアキ！もう、いつまで笑ってるんですか！！"
10055020-359 = "だってさあ、これを見たら……あはははっ！"
10055020-360 = "あら、騒がしいと思ったら釣りなんてしていたのね。"
10055020-361 = "でもこれ……食べられるのかしら？"
10055020-366 = "……あむ。"
10055020-370 = "わあ！イブキこれ知ってる！しんせん？な味！"
10055020-371 = "あははっ！たしかに新鮮な味です！"
10055020-372 = "……イブキちゃん、本当に大丈夫？"
10055020-373 = "うん！だってこんなお刺身はじめて！たのしい！"
10055020-374 = "まあイブキちゃんがそう言うのなら……。"
10055020-375 = "う、うむ。大事なのはやはり味だからな。"
10055020-377 = "まあ、すり身も中々悪くないな。"
10055020-378 = "……だってイロハちゃん！あはははっ！"
