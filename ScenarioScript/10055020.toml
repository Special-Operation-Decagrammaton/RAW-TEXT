10055020-219 = "……那個社團有存在的意義嗎？"
10055020-220 = "當然有！現在欣嫩火山正在建造水壩……#n按照計算，再過2年就會有一條橫越格黑娜學園的河哦！"
10055020-221 = "是橫越學園中心的河耶……真想親眼看看！"
