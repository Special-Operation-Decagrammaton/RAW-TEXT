10055020-219 = "...Then what's even the point?"
10055020-220 = "To fish! Eventually! They're building a dam near Hinnom Volcano as we speak, and according to projections, it'll be done in two years! We'll have a river smack-dab in the middle of Gehenna!"
10055020-221 = "A river running through the academy... Now THAT'D be a scoop!"
10055020-222 = ""
10055020-224 = ""
10055020-225 = "You've gone way off course here..."
10055020-226 = "You know what, it's my bad. I should know better than to try to understand the weirdos that are our students by this point."
