10055020-158 = ""
10055020-159 = "……至於伊吹，老師你應該明白吧？"
10055020-160 = "[s9] 「漂流的事要保密對吧？」\n[s10] 「他知道的話會擔心的。」"
10055020-163 = "雖然這麼說或許很失禮……"
10055020-164 = "但我真心覺得能跟老師一起遇難真是太好了。"
10055020-165 = "要是只有我們幾個遇難的話……"
10055020-166 = "話雖如此，或許差不多該認真想想對策了。"
10055020-167 = "雖然說是一週，但實際上根本不知道救援什麼時候會來。#n光靠節省物資撐下去也是有極限的……"
10055020-168 = "…………"
10055020-169 = "……唉。"
10055020-170 = "為什麼這艘船上只有我一個人在煩惱這種現實問題啊？真是麻煩死了。"
10055020-171 = "[s11] 「老，老師會盡全力幫忙的！」\n[s12] 「一起加油吧！」"
10055020-174 = "老師你也是受邀來避暑，結果卻變成這樣……彼此都不容易呢。"
10055020-175 = "……總之，先從緊急的問題開始解決吧？"
10055020-176 = "按優先順序來看，[ruby=Survival]生存[/ruby]最重要的……"
