[translation]
21190-1 = "제19화;더블오"
21190-2 = "밀레니엄 게임개발부"
21190-4 = "언니! 아직 멀었어?!"
21190-5 = "기, 기다려. 재촉하지 마. 이것만 입력하면 끝나니까……."
21190-6 = "남은 시간 2분인데 어떻게 재촉을 안 해!"
21190-7 = "정확히는 96초입니다. 이 말을 하는 동안 92초……."
21190-8 = "아, 알았다고! 다 됐다니까!"
21190-12 = "이 부분 테스트는 약식으로 진행…… 좋아."
21190-13 = "오류가 발생하지는 않아. 모모이!"
21190-14 = "오, 오케이! 전송한다! 파일 업로드! 전송 시간 예상 15초! 아리스!"
21190-15 = "남은 시간 19초……."
21190-16 = "제, 제발……."
21190-20 = "저, 전송 완료……."
21190-22 = "밀레니엄 프라이스 공모전에 참여 완료되셨습니다."
21190-23 = "됐다아아아아!"
21190-24 = "하아. 아슬아슬했네."
21190-25 = "이제…… 앞으로 사흘 뒤 있을 발표를 기다리면 되는 건가."
21190-26 = "일정에는 맞추는데 성공했지만, 아직 결과가 나온 건 아니야."
21190-27 = "사흘 뒤, 우리는 이 방에서 쫓겨나거나 그대로 있거나가 결정될 거야."
21190-28 = "그래서, 제안인데 말야."
21190-29 = "그럼 남은 시간 동안 웹 공개 판으로 테일즈 사가 크로니클 2를 올려보는 건 어떨까?"
21190-31 = "?!"
21190-32 = "어? 어째서?"
21190-33 = "심사위원의 평가보다 먼저, 사람들의 반응을 보고 싶지 않아?!"
21190-34 = "으음. 아무리 생각해도…… 좀 무서운데. 악플도 걱정스럽고."
21190-35 = "무슨 말이야! 애초에 우리끼리만 즐기기 위해, 아니 밀레니엄 프라이스에 출품하기 위해 만든 게임이 아니잖아!"
21190-36 = "자신을 가져! 우리는 정말 최선을 다했다고!"
21190-37 = "그, 그건 그렇지만……."
21190-38 = "……올리자."
21190-39 = "어?"
21190-40 = "작품이라는 건…… 타인의 평가를 통해 완성되는 거니까."
21190-41 = "나는…… 우리의 게임이 완성되었으면 좋겠어."
21190-42 = "유즈 쨩……."
21190-43 = "괜찮아. 설령 또 지난번과 마찬가지로 악플 퍼레이드가 열린다 해도……"
21190-44 = "최선을 다했으니까, 너희들이 함께 있으니……까. 받아들일 수 있을 거야."
21190-46 = "나는 정말, 괜찮아."
21190-48 = "……."
21190-49 = "그럼 바로 업로드!"
21190-50 = "아앗! 자, 잠깐만!"
21190-52 = "전송 완료! 플레이 이후 소감이 올라오려면 2, 3시간은 족히 걸릴 테니 그동안 좀 쉴까!"
21190-53 = "하아. 그래."
21190-55 = "……"
21190-57 = "…… (스윽)"
21190-58 = "응? 아리스? 컴퓨터 앞에는 왜 앉는 거야?"
21190-59 = "대기합니다."
21190-60 = "다른 이들의 다운로드가 시작되었습니다. 궁금합니다."
21190-61 = "대기해도 게임을 플레이한, 제대로 된 리뷰나 피드백은 얻지 못할 거야."
21190-62 = "기다리겠습니다."
21190-63 = "……나, 나도……."
21190-64 = "어차피 무서워서 잠도 못 잘 거야."
21190-65 = "기다릴래."
21190-66 = "……으음."
21190-67 = "나도 두근거리기 시작했어."
21190-68 = "하아. 정작 나는 기대보다 걱정이네. 으아! 내가 올리자고 해놓고 내가 미쳐버릴 것 같아!"
21190-69 = "(띠링)"
21190-70 = "앗. 첫 댓글이 달렸어."
21190-71 = "뭐?! 뭐?! 뭐?!"
21190-72 = "<hermet021: 와 이거 올해의 쿠소게 1위 찍었던 그 작품 아니냐? 게임제작 접은 줄 알았는데 아직도 주제 파악 못 하고 후속작을 내고 있네 ㅋㅋㅋ >"
21190-73 = "……."
21190-74 = "아, 아리스. 너무 신경 쓰지……"
21190-75 = "네."
21190-76 = "마키에게 연락, 해당 ip의 주소로 최대출력 빔 포를 먹여주고 오겠습니다."
21190-77 = "아니 그러면 안돼!"
21190-78 = "……응."
21190-79 = "게임을 해보지도 않은 사람의 말이잖아……. 일일이 신경 쓰지 마."
21190-80 = "(띠링)"
21190-81 = "<Kotoha0507: 1은 분명 망작이지만, 새로운 느낌이 있는, 흔한 작품은 아니었죠. 2에서는 보다 발전된 새로움을 줄 수 있지 않을까 기대됩니다.>"
21190-82 = "오오. 슬슬 제대로 된 반응이……."
21190-83 = "(띠링)"
21190-84 = "<QueenC: 두렵다. 이 게임을 끝냈을 때…… 미래의 나는 어떤 생각을 하고 있을까. 이 게임을 다운로드한 과거의 나를 증오할까. 아님 올해 최고의 선택이었다고 생각할까.>"
21190-85 = "(띠리링)"
21190-86 = "<kirakiraNO1: 나는 이 게임을 하며, 처음으로 게임이 질병이라고 생각하게 되었어. 플레이 내내 고통스러웠지. 그런데 어째서일까. 다시 이 게임을 받고 있어.>"
21190-87 = "괴, 굉장해! 우리 게임 지금 엄청 기대받고 있는 거 같지 않아?!"
21190-88 = "으으으으음. 전체적으로 다들 개봉되지 않은 시한폭탄을 뜯는 것 같은 기대감 같은데."
21190-89 = "지뢰라는 것을 알면서도 밟아보려는 심리 아닐까……"
21190-91 = "(띠링띠링)"
21190-92 = "<cat0808:자, 나는 2시간 뒤 보충시험을 치르러 가야 해. 아니면 TSC2를 하겠지. 나는 두 가지의 선택 중, TSC2를 선택했어.>"
21190-93 = "<Yousee-me: 당연한 거 아냐? 시험이야 다시 치르면 되지만, TSC2를 2시간 동안 할 수 없다는 건 치명적인 일이니까!>"
21190-94 = "……어…… 이런 경우엔 가능하면 시험을 치러 가줬으면 좋겠는데."
21190-95 = "다, 다운로드 조회 수 벌써 2000 돌파?! 뭔가 이상한데."
21190-96 = "아…… 유명한 포탈 사이트에 우리 게임이 발표되었다는 게시글이 뜬 모양이야."
21190-97 = "으아아아아! 무관심만 아니면 좋겠다고 생각했는데! 갑자기 무서워지기 시작했어!"
21190-100 = "……."
21190-101 = "……두근두근 거립니다."
21190-102 = "우우! 기대랑 불안으로 심장이 터질 것 같아!"
21190-103 = "(콰아아아앙!)"
21190-104 = "?!"
21190-105 = "모모이의 심장이 폭발했습니까?"
21190-106 = "아, 아니야! 내가 아니라!"
21190-107 = "대체 무슨 일이……! 게임기가 폭발했어?!"
21190-108 = "너, 너무 오래 썼나?"
21190-109 = "아니야! 이 포격은, 13.97mm 탄환……! 카린 선배의……!"
21190-110 = "(콰과과광!)"
21190-111 = "꺄아아앗!"
21190-112 = "원거리 공격 확인, 방향은 부실 정면 11시! 거리는 약 1km……!"
21190-113 = "크윽! 지난 번의 복수인가!"
21190-114 = "대응 사격 하겠습니다!"
21190-115 = "아니야 아리스! 일단 나가자! 여기에는 선생님도 있고, 무엇보다……"
21190-116 = "여기서 싸우면! 우리의 부실이 박살 나버려!"
21190-117 = "언니……."
21190-118 = "바, 밖에도 학생회 군단이! 거울의 복수인가?!"
21190-119 = "조, 좀 미안하긴 했지만 갑자기 억울해지는걸!"
21190-120 = "히익!"
21190-121 = "[s1] \"침착해.\"\n[s2] \"일단 밖으로 나가자.\""
21190-122 = "선생님……!"
21190-123 = "선생님……!"
21190-124 = "넵!"
21190-125 = "아리스! 나랑 유즈가 앞에 설게! 무슨 말인지 알지?"
21190-126 = "넵."
21190-127 = "아리스가, 선생님과 모두를 지키겠습니다."
21190-129 = "좋아! 가자!!"
