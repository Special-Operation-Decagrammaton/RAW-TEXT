[translation]
80000056-1 = "책상에서도 문제없이"
80000056-3 = "……아."
80000056-4 = "어서 오세요, 선생님. 늦은 시간인데도 와 주셔서 감사해요."
80000056-5 = "……네? 아. 아뇨, 딱히 책 반납 때문에 부른 건 아닌데……."
80000056-6 = "뭔가, 어느새 제 이미지는 그런 느낌으로 변해 있었던 모양이네요. 아하하……."
80000056-7 = "오늘 일은 전혀 그런 쪽은 아니니까 걱정하지 않으셔도 돼요."
80000056-8 = "오늘은……. 이것 때문에 와 달라고 부탁드렸던 거예요."
80000056-13 = "원래라면 제가 직접 찾아가서 드리는 게 맞겠지만……. 하필 또 오늘이 당직이라……."
80000056-14 = "[s1] \"……책 케이스?\"\n[s2] \"구슬 초콜릿……?\""
80000056-15 = "네. 오늘은 발렌타인 데이잖아요? 그래서 개인적으로 조금 준비해 봤어요."
80000056-16 = "네. 오늘은 발렌타인 데이잖아요? 그래서 개인적으로 조금 준비해 봤어요."
80000056-17 = "모처럼이랄까……. 이런 식으로라도 선생님께 보답해 드릴 기회가 많지는 않으니까요. 꼭 챙겨 드리고 싶었거든요."
80000056-18 = "이게 이렇게 보여도, 안에 든 초코는 꽤 맛있다고요? 제가 만든 건 아니지만 자신 있게 권할 수 있어요!"
80000056-19 = "……음? 왜 그러세요, 선생님?"
80000056-20 = "괜찮냐고요? 갑자기 그게 무슨 말씀이세요?"
80000056-21 = "……아."
80000056-22 = "도서관에서, 책 보면서 초콜릿을 먹어도 괜찮냐고요? 손에 묻거나 책이 더러워지는 게 아니냐고요?"
80000056-23 = "……후훗. 역시 선생님이시군요. 세심한 배려 감사드려요."
80000056-24 = "하지만 괜찮답니다. 저도 당연히 그 부분에 대해서 생각하지 않았던 게 아니니까요."
80000056-25 = "내용물이 초콜릿이라고 해도, 이 구슬 초콜릿은 손에 묻거나 가루가 떨어지지 않도록 잘 코팅이 돼 있는 제품이거든요."
80000056-26 = "사실 도서부 부원들은 꽤나 즐겨 먹는 간식이에요. 물론 평소에 먹는 게, 지금처럼 발렌타인 버전은 아니지만요."
80000056-27 = "……선생님."
80000056-28 = "그……. 괜찮으시면……."
80000056-29 = "[s3] \"그럼 이왕 온 김에 앉아 있다 갈까?\"\n[s4] \"나란히 앉아서 나눠 먹을까? 각자 할 거 하며.\""
80000056-30 = "……!!"
80000056-31 = "……!!"
80000056-32 = "서, 선생님……."
80000056-33 = "……"
80000056-37 = "……네!!"
80000056-39 = "(이후 새벽 늦은 시간까지 시미코와 나란히 앉아, 각자의 일을 하며 초콜릿을 나눠 먹었다.)"
80000056-40 = "(초콜릿을 다 먹을 때쯤, 잠든 시미코에게 조용히 모포를 덮어주고 샬레로 돌아왔다.)"
