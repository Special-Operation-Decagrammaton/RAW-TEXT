[translation]
70008030-1 = "살벌! 망량즈 나이트! 3"
70008030-2 = "자자, 다들 모이신 듯하니……."
70008030-3 = "그러면…… 올해의 망량즈 나이트를 시작하겠습니다!"
70008030-13 = "(와…… 다들 이름으로 들어본 대단한 망량즈 리더들뿐이네…… 으으, 긴장돼……)"
70008030-14 = "(어쩌면, 내가 여기서 제일 초라한 거 아니야?)"
70008030-15 = "웅성웅성……."
70008030-16 = "이봐, 저 녀석 봤어?"
70008030-17 = "올해는 엄청 위험한 녀석이 있는데."
70008030-18 = "(으아아……! 진짜로 엄청난 거물이 왔나 봐! 저 쟁쟁한 리더들이 긴장할 정도라니……! 대체 누구지?!)"
70008030-23 = "저거, 다른 소속 아니야……?"
70008030-24 = "백귀야행 밖에 저러고 다니는 제정신 아닌 놈들이 있다곤 하던데……."
70008030-29 = "정숙! 정숙! 정수~욱!!"
70008030-33 = "오늘 이 자리를 마련한 것은 우리 망량즈의 향방을 논하기 위함이요. 멋대로 떠들어 대기 위함이 아니요."
70008030-37 = "다들 집중한 듯하니 본제로 들어가지요. 최근 백귀야행의 모습 말이요."
70008030-38 = "무시당하고 있다…… 그렇게 느끼지 않으시오?"
70008030-39 = "그건…… 확실히 그럴지도. 요즘 아무도 우릴 무서워하는 느낌이 없어."
70008030-40 = "우리한테 말 한마디 없이 멋대로 신목제를 다시 열지 않나……."
70008030-41 = "맞아, 맞아! 우리 망량즈에 대한 존경이 느껴지지 않아!"
70008030-42 = "역시 다들 마음속 깊이 느낀 바가 있는 듯하군요."
70008030-43 = "예의 신목제 때도 망신만 당할 뻔한 걸, 길거리 망량즈의 아라타 공이 몸바쳐 항의하는 큰 공을 세워 이 자리에 초청 드린 것이요."
70008030-44 = "어, 엇?! 갑자기, 나?! 그…… 그렇지~ 신목제는, 백귀야행의 축제, 즉, 우리 축제니까…… 외부인 사정으로 멋대로 하게 둘 수가 없었다고 할까……."
70008030-45 = "무슨 공을 세웠다기에는…… 엄청 큰 사고를 쳐서 음양부랑 백화요란 놈들한테 잔뜩 혼난 기억밖에 없지만……."
70008030-46 = "바로 그거요! 백귀야행의 것은 백귀야행의 것, 더 나아가 우리 망량즈의 것! 우리가 우리의 것을 지키려 하는 게 뭐가 문제란 말이요!"
70008030-47 = "백귀야행을 지킨다고 잘난 척하는 백화요란은 본래 근본이 없는 집단. 먕량즈야말로 진정 백귀야행의 주인이란 말입니다!"
70008030-48 = "그래, 맞아! 말 한번 잘했다!"
70008030-49 = "맞아! 맞아!"
70008030-50 = "(그래, 바로 이거야! 이게 망량즈다운 일이지! 사실 나도 백귀야행의 전통을 지키고 있던 거야!)"
70008030-51 = "지금까지는 음양부 체면을 보아 넘어갔지만, 이제는 승부를 가릴 때가 되었소!"
70008030-52 = "다음 축제에 백화요란에 선전포고하는 것이요!"
70008030-54 = "(……? 응? 선전포고? 그게 무슨 소리야?)"
70008030-55 = "와아아! 좋다! 본때를 보여주자!"
70008030-56 = "뜻이 모인 듯하니, 바람처럼 결행합시다!"
70008030-57 = "백화요란이 가장 취약한 것은, 축제의 치안 관리로 흩어졌을 때. 그때까지 관광객 사이에 숨어 있다가 일제히 기습하는 겁니다!"
70008030-58 = "맞아, 맞아! 전부 해치워 버리자고!"
70008030-59 = "우리 축제를 되찾자! 관광객이니 뭐니 하는 외부인들도 전부 쫓아내 버리자고!"
70008030-60 = "아니, 그건 좀…… 별로지 않나?"
70008030-61 = "……지금, 누가 말했지?"
70008030-67 = "어, 어어……? 미, 밀지 마! 나, 나이긴 한데."
70008030-68 = "아라타 공. 누구보다 신목제 재개최에 반대하셨던 분이 어째서 이제서 그런 약한 소리를?"
70008030-69 = "아니, 그거랑 이거는 조금 다르지……! ……요."
70008030-70 = "이번 축제는 딱히 문제가 있는 것도 아니고, 다들 열심히 준비하고 있는데…… 물론, 얄미운 백화요란 놈들을 이번 기회에 혼내주거나 하는 건 좋은데……."
70008030-71 = "관계없는 사람들이나, 축제를 준비한 사람들까지 말려들게 하는 건 좀…… 그렇지 않아…… 요?"
70008030-72 = "그럼 우리가 나쁜 놈이라는 거냐! ……나쁜 놈이긴 하지만! 사실이라도 상처가 된다고!"
70008030-73 = "여기까지 와서 자기만 쏙 빠지겠다는 거야?!"
70008030-74 = "실망했습니다. 아라타 공. 누구보다 앞장설 줄 알았는데."
70008030-75 = "하지만 오늘 회합의 내용을 전부 들은 이상, 그냥 보내줄 수는……."
70008030-76 = "뭐, 뭐야! 우왓! 다가오지 마! 아, 아무나 도와……!"
70008030-81 = "이야기는 전부 들었습니다!"
70008030-85 = "닌자 이즈나의 귀에 들어온 이상, 그 사악한 계획은 여기까지입니다!"
70008030-87 = "닌자?! 닌자, 어째서?!"
70008030-88 = "그러고 보니, 들어봤어! 음양부에서, 비밀 에이전트를 양성하고 있다고! 그런데 설마! 그 정체가 닌자였을 줄은!"
70008030-90 = "냐하하핫! 바로 그렇습니다~ 진가를 알아봐 주시는군요!"
70008030-91 = "역시, 이야기가 지루해지려나~ 싶을 때 등장하는 닌자만큼 재밌는…… 아니, 좋은 전개는 없네요~"
70008030-92 = "이게 무슨 짓이냐……! 음양부 부장, 아마치 니야……! 음양부가 중립을 깨고 끼어든다니!"
70008030-93 = "무슨 말씀인지 저는 도통~ 그저 다음 축제도 무사히 열리길 바라는 마음에, 뭔가 문제는 없을까 하고~ 귀여운 후배에게 조사를 부탁했을 뿐인데요?"
70008030-94 = "그런, 티 나는 거짓말을…….!"
70008030-95 = "우리 회합에 끼어들고도 무사할 줄 아나! 여기 있는 모든 망량즈들이 힘을 합치면 음양부나, 백화요란쯤은……."
70008030-96 = "네~ 네~ 바로 그게 문제라서요~"
70008030-97 = "떠돌이 개가 한두 마리씩 있으면 귀엽지만, 무리를 지으면 늑대 떼가 된단 말이죠~?"
70008030-98 = "이얏! 이즈나류 인법! 때찌때찌의 술!"
70008030-99 = "자, 잠깐, 나는 망량즈 치고는 그다지 사악하지 않은 편이야! 끄악!"
70008030-100 = "한 명이잖아! 어떻게 좀 해보라고! 끄악!"
70008030-101 = "뭐~ 무리 짓기 전에는, 여전히 귀엽네요~ 냐하하하! 저는 그러면 바빠서 이만~"
70008030-105 = "음양부장, 이 녀석……!"
70008030-106 = "큰, 큰일입니다! 리더! 백화요란이에요! 백화요란이 나타났어요!"
70008030-108 = "뭐? 닌자도 모자라서 백화요란까지 나타났다고?! 나는 손 뗄래!"
70008030-112 = "다들 도망쳐!"
70008030-120 = "머, 멈추시오! 이만한 수가 있으면 힘을 합쳐 싸우면……!"
70008030-121 = "찾았습니다! 악의 우두머리! 이얏!"
70008030-122 = "아얏! 으아앙! 기껏 사람들을 모았는데 이게 뭐야!"
70008030-123 = "나도 몰라! 도망칠래!"
70008030-135 = "하아하아…… 겨우 빠져나왔네."
70008030-136 = "이게 다 무슨 일이래…… 나는 그냥 망량즈다운 망량즈가 되고 싶었을 뿐인데…… 쫓기고, 도망치고……."
70008030-137 = "기대했던 망량즈 나이트는 사실 그렇게 멋진 것도 아니었고……."
70008030-138 = "대체, 어디서부터 잘못된 걸까."
70008030-139 = "어이, 너."
70008030-140 = "앗, 이 목소리는……!"
70008030-141 = "멋진 가면을 빌려준 누님!"
70008030-142 = "빌려주긴 뭘 빌려줘! 너희가 다짜고짜 몰려와서 뺏어간 거잖아!"
70008030-143 = "헬멧단이 헬멧이 없으면 어떡하냐고! 예비 헬멧이 남아 있어서 다행이지!"
70008030-144 = "야. 내 소중한 헬멧은 멀쩡하겠지?"
70008030-145 = "응, 여기. 가져가."
70008030-150 = "오, 오오. 뭐야, 되게 순순히 넘겨주네…… 망가진 부분도, 딱히 없는 거 같고."
70008030-155 = "……뭐냐, 복수해 주려고 잔뜩 벼리고 왔는데."
70008030-156 = "그렇게 죽상으로 땅 파고 있으니까 그럴 마음도 없어진다, 야."
70008030-157 = "누니이임~"
70008030-158 = "누가 누님이야!"
70008030-159 = "망량즈답게 산다는 건 뭘까……?"
70008030-160 = "망량즈? 망량즈가 뭔데? 그걸 왜 나한테 물어봐?"
70008030-161 = "역시 그렇겠지……."
70008030-167 = "망량즈인지 뭔지는 몰라도, 너네도 이 동네에서 그냥 막사는 애들 아니야? 딱 보니까 알겠는데."
70008030-168 = "그러면 복잡하게 생각할 게 뭐 있어? 그냥 즐기면 되는 거지."
70008030-169 = "즐긴다?"
70008030-170 = "뭐, 그렇지. 공부나, 부 활동 같은 귀찮은 거 하기 싫어서 이러고 있는 거 아니야?"
70008030-171 = "그건, 맞긴 한데……."
70008030-172 = "그러면 시간 아깝게 뭘 고민해. 하고 싶은 거 하고, 하기 싫으면 안 하면 되는 거지."
70008030-173 = "그런, 가? 그런 거 같기도…… 으음……."
70008030-174 = "……야."
70008030-175 = "헬멧을 빼앗아 간…… 아니, 빌려준 대가를 받아야겠어."
70008030-176 = "뭐?! 나, 나는 돈 없는데!"
70008030-177 = "누굴 깡패로 아냐! 비슷한 거는 맞지만. 그런 건 됐고, 나하고 친구들이 백귀야행은 처음이거든? 그러니까 길 안내나 좀 해달라고."
70008030-178 = "우리는 여기 관광지 같은 거 하나도 모른단 말이지."
70008030-179 = "뭐? 백귀야행이 처음이라고? 그러면 신목 전망대도 아직 안 가본 거야?"
70008030-180 = "뭔 전망대? 아, 그 커다란 나무? 전망대도 있었어?"
70008030-181 = "말도 안 돼! 거길 안 가 봤다면, 아직 백귀야행에 왔다고 말할 수 없어!"
70008030-182 = "지금 당장 가자!"
70008030-183 = "어, 어어? 기운 차린 건 좋긴 한데, 뭔가 기분 전환이 빠르지 않아?"
70008030-184 = "이러고 있을 시간이 아깝다고!! 해가 지면, 해가 지는 대로의 멋도 있지만, 해가 떠 있을 때의 전망대 풍경을 보는 거랑은 완전 다르다니까!!"
70008030-185 = "빨리 가자!! 따라와, 누님!!"
70008030-186 = "그러니까 누가 네 누님이냐고!!"
70008030-188 = "아라타는 물론이고, 이제는 기억하는 사람이 거의 없지만, 망량즈는 무엇에도 얽매이지 않는 자들을 부르던 말."
70008030-189 = "어떤 의미로 매 순간 새로운 즐거움을 찾아다니는 아라타야 말로 가장 망량즈다운 것일지도."
70008030-190 = "살벌! 망량즈 나이트!"
