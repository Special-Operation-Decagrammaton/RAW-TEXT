[translation]
1600103-1 = "우연한 미행 데이트"
1600103-2 = "야호, 주인님! 여기야, 여기! 기다리고 있었어!"
1600103-3 = "바쁜데도 나와줘서 고마워! 역시 주인님뿐이야!"
1600103-4 = "[s1] \"무슨 일이야?\"\n[s2] \"당연히 나와야지. 누가 부른 건데.\""
1600103-5 = "갑작스럽지만, 주인님의 도움이 필요해!!"
1600103-6 = "진짜!? 와! 주인님 최고!!"
1600103-7 = "음? 그런데 무슨 도움이 필요하냐고? 으음……"
1600103-8 = "……글쎄?"
1600103-9 = "사실 아직 구체적으로는 생각 안 해봤어!"
1600103-10 = "[s] \"……???\""
1600103-11 = "……응? 표정이 왜 그래? 주인님."
1600103-12 = "진짜 도움이 필요한 게 맞냐고? 물론이지! 단지 구체적으로 생각하지 않았다는 것뿐!"
1600103-13 = "오늘은 마침 모처럼 아무런 임무도 수업도 없는 날이거든."
1600103-14 = "이런 날엔 함께 해줄 사람이 필요한 법이잖아? 그게 나한테는 당연히 주인님 아니겠어?"
1600103-15 = "응? 무슨 데이트 신청인 거냐고?"
1600103-16 = "흠~. 글쎄. 왠지 오늘따라 주인님이 꼭 있었으면 좋겠다고 생각한 것 때문이긴 한데……"
1600103-17 = "……음! 그럼 그럴 지도! 주인님만 좋다면 아스나는 당연히 대환영!"
1600103-18 = "자, 자! 그런 고로 시간이 없다고! 빨리 출발해볼까! 괜찮지, 주인님? 상관없지?"
1600103-21 = "출-발-!!"
1600103-23 = "(뭐라고 말하기도 전에, 아스나의 팔에 이끌려 끌려 나가기 시작했다.)"
1600103-25 = "그러니까 여기 주변에 잠복해 있다가 지나가는 학생들을 붙잡으면……"
1600103-26 = "음음 확실하군. 이거라면 완벽하게……?"
1600103-27 = "……! 자, 잠깐! 저기 저 녀석, C&C의 그 메이드 녀석 아냐?"
1600103-29 = "~♬~♪"
1600103-32 = "지, 진짜다. 젠장 녀석들에게 걸리면 뼈도 못 추린다. 일단 자릴 피하자."
1600103-38 = "어? 방금 누군가 우리 이야기하지 않았어? 뭔가 들린 거 같은데……"
1600103-39 = "……기분 탓인가?"
1600103-40 = "……뭐, 아무려면 어때! 신경 쓸 필요 없겠지!"
1600103-41 = "빨리 가자, 주인님! 오늘은 같이 최대한 많이 돌아다니는 게 목표라고!"
1600103-43 = "(아스나는 태연하게 팔짱을 끼더니 다시 성큼성큼 나아갔다.)"
1600103-45 = "아까는 실패했지만 여기선 확실히……"
1600103-48 = "……!? 저, 저기 아까 그 녀석들! 또 오잖아!? 쳇. 튀어!"
1600103-51 = "이리 와, 주인님! 마침 전부터 같이 하고 싶었던 게임이 있다고!"
1600103-52 = "오오-! 주인님은 이미 아는 게임이야? 잘 됐다. 나랑 한 판 붙어!"
1600103-53 = "응? 하는 방법은 알고 있냐고? 아니? 오늘 처음 해보는 건데?"
1600103-54 = "뭐, 이런 건 대충 감으로 하는 거지! 그리고 누가 이기는지가 그렇게 중요한 건 아니잖아?"
1600103-55 = "……나랑 주인님이, 이렇게 같이 게임을 한다는 게 중요한 거라고."
1600103-56 = "좋아-! 그럼 시작이다!!"
1600103-57 = "(상당히 많이 해 본 게임이었기에, 자신 있게 아스나의 도전을 받아들였다.)"
1600103-59 = "(……놀랍게도 전패했다.)"
1600103-63 = "이상해…… 이건 말도 안 돼…… 아니, 사실 우리 쫓기고 있는 걸까……?"
1600103-64 = "또, 또 온다! 빌어먹을…… 도망쳐!"
1600103-67 = "유원지다! 나, 유원지에 이런 식으로 와 보는 건 처음이야!"
1600103-68 = "응? 임무 외적으로 놀러 온 적은 없냐고? 아니? 임무로 와도 그냥 놀이기구 놀았었는데?"
1600103-69 = "이런 식이라는 건, 당연히 이렇게 주인님이랑 같이 오는 걸 말하는 거지."
1600103-70 = "아까도 말했잖아? 뭘 하는지는 아무래도 상관없다고!"
1600103-71 = "주인님이랑 같이 하는 거니까 특별하게 좋아지는 거야. 오락실도, 놀이동산도!"
1600103-72 = "아마 그냥 쭉 같이 걷기만 해도, 주인님이랑 걷는 거라면 그건 분명 재밌을 거야."
1600103-73 = "말 나온 김에 한 번 쭉 걸어볼까? 주인님, 다리 안 아파?"
1600103-74 = "[s] \"괜찮아.\""
1600103-75 = "좋아-! 그럼 해가 질 때까지 같이 걸어보는 거야!! 잘 따라오라고!"
1600103-76 = "아니, 그치만 다리 아프면 무리하지 말고 꼭 말해. 알았지? 내가 업어줄 테니까!"
1600103-78 = "(아스나는 그렇게 말하며 또 성큼성큼 나아갔다.)"
1600103-80 = "(……결국 체력이 먼저 바닥난 관계로 캠퍼스까지 아스나에게 업혀왔다.)"
1600103-82 = "아아-! 진~~~~짜 재밌었다-! 너무 좋아!"
1600103-83 = "응? 주인님? 방금 뭐라고 했어?"
1600103-84 = "……그만 내려 달라고? 계속 업혀 있으니 주변 사람들 눈이 신경 쓰인다고?"
1600103-85 = "왜? 뭐가 신경 쓰인다는 거야?"
1600103-86 = "으음~. 알았어. 이해는 안 가지만, 주인님이 그렇다면 그런 거겠지. 영차-."
1600103-89 = "어때? 다리는 좀 편해졌어?"
1600103-90 = "[s] (챙겨 두었던 음료를 건네 준다)"
1600103-91 = "오-? 에너지드링크네? 나 주는 거야? 고마워, 주인님!"
1600103-92 = "(꿀꺽꿀꺽)"
1600103-93 = "하-! 시원해-!!"
1600103-94 = "……"
1600103-95 = "정말 좋다. ……신기해."
1600103-96 = "사실 평소랑 별반 차이도 없는 일들이었는데, 주인님이랑 같이 하니까 느낌이 너무 달라."
1600103-97 = "주인님한테는…… 뭔가 특별한 게 있는 걸지도?"
1600103-98 = "히히…… 그냥 그런 느낌이 들었어."
1600103-99 = "……그럼 날도 늦었으니, 주인님도 그만 슬슬 돌아 가야하지?"
1600103-100 = "이왕 여기까지 업어 온 거니 마지막까지 업어서 데려다 줄까? 응? 그건 싫다고?"
1600103-101 = "아하하하하! 농담이야, 농담."
1600103-102 = "자. 그럼 마지막으로 먹었던 캔을 쓰레기통에 슝-!"
1600103-104 = "슈우우웅-."
1600103-105 = "……아. 쓰레기통 뒤로 넘어가버렸다."
1600103-106 = "까앙-!!"
1600103-107 = "……응? 방금 뭔가 부딪친 소리가……"
1600103-109 = "……?"
1600103-110 = "비, 빌어먹을! 역시 다 알면서 쫓아오고 있던 거였잖아!!"
1600103-111 = "어쩔 수 없다. 이번에는 포기하는 수밖에……!"
1600103-112 = "젠장! 기억해 두라고!! 두고보자 C&C놈들……!!"
1600103-115 = "……"
1600103-116 = "……?"
1600103-118 = "……누구야, 저 사람들?"
