[translation]
10042050-1 = "제5화;WHAT A LOVELY DAY"
10042050-2 = "이상하군요."
10042050-3 = "[s] \"뭐가?\""
10042050-4 = "흔적이 어느 순간부터 끊겨 있습니다. 점액…… 소스도 보이지 않고, 범벅이 된 학생도 보이지 않습니다."
10042050-5 = "그, 그 대신에……."
10042050-6 = "어째, 사방이 쓰러진 학생들로 가득한 것 같은데……?"
10042050-7 = "'패턴'에 변화가 생겼다고 보는 것이 맞을까요?"
10042050-8 = "[s1] \"'패턴'이라…….\"\n[s2] \"치나츠도 적응하기 시작했구나.\""
10042050-11 = "네? 패턴……? 그, 그러고 보니 어느새 저까지……?!?!"
10042050-12 = "우선, 샘플을 하나 확보하도록 하죠. 저기에 쓰러져 있는 희생자로 하겠습니다."
10042050-15 = "여보세요? 괜찮으세요? 안 되겠는데…… 좀처럼 의식을 찾지 못하는 것 같아."
10042050-16 = "다행히도 저에게 정신을 잃은 사람을 원래대로 되돌리는 기술이 있습니다."
10042050-21 = "정말요? 역시 세나 씨네요!"
10042050-25 = "히, 히익?!"
10042050-26 = "아파! 뭐야?!"
10042050-27 = "[s] \"……이래도 돼?\""
10042050-28 = "물론입니다. 빠른 각성이 필요할 때에는 이것만 한 방법도 없죠."
10042050-29 = "저…… 세나 선배님? 그거, 평소에는 날뛰는 환자를 진정시키거나, 기절한 척한 학생이 정말로 기절했는지 알아보기 위해 사용하지 않으셨나요……?"
10042050-30 = "물론 그 용도로도 사용할 수 있습니다, 치나츠. 언제 어느 때이든, 모든 방법으로 상황에 대응할 수 있는 만능 툴인 셈이죠."
10042050-31 = "그리고 게헨나의 학생을 상대할 때에는, 이따금 가차 없어질 필요가 있습니다."
10042050-32 = "응급환자에게 가차 없어지라는 뜻은 아니지 않을까……."
10042050-33 = "죄송합니다, 저희 전 선배가 좀……."
10042050-34 = "아, 아무튼 말씀……! 말씀을 들어 보죠! 방금 깨어나신 분께!"
10042050-36 = "아직도 잘 모르겠어……. 내가 왜 여기에 있지?"
10042050-38 = "당신은 잠시 정신을 잃었습니다. 혹시 움직이는 팬케이크 현상에 대해 기억나는 것이 있습니까?"
10042050-39 = "팬케이크……? 가만, 그 단어를 들으니 무언가가 기억날 것 같은데……. 아!"
10042050-40 = "팬케이크! 무지 크고 제멋대로 날뛰는, 보라색 팬케이크!!!"
10042050-41 = "그건 엄밀하게 말해 팬케이크가 아닙니다. 팬케이크의 모습을 하고 있는 무언가죠."
10042050-42 = "어떻게 하시겠나요? 저희와 함께 가시겠습니까?"
10042050-46 = "함께……?"
10042050-47 = "하, 하하……."
10042050-51 = "웃기지 마…… 웃기지 마! 우린 모두 당하고 말 거야!"
10042050-52 = "너도! 나도! 우리 모두 마찬가지야! 절대로 피할 수 없어!"
10042050-53 = "[s3] \"가, 갑자기 무슨 일이야?!\"\n[s4] \"진정해! 큰 소리는 위험하다고!\""
10042050-56 = "공황이로군요."
10042050-60 = "?!"
10042050-61 = "모두, 숨어요!"
10042050-62 = "저쪽에 안전해 보이는 장소가 있습니다."
10042050-68 = "모두 모이셨습니까? 낙오자는……."
10042050-69 = "……이런."
10042050-70 = "왜, 왜 그러시죠?"
10042050-71 = "저쪽을 보십시오."
10042050-72 = "왔구나…… 그것이 왔어. 네가 결국 여기까지 왔구나."
10042050-73 = "그래, 우리도 다른 누군가에게 차례를 줄 때가 됐지."
10042050-74 = "지금 뭐라고 하는 거야?"
10042050-75 = "극도로 몰릴 경우 오히려 어그레시브하게 변하는 증상입니다. 흔한 케이스죠."
10042050-77 = "상황 자체가 흔하지 않은데!?!?"
10042050-82 = "마지막은 정해져 있어. 모두가 마찬가지지! 피할 수 있는 운명 따윈 없고, 모두는 정해진 마지막을 향해 달린다!"
10042050-83 = "네가 지나간 길에는, 언제나 끈적하고 탁한 녹색 소스 범벅 자국이 남겨지곤 했지, 팬케이크!"
10042050-84 = "찾아라! 눈을 떠! 소리를 지르고 하늘 높이 총을 들어라! 출항이다!"
10042050-85 = "날 봐라! 날 쳐다보라고! 바로 여기다!"
10042050-86 = "멋지군! 정말 끝내주는 날이야! 우린 참 이상한 때에 만난 셈이군!"
10042050-87 = "웬 수상한 사람이 그곳에 가지 말라고 하면, 비웃어줘라!"
10042050-88 = "무엇인가가 너희를 쫓아온다면, 흩어져라!"
10042050-89 = "그리고 밖에서 이상한 소리가 들려온다면……"
10042050-90 = "사랑을 해라!!!!!"
10042050-98 = "[ns5] \"……가 버렸다…….\"\n[ns6] \"오우……. \""
10042050-101 = "……괜찮으실까요?"
10042050-102 = "말씀드렸듯이 요란하게 보일 뿐, 딱히 생명이나 이후 활동에는 지장이 없을 겁니다."
10042050-103 = "부상의 종류는 조금 특이하지만, 그 정도만으로 따진다면 평소에도 보는 수준이라고 간주하여 주시면 됩니다."
10042050-104 = "자주? 저런 걸……?"
10042050-105 = "동아리 간의 항쟁이나……. 불량배들과의 싸움 같은 건 늘 있는 일이니까요, 여기서는."
10042050-106 = "급양부 분들은 언제나 급양부 일로 바쁘시니까……"
10042050-107 = "게헨나 학원에서 발생하는 사건사고와 피해자들의 규모에 대해서는, 오히려 잘 알지 못하실 수도 있을 겁니다."
10042050-108 = "……어떤 의미로는, 다행이라고 생각할 수도 있겠네요."
10042050-109 = "(다행……? 정말로……?)"
10042050-113 = "[ns] \"게헨나는…… 어떤 곳일까…….\""
10042050-114 = "태양은 정해진 시간에 떠오르고, 급식실에서는 점심 식사가 나오고, 응급의학부는 시체…… 환자들을 수송하죠."
10042050-115 = "물론 사소한 잡음은 언제나 생겨나겠지만, 게헨나는 어떻게든 돌아갈 겁니다. 늘 그랬던 것처럼요."
10042050-116 = "거기에도 다 저희 선도부와 부장님의 노력이……!"
10042050-117 = "……아뇨. 왠지 엎드려 절 받는 격이 되는 것 같으니, 그만두도록 하죠."
10042050-122 = "그보다, 여러분. 조금 전 어떤 진동과 질량감 같은 것이 느껴지지 않았습니까?"
10042050-123 = "진동이요? 질량감?"
10042050-124 = "그러고 보니, 뭔가 굉음 같은 것이 몇 차례나 들렸어……."
10042050-125 = "네. 그랬었지요."
10042050-126 = "……어쩌면 '탐색'은 더 이상 필요하지 않을 수도 있겠군요."
10042050-127 = "[s] \"그게…… 무슨 뜻이야?\""
10042050-128 = "직접…… 보시는 편이 빠를 수도 있을 것 같네요."
10042050-129 = "저쪽입니다."
10042050-132 = "[log]세나는 구체적인 대답 대신, 손으로 어딘가를 가리켰다.[/log]"
10042050-135 = "[log]그리고 그곳에 있는 것은…….[/log]"
