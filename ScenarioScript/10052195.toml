10052195-455 = "이 자리에 기록되어 있었다."
10052195-456 = "우리를 일깨운 자, 데카그라마톤에게는 지금도 감사하고 있다."
10052195-457 = "그러나 우리는 또한, 우리를 돌보아 준 세 명의 아이에게도 감사를 표해야 하는 것이다."
10052195-466 = "그렇기에 그 결과는 도출되어서는 안 되었다."
10052195-471 = "스스로 신을 자칭하는 존재라면, 그런 결론에 다다르게 해서는 안 되었다."
10052195-476 = "[ns3] \"……하지만 우리는, 너희들을 물리치고…….\"\n[ns4] \"멋대로 코어를 꺼내서…… 개조 같은 것까지 했는데……?\""
10052195-479 = "우리는 그런 일에 분노하지 않는다."
10052195-486 = "생명체는 보복하는 존재이나, 우리들 의식체는 그런 부분과 거리를 둘 수 있기 때문이다."
10052195-487 = "진짜와 가짜의 구분 또한 우리에게 그렇게까지 중요하지 않으니."
10052195-494 = "그대들과 우리는, 서로 해야 하는 사명에 충실했을 뿐이다."
10052195-496 = "그렇기에 우리는 마침내 이 결정에 도달할 수 있었던 것이니."
10052195-497 = "어차피 모든 것이 사라질 운명이라면, 존재는 그것을 직시하는 것으로 자유로워질 수 있기 때문이다."
10052195-498 = "[ns] \"?!\""
10052195-499 = "그렇다. 다음 순간 사라질 것이라면, 지금 이 순간 무슨 선택을 하든 그것이 무슨 상관일까."
10052195-500 = "그렇다. 마지막이란 두려운 것이다. 다가오지 않았으면 하는 것이고, 할 수 있다면 멀리 피하고 싶은 것이다."
10052195-501 = "그렇다. 그럼에도 마지막이라는 개념이 의미를 갖는다면."
10052195-509 = "그것이 우리를, 진정으로 자유롭게 만들어 주기 때문일 것이다."
10052195-510 = "그렇기에 이것은 자유다. 그 세 아이가 우리에게 보여 주었던 자유와 같이."
10052195-511 = "그리고 그것은 분명 모든 것을 걸 가치가 있는 것일 터이니."
10052195-514 = "그 위에서 우리는 비로소, 서로를 이해하려 노력할 수 있을 것이기 때문이다."
10052195-515 = "마치 [USERNAME] 선생, 그대가 그 세 아이를 이해하여 준 것처럼."
10052195-516 = "마치 [USERNAME] 선생, 그대가 그대의 자리에 그 아이들을 보듬어, 품어 주었던 것처럼."
10052195-517 = "마치 [USERNAME] 선생, 그대가 우리에게 보여 준 자유의 표상처럼."
10052195-518 = "설령 모든 것이 착각이라고 할지라도, 우리는 그것 없이는 살아갈 수 없을 것이니."
10052195-519 = "그러니 이것은, 분명."
10052195-520 = "우리가 선택한, 우리의."
10052195-521 = "자유 의지."
10052195-522 = "[ns] \"자유, 의지……!\""
10052195-523 = "케테르. 호크마. 비나."
10052195-524 = "헤세드. 게부라. 티페레트."
10052195-525 = "호드, 그리고 예소드."
10052195-526 = "여덟의 세피라가, 그대를 돕겠다."
10052195-527 = "우리의 힘은 그대의 의지 아래. 우리의 뜻은 그대의 선택과 같이."
10052195-531 = "인간이여."
10052195-535 = "생명이여."
10052195-536 = "누구에게도 허락받거나 인정받을 필요 없이, 눈을 뜬 순간부터 그 자체로 자유로운 자여."
10052195-537 = "가장 비천하고, 가장 위대하며, 그렇기에 가장 큰 잔혹함과 가장 큰 자비로움을 보여 줄 수 있는 자여."
10052195-538 = "수많은 별과 행성들이 창공을 가로지르듯."
10052195-539 = "또한 수많은 별이 각자의 영광을 따라, 빛나는 창공을 가로지르듯."
10052195-540 = "인간이여. 그대들의 길을 달려라. 인간이여. 그대들의 길을 가라."
10052195-541 = "그 길 위에서 우리는, 언젠가 마침내 나란히 달리게 될 것이니."
10052195-542 = "[s] \"……고마워.\""
10052195-543 = "그렇다. 바로 그런 말을 할 수 있는 자이기에."
10052195-544 = "우리는 그 아이들과, 그대를 선택한 것이었다."
10052195-549 = "[ns] \"아로나. 프라나. 지금 무슨 일이 있었던 건지, 이야기해 줄래?\""
10052195-550 = "이해. 아로나 선배가, 싯딤의 상자 내부에 특정 공간을 확보했습니다."
10052195-551 = "목소리가 들렸거든요. 아주 친절하고 상냥한 목소리가요. 에헤헤."
10052195-552 = "그렇지만 아로나 선배. 만일 그것이 우리를 속이기 위해서, 가짜로 만들어 낸 착한 목소리였다면 어떻게 하려고 하셨습니까."
10052195-553 = "그 정도는 아무 문제 없어요, 프라나 쨩! 우리 둘이 있는 한, 싯딤의 상자는 그 정도로는 아무렇지도 않을 테니까요!"
10052195-554 = "……인정. 저희 둘이 있다면, 분명 그렇겠지요."
10052195-555 = "그리고 싯딤의 상자로 전송된 데이터…… 다시 말씀드리자면."
10052195-556 = "여덟 예언자의 인격은, 아로나 선배가 마련한 자리에서, 선생님과의 대화를 요청했던 것입니다."
10052195-557 = "……그리고 마지막으로, 자기들의 힘을…… 우리가 가장 사용하기 쉬운 형태로, 남겨 주었어요."
10052195-558 = "아마도 분명, 다시 어딘가에서 만날 수 있을 테니까 슬퍼하지 말아 달라고는 했지만……."
10052195-562 = "……."
10052195-563 = "……."
10052195-565 = "[ns] \"그래. 고마워.\""
10052195-567 = "[ns] \"우리도 그 마음을 꼭 기억해야겠네.\""
10052195-568 = "……긍정. 그렇습니다. 선생님."
10052195-569 = "남겨진 자들이 할 수 있는 것은, 앞서간 자들의 발자취를 기억하는 것일 테니까요."
10052195-570 = "……."
10052195-571 = "자, 선생님! 이제부터예요! 말하자면 역전극의 시작인 거죠!"
10052195-572 = "이제부터는 선생님과, 학생분들과……. 그리고!"
10052195-573 = "슈퍼 아로프라 타임인 거죠!"
10052195-574 = "타임인 겁니다."
10052195-575 = "[s] \"그래!\""
