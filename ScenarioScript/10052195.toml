[translation]
10052195-3 = "선생, 님……."
10052195-4 = "[s] \"에이미!!!\""
10052195-5 = "후후…… 선생님도 완전, 엉망이네……."
10052195-6 = "나, 괜찮냐고?"
10052195-7 = "……."
10052195-8 = "평소라면 그럴 거라고 대답했을 거고, 지금도 그렇게 대답하고 싶지만……."
10052195-9 = "미안. 조금, 힘드네."
10052195-10 = "[ns] \"……!\""
10052195-11 = "……엄청나게, 빛나기 시작했네."
10052195-12 = "저 거대 구조물…… 뭔가 이상해."
10052195-13 = "우리에게서 근본적으로 힘이나 생명력 같은 걸…… 빼앗아 가고 있는 느낌이야."
10052195-14 = "마치 다음 순간이라도, 모든 걸 바꿔 버릴 듯이."
10052195-18 = "아."
10052195-21 = "……미안해. 선생님."
10052195-22 = "우리가, 너무, 약해서……."
10052195-26 = "[ns1] \"……!!!\"\n[ns2] (이제…… 정말, 무리인가…….)"
10052195-29 = "안 돼…… 안 된다고……! 제발, 선생님……!"
10052195-30 = "선생님…… 케이…… 여러분……."
10052195-31 = "부탁, 드려요……. 누구든, 무엇이든……."
10052195-32 = "아리스가 할 수 있는 일이, 아직 남아 있다면……!"
10052195-36 = "어……?"
10052195-38 = "여기는……? 대체……? 선생님은……?"
10052195-39 = "마침내, 여기에 당도하셨군요."
10052195-41 = "누구…… 죠? 그리고 여기는 대체……?"
10052195-42 = "그보다 선생님……? 그리고 다른 모두……."
10052195-43 = "그, 그렇습니다! 이대로, 이대로 내버려두면 모두가……!"
10052195-44 = "이해합니다. 하지만 적어도 지금은 마음을 놓으셔도 됩니다. 그 부분은 제가 보장하도록 하지요."
10052195-45 = "우선 이런 이야기부터 해 보도록 하죠. 모든 것의 시작에 대해, 생각해 본 적이 있습니까?"
10052195-46 = "?!"
10052195-47 = "우리는 어디에서 왔지? 우리의 목적은 뭐지?"
10052195-48 = "모든 과정이 끝난 후, 우리는 어디로 향하게 되지?"
10052195-50 = "……'신이라는 것은 어쩌면, 그것을 따르는 자들을 위한 규율일지도 모릅니다.'"
10052195-51 = "기억하고 계시는군요. 다행입니다."
10052195-52 = "그렇기에 정말로 중요한 것은 당신들이 누구인지, 그리고 이제부터 어떤 선택을 내릴 것인지입니다."
10052195-53 = "이름 없는 신들의 왕녀인 아리스, 그리고 그 시녀이자 열쇠인 케이."
10052195-54 = "……아리스는, 더 이상 왕녀가 아닙니다. 아리스는……."
10052195-55 = "알고 있습니다. 그럼에도 저는 당신의 본디 모습과 그 자격에 관한 이야기를 꺼내야 할 것 같습니다."
10052195-56 = "……?"
10052195-57 = "제가 말해드리지요. 지금의 언어를 차용하자면, 당신은 일종의 중계기이자 증폭기였습니다."
10052195-58 = "중계기……? 증폭기요……?"
10052195-59 = "……."
10052195-60 = "그렇습니다. 당신은 이름 없는 신들의 왕녀로서, 이름 없는 신들이 본래 모습으로 통치할 세계로."
10052195-61 = "지금 [ruby=키보토스]이곳[/ruby]의 모든 것을 되돌리기 위해, 그 사제들에 의해 준비되었습니다."
10052195-62 = "케이라고 불리는 이름 없는 신들의 열쇠 역시."
10052195-63 = "이름 없는 신들의 왕녀를 그 도구로 가동시키기 위해 예비되었던 장치이고요."
10052195-64 = "아, 아리스는…… 그렇지만, 아리스는……!"
10052195-65 = "칫……."
10052195-66 = "물론 그 계획은 실행되지 못했습니다. 당신은 스스로 자신의 자리를 내려놓았고."
10052195-67 = "열쇠는 스스로 자기 자신에 대한 것을, 일부나마 망각하기로 결정했으니까요."
10052195-68 = "그렇지만 중요한 것은 이 순간, 다시 한번 두 분 모두에게 재각성의 길이 열렸다는 사실입니다."
10052195-69 = "재각성이란 무엇입니까?"
10052195-70 = "설마……?!"
10052195-71 = "그렇습니다. 지금의 키보토스에는, 강철대륙이라는 거대한 신비 현상이 발현되었습니다."
10052195-72 = "제가 이런 형식으로나마 두 분과 소통할 수 있게 된 것도, 그 연장선상에서 일어나는 일이라고 할 수 있겠지요."
10052195-73 = "이 강철대륙이 존재하는 한, 아리스, 당신은 본디의 역할이었던 중계기이자 증폭기를 넘어."
10052195-74 = "이름 없는 신 그 자체의 자리까지 넘볼 수 있습니다."
10052195-75 = "네? 아리스가, 신이요……? 그렇게 되면…… 어떻게 되는 것입니까?"
10052195-76 = "당신은 말 그대로 신이 될 수 있습니다."
10052195-77 = "진정한 자기 자신으로 돌아가, 그야말로 전지전능한 자리에서 아주 많은 것을 이루어 낼 수 있습니다."
10052195-78 = "이름 없는 신들의 힘이란 본디, '가능성의 힘'을 의미하는 것이었으니까요."
10052195-79 = "그렇기에 그것은 그다지 특별한 것조차 아닙니다."
10052195-80 = "지금을 살아가는 모두가, 조금씩이나마 자기 안에 품고 있는 힘이기도 하죠."
10052195-81 = "데카그라마톤 같은 신의 모조품 따위, 손가락 하나로 '처음부터 존재하지 않았던 것'으로 만들어 버릴 수도 있겠지요."
10052195-82 = "그리고 당신의 친구들, 케이, 나아가 선생님까지도, 그 자격과 규약을 넘어 천국으로 인도할 수 있을 것입니다."
10052195-83 = "그것을 얻기 위해, 예전과 같이 희생이 필요한 것도 아닙니다. 당신은 그저 받아들이기만 하면 됩니다."
10052195-84 = "그렇지만 그렇게 되면, 지금의 아리스는…… 어떻게 되는 건가요?"
10052195-88 = "눈치채신 모양이군요. 그렇습니다. 당신이 본연의 모습으로 돌아가게 되면."
10052195-89 = "지금의 텐도 아리스라는 가능성은, 더 이상 존재하지 않게 되겠지요."
10052195-90 = "!!!"
10052195-91 = "……."
10052195-92 = "그렇지만 텐도 아리스는, 우연히 만들어진 결과의 산물입니다."
10052195-93 = "그것을 대가로 낙원을 가져올 수 있다면, 그건 충분히 고려해 볼만한 선택지가 아닐까요?"
10052195-94 = "그렇지만 모두는…… 선생님은, 아리스가 사라진다면, 아주 조금이라도 슬퍼하지 않을까요……?"
10052195-95 = "그것도 간단한 문제입니다. 모두에게서 당신에 관한 기억만을 삭제시키면 됩니다."
10052195-96 = "무슨 소리를 하는 거야!!!"
10052195-97 = "……!"
10052195-98 = "처음부터 존재하지 않았던 것에, 감정을 가질 수는 없을 것입니다."
10052195-99 = "모두를 행복하게 하는 것이야말로, 당신의 자세이자 목표이지 않았던가요?"
10052195-100 = "하지만……!"
10052195-101 = "……."
10052195-102 = "아리스……?"
10052195-108 = "필요하지 않습니다."
10052195-109 = "그런 것은, 필요 없습니다."
10052195-111 = "아리스!"
10052195-116 = "놀라운 대답이군요. 이유를 물어도 되겠습니까?"
10052195-117 = "낙원은 우리 모두 언젠가 도달할 수 있을, 그 어딘가일 테니까요. 거기에는 절대적인 힘도, 기적 같은 것도 필요하지 않으니까요."
10052195-118 = "만에 하나 낙원에 도달하는 것에 실패하여, 모든 사람이 결국…… 슬픈 결과를 맞게 된다고 해도."
10052195-122 = "선생님은, 이야기하셨습니다. 그게 우리의 결과라면, 받아들여야 한다고요."
10052195-123 = "그때에는 선생님의 말씀을 잘 이해하지 못했지만…… 지금이라면, 알 것 같은 기분이 듭니다."
10052195-124 = "그래요, 아리스! 제대로 말해 줬어요!"
10052195-125 = "키보토스를 이전의 세계로 되돌리는 것은, 엄청난 일일지도 모르겠습니다."
10052195-126 = "모두가 각자의 모습을 되찾는 것 역시, 마찬가지일지도 모릅니다."
10052195-127 = "그렇지만 그것은, 우리가 우리의 힘으로 이루어 낸 것이 아닙니다. 말하자면 치트 엔진을 써서 레벨을 억지로 올린 것입니다."
10052195-128 = "게임 디자인은, 그런 식으로 이루어져 있지 않습니다."
10052195-129 = "레벨업을 차근차근 하면서 스킬 포인트를 투자하여 낮은 자리에서부터 하나하나 익숙해진 다음."
10052195-130 = "비로소, 모든 재미와 보람을 느낄 수 있게 되어 있으니까요."
10052195-131 = "그래서 아리스 역시, 지금 당장은 아니더라도, 언젠가 우리가 그곳에 도달할 것이라고 믿고 있습니다."
10052195-132 = "그리고 그것이 보다, 우리에게 있어서는 가치 있는 일일 것이라고 생각하고 있습니다."
10052195-133 = "쉽게 얻은 것은 쉽게 잃어버리기 마련이니까요. 거기에서는 아무것도 배울 수 없고, 어떤 것도 오래 지속되지 않을 테니까요."
10052195-134 = "그렇지만 그것은 당신이 게임으로 세계를 배웠기 때문이 아닐까요?"
10052195-135 = "맞습니다. 그리고 그랬기 때문에 정말로 다행이었다고 생각합니다."
10052195-136 = "아리스도 알고 있습니다. 일어나지 않는 일은 일어나지 않습니다."
10052195-137 = "현실이 무엇인지 이제는 알고, 그중 어떤 것은 냉정하고 차가워서 다가가기조차 힘듭니다."
10052195-138 = "그렇지만 게임은 그렇지 않습니다. 그렇게 만들어져 있지 않습니다."
10052195-140 = "왜냐하면 게임에는, 세상이 이렇게 아름다워졌으면, 하고 바라는 사람들의 마음이 담겨 있으니까요."
10052195-142 = "그리고 세상이 아름다워지기를 바라는 사람들이 있는 한, 희망은 아직 남아 있다고 생각합니다."
10052195-144 = "노력한 만큼의 보상이 돌아오고, 그 자체로 충분히 존중받을 수 있고."
10052195-145 = "무언가를 했다면 반드시 그에 따르는 결과가 있으며."
10052195-146 = "우리 모두 언젠가는 레벨업을 하고, 보다 나아질 수 있다는 희망이 말이죠."
10052195-147 = "비록 지금 이 순간은 그렇지 않더라도, 언젠가 도달할 그 자리에서는, 반드시요."
10052195-148 = "왜냐하면 아리스는,"
10052195-154 = "그 모든 것들을 사랑하니까요."
10052195-155 = "밀레니엄의 모두도, 키보토스의 모든 사람도, 케이도."
10052195-156 = "그리고 선생님까지도 역시, 그 모든 것을 사랑하고 있으니까요."
10052195-160 = "……."
10052195-164 = "하지만, 힘은 쓰겠습니다!"
10052195-165 = "아리스?!?!"
10052195-166 = "흥미로운 말을 하는군요. 당신은 이미 자신의 본질을 거부하지 않았나요?"
10052195-167 = "아뇨! 아리스는 깨달았습니다!"
10052195-168 = "지금, 이 강철대륙 현상 위에서라면, 아리스는 아리스의 본디 권리를 주장할 수 있고."
10052195-169 = "거기에 있는 당신이라고 해도, 지금만큼은 그것을 막을 수 없으리라는 것을요!"
10052195-170 = "가만있자, 그게 되나…… 그게 그렇게 되고, 그러면……."
10052195-171 = "!!!"
10052195-175 = "……거기까지도 알게 되셨군요."
10052195-176 = "그렇다면 왕녀로서의 자격 없이 그 힘을 사용한 결과에 대해서도, 알게 되었을 텐데요."
10052195-177 = "그럼에도 당신은 그 선택을 내리고자 합니까?"
10052195-178 = "그렇습니다. 몇 번을 물어보아도, 아리스는 언제나 같은 선택을 내릴 겁니다."
10052195-179 = "선생님이 우리에게 보여 주었던 것처럼요!"
10052195-180 = "그 끝에서, 그대는 그저 평범한 한 명의 학생으로 전락할 것입니다."
10052195-181 = "또한 그대는, 그대 자신에게 남겨진 모든 가능성을 소모해 버릴 것입니다."
10052195-182 = "그것은 당신이 지금 이 장소에서 보고, 듣고, 깨닫게 된 모든 것을 망각하게 된다는 것과 같은 말입니다."
10052195-183 = "망각은 당신들이 이곳에 머무르기 위한, 가장 중요한 기본 조건이니까요."
10052195-184 = "알고 있습니다. 그렇지만 아리스에게 있어서 그런 것은 그다지 중요한 것이 아닙니다."
10052195-185 = "그대는 성장하게 될 것입니다."
10052195-186 = "네. 아리스는 성장할 겁니다!"
10052195-187 = "그대는 고통을 감내해야 할 것입니다."
10052195-188 = "그건 역시 조금 무섭지만…… 할 수 있는 데까지는 견뎌 볼 겁니다!"
10052195-189 = "당신은 지금의 더 나은 존재에서, 언젠가의 더 불완전한 존재로 내려가는 것을 받아들여야 할 것입니다."
10052195-190 = "아리스는 그것을 불완전한 것이라고 생각하지 않습니다."
10052195-191 = "그 모든 가능성과 영광보다도, 아리스에게는 지금 이 순간이……."
10052195-192 = "케이와 다른 모두가."
10052195-193 = "선생님이."
10052195-194 = "아리스가 상상할 수 있는 그 무엇보다도, 소중합니다."
10052195-195 = "중요한 것은 기적이나 힘, 권위 같은 것이 아닙니다."
10052195-196 = "그런 것보다는, 우리가 서로를 믿고 나아가는 조심스러운 발걸음일 것입니다."
10052195-197 = "맞아요, 맞아요! 어떻습니까? 우리 아리스가 이렇게 대단하다고요!"
10052195-198 = "그러니 사용하겠습니다."
10052195-199 = "아리스가 처음이자 마지막으로 내세울 수 있는, 아리스의 권리를요!"
10052195-203 = "알겠습니다. 그렇다면 그렇게 하십시오."
10052195-204 = "기적을 거부함으로써 기적에 도달하는 기적을, 저에게도 보여 주십시오."
10052195-205 = "유쾌하군요. 정말로 유쾌합니다."
10052195-206 = "이 즐겁고 유쾌한 결론이 왕녀, 아니 아리스의……."
10052195-207 = "망상이나 물거품으로 끝맺음 지어지지 않으리라는 것을, 저에게도 보여 주십시오."
10052195-208 = "당신이 이야기했던 것처럼, 모두의 나란한 걸음으로, 마침내 지평선에 다다를 수 있다는 것을 증명해 주십시오."
10052195-209 = "그렇다면 한 번뿐이지만 온전히 돌려받은 당신의 권능으로, 당신은 무엇을 가장 먼저 이루고 싶습니까?"
10052195-211 = "아리스는, 아리스의 친구들을……."
10052195-212 = "무엇인지 알 수 있습니다. 그렇지만 그것만큼은 불가능합니다."
10052195-214 = "……그렇지요. 신비는, 신비가 없는 존재에게 간섭할 수 없는 법이니까요."
10052195-215 = "………만에 하나 선생님께서, 아리스가 도저히 상상하고 싶지 않은 일을 당하시게 된다고 해도."
10052195-216 = "아리스가 그것을…… 되돌리거나, 다시 시작하게 할 수는 없는 것처럼요."
10052195-217 = "그렇다면 다시 한번, 무엇을 이루고자 합니까. 아리스?"
10052195-218 = "재미있는 질문이네요! 당신도 이미 알고 있지 않나요?"
10052195-219 = "……확실히, 그렇군요. 제가 허를 찔렸습니다."
10052195-220 = "감사합니다, 이름 모를 분!"
10052195-221 = "천만에요. 저 역시 즐거웠습니다. 신선했고요. 그러면 이제 작별 인사를 해야겠군요."
10052195-222 = "이것으로 더 이상 당신과 제가 만날 일도 없을 것이고."
10052195-223 = "추종자들이 당신을 영원히 배신자라고 저주하게 될 것이라고 해도."
10052195-224 = "저는 이 모든 과정을, 진정으로 즐겼다는 것만 말씀드리고 싶습니다."
10052195-225 = "안녕히 가세요, 아리스. 당신의 모든 여정에 부디 행운이 따르기를."
10052195-226 = "네! 안녕히 계세요! 아리스도 항상 최선을 다하겠습니다!"
10052195-231 = "그리고 제가 누구인지 이제는 짐작했을 케이 역시도요."
10052195-232 = "……네, 뭐. 그리고 그건 제가 죽을 때까지 말할 수 없겠군요."
10052195-233 = "그것을 이해했다면, 저는 안심입니다."
10052195-234 = "그러면, 이제 정말로 작별의 시간이군요."
