10052195-355 = "……여덟 세피라를 품은 열쇠의 몸을 재창조해, 여기에 구축된 조화를 부수었는가."
10052195-356 = "아칠루트의 띠가 멈춘 것 역시, 그 조화로부터 이어지고 있었던 흐름이 깨어졌기 때문이었겠군."
10052195-357 = "그러나 왕녀여. 그것은 그대와 그대의 열쇠의 신성을, 스스로 버리는 행위다. 그럼에도……?"
10052195-358 = "……그런가. 그것이 어떤 의미로는 그대의 <자기증명>인 것인가."
10052195-359 = "그렇다면, 좋다. 나 역시 이루어야 할 것이 있다."
10052195-360 = "증명해야 할 것이 있고, 지켜 나가야 할 것이 있다."
10052195-361 = "여기에서 내가 멈추게 된다면, 그 모든 일도 허망한 흔적으로 남아 사라질 것이니."
10052195-362 = "후우……."
10052195-363 = "아직 포기하지 않은 거군요. 집념만큼은 인정해야겠습니다."
10052195-365 = "으응……?"
10052195-366 = "우으……. 몸이 아직 무겁지만, 그래도……."
10052195-371 = "응. 조금 낫네. 적어도 팔다리에 달린 무게추는 사라진 느낌."
10052195-372 = "윽……. 후우……."
10052195-373 = "괜찮으십니까, 선생님? 리오 님?"
10052195-374 = "어라, 그러고보니 케이. 어느새 교복을 입었을 때의 모습으로 돌아왔군요."
10052195-375 = "네? 어, 어어? 그러고보니……?!"
10052195-376 = "……."
10052195-377 = "그렇군요. 케이. 어쩌면 그 모습이, 가장 케이가 되고 싶었던 케이의 모습이었던 거네요."
10052195-378 = "케이는 이미…… 어떤 의미에서, 자신이 되고 싶었던 자신이 되어 있었던 거군요."
10052195-379 = "……!"
10052195-380 = "네……. 그렇습니다. 그랬던, 거군요."
10052195-381 = "그리고 말이죠. 지금 이게 예전과 거의 같은 모습처럼 보일지도 모르겠지만!"
10052195-382 = "구성 원리는 근본부터 완전히 달라졌으니까 말이죠!"
10052195-383 = "그렇습니다! 그건 아리스가 보증할 수 있습니다!"
10052195-384 = "신위(神威)라는 것에 대해 어떻게 생각하는가. 열쇠여."
10052195-385 = "그것이 오직 처음부터 선택받았고, 그렇게 창조된 자들에게만 허락된 것이라면."
10052195-386 = "그것은 그 자체로 너무나도 큰 불공평이며 비극이 아닌가."
10052195-387 = "당신이 그 개념에 대해 어떻게 여기든, 내 알 바 아니에요. 뭐라고 생각하고 어떻게 이야기하든, 마음대로 하라고요."
10052195-388 = "제가 보기에 그건, 애초에 아무래도 좋았고 없었던 거나 다름없는 말장난 같은 것이었으니까요."
10052195-389 = "그대의 그 모든 기원과 유래를 생각하더라도 말인가?"
10052195-390 = "그걸 전부 알고 있으니까, 그렇게 결론 내린 겁니다."
10052195-391 = "모두에게서 현재를 가져가려 하지 말라는 거예요."
10052195-392 = "안 그래도 종잇장보다 얇은 그거, 지금을 살아가는 사람들에게 돌려달라는 겁니다."
10052195-393 = "섣불리 켜진 등대는, 오히려 배를 암초에 부딪히게 하는 법이니까!"
10052195-398 = "……생님? 선생님!"
10052195-399 = "[s] \"히마리!\""
10052195-403 = "헤헹! 선배만 반가워하지 말고, 우리도 있다구!"
10052195-404 = "통신 연결 확인! 선생님, 무사하시죠?!"
10052195-405 = "다, 다행이에요……. 모두……."
10052195-407 = "빠르게 보고드리겠습니다. 우선…… 여기에서는 선생님의 모습이 잘 보이지 않아요!"
