10052195-409 = "포, 포격을 몇 번 해 봤지만…… 꿈쩍도 하지 않았어요……."
10052195-410 = "네. 아마도 내부에서부터 그 영역을 파괴해야 할 것처럼 보입니다."
10052195-411 = "[s] \"영역…… 알았어!\""
10052195-413 = "그리고 예언자들의 코어 정보를, 보다 심층적으로 분석했습니다."
10052195-414 = "그, 그런데……."
10052195-415 = "무슨 일이야, 히마리?"
10052195-416 = "그 코어들로부터, 어떤 메시지를 받았습니다."
10052195-417 = "[s] \"예언자들의, 메시지……?\""
10052195-418 = "그건, 도대체 무슨 의미야……?"
10052195-419 = "저도 정확히는 모르겠습니다. 대부분이 암호화되어 있어서, 전문을 읽을 수 없었거든요."
10052195-420 = "하지만 예언자들이…… 선생님과 직접 소통하기를 바라고 있다는 부분만은, 평문으로 되어 있었습니다."
10052195-421 = "기다려! 그 평문 자체가 함정일 가능성도 있어!"
10052195-422 = "네. 저도 그 부분을 말씀드리고 싶었어요. 그렇지만……."
10052195-423 = "[s] \"알았어. 일단 전송해 줘.\""
10052195-424 = "선생?!"
10052195-425 = "……괜찮으시겠나요?"
10052195-426 = "……그게 무엇이든, 이야기를 걸어왔다면 들어 봐야 하는 법이라고? 전쟁 중에서도 사신을 보내곤 했으니까?"
10052195-427 = "그렇지만…… 만일 선생이, 어떻게 되기라도 한다면……."
10052195-428 = "……."
10052195-429 = "알겠습니다. 지금 전송하겠습니다."
10052195-434 = "아로나, 선배? 선생님?"
10052195-438 = "……."
10052195-439 = "알겠어요, 선생님! 제가…… 자리를 마련할게요!"
