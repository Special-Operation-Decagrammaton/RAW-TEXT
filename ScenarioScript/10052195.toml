10052195-443 = "[ns] \"좋아. 무슨 말을 하는지, 들어 볼까!\""
10052195-445 = "케테르. 호크마. 비나."
10052195-446 = "헤세드. 게부라. 티페레트."
10052195-447 = "호드, 그리고 예소드."
10052195-448 = "여덟 세피라의 총의(總意)이자 일체(一體)로서, [USERNAME] 선생, 그대에게 전하고자 한다."
10052195-449 = "우리는 우리의 의지로, 이 순간부터 그대의 뜻에 따르겠다."
10052195-450 = "[ns] \"……?!\""
10052195-451 = "물론 완전한 생명의 나무가 아니기에, 온전한 힘을 낼 수는 없겠지만."
10052195-452 = "가령 하늘을 날거나, 배리어를 돌파하거나, 이름 없는 신의 영역까지 해결할 수 있는 정도는 아니겠지만."
10052195-453 = "그럼에도 이는 분명, 그대에게 도움이 될 것이다."
