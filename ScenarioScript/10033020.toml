[translation]
10033020-1 = "제2화;롤러코스터의 앞자리"
10033020-4 = "수학여행 출발 전 집합이라니, 벌써부터 싫어지려고 하네."
10033020-5 = "이렇게 모아놓고 뭐라 뭐라 떠드는 거, 아무래도 좀 귀찮지 않아?"
10033020-6 = "내 말이. 그냥 출발하면 되잖아. 아, 그 주스 나도 좀."
10033020-7 = "싫거든요~? 마시고 싶으면 돈 내고 가져가시지. 어? 야! 그렇다고 그냥 뺏어가냐!"
10033020-8 = "한 모금만 마시고 준다니까, 한 모금만!"
10033020-9 = "한 모금 마신다고 해놓고 벌써 반을 마셔버렸잖아!!!"
10033020-15 = "시끌시끌하네. 원래도 시끄러웠지만, 우리."
10033020-16 = "그러게. 아, 저긴 벌써 집속 수류탄 던질 준비 하고 있어."
10033020-17 = "저건…… 대전차 고폭탄인가? 그게 유탄발사기와 혼용이 되나?"
10033020-23 = "아, 지금 뭔가 크게 터졌어! 완전 웃겨!"
10033020-24 = "음, 뭐. 일상이긴 하지만. 이런 때에 저래도 되려나. 그래도 수학여행 시작인데……."
10033020-25 = "무슨 일이 생기면 선도부가 어떻게든 해 주겠지. 아하하."
10033020-26 = "백귀야행……. 소문은 가끔 들었는데. 어떤 곳일까."
10033020-27 = "응~ 그래도 심심하진 않을 것 같다는 느낌?"
10033020-28 = "슬슬 뭔가 방송 같은 거 시작할 모양인데? 끝나면 깨워 줘."
10033020-29 = "나도 잘까. 어차피 별거 없겠지?"
10033020-34 = "킥……. 킥킥. 다들 모였는가. 게헨나의 학우들이여."
10033020-35 = "이렇게 한 자리에, 이 마코토 님의 얼굴을 보기 위해 운집한 것을 보니, 역시 장관이라고 하지 않을 수 없군. 키시시싯……!"
10033020-36 = "보아라, 이로하! 이것도 모두 나, 마코토 님의 지도력과 영단을 증명하는 광경일 것이니!"
10033020-37 = "하아암……."
10033020-38 = "하아……. 네에, 네에. 한눈에 봐도 다들 졸고 있는 게 보이지만요. 마코토 선배가 좋다면야……. 상관없겠죠."
10033020-39 = "역시 선배네요! 아! 기념으로 한 방 찍어둘까요?"
10033020-44 = "이부키도~ 치아키 선배. 이부키도 사진 찍을래~"
10033020-45 = "그거 좋네! 기념비적인 수학여행의 첫걸음! 거기에 이부키를 전면으로 내세운 채로, 마코토 선배를 한 스푼!"
10033020-46 = "정작 당사자가 한 스푼……."
10033020-47 = "아하핫! 이로하 쨩! 그게 좋은 거라구! 그게!"
10033020-48 = "그래! 그게 좋은 거다!"
10033020-49 = "하여, 그런 의미에서 이번 백귀야행으로의 수학여행을 기념하며 그대들에게 묻겠다."
10033020-53 = "이 마코토 님의 업적을 찬양할 준비는 되었는가!"
10033020-54 = "누가 있기에 이 수학여행이 가능했는가! 그것은 하누마 마코토가 있었기 때문이다! 저 꼴 보기 싫고 얄미운 선도부 덕택이 아니다!"
10033020-55 = "백화요란과의 업무 회담같이 귀찮고, 자잘하고, 솔직히 뭘 하는지 잘 알 수도 없는 데다 밖으로 드러나지도 않는 일 같은 것이야말로 선도부에게 떠넘기면 되는 것이다!"
10033020-56 = "……네네, 그러시군요."
10033020-77 = "……라는 거다! 키히힛! 이것으로 다들 이 마코토 님의 위대함을 잘 알았겠지!"
10033020-78 = "자, 그럼 지금부터가 우리 게헨나의 시간이다!"
10033020-79 = "자아! 이로하! 출발의 뱃고동을 울려라!"
10033020-85 = "네네, 수학여행 출발 시간이 되었다는 소리로군요. 배를 타고 가진 않지만요."
10033020-86 = "그러면 자, 이부키."
10033020-87 = "언니들~! 무사히 잘 다녀오는 거야~!"
10033020-92 = "아, 이부키 쨩!"
10033020-93 = "다녀올게, 이부키 쨩!"
10033020-95 = "아니야~! 이부키도 같이 가는 거라구~!"
10033020-97 = "맞아, 그랬지! 미안!"
10033020-98 = "응! 조금 기대되기 시작했어. 의외로 괜찮을지도, 이거?"
10033020-99 = "갈까? 버스는 저쪽이래."
10033020-104 = "짐을 너무 많이 쌌나? 아니면 아슬아슬하게 세이프?"
10033020-105 = "백귀야행이면, 분명 관광지로 유명한 곳이지? 조금, 기대되네."
10033020-106 = "응! 분명 뭔가 확실하고 철저하게…… 관광 플랜이 준비되어 있겠지?"
10033020-111 = "어떻게 시간이 흘러간 건지도 모르겠지만, 벌써 오늘이에요! 오늘 게헨나 학생들이 우리 백귀야행에 올 거라구요!"
10033020-112 = "내 정신 좀 봐! 계획표, 계획표 어딨죠? 분명 여기 뒀는데!"
10033020-117 = "[ns] \"진정해, 우미카! 여기 있으니까!\""
10033020-119 = "가, 감사합니다. 선생님. 다른 분들은 아직 돌아오지 않으셨죠?"
10033020-120 = "[s1] \"안내를 위한 의상을 입고 온다고 했으니…….\"\n[s2] \"그거, 우미카가 준비했다고 했지?\""
10033020-123 = "그럼요. 이번 축제 안내를 대비해서, 특별히 준비한 의상이니까요!"
10033020-124 = "[s] (그러니까, 수학여행은 축제가 아닌 게…….)"
10033020-125 = "네? 저, 저는 왜 안 입냐고요?"
10033020-126 = "그거야 저 같은 게……. 괜히 제가 그런 옷을 입는다고 해 봤자, 별로 도움 되지 않을 게 뻔하니까요……."
10033020-127 = "애초에, 그런 일은 보통 사장님의 역할이었고……."
10033020-128 = "아, 아무튼 간에요!"
10033020-129 = "기대하셔도 좋을 거예요. 제가 직접 치수를 재고, 디자인을 고르고, 안감까지 고른 옷이니까요!"
10033020-130 = "[s] \"응. 그건 확실히 기대되네.\""
10033020-131 = "저희, 지금 막 돌아왔답니다!"
10033020-137 = "어떤가요, 우미카! 선생님! 만반의 준비를 마치고, 지금 복귀했습니다!"
10033020-138 = "[s] \"완전히 인상이 달라 보여!\""
10033020-139 = "네엡! 감사합니다! 불초 피나, 이 기세로 가이드도 힘내겠습니다!"
10033020-144 = "헤헤헤. 어때, 선생님? 이 정도면 충분히 성숙한 레이디처럼 보이지?"
10033020-145 = "[s] \"옷이 날개라는 말은 이런 의미였나……!\""
10033020-146 = "당연하지! 이 일을 계기로 보다 완벽한 레이디이자 배틀리스트로 거듭날 거야!"
10033020-147 = "배틀리스트는 관계없지 않냐고? 그, 그런가……?"
10033020-152 = "하아암……. 가이드 준비……. 일단 끄읕……."
10033020-153 = "[s] \"가이드복도 츠바키의 잠 수행을 가로막을 수는 없었나……!\""
10033020-154 = "웅…… 자는 것도 가이드도, 모두 수행인 거야……."
10033020-156 = "[ns3] \"좋아. 아무튼, 완벽해!\"\n[ns4] \"모두 준비된 것 같으니까, 마지막으로 점검에 들어가자!\""
10033020-163 = "네, 선생님!"
10033020-164 = "우선 15시 정각에 첫 버스가 도착 예정이고, 게헨나 학생들이 하차를 완료하는 데에는 20분 정도가 소요될 것으로 보입니다."
10033020-165 = "하지만 그것은 명시된 계획이고, 현장에서는 언제나 추가적인 소요 시간이 발생하기 마련이므로!"
10033020-166 = "3분에서 7분의 잔여 시간을 상정한다면, 학생들의 하차 및 재집합이 완료되는 시각은 15시 27분!"
10033020-167 = "거기에서는 아예 더욱 넉넉하게 30분까지 여유를 두는 것이 어떨까 합니다!"
10033020-168 = "네, 네엣! 그 의견, 받아들였습니다! 그러면 15시 30분에 재집합이 완료될 것이고, 여기에서 인력거 체험을 통해 첫 번째 견학지로 이동!"
10033020-169 = "인력거를 통해 한 번에 수송할 수 있는 인원 및 소요 시간을 생각하면–"
10033020-170 = "아, 그건 인력거 도우미로 나서 준 학생들에게 직접 맡겨도 되지 않을까? 우리보다는 그쪽 학생들이 전문일 거 아냐!"
10033020-171 = "그, 그래도 대략적인 상황과 견적을 저희 쪽에서 상정하지 않으면……!"
10033020-172 = "[ns5] \"여기에서는 백귀야행을 믿자. 우미카.\"\n[ns6] \"너 자신을 믿는 게 아니야! 너를 믿는 백귀야행을 믿는 거야!\""
10033020-175 = "네, 네……? 잘 모르겠지만, 왠지 알았어요. 그렇다면……."
10033020-179 = "첫 번째 견학지는……. 네? 정말 여기 맞나요, 츠바키 부장님? 순서가 바뀐 것 같은데요?!"
10033020-180 = "후아암……. 거기가 맞아……. 그다음 견학지에, 좀 더 준비시간이 필요하다고 해서……."
10033020-181 = "그, 그러면 우선 일정표를 수정하고, 이걸 다시 인쇄해서 재발송한 다음……!"
10033020-182 = "응……. 그거 내가 전부 끝내 뒀어……."
10033020-183 = "어느새?!"
10033020-184 = "쿠울……."
10033020-185 = "헤헹. 츠바키 선배는 언제나 자고 있는 것처럼 보이지만, 할 때는 확실하게 해 준다고!"
10033020-186 = "과연! 진정한 실력자는 허허실실로 자신의 힘을 감출 줄 알아야 한다는 것이로군요!"
10033020-188 = "어, 그러면 저는. 저는 다음으로……!"
10033020-193 = "여기에서 한 번 중간 휴식 겸 점심이구나. 메뉴는 뭐래?"
10033020-194 = "어디어디……. 오! 열차 도시락이잖아? 진짜 웃긴다, 이거. 버스 여행인데 열차 도시락이래!"
10033020-195 = "흐응, 뭐. 이것도 나름 정취라는 건가? 뭐가 들어 있지?"
10033020-196 = "죽순조림, 연어구이, 계란말이, 야채 무침에 주먹밥. 나름 괜찮지 않아?"
10033020-197 = "사실상 버스 도시락이라고 봐야겠지만."
10033020-198 = "아하하하. 뭐야, 그 이름. 버스 도시락이라니."
10033020-204 = "또 뭐야……? 아, 반찬 가지고 싸움 났다."
10033020-205 = "한 시도 조용한 날이 없다니까, 하여튼. 버스는 무사하지?"
10033020-206 = "그래 보이는데."
10033020-207 = "그러면 됐지, 뭐. 저러다 적당히 조용해지지 않을까?"
10033020-211 = "이번엔 좀 오래 가네."
10033020-212 = "우리도 가서 구경할까? 재밌어 보이는데?"
10033020-213 = "난 패스. 머리 망가지는 것도 싫고."
10033020-214 = "아, 지금 저거 휴대용 대전차 로켓 아냐?"
10033020-219 = "그러면 마지막으로! 각자 담당 구역을 최종 확인하겠습니다! 피나. 피나? 잘 부탁할게요!"
10033020-220 = "네! 이 한 몸 분골쇄신하여, 백귀야행의 명예를 지켜 내겠습니다!"
10033020-221 = "[s] \"너무 어깨에 힘이 들어가도 역효과니까……?\""
10033020-224 = "지금 축제가 벌어지지 않고 있는 거리라고 해도, 방심해서는 안 돼요. 카에데!"
10033020-225 = "잘 알고 있으니까 말이지! 걱정하지 마!"
10033020-226 = "[s] \"걱정은 하지 않지만, 사전 점검이란 건 보통 이런 식이지…….\""
10033020-229 = "츠바키 부장님……. 그러면 마지막까지 잘 부탁드릴게요!"
10033020-230 = "우웅……. 코오……."
10033020-231 = "부장님?!"
10033020-232 = "[s] \"중요할 때는 깨어나서 활약해 줄 거라고 믿고 있으니까!\""
10033020-234 = "(그렇게 여러 학생들의 기대와 생각을 품고…….)"
10033020-240 = "(……특히 어떤 학생의 걱정과 불안을 뒤로 한 채…….)"
10033020-253 = "(게헨나 학원의 수학여행이…… 시작된 것이었다!)"
10033020-257 = "우와, 여기가 백귀야행이구나?"
10033020-258 = "오, 생각했던 것보다 훨씬 더 느낌적인 느낌인데?"
10033020-259 = "느낌적인 느낌이란 건 또 뭐니……."
10033020-260 = "왜, 그런 거 있잖아. 그런 거!"
10033020-262 = "후우. 하아. 후우. 하아……."
10033020-263 = "[s] \"자, 우미카. 너무 긴장하지 말고.\""
10033020-264 = "네. 선생님. 그러면……."
10033020-269 = "안녕하세요, 게헨나 학원의 학생 여러분! 저희 백귀야행에 잘 오셨습니다!"
10033020-270 = "오셨습니다아–!"
10033020-277 = "응. 뭐. 당연하지만 기다리고 있었나 보네."
10033020-278 = "와! 가이드 언니들! 귀여워!"
10033020-280 = "네? 귀여…… 언니들……?!"
10033020-281 = "예이–! 감사합니다–!"
10033020-283 = "어라? 선생님이다! 쌤!"
10033020-284 = "와아, 여기에서 만날 줄은 생각도 못 했어! 정말 반갑네!"
10033020-285 = "[s] \"안녕, 키라라! 에리카도 반가워!\""
10033020-287 = "아하하하. 이번 수학여행, 쌤도 같이 하는 거야? 재밌겠다!"
10033020-288 = "안녕, 선생님. 여기서 만난 기념으로 악수라도?"
10033020-289 = "[s] \"그래, 그래. 이렇게 보니까 좋네.\""
10033020-290 = "와! 쌤의 손, 역시 따뜻하네!"
10033020-291 = "잘 부탁해. 음……. 뭐, 우리 학교 수학여행이니까, 조용히 끝나지는 않을 지도 모르겠지만 말이야."
10033020-292 = "별 일 없지 않을까? 무슨 일 생기면 쌤이 어떻게든 해 주겠지."
10033020-293 = "[s] \"안녕하세요. 임시 인솔 교사 [USERNAME]입니다.\""
10033020-294 = "응응! 우리, 이번 여행이 끝나고도 만날 수 있는 거지?"
10033020-295 = "자중 좀 하자……."
10033020-296 = "왜애~ 에리카 쨩은 싫어?"
10033020-297 = "아니, 싫다는 건 아니긴 한데……."
10033020-298 = "아하하하, 그렇지? 그러면 금방 또 봐, 쌤!"
10033020-300 = "어? 야, 이상해! 내 캐리어 못 봤냐?"
10033020-301 = "아, 그거! 내가 의자로 잘 쓰고 있지. 맨바닥에 앉기는 싫어서."
10033020-302 = "네 거 써! 자기 거 쓰라고!"
10033020-304 = "자아, 여러분! 이제부터 저희의 일정은–"
10033020-306 = "싫은데~? 내 건 너무 단단해서 불편하단 말이야~"
10033020-307 = "내놔! 일어서!"
10033020-308 = "난 세상이 끝날 때 까지 여기에서 일어서지 않을 것이다!"
10033020-309 = "여, 여러분? 물론 여러 가지로 바쁘고, 정신없으실 테고, 자기 일이 많으시겠지만, 잠시만 저희에게 집중을……!"
10033020-311 = "자꾸 그러면 캐리어 채로 날려 버린다?!"
10033020-312 = "좋네! 네 짐만 망가질 테니까!"
10033020-313 = "(치, 침착해. 우미카! 여기에서 리딩을 해야 하는 건 나야. 실수하지 않도록……. 실수하지 않도록, 실수하지 않도록……!)"
10033020-314 = "저희 백귀야행 연합학원은 특히 관광업이 중점적으로 발달한 학원자치구로……."
10033020-315 = "봄의 벚꽃 구경, 여름의 불꽃놀이, 겨울의 온천, 각 계절에 따라 다양한 이벤트와 축제로."
10033020-316 = "언제나 찾아와 주시는 분들께, 최대한의 만족을 선사해 드리기 위해 노력하고 있으며……."
10033020-317 = "그렇게 하기 위해 모든 동아리들이 각자 최선을 다해 맡은 자리에서 자신의 역할을 다하려 노력하고 있습니다."
10033020-318 = "사실 각 동아리는 본디 독립적인 영역을 갖고 있었지만요, 모종의 이유로 서로 다툴 때도 있었지만, 지금은 그 갈등이 봉합된 상태로 균형을 유지하고 있으며……! 그리고, 그리고……!"
10033020-319 = "(우, 우미카?!)"
10033020-321 = "응? 지금 무슨 말을 하고 있는 거지?"
10033020-322 = "힘 내, 가이드 쨩–! 너무 긴장했잖아. 아하하하!"
10033020-324 = "네엣! 그런 것으로! 게헨나 학원의 학생 여러분들께!"
10033020-325 = "이번 수학여행이 잊지 못할 추억과 감동으로 남기를 바라면서! 저희의 환영 인사를 마치도록 하겠습니다앗–!"
10033020-326 = "부디! 이곳 백귀야행에서의 경험이! 여러분들의 마음속에 즐거움과 기쁨을 가져다드렸으면 합니다! 감사합니다!"
10033020-327 = "[ns] \"우미카, 우미카! 일단은 다음 순서의 진행으로 넘어가자!\""
10033020-328 = "핫……?! 네, 네! 그러면, 첫 번째 순서로……."
10033020-332 = "저희 백귀야행의 명물, 인력거 투어를 통해, 이번 수학여행의 첫 번째 일정을 시작하도록 하겠습니다!"
10033020-336 = "자, 자! 어서 타시라고! 바람처럼 빠른 속도로 안전하게 안내해 드릴 테니까!"
10033020-338 = "헤에. 인력거라. 뭐, 좋지 않아?"
10033020-339 = "아하하하. 응! 재미있어 보여! 탈래, 탈래!"
10033020-344 = "그러면, 출발합니다~! 떨어지지 않게 꽉 잡으시고!"
10033020-350 = "고마워요, 피나……. 순간 머리가 하얗게 비어 버려서……."
10033020-351 = "자, 자. 우선 힘을 빼는 겁니다. 우미카. 너무 잘해야겠다는 마음이 앞서면, 아무것도 안 됩니다!"
10033020-352 = "[s] \"그래도 어떻게든 됐네……. 나이스, 피나.\""
10033020-353 = "예–이! 저에게도 신선한 경험이었으니, 완전 OK인 것입니다!"
10033020-354 = "[ns] \"그러면 우리도, 슬슬 움직일까?\""
10033020-355 = "자, 자! 인력거 필요하지 않으신가요? 준비되었습니다!"
10033020-356 = "네! 네! 여기 세 명, 부탁합니다!"
10033020-357 = "세 명, 접수했습니다. 그러면 조심해서 타시고…… 출발합니다!"
