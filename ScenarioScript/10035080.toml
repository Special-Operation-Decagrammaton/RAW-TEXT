[translation]
10035080-1 = "제8화;용의자, 취조합니다!"
10035080-2 = "이게 무슨 일이람……괴물이라니……."
10035080-3 = "여긴 안전하겠지?"
10035080-4 = "우리 그냥 나가자. 악어가 여기까지 올지도 모르잖아."
10035080-8 = "즐거운 워터파크가 초상집 분위기가 되어버렸네."
10035080-9 = "손님들의 표정이 다들 좋지 않습니다……."
10035080-10 = "바로 나가버리는 분들도 계시고……."
10035080-11 = "그런 사건이 일어났으니 당연한 일이다."
10035080-12 = "적어도 메카 악어가 포획되거나 사살되지 않는 한 이 혼란은 해결되지 않겠지."
10035080-13 = "그렇다면 우리도 악어 수색을 도와야 하지 않나요?"
10035080-14 = "아니, 문제를 해결하려면 그 근본을 찾아야 하는 법."
10035080-15 = "우리는 악어를 이곳에 풀어놓은 범인을 잡는다."
10035080-16 = "네?! 누군가 일부러 악어를 풀어놓았다고요?"
10035080-17 = "워터파크에 들어온 악어는 일반적인 동물이 아니라 악어를 본따 만들어진 로봇."
10035080-18 = "인공물임은 확실하고, 그 공격적인 성향을 볼 때 워터파크에 풀어놓은 것 또한 다분히 의도적인 것으로 판단된다."
10035080-19 = "고의적인 테러, 혹은 영업 방해……정확한 목적이 무엇인지는 확실하지 않지만, 테러리스트로 상정하고 대응해야 한다."
10035080-21 = "테, 테러리스트……!"
10035080-22 = "그, 그럼 국장님은 그게 누구인지 알고 계신 건가요?"
10035080-23 = "아까 우리를 보고 도망친 걸 보면 뻔하잖아?"
10035080-24 = "앗, 설마 그렇다면!"
10035080-25 = "[s1] \"아마도 헬멧단의 짓이려나…….\"\n[s2] \"아마도 라브 녀석의 짓이려나…….\""
10035080-28 = "헬멧단의 간부, 코마카제 라브……!"
10035080-29 = "알겠습니다! 본관의 눈에 띄기만 하면 곧장 체포하겠습니다!"
10035080-30 = "두 눈을 부릅뜨고 수색을—"
10035080-34 = "아?"
10035080-35 = "아."
10035080-36 = "[s] (타이밍 나쁘기로는 둘째가라면 서러울 정도……!)"
10035080-37 = "잡아!"
10035080-38 = "히익!"
10035080-46 = "놓치지 않습니다!"
10035080-63 = "아이쿠!"
10035080-69 = "그래도 잡았습니다!"
10035080-70 = "도망 못 갑니다, 테러리스트!"
10035080-71 = "누가 테러리스트라는 거야!"
10035080-72 = "경찰이면 이렇게 무고한 사람 막 붙잡아도 돼?!"
10035080-73 = "무고하기는!"
10035080-76 = "우린 이번 여름에 네가 한 일을 알고 있다!"
10035080-80 = "라브 대장을 놔줘!"
10035080-81 = "발키리 녀석들, 심심하면 우리만 걸고넘어지는 거냐!"
10035080-83 = "걸고넘어지다니, 웃기는 소리."
10035080-84 = "너희가 한 짓을 생각하면 당장 연행해도 모자랄 판이다."
10035080-86 = "우리가 무슨 짓을 했는데!"
10035080-87 = "우리를 보고 도망쳤잖습니까!"
10035080-88 = "뭔가 찔리는 게 있어서가 아닌가요?!"
10035080-89 = "그게 무슨 논리냐, 멍청한 발키리 참새 녀석들!"
10035080-90 = "[s3] \"모두 주목!\"\n[s4] \"자, 자, 모두 진정해.\""
10035080-93 = "[USERNAME] 선생?"
10035080-97 = "[ns] \"아무래도 상황 정리가 좀 필요할 것 같아.\""
10035080-99 = "[ns] \"한 명씩 말하기. 오케이?\""
10035080-100 = "알겠습니다. 키리노, 후부키, 녀석을 꽉 잡고 있도록."
10035080-106 = "이제 말해라, 코마카제 라브. 어째서 워터파크에 메카 악어를 풀어놓았지?"
10035080-107 = "히, 히익……"
10035080-108 = "이, 이것이 소문으로 듣던 공안국의 미친개……."
10035080-109 = "대답하도록."
10035080-110 = "아, 악어를 풀다니, 무슨 소리야!"
10035080-111 = "시치미 떼지 마라. 지금 이 상황을 만든 게 너라는 사실이 명백하지 않나!"
10035080-112 = "……?"
10035080-113 = "아니, 무슨 오해를 하는지는 몰라도, 난 진짜로 아니거든!"
10035080-114 = "그 무시무시한 녀석……뭐라고 해야 할까, 메탈 웨폰 스피드 크로커다일이라고 해야 하나?"
10035080-116 = "(국장이랑 묘한 데서 통하는군…….)"
10035080-117 = "아무튼 그거랑 우린 아무 상관도 없어!"
10035080-118 = "너네도 말 좀 해 봐!"
10035080-119 = "대장 말이 맞아! 우리도 지금 실내로 피난 온 거라고!"
10035080-120 = "애초에 우리 헬멧단에는 그런 로봇을 만들 정도의 예산도 없고……."
10035080-122 = "과, 관련이 없다고……?"
10035080-123 = "그럼 아까 마주쳤을 때 어째서 도망간 거지? 찔릴 게 없다면 도망갈 이유가 없지 않나?"
10035080-124 = "[USERNAME]선생에다 발키리 녀석들이 세 명이나 떡하니 앉아 있는데 그럼, 당연히 피해야지!"
10035080-125 = "잘못한 게 없다면서요?"
10035080-126 = "우리한테는 본능 같은 거야!"
10035080-127 = "경찰을 보면 일단 달아나는 건가……사고방식 자체가 다르구만……."
10035080-128 = "[s] \"그럼 워터파크에는 왜 왔어?\""
10035080-129 = "뭐? 왜 왔냐니?"
10035080-130 = "워터파크에 오는 목적이 노는 것 말고 더 있어?"
10035080-131 = "옳소!"
10035080-132 = "말썽과 폭력으로 지친 마음을 치유하러 온 건데!"
10035080-133 = "여기 입장 팔찌 봐! 정직하게 표 끊고 들어왔단 말야!"
10035080-134 = "심지어 돈이 모자라서 일부는 일해서 때웠다고!"
10035080-135 = "헬멧단 총연합회에 초대받지 못한 녀석들을 위로하기 위해서 일부러 데려온 건데……."
10035080-136 = "우리도 여름에 물놀이 정도는 할 수 있는 거잖아!"
10035080-138 = "우리라고 맨날 나쁜 짓만 하고 다니는 건 아니라고!"
10035080-139 = "[s5] (진짜 서러워하네…….)\n[s6] (어쩐지 미안해지는걸…….)"
10035080-140 = "미, 미안하다…… 난 당연히 너희인 줄만 알고……."
10035080-141 = "미, 미안하다…… 난 당연히 너희인 줄만 알고……."
10035080-142 = "본관이 또 실수를……."
10035080-143 = "그러게 평소에 착하게 살면 이런 일 안 생기잖아."
10035080-144 = "뭐야 인마!"
10035080-148 = "[ns] \"잠깐만.\""
10035080-150 = "[ns] \"그럼 메카 악어는 누가 풀어놓은 거지?\""
10035080-160 = "꺄아악! 악어가 안으로 들어왔다!"
10035080-161 = "다들 도망쳐!"
10035080-163 = "우아앗! 여러분! 대피! 대피하세요!"
10035080-164 = "이건 좀 무서운데~"
10035080-165 = "간만의 휴식이 다 망해버렸잖아!"
10035080-167 = "모두 전투 준비! 악어를 제압한다!"
