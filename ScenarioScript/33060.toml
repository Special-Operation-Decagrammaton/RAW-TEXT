[translation]
33060-1 = "제6화;에덴조약 조인식 2"
33060-2 = "고성당 내부 중앙 홀"
33060-4 = "[ns] (한가하니 적당히 어슬렁거려볼까.)"
33060-6 = "실례합니다. 여기 잡상인은 들어오시면 안 됩니다. 하품도 금지예요."
33060-7 = "어이, 이봐. 이쪽은 관계자 전용이라고. 구경꾼은 저쪽 라인 뒤에 있으라고."
33060-8 = "[s1] \"어…… 그러니까……\"\n[s2] \"일단은 나도 관계자인데…….\""
33060-9 = "……응? 뭐죠? 선도부원? 지금 이 선을 넘어온 건가요?"
33060-10 = "……응? 뭐죠? 선도부원? 지금 이 선을 넘어온 건가요?"
33060-11 = "뭐어? 웃기지 말라고? 정의부 네 녀석이 먼저 선을 밟았거든!"
33060-12 = "뭐야? 저 트리니티 자식들이 시비를 걸어?? 내 그럴 줄 알았다!! 버릇을 고쳐주마!"
33060-13 = "앗, 치사하게 증원을……. 여기 도움이 필요합니다! 헬프! 증원 요청!"
33060-17 = "키킥…… 키키키키……."
33060-19 = "히, 히익?! 갑자기 보스 등장?!"
33060-20 = "즈, 증원이 아니라 츠루기 선배님!?"
33060-21 = "키키키키키……."
33060-23 = "캬아아아아악-!!"
33060-24 = "히, 히이이익?!"
33060-25 = "저, 저기 여러분……! 여기서 싸우시면 안 됩니다……."
33060-29 = "평화를 위해 이렇게 모였는데 벌써부터 이러시는 건…… 이 조약의 취지와도 어긋나기도 하고……. 그, 그렇죠? 츠, 츠루기 씨?"
33060-30 = "……."
33060-31 = "……여기 계신 분은 샬레의 선생님이다."
33060-32 = "기억해두도록?"
33060-35 = "네, 넵!"
33060-37 = "며, 명심하겠습니다!"
33060-43 = "[ns] \"고마워, 츠루기.\""
33060-44 = "……."
33060-45 = "……아뇨. 별말씀을요. 선생님."
33060-46 = "그럼…… 다음 임무가 있어서……."
33060-53 = "하아……."
33060-54 = "[s] \"역시 츠루기는 상냥하네.\""
33060-55 = "네? ……네?!"
33060-56 = "[s] \"도와줘서 고마워. 그러니까, 히나타였지?\""
33060-57 = "……. 아. 네, 네! 그때 이후 다시 뵙게 되었습니다. 선생님."
33060-58 = "[s] \"그때 시스터후드가 도와줘서 살았어.\""
33060-59 = "……네? 아, 아니에요. 그때 별로 저는 도움도 안되었고……."
33060-60 = "저는 미련하게 힘만 셀 뿐이라…… 죄송해요…… 이런 몸이라……."
33060-61 = "[s] \"오늘은 시스터들도 참석한 거야?\""
33060-62 = "아, 네. 사쿠라코 님의 지시사항이에요."
33060-63 = "저번 사건을 계기로 저희 내부 방침이 조금 바뀐 거 같아요."
33060-64 = "그동안의 무간섭주의가 저번 사태를 초래했다고 생각하는지, 이제 대외 활동을 좀 더 적극적으로 하기로 했나 봐요……."
33060-65 = "사쿠라코 자매님도 곧 여기 도착하실 예정이고……."
33060-66 = "그래서 저희 시스터들도 여기에 와서 행사를 돕고 있어요. 저도 이렇게 질서유지라던가, 귀빈들을 안내하거나 하는 일을……."
33060-67 = "아, 괜찮다면 선생님께 고성당을 안내해드릴까요?"
33060-68 = "[s] \"응, 좋지. 부탁해.\""
33060-69 = "네……! 아직 시간도 꽤 남아 있으니…… 그럼 이쪽으로……."
33060-72 = "고성당 내부 회랑"
33060-74 = "[ns] \"굉장한 곳이네.\""
33060-75 = "……네. 이 <통공의 고성당>은 오랫동안 폐허로 방치되어 있었는데, 이번에 여기서 조인식을 체결하기로 결정하면서 대대적인 수리를 진행했다고 해요."
33060-76 = "그 결정도 나기사 씨와 게헨나의 마코토 씨가 합의한 것이겠지만……."
33060-77 = "그치만 수리도 행사가 열리는 곳까지만 진행됐고, 아래로 내려가면 여전히 폐허인 상태라서요……."
33060-78 = "게다가 소문에는 이 고성당 지하에 엄청난 규모의 카타콤이 존재하고 있다고 하더라고요."
33060-79 = "거의 수십 킬로미터나 되는 수준의 길고 긴 지하 무덤들이……. 그래서 그 당시에도 끝이 어딘지 알 수 없을 정도였다고……."
33060-80 = "……보세요. 이쪽은 막아놨네요. 수리가 안 되어서 위험한가 봐요."
33060-81 = "[s] \"역사가 오래된 곳인가 보네.\""
33060-82 = "네. 아무래도 1차 공의회가 열렸던 곳이니까요."
33060-83 = "공의회에서 체결되는 계율은 신성한 것…… 그 계율을 수호하는 수호자들의 자취가 아직 이곳에 남아있는 느낌……."
33060-84 = "[s] \"수호자?\""
33060-85 = "약속이라는 것은 말하자면 어겼을 때의 제약이 필요하잖아요? 그렇지 않으면 누구도 약속을 지키지 않을 테니……."
33060-86 = "그 제약의 역할을 하는 사람들을 계율의 수호자라고 불렀어요. 약속을 어기는 자들을 규제하는 트리니티의 무력집단……."
33060-87 = "그게 바로 전설적인 <유스티나 성도회>죠……."
33060-88 = "[s] \"정의실현부 같은 거구나.\""
33060-89 = "네. 역사적으로 보면 저희 시스터후드의 전신이 되는 집단이지만……."
33060-93 = "아, 사쿠라코 님이 도착하셨다고 하네요. 나기사 님도 곧 도착하신다고……."
33060-94 = "이제 돌아가야 할 거 같아요, 선생님. 가시죠."
33060-96 = "준비는?"
33060-97 = "……네. 지금 막 끝났습니다. 그리고 만마전에서 고성당까지 가는 차를 대절해줬습니다."
33060-98 = "차를? 웬일로?"
33060-99 = "자신들은 이번에 최신 비행선을 구입했다고…… 하늘을 나는 자신들의 권위에 비교되게 땅을 기어서 오라는 마코토 씨의 전언입니다."
33060-100 = "……."
33060-101 = "또 예산을 그딴 데다 쓴 건가……. 뭐, 상관없겠지. 조인식 참석을 막아놓고 이렇게 변덕을 부리는 것도 웃기긴 하지만."
33060-102 = "이오리와 다른 녀석들도 기다리고 있을 테니까. 서두를까."
33060-103 = "……."
33060-104 = "……하아. 마음에 안 든다는 건 알겠지만, 말했잖아. 아코."
33060-105 = "이건 선도부의 해체가 아냐. ETO라는 족쇄를 만마전에게 채우는 거지."
33060-106 = "……네. 선도부는 문제없겠죠. 그 마코토에게 티파티라는 제약이 묶인다는 것도 이해했고요. 하지만 부장님은……."
33060-107 = "……."
33060-108 = "그만. 이 화제는 여기까지."
33060-109 = "오늘 조약이 마무리된 뒤에 다시 이야기하도록 하지. 출발하자."
33060-111 = "……네."
33060-114 = "네! 말씀드리는 순간 게헨나의 만마전이 신형 비행선에 타고 있는 모습이 보이고 있습니다!"
33060-120 = "게헨나의 의장 하누마 마코토입니다! 과연, 엄청난 카리스마네요! 저것이 바로 게헨나 수뇌부의 위엄!"
33060-121 = "킥. ……킥킥킥."
33060-123 = "트리니티 티파티의 호스트, 키리후지 나기사도 고성당에 도착했다고 합니다!"
33060-124 = "과연, 조약에 조인하는 각 학원의 수뇌부들이 속속 이곳으로 도착하고 있군요!"
33060-125 = "게헨나의 선도부장도 곧 도착한다고 하니, 분위기는 한층 더 달아오르네요! 여러분은 계속 채널 고정 부탁드립니다!"
33060-130 = "준비는?"
33060-131 = "……모두 끝."
33060-132 = "네, 네! 마, 맞아요. 끝났어요……. 모두 다 체크도 했고……. 시간표도…… 정리 끝났어요."
33060-133 = "그 인형과 접촉하는 시간은?"
33060-134 = "(휘릭. 휘익-)"
33060-135 = "……그래. 그럼 문제 없겠군. 모든 준비는 끝났다."
33060-136 = "드, 드디어…… 괴롭겠죠? 모두들 고통스럽겠죠? 하지만 어쩔 수 없어요……."
33060-137 = "맞아. 그게 이 세계의 현실."
33060-138 = "……."
33060-140 = "아리우스 스쿼드, 작전을 시작한다."
33060-145 = "순항미사일은?"
33060-146 = "발사요청 확인. 앞으로 5분 뒤 타깃 지점에 착탄 예정."
33060-147 = "II팀과 III팀은?"
33060-148 = "통로 앞에서 대기 중이에요……. 시간에 맞춰서 작전 지역으로 돌입 예정입니다."
33060-149 = "고성당이 붕괴되면 동시에 돌입. 미사키와 II팀은 트리니티를, III팀과 히요리는 게헨나를 상대한다."
33060-150 = "알겠어. 리더."
33060-151 = "II팀은 특히 츠루기를, III팀과 히요리는 특히 히나를 놓치지 마라."
33060-152 = "네, 네! 알겠습니다! 히, 히나 씨 말이죠……."
33060-153 = "I팀과 V팀."
33060-154 = "(휘익- 휘리릭-)"
33060-155 = "그래. 거기서 통로를 따라 지하로 간다. 가장 중요한 임무다. 알고 있지?"
33060-156 = "……."
33060-157 = "(휘릭, 휘리릭. 휘익.)"
33060-158 = "……알고 있어. 기분 나쁘더라도 조금만 참아. 공주님."
33060-159 = "(끄덕)"
33060-160 = "사오리 씨는요……?"
33060-161 = "나는 다른 볼일이 있다. 볼일이 끝난 후 V팀에 합류하겠다."
33060-162 = "그럼 여기서 흩어진다."
33060-178 = "……?!"
33060-186 = "아즈사 쨩……? 어디 가는 거예요?"
33060-187 = "그런 걸 왜 물어보고 그래! 화장실 가는 거잖아."
33060-188 = "응, 그치만 화장실은 저쪽인데……."
33060-191 = "……어라?"
33060-193 = "……."
33060-194 = "쿠아아아아아아아앙--!!"
33060-195 = "응? 뭔가 방금……. 찢어지는 소리가……."
33060-196 = "무, 무슨 소리지?!"
33060-199 = "자, 잠깐만?! 뭐, 뭐야?! 저거?! 뭔가 날아갔어!"
33060-200 = "꺄, 꺄아아아악--?!"
33060-201 = "(……아직 끝난 게 아니야?)"
33060-202 = "(아니…… 이제부터 시작이다……? 그렇게 말하고 있는 거야? 사오리……!!?)"
33060-211 = "콰아아아아아아아아아아아앙-------------"
33060-213 = "다음화;불과 재의 날 1"
