[translation]
10023090-1 = "제9화;소유권 이전"
10023090-22 = "으우우우우…… 무서웠어……"
10023090-24 = "대단해, 유즈! 저 경비들을 상대로 들키지도 않다니!"
10023090-25 = "분위기는 어땠어, 유즈 쨩?"
10023090-27 = "의외로…… 정문까지는 그렇게 감시가 심하지 않았어……"
10023090-28 = "경비원들은…… 대부분 정문 안쪽에 있는 것 같아……"
10023090-29 = "잠깐 문이 열렸을 때…… 엿봤는데…… 저택 안이 경비들로 꽉 차 있었거든……"
10023090-30 = "역시…… 이 방법밖에 없는 걸까요, 선생님?"
10023090-31 = "[s1] \"일단…… 양동 작전을 펼치기로 했으니까 말이야.\"\n[s2] \"자애의 괴도가 신호를 보내면,\"\n[s3] \"우리는 5분 후에 정면으로 치고 들어가는 거야.\""
10023090-35 = "그래서 양쪽으로 경비들을 혼란시키자는 거였으니까……"
10023090-36 = "이제 와서 다른 방법도 없어. 작전대로 가자!"
10023090-42 = "(숨을 죽이고 얼마나 기다리고 있었을까……)"
10023090-47 = "(저택 뒤편에서, 별안간 불꽃이 하늘 위로 쏘아졌다.)"
10023090-49 = "뭐지? 메이타로 씨가 오늘 밤 불꽃놀이를 하겠다고 했던가……?"
10023090-50 = "그런 말은 듣지 못했는데……?"
10023090-56 = "(불꽃은 밤하늘 한가운데에서 폭발하며…… 어떤 글씨를 남겼다.)"
10023090-57 = "(<자애의 괴도>라는 글씨를……!)"
10023090-61 = "!!! 나타났다! <자애의 괴도>다!"
10023090-62 = "모두 집합! <자애의 괴도>를 쫓는다!"
10023090-68 = "신호가…… 왔어요, 선생님."
10023090-69 = "[s] \"뭐라고 할까, 참 화려한 신호네……\""
10023090-71 = "적어도 잘못 볼 일은 없는 신호인 것 같습니다."
10023090-72 = "충분히 시간을 잰 후, 저희도 움직이도록 하지요."
10023090-73 = "부탁드려도 되겠습니까, 아리스?"
10023090-75 = "물론입니다! 지금이야말로 용사가 나설 때로군요!"
10023090-76 = "동료와 함께 이벤트를 거치고, 대량의 경험치 보상을 받아…… 강해지는 겁니다!"
10023090-80 = "음? 이봐…… 왠지 저쪽이 소란스럽지 않아?"
10023090-81 = "또 뭐야? 이쪽 일만 해도 정신이 없는데……"
10023090-84 = "빛이여!"
10023090-89 = "!!"
10023090-97 = "자, 시작하자!"
10023090-102 = "신속하게 돌입하겠습니다."
