[translation]
1014605-1 = "The Chairman's Bashful Summer"
1014605-2 = "I was still worried about Makoto and decided to go pay her a visit at the Pandemonium Society club room."
1014605-3 = "When I got there, though..."
1014605-4 = ""
1014605-5 = ""
1014605-6 = ""
1014605-7 = "[ns] \"Hey, by any chance...\""
1014605-8 = ""
1014605-9 = "N-No!"
1014605-10 = "We don't know anything!"
1014605-11 = "Nope! We haven't seen her!"
1014605-12 = ""
1014605-14 = ""
1014605-15 = "[ns] \"...?\""
1014605-17 = "After that..."
1014605-18 = ""
1014605-19 = "Huh? Chairman Makoto? Who's that?"
1014605-20 = "Ah, that fancy-looking person who's always surrounded by State Guards and never stops talking?"
1014605-21 = "Nurse's office, or something."
1014605-22 = "Ugh, that sounds nice. Maybe I'll play hooky."
1014605-24 = "After that..."
1014605-26 = "Makoto?"
1014605-27 = "Yeah, she was just here."
1014605-28 = "She didn't seem hurt, just a little anxious and on edge."
1014605-29 = "The way she left didn't make me feel like she was coming back."
1014605-30 = "But I'll let her know you were here if she does."
1014605-40 = "I kept looking for Makoto, but I always felt like I was just one step behind her."
1014605-41 = ""
1014605-44 = "[ns] \"...?\""
1014605-45 = ""
1014605-46 = "Is this really all right...?"
1014605-47 = "What kinda nerd would still be hanging around school this late at night?"
1014605-48 = "I guess so..."
1014605-49 = ""
1014605-51 = ""
1014605-53 = "[ns] \"This is...\""
1014605-56 = "Huh? What? Sensei's found me again?!"
1014605-57 = "But the fact that I'm hiding here..."
1014605-59 = ""
1014605-60 = "...?"
1014605-61 = "S-Sensei?! What are you doing here?!"
1014605-62 = "[s1] \"Something like this was posted outside.\"\n[s2] \"Renting out the school swimming pool...\""
1014605-65 = ""
1014605-68 = "[ns3] \"I think someone who would do something like this...\"\n[ns4] \"Could only be Makoto.\""
1014605-71 = "Are you serious?!"
1014605-72 = "Ugh, that was a blind spot! To think my genius was the thing that held me back...!"
1014605-73 = "[s5] \"I'm sorry for eavesdropping...\"\n[s6] \"But you WERE avoiding me?\""
1014605-76 = "Th-That's...!"
1014605-77 = "..."
1014605-78 = "Now that it's come to this... I'm sure no words would be enough."
1014605-79 = "I must confess, I was indeed avoiding Sensei."
1014605-80 = "The reason is..."
1014605-81 = ""
1014605-83 = ""
1014605-84 = ""
1014605-85 = "I've realized a feeling within myself."
1014605-86 = "...Sensei of Schale."
1014605-87 = "I proposed a trade to you once."
1014605-88 = "It may not have come to fruition, but will you listen to my new proposal?"
1014605-91 = "― [log=마코토 수영복]I[/log][wa:1710] "
1014605-93 = "― [log=마코토 수영복]always represent the public interests of Gehenna and the Pandemonium Society. [/log][wa:10] "
1014605-96 = "― [log=마코토 수영복]Given that position,[/log]"
1014605-98 = "― [log=마코토 수영복]I have been clumsy in dealing with my own desires or emotions at times.[/log][wa:10] "
1014605-101 = "[ns] \"(She has...?)\""
1014605-103 = "#st;[-1200,-442];serial;60;― [log=마코토 수영복]However, Schale's Sensei.[/log][wa:1150] "
1014605-105 = "#st;[-1200,-542];serial;60;― [log=마코토 수영복]This proposal is not coming from the Chair of the Pandemonium Society.#nIt is something more personal.[/log][wa:2170] "
1014605-108 = "― [log=마코토 수영복]I will admit it. For me, Sensei...[/log][wa:770] "
1014605-110 = "― [log=마코토 수영복]may have become a bit of a special person.[/log][wa:110] "
1014605-113 = "― [log=마코토 수영복]Someone who I must win over, [/log][wa:680] "
1014605-115 = "― [log=마코토 수영복]no matter the cost. [/log][wa:1090] "
1014605-118 = "[ns] \"Win over...?\""
1014605-120 = "― [log=마코토 수영복]Hm, win over...? Conquer...? [/log][wa:2720] "
1014605-122 = "― [log=마코토 수영복]...I'm not sure how to put this feeling into words. [/log][wa:1480] "
1014605-125 = "― [log=마코토 수영복]Right... If I had to put it in words... [/log][wa:600] "
1014605-127 = "― [log=마코토 수영복]I want you.[/log][wa:2040] "
1014605-130 = "...However, it will be a beneficial proposal for both of us."
1014605-131 = "I once promised you half of Kivotos, but you were quick to reject that offer."
1014605-132 = "I am not foolish enough to make such an ignorant mistake twice. Of course, this proposal is something far superior."
1014605-133 = "Yes... It's not just Kivotos."
1014605-134 = "If you give me all of you, I will give you all of me."
1014605-135 = "I can't think of a more attractive proposal."
1014605-136 = ""
1014605-138 = ""
1014605-139 = "[ns7] \"...Thank you for your thoughts.\"\n[ns8] \"But I can't give all of myself to one person.\""
1014605-142 = ""
1014605-145 = "[ns] \"Since I'm everyone's teacher.\""
1014605-146 = "*cough*...!"
1014605-147 = "*cough* *cough*"
1014605-148 = "I-Is that so..."
1014605-149 = "No, I'm relieved. The Sensei I know would surely answer that way."
1014605-150 = "I. Am. Not. Shaken. At all."
1014605-151 = "...Since it's late, I will prepare a limousine for you to return to Schale."
1014605-152 = "No need to refuse."
1014605-154 = "It felt a little awkward to reject her again, so I rode back home in Makoto's limo."
