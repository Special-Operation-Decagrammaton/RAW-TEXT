[translation]
1014605-1 = "수줍은 의장님의 여름"
1014605-2 = "(저번 이후로 마코토의 상태가 신경 쓰여서 만마전 부실로 찾아갔다.)"
1014605-3 = "(그런데…….)"
1014605-7 = "[ns] \"애들아, 혹시…….\""
1014605-9 = "아, 아니요!"
1014605-10 = "저희는 아무것도 모릅니다!"
1014605-11 = "네, 마코토 님은 못 봤습니다!"
1014605-15 = "[ns] \"……?\""
1014605-17 = "(그리고…….)"
1014605-19 = "응? 마코토 의장? 누군데, 그게?"
1014605-20 = "아, 혹시 엄청 화려하게 입고, 말 많고, 주변에 친위대를 대동하고 다니는 그 사람?"
1014605-21 = "그 사람이라면 양호실로 갔을걸."
1014605-22 = "아~ 부럽다~ 나도 꾀병이나 부리고 수업 쨀까~"
1014605-24 = "(그리고…….)"
1014605-26 = "마코토 님이요?"
1014605-27 = "네, 분명 조금 전까지 여기 있었습니다."
1014605-28 = "딱히 아픈 곳은 없어 보였는데, 왠지 긴장하고 초조해 보이더라고요."
1014605-29 = "워낙 급하게 나가서 다시 돌아올 것 같지는 않은데……."
1014605-30 = "그래도 일단 오시면 선생님이 찾고 계신다고 말씀은 전해둘게요."
1014605-40 = "(온종일 마코토를 찾아 돌아다녔지만, 계속 간발의 차로 엇갈리며 만나지 못했다.)"
1014605-44 = "[ns] \"……?\""
1014605-46 = "진짜 이걸로 괜찮을까……?"
1014605-47 = "뭐, 어차피 지금 시간까지 학교에 남아 있을 범생이가 어딨어?"
1014605-48 = "그것도 그런데……."
1014605-53 = "[ns] \"이건…….\""
1014605-56 = "응? 뭐냐? 또 선생이 찾아왔나?"
1014605-57 = "그렇다 해도 이 몸이 여기 숨어 있는 것은……."
1014605-60 = "……?"
1014605-61 = "서, 선생?! 어떻게 여기에?!"
1014605-62 = "[s1] \"바깥에 이런 게 붙어 있길래.\"\n[s2] \"학교 수영장 전세 중, 이라고…….\""
1014605-68 = "[ns3] \"이런 걸 하는 사람은 아마…….\"\n[ns4] \"마코토밖에 없다고 생각해.\""
1014605-71 = "뭐, 뭐라고?!"
1014605-72 = "크윽, 맹점이었다! 이 몸의 천재성이 오히려 발목을 잡을 줄은……!"
1014605-73 = "[s5] \"본의 아니게 엿들어서 미안한데…….\"\n[s6] \"역시 날 피하고 있었어?\""
1014605-76 = "그, 그건……!"
1014605-77 = "……."
1014605-78 = "이렇게 된 이상, 무슨 말을 해도 소용없겠지."
1014605-79 = "인정하지. 그 말대로, 선생을 피해 다니고 있었다."
1014605-80 = "그 이유는……."
1014605-85 = "말했듯이, 내 안의 어떤 감정을 자각했기 때문이다."
1014605-86 = "……샬레의 선생이여."
1014605-87 = "예전에 나는 거래를 제안한 적이 있었지."
1014605-88 = "그때는 비록 성사되지는 못했지만, 이 몸의 새로운 제안을 한 번 들어보겠나?"
1014605-91 = "[wa:1590]― [log=마코토 수영복]나는  [/log]"
1014605-93 = "― [log=마코토 수영복]언제나 [wa:230]만마전과 게헨나의 공익을 대표하고 있지.[wa:1600] [/log]"
1014605-96 = "― [log=마코토 수영복]그런 입장인 만큼,[/log]"
1014605-98 = "― [log=마코토 수영복]나 자신의 욕심이나 감정을 [wa:920]둘러보는 것에 서툴렀는지 모른다.[/log]"
1014605-101 = "[ns] (그랬던가……?)"
1014605-103 = "[wa:1070]― [log=마코토 수영복]그러나, [wa:1120]샬레의 선생이여.[/log]"
1014605-105 = "― [log=마코토 수영복]이 제안은 [wa:2030]만마전 의장으로서가 아닌, [wa:3500]좀 더 사적인 것이다.[/log]"
1014605-108 = "― [log=마코토 수영복]인정하지. [wa:1410]선생은 나에게 있어……[/log]"
1014605-110 = "― [log=마코토 수영복]조금 [wa:990]특별한 존재가 되었는지 모른다.[/log]"
1014605-113 = "[wa:1240]― [log=마코토 수영복]몇몇 가치를 포기해서라도, [/log]"
1014605-115 = "― [log=마코토 수영복]반드시 쟁취해 내야만 하는 대상이 되고 말았다는 것을.[wa:650] [/log]"
1014605-118 = "[ns] \"쟁취…?\""
1014605-120 = "[wa:1200]― [log=마코토 수영복]아니, [wa:910]쟁탈……? [wa:1130]제패……? [/log]"
1014605-122 = "― [log=마코토 수영복]……이런 마음을 뭐라 표현해야 할지 [wa:2520]모르겠군. [/log]"
1014605-125 = "[wa:550]― [log=마코토 수영복]그렇군. [wa:1050]굳이 말하자면.[wa:40] [/log]"
1014605-127 = "― [log=마코토 수영복]당신을 [wa:2080]갖고 싶다.[/log]"
1014605-130 = "……그렇게 말했지만, 나쁜 제안은 아닐 것이다."
1014605-131 = "전에, 이 몸께서는 선생에게 키보토스의 절반을 약속했지. 하지만 선생은 그 제안을 마다했다."
1014605-132 = "같은 우행을 되풀이할 만큼 이 몸은 어리석지 않다. 당연히 이 제안 역시 그보다 월등히 나은 것이지."
1014605-133 = "그래…… 고작 키보토스 따위가 아니다."
1014605-134 = "내가 선생을 가지면, 선생 역시 이 몸을 가지게 되는 것이다."
1014605-135 = "이보다 매력적인 제안이 있을 수 있나?"
1014605-139 = "[ns7] \"……마음은 고마워.\"\n[ns8] \"하지만, 누군가의 '것'이 되기는 힘들지도.\""
1014605-145 = "[ns] \"나는 모두의 선생님이니까.\""
1014605-146 = "쿠, 쿨럭……!"
1014605-147 = "콜록, 콜록……."
1014605-148 = "그, 그런가……."
1014605-149 = "아니, 안심했다. 내가 아는 선생의 대답은 그래야 하는 것이지."
1014605-150 = "이 몸은, 전혀, 조금도, 동요하지 않았다."
1014605-151 = "……늦은 시간이니, 샬레까지 돌아갈 리무진을 마련해 주도록 하지."
1014605-152 = "사양하지 말도록."
1014605-154 = "(아무래도 더는 거절하기 어려워, 마코토가 불러준 리무진을 타고 돌아오게 되었다.)"
