[translation]
1014605-1 = "害羞議長的夏天"
1014605-2 = "（上次之後一直很在意真琴的狀況，於是前往了萬魔殿的部室）"
1014605-3 = "（結果……）"
1014605-4 = ""
1014605-5 = ""
1014605-6 = ""
1014605-7 = "[ns] 「大家，難道……」"
1014605-8 = ""
1014605-9 = "不，不是！"
1014605-10 = "我們什麼都不知道！"
1014605-11 = "是的，我們沒看到真琴大人！"
1014605-12 = ""
1014605-14 = ""
1014605-15 = "[ns] 「……？」"
1014605-17 = "（然後……）"
1014605-18 = ""
1014605-19 = "嗯？真琴議長？那是誰啊？"
1014605-20 = "啊，該不會是穿得超華麗、話很多、身邊總帶著親衛隊的那個人？"
1014605-21 = "那個人的話，應該去保健室了吧。"
1014605-22 = "啊～好羨慕～我也來裝病翹課好了～"
1014605-24 = "（還有……）"
1014605-26 = "真琴大人嗎？"
1014605-27 = "是的，剛才確實還在這裡。"
1014605-28 = "看起來並沒有哪裡不舒服，但不知為何顯得相當緊張和焦躁。"
1014605-29 = "從他走得那麼匆忙來看，應該是不會再回來了……"
1014605-30 = "不過要是他回來了，我會向他轉告老師在找他的。"
1014605-40 = "（找了真琴一整天卻總是擦身而過，始終沒能見到面）"
1014605-41 = ""
1014605-44 = "[ns] 「……？」"
1014605-45 = ""
1014605-46 = "這樣真的沒問題嗎……？"
1014605-47 = "反正都這個時間了，哪有乖寶寶還留在學園裡啊？"
1014605-48 = "話是這麼說沒錯啦……"
1014605-49 = ""
1014605-51 = ""
1014605-53 = "[ns] 「這是……」"
1014605-56 = "嗯？怎麼了？老師又來了嗎？"
1014605-57 = "就算是這樣，本大人躲在這裡的事……"
1014605-59 = ""
1014605-60 = "……？"
1014605-61 = "老，老師！？你怎麼會在這裡！？"
1014605-62 = "[s1] 「外面貼著這種東西。」\n[s2] 「寫著『學園游泳池包場中』……」"
1014605-65 = ""
1014605-68 = "[ns3] 「會做這種事的人……」\n[ns4] 「我想大概也就只有真琴了吧。」"
1014605-71 = "什，什麼！？"
1014605-72 = "可惡，真是失策！沒想到本大人的天才反而扯了自己的後腿……！"
1014605-73 = "[s5] 「抱歉不小心偷聽到你說話……」\n[s6] 「你果然在躲我嗎？」"
1014605-76 = "那，那是……！"
1014605-77 = "……"
1014605-78 = "事到如今，無論說什麼也沒用了吧。"
1014605-79 = "我承認。就像你說的一樣，我一直在躲著老師。"
1014605-80 = "理由是……"
1014605-81 = ""
1014605-83 = ""
1014605-84 = ""
1014605-85 = "因為我察覺到了內心的某種感情。"
1014605-86 = "……夏萊的老師啊。"
1014605-87 = "我曾經向你提出一項提案對吧？"
1014605-88 = "當時雖然沒有談成，但你願意聽聽本大人的新提案嗎？"
1014605-91 = "― [log=마코토 수영복]我──[/log][wa:1630] "
1014605-93 = "― [log=마코토 수영복]一直以來，都扮演著萬魔殿與格黑娜代表的身分。[/log][wa:2030] "
1014605-96 = "― [log=마코토 수영복]或許正是因為這樣，[/log]"
1014605-98 = "― [log=마코토 수영복]我才始終沒有面對自己的慾望與感情吧。[/log][wa:1520] "
1014605-101 = "[ns] （是這樣嗎……？）"
1014605-103 = "― [log=마코토 수영복]但是，夏萊的老師啊。[/log][wa:2350] "
1014605-105 = "― [log=마코토 수영복]這個提案並非以萬魔殿議長，而是我個人的身份提出的。[/log][wa:5850] "
1014605-108 = "― [log=마코토 수영복]我承認。老師對我而言……[/log][wa:1650] "
1014605-110 = "― [log=마코토 수영복]或許已經成為有點特別的存在。[/log][wa:1230] "
1014605-113 = "― [log=마코토 수영복]成為了即使得付出代價──[/log][wa:1360] "
1014605-115 = "― [log=마코토 수영복]也必須獲得的對象。[/log][wa:1530] "
1014605-118 = "[ns] 「獲得……？」"
1014605-120 = "― [log=마코토 수영복]不，是確保……？還是捕獲……？[/log][wa:3280] "
1014605-122 = "― [log=마코토 수영복]……這份感情該如何表達，我並不清楚。[/log][wa:2840] "
1014605-125 = "― [log=마코토 수영복]對了。硬要說的話──[/log][wa:1800] "
1014605-127 = "― [log=마코토 수영복]──成為我的人吧。[/log][wa:2120] "
1014605-130 = "……這應該不是個多壞的提案才對。"
1014605-131 = "以前，本大人曾答應將奇普托斯的一半讓給老師，但老師依然拒絕了。"
1014605-132 = "本大人可沒蠢到重蹈覆轍。這個提案當然也比那個好上太多了。"
1014605-133 = "沒錯……區區奇普托斯根本不算什麼。"
1014605-134 = "要是我得到了老師，老師也等同於得到了本大人。"
1014605-135 = "還有比這更有魅力的提案嗎？"
1014605-136 = ""
1014605-138 = ""
1014605-139 = "[ns7] 「……謝謝你的心意。」\n[ns8] 「但是，我恐怕很難成為誰的『所有物』。」"
1014605-142 = ""
1014605-145 = "[ns] 「因為我是大家的老師。」"
1014605-146 = "咳，咳咳……！"
1014605-147 = "咳咳，咳咳……"
1014605-148 = "是，是嗎……"
1014605-149 = "不，我放心了。我所認識的老師，就該給出這種答案。"
1014605-150 = "本大人完全……就連一點也沒有動搖。"
1014605-151 = "……時間不早了，就讓我安排禮車送你回夏萊吧。"
1014605-152 = "不准推辭。"
1014605-154 = "（看來實在很難再拒絕，只好搭乘真琴安排的禮車回去了）"
