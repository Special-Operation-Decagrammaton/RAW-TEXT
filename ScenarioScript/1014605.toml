[translation]
1014605-1 = "ฤดูร้อนของท่านประธานผู้เขินอาย"
1014605-2 = "(คุณครูเป็นห่วงมาโคโตะจากครั้งก่อน จึงไปหาที่ห้องชมรมแพนเดโมเนียม โซไซตี้)"
1014605-3 = "(แต่ว่า...)"
1014605-4 = ""
1014605-5 = ""
1014605-6 = ""
1014605-7 = "[ns] \"ทุกคน พอดีว่า...\""
1014605-8 = ""
1014605-9 = "ปะ... เปล่าค่ะ!"
1014605-10 = "พวกเราไม่รู้อะไรทั้งนั้นค่ะ!"
1014605-11 = "ใช่ค่ะ ไม่เห็นท่านมาโคโตะเลยค่ะ!"
1014605-12 = ""
1014605-14 = ""
1014605-15 = "[ns] \"...?\""
1014605-17 = "(แล้วก็...)"
1014605-18 = ""
1014605-19 = "หืม? ประธานมาโคโตะ? ใครเหรอ?"
1014605-20 = "อ๋อ คนที่แต่งตัวหรูหราสุดๆ พูดมาก แล้วก็ไปไหนมาไหนพร้อมกองกำลังป้องกันน่ะเหรอ?"
1014605-21 = "ถ้าเป็นคนนั้น น่าจะไปห้องพยาบาลแล้วนะ"
1014605-22 = "อ่า~ น่าอิจฉาจัง~ ขอแกล้งป่วยแล้วโดดเรียนบ้างดีกว่า~"
1014605-24 = "(แล้วก็...)"
1014605-26 = "ท่านมาโคโตะเหรอคะ?"
1014605-27 = "ค่ะ เมื่อกี้ท่านมาโคโตะอยู่ที่นี่ค่ะ"
1014605-28 = "ดูไม่ได้เจ็บป่วยตรงไหนเป็นพิเศษ แต่ดูเกร็งๆ และกระวนกระวายยังไงไม่รู้ค่ะ"
1014605-29 = "เห็นรีบร้อนออกไปเลย คงไม่น่าจะกลับมาอีกแล้วนะคะ..."
1014605-30 = "เอาเป็นว่าถ้ากลับมา ฉันจะบอกไว้ให้ค่ะว่าคุณครูกำลังตามหาอยู่"
1014605-40 = "(คุณครูตระเวนตามหามาโคโตะทั้งวัน แต่ก็คลาดกันไปอย่างเฉียดฉิวทุกครั้ง จนไม่ได้เจอกันเลย)"
1014605-41 = ""
1014605-44 = "[ns] \"...?\""
1014605-45 = ""
1014605-46 = "แบบนี้จะไม่เป็นไรจริงๆ เหรอ...?"
1014605-47 = "ป่านนี้แล้วนะ คงไม่มีเด็กเรียนที่ไหนยังอยู่ในโรงเรียนหรอก"
1014605-48 = "ก็จริงอยู่หรอก แต่ว่า..."
1014605-49 = ""
1014605-51 = ""
1014605-53 = "[ns] \"นี่มัน...\""
1014605-56 = "หืม? อะไรน่ะ? ครูมาตามหาอีกแล้วเหรอ?"
1014605-57 = "ต่อให้เป็นอย่างนั้น การที่เราซ่อนตัวอยู่ที่นี่..."
1014605-59 = ""
1014605-60 = "...?"
1014605-61 = "คะ... ครู?! มาอยู่ที่นี่ได้ยังไง?!"
1014605-62 = "[s1] \"ครูเห็นมีอันนี้ติดอยู่ข้างนอกน่ะ\"\n[s2] \"ครูเห็นป้ายเขียนว่า 'ปิดเหมาสระว่ายน้ำโรงเรียน' น่ะ\""
1014605-65 = ""
1014605-68 = "[ns3] \"คนที่จะทำอะไรแบบนี้ก็คงเป็น...\"\n[ns4] \"ก็เลยคิดน่าจะมีแค่มาโคโตะที่ทำแบบนี้\""
1014605-71 = "อะ... อะไรนะ?!"
1014605-72 = "อึก นี่มันจุดบอดชัดๆ! ไม่นึกเลยว่าความอัจฉริยะของเราจะกลับกลายเป็นตัวถ่วงเสียเอง...!"
1014605-73 = "[s5] \"ขอโทษนะที่ได้ยินเข้าโดยไม่ได้ตั้งใจ...\"\n[s6] \"ที่แท้ก็หลบหน้าครูอยู่จริงๆ สินะ?\""
1014605-76 = "ระ... เรื่องนั้นมัน...!"
1014605-77 = "..."
1014605-78 = "ในเมื่อเป็นแบบนี้แล้ว จะพูดอะไรไปก็คงไม่มีประโยชน์"
1014605-79 = "ยอมรับก็ได้ อย่างที่ว่านั่นละ เราหลบหน้าครูมาตลอด"
1014605-80 = "เหตุผลก็คือ..."
1014605-81 = ""
1014605-83 = ""
1014605-84 = ""
1014605-85 = "อย่างที่เคยบอกไป เป็นเพราะเราตระหนักถึงความรู้สึกบางอย่างภายในตัวเอง"
1014605-86 = "ครูจากชาเล่ต์..."
1014605-87 = "เมื่อก่อนเราเคยยื่นข้อเสนอเรื่องข้อตกลงไปครั้งหนึ่ง"
1014605-88 = "ถึงครั้งนั้นจะไม่สำเร็จ แต่จะลองฟังข้อเสนอใหม่ของเราอีกสักครั้งได้มั้ย?"
1014605-91 = "― [log=마코토 수영복]เราน่ะ[/log][wa:1510] "
1014605-93 = "― [log=마코토 수영복]เป็นตัวแทนผลประโยชน์ส่วนรวมของแพนเดโมเนียม โซไซตี้และเกเฮนน่าอยู่เสมอ [/log][wa:110] "
1014605-96 = "― [log=마코토 수영복]เมื่ออยู่ในจุดนั้น[/log]"
1014605-98 = "― [log=마코토 수영복]เราอาจไม่ถนัดเรื่องการมองย้อนดูความต้องการหรือความรู้สึกของตัวเอง[/log][wa:10] "
1014605-101 = "[ns] (เป็นแบบนั้นเหรอ...?)"
1014605-103 = "― [log=마코토 수영복]ทว่า ครูจากชาเล่ต์[/log][wa:2030] "
1014605-105 = "― [log=마코토 수영복]ข้อเสนอนี้ไม่ใช่ในฐานะประธานแพนเดโมเนียม โซไซตี้ แต่เป็นเรื่องส่วนตัวมากกว่า[/log][wa:3810] "
1014605-108 = "― [log=마코토 수영복]เรายอมรับนะ ครูอาจกลายเป็นตัวตนที่...[/log][wa:650] "
1014605-110 = "― [log=마코토 수영복]พิเศษขึ้นมานิดหน่อยสำหรับเราแล้วก็ได้[/log][wa:310] "
1014605-113 = "― [log=마코토 수영복]จนกลายเป็นคนที่ต่อให้ต้องละทิ้งคุณค่าบางอย่าง[/log][wa:40] "
1014605-115 = "― [log=마코토 수영복]ก็ต้องไขว่คว้ามาให้ได้อย่างแน่นอน [/log][wa:530] "
1014605-118 = "[ns] \"ไขว่คว้า...?\""
1014605-120 = "― [log=마코토 수영복]ไม่สิ ต้องเรียกว่าแย่งชิง...? พิชิต...? [/log][wa:2280] "
1014605-122 = "― [log=마코토 수영복]ไม่รู้เลยว่า... ควรเรียกความรู้สึกนี้ว่าอะไร[/log][wa:1800] "
1014605-125 = "― [log=마코토 수영복]อย่างนี้สินะ ถ้าจะให้พูดก็ต้องบอกว่า [/log][wa:720] "
1014605-127 = "― [log=마코토 수영복]เรา อยากได้คุณมาครอบครอง[/log][wa:1520] "
1014605-130 = "ถึงจะพูดไปแบบนั้น แต่ก็คงไม่ใช่ข้อเสนอที่แย่หรอก..."
1014605-131 = "ก่อนหน้านี้ เราเคยสัญญาว่าจะมอบคิโวทอสครึ่งหนึ่งให้ครู แต่ครูก็ปฏิเสธข้อเสนอนั้นไป"
1014605-132 = "เราไม่ได้โง่เขลาถึงขั้นจะทำเรื่องโง่ๆ ซ้ำรอยเดิมหรอก แน่นอนว่าข้อเสนอนี้ก็ดีกว่าครั้งนั้นอย่างเทียบ#nไม่ติดด้วย"
1014605-133 = "ใช่แล้ว... ไม่ใช่แค่คิโวทอสกระจอกๆ แบบนั้นหรอก"
1014605-134 = "ถ้าเราได้ครูมาครอบครอง ครูเองก็จะได้ครอบครองเราเช่นกัน"
1014605-135 = "จะมีข้อเสนอไหนที่น่าดึงดูดใจไปกว่านี้อีกหรือไง?"
1014605-136 = ""
1014605-138 = ""
1014605-139 = "[ns7] \"ขอบคุณสำหรับน้ำใจนะ...\"\n[ns8] \"แต่การจะให้ใคร 'ครอบครอง' น่าจะยากหน่อย\""
1014605-142 = ""
1014605-145 = "[ns] \"ก็ครูเป็นคุณครูของทุกคนนี่นา\""
1014605-146 = "คะ... แค่ก...!"
1014605-147 = "แค่ก แค่ก..."
1014605-148 = "งะ... งั้นเหรอ..."
1014605-149 = "ก็นะ ได้ฟังแล้วก็น่าโล่งใจอยู่หรอก คำตอบของครูที่เรารู้จัก ก็ต้องเป็นแบบนั้นนั่นละ"
1014605-150 = "เราไม่ได้หวั่นไหวเลย ไม่เลยแม้แต่นิดเดียว"
1014605-151 = "นี่ก็ดึกแล้ว เดี๋ยวจะเรียกรถลีมูซีนไปส่งครูถึงชาเล่ต์ให้..."
1014605-152 = "ไม่ต้องเกรงใจหรอก"
1014605-154 = "(ดูท่าจะปฏิเสธต่อไม่ไหวแล้ว คุณครูจึงนั่งรถลีมูซีนที่มาโคโตะเรียกให้กลับมา)"
