[translation]
90002240-1 = "제24화;합일의 하늘"
90002240-3 = "모두 탑승했나요? 말쿠트는?"
90002240-4 = "운반 완료했어. 이제 출발하면 돼."
90002240-9 = "토키, 부탁할게."
90002240-10 = "예. 리오 님. 이륙하겠습니다."
90002240-18 = "……."
90002240-19 = "왜, 저를 구해 주셨죠?"
90002240-20 = "[s] \"그래야 할 것 같았으니까.\""
90002240-21 = "저는, 당신들의 적이었어요."
90002240-22 = "[s] \"지금은 아니야.\""
90002240-23 = "언제 다시 적이 될지도 모르는 일이잖아요?"
90002240-24 = "[s] \"그럴 거니?\""
90002240-28 = "……."
90002240-29 = "잘, 모르겠어요."
90002240-30 = "강철대륙은, 제 모든 것이었어요."
90002240-31 = "그곳에서 눈을 떴고, 아인과 소프와 오르를 만났죠."
90002240-35 = "……."
90002240-36 = "이제, 만날 수 없는 거군요."
90002240-37 = "정말로…… 그런 거군요."
90002240-38 = "……읏."
90002240-39 = "더 많이 안아 주어야 했어요."
90002240-40 = "더 많이 쓰다듬어 주어야 했고, 더 많이 이야기를 해야 했어요."
90002240-41 = "이렇게 될 줄 알았다면, 분명 그렇게 하지 않았을 텐데."
90002240-42 = "그랬을, 텐데……."
90002240-43 = "[s] \"……\""
90002240-48 = "선생?"
90002240-50 = "[ns1] \"만일, 정말로 만일의 이야기지만.\"\n[ns2] \"내가 아무것도 하지 않았더라면, 그 아이들은 살 수 있었을까.\""
90002240-54 = "……."
90002240-55 = "결국, 결과는 같았을 거예요. 그 아이들의 몸은, 이미 무너지고 있었고……."
90002240-56 = "[s3] \"그렇지만, 그래도, 내가 그저 가만히 있었다면.\"\n[s4] \"그 아이들은 1분, 10초…….\"\n[s5] \"하다못해 1초라도 더 살 수 있지 않았을까.\""
90002240-60 = "책임을 느끼는 거야. 선생?"
90002240-61 = "그것도…… 짊어지는 것이 불가능한 책임을?"
90002240-62 = "……."
90002240-63 = "나는…… 밉상인 말밖에 할 줄 몰라. 늘 그래 왔고, 어느 사이엔가 어쩔 수 없다고 생각하게 되었어."
90002240-64 = "그래서, 굳이 여기에서 밉상인 말을 하자면. 감정을 제외하고 단지 일어난 일에 대해서만 이야기하자면……."
90002240-65 = "그 아이들은 결국, 키보토스를 자기들 마음대로 바꾸려 했던 아이들이었지."
90002240-66 = "거기에는 사정이 있었고, 이유가 있었고, 다른 생각이 있었고…… 그 아이들 나름대로는, 모두를 살려 보려고 했던 것이라지만."
90002240-67 = "강철대륙으로 변한 키보토스에서 살아간다는 것은 어떤 걸까? 그게…… 키보토스에서 살아가는 사람들이 감당할 수 있는 것일까?"
90002240-68 = "그 아이들은…… 잘못을 했어. 한때 내가 그랬던 것처럼."
90002240-69 = "그렇지만 그게, 이런 결과를 맞이할 만큼의 일이었느냐고 묻는다면……."
90002240-70 = "미안해……. 거기까지는 나도 잘 모르겠어. 누구도 다치지 않았고, 어떤 피해도 일어나지 않았으니까……."
90002240-72 = "……."
90002240-77 = "[ns] \"……리오의 진심은, 어때?\""
90002240-79 = "……."
90002240-80 = "더 이상 실수하고 싶지도, 실패하고 싶지도 않다고 말한 적이 있었지."
90002240-81 = "그건 다시 말해서, 후회하고 싶지 않다는 뜻이기도 했어. 하지만……."
90002240-82 = "그것 때문이었던 것 같아. 모든 변수를 통제하고 싶어 했던 것도, 모든 가능성에 대비하고 싶었던 것도……. 그렇지만 결국."
90002240-83 = "결국……."
90002240-84 = "리오 선배……."
90002240-85 = "고마워요."
90002240-86 = "어……?"
90002240-87 = "리오, 라고 했지요? 네. 고마워요."
90002240-88 = "우리 동생들을 위해…… 슬퍼해 줘서 고마워요."
90002240-89 = "나는, 그냥, 납득할 수 없는 일들이……."
90002240-90 = "그렇군요."
90002240-91 = "그렇다면 지금은 그걸로 충분해요."
90002240-95 = "케이도, 선생님도."
90002240-96 = "그리고 여기 계신 모든 분도요."
90002240-97 = "정말로…… 고마워요."
90002240-102 = "……."
90002240-103 = "흑……."
90002240-104 = "우웃……. 납득할 수 없어……. 아직도 납득할 수 없다구……."
90002240-105 = "어째서…… 어째서……!"
90002240-106 = "[s] \"…….\""
90002240-111 = "[ns] \"너는 이제, 무엇을 하고 싶어?\""
90002240-112 = "……모르겠어요."
90002240-113 = "그런 건, 한 번도 생각해 보지 못했어서."
90002240-114 = "그렇지만."
90002240-116 = "[log=아인]살았으면, 좋겠어요.[/log]"
90002240-117 = "[log=소프]우리는 어찌 되든, 언니는 살았으면 했어.[/log]"
90002240-120 = "[log=오르]더 많은 것을 보고, 더 많은 것을 만나고, [/log]"
90002240-121 = "[log=오르]더 많은 것을 느끼고. 그렇게.[/log]"
90002240-124 = "[log=아인]많이많이, 우리보다 더 많이.[/log]"
90002240-127 = "살았으면 좋겠다고 했어요."
90002240-128 = "그게 무엇인지, 어떤 것인지 아직 잘 모르겠지만."
90002240-129 = "아인이, 소프가, 오르가, 마지막으로 남긴 말이 그것이라면……."
90002240-130 = "그렇게 해 봐야 할 것 같아요."
90002240-131 = "만들어졌고, 목적을 이루지도 못했고, 결국 이렇게 버려졌지만……."
90002240-132 = "그런 건 아무래도 상관없지 않을까요."
90002240-133 = "……?"
90002240-134 = "만들어진 건 저 역시 마찬가지였어요."
90002240-135 = "목적을 잃었고, 잊었고, 이제는 아예 처음부터 다시 생각해야 하지만."
90002240-136 = "그렇다고 해서, 살아갈 수 없는 것은 아니라고 생각해요."
90002240-138 = "마, 맞습니다! 자기가 누구인지는 결국…… 자기가 정할 수밖에 없으니까요! 그건 누구라고 해도 마찬가지니까요!"
90002240-139 = "……."
90002240-140 = "당신들에게 있어서 그런 문제는, 어쩌면 그렇게 어려운 일이 아니겠습니다만……."
90002240-145 = "그렇지 않습니다. 우리라고 해도 마찬가지입니다."
90002240-146 = "맞아. 그게 그렇게 쉬우면 아무도 고생 안 했지."
90002240-151 = "……."
90002240-152 = "그보다 슬슬 '당신들'이니 우리들이니, 그렇게 나누는 거 그만하지 않을래……?"
90002240-154 = "네? 그렇지만 저와 당신들 사이에는……."
90002240-156 = "그렇지 않아요. 말쿠트 씨. 저는…… 우리 모두 마찬가지인 처지라고 생각해요."
90002240-157 = "어떻게 눈을 떴고, 어떻게 태어났는지 상관없이요."
90002240-162 = "……."
90002240-163 = "그래도, 되는…… 걸까요?"
90002240-164 = "[s] \"일단 나는 된다고 생각하는데, 모두는 어때?\""
90002240-177 = "……."
90002240-179 = "감사합니다. 여러분."
90002240-181 = "……."
90002240-182 = "……."
90002240-183 = "미도리? 괜찮아?"
90002240-184 = "어, 어어? 으, 응……. 괜찮아, 언니. 결국 모두 무사했잖아?"
90002240-185 = "……난 그렇게 안 보이는데 말이지……."
90002240-186 = "……응."
90002240-187 = "역시 말쿠트 때문이야?"
90002240-188 = "으, 응……. 말쿠트 씨와 아인, 소프, 오르……."
90002240-189 = "……."
90002240-190 = "나 말이지! 잠깐 이런 생각을 해 봤어."
90002240-191 = "대충…… 뭔가……."
90002240-192 = "아무튼 엄청난 일이 일어나서, 탈출 포드가 하나밖에 안 남은 거야!"
90002240-193 = "그러면 우리는…… 어떻게 해야 할까?"
90002240-194 = "타, 탈출 포드가 하나밖에……?"
90002240-195 = "언니는…… 어떻게 할 거야?"
90002240-196 = "음."
90002240-197 = "으음……!"
90002240-198 = "으으음………!!!"
90002240-202 = "왠지 생각하기 귀찮아졌으니까, 그때가 오면 생각할래! 와하하하!"
90002240-203 = "언니?!"
90002240-207 = "에휴…… 그럴 줄 알았어……."
90002240-212 = "……."
90002240-213 = "어떻게 하긴. 너 줘야지."
90002240-214 = "언니라는 게, 뭐 때문에 있는 건데."
90002240-218 = "(피로로 지친 탓인지, 모두가 쓰러지듯 잠들어 있었다.)"
90002240-219 = "(……잠이 들 수 없었던 이유는, 눈을 감으면 무언가가 생각날 것 같았기 때문이었다.)"
90002240-228 = "선생님……."
90002240-229 = "선생님……."
90002240-231 = "[ns] \"왜 그래, 둘 다? 모든 게…… 잘 끝났는데.\""
90002240-232 = "잘…… 끝났…… 나요? 네, 어떻게 보면 그렇겠지만……."
90002240-233 = "아니에요, 역시 아니에요! 왜냐하면 선생님이 그렇지 않다고 생각하고 계시잖아요!"
90002240-234 = "긍정합니다. 선생님의 바이탈도, 무엇보다 선생님의 표정이, 전혀 그렇지 않음을 나타내고 있습니다."
90002240-235 = "[s] \"어라, 나 그렇게 심해?\""
90002240-236 = "네…… 네……! 어느 정도냐면, 그러니까, 보고 있는 저희가…… 저희가……! 흑……."
90002240-237 = "긍정합니다. 아로나 선배가……. 저 역시……."
90002240-238 = "[s6] \"그렇구나.\"\n[s7] \"그래도, 너희들이 울 필요는 없을 것 같은데.\""
90002240-241 = "아니에요! 아니라구요! 이건 어쩔 수 없어요……! 왜냐하면…… 울지 않으시니까……."
90002240-242 = "선생님께서 울지 않으시니까……. 아무렇지 않은 척하고 계시니까……!"
90002240-243 = "[s8] \"그렇게 생각해 줘서 고마워. 하지만.\"\n[s9] \"이건, 그래야 하는 일이야.\""
90002240-246 = "어째서, 입니까?"
90002240-247 = "[s10] \"일어난 일을 되돌릴 수는 없으니까.\"\n[s11] \"거기에는 후회도 변명도, 허락되지 않으니까.\""
90002240-250 = "……."
90002240-251 = "……."
90002240-252 = "그러면 우리는, 무엇을 어떻게 할 수 있다는 것인가요?"
90002240-253 = "[s12] \"살아야 해.\"\n[s13] \"그게 아무리 힘들고, 말이 안 되는 일뿐이라고 해도.\""
90002240-256 = "계속 짊어지면서, 그리고 기억하면서요?"
90002240-257 = "흘리고 온 것들과, 놓친 것들을 위해서라도요……?"
90002240-258 = "[s14] \"응. 그 끝에 무엇이 있을지 알 수 없어도.\"\n[s15] \"……그 마지막에, 무엇 하나 얻을 것이 없다고 해도.\""
90002240-263 = "……."
90002240-264 = "……."
90002240-265 = "저희가, 같이 있어 드릴게요."
90002240-266 = "무슨 일이 있어도, 어떤 일이 일어나더라도……."
90002240-267 = "그러니까 선생님. 선생님께서도……."
90002240-268 = "네. 포기하지 말아 주세요."
90002240-269 = "선생님께서 포기하지 않으신다면, 저희도 언제까지나, 마지막까지라도 한 번 더 힘을 낼 수 있을 테니까요."
90002240-271 = "[ns] \"……그래.\""
90002240-277 = "[ns] \"고마워. 모두.\""
90002240-279 = "(많은 일들이 있었다.)"
90002240-288 = "(지나가고 보면 순간이었지만.)"
90002240-297 = "(정말로, 한 번에 다 설명할 수 없을 만큼 많은 일들이.)"
90002240-302 = "(그 모든 일들을 뒤로 하고.)"
90002240-309 = "(한 명의 새로운 학생과 함께.)"
90002240-315 = "(우리는, 밀레니엄 사이언스 스쿨로 향했다.)"
