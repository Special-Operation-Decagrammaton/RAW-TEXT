[translation]
2300606-1 = "오늘은 재충전"
2300606-2 = "(백야당 앞에 도착하자, 문 앞에 걸린 팻말이 보였다.)"
2300606-3 = "<오늘 백야당은 오후 1시부터 영업을 개시합니다.>"
2300606-4 = "[s] \"정문이 아니라, 뒷문으로 들어오라고 했었지.\""
2300606-8 = "(백야당의 내부는 무척이나 조용했다.)"
2300606-9 = "(천천히 적막이 흐르는 가운데.)"
2300606-10 = "아, 선생님 오셨네요."
2300606-14 = "[wa:400]― 후후후, [wa:1700]다녀오셨어요- [wa:1600]주인─님."
2300606-17 = "[ns] \"시즈코, 늘어져있네…….\""
2300606-18 = "[wa:550]― 네에네에~"
2300606-20 = "― 보시다시피 [wa:1380]현재진행형으로 [wa:1300]땡땡이 중이에요오~"
2300606-23 = "[wa:350]― 참 [wa:1000]신기해요."
2300606-25 = "― 이런 거, [wa:800]"
2300606-28 = "[wa:150]― 원래는 해서는 [wa:200]"
2300606-30 = "― 안 되는 [wa:350]일인데…….[wa:150]"
2300606-33 = "― 선생님과 [wa:400]같이 있다 보면……."
2300606-35 = "― 마음이[wa:1150] 편해져서……."
2300606-38 = "[wa:500]― 자아, [wa:1950]제 옆에 앉아주세요. 선생님."
2300606-40 = "― 절 [wa:500]이렇게 만들어버린 이상, [wa:2080]책임져 주셔야해요?"
2300606-43 = "자, 그럼 이걸로 충전은 끝!"
2300606-44 = "시즈코 완전 부활이에요!"
2300606-45 = "덕분에 오후부터는 열심히 일할 수 있겠어요."
2300606-46 = "고마워요. 선생님."
2300606-47 = "[s] \"별 말씀을.\""
2300606-48 = "그럼 오늘 하루도 잘 부탁드린다구요?"
2300606-49 = "헤헷."
2300606-51 = "(그날 오후는 백야당에서 열심히 시즈코를 도왔다.)"
