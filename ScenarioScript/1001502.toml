[translation]
1001502-1 = "아리스 퀘스트 ~모험의 시작~"
1001502-2 = "밀레니엄 시가지"
1001502-3 = "(어쩐지 걱정되어서 밀레니엄 주변의 거리로 가봤다.)"
1001502-7 = "(거리를 걷고 있는 아리스를 어렵지 않게 찾을 수 있었다.)"
1001502-8 = "……선생님?"
1001502-9 = "[s1] \"아리스. 다행히 아무 일도 없구나.\"\n[s2] \"걱정이 되어서 와 봤어.\""
1001502-10 = "빠빠빠~ 빰! 빰빠빰-!"
1001502-11 = "빠빠빠~ 빰! 빰빠빰-!"
1001502-12 = "[s3] \"?!\"\n[s4] \"팡파레?!\""
1001502-13 = "선생님이 파티에 합류했습니다."
1001502-14 = "선생님이 파티에 합류했습니다."
1001502-15 = "드디어 용사는 동료를 얻었습니다. 파티가 생겼습니다."
1001502-16 = "[s5] \"아니, 난 합류한다고 한 적은 없는데.\"\n[s6] \"용사…… 그런 설정인가…….\""
1001502-17 = "하지만 선생님은 전투에 도움이 되지 않습니다. 무기도 장비하지 않았고 체력도 1 정도입니다."
1001502-18 = "하지만 선생님은 전투에 도움이 되지 않습니다. 무기도 장비하지 않았고 체력도 1 정도입니다."
1001502-19 = "그래도 괜찮습니다. 선생님은 전투엔 쓸모없지만 동료들에게 도움이 되는 역할이니까요."
1001502-20 = "[s7] \"서포터구나.\"\n[s8] \"힐러인가.\""
1001502-21 = "아뇨. 마스코트입니다."
1001502-22 = "아뇨. 마스코트입니다."
1001502-23 = "선생님은 전투에 전혀 도움이 되지 않지만 파티에 있으면 기분이 좋아지는 역할입니다."
1001502-24 = "[s] \"그래도 뭔가 중요한 능력이 있다거나…….\""
1001502-25 = "아닙니다. 그냥 기분이 좋아질 뿐입니다."
1001502-26 = "[s9] \"…….\"\n[s10] \"………….\""
1001502-27 = "하지만 이것은 선생님의 굉장한 능력이라고 생각합니다."
1001502-28 = "하지만 이것은 선생님의 굉장한 능력이라고 생각합니다."
1001502-29 = "그 증거로 지금 아리스의 기분이 좋아졌습니다."
1001502-30 = "같은 파티원을 행복하게 만드는 것은 아무나 할 수 없는 일입니다."
1001502-31 = "그러니까 대단합니다. 굉장한 선생님입니다."
1001502-32 = "[s] \"고, 고마워…….\""
1001502-33 = "파티 등록 완료, 자, 그럼 이제 모험을 떠날 차례입니다."
1001502-34 = "이제부터 뭘 하냐면……"
1001502-35 = "……."
1001502-37 = "……그냥 전진합니다."
1001502-38 = "[s] \"그냥 전진인가.\""
1001502-39 = "그렇습니다. 일단 전진입니다. 용사의 모험은 일단 전진에서 시작됩니다."
1001502-40 = "[s11] \"이래서야 그냥 산책이잖아.\"\n[s12] \"……그럼 느긋하게 가볼까.\""
1001502-45 = "(묘하게 들떠 있는 아리스와 함께 한가하게 거리를 산책했다.)"
