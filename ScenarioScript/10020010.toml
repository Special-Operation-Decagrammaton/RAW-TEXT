[translation]
10020010-5 = "첫 번째 <차원엔진>이 바로 눈앞에 있습니다!"
10020010-6 = "조심하세요, 선생님. <차원엔진>을 지키는 방어시스템의 존재를 확인했어요……."
10020010-7 = "방주의 핵심 설비인 만큼 그만한 대비가 되어 있을 거라 생각했지만……. 설마 이 정도일 줄은……."
10020010-11 = "으아…… 여기서부터는 꽤 힘든 싸움이 되겠는걸……."
10020010-12 = "[s] \"그래도 할 수밖에 없겠지.\""
10020010-14 = "……. 그래봤자, 소용없어."
10020010-19 = "……선생님. 조심하세요. 그녀입니다."
10020010-26 = "[ns] \"시로코……!!\""
10020010-27 = "……."
10020010-28 = "[s] \"시로코, 기다려! 넌 대체 뭘 하려는 거야?!\""
10020010-29 = "……. 뭘 하려는가. 간단해."
10020010-30 = "선생님이 방주를 부수지 못하도록 막을 거야."
10020010-31 = "그리고 다시 예정대로 키보토스에 종말을 불러오게 되겠지."
10020010-36 = "응. 그게 내 역할이니까."
10020010-37 = "[ns] \"………………………!!!\""
10020010-39 = "시, 시로코 선배! 다시 나타났어요!"
10020010-52 = "뭐?! 어딘데?!"
10020010-53 = "제1구역의 차원엔진 앞이에요! 지금 선생님과 교전 중이에요!"
10020010-54 = "뭐어?"
10020010-61 = "으으으!! 지금 여기서 이러고 있을 때가 아니라 빨리 시로코 선배한테 가야 하는데……!!"
10020010-62 = "그치만…… 저희는 이곳을 지키지 않으면……."
10020010-64 = "……. 그래, 맞아. 분하지만 지금 우리는 방어에 집중해야만 해."
10020010-65 = "그러니 지금은 선생님에게 맡기는 수밖에 없어!!"
10020010-67 = "네……!! 선생님! 부탁드립니다!!"
10020010-68 = "시로코 선배를……! 막아주세요!!"
10020010-77 = "저, 전투태세에 돌입했습니다……!! 선생님, 조심하세요!"
