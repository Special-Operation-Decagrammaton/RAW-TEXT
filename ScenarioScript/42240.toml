[translation]
42240-1 = "제24화;에필로그"
42240-2 = "크로노스 스쿨, 제7 공용 스튜디오"
42240-4 = "안녕하세요, 시청자 여러분! 크로노스 보도부의 카자마키 마이입니다!"
42240-5 = "오늘 <카자마키 마이의 시사 분석> 채널에서는 지난번 있었던 총학생회장 대행 교체 및 코우사기 역 폭파 미수 사건에 대해 심층 보도를 하고자 합니다."
42240-6 = "많은 시민 여러분들이 알고 계시다시피, 지난 긴급 성명 발표를 통해 나나가미 린 수석행정관이 실각하고, 당시 방위실장이었던 시라누이 카야가 새로운 총학생회장 대행으로 취임했었는데요."
42240-7 = "카야 실장은 취임 직후 발표한 여러 행정명령의 정합성으로 인해 논란에 휩싸인 데 이어, 코우사기 역의 폭파 테러를 뒤에서 사주한 것이 발각되며 탄핵 소추되었습니다."
42240-8 = "이 사건과 관련하여 <카이저 코퍼레이션>의 자회사, <카이저 시큐리티>가 카야 실장으로부터 거액의 리베이트를 받았다는 사실이 밝혀지며 카이저 그룹은 다시 한번 논란의 중심에 서게 되었는데요."
42240-9 = "하지만 카이저 그룹의 대변인은 '자회사 임원의 일탈일 뿐, 본사의 방침과는 관련이 없다' 며 논란에 선을 긋고 책임을 회피했습니다."
42240-10 = "사건의 규모가 이처럼 커졌는데도 총학생회에서는 뚜렷한 답변을 내놓지 않아 여러가지 의혹이 계속해서 불거지고 있는데요."
42240-11 = "오늘 <카자마키 마이의 시사 분석> 채널에서는 이 의혹들에 대해 속 시원히 설명해 주실 시사 전문가 한 분을 모시고 진지한 이야기를 나누어 볼까 합니다!"
42240-12 = "시사 전문가— 데카르트 씨, 나와주시죠!"
42240-19 = "안녕하십니까. D.U.에서 가장 빠른 시사 전문가이자, <소유하지 않고도 확실한 행복을 찾는 모임>…… 줄여서 <소확행>을 이끌고 있는 데카르트라고 합니다!"
42240-20 = "아, 안녕하세요, 데카르트 씨."
42240-21 = "뭔가…… 대단한 이름의 모임을 이끌고 계시네요."
42240-22 = "아, 저희의 활동에 관심이 있으십니까?"
42240-23 = "저희 <소유하지 않고도 확실한 행복을 찾는 모임>, 줄여 <소확행>은……"
42240-24 = "아뇨, 데카르트 씨의 모임에 대해서는 설명해주시지 않아도 괜찮습니다."
42240-25 = "오늘은 총학생회를 둘러싼 여러 의혹에 대해 질문드리기 위해 모셨으니까요."
42240-26 = "쳇……"
42240-27 = "첫 번째 질문입니다!"
42240-28 = "이번 비리 및 내란 의혹으로 구속된 카야 방위실장은 이번 범죄가 자신의 사리사욕에 의한 것임을 완강히 부정하고 있는데요."
42240-29 = "카야 실장은 체포되어 교정국으로 이송되는 중에도 '진짜 초인이 나타나면 너희 같은 우민들도 내 뜻을 이해하게 될 것'이라며 알쏭달쏭한 소회를 밝혔습니다."
42240-30 = "여기서 카야 실장이 말한 초인은 과연 누구일까요? 샬레의 선생님……? 아니면 총학생회장……?"
42240-31 = "그도 아니라면 설마…… 밝혀지지 않은 배후가 더 있기라도 한 걸까요?!"
42240-33 = "……그럴 리가 없잖습니까."
42240-34 = "방위실장을 좌지우지할 수 있을 정도의 배후가 얽혀있었다면 애초에 쿠데타 같은 귀찮은 방법을 사용하지도 않았을 겁니다."
42240-35 = "패배자의 분풀이 같은 소리일 뿐이니 귀담아들을 필요도 없습니다."
42240-37 = "그, 그런가요……"
42240-38 = "그럼 이어서 다음 질문입니다."
42240-39 = "카야 실장이 구속되었을 때 일부 시민들이 <카이저 시큐리티>의 임원들 이외에도 세일러복 차림의 학생 여럿이 함께 호송되는 모습을 목격했다고 하는데요."
42240-40 = "그 세일러복 차림의 학생들은 어느 학교의, 누구인지, 신원이 확실히 밝혀지지 않은 상태입니다."
42240-41 = "소문에 의하면 그 학생들이 오래전 폐쇄된 SRT 학원의 대원들이라는 소문도—"
42240-43 = "—그럴 리가 없잖습니까?!"
42240-48 = "가, 갑자기 왜 그렇게 화를 내시는 건가요?"
42240-49 = "SRT 학원의 대원들은 정의를 위해 위험을 무릅쓰고 불의에 맞서 싸운 용감한 학생들입니다!"
42240-50 = "그런 학생들을 이번 사건의 범인들과 같은 취급을 하다니…… 그 무슨 무례한 발언입니까!"
42240-51 = "자세한 경위를 말씀드리기는 어렵습니다만, 그 학생들이 SRT 학원 출신의 대원이라는 것은 모두 잘못된 가짜 뉴스입니다!"
42240-52 = "제 유통기한 지난 야키니쿠 도시락을 걸고서라도, 단연히 말씀드리겠습니다!"
42240-54 = "(……그 정도면 확신이 없다는 뜻 아닌가?)"
42240-58 = "알겠습니다. 그럼 마지막으로……"
42240-59 = "카야 실장이 긴급 성명 발표 당시 샬레의 선생님을 부른 목적은 무엇이었을까요?"
42240-60 = "공개 회선으로 호출한 걸 보면 선생님과의 관계를 숨길 생각은 없었던 모양입니다만……"
42240-61 = "카야 실장은 샬레로부터 키보토스를 마음대로 통제할 수 있는 무기나 권한을 넘겨받으려 한 게 아니었을까요?"
42240-62 = "아, 그건 제가 확실하게 답변드릴 수 있습니다!"
42240-63 = "카야 실장이 샬레의 선생님에게 요구한 것은 다름 아닌…… 샬레 건물의 편의점에서 폐기되는 도시락이었을 겁니다!"
42240-67 = "폐기…… 도시락이요……?"
42240-68 = "네, 샬레의 편의점은 그 규모에 비해 방문하는 손님의 숫자가 제한되기 때문에 언제나 많은 양의 도시락이 폐기되고 있지요."
42240-69 = "그 막대한 양의 도시락을 본다면…… 누구라도 탐을 낼 게 분명합니다!"
42240-71 = "샬레와 총학생회 간의 도시락 협상이 결렬되었다는 건, 이후 한동안 샬레 건물의 편의점에 도시락이 납품되지 않았다는 사실을 통해 짐작할 수 있지요!"
42240-73 = "……."
42240-74 = "하지만 여러분. 총학생회와 협상을 하지 않고도 폐기 도시락을 손쉽게 얻을 수 있는 방법은 또 있습니다!"
42240-75 = "지금 저희 <소확행>에 가입하시면 무료 닭 뼈 가라아게에 더해 숙주 도시락을 하나 덤으로—"
42240-80 = "화면 상태가 고르지 못해 죄송합니다. 잠시만 기다려 주세요."
42240-81 = "뭐하는 거야, 너희들!"
42240-82 = "감히 내게 이런 취급을 하고도 무사할 거라고 생각—"
42240-86 = "죄송합니다, 시청자 여러분. 패널로 참가해 주신 시사 전문가 데카르트 씨는 갑자기 급한 일정이 생겨 자리를 비우셨습니다."
42240-87 = "오늘 <카자마키 마이의 시사 분석> 채널은 긴급 편성 프로그램, <나의 오징어 선생님>으로 대체됩니다."
42240-88 = "부디 채널 고정 부탁드립니다……!"
42240-92 = "……시논은 도대체 어디서 저런 괴짜를 시사 전문가라고 데려온 거야?"
42240-97 = "교정국, 특수 수용소 B동 207호"
42240-99 = "……교정국에서의 생활도 생각보다 나쁘진 않네."
42240-100 = "정해진 시간에 일어나서 일과를 시작하고, 몸을 단련하고, 규율에 따라 생활한다는 점만 두고 보면 SRT 특수학원과 크게 다르지 않을지도 모르겠어."
42240-101 = "다만 식단에 유부초밥이 포함되지 않는 게 단점이려나."
42240-102 = "아아, 갓 만든 따끈따끈한 유부초밥이 그리워……"
42240-108 = "죄수번호 5021번. 사식이다."
42240-113 = "……사식이요? 누가 보낸 물건인가요?"
42240-114 = "발신자는 불명이다. 높으신 분으로부터 직접 전달된 물건이라서 말이지."
42240-118 = "안에 편지가 동봉되어 있으니 직접 확인해 보도록."
42240-122 = "이상하네. 교정국 밖에서 편지를 보낼 사람은 없을 텐데……"
42240-127 = "……미야코 쨩?"
42240-130 = "O월 O일 0400 시. RABBIT 소대, 소대장 츠키유키 미야코. #n코우사기 공원에서의 생활이 안정되어 현황 보고드립니다."
42240-131 = "RABBIT 소대 총원 사고 및 열외 없이 근무를 계속하고 있으며—"
42240-135 = "……아니, 조금 더 부드러운 표현을 쓰는 편이 좋을 것 같네요."
42240-136 = "편지로 안부 전해 드립니다, 선배님. 미야코입니다."
42240-139 = "그날 작전이 모두 종료된 후, 저희는 다시 코우사기 공원으로 돌아왔습니다."
42240-140 = "어디로 돌아가야 할 지 소대원들과 오랫동안 이야기를 나누었지만…… 역시 이 장소밖에 떠오르지 않았습니다."
42240-141 = "SRT 특수학원 이외에 저희의 이상을 실현할 수 있는 학원은 없을뿐더러……"
42240-142 = "저희가 이곳에 머무르는 한, SRT의 정의를 위한 투쟁은 계속되는 셈이니까요."
42240-149 = "카야 실장이 구속된 이후, 린 수석행정관은 총학생회장 대행의 자리에 다시 복귀했습니다."
42240-150 = "억지스러운 행정명령도 모두 철회되었고, D.U.도 점차 안정을 되찾아 가고 있습니다."
42240-151 = "일시적으로 린 행정관에 반대하는 세력이 줄어든 탓에, 그녀를 비난하는 여론도 다소 잠잠해진 것 같지만……"
42240-152 = "키보토스에는 아직도 해결해야 하는 문제가 잔뜩 남아 있으니까요."
42240-153 = "린 행정관과 다른 총학생회 임원들에게 쉽지 않은 나날은 앞으로도 계속될 것 같네요."
42240-155 = "저희가 선배들을 제압하고 카야 실장의 범죄를 고발했다는 사실은 일단 총학생회 외부에는 비밀로 하기로 했습니다."
42240-156 = "총학생회로서도 자신들이 직접 폐쇄 결정을 내린 SRT 학원의 도움을 받았다는 사실을 공식적으로 인정하기는 어려울 테고……"
42240-157 = "저희도 선배들의 치부를 널리 알리고 싶지는 않았으니까요."
42240-159 = "대외적으로 이번 사태를 진정시킨 공적은 모두 칸나 국장에게 돌렸습니다."
42240-160 = "덕분에 칸나 국장과 공안국의 학생들은 예정보다 일찍 업무에 복귀할 수 있게 되었습니다."
42240-161 = "……그녀의 결정이 조금이나마 보답받은 것 같아 다행이네요."
42240-166 = "참, 그러고 보니 생활안전국의 키리노 씨는 이번 사건의 공적으로 경비국으로 전과할 수 있는 기회를 얻었다고 했는데…… 어째서인지 이번에는 그 제안을 고사했다고 하네요."
42240-167 = "지난 전투를 통해 무언가 깨달은 바가 있었던 걸까요?"
42240-169 = "저희 RABBIT 소대는…… 그 대신이라고 하기는 조금 그렇지만, 총학생회로부터 이곳 코우사기 공원에 머물러도 좋다는 허가를 공식적으로 받았습니다."
42240-170 = "본래 철거할 예정이었던 공원인 데다가, 코우사기 타운의 관리 문제가 붕 떠버린 탓에 생각보다 쉽게 허가가 난 것 같습니다."
42240-171 = "덕분에 발키리의 학생 여러분과 조금 더 편안한 마음으로 마주할 수 있게 되었습니다."
42240-172 = "물론 공원의 생활은 여전히 불편한 부분이 많아, [USERNAME] 선생님의 도움을 받고 있습니다만……"
42240-174 = "샬레 휴게실"
42240-176 = "아…… 오랜만에 개운하게 잘 씻었다……"
42240-177 = "샤워실 빌려줘서 고마워, 선생님."
42240-178 = "요즘같이 더운 날에는 목욕물을 데우기 위해 불을 피우는 것도 고역이라니까."
42240-179 = "[s1] \"천만에.\"\n[s2] \"전에도 말했지만 씻을 곳이 필요하면 언제든 샬레의 샤워실을 이용해.\""
42240-182 = "후후, 모처럼 폐를 끼치는 김에 냉장고도 잠깐 쓰고 갈까……"
42240-189 = "선생님, 지난번에 부탁했던 사고 현장의 탄흔 조사 결과를 가져왔는데……"
42240-193 = "뭐야, 모에…… 그 흐트러진 꼴은."
42240-194 = "설마, 혼자서 샬레의 샤워실을 이용한 거야?"
42240-195 = "그게 그러니까……"
42240-196 = "어제저녁부터 내 개인 텐트의 선풍기가 고장 나는 바람에 잔뜩 땀을 흘려서……"
42240-197 = "그래도 다른 소대원들에게 말도 없이 혼자 샬레에 씻으러 오다니……"
42240-198 = "……이 배신자가!"
42240-199 = "[s3] \"아, 맞다. 사키.\"\n[s4] \"저번에 말한 샴푸, 부탁한 향으로 새로 사놨어.\""
42240-204 = "아, 고마워……"
42240-209 = "……뭐야, 사키. 너도 여기 샤워실 사용했던 거야?"
42240-210 = "그런 주제에 누가 누구보고 배신자라는 건지."
42240-211 = "그, 그건 그러니까……"
42240-212 = "저번에 샬레의 당번 활동을 하는 중에 철모에 땀이 너무 차서 머리만 감고 갔던 것뿐이라……!"
