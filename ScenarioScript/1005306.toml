[translation]
1005306-1 = "스포츠 카드"
1005306-2 = "샬레 업무관"
1005306-5 = "선생님, 저 왔습니다. 전에 모모톡으로 말씀드린 업무 협력 보고서를……"
1005306-6 = "어라, 부재중이신가?"
1005306-7 = "책상도 이렇게 어질러 둔 채 어딜 가신 건지……"
1005306-8 = "이래서 선생님은 혼자 내버려 둘 수가 없다니까……"
1005306-17 = "어라? 이건……"
1005306-22 = "내 사진이잖아?!"
1005306-23 = "어, 어느 틈에 이런 사진을……? 그보다 어째서 선생님이 내 사진을 갖고 계신 거지……?"
1005306-24 = "설마 평소에도 내 모습을 보고 싶어서 몰래 가져가셨다던가……"
1005306-25 = "선생님도 참, 사진 정도는 솔직하게 말씀하시면 몇 장이든 드릴 수 있는데."
1005306-26 = "하지만 평범한 증명사진도 아니고, 이렇게 땀에 젖어 흐트러진 경기 중의 모습이라니……"
1005306-27 = "어쩐지 조금 불건전한 느낌이……"
1005306-32 = "[ns] \"왔었구나, 유우카.\""
1005306-33 = "서, 선생님? 어디에 다녀오신 건가요?"
1005306-34 = "[s1] \"창고에 비품을 확인하러 잠깐 다녀왔어.\"\n[s2] \"그보다 손에 든 그건……\""
1005306-35 = "이, 이건 그러니까……"
1005306-36 = "이, 이건 그러니까……"
1005306-37 = "오히려 제가 묻고 싶다고요! 뭔가요, 이 사진은?"
1005306-38 = "모든 학생을 공명하게 지도해야 할 교육자가, 사사로이 학생들의 사진을 몰래 보관하고 계셨다니……"
1005306-39 = "부, 불건전해요!"
1005306-40 = "[s3] \"아, 그 스포츠 카드 말인가.\"\n[s4] \"크로노스 스쿨의 학생들이 주고 갔어.\""
1005306-41 = "스포츠…… 카드요?"
1005306-42 = "스포츠…… 카드요?"
1005306-44 = "……그렇군요. 대회에 참가한 선수들의 모습을 트레이딩 카드 형태로 만들어서 유통하는 스포츠 카드라……"
1005306-45 = "이런 종류의 카드가 매니아들 사이에서 거래된다는 사실은 익히 알고 있었지만, 설마 제 사진도 카드로 만들어질 거라고는 생각지도 못했네요."
1005306-46 = "분명 대회 중에 찍은 사진은 크로노스 스쿨에서 마음대로 써도 좋다고 허락해 주긴 했지만, 설마 이런 방식으로 상품화를 하고 있었을 줄이야……"
1005306-47 = "이럴 줄 알았으면 계약서를 조금 더 꼼꼼히 검토해 볼 걸 그랬어요."
1005306-48 = "[s5] \"허가가 된 사진이라면 괜찮지 않을까?\"\n[s6] \"사진도 제법 귀엽게 잘 나온 것 같고.\""
1005306-49 = "여하튼 신기하네요. 이런 평범해 보이는 카드 한 장이 엄청난 고가에 거래될 수도 있다니……"
1005306-50 = "그, 그렇게 말씀하셔도……"
1005306-51 = "여하튼 신기하네요. 이런 평범해 보이는 카드 한 장이 엄청난 고가에 거래될 수도 있다니……"
1005306-52 = "회계 업무를 하며 종종 듣기는 했지만, 콜렉터의 세계는 여전히 이해하기 어렵네요."
1005306-53 = "듣자 하니 이런 스포츠 카드는 사진에 찍힌 선수의 활약에 따라 가치가 높아지기도 한다던데……"
1005306-54 = "후후, 그럼 제 모습이 찍힌 이 카드도 언젠가 고가에 거래될지도 모르겠네요."
1005306-55 = "지금은 일개 회계에 불과하지만, 열심히 노력한다면 언젠간 저도 밀레니엄의 학생회장이 될지도 모르니까요."
1005306-56 = "그러고 보면 친필 사인이 된 스포츠 카드는 더 비싼 값에 거래된다던데……"
1005306-57 = "나중을 대비해서 미리 사인이라도 해드릴까요?"
1005306-58 = "[ns] \"좋아.\""
1005306-60 = "[ns] \"하지만 이 카드가 비싼 값에 거래되는 일은 없을 거야.\""
1005306-61 = "……어째서인가요?"
1005306-62 = "설마 선생님께서는 제가 학생회장이 되지 못할 재목이라고 생각하시는 건가요?"
1005306-63 = "[ns] \"그런 뜻이 아니라……\""
1005306-65 = "[ns] \"이 카드는 팔지 않고 평생 소장할 거니까.\""
1005306-72 = "……역시 불건전해요."
