[translation]
1601106-1 = "자세 잡아주기"
1601106-2 = "(한적한 날을 잡아 하스미에게 연락해 운동 약속을 잡았다.)"
1601106-3 = "(변두리의 작은 실내 체육관을 찾아가니, 먼저 도착해 있던 하스미의 모습이 보였다.)"
1601106-7 = "아, 선생님. 오셨군요. 기다리고 있었습니다."
1601106-8 = "……네?"
1601106-9 = "조금 일찍 나왔는데, 제가 더 일찍 도착해 있다고요……?"
1601106-10 = "……후후. 그야 물론이지요. 애초부터, 그게 오늘 선생님과 약속을 잡은 목적에 부합하는 자세니까요."
1601106-11 = "[s1] \"목적에 부합하는 자세?\"\n[s2] \"음? 그게 무슨 뜻이야?\""
1601106-14 = "말씀드렸듯 오늘은 선생님의 체력과 운동을 위해서 약속을 잡은 것이니까요."
1601106-15 = "저도 이번 황륜대제를 진행하면서 몇 가지 눈에 담은 게 있거든요. 아직 한참 부족합니다만……."
1601106-16 = "그래도 간단한 거라면 곁에서 봐 드릴 수 있지 않을까……. 그런 생각을 좀 해 봤답니다."
1601106-17 = "자세를 잡아드린다든가, 먼저 한 번 보여드린다든가……."
1601106-18 = "딱히 코치 같은 건 아니고……. '함께 운동한다'는 느낌으로 봐주시면 좋겠습니다."
1601106-19 = "……혹시 괜한 일이었을까요? 말씀드리고 나니 좀 걱정도 되는데……."
1601106-20 = "[s3] \"그럴 리가. 잘 부탁해.\"\n[s4] \"잘됐네. 최근 몸이 좀 뻐근하긴 했으니까.\""
1601106-23 = "후후…… 그러시다면 다행입니다. 모쪼록 운동은 즐겁고 부담 없어야 하는 법이니까요."
1601106-24 = "사실 전에 해주셨던 말씀도……. 이런 식으로 써 보고 싶기도 했었고요."
1601106-30 = "말이 나온 김에 바로, 가벼운 것부터 시작해보도록 할까요?"
1601106-47 = "(이후 하스미가 보여준 동작을 따라, 가볍게 운동 한 세트를 돌았다.)"
1601106-51 = "아, 선생님. 지금 잠시만 괜찮으실까요?"
1601106-52 = "그 상태에서……. 네. 그대로 계셔주시면 됩니다. 제가 가겠습니다."
1601106-53 = "아무래도 방금 동작은 자세를 조금만 더 아래로 숙이셔야 할 것 같아서……."
1601106-54 = "제가 잡아드리겠습니다."
1601106-61 = "이렇게 하면……."
1601106-65 = "여기를 좀 더 이렇게……."
1601106-70 = "[ns5] \"……!? 하, 하스미……!?\"\n[ns6] (……!? 갑자기 뭔가 확 닿는데……!?)"
1601106-75 = "……음? 선생님? 왜 그러시나요? 어딘가 불편해 보이시는데……."
1601106-76 = "……네? 혼자서도 괜찮으실 것 같다고요? 무슨 뜻이신지……."
1601106-77 = "혹시 제가 너무 세게 붙잡은 걸까요……? 아니면……."
1601106-81 = "……아."
1601106-87 = "(설마 제가 선생님을 누르고 있어서…….)"
1601106-88 = "(……무겁……다고 느끼시는 건가……? 차마 말씀은 못 하시는…… 그런 건가……!?)"
1601106-94 = "[ns7] \"……하스미?\"\n[ns8] \"갑자기 거리를 벌렸어?\""
1601106-97 = "죄, 죄송합니다. 선생님! 결코 그럴 의도는 아니었는데……!!"
1601106-98 = "괜찮으시다고요? 그, 그렇지만……!"
1601106-99 = "……네? 이제 반대로요?"
1601106-100 = "이번에는 선생님께서 제 자세를 봐주시겠다고요? 그, 그야 저는 상관없지만……."
1601106-101 = "[s9] \"이렇게 해야 나도 마음이 편하니까.\"\n[s10] \"같이 하자는 취지였잖아. 돌아가면서 해야지.\""
1601106-104 = "으음……."
1601106-105 = "알겠습니다. 그, 그럼 이번에는 선생님이 절 잡아주시는 걸로……."
1601106-106 = "자, 자세……. 자세를……."
1601106-112 = "그, 그럼……."
1601106-113 = "잘……. 부탁드리겠습니다……. 선생님……."
1601106-117 = "하아, 하아……. 하아……."
1601106-118 = "일단 저희 모두 3세트 정도 돈 거 같으니……."
1601106-119 = "오늘은 여기까지 하도록 할까요?"
1601106-120 = "……아."
1601106-121 = "죄송합니다. 마치 앞으로도 당연히 계속할 것처럼 말해버렸군요."
1601106-122 = "저도 모르게 그만……."
1601106-123 = "……네? 그럴 생각이었던 것 아니었냐고요?"
1601106-124 = "그, 그야……. 저야 물론 선생님만 괜찮으시다면……."
1601106-128 = "……후후. 그렇군요."
1601106-129 = "그럼 그런 의미인 걸로 알겠습니다."
1601106-130 = "감사합니다, ……선생님."
1601106-132 = "……앞으로도 계속, 잘 부탁드리겠습니다."
