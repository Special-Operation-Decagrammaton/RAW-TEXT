901010400410-7 = ""
901010400410-8 = "我回來了～"
901010400410-9 = ""
901010400410-11 = ""
901010400410-13 = ""
901010400410-14 = "啊，仁子……不對，FOX2。#n歡迎回來，今天也辛苦了。"
901010400410-15 = "呵呵，FOX3也辛苦了。"
901010400410-16 = "才沒有呢，我和FOX4只是一直坐在高處而已。#n親自四處奔走的你才更辛苦吧。"
901010400410-17 = "是嗎？我反而覺得一直在原地待命更難受呢。"
901010400410-18 = "話說回來，你不是上週末才保養過盾牌？是出了什麼問題嗎？"
901010400410-19 = "這個嘛……今天海風不是很強嗎？"
901010400410-20 = "或許是因為這樣，我回到HQ一看就發現盾牌上面結了一層白白的鹽。"
901010400410-21 = "鹽分要是不好好清除盾牌很快就會生鏽，所以我想趁作戰結束前把它擦乾淨。"
901010400410-22 = "真是辛苦你了。"
901010400410-23 = "我們身上應該也殘留著看不見的鹽分，等你保養完之後一起上去沖個澡吧。"
901010400410-24 = "好，等一下要開始報告的時候再通知我。"
