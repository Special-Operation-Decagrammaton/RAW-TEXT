901010400410-8 = "กลับมาแล้ว~"
901010400410-9 = ""
901010400410-11 = ""
901010400410-13 = ""
901010400410-14 = "อื้อ นิโกะ... ไม่สิ FOX 2 กลับมาแล้วเหรอ? วันนี้ก็เหนื่อยเลยนะ"
901010400410-15 = "ฮุฮุ FOX 3 ก็เหมือนกัน"
901010400410-16 = "ไม่หรอก ฉันกับ FOX 4 แค่ไปนั่งประจำจุดบนที่สูงเอง คนที่ต้องเดินไปทั่วอย่างเธอต่างหากที่เหนื่อย#nกว่าพวกเรามาก"
901010400410-17 = "งั้นเหรอ? แต่สำหรับฉัน การต้องนั่งรอเฉยๆ มันทรมานกว่าอีกนะ"
901010400410-18 = "จะว่าไป เมื่อสุดสัปดาห์ที่แล้วก็เพิ่งซ่อมบำรุงโล่ไปไม่ใช่เหรอ? มีปัญหาอะไรหรือเปล่า?"
901010400410-19 = "คือว่า... วันนี้ลมทะเลแรงมากเลยใช่มั้ยล่ะ?"
901010400410-20 = "พอกลับมาที่กองบัญชาการ ก็เห็นคราบเกลือเกาะขาวอยู่เต็มโล่เลย"
901010400410-21 = "ถ้าไม่เช็ดคราบเกลือออกให้ดี โล่จะขึ้นสนิมง่าย ฉันก็เลยมาเช็ดทำความสะอาดก่อนจบปฏิบัติการน่ะ"
901010400410-22 = "เหนื่อยน่าดูเลยนะ"
901010400410-23 = "บนตัวก็น่าจะมีคราบเกลือที่มองไม่เห็นติดอยู่เหมือนกัน ไว้ทำความสะอาดโล่เสร็จแล้ว เราไปอาบน้ำด้วยกันนะ"
901010400410-24 = "ได้เลย พอจะเริ่มรายงานปฏิบัติการก็เรียกฉันด้วยนะ"
