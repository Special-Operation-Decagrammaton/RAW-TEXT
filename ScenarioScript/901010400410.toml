901010400410-8 = "I'm back!"
901010400410-9 = ""
901010400410-11 = ""
901010400410-13 = ""
901010400410-14 = "Ah, Niko—no, FOX 2. Welcome back. Great work today."
901010400410-15 = "Fufu. You did pretty well too, FOX 3."
901010400410-16 = "FOX 4 and I were just perching. You're the one who went through the trouble of running around and...talking to people."
901010400410-17 = "You really think? I always find it so much harder to stay still."
901010400410-18 = "Didn't you just clean your shield last week? Did something happen to it?"
901010400410-19 = "Well... The wind was strong today, probably because we were near the ocean."
901010400410-20 = "When we returned to HQ, the viewport was practically white. And the rest of the shield didn't look much better."
901010400410-21 = "If I don't wipe off the salt properly, it'll rust. So I was cleaning it off before clocking out."
901010400410-22 = "You're working hard."
901010400410-23 = "You probably have salt on your skin too, so make sure to take a shower afterward. Who knows, it might be extra exfoliating!"
901010400410-24 = "Will do. Call me in for the mission debrief."
