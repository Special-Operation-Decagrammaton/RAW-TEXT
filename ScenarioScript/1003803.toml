[translation]
1003803-1 = "SRT, 구출합니다!"
1003803-2 = "키보토스 시내의 번화가"
1003803-3 = "(미야코가 어느 상가의 유리창 앞에서 안을 들여다보며 생각에 잠겨있다.)"
1003803-4 = "………."
1003803-5 = "[s] \"미야코……?\""
1003803-6 = "으음………."
1003803-7 = "[s] \"미야코!\""
1003803-8 = "아, 아앗…… 선생님이셨군요."
1003803-9 = "죄송합니다. 잠깐 생각에 잠겨 있느라."
1003803-10 = "[s] \"무얼 보고 있었던 거야?\""
1003803-11 = "아, 다름 아니라 이 펫숍의 동물들을 구경하고 있었습니다."
1003803-12 = "코우사기 공원 근처에 있는 펫숍이라, 출동 때마다 오가며 한번씩 보는 곳인데……."
1003803-13 = "최근 이 펫숍에 토끼가 들어왔습니다."
1003803-14 = "선생님도 아시겠지만, 토끼는 정말로 귀여운 동물입니다."
1003803-15 = "저 앙증맞은 앞다리와 쫑긋한 귀…… 정말 하루 종일 보고 있어도 질리지가 않습니다."
1003803-16 = "[s] \"그렇게 좋아하면 직접 분양받는 게 어때?\""
1003803-17 = "그건……."
1003803-18 = "또 오셨군요, 손님!"
1003803-19 = "토끼를 분양받으러 오셨나요?"
1003803-20 = "네, 네? 아뇨…… 저는……"
1003803-21 = "늘 저희 가게의 토끼를 애정 어린 시선으로 쳐다보고 계시기에 오늘에야말로 분양을 받으러 오신 줄 알았는데……"
1003803-22 = "손님께서 눈여겨보고 계신 집토끼들은 사람 손을 잘 타서 순하고 착하답니다. #n이 기회에 데려가 주시는 게 어떤가요?"
1003803-23 = "하지만 저희는…… 돈도, 거주지도 충분치 않아서……"
1003803-24 = "[s] \"제일 앞에 있는 하얀 토끼로 주세요.\""
1003803-25 = "선생님? 어, 어째서……?"
1003803-26 = "선물이라고요? 하지만 저는 아직 동물을 키울 준비가……"
1003803-27 = "게다가 저희 RABBIT 소대는 제대로 된 건물도 없어서 공원에서 노숙하는 신세인걸요."
1003803-28 = "[s1] \"인질을 앞에 두고 돌아갈 수는 없지.\"\n[s2] \"토끼들도 좁은 케이지보다는 넓은 공원에서 뛰어놀고 싶어 할 거야.\""
1003803-29 = "그건……"
1003803-30 = "그렇네요. 이것도 구출작전의 일환."
1003803-31 = "그건……"
1003803-32 = "그렇네요. 유리창 안에만 있는 것은 가여우니까……"
1003803-33 = "감사합니다, 선생님."
1003803-34 = "애정을 담아서 열심히 기를게요!"
1003803-36 = "(이후, 미야코는 행복한 표정으로 토끼를 안고 돌아갔다.)"
