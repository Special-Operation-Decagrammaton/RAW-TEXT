[translation]
10036140-1 = "스쿼드가 게임을 즐기는 법 (2)"
10036140-3 = "오오? 아무리 초급 단계지만, 이 정도로 수월하게 통과하실 줄이야!"
10036140-4 = "힘들 것 없었다."
10036140-5 = "훈련용도 안 되는 표적들을 소탕하는 것쯤이야, 어려울 것 없으니."
10036140-9 = "모두, 상태는 이상 없나?"
10036140-15 = "문제없어."
10036140-16 = "응, 모두 함께 할 수 있어서 즐거운걸."
10036140-17 = "헤, 헤헤, 경품…… <BiBi> 최신호가 한 걸음 다가왔네요……!"
10036140-18 = "어, 어쩌면 정말로 우리가 첫 경품의 주인공이 될지도 몰라요……!"
10036140-19 = "아니면 좌절의 주인공이 되거나."
10036140-20 = "……네? 그게 무슨 말이에요?"
10036140-21 = "아니, 그…… 농담, 이었는데."
10036140-27 = "미사키가……."
10036140-28 = "농담을……?"
10036140-29 = "미사키 씨는 유머 센스가 파멸적이시네요……."
10036140-30 = "치잇! 빠, 빨리 다음 게임 시작해!"
10036140-31 = "좋습니다! 그럼 중급 단계로 넘어가시죠!"
