1014306-85 = "แง หนูอยากลองเล่นอันนี้แท้ๆ!"
1014306-86 = "ไม่ได้จริงๆ เหรอคะ? ตอนนี้หนูไม่ค่อยกลัวน้ำแล้วนะคะ!"
