1014306-73 = ""
1014306-74 = "..."
1014306-75 = "จริงสินะคะ บางครั้ง... การเปลี่ยนความกลัวให้กลายเป็นสิ่งที่น่าเพลิดเพลิน ก็อาจช่วยคลายความกลัวนั้นได้ค่ะ"
1014306-76 = "สมกับเป็นคุณครูจริงๆ เลยค่ะ ฮุฮุ"
1014306-77 = ""
1014306-78 = "เด็กๆ บอกว่าอยากขึ้นสไลเดอร์น้ำ เราก็เลยขึ้นมาถึงตรงนี้แล้วก็จริง..."
1014306-79 = ""
1014306-81 = ""
1014306-82 = "เอาละๆ เด็กๆ ทุกคน ตรงนี้ค่อนข้างอันตรายนะครับ ผมจะแนะนำสไลเดอร์อันที่ปลอดภัยให้นะครับ"
