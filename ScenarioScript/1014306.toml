[translation]
1014306-1 = "คุณครูผู้ดูแล"
1014306-3 = ""
1014306-4 = "ยินดีต้อนรับค่ะ คุณครู ขอบคุณที่สละเวลาเพื่อเด็กๆ ของเราในวันนี้นะคะ"
1014306-5 = "เด็กๆ ทุกคน กล่าวขอบคุณคุณครูกันสิคะ"
1014306-6 = ""
1014306-7 = "ขอบคุณค่ะ คุณครู!"
1014306-8 = ""
1014306-9 = "[ns] \"ครูฝากตัวด้วยนะ!\""
1014306-11 = "(แล้วคุณครูก็เริ่มดูแลเด็กๆ จากสวนต้นบ๊วยในสวนน้ำพร้อมกับชุน!)"
1014306-12 = ""
1014306-17 = ""
1014306-18 = "เอาละ ทุกคนคะ ก่อนอื่นเข้าแถว แล้วไปตามลำดับ..."
1014306-19 = ""
1014306-21 = ""
1014306-22 = "อุตส่าห์มายืนเข้าแถวแล้ว จะกลับไปท้ายแถวไม่ได้นะคะ!"
1014306-23 = "[ns] \"จู่ๆ ก็เป็นอะไรไปเหรอ?!\""
1014306-24 = ""
1014306-25 = "แต่ว่า... น้ำมันน่ากลัวนี่นา... หนูไม่อยากไปสระว่ายน้ำค่ะ..."
1014306-26 = "อ๊ะ อย่างนั้นเองเหรอคะ... แต่หนูจ๊ะ ถ้าคุ้นเคยกับน้ำแล้ว น้ำจะกลายเป็นเพื่อนที่ดีมากเลยนะคะ"
1014306-27 = "ทั้งคุณครูและฉันจะช่วยเต็มที่ เพื่อให้หนูสนิทกับน้ำได้นะคะ"
1014306-28 = ""
1014306-29 = "อึก... เข้าใจแล้วค่ะ..."
1014306-31 = "นี่แน่ะ! รับน้ำไปซะ!"
1014306-32 = "อ๊ะ เย็นนะ! เธอนี่นะ... มานี่เลย! "
1014306-33 = ""
1014306-35 = ""
1014306-36 = "เอาละ ตรงนี้น้ำสูงแค่ถึงเอวเท่านั้นเอง ไม่ต้องกังวลเลยนะคะ"
1014306-37 = "แต่ถ้ายังกลัวอยู่ ฉันจะช่วยจับไว้ให้แน่นๆ เองค่ะ"
1014306-38 = ""
1014306-39 = "จริงนะคะ? ต้อง 'จับไว้' นะคะ...?"
1014306-43 = "(เด็กคนนั้นจับมือชุน แล้วเริ่มเดินในสระว่ายน้ำอย่างระมัดระวัง)"
1014306-44 = "(แต่ก็ยังเห็นได้ชัดมากว่าเด็กคนนั้นกลัวน้ำจริงๆ...)"
1014306-46 = "[ns] \"เดี๋ยวก่อน ลองจับโฟมหัดว่ายน้ำนี้ด้วยสองมือดูมั้ย?\""
1014306-47 = "คุณครู...?"
1014306-48 = ""
1014306-50 = ""
1014306-51 = "แบบนี้เหรอคะ?"
1014306-52 = "[ns] \"เก่งมาก! ถ้างั้น ต่อไปก็...!\""
1014306-54 = "คะ... คุณครู?!?!"
1014306-56 = "(คุณครูช่วยดึงโฟมหัดว่ายน้ำ แล้วพาเด็กถลาไปบนผิวน้ำอย่างรวดเร็วราวกับเจ็ตสกี!)"
