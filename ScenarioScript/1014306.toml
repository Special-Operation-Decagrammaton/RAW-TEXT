[translation]
1014306-1 = "帶隊老師"
1014306-3 = ""
1014306-4 = "歡迎您，老師。非常感謝您今天為孩子們撥出時間。"
1014306-5 = "小朋友們？要向老師說謝謝哦？"
1014306-6 = ""
1014306-7 = "謝謝老師！"
1014306-8 = ""
1014306-9 = "[ns] 「請多指教囉！」"
1014306-11 = "（與旬一起，開始帶領梅花園的孩子們在水上樂園活動！）"
1014306-12 = ""
1014306-17 = ""
1014306-18 = "來，大家。先一個一個排好隊……"
1014306-19 = ""
1014306-21 = ""
1014306-22 = "要遵守秩序，不可以跑回隊伍最後面哦！"
1014306-23 = "[ns] 「怎麼了？為什麼突然跑到後面去？」"
1014306-24 = ""
1014306-25 = "因為……水很可怕嘛……我不想進去游泳池……"
1014306-26 = "啊啊，原來是這樣啊……#n不過小朋友，只要慢慢去熟悉水，水就會變成好朋友哦？"
1014306-27 = "老師和教官都會努力幫忙，讓你和水變親近的。"
1014306-28 = ""
1014306-29 = "嗚……我知道了……"
1014306-31 = "哇！是水耶！接招吧！"
1014306-32 = "呀啊！好冰！你這傢伙真的是……給我過來！"
1014306-33 = ""
1014306-35 = ""
1014306-36 = "來，這裡的水只有到腰而已，所以不用擔心哦？"
1014306-37 = "如果還是害怕的話，教官會好好扶著你的。"
1014306-38 = ""
1014306-39 = "真的嗎？「絕對」會嗎……？"
1014306-43 = "（孩子抓著旬的手，小心翼翼地開始在游泳池裡走動）"
1014306-44 = "（不過他顯然還是非常怕水……）"
1014306-46 = "[ns] 「等一下，要不要用雙手抓住這塊浮板看看？」"
1014306-47 = "老師……？"
1014306-48 = ""
1014306-50 = ""
1014306-51 = "像這樣嗎？"
1014306-52 = "[ns] 「做得很好！那麼接下來……！」"
1014306-54 = "老，老師！？！？"
1014306-56 = "（就這樣拉著浮板，讓孩子像水上摩托車一樣在水面上快速地滑行！）"
1014306-57 = ""
1014306-61 = "哇啊啊啊啊啊！？！？"
1014306-62 = "小，小朋友！沒事吧！？！？"
1014306-63 = ""
1014306-64 = "太棒了！"
1014306-65 = "咦……？"
1014306-66 = "[ns] 「很好玩吧！？接下來是這個！」"
1014306-72 = "好好玩！！！"
1014306-73 = ""
1014306-74 = "……"
1014306-75 = "原來如此。面對害怕的事物……有時反而能用玩樂的方式來化解恐懼呢。"
1014306-76 = "真不愧是老師。呵呵。"
1014306-77 = ""
1014306-78 = "雖然是孩子們說想玩滑水道才爬上來的……"
1014306-79 = ""
1014306-81 = ""
1014306-82 = "小朋友們，這個設施有點危險，我帶大家去安全一點的滑水道吧。"
1014306-83 = ""
1014306-85 = "咦～可是我很想玩這個耶！"
1014306-86 = "真的不行嗎？我現在已經沒有那麼怕水了！"
1014306-87 = "[ns] 「這感覺已經不是怕不怕水的問題了……」"
1014306-88 = "那就讓老師和教官玩給我們看吧！"
1014306-90 = "咦！？"
1014306-91 = ""
1014306-92 = "對啊！老師和教官可以玩吧！至少讓我們看看這個有多厲害嘛！"
1014306-94 = "老，老師……？"
1014306-95 = "[ns] 「好興奮！是滑水道耶！」"
1014306-96 = "咦咦……"
1014306-97 = "可，可是我其實……"
1014306-98 = ""
1014306-100 = ""
1014306-101 = ""
1014306-102 = "至，至少請老師陪我一起吧！"
1014306-103 = ""
1014306-104 = "不好意思！滑水道一次限乘一個人哦！"
1014306-105 = "說的也是！"
1014306-107 = "[ns] 「呀呼──！！！」"
1014306-109 = "（興高采烈地滑下了滑水道！）"
1014306-110 = ""
1014306-115 = "（那個設計……實在太驚人了！）"
1014306-117 = "呀啊啊啊啊啊啊啊────！？！？！？"
1014306-118 = "[ns] 「旬！？」"
1014306-120 = "請，請接住我！！！！！"
1014306-121 = ""
1014306-123 = ""
1014306-125 = ""
1014306-126 = "哈啊，哈啊……謝謝您，老師……"
1014306-127 = "……"
1014306-128 = "是的……其實我有點不擅長應付這種刺激的設施……"
1014306-129 = "為什麼沒有先說是嗎？因，因為……"
1014306-130 = "孩子們也在旁邊看著呀……"
1014306-131 = ""
1014306-132 = "哇啊！教官和老師緊緊抱在一起耶！"
1014306-133 = ""
1014306-134 = "[ns] 「！！！？？？」"
1014306-135 = ""
1014306-136 = ""
1014306-137 = ""
1014306-138 = ""
1014306-139 = "雖然嚴格來說有點不一樣，不過這也可以算是一種和吊橋效應有關的情境呢。"
1014306-140 = ""
1014306-142 = ""
1014306-143 = ""
1014306-144 = "當然那純粹只是把緊張狀態下自然產生的興奮，誤認為其他情感而導致的……"
1014306-145 = "說不定我們的教官，是想反過來利用這一點呢。"
1014306-146 = "！？！？！？"
1014306-147 = ""
1014306-148 = "你說的話，我有時候還是聽不太懂耶！"
1014306-149 = "對，對對，對不起！老師！"
1014306-150 = "[s] 「沒關係！真的沒關係！！！」"
1014306-151 = ""
1014306-152 = "大家，這裡是造浪池哦。"
1014306-153 = "是用人工的方式製造海浪，讓大家體驗衝浪樂趣的設施。"
1014306-154 = "雖然平常只會有輕微的波浪，但是每隔一段時間就會出現一次非常巨大的海浪。"
1014306-155 = "大浪要來的時候會事先廣播通知，所以要仔細聽廣播哦？"
1014306-158 = ""
1014306-159 = "不好了！各位來賓！發生海嘯了！"
1014306-160 = "馬上就會有巨大的海浪來襲！請注意安全，盡情享受！"
1014306-161 = "本水上樂園的最大浪高為2.4m。請大家務必小心，以免發生意外。"
1014306-162 = "大浪要來了！"
1014306-163 = ""
1014306-166 = "啊哈哈哈哈哈！"
1014306-168 = "你看你看！像衝浪一樣！"
1014306-169 = "小朋友，那樣很危險哦！！！"
1014306-171 = "老師！教官！我肚子餓了！"
1014306-172 = "我想吃章魚燒！還有熱狗！"
1014306-173 = "[ns] 「慢慢來！我會一個一個買給你們的！」"
1014306-175 = "來，大家。要乖乖排好隊，有耐心地等待哦？"
1014306-179 = ""
1014306-180 = "旬教官和老師，今天真是辛苦你們了。"
1014306-181 = "尤其是特地撥出時間的老師，真不知道該如何向您表達謝意才好。"
1014306-182 = "[s] 「哎呀，這只是小事而已啦。」"
1014306-183 = "不，老師願意親自撥空前來就已經非常感謝了……"
1014306-184 = "結果一整天都在忙著照顧孩子們，幾乎沒有時間好好享受……"
1014306-185 = "那麼接下來，就由我來帶領孩子們吧。"
1014306-186 = "各位小朋友？現在是回山海經的時間囉～"
1014306-187 = ""
1014306-188 = "咦咦……我還想再玩一下……"
1014306-189 = "要好好遵守時間，這樣才是乖孩子哦？"
1014306-190 = ""
1014306-191 = "知道了～"
1014306-193 = ""
1014306-194 = "……"
1014306-195 = "一天轉眼間就過去了呢。"
1014306-196 = "[s] 「旬也辛苦了。」"
1014306-197 = "不會。這對我來說只是日常的工作而已。"
1014306-198 = "那個……老師？"
1014306-199 = "剛才提到老師幾乎沒有時間好好享受的時候，我忽然冒出了一個想法……"
1014306-200 = ""
1014306-202 = ""
1014306-203 = ""
1014306-204 = "我們要不要稍微……偷偷一起玩一下呢？"
1014306-205 = "[ns]「……！」"
1014306-207 = "[ns] 「就這麼辦吧！」"
1014306-208 = "好的♡"
1014306-210 = "（就這樣跟旬一起彌補了白天沒能好好享受的遺憾）"
1014306-211 = "（結果玩得太投入，差點連末班車都錯過了……）"
