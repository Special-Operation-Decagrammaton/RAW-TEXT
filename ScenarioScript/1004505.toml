[translation]
1004505-1 = "그 속을 직접 볼 순 없지만"
1004505-3 = "(밖으로 나가 보니 어느덧 해가 뉘엿뉘엿 져 가는 저녁이었다.)"
1004505-9 = "(해변에 도착하니, 모래사장에 앉아 우두커니 수평선을 보던 호시노의 뒷모습이 보였다.)"
1004505-14 = "으응? 선생……?"
1004505-15 = "여긴 어쩐 일이야. 혹시 또 무슨 일 생겼어?"
1004505-16 = "[s1] \"나도 그냥 한 번 와 봤지.\"\n[s2] \"호시노를 보러 왔지.\""
1004505-17 = "으헤-. 싱겁기는."
1004505-18 = "으헤-. 싱겁기는."
1004505-22 = "……혹시나 해서 하는 말인데, 뭔가 마음에 걸리는 게 있거나 그러는 건 아니야."
1004505-23 = "이런 말은 미리 해 두지 않으면 선생 또 걱정하니까. 그러지 말라는 의미에서 하는 말이지."
1004505-24 = "진짜 그냥 바다를 보고 있었을 뿐이라고."
1004505-25 = "[s3] \"뭐, 호시노라면 그렇겠지.\"\n[s4] \"그럴 거라고 생각하고 있었어.\""
1004505-26 = "호오? 마치 무슨 생각을 하는지 다 안다는 듯한 말투인걸?"
1004505-27 = "호오? 마치 무슨 생각을 하는지 다 안다는 듯한 말투인걸?"
1004505-28 = "[s5] \"말 그대로 '바다'를 보고 있었겠지.\"\n[s6] \"보고 있는 거에 집중하고 있었겠지.\""
1004505-29 = "히야. 대단하구만. 역시 선생이랄까."
1004505-30 = "히야. 대단하구만. 역시 선생이랄까."
1004505-31 = "뭐, 그렇지. 그냥 바다를 보고 있는 것뿐이라고는 해도, 사실 나한테는 그리 흔한 일이 아니니까 말이야."
1004505-32 = "끝없이 펼쳐진 모래는 많이 봐 왔지만, 끝없이 펼쳐진 물이라니……. 신기할 따름이야."
1004505-33 = "저렇게 넓으니 안에 그 많은 물고기도 있을 수 있는 거겠지."
1004505-34 = "물고기도, 전복도……. 고래도……."
1004505-35 = "굳이 따지자면 물만 보이고 안을 볼 수 없다는 게 좀 아쉽긴 하지만."
1004505-36 = "그래도 이렇게나마 '저 안에 다 있다'라고 생각할 수 있는 거만 해도 나쁘지 않아."
1004505-37 = "……응. 나쁘지 않지."
1004505-38 = "[s7] \"리조트에 버려진 잠수정이 있던가.\"\n[s8] \"나쁘지 않은 정도로 괜찮겠어?\""
1004505-39 = "으헤, 선생이라면 그렇게 말할 거라고 생각했지."
1004505-40 = "으헤, 선생이라면 그렇게 말할 거라고 생각했지."
1004505-41 = "그치만 괜찮아. 지금은 그냥 이 상태로 있을래."
1004505-42 = "바다 안으로 들어가면, 반대로 바다 자체를 볼 수는 없잖아?"
1004505-43 = "해변에서 수면을 보는 것도, 바다 그 자체를 보는 것도, 그만두고 싶지 않으니까……."
1004505-44 = "한 번에 두 개를 다 보겠다는 건 아무래도 욕심이고……."
1004505-49 = "……응?"
1004505-53 = "……뭐지? 방금 멀리서 무슨 소리가……."
1004505-57 = "……어라."
1004505-58 = "[s9] \"숭어가 뛰네.\"\n[s10] \"이런 곳에 숭어가 있었네.\""
1004505-63 = "……선생? 저거, 저거 물고기야? 물고기지!?"
1004505-64 = "물고기가 방금 물 위로 뛴 거야? 그런 물고기가 있어? 굳이 왜……?"
1004505-68 = "또, 또 뛰었어! 선생! 저기 봐. 방금 또 뛰었어!"
1004505-69 = "저기도, 저기도! 뭐야? 생각보다 엄청 많잖아? 이게 무슨……!"
1004505-74 = "……에헤헤."
1004505-75 = "……뭔가 생각지도 않은 모습을 보여버렸네. 주책이야, 주책."
1004505-76 = "방금 건 못 본 걸로 해 줘, 선생. 아무리 이 아저씨라도 조금 부끄러우니까 말이야."
1004505-80 = "……자주 뛰네. 저 친구들."
1004505-81 = "[s11] \"마침 숭어 떼가 지나가나 보다.\"\n[s12] \"쭉 앉아 있던 보람이 있었네.\""
1004505-82 = "……그러게."
1004505-83 = "……그러게."
1004505-84 = "그렇구나. 계속 앉아서 기다리니까, 결국 둘 다 보게 됐네."
1004505-85 = "……때가 되면 다 볼 수 있게 되는구나. 좋은 구경을 했어."
1004505-86 = "……응. 그러네."
1004505-93 = "……좋은 구경을 했어."
