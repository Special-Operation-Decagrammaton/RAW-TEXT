[translation]
10028040-1 = "제4화;The good, The bad, The trinity"
10028040-12 = "……이봐, 기차는 지금 어디쯤 와 있어?"
10028040-13 = "지금 저희의 약 3km 뒤에 있습니다. 현재 속도 300km……."
10028040-14 = "……아니, 310km……! 315km……! 점점 더 속도가 빨라지고 있습니다!"
10028040-15 = "큭……. 속도에 맞춰야 하니 차량 속력을 올리겠습니다!"
10028040-19 = "의미 있어!? 저쪽은 300km가 넘는데?"
10028040-20 = "이건 미친 짓이야……. 약 2분 뒤 랑데부 예정!!"
10028040-21 = "겁먹지 말고, 정신 똑바로 차려!!"
10028040-22 = "곧 기차가 우릴 따라잡을 거야! 각 차량들 모두 현재 속력을 유지!!"
10028040-23 = "정말이지, 중간 정거장도 무시하고 폭주하기 시작했다더니……. 정말이었잖아."
10028040-24 = "대체 안에서 무슨 일이 일어나고 있는 거야? 이대로라면 게헨나 자치구로 폭주 열차가……."
10028040-28 = "……하아. 뭐, 좋아. 어차피 들어가서 확인하면 그만이니까."
10028040-29 = "열차도 멈추고, 관련자도 모두 색출한다! 모두 기차에 올라탈 준비해!!"
10028040-30 = "네!!"
10028040-36 = "더 빨라졌어……!?"
10028040-37 = "랑데부 15초 전!!"
10028040-38 = "총원!! 승차 준비-!!"
10028040-39 = "승차 준비!!"
10028040-43 = "……간다!!"
10028040-53 = "앞으로 몇 칸쯤 남았을까요……?"
10028040-55 = "음~. 보자. 앞으로……. 네 칸? 아니, 세 칸 남았군!"
10028040-56 = "조금만 더 전진하면 되겠다! 와하핫핫! 잘됐네, 잘됐어~."
10028040-58 = "하하……. 어쩌다 이렇게까지 흘러왔는지……."
10028040-59 = "그래도 다른 승객분들도 함께 싸워주고 있으니, 해볼 만은 한 것 같네요. 역시 정차역을 패싱한 게 컸을지도."
10028040-63 = "그렇지만 아무리 그렇다 해도 짧은 시간에 사람들을 다 선동하는 것도 그렇고, 분위기 잡는 언변도 그렇고……."
10028040-64 = "……확실히 보통 범죄자는 아니네요, 저 카스미라는 사람."
10028040-65 = "엮이면 점점 더 위험해질 것 같은 느낌이 듭니다."
10028040-66 = "가방만……. 가방만 아니었어도……. 아니, 애초에 이렇게 엮이질 않았다면……."
10028040-67 = "으으으……."
10028040-68 = "[ns1] \"이치카가 고생이 많아…….\"\n[ns2] \"가방만 빨리 찾자…….\""
10028040-71 = "그거 참, 아까부터 혼잣말이 많은 아가씨네."
10028040-72 = "그래도 그거 알아? 여기까지 오면서 느낀 건데, 내가 보기에는 말이야~ 우리는 꽤 닮은 구석이 있어."
10028040-74 = "……예?"
10028040-75 = "그, 그건 또 무슨 이상한 소림까. 어떻게 저랑 그쪽이 닮았다는 검까."
10028040-76 = "겹치는 부분이라고는 하나도 없잖아요. 저는 '트리니티'의 '정의실현부'고, 그쪽은 '게헨나'의 '테러리스트'인데……."
10028040-77 = "따지고 보면 정 반대 아닐까요? 대체 어디가 어떻게 닮았다는 건지……."
10028040-79 = "흐응~. 그런가? 나는 좀 생각이 다른데 말이지."
10028040-80 = "내심 아닌 척하고 있지만, 솔직히 아가씨는 깜찍한 트리니티 친구들보다는……."
10028040-81 = "……오히려 '우리 쪽'에 가까운 사람이잖아? 안 그래? 와하핫핫핫!!"
10028040-83 = "…하아……. 무슨 말을 하나 했더니……."
10028040-84 = "헛소리 좀 그만하시고요. 마음 같아선 당장이라도 바이바이 하고 싶으니까."
10028040-86 = "와하하핫핫! 그래, 뭐. 알았어! 일단은 그런 걸로 하지, 일단은!"
10028040-87 = "그치만 내리고 싶다고 너무 서두르지는 말라고~? 그러다가는 될 것도 안 되거든."
10028040-88 = "앞으로 세 칸 남았다는 게, 거리상으로는 물론 금방인 것처럼 보이지만……."
10028040-101 = "……다른 말로는 점점 더 저쪽의 '본대'랑 마주한다는 의미이기도 하니까 말이야."
10028040-103 = "놈들이 여기까지 밀고 들어왔다!!"
10028040-104 = "이봐! 바로 지금이야! '그것'을 끌고 와!!"
10028040-105 = "……? 응?"
10028040-106 = "……'그것'……?"
10028040-107 = "호오~. 아무래도 저 친구들, 뭔가 준비한 서프라이즈가 있는 모양인데?"
10028040-108 = "이 망할 폭도 놈들, 우리라고 늘 당하고만 있을 줄 알았어!?"
10028040-109 = "이날만을 위해 준비했지! 각오 단단히 하라고!!"
10028040-124 = "……워우~."
10028040-125 = "뭐야, 뭐야. 이 친구들……. 이거 아주 준비를 단단히 해 왔잖아?"
10028040-126 = "아무리 그래도 그렇지, 대포까지 끌고 오는 건 좀……."
10028040-128 = "대포가 아니야! 폭동 제압용 캐논포다!!!"
10028040-130 = "아니, 그러니까 정확히는……."
10028040-134 = "……아니다. 뭐, 일단 멋있으니 상관없나?"
10028040-135 = "[s3] \"……확실히 멋지긴 멋지네.\"\n[s4] \"그동안 얼마나 난동이 많았으면…….\""
10028040-142 = "열차 안에서 저런 걸……."
10028040-143 = "으음. 곤란하네요. 여기서는 일단 상황을 바꿀 필요가……."
10028040-144 = "그래도 해보지 않으면 모르는 거지-!!"
10028040-145 = "자아-!! 모두 돌겨어억-!! 저 이상한 대포를 박살 내는 거다아아아아-!!"
10028040-156 = "하아……."
10028040-161 = "……이쪽을 노린다!"
10028040-162 = "그렇겠죠."
10028040-169 = "……! 온다!!"
10028040-171 = "모두 동작 그만-!!"
10028040-181 = "[ns] \"……이 목소리는!!\""
10028040-182 = "하던 행동을 즉시 중지!!"
10028040-183 = "전부 무기를 버려! 양손을 머리 위에 얹고 움직이지 마!!"
10028040-184 = "……응!? ……어라?"
10028040-185 = "여기서 난입……이라고?"
10028040-186 = "지금 이 타이밍에요? ……열차 밖에서?"
10028040-187 = "……이 열차……. 아직 달리는 중인데요?"
10028040-188 = "아니, 잠깐만요. 그보다 저 복장은……."
10028040-197 = "……어?"
10028040-198 = "……오!!"
10028040-199 = "오오오~!!! 이게 누구야, 우리 게헨나 선도부님들 아냐!?"
10028040-200 = "동작 그만이라고 했을 텐데!! 모두 정지하라고, 정지!!"
10028040-205 = "……지금부터 이 열차는 게헨나 선도부가 장악한다!!"
10028040-206 = "열차 내 모든 행동은 모두 내 통솔하에 따르……."
10028040-207 = "……도록……?"
10028040-211 = "……선생님?"
10028040-212 = "……뭐야? 왜 선생님이 이런 곳에 있는 거지?"
10028040-213 = "[s5] \"안녕, 이오리.\"\n[s6] \"오늘따라 굉장히 반갑네!\""
10028040-216 = "하아……. 또 무슨 이상한 짓을 하고 있었던 거야? 보나 마나 쓸데없는 짓이었겠지만."
10028040-217 = "그리고 그 옆은……."
10028040-219 = "……아, 안녕하세요. 이치카라고 합니다."
10028040-220 = "저기, 저희는 그저……."
10028040-221 = "이야~. 이게 누구야? 우리 선도부의 이오리님 아냐~!?"
10028040-222 = "안녕~? 그동안 잘 지냈어~?"
10028040-226 = "그리고 혹시 괜찮다면~ 이왕 여기까지 와 준 거, 온 김에 우리 좀 도와주면 안 될까?"
10028040-227 = "우리 꽤 얼굴도 자주 본 사이잖아? 평소의 관계를 생각해서라도…… 그치?"
10028040-228 = "……저기. 제가 따지는 것도 웃기긴 한데요."
10028040-233 = "……두 분은 적대 관계 아니셨슴까."
10028040-236 = "……뭐……."
10028040-237 = "뭐-야!? 이 구성은?!!?"
10028040-238 = "이 열차, 게헨나 행 열차 아니었어!? 어째서 트리니티의 정의실현부가 여기 있는 거지?"
10028040-239 = "그리고 카스미라고……!?"
10028040-240 = "카스미……!? 카스미!? 선생님, 설마 지금까지 카스미랑 동행하고 있던 건 아니겠지!? 아니라고 말해!!"
10028040-241 = "하하~ 역시 이오리야! 척하면 척이구만~."
10028040-242 = "넌 다물어!!"
10028040-243 = "선생님!! 진짜야? 그게 사실이야!? 아니지? 저 녀석이랑 한패였다든가, 그런 거 아니지!?"
10028040-244 = "우리가 저 녀석 잡으려고 여태까지 얼마나 고생하고 다녔는지 모를 리 없는 선생님이!!"
10028040-245 = "……뭐?"
10028040-246 = "우리가 함께한 게 얼만데 지금 나를 못 믿냐고……?"
10028040-247 = "장난치지 마!! 지금 그게 내가 가진 문제야, 선생님! 난들 알겠냐고!! 이 상황을 어떻게 이해하란 거야!!"
10028040-251 = "……응?"
10028040-252 = "뭐라고? 지금 그런 이야기를 할 때가 아니야……? 그건 또 무슨 소리야?"
10028040-253 = "……뒤?"
10028040-254 = "바로 뒤를 보라고? 뒤에 뭐가……."
10028040-259 = "[ns7] \"캐논포가…….\"\n[ns8] \"어떻게 딱 그 바로 앞으로…….\""
10028040-263 = "……? 이건 또 뭐야?"
10028040-267 = "왜 이런 게 있……."
10028040-273 = "[ns9] \"이오리가 정통으로 맞았어……!\"\n[ns10] \"괘, 괜찮아!? 이오리!!\""
10028040-280 = "공겨어억-!! 총원 공겨어어억-!!"
10028040-281 = "와하핫핫!! 이제야 대화가 통하는구만!!"
