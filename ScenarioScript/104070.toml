[translation]
104070-1 = "제7화;같은 상황, 같은 선택"
104070-3 = "서, 선생님……."
104070-4 = "자신의 탈출 기회를……."
104070-5 = "시로코…… 씨에게……?"
104070-6 = "……서, 선생님…… 그, 그러시면……."
104070-7 = "선생님의 평범한 몸으로는…… 이 추락에서……."
104070-8 = "아, 안 돼요, 선생님----------!!"
104070-10 = "남은 탈출 시퀀스 - 없음"
104070-22 = "……. 저는…… 오해하고 있었던 건가요."
104070-23 = "선생님의 뜻은 그런 게 아니었던 건가요."
104070-24 = "이해…… 불가. 그럼 어째서…… 선생님은…… 방주를 통해 여기에 온 것인가요……"
104070-25 = "그건…… 그건……"
104070-29 = "어쩌면……."
104070-47 = "……선생님은 믿고 있었던 건가요?"
104070-48 = "이런 종착지에 도달한 자신은 해내지 못했던 것을……."
104070-49 = "이런 종착지를 피한 자신은 해내리라는 것을……?"
104070-50 = "[ruby=선생님]자신[/ruby]이라면……."
104070-52 = "같은 상황에서 똑같은 선택을 할 것이라고……."
104070-55 = "……. 아뇨. 이대로 포기하고 있어서는 안 돼요."
104070-56 = "……구하겠어요. 선생님을."
104070-57 = "<싯딤의 상자>의 OS인 저 아로나가 선생님을 구하겠어요!!"
104070-58 = "저는 지금까지 계속 기적을 일으켜서 선생님을 지켜왔어요, 이 정도…… 이 정도의 상황이야 제힘으로…… 어떻게든……!!"
104070-59 = "제힘으로……!!!"
104070-84 = "쿨럭, 쿨럭. ……쿨럭……!!"
104070-90 = "쿨럭쿨럭, 쿨럭. ……쿨럭……!! 쿨럭……!!"
104070-92 = "폭발에서 어떻게든 지켜냈지만……."
104070-93 = "아, 안 돼요…… 추락하는 속도가…… 줄지 않아요……."
104070-94 = "어, 어째서? 저, 저의 힘으로는 역부족……"
104070-95 = "쿨럭, 쿨럭. ……쿨럭……!!"
104070-96 = "무리……라고요……? 힘이…… 부족……."
104070-97 = "지금까지 너무 많은 힘을 써 와서……?"
104070-98 = "우트나피쉬팀을 기동하면서 받은 상처와…… 아트라하시스의 연산 때문에……?"
104070-99 = "아니에요!! 그 정도는…… 저에게……!! 아무것도……."
104070-100 = "아, 안 돼……!!"
104070-101 = "여긴 선생님이 생존할 수 있는 고도가 아니에요, 빨리…… 빨리 구하지 않으면……. 빨리……."
104070-102 = "선생님……."
104070-105 = "[ns1] \"……이제 됐어. 괜찮아. 아로나.\"\n[ns2] \"나 대신 그 아이에게 손을 내밀어 줘.\""
104070-108 = "서, 선생님?!"
104070-109 = "[ns3] \"그동안 고마웠어. 아로나 쨩. 미안해.\"\n[ns4] \"이제 작별이야. 건강하게 잘 지내.\""
104070-112 = "자, 잠깐만요. 작별이라니, 무, 무슨…… 서, 선생님……?"
104070-115 = "선생님……!!!!!"
104070-122 = "(……아트라하시스의 방주의 <나람신의 왕좌>가 파괴되었으니.)"
104070-123 = "(저도 이제 곧…….)"
104070-128 = "……?!"
104070-133 = "……. 여긴……."
104070-134 = "……. 네. 다행이에요. 역시 이곳으로 싯딤의 상자의 OS 데이터를 전송할 수 있었어요."
104070-135 = "저를…… 여기로? 어째서……?"
104070-136 = "이해 불가. 어째서 저를 구해주신 겁니까? 저는…… 당신의 적인데……."
104070-140 = "……. 납득."
104070-141 = "선생님은…… 시로코를 구하고…… 네. 언제나 그래 왔기에……."
104070-142 = "그리고 저도…… 선생님이 구해야 하는 학생이라고 생각하신 거군요."
104070-146 = "……의문. 선생님은요?"
104070-147 = "선생님은……."
104070-148 = "……이해. 상황 분석. ……. 확인."
104070-149 = "그렇군요…… 선생님은 지금……."
104070-150 = "……네. 선생님은…… 제가 구하려고 했지만……."
104070-154 = "……."
104070-155 = "흐흐흑…… 으흑……."
104070-156 = "저로서는…… 무리…… 힘이…… 부족해서……. 방법을…… 방법을 찾을 수 없어서……."
104070-157 = "흐흐흑……."
104070-161 = "……. 상황 확인. 방법…… 구축."
104070-165 = "<싯딤의 상자>의 A.R.O.N.A, 지금부터 선생님의 긴급 보호를 위한 세계의 강제 개입을 시작합니다."
104070-166 = "어…… 네……? 지금…… 뭐라고……?"
104070-173 = "이, 이건……?"
104070-174 = "……. 제가 돕겠습니다. 아로나."
104070-180 = "방법은 있습니다."
104070-181 = "지금부터 당신의 능력과 저의 능력을 더해서, 기적을 일으키겠습니다."
104070-182 = "기적을……."
104070-183 = "그렇게 하면, 선생님을 무사히 지상으로 내려보낼 수 있을 것입니다."
104070-184 = "아로나. 손을 주십시오."
104070-185 = "소, 손을요……?"
104070-186 = "네. ……저를 믿나요?"
104070-189 = "……네. 선생님이 당신을 믿었으니까, 저도 믿어요."
104070-192 = "……감사합니다."
104070-193 = "그럼 시작하겠습니다. 당신과 나…… 우리들의 기적을."
