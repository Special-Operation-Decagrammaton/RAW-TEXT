[translation]
10039030-1 = "제3화;아이돌의 길: 댄스"
10039030-3 = "……응? 아이돌에 대해 배우고 싶어……?"
10039030-4 = "뭐, 우리야 상관없지만. 근데 뭐가 있을까……."
10039030-5 = "가르쳐주고 싶어도 가르쳐 줄만 한 게 딱히 없는걸. 노래도 의상도 전부 만든 게 아니라 체인점에서 협찬받은 거고……."
10039030-6 = "어떻게 한다……. 흠……. 배우고 있는 춤이라도 알려줘야 하나?"
10039030-7 = "체인점? 협찬……이라니요?"
10039030-8 = "아, 그건 본관이 설명드리겠습니다! 이번 아이돌 이벤트 참가는 저희가 먼저 이야기를 꺼낸 게 아니었거든요."
10039030-9 = "본관과 후부키가 자주 들르는 도너츠 가게에서, 마스코트를 겸해서 같이 나가 달라고 대민지원을 요청받은 거라……."
10039030-10 = "[s1] \"……마스코트?\"\n[s2] \"대민지원……?\""
10039030-13 = "네, 분명히 그렇게 들었습니다!"
10039030-14 = "선생님도 이상하게 생각하지? 왜 도너츠 가게의 홍보를 위해 발키리의 생활안전국인 내가 아이돌을 해야 하는 건지."
10039030-15 = "나도 그렇게 생각하긴 했는데 말이야……. 이야기를 듣자마자 위에서 하라고 시켜서……."
10039030-16 = "후부키! 대민지원의 일환이잖아요! 그렇게 말하면 안 된다고요!"
10039030-17 = "그만큼 시민분들이 저희 생활안전국을 편안하고 친근하게 생각해 준다는 이야기인데, 좋은 거잖아요?"
10039030-18 = "아니, 그러니까 대민 지원도 결국 일은 일이라는……."
10039030-19 = "그리고 곤란에 처한 시스터 님을 도와드리는 것 또한 물론 기쁘게 환영이랍니다!"
10039030-20 = "비록 저희가 직접 뭘 기획하는 게 아니라서 알려드릴 수 있는 게 많지는 않지만, 그래도 저희가 배우는 춤 정도라면……."
10039030-21 = "이렇게……?"
10039030-27 = "……아닌가? 이렇게였나요, 후부키?"
10039030-28 = "왜 날 봐, 다른 사람들도 본다고. 연습실도 아니고 여기서 춤추는 건 사양하고 싶은데."
10039030-29 = "으으응? 이상하다. 기억이 잘……. 이렇게였나?"
10039030-31 = "……?"
10039030-32 = "[ns3] (……무슨 움직임이지……?)\n[ns4] (아직 여기도 배우는 중인가 보네.)"
10039030-35 = "……! 아, 아무튼 어떻습니까! 대충 이런 느낌이었던 걸로 기억하고 있습니다만!"
10039030-36 = "뭐, 우리도 아직 배우는 중이니까. 전문 강사가 지정된 날짜마다 가르쳐 주고 있거든."
10039030-37 = "물론 이걸 하게 된 만큼, 평소의 업무로부터는 다소 해방된 감이 없잖아 있지만……."
10039030-39 = "[ns5] (결국 다른 일을 하게 된 건 마찬가진데.)\n[ns6] (조삼모사……라고 봐야겠지, 이건.)"
10039030-42 = "표정을 보니 정확하게 읽었구나, 선생님."
10039030-43 = "그런 이야기야. 오히려 평상시보다 더 땡땡이칠 각을 잡기 어렵달까……."
10039030-45 = "후부키~!"
10039030-46 = "알았어, 알았다고. 알았으니 그런 식으로 보지 마."
10039030-47 = "아무튼 그래. 듣자 하니 춤 같은 건 배워 두면 이래저래 유용하다거나 그렇다고 했으니까."
10039030-48 = "유용하다고요……? 춤이……?"
10039030-49 = "기본적으로 아이돌이니까 춤을 추는 건 당연한 거지만요! 그 이외에도 뭔가 좀 일정이 꼬였다거나, 준비가 덜 됐다거나!"
10039030-50 = "기타 유사시 상황에서 주의를 끌거나 시간을 벌기도 좋다고 들었거든요! 행사를 유연하게 해준다나……!"
10039030-51 = "……! 과연……!"
10039030-52 = "뭐 사실 저런 상황까지 간 게 오히려 안 좋은 거니까, 애초에 그런 일이 일어나지 않기를 바래야겠지만 말이지."
10039030-53 = "그보다도 그쪽 시스터 님은……."
10039030-58 = "[ns7] \"이 소리는……?\"\n[ns8] \"갑자기 경보음이?\""
10039030-61 = "……! 사건이에요, 후부키! 출동입니다!!"
10039030-63 = "아니, 우리는 아이돌 이거 한다고 일정 빼 준다고 했잖아. 우리도 가야 하는 거야?"
10039030-64 = "이야기랑 다르잖……."
10039030-69 = "지금 다른 분들이 없잖아요! 우선 저희라도 가 있어야죠! 게다가 사건 발생 위치가……."
10039030-73 = "어……?"
10039030-74 = "여긴 후부키가 맨날 가는 도넛 가게잖아요……!?"
10039030-75 = "……?"
10039030-76 = "……뭐?"
10039030-77 = "그 협찬해 준다고 하셨다던……?"
10039030-78 = "이러고 있을 시간이 없어요, 후부키! 얼른 출발하겠습니다!!"
10039030-79 = "아니, 그러니까……! 자, 잠깐! 잠깐……!!"
10039030-93 = "모두 꼼짝 마!! 허튼 짓거리 할 생각 말아!!"
10039030-94 = "우린 그저 도넛을 좀 먹으려고 하는 것뿐이니까 말이야! 얌전히 내어주고 가게 놔두면, 아무도 다치지 않을 수 있다!!"
10039030-95 = "히, 히이이……! 이러지 마세요……!"
10039030-96 = "이러는 게 싫으면 도넛을 달라고! 네가 시간을 끄는 바람에 발키리가 와버렸잖아!!"
10039030-97 = "그, 그렇지만 도넛 가격은 지불하셔야죠. 저희 가게는 선불제라서……."
10039030-98 = "누가 그걸 모르냐고!! 강도한테 선불을 요구하는 알바생이 세상에 어딨어!!"
10039030-99 = "히, 히잉……!! 사장님이 도넛은 외상없이 선불로 받으라 했단 말이에요!!"
10039030-100 = "뭐 이렇게 대화가 안 통하는 알바생이 다 있냐."
10039030-101 = "원래 알바생은 대화가 잘 안 통해. 몰랐어?"
10039030-102 = "그건 그렇지만……."
10039030-103 = "……큭. 젠장, 이러는 사이에 발키리 녀석들이 앞을 둘러쌌어."
10039030-104 = "이렇게 된 이상, 인질 잡고 농성이다! 탈출할 차량까지 가지고 오라고 협상하자!!"
10039030-106 = "에휴, 정말이지. 일이 왜 이렇게 커져 버린 걸까……."
10039030-107 = "너 때문이잖아!!"
10039030-108 = "이게 왜 제 탓이죠!? 당신들 탓이잖아요!!"
10039030-110 = "뭐, 그렇긴 해."
10039030-111 = "그러니까 납득해 주지 말라고!!!"
10039030-113 = "세상에, 이런 백주 대낮에 인질극이라니……. 믿을 수가 없네요!"
10039030-114 = "크게 벌인 일에 비해서 막상 내용은 어이가 없는 수준이지만……."
10039030-119 = "오, 키리노! 후부키! 마침 도와주러 왔구나!!"
10039030-120 = "저 녀석들, 이대로 대치만 거의 20분 째야. 어떻게 하지?"
10039030-121 = "처음에는 도넛만 달라고 하더니, 이제는 도망칠 차량까지 요구하기 시작했어. 일이 꽤 피곤해졌는데."
10039030-123 = "으음……. 다른 곳들은? 경비국이라던가 공안국이라던가……."
10039030-124 = "오기는 할 거 같은데, 시간이 좀 걸린다고 들었어."
10039030-125 = "아무래도 여기서는 일단 우리끼리 어떻게든 해결해야 할 거 같은데……."
10039030-126 = "끄응……. 결국 그런 흐름인 건가……."
10039030-127 = "저기 봐, 생활안전국의 후부키잖아!?"
10039030-128 = "과연……! 평소 친하게 지내던 도넛 가게를 지키러 직접 온 건 가봐!!"
10039030-129 = "이번에 콜라보로 아이돌 이벤트도 참가한다더니, 구하러 온 걸까!? 역시 의리가 있다니까!!"
10039030-130 = "아, 아니. 나는 그런 게……."
10039030-131 = "……!! 오, 후부키 쨩!!"
10039030-132 = "후부키 쨩이다, 후부키 쨩! 여기야 여기~!!"
10039030-133 = "부탁이니 제발 조용히 좀 해!! 팬미팅 장소가 아니라고!!"
10039030-134 = "진짜 분위기 안 난다, 양쪽 다."
10039030-135 = "아, 으, 으응……. 안녕……."
10039030-136 = "으음……! 역시 저희가 구출하는 수밖에 없어요, 이번 사건!!"
10039030-137 = "어떻게든 당장 인질을 구출하고 문제 학생들을 제압해야 하는데……!"
10039030-138 = "무언가 방법, 방법이……! 끄응……!"
10039030-144 = "[ns9] \"마, 마리……!\"\n[ns10] \"가게 쪽으로 달려갔어!?\""
10039030-153 = "……? 뭐냐, 너?"
10039030-155 = "그 복장……. 시스터 님이잖아? 트리니티의 시스터후드?"
10039030-156 = "시스터후드 사람이 왜 이런 곳에……."
10039030-163 = "……?"
10039030-165 = "……?????"
10039030-166 = "……뭐야, 저거? 뭐 하는 거야?"
10039030-171 = "……! 저건……!"
10039030-173 = "당신 뭐야!? 뭐 하는 짓이냐고!? 갑자기 튀어나와서!!"
10039030-180 = "이봐!! 사람 말이 말 같지 않아!?"
10039030-181 = "뭐 하는 거냐고 묻고 있잖아!! 갑자기 이 와중에 웬 춤이냐고!!!"
10039030-188 = "……주……"
10039030-189 = "……주……?"
10039030-190 = "……주……"
10039030-191 = "주……?"
10039030-192 = "……주……."
10039030-193 = "……주의를 끌며 시간을 벌고 있어요!!"
10039030-199 = "……! 아뿔싸!!!"
10039030-200 = "오 예, 찬스~!"
10039030-205 = "야, 이 멍청한……!!"
10039030-206 = "지금입니다!! 틈이에요, 모두 돌입!!!"
10039030-221 = "……와."
10039030-222 = "……이게 되네."
