1602002-84 = "[ns7] \"คุยจ้อกับคนแปลกหน้าได้สบายๆ เลยนะเนี่ย\"\n[ns8] \"โอโทกิดูเข้าสังคมเก่งกว่าสไนเปอร์คนอื่นเยอะเลยนะ\""
1602002-87 = "สไนเปอร์คนอื่นงั้นเหรอ...?"
1602002-88 = "อ่า ก็นั่นสินะ ปกติแล้วสไนเปอร์มักจะออกปฏิบัติการคนเดียว"
1602002-89 = "คนก็เลยอาจจะติดภาพจำว่าสไนเปอร์ต้องเป็นคนขี้อายและเก็บตัวละมั้ง"
1602002-90 = "แต่ก็จริงที่ว่าพวกนักเรียนสไตล์หมาป่าเดียวดายที่คุ้นชินกับความอ้างว้าง และไม่ค่อยสุงสิงกับใคร มักจะทำภารกิจซุ่มยิงได้เก่งกว่าใครเพื่อน..."
1602002-91 = "สไนเปอร์เองก็ถือเป็นสมาชิกคนหนึ่งของทีมเหมือนกัน เพื่อให้การทำงานกับสมาชิกในทีม#nเป็นไปอย่างราบรื่น การฝึกทักษะการเข้าสังคมเอาไว้บ้างก็น่าจะเป็นเรื่องที่ดีนะ"
1602002-92 = "อีกอย่าง การที่ฉันไม่คิดจะหลีกเลี่ยงการพูดคุยกับใคร มันก็มาจากกฎเหล็กประจำตัว#nในฐานะสไนเปอร์ของฉันด้วยเหมือนกัน"
