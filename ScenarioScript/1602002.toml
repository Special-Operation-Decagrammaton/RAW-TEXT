1602002-150 = ""
1602002-151 = "แต่ฉันคิดว่าการคว้าโอกาสไว้โดยไม่ลังเล มันเป็นเรื่องที่ดีน่ะ"
1602002-152 = "ถึงจะตัดสินใจผิดพลาดไปบ้าง เราก็ยังแก้ไขความผิดพลาดนั้นได้ #nแต่โอกาสที่มาถึงในตอนนั้น มันจะไม่หวนกลับมาอีกแล้ว"
1602002-153 = "เพราะงั้นไม่ว่าจะเป็นการพบเจอผู้คนใหม่ๆ การลองทำอะไรใหม่ๆ หรือตอนที่ฉันค้นพบ#nสิ่งที่ไม่เคยรู้มาก่อน ฉันก็ตั้งใจว่าจะไม่วิ่งหนี แล้วก็จะเดินหน้าลุยกับมันดู"
1602002-154 = "[s9] \"เป็นความคิดที่ดีมากเลยละ\"\n[s10] \"ครูอยากให้ยึดมั่นในความคิดนี้ต่อไปนะ\""
1602002-157 = "ฮุฮุ ฉันไม่ได้จะโอ้อวดหรอกนะ แต่ฉันว่าความเชื่อมั่นแบบนี้แหละที่ทำให้ฉันได้ลองประสบการณ์#nมาแทบจะทุกรูปแบบแล้ว"
1602002-158 = "ไม่ว่าจะบนฟ้า บนผืนดิน หรือในท้องทะเล ไม่มีสถานการณ์ไหนที่อยู่เหนือความคาดหมายของ#nฉันหรอก..."
1602002-159 = ""
1602002-160 = "เรามีสินค้าตัวใหม่ครับ! ลองชิมดูสิครับ"
1602002-161 = "พบกับการปฏิวัติวงการบะหมี่ถ้วยสำเร็จรูปด้วยรสชาติที่ไม่เคยมีมาก่อน! ขอนำเสนอบะหมี่ผัดรสใหม่ รสชิลลี่ช็อกโกแลต!"
1602002-162 = "..."
1602002-163 = "เมื่อค้นพบสิ่งใหม่ เราก็ไม่ควรหลีกเลี่ยง และเข้าไปลอง..."
1602002-164 = "[s11] \"แต่ไม่จำเป็นต้องฝืนลองก็ได้นะ?!\"\n[s12] \"บางทีต่อให้ไม่ลองก็รู้คำตอบไม่ใช่เหรอ?\""
1602002-167 = "ไม่หรอก คุณครู"
