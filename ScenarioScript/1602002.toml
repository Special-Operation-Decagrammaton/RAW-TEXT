[translation]
1602002-1 = "A Certain Sniper's Small Talk"
1602002-3 = "I went to visit a famous cafe chain that had opened up near the Schale building."
1602002-4 = "It was after lunch time, but the cafe was filled with customers."
1602002-5 = "[ns1] \"(So this is the cafe that was all the rage on social media...)\"\n[ns2] \"(I've heard the coffee is always perfectly made to the customer's taste.)\""
1602002-9 = ""
1602002-10 = "Hello! What can I get for you today?"
1602002-11 = "[s] \"Hi! One black coffee please.\""
1602002-12 = "Ah, my apologies! This must be your first time here."
1602002-13 = "We stock a variety of beans and have perfected various methods of brewing coffee. So every cup of coffee is perfectly suited to your preferences!"
1602002-14 = "What beans do you want? Washed or natural? What about the roast?"
1602002-15 = "[s] \"Wh-What kind of beans do you have...?\""
1602002-16 = "We offer a wide variety, including Bourbon, Typica, Geisha, and Catuai."
1602002-17 = "You can also customize the roast, but for beans with high acidity, we recommend a light roast to preserve the scent."
1602002-18 = ""
1602002-20 = ""
1602002-21 = "[ns] \"Uh, then... Uh...\""
1602002-22 = ""
1602002-24 = ""
1602002-25 = "Oh? [USERNAME] Sensei?"
1602002-26 = "Did you also see this cafe in FruLink? It's been going viral lately."
1602002-27 = "[s3] \"Otogi!\"\n[s4] \"Thank goodness. Please help me...\""
1602002-30 = "...Huh? Why're you so frazzled?"
1602002-31 = "[s] \"Have you been to this cafe before, Otogi?\""
1602002-32 = "No, this is my first time. Why, what's up?"
1602002-33 = "...There's too many things on the menu, and it's too complicated, so it's hard to decide..."
1602002-34 = "You can just ask the employee, can't you?"
1602002-35 = "...You feel kind of self-conscious asking in front of all these people?"
1602002-36 = ""
1602002-38 = ""
1602002-39 = ""
1602002-40 = "If that's the only problem, then I can help you with that!"
1602002-42 = ""
1602002-43 = "Hey—"
1602002-44 = "Hey what's the difference between \"washed\" and \"natural\" beans?"
1602002-45 = "Ah, washed is when the coffee beans are separated from the fruits when harvested, washed, and dried, while natural means the beans have been fermented with the fruit."
1602002-46 = "People generally prefer washed if they enjoy the pure taste of coffee, whereas natural-washed beans will add fruity notes to the coffee."
1602002-47 = "Wow, I didn't know you could get fruity coffee like that. How cool!"
1602002-48 = "Do you have anything yuzu scented? That's my favorite."
1602002-49 = "Yes. The naturally fermented Bourbon beans have a sweet citrusy flavor profile with a nice yuzu aroma."
1602002-50 = "Will you go with that, then? And how should we brew the coffee?"
1602002-51 = "Hm... I don't know coffee that well, so whatever's best for those beans."
1602002-52 = "Yes, then I'll have them hand-dripped."
1602002-53 = "And for you..."
1602002-54 = "[s] \"I-I'll have the same thing!\""
1602002-55 = "Great choice. We'll have that ready for you soon."
1602002-56 = ""
1602002-58 = ""
1602002-59 = "[ns5] \"You saved me...\"\n[ns6] \"Everything is so complicated these days.\""
1602002-62 = "Yeah, stores with customized experiences like this have been really popular lately."
1602002-63 = "I've been enjoying it. It's fun to talk to the employees and learn new things."
1602002-64 = "Some people think it's way too much interaction and avoid them at all costs, though."
1602002-65 = "It's not like the employee is gonna reach over the counter and attack them if they don't know how to answer their questions."
1602002-66 = ""
1602002-68 = "Here's your coffee!"
1602002-69 = "Ah, our order's here."
1602002-70 = "Mm, it smells good... The coffee really does have that unique citrusy scent."
1602002-71 = "If it were cold, it might even smell like iced tea."
1602002-72 = "Ice would actually dampen the aroma quite a bit, but please just let me know if you'd like some."
1602002-73 = "No, no. I want to try it the way you recommended it."
1602002-74 = "But what beans are good as iced coffee? It'd be nice to try that next time."
1602002-75 = "If you'd like, I can give you some cold brew samples to try out!"
1602002-76 = "Oh, awesome. Please, if you don't mind!"
1602002-78 = ""
1602002-79 = ""
1602002-80 = ""
1602002-81 = ""
1602002-83 = ""
1602002-84 = "[ns7] \"You're a very good conversationalist...\"\n[ns8] \"You're more social than the other snipers I know.\""
1602002-87 = "Other snipers...?"
1602002-88 = "Ah. I get it. Because snipers are usually on their own."
1602002-89 = "That's probably where the stereotype that snipers are timid and introverted came from."
1602002-90 = "Of course, lone-wolves who are used to isolation and working on their own tend to do well on solo sniper missions..."
1602002-91 = "But we're still part of a squad. If you want a coordinated mission to go smoothly, you still need to have good social skills."
1602002-92 = "And I have a rule for myself, as a sniper. It got rid of that feeling for me."
1602002-93 = "[s] \"What rule is that?\""
1602002-94 = "You see..."
1602002-95 = ""
1602002-97 = ""
1602002-98 = "Hey, you dropped this bookmark."
1602002-99 = ""
1602002-101 = "Oh my gosh, thank you! I can't believe I almost lost it. It's really important to me."
1602002-102 = "I think I recognize this autograph..."
1602002-103 = "Ah, the author of \"Koi About Love\"! From their \"Forbidden Love\" series."
1602002-104 = "You're totally right! I got it at one of their publication events, so it's one of a kind."
1602002-105 = "I can't believe you recognized it. Are you a fan too?"
1602002-106 = "I don't know if I could consider myself a fan, but I do really like all their works. I buy their new releases whenever I come across them."
1602002-107 = "Ah! Have you gotten their new collection of short stories yet? It came out last week."
1602002-108 = "What? No, I haven't!"
1602002-109 = "Good... Then take this! It's their new release."
1602002-110 = "Are you sure? This must be really precious to you."
1602002-111 = "Yes, please take it! It's just my plan to turn you into a fan, like me."
1602002-112 = ""
1602002-114 = ""
1602002-115 = "Then, thank you! I'm honored."
1602002-116 = "If you don't mind, can I have your MomoTalk? I'll message you my thoughts once I'm done!"
1602002-118 = "Yes, of course! It's..."
1602002-120 = ""
1602002-121 = ""
1602002-122 = ""
1602002-123 = ""
1602002-124 = ""
1602002-125 = ""
1602002-127 = ""
1602002-128 = ""
1602002-129 = ""
1602002-130 = ""
1602002-131 = ""
1602002-132 = ""
1602002-134 = "Otogi continued the rest of our visit naturally chatting up employees and customers when the opportunity arose."
1602002-135 = "We got a lot of unexpected information and goodies because of her gregarious attitude."
1602002-136 = ""
1602002-137 = "Ah, that was fun."
1602002-138 = "Thanks, Sensei. This is the most fun I've had in a while, all thanks to you."
1602002-139 = "[s] \"No, not at all. I should be the one saying thank you.\""
1602002-140 = ""
1602002-143 = "[ns] \"So... What was that rule you were talking about?\""
1602002-144 = "Right, I forgot we were talking about that."
1602002-145 = "Being a sniper entails a lot of opportunity evaluation."
1602002-146 = "\"Should I take the shot now? Should I wait a little longer for a better one?\""
1602002-147 = ""
1602002-149 = ""
1602002-150 = ""
1602002-151 = "But I've realized that you need to just take the opportunity when it rises."
1602002-152 = "You can always fix a mistake. You can't get back a moment you let slip by."
1602002-153 = "And it applies in life too. Whether it's meeting someone, trying out something new, or learning difficult things, I do my best not to run away."
1602002-154 = "[s9] \"That's a great rule to live by.\"\n[s10] \"I hope you keep that belief as you grow.\""
1602002-157 = "Fufu. I'm not trying to be arrogant, but thanks to this belief, I think I've tried just about everything."
1602002-158 = "The sky, the land, the sea, there's barely any situation that catches me off gua—"
1602002-159 = ""
1602002-160 = "New product! Please try it out."
1602002-161 = "This is something that never existed, nor will ever come to be again. The revolutionary cup ramen, chili chocolate noodle, is here!"
1602002-162 = "..."
1602002-163 = "When I find something new, I shouldn't avoid it. I should try it, right...?"
1602002-164 = "[s11] \"No, you don't have to force yourself?!\"\n[s12] \"There are things you just know without trying!\""
1602002-167 = "No, Sensei."
1602002-168 = "Sometimes, an SRT special agent must charge ahead, even if they know the mission is hopeless."
1602002-169 = "I'll try it myself and tell you what it tastes like."
1602002-171 = "Afterwards, Otogi tried the noodles that everyone was avoiding like the plague. Her expression was grave."
1602002-173 = ""
1602002-174 = "Right... I agree something like this will never exist again."
1602002-175 = ""
1602002-177 = ""
1602002-181 = "[ns] \"Otogi...!\""
1602002-183 = "She collapsed in pain."
