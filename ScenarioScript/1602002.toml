1602002-101 = "อ๊ะ ขอบคุณค่ะ! นี่เป็นที่คั่นหนังสือสุดล้ำค่าของฉันเลย เกือบทำหายแล้วสิคะ"
1602002-102 = "มีลายเซ็นคุ้นๆ อยู่บนที่คั่นหนังสือด้วยแฮะ..."
1602002-103 = "อ่า ใช่ลายเซ็นของนักเขียน 'ความรักคือปลาคาร์ฟ' ในซีรีส์ <ความรักต้องห้าม> หรือเปล่า?"
1602002-104 = "ค่ะ ใช่เลยค่ะ! นี่คือที่คั่นหนังสือรุ่นลิมิเต็ดที่แจกในงานเปิดตัวหนังสือค่ะ!"
1602002-105 = "ไม่น่าเชื่อเลยนะคะว่าจะดูออกในทันทีเลย... หรือว่าคุณก็เป็นแฟนคลับของนักเขียนคนนี้เหรอคะ?"
1602002-106 = "คงไม่ถึงกับเรียกตัวเองว่าเป็นแฟนคลับหรอก แต่ฉันก็ชอบหนังสือของนักเขียนคนนี้นะ ถ้ามีเวลาก็จะซื้อมาอ่านเสมอๆ เลย"
1602002-107 = "ถ้างั้นรู้หรือเปล่าคะว่าเรื่องสั้นเล่มใหม่ของนักเขียน 'ความรักคือปลาคาร์ฟ' เพิ่งวางขายไป#nเมื่อสัปดาห์ที่แล้วเอง?"
1602002-108 = "งั้นเหรอ? ไม่รู้เลยแฮะ"
1602002-109 = "ดีเลยค่ะ... งั้นก็ช่วยรับไว้เถอะนะคะ นี่คือหนังสือใหม่ของนักเขียนคนนั้นค่ะ"
1602002-110 = "เอาหนังสือล้ำค่าแบบนี้มาให้ฉันได้เหรอ?"
1602002-111 = "ไม่ต้องเกรงใจเลยนะคะ หนังสือเล่มนี้ฉันพกติดตัวไว้เพื่อ 'โปรโมท' ผลงานของนักเขียน 'ความรักคือปลาคาร์ฟ' อยู่แล้วค่ะ"
