[translation]
1602002-1 = "어느 저격수의 스몰토크"
1602002-3 = "(샬레 빌딩 근처에 유명한 프랜차이즈 카페가 새로 생겼다고 해서 방문해 보았다.)"
1602002-4 = "(점심 시간이 지난 오후의 카페에는, 수많은 손님들이 몰려와 인산인해를 이루고 있었다.)"
1602002-5 = "[ns1] (이곳이 SNS에서 화제가 된 그 카페인가…….)\n[ns2] (손님의 취향에 맞는 최적의 커피를 제공해 준다던데…….)"
1602002-10 = "어서오세요, 주문하시겠습니까?"
1602002-11 = "[s] \"네. 블랙 커피 한 잔 부탁드립니다.\""
1602002-12 = "아, 손님. 저희 카페는 처음이신가 보군요."
1602002-13 = "저희 카페에서는 다양한 커피 원두와 기기를 갖추고 있기 때문에 손님의 취향에 맞춘 최적의 한 잔을 제공해드리고 있습니다."
1602002-14 = "원두는 어떤 것으로 드릴까요? 워시드와 내추럴 중 어느 쪽을 선호하시나요? 로스팅 단계는?"
1602002-15 = "[s] \"워, 원두는 어떤 종류가 있죠……?\""
1602002-16 = "버번, 티피카, 게이샤, 카투아이 등 다양하게 갖추고 있습니다."
1602002-17 = "로스팅 또한 단계별로 주문하실 수 있습니다만, 산미가 높은 원두는 향을 보존하기 위해 대부분 라이트 로스팅으로만 준비하였습니다."
1602002-21 = "[ns] \"어, 그럼…… 그러니까…….\""
1602002-25 = "어라, [USERNAME] 선생님?"
1602002-26 = "선생님도 이 카페, 후루링크에서 보고 왔어? 요새 SNS에서 아주 핫하던데."
1602002-27 = "[s3] \"오토기!\"\n[s4] \"마침 잘 됐다. 나 좀 도와줘…….\""
1602002-30 = "……응? 왜 그런 표정을 짓고 있는 거야?"
1602002-31 = "[s] \"오토기는 이 카페에 자주 와 봤어?\""
1602002-32 = "아니, 나도 처음 오는 카페인데. 무슨 말썽이라도 생긴거야?"
1602002-33 = "……메뉴가 너무 많고 복잡해서 결정하기가 어렵다고?"
1602002-34 = "뭐야, 그냥 그런 거라면 점원에게 물어보면 되잖아."
1602002-35 = "손님이 너무 많아서 이것저것 물어보려니 눈치가 보인다고?"
1602002-40 = "좋아. 그런 거라면 내게 맡겨줘!"
1602002-43 = "저기—"
1602002-44 = "이 원두 설명에 있는 워시드와 내추럴은 무슨 뜻이야?"
1602002-45 = "아, 워시드는 커피 열매를 수확한 뒤 커피 원두만 따로 세척하여 건조한 것이고, 내추럴은 과육과 함께 발효한 원두를 의미합니다."
1602002-46 = "깔끔한 맛을 선호하신다면 워시드 커피를 추천드리지만, 과일 같은 달콤한 풍미를 느끼고 싶다면 내추럴 커피를 추천드려요."
1602002-47 = "오, 커피에서 과일차 같은 향이 난다고? 신기하네."
1602002-48 = "나는 개인적으로 유자차를 엄청 좋아하는데, 혹시 유자차 같은 향이 나는 커피도 있으려나?"
1602002-49 = "네. 오늘 들어온 이 내추럴 발효 방식의 버번 원두는 시트러스 계열의 달콤한 풍미가 있어서 유자 향이 특징입니다."
1602002-50 = "그럼 이 원두로 드릴까요? 추출은 어떤 방법을 희망하시나요?"
1602002-51 = "음…… 나는 커피는 잘 모르니까 제일 잘 어울리는 것으로 부탁할게."
1602002-52 = "네, 그럼 핸드 드립으로 내려서 드리겠습니다."
1602002-53 = "그리고 그 쪽의 손님은……"
1602002-54 = "[s] \"저, 저도 같은 것으로 부탁드릴게요!\""
1602002-55 = "네. 그럼 금방 준비해드리겠습니다."
1602002-59 = "[ns5] \"덕분에 살았어…….\"\n[ns6] \"요새 가게들은 주문이 너무 복잡하단 말이지.\""
1602002-62 = "확실히 요새는 손님의 취향에 맞추어 다양한 대응을 하는 가게들이 인기인 것 같아."
1602002-63 = "나는 주문을 하면서 점원들과 가볍게 수다도 떨 수 있어서 좋은데."
1602002-64 = "소심한 사람은 주문을 하다가 질문이 길어지면, 겁을 먹고 도망치는 경우도 종종 있나 봐."
1602002-65 = "아무리 주문이 많다고 해도 손님을 잡아먹는 요릿집은 현실에 존재하지 않는데 말이지."
1602002-68 = "……주문하신 커피 나왔습니다."
1602002-69 = "아, 왔다. 왔어."
1602002-70 = "음, 좋은 향기…… 정말 커피에서 감귤 특유의 새콤한 향이 나네."
1602002-71 = "뭔가 차갑게 해서 마시면 아이스티 같은 느낌이 날지도."
1602002-72 = "아이스 커피는 대부분의 향이 가라앉기 때문에 추천드리지 않지만, 필요하시다면 얼음을 가져다 드리겠습니다."
1602002-73 = "아니. 모처럼 추천을 부탁했으니 오늘은 이 향에 집중해 볼게."
1602002-74 = "대신 아이스 커피에 어울리는 원두를 알려줄 수 있을까? 다음에는 그쪽을 시도해 보게."
1602002-75 = "괜찮으시다면 비교해 보실 수 있도록 다른 콜드브루 샘플을 드릴까요?"
1602002-76 = "그거 궁금한데? 그럼 조금만 부탁할게."
1602002-84 = "[ns7] \"낯선 사람들과 이렇게 쉽게 이야기를 나누다니…….\"\n[ns8] \"뭔가 오토기는 다른 저격수들보다 사교적인 것 같네.\""
1602002-87 = "다른 저격수들……?"
1602002-88 = "아, 보통 저격수들은 단독 작전을 하는 일이 많으니까."
1602002-89 = "저격수는 소심하고 내성적이라는 이미지가 강할지도 모르겠네."
1602002-90 = "물론 좀처럼 타인과 어울리지 않고 외로움에 익숙한 론리 울프 스타일의 학생이 저격 임무에 능숙한 경우가 많지만……"
1602002-91 = "저격수도 엄연한 부대의 일원이니까. 다른 대원들과 원활히 작전을 수행하기 위해서는, 어느 정도는 사교성을 기르는 편이 좋지."
1602002-92 = "게다가 타인과의 대화를 꺼리지 않는 데에는, 내 저격수로서의 철칙도 한 몫 하고 있거든."
1602002-93 = "[s] \"저격수로서의 철칙?\""
1602002-94 = "응, 예를 들자면—"
1602002-98 = "어라? 저기, 이 책갈피 떨어트렸어."
1602002-101 = "아, 감사합니다! 소중한 책갈피인데 잃어버릴 뻔했네요."
1602002-102 = "책갈피에 뭔가 낯익은 사인이 그려져 있는데……"
1602002-103 = "아. 혹시 이거, <금단의 연애> 시리즈의 '사랑은 잉어' 작가의 사인인가?"
1602002-104 = "네, 맞아요! 전에 출간 기념 이벤트로 받은 한정 책갈피에요!"
1602002-105 = "이걸 한 번에 알아보시다니…… 혹시 그 쪽도 작가님의 팬이신가요?"
1602002-106 = "팬이라고 자처할 만큼은 아니지만, 이 작가의 책은 좋아하는 편이야. 신간이 나오면 꼬박꼬박 사 읽고 있거든."
1602002-107 = "그럼, 지난 주에 '사랑은 잉어' 작가님의 신작 단편집이 나왔는데 알고 계셨나요?"
1602002-108 = "아니? 전혀 몰랐어."
1602002-109 = "잘 됐다…… 그럼 이거, 받아주세요. 작가님의 신간이에요."
1602002-110 = "이런 귀한 책을 내게 줘도 괜찮아?"
1602002-111 = "부담스러워하실 필요는 없어요. 이 책은 '사랑은 잉어' 작가님의 매력을 홍보하기 위해 갖고 다니는 '포교용' 책이니까요."
1602002-115 = "그럼 고맙게 받을게."
1602002-116 = "아, 혹시 메일 주소 좀 알려줄래? 나중에 감상을 보내주고 싶은데."
1602002-118 = "네, 부디……!"
1602002-134 = "(이후로도 오토기는 점원이나 다른 손님과 자연스럽게 어울려 즐겁게 대화를 나누었고…….)"
1602002-135 = "(덕분에 생각지도 못한 팁이나 서비스를 잔뜩 받게 되었다.)"
1602002-137 = "아, 즐거웠다~"
1602002-138 = "고마워, 선생님. 덕분에 오랜만에 즐거운 오후를 보낸 것 같아."
1602002-139 = "[s] \"아니야. 덕분에 나도 재미있는 경험을 했어.\""
1602002-143 = "[ns] \"그래서…… 그 '저격수의 철칙'이라는 건 뭐야?\""
1602002-144 = "아, 그 이야기를 하다 말았지?"
1602002-145 = "저격 임무를 수행하다 보면 수많은 기회와 마주하게 되거든."
1602002-146 = "지금 방아쇠를 당겨야 하나, 더 기다려야 하나 고민할 때가 많은데—"
1602002-151 = "나는 기회가 오면 주저하지 않고 움켜쥐는 게 좋다고 생각해."
1602002-152 = "잘못된 판단을 내리더라도 실수는 돌이킬 수 있지만. #n그 날, 그 때 찾아오는 기회는 영영 돌아오지 않으니까."
1602002-153 = "그래서 새로운 만남이든, 새로운 시도든 언제나 모르는 걸 발견했을 때는 피하지 않고 계속 시도해 보려고 해."
1602002-154 = "[s9] \"멋진 생각이네.\"\n[s10] \"앞으로도 그 생각이 변치 않길 바랄게.\""
1602002-157 = "후후. 자만하는 건 아니지만, 그래도 이 신념 덕분에 어지간한 일은 다 경험해 본 것 같아."
1602002-158 = "하늘이든, 땅이든, 바다든. 나의 예측을 벗어나는 상황은 거의 없지—"
1602002-160 = "신상품입니다! 한 번 시식해보세요."
1602002-161 = "이런 맛은 이전에도 이후에도 없었다! 컵라면 계의 혁명, 칠리 초콜릿 볶음면이 새로 나왔습니다!"
1602002-162 = "………."
1602002-163 = "새로운 걸 발견했을 때는 피하지 않고, 시도해야……"
1602002-164 = "[s11] \"아니, 억지로 시도할 필요는 없다고?!\"\n[s12] \"가끔은 시도해 보지 않아도 알 수 있잖아?\""
1602002-167 = "아니야, 선생님."
1602002-168 = "SRT의 특수 요원이라면 때로는 실패할 걸 알면서도 돌격해야만 할 때가 있는 법."
1602002-169 = "내가 어떤 맛인지 직접 확인하고 알려줄게."
1602002-171 = "(이후, 오토기는 비장한 표정으로 아무도 시식에 응하지 않던 볶음면을 시식했고…….)"
1602002-174 = "확실히…… 이런 맛은 앞으로도 없을 게 분명하네."
1602002-181 = "[ns] \"오토기——!\""
1602002-183 = "(괴로운 표정으로 장렬하게 쓰러지고 말았다.)"
