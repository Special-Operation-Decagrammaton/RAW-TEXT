1602002-143 = "[ns] \"สรุปแล้ว... 'กฎเหล็กของสไนเปอร์' ที่ว่าคืออะไรเหรอ?\""
1602002-144 = "อ้อ เราคุยเรื่องนั้นค้างกันไว้สินะ?"
1602002-145 = "ก็ระหว่างที่ปฏิบัติภารกิจซุ่มยิง จะเกิดโอกาสให้ยิงหลายครั้งน่ะ"
