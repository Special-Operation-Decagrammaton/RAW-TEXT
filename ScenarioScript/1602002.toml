[translation]
1602002-1 = "การพูดคุยเล็กๆ น้อยๆ ของสไนเปอร์"
1602002-3 = "(คุณครูได้ยินมาว่ามีแฟรนไชส์คาเฟ่ชื่อดังมาเปิดใหม่ใกล้กับอาคารชาเล่ต์ จึงลองแวะไปดู)"
1602002-4 = "(ในช่วงบ่ายหลังเวลาอาหารกลางวัน คาเฟ่แน่นขนัดไปด้วยลูกค้า)"
1602002-5 = "[ns1] (นี่คือคาเฟ่ที่กำลังเป็นกระแสในโซเชียลสินะ...)\n[ns2] (ได้ยินว่าที่นี่เสิร์ฟกาแฟให้เข้ากับความชอบของลูกค้าด้วย...)"
1602002-9 = ""
1602002-10 = "เชิญครับ รับอะไรดีครับ?"
1602002-11 = "[s] \"ขอเป็นกาแฟดำแก้วหนึ่งนะ\""
1602002-12 = "อ่า คุณลูกค้า เพิ่งเคยมาคาเฟ่ของเราเป็นครั้งแรกสินะครับ"
1602002-13 = "คาเฟ่ของเรามีเมล็ดกาแฟและอุปกรณ์ชงหลากหลาย เราเลยรังสรรค์กาแฟแก้วที่ดีที่สุด ที่ตรงตามความชอบของลูกค้าได้ครับ"
1602002-14 = "เอาเป็นเมล็ดกาแฟแบบไหนดีครับ? แปรรูปแบบวอชหรือแบบเนเชอรัล? และคั่วระดับไหนดีครับ?"
1602002-15 = "[s] \"มะ... มีเมล็ดกาแฟแบบไหนบ้างเหรอ...?\""
1602002-16 = "เรามีเมล็ดกาแฟให้เลือกหลายสายพันธุ์เลยครับ ทั้งเบอร์บอน ทิปิก้า เกอิชา คาทุยก็มีครับ"
1602002-17 = "สำหรับระดับการคั่ว เราก็มีให้เลือกสั่งตามความชอบเหมือนกันครับ แต่ถ้าเป็นเมล็ดกาแฟที่มีความเปรี้ยวสูง เราจะเตรียมเฉพาะแบบคั่วอ่อนไว้เป็นหลัก เพื่อคงกลิ่นหอมดั้งเดิมเอาไว้ครับ"
1602002-18 = ""
1602002-20 = ""
1602002-21 = "[ns] \"อ่า... ถ้างั้น... เอาเป็น...\""
1602002-22 = ""
1602002-24 = ""
1602002-25 = "เอ๋ คุณครู [USERNAME]?"
1602002-26 = "คุณครูก็รู้จักคาเฟ่นี้จาก FruLink ใช่มั้ย? หมู่นี้เป็นกระแสในโซเชียลมากเลยละ"
1602002-27 = "[s3] \"โอโทกิ!\"\n[s4] \"มาได้จังหวะพอดีเลย ช่วยครูด้วย...\""
1602002-30 = "หืม...? ทำไมถึงทำหน้าแบบนั้นล่ะ?"
1602002-31 = "[s] \"โอโทกิมาคาเฟ่นี้บ่อยหรือเปล่า?\""
1602002-32 = "ไม่นะ ฉันก็เพิ่งมาเป็นครั้งแรกเหมือนกัน มีเรื่องอะไรงั้นเหรอ?"
1602002-33 = "เมนูมีเยอะและซับซ้อนเกินไปจนตัดสินใจไม่ได้...?"
1602002-34 = "อะไรกัน เรื่องแบบนั้นถามจากพนักงานเอาก็ได้นี่นา"
1602002-35 = "เห็นว่ามีลูกค้าเยอะ ก็เลยเกรงใจจนไม่กล้าถามโน่นนี่งั้นเหรอ?"
1602002-36 = ""
1602002-38 = ""
1602002-39 = ""
1602002-40 = "ก็ได้ งั้นก็วางใจฉันได้เลย!"
1602002-42 = ""
1602002-43 = "เอ่อ..."
1602002-44 = "ในคำอธิบายเมล็ดกาแฟ ที่เป็นแบบวอชกับเนเชอรัล มันหมายถึงอะไรเหรอ?"
1602002-45 = "อ้อ แบบวอชคือการนำผลเชอร์รีสุกมาปอกเปลือกแล้วล้างทำความสะอาดก่อนนำไปตากแห้ง ส่วนแบบเนเชอรัลคือการนำเมล็ดกาแฟไปตากแห้งและหมักบ่มไปพร้อมๆ กับเนื้อกากเลยครับ"
1602002-46 = "ถ้าชอบรสชาติที่สะอาดสดชื่น ผมแนะนำกาแฟแบบวอช แต่ถ้าอยากสัมผัสรสชาติหวานอมเปรี้ยว#nและกลิ่นผลไม้ ผมแนะนำกาแฟแบบเนเชอรัลครับ"
1602002-47 = "โอ้ กาแฟมีกลิ่นเหมือนชาผลไม้ได้ด้วยงั้นเหรอ? น่าทึ่งจัง"
1602002-48 = "ส่วนตัวฉันชอบชาส้มยูซุมากเลย พอจะมีกาแฟที่กลิ่นหอมเหมือนชาส้มยูซุบ้างมั้ย?"
1602002-49 = "มีครับ เรามีเมล็ดกาแฟเบอร์เบินหมักตามธรรมชาติมาส่งวันนี้พอดี กาแฟสายพันธุ์นี้#nมีรสชาติหวานอมเปรี้ยวคล้ายส้ม และโดดเด่นด้วยกลิ่นหอมของส้มยูซุครับ"
1602002-50 = "งั้นเอาเป็นเมล็ดกาแฟนี้เลยมั้ยครับ? แล้วอยากให้ชงกาแฟด้วยวิธีไหนดีครับ?"
1602002-51 = "อืม... ฉันไม่ค่อยรู้เรื่องกาแฟเท่าไร ขอเป็นแบบที่เหมาะสมที่สุดแล้วกัน"
1602002-52 = "ได้ครับ งั้นผมจะชงด้วยวิธีแฮนด์ดริปให้นะครับ"
1602002-53 = "แล้วของลูกค้าท่านนี้..."
1602002-54 = "[s] \"ขะ... ขอแบบเดียวกันแล้วกัน!\""
1602002-55 = "ได้ครับ แล้วจะรีบนำไปเสิร์ฟนะครับ"
1602002-56 = ""
1602002-58 = ""
1602002-59 = "[ns5] \"เหมือนมาช่วยชีวิตครูไว้เลยละ...\"\n[ns6] \"หมู่นี้ทำไมสั่งเครื่องดื่มกินยากจัง\""
1602002-62 = "เดี๋ยวนี้ร้านที่คอยปรับการบริการตามรสนิยมของลูกค้า ดูจะได้รับความนิยมมากเลยนะ"
1602002-63 = "ฉันว่าดีนะที่เราพูดคุยเล็กๆ น้อยๆ กับพนักงานตอนสั่งเครื่องดื่มได้"
1602002-64 = "แต่สำหรับคนที่ขี้อาย พอพนักงานเริ่มถามคำถามยาวเข้าหน่อย ก็คงมีบ้างละนะที่กลัวจนเผ่นหนี#nออกจากร้านไปเลย"
1602002-65 = "แต่ต่อให้ลูกค้าจะเยอะแค่ไหน ก็คงไม่มีร้านไหนที่จะจับลูกค้ากินหรอก"
1602002-66 = ""
1602002-68 = "กาแฟที่สั่งได้แล้วครับ..."
1602002-69 = "อ๊ะ มาแล้ว"
1602002-70 = "อืม กลิ่นหอมจัง... กาแฟมีกลิ่นอมเปรี้ยวแบบส้มยูซุจริงๆ ด้วย"
1602002-71 = "ถ้าดื่มแบบเย็นๆ รสชาติอาจจะเหมือนชาเย็นก็ได้เนอะ"
1602002-72 = "สำหรับกาแฟเย็น ทางร้านจะไม่ค่อยแนะนำเท่าไรครับ กลิ่นหอมส่วนใหญ่จะดรอปลงไป แต่ถ้าคุณลูกค้าต้องการ ผมก็เอาน้ำแข็งมาให้ได้ครับ"
1602002-73 = "ไม่เป็นไร อุตส่าห์ให้ช่วยแนะนำตั้งขนาดนี้แล้ว วันนี้ฉันขอดื่มด่ำกับกลิ่นหอมจากกาแฟนี้ดีกว่า"
1602002-74 = "แต่ช่วยแนะนำเมล็ดกาแฟที่เหมาะกับการดื่มเย็นๆ ด้วยได้มั้ย? ไว้คราวหน้าฉันจะลองสั่งดู"
1602002-75 = "ถ้าคุณลูกค้าสะดวก ลองชิมตัวอย่างกาแฟสกัดเย็นเปรียบเทียบดูมั้ยครับ?"
1602002-76 = "น่าสนใจดีนะ งั้นขอลองชิมหน่อยแล้วกัน"
