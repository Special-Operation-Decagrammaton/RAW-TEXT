[translation]
1602002-1 = "某位狙擊手的閒聊"
1602002-3 = "（聽說夏萊大樓附近新開了一家有名的連鎖咖啡廳，於是打算去光顧看看）"
1602002-4 = "（午餐時間過後的下午，咖啡廳裡可說是人山人海）"
1602002-5 = "[ns1] （這裡就是在社群網站上引起話題的那家咖啡廳嗎……）\n[ns2] （聽說會提供最符合客人喜好的咖啡……）"
1602002-9 = ""
1602002-10 = "歡迎光臨，請問要點餐嗎？"
1602002-11 = "[s] 「好，請給我一杯黑咖啡。」"
1602002-12 = "啊，這位客人。#n看來您是第一次光臨本店呢。"
1602002-13 = "本店備有各式各樣的咖啡豆與器材，因此能為客人提供最符合您喜好的咖啡。"
1602002-14 = "請問咖啡豆要使用哪一種呢？#n水洗和日曬，您偏好哪一種？烘焙程度呢？"
1602002-15 = "[s] 「咖，咖啡豆有哪些種類……？」"
1602002-16 = "我們備有波旁、鐵比卡、藝伎、卡杜艾在內的各種咖啡豆。"
1602002-17 = "烘焙也可以依程度挑選。#n不過酸味較高的咖啡豆為了保留香氣，大多只準備了淺焙。"
1602002-18 = ""
1602002-20 = ""
1602002-21 = "[ns] 「這，這個嘛……那就……」"
1602002-22 = ""
1602002-24 = ""
1602002-25 = "咦，[USERNAME]老師？"
1602002-26 = "老師你也是在FruLink上看到這家咖啡廳才來的嗎？#n最近在社群網站上超紅的。"
1602002-27 = "[s3] 「御伽！」\n[s4] 「你來得正好，快幫幫我……」"
1602002-30 = "……嗯？為什麼露出那種表情？"
1602002-31 = "[s] 「御伽你常來這家咖啡廳嗎？」"
1602002-32 = "不，我也是第一次來。#n是出了什麼狀況嗎？"
1602002-33 = "……菜單太複雜不知道怎麼選？"
1602002-34 = "什麼嘛，這種問題直接問店員不就行了嗎。"
1602002-35 = "客人太多，所以不好意思問？"
1602002-36 = ""
1602002-38 = ""
1602002-39 = ""
1602002-40 = "好。既然如此，就交給我吧！"
1602002-42 = ""
1602002-43 = "不好意思～"
1602002-44 = "請問這個咖啡豆說明上寫的水洗和日曬是什麼意思？"
1602002-45 = "啊，水洗是指採收咖啡果實後，只將咖啡豆單獨清洗、乾燥。#n日曬則是指連同果肉一起發酵。"
1602002-46 = "如果您偏好乾淨俐落的口感，我推薦水洗咖啡。#n如果想感受水果般的甘甜風味，我推薦日曬咖啡。"
1602002-47 = "哦哦，你是說咖啡會有像水果茶一樣的香氣嗎？真神奇。"
1602002-48 = "我個人很喜歡柚子茶，有沒有香氣剛好接近柚子茶的咖啡呢？"
1602002-49 = "有的。#n今天剛進的這款日曬發酵方式的波旁豆帶有柑橘的甘甜風味，柚子香是它的特色。"
1602002-50 = "那麼就用這款豆子為您沖泡好嗎？#n萃取方式您希望使用哪一種呢？"
1602002-51 = "嗯……我對咖啡不太懂，就麻煩你用最適合的方式吧。"
1602002-52 = "好的，那我就用手沖為您沖泡。"
1602002-53 = "那麼這位客人……"
1602002-54 = "[s] 「也，也麻煩你給我一樣的！」"
1602002-55 = "好的。我馬上為您準備。"
1602002-56 = ""
1602002-58 = ""
1602002-59 = "[ns5] 「託你的福得救了……」\n[ns6] 「最近的點餐方式都太複雜了。」"
1602002-62 = "確實，最近能配合客人喜好做出各種應對的店家似乎很受歡迎。"
1602002-63 = "我倒是覺得，點餐時能和店員輕鬆閒聊幾句挺好的。"
1602002-64 = "膽小的人在點餐時如果問題問久了，有時候好像也會嚇得落荒而逃呢。"
1602002-65 = "明明點餐再怎麼複雜，現實中也不存在會把客人吃掉的店家啊。"
1602002-66 = ""
1602002-68 = "……您的咖啡好了。"
1602002-69 = "啊，來了來了。"
1602002-70 = "嗯，好香……咖啡真的散發出柑橘特有的酸甜香氣呢。"
1602002-71 = "感覺弄冰一點來喝的話，或許會有像冰茶的感覺。"
1602002-72 = "冰咖啡因為大部分香氣都會沉下去，所以我不太推薦。#n不過如果您需要的話，我可以為您送上冰塊。"
1602002-73 = "不用了。#n難得請你推薦，今天就專注在這個香氣上吧。"
1602002-74 = "不過可以告訴我適合做冰咖啡的豆子嗎？#n下次我想試試那一款。"
1602002-75 = "方便的話，要不要給您另一款冷萃樣品，讓您可以比較看看呢？"
1602002-76 = "感覺很有趣耶？那就麻煩你給我一點點吧。"
1602002-78 = ""
1602002-79 = ""
1602002-80 = ""
1602002-81 = ""
1602002-83 = ""
1602002-84 = "[ns7] 「竟然能跟陌生人這麼輕鬆地交談……」\n[ns8] 「總覺得御伽比其他狙擊手要來得善於社交呢。」"
1602002-87 = "其他狙擊手……？"
1602002-88 = "啊啊，因為一般的狙擊手大多都是單獨執行作戰的。"
1602002-89 = "所以大家對狙擊手的印象才會比較偏向內向和膽小吧。"
1602002-90 = "當然那種不太與人來往、接近孤狼類型的學生，往往確實比較擅長狙擊任務……"
1602002-91 = "但是狙擊手也是部隊裡的一員。#n為了和其他隊員順利執行作戰，多少培養些社交能力還是比較好的。"
1602002-92 = "況且，不排斥與他人交談這件事，也和我身為狙擊手的鐵則有著些許關聯呢。"
1602002-93 = "[s] 「身為狙擊手的鐵則？」"
1602002-94 = "嗯，舉例來說……"
1602002-95 = ""
1602002-97 = ""
1602002-98 = "咦？那個，你的書籤掉了哦。"
1602002-99 = ""
1602002-101 = "啊，謝謝你！#n這可是很珍貴的書籤，差點就弄丟了呢。"
1602002-102 = "書籤上這個簽名有點眼熟……"
1602002-103 = "啊。這該不會是「禁忌之戀」系列的「戀愛鯉魚」作者的簽名吧？"
1602002-104 = "是的，沒錯！#n這是之前出版紀念活動上拿到的限定書籤！"
1602002-105 = "您竟然一眼就認出來了……難道您也是那位作者的粉絲嗎？"
1602002-106 = "雖然還沒到能自稱粉絲的程度，但這位作者的書我還挺喜歡的。#n有新書出版的話我都會買來看。"
1602002-107 = "那麼，您知道上週「戀愛鯉魚」的作者出了新的短篇集嗎？"
1602002-108 = "嗯？我完全不知道。"
1602002-109 = "太好了……那麼這個，請您收下。#n這是作者的新書。"
1602002-110 = "這麼珍貴的書，送我真的沒關係嗎？"
1602002-111 = "您不必覺得有負擔。#n這本書是為了宣傳「戀愛鯉魚」作者的魅力而隨身攜帶的「傳教用」書。"
1602002-112 = ""
1602002-114 = ""
1602002-115 = "那我就不客氣地收下了。"
1602002-116 = "啊，方便的話可以告訴我你的聯絡方式嗎？#n我之後想把感想傳給你。"
1602002-118 = "好的，當然可以……！"
1602002-120 = ""
1602002-121 = ""
1602002-122 = ""
1602002-123 = ""
1602002-124 = ""
1602002-125 = ""
1602002-127 = ""
1602002-128 = ""
1602002-129 = ""
1602002-130 = ""
1602002-131 = ""
1602002-132 = ""
1602002-134 = "（在這之後，御伽也自然地和店員及其他客人打成一片，愉快地交談著……）"
1602002-135 = "（多虧如此，還得到了意想不到的優惠和貼心服務）"
1602002-136 = ""
1602002-137 = "啊～真開心～"
1602002-138 = "謝謝你，老師。#n多虧了你，我才能久違地度過愉快的下午。"
1602002-139 = "[s] 「不會。我也同樣獲得了很有趣的經驗。」"
1602002-140 = ""
1602002-143 = "[ns] 「所以說……那個『狙擊手的鐵則』到底是什麼？」"
1602002-144 = "啊，那件事還沒說完呢。"
1602002-145 = "執行狙擊任務時，會遇到無數的機會。"
1602002-146 = "常常會煩惱現在該扣下扳機，還是應該再等一等……"
1602002-147 = ""
1602002-149 = ""
1602002-150 = ""
1602002-151 = "但我覺得機會來臨時，就應該毫不猶豫地牢牢抓住。"
1602002-152 = "畢竟即使做出了錯誤的判斷，還是能將失誤挽回……#n但是那一天、那一刻造訪的機會，卻永遠不會再回來。"
1602002-153 = "所以無論是新的相遇還是新的嘗試……#n每當發現未知的事物，我都想盡可能去嘗試看看。"
1602002-154 = "[s9] 「是很棒的想法耶。」\n[s10] 「希望你今後也能把這個想法維持下去。」"
1602002-157 = "哼哼。雖然不是要自誇，但也多虧了這份信念，我大概什麼事都體驗過了呢。"
1602002-158 = "無論是天空、陸地還是大海，能超出我預測的狀況幾乎一個都──"
1602002-159 = ""
1602002-160 = "新產品哦！請試吃看看。"
1602002-161 = "這種味道空前絕後！泡麵界的革命──辣味巧克力炒麵新上市！"
1602002-162 = "…………"
1602002-163 = "發現新事物的時候不能逃避，應該盡可能嘗試……"
1602002-164 = "[s11] 「等一下，你也沒必要逼迫自己嘗試吧！？」\n[s12] 「有時候不用試也知道結果吧！？」"
1602002-167 = "不，老師。"
1602002-168 = "身為SRT的特殊隊員，有時候即使明知會失敗也得展開突擊。"
1602002-169 = "我來親自確認是什麼味道，然後再告訴你。"
1602002-171 = "（之後御伽帶著悲壯的表情，試吃了那盤沒人願意試吃的炒麵……）"
1602002-173 = ""
1602002-174 = "的確……這種味道今後肯定不會再有了……"
1602002-175 = ""
1602002-177 = ""
1602002-181 = "[ns] 「御伽──！」"
1602002-183 = "（御伽帶著痛苦的表情，壯烈地倒下了）"
