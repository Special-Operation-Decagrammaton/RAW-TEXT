[translation]
104090-1 = "제9화;에필로그 1"
104090-6 = "안녕하세요, 키보토스의 학생 여러분! 크로노스 보도부의 카와루 시논입니다!"
104090-7 = "저는 지금 복구 작업이 한창 진행 중인 D.U. 시라토리구에 나와 있습니다. 저 뒤로 보이는 건물들이 이번에 복구가 진행되고 있는 건물들인데요."
104090-8 = "시라토리구는 저번 사건 때 괴수와 거대로봇의 격전장이었던 만큼 키보토스에서 가장 큰 피해를 입었던 지역이었습니다."
104090-9 = "하지만 벌써부터 저렇게 활기 넘치는 모습으로 복원되고 있군요! 멋집니다! 역시 도시 개발의 꽃은 재개발인가요!"
104090-10 = "하지만 총학생회 재무실장 오키 아오이 씨는 \"지금은 도시의 복구가 최우선.\" 이라는 말과 함께 긴급 복구 지원금을 승인, 통괄실에서 집행할 수 있게 협력했습니다."
104090-11 = "나나가미 린 씨의 문책결의안이 여전히 계류되고 있는 상태에서 이런 결정은 정치 싸움보다 도시 복구를 우선한다, 라는 올바른 자세로 칭찬할 만하다는 평가를 받고 있지만……."
104090-12 = "솟구치는 땅값과 건설 자재비는 누가 책임지나요! 재개발을 통해 얻는 이득은 과연 누가 취하게 될까요! 과연 거기에 부정이 없을까요?"
104090-13 = "다음에는 이 부분에 대한 심층 취재를……"
104090-14 = "네? 이상한 소리는 그만하라고요? 당신도 여기 땅 샀어? 엉?"
104090-18 = "화면 상태가 고르지 못해 죄송합니다. 잠시만 기다려 주세요."
104090-20 = "……키보토스에 그 사건이 벌어진 지도 벌써 많은 시간이 흘렀습니다."
104090-21 = "키보토스 전역에 붉은 탑이 생겨나고 정체불명의 적들에게 공격당한다…… 이런 엄청난 사건이 벌어졌는데도 사건을 회고하는 키보토스 시민들의 반응은 시큰둥하기만 한데요."
104090-22 = "주로 뭔가 큰 소동이 있긴 했는데 <샬레>의 활약으로 모든 것이 해결되었다…… 그래서 뭐? 라는 반응들입니다."
104090-23 = "이거 고도의 <샬레>의 홍보 이벤트? 총학생회랑 짜고 치는 깜짝 카메라? 뭐 그런 반응들도 있네요."
104090-24 = "사실 이번 일로 가장 큰 피해를 입은 D.U.만 해도, 부상자도 적고 사상자는 제로."
104090-25 = "사건의 규모에 비해서, 이 정도 피해만 발생한 것은 기적 같은 일이라고 평가하는 사람도 있지만요. 대부분의 시민은 별로 그런 게 와닿지는 않는 모양입니다."
104090-26 = "다른 자치구에서도 딱히 피해 복구나 지원 요청이 들어오지 않고 있는 걸 보면 다들 비슷한 상황이 아닌가 싶네요."
104090-27 = "아, 이번 사건의 가장 큰 피해자는 <총학생회>라는 분석도 있긴 합니다. 총학생회의 건물과 <생텀 타워>가 파괴되었으니까요!"
104090-28 = "키보토스의 행정 제어를 관리하는 <생텀 타워>의 소실…… 이제 큰일 난 거 아닌가? 키보토스는 이제 끝장인가? 멸망인가?!"
104090-29 = "……그런 생각을 하시는 시청자분이 계시겠지만요."
104090-30 = "사실 생텀 타워는 최종 관리자인 총학생회장이 실종된 뒤부터 이미 유명무실한 상태였잖아요? 그러니까 없어진다고 해서 딱히 달라질 것도 없을걸요?"
104090-31 = "실제로 총학생회는 이 사건을 불가사의한 현상으로 인한 키보토스의 습격, 이라고만 평가할 뿐, 다른 설명을 내어놓지는 않고 있고……."
104090-32 = "뭔가 이 사건과 깊게 연관되었을 거라는 의혹을 받고 있는 <샬레>에서는,"
104090-33 = "선생님이 알몸으로 들판에서 뛰어다니는 걸 봤다는 사람이 있는데 사실인가? 라는 질문에 노코멘트로 일관하고 있습니다!"
104090-34 = "선생님이 극단적 자연주의자가 된 거라면 그럼 어째서 알몸에 태블릿 PC는 들고 있었는가? 라는 물음에 이것은 현대 문명과 자연의 공존을 주장하는 퍼포먼스라는 해석을 내놓은……."
104090-35 = "……네? 음모론을 확산시키지 말라고요? 무슨 소리예요! 이건 음모론이 아니라……."
104090-39 = "화면 상태가 고르지 못해 죄송합니다. 잠시만 기다려주세요."
104090-43 = "……요컨대, 이것은 밴드웨건 효과를 노린 고도의 음모인 겁니다! 더 이상 진실을 은폐하지 말고 떳떳하게 밝히십시오, <샬레>!!!"
104090-47 = "화면 상태가 고르지 못해 죄송합니다. 잠시만 기다려주세요."
104090-49 = "……그래서 총학생회는 생텀 타워를 다시 건설하는 프로젝트를 진행 중이며, 근시일 내에 완공된 타워를 공개하겠다고 발표했습니다."
104090-50 = "생텀 타워의 설계도대로 다시 제작하는 큰 프로젝트인데, 공정의 난이도 때문에 민간 건설 업체 <카이저 인더스트리>와 협력한다는 소문도 흘러나오고 있는데요."
104090-51 = "여기서 가장 큰 이득을 보는 것은 도시 재생과 재개발로 부동산 시장의 호황을 맞은 건설 업계의 큰손들이라는 해석이 있는 가운데……. 치솟는 물가와 금리로 고통받는……."
104090-58 = "……칫."
104090-59 = "……. 그래서 이렇게 되었군. 방위실장."
104090-60 = "너는 우리들의 도움이 없었다면 큰 곤욕을 치렀겠지."
104090-61 = "그건 당신들도 마찬가지 아닌가요? 제 도움이 없었다면 지금쯤 카이저는 파산 신청서에 사인하고 있었을 거예요."
104090-62 = "……좋아. 이걸로 우리들의 협력은 여전히 유지된다고 봐도 되겠지?"
104090-63 = "……. 제 등을 찌른 사람과 다시 손을 잡는다……."
104090-64 = "평범한 사람이었다면 절대 하지 못할 일이겠지만……."
104090-66 = "평범한 사람이 하지 못하는 것을 아무렇지도 않게 해버리는 자야말로 <초인>인 거죠."
104090-67 = "호오."
104090-68 = "초인은 그런 비루한 사람들과는 달라야 해요. ……그러니 앞으로도 잘 부탁드리죠. 제너럴."
104090-69 = "과연……. 큭큭큭……. 대단하군. 역시 프레지던트가 인정한 사람이야."
104090-70 = "진정한 어른이라면 대의를 위해 어제의 적과도 손을 잡을 수 있어야 하는 법."
104090-71 = "나는 사소한 감정 따위에 휘둘려 계획을 망치는 머저리들과는 다르지."
104090-72 = "좋아. 앞으로도 잘 부탁한다. 방위실장."
104090-74 = "……."
104090-75 = "……."
104090-79 = "아리스, 우리 왔어."
104090-80 = "응? 아리스 쨩, 뭐해?"
104090-81 = "프라모델 조립?"
104090-85 = "아뇨. 프라모델이 아니라……."
104090-90 = "응? 이게 뭐야? 로봇……?"
104090-91 = "……네. 이건 아마도 <케이>…… 인 것 같습니다."
104090-92 = "으, 으응?! 케이라고?"
104090-93 = "그 아이는…… 그때 분명 사라졌다고……."
104090-94 = "……네. 케이는 그때 사라졌고…… 그 이후 두 번 다시 만날 수 없었습니다."
104090-95 = "하지만 그때…… 케이가 사라질 때…… 잠깐이지만 이런 모양의 로봇을 본 것 같았습니다."
104090-97 = "그래서 그 기억이 사라지기 전에 이렇게 만들어 보고 있었던 겁니다."
104090-98 = "흐음……."
104090-99 = "아리스 쨩……."
104090-100 = "케이…… 결국 우리를 도와주었잖아? 어, 어쩌면…… 동료가 될 수 있었을지도 모르는데……."
104090-101 = "……네. 다음에 다시 볼 수 있다면…… 그때는 꼭 아리스의 동료가 되어 달라고 말하고 싶습니다."
104090-102 = "……."
104090-108 = "응? 온라인 대전 신청인가?"
104090-112 = "……응? 이거 뭐야?"
104090-113 = "왜 그래, 언니?"
104090-114 = "……메모리에 본 적 없는 세이브 파일이 생겼어."
104090-115 = "언니가 깜빡한 거 아냐?"
104090-116 = "무슨 소리야! 세이브 파일을 깜빡하겠어? 이건 처음 보는 타이틀이라고."
104090-117 = "어디……."
104090-123 = "어……, 이…… 이건……?"
104090-124 = "뭔데?"
104090-127 = "Kei.sav"
104090-129 = "세이브 데이터…… <Kei>……?"
104090-130 = "케, 케이 아냐? 케이라고 읽는 거지?"
104090-131 = "………!!!"
104090-133 = "빠, 빨리 히마리 선배한테 가보자!!"
104090-134 = "네!!"
104090-139 = "어서 오십시오. 게임개발부 여러분."
104090-140 = "안녕~"
104090-142 = "어? 너, 너는?! 네가 왜 여기 있어?!"
104090-143 = "C&C의……."
104090-144 = "리오 회장의……."
104090-145 = "……네. 아스마 토키입니다. 피스- 피스-"
104090-149 = "피, 피스-?!"
104090-150 = "으, 으응……?"
104090-151 = "히마리 부장이 이상한 걸 가르쳐 놨어……."
104090-152 = "이상한 게 아니라 캐릭터 강조입니다. 상대의 빈틈을 찌르는 전략입니다."
104090-153 = "뭐. 본인이 괜찮다면야 문제없겠지만……."
104090-154 = "리오 회장님은 여전히 은둔 중이어서 현재 저는 구직 중인 상태입니다."
104090-155 = "그래서 토키는 여기저기 기웃거리고 있어. 다음엔 C&C의 부실로 가려나?"
104090-156 = "……아뇨. 선배들도 계속 바쁘신지 그 이후 뵙지 못했습니다."
104090-157 = "이해했습니다. 실직 중이시군요. 괜찮다면 저희와 파티를 맺으시겠습니까?"
104090-159 = "뭐?!"
104090-160 = "아, 아리스……."
104090-164 = "제안해주셔서 감사합니다만…… 지금은 다른 임무가 있어서요."
104090-166 = "다음에 기회가 있으면 부디."
104090-172 = "어머? 아리스?"
104090-173 = "안녕하세요, 히마리 선배."
104090-174 = "봐줬으면 하는 게 있어서 왔어!"
104090-175 = "이걸……."
104090-179 = "게임기……?"
104090-181 = "……. 흐음. 과연."
104090-182 = "어떤 것 같아?"
104090-183 = "그, 그게 케이 쨩과 관계가 있나요……?"
104090-184 = "……."
104090-185 = "……. 그러네요. 저도 <이름 없는 신들>의 기술은 전문가 수준은 아니어서 확신할 순 없지만요."
104090-186 = "이런 데이터가 자연 발생했다면…… 그건 확실히 <초현상>이라고 불러야겠죠."
104090-187 = "하지만…… 이게 케이라고 해도 이 상태로는 증명할 수 있는 게 없어요."
104090-188 = "그, 그런가요……?"
104090-189 = "네. 이 데이터는 고작 2Kb 크기일 뿐이고…… 비트 단위까지 분석해 봐도 이게 무엇인지 지금의 저로서는 알 수 없어요."
104090-190 = "그쪽 방면의 전문가인 그 소심한 여자가 돌아오지 않는 이상……."
104090-191 = "……. 네. 그렇……군요. 아직은 아무것도 알 수 없는 것이군요."
104090-193 = "이게 케이였으면…… 좋겠습니다……. 그러면……. 그때는……."
104090-194 = "아리스……."
104090-195 = "아리스 쨩……."
104090-200 = "어머……, 그건……?"
104090-201 = "이건…… 제가 케이라고 생각하고 만든 것입니다."
104090-202 = "그렇군요……. 흐음. 잘 만들었네요, 아리스."
104090-203 = "……."
104090-204 = "이 로봇을 개조해 볼까요?"
104090-205 = "개조……입니까?"
104090-206 = "개조라고 해봤자 USB 메모리 기능을 추가할 뿐이지만요. 하지만 그거라면……."
104090-207 = "……. 아. 여기에다가 케이 쨩의 데이터를……."
104090-208 = "우, 우와? 천잰데? 그건 아리스가 케이를 생각하며 만든 거잖아! 거기에……."
104090-209 = "이 데이터를 넣어둔다면……."
104090-210 = "……!!"
104090-211 = "흐음. 제가 병약미소녀계통의 천재인 건 맞지만요. 그런다고 해서 뭔가 신기한 일이 생기거나 하진 않을 거고……."
104090-212 = "그냥, 그런 누군가의 소망을 담아두는 것뿐이지만요."
104090-214 = "……네!! 그래도 괜찮습니다!"
104090-215 = "후후. 그럼 맡겨두세요. 저는 개조가 특기거든요. 못하는 게 없는 천재니까요."
104090-216 = "특히 저쪽의 토키의 외골격도 제가 이리저리 개조해 두었거든요. 그 여자의 취향은 영 별로라서."
104090-220 = "어디…… 마침 메모리도 새로 사둔 게 있고…… 열쇠고리 기능도 추가해 드릴게요."
104090-223 = "자아. 완성이에요."
104090-224 = "……!!"
104090-225 = "감사합니다. 히마리 선배."
104090-226 = "잘됐다, 아리스."
104090-227 = "응, 아리스 쨩……. 다행이야."
104090-228 = "잊어버리지 않게 잘 가지고 다녀……."
104090-230 = "네!"
104090-235 = "다음화;에필로그 2"
