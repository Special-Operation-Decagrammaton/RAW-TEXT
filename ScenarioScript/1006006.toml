[translation]
1006006-1 = "라면과 온천의 상관관계"
1006006-2 = "(약속시간에 맞춰, 메구가 말해준 장소로 향했다.)"
1006006-3 = "(번화가로부터 꽤 떨어진, 으슥한 곳이었다.)"
1006006-7 = "와아-! 선생님~!! 여기야, 여기~~!!"
1006006-8 = "[s1] \"메구~!\"\n[s2] \"이런 곳에서 뭐 하고 있었던 거야?\""
1006006-11 = "응? 나? 뭐 하고 있었냐니?"
1006006-12 = "그냥 라면 끓이려고 준비하고 있었는데?"
1006006-13 = "굳이 여기까지 온 이유?"
1006006-14 = "음……."
1006006-15 = "딱히 깊이 생각해 본 적은 없어서."
1006006-16 = "그냥 라면 끓일 때에는, 늘 이렇게 한적한 곳에서 먹는 게 습관이라서 말이야."
1006006-17 = "방해하는 사람도 없고~ 뺏어 먹으려는 사람도 없고~ 왁자지껄 떠드는 사람도 없고~"
1006006-18 = "뭐어~ 잘은 모르겠지만, 뭔가 그런 느낌인 거지!"
1006006-19 = "굳이 말하자면……."
1006006-21 = "'라면 끓는 걸 보는 데에 집중할 수 있어서 좋다'……고 해야 하나?"
1006006-22 = "……응? 라면 보는 데에 집중한다는 게 무슨 뜻이냐고?"
1006006-26 = "어……."
1006006-27 = "……그러게? ……어라. 이걸 어떻게 설명해야 하지?"
1006006-28 = "[s3] \"라면 먹는 분위기가 좋은 거야?\"\n[s4] \"요리하는 느낌을 좋아하는 거야?\""
1006006-31 = "아니. 딱히 그런 건 아닌데?"
1006006-32 = "사실 요리 같은 건 할 줄도 모르는걸. 그러니까 봉지 라면 먹는 거기도 하고!"
1006006-33 = "단지 뭐랄까……. 끓고 있는 라면을 그냥 계속 보고 있다고 해야 하나……?"
1006006-34 = "보고 있으면……."
1006006-35 = "뭔가……. 온천 같기도 하고……?"
1006006-39 = "[ns5] \"온천 같다고? 라면이?\"\n[ns6] \"물이 끓고 있어서?\""
1006006-42 = "음. 잘은 모르겠어! 아무튼 그런 느낌?"
1006006-43 = "그치만 생각해 봐, 선생님."
1006006-44 = "아. 내가 선생님에게 '생각해 보라'고 말하는 건 좀 이상한가……."
1006006-45 = "……아무튼!"
1006006-46 = "떠올려 봐, 선생님! 라면이 끓는 그 모습을!!"
1006006-47 = "부글부글 끓고 있는 물에 담겨 있던, 처음에는 뻣뻣하게 굳어 있던 건더기들이 점점 늘어지는 모습……."
1006006-48 = "그리고 그 위로 모락모락 피어오르는 수증기와 따듯한 느낌까지……!"
1006006-49 = "그야말로 재료들의 온천탕이잖아! 그렇지? 내 말 맞지?"
1006006-50 = "보고 있으면 마음이 즐거워진다고~. 느긋하게 온천욕을 즐기며 풀어지는 건더기들의 모습!"
1006006-51 = "세상에서 제일 기분 좋고 편해 보이는 그런 느낌……!!"
1006006-52 = "……응?"
1006006-53 = "그렇게 따지면 다른 국이나 찌개들도 마찬가지 아니냐고?"
1006006-54 = "맞지, 맞지! 그것들도 다 좋아해! 근데 내가 만들 수 있는 건 라면뿐이니까!!"
1006006-55 = "그리고 보고 싶다고 느낄 때 가장 순식간에 만들 수 있으니까! 제일 빨리 볼 수 있으니까!"
1006006-56 = "그래서 라면이 좋아! ……응! 맞아! 그래서 좋아하는 것 같아!!"
1006006-57 = "[s7] \"신기한 관점이네.\"\n[s8] \"즐겁게 먹을 수 있는 발상이네.\""
1006006-60 = "후후후. 역시! 똑똑한 선생님이라면 알아줄 줄 알았다니까!"
1006006-61 = "그럼 그런 선생님을 위해서라도~. 지금 바로 라면을 끓이기 시작해야 하겠는걸!!"
1006006-62 = "조금만 기다려 줘, 선생님! 같이 라면 끓는 거 구경하자!!"
1006006-67 = "이리 와서 앉아! 내가 꼭 맛있게 끓여 줄게!!"
1006006-73 = "(이후 메구가 끓여준 라면을 나눠 먹었다.)"
1006006-78 = "(라면 자체는 평범한 기성품이었지만, 분위기 때문인지 굉장히 맛있었다.)"
1006006-81 = "흐아~! 잘 먹었다~~!!"
1006006-82 = "선생님은 어때? 아직 배고프려나? 더 끓여줄까?"
1006006-83 = "아. 더 끓일 필요까지는 없을 것 같다고?"
1006006-84 = "다행이네!"
1006006-85 = "마침 냄비 크기도 딱 맞았던 모양이야!"
1006006-89 = "흐아……. 기분 좋다……."
1006006-93 = "……아."
1006006-96 = "아직 남은 국 위에 햄이 떠 있네. 둥실둥실이다, 둥실둥실!!"
1006006-97 = "[ns9] \"둥실둥실 부러운 햄이네.\"\n[ns10] \"만사가 느긋해 보여. 좋겠다~.\""
1006006-101 = "하하하하!! 그게 뭐야? 선생님이 이상한 말 하고 있다! 설마 햄이 부러운 거야?"
1006006-102 = "뭐어, 그야 이런 따듯한 온천에 몸을 불리고 있으니 좋아 보이긴 하겠지만……."
1006006-103 = "그치만 선생님, 이 햄이 됐다간 내가……."
1006006-104 = "선생님을 잘 먹겠습니다~!!"
1006006-108 = "……해버릴 거라고. 후루룩~~! 하고 말이지. 아하하하!!"
1006006-109 = "후우……."
1006006-110 = "히히. 웃다가 다시 배 꺼지겠다."
1006006-111 = "그럼 이제 배도 다 찼겠다……."
1006006-116 = "영-차!!"
1006006-117 = "……다시 온천을 만들러 출발해 볼까!"
1006006-118 = "[ns11] \"엉!? 이 시간에……!?\"\n[ns12] \"지금 바로 출발하는 거야!?\""
1006006-121 = "후후. 당연하지!"
1006006-122 = "저녁 시간에는 라면 구경하고 싶어서 따로 나왔지만, 사실 작업이 한창이었다고. 아직 다 안 끝났는 걸."
1006006-123 = "다시 온천을 파고! 다른 사람들도 푹~ 담가서 늘어지게 만들어야 하지 않겠어?"
1006006-124 = "그것이 온천개발부니까!!"
1006006-125 = "그럼 선생님, 오늘은 와 줘서 고마웠어!! 다음에도 또 같이 먹자!!"
1006006-126 = "먼저 간다!!!"
1006006-135 = "[ns13] \"……근데 진짜 잘 끓였네, 이거.\"\n[ns14] 남은 국물을 후루룩 마셔서 해치운다."
1006006-141 = "(이후 뒷정리를 마친 후 샬레로, 돌아와 소파 위에 늘어져 잠들었다.)"
