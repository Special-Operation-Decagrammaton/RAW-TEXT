[translation]
1006102-1 = "오해받기 쉬운 사람"
1006102-5 = "(모모톡의 내용이 신경 쓰여, 일정이 비는 시간대를 찾아, 대성당을 찾아갔다.)"
1006102-9 = "(빈 시간대라 다른 사람들은 보이지 않았다. 저 멀리 기도하던 사쿠라코의 모습이 보였다.)"
1006102-10 = "…………."
1006102-11 = "[s1] 다가가서 기도가 끝나기를 기다린다.\n[s2] 옆에서 같이 기도를 올린다."
1006102-19 = "……?"
1006102-24 = "음……?"
1006102-29 = "으, 응? 서, 선생님!? 언제부터 여기에……."
1006102-30 = "[s3] \"방해가 됐다면 미안해.\"\n[s4] \"놀라게 할 의도는 없었는데…….\""
1006102-31 = "아, 아뇨. 괜찮습니다. 마침 기도도 다 끝난 참이어서……."
1006102-32 = "아, 아뇨. 괜찮습니다. 마침 기도도 다 끝난 참이어서……."
1006102-33 = "그나저나 어쩐 일이신지요?"
1006102-34 = "지금 시간은 딱히……."
1006102-35 = "……네?"
1006102-36 = "제가 불러서 찾아왔다고요?"
1006102-37 = "그게 무슨 말씀이신지……. 저는 그런 적이……."
1006102-38 = "모모톡……이요?"
1006102-42 = "[ns5] \"대화를 나눌 기회가 필요하대서…….\"\n[ns6] 모모톡의 내용을 보여준다."
1006102-46 = "아. 설마……."
1006102-50 = "아, 이건……."
1006102-51 = "으음. 그, 그러니까……. 그건 말이죠. 뭐랄까. 그게……."
1006102-52 = "정말 별 의미 없습니다만. 문자 그대로 안부 인사였을 뿐……."
1006102-53 = "……정말입니다만."
1006102-54 = "……하아."
1006102-55 = "아무래도 또 오해를 불러일으킨 모양이군요. 죄송합니다, 선생님."
1006102-56 = "[s7] \"괜찮아. 신경 쓰지 마.\"\n[s8] \"오해? ……또라니?\""
1006102-59 = "으음. 사실 저는 항상, 주변으로부터 오해를 좀 자주 받는 편이라……."
1006102-60 = "다들 저를 어려워한달까. 어째서인지 좀 어색해 한달까. 그런 게 좀 있어요."
1006102-61 = "아무래도 다른 자매님들을 관리하는 직책이다 보니, 거리감이 느껴지는 걸까요?"
1006102-62 = "나름대로 개선해 보고자 다른 자매님들께 조언도 받고 노력도 하고 있지만, 잘되지 않고 있답니다."
1006102-63 = "아, 물론 다들 좋은 분들이고 저의 이런 면을 이해하려 노력해 주고 계세요. 오히려 이런저런 조언도 주고 계시죠."
1006102-64 = "이번에 선생님께 보내드린 모모톡의 경우에도……. 다른 자매님께 받은 조언을 사용해 본 것이었는데 말이에요."
1006102-65 = "\"메시지를 보낼 때 앞뒤로 웃음소리를 붙이면 친근하게 느껴질 수 있어요\"라고……."
1006102-66 = "[s9] \"아하…….\"\n[s10] \"그래서 '후후후'가…….\""
1006102-69 = "사실 조금 걱정이랍니다. 제 개인적인 문제라면 별일이 아니겠지만, 이래 봬도 트리니티 대성당의 시스터 중 한 사람."
1006102-70 = "시스터인 몸으로서 다른 분들께 어려운 사람이 된다는 건 결코 바람직하지 못한 일이니까요."
1006102-71 = "선생님과 대화를 할 시간이 있었으면 좋겠다고 말씀드렸던 것도……. 실은 그런 것에 대한 상담을 포함한 이야기였지요."
1006102-76 = "으음. 쓸데없는 말이 길었군요. 그에 대한 이야기는 나중에 따로 하고 싶었는데."
1006102-77 = "아무튼 괜한 일로 심려를 끼쳐드리게 해서 죄송합니다, 선생님. 돌아가시는 길을 배웅해 드릴게요."
1006102-81 = "이쪽으로……."
1006102-87 = "트리니티 대성당 앞 공원"
1006102-88 = "저는 여기까지 배웅하겠습니다."
1006102-89 = "오늘 짧은 시간이었지만, 대화해서 즐거웠답니다."
1006102-90 = "……후후."
1006102-91 = "그럼 몸 조심히……."
1006102-99 = "앗, 사쿠라코 자매님이다. 사쿠라코 자매님!"
1006102-100 = "좋은 아침이에요. 오늘도 평안하신가요?"
1006102-102 = "어라. 자매님들……."
1006102-103 = "후후. 좋은 아침입니다."
1006102-104 = "자매님들도 오늘 하루 평안하시기를."
1006102-109 = "항상 지켜보고 있답니다. 여러분의 일거수일투족……."
1006102-115 = "모쪼록 좋은 하루 되시길……. 후후후."
1006102-119 = "히, 힉! 네, 네……!"
1006102-120 = "그, 그럼 좋은 하루 되세요……!! 저흰 이만……!"
1006102-125 = "어라……. 갑자기 그렇게 빠른 걸음으로 가시면 다치시는데……."
1006102-129 = "[ns11] \"거기서 '후후후'라…….\"\n[ns12] \"과연, 이런 식이구나…….\""
1006102-132 = "……음? 선생님? 무슨 말씀하셨나요?"
1006102-133 = "아아. 별말씀 안 하셨다고요."
1006102-134 = "네, 알겠습니다."
1006102-135 = "그럼 전 먼저 이만."
1006102-140 = "(이후 베일을 흩날리며 돌아가는 사쿠라코의 뒷모습을 바라본 후, 샬레로 돌아왔다.)"
