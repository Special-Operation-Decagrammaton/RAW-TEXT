[translation]
10048110-1 = "에필로그;한 마디의 단서"
10048110-2 = "디저트 카페"
10048110-5 = "으으음……!"
10048110-6 = "맛있어……!"
10048110-7 = "흐으으음……!"
10048110-8 = "[s] \"후후, 역시 가게에 직접 와서 먹는 게 더 맛있지?\""
10048110-9 = "예, 확실히 저번에 선생님이 포장해 오셔서 먹었을 때보다 이렇게 가게로 와서 먹으니까 훨씬 더 맛있네요……!"
10048110-10 = "맛도 단순하지 않고 굉장히 중층적이에요."
10048110-11 = "당도가 꽤나 높은데도 전혀 부담스럽지 않고……."
10048110-12 = "부장님, 이런 맛을 저희만 즐기는 것은 너무 이기적인 처사 아니겠습니까?"
10048110-13 = "와일드헌트 안의 불쌍한 아이들에게도 이 맛을 즐길 권리가 있어요."
10048110-14 = "그러니까 이 아이템도 한 번 교역 품목으로 고려해 보시죠?"
10048110-15 = "……어떻게 이런 순간에도 밀수를 떠올리는 거죠."
10048110-16 = "[s] \"과연 타고난 영업 실장님…….\""
10048110-17 = "그런데 미요 쨩, 선생님이랑 같이 다니면 이렇게 자유롭게 학원 밖으로도 나올 수 있는 거야?"
10048110-18 = "예. 선생님께서 신원 보증을 해주시는 거니까…… 사감대에서도 막지 못해요."
10048110-19 = "그래서 샬레로 당번 가는 학생들이 나가는 것도 막지 않는 거고요."
10048110-20 = "그, 그런 의미에서, 감사합니다, 선생님."
10048110-21 = "저희 때문에 고생하셨는데, 이렇게 데리고 나와서 맛있는 디저트까지 사 주시고……."
10048110-22 = "[s1] \"고생했으니, 당분을 챙기는 게 맞지.\"\n[s2] \"당분은 많은 것을 해결해 준다고!\""
10048110-25 = "고생……."
10048110-26 = "근데 고생과 별개로, 이번 작전의 총수익은 0엔이 되어 버렸군."
10048110-27 = "0엔은 무슨, 마이너스죠. 우리 인건비랑 연막탄 비용은 생각 안 하나요?"
10048110-28 = "큿……."
10048110-29 = "나 그래도 재미있었어! 미요 쨩이 마지막에 괴도 쨩이랑 협상한 것도 멋있었고!"
10048110-30 = "머…… 멋있긴 무…… 무슨……."
10048110-31 = "그런데 나 솔직히 좀 놀랐어."
10048110-32 = "의뢰인을 속이라는 말이 네 입에서 나오다니."
10048110-33 = "의뢰인이 우리를 먼저 속였잖아요."
10048110-34 = "그러면 당연히 우리도 되갚아 줘야죠."
10048110-35 = "크으~."
10048110-36 = "눈에는 눈, 이에는 이!"
10048110-37 = "거 봐, 넌 역시 이런 일에 재능이 있다니까?"
10048110-38 = "시, 시끄러워요……!"
10048110-40 = "근데 미요 쨩, 어떻게 사람들이 진품 앞에 더 많이 모여들 거라고 확신한 거야?"
10048110-41 = "리츠 쨩 덕분이에요."
10048110-42 = "엥? 나?"
10048110-43 = "<누가 자줏빛과 푸른빛을 귀여워하랴>의 위작을 처음 봤을 때, 리츠 쨩은 뭐라고 말했었죠?"
10048110-44 = "어……."
10048110-46 = "오……."
10048110-47 = "예쁘네."
10048110-49 = "리츠 쨩은 그 그림을 보고 무심코 '예쁘다.'라고 말했어요."
10048110-50 = "예쁘다, 라는 것은 보통 액세서리나 장식물 등을 수식하는 표현……."
10048110-51 = "위대한 작품의 실물을 본 것에 대한 감상으로는, 적절치 않아요."
10048110-52 = "……즉 리츠 쨩은, 무의식적으로 그 그림이 위작이라는 것을 알아차렸던 것이죠."
10048110-53 = "……!"
10048110-54 = "그런가?!"
10048110-55 = "그래서 생각했어요. 어쩌면 다른 사람들에게도…… 무의식적으로 진품과 위작을 구별할 능력이 있지 않을까, 라고."
10048110-56 = "거기다 위작을 단독으로 걸어 놓는 게 아니라 진품과 함께 걸어 놓으면……"
10048110-57 = "둘 사이의 대비에서 오는 차이점을 발견하기도 훨씬 용이해질 것이다, 라고도 생각했고요."
10048110-58 = "맛없는 음식은 맛있는 음식과 함께 먹을 때 더 맛없게 느껴지는 것처럼 말이에요."
10048110-59 = "그래서 두 그림을 같이 걸어놓자고 제안한 거예요."
10048110-60 = "리츠 쨩이 무심코 던진 한마디로부터 거기까지 발상을 끌고 가다니……."
10048110-61 = "역시 문학도들은 변태 같은 면이 있어."
10048110-62 = "결론이 왜 그렇게 가는데요?!"
10048110-63 = "뭐 아무튼, 결말은 나쁘지 않게 났지만……."
10048110-64 = "……결과적으로는 고생은 고생대로 하고 의뢰비는 받지도 못한 셈이 됐네요."
10048110-65 = "후으으…… 내 큐티베리 87이……."
10048110-66 = "의뢰비만 받았으면 지금쯤 내 책상 위에 놓여 있을 텐데……."
10048110-67 = "괜찮아, 미요."
10048110-68 = "그거 아직 매물 남아 있더라."
10048110-69 = "……솔직히 누가 그런 물건을 사갈까 생각해 보면 당연한 일이긴 하지만."
10048110-70 = "뭐……?!"
10048110-71 = "나의 큐티베리 87을 모욕하지 마세요……!"
10048110-72 = "세상 사람들이 아직 타자기의 미학을 이해하지 못해서 그래요!"
10048110-73 = "언젠가…… 언젠가 사람들이 그 아름다움을 이해할 날이 오면!"
10048110-74 = "지금 사지 않은 걸 다들 후회하게 될걸요?!"
10048110-78 = "[ns] \"……저거랑 비슷한 말을 하는 사람을 얼마 전에 본 것 같은데.\""
10048110-79 = "나도 나도! 왠지 본 것 같아!"
10048110-80 = "그러니까 당장 다음 밀수 일감 가져오세요!"
10048110-81 = "난 어떻게든 큐티베리 87은 손에 넣어야겠어!"
10048110-82 = "그리고 그 뒤에 특수교역부를 해체……."
10048110-83 = "어허, 씁, 리츠 듣는다."
10048110-84 = "응? 무슨 얘기야?"
10048110-86 = "(그렇게, 특수교역부의 일상은 다시 굴러간다.)"
10048110-87 = "누구를 위한 예술인가 ~위작과 미학의 행방~"
