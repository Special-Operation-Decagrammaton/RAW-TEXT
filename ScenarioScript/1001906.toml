[translation]
1001906-1 = "사격"
1001906-2 = "이쪽이야, 선생님. 잘 찾아 왔네."
1001906-3 = "[s] \"……여기는?\""
1001906-4 = "응. 사격장이야. 보다시피."
1001906-5 = "그리고 아까 보낸 숫자는……"
1001906-11 = "(아즈사는 종이 몇 장을 꺼내어 보여주었다.)"
1001906-12 = "(과녁판이 인쇄된 종이였고, 총알 구멍들이 보였다.)"
1001906-13 = "[s1] \"점수 체크였구나.\"\n[s2] \"굉장한 솜씨잖아.\""
1001906-14 = "훗."
1001906-15 = "훗."
1001906-16 = "이런 걸로 칭찬해줘도 기쁘지 않아. 내겐 당연한 거니까."
1001906-17 = "……응? 왜 이런 데에서 혼자 사격 연습 같은 걸 하고 있냐고?"
1001906-18 = "우문이네, 선생님. 비록 내가 이곳 생활에 적응하기로 선생님과 약속했다지만 그것과 이것은 별개라고."
1001906-19 = "대비가 돼 있지 않은 평화는 언제나 무너지게 마련이니까. 이것만큼은 양보할 수 없어."
1001906-20 = "게다가……."
1001906-21 = "여기는…… 이렇게 좋은 시설들이 많아서 훈련하기 좋으니까."
1001906-22 = "훗. 예전엔 노천의 철다리 아래에서 사격 연습을 했는데 말이지."
1001906-23 = "……그나저나 여기는 다들 연습을 안하나 보군. 사람이 거의 없잖아."
1001906-24 = "타락해 있어. 다들 평안함에 빠져 타락해 있다고."
1001906-25 = "쓸데없는 말이 길었네. 난 하던 세트를 마무리 지을 테니, 조금만 기다려줘. 선생님."
1001906-30 = "(곧바로 다음 과녁이 자리로 이동해서 멈춰 섰다.)"
1001906-32 = "(사로로 다가선 아즈사는, 천천히 호흡을 가다듬은 후 방아쇠를 당겼다.)"
1001906-41 = "(……)"
1001906-45 = "……끝."
1001906-46 = "응. 이걸로 오늘 정해 둔 세트는 끝났어. 돌아가자, 선생님."
1001906-47 = "[s3] \"이렇게 곧바로?\"\n[s4] \"있고 싶으면 좀 더 있어도 되는데.\""
1001906-48 = "응?"
1001906-49 = "응?"
1001906-50 = "무슨 말을 하는 거야. 있고 싶다니, 전혀 그렇지 않아."
1001906-51 = "물론 여기는 마음이 편해지는 곳이지만……"
1001906-52 = "……지금은……"
1001906-53 = "……이제는 여기만 그런 건 아니니까."
1001906-54 = "여기보다, 전에 선생님과 같이 갔던 곳들이 더 즐거웠으니까."
1001906-55 = "……응."
1001906-56 = "그냥 그렇다는 이야기야."
1001906-57 = "어서 나가자, 선생님."
1001906-59 = "(이후 아즈사와 함께 사격장을 빠져나와, 곧바로 근처의 모모프렌즈 카페를 들렀다.)"
