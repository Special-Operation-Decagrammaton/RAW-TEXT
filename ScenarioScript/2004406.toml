[translation]
2004406-1 = "화제의 인물"
2004406-3 = "도대체 무슨 일이신가요, 트레이너?"
2004406-4 = "표정이 심상치 않아 보이십니다. 뭔가 마실 것이라도 드릴까요?"
2004406-5 = "물과 이온 음료, 단백질 드링크가 준비되어 있습니다."
2004406-6 = "[s1] \"그, 그런 것보다도, 스미레!\"\n[s2] \"지금 인터넷 전부가 스미레로 엄청 화제야!\""
2004406-9 = "네. 그 말씀은 이미 모모톡으로 들은 바 있습니다만……."
2004406-10 = "그게 도대체 무슨 의미이신가요?"
2004406-11 = "(그때, 트레이닝 센터의 화면으로부터 뉴스가 흘러나오기 시작했다!)"
2004406-16 = "다음 뉴스입니다! 이번에는 일상의 단신을 소개 드리는 코너인데요."
2004406-17 = "얼마 전 키보토스의 스타디움에서 있었던, 한 드링크 아르바이트생의 모습이 지금 엄청난 화제가 되고 있다고 하네요!"
2004406-18 = "아시는 분은 아시겠지만, 드링크 아르바이트는 보통 드링크 장비의 무게 때문에."
2004406-19 = "경기가 진행될수록 아르바이트생들이 자연스레 지치는 일이 발생하곤 하죠."
2004406-23 = "아르바이트생들은 물론 언제나 최선을 다하려고 하지만. 어쩔 수 없이 피로와 탈진의 기색이 역력하게 드러날 수밖에 없기도 하고요."
2004406-24 = "그래서 경기 중후반부터는. 관중들 역시 섣불리 아르바이트생에게 음료수를 요청하기 어려워하게 되는 일이 보통인데요……."
2004406-25 = "그런데 세상에! 이 아르바이트생은 달랐다고 합니다! 끝까지 생기와 활력이 넘치는 모습으로 모두에게 음료수를 제공하였으며."
2004406-26 = "처음부터 마지막까지 웃음과 생기, 친절함 및 서비스를 잊지 않아 그날 스타디움의 전설이 되었다고도 하네요. 자료 화면 보시겠습니다!"
2004406-32 = "그래서 그 아르바이트생이 언제 다시 오는 것이냐는 일부 관객들의 문의가 지금 엄청나게 빗발치고 있다고 합니다!"
2004406-33 = "게다가 그 아르바이트생과 찍은 사진은 이미 인터넷 여기저기에서 큰 화제가 되고 있고요."
2004406-34 = "이 정도면 그야말로 새로운 스타의 탄생이라고도 볼 수 있지 않을까요?"
2004406-35 = "마지막으로, 저희 크로노스 스쿨은 언제나 개개인의 프라이버시를 중요시하기에."
2004406-36 = "그 아르바이트생의 신상 정보를 밝히거나 특정하지 않겠지만!"
2004406-37 = "모종의 정보통에 따르면, 그 학생은 밀레니엄 사이언스 스쿨 출신이라는 것만은 전해드릴 수 있을 것 같습니다!"
2004406-42 = "트레이너."
2004406-43 = "[s] \"으, 응……?\""
2004406-44 = "지금 혹시, 제 이야기였나요?"
2004406-45 = "[s] \"맞아…….\""
2004406-46 = "지금 말 그대로 여기저기에서 전부 그 이야기뿐이고……."
2004406-47 = "트레이너께서도 얼마 전에 안 것이지만, 저의 팬 카페까지 생겨나 있다고요……?"
2004406-48 = "……."
2004406-49 = "이것 참, 모두들 엄청난 오해를 하고 있는 것 같습니다."
2004406-50 = "저는 드링크 아르바이트생이 아니라, 정진 정명한 밀레니엄 트레이닝 클럽의 리더인데 말이지요."
2004406-56 = "음? 뭔가 연락이 왔군요. 이것은……."
2004406-57 = "[s] \"음료 회사로부터의…… 회의 초대장?\""
2004406-58 = "길고 형식적인 인사말은 넘어가도록 하죠. 본문을 요약하자면……."
2004406-59 = "저희의 신규 스포츠 드링크 제작 아이디어 회의에, 외부 인사로서 참석해 줄 수 있겠냐는 제안…… 인가요?"
2004406-60 = "그것도 회사의 임원들까지 모이는 제법 큰 회의이기에, 가능하다면 꼭 참여해서 고견을 들려주셨으면 한다……?"
2004406-61 = "[s] \"어, 어떡하지? 어떻게 할 거야, 스미레?!\""
2004406-62 = "……."
2004406-63 = "우선, 트레이너. 이 정도로 정중한 초대를 보내 주셨는데, 사양하는 것은 모두에게 실례일 것 같습니다."
2004406-64 = "그리고 드링크에 관한 것이라면, 마침 잘 되었다고도 볼 수 있겠습니다만."
2004406-65 = "저 역시 평소에 건의하고 싶었던 것이 있었으니까요!"
2004406-66 = "[s] \"정말이야?\""
2004406-67 = "그렇습니다. 트레이너."
2004406-68 = "어쩌면 이 초대야말로, 초대를 보내 주신 분들의 말씀처럼……."
2004406-69 = "이른바, 현장의 목소리를 전하기에 딱 좋은 기회일지도 모르겠습니다."
2004406-70 = "그러면 트레이너! 결정되었으면 지체하지 말고, 행동하도록 하지요!"
2004406-72 = "(뭔가 엄청나게 자신만만한 스미레의 태도에, 약간의 불안함이 엄습하기도 했지만.)"
2004406-73 = "(그래도 스미레를 믿고, 한 명의 학생을 믿으며, 회의에 참석해 보기로 했다.)"
2004406-79 = "이렇게 바쁘신 와중에도 시간을 내어, 이 자리에 참여해 주신 모든 분들께 진심으로 감사의 말씀을 드립니다."
2004406-80 = "특히 이번 회의에는, 여러 임원 분들은 물론이거니와……."
2004406-81 = "현장의 목소리를 듣기 위해, 최근 인터넷에서 화제의 인물로 등극한, 오토하나 스미레 씨를 외부 인사로 모셨습니다!"
2004406-85 = "안녕하십니까. 방금 소개받은 스미레입니다. 오늘은 잘 부탁드리겠습니다."
2004406-92 = "그러면 신속하게 회의를 시작하도록 하겠습니다!"
2004406-94 = "우선 저희가 준비한 드링크 시안을 3가지 소개해 드리겠습니다."
2004406-98 = "먼저, 카페인 함량을 높인 스포츠 드링크입니다!"
2004406-99 = "카페인은 스포츠 활동을 할 때 부스터 역할을 해 주기도 하죠. 이 점을 어필 포인트로 삼아 홍보 전략으로 삼자는 것입니다!"
2004406-100 = "확실히, 운동 전에 카페인을 섭취하면, 혈액순환을 활성화해 전체적인 운동 능력이 약 3~5% 정도 향상된다고 하죠."
2004406-101 = "거기에 코르티솔 분비를 도와, 몸의 지방을 한층 빠르게 분해하여 에너지로 전환해 주기도 하고요."
2004406-102 = "이것은 상당히 좋은 접근이라고 생각합니다. 트레이너."
2004406-103 = "[s] \"그, 그래…….\""
2004406-107 = "다음으로는, 키보토스 각지의 14가지 과일과 채소 원액을 섞은 스포츠 드링크입니다."
2004406-108 = "과일과 채소 원액을 섞었으니 건강에 보다 좋을 것 같다는 느낌을 줄 수 있으며, 이 점을 홍보 전략으로 삼을 수 있겠지요!"
2004406-109 = "으음, 과일과 채소를 사용했다고 하여, 건강에 좋을 것이라고는 속단하기 어려울 텐데요."
2004406-110 = "중요한 것은 과일과 채소에 함유되어 있는 식이섬유니까요. 오히려 과일의 경우에는, 품종에 따라 과당이 지나치게 함유되어 있어."
2004406-111 = "건강에는 그렇게까지 좋은 영향을 미치지 못하는 경우도 제법 있습니다."
2004406-112 = "운동 전 부스터로, 바나나나 사과를 먹는 정도라면 괜찮겠지만요……."
2004406-117 = "마지막으로는 기존 저희 회사가 생산하던 스포츠 드링크에서, 액상과당 성분을 인공감미료로 대체하여 칼로리를 대폭 낮춘 제품을 생산하자는 방안입니다!"
2004406-118 = "액상과당에 대한 여론이 바뀌면서, 기존 저희 스포츠 드링크의 판매량이 유의미한 수치로 떨어졌는데요."
2004406-119 = "이 부분을 만회하면서도 기존 생산 설비를 활용할 수 있고, 브랜드 이미지 개선까지 노릴 수 있는 전략이기도 합니다."
2004406-120 = "확실히 액상과당은, 요즘 도는 소문만큼이나 유해 물질, 혹은 독소 취급 받을 만큼의 물질은 아닙니다만……."
2004406-121 = "동시에, 몸에 부담을 끼치는 요소가 없다고도 할 수는 없는 물질이기도 하죠."
2004406-122 = "액상과당의 근본적인 문제는, 단시간에 많은 당분을 섭취하게 되어."
2004406-123 = "고혈당증과 같은 질병의 원인이 되는 데다, 췌장에 무리를 준다는 데에 있으니까요."
2004406-124 = "그런 점에서 이 전략은 상당 부분 유의미하게 들립니다."
2004406-126 = "으음, 어느 쪽이 좋을까요. 저로서는 셋 다 나름대로 의미 있는 부분이 있어 보입니다만……."
2004406-127 = "역시 기존 설비를 활용할 수 있는, 3안이 좋지 않을까요?"
2004406-128 = "하지만 우리 브랜드의 이미지 개선이 필요한 시점이기도 합니다. 여기에서는 건강 홍보 전략을 가장 넓게 사용할 수 있는 2안 쪽이……."
2004406-129 = "자, 자. 우리들끼리 이야기를 나누는 것도 좋지만, 마침 여기에 귀한 분을 모셨지 않습니까?"
2004406-130 = "그렇군요! 외부 인사의 의견 역시 중요하겠지요."
2004406-131 = "아무래도 임원 생활을 하다 보면, 현장의 목소리에는 본의 아니게 멀어질 가능성이 있으니 말이지요. 말씀 부탁합니다."
2004406-135 = "저에게 발언 기회를 주셔서 감사합니다. 모두 좋은 방안들이었다고 생각합니다."
2004406-136 = "그렇지만, 여기에서 저의 의견을 말씀드리자면, 이 시점에서 새롭게 출시해야 할 것은……."
2004406-137 = "바로, 부드러운 단백질 음료입니다!"
2004406-138 = "[s] \"스미레–!!!\""
2004406-139 = "스, 스미레 씨?! 저희는 스포츠음료 회사인데요!?"
2004406-140 = "바로 그렇기 때문입니다!"
2004406-141 = "어째서인가요!!??"
2004406-142 = "여기에서 우리는 스포츠음료의 본질이 무엇인지에 대해 생각해 볼 필요가 있습니다. 그건 바로 스포츠에 도움이 되는 음료여야 한다는 것이죠!"
2004406-143 = "그리고 트레이닝을 하다 보면, 일일 권장 섭취 단백질을 만족시키기가 의외로 어렵다는 것을 알 수 있게 됩니다!"
2004406-144 = "그래서 다양한 음식과 보충제를 섭취하고는 합니다만……."
2004406-145 = "결국 중요한 것은, 단백질이라는 영양소 성분에, 보다 손쉽게 접근할 수 있는 길이 열려야 한다는 것입니다!"
2004406-146 = "그러나 기존의 단백질 음료들은, 지나치게 텁텁하고 약간의 비린 맛이 느껴진다는 평가가 많았기에, 보다 많은 사람들에게 다가가기 어려웠죠."
2004406-147 = "그렇기에 지금이야말로, 단백질 음료에도 새로운 한 걸음이 필요한 때일 것입니다! 현장에서는 오히려 이것이 대세입니다!"
2004406-148 = "저는 그렇게 굳게 믿어 의심치 않으니까요!"
2004406-153 = "단, 단백질 음료라니. 이것은 또 전혀 상상도 못 했던 발상……!"
2004406-154 = "너무 뜻밖이라, 뭐라고 판단을 내리기 어렵군요. 잠깐 생각할 시간을……."
2004406-155 = "확실히 신선하다면 신선하고, 새롭다면 새로운 의견입니다. 이것이 현장의 목소리라는 것일까요……!"
2004406-156 = "잠시만요, 잠깐만 기다려 주세요!"
2004406-157 = "저희는 스포츠음료 회사이기는 하지만, 궁극적으로는 스포츠 경기를 관람하는 관객의 갈증을 빠르게 해소시키는 것이 목적이기도 합니다!"
2004406-158 = "무엇보다 그편이 시장 크기는 더 크니까요!"
2004406-159 = "그거야말로 하나만 알고 둘은 모르는 이야기입니다!"
2004406-160 = "뭐, 뭐라고요?!"
2004406-161 = "애초에, 관중들이 스포츠를 보는 이유는 무엇일까요?"
2004406-162 = "물론 대리 만족과 스트레스 해소도 있겠지만, 마음 한 켠 구석에서는 자기 역시 그렇게 되고 싶다는 욕구 역시 존재하기 때문입니다."
2004406-163 = "무엇보다, 다시, 저 자신이 그렇게 굳게 믿으니까요!"
2004406-164 = "그리고 그런 욕구를 가진 사람은…… 언젠가 반드시, 트레이닝에 발을 들이게 될 것이고요!"
2004406-166 = "그, 근거는 있는 말씀이십니까……?"
2004406-167 = "또다시, 제가 그렇게 될 것이라고 믿고 있습니다!"
2004406-168 = "그리고 우리들은 그런 사람들을 위해서, 나아가 [ruby=트레이닝]사람들의 미래[/ruby]를 위해서, 앞서 길을 닦아야 할 의무가 있는 것입니다!"
2004406-173 = "사람들의 미래를 위해, 앞서 길을 닦아야 한다……."
2004406-174 = "가슴이 뜨거워지는 말이었습니다. 이거 반성하게 되는군요."
2004406-175 = "잊고 있었던, 신입 사원 시기의 열정이 순간 떠올랐습니다. 그래요, 그걸 위해서 저는 이 회사에 들어왔었죠……."
2004406-176 = "……."
2004406-177 = "(이 회의는…… 망했어!)"
2004406-181 = "그러면 의견을 정리하도록 할까요. 새로운 스포츠 단백질 드링크를 개발하기로 한다……. 으음. 참으로 좋은 울림입니다."
2004406-182 = "대중적인 접근성을 위해 초콜릿 맛, 딸기 맛, 바나나 맛의 3종을 출시하고, 시장의 반응을 지켜보는 것이로군요."
2004406-183 = "귀중한 의견을 주셔서 감사합니다. 스미레 씨. 덕분에 큰 도움을 받았습니다. 하하하."
2004406-184 = "별말씀을요. 이런 자리를 마련해 주신 것에, 저야말로 감사의 말씀을 드려야 할 것 같습니다."
2004406-188 = "(하아…… 회의록이나 잘 남겨 놔야지…….)"
2004406-190 = "(그렇게 스미레의 새 드링크가 출시되었고.)"
