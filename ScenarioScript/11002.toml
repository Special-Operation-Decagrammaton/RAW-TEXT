11002-11 = "………. 어라라. 총학생회가 직접오진 않았군요. 후후, 뭐. 상관없어요."
11002-12 = "저 건물에 뭐가 있는진 모르겠지만 총학생회가 중요하게 여기는 물건이라면……. #n부숴버리지 않으면 견딜 수가 없어서……."
11002-13 = "아아…… 모처럼 기대가 되네요. 우후후후♡"
