[translation]
11002-4 = "샬레의 동아리 실은 이제 눈 앞이야!"
11002-5 = "지금 이 소요를 일으킨 학생을 알아냈습니다."
11002-7 = "와카모. 백귀야행 연합 학원에서 정학 당한 뒤, 교정국에 있다가 탈옥한 학생입니다."
