[translation]
211120-1 = "제12화;고충해결사"
211120-2 = "게헨나재흥위원회"
211120-3 = "그럼……"
211120-7 = "28차 <게헨나를 다시 위대하게 만들기 위한 회의>! 시작합니다~!"
211120-8 = "[s] \"와아~\""
211120-9 = "벌써 28차야? 그동안 우리 뭔가 많이 하긴 했네."
211120-10 = "대부분은 잡담이었지만요."
211120-11 = "속기 후의 보람이라는 가치는 이번 생에서는 얻지 못할지도 모르겠군요."
211120-15 = "아앗, 쇼코 쨩! 그 간식 지금 두 봉지째잖아? 나 아직 하나도 못 먹었다고!"
211120-16 = "제가 다 먹을 겁니다. 서기의 권한입니다."
211120-17 = "언제는 힘없고 치이기만 하는 게 서기라며?"
211120-18 = "간식 집행에 있어서는 무적이죠. 바위를 부수는 가위나 마찬가지랄까요."
211120-19 = "어디 정말 부서지나 해볼까?"
211120-24 = "자, 자! 주목!"
211120-26 = "네~ 주목~~"
211120-27 = "우옥."
211120-28 = "삼키고 말해, 삼키고."
211120-30 = "회장으로서 내가 가져온 오늘의 안건은……"
211120-31 = "'우리가 나아가야 할 길'이야!"
211120-32 = "항상 그랬던 것처럼 꽤나 거창하네요."
211120-33 = "그래! 우리는 거창해서 문제거든."
211120-37 = "우리 활동은 어쨌든 순항하고 있다고 볼 수 있어."
211120-38 = "꽤 많은 학생들이 재흥위원회의 존재를 알고 있고, 우리 프로젝트에 참여하고 있지."
211120-39 = "그럼 다들 잘하고 있는 거네."
211120-40 = "물론 좋은 일이지."
211120-41 = "하지만 나, 문득 이런 생각이 들었어. 정말 그걸로 되는 걸까?"
211120-42 = "흔한 블랙기업 사장 같은 대사가 나왔군요."
211120-43 = "여태까지 우리가 해온 것들은 게헨나를 근본적으로 바꾸기 위한 큰 그림이었는데……"
211120-44 = "사실 중요한 건 사소한 부분에 있지 않을까?"
211120-45 = "사소한 부분이라면?"
211120-46 = "그러니까…… 예를 들면 이런 거지!"
211120-47 = "우리 또래의 학생들은 이런저런 고민이 많잖아? 감수성도 섬세하고 말야. 선생님처럼."
211120-48 = "[s] \"저요?\""
211120-49 = "그래! 하지만 게헨나에는 딱히 그런 고민을 해소해 줄 만한 시설도 조직도 없지."
211120-50 = "만마전이야 당연히 그런 건 신경도 안 쓰고, 선도부도 그저 치안 조직이라 애초에 기대할 수 없는 역할이고."
211120-51 = "그럼 이때 누가 나서야 할까?"
211120-52 = "바로!! 우리!!"
211120-54 = "그러니까……"
211120-55 = "우리가 학생들의 고민을 해결해 주자고?"
211120-56 = "고충해결부서 역할을 하자는 거군요."
211120-58 = "그래! 엄청 사소해 보일 수 있지만, 위대한 게헨나는 그런 사소한 것에서부터 시작할 수 있다는 걸 보여주는 거지! 어때?"
211120-60 = "나쁘지 않은 접근입니다. 거대한 질서는 결국 아주 사소한 규칙들의 총합이니까요.#n통제 가능한 작은 단위부터 관리하는 것은 효율적인 행정의 기본이죠."
211120-61 = "나는 좋아. 뭐든 해볼 만하지 않겠어?"
211120-63 = "선생님이야말로 이런 거 전문이겠지만, 이번에는 가만히 있으라고! 우리 실력을 보여줄 테니까!"
211120-64 = "[s] \"그럼 나는 어째서 여기에…….\""
211120-65 = "응원이야! 우리를 지켜보면서 응원해 줘!"
211120-67 = "말하자면 토템입니다."
211120-68 = "존재만으로 도움이 된다, 뭐 그런 소리지! 야핫!"
211120-72 = "최근의 고민……?"
211120-74 = "응! 뭔가 힘든 일이 있다거나, 학교에 불만이 있다거나."
211120-75 = "뭔가 괜시리 마음이 싱숭생숭하다거나 하는 것도 괜찮아! 우리 상담도 하거든!"
211120-77 = "딱히 그런 건 없는데?"
211120-78 = "아냐! 잘 생각해 봐! 뭔가 있을 거야! 스트레스 받는 거 말이지!"
211120-79 = "어…… 지금 이런 상황……?"
211120-80 = "아아, 그래…… 별일 없으면 다행이야."
211120-81 = "그, 그래. 그럼 난 가볼게."
211120-85 = "아까부터 꽤 많은 사람한테 물어봤는데, 다들 고민이랄 게 없네."
211120-87 = "뭐, 어떻게 보면 이게 게헨나다운 걸지도 모르지."
211120-88 = "최근 우리의 활동으로 학생들의 스트레스 지수가 감소한 것도 이유가 될 수 있겠습니다."
211120-90 = "크읏, 우리가 해냈던 일들이 이제 와서는 우리의 발목을 잡고 있는 건가!"
211120-92 = "아니, 무슨 소리야. 회장. 고민이 없으면 좋은 거잖아."
211120-93 = "지금 회장은 학생들의 고충을 해결해야 한다는 스스로의 목적에 매몰되어 사리 분별을 제대로 하지 못하는 지경에 이르렀군요. 가엾고 딱합니다."
211120-95 = "아, 당 떨어져. 쇼코, 과자 좀."
211120-96 = "이거밖에 없어서 안 됩니다."
211120-97 = "이따 두 배로 갚을게."
211120-102 = "뭘 그렇게 고민해?! 나한테 주는 게 그렇게 아까워?"
211120-108 = "그치만, 저도 지금 먹고 싶고!!"
211120-109 = "하지만 잘 생각해 보면 지금의 고통은 두 배의 기쁨으로 돌아올 테니까……"
211120-113 = "아, 이거 그거 같네요. 마쉬멜로우 실험."
211120-114 = "과연…… 납득했습니다. 회장에게 드리도록 하지요."
211120-122 = "음……."
211120-123 = "안 갚아야겠다."
211120-131 = "어, 혹시 고민 상담 끝났어? 내가 늦게 왔나?"
211120-136 = "아이! 인행 훙히햐!"
211120-137 = "[s] \"먹고 말해, 먹고!\""
211120-138 = "갚는다고 했잖아요! 두 배로!"
211120-140 = "아, 정신 사나워."
211120-141 = "아무튼 상담 아직 받고 있는데. 무슨 일 있어?"
211120-142 = "어, 잘됐네."
211120-143 = "음…… 뭔가 우리 반에서 이상한 소리를 들었다는 애들이 있거든?"
211120-144 = "어? 무슨 소리?"
211120-145 = "좀 으스스한 얘기야……."
211120-152 = "으아, 잠든 사이에 수업 끝났네. 다들 어디 간 거야?"
211120-153 = "어우. 나도 가방 챙겨서 얼른 나가야지……."
211120-159 = "……제."
211120-164 = "……."
211120-165 = "뭐지? 잘못 들었나?"
211120-170 = "……서."
211120-174 = "뭐, 뭐야?! 무슨 소리야?"
211120-175 = "분명 여기 나 혼자밖에 없는데……!"
211120-181 = "으, 으아! 무서워!"
211120-190 = "……라는 얘기야."
211120-192 = "우왓, 이거 혹시 귀신 소동?!"
211120-193 = "에이, 잘못 들은 거겠지. 그런 사유는 은근 흔하잖아?"
211120-195 = "아니야! 이 소리 들었다는 학생들 꽤 있다고."
211120-196 = "혹시 그 소리를 들었던 위치가 어디였습니까?"
211120-197 = "아, 거기는……"
211120-204 = "소문의 장소"
211120-206 = "이 교실인가……."
211120-207 = "딱히 뭔가 이상한 건 없어 보이는데……."
211120-212 = "……."
211120-219 = "쇼코, 그건 뭐야?"
211120-220 = "전자파를 측정하는 장치입니다."
211120-221 = "음? 그게 왜 필요한데?"
211120-222 = "뭔가 이상한 소리가 반복적으로 들렸다면, 보통 노후화된 설비에서 노이즈가 발생했을 확률이 높으니까요."
211120-223 = "에잇, 낭만 없어. 그런 것보다 귀신이 나오는 편이 더 재미있다구."
211120-224 = "귀신 같은 건 하나 된 게헨나에 필요 없잖습니까. 있을 리도 없고."
211120-229 = "응? 나 진짜 본 적 있는데?"
211120-230 = "……거짓말."
211120-231 = "진짠데? 진짜 나왔다니까? 쇼코 쨩, 귀신 본 적 없어?"
211120-232 = "그으런 게- 있을 리 없습니다. 전자파나 추적해볼게요."
211120-233 = "아하하, 쇼코~ 귀신 무서워하는 거야?"
211120-234 = "시-끄러워요. 과자나 갚으세요."
211120-243 = "……이쪽에서 신호가 더 강해지고 있군요."
211120-245 = "회장, 그런 소리 들은 적 없어? 귀신이 가까이 있으면 막 전자기기들이 이상하게 작동한다거나!"
211120-246 = "아항~ 전등이 깜빡거린다거나, 치직거리는 소리가 들린다거나 말이지?"
211120-247 = "맞아. 마치 지금처럼……."
211120-249 = "흥, 유치한 장난이군요. 그런 걸로……"
211120-254 = "왁!!!!!!!!!!!!"
211120-259 = "야하하! 쇼코 쨩! 깜짝 놀랐지! 엄청 굳었어!"
211120-265 = "아, 진짜!!! 짜증나니까 하지 말라고요!!"
211120-267 = "이렇게 화내는 쇼코 처음 봐! 우와!"
211120-268 = "야핫, 귀엽잖아~ 그치? 귀신 무서워하는 쇼코 쨩!"
211120-269 = "안 무서운데요?! 그냥 큰 소리에 놀란 건데요?!"
211120-270 = "그럼 그럼~! 놀라서 그런 거 맞지!"
211120-271 = "으으……."
211120-276 = "……답."
211120-282 = "다들 들었어? 방금……"
211120-283 = "[s] \"뭔가, 소리가……\""
211120-284 = "나도 들었어……."
211120-285 = "여기 우리밖에 없는데…… 지, 진짜 귀신인가……?"
211120-290 = "……."
211120-298 = "이쪽에서 전자파가 강해졌군요……"
211120-300 = "쇼코…… 안 무서워하는데?"
211120-301 = "그러게. 아까까지만 해도 엄청 긴장했으면서."
211120-303 = "쉿- 조용."
211120-307 = "이 벽, 반대편에서 반응이 강하게 느껴지고 있는데……"
211120-308 = "……아까 들었던 단어는 분명……."
211120-314 = "앗, 어디 가는 거야?"
211120-315 = "쇼코 쨩, 뭔가 찾아냈나 본데?"
211120-320 = "노이즈가 가리키는 방향……."
211120-322 = "여긴……."
211120-323 = "방송실이네."
211120-325 = "……."
211120-327 = "방송실, 닫혀 있는지 꽤 된 거 아냐?"
211120-328 = "그러게. 교내 방송도 계속 안 하고 있고."
211120-330 = "이 안에 뭔가 있는 것은 확실한데……."
211120-331 = "지금으로서는 접근할 수가 없겠군요."
211120-333 = "아까 그 이상한 소리도 여기서 흘러나온 거였지?"
211120-334 = "그럼 확인해보자!"
211120-335 = "어떻게?"
211120-336 = "간단하잖아. 문을 부수고……"
211120-338 = "안 됩니다. 방송실 설비가 망가질 수도 있으니, 이 앞에서 폭력은 무조건 금지입니다."
211120-340 = "엑."
211120-342 = "……기껏 찾은 단서가 망가지면 안 되니까요. 네. 혹시라도요."
211120-344 = "카렌, 그리고 우리가 무슨 동아리인지 잊었어?"
211120-345 = "함부로 뭔가를 부수거나 혼란을 불러일으킬 만한 행위는 하지 않는다.#n우리 게헨나재흥위원회는 다른 게헨나 학생들이랑은 다르게 생각해야지."
211120-346 = "윽, 맞다…… 미안. 잘못 생각했네."
211120-347 = "선생님 앞에서 쪽팔려~ 야하핫."
211120-348 = "[s] \"그래그래. 착하다.\""
211120-349 = "아무튼 방송실에는 지금 못 들어갈 것 같은데. 어떡하지?"
211120-350 = "의뢰인한테 가서 해결 못 했다고 말할 수는 없잖아?!#n재흥위원회의 역사적인 첫 번째 고충해결 의뢰인데!"
211120-351 = "그냥 별일 아니었다고 하면 되지 않을까? 방송실이 원인이었다고."
211120-353 = "의뢰인이 원하던 해결책이냐 하면 그렇지는 않겠지만…… 어쨌든 단서는 찾았군요."
211120-357 = "[ns1] \"그러고 보니, 뭔가……\"\n[ns2] \"방송에서 이상한 소리가 들렸다는 소문도…….\""
211120-364 = "엣, 그래? 어디서 들은 이야기인데?"
211120-365 = "[s] \"그게……\""
211120-369 = "다음화;숲속의 나무"
