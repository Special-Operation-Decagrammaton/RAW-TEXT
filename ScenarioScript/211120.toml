211120-28 = "กลืนก่อนค่อยพูดสิ กลืนก่อน"
211120-30 = "ในฐานะหัวหน้า วาระที่ฉันจะมาเสนอในวันนี้ก็คือ..."
211120-31 = "'เส้นทางที่พวกเราต้องก้าวต่อไป'!"
211120-32 = "ฟังดูใหญ่โตเหมือนทุกทีเลยนะคะ"
211120-33 = "ใช่! ปัญหาของพวกเราคือชอบทำอะไรใหญ่โตนี่แหละ"
