211120-279 = ""
211120-281 = ""
211120-282 = "大家都聽到了嗎？剛才……"
211120-283 = "[s] 「好像有什麼聲音……」"
211120-284 = "我也聽到了……"
211120-285 = "這裡明明只有我們……真，真的是鬼嗎……？"
211120-286 = ""
211120-288 = ""
211120-290 = "……"
211120-291 = ""
211120-293 = ""
211120-294 = ""
211120-295 = ""
211120-298 = "這邊的電磁波變強了……"
211120-300 = "翔子……一點都不害怕耶？"
211120-301 = "就是說啊。明明剛才還超緊張的。"
211120-303 = "噓～安靜。"
211120-304 = ""
211120-307 = "從這面牆的另一邊感覺到很強烈的反應……"
211120-308 = "剛才聽到的詞彙，確實是……"
211120-309 = ""
211120-311 = ""
211120-313 = ""
211120-314 = "啊，你要去哪裡？"
211120-315 = "翔子醬好像找到什麼了耶？"
211120-319 = ""
211120-320 = "雜訊所指的方向……"
211120-322 = "這裡是……"
211120-323 = "是廣播室呢。"
211120-325 = "……"
211120-327 = "廣播室不是已經關閉很久了嗎？"
211120-328 = "就是說啊。校內廣播也一直都沒有在播。"
211120-330 = "這裡面確實有什麼東西……"
211120-331 = "但目前看來是無法進去了。"
211120-333 = "剛才那個奇怪的聲音也是從這裡傳出來的吧？"
211120-334 = "那就來確認看看吧！"
211120-335 = "要怎麼做？"
211120-336 = "很簡單啊。把門破壞掉……"
211120-338 = "不行。可能會弄壞廣播室的設備，在這裡絕對禁止使用暴力。"
211120-340 = "呃……"
211120-342 = "……好不容易找到的線索要是壞掉就糟了。是的。以防萬一。"
211120-344 = "香蓮，而且你忘了我們是什麼樣的團體了嗎？"
211120-345 = "不隨便破壞東西，也不做會引起混亂的行為。#n我們格黑娜再興委員會的想法，得跟其他格黑娜學生不一樣才行。"
211120-346 = "唔，對哦……抱歉。是我想錯了。"
211120-347 = "在老師面前好丟臉～呀哈哈。"
211120-348 = "[s] 「好啦好啦，真乖。」"
211120-349 = "不過現在好像沒辦法進入廣播室。該怎麼辦？"
211120-350 = "總不能去跟委託人說我們沒解決吧！？#n這可是再興委員會歷史性的第一個疑難排解委託耶！"
211120-351 = "直接說沒什麼大不了的不就好了？就說原因是廣播室。"
211120-353 = "雖然不算是委託人想要的解決方法……但至少找到線索了呢。"
