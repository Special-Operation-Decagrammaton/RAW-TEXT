[translation]
211120-1 = "第12話;お悩み解決"
211120-2 = "ゲヘナ再興委員会"
211120-3 = "それでは――"
211120-7 = "第28回「ゲヘナを再び偉大にするための会議」を開始しま～す！"
211120-8 = "[s] \"わ～い！\""
211120-9 = "もう28回なんだ。うちらも結構やってきたんだね。"
211120-10 = "ほとんど雑談でしたけどね。"
211120-11 = "中身のない議事録を書かされる身にもなって欲しいのですが。"
211120-15 = "ちょい。ショウコちゃん、そのお菓子2袋目じゃない？#nあたしまだ1個も食べてないんだけど！"
211120-16 = "書記の権限で私が全部食べます。"
211120-17 = "書記は力なく踏まれるだけの存在だ、って言ってなかったっけ。"
211120-18 = "お菓子に関しては無敵です。石をも砕くチョキみたいなものですよ。"
211120-19 = "じゃあ本当に砕けるか試してみよっか？"
211120-24 = "はいはい、注目！"
211120-26 = "は～い。"
211120-27 = "ふぁ～い。"
211120-28 = "喋るなら飲み込んでからにしなって。"
211120-30 = "私が持ってきた議題は――"
211120-31 = "「私たちの進むべき道」だよ！"
211120-32 = "いつも通り、大仰ですね。"
211120-33 = "そう！私たち、大仰なのが問題だと思うの！"
211120-37 = "私たちの活動って、ひとまずは順調だと思うんだ。"
211120-38 = "再興委員会を知ってる生徒も増えたし、プロジェクトの参加者も集まってきた。"
211120-39 = "みんな頑張れて偉い偉い。"
211120-40 = "これ自体はいいことなんだけどさ。"
211120-41 = "でも思ったんだ。本当にこれだけでいいのかなって。"
211120-42 = "また思いつきですか……。"
211120-43 = "私たちはゲヘナを根本から変えようとしてきたじゃん？"
211120-44 = "だけど本当に大事なのは、もっと些細なところなんじゃない？"
211120-45 = "どゆこと？"
211120-46 = "えっと、つまり……。"
211120-47 = "例えばさ、みんな色んな悩みがあるじゃん？#n感受性も豊かだしさ。先生もそうだし。"
211120-48 = "[s] \"呼んだ？\""
211120-49 = "なのにゲヘナには、悩みをちゃんと受け止めてあげられる場所も組織も無いの！"
211120-50 = "万魔殿は話にならないし、風紀委員会は治安維持組織だから役割が違う。"
211120-51 = "……じゃあ、誰が立ち上がるべきだと思う？"
211120-52 = "そう！！[ruby=私たち]ゲヘナ再興委員会[/ruby]！！"
211120-54 = "ってことは……。"
211120-55 = "うちらでお悩みを解決してあげようってこと？"
211120-56 = "お悩み窓口みたいな部署を、兼任しようというわけですね。"
211120-58 = "そう！千里の道も一歩から――偉大なゲヘナもお悩み相談から、ってね！#n……どうかな？"
211120-60 = "悪くないアプローチです。巨大な秩序は些細な規則によって成り立つのですから。#n統制可能な小単位から管理するのは、効率的な行政の基本です。"
211120-61 = "うちも賛成。何でもやってみる価値はあるでしょ。"
211120-63 = "もしかしたら先生の役割なのかもだけど、今回は任せてみて欲しいんだ。#n私たちの実力を見せてあげる！"
211120-64 = "[s] \"じゃあ私は何のためにここに……？\""
211120-65 = "応援！私たちを見守って、応援して！"
211120-67 = "言うなればお守りです。"
211120-68 = "いるだけで助かるーってやつ！やはっ！"
211120-72 = "最近の悩み？"
211120-74 = "つらいこととか、学園に対する不満とか。"
211120-75 = "なんか胸がモヤモヤする……とかでも大丈夫！カウンセリングもやってるから！"
211120-77 = "特には……ないかな？"
211120-78 = "えぇっ！？よーく思い出してみてよ！何かあるでしょ？ストレス溜まってることとか！"
211120-79 = "えっと……この状況、かな……？"
211120-80 = "そっか……うん、何もないなら良かった。"
211120-81 = "う、うん。じゃあ私もう行くね。"
211120-85 = "だいぶ声かけたのに、みんなあんまり悩みないんだね。"
211120-87 = "ある意味ゲヘナらしいかも。"
211120-88 = "私たちの活動で、生徒のストレス指数が下がっているのも一因でしょうね。"
211120-90 = "自分たちの成果が足を引っ張ってくるなんて……！"
211120-92 = "なに言ってるのさ。悩みがないならいいことでしょ。"
211120-93 = "「生徒の悩みを解決する」という目的に囚われすぎて判断力が落ちていますね。#n哀れで見ていられません。"
211120-95 = "あ～糖分切れてきた。ショウコ、お菓子ちょうだい。"
211120-96 = "最後の1個なので嫌です。"
211120-97 = "あとで倍にして返すから！"
211120-102 = "半分くれたっていいじゃん！悩まないでよ！"
211120-108 = "私も今食べたいんです！"
211120-109 = "……あれ？#nいま我慢すれば、後で倍の喜びになって返ってくる……？"
211120-113 = "あ、これ、あれですね。マシュマロ実験。"
211120-114 = "……いいでしょう。委員長に差し上げます。"
211120-122 = "うーん。"
211120-123 = "踏み倒すか。"
211120-131 = "ねえ、悩み相談ってまだやってる？"
211120-136 = "あい！やってうよ！"
211120-137 = "[s] \"飲み込んでから喋ろうね。\""
211120-138 = "ちゃんと倍にして返してくれるんですよね！？"
211120-140 = "も～、しっかりしてよ……。"
211120-141 = "うるさくてごめんね。何かあった？"
211120-142 = "あ、うん……。"
211120-143 = "えっと……うちのクラスで、変な声を聞いたって子が何人かいるんだ。"
211120-144 = "どんな声？"
211120-145 = "それがゾッとするような話なんだけど……。"
211120-152 = "はっ！？うわ……授業終わってんじゃん。誰か起こしてくれてもいいのに……って。#nあれ？みんなどこ行ったんだろ？"
211120-153 = "はぁ……とっとと帰ろ……。"
211120-159 = "――つ。"
211120-164 = "……。"
211120-165 = "気のせいかな……。"
211120-170 = "――じょ。"
211120-174 = "気のせいじゃない！？"
211120-175 = "教室、私しかいないのに……！"
211120-181 = "お助けー！"
211120-190 = "……って話。"
211120-192 = "もしかしなくても幽霊騒ぎ！？"
211120-193 = "いや、気のせいでしょ。そういうの、わりとあるじゃん。"
211120-195 = "違うんだって！声を聞いた生徒、結構多いみたいで。"
211120-196 = "声を聞いた場所は分かりますか？"
211120-197 = "もちろん！"
211120-204 = "噂の場所"
211120-206 = "この教室だね。"
211120-207 = "見た感じ変なところはなさそうだけど……。"
211120-212 = "……。"
211120-219 = "何それ。"
211120-220 = "電磁波を測定する装置です。"
211120-221 = "何に使うの？"
211120-222 = "妙な音の発生源を探ります。#n設備不良によるノイズが原因なら、これで特定できるはずです。"
211120-223 = "ロマンがないな～、幽霊の方が面白くない？"
211120-224 = "幽霊は「一つになったゲヘナ」には不要ですし、そもそも存在しません。"
211120-229 = "ん？本物見たことあるよ？"
211120-230 = "……嘘です。"
211120-231 = "ほんとだってば。マジで出たもん。"
211120-232 = "ゆ、幽霊なんて……いるわけがありません。#n私は電磁波を追いますので。"
211120-233 = "なに、幽霊怖いの～？"
211120-234 = "うるさいです。そんなことより、お菓子を倍にして返すの忘れないでくださいね。"
211120-243 = "……こっちで信号が強くなっています。"
211120-245 = "幽霊が近くにいると電気製品が変になるっていうよね。"
211120-246 = "電気がチカチカしたり、ノイズが走ったりするんだっけ。"
211120-247 = "そうそう。まさに今みたいに……。"
211120-249 = "ふん、子供じみたイタズラですね。そんなもので――"
211120-254 = "わっ！！！！！！！"
211120-259 = "やはっ！びっくりした？固まっちゃってたよ～？"
211120-265 = "やめてくださいって言ったじゃないですか！！"
211120-267 = "うわー！こんなに怒るショウコ初めて見た！"
211120-268 = "やはっ、幽霊怖いんだ～ショウコちゃん、か～わいい～！"
211120-269 = "怖がってませんけど！？#n大きい音にびっくりしただけですから！"
211120-270 = "そだねー驚いただけだもんね～！"
211120-271 = "うぅ……。"
211120-276 = "――とう。"
211120-282 = "今……聞こえた？"
211120-283 = "[s] \"何か、音が……。\""
211120-284 = "うちも聞こえた……。"
211120-285 = "ここ、私たちしかいないのに……ほ、本当に幽霊かな……？"
211120-290 = "……。"
211120-298 = "こちらで反応が強くなりました。"
211120-300 = "ショウコ……全然怖がってないね。"
211120-301 = "さっきまであんなにピリピリしてたのに。"
211120-303 = "しーっ、静かに。"
211120-307 = "強い反応は……この壁の向こう……？"
211120-308 = "それと、さっき聞こえた単語は、たしか……。"
211120-314 = "あっ、どこ行くの？"
211120-315 = "何か分かったっぽくない？"
211120-320 = "ノイズの発生源は……。"
211120-322 = "ここ……？"
211120-323 = "放送室だね。"
211120-325 = "……。"
211120-327 = "なんか、あんま使われてる感じなくない？"
211120-328 = "そういえば。校内放送もしばらくお休みだし。"
211120-330 = "この中に何かあるのは間違いありません。"
211120-331 = "ですが……さすがに鍵がかかってますか。"
211120-333 = "さっきの変な声はここから漏れてるってこと？"
211120-334 = "じゃあ確かめてみよっか！"
211120-335 = "どうやって？"
211120-336 = "え、ドアぶっ壊して──"
211120-338 = "ダメです！放送室の設備が壊れるかもしれません。暴力は禁止です。"
211120-340 = "えー。"
211120-342 = "せっかく見つけた手がかりが台無しになったら困るでしょう？"
211120-344 = "それに、私たちがどんな委員会だったか忘れた？"
211120-345 = "むやみに壊したり、迷惑をかける行為はしない。#nまずは自分たちが有言実行しないと。"
211120-346 = "そうだった……ごめん。"
211120-347 = "先生の前で恥ずいことしちゃった。"
211120-348 = "[s] \"よしよし、我慢できて偉いね。\""
211120-349 = "入れないのはどうしよっか。"
211120-350 = "記念すべき第1号の依頼なのに「解決できませんでした」とは言えないし……。"
211120-351 = "「原因は放送室でした～」って報告すればいいんじゃない？"
211120-353 = "依頼人の望む結果と言えるかは微妙ですが……手がかりは見つかりましたね。"
211120-357 = "[ns1] \"そういえば、なんか……。\"\n[ns2] \"似たような話を聞いた覚えが……。\""
211120-364 = "えっ、どこで聞いたの？"
211120-365 = "[s] \"えっとね……。\""
211120-369 = "次回;森の中の木"
