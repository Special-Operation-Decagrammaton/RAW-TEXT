211120-212 = "……"
211120-213 = ""
211120-215 = ""
211120-218 = ""
211120-219 = "翔子，那是什麼？"
211120-220 = "是測量電磁波的裝置。"
211120-221 = "嗯？為什麼需要那個？"
211120-222 = "如果反覆聽到奇怪的聲音，通常很有可能是老舊設備產生的雜訊。"
211120-223 = "嘖，真沒情調。比起那種東西，有鬼出現還比較有趣啦。"
211120-224 = "團結一致的格黑娜並不需要鬼這種東西吧。而且也不可能存在。"
211120-225 = ""
211120-228 = ""
211120-229 = "嗯？我真的見過哦？"
211120-230 = "……騙人。"
211120-231 = "是真的啦？真的出現過啊？翔子醬，你沒見過鬼嗎？"
211120-232 = "怎，怎麼可能有那種東西。我去追蹤電磁波了。"
211120-233 = "啊哈哈，翔子～你怕鬼嗎？"
211120-234 = "吵，吵死了。快還我零食。"
211120-235 = ""
211120-237 = ""
211120-238 = ""
211120-239 = ""
211120-242 = ""
211120-243 = "……從這邊傳來的訊號越來越強了。"
211120-245 = "委員長，你沒聽說過嗎？鬼在附近的話，電子產品就會出現異常之類的！"
211120-246 = "啊哈～像是電燈一閃一閃的，或是聽到滋滋聲之類的吧？"
211120-247 = "沒錯。就像現在這樣……"
211120-249 = "哼，真是幼稚的惡作劇。用那種東西……"
211120-250 = ""
211120-254 = "哇！！！！！！！！！！！！"
211120-255 = ""
211120-257 = ""
211120-259 = "呀哈哈！翔子醬！嚇了一跳吧！整個人都僵住了！"
211120-260 = ""
211120-262 = ""
211120-264 = ""
211120-265 = "啊，真是的！！！很煩耶，叫你別這樣了！！"
211120-267 = "第一次看到這麼生氣的翔子！哇！"
211120-268 = "呀哈，很可愛吧～對吧？怕鬼的翔子醬！"
211120-269 = "我才不怕好嗎！？只是被很大的聲音嚇到而已好嗎！？"
211120-270 = "是啦是啦～！只是被嚇到而已嘛！"
211120-271 = "嗚嗚……"
