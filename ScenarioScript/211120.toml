211120-338 = "ไม่ได้ค่ะ อุปกรณ์ในห้องกระจายเสียงอาจพังได้ ห้ามใช้ความรุนแรงหน้าห้องนี้เด็ดขาด"
211120-340 = "อ้าว"
211120-342 = "จะปล่อยให้เบาะแสที่อุตส่าห์หาเจอเสียหายไม่ได้ค่ะ... ใช่ค่ะ เผื่อเอาไว้ก่อน"
211120-344 = "คาเรน ลืมไปแล้วเหรอว่าพวกเราเป็นชมรมอะไร?"
211120-345 = "พวกเราจะไม่ทำลายสิ่งของโดยพลการ หรือทำสิ่งที่อาจก่อให้เกิดความวุ่นวาย#nคณะกรรมการฟื้นฟูเกเฮนน่าของเราต้องคิดให้ต่างจากนักเรียนเกเฮนน่าคนอื่นสิ"
211120-346 = "อึก จริงด้วย... ขอโทษนะ ฉันคิดผิดไปหน่อย"
211120-347 = "ขายหน้าต่อหน้าคุณครูชะมัด~ ยะฮะฮ่า"
211120-348 = "[s] \"อื้ม ตัดสินใจดีแล้วละ\""
211120-349 = "ยังไงก็เถอะ ดูท่าตอนนี้เราจะเข้าไปในห้องกระจายเสียงไม่ได้ งั้นจะทำยังไงดี?"
211120-350 = "จะไปบอกนักเรียนคนนั้นว่าแก้ปัญหาไม่ได้ก็ไม่ได้ด้วย! นี่เป็นคำขอแก้เรื่องร้องทุกข์ครั้งแรก#nในประวัติศาสตร์ของคณะกรรมการฟื้นฟูแท้ๆ เชียว!"
211120-351 = "บอกไปว่าไม่ได้มีเรื่องใหญ่อะไร และต้นเหตุมาจากห้องกระจายเสียงก็ได้นี่นา"
211120-353 = "ถึงจะไม่ใช่วิธีแก้ปัญหาที่ผู้ขอความช่วยเหลือต้องการ... แต่อย่างน้อยพวกเราก็หาเบาะแสเจอแล้วค่ะ"
