211120-6 = ""
211120-7 = "เริ่ม <การประชุมเพื่อทำให้เกเฮนน่ายิ่งใหญ่อีกครั้ง!> ครั้งที่ 28 ค่ะ~!"
211120-8 = "[s] \"ว้าว~\""
211120-9 = "ครั้งที่ 28 แล้วเหรอ? ที่ผ่านมาพวกเราทำอะไรไปเยอะเลยนะเนี่ย"
211120-10 = "ถึงส่วนใหญ่จะเป็นแค่การคุยเล่นก็เถอะค่ะ"
211120-11 = "คุณค่าที่เรียกว่าความอิ่มเอมหลังจดบันทึกเสร็จ ชาตินี้ฉันอาจไม่มีวันได้สัมผัสก็ได้นะคะ"
211120-12 = ""
211120-14 = ""
211120-15 = "อ๊ะ โชโกะจัง! ขนมนั่นถุงที่สองแล้วไม่ใช่เหรอ? ฉันยังไม่ได้กินสักถุงเลยนะ!"
211120-16 = "ฉันจะกินเองทั้งหมดค่ะ นี่คืออำนาจของเลขาค่ะ"
211120-17 = "ไหนเคยบอกว่าเป็นเลขาน่ะทั้งไม่มีอำนาจ แถมมีแต่ถูกคนอื่นเบียดเบียนไง?"
211120-18 = "เรื่องการจัดการขนมน่ะ ฉันไร้เทียมทานค่ะ คงเหมือนกรรไกรที่ทำลายก้อนหินได้ละมั้งคะ"
211120-19 = "ไหน ลองดูหน่อยสิว่าจะทำลายได้จริงมั้ย?"
