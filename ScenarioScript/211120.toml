[translation]
211120-1 = "第12話;疑難排解者"
211120-2 = "格黑娜再興委員會"
211120-3 = "那麼……"
211120-4 = ""
211120-6 = ""
211120-7 = "第28次「讓格黑娜再次偉大的會議」！開始～！"
211120-8 = "[s] 「哇～」"
211120-9 = "已經第28次了啊？這段時間我們還真做了不少事呢。"
211120-10 = "雖然大部分都是閒聊。"
211120-11 = "做完速記後的成就感，我這輩子大概都體會不到了吧。"
211120-12 = ""
211120-14 = ""
211120-15 = "啊啊，翔子醬！那包零食已經是第二包了吧？#n我一個都還沒吃到耶！"
211120-16 = "我要全部吃掉。這是書記的權限。"
211120-17 = "你之前不是說，書記就是沒權力又只會被欺負的角色嗎？"
211120-18 = "說到零食那就是無敵的。就像能擊碎石頭的剪刀一樣。"
211120-19 = "要試試看是不是真的能擊碎嗎？"
211120-20 = ""
211120-23 = ""
211120-24 = "好了好了！大家注意！"
211120-26 = "是～注意～～"
211120-27 = "嗚哦。"
211120-28 = "吞下去再說話，吞下去。"
211120-30 = "身為委員長，我今天帶來的議題是……"
211120-31 = "「我們該前進的道路」！"
211120-32 = "跟往常一樣，相當宏大呢。"
211120-33 = "沒錯！我們的問題就是太宏大了。"
211120-34 = ""
211120-36 = ""
211120-37 = "我們的活動目前可以說是一帆風順。"
211120-38 = "相當多的學生知道再興委員會的存在，也參與了我們的專案。"
211120-39 = "那就代表大家都做得很好囉。"
211120-40 = "當然是好事啦。"
211120-41 = "不過我突然想到──真的這樣就夠了嗎？"
211120-42 = "這句話很像常見的黑心企業老闆會說的台詞呢。"
211120-43 = "我們至今所做的，都是為了從根本改變格黑娜的宏大藍圖……"
211120-44 = "但其實重要的，說不定是那些細微的部分？"
211120-45 = "細微的部分是指？"
211120-46 = "也就是說……比方說像這樣！"
211120-47 = "我們這個年紀的學生不是有各種煩惱嗎？#n感受性也很細膩。就像老師一樣。"
211120-48 = "[s] 「我嗎？」"
211120-49 = "沒錯！可是格黑娜並沒有能夠化解那種煩惱的設施或組織。"
211120-50 = "萬魔殿當然不會在意那種事，風紀委員會也只是治安組織，#n所以本來就無法期待他們扮演那種角色。"
211120-51 = "那麼這個時候，應該由誰挺身而出呢？"
211120-52 = "就是！！我們！！"
211120-54 = "也就是說……"
211120-55 = "要我們來幫學生們解決煩惱？"
211120-56 = "意思是要扮演疑難排解部門的角色吧。"
211120-58 = "沒錯！雖然看起來可能非常微不足道，#n但是要讓大家知道，偉大的格黑娜可以從那種小事開始！如何？"
211120-60 = "我認為是個不錯的切入點。因為巨大的秩序終究是極細微規則的總和。#n從可控的小單位開始管理，是效率行政的基本。"
211120-61 = "我贊成。不管什麼都值得一試吧？"
211120-63 = "雖然老師才是這方面的專家，但這次你就別插手吧！#n我們會展現實力給你看的！"
211120-64 = "[s] 「那我為什麼會在這裡……」"
211120-65 = "為了加油啊！在旁邊看著我們，替我們打氣吧！"
211120-67 = "說穿了就是圖騰。"
211120-68 = "光是存在就能幫上忙，大概是這個意思啦！呀哈！"
211120-71 = ""
211120-72 = "最近的煩惱……？"
211120-74 = "嗯！像是有什麼辛苦的事，或是對學園有不滿之類的。"
211120-75 = "就算只是莫名覺得心神不寧也沒關係！我們也有提供諮詢哦！"
211120-77 = "沒有特別的煩惱耶？"
211120-78 = "不可能！好好想想！一定有什麼的！像是讓你有壓力的事之類的！"
211120-79 = "呃……現在這個狀況……？"
211120-80 = "啊啊，這樣啊……沒事的話就太好了。"
211120-81 = "嗯，嗯。那我先走了。"
211120-82 = ""
211120-84 = ""
211120-85 = "從剛才開始已經問了相當多人，但大家都沒什麼煩惱呢。"
211120-87 = "不過換個角度看，這或許才像是格黑娜吧。"
211120-88 = "最近因為我們的活動，學生們的壓力指數降低可能也是原因之一。"
211120-90 = "可惡，我們做到的事情，事到如今竟然在扯我們後腿嗎！"
211120-92 = "不，你在說什麼啊，委員長。沒有煩惱是好事吧。"
211120-93 = "現在委員長太執著於「必須解決學生的煩惱」這個目的，#n已經到了無法明辨事理的地步了。真是可憐又可悲。"
211120-95 = "啊，血糖不夠了。翔子，給我點零食。"
211120-96 = "只剩這個了，不行。"
211120-97 = "待會我還你兩倍啦。"
211120-98 = ""
211120-100 = ""
211120-101 = ""
211120-102 = "為什麼要那麼猶豫啊！？給我就那麼捨不得嗎？"
211120-103 = ""
211120-105 = ""
211120-108 = "可是，我現在也想吃啊！！"
211120-109 = "不過仔細想想，現在的痛苦會變成兩倍的喜悅回來……"
211120-110 = ""
211120-112 = ""
211120-113 = "啊，這就像那個嘛。棉花糖實驗。"
211120-114 = "原來如此……我接受了。就給委員長吧。"
211120-115 = ""
211120-121 = ""
211120-122 = "唔嗯……"
211120-123 = "還是別還好了。"
211120-124 = ""
211120-126 = ""
211120-129 = ""
211120-130 = ""
211120-131 = "呃，煩惱諮詢已經結束了嗎？我來晚了嗎？"
211120-132 = ""
211120-135 = ""
211120-136 = "嗯！還哉營業中！"
211120-137 = "[s] 「吞下去再說話，吞下去！」"
211120-138 = "你說過要還的吧！兩倍！"
211120-140 = "啊，真是亂成一團。"
211120-141 = "我們還在受理諮詢哦。發生什麼事了嗎？"
211120-142 = "啊，太好了。"
211120-143 = "唔嗯……我們班上有人說聽到了奇怪的聲音。"
211120-144 = "咦？什麼聲音？"
211120-145 = "是有點毛骨悚然的事……"
211120-151 = ""
211120-152 = "嗚哇，睡著的時候就下課了。大家都去哪了？"
211120-153 = "唉。我也得收拾書包趕快離開了……"
211120-154 = ""
211120-156 = ""
211120-159 = "……血。"
211120-160 = ""
211120-162 = ""
211120-164 = "……"
211120-165 = "什麼？聽錯了嗎？"
211120-166 = ""
211120-170 = "……序。"
211120-171 = ""
211120-173 = ""
211120-174 = "什，什麼！？那是什麼聲音？"
211120-175 = "這裡明明只有我一個人……！"
211120-176 = ""
211120-180 = ""
211120-181 = "嗚，嗚哇！好可怕！"
211120-182 = ""
211120-184 = ""
211120-188 = ""
211120-190 = "……就是這樣的事。"
211120-192 = "嗚哇，這該不會是鬧鬼事件！？"
211120-193 = "哎呀，應該是聽錯了吧。那種事其實還挺常見的吧？"
211120-195 = "才不是！聽到這個聲音的學生還不少呢。"
211120-196 = "請問聽到那個聲音的地點是在哪裡？"
211120-197 = "啊，那裡是……"
211120-204 = "傳聞中的地點"
211120-205 = ""
211120-206 = "是這間教室嗎……"
211120-207 = "看起來沒有什麼特別奇怪的地方……"
211120-208 = ""
