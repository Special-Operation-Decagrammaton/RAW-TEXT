211120-36 = ""
211120-37 = "แต่ก็ถือว่ากิจกรรมของพวกเรากำลังดำเนินไปอย่างราบรื่นนะ"
211120-38 = "นักเรียนจำนวนไม่น้อยที่รู้จักคณะกรรมการฟื้นฟู และกำลังเข้าร่วมโปรเจกต์ของพวกเราอยู่"
211120-39 = "ถ้างั้นทุกคนก็ทำกันได้ดีสินะ"
211120-40 = "แน่นอนว่าเป็นเรื่องดี"
211120-41 = "แต่จู่ๆ ฉันก็คิดขึ้นมาว่า แค่นั้นเพียงพอแล้วจริงๆ เหรอ?"
211120-42 = "ฟังเหมือนคำพูดของประธานองค์กรมืดทั่วๆ ไปเลยนะคะ"
211120-43 = "สิ่งที่พวกเราทำมาจนถึงตอนนี้ล้วนเป็นแผนการใหญ่ เพื่อเปลี่ยนแปลงเกเฮนน่าจากรากฐาน..."
211120-44 = "แต่ความจริงแล้ว สิ่งสำคัญอาจอยู่ในรายละเอียดเล็กๆ น้อยๆ ก็ได้นะ?"
211120-45 = "รายละเอียดเล็กๆ น้อยๆ งั้นเหรอ?"
211120-46 = "ก็แบบ... อย่างเช่นเรื่องแบบนี้ไง!"
211120-47 = "นักเรียนรุ่นราวคราวเดียวกับพวกเรามีเรื่องให้กลุ้มใจสารพัดไม่ใช่เหรอ? แถมความรู้สึกยังละเอียดอ่อนด้วย เหมือนคุณครูไง"
211120-48 = "[s] \"ครูเหรอ?\""
211120-49 = "ใช่! แต่เกเฮนน่าไม่มีสถานที่หรือองค์กรที่จะช่วยคลายความกลุ้มใจพวกนั้นเลย"
211120-50 = "แพนเดโมเนียม โซไซตี้ไม่สนใจเรื่องพวกนี้อยู่แล้ว ส่วนคณะกรรมการวินัยก็เป็นเพียงองค์กรรักษา#nความสงบ นั่นเลยไม่ใช่บทบาทที่จะคาดหวังจากพวกเขาได้ตั้งแต่แรก"
211120-51 = "แล้วในเวลาแบบนี้ ใครควรเป็นคนออกโรงกันล่ะ?"
211120-52 = "ก็!! พวกเราไง!!"
211120-54 = "หมายความว่า..."
211120-55 = "จะให้พวกเราช่วยแก้ปัญหากลุ้มใจของนักเรียนเหรอ?"
211120-56 = "จะทำหน้าที่เป็นหน่วยแก้เรื่องร้องทุกข์สินะคะ"
211120-58 = "ใช่! มันอาจดูเป็นเรื่องเล็กน้อยมาก แต่เราจะแสดงให้เห็นว่าเกเฮนน่าที่ยิ่งใหญ่สามารถเริ่มต้นจาก#nเรื่องเล็กๆ แบบนั้นได้! เป็นไง?"
211120-60 = "เป็นแนวทางที่ไม่เลวค่ะ เพราะท้ายที่สุดแล้วระเบียบอันยิ่งใหญ่ก็คือผลรวมของกฎเล็กๆ น้อยๆ#nการเริ่มบริหารจัดการจากหน่วยย่อยที่ควบคุมได้ คือพื้นฐานของการบริหารที่มีประสิทธิภาพค่ะ"
211120-61 = "ฉันว่าดีนะ ไม่ว่าเรื่องอะไรก็ควรลองทำดูก่อนไม่ใช่เหรอ?"
211120-63 = "ถึงคุณครูจะเชี่ยวชาญเรื่องแบบนี้ที่สุด แต่ครั้งนี้อยู่เฉยๆ ไปก่อนนะ! พวกเราจะแสดงฝีมือให้ดูเอง!"
211120-64 = "[s] \"งั้นให้ครูมาอยู่ตรงนี้ทำไม...\""
211120-65 = "ให้กำลังใจไง! คอยเฝ้าดูและให้กำลังใจพวกเราด้วยนะ!"
211120-67 = "จะเรียกว่าเป็นโทเทมก็ได้ค่ะ"
211120-68 = "แค่มีอยู่ข้างกายก็ช่วยได้แล้ว อะไรประมาณนั้นไง! ยะฮ่า!"
