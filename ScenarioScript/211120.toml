211120-74 = "อื้ม! พวกเรื่องลำบากใจ หรือเรื่องที่ไม่พอใจโรงเรียนน่ะ"
211120-75 = "หรือจู่ๆ รู้สึกจิตใจว้าวุ่นขึ้นมาโดยไม่มีสาเหตุก็ได้! พวกเราให้คำปรึกษาด้วยนะ!"
