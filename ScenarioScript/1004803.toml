[translation]
1004803-1 = "실수"
1004803-2 = "(모모톡으로 주고받았던 사오리의 연락이 어쩐지 석연치 않았던 탓에, 이번 기회에 직접 사오리를 찾아가 보기로 했다.)"
1004803-3 = "[s] \"듣기로는 이 근처 공사장에서 일하고 있다고 했는데.\""
1004803-7 = "[ns] \"이쪽인가?\""
1004803-13 = "(소리가 들려온 곳을 향해 걷자, 그곳에서 마침 사오리를 발견할 수가 있었다.)"
1004803-14 = "[s] \"앗, 사오……!\""
1004803-15 = "오늘치 일을 마무리했으니, 급여를 지급했으면 한다만."
1004803-16 = "껄껄껄!"
1004803-17 = "그러니까 아가씨. 내 몇 번이나 말했지만, 줄 수 없다니까?"
1004803-18 = "……어째서지?"
1004803-19 = "지난 사흘간, 급여를 한 푼도 받지 못했어. 이건 사전에 일을 소개받았을 때와 이야기가 다르다만."
1004803-20 = "글쎄. 그렇게 말해도 안 되는 건 안 되는 거야."
1004803-21 = "그도 그럴게-"
1004803-25 = "자네, 계약서도 안 썼잖아?"
1004803-26 = "……!"
1004803-27 = "[s] \"잠깐잠깐, 지금 그냥 흘려들을 수 없는 이야기를 들었는데?!\""
1004803-31 = "선생……? 선생이 어째서 여기에……"
1004803-32 = "응? 당신은 누구야?"
1004803-33 = "관계없는 사람은 괜히 어슬렁거리지 말고 꺼지라고."
1004803-34 = "[s] \"관계자니까 끼어들겠어! 계약서를 안 썼다니 무슨 소리야?\""
1004803-35 = "말 그대로의 의미다만?"
1004803-36 = "계약서라니……."
1004803-37 = "[s] \"봐봐! 사오리도 이렇게 말하고 있고, 뭔가 착오가 있는 거…….\""
1004803-38 = "계약서를…… 써야 하는 건가?"
1004803-39 = "[s] \"……응?\""
1004803-40 = "껄껄껄! 이거 걸작이구만!"
1004803-41 = "어쩌다 이 블랙마켓까지 떨어진 건지는 모르겠지만."
1004803-42 = "세상물정을 모르는 아가씨를 마주치다니, 정말 코미디가 따로 없구만!"
1004803-43 = "[s] \"자, 잠깐! 이야기를 정리해보자.\""
1004803-45 = "(사오리의 설명을 통해, 상황이 어떻게 된 건지 잠시 정리할 수가 있었다.)"
1004803-48 = "[ns1] \"블랙마켓에서 소개받은 일을 했는데,\"\n[ns2] \"계약서를 쓰지 않았고, 그 탓에 급여도 못 받았다고……?\""
1004803-49 = "임무를 시작했을 때부터, 따로 계약서를 쓰자는 말은 없었어."
1004803-50 = "임무를 시작했을 때부터, 따로 계약서를 쓰자는 말은 없었어."
1004803-51 = "그냥 이쪽은 시키는 대로 임무를 진행했을……"
1004803-52 = "선생?"
1004803-53 = "[ns] \"그건 사기잖아! 항의해 주겠어!\""
1004803-56 = "흥! 사기라니, 누가 보면 우리가 나쁜 놈인 줄 알겠구만."
1004803-57 = "결국 모든 문제는 그쪽의 아가씨가 계약서를 쓰는 걸 <깜빡> 했기에 벌어진 일이잖나?"
1004803-58 = "계약서를 쓰지 않았으니 우리는 돈을 줄 의무가 없어."
1004803-59 = "[s] \"그럼 여태까지 사오리가 했던 일은……!\""
1004803-60 = "끌끌끌. 말 그대로 무급으로 해준 자원봉사인 셈이지."
1004803-66 = "이야~ 꽤 도움이 되었다고."
1004803-67 = "보기보다 체력이 있는지, 남들보다 배나 되는 일을 해줬을 정도니까."
1004803-68 = "껄껄껄! 덕분에 예상보다 싼값에 일을 빠르게 처리했으니, 정말 고마운 일이지!"
1004803-73 = "……."
1004803-74 = "[s] \"그런 억지가…….\""
1004803-75 = "물론 나도 그렇게까지 악인은 아니야."
1004803-76 = "지금이라도 계약서를 써서 봉급을 지급해 줄 수 있다고?"
1004803-77 = "[s] \"아, 그럼……!\""
1004803-78 = "대신 줄 수 있는 건, 여기 남아있는 공사 자재를 옮겨준 분만큼 뿐이지만 말이야."
1004803-79 = "……."
1004803-80 = "아하하! 무급 노동에 돈을 지불할 순 없지! 자네의 봉사 정신을 훼손하는 일이 되잖나!"
1004803-81 = "어때, 남은 일을 마무리하고 적은 푼돈이라도 받아 갈 텐가?"
1004803-85 = "물론 싫다면 안 해도 상관없다고?"
1004803-86 = "대신 오늘은 한 푼도 받지 못하겠지만! 끌끌끌!"
1004803-87 = "[s] \"또 그 따위 짓을…….\""
1004803-88 = "알겠어."
1004803-89 = "[s] \"사오리?!\""
1004803-90 = "내일을 위해서라도 돈은 필요해. 하는 수밖에 없겠지."
1004803-91 = "껄껄껄! 거! 일할 자세가 되어있구만! 이 블랙마켓에선 보기 드문 건실한 아가씨야!"
1004803-96 = "[ns] \"……………!\""
1004803-103 = "어, 어어?!"
1004803-104 = "뭐, 뭐야. 해코지라도 할 생각……!"
1004803-108 = "[ns] \"나도 같이 돕겠어.\""
1004803-111 = "선생? 왜 당신까지……."
1004803-112 = "[s] \"일은 둘이서 하면 더 빨리 끝날 테니까.\""
1004803-116 = "뭐, 마, 맘대로 하라고!"
1004803-117 = "대신 내가 지불하는 건! 아가씨 몫의 봉급뿐이니까!"
1004803-128 = "끄응. 정말로 다 옮겼나……"
1004803-129 = "자, 약속한 대로 오늘 보수다!"
1004803-135 = "받았다."
1004803-140 = "[ns] \"하루 종일 고생이었네…….\""
1004803-141 = "……미안해. 선생."
1004803-142 = "[s] \"응?\""
1004803-143 = "나 때문에 이렇게……."
1004803-144 = "계약서라…… 그렇군. 중요한 일이었군."
1004803-145 = "[s] \"응, 계약서. 진짜로 중요하지 암암……. 그래도 이번에 배웠으니 다행이잖아?\""
1004803-146 = "그런가……"
1004803-147 = "앞으로는 이런 일이 일어나지 않도록, 명심해두도록 하지."
1004803-148 = "……오늘 고마웠어. 선생."
1004803-149 = "[s] \"……앗, 이건 귀중하디 귀중한! 사오리의 감사 인사!\""
1004803-153 = "……일이 끝났으면, 이만 먼저 돌아가 보겠어."
1004803-154 = "[s] \"응, 나중에 다시 보자. 사오리.\""
1004803-155 = "…………."
1004803-156 = "그래."
