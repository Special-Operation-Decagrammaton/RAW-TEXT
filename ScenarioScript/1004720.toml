[translation]
1004720-1 = "추억의 보물상자"
1004720-2 = "(혹시나 하는 마음에 걱정이 들어, 서둘러 치세를 찾아 바다로 나오게 되었다.)"
1004720-9 = "[ns] \"아마 치세라면 분명 이 근처에…….\""
1004720-11 = "(잠시 치세를 찾아, 바닷가 이곳저곳을 두리번거리고 있을 때였다.)"
1004720-23 = "[ns] \"응……? 이 소리는……?\""
1004720-30 = "이야아압~"
1004720-40 = "(소리가 난 곳에는 맹렬한 기세로 해변 모래사장의 모래를 파우치에 퍼 담는 치세가 있었다.)"
1004720-41 = "[ns] \"치, 치세?!\""
1004720-47 = "으응~? 선생님이네~ 안녕~"
1004720-48 = "[s1] \"아, 치세, 안녕……이 아니라.\"\n[s2] \"저기……. 지금 뭘 하고 있어?\""
1004720-51 = "나~?"
1004720-52 = "그게 말이야~"
1004720-53 = "지금 바다를 가져가려고 챙기고 있었어."
1004720-54 = "[s] \"……바다를 챙기다니, 그, 무슨 의미일까……?\""
1004720-56 = "여기 이렇게 바닷가에 있는 모래를 잔뜩 가져가서."
1004720-57 = "음양부 부실에 꾸며 두면 분명 즐거운 바다가 될 거야."
1004720-62 = "그러면 여기 오지 않더라도 다 같이 바다를 볼 수 있어~"
1004720-63 = "[s5] \"아, 과연…… 추억이 될 물건을 챙겨서 가져간다.\"\n[s6] \"치세가 말했던 건 그런 의미였던 거구나…….\""
1004720-66 = "으응~? 그럼 다른 의미도 있어~?"
1004720-67 = "[s7] \"아니, 그냥 나도 모르게 터무니없는 생각을 했달까.\"\n[s8] \"치세라면 혹시 가능할지도……? 라고 생각을 했달까.\""
1004720-73 = "……?"
1004720-75 = "[s] \"어, 어쨌거나, 그렇네. 치세는 모두를 위해 바다를 가져가려고…….\""
1004720-76 = "응. 그리고 바다만 챙긴 건 아니야~"
1004720-77 = "모두에게 보여주고 싶은 거."
1004720-78 = "다른 것들도…… 바다에서 찾아낸 멋진 것들은 다 여기에 담았어."
1004720-85 = "선생님도 볼래~?"
1004720-86 = "(그런 말과 함께 치세는 주섬주섬 파우치에 담아둔 물건들을 꺼내 들기 시작했다.)"
1004720-94 = "이 조개껍데기는~ 저기 바닷가 구석에서 주운 거고."
1004720-95 = "여기, 이 돌은 갯벌에서 주운 거고 말이야~"
1004720-96 = "이 병따개는 바다의 집에서 선물로 받은 거고~"
1004720-97 = "그리고 또."
1004720-104 = "선생님, 이건 말이지~"
1004720-111 = "선생님~"
1004720-125 = "(치세의 파우치 안에는 바닷가의 모래 말고도, 정말 다양한 물건들로 가득했다.)"
1004720-126 = "(조개껍데기나 소라게 껍데기부터 시작해서, 척 보기에는 평범해 보이는 조약돌이나, 병따개.)"
1004720-127 = "(그 밖에도 바닷가에서 주운 못쓰게 된 그물망이나 비닐봉투 같은 쓰레기들까지.)"
1004720-128 = "(어째서인지 그 내용물은 대부분이 눈에 익었다.)"
1004720-130 = "[ns] \"치세 이것들, 혹시 저번에……\""
1004720-132 = "응. 선생님이랑 같이 반짝임을 찾으면서 주웠던 물건들이야~"
1004720-133 = "여기엔 선생님과 함께한 추억이 담겨 있으니까."
1004720-134 = "그러니까 돌아가서 모두에게 보여주고 싶다고 생각했어."
1004720-135 = "보여주면서, 어떤 일이 있었는지. 밤새워서 이야기하고 싶다고……."
1004720-136 = "하이쿠로도 지어서 모두에게 들려주고 싶다고."
1004720-140 = "……그렇게 하면, 다들 좋아해 줄까?"
1004720-141 = "[ns] \"응, 그러게……\""
1004720-143 = "[ns] \"분명 다들 좋아할 거야. 선생님이 보증할게.\""
1004720-144 = "그으래~?"
1004720-145 = "그럼 다행이네~"
1004720-146 = "좋아, 그럼 더 열심히 담아야지~"
1004720-157 = "(그런 식으로 치세가 파우치 안에 담은 것들은 전부가 반짝이는 추억이자, 이곳에서 모은 보물과도 같았다.)"
1004720-158 = "(그래, 말 그대로…….)"
1004720-160 = "[ns] \"그 파우치는, 치세에게 있어선 보물상자 같은 거구나.\""
1004720-161 = "보물상자……?"
1004720-162 = "[s9] \"응, 그 왜. 남들에게 보여주고 싶고.\"\n[s10] \"또 자랑하고 싶은 보물을 담은 상자 말이야.\""
1004720-165 = "남들에게 보여주고…… 자랑하고 싶은 보물……"
1004720-166 = "같이 보면서 좋아해 줬으면 하는 추억의 보물……."
1004720-167 = "……아."
1004720-168 = "보물……."
1004720-172 = "응, 보물, 가지고 돌아갈래."
1004720-179 = "[ns] \"응……? 치세……? 왜 그…….\""
1004720-182 = "[ns] \"치, 치세?! 갑자기 다가와서, 왜, 왜 그래?!\""
1004720-183 = "선생님은 보물이니까, 음양부로 가져갈래~"
1004720-184 = "[s] \"아니, 그건 곤란ㅎ…… 웁! 자, 잠깐! 지금 모래가 입에 들어왔거든……?!\""
1004720-190 = "[ns] \"치, 치세 양! 으, 음양부로 가는 거라면 손잡고 같이 가줄 테니까~!\""
1004720-192 = "(그렇게 치세의 손에 이리저리 이끌리며…….)"
1004720-193 = "(우리는 바닷가의 느지막한 오후를 함께 보냈다.)"
