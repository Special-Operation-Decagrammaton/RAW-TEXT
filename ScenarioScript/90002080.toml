[translation]
90002080-1 = "8화;Level Up"
90002080-3 = "이 강철대륙은 일곱 번째 예언자 네차흐를 극단적으로 '진화'시켜 존재를 확장시킨 것입니다."
90002080-4 = "그 과정에서 네차흐의 본래 모습은 흔적도 찾아볼 수 없을 만큼 산산이 흩어져 버렸지만……."
90002080-5 = "어쨌든, 지금의 강철대륙에는 모든 데카그라마톤의 예언자가 모여 있고, 각각의 예언자는 자신에게 할당된 구역을 지키고 있죠."
90002080-6 = "엄밀하게 말하자면 그 복제체들이긴 한데…… 원본과는 차이가 없어요."
90002080-7 = "복제체였군요. 과연."
90002080-8 = "네. 어차피 그 셋의 계획대로 키보토스가 강철대륙으로 뒤덮이게 되면, 언제든지 시스템적으로 통합시킬 수도 있을 거고요."
90002080-9 = "그런데…… 여기에서 조금 문제가 있어요."
90002080-10 = "그게 무엇인가요, 케이?"
90002080-11 = "각각의 예언자가 어디에 있는지…… 지금은 좀처럼 추적하기가 어려운 상황입니다."
90002080-12 = "그건 역시 보안 레벨과 은폐의 문제인가요?"
90002080-13 = "그렇습니다, 히마리. 조금 직설적인 표현을 사용하자면……."
90002080-14 = "다들 정말이지, 잘도 꼭꼭 숨어 있다는 느낌이네요."
90002080-15 = "그 대신이라고 할까요. 새롭게 등장한 예언자 셋의, 부수적인 정보에 대해서는 알아낸 부분이 있습니다."
90002080-16 = "나머지 일곱은 이미 우리가 확보한 <생명의 나무>의 계통수에 기록되어 있으니, 그걸 참고하면 될 것 같아요."
90002080-17 = "우선 강철대륙 그 자체인 <네차흐NETZACH>. 그 이명은 <승리를 증거하는 무한의 대지> 이고, 패스Path는 <마침내 도달한 승리> 입니다."
90002080-22 = "어떤 의미로는 알기 쉬운 이명이네."
90002080-23 = "네……. 조금 그런 부분이 있죠. 그리고 정말 어디로 가 버렸는지 특히 찾기 어려운 <예소드YESOD>. 이명은 <기초 위에 올라선 힘의 정화자>."
90002080-24 = "패스Path는 <완성을 향해 나아가는 진리> 라고 하는군요."
90002080-29 = "예전부터 느꼈던 것이지만, 그 이명이니 패스이니 하는 건 무슨 의미야? 그런 게 있으면 뭔가 효율성이 올라가기라도 해?"
90002080-30 = "사실 저도 잘 모르겠지만, 이 강철대륙에서는 그걸 바탕으로 에너지의 흐름을 조정해서……."
90002080-31 = "무언가, 새로운 가능성에 도달하려고 하는 것 같더군요."
90002080-32 = "호오, 그 새로운 것이란 게 뭔데?"
90002080-33 = "……저도 몰라요."
90002080-34 = "에이, 뭐야! 뭔가 잘 아는 것처럼 이야기하더니만, 아무것도 아니었잖아!"
90002080-35 = "뭐라고요?!?!"
90002080-36 = "언니! 그런 말을 하면 어떡해! 케, 케이 쨩도 너무 화내지 말아 줘. 내가 대신 사과할게……."
90002080-37 = "큭……. 아닙니다, 미도리. 제가 너무 흥분한 것 같아요."
90002080-38 = "헤헹. 역시 그렇지?"
90002080-39 = "모–모–이!!!!!"
90002080-43 = "아하하하! 케이가 화났어!"
90002080-44 = "하아……."
90002080-45 = "뭐……. 좋습니다. 마지막으로 <말쿠트MALKUTH>가 있겠네요. 이명은 <세상의 끝에 도달한 왕국의 순례자>."
90002080-46 = "그리고 패스Path는…… <깃발 아래 창조된 하나의 의지> 라는 모양입니다."
90002080-54 = "듣다 보니까 뭔가 느낌이 오는데? 다음 게임 만들 때 참고해 볼까?"
90002080-55 = "……네. 차라리 그편이 어울릴지도 모르겠네요."
90002080-56 = "어라? 화내지 않는 거야?"
90002080-57 = "아무래도 좋은 말장난을 늘어놓고, 자기들끼리 설정 놀이나 하는 걸 보고 있으려니."
90002080-58 = "차라리 모모이의 시나리오 재료로 써 버리는 게, 세계의 공익을 증진시킬 것 같아서 하는 말입니다."
90002080-59 = "케, 케이 쨩……. 그렇게까지 이야기할 필요는……."
90002080-60 = "……미안해요, 유즈. 저도 말이 조금 심했네요."
90002080-61 = "응? 왜 그래?"
90002080-62 = "아닌가? 케이한테 사과를 받은 셈이니, 오히려 좋은 건가?"
90002080-63 = "……그래요……. 우리들의 모모이는, 원래 이랬었죠……."
90002080-64 = "다, 다행인…… 걸까……?"
90002080-65 = "어쨌든, 가장 문제가 되는 것은 말쿠트일 겁니다."
90002080-66 = "말쿠트의 힘은…… 우리가 모두 직접 목격한 대로, 지금으로서는 감당하기 어려운 수준이었죠."
90002080-67 = "여차하면 그 자리에서 우리를 모두 쓰러트릴 수도 있었을 거예요. 그렇지만 말쿠트는 그렇게 하지 않았죠."
90002080-68 = "마치 무언가에 쫓기는 것처럼, 빠르게 물러났습니다."
90002080-69 = "[s] \"그건 어떤 의미일까?\""
90002080-70 = "글쎄요. 우선 생각할 수 있는 가능성은, 말쿠트의 가동 시간이 극단적으로 짧을지도 모른다는 것이겠죠."
90002080-75 = "단기 결전만을 상정한 원 오프 타입의 기체라는 것일까요? 일종의 기술실증기?"
90002080-76 = "실전 용도로서는 최악이네. 무엇보다 중요한 것은 규격화와 표준화인데."
90002080-77 = "전투는, 물량이니까."
90002080-83 = "……아니면, 전투만을 상정하여 만들어진 예언자가 아니거나."
90002080-84 = "어…… 말쿠트에게는 애초에 다른 용도가 주어져 있을 거라는 뜻?"
90002080-86 = "시간만 충분하다면, 여기에서 무한히 토론하며 더 많은 예측을 해 볼 수 있었겠지만, 지금은 그럴 여유가 없을 것 같아요."
90002080-87 = "어쨌든 지금의 강철대륙은, 각 예언자가 담당하는 여러 구역으로 분할되어 있다는 것은 확실합니다."
90002080-88 = "그리고 우리는 그 구역을…… 다시 한번 '확보'해서, 우리의 [ruby=territory]영역[/ruby]으로 만들 수 있을 거예요."
90002080-89 = "그러고 보니, 데카그라마톤의 병력과 레이버들이 더 이상 침공해 오지 않네요?"
90002080-90 = "말할 시기를 조금 놓치기는 했는데, 지역 점령은 조금 전에 완료되었어."
90002080-91 = "구체적으로는, 말쿠트가 우리를 습격해 왔을 바로 그때에."
90002080-92 = "그리고 데카그라마톤의 병력과 레이버의 지원은, 정확히 그와 동시에 멈추었지."
90002080-93 = "그렇군요. 지역을 전자적으로 점령하는 데에 성공하면, 적의 지원도 멈추게 할 수 있다는 거네요."
90002080-98 = "그리고 구역을 점령하는 데에 성공하게 되면, 그 구역의 예언자들과 비로소 싸울 수 있게 될 겁니다."
90002080-99 = "마지막으로 예언자들을 쓰러트리게 되면…… 그 '정보 코어'의 정보를, 지금 저의 이 몸에 받아들일 수 있을 거예요."
90002080-100 = "……기본적으로 이 몸은, 강철대륙으로부터 만들어졌던 것이니까요."
90002080-101 = "예언자의 정보 코어의 정보를 흡수해서, 뭘 할 수 있다는 거야?"
90002080-102 = "더 많은 정보 코어를 흡수하면 할수록, 강철대륙은 저를…… 일종의……"
90002080-103 = "예언자들의 집합체나, 그 상위 존재 같은 것으로 받아들이게 될 거예요. 일종의 상위 보안 레벨 문제죠."
90002080-104 = "그렇게 제가 모든 정보 코어를 제 것으로 만들게 되면, 그때는 제가 직접 강철대륙에게 어떤 명령을 내릴 수 있게 될 거고요."
90002080-105 = "가령 '확장 및 가동 중지 명령' 같은 것 말이에요."
90002080-106 = "[s] \"어? 그러면 이 강철대륙 사태가……!\""
90002080-107 = "네. 근본적으로 해결될 가능성이 생기는 거죠."
90002080-111 = "……."
90002080-112 = "알았습니다! 강철대륙에게 각 구역을 점령하고 예언자를 쓰러트리면, 그만큼 케이가 레벨 업을 하게 된다는 거군요!"
90002080-113 = "그리고 만렙이 된 케이는, 자격을 가지고 직접 강철대륙을 멈출 수 있게 된다는 거고요!"
90002080-114 = "네. 그 비유도 상당히 좋은 것 같네요. 아리스. 하지만……."
90002080-115 = "하지만……?"
90002080-116 = "우리가 지금 당장 상대할 수 있는 예언자는, 10체가 아닌 8체가 전부죠."
90002080-117 = "즉 저는…… 100레벨이 아니라 80레벨까지밖에는 올릴 수 없다는 겁니다."
90002080-119 = "어? 그러고 보니…… 그렇네?"
90002080-120 = "네차흐와 말쿠트는, 지금 당장 어떻게 할 수 없는 것 같으니까……."
90002080-122 = "그렇지만, 이게 거의 유일한 방법처럼 보이는 것도 사실이에요."
90002080-123 = "적어도 강철대륙의 작동 구조와 확장 양식에…… 혼선 정도는 줄 수 있겠죠."
90002080-124 = "[s] \"그러면, 목표는 정해진 것으로 보아도 좋겠구나.\""
90002080-129 = "네. 선생님. 저희는 지금부터 각 구역을 점령하고 예언자를 쓰러트린 뒤."
90002080-130 = "그 코어의 정보를 회수해, 케이에게 저장시켜야 해."
90002080-131 = "모든 것이 잘 된다면, 케이가 직접…… 강철대륙의 작동 구조를 흐트러트릴 수 있을 거야."
90002080-132 = "결정된 것 같네. 선생님."
90002080-133 = "그렇다면, 그에 따른 물리적인 준비 역시 필요하겠군요."
90002080-134 = "[s] \"물리적인 준비?\""
90002080-135 = "네. 일단 제 아비 에슈흐의 직접적인 재장착은…… 무리인 것 같습니다."
90002080-136 = "말쿠트와의 방어전에서, 외부 파츠들은 사실상 더 사용할 수 없을 만큼 부서졌습니다."
90002080-137 = "일부이지만 베이직 프레임의 손상도 상당한 수준이고요. 사용할 수 있는 부분만이라면, 어떻게든 적출해서 재활용할 수 있겠지만."
90002080-138 = "그 모든 조건을 고려하면, 현재로서는 귀여운 아리스에게 아비 에슈흐의 프레임을 인계하는 것이 그나마 최선일 지경입니다."
90002080-140 = "네, 네?! 아비 에슈흐를, 아리스에게요?!?! 그치만……!"
90002080-141 = "아닙니다. 아리스. 지금은 할 수 있는 것을 해야 하고, 활용할 수 있는 것은 모두 활용해야 합니다."
90002080-142 = "오히려 문제 되는 것이라면, 프레임을 적출하고 전면 재정비를 한 뒤, 아리스에게 맞는 형태로 개조해야 할 텐데."
90002080-143 = "그럴 시간이 지금은 부족해 보인다는 부분이겠네요."
90002080-144 = "그리고 가능하다면, 아리스뿐만 아니라 다른 분들에게도 적절한 재무장이 필요할 것 같아요."
90002080-145 = "하지만 지금 당장은 이 지역을 유지하는 것만으로 벅찰 지경이니……."
90002080-149 = "……."
90002080-150 = "그래서, 구체적으로 뭐가 필요한 건데요?"
90002080-152 = "네, 네? 그야……."
90002080-153 = "우선은…… 수송선의 수리를 끝마쳐야겠지? 그리고 토키가 말한 대로 재정비와 개조, 추가 필요 파츠들의 장착까지 이루어져야 할 것이고."
90002080-154 = "사람 수가 절대적으로 부족한 데다, AMAS는 거의 파괴되었으니, 자동화를 보조할 여러 설비들을 비롯해서–"
90002080-160 = "[ns] \"우와…….\""
90002080-162 = "거, 거의 공장 시설 하나를, 새로 차리는 수준이네요……."
90002080-167 = "네. 현실을 전혀 고려하지 않으면 그렇죠. 하지만 그건 불가능하니, 어떻게든 대처 방안을 찾아야 할 텐데……."
90002080-169 = "그게 다 준비된다면, 어떻게든 되는 거죠?"
90002080-171 = "?!"
90002080-172 = "!?"
90002080-174 = "케, 케이? 아리스는 그런 거 잘 모르지만, 리오 선배가 이야기하는 것만 들어도 불가능해 보이는데요……?"
90002080-175 = "아뇨. 할 수 있습니다. 물론 저 혼자서는 불가능한 일입니다만."
90002080-176 = "아리스와 저라면, 얼마든지요."
90002080-177 = "아리스가요……?"
90002080-178 = "네. 물질의 재구축은, 이름 없는 신들의 힘 중에서도 대표적인 것이죠. 이 말도 몇 번 반복하고 있는 것 같기는 한데."
90002080-179 = "그리고 이 강철대륙이라는 지역 전체가, 바로 그 힘을 바탕으로 재구축된 것이고요."
90002080-180 = "네. 그건 분명 우리가, 강철대륙으로 출발하기 전 납득한 사실이기도 했고…… 설마?!"
90002080-181 = "맞아요. 그 '설마'입니다."
90002080-182 = "가능한가요, 케이!?"
90002080-183 = "아리스와 함께라면요."
90002080-184 = "그렇지만 아리스는, 아무것도…… 모르는데요……?"
90002080-185 = "괜찮습니다. 아리스. 그때와 마찬가지입니다."
90002080-190 = "이곳은 그 어떤 장소보다 이름 없는 신들의 힘으로 가득한 곳입니다. 무엇보다 말쿠트와의 방어전에서 저는 그걸 실감했어요."
90002080-191 = "……사실 뭔가 이것저것 왜곡되어 있기는 했지만…… 못 쓸 정도는 아니었죠."
90002080-192 = "거기에 이 신체를 얻은 이상, 그때보다 더 정밀하게 정류하는 것도 얼마든지 가능하고요."
90002080-193 = "그러니까 여기에서 보여 주죠, 아리스."
90002080-194 = "우리가 무엇을 할 수 있는지, 우리가 어떤 존재였는지."
90002080-200 = "우리가 본디, 무엇이었어야 했는지를요."
