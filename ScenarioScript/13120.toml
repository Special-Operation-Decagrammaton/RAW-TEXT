13120-527 = "뉴스……?"
13120-532 = "……다음 뉴스입니다. 오늘 아침 D.U.에 있는 샬레 건물에서 원인 불명의 폭발이 발생했습니다. 이때 건물 안에 [USERNAME] 선생님이 남아 있었던 걸로 확인……."
