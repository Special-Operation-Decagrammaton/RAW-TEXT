[translation]
13120-1 = "제12화;대책위원회의 시작"
13120-4 = "아비도스 학교 자전거 주차장"
13120-7 = "이야, 조금 난폭하게 해버렸을까나……."
13120-8 = "이름이 뭐야, 좀도둑 쨩?"
13120-12 = "……시로코. 스나오오카미 시로코."
13120-14 = "흐음, 그렇구만. 그럼 시로코 쨩. 여기서 뭘 하고 있었던 거야?"
13120-15 = "……."
13120-16 = "여기가 폐허처럼 보이는 건 이해하지만 아직은 아비도스 분교…… 아니, 본교거든."
13120-17 = "그 옷은…… 처음 보는 복장인데……."
13120-18 = "그렇지? 게다가 이 날씨에 그것만 입고 있으면 추울 것 같은데 말이지."
13120-21 = "저기, 시로코 쨩은 어디 학생이야?"
13120-22 = "……몰라."
13120-23 = "……?"
13120-24 = "……정신을 차려보니 여기였어. 내 이름 말고는 아무것도 기억나지 않아서……."
13120-25 = "무, 무슨 뜻이야, 그거?! 설마 기억 상실, 뭐 그런 게 요즘 유행하는 거야? 이 아저씨는 그런 거 잘 모르는데?"
13120-26 = "(아저씨……?)"
13120-27 = "그, 그럼 시로코 쨩은 이름 말고는 아무것도 모르는 건가요? 학원도……? 전화번호도……? 이메일도……?"
13120-31 = "(끄덕)"
13120-33 = "호, 호시노 선배 어떡하죠?"
13120-34 = "흐음……. 골치 아프네."
13120-38 = "일단 들어가서 얘기하자, 시로코 쨩. 여기는 얘기하기 좋은 곳은 아니니까."
13120-39 = "네?! 데, 데려가려고요?"
13120-45 = "자아, 추우니까 일단 이거라도 둘러."
13120-46 = "목도리……?"
13120-47 = "맞아, 없는것 보단 나으니까."
13120-48 = "……."
13120-49 = "어때, 좀 낫지?"
13120-50 = "……응."
13120-54 = "……따뜻해."
13120-57 = "으헤~ 잘 어울리네 시로코 쨩. 그 목도리, 이 아저씨가 세일할 때 산 거지만 그래도 소중하게 다뤄줘야 해?"
13120-58 = "응. 알았어."
13120-64 = "……."
13120-65 = "응, 왜 그래. 노노미 쨩."
13120-66 = "호시노 선배 방금 아저씨라고……."
13120-67 = "응? 내가 그랬나……?"
13120-68 = "게다가 방금 으헤- 하고…… 호시노 선배가 웃는 거 처음 봤어요……."
13120-69 = "그, 그랬나? 착각한 거 아냐? 이 아저씨는 평소에도 그렇게 웃었던 거 같은데……."
13120-70 = "또 아저씨라고……."
13120-71 = "아-"
13120-76 = "에, 엣취-"
13120-80 = "빠, 빨리 들어가자고! 시로코 쨩이 콧물을 흘리고 있잖아!"
13120-81 = "아, 네! 시로코 쨩, 얼른 이쪽으로!"
13120-92 = "으헤~ 딱 맞네. 학생들이 버리고 간 교복이지만 거의 입지 않은 거라서 새거나 마찬가지야."
13120-93 = "음."
13120-94 = "일단은 이걸로 참아요, 시로코 쨩. 나중에 새 걸 사드릴 테니까."
13120-95 = "아니, 괜찮아."
13120-96 = "그래도…… 이건 아비도스 교복이라서……."
13120-97 = "(도리도리)"
13120-99 = "헤에. 교복이 마음에 든 것 같은데?"
13120-100 = "옛날 디자인이라 새 걸 사는 게 더 좋을 텐데……. 으응, 그래도 시로코 쨩이 좋다면야……."
13120-108 = "역시 방법은 강행 돌파 밖에 없어."
13120-109 = "아니, 또 그 얘기야? 수백 명이 지키고 있는 곳을 어떻게 뚫을 건데?"
13120-110 = "응. 지금부터 준비를 철저히 하면 어떻게든 될 거야. 그리고 그곳을 지키는 병력 수, 척후의 동선, 보급로, CCTV 등을 파악해서……."
13120-111 = "아니, 은행을 터는 거랑은 완전 다르거든? 이건 시로코 선배 전문 분야가 아니라고!"
13120-112 = "으응……. 그치만 호시노 선배라면……."
13120-119 = "……선배?"
13120-120 = "으헤~ 아니. 갑자기 옛날 생각이 나서 말야."
13120-121 = "시로코 쨩 1년 전만 해도 콧물도 흘리고 귀여운 부분이 있었는데 말이지. 지금은 무시무시한 대사를 하는 여고생이 되어버렸어."
13120-123 = "응응, 맞아요. 그랬던 적도 있었죠♧"
13120-125 = "으, 으음…… 갑자기 옛날이야기……."
13120-126 = "이 아저씨는 시로코 쨩을 보면 가끔씩 쓸쓸해질 때가 있단 말이지? 세월이란 참 무심하지. 그 귀여운 아이는 어디 가버리고……."
13120-127 = "아니, 나이 차이 얼마 안 나잖아! 그리고 그래봤자 1년 전 아냐?"
13120-132 = "그리고 시로코 쨩은 아직도 귀여우니까 괜찮아요."
13120-133 = "으음……."
13120-135 = "그러네. 대책위원회가 생긴 지도 벌써 1년도 훨씬 지났구나."
13120-140 = "……."
13120-141 = "……응."
13120-151 = "어라……? 시로코 쨩?"
13120-155 = "덤벼. 승부야."
13120-160 = "시, 시로코 쨩?! 스, 승부라뇨?!"
13120-162 = "나는 나보다 약한 녀석의 말을 듣지 않아."
13120-163 = "그러니까 덤벼. 호시노."
13120-164 = "헤에…… 이것 참. 젊은이의 피 끓는 도전인가아……."
13120-165 = "뭐, 알겠어. 받아주지."
13120-170 = "네?! 호시노 선배?!"
13120-172 = "그치만 이 아저씨는 지금껏 1:1 승부에서 져본 적이 없단 말이지? 이 키보토스에서 아마 최고일걸? 자신은 있어, 시로코 쨩?"
13120-173 = "응. 저번에 한 번 싸워봤으니까. 지지 않아."
13120-174 = "흐응~ 거참. 그럼 지면 어떡할 건데? 시로코 쨩을 내 마음대로 해버려도 괜찮은 걸까나~"
13120-175 = "응. 마음대로 해."
13120-176 = "으헤~ 그 말 무르기 없기다? 여기서 지면 이제 아비도스에서 벗어날 수 없는 거야? 아저씨를 선배라고 부르는 거라구?"
13120-177 = "마음대로 해."
13120-179 = "호, 호시노 선배?!"
13120-200 = "그러니까~! 시로코 쨩, 이거 뭐야?!"
13120-201 = "고철들이네요…… 나사랑 볼트, 이쪽은 빈 탄피들……. 어디서 가져온 거예요?"
13120-203 = "응. 털었어."
13120-206 = "네에?!"
13120-207 = "터, 털었다고?! 어, 어디서?!"
13120-209 = "시내에 있는 고철상에서. 이걸 다시 고철상에 팔면 돈을 벌 수 있어. 학교의 빚 갚는 데 쓸 거야."
13120-210 = "한번 털었던 곳에 다시 팔겠다고?! 엄청난 아이디어잖아?!"
13120-211 = "노노미 쨩! 바로 연락해 봐!"
13120-216 = "네, 네!"
13120-218 = "시로코 쨩!! 그런 짓을 하면 안 돼!"
13120-222 = "왜?"
13120-223 = "왜라고 하면…… 그러니까……."
13120-228 = "여기였구나!! 우리 가게의 트럭을 훔쳐 간 녀석들이!!"
13120-234 = "아, 앗?!"
13120-236 = "트럭?! 트럭은 또 뭐야? 시로코 쨩?! 그것도 같이 훔친 거야?"
13120-237 = "응. 트럭 채로 가져왔거든. 일거양득."
13120-238 = "죄송합니다! 죄송합니다! 우리 시로코 쨩이 아직 뭘 잘 몰라서……."
13120-239 = "죄, 죄송해요…… 손해가 생겼다면 제 카드로 배상을 할테니……!"
13120-240 = "아니, 그것도 아니지. 노노미 쨩, 일단 사과부터!"
13120-241 = "네?! 네네! 죄, 죄송합니다! 일단 죄송합니다!"
13120-242 = "시로코 쨩도!"
13120-244 = "으응…… 죄송합니다."
13120-245 = "그런다고 봐줄 것 같아?! 앙?!"
13120-248 = "이번만 봐줄 테니까, 다음부턴 조심해!"
13120-250 = "네에……."
13120-251 = "결국 봐주는 전개라서 다행이네……."
13120-252 = "그치, 시로코 쨩."
13120-253 = "응. 다음번엔 안 들키도록 하겠어."
13120-254 = "아니, 그게 아니라고!"
13120-259 = "……뭐. 됐어."
13120-260 = "아비도스는 이제 학생들이 다 떠났다고 생각했는데 아직 남아 있는 학생들이 있었구나."
13120-262 = "……."
13120-263 = "뭐, 다음에 고철 팔일이 있으면 들리도록 해."
13120-269 = "그럼 다음에 봐. 아비도스 학생들."
13120-275 = "……."
13120-281 = "……어라?"
13120-285 = "이것 보세요! 호시노 선배! 시로코 쨩! 벚꽃망울이 맺혔어요!!"
13120-290 = "헤에. 그러네……."
13120-291 = "……겨울이 끝나가나 봐요."
13120-292 = "그러네. 지나가 버렸구나……. 어느새……."
13120-293 = "……응. 맞아요. 영원히 끝나지 않을 것 같았는데……"
13120-297 = "노노미 쨩은 어때? 슬슬 돌아가 봐야 하는 거 아냐? 다른 학원에 입학할 예정이었잖아."
13120-301 = "……."
13120-302 = "그쪽도 슬슬 입학식을 할 시즌일 텐데. 괜찮은 거야?"
13120-318 = "자아, 웃으라고, 시로코 쨩, 노노미 쨩! 스마일-!"
13120-319 = "응. 스마일."
13120-320 = "이, 이렇게까지 해야 하나요, 선배?"
13120-321 = "으헤~ 당연하지! 원래 축하할 일이 있으면 기념사진을 찍는 거라구!"
13120-337 = "그런데 시로코 쨩…… 그거 덥지 않아? 목도리 슬슬 벗는 게 어때?"
13120-338 = "아니, 괜찮아."
13120-348 = "자아. 이제 여기가 아비도스 폐교대책위원회의 부실이야."
13120-351 = "네!"
13120-352 = "응. 맡겨둬. 계획은 벌써 8개 정도 세워뒀으니까."
13120-353 = "계획이요……? 어떤……."
13120-355 = "기각."
13120-360 = "응응! 그러면 제 계획도 들어주세요☆"
13120-361 = "지금부터 이 황금 카드를 이용해서……."
13120-363 = "그것도 기각."
13120-368 = "어라……?!"
13120-371 = "……."
13120-372 = "……."
13120-374 = "뭐야, 뭐야! 갑자기 선배들 회상 모드가 되어버렸어?!"
13120-375 = "아야네 쨩! 어떻게든 해봐!"
13120-376 = "아하하…… 저희는 모르는 시절이라 약간 소외감이 들기도 하지만 그래도 선배들의 특권 같은 걸로 이해를……."
13120-378 = "헤에~ 그러네. 아야네 쨩, 세리카 쨩이 우리를 찾아왔을 때도 생각나는걸?"
13120-379 = "응응! 맞아요! 두 명 다 엄청 귀여웠죠~"
13120-380 = "맞아."
13120-384 = "저, 저기 실례합니다! 여, 여러분들이 아비도스 학생이시죠?"
13120-385 = "우리도 아비도스 학교에 입학하는 걸 결심했거든."
13120-386 = "네! 저희도 아비도스의 미래에 도움이 되고 싶어서……!"
13120-387 = "맞아. 그러니까, 부흥위원회였나?"
13120-388 = "대책위원회…… 세리카 쨩."
13120-389 = "뭐 어쨌든. 거기에 가입할 거야. 그러니까 앞으로 잘 부탁해. 선배님들!!"
13120-390 = "네! 잘 부탁드립니다!"
13120-392 = "뭐, 뭐 하는 거야?! 우리까지 회상 모드에 끌어들이지 말라고?!"
13120-393 = "아하하…… 뭐, 그랬던 시기도 있었죠……."
13120-395 = "네! 이걸로 아비도스 아이돌 5인조 계획이 드디어 시작될 수 있었어요~♧"
13120-396 = "이 아저씨는 빼달라고. 그런 건 젊은이들이 해야지."
13120-400 = "그럼 신선한 1학년들로만 구성된 2인조 그룹이라거나……?"
13120-406 = "응. 좋은 거 같아."
13120-407 = "헤에~ 그런 광경이라면 이 아저씨 못 참을지도? 엄청 흥분해서 난리 칠 지도?"
13120-409 = "뭘 계획하는 거야?! 그리고 우리가 무슨 신선 과일도 아니고?!"
13120-410 = "맞아요, 하려면 다 같이 하는 편이……."
13120-423 = "……역시 대책위원회가 사라지는 건 싫어요."
13120-428 = "노노미 선배?"
13120-430 = "저희에게 남아 있는 현실적인 선택지는…… 어떻게든 채권단 총회에 출석하는 데 성공하는 거예요."
13120-431 = "그러면 저희는 <아비도스 학생회>나 <대책위원회> 중 하나를 포기해야 해요…… 물론 그냥 이름일 뿐이고…… 거기엔 큰 의미가 없지만……."
13120-432 = "그래도 저는…… 대책위원회라는 공간이 사라지는 건 싫어요……."
13120-433 = "시로코 쨩이 있어 주었기에 저는…… 이곳에 남는다는 결정을 할 수 있었어요. 시로코 쨩과 모두들 덕분에 호시노 선배는 웃을 수 있게 되었구요."
13120-434 = "대책위원회는…… 저에게는 단순한 이름 이상의 의미가 있었던 거예요……."
13120-435 = "노노미 선배……."
13120-437 = "……."
13120-438 = "시로코 쨩……? 시로코 쨩 생각은 어때요?"
13120-439 = "……나? 저기, 나는……."
13120-440 = "나에게는…… 대책위원회는…… 으음……."
13120-441 = "대책위원회는 세상에서 가장 중요한 곳이잖아? 말하지 않아도 안다구. 시로코 쨩에겐 대책위원회야말로 이 세상의 전부거든. 그렇지 않아?"
13120-442 = "……으, 으음."
13120-444 = "하지만 반대로 생각해 보면…… 호시노 선배도 그랬겠죠?"
13120-445 = "으, 으응? 나?"
13120-446 = "<아비도스 학생회>……. 거기엔 유메 회장과 호시노 선배의…… 저희가 모르는 추억들이 잔뜩 있었을 텐데……."
13120-447 = "그게 그렇게 사라져 버린다면…… 그건 너무……."
13120-448 = "……아, 아니. 나는 괜찮다고? 이 아저씨는 그런 거에 연연하지 않는다고 생각하는데……."
13120-449 = "아니. 호시노 선배는 대책위원회가 만들어지고 나서도 <아비도스 학생회>라는 소속을 포기하지 못했어."
13120-450 = "선배는 줄곧 <대책위원회>이면서 <아비도스 학생회>이기를 원했던 거야."
13120-451 = "호시노 선배는 유메 회장과 이어져 있는 그 마지막 연결점을 포기하는 게 괜찮은 거야?"
13120-452 = "물론 거기에 아무 의미가 없다고 한다면 거짓말이겠지만……."
13120-453 = "선배가 학생회장 자리를 계속 사양한 건…… 유메 학생회장 때문 아냐?"
13120-457 = "내가 학생회장 자리에 올라버리면…… 그건 유메 선배의 죽음을 확실하게 인정해 버리는 것 같으니까……?"
13120-458 = "뭐어……. 그랬던 걸지도 모르겠네."
13120-459 = "그치만…… 분명한 건……."
13120-460 = "이 아저씨에겐 <열차포>가 악당들의 손에 넘어가지 않게 막는 게 이름을 지키는 것보다 훨씬 더 중요하다는 거야."
13120-462 = "……."
13120-463 = "……."
13120-468 = "유메 선배가 이 계약서를 왜 썼는지, 그때 무슨 일이 있었는지 결국 나는 알 수 없지만……."
13120-470 = "호시노 쨩. 의심과 불신, 폭력…… 거짓말…… 우리가 그런 방식에 조금씩 익숙해지기 시작하면……"
13120-471 = "우리도 언젠가 그런 사람들이 되어버릴 거야."
13120-472 = "우리가 그렇게 해서 아비도스를 구한다고 해도…… 그건 우리가 원했던 아비도스는 아닌 거야."
13120-473 = "나는 아비도스가 그런 불신과 폭력, 거짓말로 가득 차 있는 곳으로만 기억된다면……"
13120-474 = "조금 슬플 것 같아."
13120-477 = "이 열차포는…… 유메 선배가 바랐던 아비도스의 모습을 정면으로 부정하는 물건이니까."
13120-478 = "그러니까 이 아저씨는 열차포를 찾아내서 반드시 부숴버릴 거야."
13120-479 = "그러니까…… 나에겐 이름 같은 건 괜찮아.."
