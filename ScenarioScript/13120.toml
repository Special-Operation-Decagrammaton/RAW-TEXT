13120-487 = "……."
13120-489 = "그리고 어느 쪽을 골라야 한다면 기왕이면 <대책위원회>가 좋다고 생각해."
13120-490 = "왜냐면 <아비도스 학생회>는 나 혼자이지만, <대책위원회>는 시로코 쨩, 노노미 쨩, 아야네 쨩, 세리카 쨩 모두가 함께 있으니까, 그쪽이 맞는 거 같아."
13120-491 = "하지만……. 그래도……."
13120-492 = "자아. 문제에 집중하자고. 노노미 쨩."
13120-493 = "문제는 이거야. 우리가 어떤 선택을 하더라도 채권단 총회에 참석해야 하는 건 마찬가지야."
13120-494 = "그러니 어떻게 수백 명의 병력이 지키고 있는 그 장소로 들어갈 수 있을지를 고민하는 게 우선이야."
13120-495 = "응…… 알겠어요. 선배."
13120-497 = "응. 이해했어……."
13120-498 = "그럼 의견이 전부 모아진 거지?"
13120-500 = "네. 결론은 이렇습니다."
13120-504 = "내일 오전 12시까지 아비도스 중앙역 구청사로 돌입, 그곳을 지키는 사모펀드의 병력을 뚫고 매매계약서의 계약을 유지한다는 공증을 성사시킵니다!"
13120-505 = "그치만 그 정도의 대병력을 상대해야 하는 거잖아. 가능하려나……."
13120-506 = "이제 그 방법을 찾아봐야지……."
13120-507 = "이 방법은 선생님의 지원이 없으면 성립하지 않아요. 하지만 선생님이 계셔도 결코 쉽지 않을 거고……."
13120-508 = "그러고 보니 선생님, 아직 연락이 안 왔어? 오늘 내로 오신다고 했는데 너무 늦어지는데……."
13120-509 = "……. 그러게. 워낙 바쁘신 분이라 그럴 수도 있겠지만……."
13120-511 = "으음……."
13120-512 = "설마 무슨 일이 있는 건 아니겠죠?"
13120-521 = "꺄아악-?!!"
