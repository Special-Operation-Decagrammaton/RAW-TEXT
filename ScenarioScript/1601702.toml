[translation]
1601702-1 = "I hate people"
1601702-2 = "(업무에 쓸 용품을 사러 문구점에 들렀다.)"
1601702-10 = "좀 지나갈게요~"
1601702-16 = "앗……"
1601702-24 = "으으……"
1601702-25 = "이, 이래서 사람 많은 곳은…… 다들 줘팰 수도 없고……"
1601702-26 = "[s] \"안녕, 아오바. 여기서 보네.\""
1601702-30 = "아……"
1601702-34 = "어? 어어?? 선생님?"
1601702-35 = "아, 안녕하세요……!"
1601702-36 = "와, 와아…… 선생님이다……"
1601702-37 = "[s] \"뭔가 사러 온 거야?\""
1601702-38 = "아, 아아…… 네에……"
1601702-39 = "부품 출고 리스트를 작성해야 하는데, 사무실에 용지가 없어서……"
1601702-40 = "[s] \"비품으로 신청하는 거구나.\""
1601702-44 = "예, 엣? 아뇨…… 그냥 제 돈으로……"
1601702-45 = "[s] \"업무에 필요한 용품 아니었어?\""
1601702-46 = "예에…… 그, 그렇긴 한데……"
1601702-47 = "미리미리 신청하지 않으면 비품 청구가 안 되거든요…… 헤헤……"
1601702-48 = "예전에 많이 당해서…… 이제는 그냥 제 돈으로 사요……"
1601702-49 = "[s] \"그럴 수가……\""
1601702-50 = "하, 하이랜더는 원래 그러니까요……"
1601702-51 = "새, 생각해 보니 열받네……"
1601702-52 = "이런 이상한 규정이 많아서…… 스, 스트레스 많이 받아요……"
1601702-55 = "절약 차원에서 보고서는 반드시 이면지를 이용해야 한다거나……"
1601702-56 = "이면지가 없으면 아무거나 인쇄해서 이면지를 만들어야 해요……"
1601702-59 = "재, 재미있죠? 헤헤……"
1601702-60 = "결재 문서에 간부님이 도장을 찍어줘야 하는데…… 도장 잃어버렸다고 새로 팔 때까지 몇 주 동안 아무것도 못 하고 기다린다거나……"
1601702-61 = "도시락을 주문할 때는 간부님 메뉴에 맞춰서 전부 통일해야 한다거나……"
1601702-62 = "납기일을 말 안 하고 있다가 전날 되어서야 던져준다거나……"
1601702-63 = "[s] \"그, 그런 일이 많구나……\""
1601702-64 = "그렇죠…… 항상 일어나는 일이죠……"
1601702-65 = "지, 지금도 어디선가 누군가는 고통받고 있겠죠…… 헤헷…… 저처럼요……"
1601702-66 = "……그러다 보니 이제는 딱히 아무것도 기대하지 않게 됐어요……"
1601702-67 = "기대하면 실망하니까요…… 후후……"
1601702-68 = "일상은 지루하고 힘들 뿐이니까……"
1601702-69 = "[s] \"이렇게 만난 것도 인연인데, 오늘은 내가 사무용품을 좀 선물해도 될까?\""
1601702-73 = "에, 엣?! 서, 선생님이요……?"
1601702-74 = "여기서 필요한 거 전부 사도 된다고요……?"
1601702-75 = "아, 아뇨! 그, 그럴 수는…… 너무 신세 지는데요……!"
1601702-76 = "[s1] \"이런 날은 흔치 않으니까.\"\n[s2] \"부담 갖지 말고 필요한 것들을 골라봐.\""
1601702-79 = "우, 우으…… 그런……"
1601702-80 = "생각해 보니 용지도 필요하고…… 필기구도 거의 다 잃어버렸고…… 테, 테이프도……"
1601702-87 = "그, 그럼! 신세 지겠습니다아……"
1601702-88 = "오, 오늘만요……! 감사합니다…… 선생님……"
1601702-92 = "더, 덕분에 필요한 물품들은 모두 구매했어요……"
1601702-93 = "가, 감사합니다. 선생님……"
1601702-94 = "[s3] \"이런 일도 가끔 있을 수 있으니까.\"\n[s4] \"아오바가 일상을 기대하는 날이 오게 되면 좋겠네.\""
1601702-97 = "아……"
1601702-98 = "그, 그럴지도요……"
1601702-99 = "하지만 기대하면 실망할 테니까…… 실망하고 싶지 않으니까……"
1601702-104 = "오늘은 정말 감사했어요. 선생님."
1601702-105 = "이 은혜, 잊지 않겠습니다."
1601702-107 = "(아오바는 몇 번이고 거듭 인사하며 돌아갔다.)"
