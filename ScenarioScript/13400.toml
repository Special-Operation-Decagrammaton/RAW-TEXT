[translation]
13400-1 = "제40화;그 꿈이 남기고 간 흔적"
13400-5 = "번개가……."
13400-6 = "매마른 오아시스 전체에……."
13400-10 = "일어날 수 있겠어? 히나 쨩?"
13400-14 = "아아……. 혼자 걸을 수 있어."
13400-23 = "이건……."
13400-24 = "불꽃놀이……?"
13400-25 = "……. 저 번개에 반응한 건가? 위험해 보이진 않는데……."
13400-34 = "……이건."
13400-35 = "저것 봐, 저건 물고기 모양인데?"
13400-36 = "예뻐라……. 온 하늘이 바다 같아요……!"
13400-39 = "……."
13400-40 = "……소문은 들은 적 있어. 초고온의 온도로 반응시키면 이온-플라즈마 현상을 내는 광물. 빛의 형태도 성형할 수 있다더니……."
13400-41 = "그런데 초고가의 희귀 금속이라던데 그게 어째서 여기에……?"
13400-42 = "……."
13400-45 = "(초고가……?)"
13400-46 = "……해가 떠오른다."
13400-49 = "선배 말이 맞았어요. 진짜로 있었네요, 보물……."
13400-50 = "선배가 여기에 남기고 간 것들……"
13400-51 = "그 모든 흔적들을 나는 하나도 알 수 없을 줄 알았는데……."
13400-52 = "아니었어요……."
13400-55 = "네…… 아니었던 거예요…… 선배."
13400-63 = "우, 우와! 엄청 더 빠르게 터지기 시작했어!"
13400-64 = "그렇군. 100g에 천만 엔을 호가하는 이유가 바로 이 연쇄 작용 때문인가."
13400-65 = "뭐?!"
13400-66 = "뭐?"
13400-67 = "아마 맞을 거야. 근 2년 동안 시세가 10배 가까이 올랐으니까."
13400-68 = "아, 안돼!! 멈춰! 기다려! 돈이 타잖아! 더 빨리 타고 있잖아!!"
13400-69 = "삽, 삽이 필요해! 삽! 아야네 쨩?!"
13400-70 = "갑자기 여기서 삽을 달라고 해도……?"
13400-71 = "삽 정도는 상시 휴대했어야지!!"
13400-74 = "아니, 땅의 경도를 생각하면 곡괭이가 더 적절해. 아니면……."
13400-75 = "이 폭발을 멈출 방법은 있어?"
13400-76 = "……불가능해. 이미 시작된 연쇄 반응은 모든 걸 다 태운 뒤에나 꺼질 거야."
13400-77 = "와아-! 연쇄 반응이 시작됐어요~♧"
13400-82 = "시로코, 내가 준 복면을 모래주머니로 쓰지 마."
13400-83 = "음……. 하지만……."
13400-84 = "시로코 선배, 저쪽 시로코 선배를 부를 때 좀 다른 말을 쓰면 안 돼? 헷갈리잖아."
13400-85 = "그럼 내가 저쪽을 작은 시로코라고 부를게."
13400-86 = "아니, 곧 클 예정이라 그건 소용없어."
13400-87 = "그럼 약한 시로코."
13400-91 = "잠깐, 시로코 선배 갑자기 격발 금지!!"
13400-92 = "소용없어. 나는 네가 모르는 것을 경험하고, 네가 모르는 것을 알고 있어. 그 격차는……."
13400-93 = "응. 저번에 한 번 싸워봤으니까. 지지 않아."
13400-96 = "그만들 좀 하라고요!!"
13400-97 = "와아~♧ 저것 보세요! 이제 피날레인가 봐요! 한꺼번에……! 와아~!"
13400-106 = "……. 흐음~ 그러네."
13400-107 = "이 아저씨가 뭔가 멋진 폼을 잡으려고 할 때는 꼭 이런 식이 된단 말이지."
13400-110 = "……. 뭐, 어쩔 수 없으려나."
13400-111 = "으헤~"
13400-113 = "다음화;그 후에 남은 것들"
