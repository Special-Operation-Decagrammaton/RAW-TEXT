[translation]
3603-1 = "단맛과 노스탤지어 3"
3603-2 = "(부우우웅…….)"
3603-4 = "……."
3603-5 = "……."
3603-6 = "……."
3603-11 = "나기 쨩, 괜찮아?"
3603-13 = "전 괜찮아요……."
3603-14 = "오늘도 덕분에 정말 즐거웠어요……."
3603-15 = "아니, 그렇게 눈이 풀린 채로 말해 봤자 전혀 신뢰가 안 가거든."
3603-16 = "으음……."
3603-17 = "차라리 놀이공원을 데려가야 했나……."
3603-18 = "음?"
3603-22 = "흐음… 저런 데에 놀이터가 있네?"
3603-23 = "나기 쨩 나기 쨩, 옛날 생각 나지 않아?"
3603-24 = "어릴 땐 어떤 걱정이 있어도 놀이터에서 놀다 보면 대충 다 잊혔는데……."
3603-25 = "놀이터……."
3603-29 = "예, 그거예요."
3603-33 = "(끼이이익!)"
3603-34 = "?!"
3603-35 = "우왓 세이아 쨩, 갑자기 급브레이크?!"
3603-36 = "졸음운전은 좋지 않으니까요."
3603-37 = "이 놀이터에서 잠시 쉬었다가 가죠."
3603-38 = "……."
3603-39 = "흐음, 그렇구나, 세이아 쨩."
3603-40 = "이해했어."
3603-41 = "……?"
3603-45 = "우리가 어릴 때 놀던 놀이터랑 정말 비슷하네."
3603-46 = "사람이 하나도 없고, 잡초가 좀 많다는 것만 제외하면……."
3603-52 = "나기 쨩! 나기 쨩도 이리 와 봐!"
3603-53 = "저는…… 차에…… 남아 있을……."
3603-54 = "안 돼☆"
3603-55 = "예?"
3603-64 = "(결국 미카의 손에 이끌려 나기사는 놀이터로 들어섰다.)"
3603-67 = "……."
3603-69 = "(어디 앉아 있을 곳이…….)"
3603-70 = "(아, 미끄럼틀.)"
3603-75 = "치이이이……!"
3603-76 = "흐아아악?!"
3603-78 = "앗 뜨거워……!"
3603-79 = "아하하! 역시 나기 쨩은 미끄럼틀에 앉을 줄 알았어!"
3603-80 = "뭘 웃고 그래요! 미끄럼틀이 태양열 때문에 달궈져 있었잖아요?!"
3603-81 = "엉덩이가 익어 버릴 뻔했다고요?!"
3603-85 = "그래도 나기 쨩, 기력이 좀 돌아왔네?"
3603-86 = "네? 어, 그……."
3603-87 = "그러……네요?"
3603-88 = "다행이야, 나기 쨩."
3603-89 = "지금까지 갓 버려진 아기 사슴처럼 축 늘어져 있어서 얼마나 걱정했는데."
3603-90 = "아니 무슨 비유가……."
3603-91 = "……뭐 그래도 들어오기만 하면 없던 기운도 솟는 곳이 놀이터이긴 했죠."
3603-92 = "기운을 유지하려면 영양 공급도 필요하고요."
3603-93 = "그러니 받아요, 나기사."
3603-98 = "……?"
3603-99 = "이건…… 막과자?"
3603-100 = "둘이 아웅다웅하고 있을 때 근처 막과자 집에서 사 왔어요."
3603-101 = "먹어요. 오늘 하루 종일 먹은 게 시음한 홍차밖에 없잖아요."
3603-102 = "그, 그럼……."
3603-108 = "……너무 달군요."
3603-109 = "겉을 달콤하게 코팅해 놓고는, 과자 부분까지 달게 만들다니."
3603-110 = "그리고 다른 과자는…… 짜군요."
3603-114 = "또 어떤 것은 감칠맛이 너무 노골적이고요."
3603-115 = "이토록 단순하고 투박한 맛이라니……."
3603-116 = "하지만 분명 어린 시절에는 맛있게 먹었을 거예요, 나기사."
3603-117 = "아닌가요?"
3603-118 = "……그럼요, 그 시절에는 이 과자들이 최고였죠."
3603-120 = "그렇게 말하니 옛날 생각이 나네."
3603-121 = "아-아, 그때의 나기 쨩이 더 귀여웠는데☆."
3603-122 = "무, 무슨 소리예요?!"
3603-124 = "나기사, 막과자의 맛은 변하지 않았어요."
3603-125 = "하지만 나기사는 변했죠."
3603-126 = "더 우아하고, 더 섬세한 입맛으로."
3603-127 = "……?"
3603-128 = "그러니까 이런 거야. 좋았던 옛 기억도, 나중에 다시 맛보면 별로일 수 있다는 거지."
3603-129 = "바로 이 막과자들처럼 말이야."
3603-130 = "……."
3603-131 = "반대로 지금은 힘든 기억이, 미래에는 좋은 기억이 될 수도 있는 거고."
3603-132 = "나기 쨩도, 우리도, 계속해서 성장하고 변화할 테니까."
3603-133 = "흐음, 뭔가요 미카 씨."
3603-134 = "결국 지금 힘든 일이 미래에는 유익한 것이 될 수 있으니, 힘내서 일어나라는 조언인가요?"
3603-135 = "상투적이군요."
3603-136 = "우와 나기 쨩, 신랄해."
3603-137 = "후후, 하지만 원래 진실은 상투적인 법이니까요."
3603-138 = "그래서 자주 잊어 버리곤 하죠."
3603-139 = "그러니까 잊기 전에 말해둘게요."
3603-141 = "고마워요, 모두."
3603-143 = "……."
3603-144 = "하핫, 그러면 앞으로도 종종 이렇게 놀러 다니자!"
3603-148 = "그래 맞아, 티파티 소유 프라이빗 비치도 있었잖아! 다음에는 거기로 놀러 가자!"
3603-149 = "……후후, 좋네요."
3603-150 = "좋지? 그럼 약속한 거야, 나기 쨩?"
3603-151 = "예. 그러면 이제 돌아가 볼까요."
3603-152 = "우리들의[ruby=트리니티] 집 [/ruby]으로."
3603-153 = "……의도치는 않았지만 마침 최상급의 찻잎도 생겼으니, 가서 이 과자들과 간단히 다과회라도 해요."
3603-161 = "잘 해결된 것 같지?"
3603-162 = "그러네요."
3603-163 = "다만……."
3603-164 = "오늘의 일은 임시방편일 뿐이다, 라고 말하려는 거지?"
3603-165 = "……눈치가 많이 늘었네요, 미카."
3603-166 = "사실 당연한 일이지. 오랜 시간 누적된 업무 스트레스가 단 하루 만에 사라지진 않을 테고."
3603-167 = "돌아가면 업무는 또다시 쌓여갈 테니까."
3603-168 = "하지만 꼭 모든 게 완전하고 영원할 수는 없는 거잖아?"
3603-169 = "이러고 또 나기 쨩의 피로가 쌓이면, 아예 크게 휴양을 떠날 수도 있는 거고."
3603-170 = "예를 들면, 아까 얘기했던 프라이빗 비치라든가……."
3603-171 = "……결국 길게 보면 모든 것은 임시방편일 뿐이다, 라는 건가요."
3603-172 = "응. 그러니까 매 순간 노력해야 하는 거지."
3603-173 = "오늘처럼, 말이야."
3603-174 = "……."
3603-175 = "뭐야, 왜 그런 눈으로 봐?"
3603-176 = "웬일로 미카답지 않게 좋은 말을 해서요."
3603-177 = "왜? 나도 성장이란 걸 하거든?!"
3603-181 = "천천히 와요. 시동 걸어 둘 테니까."
3603-190 = "단맛과 노스탤지어"
