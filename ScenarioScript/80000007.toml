[translation]
80000007-1 = "최고의 피로회복제"
80000007-2 = "샬레 업무관"
80000007-3 = "(철야 업무를 마치고 당번 활동을 하기 위해 찾아온 하나에를 맞았다.)"
80000007-7 = "선생님, 어젯밤에도 또 철야를 하신 건가요?"
80000007-8 = "철야는 건강에 해롭다고 몇 번이나 말씀드렸는데……."
80000007-9 = "[s1] \"샬레의 일이 많아서…….\"\n[s2] \"어쩔 수가 없었어…….\""
80000007-10 = "하는 수 없네요. 그럼 제가 밤새 고생하신 선생님을 위해, 피로가 가시는 음료를 준비해올게요."
80000007-11 = "하는 수 없네요. 그럼 제가 밤새 고생하신 선생님을 위해, 피로가 가시는 음료를 준비해올게요."
80000007-12 = "선생님은 자리에 앉아 잠깐이라도 눈을 붙여주세요."
80000007-13 = "[s] \"커피라면 충분히 마셨는데…….\""
80000007-14 = "걱정하지 않으셔도 괜찮아요!"
80000007-15 = "제가 준비한 음료는 커피보다 훨씬 더 뛰어난 효능을 지니고 있으니까요."
80000007-19 = "[ns] \"뭔가 불안한데…….\""
80000007-25 = "(하나에가 수상쩍은 검은 액체가 담긴 컵을 들고 돌아왔다…….)"
80000007-26 = "오래 기다리셨습니다. 하나에 특제 카페인 농축 음료예요!"
80000007-27 = "이 음료에는 일반 커피의 200배의 카페인이 농축되어 있답니다. 마시면 잠이 확 달아날 거예요!"
80000007-28 = "[s] \"죽일 셈이냐!\""
80000007-29 = "어라? 이 음료는 마음에 안 드시나요?"
80000007-30 = "곤란하네요. 지금 가지고 있는 재료는 커피 가루와 핫 초콜릿 가루밖에 없는데……."
80000007-31 = "[s] \"핫 초콜릿이면 충분해…….\""
80000007-32 = "괜찮으시겠어요? 초콜릿은 커피보다 카페인 함량이 적어서 잠을 깨는 데에는 그다지 도움이 되지 않을 텐데……."
80000007-33 = "하지만 선생님께서 원하신다면 어쩔 수 없지요."
80000007-34 = "그럼 잠시만 기다려주세요. 금방 핫 초콜릿을 만들어 올게요!"
80000007-45 = "오래 기다리셨습니다. 하나에 특제 핫 초콜릿이에요!"
80000007-46 = "초콜릿 위에 귀여운 토끼 마시멜로도 잔뜩 넣었답니다!"
80000007-47 = "[s] 하나에의 핫 초콜릿을 마신다."
80000007-52 = "후후, 맛있게 드셔 주시니 다행이네요. 샬레에 오는 길에 핫 초콜릿을 사 오길 잘했어요."
80000007-53 = "그나저나 오늘은 어째서 초콜릿을 파는 가게가 길가에 그렇게나 많았던 걸까요?"
80000007-54 = "……네? 발렌타인 데이요?"
80000007-55 = "아하하…… 그러고 보니 벌써 시간이 그렇게 되었네요. 저도 깜박 잊고 있었어요."
80000007-56 = "우연이긴 하지만, 선생님께 초콜릿을 선물할 수 있어서 다행이에요."
80000007-60 = "……제 초콜릿, 끝까지 드셔 주셔야 해요?"
