211020-168 = ""
211020-169 = ""
211020-170 = ""
211020-171 = ""
211020-172 = "เป็นรุ่นน้องที่กระตือรือร้นดีจริงๆ..."
211020-173 = "หึ... มีจิตใจฮึกเหิมน่ะมันก็ดีอยู่หรอก แต่สุดท้ายก็เป็นแค่การกระทำที่ไร้ความหมายเปล่าๆ"
211020-174 = "รุ่นน้องที่ขาดทั้งวุฒิภาวะและประสบการณ์ ต่อให้พยายามแค่ไหนก็สั่นคลอนฐานอำนาจของ#nท่านมาโคโตะผู้นี้ไม่ได้หรอก คิกคิกคิก!"
211020-175 = ""
