[translation]
211020-1 = "제2화;게헨나재흥위원회"
211020-3 = "당신들은……?"
211020-4 = "무의미한 싸움은 멈추는 게 좋을 거야, 선배님들."
211020-5 = "너희들은……?"
211020-9 = "누구냐고 물으신다면,"
211020-10 = "대답해 드리는 게 인지상정."
211020-11 = "게헨나의 잃어버린 자부심을 되찾고, 찬란한 영광의 시대를 다시 세울 혁명의 기수."
211020-15 = "<게헨나재흥위원회>, 등장!"
211020-21 = "야핫! 방금 전까지 서로 잡아먹을 것 같더니, 이제 좀 조용해졌네."
211020-22 = "나는 게헨나재흥위원회의 위원장 보좌, 묘라쿠 카렌."
211020-25 = "소란을 피워 죄송합니다. 하지만 변화에는 언제나 충격이 따르는 법이지요."
211020-26 = "게헨나재흥위원회의 서기, 이가라시 쇼코입니다."
211020-29 = "그리고 나는 회장, 후리하타 마유미! 잘 부탁해!"
211020-32 = "재흥이라면…… 게헨나를 다시 부강하게 만든다는 뜻인가요?"
211020-38 = "응! 바로 그 말이야!"
211020-39 = "키힛! 그 포부가 자못 담대하다! 기상이 출중한 후배들이로군."
211020-40 = "하지만, 마음에 걸리는 부분이 있다."
211020-41 = "'다시'라고 말했는데, 게헨나는 현재도 충분히 부강할 터."
211020-42 = "어째서 그 표현을 사용했지?"
211020-49 = "어째서냐면,"
211020-50 = "당연히……"
211020-54 = "현재의 게헨나는 위대하지 않기 때문이지!"
211020-55 = "뭐라? 그게 무슨 뜻이냐!"
211020-56 = "말 그대로인데, 의장 선배. 지금의 게헨나는 더 이상 멋지지 않다는 뜻이야."
211020-57 = "말도 안 되는 소리! 이 몸이 군림하고 있는 게헨나가 위대하지 않다면, 대체 무엇이 위대하단 말인가?"
211020-58 = "그래서 문제라고, 그래서!"
211020-59 = "뭣이!!"
211020-63 = "저희가 주장하고자 하는 바가 그것입니다."
211020-64 = "지금 게헨나는 키보토스의 웃음거리, 문제아 집합소라는 낙인이 찍혀 있죠."
211020-65 = "하지만, 예전의 게헨나는 달랐습니다."
211020-66 = "키보토스 전역에 야망을 펼쳤고, 모든 학원이 게헨나를 두려워하며 경외하고 있었죠."
211020-67 = "어딜가나 문제아 취급받는 학교와 학생들."
211020-68 = "질서나 규율은 찾아볼 수 없어! 그저 혼돈스러운 교풍 뿐!"
211020-69 = "마코토 의장, 그리고 만마전의 임원들."
211020-70 = "현재의 게헨나가 이렇게 된 것은, 당신들의 책임이 크다고!!"
211020-71 = "큿!!"
211020-72 = "그건……."
211020-73 = "만마전, 당신들은 게헨나의 학생들을 대표하는 집단이지만 실제로 그에 걸맞은 일은 하고 있지 않습니다."
211020-74 = "학생들의 무관심을 이용해 기괴한 시책 따위에 예산 낭비를 일삼기나 하는 집단이지요."
211020-75 = "대부분은 사실이지만 가끔, 아주 가끔씩은 괜찮은 일도 하는데요……."
211020-76 = "언제나 괜찮아야지! 가끔이 아니야!"
211020-77 = "가만 보면 너희들은 학생들에게 도움이 되는 일은 뒷전이고, 선도부 괴롭히기에만 전력투구하고 있는 것처럼 보인단 말이지."
211020-78 = "아, 그건 마코토 선배만."
211020-79 = "소모적인 일에 한정된 예산을 낭비하고, 그렇기 때문에 정작 필요한 곳에는 투자하지 못하고, 결과적으로 게헨나의 경쟁력은 점점 줄어들고!"
211020-80 = "심지어! 에덴조약 결렬 때부터 트리니티에게는 큰 목소리를 내지도 않고 있잖아?"
211020-81 = "그것은 샬레와의 협정을 우선적으로 고려한……"
211020-82 = "어쨌든 결과적으로 보면 게헨나가 굽히고 들어간 거나 마찬가지잖아!"
211020-83 = "정녕 그게 의장님이 원하는 거야? 그게 의장님이 말하는 리더로서의 그릇이자 도량이야?"
211020-84 = "크윽…… 이 녀석들, 이 몸을 도발하는 것인가……!"
211020-89 = "이렇게 속 시원하게 말해주는 사람이 있을 줄이야……!"
211020-90 = "아뇨. 선도부, 당신들도 문제입니다."
211020-91 = "네?"
211020-92 = "선도부는 게헨나 학원의 규율과 풍기를 수호한다는 기치 아래 모인 집단."
211020-93 = "선도부장을 제외하면 그저 귀찮은 존재들이라는 평이 많지만……"
211020-94 = "뭐라고?! 우리 앞에서 당당하게 그런 말을……!!"
211020-95 = "나는 그렇게 생각하지 않아."
211020-96 = "응……?"
211020-97 = "선도부장을 제외하고라도, 선도부는 명명백백 게헨나 최강의 무력 단체."
211020-98 = "하지만!"
211020-99 = "그런 힘을 보유하고도, 당신들이 하는 일은 그저 평범한 문제아들을 상대로 폭력을 휘두르거나, 만마전과 무의미하게 다투는 것뿐."
211020-100 = "아니, 일단 말로 하거든! 폭력…… 이랄까, 실력 행사는 그다음이고!"
211020-101 = "야핫, 그게 중요한 게 아니잖아!"
211020-102 = "그 어떤 학원보다 어마어마한 잠재력을 갖고 있는 게헨나가 하나로 뭉치지 못하는 것에는, 분명 너희들의 책임도 있다고."
211020-103 = "선도부는 대체 뭘 원하는 거야? 지금처럼 느슨한 통제와 규율?"
211020-104 = "아니면, 그저 눈에 띄었을 뿐인 운 없는 학생들을 대상으로 선도부라는 역할놀이를 하고 있는 거야?"
211020-105 = "뭐……? 놀이?"
211020-106 = "카렌의 말이 거칠긴 해도 틀린 부분은 없어! 선도부는 무엇 하나 확실하게 하지 못하고 있잖아!"
211020-107 = "지금처럼 애매한 입지를 유지하면서 더 적극적으로 나서지 않는 이유가 있어?"
211020-112 = "그 점에 대해서는 내가 할 말이 있어."
211020-113 = "부, 부장……."
211020-114 = "부장님……!"
211020-115 = "애매하다…… 그렇게 느낄 수도 있겠지."
211020-119 = "그렇다면, 우리가 바라는 건 바로 그 애매함이라고 해둘게."
211020-123 = "너희는 우리가 확고한 통제와 규율을 세우기를 바라는 것 같은데."
211020-124 = "언뜻 좋아 보이겠지만, 그건 우리가 만들어 가고자 하는 게헨나와는 달라."
211020-125 = "우리가 추구하는 것은 자유로운 게헨나니까."
211020-126 = "허울 좋은 이야기입니다. 자유가 항상 긍정적인 방향으로 발산될 수 있는 것처럼 말씀하시는군요."
211020-127 = "지금의 게헨나에서 자유는 방종으로 변질된지 오래입니다."
211020-128 = "바로 그 때문에 우리 선도부가 있는 거야. 넘지 말아야 할 선을 긋는 존재들."
211020-129 = "선을 넘으려면 우리를 지나쳐야 할 테지만, 우리는 언제나 그 자리에서 선을 지킬 테니까."
211020-130 = "……."
211020-135 = "흐, 흥…… 멋있는 척을 한다고 정말 멋있어지는 건 아니지……."
211020-136 = "아무튼, 결론을 내자면……"
211020-137 = "선도부는 앞으로도 계속해서 지금의 애매한 위치를 고수할 생각이다,#n이렇게 해석하면 되겠습니까?"
211020-138 = "답변하자면, 그래."
211020-139 = "그렇다는군요, 회장."
211020-140 = "응. 들었어."
211020-141 = "선도부의 의지, 잘 알았어! 만마전의 의사도 잘 알았어!!"
211020-142 = "그러니까, 그 누구도 게헨나를 하나로 만들고 싶어 하지 않는다는 거네."
211020-143 = "그렇다면 더 이상 할 말은 없어! 문제를 파악했으니, 해결하면 그만!"
211020-144 = "뭘 하겠다는 거죠?"
211020-150 = "우리는 하나 된 게헨나를 만들기 위해……"
211020-154 = "이것저것, 여러 가지를 할 거야!!"
211020-160 = "뭐……?"
211020-161 = "나는 디테일에 약해서 구체적인 방안을 여기서 모두 말하지는 못하지만,"
211020-162 = "아무튼 우리가 하는 일을 잘 지켜보시라는 말이야, 선배님들!!"
211020-163 = "게헨나의 변화는, 지금 여기서부터 시작할 테니까!!"
211020-172 = "……활기찬 후배들이군."
211020-173 = "흥…… 의기는 좋으나, 어차피 의미 없는 행동에 지나지 않는다."
211020-174 = "연륜도 경험도 부족한 후배들이 아무리 노력해 봐야 이 마코토 님의 아성을 위협할 수는 없을 테니까 말이지. 키시싯!"
211020-180 = "뭐, 뭔가 재밌어질 것 같은데!"
211020-182 = "다음화;게헨나를 위대하게!"
