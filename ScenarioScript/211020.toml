[translation]
211020-1 = "第2話;ゲヘナ再興委員会"
211020-3 = "あなた達は……？"
211020-4 = "せんぱぁい、無駄なケンカはやめなって。"
211020-5 = "あなた達は……？"
211020-9 = "名を聞かれたなら――"
211020-10 = "教えてしんぜよう！"
211020-11 = "ゲヘナの誇りを取り戻し、いま再び栄光の時代を打ち立てる革命の旗手！"
211020-15 = "ゲヘナ再興委員会――参上！！"
211020-21 = "やはっ、みーんな静かになっちゃった。"
211020-22 = "うちは[ruby=みょうらく]明楽[/ruby]カレン。#nゲヘナ再興委員会の委員長補佐だよ。"
211020-25 = "騒がしくして申し訳ありません。#nですが、変革とは衝撃が伴うもの――"
211020-26 = "ゲヘナ再興委員会の書記、[ruby=いがらし]五十嵐[/ruby]ショウコです。"
211020-29 = "そして私が委員長、[ruby=ふりはた]降旗[/ruby]マユミ！よろしくね！"
211020-32 = "再興……ゲヘナを再び強くする、という意味でしょうか？"
211020-38 = "その通り！"
211020-39 = "キシシッ！その抱負、実に大胆不敵！気骨のある後輩たちだ。"
211020-40 = "だが――聞き捨てならないな。"
211020-41 = "ゲヘナは今でも十分に誇り高いのだ。最高と評しても過言ではあるまい。"
211020-42 = "……なぜ、[ruby=・]再[/ruby][ruby=・]び[/ruby]と考える？"
211020-49 = "それは――"
211020-50 = "当然――"
211020-54 = "今のゲヘナは偉大じゃないから！"
211020-55 = "何だと？"
211020-56 = "だからー、今のゲヘナはカッコよくないの。"
211020-57 = "戯言を！[ruby=・]マ[/ruby][ruby=・]コ[/ruby][ruby=・]ト[/ruby][ruby=・]様[/ruby][ruby=・]が[/ruby][ruby=・]統[/ruby][ruby=・]べ[/ruby][ruby=・]る[/ruby][ruby=・]ゲ[/ruby][ruby=・]ヘ[/ruby][ruby=・]ナ[/ruby]が偉大ではないと言うのか？"
211020-58 = "そう！"
211020-59 = "なにぃっ！？"
211020-63 = "私たちが主張したいのは、まさにその点です。"
211020-64 = "ゲヘナはキヴォトスの笑い物。問題児の吹き溜まりとしての烙印を押されています。"
211020-65 = "しかし、かつてのゲヘナは違いました。"
211020-66 = "野望はキヴォトス全土に広がり、全ての学園がゲヘナを畏れ敬っていたというのに。"
211020-67 = "ゲヘナってだけで、どこに行っても問題児扱い。"
211020-68 = "秩序はない！規律もない！あるのはカオスな校風だけ。"
211020-69 = "ゲヘナがこうなっちゃったのは――"
211020-70 = "マコト議長たちの責任なんだから！！"
211020-71 = "くっ……！"
211020-72 = "それは……。"
211020-73 = "[ruby=パンデモニウム・ソサエティー]万魔殿。貴女方[/ruby]はゲヘナの代表でありながら、それに相応しい働きをしていません。"
211020-74 = "生徒の無関心につけこんで、奇怪な政策で予算を浪費するばかり。"
211020-75 = "弁明の余地は……まぁ、ほとんどありませんね。#nですが、たまに、本当にたまにですけど良いこともしてたり――"
211020-76 = "たまにじゃダメなの！いつもじゃなきゃ！"
211020-77 = "見てて思うんだけど、風紀委員会いじめに全力投球してるよね？"
211020-78 = "それはマコト先輩だけです。"
211020-79 = "限られた予算を無駄遣いして、肝心なところへの投資はしない。#nだからゲヘナの競争力は下がりっぱなし！"
211020-80 = "エデン条約の一件以来、トリニティに抗議もしてないよね？"
211020-81 = "それはシャーレとの関係を最優先に考慮した――"
211020-82 = "結果として「屈した」ようにしか見えないって言ってるの！"
211020-83 = "それが先輩の言う「器」なの？議長として本当に誇れるの？"
211020-84 = "ぐっ……！言わせておけばぬけぬけと……！"
211020-89 = "こんなにズバッと言ってくれる人がいるなんて……！"
211020-90 = "いえ。貴女方も同じですよ。"
211020-91 = "はい？"
211020-92 = "風紀委員会は、ゲヘナの規律と風紀を守るためにいるんだよね？"
211020-93 = "なのに、「面倒なやつら」くらいにしか思われてない。#nあ、委員長だけは違うか。"
211020-94 = "何だと！？"
211020-95 = "でも、私はそうは思ってない。"
211020-96 = "……え？"
211020-97 = "委員長がいなくたって、風紀委員会はゲヘナ最強の武力集団だよ。"
211020-98 = "だけど！"
211020-99 = "力があるのに、問題児を殴り飛ばしたり、万魔殿とケンカしてるだけだよね？"
211020-100 = "違っ……！まずは言葉で注意して、実力行使はその後だ！"
211020-101 = "や、そういう話じゃなくて。"
211020-102 = "ゲヘナにはとんでもない潜在能力がある。#nなのに一つにまとまらないのは、風紀委員会にも責任があるっしょ。"
211020-103 = "風紀委員会は何がしたいわけ？"
211020-104 = "今みたいな、ゆる～い規律と統制？#nそれとも……風紀委員ごっこしてるだけ？"
211020-105 = "……ごっこ？"
211020-106 = "言い方はちょっとあれだけど、間違ってはないよね。#nだって風紀委員会は、な～んにも決めきれてない！"
211020-107 = "いっつも曖昧。なんでもっと踏み込まないの？"
211020-112 = "知りたいなら答えてあげる。"
211020-113 = "い、委員長……！"
211020-114 = "委員長……！"
211020-115 = "曖昧……ね。"
211020-119 = "そう思いたいのならそれでいいわ。"
211020-123 = "あなたたちは規律と統制を求めているようだけど。"
211020-124 = "それは、私たちが目指すゲヘナじゃない。"
211020-125 = "私たちが目指すのは、自由なゲヘナだから。"
211020-126 = "耳触りの良い言葉ですね。#n自由が常に良い方向に働くと、本気で信じているような口ぶり。"
211020-127 = "今のゲヘナでは「放縦」に変質しているというのに。"
211020-128 = "だからこそ、線を引くために私たちがいる。"
211020-129 = "越えたいのなら──相手になるわよ。"
211020-130 = "……。"
211020-135 = "ふん……口だけは一丁前だな。"
211020-136 = "ともあれ結論としては――"
211020-137 = "風紀委員会は曖昧な立場を堅持する、と。そう解釈して良いのですね？"
211020-138 = "ええ、構わないわ。"
211020-139 = "だそうです、委員長。"
211020-140 = "らしいね。"
211020-141 = "万魔殿の考えも！風紀委員会の考えも！よ～く分かった！！"
211020-142 = "つまり、誰もゲヘナをまとめる気がないってことだよね。"
211020-143 = "なら話は早い！あとは実行あるのみ！！"
211020-144 = "何をするつもりですか？"
211020-150 = "私たちは「一つになったゲヘナ」を作るために――"
211020-154 = "いろいろ、いーっぱいやるよ！！"
211020-160 = "……は？"
211020-161 = "細かいことは苦手だから、具体的なことはまだ分かんないけど――"
211020-162 = "私たちがやること、ちゃんと見ててよね！"
211020-163 = "ゲヘナの変化は今日、この瞬間から始まるんだよ！！"
211020-172 = "……元気のいい後輩ね。"
211020-173 = "威勢はいいが、徒労に終わるだろうな。"
211020-174 = "年季も経験も足りていないのだ。#nどれだけ足掻こうと、このマコト様の天下にはヒビ1つ入らない！キシシッ！"
211020-180 = "な……なんか面白くなってきた！"
211020-182 = "次回;ゲヘナを偉大に！"
