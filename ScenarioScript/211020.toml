[translation]
211020-1 = "第2話;格黑娜再興委員會"
211020-2 = ""
211020-3 = "你們是……？"
211020-4 = "無意義的爭吵還是停下來比較好哦，前輩們。"
211020-5 = "你們是……？"
211020-8 = ""
211020-9 = "若要問我們是誰……"
211020-10 = "回答便是人之常情。"
211020-11 = "找回格黑娜失去的自尊，重新建立燦爛榮耀時代的革命旗手。"
211020-15 = "「格黑娜再興委員會」，登場！"
211020-16 = ""
211020-21 = "呀哈！剛才還一副要互相廝殺的樣子，現在倒是安靜下來了呢。"
211020-22 = "我是格黑娜再興委員會的委員長輔佐，明樂香蓮。"
211020-25 = "造成騷動真是抱歉。不過，變革總是會伴隨著衝擊。"
211020-26 = "我是格黑娜再興委員會的書記，五十嵐翔子。"
211020-29 = "然後我是委員長，降旗真由美！請多指教！"
211020-31 = ""
211020-32 = "再興的意思是……要讓格黑娜再次變得富強嗎？"
211020-33 = ""
211020-35 = ""
211020-37 = ""
211020-38 = "嗯！就是這個意思！"
211020-39 = "嘰嘻嘻！這份抱負相當大膽！真是有骨氣的後輩們啊。"
211020-40 = "不過，有個地方讓人很在意。"
211020-41 = "你們說「再次」，但格黑娜現在應該就已經夠富強了。"
211020-42 = "為什麼要用這種說法？"
211020-43 = ""
211020-45 = ""
211020-46 = ""
211020-47 = ""
211020-48 = ""
211020-49 = "要問為什麼……"
211020-50 = "當然是……"
211020-51 = ""
211020-53 = ""
211020-54 = "因為現在的格黑娜並不偉大！"
211020-55 = "什麼？那是什麼意思！"
211020-56 = "就是字面上的意思啊，議長前輩。現在的格黑娜已經不再帥氣了。"
211020-57 = "胡說八道！如果本大人君臨的格黑娜不偉大，那到底什麼才稱得上偉大？"
211020-58 = "所以我才說有問題啊！"
211020-59 = "什麼！！"
211020-60 = ""
211020-62 = ""
211020-63 = "這正是我們想要主張的。"
211020-64 = "現在的格黑娜被烙上了奇普托斯的笑柄、問題學生聚集地的印記。"
211020-65 = "但是，以前的格黑娜並非如此。"
211020-66 = "當時在整個奇普托斯施展野心，所有學園都對格黑娜既畏懼又敬畏。"
211020-67 = "不管到哪裡都被當成問題學生看待的學園和學生們。"
211020-68 = "完全看不到秩序和紀律！只有混亂的校風！"
211020-69 = "真琴議長，還有萬魔殿的幹部們。"
211020-70 = "現在的格黑娜會變成這樣，你們要負很大的責任！！"
211020-71 = "唔！！"
211020-72 = "那是……"
211020-73 = "萬魔殿，你們雖然是代表格黑娜學生的團體，實際上卻沒有做與之相符的事。"
211020-74 = "不過是個利用學生們的漠不關心，把預算浪費在古怪政策上的團體罷了。"
211020-75 = "雖然那大部分是事實……但偶爾，非常偶爾也是會做些不錯的事啦……"
211020-76 = "應該要一直都不錯才對！不能只是偶爾！"
211020-77 = "仔細一看，你們都把對學生有幫助的事擺在一邊，只顧著全力欺負風紀委員會呢。"
211020-78 = "啊，那只有真琴前輩而已。"
211020-79 = "把有限的預算浪費在無謂的事情上，真正需要的地方反而無法投資……#n結果就是格黑娜的競爭力變得越來越低！"
211020-80 = "甚至！自從伊甸園條約破局之後，對三一也都不敢大聲說話了吧？"
211020-81 = "那是優先考量與夏萊之間的協定……"
211020-82 = "總之從結果來看，就跟格黑娜屈服了沒兩樣啊！"
211020-83 = "那真的是議長想要的嗎？#n那就是議長所說的，身為領袖的器量和胸襟嗎？"
211020-84 = "唔唔……這些傢伙，是在挑釁本大人嗎……！"
211020-85 = ""
211020-87 = ""
211020-88 = ""
211020-89 = "沒想到會有人說得這麼痛快……！"
211020-90 = "不。風紀委員會，你們也有問題。"
211020-91 = "什麼？"
211020-92 = "風紀委員會是打著守護格黑娜學園紀律與風氣的旗號而聚集的團體。"
211020-93 = "雖然很多人都說除了風紀委員長以外，其他人只是一群麻煩的傢伙……"
211020-94 = "你說什麼！？竟敢在我們面前光明正大地說這種話……！！"
211020-95 = "不過，我並不這麼認為。"
211020-96 = "嗯……？"
211020-97 = "就算撇開風紀委員長，風紀委員會也確確實實是格黑娜最強的武力團體。"
211020-98 = "但是！"
211020-99 = "明明擁有那樣的力量，你們做的卻只是對普通的問題學生動用暴力，#n或者跟萬魔殿無意義地爭吵而已。"
211020-100 = "不是，我們會先用說的！#n暴力……應該說，動用武力是之後的事！"
211020-101 = "呀哈，重點不是那個吧！"
211020-102 = "格黑娜擁有比任何學園都驚人的潛力卻無法團結一致，其中肯定也有你們的責任。"
211020-103 = "風紀委員會到底想要什麼？#n是像現在這樣鬆散的管制和紀律嗎？"
211020-104 = "還是說，你們只是用那些碰巧被看到的倒楣學生，在玩風紀委員的角色扮演遊戲？"
211020-105 = "什麼……？遊戲？"
211020-106 = "香蓮雖然說得比較直白，但並沒有說錯！#n風紀委員會什麼事都沒辦法確實做好不是嗎！"
211020-107 = "一直維持現在這種曖昧的立場，不採取積極行動的理由是什麼？"
211020-108 = ""
211020-110 = ""
211020-112 = "關於這點，我有話要說。"
211020-113 = "委，委員長……"
211020-114 = "委員長……！"
211020-115 = "曖昧……你們會這麼覺得也不奇怪。"
211020-116 = ""
211020-118 = ""
211020-119 = "既然如此，那就當作我們所期望的正是那份曖昧吧。"
211020-120 = ""
211020-122 = ""
211020-123 = "你們似乎希望我們建立起堅定的管制與紀律。"
211020-124 = "乍看之下或許不錯，但那跟我們想打造的格黑娜不一樣。"
211020-125 = "因為我們追求的是自由的格黑娜。"
211020-126 = "真是冠冕堂皇的說法。說得好像自由總是能朝正面的方向發揮一樣。"
211020-127 = "看看現在的格黑娜，自由早就變質成放縱了。"
211020-128 = "正因如此，才需要我們風紀委員會。#n我們就是劃下不可逾越之線的存在。"
211020-129 = "想越過那條線就得先越過我們，而我們會一直站在那裡守住那條線。"
211020-130 = "……"
211020-131 = ""
211020-133 = ""
211020-134 = ""
211020-135 = "哼，哼……裝帥並不代表真的就很帥……"
211020-136 = "總之，如果要下結論的話……"
211020-137 = "風紀委員會今後也打算繼續堅守現在這種曖昧的立場──我可以這樣解讀嗎？"
211020-138 = "要我回答的話，沒錯。"
211020-139 = "人家是這麼說的，委員長。"
211020-140 = "嗯。我聽到了。"
211020-141 = "風紀委員會的意志，我很清楚了！萬魔殿的想法我也很清楚了！！"
211020-142 = "也就是說，沒有任何人想讓格黑娜團結起來呢。"
211020-143 = "那就沒什麼好說的了！#n既然已經找出問題，接下來只要解決掉就行了！"
211020-144 = "你們打算做什麼？"
211020-145 = ""
211020-147 = ""
211020-148 = ""
211020-149 = ""
211020-150 = "我們為了打造團結一致的格黑娜……"
211020-151 = ""
211020-153 = ""
211020-154 = "要做各式各樣的事情！！"
211020-155 = ""
211020-157 = ""
211020-158 = ""
211020-159 = ""
211020-160 = "什麼……？"
211020-161 = "我不擅長處理細節，所以沒辦法在這裡把具體方案全部說出來……"
211020-162 = "總之，前輩們就好好看著我們怎麼做吧！！"
211020-163 = "因為格黑娜的改變，就要從此時此地開始了！！"
211020-164 = ""
211020-166 = ""
211020-167 = ""
211020-168 = ""
211020-169 = ""
211020-170 = ""
211020-171 = ""
211020-172 = "……真是有活力的後輩們。"
211020-173 = "哼……志氣是不錯，但終究只是毫無意義的行為罷了。"
211020-174 = "資歷和經驗都不足的後輩們再怎麼努力，也無法威脅到我真琴大人的地位。嘰嘻嘻！"
211020-175 = ""
211020-177 = ""
211020-178 = ""
211020-179 = ""
211020-180 = "好，好像會變得很有趣耶！"
211020-182 = "下一話;讓格黑娜偉大！"
