[translation]
211020-1 = "ตอนที่ 2;คณะกรรมการฟื้นฟูเกเฮนน่า"
211020-2 = ""
211020-3 = "พวกคุณคือ...?"
211020-4 = "หยุดการต่อสู้ที่ไร้ความหมายเถอะนะ พวกรุ่นพี่ทั้งหลาย"
211020-5 = "พวกเธอคือ...?"
211020-8 = ""
211020-9 = "ถ้าถามว่าพวกเราเป็นใครละก็"
211020-10 = "การตอบให้ก็ถือเป็นมารยาทอันดีงาม"
211020-11 = "ผู้ถือธงปฏิวัติที่จะทวงคืนศักดิ์ศรีที่เกเฮนน่าสูญเสียไป และสถาปนายุคแห่งเกียรติภูมิอันเจิดจรัส#nขึ้นมาใหม่"
211020-15 = "พวกเราคือ <คณะกรรมการฟื้นฟูเกเฮนน่า>!"
211020-16 = ""
211020-21 = "ยะฮ่า! เมื่อก่อนหน้านี้ยังทำท่าจะกินเลือดกินเนื้อกันอยู่เลย ตอนนี้เงียบลงหน่อยแล้วสินะ"
211020-22 = "ฉันคือผู้ช่วยหัวหน้าคณะกรรมการฟื้นฟูเกเฮนน่า เมียวรากุ คาเรน"
211020-25 = "ขอโทษที่ก่อความวุ่นวายค่ะ แต่การเปลี่ยนแปลงย่อมมาพร้อมแรงกระเพื่อมเสมอ"
211020-26 = "ฉันคือเลขานุการของคณะกรรมการฟื้นฟูเกเฮนน่า อิการาชิ โชโกะค่ะ"
211020-29 = "และฉันก็คือหัวหน้า ฟุริฮาตะ มายูมิ! ฝากตัวด้วยนะ!"
211020-31 = ""
211020-32 = "ฟื้นฟู... หมายถึงจะทำให้เกเฮนน่ากลับมาแข็งแกร่งและรุ่งเรืองอีกครั้งเหรอคะ?"
211020-33 = ""
211020-35 = ""
211020-37 = ""
211020-38 = "อื้ม! อย่างที่ว่าเลย!"
211020-39 = "คิกคิก! ช่างเป็นปณิธานที่หาญกล้ายิ่งนัก! เป็นรุ่นน้องที่มีจิตใจองอาจไม่เบาเลยนี่"
211020-40 = "แต่ว่า เรามีจุดที่ติดใจอยู่อย่าง"
211020-41 = "ที่บอกว่า 'อีกครั้ง' ทั้งๆ ที่ตอนนี้เกเฮนน่าก็แข็งแกร่งและรุ่งเรืองเพียงพอแล้ว"
211020-42 = "ทำไมถึงได้ใช้ถ้อยคำนั้นกันล่ะ?"
211020-43 = ""
211020-45 = ""
211020-46 = ""
211020-47 = ""
211020-48 = ""
211020-49 = "ถามว่าทำไมน่ะเหรอ"
211020-50 = "มันก็แน่นอนอยู่แล้วว่า..."
211020-51 = ""
211020-53 = ""
211020-54 = "เป็นเพราะเกเฮนน่าในตอนนี้ไม่ได้ยิ่งใหญ่ยังไงล่ะ!"
211020-55 = "ว่าไงนะ? หมายความว่ายังไง!"
211020-56 = "ก็ตามนั้นแหละ รุ่นพี่ประธาน เกเฮนน่าในตอนนี้ไม่เท่อีกต่อไปแล้ว"
211020-57 = "เหลวไหลสิ้นดี! ถ้าเกเฮนน่าที่เราปกครองอยู่ไม่ยิ่งใหญ่ แล้วจะมีอะไรยิ่งใหญ่ได้อีกกัน?!"
211020-58 = "ก็นั่นแหละที่เป็นปัญหา นั่นแหละ!"
211020-59 = "อะไรนะ!!"
211020-60 = ""
211020-62 = ""
211020-63 = "นั่นคือสิ่งที่พวกเราต้องการจะชี้ให้เห็นค่ะ"
211020-64 = "ตอนนี้เกเฮนน่าถูกตีตราว่าเป็นตัวตลกของคิโวทอส เป็นแหล่งรวมเด็กมีปัญหาค่ะ"
211020-65 = "แต่เกเฮนน่าในอดีตนั้นต่างออกไปค่ะ"
211020-66 = "พวกเราเคยประกาศความทะเยอทะยานไปทั่วคิโวทอส และทุกโรงเรียนต่างก็หวาดกลัว#nและยำเกรงเกเฮนน่าค่ะ"
211020-67 = "ไม่ว่าจะไปที่ไหน ทั้งโรงเรียนและนักเรียนก็ถูกมองว่าเป็นพวกตัวปัญหา "
211020-68 = "ไร้ซึ่งกฎระเบียบและวินัย! มีเพียงธรรมเนียมโรงเรียนอันแสนโกลาหล!"
211020-69 = "ท่านประธานมาโคโตะ และเหล่ากรรมการของแพนเดโมเนียม โซไซตี้"
211020-70 = "การที่เกเฮนน่าในตอนนี้กลายเป็นแบบนี้ พวกคุณต้องรับผิดชอบไม่น้อยเลยนะ!!"
211020-71 = "อึก!!"
211020-72 = "เรื่องนั้นน่ะ..."
211020-73 = "แพนเดโมเนียม โซไซตี้ แม้พวกคุณจะเป็นกลุ่มที่เป็นตัวแทนของนักเรียนเกเฮนน่า แต่กลับไม่ได้ทำหน้าที่ให้สมกับฐานะนั้นเลยค่ะ"
211020-74 = "เป็นเพียงกลุ่มที่ฉวยโอกาสจากความไม่แยแสของนักเรียน แล้วเอาแต่ผลาญงบประมาณไปกับ#nนโยบายพิลึกพิลั่นอยู่ร่ำไปเท่านั้นค่ะ"
211020-75 = "ส่วนใหญ่ก็จริงค่ะ แต่บางครั้ง นานๆ ทีก็ทำเรื่องดีๆ อยู่เหมือนกันนะคะ..."
211020-76 = "ต้องดีตลอดเวลาสิ! ไม่ใช่นานๆ ที!"
211020-77 = "พอลองสังเกตดูดีๆ พวกเธอกลับเอาเรื่องที่เป็นประโยชน์ต่อนักเรียนไว้ทีหลัง แล้วทุ่มสุดกำลังไปกับ#nการหาเรื่องคณะกรรมการวินัยอย่างเดียวเลย"
211020-78 = "อ่า ถ้าเรื่องนั้นก็มีแค่รุ่นพี่มาโคโตะค่ะ"
211020-79 = "เอางบประมาณที่มีจำกัดไปผลาญกับเรื่องเปล่าประโยชน์ จนไม่สามารถลงทุนในจุดที่จำเป็นจริงๆ ได้ แล้วผลก็คือศักยภาพการแข่งขันของเกเฮนน่าค่อยๆ ลดลงเรื่อยๆ! "
211020-80 = "ยิ่งไปกว่านั้น! นับตั้งแต่สนธิสัญญาเอเดนล่ม พวกเธอก็ไม่เคยแสดงท่าทีแข็งกร้าวต่อทรีนิตี้เลย#nไม่ใช่หรือไง?"
211020-81 = "นั่นเป็นเพราะเราคำนึงถึงข้อตกลงกับชาเล่ต์เป็นอันดับแรก..."
211020-82 = "แต่ยังไงผลลัพธ์ก็ไม่ต่างจากเกเฮนน่าเป็นฝ่ายยอมอ่อนข้อให้เลยนี่!"
211020-83 = "นั่นคือสิ่งที่ท่านประธานต้องการจริงๆ งั้นเหรอ? นั่นคือภาวะผู้นำและความใจกว้างที่ท่านประธานพูดถึง#nงั้นเหรอ?"
211020-84 = "อึก... ยัยพวกนี้ คิดจะยั่วโมโหเราหรือไง...!"
211020-85 = ""
211020-87 = ""
211020-88 = ""
211020-89 = "ไม่คิดเลยว่าจะมีคนพูดออกมาได้สะใจขนาดนี้...!"
211020-90 = "ไม่ค่ะ คณะกรรมการวินัย พวกคุณเองก็มีปัญหาเหมือนกันค่ะ"
211020-91 = "อะไรนะคะ?"
211020-92 = "คณะกรรมการวินัยคือกลุ่มที่รวมตัวกันภายใต้อุดมการณ์ในการพิทักษ์กฎระเบียบและความประพฤติ#nอันดีของสถาบันเกเฮนน่า"
211020-93 = "แม้จะมีหลายคนมองว่า ถ้าไม่นับประธานกรรมการวินัยแล้ว สมาชิกที่เหลือก็เป็นเพียงพวกน่ารำคาญ#nก็เถอะ..."
211020-94 = "ว่าไงนะ?! กล้าพูดแบบนั้นต่อหน้าพวกเราได้ยังไง...!!"
211020-95 = "แต่ฉันไม่ได้คิดแบบนั้นนะ"
211020-96 = "เอ๋...?"
211020-97 = "ถึงจะไม่นับประธานกรรมการวินัย คณะกรรมการวินัยก็เป็นกลุ่มติดอาวุธที่แข็งแกร่งที่สุดของเกเฮนน่า#nอย่างไร้ข้อกังขา"
211020-98 = "แต่ถึงอย่างนั้น!"
211020-99 = "ทั้งที่มีอำนาจถึงเพียงนั้น สิ่งที่พวกคุณทำกลับมีเพียงใช้ความรุนแรงกับเด็กเจ้าปัญหาทั่วๆ ไป หรือไม่ก็ทะเลาะกับแพนเดโมเนียม โซไซตี้อย่างไร้ความหมายเท่านั้น"
211020-100 = "ไม่ใช่สักหน่อย พวกเราคุยกันก่อนนะ! ส่วนความรุนแรง... ไม่สิ การใช้กำลังน่ะ เอาไว้ทีหลัง!"
211020-101 = "ยะฮ่า นั่นไม่ใช่ประเด็นสำคัญหรอก!"
211020-102 = "การที่เกเฮนน่าที่ที่มีศักยภาพมหาศาลยิ่งกว่าโรงเรียนไหนๆ กลับรวมเป็นหนึ่งเดียวไม่ได้ พวกเธอเองก็มีส่วนรับผิดชอบอย่างแน่นอน"
211020-103 = "คณะกรรมการวินัยต้องการอะไรกันแน่? ควบคุมและใช้กฎระเบียบแบบหละหลวมอย่างตอนนี้น่ะเหรอ?"
211020-104 = "หรือว่าก็แค่เล่นบทเป็นคณะกรรมการวินัย โดยเอานักเรียนโชคร้ายที่บังเอิญไปสะดุดตาเป็นเป้าหมาย#nกันแน่?"
211020-105 = "ว่าไงนะ...? แค่เล่นบทงั้นเหรอ?"
211020-106 = "คำพูดของคาเรนอาจจะแรงไปหน่อย แต่ก็ไม่มีตรงไหนผิดเลย! คณะกรรมการวินัยทำอะไรให้ชัดเจน#nสักอย่างไม่ได้เลยนี่!"
211020-107 = "มีเหตุผลอะไรที่ยังรักษาสถานะก้ำกึ่งแบบนี้ไว้ โดยไม่ยอมออกโรงอย่างจริงจังกว่านี้งั้นเหรอ?"
211020-108 = ""
211020-110 = ""
211020-112 = "เรื่องนั้น ฉันมีอะไรจะพูดหน่อย"
211020-113 = "ปะ... ประธาน..."
211020-114 = "ท่านประธาน...!"
211020-115 = "ก้ำกึ่ง... ก็อาจรู้สึกแบบนั้นได้"
211020-116 = ""
211020-118 = ""
211020-119 = "ถ้าอย่างนั้นก็ขอบอกไว้เลยว่า สิ่งที่พวกเราต้องการก็คือความก้ำกึ่งนั่นแหละ"
211020-120 = ""
211020-122 = ""
211020-123 = "ดูเหมือนพวกเธออยากให้พวกเราสร้างระบบควบคุมและกฎระเบียบที่เข้มงวดสินะ"
211020-124 = "มองเผินๆ มันอาจดูดี แต่แบบนั้นน่ะไม่ใช่เกเฮนน่าที่พวกเราอยากสร้างขึ้นมาหรอก"
211020-125 = "เพราะสิ่งที่พวกเรามุ่งหวังคือเกเฮนน่าที่เสรีต่างหากล่ะ"
211020-126 = "เป็นคำพูดสวยหรูที่มีดีแค่เปลือกค่ะ พูดเสียราวกับว่าเสรีภาพจะแสดงออกมาในทางสร้างสรรค์ได้เสมอ#nเลยนะคะ"
211020-127 = "สำหรับเกเฮนน่าในตอนนี้ เสรีภาพแปรสภาพเป็นการทำตามอำเภอใจมานานแล้วค่ะ"
211020-128 = "นั่นแหละคือเหตุผลที่คณะกรรมการวินัยต้องมีอยู่ พวกเราคือผู้ขีดเส้นขอบเขตที่ห้ามใครล้ำข้าม"
211020-129 = "ถ้าคิดจะล้ำขอบเขต ก็ต้องผ่านพวกเราไปให้ได้ก่อน พวกเราจะยืนหยัดอยู่ตรงนั้น คอยปกป้องเส้นขอบเขตนั้นเสมอ"
211020-130 = "..."
211020-131 = ""
211020-133 = ""
211020-134 = ""
211020-135 = "ฮะ... ฮึ่ม... ต่อให้ทำเป็นเท่ ก็ไม่ได้แปลว่าจะเท่จริงๆ สักหน่อย..."
211020-136 = "เอาเป็นว่า ถ้าจะให้สรุปก็คือ..."
211020-137 = "คณะกรรมการวินัยตั้งใจจะรักษาสถานะก้ำกึ่งในตอนนี้ต่อไปเรื่อยๆ#nเข้าใจแบบนี้ถูกต้องมั้ยคะ?"
211020-138 = "ถ้าให้ตอบ ก็ใช่"
211020-139 = "ทางนั้นว่าอย่างนั้นค่ะ หัวหน้า"
211020-140 = "อื้อ ได้ยินแล้ว"
211020-141 = "ฉันเข้าใจเจตจำนงของคณะกรรมการวินัยดีแล้ว! แล้วก็เข้าใจจุดยืนของแพนเดโมเนียม โซไซตี้#nดีแล้วเหมือนกัน!!"
211020-142 = "สรุปก็คือ ไม่มีใครอยากทำให้เกเฮนน่ารวมเป็นหนึ่งเดียวกันสินะ"
211020-143 = "ถ้างั้นก็ไม่มีอะไรต้องพูดอีกแล้ว! ในเมื่อรู้แล้วว่าปัญหาคืออะไร ก็แค่แก้ปัญหาเสียก็สิ้นเรื่อง!"
211020-144 = "จะทำอะไรคะ?"
211020-145 = ""
211020-147 = ""
211020-148 = ""
211020-149 = ""
211020-150 = "เพื่อสร้างเกเฮนน่าที่รวมเป็นหนึ่งเดียว..."
211020-151 = ""
211020-153 = ""
211020-154 = "พวกเราจะทำโน่นทำนี่ ทำสารพัดอย่างเลย!!"
211020-155 = ""
211020-157 = ""
211020-158 = ""
211020-159 = ""
211020-160 = "ว่าไงนะ...?"
211020-161 = "ฉันไม่ค่อยถนัดรายละเอียด เลยยังบอกแผนการที่เป็นรูปธรรมทั้งหมดตรงนี้ไม่ได้หรอก"
211020-162 = "แต่เอาเป็นว่า คอยจับตาดูสิ่งที่พวกเราจะทำให้ดีแล้วกันนะ พวกรุ่นพี่!!"
211020-163 = "ความเปลี่ยนแปลงของเกเฮนน่าจะเริ่มต้นขึ้นที่นี่ เดี๋ยวนี้เลยละ!!"
211020-164 = ""
