211020-178 = ""
211020-179 = ""
211020-180 = "ทะ... ท่าทางจะดูน่าสนุกขึ้นมาแล้วแฮะ!"
211020-182 = "ตอนต่อไป;ทำให้เกเฮนน่ายิ่งใหญ่!"
