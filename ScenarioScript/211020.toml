[translation]
211020-1 = "Episode 2;Gehenna Heritage League"
211020-2 = ""
211020-3 = "And you are...?"
211020-4 = "We're here to tell you to stop this pointless squabbling."
211020-5 = "That didn't answer her question."
211020-8 = ""
211020-9 = "Prepare for trouble!"
211020-10 = "And make it double!"
211020-11 = "To reclaim Gehenna's lost pride and restore an era of brilliant glory!"
211020-15 = "The Gehenna Heritage League has arrived!"
211020-16 = ""
211020-21 = "Yaha! It looks like things have quieted down now. To think, you seniors were ready to tear each other apart..."
211020-22 = "Myouraku Caren, Assistant Chair of the Gehenna Heritage League, at your service."
211020-25 = "Our apologies for the commotion. But a radical change is always followed by a shock."
211020-26 = "I am Igarashi Shouko, Secretary of the Gehenna Heritage League."
211020-29 = "And I am our humble president, Furihata Mayumi! Nice to meet you!"
211020-31 = ""
211020-32 = "By \"heritage\"... Do you mean to say that you're promoting some sort of Gehennan cultural revival?"
211020-33 = ""
211020-35 = ""
211020-37 = ""
211020-38 = "Yup! That's exactly right!"
211020-39 = "Kihe! You truly are ambitious! Our underclassmen display outstanding spirit."
211020-40 = "Nevertheless...one thing vexes me."
211020-41 = "You speak as if Gehenna isn't already thriving."
211020-42 = "Why would you imply such a thing?"
211020-43 = ""
211020-45 = ""
211020-46 = ""
211020-47 = ""
211020-48 = ""
211020-49 = "\"Why\" indeed...?"
211020-50 = "Naturally..."
211020-51 = ""
211020-53 = ""
211020-54 = "It's because the current Gehenna is anything but \"thriving\"!"
211020-55 = "Excuse me? What do you mean by that?!"
211020-56 = "We mean what we say, esteemed Chairman. The current Gehenna is no longer glorious. It's not even \"acceptable.\""
211020-57 = "Preposterous! If Gehenna is not glorious under my reign, then what possibly could be?"
211020-58 = "That's exactly the problem!"
211020-59 = "What?!"
211020-60 = ""
211020-62 = ""
211020-63 = "As she said. This is precisely the point we wish to make."
211020-64 = "Right now, Gehenna is branded as the laughingstock of Kivotos—a gathering place for troublemakers and misfits."
211020-65 = "But Gehenna used to be different. It had a respected reputation and a proud history."
211020-66 = "Our great school unfolded its ambitions across all of Kivotos, and every academy both feared and revered Gehenna."
211020-67 = "Now, schools and students everywhere treat us as troublemakers. Practically second-class citizens!"
211020-68 = "And why shouldn't they? There's no discipline here, no unity or school pride! It's all nothing but chaos."
211020-69 = "Chairman Makoto, and the members of the Pandemonium Society, I hereby declare..."
211020-70 = "You are responsible for Gehenna's sorry state!"
211020-71 = "Tch!!!"
211020-72 = "That's..."
211020-73 = "The Pandemonium Society. You, the best among us, represent the students of Gehenna, yet you have abdicated your sworn duties."
211020-74 = "You've become nothing more than a gang that exploits the students' apathy to waste our budget on bizarre policies."
211020-75 = "Sure, most of the time. But sometimes...rarely, QUITE rarely, we actually—"
211020-76 = "\"Rarely\" is not good enough! You should ALWAYS be working for the betterment of the school!"
211020-77 = "Most times, it feels like you're more invested in harassing the Prefect Team than helping us students."
211020-78 = "Well, that's only Makoto..."
211020-79 = "You waste the limited budget while neglecting where the money's actually needed! Because of you, Gehenna has lost its competitive power!"
211020-80 = "And that's not all. We haven't so much as formally DISAGREED with Trinity ever since the Eden Treaty fell through!"
211020-81 = "We prioritized our agreement with Schale..."
211020-82 = "In the end, though, it basically amounts to Gehenna backing down! We've lost our standing!"
211020-83 = "Is that what you really want, Chairman? Are these the actions of a capable and generous leader?"
211020-84 = "Tch... Are you taunting me...?!"
211020-85 = ""
211020-87 = ""
211020-88 = ""
211020-89 = "Well, THIS is a refreshing change of pace...!"
211020-90 = "Prefect Team, you are also part of the problem."
211020-91 = "What?"
211020-92 = "The Prefect Team is meant to uphold discipline and the public morals of Gehenna Academy."
211020-93 = "But what people are SAYING is that all of you, save the Head Prefect, are mere nuisances."
211020-94 = "What?! You've got some nerve...!"
211020-95 = "But I disagree with those people."
211020-96 = "Huh...?"
211020-97 = "Even without the Head Prefect, the Prefect Team is still the strongest armed force in Gehenna. I carry no doubts regarding that."
211020-98 = "And yet!"
211020-99 = "Even with such power, all you do is lash out at ordinary troublemakers and squabble with the Pandemonium Society."
211020-100 = "No, we always attempt to deescalate. Violence—I mean...necessary use of force, comes afterward!"
211020-101 = "Yaha, that's not our point!"
211020-102 = "We're saying that you also bear responsibility for the fact that Gehenna, an academy with boundless potential, has failed to unite as one."
211020-103 = "What is the Prefect Team's goal? Dubious order and discipline...like we have now? As we've had for a while?"
211020-104 = "Or do you only play at being the \"Prefect Team\" when targeting some rebellious students who happen to cross your path?"
211020-105 = "What...? \"Play\"?"
211020-106 = "Caren's words might be a little bit harsh, but she speaks the truth! The Prefect Team hasn't managed a single thing properly!"
211020-107 = "Why act so vaguely? Why not be proactive and enact real change?"
211020-108 = ""
211020-110 = ""
211020-112 = "I can answer that question."
211020-113 = "H-Head Prefect..."
211020-114 = "Head Prefect...!"
211020-115 = "\"Vague\"... You might see it that way."
211020-116 = ""
211020-118 = ""
211020-119 = "I'd say we have successfully fulfilled our role. There must be a place for vagueness, ambiguity."
211020-120 = ""
211020-122 = ""
211020-123 = "It seems like you want us to establish firm order and discipline."
211020-124 = "And while that might sound nice on paper, it is different from the Gehenna we are trying to create."
211020-125 = "Because what we seek is a free Gehenna."
211020-126 = "That only sounds good on the surface. You speak as if freedom is always positive."
211020-127 = "In today's Gehenna, freedom has long since degenerated into unbridled license."
211020-128 = "And that is why we, the Prefect Team, are here. We are those who draw the line that must not be crossed."
211020-129 = "To cross that line, one must go past us. And we will always stand our ground."
211020-130 = "..."
211020-131 = ""
211020-133 = ""
211020-134 = ""
211020-135 = "H-Hmph... Posturing at being \"cool\" does not make it reality..."
211020-136 = "Head Prefect, to summarize..."
211020-137 = "The Prefect Team will continue to maintain its vague position. Dubious, yet authoritative. Is that a fair interpretation?"
211020-138 = "Plainly, yes."
211020-139 = "That's her answer, President."
211020-140 = "Yes. I heard her."
211020-141 = "I understand the Prefect Team's sentiment! And the Pandemonium Society's, too!"
211020-142 = "So, no one wants to unite Gehenna into one."
211020-143 = "Then I have nothing more to discuss! Now that we know the problem, all that's left is to fix it!"
211020-144 = "What are you planning to do?"
211020-145 = ""
211020-147 = ""
211020-148 = ""
211020-149 = ""
211020-150 = "In order to unite Gehenna..."
211020-151 = ""
211020-153 = ""
211020-154 = "We'll do all sorts of things!"
211020-155 = ""
211020-157 = ""
211020-158 = ""
211020-159 = ""
211020-160 = "Like what...?"
211020-161 = "I'm not great at explanations, so I can't divulge all the details here and now..."
211020-162 = "But you should sit back and watch what we're about to do!"
211020-163 = "Because this is where Gehenna's future will be reborn!"
