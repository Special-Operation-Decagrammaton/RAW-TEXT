[translation]
13300-1 = "제30화;알 수 없는 것"
13300-3 = "대체 무슨 짓을 저지른 거예요!!"
13300-5 = "호, 호시노 쨩. 미안. 내가 실수해서 그만……."
13300-6 = "실수가 아니잖아요! 왜 또 속아 넘어가는 거예요!"
13300-7 = "미, 미안해……"
13300-8 = "정말이지…… 꿈과 희망으로 가득 찬 아비도스? 그런 걸 하려면 혼자서 하세요!!"
13300-9 = "호, 호시노 쨩……?"
13300-11 = "이제 학생회 따위 끝이에요! 이런 소꿉장난 따위 때려치워 버릴 테니까!"
13300-15 = "절 찾지 마시고 이제 혼자서 해결하시라구요!"
13300-20 = "……."
13300-22 = "아니에요. 선배……. 진심이 아니었어요."
13300-23 = "그냥 단순히 화가 나서…… 선배에게 화풀이를 했던 것이었어요……."
13300-24 = "적당히 연락을 끊었다가…… 돌아올 생각이었어요……."
13300-25 = "설마 그게 유메 선배의 마지막이라고는…… 저는 절대……. 상상도 하지 못했으니까……."
13300-28 = "유메 선배. 저 왔어요."
13300-29 = "……뭐, 지난 일은 됐어요. 다 잊어버렸으니까."
13300-30 = "그것보다……."
13300-37 = "……유메 선배?"
13300-38 = "이상하네…… 이 시간엔 언제나 여기에 있었는데…… 선배……."
13300-43 = "이건…… 종이쪽지……?"
13300-47 = "\"언제나 고마워. 호시노 쨩! 건강해야 해!\" ……?"
13300-50 = "유, 유메 선배?!"
13300-52 = "유메 선배."
13300-54 = "유메 선배."
13300-56 = "유메 선배."
13300-68 = "미안해…… 호시노 쨩. 지금 전파가 잘 터지@#$%"
