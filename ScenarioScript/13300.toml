13300-72 = "호시노 쨩…… 미안해."
13300-73 = "또 나침반을 안 챙겨왔어."
13300-74 = "쪽지로도 남겼는데 여기도 보낼게. 내 수첩은 거기 놔뒀으니까, 나중에 찾아가 줘."
13300-75 = "거기는 호시노 쨩도 알고 있@$^$%@#$야. 눈에 잘 띄게 뒀으니 찾기 쉬울 거야."
13300-78 = "호시노 쨩. 나는"
13300-80 = "유메 선배……."
13300-81 = "선배는 어째서 그 사막으로 갔던 거예요?"
13300-82 = "그 급한 볼일이라는 건 무슨 일이었나요? 제가 없는 동안 무슨 일들이 있었나요?"
13300-83 = "수첩을 놔뒀다는 <거기>는 어디죠? 어디를 가야 선배의 수첩을 찾을 수 있나요?"
13300-84 = "저에게 남겨 주려고 했던 그 수첩에는…… 선배의 어떤 말들이 적혀 있었나요?"
13300-85 = "제가 그걸 볼 방법이 있을까요? 그런 게 가능할까요?"
13300-86 = "이제 학생회 따위 끝이에요! 이런 소꿉장난 따위 때려치워 버릴 테니까!"
13300-88 = "유메 선배."
13300-89 = "제가 마지막으로 했던 말을 듣고 선배는 어떤 생각을 하셨나요? 어떤 기분을 느꼈나요?"
13300-90 = "<호시노 쨩. 나는>"
13300-91 = "그 마지막 메시지의 뒷부분은 무슨 말이 적혀 있었나요?"
13300-92 = "저는 어째서 그것들을 알지 못하는 걸까요?"
