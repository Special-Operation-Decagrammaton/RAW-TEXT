[translation]
11234020-1 = "#K-02"
11234020-3 = "그러고 보니 카즈사 쨩. 연주할 때는 마스크를 하고 있네."
11234020-4 = "……어라. 습관적인 건줄 알았는데. 물어보면 안 되는 쪽 아니었나."
11234020-6 = "……!? 뭐, 뭐가!? 이, 이거? 뭐. 그냥 좀……."
11234020-7 = "……??? 왜 부끄러워하는 거야? 괜찮은데? 이쁘고 좋지 않나?"
11234020-8 = "……!? 그, 그래? 진짜로……?"
11234020-9 = "…………."
11234020-10 = "뭔가 기분 나쁜 표정 짓고 있으니, 그냥 별로라고 할까."
