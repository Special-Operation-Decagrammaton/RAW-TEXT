[translation]
52160-1 = "제16화;조화"
52160-4 = "……찻물을 끓이고 남은 숯이 하얗게 내려앉았구나."
52160-5 = "이 숯도 한때는 흰 눈이 얹힌 나뭇가지였겠지."
52160-6 = "차의 향이 좋구나. 너도 한 잔 마시겠느냐, 슈로?"
52160-7 = "……네, 네! 코쿠리코 님이 주시는 것이라면……!"
52160-12 = "지난밤에는 수고가 많았다."
52160-13 = "아자미와 함께 협력하여 <토테이붓카이로쿠>의 힘으로 백화요란의 부원들을 물리치고, 샬레의 선생님까지 사로잡았다지."
52160-14 = "한 때는 두 사람이 서로 시기하여 반목하는 줄 알았는데, 이렇게 협력하여 훌륭히 성과를 보여주다니. 내 기쁘기 그지없구나."
52160-15 = "아, 아뇨! 이번 일은 협력이라기보다는 헤비온나가 멋대로—"
52160-16 = "아자미와 무슨 일이라도 있었느냐?"
52160-17 = "그, 그게 그러니까……"
52160-18 = "……헤비온나의 부탁 때문이 아니라, 코쿠리코 님을 위해 한 일이었으니까요."
52160-19 = "좋은 이야기에는 필연적으로 고난이 따르는 법이지."
52160-20 = "아자미와 너 사이에 무슨 일이 있었는지 내 알지는 못하나, 샬레의 선생님을 사로잡은 것은 오롯이 너의 공이다. 슈로."
52160-21 = "샬레의 선생은 풍문의 영향을 받지 않는 예측할 수 없는 변수. 절망을 희망으로, 비극을 희극으로 바꾸어 이야기에 개입하는 외부의 존재이니."
52160-22 = "풍문으로 괴담을 자아내는 우리 화조풍월부에게는 상극의 존재라고 할 수 있지."
52160-23 = "만일 그가 백화요란의 학생들을 도와 우리와 맞섰더라면, 괴서가 몇 권이나 존재했더라도 승리를 장담하기 어려웠을 게다."
52160-24 = "허나 이번에는 네가 선생을 유인해 준 덕분에 그를 다른 학생들로부터 떼어놓을 수 있었고, 어렵지 않게 그를 사로잡을 수 있었던 것이니. 나는 네가 자랑스럽구나, 슈로."
52160-25 = "코쿠리코 님……!"
52160-26 = "그런데 나로서도 이해가 가지 않는 것이 하나 있구나."
52160-27 = "언제나 스스로의 안위보다 학생을 우선시하던 샬레의 선생이, 자신의 학생을 내버려두고 적을 쫓다니. 선생에게 무슨 수라도 썼던 것이냐, 슈로?"
52160-32 = "그건……"
52160-36 = "………어?"
52160-37 = "……샬레의 선생님?"
52160-38 = "어째서 나를 대신해서 백물어의 공격을……"
52160-39 = "\"어쩐지 위험한 상황에 처한 것 같아서 도우러 왔어.\""
52160-40 = "하지만……"
52160-41 = "나는…… 당신을 죽이려 했잖아? 어째서 도울 필요가 있는데……"
52160-42 = "게다가 나는 당신을 따르는 학생도 아닌데. 도대체…… 무얼 착각하고 있는 거야?"
52160-43 = "몸을 바쳐서 나를 구해주면 개과천선해서 당신을 돕기라도 할 줄 알았어?!"
52160-44 = "\"위험에 빠진 아이를 구하는 데 이유는 필요하지 않아.\""
52160-45 = "\"그것은 당연한 사람의 [ruby=측은지심]본능[/ruby]이니까.\""
52160-49 = "……저도, 잘은 모르겠어요."
52160-50 = "본래 기행을 자주 저지르는 자였으니, 이번에도 갑작스럽게 변덕이라도 든 게 아니었을까요?"
52160-54 = "……그럴지도 모르지. 예측 불가한 것이 그의 장점이자 단점이니 말이다."
52160-55 = "저, 코쿠리코 님. 괜찮으시다면 질문을 하나 드려도 괜찮을까요?"
52160-56 = "그래. 편히 물어보거라."
52160-60 = "지난번, 샬레의 선생을 사로잡았을 때……"
52160-64 = "뭐하고 있어? 어서 샬레의 선생을 쏴!"
52160-75 = "어, 어째서……?"
52160-78 = "어찌된 일인지는 모르겠지만, 그때 <토테이붓카이로쿠>가 만들어 낸 츠쿠모가미는 백화요란의 부원들이 아닌 저를 공격했어요."
52160-79 = "본래 괴서에서 태어난 존재들은 '같은 편'에게는 위해를 끼치지 않을 텐데…… 혹시 괴서의 내용에 무언가 문제가 생긴 건 아닐까요?"
52160-84 = "……그래. 문제가 생겼을지도 모르지."
52160-85 = "그, 그렇죠? 이유도 없이 괴이가 저를 공격할 리가—"
52160-86 = "괴담의 근원이 되는 사람의 마음 또한 그만큼 불완전하고 덧없는 것이니 말이야."
52160-87 = "말 한마디, 사소한 오해에 속절없이 흔들리는 사람의 마음을 신뢰할 수 없는 것처럼. 그 마음에서 태어난 괴이 역시 어찌 신뢰할 수 있겠느냐."
52160-88 = "소문이 잦아들면 금세 사라져 없어질 괴이의 변덕 따윈 괘념치 말거라."
52160-93 = "이번에 백화요란과 동행했던 '그 아야메'는 진짜 아야메가 아닌, 나구사의 사념에서 태어난 일종의 백물어라고 들었어요."
52160-94 = "하지만 나구사와 함께하며 기뻐하고, 또 슬퍼하는 그 모습이 마치 사람 같아서……"
52160-95 = "최소한 그녀 자신은, 스스로를 사람으로 여기는 것처럼 보였습니다."
52160-96 = "……코쿠리코 님."
52160-97 = "괴담에서 태어난 백물어가, 자신을 살아있는 사람이라 생각하고 있을 수도 있나요?"
52160-101 = "……덧없는 물음이구나."
52160-102 = "그건 내가 답할 수도, 답할 필요도 없는 물음이야."
52160-103 = "어째서 그런 것을 내게 묻느냐?"
52160-104 = "혹시라도 제가…… 코쿠리코 님 이외의 과거를 기억하지 못하는 제가."
52160-105 = "소문이 잦아들었을 때 덧없이 사라지게 된다면……"
52160-110 = "……차가 식었구나."
52160-111 = "할 이야기는 그것 뿐이느냐?"
52160-112 = "잠시 본관에 다녀오마."
52160-113 = "백화요란도, 샬레의 선생님도 이곳에 있으니, 더 이상 그 누구도 우리의 이야기를 방해할 수 없겠지."
52160-114 = "풍문이 넘쳐흐르고 세상이 불타게 되면, 그때 이야기를 계속하자꾸나."
52160-121 = "………네."
52160-123 = "다음화;돌아온 부장"
