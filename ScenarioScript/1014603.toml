[translation]
1014603-1 = "The Chairman's Dizzying Summer"
1014603-2 = "After my messages with Makoto, I set out to visit the Pandemonium Society club room."
1014603-4 = "Seriously! What do you expect us to do?"
1014603-5 = ""
1014603-7 = ""
1014603-8 = "Exactly what I said to do. Disperse immediately."
1014603-9 = "You are attempting to occupy the square for military drills without permission. This could be interpreted as a threatening display of force."
1014603-10 = "I'm telling you that this is me applying for permission!"
1014603-11 = "And YOU, the Pandemonium Society, are the ones who approve the permits, right?"
1014603-12 = "You're not wrong."
1014603-13 = "However, the Prefect Team is actively disobeying the Pandemonium Society's orders. Therefore, we cannot approve your application for a permit."
1014603-14 = "Your stupid chairman is the one who set the damn location!"
1014603-15 = "You're blocking the way so we can't train! Then you're saying we're not training, so you can't approve our permit! Do you even hear yourself?!"
1014603-16 = "If you have complaints, you can take them up with our chairman."
1014603-17 = "Why, you..."
1014603-18 = ""
1014603-20 = ""
1014603-26 = "I left behind the increasingly rowdy plaza to look for Makoto in the Pandemonium Society club room."
1014603-28 = "...And the answer is to be a swimsuit model!"
1014603-29 = "Then I can reveal this look to the public without getting a single drop of water on my body!"
1014603-30 = "What a brilliant idea! As expected of me, kihehe!"
1014603-31 = "...Huh? Sensei, what's going on?"
1014603-32 = "You're not paying attention to me."
1014603-33 = "[s1] \"Well, you see...\"\n[s2] Explain what happened at the plaza."
1014603-36 = ""
1014603-38 = "I see. That's why you were distracted."
1014603-39 = "Excellent. I'm pleased to hear that my followers continue to dutifully carry out their work!"
1014603-40 = "Hm? Is something wrong, Sensei?"
1014603-41 = "[s3] \"I wouldn't say wrong...\"\n[s4] \"But you really don't like the Prefect Team...\""
1014603-44 = "...I'm surprised to hear you say that."
1014603-45 = "Perhaps your position as an educator is what makes it difficult for you to see?"
1014603-46 = "I don't have anything in particular against the Prefect Team."
1014603-47 = "The opposite, actually..."
1014603-48 = "And who actually likes that Prefect Team anyway?"
1014603-49 = "That's right! Survey every single student in Gehenna, and you won't find a single compliment in there!"
1014603-50 = "The very reason for their existence is discipline, which is an extension of suppression."
1014603-51 = ""
1014603-53 = ""
1014603-54 = "Their demands for students to fall in line stomp on the freedom we believe in!"
1014603-55 = "So why should we? Are we all really bad people if we don't?"
1014603-56 = "Of course we're not! Gehenna functions just fine without their discipline!"
1014603-57 = "They act like everything they do is to help the school!"
1014603-58 = "That's what makes it more superficial! Their true motivations are their own self-satisfaction, at the price of our students!"
1014603-59 = "The Prefect Team are the ones who should be disciplined! Thoroughly!"
1014603-60 = "...Ah. I got carried away."
1014603-61 = "I dislike even wasting my breath speaking about them."
1014603-62 = "[s5] \"Thanks for your honest answer.\"\n[s6] \"You've put a lot of thought into this.\""
1014603-65 = "You're the only person I can talk to about this."
1014603-66 = "The last thing I ever want is for the students to start to think!"
1014603-67 = "Once they start thinking, they start questioning, then they start to protest the system, and that threatens the advancement of my agenda!"
1014603-68 = "[s7] \"Phew! There's my Makoto!\"\n[s8] \"That smile's precious to me!\""
1014603-71 = "What do you...?"
1014603-72 = "AHHH!! I can't take it anymore! In fact, I refuse to take it anymore!!"
1014603-73 = ""
1014603-74 = "We can only put up with so much! You can only push someone so far!"
1014603-75 = "You're telling me to take it up with the chairman? Fine! FINE! Sounds like a grand idea!"
1014603-76 = "Hey, Chairman of the Pandemonium Society, come here!"
1014603-77 = "Fight me, now!!"
1014603-78 = ""
1014603-80 = "A member of the Prefect Team? How did they make it all the way in here?!"
1014603-81 = "Guard? Guard?! Are you neglecting your duty?! Remove this person, now!"
1014603-82 = ""
1014603-84 = ""
1014603-85 = "Ack! Wait, I ordered all of them to interfere with the Prefect Team today..."
1014603-86 = "Then there's no one around to stop them?!"
1014603-87 = ""
1014603-89 = ""
1014603-90 = ""
1014603-91 = "ARGHHH! I've finally found you, Chairman Makoto!"
1014603-92 = ""
1014603-94 = ""
1014603-95 = "W-Wait!!"
1014603-96 = ""
1014603-98 = ""
1014603-99 = "[ns] \"Why don't we all take it down a notch?\""
1014603-100 = "S-Sensei?"
1014603-101 = "[s9] \"I have a general understanding of the situation.\"\n[s10] \"Anything I can do to help?\""
1014603-104 = ""
1014603-107 = "[ns11] \"I know how unfair and frustrating this must feel.\"\n[ns12] \"But lashing out won't do anything to fix that.\""
1014603-110 = "I know that, okay?!"
1014603-111 = "*sigh* I know... That's what Head Prefect Hina would say too."
1014603-112 = "But I'm really at the end of my rope! They do this to us every time the Head Prefect and Senior Administrator aren't around!"
1014603-113 = ""
1014603-115 = ""
1014603-117 = ""
1014603-118 = "[ns13] \"Makoto, would you please?\"\n[ns14] \"For my sake.\""
1014603-121 = "Ah, ahh. Fine. It was for training?"
1014603-122 = "I'll take care of it. Do your training. You have my word."
1014603-123 = "Is that enough?"
1014603-124 = "...I know I came in guns blazing, but I promise I wasn't really going to do anything."
1014603-125 = "*sigh*... Okay."
1014603-126 = ""
1014603-128 = ""
1014603-129 = "..."
1014603-130 = "[s] \"I'm sorry, Makoto.\""
1014603-131 = "...Hm? For what?"
1014603-132 = "[s15] \"For what happened just now.\"\n[s16] \"For asking you to compromise.\""
1014603-135 = ""
1014603-138 = "[ns] \"You said you don't believe in compromise...\""
1014603-139 = "...It's as you said."
1014603-140 = "You saw that the Prefect Team member's frustrations were justified by their mistreatment and forced my hand into a compromise."
1014603-141 = "It's a suppression of my freedom in its own right."
1014603-142 = "But strangely... I'm not annoyed."
1014603-143 = "Apologies, but please give me a little space for now."
1014603-144 = "I need time to sort out my thoughts."
1014603-146 = "So I left Makoto to contemplate her feelings and headed back home."
