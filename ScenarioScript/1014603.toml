[translation]
1014603-1 = "慌張議長的夏天"
1014603-2 = "（接到真琴的聯絡後，前往萬魔殿部室的途中）"
1014603-4 = "不是，你們到底要我們怎樣啦！！"
1014603-5 = ""
1014603-7 = ""
1014603-8 = "就是字面上的意思。現在立刻給我解散。"
1014603-9 = "突然佔據廣場搞軍事訓練……是打算發動武力示威嗎？"
1014603-10 = "不是不是，就說了我們是想申請訓練許可啊。"
1014603-11 = "剛才不是還說，核發許可的是萬魔殿嗎？"
1014603-12 = "這話倒是沒錯。"
1014603-13 = "但風紀委員會現在不服從萬魔殿的指示，意圖極為不純，很難核發許可。"
1014603-14 = "把訓練場地指定在這裡的，就是你們議長啊！！"
1014603-15 = "不讓我們訓練，又說沒有訓練不能核發許可是什麼道理啊！！"
1014603-16 = "有什麼不滿就直接去跟議長反映吧。"
1014603-17 = "這些傢伙，一忍再忍還得寸進尺……"
1014603-18 = ""
1014603-20 = ""
1014603-26 = "（……離開吵鬧的廣場，前往了萬魔殿的部室）"
1014603-28 = "……也就是說，本大人要擔任泳裝模特兒！"
1014603-29 = "這樣就能在身上不沾一滴水的情況下，把這副模樣公開給大眾看了！"
1014603-30 = "多麼高明的點子啊！真不愧是本大人，嘻嘻！"
1014603-31 = "……嗯？老師，怎麼了？"
1014603-32 = "你從剛才開始好像就不太專心啊。"
1014603-33 = "[s1] 「其實是這樣的……」\n[s2] 說明在廣場發生的事"
1014603-36 = ""
1014603-38 = "原來如此。發生了那種事啊。"
1014603-39 = "看來就算在我看不到的地方，我們萬魔殿的幹部們也把事情辦得很漂亮嘛！"
1014603-40 = "嗯？那是什麼反應，老師？"
1014603-41 = "[s3] 「沒有，雖然現在才說有點晚……」\n[s4] 「只是覺得你真的很討厭風紀委員會啊……」"
1014603-44 = "……真是意外。沒想到老師會說這種話。"
1014603-45 = "不，正因為是老師，所以才不明白嗎？"
1014603-46 = "並不是只有本大人特別討厭風紀委員會。"
1014603-47 = "倒不如說正好相反。"
1014603-48 = "說到底，真的有學生喜歡風紀委員會嗎？"
1014603-49 = "哼！沒有！本大人敢斷言，不管去問格黑娜的哪個學生，都不會有什麼好話吧！"
1014603-50 = "因為他們所謂「整頓風紀」的行為，本質上不過是壓迫罷了。"
1014603-51 = ""
1014603-53 = ""
1014603-54 = "壓抑個人的自由，強迫他人服從秩序。"
1014603-55 = "為什麼非得那麼做不可？#n難道格黑娜的學生真的全是些不管就不行的麻煩人物嗎？"
1014603-56 = "不，並非如此。就算不那樣做，格黑娜也運作得好好的。"
1014603-57 = "說什麼風紀，說什麼是為了學園的行動！"
1014603-58 = "那只是偽善！不！#n為了自我滿足而強迫他人犧牲，可說是比偽善更惡劣。"
1014603-59 = "在本大人看來，風紀委員會才真正需要被「整頓風紀」呢。"
1014603-60 = "……哎呀，閒話扯得太久了嗎。"
1014603-61 = "那些傢伙的事，說了也只會讓人不愉快。"
1014603-62 = "[s5] 「不會，謝謝你坦白告訴我。」\n[s6] 「你想了很多事呢。」"
1014603-65 = "我會說這種話的對象，也就只有老師而已。"
1014603-66 = "畢竟特地讓學生們去思考也沒什麼好處！"
1014603-67 = "一旦開始思考就會對體制產生疑問，進而威脅到我們的榮華富貴！嘰嘻嘻！"
1014603-68 = "[s7] 「太好了！是平常的真琴！」\n[s8] 「好想守護這個笑容……」"
1014603-71 = "那又是什麼意思……？"
1014603-72 = "嗚啊啊啊！！我受不了了！！不對，我不忍了！！"
1014603-73 = ""
1014603-74 = "忍氣吞聲也要有個限度！每次都這樣……！"
1014603-75 = "叫我去找議長理論？好啊，就這麼辦！"
1014603-76 = "喂，萬魔殿的議長給我出來！"
1014603-77 = "跟我單挑吧！！"
1014603-78 = ""
1014603-80 = "什麼！？風紀委員怎麼會跑到部室這裡來……！？"
1014603-81 = "親衛隊！親衛隊在做什麼！還不快把這傢伙趕出去！"
1014603-82 = ""
1014603-84 = ""
1014603-85 = "糟了！這麼說來，我把親衛隊全派去妨礙風紀委員會那些傢伙了！？"
1014603-86 = "也就是說，現在沒有人能擋住那個傢伙……！？"
1014603-87 = ""
1014603-89 = ""
1014603-90 = ""
1014603-91 = "可惡！！找到了，真琴議長！！"
1014603-92 = ""
1014603-94 = ""
1014603-95 = "等，等一下！！"
1014603-96 = ""
1014603-98 = ""
1014603-99 = "[ns] 「要不要稍微冷靜一下？」"
1014603-100 = "老，老師？"
1014603-101 = "[s9] 「狀況我了解了。」\n[s10] 「能讓我幫忙嗎？」"
1014603-104 = ""
1014603-107 = "[ns11] 「我知道你又氣又悶……」\n[ns12] 「但現在發火，反而會讓狀況變得更糟哦。」"
1014603-110 = "可是……！"
1014603-111 = "……唉。這倒是沒錯啦。"
1014603-112 = "不過你要我們怎麼辦啊。#n委員長和首席行政官前腳才剛離開，他們就這樣找麻煩……"
1014603-113 = ""
1014603-115 = ""
1014603-117 = ""
1014603-118 = "[ns13] 「真琴，可以拜託你一件事嗎？」\n[ns14] 「就當是給我一個面子。」"
1014603-121 = "啊，啊啊。好吧。是訓練的事吧？"
1014603-122 = "那件事我會處理好，確保不會再有人說三道四。"
1014603-123 = "這樣就行了吧？"
1014603-124 = "……好吧。雖然是一時衝動才闖進來的，我也沒打算真的把這裡砸個稀巴爛……"
1014603-125 = "唉……我知道了。"
1014603-126 = ""
1014603-128 = ""
1014603-129 = "…………"
1014603-130 = "[s] 向真琴道歉"
1014603-131 = "嗯？老師，為什麼突然道歉……？"
1014603-132 = "[s15] 「因為我剛才做的事。」\n[s16] 「是讓你們雙方都退讓了吧。」"
1014603-135 = ""
1014603-138 = "[ns] 「那正是真琴說討厭的那種做法吧？」"
1014603-139 = "……確實是這樣沒錯。"
1014603-140 = "老師剛才剝奪了遭受不當對待的風紀委員發火的自由，#n也硬是強迫本大人拿出了妥協方案。"
1014603-141 = "那和本大人討厭的風紀委員會的「風紀」的確很像。"
1014603-142 = "不過，這種有別於不快的感覺到底是……？"
1014603-143 = "抱歉，今天能給我一點時間嗎？"
1014603-144 = "要把生意的事談完，我現在腦子有點亂。"
1014603-146 = "（就這樣留下獨自陷入沉思的真琴，悄悄離開了部室）"
