[translation]
1014603-1 = "ฤดูร้อนของท่านประธานผู้ชวนใจหวิว"
1014603-2 = "(คุณครูกำลังมุ่งหน้าไปยังห้องชมรมแพนเดโมเนียม โซไซตี้หลังได้รับการติดต่อจากมาโคโตะ)"
1014603-4 = "อะไรกัน จะให้พวกเราทำยังไงกันแน่เนี่ย!!"
1014603-5 = ""
1014603-7 = ""
1014603-8 = "ก็ตามที่พูดนั่นละ ต้องสลายตัวเดี๋ยวนี้เลย"
1014603-9 = "มาบุกยึดจัตุรัสแบบไม่ทันตั้งตัวเพื่อฝึกทางทหารเนี่ยนะ... คิดจะแสดงแสนยานุภาพหรือไง?"
1014603-10 = "ไม่ใช่ ก็บอกอยู่ว่าจะขออนุญาตฝึกซ้อมไงคะ"
1014603-11 = "เมื่อกี้ก็บอกเองไม่ใช่เหรอคะว่าคนที่อนุญาตให้ได้คือแพนเดโมเนียม โซไซตี้?"
1014603-12 = "ก็ไม่ผิดหรอก"
1014603-13 = "แต่ตอนนี้คณะกรรมการวินัยกำลังขัดคำสั่งของแพนเดโมเนียม โซไซตี้ เจตนาไม่บริสุทธิ์อย่างยิ่งแบบนี้ ยิ่งทำให้อนุญาตได้ยาก"
1014603-14 = "ก็คนที่กำหนดให้ที่นี่เป็นสถานที่ฝึกซ้อมก็คือประธานของพวกเธอไม่ใช่#nหรือไง!!"
1014603-15 = "ตัวเองมาขัดขวางไม่ให้ฝึกซ้อมเองแท้ๆ!! แต่กลับมาบอกว่าอนุญาตให้ไม่ได้เพราะไม่ฝึกซ้อมกัน แบบนี้มันหมายความว่ายังไง!!"
1014603-16 = "ถ้าไม่พอใจ ก็ไปร้องเรียนกับท่านประธานโดยตรงสิ"
1014603-17 = "พวกนี้นี่ ยิ่งอดทนให้ก็ยิ่งได้ใจ..."
1014603-18 = ""
1014603-20 = ""
1014603-26 = "(คุณครูทิ้งจัตุรัสที่วุ่นวายไว้เบื้องหลัง แล้วมุ่งหน้าไปยังห้องชมรมแพนเดโมเนียม โซไซตี้)"
1014603-28 = "นั่นก็คือ... นางแบบชุดว่ายน้ำ!"
1014603-29 = "ถ้าเป็นแบบนั้น ก็จะเผยโฉมต่อสาธารณชนได้โดยที่ตัวไม่ต้องเปียกน้ำแม้แต่หยดเดียว!"
1014603-30 = "ช่างเป็นความคิดที่เฉียบแหลมอะไรเช่นนี้! สมแล้วที่เป็นเรา คิกคิกคิก!"
1014603-31 = "หืม...? ครู เป็นอะไรไปเหรอ?"
1014603-32 = "ดูเหมือนจะไม่ค่อยมีสมาธิมาตั้งแต่เมื่อกี้แล้วนะ"
1014603-33 = "[s1] \"คือว่านะ...\"\n[s2] เล่าเรื่องที่เกิดขึ้นที่จัตุรัส"
1014603-36 = ""
1014603-38 = "อย่างนี้นี่เอง มีเรื่องแบบนั้นเกิดขึ้นสินะ"
1014603-39 = "ถึงจะเป็นที่ที่เรามองไม่เห็น แต่พวกสมาชิกแพนเดโมเนียม โซไซตี้ของเราก็จัดการงานได้อย่าง#nยอดเยี่ยมเลยสินะ!"
1014603-40 = "หืม? ท่าทีแบบนั้นคืออะไรกัน ครู?"
1014603-41 = "[s3] \"เปล่าหรอก ถึงจะไม่ใช่เรื่องใหม่ก็เถอะ...\"\n[s4] \"แค่คิดว่าทางนี้เกลียดคณะกรรมการวินัยกันจริงๆ สินะ...\""
1014603-44 = "ช่างไม่คาดคิดจริงๆ... เราไม่นึกเลยว่าครูจะพูดแบบนั้น"
1014603-45 = "ไม่สิ เพราะเป็นครูถึงได้ไม่รู้หรือเปล่า?"
1014603-46 = "ไม่ใช่ว่าเราเกลียดคณะกรรมการวินัยเป็นพิเศษหรอกนะ"
1014603-47 = "กลับกันเสียด้วยซ้ำ"
1014603-48 = "ปกติแล้วมันมีนักเรียนที่ชอบคณะกรรมการวินัยด้วยเหรอไงกัน?"
1014603-49 = "ฮึ่ม! ไม่มีหรอก! เรายืนยันได้เลยว่าต่อให้ไปถามนักเรียนคนไหนของเกเฮนน่า ก็คงไม่มีคำพูดดีๆ ออกมาแน่!"
1014603-50 = "เพราะการกระทำที่เรียกว่า 'คุมวินัย' ที่พวกนั้นทำอยู่ โดยแก่นแท้แล้วก็เป็นแค่การกดขี่เท่านั้น"
1014603-51 = ""
1014603-53 = ""
1014603-54 = "ทั้งกดทับอิสรภาพส่วนบุคคล ทั้งบังคับให้ทำตามระเบียบ"
1014603-55 = "ทำไมต้องทำแบบนั้นด้วยนะ? เป็นเพราะนักเรียนเกเฮนน่ามีแต่พวกตัวป่วน จนถึงขั้นที่จำเป็นต้องทำ#nแบบนั้นเลยงั้นเหรอ?"
1014603-56 = "เปล่า ไม่ใช่เลย ต่อให้ไม่ทำแบบนั้น เกเฮนน่าก็ดำเนินไปได้ดีอยู่แล้ว"
1014603-57 = "อะไรคือการคุมวินัย อะไรคือการทำเพื่อโรงเรียนกันแน่!"
1014603-58 = "ก็แค่ความหน้าซื่อใจคด! ไม่สิ! ที่จริงแล้วพวกนั้นบังคับให้คนอื่นเสียสละเพื่อความพอใจของตัวเอง ถ้างั้นก็พูดได้ว่าเลวร้ายกว่าหน้าซื่อใจคดเสียอีก"
1014603-59 = "ในสายตาของเราแล้ว คณะกรรมการวินัยต่างหากที่น่าจะต้องถูก 'คุมวินัย' อย่างแท้จริง"
1014603-60 = "ให้ตายสิ นี่เราพูดเรื่องไร้สาระยืดยาวเกินไปหรือเปล่านะ..."
1014603-61 = "พูดถึงคนพวกนั้นไปก็ไม่ได้มีอะไรน่าสบอารมณ์นักหรอก"
1014603-62 = "[s5] \"ไม่หรอก ขอบใจนะที่พูดออกมาตรงๆ\"\n[s6] \"มาโคโตะคิดอะไรหลายอย่างอยู่เหมือนกันนะ\""
1014603-65 = "ก็นะ คนที่เราจะคุยเรื่องแบบนี้ด้วย ก็มีแค่ครูเท่านั้นละ"
1014603-66 = "เพราะการจงใจทำให้พวกนักเรียนคิด มันไม่ได้มีอะไรดีเลยน่ะสิ!"
1014603-67 = "ถ้าคิด ก็จะเกิดข้อสงสัยต่อโครงสร้าง แล้วนั่นก็จะเป็นภัยต่อความสำเร็จของพวกเรา! คิกคิกคิก!"
1014603-68 = "[s7] \"ค่อยยังชั่ว! มาโคโตะคนเดิมกลับมาแล้ว!\"\n[s8] \"อยากปกป้องรอยยิ้มนี้ไว้จัง...\""
1014603-71 = "พูดแบบนั้นหมายความว่า...?"
1014603-72 = "อ๊ากกก!! ทนไม่ไหวแล้ว!! ไม่สิ ไม่ทนแล้ว!!"
1014603-73 = ""
1014603-74 = "จะให้ทนแล้วปล่อยผ่านก็ได้แค่ครั้งสองครั้งเท่านั้น! ฉันไม่ยอมให้ทุกครั้งหรอก...!"
1014603-75 = "ให้ไปต่อว่ากับประธานของเธองั้นเหรอ? ได้ งั้นฉันจะไปเอง!"
1014603-76 = "นี่ ประธานแพนเดโมเนียม โซไซตี้ ออกมานะ!"
1014603-77 = "มาสู้กันสักตั้ง!!"
1014603-78 = ""
1014603-80 = "อะไรกัน?! สมาชิกคณะกรรมการวินัยเข้ามาถึงห้องชมรมได้ยังไง...?!"
1014603-81 = "กองกำลังป้องกัน! กองกำลังป้องกันทำอะไรอยู่! ยังไม่รีบไล่ยัยนี่ออกไปอีก!"
1014603-82 = ""
1014603-84 = ""
1014603-85 = "จริงสิ! เราส่งกองกำลังป้องกันออกไปขัดขวางพวกคณะกรรมการวินัยหมดแล้วนี่นา?!"
1014603-86 = "ถ้างั้น ตอนนี้คนที่จะหยุดยัยนั่นได้ก็ไม่มีเลยสักคน...?!"
1014603-87 = ""
1014603-89 = ""
1014603-90 = ""
1014603-91 = "ฮึ่ม!! เจอตัวแล้ว ประธานมาโคโตะ!!"
1014603-92 = ""
1014603-94 = ""
1014603-95 = "ดะ... เดี๋ยวก่อน!!"
1014603-96 = ""
1014603-98 = ""
1014603-99 = "[ns] \"ใจเย็นๆ กันก่อนดีมั้ย?\""
1014603-100 = "คะ... คุณครู?"
1014603-101 = "[s9] \"ครูเข้าใจสถานการณ์แล้ว\"\n[s10] \"ขอให้ครูช่วยได้มั้ย?\""
1014603-104 = ""
1014603-107 = "[ns11] \"ถึงจะโมโหและอึดอัดใจก็เถอะ...\"\n[ns12] \"ถ้าโมโหตอนนี้ สถานการณ์จะยิ่งแย่ลงกว่าเดิมนะ\""
1014603-110 = "ไม่สิ แต่ว่า!"
1014603-111 = "เฮ้อ... เรื่องนั้นก็ถูกอยู่หรอกค่ะ"
1014603-112 = "แต่จะให้พวกเราทำยังไงล่ะคะ พอท่านประธานกับเจ้าหน้าที่อาวุโสไม่อยู่ปุ๊บ ก็มาแกล้งกันแบบนี้..."
1014603-113 = ""
1014603-115 = ""
1014603-117 = ""
1014603-118 = "[ns13] \"มาโคโตะ ครูขอร้องได้หรือเปล่า?\"\n[ns14] \"มาโคโตะ ถือว่าครูขอเถอะนะ\""
1014603-121 = "อะ... อ้อ เข้าใจแล้ว เรื่องการฝึกซ้อมสินะ?"
1014603-122 = "เรื่องนั้นเราจะจัดการให้เอง ต่อไปจะไม่มีการบ่นอะไรอีกแน่ สัญญาเลย"
1014603-123 = "แค่นี้ก็พอแล้วใช่มั้ย?"
1014603-124 = "ก็นะ... ถึงฉันจะบุกเข้ามาเพราะเลือดขึ้นหน้า แต่ก็ไม่ได้คิดจะพังอะไรจริงๆ หรอก..."
1014603-125 = "งั้นก็ได้... ถือว่ารับทราบแล้วค่ะ"
1014603-126 = ""
1014603-128 = ""
1014603-129 = "..."
1014603-130 = "[s] \"มาโคโตะ ขอโทษนะ\""
1014603-131 = "หืม? ทำไมจู่ๆ ครูถึงขอโทษล่ะ...?"
1014603-132 = "[s15] \"ก็เรื่องที่เพิ่งทำไปเมื่อกี้ไง\"\n[s16] \"ครูทำให้ทั้งสองฝ่ายต้องยอมถอยให้กันนี่นา\""
1014603-135 = ""
1014603-138 = "[ns] \"นี่เป็นวิธีแบบที่มาโคโตะบอกว่าไม่ชอบใช่มั้ยล่ะ?\""
1014603-139 = "ก็จริงอย่างที่ว่า..."
1014603-140 = "เมื่อกี้นี้ ครูพรากเสรีภาพในการโกรธของสมาชิกคณะกรรมการวินัยที่ถูกกระทำอย่างไม่เป็นธรรม แล้วยังบีบให้เราต้องยื่นข้อประนีประนอมออกมาด้วย"
1014603-141 = "นั่นไม่ได้ต่างอะไรมากนักจาก 'การคุมวินัย' ของคณะกรรมการวินัยที่เราไม่ชอบจริงๆ"
1014603-142 = "แต่ว่า ความรู้สึกนี้ที่มันต่างจากความขุ่นเคือง มันคืออะไรกันแน่...?"
1014603-143 = "ขอโทษนะ แต่วันนี้เราขอเวลาสักหน่อยได้มั้ย?"
1014603-144 = "ตอนนี้เรายังสับสนอยู่หน่อย คงคุยเรื่องงานต่อให้จบไม่ไหวน่ะ"
1014603-146 = "(คุณครูทิ้งมาโคโตะที่จมอยู่กับความคิดเพียงลำพังไว้แบบนั้น แล้วเดินออกจากห้องชมรมไปเงียบๆ)"
