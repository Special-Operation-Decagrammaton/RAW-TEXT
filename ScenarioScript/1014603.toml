[translation]
1014603-1 = "慌てる議長の夏"
1014603-2 = "（マコトから連絡をもらって、万魔殿に向かっていると……）"
1014603-4 = "えっと……私たちにどうしろって言うんですか！！"
1014603-8 = "だから、今伝えた通り、解散するように。"
1014603-9 = "広場を占拠して軍事訓練だなんて……デモでもするつもりなのか？"
1014603-10 = "だから、訓練の許可申請をしたんですけど……。"
1014603-11 = "さっき[ruby=パンデモニウム・ソサエティー]、万魔殿に[/ruby]許可申請をしろって言ってましたよね？"
1014603-12 = "そうだが……。"
1014603-13 = "こうも反抗的な態度をとっている風紀委員を見過ごすわけにはいかない。#n広場での訓練はやめてもらおう。"
1014603-14 = "あんた達の議長が訓練場所をここに指定したんじゃない！！"
1014603-15 = "そっちの指定に従ったら許可を出せないってどういうこと！？"
1014603-16 = "不満があるなら、議長に直接言うんだな。"
1014603-17 = "ほんっと……何なの？"
1014603-26 = "（……騒がしい広場を後にして、万魔殿へ向かった）"
1014603-28 = "……水着モデルをすればいい！"
1014603-29 = "そうすれば、陸にいながらこの姿を披露できるという算段だ！"
1014603-30 = "どうだ？素晴らしい案だろう？キキッ！"
1014603-31 = "……ん？先生、どうしたんだ？"
1014603-32 = "さっきから心ここにあらずといった様子だが……。"
1014603-33 = "[s1] \"実はさっき……。\"\n[s2] 広場で起きたことを説明する。"
1014603-38 = "ふむ。"
1014603-39 = "マコト様が見ていなくても、我々万魔殿はちゃんと働いているようだな！"
1014603-40 = "ん？どうした、先生？"
1014603-41 = "[s3] \"いや、今更だけど……。\"\n[s4] \"本当に風紀委員会が嫌いなんだなと思って……。\""
1014603-44 = "……先生がそんなことを言うとは。"
1014603-45 = "いや、先生だからこそ分からないのか？"
1014603-46 = "別に私だけが、風紀委員会を嫌っているわけじゃない。"
1014603-47 = "そうだとも――[ruby=・   ・   ・]私だけ[/ruby]ではないのだ。"
1014603-48 = "そもそも、風紀委員を好む理由があるのか？"
1014603-49 = "断言しよう！ゲヘナの全生徒に同じ質問を投げかけたとしても、#n皆一様に口を閉ざすだろう！"
1014603-50 = "なぜなら、やつらの「風紀を正す」という行為が、抑圧に過ぎないからだ。"
1014603-54 = "個人の自由を抑圧し、秩序を押しつける。"
1014603-55 = "なぜ、そうする必要がある？#n本当にゲヘナは、そうしなければならないほど問題児だらけなのか？"
1014603-56 = "否――そんなことをしなくとも、ゲヘナは問題ない。"
1014603-57 = "取り締まり、逮捕、処罰……これのどこが学園のためになるというのだ！"
1014603-58 = "ただの偽善ではないか！#nいや、自己満足で他人に犠牲を強いるなど、悪質としか言いようがない。"
1014603-59 = "風紀委員会こそ「正す」必要があるのではないか？"
1014603-60 = "はぁ……つまらぬことを語ってしまったな。"
1014603-61 = "あいつらに関して話したところで、不毛なだけだ。"
1014603-62 = "[s5] \"そっか……正直に話してくれて、ありがとう。\"\n[s6] \"いろいろと考えているんだね。\""
1014603-65 = "……こんなことを話すのは、先生くらいなものだぞ。"
1014603-66 = "生徒に考えさせたところで意味はない！"
1014603-67 = "考え始めた途端に体制へ疑問を抱くようになり――#nひいては万魔殿を脅かすことになるからな！キシシッ！"
1014603-68 = "[s7] \"いつものマコトで安心したよ！\"\n[s8] \"そのままのマコトでいて……。\""
1014603-71 = "それは、どういう……？"
1014603-72 = "あー！もう我慢できない！！#n我慢なんかするもんか！！"
1014603-74 = "本当に毎度毎度……こっちにも我慢の限界ってものがあるのよ！"
1014603-75 = "議長に直接言え？ええ、分かったわよ！"
1014603-76 = "万魔殿の議長、出てきなさい！"
1014603-77 = "――私と勝負だ！"
1014603-80 = "なにぃ！？風紀委員が、こんなところにまで……！？"
1014603-81 = "親衛隊！何をしている！#n早くあいつをつまみ出せ！"
1014603-85 = "……そういえば、親衛隊には風紀委員の対応をさせていたんだったな？"
1014603-86 = "ということは……あいつをつまみ出せるのは……？"
1014603-91 = "マコト議長！！お覚悟！"
1014603-95 = "ちょ、ちょっと待ってくれ！！"
1014603-99 = "[ns] \"二人とも落ち着いて。\""
1014603-100 = "せ、先生？"
1014603-101 = "[s9] \"状況は分かってる。\"\n[s10] \"私に手伝わせてもらえないかな？\""
1014603-107 = "[ns11] \"イライラするだろうけど……。\"\n[ns12] \"感情的になっても、状況は良くならないよ。\""
1014603-110 = "でも！"
1014603-111 = "……はぁ、そうですね。"
1014603-112 = "ですが、どうすればいいんですか。#n委員長も行政官も出払ってて……。"
1014603-118 = "[ns13] \"マコト、ちょっとお願いしてもいいかな？\"\n[ns14] \"私の顔を立てると思って。\""
1014603-121 = "あ、ああ。訓練の件だな？"
1014603-122 = "これ以上口出しはしない。約束しよう。"
1014603-123 = "であれば問題ないだろう？"
1014603-124 = "……まあ、カッとなってここまで来ちゃったけど。#n本当にめちゃくちゃにするつもりはなかったし……。"
1014603-125 = "はぁ……失礼しました。"
1014603-129 = "…………。"
1014603-130 = "[s] \"マコト、ごめんね。\""
1014603-131 = "ん？先生、なぜ謝る？"
1014603-132 = "[s15] \"さっき私が言ったことで……。\"\n[s16] \"二人に譲歩させちゃったよね。\""
1014603-138 = "[ns] \"マコトが嫌なやり方だったと思うし。\""
1014603-139 = "……ああ、その通りだ。"
1014603-140 = "先生は、不当な扱いを受けた風紀委員の怒る自由を奪い、この私にも妥協案を出すよう押しつけた。"
1014603-141 = "それは、まさにこのマコト様が嫌う、風紀委員会の「やり方」だ。"
1014603-142 = "しかし、不思議と不快感はない……どういうことだ？"
1014603-143 = "申し訳ない。今日は、ここまでとさせてもらえるだろうか。"
1014603-144 = "少し、頭の整理をする時間が欲しい。"
1014603-146 = "（そうして思索にふけるマコトを残し、万魔殿を後にした）"
