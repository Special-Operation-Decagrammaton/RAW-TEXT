[translation]
1012205-1 = "해변에서 반짝이는 무언가"
1012205-3 = "(바람을 쐬러 해변으로 나왔다.)"
1012205-12 = "[ns] \"미카, 뭐해?\""
1012205-13 = "아, 선생님!!"
1012205-18 = "후후후, 이거 봐."
1012205-19 = "[ns] \"이건…… 조개껍데기?\""
1012205-20 = "응응☆ 어때? 예쁘지?"
1012205-21 = "해변가의 조개껍데기는 대부분 깨져있지만, 잘 찾아보면 이렇게 깨끗하고 예쁜 아이들이 있다?"
1012205-22 = "후후, 뭔가 낭만적이기도 하고."
1012205-23 = "예쁜 아이들을 모아서 목걸이라도 만들까나☆"
1012205-24 = "[s] \"그러고 보니 미카는 꾸미는 걸 좋아했지.\""
1012205-25 = "응응! 귀엽고 예쁜 것들 잔뜩 모았었어."
1012205-26 = "뭐, 지금은 거의 다 없어졌지만. 새로운 것도 별로 안 샀고."
1012205-27 = "일단 소비를 줄인 지도 꽤 됐으니까!!"
1012205-28 = "요즘은 가계부 어플도 쓰고 있다구?"
1012205-29 = "[s] \"오, 대단한데?\""
1012205-30 = "후후후, 그렇지?"
1012205-34 = "……물론 매일매일 쓰는 건 아니지만."
1012205-35 = "귀찮아서 몰아 쓰다 보니까, 영수증을 잃어버리면 그대로 펑크가 나버리기도 하고……"
1012205-36 = "그, 그래도 쓴다는 거에 의미를 두고 있어."
1012205-37 = "[s1] \"그게 어디야. 장하다, 미카.\"\n[s2] \"왠지 내 행동을 되돌아보게 됐지만……\""
1012205-40 = "헤헤, 칭찬이지? 고마워!"
1012205-41 = "오? 예쁜 아이 발견☆"
1012205-46 = "이 소라껍데기, 메르지엘라의 귀걸이와 닮았네!"
1012205-47 = "꽤 좋아하던 건데. 럭키~☆"
1012205-48 = "물론 고가의 주얼리와 비교하기는 어렵겠지만……"
1012205-49 = "조개나 소라껍데기도 나름대로 예쁘지 않아?"
1012205-50 = "[s] \"그러게. 예뻐.\""
1012205-51 = "아하하. 그 말, 나한테 하는 거였으면 더 좋았을 텐데. 막 이래☆"
1012205-55 = "[ns] \"미카, 뭔가 즐거워 보여.\""
1012205-56 = "응?"
1012205-57 = "[ns] \"뭐랄까, 전보다 여유로워진 것 같네.\""
1012205-58 = "우와~ 뭐야, 그거."
1012205-59 = "느긋해진 느낌……?"
1012205-60 = "그런가? 흠……"
1012205-61 = "여유가…… 생긴 건가……?"
1012205-62 = "……"
1012205-66 = "[ns] \"미카……?\""
1012205-67 = "음. 음음."
1012205-68 = "뭐, 많은 일이 있었으니까!"
1012205-69 = "응응. 그치. 이런저런 일들."
1012205-70 = "……"
1012205-74 = "선생님, 저쪽으로 가볼까? 이쪽은 거의 다 본 것 같거든!"
