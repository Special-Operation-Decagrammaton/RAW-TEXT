[translation]
80000004-1 = "아로나의 발렌타인 데이 선물!"
80000004-2 = "아로나의 교실"
80000004-3 = "안녕하세요, 선생님!"
80000004-4 = "한 해가 시작된 이후로 꽤 시간이 지났네요!"
80000004-5 = "그래서 말인데요… 선생님은 오늘이 무슨 날인지 알고 계신가요?"
80000004-6 = "[s] \"발렌타인 데이!\""
80000004-7 = "딩동댕~ 정답입니다!"
80000004-8 = "오늘은 발렌타인 데이…… 꽃과 같은 소녀들이 좋아하는 상대에게 초콜릿을 선물하는 로맨틱한 기념일이에요."
80000004-9 = "후후. 그래서 오늘은 아로나도 정말 좋아하는 선생님을 위해 수제 초콜릿을 만들었답니다!"
80000004-13 = "어디 보자……"
80000004-17 = "짠!"
80000004-18 = "어떤가요, 선생님?"
80000004-19 = "아로나가 무얼 만들었는지 알아보시겠어요?"
80000004-20 = "[s1] \"이거 혹시……\"\n[s2] \"나야?\""
80000004-21 = "네, 맞아요!"
80000004-22 = "네, 맞아요!"
80000004-23 = "아로나와 선생님 모양으로 구워 만든 특제 초코 진저 쿠키랍니다!"
80000004-24 = "이 리본 모양의 초콜릿, 귀엽죠?"
80000004-25 = "생강 과자로 먼저 틀을 만들고 그 위에 화이트 초콜릿을 뿌려 완성했어요."
80000004-26 = "(킁킁) 그 때문인지 어쩐지 손에서 조금 생강 냄새가 나는 것 같지만……."
80000004-27 = "선생님을 위해 아침부터 열심히 만들었다고요! 헤헤……."
80000004-28 = "아로나가 열심히 만든 발렌타인 데이 선물이니, 소중히 간직해주세요!"
