[translation]
2000103-1 = "공부는 어려워 1"
2000103-2 = "도서관"
2000103-3 = "아, 선생님? #n도서관에는 웬일이야?"
2000103-4 = "응? 나야말로 시험은 끝났는데 왜 왔냐고?"
2000103-5 = "그…… 나는 추가 시험이라서……."
2000103-6 = "[s1] \"추가 시험? 전부 낙제라는 말이야?\"\n[s2] \"카린은 바보구나.\""
2000103-7 = "……!"
2000103-8 = "……!"
2000103-9 = "아, 아니야!"
2000103-10 = "그…… 성적은…… 좋은 편은 아니지만……"
2000103-11 = "나도 낙제는 처음이라고."
2000103-12 = "하아. 어쩔 수 없었어."
2000103-13 = "C&C는 일반 부활동과 약간 달라."
2000103-14 = "낮에는 일반적인 봉사부원 느낌이지만, 밤에는 밀레니엄의 에이전트가 되어야 하지."
2000103-15 = "공부도 해야 하고, 에이전트 활동도 해야 하고, #n나 같은 경우에는 아르바이트도 중요한 편이라 몸이 세 개라도 모자랄 지경이야."
2000103-16 = "[s] \"아르바이트?\""
2000103-17 = "아아. 금전적인 문제를 떠나, 내게는 두 가지 꿈이 있어."
2000103-18 = "그중 하나는 언젠가 예쁜 카페의 여주인이 되는 거야."
2000103-19 = "물론 공부도 중요하지만, 다양한 가게를 경험해 보는 게 더 중요한 분야니까."
2000103-20 = "하지만 아무래도 공부랑은 친해지기가 어렵……"
2000103-21 = "아!"
2000103-22 = "서, 선생님."
2000103-23 = "마침 도움을 필요로 하는 여학생이 있다."
2000103-24 = "선생님은…… 선생님이지?"
2000103-25 = "내 공부, 도와주지 않겠어?"
2000103-26 = "과외 수업을 해달라는 게 아니다. 여기 내가 정리해둔 문제 풀이가 있어."
2000103-27 = "여기에 있는 문제들 중, 임의로 내게 물어보는 건 어때?"
2000103-28 = "[s3] \"내게 맡겨.\"\n[s4] \"왜 문제 중에 쓰리사이즈에 대한 질문은 없는 거지?\""
2000103-29 = "고마워!"
2000103-30 = "그, 그런 걸 대체 왜 적어!"
2000103-31 = "자, 그럼 시작하자!"
2000103-34 = "……."
2000103-35 = "[s5] \"국가의 물가가 하락하고, 전반적인 경제 활동이 침체되는 현상을 일컫는 말은?\"\n[s6] \"삼권분립은, 입법, 사법, 그리고?\""
2000103-36 = "정답! 디스토피아!"
2000103-37 = "……어? 디플레이션이라고? 으음. 거의 맞췄는데."
2000103-38 = "정답! 헌법!"
2000103-39 = "……어? 행정이라고? 무, 물론 알고 있어. 절반은 맞췄다고 봐도 무방하겠군."
2000103-40 = "자, 자! 다음 문제를 내줘."
2000103-41 = "선생님의 목소리, 어쩐지 듣기 좋군."
2000103-42 = "오래 기억할 수 있을 것 같아."
2000103-43 = "[s] \"두 번째 꿈은 뭐야?\""
2000103-44 = "정답! 현모양처…… 가 아니라!"
2000103-45 = "그, 그건…… 에 그러니까…… 좀 부끄러워서……"
2000103-46 = "……나, 나중에 말해줄게! 아까 한 말은 잊어!"
2000103-47 = "자! 다음 문제는 뭐지?"
2000103-48 = "이번엔 반드시 맞추겠다."
