[translation]
103010-1 = "제1화;역할"
103010-4 = "백귀야행 대설원의 어딘가"
103010-7 = "니야가 말한 목적지는 이제 얼마 안 남은 거 같은데……."
103010-8 = "부장! 츠쿠요 공! 그런데 아까 전부터 괴물들의 숫자가 점점 보이지 않는 것 같은 기분인데요? 착각일까요?"
103010-9 = "그런가? 그러고 보니 그런 기분이……."
103010-10 = "네, 네! 확실히 대설원에 들어오고 나서 적들과 조우하는 빈도가 줄긴 한 것 같은……."
103010-15 = "앗, 부장! 하늘이 이상해요! 저것 보세요!"
103010-16 = "어, 어라……?"
103010-25 = "하늘이……."
103010-27 = "워, 원래 하늘로 변했어요?"
103010-28 = "네! 주군이 해내신 거예요!"
103010-30 = "그, 그런가!"
103010-32 = "선생 공, 샬레가 해냈구나!"
103010-36 = "우, 우냐아아앗-?! 그렇게 말하자마자 저, 적이다?!"
103010-37 = "아, 아니에요! 이건 총소리……."
103010-44 = "……적이 아니었나 보네. 실례."
103010-47 = "!!"
103010-48 = "우냐앗-!"
103010-49 = "사람을 공격해 놓고 실례라고 하면 끝이냐-!"
103010-53 = "……어라?"
103010-55 = "다, 당신은 누구신가요?"
103010-57 = "그러는 너희는? 보아하니 백귀야행 학생들인 것 같은데. ……이런 외진 곳엔 왜 온 거야?"
103010-58 = "저, 저희는……."
103010-59 = "네! 저희는 <황혼의 사원>을 찾아왔어요! 백화요란의 부장을 찾기 위해서요!"
103010-60 = "네, 네…… 맞아요. <샬레>의 선생님의 부탁으로……."
103010-62 = "……. 과연, 그렇단 말이지……."
103010-69 = "맞아!! 생각났어!"
103010-71 = "부, 부장님……?!"
103010-73 = "그 의상……!! 낯이 익어!"
103010-78 = "틀림없이 백화요란의 제복이야!! 그렇지? 맞지?!"
103010-85 = "네? 백화요란요?"
103010-86 = "그, 그럼 설마…… 당신이……?"
103010-88 = "아, 아냐……"
103010-89 = "백화요란의 부장인 아야메는…… 잘 기억나진 않지만 이런 얼음 같은 이미지는 아니었어. ……좀 더, 뭐랄까. 반짝반짝거리는 인싸, 같은 느낌이었달까……."
103010-90 = "……아, 얼음이라고 하면? 그, 그러고 보니 부부장이 그런 느낌이었지?"
103010-92 = "부부장요?"
103010-93 = "그럼 당신이 백화요란의 부부장, 이신가요?"
103010-95 = "아니."
103010-97 = "으잉? 아니라고?!"
103010-99 = "그래. 사람을 잘못 본 거야."
103010-100 = "아니아니, 시치미 떼지 마! 장담하는데 그 의상은 백화요란이 맞잖아!! 그럼 그건 뭔데! 입고 있는 그 제복은!"
103010-101 = "이건……."
103010-102 = "……코스프레야."
103010-104 = "과연……."
103010-105 = "그런 것이군요……! 그런 거라면……."
103010-107 = "아니! 그런 엄청난 우연이 있을 리가 있겠냐고?!"
103010-108 = "때로는, 그런 우연도 있을 수 있어."
103010-109 = "코스튬 플레이어들은 자고로 기적의 한 장을 찍기 위해서라면 백귀야행의 대설원도, 아비도스의 대사막도, 오디세이아의 대해양도 가리지 않는 법이니까."
103010-111 = "오, 오오…… 코스튬 플레이어의 귀감이란 거군요!"
103010-112 = "괴, 굉장해요……!"
103010-114 = "그, 그건 그럴 수도 있……"
103010-115 = "는 게 아니라, 설사 그렇다 치더라도 당신! 촬영 장비도 뭣도 없잖아!"
103010-117 = "그건…………."
103010-118 = "장비가 없어도 괜찮아. 정말로 귀중한 추억은 실물이 아니라 마음에 남기는 것만으로도 충분하니까."
103010-120 = "아니……. 코스프레니까 마음의 카메라로는 내 모습을 찍을 수 없지 않아?"
103010-121 = "설마…… 지금 이거 적당한 말 둘러대고 있는 거 아냐……?"
103010-123 = "……!"
103010-124 = "…………으, 으으."
103010-126 = "부, 부장?! 분명 저 분에게도 뭔가 사정이 있을 거라고 생각해요!"
103010-127 = "아, 아니, 별로 상처를 줄 생각은 없었는데…… 그, 카메라가 없는 것이 신경이 쓰였을 뿐, 가지고 있지 않다면 빌려줄까~하고……."
103010-129 = "……. 나는……. 그렇지만……."
103010-134 = "쿨럭……!!"
103010-136 = "저기 괘, 괜찮으신가요……?"
103010-137 = "저는 카메라가 없어도 괜찮다고 생각해요. 의상을 입는 것만으로도 기분이 바뀌기도 하고……."
103010-138 = "……혼자 있게 해줘."
103010-140 = "우냐앗! 미, 미안해……!"
103010-142 = "나는 고료 나구사. 백화요란의 부부장."
103010-143 = "지금은…… 사정이 있어, 홀로 이곳에 찾아왔지만."
103010-144 = "……역시 백화요란이었네."
103010-145 = "사정은 대충 이해했어. 인법연구부. 하지만 헛수고니까 돌아가도록 해."
103010-146 = "네, 네? 어, 어째서……."
103010-147 = "<황혼의 사원>은 파괴된 지 오래야. 지금은 이 어딘가의 눈 아래에 묻혀 있겠지."
103010-149 = "……네? 그, 그런……."
103010-151 = "그럼 부장을 찾을 방법은……."
103010-153 = "없어."
103010-154 = "그러니 돌아가도록 해. 그리고 여기서 나와 만난 건, 비밀로 해주었으면 고맙겠어."
103010-155 = "하, 하지만 저희는 <샬레>의 부탁으로……."
103010-156 = "……샬레, 라면, 들어본 적 있어."
103010-157 = "분명……. 아니, 그렇다면……."
103010-161 = "대신 이걸 선생님에게 전해줘."
103010-163 = "이건…… 낡은 두루마리?"
103010-164 = "……내용은 나도 몰라."
103010-165 = "원래라면 부장…… 아야메가 해야 할 일이었겠지만, 거기에 샬레의 선생님에게 전하는 말이 적혀 있다고 들었어."
103010-166 = "누, 누가요……? 저희가 여기 올 걸 어떻게 알고……?"
103010-167 = "……."
103010-171 = "확실하게 전해줬으니까. 그럼."
103010-176 = "가버렸어요……."
103010-177 = "뭐라고 적혀 있는 거야?"
103010-178 = "저, 저희가 봐도 되는 내용일까요?"
103010-179 = "뭐 어때. 봉인되어 있지도 않잖아."
103010-183 = "어디……."
103010-195 = "[ns] \"……시로코?\""
103010-196 = "……."
103010-197 = "……여기까지 해냈구나, 선생님. 응. 역시 대단하네."
103010-198 = "하지만 결정된 미래를 바꿀 수는 없어. 키보토스는 파국을 맞이하게 될 거야."
103010-199 = "[s] \"시로코……!! 기다려, 너는…….\""
103010-200 = "아냐. 선생님."
103010-201 = "[s] \"…………!!\""
103010-202 = "……색채에 의해 내가 조종당하고 있는 거라고 생각한다면, 물론 그렇게 생각하는 쪽이 마음이 편하겠지만…… 그런 건 아니야."
103010-206 = "응. 이건 나의 [ruby=본질]의지[/ruby]."
103010-207 = "나는 예정된 미래로 이 세계를 이끄는 역할을 맡았을 뿐이고, 색채는 그저 그 방법들 중 하나에 불과해."
103010-208 = "오히려…… 내가 색채를 이용하고 있다고 보는 게 맞을 거야."
103010-209 = "[s] \"………!!\""
103010-210 = "응. 나는 모든 생명을 [ruby=저승]다른곳[/ruby]으로 인도하는 역할이니까, 이건 스나오오카미 시로코가 이 세계에 존재한 순간 확정된 미래."
103010-217 = "이미 결정된 미래는 아무도 바꿀 수는 없어. 그게 이 세계의 법칙."
103010-218 = "……하지만 선생님을 다치게 하고 싶진 않아. 그러니 키보토스를 조용히 떠났으면 해."
103010-219 = "그러면 나는 선생님을 쏘는 미래만큼은 피할 수 있겠지."
103010-220 = "[s] \"…………!!!\""
103010-221 = "응, 선생님을 [ruby=키보토스]이곳[/ruby]으로 최초로 인도하는 것도……. 최후로 배웅하는 것도……. 그게 아마 나에게 주어진 [ruby=본질]역할[/ruby]인 것 같아."
103010-228 = "하지만…… 그 역할을 수행해야만 하는 순간이 온다면, 나는 망설이지 않을 거야."
103010-229 = "그러니……."
103010-237 = "선생님! 큰일 났습니다!!"
103010-238 = "지금 다시 키보토스 전역에 에너지 반응이……!"
103010-245 = "……크, 크윽?!"
103010-256 = "다, 당신은 아비도스의……?!"
103010-257 = "뭐, 뭐야?! 방금 린 선배가 총을 쏜 거야?! 엄청 희귀한 장면인데!! 우, 우와아-?!"
103010-258 = "치, 침입자예요! 지, 지금 사람들을 불렀어요……!!"
103010-263 = "치, 침입자라고요? 대체……."
103010-267 = "어, 어라……?"
103010-273 = "……. 시, ……시로코…… 선배……?"
103010-275 = "……."
103010-280 = "[ns] \"기다려, 시로코!!\""
103010-281 = "서, 선생님!! 멈추세요! 따라가시면 안 됩니다!!"
103010-282 = "우와아아- 무모한 짓을?!"
103010-285 = "[ns] 시로코가 사라진 공간으로 몸을 날린다."
103010-311 = "……."
103010-312 = "[ns] (여기는……!?)"
103010-317 = "[ns] \"……!!!\""
103010-319 = "[ns] \"네가 바로 색채의 인도자……!?\""
103010-329 = "서, 선생님!!"
103010-330 = "우, 우와앗?! 튕겨 나왔잖아, 괜찮아?"
103010-332 = "서, 선생님…… 시로코 선배는…… 시로코 선배는 대체……."
103010-334 = "연결 통로…… 같은 건 사라졌어요."
103010-340 = "시로코 선배……!!"
103010-342 = "다음화;다음 목표"
