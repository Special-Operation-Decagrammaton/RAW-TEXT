[translation]
10010085-1 = "제8화;조금 닮은 사람들 2"
10010085-7 = "도착했어요! 여기가 그 구호기사단 별관이로군요."
10010085-8 = "……어라?"
10010085-9 = "그러고 보니 선생님. 캠퍼스 안에 있는 구호기사단 본관이 아니라 여기로 오셨네요?"
10010085-10 = "굳이 본관이 아닌 이곳으로……. 뭔가 다른 이유라도 있으신 건가요?"
10010085-14 = "……네? 아는 사람이 있으시다고요?"
10010085-15 = "빠르게 대화가 통할 사람……이라고요? 어떤 분이신가요……?"
10010085-16 = "[s1] \"이제 곧 만날 거야.\"\n[s2] \"어차피 슬슬 나올 때가 됐거든.\""
10010085-17 = "……네? 그게 무슨……"
10010085-18 = "……네? 그게 무슨……"
10010085-19 = "오셨군요, 선생님. 기다리고 있었답니다."
10010085-20 = "……어?"
10010085-24 = "후후……. 선생님께서 먼저 찾아오신 건 꽤 오랜만이네요. 왠지 기쁜 걸요."
10010085-25 = "아, 안녕하세요. 히나타 씨? 반가워요."
10010085-26 = "……네? 아, 아……. 안녕하세요. 네……."
10010085-27 = "어라……. 그런데 어떻게 제 이름을……?"
10010085-28 = "선생님……? 말씀하신 분이 이분이신가요? 확실히 구호기사단 분이긴 한데……."
10010085-29 = "……아, 내 정신 좀 봐."
10010085-30 = "죄송해요. 우선 저희가 이번에 이렇게 들르게 된 이유부터……."
10010085-31 = "아아. 괜찮아요. 그러잖아도 슬슬 오실 때가 돼서 기다리고 있었거든요."
10010085-32 = "……? ……네?"
10010085-34 = "한시가 바쁘신 상황이시죠? 바로 안내해 드릴게요. 들어오세요~."
10010085-40 = "선생님……?"
10010085-41 = "혹시 오시기 전에 미리 연락이라도 하셨었나요? 그런 모습은 못 봤었는데……."
10010085-42 = "[s3] \"음. 그렇다고 해 두는 편이 편하려나.\"\n[s4] \"뭐, 사소한 건 신경 쓰지 말자고.\""
10010085-43 = "그, 그게 무슨……. 그렇다고 해 둔다니요……?"
10010085-44 = "어어……. 네, 네에……."
10010085-45 = "……도대체 어떻게 된 걸까요……."
10010085-52 = "정성약이라. 확실히, 구호기사단의 보유 시약품 목록에도 올라와 있는 거네요."
10010085-53 = "아주 옛날에 사용되던 약이라, 지금 당장 꺼낼 순 없고 시약 창고를 좀 찾아봐야 할 거 같긴 하지만요."
10010085-54 = "사실 그런 옛날 약이더라도, 규정대로라면 빼낼 때마다 별도의 승인 절차를 거쳐야 하지만……."
10010085-55 = "이번에는 시간이 없으니, 우선 가져가 주세요. 보고서엔 제가 기록해 둘게요."
10010085-60 = "필요한 양은……. 두 병 정도 내 드리면 넉넉하시겠죠? 히나타 씨."
10010085-61 = "아……. 네, 네에……."
10010085-62 = "……저기, 선생님……? 저……. 아직 이해가 잘……."
10010085-63 = "이 분……. 어떻게 이렇게 잘 알고 계시는 건지……."
10010085-64 = "[s5] \"익숙해지면 오히려 편해.\"\n[s6] \"준비성이 철저한 아이거든.\""
10010085-65 = "그, 그렇군요……. 대단하신 분이네요……."
10010085-66 = "그, 그렇군요……. 대단하신 분이네요……."
10010085-74 = "음……. 제 예상대로라면 아마 저쪽 벽에 늘어서 있는 시약 중에……."
10010085-80 = "……어라."
10010085-81 = "잠시만요. 관리실에서 연락이……."
10010085-85 = "……네, 네. ……네. 지금 바로요?"
10010085-86 = "음……. 아, 아뇨. 물론 가능하죠. ……네. ……네에."
10010085-90 = "……음……. 그……."
10010085-91 = "저기, 선생님……. 죄송한데……."
10010085-92 = "[s7] \"괜찮아. 일이 더 중요하지.\"\n[s8] \"이쪽은 걱정 말고 다녀와.\""
10010085-93 = "그, 그……. 네……. 감사합니다……."
10010085-94 = "그, 그……. 네……. 감사합니다……."
10010085-95 = "죄송해요. 마음 같아선 저도 같이 찾아 드리고 싶은데, 갑자기 환자분들이 몰려서……."
10010085-96 = "……환자분들이요? 무슨 일이라도 있는 건가요?"
10010085-97 = "아, 대단한 일은 아니에요. 이번 주는 정의실현부 정기 순회주간이라서요."
10010085-98 = "정의실현부 부원들이 트리니티 교내는 물론, 교외의 자치구까지 한 바퀴 쭉 도는 일정이다 보니……."
10010085-99 = "그 과정에서……. 가령 불량배분이라든가, 헬멧단분들……."
10010085-100 = "아……. 그렇군요. 이해했어요."
10010085-101 = "그럼 엄청 바쁘시겠네요. 일손도 부족하실 거 같고……."
10010085-102 = "아하하……. 네. 사실 조금 그런 상태죠……. 여기는 별관이다 보니 파견된 인력도 적거든요."
10010085-103 = "사실상 지금 시간대의 이 병동은, 저 혼자서 모든 환자분들을 받아야 하는 상황이고요."
10010085-104 = "네, 네!? 혼자서요!? 이 병동 전체를요……?"
10010085-105 = "네. 그래서 가끔은 환자 분들을 잘 돌봐 드리지 못하고 있지 못하는 게 아닐까 하는……. 그런 걱정도 하곤 하지만……."
10010085-106 = "그래도 일단 제가 할 수 있는 선에서는 최선을 다해야 하니까요. 그게 제 일이고요."
10010085-108 = "……."
10010085-109 = "아무튼 그런 상황이라……. 죄송합니다, 선생님. 잠시 자리를 좀 비우도록 할게요."
10010085-110 = "최대한 빨리 돌아오겠습니다. 그럼 이만……."
10010085-119 = "……."
10010085-120 = "……저기, 선생님……."
10010085-121 = "……그……. 저기……. 저……."
10010085-122 = "[s9] \"알고 있어. 역시 도와주고 싶은 거지?\"\n[s10] \"다녀와. 그동안 내가 찾고 있을게.\""
10010085-123 = "……선생님……!"
10010085-124 = "……선생님……!"
10010085-125 = "가, 감사합니다. 금방 다녀올게요!"
10010085-132 = "어머, 히나타 씨."
10010085-136 = "도와주셔서 감사해요. 그러잖아도 바쁘실 텐데……."
10010085-137 = "그, 그러니까 아직 아무 말씀도 안 드렸는데 어떻게 내용을 아시는 건가요……. 맞긴 하지만……."
10010085-139 = "(…….)"
10010085-140 = "[ns] 약병을 찾기 시작한다."
10010085-144 = "(이후 문제없이 정성약을 찾아내고 두 사람을 기다렸다.)"
10010085-151 = "(일이 끝나고 돌아오는 두 사람의 표정은 환하게 밝았다.)"
