[translation]
11100-2 = "제10화;실마리를 찾아서"
11100-3 = "아비도스 주택가"
11100-6 = "어머, 안녕하세요, 선생님. 좋은 아침입니다."
11100-7 = "네? 이른 아침부터 어딜 가냐고요?"
11100-8 = "아아. 오늘이 학교 대출 이자를 상환하는 날이라서…… 이것저것 준비를 하느라고요."
11100-9 = "일찍 학교에 가서 상환 준비도 해야 하고…… 앞으로의 계획도 세워야 하고……."
11100-10 = "아, 맞아. 어제 만났던 그 아이들의 정보도 확보해 뒀어요. #n학교에 가서 확인 부탁드리겠습니다."
11100-11 = "그 아이들, 게헨나 학원의 학생들인데……."
11100-13 = "와아, 선생님이다! 안녕~!"
11100-15 = "크핫-?!"
11100-16 = "짜안! 반가워, 반가워! 이렇게 아침에 만나다니 우연인데?"
11100-17 = "(부비부비) 와하하- 응? 무겁다고? 숨막혀? 조금만 참아봐, 선생님."
11100-20 = "무, 무슨 짓이에요, 당신! 떨어져, 떨어져요!"
11100-21 = "우와, 당기지 마~"
11100-22 = "……누가 방해하나 했더니 아비도스의 안경 쨩 아냐?"
11100-23 = "안녕~ 어제 봤지? 라멘집에서."
11100-24 = "그리고 우리 학교 습격할 때도 봤구요! 무슨 짓인가요! 왜 갑자기 친한 척이에요?"
11100-25 = "그리고 안경 쨩이 아니라 아야네입니다!"
11100-26 = "응? 그치만 우리, 딱히 너희한테 악감정이 있는 것도 아니고."
11100-27 = "그냥 동아리의 사업이라 싸우지 않을 때는 친하게 지내도 좋잖아~"
11100-28 = "지, 지금 와서 공과 사를 구분하자는 거예요?!"
11100-29 = "뭐 어때, 그리고 <샬레>의 선생님이 딱히 너희들 전용도 아니잖아. 그치, 선생님?"
11100-30 = "[s] \"싸우지 않고 사이좋게 지내면 좋겠어.\""
11100-31 = "와하하. 그건 무리. 이쪽도 사업이라서 말야. 아루 쨩 의욕이 넘쳐서 대충하면 혼나거든."
11100-32 = "뭐, 나중에라도 우리 흥신소에 놀러와, 선생님. 아루 쨩이랑 다른 애들도 좋아할 거야."
11100-33 = "그럼 바이바이~ 아야네 쨩도 다음에 봐."
11100-34 = "다음 같은 건 없어요!! 다음에 보이면 바로 쏴버릴 거예요!"
11100-35 = "네에, 네에."
11100-37 = "하아…… 하아……."
11100-38 = "뭔가요, 저 사람은……!"
11100-40 = "……확인했습니다. 변동금리와 가산금리를 적용한 대출금 788만 3250엔."
11100-41 = "전부 현금으로 받았고, 문제는 없습니다."
11100-42 = "이번 달도 카이저 론과 거래해주셔서 감사합니다. 그럼 다음 달에 뵙겠습니다."
11100-44 = "(부르르릉-)"
11100-46 = "……."
11100-47 = "……."
11100-48 = "하아. 이번 달도 이렇게 넘어갔군."
11100-49 = "……이제 몇달 남았지?"
11100-50 = "309년 상환이니까…… 지금까지 들어간 게……."
11100-51 = "됐어, 말하지 마!! 말하면 더 열받을 거 같으니까!"
11100-52 = "어차피 우리가 늙어 죽어도 다 못갚는다고! 뭘 계산하고 그래!!"
11100-53 = "……."
11100-54 = "그런데 왜 저 은행은 저렇게 현금으로만 받을까요? 굳이 현금 수송 트럭까지 써 가면서……."
11100-55 = "……."
11100-57 = "시로코 선배, 저거 털면 안돼."
11100-58 = "아니, 나도 알고 있어."
11100-59 = "상상도 금지야!"
11100-60 = "응……."
11100-61 = "자아, 어쨌든 우리는 당장 눈 앞에 닥친 일을 해결해야 하잖아."
11100-62 = "들어가자고."
11100-64 = "모두 모였으니 시작하겠습니다. 일단 두 가지 이슈를 짚고 넘어갈게요."
11100-65 = "첫째로 어제 있었던 습격 사건."
11100-67 = "우릴 습격한 건 <흥신소 68>이라는 동아리입니다."
11100-68 = "게헨나 출신의, 꽤 위험한 불량 학생들로 알려져 있습니다."
11100-69 = "흥신소라는 건 만능 심부름센터를 뜻하는 거고……"
11100-70 = "동아리 부장은 아루라는 학생이에요."
11100-71 = "스스로 사장이라고 칭하고 있는 것 같아요."
11100-75 = "아루 밑에 세명의 직원이 더 있고, 각각 실장, 과장, 사원의 직책을 가지고 있다고 합니다."
11100-78 = "이야, 본격적이네."
11100-79 = "사장님이었네요☆ 굉장해-!"
11100-80 = "아니, 어디까지나 자칭으로……. 지금은 저희 아비도스 학교 지역 어딘가에 들어와 있는 거 같아요. #n아침에도 만나기도 했고……."
11100-81 = "게헨나 학원에서는 창업이 허용되는 거야?"
11100-82 = "아마도 아니겠죠……? 멋대로 창업한 거 같아요."
11100-83 = "음…… 학칙을 어기고 있는 거네요. 나쁜 아이들처럼 보이진 않았는데……."
11100-84 = "아니에요. 엄청 다양한 악행을 일삼아왔고, 게헨나 내에서도 꽤 골칫거리로 여겨지고 있다고 해요."
11100-85 = "그런 위험 조직이 우리 학교를 노리고 있는 거예요! 좀 더 긴장감을 가져야 해요!"
11100-86 = "다음에 잡아서 취조를 해볼까……."
11100-87 = "네. 기회가 되면 꼭……."
11100-88 = "어쩐지 아야네 쨩 원한이 심하게 느껴지는데…… 무슨 일 있었어?"
11100-89 = "……다음으로 세리카 쨩을 습격한 헬멧단의 배후!"
11100-90 = "저번 전투에서 수집한 전략병기의 파편을 분석한 결과…… #n현재는 거래가 되지 않는 모델이었습니다."
11100-91 = "단종된 모델이야?"
11100-92 = "그럼 어떻게 구한 거지?"
11100-93 = "현재 단종된 전략 병기를 구할 수 있는 방법은…… 키보토스 내에는 <블랙 마켓> 뿐이에요."
11100-94 = "블랙 마켓…… 엄청 위험한 곳이잖아요."
11100-95 = "네. 맞아요. 자퇴생, 휴학생, 퇴학생…… 학교를 떠난 다양한 학생들이 거기서 집단을 이루고 있고, #n총학생회의 허가를 받지 않은 비인가 동아리들도 엄청 많다고 들었어요."
11100-96 = "흥신소 68처럼?"
11100-97 = "네. 흥신소 68도 블랙 마켓에서 몇번 사건을 일으켰다고 들었어요."
11100-98 = "그럼 거기가 중요 포인트네요!"
11100-99 = "네. 두 사건의 연관성을 찾아보는 것도 방법일 것 같아요."
11100-100 = "뭐, 좋아. 그럼 결정났네. 블랙 마켓으로 가서 일단 둘러보자고."
11100-101 = "의외의 단서를 찾을지도 모르니까 말야."
11100-103 = "다음화;블랙마켓으로 1"
