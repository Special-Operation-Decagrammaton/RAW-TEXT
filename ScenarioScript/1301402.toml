[translation]
1301402-1 = "수영복과 방어력"
1301402-4 = "(렌게가 수영복을 입고 산에 간다고 해서 허겁지겁 따라왔다.)"
1301402-8 = "오, 스승님? 생각보다 빨리 왔네?"
1301402-9 = "[s] \"폭포에 간다는 이야기였구나.\""
1301402-10 = "수영복을 입을 수 있는 장소니까."
1301402-11 = "그리고, 나도 상식 정도는 있다고!"
1301402-12 = "[s] \"나는 렌게가 수영복을 입고 등산을 하려는 줄 알았어.\""
1301402-13 = "으, 으으음……."
1301402-14 = "사실…… 수영복 차림으로 등산을 한 건 맞긴 한데 말이야."
1301402-15 = "[s] \"정말로 했었다고?!\""
1301402-16 = "교복 안에…… 수영복을 미리 입고 있었으니까."
1301402-17 = "[s] \"……!!\""
1301402-29 = "어, 어때? 조금 부끄럽긴 하지만…… 이것도 청춘이려나 해서……."
1301402-30 = "혹시…… 스승님도 옷 안에 수영복 입고 왔어?"
1301402-31 = "[s1] \"……응.\"\n[s2] \"안 입었지만, 일단 가져왔어!\""
1301402-32 = "역시 스승님! 나와 마음이 잘 맞네!"
1301402-33 = "후후, 뭐 갑작스럽긴 했으니까."
1301402-37 = "그럼 어서 수영복 수련을 시작하자."
1301402-38 = "사제가 함께…… 폭포 수련이다!"
1301402-44 = "(결국 렌게와 같이 수영복을 입고 폭포 아래에 섰다.)"
1301402-48 = "크으! 정신이 번쩍 들어! 스승님은 어때!?"
1301402-49 = "[s] \"우, 우와아아아……! 차가워서 머리가 지끈거려!!\""
1301402-50 = "후후, 엄살이네."
1301402-54 = "그러고 보니, 수영복을 입으니까 방어력이 올라간 느낌이 들어?"
1301402-55 = "그…… 나는 뭐랄까…… 왠지 그 말이 진짜인 것 같아."
1301402-56 = "수영복에 맞게 행동해야 한다는 생각에, 정신을 차리게 되고……."
1301402-57 = "몸이 아니라, 마음의 방어력이 올라간 느낌이라고 해야 하나……."
1301402-58 = "스승님은 어떻게 생각해?"
1301402-59 = "[s3] \"폭포가 너무 세…….\"\n[s4] \"버, 벗겨질 것 같아……!\""
1301402-62 = "음. 그런 점도 포함해서 정신의 방어력이 올라간 느낌인 거지."
1301402-63 = "계속 기합을 넣고 있지 않으면 수영복이 벗겨질 테니까."
1301402-64 = "[s] \"그게 기합으로 해결되는 거였어?!\""
1301402-65 = "자, 보라고. 나는 정신을 집중하고 있으니까 괜찮잖아? 스승님은……."
1301402-70 = "……?!"
1301402-71 = "[s5] \"……뭔가 허전한데?\"\n[s6] \"내 수영복이 어디 갔지……?\""
1301402-77 = "거, 거기서 기다려! 내가 찾아올 테니까!"
1301402-82 = "(그렇게 잠시 후…….)"
1301402-86 = "아! 찾았다! 여기 있어, 여기!"
1301402-87 = "[s7] \"차, 찾아준 건 고맙지만……!\"\n[s8] \"그렇게 해맑게 웃으면서 남의 수영복을 흔들지 마……!\""
1301402-91 = "눈 감고 있으니까, 빨리 와!"
1301402-92 = "난 아무것도 못 봤으니까."
1301402-93 = "후후, 뭔가 이런 것도 청춘 같아서 재미있네."
1301402-98 = "[ns] \"눈만 감지 말고 고개를 돌려주세요……!\""
1301402-102 = "아, 미안! 헤헤!"
1301402-104 = "(……이후로도 계속 렌게와 폭포 아래에서 수련을 했다.)"
