[translation]
84312100601-6 = "뭐, 뭐지? 이 사람. 왜 이렇게 잘해? 그런 분위기는 아니었는데!"
84312100601-7 = "언니, 당사자 앞에서 그런 말 하면 안돼. 아니, 뒤에서도 안 되지만……"
84312100601-9 = "도적은 DEX와 INT가 높아야 하는 직업입니다. 잘하는 게 당연하지 않겠습니까!"
84312100601-11 = "익숙하지 않은 데도 대응능력이 뛰어나…… 연습해서 나오는 움직임이 아니야."
84312100601-12 = "전패하고 있는데 칭찬 듣는 기분은…… 뭔가 묘하네요."
84312100601-14 = "아니, 상대가 유즈면 그건 어쩔 수 없는 거고."
84312100601-15 = "……그건 맞아요. 칭찬 들은 거만 해도 굉장한 거라고 생각해요."
84312100601-17 = "그렇……군요……"
