[translation]
1004202-1 = "폐허 속의 공주님"
1004202-2 = "(스윽. 슥슥-)"
1004202-3 = "[s] \"어……. 안녕. 아츠코.\""
1004202-4 = "(스윽- 슥슥 슥-)"
1004202-9 = "……아."
1004202-14 = "미안. 버릇이 되어서 말야."
1004202-15 = "이제 수화도 필요 없고, 마스크도 필요 없는데."
1004202-16 = "다시 할게."
1004202-17 = "안녕. 선생님. 좋은 아침."
1004202-18 = "[s1] \"……응. 좋은 아침.\"\n[s2] \"좋은 아침. ……그런데 지금은 밤이지?\""
1004202-19 = "응. 인사는 중요하니까. 어서 오세요."
1004202-20 = "응. 인사는 중요하니까. 어서 오세요."
1004202-21 = "여기는 방치된 학교 폐건물인데, 숨어있기는 딱 좋은 거 같아. 그런데 여기서 일주일이나 혼자 있으래."
1004202-22 = "다들 바쁜지 어디론가 가버렸거든. 먹을 거나 음료는 잔뜩 준비해 두고 갔지만……."
1004202-23 = "그러니까 선생님을 몰래 불러낸 거야. 들키면 안 돼. 비밀 친구 [USERNAME] 선생님인 거야."
1004202-24 = "[s] \"비, 비밀 친구…….\""
1004202-25 = "비밀. 응. 다들 잔소리가 심하거든. 알겠지?"
1004202-26 = "그러니까 선생님. 뭐 하고 놀까?"
1004202-27 = "[s] \"그, 글쎄…….\""
1004202-28 = "아. 좋은 생각이 났어. 학교 놀이하자!"
1004202-29 = "[s] \"학교 놀이?\""
1004202-30 = "교실에서 선생님과 이런저런 수업하는 거. 한번도 해본 적 없으니까."
1004202-31 = "여기도 예전엔 학교였을 테니, 교실이 있겠지?"
1004202-32 = "그리고 학생도 있고, 선생님도 있으니 딱이야."
1004202-33 = "가보자."
1004202-37 = "[ns] 따라간다."
1004202-41 = "……."
1004202-42 = "[s] \"이래서야 앉을 수도 없겠네…….\""
1004202-43 = "응. 그냥 기분만 내 보고 싶었던 건데. 안 되겠네."
1004202-44 = "어쩔 수 없지. 학교 놀이는 그만두고."
1004202-45 = "음……. 뭐가 있을까."
1004202-49 = "……응?"
1004202-50 = "선생님. 다른 아이들이 지금 돌아오고 있대."
1004202-51 = "오늘 놀이는 여기까지 해야겠네. 선생님이랑 내가 만난 걸 들키면 혼나버리니까."
1004202-52 = "[s] \"으, 으응…….\""
1004202-53 = "미안해. 다음에 다시 놀자."
1004202-55 = "(아쉬워하는 듯한 아츠코를 뒤로하고 폐건물을 빠져나왔다.)"
