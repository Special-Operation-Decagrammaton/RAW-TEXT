[translation]
10017030-1 = "제3화;크리스마스의 악몽"
10017030-2 = "키보토스 시내"
10017030-7 = "사랑의 크리스마스입니다. 불우한 사람들에게 구호를 보내주세요!"
10017030-12 = "어려운 분들에게 도움을 주세요! 모두의 손길이 필요한 사람들이 많아요!"
10017030-14 = "어이구, 구호기사단의 자선냄비인가? 벌써 그런 계절이 됐구만."
10017030-15 = "자…… 여기. 힘든 사람들을 위해 써 달라고."
10017030-20 = "정말 감사합니다. 저희가 준비한 선물이 있으니 받아 가 주세요."
10017030-24 = "모자와 장갑이에요! 에헤헤, 저희가 직접 만들었어요!"
10017030-29 = "세리나 쨩과 하나에 쨩이 직접 만들었다고? 어떤 의미로는 이게 더 귀한 선물 같은데……"
10017030-30 = "그러게 말이야. 오히려 우리가 더 자선을 해야겠어."
10017030-32 = "아, 아뇨! 이건 그런 의미로 드리는 것이 아니니까요……"
10017030-33 = "마음만으로 충분히 감사해요! 행복한 겨울 되세요. 메리 크리스마스!"
10017030-37 = "[ns] \"연례행사 수준으로 신뢰받고 있구나.\""
10017030-38 = "그, 글쎄요? 저희는 그저 구호기사단으로서 의무를 다한다는 느낌뿐인데……"
10017030-39 = "맞아요, 선생님! 그리고 사람들이 기뻐하는 모습을 보면 저희도 좋은걸요!"
10017030-40 = "[s] \"너무 눈부셔서 눈물이 나올 것 같아……\""
10017030-41 = "선생님? 괜찮으세요……?"
10017030-42 = "다 큰 어른이 울면 안 되죠! 뚝!"
10017030-44 = "뭔가 좋은 상황에 끼어드는 것 같아서 좀 그런데……"
10017030-50 = "앗, 어딘가 불량해 보이는 분들이에요, 선배!"
10017030-51 = "안 돼요, 하나에 쨩. 사람을 선입견을 가지고 대해서는 안 돼요."
10017030-52 = "어딘가 다치신 곳이라도 있나요? 여러분은 자주 그러시니까……"
10017030-53 = "응급 치료가 필요한 거라면 오늘도 저희 구호기사단에게 맡겨 주세요!"
10017030-55 = "아니, 아니야. 다치거나 한 건…… 맞긴 하네. 젠장."
10017030-56 = "그렇긴 한데, 치료보다는 그냥, 하소연이라도 좀 들어주었으면 해서."
10017030-57 = "뭐…… 크리스마스잖아? 불쌍한 사람들을 도우려고 여기 와 있는 거잖아?"
10017030-58 = "어떻게 할까요. 선생님?"
10017030-59 = "[s] \"일단 이야기를 들어 보자.\""
10017030-60 = "으음~ 선생님이 그렇게 말씀하신다면, 좋아요!"
10017030-62 = "그게…… 정말인가요?"
10017030-63 = "아무리 그래도, 정의실현부 분들이……?"
10017030-67 = "정말이라니까! 우린 그냥 가만히 있었는데!"
10017030-68 = "흑흑…… 크리스마스라서 치킨을 먹으려고 준비했을 뿐인데……"
10017030-69 = "그래! 그것도 아주…… '특별한' 치킨을 모두에게 선물하려고 했다고!"
10017030-70 = "[s1] \"'특별한' 치킨……?\"\n[s2] (정의실현부 학생들이…… 아무 이유 없이 치킨을 빼앗았다고……?)"
10017030-73 = "이왕 준비하는 거, 평소와는 조금 다른 걸로 준비하는 게 좋을 것 같았고!"
10017030-74 = "맞아! 그런 거였어!"
10017030-75 = "그런데 우리를 다짜고짜 때려눕히더니, 우리 치킨을 모조리 가져가 버렸다니까!"
10017030-76 = "그게 그렇게 잘못된 거야? 크리스마스에는 치킨이잖아? 뭐 물론 칠면조도 좋지만."
10017030-77 = "한푼 두푼 간신히 모아서, 가까스로 마련한 치킨인데……"
10017030-78 = "그런 우리들의 노력을 보상받을 겸 해서, 살짝…… 손을 봤을 뿐인데, 그게 마음에 안 든다고, 멋대로……!"
10017030-79 = "[s3] \"살짝 손을 봤다……?\"\n[s4] \"구체적으로, 어떤 식으로?\""
10017030-82 = "그, 그러니까! 구체적으로 이야기하자면 조금 복잡해진다고 할지……."
10017030-83 = "주, 중요한 건 우리의 마음이! 모두를 생각하는 이 기분이! 짓밟혔다고나 할지……!"
10017030-84 = "맞아! 모처럼의 크리스마스에 말이야! 우리도 선행이란 걸 할 수 있다고! 그 선의를 그런 식으로……!"
10017030-85 = "정의실현부 녀석들, 피도 눈물도 없어! 네 녀석들의 피는 무슨 색이냐!"
10017030-87 = "모두를 생각하는 마음이 짓밟히다니…… 너무하네요! 산타클로스께서도 슬퍼하실 거예요……"
10017030-88 = "맞아요. 선행을 하는 데 자격 같은 것은 필요하지 않죠."
10017030-89 = "이번 일은 저도 정의실현부 분들이 너무했다는 생각이 드네요……"
10017030-90 = "[s5] \"어딘가…… 조금 수상한 느낌 들지 않아?\"\n[s6] \"흐으으으으으음……\""
10017030-93 = "안 돼요, 선생님! 크리스마스에 불쌍한 분들을 의심하시다니! 떽이에요!"
10017030-94 = "겉모습만 보고 오해하면 모두가 슬퍼할 거예요! 산타클로스께서도 맴매하실 거라구요!?"
10017030-95 = "[s] \"……죄송합니다.\""
10017030-96 = "일단 저희 장갑과 모자라도 드릴게요. 날도 추운데……"
10017030-102 = "흐어으어으어으엉…… 고맙긴 하지만, 사라져 버린 치킨은 어쩔 수 없겠지……"
10017030-103 = "그런데…… 구호기사단 단장은 오늘 안 오는 거야?"
10017030-105 = "단장님은 아마 곧 오실 거예요."
10017030-106 = "트리니티 순찰이 끝나면 곧 오신다고 하셨거든요."
10017030-107 = "그런데…… 미네 단장님은 어째서요?"
10017030-111 = "아니…… 뭐, 그냥……"
10017030-112 = "아무튼 이야기 들어줘서 고마웠어…… 치킨은 이제 없지만……"
10017030-114 = "그럴 수가…… 저희가 도와 드릴 일이 없을까요?"
10017030-115 = "뭐라도 좋으니까 말씀만이라도……"
10017030-120 = "그냥…… 기억만 해 줘."
10017030-121 = "크리스마스 치킨도 빼앗겨서, 추운 날을 떠도는 사람들이 있었다고…… 흑흑……"
10017030-130 = "가 버리셨네요……"
10017030-131 = "쫓아가야 할까요……?"
10017030-132 = "[s7] \"그런 걸 원하지 않을 거라는 생각이 드는데.\"\n[s8] \"음…… 뭔가 스토커 같지 않을까?\""
10017030-135 = "역시 그럴까요. 하지만……"
10017030-136 = "마음이 아파요, 선생님. 우앵……"
10017030-137 = "선생님도 무언가 마음에 걸리세요?"
10017030-138 = "[s] \"정의실현부 아이들이 왜 그랬을까 생각하고 있었어.\""
10017030-139 = "그러게요. 평소에는 좋은 분들이신데……"
10017030-140 = "가끔…… 정의를 과도하게 집행하시기는 하지만요!"
10017030-141 = "아하하…… 사실 정의실현부가 출동한다는 소식이 전해지면 저희도 마음의 준비를 하곤 하죠."
10017030-142 = "장비를 점검하고, 의약품을 준비하고, 들것을 꺼내 와요. 그러다 보면 갑자기 쾅! 하는 소리가 들리거든요!"
10017030-143 = "[s] \"……시스템이구나, 거의.\""
10017030-144 = "꼬, 꼭 그런 건 아니에요! 구호기사단이라면 언제 어느 때나 모든 상황을 준비해야 하니까요!"
10017030-145 = "그런데 이번에는 그러지 못했네요…… 반성해야겠어요."
10017030-146 = "[s] \"기, 기운 내. 하나에. 응? 사정은 나중에 자세히 들어 보자? 알았지?\""
10017030-147 = "네! 기운 낼게요!"
