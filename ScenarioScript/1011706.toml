[translation]
1011706-1 = "걸 인 페인"
1011706-3 = "히카리 등장-"
1011706-4 = "[s] \"컨디션 좋아 보이네, 히카리.\""
1011706-5 = "응- 절호조."
1011706-6 = "히카리 선생님이랑 놀고 싶어-"
1011706-7 = "많이 바빠-? 일 많아-?"
1011706-8 = "[s] \"엄~청~~\""
1011706-9 = "우우-"
1011706-10 = "[s] \"일 줄 알았지? 오늘은 업무 빨리 끝마쳤어.\""
1011706-11 = "우왓-"
1011706-12 = "선생님 장해- 쓰담쓰담-"
1011706-13 = "그럼 간식 사 먹자- 히카리 지갑 두꺼워-"
1011706-14 = "[s] \"그럴까? 바람도 쐴 겸.\""
1011706-16 = "(그렇게 히카리와 밖으로 나갔다.)"
1011706-19 = "이거이거- 당고 아이스크림-"
1011706-23 = "와- 팝팝 캔디 신제품, 왕 궁금한 맛-"
1011706-25 = "(그렇게 히카리와 실컷 간식을 사 먹고 돌아오니, 어느새 해가 질 시간이 다 되었다.)"
1011706-29 = "우우- 너무 많이 먹었어-"
1011706-30 = "배부르고 입안이 달아-"
1011706-31 = "[s] \"달달한 걸 많이 먹긴 했지……\""
1011706-32 = "앗-"
1011706-33 = "[s] \"왜 그래, 히카리?\""
1011706-34 = "……"
1011706-35 = "우우…… 치통 발생……"
1011706-36 = "치명상…… 예기치 못한 고통-"
1011706-37 = "[s] \"괘, 괜찮아?\""
1011706-38 = "선생님이 봐줘-"
1011706-41 = "[wa:900]― [log=히카리]여기- [wa:1200]여기-[wa:40] [/log]"
1011706-44 = "[ns] \"어, 어디……? 안쪽?\""
1011706-46 = "[wa:950]― [log=히카리]응~[wa:920]……[wa:350] 안쪽- [/log]"
1011706-47 = "[wa:3290]― [log=히카리]이가-[wa:1120] 아파-[/log]"
1011706-50 = "― [log=히카리]선생님[wa:40] [wa:1400]보여? [wa:40] [/log]"
1011706-53 = "[ns] \"겉으로는 괜찮아 보이는데……\""
1011706-55 = "[wa:900]― [log=히카리]오른쪽 어금니- [wa:2590]부분이- [/log]"
1011706-58 = "[wa:570]― [log=히카리]우우,[wa:1000] 거기…… [wa:1580]욱신욱신- [/log]"
1011706-61 = "[ns1] \"아앗…… 그러고 보니……!\"\n[ns2] \"입 안쪽을 함부로 만지면 감염의 우려가……\""
1011706-64 = "[wa:670]― [log=히카리]에-[wa:1150] 그럼 어떡해- [wa:2250]히카리[wa:770] 사망 플래그-?[/log]"
1011706-65 = "[wa:3950]― [log=히카리]구해줘- [wa:1670]선생님-[wa:80] [/log]"
1011706-71 = "[ns] \"아무래도 단 걸 너무 많이 먹은 모양인데……\""
1011706-72 = "우우- 욕망에 졌어……"
1011706-73 = "생명과 맞바꾼 쾌락- 후회막심……"
1011706-74 = "[s] \"오늘 자기 전에 양치 잘하고, 날이 밝으면 치과에 가자.\""
1011706-75 = "치과- 베리베리 댄져러스-"
1011706-76 = "히카리 치과 싫어-"
1011706-77 = "[s3] \"그럼 계속 아픈 상태로 있을 거야?\"\n[s4] \"치과에 가면 한 방에 해결인데!\""
1011706-80 = "우우-"
1011706-81 = "우우우……"
1011706-82 = "히카리 오래오래 살래……"
1011706-83 = "살아서 선생님이랑 놀아야지-"
1011706-84 = "치과 가자-"
1011706-85 = "[s] \"잘 생각했어, 히카리.\""
1011706-87 = "(다음 날 히카리와 함께 치과에 가서 치료를 받았다.)"
1011706-88 = "(히카리가 치료를 받을 동안 손을 꼭 잡아주었다.)"
