[translation]
10025020-1 = "제2화;야토우라 마을의 그림자"
10025020-2 = "야토우라 선착장"
10025020-14 = "……안녕하세요, 어르신."
10025020-15 = "……."
10025020-16 = "이 근처에 사시는 분인가요?"
10025020-17 = "………."
10025020-18 = "저는 친구들과 함께 이 마을에 물놀이를 하러 왔는데, 오늘따라 날씨가 영 좋지 않은 것 같아서요."
10025020-19 = "이 근처에 파도를 피해 수영하기 좋은 해변이 어디 없을까요?"
10025020-20 = "……해수욕을 즐기고 싶다면 다른 마을을 알아봐."
10025020-21 = "야토우라 마을은 새우나 잡아 내다 파는 보잘것없는 시시껄렁한 동네니까."
10025020-22 = "그, 그런가요? 제가 보기에는 예쁜 마을처럼 보이는데……"
10025020-23 = "……취향도 괴상하군."
10025020-27 = "마음대로 해. 새우잡이를 방해하지만 않는다면 신경 쓰지 않을 테니."
10025020-28 = "이해해 주셔서 감사합니다."
10025020-32 = "아, 이 배가 혹시 새우를 잡을 때 쓰는 배인가요?"
10025020-33 = "……그래."
10025020-34 = "생각했던 것보다 크네요. 닻을 올린 걸 보니 지금 바로 새우를 잡으러 나가시나요?"
10025020-36 = "……해가 중천에 뜬 뒤에나 조업을 나가는 게으른 어부도 있나?"
10025020-37 = "네, 네……?"
10025020-39 = "오늘 조업은 이미 새벽에 마쳤어. 배는 묶어 두려던 참이었고."
10025020-40 = "그, 그렇군요……"
10025020-41 = "오늘 새벽에는 새우를 많이 잡으셨나요?"
10025020-43 = "……왜 그게 궁금한 거지?"
10025020-44 = "아…… 별 의도는 없었어요. 기분 나쁘게 해드렸다면 죄송합니다."
10025020-46 = "다만 최근 D.U.에서 야토우라산 새우를 보기가 어려워져서……"
10025020-47 = "새우가 많이 나는 이 마을에 무슨 문제가 생긴 게 아닌가, 하는 이야기도 SNS상에서 종종 돌아다녀서요."
10025020-51 = "……마을에는 아무 문제도 없다."
10025020-52 = "하지만—"
10025020-53 = "마음 내킨다고 새우를 원하는 만큼 잡을 수 있다면 누가 고생을 하며 뱃일을 하겠어?"
10025020-54 = "어획량은 바다의 변덕에 따라 수시로 바뀌는 것이고, 내가 잡은 새우가 마을 밖에서 어떤 취급을 받는지는 내 알 바가 아니다."
10025020-56 = "……나이가 들었다지만 뱃일 한 번 안 해본 녀석들에게 훈수를 들을 정도로 실력이 녹슬지는 않았다고."
10025020-58 = "네……"
10025020-66 = "다시 한번 말하지만, 새우잡이를 방해할 생각은 꿈도 꾸지 마."
10025020-67 = "어쭙잖은 호기심 때문에 발을 들이지 말아야 할 곳에 접근한다면, <깊은 곳의 존재들>이 가만두지 않을 테니까."
10025020-73 = "……깊은 곳의 존재들?"
10025020-78 = "발키리 해양경찰서, 야토우라 지부 앞."
10025020-82 = "저기, 아무도 없는 거야?"
10025020-90 = "으으…… 누가 이른 아침부터 귀찮게 우릴 찾는 거야?"
10025020-97 = "……응? 처음 보는 얼굴인데. ……누구시죠?"
10025020-98 = "아, 나는 이 마을에 해수욕을 즐기러 온 관광객인데—"
10025020-99 = "……해수욕? 야토우라 마을에?"
10025020-100 = "이상한데…… 제대로 알아보고 오신 거 맞나요? 근처의 다른 마을과 착각하신 건 아닌가요?"
10025020-101 = "이 마을에서 수영을 하고 싶을 수도 있잖아. 너무한 반응이네."
10025020-102 = "하지만 이런 기분 나쁜 마을에 관광객이라니…… 너무 오랜만에 봐서 신기해서요."
10025020-103 = "저희도 운 나쁘게 이곳에 배치되었으니까 억지로 머무르고 있는 거지. 가능하다면 하루라도 빨리 다른 지소로 전출 가고 싶을 정도니까요."
10025020-105 = "하지만 이런 한가한 벽지에서 실적을 쌓을 수 있을 리도 없고…… 울며 겨자 먹기로 버티는 수밖에……"
10025020-107 = "(자신이 담당하는 지역을 이렇게까지 표현하는 발키리 학생은 처음 보는 것 같네……)"
10025020-109 = "여하튼 경찰서를 찾은 이유는 다른 게 아니라, 수영을 할 때 조심해야 하는 위험한 포인트는 없는지 확인하고 싶어서 말이야."
10025020-110 = "최근 이 마을에서 사건이나 사고가 일어난 적은 없어?"
10025020-111 = "……알게 뭔가요."
10025020-112 = "뭐……?"
10025020-113 = "사건 기록 같은 건 지역 신문에도 나오니까, 괜히 귀찮게 저희에게 묻지 말고 알아서 찾아보세요."
10025020-114 = "저희는 관광객 응대 말고도 할 일이 산더미 같으니까."
10025020-115 = "방금 전까지 한가하다고 했잖아?!"
10025020-117 = "역시 이래서 발키리 경찰학교 녀석들이란……"
10025020-122 = "우리라고 해서, 처음부터 이러고 싶었던 건—"
10025020-127 = "……아무것도 아닙니다. 신경 쓰지 마시죠."
10025020-128 = "여하튼, 저희는 신경 써야 할 일이 태산 같으니 가급적 귀찮은 문제는 일으키지 말아 주세요."
10025020-130 = "혹여라도 외지인이 <깊은 곳의 존재들>로부터 노여움을 사, 해난 사고라도 일어난다면 모두가 귀찮아질 테니까요."
10025020-139 = "재수 없게 시리……!"
10025020-140 = "그보다 <깊은 곳의 존재들>이라니, 그게 무슨 소리야……?"
10025020-148 = "……아무도 못 봤겠지?"
10025020-149 = "정말이지 불친절한 마을이야. 물고기 한 마리만 낚으면 된다는데, 싸늘한 시선으로 쳐다보기만 하고……"
10025020-150 = "하지만 얻을 수 있는 정보는 모두 챙겼어. 이것만 있으면 대물을 낚는 것도 꿈은 아니—"
10025020-151 = "저기……"
10025020-155 = "말씀 중에 죄송한데, 아까 전부터 계속 제 낚싯줄을 밟고 계시는데……"
10025020-156 = "우, 우왓……? 어느 틈에 가까이 온 거야?!"
10025020-160 = "저는 아까 전부터 계속 이곳에서 낚시를 하고 있었는데요……"
10025020-161 = "역시 저처럼 보잘것없는 못난이는 이런 휴양지에서도 존재감을 드러내지 못하는군요."
10025020-163 = "이렇게 사람들의 시선 밖에서 계속 잊히게 된다면, 언젠간 저도 부두 위의 불가사리처럼 비참한 꼴로……"
10025020-165 = "그, 그런 게 아니야!"
10025020-166 = "그저 다른 일을 생각하느라 발밑을 신경 쓰지 못한 것뿐이었어. 방해해서 미안해."
10025020-167 = "대신이라기는 뭣하지만, 내가 쓰려고 가져온 루어를 몇 개 나누어 줄게."
10025020-171 = "가, 감사합니다……"
10025020-172 = "……그나저나 차림새를 보아하니, 혹시 이곳에 낚시하러 오셨나요?"
10025020-173 = "응. 이 마을에서 대물을 낚을 수 있다는 소문을 들었거든."
10025020-174 = "그, 그렇군요…… 저는 친구들이랑 함께 여행을 온 거라…… 이 마을이 낚시 명소로 유명한 줄은 몰랐었어요."
10025020-175 = "이 마을에서는 어떤 물고기가 잘 잡히나요?"
10025020-176 = "……무, 물고기? 어, 그게 그러니까……"
10025020-177 = "……전갱이려나?"
10025020-178 = "전갱이는 작은 생선이라 이런 루어로는 잡을 수 없는데요……?"
10025020-179 = "게다가 지금 낚싯대에 꿰고 계신 바늘도 전갱이를 낚기에는 큰 것이고……"
10025020-180 = "그, 그런가……?"
10025020-181 = "하지만 전갱이 중에 이런 루어에만 반응하는 커다란 녀석이 있을 수도 있잖아!"
10025020-183 = "게다가 <깊은 곳의 존재들>이 도와준다면 1m짜리 전갱이를 낚을 수도 있을 테니까."
10025020-185 = "깊은 곳의 존재들……?"
10025020-187 = "아차……"
10025020-188 = "시, 신경 쓰지 마! 그냥 혼잣말일 뿐이니까……"
10025020-189 = "여하튼 나는 물고기가 잘 낚이는 포인트를 찾아 떠날 테니 따라오지 마! 물고기들은 소음에 예민하니까……"
10025020-190 = "그리고 마을 사람들에게 내가 한 이야기는 비밀로 하고!"
10025020-197 = "……뭔가 이상해."
