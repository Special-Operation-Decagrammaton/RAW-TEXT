[translation]
2004503-1 = "엘리트 가이드"
2004503-2 = "(피나가 맡는 버스투어에 참가했다.)"
2004503-3 = "(단체관광으로 백귀야행 이곳저곳을 돌아보는 코스 여행이었다.)"
2004503-5 = "자— 다음 코스로 이동하겠습니다! 모두 버스에 탑승 부탁드립니다!"
2004503-6 = "선생님도 어서 타세요!"
2004503-7 = "[s1] \"피나도 이젠 제법 가이드로 능숙해졌는걸\"\n[s2] \"한 번에 많은 사람들을 인솔하는 게 힘들겠어\""
2004503-10 = "문제없습니다! 수많은 사람들을 거느리는 것 또한 임협의 소양!"
2004503-11 = "조금 늦어지긴 했습니다만 서둘러 출발하면 아직은 여유 있습니다!"
2004503-12 = "그럼, 출발하겠습니다앗—!"
2004503-18 = "오늘의 마지막 코스입니다! 자아, 모두 천천히 하차해 주세요—"
2004503-27 = "한 분…… 두 분……"
2004503-29 = "열한 분…… 열두 분……."
2004503-30 = "……"
2004503-31 = "……"
2004503-35 = "What!?"
2004503-36 = "[s3] \"왜 그래?!\"\n[s4] \"뭔가 문제라도 있어?\""
2004503-39 = "크, 큰!!!!"
2004503-40 = "큰일입니다 두목, 아니 그 그러니까 선생님!!"
2004503-41 = "한 분이 사라졌습니다……!! 수가 맞지 않습니다!!"
2004503-42 = "[s] \"착각한게 아닐까?\""
2004503-43 = "아뇨, 확실히 세었습니다!"
2004503-44 = "그리고, 가이드 규칙상 손님들의 얼굴은 전부 기억하고 있습니다!"
2004503-45 = "한 분이 아까 장소에서 버스에 못 타신 것 같습니다앗!!!"
2004503-46 = "[s5] \"일단 진정하고,\"\n[s6] \"여기는 각자 자유 관광 코스니까, 아까 장소로 가보자!\""
2004503-49 = "네…… 넵!!"
2004503-53 = "(급한 대로 택시를 타고 가는 내내, 피나는 눈에 띄게 동요하고 있었다.)"
2004503-55 = "서둘러서 찾아야 합니다!!"
2004503-56 = "사과는 어떻게 드려야 하고…… 웃…… 우우……."
2004503-61 = "여어 가이드 언니."
2004503-62 = "꺄, 꺄악!!"
2004503-66 = "[ns] \"우, 우와아악!!\""
2004503-67 = "우, 우와앗…… 깜짝이야, 왜 놀라고들 그래. 귀신이라도 본 것 마냥."
2004503-68 = "그……그러니까…… 저……."
2004503-69 = "뭐야, 내가 제일 일찍 온 건가? 여기로 집합하는거 맞지?"
2004503-70 = "다, 다른게 아니라…… 그……!!"
2004503-71 = "[s7] (피나가 완전 패닉상태인데…… 손님이 불쾌하지 않게 수습해 볼까……)\n[s8] \"다른게 아니라, 택시투어를 해보면 어떨까 해서, 요.\""
2004503-77 = "택시, 투어?"
2004503-78 = "……."
2004503-79 = "[s9] \"다음 장소까지는 택시를 준비해 두었으니\"\n[s10] \"함께 돌아보면서 이동을…….\""
2004503-82 = "!!"
2004503-83 = "……!"
2004503-84 = "죄송합니다… 제 실수로 손님을 챙기지 못했어요……."
2004503-85 = "다른분들은 이미 다음 장소에 계셔요."
2004503-86 = "늦었지만, 지금이라도 택시로 얼른 모셔드리겠습니다아……."
2004503-91 = "……."
2004503-94 = "우……우우……."
2004503-95 = "……"
2004503-96 = "뭐야— 그런 거였나."
2004503-97 = "미안 미안, 맘에 드는 기념품 가게가 있어서 정신이 팔렸네."
2004503-98 = "어쩐지 아무도 없더라니, 그랬었구나—"
2004503-99 = "!!"
2004503-100 = "뭐, 내 실수였고 굳이 데리러 와줘서 고마워."
2004503-101 = "얼른 가자 가이드 언니."
2004503-102 = "알겠습니다! 최선을 다해서 모시겠습니다 누님!"
2004503-103 = "누…… 누님……?"
2004503-107 = "집합시간에는 딱 맞췄습니다!"
2004503-111 = "여~ 내가 돌아왔다."
2004503-112 = "어디 갔던 거야?"
2004503-113 = "VIP라서 택시 타고 오셨지 뭐~"
2004503-117 = "어떻게든 임무는 해냈습니다아……."
2004503-123 = "[ns] \"피나?!\""
2004503-125 = "(이후 무사히 코스에 복귀해서 여행을 마쳤다)"
2004503-126 = "(다시 기운 차린 피나는 모두를 배웅할 때까지 두 번 세 번 인원수를 세는데 열중했다)"
