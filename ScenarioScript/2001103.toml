[translation]
2001103-1 = "무녀계의 스페셜리스트"
2001103-2 = "(당연하게도 기념비적인 세리카의 무녀 모습을 보기 위해, 세리카가 아르바이트하고 있다는 장소를 찾았다.)"
2001103-3 = "[s] \"분명 이 근처라고 했던 거 같은데.\""
2001103-4 = "(그리 오래 지나지 않아 세리카를 발견할 수 있었다.)"
2001103-8 = "(어째서인지 세리카는 행사장의 한쪽에 멀찍이 선 채로 조용히 서 있었다.)"
2001103-9 = "[s1] \"무녀다!\"\n[s2] \"세리카다!\""
2001103-10 = "서, 선생님?!"
2001103-11 = "선생님이 여긴 어쩐 일이야?"
2001103-12 = "서, 선생님?!"
2001103-13 = "선생님이 여긴 어쩐 일이야?"
2001103-14 = "뭐? 내 무녀 모습을 보려고 일부러 찾아왔다고……?"
2001103-15 = "무, 무슨 말을 하는지 의미를 모르겠거든?!"
2001103-16 = "[s] \"………….\""
2001103-17 = "우, 우우. 왜, 왜 그래? 그렇게 빤히 쳐다보고………"
2001103-18 = "아무 말 없이 그렇게 쳐다보기만 하지 말고……. 할 말이 있으면 얼른 하던가……!"
2001103-19 = "아아, 그, 그렇지만. 혹시 어울리지 않는다거나……."
2001103-20 = "생각보다 무녀답지 않네……. 같은 말을 할 생각이라면, 나, 나도 잘 알고 있으니까. 굳이 입 밖에 내지 않아도……!"
2001103-21 = "[s3] \"귀여워!\"\n[s4] \"혹시 세리카는 무녀의 화신이야?\""
2001103-23 = "아니! 진짜 의미를 모르겠거든!"
2001103-25 = "아니! 진짜 의미를 모르겠거든!"
2001103-26 = "[s] \"그런데 알바 중 아니었어? 왜 혼자 있어?\""
2001103-27 = "아……. 그게 말이지."
2001103-28 = "그게……. 선생님, 어쩌지……?"
2001103-29 = "일단 무녀 아르바이트의 일환으로, 그 행사장 내부의 안내를 돕고 있긴 한데……."
2001103-30 = "하아. 보다시피 한가하다고 할까. 일을 제대로 못 하고 있달까."
2001103-31 = "응……. 완전 꽝이야. 역시…… 무녀 아르바이트를 하기엔 내가 부족했던 걸까?"
2001103-32 = "[s] \"부족해?\""
2001103-33 = "나름 준비를 한다고는 했지만, 역시 그것만으로는 충분하지 않았나. 싶기도 하고."
2001103-34 = "아! 서, 선생님한테 뭐라고 하는 건 아니야!"
2001103-35 = "그냥…… 역시 잘 모르는 일은, 그만큼 더 큰 각오를 해야 하지 않았나. 이제 와서 조금 후회가 든달까."
2001103-36 = "지금은 한창 아르바이트 중이니까, 똑바로 정신 차리지 않으면 안 되겠지만……."
2001103-37 = "역시, 나에겐 살짝 맞지 않는 일이었을지도……."
2001103-38 = "[s] \"아니 그렇지 않아!\""
2001103-39 = "으, 응? 서, 선생님?"
2001103-40 = "[s5] \"세리카는 지금 훌륭한 무녀님이니까!\"\n[s6] \"아직 기회가 오지 않았을 뿐이야!\""
2001103-41 = "무, 무슨 이야기야?"
2001103-42 = "무, 무슨 이야기야?"
2001103-43 = "으아아앙! 엄마! 아빠~! 어디 갔어~!"
2001103-44 = "어……? 저건, 미아가 된 아이?"
2001103-45 = "[s] \"바로 지금이 세리카가 나설 때야!\""
2001103-50 = "어, 으, 응 흠흠, 저기, 꼬마 아가씨? 혹시 길을 잃은 거니?"
2001103-51 = "훌쩍! 아냐~! 내가 미아가 된 게 아니라! 엄마랑 아빠가 미아가 되어버렸어!"
2001103-52 = "으, 응? 그, 그렇구나……. 그럼 잠깐만. 울지 말고 기다려줄래? 언니가 미아가 된 부모님을 찾아줄 테니까."
2001103-53 = "저기요~! 혹시 이곳에서 아이를 잃어버리신 학부모분!"
2001103-54 = "안 계신가요?!"
2001103-60 = "얘! 여기 있었구나! 한참을 찾았잖니……!"
2001103-61 = "우아아앙~! 아빠!"
2001103-62 = "하아. 다행이다. 민폐를 끼쳐서 죄송합니다. 무녀님."
2001103-63 = "아, 아뇨! 무사히 찾았으니 다행이에요."
2001103-64 = "무녀 언니~! 고마워! 새해 복 많이 받아~!"
2001103-65 = "응! 너도 새해 복 많이 받으렴!"
2001103-67 = "……하아. 이걸로 한 건, 해결…일까?"
2001103-68 = "[s] \"세리카! 다음은 저기야!\""
2001103-69 = "서, 선생님?! 자, 자-잠깐!"
2001103-74 = "어이구야……. 오랜만에 기도를 드리려고 나왔더니……. 허리가……."
2001103-76 = "저기 괜찮으신가요?"
2001103-77 = "이거이거, 무녀님 아니십니까. 허허. 이 노인네는 괜찮답니다. 그냥 허리가 좀 아플 뿐이라."
2001103-78 = "아, 그럼 안쪽으로 안내를 도와드릴게요."
2001103-79 = "무녀님께서 직접 도와주시니 이거 죄송해서……. 어엇?!"
2001103-80 = "앗, 무, 무슨 문제라도……?"
2001103-81 = "무, 무녀님이 허리를 어루만져주셨더니, 아픈 게 싹 가셨습니다요! 무, 무녀님께선 영험한 힘을 지니셨구먼요!"
2001103-82 = "네, 네에?"
2001103-83 = "동네 사람들~! 여기 굉장한 무녀님이 계십니다요~!"
2001103-85 = "(그때부터 세리카의 주변으로 손님들이 어마어마하게 모여들기 시작했다.)"
2001103-88 = "무녀님! 부디 제가 뽑는 오미쿠지에 축복을 부탁드립니다!"
2001103-89 = "으, 으응……. 축복? 뭐, 해달라면 할 수는 있지만……."
2001103-90 = "앗! 그럼 저는 지금 하고 있는 게임 뽑기에 축복, 부탁드립니다!"
2001103-91 = "그거 축복이 필요한 부분이야?!"
2001103-92 = "아니! 축복만으로 끝나는 게 아니라! 차라리 저 대신 뽑아주세요! 무녀님만 믿습니다!"
2001103-93 = "그런 걸 부탁해서 어쩌자는 건데?!"
2001103-94 = "[s] \"세리카! 하자!\""
2001103-95 = "잠ㄲ-?! 서, 선생님?!"
2001103-96 = "다행이다! 부탁드립니다!"
2001103-97 = "으, 으으으. 아, 아으……. 에라이! 나도 모르겠다!"
2001103-98 = "이, 이, 이걸 누르면 되는 거야? 이렇게?!"
2001103-101 = "오오……!! 과연!"
2001103-103 = "……아, 감사합니다. 역시 현실은 현실이네요. 무녀님이 뽑아주신 이 노말 등급 캐릭터. 소중히 키우겠습니다……."
2001103-104 = "아니?! 왜 해주고도 이쪽이 잘못한 기분을 느껴야 하는 거냐고?!"
2001103-106 = "(그렇게 얼마나 되는 사람에게 도움을 주고 있었을까.)"
2001103-108 = "흠, 그쪽의 아가씨. 무녀로서 재능이 보이는군요. 저희와 계약하여 무녀 중의 무녀. 스페셜리스트 무녀가 되어주시지 않겠습니까?"
2001103-109 = "아, 아니, 그 정도로 심사숙고해 본 적은 없달까……!"
2001103-110 = "부디! 저희의 제안을 진지하게 고려를!"
2001103-111 = "우와앗, 서, 선생님?! 도와줘……!"
2001103-116 = "하아, 하아……. 정말 난리도 아니었어. 재난이란 건, 이런 걸 두고 말하는 걸까."
2001103-120 = "아르바이트가 제대로 되지 않아서 고민하던 게 거짓말처럼……."
2001103-121 = "정말 이게 어찌 된 영문인지……."
2001103-122 = "[s] \"세리카가 진심을 내면, 이렇게 되나 봐.\""
2001103-123 = "뭐야, 그게……. 바보 같아."
2001103-124 = "하지만……… 정말 고민하던 게 바보 같을 정도로, 이렇게 변할 수 있었던 건."
2001103-125 = "응. 선생님이 날 격려해 준 덕분이지."
2001103-126 = "아하핫. 이번에도 또 도움을 받아버렸네. 선생님. 늘 이렇게 되어버리는 거 같아."
2001103-127 = "언제나 이렇게 도와줘서, 고마워. 선생님."
2001103-128 = "[s] \"세리카를 위해서라면 얼마든지 도울 수 있어!\""
2001103-129 = "흐응. 그렇게 쉽게 말해도 되는 거야~? 내가 앞으로 또 어떤 부탁을 할지도 모르는데?"
2001103-130 = "[s] \"응, 괜찮아. 세리카의 부탁이라면.\""
2001103-131 = "읏……."
2001103-133 = "그, 그래. 흐응~ 그, 그런 거구나……. 선생님은……… 또 그런 말을 해주는구나."
2001103-134 = "[s7] \"응! 그러니 고민하지 말고 얼마든지 말해!\"\n[s8] \"무녀계의 스페셜리스트가 될 수 있도록, 도울 테니까!\""
2001103-135 = "뭐어…………? 무슨 말을 하나 했더니."
2001103-136 = "뭐어…………? 무슨 말을 하나 했더니."
2001103-137 = "하아. 진짜……."
2001103-138 = "풋! 뭐야 그게~!"
2001103-139 = "진짜……. 바보 같아~!"
2001103-141 = "(이후 마지막까지 세리카의 아르바이트를 도왔다.)"
