2005902-41 = "This is..."
2005902-42 = "...oolong?!"
2005902-43 = "How dare you bring such low-brow tea to a lady like me. Is this some sort of joke?"
2005902-44 = "[s] \"But I only have oolong tea right now...\""
2005902-45 = "*sigh* That won't do. It seems you need correction. Let's punish you."
2005902-46 = "Now. Recline. You will be my chair."
2005902-47 = "[s] \"The office chair over there...should be more comfortable...\""
2005902-48 = "Droll. Boring. That will not suit a lady such as I."
2005902-49 = "So kneel down and serve as my chair. Now."
2005902-50 = "You should be honored. Not everyone's so lucky."
