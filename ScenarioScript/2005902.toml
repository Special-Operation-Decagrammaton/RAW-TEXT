[translation]
2005902-1 = "소악마와 악역 영애"
2005902-2 = "(잠시 후, 사무실에 무츠키가 찾아왔다.)"
2005902-4 = "안녕, 선생님?"
2005902-5 = "[s] \"화려하게 차려입고 왔네?\""
2005902-6 = "응. 이 옷차림으로 확인해 보고 싶은 게 있거든."
2005902-7 = "내가 개인적으로 어떤 일을 맡게 됐는데 말이야."
2005902-8 = "돈 많은 재벌가의 아가씨를 연기해야만 해."
2005902-9 = "그것도 성격이 나쁜…… 이른바 <악역 영애>라고 해야 할까?"
2005902-10 = "[s] \"대, 대체 어떤 의뢰길래……?!\""
2005902-11 = "자세한 건 영업 비밀이라 말해줄 수 없어."
2005902-12 = "아무튼 연습 상대가 필요해."
2005902-13 = "선생님…… 당연하지만 어울려 줄 거지?"
2005902-14 = "[s] \"좋아! 얼마든지!\""
2005902-15 = "쿠후후, 그럴 줄 알았어."
2005902-16 = "자, 그럼 시작해 볼까나?"
2005902-17 = "……."
2005902-19 = "……!"
2005902-20 = "오호호……."
2005902-21 = "오호호홋~!"
2005902-23 = "(부, 분위기가 바뀌었다……!)"
2005902-24 = "거기, 당신. 소녀가 목이 마른데, 당장 마실 것을 가져오세요."
2005902-25 = "저 같은 고귀한 소녀에게 어울리는 음료, 모른다고 하지 않으시겠죠?"
2005902-26 = "[s] \"차, 차를 드리면 될까요……?\""
2005902-27 = "오호홋호, 잘 알고 계시는 군요?"
2005902-28 = "자, 그럼 어서 대령하세요."
2005902-29 = "소녀의 인내심이 바닥나기 전에."
2005902-30 = "[s] \"와, 무츠키. 방금 정말로 악역 영애 같았어!\""
2005902-31 = "당신, 갑자기 무슨 소리를 하시는 거죠?"
2005902-32 = "3초 줄 테니 어서 소녀에게 어울리는 차를 대령하세요!"
2005902-33 = "[s] \"다, 다녀오겠습니다!\""
2005902-40 = "[ns] \"여기 있습니다!\""
2005902-41 = "이건……."
2005902-42 = "우롱차잖아요!"
2005902-43 = "소녀에게 이런 서민의 차를 가져오다니, 진심이에요?"
2005902-44 = "[s] \"하지만 지금은 우롱차밖에 없는 걸…….\""
2005902-45 = "하아, 이거 안 되겠네요. 아무래도 당신에겐 벌이 필요한 것 같군요."
2005902-46 = "당신, 엎드려서 소녀의 의자가 되도록 하세요."
2005902-47 = "[s] \"의자라면…… 저쪽에 사무용 의자가 더 편할 텐데…….\""
2005902-48 = "소녀 같은 고급 계층에겐 저런 의자는 어울리지 않아요."
2005902-49 = "그러니 잔말 말고 엎드려서 소녀의 의자가 되는 거예요."
2005902-50 = "영광으로 아시라고요? 이런 기회, 아무에게나 주진 않으니까."
2005902-51 = "[s] \"아, 알겠습니다!\""
2005902-53 = "(얼른 엎드려 무츠키의 의자가 되어 주었다…….)"
2005902-56 = "오호호홋! 꼴 좋군요!"
2005902-57 = "자, 어떤가요? 자기보다 훨씬 어린 소녀의 장난감이 된 기분이?"
2005902-58 = "작은 소녀의 엉덩이에 깔려 굴욕을 당하는 기분이!"
2005902-59 = "[s] \"조, 좋은데?\""
2005902-60 = "응? 불편한 게 아니라?"
2005902-61 = "[s] \"무츠키처럼 귀여운 아이라면 얼마든지!\""
2005902-62 = "……."
2005902-63 = "풋……!"
2005902-64 = "아하하하핫!"
2005902-65 = "역시 선생님은…… 아하하하핫! 웃겨서 더 못 하겠어……!"
2005902-70 = "[ns] \"응? 이제 끝났어?\""
2005902-71 = "쿠후후? 설마 계속하고 싶었던 거야?"
2005902-72 = "그럼 더 강도를 높여볼까? 혹시나 해서 채찍 같은 것도 가져왔는데."
2005902-73 = "선생님. 엉덩이 찰싹찰싹 맞는 거 좋아해?"
2005902-74 = "[s] \"그, 그건……!\""
2005902-75 = "아하핫. 농담이야, 농담. 나도 거기까진 하고 싶지 않다구."
2005902-76 = "아무튼 이제 끝!"
2005902-77 = "어땠어? 나, 진짜 악역 영애 같았어?"
2005902-78 = "[s] \"응. 나도 모르게 복종할 정도로…….\""
2005902-79 = "아하하핫! 당황한 선생님 모습, 진짜 재미있었어."
2005902-80 = "아~ 계속 웃었더니 목이 마르네. 뭐 마실 거 없어?"
2005902-81 = "[s] \"우롱차라도 괜찮겠습니까, 아가씨?\""
2005902-82 = "아, 방금 그 우롱차구나?"
2005902-83 = "쿠후후, 당연히 괜찮지. 나 우롱차 좋아하거든."
2005902-86 = "아, 시원하다!"
2005902-87 = "(이후 무츠키와 다양한 대화를 나누며 시간을 보냈다.)"
2005902-88 = "(어째서인지…… 무츠키가 오호호홋 웃는 모습이 머릿속에서 떠나지 않았다…….)"
2005902-92 = "오호호홋……!"
