[translation]
2005902-1 = "小惡魔與反派千金"
2005902-2 = "（過了一會，無月來到了夏萊）"
2005902-4 = "你好呀，老師？"
2005902-5 = "[s] 「怎麼打扮得這麼華麗？」"
2005902-6 = "嗯，因為有件事需要穿這身打扮確認一下。"
2005902-7 = "我個人接了一份工作。"
2005902-8 = "必須扮演一位有錢財閥家的千金。"
2005902-9 = "而且還是個性很壞的……所謂的「反派千金」吧？"
2005902-10 = "[s] 「到，到底是什麼樣的委託啊……！？」"
2005902-11 = "詳情屬於商業機密，不能告訴你。"
2005902-12 = "總之我需要一個練習對象。"
2005902-13 = "老師……你當然會陪我吧？"
2005902-14 = "[s] 「當然！我奉陪到底！」"
2005902-15 = "咯呵呵，我就知道你會這麼說。"
2005902-16 = "那就開始吧？"
2005902-17 = "……"
2005902-19 = "……！"
2005902-20 = "哦呵……"
2005902-21 = "哦～呵呵呵！"
2005902-22 = ""
2005902-23 = "（氣，氣氛變了……！）"
2005902-24 = "那邊那個人。#n本小姐口渴了，快去拿點喝的來。"
2005902-25 = "像我這種高貴的少女該喝什麼飲料，你應該知道吧？"
2005902-26 = "[s] 「上，上茶就可以了嗎……？」"
2005902-27 = "哦～呵呵，你很懂嘛？"
2005902-28 = "那就快點送上來。"
2005902-29 = "趁本小姐的耐心還沒耗盡之前。"
2005902-30 = "[s] 「哇，無月。你這樣真的很像反派千金耶！」"
2005902-31 = "你突然在說什麼呢？"
2005902-32 = "給你三秒，快點送上與本小姐相稱的茶！"
2005902-33 = "[s] 「我，我這就去！」"
2005902-34 = ""
2005902-39 = ""
2005902-40 = "[ns] 「茶在這裡！」"
2005902-41 = "這是……"
2005902-42 = "這不是烏龍茶嗎！"
2005902-43 = "竟然給本小姐端來這種平民才會喝的茶，你是認真的嗎？"
2005902-44 = "[s] 「可是現在只有烏龍茶了……」"
2005902-45 = "唉，這可不行呢。#n看來你需要受點懲罰。"
2005902-46 = "你，趴下來給本小姐當椅子。"
2005902-47 = "[s] 「椅子的話……那邊的辦公椅應該更舒服吧……」"
2005902-48 = "像本小姐這麼高貴的人，那種椅子可配不上。"
2005902-49 = "所以別廢話，趴下來給本小姐當椅子。"
2005902-50 = "要心懷感激哦？這種機會，可不是隨便都能得到的。"
2005902-51 = "[s] 「遵，遵命！」"
2005902-53 = "（趕緊趴在地上擔任無月的椅子……）"
2005902-55 = ""
2005902-56 = "哦～呵呵呵！真是活該呢！"
2005902-57 = "來，感覺如何呢？#n被一個比自己年幼許多的少女當成玩具是什麼滋味？"
2005902-58 = "被嬌小少女的屁股壓著飽受屈辱，是什麼樣的滋味！"
2005902-59 = "[s] 「還，還不錯耶？」"
2005902-60 = "嗯？不會覺得不舒服嗎？"
2005902-61 = "[s] 「如果是像無月這麼可愛的孩子，要我做多久都行！」"
2005902-62 = "……"
2005902-63 = "噗……！"
2005902-64 = "啊哈哈哈哈！"
2005902-65 = "果然老師……啊哈哈哈哈！#n好笑到我都演不下去了……！"
2005902-66 = ""
2005902-68 = ""
2005902-69 = ""
2005902-70 = "[ns] 「嗯？結束了嗎？」"
2005902-71 = "咯呵呵？難道你還想繼續？"
2005902-72 = "那要不要把強度再提高一點？#n以防萬一，我還帶了鞭子之類的東西來。"
2005902-73 = "老師，你喜歡被打屁股嗎？"
2005902-74 = "[s] 「這，這個嘛……！」"
2005902-75 = "啊哈哈。開玩笑的，開玩笑的啦。#n我也不想做到那種程度。"
2005902-76 = "總之，到此結束！"
2005902-77 = "怎麼樣？我是不是真的很像反派千金？"
2005902-78 = "[s] 「嗯。像到我都不由自主地想服從了……」"
2005902-79 = "啊哈哈哈！老師慌張的樣子真的有夠好笑耶。"
2005902-80 = "啊～笑太久有點口渴了。#n有什麼可以喝的嗎？"
2005902-81 = "[s] 「烏龍茶可以嗎，大小姐？」"
2005902-82 = "啊，剛才那個烏龍茶嗎？"
2005902-83 = "咯呵呵，當然可以。#n我很喜歡烏龍茶呢。"
2005902-86 = "啊～好清涼！"
2005902-87 = "（之後與無月聊了各式各樣的話題，度過了一段時光）"
2005902-88 = "（不知為何……無月「哦呵呵」笑著的模樣，一直在腦海裡揮之不去……）"
