[translation]
2005902-1 = "ปีศาจน้อยกับคุณหนูตัวร้าย"
2005902-2 = "(หลังจากนั้นไม่นาน มุสึกิก็มาหาคุณครูถึงห้องทำงาน)"
2005902-4 = "สวัสดี คุณครู"
2005902-5 = "[s] \"แต่งตัวมาสวยเลยนะ\""
2005902-6 = "อื้อ เค้าอยากใส่ชุดนี้มาเช็กอะไรสักอย่างน่ะ"
2005902-7 = "เรื่องของเรื่องคือ เค้าดันได้ภารกิจส่วนตัวมาภารกิจหนึ่ง"
2005902-8 = "แล้วก็ต้องสวมบทบาทคุณหนูทายาทเศรษฐีจากตระกูลธุรกิจ"
2005902-9 = "แล้วก็ต้องนิสัยไม่ดีอีก... เรียกว่าเป็น <คุณหนูตัวร้าย> ได้เลยละ"
2005902-10 = "[s] \"นะ... นี่มันภารกิจอะไรกันเนี่ย...?!\""
2005902-11 = "เค้าบอกรายละเอียดไม่ได้หรอก มันเป็นความลับทางธุรกิจน่ะ"
2005902-12 = "เอาเถอะ สรุปว่าวันนี้เค้าต้องการคู่ซ้อม"
2005902-13 = "คุณครู... จะมาเป็นคู่ซ้อมให้เค้าใช่มั้ย?"
2005902-14 = "[s] \"ได้สิ! แน่นอนอยู่แล้ว!\""
2005902-15 = "ฮุฮุฮุ กะไว้แล้วว่าต้องตอบแบบนี้"
2005902-16 = "เอาละ งั้นเรามาเริ่มกันเลย"
2005902-17 = "..."
2005902-19 = "...!"
2005902-20 = "โอะโฮะโฮะ..."
2005902-21 = "โอะโฮะโฮะโฮะ~!"
2005902-22 = ""
2005902-23 = "(บะ... บรรยากาศเปลี่ยนไปเลย...!)"
2005902-24 = "นี่ คุณ ฉันคอแห้งน่ะ ไปเอาอะไรมาให้ฉันดื่มทีสิคะ"
2005902-25 = "คุณคงไม่บอกว่าไม่รู้จักเครื่องดื่มที่เหมาะกับสาวน้อยผู้สูงศักดิ์อย่างฉันใช่มั้ยคะ?"
2005902-26 = "[s] \"ระ... รับเป็นชามั้ย...?\""
2005902-27 = "โอะโฮะโฮะโฮะ รู้ดีเลยสินะคะ?"
2005902-28 = "งั้นก็ไปเอามาเสิร์ฟฉันสิคะ"
2005902-29 = "ก่อนที่ความอดทนของฉันจะหมดลง"
2005902-30 = "[s] \"ว้าว มุสึกิ แสดงเหมือนคุณหนูตัวร้ายจริงๆ เลย!\""
2005902-31 = "นี่คุณกำลังพูดเรื่องอะไรอยู่ไม่ทราบ?"
2005902-32 = "ฉันจะให้เวลา 3 วินาที รีบไปเอาชามาเสิร์ฟฉันเดี๋ยวนี้เลยค่ะ!"
2005902-33 = "[s] \"จะ... จะไปเอามาเดี๋ยวนี้ละ!\""
2005902-34 = ""
2005902-39 = ""
2005902-40 = "[ns] \"ชามาเสิร์ฟแล้ว!\""
2005902-41 = "นี่มัน..."
2005902-42 = "ชาอู่หลงนี่คะ!"
2005902-43 = "เอาชาธรรมดาๆ มาเสิร์ฟให้คุณหนูอย่างฉันเหรอคะ?"
2005902-44 = "[s] \"แต่ตอนนี้มีแค่ชาอู่หลง...\""
2005902-45 = "เฮอะ ไม่ได้การแล้วค่ะ ฉันว่าคุณต้องถูกลงโทษแล้วละ"
2005902-46 = "ลงไปหมอบ แล้วเป็นเก้าอี้ของฉันซะดีๆ"
2005902-47 = "[s] \"ถ้าอยากนั่ง... เก้าอี้สำนักงานทางนั้นก็มีนะ...\""
2005902-48 = "เก้าอี้แบบนั้นไม่เหมาะกับชนชั้นสูงอย่างฉันหรอกค่ะ"
2005902-49 = "เพราะงั้นก็เลิกพูดเรื่องไร้สาระ แล้วลงไปเป็นเก้าอี้ของฉันแต่โดยดี"
2005902-50 = "นี่ถือเป็นเกียรติของคุณเลยนะคะ โอกาสแบบนี้น่ะ ฉันไม่ได้ให้กับทุกคนหรอกค่ะ"
2005902-51 = "[s] \"ระ... รับทราบ!\""
2005902-53 = "(คุณครูรีบหมอบลงไปเพื่อเป็นเก้าอี้ให้มุสึกิ...)"
2005902-55 = ""
2005902-56 = "โอะโฮะโฮะโฮะ! น่าตลกจัง!"
2005902-57 = "ว่าไง... เป็นยังไงบ้างคะ? รู้สึกยังไงที่ต้องกลายเป็นของเล่นให้เด็กสาวที่อายุน้อยกว่าตัวเอง#nมากๆ เลย?"
2005902-58 = "ความรู้สึกอับอายขายหน้าที่โดนก้นของสาวน้อยนั่งทับ!"
2005902-59 = "[s] \"กะ... ก็ดีนะ?\""
2005902-60 = "หืม? ไม่ได้ลำบากหรอกเหรอ?"
2005902-61 = "[s] \"ถ้าเป็นเด็กน่ารักแบบมุสึกิ ให้เป็นเก้าอี้นานแค่ไหนก็ได้!\""
2005902-62 = "..."
2005902-63 = "พรืด...!"
2005902-64 = "อะฮ่าฮ่าฮ่าฮ่า!"
2005902-65 = "คุณครูเนี่ยละก็... อะฮ่าฮ่าฮ่าฮ่า! ตลกจัง ตีบทแตกต่อไม่ไหวแล้ว...!"
2005902-66 = ""
2005902-68 = ""
2005902-69 = ""
2005902-70 = "[ns] \"หืม? จบแล้วเหรอ?\""
2005902-71 = "ฮุฮุฮุ? หรือว่าอยากให้แสดงต่อกันล่ะ?"
2005902-72 = "ถ้างั้นมาเพิ่มความเข้มข้นหน่อยมั้ย? เค้าพกแส้มาเผื่อด้วยพอดีเลย"
2005902-73 = "คุณครู ชอบโดนตีก้นหรือเปล่า?"
2005902-74 = "[s] \"ระ... เรื่องนั้นมัน...!\""
2005902-75 = "อะฮ่าฮ่า ล้อเล่นหรอกน่า ล้อเล่น เค้าก็ไม่อยากทำถึงขนาดนั้นหรอก"
2005902-76 = "เอาเป็นว่าปิดม่านการแสดงแค่นี้!"
2005902-77 = "เป็นยังไงบ้าง? เค้าดูเหมือนคุณหนูตัวร้ายจริงๆ หรือเปล่า?"
2005902-78 = "[s] \"อื้อ เล่นเอาซะครูทำตามคำสั่งโดยไม่รู้ตัวเลย...\""
2005902-79 = "อะฮะฮะฮ่า! ท่าทางตกใจของคุณครูน่ะ ตลกมากเลยละ"
2005902-80 = "อ่า~ หัวเราะจนคอแห้งเลยนะเนี่ย มีอะไรให้ดื่มมั้ย?"
2005902-81 = "[s] \"คุณหนูจะรับเป็นชาอู่หลงมั้ย?\""
2005902-82 = "อ๊ะ ชาอู่หลงจากเมื่อกี้นี่นา?"
2005902-83 = "ฮุฮุฮุ งั้นขอแก้วหนึ่งแล้วกัน ชาอู่หลงเนี่ยของชอบเค้าเลย"
2005902-86 = "อ่า ชื่นใจจัง!"
2005902-87 = "(หลังจากนั้นคุณครูก็ได้ใช้เวลาคุยเรื่องนู้นเรื่องนี้ต่อกับมุสึกิ)"
2005902-88 = "(ด้วยเหตุผลบางอย่าง... ภาพที่มุสึกิหัวเราะ 'โอะโฮะโฮะโฮะ!' ยังคงวนเวียนอยู่ในหัวไม่หยุด...)"
