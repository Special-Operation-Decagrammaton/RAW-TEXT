2005902-53 = "I dropped down quickly and became Mutsuki's chair."
2005902-55 = ""
2005902-56 = "Ohohoho! Serves you right!"
2005902-57 = "Now, how do you feel? Being nothing more than a toy, an object, for a lady much younger than you?"
2005902-58 = "Being humiliated while pinned under a little girl's butt!"
2005902-59 = "[s] \"I-I like it?\""
2005902-60 = "Huh? You're not uncomfortable?"
2005902-61 = "[s] \"Anything for a cute girl like you, Mutsuki!\""
2005902-62 = "..."
2005902-63 = "Pfft...!"
2005902-64 = "Hahaha!"
