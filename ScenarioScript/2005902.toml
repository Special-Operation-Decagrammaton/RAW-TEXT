[translation]
2005902-1 = "The Imp and the Villainess"
2005902-2 = "Later, Mutsuki arrived at my office."
2005902-4 = "Hello, Sensei?"
2005902-5 = "[s] \"You're certainly dressed up.\""
2005902-6 = "Yes. There's a good reason for that."
2005902-7 = "You see, a personal contact asked me to complete a job."
2005902-8 = "It involves me portraying a young lady from a wealthy family."
2005902-9 = "One with a terrible personality, in fact... You could say she's a bit of a villainess."
2005902-10 = "[s] \"Wh-What kind of job is this...?!\""
2005902-11 = "That's confidential. Non-disclosure agreements, and all that."
2005902-12 = "The point is... I wanted to practice on someone."
2005902-13 = "I'm such a good girl, so this could be difficult. Sensei... You'll help me out, right?"
2005902-14 = "[s] \"Yes! Leave it to me!\""
2005902-15 = "Kufufu. I knew you'd say that."
2005902-16 = "Now, shall we get started?"
2005902-17 = "..."
2005902-19 = "...!"
2005902-20 = "Ohoho..."
2005902-21 = "Ohohoho!"
2005902-22 = ""
2005902-23 = "Her vibe's completely changed...!"
2005902-24 = "Hey there. You! This lady is parched. Bring me a refreshment at once!"
2005902-25 = "What are you doing, standing and drooling with that slack jaw? Don't you know what kind of refreshment befits a lady such as I?"
2005902-26 = "[s] \"Sh-Should I get some tea...?\""
2005902-27 = "Ohoho, so you DO have a brain in that cute head of yours."
2005902-28 = "Now then. Fetch it at once."
2005902-29 = "...Before I lose my patience."
2005902-30 = "[s] \"Wow, Mutsuki. That really was quite villainous!\""
2005902-31 = "You. What are you blabbering about?"
2005902-32 = "I'll give you three seconds to leave my sight. And come back with some suitable tea!"
