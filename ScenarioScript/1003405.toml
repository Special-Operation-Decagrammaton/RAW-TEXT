[translation]
1003405-1 = "신부수행 Ⅱ : 청소 편"
1003405-2 = "백귀야행 제18 구교사"
1003405-3 = "오늘 청소할 곳은 이곳이에요."
1003405-4 = "[s] \"제법 먼지가 많이 쌓였네.\""
1003405-5 = "꽤 오랫동안 쓰이지 않은 백귀야행의 구교사라고 해요."
1003405-6 = "하지만 쓰지 않는다고 해서, 더러운 채로 내버려둘 수는 없죠."
1003405-7 = "오늘은 이곳을 깔끔하게 청소해서 반짝반짝하게 만들 거예요."
1003405-8 = "[s] \"그런데 청소 같은 것도 수행이 되는 거야?\""
1003405-9 = "후훗, 물론이에요."
1003405-10 = "요조숙녀……"
1003405-11 = "새신부로서 쌓아야 하는 소양이라면 단연코 청소, 요리, 세탁, 재봉, 가정 돌보기 등등……!"
1003405-12 = "그 분야는 파고들면 파고들수록 끝이 보이지 않는 전문가의 영역이니까요……!"
1003405-13 = "[s] \"어, 어렵구나. 요조숙녀의 길!\""
1003405-14 = "네에, 쉽지 않답니다~"
1003405-15 = "그럼 시작해볼까요? 후후."
1003405-27 = "(그렇게 미모리와 함께 3시간 넘게 구교사의 교실을 청소했다.)"
1003405-30 = "[ns1] \"바닥 청소도 끝냈고, 창문도 닦았고.\"\n[ns2] \"쓰레기도 30봉이나 모아 버렸으니, 대충 끝났나……?\""
1003405-31 = "어느 정도는 끝마쳤지만……."
1003405-32 = "어느 정도는 끝마쳤지만……."
1003405-33 = "아직 가장 중요한 부분이 남아있어요."
1003405-34 = "[s] \"가장 중요한 부분?\""
1003405-35 = "바로 창틀이에요."
1003405-36 = "창문은 닦았지만, 창틀 속 깊은 곳에 있는 먼지를 닦아낸 건 아니니까요."
1003405-37 = "[s3] \"과연 그런 부분까지 놓치지 않는 세심함……!\"\n[s4] \"이것이 요조숙녀……! 아니, 그보다는 시어머니인가?\""
1003405-38 = "필요한 물건은 이미 준비해 뒀어요."
1003405-39 = "필요한 물건은 이미 준비해 뒀어요."
1003405-40 = "분무기랑 청소용 스펀지, 그리고 나무젓가락까지……."
1003405-41 = "이걸 이용해서, 이렇게 청소를 하면."
1003405-44 = "(쓱삭쓱삭)"
1003405-45 = "이, 이것 좀 보세요. 선생님!"
1003405-46 = "이렇게나 깨끗하게 싸악~ 닦여요!"
1003405-47 = "[s] \"오오, 창틀 속에 잠들어 있던 묵은 때가 싹 벗겨지네?\""
1003405-48 = "인터넷에서 찾아본 방법이지만,"
1003405-49 = "이렇게까지 깔끔하게 닦이는 게, 속이 다 시원해지네요. 후후훗."
1003405-50 = "하지만 그래도 이것만으로는 부족해요."
1003405-51 = "이것들로는 창틀의 표면 부분만 닦아낼 수 있을 뿐."
1003405-52 = "창틀 구석……. 스펀지가 닿지 못하는 깊은 곳까지는 닦아내지 못하니까요."
1003405-53 = "[s] \"헉, 그, 그러면 어떡하죠?! 미모리 중사!\""
1003405-54 = "이럴 때 필요한 것이 바로 이것!"
1003405-55 = "미술용 붓이랍니다!"
1003405-56 = "[s] \"의외의 아이템, 떴다!\""
1003405-57 = "미술의 세심한 붓 터치를 위해 쓰는 이 가느다란 붓이라면,"
1003405-58 = "구석 모서리까지도 털어내서 깔끔하게 청소할 수 있으니까요~"
1003405-59 = "이게 바로 요조숙녀의 지혜예요! 인터넷에서 찾은!"
1003405-60 = "[s] \"굉장해! 요조숙녀의 지혜 주머니! Feat 인터넷!\""
1003405-64 = "(슥슥슥슥)"
1003405-65 = "후후~♪ 청소는 이것으로 전부 마무리랍니다~"
1003405-66 = "[s] \"그런데 미모리, 어째 즐거워 보이네.\""
1003405-67 = "그, 그런 표정을 지었나요?"
1003405-68 = "확실히, 으음. 이렇게 더러운 창틀이 제 노력으로 깨끗해진다거나."
1003405-69 = "이런 부분이 조금은……. 성취감이 드는 걸지도 모르겠어요."
1003405-70 = "[s] \"청소 자체가 즐거운 거구나.\""
1003405-71 = "네, 가사에 점점 능숙해져 가고 있다는 실감이 나서……."
1003405-72 = "아, 하지만 혼자 할 때는 이 정도로 들뜨는 건 아닌데……."
1003405-73 = "[s] \"그래? 지금 엄청 들뜬 거 같은데.\""
1003405-74 = "아마, 제가 이렇게까지 즐거운 이유는 분명……."
1003405-75 = "[s] \"분명?\""
1003405-76 = "후훗, 아니요. 아무것도 아니에요."
1003405-77 = "자아, 나머지도 착착 청소해 나가요. 선생님!"
1003405-79 = "(그 뒤로도 약 2시간에 걸쳐, 미모리와 함께 즐겁게 청소를 끝마쳤다.)"
