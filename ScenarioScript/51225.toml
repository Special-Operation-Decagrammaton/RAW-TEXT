[translation]
51225-7 = "으음, 여긴……."
51225-9 = "아핫, 눈을 뜨셨나요?"
51225-10 = "당신은, 누구…………?"
51225-11 = "어라, 아쉬워라. 기억하지 못하시는 건가요?"
51225-12 = "저는 당신의 대리인."
51225-13 = "당신이 가진 <감정>을 모두에게 전달해 주고자 하는 [ruby=괴담가]이야기꾼[/ruby]이랍니다."
51225-14 = "감정……이라는 건."
51225-19 = "당신의 그 「감정」 그대로 돌려주고 싶다고 생각하지 않나요?"
51225-24 = "설, 마……"
51225-25 = "자, 보라구요. 무녀님. 거리가 무척이나 아름답지 않나요?"
51225-26 = "네……?"
51225-44 = "이, 게, 대체…… 어떻게……. 축제 거리가…… 어째서……"
51225-45 = "아하하핫. 멋지지 않나요?"
51225-46 = "그야말로 풍류로 가득 찬 풍경. 마음에 들어요. 정말로."
51225-47 = "왜, 이런……. 이런 끔찍한 짓을."
51225-48 = "어라? 그런 말씀은 섭섭하네요."
51225-49 = "마치 저 혼자 일을 저질렀다는 듯이 탓하는 말이라니."
51225-50 = "……네?"
51225-51 = "저는 단지 무녀님의 감정을 대신했을 뿐이라구요?"
51225-52 = "보이지 않는 건가요? 당신 앞에 서 있는 <그것>이."
51225-53 = "무녀님께서 쏟아낸……"
51225-58 = "당신의 가슴 깊은 곳에서 태어난 <감정>의 증거가."
51225-59 = "………!!"
51225-65 = "……아아."
51225-66 = "이것이……… 저의………."
51225-67 = "저에게서 태어난……… <감정>?"
51225-73 = "읏……!"
51225-76 = "보고 있기만 해도 느껴지지요?"
51225-77 = "그 안에서 소용돌이치고 있는 매캐한 연기와 타오르는 화염이."
51225-78 = "저 안을 가득 메우고 있는 실로 짙고 농밀하며…… 강렬한 감정이."
51225-80 = "이 모든 것이 당신 덕분이랍니다. 무녀님."
51225-82 = "……전부, 내 덕분……?"
51225-84 = "그래요. 이해해요. 아무도 내 마음을 알아주려고 하지 않아."
51225-85 = "그 누구도 나의 목소리를 들으려 하지 않아."
51225-86 = "나 이외의 타인은 전부가 나의 마음과 바람, 목소리를 짓밟으려고만 할 뿐."
51225-87 = "올바르게 행동하여라. 모두가 말하는 건 단순히, 자신의 바람을 강요하고 밀어붙이기만 하는 말들뿐."
51225-88 = "그래서 괴로웠던 거죠? 지쳐버린 것이지요?"
51225-89 = "아, 으……."
51225-91 = "그러니 끝내 전부 내던지고 싶어진 거잖아요?"
51225-92 = "내게 그러한 말을 하는 이들을 향해. 나의 의견 따윈 듣지 않고 묵살하는 그들을 향해."
51225-96 = "[log][ff4444]<전부 불타버렸으면 좋겠다.>[-][/log]"
51225-98 = "라고 감정을 품었던 거잖아요?"
51225-100 = "나는…… 나는………."
51225-102 = "아하하핫!"
51225-103 = "저것은 바로 그러한 당신의 마음과 감정 속에서 태어난, 얼굴을 가지지 못한 대리자."
51225-104 = "여기에 이름을 붙이자면……"
51225-105 = "그래요. <얼굴 없는 카타시로>라고 해둘까요?"
51225-106 = "저것이라면 당신의 바람대로, 필시 백귀야행 전역을 새빨간 불꽃으로 불태울 수 있을 거예요. 실로, 멋지고, 아름답게."
51225-107 = "그것은……… 그야말로 멋진 풍류가 되어줄 테지요."
51225-108 = "아──"
51225-115 = "거리가 불타고 있다."
51225-116 = "저 멀리서 들려오는 목소리는, 그 불길에 괴로워하는 누군가의 비명."
51225-117 = "바닥을 따라 흐르는 선명한 선홍색의 불꽃."
51225-120 = "이것은, 전부…… <나> 때문이다."
51225-128 = "내가…… 그러한 마음을 먹은 끝에 태어나게 만든 것이다."
51225-129 = "내가 백화요란을 꿈꾸고. 본디 받아들였어야 할 집안의 의무에서 벗어나."
51225-133 = "백화요란으로서…… 백화요란이 된 자신을 꿈꾸고, 그 모습을 연기하려 했기에 내려진 벌."
51225-136 = "(아…… 그렇구나.)"
51225-137 = "(내가 그런 마음을 먹었으니까. 그래서………)"
51225-140 = "저건…… [ruby=내 잘못이구나]나로부터 태어난 거구나.[/ruby]"
51225-150 = "어라, 의식을 잃고 쓰러졌나요."
51225-151 = "재미없네요. 진짜는 지금부터 시작일 텐데."
51225-152 = "뭐어, 됐어요. 무녀님, 당신은 제 역할을 다해주었으니 여기서부턴 저 슈로의 턴이에요."
51225-153 = "준비는 전부 끝났어요. 배역도, 무대도 마련이 되었답니다."
51225-154 = "네, 이것으로 마침내…… 코쿠리코 님이 바랬던 것처럼."
51225-155 = "마침내 나만의 <백물어>가──"
51225-157 = "완성되는 거예요."
51225-163 = "[ns] \"거기까지야. 슈로!\""
51225-169 = "유카리를, 돌려받으러 왔어……!"
51225-173 = "…………당신들."
51225-177 = "다음화;꾸며낸 거짓말"
