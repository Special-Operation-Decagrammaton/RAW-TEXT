[translation]
10003045-1 = "제4화;바닷가에서 흔히 일어나는 일"
10003045-2 = "(그때부터 모두 다 함께 합심하여, 히나의 휴가를 지키기 위한 눈물겨운 분투기가 시작되었다.)"
10003045-4 = "하아……. 역시 훈련 때까지 대기라고는 하지만, 조금 심심하네."
10003045-5 = "선생님, 혹시 괜찮다면……. 훈련 전까지, 같이 보드게임이라도……."
10003045-8 = "선생님?! 지금 해변의 전선이 왕창 밀리고 있어! 선생님의 지휘가 필요해! 도와줘!"
10003045-11 = "[ns] \"자, 잠깐! 히나! 갑자기 급한 일이 생긴 바람에……!\""
10003045-12 = "앗, 으, 응……."
10003045-15 = "(간신히 해변의 문제아들을 정리하고 돌아온 뒤.)"
10003045-16 = "아, 선생님. 돌아왔어? 밖에서는 계속 뭔가 폭발하는 소리가 들리던데."
10003045-17 = "그만큼 훈련이 격해진 건가……?"
10003045-18 = "뭐, 어쨌든, 열심히 하고 있다면 다행이지만……. 왠지, 나만 이러고 있는 게 미안해지는걸."
10003045-19 = "……맞다. 날씨가 무더워서 그런데, 선생님. 괜찮다면 아래로 내려가서 같이 아이스크림이라도……."
10003045-22 = "선생님, 치나츠입니다. 현재 슬럼가에서 헬멧단과 격렬한 전투 중!"
10003045-23 = "전차의 전격전이 예상보다 더욱 강력해서 저희 선도부원들로만 대응하기가 어렵습니다!"
10003045-24 = "부디 선생님께서 현장에 나오셔서……."
10003045-27 = "[ns1] \"히, 히나. 미안하지만 잠시 자리를 비울게……!\"\n[ns2] \"마침 방금 풀리지 않던 퍼즐의 힌트가 번뜩여서 말이야!\""
10003045-28 = "서, 선생님……! 자, 잠깐!"
10003045-29 = "서, 선생님……! 자, 잠깐!"
10003045-31 = "선생님, 이오리와 치나츠, 양쪽의 전선이 위험합니다! 여기선 일단 선도부원들의 지휘를 맡아주세요! 아! 부장님께는 비밀로 해주시고요!"
10003045-32 = "선생님……"
10003045-34 = "아니!! 저 녀석들, 왜 바닷가에서 튀어나오는 거냐고! 물귀신이냐고! 선생님 헬프!"
10003045-35 = "선생……"
10003045-37 = "헬멧단의 동원병력이, 전차에 이어 오토마타 군단과 헬기까지! 선생님! 도움이 필요……!"
10003045-38 = "선……."
10003045-40 = "아, 선생님……."
10003045-41 = "저……. 괜찮아? 지금 안색이 별로 안 좋은데."
10003045-42 = "[s] \"괘, 괜찮아. 그보다 히나, 그게…….\""
10003045-43 = "……하아. 알았어. 일이 있다는 거지?"
10003045-44 = "응. 다녀와. 얌전히 기다리고 있을 테니까."
10003045-45 = "[s] \"네, 넵. 그럼…….\""
10003045-49 = "(그렇게 약 2시간에 걸친 사투를 거듭하고 거듭했다.)"
10003045-51 = "하계 합숙 훈련 지휘통제실"
10003045-52 = "허억허억……."
10003045-53 = "하아하아……."
10003045-54 = "……다들……. 살아있나요?"
10003045-55 = "[s] \"어, 어떻게든…….\""
10003045-56 = "이미 몸이고, 수영복이고 전부 너덜너덜했지만, 살아는……. 있어. 아코 쨩."
10003045-57 = "……이 정도로 저항이 거세다니, 전혀, 예상 못했어요."
10003045-58 = "하지만 덕분에……."
10003045-59 = "응."
10003045-60 = "……네."
10003045-61 = "엉망진창 스케반 및 첨벙첨벙 헬멧단. 양쪽 모두 퇴각한 걸 확인했습니다. 인터넷 상에서도 전면전이 취소되었다는 공지가 올라왔습니다."
10003045-62 = "소기의 목적은 달성된 것으로 확인. 선언하겠습니다. 지금 시간부로 작전 종료입니다."
10003045-63 = "으아아아! 드디어 끝났다!"
10003045-64 = "정말……. 여기까지 와서 고생했네요."
10003045-68 = "정말! 정말 감사드립니다! 선도부 여러분!"
10003045-69 = "덕분에 저희 호텔은 물론, 이 근처 상인들도 다시 일터로 돌아올 수 있을 겁니다!"
10003045-70 = "아! 나중에 기회가 된다면, 모쪼록 당점에서 오픈하는 온천의 이용권을 선물로 드릴 테니, 부디 이용해주시길 바랍니다!"
10003045-71 = "저희는 해야 할 일을 했을 뿐입니다. 선도부원 여러분도 전부 고생하셨습니다."
10003045-72 = "앞으로 예정된 구보 훈련 때까지 남은 시간은 약 1시간. 그때까지 모두 휴식을 취한 뒤, 이후의 일정을 논의하도록 하지요."
10003045-73 = "[s] \"이제 히나와 함께 해변 산책을 할 수 있겠네.\""
10003045-74 = "네, 그러니 선생님. 피곤하신 건 이해하지만, 그때에도 부디 선도부장의 곁에서, 휴가를 즐길 수 있도록 지도를 부탁……."
10003045-78 = "안녕하십니까? 아코 선임행정관. 만마전으로부터의 전언입니다."
10003045-79 = "훈련은 제대로 이루어지고 있습니까? 혹시 훈련과 거리가 먼 곳에서, 전혀 딴 일을 꾸미고 계시진 않습니까?"
10003045-80 = "자, 잠깐만요?! 저는 업무로 바빠서 상대해드릴 여유가 없으니……."
10003045-81 = "음……? 잠깐, 통신상에 비치고 있는 선도부원 이오리 양의 모습, 혹시 수영복 차림이시지 않은……"
10003045-82 = "아아앗! 손가락이 갑자기 멋대로!"
10003045-86 = "이런 순간까지 만마전에서 감시의 눈길을 보내오다니……. 큰일 날 뻔 했네요. 이오리."
10003045-87 = "아니, 내가 잘못한 것처럼 말하지 말라고?!"
10003045-88 = "뭐, 만마전의 난입이야 그렇다 치더라도, 역시나 이번에도 저희를 방해하려는 의지가 느껴지는 게, 평소대로의 만마전이네요."
10003045-89 = "뭐, 아코 쨩이라면 알아서 잘 하겠지만."
10003045-90 = "[s] \"그럼 난 일단 히나에게 돌아가볼게.\""
10003045-91 = "네, 이제 구보 훈련까지 얼마 남지 않았으니, 부장님이 소동을 눈치 채지 못하도록. 그쪽은 잘 부탁드립니다. 선생님."
10003045-92 = "그래도 이걸로 한시름 놓은 것 같으니, 그렇게 신경 쓸 필요 없지 않아?"
10003045-93 = "오히려 아코 쨩이 잠시 자리를 비운 이때라면, 조금은 부장을 데리고 해변에 내려가보는 것도……."
10003045-94 = "잠깐만요. 이오리……. 이런 타이밍에 또 그런 대사를 했다간."
10003045-97 = "[ns] \"……음.\""
10003045-98 = "……앗. 흡."
10003045-99 = "이오리, 입을 가려도 이미 늦었달까……. 하아……. 아무도 묻지 않으니…… 제가 말할게요."
10003045-103 = "이젠 또 무슨 일인 거죠?!"
10003045-108 = "새, 새로운 적의 습격입니다!"
10003045-110 = "으아아아!!! 뭐야! 왜 아무도 없는 건데! 분명 여기서 축제가 벌어진다고 했잖아!"
10003045-111 = "축제가 아니라 패싸움이지만요. 뭐, 비슷한 거지만☆"
10003045-112 = "어쨌든!!"
10003045-113 = "이래서야 이번 연구 목표인 <여름 해변이나 축제에서 먹는 구운 옥수수는 왜 이리 맛있는가?>를 연구할 수 없게 되어버립니다……."
10003045-114 = "뭔데에~! 옥수수는 언제 먹는 거야?!"
10003045-115 = "먹으러 온 게 아니라, 팔러 왔다고!"
10003045-116 = "그 무거운 걸 잔뜩 들고 여기까지 왔는데! 불량배나 헬멧단은 코빼기도 보이지 않잖아!"
10003045-117 = "아니, 아예 사람 그림자 자체가 안 보여! 대체 어떻게 된 거야!"
10003045-118 = "[s] \"미식연구회가 왜 여기에……?!\""
