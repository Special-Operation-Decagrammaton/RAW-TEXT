212050-205 = "..."
212050-206 = "จะปล่อยให้สมาชิกอิโรฮะ... ไม่สิ จะปล่อยให้นัตสึเมะ อิโรฮะเป็นอย่างนั้นต่อไปเหรอคะ?"
212050-207 = "แล้วถ้าไม่ปล่อยไว้แบบนั้น...?"
212050-208 = "นัตสึเมะ อิโรฮะแสดงเจตนาชัดเจนแล้วว่าจะไม่ปฏิบัติตามการนำของท่านประธานค่ะ"
212050-209 = "เราจะปล่อยผ่านผู้ที่ทำลายความเป็นปึกแผ่นของเกเฮนน่าที่รวมเป็นหนึ่งไปไม่ได้นะคะ"
212050-210 = "ควรกำหนดให้เธอเป็นบุคคลเฝ้าระวังพิเศษ และถ้าสถานการณ์ร้ายแรงก็อาจดำเนินการในข้อหากบฏ..."
212050-212 = "พอแค่นั้น"
212050-213 = "..."
212050-214 = "เรื่องการจัดการกับยัยนั่น เราจะเป็นคนตัดสินเอง"
212050-215 = "เราจะรับฟังคำแนะนำ แต่อย่าได้ล้ำเส้น อิการาชิ โชโกะ"
212050-216 = "ค่ะ ขอโทษที่เสียมารยาทค่ะ..."
