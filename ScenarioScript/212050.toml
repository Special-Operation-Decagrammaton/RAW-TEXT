212050-187 = ""
212050-188 = "อะ... อิบูกิจัง! รุ่นพี่มาโคโตะกับอิโรฮะจังคงไม่ได้พูดจากใจจริงหรอกค่ะ!"
212050-189 = "ชะ... ใช่แล้ว! กินพุดดิ้งกันมั้ยคะ? ถ้าได้กินอะไรหวานๆ อารมณ์ก็จะดีขึ้นด้วยนะ~~!!"
212050-191 = "ไม่กิน... แง... อย่าทะเลาะกัน... อย่าพูดคำไม่ดีด้วย... ฮืออ"
212050-192 = "ไม่พูดค่ะ! จะไม่พูดแล้ว! เอาละ ใจเย็นๆ ก่อนนะ..."
