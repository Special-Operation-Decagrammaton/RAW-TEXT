[translation]
212050-1 = "제5화;그만둘래요"
212050-2 = "만마전 작전회의실"
212050-8 = "마코토 의장님, 재흥위원회의 두 사람이 접견을 요청하고 있습니다."
212050-13 = "음. 허가하겠다."
212050-15 = "네, 안쪽으로 들여보내도록 하겠습니다."
212050-19 = "……."
212050-25 = "어……."
212050-30 = "흥. 무슨 일로 찾아왔나, 후리하타 마유미. 묘라쿠 카렌."
212050-32 = "어, 음. 그게……."
212050-33 = "의장 선배. 까놓고 물을게."
212050-38 = "키시싯…… 무례하기 짝이 없지만, 그런 부분도 용인하는 것이 이 몸의 배포겠지. 말해보도록."
212050-39 = "으…… 정말."
212050-40 = "아무튼 의장 선배, 연설 때 했던 말들…… 모두 진심이었어?"
212050-41 = "이 몸은 언제나 진심이다."
212050-42 = "그러니까, 전쟁을 하겠다는 거 진심이지……? 게헨나가 키보토스를 정복한다는 것도……?"
212050-43 = "어째서 진심이 아니었다고 생각하지? 이 하누마 마코토 님의 목소리에 담긴 진실성보다 더 명확한 증거가 필요하다는 말인가?"
212050-44 = "아니…… 그게. 좀 이상하잖아. 갑자기 전쟁이라니……."
212050-45 = "그리고 지금 만마전과 선도부, 너무 강압적이야. 아까 봤는데 개인이 소지한 탄약도 모두 압류해 가더라. 이렇게까지 할 필요가 있는 거야?"
212050-46 = "그건 이 몸이 직접 내린 지령이었다. 잘 이루어지고 있는 모양이군. 키킥."
212050-47 = "그, 그런……."
212050-48 = "흥, 익숙했던 현실의 격변이 두려운가? 변화란 언제나 낯설고 두려운 법이지."
212050-49 = "하지만 보아라. 선도부와 만마전이 손을 잡고, 전교생이 게헨나의 깃발 아래 집결했다."
212050-50 = "후리하타 마유미. 네가 꿈꾸던 하나 된 게헨나가 바로 눈앞에 있지 않나? 키시싯."
212050-51 = "……하지만 선배, 개인의 의지라는 것도 있잖아? 우리가 꿈꾸던 건 모두 자신의 의지로 행동해서 위대해지는 거였는데……"
212050-53 = "회장, 의지라는 것은 결국 환경에 의해 만들어지는 산물입니다."
212050-54 = "우리는 기존의 무질서라는 환경을 철저히 통제된 질서로 바꿔가고 있는 거고요."
212050-56 = "쇼코……."
212050-57 = "그렇다면 묻지. 너희는 진심인가?"
212050-58 = "뭐, 뭘?"
212050-59 = "더욱 위대해질 게헨나를 위해 키보토스를 정복할 준비가 되었냐는 물음이다."
212050-60 = "네 녀석들이 입버릇처럼 말하지 않았던가. 더욱 위대한 게헨나. 다시금 위대해질 게헨나."
212050-61 = "……."
212050-62 = "바로 지금이 그때다. 예전의 게헨나로 돌아가고 싶다고 했었지."
212050-63 = "자, 그때처럼 모두가 한마음 한뜻으로 하나의 목표를 향해 움직이고 있다. 어떤가?"
212050-64 = "그런데 의장 선배……."
212050-68 = "분명 예전에는 과거의 게헨나보다 지금의 게헨나가 더 좋다고 말했었잖아."
212050-69 = "우리가 활동을 허가받으러 왔을 때 그랬잖아. 자유를 말하면서."
212050-71 = "맞아. 왜 갑자기 변한 거야? 선배뿐만 아니라, 다른 선배들도……."
212050-76 = "키시싯…… 그것은 아직 진리를 깨닫지 못했을 때의 이야기에 지나지 않는다."
212050-77 = "어설프게 주어진 자유 따위, 완벽한 통제 아래 이루어지는 질서와 비교하면 지극히 비효율적이고 어디로 튈지 모르는 불안 요소일 뿐이지."
212050-78 = "그때 너희도 말하지 않았던가? 허울 좋은 자유 따위 의미 없다고."
212050-80 = "그, 그렇게 말했던 건 맞지만……."
212050-82 = "이 몸이 보장하마. 전쟁이 끝난 뒤의 게헨나는, 네 녀석들이 상상조차 못 할 만큼 빛나는 학원이 되어 있을 것이다."
212050-83 = "지금은 그저 이 몸의 등 뒤를 따라오기만 하면 된다."
212050-90 = "……."
212050-92 = "일단…… 알겠어. 돌아갈게."
212050-94 = "키시싯. 앞으로의 처신에 대해 잘 생각해 보도록 하여라."
212050-102 = "뭐냐, 이로하. 할 말이 있으면 빨리 하도록 해라."
212050-103 = "마코토 선배는…… 진심인 거죠?"
212050-104 = "아직도 이 몸을 모르는가. 허튼소리는 한 적이 없다만."
212050-105 = "……."
212050-107 = "그럼, 저 만마전 그만둘래요."
212050-111 = "뭣이?"
212050-112 = "제가 아는 마코토 선배라면 얼빠진 소리는 내뱉었을지언정, 지금 같은 이야기를 하지는 않을 거예요."
212050-113 = "저는 지금처럼 달라진 마코토 선배를…… 더 이상 보고 싶지 않아요."
212050-115 = "이, 이로하 쨩……?"
212050-116 = "……."
212050-118 = "이로하 선배……?"
212050-120 = "……그런가."
212050-121 = "네."
212050-122 = "그럼, 그렇게 하도록."
212050-123 = "……."
212050-124 = "흥…… 너라면 언젠가 만마전을 이어받을 수도 있다 여겼거늘……."
212050-125 = "여기까지인가 보군. 이로하."
212050-126 = "네. 그동안…… 빌어먹게 신세 졌습니다."
212050-131 = "……."
212050-137 = "이로하…… 선배……."
212050-138 = "선배, 가버린 거야……? 이제 만마전 아니야……?"
212050-139 = "우, 우아…… 어, 어쩌죠?! 이로하 쨩이……!!"
212050-141 = "소란 피우지 마라."
212050-145 = "엣, 그렇지만!"
212050-146 = "지금 게헨나는 무엇보다 중요한 기로에 서 있다. 모두가 척척 맞아떨어진 톱니바퀴처럼 굴러가야 대업을 이룰 수 있을 터."
212050-147 = "오로지 성심으로 임하여 위대한 게헨나를 이룩해야 할 때인데, 삐걱대는 나사는 필요 없다!!"
212050-153 = "……마코토 선배, 나빴어!"
212050-157 = "이로하 선배에게 그렇게 말하면 안 돼! 나쁜 말이야!"
212050-158 = "……아니다, 이부키. 지금은 사사로운 관계에 집중할 때가 아니다."
212050-159 = "너는 아직 어려서 이해하지 못하겠지만, 우리 모두의 숙원을 이루기 위해……"
212050-160 = "몰라! 이부키는 그런 거 모르지만, 이로하 선배가 속상했다는 건 알아!"
212050-161 = "큭……."
212050-166 = "……사츠키, 치아키. 이부키를 달래주도록 해라."
212050-167 = "쇼코, 전시 시찰이다. 재고 물자 서류를 지참해서 수행하도록."
212050-168 = "네, 알겠습니다."
212050-175 = "……."
212050-176 = "마코토 선배……."
212050-182 = "……흑."
212050-184 = "우, 우엥…… 우에에엥~~~~"
212050-188 = "이, 이부키 쨩! 마코토 선배도, 이로하 쨩도 진심은 아닐 거예요!"
212050-189 = "그, 그렇지! 푸딩 먹을까요? 달콤한 걸 먹으면 기분도 좋아질 거구~~!!"
212050-191 = "안 먹을래…… 우엥…… 싸우지 마…… 나쁜 말도 하지 말구…… 흐이잉."
212050-192 = "안 해요! 안 할 거예요! 자, 진정하구……."
212050-197 = "이로하 쨩……."
212050-203 = "……."
212050-204 = "의장님."
212050-205 = "……."
212050-206 = "이로하 의원…… 아니, 나츠메 이로하를 저대로 둘 생각이십니까."
212050-207 = "……저대로 두지 않으면?"
212050-208 = "나츠메 이로하는 의장님의 영도에 따르지 않겠다는 뜻을 명확히 했습니다."
212050-209 = "하나 된 게헨나의 결속을 해치는 자를 묵과할 수는 없지 않겠습니까?"
212050-210 = "그녀를 요주의 인물로 지정하고, 정도에 따라서는 반역에 대한……"
212050-212 = "거기까지."
212050-213 = "……."
212050-214 = "그 녀석의 처우는 이 몸이 결정한다."
212050-215 = "조언은 받아들이겠지만, 선을 넘지 마라. 이가라시 쇼코."
212050-216 = "……네. 실례했습니다."
212050-217 = "……가지."
212050-222 = "……역시. 모든 생각을 컨트롤할 수는 없겠군요."
212050-223 = "하지만 지금으로도 충분하겠죠. 후후."
212050-228 = "다음화;온천개발부"
