212050-153 = "รุ่นพี่มาโคโตะ... ใจร้าย!"
212050-154 = ""
212050-156 = ""
212050-157 = "ห้ามพูดกับรุ่นพี่อิโรฮะแบบนั้นนะ! มันเป็นคำพูดไม่ดี!"
212050-158 = "ไม่ใช่อย่างนั้น อิบูกิ ตอนนี้ไม่ใช่เวลามาสนใจความสัมพันธ์ส่วนตัว..."
212050-159 = "เธอยังเด็กเกินกว่าจะเข้าใจ แต่เพื่อทำความปรารถนาอันยาวนานของพวกเราทุกคนให้เป็นจริงได้..."
212050-160 = "ไม่รู้! อิบูกิไม่เข้าใจเรื่องแบบนั้นหรอก อิบูกิน่ะรู้ว่ารุ่นพี่อิโรฮะเสียใจ!"
