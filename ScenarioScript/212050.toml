212050-40 = "1;카렌;09;아무튼 의장 선배, 연설 때 했던 말들…… 모두 진심이었어?"
212050-41 = "3;마코토;00;이 몸은 언제나 진심이다."
212050-42 = "1;카렌;10;그러니까, 전쟁을 하겠다는 거 진심이지……? 게헨나가 키보토스를 정복한다는 것도……?\n#1;em;…"
212050-43 = "3;마코토;05;어째서 진심이 아니었다고 생각하지? 이 하누마 마코토 님의 목소리에 담긴 진실성보다 더 명확한 증거가 필요하다는 말인가?"
212050-44 = "1;마유미;04;아니…… 그게. 좀 이상하잖아. 갑자기 전쟁이라니…….\n#1;em;[땀]"
212050-45 = "1;마유미;26;그리고 지금 만마전과 선도부, 너무 강압적이야. 아까 봤는데 개인이 소지한 탄약도 모두 압류해 가더라. 이렇게까지 할 필요가 있는 거야?"
212050-46 = "3;마코토;10;그건 이 몸이 직접 내린 지령이었다. 잘 이루어지고 있는 모양이군. 키킥.\n#3;em;[반응]"
212050-47 = "1;마유미;04;그, 그런…….\n#1;stiff"
212050-48 = "3;마코토;99;흥, 익숙했던 현실의 격변이 두려운가? 변화란 언제나 낯설고 두려운 법이지."
212050-49 = "3;마코토;01;하지만 보아라. 선도부와 만마전이 손을 잡고, 전교생이 게헨나의 깃발 아래 집결했다.\n#3;m4"
212050-50 = "3;마코토;03;후리하타 마유미. 네가 꿈꾸던 하나 된 게헨나가 바로 눈앞에 있지 않나? 키시싯.\n#3;em;[재잘]"
212050-51 = "1;마유미;27;……하지만 선배, 개인의 의지라는 것도 있잖아? 우리가 꿈꾸던 건 모두 자신의 의지로 행동해서 위대해지는 거였는데……\n#1;em;[속상함]"
212050-53 = "3;쇼코;S2_02;회장, 의지라는 것은 결국 환경에 의해 만들어지는 산물입니다.\n#3;em;[반응]"
212050-54 = "3;쇼코;S2_01;우리는 기존의 무질서라는 환경을 철저히 통제된 질서로 바꿔가고 있는 거고요."
212050-56 = "5;마코토;01\n1;마유미;02;쇼코…….\n#1;em;…"
212050-57 = "5;마코토;00;그렇다면 묻지. 너희는 진심인가?\n#5;em;[?]"
212050-58 = "1;카렌;04;뭐, 뭘?\n#1;stiff"
212050-59 = "5;마코토;01;더욱 위대해질 게헨나를 위해 키보토스를 정복할 준비가 되었냐는 물음이다."
212050-60 = "5;마코토;00;네 녀석들이 입버릇처럼 말하지 않았던가. 더욱 위대한 게헨나. 다시금 위대해질 게헨나."
212050-61 = "1;카렌;06;……."
212050-62 = "5;마코토;99;바로 지금이 그때다. 예전의 게헨나로 돌아가고 싶다고 했었지.\n#5;em;[한숨]"
