[translation]
212050-1 = "ตอนที่ 5;ขอลาออกค่ะ"
212050-2 = "ห้องประชุมปฏิบัติการ แพนเดโมเนียม โซไซตี้"
212050-4 = ""
212050-7 = ""
212050-8 = "ท่านประธานมาโคโตะ สองคนจากคณะกรรมการฟื้นฟูมาขอเข้าพบค่ะ"
212050-9 = ""
212050-12 = ""
212050-13 = "อืม อนุญาต"
212050-15 = "ค่ะ จะเชิญเข้ามาด้านในเดี๋ยวนี้ค่ะ"
212050-16 = ""
212050-18 = ""
212050-19 = "..."
212050-24 = ""
212050-25 = "อ่า..."
212050-26 = ""
212050-29 = ""
212050-30 = "ฮึ่ม มาด้วยเรื่องอะไรกัน ฟุริฮาตะ มายูมิ เมียวรากุ คาเรน"
212050-32 = "เอ่อ อืม คือว่า..."
212050-33 = "รุ่นพี่ประธาน ฉันขอถามตรงๆ เลยนะ"
212050-34 = ""
212050-37 = ""
212050-38 = "คิกคิกคิก... เสียมารยาทเหลือเกินนะ แต่การยอมรับนิสัยแบบนั้นได้ก็แสดงถึงความใจกว้างของเรา งั้นก็ว่ามา"
212050-39 = "อึก... ให้ตายสิ"
212050-40 = "เอาเป็นว่า รุ่นพี่ประธาน คำที่พูดตอนปราศรัยน่ะ... จริงจังทั้งหมดเลยเหรอ?"
212050-41 = "เราจริงจังเสมอ"
212050-42 = "หมายความว่าจะทำสงครามจริงๆ ใช่มั้ย...? รวมถึงเรื่องที่เกเฮนน่าจะพิชิตคิโวทอสด้วย...?"
212050-43 = "ทำไมถึงคิดว่าเราไม่จริงจังล่ะ? หรือว่าต้องการหลักฐานที่ชัดเจนยิ่งกว่าความจริงใจที่อยู่ในน้ำเสียงของ#nท่านฮานุมะ มาโคโตะผู้นี้?"
212050-44 = "ไม่ใช่... คือว่า มันแปลกนี่นา จู่ๆ จะทำสงครามกัน..."
212050-45 = "แล้วตอนนี้แพนเดโมเนียม โซไซตี้กับคณะกรรมการวินัยก็บีบบังคับกันเกินไป ฉันเห็นเมื่อกี้ กระสุนที่นักเรียนถือครองเป็นการส่วนตัวก็ถูกยึดไปหมด มันต้องทำถึงขนาดนี้เลยเหรอ?"
212050-46 = "นั่นเป็นคำสั่งของเราเอง ดูเหมือนกำลังดำเนินไปด้วยดีสินะ คิกคิก"
212050-47 = "ระ... เรื่องแบบนั้น..."
212050-48 = "ฮึ่ม กลัวความเปลี่ยนแปลงครั้งใหญ่ของความเป็นจริงที่เคยคุ้นเคยงั้นเหรอ? การเปลี่ยนแปลงย่อมไม่คุ้นเคยและน่ากลัวอยู่เสมออยู่แล้ว"
212050-49 = "แต่จงดูเสีย คณะกรรมการวินัยกับแพนเดโมเนียม โซไซตี้จับมือกัน และนักเรียนทั้งโรงเรียนรวมตัวอยู่ใต้ธงของเกเฮนน่า"
212050-50 = "ฟุริฮาตะ มายูมิ เกเฮนน่าที่รวมเป็นหนึ่งที่เธอเคยใฝ่ฝันอยู่ตรงหน้าแล้วไม่ใช่เหรอ? คิกคิกคิก"
212050-51 = "แต่รุ่นพี่... แต่ละคนก็มีเจตจำนงของตัวเองไม่ใช่เหรอ? สิ่งที่พวกเราใฝ่ฝันคือการที่ทุกคนลงมือด้วย#nเจตจำนงของตัวเอง แล้วร่วมกันสร้างความยิ่งใหญ่ต่างหาก..."
212050-53 = "หัวหน้า เจตจำนงก็เป็นเพียงสิ่งที่ถูกหล่อหลอมขึ้นจากสภาพแวดล้อมค่ะ"
212050-54 = "และพวกเราก็กำลังเปลี่ยนสภาพแวดล้อมเดิมที่ไร้ระเบียบ ให้กลายเป็นระเบียบที่ถูกควบคุมอย่าง#nสมบูรณ์ค่ะ"
212050-56 = "โชโกะ..."
212050-57 = "ถ้างั้นเราขอถาม พวกเธอเอาจริงกันหรือเปล่า?"
212050-58 = "อะ... อะไรเหรอ?"
212050-59 = "เรากำลังถามว่าพวกเธอพร้อมจะพิชิตคิโวทอส เพื่อเกเฮนน่าที่จะยิ่งใหญ่ขึ้นกว่าเดิมหรือยัง"
212050-60 = "พวกเธอพูดจนติดปากเลยไม่ใช่เหรอ คำที่ว่า 'เกเฮนน่าที่ยิ่งใหญ่กว่าเดิม เกเฮนน่าที่จะยิ่งใหญ่อีกครั้ง'"
212050-61 = "..."
212050-62 = "ตอนนี้แหละคือเวลานั้น พวกเธอเคยบอกว่าอยากให้เกเฮนน่ากลับไปเป็นเหมือนในอดีตนี่นา"
212050-63 = "ดูสิ ตอนนี้ทุกคนกำลังรวมใจเป็นหนึ่งและมุ่งไปยังเป้าหมายเดียวกันเหมือนในตอนนั้นแล้ว เป็นยังไงล่ะ?"
212050-64 = "แต่ว่า รุ่นพี่ประธาน..."
212050-65 = ""
212050-67 = ""
212050-68 = "เมื่อก่อนรุ่นพี่เคยบอกไว้ไม่ใช่เหรอ ว่าชอบเกเฮนน่าในปัจจุบันมากกว่าเกเฮนน่าในอดีต"
212050-69 = "ตอนที่พวกเรามาขออนุญาตทำกิจกรรม รุ่นพี่ก็พูดแบบนั้นนี่นา พูดถึงเรื่องอิสรภาพด้วย"
212050-71 = "ใช่ ทำไมจู่ๆ ถึงเปลี่ยนไปล่ะ? ไม่ใช่แค่รุ่นพี่คนเดียว แต่รุ่นพี่คนอื่นๆ ก็ด้วย..."
212050-72 = ""
212050-75 = ""
212050-76 = "คิกคิกคิก... นั่นเป็นแค่คำพูดในตอนที่เรายังไม่ตระหนักถึงความจริง"
212050-77 = "อิสรภาพที่ได้มาแค่ครึ่งๆ กลางๆ เทียบกับระเบียบภายใต้การควบคุมอย่างสมบูรณ์แล้ว มันก็เป็น#nเพียงสิ่งที่ไร้ประสิทธิภาพอย่างยิ่ง และเป็นปัจจัยไม่แน่นอนที่ไม่รู้ว่าจะออกนอกลู่นอกทางไปเมื่อไร"
212050-78 = "ตอนนั้นพวกเธอเองก็เคยพูดไม่ใช่เหรอ ว่าอิสรภาพที่ดูดีเพียงเปลือกนอกน่ะมันไม่มีความหมาย"
212050-80 = "กะ... ก็เคยพูดแบบนั้นจริงอยู่หรอก..."
212050-82 = "เรารับประกันได้ หลังสงครามจบลง เกเฮนน่าจะกลายเป็นโรงเรียนที่เจิดจรัสเกินกว่าที่พวกเธอจะ#nจินตนาการถึงเลยละ"
212050-83 = "ตอนนี้เดินตามเรามาแค่นั้นก็พอ"
212050-84 = ""
212050-87 = ""
212050-88 = ""
212050-90 = "..."
212050-92 = "เอาเป็นว่า... เข้าใจแล้ว พวกเราจะกลับไปก่อน"
212050-94 = "คิกคิกคิก จงคิดให้ดีว่าต่อจากนี้ควรวางตัวยังไง"
212050-95 = ""
212050-98 = ""
212050-101 = ""
212050-102 = "มีอะไร อิโรฮะ ถ้ามีอะไรจะพูดก็รีบพูดมา"
212050-103 = "รุ่นพี่มาโคโตะ... เอาจริงสินะคะ?"
212050-104 = "ยังไม่รู้จักเราอีกเหรอ เราไม่เคยพูดเรื่องไร้สาระอยู่แล้ว"
212050-105 = "..."
