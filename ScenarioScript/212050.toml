[translation]
212050-1 = "第5話;辞めます"
212050-2 = "万魔殿・作戦会議室"
212050-8 = "マコト議長、ゲヘナ再興委員会が面会を求めています。"
212050-13 = "うむ、許可する。"
212050-15 = "中へお通しいたします。"
212050-19 = "……。"
212050-25 = "あ……。"
212050-30 = "ふん。何の用だ。[ruby=ふりはた]降旗[/ruby]マユミ、[ruby=みょうらく]明楽[/ruby]カレン。"
212050-32 = "えっと、その……。"
212050-33 = "議長先輩、まどろっこしいのは無しね。"
212050-38 = "キシシッ……無礼極まりなくとも許してやるのが度量というもの。言ってみるがいい。"
212050-39 = "っとにもう……。"
212050-40 = "とにかく、あの演説。あれ、本気？"
212050-41 = "この私はいつだって本気だ。"
212050-42 = "じゃあ、ゲヘナはキヴォトスに攻撃をしかけるの？"
212050-43 = "逆に問おう。なぜ本気を疑う？#nこの[ruby=はぬま]羽沼[/ruby]マコト様の言葉では信用に足らぬとでも？"
212050-44 = "いや、だって……キヴォトスを攻撃する、とか。いきなり言われても困っちゃうよ。"
212050-45 = "それに、ちょっと強引だよ。さっき見たけど、生徒の弾薬まで取り上げてたし。#nそこまでする？"
212050-46 = "キキキッ。私の指令は正しく機能しているようだな。"
212050-47 = "そんな……。"
212050-48 = "ふん、あれだけ大口を叩いておきながら、怖がっているのか？#n変化とは常に見慣れず、恐ろしいものなのだ。"
212050-49 = "今や風紀委員会と万魔殿は手を組み、全校生徒がゲヘナの旗の下に集結した。"
212050-50 = "お前が夢見ていた「一つになったゲヘナ」はここに結実したのだ。"
212050-51 = "……でもさ、個人の意志も大事じゃない？#n私たちが夢見てたのは、みんなが自分の意志でまとまって、それで偉大になることだったのに……。"
212050-53 = "お言葉ですが委員長。#n意志は環境によって形作られるものです。"
212050-54 = "無秩序という既存の環境を、徹底的に統制された秩序へと変えてきただけですよ。"
212050-56 = "ショウコ……。"
212050-57 = "ならば問おう。お前たちは本気なのか？"
212050-58 = "な、何が？"
212050-59 = "偉大なゲヘナの礎とするため、キヴォトスに敵対する覚悟はあるのか？"
212050-60 = "お前たちは口癖のように言っていたではないか。#nゲヘナを偉大に、偉大なゲヘナを再び、と。"
212050-61 = "……。"
212050-62 = "かつてのゲヘナに戻りたかったのだろう？#nまさに今がその時なのだ。"
212050-63 = "あの頃のように皆の心が一つにまとまり、同じ目標へ向かい進んでいる。"
212050-64 = "でもさ……。"
212050-68 = "議長先輩、昔より今のゲヘナのほうが良いんじゃなかったの？"
212050-69 = "うちらが活動の許可をもらいに来たとき、そう言ってたじゃん。自由だって。"
212050-71 = "そうだよ。何で急に変わったの？先輩だけじゃなく、ほかの先輩たちまで……。"
212050-76 = "キシシッ……あの時はまだ真理に辿り着いていなかった。それだけのことだ。"
212050-77 = "完全な統制の下に成り立つ秩序と比べてみろ。#n半端に与えられた自由など、極めて非効率で予測のつかない不安要素にすぎんのだ。"
212050-78 = "むしろあの時、お前たちこそ言っていたではないか。#n見かけ倒しの自由に意味はないと。"
212050-80 = "そ、それは確かに言ったけど……。"
212050-82 = "この私が保証しよう。#n事を成し遂げた後のゲヘナは、お前たちでは想像もできぬほど眩く輝く学園となる。"
212050-83 = "今はただ、このマコト様についてくればいい。"
212050-90 = "……。"
212050-92 = "……分かった。今日は帰るね。"
212050-94 = "キシシッ。今後の振る舞いを、よく考えておくことだ。"
212050-102 = "何だ、イロハ。言いたいことがあるならさっさと言え。"
212050-103 = "マコト先輩は……本気なんですよね？"
212050-104 = "またその話か？お前なら知っているはずだ。私は戯言を口にしたことなど一度もない。"
212050-105 = "……。"
212050-107 = "じゃあ、私……万魔殿、辞めます。"
212050-111 = "何だと？"
212050-112 = "私の知っているマコト先輩は、そんなことは言いません。"
212050-113 = "変わってしまったマコト先輩を……私はもう、見たくないので。"
212050-115 = "い、イロハちゃん……？"
212050-116 = "……。"
212050-118 = "イロハ先輩……？"
212050-120 = "……そうか。"
212050-121 = "はい。"
212050-122 = "ならば、好きにするがいい。"
212050-123 = "……。"
212050-124 = "ふん……お前ならば、万魔殿を継ぐこともあり得ると思っていたのだが……。"
212050-125 = "ここまで、ということか。"
212050-126 = "はい。短くない間、お世話になりました。"
212050-131 = "……。"
212050-137 = "イロハ……先輩……？"
212050-138 = "やめる、って……もう万魔殿じゃないの……？"
212050-139 = "ど、どどどうしましょう！？イロハちゃんが……！！"
212050-141 = "騒ぐな。"
212050-145 = "で、でも！"
212050-146 = "今のゲヘナは重要な岐路に立っている。#n精巧な歯車のように全てが噛み合わなければ、大業は成せん。"
212050-147 = "身命を賭して臨み、偉大なるゲヘナを築かねばならぬ時――軋むネジなど不要！！"
212050-153 = "……マコト先輩、ひどい！"
212050-157 = "そんなこと言っちゃダメだよ！"
212050-158 = "……違うぞ、イブキ。今は個人的な関係に囚われる時ではないのだ。"
212050-159 = "我らの宿願を果たすためには――"
212050-160 = "知らない！イブキ、よく分かんないけど……イロハ先輩は悲しそうだった！"
212050-161 = "くっ……！"
212050-166 = "サツキ、チアキ。イブキをなだめておけ。"
212050-167 = "ショウコ、視察に出る。在庫物資の書類を持って随行しろ。"
212050-168 = "承知しました。"
212050-175 = "……。"
212050-176 = "マコト先輩……。"
212050-182 = "……ひっく。"
212050-184 = "う、うぅ……うえぇ……うええぇぇ～～～～ん。"
212050-188 = "い、イブキちゃん！#nマコト先輩もイロハちゃんも……ほ、本心じゃないかもしれないよ！"
212050-189 = "あっ、そうだ！プリン食べよっか？甘いもの食べたら気分も良くなるし～～！！"
212050-191 = "いらない……うえぇん……ケンカしないで……ひどいことも言わないでぇ……ひぃん。"
212050-192 = "言わないよ！言わないから！ほら、落ち着いて……。"
212050-197 = "イロハちゃん……。"
212050-203 = "……。"
212050-204 = "議長。"
212050-205 = "……。"
212050-206 = "イロハ議員……いえ[ruby=なつめ]、棗イ[/ruby]ロハをこのまま放置されるおつもりですか。"
212050-207 = "何が言いたい。"
212050-208 = "棗イロハは、議長に従わぬ意志を明確にしました。"
212050-209 = "もはや彼女はゲヘナの結束を損なう者。見逃してよい理由は無いかと。"
212050-210 = "要注意人物に指定し、事と次第によっては反逆に対する――"
212050-212 = "そこまでだ。"
212050-213 = "……。"
212050-214 = "処遇は、この私が決める。"
212050-215 = "進言は聞いてやる。だが、分を弁えろ。"
212050-216 = "……失礼しました。"
212050-217 = "……行くぞ。"
212050-222 = "……やはり、すべてをコントロールできるわけではありませんか。"
212050-223 = "とはいえ、この程度でも十分でしょう。ふふ。"
212050-228 = "次回;温泉開発部"
