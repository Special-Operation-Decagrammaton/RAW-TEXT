212050-108 = ""
212050-110 = ""
212050-111 = "ว่าไงนะ?"
212050-112 = "ถ้าเป็นรุ่นพี่มาโคโตะที่ฉันรู้จัก ต่อให้เคยพูดอะไรไม่เข้าท่าออกมาบ้าง ก็ไม่มีทางพูดเรื่องแบบในตอนนี้#nแน่ค่ะ"
212050-113 = "ฉันไม่อยากเห็นรุ่นพี่มาโคโตะที่เปลี่ยนไปจนกลายเป็นแบบนี้... อีกต่อไปแล้วค่ะ"
