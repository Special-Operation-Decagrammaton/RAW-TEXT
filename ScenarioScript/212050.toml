212050-42 = "So you genuinely want to start a war...? And begin Gehenna's conquest of Kivotos...?"
212050-43 = "What brings about all this doubt? The sincerity of my voice should be evidence enough."
212050-44 = "It's only...well. It was a bit much to suddenly pivot to devastating war and all that."
212050-45 = "And the Pandemonium Society and Prefect Team are being so forceful with the students. I saw them confiscating privately-held ammo. Like is any of this necessary?"
212050-46 = "I personally issued that edict. It sounds like it is proceeding smoothly. Kihe."
212050-47 = "Th-That's..."
212050-48 = "Hmph, are you frightened by the recent reforms? Changes are always uncomfortable at first."
212050-49 = "But behold. The Pandemonium Society and Prefect Team have come together! All students have united under the Gehenna flag."
212050-50 = "Furihata Mayumi. Isn't the glorious united Gehenna you dreamed of staring right at you? Kihehe."
212050-51 = "...But Makoto, what about free will? When we dreamed of a glorious Gehenna, we thought everyone would join willingly."
212050-53 = "President, will is ultimately nothing but a product of the environment."
212050-54 = "And we are merely correcting the existing environment of disorder to one of strictly-controlled order."
212050-56 = "Shouko..."
212050-57 = "Then allow me to ask you two. Are YOU serious?"
212050-58 = "A-About what?"
212050-59 = "I am asking if you are prepared to conquer Kivotos for Gehenna. Do you think this is necessary to restore glory to Gehenna? Yes...or no?"
212050-60 = "Is this not what you had grandstanded about? A unified, gestalt Gehenna. A glorious Gehenna, as it once was."
212050-61 = "..."
212050-62 = "Now is the moment. You said you wanted to return to the Gehenna of the past."
212050-63 = "And now, as it was back then, everyone is moving toward a single goal under a united mind. What do you think of that?"
212050-64 = "But Chairman..."
212050-65 = ""
212050-67 = ""
212050-68 = "You said you liked the way Gehenna was. You said it was functioning just as you intended."
212050-69 = "That's what you told us when we met with you, when you went on about the value of freedom, even if it was chaotic."
212050-71 = "Yeah. What made you change so suddenly? And not just you, but the other upperclassmen as well...?"
212050-72 = ""
212050-75 = ""
212050-76 = "Kihehe... That was merely a rhetorical argument from before I realized the truth."
212050-77 = "Haphazardly-granted freedom is unpredictable and inefficient. What Gehenna needs is absolute order maintained through perfect control."
212050-78 = "Didn't you debate me about this? You argued that my Gehenna's so-called freedom only resulted in meaningless chaos."
212050-80 = "Th-That is the gist of what we said..."
212050-82 = "I promise you this. After the war, Gehenna will shine brighter than you could ever imagine."
212050-83 = "All you need to do is to follow me."
