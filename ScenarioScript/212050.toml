212050-137 = "รุ่นพี่... อิโรฮะ..."
212050-138 = "รุ่นพี่ไปแล้วเหรอ...? ต่อไปนี้ไม่ใช่สมาชิกแพนเดโมเนียม โซไซตี้แล้วเหรอ...?"
212050-139 = "อะ... อ๊า... ทะ... ทำยังไงดีคะ?! อิโรฮะจัง...!!"
212050-141 = "อย่าส่งเสียงเอะอะ"
212050-142 = ""
212050-144 = ""
212050-145 = "เอ๊ะ แต่ว่า!"
212050-146 = "ตอนนี้เกเฮนน่ากำลังยืนอยู่บนทางแยกที่สำคัญยิ่งกว่าสิ่งใด ทุกคนต้องทำงานประสานกันราวกับ#nฟันเฟืองที่ขบกันอย่างลงตัว ถึงจะบรรลุภารกิจอันยิ่งใหญ่ได้"
212050-147 = "นี่คือเวลาที่ต้องทุ่มเททั้งใจเพื่อสร้างเกเฮนน่าอันยิ่งใหญ่ เราไม่ต้องการสกรูที่ฝืดจนส่งเสียงเอี๊ยดอ๊าด!!"
212050-148 = ""
