[translation]
212050-1 = "第5話;我要退出"
212050-2 = "萬魔殿．作戰會議室"
212050-4 = ""
212050-7 = ""
212050-8 = "真琴議長，再興委員會的兩位前來請求會面。"
212050-9 = ""
212050-12 = ""
212050-13 = "嗯，准了。"
212050-15 = "是，我這就帶他們進來。"
212050-16 = ""
212050-18 = ""
212050-19 = "……"
212050-24 = ""
212050-25 = "啊……"
212050-26 = ""
212050-29 = ""
212050-30 = "哼。找我有什麼事，降旗真由美、明樂香蓮。"
212050-32 = "呃，嗯，那個……"
212050-33 = "議長前輩，我就直說了。"
212050-34 = ""
212050-37 = ""
212050-38 = "嘰嘻嘻……雖然無禮至極，但能包容這種地方才是本大人的度量吧。說來聽聽。"
212050-39 = "唔……真是的。"
212050-40 = "議長前輩，你演講時說的那些話……全都是認真的嗎？"
212050-41 = "本大人向來都是認真的。"
212050-42 = "所以說，要發動戰爭是認真的……？格黑娜要征服奇普托斯也是……？"
212050-43 = "為何會認為不是認真的？#n難道比起我羽沼真琴大人聲音中的真誠，你還需要更明確的證據嗎？"
212050-44 = "不是……那個，很奇怪吧。突然就說要打仗……"
212050-45 = "而且現在萬魔殿和風紀委員會也太強硬了。#n我剛才看到，連個人持有的彈藥都全部被沒收了。有必要做到這種地步嗎？"
212050-46 = "那是本大人親自下達的指令。#n看來執行得很順利啊。嘻嘻。"
212050-47 = "怎，怎麼會……"
212050-48 = "哼，害怕熟悉的現實發生劇變嗎？#n變化這種東西，總是陌生又令人畏懼的。"
212050-49 = "但是你們看看。#n風紀委員會與萬魔殿攜手合作，全校學生都已集結在格黑娜的旗幟之下。"
212050-50 = "降旗真由美。你所夢想的合而為一的格黑娜，不就在眼前了嗎？嘰嘻嘻。"
212050-51 = "……可是前輩，個人的意志也是很重要的吧？#n我們夢想的是大家憑著自己的意志行動，進而變得偉大啊……"
212050-53 = "委員長，所謂的意志，終究是由環境所塑造出的產物。"
212050-54 = "我們只是在把既有的無秩序環境，轉變為受到徹底控管的秩序而已。"
212050-56 = "翔子……"
212050-57 = "那我倒要問問你們。你們是認真的嗎？"
212050-58 = "什，什麼？"
212050-59 = "我是在問你們「是否已經做好為了更偉大的格黑娜征服奇普托斯」的準備。"
212050-60 = "你們不是把這句話當成口頭禪掛在嘴邊嗎？#n更加偉大的格黑娜，再次變得偉大的格黑娜。"
212050-61 = "……"
212050-62 = "現在正是時候。#n你們說過想回到從前的格黑娜吧？"
212050-63 = "來，就像那時一樣，大家同心協力，朝著同一個目標前進。如何？"
212050-64 = "可是議長前輩……"
212050-65 = ""
212050-67 = ""
212050-68 = "你以前明明說過，比起過去的格黑娜，現在的格黑娜更好啊。"
212050-69 = "我們來申請活動許可的時候，你就是這麼說的。#n還說什麼自由。"
212050-71 = "沒錯。為什麼突然變了？#n不只是前輩，連其他前輩們也……"
212050-72 = ""
212050-75 = ""
212050-76 = "嘰嘻嘻……那不過是尚未領悟真理時的說法罷了。"
212050-77 = "草率給予的自由，和在完美控管下建立的秩序相比，#n不過是極度沒有效率又不知道會怎麼發展的不安因素罷了。"
212050-78 = "那時你們不也說過嗎？虛有其表的自由毫無意義。"
212050-80 = "我，我是那樣說過沒錯……"
212050-82 = "本大人向你們保證。#n戰爭結束之後的格黑娜，將會成為你們連想像都想像不到的閃耀學園。"
212050-83 = "現在只要跟在本大人身後就行了。"
212050-84 = ""
212050-87 = ""
212050-88 = ""
212050-90 = "……"
212050-92 = "好吧……我知道了。我們先回去了。"
212050-94 = "嘰嘻嘻。好好想想今後該如何自處吧。"
212050-95 = ""
212050-98 = ""
212050-101 = ""
212050-102 = "怎麼了，伊呂波。有話想說就快點說。"
212050-103 = "真琴前輩……是認真的吧？"
212050-104 = "你還不了解本大人嗎？我可從來沒有亂講話過。"
212050-105 = "……"
212050-107 = "那麼，我要退出萬魔殿。"
212050-108 = ""
212050-110 = ""
212050-111 = "什麼？"
212050-112 = "如果是我認識的真琴前輩，就算會說些傻話，也不會說出像現在這樣的話。"
212050-113 = "我已經……不想再看到像現在這樣變了樣的真琴前輩了。"
212050-115 = "伊，伊呂波醬……？"
212050-116 = "……"
212050-118 = "伊呂波前輩……？"
212050-120 = "……是嗎？"
212050-121 = "是的。"
212050-122 = "那就照你的意思去做吧。"
212050-123 = "……"
212050-124 = "哼……本以為你總有一天能繼承萬魔殿……"
212050-125 = "看來就到此為止了啊，伊呂波。"
212050-126 = "是的。這段時間……承蒙你該死的照顧了。"
212050-127 = ""
212050-129 = ""
212050-130 = ""
212050-131 = "……"
212050-132 = ""
212050-134 = ""
212050-136 = ""
212050-137 = "伊呂波……前輩……"
212050-138 = "前輩走掉了嗎……？已經不是萬魔殿的人了嗎……？"
212050-139 = "嗚，嗚哇……怎，怎麼辦！？伊呂波醬他……！！"
212050-141 = "別大驚小怪的。"
212050-142 = ""
212050-144 = ""
212050-145 = "咦，可是！"
212050-146 = "現在的格黑娜正站在無比重要的十字路口。#n所有人都要像緊密咬合的齒輪般運轉，才能成就大業。"
212050-147 = "正是必須全心全意投入、成就偉大格黑娜的時刻，不需要會嘎吱作響的螺絲！！"
212050-148 = ""
212050-150 = ""
212050-152 = ""
212050-153 = "真琴前輩好壞！"
212050-154 = ""
212050-156 = ""
212050-157 = "不可以對伊呂波前輩說那種話！那是很壞的話！"
212050-158 = "……不對，伊吹。現在不是專注於私人關係的時候。"
212050-159 = "你年紀還小或許無法理解，但為了實現我們所有人的宿願……"
212050-160 = "不知道！伊吹不懂那些，可是伊吹知道伊呂波前輩很難過！"
212050-161 = "嘖……"
212050-162 = ""
212050-164 = ""
212050-165 = ""
212050-166 = "皐月、千秋，去安撫伊吹。"
212050-167 = "翔子，要進行戰時視察。帶上庫存物資的文件隨行。"
212050-168 = "是，我明白了。"
212050-169 = ""
212050-175 = "……"
212050-176 = "真琴前輩……"
212050-177 = ""
212050-179 = ""
212050-181 = ""
212050-182 = "……嗚。"
212050-184 = "嗚，嗚嗚……嗚哇哇哇～～～～"
212050-185 = ""
212050-187 = ""
212050-188 = "伊，伊吹醬！真琴前輩和伊呂波醬應該都不是真心的！"
212050-189 = "對，對了！要不要吃布丁？吃點甜的心情也會變好哦～～！！"
212050-191 = "不要吃……嗚嗚……不要吵架……也不要說很壞的話……嗚嗚嗚。"
212050-192 = "不會說的！不會說的啦！來，冷靜下來……"
212050-193 = ""
212050-195 = ""
212050-196 = ""
212050-197 = "伊呂波醬……"
212050-200 = ""
212050-201 = ""
212050-202 = ""
212050-203 = "……"
212050-204 = "議長。"
212050-205 = "……"
212050-206 = "伊呂波議員……不，您打算放著棗伊呂波不管嗎？"
212050-207 = "……不放著不管要怎麼樣？"
212050-208 = "棗伊呂波已經明確表示不會服從議長的領導。"
212050-209 = "我們不能對破壞合而為一的格黑娜團結之人坐視不管吧？"
212050-210 = "將他列為重點監控對象，視情況追究叛亂……"
212050-212 = "到此為止。"
212050-213 = "……"
212050-214 = "那傢伙的處置由本大人決定。"
212050-215 = "建議我會聽，但你可別越界了，五十嵐翔子。"
212050-216 = "……是。失禮了。"
212050-217 = "……走吧。"
212050-218 = ""
212050-220 = ""
212050-221 = ""
212050-222 = "……果然沒辦法控制所有的想法啊。"
212050-223 = "不過現在這樣也夠了。呵呵。"
212050-224 = ""
212050-226 = ""
212050-228 = "下一話;溫泉開發部"
