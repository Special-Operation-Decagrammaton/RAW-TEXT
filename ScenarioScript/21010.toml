[translation]
21010-1 = "제1화;모험의 시작"
21010-2 = "……"
21010-4 = "들리나요? 나의 목소리가……"
21010-6 = "그곳에 있나요? 이 세상을 구할……"
21010-11 = "용사여."
21010-12 = "당신을 기다리고 있었습니다."
21010-13 = "태초에 천족과 마족이……."
21010-14 = "……."
21010-15 = "컷컷!"
21010-16 = "안돼! 이건 너무 진부해! 오픈과 동시에 망한 느낌이야!"
21010-17 = "내가 유저라면 프롤로그에서 이 텍스트가 나오는 순간 '아, 삭제해야겠다.' 결심하겠어!"
21010-18 = "다시 다시! 흠흠."
21010-20 = "…… 용사여. 당신을 기다리고 있었습니다."
21010-21 = "제 이름은, 여신 '모모리아'."
21010-23 = "우리의 세계 '밀레니엄 랜드'는, 지금 미증유의 위기에 처했습니다."
21010-24 = "이 위기를 극복하고, 학생회의 폐부 명령으로부터 게임개발부를…… 아니 밀레니엄 랜드를 구원할 수 있는 자는, 오직 당신뿐입니다."
21010-25 = "가혹한 운명일지 모르지만, 간절히 부탁드립니다."
21010-27 = "앞으로 시작될 당신의 모험에……"
21010-28 = "어떠한 시련과 역경이 기다릴지, 지금은 알지 못합니다."
21010-29 = "하지만……. 부디, 용기를 잃지 말아주세요."
21010-30 = "용사님의 곁에는, 당신과 함께할 소녀들이 있을 테니까요."
21010-32 = "새로운 세계에서 소녀들에게 당신은 용사가 아니라……"
21010-34 = "그보다 더 특별한 호칭으로 불리게 될 겁니다."
21010-36 = "그 위대한 이름은 바로……."
21010-39 = "선생님!"
21010-41 = "???"
21010-42 = "……."
21010-43 = "[s1] \"낯선 천장이다…….\"\n[s2] \"여기는 어디……?\""
21010-44 = "와! 선생님이 눈을 떴어!"
21010-45 = "와! 선생님이 눈을 떴어!"
21010-46 = "정신이 드나? 자네 운이 좋군!"
21010-48 = "이상한 말 하지 마. 선생님이 당황했잖아."
21010-49 = "헤헤. 기뻐서 그래~ 선생님 괜찮아? 이대로 눈을 뜨지 않는 줄 알았어."
21010-50 = "다행이에요. 언니가 창밖으로 집어 던진 플라이 스테이션이 선생님 정수리에 명중했을 때, 이대로 살인사건의 용의자가 될 줄 알았거든요."
21010-51 = "언니를 대신해 사과드릴게요."
21010-52 = "흥. 그러는 미도리 너도 내가 '지나가던 선생님이 맞은 것 같아!'라고 외쳤더니 '그럼 플라이 스테이션은 무사한 거야?!'라고 물었잖아."
21010-53 = "그, 그건 우리 게임개발부의 재산목록 제1호라서 무의식적으로……"
21010-54 = "어, 어쨌든!!"
21010-55 = "선생님은, 샬레에서 오신 분이죠?"
21010-56 = "우와! 정말이야?! 우리가 보낸 편지, 읽어준 거구나! 아니 읽더라도 정말 와줄 줄은 몰랐어!"
21010-57 = "[s] \"편지……? \""
21010-59 = "샬레 집무실"
21010-60 = "밀레니엄에서 요청이 들어왔어요."
21010-61 = "발신인은…… 밀레니엄 게임개발부? 헤에. 읽어볼게요."
21010-62 = "\"게임개발부는 지금 존폐 위기에 처했습니다. 학생회의 폐부 명령에 파멸을 눈앞에 둔 지금, 도움을 요청할 수 있는 곳은 당신뿐. 용사여. 저희를 구원해주세요!\""
21010-63 = "아하하…… 지금까지 받은 요청 중 가장 재미있고, 다급해 보이는 문장이네요."
21010-64 = "아. 선생님, 밀레니엄 사이언스 스쿨에 대해…… 알고 계신가요?"
21010-65 = "[s3] \"응.\"\n[s4] \"아니.\""
21010-66 = "아시겠지만……"
21010-67 = "트리니티, 게헨나와 함께 키보토스 3대 학원이라 불리는 대형학원이에요."
21010-68 = "통칭 밀레니엄 학원, 그 어느 학원보다도 합리와 기술의 가치를 중시하죠."
21010-69 = "과학과 연구에 특화된 이공계 학생들의 모임 같은 곳이랄까요."
21010-70 = "전통의 명가라 할 수 있는 두 학원에 비해 역사는 짧지만, 영향력은 그에 못지않아요."
21010-71 = "키보토스에서 최신, 첨단에 관련된 기술은 대부분 밀레니엄에서 시작될 정도니까요."
21010-72 = "그런 곳의 학생들이 무슨 일일까요?"
21010-73 = "트리니티, 게헨나와 함께 키보토스 3대 학원이라 불리는 대형학원이에요."
21010-74 = "통칭 밀레니엄 학원, 그 어느 학원보다도 합리와 기술의 가치를 중시하죠."
21010-75 = "과학과 연구에 특화된 이공계 학생들의 모임 같은 곳이랄까요."
21010-76 = "전통의 명가라 할 수 있는 두 학원에 비해 역사는 짧지만, 영향력은 그에 못지않아요."
21010-77 = "키보토스에서 최신, 첨단에 관련된 건 대부분 밀레니엄에서 시작될 정도니까요."
21010-78 = "궁금하시다면, 가보시겠어요?"
21010-79 = "……."
21010-81 = "밀레니엄 게임개발부"
21010-82 = "선생님! 게임개발부에 온걸 환영해!"
21010-83 = "와주셔서 기뻐요. 선생님."
21010-84 = "나는 모모이! 게임개발부의 시나리오라이터야!"
21010-85 = "저는 미도리, 일러스트레이터이자 게임 비쥬얼에 관련된 전반적인 부분을 맡고 있어요."
21010-86 = "그리고 이 자리에는 없지만, 기획 전반을 맡고 있는 우리 부장 유즈까지 포함해……"
21010-87 = "우리가 바로 게임개발부야!"
21010-88 = "와하하! 이제 선생님이 있으니 '폐허'에 갈 수 있을 것 같네!"
21010-89 = "[s5] \"폐허……?\"\n[s6] \"좀 더 자세히, 상황을 설명해줘.\""
21010-90 = "아, 먼저 상황을 설명할게."
21010-91 = "응!"
21010-92 = "우리 게임개발부는 지금까지, 평화롭게 16비트 게임을 만들고 있었어."
21010-93 = "그러다 어느 날! 학생회의 습격이 시작된 거야!"
21010-94 = "그저께 학생회 사천왕 중 한 명, 유우카가 나타나 최후통첩을 했어."
21010-95 = "[s] \"최후통첩?\""
21010-96 = "거기에 대해선, 제가 직접 말씀드리죠."
21010-97 = "이, 이 목소린?!"
21010-99 = "다음화;세미나 회계 유우카"
