[translation]
1009603-1 = "워터슬라이드 점검"
1009603-2 = "(칸나의 연락을 받고 실외의 워터슬라이드로 향했다.)"
1009603-4 = "……전원 확인, 출수량 확인, 내부 정상 가동 확인."
1009603-5 = "[s] (바쁜 것 같으니 조금 기다릴까…….)"
1009603-6 = "하부 풀 확인. 중량계 정상 작동 확인. 올 클리어."
1009603-10 = "선생님, 올라오셨으면 말을 걸어 주십시오."
1009603-11 = "[s1] \"?!\"\n[s2] \"드, 들켰나…….\""
1009603-14 = "물론, 저를 보고 계셨던 것도 알고 있습니다."
1009603-15 = "시선이 느껴졌으니까요."
1009603-16 = "아, 아뇨, 사과하실 필요는 없습니다. 기분이 나빴던 것은 아니기에……."
1009603-17 = "어쨌든, 본론으로 들어가지요."
1009603-18 = "이 '메가 슬라이드'는 파크 개장 이후 시간이 지난 후에야 운행이 시작됩니다."
1009603-19 = "인기 있는 스릴계 슬라이드이기 때문에, 많은 사람이 한꺼번에 몰리는 것을 방지하기 위해서지요."
1009603-20 = "지금 기기 점검은 모두 끝났고, 정상 작동을 확인한 상태입니다."
1009603-21 = "[s] \"으응……그런데 내가 할 일이 있을까?\""
1009603-22 = "물론입니다."
1009603-23 = "아직 정식 운행 시작까지는 한 단계가 더 남았으니까요."
1009603-24 = "바로 시험 운행입니다. 슬라이드가 정상적으로 작동하는지, 라이프가드가 직접 탑승해 봐야 합니다."
1009603-25 = "그래서, 선생님께 동승을 요청하고자 연락드린 것입니다."
1009603-26 = "[s3] \"동승이라면…….\"\n[s4] \"칸나도 같이 타는 거야?\""
1009603-29 = "네, 그렇습니다."
1009603-30 = "이 슬라이드는 여러 사람이 한 번에 탑승하도록 설계되어 있습니다."
1009603-31 = "그래서, 제가 혼자 타게 되면 적정 몸무게에 미달이 되어, 안전사고의 위험이 있기에……."
1009603-32 = "염치 불고하고, 선생님께 부탁을 드리게 되었습니다."
1009603-33 = "[s5] \"그런 거라면 얼마든지 협조해야지.\"\n[s6] \"안 기다리고 먼저 탈 수 있다면 환영이지.\""
1009603-36 = "감사합니다. 그럼 준비하지요."
1009603-41 = "[ns7] \"한 가지 궁금한데.\"\n[ns8] \"질문 하나 해도 될까?\""
1009603-44 = "네, 제가 대답해 드릴 수 있는 것이라면 대답해 드리겠습니다."
1009603-45 = "네? 놀이기구는 잘 타는 편이냐고요?"
1009603-46 = "……흥미를 위한 놀이기구를 즐기는 편은 아니지만, 그렇다고 겁내서 피하지는 않습니다."
1009603-47 = "웬만한 것에는 놀라지 않는 체질이기도 하고요."
1009603-48 = "[s] \"하지만 이 '메가 슬라이드'는 무섭기로 유명한 기종인데?\""
1009603-49 = "훗, 무서워 봐야, 바주카포를 든 테러리스트보다 무섭겠습니까?"
1009603-50 = "공안국장으로서 위험한 상황에 처한 적도 여러 번 있었습니다."
1009603-51 = "그때에 비하면, 이렇게 안전하게 설계된 놀이기구 정도는 유희거리조차 되지 않지요."
1009603-52 = "[s9] \"대단한걸, 칸나…….\"\n[s10] \"나는 벌써부터 긴장되는데…….\""
1009603-55 = "무섭다면 비명을 질러도 괜찮습니다."
1009603-56 = "어차피 슬라이드 안에서는 얼굴이 보이지 않으니, 부끄러움도 덜할 테니까요."
1009603-57 = "그럼, 이쪽으로 앉으시죠. 시험 운행을 시작하겠습니다."
1009603-59 = "(칸나와 함께 탑승용 튜브에 마주 앉았다.)"
1009603-61 = "자, 그럼 출발합니다. 손잡이를 꽉 잡아 주십시오."
1009603-62 = "3, 2, 1."
1009603-63 = "출발!"
1009603-67 = "[ns] (우웃! 역시 스릴 넘치는데!)"
1009603-68 = "히…… 히이……."
1009603-69 = "히야아아아아아아악!"
1009603-70 = "[s] \"?!\""
1009603-75 = "……."
1009603-76 = "[s] \"…….\""
1009603-77 = "……콜록."
1009603-78 = "[s] \"칸나……무서웠구나.\""
1009603-79 = "무, 무슨 말씀인지 모르겠군요."
1009603-80 = "다시 말씀드리지만, 공안국장인 제게 이런 놀이기구 따위는 아무것도 아닙니다."
1009603-81 = "[s] \"그럼 슬라이드에서의 비명은…….\""
1009603-82 = "저, 저는 아무것도 듣지 못했습니다만?"
1009603-83 = "물소리, 혹은 긴장과 공포로 인한 착각이었으리라 생각합니다."
1009603-84 = "흔히 있는 일이니까요."
1009603-85 = "[s] \"…….\""
1009603-87 = "[ns] \"그럼, 다시 한번 탈까?\""
1009603-89 = "아, 아니요, 괜찮습니다. 시험 운행은 한 번으로 족합니다."
1009603-90 = "다시 안 탈 겁니다."
1009603-91 = "절대로!"
