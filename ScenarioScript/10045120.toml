[translation]
10045120-1 = "에필로그;이야기의 마무리"
10045120-5 = "봄#n이#n타#n오#n른"
10045120-7 = "여#n름#n의#n마#n지#n막#n에"
10045120-9 = "가#n을#n의#n바#n람"
10045120-12 = "[log=치세 수영복]봄이타오른[/log]"
10045120-13 = "[log=치세 수영복]여름의마지막에[/log]"
10045120-14 = "[log=치세 수영복]가을의바람[/log]"
10045120-15 = "(결국 경기장은 거대한 폭발을 일으키며 바다에 가라앉았다.)"
10045120-16 = "(지금은 모두가 그 잔해를 치우는 중이다…….)"
10045120-18 = "괘, 괜찮아요! 경기장이 망가지긴 했어도 이번 대회는 백귀야행의 역사에 기록될 대성공이었으니까요!"
10045120-19 = "그렇습니다! 얼마나 가슴 뛰는 승부가 이어졌던지!"
10045120-20 = "다들 수고하셨습니다. 정리까지 도와주셔서 정말 감사해요."
10045120-22 = "덕분에 정말 좋은 경험을 했어. 우리 중에서 우승자도 나왔고."
10045120-24 = "에이, 나만 우승한 게 아니잖아?"
10045120-25 = "그렇습니다! 렌게 공과의 공동 우승입니다, 닌닌!"
10045120-26 = "경기장이 부서지는 바람에 승부를 못 낸 게 좀 아쉽지만, 가슴 뜨거운 승부였어."
10045120-27 = "이즈나도 마찬가지입니다. 정말 영광이었어요!"
10045120-29 = "본경기 이외에도 이벤트 매치도 대인기였사와요!"
10045120-30 = "맞아."
10045120-31 = "폭발이 없었다면 어떤 전개가 되었으려나."
10045120-33 = "그분은 어디에 계신가요? 안 보이네요."
10045120-34 = "지금쯤 다른 곳에서 잔해를 치우고 있을 거야."
10045120-35 = "겸사겸사 수영 특훈을 하면서 말이야."
10045120-38 = "스읍…… 후우…… 스읍……."
10045120-44 = "하나, 둘, 하나, 둘……."
10045120-45 = "(이게 렌게가 말한 <힘을 풀고 즐긴다>라는 느낌일까?)"
10045120-46 = "(좋아. 이제 개헤엄…… 아니, 이 수영법은 거의 완벽해.)"
10045120-47 = "(조금 더 익숙해지면 다음 단계로 넘어가도…….)"
10045120-48 = "[ns1] \"오, 이젠 정말 수영 잘하는구나!\"\n[ns2] \"우리 키쿄, 물냥이 다 됐네!\""
10045120-51 = "서, 앗, 꼬르륵…… 선생님?!"
10045120-55 = "[ns] \"괘, 괜찮아?!\""
10045120-56 = "……!!"
10045120-61 = "[ns3] \"수영 안 하는 거야?\"\n[ns4] \"미안, 방해됐으려나.\""
10045120-64 = "이쪽에 떠 있던 잔해는 다 치웠어. 그러니까 연습은 이제는 끝."
10045120-65 = "……그 표정은 뭐야? 내 꼴사나운 모습을 계속 보고 싶었던 거야?"
10045120-66 = "[s5] \"꼴사납다니. 누가 봐도 대견하던데?\"\n[s6] \"키쿄는 보란 듯이 자신의 약점을 극복했잖아?\""
10045120-69 = "이 정도로는 아직 멀었어."
10045120-70 = "……뭐, 그래도 이번 일을 겪으면서 여러 가지를 배웠어."
10045120-71 = "앞으로는 못 하는 게 있으면 자존심 내세우지 않고 솔직하게 이야기할 생각이야."
10045120-72 = "부족한 나라도, 누구보다 좋아해 주는 사람들이 곁에 있다는 걸 알았으니까."
10045120-73 = "……조금 전 이야기, 다른 사람한텐 절대로 말하지 마. 알겠지?"
10045120-74 = "[s] \"좋아! 대신 수영을 계속 연습하자! 내가 도와줄게!\""
10045120-75 = "뭐, 뭐라고……?"
10045120-79 = "……어쩔 수 없네. 비밀이 폭로되면 안 되니."
10045120-83 = "오? 선생님이랑 수영하는 거야?"
10045120-84 = "레, 렌게?"
10045120-86 = "우리도 같이하자. 뒷정리는 이제 끝났으니까."
10045120-87 = "네! 모두 선생님과 함께 여름을 즐기는 것이어요!"
10045120-89 = "그럼 저쪽 바위까지 누가 먼저 갔다 오는지 승부야."
10045120-90 = "아 맞다, 스승님. #n아까 선수 소개문 적은 거 스승님이지?"
10045120-91 = "각오해 두라고!"
10045120-92 = "……아아, 그러고 보니."
10045120-93 = "[ns7] \"후후, 그래! 나다!\"\n[ns8] \"하지만 아무도 날 심판하지 못해!\""
10045120-96 = "[ns] \"그게 이벤트 해설자의 권리다!\""
10045120-97 = "후훗, 그 여유, 언제까지 부릴 수 있을까……?"
10045120-99 = "자, 그럼 하나 둘 셋 하고 출발하는 것이어요!"
10045120-100 = "하나~!"
10045120-101 = "둘!"
10045120-103 = "[ns] \"셋~!\""
10045120-114 = "끝없이 맑고 푸른 하늘에, 따가운 태양. #n여름은 바로 여기에 있다."
10045120-115 = "이것은, 모두의 우정과 청춘이 담긴 이야기."
10045120-116 = "백에서 피어난 한 송이 ~정정당당하게, 수상 승부~"
