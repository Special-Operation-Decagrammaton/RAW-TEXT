[translation]
2300605-1 = "백야당의 간판 아가씨는 프로페셔널!"
2300605-2 = "(문자를 받고 난 뒤, 무언가 낌새가 이상하다고 느껴 백야당을 찾았다.)"
2300605-5 = "[s] \"아, 시즈코. 저기…….\""
2300605-6 = "여기, 주문하신 만쥬 세트 나왔습니다!"
2300605-8 = "앗, 시즈코 따앙! 내가 주문한 건……!"
2300605-9 = "만쥬가 맞는데?"
2300605-10 = "……응? 오늘은, 메뉴가 안 바뀌었네?"
2300605-11 = "아, 그러신가요? 그럼 맛있게 드세요."
2300605-12 = "??"
2300605-16 = "[ns] \"저기, 시즈코…….\""
2300605-21 = "앗! 시즈코 쨩! 위험……!"
2300605-24 = "……하지 않아?!"
2300605-25 = "방금 시즈코 쨩이 넘어지려는 순간, 바닥을 미끄러지면서 아크로바틱한 움직임을!"
2300605-26 = "앗, 죄송합니다. 잠시 실수했어요."
2300605-27 = "거기다 평소와 달리 사근사근하지 않고, 사무적인 태도까지?!"
2300605-28 = "주문하신 메뉴가 안미츠였죠? 잠시만요."
2300605-29 = "여기, 바로 나왔습니다."
2300605-30 = "거기다 냉철한 모습으로 메뉴를 내오기까지!"
2300605-32 = "뭔가…… 오늘의 시즈코 땅……."
2300605-33 = "빠릿빠릿하고 정확하게 주문을 받는 게……."
2300605-34 = "아, 혹시, 문제가 있으신가요?"
2300605-35 = "차갑고 사무적인 시즈코땅도 머, 멋있어……!"
2300605-36 = "[s] \"뭔가, 엄청난 사태가 벌어진 듯한…….\""
2300605-38 = "(백야당의 영업 종료 시간이 다가왔다.)"
2300605-39 = "영업은 이것으로 종료입니다."
2300605-40 = "오늘 백야당을 찾아와주셔서 감사합니다."
2300605-41 = "……응?"
2300605-42 = "……선생님?"
2300605-43 = "언제, 오셨던 건가요?"
2300605-44 = "[s1] \"어쩐지 내 자리로 주문을 받으러 오지를 않던데.\"\n[s2] \"눈치채지 못한 거였구나.\""
2300605-45 = "죄, 죄송해요. 저……."
2300605-46 = "죄, 죄송해요. 저……."
2300605-47 = "아……."
2300605-51 = "[s] \"시즈코 괜찮아?!\""
2300605-52 = "하아……. 하아……."
2300605-56 = "으응……. 여기는?"
2300605-57 = "[s] \"괜찮아? 쓰러졌길래. 방으로 옮겼어.\""
2300605-58 = "선, 생님?"
2300605-59 = "어떻게 된, 거죠?"
2300605-60 = "[s3] \"너무 무리를 해서 쓰러진 모양이야.\"\n[s4] \"얼마 전에 다른 상점가 축제 준비도 도와주면서 바빴지?\""
2300605-61 = "그건……."
2300605-62 = "그건……."
2300605-63 = "확실히 최근엔 백야당의 손님도 더 늘어났고."
2300605-64 = "마츠리운영관리부 부장으로서 업무가 바빠진 것도 사실이지만……."
2300605-65 = "[s] \"너무 무리하면 안 돼.\""
2300605-66 = "하지만……."
2300605-67 = "전부 제가 해야 할 일인걸요……."
2300605-68 = "허투루 할 수는 없어요."
2300605-69 = "[s5] \"필요하다면 쉬는 것도 필요해.\"\n[s6] \"조금은 땡땡이 쳐도 괜찮아.\""
2300605-70 = "쉬는 것도 필요하다……."
2300605-71 = "쉬는 것도 필요하다……."
2300605-72 = "……선생님이 그런 말을 해도 괜찮은 건가요?"
2300605-73 = "[s] \"응. 피곤하다면 쉬고, 책상에 엎드려서 낮잠을 자도 돼.\""
2300605-75 = "[s7] \"그동안은 곁에 있어줄게.\"\n[s8] \"그때는 손을 잡아줄게.\""
2300605-76 = "……네에……."
2300605-77 = "……네에……."
2300605-78 = "오늘은, 조금만……."
2300605-80 = "선생님, 저, 조금만 잘 테니까……."
2300605-81 = "잠들 때까지 곁에서…… 새액……"
2300605-82 = "새액 새액……."
2300605-84 = "(그렇게 잠시나마 잠든 시즈코 곁에서 조용히 시간을 보냈다.)"
