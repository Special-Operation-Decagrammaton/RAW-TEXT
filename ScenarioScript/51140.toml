[translation]
51140-1 = "제14화;결심하는 소녀"
51140-5 = "[ns] \"하아…… 하아……. 유카리는 어디로…….\""
51140-10 = "(다급하게 유카리의 뒤를 쫓기 위해 거리로 나왔지만, 아쉽게도 거리 어디에서도 유카리의 모습은 발견할 수가 없었다.)"
51140-13 = "축제가 열리는 회장으로 가려면…… 이쪽이지?"
51140-14 = "자자~ 더 늦기 전에 얼른 가야 된다구~"
51140-20 = "앗, 기다려~"
51140-24 = "그러고 보면 이번 축제는 시작부터 커다랗게 빠앙! 하고 불꽃놀이를 쏘는 것으로 시작한다고 하더라구요."
51140-25 = "오, 그거참 기대되네요. 불꽃놀이 연구소에서 만든 야심작이라고 들었는데. 얼마나 예쁠까요?"
51140-27 = "(거리 이곳저곳에서 들려오는 건, 축제에 대한 기대감이 한껏 담겨 있는 사람들의 웅성거림.)"
51140-28 = "(그렇게 출렁이는 인파 속에서 얼마나 유카리를 찾고 있었을까.)"
51140-31 = "선생님……!"
51140-32 = "건너편의 거리를 살펴봤지만 저쪽에서도 유카리 양은 찾지 못했어요!"
51140-33 = "그사이에 정말 놓쳐버린 거 같아서……. 어떡하죠?!"
51140-34 = "[s1] \"사람이 점점 늘고 있으니까…….\"\n[s2] \"이대로면 찾는 건 점점 더 어려워질지도 몰라.\""
51140-37 = "아, 그러고 보니…… 해도 지고 있고, 시간이 벌써 이렇게나……."
51140-38 = "[s] \"시즈코, 이제 축제가 시작되는 거지?\""
51140-39 = "앗, 네. 앞으로 1시간 정도 있다가 본격적으로 시작될 거예요."
51140-40 = "이미 우미카와 피나는 현장에 가서 준비를 하고 있을 테고……."
51140-41 = "[s3] \"그간 시즈코가 엄청 열심히 준비한 축제였었지.\"\n[s4] \"시즈코도 바로 가봐야 하는 거 아니야?\""
51140-44 = "아…… 그건…… 분명, 그렇지만……."
51140-48 = "……."
51140-49 = "……아뇨, 역시 이대로 돌아갈 수는 없어요."
51140-50 = "원래부터 이번 축제에서 가장 중심이 되는 건 축제의 제의…… 그러니까 <카데노코지의 무녀님이 추는 춤>이에요."
51140-51 = "20년 전에 폐지된 축제를 다시 재현하겠다고 마음먹은 이상. <무녀의 춤>은 필요하다고 생각했어요. 누구나가 설레는 축제로 만들기 위해서라도……."
51140-52 = "그런 마음은, 분명 가지고 있지만…… 그 이상으로 유카리 양과 이야기를 나누고 싶어요."
51140-53 = "[s] \"……시즈코.\""
51140-55 = "[ns] \"시즈코는 어째서 폐지된 축제를 다시 재현하고 싶다고 생각한 거야?\""
51140-56 = "그건──"
51140-57 = "단순해요. 특별한 이유가 있었다거나, 반드시 그래야만 한다. 하는 사명감 같은 게 있던 건 아니에요."
51140-59 = "아주 단순하게……. 과거에 잊힌 축제를 다시 재현하고 싶다고. 그러고 싶다고 생각했어요."
51140-60 = "백귀야행이 연합이 되었을 때부터 이어져 왔다고 하는 커다란 의미를 지닌 축제."
51140-61 = "그런 멋진 축제가 이대로 잊힌 채로 사라져야만 한다니. 무척 아깝다고 생각하지 않으시나요?"
51140-62 = "[s] \"그런 부분에선 확실히, 아까울지도…….\""
51140-64 = "네! 바로 그래서예요."
51140-65 = "전 좀 더 많은 사람이 웃을 수 있는…… 그런 축제를 만들고 싶어요."
51140-66 = "그런 축제가 될 수만 있다면…… 네, 관광객들은 즐거워하고. 즐거운 만큼 지갑 끈도 사알짝 쉽게 풀리는 분위기가 되려나~? 하는 기대감도 있고!"
51140-67 = "그걸 통해 저희 백야당의 이름도 온 키보토스에 널리 알려지는 것으로 종국에는 그 누구도 무시 못 할 브랜드 파워를 획득……!"
51140-68 = "……이라는 건 뭐, 역시 농담이지만요. 데헷-!"
51140-69 = "[s] \"농담……?\""
51140-73 = "아니아니, 저 나름대로 심각한 분위기를 풀어보기 위한 농담이었다구요?!"
51140-74 = "뭐어, 물론 쉽지 않은 일인 건 분명하고 그만큼 장애물도 엄-청 많았지만. 그래도 많은 분들이 도와줘서 어떻게든 여기까지 올 수 있었던 거고……"
51140-75 = "아, 물론 선생님도 포함해서요!"
51140-76 = "그러니까…… 모두가 웃는 얼굴로 축제를 맞이해 줬으면 좋겠다고 생각한 거고……."
51140-77 = "그런 축제를 만들기 위해, 저, 잔뜩 노력했던 건데……."
51140-78 = "[s] \"바로 그걸 위해 시즈코는 백화요란까지 찾아왔었지.\""
51140-79 = "맞아요. ……하지만 유카리 양의 문제는, 제 탓이에요."
51140-80 = "이제까지 카데노코지의 이번 대 무녀님에게 연락이 닿지 않았던 건 그냥 운이 나빴을 뿐이라고만 생각했지, 그래도 어떻게든 해결될 수 있을 거라고 생각했는데."
51140-81 = "설마 무녀님에게……. 유카리 양과 백화요란 사이에 그런 일이 있었을 줄은……"
51140-82 = "너무 안일하게 생각해 버린 거죠."
51140-83 = "[s] \"시즈코…….\""
51140-84 = "그렇기에 더욱, 저는 여기서 돌아갈 수 없어요."
51140-85 = "그건 단지 축제의 성공 때문만이 아니라……."
51140-86 = "선생님도 말씀하셨었죠."
51140-88 = "<여기에 남고 싶은가 아닌가는 본인이 정할 문제야.>라고……."
51140-89 = "저도 그렇게 생각해요."
51140-91 = "하고 싶은 걸 하는 건 당연하다고. 그걸 결정하는 건 본인이라고."
51140-92 = "그 누구도 유카리 양에게 그 말을 해주지 않은 거잖아요?"
51140-93 = "그러니 이대로 돌아갈 수 없어요."
51140-94 = "……아니, 돌아가기 싫어요. 유카리 양을 만나 대화를 나누기 전까진."
51140-98 = "[ns5] \"그래…… 역시 시즈코네.\"\n[ns6] \"역시 우리들의 든든한 마츠리부의 부장이라니까!\""
51140-101 = "네?!"
51140-102 = "아, 아뇨! 그런 말을 들을 정도까지는……."
51140-103 = "[s] \"그럼 일단 여기선 둘로 나뉘어져서 찾아보자.\""
51140-104 = "아…… 점점 더 인파가 늘어나기 전에, 찾는 루트를 따로따로 해서 속도전으로 가자, 인 거군요?"
51140-105 = "으음……!"
51140-106 = "네! 선생님 말씀이 맞아요. 지금으로선 그게 최선…… 그 방법으로 가죠!"
51140-107 = "[s] \"그럼 먼저 찾는 쪽이 연락해 주는 거야.\""
51140-108 = "네! 맡겨만 주시라고요!"
51140-109 = "다시 유카리 양의 탐색──"
51140-110 = "스타트예요!"
51140-122 = "(사람들이 이야기를 한다.)"
51140-126 = "이번 대 카데노코지의 아가씨는 우등생이시네요."
51140-127 = "네, 듣기로는 저번 백귀야행 연합고사에서 만점을 받으셨다고……."
51140-128 = "콩쿠르에 나가셔서 우승도 하셨다고 들었어요!"
51140-131 = "네, 정말로 아름답고, 올곧고, 앞을 바라보시는 분이에요."
51140-132 = "무엇이든 척척 해내는 그 모습이야말로 모두의 귀감……."
51140-133 = "앞으로도 참으로 안심이네요. 이대로만 간다면 역시나──"
51140-135 = "[ruby=・]카[/ruby][ruby=・]데[/ruby][ruby=・]노[/ruby][ruby=・]코[/ruby][ruby=・]지[/ruby]의 이름은 백귀야행에서도 영원토록 빛날 수 있겠지요."
51140-140 = "(기대에 부응하는 것이 당연하고.)"
51140-143 = "(기대감에 답하는 것이 마땅하며.)"
51140-144 = "(기대 어린 눈빛에 미소 짓는 것이 자연했다.)"
51140-146 = "그 이름은 카데노코지 유카리."
51140-147 = "백귀야행에서도 명문으로 이름 높은 카데노코지의 여식."
51140-148 = "카데노코지로서 올곧게 있어라."
51140-149 = "그것이 제가 따라야 할 사명이자 의무."
51140-154 = "…………알고 있사와요. 그것이 제가 해야만 하는 일이라는 것쯤은."
51140-156 = "하지만."
51140-158 = "(올곧은 자태.)"
51140-159 = "처음으로…… <해야만 하는 일>이 아닌, <하고 싶은 일>을 보여준 사람."
51140-160 = "처음으로 당신과 만났던 바로 그날."
51140-165 = "저, 저기요!"
51140-166 = "……응? 아직 돌아가지 않고 있었니? 시간도 늦었으니 이만……."
51140-167 = "나구사…… 선배라고 하셨죠! 방금 보여주셨던 모습이 엄청 강하고 멋져서, 소녀 깜짝 놀랐사와요!"
51140-168 = "……응?"
51140-169 = "어떻게 하면 소녀도 나구사 선배처럼 될 수 있을까요?!"
51140-170 = "……쉽게 답할 수 없는 이야기네."
51140-171 = "글쎄……"
51140-172 = "매일같이 열심히 운동, 을 한다든가?"
51140-173 = "으음…. 과연……! 매일같이 운동! 소녀에겐 조금 어려운 일, 일지도……"
51140-178 = "저! 좋은 생각이 떠올랐사와요!"
51140-179 = "우선 먼저 백화요란에 들어가는 것이어요!"
51140-181 = "……응?"
51140-183 = "그렇게 하면…… 나구사 선배와 같이……"
51140-185 = "네! 나구사 선배를 따라! 소녀 또한 함께 활동할 수 있을 터이니! 저! 유카리! 결심했사와요!"
51140-193 = "그때부터…… 소녀는 그날로부터 마음을 먹었사와요."
51140-194 = "백화요란이 되어, 소녀 또한 동경한 그 사람과…… 모두와 함께하고 싶다고."
51140-198 = "하지만."
51140-200 = "백화요란은 이미 끝났어. 전부 끝나버린 거야."
51140-202 = "이제는 인정하도록 해."
51140-203 = "백화요란 놀이는 여기서 끝이야."
51140-205 = "렌게 선배…… 키쿄 선배……"
51140-206 = "다들……"
51140-209 = "소녀가 바랐던 그 풍경이."
51140-210 = "처음부터 그 누구도 돌아가고 싶어 하지 않은 것이었다면……."
51140-213 = "………축제."
51140-214 = "맞아, 축제가…… 얼마 남지 않았사와요."
51140-215 = "……원래라면 이럴 때, 백화요란이, 순찰을…… 돌았어야 했는데………"
51140-216 = "…………이제 더는."
51140-221 = "하아…… 하아……! 발견했다……! 여기 있었군요!"
51140-227 = "유카리 양! 계속 찾고 있었어요!"
51140-228 = "당신은…… 분명 마츠리운영관리부의 부장님……. 그런 분이 저를 왜……."
51140-229 = "아…… 설마 절 찾아온 이유는, 혹시 축제 때문……."
51140-230 = "바로 백화요란 부실로 돌아가죠!"
51140-231 = "……네?"
51140-232 = "백화요란의 작전참모라고 했었죠. 그분……"
51140-233 = "아무리 그래도 말이 너무 심했어요! 유카리 양의 이야기는 들을 생각도…… 마음을 이해할 생각도 없이 그렇게 말하다니!"
51140-234 = "자기가 있을 곳을 정하는 건 자기 자신이어야 하는데! 뭘 그렇게 잘난 듯이!"
51140-235 = "자! 이러고 있을 게 아니라. 돌아가서 더 이야기를 나눠보는 거예요!"
51140-236 = "이런 상황에서는 마음을 터놓고 더 진득하게 대화를 나눌 필요가 있으니까! 그렇죠?!"
51140-238 = "마츠리부의 부장님께선…… 그런 말씀을 하시려고 저를……?"
51140-239 = "하지만 축제가 코앞인데. 그런데……."
51140-240 = "저, 그런 부당한 건 그냥 보고 넘기지 못하니까요!"
51140-241 = "………………그런가요."
51140-242 = "……말씀은 감사하여요. 하지만 소녀는 괜찮사와요."
51140-243 = "네? 괜찮다니, 무슨 뜻인가요……?"
51140-244 = "키쿄 선배의 말 또한 소녀는 틀리지 않다고 생각하여요."
51140-245 = "정말로 소녀는…… 키쿄 선배의 말대로 집에서 도망친 것 또한 사실이니까."
51140-246 = "설령 소녀에게 그럴 맘이 없었다고 한들…… 한가로운 놀이처럼 보였다고 해도…… 어쩔 수 없사와요."
51140-247 = "하지만……!"
51140-248 = "마츠리부의 부장님. 아니……. 시즈코 씨라 하였지요."
51140-249 = "축제의 시작이 얼마 남지 않았지요. 다행히…… 의식의 순번이나 식순을, 소녀는 전부 기억하고 있답니다."
51140-250 = "그러므로 저 카데노코지 유카리───."
51140-255 = "당신의 요청대로 무녀로서 축제에 오르겠사와요."
51140-260 = "네엣?!"
51140-263 = "(유카리를 찾아 계속해서 거리를 내달렸다.)"
51140-267 = "[ns] \"……아.\""
51140-268 = "(코앞으로 다가온 축제 시간 속에서.)"
51140-272 = "이야기 들었어요?"
51140-273 = "이번 축제의 가장 메인이 되는 이벤트는 자정 시간쯤에 시작되는 무녀님의 춤이라는 거 있죠?"
51140-274 = "백귀야행 등불 축제 말이죠? 무녀의 춤. 이번에는 어떤 분이 맡는 걸까요?"
51140-275 = "역시 치세 님이라거나?"
51140-276 = "아, 그거라면 옛날에 20년 전 열린 축제 때와 마찬가지로 <무녀의 춤>을 추기 위한 무녀님이 따로 있다고 알고 있어요."
51140-277 = "분명 그 이름이………"
51140-278 = "<카데노코지 가문>이라고 했던가요."
51140-279 = "[s] (카데노코지…….)"
51140-280 = "그러고 보면 20년 전의 축제는 왜 폐지된 거래요?"
51140-281 = "그러게요. 이번에 새롭게 다시 열린다는 것만 들었지. 그건 들어본 적이 없네요."
51140-282 = "뭐, 어차피 지나간 일이잖아요? 지금부터가 중요한 법이죠."
51140-283 = "아, 그건 그래요."
51140-284 = "모처럼 이번 축제에 맞추어 백귀야행까지 찾아왔으니. 전력으로 즐기는 게 남는 거겠죠~"
