[translation]
10021021-2 = "프레나파테스!! 쓰러졌습니다!"
10021021-6 = "꺄, 꺄악?!"
10021021-7 = "방주는 완전히 파괴되었습니다!! 아야네 씨! 지금 당장 탈출하세요!"
10021021-8 = "이대로 폭발에 휘말리면…… 우주까지 튕겨 나가거나, 아니면 산산조각 난 채 지상으로 추락할 겁니다!!"
10021021-9 = "네! 알겠습니다! 선배들! 선생님! 모두 지상에서 봐요!"
10021021-10 = "……선생님을 부탁드릴게요, 린 씨!"
10021021-11 = "네."
10021021-16 = "남은 탈출 시퀀스 - 14회"
10021021-18 = "그럼 저도 언제든지 탈출할 수 있게 시퀀스 준비를 끝내놓겠습니다."
10021021-22 = "남은 탈출 시퀀스 - 13회"
10021021-24 = "선생님! <탈출 시퀀스>로 그곳의 학생들을 탈출시켜 주세요!"
10021021-25 = "시간이 없습니다, 선생님!! 방주가 완전히 파괴되기 전까지 탈출하셔야 합니다!"
10021021-27 = "네! <탈출 시퀀스>의 기동은 제가 맡겠습니다! 선생님은 지시를 내려주세요!!"
