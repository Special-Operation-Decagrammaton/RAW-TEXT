[translation]
84308100100-6 = "잘 와줬어, 두 사람. 유감스럽게도 지금은 지체할 여유가 없네."
84308100100-11 = "정말 하루도 빠지지 않고 일이 발생하는구만. 이거 일주일 내내 이러는 거 아니야?"
84308100100-12 = "아니라고 말씀드리고 싶지만, 저 또한 왠지 그런 느낌이 드네요."
84308100100-13 = "그래도 막상…… 네루, 당신과 함께 모인 건 오랜만이네요. 지금까지는 저 혼자서 임했던지라……."
84308100100-14 = "헤에, 뭐야. 그 말투? 잠깐 안 본 새 꽤나 자신감이 붙었잖아?"
84308100100-15 = "왜, 조금은 의기양양해졌어? 이번에도 혼자 가고 싶다-라던가, 그런 이야기 하려는 거지?"
84308100100-19 = "……가능하다면요."
84308100100-20 = "이야, 부정도 안 하네. 하하! 그래도 좋잖아! 마음에 들어, 나는 늘 이런 녀석이 마음에 든다니까."
84308100100-21 = "그래서, 어때. 리오? 이 녀석 말대로 해도 괜찮겠어? 나야 크게 상관은 없는데 말이야."
84308100100-23 = "안돼."
84308100100-25 = "단호한데."
84308100100-26 = "단호하네요."
84308100100-28 = "두 사람 모두 전제가 잘못되었어. 내가 그럴 수 있다고 판단한 일이었다면, 처음부터 유리조노 세이아, 너만 불렀겠지."
84308100100-29 = "두 사람을 함께 불렀다는 건 그 자체로 이미 그러는 편이 훨씬 효율적인 일이라는 의미야. 이 부분은 이해해 줬으면 하는데."
84308100100-31 = "……라고 하신다."
84308100100-32 = "라고 하시네요."
84308100100-37 = "……나 뭐 잘못했어?"
84308100100-38 = "아니요. 그냥 장난이에요. 신경 쓰지 말아 주세요."
84308100100-39 = "그래서 어떤 연유로 부르신 거죠? 말씀하신 그 '일'이라는 게 뭔지 알려주실 수 있을까요?"
84308100100-40 = "일 자체는 그리 어렵지 않아. 시연장의 게임개발부 부스로 침입자가 잠입했다는 사실을 확인했거든."
84308100100-41 = "두 사람이 해 줄 일은 지금 바로 그곳을 급습해 범인을 색출하고, 또다시 시연장에 어떤 공작을 벌이고 있던 건지 알아내는 거야."
84308100100-43 = "……설마 그때 그 녀석들의 잔당?"
84308100100-44 = "가능성이 없진 않지. 뭔가 단서가 될 걸 찾아낼지도 모르고."
84308100100-45 = "어떻게 들어갔는지는 모르지만…… 오늘 꽤 오래전부터 잠입해 있었던 것 같아."
84308100100-46 = "시연장은 요 며칠 잠입 시도들이 많았기에 보안이 강화돼서, 전보다는 더욱 들어가기가 어려워졌어. 두 사람의 협력이 필요해."
84308100100-47 = "요 며칠……? 잠입 시도……?"
84308100100-48 = "그…… 있잖아."
84308100100-49 = "혹시 해서 묻는 건데, 우리들 때문이냐? 아니지?"
84308100100-50 = "……우선 이걸 받아."
84308100100-54 = "어이."
84308100100-55 = "두 사람이 서로 연락할 수 있는 무전기야."
84308100100-57 = "대답을 꺼리는 거 보니 맞는 모양이네요."
84308100100-58 = "시간이 없어. 말했듯이 저들은 이미 게임개발부의 시연장 안에 있어."
84308100100-59 = "들키지 않고 최대한 근접해서 상황을 알아내 줘. 그리고 상황에 따라 필요하다면, 제압도 부탁해."
84308100100-60 = "알겠어요. 그렇게 하죠."
84308100100-61 = "가죠, 네루. 우선은 일이 먼저니까요."
