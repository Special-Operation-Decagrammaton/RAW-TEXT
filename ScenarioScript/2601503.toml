[translation]
2601503-1 = "어노니머스 걸"
2601503-4 = "어라."
2601503-5 = "선생님 아니십니까? 이런 늦은 시간에, 어쩐 일이십니까?"
2601503-6 = "……그렇게 말하는 저도 마찬가지네요. 하하."
2601503-7 = "실은, 잠이 안 와서요."
2601503-8 = "……아아, 선생님께서도 똑같군요."
2601503-9 = "네? 모처럼이니 함께 밤 산책이나 하자고요?"
2601503-10 = "오…… 뜻밖의 부수입."
2601503-11 = "어, 아뇨, 그냥 혼잣말입니다."
2601503-12 = "저는 좋슴다. 가시죠, 히히."
2601503-18 = "……."
2601503-19 = "[s] \"고민이라도 있어?\""
2601503-20 = "……네? 갑자기요?"
2601503-21 = "어, 음…… 당황스럽네요. 그야, 저는 그런 이미지가 아니잖슴까?"
2601503-22 = "자주 듣는 질문은 아니라서 조금 놀랐을 뿐임다."
2601503-23 = "뭐, 저도 사람이니까, 이것저것 고민이야 있죠? 그렇지만……."
2601503-24 = "굳이 선생님께 상담 드릴 만한 내용은 없네요."
2601503-25 = "이런 느낌임다."
2601503-26 = "[s] \"그러면 다음 질문! 바다에는 자주 와?\""
2601503-27 = "얼레……? 그런 느낌 질문이었슴까……?"
2601503-28 = "그렇게 자주는…… 아, 자꾸 나쁜 버릇이 나오네요. 그냥 솔직히 말하면 되는데."
2601503-29 = "바다에 와본 건, 처음이네요."
2601503-30 = "이유…… 이유 말입니까? 음, 별로 재밌는 사연이 있는 건 아닌데요."
2601503-31 = "게다가, 으음~ 아니, 이건 너무 진지한 대답 같은데……."
2601503-32 = "뭐랄까, 정의실현부는 모두 이렇다! 하고 딱 잘라 말할 정도는 아니지만, 여기 지원하는 아이들은 대부분 진지한 편이라서요."
2601503-33 = "다들 금욕적이라 할까, 그러려 한다 할까…… 뭐, 실제로 어떤지는 둘째 치고라도요. 하하."
2601503-37 = "선생님도 얼추 느끼고 계시지 않슴까?"
2601503-38 = "[s1] \"확실히…… 그런 느낌이 있네.\"\n[s2] \"그랬던가?\""
2601503-41 = "그렇다니까요. 아무튼, 다들 살짝~ 그런 종류의 즐거운 학창 생활을 포기하고 들어와서요."
2601503-42 = "이 분위기에 저 혼자 놀러 다니는 것도~ 약간 그렇지 않습니까?"
2601503-43 = "그나저나, 어쩌다 이런 걸 궁금해하십니까?"
2601503-44 = "[s3] \"되게 차분하길래…….\"\n[s4] \"보통 바다에 오면 조금 더 흥분하잖아?\""
2601503-47 = "아아~ 확실히, 바다에는 그런 이미지가 있죠."
2601503-48 = "……음, 겉보기로는 모르는 법이죠. 아시듯이 저야 그렇게 감정이 드러나는 타입도 아니고."
2601503-49 = "혹시 압니까, 속으로는 되게 신났을지?"
2601503-53 = "……이런 식으로 슬쩍~ 넘어가려 해도, 선생님 상대로는 먹히질 않네요, 하하."
2601503-54 = "저 그래도 남들이 듣고 싶어 하는 말은, 꽤 잘하는 편이라 생각하는데 말이죠. 이야, 좀 기가 죽네요~"
2601503-55 = "어어…… 이걸 말해도 되나?"
2601503-59 = "아, 미리 말하지만, 딱히 진지한 이유는 아님다. 근데 듣는 사람에 따라서 괜히 심각하게 해석할 거 같아서……."
2601503-60 = "에잇. 그냥 말하죠, 뭐! 선생님이 그런 착각하실 분도 아니시고!"
2601503-61 = "……그냥, 신이 나야 할 이유를 모르겠네요."
2601503-62 = "바다라 해도, 결국은 그저 평소와 조금 다를 장소일 뿐이잖슴까?"
2601503-63 = "저는 자치구 외곽 순찰이나, 외교 업무로 타교에도 종종 방문하는 편이고."
2601503-64 = "솔직히 그런 업무를 할 때와 별 차이를 못 느끼겠습니다."
2601503-65 = "어, 음…… 말하고 보니 좀 미안하긴 하네요. 부원 중에는 저 대신 바다에 오고 싶어 했던 아이들도 있을 텐데."
2601503-66 = "……역시 하지 말 걸 그랬슴다, 하하."
2601503-67 = "[s5] \"솔직히 말해줘서 고마워.\"\n[s6] \"항상 그렇게 속으로 생각하는구나.\""
2601503-70 = "저도 참~ 어쩌다 이렇게 된 건지, 정의실현부에서 나름 기대받는 몸이 되어서요."
2601503-71 = "최소한의 수준은 부응해야 하지 않나 싶으니까요."
2601503-72 = "……이것도 말하고 보니까, 되게 재수 없는 느낌이네요."
2601503-73 = "네? 힘들지 않으냐고요?"
2601503-74 = "뭐, 유별난 것도 아니잖슴까? 저만 이렇게 사는 것도 아니고."
2601503-75 = "누구나 이 정도 처세는 하면서 사는데요, 뭘."
2601503-76 = "오히려 제 입장에서 보면, 선생님이나 선배님들이 고생이 많죠."
2601503-80 = "……응? 어라?"
2601503-81 = "이거, 어느 순간 면담이 되지 않았슴까?"
2601503-82 = "[s7] \"무, 무슨 말인지 모르겠는데.\"\n[s8] \"생각을 읽었다…….?!\""
2601503-85 = "흐음~ 선생님하고 얘기하다 보면 항상 말려드는 느낌이 드네요."
2601503-86 = "아, 딱히 싫다는 뜻은 아닙니다. 오히려 감사한 쪽이긴 한데."
2601503-87 = "……좀 보이고 싶지 않은 부분까지 보이는 느낌이라."
2601503-88 = "그래도, 뭐, 말하고 나니까 속 시원하긴 하네요!"
2601503-89 = "왠지 오늘은 편하게 잘 거 같습니다."
2601503-90 = "감사합니다!"
2601503-92 = "(이후 이치카와 조금 더 해변을 걸었다. 새벽이 다 되어서야 각자 숙소로 돌아갔다.)"
