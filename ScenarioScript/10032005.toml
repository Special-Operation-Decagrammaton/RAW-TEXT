[translation]
10032005-1 = "프롤로그"
10032005-5 = "[i]Blue Archive presents[/i]"
10032005-10 = "[i]Problem Solver 68 Event[/i]"
10032005-17 = "Aru Rikuhachima"
10032005-18 = "Kayoko Onikata"
10032005-23 = "Mutsuki Asagi"
10032005-24 = "Haruka Igusa"
10032005-33 = "and……"
10032005-41 = "……돼……. 됐나요……? 이걸로……?"
10032005-42 = "말씀하신 대로……. 기절시켜서 묶어 두긴 했습니다만……."
10032005-45 = "이야~ 하루카 쨩, 가차 없네~!"
10032005-46 = "헤, 헤헤……. 감사합니다……. 도움이 되었다니, 믿기지가 않아요……."
10032005-47 = "그, 그런데 이렇게 보따리에 싼 분들은 이제 어떻게……."
10032005-55 = "이대로 여기 두면 되……나요? 역시 들키겠죠? 어딘가 다른 데에 숨겨 놓을까요?"
10032005-56 = "아, 아니! 역시 소리가 새 나가면 곤란하겠죠! 근처 공사장에 가서 묻어버릴까요?"
10032005-57 = "아, 아냐. 그것도 역시 들킬 염려가……. 당장 차에다 싣고 부둣가로 가서……!!"
10032005-63 = "후후후……. 진정해, 하루카. 우리의 목적은 그게 아니니까."
10032005-64 = "이 녀석들을 처리하는 건 애초에 우리의 진짜 목표를 잡기 위한 사전준비일 뿐."
10032005-65 = "미리 숨어 있던 타깃의 경호원부터 조용히 처리한다~라고 했던가?"
10032005-66 = "방해물들을 미리 치워 두고, 곧 있으면 도착할 우리의 타깃……."
10032005-67 = "……진짜 '거물'을 기다려야지."
10032005-68 = "……그래. 우리 흥신소 68의 이름값에 어울리는, 이번 의뢰의 목표를 말이야."
10032005-69 = "쿠후후. 아루 쨩, 모처럼 큰 일 받아서 신났네! 목소리에서 활기도 느껴지고!"
10032005-70 = "아, 아니야! 그리고 일할 때에는 사장이라고 불러야지, 무츠키 실장!"
10032005-71 = "그리고 '모처럼'이 아니야. 드디어 우리 흥신소 68의 진가를 알아본 사람들의……. '제대로 된 의뢰'라고."
10032005-72 = "부, 분명……. 갱단 연합의 우두머리인 <돈 아란치노>……였지요? 이번 타깃……."
10032005-73 = "엄청 나쁜 사람이라고 들었는데……."
10032005-74 = "확실히 늘 하던 고양이 찾기나 친구 미행이랑은 다른 분위기고 말이지~?"
10032005-75 = "그, 그 이야기들은 됐어! 그런 건 이제 끝!"
10032005-76 = "이번 일을 제대로 성공시켜서, 우리 흥신소의 하드보일드함을 모두에게 보여줄 테니까……!!"
10032005-81 = "……사장."
10032005-82 = "음? 카요코? 무슨 일이야?"
10032005-83 = "잠입 중에 통신이 잦으면 들킬 수도 있다고 했잖아? 꼭 필요한 일이 아니면……."
10032005-84 = "아아. 그게 말이지……. 아무래도 꼭 필요한 일 같아서 말이야."
10032005-85 = "지금 이 오페라 하우스에……."
10032005-86 = "……선생이 와 있거든."
10032005-93 = "이거 괜찮은 거야? 예정에 없던 일이잖아."
10032005-94 = "우선 자리를 피하는 게 좋지 않겠어? 상황은 뒤에 다시 보기로 하고……."
10032005-95 = "…………."
10032005-96 = "…………사장?"
10032005-97 = "…………어……."
10032005-100 = "……누가……왔다고?"
