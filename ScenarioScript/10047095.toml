[translation]
10047095-4 = "[ns] \"허억, 허억, 허억……!\""
10047095-7 = "앗, 마스터……! 이쪽이에요!"
10047095-8 = "혹시 몰라 까마귀를 보냈는데…… 안 잡혀서 다행이네."
10047095-9 = "후후, 역시 쉽지 않네요."
10047095-11 = "됐어! 한군데로 몰아넣었어!"
10047095-12 = "더 이상 도망칠 곳은 없어! 모두 얌전히 투항해!!"
10047095-14 = "으으, 이제 사감대 기숙사만 남았는데 이렇게 잡힐 줄은……."
10047095-15 = "생각보다…… 감시가 삼엄했네……."
10047095-16 = "……후후, 실망하지 마세요. 이것도 좋은 경험이 될 테니까."
10047095-17 = "본래 예술의 길이란 험난한 법."
10047095-18 = "쉽게 답을 찾을 수는 없지만, 언젠간 반드시 찾을 수 있을 거라 믿어요.#n그것이 바로 예술을 향한—"
10047095-23 = "—'도전'."
10047095-24 = "……이니까요!"
10047095-26 = "역시 다들 입만 살았구나! 모두 현행범으로 체포해……!!"
10047095-37 = "뭐, 뭐지? 어디서 종이 울리는 거야?"
10047095-38 = "이 방향은 설마……?"
10047095-39 = "……<이름 없는 종탑> 방향이에요."
10047095-40 = "울리고 있어…… 멸망의 날에 혼자 울린다는……."
10047095-41 = "전설의 종이!!"
