[translation]
10024070-1 = "7화;주마가편: 달리는 말에 채찍질을 하다."
10024070-2 = "산해경 외곽"
10024070-9 = "……"
10024070-10 = "……"
10024070-11 = "황학이 한 번 길을 떠나니."
10024070-12 = "결코 되돌아오지 않더라."
10024070-13 = "미행 같은 것은 없었나?"
10024070-14 = "산해경 내부에서는 문제없었어. 그쪽은?"
10024070-15 = "마찬가지야. 외부에서 수상한 움직임은 보이지 않았어."
10024070-16 = "왜 보자고 한 거지?"
10024070-17 = "이번 물건에 다들 불만이 많았으니까."
10024070-18 = "무슨 말을 하는 건지 모르겠군."
10024070-19 = "시치미를 뗄 생각인가? 잘 생각해. 거래의 기본은 신용이야."
10024070-20 = "이렇게 신용을 해쳐서는 <오욕의 미후>도 가만히 있지 않을 텐데."
10024070-22 = "설마, 우리와 <오욕의 미후>에게 다른 마음을 품은 건가?"
10024070-23 = "이상한 소리 하지 마. 내가 엉뚱한 생각을 할 리 없잖아."
10024070-25 = "지금껏 나는 신용을 지켜 왔어. 그건 그쪽도 잘 알고 있을 텐데."
10024070-26 = "그러니까 더 이상하다는 거야. 이번에 전해준 만년삼은……"
10024070-28 = "만년삼이 아니라 당근이었잖아!"
10024070-29 = "무슨 소리야! 이번에는 만년삼이나 당근은커녕 아무것도 전달한 적이 없어!"
10024070-31 = "뭐라고? 그렇다면 우리가 받은 건 대체 뭔데!"
10024070-32 = "착오가 있었겠지! 가만, 그렇다는 건……?"
10024070-37 = "들어라."
10024070-38 = "누구냐!"
10024070-39 = "하늘이 지켜보고, 땅이 지켜본다. 너희들 자신이 있고, 무엇보다 이 내가 안다."
10024070-40 = "설마……?"
10024070-41 = "영웅을 꿈꿀 필요까지는 없다. 다만 비천하게 살고 싶지 않았을 뿐."
10024070-42 = "빌어먹을, 도망쳐야 해……!"
10024070-43 = "너희는 무엇을 위해 노래하는가? 무엇을 위해 살아가는가?"
10024070-44 = "무슨 일이야? 왜 그래?"
10024070-45 = "그저 살아 있는 것만으로는 충분하지 않으니, 우리는 모두 되고자 하는 무엇인가다!"
10024070-47 = "현룡문 집행부장, 선봉, 코노에 미나다! 다들 꼼짝 마!"
10024070-48 = "현룡문이라고?!"
10024070-49 = "도망치려고 해도 소용없어. 주위에는 대충 손을 써 놨으니까."
10024070-50 = "물론 할 수 있다면 이 자리를 피하려 해 보아도 좋습니다."
10024070-51 = "다만, 그때에는 저와 자웅을 겨루어야 할 것입니다."
10024070-52 = "현무상회와 현룡문이 같이……? 그런 일이 일어날 리 없는데……?!"
10024070-53 = "유감스럽게도, 그런 일이 일어나 버렸지."
10024070-54 = "자, 정체를 밝혀라!"
10024070-61 = "큭……!"
10024070-63 = "잠깐만, 너는……?!"
10024070-65 = "저 제복과 문양은……!"
10024070-66 = "뭐, 그런 건가. 이런 일도 일어나는 법이지."
10024070-67 = "코코나 쨩에게는 나중에 사과해 둬야겠네. 만년삼을 가장한 당근을 배달하게 했으니까."
10024070-68 = "그렇습니다. 결과적으로 저희 역시 코코나 교관을 이용한 셈이 되었으니까요."
10024070-69 = "[s] \"슌에게도 사과해야겠지……\""
10024070-75 = "기억에 있는 얼굴이군."
10024070-76 = "어째서 이런 일을 벌인 거지……?"
10024070-77 = "……"
10024070-78 = "대답해! 어째서 이런 거냐고!"
10024070-79 = "당신 때문이야. 코노에 미나."
10024070-80 = "나……?"
10024070-81 = "그래. 당신. 나는…… 당신의 위치가 필요했어. 그러려면 돈이 좀 있어야 했고."
10024070-82 = "마침 만년삼의 약효를 원하는 사람이 있었어. 산해경 바깥에."
10024070-83 = "값을 잘 쳐 주겠다고 하더군. 실제로 그랬고."
10024070-84 = "나쁜 거래는 아니었지. 현무상회의 상자를 구하는 일은 어렵지도 않았고."
10024070-85 = "……왜 내 위치를 노린 거지?"
10024070-86 = "현룡문 선봉, 집행부장 겸 문주님의 직속 경호원……"
10024070-87 = "스스로는 아니라고 생각하겠지만 당신은 이미 현룡문의 2인자나 다름없지."
10024070-89 = "하지만 문주님을 더 아끼는 건 내 쪽이야!"
10024070-90 = "다시 말해, 문주님에 대한 애호력은 내가 더 앞선다고!"
10024070-91 = "뭐……?"
10024070-96 = "저건 바보군요."
10024070-97 = "응. 확실히 바보네."
10024070-99 = "그, 그런 이유로 아이들의 호의를 이용한 것도 모자라, 산해경의 전통을 뒤흔들려 한 건가……?"
10024070-100 = "그런 이유라니! 세상에서 제일 중요한 이유라고! 적어도 나에게는!"
10024070-102 = "문주님의 마음도 모르고…… 설령 문주님이 용서한다 해도, 내가 용서하지 않겠다!"
10024070-103 = "어처구니가 없는 것이다. 고작 그런 이유로 이만한 소동을 벌인 것이냐?"
10024070-104 = "또 누구야?!"
10024070-105 = "산해경의 금수품이니, 비약이니 하는 것은 아무래도 좋은 것이다."
10024070-106 = "나님이 관심 있는 것은, 너희들의 뒤에서 모든 일을 꾸민 그 누군가인 것이니까!"
10024070-110 = "연단방 부장 아쿠시 사야, 연단방의 이름으로 참전하겠다!"
10024070-111 = "연단방까지?! 어떻게 된 거냐, 현무상회!"
10024070-113 = "아니, 우리도 이번 건 정말로 모르는데?!"
10024070-115 = "연단방의 점조직을 우습게 보지 말아 주었으면 하는 것이다!"
10024070-116 = "약재에 대한 것만은 현무상회의 정보망에도 뒤지지 않을 정도라고 자부할 수 있는 것이다!"
10024070-118 = "그랬습니까?!"
10024070-119 = "아무튼 고마워, 연단방! 이 빚은 나중에 청산하지!"
10024070-121 = "빚이라느니 청산이라느니 그런 한가한 이야기를 할 때가 아닌 것이다!"
10024070-122 = "이 녀석들이 거래한 상대가, 내가 짐작한 그 사람이라면……"
10024070-123 = "산해경의 위기인 것이다!"
10024070-128 = "……"
10024070-129 = "……어떻게 할 생각이지?"
10024070-130 = "여기서 전부 쓰러트려 두면, 아직은 수습 가능한 범위야…… 아직은!"
10024070-132 = "칫……! 어쩔 수 없지!"
10024070-134 = "그럼 우리도 다 같이 시작해 볼까. 레이죠."
10024070-136 = "예. 회장님. 그 말씀만 기다리고 있었습니다."
10024070-137 = "현룡문의 이름을 걸고!"
10024070-138 = "너희들에게는 확인해야 할 것이 있는 것이다!"
10024070-139 = "지휘를 부탁해. 선생님. 같이 힘내자고."
