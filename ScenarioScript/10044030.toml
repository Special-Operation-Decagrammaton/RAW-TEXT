[translation]
10044030-1 = "제3화;또 사라진 열차를 찾아서"
10044030-2 = "또 다른 화물역"
10044030-5 = "그게 무슨 소리야?! 또 자동으로 발차가 됐다고?"
10044030-6 = "그, 그게 저희도 잘 모르겠어요…… 애초에 운행 시간표에 없던 열차이기도 하고……"
10044030-8 = "완전 헛수고였어-"
10044030-9 = "여, 역시…… 기대하면 실망하게 되는……"
10044030-11 = "[ns] \"혹시 어느 역으로 갔는지 알 수 있을까?\""
10044030-13 = "기, 기록을 찾아볼게요……! 하지만 열차가 멈춰 있을 거라는 보장은 없어서……"
10044030-15 = "으아, 곤란한데. 점점 시간이 줄어들고 있어."
10044030-16 = "아직 괜찮아- 찾으면 목적지까지 전속력으로-"
10044030-17 = "뭐, 안 되면 되게 해야지. 그렇지?"
10044030-24 = "여, 열차는 상행선을 따라 움직였다고 나오네요……!"
10044030-25 = "앗…… 그쪽으로는 지하철 노선도 딱히 없는데……"
10044030-26 = "아마 다음 역까지는 버스를 타고 가시는 편이 빠를 거예요."
10044030-27 = "으윽…… 하, 하필 버스라니……"
10044030-29 = "뭐라도 있으면 타야지! 높으신 분이 알아차리기 전에 후다닥 찾아야 한다고."
10044030-30 = "빠른 이동- 슈바바바바-"
10044030-39 = "……"
10044030-40 = "……"
10044030-42 = "늦잖아, 버스!!"
10044030-43 = "기어가도- 도착했을 듯-?"
10044030-44 = "왜 이럴 때는 항상 예정 시간보다 늦게 오는 거야?"
10044030-46 = "……"
10044030-47 = "[s1] \"아오바, 표정이 안 좋은데.\"\n[s2] \"괜찮아?\""
10044030-50 = "아, 네에……"
10044030-51 = "……"
10044030-52 = "저, 사실…… 머, 멀미를 좀 심하게 해서요……"
10044030-56 = "멀미-?"
10044030-57 = "네, 네에…… 특히 자동차를 타면 더 어지럽고 그래서……"
10044030-58 = "우욱…… 사, 상상만 해도……"
10044030-63 = "아아~ 이런 것 때문에 열차가 좋은 건데. 멀미가 잘 안 나니까."
10044030-64 = "헤엑…… 헥……"
10044030-65 = "마, 맞아요…… 그래서 하이랜더에 지원한 것도 있어요……"
10044030-67 = "[ns3] \"잠깐 타는 것도 힘들겠지?\"\n[ns4] \"기다리고 있으면 멀미약을 사 올게.\""
10044030-74 = "왔다, 버스! 엄청 늦었지만!!"
10044030-75 = "서, 선생님! 괜찮아요. 지금 버스 도착했고……! 한시가 급하잖아요……"
10044030-76 = "차, 참을 수 있어요…… 가요!"
10044030-77 = "[s] \"정말 힘들면 말해야 해, 아오바.\""
10044030-78 = "네, 네에……"
10044030-85 = "왜 이렇게 늦은 거야? 예정 시간보다 5분이나 더 기다렸다구!"
10044030-86 = "와하하! 미안하구만. 도로 위를 달리다 보니, 교통 상황에 영향을 많이 받거든."
10044030-87 = "아까도 폭주족들이 도로를 불법으로 점거하고 달려대는 통에 좀 늦었지 뭐냐!"
10044030-89 = "역시- 철도가 좋아-"
10044030-90 = "맞아. 선로 위는 장애물도 없고."
10044030-91 = "열차는 열차 나름, 버스는 버스 나름의 장점이 있는 게지."
10044030-92 = "그나저나 하이랜더 학생들이 버스를 타는 건 흔치 않은 일인데?"
10044030-93 = "[s5] \"급하게 이동해야 할 일이 있어서요.\"\n[s6] \"잘 부탁드립니다, 기사님.\""
10044030-96 = "보호자쇼? 뭐, 어디가 됐든 모셔다드리지!! 하핫!"
10044030-106 = "토할 것 같으면- 등 두들겨 줄게-"
10044030-107 = "아, 안 할 거거든요……"
10044030-109 = "히카리 108식 싸우전드 해머-"
10044030-116 = "앗, 아아…… 하, 하지 마세요오……! 전혀 아프지는 않지만 속이 안 좋아질 것……"
10044030-117 = "우욱-"
10044030-119 = "파햐햐! 비닐 봉투 필요해? 언제든지 말해!"
10044030-120 = "[ns] \"아오바, 시선을 멀리 두고 심호흡을 하면 조금 나아질 거야.\""
10044030-121 = "후욱…… 후욱…… 세상은 정말…… 고통으로 가득해요……"
10044030-122 = "하이랜더 학생들, 뭔가 문제라도 있나?"
10044030-123 = "토할 것 같대!!"
10044030-124 = "아니거든요!! 아니, 맞지만!"
10044030-125 = "부끄러우니까 큰 소리로 말하지 마세요!!"
10044030-126 = "우욱……! 화냈더니 더 괴로워……"
10044030-128 = "하핫, 좀만 참아달라고."
10044030-129 = "최대한 부드럽게 운전해 볼 테니까 말이야!!"
10044030-130 = "이왕 이렇게 된 거- 최대한 빠르게 가면-? 광속으로~"
10044030-131 = "그건 못 하지. 배차 간격이란 게 있으니까."
10044030-132 = "그건 열차도 마찬가지-"
10044030-133 = "하지만 버스는 금방금방 멈추잖아? 정류장 너무 많은 거 아냐?"
10044030-134 = "뭐, 그만큼 타고 내리는 곳이 많으니까 편한 점도 있다고."
10044030-135 = "너희도 어쨌든 지금 버스를 이용하고 있잖냐! 하하."
10044030-136 = "파햐햐, 할 말 없구만!"
10044030-142 = "이런, 또 폭주족들이 난리구만."
10044030-143 = "위험해, 이 녀석들아! 도로 위에서 그러다가 다친다고!!"
10044030-144 = "시끄러! 느려터진 덩치 녀석은 빠지시지!"
10044030-145 = "저, 저…… 에잉! 쯧쯧!"
10044030-146 = "총장의 부름이다~! 달려라!"
10044030-147 = "[ns] \"도로가 또 막히는구나……\""
10044030-148 = "거 참!! 방해된다고~! 도로에서 비켜!! 우리 빨리 가야 돼!!"
10044030-149 = "노답- 망했어-"
10044030-150 = "하아, 진짜. 뭔가 일이 계속 풀리질 않네."
10044030-152 = "……"
10044030-153 = "등- 두들길 사람 필요하면 말해-?"
10044030-154 = "제발 하지 말아요…… 후욱…… 후욱……"
10044030-157 = "교통에 체증이라는 개념이 있다는 게 참 이해가 안 된단 말이지."
10044030-158 = "어때? 하이랜더 학생으로서 느끼는 바가 있어?"
10044030-159 = "말 걸지 말아주세요…… 후욱…… 후욱……"
10044030-160 = "[s] \"목적지까지 괜찮겠어, 아오바?\""
10044030-161 = "이 간부님들만 떨어뜨려 주시면 어떻게든 버텨볼 수 있을 것 같아요……"
10044030-162 = "기, 기사님도 최대한 조심스럽게 운전해 주고 계신 것 같고요……"
10044030-164 = "그 물건, 우리에게 맡기기로 했었잖아! 왜 이렇게 되는 건데!"
10044030-166 = "크큭, 이유는 당신들이 가장 잘 알고 있지 않으신지?"
10044030-167 = "거친 운전으로 중요한 물건을 파손한다거나…… 사고로 인해 발키리에게 쫓긴다거나……"
10044030-168 = "크윽……"
10044030-169 = "하, 하지만 우리가 더 빠르다고!"
10044030-170 = "거리의 무법자인 우리를 알잖아?"
10044030-171 = "맞는 말씀입니다."
10044030-172 = "허나, 이번 일은 특히나 보안과 안정성이 중요하지요."
10044030-173 = "따라서 안전이 보장되는 철도 운송을 택한 것이고요. 크큭……"
10044030-174 = "젠장…… 철도 따위에게 밀렸다고? 우리가?"
10044030-175 = "어쨌든, 이미 끝난 이야깁니다. 더 이상의 논의는 필요하지 않아요."
10044030-176 = "자, 잠깐만! 잠……"
10044030-180 = "젠장! 이럴 수는 없어!"
10044030-181 = "우리가 이 일을 위해 얼마나 노력했는데……!"
10044030-187 = "대, 대장…… 괜찮아……?"
10044030-188 = "대장이 아니라 총장!!"
10044030-189 = "히익! 미, 미안…… 초, 총장!"
10044030-190 = "……무슨 일이야?"
10044030-191 = "지, 지시대로 애들 전부 모으고 있어. 어떻게 할까?"
10044030-192 = "……"
10044030-193 = "이렇게 된 이상, 방법은 하나뿐이야."
10044030-194 = "어떤……?"
10044030-199 = "빼앗긴 기회를 우리 손으로 되찾아 오는 거지."
10044030-201 = "오오……!! 뭔진 모르겠지만 멋진데!"
10044030-202 = "우리 일감을 훔쳐 간 녀석들, 반드시 대가를 치르게 해주마……!"
10044030-206 = "어이, 하이랜더 학생들! 여기에서 내린다고 했지?"
10044030-207 = "맞아, 도착했다~! 파햐햐!"
10044030-208 = "빨리 찾으러 가자- 우리 열차-"
10044030-210 = "[ns] \"아오바는 좀 어때?\""
10044030-212 = "드, 드디어 내릴 수 있네요…… 후우, 후우……"
10044030-213 = "학생도 잘 참았어. 덕분에 불상사가 없었구만!"
10044030-214 = "가, 감사합니다…… 기사님…… 신경 써 주셔서……"
10044030-215 = "와하하! 일단 내 버스에 탄 승객들은 모두 안전하게 모셔준다고!"
10044030-216 = "어때? 열차 못지않은 서비스지?"
10044030-217 = "그, 그러네요…… 확실히……"
10044030-218 = "그치만 열차를 탔으면 멀미도 없었겠지?"
10044030-219 = "화장실도 있었을 거야-"
10044030-220 = "지, 진짜 사회성 떨어지는 간부님들이에요…… 지금 그런 얘기를 왜……"
10044030-224 = "물론 열차가 더 좋지만, 버스도 나름 괜찮을지도? 파햐햐햐!"
10044030-225 = "가끔 타러 올 게- 기사 아저씨 안녕-"
10044030-226 = "하핫, 또 이용해 주십쇼~!"
10044030-228 = "[ns] \"감사했습니다, 기사님!\""
10044030-232 = "이제 등- 안 두들겨도 돼-?"
10044030-233 = "그거 그냥 괴롭히고 싶어서 그러는 거죠……?"
10044030-235 = "자, 그럼 우리 열차를 찾으러 가보자고!!"
