[translation]
901010800320-7 = ""
901010800320-8 = "คุณครู? ดึกขนาดนี้แล้ว มีธุระอะไร...?"
901010800320-9 = "[s1] \"ครูเดินผ่านและเห็นว่าไฟที่กองบัญชาการยังเปิดอยู่น่ะ\"\n[s2] \"ทุกคนยังไม่นอนกันอีกเหรอ?\""
901010800320-12 = "ค่ะ พอดีวันนี้เป็นวันที่มีปฏิบัติการกลางคืน"
901010800320-13 = "พวกฉันว่าจะสรุปข้อมูลที่สืบมาได้ แล้วค่อยไปนอนน่ะค่ะ..."
901010800320-14 = "ขอโทษด้วยนะคะ ทำให้คุณครูเป็นห่วงเลย"
901010800320-15 = "[s3] \"ไม่เป็นไร ครูเองก็ทำงานล่วงเวลาอยู่เหมือนกัน\"\n[s4] \"สัปดาห์นี้ครูมีงานให้คำปรึกษา เลยมีงานค้างนิดหน่อย...\""
901010800320-18 = "คุณครู สุขภาพยังไหวอยู่ใช่มั้ย?"
901010800320-19 = "พวกฉันยังผลัดกันนอนได้ แต่คุณครูมีอยู่แค่คนเดียวนะ"
901010800320-20 = "[s] \"ต้องไหวสิ ครูกินอาหารเสริมครบอยู่แล้ว!\""
901010800320-21 = "ยิ่งน่าเป็นห่วงกว่าเดิมอีกนะ..."
901010800320-22 = ""
901010800320-24 = ""
901010800320-27 = ""
901010800320-28 = "เอาเถอะ นี่ก็ดึกแล้ว มาเริ่มรายงานกันเลยดีกว่า"
