901010800320-7 = ""
901010800320-8 = "老師？這個時間有什麼事嗎……？"
901010800320-9 = "[s1] 「路過時看到HQ的燈還亮著，所以就過來看看。」\n[s2] 「大家都還沒睡嗎？」"
901010800320-12 = "是的，因為今天是有夜間作戰的日子。"
901010800320-13 = "原本打算在睡前把蒐集到的情報整理一下……"
901010800320-14 = "抱歉讓您費心了。"
901010800320-15 = "[s3] 「沒關係，我也剛好在加班。」\n[s4] 「這週因為諮商的關係，工作進度有點落後……」"
901010800320-18 = "老師，你的身體狀況沒問題嗎？"
901010800320-19 = "我們多少還能輪流休息，但是老師就只有一個人啊。"
901010800320-20 = "[s] 「沒問題，我都有好好補充營養品！」"
901010800320-21 = "這樣反而更令人擔心了……"
901010800320-22 = ""
901010800320-24 = ""
901010800320-27 = ""
901010800320-28 = "那麼時間也已經很晚了，我們趕快開始報告吧。"
