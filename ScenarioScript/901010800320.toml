901010800320-18 = "Sensei, are you taking care of yourself?"
901010800320-19 = "We, at least, can sleep in shifts. But you're only one person."
901010800320-20 = "[s] \"It's fine. I'm taking all my supplements!\""
901010800320-21 = "That's not a good answer..."
901010800320-22 = ""
