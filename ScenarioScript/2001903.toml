[translation]
2001903-1 = "Case 2. 편히 쉬세요."
2001903-3 = "(문서 군단과 싸우다 왔다.)"
2001903-4 = "(결과는 작전상 후퇴. 내일을 기약하자.)"
2001903-9 = "샬레 휴게실"
2001903-11 = "기다리고 있었어요, 주인님! 뿅뿅!"
2001903-15 = "(또다시 헛것이 보인다.)"
2001903-16 = "(……그런 게 아니라는 것쯤 이제 알고 있다……)"
2001903-17 = "[s1] \"……안녕, 아카네. 그런데 여기에는……?\"\n[s2] \"어떻게 들어온 거야……?\""
2001903-18 = "잠금장치를 해제하고 들어왔답니다?"
2001903-19 = "잠금장치를 해제하고 들어왔답니다?"
2001903-20 = "어떻게냐고요?"
2001903-21 = "그야……"
2001903-27 = "조금, 도움을 받았죠."
2001903-28 = "비상사태라는 이유로요. 후훗……"
2001903-29 = "물론 폭탄으로 잠금장치를 날려 버릴 수도 있었지만……"
2001903-30 = "역시 그러면 곤란할 것 같았어요."
2001903-31 = "예전에 그러지 말아달라는 부탁을 저에게 하기도 하셨고."
2001903-32 = "이렇게까지 할 필요는 없었던 것 아니냐구요?"
2001903-33 = "그럴 리가요!"
2001903-34 = "주인님의 상태는 저에게 있어서 언제나 최우선 고려 대상인걸요."
2001903-35 = "이렇게 얼굴에 피로가 가득하시고, 한눈에 보기에도 지쳐 보이시고……"
2001903-36 = "전 너무 가슴이 아파서, 그리고 안타까워서……"
2001903-37 = "[s] 마음만이라도 고마워."
2001903-38 = "그래도, 제가 해드릴 수 있는 게 없을까요?"
2001903-39 = "복장은 바뀌었지만, 저는 언제나 주인님의 메이드랍니다?"
2001903-40 = "[s] 그러면, 같이 청소할까?"
2001903-44 = "청소…… 정말로 그것뿐이신가요?"
2001903-45 = "정말 주인님께선 욕심이 없으시군요."
2001903-46 = "후훗…… 역시 자상하세요."
2001903-47 = "알겠습니다. 제 모든 것을 다해 성심성의껏 봉사하겠습니다."
2001903-49 = "(그 뒤로 함께 청소에 몰두했다.)"
2001903-53 = "(도와줄 틈도 없이 거의 아카네가 끝내버렸다……)"
2001903-56 = "후훗…… 주인님과 처음 만났던 날이 생각나네요."
2001903-57 = "주인님은 그때도 청소를 부탁하셨죠."
2001903-58 = "어때요? 먼지 하나 없는 방이 됐네요."
2001903-59 = "[s3] \"그때 아카네는, 참 귀여웠지.\"\n[s4] \"그때도 지금도, 아카네는 귀여워.\""
2001903-64 = "주, 주인님? 갑자기 그런 말씀을 하시면…… 저는……"
2001903-65 = "자, 잠시만요. 특별한 찻잎을 가져왔어요. 금방 차를 내올게요!"
2001903-74 = "오늘 준비한 차입니다. 드셔 보세요."
2001903-80 = "후훗, 저도 좋아하는 향이에요. 기뻐해 주셔서 다행입니다."
2001903-81 = "실은 계속 찾고 있었는데…… 어렵게 구했답니다?"
2001903-82 = "이 한 잔을 주인님과 마실 수 있어서……"
2001903-83 = "아카네는 너무 행복합니다."
2001903-84 = "[s] \"그러고 보니 아카네는 그 옷이 마음에 드나 봐?\""
2001903-85 = "바니걸 말인가요?"
2001903-86 = "후후…… 신선한 기분이에요. 옷이 달라서 그런지, 평소보다 고양되네요."
2001903-87 = "움직이기 편하기도 하고요."
2001903-88 = "하지만 새삼스럽게 메이드로서, 메이드복도 중요하다고 느끼고 있습니다."
2001903-89 = "주인님은 어떠세요?"
2001903-90 = "[s] \"응? 나?\""
2001903-91 = "맞아요! 주인님의 의견이 듣고 싶어요."
2001903-92 = "사실 처음부터…"
2001903-93 = "학교로 절 찾아와 주셨을 때부터 계속요!"
2001903-99 = "어떠세요, 주인님?"
2001903-100 = "메이드로서의 저와 바니걸로서의 저, 어느 쪽이 마음에 드시나요?"
2001903-104 = "어느 쪽도 좋다구요?"
2001903-105 = "그, 그건 기쁩니다만……"
2001903-106 = "하지만 주인님…… 아카네는 확실히 하고 싶어요."
2001903-107 = "어떤 복장인 제가, 주인님을 봉사하는 데 적합한가요?"
2001903-108 = "저는 그 대답을 주인님의 목소리로 듣고 싶어요! 뿅뿅!"
2001903-109 = "[s] \"뿅뿅…?\""
2001903-110 = "네. 지금의 저는 토끼니까요."
2001903-111 = "자, 메이드가 좋으세요, 토끼가 좋으세요?"
2001903-115 = "(아카네의 모습이 코 앞까지 보인다.)"
2001903-121 = "(그런데, 이상하게도 눈이 감기려 했다……)"
2001903-130 = "어머나, 주인님?"
2001903-134 = "후훗…… 정말로 피곤하셨나 보네요."
2001903-138 = "오늘은 편히 쉬세요, 주인님."
2001903-139 = "아카네는 이만 물러나겠습니다."
