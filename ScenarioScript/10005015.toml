[translation]
10005015-4 = "하아, 하아, 하아……."
10005015-5 = "어, 어때. 들켰나? 아직도 추격해 오는 녀석들이 있나?"
10005015-9 = "휴우. 아뇨. 아무래도 잘 따돌린 것 같아요."
10005015-10 = "저희 얼굴을 제대로 본 사람도 별로 없고……."
10005015-11 = "선생님, 괜찮으신가요? 혹시 다치신 곳이라도……."
10005015-12 = "[s1] \"괜찮아. 아무 데도 다치지 않았어.\"\n[s2] \"요새 무릎 관절이 좀 걱정이긴 한데……\""
10005015-13 = "다행이네요. 솔직히 좀 겁이 났답니다."
10005015-14 = "아하하……. 확실히 그것도 큰일이긴 하군요……."
10005015-15 = "그러고 보니……."
10005015-16 = "부장님? 그분은……."
10005015-18 = "……앙? 아, 이거?"
10005015-23 = "……으, 으응? 뭐야……?"
10005015-24 = "……엉? 뭐, 뭐야? 여긴……. 객실? 내가 왜 객실에……?"
10005015-29 = "……!! 너, 너희들은……!"
10005015-38 = "쿨럭! 으윽……!?"
10005015-44 = "왜……. 왜 가드를 데려온 거지……?"
10005015-45 = "왜긴. 우리 얼굴 기억하고 있잖아. 내버려 뒀으면 다른 녀석들이 다 우리를 수배했을걸."
10005015-46 = "일단 이번 일 끝나기 전까지 이 녀석은 여기서 계속 자고 있어 줘야겠어."
10005015-48 = "과연, 일리 있는 말씀이군요. 저분께는 죄송하지만, 작전의 보안상 어쩔 수 없겠어요."
10005015-49 = "일단 기절해서 누워있는 상태이시니, 우선 이렇게 팔다리를 뒤로 좀 묶어서……."
10005015-53 = "객실 내라는 건 들켰지만 정확한 위치를 모르게 하는 것도 중요하다. 안대도 채우도록 하지."
10005015-54 = "소리 지르지 못하게 입에도 뭐 좀 붙여."
10005015-58 = "[ns] \"…….\""
10005015-60 = "[ns3] \"이거, 비주얼이 좀…….\"\n[ns4] \"너희들 임무 도중에는 정말 가차 없구나.\""
10005015-61 = "응? 그게 무슨 말이지?"
10005015-62 = "응? 그게 무슨 말이지?"
10005015-63 = "임무를 위해서 당연한 조치다. 이 정도면 딱히 상해를 가한 것도 아니니 신사적인 거다만."
10005015-64 = "그럼요. 선생님께서 안 계셨으면 부장님이 벌써 창문 밖으로 던져버렸을 테니까요."
10005015-65 = "어이! 아카네!"
10005015-66 = "뭐, 아무튼 여기까진 진행했다. 사소한 트러블이 있긴 했지만, 작전 상황에서 이 정도는 보통이야."
10005015-67 = "다음으로 해야 할 게 뭐라고 했었지? 아카네."
10005015-69 = "음. 그렇군요. 잠입도 했고, 거점도 만들었으니……."
10005015-70 = "다음은 시스템실 장악이에요. 하지만 그 전에, 먼저 해야 할 일이 있는 거 같지만요."
10005015-71 = "해야 할 일?"
10005015-72 = "네. 아까 전 가드들의 반응을 보셨잖아요? 아무래도 이 배엔, 이 배만의 특별한 규정이 있는 거 같아요."
10005015-73 = "특히 복장에서 말이죠. 보아하니 아무래도 이 복장이, 이 배 '가드'들의 복장인 것 같네요."
10005015-74 = "음. 과연. 그러고 보니 아까 그런 말을 했지. '승객 교복도 아니고 가드 복장도 아니고'라고."
10005015-75 = "메이드복이라면 웬만해선 거의 의심받지 않고 잠입할 수 있는 복장이라고 생각했는데……."
10005015-76 = "여긴 밀레니엄이 아니니까요."
10005015-77 = "어쩔 수 없군요. 여기서 활동하기 위해선, 우선 여기에 맞는 옷부터 입어야 할 필요가 있겠어요."
10005015-79 = "여기에 맞는 옷……?"
10005015-80 = "네. 그래서 제가 오면서 몇 벌 챙겨왔죠. 후훗."
10005015-85 = "사이즈는 대략 맞을 거예요. 평소에 봐 둔 게 있어서."
10005015-86 = "크하하. 역시 아카네야. 손이 꽤 빠르잖아?"
10005015-91 = "……? 잠깐. 아카네?"
10005015-92 = "이것들은 다 어디서 구한 거지? 설마 방금 전 쓰러뜨리며 기절시킨 가드들 걸 벗겨 온 건가?"
10005015-93 = "그리고 '평소에 봐 둔 것'이라니? 설마 우리 신체 사이즈를……."
10005015-94 = "자, 자. 사소한 것은 넘겨 두고."
10005015-95 = "작전을 위한 것일 뿐이니까요. 일단 맞는지부터 확인해야 하니, 입어보도록 할까요?"
10005015-96 = "부장님은 이리로 와 주세요. 입는 법을 모르실 테니, 제가 입혀드릴게요."
10005015-97 = "뭐라고?"
10005015-98 = "지금 애 취급하는 거냐?"
10005015-99 = "어라……. 죄송해요. 혹시 입는 법을 알고 계셨나요?"
10005015-100 = "아니."
10005015-101 = "후훗. 그럼 제가 도와드리겠습니다."
10005015-102 = "응."
10005015-105 = "……저기, 아카네? 아니, 우선 내 질문에 대한 대답을……."
10005015-109 = "사소한 것은 넘겨 두고."
10005015-110 = "……라고 말씀드렸죠?"
10005015-111 = "……."
10005015-112 = "……알았다. 그렇지. 우선은 임무가 우선이지. 나도 동의한다."
10005015-113 = "야, 이거 대체 어떻게 입는 거냐? 이상하게도 생겼네. 이게 진짜 옷이야?"
10005015-114 = "후훗. 제가 도와드릴 테니 잠시만 기다려 주시고……."
10005015-115 = "환복이 끝나면 시스템실로 향해서, 곧바로 다음 작전으로 넘어가죠."
10005015-116 = "……음?"
10005015-117 = "선생님? 왜 그러시죠? 마음에 걸리시는 거라도 있나요?"
10005015-118 = "[s5] \"뭔가 한 명이 부족하지 않아?\"\n[s6] \"……아스나는?\""
10005015-119 = "……어라?"
10005015-120 = "……어라?"
10005015-121 = "아하. 이해했습니다. 선생님께서는 저희와 같이 작전에 와 주신 게 처음이셨죠."
10005015-122 = "선생님, 아스나 선배에 대한 건 신경 쓰지 않는 게 좋다. 어차피 선배는 예측할 수 없는 사람이라……."
10005015-123 = "말한다고 듣는 녀석도 아니고 말이지."
10005015-124 = "아하하……. 선배는 스스로 일을 찾아서 해결하시는 타입이거든요."
10005015-125 = "작전 중에도 기본적인 브리핑만 전달할 뿐, 이후로는 알아서 진행하세요."
10005015-126 = "사실 그보다는 지금 저희 입장에서, 다른 쪽으로 조금 더 신경 쓰이는 게 있는데……."
10005015-127 = "[s] \"……?\""
10005015-133 = "……후훗. 선생님……?"
10005015-134 = "혹시 괜찮으시다면……."
10005015-135 = "지금부터 옷을 갈아입어야 하니……. 잠시만 돌아서 주시겠어요?"
10005015-136 = "……아니면 저희랑 같이……?"
10005015-137 = "[s7] \"……아.\"\n[s8] 황급히 몸을 돌린다."
10005015-142 = "(이후 돌아선 채로, 얌전히 세 명의 옷 갈아입는 소리를 들었다.)"
