1014602-90 = "3;마코토 수영복;01;일단, 이 몸의 인식과 타인의 인식이 맞는지 확인해둘 참에 묻는다만.\n#3;closeup"
1014602-91 = "3;마코토 수영복;10;선생은 이 수영복 차림을 어떻게 생각하나?\n#3;closeup"
