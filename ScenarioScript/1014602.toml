[translation]
1014602-1 = "The Chairman's Fabulous Summer"
1014602-2 = "[log]What is your opinion on[/log]"
1014602-4 = "[log]Chairman Hanuma Makoto?[/log]"
1014602-6 = ""
1014602-7 = "I don't know, who's that?"
1014602-8 = "Chairman? Since when does our school have a parliament?"
1014602-10 = "[log]What is your opinion on[/log]"
1014602-12 = "[log]the Pandemonium Society?[/log]"
1014602-14 = ""
1014602-15 = "\"Pandemonium Society\"? What's that?"
1014602-16 = "It's that club. The one with Chiaki and Ibuki."
1014602-17 = "Ah, right, right. I forgot that was a thing."
1014602-18 = "Anyways, what is this for? Are you filming us?"
1014602-19 = ""
1014602-22 = ""
1014602-23 = ""
1014602-24 = "...So, what do you think?"
1014602-25 = "[s1] \"Um... Cheer up?\"\n[s2] \"I know life can be hard sometimes, Makoto.\""
1014602-28 = "Hm...? What are you..."
1014602-29 = "Ah. There has been a misunderstanding, Sensei."
1014602-30 = "Kihehe! Their responses are all exactly according to what I, the Great Makoto, had planned!"
1014602-31 = "The results speak for themselves! Obscurantism is the core of politics!"
1014602-32 = "The less the students care, the stronger my authority and the Pandemonium Society's grows!"
1014602-33 = "...But it'd appear I'm too good at what I do."
1014602-34 = "To think the students not only forgot my name, but the existence of Pandemonium Society and the chairman itself."
1014602-35 = "Ahh! The curse of generational talent!"
1014602-36 = "So I have a plan, Sensei."
1014602-37 = "While the current situation is acceptable, the students appear to lack respect for us."
1014602-38 = "I must bring honor to both the Pandemonium Society and my name, Hanuma Makoto!"
1014602-39 = "In order to do so, I plan on rehabilitating my public image!"
1014602-40 = "Starting with my appearance!"
1014602-41 = "[s3] \"So that's the purpose of the swimsuit!\"\n[s4] \"I finally understand!\""
1014602-44 = "You understand me, Sensei! I knew I wouldn't have to explain."
1014602-45 = "Yes. This swimsuit is exactly what I needed."
1014602-46 = "It's a masterpiece. I hired a renowned designer who used only the finest fabrics to make it."
1014602-47 = "Well? Doesn't it make me look both friendly and charismatic, but unapproachable because of my overwhelming grace?"
1014602-48 = "...Yes. It was money very well spent."
1014602-49 = "My true problem lies in what comes next."
1014602-50 = "How do I naturally debut my new look to the student body?"
1014602-51 = "It must seem completely unintentional to have the intended effect! It'd be ludicrous to walk around campus like this for no reason!"
1014602-52 = "I must introduce myself gracefully, as if it were a mere act of serendipity! People will stop and think, \"Wow! Who is that incredibly cool person over there?\""
1014602-53 = "[s5] \"...Maybe participate in swimming lessons?\"\n[s6] \"You could go to a swimming pool or the beach...?\""
1014602-56 = "Absolutely not!"
1014602-57 = "Then my deep, dark secret that I cannot swim will be revealed to all!"
1014602-58 = ""
1014602-60 = ""
1014602-61 = "Ah!! I told you my deepest, darkest secret!"
1014602-62 = "...Gah. Your deft but leading questioning is a force to be reckoned with. I can't let my guard down."
1014602-63 = "It's not your fault. It's mine for dulling the edge of my blade."
1014602-64 = "I have no choice but to tell you, since I've already revealed it."
1014602-65 = "I only have two weaknesses in this world. Swimming is one of them."
1014602-66 = "[s7] \"...Ah, then do you want to learn?\"\n[s8] \"Are you asking me to teach you?\""
1014602-69 = "Hm? Not at all."
1014602-70 = "I have zero desire to learn how to swim."
1014602-71 = "...To begin with, the act of swimming is full of contradictions."
1014602-72 = "People cannot breathe in water! Therefore, heading into deep waters is an extremely dangerous endeavor! Life-threatening, even!"
1014602-73 = "How can someone enjoy themselves in such an extreme life-or-death situation?"
1014602-74 = "The point is, I reject the idea of people seeing me swim!"
1014602-75 = "I need a cool, chic way to debut that doesn't include swimming!"
1014602-76 = "And I know that Sensei of Schale will come up with the perfect plan that meets all my requirements!"
1014602-77 = "[s9] \"S-So much pressure!\"\n[s10] \"The requirements are extremely difficult, though?!\""
1014602-80 = "Naturally, I don't expect you to answer right away."
1014602-81 = "Even someone of your caliber needs time to think."
1014602-82 = "When your excellent plan does come to you, tell me immediately."
1014602-83 = "That is all."
1014602-84 = "...Oh, right."
1014602-85 = ""
1014602-87 = ""
1014602-88 = ""
1014602-89 = "I forgot to ask."
1014602-90 = "I would like to confirm that my personal perception matches others'."
1014602-91 = "What do you think about this swimsuit?"
1014602-92 = "[s11] \"Very beautiful.\"\n[s12] \"Graceful and chic.\""
1014602-95 = "Kihehe! I knew it!"
1014602-96 = "Naturally, first-class talent also means first-class taste."
1014602-97 = "[s13] \"Well, even if you weren't wearing a swimsuit...\"\n[s14] \"You're very pretty regardless.\""
1014602-100 = "...I-I suppose."
1014602-101 = "I have no frame of reference for that opinion."
1014602-102 = "A-Anyway!"
1014602-103 = "Report back as soon as you have formulated the perfect plan! That is all!"
1014602-105 = "Makoto kicked me out of the club room after that. I'd never seen her embarrassed like that before."
