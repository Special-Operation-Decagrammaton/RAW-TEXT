[translation]
1014602-1 = "華麗議長的夏天"
1014602-2 = "[log]關於羽沼真琴議長[/log]"
1014602-4 = "[log]你怎麼看呢？[/log]"
1014602-6 = ""
1014602-7 = "不知道，那是誰啊？"
1014602-8 = "議長？我們學園有議會這種東西嗎？"
1014602-10 = "[log]關於[ruby=Pandemonium Society]萬魔殿[/ruby][/log]"
1014602-12 = "[log]你怎麼看呢？[/log]"
1014602-14 = ""
1014602-15 = "萬魔殿？那是什麼？"
1014602-16 = "就是那個啊，那個。千秋醬和伊吹醬待的社團。"
1014602-17 = "啊，對對對。好像是有那種社團吧？"
1014602-18 = "話說這是什麼啊？在拍嗎？"
1014602-19 = ""
1014602-22 = ""
1014602-23 = ""
1014602-24 = "……老師啊。看了這個，你有什麼想法？"
1014602-25 = "[s1] 「呃……加油？」\n[s2] 「真琴，最近很累嗎？」"
1014602-28 = "嗯……？你這是在說什麼……"
1014602-29 = "啊啊，原來如此。你似乎誤會了啊，老師。"
1014602-30 = "嘰嘻嘻！他們說的一切，全都在真琴大人的計畫之中！"
1014602-31 = "畢竟政治的核心正是愚民化！"
1014602-32 = "學生們越是漠不關心，我真琴大人和萬魔殿的權威就越是穩固！"
1014602-33 = "……然而似乎是因為本大人太過優秀，反而造成了問題。"
1014602-34 = "沒想到學生們別說是真琴大人的名字，竟然連萬魔殿和議長職位的存在都忘了。"
1014602-35 = "啊啊！所謂的才能，簡直就像詛咒一樣！"
1014602-36 = "……所以說，老師。接下來是新的提案。"
1014602-37 = "現在的狀況雖然也不算太差，但學生們的尊敬似乎還不夠。"
1014602-38 = "為了讓萬魔殿，乃至於我真琴大人的名號更加響亮……"
1014602-39 = "本大人打算來個形象大改造！"
1014602-40 = "所以我就先試著從外表開始改變。"
1014602-41 = "[s3] 「所以才穿泳裝啊！」\n[s4] 「我總算懂了！」"
1014602-44 = "不愧是老師！這樣我就不必多花時間解釋了。"
1014602-45 = "實際上，這件泳裝我相當喜歡。"
1014602-46 = "這可是請來知名設計師，只用最高級布料製成的傑作。"
1014602-47 = "如何？既給人日常親近的感覺，同時又帶著令人難以高攀的優雅領袖魅力吧？"
1014602-48 = "……就這樣，直到花大錢準備好泳裝這一步都還算順利。"
1014602-49 = "不過接下來才是問題所在。"
1014602-50 = "難得有這副優雅的模樣，該怎麼做才能自然地展現給學生們看呢……"
1014602-51 = "強行硬來肯定是不行的！#n打扮成這樣在校園裡走動這類違反常識的行為，根本不在考慮範圍內！"
1014602-52 = "終究要在偶然之下自然地亮相，讓人心想「啊，那位帥氣的人是誰！？」才行！"
1014602-53 = "[s5] 「……去參加游泳課如何？」\n[s6] 「去游泳池或海邊的話……？」"
1014602-56 = "那可不行！"
1014602-57 = "那樣一來，本大人不會游泳的事不就曝光了嗎！"
1014602-58 = ""
1014602-60 = ""
1014602-61 = "糟了！！！說溜嘴了！！！"
1014602-62 = "……唔，好可怕的誘導詢問。果然是不能大意的對手。"
1014602-63 = "不，這不是老師的錯。#n是我不該在老師面前掉以輕心才對。"
1014602-64 = "既然被知道了，我就老實告訴你吧。"
1014602-65 = "對我真琴大人來說，游泳是僅有的兩個弱點之一。"
1014602-66 = "[s7] 「……啊，那難道是想學游泳嗎？」\n[s8] 「意思是要我教你？」"
1014602-69 = "嗯？完全不是啊？"
1014602-70 = "今後本大人也絲毫沒有學游泳的打算。"
1014602-71 = "……說到底，游泳這個行為本身就很矛盾。"
1014602-72 = "人在水裡是無法呼吸的！#n也就是說，潛入深水無異於拿性命做賭注的危險行為！"
1014602-73 = "把自己逼進那種極限狀態，還把它當成娛樂來享受！#n本大人實在無法理解！"
1014602-74 = "總之，展示游泳的模樣這個提案駁回！"
1014602-75 = "也就是說，本大人想在不游泳的前提下，#n把這身時髦又帥氣的泳裝打扮自然地展示給大眾看！"
1014602-76 = "如果是夏萊的老師，一定有什麼妙計吧。"
1014602-77 = "[s9] 「壓，壓力好大！」\n[s10] 「難度怎麼突然飆升了！？」"
1014602-80 = "啊，當然，我並不是要你現在馬上回答。"
1014602-81 = "就算是老師，也需要時間思考吧。"
1014602-82 = "要是想到什麼妙計，希望你能盡快告訴我。"
1014602-83 = "我想說的就是這些。"
1014602-84 = "……對了。"
1014602-85 = ""
1014602-87 = ""
1014602-88 = ""
1014602-89 = "這麼說來，有件事我忘了問你。"
1014602-90 = "這純粹只為了確認本大人跟他人的認知是否一致才問的……"
1014602-91 = "老師覺得這身泳裝打扮如何？"
1014602-92 = "[s11] 「非常美麗。」\n[s12] 「優雅又時髦呢。」"
1014602-95 = "嘻嘻！果然是這樣嗎！"
1014602-96 = "一流的人看衣服的眼光果然也是一流的啊。"
1014602-97 = "[s13] 「不過，就算不穿泳裝。」\n[s14] 「真琴本來就很漂亮啊。」"
1014602-100 = "……是，是嗎。"
1014602-101 = "那個……雖然這算不上什麼參考意見……"
1014602-102 = "總，總之！"
1014602-103 = "要是想到好計策就告訴我！就這樣！"
1014602-105 = "（之後，被難得害羞的真琴半推半趕地趕出了部室）"
