[translation]
1014602-1 = "華麗なる議長の夏"
1014602-2 = "[log][ruby=はぬま]羽沼[/ruby]マコト議長について[/log]"
1014602-4 = "[log]どう思いますか？[/log]"
1014602-7 = "え、誰？"
1014602-8 = "議長？うちの学園に議会なんてあったっけ？"
1014602-10 = "[log][ruby=パンデモニウム・ソサエティー] 万魔殿に[/ruby]ついて [/log]"
1014602-12 = "[log]どう思いますか？[/log]"
1014602-15 = "そもそも万魔殿って何？"
1014602-16 = "ほら、あれだよ。#nチアキちゃんとイブキちゃんがいるとこ。"
1014602-17 = "ああ、そういえばそんなのあったような？"
1014602-18 = "っていうか、何これ？#n撮られてる？"
1014602-24 = "……先生よ。#nこれをどう思う？"
1014602-25 = "[s1] \"うーん……頑張ってね？\"\n[s2] \"マコト、最近疲れてる？\""
1014602-28 = "ん……？#n一体何を……。"
1014602-29 = "ああ、勘違いしているのだな。先生。"
1014602-30 = "キシシッ！気にするな。#nすべてマコト様の計画通りだ！"
1014602-31 = "――政治において、民衆の愚民化は重要だ。"
1014602-32 = "無関心であればあるほど、万魔殿とマコト様の権威は高まるというもの！"
1014602-33 = "……だが、あまりにも偉大すぎるせいか――"
1014602-34 = "マコト様の名前どころか、万魔殿と議長の存在すら忘れられているとは。"
1014602-35 = "ああ！才能とはかくも罪なものだ！"
1014602-36 = "……そこでだ、先生よ。#nマコト様からの新たな提案だ。"
1014602-37 = "今の状況も悪くはないが、やはり認知されてこそだからな。#n畏敬の念は必要だ。"
1014602-38 = "万魔殿、ひいてはマコト様の威光をキヴォトス中に広めるためにも――"
1014602-39 = "イメージを刷新しようと思ってな！"
1014602-40 = "そこで、まずは見た目から変えてみたというわけだ。"
1014602-41 = "[s3] \"だから水着なんだね！\"\n[s4] \"やっと分かった。\""
1014602-44 = "キキッ！先生は話が早くて助かるな。"
1014602-45 = "良いだろう？この水着――#nマコト様も実に気に入っている。"
1014602-46 = "一流のデザイナーに最高級の生地を使って作らせた逸品だ。"
1014602-47 = "親しみの持てる雰囲気を持ちつつも、威厳のある指導者の気品を感じるだろう？"
1014602-48 = "……こうして水着を準備したところまでは良かったのだが。"
1014602-49 = "問題は、ここからだ。"
1014602-50 = "このマコト様の上品な姿を、どうすればゲヘナ生に印象づけられるのか……。"
1014602-51 = "無理強いなど言語道断。#nそれに、この姿で校内を歩き回るなど、もってのほか！"
1014602-52 = "あくまで偶発的に――自然に姿を見せ、#n「あの素敵な方はどなた！？」と話題にさせるのだ！"
1014602-53 = "[s5] \"……水泳の授業に参加するとか？\"\n[s6] \"プールや海に行くとか……？\""
1014602-56 = "それは無理だ！"
1014602-57 = "それでは、マコト様が泳げないことがバレてしまうではないか！"
1014602-61 = "ぐああっ！！！言ってしまった！！！"
1014602-62 = "……くううっ、これが誘導尋問か。#nやはり先生はただ者ではないな。"
1014602-63 = "いや、先生に非は無い。#n気を抜いてしまった私の過ちだ。"
1014602-64 = "だが、知られた以上――話すしかあるまい。"
1014602-65 = "このマコト様にとって水泳というのは――#n2つしかない弱点のうちの1つなのだ。"
1014602-66 = "[s7] \"……泳げるようになりたいの？\"\n[s8] \"教えてもらいたいとか？\""
1014602-69 = "ん？そんなことは言ってないぞ？"
1014602-70 = "今後も水泳を習うことはないだろう。"
1014602-71 = "そもそも……泳ぐという行為は矛盾しているじゃないか。"
1014602-72 = "人は水中で呼吸できない！#nつまり、水の中に深く入るということは、生命を脅かす危険行為に他ならないのだ！"
1014602-73 = "わざわざ好んで水中に潜り、それを楽しもうとは！#nつくづく理解ができない。"
1014602-74 = "というわけで、泳ぐ姿を見せるのは却下だ！"
1014602-75 = "泳がずとも、このマコト様の魅力的な水着姿はゲヘナ生を虜にするだろう！"
1014602-76 = "それに……シャーレの先生なら、きっと素晴らしい策を持っているのではないか？"
1014602-77 = "[s9] \"ぷ、プレッシャーがすごい！\"\n[s10] \"急に難易度が上がったような！？\""
1014602-80 = "もちろん、今すぐ答えろというつもりはない。"
1014602-81 = "急な話だ。#n先生にも考える時間が必要だろう。"
1014602-82 = "良い案が浮かんだら、すぐにでも連絡してくれ。"
1014602-83 = "用件は以上だ。"
1014602-84 = "ああ……そうだ。"
1014602-89 = "お互いの認識をすり合わせるためにも必要だから……。"
1014602-90 = "あえて聞くのだが――"
1014602-91 = "先生は、マコト様の水着姿をどう思う？"
1014602-92 = "[s11] \"よく似合ってるよ。\"\n[s12] \"上品で素敵だね。\""
1014602-95 = "キキキッ！そうだろうとも！"
1014602-96 = "流石は先生、このマコト様が見込んだだけはある。確かな審美眼だな。"
1014602-97 = "[s13] \"まあ、水着姿でなくても。\"\n[s14] \"マコトは綺麗だよ。\""
1014602-100 = "……そ、そうか。"
1014602-101 = "というか……それでは参考にならないだろう。当然すぎる話だ。"
1014602-102 = "と、とにかく！"
1014602-103 = "良い案が浮かんだら、連絡するように！以上だ！"
1014602-105 = "（その後、珍しく恥ずかしがるマコトに部屋を追い出されてしまった）"
