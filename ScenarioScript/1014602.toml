[translation]
1014602-1 = "화려한 의장님의 여름"
1014602-2 = "[log]하누마 마코토 의장님에 대해[/log]"
1014602-4 = "[log]어떻게 생각하시나요?[/log]"
1014602-7 = "몰라, 그게 누군데?"
1014602-8 = "의장? 우리 학교에서 의회 같은 게 있었나?"
1014602-10 = "[log][ruby=판데모니움 소사이어티]만마전[/ruby]에 대해[/log]"
1014602-12 = "[log]어떻게 생각하시나요?[/log]"
1014602-15 = "만마전? 그게 뭔데?"
1014602-16 = "그거잖아, 그거. 치아키 쨩이랑 이부키 쨩이 있는 동아리."
1014602-17 = "아, 맞다맞다. 그런 동아리 있었지?"
1014602-18 = "그나저나 뭐야, 이거? 찍고 있는 거야?"
1014602-24 = "……선생이여. 이걸 보고, 무슨 생각이 들었지?"
1014602-25 = "[s1] \"어…… 힘내?\"\n[s2] \"마코토, 요즘 힘드니?\""
1014602-28 = "응……? 그게 무슨……."
1014602-29 = "아아. 과연, 오해하고 있군. 선생."
1014602-30 = "키시싯! 저들이 말하는 것은 모두 마코토 님이 설계하고 있는 바대로다!"
1014602-31 = "말해 무엇할까! 정치의 핵심은 바로 우민화!"
1014602-32 = "학생들이 무관심하면 무관심해질수록, 이 마코토 님과 만마전의 권위는 공고해진다!"
1014602-33 = "……만은, 아무래도 이 몸이 너무나도 뛰어난 것이 탈이 된 듯하더군."
1014602-34 = "설마 학생들이 마코토 님의 이름은커녕, 설마 만마전과 의장직의 존재마저 잊어버릴 줄은."
1014602-35 = "아아! 재능이란 것은, 저주와도 같구나!"
1014602-36 = "……그래서, 여기서부터 새로운 제안이다, 선생."
1014602-37 = "지금 상황도 썩 나쁘지 않다만, 아무래도 학생들의 존경이 부족한 듯해서 말이지."
1014602-38 = "만마전과 더 나아가, 이 마코토 님의 이름을 드높일 수 있도록……."
1014602-39 = "이미지 체인지를 해보려고 한다!"
1014602-40 = "그걸 위해 겉모습부터 바꿔보려 했지."
1014602-41 = "[s3] \"그래서 수영복인가!\"\n[s4] \"겨우 이해했다!\""
1014602-44 = "역시나, 선생! 설명할 수고를 덜었군."
1014602-45 = "실제로 이 수영복은 꽤 마음에 드는 물건이다."
1014602-46 = "저명한 디자이너를 섭외하고, 최고급 원단만을 사용하여 만든 걸작이지."
1014602-47 = "어떤가? 일상적이고 친근한 느낌을 주지만, 동시에 감히 넘보기 어려운 우아한 카리스마를 함께 전달하지 않나?"
1014602-48 = "……그렇게, 거금을 들여 수영복을 준비한 것까지는 좋았는데."
1014602-49 = "문제는, 이 다음이다."
1014602-50 = "모처럼 이 우아한 모습을 어떻게 해야 자연스럽게 학생들에게 선보일 수 있을지……."
1014602-51 = "물론, 억지스러운 강행은 언어도단! 이 모습으로 교정을 다닌다든지 상식밖의 행동은 상정 외다!"
1014602-52 = "어디까지나 우연하고 자연스럽게 노출되어 '앗, 저 멋있는 분은 누구지?!' 라는 생각이 들어야 하는 것이다!"
1014602-53 = "[s5] \"……수영 수업이라도 참여하면?\"\n[s6] \"수영장이나, 바다에 가면……?\""
1014602-56 = "그건 싫다!"
1014602-57 = "그래서는 이 몸이 수영하지 못한다는 사실이 탄로 나지 않느냐!"
1014602-61 = "아차!!! 말해버렸다!!!"
1014602-62 = "……끄응, 무서울 정도의 유도 심문. 역시 방심할 수 없는 상대로군."
1014602-63 = "아니, 선생의 잘못은 아니다. 선생을 상대하고 있는 이상, 감히 마음을 놓아서는 안 되었지."
1014602-64 = "알려진 이상, 순순히 털어놓도록 하지."
1014602-65 = "이 마코토 님에게 있어, 수영은 오직 둘뿐인 약점 중 하나라고."
1014602-66 = "[s7] \"……아, 그러면 혹시 수영을 배우고 싶다든지?\"\n[s8] \"가르쳐 달라는 그런 의미?\""
1014602-69 = "응? 전혀 아니다만?"
1014602-70 = "향후에도 이 몸은 수영을 배울 생각이 추호도 없다."
1014602-71 = "……애초에, 수영이라는 행위 자체가 모순되었다."
1014602-72 = "사람은 물에서 호흡할 수 없다! 즉, 깊은 물 속에 들어가는 것은 생명을 저당 거는 것이나 다름없는 위험천만한 행위!"
1014602-73 = "그런 극한의 상태로 자신을 몰아넣고, 그런 상황을 유흥으로 즐긴다니! 이 몸은 도저히 이해할 수 없다!"
1014602-74 = "어쨌건, 수영하는 모습을 보여주는 것은 기각이다!"
1014602-75 = "즉, 이 몸은 수영하지 않으면서도, 이 세련되고 멋진 수영복 모습을 대중에게 자연스럽게 노출하고자 하는 것이다!"
1014602-76 = "샬레의 선생이라면, 분명 훌륭한 비책을 가지고 있을 터."
1014602-77 = "[s9] \"부, 부담스러워!\"\n[s10] \"갑자기 난이도가 뛰는데요?!\""
1014602-80 = "아, 물론, 지금 당장 대답을 요구하는 것은 아니다."
1014602-81 = "선생이라 해도 생각할 시간은 필요하겠지."
1014602-82 = "혹시라도 좋은 비책이 떠오른다면, 빠르게 이 몸에게 알려주길 바란다."
1014602-83 = "용무는 이상이다."
1014602-84 = "……아참."
1014602-89 = "그러고 보니, 물어보는 걸 깜빡했군."
1014602-90 = "일단, 이 몸의 인식과 타인의 인식이 맞는지 확인해둘 참에 묻는다만."
1014602-91 = "선생은 이 수영복 차림을 어떻게 생각하나?"
1014602-92 = "[s11] \"몹시 아름다워.\"\n[s12] \"우아하고 세련되었네.\""
1014602-95 = "키키킷! 역시 그런가!"
1014602-96 = "역시 일류는 옷을 보는 안목도 일류라는 건가."
1014602-97 = "[s13] \"뭐, 수영복 차림이 아니라도.\"\n[s14] \"마코토는 워낙 예쁘니까.\""
1014602-100 = "……그, 그런가."
1014602-101 = "그것은, 참고가 되는 의견은 아니지만……."
1014602-102 = "하, 하여튼!"
1014602-103 = "좋은 비책이 떠오른다면 알려주길 바란다! 이상이다!"
1014602-105 = "(이후, 드물게도 부끄러워하는 마코토로부터 등 떠밀리듯이 부실에서 쫓겨나고 말았다.)"
