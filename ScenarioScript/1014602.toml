[translation]
1014602-1 = "ฤดูร้อนของท่านประธานผู้เลิศหรู"
1014602-2 = "[log]คุณคิดยังไงเกี่ยวกับ[/log]"
1014602-4 = "[log]ท่านประธานฮานุมะ มาโคโตะ?[/log]"
1014602-6 = ""
1014602-7 = "ไม่รู้สิ ใครเหรอ?"
1014602-8 = "หมายถึงประธานสภาหรือเปล่า? โรงเรียนเรามีสภาอะไรแบบนั้นด้วยเหรอ?"
1014602-10 = "[log]คุณคิดยังไงเกี่ยวกับ[/log]"
1014602-12 = "[log]แพนเดโมเนียม โซไซตี้?[/log]"
1014602-14 = ""
1014602-15 = "แพนเดโมเนียม โซไซตี้? คืออะไรเหรอ?"
1014602-16 = "ก็อันนั้นไง ชมรมที่จิอากิจังกับอิบูกิจังอยู่น่ะ"
1014602-17 = "อ๋อ ใช่ๆ มีชมรมแบบนั้นอยู่ด้วยนี่เนอะ?"
1014602-18 = "ว่าแต่ นี่อะไรน่ะ? กำลังถ่ายพวกเราอยู่เหรอ?"
1014602-19 = ""
1014602-22 = ""
1014602-23 = ""
1014602-24 = "ครู... พอได้ดูนี่แล้วคิดว่ายังไงบ้าง?"
1014602-25 = "[s1] \"เอ่อ... สู้ๆ นะ?\"\n[s2] \"มาโคโตะ... ช่วงนี้เหนื่อยเหรอ?\""
1014602-28 = "หืม...? หมายความว่ายังไง..."
1014602-29 = "อ๋อ อย่างนี้นี่เอง ครูเข้าใจผิดอยู่สินะ"
1014602-30 = "คิกคิกคิก! ทุกอย่างที่พวกนั้นพูดเป็นไปตามที่ท่านมาโคโตะวางแผนไว้ทั้งสิ้น!"
1014602-31 = "ไม่ต้องบอกก็รู้! หัวใจของการเมืองก็คือการทำให้ประชาชนโง่เขลา!"
1014602-32 = "ยิ่งนักเรียนไม่สนใจมากเท่าไร อำนาจของท่านมาโคโตะผู้นี้กับแพนเดโมเนียม โซไซตี้ก็ยิ่งมั่นคงขึ้น#nเท่านั้น!"
1014602-33 = "แต่ว่า ดูเหมือนเราจะเก่งกาจเกินไปจนกลายเป็นปัญหาเสียแล้วสินะ..."
1014602-34 = "ไม่นึกเลยว่านักเรียนจะไม่เพียงลืมชื่อของท่านมาโคโตะไป แต่ถึงกับลืมว่ามีแพนเดโมเนียม โซไซตี้ และตำแหน่งประธานอยู่ด้วย"
1014602-35 = "อ่า! พรสวรรค์นี่ก็เหมือนคำสาปสินะ!"
1014602-36 = "เพราะงั้น ต่อจากนี้คือข้อเสนอใหม่ ครู..."
1014602-37 = "สถานการณ์ตอนนี้ก็ไม่ได้เลวร้ายนัก แต่ดูเหมือนนักเรียนจะยังเคารพเราไม่มากพอ"
1014602-38 = "เพื่อเชิดชูชื่อของแพนเดโมเนียม โซไซตี้ และยิ่งไปกว่านั้น เพื่อเชิดชูชื่อของท่านมาโคโตะผู้นี้..."
1014602-39 = "เราตั้งใจว่าจะเปลี่ยนภาพลักษณ์ของตัวเองดู!"
1014602-40 = "เราก็เลยลองเริ่มจากเปลี่ยนรูปลักษณ์ภายนอกก่อน"
1014602-41 = "[s3] \"ถึงได้ใส่ชุดว่ายน้ำนี่เอง!\"\n[s4] \"ในที่สุดก็เข้าใจแล้ว!\""
1014602-44 = "สมกับเป็นครูเลยนะ! แบบนี้เราก็ไม่ต้องอธิบายให้เหนื่อย"
1014602-45 = "ที่จริง เราค่อนข้างถูกใจชุดว่ายน้ำชุดนี้เลยละ"
1014602-46 = "ชุดนี้เป็นผลงานชิ้นโบแดงที่จ้างดีไซเนอร์ชื่อดังมาออกแบบ และใช้แต่ผ้าคุณภาพสูงสุดเท่านั้น"
1014602-47 = "เป็นยังไงล่ะ? ถึงจะดูสบายๆ เป็นกันเอง แต่ก็ถ่ายทอดเสน่ห์อันสง่างามที่ยากจะมองข้ามออกมา#nพร้อมกันด้วยใช่มั้ย?"
1014602-48 = "เราทุ่มเงินก้อนโตเตรียมชุดว่ายน้ำแบบนั้นมาได้แล้วก็จริง..."
1014602-49 = "แต่ปัญหาคือหลังจากนี้ต่างหาก"
1014602-50 = "อุตส่าห์มีโอกาสทั้งที แต่จะอวดโฉมอันสง่างามนี้ให้พวกนักเรียนเห็นแบบเนียนๆ ยังไงดีนี่น่ะสิ..."
1014602-51 = "แน่นอนว่าการฝืนดันทุรังเป็นเรื่องเหลวไหล! การทำอะไรนอกสามัญสำนึกอย่างเดินไปทั่วโรงเรียนใน#nชุดว่ายน้ำนี้ย่อมอยู่นอกเหนือแผนการ!"
1014602-52 = "ต้องให้พวกนักเรียนบังเอิญเห็นอย่างเป็นธรรมชาติ แล้วคิดขึ้นมาว่า 'ว้าว คนที่ดูดีขนาดนั้น#nเป็นใครกัน?!'"
1014602-53 = "[s5] \"ลองเข้าคาบเรียนว่ายน้ำดูมั้ย...?\"\n[s6] \"ลองไปสระว่ายน้ำ หรือไม่ก็ทะเลดูมั้ย...?\""
1014602-56 = "เราไม่เอาแบบนั้นหรอก!"
1014602-57 = "ถ้าทำแบบนั้น เรื่องที่ว่าเราว่ายน้ำไม่เป็นก็จะถูกเปิดโปงน่ะสิ!"
1014602-58 = ""
1014602-60 = ""
1014602-61 = "ตายล่ะ!!! เผลอพูดออกไปแล้ว!!!"
1014602-62 = "อึก... ช่างเป็นการถามล้วงข้อมูลที่น่ากลัวจริงๆ สมแล้วที่เป็นคู่ต่อสู้ที่เราเผลอประมาทไม่ได้"
1014602-63 = "ไม่สิ ไม่ใช่ความผิดของครูหรอก เมื่ออยู่ต่อหน้าครู เราก็ไม่ควรชะล่าใจแม้แต่น้อย"
1014602-64 = "แต่ในเมื่อรู้กันแล้ว เราก็จะยอมเปิดเผยแต่โดยดี"
1014602-65 = "การว่ายน้ำคือหนึ่งในจุดอ่อนเพียงสองอย่างของท่านมาโคโตะผู้นี้"
1014602-66 = "[s7] \"อ่า... ถ้างั้นอยากเรียนว่ายน้ำมั้ย?\"\n[s8] \"แปลว่าอยากให้ครูสอนว่ายน้ำเหรอ?\""
1014602-69 = "หืม? ไม่ใช่เลยสักนิด"
1014602-70 = "ไม่ว่าจะตอนนี้หรือในอนาคต เราก็ไม่มีความคิดจะเรียนว่ายน้ำเลยแม้แต่น้อย"
1014602-71 = "การว่ายน้ำก็เป็นการกระทำที่ขัดแย้งในตัวเองตั้งแต่แรกอยู่แล้วด้วย..."
1014602-72 = "มนุษย์หายใจในน้ำไม่ได้! การลงไปในน้ำลึกจึงเป็นการกระทำที่อันตรายอย่างยิ่ง ไม่ต่างอะไรกับการเอาชีวิตไปเป็นเดิมพัน!"
1014602-73 = "ผลักตัวเองเข้าไปสู่สภาวะสุดขั้วแบบนั้น แล้วยังสนุกกับสถานการณ์แบบนั้นได้อีกเนี่ยนะ! เราไม่มีทางเข้าใจได้เลย!"
1014602-74 = "ยังไงก็เถอะ เอาเป็นว่าเราปัดตกข้อเสนอให้คนอื่นเห็นเราว่ายน้ำ!"
1014602-75 = "เราต้องการเผยโฉมในชุดว่ายน้ำที่มีระดับและดูดีนี้ให้สาธารณชนได้เห็นอย่างเป็นธรรมชาติ โดยที่ไม่ต้องว่ายน้ำ!"
1014602-76 = "ถ้าเป็นครูจากชาเล่ต์ละก็ ต้องมีเคล็ดลับที่ยอดเยี่ยมอยู่แน่"
1014602-77 = "[s9] \"กะ... กดดันจัง!\"\n[s10] \"จู่ๆ ความยากก็พุ่งขึ้นเลยนะ?!\""
1014602-80 = "อ้อ แน่นอนว่าเราไม่ได้ต้องการคำตอบเดี๋ยวนี้หรอก"
1014602-81 = "ต่อให้เป็นครู ก็คงต้องการเวลาคิดบ้างอยู่แล้ว"
1014602-82 = "ถ้าคิดเคล็ดลับดีๆ ขึ้นมาได้ ก็ขอให้รีบมาบอกเรานะ"
1014602-83 = "เรื่องที่จะคุยก็มีเท่านี้ละ"
1014602-84 = "อ้อ จริงสิ..."
1014602-85 = ""
1014602-87 = ""
1014602-88 = ""
1014602-89 = "จะว่าไป เราก็ลืมถามไปเลย"
1014602-90 = "เราขอถามเพื่อยืนยันก่อนว่ามุมมองของเราตรงกับมุมมองของคนอื่นหรือเปล่า"
1014602-91 = "ครูคิดยังไงกับเราในชุดว่ายน้ำนี้เหรอ?"
1014602-92 = "[s11] \"สวยมากเลย\"\n[s12] \"สง่างามแล้วก็ดูมีสไตล์นะ\""
1014602-95 = "คิกคิกคิก! เป็นอย่างนั้นจริงๆ สินะ!"
1014602-96 = "สมกับเป็นคนชั้นหนึ่ง แม้แต่สายตาในการมองเสื้อผ้าก็ยังเป็นชั้นหนึ่งสินะ"
1014602-97 = "[s13] \"ถึงจะไม่ได้ใส่ชุดว่ายน้ำก็สวยอยู่แล้วนะ\"\n[s14] \"มาโคโตะก็สวยเป็นทุนอยู่แล้วนี่นา\""
1014602-100 = "งะ... งั้นเหรอ..."
1014602-101 = "ถึงจะไม่ใช่ความเห็นที่ใช้เป็นข้อมูลอ้างอิงได้..."
1014602-102 = "ตะ... แต่ยังไงก็เถอะ!"
1014602-103 = "ถ้าคิดเคล็ดลับดีๆ ออก ก็ช่วยบอกเราด้วยล่ะ! จบธุระเท่านี้!"
1014602-105 = "(หลังจากนั้น มาโคโตะที่นานๆ จะเขินสักครั้งก็ไล่ครูออกจากห้องชมรม เรียกว่าแทบจะผลักหลังให้#nออกมาเลยทีเดียว)"
