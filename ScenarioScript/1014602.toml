1014602-15 = "2;게헨나 학생 A;08;만마전? 그게 뭔데?"
1014602-16 = "4;게헨나 학생 B;02;그거잖아, 그거. 치아키 쨩이랑 이부키 쨩이 있는 동아리.\n#4;em;[전구]"
