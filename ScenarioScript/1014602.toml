1014602-28 = "3;마코토 수영복;02;응……? 그게 무슨…….\n#3;em;[?]"
1014602-29 = "3;마코토 수영복;01;아아. 과연, 오해하고 있군. 선생."
1014602-30 = "3;마코토 수영복;03;키시싯! 저들이 말하는 것은 모두 마코토 님이 설계하고 있는 바대로다!"
1014602-31 = "3;마코토 수영복;10;말해 무엇할까! 정치의 핵심은 바로 우민화!\n#fontsize;80\n#3;em;[!]"
1014602-32 = "3;마코토 수영복;10;학생들이 무관심하면 무관심해질수록, 이 마코토 님과 만마전의 권위는 공고해진다!"
1014602-33 = "3;마코토 수영복;99;……만은, 아무래도 이 몸이 너무나도 뛰어난 것이 탈이 된 듯하더군."
1014602-34 = "3;마코토 수영복;05;설마 학생들이 마코토 님의 이름은커녕, 설마 만마전과 의장직의 존재마저 잊어버릴 줄은.\n#3;em;[한숨]"
1014602-35 = "3;마코토 수영복;06;아아! 재능이란 것은, 저주와도 같구나!"
1014602-36 = "3;마코토 수영복;03;……그래서, 여기서부터 새로운 제안이다, 선생.\n#3;em;[음표]"
1014602-37 = "3;마코토 수영복;02;지금 상황도 썩 나쁘지 않다만, 아무래도 학생들의 존경이 부족한 듯해서 말이지."
1014602-38 = "3;마코토 수영복;02;만마전과 더 나아가, 이 마코토 님의 이름을 드높일 수 있도록……."
1014602-39 = "3;마코토 수영복;15;이미지 체인지를 해보려고 한다!\n#3;em;[!]"
1014602-40 = "3;마코토 수영복;16;그걸 위해 겉모습부터 바꿔보려 했지."
1014602-41 = "[s3] \"그래서 수영복인가!\"\n[s4] \"겨우 이해했다!\""
1014602-42 = "#wait;10"
1014602-43 = "#wait;10"
1014602-44 = "3;마코토 수영복;03;역시나, 선생! 설명할 수고를 덜었군."
1014602-45 = "3;마코토 수영복;10;실제로 이 수영복은 꽤 마음에 드는 물건이다.\n#3;em;[음표]"
1014602-46 = "3;마코토 수영복;10;저명한 디자이너를 섭외하고, 최고급 원단만을 사용하여 만든 걸작이지."
1014602-47 = "3;마코토 수영복;03;어떤가? 일상적이고 친근한 느낌을 주지만, 동시에 감히 넘보기 어려운 우아한 카리스마를 함께 전달하지 않나?\n#3;em;[재잘]"
1014602-48 = "3;마코토 수영복;05;……그렇게, 거금을 들여 수영복을 준비한 것까지는 좋았는데."
1014602-49 = "3;마코토 수영복;06;문제는, 이 다음이다."
1014602-50 = "3;마코토 수영복;04;모처럼 이 우아한 모습을 어떻게 해야 자연스럽게 학생들에게 선보일 수 있을지…….\n#3;stiff"
1014602-51 = "3;마코토 수영복;04;물론, 억지스러운 강행은 언어도단! 이 모습으로 교정을 다닌다든지 상식밖의 행동은 상정 외다!"
1014602-52 = "3;마코토 수영복;05;어디까지나 우연하고 자연스럽게 노출되어 '앗, 저 멋있는 분은 누구지?!' 라는 생각이 들어야 하는 것이다!"
1014602-53 = "[s5] \"……수영 수업이라도 참여하면?\"\n[s6] \"수영장이나, 바다에 가면……?\""
1014602-54 = "#wait;10"
1014602-55 = "#wait;10"
1014602-56 = "3;마코토 수영복;05;그건 싫다!"
1014602-57 = "3;마코토 수영복;04;그래서는 이 몸이 수영하지 못한다는 사실이 탄로 나지 않느냐!\n#3;hophop"
1014602-58 = "#st;[0,0];instant;1;"
1014602-59 = "#clearST"
1014602-60 = "3;마코토 수영복;04\n#3;em;…\n#wait;2500"
1014602-61 = "3;마코토 수영복;08;아차!!! 말해버렸다!!!\n#fontsize;100\n#bgshake\n#3;closeup"
1014602-62 = "3;마코토 수영복;06;……끄응, 무서울 정도의 유도 심문. 역시 방심할 수 없는 상대로군.\n#3;stiff\n#3;closeup"
1014602-63 = "3;마코토 수영복;04;아니, 선생의 잘못은 아니다. 선생을 상대하고 있는 이상, 감히 마음을 놓아서는 안 되었지.\n#3;closeup"
1014602-64 = "3;마코토 수영복;04;알려진 이상, 순순히 털어놓도록 하지.\n#3;closeup"
1014602-65 = "3;마코토 수영복;18;이 마코토 님에게 있어, 수영은 오직 둘뿐인 약점 중 하나라고.\n#3;closeup"
1014602-66 = "[s7] \"……아, 그러면 혹시 수영을 배우고 싶다든지?\"\n[s8] \"가르쳐 달라는 그런 의미?\""
1014602-67 = "#wait;10"
1014602-68 = "#wait;10"
1014602-69 = "3;마코토 수영복;02;응? 전혀 아니다만?\n#3;em;[?]"
1014602-70 = "3;마코토 수영복;02;향후에도 이 몸은 수영을 배울 생각이 추호도 없다."
1014602-71 = "3;마코토 수영복;04;……애초에, 수영이라는 행위 자체가 모순되었다."
1014602-72 = "3;마코토 수영복;05;사람은 물에서 호흡할 수 없다! 즉, 깊은 물 속에 들어가는 것은 생명을 저당 거는 것이나 다름없는 위험천만한 행위!\n#3;em;[스팀]\n#3;hophop"
1014602-73 = "3;마코토 수영복;05;그런 극한의 상태로 자신을 몰아넣고, 그런 상황을 유흥으로 즐긴다니! 이 몸은 도저히 이해할 수 없다!"
1014602-74 = "3;마코토 수영복;04;어쨌건, 수영하는 모습을 보여주는 것은 기각이다!"
1014602-75 = "3;마코토 수영복;05;즉, 이 몸은 수영하지 않으면서도, 이 세련되고 멋진 수영복 모습을 대중에게 자연스럽게 노출하고자 하는 것이다!"
1014602-76 = "3;마코토 수영복;10;샬레의 선생이라면, 분명 훌륭한 비책을 가지고 있을 터.\n#3;em;[반짝]"
1014602-77 = "[s9] \"부, 부담스러워!\"\n[s10] \"갑자기 난이도가 뛰는데요?!\""
1014602-78 = "#wait;10"
1014602-79 = "#wait;10"
1014602-80 = "3;마코토 수영복;03;아, 물론, 지금 당장 대답을 요구하는 것은 아니다."
1014602-81 = "3;마코토 수영복;03;선생이라 해도 생각할 시간은 필요하겠지."
1014602-82 = "3;마코토 수영복;01;혹시라도 좋은 비책이 떠오른다면, 빠르게 이 몸에게 알려주길 바란다.\n#3;greeting"
1014602-83 = "3;마코토 수영복;01;용무는 이상이다."
