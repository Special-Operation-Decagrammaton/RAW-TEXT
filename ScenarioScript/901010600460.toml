[translation]
901010600460-6 = "งั้นเรามาสรุปข้อสันนิษฐานทั้งหมดจนถึงตอนนี้กัน.."
901010600460-7 = "<ชาวประมงที่หายตัวไปจากท่าเรือกำลังถูกปัญหาหนี้สินเล่นงานอยู่>"
901010600460-8 = "<ในวันเกิดเหตุ เขาขึ้นรถไฟและออกจากท่าเรือไป>"
901010600460-9 = "<นอกจากชาวประมง ก็ยังมีชาวเมืองจำนวนมากที่กู้เงินจากการ์ปัชโช่ แฟมิลี่>"
901010600460-10 = "อ่า ในที่สุดก็พอจะเข้าใจความจริงของคดีคนหายครั้งนี้แล้ว"
901010600460-11 = "ผู้สูญหายแถวท่าเรือคาเนะซากิ ล้วนเป็นลูกหนี้ที่กู้เงินจากการ์ปัชโช่ แฟมิลี่"
901010600460-12 = "แต่ลูกหนี้บางคนใช้หนี้ไม่ไหวเพราะดอกเบี้ยสูง ก็เลยวางแผนหลบหนีอย่างลับๆ..."
901010600460-13 = "และพอต้องคอยหลบสายตาของการ์ปัชโช่ แฟมิลี่ที่ควบคุมการเข้าออกท่าเรือ จึงดูราวกับว่าพวกเขาหายสาบสูญไป"
901010600460-14 = "ฉันก็คิดว่าครั้งนี้ข้อสันนิษฐานของ FOX 4 ก็น่าจะถูกต้องนะ"
901010600460-15 = "นอกเหนือจากข้อสันนิษฐานนี้แล้ว ก็ไม่มีทั้งเหตุผลหรือวิธีที่ผู้คนจะหายตัวไปอย่างกะทันหันได้"
901010600460-16 = "แม้ข่าวลือหลายอย่างจะทำให้ดูเหมือนเป็นคดีน่าสะพรึงกลัว แต่ความจริงกลับเรียบง่ายกว่าที่คิดอีกนะคะ"
901010600460-17 = "ถ้ารายงานข้อมูลที่รวบรวมได้ให้องค์การนักเรียน และขอให้ฝ่ายการเงินตรวจสอบอีกครั้ง#nว่ามีการทุจริตเกี่ยวกับการกู้หนี้ยืมสินหรือเปล่า ก็น่าจะไม่มีปัญหาค่ะ"
901010600460-18 = "[s] \"งั้นก็ปิดคดีได้แล้วน่ะสิ?\""
901010600460-19 = "ค่ะ เบื้องต้นก็เป็นแบบนั้น แต่ว่า..."
901010600460-20 = "..."
901010600460-21 = ""
901010600460-23 = ""
901010600460-24 = "มีอะไรคาใจหรือเปล่า FOX 1?"
901010600460-25 = "เปล่า ฉันแค่รู้สึกว่าเรากำลังมองข้ามบางอย่างที่สำคัญไปน่ะ"
901010600460-26 = "[s] \"มีอะไรที่ติดใจงั้นเหรอ?\""
901010600460-27 = "ไม่มีค่ะ ข้อมูลที่รวบรวมมาไม่มีส่วนไหนขัดแย้งกัน"
901010600460-28 = "มันชัดเจนและเข้าใจง่าย... เพราะข้อมูลทั้งหมดชี้ไปยังเหตุและผลเดียวกัน"
901010600460-29 = "แต่ก็เพราะเป็นแบบนั้น ฉันเลยรู้สึกเหมือนมีใครบางคนจงใจชักนำให้ได้ข้อสรุปนี้เพียงข้อเดียวค่ะ"
901010600460-30 = "อีกอย่าง ถ้าคดีนี้มีสาเหตุมาจากปัญหาหนี้สินเพียงอย่างเดียว"
901010600460-31 = "แล้วทำไม 'ปูในถังเหล็ก' ถึงยังถูกพูดถึงในข่าวลืออยู่เรื่อยๆ เลยล่ะคะ?"
901010600460-32 = "ถ้ามีใครจงใจแพร่กระจายความหวาดกลัว ก็ย่อมต้องมีเหตุผล..."
901010600460-34 = "มันก็... เป็นแค่เรื่องที่ดูน่าสนใจ ก็เลยถูกพูดถึงไม่ใช่เหรอ?"
901010600460-35 = "เรื่องที่กลายเป็นกระแสบนโซเชียลมีเดียน่ะ ไม่จำเป็นต้องมีเหตุผลหรอก"
901010600460-36 = "พวกมีมก็ด้วย การพยายามหาว่าทำไมมันถึงแพร่กระจาย ก็เป็นเรื่องไร้สาระพอๆ กันนั่นแหละ"
901010600460-37 = "ดูอย่างนกประหลาดสีขาวตัวนั้นสิ ทั้งๆ ที่ไม่น่ารักเลยสักนิด แต่ก็ยังมีขายอยู่ทั่วเลยใช่มั้ยล่ะ?"
901010600460-39 = "แต่ว่า..."
901010600460-40 = ""
901010600460-44 = "[ns] \"ทุกคน พรุ่งนี้เช้าไปที่ท่าเรือกันอีกรอบมั้ย?\""
901010600460-45 = ""
901010600460-47 = ""
901010600460-49 = ""
901010600460-50 = "หืม? คุณครูก็มีอะไรที่อยากตรวจสอบเหมือนกันเหรอ?"
901010600460-51 = "[s] \"เปล่า ไม่ใช่เพราะเรื่องสืบสวนหรอก...\""
901010600460-52 = ""
901010600460-54 = ""
901010600460-55 = "[ns1] \"พอฟังเรื่องราวแล้ว ครูก็อยากไปดูท่าเรือด้วยตัวเองเหมือนกันน่ะ\"\n[ns2] \"แถวนั้นเหมือนจะมีร้านอร่อยๆ เยอะเลยนี่นา~\""
901010600460-56 = ""
901010600460-57 = ""
901010600460-59 = ""
901010600460-61 = "อืม ฉันก็ไม่รู้รายละเอียดมาก แต่ดูเหมือนว่า <อากิตะ ซีฟู้ด> ที่ฉันแวะไปมาวันแรกจะเป็นร้านเด็ดที่#nซ่อนอยู่พอตัวเลยค่ะ"
901010600460-62 = "หลังจากกลายเป็นกระแส ก็มีโพสต์รีวิวอาหารอร่อยๆ ในโซเชียลมีเดียทุกวันด้วยนะคะ"
901010600460-63 = "[s3] \"งั้นเราไปกินมื้อเช้าพรุ่งนี้ที่นั่นกัน ครูเลี้ยงเอง\"\n[s4] \"ไปสิ แล้วก็ไม่ต้องห่วงนะ ครูจะเป็นเจ้ามือเอง\""
901010600460-64 = ""
901010600460-65 = ""
901010600460-67 = ""
901010600460-68 = "ตะ... แต่จะให้คุณครูออกให้เราอีก คงไม่ได้..."
901010600460-69 = "โอ้ ถ้าเป็นมื้อเช้าฟรี ก็ไม่มีเหตุผลให้ปฏิเสธหรอก!"
901010600460-70 = "ในหนังสือคู่มือของ SRT ก็บอกไว้เหมือนกันว่าเราต้องจัดหาเสบียงจากแหล่งในท้องถิ่นให้มากที่สุด เพื่อเตรียมพร้อมสำหรับสภาวะที่เลวร้ายอย่างยิ่ง"
901010600460-71 = "แต่ฉันว่า มันไม่ได้หมายถึงให้ไปพึ่งคนอื่นหรอกนะ…"
901010600460-72 = "แต่ยังไงฉันก็เอาด้วย ตอนไปทำปฏิบัติการ ฉันต้องแฝงตัวจนไม่มีโอกาสได้ชิมของอร่อยในท่าเรือ#nอย่างจริงๆ จังๆ เลย"
901010600460-73 = ""
901010600460-75 = ""
901010600460-76 = "ถ้างั้น... ครั้งนี้ก็ขอรบกวนอีกนะคะ "
901010600460-77 = "[s] \"ยูกิโนะ\""
901010600460-78 = ""
901010600460-81 = ""
901010600460-82 = "คะ? มีอะไรเหรอคะ จู่ๆ ก็..."
901010600460-83 = "[s5] \"มีเรื่องที่อยากไปตรวจสอบที่ท่าเรือใช่มั้ย...?\"\n[s6] \"พรุ่งนี้หลังจากกินข้าว เราไปหากันนะว่ามีอะไรผิดปกติหรือเปล่า\""
901010600460-84 = ""
901010600460-85 = ""
901010600460-87 = ""
901010600460-88 = "สมกับเป็นคุณครู เข้าใจได้ไวจริงๆ ค่ะ"
901010600460-89 = "ทั้งที่การอ่อนไหวต่อความทุกข์ของผู้อื่นในโลกใบนี้ ก็ไม่ต่างจากการเดินบนเส้นทางที่เต็มไปด้วยความเจ็บปวดแท้ๆ"
901010600460-90 = "[s] \"หืม...? เมื่อกี้ว่าอะไรนะ?\""
901010600460-91 = "ไม่มีอะไรค่ะ ขอโทษค่ะ"
901010600460-92 = ""
901010600460-94 = ""
901010600460-96 = ""
901010600460-97 = "กองทหาร FOX ทุกคนทำได้ดีมาก"
901010600460-98 = "ถ้างั้น จนกว่าจะถึงช่วงเช้าวันพรุ่งนี้ ทุกคนพักผ่อนได้ตามอัธยาศัย"
901010600460-100 = ""
901010600460-101 = "รับทราบ!"
