[translation]
901010600460-6 = "So, to summarize what we've deduced so far..."
901010600460-7 = "\"The missing fisherman had a heavy debt.\""
901010600460-8 = "\"On the day of the incident, he took a train and escaped the port via the railroad.\""
901010600460-9 = "\"Many people, in the same manner as the fisherman, borrowed money from the Carpaccio Family.\""
901010600460-10 = "Ah, I think I see where this is going."
901010600460-11 = "The people who went missing around Kanesaki Port were actually debtors who owed money to the Carpaccio Family."
901010600460-12 = "Due to the high interest rates, some of the debtors couldn't repay their loans. So they chose to run."
901010600460-13 = "And, because they had to avoid getting caught by the Carpaccio Family, who are in charge of the port's access points, the debtors had to make it look like they went missing altogether."
901010600460-14 = "I agree with FOX 4."
901010600460-15 = "I see no other reason or method for people to suddenly vanish."
901010600460-16 = "The rumors made this sound so terrifying, but the truth turned out to be surprisingly simple."
901010600460-17 = "I think we are ready to submit our report to the General Student Council. We should request that the Treasurer's Office investigate any instances of improper debt-collection."
901010600460-18 = "[s] \"So... Case closed?\""
901010600460-19 = "For now, yes..."
901010600460-20 = "..."
901010600460-21 = ""
901010600460-23 = ""
901010600460-24 = "Is something on your mind, FOX 1?"
901010600460-25 = "I just think we're missing something important."
901010600460-26 = "[s] \"What in particular is bothering you?\""
901010600460-27 = "Nothing. There are no discrepancies with the information we've gathered."
901010600460-28 = "Everything is simple and clear... All the information points to an elegant conclusion."
901010600460-29 = "Perhaps it's intuition. But this conclusion came so easily that I feel as if...someone was leading us to it."
901010600460-30 = "If all this was only because of debts..."
901010600460-31 = "...Then why are \"crabs in a drum barrel\" constantly being mentioned?"
901010600460-32 = "It's so odd and deliberate. Someone must be spreading the story for a reason."
901010600460-34 = "What if it's...just because it sounds interesting?"
901010600460-35 = "There's no particular reason why some things go viral, after all."
901010600460-36 = "It's like trying to figure out why some annoying memes catch on."
901010600460-37 = "Like that round bird thing with the tongue. It's nothing special, but people go crazy for it."
901010600460-39 = "That's true, but..."
901010600460-40 = ""
901010600460-44 = "[ns] \"How about we all head to the port in the morning?\""
901010600460-45 = ""
901010600460-47 = ""
901010600460-49 = ""
901010600460-50 = "Hm? Why? Did you want to investigate something, Sensei?"
901010600460-51 = "[s] \"No, it's not because of that...\""
901010600460-52 = ""
901010600460-54 = ""
901010600460-55 = "[ns1] \"Your stories inspired me to visit.\"\n[ns2] \"It sounds like there's some good food there!\""
901010600460-56 = ""
901010600460-57 = ""
901010600460-59 = ""
901010600460-61 = "Hm, I don't know much about it personally, but Akita Seafood was apparently a hidden gem."
901010600460-62 = "Ever since it went viral, there has been nothing but praise for their food online."
901010600460-63 = "[s3] \"Then how about we get breakfast there?\"\n[s4] \"And don't worry about the price. It's my treat.\""
901010600460-64 = ""
901010600460-65 = ""
901010600460-67 = ""
901010600460-68 = "B-But Sensei, we can't trouble you again..."
901010600460-69 = "Oh. Who could say \"no\" to a free breakfast?"
901010600460-70 = "The SRT handbook teaches us to procure local food as much as possible, after all. You never know when you'll need the energy!"
901010600460-71 = "I don't think that means you should mooch off people..."
901010600460-72 = "But...I'm in. I never got to eat at the port, after all."
901010600460-73 = ""
901010600460-75 = ""
901010600460-76 = "In that case... We owe you once more, Sensei. "
901010600460-77 = "[s] \"Yukino.\""
901010600460-78 = ""
901010600460-81 = ""
901010600460-82 = "Yes? What about me?"
901010600460-83 = "[s5] \"...You're curious about the port, right?\"\n[s6] \"After we eat, we can look around.\""
901010600460-84 = ""
901010600460-85 = ""
901010600460-87 = ""
901010600460-88 = "Very astute, Sensei."
901010600460-89 = "Even though, in this world, being sensitive to the suffering of others is akin to walking a path paved with pain."
901010600460-90 = "[s] \"...Hm? What's that?\""
901010600460-91 = "Nothing. Excuse me."
901010600460-92 = ""
901010600460-94 = ""
901010600460-96 = ""
901010600460-97 = "Great work today, FOX Squad."
901010600460-98 = "Rest well until tomorrow morning."
901010600460-100 = ""
