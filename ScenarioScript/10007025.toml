[translation]
10007025-1 = "제2화;227호 온천장에 어서 오세요!"
10007025-5 = "온천장 입구"
10007025-8 = "이, 이게……"
10007025-9 = "이게 다 무엇이냐!"
10007025-10 = "[s] \"훌륭한 온천장이네.\""
10007025-11 = "가, 감탄하고 있을 때가 아니다, 콤라드!"
10007025-12 = "분명 구교사에는 온천장을 지을 재목은 커녕 땔감으로 쓸 나무조차도 부족했을 텐데, 어느 틈에 이리도 훌륭한 온천장을……."
10007025-19 = "하아…… 정말 좋은 탕이었네요."
10007025-20 = "게다가 이 앞에서 팔고 있는 병 밀크티의 맛도 정말 훌륭하네요. 한 수 배워가고 싶어질 정도예요."
10007025-21 = "다음 겨울에도 다시 방문해야겠어요."
10007025-26 = "붉은겨울 학원에도 이런 훌륭한 온천이 있었을 줄이야…… 놀랐는걸."
10007025-27 = "눈이 쌓여 있는 노천탕은 어쩐지 게헨나의 온천보다 운치가 좋은 것 같네."
10007025-31 = "게다가 다른 학교의 학생들까지 와 있잖아?!"
10007025-32 = "구교사를 관광명소로 만들어서 다른 학교의 학생을 초대하는 일 같은 건 허가한 적 없다고?!"
10007025-34 = "으음, 어쩐지 이 몸이 전에 심혈을 기울여 건설한 <흰 수염 유원지>보다 더 인기가 많은 것 같기도……"
10007025-35 = "으읏! 특별반 녀석들은 모두 어디에 있느냐? 모조리 숙청해주겠어!"
10007025-40 = "어머나, 소란스러워라. 온천장 앞에서 시끄럽게 떠드는 게 누구신가요? 점잖지 못하게끔."
10007025-41 = "아무리 온천장의 손님이시라 하더라도 영업에 방해가 된다면 강제로……."
10007025-45 = "으엑? 체리노 회장이랑 선생님?!"
10007025-46 = "이, 이, 이곳에는 무슨 일이신가요?"
10007025-47 = "[s1] \"안녕, 노도카. 예쁜 기모노네.\"\n[s2] \"새로 생긴 온천을 즐기러 왔어.\""
10007025-48 = "무슨 일인지 묻고 싶은 건 이쪽의 대사다!"
10007025-49 = "무슨 일인지 묻고 싶은 건 이쪽의 대사다!"
10007025-50 = "이 온천장은 다 무엇이냐! 구교사는 어떻게 된 것이냐?!"
10007025-51 = "어, 그게…… 그러니까……."
10007025-56 = "227호 온천장에 오신 것을 환영합니다, 체리노 회장님."
10007025-57 = "저희 227호 온천장에서 평소에 쌓였던 피로를 푸시고 즐겁게 돌아가시길 바랍니다."
10007025-58 = "말 돌리지 말고! 게다가 어느 틈에 동아리 이름을 227호 온천장으로 바꾼 거야?"
10007025-59 = "어차피 227호 특별반도 인가되지 않은 동아리니, 저희가 이름으로 무엇을 쓰는지는 상관없잖아요?"
10007025-60 = "저희는 더 이상 패배주의에 젖은 특별반의 정학생이 아니에요!"
10007025-61 = "이곳에서 온천을 운영하게 되면서 저희의 삶은 크게 달라졌답니다."
10007025-62 = "키보토스 곳곳에서 찾아오신 손님들 덕분에 가난에 허덕일 일도 없어졌죠."
10007025-63 = "예전에는 푸딩은 커녕 식사 빵의 숫자를 걱정해야 하는 처지였지만……."
10007025-64 = "지금은 식사 때마다 푸딩을 두 개나 사 먹을 수 있을 정도로 부유해졌답니다!"
10007025-65 = "푸, 푸딩을 두 개나?!"
10007025-66 = "[s] \"그게 그렇게 대단한 일이야……?\""
10007025-67 = "물론이에요. 붉은겨울 학원에서 식사 때마다 푸딩을 두 개씩 먹을 수 있는 건 체리노 회장 이외에는 없었으니까요."
10007025-68 = "게다가 더 먼 거리를 관측할 수 있도록, 망원경의 신형 렌즈도 잔뜩 구입했답니다!"
10007025-69 = "그리고 또…… 또 무얼 했더라……."
10007025-70 = "아아~ 이제는 돈이 너무 넘쳐나서 곤란할 지경이네요. 후후……."
10007025-75 = "우읏…… 용납할 수 없어……."
10007025-76 = "반성을 하라고 구교사에 보내 놓았더니, 이런 부르주아 같은 호화 생활을 누리고 있었다니, 이는 절대로 용납할 수 없는 일이야!"
10007025-77 = "숙청이다! 지금 바로 <숙청군 1호>로 이 온천장을 싹 다 철거해주겠어!"
10007025-78 = "자, 잠깐만요! 그것만큼은 참아주세요!"
10007025-79 = "모처럼 오랜 고생 끝에 누리게 된 작은 호사인데, 그런 이유로 온천을 철거하는 건 너무해요!"
10007025-80 = "……따지고 보면 저희가 온천장을 운영한다고 해서 체리노 회장과 사무국에 피해가 가는 것도 아니잖아요?"
10007025-81 = "그, 그건 그렇지만……."
10007025-82 = "그래도 안 돼! 아무리 피해가 없다지만, 일개 학생이 이런 호화로운 생활을 누리도록 방치한다면 서기장으로서의 권위가 서질 않는다고!"
10007025-83 = "으음. 이 방법은 쓰고 싶지 않았지만……."
10007025-88 = "시구레 쨩, '그걸' 가져와."
10007025-90 = "무, 무엇이냐? 이 몸에게 심한 짓을 할 생각이냐?!"
10007025-96 = "체리노 회장을 위해 준비한 특제 <수염 온천 만쥬>야."
10007025-97 = "음? 뇌물인가?"
10007025-98 = "수염이 그려져 있다고는 하지만, 고작 온천 만쥬 따위로 이 몸을 회유하려 하다니…… 이래서 특별반의 가난뱅이들은 어쩔 수가 없군."
10007025-99 = "후후, 맛을 보면 생각이 달라질걸?"
10007025-100 = "온천에서 먹는 흔한 만쥬 따위가 맛있을 리가……."
10007025-108 = "뭐, 뭐냐? 이 달콤한 맛은!"
10007025-109 = "폭신하고 쫄깃한 빵과 촉촉하고 부드러운 앙금의 조화가…… 참을 수가 없군!"
10007025-110 = "온천 수익으로 번 돈이 남기에 비싼 재료를 잔뜩 구입해서 최고급 만쥬를 만들어봤지!"
10007025-111 = "키보토스 각지의 미식가들에게 보장받은 물건인 만큼 맛은 확실할거야."
10007025-112 = "어떠신가요, 체리노 회장?"
10007025-113 = "온천장 운영을 모른 척 해주신다면 무료 입욕권과 함께 이 온천 만쥬를 원하는 만큼 드시게 해 드릴게요!"
10007025-114 = "……어흠. 어쩔 수 없군. 이렇게 성의를 보이는 데 모르는 체를 할 수도 없고."
10007025-115 = "절대로 온천 만쥬가 탐나서 이러는 게 아니니까!"
10007025-117 = "잠시만요. 아무리 체리노 회장님이 모른척해 주신다고 하셨지만, 이 온천장은 사무국의 허가를 받지 않은 불법 건축물입니다."
10007025-118 = "그렇다. 붉은겨울 학원의 풍기와 사무국의 권위를 위해서 이런 불법 건축물은 바로—"
10007025-123 = "토모에 님. 저희 온천장에는 여러 사람이 함께 들어갈 수 있는 대형 욕탕도 있답니다."
10007025-124 = "체리노 회장의 목욕하는 모습을 바로 옆에서 지켜볼 수 있는 기회인데…… 토모에님도 함께 입욕을 하는 건 어떠신가요?"
10007025-125 = "체, 체리노 님과 함께 목욕을……?"
10007025-126 = "아, 그러고 보니 저쪽에 있는 노천탕에는 곰들이 자주 목욕을 하러 오던데……."
10007025-127 = "푹신푹신한 털을 가진 곰과 함께 노천탕을 즐긴다면 분명 즐겁겠지……."
10007025-128 = "푹신푹신한 곰과 함께 목욕을……?"
10007025-129 = "어흠. 어, 어쩔 수 없겠네요. 생각해보니 붉은겨울 학원에 온천장이 하나쯤 있는 건 괜찮을지도 모르겠고……."
10007025-130 = "흠, 흠. 보안위원들의 청결을 위해서라면 목욕 시설은 필수지."
10007025-131 = "……절대로 곰이 들어온다는 노천탕이 궁금해서 그러는 건 아니니까!"
10007025-132 = "네! 그럼 붉은겨울 사무국에서 오신 손님 세 분, 안내하겠습니다!"
10007025-133 = "탈의실은 이쪽으로……."
10007025-137 = "후우…… 간신히 불청객을 쫓아내는 데 성공했네요."
10007025-138 = "서, 서, 선생님이 불청객이라는 뜻은 아니니까요!"
10007025-139 = "오히려 방문해주셔서 기뻐요!"
10007025-140 = "[s3] \"멋진 온천이네.\"\n[s4] \"구교사에 온천이 생겨서 다행이야.\""
10007025-141 = "네, 덕분에 구교사에 머물 때보다 더 바빠지기는 했지만…… 그래도 그동안 해보고 싶었던 일들을 잔뜩 할 수 있게 되었어요."
10007025-142 = "네, 덕분에 구교사에 머물 때보다 더 바빠지기는 했지만…… 그래도 그동안 해보고 싶었던 일들을 잔뜩 할 수 있게 되었어요."
10007025-143 = "비싼 간식을 마음껏 먹거나, 망원경의 낡은 렌즈를 새로 구입하거나……"
10007025-144 = "목욕탕 관리를 핑계로 다른 학교의 학생들이 목욕하는 모습을 지켜보거나……"
10007025-145 = "……앗!"
10007025-146 = "바, 방금 그 이야기는 못들은 걸로 해주세요!"
10007025-147 = "[s] \"……정말 괜찮은 거지, 이 목욕탕?\""
10007025-148 = "무, 물론이에요. 227호 온천장은 언제나 손님 여러분의 편의를 최우선으로 생각하고 있답니다."
10007025-157 = "자, 여기 온천 가운을 받으세요."
10007025-158 = "지배인의 권한으로 선생님께는 특별히 혼자서 즐기실 수 있는 전용 온천을 제공해드릴게요."
10007025-159 = "부디 느긋하게~ 오랫동안~ 목욕을 즐기고 나와주세요!"
10007025-160 = "……하아, 하아……."
10007025-167 = "(노도카의 수상쩍은 시선을 뒤로 하며 노천탕으로 향했다…….)"
