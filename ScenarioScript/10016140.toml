[translation]
10016140-1 = "후일담;엔지니어부 & 베리타스 편"
10016140-6 = "아, 치히로 선배!"
10016140-10 = "경기에 쓰였던 마지막 로봇까지 완전히 반납된 걸 방금 확인하고 오는 길이었어."
10016140-11 = "로봇 프로그램의 무결성 검사는 하레 선배가 진행하고 있고, 경기 기록 내역은 매크로가 자동으로 정리하고 있으니……"
10016140-12 = "이것으로 세미나에서 부탁받았던 업무도 모두 끝이야!"
10016140-13 = "수고 많았어, 마키."
10016140-14 = "모처럼의 축제인데 마지막까지 일손을 돕게 한 것 같아서 미안하네."
10016140-15 = "아니야. 나도 틈틈이 경기에도 참가하고 여기저기 그림을 그리며 축제를 만끽했는걸."
10016140-16 = "세상을 조금이나마 더 화려하게 만들 수 있어서, 정말 즐거웠어!"
10016140-17 = "그렇다면 다행이지만."
10016140-18 = "그나저나, 아까 열린 기마전 경기에서는 밀레니엄 학원의 어느 학생이 홀로그램 장치를 경기에 가져와서 논란이 된 모양이던데……"
10016140-22 = "상대 학원 측에서 설명한 그 홀로그램 기기의 모습이 하레의 <아테나 3호>와 꼭 닮은 것처럼 느껴져서 말이야."
10016140-23 = "혹시 마키 너, 아는 거 없—"
10016140-24 = "아앗, 그러고 보니 깜박했었네! 코타마 선배가 설치한 도청기를 같이 회수하러 가기로 했었는데……"
10016140-26 = "서, 선배. 나는 급한 일이 떠올라서 먼저 가볼게……!"
10016140-31 = "역시 우리 후배들 짓이었나……"
10016140-32 = "부실에 돌아오면 나중에 따끔하게 한마디 해 둬야겠어."
10016140-36 = "치히로, 마무리 작업은 잘 되어가고 있어?"
10016140-37 = "응, 후배들이 도와준 덕분에."
10016140-38 = "그러는 그쪽도 관중의 퇴장 안내는 다 끝난 거야?"
10016140-39 = "음, 물론이야. 주최교의 응원단장을 맡고 있는 몸으로서, 대회가 끝날 때까지 맡은 바 임무를 다해야지."
10016140-40 = "그러니까 처음부터 제대로 된 응원 로봇을 만들었다면 좋았었잖아."
10016140-41 = "응? 불평을 하고 있던 게 아니었는데?"
10016140-42 = "갑작스럽게 맡게 된 응원단 임무였지만, 평소의 직책이나 임무에서 벗어나 다른 역할을 맡아보는 것은 내게도 굉장히 새롭고 즐거운 경험이었어."
10016140-43 = "어찌나 즐거웠는지, 평소와는 달리 하루가 너무 짧게 느껴졌다니까."
10016140-44 = "이제는 다시 평소처럼 엔지니어부의 마이스터로 돌아갈 시간인가…… 아쉬워라~"
10016140-45 = "아쉬워하는 걸 보니 퍽 재미있게 즐긴 모양이네."
10016140-49 = "치 쨩, 오늘 축제는 즐거웠어?"
10016140-50 = "즐겁고 자시고…… 나는 온종일 정신이 없었던 탓에 하루가 어떻게 지나갔는지도 모르겠어."
10016140-51 = "어제 밤새도록 개최 준비를 한 데 이어서, 오늘은 개회식부터 크고 작은 소동이 잇달아 터지는 바람에……"
10016140-52 = "구호소에서 잠깐 눈을 붙이고 돌아오기 전까지는 무슨 일이 있었는지도 기억이 희미할 정도야."
10016140-53 = "……우타하 너는 어제도 함께 철야를 했으면서, 피곤하지도 않은 거야?"
10016140-54 = "음. 사실은 지금이라도 침대에 바로 누우면 기절할 것처럼 피곤하긴 하지만……"
10016140-55 = "이 정도는 기합과 근성으로 이겨낼 수 있어!"
10016140-56 = "대단한 정신력을 지닌 건지, 아니면 오히려 바보인 건지……"
10016140-57 = "그나저나, 내가 잠들어 있는 동안 엔지니어부에서 만든 그 '응원 로봇'이 또 문제를 일으킨 모양이던데……"
10016140-62 = "……다시 한번 묻는 것이지만, 너는 무슨 생각으로 응원 로봇에 전투 모드를 넣어둔 거야?"
10016140-63 = "그야 당연히……"
10016140-65 = "로망이니까."
10016140-66 = "로망으로 끝날 문제가 아니야. 그 기능 때문에 SRT 특수학원에서도 조사가 들어왔다고!"
10016140-67 = "너는 진짜—"
10016140-73 = "……아니다. 네가 이런 잔소리로 그만둘 사람이었다면 이미 예전에 그만뒀겠지."
10016140-74 = "후후, 역시 내 오랜 친구답네. 판단이 빨라."
10016140-79 = "여하튼 이런저런 사정으로 인해 이번에는 제대로 활약하진 못했지만…… 그래도 후배들만큼은 충분히 즐긴 것 같아서 다행이야."
10016140-80 = "아무리 대부분의 해커가 인도어파라고는 하지만, 우리 부원들은 너무 운동을 하지 않아서 건강이 걱정될 정도였으니까."
10016140-81 = "거기에 더해 다른 학원의 학생들과 교류하고, 다양한 환경에서 경쟁하는 대운동회의 경험은 지식의 폭을 넓히는 데 도움이 되겠지."
10016140-82 = "음, 그 생각은 나도 동감이야."
10016140-83 = "세상에는 책이나 영상이 아니라, 몸으로만 체득할 수 있는 지식도 있는 법이니까."
10016140-87 = "그보다 새로운 경험이라고 하니, 갑자기 떠오른 것인데……"
10016140-91 = "치히로도 치어리딩 한 번 해보지 않을래?"
10016140-92 = "……갑자기?"
10016140-93 = "응. 이번에 다 함께 응원을 하니 생각보다 꽤 즐거워서, 주변에도 권하고 싶어졌거든."
10016140-94 = "치어리더 의상은 히비키에게 부탁하면 금방 만들어 줄 테고……"
10016140-95 = "게다가 아까 말했던 것처럼 이 열정과 경험이 새로운 코드를 짜는 데 도움이 될지도 모르잖아."
10016140-96 = "됐어. 다른 체육 활동이라면 몰라도 치어리딩은……"
10016140-100 = "……아, 혹시 불규칙한 업무로 생긴 군살을 신경 쓰고 있는 거야?"
10016140-101 = "걱정하지 마. 다른 사람의 체형을 그렇게 눈여겨보는 사람은 많지 않다고."
10016140-102 = "게다가 이번에 알게 된 것인데 '그쪽'의 수요도 생각보다 적지 않은 모양이고……"
10016140-103 = "살 때문에 그러는 게 아니거든?!"
10016140-104 = "뭐 어때. 그리고 옛말에 이런 말도 있잖아."
10016140-106 = "부끄러워하면 지는 거라고!"
10016140-107 = "……그런 말도 없다고!"
