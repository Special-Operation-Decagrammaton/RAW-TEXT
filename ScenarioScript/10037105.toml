[translation]
10037105-3 = "으, 으윽……?!"
10037105-9 = "흠, 간단하구나! 토모에 비서실장도 마리나 위원장도, 수고 많았다!"
10037105-10 = "감사합니다. 체리노 서기장님."
10037105-11 = "다치신 곳은 없나요. 선생님?"
10037105-12 = "[s] \"응. 토모에와 마리나 덕분에 끄떡없었어.\""
10037105-13 = "조금은 조마조마했지만, 다행이군."
10037105-14 = "그나저나 이 정도로 연약한 쿠데타라니…… 쿠데타의 기초를 가르쳐 줄 수 있다면 그렇게 하고 싶을 정도인데."
10037105-15 = "마리나 위원장? 화장실 청소, 아직 부족한가요?"
10037105-19 = "아, 아닙니다! 실언이었습니다. 토모에 비서실장님!"
10037105-20 = "말이 나온 김에 묻도록 하죠. 쿠데타는 기본적으로 막을 수 없는 것이지만, 그래도 쿠데타를 예방하기 위해서는 어떻게 해야 할까요?"
10037105-21 = "체리노 회장님보다 위대한 학생을, 모두 227호 특별반으로 보내 버리면 됩니다!"
10037105-22 = "명답이군요. 그리고 체리노 서기장님보다 위대한 학생은?"
10037105-23 = "원칙적으로 아무도 없습니다!"
10037105-24 = "아주 좋아요."
10037105-31 = "현룡문, 집합!"
10037105-36 = "?!"
10037105-37 = "미나 집행부장……!"
10037105-43 = "너희들이 어떤 생각을 품었든, 지금은 묻지 않겠다. 어떤 행동을 하려 했든, 아니면 이미 했든, 지금은 상관하지 않겠다!"
10037105-44 = "움직일 수 있는 자는 움직여라! 경극부를 연행하고, 문주님과 방문객 여러분을 육화각까지 호위한다!"
10037105-49 = "네, 넷!"
10037105-50 = "알겠습니다!"
10037105-54 = "(그렇지만……. 문주님의 의향은 대체 무엇일까…….)"
10037105-55 = "(지금까지는 이런 생각, 해 본 적도 없었는데…….)"
10037105-62 = "(이 한 몸이 잡혀 들어가는 것은, 아무래도 좋은 일이다.)"
10037105-63 = "(성공과 실패는, 충의(忠義)의 길에 포함되어 있지 않으니.)"
10037105-64 = "(그러니 부디, 문주님께서 다시 한번 눈을 뜨시기를…….)"
