[translation]
34210-1 = "제21화;돌파"
34210-4 = "하아…… 하아……."
34210-12 = "[ns] \"미카!! 괜찮아?\""
34210-13 = "……."
34210-14 = "……저 녀석들은 내가 유인할게."
34210-18 = "사오리……, 네가 아츠코를 구하려고 이렇게 집착하는 이유를 알 것 같아……."
34210-19 = "알아…… 나도 그랬으니까. 그러니까……."
34210-20 = "저 녀석들을 내가 유인할 테니, 아츠코를 구하러 가."
34210-21 = "선생님……. 미안해. 늘 말썽만 부려서……. 문제만 일으키는 불량 학생이라서……."
34210-22 = "그치만…… 고마워. 나에게도 다음 기회가 있다고 말해줘서……."
34210-23 = "너는……."
34210-24 = "뭘 꾸물거리는 거야, 사오리! 선생님을 데리고 포위를 뚫어!! 시간이 없잖아?!"
34210-28 = "……그래. 알겠어."
34210-29 = "[s] \"미카, 조심해…….\""
34210-30 = "……응, 선생님. 걱정하지 마, 알잖아? 나는 꽤 강하다는 거."
34210-44 = "……."
34210-45 = "……정말이지 제멋대로인 여자네."
34210-46 = "그래……. 서두르자."
