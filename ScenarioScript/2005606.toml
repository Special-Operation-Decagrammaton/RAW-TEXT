[translation]
2005606-1 = "受疼愛的孩子"
2005606-2 = "（接到聯絡不久後，小雪一臉著急地來到夏萊）"
2005606-5 = "老師～！！我來了！！"
2005606-6 = "呼～總算撿回一條命了！#n剛才簡直是場賭上性命的追逐戰啊！"
2005606-7 = "咦？問我發生什麼事了？"
2005606-8 = "你聽我說，老師！#n前輩們剛才打算把我綁起來耶！"
2005606-9 = "要不是我看準時機溜了出來，真的會被綁在床上的！#n就是字面上的意思！物理意義上的綁在床上！！"
2005606-10 = "[s1] 「綁在床上……？」\n[s2] 「你又做了什麼好事……」"
2005606-13 = "吼唷～真是的！我什麼都沒做啦！這次真的什麼都沒做！！"
2005606-14 = "全世界都在欺負我，這麼冤枉的事……！"
2005606-15 = "這種遭遇……！"
2005606-20 = "……哈啾！！"
2005606-22 = "[ns3] 「哈啾……？」\n[ns4] 「……你感冒了嗎？」"
2005606-25 = "咦？啊，嗯。好像是有一點那種感覺。"
2005606-26 = "不對，現在重要的不是這個！#n老師，我剛才差點像精神病房的危險隔離對象一樣被綁起來耶……！？"
2005606-27 = "……嗯？"
2005606-28 = "……老師怎麼突然露出那種表情？"
2005606-29 = "都感冒了還想出門亂跑……？#n這，這個嘛……"
2005606-30 = "哎呀，沒關係啦！#n我的身體我自己最清楚！！"
2005606-34 = "……咦？"
2005606-35 = "研討會的制服？#n……被前輩們拿走了。"
2005606-36 = "工作……？#n沒有耶，今天也沒有特別叫我做什麼事啊？"
2005606-37 = "他們反而是把我關在房間裡，什～麼事都不讓我做！#n那種感覺簡直就像牢房一樣！！"
2005606-38 = "[s5] 「……原來如此，是這麼回事啊。」\n[s6] 「嗯，我完全明白了。」"
2005606-41 = "……那是什麼反應？讓人很不安耶。"
2005606-42 = "難道說……"
2005606-43 = "老，老師……！你該不會要把我送回研討會吧……！！"
2005606-47 = "啊，絕對不會是嗎……？#n尼哈哈哈！！那就好！幸好只是我想太多了！"
2005606-48 = "……嗯？你說什麼？"
2005606-49 = "要我去夏萊的休息室待著？"
2005606-50 = "在那邊玩遊戲吃零食，好好放鬆一下……？#n真，真的可以嗎……？"
2005606-54 = "……認真？"
2005606-55 = "[s7] 「如果有人來的話，我會幫你應付的。」\n[s8] 「躲在這裡應該是最安全的吧？」"
2005606-61 = "尼哈哈哈哈！！那真是太好了，老師！#n能受到這麼好的待遇，老實說有點意外呢！"
2005606-62 = "那我就恭敬不如從命……"
2005606-63 = "去那邊好好玩耍囉！！呀呼～！！"
2005606-69 = "（……之後聯絡研討會說明小雪的情況，告訴他們不用擔心）"
2005606-70 = "（一段時間後，帶著「應該差不多了」的心情前往了休息室）"
2005606-76 = "唔……尼哈……尼哈哈……"
2005606-77 = "再見了，世界……拿著這筆中獎的獎金，從今以後我就……尼哈……尼哈哈哈……"
2005606-81 = "……哈啾！！"
2005606-82 = "呼喵……嘶……！呼……！！"
2005606-83 = "尼哈……尼哈哈哈……"
2005606-86 = "[ns9] 幫小雪打開暖氣並蓋上被子\n[ns10] 在小雪的額頭上放上冰袋"
2005606-93 = "（之後也一直照顧著睡著的小雪，直到感冒的症狀有所好轉）"
2005606-94 = "（……隔天早上，收到了研討會傳來的擔心和感謝的訊息）"
