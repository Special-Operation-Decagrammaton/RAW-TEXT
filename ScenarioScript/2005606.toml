[translation]
2005606-1 = "Beloved Child"
2005606-2 = "As soon as I put my phone down, Koyuki was banging on the door to my office at Schale."
2005606-5 = "Sensei!! I'm here!!"
2005606-6 = "*huff* *puff* Thank goodness! Let me catch my breath. That escape was a matter of life or death, I'm telling you!"
2005606-7 = "Huh? What happened?"
2005606-8 = "You won't believe it, Sensei! Those mean old upperclassmen wanted to truss me up like a rabbit!"
2005606-9 = "Good thing I'm a pro at sensing danger! If not, I probably would be helplessly tied down to my bed right now! I'm not even exaggerating!"
2005606-10 = "[s1] \"Tied to your bed...?\" \n[s2] \"What did you do now...?\""
2005606-13 = "You hear that I'm being tied up and you're blaming ME?! I seriously didn't do anything this time!"
2005606-14 = "Ugh! Life is so unfair! Why is everyone out to get me!"
2005606-15 = "Why—"
