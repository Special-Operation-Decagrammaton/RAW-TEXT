[translation]
2005606-1 = "เด็กที่ถูกเอ็นดู"
2005606-2 = "(หลังจากคุณครูได้รับการติดต่อไปไม่นาน โคยูกิก็มาถึงชาเล่ต์ด้วยสีหน้าตื่นตระหนก)"
2005606-5 = "คุณครู!! ฉันมาแล้วค่ะ!!"
2005606-6 = "เฮ้อ ค่อยยังชั่วหน่อย! เมื่อกี้เกือบจะเป็นการไล่ล่าที่ต้องเดิมพันด้วยชีวิตเลยละค่ะ!"
2005606-7 = "คะ? มีเรื่องอะไรเหรอคะ?"
2005606-8 = "ฉันจะเล่าให้ฟังค่ะ คุณครู! พวกรุ่นพี่พยายามจะมัดฉันเอาไว้น่ะสิคะ?!"
2005606-9 = "ถ้าฉันไม่ไหวตัวทันแล้วหนีออกมาก่อน ก็คงจะถูกมัดเอาไว้กับเตียงจริงๆ แล้วละค่ะ อย่างที่บอกเลยค่ะ มัดกับเตียงจริงๆ นะคะ!!"
2005606-10 = "[s1] \"มัดกับเตียงเหรอ...?\"\n[s2] \"ไปทำอะไรมาอีกล่ะ...\""
2005606-13 = "โอ๊ย~!! จริงๆ เลย! ฉันไม่ได้ทำอะไรเลยสักหน่อยค่ะ! คราวนี้ฉันไม่ได้ทำอะไรเลยจริงๆ นะคะ!!"
2005606-14 = "โลกนั่นแหละที่ชอบรังแกฉัน ไม่ยุติธรรมเอาซะเลย...!"
2005606-15 = "ไหน...!"
2005606-20 = "ฮัดชิ่ว...!!"
2005606-22 = "[ns3] \"ฮัดชิ่ว...?\"\n[ns4] \"คัดจมูกเหรอ? ไม่สบายรึเปล่า?\""
2005606-25 = "คะ? อ่า ค่ะ ฉันไม่สบายนิดหน่อยค่ะ"
2005606-26 = "เดี๋ยวสิ ตอนนี้เรื่องนั้นมันสำคัญตรงไหนคะ คุณครู เมื่อกี้ฉันเกือบถูกจับมัดติดกับเตียงเหมือน#nคนไข้จิตเวชในโรงพยาบาลเลยนะคะ..."
2005606-27 = "...? หืม?"
2005606-28 = "คุณครู...? ทำไมทำหน้าแบบนั้นล่ะคะ?"
2005606-29 = "ฉันกำลังวางแผนจะออกไปข้างนอกทั้งที่ไม่สบายอยู่... รึเปล่าน่ะเหรอคะ? เอ่อ คือเรื่องนั้น..."
2005606-30 = "เดี๋ยวสิ มันไม่เห็นเป็นอะไรเลยนะคะ? ร่างกายฉัน ฉันย่อมรู้จักดีที่สุดค่ะ!!"
2005606-34 = "คะ...?"
2005606-35 = "ชุดนักเรียนของเซมิน่า...? โดนรุ่นพี่เอาไปแล้วละค่ะ"
2005606-36 = "งานเหรอคะ? ก็ไม่นะคะ...? วันนี้รุ่นพี่ไม่ได้สั่งงานอะไรเลยค่ะ"
2005606-37 = "ตรงกันข้าม วันนี้พวกเขาขัดขวางไม่ให้ฉันทำอะไรสักอย่างเลยค่ะ! เหมือนโดนขังเดี่ยวเลย!!"
2005606-38 = "[s5] \"อย่างนี้นี่เองสินะ...\"\n[s6] \"อื้อ ก็คงต้องทำแบบนั้นละ ครูพอจะเข้าใจแล้ว\""
2005606-41 = "...? ทำไมพูดอะไรแบบนั้นล่ะคะ? ชักกังวลแล้วสิ"
2005606-42 = "หรือว่า..."
2005606-43 = "คะ... คุณครู...! ฉันอุตส่าห์หนีมาที่นี่แล้ว คงไม่จับฉันไปขายให้ทางเซมิน่าหรอกนะคะ...!!"
2005606-47 = "อ่า ไม่ใช่อย่างนั้นเหรอคะ? วะฮ่าฮ่า!! แค่นั้นก็พอแล้วละค่ะ! ฉันคงคิดมากไปเองสินะคะ!"
2005606-48 = "หืม...? ว่าไงนะคะ?"
2005606-49 = "ให้ฉันอยู่ที่ห้องพักผ่อนชาเล่ต์แทนงั้นเหรอคะ?"
2005606-50 = "ให้ไปนอนเล่น กินขนม เล่นเกมที่นั่น...? ทะ... ทำแบบนั้นได้จริงๆ เหรอคะ? อืม....?"
2005606-54 = "พูดจริงเหรอคะ...?"
2005606-55 = "[s7] \"ถ้ามีคนตามมา ครูจะหาข้อแก้ตัวให้เอง\"\n[s8] \"หลบอยู่ที่นี่ปลอดภัยที่สุดแล้วละ\""
2005606-61 = "วะฮ่าฮ่าฮ่า!! เยี่ยมเลยค่ะ คุณครู! คิดไม่ถึงเลยค่ะว่าจะได้รับการช่วยเหลือแบบนี้!"
2005606-62 = "ถ้างั้นฉันจะทำตามที่คุณครูบอก..."
2005606-63 = "จะไปเล่นให้หนำใจเลยค่ะ!! ยะโฮ่~!!"
2005606-69 = "(จากนั้นคุณครูก็ติดต่อไปที่เซมิน่าและเล่าเรื่องของโคยูกิให้ฟังเพื่อที่ทุกคนจะได้ไม่ต้องเป็นห่วง...)"
2005606-70 = "(หลังจากนั้นสักพักใหญ่ คุณครูก็คิดว่าน่าจะถึงเวลาแล้วจึงเดินไปที่ห้องพักผ่อน)"
2005606-76 = "ฟี้.... ฟี้... งืมมม..."
2005606-77 = "ลาก่อนนะ โลกใบนี้... ฉันจะใช้เงินรางวัลนี้... ฮ่าฮ่า... วะฮ่าฮ่าฮ่า..."
2005606-81 = "ฮัดชิ่ววว!!"
2005606-82 = "งืมๆ... ซู้ด! ฮึก!!"
2005606-83 = "วะฮะ... วะฮ่าฮ่าฮ่า..."
2005606-86 = "[ns9] เปิดเครื่องทำความร้อนและห่มผ้าให้\n[ns10] วางเจลเย็นบนหน้าผากโคยูกิ"
2005606-93 = "(หลังจากนั้นคุณครูก็คอยดูแลโคยูกิกระทั่งอาการของเธอดีขึ้น)"
2005606-94 = "(และพอถึงตอนเช้า ทางเซมิน่าก็ส่งข้อความแสดงความกังวลและขอบคุณมาให้คุณครูรัวๆ...)"
