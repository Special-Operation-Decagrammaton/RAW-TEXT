[translation]
2005606-1 = "受疼愛的孩子"
2005606-2 = "（接到聯絡後不久，小雪一臉著急地來到夏萊）"
2005606-5 = "老師～！！救救我！！"
2005606-6 = "呼～終於可以鬆口氣了……剛才簡直是拼命逃亡啊！"
2005606-7 = "咦？問我什麼事嗎？"
2005606-8 = "聽我說啊老師！前輩們想把我綁起來！？"
2005606-9 = "要不是趁機溜出來的話，真的會被綁在床上啊。就是字面上的意思。物理意義上！！"
2005606-10 = "[s1] 「綁在床上……？」\n[s2] 「你又做了什麼……」"
2005606-13 = "我什麼都沒做啊！這次真的什麼都沒做！！"
2005606-14 = "全世界都在欺負我，這麼冤枉的事……！"
2005606-15 = "這種遭遇──！"
2005606-20 = "……哈啾！！"
2005606-22 = "[ns3] 「哈啾……？」\n[ns4] 「……你感冒了嗎？」"
2005606-25 = "咦？啊，嗯。好像是有點那個跡象。"
2005606-26 = "不，現在重要的不是這個。#n老師，我剛才差點像精神病房的危險隔離對象一樣被綁起來……！？"
2005606-27 = "……嗯？"
2005606-28 = "……老師？怎麼突然那種表情。"
2005606-29 = "感冒了還想出門……嗎？嗯，那個……"
2005606-30 = "不是沒什麼區別嗎？我的身體我最清楚！！"
2005606-34 = "……咦？"
2005606-35 = "研討會的制服嗎？……那個被前輩們拿走了。"
2005606-36 = "工作嗎？……不？今天沒有交給我什麼工作。"
2005606-37 = "反而是什麼都不讓我做把我關在房間裡！像牢房一樣！！"
2005606-38 = "[s5] 「……原來如此。是這麼回事啊。」\n[s6] 「嗯。我完全明白了。」"
2005606-41 = "……？那是什麼反應？讓人很不安耶。"
2005606-42 = "難道……"
2005606-43 = "老，老師……！都到這裡來了還要把我送回研討會……！！"
2005606-47 = "啊，絕對不會那樣嗎？尼哈哈哈！！那就好！白擔心了！"
2005606-48 = "……嗯？你說什麼？"
2005606-49 = "可以去夏萊的休息室待著嗎？"
2005606-50 = "去玩遊戲吃零食玩一玩……可以嗎？"
2005606-54 = "……真的嗎？"
2005606-55 = "[s7] 「如果有人來我會幫你應付的。」\n[s8] 「躲在這裡應該是最安全的吧？」"
2005606-61 = "尼哈哈哈哈！！好啊老師！能受到這樣的恩惠，老實說有點意外！"
2005606-62 = "那我就不客氣地……"
2005606-63 = "……去那邊玩了！！耶呼～！！"
2005606-69 = "（……之後聯繫了研討會，說明了小雪的情況讓他們不用擔心）"
2005606-70 = "（又過了一段時間，覺得差不多了就去了休息室）"
2005606-76 = "嗚……尼哈……尼哈哈……"
2005606-77 = "再見了，世界……拿著這筆中獎彩金，從今以後我……尼哈……尼哈哈哈……"
2005606-81 = "……哈啾！！"
2005606-82 = "呼嗯……嘶──！呼──！！"
2005606-83 = "尼哈……尼哈哈哈……"
2005606-86 = "[ns9] 打開暖氣幫他蓋上被子\n[ns10] 在額頭上放上冰袋"
2005606-93 = "（之後一直觀察情況，照顧睡著的小雪直到感冒好轉）"
2005606-94 = "（……到了早上，收到了研討會傳來的擔心和感謝的訊息）"
