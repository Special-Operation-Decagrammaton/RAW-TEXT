[translation]
10026010-1 = "제1화;일반인 A의 의견"
10026010-2 = "<지금까지의 이야기>"
10026010-7 = "이번에 트리니티 발굴지구에서 새롭게 발견된……. 아주 중요한 역사적인 경전이에요."
10026010-8 = "저는 이 경전을 보관하고 있다가……."
10026010-13 = "……어라?"
10026010-18 = "고서 복원에 관한 이야기로 찾아오셨다고요. 오래된 책이라도 발굴하신 건가요……?"
10026010-24 = "으아아아아아아-!?"
10026010-29 = "물이끼 아교. 그리고 <정성약>이 필요해요."
10026010-30 = "구해만 와 주신다면……. 이후에는 저도 어떻게든 해볼게요. 복원 작업……."
10026010-36 = "……완성이에요. 경전 복원본."
10026010-37 = "그냥 이건 넘겨드릴게요……. 선생님께서 나중에 전달해 주세요."
10026010-43 = "선생님……. 출발한 지도 좀 되셨으니, 이제 슬슬 샬레에 도착하셨으려나……."
10026010-44 = "……슬슬 괜찮겠지."
10026010-49 = "후후……. 그 경전의 완벽한 복사본……. 몰래 만들어 두느라 고생했지만……."
10026010-50 = "이전부터 궁금했거든요. 비밀이 가득한 시스터후드."
10026010-52 = "……저도 한번 읽어보도록 하겠습니다."
10026010-58 = "<현재>"
10026010-61 = "설마 모르는 일이라고 하진 않으시겠지요. 덕분에 저희가 이런 '대화'를 나누고 있으니."
10026010-65 = "……'대화'……?"
10026010-66 = "사람을 이런 곳에 '납치'해 놓고 잘도 그런 표현을……."
10026010-70 = "납치……? 뭔가 오해하고 있는 것 같은데……"
10026010-71 = "저희는 우이 씨를 납치한 게 아니에요. 말씀드렸듯, 그저 잠깐 이야기를 나누고 싶어서 모셔 온 것뿐."
10026010-72 = "이렇게 우르르 몰려와서 잠깐 이야기를 나누자니, 그걸 보통은 납치라고 한다고."
10026010-73 = "시스터후드…… 그 비밀투성이 신비주의 집단이 나를 이렇게 납치해선……"
10026010-77 = "하아……. 물론 알고 있어요. 세간에서 저희들의 이미지가 어떤지."
10026010-78 = "저희는 딱히 학생들을 속이거나 나쁜 짓을 꾸미고 있는 게 아닌데 말이죠……."
10026010-79 = "솔직히 말씀드리자면…… 그런 인식 때문에 꽤 피곤하답니다."
10026010-80 = "불필요한 소문들이 생성되고, 그로 인해 불필요한 거리감이 생겨나게 되니까요."
10026010-81 = "비록 저희에게 비밀이 있다고는 해도……. 그런 모함들과는 전혀 관계도 없고요."
10026010-82 = "수상한 사람들은 늘 그렇게 말하지……."
10026010-83 = "……요."
10026010-84 = "그, 그래서 절 여기 데려온 이유가 뭐지? ……요?"
10026010-85 = "저에게 무슨 짓을 하려는 거지? ……요?"
10026010-86 = "이, 이렇게 강압적인 분위기로!! 둘러싸서는!"
10026010-87 = "딱히 아무 짓도 안 합니다. 아까부터 계속 말하고 있잖아요. 잠깐 이야기를 나누고 싶다고."
10026010-88 = "그저 '당부'를 좀 하고 싶은 것뿐입니다. \"슬슬 그만둬 주셨으면 한다\", 라고 말이죠."
10026010-89 = "……당신이 저희의 동의도 없이 만든 공의회 경전의 사본……"
10026010-90 = "……!!!!!!!"
10026010-91 = "복사한 흔적은 완벽하게 숨겼을 텐데……!!"
10026010-92 = "아, 아니. 그리고 애초에 별 내용도 없었던 것 같은데……."
10026010-93 = "물론 경전의 내용 자체는 평범한 역사적 사료이기에 외부에 공개되어도 상관없지만……."
10026010-94 = "그래도 저희의 소중한 보물입니다. 그걸 저희 몰래 사본을 만든 것은…… 유감스러운 일이에요."
10026010-95 = "으으……. 역시 이런 조직을 속이는 건 불가능했던 건가……"
10026010-99 = "……헛!?"
10026010-100 = "히, 히나타 씨는 살아 있는 거야? 히나타 씨를 어떻게 한 거지?!"
10026010-101 = "……네?"
10026010-102 = "시, 시치미 떼지 마……! 난 다 알고 있어! 이런 상황……. 이 뒤에 어떤 일이 일어날 지도!"
10026010-103 = "어, 없앨 거야……! 그렇죠? 내 말이 맞지? 날 없애서 은폐하려는 거잖아!!"
10026010-104 = "히나타 씨…… 미안해…… 내가 괜한 짓을 해서…… 히나타 씨를 말려들게 해버렸어……."
10026010-106 = "……? 네?"
10026010-107 = "미안해요…… 히나타 씨…… 나 때문에……."
10026010-108 = "아, 아니. 우이 씨? 잠시만요. 일단 좀 진정해 주시겠어요? 일단 히나타는 멀쩡하게 잘 있거든요?"
10026010-109 = "이젠 내 차례겠지!? 끔찍하게 고문한 뒤 어딘가에 아무도 모르는 곳에……! 그렇지? 내 말 맞지!?"
10026010-110 = "저기! 우이 씨! 우이 씨!? 우선 제 말을……."
10026010-111 = "내가 사라져도 진실은 변하지 않아!!"
10026010-112 = "……요!!!"
10026010-113 = "대체 무슨 말씀이시냐고요!? 아까부터 계속 말씀드리고 있었잖아요!? 저는 그저 부탁을 드리려고……!!"
10026010-114 = "저희를 그렇게 음모론적인 시선으로 보는 걸 그만해 달라고……!!"
10026010-117 = "후후……."
10026010-118 = "그러게요. 정말이지 재미있는 분들이라니까요."
10026010-119 = "사쿠라코 씨도, 우이 씨도……."
10026010-120 = "……!?"
10026010-121 = "으, 으응!? 누, 누구……!? 누구시죠……!?"
10026010-122 = "여기는 아무나 찾아올 수 있는 곳이 아닌데……!"
10026010-129 = "쨔쟌- 지나가던 행인 A 등장♡ 이에요."
10026010-131 = "히, 히익……!? 당신은……!!"
10026010-132 = "심야의 수영복녀…… 아니, 우라와 하나코!? 그런데 지금도 수영복……!?"
10026010-133 = "어떻게 여길……? 아니, 거기에 비밀 통로가 있었나요!? 처음 알았어요!"
10026010-134 = "그러게요. 어머나, 이런 곳에 비밀 통로가……."
10026010-138 = "두, 둘이 아, 아는 사이였나요, 당신들!? 역시, 역시 그런 거였군요!?"
10026010-139 = "저런 무서운 사람이랑 협력까지 하고! 봐요! 이상하잖아요!! 역시 시스터후드는 수상한 곳이었어!!"
10026010-140 = "오해예요, 우이 씨! 오해라고요! 지금 이건 저희와 상관없는……! 저도 모르는 일이에요!!"
10026010-141 = "이 상황에서 그걸 믿으라는 건가요!? 본인이 말하고도 무리라는 생각은 안 드냐고!?"
10026010-142 = "그, 그야 들겠지만! 저라도 그렇게 생각할 것 같긴 하지만!"
10026010-143 = "히나타 씨를 돌려줘!! 이 사악한 비밀단체의 수괴!"
10026010-144 = "아니, 히나타는 멀쩡히 잘 있다니까요! 왜 제 말을 하나부터 열까지 다 안 믿어 주시는 거예요!?"
10026010-145 = "저, 저기……."
10026010-147 = "히, 히나타 씨?! 무사했던 거야!?"
10026010-148 = "죄, 죄송해요…… 저, 저기…… 괜히 저 때문에 걱정하신……."
10026010-149 = "히나타……? 어째서 여기에……!?"
10026010-151 = "후후훗. 그것보다 두 분……."
10026010-152 = "제가 괜히 한 마디 얹어 보아도 괜찮을까요? 지나가는 일반인 A의 의견으로서."
10026010-153 = "이, 일반인 A……!? 밤중에 수영복 차림으로 산책하는 일반인 A……!?"
10026010-154 = "우이 씨가 경전을 몰래 복제한 건……. 분명 도의적인 잘못이라고 하면 잘못이겠지만……."
10026010-155 = "……윽……!!"
10026010-156 = "우이 씨가 그런 음모론에 빠질 정도로…… 시스터후드는 사람들에게 신뢰를 주지 못하고 있다……고 할 수 있지 않을까요?"
10026010-157 = "당장 이 자리만 해도 그렇잖아요? 지금 이 상황. 누가 봐도 의심스러운 모양새고."
10026010-158 = "그리고 사쿠라코 씨 특유의 그런 화법…… 또한, 오해가 생기기에 충분해 보였고 말이에요."
10026010-159 = "실제로, 우이 씨는 겁까지 먹고 있고, 히나타 씨는 걱정이 되어서 저를 찾아오기까지 했으니까요."
10026010-160 = "지금 이 자리에서 누구보다 의심스러운 모양새는 하나코 씨 같은……."
10026010-161 = "그, 그리고 겁을 주려는 건……! 절대 그럴 의도가……!"
10026010-162 = "다른 사람들이 들으면 곤란한 책과 사건에 대한 이야기니까 안전한 장소를 마련했을 뿐인데……."
10026010-163 = "후후. 바로 그런 점이 시스터후드의 문제라는 거죠."
10026010-164 = "자, 자~. 그러니까 지금부터……. 지나가던 일반인 A가 제안을 할게요."
10026010-165 = "우이 씨는 히나타 씨가 곤란에 처했을 때 망설임 없이 도와주셨죠. 그리고 저번엔 다짜고짜 한밤중에 찾아간 저를 기꺼이 도와주기도 했고……."
10026010-166 = "사쿠라코 씨가 모두의 앞에서 카마수트라를 읽을 뻔했던 것도 우이 씨 덕분에 막을 수 있었죠."
10026010-167 = "……네? 그, 그런 적이 있었……?"
10026010-168 = "죄, 죄송해요…… 제가 경전을 부수지만 않았어도……."
10026010-169 = "결과적으로 우리 모두는 우이 씨의 신세를 진 것이라고도 할 수 있어요."
10026010-170 = "그러니 이번에는 반대로, 시스터후드에서도 '기회'를 드리는 게 어떨까요?"
10026010-171 = "기회……라니요?"
10026010-172 = "네. 우이 씨가 시스터후드에게 도움을 준다……같은 형태로 말이에요. 그걸로 우이 씨의 잘못을 용서해 주는 거죠."
10026010-173 = "어때요? 그렇게 나쁘지는 않은 이야기이지 않나요? 사쿠라코 씨가 바라시던 대로……. 좋은 게 좋은 것이니까요. 그렇죠?"
10026010-174 = "……도, 도움? 제가요? 시스터후드를……?"
10026010-175 = "그, 그게 무슨……. 저는 거기까지 요구할 생각은 결코……."
10026010-176 = "후후♡ 그치만 사쿠라코 씨, 쌓여 있잖아요? 해결이 필요한 시스터후드의 문제들이 잔뜩♡"
10026010-177 = "가령, 늘 마음에 두고 있던 <유적지>라던가……."
10026010-178 = "유적……?"
10026010-179 = "유적지……?"
10026010-180 = "그, 그걸 어떻게……?"
10026010-181 = "후후♡ 그럼 거래 성립이네요."
10026010-182 = "우리가 그 문제를 해결해 드리고, 사쿠라코 씨는 우이 씨를 용서해 주는 걸로."
10026010-183 = "지금부터는……"
10026010-185 = "……제게 맡겨 주세요♡"
10026010-199 = "다 섰어요, 선생님~! 한 장 부탁드릴게요~!"
10026010-200 = "[ns] 사진기 스위치를 누른다."
10026010-206 = "……??????"
