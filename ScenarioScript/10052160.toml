[translation]
10052160-1 = "말쿠트. 세상의 끝에 도달한 왕국의 순례자"
10052160-2 = "[ns] \"그 아이들은?!\""
10052160-3 = "일단…… 몸을 숨긴 것 같아."
10052160-4 = "이 지경이 되어서까지도, 끝까지 제대로 이야기해 주지 않는군요. 자기들이 왜 이런 일을 벌였는지 말이에요."
10052160-5 = "그렇습니다……. 아리스, 어째서인지 그 아이들과는 친구가 될 수 있을 것 같은데……."
10052160-6 = "……너무 무른 생각이에요. 아리스. 하지만 이상하기는 하네요."
10052160-7 = "그렇게 우리들을 위해서 이런 일을 벌이는 거다, 뭐다 하더니."
10052160-8 = "여기까지 내몰려서도 아무런 사정 하나 말하지 않으려 하다니 말이죠."
10052160-9 = "그러게. 최소한 시간이라도 어느 정도 끌 수 있을 텐데, 정말 효율적이지 않네."
10052160-10 = "아니면 정말 아무 생각 없이 저질러 버린 일이어서, 할 말이 처음부터 없었던 것일지도 모르겠군요."
10052160-11 = "아뇨……. 아무리 그래도, 어린아이가 모래 장난을 하는 기분으로, 이런 일을 벌였을 리가요……."
10052160-15 = "뭐, 마왕성의 마지막 사천왕이나 그런 것들은, 보통 진짜 사정도 잘 모르거나 변변찮은 소리밖에 하지 않는 법이니까!"
10052160-16 = "우리로서는 시간을 아낀 셈이지!"
10052160-17 = "그러다가 정말 어쩔 수 없는 사정이라도 있다면 어쩌려고 그래, 언니……."
10052160-18 = "아, 아무리 어쩔 수 없는 사정이라고 해도, 이만한 일을 벌였으면…… 안 되는 거, 아닐까……."
10052160-20 = "여, 여기라면 괜찮을 것 같아요……! 그, 그 사람들 눈에는 띄지 않을 거예요……."
10052160-22 = "으아…… 힘드네, 이거."
10052160-23 = "……그렇다고는 해도, 역시 조금 분하네요."
10052160-27 = "괜찮나요. 아인, 소프, 오르?"
10052160-28 = "네, 네에……! 괜찮, 괜찮아요! 아직, 아직 언니도 계시고……!"
10052160-34 = "끄떡없어! 어…… 아인이 조금 피곤한가 보네. 저러다 일어날 테니까 언니는 걱정하지 마."
10052160-40 = "둘 다 근성이 부족하다구요, 근성이. 아직, 이대로는……!"
10052160-46 = "……."
10052160-47 = "아인. 소프. 오르."
10052160-48 = "강철대륙은 분명 아인, 소프, 오르의 의지였지요?"
10052160-49 = "그, 그런…… 데요?"
10052160-50 = "저는 아인, 소프, 오르가 자기들의 뜻으로, 이 강철대륙을 만들어냈다는 것을 듣고, 매우 기뻤답니다."
10052160-51 = "하지만 왜 강철대륙을 만들려 했는지, 그래서 그것으로 무엇을 얻으려 하는지, 저는 아직 듣지 못했어요."
10052160-52 = "강철대륙을 확장시켜, 키보토스를 그 일부로 만드는 것에는, 반드시 그렇게 해야 할 당위성은 존재하지 않았습니다."
10052160-53 = "그, 그건 말이지……."
10052160-54 = "괜찮습니다. 당신들을 탓하거나 꾸짖으려는 것은 아니에요."
10052160-55 = "단지, 무엇 때문에 이렇게까지 강철대륙의 확장을 위해서 애쓸 필요가 있었는지."
10052160-56 = "그리고 그 이유를 저 선생님 일행뿐만이 아니라 저에게까지 좀처럼 이야기해 주지 않는 것은 어째서인지."
10052160-57 = "순수하게, 조금 의문이 들었을 뿐이에요."
10052160-58 = "강철대륙에 집착하지 않았다면, 이 모든 일은 어쩌면 일어나지 않았을지도 모르는데 말이죠."
10052160-59 = "……."
10052160-60 = "죄송해요. 언니."
10052160-61 = "하지만 역시, 말할 수 없는 이유가 있어요."
10052160-62 = "……그것을 넘어서, 그 구체적인 이야기가…… 결코, 말이라는 형태로 바깥에 들리게 해서는 안 되는 이유가…… 있어요."
10052160-63 = "하지만 믿어 주세요. 모든 것은 언니를 위해서……."
10052160-67 = "아뇨. 언니와 우리들 자신을 위해서, 이렇게 하고 있는 거예요."
10052160-68 = "아인, 소프, 오르와 저 자신을 위해서요?"
10052160-69 = "그건 조금 더 이해가 가지 않는 말이네요."
10052160-70 = "있잖아, 언니."
10052160-71 = "네, 소프. 이야기하세요."
10052160-75 = "언니는, 살고 싶어?"
10052160-76 = "네?"
10052160-77 = "……."
10052160-78 = "미안해요. 약간 이해가 가지 않는 물음이었어요."
10052160-79 = "의식을 가진 이상, 누구나 살고 싶다고 생각하는 것이 당연하겠지요. 그런 면에서라면, 네. 저는 살고 싶어요."
10052160-80 = "하지만 아인, 소프, 오르."
10052160-81 = "모두, 알고 있잖아요?"
10052160-82 = "응. 알고 있어. 물론이야. 누구보다도 언니와 우리가 잘 알고 있을 거야."
10052160-83 = "그래도 역시 우리는…… 살고 싶어."
10052160-84 = "언니와 함께, 언제까지나…… 살고 싶어."
10052160-85 = "그 말은……."
10052160-86 = "……!"
10052160-87 = "그렇군요."
10052160-88 = "저는 아직 완전히는 이해하지 못했지만, 아인, 소프, 오르가 그렇게 바란다면요."
10052160-89 = "우, 우우……."
10052160-90 = "……."
10052160-91 = "죄송해요. 언니. 이제 우리에게 남은 것은……."
10052160-92 = "네. 알고 있습니다."
10052160-93 = "그러면 이제부터는 저를 믿어 주세요."
10052160-94 = "그분을 위해서, 그리고 저의 소중한 동생들을 위해서."
10052160-97 = "모두, 저기입니다!"
10052160-102 = "이제 최종 보스 마왕 전투인 거지?"
10052160-103 = "네. 적당히 맞는 비유인 것 같습니다. 가끔은 괜찮은 소리를 하는 모모이."
10052160-104 = "저기, 토키? 혹시나 해서 물어보는 건데, 내 별명 몇 개나 지어 뒀어……?"
10052160-105 = "정말로 듣고 싶나요?"
10052160-106 = "아니, 아니야……. 괜찮아……."
10052160-107 = "집중 좀 하자구요, 진짜!"
