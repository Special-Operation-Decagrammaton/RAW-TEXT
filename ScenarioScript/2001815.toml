[translation]
2001815-1 = "Claymore, Claymore, Claymore！"
2001815-2 = "夏萊辦公室"
2001815-3 = "（一如往常晴朗的某個午後……）"
2001815-4 = "（在萌的幫助下正在處理大量的文件工作）"
2001815-9 = "總覺得……沒完沒了。"
2001815-10 = "[s]「沒完沒了呢……」"
2001815-14 = "這種情況……沒救了。"
2001815-15 = "[s]「沒救了呢……」"
2001815-20 = "老師，你每天都要面對這種沒完沒了的文件嗎？"
2001815-21 = "就算我再怎麼熱愛毀滅，但是對於曖昧的問題寫出含糊的答案，#n然後不斷提交這種事我可受不了。"
2001815-22 = "[s1]「抱歉讓你幫忙這種麻煩事。」\n[s2]「萌只要輸入數據結果就可──」"
2001815-25 = "不，我不是在跟老師抱怨哦？"
2001815-26 = "反正是我先說要幫忙的，我也習慣了這類單純的作業。"
2001815-27 = "但是筆拿太久了，指尖有點麻麻的……"
2001815-28 = "[s3]「那就稍微休息一下吧？」\n[s4]「我去泡咖啡，你先伸展一下。」"
2001815-31 = "收到～"
2001815-35 = "啊，趁現在來用用那個吧？"
2001815-36 = "呵呵呵……有帶來真是太好了。"
2001815-41 = "那就馬上──"
2001815-43 = "[ns]「停！」"
2001815-45 = "嚇，嚇死了……！"
2001815-46 = "突然怎麼了老師？嚇得我差點跌倒！"
2001815-47 = "[s5]「你是真的不知道才問的嗎？」\n[s6]「你剛才拿出來的這個東西……」"
2001815-53 = "[ns]「這是爆炸物用的起爆器吧！」"
2001815-54 = "……起爆器？"
2001815-55 = "啊，放心。雖然長得很像，但這是完全不同的東西。"
2001815-56 = "我才不是會因為無聊就突然引爆炸彈的──"
2001815-60 = "反正，這次真的是誤會啦！"
2001815-61 = "如果不信的話，老師你自己壓壓看把手？"
2001815-62 = "自己壓壓看就知道這是什麼東西了！"
2001815-63 = "[s7]「難道現在光是親手引爆炸彈已經不夠了……」\n[s8]「你想看我親手把夏萊炸掉嗎！？」"
2001815-66 = "哦哦，不錯耶。那也是相當毀滅性的景象呢……"
2001815-67 = "不對，我再說一次，這真的是誤會啦！這不是真的起爆器！"
2001815-68 = "你仔細看，沒有起爆器必須有的起爆信號裝置吧？"
2001815-69 = "[s9]「仔細看好像是有點不一樣……」\n[s10]「那這個是用來做什麼的？」"
2001815-72 = "老師沒用過嗎？這是握力器哦。"
2001815-73 = "你看，像這樣用力……彈簧會推回來，可以鍛鍊握力。"
2001815-77 = "因為手指要出很大的力，所以很適合用來在辛苦的文書工作後做伸展。"
2001815-78 = "[s11]「不是起爆器真是太好了……」\n[s12]「話說為什麼要做成這麼容易被誤會的形狀？」"
2001815-81 = "因為這個握力器是我用壞掉的起爆器親手改造的特製品。"
2001815-82 = "為什麼？因為工作的時候偶爾會無聊，#n但又不能引爆炸彈，會有這種困擾吧？"
2001815-85 = "[ns]（正常情況下都不行吧……？）"
2001815-86 = "在那種情況下又不能用真的起爆器，所以我以前會把壞掉的起爆器像紓壓玩具一樣一直按，#n好讓手癢的感覺平靜下來。"
2001815-87 = "後來想想既然要動手的話，順便鍛鍊握力也不錯。"
2001815-88 = "就把起爆器的雷管拆掉，接著裝上彈簧改造成握力器了。"
2001815-89 = "之前也說過吧？就算是報務員，對SRT隊員來說體能訓練也是重要的日程，#n對要處理大量補給工作的補給人員來說握力尤其重要。"
2001815-90 = "特別是握完握力器後手麻麻的感覺比想像中更有毀滅感，哈啊……哈啊……"
2001815-91 = "[s13]「把握力器當成紓壓玩具是個好主意呢。」\n[s14]「做文書工作的時候常常需要用到握力嘛。」"
2001815-94 = "對吧？而且應該比老師想像的還要強很多喔。"
2001815-95 = "如果你好奇的話可以試試看。"
2001815-96 = "[s]「那就……」"
2001815-102 = "咦？老，老師？為什麼握我的手……？"
2001815-103 = "[s]「不是要握你的手試試看嗎？」"
2001815-104 = "……呃，嗯，這樣也沒錯啦。"
2001815-105 = "我剛剛說的是握力器……"
2001815-106 = "不過握手也可以測試握力嘛。"
2001815-110 = "咯嘻嘻……看來老師的手臂肌肉也練得不錯呢。"
2001815-111 = "那我們來比比看腕力吧？"
2001815-112 = "普通玩的話太沒意思了，輸的人要聽贏的人一個請求怎麼樣。"
2001815-114 = "（之後和萌一起比了腕力）"
2001815-115 = "（明明出了全力，卻連續輸了三次……）"
