[translation]
2001815-1 = "Claymore, Claymore, Claymore!"
2001815-2 = "สำนักงานชาเล่ต์"
2001815-3 = "(บ่ายวันหนึ่งที่แดดสดใสเหมือนทุกวัน...)"
2001815-4 = "(คุณครูกำลังจัดการเอกสารกองโตด้วยความช่วยเหลือของโมเอะที่มาเข้าเวร)"
2001815-5 = ""
2001815-7 = ""
2001815-8 = ""
2001815-9 = "นี่มัน... ไม่จบไม่สิ้นเลยนะ"
2001815-10 = "[s] \"ไม่จบไม่สิ้นเลยละ...\""
2001815-11 = ""
2001815-13 = ""
2001815-14 = "งานแบบนี้น่ะ... ฉันจนปัญญาจริงๆ"
2001815-15 = "[s] \"จนปัญญาจริงๆ เลย...\""
2001815-16 = ""
2001815-18 = ""
2001815-19 = ""
2001815-20 = "คุณครู คุณครูต้องต่อสู้กับงานเอกสารที่ไม่จบไม่สิ้นแบบนี้ทุกวันเลยเหรอ?"
2001815-21 = "ต่อให้ฉันจะรักความพินาศย่อยยับแค่ไหน แต่การต้องมานั่งเขียนคำตอบให้คำถามกำกวมพวกนั้น#nอย่างไม่รู้จบน่ะ ฉันทำใจชอบไม่ลงหรอก"
2001815-22 = "[s1] \"ขอโทษที่ขอให้ช่วยงานที่น่าเบื่อนะ\"\n[s2] \"ขอโทษนะ งั้นโมเอะแค่ใส่ข้อมูลลงไปก็พอ...\""
2001815-25 = "อะไรกัน ฉันไม่ได้บ่นคุณครูสักหน่อย?"
2001815-26 = "แล้วฉันก็บอกเองว่าจะช่วยคุณครูด้วย ฉันคุ้นเคยกับงานกรอกข้อมูลง่ายๆ แบบนี้อยู่แล้วละ"
2001815-27 = "แต่สงสัยฉันจะจับปากกานานเกินไป ปลายนิ้วก็เลยชาไปหมดเลย..."
2001815-28 = "[s3] \"งั้นเราพักกันสักเดี๋ยวมั้ย?\"\n[s4] \"ครูจะไปชงกาแฟมา ระหว่างนี้ก็ยืดเส้นยืดสายสักหน่อยล่ะ\""
2001815-31 = "ได้เลย~"
2001815-32 = ""
2001815-34 = ""
2001815-35 = "อ๊ะ ไหนๆ นึกขึ้นได้แล้ว ก็ลองใช้อันนั้นดีมั้ย?"
2001815-36 = "ฮิฮิฮิ... ดีจังเลยนะที่หยิบมาด้วย"
2001815-37 = ""
2001815-39 = ""
2001815-41 = "ถ้างั้นก็..."
2001815-43 = "[ns] \"สต็อป!\""
2001815-45 = "ตะ... ตกใจหมดเลย..."
2001815-46 = "ทำไมจู่ๆ ก็ทำแบบนั้นล่ะ คุณครู? ฉันตกใจจนเกือบล้มหกคะเมนแล้วนะ!"
2001815-47 = "[s5] \"ถามเพราะไม่รู้จริงๆ เหรอ?\"\n[s6] \"ก็ของที่โมเอะหยิบออกมา...\""
2001815-50 = ""
2001815-53 = "[ns] \"ก็นั่นมันเครื่องจุดระเบิดนี่นา!\""
2001815-54 = "เครื่องจุดระเบิด...?"
2001815-55 = "อ่า ไม่ต้องห่วงนะ  ถึงมันจะรูปร่างคล้ายกัน แต่มันเป็นของคนละอย่างกันเลยละ"
2001815-56 = "ถึงฉันจะเป็นคนที่ชอบจุดระเบิดเวลาไม่มีอะไรทำ..."
2001815-57 = ""
2001815-59 = ""
2001815-60 = "แต่ครั้งนี้เป็นเรื่องเข้าใจผิดจริงๆ นะ!"
2001815-61 = "อื้อ ถ้าไม่เชื่อจริงๆ ละก็ คุณครูลองมาบีบตรงนี้เองเลยมั้ย?"
2001815-62 = "ถ้าได้ลองด้วยตัวเอง ก็จะรู้ว่านี่คือเครื่องอะไรกันแน่!"
2001815-63 = "[s7] \"เดี๋ยวนี้คิดจะชวนครูจุดระเบิดในชาเล่ต์เลยเหรอ?\"\n[s8] \"อยากเห็นครูระเบิดชาเล่ต์ด้วยมือตัวเองเลยเหรอ?!\""
2001815-66 = "โอ้ว แบบนั้นก็ดีเหมือนกันนะ คงได้เห็นความพังพินาศไม่น้อยเลยละ..."
2001815-67 = "แต่เดี๋ยวสิ ฉันก็บอกไปแล้วไงว่าครั้งนี้เป็นเรื่องเข้าใจผิดเต็มๆ! นี่ไม่ใช่เครื่องจุดระเบิดจริงๆ นะ!"
2001815-68 = "ดูให้ดีนะ ปกติเครื่องจุดระเบิดต้องมีระบบให้สัญญาณจุดระเบิด แต่อันนี้ไม่มีสักหน่อย"
2001815-69 = "[s9] \"จะว่าไป มันก็ดูแตกต่างกันนิดหน่อยนะ...\"\n[s10] \"งั้นของชิ้นนี้เอาไว้ทำอะไรเหรอ?\""
2001815-72 = "นี่คือเครื่องบริหารมือน่ะ คุณครูไม่เคยใช้มาก่อนเลยเหรอ?"
2001815-73 = "ดูนะ ถ้าออกแรงบีบแรงๆ แบบนี้... สปริงมันจะต้านนิ้วเรา เอาไว้ซ้อมเพิ่มแรงบีบมือได้ดีเลยละ"
2001815-74 = ""
2001815-76 = ""
2001815-77 = "พอต้องออกแรงกดที่นิ้วเต็มๆ ก็เลยเหมาะจะเอามายืดเส้นยืดสายหลังจากลุยงานเอกสารกองโตมาน่ะสิ"
2001815-78 = "[s11] \"ค่อยยังชั่วที่ไม่เกี่ยวกับระเบิดนะ...\"\n[s12] \"แต่ทำไมหน้าตามันชวนเข้าใจผิดอย่างนี้ล่ะ?\""
2001815-81 = "ฉันดัดแปลงเครื่องบริหารมืออันนี้ขึ้นเองจากเครื่องจุดระเบิดที่พังไปแล้วน่ะ"
2001815-82 = "ก็เวลาทำงานไปเรื่อยๆ มันก็มีช่วงเวลาน่าอึดอัดใจ... ที่เรารู้สึกเบื่อแต่จุดระเบิดไม่ได้ ใช่มั้ยล่ะ?"
2001815-83 = ""
2001815-85 = "[ns] (ส่วนใหญ่มันก็เป็นแบบนั้นไม่ใช่เหรอ...?)"
2001815-86 = "ในสถานการณ์แบบนั้น ฉันจะหยิบเครื่องจุดระเบิดจริงๆ มาใช้ก็ไม่ได้ เมื่อก่อนฉันก็เลยชอบเอา#nเครื่องจุดที่พังแล้วมากดเหมือนของเล่นเพื่อดึงสติไม่ให้คันไม้คันมือด้วยน่ะ"
2001815-87 = "แต่พอมาคิดดู ในเมื่อต้องใช้มืออยู่แล้ว งั้นถ้าได้ฝึกแรงบีบที่มือไปด้วยก็น่าจะดี"
2001815-88 = "ฉันก็เลยเอาท่อจุดชนวนออกจากเครื่องจุดระเบิด แล้วติดสปริงเข้าไปให้เป็นเครื่องบริหารมือแทน"
2001815-89 = "ก่อนหน้านี้ฉันก็บอกไปแล้วนี่? ว่าถึงจะเป็นโอเปอเรเตอร์ แต่สมาชิก SRT ก็ต้องฝึกฝนร่างกายให้เป็น#nประจำ และแรงจับที่มือก็เป็นเรื่องสำคัญของหน่วยเสบียงที่ต้องขนย้ายเสบียงขนาดใหญ่ด้วย"
2001815-90 = "แล้วความรู้สึกเจ็บจี๊ดเวลาบีบเครื่องบริหารมือก็รุนแรงกว่าที่คิดไว้มาก มันเลยยิ่ง... แฮ่ก แฮ่ก... "
2001815-91 = "[s13] \"การบีบเครื่องบริหารมือเหมือนของเล่นก็เป็นไอเดียที่ดีนะ\"\n[s14] \"ทำงานเอกสารก็ต้องใช้แรงจับที่มือด้วย งั้นก็เป็นเครื่องที่ดีเลยนะ\""
2001815-94 = "ใช่มั้ยล่ะ? แต่บางทีอาจแรงเยอะที่คุณครูคิดก็ได้นะ"
2001815-95 = "ถ้าอยากรู้ละก็ ลองมาเทสดูมั้ยล่ะ?"
2001815-96 = "[s] \"ถ้างั้นก็...\""
2001815-97 = ""
2001815-99 = ""
2001815-100 = ""
2001815-101 = ""
2001815-102 = "เอะ... เอ๋? คะ... คุณครู? ทำไมถึงจับมือฉัน..."
2001815-103 = "[s] \"ไม่ได้ให้จับมือแล้วลองเทสดูหรอกเหรอ?\""
2001815-104 = "เอ่อ... ที่พูดมามันก็ไม่ผิดหรอก"
2001815-105 = "แต่ฉันพูดถึงเครื่องบริหารมือต่างหาก..."
2001815-106 = "พอมาคิดดูแล้ว การจับมือก็เป็นการเทสแรงจับที่มือได้เหมือนกันนะ"
2001815-107 = ""
2001815-109 = ""
2001815-110 = "ฮิฮิฮิ... คุณครูก็มีกล้ามเนื้อแขนใช้ได้เลยนะเนี่ย"
2001815-111 = "งั้นเรามาเทสด้วยการงัดข้อกันมั้ย?"
2001815-112 = "แต่ถ้าเล่นเฉยๆ ก็ไม่สนุก งั้นให้คนที่แพ้ทำตามคำขอของคนที่ชนะอย่างหนึ่งแล้วกัน"
2001815-114 = "(หลังจากนั้นคุณครูก็งัดข้อดวลพลังกับโมเอะ)"
2001815-115 = "(ถึงจะออกแรงเต็มกำลังแล้ว แต่คุณครูก็แพ้รวดสามรอบติด...)"
