[translation]
2001815-1 = "Claymore, Claymore, Claymore!"
2001815-2 = "Schale Executive Office"
2001815-3 = "It was just another regular, sunny afternoon..."
2001815-4 = "...except for the fact that Moe, as Student Rep, was at Schale, helping me with paperwork."
2001815-5 = ""
2001815-7 = ""
2001815-8 = ""
2001815-9 = "There's...no end."
2001815-10 = "[s] \"No end...\""
2001815-11 = ""
2001815-13 = ""
2001815-14 = "There's...no easy solution either..."
2001815-15 = "[s] \"No solution...\""
2001815-16 = ""
2001815-18 = ""
2001815-19 = ""
2001815-20 = "Sensei! Are you always fighting this hopeless battle against paperwork?"
2001815-21 = "I could never bring myself to dedicate my life to reading vague questions and answering with even vaguer replies. This is destruction of the soul."
2001815-22 = "[s1] \"Sorry I didn't have anything more exciting to do.\"\n[s2] \"Just you inputting data is really helpful...\""
2001815-25 = "No, it's not your fault. I'm just COMPLAINING."
2001815-26 = "I'm the one who said I'd help, and menial work is something of my forte."
2001815-27 = "But my fingers are going numb from holding this pen..."
2001815-28 = "[s3] \"Should we take a break then?\"\n[s4] \"I'll get coffee, and you should stretch a little.\""
2001815-31 = "Got it!"
2001815-32 = ""
2001815-34 = ""
2001815-35 = "Ah, maybe I'll use \"that\" then."
2001815-36 = "Heehee... I knew bringing this was a good call."
2001815-37 = ""
2001815-39 = ""
2001815-41 = "Then, without further ado..."
2001815-43 = "[ns] \"Stop!\""
2001815-45 = "Y-You scared me..."
2001815-46 = "What's wrong, Sensei? I almost jumped out of my skin!"
2001815-47 = "[s5] \"Do you have the right to ask me that?!\"\n[s6] \"Look at what's in your hand!\""
2001815-50 = ""
2001815-53 = "[ns] \"Isn't that a bomb trigger?!\""
2001815-54 = "...Trigger?"
2001815-55 = "Ah, ah. Stop being such a worrywart, Sensei. Not everything is always as it seems!"
2001815-56 = "I'm not the type to set off a bomb for funsies when I get bored—"
2001815-57 = ""
2001815-59 = ""
2001815-60 = "...Okay, fine, yeah, I am. But today I'm not, okay?!"
2001815-61 = "Fine, fine. Look, just squeeze this handle and stop giving me that judgy side-eye!"
2001815-62 = "Come see for yourself, geez!"
2001815-63 = "[s7] \"Does setting off bombs not give you enough of an adrenaline rush anymore?\"\n[s8] \"Now you want to manipulate me into blowing up Schale with my own hands?!\""
2001815-66 = "Oh! Ohhh, I like that. What a deliciously destructive image..."
2001815-67 = "NO, seriously, look! You really are misunderstanding the situation this time! It's not a bomb!"
2001815-68 = "Look. It's missing the detonation signal device that every trigger needs."
2001815-69 = "[s9] \"When I look closer, it does seem a little different...\"\n[s10] \"Then what is this thing used for?\""
2001815-72 = "Have you never used one before, Sensei? It's a grip trainer."
2001815-73 = "Look, if you hold this tight... The spring pushes your finger outward, and you can train your grip strength."
2001815-74 = ""
2001815-76 = ""
2001815-77 = "It requires a lot of finger strength, so I use it to get the blood flowing after a lot of work."
2001815-78 = "[s11] \"I AM relieved you're not trying to blow up Schale...\"\n[s12] \"But why make it...bomb-themed?\""
2001815-81 = "I made it myself! With a broken trigger I picked up."
2001815-82 = "You know how it is. You're stuck somewhere working, and you find yourself in this horrible conundrum where you can't blow anything up, no matter how bored you are!"
2001815-83 = ""
2001815-85 = "[ns] \"(Isn't that...most situations?)\""
2001815-86 = "So I started to fidget with this broken trigger whenever I had an itchy trigger finger."
2001815-87 = "To add more utility, I decided to make it a grip trainer too."
2001815-88 = "All I had to do was wiggle away the primer and replace it with a high-tension spring."
2001815-89 = "Don't you remember? I already told you that at SRT, even an operator has to maintain their physical condition and fitness. And for me, who handles a lot of supplies, being dexterous is important."
2001815-90 = "Also...the way it makes my hand tingle...the feeling of destruction that surges through my veins... *pant* *pant*"
2001815-91 = "[s13] \"Making it functional was really smart of you.\"\n[s14] \"Sorting paperwork requires a lot of grip strength, after all.\""
2001815-94 = "You're gettin' it! Squeezing this requires more force than you'd expect too."
2001815-95 = "Curious? Give it a try."
2001815-96 = "[s] \"Sure, why not...\""
2001815-97 = ""
2001815-99 = ""
2001815-100 = ""
2001815-101 = ""
2001815-102 = "H-Huh? S-Sensei? Why are you grabbing my hand...?!"
2001815-103 = "[s] \"Isn't this what you meant by 'trying?'\""
2001815-104 = "...Well, I guess that works."
2001815-105 = "I more so meant the grip trainer..."
2001815-106 = "But a handshake is a more kinetic way to measure grip strength..."
2001815-107 = ""
2001815-109 = ""
2001815-110 = "Heehee... Looks like you've been hitting the gym too, Sensei. THAT gun show is destructive."
2001815-111 = "How about a little arm wrestling to see who's stronger?"
2001815-112 = "Hm... Playing for fun sounds boooring, so whoever loses...owes the winner a favor. Heeheehee."
2001815-114 = "Moe and I put our grip strength honor on the line through a series of arm wrestling matches."
2001815-115 = "I pushed and flexed, and gave it my all, but I lost all three rounds..."
