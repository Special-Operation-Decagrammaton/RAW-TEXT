[translation]
2001815-1 = "Claymore, Claymore, Claymore!"
2001815-2 = "샬레 집무실"
2001815-3 = "(여느 때처럼 화창한 어느 날 오후……)"
2001815-4 = "(당번으로 온 모에의 도움을 받아 대량의 서류 업무를 처리하고 있었다.)"
2001815-9 = "뭔가…… 끝이 없네."
2001815-10 = "[s]\"끝이 없어…….\""
2001815-14 = "이런 건…… 답도 없네."
2001815-15 = "[s]\"답도 없어…….\""
2001815-20 = "선생님. 선생님은 매일 이런 답도 없는 서류를 상대로 끝없이 싸우고 있는 거야?"
2001815-21 = "내가 아무리 파멸을 사랑한다지만, 애매한 질문들에 아리송한 답변을 끝없이 적어 제출하는 일은 좋아할 수가 없어."
2001815-22 = "[s1]\"귀찮은 일을 부탁해서 미안해.\"\n[s2]\"모에는 데이터 결괏값만 입력해도 괜찮으니까—\""
2001815-25 = "아니, 선생님에게 불평하는 게 아니거든?"
2001815-26 = "어차피 내가 먼저 돕겠다고 했었고. 이런 류의 단순 작업은 익숙하니까."
2001815-27 = "하지만 펜을 너무 오래 쥐고 있었는지, 손끝이 저릿저릿해……"
2001815-28 = "[s3]\"그럼 잠깐 휴식할까?\"\n[s4]\"커피를 타올 테니, 그동안 스트레칭이라도 하고 있어.\""
2001815-31 = "알겠어~"
2001815-35 = "아, 생각난 김에 그걸 써 볼까?"
2001815-36 = "쿠히히…… 올 때 같이 챙겨 오길 잘했네."
2001815-41 = "그럼 바로—"
2001815-43 = "[ns]\"스톱!\""
2001815-45 = "까, 깜짝이야……"
2001815-46 = "갑자기 왜 그러는 거야 선생님? 깜짝 놀라서 넘어질 뻔했잖아!"
2001815-47 = "[s5]\"정말 몰라서 묻는 거야?\"\n[s6]\"네가 방금 꺼낸 이 물건……\""
2001815-53 = "[ns]\"폭발물에 쓰는 격발기잖아!\""
2001815-54 = "……격발기?"
2001815-55 = "아, 걱정 마. 모양은 비슷하게 생겼지만 전혀 다른 물건이야."
2001815-56 = "내가 심심하다고 갑자기 폭탄을 터트리는 사람—"
2001815-60 = "—이긴 하지만, 이번만큼은 진짜 오해라구!"
2001815-61 = "그래. 정 의심스러우면 선생님이 직접 이 손잡이를 당겨 볼래?"
2001815-62 = "직접 당겨보면 이게 무슨 물건인지 알 수 있을 테니까!"
2001815-63 = "[s7] \"설마 이제는 직접 폭탄을 터트리는 것으로도 모자라……\"\n[s8] \"내가 내 손으로 샬레를 터트리는 걸 보고 싶은 거야?!\""
2001815-66 = "오오, 좋네. 그것도 꽤나 파멸적인 광경이겠지만……"
2001815-67 = "아니, 다시 말하지만 이번에는 정말 오해라니까?! 이건 진짜 격발기가 아니야!"
2001815-68 = "잘 봐. 격발기에는 꼭 있어야 하는 기폭 신호 장치가 빠져 있잖아."
2001815-69 = "[s9]\"그러고 보니 조금 다른 것 같기도 하고……\"\n[s10]\"그럼 이건 어디에 쓰는 물건인데?\""
2001815-72 = "선생님은 한 번도 써 본 적 없는 거야? 이건 악력기라고."
2001815-73 = "봐, 이렇게 꽉 쥐면…… 용수철이 손가락을 밀어내며 악력을 단련할 수 있거든."
2001815-77 = "손가락에 힘이 잔뜩 들어가기 때문에 고된 서류 작업 뒤의 스트레칭 용도로 제격이야."
2001815-78 = "[s11] \"폭발물이 아니라니 다행이지만……\"\n[s12] \"그런데 왜 이렇게 오해를 사기 쉬운 모양인 거야?\""
2001815-81 = "그야 이 악력기는 내가 망가진 격발기를 직접 개조해서 만든 특제품이거든."
2001815-82 = "왜. 일하다 보면 가끔 지루하긴 해도, 폭탄을 터트리면 안 되는— 곤란한 때가 있잖아?"
2001815-85 = "[ns](대부분의 상황이 그렇지 않나……?)"
2001815-86 = "그런 상황에서 진짜 격발기를 쓸 순 없으니, 예전에는 근질거리는 손을 진정시키기 위해 망가진 격발기를 피젯 토이처럼 당기곤 했었거든."
2001815-87 = "그런데 생각해 보니 이왕 손을 놀릴 거라면 악력도 기르면 좋겠다 싶어서."
2001815-88 = "격발기에서 뇌관을 빼고 용수철을 달아 악력기로 개조해 보았어."
2001815-89 = "전에도 말했잖아? 오퍼레이터라도 SRT 대원에게 체력 단련은 중요한 일과고, 대량의 보급 업무를 처리해야 하는 보급 계원에게 악력은 특히 더 중요하니까."
2001815-90 = "특히나 악력기를 당기고 나서 손이 찌르르한 느낌이 생각보다 더 파멸적이라…… 하아, 하아……"
2001815-91 = "[s13]\"피젯 토이처럼 악력기를 쓰는 건 좋은 생각이네.\"\n[s14]\"서류 업무를 하다 보면 손아귀 힘을 쓸 때가 많으니까.\""
2001815-94 = "그렇지? 아마 선생님이 생각하는 것보다 훨씬 더 강할걸."
2001815-95 = "궁금하다면 한번 시험 삼아 테스트해 봐도 괜찮아."
2001815-96 = "[s]\"그럼……\""
2001815-102 = "어, 어라? 서, 선생님? 어째서 내 손을—"
2001815-103 = "[s]\"손을 잡아서 시험해 보라는 뜻이 아니었어?\""
2001815-104 = "……아니, 뭐 틀리진 않았어."
2001815-105 = "내가 말한 건 악력기의 이야기였지만……"
2001815-106 = "생각해 보니 악수로도 악력 테스트는 할 수 있을 테니까."
2001815-110 = "쿠히히…… 보아하니 선생님도 제법 팔 근육이 단련된 모양인데."
2001815-111 = "그럼 우리 팔씨름으로 시험해 볼까?"
2001815-112 = "그냥은 재미가 없으니 진 사람이 이긴 사람의 부탁을 하나 들어주는 것으로."
2001815-114 = "(이후, 모에와 함께 팔씨름을 하며 서로의 아귀 힘을 가늠해 보았다.)"
2001815-115 = "(전력을 다했지만, 어째서인지 세 번이나 연달아 자빠지고 말았다…….)"
