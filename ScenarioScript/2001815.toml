[translation]
2001815-1 = "Claymore, Claymore, Claymore！"
2001815-2 = "夏萊辦公室"
2001815-3 = "（一如往常晴朗的某個午後……）"
2001815-4 = "（在萌的幫助下處理著大量的文書工作）"
2001815-5 = ""
2001815-7 = ""
2001815-8 = ""
2001815-9 = "總覺得……沒完沒了。"
2001815-10 = "[s]「沒完沒了呢……」"
2001815-11 = ""
2001815-13 = ""
2001815-14 = "這種情況……沒救了。"
2001815-15 = "[s]「沒救了呢……」"
2001815-16 = ""
2001815-18 = ""
2001815-19 = ""
2001815-20 = "老師，你每天都要面對這種多到離譜的文件嗎？"
2001815-21 = "就算我再怎麼熱愛毀滅……#n像這樣不斷用模稜兩可的答案回答曖昧不清的問題，我實在是喜歡不起來呢。"
2001815-22 = "[s1]「抱歉把這種麻煩的工作交給你。」\n[s2]「萌只要輸入數據結果就可──」"
2001815-25 = "不是，我沒有要跟老師抱怨的意思哦？"
2001815-26 = "反正是我先說要幫忙的，這種單純的作業我也已經習慣了。"
2001815-27 = "不過可能是筆握太久的關係，指尖有點麻麻的……"
2001815-28 = "[s3]「那要不要稍微休息一下？」\n[s4]「我去泡咖啡，你先伸展一下吧。」"
2001815-31 = "收到～"
2001815-32 = ""
2001815-34 = ""
2001815-35 = "啊，趁現在來用用那個吧？"
2001815-36 = "咯嘻嘻……有帶來真是太好了。"
2001815-37 = ""
2001815-39 = ""
2001815-41 = "那就馬上──"
2001815-43 = "[ns]「停！」"
2001815-45 = "哇，嚇死我了……！"
2001815-46 = "老師為什麼要突然大叫啊？#n害我嚇得差點就跌倒了耶！"
2001815-47 = "[s5]「你是真的不知道才這麼問的嗎？」\n[s6]「你剛才拿出來的那個東西……」"
2001815-50 = ""
2001815-53 = "[ns]「分明是爆炸物的起爆器吧！」"
2001815-54 = "……起爆器？"
2001815-55 = "啊～放心放心。#n雖然外表長得很像，不過這是完全不同的東西。"
2001815-56 = "我才不是會因為無聊就突然引爆炸彈的那種──"
2001815-57 = ""
2001815-59 = ""
2001815-60 = "總之，這次真的是你誤會了啦！"
2001815-61 = "如果不信的話，老師要不要來壓壓看把手？"
2001815-62 = "自己壓一次就會知道這是什麼東西了！"
2001815-63 = "[s7]「難道現在光是親手引爆炸彈已經無法滿足……」\n[s8]「你想看我親手把夏萊炸掉嗎！？」"
2001815-66 = "哦哦，不錯耶。那也是相當具有毀滅性的景象呢……"
2001815-67 = "不對，我再重申一次，真的是你誤會了啦！這不是真的起爆器！"
2001815-68 = "你仔細看，沒有起爆器必須要有的雷管吧？"
2001815-69 = "[s9]「仔細看好像是有點不一樣……」\n[s10]「那這個是用來做什麼的？」"
2001815-72 = "老師沒用過嗎？這是握力器哦。"
2001815-73 = "你看，只要像這樣用力壓下去……彈簧就會產生回彈的力量，可以用來鍛鍊握力。"
2001815-74 = ""
2001815-76 = ""
2001815-77 = "因為手指必須使出相當程度的力氣，很適合在處理完文書工作之後用來伸展。"
2001815-78 = "[s11]「不是起爆器真是太好了……」\n[s12]「話說為什麼要做成這麼容易被誤會的形狀？」"
2001815-81 = "因為這個握力器，是我用壞掉的起爆器親手改造出來的特製品。"
2001815-82 = "你想想，工作的時候不是偶爾會遇到「明明很無聊卻不能引爆炸彈」的情況嗎？"
2001815-83 = ""
2001815-85 = "[ns]（大部分的情況下都不行吧……？）"
2001815-86 = "因為在那種情況下不能使用真的起爆器……#n我以前會把壞掉的起爆器當成紓壓玩具一直按，好讓手癢的感覺平靜下來。"
2001815-87 = "後來覺得既然要動手的話，順便鍛鍊一下握力也不錯。"
2001815-88 = "所以就把起爆器的雷管拆掉，接著裝上彈簧改造成握力器了。"
2001815-89 = "之前也說過吧？就算是報務員，體能訓練對SRT的隊員來說也是很重要的。#n尤其對於要處理大量物資的補給人員來說，握力更是重中之重。"
2001815-90 = "而且握完握力器之後那種手麻麻的感覺，可是比想像中更有毀滅性呢。#n哈啊……哈啊……"
2001815-91 = "[s13]「把握力器當成紓壓玩具是個好主意呢。」\n[s14]「做文書工作的時候，也常常需要用到握力嘛。」"
2001815-94 = "對吧？我想應該比老師想像中還要強很多哦。"
2001815-95 = "如果好奇的話可以試試看。"
2001815-96 = "[s]「那就……」"
2001815-97 = ""
2001815-99 = ""
2001815-100 = ""
2001815-101 = ""
2001815-102 = "咦？老，老師？為什麼要握住我的手……？"
2001815-103 = "[s]「不是要握你的手試試看嗎？」"
2001815-104 = "呃……嗯，這樣也是可以啦。"
2001815-105 = "雖然我剛才說的是握力器……"
2001815-106 = "不過直接握手也可以測試握力嘛。"
2001815-107 = ""
2001815-109 = ""
2001815-110 = "咯嘻嘻……看來老師的手臂肌肉也練得不錯呢。"
2001815-111 = "那我們來比比看腕力吧？"
2001815-112 = "單純比力氣的話太沒意思了，輸的人要聽贏的人一個請求怎麼樣？"
2001815-114 = "（之後和萌一起比了腕力）"
2001815-115 = "（明明出了全力，卻連續輸了三次……）"
