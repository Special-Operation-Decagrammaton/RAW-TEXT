[translation]
1006903-1 = "일단 맛을 보고 평가해!"
1006903-2 = "현무상회"
1006903-3 = "(루미의 호출을 받고 현무상회로 찾아왔다.)"
1006903-8 = "어서 와, 선생님! 기다리고 있었어."
1006903-9 = "기대된다고? 하하하. 너무 크게 기대하지는 마. 그…… 여러 가지로, 쑥스러우니까."
1006903-10 = "[s1] \"그런데 생각해 보니까 말이지.\"\n[s2] \"다른 현무상회 학생들에게 도와 달라고 하면 되지 않아?\""
1006903-13 = "아…… 그게 말이지."
1006903-14 = "물론 일반적으로 생각하면 그렇긴 하지, 응!"
1006903-15 = "그런데 다들 지금은 좀 바쁘다고 할까, 일이 생겨서 여유가 없다고 할까! 뭐 그런 상황이라!"
1006903-16 = "이것 참, 다들 성실한 학생들이지만, 이럴 때만큼은 협조성이 조금 아쉽다고 해야 하나, 그런 기분이야. 하하하!"
1006903-17 = "[s] (미묘하게 수상한데……)"
1006903-24 = "자, 첫 번째 요리야. 맛보고 감상을 들려줘."
1006903-25 = "가능한 한 솔직하게 말해 주면 좋겠어."
1006903-26 = "음? 참 녹색녹색한 요리라고? 그거야…… 뭐…… 의도된 사항이니까! 응!"
1006903-31 = "(루미의 요리를 맛본다.)"
1006903-35 = "[ns3] \"이, 이 맛은…….?!\"\n[ns4] \"써! 혀가 마비될 만큼 써!\"\n[ns5] \"콜록. 이거 뭐가 들어있는 거야……!?\""
1006903-39 = "아, 역시 그런가. 좋아, 좋아. 일단 기록해 두고……"
1006903-43 = "[ns] \"선생님은 조금도 좋지 않습니다, 루미 학생!\""
1006903-44 = "자, 자. 그렇게 흥분하지 말고. 다음 요리도 준비되어 있으니까."
1006903-48 = "(다시, 루미의 요리를 맛본다.)"
1006903-52 = "[ns6] \"느, 느끼해?!\"\n[ns7] \"숨이 막힐 정도로 매운데!?\""
1006903-55 = "그렇단 말이지…… 여기까지는 생각대로네. 자, 이제 마지막 요리야."
1006903-56 = "[s] \"저기, 이 선생님, 더 이상 뭘 맛볼 자신이 없는데……\""
1006903-57 = "하하하. 여기까지 온 이상 마지막까지 함께 해 달라고."
1006903-58 = "가다가 그만두면 안 간 것만 못하다는 말도 있잖아?"
1006903-59 = "그런 말이 분명히 있고, 용법도 맞는 것 같지만, 왠지 억울하다고?"
1006903-60 = "괜찮아, 괜찮아. 살다 보면 그런 일도 겪기 마련이잖아. 선생님은 어른이니까 더 잘 알겠지?"
1006903-65 = "(루미의 요리를…… 맛본다!)"
1006903-69 = "[ns8] \"어, 어라? 이 맛은……?\n[ns9] \"처음 먹어보는 맛인데……?! 조화로워!\""
1006903-72 = "그런가…… 마침내 성공했군."
1006903-73 = "쓴맛은 참 살리기 힘든 맛이지."
1006903-74 = "하지만 소금을 넣어 맛을 정돈하는 것은, 자칫하면 지나치게 짜게 될 위험이 있어 피하고 싶었고."
1006903-75 = "그래서 생각해 본 게 지방과 매운맛을 활용해 보자는 거였어."
1006903-76 = "쓴맛을 너무 강하게 느끼지 않도록 혀를 코팅하고, 미각에 쾌감을 주는 거지. 감칠맛을 첨가하는 것은 덤이고."
1006903-77 = "거기에 기름에 잘 녹는 매운맛을 살짝 추가해, 빠르게 매운맛을 가시게 하면서 개운함을 주려고 했고."
1006903-78 = "선생님의 감상을 보아하니, 성공한 모양이네. 하하하."
1006903-79 = "[s] \"루미는 이런 식으로 요리 개발을 하는 거구나.\""
1006903-80 = "음. 나만의 방식이랄까, 고집이랄까. 그런 거지."
1006903-81 = "맛이란 건 섬세한 녀석이라, 여러 조합을 계속해서 시도해 봐야 해."
1006903-82 = "……시도라는 게 늘 그렇듯이, 도전과 실패가 반복되기는 하지만."
1006903-83 = "[s10] \"훌륭한 자세라고 생각해.\"\n[s11] \"……그것과는 별개로, 왜 현무상회 학생들이 자리를 피했는지 알 것도 같고.\""
1006903-86 = "하하하…… 뭐, 나로서도 우리 학생들을 그렇게까지 괴롭히고 싶지는 않으니까."
1006903-87 = "선생님도 괴롭힘 받고 싶지 않았다고? 음…… 뭐, 마지막에는 성공적인 음식이 나왔으니 괜찮은 것 아닐까!"
1006903-88 = "그 대신이랄까, 보상이랄까. 이 맛의 레시피를 응용해서 다섯 가지 정도의 요리를 더 만들어 볼 생각이야."
1006903-89 = "맛 내기가 정립되었으니 이번엔 자신작들로만 채울 수 있다고."
1006903-90 = "그 전부를 맛 보여 줄 테니까, 기대하라고!"
1006903-91 = "[s12] \"그게 말입니다, 루미 학생……\"\n[s13] \"너무 배가 불러서 더 이상은 못 먹을 것 같은데요……\""
1006903-94 = "응? 시식은 다음으로 미뤄 달라고?"
1006903-95 = "하, 하지만 이런 요리는 영감이 떠올랐을 때 바로 해야 하는 법인데……"
1006903-99 = "선생님? 어디 가는 거야, 선생님?"
1006903-101 = "(어떻게든 자연스럽게 자리를 피하려 해 보았지만, 결국 실패했다.)"
1006903-102 = "(이번에도 배가 터지기 직전까지 요리를 대접받았다……)"
