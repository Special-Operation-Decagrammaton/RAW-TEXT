[translation]
1000108-1 = "상처"
1000108-2 = "양호실"
1000108-3 = "그러니까 많이 다치지 않았다니까……"
1000108-4 = "걱정해 주지 않아도 괜찮아."
1000108-5 = "[s] \"하지만 아직도 피가 나잖아?\""
1000108-6 = "생채기가 나면 피가 나는 건 당연해. 그래야 딱지가 앉고 새 살이 돋을 수 있으니까."
1000108-7 = "그걸 물은 게 아니라고? 그럼……"
1000108-8 = "[s] \"에이미는 좀 더 자신의 몸을 소중히 여기는 게 좋아.\""
1000108-9 = "하지만 전투 중에 몸을 사리면 효율이 떨어지는 걸."
1000108-10 = "다치는 것을 두려워하지 않고 돌진해야 최고의 효율을 얻을 수 있……."
1000108-11 = "아야!"
1000108-12 = "갑자기 소독약을 가져다 대서 놀랐잖아, 선생님."
1000108-13 = "제대로 소독하지 않으면 덧난다고? 그건 이미 알고 있지만……"
1000108-14 = "[s] 에이미를 앉혀 두고 소독을 계속한다."
1000108-19 = "……어쩐지 조금 부끄러운 걸."
1000108-20 = "[s] \"앞으로도 계속 치료해주겠지만, 그래도 다치면 안 돼.\""
1000108-21 = "알겠어. 앞으로는 주의할게."
1000108-24 = "(앞으로도 선생님께 이렇게 치료를 받을 수 있다면…… 일부러 다치는 것도 효율이 나쁘지 않을지도……)"
1000108-26 = "무슨 생각했냐고? 아무것도 아니야."
1000108-28 = "이후, 에이미의 상처에 반창고를 붙여서 돌려보내 주었다."
