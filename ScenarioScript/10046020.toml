[translation]
10046020-1 = "제2화;온천 크라이시스"
10046020-14 = "어째서 여기에 사람이 있는 거죠……? 그리고 뭘 하는 거죠, 지금?"
10046020-18 = "[ns1] \"메구……!?\"\n[ns2] \"저 아이가 왜 여기에…?\""
10046020-24 = "저기, 거기 계신 분! 지금 뭐 하시는 건가요? 당장 멈추세요!"
10046020-25 = "여긴 티파티가 소유한 해변입니다. 당신은 지금 사유지에 들어와 계신 거예요!"
10046020-29 = "……?"
10046020-30 = "저기, 왜 대답이 없……."
10046020-35 = "……응? 아, 사람이 왔네!"
10046020-39 = "게다가 선생님까지! 다들 어떻게 알고 온 거야? 온천은 개장 전인데?"
10046020-43 = "……선생님? 혹시 아시는 분인가요?"
10046020-44 = "[s3] \"……어, 그게…….\"\n[s4] \"그, 침착하고 들어줄래?\""
10046020-47 = "응! 나는 온천개발부의 메구야! 카스미 부장이, 여기에 '온천 개발용 폭탄'을 설치하래서!"
10046020-51 = "……예? 폭탄이요……?"
10046020-52 = "아니, 잠깐만요. 그 이전에……. '온천 개발'? 설마……."
10046020-58 = "온천개발부라니!! 게헨나의 테러리스트 동아리잖습니까!!"
10046020-59 = "이런 날까지도 훼방이라니, 용서 못 합니다, 게헨나!!"
10046020-60 = "……네? 선생님?"
10046020-61 = "우선 진정하라고요? 대화를 해 보라고요……?"
10046020-66 = "진정이요!? 선생님, 그럼 선생님께선 저 게헨나 학생이 그냥 여기 온 거라 생각하시는 건가요!?"
10046020-67 = "설마 훼방이 아니라 뭔가 좋은 의도로 있을 거라고……!? 그런 뜻이신가요!?"
10046020-68 = "[ns5] \"아니, 아무리 나도 그건 아니겠지만……!!\"\n[ns6] \"그렇게 말하고 싶지만 말할 수가 없네!!\""
10046020-71 = "애초에 여기는 사유지입니다! 여기 모습을 보인 것만으로도 불법 침입 아닙니까!?"
10046020-72 = "게다가 지금 뭘 설치하고 있다고요? 온천 개발용 '폭탄'……??"
10046020-73 = "당장 멈추세요!! 이건 정의실현부에서의 명령입니다!!"
10046020-78 = "에……? 어차피 무너질 텐데, 온천으로 만드는 게 좋잖아?"
10046020-79 = "왜 무너진다는 게 전제입니까?! 대체 뭔가요, 그 뻔뻔함은!!"
10046020-80 = "그래도 부장이 '확실히 부서진다'고 그랬는걸?"
10046020-81 = "……??? 그건 또 무슨……."
10046020-82 = "아니죠. 제가 또 술수에 말려들 뻔했군요. 도저히 말이 안 통하네요!"
10046020-83 = "[s7] \"뭐, 원래 그런 친구들이긴 하지…….\"\n[s8] \"나도 매번 말하고는 있지만…….\""
10046020-93 = "멈추라고 했잖습니까!! 역시 말로는 안 되겠군요, 당장 체포하겠어요. 힘으로라도……!!"
10046020-97 = "어? 어……! 안돼, 안돼! 부장이 이건 꼭 설치하고 오라 했단 말이야!"
10046020-98 = "그게 무슨 말도 안 되는……!!"
10046020-103 = "뭐, 뭐죠. 이 힘은……!!"
10046020-115 = "으, 으아……? 으아아아……??"
10046020-116 = "[s9] \"하스미를 들었다……?!\"\n[s10] \"저 기술은, 파워 슬램……?!\""
10046020-127 = "쿨럭, 쿨럭!! 이, 이게 무슨……! 뭐 이런 막무가내가 다 있죠!?"
10046020-128 = "이렇게 몸이 들려서 내팽개쳐진 건 살면서 처음입니다만……!!"
10046020-129 = "그러지 말고 조금만 기다려 줘! 이 폭탄만 설치하면 금방 도망칠 거니까!"
10046020-130 = "그러니까 그게 대체 무슨 말이냐고요!! 어떻게 그걸 대놓고 말할 수가 있습니까!!"
10046020-131 = "[s11] \"뭐……. 메구니까…….\"\n[s12] \"하스미랑은 상성이 안 좋네…….\""
10046020-134 = "[ns13] \"역시 내가 말해 볼 게.\"\n[ns14] \"안 통할 거 같긴 하지만, 혹시 모르니…….\""
10046020-137 = "아뇨, 선생님. 여기는……. 여기는 저에게 맡겨 주십시오."
10046020-138 = "정의실현부로서 이런 취급을 당하고도 그냥 있을 수는 없습니다. 이건 제 자존심 문제예요!"
10046020-139 = "아무리 무기를 전차에 두고 온 상태라고 한들, 맨몸 격투라도 게헨나 학생……."
10046020-140 = "그것도 테러리스트에게 질 수는 없지 않습니까!!"
10046020-144 = "……네?"
10046020-145 = "저쪽은 혼자서 중장비 없이 온천 공사를 완공할 만큼의 괴력이라고요?"
10046020-146 = "……그,"
10046020-151 = "그렇다 해도 게헨나 학생에게 질 수는 없습니다!!!"
10046020-152 = "[ns15] \"그렇겠지. 그렇게 말할 거 같았어.\"\n[ns16] \"역시 역린이었어…….\""
10046020-157 = "다시 갑니다, 게헨나의 괴력녀!! 각오하세요!!"
10046020-158 = "아아~! 얼른 이거 끝내고 돌아가야 하는데!! 조금만 기다려 달라니까!"
10046020-159 = "이쪽은 신경도 안 쓰는 거냐고요!! 대체 절 얼마나 화나게 할 셈인가요!!"
10046020-186 = "뭐, 뭠까? 뭔가 깨지는 소리가 들려서 서둘러 와봤슴다만……!!"
10046020-190 = "……에?"
10046020-200 = "……뭔……???"
10046020-212 = "으으……. 쿨럭, 쿨럭……!!"
10046020-213 = "대, 대체 무슨 일이……."
10046020-218 = "으아아아아-!! 도저히 참을 수 없어요!!"
10046020-222 = "하, 하스미 선배……?"
10046020-228 = "우선 진정을……! 진정하시고, 뭔지는 모르겠지만 우선 대화로……!"
10046020-229 = "뭐든지 좋은 게 좋은 거……니……?"
10046020-236 = "……아! 저번에 부장이랑 같이 기차에 타고 있던 친구! 반가워!"
10046020-242 = "……뭐……."
10046020-244 = "뭐야아아아아아-!?"
10046020-247 = "어, 어째서!? 어째서 온천개발부!? 왜!? 왜 당신이 여기 있는 거죠!?"
10046020-248 = "이번에는 또 뭘 하려고……!!"
10046020-249 = "아니, 뭐든 상관없슴다! 뭐가 됐든 안 돼요! 뭐든 일단 잡아넣고 보겠슴다!!"
10046020-253 = "……네? 선생님, 뭐라고요?"
10046020-254 = "진정이요……?"
10046020-258 = "선생님, 무슨 말씀을 하시는 검까? 설마 온천개발부 분들이 좋은 의도로 여기 왔다고 생각하시는 검까!?"
10046020-259 = "[s17] \"이치카아아아-!?!?\"\n[s18] \"하스미랑 똑같은 소릴…….\""
10046020-262 = "어차피 불 보듯 뻔한 일이겠지요. 지체할수록 피해만 늘어날 게 뻔함다!!"
10046020-263 = "……예?"
10046020-264 = "…'좋은 게 좋은 거'는 어디 갔냐고요?"
10046020-269 = "…온천개발부만큼은 예외임다! 그날 이후 그렇게 정했어요!!"
10046020-270 = "갑니다, 이치카!! 무슨 일이 있어도 이겨야 해요!!"
10046020-274 = "예!! 제가 잡을 테니 선배가 치십쇼!!"
10046020-279 = "으아아아아-!!"
10046020-294 = "무, 뭐가 이렇게……! 말도 안 돼……!"
10046020-295 = "아하하하! 뭔가 씨름 같네!!"
10046020-297 = "집중하세요, 이치카! 상대는 거의 인간이 아닙니다!!"
10046020-303 = "으아아아아-!!"
10046020-316 = "뭐, 뭐야!? 무슨 소리야? 뭔가 깨지는 소리가……!!"
10046020-324 = "……에?"
10046020-341 = "아야야……. 무, 무슨 일이야, 대체……."
10046020-345 = "응? 누가 더 있잖아? 저 아이는……?"
10046020-351 = "으응~ 또 방해하러 온 사람?"
10046020-352 = "이렇게 방해꾼이 많을 때면, 부장이 싸우지 말고 돌아오랬지. 아깝다!"
10046020-353 = "어……? 그냥 돌아가? 아깝다니, 무슨 말……?"
10046020-354 = "음……! 하지만 이럴 때는 무조건 전부 그만두고 그냥 돌아오라 했으니까! 방법은 많다고!"
10046020-355 = "아깝지만 어쩔 수 없지! 부장의 말이니 분명 맞을 거야!!"
10046020-356 = "아니, 잠깐만. 그 전에, 너는……?"
10046020-357 = "그럼 나는 먼저 갈게! 모두 좋은 하루 돼!!"
10046020-363 = "방금 그건, 게헨……나?"
10046020-369 = "어딜 가는 겁니까, 게헨나!! 아직 승부는 끝나지 않았어요!!"
10046020-370 = "온천개발부-!! 용서 못 함다!!"
10046020-375 = "으, 으아아!! 얘들아, 잠깐만!! 우선 진정해!! 멈춰!!"
10046020-377 = "(이후 두 사람을 진정시키고, 미카에게 사정을 설명했다.)"
10046020-380 = "그런 일이 있었구나. 하필이면 오늘……."
10046020-381 = "……죄송합니다, 미카 님. 추태를 보이고 말았습니다."
10046020-382 = "아, 아냐! 나는 전혀 신경 안 쓰니까! 두 사람 입장이면 그럴 수도 있지! 응!!"
10046020-386 = "……응? 선생님?"
10046020-387 = "나는 괜찮냐고? ……왜?"
10046020-388 = "……아. 아아……."
10046020-389 = "하하, 그랬지. 선생님한테는 이래저래 보여줬던 모습이 있으니……. 걱정도 되겠네."
10046020-390 = "그 아이, 아무리 좋게 생각하려 해도, 좋게 생각할 수 없는 일을 하고 있었고."
10046020-391 = "그리고 하필이면 그게 또 게헨나……고."
10046020-392 = "음……. 솔직히……. 조금 그렇긴 하지?"
10046020-393 = "그렇긴 하지만……. 지금은, 얼른 여기를 치우고 정리해 두는 게 우선이라고 생각해."
10046020-394 = "이런 상태를 보면 분명 나기 쨩은 또 신경 쓰여서 못 놀 테니까……."
10046020-395 = "그 온천개발부……? 도 결국 쫓아낸 거고."
10046020-397 = "아니요, 그렇지 않슴다!!"
10046020-401 = "어?!"
10046020-402 = "……이치카?"
10046020-407 = "바로 그 온천개발부임다! 이 장소에 눈독 들인 이상 반드시 돌아올검다!"
10046020-408 = "바캉스 내내 계속 몰려와서 엉망진창으로 만들겠죠! 그때마다 저희는 나기사 님을 속이기 위해 계속 양동으로 연극을 해야 할 테고요!"
10046020-409 = "그 과정에 선생님은 지휘나, 눈속임에 동원되어 눈코 뜰 새 없이 뛰어다녀 녹초가 되겠죠! 안 봐도 뻔함다!"
10046020-410 = "아니, 아니! 아무리 게헨나라 해도, 설마 그 정도는…… 그치, 선생님?"
10046020-411 = "[s19] \"윽……! 머리가……!\"\n[s20] \"……아니라고는 못 하겠네.\""
10046020-416 = "서, 선생님마저?! 그럼 아마 하스미 쨩도……?"
10046020-417 = "……감히 주제넘게 한 마디 올리자면, 게헨나가 상대라면 <상식적으로>는 통하지 않습니다."
10046020-418 = "그리고 무엇보다 이치카의 저 단호한 태도."
10046020-419 = "정의실현부에서도 가장 유연한 사고방식을 가진 이치카가 저리 단언할 정도라면, 틀림없이 근거가 있겠죠."
10046020-420 = "오히려 지금 기회를 놓치면, 더욱 중요한 순간에 방해가 들어올 겁니다."
10046020-421 = "오늘은, 그래도 역시 소란을 만들고 싶지 않은데."
10046020-422 = "알았어. 이건 우리들의 휴가이기도 하지만, 두 사람의 휴가이기도 하니까."
10046020-423 = "온천개발부의 위험이 남아있는 한, 둘은 편하게 쉴 수 없는 거지?"
10046020-427 = "그렇다면, 최대한 빠르게 끝내자."
