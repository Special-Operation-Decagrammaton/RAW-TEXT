[translation]
10052120-1 = "의식"
10052120-11 = "으아아아아아?!?!"
10052120-12 = "2차 방어선이……? 정말로?!"
10052120-17 = "……."
10052120-18 = "현재 상황을 정리하자. 판단은 필요 없어. 사실만 이야기하면 돼."
10052120-20 = "네, 네에……! 나, 남은 예언자들의 구역은…… 이제 둘이에요."
10052120-21 = "[ruby=네차흐]강철대륙[/ruby]의 영역은, 70% 이상 적에게 넘어간 상황입니다."
10052120-22 = "……나머지 두 구역도, 시간을 버는 정도로밖에는 활용될 수 없겠죠."
10052120-24 = "그래. 경향성이라는 것은 무시할 수 없는 요소야. 돌파당하겠지."
10052120-25 = "으, 으으으으……!!!"
10052120-26 = "침착해, 아인. 인정할 것은 인정해야 해. 그래야 그나마 차선의 대책이라도 세울 수 있어."
10052120-27 = "어디, 어디에서부터…… 우리는, 잘못되었을, 까요……."
10052120-28 = "여, 여여여여여, 역시 제가, 너무 그분들을, 얕보았기 때문에……?!"
10052120-29 = "죄송해요…… 죄송해요, 소프. 죄송해요, 오르. 죄송해요…… 언니. 으애애애앵–!!!"
10052120-34 = "쉬잇. 괜찮아요, 아인. 괜찮아요. 이건 그런 문제가 아니에요."
10052120-35 = "꼭 그렇게 생각하기보다는, 츠카츠키 리오라는 상정 외의 변수가 예상치 못하게 끼어들었기 때문일 수도 있죠."
10052120-36 = "아니면 왕녀와 그 [ruby=시녀]열쇠[/ruby] 때문일 수도 있고요."
10052120-37 = "그게 아니면 선생님 그 자체가 문제였던 것일지도 모르지."
10052120-38 = "……."
10052120-39 = "그냥 단순하게, 저쪽의 전투력이 그냥 높았던 것일 수도 있고."
10052120-41 = "우, 우리가 강철대륙을, 예정보다 조금 빠르게…… 전개했기, 때문이었을, 까요……?"
10052120-43 = "그런데 그건 그때 전개 안 했으면…… 지금쯤 언니와 이런 식으로 만나지도 못했을걸요……."
10052120-44 = "그건 맞지……."
10052120-46 = "그래요. 저도 그 점에 있어서는 아인, 소프, 오르에게 감사하고 있어요."
10052120-47 = "언니……."
10052120-48 = "자, 소프도 오르도, 이리 오세요. 안아 줄게요."
10052120-53 = "어, 어어……?"
10052120-61 = "물론 이것이 현실적으로 무언가를 타개할 수 있는 방법은 아니겠지요."
10052120-62 = "보기에 따라서는 무의미하다고도 볼 수 있는 행위이기도 할 거예요."
10052120-63 = "그렇지만, 그래도, 마음은 조금 편해지지 않을까요?"
10052120-64 = "그러다 보면 우리 모두에게 좋은 생각이 떠오를지도 모르고요."
10052120-68 = "흑……. 으애애애앵……."
10052120-69 = "자, 자. 괜찮아요. 실컷 울어요. 여기에는 우리들밖에 없으니까요."
10052120-70 = "괜찮아요. 제가 있으니까요. 언제나 그랬지만, 저는 아인, 소프, 오르와 만날 수 있어서 정말 기뻤어요."
10052120-76 = "자, 우리는 강철대륙, 네차흐의 각 구역에 대한 통제권을 잃어 가고 있어. 그건 현실이야."
10052120-77 = "하지만 다르게 생각해 보면, 아직은 또 그렇게까지 심각한 문제는 아니기도 합니다."
10052120-78 = "저 열쇠…… 케이가 사용하고 있는 신체만 다시 우리들의 것으로 만들면, 어떻게든 복구할 수 있는 부분이기도 하니까요."
10052120-79 = "다, 단순하게 보자면 결국…… 보안 레벨과, 접근 권한의…… 문제니까요!"
10052120-80 = "강철대륙의 확장 역시 멈췄지만, 그것도 어떻게든 해 볼 수 있는 문제지."
10052120-81 = "마찬가지로 우리가 네차흐의 각 구역에 대한 통제권을 회복한다면, 그 즉시 재확장 공정에 들어갈 수 있어."
10052120-82 = "남은 전력은 두 명의 예언자."
10052120-83 = "그리고."
10052120-84 = "저, 로군요."
10052120-85 = "……."
10052120-86 = "이전에는, 저에게 주어진 힘의 출력을, 제 몸의 내구도가 버티지 못했죠."
10052120-87 = "다시 말해 [ruby=강도]내구도[/ruby]의 문제만 해결된다면, 저는 저의 모든 [ruby=출력]가능성[/ruby]을 온전히 낼 수 있을 겁니다."
10052120-88 = "그리고 그건 우리가 할 일이 되겠지요!"
10052120-89 = "네, 네에! 꼭 가장 온전한 모습으로, 언니를 날아오르게 해 드릴게요!!!"
10052120-90 = "거기에 예언자들을 활용할 수 있는 여지도, 아직 약간은 남아 있습니다."
10052120-92 = "어라, 그랬어?"
10052120-94 = "네. 이 부분은 아인이 이야기해 줄 거예요."
10052120-98 = "그, 그게…… 그러니까요……!"
10052120-99 = "강철대륙 안쪽에 자리했던 예언자들은, 네차흐의 일부로 돌아가겠지만……!"
10052120-100 = "강철대륙 외곽…… 조금 독립된 곳에 자리 잡았던 예언자들은, 그 잔해가…… 남게 될 거거든요……?"
10052120-101 = "그렇다는 건 나도 아는데, 그게 왜?"
10052120-105 = "어라, 설마……?"
10052120-106 = "맞아요. 그겁니다."
10052120-107 = "가능한 거야?!"
10052120-108 = "그걸 어떻게든 여기까지 가지고 올 수만 있다면, 요……."
10052120-109 = "아, 운반 쪽 문제가 걸리는 건가……."
10052120-111 = "그것도 가능한 한 들키지 않게 말이죠……."
10052120-113 = "한 가지 조건도 쉽지 않은데, 더 어려운 조건이 붙은 셈이네……."
10052120-114 = "여, 역시 무리인, 걸까요……."
10052120-115 = "……."
10052120-116 = "그렇지만 일이 쉬우면 재미가 없지. 안 그래?"
10052120-121 = "오, 뭘 좀 아는군요. 소프!"
10052120-123 = "저, 정말요?!"
10052120-124 = "응. 레이버들의 생산 여력은, 아직 조금 남아 있으니까."
10052120-125 = "다행이에요! 그러면 저도……!"
10052120-126 = "아냐. 너는 남아야 해, 아인."
10052120-127 = "네, 네에……?! 여, 역시 저같이 도움이 안 되는 아이는……."
10052120-128 = "그런 게 아니야. 네가 가장 중요하기 때문이야. 오히려 이제부터 제일 바빠질 거고."
10052120-129 = "……제, 제가요?"
10052120-130 = "맞습니다. 이제부터 아인이 없으면, 우리는 아무것도 할 수 없을 예정이거든요."
10052120-135 = "네에에에에?!"
10052120-136 = "잘 들어, 아인. 네가 해 줘야 할 일은 크게 두 가지야……."
10052120-144 = "……알겠지?"
10052120-149 = "……."
10052120-150 = "아인? 괜찮나요?"
10052120-156 = "아, 아인?!?!"
10052120-157 = "이런, 역시 부담이 너무 심했나요."
10052120-158 = "하지만, 아인. 부탁이에요. 진지하게 이야기하는 겁니다."
10052120-159 = "아인이 아니면 우리의 가능성은 큰 폭으로 줄어들어요."
10052120-160 = "아인이 해 줘야 할 두 가지 일 중 하나인 말쿠트 언니의 강화는, 뭐 어떻게든 우리가 돌아와서라도 시도해 볼 수는 있어요."
10052120-161 = "하지만 다른 하나는, 아인 밖에 할 수 없는 일입니다. 그건 피할 수 없는 현실이에요."
10052120-166 = "……."
10052120-167 = "알겠어요. 해 볼게요. 아니, 할게요."
10052120-168 = "뭐가 어떻게 되든, 반드시! 죽을 각오로 해 볼게요!"
10052120-169 = "아뇨, 죽을게요!"
10052120-170 = "침착해, 아인. 침착해……. 죽으면 안 되니까. 우리 중 누구도 그러면 안 되니까……"
10052120-171 = "그, 그것도 그렇네요……? 그렇지만, 그래도……."
10052120-172 = "역시, 죽을게요!"
10052120-173 = "물론 비유적인 의미로 한 말이겠지만, 그러지 말자고 이러고 있는 건데 말이죠."
10052120-178 = "……."
10052120-179 = "고마워요, 아인."
10052120-180 = "그러면 제 몸을 잘 부탁할게요."
10052120-181 = "네!!!"
10052120-190 = "실재와 비실재의 구분을 묻는 것은, 이제는 낡은 화법일 것입니다. 그 둘의 차이는, 객체에게 그것이 어떤 의미로 다가오는지 정도니까요."
10052120-191 = "결론적으로 이야기하자면, 둘 사이에는 큰 차이가 없습니다. 가령 허수는 존재합니다."
10052120-192 = "마치 어딘가에, 왼쪽과 오른쪽이 뒤바뀌고 시간이 거꾸로 가는 우주가, 존재할 가능성이 있는 것과 동일하죠."
10052120-196 = "!!!"
10052120-197 = "들었나요, 아리스?"
10052120-198 = "네, 네에! 들었습니다! 그리고 이번에는 그 내용도……!"
10052120-199 = "내용…… 도……."
10052120-200 = "끄앙! 기억하고 있는데 기억할 수 없습니다!"
10052120-201 = "괜찮습니다. 이번에는 저도 들었으니까요. 결국 크게 보아 CPT-반전 우주에 관한 비유였고."
10052120-202 = "네? 반전…… 우주요?"
10052120-203 = "네. 왼쪽과 오른쪽이 뒤바뀌고, 시간이 거꾸로 가는 우주를 뜻하죠."
10052120-204 = "보기에는 이상하겠지만, 그런 우주가 불가능하다는 증거는 없거든요."
10052120-205 = "……그렇다는 건, 그 목소리의 주인은……?"
10052120-206 = "케이? 뭔가 아는 것이 있습니까?"
10052120-207 = "모른다고는 할 수 없습니다. 그렇지만 동시에…… 이야기하기도 어려운 문제네요."
10052120-208 = "죄송합니다. 아리스. 당신에게만은 어떤 것도 숨기고 싶지 않은데, 이건 당신에게만은 말할 수 없는 문제이기도 하겠네요……."
10052120-209 = "……."
10052120-210 = "케이. 그것은 혹시 아리스와 선생님, 우리 모두가 해야 할 일이…… 변해야 하는 문제인가요?"
10052120-211 = "네? 아뇨……. 그렇지는 않을 겁니다. 그렇지만……."
10052120-212 = "으으, 여기서 만에 하나 그게 개입해 온다면……."
10052120-213 = "그렇군요. 그렇다면 아리스는 아리스가 해야 할 일을 계속하겠습니다."
10052120-214 = "알 수 없는 일에 대해 너무 깊이 생각해 봤자, 그다지 좋을 것은 없을 테니까요."
10052120-218 = "……네. 아리스. 그렇게 하죠. 이제 남은 영역은…… 두 곳뿐이니까요."
