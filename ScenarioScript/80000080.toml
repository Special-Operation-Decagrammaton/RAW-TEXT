[translation]
80000080-1 = "최강의 초코사우루스!"
80000080-2 = "(발렌타인 데이 당일 아침.)"
80000080-8 = "선생님! 선생님! 큰일이야!"
80000080-9 = "[s] \"안녕, 카에데. 오늘도 건강해 보이네.\""
80000080-10 = "앗, 그래?"
80000080-11 = "응! 오늘도 건강해! 나 아침에 밥도 잔뜩 먹었고!"
80000080-12 = "[s] \"그래? 다행이네. 건강한 게 최고지!\""
80000080-13 = "에헤헤……"
80000080-14 = "……가 아니라!"
80000080-15 = "물론 선생님이 칭찬해주는 것도 엄청 기쁘고 좋지만!"
80000080-16 = "그보다 선생님! 역시 큰일이야!"
80000080-17 = "[s] \"카에데가 큰일이라고 할 정도라니…… 무슨 일이야?\""
80000080-18 = "그게~ 그게 말이지!"
80000080-19 = "오늘 아침에 TV에서 하는 애니메이션을 보다가 알게 된 건데……."
80000080-20 = "오늘이 발렌타인 데이라는 거 있지?!"
80000080-24 = "[ns] \"아, 응. 그렇……지?\""
80000080-25 = "꿀꺽…… 선생님, 발렌타인 데이라는 건 그거지……?"
80000080-26 = "분명…… 초콜릿과…… 화약과…… 달콤쌉싸름한 맛이 하모니를 이루는 엄청나게 무시무시한 날!"
80000080-27 = "[s] \"저기 카에데, 참고로 정보의 출처는……?\""
80000080-28 = "응? 인터넷인데?"
80000080-29 = "[s] \"카에데! 더 늦기 전에 선생님과 같이 올바른 인터넷 사용법을 공부하지 않으련?!\""
80000080-30 = "공부~? 으으음~"
80000080-31 = "뭐! 좋아!"
80000080-32 = "선생님이랑 공부하는 거 재미있으니까!"
80000080-33 = "그보다~ 그보다 말이야. 선생님!"
80000080-34 = "인터넷에서 본 건데. 어쨌거나 발렌타인 데이라는 건 소중한 사람에게 초콜릿을 선물하는 날이래!"
80000080-35 = "특히나 최고로 치는 건 역시 수제? 초콜릿? 이라는 거 같아서!"
80000080-36 = "나도 직접 초콜릿을 만들고 싶었는데……."
80000080-37 = "미모리 선배랑 츠바키 선배가 불을 쓰는 건 위험하니까. 나 혼자서 하는 건 안 된다는 거 있지?"
80000080-38 = "[s] \"아, 확실히 카에데 혼자서는 위험하지.\""
80000080-39 = "하지만 그렇다고 도움을 받아버리면…… 그건 나만의 수제 초콜릿이 아니게 되잖아?!"
80000080-40 = "그건 싫어. 기왕이면 직접 만든 초콜릿을 선생님에게 선물하고 싶으니까!"
80000080-41 = "[s] \"아니, 직접 만들지 않아도 카에데가 주는 거라면 뭐든 기쁠 거야.\""
80000080-42 = "……정말?"
80000080-43 = "선생님의 말대로 직접 만들지 않아도 기뻐해 준다면……."
80000080-44 = "으으으음~!"
80000080-45 = "아!"
80000080-46 = "선생님! 나 마침 좋은 생각이 났어!"
80000080-47 = "조금만 기다려 봐!"
80000080-56 = "[ns] \"어? 카에데? 저기요……?\""
80000080-58 = "짜잔! 여기 준비해왔어! 선생님!"
80000080-59 = "[s] \"카에데 이건……?\""
80000080-60 = "응! <공룡 발굴 초콜릿>이야!"
80000080-61 = "이게 무슨 초콜릿이냐면~"
80000080-62 = "이 초콜릿 판에는 공룡 화석 초콜릿이 숨겨져 있대!"
80000080-63 = "그게 망가지지 않도록 조심스럽게…… 직접 캐내는 초콜릿이라는 거 있지?!"
80000080-64 = "직접 만드는 수제? 초콜릿? 보다는 부족할지도 모르지만……."
80000080-65 = "그래도 내가 멋지게 공룡 화석을 캐내서……! 나만이 할 수 있는 방법으로! 선생님에게 선물해줄게!"
80000080-66 = "[s] \"카에데…… 요 기특한 아이……!\""
80000080-67 = "그럼 기대하고 있어. 선생님~! 시작한다!"
80000080-69 = "(그 뒤로 카에데의 화석 캐기 챌린지가 시작되었다.)"
80000080-71 = "첫 번째는 티라노사우루스의 화석이야!"
80000080-72 = "그럼 이야아압!"
80000080-77 = "우왕?! 티라노사우루스의 얼굴이 깨져버렸어……!"
80000080-78 = "다, 다음이야! 다음번엔 절대로 실패 안 할 거니까!"
80000080-80 = "두 번째는 트리케라톱스! 뿔이 엄청 멋진 공룡이야!"
80000080-81 = "이번엔 반드시 성공할 거니까……!"
80000080-82 = "이요오옵!!"
80000080-87 = "우와아앙?! 이번엔 트리케라톱스의 몸통이~~!"
80000080-88 = "괘, 괜찮아! 포기 안 해! 아직 하나 더 남았으니까!"
80000080-90 = "마지막 세 번째는……"
80000080-91 = "프테라노돈! 날개가 무지 멋있는 익룡이야!"
80000080-92 = "이거라면……! 성공할 수 있어!"
80000080-93 = "간다아아앗!"
80000080-101 = "(그렇게 카에데가 의욕을 내준 것도 무색하게…….)"
80000080-102 = "(카에데는 가져온 모든 화석 캐기 초콜릿을 실패하고야 말았다.)"
80000080-104 = "우와앙~ 선생님! 하나도 성공 못 했어~"
80000080-105 = "기대하게 했는데…… 이런 결과라니. 미안해~! 선생님!"
80000080-106 = "[s] \"아니, 그건 괜찮은데………\""
80000080-107 = "모처럼의 발렌타인 데이고……."
80000080-108 = "어떻게든 직접 내 손으로 캐낸 멋진 화석 초콜릿을……"
80000080-109 = "선생님에게 선물해주고 싶었는데……."
80000080-110 = "잔뜩 실패하기만 하고……. 훌쩍……"
80000080-111 = "[s] \"카에데.\""
80000080-112 = "……우으?"
80000080-113 = "[s] \"중요한 건 멋지거나 훌륭한 결과물이 아니야.\""
80000080-115 = "[ns] \"카에데가 선물하고 싶단 마음에, 직접 준비해준 것만으로도 충분히 기뻐.\""
80000080-116 = "……그러니…… 부서진 초콜릿으로도 괜찮다고?"
80000080-117 = "선생님이 그렇게 말해주는 건…… 나도 엄청 기쁘지만…… 그래도……."
80000080-118 = "……아!"
80000080-119 = "부서진 초콜릿…… 나만이…… 할 수 있는 방법……이라면……."
80000080-120 = "선생님! 잠깐만!"
80000080-121 = "[s] \"어? 카에데?\""
80000080-125 = "이걸 여기에…… 이렇게 하고…… 이 조각을 여기에 이렇게…… 하면."
80000080-126 = "……됐다! 완성했어!"
80000080-127 = "선생님! 여기! 내가 만든…… 나만의 특별한 초콜릿이야!"
80000080-131 = "이름하여…… <최강의 초코사우루스!> 완성!"
80000080-132 = "[s] \"아! 부서지지 않은 초콜릿 조각을 합친 거구나!\""
80000080-133 = "어때? 이거라면! 평범한 공룡 화석 초콜릿보다도 최강이지?!"
80000080-134 = "[s] \"응. 카에데다운 멋진 선물인걸. 고마워.\""
80000080-135 = "에헤헤헷! 천만에! 그건 그렇고……."
80000080-136 = "초콜릿을 보다 보니 왠지…… 나도 먹고 싶어졌어! 있잖아. 선생님! 나도 같이 먹어도 돼?!"
80000080-138 = "(그렇게 카에데와 함께, 카에데가 직접 만들어준 초코사우루스를 맛보았다.)"
