[translation]
1002905-1 = "실습명: 발굴"
1002905-2 = "(나츠의 안내대로 향한 곳은 트리니티 변두리의 한 상점가였다.)"
1002905-3 = "(오래된 건물들이 많았고, 변두리라 그런지 사람도 보이지 않았으며 폐업한 가게들도 많았다.)"
1002905-4 = "오-. 선생님. 와줬구나. 기쁜 걸."
1002905-9 = "꽤 구석진 곳이라 오기 힘들 줄 알았는데, 용케도 제 시간에 잘 찾아왔네. 하하하."
1002905-10 = "오늘 선생님을 부른 이유는 다름아닌 '세상에서 가장 로맨틱한 일' 중의 하나……."
1002905-11 = "……'발굴'의 순간을 공유하기 위해서야!!"
1002905-12 = "[s1] \"발굴의 순간?\"\n[s2] \"공유하기 위해서?\""
1002905-13 = "응. 나츠 인생에 있어 다시없을 역사적인 대 이벤트의 참관인으로서 선생님이 있어 주길 바라."
1002905-14 = "응. 나츠 인생에 있어 다시없을 역사적인 대 이벤트의 참관인으로서 선생님이 있어 주길 바라."
1002905-15 = "……응? 무슨 이벤트냐고? 뭘 발굴하는 거냐고?"
1002905-16 = "하하. 성급해하지 말라고. 어차피 '그것들'은 도망치지 않으니까."
1002905-17 = "그들은 이미 수도 없이 오랜 세월동안 자리를 지켜온 자들이거든. 이제 와서 몇 분 더 끄는 정도는, 그들은 신경조차 쓰지 않아."
1002905-18 = "후후후. 그야말로 '보물창고'란 말이 이 이상 어울릴 수 없는 곳……."
1002905-19 = "……바로 <잊힌 과자점>이야!!"
1002905-20 = "[s3] \"잊힌 과자점?\"\n[s4] \"버려진 가게란 뜻이야?\""
1002905-21 = "그 말씀대로! 잊힌 과자점이란, 트리니티의 학생들에게 전설처럼 내려져 오는 풍문이자 도시전설!"
1002905-22 = "그 말씀대로! 잊힌 과자점이란, 트리니티의 학생들에게 전설처럼 내려져 오는 풍문이자 도시전설!"
1002905-23 = "길고 긴 이 학교의 역사, 그 역사를 따라 생겨나고 사라졌던 수많은 과자들이 모여 있는 곳!"
1002905-24 = "잊혔기에, 누구도 찾지 않았기에 오히려 보존돼 버린 박물관과도 같은 기적의 창고!"
1002905-30 = "바로 그 곳을, 마침내! 이 나츠가!"
1002905-31 = "찾아내 버린 것입니다! 이곳에 그게 있다는 사실을! 실존하고 있다는 그 단서들을!!"
1002905-32 = "……해서!"
1002905-36 = "……."
1002905-37 = "……이제부터 들어가려고 하는데 왠지 좀 무섭더라고. 아무래도 버려진 폐건물이고 하니."
1002905-38 = "[s5] \"결국 무서우니까 같이 들어가자는 거구나.\"\n[s6] \"아아. 결론이 확실해서 좋네.\""
1002905-39 = "하하하. 에이, 뭘 그래. 대신에 좋은 구경 같이 시켜주는 거니까 서로 퉁 치자고. 응?"
1002905-40 = "하하하. 에이, 뭘 그래. 대신에 좋은 구경 같이 시켜주는 거니까 서로 퉁 치자고. 응?"
1002905-44 = "바로 저기 저 건물이야, 선생님. 봐, 딱 봐도 뭔가 튀어나올 것처럼 생겼지?"
1002905-45 = "저 정도로 음산하게 생겨서야 불량배들도 아지트로 안 쓸 거라고."
1002905-46 = "뭐……. 덕분에 잊힌 과자점이 보존되고 있었던 거겠지만 말이지."
1002905-47 = "자, 그럼 들어간다, 선생님! 출발이야, 출발!!"
1002905-48 = "렛-츠, 고-!!"
1002905-50 = "(나츠를 따라 들어온 폐건물 안은, 나츠의 말대로 상당히 오래되고 낡아 보였다.)"
1002905-51 = "(건물 내 일부 양식은 요즘 쓰이지 않는 장식이나 구조로 돼 있었다. 확실히 오래된 장소였다.)"
1002905-56 = "의기양양하게 들어왔지만 막상 들어오니 무섭긴 한 걸."
1002905-57 = "하지만 이제 곧이야. 내 조사에 따르면, 저기 저 코너 바로 뒤에 그 과자점이 존재한다고."
1002905-58 = "……응? 뭐라고?"
1002905-59 = "막상 갔는데 실제로 없으면 실망이 크겠다고?"
1002905-60 = "……하하."
1002905-61 = "뭐, 틀린 말은 아니지. 막상 갔더니 아무것도 없더라, 텅 비어 있더라. 흔하게 있는 일이야."
1002905-62 = "분명 실망도 하겠지. 이만큼이나 열심히 찾고 믿음을 가져오며 온 곳이니까."
1002905-63 = "……하지만 선생님. 그런 실망도 사랑할 줄 알아야, 비로소 로망을 안다고 할 수 있지 않겠어?"
1002905-64 = "걱정하지 마. 나는 각오가 돼 있다고."
1002905-65 = "기뻐할 각오도, 슬퍼할 각오도 말이지."
1002905-69 = "그럼 이제 여기를 지나서……."
1002905-71 = "이곳에 서면, 분명 저기에……."
1002905-72 = "잊힌 과자점이……."
1002905-76 = "……!!"
1002905-79 = "[wa:450]― 봐봐, 선생님! [wa:1500]대단해……"
1002905-81 = "[wa:100]― 이렇게 [wa:500]가득!!"
1002905-84 = "[wa:750]― 거기에, [wa:1150]이것도 저것도 [wa:750]본 적도 없어!!"
1002905-86 = "[wa:250]― 처음으로 본 [wa:650]과자들뿐이야……!!"
1002905-89 = "[wa:400]― ……아핫. [wa:1500]미안, 미안."
1002905-91 = "[wa:100]― 뭔가 갑자기 [wa:650]맥이 풀려버려서."
1002905-94 = "[wa:1150]― 고마워, [wa:1300]선생님."
1002905-96 = "[wa:100]― 이렇게 [wa:350]어울려 줘서."
1002905-99 = "[wa:1000]― 정말로 [wa:1800]감사하고 있어."
1002905-101 = "― 선생님과 [wa:450]이렇게 있어서 [wa:1600]기쁘고 [wa:1050]즐거워."
1002905-104 = "……응? 뭐라고? 오래된 것들이라 먹을 순 없을 거 같다고?"
1002905-105 = "아하하하. 그 정도야 당연히 알고 있지. 쉽게 예상할 수 있는 거잖아?"
1002905-106 = "그런데도 여전히 기쁘냐고?"
1002905-107 = "……당연하지."
1002905-108 = "먹을 걸 찾으러 온 게 아니었으니까. 역사를 발견하기 위해서였으니까."
1002905-109 = "아~. 정말 완벽한 곳이야. 사진도 잔뜩 찍어서 SNS에 올리고 모두에게 공유 해야지~!"
1002905-115 = "이렇게 잔뜩 업로드를……?"
1002905-117 = "……음……."
1002905-121 = "[ns7] \"……나츠?\"\n[ns8] \"갑자기 취소했어?\""
1002905-122 = "……아니."
1002905-123 = "……아니."
1002905-124 = "괜찮아. 공유는 안 할래. 업로드 취소-."
1002905-125 = "여기가 공유되고 실제로 존재하는 곳이라는 걸 알면, 분명 호기심 가득한 녀석들이 찾아올 거야."
1002905-126 = "그렇게 한 번이 두 번이 되고, 두 번이 열 번이 되는 방문 속에 점점 여기는 지금과 다른 모양새가 되겠지."
1002905-127 = "누군가는 기념품으로 몇 개를 주워 갈 테고, 오가는 동안 바닥의 먼지들도 쓸려서 사라질 테고……."
1002905-128 = "그런 건 싫으니까. 지금의 이 장소는, 지금의 모습 그대로 스스로를 유지해 가길 바라니까."
1002905-129 = "응? 그럼 알릴 수 없는 거 아니냐고?"
1002905-130 = "존재를 증명하고 알리고 싶었던 게 아니냐고?"
1002905-131 = "후후. 맞아. 그야 처음에는 그랬지."
1002905-137 = "……생각이 바뀌었어."
1002905-138 = "응. 괜찮아."
1002905-139 = "알리지 않는다고 해서 선생님과 내가 여기 왔었다는 사실이 사라지진 않으니까."
1002905-140 = "지금 내가 보고 있는 이 광경은, 달라지지 않는 아카이브니까."
1002905-146 = "지금껏 이 장소가 그래 왔듯이. ……앞으로도 계속."
