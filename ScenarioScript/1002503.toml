[translation]
1002503-1 = "작다는 건 불편해!"
1002503-2 = "(슌의 모모톡을 확인하고 바로 매화원으로 달려왔다.)"
1002503-5 = "산해경 <매화원>"
1002503-7 = "[ns] \"슌, 어디에 있는 거야?\""
1002503-8 = "저, 여기 위에 있어요……."
1002503-13 = "[ns] \"안 보이는데…….\""
1002503-14 = "그 쪽이 아니라…… 수납장 위에, 천장 가까이에 있어요……."
1002503-20 = "(슌이 나무 위에 올라간 고양이처럼 수납장 위에서 떨고 있었다.)"
1002503-21 = "[s] \"……어째서 그런 곳에 올라가 있는 거야?\""
1002503-22 = "평소처럼 아이들이 돌아오기 전에 장난감 정리를 해두려고 했는데……."
1002503-23 = "평소에는 쉽게 손이 닿던 곳이라 방심하고 있었는데 막상 올라와보니 너무 높아서 내려가지 못하고 있었어요……."
1002503-24 = "선생님, 언제까지 보고 계실건가요. 빨리 내려주세요."
1002503-25 = "[s] 슌을 들어올려서 내려준다."
1002503-30 = "우으, 몸이 작아지기 전에는 쉽게 오르내릴 수 있는 공간이었는데……."
1002503-31 = "역시 작은 몸은 불편하네요."
1002503-32 = "그나저나 저 위에 아직 정리하지 못한 장난감이 잔뜩 있는데, 이를 어찌해야 할지……."
1002503-33 = "[s] \"내가 대신 정리해 주면 안 되는 거야?\""
1002503-34 = "나이대별로 사용할 수 있는 장난감의 종류가 워낙 다양해서요. 그렇다고 장난감의 분류를 하나씩 말씀드리는 것도 번거롭고……."
1002503-35 = "최소한 높은 곳에 제 손을 닿게 할 다른 방법이 있으면 좋을텐데……."
1002503-37 = "아하, 그 방법이 있었네요!"
1002503-38 = "선생님. 저를 어깨에 올려 목말을 태워주세요!"
1002503-39 = "선생님의 위에 올라 타서 시야가 높아지면, 더 쉽게 장난감을 정리할 수 있을 거예요."
1002503-40 = "어서요~."
1002503-41 = "[s] 슌을 목말 태워준다."
1002503-46 = "와! 높다, 높아~! 예전의 몸보다 훨씬 시야가 높아진 기분이에요!"
1002503-47 = "이 높이라면 높은 곳에 있는 바구니도 쉽게 정리할 수 있겠네요."
1002503-49 = "우, 우앗. 서, 선생님! 떨어지지 않게 다리를 꽉 붙잡아주세요!"
1002503-51 = "(……이후 한동안 슌을 목말 태운 채로 매화원 정리를 도왔다.)"
1002503-53 = "드디어 정리가 끝났어요!"
1002503-54 = "도와주셔서 감사합니다, 선생님."
1002503-55 = "그나저나 한나절 넘게 목마를 계속 태워 주셨는데…… 혹시 무겁지는 않으셨나요?"
1002503-56 = "[s] \"슌이 평소보다 훨씬 가벼워서 문제없었어.\""
1002503-57 = "그렇구나. 다행……."
1002503-59 = "……이 아니라, 그게 무슨 말씀이세요? 전에는 제가 무거웠다는 말씀이신가요?"
1002503-60 = "[s1] \"그게, 그런 뜻이 아니라…….\"\n[s2] \"응.\""
1002503-61 = "변명하셔도 소용없어요!"
1002503-62 = "……!!!"
1002503-63 = "우으…… 저 화났어요!"
1002503-64 = "아무리 [USERNAME] 선생님이라도 그냥은 안 넘어갈 거예요!"
1002503-69 = "자, '높게높게' 해주세요."
1002503-70 = "[s] \"높게높게……?\""
1002503-71 = "네, 양팔을 손으로 잡고 높게 들어올리는 놀이요."
1002503-72 = "평소에는 매화원 아이들이 토라졌을 때 제가 해주었던 놀이지만…… 오늘은 제 기분이 상했으니, 선생님께서 해주셔야겠어요."
1002503-73 = "……설마 지금의 저도 무거워서 해줄 수 없다고는 말씀 못 하시겠지요?"
1002503-74 = "[s3] 슌의 겨드랑이에 손을 넣고 높게 들어올린다.\n[s4] \"높게높게~.\""
1002503-87 = "후후, 직접 해보니 생각보다 즐겁네요."
1002503-88 = "아이들이 왜 이 놀이를 하고 나면 화가 풀리는지 알 것 같아요."
1002503-89 = "어라? 어딜 가시려는 건가요?"
1002503-90 = "아직 제 화는 덜 풀렸다고요!"
1002503-95 = "오늘은 제 화가 풀릴 때까지 계속 어울려 주셔야 해요~ ♥"
1002503-97 = "(한동안 슌에게 '높게높게'를 해주며 즐거운 시간을 보냈다.)"
