[translation]
83306080500-6 = "후우…… 다행히 전부 회수할 수 있었어."
83306080500-7 = "가, 감사합니다! 히나 씨~!"
83306080500-8 = "저 때문에 또다시 엉망이 되는 줄 알고 가슴이 철렁해서……!"
83306080500-9 = "이런 일이 게헨나에선 자주 있는 일이니까. 사사건건 주리를 탓하는 사람은 없어."
83306080500-10 = "무엇보다 주리는, 모두를 위해 노력하고 있으니까. 후우카도, 나도, 다른 학생들도 그 점은 잘 알고 있어."
83306080500-11 = "그, 그런가요……?"
83306080500-12 = "히나 씨의 말씀! 가슴에 스며들어요! 감사합니다!"
