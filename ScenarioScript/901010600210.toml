[translation]
901010600210-7 = ""
901010600210-8 = "สวัสดีค่ะ"
901010600210-9 = ""
901010600210-11 = ""
901010600210-13 = ""
901010600210-14 = "สวัสดีค่ะ! ไม่คุ้นหน้าเลยนะคะ"
901010600210-15 = "เพิ่งย้ายมาอยู่แถวนี้เมื่อเร็วๆ นี้เหรอคะ?"
901010600210-16 = "ค่ะ ฉันมาจาก <FOX EATS>... ผู้ให้บริการครบวงจร ตั้งแต่จัดส่งข้าวกล่อง จนถึงบริการส่งอาหารจากร้านดังค่ะ!"
901010600210-17 = "ไม่นานมานี้เราเริ่มให้บริการส่งอาหารในท่าเรือคาเนะซากิแล้ว ฝากใช้บริการกันเยอะๆ ด้วยนะคะ!"
901010600210-18 = "ดีเลยนะคะ ฉันขี้เกียจออกไปนอกท่าเรือตอนพักกลางวันอยู่พอดี..."
901010600210-19 = "ต่อไปคงต้องใช้บริการบ่อยๆ แล้วละค่ะ"
901010600210-20 = "ว่าแต่ มาที่สถานีห่างไกลแบบนี้ มีธุระอะไรเหรอคะ? มีของจะส่งไปนอกท่าเรือหรือเปล่าคะ?"
901010600210-21 = "อ้อ ฉันไม่ได้จะมาส่งของหรอกค่ะ แค่มีเรื่องสงสัยนิดหน่อย"
901010600210-22 = "ไม่ทราบว่า เราขึ้นรถไฟโดยสารจากสถานีนี้ได้มั้ยคะ?"
901010600210-23 = "ฉันสงสัยว่าเรานั่งรถไฟจากตรงนี้ออกไปข้างนอกได้หรือเปล่าน่ะค่ะ"
901010600210-24 = "ไม่มีรถไฟโดยสารที่วิ่งผ่านประจำหรอกค่ะ... แต่ตอนเช้าตรู่จะมีรถไฟรับส่งคนงานท่าเรือแบบ 2 ตู้ ที่วิ่งระหว่างโรงเก็บรถไฟกับท่าเรืออยู่ค่ะ"
901010600210-25 = "รถไฟขบวนนั้นไม่แวะสถานีอื่น ก็เลยไม่ค่อยมีใครใช้บริการนอกจากคนของท่าเรือ แต่ถ้าคุณอยากขึ้นละก็ ฉันออกตั๋วให้ได้ค่ะ"
901010600210-26 = "อย่างนี้นี่เอง ดูเหมือนว่าจะมีทางออกอื่นนอกจากประตูหลักของท่าเรือสินะคะ"
901010600210-27 = "เอ่อ ฉันขอถามอีกอย่างได้มั้ยคะ?"
901010600210-28 = "ไม่ทราบว่าเมื่อเร็วๆ นี้มีผู้โดยสารชื่อ 'มิยากุจิ' มาขึ้นรถไฟรับส่งคนงานบ้างมั้ยคะ?"
901010600210-29 = "พอดีคนรู้จักของฉันหายตัวไปกะทันหัน ฉันเลยกำลังตามหาตัวอยู่ค่ะ"
901010600210-30 = "เรื่องนั้น... ต้องขอโทษด้วยนะคะ ฉันคงตรวจสอบให้ไม่ได้ค่ะ"
901010600210-31 = "ข้อมูลผู้โดยสารของรถไฟเป็นความลับ ก็เลยเปิดเผยให้บุคคลภายนอกไม่ได้ ต้องขอโทษด้วยนะคะ"
901010600210-32 = "ไม่เป็นไรค่ะ เป็นเรื่องที่เข้าใจได้อยู่แล้ว ขอโทษด้วยค่ะที่ถามเรื่องที่ไม่ควร"
901010600210-33 = "ถ้างั้นก็ ขอให้มีวันที่ดีนะคะ!"
