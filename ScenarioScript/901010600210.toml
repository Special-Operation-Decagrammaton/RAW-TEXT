901010600210-7 = ""
901010600210-8 = "Hello."
901010600210-9 = ""
901010600210-11 = ""
901010600210-13 = ""
901010600210-14 = "Hello! I don't think I've seen you here before!"
901010600210-15 = "Are you new in town?"
901010600210-16 = "From bento delivery to restaurant recommendations! We are delivery agency FOX EATS!"
901010600210-17 = "We recently launched our delivery service at Kanesaki Port, so please check us out!"
901010600210-18 = "That's nice to hear. It was such a hassle leaving the port to get lunch every day..."
901010600210-19 = "I think I'll use this, thank you."
901010600210-20 = "So, what brings you to this remote station? Are you trying to ship something special?"
901010600210-21 = "Oh, no, I don't have mail. But I do have a question."
901010600210-22 = "So this station... Does it have passenger trains?"
901010600210-23 = "I was wondering if I could take a train from here and head home."
901010600210-24 = "We don't have a regular passenger train...but we do have a two-car commuter train connecting the railway depot and the port. It only runs early in the morning, though."
901010600210-25 = "It's an express train for the dockworkers. That means that there are no stops, just a direct line to the depot. I can print a ticket for you if you'd like to board."
901010600210-26 = "I see. Looks like you don't always have to exit through the main gate, then."
901010600210-27 = "Um, can I ask you one more question?"
901010600210-28 = "Has a passenger named \"Miyaguchi\" recently boarded this commuter train?"
901010600210-29 = "He's an acquaintance of mine, and he's fallen off the grid."
901010600210-30 = "Oh... I'm sorry, but I don't think I can tell you."
901010600210-31 = "Train passenger records are confidential, so we cannot release the information. Sorry about that."
901010600210-32 = "That makes total sense. Please don't apologize. I'm sorry to have brought it up."
901010600210-33 = "Have a nice day!"
