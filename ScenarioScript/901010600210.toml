[translation]
901010600210-7 = ""
901010600210-8 = "您好。"
901010600210-9 = ""
901010600210-11 = ""
901010600210-13 = ""
901010600210-14 = "您好！之前好像沒有在這附近沒見過您呢。"
901010600210-15 = "是最近剛來的新人嗎？"
901010600210-16 = "是的，從便當外送到介紹美食店家，不管是什麼都可以幫您配送的「FOX EATS」！"
901010600210-17 = "我們最近在鐘崎港一帶也開始提供外送服務了，還請多多支持！"
901010600210-18 = "那真是太好了。#n我正覺得每次一到午餐時間就得跑到港口外面很麻煩呢……"
901010600210-19 = "看來以後要經常光顧了。"
901010600210-20 = "話說回來，您到這偏僻的車站有什麼事嗎？是有想要寄到港口外的貨物嗎？"
901010600210-21 = "啊，我並不是要寄東西，只是有件事想請教一下。"
901010600210-22 = "請問這座車站也能搭乘載客的客運列車嗎？"
901010600210-23 = "我想知道能不能從這裡搭乘列車到外面去。"
901010600210-24 = "雖然這裡沒有定期停靠的客運列車……#n不過每天清晨會有一班往返鐵道車庫和港口之間的兩節車廂通勤列車。"
901010600210-25 = "因為中途不會停靠其他車站，所以除了港口相關人員以外幾乎沒有人在使用。#n如果您想要搭乘的話，我可以為您辦理車票。"
901010600210-26 = "原來如此。看來除了正門之外，還有其他離開港口的方法呢。"
901010600210-27 = "那個……我可以再請教一個問題嗎？"
901010600210-28 = "請問前陣子有沒有一位名叫「宮口」的人搭乘通勤列車呢？"
901010600210-29 = "最近有位熟人突然消失，我正在尋找他的下落。"
901010600210-30 = "關於這個……很抱歉，恐怕難以為您確認。"
901010600210-31 = "列車的乘客記錄屬於機密資料，無法提供給外部人士，還請見諒。"
901010600210-32 = "不會，您會這麼說也是理所當然的。#n向您詢問了不方便回答的問題，真是抱歉。"
901010600210-33 = "那麼祝您有個美好的一天！"
