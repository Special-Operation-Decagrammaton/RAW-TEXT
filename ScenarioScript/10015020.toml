[translation]
10015020-1 = "2화;밀레니엄의 해커"
10015020-7 = "베리타스 해커 휴게실"
10015020-8 = "……코타마 선배, 뭔가 들려?"
10015020-9 = "주파수 대역 스캔 중…… 현재까지 특별한 이상 동향은 발견되지 않았습니다."
10015020-10 = "으음, 이상하네…… 하레 선배는? 드론 카메라에 뭔가 포착된 건 없어?"
10015020-11 = "응. 이쪽도 영상에 별다른 변화는 없어."
10015020-12 = "아무리 봐도 세미나 집무실에는 아무도 없는 것 같은데……"
10015020-13 = "그럴 리가 없는데. 다시 한번 프록시를 우회해볼까……?"
10015020-19 = "……지금 뭐 하고 있는 거야?"
10015020-20 = "앗, 선배. 마침 잘 왔어. 방금 세미나 집무실의 폐쇄회로 감시장치를 해킹하고 있었거든."
10015020-21 = "세미나의 집무실을……? ……갑자기 왜?"
10015020-22 = "그게, 아까 하레 선배가 에너지 드링크를 사러 편의점에 나갔다가 [USERNAME] 선생님이 유우카 선배와 세미나의 집무실로 들어가는 걸 보았다고 했거든."
10015020-23 = "이런 야심한 밤에 학생과 선생이 남들의 눈을 피해 몰래 만남을 갖다니……"
10015020-24 = "분명 둘이서 몰래 재미있는 일을…… 아니, 수상한 일을 꾸미고 있는 게 분명합니다."
10015020-25 = "진리를 수호하고 지식을 탐구하는 베리타스의 일원으로서, 이를 가만히 두고 볼 수는 없지."
10015020-26 = "자. 치히로 선배도 같이 와서 해킹하는 걸 도와줘!"
10015020-27 = "……어휴."
10015020-28 = "이 시기에 샬레의 선생님이 밀레니엄의 학생회를 방문했다면, 내일 있을 대운동회에 관련된 일 때문이겠지."
10015020-29 = "지나친 억측은 좋지 않아, 마키."
10015020-30 = "하지만……."
10015020-31 = "그리고 마키. 아까 서버의 해킹 건 말인데, 덤프 파일을 뒤져 개인 키를 찾아낸 건 좋은 시도였지만 로그를 지울 때는 흔적이 남지 않도록 주의해."
10015020-32 = "한 시간 전부터 CCTV 서버가 공격받고 있다며 알람이 시끄럽게 울리고 있었거든."
10015020-33 = "나라면 기록을 지우기 전에 논리 폭탄이라도 하나 터트렸을 거야."
10015020-34 = "아, 맞다. 깜박했었네……"
10015020-35 = "어라? 그보다 세미나의 CCTV 서버도 선배가 관리하고 있었던 거야?"
10015020-36 = "……너희들은 어째서 내가 밀레니엄의 보안 자문을 맡고 있다는 사실을 왜 계속 잊어버리는 거야?"
10015020-40 = "……그나저나 너희들은 이번 대운동회에 안 나갈 거야?"
10015020-42 = "대운동회에? 우리가 왜?"
10015020-43 = "도청이라면 모르겠지만, 세미나에서 주관하는 축제에 직접 참가하는 건 사양입니다."
10015020-44 = "게다가 체육 활동은 질색이야……."
10015020-46 = "……역시 그런 반응인가."
10015020-47 = "물론 학생회가 주관하는 행사에, 학생회장과 사이가 나쁜 우리 베리타스가 참가하는 건 이상한 일일지도 모르지만……"
10015020-48 = "대운동회는 세미나 주관의 행사이기도 하지만, 학원을 가리지 않고 모든 키보토스 학생들이 참가하는 평화의 제전이기도 하니까."
10015020-49 = "이 시기만큼은 모두가 소속을 잊고 순수하게 축제를 즐겨주었으면 좋겠는데……"
10015020-51 = "그건 저도 동감이에요. 황륜대제는 차별 없이 공평하게 즐길 수 있는 모두의 축제니까요."
10015020-53 = "[USERNAME] 선생님이랑 노아 선배……? 어, 어느 틈에?"
10015020-55 = "안녕하세요, 여러분. 세미나의 서기, 우시오 노아입니다."
10015020-60 = "[ns] \"안녕. 다들 오랜만이야.\""
10015020-61 = "[USERNAME] 선생님과 노아 선배라…… 꽤나 묘한 조합이네."
10015020-62 = "이렇게 야심한 밤에 세미나의 임원이 베리타스의 부실에는 무슨 일로 찾아온 거지?"
10015020-63 = "그것도 샬레의 선생님까지 대동하고……"
10015020-65 = "후후, 너무 경계하지 마세요."
10015020-66 = "제가 이곳에 찾아온 이유는 여러분들을 훼방 놓으려는 게 아니라, 도움을 하나 요청하고 싶어서거든요."
10015020-67 = "……도움?"
10015020-68 = "알고 계시겠지만 저희 밀레니엄 학원에서 개최하는 <황륜대제>의 개최일이 이제 하루 앞으로 다가왔습니다."
10015020-69 = "저희 세미나에서는 기한 내에 완벽한 행사를 준비하기 위해 여러모로 노력해 왔습니다만……"
10015020-70 = "불운하게도 개회를 앞두고 크고 작은 사고가 잇달아 발생하는 바람에, 그 뒤처리를 하던 유우카 쨩이 과로로 지쳐버려서요."
10015020-72 = "뭐, 유우카 선배는 평소에도 늘 격무에 시달리고 있었으니까……"
10015020-73 = "유우카는 이 기회에 조금 쉬어두는 게 좋다고 생각해."
10015020-75 = "네. 그래서 부득이하게 유우카 쨩이 맡고 있던 <황륜대제>의 전산처리 업무를 다른 학생분께 부탁드리고자 했습니다만……"
10015020-76 = "이런 대형 행사의 전산 처리 작업을 할 수 있는 재원을 찾으려 하니, 아무리 찾아봐도 베리타스의 여러분 이외에는 적임자가 없어서요."
10015020-79 = "후후, 그건 그렇지. 밀레니엄에서 베리타스보다 더 컴퓨터를 잘 다루는 동아리는 존재하지 않으니까!"
10015020-80 = "……생각했던 것보다는 간단한 부탁이네."
10015020-81 = "밀레니엄의 모든 건물에 RF 송신 모듈을 설치할 필요가 없어져서 다행입니다."
10015020-82 = "[s] \"너희는 뭘 하려고 했었던 거야……?\""
10015020-84 = "……뭐, 부원들이 말한 것처럼 전산 처리 작업을 돕는 건 어려운 일이 아니야."
10015020-85 = "하지만 '세미나의 임원'이 베리타스에 이런 부탁을 해도 괜찮겠어?"
10015020-86 = "밀레니엄의 위신이 걸린 <황륜대제>의 준비를, 베리타스와 같은 비인가 동아리에게 맡겼다는 사실이 리오 회장의 귀에 들어가면 꽤나 귀찮아질 텐데."
10015020-87 = "그건 그럴지도 모르겠네요."
10015020-88 = "리오 회장과 히마리 부장 사이의 악연은 저도 익히 들어 알고 있으니까요."
10015020-89 = "괜히 세미나의 이름을 빌렸다가 곤란한 일에 휘말리는 건 저 역시 사양이랍니다."
10015020-90 = "……하지만 세미나의 이름으로 드리는 부탁이 아니라, 저 우시오 노아 개인이 드리는 부탁이라면 어떠신가요?"
10015020-91 = "세미나를 돕는 일이라면 눈치가 보여도, 곤궁에 빠진 후배를 도와주는 일 정도는 괜찮지 않을까요?"
10015020-96 = "……그렇게 말한다면 어쩔 수 없지."
10015020-97 = "리오 회장이야 어찌 되든 알 바가 아니지만, 우리 귀여운 후배님들에게는 죄가 없으니까."
10015020-98 = "후후, 귀엽게 봐주셔서 감사합니다."
10015020-99 = "그래서, 어떤 일을 도와주면 좋을까?"
10015020-100 = "남은 업무 목록은 유우카 쨩이 미리 정리해 둔 문서가 있으니, 이쪽을 참고 부탁드립니다."
10015020-105 = "파손되지 않은 비품의 재고 현황을 파악하고, 선수 명단을 정리해서 관련교에 발송하고……"
10015020-110 = "뭐, 이 정도면 어렵지 않겠어."
10015020-111 = "문서 정리는 매크로를 만들어서 한 번에 처리하고, 비품 정도만 현장에 가서 수량을 체크하면 금방 끝날 것 같아."
10015020-112 = "후후, 역시 베리타스에 부탁하길 잘했네요."
10015020-117 = "아, 참. 그러고 보니 아까 신경 쓰이는 일이 하나 있었는데."
10015020-124 = "내가 자리를 비운 사이, 밀레니엄의 서버에 악의적인 공격 시도가 몇 차례 가해졌던 것 같아."
10015020-126 = "악의적인 공격이라면……?"
10015020-127 = "뭐…… 패킷을 가로채서 데이터를 위조하거나, 바이러스를 심는 크래킹 시도 같은 것 말이지. 다행히 아마추어적인 수법이라 금세 방화벽에 가로막힌 것 같지만."
10015020-128 = "……다만 그 녀석들은 대운동회에 원한이라도 가진 것처럼, 대운동회에 필요한 설비와 기기만을 집중적으로 노려서 공격해왔어."
10015020-129 = "어머, 그것참 우연이네요."
10015020-130 = "안 그래도 아까 엔지니어부의 부장님도 비슷한 말씀을 하셨거든요."
10015020-131 = "우연인지 필연인지는 나중에 밝혀지겠지만……"
10015020-132 = "확실한 건, 운동회를 방해하고 있는 건 외부인이 아니야. 공격자 IP를 역추적해 보니 밀레니엄 학원 내부에서 신호가 잡혔거든."
10015020-133 = "어머나……."
10015020-134 = "오늘 밤은 수상한 학생들이 습격해 올 수도 있으니까…… 선생님도 다치지 않게 조심해."
10015020-135 = "후후, 학원을 방문한 손님을 안전하게 안내하는 것 또한 [ruby=세미나]학생회[/ruby]의 의무니까요."
10015020-136 = "밀레니엄에 계신 동안에는 제가 책임지고 [USERNAME] 선생님을 에스코트하겠습니다."
10015020-138 = "……그러게. 노아와 함께 있다면 큰 걱정은 없겠지만."
10015020-139 = "후후. 신뢰해 주셔서 감사합니다."
10015020-140 = "그럼 저희는 다른 문제를 해결하고 올 테니, 그동안 전산 업무는 부탁드리겠습니다."
10015020-145 = "자, 그럼 우리는 그사이에 노아가 부탁한 서류 업무를 진행해 둘까?"
10015020-146 = "마키, 여기에 있는 선수 명단을 종목별로 정리해 줄래?"
10015020-147 = "아, 선수 명단이라면 이미 깔끔하게 표로 정리해 두었어."
10015020-148 = "……여기 파일."
10015020-149 = "응? 선수 명단은 방금 노아에게서 건네받은 건데, 어떻게 벌써 정리한 거야?"
10015020-150 = "그게…… 이런 일이 있을지도 모르겠다 싶어서, 사전에 선수 명단을 조사해 뒀거든."
10015020-152 = "다양한 학교의 학생 명단을 한 번에 확보할 기회는 드무니까……"
10015020-153 = "각 학교 학생들의 퍼스널 데이터와 같은, 재미있는 정보를 잔뜩 얻을 수 있었습니다."
10015020-157 = "……관리자의 허가도 없이 멋대로 개인정보를 빼내서 가공했다고?"
10015020-158 = "역시 너희들에게는 올바른 해커 윤리에 대해 다시 한번 설명할 필요가 있겠어!"
10015020-159 = "하, 하지만 이번에는 도움이 되었잖아?"
10015020-160 = "한 번만 봐줘, 선배~!"
