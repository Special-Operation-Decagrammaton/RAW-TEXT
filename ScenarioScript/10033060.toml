[translation]
10033060-1 = "제6화;판타지 나이트메어"
10033060-2 = "하아……. 일정은 조금 늦어졌지만."
10033060-3 = "그래도 게헨나 학생분들이 큰일 없이 숙소에 짐을 풀어 주셔서 다행이었네요……."
10033060-4 = "선생님이 많이 도와줬으니까. 응."
10033060-5 = "[ns] \"……엄청났지…….\""
10033060-7 = "그렇지만 스케줄이 어긋나 버린 것에는 변함이 없습니다……."
10033060-8 = "지금 담력 시험 코스를 마지막으로 점검하러 와 있지만, 점검 중간에 바로 학생들을 인솔해 와야 할 것 같습니다!"
10033060-9 = "아, 그거라면 내가 다녀올게."
10033060-11 = "괜찮겠나요, 카에데?"
10033060-12 = "후아암……. 졸리지만, 노력해 볼게! 이것도 멋진 레이디가 되기 위한 수행이니까!"
10033060-16 = "그러면…… 우리도 우리 일을 시작할까?"
10033060-19 = "분명 이쯤에서……."
10033060-25 = "나왔습니다! 안녕하세요! 수고하십니다!"
10033060-26 = "저기…… 너무 과하게 무섭거나 하지는 않았나요?"
10033060-27 = "아뇨. 오히려 귀여워서 좋네요."
10033060-28 = "……담력 시험인데 이래도 되나, 하는 생각이 들기는 하지만요."
10033060-30 = "[ns] \"계획서대로라면 이 근처일 텐데…….\""
10033060-33 = "이런 시간까지, 피곤하겠네……. 나중에 잘 때 숙면 베개라도 빌려줄까?"
10033060-34 = "아뇨, 아뇨. 괜찮아요. 츠바키 부장님의 베개는 다 좋은데…… 너무 편한 나머지, 다음 날 점심까지 일어나지 못하게 된다는 소문도 있고요."
10033060-35 = "그거, 소문 아닌데?"
10033060-36 = "그러면 여러 가지로 더 곤란하지 않나요?!"
10033060-40 = "전체 코스의 3분의 2 정도는 둘러본 것 같네요."
10033060-41 = "다행히 다들 열심히 해 주셔서…… 이번 담력 시험 축제는 성공적으로 마무리될 수 있을 것 같네요. 다행이에요."
10033060-45 = "[ns] \"담력 시험…… 축제?\""
10033060-46 = "아, 생각해 보니 축제는 아니긴 하네요……."
10033060-47 = "그렇지만, 선생님. 이렇게 많은 분들이 담력 시험의 성공을 위해 노력하고, 서로 힘을 합치고, 각자 자기 자리에서 최선을 다하고 있다는 것……."
10033060-48 = "그리고 그 결과로 게헨나 학생분들이 만족감과 해방감을 느낄 수 있다면……."
10033060-49 = "그건 어떤 의미로 이미 축제에 가까운 것 아닐까요?!"
10033060-50 = "[s] \"왠지 설득되기 시작했어!\""
10033060-51 = "그렇죠?! 처음에는 분명, 게헨나 학생분들을 가이드한다는 것이, 어딘가 부담스럽고 무겁게만 다가왔지만……."
10033060-52 = "이 모든 게 축제의 일환일 수 있다고 생각하니, 오히려 힘이 나기 시작했어요!"
10033060-53 = "과연! 마음가짐을 달리하는 것으로, 무겁고 어려운 상황에도 능숙하게 대처할 수 있다는 것이로군요!"
10033060-54 = "불초 피나, 오늘도 많은 것을 배워갑니다! 대단해요, 우미카!"
10033060-55 = "그, 그 정도로 대단한 말을 한 것 같지는 않은데요……."
10033060-61 = "키시시싯. 잘 알고 있군. 진실은 중요하지 않다. 중요한 것은 그것을 바라보는 관점일 뿐!"
10033060-62 = "[ns] \"어……? 이 웃음소리는, 설마?!\""
10033060-63 = "후하하하! 목소리만으로도 존재감을 피력할 수 있다니, 이 마코토 님의 인망이 스스로도 두렵군!"
10033060-64 = "안녕, 백귀야행 언니들! 선생님! 이부키도 왔어!"
10033060-65 = "하아……. 업무 중 실례합니다. 면목 없네요."
10033060-66 = "마, 마코토 의장님?! 그리고 만마전 여러분들!? 이, 이 시간에 여기엔 무슨 일로……?!"
10033060-67 = "후후후. 알면 놀랄걸? 그건 바로……!"
10033060-69 = "응! 이부키가 언니들 응원해 주려고!"
10033060-70 = "아, 말하는 게 늦어 버렸네."
10033060-71 = "뭐, 괜찮아. 귀여워하는 동생이 케이크 위의 딸기를 집어 먹더라도 넓은 아량으로 포용해 주는 것이 또한……"
10033060-72 = "나 쿄고쿠 사츠키의 도량이니까. 후후."
10033060-73 = "킥킥킥……. 그 말 그대로다. 사츠키."
10033060-74 = "만마전의 임원들에게 있어 중요한 것이 바로 그러한 넓은 아량과 포용의 마음인 법."
10033060-75 = "오오……!"
10033060-76 = "……아, 그런가요?"
10033060-78 = "킥킥킥……. 무엇을 숨기랴……! 타 학교의 행사 인원들에게도 아낌없이 응원을 보내는 이 마코토님의 아량 또한 저 드넓은 대해와도 같은 레벨!"
10033060-79 = "으음! 이 몸의 그런 넓은 이해심이 널리 알려진다면, 분명 뭇 게헨나의 학생들 또한 우리 만마전에게!"
10033060-80 = "아니, 좀 더 자세히 말하자면 이 마코토님의 위용에 경탄하고 감탄하고 놀라 자빠지겠지!"
10033060-81 = "과연! 이것이 만마전의 리더! 판데모니움 소사이어티 정점의 풍격……!"
10033060-82 = "그러니까 자기 입으로 말하는 거냐구요."
10033060-84 = "그…… 게헨나의 의장님께서 마음 써 주시는 것은 진심으로 감사드리지만……."
10033060-85 = "응? 그런데 마코토 선배~ 저기 앞에 있는~ 저건 뭐야~?"
10033060-90 = "………?"
10033060-100 = "………아."
10033060-101 = "……와웅."
10033060-102 = "………"
10033060-107 = "우, 우으…… 훌쩍, 훌쩍……."
10033060-108 = "이부키?!"
10033060-110 = "비, 비, 비사아앙~!"
10033060-111 = "사, 사츠키?! 이부키?! 괜찮은 거냐?! 자, 잠시 진정을……"
10033060-115 = "그보다 저건 대체 뭐지?!"
10033060-116 = "!!??"
10033060-117 = "(이런 분장은…… 분명, 계획표에는 없었는데……?!)"
10033060-118 = "(이, 일단 유령 분장 도우미 학생분들께 연락을…….)"
10033060-123 = "네. 가이드 팀인데요. 지금 담력 시험 코스의 유령 분장에 대해서…… 저희가 있는 좌표를 보내 드릴 테니 확인을……."
10033060-124 = "네? 그 위치에는 아무도 배치되어 있지 않다고요? 그렇다는 건……?"
10033060-128 = "이로하 선배, 마코토 선배…… 이부키 무서워……."
10033060-129 = "이부키! 괜찮아요. 무서워할 필요 없어요. 저희가 있으니까."
10033060-130 = "……그보다 뭔가, 심상치 않군요. 백귀야행 분들의 반응도 그렇고."
10033060-136 = "으으읏! 이 녀석들! 나의 최면술로 쓰러트릴 수 있지 않을까?!"
10033060-137 = "……어려울 거라고 생각하는데요."
10033060-139 = "[ns] \"모두 잠깐만……. 저 앞에……?\""
10033060-140 = "다들, 뒤로 피해 있어."
10033060-141 = "이로하! 뭘 하고 있나! 당장 '그것'을 준비해라! 이부키가 울고 있지 않나!"
10033060-142 = "늘 말씀드리는 것 같지만, 그게 뭔지도 모르겠고 당장 준비할 수도 없어요. 여긴 우리 게헨나 학원이 아니라고요."
10033060-143 = "……하지만, 역시 가만히 있을 수는 없을 것 같네요."
10033060-147 = "이부키를 위해, 저희 만마전, 위협을 배제하겠습니다!"
10033060-148 = "으쌰아~! 돌격돌격~!"
