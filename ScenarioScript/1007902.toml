[translation]
1007902-1 = "혹시나 하는 마음에"
1007902-2 = "(미사카가 있다는 시내의 전자상가로 향했다.)"
1007902-7 = "(이런저런 전자기기들을 살펴보고 있던 미사카가 보였다.)"
1007902-11 = "…………."
1007902-15 = "……아, 선생님. 여기야, 여기."
1007902-16 = "응? 전자상가에 볼일이 있냐고? 아니, 딱히 그런 건 아닌데?"
1007902-17 = "주변을 한 번 쭉 돌아다니고 있었을 뿐이야. 마침 선생님과 만난 곳이 여기인 거고."
1007902-18 = "생각보다 볼거리가 많더라고, 여기도."
1007902-19 = "어떻게 보면 별로 차이가 없다 싶으면서도, 또 어떻게 보면……. 똑같은 게 하나도 없더라고."
1007902-20 = "당장 여기 있는 전자제품들도, 전부 내 눈에는 처음 보는 메이커들뿐이잖아."
1007902-21 = "천천히 뜯어보면 전부 처음 보는 것들뿐. 그런데 또 막상 작동 원리나 방식 자체는 크게 다르지 않은 것 같고……."
1007902-22 = "[s1] \"외국에 온 느낌인 걸까…….\"\n[s2] \"완전히 관광객 같은 분위기네.\""
1007902-25 = "그렇지, 그렇지. 그런데 또 지금처럼 대화는 아무렇지도 않게 통하고……."
1007902-26 = "……응?"
1007902-27 = "기계 분석? 그런 것도 가능하냐고? 뭐, 그렇지. 능력이 능력이니까."
1007902-28 = "딱히 분해하거나 뜯어보지 않아도, 안에서 전기가 어떻게 흐르는지를 보면 대충 감을 잡을 수 있으니까 말이야."
1007902-29 = "……물론 아직 딱히 분석해 보진 않았지만."
1007902-34 = "그게, 좀……. 아직도 능력을 쓰려고 하면 머리가 좀 지끈거린달까. 집중이 잘 안된달까……."
1007902-35 = "여기 온 뒤로 쭉 그런 게 좀 있네. 세계가 달라서 그런 걸까……."
1007902-36 = "아. 아프거나 몸이 안 좋은 건 아니니까, 걱정할 필요는 없어. 그저 컨디션이 좀 안 좋다는 느낌."
1007902-37 = "굳이 비유하자면 능력을 쓰는 데에만 뭔가가 거슬린다는 느낌……? 별 건 아니고."
1007902-38 = "그렇지만, 음……."
1007902-39 = "확실히……. 막상 당연하게 쓰던 힘을 잘 못 쓰니, 조금 갑갑하긴 하네."
1007902-40 = "평상시에는 자주 쓰지 않는다고 생각했는데, 어쩌면 무의식적으로 꽤 이런저런 곳에 쓰고 있었던 걸지도."
1007902-44 = "[ns3] \"오히려 좋은 점도 있지 않을까?\"\n[ns4] \"반대로 있어서 답답했던 점은 없어?\""
1007902-47 = "뭐야, 그런 역발상 제안? 그렇게까지 위로받을 정도로 아쉽다거나 주눅 든 건 아닌데."
1007902-48 = "그래도, 뭐……. 그래. 선생님의 이야기니까 한 번 생각 정도는 해볼까."
1007902-49 = "능력이 있어서 오히려 아쉬웠던 점이라……."
1007902-50 = "그런 게 있나? ……전기……. 전기……."
1007902-51 = "……아."
1007902-55 = "어……?"
1007902-56 = "혹시……? 진짜로, 어쩌면……?"
1007902-57 = "[s5] \"……혹시?\"\n[s6] \"뭔가 떠오른 거라도 있어?\""
1007902-60 = "서, 선생님! 잠시만! 잠시만 기다려 봐!"
1007902-61 = "좀 테스트해 볼 게 있어! 금방 다녀올게!!"
1007902-66 = "[ns] 미사카를 따라간다."
1007902-68 = "(먼저 쏜살같이 달려 나간 미사카를 쫓아 근처의 한 골목가로 향했다.)"
1007902-69 = "(겨우 따라잡은 미사카는, 골목가 담벼락 앞에서 풀 죽은 표정으로 서 있었다.)"
1007902-77 = "[ns7] \"……미사카?\"\n[ns8] \"무슨 일 있어? 표정이 안 좋은데.\""
1007902-80 = "…………."
1007902-84 = "[ns9] \"고양이 울음소리?\"\n[ns10] \"응? 이 소리는…….\""
1007902-87 = "으음……. 혹시나 했는데, 약해진 정도로는 어림도 없었나."
1007902-88 = "……아, 미안. 선생님. 말도 없이 혼자 튀어 나갔었네."
1007902-89 = "원래는 전기 능력 때문에 고양이 같은 동물들이 날 피하는 경향이 있었거든."
1007902-90 = "이곳에서는 능력이 많이 약화됐으니, 좀 상황이 나아지려나 싶었는데……."
1007902-91 = "이 정도로는 여전히 도망치는 것 같아서."
1007902-92 = "……하아."
1007902-93 = "이래서야 나쁜 면만 있고 좋은 면은 없는 게……."
1007902-94 = "…………."
1007902-95 = "……응?"
1007902-96 = "야생이니까 그런 걸 수도 있다고?"
1007902-97 = "약해진 건 사실이니, 경계심이 적은 녀석이면 만지는 것 정도는 가능할지도 모른다……?"
1007902-104 = "……정말 그럴까? 선생님?"
1007902-105 = "[s11] \"확신까지는 아니지만…….\"\n[s12] \"테스트해서 나쁠 건 없으니까……?\""
1007902-108 = "……음. 확실히 그러네."
1007902-109 = "좋아! 선생님 말대로, 아직 포기하긴 이른 걸지도 모르지!"
1007902-110 = "가 보자고! 어디 좋은 곳이라도 알고 있어? 고양이 카페라든가, 펫숍 매장이라든가!"
1007902-111 = "앞장서 줘, 선생님!"
1007902-113 = "(이후 기대감에 가득 찬 미사카와 함께 근처의 펫숍과 고양이 카페를 순회했다.)"
1007902-124 = "(……안타깝게도, 결과는 이전과 마찬가지였다.)"
