[translation]
3101-1 = "가치의 증명 1"
3101-2 = "세미나 회의실"
3101-8 = "……이만하면 올 사람은 다 모인 것 같네."
3101-9 = "그럼 지금부터……"
3101-14 = "제28회 밀레니엄 예산심의위원회를 개최하겠습니다~"
3101-19 = "다들 알고 있겠지만, 이 예산심의위원회는 각 동아리의 연구, 개발 계획을 검토하여 다음 분기의 예산을 책정하는 정례 회의야."
3101-20 = "지난 분기보다 좀 더 많은 예산을 할당받고 싶다면…… 조금이라도 더 쓸모 있는 제품을 기획하여 증명하면 되는 거지."
3101-21 = "지난 예산심의위원회 때는 작년과 마찬가지로 실용성이라고는 조금도 찾아볼 수 없는 괴작들만 가득했지만……"
3101-22 = "이번에는 부디 좀 더 쓸모 있는 제품을 심사할 수 있으면 좋겠네."
3101-25 = "그럼, 첫 번째 심사 대상은…… 신소재개발클럽에서 제안한 <부드러운 시멘트>입니다!"
3101-26 = "부드러운 시멘트……?"
3101-31 = "네! 저희 신소재개발클럽에서 새롭게 배합한 특제 시멘트입니다!"
3101-32 = "……시멘트가 부드럽다는 게 무슨 뜻이야?"
3101-33 = "다들 알고 계시겠지만 석회 가루와 모래를 섞어 만든 시멘트는 성형이 용이한 데 비해, 물성이 단단하여 오래전부터 건축가에게 널리 사랑받아왔었죠."
3101-35 = "하지만 시멘트에도 단점이 있었으니…… 그건 바로 굳어지면 지나치게 단단해진다는 점입니다!"
3101-36 = "건물은 사람이 살기 위한 장소! 그런데 건물에 닿는 사람의 몸은 시멘트 벽보다 훨씬 연약하니, 넘어지거나 부딪히면 크게 다칠 수도 있었죠."
3101-37 = "하지만 이 특제 <부드러운 시멘트>로 만든 벽과 바닥은 완전히 굳어도 표면이 부드럽기 때문에 다칠 염려가 없답니다!"
3101-39 = "경화된 석고가 혼합물에 따라 부드러워질 수 있다니…… 이건 기존에 보고된 적 없는 새로운 발견이네요."
3101-41 = "으음, 확실히 흥미로운 발견이긴 하지만……"
3101-42 = "이 정도로 물성이 부드럽다면 다른 건축자재로 쓰이는 철근이나 벽돌의 무게를 어떻게 버틸 수 있는 건데?"
3101-43 = "어…… 그러니까 그 점은…… 아직 연구의 여지가 남아 있기 때문에……"
3101-47 = "애초에 충격을 견디기 위해 만들어진 시멘트를 일부러 부드럽게 만들다니……."
3101-49 = "기각이야!"
3101-54 = "그, 그럴 수가~"
3101-55 = "다음!"
3101-57 = "다음 심사 대상은 무로카사 아카네 양이 제안한 <궁극의 먼지떨이>입니다."
3101-64 = "어라? 아카네? C&C에서도 연구 기획서를 제출했다고?"
3101-65 = "(소근) C&C의 예산은 작전 규모에 따라 별건으로 챙겨주고 있을 텐데…… 갑자기 비용이 필요한 문제라도 발생한 거야?"
3101-66 = "아뇨. 이 발명품은 C&C의 작전에 필요한 물건이 아니라, 저 개인이 드리는 제안입니다."
3101-67 = "비록 평소에는 C&C의 일원으로서 봉사와 청소에 전념하는 삶을 살아가고 있지만……"
3101-68 = "저도 일단은 밀레니엄 사이언스 스쿨의 일원인바."
3101-69 = "새로운 아이디어를 제시해서 학원의 기술 발전에 이바지할 수 있다면 기쁠 것 같아서요."
3101-71 = "과연, 창의와 혁신을 지향하는 밀레니엄의 학생다운 모범적인 자세네요."
3101-72 = "……뭔가 불안한데."
3101-73 = "일단 들어나 보지. 이 <궁극의 먼지떨이>는 기존의 먼지떨이와 어떻게 다른 건데?"
3101-75 = "저는 그동안 청소를 할 때 이 먼지떨이를 주로 애용해왔답니다."
3101-76 = "하지만 청소를 하다 보면 먼지떨이로는 쉽게 제거되지 않는 얼룩이나 이물질을 마주할 때가 많거든요."
3101-77 = "그때마다 다른 도구를 찾으러 돌아가는 것도 번거롭고, 여러 개의 청소도구를 휴대하는 데에도 한계가 있습니다."
3101-81 = "그래서 생각해낸 것이 바로 이 궁극의 먼지떨이…… <압축가스 분사 장치가 장착된- 궁극의 먼지떨이>입니다!"
3101-85 = "압축가스 분사 장치……?"
3101-86 = "네, 먼지떨이에 달린 버튼을 누르면 끝에서 고온의 압축가스가 분사되어 대상을 말끔히 연소시킨답니다!"
3101-87 = "이 <궁극의 먼지떨이>를 사용하면 잘 지워지지 않는 얼룩도, 끈적거리는 이물질도 깨끗하게 태워 청소할 수 있어요."
3101-88 = "불을 써서 이물질을 완벽하게 태워버리는 청소도구라……"
3101-89 = "세간에서는 그런 걸 화염방사기나 토치라고 부르고 있지만."
3101-90 = "어라, 그런가요? 꽤 참신한 아이디어라고 생각했는데……."
3101-91 = "이미 존재하는 기성품을 제작하기 위해 개발비를 재투자할 필요는 없겠지."
3101-93 = "이 제안은 불허야. 다음!"
3101-95 = "다음은……"
3101-99 = "어머나. 지난 밀레니엄 프라이스에서 특별상을 받았던 게임개발부의 모모이 양이 제출한 제안서네요."
3101-104 = "후후…… 유우카가 아무리 냉혹한 계산의 회계라 하더라도 내가 가져온 완벽한 제안서를 보면 투자를 하지 않고서는 못 배길걸?"
3101-109 = "불허—"
3101-110 = "자, 잠깐! 어째서 듣지도 않고 결정하려는 거야?!"
3101-111 = "그야 뻔하지. 매일 제대로 된 부 활동도 하지 않고 게임만 하는 게임개발부가 제대로 된 제안서를 가져왔을 리가……."
3101-112 = "펴, 편견이야! 우리도 제대로 할 때는 제대로 하거든?"
3101-113 = "게다가 이번에는 최신 기술을 활용한 확실한 수익 모델도 가지고 왔다고!"
3101-114 = "……최신 기술을 활용한 수익 모델?"
3101-115 = "응. 이 제안서는 블록체인…… 뭔가 하는 최신 기술을 응용한 게임 기획서야!"
3101-116 = "보통 게임을 하면 게임 머니가 쌓이잖아? 이 기술을 사용하면 게임에서 쓰이는 가상 화폐를 현금처럼 사용할 수 있다고 하더라고."
3101-117 = "그럼 앉아서 게임을 하기만 해도 돈을 잔뜩 벌 수 있겠지? 후후……."
3101-118 = "발상은 그럴듯하네. 암호화폐를 사용하면 게임 머니를 안정적으로 현금화할 수 있을 테니까."
3101-119 = "하지만 게임 머니와 교환되는 현금은 누가 지불하는데?"
3101-120 = "……어? 현금……?"
3101-121 = "그건…… 세미나에서 계속 발행하면 되지 않을까……?"
3101-126 = "역시 허가할 수 없어!"
3101-132 = "결국 이번에도 다 꽝이었나……."
3101-133 = "제가 보기에는 그래도 제법 괜찮은 제안서도 꽤 있던걸요."
3101-137 = "특히 새로운 고도기술 분야의 특허를 사용한 발명품은 지난 분기에 비해 37%나 증가했네요."
3101-138 = "그럼 뭐해! 새로운 기술을 응용해서 만드는 물건들이 하나같이 괴작 뿐인데!"
3101-139 = "……도대체 왜 이렇게 다들 실용성 없는 연구에 진심인지 이해할 수가 없다니까."
3101-140 = "연구의 구체적인 방향성을 결정하는 건 저희의 몫이 아니니까요."
3101-141 = "그리고 지금은 무의미한 연구처럼 보여도, 먼 훗날에는 유용한 기술을 개발하는 데 필요한 초석이 될지도 모르잖아요?"
3101-142 = "……마치 세미나가 연구하고 있는 <천년 난제>처럼 말이죠."
3101-143 = "……."
3101-145 = "세미나— 밀레니엄의 전신이라 할 수 있는 이 학생회 조직은, 본래 '현재의 기술로는 절대 풀이가 불가능하다고 알려진 7개의 난제'를 해결하고자 하던 연구자들의 모임이었죠."
3101-146 = "이 난제를 해결하기 위해 수많은 검증과 실험이 이루어졌고…… 이를 보조하기 위해 연구 조직을 늘려나가며 완성된 형태가 현재의 밀레니엄 사이언스 스쿨."
3101-147 = "물론 지금에 이르러서는 난제의 개념조차 이해하지 못한 학생들이 대부분이겠지만요."
3101-148 = "이들이 사고하고 시험하는 개개의 연구들이 일곱 개의 난제를 해결하기 위한 과정이자 수단이라는 사실만큼은 여전히 유효합니다."
3101-149 = "……그래. 기술 발전의 가능성이 조금이라도 남아있는 한 밀레니엄에서 행해지는 모든 사고와 실험은 장려되고 권장되어야 마땅하지."
3101-151 = "하지만 이 실험들이 난제를 해결하는 데 도움이 될지 예측할 수는 없어도, 당장 다음 달의 예산이 어떻게 될지는 예측할 수 있으니까."
3101-152 = "학생들의 호기심을 모두 해결해주려 했다가는 그전에 학원이 파산해 버릴 거야……."
3101-153 = "후후, 우수한 연구자는 비용이나 시간과 같은 현실적인 문제에 무지한 경우가 많으니까요."
3101-154 = "밀레니엄 학원이 유우카 쨩처럼 우수한 회계를 두고 있어서 정말 다행이에요~"
3101-155 = "……그거 놀리는 거지?"
3101-156 = "그렇게 밀레니엄의 재정 상황에 걱정이 많았다면 아까 좀 도와줄 것이지."
3101-157 = "아까 인공지능 연구부에서 제안한 <기폭 여부를 스스로 판단하는 폭탄>의 쓸모에 대해 반론하고 있었을 때, 노아가 한마디 거들어주었더라면 좀 더 설득이 쉬워졌을 텐데……"
3101-158 = "유감스럽지만, 저는 세미나의 '서기'니까요."
3101-159 = "우수한 서기는 어떤 상황에서도 사견을 개입시키지 않고 중립적으로 상황을 기록해야 하는 법이랍니다."
3101-160 = "……그 원칙, 지나치게 편리주의적이지 않아?"
3101-161 = "뭔가 내가 불리할 때만 중립을 지키는 것 같은데……."
3101-162 = "후후, 그래도 제가 유우카 쨩을 좋아한다는 사실만큼은 거짓이 아니랍니다?"
3101-163 = "네, 네. 어련하시겠어요……"
3101-167 = "……그나저나 이 문서는 뭐지?"
3101-168 = "아까 예산심의 과정 중에 발견하지 못하고 누락한 제안서가 아닐까요?"
3101-169 = "그럴 리가. 심의를 요청한 동아리의 명단은 하나도 빠짐없이 확인했을 텐데."
3101-173 = "어디 보자. 제안서를 작성한 사람이……"
3101-179 = "……베리타스의 부장?"
