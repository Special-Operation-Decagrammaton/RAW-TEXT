[translation]
1011505-1 = "놓칠 수 없는 것"
1011505-3 = "[ns] \"엄청난 열기구나…….\""
1011505-4 = "네! 이번 경기야말로 유서 깊은 두 라이벌 팀 사이의 경기니까요!"
1011505-5 = "양 팀의 팬들은 서로, 사이가 좋으면서도 나쁜 기묘한 관계를 형성하고 있는 것으로도 유명하죠!"
1011505-6 = "어떤 사람들은 이 두 팀의 경기를, '전통의 일전'이라고 부르기까지 한답니다!"
1011505-8 = "으앙…… 으아앙……!"
1011505-9 = "어라? 어딘가에서 환호성 사이에 섞인 울음소리가……?"
1011505-13 = "엄마…… 아빠…… 어딨어……?"
1011505-14 = "서, 선생님? 이건……."
1011505-15 = "[s] \"사람이 너무 많아서, 부모님을 잃어버렸나 봐.\""
1011505-16 = "어, 어떻게 하죠?"
1011505-20 = "아, 네! 그렇죠! 일단은 야구장 운영 측에 실종 신고를……. 당연한 건데 생각하지 못했네요."
1011505-21 = "이쪽으로 오세요, 선생님. 길은 제가 알고 있으니까요."
1011505-27 = "자, 부모님을 찾을 때까지 우리들이 같이 있어 줄게. 괜찮지?"
1011505-28 = "정말……?"
1011505-30 = "(그렇게 운영 측에 아이의 실종 신고를 한 뒤.)"
1011505-31 = "(아이와 함께 아이의 부모님을 기다리기로 했다.)"
1011505-33 = "그래서 혹시 야구는 좋아하니?"
1011505-34 = "야구…… 잘 몰라. 그냥 엄마 아빠가 간다길래 따라왔어."
1011505-35 = "그런데 엄마 아빠는 없어졌고, 안 보이고…… 히잉……."
1011505-36 = "괘, 괜찮아. 괜찮아! 우리가 쭉 같이 있어 줄 테니까!"
1011505-42 = "어? 파울 볼이 이쪽으로……?"
1011505-44 = "어디, 어디……!"
1011505-51 = "잡았다! 이야, 오늘은 운이 좋은데!"
1011505-52 = "……."
1011505-56 = "공, 가질래?"
1011505-57 = "야구공……?"
1011505-58 = "야구는 말이지. 다른 공으로 점수를 내는 경기와는 조금 다른 부분이 있어."
1011505-59 = "뭔데……?"
1011505-60 = "공으로 점수를 내는 경기에서는 공이 소중해. 그래서 웬만해선 경기 중에 공을 바꾸지 않지. 경기 중에 관중들에게 공을 주지도 않고."
1011505-61 = "하지만 야구는 약간 달라. 야구에서는 사람이 점수를 내거든. 그래서 공에 집착하지 않아."
1011505-62 = "그래서 야구는…… 경기 중에도 관중들에게 많은 공을 나눠주고는 해. 이런 식으로. 베푸는 경기라고도 할 수 있지."
1011505-63 = "공들은 떠나고, 사람은 [ruby=홈 플레이트]  집  [/ruby]으로 돌아오는 경기. 멋지지 않니?"
1011505-64 = "그런 거 몰라……."
1011505-65 = "그, 그러니……?"
1011505-71 = "<쓰리 스트라이크…… 아웃!>"
1011505-75 = "저거 봐! 삼진 아웃이야! 조금 전 파울로 스트라이크 카운트가 하나 늘었으니까, 타자가 조급해진 거야!"
1011505-76 = "그걸 노려서 한 번 아래로 떨어지는 변화구로 심리전을 유도한 다음……."
1011505-77 = "가운데에 강하게 꽃아 넣는 직구로, 아웃카운트를 당당하게 잡아낸 거지! 정면 승부야!"
1011505-81 = "그런 거 몰라! 모른다구!"
1011505-82 = "엄마 아빠는 분명 나보다 야구가 좋은 걸 거야……. 이렇게 될 때까지 찾아와 주지도 않고……."
1011505-83 = "야구가 뭐가 재밌다고! 농구나 축구처럼 빨리 뛰지도 않고, 뭐가 휙휙 바뀌는 것도 아니고!"
1011505-84 = "공 잡을 때도 그냥 멍하니 서 있다가, 가까이 오는 거 잡는 게 전부고……."
1011505-85 = "이게 뭐야! 엄마도 아빠도 다 미워……. 야구도 미워!"
1011505-86 = "……."
1011505-87 = "(야구가, 재미없다…….)"
1011505-88 = "(그러고 보면, 아주 어릴 때는 나도…….)"
1011505-89 = "그거 아니? 야구는 원래, 재미없게 플레이하는 게 맞는 스포츠라는 걸."
1011505-90 = "[s] \"그건 저도 흥미가 생기는 이야기로군요. 레이 해설가님.\""
1011505-91 = "서, 선생님도요……?"
1011505-95 = "크흠. 그러니까 이런 거야. 야구에서 가장 중요한 목적은 재미없게 한 이닝을 막아내는 거지."
1011505-96 = "세 타자가 모두 초구 땅볼이나 플라이를 쳐서 삼자범퇴가 나는 것…… 그게 가장 좋은 경우니까."
1011505-97 = "정식 경기에서는, 가장 재미없지만, 절대로 실수가 없도록 잡아내는 것이 가장 중요한 것이거든."
1011505-98 = "그러니까 야구는…… 보이지 않는 곳에서 가장 열심히 해야 하는 운동이야."
1011505-99 = "가장 아무렇지도 않은 모습을 보이기 위해, 가장 재미없는 모습을 보여 주기 위해서, 죽을힘을 다해 발버둥 쳐야 하는 운동인 거지."
1011505-100 = "나는 말이지. 그 역설적인 모습이 참 좋아."
1011505-101 = "백조 알지? 백조는 우아하게 떠 있지만, 그렇게 하기 위해서 필사적으로 물 갈퀴질을 한다고 하잖아?"
1011505-102 = "평범한 모습을 보여 주기 위해서, 보이지 않는 곳에서는 항상 최선을 다해야 한다는 것……."
1011505-103 = "그건, 어딘가 멋진 면이 있는 거 아닐까?"
1011505-105 = "……."
1011505-106 = "그럴, 까?"
1011505-107 = "그렇지!"
1011505-108 = "응……."
1011505-109 = "야구, 나쁘지 않을지도……."
1011505-110 = "그렇지?"
1011505-116 = "6번 타자. 떨어지는 변화구를, 제대로 노려 쳤습니다!"
1011505-117 = "우중간 외야에 떨어진 안타! 1루를 거쳐 2루로 달려갑니다!"
1011505-118 = "뛰어! 뛰라고! 1루타를 2루타로 만드는 거야!"
1011505-119 = "빠르다……! 수비가 2루로 공을 던졌어! 그리고 다리를 뻗었는데?"
1011505-120 = "슬라이딩이야! 판정은……!?"
1011505-124 = "세이프! 세이프입니다! 호쾌한 준족이었습니다! 1루타를 2루타로 만들어냅니다!"
1011505-125 = "좋았어!"
1011505-126 = "와!"
1011505-127 = "어때?"
1011505-128 = "재미있어!"
1011505-129 = "응!"
1011505-131 = "(경기는 그렇게 계속해서 열기를 더해 갔고.)"
1011505-132 = "(아이의 부모도, 이내 모습을 드러냈다.)"
1011505-133 = "(상당히 사색이 되어…… 아이를 찾고 있었다는 것 같았다.)"
1011505-135 = "고맙습니다……. 고맙습니다……. 이 은혜를 어떻게 갚아야 할지……."
1011505-136 = "괜찮니? 얼마나 걱정했는데……. 정말로 미안하다. 무사해서 다행이야."
1011505-137 = "괜찮아! 여기 선생님이랑 누나랑 놀고 있었어!"
1011505-138 = "그럼, 선생님! 누나! 나 갈게! 오늘 재미있었어! 고마워!"
1011505-143 = "다행이었네요. 그리고…… 조금이지만, 기분 좋은 일이었어요. 헤헤."
1011505-144 = "[ns] \"나도 레이의 야구론에 감탄했어.\""
1011505-145 = "네, 네?! 제, 야구, 뭐요?"
1011505-146 = "……."
1011505-147 = "노, 놀리지 마세요. 선생님."
1011505-148 = "[s] \"놀리는 거 아닌데?\""
1011505-149 = "그러면 부끄러운 소리 하지 마세요……."
1011505-151 = "(레이는 그렇게 이야기하며 모자를 깊이 눌러썼지만.)"
1011505-152 = "(그 귀는, 이미 끝까지 빨개져 있었다.)"
