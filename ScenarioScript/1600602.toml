[translation]
1600602-1 = "소녀가 여름을 즐기는 방법"
1600602-2 = "(이즈미의 연락을 받고 찾은 바다의 집, 그곳엔 이미 많은 사람이 모여 있었다.)"
1600602-4 = "앗, 선생님이다!"
1600602-6 = "선생님, 너무 늦었잖아~!"
1600602-7 = "흐에에에- 이러는 사이에 상품이 다 떨어져버릴지도 몰라아-!"
1600602-8 = "[s1] \"으음, 미안, 이즈미.\"\n[s2] \"그보다 사람이 엄청 많네…….\""
1600602-9 = "그러게~! 다들 그 이벤트에 참가하러 왔나 봐!"
1600602-10 = "그러게~! 다들 그 이벤트에 참가하러 왔나 봐!"
1600602-11 = "자, 여기 이벤트 광고지야!"
1600602-13 = "[s] \"……모래뺏기 게임 대결?\""
1600602-14 = "응! 맞아! 선생님! 모래뺏기 게임 대회!"
1600602-15 = "이 게임에서 승리하면, 여기 이곳 바다의 집에서 파는 명물 <시바풍 로코모코>를 공짜로 먹을 수 있대!"
1600602-16 = "로코모코라~ 어떤 맛일까~ 분명 로코모코한 맛이겠지? 츄릅……."
1600602-17 = "[s] \"엄청 기대되는 모양이네.\""
1600602-18 = "응! 타바, 아니 로코모코니까!"
1600602-21 = "[ns] \"……응?\""
1600602-22 = "게임……. 종료!!!"
1600602-23 = "아! 지금 막 앞 팀 게임이 끝났나 보다!"
1600602-25 = "이번 게임의 승자는……."
1600602-26 = "가게 주인입니다!"
1600602-27 = "훗."
1600602-29 = "욕심부리지 말고 모래는 조금만 가져오자고 했잖아!"
1600602-30 = "이제 와서 그런 소리를 해봤자……."
1600602-32 = "참고로 여기 가게 주인장께서는 무려 모래뺏기 게임 키보토스 챔피언십 우승 15년의 경력을 가진 경력자!"
1600602-33 = "어쩌면 당연한 결과일지도 모릅니다!"
1600602-35 = "이거 사기 아냐?!"
1600602-36 = "자, 패배한 분들에겐 벌칙이 있습니다!"
1600602-37 = "바로 이것, 우리 가게의 별미 <차바스코 야자주스>입니다!"
1600602-38 = "한 번에 쭉 들이켜 주십시오!"
1600602-39 = "에잇, 까, 까짓 것 마셔주겠다고!"
1600602-45 = "크억?!"
1600602-46 = "허윽!?"
1600602-51 = "이것이 인생의 쓴맛이다. 애송이들."
1600602-52 = "자, 그럼 다음 도전자! 입장해주세요!"
1600602-55 = "선생님! 다음은 우리 차례야! 가자!"
1600602-56 = "[s3] \"잠깐, 게임에서 지면 벌칙이라고?\"\n[s4] \"그런 말은 못 들었…….\""
1600602-57 = "그런 말은 됐고! 승리해서 별미를 따내자! 와아-!"
1600602-58 = "그런 말은 됐고! 승리해서 별미를 따내자! 와아-!"
1600602-60 = "흠, 다음 도전자는 자네들인가?"
1600602-61 = "응! 여름의 별미를 먹으러 왔어!"
1600602-62 = "방금 전의 경기를 보고도, 당당히 먹으러 왔다는 그 당찬 선언……."
1600602-63 = "좋다! 그 도전! 받아주마!"
1600602-64 = "그럼 경기이이이이! 시작합니다!"
1600602-65 = "그럼 나부터 시작하지."
1600602-67 = "(스윽)"
1600602-68 = "처음부터 4분의 1이나 되는 모래를 가져가는 과감한 수! 과연 챔피언입니다!"
1600602-69 = "그럼 도전자 콤비는 어떻게 나올 것인가!"
1600602-70 = "도전자 힘내라!"
1600602-71 = "하지만 과연 챔피언을 이길 수 있을까?"
1600602-72 = "[s] \"그럼 먼저 이렇게…….\""
1600602-74 = "……한 주먹의 양이라, 평범하군."
1600602-75 = "잠깐이나마 기대했는데, 나를 이겨 별미를 손에 넣겠다는 그 포부는 어디로 간 거지?"
1600602-76 = "[s5] \"아니, 그건 그냥 이즈미가 멋대로…….\"\n[s6] \"그보다 이거 그렇게 진지한 게임이이었어?\""
1600602-77 = "다음은 내 차례야!"
1600602-78 = "다음은 내 차례야!"
1600602-79 = "자아~! 얼마나 가져와 볼까아~"
1600602-80 = "많이? 적게?"
1600602-81 = "음~ 고민되지만……."
1600602-82 = "도전자! 과연 어떻게 나올 것인가!!"
1600602-83 = "여기서 자칫 실수라도 해서 패배했다간, 저희 가게의 별미인 차바스코 야자주스를 증정!"
1600602-84 = "지옥에서 찾아온 주스를 피하기 위해선, 신중하게 임해야 합니다!"
1600602-85 = "흥. 어차피 초심자. 여기선 잠자코……."
1600602-87 = "에잇."
1600602-88 = "도전자!! 여기서 엄청난 수를 던졌습니다!"
1600602-89 = "앗! 모래를 절반 이상이나 한꺼번에……!"
1600602-90 = "저랬다간 바로 막대가 쓰러져버릴 텐데?!"
1600602-91 = "[s] \"이, 이즈미?!\""
1600602-92 = "아냐! 잘 봐! 막대가……!"
1600602-93 = "아슬아슬하게 서있어?!"
1600602-95 = "뭐……라고?! 방금 그 기술은……. 설마!"
1600602-96 = "10년 전……. 나와 챔피언 자리를 다투던 모래해변의 금빛 전갈……."
1600602-97 = "그 녀석의 필살기……! 만년설 반쪽 가르기의 기술을 재현했다고?!"
1600602-98 = "만년설? 뭐야? 그게에?"
1600602-99 = "아, 근데 막대는 안 쓰러졌네. 아쉬워라."
1600602-100 = "[s] \"……잠깐 이즈미 씨?\""
1600602-101 = "흐에, 차바스코? 가 아니라. 왜, 왜애 선생님?"
1600602-102 = "[s] \"너, 방금 일부러 지려고 했지?!\""
1600602-104 = "아, 아니야! 아닌 게 아닌 게. 그게 아니라아-!"
1600602-105 = "나, 난, 어디까지나. 진심을 다해서."
1600602-106 = "게임에서 그, 상품으로 벼, 별미를 먹으려고……."
1600602-107 = "[s7] \"네가 노리던 별미라는 게, 로코모코가 아니라.\"\n[s8] \"차바스코 야자주스였어?!\""
1600602-108 = "아, 그게, 그러니까……."
1600602-109 = "아, 그게, 그러니까……."
1600602-110 = "……."
1600602-111 = "하, 하지만 어쩔 수 없잖아! 게임에서 져야만 먹을 수 있다니까!"
1600602-112 = "거기다 게임에 참가하려면 콤비로 참가했어야 했구!"
1600602-113 = "[s] \"아니, 그래도……!\""
1600602-114 = "후후후. 간만에 피가 끓어오르는 군."
1600602-115 = "흐에?"
1600602-116 = "이런 뜨거운 경기, 과연 몇 년 만에 맛보는 감각인지……!"
1600602-117 = "좋다! 지금부터 나도 전력을 보여주마!"
1600602-118 = "[s] \"저쪽은 또 왜 저렇게 뜨거운 건데?!\""
1600602-120 = "간다!"
1600602-122 = "흐에에에-?!"
1600602-123 = "뭔지 모르지만! 나, 나도 갈래애!!!"
1600602-131 = "나의……. 패배다."
1600602-135 = "이번 모래뺏기 게임의 승자는……."
1600602-136 = "도전자들입니다!"
1600602-137 = "오오오오!!!"
1600602-138 = "[s] \"이……, 이겼다.\""
1600602-140 = "흐에에에엥?! 왜, 왜 이긴 거야?! 선생님?!"
1600602-141 = "이겨버리면 차바스코 야자주스를 못 먹잖아-!"
1600602-142 = "인터넷에서 다들 후기로 '먹고 나서 입안이 얼얼해!', '입안에 찾아온 지옥!', '후후, 차바스코란 어떤 아이일까?' 하고 말하길래."
1600602-143 = "잔뜩 기대했었는데에에!!!"
1600602-144 = "[s] \"진심으로 먹을 생각이셨구만!\""
1600602-145 = "걱정마라. 간만에 날 불타오르게 한 너희의 열정. 내 가슴에 닿았다."
1600602-146 = "바라는 대로, 특별히 로코모코뿐만 아니라, 그쪽에 있는 아가씨에게 경의를 표해서."
1600602-147 = "<차바스코 야자음료>까지 전부! 증정하마!"
1600602-150 = "와아아! 정말? 진짜지?"
1600602-151 = "와! 해냈다! 선생님!!"
1600602-152 = "[s] \"이것이 여름의 친절……!\""
1600602-158 = "자, 그럼 선생님! 같이 먹자!"
1600602-159 = "자아. 여기 빨대! 먼저 한 입 먹어! 선생님! 아-앙!"
1600602-160 = "(해맑게 웃고 있는 이즈미 앞에서 차마 거절할 순 없었다.)"
1600602-162 = "(그날 하루종일 화장실에서 벗어나질 못했다.)"
