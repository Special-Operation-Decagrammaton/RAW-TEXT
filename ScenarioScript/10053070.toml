[translation]
10053070-1 = "第7話;最後的怪談"
10053070-3 = "啊，木乃香君，老師。"
10053070-4 = "發生什麼事了嗎？再晚一點我們就要去找你們了……"
10053070-5 = "咦，等等！？ 兩個人怎麼都滿身大汗！？ 真的發生了什麼事嗎！？"
10053070-10 = "呃……完全不想說……太不吉利了……"
10053070-11 = "[ns1] 「什麼都沒發生……！」\n[ns2] 「經歷太多事了……」"
10053070-16 = "……看來是發生了什麼事呢？"
10053070-18 = "（向兩人說明了事情的來龍去脈。）"
10053070-19 = "（最後，也說了前一天看到的可疑巴士和石頭人偶的事。）"
10053070-22 = "什麼！？ 那輛巴士是鬼！？ 為什麼不告訴我！？"
10053070-23 = "講了你一定會怕死吧……"
10053070-24 = "撒鹽！快撒鹽！"
10053070-25 = "老師，汗也是鹽，應該也有效吧！？"
10053070-27 = "[ns3] 「算灰色地帶吧……？」\n[ns4] 「總之，我回去想先洗澡……」"
10053070-32 = "如果剛才聽到的都是真的，那你們經歷的應該是騷靈現象。"
10053070-33 = "通常騷靈現象被認為是幽靈移動物品的現象，但不自然的急劇溫度變化也是代表性現象之一。"
10053070-37 = "但是，總覺得有點奇怪，我也自認在業界待了很久。"
10053070-38 = "以我目前為止經歷的靈異現象，還不如來這裡之後遇到的多，而且頻率太快太頻繁了。"
10053070-42 = "翼也這麼想啊。"
10053070-43 = "果然是有人在背後操控嗎？"
10053070-44 = "咦？不是……我只是想說這個地方的超自然現象密度很高而已。"
10053070-45 = "也許這個村子地下藏著古代文明的遺跡，或是存在著外星人的秘密實驗區。"
10053070-46 = "原來你是認真的……"
10053070-50 = "……果然是七罪人嗎？"
10053070-51 = "按常理來說這些事一件都不可能發生的事吧，不如說是有人針對我們做的，這樣才說得通。"
10053070-52 = "七罪人中有能做出這種事的人嗎？"
10053070-57 = "嗯……只要不是鬼我都無所謂……"
10053070-58 = "如果是「那傢伙」的話，策劃並準備這一切也不奇怪。"
10053070-59 = "那傢伙？難道跟之前說的越獄犯是同一個人嗎？"
10053070-60 = "……沒錯，就是那個越獄犯。"
10053070-61 = "嗚嗚……討厭，為什麼偏偏槌之子在這種地方……"
10053070-62 = "不，反過來想，正是因為這種地方才有槌之子嗎！？"
10053070-68 = "啊，車來了，總之先坐計程車回住處……"
10053070-72 = "再想想──"
10053070-76 = "……？"
10053070-79 = "……？？？？"
10053070-81 = "喂！你們這些傢伙！你們這些混蛋！"
10053070-82 = "好像……混了很多東西？"
10053070-83 = "到這地步與其說害怕不如說是無語……"
10053070-84 = "不坐就算了還威脅要開罰單！！"
10053070-85 = "動不動就用槍砸爛一切！！"
10053070-86 = "而且以常識來想誰會挖8m把東西埋了！！！！"
10053070-89 = "看起來好像非常生氣……"
10053070-90 = "他是哪來的臉敢說常識？"
10053070-91 = "就算是木乃香，看到這個不會是害怕而是……"
10053070-93 = "哇啊！！那是什麼啊！？"
10053070-94 = "啊，不對，完了。"
10053070-96 = "都是那個灰色頭髮的……！都是那傢伙害的……！"
10053070-97 = "從現在開始讓你們見識什麼是真正的恐怖！！"
10053070-99 = "它正在朝木乃香君衝過去！危險！"
10053070-101 = "啊啊，啊啊……"
10053070-103 = "完了！完全進入恐慌狀態了！"
10053070-104 = "喂，既然是怪談就用恐怖來決勝負啊！！不要用物理攻擊！！"
10053070-106 = "最後的怪談就是，自己成為怪談！！"
10053070-107 = "別胡扯！！你既不是怪談也不是什麼其他東西吧！？"
10053070-108 = "…………咿。"
10053070-110 = "怕到連尖叫聲都出不來啦！！這下就結束了！！"
10053070-111 = "不行！！這樣下去木乃香君會被撞上的！！嗚嗚！！"
10053070-112 = "老，老師！！"
10053070-113 = "[ns5] 「嗯，我來想辦法！」\n[ns6] 「大家帶著木乃香逃跑……！」"
10053070-119 = "…………"
10053070-124 = "呀啊啊啊啊──！！！！！"
10053070-129 = "…………"
10053070-132 = "…………"
10053070-136 = "痛死啦啊啊啊啊啊！！！！"
10053070-137 = "啊啊！！硬死了，真的是！！！！"
10053070-141 = "蛤……？我看了什麼……？"
10053070-142 = "你看到了嗎，翼？"
10053070-143 = "[s7] 「用拳頭……砸壞了……」\n[s8] 「嗯，是很漂亮的正拳。」"
10053070-146 = "咦，不是……怎麼會，到最後還是……"
10053070-147 = "這合理嗎……？"
10053070-148 = "（嘶嘶……）"
10053070-149 = "翼？喂，翼？"
10053070-155 = "老師，他昏過去了！！"
10053070-157 = "啊啊～真的是糟透了～我想回家～"
10053070-159 = "（……就這樣，未知的怪談事件什麼都沒有查明就虛無地結束了。）"
10053070-163 = "（然後那天晚上……）"
10053070-166 = "竟然在那種危機時刻昏過去……作為探險班的隊長真是丟臉。"
10053070-167 = "話說回來，那個情況是怎麼解決的？"
10053070-173 = "那個，怎麼說……不知怎麼的就……"
10053070-174 = "世上沒有魔法，但我知道有時候會有比那更神奇的事……"
10053070-176 = "……？"
10053070-177 = "雖然不太清楚，但解決了嗎？"
10053070-178 = "解決……解決嗎……"
10053070-179 = "其實發生了什麼我到現在都還沒完全明白，老師呢？"
10053070-180 = "[s9] 「至少我知道這不是普通的情況。」\n[s10] 「繼續待在這裡似乎不安全。」"
10053070-183 = "老師也這麼想嗎？"
10053070-184 = "等一下，槌之子怎麼辦！？"
10053070-185 = "你還想找槌之子啊……？"
10053070-186 = "本來就是我的厄運招來了鬼，所以要找到槌之子才能解決啊？"
10053070-188 = "兩個人的想法各不相同啊……"
10053070-189 = "話雖如此，時間已經很晚了現在很難再去別的地方找。"
10053070-190 = "總之今天先睡，明天早上再決定怎麼辦吧。"
10053070-191 = "為什麼都是你在主導啊……不過我倒是同意你說的。"
10053070-196 = "……師。"
10053070-201 = "老師。"
10053070-202 = "[s11] 「怎麼了？木乃香？」\n[s12] 「睡不著嗎？」"
10053070-208 = "老師，噓……"
10053070-209 = "現在窗外有人。"
10053070-210 = "[s13] 「什麼？」\n[s14] 「誰？從什麼時候開始的？」"
10053070-213 = "不知道，我和所長都是剛剛才注意到的。"
10053070-214 = "準確地說，我是看到木乃香君醒了才注意到的……"
10053070-215 = "不管是誰，他此時此刻正在監視著我們……#n很可能就是迄今為止發生的事件的幕後黑手。"
10053070-221 = "如果我們的推測是對的，是七罪人之一的……"
10053070-222 = "「密井響子」。"
10053070-227 = "木乃香君，按照我拜託你的行動，相機已經設置好了，可以立即拍攝。"
10053070-228 = "……好，那我數到三就上。"
10053070-229 = "一……二……"
10053070-230 = "上啊啊啊啊──！！！！！"
10053070-239 = "呼嗯！？咦！？怎麼了！？"
10053070-245 = "……明明有人的？跑哪去了？"
10053070-246 = "你們都有看到吧？剛才明明有人。"
10053070-247 = "嗯有，我也確信在木乃香君開窗之前肯定有人。"
10053070-248 = "但是他就像從一開始本來就不存在一樣消失了……？"
10053070-249 = "啊，對了，所長，照片呢？"
10053070-250 = "現在正要確認，但別抱太大期待。"
10053070-251 = "剛才不是說數到三再上嗎……"
10053070-257 = "大家怎麼了？發生什麼事了？老師？"
10053070-258 = "[s15] 「窗外好像有人。」\n[s16] 「可能是這次事件的幕後黑手。」"
10053070-261 = "外面有人？窗外？"
10053070-262 = "……？"
10053070-263 = "怎麼了？沒睡醒嗎？"
10053070-264 = "不對吧，按常理來說不是有點奇怪嗎？"
10053070-269 = "這裡是2樓耶？"
