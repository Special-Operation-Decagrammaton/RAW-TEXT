[translation]
10053070-1 = "第7話;最後的怪談"
10053070-2 = ""
10053070-3 = "啊，木乃香君，老師。"
10053070-4 = "發生什麼事了嗎？#n要是再晚一點的話，我們就要去找你們了呢……"
10053070-5 = "咦，等等！？你們兩個怎麼都滿身大汗的！？#n真的發生什麼事了嗎！？"
10053070-6 = ""
10053070-8 = ""
10053070-9 = ""
10053070-10 = "啊～這個嘛～我實在很不想說耶……真的太不吉利了……"
10053070-11 = "[ns1] 「什麼都沒發生……！」\n[ns2] 「經歷太多事了……」"
10053070-14 = ""
10053070-15 = ""
10053070-16 = "……看來是發生了什麼事呢？"
10053070-18 = "（向兩人說明了事情的來龍去脈）"
10053070-19 = "（後來也提到了前一天看到的可疑巴士和石頭人偶的事）"
10053070-21 = ""
10053070-22 = "什麼！？那輛巴士是鬼！？#n為什麼不早點跟我說啊！？"
10053070-23 = "想也知道你八成會嚇個半死嘛……"
10053070-24 = "撒鹽！快點撒鹽！"
10053070-25 = "老師，汗水裡面也有鹽分，應該多少有效吧！？"
10053070-26 = ""
10053070-27 = "[ns3] 「可能算是灰色地帶……？」\n[ns4] 「總之回去之後我想先洗澡……」"
10053070-30 = ""
10053070-31 = ""
10053070-32 = "如果剛才聽到的都是真的，你們所經歷的應該是[ruby=Poltergeist]騷靈現象[/ruby]。"
10053070-33 = "雖然一般人對它的認知大多停留在「幽靈移動物品」……#n其實不自然且急劇的溫度變化，也是一種典型的騷靈現象哦。"
10053070-34 = ""
10053070-36 = ""
10053070-37 = "但是……總覺得有點奇怪。#n我自認已經在業界打滾了很久……"
10053070-38 = "然而在來到這裡之後碰見的靈異現象，卻比我至今為止遇到的還要多。#n而且發生的頻率實在太快、太頻繁了。"
10053070-39 = ""
10053070-41 = ""
10053070-42 = "翼也這麼想啊。"
10053070-43 = "果然是有人在背後操控嗎？"
10053070-44 = "咦？沒有……我只是想表達這裡的超自然現象密度很高而已。"
10053070-45 = "搞不好這個村莊的地下隱藏著古代文明的遺跡，或者外星人的祕密實驗區也說不定。"
10053070-46 = "原來你是認真的啊……嗯，也是啦。"
10053070-47 = ""
10053070-49 = ""
10053070-50 = "……果然是七罪人嗎？"
10053070-51 = "照理來說，這些事光是發生一件都已經很不合理了。#n與其相信這一切都是偶然，我覺得認定有人刻意針對我們還比較合理。"
10053070-52 = "在七罪人之中，有能夠引發這種事的人嗎？"
10053070-53 = ""
10053070-55 = ""
10053070-56 = ""
10053070-57 = "唔嗯……只要不是鬼，其實對方是誰我都無所謂啦……"
10053070-58 = "如果是「那傢伙」的話，就算這一切都是他策劃並準備的也不奇怪。"
10053070-59 = "那傢伙？該不會跟之前說過的越獄犯是同一個人吧？"
10053070-60 = "……很遺憾，事情正是如此。"
10053070-61 = "嗚嗚……討厭，為什麼槌之子偏偏出現在這種地方啊……"
10053070-62 = "不……反過來說，就是這種地方才有槌之子嗎！？"
10053070-63 = ""
10053070-65 = ""
10053070-66 = ""
10053070-67 = ""
10053070-68 = "啊，車來了。#n總之先搭計程車回去……"
10053070-69 = ""
10053070-72 = "再來思考後續的……"
10053070-73 = ""
10053070-76 = "……？"
10053070-79 = "……？？？？"
10053070-81 = "喂！你們這些混蛋！"
10053070-82 = "怎麼……好像混入了很多東西？"
10053070-83 = "到了這種程度與其說是害怕，不如說是無言以對……"
10053070-84 = "不搭車就算了，居然還威脅要開罰單！！"
10053070-85 = "動不動就拿槍亂砸一通！！"
10053070-86 = "而且從常理來想，哪有人埋東西會埋到8m深的啊！！"
10053070-87 = ""
10053070-88 = ""
10053070-89 = "感覺對方的怨氣很重耶……"
10053070-90 = "怎麼還好意思提到「常理」這個詞啊？"
10053070-91 = "就算是木乃香，看到這個與其感到害怕……"
10053070-93 = "哇啊啊啊！！那是什麼啊！？"
10053070-94 = "啊，不對，完蛋了。"
10053070-96 = "都是那個灰色頭髮的……！都是那傢伙害的……！"
10053070-97 = "接下來就讓你們見識真正的恐怖吧！！"
10053070-99 = "朝木乃香君衝過去了！危險！"
10053070-101 = "啊啊，哇啊啊……"
10053070-103 = "不行！完全進入恐慌狀態了！"
10053070-104 = "喂，既然是怪談就用恐怖來決勝負啊！！不要用物理攻擊好不好！！"
10053070-106 = "最後的怪談，就是我自身化為怪談！！"
10053070-107 = "少在那邊胡說八道！！#n你根本不是什麼怪談吧！？"
10053070-108 = "…………噫。"
10053070-110 = "怕到連尖叫聲都發出不來啦！！#n這樣就結束了！！"
10053070-111 = "糟了！！這樣下去木乃香君會被撞上的！！"
10053070-112 = "老，老師！！"
10053070-113 = "[ns5] 「嗯，我來想辦法！」\n[ns6] 「大家趕快帶著木乃香逃跑……！」"
10053070-119 = "…………"
10053070-120 = ""
10053070-124 = "呀啊啊啊啊──！！！！！"
10053070-129 = "…………"
10053070-130 = ""
10053070-131 = ""
10053070-132 = "…………"
10053070-133 = ""
10053070-135 = ""
10053070-136 = "痛死我了──！！！！"
10053070-137 = "啊啊！！這玩意也太硬了吧！！！！"
10053070-139 = ""
10053070-140 = ""
10053070-141 = "我剛才……看見了什麼……？"
10053070-142 = "你看到了嗎，翼？"
10053070-143 = "[s7] 「用拳頭……砸壞了……」\n[s8] 「真的是一記很漂亮的正拳。」"
10053070-146 = "不是……怎麼直到最後還……"
10053070-147 = "這合理嗎……？"
10053070-148 = "（嘶嘶……）"
10053070-149 = "翼？喂，翼？"
10053070-150 = ""
10053070-152 = ""
10053070-153 = ""
10053070-154 = ""
10053070-155 = "老師，他昏過去了！！"
10053070-157 = "啊啊～真的是糟透了～我想回家～"
10053070-159 = "（於是未知的怪談事件，似乎就這樣在不明不白的情況下結束了）"
10053070-160 = ""
10053070-163 = "（然而，就在當天晚上……）"
10053070-165 = ""
10053070-166 = "居然在那種危險關頭昏了過去……作為探險班的隊長真是無地自容。"
10053070-167 = "話說回來，當時是怎麼克服那個情況的呢？"
10053070-168 = ""
10053070-170 = ""
10053070-172 = ""
10053070-173 = "怎，怎麼說呢……總之就是想辦法處理掉了……"
10053070-174 = "世界上雖然沒有魔法，不過偶爾也會發生比那更神奇的事呢……"
10053070-176 = "……？"
10053070-177 = "我有點聽不太懂，所以是解決了嗎？"
10053070-178 = "解決……解決啊……"
10053070-179 = "其實，我到現在還是完全搞不清楚發生了什麼事情……老師你呢？"
10053070-180 = "[s9] 「至少能確定這個狀況不太尋常。」\n[s10] 「繼續待在這裡好像不太安全。」"
10053070-183 = "老師也這麼想嗎？"
10053070-184 = "不不不，那槌之子該怎麼辦啊！？"
10053070-185 = "你還想繼續找槌之子嗎……？"
10053070-186 = "本來就是我的厄運招來了鬼，所以要找到槌之子才能解決啊？"
10053070-188 = "兩個人的想法各不相同呢……"
10053070-189 = "不過現在已經很晚了，要馬上移動到其他地方恐怕很困難。"
10053070-190 = "總之今天先好好休息，明天早上再決定該怎麼辦吧。"
10053070-191 = "不是，你為什麼老是擺出一副隊長的樣子啊……雖然我也同意你的提案就是了。"
10053070-196 = "……師。"
10053070-197 = ""
10053070-199 = ""
10053070-200 = ""
10053070-201 = "老師。"
10053070-202 = "[s11] 「怎麼了？木乃香？」\n[s12] 「睡不著嗎？」"
10053070-205 = ""
10053070-207 = ""
10053070-208 = "老師，噓……"
10053070-209 = "現在窗外有人。"
10053070-210 = "[s13] 「什麼？」\n[s14] 「誰？從什麼時候開始的？」"
10053070-213 = "不知道。我和所長都是剛剛才注意到的。"
10053070-214 = "準確來說，我是看到木乃香君醒了才注意到的……"
10053070-215 = "不管是誰，既然連這種時候都在監視著我們……#n對方很可能就是至今為止所有事件的幕後黑手。"
10053070-216 = ""
10053070-218 = ""
10053070-220 = ""
10053070-221 = "如果我的推測正確的話，就是七罪人當中的其中一人……"
10053070-222 = "「密井響子」。"
10053070-223 = ""
10053070-225 = ""
10053070-226 = ""
10053070-227 = "木乃香君，我已經按照你的要求架設好相機了。#n隨時可以開始拍攝。"
10053070-228 = "……很好，那我數到三就動手。"
10053070-229 = "一……二……"
10053070-230 = "上啊啊啊啊──！！！！！"
10053070-231 = ""
10053070-233 = ""
10053070-234 = ""
10053070-235 = ""
10053070-236 = ""
10053070-237 = ""
10053070-239 = "唔喵！？嗯！？怎麼了！？"
10053070-241 = ""
10053070-244 = ""
10053070-245 = "……剛才明明還在那裡的啊？跑到哪裡去了？"
10053070-246 = "你們也都看到了吧？剛才確實有人在那裡。"
10053070-247 = "嗯，在木乃香君開窗之前肯定有人。這點我也可以確定。"
10053070-248 = "但是他就像從一開始本來就不存在一樣消失了……？"
10053070-249 = "啊，對了。#n所長，照片呢？"
10053070-250 = "現在正要確認，不過最好不要抱著太大的期待。"
10053070-251 = "剛剛明明說好數到三才上的……"
10053070-252 = ""
10053070-254 = ""
10053070-256 = ""
10053070-257 = "大家怎麼了？發生什麼事了？老師？"
10053070-258 = "[s15] 「窗外好像有人。」\n[s16] 「可能是這次事件的幕後黑手。」"
10053070-261 = "外面有人？你說窗外？"
10053070-262 = "……？"
10053070-263 = "怎麼了？還沒睡醒嗎？"
10053070-264 = "不是，你們不覺得從常理來說有點奇怪嗎？"
10053070-265 = ""
10053070-267 = ""
10053070-269 = "這裡可是2樓耶？"
