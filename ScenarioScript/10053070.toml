[translation]
10053070-1 = "ตอนที่ 7;เรื่องลึกลับสุดท้าย"
10053070-3 = "อ๊ะ โคโนกะ คุณครู"
10053070-4 = "เกิดเรื่องอะไรขึ้นงั้นเหรอ? ถ้ามาช้ากว่านี้อีกนิด ฉันว่าจะเข้าไปตามหาแล้ว..."
10053070-5 = "หืม อะไรน่ะ?! ทำไมทั้งสองคนเหงื่อโชกกันมาแบบนี้ล่ะ?! เกิดเรื่องอะไรขึ้นจริงๆ งั้นเหรอ?!"
10053070-10 = "อ้อ~ คือว่า~ ฉันไม่อยากพูดถึงเลย... มันเป็นลางร้ายมากเลยน่ะ..."
10053070-11 = "[ns1] \"ไม่มีอะไรเกิดขึ้นทั้งนั้น...!\"\n[ns2] \"มีหลายอย่างเกิดขึ้นกับครูเลยละ...\""
10053070-16 = "มีเรื่องอะไรเกิดขึ้นสินะ...?"
10053070-18 = "(คุณครูอธิบายเรื่องที่เกิดขึ้นให้ทั้งสองคนฟังตั้งแต่ต้นจนจบ)"
10053070-19 = "(สุดท้ายทุกคนก็ได้คุยเรื่องรถบัสที่น่าสงสัยที่เจอเมื่อวันก่อนและเรื่องตุ๊กตาหินด้วยกัน)"
10053070-22 = "อะไรกัน?! รถคันนั้นเป็นรถบัสวิญญาณงั้นเหรอ?! ทำไมไม่บอกกันล่ะ?!"
10053070-23 = "ก็... ถ้าบอกแล้วเธอจะกลัวนี่นา..."
10053070-24 = "เกลือ! โปรยเกลือเลย!"
10053070-25 = "คุณครู ในเมื่อเหงื่อก็เป็นเกลือเหมือนกัน งั้นถือว่าเราโปรยเกลือปัดเป่าความซวยไปแล้วได้มั้ยคะ?!"
10053070-27 = "[ns3] \"มันดูก้ำกึ่งอยู่นะ...?\"\n[ns4] \"ถ้าได้กลับไป เราอาบน้ำกันก่อนดีกว่านะ...\""
10053070-32 = "ถ้าสิ่งที่ได้ฟังเป็นเรื่องจริงทั้งหมดละก็ ที่ทั้งสองคนเจอมาก็คือปรากฏการณ์โพลเทอร์ไกสต์"
10053070-33 = "ปกติแล้วคนเรามักจะรู้จักโพลเทอร์ไกสต์ว่าเป็นปรากฏการณ์ที่วิญญาณเคลื่อนย้ายสิ่งของ แต่การเปลี่ยนแปลงอุณหภูมิที่กะทันหันและผิดธรรมชาติก็เป็นหนึ่งในปรากฏการณ์โพลเทอร์ไกสต์เด่นๆ เหมือนกัน"
10053070-37 = "แต่ยังไงมันก็แปลกอยู่ดีนะ ฉันว่าฉันก็อยู่ในวงการนี้มานานพอตัว"
10053070-38 = "แต่ปรากฏการณ์เหนือธรรมชาติที่เจอตั้งแต่มาถึงที่นี่ ยังเยอะกว่าเรื่องที่ฉันเคยเจอมาตลอดชีวิตซะอีก เกิดขึ้นถี่และบ่อยเกินไปแล้ว"
10053070-42 = "สึบาสะเองก็คิดแบบนั้นสินะ"
10053070-43 = "หรือว่ามีใครบางคนบงการอยู่เบื้องหลังน่ะ?"
10053070-44 = "หืม? เปล่านะ... ฉันแค่บอกว่าที่นี่เกิดปรากฏการณ์เหนือธรรมชาติบ่อยก็เท่านั้น"
10053070-45 = "บางทีหมู่บ้านนี้อาจมีซากปรักหักพังของอารยธรรมโบราณซ่อนอยู่ใต้ดิน หรืออาจจะมีเขตทดลองลับ#nของมนุษย์ต่างดาวอยู่ก็ได้"
10053070-46 = "คำพูดนั้นคง... มาจากใจจริงสินะ"
10053070-50 = "หรือว่าจะเป็นเจ็ดอาชญากร...?"
10053070-51 = "คิดดูตามหลักความจริงแล้ว เรื่องเหนือธรรมชาติอะไรนั่นน่ะ แค่เกิดครั้งเดียวก็เหลวไหลแล้ว ถ้าบอกว่ามีใครจงใจปั่นหัวพวกเรายังจะน่าเชื่อกว่าอีก"
10053070-52 = "ในบรรดาเจ็ดอาชญากร มีใครที่พอจะก่อเรื่องแบบนี้ได้บ้างมั้ย?"
10053070-57 = "อืมม~ ถ้าเป็นอะไรอื่นที่ไม่ใช่ผี ฉันก็ไม่กลัวหรอก..."
10053070-58 = "แต่ถ้าเป็น 'ยัยนั่น' ที่ฉันนึกถึงอยู่ ก็คงไม่แปลกถ้าจะบอกว่าเรื่องทั้งหมดนี้เป็นแผนการที่ถูกวางไว้"
10053070-59 = "ยัยนั่นงั้นเหรอ? เป็นคนเดียวกับนักโทษแหกคุกที่พูดถึงเมื่อคราวก่อนหรือเปล่า?"
10053070-60 = "มันแย่ตรงที่... ดันใช่น่ะสิ"
10053070-61 = "อึก... ไม่ชอบแบบนี้เลย ทำไมสึจิโนโกะต้องมาอยู่ในที่แบบนี้ด้วย..."
10053070-62 = "ไม่สิ ตรงกันข้ามเลย หรือเพราะเป็นพื้นที่แบบนี้ ก็เลยมีสึจิโนโกะอยู่?!"
10053070-68 = "อ๊ะ รถมาแล้ว เราขึ้นแท็กซี่กลับที่พักกันก่อน..."
10053070-72 = "แล้วค่อยคิด..."
10053070-76 = "...?"
10053070-79 = "...??????"
10053070-81 = "นี่ เด็กพวกนี้! พวกเด็กบ้า!"
10053070-82 = "ดูจะมี... หลายอย่างผสมปนเปกันเลยนะ?"
10053070-83 = "ถึงจุดนี้ ฉันว่ามันน่าเหลวไหลมากกว่าน่ากลัวแล้วละ..."
10053070-84 = "ถ้าจะไม่ขึ้น ก็แค่ไม่ต้องขึ้นสิ ทำไมต้องขู่ว่าจะให้ใบสั่งด้วย!!"
10053070-85 = "เอะอะอะไรนิดหน่อยก็เอาปืนมายิงใส่กัน!!"
10053070-86 = "อีกอย่างนะ ตามสามัญสำนึกแล้ว มีใครกันที่ฝังกลบคนอื่นลึกถึงแปดเมตรน่ะ!!!!"
10053070-89 = "ดูแค้นจัดเลยนะ..."
10053070-90 = "กล้าพูดคำว่าสามัญสำนึกออกมาจากปากตัวเองเนี่ยนะ?"
10053070-91 = "ต่อให้เป็นโคโนกะก็เถอะ ถ้าเห็นอะไรแบบนี้ แทนที่จะรู้สึกกลัว ฉันว่าน่าจะ..."
10053070-93 = "ว้ากกก?! นั่นมันอะไรน่ะ?!"
10053070-94 = "อ๊ะ ไม่ใช่สินะ ซวยแล้วไง"
10053070-96 = "ทั้งหมดนี้เป็นฝีมือของเด็กผมสีเทา...! เป็นเพราะเด็กคนนั้นเลย...!"
10053070-97 = "จากนี้ฉันจะแสดงให้เห็นความสยองขวัญที่แท้จริง!!"
10053070-99 = "มันกำลังวิ่งไปหาโคโนกะแล้ว! อันตราย!"
10053070-101 = "อ่าาา อ่าาา..."
10053070-103 = "แย่แล้ว! นั่นมันอาการแพนิกขั้นสุด!"
10053070-104 = "นี่ ถ้าจะเป็นเรื่องลึกลับ ก็งัดความน่ากลัวมาสู้ให้สมกับเป็นเรื่องลึกลับสิ!! อย่ามาใช้กำลังโจมตีกันแบบนี้!!"
10053070-106 = "เรื่องลึกลับสุดท้าย ก็คือการที่ฉันกลายเป็นเรื่องลึกลับนั่นซะเอง!!"
10053070-107 = "อย่ามาโกหกเลย!! แกน่ะไม่ได้เป็นทั้งเรื่องลึกลับหรืออะไรทั้งนั้น!"
10053070-108 = "ฮึก..."
10053070-110 = "กลัวมากจนร้องไม่ออกเลยสินะ!! เอาจุดจบอย่างนี้ไปซะ!!"
10053070-111 = "ไม่ได้นะ!! ขืนเป็นแบบนี้ โคโนกะต้องโดนชนแน่!! เฮือก!!"
10053070-112 = "คะ... คุณครู!!"
10053070-113 = "[ns5] \"อื้อ ครูจะหาทางจัดการให้เอง!\"\n[ns6] \"ทุกคนพาโคโนกะหนีไปก่อน...!\""
10053070-119 = "..."
10053070-124 = "ว้ากกกกก!!!!!"
10053070-129 = "..."
10053070-132 = "..."
10053070-136 = "เจ็บชะมัดดดดดด!!!!"
10053070-137 = "โธ่เอ๊ย!! ถึกเป็นบ้าเลย!!!!"
10053070-141 = "นี่ฉันเพิ่งเห็นอะไรไปเนี่ย...?"
10053070-142 = "เห็นหรือเปล่า สึบาสะ?"
10053070-143 = "[s7] \"ใช้กำปั้น... ต่อยแหลกเลย...\"\n[s8] \"เป็นหมัดตรงที่งดงามจริงๆ เลย\""
10053070-146 = "อะไรกัน จริงๆ เลย... แม้กระทั่งวินาทีสุดท้ายก็..."
10053070-147 = "นี่มันเป็นไปได้เหรอ...?"
10053070-148 = "(ซ่า...)"
10053070-149 = "สึบาสะ? นี่ สึบาสะ?"
10053070-155 = "คุณครู สึบาสะเป็นลมไปแล้ว!!"
10053070-157 = "อ่า จริงๆ เลย~ แย่ที่สุด~ อยากกลับบ้านแล้ว~"
10053070-159 = "(แล้วเหตุการณ์เรื่องลึกลับปริศนาก็เหมือนจะจบลงอย่างเปล่าประโยชน์โดยไม่มีอะไรถูกเปิดเผย...)"
10053070-163 = "(และในคืนนั้น...)"
10053070-166 = "ไม่คิดเลยว่าฉันจะเป็นลมไปในช่วงเวลาวิกฤตแบบนั้น... ในฐานะหัวหน้าทีมสำรวจ ฉันละอายใจจัง"
10053070-167 = "จะว่าไป ทุกคนแก้ไขสถานการณ์นั้นกันยังไงเหรอ?"
10053070-173 = "เอ่อ จะว่ายังไงดี... ก็พยายามทำจนได้น่ะ..."
10053070-174 = "ฉันได้รู้ว่าถึงโลกนี้จะไม่มีสิ่งที่เรียกว่าเวทมนตร์ แต่บางครั้งก็มีเรื่องที่น่าประหลาดใจกว่านั้นซะอีก..."
10053070-176 = "...?"
10053070-177 = "ถึงจะไม่เข้าใจเท่าไร แต่ก็คลี่คลายได้แล้วใช่มั้ย?"
10053070-178 = "คลี่คลาย... ถือว่าคลี่คลายมั้ยนะ..."
10053070-179 = "อันที่จริง ฉันก็ยังไม่รู้เลยว่าเกิดเรื่องอะไรขึ้น แล้วคุณครูล่ะ?"
10053070-180 = "[s9] \"ที่รู้ก็คือมันไม่ใช่สถานการณ์ปกติเลยละ\"\n[s10] \"เหมือนว่าที่นี่ไม่ปลอดภัยที่จะพักแรมต่อแล้วละ\""
10053070-183 = "คุณครูก็คิดเหมือนกันใช่มั้ย?"
10053070-184 = "เดี๋ยวก่อนสิ แล้วเรื่องสึจิโนโกะล่ะคะ?!"
10053070-185 = "ยังอยากตามหาสึจิโนโกะอยู่อีกเหรอ...?"
10053070-186 = "เป็นเพราะความโชคร้ายของฉันเองที่ทำให้ผีตนนั้นโผล่ออกมา งั้นถ้าเราหาสึจิโนโกะเจอ เรื่องทั้งหมดก็จะคลี่คลายได้นะ"
10053070-188 = "ทั้งสองคนคิดต่างกันสินะ..."
10053070-189 = "แต่ถึงยังไงตอนนี้ก็ดึกมากแล้ว จะให้หาที่พักอื่นตอนนี้ก็คงยาก"
10053070-190 = "เราเข้านอนกันก่อนดีกว่า แล้วพรุ่งนี้เช้าค่อยมาตัดสินใจว่าจะเอายังไงดี"
10053070-191 = "อะไรกัน ทำไมถึงเอาแต่ทำตัวเป็นหัวหน้าล่ะ... แต่ยังไงฉันก็... เห็นด้วยกับที่ว่ามานะ"
10053070-196 = "...ครู"
10053070-201 = "คุณครู"
10053070-202 = "[s11] \"ทำไมเหรอ? โคโนกะ?\"\n[s12] \"นอนไม่หลับเหรอ?\""
10053070-208 = "ชู่ว คุณครู"
10053070-209 = "ตอนนี้มีใครบางคนอยู่นอกหน้าต่าง"
10053070-210 = "[s13] \"ว่าไงนะ? ใครเหรอ?\"\n[s14] \"ใคร? ตั้งแต่เมื่อไร?\""
10053070-213 = "ไม่รู้ค่ะ ฉันกับหัวหน้าก็เพิ่งสังเกตเห็นเมื่อกี้เลยค่ะ"
10053070-214 = "ถ้าจะพูดให้ชัดเจน ต้องบอกว่าฉันเห็นตั้งแต่ตอนที่โคโนกะตื่นขึ้นมาแล้วละ..."
10053070-215 = "ถึงจะไม่รู้ว่าเป็นใคร แต่ถ้ามาจับตาดูพวกเราในตอนนี้... ก็มีความเป็นไปได้สูงว่าจะเป็นผู้ที่อยู่เบื้องหลัง#nเหตุการณ์ทั้งหมดที่เกิดขึ้นค่ะ"
10053070-221 = "ถ้าเป็นไปตามที่ฉันคาดเดาละก็ ต้องเป็นหนึ่งในเจ็ดอาชญากร"
10053070-222 = "ที่มีชื่อว่า 'มิสึอิ เคียวโกะ' ค่ะ..."
10053070-227 = "โคโนกะ ฉันตั้งกล้องไว้ตามที่ขอแล้วละ พร้อมจับภาพแล้ว"
10053070-228 = "ดีละ... ถ้างั้นนับหนึ่งถึงสามแล้วจับตัวเลยนะ..."
10053070-229 = "หนึ่ง... สอง..."
10053070-230 = "ลุยเลยยยย!!!!!"
10053070-239 = "งะ... งืม?! หะ... หืม? อะไรน่ะ?"
10053070-245 = "เมื่อกี้ยังอยู่ตรงนี้นี่นา...? หายไปไหนแล้ว?"
10053070-246 = "ทุกคนเห็นมั้ยคะ? เมื่อกี้อยู่นี่แท้ๆ"
10053070-247 = "ก่อนที่โคโนกะจะเปิดหน้าต่าง คนนั้นยังอยู่ตรงนั้นอยู่เลย ฉันก็มั่นใจเหมือนกัน"
10053070-248 = "แต่กลับหายไปราวกับว่าไม่เคยอยู่มาก่อน...?"
10053070-249 = "อ๊ะ จริงสิ หัวหน้า ได้รูปมั้ย?"
10053070-250 = "ฉันจะไปเช็กดูให้เดี๋ยวนี้เลย แต่ก็อย่าคาดหวังมากเกินไปล่ะ"
10053070-251 = "ไหนว่าให้วิ่งตอนนับถึงสามไง..."
10053070-257 = "ทำไมเหรอทุกคน? มีเรื่องอะไรกันน่ะ? คุณครู?"
10053070-258 = "[s15] \"เหมือนจะมีใครอยู่ข้างนอกน่ะ\"\n[s16] \"ข้างนอกนั่นน่าจะเป็นคนที่อยู่เบื้องหลังของเรื่องนี้นะ\""
10053070-261 = "อยู่ข้างนอกงั้นเหรอ? นอกหน้าต่างน่ะนะ?"
10053070-262 = "...?"
10053070-263 = "เป็นอะไรไปน่ะ? ยังตื่นไม่เต็มตาเหรอ?"
10053070-264 = "เปล่าหรอก ไม่ใช่อย่างนั้น แต่ถ้าคิดตามหลักความจริงแล้ว มันไม่แปลกไปหน่อยเหรอ?"
10053070-269 = "เราอยู่ชั้นสองกันนะ"
