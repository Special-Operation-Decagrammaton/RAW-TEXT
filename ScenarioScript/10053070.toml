[translation]
10053070-1 = "제7화;최후의 괴담"
10053070-3 = "아, 코노카 군. 선생님."
10053070-4 = "무슨 일 있었어? 조금만 더 늦었으면 찾으러 가려고……."
10053070-5 = "어, 뭐야?! 둘 다 왜 그렇게 땀투성이야?! 진짜 뭔 일 있었어?!"
10053070-10 = "아~ 그게~ ……진짜 말하고 싶지 않다…… 너무 불길해서……."
10053070-11 = "[ns1] \"아무 일도 없었다……!\"\n[ns2] \"나 너무 많은 일이 있었어…….\""
10053070-16 = "……? 뭐가 있긴 했나 보네."
10053070-18 = "(두 사람에게 자초지종 일어난 일을 설명했다.)"
10053070-19 = "(결국에는, 전날 보았던 수상한 버스와 돌 인형에 대해서도 얘기하게 되었다.)"
10053070-22 = "뭐?! 그 버스가 귀신이었다고?! 왜 말 안 했어?!"
10053070-23 = "그야, 무서워할 게 뻔하니까……."
10053070-24 = "소금 뿌려! 소금!"
10053070-25 = "선생님, 땀도 소금인데, 어떻게 뿌린 걸로 인정 안 됨까?!"
10053070-27 = "[ns3] \"그레이존이려나……?\"\n[ns4] \"일단, 돌아가면 샤워부터 하자…….\""
10053070-32 = "지금 들은 이야기가 모두 사실이라면, 두 사람이 체험한 것은 폴터가이스트 현상일 거야."
10053070-33 = "보통 폴터가이스트는 유령이 물건을 움직이는 현상 정도로 알려져 있지만, 부자연스러운 급격한 온도 변화 역시 대표적인 현상 중 하나니까."
10053070-37 = "하지만, 아무래도 이상해. 나 역시 나름 업계에 길게 몸을 담갔다고 자부하는데."
10053070-38 = "지금까지 체험했던 심령 현상보다, 여기에 도착하고 나서 일어난 일이 더 많을 정도야. 그 빈도가 너무나도 빠르고, 잦아."
10053070-42 = "츠바사도 그렇게 생각하는구나."
10053070-43 = "역시 누군가 배후에서 조작하고 있는 걸까?"
10053070-44 = "어? 아니…… 나는 그냥 이곳의 초자연 현상 밀도가 높다는 얘기를 한 거지만."
10053070-45 = "어쩌면 이 마을의 지하에는 고대 문명의 유적이 숨겨져 있거나, 외계인의 비밀 실험 구역이 존재할지도 몰라."
10053070-46 = "그거 진심으로 하는 말…… 이었지 참."
10053070-50 = "……역시, 일곱 죄수가 아닐까?"
10053070-51 = "상식적으로 하나만 있어도 말도 안 되는 일이잖아. 차라리 누가 우릴 노리고 저질렀다고 하는 편이 훨씬 말이 돼."
10053070-52 = "혹시 일곱 죄수 중에 이런 일을 일으킬 수 있는 녀석도 있어?"
10053070-57 = "으으응~ 나는 귀신이 아니라면 아무래도 좋지만……."
10053070-58 = "내가 생각하는 '그 녀석'이라면, 이 모든 일을 계획하고 준비했다 해도, 이상하지는 않아."
10053070-59 = "그 녀석? 혹시 저번에 말했던 탈옥수하고 같은 사람이야?"
10053070-60 = "……곤란하게도, 그렇단 말이지."
10053070-61 = "으으…… 싫다. 왜 하필 이런 곳에 츠치노코가……."
10053070-62 = "아니, 반대로 이런 동네이니까 츠치노코가 있는 건가?!"
10053070-68 = "아, 차 온다. 일단, 택시 타고, 숙소에 돌아가서……."
10053070-72 = "생각을……."
10053070-76 = "……?"
10053070-79 = "……??????"
10053070-81 = "야 이 새끼들아! 너 이 새끼들아!"
10053070-82 = "뭔가…… 엄청나게 섞이지 않았나?"
10053070-83 = "이쯤 되니까 무섭다기보다 그냥 어이가 없는데……."
10053070-84 = "안 타면 안 타는 거지, 딱지 뗀다고 협박하고!!"
10053070-85 = "뭣만 하면 총으로 다 부숴버리고!!"
10053070-86 = "그리고, 상식적으로 8m를 파서 묻어버리는 놈이 어딨냐-!!!!"
10053070-89 = "뭔가, 엄청 악에 받쳤는데……."
10053070-90 = "지금 누구 입에서 상식 소리가 나오는 거야?"
10053070-91 = "암만 코노카라 해도, 이걸 보면 무섭다기보다는……."
10053070-93 = "우와아악?! 뭐야, 저거?!"
10053070-94 = "아, 아니네. 망했다."
10053070-96 = "이게 다 저 회색 머리……! 저놈 때문이었어……!"
10053070-97 = "지금부터 진정한 공포를 보여주마!!"
10053070-99 = "코노카 군에게 달려가고 있어! 위험해!"
10053070-101 = "으아아, 으아아……."
10053070-103 = "틀렸어! 완전히 패닉 상태야!"
10053070-104 = "야, 괴담이면 괴담답게 무서움으로 승부하라고!! 물리 공격하지 말고!!"
10053070-106 = "최후의 괴담은, 나 자신이 괴담이 되는 것이다!!"
10053070-107 = "뻥치지 마!! 너, 괴담도 뭣도 아니지?!"
10053070-108 = "…………힛."
10053070-110 = "너무 무서워서 비명도 안 나오는 모양이군!! 이걸로 끝장이다!!"
10053070-111 = "안돼!! 이대로면 코노카 군이 치이겠어!! 히끅!!"
10053070-112 = "서, 선생님!!"
10053070-113 = "[ns5] \"응, 내가 어떻게든 해볼 테니까!\"\n[ns6] \"다들 코노카를 데리고 도망……!\""
10053070-119 = "…………."
10053070-124 = "꺄아아아악-!!!!!"
10053070-129 = "…………."
10053070-132 = "…………."
10053070-136 = "아파아아아아앗!!!!"
10053070-137 = "아오!! 더럽게 딴딴하네, 진짜!!!!"
10053070-141 = "지금, 내가 뭘 본 거야……?"
10053070-142 = "봤어, 츠바사?"
10053070-143 = "[s7] \"부쉈다…… 주먹으로…….\"\n[s8] \"정말로, 아름다운 정권 지르기였습니다.\""
10053070-146 = "아니, 진짜…… 어떻게, 마지막까지……."
10053070-147 = "이게 말이 되는……?"
10053070-148 = "(치지직…….)"
10053070-149 = "츠바사? 저기, 츠바사?"
10053070-155 = "선생님, 얘 기절했어!!"
10053070-157 = "아, 진짜~ 최악이야~ 집에 가고 싶어~"
10053070-159 = "(……그렇게, 미지의 괴담 사건은 아무것도 밝혀지지 않고, 허무하게 마무리되는 듯했다.)"
10053070-163 = "(그리고, 그날 밤…….)"
10053070-166 = "……그런 위기의 순간에 기절하고 말 줄이야……. 탐사반의 리더로서 면목이 없네."
10053070-167 = "그나저나, 그 상황은 어떻게 타개한 거야?"
10053070-173 = "그, 뭐냐…… 어떻게든……."
10053070-174 = "세상에 마법 같은 건 없지만, 가끔 그보다 신기한 일이 있다는 걸 알았어……."
10053070-176 = "……?"
10053070-177 = "잘은 모르겠지만, 해결된 건가?"
10053070-178 = "해결…… 해결이라……."
10053070-179 = "사실, 무슨 일이 벌어졌는지, 아직도 전혀 모르겠는데. 선생님은 어때?"
10053070-180 = "[s9] \"평범한 상황이 아니란 건 알겠어.\"\n[s10] \"여기 더 머무르는 건 안전하지 않아 보여.\""
10053070-183 = "선생님도 그렇게 생각하지?"
10053070-184 = "아니아니, 츠치노코는 어떻게 하고요?!"
10053070-185 = "아직도 츠치노코를 찾고 싶어……?"
10053070-186 = "애초에 내 액운이 귀신을 불러들인 거라, 츠치노코를 찾아야 해결된다니까?"
10053070-188 = "두 사람의 생각은 각각 그런가……."
10053070-189 = "그렇다 해도, 이미 늦은 시간이라 지금 다른 곳으로 가기는 어려워."
10053070-190 = "일단, 오늘은 이만 자고, 내일 아침에 어떻게 할지 결정하자."
10053070-191 = "아니, 왜 자꾸 대장 행세야……. 그 말에는, 뭐, 동의하지만."
10053070-196 = "……님"
10053070-201 = "선생님."
10053070-202 = "[s11] \"왜 그래? 코노카?\"\n[s12] \"잠이 안 와?\""
10053070-208 = "쉿. 선생님."
10053070-209 = "지금 창밖에 누군가 있어."
10053070-210 = "[s13] \"뭐라고?\"\n[s14] \"누가? 언제부터?\""
10053070-213 = "모름다. 저도, 소장도 방금 눈치챈 참임다."
10053070-214 = "정확히 말하면, 나는 코노카 군이 깨어난 것을 보고 알아챈 거지만……."
10053070-215 = "누군지는 몰라도, 지금 시점에 저희를 감시하고 있다는 것은…… 아마도 지금까지 일어난 사건들의 배후일 가능성이 높겠죠."
10053070-221 = "저희가 한 추측대로라면, 그 일곱 죄수 중 한 명."
10053070-222 = "……'미츠이 쿄코' 말임다."
10053070-227 = "코노카 군. 부탁한 대로 카메라는 세팅해 뒀어. 곧바로 촬영할 수 있는 상태야."
10053070-228 = "……좋아. 그러면, 셋하고 세면 잡는다."
10053070-229 = "하나…… 둘……."
10053070-230 = "간다아아아앗-!!!!!"
10053070-239 = "흐, 흠냐?! 으, 응? 뭐야?"
10053070-245 = "……? 분명 있었는데? 어디로 사라졌지?"
10053070-246 = "다들 보지 않으셨슴까? 분명 있었는데."
10053070-247 = "일단, 코노카 군이 창문을 열기 전까지는, 분명 있었어. 그 점은 나도 확신해."
10053070-248 = "그런데 마치 처음부터 없었던 것처럼 증발했다……?"
10053070-249 = "아, 맞다. 소장, 사진은?"
10053070-250 = "지금부터 확인해 볼 건데, 너무 기대하지는 마."
10053070-251 = "분명히 셋에 뛰어간다 하지 않았던가……."
10053070-257 = "다들 뭐야? 무슨 일이야? 선생님?"
10053070-258 = "[s15] \"누군가 밖에 있었다는 거 같아.\"\n[s16] \"아마도 이번 사건의 배후 같아.\""
10053070-261 = "밖에 있었다고? 창밖에?"
10053070-262 = "……?"
10053070-263 = "왜 그래? 잠이 덜 깼어?"
10053070-264 = "아니, 그런 게 아니라, 상식적으로 좀 이상하지 않아?"
10053070-269 = "여기는 2층이잖아."
