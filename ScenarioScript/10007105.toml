[translation]
10007105-1 = "제10화;변치 않는 우정"
10007105-2 = "윽…… 젠장. 저 전차만 없었어도……."
10007105-3 = "후후, 보았느냐. <숙청군 1호>의 강력한 위용을?"
10007105-4 = "숙청군 1호에는 장애물을 개척할 수 있는 삽날 뿐만 아니라, 이 몸의 권위를 위협하는 학생들을 물리칠 수 있는 온갖 대인 장비가 갖춰져 있지!"
10007105-5 = "이제 용역부 녀석들이 온갖 중장비를 들고 쳐들어와도 걱정 없어!"
10007105-6 = "다음 번에는 저 전차부터 사보타주를 해야겠어……."
10007105-11 = "이로서 방해꾼은 모두 사라졌군!"
10007105-13 = "자, 이번에야 말로 온천장 철거를……."
10007105-14 = "온천에 걸었던 마지막 희망이……."
10007105-15 = "우으…… 우으으……"
10007105-17 = "으아아아앙!"
10007105-19 = "어, 어, 어째서 갑자기 우는 것이냐? 온천장의 폐쇄는 이미 결정된 사항이라고!"
10007105-20 = "……운다고 해도 물러줄 수는 없어! 이건 붉은겨울 학원의 공익을 위한 결정이니까!"
10007105-21 = "그렇지 않느냐, 다들?"
10007105-27 = "음, 그게……."
10007105-28 = "하하, 하하하……."
10007105-30 = "어, 어째서 다들 내 눈을 피하는 게냐?"
10007105-31 = "그럼 마치 이 몸이 나쁜 사람 같지 않느냐!"
10007105-32 = "콤라드! 콤라드가 보기에도 이 몸이 잘못한 것처럼 보이느냐?!"
10007105-33 = "[s1] \"이번 일은 체리노가 심한 것 같아.\"\n[s2] \"온천장 건물 정도는 남겨두어도 괜찮지 않을까?\""
10007105-34 = "믿었던 콤라드마저!"
10007105-35 = "믿었던 콤라드마저!"
10007105-36 = "……그래도 안 돼! 227호 온천장은 폐쇄야!"
10007105-37 = "온천을 복구할 수 있는 빌미를 남겨두면, 온천개발부 녀석들이 어느 틈에 다시 찾아와 붉은겨울 학원을 위험에 빠트릴지도 모른다고!"
10007105-38 = "물론 온천장 건물 정도야 남겨둘 수는 있지만……."
10007105-39 = "소용없어요, 어차피 다 끝이라고요! 온천이 고갈된 시점에서 우리는 이미 끝났다고요!"
10007105-40 = "벌어들인 돈은 금세 사라질 테고, 건물은 방치된 채 비와 바람이 스며들 테고…… 저희는 결국 구교사 시절로 돌아가게 되겠죠."
10007105-41 = "이 기회를 놓치고 싶지 않는데…… 그 시절로 돌아가고 싶지 않았는데……!"
10007105-42 = "결국 우리에게는 아무것도 남지 않았다고요!"
10007105-44 = "그렇지 않아, 노도카. 아직 우리에게는 충분히 남아 있어."
10007105-45 = "뭐가 남았다는 건데, 시구레 쨩……"
10007105-46 = "모든 게 끝장난 이 상황에……!"
10007105-47 = "구교사 특별반의 친구들이 남아있잖아."
10007105-48 = "친구들……?"
10007105-52 = "나는 말이야. 사실 구교사에 있었을 때도 그 생활이 그렇게 괴롭지는 않았어."
10007105-53 = "물론 식사는 언제나 부실하고, 제대로 된 난방기구도 없고, 가끔은 곰이 나오기도 했지만……"
10007105-54 = "노도카를 비롯한 멋진 친구들과 함께 할 수 있다는 사실만으로도 나는 즐거웠어."
10007105-55 = "이곳이 훌륭한 온천장이든, 황량한 폐허든. 다 함께 할 수 있다면 나는 상관없어."
10007105-56 = "심지어 온천장으로 쓰던 멋진 건물도 한 채 새로 생겼잖아? 상황은 오히려 좋은 편이라고."
10007105-57 = "……노도카. 우린 이번에도 잘 견뎌 나갈 수 있을 거야."
10007105-58 = "우으…… 시구레 쨩……."
10007105-63 = "……잠깐. 온천장 건물 철거를 취소한다는 말은 아직 하지 않았다만."
10007105-64 = "(소근) 체리노 쨩, 눈치 챙기세요."
10007105-65 = "으, 으음? 그, 그, 그런가?"
10007105-66 = "……쳇, 하는 수 없나. 다들 바라는 것 같으니 이번만큼은 특별히 관용을 베풀도록 하지."
10007105-67 = "건물 철거는 보류다!"
10007105-68 = "이곳의 온천장은 227호 특별반의 학생들에게 위임하여 다른 시설로 개조하도록 한다!"
10007105-70 = "역시, 회장님다우신 멋진 명판결이십니다."
10007105-71 = "적에게도 관대한 처우를 내리시다니……"
10007105-72 = "불초 마리나, 감격했습니다!"
10007105-77 = "이 온천장을…… 다른 용도로 개조하겠다고?"
10007105-79 = "……메구 씨? 아직도 이곳에 남아계셨나요?"
10007105-80 = "온천장을 마음대로 사용해도 좋다고는 했지만……"
10007105-81 = "다른 용도로의 개조는 용납할 수 없어!"
10007105-82 = "그렇다고는 하지만 그냥 두어도 이곳의 온천은 어차피 말라붙을 텐데……."
10007105-83 = "온천을 되살릴 수 없다면 다른 용도의 건물로 개조하는 게 더 유익하지 않을까요?"
10007105-84 = "그걸 막기 위해 지하의 마그마 지대를 폭발시키려 했던 것이지만……"
10007105-85 = "계획이 저지된 이상, 카스미 부장의 플랜 B를 실행하는 수밖에 없겠어!"
10007105-86 = "[s] \"플랜 B?\""
10007105-87 = "플랜 B, '온천이 더이상 온천이 아니게 된다면, 남겨둘 이유 따윈 없는 거야!'"
10007105-88 = "이럴 일이 생길 줄 알고 기초 공사를 할 때 미리 폭약을 묻어뒀었지!"
10007105-89 = "포, 폭약이요?"
10007105-90 = "그럼 저희가 지금 폭약 위에 서 있다는 말씀이신가요?"
10007105-91 = "응. 우리 카스미 부장은 어떤 상황에서든 최선의 대책을 내놓는 사람이니까. ♪"
10007105-92 = "만약 붉은겨울 사무국에서 방해가 들어온다면, 이걸로 전부 날려버리라고 했거든!"
10007105-93 = "세상에 쓸모없는 온천은 없다! 쓸모없는 건물만이 있을 뿐!!"
10007105-98 = "자, 그럼 기폭한다—"
10007105-99 = "[s] \"자, 잠깐만—\""
10007105-100 = "폭발이다!"
10007105-107 = "콰과과과광!"
