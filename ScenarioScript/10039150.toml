[translation]
10039150-1 = "후일담;외롭지 않은 전시회"
10039150-2 = "(전시회가 열린다는 아트센터를 찾았다.)"
10039150-6 = "(아트센터 주변은 상당히 한산했다.)"
10039150-9 = "(조용한 분위기에 많은 작품들이 전시되어 있었다.)"
10039150-13 = "[ns] \"앗, 저건……\""
10039150-16 = "[ns] \"나기사?\""
10039150-21 = "선생님……?"
10039150-28 = "반갑습니다, 선생님."
10039150-29 = "이곳에는 어떤 일로……"
10039150-30 = "[s] \"전시회가 있다길래, 구경하러 왔어.\""
10039150-31 = "후후, 잘 오셨습니다. 제가 이 전시회의 주최자거든요."
10039150-32 = "마침 여유로운 시간이네요."
10039150-33 = "[s] \"미술품 전시회라. 나기사에게 이런 취미가 있었구나.\""
10039150-34 = "저는 여기서 큐레이터도 겸하고 있으니, 잠시 이 전시회의 목적과 의의에 대해 설명해드리겠습니다."
10039150-37 = "(나기사에게서 전시회에 대한 설명을 들었다.)"
10039150-40 = "……해서, 티파티에서 소장하고 있던 작품들뿐만 아니라 미흡하지만 제가 직접 그린 그림도 몇 점 전시되어 있답니다."
10039150-41 = "[s] \"직접 그렸다고? 굉장한데!\""
10039150-42 = "그, 그렇게 칭찬받을 만한 수준은 아닙니다……"
10039150-47 = "뭐…… 다녀간 와일드헌트 학생이 제법 호평을 하긴 했지만요."
10039150-48 = "예술의 본고장이라 불리는 와일드헌트의 재학생이니만큼 수많은 예술 작품을 보아왔을 테고, 심미안도 평범한 수준은 아니었겠지요. 아마도."
10039150-49 = "그런 사람도 순수하게 감탄했을 정도로 이 작품들의 수준과 전시회의 전체적인 미쟝센이 제법 훌륭했다는 뜻이 아닐까…… 그렇게 해석하고 있습니다."
10039150-53 = "……"
10039150-54 = "아……"
10039150-55 = "……후우…… 죄송합니다."
10039150-56 = "최소한 선생님께는 이렇게 돌려 말하는 화법을 사용하고 싶지 않았는데…… 아무래도 습관적으로……"
10039150-57 = "[s1] \"괜찮아.\"\n[s2] \"자랑하고 싶었던 거지?\""
10039150-60 = "그으……"
10039150-61 = "……네…… 아무래도 그랬달까요……"
10039150-62 = "잘하고 싶은 분야에서 전문가에게 칭찬받는다는 경험은, 제게도 꽤 인상적이었던 것 같습니다."
10039150-63 = "아니, 기뻤습니다. 네."
10039150-64 = "인정받은 느낌이라…… 기분이 좋았습니다."
10039150-65 = "[s] \"그 기분 알지. 엄청 좋아.\""
10039150-66 = "후후…… 평소였다면 지금처럼 솔직하게 말할 리가 없었을 텐데."
10039150-67 = "역시 선생님과 이야기하면 조금 속이 시원하네요."
10039150-71 = "……"
10039150-72 = "이왕 솔직해진 김에 조금 더 털어놓아도…… 괜찮을까요?"
10039150-73 = "[s3] \"나야 얼마든지 환영이야.\"\n[s4] \"마침 그런 이야기하기 좋은 장소네. 조용하고.\""
10039150-76 = "후후…… 그렇네요."
10039150-81 = "사실 이 전시회는 사육제 초안에 없는 행사였습니다."
10039150-82 = "티파티의 구성원들과 사육제 관련 논의를 할 때, 저는 평소처럼 생각하고 있었지요."
10039150-83 = "이 행사를 통해 어떤 정치적 효과를 가져올까, 어떻게 해야 유형무형의 이득을 볼 수 있을까, 어디까지 노릴 수 있을까 하는 그런 고민을……"
10039150-84 = "그러다 문득 그런 생각이 들더군요."
10039150-85 = "이번 사육제는…… 그저 한 명의 트리니티 학생으로 참가해 순수하게 즐겨보고 싶다는 생각이요."
10039150-86 = "……"
10039150-87 = "그래서 그때까지 하고 있던 고민은 일단 접어두고, 제 개인적으로 한 번쯤 해보고 싶었던 행사를 신청했습니다."
10039150-88 = "[s] \"그게 이 전시회였구나.\""
10039150-89 = "후후, 네."
10039150-93 = "이 그림들을 보며 제가 느꼈던 감동, 예술적 영감을 다른 학생들과 함께 나누고 싶었죠."
10039150-94 = "……생각보다 방문객이 적어서 조금 의기소침한 상태긴 했지만…… 어째서일까요……"
10039150-95 = "[s] (아…… 그거……)"
10039150-97 = "[ns] \"이, 이제 괜찮을 거야. 학생들 많이 올 거야!!\""
10039150-98 = "그러면 좋겠습니다만……"
10039150-99 = "지금은 선생님께서 이렇게 찾아주신 것만으로도 이 전시회를 연 보람이 있네요."
10039150-100 = "[s] \"잘했어, 나기사.\""
10039150-104 = "[ns5] \"티파티의 나기사도 중요하겠지만,\"\n[ns6] \"나는 개인으로서의 나기사도 항상 응원하고 있어.\""
10039150-109 = "……또 이렇게……"
10039150-114 = "감사합니다, 선생님."
10039150-115 = "그 응원, 소중히 담아두고 기억하겠습니다."
10039150-116 = "[s] \"그리고 그런 나기사를 응원하는 사람이 나뿐만은 아닌 모양이야.\""
10039150-120 = "네? 그건 무슨 말씀……"
10039150-126 = "아하하, 여기 봐. 전부 디저트야. 이래도 되는 거야?"
10039150-127 = "역시 나기사답군요."
10039150-131 = "이 목소리는……"
10039150-137 = "나기 쨩~ 시간 괜찮아? 전시회 한다길래 세이아 쨩과 함께 놀러 왔어☆"
10039150-138 = "사람이 없어서 쾌적하네요. 나기사에게는 슬픈 일이겠지만."
10039150-140 = "미카 씨, 세이아 씨……"
10039150-142 = "[ns] \"둘 다 안녕?\""
10039150-146 = "서, 선생님?"
10039150-147 = "안녕하세요, 선생님."
10039150-148 = "사육제를 참관하러 오셨다는 말씀은 들었습니다만, 이곳에서 마주칠 줄이야."
10039150-149 = "뭐, 뭐야? 그런 말 언제……? 나는 처음 듣는데?!"
10039150-151 = "두 분…… 제 전시회에 일부러 찾아와주신 건가요?"
10039150-153 = "미카가 먼저 제안했습니다. 나기사의 전시회라면, 분명 지루하고 재미없어서 관객도 별로 없을 테니 우리라도 가줘야 한다면서……"
10039150-154 = "그, 그렇게까지는 말 안 했……"
10039150-156 = "아하…… 미카 씨의 생각은 그러셨군요?"
10039150-157 = "[s] \"일부러 찾아와주다니, 고마운 친구들이야.\""
10039150-161 = "후…… 그건 사실이네요."
10039150-162 = "아하하…… 그렇지, 나기 쨩? 마음껏 고마워해도 된다구?"
10039150-163 = "……"
10039150-164 = "솔직히 말하면……"
10039150-170 = "찾아와줘서 고마워요. 모두."
10039150-175 = "으응?"
10039150-176 = "어머."
10039150-178 = "오, 오늘은 조금 솔직해져 보자고…… 그렇게 생각했으니까요……"
10039150-179 = "마, 마침 선생님께 작품에 대한 설명을 해드리려던 참이었는데…… 함께 둘러보시겠어요?"
10039150-185 = "응! 헤헤, 설명해 줄래? 나기 쨩☆"
10039150-186 = "솔직한 감사에 이어 나기사의 일일 도슨트라니. 오늘 특별한 경험을 하는군요."
10039150-192 = "[ns] \"그럼, 잘 부탁해. 나기사.\""
10039150-193 = "흠흠……"
10039150-197 = "모두들, 왼쪽을 봐주시겠어요?"
10039150-199 = "(나기사의 설명이 끝나갈 때쯤 관람객들이 하나둘씩 입장하기 시작했고)"
10039150-200 = "(전시회는 성황리에 마무리되었다.)"
10039150-204 = "(세이아와 미카는 지루해서 졸음을 참는 기색이 역력했지만, 작품을 설명하는 나기사는 꽤 즐거워 보였다.)"
