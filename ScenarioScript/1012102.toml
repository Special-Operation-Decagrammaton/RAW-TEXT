[translation]
1012102-1 = "바다의 드레~수 코오~두네요!"
1012102-5 = "유카리! 오늘도 여기에 등장, 이어요!"
1012102-6 = "그나저나, 평소와는 달리 샬-레 사무실에 계시다는 것은……."
1012102-7 = "아앗! 혹시 소녀가 바쁘신 와중에 실례를?!"
1012102-8 = "[s1] \"학생 상담은 언제나 환영이야.\"\n[s2] \"마침 쉬려던 참이었어.\""
1012102-11 = "아하! 그렇군요! 그것참 나~이수~ 타~이밍이어요!"
1012102-12 = "요즘 혹시나 소녀가 너무 마음 가는 대로 행동하여 주변 분들께 실례를 끼치는 게 아닐까 하고는 고민하고, 또 고민하여……."
1012102-13 = "……아앗! 그러고 보니, 이런 상담이 아니었지요!"
1012102-14 = "[s3] \"나는 이런 상담도 괜찮은데.\"\n[s4] \"분명 바다에 간다 했지?\""
1012102-17 = "후후! 저 유카리, 나이는 어릴지언정, 식견만큼은 부끄럽지 않게 쌓아 왔답니다."
1012102-18 = "뱃놀이 경험이라면 적잖이 있사와요!"
1012102-19 = "[s] \"뱃놀이……?\""
1012102-20 = "예. 유람선을 타고 바다의 정취를 즐기다가, 점심 무렵에 요정에서 식사를 하고 나서 여관에서 해풍을 받으며 고즈넉하게 바다 내음을 즐기는……."
1012102-21 = "그야말로 바다의 정석이지요!"
1012102-25 = "어, 어라……? 소녀가 무언가 착각했을까요?"
1012102-26 = "매년 조금씩 차이는 있어도, 대개 이런 느낌이었을 텐데……."
1012102-27 = "이번에 가는 바다는 평소와 좀 다를 것이다……?"
1012102-28 = "역시 선생님! 뭐든지 알고 계시는군요! 미리 여쭈는 게 정답이었사와요!"
1012102-29 = "그러면 부디, 소녀에게 <이번에 가는 바다>를 전수해 주실 수 있으실까요?!"
1012102-30 = "네? 어떤 차림으로 가려 했냐고요……? 그야 당연히 기모노를……."
1012102-35 = "어라? 선생님, 갑자기 어디로 외출을……?"
1012102-37 = "여기는…… 부티~쿠인가요?"
1012102-38 = "네? 수영복이요? 준비하지는 않았지만……."
1012102-39 = "후후. 이상하네요. 그러면 꼭 물에 들어가기라도 할 것 같이 들리네요! 그럴 리는 없겠지만!"
1012102-40 = "네?"
1012102-41 = "입수한다고요……?"
1012102-42 = "바다에요?!"
1012102-43 = "[s5] \"아, 해수욕은 싫어?\"\n[s6] \"혹시 괜한 참견이었나?\""
1012102-46 = "아니요, 그 반대여요! 소녀, 꼭 수영복 사고 싶사와요!"
1012102-47 = "과연, 흠흠…… 이번 여름에는 카데노코지가 아니니까…… 그런 의미에서 다르다, 그런 뜻이군요."
1012102-48 = "……."
1012102-49 = "그러면, 이제 소녀는 뭘 하면 되는 걸까요?"
1012102-50 = "마음에 드는 수영복을 골라라……?"
1012102-51 = "설마, 여기 있는 게 전부 수영복……?!"
1012102-52 = "아앗! 잘 보니 그렇사와요! 평소 보던 옷들과는 달라, 소녀 전혀 눈치채지 못했사와요!"
1012102-53 = "이 중에서 하나만 고르는 것이군요!"
1012102-54 = "흐흥~♪ 어떤 것이 좋을까요~?"
1012102-55 = "앗! 이쪽 수영복은 푸~릴이 달려 있사와요! 귀여워라~"
1012102-56 = "여기 있는 수영복은 색상이 알록달록해서 꼭 종이 공예처럼 예쁘고……."
1012102-57 = "그리고, 음…… 이거는……."
1012102-61 = "정말 입는 옷이 맞나요……?"
1012102-62 = "아아! 선생님! 도와주시어요! 종류가 너무 많아 오히려 고를 수 없게 되었사와요!"
1012102-64 = "(한참 망설인 끝에, 유카리는 겨우 마음에 드는 수영복을 하나 골랐다.)"
1012102-68 = "선생님……? 입어는 보았지만……."
1012102-71 = "소녀가 맞게 입었을까요? 이런 옷은 처음이라."
1012102-72 = "살짝 천이 부족한 듯한……."
1012102-73 = "아, 아니요! 이 옷으로 괜찮사와요! 조금 익숙지 않은 의복이라 조금 당황했지만……."
1012102-74 = "하지만 소녀는 몹시 마음에 들었사와요!"
1012102-75 = "움직일 때 불편한 부분도 없고~ 하늘하늘하게 팔랑거리는 것이 꼭 날개가 자라난 기분이어요, 후후."
1012102-76 = "아! 소녀, 한 가지 묘책을 떠올렸사와요!"
1012102-77 = "지금 받는 어색한 느낌이 낯섦에서 오는 것이라면, 익숙해질 때까지 입으면 노~우 푸~라불럼~이와요!"
1012102-78 = "그러니 오늘은 연습 삼아 이 차림으로 집까지……!"
1012102-79 = "[s7] \"선생님은 유카리를 믿었는데! 믿었는데!\"\n[s8] \"수영복은 바다하고, 수영장에서만!\""
1012102-82 = "네?"
1012102-83 = "……."
1012102-84 = "아하! 완벽하게 이해했사와요!"
1012102-85 = "즉, 바다의 드레~수 코오~두라는 것이군요!"
1012102-86 = "그렇다면 오늘은 바다도, 수영장도 들를 예정이 없으니, 아쉽지만 수영복은 여기까지여요."
1012102-88 = "(그후 평소의 교복으로 갈아입은 유카리는 수영복을 포장해서 행복한 얼굴로 돌아갔다.)"
