[translation]
13150-1 = "제15화;부학생회장의 명령"
13150-7 = "있지. 호시노 쨩."
13150-8 = "나는 있지. 호시노 쨩을 처음 봤을 때, 이게 꿈인가 싶어서 몇번이고 볼을 꼬집어봤었어."
13150-9 = "호시노 쨩 같이 귀엽고 강하고 믿음직한 후배가 곁에 있어 준다는 게 너무 기뻐서……"
13150-10 = "우웅…… 난 바보니까…… 제대로 설명할 순 없지만……."
13150-11 = "호시노 쨩과 이렇게 마주 보고 있을 수 있다는 게 나한텐 기적 같은 거였으니까……."
13150-13 = "……어차피 매일 보는 얼굴이잖아요."
13150-14 = "어제도 봤고, 오늘도, 내일도 볼 거면서. 그런 당연한 걸 가지고 호들갑입니까."
13150-15 = "하우웅…… 그치만……."
13150-16 = "기적은 좀 더 대단하고 희귀한 것입니다."
13150-17 = "……으응. 아냐, 호시노 쨩."
13150-18 = "나는 다르게 생각해."
13150-22 = "나는 바보지만…… 그건 장담할 수 있어."
13150-23 = "있지. 호시노 쨩. 언젠가 호시노 쨩에게도 귀여운 후배들이 생기면……."
13150-24 = "매일 매일 얼굴을 볼 수 있다는 것…… 오늘도 내일도, 그리고 미래에도 함께 있을 수 있다는 것……."
13150-25 = "그런 단순하고 시시한 일들이야말로 진짜 기적 같은 것이라는 걸, 호시노 쨩도 알게 될 거야."
13150-27 = "이런 학교에 후배들이라…… 확실히 그건 기적적인 일이겠네요. 다들 자치구를 떠나고 있는데."
13150-28 = "입학할 녀석들이 있으려나."
13150-29 = "우웅, 아니라니까. 호시노 쨩. 그 일상이야 말로……."
13150-30 = "네에, 네에. 뭐, 선배가 그렇게 생각한다면 그런 거겠죠."
13150-31 = "응. 그러니까, 호시노 쨩, 마치 기적처럼…… 호시노 쨩에게 후배들이 생긴다면……"
13150-32 = "꼭 호시노 쨩이 지켜줘야 해. 알았지?"
13150-33 = "네에, 뭐. 그럴게요."
13150-45 = "콜록, 콜록…… 으으……. 다리에 힘이 안 들어가……."
13150-46 = "전력을 다했는데……"
13150-47 = "상처 하나 입힐 수 없다고요……? 정말로……?"
13150-51 = "……. 미안. 아야네 쨩. 세리카 쨩."
13150-52 = "전투 헬기 3대라면 아무래도 나도 봐주거나 할 수는 없어서 말야……."
13150-53 = "……그러네. 아야네 쨩 말대로 이래서야 예전과 다를 게 없겠네. 미안해."
13150-54 = "그리고 선생에게도 미안하다고 전해줄래? 이 아저씨는 또 바보 같은 행동을 되풀이해 버렸다고……."
13150-55 = "날 미워해도 괜찮아."
13150-58 = "……."
13150-59 = "……."
13150-62 = "……아야네 쨩, 세리카 쨩. 너희는 아비도스의 미래야."
13150-63 = "너희야말로 진짜 아비도스를 걱정해서 여기 찾아온 아이들이니까."
13150-64 = "그러니 나는 너희의 미래를 지켜주지 않으면 안 돼. 후배는 선배가 지켜줘야 하는 거니까."
13150-70 = "……."
13150-71 = "……그치만 너무하잖아! 그 학생회장님이 사칭이었다고 자백하는 거잖아."
13150-72 = "그것도 선배가 직접……."
13150-74 = "괜찮아. 세리카 쨩. 응, 그건 자연스러운 거니까."
13150-75 = "나는 언젠가 졸업해. 그러면 너희가 이 학교를 책임져야 할 때가 올 거야."
13150-76 = "선배가 후배를 지켜주고, 후배의 미래를 열어주고, 후배는 선배를 넘어서서 앞으로 나아가는 게 당연한 거야."
13150-79 = "너희는, 대책위원회는 새로운 아비도스의 미래로 나아가야 해."
13150-80 = "이 열차포만 없어진다면…… 아비도스를 노리는 녀석들도, 과거 학생회의 실책도, 자치구 기업의 음모도…… 모두 다 정리될 거야."
13150-81 = "그 이후로는 분명히 너희들은 잘해 나갈 수 있을 거야."
13150-84 = "노노미 쨩, 시로코 쨩, 세리카 쨩, 아야네 쨩…… 모두 분명히 잘해 나갈 거야."
13150-85 = "유메 선배의 <아비도스 학생회>는 그렇게 사라지면 돼. 그리고 대책위원회가 선생님과 함께 새롭게 미래를 이어 나가는 거야."
13150-91 = "그렇게 미래로…… 빛으로 나아가 줘."
13150-92 = "그게 지금은 없는 아비도스 최후의 학생회장의 뜻이자……"
13150-94 = "[ruby=・]부[/ruby][ruby=・]학[/ruby][ruby=・]생[/ruby][ruby=・]회[/ruby][ruby=・]장[/ruby] 타카나시 호시노의 명령이야."
13150-103 = "모두들 괜찮아?"
13150-105 = "시로코 선배……"
13150-106 = "선배가 제일 많이 다쳤으면서. 선배야말로 괜찮아?"
13150-108 = "응. 호시노 선배…… 가버린 거야?"
13150-109 = "……네. 말릴 수 없었어요…… 저희 힘으로는……."
13150-110 = "응……. 힘이 부족했네."
13150-111 = "이, 이제 어떻게 하지, 시로코 선배……?"
13150-112 = "나도 잘 모르겠어……."
13150-114 = "그런 선배의 모습은…… 처음 보는 것 같아요……."
13150-115 = "뭔가…… 뭐랄까……."
13150-117 = "……."
13150-130 = "그러고 보면 유메 학생회장의 계약서……."
13150-132 = "응?"
13150-137 = "오늘이…… 그 계약서가 체결된 지 2년이 되는 날이에요."
13150-138 = "그렇다는 건……."
13150-140 = "오늘이 유메 학생회장이 실종된 날이에요……."
13150-156 = "……좋아. 그럼 노노미 쨩을 구하러 가볼까."
13150-158 = "그리고……."
13150-161 = "2년 전에 하지 못했던 일을 마무리하러."
13150-163 = "다음화;반격"
