[translation]
2005802-1 = "에리카, 쇼핑"
2005802-2 = "(사무용품 구입을 위해 지하 아케이드를 찾았다.)"
2005802-5 = "오, 선생님이다. 안녕~"
2005802-6 = "[s1]\"여기서 만나네, 에리카.\"\n[s2]\"뭐 하고 있었어?\""
2005802-9 = "이쪽 상가에 팬시 샵이 많거든."
2005802-10 = "귀여운 신상이 있는지 한 번 둘러보고 있었지."
2005802-11 = "최근에는 통신판매라든가, 특정 브랜드의 팝업스토어 같은 것도 자주 열리곤 하지만……."
2005802-12 = "아무래도 유행에 따라 움직인다는 느낌이 있잖아?"
2005802-13 = "이렇게 딱히 카테고리를 정해놓지 않고 이것저것 구경하다 보면, 간혹 내 취향에 직격인 아이들이 하나씩 나온단 말이지."
2005802-14 = "선생님도 알지? 남한테 명확하게 설명하긴 어렵지만 왠지 내 마음에 드는 거."
2005802-15 = "[s3]\"알지, 알지.\"\n[s4]\"그런 거 있지.\""
2005802-18 = "그리고 가끔 구하기 어려운 레어 아이템을 발견하기도 하고."
2005802-19 = "아무튼, 이래저래 돌아다니다 보면 좋은 일이 많아."
2005802-20 = "이렇게 선생님을 만난 것도 그중 하나가 아닐까 싶고?"
2005802-21 = "[s]\"그럼 모처럼이니까, 함께 구경해볼까?\""
2005802-22 = "아, 정말?"
2005802-23 = "괜찮은 거야, 선생님? 별로 선생님이 흥미 있을 만한 쇼핑은 아닐지도 모르는데?"
2005802-24 = "내가 어떤 걸 좋아하는지 궁금하다고?"
2005802-25 = "이거 참…… 그렇게 말하면 어쩔 수 없네."
2005802-29 = "자, 그럼 이쪽으로~"
2005802-31 = "(그렇게 여기저기 돌아다니며 에리카와 아이쇼핑을 했다.)"
2005802-38 = "오, 선생님! 이거 어때?"
2005802-39 = "[s]\"표범 인형? 키링인가?\""
2005802-40 = "응! 보통 이런 레오파드 패턴의 팬시 용품 찾기가 어렵거든. 우연히 들른 스토어에서 발견하다니 럭키!"
2005802-41 = "[s]\"그러고 보니 에리카의 총에도 같은 무늬가 있었지.\""
2005802-42 = "하하, 맞아. 이런 게 왠지 눈에 들어오더라."
2005802-43 = "왜냐고?"
2005802-44 = "어, 글쎄……."
2005802-45 = "그냥, 개성적인 느낌이라서?"
2005802-46 = "남들 다 고르는 건 재미없으니까, 좀 자유로운 느낌도 들고?"
2005802-47 = "철 지난 사춘기 학생이 할법한 소극적 반항, 뭐 그런 건가 봐. 아하하."
2005802-48 = "[s5]\"개성을 찾는 건 중요하지.\"\n[s6]\"내가 뭘 좋아하는지 알아가는 것도 중요하고.\""
2005802-51 = "……."
2005802-52 = "오, 선생님 같은 이야기였다. 방금."
2005802-53 = "내가 좋아하는 걸 찾는다……."
2005802-54 = "그거 꽤 어려운 일인 것 같아. 나, 취향이 그렇게 명확하지 않거든."
2005802-55 = "뭔가, '나는 이런 사람이야', '나는 이런 걸 좋아해~'라고 확실하게 말할 수 있는 사람은 대단하다고 생각해."
2005802-56 = "난 호불호가 조금 옅다고 할까. 흐리다고 할까……."
2005802-57 = "근데 장점도 있는 것 같아. 뭐든 좋아하려고 노력하다 보면, 점점 정이 가는 느낌? 익숙해져서 그러려나."
2005802-58 = "아하하, 그럼 아무튼 이걸로 결정~!"
2005802-59 = "[ns]\"만난 기념으로 내가 사줄……\""
2005802-62 = "에헤이~ 아니야! 지갑 넣으셔요~!"
2005802-63 = "나도 그 정도 여유는 있다구."
2005802-64 = "그리고 선생님이랑 처음 밖에서 만난 건데, 첫 만남부터 부담 주고 싶지 않거든?"
2005802-65 = "부담이 아니어도, 아무튼 그래! 무슨 말인지 알지?"
2005802-66 = "후후. 아무튼 선생님, 시간 내서 같이 돌아주고. 고마웠어."
