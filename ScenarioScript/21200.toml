21200-98 = "인터넷 평가도 나쁘지 않았고, 우리는 쿠소게 1위로 전설적인 너드들에서 더 성장했어."
21200-99 = "계속, 발전하면 돼."
21200-100 = "비록 여기서 쫓겨난다 해도…… 기숙사에서 부원 충원도 하고 게임개발서클에서 다시 성과를 낸 뒤, 더 근사하고 커다란 부실을 받을 거야!"
