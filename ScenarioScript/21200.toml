21200-195 = "［chicken: 고민 끝에 선택했습니다. 이 게임을 만날 수 있어서, 다행이었습니다.］"
21200-196 = "［Kotoha0507 : 밀레니엄에 대해, 편견이 있었습니다.］"
21200-197 = "［Kotoha0507 : 냉정하고 합리적이기만 한 밀레니엄 학생들에 대한 편견은, 이번 밀레니엄 프라이스와 테일즈 사가 크로니클 2를 통해 완전히 사라졌습니다.］"
21200-198 = "……!"
21200-199 = "그, 그, 그럼…… 우리 부실을 유지할 수 있는 거지?!"
21200-202 = "물론이지. 아 어디까지나 '임시 유예'야. 정식 수상은 아니라서, 학생회는 한 학기 더 밀레니엄 게임개발부의 부실 몰수 및 폐부를…… '보류' 하기로 했으니까."
21200-203 = "……그리고……."
21200-204 = "(우물쭈물)"
21200-205 = "응?"
21200-206 = "그…… 여기 있는 게임기들…… 고물이라 한 거 사과할게."
21200-207 = "너희들 덕분에, 나도 어렸을 때 즐겁게 했던 게임들의 추억을 돌이켜보고…… 정말로 새로운 세계를 경험하는 기분을 느낄 수 있었어."
21200-208 = "고마워. 그럼 부실 연장 신청이나 부비 수령하러 학생회실로 오도록 해. 나중에 봐~"
