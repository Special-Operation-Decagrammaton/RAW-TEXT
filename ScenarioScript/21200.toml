[translation]
21200-1 = "제20화;밀레니엄 프라이스"
21200-2 = "밀레니엄 게임개발부"
21200-3 = "아리스~ 아리스~ 이것 봐~"
21200-4 = "짜잔~ 메이드복이다~"
21200-5 = "히, 히익!"
21200-6 = "(후다닥)"
21200-7 = "아하하! 재미있다!"
21200-8 = "대체 뭐 하는 거야! 아리스 쨩이 완전히 겁먹었잖아!"
21200-9 = "아리스 쨩 괜찮아?"
21200-11 = "아, 아리스. 다, 당분간 메이드복만 봐도 피하고 싶습니다!"
21200-12 = "으음. 몸은 다 나은 것 같은데."
21200-13 = "저기, 건물 부순 것 때문에 학생회에 다녀왔어."
21200-14 = "다행히, 부활동 중 '사고'로 처리된 것 같아."
21200-15 = "오옷?! 어떻게? 난 부가 존속 되어도, 부비는 포기해야겠다고 생각했는데."
21200-16 = "C&C 쪽에서, 처리해 준 것 같아."
21200-17 = "그리고…… 네루 선배가 전해달래."
21200-18 = "'다시 보자'고……."
21200-19 = "히익……!"
21200-22 = "아앗, 아리스 쨩! 캐비닛에 숨으면 안 돼! 유즈 쨩이 이상한걸 가르쳤네!"
21200-23 = "흐음. 그건 그렇고 다행이네. 그보다 이제……."
21200-24 = "……응."
21200-26 = "밀레니엄 프라이스가 시작되었어."
21200-28 = "다들 알겠지? 수상하면 샴페인을 따는 거고, 그렇지 않으면……"
21200-29 = "……바로 짐 싸야겠지."
21200-30 = "우리야 짐 싸도 괜찮겠지만, 유즈 쨩과 아리스 쨩은……"
21200-31 = "……."
21200-32 = "……."
21200-34 = "밀레니엄 프라이스 시상식장"
21200-35 = "지금부터! 밀레니엄 프라이스를 시작하겠습니다! 저는 사회 및 진행을 맡게 된 코토리!"
21200-36 = "이번 밀레니엄 프라이스는, 제1회 시작 이후 최대의 응모작들을 받을 수 있었습니다."
21200-37 = "아마도 클럽의 기준이 '성과'를 내야 한다는 학생회의 정책 변경 탓이라 보는데요!"
21200-39 = "밀레니엄 게임개발부"
21200-40 = "……코토리 쨩도 잘 해결된 모양이네."
21200-41 = "엔지니어부는 밀레니엄에서 가장 인정받는 동아리 중 하나니까."
21200-42 = "그보다…… 사상 최대 규모의 응모라……."
21200-43 = "위, 위험한 전개인데……."
21200-45 = "작년 우승 작품이었던 노아 씨의 '추억시집'은 본래 의도와는 살짝 달랐던 것 같지만, 너무 형이상적인 단어들 표현들뿐이라 밀레니엄 최고의 불면증 치료제로 평가받았습니다."
21200-46 = "이번에도 치약처럼 생겼지만, 짜면 모짜렐라 치즈가 나오는 상비형 소스, 미사일이 내장된 호신용 장우산……"
21200-47 = "넥타이형 보조배터리, 광학미채 속옷 세트, 캔 하나 딱 시원하게 보관하기 좋은 필통 크기의 휴대용 개인 냉장고……"
21200-48 = "그리고! 현재 키보토스 네트워크에 센세이션을 일으킨, 휴대폰에서 멀티 플레이로 즐길 수 있는 레트로 게임 <테일즈 사가 크로니클 2> 등!"
21200-49 = "이번에 출품된 세 자릿수의 응모작 중, 영광의 자리에 서게 될 작품은 단 7개뿐!"
21200-50 = "(꿀꺽)"
21200-51 = "그럼 7위부터 수상을 발표하겠습니다!"
21200-52 = "7위는, 밀레니엄 엔지니어부 우타하 씨의 '광학미채 속옷 세트'입니다! 속옷의 목적이 '입는 것' 인가 '가리는 것'인가 부터 혼란스러운 제품이지만……"
21200-53 = "노출증 환자들에게 합법적으로 취미생활을 영위할 수 있게 준비된 제품이라는 점에서 높은 평가를…… 대체 심사위원이 누구인지 궁금하네요! 어쨌든 7위!"
21200-54 = "……흐으."
21200-55 = "뭐, 우리 게임이 7위에는 어울리지 않지."
21200-56 = "그리고 6위! 이 제품은……"
21200-57 = "……이번에도……"
21200-58 = "5위는……!"
21200-59 = "우리 이름은…… 안 불리네."
21200-60 = "다음! 4위는…………!"
21200-61 = "으-으-으! 슬슬 호명해줬으면 좋겠는데!"
