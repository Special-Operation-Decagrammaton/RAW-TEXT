21200-125 = "?!"
21200-126 = "흐윽. 미안해…… 미안해 아리스 쨩!"
21200-127 = "샬레로 내가 매일 찾아갈 테니까! 진짜 진짜 매일 갈 거야!"
21200-128 = "어딜 가더라도! 우린 함께 게임을 만들 거잖아!"
21200-130 = "으으으으……!"
21200-131 = "싫어!"
21200-132 = "선생님! 아리스를 데려가지 마!"
21200-133 = "내, 내 방에 데려갈 거야! 침대도 같이 쓰면 돼! 밥도 한그릇 가지고 나눠 먹을 거야!"
21200-134 = "나, 나도 나눠줄게요!"
21200-135 = "얘들아. 선생님을 곤란하게 하지 마. 발각되면…… 너희들까지……"
21200-137 = "(철커덕.)"
21200-138 = "모모이! 아리스! 미도리! 유즈!"
21200-139 = "히익! 벌써 유우카가!"
21200-140 = "버, 벌써 부실을 비우라는 건가요?!"
21200-141 = "이런 지옥에서 온 악마 같은 것! 너희 학생회에 인간의 마음은 없는 거냐!"
