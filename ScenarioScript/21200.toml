21200-151 = "결과 확인 안한 거야?"
21200-152 = "……결과?"
21200-153 = "우리는…… 7위 안에 못 들어갔는데?"
21200-154 = "하아?"
21200-155 = "무슨 소리야. 지금도 방송 중이니 확인해 봐."
21200-156 = "……언니가 TV를 날려버려서."
21200-157 = "어이가 없네. 자 봐봐. 나도 내 폰으로 보다가 달려온 거니까."
21200-159 = "밀레니엄 프라이스 시상식장"
21200-160 = "분명 밀레니엄 프라이스는, 학생들의 재능과 노력으로 만들어진 작품 중, 실용성을 중심으로 수상을 해왔습니다."
21200-161 = "하지만 게임을 통해 얻을 수 있는 '즐거움'은, 저희에게 생소한 느낌의 실용성을 깨닫게 해주었고……"
21200-162 = "때문에 우리는 이번에 이례적인 선택을 하게 되었습니다."
21200-163 = "'특별상'을 수상하게 된 게임개발부의 <테일즈 사가 크로니클 2>가 바로 그 주인공입니다."
21200-164 = "저, 정말?!"
21200-165 = "대체…… 무슨 일이……"
21200-166 = "레트로라는 시대를 초월한 컨셉에, 상상을 초월하고 상식에 얽매이지 않은 전개와, 그에 걸맞은 이상한 세계관이지만……"
21200-167 = "분명 새로운 세계를 여행하고, 또 다른 인연을 쌓아가며 마왕을 물리치는……"
21200-168 = "RPG 게임의 근원적인 즐거움을 잘 알려준 작품이라 생각합니다."
21200-169 = "그렇기 때문에 처음 게임에 설레었던 추억을 떠올리게 해준 이 작품에게……"
21200-171 = "이번 밀레니엄 프라이스 '특별상'을 수상합니다."
21200-174 = "밀레니엄 게임개발부"
21200-175 = "우…… 와……."
21200-176 = "정말 축하해! 나도 <테일즈 사가 크로니클 2> 해봤어! 즐겁기만 했다고는 말 못 하겠지만, 게임을 끝냈을 때 그 특유의 기분을 느낄 수 있어서 좋았어!"
21200-178 = "모모! 미도! TSC2 해봤어! 완전 재밌더라! 지금 넷상에서도 난리야!"
21200-179 = "베리타스가 확인해 본 바에 의하면, TSC2 에 대한 검색 횟수가 키보토스 아이돌들의 이름보다 더 많이 검색되고 있다고 해!"
21200-180 = "……마…… 맙소사……."
21200-183 = "확인했습니다."
21200-184 = "3시간 전 올린, 테일즈 사가 크로니클 2는 하루 동안 다운로드수 7705회, 총 1372개의 댓글이 달려 있었습니다만……"
21200-185 = "지금 밀레니엄 프라이스 이후, 약 26초 사이에 다운로드 수가 1만 회를 초과했습니다."
21200-186 = "?!"
21200-187 = "댓글은 약 500개가 추가로 생성, 단어의 뉘앙스에서 확실하게 부정적인 의혹 242개, 긍정적인 기대 191개, 나머지는 확실하지 않은, 혹은 평가를 유보한 댓글입니다."
21200-188 = "……어? 그, 그럼 우리…… 망한 거 아냐?!"
