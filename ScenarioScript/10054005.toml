[translation]
10054005-1 = "序幕;某個炎熱的夏天"
10054005-7 = "[ns] 「……」"
10054005-9 = ""
10054005-10 = "您，您還好嗎？老師？#n怎麼突然趴倒在桌上……"
10054005-11 = "[s] 「好熱～」"
10054005-12 = "啊……嗯，今天確實是有點熱呢。"
10054005-13 = ""
10054005-15 = ""
10054005-16 = ""
10054005-17 = "這種時候最重要的是補充水分！來，請用茶！"
10054005-18 = ""
10054005-19 = "（心懷感激地接過茶杯喝了下去……）"
10054005-20 = ""
10054005-21 = "（然而……）"
10054005-22 = ""
10054005-23 = "[ns] 「好燙！？」"
10054005-24 = "什麼好燙，這種程度只能算是溫的呢。"
10054005-25 = "沒錯，老師！冰水基本上對身體不好哦？"
10054005-26 = "況且如果在大熱天急著喝冰水，腸胃會因為受到刺激而不舒服呢。"
10054005-27 = "陽氣越盛就越要懂得善加運用！這個道理用在料理上也是一樣的。"
10054005-28 = ""
10054005-30 = ""
10054005-32 = "[ns] 「可是還是好熱……」"
10054005-33 = "哈哈哈，今天確實很熱呢。#n冷氣明明已經開到最強了，居然還熱成這樣。"
10054005-34 = "來，老師。#n別太逞強，把這個喝了吧。"
10054005-35 = ""
10054005-36 = "（瑠美笑著遞過來的是……一杯裝滿冰塊的檸檬紅茶！）"
10054005-37 = ""
10054005-38 = "[ns] 「謝謝你，瑠美！瑠美最棒了！世界第一的廚師！」"
10054005-39 = "不，不至於那麼誇張吧……"
10054005-40 = "傳統上山海經其實不太偏好冷飲……不過最近從外地來的客人越來越多了。"
10054005-41 = "事先為不同的情境與客人做好準備，才能提供更周全的服務不是嗎？"
10054005-42 = "經商這件事的本質，就是將東西提供給需要的人嘛。"
10054005-43 = "如果不夠的話請儘管開口。#n除了檸檬紅茶之外，還有葡萄柚茉莉花茶、水蜜桃烏龍茶和柚子紅茶哦。"
10054005-44 = ""
10054005-46 = ""
10054005-47 = ""
10054005-49 = "（就這樣和兩人一起聊著夏天、天氣、山海經……以及一些無關緊要的話題）"
10054005-50 = ""
10054005-51 = "[ns] 「話說回來，山海經在夏天都吃些什麼呢？」"
10054005-52 = "山海經的夏日料理……是嗎？"
10054005-53 = "那真是個好話題呢，老師。#n如果要詳細介紹的話，說上半天都不成問題，不過最具代表性的是──"
10054005-55 = ""
10054005-59 = ""
10054005-60 = "嗯？搞什麼，這不是玄龍門那幫人嗎……？"
10054005-61 = "本來就已經夠熱了，希望他們別再來添亂。"
10054005-62 = "你那句話怎麼讓人有股不好的預感……？"
10054005-63 = "向玄武商會宣告！"
10054005-64 = "為了讓門主大人安然度過夏天……立刻端出滋補養生的料理來！"
10054005-65 = "具體而言就是佛跳牆，或者與之相當的料理！"
10054005-66 = "佛跳牆……？"
10054005-67 = "或者與之相當的料理？#n又在強人所難了……"
10054005-68 = "所以我才說有股不好的預感……"
10054005-69 = "這能怪我嗎？明明是他們自己跑來無理取鬧的吧。"
10054005-70 = ""
10054005-71 = "[ns1] 「佛跳牆？」\n[ns2] 「啊啊，佛跳牆。」"
10054005-74 = "沒錯。那是一道用鹿筋、火腿、松茸、乾鮑魚等等……#n大約二十種左右的珍貴食材，以慢火長時間燉煮製成的料理。"
10054005-75 = "考慮到準備食材的時間，那可是一道得提前三天預約才能按照標準完成的料理呢。"
10054005-76 = "原來您知道啊。那是一道將各種珍貴食材悉數備齊……#n再以慢火燉煮半天至兩天左右才能完成的料理。"
10054005-77 = "因此得在三天前事先告知才能做出像樣的成品。真是的……"
10054005-78 = "不過坦白說，佛跳牆確實會被當成夏天的養生料理。"
10054005-79 = "畢竟所謂的養生料理，無非就是用來為受寒暑氣影響的身體補充元氣的食物嘛。"
10054005-80 = "因此匯集了各種珍貴的滋補食材，又經過長時間燉煮而成的佛跳牆……#n某種程度上確實是相當理想的養生料理。"
10054005-81 = "是啊……前提是要能負擔得起那道料理所需的各項成本就是了。"
10054005-83 = "一進門就要人端出佛跳牆，怎麼可能辦的到啊？#n食材成本姑且不論，你們知道做那道菜要花多少時間嗎？"
10054005-84 = "就是說啊！而且你們肯定會打著「要獻給門主大人」的名義到處挑三揀四的吧！"
10054005-85 = "這點程度的要求，你們本來就該事先預料並做好準備！"
10054005-86 = "門主大人的危機就是山海經的危機！這種事還要我們說第二遍才懂嗎！"
10054005-87 = "你們也是山海經的一分子吧！難不成是心懷不忠與反叛之意？#n門主大人最近看起來已經十分疲憊了！"
10054005-88 = "玄武商會的工作內容哪時候包含「預測未來」了啊？"
10054005-89 = "就是說啊！我們是廚師，又不是算命師！"
10054005-91 = "……會長，該怎麼辦？要不要以「擾亂秩序」為由進行「強制驅離」？"
10054005-92 = "還是再觀察一下吧。#n而且……養生料理之類的東西，我早就準備好了。"
10054005-93 = "真的嗎？"
10054005-94 = ""
10054005-96 = ""
10054005-97 = "[ns] 「真的？」"
10054005-99 = ""
10054005-100 = "嗯。妃姬他每到這個時期都會變得沒精神……畢竟他怕熱嘛。"
10054005-102 = "話雖如此，我準備的也只是涼皮和綠豆湯這類常見的料理罷了。"
10054005-103 = "原來如此……是涼皮和綠豆湯啊。#n確實是方便準備，同時又具有夏天代表性的料理呢。"
10054005-104 = "Q彈的麵條搭配小黃瓜、豆腐與豆芽，帶有微酸風味的涼麵……"
10054005-105 = "還有將慢火熬煮的綠豆冰鎮後加入蜂蜜，帶有甘甜風味的綠豆湯。"
10054005-106 = "真不錯呢。回到宿舍之後我也做來吃吧。"
10054005-107 = "[s] 「夏天總是難免會沒精神呢……」"
10054005-108 = "老師是在擔心妃姬會不會生病嗎？#n嗯，嗯。我明白你想表達什麼。"
10054005-109 = "不過任何人都能看出那不是進補就能改善，而是要好好讓身心靜養才能解決的問題。"
10054005-110 = "例如去空氣清新、山明水秀的好地方之類的……"
10054005-111 = "等一下……靜養身心……？"
10054005-112 = "啊！"
10054005-113 = "[ns] 「怎麼了，瑠美？」"
10054005-114 = "唔嗯……類似突然想到了好主意的感覺吧！"
10054005-115 = "老師，能麻煩你現在去妃姬那裡一趟，幫我看看那孩子的狀況嗎？"
10054005-116 = ""
10054005-117 = "（雖然瑠美那閃閃發亮的眼神讓人有點在意……）"
10054005-118 = ""
10054005-119 = "（不過既然是瑠美說的話，就姑且相信看看吧）"
10054005-120 = "太好了！那就拜託你囉，老師！"
10054005-121 = "既然是會長的吩咐，想必自有深意……我也一同拜託您了。"
10054005-129 = "[ns] 「果然好熱啊～」"
10054005-131 = "那麼，接下來就是聯絡這邊……"
10054005-132 = ""
10054005-133 = ""
10054005-134 = ""
10054005-135 = "呃，這個號碼是玄武商會？#n唉……雖然有股不祥的預感，但也只能接了。"
10054005-136 = ""
10054005-138 = ""
10054005-139 = "哎呀，瑠美會長？請問有什麼事嗎？"
10054005-140 = ""
10054005-142 = ""
10054005-143 = "……咦？"
