[translation]
10054005-1 = "프롤로그;어느 더운 여름날"
10054005-7 = "[ns] \"…….\""
10054005-10 = "괘, 괜찮으십니까? 선생님? 갑자기 테이블에 엎어지시다니……."
10054005-11 = "[s] \"더워~\""
10054005-12 = "아……. 네. 확실히 오늘은 조금 덥군요."
10054005-17 = "그럴 때는 수분 섭취가 중요하죠! 여기, 차입니다!"
10054005-19 = "(고맙게 찻잔을 받아 마셨다…….)"
10054005-21 = "(그런데……!)"
10054005-23 = "[ns] \"뜨거워?!\""
10054005-24 = "뜨겁다뇨. 이 정도면 아직 따듯한 정도인걸요?"
10054005-25 = "그렇습니다, 선생님! 찬물은 기본적으로 몸에 안 좋다구요?"
10054005-26 = "더군다나 더운 날이라고 급하게 찬물을 마시면, 위장이 놀라서 아플 수도 있으니까요."
10054005-27 = "양기가 강할수록 그 기운을 낭비하는 데 조심하라! 요리에도 적용되는 말이죠."
10054005-32 = "[ns] \"그렇지만 역시 더워…….\""
10054005-33 = "하하하. 확실히 더운 날이네. 에어컨을 풀 가동중이지만, 이건 조금 심할 정도야."
10054005-34 = "자, 선생님. 너무 티 내지 말고, 이거 마셔."
10054005-36 = "(루미가 웃으면서 건네준 것은…… 얼음컵과 레몬 홍차 음료였다!)"
10054005-38 = "[ns] \"고마워, 루미. 루미 최고. 세계 최고의 요리사.\""
10054005-39 = "그, 그 정도로 대단한 건 아닌데 말이야."
10054005-40 = "산해경은 찬 음료를 전통적으로 그다지 좋아하지 않았지만……. 아무래도 요즘은 외부 손님이 한층 더 늘어났으니 말이지."
10054005-41 = "상황과 상대에 맞는 준비를 미리미리 해 둬야, 한층 더 좋은 접객을 할 수 있지 않겠어?"
10054005-42 = "상업이라는 것은 기본적으로, 그 물건이 필요한 사람에게 그 물건을 가져다주는 일이니까."
10054005-43 = "혹시 모자라신다면 더 말씀해 주십시오. 레몬 홍차 말고도 자몽 자스민차, 복숭아 우롱차, 유자 홍차도 있으니까요."
10054005-49 = "(그렇게 둘과 같이, 여름과 날씨와 산해경과…… 아무래도 좋은 이야기들을 나눴다.)"
10054005-51 = "[ns] \"그러고 보니, 산해경에서는 여름에 뭘 먹어?\""
10054005-52 = "산해경의 여름 음식…… 말씀입니까?"
10054005-53 = "좋은 주제네, 선생님. 제대로 설명하자면 한나절은 이야기할 수 있겠지만, 가장 흔한 것은–"
10054005-60 = "응? 뭐야, 현룡문 녀석들이잖아……?"
10054005-61 = "안 그래도 더운 날인데, 더 짜증 나게만 하지 않았으면 좋겠네."
10054005-62 = "지금 그 말, 뭔가 불길하게 느껴진다……?"
10054005-63 = "현무상회에 고한다!"
10054005-64 = "문주님의 여름을 위해…… 보양식을 내놓아라!"
10054005-65 = "보다 구체적으로는, 불도장(佛跳墙)이나 그에 준하는 것을!"
10054005-66 = "불도장……?"
10054005-67 = "아니면 그에 버금가는 것이요? 이거 또 골치 아픈 억지를……."
10054005-68 = "그래서 불길하댔잖아……."
10054005-69 = "내 탓이냐? 쟤네가 억지 부리기 시작한 거지."
10054005-71 = "[ns1] \"불도장?\"\n[ns2] \"아, 불도장.\""
10054005-74 = "그렇습니다. 사슴 힘줄이나 화퇴, 송이버섯이나 말린 전복 같은…… 귀한 재료 스무 가지 정도를 한나절에서 이틀 동안 푹 고아서 만드는 요리죠."
10054005-75 = "재료 수급 측면까지 생각하면, 3일 전에 미리 예약해 줘야 제대로 만들 수 있는 요리인데 말이야."
10054005-76 = "알고 계시는군요. 네. 귀한 재료란 재료는 전부 모아……. 최소 한나절에서 이틀 정도 푹 고아야 완성되는 요리입니다."
10054005-77 = "3일 전에는 미리 이야기해 줘야, 제대로 된 걸 만들 수 있는데. 그것 참."
10054005-78 = "불도장을…… 여름 보양식으로 먹기도 하는 것은 사실입니다."
10054005-79 = "보양식이라는 것은 결국, 너무 덥거나 추운 나머지 기운을 빼앗겨서 허해진 몸에, 그 기운을 보충하는 음식인 거잖아?"
10054005-80 = "그러니…… 좋다는 것은 전부 넣고 푹 고아 낸 불도장이야말로, 어떤 의미로는 보양식에 어울리는 요리이기도 하지."
10054005-81 = "네……. 그 요리에 여러 가지로 들어가는 자원을, 감당할 수 있다면 말이죠."
10054005-83 = "다짜고짜 들어와서 불도장 같은 걸 내놓으라고 하면 어떡해? 재룟값은 둘째 치더라도, 만드는 데 얼마나 오래 걸리는지 아냐?"
10054005-84 = "맞아! 거기에 너희들, 문주님 드릴 거라고 온갖 잔소리는 다 할 거잖아!"
10054005-85 = "그 정도는 미리 헤아려 준비해야 했을 거 아냐!"
10054005-86 = "문주님의 위기는 산해경의 위기! 두 번 말하면 입이 아플 사안이다!"
10054005-87 = "너희들도 산해경이잖아! 혹시 불충과 역심이라도 품고 있는 거냐? 안 그래도 문주님이 요즘 피곤하신 기색을 보이시는데!"
10054005-88 = "언제부터 현무상회 업무에 '앞일 예측하기' 같은 게 추가된 거야?"
10054005-89 = "그래! 우리는 요리사지 역술가가 아니라고!"
10054005-91 = "……어떻게 할까요, 회장님. 점내 소란 유발로 '강제 조치'라도 할까요?"
10054005-92 = "조금만 더 두고 보자고. 뭐…… 보양식 같은 건 내가 따로 준비해 두고 있긴 했으니까."
10054005-93 = "정말입니까?"
10054005-97 = "[ns] \"진짜?\""
10054005-100 = "응. 키사키 녀석, 이쯤 되면 언제나 기운이 빠지곤 했거든. 더위에 약하니까."
10054005-102 = "그렇다고는 해도, 량피(凉皮)와 녹두탕(绿豆汤) 같은, 흔히 먹을 수 있는 요리 정도였지만."
10054005-103 = "아하……. 량피와 녹두탕이었군요. 확실히 쉽게 구할 수 있으면서도, 여름이라면 생각나는 요리들이죠."
10054005-104 = "쫄깃한 면에 오이와 두부, 숙주를 올려 새콤하고 차가운 맛으로 먹는 국수."
10054005-105 = "그리고 녹두를 뭉근하게 끓여서 차게 식힌 뒤, 꿀을 넣어 달콤하게 마시는 녹두탕……."
10054005-106 = "좋네요. 저도 기숙사에 돌아가면, 만들어서 먹어야겠습니다."
10054005-107 = "[s] \"여름엔 으레 기운이 빠지기 마련이긴 하지만…….\""
10054005-108 = "키사키가 아플까 봐 신경 쓰이는 거야, 선생님? 응, 응. 무슨 말인지 알겠어."
10054005-109 = "하지만 누가 봐도 그 문제는, 좋은 음식을 먹어서 해결되는 것이 아니라, 몸과 마음을 좀 쉬게 해야 해결될 텐데."
10054005-110 = "가령 공기 좋고 물 좋은 곳이라던가."
10054005-111 = "가만……. 몸과 마음을 쉬게 한다……?"
10054005-112 = "!"
10054005-113 = "[ns] \"왜 그래, 루미?\""
10054005-114 = "으음, 뭔가 좋은 생각이라고나 할까, 그 비슷한 것이라고나 할까! 그런 게 떠올라서 말이지!"
10054005-115 = "그러니까 선생님. 지금부터 키사키한테 조금 다녀와 주겠어? 그 애 상태도 조금 볼 겸 해서 말이지."
10054005-117 = "(루미의 반짝이는 표정 역시 조금 신경 쓰였지만…….)"
10054005-119 = "(루미가 한 말이니까, 일단 믿어 보기로 했다.)"
10054005-120 = "좋았어. 그러면 부탁할게, 선생님!"
10054005-121 = "회장님의 말씀이니 어련히 뜻이 있겠습니다만……. 저도 잘 부탁드리겠습니다."
10054005-129 = "[ns] \"역시, 덥구만~\""
10054005-131 = "그러면 다음은, 여기로 연락을……."
10054005-135 = "윽……? 이 번호는 현무상회? 하아……. 뭔가 불길하지만 어쩔 수 없죠."
10054005-139 = "어머나. 루미 회장님? 무슨 일이세요?"
10054005-143 = "……네에?"
