[translation]
10054005-1 = "บทเริ่มต้น;วันหนึ่งในฤดูร้อน"
10054005-7 = "[ns] \"...\""
10054005-9 = ""
10054005-10 = "ปะ... เป็นอะไรหรือเปล่าคะ คุณครู? อยู่ๆ ก็ฟุบลงกับโต๊ะแบบนี้..."
10054005-11 = "[s] \"ร้อนจัง~\""
10054005-12 = "อ่า... ค่ะ วันนี้ร้อนอยู่หน่อยจริงๆ ด้วยสินะคะ"
10054005-13 = ""
10054005-15 = ""
10054005-16 = ""
10054005-17 = "เวลาแบบนี้ต้องดื่มน้ำให้เพียงพอค่ะ! นี่ค่ะ ชา!"
10054005-18 = ""
10054005-19 = "(รับถ้วยชามาดื่มด้วยความขอบคุณ...)"
10054005-20 = ""
10054005-21 = "(แต่ว่า...!)"
10054005-22 = ""
10054005-23 = "[ns] \"ชาร้อนนี่นา?!\""
10054005-24 = "ร้อนอะไรกันคะ? แค่นี้เรียกว่าอุ่นๆ ต่างหากค่ะ"
10054005-25 = "ใช่แล้วค่ะ คุณครู! โดยพื้นฐานแล้ว น้ำเย็นไม่ดีต่อร่างกายนะคะ?"
10054005-26 = "ยิ่งในวันที่อากาศร้อน ถ้ารีบดื่มน้ำเย็น กระเพาะอาจตกใจจนปวดท้องได้นะคะ"
10054005-27 = "ยิ่งพลังหยางแรงกล้า ก็ยิ่งต้องระวังไม่ให้พลังนั้นสูญเปล่า! คำกล่าวนี้ใช้กับการทำอาหารได้ด้วยนะคะ"
10054005-28 = ""
10054005-30 = ""
10054005-32 = "[ns] \"แต่ยังไงก็ร้อนอยู่ดี...\""
10054005-33 = "ฮ่าฮ่าฮ่า วันนี้ร้อนจริงๆ เลย ถึงจะเปิดแอร์เต็มที่แล้ว แต่อากาศร้อนขนาดนี้ก็เกินไปหน่อยนะ"
10054005-34 = "นี่ คุณครู ไม่ต้องออกอาการขนาดนั้นหรอก ดื่มนี่สิ"
10054005-35 = ""
10054005-36 = "(สิ่งที่รูมิยื่นมาให้พร้อมรอยยิ้มก็คือ... แก้วใส่น้ำแข็งกับชามะนาว!)"
10054005-37 = ""
10054005-38 = "[ns] \"ขอบใจนะ รูมิ รูมิสุดยอดเลย เชฟที่เก่งที่สุดในโลก\""
10054005-39 = "กะ... ก็ไม่ได้เก่งถึงขนาดนั้นหรอก"
10054005-40 = "ตามธรรมเนียมแล้ว ซานไห่จิงไม่ค่อยนิยมเครื่องดื่มเย็นๆ เท่าไรหรอก... แต่ช่วงนี้มีแขกจากภายนอก#nเพิ่มขึ้นกว่าเดิมเยอะมาก"
10054005-41 = "เราก็เลยต้องเตรียมของให้เหมาะกับสถานการณ์และลูกค้าไว้ก่อนล่วงหน้า ถึงจะให้บริการได้ดียิ่งขึ้น ใช่มั้ยล่ะ?"
10054005-42 = "เพราะโดยพื้นฐานแล้ว การค้าขายก็คือการเอาสินค้าไปมอบให้คนที่ต้องการสินค้านั้นๆ ยังไงล่ะ"
10054005-43 = "ถ้าต้องการเพิ่มก็บอกได้เลยนะคะ นอกจากชามะนาวแล้ว ยังมีชามะลิเกรปฟรุต ชาอู่หลงพีช และก็ชาดำยูซุด้วยค่ะ"
10054005-44 = ""
10054005-46 = ""
10054005-47 = ""
10054005-49 = "(จากนั้นคุณครู รูมิ กับเรย์โจวก็พูดคุยเรื่องฤดูร้อน สภาพอากาศ ซานไห่จิง... และเรื่องสัพเพเหระต่างๆ ด้วยกัน)"
10054005-50 = ""
10054005-51 = "[ns] \"ว่าแต่ ในฤดูร้อนที่ซานไห่จิงส่วนใหญ่จะกินอะไรกันเหรอ?\""
10054005-52 = "หมายถึง... อาหารฤดูร้อนของซานไห่จิงเหรอคะ?"
10054005-53 = "เป็นหัวข้อที่ดีเลย คุณครู ถ้าจะอธิบายให้ละเอียดๆ คงต้องพูดกันยาวเลยละ แต่ถ้าจะให้สรุปเลยละก็ อาหารที่กินบ่อยที่สุดก็คือ..."
10054005-55 = ""
10054005-59 = ""
10054005-60 = "หืม? อะไรกัน พวกมังกรดำนี่นา...?"
10054005-61 = "อากาศก็ร้อนอยู่แล้ว หวังว่าจะไม่มาทำให้หงุดหงิดกว่าเดิมนะ"
10054005-62 = "คำพูดเมื่อกี้ ฟังดูเป็นลางไม่ดียังไงชอบกลแฮะ...?"
10054005-63 = "ขอประกาศต่อย่านการค้าเทพเต่าดำ!"
10054005-64 = "จงทำอาหารบำรุงร่างกายรับฤดูร้อน... สำหรับท่านประมุข!"
10054005-65 = "พูดให้เจาะจงก็คือ ขอพระกระโดดกำแพง หรืออาหารที่เทียบเท่ากัน!"
10054005-66 = "พระกระโดดกำแพง...?"
10054005-67 = "หรืออาหารที่เทียบเท่างั้นเหรอคะ? เป็นข้อเรียกร้องชวนปวดหัวอีกแล้ว..."
10054005-68 = "ก็บอกแล้วไงว่าเป็นลางไม่ดี..."
10054005-69 = "แล้วมันเป็นความผิดของฉันเหรอ? พวกนั้นต่างหากที่มาเรียกร้องอะไรไร้เหตุผล"
10054005-70 = ""
10054005-71 = "[ns1] \"พระกระโดดกำแพง?\"\n[ns2] \"อ๋อ พระกระโดดกำแพง\""
10054005-74 = "ใช่ค่ะ เป็นอาหารที่ใช้วัตถุดิบล้ำค่าราวยี่สิบชนิด ทั้งเอ็นกวาง แฮมจินหัว เห็ดสน หอยเป๋าฮื้อแห้ง... แล้วก็ตุ๋นนานครึ่งวันถึงสองวันเลยค่ะ"
10054005-75 = "ถ้าคำนึงถึงเวลาจัดหาวัตถุดิบด้วย ก็ต้องสั่งล่วงหน้าสามวัน ถึงจะทำออกมาได้อย่างสมบูรณ์น่ะ"
10054005-76 = "รู้จักด้วยสินะคะ ค่ะ มันเป็นอาหารที่ทำจากวัตถุดิบล้ำค่าหลายอย่าง... แล้วตุ๋นอย่างน้อยครึ่งวันถึงราวๆ สองวันกว่าจะเสร็จค่ะ"
10054005-77 = "เมนูนี้น่ะ ต้องบอกล่วงหน้าสามวัน ถึงจะทำออกมาได้อย่างสมบูรณ์แท้ๆ จริงๆ เลย "
10054005-78 = "จริงอยู่ค่ะ... ว่าบางครั้งเราก็กินพระกระโดดกำแพงเป็นอาหารบำรุงในฤดูร้อน"
10054005-79 = "อาหารบำรุงก็คืออาหารที่ช่วยเติมพลังให้ร่างกายที่อ่อนแรง เนื่องจากเสียพลังไปกับอากาศที่ร้อน หรือว่าหนาวเกินไป"
10054005-80 = "เพราะงั้น... พระกระโดดกำแพงที่ใส่วัตถุดิบดีๆ ลงไปแล้วตุ๋นจนได้ที่ ในแง่หนึ่งก็ถือว่าเหมาะจะเป็น#nอาหารบำรุงเหมือนกัน"
10054005-81 = "ค่ะ... ถ้าสรรหาสารพัดวัตถุดิบที่ต้องใช้ในอาหารจานนั้นไหวละก็นะคะ"
10054005-83 = "แต่จู่ๆ จะเข้ามา แล้วสั่งให้เสิร์ฟพระกระโดดกำแพงเลยได้ยังไงกัน? ค่าวัตถุดิบก็อีกเรื่อง แต่ที่สำคัญกว่านั้นคือ รู้มั้ยว่ามันต้องใช้เวลาทำนานแค่ไหนน่ะ?"
10054005-84 = "ใช่! แถมนี่ยังเป็นอาหารเพื่อท่านประมุขอีก งั้นพวกเธอก็ต้องมาจู้จี้สารพัดแน่ๆ!"
10054005-85 = "เรื่องแบบนี้น่ะ พวกเธอก็ควรคาดการณ์และเตรียมไว้ล่วงหน้าแล้วไม่ใช่หรือไง!"
10054005-86 = "วิกฤตของท่านประมุข ก็คือวิกฤตของซานไห่จิง! เรื่องนี้จะต้องให้พูดซ้ำสองให้เมื่อยปากทำไม!"
10054005-87 = "แล้วพวกเธอเองก็เป็นคนของซานไห่จิงไม่ใช่เหรอ! หรือว่ากำลังคิดไม่ซื่อและคิดกบฏอยู่? ช่วงนี้ท่านประมุขยิ่งดูเหนื่อยล้าอยู่ด้วย!"
10054005-88 = "ย่านการค้าเทพเต่าดำต้องทำงาน 'ทำนายอนาคต' ตั้งแต่เมื่อไรกัน?"
10054005-89 = "ใช่! พวกเราเป็นเชฟนะ ไม่ใช่หมอดูสักหน่อย!"
10054005-91 = "...จะทำยังไงดีคะ ท่านประธาน ใช้ 'มาตรการบังคับ' ฐานก่อความวุ่นวายในร้านเลยมั้ยคะ?"
10054005-92 = "รอดูสถานการณ์อีกสักหน่อยเถอะ เพราะยังไง... ฉันก็เตรียมอาหารบำรุงไว้ต่างหากแล้ว"
10054005-93 = "จริงเหรอคะ?"
10054005-94 = ""
10054005-96 = ""
10054005-97 = "[ns] \"จริงเหรอ?\""
10054005-99 = ""
10054005-100 = "อื้อ ก็ยัยคิซากิน่ะไม่ถูกกับอากาศร้อน พอถึงช่วงนี้ทีไรก็มักจะหมดแรงทุกที"
10054005-102 = "แต่ถึงจะบอกว่าเตรียมอาหารบำรุงไว้แล้ว แต่นั่นก็เป็นแค่อาหารที่กินกันทั่วๆ ไป อย่างเหลียงผี#nกับถั่วเขียวต้มเท่านั้นแหละ"
10054005-103 = "อ๋อ... เหลียงผีกับถั่วเขียวต้มสินะคะ เป็นอาหารที่หาทานได้ง่าย และชวนให้นึกถึงฤดูร้อนจริงๆ ค่ะ"
10054005-104 = "ก๋วยเตี๋ยวที่ใช้เส้นเหนียวนุ่ม โปะด้วยแตงกวา เต้าหู้ และถั่วงอก ออกรสเปรี้ยวๆ กินแบบเย็นๆ"
10054005-105 = "แล้วก็ถั่วเขียวต้มที่เคี่ยวถั่วเขียวด้วยไฟอ่อนจนสุก จากนั้นพักให้เย็น ก่อนใส่น้ำผึ้งให้มีรสหวาน..."
10054005-106 = "ดีจังเลยนะคะ ไว้ถ้ากลับหอพักแล้ว ฉันจะทำกินบ้างค่ะ"
10054005-107 = "[s] \"พอเข้าฤดูร้อนก็จะรู้สึกหมดเรี่ยวหมดแรงเป็นธรรมดาเลยนะ...\""
10054005-108 = "กังวลว่าคิซากิจะป่วยเหรอ คุณครู? อื้อๆ ฉันเข้าใจแล้วละว่าหมายถึงอะไร"
10054005-109 = "แต่ปัญหานั้นไม่ได้แก้ได้ด้วยการกินอาหารดีๆ หรอก ต้องให้ทั้งร่างกายและจิตใจได้พักบ้างสิ ถึงจะได้รู้สึกดีขึ้น"
10054005-110 = "อย่างเช่น ไปในสถานที่ที่อากาศดีๆ และก็มีน้ำใสสะอาดๆ"
10054005-111 = "เดี๋ยวนะ... ให้ร่างกายและจิตใจได้พัก...?"
10054005-112 = "!"
10054005-113 = "[ns] \"เป็นอะไรไปเหรอ รูมิ?\""
10054005-114 = "อืม คงต้องเรียกว่าไอเดียดีๆ หรืออะไรทำนองนั้น! พอดีฉันนึกอะไรแบบนั้นขึ้นมาได้น่ะ!"
10054005-115 = "เพราะงั้น คุณครู ช่วยไปหาคิซากิตอนนี้หน่อยได้มั้ย? ถือโอกาสนี้ไปดูอาการของคิซากิด้วยไง"
10054005-116 = ""
10054005-117 = "(แม้คุณครูจะรู้สึกติดใจกับสีหน้าที่เป็นประกายของรูมิอยู่บ้าง...)"
10054005-118 = ""
10054005-119 = "(แต่ในเมื่อรูมิเป็นคนพูด จึงได้ตัดสินใจเชื่อดูก่อน)"
10054005-120 = "ดีละ ถ้างั้นก็ขอฝากด้วยนะ คุณครู!"
10054005-121 = "ในเมื่อเป็นคำพูดของท่านประธาน ก็คงมีเหตุผลอยู่แล้ว... งั้นฉันก็ขอฝากด้วยนะคะ"
10054005-129 = "[ns] \"ร้อนจังเลยน้า~\""
10054005-131 = "เอาละ งั้นต่อไปก็ติดต่อไปที่นี่..."
10054005-132 = ""
10054005-133 = ""
10054005-134 = ""
10054005-135 = "อึก...? นี่มันเบอร์ของย่านการค้าเทพเต่าดำนี่นา? เฮ้อ... ถึงจะรู้สึกเป็นลางไม่ดี แต่ก็ช่วยไม่ได้สินะคะ"
10054005-136 = ""
10054005-138 = ""
10054005-139 = "ตายจริง ท่านประธานรูมิเหรอคะ? มีอะไรเหรอคะ?"
10054005-140 = ""
10054005-142 = ""
10054005-143 = "คะ...?"
