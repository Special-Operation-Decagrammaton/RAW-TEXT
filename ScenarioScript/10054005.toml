[translation]
10054005-1 = "Prologue;A Hot Summer Day"
10054005-7 = "[ns] \"...\""
10054005-9 = ""
10054005-10 = "A-Are you okay, Sensei? And please get your head off the table..."
10054005-11 = "[s] \"It's sooo hooot...\""
10054005-12 = "Ah, yeah. It's hotter than usual today."
10054005-13 = ""
10054005-15 = ""
10054005-16 = ""
10054005-17 = "Make sure you stay hydrated! Here, drink this tea!"
10054005-18 = ""
10054005-19 = "I very gratefully took the cup from her."
10054005-20 = ""
10054005-21 = "However..."
10054005-22 = ""
10054005-23 = "[ns] \"Hot!!\""
10054005-24 = "Huh? This is warm at best."
10054005-25 = "It's the perfect temperature. Drinking cold water is bad for you, you know. "
10054005-26 = "Especially on a hot day like today. You could shock your system!"
10054005-27 = "You need to preserve strong yang energy! It's just like cooking!"
10054005-28 = ""
10054005-30 = ""
10054005-32 = "[ns] \"But it's sooo hooot...\""
10054005-33 = "Hahaha. To be fair, even our AC system is losing to the heat right now."
10054005-34 = "Here, drink this instead. The kids can be a little strict sometimes."
10054005-35 = ""
10054005-36 = "With the smile of a goddess, Rumi handed me an ice-cold cup of lemon black tea."
10054005-37 = ""
10054005-38 = "[ns] \"Thank you, Rumi. You're the best. The best chef in the entire world.\""
10054005-39 = "Th-That's a bit of an exaggeration."
10054005-40 = "Traditionally, Shanhaijing's drink culture has always leaned towards hot drinks. But with all of the tourists coming in as of late..."
10054005-41 = "Well, I personally say hospitality trumps culture in certain situations!"
10054005-42 = "Especially in our line of work. Good businesses know how to fulfill a market need."
10054005-43 = "If you need more, just say the word. We also have grapefruit jasmine, peach oolong, and yuzu black tea."
10054005-44 = ""
10054005-46 = ""
10054005-47 = ""
10054005-49 = "The three of us idly chatted about summer, the hot weather, Shanhaijing, and whatever else came to mind as we sipped on our drinks."
10054005-50 = ""
10054005-51 = "[ns] \"What dishes do the locals usually eat during the summer here?\""
10054005-52 = "Hm... Our popular summer dishes?"
10054005-53 = "An excellent question, Sensei. Now, there's a whole medley of refreshing dishes people tend to eat, but our most famous—"
10054005-55 = ""
10054005-59 = ""
10054005-60 = "Huh? What're a bunch of Genryumon minions doing here?"
10054005-61 = "Ugh, the heat's already put me in a bad mood. I hope they're not here to cause a scene."
10054005-62 = "Please go knock on wood or something."
10054005-63 = "Listen up, Black Tortoise Promenade!"
10054005-64 = "To maintain Madam Kisaki's good health this summer, cook us the most nourishing meal in existence!"
10054005-65 = "Only something of Monk's Temptation's caliber will do!"
10054005-66 = "\"Monk's Temptation\"...?"
10054005-67 = "Do you even know what you're asking for? Why're you barging in here and making unreasonable demands?"
10054005-68 = "You jinxed it."
10054005-69 = "You're putting this on ME? They're the crazy ones!"
10054005-70 = ""
10054005-71 = "[ns1] \"Monk's Temptation?\"\n[ns2] \"Ah, Monk's Temptation.\""
10054005-74 = "It's a dish made by simmering around twenty rare ingredients for two full days: deer tendon, Jinhua ham, pine mushroom, dried abalone, the list goes on."
10054005-75 = "Procuring those kinds of ingredients is its own challenge, so we would need at least three days to make it properly."
10054005-76 = "You've heard of it before? It's a dish made by simmering all sorts of rare ingredients...for at least a day, preferably two."
10054005-77 = "Including prep, we'd need around three days to make it properly. "
10054005-78 = "You wouldn't think of it as a typical \"summer\" food, but people like it for its health benefits."
10054005-79 = "Whether it's cold or hot, extreme temperatures can make you sick. And the best way to offset that is with a hearty meal, isn't it?"
10054005-80 = "That's why the dish \"Monk's Temptation\" is synonymous with \"nourishing\"... Like the \"superfoods\" people are always marketing these days."
10054005-81 = "But you're not going to find those kinds of ingredients in your everyday grocery store."
10054005-83 = "Who do you think you are?! You think you can just waltz in here and make ridiculous demands of us?! We're busy enough as it is!"
10054005-84 = "And I am NOT cooking with your chirping over my shoulder and criticizing every step of the process in \"the name of Madam Kisaki!\""
10054005-85 = "Well YOU should have anticipated this! It's for Madam President!"
10054005-86 = "How many times do we have to repeat ourselves?! Madam Kisaki's fate is Shanhaijing's fate!"
10054005-87 = "Are you not a proud student of Shanhaijing? Madam Kisaki's health has been weak as of late! I could have you arrested for treason!"
10054005-88 = "Wow! I'm SO excited to hear that the Black Tortoise Promenade has gained the power of precognition all of a sudden! Maybe I can predict when this heatwave is going to end!"
10054005-89 = "Seriously! We're CHEFS, not FORTUNE TELLERS!!"
10054005-91 = "...What're your orders, President? We do have the right to refuse service...by any means necessary."
10054005-92 = "Now, now. Let's all take it down a notch. I actually did anticipate this one, so I have a few things prepped already."
10054005-93 = "Really?"
10054005-94 = ""
10054005-96 = ""
10054005-97 = "[ns] \"Really?\""
10054005-99 = ""
10054005-100 = "Kisaki doesn't do well in the heat, so her health tends to dip around this time of year."
10054005-102 = "Although, I'd been thinking more along the lines of cold-skin noodles and mung bean soup."
10054005-103 = "Ah. That's a good call. They're easy to make and really popular during the summer."
10054005-104 = "Cold, tangy, chewy noodles topped with cucumber, tofu, and sprouts..."
10054005-105 = "And mung bean soup, made with simmered mung beans and honey."
10054005-106 = "Now I'm craving some. Maybe I'll make some when I get back to my room."
10054005-107 = "[s] \"It's not completely unusual to get a summer cold, but...\""
10054005-108 = "You're worried about Kisaki, aren't you, Sensei? I share the sentiment."
10054005-109 = "But even good food can only do so much. More than anything, she needs rest, mentally and physically."
10054005-110 = "Like a vacation, somewhere with clean air and water..."
10054005-111 = "Hm... Somewhere she can let her body and mind rest..."
10054005-112 = "Oh!"
10054005-113 = "[ns] \"What's wrong, Rumi?\""
10054005-114 = "I may have stumbled on a genius idea! Maybe!"
10054005-115 = "Sensei, do you have a little extra time today? Could you pay Kisaki a visit and see how she's doing?"
10054005-116 = ""
10054005-117 = "Rumi's sparkling expression worried me ever so slightly."
10054005-118 = ""
10054005-119 = "But she's never led me astray before, so I decided to trust her."
10054005-120 = "Perfect, then I'll be counting on you!"
10054005-121 = "I'm sure the president is cooking up something reasonable, but I'm counting on you too...in a different way."
10054005-129 = "[ns] \"It really is hot today...\""
10054005-131 = "Now to do my part. I just need to make a quick call..."
10054005-132 = ""
10054005-133 = ""
10054005-134 = ""
10054005-135 = "Ugh... Why is the Black Tortoise Promenade calling? *sigh* How ominous... But I suppose I must answer."
10054005-136 = ""
10054005-138 = ""
10054005-139 = "If it isn't President Rumi. How can I assist you today?"
10054005-140 = ""
10054005-142 = ""
10054005-143 = "...Eh?"
