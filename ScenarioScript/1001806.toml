[translation]
1001806-1 = "부끄럼쟁이의 아르바이트 2"
1001806-2 = "놀이공원 정문 입구"
1001806-4 = "무리에요……!"
1001806-5 = "사람을 직접 마주하지 않고서 할 수 있는 아르바이트라고 하셨으면서, 사람이 많은 놀이공원으로 저를 데려오시다니……."
1001806-6 = "선생님을 믿었는데…… 믿었었는데……!"
1001806-7 = "[s] \"걱정하지 마. 지난번과 같은 아르바이트는 아니니까.\""
1001806-8 = "하지만 놀이공원에서 사람들과 마주치지 않고 할 수 있는 아르바이트가 있을 리가……."
1001806-9 = "……네? 인형탈을 쓰고 아이들에게 풍선을 나누어 주는 아르바이트요?"
1001806-10 = "무, 물론 맨얼굴로 손님들과 마주하는 것보다는 낫지만…… 그래도 모르는 사람에게 먼저 다가가는 건 여전히 무서운걸요……."
1001806-11 = "게다가 인형탈을 쓴 아르바이트 학생은 장난의 표적이 되기도 쉬워서……."
1001806-12 = "혹시 아이들이 장난이라며 인형 옷에 수류탄을 집어넣거나, 슬러그 탄을 쏘며 쫓아오면 어쩌죠……."
1001806-13 = "[s] \"그런 일은 없지 않을까…….\""
1001806-14 = "그, 그렇겠죠? 제가 너무 걱정을 하는 거겠죠?"
1001806-15 = "[s1] \"저번보다 더 쉬운 일이니 문제없을 거야.\"\n[s2] \"유즈라면 무엇이든 잘 할 수 있을 거야.\""
1001806-16 = "……선생님 말이 맞아요. 다른 사람의 시선이 무섭다고 계속 도망치기만 했더라면, 저는 영영 캐비닛 속에서 머무르며 다른 부원들에게 폐만 끼치고 있었을 거예요."
1001806-17 = "……선생님 말이 맞아요. 다른 사람의 시선이 무섭다고 계속 도망치기만 했더라면, 저는 영영 캐비닛 속에서 머무르며 다른 부원들에게 폐만 끼치고 있었을 거예요."
1001806-18 = "언제까지나 외톨이로 머무를 수는 없으니까……."
1001806-19 = "저, 이번에는 정말 열심히 할게요!"
1001806-20 = "하나오카 유즈, 노력하겠습니다!"
1001806-29 = "어, 어린이 여러분. 풍선 받아 가세요. 푸, 풍선이에요!"
1001806-30 = "와, 감사합니다!"
1001806-31 = "처, 천만에요. 하, 하하하……."
1001806-34 = "(인형탈을 쓰고 있어서 그런 걸까요……. 어쩐지 평소보다 말을 거는 게 어렵지 않은 느낌이네요.)"
1001806-35 = "(이대로 영업이 끝날 때까지만 버티면…….)"
1001806-38 = "저기…… 인형탈 쓴 언니."
1001806-39 = "네, 네, 넷? 저, 저 말인가요?"
1001806-40 = "응. 그 인형탈, 페로로지?"
1001806-41 = "네, 네……! 마, 맞아요……! 페로로랍니다!"
1001806-42 = "아, 아앗! 그, 그러고 보니 페로로는 이런 말투를 쓰지 않았었죠?"
1001806-43 = "죄, 죄송합니다, 페로페로……! #n부, 부디 인형 옷에 대고 슬러그 탄을 쏘는 것만큼은 참아주세요, 페로페로……!"
1001806-44 = "그게 아니라…… 나는 그저 페로로랑 같이 사진을 찍고 싶어서……"
1001806-45 = "같이 사진 한 장만 찍어주면 안 돼?"
1001806-46 = "그런 거라면야…… 어, 얼마든지 괜찮아요. 페로페로……."
1001806-47 = "와아, 고마워! #n엄마. 여기야, 여기! 빨리 와서 나랑 페로로랑 함께 사진 찍어줘~."
1001806-50 = "(다들 어쩐지…… 즐거워 보여…….)"
1001806-51 = "(이렇게 누군가가 즐거워하는 모습을 가까이서 볼 수 있다면, 접객 아르바이트도 나쁘지만은 않을지도…….)"
1001806-54 = "후우…… 어, 어떻게든 아르바이트를 무사히 끝냈네요……."
1001806-55 = "[s] \"처음에 비해서 많이 익숙해진 모양이네.\""
1001806-56 = "그, 그렇지 않아요……! 낯선 사람을 만나는 건 아직도 무서운걸요……!"
1001806-57 = "하지만 그래도…… 누군가를 기쁘게 할 수 있다는 건 보람찬 일인 것 같아요."
1001806-58 = "제 노력으로 인해서 누군가가 즐거워하고 행복을 얻을 수 있다면, 아무리 힘들고 괴로운 일이라 하더라도 조금은 즐거워지거든요."
1001806-59 = "마치 게임을 만드는 것처럼……."
1001806-60 = "선생님. 저, 좀 더 열심히 노력할게요!"
1001806-61 = "그러니 앞으로 조금만 더…… 저를 지켜봐 주세요!"
