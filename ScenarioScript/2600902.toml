[translation]
2600902-1 = "작업 레퍼런스"
2600902-2 = "게임개발부 부실"
2600902-3 = "(샬레의 일로 밀레니엄 학원에 들린 김에 게임개발부 학생들을 응원하기 위해 부실을 찾았다.)"
2600902-7 = "(하지만 부실에는 아무도 없었다……)"
2600902-11 = "[ns] 겉옷을 걸어 두기 위해 철제 캐비닛을 연다."
2600902-16 = "히, 히익!"
2600902-17 = "서, 서, 서, 선생님……?! 어째서 여기에……"
2600902-18 = "[ns1] \"미안, 캐비닛 안에 있는 줄은 몰랐어.\"\n[ns2] \"응원 차 간식을 조금 가져왔는데……\""
2600902-22 = "[ns] \"어째서 메이드복……?\""
2600902-23 = "그, 그게 그러니까…… 여기에는 오해가……"
2600902-24 = "아, 아뇨. 다른 사람 때문에 억지로 입은 건 아니고, 제 의지로 입은 게 맞는데요……!"
2600902-25 = "그게 그러니까, 제가 메이드복을 입고 싶었다는 건 아니지만……"
2600902-26 = "우, 우선 설명을 하게 해주세요……!"
2600902-28 = "(이후, 횡설수설하는 유즈를 간신히 진정시킨 뒤 설명을 들었다.)"
2600902-30 = "[ns] \"……작업 레퍼런스?\""
2600902-31 = "네. 그게 그러니까……"
2600902-32 = "이번에 새로 만들고 있는 게임에 메이드 캐릭터를 넣으려고 했는데요……"
2600902-33 = "메이드복은 장식도 많고, 구조도 복잡해서 미도리가 그림을 그리는 데 어려움이 많다고 해서……"
2600902-34 = "제가 잠시 메이드복을 입은 채로 모델을 해주기로 했었어요."
2600902-35 = "[s] \"그런데 어째서 캐비닛 안에……?\""
2600902-36 = "그게, 미도리가 잠시 두고 온 물건이 있다고 해서 기숙사로 돌아갔는데……"
2600902-37 = "빈 부실에서 혼자 메이드복을 입고 있으려니 어쩐지 불안해져서요……"
2600902-38 = "혹시라도 부실에 들른 다른 학생이 메이드복 차림의 제 모습을 보기라도 한다면…"
2600902-39 = "……분명 웃음거리가 되고 말 거예요……."
2600902-40 = "[s] \"모델을 하고 있었다고 솔직하게 말하면 되잖아?\""
2600902-41 = "하지만…… 제가 모델이라니……"
2600902-42 = "저는 C&C의 선배들처럼 스타일이 좋지도 않고, 자신감도 부족한데……"
2600902-43 = "이런 제가 모델이라고 해도 누가 믿어주겠어요……?"
2600902-44 = "[s3] \"유즈는 무얼 입어도 귀여우니까.\"\n[s4] \"유즈의 메이드복 차림 최고!\""
2600902-47 = "네, 네? 가, 갑자기……?!"
2600902-48 = "[s5] \"다른 사람의 시선은 신경 쓰지 마.\"\n[s6] \"유즈가 원한다면 무엇이든 될 수 있어.\""
2600902-57 = "……그렇네요."
2600902-58 = "제 모습이 게임에 등장하는 메이드 캐릭터의 레퍼런스가 될 텐데, 이런 어중간한 마음으로 흉내 내는 데 그친다면……"
2600902-59 = "게임을 기대하고 있는 팬들에게 오히려 실례를 하는 셈일지도 몰라요."
2600902-60 = "감사합니다, 선생님."
2600902-61 = "선생님께서 그렇게 말씀해 주시니 조금은 용기가 생기는 것 같아요."
2600902-62 = "하지만 역시 이 모습은 부끄러우니, 다른 학생들이 보기 전에 교복으로 갈아입어야—"
2600902-68 = "유즈 부장, 혹시 부실에 있어?"
2600902-69 = "다름이 아니라 이번 분기 부장 회의록에 확인 사인을 해야 해서—"
2600902-74 = "아, 아아……"
2600902-75 = "메이드복……? 그리고 샬레의 선생님……?"
2600902-76 = "그게, 그러니까……"
2600902-77 = "아아…… 미안, 내가 눈치 없게 방해를 한 모양이네……."
2600902-78 = "여기에는 사정이……"
2600902-80 = "……즐거운 시간 되시길."
2600902-82 = "역시 안 되겠어요……!"
2600902-84 = "(이후, 부끄러움으로 인해 캐비닛에 틀어박힌 유즈를 달래 주느라 한동안 애를 먹었다.)"
