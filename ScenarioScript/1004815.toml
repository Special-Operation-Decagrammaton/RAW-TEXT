[translation]
1004815-1 = "헛되지 않음의 증거"
1004815-2 = "(잠시 후. 사오리가 찾아왔다.)"
1004815-4 = "이렇게 갑자기 찾아와 미안하다, 선생."
1004815-5 = "하지만 어떻게든 고치고 싶은 장비가 있었어."
1004815-6 = "……바로 이거다."
1004815-11 = "[ns] \"그건…… 사오리의 마스크?\""
1004815-12 = "그래. 정화 기능이 망가졌다."
1004815-13 = "이미 생산 중지에 부품도 특수해서 수리를 받아주질 않더군."
1004815-14 = "[s] \"생각보다 연식이 있는 마스크였네?\""
1004815-15 = "처음 실전에 나갔을 때, 아리우스 분교에서 받은 보급품이다."
1004815-16 = "아무튼 부탁한다, 선생. 이 마스크를 수리할 방법을 찾아줘."
1004815-17 = "고칠 수만 있다면 선생이 원하는 건 뭐든 들어주겠다."
1004815-18 = "[s] \"뭐든지?\""
1004815-19 = "그, 그래. 뭐든지다."
1004815-20 = "[s1] \"그렇게 말하는 걸 보니 상당히 아끼는 마스크 같네.\"\n[s2] \"무슨 사연이라도 있는 거야?\""
1004815-25 = "……말했듯이 이 마스크는 작전을 위해 받은 보급품 중 하나다."
1004815-26 = "그렇게 특별한 것 없는 소모품이지."
1004815-27 = "잘 망가지지 않는 튼튼함이 장점인 소모품 말이다."
1004815-28 = "하지만 이제 망가지고 말았다."
1004815-29 = "예전이었다면, 기능을 상실한 도구 같은 건—"
1004815-30 = "……아무렇지도 않게 버렸겠지."
1004815-31 = "하지만 지금의 나에게는, 이 마스크도 하나의 소중한 동료처럼 느껴지더군."
1004815-32 = "다시 말하자면…… 파트너 같은 거다."
1004815-33 = "고장 났다 하더라도—."
1004815-34 = "난 그것을, 헛된 것으로 치부해서 갖다 버리고 싶지 않아."
1004815-35 = "그래서 어떻게든 고치고 싶다."
1004815-36 = "이제…… 그때와는 다르니까 말이야."
1004815-37 = "[s] \"그랬구나…….\""
1004815-41 = "[ns3] \"사오리의 각오는 잘 알았어.\"\n[ns4] \"함께 이 아이를 수리할 수 있는 방법을 찾아보자!\""
1004815-44 = "그래 주는 건가? 정말 고맙다."
1004815-45 = "[s] \"후후후, 고쳐주면 뭐든지 하겠다는 약속 잊지 말라고.\""
1004815-46 = "그, 그래. 약속은 약속이니까."
1004815-48 = "(그렇게 의기양양하게 밖으로 나왔지만…….)"
1004815-50 = "오, 이 마스크 정말 오랜만에 보네요. 아직도 사용 중인 사람이 있다니."
1004815-51 = "근데 이거 상태를 보니 부품을 거의 전부 새로 만들어야 하네요."
1004815-52 = "그런데 제가 예약이 많이 밀려서 언제 될 거라 장담을 못 드리는데……."
1004815-53 = "그래도 얼마나 걸릴지 예상은 가능하지 않나?"
1004815-54 = "음……. 못해도 연 단위가 될 텐데요?"
1004815-55 = "……그런가."
1004815-57 = "아이고, 어서 오십시오. 뭘 찾으시나요?"
1004815-58 = "네? 죄송하지만 그 마스크의 부품은 하나도 없는데요……."
1004815-59 = "마지막으로 본 게 언젠지 기억도 안 나요."
1004815-60 = "차라리 새것을 사시는 게 어떨까요? 성능이 더 좋은 마스크가 이쪽에 많습니다."
1004815-61 = "……미안하다. 난 이 마스크가 아니면 안 돼."
1004815-63 = "후후후, 잘 찾아오셨군요. 그 제품의 부품이라면 있습니다."
1004815-64 = "특별히 이 가격에 모셔드리죠. 어떻습니까?"
1004815-65 = "비싸긴 한데…… 정말로 있는 건가?"
1004815-66 = "지금 당장은 없죠. 하지만 어떻게든 구해 드리겠습니다. 어떻게든요."
1004815-67 = "……가지. 선생."
1004815-69 = "(이후로도 많은 상점을 돌아다녀 봤지만 모두 허탕이었다…….)"
1004815-72 = "벌써 밤이군."
1004815-73 = "역시 이 마스크를 고치는 건 쉽지 않은 것 같다."
1004815-74 = "내가 괜한 고집을 부렸던 모양이야."
1004815-75 = "……어쩔 수 없지. 정화 기능이 망가졌어도 얼굴을 가리는 용도로만 사용하면 문제없어."
1004815-76 = "내 억지에 어울려줘서 고마웠다, 선생. 오늘의 보답은 어떻게든……."
1004815-77 = "[s5] \"잠깐만……!\"\n[s6] \"이렇게 포기할 순 없어!\""
1004815-80 = "하지만 고칠 수 있는 사람이 없지 않은가?"
1004815-81 = "[s7] \"아니. 아직 한 사람이 남아있어!\"\n[s8] \"바로 사오리의 앞에!\""
1004815-84 = "……설마 선생이?"
1004815-85 = "[s9] \"나도 간단한 수리 정도는 해본 적이 있으니까.\"\n[s10] \"모르는 건 배워가면서 하면 어떻게든 될 거야.\""
1004815-88 = "지, 직접 고쳐보겠다는 생각은 나도 했었어."
1004815-89 = "하지만 그렇게 간단한 일이 아니었다."
1004815-90 = "[s11] \"나도 알아.\"\n[s12] \"그래도 이렇게 포기할 순 없잖아?\""
1004815-96 = "그렇군. 알겠다. 그럼 나도 돕지."
1004815-97 = "도움이 필요한 일이 있다면 뭐든 말해라."
1004815-98 = "[s13] \"그럼 수리가 다 될 때까지 샬레의 당번을 부탁해.\"\n[s14] \"같이 힘을 내보는 거야!\""
1004815-101 = "내가 샬레의 당번을……?"
1004815-102 = "……알겠다. 끝까지 포기하지 않겠어."
1004815-104 = "(다음 날…….)"
1004815-108 = "(사오리와 함께 마스크를 수리하기 시작했다.)"
1004815-118 = "(수리는 상상 이상으로 어려워서…….)"
1004815-126 = "(작업은 늦은 밤까지 이어졌다.)"
1004815-128 = "(모르는 것은, 필사적으로 조사해서…….)"
1004815-129 = "(망가진 부품은, 다른 제품에서 떼어와 교체했다.)"
1004815-136 = "(힘든 작업뿐이었지만—)"
1004815-137 = "(사오리의 소중한 '동료'가 건강하길 바라며.)"
1004815-142 = "(그렇게 며칠 후…….)"
1004815-144 = "으음……. 뭐지? 벌써 아침인가?"
1004815-145 = "나도 모르는 사이 깜빡 잠이 들었나 보군."
1004815-146 = "응……? 선생? 왜 그렇게 웃고 있지?"
1004815-147 = "[s15] \"후후후, 완성했어…….\"\n[s16] \"작전 성공이야!!\""
1004815-153 = "설마……! 고친 건가?!"
1004815-154 = "[s] \"응! 한번 써봐!\""
1004815-160 = "이건……."
1004815-161 = "……동작하고 있다. 고장 났던 기능이 정상적으로 돌아왔어."
1004815-162 = "정말로 고쳐진 거구나."
1004815-166 = "고생 많았다, 선생. 이번에도 큰 빚을 졌어."
1004815-167 = "[s] \"사오리가 도와주지 않았다면 불가능했을 거야.\""
1004815-171 = "[ns] \"팀의 승리, 인 거야.\""
1004815-172 = "선생과 나의 결실……."
1004815-173 = "……그렇게 말하니 이 마스크가 더 특별하게 느껴지는군."
1004815-177 = "정말 고맙다, 선생. 다시는 고장 나지 않도록 소중히 다루지."
1004815-178 = "[s] \"자, 그러면 이제 사오리가 약속을 지킬 시간이야.\""
1004815-179 = "약속? 아아……."
1004815-180 = "[s] \"그래! 고쳐주면 뭐든지 하겠다는 약속!\""
1004815-181 = "……알겠다. 선생이 원하는 건 뭐든 들어주겠다."
1004815-182 = "[s17] \"후후후……. 이 순간을 얼마나 기다려 왔던가.\"\n[s18] \"전부터 이걸 하고 싶었어……!!\""
1004815-185 = "……도대체 뭘 시키려는 속셈이지?"
1004815-186 = "뭐든지 하겠다고는 했다만, 설마 이상한 걸 시키려는 속셈이었나?"
1004815-187 = "[s] \"그래! 사오리가 아주 부끄러워하는 것을 시키겠어!\""
1004815-188 = "크윽……! 마, 마음대로 해라!"
1004815-189 = "[ns] \"내가 시키려는 건 바로……!\""
1004815-191 = "[ns] \"……언제든 편하게 샬레에 놀러 와달라는 거야.\""
1004815-192 = "역시 그런 파렴치한……!"
1004815-193 = "……응? 뭐라고?"
1004815-194 = "[s] \"언제든 편하게 샬레에 놀러 와줘.\""
1004815-198 = "[ns19] \"너무 부담가지지 말고.\"\n[ns20] \"미안하다는 말 하지 말고.\""
1004815-201 = "[ns] \"여긴 항상 사오리에게 열려 있으니까.\""
1004815-203 = "……그렇군. 생각해 보니 난 이곳에 놀러 온다는 생각은 해본 적이 없었어."
1004815-204 = "선생과 만날 때도 항상 긴장해 있었지."
1004815-205 = "선생은 그런 것도 모두 꿰뚫어 보고 있었군."
1004815-206 = "알겠다. 선생의 부탁대로 노력해 보지."
1004815-207 = "편안한 마음으로 이곳을 찾아올 수 있도록 말이야."
1004815-208 = "그런 의미에서…… 마스크의 정비는 앞으로 선생에게 부탁하고 싶은데 괜찮겠나?"
1004815-209 = "……함께 수리한, 파트너니까."
1004815-210 = "[s] \"물론이지! 부담 없이 찾아와 줘!\""
1004815-211 = "……그래. 선생에겐 참 여러 가지를 배우는군."
1004815-212 = "그럼 앞으로도 잘 부탁한다."
1004815-214 = "(이후 편안해진 표정의 사오리와 즐거운 시간을 보냈다.)"
