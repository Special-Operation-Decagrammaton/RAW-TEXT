[translation]
83306100700-7 = "앗! 이부키 들켰다~!"
83306100700-8 = "그러게~ 들켜버렸네~ 이부키 쨩~"
83306100700-9 = "역시 선도부장. 매의 눈은 사실이었나……"
83306100700-11 = "오해라고 생각하지만 말이야."
83306100700-12 = "에헤헷! 이부키를 찾아내다니! 히나 선배 굉장해!"
83306100700-13 = "으음~ 재밌었다! 오늘 다 같이 놀아줘서 고마워! 언니들! 이부키 재밌었어!"
83306100700-18 = "나도 재미있었어. 이부키 쨩~"
83306100700-19 = "뭐, 그럭저럭 나쁘지 않긴 했어."
83306100700-21 = "그럼~ 다음에도 또 놀아줘야 해~?"
83306100700-22 = "응. 그래. 나중에 기회가 되면 또."
83306100700-23 = "와아~ 응! 나중에 또!"
