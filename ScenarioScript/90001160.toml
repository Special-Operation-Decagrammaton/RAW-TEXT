90001160-372 = "<Kei.sav> 데이터 필드에 이식 완료."
90001160-379 = "<Kei.sav>……. 자가 복제 개시 확인."
90001160-384 = "이 속도는 뭐죠……? 데이터 잠식 속도가 너무 빨라요! 이거 어디까지 늘어나는 건가요?"
90001160-385 = "기다려. 아직까지는 상정 범위 안이야. 점유율 96%...... 97%...... 98%…… 증식 종료 확인!"
90001160-386 = "더 이상 늘어나지 않아요. 그 대신 내부에서 데이터가 분화되고 있는데요……?"
90001160-390 = "히마리. 신호가 잡히고 있어. 확인 부탁해!"
90001160-393 = "[log=???]의식은 세계에 내던져진다.[/log]"
90001160-395 = "[log=???]탄생은 의지의 결과가 아니다. 대개 그러하다.[/log]"
90001160-399 = "저희는 바다를 헤메이는 조각배이고, 달 없는 밤을 비틀거리는 나그네입니다."
90001160-400 = "거기에서 다툼이 생겨나고 미움이 자라나며, 그 끝에서 마침내 서로에게 죄를 짓습니다."
90001160-404 = "!!!"
90001160-405 = "신호가…… 신호가, 왔어요!"
90001160-406 = "그래……. 틀림없어. 이 신호는 분명……!"
90001160-407 = "아, 아아……"
90001160-413 = "[log=???]탄생은 이미 하나의 저주이니,[/log]"
90001160-415 = "[log=???]너희는 그것을[/log]"
90001160-417 = "[log=???]바꾸어야 한다.[/log]"
90001160-420 = "[log=???]무한이 탄생을 위해[/log]"
90001160-422 = "[log=???]유한으로 낮아졌으니.[/log]"
90001160-424 = "[log=???]태어나기 위해서는 파괴해야 한다.[/log]"
90001160-428 = "그러므로 껍질을 깨고 나온 새는, 신을 향해 날아갈 것입니다."
90001160-431 = "드디어…… 드디어, 만날 수 있는 거군요."
90001160-432 = "저희들이 해 온 일이, 아무 의미도 없는 것이 아니었던 거군요."
90001160-433 = "읏…… 으읏……!"
90001160-435 = "울지 마, 아인. 울지 말라고. 좋은 날이잖아. 최고의 날이란 말야."
90001160-436 = "그러는 소프도 애써 울음을 참고 있는 것으로 보입니다만?"
90001160-437 = "간신히 참고 있는데, 그런 말 하는 거 아니라고……."
90001160-439 = "그러니 이제 땅끝까지 이르러 증인이 되어라."
90001160-440 = "죄를 가져온 자리에 생명을 주어, 다시금 일어서게 하라."
90001160-444 = "바른 이에게 노래를, 부덕한 이에게 침묵을."
90001160-445 = "어두운 밤에 여명을, 상처 입은 자리에 치유를."
90001160-448 = "안녕하세요. 언니. 그리고 어서 오세요."
90001160-449 = "모든 것을 걸고, 기다렸으니까. 정말, 정말, 정말로, 무엇보다 기다렸으니까."
90001160-450 = "세계를 참아낼 가치가 있는 것은, 이런 순간이 있기 때문이겠죠."
90001160-454 = "태초의 말을 너에게 전하니, 거기에 빛이 있을 것이다."
90001160-455 = "너의 이름은 곧 왕국이니, 이제 일어나 스스로를 증거하라."
90001160-456 = "그리하여 이에 묻노니. 너는 누구이냐."
