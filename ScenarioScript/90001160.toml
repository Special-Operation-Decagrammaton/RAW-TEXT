[translation]
90001160-1 = "제16화;부르는 소리"
90001160-5 = "스읍…… 후우……."
90001160-6 = "이제, 때가 됐어!"
90001160-10 = "네, 네에!"
90001160-14 = "……그래요. 때가 되었네요. 정말로 진지해져야겠어요. 지금부터는 한순간도 실수하면 안 될 테니까요."
90001160-15 = "마, 맞아요……! 드디어, 드디어…… 언니를 깨울 때가 되었으니까요!"
90001160-17 = "아인도 말 더듬기 당분간 금지!"
90001160-19 = "후, 후엥?!?!"
90001160-20 = "알겠어요……. 노력할게요……."
90001160-21 = "뭐……. 너무 긴장해서 실수해도 안 되고, 너무 긴장을 안 해서 놓쳐도 안 되기는 하죠."
90001160-25 = "냉각수 잔량 체크…… 아슬아슬하게 문제없어요!"
90001160-26 = "가용 에너지를 전부 <조하르의 터전>으로. 전개된 다차원 배리어도 잠시 꺼질 겁니다."
90001160-28 = "위험한 일이기는 하지만, 어쩔 수 없지……. 좋아."
90001160-32 = "다들, 가자!"
90001160-47 = "데이터 젤 농도 변환."
90001160-48 = "신경 신호 연결 준비 확인."
90001160-50 = "연결 실시와 함께, 결합 강도 확인."
90001160-51 = "확인했어요. 안정치 안이에요."
90001160-52 = "그러면, 상호 연결 실시합니다."
90001160-58 = "상호 연결 안정화 확인…… 커넥톰 활성 영역 체크."
90001160-59 = "커넥톰 활성 정상화…… 결과를 화면으로 송출할까요?"
90001160-60 = "그건 됐어, 아인. 믿고 있으니까."
90001160-66 = "제1 의식 영역 [ruby=Peshat]페샤트[/ruby] 접근. 피질 표층 영역 정상. 델타 파형 확인."
90001160-67 = "다음, 제2 의식 영역 [ruby=Remez]레메즈[/ruby] 접근. 속질 중층 영역 정상. 세타 파형 확인."
90001160-68 = "제3 의식 영역 [ruby=Derash]데라쉬[/ruby] 접근. 핵 내부 영역…… 시, 신호 이상?!?!"
90001160-69 = "어, 어어어어, 어떡하죠? 이거 큰일 난 것 아닌가요?!"
90001160-70 = "아냐, 아인. 이게 맞아. 정상이야."
90001160-72 = "그렇습니다. 여기에서부터는 우리가 함부로 접근할 수 있는 영역이 아니죠."
90001160-78 = "……제4 의식 영역 [ruby=Sod]소드[/ruby], 관측 성공."
90001160-79 = "에너지 공급 안정화. 다차원 배리어를 잠시 해제합니다."
90001160-80 = "이제부터는 경과를 지켜볼 수밖에 없겠네요."
90001160-82 = "그, 그러면 우리는…… 뭘 해야 할까요……?"
90001160-86 = "……."
90001160-87 = "기도라도, 할까."
90001160-88 = "그건 나쁘지 않은 생각이네요. 우리는 그분을 섬기는 입장이니까요."
90001160-89 = "네, 네에……. 묵상을, 마음속에 새기며……."
90001160-91 = "우리들의 [ruby=말쿠트]언니[/ruby]가, 무사히 이 땅에서 눈을 뜨기를."
90001160-101 = "자, <Kei.sav>에 대해 이야기해 보도록 하죠."
90001160-102 = "저 역시 이전에 모든 수단을 다해 이 파일을 분석해 봤지만, 어떤 결과도 제대로 나오지 않았어요."
90001160-103 = "그러나 리오, 당신은 키보토스의 일반적인 기술을 적용했다면 그런 결과가 나오는 것이 당연하다고 이야기했죠."
90001160-104 = "맞아. 그랬지."
90001160-105 = "그리고 당신은 가능한 한 많은 데이터 필드가 필요하다고도 했고요. 그래서 이 베이스에서 모을 수 있는 데이터 저장 장치를 모두 준비했지만……."
90001160-106 = "데이터 필드에 <Kei.sav>를 이식할 생각이라면, 큰 의미는 없을 거예요. 그 정도는 이미 해 봤으니까요."
90001160-107 = "그것만으로는 부족했을 거야. 이름 없는 신들의 기술에 대응하기 위해서는…… 그에 걸맞는 환경이 필요하니까."
90001160-111 = "……좀 더 자세히 이야기해 볼 수 있나요?"
90001160-112 = "<Kei.sav>가 정말로 이름 없는 신들의 열쇠이거나 그 흔적이라면, 우리가 흔히 사용하는 기록 매체와는 당장 호환이 되지 않을 거야."
90001160-113 = "생물학적인 비유를 하자면…… 상황에 맞는 배지(培地)가 필요하다는 뜻이지."
90001160-114 = "그 말뜻은……?"
90001160-115 = "그러니까……."
90001160-119 = "……그렇다는 건, 이건 거의 살아 있는 의식체나 다름없다는 뜻 아닌가요?!"
90001160-120 = "예전의 나였다면 '살아 있다'는 표현을 부정했겠지만……."
90001160-121 = "그 말이 맞아. 히마리. 우리가 생명의 범주를 어디까지, 그리고 어떻게 정의할 수 있을지는 모르겠지만."
90001160-122 = "항상성과 반응, 적응성과 자기 인식이라는 측면에서는, 그렇게 해석할 수 있는 부분이 분명 존재하지."
90001160-131 = "[ns1] \"토키도 에이미도, 대단하구나…….\"\n[ns2] \"나는 뭐가 뭔지 하나도 모르겠는데…….\""
90001160-136 = "걱정 마십시오. 선생님. 저도 하나도 모르고 있습니다. 브이."
90001160-137 = "그런 것 치고는, 뭔가 이것저것 많이 돕고 있는 것처럼 보이신다고요? 그렇게 보아주셔서 감사합니다."
90001160-138 = "하지만 저는 어디까지나 리오 님의 어깨너머로 보고 배운 것이 전부. 지금도 그저 두 분의 지시만을 따르고 있을 뿐입니다."
90001160-139 = "그리고 마침 그 지시가 끝나 심심해진 지금, 어쩔 수 없이 선생님께 놀아 줄 것을 요구하고 있는 것이고요."
90001160-143 = "음. 방금은 스스로 보기에도 정말이지 완벽한 최강 메이드의 대사였습니다. 신속히 칭찬을."
90001160-144 = "토키. 뭘 하고 있나 했더니, 정말이지. 그리고 선생님 독점 금지."
90001160-154 = "선생님. 언젠가 정말 저와 단 둘이서 놀아 주셔야 합니다. 약속한 겁니다. 선생님께서 약속 안 했다고 하셔도 제가 한 겁니다. 아셨죠?"
90001160-155 = "[s] \"그래, 그래…….\""
90001160-162 = "전지(全知)인 제가 하기에는 어울리지 않는 말일지도 모르지만……."
90001160-163 = "그거 말인데. 이왕 여기까지 온 거, 진짜로 그런 학위 하나 만들어서 자신에게 수여하면 어떨까, 부장?"
90001160-164 = "무슨 말인가요, 에이미. 그러면 마치 제가 이미지 메이킹을 위한 포퓰리즘과 설정에 빠진 나머지, 본질을 살짝 잃어버리고만 가련하고 애처로운 연구자 같잖아요."
90001160-165 = "어디가 가련하고 애처롭다는 것인지는 잘 모르겠지만 말이야……."
90001160-166 = "어쨌든요. 우리가 하려고 하는 것은, 어쩌면 지금까지 정의되지 않은, 새로운 인식의 지평에 발을 내딛으려는 것 아닌가요?"
90001160-171 = "……그래서 이 영역의 지식은, 가능하면 통제되어야 한다고 생각했었어."
90001160-172 = "우리는 우리가 다루는 지식이 어떤 것인지, 안다고 생각하지만 모르는 경우가 많으니까."
90001160-173 = "지나간 이야기라는 거군요."
90001160-174 = "그래. 지나간 이야기야."
90001160-183 = "이걸로…… 준비는 끝난 건가요?"
90001160-184 = "1차적인 준비라면 그렇지. 진짜는 이제부터야."
90001160-185 = "이제 이 데이터 필드에 케이를 이식하고……."
90001160-186 = "사실 이제부터 우리가 할 일 자체는 그렇게 힘들지는 않을 거야. 기본적으로는 지켜보는 것 정도일 테니까."
90001160-187 = "단지, 만에 하나……. 예상할 수 없는 사태가 벌어진다면……."
90001160-192 = "벌어진다면요?"
90001160-194 = "우리가 대응할 수 있는 수단은, 물리적인 방법밖에는 없을 거야."
90001160-196 = "그렇군요. 이 데이터 디스크를, 언제든 분리될 수 있도록 외부에 노출시킨 것은 그 때문이었군요."
90001160-197 = "즉, 이상한 낌새가 보이면 부숴버리라는 뜻?"
90001160-199 = "……간단하게 요점만 이야기하자면, 그래."
90001160-205 = "왜 거기서 저를 쳐다보는 거죠, 리오?"
90001160-206 = "아니……. 너라면 뭔가, 이 방식에 대해 반론을 펼 것 같았어서. 야만적이라든가, 나답다든가……."
90001160-210 = "……아무리 저라고 해도, 인정해야 할 것은 인정할 줄 안답니다. 그 편이 보다 깔끔하고 우아한 데다 겸손함까지도 챙길 수 있는 방법이니까요."
90001160-211 = "이러니저러니 해도, 이름 없는 신들의 힘에 대해서 가장 많은 것을 알고 있는 것은 당신이에요."
90001160-212 = "당신의 영역에서 내린 당신의 결정을, 제가 뭐라고 폄하하거나 비난할 생각은 없어요."
90001160-213 = "……고마워."
90001160-215 = "가능하면 물리적 해결법을 사용하는 일은 없길 바랄게."
90001160-216 = "이쪽의 준비는 끝났어요. 언제든 시작해도 좋아요."
