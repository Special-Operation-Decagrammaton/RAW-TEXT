[translation]
10036130-1 = "스쿼드가 게임을 즐기는 법 (1)"
10036130-3 = "어서 오세요!"
10036130-4 = "<전탄 발사! ~몰려오는 귀여운 표적들을 막아서 경품을 차지하자!~>에 오신 걸 환영합니다!"
10036130-5 = "어떤 게임이야?"
10036130-6 = "간단합니다!"
10036130-7 = "제가 내보내는 표적들이 경품에 접근하는 것을 막으면 된답니다!"
10036130-9 = "사, 사오리 언니, 옆에 점수판 좀 보세요……!"
10036130-10 = "지금 보니, 패션 잡지 <BiBi> 최신호가 경품 목록에 있는데요?!"
10036130-11 = "그렇습니다! 그 외에도 식당 상품권, 즉석 사진 촬영권 등 많이 있지요!"
10036130-12 = "하지만 오늘 하루 종일 경품을 타 간 사람은 아무도 없다는 것, 알려드립니다!"
10036130-13 = "그, 그런……!"
10036130-15 = "……보는 것과는 달리, 의외로 쉽지 않은 게임인가?"
10036130-16 = "아니, 확실히……."
10036130-17 = "애당초 이 세상엔 쉽고 간편하기만 한 일 따위, 없는 법이니까."
10036130-18 = "하지만 그렇다 해도 우습게 보였군."
10036130-19 = "이쪽도 나름대로 그간 힘들고 고된 시련을…… 고철 수집이나 분실물 수거 따위의 시련을 수도 없이 넘어왔다."
10036130-20 = "그리고 거기에 더해……."
10036130-21 = "이번엔 모두와 함께 있으니, 더더욱 두렵지 않다!"
10036130-22 = "응!"
10036130-23 = "마, 맞아요! 춥고 배고픈 상황에서 끊임없이 행군을 하는 일에 비하면 이런 고난 정도는……!"
10036130-28 = "……아니, 그냥 게임일 뿐이잖아."
10036130-29 = "그럼, 초급 단계부터 시작하겠습니다!"
10036130-30 = "가자, 아츠코, 히요리, 미사키!"
10036130-32 = "네, 네에!"
10036130-33 = "내키진 않지만, 손이 부족하다면야……."
10036130-34 = "(후후, 사오리, 즐거워 보이는걸…….)"
