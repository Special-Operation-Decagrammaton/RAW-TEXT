[translation]
80000064-1 = "발렌타인 술래잡기"
80000064-2 = "(아스나의 연락을 받고 C&C 부실로 쓴다는 강의실을 찾아갔다.)"
80000064-9 = "(불은 켜져 있었지만, 어째서인지 안에는 아무도 보이지 않았다.)"
80000064-10 = "[s1] \"……아스나?\"\n[s2] \"……아무도 없나?\""
80000064-11 = "야호-! 도착했구나, 주인님!!"
80000064-12 = "야호-! 도착했구나, 주인님!!"
80000064-13 = "쨔쟌-! 아스나 등장-!!"
80000064-14 = "[s3] \"깜짝이야!\"\n[s4] \"아, 아스나!?\""
80000064-15 = "아하하하하!! 놀랐어, 주인님!? 서프라이즈 성공이네!"
80000064-16 = "아하하하하!! 놀랐어, 주인님!? 서프라이즈 성공이네!"
80000064-17 = "응? 나? 계속 여기 있었는데? 주인님을 놀래키려고 숨어 있었지!"
80000064-18 = "주인님도 오늘이 무슨 날인지는 알고 있잖아? 음? 아닌가? 설마 모르는 거야? 진짜?"
80000064-19 = "[s5] \"발렌타인 데이.\"\n[s6] \"모르지는 않지.\""
80000064-20 = "그치, 그치? 역시 그렇지? 그럼 알고 왔으니까, 내가 뭘 줄지도 알고 있겠네?"
80000064-21 = "그치, 그치? 역시 그렇지? 그럼 알고 왔으니까, 내가 뭘 줄지도 알고 있겠네?"
80000064-22 = "좋아~! 그럼 곧바로~!"
80000064-30 = "[ns7] \"아, 아스나 씨……!?\"\n[ns8] \"자, 잠깐! 뭘 하는 거야……!?\""
80000064-31 = "……응? 주인님? 알고 있다 하지 않았어? 초콜릿을 꺼내고 있는 거잖아?"
80000064-32 = "……응? 주인님? 알고 있다 하지 않았어? 초콜릿을 꺼내고 있는 거잖아?"
80000064-33 = "잠깐만, 사이에 좀 껴서……. 으응……. 자! 다 꺼냈다. 여기 있습니다! 아스나의 발렌타인 초콜릿!"
80000064-34 = "음……. 그런데 이왕 이렇게 된 거, 아스나가 직접 주인님께 먹여주는 게 좋겠지?"
80000064-35 = "자, 아~하세요. 주인님! 아~!"
80000064-36 = "……응?"
80000064-37 = "주인님? 뭐야? 왜 입을 꾹 다물고 있어?"
80000064-38 = "으응~? 아하하하! 뭐야, 그 표정? 왜 그렇게 당황한 얼굴을 하고 있어?"
80000064-39 = "하지만 안 돼! 오늘은 발렌타인 데이니까, 주인님은 아스나가 준 발렌타인 초콜릿을 먹어야만 한다고."
80000064-40 = "……응? 주인님? 주인님??"
80000064-41 = "[s] 도망친다."
80000064-44 = "……!? 갑자기 술래잡기야!?"
80000064-45 = "아하하하하! 재밌네! 좋아! 그럼 아스나가 술래야! 잡히면 이거 꼭 먹어야 해, 주인님!!"
80000064-46 = "간다-!!"
80000064-58 = "(……결국 붙잡혀서 강제로 먹고 말았다.)"
