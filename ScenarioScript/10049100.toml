[translation]
10049100-1 = "제10화;힘껏 노력해! 섬광소녀 스즈미"
10049100-3 = "비, 비켜요! 비켜!!!"
10049100-8 = "아야! 밀치지 마요!"
10049100-9 = "뭐야 이 사람? 마법소녀들한테 쫓기는 거야?"
10049100-11 = "[ns] \"마시로! 지원 가능하니?\""
10049100-12 = "상황 보고는 완료되었습니다!"
10049100-13 = "목표를 제압해도 될지, 정의실현부에서 상의 중입니다."
10049100-14 = "계속 추적은 하고 있습니다!"
10049100-15 = "으윽, 정말 끈질기시네요!!"
10049100-16 = "건강에 좋은 육각수 첨가 섬광탄이라도 맞고 푹 쉬시죠!!"
10049100-21 = "섬광탄?!"
10049100-22 = "(안 됩니다, 선생님 쪽으로?!!)"
10049100-23 = "[ns] \"어, 어어?!\""
10049100-27 = "[ns] \"스즈미? 괜찮아?\""
10049100-28 = "선생님은 괜찮으신가요?"
10049100-29 = "그렇다면 다행입니다."
10049100-30 = "[s] \"스즈미가 지켜줘서 멀쩡해!\""
10049100-31 = "제가…… 지켜드려서……."
10049100-35 = "누군가를 지킬 힘이, 아직 저에게…… 있었습니다."
10049100-36 = "어이, 화이트 뭐시기!! 그리고 선생!! 그러다 쟤네 다 도망간다!"
10049100-37 = "그리고…… 충분히 사이 좋아 보이니까, 이제 좀 떨어지는 게 어때?"
10049100-38 = "!!"
10049100-43 = "선생님, 먼저 일어나겠습니다!"
10049100-53 = "부장!! 이쪽이 게헨나 구역이야!!"
10049100-60 = "으윽!!"
10049100-62 = "생각보다 적이 많습니다, 빨리 제압하지 않으면 부수적 피해가 생길 텐데……!"
10049100-67 = "화이트! 총알이 다 떨어졌습니다!"
10049100-68 = "저는 이게 마지막 탄창입니다!"
10049100-69 = "젠장, 나도 다 떨어졌어. 이럴 줄 알았으면 더 챙겨올걸……."
10049100-70 = "여기저기서 공격이 이어지고 있군요…… 하지만!"
10049100-76 = "……이렇게 간단하게 피했습니다! 저, 아즈마 미라이의 민첩함을 보세요!"
10049100-78 = "아앗!! 그건 자경단만 쓸 수 있는 대사입니다!! 뺏지 마세요!!"
10049100-79 = "인파 발견! 숨어들면 못 쫓아오겠죠!"
10049100-85 = "아야! 조심해요!"
10049100-86 = "쉬, 쉬잇-! 지나가는 것뿐이니까, 조용히 해주세요!"
10049100-87 = "이 사람도 공연 배우인가?"
10049100-89 = "인파에 가려져서 놓쳤습니다!"
10049100-90 = "아마 몸을 낮추고 다니는 모양이군요, 전혀 보이질 않습니다."
10049100-91 = "이 너머는 게헨나 구역, 무력을 쓰기 곤란해집니다."
10049100-95 = "……응? 시미코 씨는 지금 어디에……."
10049100-99 = "드디어 나를 도우러 왔구나, 나의 권속이여!"
10049100-107 = "나의 충실한 종, 악마의 상인 '실버플레이트'여!"
10049100-108 = "사람들 사이에 숨어 암약하다니, 놀라운 계략이구나!"
10049100-109 = "이것으로 승패는 결정되었다, 헤비캘리버즈!"
10049100-110 = "나, 악의 간부 에라와 실버플레이트가 악의 기사단을 구성한 이상, 너희에게 승산은 없다!"
10049100-111 = "우리를 무찌르기 위해서는, 수많은 사람들의 힘을 빌리지 않으면 불가능할 터……."
10049100-112 = "오홋홋홋!! 우리 악의 기사단의 승리다, 헤비캘리버즈!!"
10049100-113 = "엥……?"
10049100-114 = "실버플레이트…… 요? 제가…… 요……?"
10049100-118 = "아아, 흠흠."
10049100-119 = "잠시 공연 안내 말씀드릴게요~!"
10049100-121 = "시미코 씨? 뭘 하시려고……."
10049100-122 = "평소의 상냥한 시미코 씨로 돌아오셨습니다!"
10049100-124 = "지금, 악마의 상인 '실버플레이트'가 여러분 주위에 숨어있답니다!"
10049100-125 = "헤비캘리버즈는 지금 실버플레이트를 놓친 것 같아요!"
10049100-126 = "그래서-!"
10049100-127 = "여러분의 힘을 빌리고자 합니다!"
10049100-128 = "실버플레이트는 은발에 하얀 옷을 입고 있답니다!"
10049100-129 = "실버플레이트를 찾으시면, 가지고 계신 응원봉이나 휴대전화의 플래시로 알려주세요!"
10049100-130 = "여러분의 응원으로, 헤비캘리버즈를 실버플레이트에게 유도해 보아요!"
10049100-131 = "에, 에엑……?!"
10049100-132 = "우와! 여기 바로 있다! 악당 실버플레이트!"
10049100-133 = "쉬, 쉬잇!! 조용히 하세요!!"
10049100-134 = "아하핫!!! 팝콘 통의 복수다!!"
10049100-136 = "자, 힘을 모아주세요!"
10049100-143 = "여기 있다!!"
10049100-144 = "재밌네! 지나간 자리마다 밝아지고 있어!"
10049100-145 = "이러면, 위치를 알 수 있군요……!"
10049100-146 = "저 녀석, 진짜 머리 잘 쓰는데?!"
10049100-147 = "꼭 마법 같네요! 모두의 힘을 모아서 만든 기적!"
10049100-148 = "아앗……! 저도 모르게 넋 놓고……! 군중을 벗어나기 전에 빨리 잡아야 합니다!"
10049100-152 = "그럼, 나는 이쪽으로 갈게!"
10049100-153 = "그렇다면 이쪽은 제가 맡겠습니다!"
10049100-158 = "헥-헥-! 대체 뭔가요 이게-?!"
10049100-159 = "완벽한 계획이었는데!! 말 한마디로 수백 명의 힘을 빌리다니!! 헥-헥!!"
10049100-163 = "됐다!! 광장!"
10049100-164 = "이상한 사람들, 결국 놓쳤나 보네요! 이제 저 경계선만 넘으면!!!"
10049100-172 = "꺄악?!!"
10049100-173 = "이제 소용없습니다!"
10049100-174 = "순순히 항복하세요!"
10049100-175 = "저리 비켜!"
10049100-179 = "윽!!"
10049100-180 = "대체 왜 이렇게까지 방해하시는 거죠?!"
10049100-181 = "불량품을 팔면서 시민들의 나들이를 망치고, 어린이들을 속이고."
10049100-182 = "남의 물건에 거짓말을 더해서 피해를 주고 있지 않습니까."
10049100-183 = "원칙적으로 그런 폭발물을 놀이공원에서 판매하는 것도 안 됩니다."
10049100-188 = "꺄아악!!"
10049100-193 = "!!"
10049100-194 = "그냥 폭발물이 아니라 게르마늄 수류탄입니다! 혈액순환에 좋다구요!"
10049100-195 = "앗, 혹시…… 상품에 불만이 있으신 건가요?"
10049100-196 = "원래는 안되지만요…… 이미 충분히 설명을 듣고 구입하셨을 테니…… 그렇지만 알겠습니다, 네! 이번만 특별히 환불해 드릴게요! 비밀!"
10049100-197 = "저는 당신의 물건을 구매한 적이 없습니다."
10049100-198 = "그러면 왜?! 왜 귀찮게 구시는 건가요? 누가 시키기라도 했나요?!"
10049100-199 = "아닙니다. 그저 그것이, 정의로운 일이기 때문입니다."
10049100-200 = "뭔 소리예요! 그래봤자 아무 보상도 없잖아요!"
10049100-201 = "자세히 보니 트리니티 쪽 학생이신 것 같은데요, 상황 파악이 안 되나요?"
10049100-202 = "여기는 이제 게헨나 쪽 구역입니다! 남의 자치구에서 말썽을 일으킬 건가요?"
10049100-203 = "그리고 총알도 다 떨어졌잖아요? 다 티 났다구요!"
10049100-205 = "……."
10049100-209 = "스즈미 씨!!"
10049100-210 = "마시로 씨, 탄약이 없는데 지원 가능한가요?"
10049100-212 = "어렵습니다. 목표가 게헨나 구역에 있습니다."
10049100-213 = "정의실현부에서 정한 교전수칙에 어긋납니다."
10049100-214 = "그런……!"
10049100-215 = "정의실현부면 괜히 남의 선량한 비즈니스를 방해하지 말고, 물러나시죠!"
10049100-216 = "……."
10049100-217 = "저는, 정의실현부가 아닙니다."
10049100-218 = "뭐야, 진짜 정의실현부도 아니었나요?"
10049100-219 = "휴, 괜히 무서워했네요. 훠이훠이, 비키세요~"
10049100-220 = "세 가지, 마지막으로 말씀드리겠습니다."
10049100-224 = "첫째. 선생님 쪽으로 섬광탄을 던지지 마십시오. 위험하잖습니까."
10049100-228 = "둘째. 말하신 대로 저는 정의실현부가 아닙니다. 정의실현부가 되지 못한 것도 맞죠."
10049100-232 = "그리고 셋째."
10049100-234 = "정의실현부가 되지 못해서 괜히 이러는 거 아니야?"
10049100-236 = "저는 사람들 사이에 섞이지도 못하고, 이러지도, 저러지도 못해 도망쳐 온, 정의실현부의 자격이 없는 사람입니다."
10049100-238 = "무슨 말을 하시는지 도통 모르겠거든요?!"
10049100-239 = "그럼 쉽게 말씀드리겠습니다."
10049100-240 = "지금 당신 앞에 있는 사람은,"
10049100-242 = "너 말야, 우리하고 다를 거 없지 않아?"
10049100-244 = "……."
10049100-249 = "……깡패나 다름없는 사람입니다."
10049100-250 = "네?!!"
10049100-254 = "아야!!"
10049100-260 = "이게 무슨……."
10049100-261 = "그래도 이번 일로 한 가지 알게 된 게 있습니다."
10049100-264 = "누군가를 지킬 수 있는 힘이 있고, 작은 노력이나마 누군가를 지킬 수 있다면……."
10049100-267 = "그것으로 충분한 것이 아닌가, 라는 것입니다."
10049100-271 = "정의는, 그 자체로 보상이니까요."
10049100-272 = "아, 이거 섬광-"
10049100-279 = "흐에게에엑-"
10049100-280 = "누, 눈이 안 보여요!!"
10049100-281 = "으아아-!"
10049100-283 = "헥헥, 뭐, 뭐야. 어떻게 된 건데?!"
10049100-288 = "오, 경계선 넘어왔습니다!"
10049100-289 = "트리니티 자치구에 오신 걸 환영합니다!"
10049100-291 = "에?! 에엑?!"
10049100-292 = "사수. 표적 트리니티 자치구 진입 확인. 발포 허가 내려졌습니다. 신호를."
10049100-293 = "스즈미 씨, 필살기의 대사 기억하시지요!"
10049100-294 = "물론입니다."
10049100-296 = "자, 잠깐! 잠깐만요!!!"
10049100-298 = "모두의 평화를 위해!! 그 누구도 알아주지 않아도, 언제나 항상!"
10049100-299 = "우리들은…… 오늘도 지켜내겠어!"
10049100-304 = "매지컬-테라마키나!!"
10049100-313 = "저격은 반칙이잖아아아아아아아-!!"
10049100-322 = "불꽃놀이 시작했나 봐."
10049100-323 = "예쁘네……."
10049100-324 = "진짜 대단한 공연이었어. 살면서 이런 놀이공원은 처음이다야."
10049100-326 = "오늘 진짜 재밌었어!!"
10049100-327 = "집에 가면서 헤비캘리버 놀이하자!"
10049100-328 = "좋아! 하자, 하자!"
10049100-329 = "정의는 승리합니다!"
10049100-330 = "다들 수고 많으셨어요!"
10049100-334 = "레이사 씨, 시미코 씨, 마시로 씨, 라브 씨 일행분들……."
10049100-335 = "그리고 선생님."
10049100-336 = "[ns] \"스즈미!\""
10049100-340 = "자경단, 오늘의 순찰 완료했습니다……!"
10049100-353 = "야!!! 내 현상금이 날아가 버렸잖아!!!!!!!"
10049100-354 = "마법소녀 헤비캘리버 ~에라의 야망과 정의의 자격~"
