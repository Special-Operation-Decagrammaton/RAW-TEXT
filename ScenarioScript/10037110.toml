[translation]
10037110-1 = "에필로그;이에 헤어짐이 있어 벗을 그리워하노라."
10037110-2 = "어느새 시간이 이렇게 빨리 흘러갔구나……. 벌써 교류회가 마지막이라니."
10037110-3 = "우후후. 이번 교류회가 상당히 마음에 드셨던 것 같네요. 체리노 서기장님."
10037110-5 = "남는 것이 있었다면 다행이구나. 우리들의 산해경은…… 어떠하였는가?"
10037110-9 = "음, 산해경은……."
10037110-14 = "대모험이었다!"
10037110-15 = "신기한 풍경, 처음 먹어 보지만 맛있는 음식, 게으른 판다, 그리고 경극까지…… 무엇 하나 버릴 것이 없었어! 대단해!"
10037110-17 = "경극부의 일로 고초를 겪게 한 것 같아 면목이 없구나."
10037110-18 = "그것참, 키사키 문주는 몇 번이나 같은 말을 반복하게 하는 사람이군."
10037110-19 = "겸손이나 사과도 지나치면 역효과를 불러일으키는 법이야. 다시 말하지만!"
10037110-20 = "나, 붉은겨울의 서기장은 그런 하찮은 것에 연연하지 않는 몸인 것이야!"
10037110-21 = "……그러한가."
10037110-23 = "그렇습니다. 문주님. 체리노 회장님께서는 관대하시니까요!"
10037110-24 = "어차피 카구야와 경극부원들도, 화장실 청소 2~3주 정도 하고 돌아올 수 있을 테니, 그것으로 된 것 아니겠습니까?"
10037110-30 = "(……새삼 느끼는 것이다만, 산해경의 법도와 붉은겨울의 학칙 사이에는…… 참으로, 크나큰 차이가 있는 것 같구나.)"
10037110-31 = "키사키 문주님께서 사람을 자연스럽게 감화시키는 방법이 참으로 인상적이었지요."
10037110-32 = "저의 프로파간다…… 실례. 사람을 설득하는 방법에도, 많은 참고가 될 것 같습니다."
10037110-33 = "으, 으음. 그러한가? 그것은 전혀 예상하지 못했던 이야기로구나……."
10037110-35 = "그런데, 뭔가 표정이 어둡구나. 키사키 문주. 무슨 일이라도 있는가?"
10037110-36 = "그렇게 보였는가? 정작 나는 아무렇지도 않다만?"
10037110-37 = "그래……?"
10037110-38 = "그보다…… 이 자리를 기념하여, 작은 선물을 준비했다. 받아 주었으면 하는구나."
10037110-44 = "이것은…… 판다?"
10037110-45 = "백옥과 흑옥, 녹옥으로 만든 판다 모형이지. 약소한 것이지만, 산해경을 기억해 주었으면 해서 말이다."
10037110-46 = "어, 엄청나군요, 문주님! 판다의 검고 흰 모양이 이렇게 완벽하게 구현되어 있고, 그 둥실둥실한 몸집이라든가 게을러 보이는 눈빛이라든가……!"
10037110-47 = "지금이라도 살아나서 움직일 것 같은 모습입니다!"
10037110-48 = "후후. 마리나 위원장이 특히 마음에 든 모양이구나."
10037110-50 = "감사를 표하도록 하지! 이 몸의 집무실에 고이 보관해 두겠다! 다음에 언젠가 기회가 된다면, 꼭 문주를 우리 붉은겨울에 초대하고 싶군!"
10037110-51 = "그리 해 준다면야, 사양할 이유가 없지. 기대하고 있겠노라. 체리노 서기장."
10037110-60 = "후우……. 간신히, 돌아올 수 있게 되었구나."
10037110-61 = "송별에 관한 것은 향주(香主)…… 홍보부장에게 맡겨 두었으니, 잘 대응해 주겠지."
10037110-65 = "……."
10037110-66 = "걱정이 되는구나."
10037110-74 = "이번 경극부 일로, 산해경에 또 다른 의미의 '변화'가 시작되는 것은 아닐지……."
10037110-75 = "카구야만이 원인이라고 볼 수는 없다. 어떤 의미로 모든 것을 시작한 것은 나 자신이니."
10037110-78 = "그 이전에…… 그렇지. 산해경 안에서 어떤 일이 일어나든."
10037110-79 = "꽃이 지고 홍수가 나고 벼락이 떨어져도 내 책임이다. 그것이 문주다."
10037110-80 = "모든 책임을 지고 그 어떤 변명도 필요 없는 자리. 그게 바로 산해경의 문주란 자리이니."
10037110-85 = "그러나 지금은……."
10037110-87 = "조금이지만, 눈을 붙여야겠구나."
10037110-95 = "……잘 있었나, 카구야 부장."
10037110-96 = "걱정해 준 덕분에, 이보다 편할 수 없었지. 미나 집행부장."
10037110-97 = "아니, 빈말로라도 그렇게는 보이지 않는데……."
10037110-98 = "사람이 뻔히 드러나 보이는 거짓말을 할 때에는, 구태여 지적하지 않는 것이 예의인 법이다……."
10037110-102 = "아무래도 좋아. 단도직입적으로 묻겠다. 왜 이런 일을 꾸몄지?"
10037110-103 = "……."
10037110-104 = "다만, 충의(忠義)를 위해 행하였다. 그것이 전부다."
10037110-105 = "붉은겨울의 방문단과 현룡문이 모인 자리에서 그런 경극을 공연한 것도 모자라, 문주님을 감히 해하려 한 것이 충의(忠義)와 무슨 관련이 있다는 거냐!"
10037110-106 = "생각 같아서는 지금 당장 퇴학 처분을 내려도 성에 차지 않을 지경인데!"
10037110-107 = "여전히 아둔한 충신이구나. 미나 집행부장."
10037110-108 = "문주께서 잘못된 판단을 내릴 때에는, 모든 것을 걸고서라도 반대하는 것이 충의(忠義)의 자세일 텐데!"
10037110-109 = "……문주님의 잘못된 판단이라는 게, 붉은겨울의 방문단을 초청한 걸 의미하는 것인가?"
10037110-110 = "정작 거기에서 문제를 일으킨 것은 경극부였지 않나."
10037110-111 = "문주님의 행동이, 천하의 도리에 합당하지 않는데도 충성하는 것은, 결코 올바른 충성이 될 수 없다."
10037110-112 = "문주님께서는 분명 영민하고 현명하시지만…… 자의적으로 일을 해결하는 경향이 있으시니까 말이지."
10037110-114 = "뭐라고?!"
10037110-115 = "그대도 알고 있지 않은가. 신타니 카이의 퇴학 건 말이다."
10037110-120 = "무슨 말을 하고 싶은 거지……?"
10037110-126 = "먼 길에 고생 많았다. 연단방과 산해경의 사정은…… 아니, 지금의 너에게는 물어보았자 무의미한가."
10037110-127 = "……연단방 내부의 수사망이 계속해서 좁혀져 오고 있습니다."
10037110-128 = "저는 어쩔 수 없이 연단방에서 잠적해야 했고요."
10037110-129 = "이 시기에 잠적해 버리면, 네가 범인인 것으로 확정이 될 텐데?"
10037110-130 = "어쩔 수 없는 일이었습니다. 어차피 지금의 연단방에서 기대할 것은 없기도 했고요."
10037110-131 = "쿡쿡쿡쿡……. 카구야도 그렇고 너도 그렇고, 참으로 올곧고 우직한 사람들만 만나게 되는군."
10037110-132 = "이야기가 나왔으니 여쭙는 것입니다만, 그날 밤, 경극부장과의 대화에서 무슨 말씀을 나누셨습니까?"
10037110-133 = "뭐, 그렇게 대단한 이야기는 없었다."
10037110-135 = "그저, 카구야가 나를 연단방으로 복권시켜 주겠다는 말을 꺼낸 것 정도였지."
10037110-139 = "네……?!"
10037110-142 = "그게, 무슨 소리지? 신타니 카이를 연단방으로 복권시켜야 한다고?"
10037110-143 = "도대체 무슨 말 같지도 않은 소리를 하는 거냐!"
10037110-145 = "아니, 그것이야말로 순리이고 정도다!"
10037110-146 = "애초에 문주님께서 카이를 퇴학시킨 과정이, 지나치게 급진적이었고 정상적이지 않았다는 것은 그대 역시 인정하는 바가 아닌가!"
10037110-150 = "……!"
10037110-151 = "적절한 절차를 따르지 않고 즉결 추방한 것도 모자라, 그 기록을 완전히 말소시켜, 카이에 대해 아는 사람이 극히 드물게 되기도 했지!"
10037110-152 = "아무리 그래도 모방 범죄는 막아야 하잖아!"
10037110-153 = "거기에, 그 퇴학 절차를 하나하나 따랐다가는, 신타니 카이의 퇴학은 1년도 더 걸렸을 거고!"
10037110-154 = "그 시간 동안 얼마나 많은 피해자가 생겼을지 생각해 보란 말이다!"
10037110-155 = "설령 그러하더라도 모든 일은 절차를 따라 이루어져야 했다!"
10037110-156 = "제아무리 문주님이라고 하셔도 산해경의 학칙을 자의에 따라 어겨서는 안 돼!"
10037110-157 = "학칙의 권위가 흔들리면 문주님 그 본인이 산해경을 다스릴 명분을 잃게 되지 않는가!"
10037110-160 = "대단하지는 않았지만, 재미있는 이야기이기는 했지."
10037110-161 = "나를 연단방으로 복권시킨 뒤, 적법한 절차를 거쳐 재퇴학시킨 다음"
10037110-162 = "모두에게 그 기록과 사실을 널리 알려 본보기로 삼자는 말까지 했으니 말이다."
10037110-163 = "……경극부장답다면 다운 이야기이긴 했군요."
10037110-164 = "그 제안을…… 받아들일 생각이셨습니까?"
10037110-165 = "우선, 나를 연단방으로 복권시켜 주겠다는 이야기에는 상당히 흥미를 느꼈다."
10037110-166 = "그래서 카구야에게 새로운 경극의 아이디어를 준 것이지."
10037110-170 = "그런 이유로 카이를 복권시키고, 재퇴학 시키자고……?"
10037110-174 = "바보냐! 그런 게 가능하기는 할 것 같아?! 거기에 카이가 그 제안을 받아들이기나 할지 생각해 보란 말이다!"
10037110-175 = "카이 역시 산해경의 학생이니 받아들이지 않을 이유가 없다! 그래야 해!"
10037110-176 = "너무 자기 편할 대로만 생각하고 있잖아!"
10037110-178 = "만에 하나 카이가 받아들이지 않는다면, 받아들이게 만들어야 한다!"
10037110-179 = "현룡문 문주의 권력과 힘은 무엇을 위해 존재하는가!"
10037110-180 = "무엇 때문에 현룡문 문주의 권한이, 다른 학원의 학생회장들보다도 유난히 강하게 주어져 있는가!"
10037110-181 = "모든 것은 산해경을 법도에 맞게 다스리도록 위함이 아닌가!"
10037110-187 = "(……나도 주위로부터 꽉 막혔다는 소리를 듣고는 하지만…….)"
10037110-188 = "(이 녀석은 차원이 다른 수준이군…….)"
10037110-192 = "연단방으로 복귀한 다음에는? 그야 카구야의 의견은 전부 무시했겠지."
10037110-193 = "복권 후, 적법한 절차를 거쳐 재퇴학이라? 그런 결정을 내가 할 것 같은가?"
10037110-194 = "그렇지만 그것은…… 일종의 배신이 아닙니까……?"
10037110-195 = "그런 것이 이제 와서 나에게 의미가 있을까?"
10037110-196 = "……."
10037110-197 = "긴 시간이었지. 교정국에 신세를 지는 수모를 겪기도 했고."
10037110-198 = "그럼에도 시기를 기다렸고, 세력을 모았다. 이제 때가 되었다."
10037110-199 = "나는 나의 것을 되찾을 것이며, 누구도 그것을 방해하게 두지 않을 것이다."
10037110-204 = "가서 전해라."
10037110-207 = "내가 돌아왔다."
10037110-208 = "월화몽소"
