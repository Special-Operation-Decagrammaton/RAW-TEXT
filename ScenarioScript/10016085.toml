[translation]
10016085-2 = "이번 기마전 이후에 남은 큰 경기는 학원 대항 계주 정도뿐이지?"
10016085-3 = "응. 종합 우승에 영향을 끼칠 수 있는 고득점 경기는 거의 끝났으니까."
10016085-4 = "만년 꼴찌 후보였던 밀레니엄이 종합 우승을 노릴 수 있게 되다니…… 이번 황륜대제는 정말 여러모로 이변이 많네."
10016085-5 = "들리는 소문에 의하면 샬레의 선생님이 운동 신경이 없는 학생들도 경기를 즐길 수 있도록 프로그램을 조정해 주었다던데…… 그 덕분이려나?"
10016085-6 = "뭐, 기마전의 유력 우승 후보였던 게헨나와 트리니티가 예선부터 맞붙어 싸우느라 힘을 다 소진한 덕도 있지만."
10016085-7 = "여하튼 백귀야행 연합학원 정도는 우리 실력으로도 이길 수 있겠지……!"
10016085-8 = "좋아. 이번 경기에서도 우승을 따내 밀레니엄의 종합 우승을 확정 지어 버리는 거야—"
10016085-9 = "……응? 저게 뭐지?"
10016085-19 = "사사삿! 이것으로 완벽하게 준비되었군요!"
10016085-20 = "하스미 공의 도움을 받아 완성한 인법…… 축성의 술을!"
10016085-21 = "이, 이걸로 정말 괜찮을까요오……?"
10016085-22 = "뭔가 불안정해서 조금만 밀기만 해도 무너져 내릴 것 같은데……"
10016085-23 = "흔들~ 흔들~"
10016085-24 = "괜찮습니다. 양익을 담당하고 있는 선수들의 역할은 기수를 고정하는 것이 아니니까요."
10016085-25 = "카에데 씨, 이즈나 씨. 두 분은 측면과 후면을 감시하며 접근하는 적의 위치를 치세 씨에게 바로 보고해 주십시오."
10016085-26 = "색적 임무로군요…… 알겠습니다!"
10016085-27 = "장수풍뎅이를 눈으로 좇는 것에 비하면 이 정도 임무는 간단하니까. 맡겨달라고!"
10016085-28 = "뭔가 우스꽝스러운 꼴을 한 기마가 하나 있는데……"
10016085-29 = "건드리기만 해도 금방 무너질 것 같네."
10016085-30 = "그럼 첫 상대는 저 말로 할까?"
10016085-31 = "좋아, 그럼 가자!"
10016085-35 = "치세 공! 북북동 방향에서 적 기마가 접근합니다!"
10016085-36 = "우, 우아아…… 버, 벌써 시작인가요……?"
10016085-42 = "크, 크다……?!"
10016085-43 = "이 선수, 가까이서 보니까 엄청나게 키가 커서 손이 안 닿아!"
10016085-48 = "괘, 괜찮아! 부딪혀서 중심이 흐트러진 틈에 모자를 잡아당기면 되니까……"
10016085-50 = "모자—"
10016085-51 = "잡았다."
10016085-52 = "어, 어느 틈에 모자를?!"
10016085-53 = "타, 탈락했어!"
10016085-55 = "역시 치세 공, 전광석화와 같은 속도네요!"
10016085-56 = "후후, 치세는 백귀야행 카루타 대회의 챔피언이니까."
10016085-57 = "손을 움직이는 속도라면 그 누구에게도 지지 않는다고!"
10016085-59 = "기수는 적의 공격을 받는 약점이기도 하지만, 역으로 상대의 모자를 빼앗을 수 있는 유일한 역할……"
10016085-60 = "양익의 균형이 조금 불안해지긴 했지만, 기수에 손이 빠른 선수를 배치한 보람이 있었군요."
10016085-61 = "치세, 오른쪽에 또 적이야!"
10016085-65 = "빈틈을 노려 옆에서 기습을—"
10016085-71 = "—두 개."
10016085-72 = "다, 당했다……!"
10016085-74 = "밀레니엄 대 백귀야행의 기마전, 결승전이 진행 중인 현장! 이곳에서는 예상치 못한 대이변이 벌어지고 있습니다!"
10016085-75 = "치세 선수를 기수로 한 백귀야행 팀의 기마가 경기를 시작한 지 1분 만에 두 명의 기수를 쓰러트리며 승기를 잡았습니다!"
10016085-76 = "모습은 다소 이상하지만, 성채와 같은 견고한 방어에 밀레니엄 팀의 기마들이 감히 접근하지 못하고 각개격파 당하고 있는데요."
10016085-77 = "밀레니엄으로서도 종합 우승을 위해서라면 질 수 없는 승부……! 과연 최후의 승자는 누가 될까요!"
10016085-79 = "이대로 가다가는 손도 쓰지 못한 채 꼼짝없이 지고 말겠어……"
10016085-80 = "마키, 어떻게 좀 도와줘!"
10016085-81 = "으응? 나 말이야?"
10016085-82 = "나는 원래 기수였던 하레 선배의 부탁으로 대신 기마전에 참가한 것뿐인데?"
10016085-83 = "게다가 나도 딱히 신체 능력이 엄청나게 뛰어난 것도 아니라고……"
10016085-84 = "하지만 마키는 그 유명한 <베리타스> 소속의 해커잖아?"
10016085-85 = "해킹이라든가…… 뭔가, 베리타스의 기술로 해결할 수 있는 방법 없어?"
10016085-89 = "으음. 치히로 선배에게 들키면 또 혼날 텐데……"
10016085-90 = "하지만 그렇게 부탁을 받으면 하는 수 없지."
10016085-91 = "하레 선배에게 빌려온 이 <아테나 3호>를 쓰는 수밖에……!"
10016085-93 = "으으…… 어느새 백귀야행 학원의 팀도 우리 밖에 남지 않았어……"
10016085-94 = "이제 남은 상대는 몇이지?"
10016085-95 = "저, 저희가 두 팀을 쓰러트렸으니까…… 남은 모자의 수를 더하면……"
10016085-96 = "하, 한 팀 남았어요!"
10016085-97 = "……어라? 하지만 적은 여전히 세 팀이나 남아있는데요? 이게 어떻게 된 일이죠?"
10016085-102 = "후후…… 이제야 눈치챘구나?"
10016085-103 = "그 말이 맞아. 여기 있는 두 팀은 가짜 이미지를 투영해 만든 홀로그램 영상이거든!"
10016085-104 = "<아테나 3호>에 새로 탑재된 홀로그램 투사 기능을 사용해서 더미를 만들어 봤지."
10016085-105 = "어때. 진짜를 구별할 수 있겠어?"
10016085-107 = "그게 뭐야! 경기에 도구를 가져와서 사용하다니. 반칙 아냐?"
10016085-108 = "……아쉽게도 실격을 선언하기에는 규정이 모호하군요."
10016085-109 = "황륜대제의 규정에 따르면 기마전에서 총기나 폭탄을 사용하는 것에 대해서는 금지 조항이 있지만, 홀로그램으로 눈을 속이면 안 된다는 말은 없으니까요."
10016085-110 = "하지만 설마 저런 방법으로 편법을 사용할 줄이야…… 다음 황륜대제에는 홀로그램 관련 규정을 신설해야겠네요."
10016085-111 = "동시에 두 개의 분신을 만들어내다니…… 역시 밀레니엄. 방심할 수 없는 상대로군요!"
10016085-112 = "상대는 진짜를 구분할 시간을 주지 않기 위해서라도 바로 공격해 올 겁니다."
10016085-113 = "이즈나 씨, 츠쿠요 씨. 두 분의 특기를 사용할 때입니다!"
10016085-114 = "저, 저희의 특기라면……?"
10016085-115 = "인법입니다!"
10016085-116 = "인법이군요!"
10016085-117 = "……인법? 그거 마술 같은 거였지? 후후, 흥미롭네."
10016085-118 = "그럼 밀레니엄의 홀로그램과 백귀야행의 인법, 두 가지 중 무엇이 더 눈을 잘 속이는지 승부해 보자고!"
10016085-119 = "자, 세 방향에서 동시에 간다—!"
10016085-123 = "우, 우아아아……"
10016085-124 = "츠, 츠쿠요 인법첩!"
10016085-129 = "……잡았다! 이걸로 밀레니엄의 승리—"
10016085-133 = "어라? 이건 여우 인형……?"
10016085-134 = "그렇다면 상대 기수는 어디에 간 거지?"
10016085-139 = "—느려."
10016085-140 = "우, 우앗? 어느새 다시 제자리에?!"
10016085-147 = "으악— 당해버렸다—"
10016085-148 = "……이걸로 세 개."
10016085-149 = "역시 해냈구나, 치세! 믿고 있었다고!"
10016085-150 = "으아아…… 노, 놓치는 줄 알았어요……."
10016085-152 = "역시 츠쿠요 공! 저의 인법첩을 그 짧은 시간 내에 완벽하게 터득하시다니…… 대단하시네요!"
10016085-153 = "치세 공을 공중으로 띄우고 여우 인형으로 바꿔치는 타이밍이 조금만 늦었어도 분명 모자를 빼앗겼을 거예요!"
10016085-155 = "높이높이— 재미있었어."
10016085-156 = "하, 하하…… 두, 두 번은 못 할 것 같네요……."
10016085-157 = "그, 그보다 치세 선배…… 머리가 뽑힐 것 같은데…… 이제 놓아주시면 안 될까요……?"
10016085-159 = "치세 선수, 곡예와 같은 화려한 일격으로 마키 선수의 모자를 빼앗았습니다!"
10016085-160 = "방금 전의 공격으로 밀레니엄 측 기수가 모두 탈락했으므로……"
10016085-161 = "백귀야행 팀의 승리입니다!"
10016085-163 = "……좋았어!"
10016085-167 = "크흠……. 저답지 않게 조금 평정을 잃고 말았군요."
10016085-171 = "하스미 공, 하스미 공! 방금 보셨나요?"
10016085-172 = "저희가 이겼어요! 이게 다 하스미 공의 기책 덕분이에요!"
10016085-173 = "네. 계속 보고 있었습니다. 여러분도 정말 멋진 활약을 보여주셨습니다."
10016085-174 = "부장이 쓰러졌을 때는 정말 이대로 끝이라고 생각했는데……"
10016085-175 = "저처럼 커다랗기만 하고 쓸모없는 학생도 활약할 수 있도록 도와주시다니……"
10016085-176 = "정말…… 감사합니다…… 흐아앙……"
10016085-177 = "이번의 승리는 전적으로 여러분의 활약 덕분인걸요. 오히려 제가 도움이 되었다면 다행입니다만……"
10016085-178 = "물론이에요! 그리고 엄청나게 즐거웠는걸요!"
10016085-179 = "소속을 가리지 않고 모두가 마음을 모아, 자신의 장점을 더해 멋진 승리를 따내는 그 순간은……"
10016085-180 = "마치 시바견왕왕 감독님의 작품 속 주인공이 된 기분이었어요!"
10016085-181 = "다음번에도 또 하스미 공과 경기를 할 수 있었으면 좋겠네요!"
10016085-182 = "하지만…… 저는 트리니티의 학생입니다만."
10016085-183 = "다음번에는 적으로 만나게 될지 모른다고요……?"
10016085-184 = "그래도 괜찮아요!"
10016085-185 = "하스미 공과 함께 경기를 할 수 있다면 적이든 아군이든 즐거울 테니까요!"
10016085-186 = "맞아. 나도 엄청나게 즐거웠거든!"
10016085-187 = "저, 저도 즐거웠어요……!"
10016085-191 = "그런가요……."
10016085-192 = "……하지만 그렇다고 해서 봐 드리지는 않을 거랍니다?"
10016085-193 = "트리니티의 학생으로서, 언제나 경기에서는 최선을 다할 테니까요."
10016085-195 = "네, 이즈나도 언제나 최선을 다할게요!"
10016085-196 = "다, 다음에도 잘 부탁드립니다!"
10016085-197 = "다음에 또 봐~"
