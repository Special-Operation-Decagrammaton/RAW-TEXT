[translation]
10056090-1 = "第9話;そこでしか見えない価値"
10056090-3 = "（ブルーホールに夜が訪れた）"
10056090-4 = "（夜の海は先が分からないくらいに真っ暗だった）"
10056090-5 = "（縛られたままデッキに座っていたせいで腰が痛い……）"
10056090-6 = ""
10056090-8 = ""
10056090-9 = "ううっ……すみません、先生。"
10056090-10 = "こんなことに巻き込んでしまって……。"
10056090-11 = "[s1] \"気にしなくていいよ。\"\n[s2] \"こうやって縛られるのも慣れてるし……。\""
10056090-14 = " 慣れてる……慣れてるっ！？"
10056090-15 = "シャーレの業務って、思った以上に大変なんですね……。"
10056090-16 = "んで、対策を立てなくていいの？"
10056090-17 = "先生のおかげで時間は稼げたけど、のんきにしてられないよ。"
10056090-18 = "夜が明けたらあのバカの気が変わってるかもしれないし。"
10056090-19 = "部長、本当にクジラの骨や[ruby=りゅうぜんこう]龍涎香[/ruby]を取りに行くの？"
10056090-20 = "そういうものに手を付けるのは、ダイバー免許剥奪レベルの重罪だけど……。"
10056090-21 = ""
10056090-23 = ""
10056090-24 = "先生の安全がかかっているなら、仕方ないよ……。"
10056090-25 = "[s3] \"いったん、私のことは置いとこうか。\"\n[s4] \"みんなはどうしたいの？\""
10056090-28 = "もちろん、海賊なんかに協力したくはありません。"
10056090-29 = "で、でも先生の安全がかかっているんです。#n嫌だからといって断れるものでも……。"
10056090-30 = "やっぱり今回は、ナナミの言いなりになるしか……。"
10056090-31 = "[s5] \"私は大丈夫だから。\"\n[s6] \"嫌なことはしなくていいんだよ。\""
10056090-34 = ""
10056090-36 = ""
10056090-37 = "分かっています。#n……好きなことだけして生きていくなんてできない、って。"
10056090-38 = "借金を返すために船底掃除をしたように。"
10056090-39 = "何かを得るには、嫌なことも飲み込まなければならないんです。"
10056090-40 = "[s] \"好き勝手にしていいって意味じゃないよ。\""
10056090-41 = ""
10056090-43 = ""
10056090-44 = "[ns7] \"君たちの追及する、不変の価値があるなら――\"\n[ns8] \"他人を気にして妥協する必要はないってこと。\""
10056090-47 = ""
10056090-49 = ""
10056090-51 = "変わらない、価値……。"
10056090-52 = ""
10056090-53 = "先生。龍涎香をご覧になったことはありますか？"
10056090-54 = "龍涎香は水中にあると、幻想的で柔らかい香りを放ちながら、徐々に溶けていきます。"
10056090-55 = "ですが水の外に出して光を当てると……醜い石にしか見えません。"
10056090-56 = "海中に眠るものの多くが、同じなんです。"
10056090-57 = "キラキラした泡も水面では消え、美しく泳いでいたクラゲも水の外では形を保てない。"
10056090-58 = "姿を現した時より、隠れている時のほうが輝く価値もあるんです。#nだから――"
10056090-59 = ""
10056090-61 = ""
10056090-62 = "大事なものは、水の外に出したくありません。"
10056090-63 = ""
10056090-65 = ""
10056090-66 = ""
10056090-67 = "部長……。"
10056090-68 = ""
10056090-70 = ""
10056090-71 = "……クジラだ。"
10056090-72 = "船が集まってるから見に来たのかな？"
10056090-73 = "[s] \"……クジラも水面に上がる時があるんだね。\""
10056090-74 = "航海中はよく出くわすよ。"
10056090-75 = "機嫌がいい時は水面から飛び上がったりもするし。"
10056090-76 = "でも、クジラってすっごく重いから、跳ねる時にケガすることもあるんだけどね。"
10056090-77 = "[s9] \"クジラにとって水上は危険だろうに……。\"\n[s10] \"どうしてそこまでしてジャンプするのかな？\""
10056090-80 = "いろいろな説がありますが……私は、好奇心だと思っています。"
10056090-81 = "水の上から楽しそうな音が聞こえるけど、見上げても船底しか見えない。"
10056090-82 = "だから、音の正体は何なのか確認しようと顔を出すんです。"
10056090-83 = "[s11] \"水の下でしか見えない価値のように……。\"\n[s12] \"水の上でしか見えない価値もあるんだね。\""
10056090-86 = "……！"
10056090-87 = "[s] \"勇気がいることだろうけど、自分に嘘はつかないで。\""
10056090-88 = ""
10056090-90 = ""
10056090-91 = ""
10056090-92 = "[ns] \"君たちの可能性は無限にあるから。\""
10056090-93 = ""
10056090-94 = "はぁっ……。"
10056090-95 = "……こんな所で使いたくはないけど。"
10056090-96 = "ナナミが航海術に優れているといっても、対抗策がないわけではありません。"
10056090-97 = "……水中の私たちを捕まえることはできませんから。"
10056090-98 = "ウィー・アー・ファスト～"
10056090-99 = "ただ、問題は先生で……。"
10056090-100 = "私たちが水中に逃げている間、海賊たちもただ見ているだけではないでしょう。"
10056090-101 = "閃光弾や煙幕弾でもあれば……。"
10056090-102 = ""
10056090-104 = ""
10056090-105 = "友達に借りればいい。"
10056090-106 = ""
10056090-108 = ""
10056090-109 = "……友達？"
10056090-110 = ""
10056090-112 = ""
10056090-113 = ""
10056090-114 = "うん。新しくできた友達にお願いしてみよう。"
