[translation]
1005302-1 = "아침 조깅"
1005302-2 = "새벽의 공원 산책로"
1005302-3 = "(이른 아침, 산책을 나왔다가 우연히 유우카를 만났다.)"
1005302-9 = "[ns] \"안녕, 유우카.\""
1005302-10 = "어라, 선생님?"
1005302-11 = "이른 아침부터 이런 외진 곳에서 뵙게 되다니, 우연이네요."
1005302-12 = "[s1] \"가볍게 산책이라도 할까 싶어서.\"\n[s2] \"유우카는 어쩐 일이야?\""
1005302-13 = "아, 그게 그러니까……"
1005302-14 = "아, 그게 그러니까……"
1005302-15 = "옷차림을 보면 아시겠지만, 일과를 시작하기 전에 가볍게 운동이나 할까 해서요."
1005302-16 = "전에도 말씀드렸지만, 밀레니엄에서 주관하는 황륜대제가 얼마 남지 않았거든요."
1005302-17 = "물론 저는 실행위원을 맡게 될 예정이라, 선수로 뛸 기회는 거의 없을 것 같지만……"
1005302-18 = "그래도 명색이 황륜대제를 주관하는 학교의 임원인데, 체력이 부쳐 경기 중에 형편없는 모습을 보여도 곤란하니까요."
1005302-19 = "거기에 더해 가벼운 운동은 업무 효율을 높여준다는 말도 있으니……"
1005302-20 = "그래서 건강도 생각할 겸, 아침에 달리기를 하기로 했답니다."
1005302-21 = "게다가…… 최근에는 군살도 꽤 붙은 것 같고."
1005302-22 = "[s] \"유우카는 지금 그대로도 괜찮아.\""
1005302-23 = "그, 그렇게 말씀하셔도……!"
1005302-24 = "흠, 흠…… 여하튼, 당분간은 특훈이에요!"
1005302-25 = "우선은 5km 전력 질주를—"
1005302-26 = "[s] \"처음부터 너무 무리하는 게 아닐까?\""
1005302-27 = "후후, 걱정 마세요."
1005302-28 = "속도라면 몰라도 지구력만큼은 자신이 있거든요."
1005302-29 = "5km 정도를 달리는 건 조금도 문제없어요!"
1005302-30 = "[s] \"그럼 나도 같이 옆에서 달릴게.\""
1005302-31 = "네? 선생님도 함께요?"
1005302-32 = "저야 상관없지만…… 제 페이스에 맞추어 같이 달리셔도 괜찮으시겠어요?"
1005302-33 = "혹여라도 뒤처지시면 버려두고 갈 거예요?"
1005302-34 = "[s] \"조금은 봐줘…….\""
1005302-35 = "농담이에요."
1005302-36 = "그럼 일단 가볍게 뛰어볼까요?"
1005302-38 = "(이후, 유우카와 함께 달리기를 시작했다.)"
1005302-43 = "(……10분 뒤.)"
1005302-45 = "헉, 헉, 헉……"
1005302-49 = "서, 선생님…… 헉, 헉…… 잠시만……"
1005302-50 = "[s3] \"……괜찮아?\"\n[s4] \"……혹시 벌써 지친 거야?\""
1005302-51 = "그, 그럴 리가요. 헉, 헉…… 아직 10분밖에 달리지 않았는데……"
1005302-52 = "그, 그럴 리가요. 헉, 헉…… 아직 10분밖에 달리지 않았는데……"
1005302-53 = "준비운동에 불과한 이 정도의 운동만으로…… 기진맥진할 리가……"
1005302-57 = "……있네요."
1005302-58 = "[s] \"일단 여기에 앉아서 잠깐 쉬자.\""
1005302-61 = "[wa:50]― 하아, [wa:1500]하아…… [wa:1800]설마 고작 몇 달 사이에"
1005302-62 = "[wa:2500]― 이렇게 체력이 약해졌을 줄이야……[wa:500]"
1005302-65 = "[wa:600]― 황륜대제에서 [wa:900]망신을 당하지 않기 위해서라도……"
1005302-66 = "[wa:2350]― 더 열심히 체력 관리를 [wa:1100]해야겠어요."
1005302-69 = "[wa:300]― 아, [wa:700]선생님도 물 [wa:800]필요 하신가요?"
1005302-72 = "[wa:300]― 네. [wa:500]여기……"
1005302-75 = "[wa:800]― 자, [wa:400]자, 잠시만 기다려주세요, [wa:250]선생님!"
1005302-76 = "[wa:900]― 여, [wa:800]역시 [wa:700]지금은 [wa:550]안 되겠어요!"
1005302-79 = "[wa:700]― (지금 여기서 내가 입을 댄 페트병으로"
1005302-80 = "[wa:2100]― 선생님이 물을 마신다면…… [wa:2800]사실상의 [wa:1500]간접 키……)"
1005302-83 = "[wa:700]― (아니, 아니, [wa:1000]아무리 이런 상황이라고는 하지만"
1005302-84 = "[wa:1550]― 그런 파렴치한 짓이 [wa:1650]용납될 리가……!)"
1005302-87 = "[wa:800]― (하지만…… [wa:2200]선생님이라면……)"
1005302-90 = "[wa:300]― 한 모금만…… [wa:1900]드셔야 해요……?"
1005302-94 = "하아…… 물을 마시니 조금 살 것 같네요."
1005302-95 = "체력이 약해졌다는 건 스스로도 느끼고 있었지만, 그래도 선생님도 따라가지 못할 정도로 지구력이 약해졌다니…… 충격이에요."
1005302-96 = "황륜대제 전까지 어떻게든 체력을 회복시키지 않으면……"
1005302-97 = "[s5] \"처음에는 너무 무리하지 않는 게 좋아.\"\n[s6] \"가볍게 조깅부터 시작하는 게 어떨까?\""
1005302-98 = "……그렇네요. 달리기만큼은 아니더라도 가벼운 조깅은 기초체력 향상에 도움이 된다고 하니……"
1005302-99 = "……그렇네요. 달리기만큼은 아니더라도 가벼운 조깅은 기초체력 향상에 도움이 된다고 하니……"
1005302-100 = "남은 기간 동안 매일 아침마다 조깅을 해야겠어요."
1005302-105 = "그럼, 이번에는 조금 속도를 줄여서…… 계속 함께해 주시겠어요?"
1005302-107 = "(이후, 유우카와 느긋하게 조깅을 한 뒤에 샬레로 돌아왔다.)"
