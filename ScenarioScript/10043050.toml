[translation]
10043050-1 = "제5화;중요한 것은 꺾이지 않는 마음"
10043050-3 = "그렇군요……. 레이 양에게는 잠깐의 휴식이 필요한 상황이군요."
10043050-4 = "[s] \"응……. 아무래도 여러모로 힘든 상황이니까.\""
10043050-5 = "확실히 무언가 이상한 낌새가 느껴지지 않는지, 모든 관중을 하나하나 지켜보는 것은……."
10043050-6 = "체력적으로도 정신적으로도, 무리가 가는 일이겠지요. 충분히 그럴 수 있는 일입니다."
10043050-7 = "[s] \"스미레는 괜찮아?\""
10043050-8 = "저는 아직 괜찮습니다. 체력 쪽으로는 어느 정도 자신이 있는 몸이기도 하고요."
10043050-9 = "마침 잘 오셨습니다. 이미 수상해 보이는 몇몇 요소들을 관찰해 두었거든요. 그리고 지금의 제 역할과 복장을 이용해……."
10043050-10 = "그 사람들에게 어떻게 접근하면 좋을지도, 생각해 두었습니다!"
10043050-11 = "자, 가시죠!"
10043050-20 = "우선, 저기의 저 분입니다."
10043050-26 = "3구째 스윙 스트라이크…… 구종은 직구……."
10043050-27 = "4구째…… 볼……. 구종은 스플리터……."
10043050-33 = "5구째 타격…… 중견수 플라이…… 이것으로 타자의 타율은……."
10043050-34 = "동시에 투수의 방어율은……."
10043050-39 = "보셨습니까, 트레이너? 저분은 계속해서 태블릿에 무언가를 적고 있었습니다."
10043050-40 = "[s] \"이건 확실히…… 일반적이지는 않네.\""
10043050-41 = "그렇지요. 야구에 대해서, 아직은 그렇게까지 자세히 모르는 제가 보기에도."
10043050-42 = "공격하는 쪽과 수비하는 쪽의 정보를 모두 기록하는 것은, 어딘가 이상해 보입니다."
10043050-43 = "그러면, 잠시 다녀오겠습니다."
10043050-44 = "네? 무엇을 어떻게 할 생각이냐고요? 걱정하지 마세요, 트레이너. 지금의 저는 아르바이트생이니까요."
10043050-47 = "OPS를 계산하면……."
10043050-52 = "안녕하세요? 드링크 한 잔 어떠십니까?"
10043050-53 = "우왓?! 뭐, 뭐야……? 드링크 아르바이트?"
10043050-54 = "그러고 보니…… 기록에 너무 열중한 나머지, 목이 마른 것도 잊고 있었네. 한 잔 부탁해."
10043050-55 = "네. 여기 있습니다. 드세요."
10043050-61 = "다음 타자가 타석에 등장…… 그리고……."
10043050-62 = "뭘 그렇게 기록하고 계시는가요?"
10043050-63 = "이거? 뭐…… 별거 아니야. 선수들 타율, 투수 구종, 타구의 질이나 결과…… 그런 것들이지."
10043050-64 = "그런 걸 왜 적냐고?"
10043050-65 = "……."
10043050-66 = "신경 쓰지 마! 아르바이트 중이면 자기 일에나 충실히 하라고!"
10043050-70 = "(트레이너. 보셨습니까?)"
10043050-71 = "[s1] (……알아볼 필요는 있겠어.)\n[s2] (너무 과격하게는 하지 말고……?)"
10043050-74 = "(네. 트레이너!)"
10043050-81 = "크윽……! 경기 정보를 스포츠 베팅 사이트에 실시간 업로드해서, 포인트를 얻겠다는 내 계획이……!"
10043050-86 = "그것도 인가받지 않은 사이트인 데다가, 사이트 여론까지 마음대로 조종하려 했군요……."
10043050-87 = "쳇! 팬이라면 이 정도는 할 수 있는 일이라고! ……아마도."
10043050-88 = "그것은 조금, 아니라고 생각합니다."
10043050-89 = "팬이 있기에 선수들이 있는 것이고, 선수들이 있기에 팬이 모이는 것이기도 하죠."
10043050-90 = "스포츠가 문화로 성장하는 데에는, 많은 팬의 힘이 가장 중요하겠습니다만, 그런 팬에게도 최소한에 지켜야 할 선은 있어야 하지 않을까요!"
10043050-91 = "회원님들이 찾아오지 않는 트레이닝 센터는, 그저 기구를 모아 놓은 공간에 지나지 않는 것처럼 말이죠!"
10043050-92 = "윽……! 재미도 없는 정론이나 늘어놓다니!"
10043050-97 = "일단 비뚤어진 팬심을 가진 분을 막아내기는 했습니다만……."
10043050-98 = "근본적으로는 제가 잘못 짚은 모양이군요. 저희가 찾던 범인은 아니었습니다."
10043050-99 = "[s] \"뭐, 뭐어…… 일단 권장할 수 없는 행위였으니까……? \""
10043050-100 = "그렇게 말씀해 주셔서 감사합니다. 트레이너."
10043050-101 = "하지만 아직 포기하지 않았습니다. 무엇보다 포기하면 근성장은 거기에서 멈추는 법이니까요!"
10043050-102 = "다음 포인트는 이쪽입니다!"
10043050-107 = "가라! 싸워라! 그리고 마침내 이겨라!"
10043050-108 = "이 북은 승리의 북! 너희들의 뒤에는 우리가 있다!"
10043050-114 = "[ns] \"그냥 응원단이 아닐까?!\""
10043050-115 = "아닙니다, 트레이너. 우리는 항상 모든 것에 주의를 기울여야 합니다."
10043050-116 = "그저 단순하게 접근하자면, 북을 치며 응원을 보내는 응원단처럼 보이겠지만……."
10043050-117 = "저것은 사실, 북소리를 이용하여 모스 부호로 비밀 통신을 보내는, 비밀 결사의 수법일 수 있습니다!"
10043050-121 = "(분명 스미레의 과도한 오해일 거라고 생각했지만…….)"
10043050-126 = "어, 어떻게 알았지? 우리가 코기의 팬을 자처해, 몰래 모스 부호로 사인을 훔치고 있었다는 것을!"
10043050-131 = "암호 풀이 전문 동아리 부원들에게 트레이닝을 전파하기 위해, 모스 부호 과목을 교양으로 들어 두었기 때문입니다!"
10043050-132 = "[s3] \"그랬어?!\"\n[s4] \"결국 트레이닝 전파가 목적이었냐!\""
10043050-135 = "처음 짐작해 본 것에서는 조금 벗어났습니다만, 비슷한 '스포츠'에 발을 담그고 있는 몸으로서, 이 말은 꼭 해 드리고 싶군요."
10043050-136 = "승부의 승패가 가치 있고 고귀한 것은, 그것이 정당한 규칙 위에서 이루어지고 있다는 암묵적인 약속과 합의가 있기 때문입니다."
10043050-137 = "그것을 이런 방식으로 일그러뜨리면, 결과적으로 승리에 내포된 가치 역시 엉망이 되고 말겠지요."
10043050-138 = "아마도 우리는 그런 것을 스포츠 정신이라고 부르는 것일 거고요."
10043050-143 = "……그렇기는, 하지만. 우리도 솔직히 무섭다고."
10043050-144 = "여기서 만에 하나 브레이브스에게 지기라도 하면, 그다음은 어떻게 되겠어……."
10043050-145 = "쭉 이겨 왔던 상대에게, 무슨 일이 일어나서 뒤를 물리기라도 하면, 그 결과를 감당할 자신이 없다고……."
10043050-146 = "이러니 저러니 해도 야구공은 둥근 것이니까, 이변은 언제든지 일어날 수 있단 말이야……."
10043050-147 = "[s5] \"그 이변과 결과까지를 포함하는 것이\"\n[s6] \"우리의 '스포츠'가 되어야 하지 않을까요.\""
10043050-151 = "[ns7] \"지는 것보다 이기는 것이 좋고.\"\n[ns8] \"'변수'를 없애고 싶은 것이…… 사람의 본능이라고 해도요.\""
10043050-155 = "……."
10043050-157 = "미안해……. 잘못했어……."
10043050-159 = "네. 그걸로 좋습니다."
10043050-160 = "아무래도 이 모든 일이, 과도하게 뜨거워진 '팬심' 때문에 일어난 일이라고 하면……."
10043050-161 = "다음에 언제 한번, 저희 밀레니엄 트레이닝 센터에서 함께 그 열기를 소모해 보시는 것은 어떨까요?"
10043050-162 = "[s] \"의외로, 스미레. 영업에 소질이 있구나…….\""
10043050-166 = "네? 그건 또 무슨 말씀인지요, 트레이너?"
10043050-169 = "……완전히 잘못 짚지는 않았습니다만, 결국 범인과는 아무 관계가 없었군요."
10043050-170 = "쉽지 않네요, 트레이너. 쉽지 않아요."
10043050-171 = "[s] \"열심인 것도 좋지만, 너무 쉽게 단정하지는 말자……?\""
10043050-172 = "예……. 트레이너. 저도 반성하고 있습니다."
10043050-173 = "그나마 야구장 자체의 소란이 너무 거대해, 거의 아무도 신경 쓰고 있지 않아서 다행이긴 하네요."
10043050-174 = "참……. 감탄이 절로 나오는군요. 네. 진심으로요."
10043050-175 = "[s] \"혹시 이 모든 절규 같은 것들에…… 감탄한다는 거야?\""
10043050-176 = "예? 아닙니다. 저는 정말로 순수하게 감탄하는 겁니다."
10043050-177 = "음……. 죄송합니다. 트레이너. 저는 아무래도 돌려 말하거나, 그저 하는 말 같은 것에는 서투른 모양입니다."
10043050-180 = "종종, 쓸데없이 매사에 과도할 정도로 진지하다는 평가를 받고 있다는 것도, 잘 알고 있습니다."
10043050-181 = "저도 저 자신이 조금 더 여유 있고, 부드러우며, 남에게 매력적으로 보일 수 있는 성격이었다면……."
10043050-182 = "지금과는 또 다른 모습으로, 누군가에게 다가갈 수 있을지도 모른다고 생각하기도 하니까요."
10043050-185 = "[ns9] \"스미레는 지금 이대로도 좋다고 생각해.\"\n[ns10] \"그런 사람이, 한두 명 정도는 있어도 좋은 게 아닐까.\""
10043050-188 = "감사합니다. 트레이너."
10043050-189 = "후훗……. 트레이너는 보통 좋은 이야기로 대답해 주시는 분이기는 하지만요."
10043050-193 = "아…… 저기, 지금은 약간의 농담 같은 것이었습니다. 혹시 불쾌하게 들렸거나 이상하게 느껴지셨다면, 사과드리겠습니다."
10043050-194 = "괜찮으시다고요? 네. 다행입니다."
10043050-195 = "……."
10043050-196 = "다시 화제를 되돌릴까요. 저는 그렇게 매번 아쉽게 패배하고, 그쯤 하면 포기하거나 마음이 꺾일 법한데도."
10043050-197 = "계속해서 도전하려는 팀과, 그 팀에 대한 응원을 멈추지 않는 이 모든 사람에게 감탄하고 있습니다."
10043050-198 = "저, 트레이너."
10043050-202 = "아뇨…… '선생님'."
10043050-203 = "[s] \"……?!\""
10043050-205 = "[ns] (스미레의 이야기를, 가만히 들어 보기로 했다.)"
10043050-206 = "갑자기 이런 이야기를 꺼내서, 이상한 아이라고 생각하실지도 모르겠습니다만……."
10043050-207 = "저는 다시 한번 도전하려는 사람을, 그리고 길을 이끌어 주려는 사람을 싫어하지 않습니다."
10043050-208 = "싫어할 리가 없죠. 저는 굳이 말하자면 '트레이너'이니까요."
10043050-209 = "애초에, 트레이닝이란 무엇일까요?"
10043050-210 = "[s] \"스미레는 어떻게 생각해?\""
10043050-214 = "……."
10043050-215 = "사람은, 이중적인 존재죠."
10043050-216 = "지금, 이 순간 하고 싶은 일과, 자신이 진짜로 되고 싶은 것이 다른 경우가 많습니다."
10043050-217 = "그 점은 잘 이해하고 있습니다. 무엇보다 저 자신이 트레이너니까요."
10043050-220 = "가령, 다이어트를 시작한 어떤 사람이 있다고 가정하겠습니다."
10043050-221 = "그렇지만 식단 관리를 하다 보면, 으레 지치기 마련이죠. 괴롭고, 맛없고, 힘들고, 고통스럽습니다."
10043050-222 = "그 사람의 입장에서, 지금 당장 하고 싶은 일을 생각해 볼까요. 가령 생크림이 듬뿍 들어간 치즈 크림 파스타를 먹는다고 생각해 보죠."
10043050-223 = "고소하고 눅진한 치즈의 맛과 생크림의 맛, 그리고 잘 구운 베이컨의 맛이 어우러져…… 아주 맛있겠죠."
10043050-224 = "거기에 굵은 통후추라도 갈아서 뿌린다면, 두말할 것도 없을 거고요."
10043050-225 = "[ns] \"응. 나도 뭔가 그거 먹고 싶어졌어.\""
10043050-226 = "후후. 그러신가요."
10043050-229 = "그리고 파스타를 먹은 뒤, 아무래도 입이 느끼할 것이니, 후식으로 시원한 초콜릿 아이스크림을 먹는다고 생각해 보죠."
10043050-230 = "초콜릿 특유의 달콤하면서도 쌉싸름한 맛이, 입을 시원하게 씻어 내 줄 겁니다."
10043050-231 = "그것만으로, 웬만한 사람은 분명, 행복을 느끼겠지요."
10043050-232 = "……그리고 자신이 되려고 했던, 건강하고 균형 잡힌 몸은, 아마도 만들 수 없겠지요."
10043050-235 = "의지란 약한 것입니다. 아주 사소하고 말도 안 되는 이유로, 얼마든지 깨지고 무너질 수 있죠."
10043050-236 = "저는…… 단순한 사람입니다. 그렇게 섬세하지도 못하고, 별로 좋지 않은 의미에서, 일직선이라는 말도 자주 듣습니다."
10043050-237 = "저 자신과 트레이닝부가, 외부에서 어떤 모습으로 비추어지는지도…… 잘 알고 있습니다."
10043050-238 = "그렇지만…… 그렇네요. 그럼에도."
10043050-241 = "가령, 오늘 너무 지쳐서, 손끝 하나 움직일 수 없을 만큼 열심히 운동한 회원이."
10043050-242 = "다음 날 어떻게든 해 보려는 의지를 가지고, 트레이닝룸에 모습을 드러내는 일이 있습니다."
10043050-243 = "뭐, 보통은 열 명 중 한 명 정도이지만요."
10043050-246 = "그래도 그 한 사람을 소중히 여길 수 있다면, 그래서 그 사람이 되고자 하는 목표에 다가갈 수 있도록 도울 수 있다면……."
10043050-247 = "그건, 그것만으로도 충분히 괜찮은 일이 아닐까, 그런 생각을 하고는 합니다."
10043050-248 = "결국, 또다시 앞서 말씀드린 것의 반복이 될 것 같습니다만."
10043050-249 = "저는 도전하려는 사람, 그리고 길을 이끌어 주려는 사람을 싫어하지 않습니다."
10043050-250 = "오히려 좋아하죠. 저는 그럴 수밖에 없는 사람입니다."
10043050-251 = "그리고 그런 의미에서…… 선생님도, 좋아합니다."
10043050-252 = "[s] \"어, 어어?!\""
10043050-253 = "후후. 왜 그렇게 놀라시나요?"
10043050-258 = "'트레이너'."
10043050-262 = "(고맙다는 대답을 해야 할 것 같았지만, 어째서인지 말이 잘 나오지 않았다.)"
10043050-263 = "(스미레의 눈동자에서 좀처럼 시선을 떼지 못하고 있었을 때…….)"
10043050-268 = "어? 아르바이트생이다! 저기요, 여기 잠시만요!"
10043050-269 = "지금 주위에 아르바이트생이 전부 없어져서 그러는데, 마실 것 좀 주세요!"
10043050-273 = "네? 주위 아르바이트생이 전부……?"
10043050-274 = "[s] \"없어졌다고?\""
10043050-275 = "아, 이럴 때가 아니지요. 여기 드링크 있습니다. 시원할 때 드세요."
10043050-279 = "감사합니다!"
10043050-283 = "휴우, 살 것 같네요. 어느 순간부터 아르바이트생들이 보이지 않게 되어서, 너무 목이 말랐지, 뭐예요."
10043050-284 = "혹시 그게 언제부터였는지…… 기억하십니까?"
10043050-285 = "으음, 1이닝 전이었나 2이닝 전이었나…… 아무튼 경기가 막 달아오르기 시작했을 때부터였어요."
10043050-286 = "그렇군요. 경기가 뜨거워지면 드링크를 찾는 분들이 많아질 것이 분명한데도, 오히려 아르바이트생들이 보이지 않게 되었다……."
10043050-287 = "어떻게 생각하시나요, 트레이너?"
10043050-288 = "네. 그렇죠. 확실히 이상한 일입니다. 적어도 그 아르바이트생들이 어디로 갔는지라도 알 수 있다면……."
10043050-293 = "후아……. 조금 힘드네요. 아무것도 마시지 않고 계속 응원을 했더니……."
10043050-297 = "[ns] \"어? 하나에? 또 만났네?\""
10043050-298 = "어라?"
10043050-299 = "선생님!"
10043050-303 = "그렇군요! 스미레 씨는 사람들에게 음료수를 나눠 주고 계셨던 거네요!"
10043050-304 = "그렇습니다. 하나에 씨. 목이 마르신다고 하셨죠? 잠시만 기다리세요."
10043050-309 = "꿀꺽, 꿀꺽……. 감사해요! 조금 지쳐 있었던 참이었거든요!"
10043050-310 = "덕분에 기운이 났어요! 다시 응원을 시작할 수 있을 것 같아요!"
10043050-311 = "스미레 씨는 사람들에게 구호를 나누어 주는 멋진 분이시네요! 구호기사단 같아요!"
10043050-313 = "후후. 저는 어느 쪽이냐고 한다면 건강을 나누어 주는 헬스기사단이 되고 싶군요."
10043050-314 = "그것도 좋은 것 같아요! 그런데 헬스기사단이 뭔가요?"
10043050-318 = "어라? 그러고 보니 드링크라고 하니까……."
10043050-319 = "왠지 다른 아르바이트생분들이, 유난히 한 곳으로 자주 가서 드링크를 나누어 주고 계신 것 같았어요."
10043050-323 = "!!!"
10043050-324 = "[s] \"하나에. 그게 어딘지 혹시 알고 있어?\""
10043050-325 = "네! 저쪽, 저기예요!"
10043050-330 = "저곳은……?"
10043050-331 = "[s] \"포수 뒤편 자리……?\""
10043050-332 = "네! 저도 저기에서 응원하면 멋질 것 같다고 생각했어요."
10043050-333 = "저기에서라면 경기장 전체가 한눈에 들어올 것 같았거든요!"
10043050-340 = "(경기장 전체가 보이는 장소에, 아르바이트생들이 유난히 드링크를 공급하고 있었다는 말이 되는군요.)"
10043050-344 = "(그 말은……?)"
10043050-352 = "선배! 선생님! 거기 계시죠? 범인의 다음 통신이 조금 전에 들어왔어요!"
10043050-353 = "언제나처럼 말도 안 되는 소리만 늘어놓고 끊어버렸지만……."
10043050-355 = "그 덕에 조금이지만, 범인의 위치에 대한 단서를 얻은 것 같아요!"
10043050-356 = "[s] \"정말이야, 레이?!\""
10043050-357 = "훌륭하군요. 레이 양. 그렇지만 어떻게……?"
10043050-358 = "단서는 통신의 감도였어요! 계속해서 관중석을 돌아다니며 통신 대응을 하고 있었는데……."
10043050-359 = "위치 이동에 따라, 통신의 노이즈가 줄어들거나 늘어났거든요!"
10043050-360 = "이걸 이용해서, 노이즈가 줄어드는 방향으로 나아가다 보면……!"
10043050-365 = "그 끝에, 범인의 위치가 드러날 것이라는 거군요. 잘했습니다. 레이 양."
10043050-366 = "[s] \"그렇다면, 우리가 할 일은……!\""
10043050-367 = "네. 트레이너."
10043050-368 = "다음번 범인과의 통화야말로, 최대한 길게 시간을 끌며 이어나가……."
10043050-370 = "범인의 위치를 알아내야만 하는 것이죠!"
