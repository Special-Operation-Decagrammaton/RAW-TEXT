[translation]
80000114-1 = "둘만의 비밀"
80000114-2 = "(늦은 오후, 사무실에서 업무를 보던 중 누군가 찾아왔다.)"
80000114-8 = "안녕! 선생님! 이부키가 왔어!"
80000114-9 = "그동안 잘 지냈어?"
80000114-10 = "[s] \"오랜만이야, 이부키!\""
80000114-11 = "헤헤헤, 여기서 문제입니다!"
80000114-12 = "이부키가 오늘 샬레에 온 이유는 뭘까~요?"
80000114-13 = "[s1] \"음……선생님이 보고 싶어서?\"\n[s2] \"정답! 선생님이랑 놀려고!\""
80000114-16 = "아쉽다! 어제였다면 정답이었겠지만~ 오늘은 평소랑 좀 달라!"
80000114-17 = "오늘은 선생님한테 줄 게 있어서 왔습니다!"
80000114-18 = "짠! 여기!"
80000114-25 = "오늘은 바렌……? 발렌타……? 라는 날이라고 들었거든."
80000114-26 = "헤헤, 이부키는 잘 모르지만, 선생님이랑 달콤한 걸 나눠 먹는 날이래!"
80000114-27 = "그래서 선생님한테 주려고 이부키가 직접 만들었어!"
80000114-28 = "이부키 특제 초코 푸딩이야!"
80000114-29 = "[s] \"엄청 맛있어 보이는걸?\""
80000114-30 = "그치그치?"
80000114-31 = "지금까지 이부키가 먹어본 초콜릿이랑 과자들 중에 제일 달콤한 것만 넣었어!"
80000114-32 = "진짜진짜 맛있을 거야! 선생님, 얼른 먹어 봐!"
80000114-33 = "[s3] \"응, 그럼 맛을 볼까?\"\n[s4] 초코 푸딩의 맛을 본다."
80000114-39 = "어때? 선생님? 맛있어?"
80000114-40 = "[s5] \"정말 달고 맛있네!\"\n[s6] \"정말 달아……! 달아서……맛있네!\""
80000114-43 = "……(빤히)"
80000114-44 = "[ns] 한 입 더 먹는다."
80000114-47 = "……꼴깍."
80000114-51 = "[ns] \"……이부키, 같이 먹을래?\""
80000114-52 = "아, 안 돼!"
80000114-53 = "초코 푸딩은 선생님한테 준 선물이고……그리고……그리고……."
80000114-54 = "아직 저녁 먹기 전인걸."
80000114-55 = "선배들이, 저녁 먹기 전에 간식 먹으면 안 된다고 했어……."
80000114-56 = "이부키는 돌아가서 저녁 먹어야 하니까, 초코 푸딩은 선생님 혼자 먹어……."
80000114-57 = "[s] \"이부키는 기특하네. 선배들 말도 잘 듣고.\""
80000114-58 = "으, 응……."
80000114-59 = "[s] \"하지만 여기는 선배들이 없으니 조금만이면 괜찮지 않을까?\""
80000114-60 = "헉!"
80000114-61 = "그, 그치만……그러면 저녁 못 먹는다고…… 선배들이……."
80000114-62 = "……(꼴깍)."
80000114-63 = "[s] \"그러니까, 몰래 조금만 먹는 거야.\""
80000114-64 = "몰래……?"
80000114-65 = "[s] \"응, 아무도 모르는 우리 둘만의 비밀인 거지!\""
80000114-66 = "선생님이랑……비밀……."
80000114-67 = "응! 그러면 좋아!"
80000114-68 = "선생님, 비밀 꼭 지켜야 해? 이부키도 말 안 할 테니까!"
80000114-69 = "[s] \"물론이지!\""
80000114-70 = "헤헤, 잘 먹겠습니다!"
80000114-72 = "(이후, 이부키와 함께 초코 푸딩을 맛보았다.)"
