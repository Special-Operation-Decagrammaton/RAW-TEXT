[translation]
84303300600-7 = "이게 대체 뭐냐야! 뭔가 참을 수 없는 분노가……!!"
84303300600-8 = "누구라도 상관없어, 다 부숴버리겠어!!"
84303300600-14 = "크아아아악-!! 다 덤벼-!! 나랑 한 판 뜨자!!"
84303300600-18 = "히, 히익……!"
84303300600-19 = "어째서 이런 일이……! 분명 최종 테스트 때까지만 해도 테스터들이 잘만 클리어했었는데……!!"
84303300600-22 = "이, 이게 무슨……!?"
84303300600-23 = "(화가 난다고는 해도 분명 정상적인 상황은 아니군요.)"
84303300600-24 = "(아무래도 방금 한 게임에서 특별한 영향을 받아…… 순간적으로 이성을 잃은 것 같아요.)"
84303300600-25 = "(어떤 원리인지는 잘 모르겠지만…… 분명 이게, 리오가 말했던 그 수상한 점이겠군요……)"
84303300600-30 = "으아아아아-!! 뭐라도 좋아, 손에 잡히는 걸 부숴버리겠어!!"
84303300600-31 = "……!!!"
84303300600-32 = "……일단은 모두를 진정시켜야겠어요."
