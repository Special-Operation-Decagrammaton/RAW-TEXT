[translation]
1600205-1 = "정답은 바로 선생님이에요!"
1600205-2 = "아, 오셨군요. 선생님! 기다리고 있었습니다!"
1600205-3 = "오늘 여기까지 선생님을 부른 이유는 바로바로……!"
1600205-4 = "……(찌릿)"
1600205-5 = "……아."
1600205-6 = "……도, 도서관이니까. 여기서는 작게 말해야 하겠네요. 안그러면 사서분들이……"
1600205-7 = "여기 사서분들 꽤 무섭거든요. 저도 의도치 않게 실수를 좀 했다 보니……"
1600205-8 = "네? 블랙리스트요? 그, 그런 건 아니고요!"
1600205-9 = "그, 그냥 요주의 인물 정도로…… 조용히 좀 해 달라는 말을 들었어서요."
1600205-10 = "……헤헤."
1600205-11 = "아무튼 선생님께 여쭤보고 싶었던 건…… 이겁니다!"
1600205-12 = "……네? 갑자기 웬 심리학 책들이냐고요?"
1600205-13 = "그게 말이죠…… 실은 심리학 책들뿐만이 아니에요, 여기 보시면 자서전에 가십 잡지에……"
1600205-16 = "실은 최근에 제가 드디어 다른 학생분께 '질문'을 받았거든요."
1600205-17 = "평상시엔 다들 저한테서 도망만 치니까, 이런 경우가 적어서 나름대로 긴장하고 있어요."
1600205-18 = "네? 전혀 긴장한 것 같지 않아 보인다고요? 에…… 이, 이게 긴장한 거에요……!"
1600205-19 = "어쨌든 이왕 질문을 받은 것이니 이왕이면 완벽하게, 제대로 설명해주고 싶었는데 말이죠."
1600205-20 = "그 질문이라는 게 하필이면……"
1600205-22 = "\"나도 내 맘을 잘 모르겠어…… 내가 왜 이러는지……\""
1600205-23 = "\"이 두근거리는 기분은 뭐지? 코토리라면 당연히 알고 있겠지?\""
1600205-26 = "……라는 질문이어서요. 솔직히 저도 무슨 말인지 잘……"
1600205-27 = "차라리 과학적 지식이었다면 몇시간이건 차근차근 설명해줄 수도 있는데 말이죠."
1600205-28 = "하지만 제 사전에 '모른다'라는 말은 없으니, 대신 다음에 설명해주겠다고 해버렸어요."
1600205-29 = "그러니 다시 만나기 전까지 무슨 수를 써서라도 알아내야 해요! '두근거림'이란 대체 무엇이냐!"
1600205-30 = "……가 지금까지의 상황이었습니다만."
1600205-31 = "사실 전혀 모르겠어요. 안 되겠어요, 막혔어요, 도무지 정답이 보이지 않아요."
1600205-32 = "책의 자료와 정보들은 전부 다 다른 소리만 하고 있고, 인터넷은 더 제멋대로고……"
1600205-33 = "이래서는 '이거다!'라고 설명해줄 수 있는 데이터베이스의 정리 자체가 불가능해요."
1600205-34 = "어떻게 하죠, 선생님? 선생님이라면 이럴 때 어떻게 하시겠어요?"
1600205-35 = "아니면 선생님이라면…… 알고 계신가요? '두근거림'이라는 게 뭔지?"
1600205-36 = "[s1] \"가장 가까운 자료를 찾아보는 건 어때?\"\n[s2] \"가장 확실한 표본을 조사해보는 건 어때?\""
1600205-37 = "그, 그런 게 있나요? 그런 좋은 게 대체 어디에……"
1600205-38 = "그, 그런 게 있나요? 그런 좋은 게 대체 어디에……"
1600205-39 = "……네?"
1600205-40 = "……저요?"
1600205-41 = "저, 저는 왜 갑자기……?"
1600205-42 = "……저 스스로를 돌아보면 될 거라고요?"
1600205-43 = "그, 그렇게 말하셔도…… 무슨 뜻인지……"
1600205-44 = "저는 그 사람이 아닌데…… 게다가 타입도 전혀 다른 것 같고……"
1600205-45 = "……네? 그런 부분들까지 포함해서? 같을 수도 있다고요?"
1600205-46 = "질문했던 사람의 당시 모습들을 떠올려 보라고요? 그거야 어렵지 않지만 왜 굳이……"
1600205-47 = "……으음."
1600205-48 = "잠시만요. 그래도 선생님께서 말해주신 조언이니, 한 번 해 볼 게요."
1600205-49 = "받은 질문…… 질문했던 학생분의 모습…… 표정……"
1600205-51 = "으으으음…… 저라면 어쩔 때 그런 행동을 했을까요? 저라면, 저라면……"
1600205-52 = "만약 제가 그러는 상황이라면……"
1600205-53 = "……그건…… 그런 상황은……"
1600205-54 = "……아하! 알았다! 이제야 깨달았습니다!"
1600205-55 = "깨달았……는데…… 그렇다는 것은……"
1600205-56 = "그건…… 제가 선생님을…… 생각할 때랑 비슷한……"
1600205-57 = "……!!"
1600205-58 = "[s] \"……코토리?\""
1600205-59 = "저, 저기. 선생님…… 잠시만……"
1600205-60 = "잠시만…… 화장실 좀 다녀와도 될까요?"
1600205-61 = "그, 금방 다녀올 테니까……!"
1600205-62 = "[s] \"……?\""
1600205-63 = "그, 그럼 이만!!"
1600205-65 = "(그렇게 화장실을 다녀온다며 나간 코토리는 어째선지 그대로 돌아오지 않았다.)"
1600205-66 = "(대신 잠시 후, '덕분에 모든 문제가 다 해결됐습니다. 감사합니다.'라는 문자가 날아왔다.)"
