[translation]
10058020-1 = "제2화;지금부터 서로……"
10058020-3 = "경기장"
10058020-4 = "(경기 당일)"
10058020-8 = "캬아-!"
10058020-9 = "카페인 보충 끝!"
10058020-10 = "이제 정말로, 진짜 정말로 본선이구나!"
10058020-11 = "어제 본 전차들이 다 모였어! 진짜 많다!"
10058020-12 = "차 밖으로 떨어지겠다! 앉아서 준비부터 해~!"
10058020-13 = "언제 이런 거 보겠어? 출발 전에 기념사진 찍어야 하는 거 아냐?"
10058020-14 = "브이-"
10058020-15 = "바로 그거지! 브이-!"
10058020-16 = "망신이 어쩌고, 실패가 어쩌고 할 때는 언제고……."
10058020-17 = "부끄러운 이야기는 금지!"
10058020-20 = "앗."
10058020-21 = "선생님 오셨어."
10058020-22 = "선생님?!"
10058020-23 = "[s1] \"안녕, 얘들아!\"\n[s2] \"준비는 잘 되어가니?\""
10058020-26 = "그럼요! 저희는 183호 특별반이잖아요!"
10058020-27 = "경기 보러 오셨군요! 아니면 샬레의 업무로 오신 건가요?"
10058020-28 = "[s] \"만마전의 초대로, 중계 위원으로 왔단다!\""
10058020-29 = "으앗, 그러면 선생님께서 중계하시는 거예요? 뭔가 부끄러운데……."
10058020-30 = "편파 해설 부탁드립니다."
10058020-31 = "편파는 좀 그렇고! 그냥 적당히 호의적이고 유리한 해설 정도면 충분해요!"
10058020-32 = "그게 편파 해설이잖아."
10058020-33 = "선생님, 도와주신 덕분에 여기까지 올 수 있었어요."
10058020-34 = "꼭 우승할게요! 지켜봐주세요!"
10058020-36 = "[ns] \"너희들이 즐기는 것만으로도 충분하단다!\""
10058020-37 = "고마워요! 그렇지만, 우승도 꼭 할 거니까요!"
10058020-38 = "그렇지, 마침 사진 찍고 있었는데, 선생님도 같이 찍어요~!"
10058020-39 = "얼른요! 팔 떨어져요! 어서 모여~!"
10058020-41 = "[ns] (아이들과 함께 카메라 앞에 선다)"
10058020-42 = "하나, 둘! 피로시키-!"
10058020-50 = "으윽……."
10058020-51 = "이로하 쨩! 주간 만마전 표지에 실릴 사진이라구~! 자, 치~즈!"
10058020-52 = "좀 더 당당하게! 아, 지금 것도 괜찮으려나?"
10058020-53 = "약간, 레이싱이 좋지만, 이 전차 바깥으로 나올 수 없는 느낌? 아하하!"
10058020-54 = "치아키, 그건 대체 무슨 소리예요."
10058020-55 = "사진은 찍기 싫다니까요. 치아키가 멋대로 기사 쓰는 것도 싫고……."
10058020-57 = "에에-! 그치만 거짓말은 안 했잖아! 쩨쩨해-!"
10058020-58 = "……저번에 '전차는 내 가족 같은 존재'라고 했더니, 기사 제목으로 장난쳤잖아요?"
10058020-59 = "아하하…… 독자들이 집중할 수 있게 약간 더 흥미롭게 만든 것뿐인데……."
10058020-60 = "기사 제목이 뭐였길래?"
10058020-61 = "'나츠메 이로하, 숨겨둔 가족이 있었다.'"
10058020-62 = "가, 가족이 늘어나는 건 좋은 일이잖아?"
10058020-63 = "치아키, 머리뼈가 몇 개 정도 되는지 아세요?"
10058020-64 = "저번 특집 기사 때 취재해서 알아! 23개잖아!"
10058020-65 = "지금부터 한 230개로 늘려 드려요?"
10058020-66 = "히잇……!"
10058020-67 = "아, 아하하! 지금 있는 걸로 만족할게! 하, 하하하!!"
10058020-68 = "이로하! 설마 홍보 활동을 하지 않을 생각이냐?!"
10058020-69 = "그건 용납 못 한다! 만마전의 위용을 전 키보토스에 떨쳐라!!"
10058020-70 = "이게 만마전의 위용하고 대체 무슨 상관이 있는 건데요."
10058020-71 = "키히힛, 그 이유라면 수백 가지가 있지! 일단 첫 번째!"
10058020-72 = "아, 알았어요. 진짜 이유를 물어본 게 아니라구요. 하아……."
10058020-73 = "내려올 테니까 보채지 마요."
10058020-78 = "……됐죠?"
10058020-79 = "어라? 그 섹시 유니폼은 어디 갔어?"
10058020-80 = "이로하! 특별 주문한 유니폼은 어디 두고 평소의 재미없는 옷차림이냐!"
10058020-81 = "계속 말했는데요…… 레이싱걸 옷은 선수가 입는 게 아니라니까요."
10058020-82 = "잘 들어라. 이로하. 만마전은 마땅히 게헨나의 최고다. 그리고 너는 그 만마전의 전차장이기도 하지."
10058020-83 = "즉…… 게헨나의 주목도는 네가 얼마나 눈에 띄느냐에 따라 달려 있다는 거다!"
10058020-84 = "정보부의 보고에 따르면 샬레의 선생이 그런 옷차림을 좋아한다고 한다."
10058020-85 = "중계 위원으로 초대받은 선생이 이 모습을 보고 홀린다면……. 게헨나가 이 키보토스를 지배하는 것 역시 시간문제지!"
10058020-86 = "그러니까요, 그런 옷은 레이싱을 하는 사람이 입는 게 아니라……."
10058020-87 = "……됐어요. 경기 전에 힘 빼기 싫으니까……."
10058020-88 = "……그럼 옷을 주고 나서 그런 말을 하시든가요. 없는 옷을 어떻게 입어요."
10058020-89 = "그리고…… 그 만마전의 수장이자 개최위원장인 마코토 선배는 왜 안 입는 건데요?"
10058020-90 = "키히힛! 좋은 질문이다!"
10058020-91 = "당연히, 만마전을 대표하는 나 역시도 선생을 포섭하기 위해 이 한 몸 바칠 생각이다!"
10058020-92 = "사츠키! 비장의 옷을 가져오도록!"
10058020-93 = "물론 준비해 뒀어, 마코토 쨩!"
10058020-94 = "자아-"
10058020-104 = "어, 그러니까……."
10058020-105 = "이건, 바보에게만 보이는 옷이로군!"
10058020-106 = "키, 키히힛. 지금 당장 입어주마!"
10058020-111 = "그럴 리가 있겠냐고요! 대체 무슨 소리예요?"
10058020-112 = "그냥 빈 상자잖아요?"
10058020-113 = "어, 어라……? 옷이 어디에 간 거지? 한 번도 안 열어보고 지금 막 열어본 건데?"
10058020-114 = "어제 이부키가 갖고 왔을 때는 분명히 무거웠어!"
10058020-115 = "오, 옷이 없어졌다고?"
10058020-116 = "왜 계속 벗는 거예요?! 진짜 옷이 있다고 한들 왜 여기서 갈아입는 건데요?"
10058020-117 = "에이, 조금만 더 내버려둬 보지. 셔터 찬스였는데~!"
10058020-118 = "이건 만마전의 권위에 대한 도전이다!"
10058020-119 = "처벌 많이 하시구요, 바보들한테도 보이는 옷 입고 출발 선언하러 가셔야죠."
10058020-120 = "역시 선도부 녀석들인가?! 소라사키 히나, 역시 그 옷을 탐낼 줄 알았다!"
10058020-121 = "네, 네. 토라마루 팀, 전원 승차!"
10058020-124 = "전원, 승차!"
10058020-125 = "잘 다녀와! 힘내, 이로하 선배!"
10058020-126 = "고마워요, 이부키. 재밌게 보고 있어요."
10058020-127 = "응!"
10058020-128 = "저기, 이로하 쨩. 이부키 쨩 데려가지 않아도 괜찮겠어?"
10058020-129 = "네. 이부키는 착하고 똑똑한 아이지만 전차 레이싱은 위험해요."
10058020-130 = "이부키도 잘 이해했으니 다행이구요."
10058020-131 = "치아키! 잘 받아 적어라! '나, 하누마 마코토는 이 천인공노할 절도범에 대해…….'"
10058020-132 = "하아…… 사츠키 선배가 출발 선언하셔야겠네요."
10058020-133 = "토라마루, 출발."
10058020-138 = "다들- 준비는 되었을까?"
10058020-139 = "게헨나 컵, 곧 시작할 거란다?"
10058020-142 = "룰은 간단해. 트랙 내의 모든 과녁을 맞히고 다시 이 자리로 오는 것!"
10058020-143 = "착한 아이들 모두, 제대로 기억하고 있겠지?"
10058020-146 = "빨리 달리는 것도 중요하지만—"
10058020-148 = "룰을 지키면서—"
10058020-151 = "평기어, 헬리컬기어, 베벨기어, 랙기어……."
10058020-152 = "뭘 중얼거리고 있는 거야?"
10058020-153 = "긴장되니까 생각나는 대로 기어 종류를 말해보고 있었어……."
10058020-154 = "그거, 도움 돼?"
10058020-155 = "조금은 되는 것도 같고……."
10058020-156 = "그렇구나……."
10058020-157 = "수헬리베붕탄질산플네나마알규인황염아칼칼……."
10058020-158 = "하이포이드 기어, 사이클로이드 기어……."
10058020-159 = "10 프린트 안녕하세요 선생님 20 엔드 런."
10058020-160 = "준비됐지? 그러면—"
10058020-164 = "출발-!"
10058020-167 = "전차, 전진!"
10058020-168 = "출발-"
10058020-171 = "속도로는 지지 않을 거라구! 터보차저도 달았으니까!"
10058020-172 = "초반 페이스가 중요해! 레이싱에서는 선두를 먼저 잡아야-"
10058020-175 = "뭐, 뭐야 방금?! 타이어라도 터진 거야?!"
10058020-176 = "전차에 무슨 타이어야! 옆 차가 통째로 폭발했어!"
10058020-177 = "뭐라고?!!"
10058020-180 = "다 박살 내버려!!!"
10058020-181 = "경쟁자가 없는 것이 진정한 승리다!!"
10058020-182 = "뭐야 이게?!"
10058020-183 = "뭐야 저 멍청하게 생긴 고물은?"
10058020-184 = "박살 내자!! 햣하!!!"
10058020-185 = "우와아아악!! 이쪽으로 오잖아!!!!"
