[translation]
32040-1 = "제4화;수영복 좌담회"
32040-3 = "아우…… 비가 오네요……."
32040-4 = "어머나, 그러게요. 꽤 많이 내리네요."
32040-5 = "으응…… 좋은 아침입니다……."
32040-6 = "일어났어요, 코하루 쨩?"
32040-7 = "좋은 아침이에요. 아즈사 쨩만 아직 침대에서 못일어나고 있네요."
32040-8 = "음…… 으음……."
32040-9 = "뭐야. 아즈사, 매일 일찍 일어나더니……."
32040-10 = "그동안 무리했던 게 아닐까요? 오히려 좀 더 자게 두는 편이 좋을 것 같아요……."
32040-11 = "으응…… 안돼…… 귀여운 것들이…… 둥실둥실…… 파렴치해……"
32040-12 = "어머나…… 뭔가 좋은 꿈을 꾸고 있나봐요♡"
32040-13 = "[s] \"비오는 날 잠이 잘오지.\""
32040-19 = "아, 아우…… 천둥까지……."
32040-20 = "……어머나."
32040-21 = "왜 그래?"
32040-22 = "빨래……! 널어두었는데……! 깜빡하고 있었어요!"
32040-27 = "으, 으아 빨리 가요!"
32040-32 = "으음……?"
32040-42 = "(그로부터 1시간 후…….)"
32040-49 = "자아, 그럼 보충수업부의 제 1회 수영복 좌담회를 시작합니다♡"
32040-50 = "아, 아우……."
32040-51 = "음."
32040-52 = "……뭐야, 이게…… 어째서……."
32040-58 = "[ns] \"어쩌다 이런 전개가…….\""
32040-59 = "으응? 왜 저희가 별관 체육관에 모여서 이렇게 있냐고요? 선생님도 같이 계셨잖아요♡"
32040-61 = "(지금부터 40분 전…….)"
32040-63 = "걸려 있던 빨래는 이게 전부야."
32040-64 = "으응…… 이미 다 젖어버렸네요. 게다가 여기저기 흙탕물까지 튀어서…… 이건 다시 빨래를 할 수밖엔……."
32040-65 = "체육복도 다 젖어버렸잖아! 끈적하고 기분 나빠……."
32040-66 = "그건 코하루 네가 도중에 넘어져서 그런 거잖아."
32040-67 = "이런…… 미안해요, 제가 괜히 빨래를 하자고 해서……"
32040-68 = "아니, 하나코의 탓이 아니잖아. 빨래야 다시 돌리면 되고, 옷이야 갈아입으면 되니까. 문제없어."
32040-69 = "네. 그러네요. 다들, 젖은 옷을 입고 있으면 감기에 걸릴 수도 있으니까, 어서 갈아입도록 해요."
32040-70 = "네. 뜨거운 물에 샤워도 하고, 머리도 제대로 말리는 거예요."
32040-74 = "……아!"
32040-75 = "응? 왜 그래요, 코하루 쨩?"
32040-76 = "……나, 가, 갈아입을 옷이…… 없는데……."
32040-77 = "네?"
32040-78 = "……그렇네. 교복은 널어놨다가 이렇게 됐고, 지금 체육복도 흠뻑 젖었고……. 나도 다른 여분은 없어."
32040-79 = "네?! 아…… 그, 그러고보니 저도…… 아, 아우우……?"
32040-80 = "……. 어머♡ 그렇네요. 그럼 오늘 저희는 속옷차림으로 공부하는 건가요?"
32040-81 = "뭐?! 무, 무슨 소리야?! 안 돼!! 어째서 이야기가 그렇게 되는 건데?"
32040-82 = "그러면 되겠군. 속옷은 여분이 많으니까. 거기다 양말도 신어두면 체온 유지에 도움도 되겠군."
32040-83 = "무슨 이상한 소리에 동조하지 말라고! 왜 교실에서 속옷을 입고 있어야 하는 건데!"
32040-84 = "어머, 코하루 쨩, 그거 생각보다……."
32040-86 = "넌 말하지 마!!"
32040-90 = "빨래를 얼른 돌려서 헤어드라이기든 뭐든 써서 적당히 말려서 입으면 되잖아!"
32040-91 = "그동안은 목욕 타올 같은 걸로 적당히 버티면 되는 거고! 선생님은 방에서 나오지 말고!"
32040-92 = "그리고 공부야 몇 시간 정도는 안 해도 문제없잖아! 갑자기 우등생이 된 거야?!"
32040-94 = "그럼 그 동안은 속옷차림으로 있어야 하나요?"
32040-95 = "빨래가 다 되기 전까지 교실로 못 가는 건가……. 빨리 공부를 시작했으면 하는데."
32040-96 = "아우……"
32040-98 = "왜 이렇게 다들 벗으려고 하는 거야! 노출은 사형! 사형이야!"
32040-100 = "선생님의 개인실"
32040-101 = "(빨래를 돌리는 동안 방에서 나오지 않기로 했다.)"
32040-106 = "아, 으아……?! 뭐, 뭐야?!"
32040-107 = "저, 정전 같은데요……?!"
32040-108 = "그러네요……. 낙뢰로 인한 정전일까요?"
32040-112 = "어, 무, 무슨 소리죠, 이건……?!"
32040-113 = "문제가 발생했어."
32040-114 = "……세탁기가 멈췄어. 열리지도 않아. 이제 어떻게 하지?"
32040-115 = "……?!?!"
32040-119 = "[ns] \"………그래서 결국.\""
32040-120 = "네. 그렇게 해서 결국 수영복 좌담회가 열리게 된 것이랍니다♡"
32040-121 = "아우우…… 뭔가 다른 방법이 있었을 것 같은 기분이지만……."
32040-122 = "어머? 다른 방법은 속옷만 입고 좌담회를 한다, 였잖아요? 저는 그쪽도 상관없지만♡"
32040-123 = "정전 때문에 수업도 불가능해졌지…… 이 정도 낙뢰로 모든 건물의 기능이 셧다운 되다니, 보안이 형편없군."
32040-124 = "오래된 건물이라…… 아우……."
32040-125 = "아니, 딴지를 걸 부분이 거기가 아니잖아! 그런데 왜 좌담회 같은 걸 해야 하는 거야?"
32040-126 = "수업도 못하고 입을 옷도 없다면 그냥 얌전히 방에서 쉬면 되잖아! 그게 일반적이잖아!"
32040-127 = "어머, 좌담회는 합숙의 꽃이잖아요, 코하루 쨩?"
32040-128 = "다 같이 모여서 서로의 깊은 속내를 털어놓는다…… 게다가 비도 오고 정전까지 되어서 분위기는 한층 업!"
32040-133 = "우후후후♡ 이렇게 된 이상 해주는 수밖에 없잖아요? 모처럼 쉬는 시간을 의미 있게 보내야 하지 않겠어요?"
32040-134 = "아하하…… 확실히 합숙에는 다 같이 모여서 떠드는 게 그런 정석 같은 느낌이긴 하니……."
32040-135 = "과연. 그래서 수영복 좌담회인가."
32040-136 = "아니, 전혀 이해를 못하겠다고! 그래서 수영복이 무슨 상관인 건데!!"
32040-137 = "아우우……."
32040-138 = "자아, 자아. 그러지 말고 모처럼이니까 좀 더 즐기는 거예요."
32040-139 = "좌담회, 라고는 해도 이런저런 잡담을 할 뿐이고, 소재는 뭐든 좋으니까♡"
32040-140 = "후후훗♡ 저 이런거 너무 해보고 싶었거든요. 보충수업부에서 해보게 되어서 너무 기쁘달까……."
32040-141 = "[s] \"정말 즐거워 보이네, 하나코…….\""
32040-142 = "하나코가 어떤 기분인지 이해가 돼. 나 역시 보충수업부에 들어와서 그런 기분이니까."
32040-143 = "어머? 그런가요, 아즈사 쨩?"
32040-144 = "응? 당연하지. 공부를 배우는 것도, 다 같이 밥을 먹거나 빨래를 하는 것도, 청소를 하는 것도 어느 것 하나 즐겁지 않은 게 없어."
32040-145 = "어머나……♡"
32040-146 = "수영복은 수영할 때만 입는 건 줄 알았는데 이렇게 활용할 수 있다는 것도 처음 알았고. 몰랐던 걸 알게 된다는 건 즐거운 거 같아."
32040-147 = "아니, 그건 뭔가 좀 다르다고 보지만…… 아우……."
32040-148 = "움직이는 것도 편하고 통풍도 우수하잖아? 하나코가 이걸 입고 다닌 것도 납득이 돼."
32040-149 = "우후후, 그렇죠? 그렇다니까요."
32040-150 = "아니, 그건 범죄라고! 납득하지 말라고! 공연음란죄라고! 사형이라고!"
32040-151 = "코하루와 같이 공부하는 것도 즐거워."
32040-152 = "무, 무슨 소릴 하는 거야, 갑자기 나는 왜?! 낯뜨겁게!"
32040-153 = "어머나……♡"
32040-154 = "뭐…… 나, 나같은 엘리트와 같이 공부할 수 있으니 당연한 거 아냐?"
32040-155 = "음."
32040-160 = "아우…… 아즈사 쨩, 표정 변화가 없어서 무슨 생각을 하는지 불안했는데……. 그렇게 생각하고 있었다니 다행이네요……."
32040-164 = "물론이지. 늘 신세지고 있어서 미안할 뿐이야. 히후미."
32040-168 = "으아앙-! 아즈사 쨔아아앙-"
32040-173 = "(와락-)"
32040-174 = "음, 숨 막혀."
32040-176 = "(보충수업부원들의 이런 저런 소소한 잡담들이 이어졌다…….)"
32040-178 = "이번에 트리니티 아쿠아리움에 골드마구로라는 희귀 어류가 전시된대요."
32040-179 = "저도 그거 팸플릿 봤어요! 환상의 물고기라는 그거죠?"
32040-180 = "근처 바다에서 발견했다고 하더라구요? 구경가보고 싶지만 관람료가 비싸서……."
32040-181 = "바다인가……. 한 번도 가본 적은 없지만……."
32040-182 = "네?! 아즈사 쨩, 바다를 한번도 가본 적이 없다고요?!"
32040-184 = "이미 오래전에 망해버린 어뮤즈 파크에…… 밤만 되면 시끄러운 소리가……."
32040-185 = "그, 그, 그럴 리가 없잖아! 잘못 본 거 아냐?!"
32040-186 = "응, 저도 들은 소문이라서 잘 모르지만……. 괴담이라는 게 다 그런 식이잖아요?"
32040-187 = "저, 전부 거짓말일 거야!"
32040-188 = "아, 아우……."
32040-190 = "수영복을 입고 거리를 다니는 건 생각보다 흔한 일이라고요?"
32040-191 = "그럴 리가 없잖아! 상식을 멋대로 바꾸지 말라고!"
32040-192 = "어머…… 이건 저도 시스터들에게 들은 이야기지만, 키보토스 어딘가의 무법지대에선 수영복에 복면을 쓰고 범죄를 저지르는 범죄집단도 있다고 하던데요?"
32040-193 = "수, 수영복에 복면……?! 대체 왜?!"
32040-194 = "아니, 그러니까 범죄자들이잖아!"
32040-195 = "그만큼 흔한 거란 거죠. 그러니까 코하루 쨩도 이번에……."
32040-196 = "싫어! 뭔지 모르겠지만 싫어! 안 해!"
32040-201 = "………………."
32040-203 = "아즈사 쨩은 좀 더 잠을 소중히 여겨야 해요!"
32040-204 = "……그러네. 오늘은 내가 늦잠을 자버려서 또 폐를 끼쳐버렸어."
32040-205 = "낯선 장소에서 늦잠을 자는 경우는 거의 없는데…… 미안하게 생각하고 있어."
32040-206 = "아니, 이제 여기가 더 이상 낯선 곳이 아닌 걸까……."
32040-207 = "아즈사 쨩은 잠을 더 자야해요, 그러니까 심야의 불침번은 좀 줄여야 해요!"
32040-208 = "불침번……? 무슨 소리야? 그게?"
32040-209 = "응…… 밤마다 잠을 안자고…… 불침번을 섰거든."
32040-210 = "[s] \"하나코가 아즈사를 걱정했었어.\""
32040-211 = "그랬어……?"
32040-212 = "……응, 그랬구나. 미안해."
32040-216 = "사실은…… 불침번은 핑계였고…… 밤마다 학원 주변을 돌면서 부비트랩과 진지를 구축하고 있었어."
32040-218 = "부비트랩이요……?"
32040-219 = "진지……?"
32040-220 = "왜 그런 짓을……?"
32040-222 = "걱정하지 마. 이곳에 침입하려는 루트에만 설치해뒀으니까. 안전상의 문제는 없어."
32040-223 = "(어제 마리 씨를 보면 꼭 그런 것 같지도 않지만…… 아우…….)"
32040-224 = "으응…… 과연……. 그치만 그런 건 미리 말을 해주세요. 그런 행동을 하고 다니니까 사람들이 괜히 수상쩍게 보는 거라구요, 아즈사 쨩."
32040-225 = "그런가…… 그럴지도 모르겠네. 앞으로는 좀 더 주의하겠어."
32040-226 = "나 때문에 선생님과 보충수업부가 피해보는 건 절대 원치 않으니까."
32040-227 = "[s] \"아즈사는 역시 상냥하네.\""
32040-228 = "그, 그런…… 아이 취급은 하지 마, 선생님."
32040-229 = "난 딱히 그런 사람이 아니니까."
32040-230 = "모든 것이 무의미하고 허무한 것이 이 세계의 진실이니까."
32040-231 = "나는 언젠가 모두를 배신하고, 믿음을 배신하고, 마음을 배신하게 될지도 몰라."
32040-235 = "……."
32040-236 = "아우……."
32040-237 = "……."
32040-241 = "아, 전력이……."
32040-242 = "전원이 복구되었나 보네요."
32040-243 = "응, 비도 어느새 그쳤어! 해가 떴어."
32040-244 = "그러네요. 아우…… 이제 빨래를 다시 돌리고 말려야겠네요."
32040-248 = "음. 다행이야. 그럼 제1회 수영복 좌담회는 이걸로 마무리인가. 2회를 기대하고 있겠어."
32040-249 = "2회 같은 건 없어! 이게 처음이자 마지막이야!!"
32040-251 = "(오늘은 빨래를 끝내놓고 남은 시간은 휴식을 취하기로 했다.)"
32040-252 = "(그렇게 하루가 지나고 있었다…….)"
32040-254 = "아뇨, 아직이에요! 이렇게 하루를 그냥 흘려보내선 안돼요!"
32040-255 = "네, 네……?!"
32040-259 = "뭐, 뭐야?! 깜짝이야……! 갑자기 일어나선…… 무슨 소리야?!"
32040-261 = "모처럼 쉬는 날이잖아요. 다 같이 알몸으로 대화도 깊게 나누었는데……."
32040-262 = "기억을 조작하지 마! 그런 적 없다고!"
32040-263 = "응, 그치만 이대로 잠들긴 아쉬워요. 아직, 조금 더……. 할 거면 확실하게 마무리해야죠."
32040-264 = "마무리……? 어떻게?"
32040-265 = "우후후♡ 합숙의 또 다른 묘미라면 역시 밤 산책 아니겠어요?"
32040-266 = "바, 밤산책이요……?"
32040-267 = "네! 지금부터 다 같이 몰래 학원 밖을 나가서 산책하는 거예요♡"
32040-268 = "트리니티 주변의 상점가는 밤늦게까지 하는 가게도 꽤 있거든요. 나가서 군것질이라던가 쇼핑 같은 걸 하고 오는 거예요!"
32040-270 = "그, 그건 교칙 위반이잖아! 안돼!"
