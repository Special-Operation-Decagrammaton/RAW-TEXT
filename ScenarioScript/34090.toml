[translation]
34090-1 = "제9화;아리우스 자치구로 1"
34090-3 = "[ns] \"90분 남았다니, 그건 무슨 얘기야?\""
34090-4 = "아리우스 자치구로 가기 위해선 트리니티 지하의 카타콤을 통과해야 해."
34090-5 = "트리니티에 분포하는 카타콤 입구는 밝혀진 것만 약 300개 정도. 그중에서 진짜 입구는 정해져 있고 나머지는 가짜."
34090-6 = "잘못된 입구로 들어가면 카타콤에서 길을 잃게 된다."
34090-7 = "그래서 우리는 진짜 입구와, 그곳으로부터 아리우스 자치구로 통하는 카타콤의 내부 루트를 음어로 전달받아 해석해서 사용하고 있지."
34090-8 = "……카타콤의 내부는 일정 주기로 변화하거든."
34090-9 = "[s] \"내부가 변한다고?\""
34090-10 = "그래. 예전에 갔던 길이 이번엔 막혀있다거나…… 혹은 방향감각을 잃는다거나…… 그런 식으로."
34090-11 = "어떤 구조인지는 모르지만…… 카타콤은 정체가 밝혀지지 않은 미궁이니까. 그래서 매번 정확한 루트와 입구가 바뀌는 형태야."
34090-16 = "지금 우리는 어디가 진짜 입구인지 알 수 없는 상태예요…… 우리에겐 이제 더 이상 정보가 공유되지 않고 있거든요."
34090-17 = "도망친 사냥개에게 집으로 돌아가는 길을 알려줄 이유는 없겠지."
34090-18 = "하, 하지만…… 딱 한 곳만은…… 아직도 유효한 입구가 남아 있어요. 거기가 바로 저희의 목적지예요."
34090-19 = "그것도 오늘 자정까지야. 이제 한 시간 뒤면 그 입구도 사용할 수 없게 될 거야. 그렇게 된다면……."
34090-20 = "아리우스 자치구로 돌아가지 못하게 되겠지."
34090-21 = "아니, 어떻게든 방법은 찾을 수 있다해도…… 아츠코를 구할 수 없게 될 거야."
34090-22 = "그러니 서둘러야……."
34090-26 = "?!"
34090-27 = "<스쿼드>다!"
34090-28 = "역시 여기로 올 줄 알았어! 전투 준비해!"
34090-29 = "……저들도 똑같은 생각을 하고 있었나 보네."
34090-30 = "전투 준비."
34090-31 = "네, 네!"
34090-32 = "……뭐, 이런 흐름이겠지."
34090-34 = "좋아. 버림받은 들개가 마음을 먹으면 어떻게 되는지 보여주지."
