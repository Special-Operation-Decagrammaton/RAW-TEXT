[translation]
2601706-1 = "#title;데드락"
2601706-2 = "#na;(라나를 보러 183호 특별반에 방문했다.)"
2601706-3 = "[ns] \"라나- 선생님 왔단다-\""
2601706-4 = "3;라나;00\n#3;a\n#3;em;[반응]\n#wait;1500"
2601706-5 = "3;라나;02;앗, 안녕하십니까, 선생님."
2601706-6 = "3;라나;99;난제를 푸느라 오신 줄 몰랐습니다."
2601706-7 = "3;라나;14;이렇게 어려운 문제지는 처음입니다. 벌써 5번이나 재시험에 응시하고 있습니다.\n#3;em;[속상함]"
2601706-8 = "[s1] \"라나에게 어려운 문제라고?\"\n[s2] \"어떤 문제니?\""
2601706-11 = "3;라나;01;10-27 공훈보건부에서 제공하는 심리검사지입니다. 검사 희망자를 받기에 지원해 봤습니다."
2601706-12 = "3;라나;05;하지만 매번 '제대로 성의 있게 검사하라'면서 혼나고 있습니다. "
2601706-13 = "3;라나;05;마지막으로 찾아갔을 때는 '이 답변이 문제다.'라면서 동그라미도 쳐줬습니다만…….\n#3;em;[...]"
2601706-14 = "3;라나;14;이 문제에 어떤 심오한 뜻이 있는지, 저는 아직 어려서 모르는 것 같습니다. "
2601706-15 = "3;라나;02;그러니, 선생님께서 봐주시면 감사하겠습니다."
2601706-16 = "#st;[0,0];instant;1;"
2601706-18 = "3;라나;01\n#3;greeting\n#wait;1300"
2601706-19 = "[ns3] \"라나의 도움이 될 수 있다면 언제든지!\"\n[ns4] \"어디 보자-\""
2601706-22 = "[ns5] <나는 여가 시간에 뜨개질과 암벽등반을 즐긴다……?>\n[ns6] <나는 메뚜기의 종류를 100가지 이상 알고 있다……?>"
2601706-25 = "3;라나;02;네. 두 가지 문제 모두 '그렇다'고 적은 것이 문제라고 합니다.\n#3;em;[반응]"
2601706-26 = "3;라나;01;코어 메모리라는 부품을 만들다 보니 뜨개질도 좋아하게 되었고, 암벽등반은 산 아래로 내려갈 때 지름길을 가다 보니 자연스럽게 취미가 되었습니다."
2601706-27 = "3;라나;02;메뚜기도 컴퓨터에 끼인 걸 치우다 보니 103종류 정도는 알게 됐습니다."
2601706-28 = "3;라나;99;쌍점모메뚜기, 이주메뚜기, 풀무치, 각진모메뚜기…….\n#3;em;[반짝]"
2601706-29 = "[s] \"어…… 아마도 그런 문제가 아닐 거야……!\""
2601706-30 = "3;라나;06;하플로트로피스 브루네리아나……네?\n#fontsize;50\n#3;em;[?]"
2601706-32 = "3;라나;99;그렇군요, 검색해 주셔서 감사합니다.\n#3;a\n#3;em;[한숨]"
2601706-33 = "3;라나;00;문제를 제대로 풀고 있는지 검사하는 '문항 불성실 정도' 측정용 문제였군요."
2601706-34 = "3;라나;02;제가 아는 걸 알고, 좋아하는 걸 좋아한다고 했을 뿐입니다만……."
2601706-35 = "3;라나;01;그게 이상하고 비정상적인 일이라고 생각해서, 걱정했습니다."
2601706-36 = "[s] \"라나의 소중하고 멋진 개성을 검사지가 놓친 것뿐이란다!\""
2601706-37 = "3;라나;03;'소중하고 멋진 개성', 그렇게 말씀해 주셔서 감사합니다.\n#3;em;[음표]"
2601706-38 = "#st;[0,0];instant;1;"
2601706-40 = "3;라나;01\n#3;em;[...]\n#wait;2500"
2601706-41 = "3;라나;05;……실은, '비정상'이 신경 쓰이고 있었습니다."
2601706-42 = "3;라나;99;할 수 있는 일이라면 해 보고 싶어서, 어쩌다 보니 월반을 여러 번 하게 되었습니다."
2601706-43 = "3;라나;13;저는, 같은 학년과 같은 반의 친구들을 따라 하는 게 자연스럽다고 생각했습니다만."
2601706-44 = "3;라나;14;그게 주위에서 보기엔 '아이 같지 않다' -라고 보였던 모양입니다."
2601706-45 = "3;라나;14;아직은 잘 때 '자장자장'이 필요하기에, 어린아이에 가깝다고 볼 수 있겠습니다만,"
2601706-46 = "3;라나;06;실제로 어떤지를 떠나서, 보이는 모습이 주변을 불편하게 할까 봐 걱정했습니다."
2601706-47 = "[s] \"선생님은 라나가 라나여서 좋단다.\""
2601706-48 = "#st;[0,0];instant;1;"
2601706-51 = "[ns] \"그런 건 전혀 문제없어!\""
2601706-52 = "3;라나;04\n#3;shake\n#wait;1200"
2601706-53 = "3;라나;16\n#3;em;[///]\n#wait;1500"
2601706-54 = "3;라나;99;……그렇군요. 말주변이 부족해서 어떻게 말씀드려야 할지 모르겠습니다만."
2601706-55 = "3;라나;12;기분이, 무척 좋아졌습니다. 좋은 말씀 감사합니다.\n#3;em;[음표]"
2601706-56 = "3;라나;03;때마침 화제와 관련하여 증정해 드리고 싶은 것이 있으니 수령해 주시기를 바랍니다."
2601706-57 = "#st;[0,0];instant;1;"
2601706-59 = "3;라나;03\n#3;greeting\n#wait;1300"
2601706-60 = "3;라나;11;직접 뜨개질로 만든 장갑입니다."
2601706-61 = "[s] \"엄청 잘 만들었구나!\""
2601706-62 = "3;라나;03;선생님의 손, 시리지 않았으면 하는 생각을 했습니다."
2601706-63 = "3;라나;03;이게 있다면, 이곳에 방문하실 때 손이 시리지 않을 겁니다."
2601706-64 = "3;라나;12;자주 착용해 주시고, 소중히 여겨주시면 감사하겠습니다.\n#3;em;[///]"
2601706-66 = "#na;(기특한 라나를 잔뜩 칭찬해 주었다.)"
2601706-67 = "#na;(장갑은 맞춤 제작처럼 손에 꼭 맞았다.)"
