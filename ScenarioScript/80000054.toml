[translation]
80000054-1 = "익숙한 느낌"
80000054-3 = "(마실 걸 사기 위해 잠시 편의점으로 나왔다.)"
80000054-9 = "……어라. 선생님 아니신가요?"
80000054-10 = "[s] \"……스즈미?\""
80000054-11 = "안녕하세요, 선생님. 이런 곳에서 다 뵙는군요. 편의점엔 무슨 일로……?"
80000054-12 = "……네? 저요? 저야, 뭐……. 늘 그렇듯 마실 것도 살 겸, 탄약도 보충할 겸 들렀습니다만……."
80000054-13 = "……아."
80000054-14 = "그러고 보니 오늘은 발렌타인 데이였죠. 어쩐지 편의점 안 인테리어가 좀 바뀌어 있다고 느꼈습니다."
80000054-15 = "음……. 발렌타인 데이……."
80000054-16 = "……."
80000054-17 = "[s1] \"……스즈미?\"\n[s2] \"왜 그래?\""
80000054-18 = "아뇨. 이왕 여기서 만나 뵈었으니, 이것도 그냥 우연으로 넘기기에는 조금 아쉽다는 생각이 들어서요."
80000054-19 = "아뇨. 이왕 여기서 만나 뵈었으니, 이것도 그냥 우연으로 넘기기에는 조금 아쉽다는 생각이 들어서요."
80000054-20 = "저도 선생님께 뭔가 드리고 싶다……. 그런 생각을 하고 있었습니다."
80000054-21 = "무, 물론 제 것이라도 괜찮으시다면의 이야기지만요……."
80000054-22 = "……네? 당연히 좋으시다고요?"
80000054-23 = "……정말 늘 당연하다는 듯이 그렇게 말씀해 주시는군요. 감사합니다."
80000054-24 = "그, 그럼 일단 뭐라도 골라 봐야……."
80000054-33 = "……이, 이걸로 할까요……?"
80000054-35 = "[s3] \"별 모양이다…….\"\n[s4] \"반짝이는 황금색!\""
80000054-36 = "어, 어떠신가요? 역시 좀 이상한가요……?"
80000054-37 = "어, 어떠신가요? 역시 좀 이상한가요……?"
80000054-38 = "……네? 왜 하필 별 모양이냐고요?"
80000054-39 = "그, 글쎄요……. 저도 잘은……. 딱히 큰 이유를 가지고 고른 건 아닙니다만……."
80000054-40 = "……어라. 그러고 보니 정말 왜지……. 왜 난 이런 모양을……."
80000054-41 = "[s5] \"늘 보던 걸 무의식적으로 고른 걸까.\"\n[s6] \"섬광탄 뒤에는 늘 따라오는 모양이니까.\""
80000054-42 = "그, 그건 또 무슨 말씀이신지……."
80000054-43 = "그, 그건 또 무슨 말씀이신지……."
80000054-44 = "여, 역시 바꾸겠습니다. 뭔가 괜한 오해를 불러일으키는 느낌이네요."
80000054-45 = "……네? 그냥 달라고요? 이대로가 좋으시다고요? 어째서……."
80000054-46 = "[s] \"누가 봐도 스즈미가 골라준 거니까.\""
80000054-47 = "선생님……."
80000054-51 = "……네. 감사합니다. 그럼 이걸로……."
80000054-52 = "그나저나 꽤 선생님의 시간을 써버렸네요. 저야 좋지만……. 그래도 슬슬 돌아가시죠."
80000054-56 = "그리고 혹시 괜찮으시다면, 가시는 길……."
80000054-57 = "오랜만에 에스코트……하게 해주시겠어요?"
80000054-60 = "(스즈미의 에스코트를 받으며 무사히 샬레로 돌아갔다.)"
