[translation]
10055080-1 = "제8화;라이프 오브 비스마루"
10055080-10 = "전부 빗나갔습니다!"
10055080-11 = "칫! 조그만 배로 요리조리 잘도 피하는군!"
10055080-12 = "아하하! 그보다 그냥 저희가 못 맞추는 거 같지만요!"
10055080-13 = "빗나가면 맞을 때까지 쏘면 된다! 다시 장전하라!"
10055080-15 = "으응……!"
10055080-16 = "아!"
10055080-21 = "이거를, 이렇게 하면은~"
10055080-25 = "짜안!"
10055080-27 = "아직, 아직이다! 다시 사격한다! 장전!"
10055080-28 = "마코토 선배! 마코토 선배!"
10055080-29 = "아, 아차. 지금은 캡틴이지……!"
10055080-30 = "캡틴 마코토!"
10055080-31 = "응? 무슨 일이지, 이부키?"
10055080-32 = "……오오?! 이건, 설마?! 함포의 탄도 제원표인가?!"
10055080-33 = "응! 이걸로 나쁜 사람들을 혼내주는 거야!"
10055080-34 = "장하다! 이부키! 하지만…… 이런 것을 도대체 어디서?"
10055080-35 = "이부키가 만들었어!"
10055080-36 = "……그 짧은 사이에, 직접 계산했다고……?!"
10055080-37 = "응! 원래 이런 대포에는 강선이 없어서, 이렇게 정확하게 계산할 수 없는데……."
10055080-38 = "신기하게 포각을 조정할 때마다 변하는 거리가 균일했어! 그래서 어떤 각도로 쏘면 맞출 확률이 올라갈지 계산했어!"
10055080-39 = "어때? 이부키, 똑똑해? 장해?"
10055080-41 = "알고는 있었지만, 정말 오싹할 정도의 재능이군……!"
10055080-42 = "잘해주었다! 이부키! 선원들, 모두 주목!"
10055080-43 = "이제 제대로 한 방 먹여줄 때가 됐다! 이 몸의 지시에 따라, 모든 대포의 각도를 재조정한다!"
10055080-47 = "우왓! 저 녀석들, 갑자기 사격이 정밀해졌는데?!"
10055080-48 = "누구 전장식 함포 유효 사거리 아는 사람?"
10055080-49 = "그런 구닥다리 유물을 어떻게 알아!"
10055080-50 = "저쪽 구경이 더 크니까, 사거리 싸움으로 가면 불리한가……?"
10055080-51 = "아니, 아무리 그래도 우리는 현대 병기라고?!"
10055080-52 = "그치만 우리 기관총으로는 유효타가 안 나잖아! 반면 이쪽은 한 발만 맞아도 침몰이라고?!"
10055080-53 = "캡틴! 뭐라도 좀 해봐!"
10055080-58 = "……네? 혹시 저 말인가요?"
10055080-62 = "아뇨, 캡틴이라뇨. 당치도 않아요. 저희는 저마다 다른 역할을 수행하고 있을 뿐."
10055080-71 = "야, 저 자식, 튄다! 잡아!"
10055080-72 = "어디서 혼자 꼬리 빼려고?!"
10055080-79 = "자, 잠깐만요! 잡지 마세요?! 저 캡틴이라고요?! 이거 선상반란이거든요?!"
10055080-84 = "……충각."
10055080-88 = "……네?"
10055080-90 = "우리 무기로는 유효타가 안 나잖아요? 상대의 사거리도 모르고."
10055080-91 = "그러면 가장 큰 포탄을, 지근거리에서 때려 박으면 되잖아요?"
10055080-92 = "……아니, 그게 왜 그렇게 돼요?"
10055080-93 = "아니야! 저 말이 맞을지도 몰라!"
10055080-94 = "예나 지금이나 해전은 충각이 제일이야!"
10055080-95 = "예전은 몰라도, 지금은 아니거든요……."
10055080-96 = "저 혼자 상식인, 그런 상황은 아니죠? 네?"
10055080-97 = "……맞아."
10055080-102 = "<속도 X 질량 = 파워>-!!"
10055080-104 = "기관, 양현전속!"
10055080-105 = "좋아, 가보자고!"
10055080-106 = "……."
10055080-112 = "우와아아아앗?!"
10055080-114 = "들이박았다고요?! 바보들인가요?!"
10055080-115 = "뭣?! 이 몸의 비스마루에 구멍이?!"
10055080-116 = "어느 틈에 이름까지……."
10055080-121 = "캡틴! 저 녀석들, 도선하려 합니다!"
10055080-122 = "배에 난 구멍으로 침입하고 있어요!"
10055080-124 = "이거…… 우리 [ruby=맨 오브 판데모니움]만마선[/ruby]이 어지간히도 얕보인 모양이군."
10055080-125 = "앓!!! 애들아, 손님맞이를 해줘라!!!"
