[translation]
10055080-1 = "ตอนที่ 8;ชีวิตของบิสมารุ"
10055080-9 = ""
10055080-10 = "พลาดเป้าทุกนัดเลยค่ะ!"
10055080-11 = "ชิ! ใช้เรือลำเล็กหลบไปหลบมาได้เก่งนักนะ!"
10055080-12 = "อะฮ่าฮ่า! ฉันว่าพวกเราแค่ยิงไม่โดนมากกว่าละมั้งคะ!"
10055080-13 = "ถ้าพลาดก็ยิงไปจนกว่าจะโดน! บรรจุกระสุนใหม่!"
10055080-14 = ""
10055080-15 = "อืม...!"
10055080-16 = "อ๊ะ!"
10055080-17 = ""
10055080-21 = "ถ้าเอาอันนี้ มาทำแบบนี้~"
10055080-22 = ""
10055080-24 = ""
10055080-25 = "นี่ไง!"
10055080-26 = ""
10055080-27 = "ยัง... ยังไม่จบ! ยิงใหม่! บรรจุกระสุนใหม่!"
10055080-28 = "รุ่นพี่มาโคโตะ! รุ่นพี่มาโคโตะ!"
10055080-29 = "อ๊ะ... ตอนนี้ต้องเรียกว่ากัปตันนี่นา...!"
10055080-30 = "กัปตันมาโคโตะ!"
10055080-31 = "หืม? มีอะไรงั้นเหรอ อิบูกิ?"
10055080-32 = "โอ้โฮ...?! นี่มัน หรือว่านี่คือ?! ตารางวิถีกระสุนของปืนใหญ่เรืองั้นเหรอ?"
10055080-33 = "อื้อ! เอาอันนี้ไปใช้สั่งสอนคนไม่ดีเลย!"
10055080-34 = "เก่งมาก อิบูกิ! ว่าแต่... ไปเอาของแบบนี้มาจากไหนกันน่ะ?"
10055080-35 = "อิบูกิเป็นคนทำเอง!"
10055080-36 = "คำนวณเองในเวลาสั้นๆ เลยรึ...?!"
10055080-37 = "อื้อ! ปกติปืนใหญ่แบบนี้ไม่มีเกลียวในลำกล้อง เลยคำนวณวิถีกระสุนให้แม่นยำขนาดนี้ไม่ได้หรอก..."
10055080-38 = "แต่แปลกจัง พอปรับมุมปืนใหญ่ ระยะยิงก็เปลี่ยนไปเท่ากันทุกครั้ง! อิบูกิเลยคำนวณดูว่าต้องยิงมุมไหน#nถึงจะมีโอกาสยิงโดนมากขึ้นน่ะ!"
10055080-39 = "เป็นไงบ้าง? อิบูกิฉลาดมั้ย? อิบูกิเก่งรึเปล่า?"
10055080-41 = "ถึงจะรู้อยู่แล้วก็เถอะนะ แต่เป็นพรสวรรค์ที่ชวนขนลุกจริงๆ...!"
10055080-42 = "ทำได้ดีมาก อิบูกิ! ลูกเรือทุกคนฟังทางนี้!"
10055080-43 = "ถึงเวลาโต้กลับอย่างเจ็บแสบแล้ว! ปรับมุมปืนใหญ่ทุกกระบอกใหม่ตามคำสั่งของเรา!"
10055080-44 = ""
10055080-45 = ""
10055080-46 = ""
10055080-47 = "ว้ากกก! จู่ๆ เจ้าพวกนั้นก็ยิงแม่นขึ้นมาเฉยเลย?!"
10055080-48 = "มีใครรู้ระยะยิงปืนใหญ่เรือแบบบรรจุทางปากกระบอกบ้างมั้ย?"
10055080-49 = "ใครจะไปรู้เรื่องโบราณคร่ำครึแบบนั้นกันเล่า!"
10055080-50 = "ปืนของอีกฝ่ายลำกล้องใหญ่กว่า ถ้าแข่งกันที่ระยะยิง เราจะเสียเปรียบรึเปล่า...?"
10055080-51 = "ไม่สิ ยังไงปืนของเราก็เป็นอาวุธยุคปัจจุบันนะ?!"
10055080-52 = "แต่ปืนกลของเรายิงไปก็ทำอะไรไม่ได้เลยนี่นา! กลับกัน ถ้าเราโดนกระสุนปืนใหญ่แค่นัดเดียวเรือก็จมได้#nเลยนะ?!"
10055080-53 = "ทำอะไรสักอย่างสิ กัปตัน!"
10055080-54 = ""
