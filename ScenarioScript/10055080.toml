10055080-90 = "อาวุธของเรายิงไปก็ทำอะไรไม่ได้ใช่มั้ยล่ะคะ? แถมยังไม่รู้ระยะยิงของอีกฝ่ายด้วย"
10055080-91 = "ถ้างั้นก็ใช้กระสุนลูกปืนใหญ่ที่มีขนาดใหญ่ที่สุด พุ่งชนกระแทกเข้าไปในระยะประชิดเลยสิคะ?"
10055080-92 = "เดี๋ยวนะ... ทำไมถึงได้สรุปว่าจะใช้วิธีนั้นล่ะ?"
10055080-93 = "เดี๋ยวก่อน! อาจจะเป็นวิธีที่ถูกต้องก็ได้นะ"
10055080-94 = "ไม่ว่ายุคไหน การรบทางเรือก็ต้องพุ่งชนถึงจะดีที่สุด!"
10055080-95 = "สมัยก่อนฉันไม่รู้หรอก แต่คิดว่าสมัยนี้คงไม่น่าจะใช่นะคะ..."
10055080-96 = "คงไม่ใช่ว่ามีแค่ฉันคนเดียวที่มีสามัญสำนึกหรอกใช่มั้ยคะ? ว่าไงคะ?"
