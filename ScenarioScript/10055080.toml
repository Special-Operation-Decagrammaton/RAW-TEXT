10055080-33 = "嗯！要用這個好好教訓壞人哦！"
10055080-34 = "做得好，伊吹！可是……這種東西你是從哪裡弄來的？"
10055080-35 = "是伊吹做的！"
10055080-36 = "在那麼短的時間內，你自己算出來的……！？"
10055080-37 = "嗯！因為這種大砲沒有膛線，本來是沒辦法算得很精準的……"
10055080-38 = "不過神奇的是，每次調整砲角時變化的距離都一樣！#n所以伊吹就計算了用什麼角度發射，命中率會比較高！"
10055080-39 = "怎麼樣？伊吹聰不聰明？厲不厲害？"
10055080-41 = "雖然早就知道，不過這真是令人毛骨悚然的才能啊……！"
10055080-42 = "做得好！伊吹！船員們，全體注意！"
10055080-43 = "終於到了狠狠給他們一擊的時候了！#n依照本大人的指示，重新調整所有大砲的角度！"
