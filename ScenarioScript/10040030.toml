[translation]
10040030-1 = "제3화;그새를 못 참고"
10040030-5 = "어……?"
10040030-6 = "어……! 헉! 허어어어억……!!"
10040030-7 = "[ns1] \"뭐야, 뭐야!? 떴어?\"\n[ns2] \"말만 하지 말고 보여줘!\""
10040030-10 = "대박!! 대박!!! 이거 보세요, 선생님!! 이거!!"
10040030-11 = "와, 효과 진짜 말도 안 되는데요, 이거!! 니하하!! 이런 걸 내다니 게임 망했네, 아주! 니하하하! 아니면 한 철 장사!?"
10040030-12 = "아무튼 역시 선생님을 부르는 게 정답이었네요, 선생님이 계셔서 행운이 찾아온 거라고요!!!"
10040030-13 = "……네? 상관있는 거냐고요? 당연하잖아요!?"
10040030-14 = "저 혼자서라면 절대 안 떴을걸요!? 전부 개똥 카드로 가득했을 게 뻔하죠!"
10040030-15 = "하지만 그렇기에 선생님을 불러서 같이 뜯자고 계획한 저의 혜안……. 후후……."
10040030-16 = "역시 정답이었던 겁니다! 세상에 안 되는 건 없다! 내가 안 되면, 다른 사람 운을 쓴다!"
10040030-17 = "우리는 늘 길을 찾을 것이다!! 니하하하하하!!"
10040030-18 = "[s3] \"코유키한테 나는 행운의 상징인 거야?\"\n[s4] \"그렇게 생각해 주다니 뭔가 기쁘네.\""
10040030-21 = "에이, 당연하죠! 그리고 저는 이런 부분에서 은혜도 제대로 갚을 줄 안다고요!"
10040030-22 = "그리고……. 음……. 역시, 그런 의미에서……."
10040030-26 = "……자, 여기요!"
10040030-27 = "[s5] \"……응? 이걸 나 준다고?\"\n[s6] \"너 쓰려던 거 아니었어?\""
10040030-30 = "뭐, 전혀 아깝지 않다고 말한다면 그건 분명 거짓말이겠지만 말이죠……."
10040030-31 = "그래도 이것보다는 약해도, 다른 카드도 있긴 하니까요. 어차피 선생님이 안 계셨으면 안 떴을 거고……."
10040030-32 = "그러니까 이건 선생님 드릴게요! 대신 다음에 또 팩 뜯을 때 같이 해 주셔야 해요!!"
10040030-33 = "이제부터 그 카드는 저희 두 사람의 끈끈한 동맹……. 즉 결속의 상징인 겁니다!!"
10040030-34 = "[s7] \"코유키……!\"\n[s8] \"생각지도 않은 부분에서 기특함이…….\""
10040030-37 = "니하하하……. 선생님께는 그간 받은 것도 많았으니, 이럴 때라도 점수를 좀 따 둬야……."
10040030-41 = "……응? 알람……?"
10040030-42 = "이 시간에 왜 알람이……."
10040030-43 = "[s9] \"응? ……알람?\"\n[s10] \"무슨 알람이야?\""
10040030-46 = "아, 별 건 아니고요. 그냥 이 세미나 건물에 누가 들어오거나 나갈 때, 저에게 알람이 오도록 설정해 둔 게 있거든요."
10040030-47 = "반성실의 생활자가 되려면, 이 정도의 보안 시스템은 꾸려 놔야 한다고요. 후후."
10040030-48 = "흠. 그렇지만 이상하네요, 이 시간에는 세미나 건물에 올 사람이 없는데 말이죠."
10040030-49 = "대체 누가……. 카메라로 확인해 보죠!"
10040030-50 = "영차."
10040030-54 = "……? 음?"
10040030-55 = "어……? 어, 어어어어……!?!?!?"
10040030-56 = "[ns11] \"……코유키?\"\n[ns12] \"뭐야, 무슨 일이야?\""
10040030-59 = "어, 어째서……. 어째서……."
10040030-60 = "……어째서 선배들이?!!?!"
10040030-61 = "[ns13] \"……!? 선배들?! 유우카랑 노아!?\"\n[ns14] \"돌아간 게 아니었어!?\""
10040030-64 = "이, 이건 전혀 예상 못 했는데!? 뭐, 뭐지!? 어째서!? 무엇 때문에……!?"
10040030-65 = "이, 일단 카드는 빨리 숨겨야……!!"
10040030-66 = "……아니, 아!! 서, 선생님!! 선생님은 어떻게……!!"
10040030-67 = "[s15] \"당연히 안 되지!! 완전 아웃이라고!\"\n[s16] \"애초에 나는 여기에 있으면 안 돼!!\""
10040030-70 = "역시 그렇겠죠……. 결국 선생님이 여기 계시는 시점에서 저희 둘 모두 끝장……."
10040030-71 = "뭔가 변명거릴 생각……할 수가 없네요, 이 상황은. 네, 그건 절대로 무리."
10040030-72 = "남은 방법……. 살아남을 방법은……."
10040030-77 = "……이불장……?"
10040030-78 = "선생님! 장롱! 이불장이에요! 여기 이불장 지금 비어 있으니까!!"
10040030-79 = "우선 안에 숨으시죠! 선배들도 뭐 잠깐 가지러 온 거거나 그럴 수도 있잖아요?"
10040030-80 = "숨어 계시다가 타이밍을 봐서, 선배들 없을 때 탈출하시는 거예요!"
10040030-81 = "그래. 그 방법뿐이야! 일단은 미래를 보시죠!"
10040030-82 = "……예?"
10040030-83 = "괜찮은 거냐고요? 아, 괜찮아요. 괜찮아!!"
10040030-84 = "이 방 주인은 저나 다름없으니까 괜찮아요, 제가 괜찮다면 괜찮은 거예요!!"
10040030-85 = "그러니 시간 끌지 말고 일단 숨으시라고요! 어서! 시간이 없어!!"
10040030-89 = "살고 싶으면 숨으라고!!!"
10040030-100 = "으, 으응!? 이게 누구야……!"
10040030-101 = "서, 선배님들……? 어쩌다 다시 여기로……."
10040030-103 = "……? 뭐야? 그 반응. 왜 갑자기 놀라고 그래?"
10040030-104 = "코유키 쨩이 연말을 혼자 보내느라 외로워하는 것 같다고, 유우카 쨩이 말했었거든요."
10040030-105 = "반성실에서 내보내 주는 건, 그래도 벌이고 약속이니까 안 되겠지만……."
10040030-106 = "대신 저희도 코유키 쨩과 함께 반성실에서 연말을 보내기 위해, 파자마 파티 준비를 해왔답니다."
10040030-107 = "정말이지, 손이 많이 가게 하는 후배라니까."
10040030-108 = "자, 갈아입어. 그 옷으로는 분위기가 안 날 테니까."
10040030-112 = "엑, 뭔가요. 이건."
10040030-116 = "……옷? ……파자마네요?"
10040030-117 = "유우카 쨩이 심혈을 기울여 골라준, 귀여운 파자마예요."
10040030-118 = "노, 노아! 그런 게 아니라고 했잖아!! 이건 그저……!"
10040030-122 = "……응?"
10040030-123 = "뭐야. 표정이 왜 그래? 뭔가 오히려 더 안 좋아진 것 같다?"
10040030-124 = "에, 에에!? 네에-!? 아, 아뇨? 그럴 리가……? 절대로 그런 건……!!"
10040030-125 = "그, 그럼 두 분 모두 여기서 오늘……. 설마 자고 가……는……? 그런 이야기……?"
10040030-126 = "기껏 찾아와 줬더니, 노골적으로 싫다는 얼굴이잖아……. 너."
10040030-128 = "그러게요. 아무리 코유키 쨩이라도, 평소에는 이렇게 오면 좋아해 줬었는데……."
10040030-129 = "……흐응……?"
10040030-133 = "……어라."
10040030-137 = "아하……. 그렇게 되신 거였군요. 후후후."
10040030-138 = "……? 노아……?"
10040030-139 = "……유우카 쨩. 잠시만요."
10040030-144 = "코유키 쨩~? 그 뒤에 숨기고 있는 건 뭔가요-?"
10040030-145 = "……네, 네? 수, 숨기다뇨!? 수, 숨기긴 제가 뭘 숨겼다는 건가요……!!"
10040030-146 = "어머, 그렇게 나오는 거예요? 그 뒤에 있는 박스들……. 순서가 아침때와 다르잖아요?"
10040030-147 = "……예?"
10040030-148 = "아, 아니 어떻게 그런 걸 다 매번 기억하시는……!!"
10040030-153 = "뭐야, 또 뭘 한 거야? 나와, 코유키! 비켜 봐! 아닛, 막지 말고 비켜 보라고……!!"
10040030-154 = "아, 안돼! 제발, 선배! 이것만큼은……!! 아직 한 해가 안 지났다고요!! 이건 내년의 문제라고요! 올해가 아니라!!"
10040030-155 = "무슨 또 알아들을 수 없는 말을……!!"
10040030-162 = "……응? 뭐야, 이건?"
10040030-163 = "웬 카드 더미가……?"
10040030-164 = "그, 그건……. 그러니까, 그……. 그게……."
10040030-166 = "……아하. 그렇게 된 거였군요?"
10040030-167 = "……!!! 이 녀석……!! 그새를 못 참고……!!"
10040030-173 = "코~유~키이이이이~!!!"
10040030-184 = "니히아아아악-!! 악, 악! 아악! 아아악!!"
10040030-188 = "서, 선배! 아, 아!! 안 돼요, 아아! 그 카드는 진짜 비싼……!"
10040030-194 = "아, 선배, 아 제발! 아! 아악! 아아아! 아아아아악!!"
10040030-195 = "이 녀석이……!! 그 와중에도 정신을 못 차리는 거야!?"
10040030-201 = "아, 아아! 아아아아! 아아, 아……!! 아아아악-!!!"
10040030-202 = "크아악!! 긴급 탈출!!"
10040030-209 = "어딜 가는 거야! 거기 서! 코유키!!!"
10040030-213 = "노아, 도와줘!!"
10040030-214 = "이 녀석, 그 와중에 또 파자마는 챙겨 나갔어!!"
10040030-218 = "후후. 한 해의 마지막 날이 이렇게 흘러가는군요."
10040030-219 = "……늘 예상을 빗나가는 게, 정말 즐겁다니까요."
10040030-226 = "[ns] \"……코유키…….\""
10040030-228 = "[ns17] \"……기억할게.\"\n[ns18] 짧게 묵념한다."
10040030-232 = "[ns] \"그나저나 나도 이 틈에 빠져나가야…….\""
10040030-235 = "[ns19] \"……어라? 문이 잠겨 있잖아?\"\n[ns20] \"다른 쪽 문도? 나가는 문이 모두 잠겼어?\""
10040030-241 = "……사정은 대강 이해했습니다."
10040030-242 = "마침 세미나의 임원들이 파자마 파티를 즐긴다기에 동향을 예의주시하고 있었는데…… 설마 거기에 선생님도 함께 계셨을 줄이야."
10040030-246 = "……예상치도 못한 성과에 기분이 고양되는군요."
10040030-247 = "[s21] \"에……? 코타마?!\"\n[s22] \"여기에 있다는 건 어떻게 안 거야?\""
10040030-250 = "그야 당연히 도청…… 아니, 베리타스의 기술력을 십분 활용했습니다."
10040030-251 = "보아하니 반성실의 문이 잠겨 곤란한 상황이신가 보군요."
10040030-252 = "반성실은 문제 학생의 구금을 위해 만들어진 시설인 만큼 내부에서는 열리지 않는 자동 잠금 장치가 설치되어 있습니다."
10040030-253 = "물론 코유키 양은 아무렇지도 않게 해제해 온 모양이지만…… 평범한 사람은 자력으로 그 방에서 탈출할 수 없을 만큼 강합니다."
10040030-254 = "……하지만 걱정하실 필요 없습니다."
10040030-255 = "저희가 학원 밖까지 안전하게 탈출하실 수 있는 최적의 경로로 안내해 드리겠습니다."
10040030-256 = "[s] \"……저희? 누가 또 있는 거야?\""
10040030-257 = "네. 하레가 바로 옆에 있습니다."
10040030-258 = "베리타스의 부부장이 인정한 천재 해커의 도움을 받는다면 밀레니엄의 보안 시스템에 걸리지 않고 은밀하게 탈출하는 것도 가능하겠지요."
10040030-259 = "잠깐, 코타마 선배. 아까도 말했지만 오늘은 더 이상 말썽을 늘리지 않는 편이……"
10040030-261 = "[ns23] \"……또 도청기를 설치해 남의 대화를 엿듣다니.\"\n[ns24] \"코타마, 이번만큼은 그냥 넘어갈 수 없—\""
10040030-264 = "……그러고 보니 샬레의 연말 정산 보고서가 아직 제출되지 않은 모양이군요."
10040030-265 = "저야 상관없지만, 선생님께서 보고서도 작성하지 않은 채 반성실에 놀러 왔다는 사실을 세미나의 회계가 알게 된다면……"
10040030-266 = "연초부터 꽤나 피곤해질지도 모르겠군요."
10040030-270 = "[ns] \"……원하는 게 뭐지?\""
10040030-271 = "선생님의 육성으로 직접 녹음한 모닝콜 대사 10종입니다."
10040030-272 = "대본은 제 쪽에서 준비할 테니, 녹음 및 사용 허가를 부탁드립니다."
10040030-273 = "이 정도 조건이라면 하레도 기꺼이 협력 의사를 보일 겁니다."
10040030-274 = "선생님의 목소리로 아침 인사를 들을 수 있다면…… 확실히 매력적인 제안이긴 한데……"
10040030-276 = "[ns25] \"다른 방법은 없는 건가……\"\n[ns26] \"……훈계는 나간 뒤에 따로 하겠어.\""
10040030-279 = "그럼 협력해 주시는 것으로 이해했습니다."
10040030-280 = "하레, 그럼 바로 반성실의 출입 통제 해제를 부탁드립니다."
10040030-281 = "이래도 정말 괜찮은 걸까……"
10040030-290 = "전자식 도어락 해제 완료."
10040030-291 = "선생님, 잠금장치의 해제는 완료했지만 이동 중에는 주의를 부탁해. 코유키가 도망치면서 추가 보안 시스템이 활성화되었거든."
10040030-292 = "게다가 다른 학생과 마주치기라도 한다면…… 해킹으로 무마할 수는 없으니까."
10040030-293 = "우선은 복도를 따라 저희가 있는 휴게실까지 이동해 주십시오. 누군가가 가까이 온다면 미리 말씀드리겠습니다."
10040030-294 = "선생님의 주변에서 들려오는 소리는 모두 완벽하게 파악하고 있으니까요. 후후……"
10040030-295 = "[s27] \"도대체 도청기를 얼마나 많이 설치한 거야……\"\n[s28] \"정말 돌아가면 따끔하게 한마디 할 거야!\""
10040030-298 = "선생님의 목소리를 직접 들을 수 있다면 나쁜 거래는 아니군요."
10040030-299 = "……어쩌면 모닝콜에 상대를 매도하며 깨우는 대사를 추가하는 것도 나쁘지 않겠네요."
10040030-300 = "선생님, 느긋하게 이야기를 나누고 있을 때가 아니야. 반성실 쪽으로 다른 학생들이 다가오고 있어."
10040030-301 = "어서 서둘러!"
