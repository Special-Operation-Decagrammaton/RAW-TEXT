[translation]
13370-1 = "제37화;말하지 않으면 안 되는 것"
13370-6 = "호시노 선배."
13370-11 = "유메 선배는 마지막에 나에게 무슨 말을 하려고 했던 걸까……."
13370-12 = "수첩엔 뭐라고 적혀있었던 걸까."
13370-13 = "아마 나는 영원히 그걸 알지 못하겠지."
13370-14 = "그걸 알아내기 위해 영원히 고통받겠지."
13370-15 = "이 고통은……"
13370-16 = "이 고통이야 말로……."
13370-17 = "내가 감당해야만 하는 나의 <죄>겠지……?"
13370-18 = "그게 아니잖아요. 선배."
13370-19 = "호시노 선배가 후회하는 건, 그게 아니잖아요!"
13370-20 = "호시노 선배는…… 유메 선배에게 상냥하게 대하고 싶었는데…… 좋아하는 마음을 전하고 싶었는데……."
13370-21 = "마지막에 그러지 못했던 것에 고통스러워하는 거잖아요!"
13370-24 = "그게 마지막일 줄 알았다면……"
13370-25 = "매 순간순간 진심을 말했어야 했는데……."
13370-26 = "네…… 설마 두 번 다시 보지 못하게 될 거라고는…… 상상조차도 못 했으니까."
13370-29 = "그건 사고였어. 선배."
13370-31 = "그런 핑계로 편해질 리가 없잖아."
13370-32 = "선배 탓이 아니야."
13370-34 = "나도 내 탓이 아니라는 걸 알고 있어. 하지만 내 탓이야."
13370-35 = "내가 잘못한 거야."
13370-36 = "호시노 선배가 아니었으면 나는……."
13370-37 = "아마도 혼자서 추위와 두려움에 떨다가 혼자 외롭게 사막에서 죽었을 거야."
13370-38 = "응. 목도리 소중하게 가지고 있어. 호시노 선배."
13370-40 = "……. 그건 시로코 쨩이 곤란에 처해 있었으니까. 유메 선배가…… 나에게……."
13370-41 = "응. 그럼 유메 회장에게도 고맙다는 말을 하고 싶어."
13370-43 = "……."
13370-47 = "우리는 그저 태어나서 고통받고 의미 없이 죽는다. 그것이 진실이겠지."
13370-48 = "죽음에 의미가 있다면……. 정말로 그런 것이라면……."
13370-49 = "유메 선배는 대체 왜 그런 식으로 죽은 거야? 그건 어떤 의미가 있는 거야……?"
13370-50 = "호시노 선배……."
13370-52 = "유메 선배는 길을 잃고 죽었어."
13370-53 = "나침반도, 신호기도, 물도 없었고, 며칠간 별을 확인할 수 있는 날도 아니었어."
13370-54 = "유메 선배의 휴대폰은 낡은 구닥다리 물건이라서, 몇 번이고 새 휴대폰을 사려고 했지만 그때마다 억지로 참아내는 걸 옆에서 지켜만 봤어."
13370-55 = "학교의 빚을 갚아야 하니까."
13370-56 = "만약…… 내가 그때……."
13370-57 = "호시노 선배!"
13370-59 = "……."
13370-60 = "저도…… 잘 몰라요. 그런 건 별로 생각해 본 적도 없고……."
13370-61 = "하지만 그렇게 계속 이유를 찾다 보면…… 결국 그 끝에는……."
13370-63 = "아야네 쨩."
13370-64 = "……. 학교 수돗가를 고쳐준 건 아야네 쨩이었지."
13370-65 = "선배……?"
13370-67 = "고마워. 말하지 않았지만, 늘 그렇게 생각하고 있었어."
13370-68 = "호시노 선배……?"
13370-70 = "……."
13370-71 = "하아…… 미안. 선배. 나는 무슨 말을 해야 할지 잘 모르겠어……."
13370-72 = "……."
13370-73 = "빨리 돌아와!! 바보 선배!! 같이 라면 먹으러 가야지!"
13370-74 = "돌아와 준다면 내가 아야네 쨩이랑 아이돌 할 테니까!!"
13370-76 = "세리카 쨩……."
13370-77 = "세리카 쨩은 역시 귀엽네~"
13370-78 = "……뭐?!"
13370-80 = "………………."
13370-81 = "내버려둬."
13370-82 = "흘러가게 둬 선배. 학생회장을."
13370-84 = "시로코 쨩……?"
13370-85 = "세리카나 아야네처럼 그녀를 모르는 학생들이 이 학원을 가득 채우고,"
13370-86 = "그녀와 함께했던 기억들로 가득한 이 교실에 그녀를 모르는 아이들의 웃음이 가득 차게 되는 것을 내버려둬. 선배."
13370-87 = "그 대신."
13370-88 = "그녀의 비참한 죽음만이 아니라, 그녀와 함께했던 모든 시간을 기억해 줘."
13370-89 = "그녀의 죽음은 이렇게 풍문처럼 떠돌겠지만, 그녀가 어떤 사람이었는지는…… 선배만이 기억할 수 있잖아."
13370-90 = "그 수첩을…… 놓아줘."
13370-97 = "고마워. 또 다른 시로코 쨩."
13370-98 = "나는 너를 모르지만, 사실은 잘 알고 있어."
13370-99 = "시로코 쨩이 나처럼 되지 않기를 바라잖아."
13370-100 = "고마워. 시로코 쨩. 역시 너는 시로코 쨩이구나."
13370-101 = "하지만……"
13370-102 = "너도 아직 가지고 있잖아."
13370-103 = "……!!"
13370-107 = "세리카, 노노미, 아야네, 그리고 내가 죽은 뒤에 남긴 무기들을."
13370-108 = "하나도 버리지 못하고 가지고 있으면서."
13370-109 = "나는……."
13370-111 = "그걸 흘러가게 두는 게 가능할까……? 시로코 쨩……?"
13370-112 = "우리는…… 그게 가능할까……? 시간이 흐르거나, 기억이 잊혀지다면…… 그럴 수 있을까……?"
13370-113 = "……."
13370-114 = "…………………………………………."
13370-115 = "잘…… 모르겠어…… 선배……."
13370-116 = "그게 가능할지…… 나도 몰라……."
13370-117 = "사람은……"
13370-118 = "<죄>에서, <슬픔>에서…… <고통>에서…… 벗어날 수 있는 거야……?"
13370-119 = "그건……. 죽은 사람이 되살아나는 것만큼 어려운 것 같아……."
13370-120 = "……."
13370-125 = "끝났다---!!!!"
13370-126 = "마침내 <세트의 분노>의 현현이 완료되었다!!"
13370-127 = "오오오-! 보아라, 세트여, 그 뇌격의 분노여……!!"
13370-128 = "지상의 모든 것들을 불태워다오-!!"
13370-132 = "선생님!! <세트의 분노>가……!!"
13370-133 = "조, 조심하세요! 뭔가 와요!! 거대한…… 거대한 에너지가……."
13370-137 = "나는……."
13370-138 = "나는…………………."
13370-139 = "무리야."
13370-143 = "선배의 죽음이 남긴 것."
13370-144 = "그게 무엇인지, 어떤 의미인지, 그것을 확인하지 않고는……."
13370-148 = "나는……."
13370-156 = "피하세요, 선생님!!"
13370-157 = "지, 지금 저로서는 저 공격을 막는 건 불가능해요!!"
13370-158 = "거기 함께 있는 학생들 모두가……!!"
13370-159 = "아, 으아아아아아-?!"
13370-163 = "[ns] \"호시노. 그 수첩에 유메가 어떤 글을 남겼다고 생각해?\""
13370-164 = "……. 나는 그걸 알기 위해서……."
13370-165 = "[s] \"그건 영원히 알지 못해.\""
13370-166 = "……."
13370-167 = "[s] \"하지만 영원히 알지 못한다고 해도, 네가 믿고 싶은 게 있잖아.\""
13370-168 = "……. 유메 선배라면, 거기에 뭘 적었을까."
13370-169 = "[s] \"유메를 가장 잘 알고 있는 게 바로 너니까.\""
13370-170 = "……."
13370-171 = "[ns1] \"네가 거기에 유메가 적어두었으면 좋겠다고 생각하는 거.\"\n[ns2] \"그렇게 네가 믿고 싶은 거.\""
13370-174 = "[ns3] \"진짜 사실은 아닐지도 몰라도,\"\n[ns4] \"하지만 진실인 거.\""
13370-177 = "[ns] \"아무리 존재하지 않는다고 해도, 그게 진실이라는 것은 변하지 않아.\""
13370-179 = "[ns] \"그걸 믿고 나아가는 것 정도만이, 우리가 할 수 있는 유일한 선택이야.\""
13370-181 = "[ns5] \"그것이야말로…… 평범한 우리들의…….\"\n[ns6] \"죽은 자를 되살리거나, 시간을 되돌리지도 못하는 우리들의…….\""
13370-184 = "[ns7] \"유일한 기적이야.\"\n[ns8] 유일한 기적이야."
13370-192 = "……."
13370-193 = "여긴……."
13370-194 = "……응?"
13370-199 = "……수첩?"
13370-200 = "아, 아아……?"
13370-204 = "아아아아……?!? 이게 어째서……? 여, 여기에……."
13370-208 = "잘 지냈어, 호시노 쨩?"
13370-217 = "헤헤헤, 2년 뒤의 호시노 쨩은 어떤 모습일까 늘 궁금했는데……."
13370-222 = "다음화;약속"
