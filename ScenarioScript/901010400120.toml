[translation]
901010400120-6 = "FOX 2, 무슨 문제라도 있어?"
901010400120-7 = "아까 전부터 계속 말을 걸지 못하고 주변을 배회하는 것처럼 보이는데."
901010400120-8 = "그게…… 어쩐지 어부 분들의 태도가 쌀쌀맞아서."
901010400120-9 = "말을 걸어도 답하지 않고 자꾸 자리를 피해버리네."
901010400120-10 = "설마, 우리를 의심하고 있는 거 아냐?"
901010400120-11 = "그럴리가. 대놓고 탐문을 하는 것도 아닌데, 외지인을 피할 이유가 있어?"
901010400120-12 = "아니면 내향적인 성격의 사람인가 보지."
901010400120-13 = "하지만 어쩌지? 처음부터 대화가 통하지 않는다니……"
901010400120-14 = "붙잡아다 억지로 심문할 수도 없는 노릇이고."
901010400120-16 = "걱정 마. 이럴 때를 위해 준비한 <FOX EATS>니까."
