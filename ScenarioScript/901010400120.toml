[translation]
901010400120-6 = "FOX 2 มีปัญหาอะไรงั้นเหรอ?"
901010400120-7 = "เหมือนเธอเอาแต่เดินวนอยู่แถวนั้น ไม่เห็นเข้าไปพูดกับใครเลยนะ"
901010400120-8 = "คือว่า... ฉันก็ไม่รู้ว่าทำไม แต่พวกชาวประมงดูเย็นชากันมากเลย"
901010400120-9 = "พอเข้าไปคุยก็ไม่ยอมตอบ แล้วก็เดินหนีตลอดเลย"
901010400120-10 = "หรือว่ากำลังสงสัยพวกเราอยู่?"
901010400120-11 = "ไม่น่าจะเป็นไปได้นะ พวกเราไม่ได้ประกาศตัวว่ามาสืบคดีสักหน่อย จะมีเหตุผลอะไรที่ต้องหลบคนต่างถิ่นด้วยล่ะ?"
901010400120-12 = "ไม่งั้นก็คงเป็นคนขี้อายละมั้ง"
901010400120-13 = "แต่จะเอายังไงดีล่ะ? ถ้าเริ่มต้นก็คุยกันไม่รู้เรื่องแบบนี้..."
901010400120-14 = "จะไปบังคับสอบปากคำ เพียงเพราะพวกเขาไม่เป็นมิตรก็ไม่ได้ด้วย"
901010400120-16 = "ไม่ต้องห่วงหรอก นี่แหละเหตุผลที่ฉันเตรียม <FOX EATS> เอาไว้"
