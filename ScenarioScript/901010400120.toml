[translation]
901010400120-6 = "FOX2，你那邊有什麼問題嗎？"
901010400120-7 = "看起來從剛才開始就一直搭不上話，只是在周圍晃來晃去的。"
901010400120-8 = "那個……不知道為什麼，漁夫們的態度很冷淡。"
901010400120-9 = "就算主動搭話也不回應，甚至一直躲避。"
901010400120-10 = "難不成是在懷疑我們？"
901010400120-11 = "怎麼可能。我們又不是明目張膽地在蒐集情報，會有什麼要避開外人的理由嗎？"
901010400120-12 = "不然就是個性內向吧。"
901010400120-13 = "不過該怎麼辦？沒想到從一開始就無法溝通……"
901010400120-14 = "總不能把人抓來強行審問吧。"
901010400120-16 = "別擔心，「FOX EATS」就是為了這種時候準備的呀。"
