[translation]
10033065-2 = "아야야야야……!"
10033065-3 = "해치웠나?!"
10033065-4 = "[ns] \"그 대사는 여러 가지로 조금!\""
10033065-5 = "……뭐, 마코토 선배의 대사 탓은 아닌 것 같긴 합니다만."
10033065-6 = "아직 멀쩡하네요."
10033065-7 = "……이렇게 된 이상, 백귀야행과의 정치적 마찰을 감수하고서라도, 좀 더 강경한 수단을 동원……!"
10033065-8 = "우왓! 이로하 쨩! 과격해! 진짜루 괜찮아?! 그거?!"
10033065-9 = "이, 일단, 만마전 분들은 이 자리를 피해 주세요! 피나, 부탁할게요!"
10033065-10 = "우미카는 어쩔 생각입니까?!"
10033065-11 = "저는……!"
10033065-15 = "오, 저건 뭐야? 뭔가 엄청난 게 있는데?"
10033065-16 = "여기에서 또 다른 분이?!"
10033065-20 = "어……? 일단 시간이 돼서 인솔해 오긴 했는데……? 저건 뭐야?!"
10033065-22 = "으음, 키라라. 아무래도."
10033065-23 = "응, 또 소동인가 보네~ 그럼……."
10033065-28 = "꺄아~ 생긴 게 엄청 기분 나빠~!"
10033065-32 = "그러게, 평범한 유령이 아닌가 본데."
10033065-34 = "어? 뭐야뭐야. 유령? 괴물? 아니…… 여긴 백귀야행이니까, 요괴, 인가?"
10033065-35 = "잘 모르겠으니까, 일단 쏘고 보자."
10033065-40 = "야, 잠깐 그거 좀 꺼내 봐. 그거."
10033065-41 = "너도 그 생각 했구나? 그럼 쏜다?"
10033065-45 = "앗, 따가. 앗 따가! 뭐야, 저 게헨나 녀석들! 이게 무섭지도 않나?!"
10033065-47 = "오, 효과가 있는 것 같은데? 움찔거리고 있어!"
10033065-49 = "아니야. 이 정도는 아닐 거야. 그래야만 해!"
10033065-50 = "그래! 아직 가져온 탄약의 반도 안 썼는데!"
10033065-52 = "요괴가 활보하고, 기물을 옮기며, 사람을 홀리니, 화포로 이를 물리치소서! 와하하하!"
10033065-53 = "잔치다! 파티다! 축제다!"
10033065-58 = "축제?!"
10033065-59 = "………축제?"
10033065-60 = "[s] \"아, 응…… 이부키! 축제야! 그러니 무서워할 필요 없어!\""
10033065-61 = "!!"
10033065-62 = "과연…… 네, 이부키. 축제네요!"
10033065-63 = "그, 그렇군! 축제인가……!"
10033065-64 = "응, 축제라면 어쩔 수 없지……! 내 최면술이 통하지 않는 것도!"
10033065-65 = "이부키 쨩! 축제는 즐기지 않으면 손해니까 말이야~!"
10033065-70 = "이…… 이 말도 안 통하는 녀석들 같으니……!"
10033065-71 = "일단 후퇴다!"
10033065-75 = "아, 뭔지 모를 것이 도망간다! 거기 서! 우린 아직 충분히 쏘지 못했어!"
10033065-77 = "도망가지 마, 비겁한 녀석! 맞서 싸우라고!"
10033065-78 = "그냥 우리가 쫓아갈까?"
10033065-83 = "자아, 길은 이쪽이야. 계속 안내할게."
10033065-84 = "에이, 더 놀고 싶었는데."
10033065-88 = "여러 가지로 감사했습니다. 게헨나 학원 여러분. 덕분에…… 무사히, 일정을 계속할 수 있게 되었어요."
10033065-89 = "하하! 잘 알아봤다! 이것이 바로 우리 게헨나의 저력……! 아니, 나아가 이 마코토님의 저력이나 다름없지!"
10033065-90 = "……뭐, 어쩌다 보니 잘 풀렸다. 라고 생각하지만요."
10033065-91 = "응! 재밌었어~!"
10033065-92 = "이제 와서…… 라는 느낌도 없지 않아 있습니다만, 남은 담력 시험도 부디 마지막까지 즐겨 주셨으면 하네요. 아하, 하……."
10033065-94 = "아, 그럼 우리 사진 찍어도 돼? 나 유령이랑 사진 찍고 싶은데!"
10033065-95 = "아니……. 그러려면 일단 유령이 나와야 하지 않을까?"
10033065-100 = "아하하하. 딱 좋은 때에 나와 줬네!"
10033065-101 = "……하아. 뭐, 어쩔 수 없겠네."
10033065-102 = "자, 그럼 유령 쨩도! 하나, 둘, 셋!"
10033065-109 = "(…….)"
10033065-110 = "(어떻게든, 하루 스케줄이 거의 끝나긴 했지만…….)"
10033065-111 = "(……엉망이네. 정말로.)"
10033065-112 = "(나 과연…… 앞으로, 잘 할 수 있을까……?)"
