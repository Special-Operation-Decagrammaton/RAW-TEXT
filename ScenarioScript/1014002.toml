[translation]
1014002-1 = "警戒的狐狸"
1014002-2 = "夏萊辦公室"
1014002-3 = "（胡桃為了幫忙值日工作，造訪了夏萊辦公室）"
1014002-4 = "[ns1] 「歡迎你，胡桃！」\n[ns2] 「我等你很久了！」"
1014002-7 = "早安啊，老師。"
1014002-8 = "那麼……今天要從什麼開始呢？"
1014002-9 = "[s] 「有一款新出的雙人射擊遊戲，要不要一起玩？」"
1014002-10 = "……什麼？"
1014002-11 = "你在說什麼啊？#n昨天不是還在抱怨事情太多做不完嗎？"
1014002-12 = "別想著偷懶，快工作！"
1014002-13 = "報告之類的我會幫你一起做的。"
1014002-14 = "[s] 「太過分了吧～」"
1014002-15 = "過分的是老師你的幹勁吧！"
1014002-17 = "（就這樣和胡桃愉快地處理著夏萊的業務……）"
1014002-18 = ""
1014002-23 = "[USERNAME]老師，您在嗎？"
1014002-24 = "[s] 「不好意思，請問您是……？」"
1014002-25 = "啊，我是車站前那家便利商店的店長，上次承蒙了老師的幫忙。"
1014002-26 = "當時我以打工名義雇用的不良學生占據了便利商店，還擅自把麵包和零食吃光……#n損失真的不是普通的大。"
1014002-27 = "不過就在那時，多虧夏萊的老師出手相助，幫了我一個大忙。"
1014002-28 = "[s] 「有過那樣的事嗎……？」"
1014002-29 = "是的。那時老師說服了不良學生把他們趕走，還幫忙整理了店面呢。"
1014002-30 = "夏萊的老師解決了那麼多事情，會不記得也是難免的……"
1014002-31 = ""
1014002-33 = ""
1014002-34 = "……"
1014002-35 = ""
1014002-36 = "雖然只是一點小心意，但這是我為了答謝而帶來的點心，希望您能收下。"
1014002-37 = "[s3] 「謝謝您。我就不客氣了。」\n[s4] 「沒關係。您的好意我心領了。」"
1014002-39 = "不會的。您要是拒絕，反倒讓我更不好意思了呢。"
1014002-40 = "[s5] 「可是……」"
1014002-41 = "您要是這樣一直拒絕，就連佛祖也會生氣的哦？"
1014002-42 = "[s6] 「那麼我就恭敬不如從命了。」"
1014002-43 = "呵呵，能稍微報答老師一點恩情，真是太好了。"
1014002-44 = "下次我會帶別的禮物來拜訪的。"
1014002-45 = "那麼我就先告辭了！"
1014002-46 = ""
1014002-48 = ""
1014002-49 = "……"
1014002-50 = "老師，那是你認識的人嗎？"
1014002-51 = "[s7] 「這個嘛……畢竟我牽扯到各式各樣的事情。」\n[s8] 「雖然我不記得了，但看來是以前幫助過的市民吧。」"
1014002-54 = "什麼？你讓一個根本不熟的人進到夏萊？"
1014002-55 = "萬一是衝著老師來的壞人怎麼辦！？"
1014002-56 = "[s] 「哎呀，不至於吧。」"
1014002-57 = ""
1014002-60 = "[ns] 「而且有胡桃在旁邊，還能出什麼事嗎？」"
1014002-61 = "當然換作是我，可以在襲擊者拔出武器之前就把他制伏──"
1014002-62 = "不對，就算這樣，你的危機意識也太鬆散了吧？"
1014002-63 = "我不在的時候你打算怎麼辦……？"
1014002-64 = "[s9] 「胡桃，你看這個。剛才沒注意到……」\n[s10] 「包裝還挺精緻的，看起來相當好吃呢。」"
1014002-67 = "確實看起來像是很貴的點心呢。"
1014002-68 = "不過如果不是工業製品，而是手工製作的話──"
1014002-69 = "[s] 「我就不客氣啦～」"
1014002-70 = "等等！"
1014002-71 = "老師，這麼輕易地把來路不明的點心放進嘴裡真的好嗎？"
1014002-72 = "[s] 「……不行嗎？」"
1014002-73 = "當然不行！老師可是整個奇普托斯最重要的VVIP耶？"
1014002-74 = "萬一對方居心不良，做出什麼壞事該怎麼辦？"
1014002-75 = "在黑社會的利益爭奪中，為了讓談判對自己有利，#n也是會讓對方老大吃下摻了自白劑的巧克力，或是投毒的哦。"
1014002-76 = "誰敢說這種事不會發生在[USERNAME]老師身上呢？"
1014002-77 = "你要更有危機意識一點，凡事都要提高警覺。"
1014002-78 = "雖然不會要求你達到特殊部隊隊員的水準，#n但老師你有必要對自己的處境更有自覺一點。"
1014002-79 = "[s11] 「這話也有道理，不過……」\n[s12] 「太過死板的話，會很難獲得學生們的信賴。」"
1014002-82 = "不行。#n我可是接到聯邦學生會長的命令，要徹底保護老師你的人身安全。"
1014002-83 = "這項任務沒有例外。#n因為大多數的事故，都是因為例外而發生的。"
1014002-84 = ""
1014002-88 = "[ns] 「……那麼，胡桃可以幫我一下嗎？」"
1014002-89 = "我，我嗎？怎麼幫？"
1014002-90 = "[s13] 「讓胡桃先吃吃看收到的點心。」\n[s14] 「如果胡桃沒事，那我吃應該也很安全吧？」"
1014002-93 = "試毒嗎……這方法是不錯啦。"
1014002-94 = "不過只要試毒的話也不用我來，讓其他小隊成員來也──"
1014002-95 = "[s15] 「拜託你幫我，胡桃！」\n[s16] 「因為我可不能把自身的安全託付給其他人啊！」"
1014002-98 = "哼，真，真拿你沒辦法呢。#n既然老師都這麼說了。"
1014002-99 = "那麼，我就先試吃看看吧。"
1014002-100 = ""
1014002-102 = ""
1014002-103 = "[ns] 「……怎麼樣？」"
1014002-104 = "……很好吃。"
1014002-105 = "不知道是不是加了很多高級奶油，在口中滑順地化開了……真的是很好吃的餅乾呢。"
1014002-106 = "啊，裡面沒有毒！這個餅乾吃了也沒問題。"
1014002-107 = "[s] 「太好了……沒有問題。」"
1014002-108 = ""
1014002-111 = "[ns17] 「正好我這裡有一堆讓人在意的禮物……」\n[ns18] 「胡桃可以先幫我確認看看嗎？」"
1014002-114 = "讓，讓人在意的禮物……？"
1014002-115 = "當然沒問題！我可是老師的護衛，儘管放馬過來！"
1014002-117 = "（之後帶著胡桃在夏萊各處參觀，並一件一件地把禮物拿出來）"
1014002-119 = "這是茶葉……？"
1014002-120 = "確實，在茶葉裡摻毒是歷史悠久的暗殺手法，可不能掉以輕心。"
1014002-121 = "我看看……"
1014002-122 = ""
1014002-124 = ""
1014002-125 = "沒問題，這個茶葉可以放心使用。"
1014002-126 = ""
1014002-128 = "這，這不是連在三一都很難入手的「Miracle5000」蛋糕嗎！？#n你是怎麼弄到手的？"
1014002-129 = "啊，得先試吃才行。"
1014002-130 = ""
1014002-132 = ""
1014002-133 = ""
1014002-134 = "哇……這麼高級的味道我還是第一次嚐到。"
1014002-135 = ""
1014002-137 = ""
1014002-138 = "沒，沒問題！這個也沒有毒。"
1014002-140 = "什麼？連香水也要我試聞看看有沒有毒？"
1014002-141 = "我，我知道了……也不是沒有那種可能性。"
1014002-142 = ""
1014002-144 = ""
1014002-145 = "嗯，味道真好……淡淡的樺木香氣，感覺讓人放鬆了繃緊的神經……"
1014002-146 = "這個也沒問題。#n不過老師，這真的是在試毒──"
1014002-147 = "[s] 「接下來是這邊！」"
1014002-152 = "夏萊值班室"
1014002-153 = ""
1014002-154 = ""
1014002-155 = "這，這裡不是寢室嗎？"
1014002-156 = "老，老師？你到底在打什麼主意，為什麼把我帶到這種地方來！？"
1014002-157 = "[s19] 「上次我買了新枕頭。」\n[s20] 「胡桃可以親自躺躺看，確認有沒有毒嗎？」"
1014002-160 = ""
1014002-162 = ""
1014002-163 = "……我被騙了。"
1014002-164 = "一直試吃試用一堆有的沒的，都沒有察覺到……"
1014002-165 = "其實你是藉著試毒的名義，一直在偷懶不做事吧！"
1014002-166 = "[s] 「哎呀，被發現了。」"
1014002-167 = "什麼被發現啦！？快點回去工作！"
1014002-169 = "（在那之後，和有點生氣的胡桃愉快地處理完了夏萊剩下的業務）"
