[translation]
1014002-1 = "경계하는 여우"
1014002-2 = "샬레 집무실"
1014002-3 = "(쿠루미가 당번 활동을 돕기 위해 샬레 집무실을 방문했다.)"
1014002-4 = "[ns1] \"어서 와, 쿠루미!\"\n[ns2] \"기다리고 있었어!\""
1014002-7 = "좋은 아침이야, 선생님."
1014002-8 = "그래서…… 오늘은 무엇부터 시작하면 되는 거야?"
1014002-9 = "[s] \"새로 나온 2인용 슈팅 게임이 있는데, 같이 하지 않을래?\""
1014002-10 = "……뭐?"
1014002-11 = "그게 무슨 소리야. 어제도 일이 너무 많아서 안 끝난다며 하소연 했었으면서."
1014002-12 = "게으름 부릴 생각 말고, 일해!"
1014002-13 = "보고서 작성 정도는 같이 도와줄 테니까."
1014002-14 = "[s] \"너무해~\""
1014002-15 = "너무한 건 선생님의 의욕이겠지!"
1014002-17 = "(그렇게 쿠루미와 즐겁게 샬레의 업무를 처리해 나가던 중……)"
1014002-23 = "[USERNAME] 선생님, 계십니까?"
1014002-24 = "[s] \"실례지만 누구신지요……?\""
1014002-25 = "아, 저는 지난번에 선생님께서 도와주신 역 앞에 있는 편의점의 사장입니다."
1014002-26 = "당시에 아르바이트로 고용한 불량 학생들이 편의점을 점거하고 빵과 과자를 멋대로 먹어치워서…… 손해가 이만저만이 아니었지요."
1014002-27 = "그런데 그 때, 샬레의 선생님께서 도와 주셔서 큰 도움을 받았었습니다."
1014002-28 = "[s] \"그런 적이 있었던가요……?\""
1014002-29 = "네. 그 때 선생님께서 불량 학생들을 설득해서 쫓아주시고 가게 정리까지 도와주셨는 걸요."
1014002-30 = "워낙 많은 일을 해결하고 계시는 샬레의 선생님이시니 기억하지 못할 법도 합니다만……"
1014002-34 = "……."
1014002-36 = "조촐한 것입니다만, 답례의 의미로 가져온 과자이니 받아주셨으면 합니다."
1014002-37 = "[s3] \"감사합니다. 잘 먹겠습니다.\"\n[s4] \"아닙니다. 괘념치 마시지요.\""
1014002-39 = "아닙니다. 오히려 거절하시면 제가 더 부끄러워지는 걸요."
1014002-40 = "[s5] \"하지만……\""
1014002-41 = "이렇게 계속 거절하시면 부처님이라도 노할 겁니다?"
1014002-42 = "[s6] \"그럼, 감사히 받겠습니다.\""
1014002-43 = "후후, 선생님께 조금이나마 은혜를 갚을 수 있어서 다행이군요."
1014002-44 = "다음 번에는 다른 선물을 들고 찾아뵙겠습니다."
1014002-45 = "그럼 저는 이만!"
1014002-49 = "………."
1014002-50 = "선생님, 아는 사람이야?"
1014002-51 = "[s7] \"글쎄. 워낙 이런저런 일에 많이 엮여서.\"\n[s8] \"기억은 나지 않지만, 전에 도운 시민 분인가 봐.\""
1014002-54 = "뭐? 잘 알지도 못하는 사람을 샬레에 들인 거야?"
1014002-55 = "선생님을 노리고 온 나쁜 사람이었으면 어쩌려고!"
1014002-56 = "[s] \"에이, 설마.\""
1014002-60 = "[ns] \"그리고 옆에 쿠루미가 있는데, 별 일이야 있겠어?\""
1014002-61 = "물론 나라면 습격범이 무기를 꺼내기도 전에 제압할 수 있지만—"
1014002-62 = "아니, 그래도 너무 보안 의식이 무른 거 아냐?"
1014002-63 = "내가 없을 때는 어떻게 하려고……?"
1014002-64 = "[s9] \"쿠루미, 이것 봐. 아까는 몰랐는데—\"\n[s10] \"포장이 고급스러운 게 꽤나 맛있어 보여.\""
1014002-67 = "확실히 비싼 과자처럼 보이네."
1014002-68 = "하지만 공산품이 아닌, 수제로 만든 거라면—"
1014002-69 = "[s] \"잘 먹겠습니다~\""
1014002-70 = "잠깐!"
1014002-71 = "선생님, 누군지도 모르는 상대가 준 과자를 그렇게 쉽게 입에 넣어도 되는 거야?"
1014002-72 = "[s] \"……안 되는 거야?\""
1014002-73 = "당연하지! 선생님은 이 키보토스에서도 제일 중요한 VVIP 잖아?"
1014002-74 = "상대가 나쁜 마음을 먹고 해코지라도 하면 어쩌려고 그래?"
1014002-75 = "뒷세계의 이권 다툼에서는 협상을 유리하게 이끌기 위해 상대 보스에게 자백제가 든 초콜릿을 먹이거나, 독을 먹이는 일도 있다고."
1014002-76 = "그런 일이 [USERNAME] 선생님에게 일어나지 않으란 법도 없잖아?"
1014002-77 = "좀 더 위기 의식을 갖고 매사를 경계하라고."
1014002-78 = "특수부대원의 수준까지 요구하진 않겠지만, 선생님은 스스로의 위치에 대해 좀 더 자각할 필요가 있어."
1014002-79 = "[s11] \"그 말도 일리가 있지만……\"\n[s12] \"너무 뻣뻣하게 굴면 학생들의 신뢰를 얻기 어려운 걸.\""
1014002-82 = "안 돼. 나는 총학생회장으로부터 선생님의 신변을 철저히 보호하라는 명령을 받았으니까."
1014002-83 = "그 임무에 예외는 없어. 대부분의 사고는 예외를 틈타 발생하는 법이니까."
1014002-88 = "[ns] \"……그럼 쿠루미가 좀 도와줄래?\""
1014002-89 = "내, 내가? 어떻게?"
1014002-90 = "[s13] \"선물 받은 과자를 쿠루미가 먼저 먹어보는 거야.\"\n[s14] \"쿠루미에게 문제가 없다면, 내가 먹어도 안전한 거겠지?\""
1014002-93 = "독 시식인가…… 뭐 나쁘진 않은 방법이지만."
1014002-94 = "하지만 과자를 맛 보는 거라면 나 말고 다른 소대원이 해도—"
1014002-95 = "[s15] \"제발 도와줘, 쿠루미!\"\n[s16] \"내 안전을 다른 사람에게 부탁할 수는 없으니까!\""
1014002-98 = "흥. 여, 역시 어쩔 수 없네. 선생님이 그렇게 말한다면."
1014002-99 = "그럼 기미 삼아서 한 번 내가 먼저 먹어볼게."
1014002-103 = "[ns] \"……어때?\""
1014002-104 = "……맛있어."
1014002-105 = "고급 버터를 잔뜩 넣었는지 입 안에서 부드럽게 녹는 게, 진짜 맛있는 쿠키네."
1014002-106 = "아, 독은 없었어! 이 쿠키라면 먹어도 괜찮을 것 같아."
1014002-107 = "[s] \"다행이다…… 문제가 없어서.\""
1014002-111 = "[ns17] \"안 그래도 신경 쓰이는 선물이 잔뜩 있었는데—\"\n[ns18] \"쿠루미가 먼저 한 번 써 봐 줄래?\""
1014002-114 = "시, 신경 쓰이는 선물……?"
1014002-115 = "당연히 괜찮지! 나는 선생님의 호위니까. 뭐든 시험해 보라고!"
1014002-117 = "(그 후, 쿠루미를 데리고 샬레 곳곳을 안내하며 선물을 조금씩 내어주었다.)"
1014002-119 = "이건 찻잎……?"
1014002-120 = "뭐, 찻잎에 독을 섞는 건 유서 깊은 암살 방식이니까. 간과할 수는 없겠지."
1014002-121 = "어디……"
1014002-125 = "문제 없어. 이 차는 안심하고 마셔도 괜찮겠어."
1014002-128 = "이, 이건 트리니티에서도 구하기 어렵다는 <미라클 5000> 케이크?! 이걸 어떻게 구한 거야?"
1014002-129 = "아, 시식부터 먼저 해야지."
1014002-134 = "우와…… 이런 고급스러운 맛은 처음 먹어봐."
1014002-138 = "무, 문제 없어! 여기에 독은 없는 것 같아."
1014002-140 = "뭐? 향수에도 독이 없는 지 시향을 해달라고?"
1014002-141 = "그, 그럴 가능성도 없진 않으니…… 알았어."
1014002-145 = "음, 냄새 좋다…… 잔잔한 자작나무 향이 긴장을 풀어주는 것 같아……"
1014002-146 = "이쪽도 문제 없어. #n그런데 선생님, 이거 정말로 독을 시험하는 게 맞—"
1014002-147 = "[s] \"이번에는 이쪽이야!\""
1014002-152 = "샬레 숙직실"
1014002-155 = "여, 여기는 침실이잖아?"
1014002-156 = "서, 선생님? 도대체 무슨 생각으로 나를 여기에 데려온거야?!"
1014002-157 = "[s19] \"이번에 베개를 새로 구입했거든.\"\n[s20] \"쿠루미가 직접 누워서 독이 없는지 확인해 줄래?\""
1014002-163 = "……속았어."
1014002-164 = "이것저것 계속 맛보느라 눈치채지 못하고 있었는데……"
1014002-165 = "사실은 독 시식을 핑계로, 계속 업무를 땡땡이 치고 있었잖아!"
1014002-166 = "[s] \"이런, 들켰네.\""
1014002-167 = "들키긴 뭐가 들켜? 당장 업무로 돌아가!"
1014002-169 = "(이후, 살짝 화가 난 쿠루미와 남은 샬레의 업무를 즐겁게 처리했다.)"
