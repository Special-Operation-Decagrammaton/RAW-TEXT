1014002-48 = ""
1014002-49 = "..."
1014002-50 = "คุณครู นั่นคนรู้จักเหรอ?"
1014002-51 = "[s7] \"ไม่รู้สิ พอดีครูไปเกี่ยวพันกับเรื่องนู่นนี่มาเยอะเลย\"\n[s8] \"ครูก็จำไม่ได้นะ แต่น่าจะเป็นชาวเมืองที่เคยช่วยไว้น่ะ\""
1014002-54 = "ว่าไงนะ? ปล่อยให้คนที่ไม่รู้จักดีเข้ามาในชาเล่ต์เลยเหรอ?"
1014002-55 = "ถ้าเป็นคนไม่ดีที่จ้องทำร้ายคุณครูล่ะจะทำยังไง!"
