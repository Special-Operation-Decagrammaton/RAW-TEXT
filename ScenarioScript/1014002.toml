[translation]
1014002-1 = "A Wary Fox"
1014002-2 = "Schale Executive Office"
1014002-3 = "Kurumi came to visit the Schale Executive Office for her Student Rep shift."
1014002-4 = "[ns1] \"Welcome, Kurumi!\"\n[ns2] \"I've been waiting for you!\""
1014002-7 = "Good morning, Sensei."
1014002-8 = "So... Where should I start?"
1014002-9 = "[s] \"There's a new 2-player shooter game that just came out. Want to play together?\""
1014002-10 = "...What?"
1014002-11 = "You can't be serious. Weren't you just complaining that you had a never-ending pile of work to do?"
1014002-12 = "This isn't a chance to slack off. It's time to WORK!"
1014002-13 = "I'll help out with the reports."
1014002-14 = "[s] \"So mean!\""
1014002-15 = "Maybe you deserve it! Why are you so unmotivated?"
1014002-17 = "So while I was enjoying my time with Kurumi, handling Schale's tasks..."
1014002-18 = ""
1014002-23 = "[USERNAME] Sensei, are you here?"
1014002-24 = "[s] \"Excuse me, but who are you...?\""
1014002-25 = "Ah, I'm the owner of the Convenience Store next to the station. You helped me out last time."
1014002-26 = "At the time, the students I hired as part-timers ended up being delinquents and took over my store. They were bleeding me dry, eating all the bread and snacks in sight."
1014002-27 = "But Schale's Sensei helped me. You saved me, really."
1014002-28 = "[s] \"That happened...?\""
1014002-29 = "Yes. You persuaded those troublemakers to leave, and even helped me clean up afterwards."
1014002-30 = "I'm sure problems like those are commonplace for you, so I understand if you don't remember."
1014002-31 = ""
1014002-33 = ""
1014002-34 = "..."
1014002-35 = ""
1014002-36 = "I know it's not much, but I brought you snacks, as a token of my gratitude. Please, take them."
1014002-37 = "[s3] \"Thank you. I'll make sure to enjoy these.\"\n[s4] \"No. It's really okay.\""
1014002-39 = "If you refuse, it'll be even more embarrassing for me."
1014002-40 = "[s5] \"But...\""
1014002-41 = "If you keep refusing, even a buddha would get mad."
1014002-42 = "[s6] \"Okay, okay. Thank you very much.\""
1014002-43 = "Fufu, I'm glad I was able to pay you back, even if only a little bit."
1014002-44 = "I'll bring something else next time!"
1014002-45 = "Goodbye!"
1014002-46 = ""
1014002-48 = ""
1014002-49 = "..."
1014002-50 = "Sensei, do you know that person?"
1014002-51 = "[s7] \"Hm... I tend to deal with all kinds of issues.\"\n[s8] \"I don't really remember, but I'm sure we crossed paths at one point.\""
1014002-54 = "What? You brought someone you don't even REMEMBER into Schale?"
1014002-55 = "And what if they were planning on harming you?"
1014002-56 = "[s] \"Aw, I doubt it.\""
1014002-57 = ""
1014002-60 = "[ns] \"And you're right here, Kurumi. What could happen?\""
1014002-61 = "Of course, I'd be able to overpower the attacker before they even took out their weapon..."
1014002-62 = "But that's not the point! Your security is too lax."
1014002-63 = "What do you do when I'm not here?"
1014002-64 = "[s9] \"Look at this, Kurumi. I didn't notice at first...\"\n[s10] \"...but it looks really tasty in its fancy wrapper.\""
1014002-67 = "They do look like expensive cookies."
1014002-68 = "But if it's homemade and not mass-produced..."
1014002-69 = "[s] \"Thank you for the meal!\""
1014002-70 = "WAIT!"
1014002-71 = "Sensei! You can't eat a homemade cookie from someone you don't know!"
1014002-72 = "[s] \"Why not...?\""
1014002-73 = "Because you're an extremely important V-VIP, known throughout Kivotos!"
1014002-74 = "Those cookies could be laced with bad intentions!"
1014002-75 = "In power struggles in the underworld, some bosses send chocolates containing truth agents to other bosses, or even poison them, to get the upper hand in negotiations."
1014002-76 = "What's to say that won't happen to you, Sensei [USERNAME]?"
1014002-77 = "You need to be better at assessing and preventing potential dangers!"
1014002-78 = "You'll never be at the level of a Special Forces Soldier like me, but try to be at least a little aware of your position."
1014002-79 = "[s11] \"That makes sense too, but...\"\n[s12] \"It's hard to gain students' trust if you're too stiff.\""
1014002-82 = "No. I have an order from the General Student Council President to ensure your safety."
1014002-83 = "That means I can't make any exceptions. That's where accidents occur. In the exceptions."
1014002-84 = ""
1014002-88 = "[ns] \"...Then will you help me, Kurumi?\""
1014002-89 = "Me? What can I do?"
1014002-90 = "[s13] \"You try these gifted cookies first, Kurumi.\"\n[s14] \"If nothing happens to you, they're safe for me to eat, right?\""
1014002-93 = "Like a poison tester? That could work..."
1014002-94 = "But if it's for cookies, we have other members..."
1014002-95 = "[s15] \"Please help, Kurumi!\"\n[s16] \"I can't leave my safety in the hands of anyone else!\""
1014002-98 = "Hmph. I guess there's no other choice. If that's what you say, Sensei."
1014002-99 = "Well, then just to be safe, I'll try it first."
1014002-100 = ""
1014002-102 = ""
1014002-103 = "[ns] \"...So?\""
1014002-104 = "...It's good."
1014002-105 = "Mmm. It just melts in your mouth. They must've used some really fancy butter in it."
1014002-106 = "Oh, there's no poison! I think these cookies are safe to eat."
1014002-107 = "[s] \"Thank goodness they're not poisoned.\""
1014002-108 = ""
1014002-111 = "[ns17] \"Come to think of it, there were a ton of gifts I've been nervous about...\"\n[ns18] \"Do you think you could be my poison tester for those too?\""
1014002-114 = "G-Gifts you're nervous about...?"
1014002-115 = "That's what I'm here for, Sensei. Use me for all your testing needs!"
1014002-117 = "I took Kurumi all over Schale, giving her various gifts we had stockpiled here and there."
1014002-119 = "Are these tea leaves...?"
1014002-120 = "Well, mixing poison in tea leaves is a time-honored method of assassination, after all. It can't be overlooked."
1014002-121 = "Let's see..."
1014002-122 = ""
1014002-124 = ""
1014002-125 = "No problem. This tea is safe to drink."
1014002-126 = ""
1014002-128 = "A Miracle 5,000 Cake?! Even Trinity has a hard time getting their hands on one of these! Who gifted this to you?!"
1014002-129 = "Let me test it for poison..."
1014002-130 = ""
1014002-132 = ""
1014002-133 = ""
1014002-134 = "Wow... I've never tasted anything so luxurious."
1014002-135 = ""
1014002-137 = ""
1014002-138 = "C-Clear! No poison here."
1014002-140 = "What? You want me to smell the perfume to make sure it isn't poisoned?"
1014002-141 = "I-I guess there's a possibility... All right."
1014002-142 = ""
1014002-144 = ""
1014002-145 = "Mm, it smells good... The subtle scent of birch is helping me relax..."
1014002-146 = "There's nothing wrong with this either. #nBut Sensei, was all of this testing really necessary?"
1014002-147 = "[s] \"Over here this time!\""
1014002-152 = "Schale Night Shift Room"
1014002-153 = ""
1014002-154 = ""
1014002-155 = "Th-This is a bedroom?"
1014002-156 = "S-Sensei? What were you thinking, bringing me here?!"
1014002-157 = "[s19] \"I purchased a new pillow.\"\n[s20] \"Will you lie down on it to see if the fibers are poisoned, Kurumi?\""
1014002-160 = ""
1014002-162 = ""
1014002-163 = "...I've been tricked."
1014002-164 = "I was so busy tasting everything that I didn't see it..."
1014002-165 = "The poison tasting was just an excuse to avoid doing work!"
1014002-166 = "[s] \"Dang it. I've been found out.\""
1014002-167 = "You can't be serious right now! Get back to work, NOW!"
1014002-169 = "After that, I happily finished Schale's tasks with a slightly angry Kurumi."
