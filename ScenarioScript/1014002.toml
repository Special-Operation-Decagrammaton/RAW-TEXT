[translation]
1014002-1 = "จิ้งจอกผู้ระแวดระวัง"
1014002-2 = "สำนักงานชาเล่ต์"
1014002-3 = "(คุรุมิมาเข้าเวรเพื่อช่วยงานที่สำนักงานชาเล่ต์)"
1014002-4 = "[ns1] \"เข้ามาสิ คุรุมิ!\"\n[ns2] \"ครูกำลังรออยู่เลย!\""
1014002-7 = "อรุณสวัสดิ์ คุณครู"
1014002-8 = "ถ้างั้น... วันนี้ให้ฉันทำอะไรก่อนดีล่ะ?"
1014002-9 = "[s] \"ครูมีเกมยิงปืนใหม่แบบเล่น 2 คน มาเล่นด้วยกันมั้ย?\""
1014002-10 = "ว่าไงนะ...?"
1014002-11 = "พูดเรื่องอะไรเนี่ย เมื่อวานยังบ่นอยู่เลยว่างานเยอะมากจนทำไม่เสร็จสักที"
1014002-12 = "อย่าแม้แต่คิดที่จะขี้เกียจนะ มาทำงานซะดีๆ!"
1014002-13 = "แล้วฉันจะช่วยเขียนรายงานให้"
1014002-14 = "[s] \"ทำเกินไปแล้ว~\""
1014002-15 = "คนที่จะอยากเล่นเกมต่างหากล่ะที่ทำเกินไป!"
1014002-17 = "(ระหว่างที่จัดการงานของชาเล่ต์กับคุรุมิอย่างสนุกสนาน...)"
1014002-18 = ""
1014002-23 = "คุณครู [USERNAME] อยู่มั้ยครับ?"
1014002-24 = "[s] \"นั่นใครเหรอ...?\""
1014002-25 = "อ้อ ผมคือเจ้าของร้านสะดวกซื้อหน้าสถานีที่คุณครูช่วยเหลือไว้ครั้งก่อนน่ะครับ"
1014002-26 = "ตอนนั้นพวกเด็กเกเรที่จ้างมาทำงานพาร์ทไทม์ดันรวมหัวกันยึดร้านสะดวกซื้อ แล้วก็หยิบขนมปัง#nกับขนมขบเคี้ยวมากินกันตามใจชอบ... ค่าเสียหายไม่ใช่น้อยเลยละ"
1014002-27 = "แต่ตอนนั้นคุณครูของชาเล่ต์ก็เข้ามาช่วยเหลือไว้ทันครับ"
1014002-28 = "[s] \"เคยมีเรื่องแบบนั้นด้วยเหรอ...?\""
1014002-29 = "ครับ ตอนนั้นคุณครูช่วยเกลี้ยกล่อมให้เด็กเกเรกลับไป แล้วก็อยู่ช่วยจัดของในร้านให้ด้วยน่ะครับ"
1014002-30 = "คุณครูของชาเล่ต์ต้องคอยตามแก้ปัญหาสารพัด ถ้าจะจำเรื่องนี้ไม่ได้ก็คงไม่แปลก..."
1014002-31 = ""
1014002-33 = ""
1014002-34 = "..."
1014002-35 = ""
1014002-36 = "นี่เป็นขนมเล็กๆ น้อยๆ ที่ผมตั้งใจเอามาให้เป็นการตอบแทน คุณครูช่วยรับไว้เถอะนะครับ"
1014002-37 = "[s3] \"ขอบคุณนะ จะกินให้อร่อยเลย\"\n[s4] \"ไม่เป็นไร เรื่องเล็กน้อยแค่นี้เอง\""
1014002-39 = "ไม่ได้หรอกครับ ถ้าปฏิเสธ ผมจะรู้สึกอับอายมากขึ้นไปอีกนะครับ"
1014002-40 = "[s5] \"แต่ว่า...\""
1014002-41 = "อย่าปฏิเสธเลยครับ อยากเห็นหุ่นยนต์อายจนหน้าแดงเหรอครับ?"
1014002-42 = "[s6] \"งั้นจะขอรับไว้ด้วยความขอบคุณละนะ\""
1014002-43 = "ฮุฮุ น่าดีใจที่อย่างน้อยผมก็ได้ตอบแทนคุณครูบ้างนะครับ"
1014002-44 = "ไว้ครั้งหน้าผมจะแวะมาหาพร้อมของขวัญอื่นนะครับ"
1014002-45 = "ถ้างั้นผมขอตัวก่อน!"
