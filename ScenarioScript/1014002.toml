1014002-57 = ""
1014002-60 = "[ns] \"ครูมีคุรุมิอยู่ข้างกายทั้งที จะมีใครกล้ามาทำอะไรล่ะ?\""
1014002-61 = "แน่นอนว่าฉันสามารถจัดการใครก็ตามที่บุกเข้ามาก่อนที่เจ้าตัวจะหยิบอาวุธออกมาได้..."
1014002-62 = "ไม่สิ แต่การรักษาความปลอดภัยแบบนั้นมันหละหลวมเกินไปหรือเปล่า?"
1014002-63 = "แล้วตอนที่ฉันไม่อยู่ล่ะ จะทำยังไง...?"
