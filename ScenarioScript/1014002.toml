1014002-67 = "ดูจะเป็นขนมราคาแพงเลยนะ"
1014002-68 = "แต่ถ้าเป็นขนมโฮมเมด ไม่ใช่ขนมที่ผลิตครั้งละเยอะๆ แบบในโรงงานละก็..."
1014002-69 = "[s] \"จะกินละนะ~\""
1014002-70 = "เดี๋ยวก่อน!"
1014002-71 = "คุณครู จะเอาขนมที่คนแปลกหน้าให้มาใส่ปากง่ายๆ แบบนี้ได้เหรอ?"
1014002-72 = "[s] \"ไม่ได้เหรอ...?\""
1014002-73 = "ก็ต้องไม่ได้สิ! คุณครูคือคนระดับ VVIP ที่สำคัญที่สุดในคิโวทอสเลยไม่ใช่หรือไง?"
1014002-74 = "ถ้าอีกฝ่ายมีเจตนาไม่ดีและคิดจะทำร้ายคุณครูขึ้นมาล่ะ?"
1014002-75 = "ในการแย่งชิงผลประโยชน์ของพวกโลกใต้ดินน่ะ ถ้าอยากได้เปรียบในการเจรจา บางทีก็ถึงขั้น#nมอมช็อกโกแลตผสมยาเค้นความลับ หรือไม่ก็วางยาพิษใส่บอสของฝ่ายตรงข้ามกันเลยนะ"
1014002-76 = "แล้วก็ไม่มีใครรับประกันได้ด้วยว่าเรื่องแบบนั้นจะไม่เกิดขึ้นกับคุณครู [USERNAME]"
1014002-77 = "เพราะงั้นก็ช่วยกลัวอันตราย แล้วก็ระวังตัวให้มากกว่านี้หน่อยสิ"
1014002-78 = "ฉันไม่ได้ขอให้คุณครูเก่งกาจเหมือนทหารหน่วยรบพิเศษหรอกนะ แต่คุณครูน่ะต้องตระหนักถึง#nตำแหน่งของตัวเองให้มากกว่านี้"
1014002-79 = "[s11] \"ที่พูดมาก็มีเหตุผลนะ แต่ว่า...\"\n[s12] \"ถ้าครูระแวงไปซะทุกเรื่อง นักเรียนจะไม่วางใจเอาน่ะสิ\""
1014002-82 = "ไม่ได้หรอก ในเมื่อฉันได้รับคำสั่งจากประธานองค์การนักเรียนให้ดูแลความปลอดภัยของคุณครู#nอย่างเข้มงวด"
