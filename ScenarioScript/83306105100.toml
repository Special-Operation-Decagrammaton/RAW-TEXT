[translation]
83306105100-5 = "으아아앙~! 어떡해! 식권을 잃어버렸어!"
83306105100-6 = "그러게 주머니를 잘 확인했어야지!"
83306105100-7 = "나라고 잃어버리고 싶어서 잃어버린 게 아니라구~!"
83306105100-8 = "오늘처럼 파티 음식을 먹을 날만 고대하면서 이제나저제나 꼭꼭 확인했었는데!"
83306105100-9 = "하필 파티 당일날 참석하고 보니 잃어버렸다. 라는 거군요."
83306105100-10 = "가는 날이 장날★이란 거네요~ 종종 있죠. 그런 일~"
83306105100-12 = "근데 왜 하필 그게 오늘이냐구!"
83306105100-18 = "곤경에 처한 모양이네. 미식연구회."
83306105100-19 = "앗! 서, 선도부장! 오늘은 아직 아무런 일도 저지르지 않았으니까 말이야!"
83306105100-20 = "우리는 지금 그냥 맛있는 파티 음식을 눈앞에 두고 가련하게 침만 흘릴 수밖에 없는……"
83306105100-21 = "그런 비극적인 상황에 처했을 뿐인 불쌍한 학생이라구!"
83306105100-22 = "응? 먹을 수 없는 건 식권을 잃어버린 준코 뿐이잖아? 난 가지고 있는데?"
83306105100-23 = "네, 저 또한 마찬가지로."
83306105100-24 = "저도 착실히 가지고 있답니다~"
83306105100-26 = "이 자식들! 부원을 버리겠단 거야?!"
83306105100-27 = "준코 씨. 그건 틀린 말이에요."
83306105100-28 = "응?"
83306105100-29 = "저희 미식연구회는 모두가 궁극의 미식을 위해 궁구하고 고민하는 이들."
83306105100-30 = "그 과정에서 실수로 식권을 잃어버렸다면, 그건 저희가 버린 게 아니라. 당사자가 버림당한 거랍니다."
83306105100-31 = "우, 우와아아앙~! 그냥 아예 가슴에 대못을 박아라! 박아!"
83306105100-32 = "……그런 거라면 차라리 여기 내 식권을 줄 테니."
83306105100-33 = "아뇨. 미식연구회의 일원으로서 그런 편법은 허용할 수 없습니다."
83306105100-34 = "그런 점에선 냉정하구나."
83306105100-35 = "후후, 미식을 향한 고집이라 말해주시길."
83306105100-36 = "여기선, 그렇지요. 다 같이 준코 씨의 식권을 찾아보도록 하죠."
83306105100-37 = "어?! 진짜?!"
83306105100-38 = "네, 이러니저러니 해도 음식이란, 동료, 그리고 친구와 함께 먹을 때 더욱 값지고 맛난 법이니까요."
83306105100-39 = "응, 어쩔 수 없지. 배는 고프지만! 같이 먹는 게 더 좋으니까. 힘내서 찾아보자!"
83306105100-40 = "후후훗, 뭐, 처음부터 이렇게 될 줄 알았지만요~★"
83306105100-41 = "너희들……!"
83306105100-42 = "그런 거라면…… 좋아, 나도 도와줄게."
83306105100-43 = "다들…… 고마워!"
