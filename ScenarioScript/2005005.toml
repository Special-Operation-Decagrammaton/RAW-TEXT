[translation]
2005005-1 = "혼자는 안 돼요!"
2005005-2 = "샬레 정문"
2005005-3 = "선생님! 여기!"
2005005-4 = "[s]\"안녕, 리츠!\""
2005005-5 = "그런데 선생님, 바쁘다고 하지 않았어?"
2005005-6 = "[s1]\"리츠, 어른은 말이지…….\"\n[s2]\"일에서 도망칠 구실이 생겼을 때 망설이지 않는 법이야.\""
2005005-9 = "어? 나 그거 어떤 뭔지 알아!"
2005005-10 = "그건 글러 먹었다고 하는 거야!"
2005005-11 = "[s]\"맞는 말인데 아파!\""
2005005-12 = "그래도 나랑 같이 놀러 가준다는 거지?"
2005005-13 = "그런 선생님이라면 글러 먹어도 좋아!"
2005005-14 = "일단 가자, 선생님! 마침, 내가 꽉 잡고 있는 거리가 있으니까!"
2005005-19 = "(그렇게 리츠의 손에 붙잡혀 상점가로 향했다.)"
2005005-21 = "의류 상점가"
2005005-22 = "짜잔~ 여기랍니다, 선생님!"
2005005-23 = "무난한 옷부터 관심받고 싶은 날 입을 옷까지! 전부 이 거리에서 구할 수 있어!"
2005005-24 = "[s]\"근처는 몇 번 지나가 봤는데, 이런 거리인 줄은 몰랐네.\""
2005005-25 = "거기다 저 구석 가게에선 선생님이 좋아하는 투명 치마랑 투명 바지도 팔고 있고!"
2005005-26 = "[s3]\"안 좋아해요, 그런 거!\"\n[s4]\"그보다 수요가 있는 거야, 그런 옷?\""
2005005-29 = "아하하! 그런 옷이 싫으면 이쪽으로 가자!"
2005005-30 = "적당한 가격에, 적당히 무난한 옷들부터 살펴보자고!"
2005005-38 = "(그렇게 거리를 따라 걸으며 옷들을 살펴보았다.)"
2005005-39 = "(종종 리츠의 미적 취향이 강하게 개입하기도 했지만…….)"
2005005-40 = "(평범하게 좋은 옷들을 꽤 살 수 있었다.)"
2005005-42 = "블랙마켓 초입"
2005005-43 = "음, 이 정도면 잘 어울리는 옷들로 충분히 산 것 같네."
2005005-44 = "선생님은 어때?"
2005005-45 = "[s]\"단조롭던 옷장에 새바람이 불겠는걸.\""
2005005-46 = "헤헤, 나온 보람이 있네."
2005005-47 = "그럼 선생님, 잠깐만 여기서 기다려줄 수 있어?"
2005005-48 = "[s]\"의뢰받은 교역품 챙기러 가는 거야?\""
2005005-52 = "역시 선생님! 바로 아는구나!"
2005005-53 = "그러면 다녀올게!"
2005005-58 = "[ns](뭐…… 혼자서라도 좀 더 살펴보고 있을까.)"
2005005-60 = "[ns](그나저나 이쪽 거리는 어쩐지 분위기가 좀 다르네……)"
2005005-62 = "음? 어서 옵쇼, 손님! 뭐 찾으시려고?"
2005005-63 = "[s]\"아, 겉옷을 좀…….\""
2005005-64 = "아! 그거라면 끝내주게 잘 빠진 신상이 들어왔지!"
2005005-68 = "자! 이거 한 번 입어봐!"
2005005-69 = "[s]\"저기 일단 한 번 좀 둘러보고…….\""
2005005-70 = "아니야, 쓸데없이 둘러봐서 뭐 하게? 손님한테는 이 옷이 딱이야. 나를 봐, 나 못 믿어?"
2005005-71 = "[s]\"저희 오늘 처음 보지 않았나요?\""
2005005-72 = "어허! 일단 입어 보라니까?"
2005005-76 = "캬~ 역시 내 눈은 틀리지 않는다니까. 이 정도면 거의 맞춤옷이네, 응?"
2005005-77 = "[s]\"……팔 부분 기장이 너무 긴데요.\""
2005005-78 = "걱정 마! 근처에 수선집 있거든? 바~로 가서 잘라다 줄게. 기다려 봐, 응?"
2005005-79 = "[s]\"아니 아직 살 생각이 없습니다만.\""
2005005-80 = "이봐, 이런 기회는 망설이는 게 아니야. 다음에 오면 이 옷 없다니까?"
2005005-81 = "선생님, 거기서 뭐 해?"
2005005-85 = "헉! 누, 누님?!"
2005005-86 = "뭐해? 또 싫다는 사람한테 억지로 옷 팔고 있었어?"
2005005-87 = "그, 그럴 리가요! 지, 지금은 어울리는 옷이 없으니, 다음에 좋은 옷으로 모시겠다고 말하던 참이었습니다!"
2005005-88 = "그치 그치? 그러면 선생님은 내가 데려갈게!"
2005005-89 = "예! 살펴 가십쇼!"
2005005-94 = "역시 선생님은 나 없으면 안 되겠다, 그치?"
2005005-95 = "[s]\"이 거리에서 대체 뭘 하고 다녔던 거니…….\""
2005005-96 = "헤헤."
2005005-97 = "그러니까 선생님, 앞으로 어디 처음 갈 일 있으면 꼭 나랑 같이 다녀야 해?"
2005005-98 = "알겠지?"
