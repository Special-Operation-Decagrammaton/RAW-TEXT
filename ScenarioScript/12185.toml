[translation]
12185-2 = "목표 좌표에 도착!"
12185-3 = "여기 어딘가에 호시노 선배가 갇혀 있어요! 주변을 잘 찾아주세요. 분명……."
12185-4 = "……."
12185-5 = "여기는……."
12185-6 = "……하, 학교?"
12185-7 = "이 폐허의 흔적은…… 이거 분명 학교지?"
12185-8 = "사막 한가운데 학교라면……. 여기는……."
12185-9 = "아아, 그래. 여기가 바로 아비도스 학교의 대본관이다."
12185-10 = "!!"
12185-17 = "……."
12185-18 = "네 녀석……!!"
12185-20 = "잘도 여기까지 왔구나. 아비도스 대책위원회."
12185-26 = "적, 증원……."
12185-27 = "이 숫자는…… 적의 전병력입니다."
12185-28 = "카이저 PMC는 여기서 총력전을 시작할 셈이에요……!"
12185-30 = "사막화가 진행되며 버리고 떠난 아비도스 학교의 폐허……. 이곳이 바로 아비도스의 중심이었지."
12185-31 = "아마 너희들도 모르는 과거의 건물이겠지만……. 한때 키보토스에서 가장 크고 강대했던 학원의 잔해가 이 모래 속에 묻혀 있다."
12185-32 = "게마트리아는 이곳에 실험실을 세우길 요구했지."
12185-33 = "실험실……!!"
12185-34 = "호시노 선배는 어디에 있죠!"
12185-35 = "그 부학생회장은 바로 우리 너머의 건물에 있다."
12185-36 = "그래, 어쩌면 지금 이미 실험이 시작되었을 지도 모르겠군."
12185-37 = "……!!"
12185-38 = "자아, 어떠냐? 당장이라도 선배를 찾으러 가고 싶냐? 그렇다면 우리를 뿌리치고 가봐라."
12185-39 = "이 병력…… 우리를 쉽게 보내주진 않을 것 같습니다……."
12185-43 = "음. 그렇다면 여기는 내가 맡을 테니……."
12185-44 = "(콰콰콰아아아아앙---!!)"
12185-45 = "또 폭발?! 이, 이번엔 뭐죠?"
12185-48 = "짜잔! 안녕~☆"
12185-49 = "……."
12185-50 = "시, 실례하겠습니다!"
12185-51 = "흐, 흥신소 여러분……?!"
12185-52 = "아루 쨩! 드디어 따라잡았어. 그런데 뭐야, 다들 모여있고. 뭔가 중요한 장면에 끼어든 느낌인데?"
12185-53 = "……흥. 몰래 도움을 주러 왔더니 시시하게시리."
12185-54 = "뭐, 뭐야! 네 녀석들! 서, 설마 여기까지……."
12185-55 = "이 상황에서 이 타이밍에 등장…… 설마……?!"
12185-56 = "그렇군. ……그건가."
12185-57 = "……응? 뭐지? 이 기대에 찬 눈빛들은?"
12185-58 = "……뭔가 불안한데. 사장, 잠깐 상황을 파악해서……."
12185-59 = "……."
12185-60 = "훗. 눈치 하나는 빨라서 좋군. 대책위원회. 그래, 우리가 여기에 온 이유는 뻔하지 않겠어?"
12185-63 = "여기는 우리에게 맡기고, 동료를 구하러 가라!!"
12185-65 = "!!"
12185-66 = "!!"
12185-67 = "!!"
12185-68 = "……하아."
12185-74 = "(저, 저질러버렸다아아아아----!!)"
12185-76 = "……우, 우와. 아루 쨩 반할 거 같아……. 진짜로."
12185-77 = "펴, 평생 따르겠습니다! 아루 님!!"
12185-79 = "……치, 치잇."
12185-80 = "따, 딱히 고맙다는 말은 안 할 테니까……!!"
12185-81 = "다 끝나고, ……가, 같이 라멘이나 먹자고. 흥신소!!"
12185-82 = "응! 이 은혜는 반드시!"
12185-83 = "응, 고마워."
12185-86 = "하아…… 이렇게까지 해버렸으면 어쩔 수 없는건가."
12185-87 = "고, 공격해! 아니, 막아! 으아아아-!"
12185-88 = "아하하하하! 완전 재밌게 되었네, 아루쨩! 그런 멋진 대사를 해버렸으면 쉽게 당해버리면 면목이 없잖아?"
12185-90 = "그럼 시작해볼까!!"
12185-92 = "다음화;그럼에도 놓지 않은 2"
