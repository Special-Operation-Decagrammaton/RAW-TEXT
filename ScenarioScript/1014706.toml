1014706-64 = "(คุณครูช่วยดึงนักท่องเที่ยวที่ตะเกียกตะกายอยู่ในน้ำตื้นขึ้นมาจากน้ำ)"
1014706-66 = ""
1014706-67 = "แฮ่ก แฮ่ก... ขะ... ขอบคุณนะครับ... เมื่อกี้ผมเป็นตะคริวที่เท้าขึ้นมา..."
1014706-68 = "ทั้งที่เป็นน้ำตื้นแท้ๆ แต่ตกใจจนคิดอะไรไม่ออกเลย..."
1014706-69 = "[s] \"ก่อนลงน้ำต้องวอร์มร่างกายให้เพียงพอก่อนนะ\""
1014706-70 = "ฮ่าฮ่า นั่นสินะครับ พอเห็นทะเลแล้วผมก็มีแรงฮึกเหิมพลุ่งพล่านขึ้นมาโดยไม่รู้ตัว จนอดใจกระโดดลงไปไม่ไหวเลย!! วะฮะฮ่าฮ่า!"
1014706-71 = "ยังไงก็ขอบคุณที่ช่วยไว้นะครับ! รอดมาได้เพราะคุณช่วยเลย"
1014706-72 = ""
1014706-74 = ""
1014706-75 = ""
1014706-76 = "แหม~ รีบพุ่งตัวไปช่วยทันทีเลยนะ"
