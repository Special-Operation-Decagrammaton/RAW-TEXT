1014706-53 = "ฮึ่ม~ น่าจะเจ็บแท้ๆ เป็นเด็กที่เข้มแข็งจังเลยนะ"
1014706-54 = "ครูนี่ ดูแลเด็กเล็กๆ ได้เก่งเหมือนกันนะเนี่ย"
1014706-55 = "[s] \"เห็นแบบนี้ แต่ครูก็เป็นคุณครูนะ\""
1014706-56 = "ฮุฮุ สมกับเป็นผู้ร่วมมือที่ไว้ใจได้จริงๆ"
