1014706-88 = "[s] \"อื้ม ใช่แล้ว\""
1014706-89 = "อ๊ะ! โชคดีจัง! ไม่ทราบว่าพอจะมาช่วยทางนี้สักครู่ได้มั้ยคะ?"
1014706-90 = "ที่ร้านริมหาดเกิดเรื่องกระทบกระทั่งกันนิดหน่อย แต่ทั้งสองฝ่ายไม่มีใครยอมใครเลยน่ะค่ะ"
1014706-91 = "พวกฉันเองก็จนปัญญา... และถ้าเป็นคุณครู ก็น่าจะไกล่เกลี่ยเก่งด้วย..."
