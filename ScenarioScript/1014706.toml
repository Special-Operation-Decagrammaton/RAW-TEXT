[translation]
1014706-1 = "サツキの視線対策"
1014706-4 = ""
1014706-5 = "こっちのビーチは人が多いわ……。"
1014706-6 = "同じ海でも、場所によって結構違うのね。"
1014706-7 = "[s1] \"にぎやかというか――\"\n[s2] \"『ザ・海！』って感じだね。\""
1014706-10 = "そうね。ちょっと騒がしいくらいだわ。"
1014706-11 = "実は私、人が多い場所ってあまり好きじゃないの。"
1014706-12 = "人が多いと、気にすることが増えるじゃない？"
1014706-13 = "それでもここに来たのは――"
1014706-14 = "いつもと違う環境で、私の心がどう動くか観察したかったから。"
1014706-15 = "最近、先生と一緒にいると不思議な気分になるの。"
1014706-16 = "あ、別にイヤとかじゃないのよ？むしろその逆。"
1014706-17 = "帰ったら、今日のデータをもとにその理由を分析してみるつもり。"
1014706-20 = ""
1014706-21 = "あははっ！捕まえたらジュースもらうね！"
1014706-22 = ""
1014706-24 = ""
1014706-25 = ""
1014706-26 = "待ってよ……あっ！"
1014706-27 = ""
1014706-30 = "[ns] \"あちゃ～、派手に転んじゃったね……！\""
1014706-31 = "うわあああん！痛いよ～！！"
1014706-32 = ""
1014706-36 = "[ns] \"大丈夫？怪我はない？\""
1014706-37 = ""
1014706-38 = "ぐすっ……うん……。"
1014706-39 = "[s] \"砂の上は転びやすいから、ゆっくり歩こうね。\""
1014706-40 = "うん！ゆっくり歩く！"
1014706-41 = ""
1014706-44 = ""
1014706-45 = "ゆっくり歩く～！"
1014706-46 = ""
1014706-48 = ""
1014706-49 = ""
1014706-50 = ""
1014706-51 = ""
1014706-52 = ""
1014706-53 = "へぇ……すぐ泣き止んでえらいわね。痛かったでしょうに。"
1014706-54 = "それにしても……先生は子どもの扱いにも慣れてるのね。"
1014706-55 = "[s] \"一応先生だからね。\""
1014706-56 = "うふふ。さすが私の協力者といったところかしら。"
1014706-57 = "それで、さっきの話だけど――"
1014706-58 = "た、助けてください！！"
1014706-59 = "えっ……。"
1014706-60 = "[s] \"誰か溺れてる！？\""
1014706-64 = "（溺れかけている人を、水から引き上げた）"
1014706-66 = ""
1014706-67 = "はぁ、はぁ……あ、ありがとうございます……。"
1014706-68 = "突然足がつっちゃって……頭が真っ白になっちゃいまして……。"
1014706-69 = "[s] \"準備運動を入念にすると良いかもしれませんね。\""
1014706-70 = "いやぁ～海を見ていると飛び込みたくなっちゃった！すみません！"
1014706-71 = "おかげで命拾いしました。助けていただきありがとうございます。"
1014706-72 = ""
1014706-74 = ""
1014706-75 = ""
1014706-76 = "ふぅん……あんなに即座に動けるなんて。"
1014706-77 = "困っている人を見ると放っておけないのかしら。"
1014706-78 = "でも気をつけて頂戴。#n水難事故の救助は、救助者も巻き込まれる可能性があるのよ。"
1014706-79 = "[s3] \"うん、ありがとう。\"\n[s4] \"気をつけるね。\""
1014706-82 = "人が多いと、こういう問題も出てくるわね。"
1014706-83 = "じゃあ――"
1014706-84 = ""
1014706-87 = "あれ？もしかしてシャーレの先生ですか？"
1014706-88 = "[s] \"うん、そうだよ。\""
1014706-89 = "ちょうどよかった！ もしよろしければ、少し手伝っていただけませんか？"
1014706-90 = "海の家でちょっとしたケンカが起きているんですが、二人とも強情で……。"
1014706-91 = "私たちだけでは手に負えなくて……。#n先生の話なら、二人とも聞くと思うのですが……。"
1014706-92 = "[s] \"どこに行けばいい？\""
1014706-93 = ""
1014706-95 = ""
1014706-96 = "ありがとうございます！こちらです！"
1014706-97 = ""
1014706-99 = ""
1014706-101 = ""
1014706-102 = ""
1014706-104 = "（その後もトラブルは続き、忙しく動き回った……）"
1014706-107 = "[ns] \"ふう……。\""
1014706-109 = ""
1014706-110 = "……。"
1014706-111 = "[s] \"ごめんね、サツキ……ずっとバタバタしてて。\""
1014706-112 = "ふぅん……。"
1014706-113 = "まあ、仕方ないわ。"
1014706-114 = "先生は事件を見過ごせない性分だものね。"
1014706-115 = "でも……視野が広すぎるのも考え物よ。"
1014706-116 = "今日起きた事件のほとんどは、先生がいなくても解決したんじゃない？"
1014706-117 = "[s] \"それは……そうかも。\""
1014706-118 = "だから……今からはよそ見禁止。"
1014706-119 = "先生は私のことだけ見ていればいいの。"
1014706-120 = "それが一番安全なんだから。"
1014706-121 = "[s] \"周りを見ないほうが、むしろ危ないと思うんだけど……。\""
1014706-122 = "先生の代わりに、私が見ていてあげる。これで安心でしょ？"
1014706-123 = "だから……先生は私だけ見ていて頂戴。"
1014706-124 = ""
1014706-126 = ""
1014706-127 = ""
1014706-128 = "ほら、ここに座って。"
1014706-130 = "（しばらくして……）"
1014706-132 = "……。"
1014706-133 = "[s] \"ねえ、サツキ。\""
1014706-134 = "なぁに、先生？"
1014706-135 = "[s5] \"サツキもずっと私のこと見てるけど……。\"\n[s6] \"これだと、他を見られてないんじゃない？\""
1014706-138 = ""
1014706-140 = ""
1014706-141 = "え？そ、そうかしら？"
1014706-142 = "私……そんなに先生のことばかり見ているの……？"
1014706-143 = "[s] \"うん。さっきからずっと……。\""
1014706-144 = "……。"
1014706-145 = "よ、よく気づいたわね！"
1014706-146 = "先生がちゃんと私の話を聞いているかテストしていたのよ。"
1014706-147 = ""
1014706-149 = ""
1014706-150 = "さ、気を取り直して続けましょ。"
1014706-151 = ""
1014706-154 = ""
1014706-155 = ""
1014706-157 = "（それからも、サツキが視線をそらすことはなかった）"
1014706-158 = "（帰るまで、ずっと私だけをどこか嬉しそうに見ていた）"
