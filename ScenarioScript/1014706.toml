[translation]
1014706-1 = "사츠키의 시선 대책"
1014706-5 = "이쪽 해변에는 확실히 사람이 많네~"
1014706-6 = "바다와 접해있다는 지형적 특성은 같지만, 입지에 따라 이용객의 차이가 크구나."
1014706-7 = "[s1] \"활기찬 분위기가 뭐랄까.\"\n[s2] \"바다다~ 같은 느낌이네.\""
1014706-10 = "그치? 뭔가 더 시끌벅적한 느낌."
1014706-11 = "사실 나는 사람 많은 곳을 그다지 좋아하지는 않아."
1014706-12 = "너무 사람이 많으면 신경이 분산돼서, 나중에는 머리가 아파. #n위험 요소도 제곱으로 증가하고 말이지."
1014706-13 = "그럼 왜 굳이 이쪽으로 왔냐고?"
1014706-14 = "글쎄? 다른 분위기에서는 어떠려나~ 해서?"
1014706-15 = "요즘 뭔가, 선생이랑 같이 있으면 좀 이상한 기분이 들거든."
1014706-16 = "아, 불쾌하거나 나쁜 쪽은 아니야."
1014706-17 = "나도 이유를 잘 모르겠어서, 돌아가면 정보부의 역량을 총동원해서 원인을 알아내 볼까 하고……."
1014706-21 = "와하하~~! 나 잡으면 100엔~~"
1014706-26 = "기다려…… 아앗!"
1014706-30 = "[ns] \"아이고, 세게 넘어졌네……!\""
1014706-31 = "으아앙~~ 아파~~!!"
1014706-36 = "[ns] \"괜찮니? 다친 곳은 없어?\""
1014706-38 = "훌쩍…… 응……."
1014706-39 = "[s] \"모래 위에서는 뛰기 힘드니까, 천천히 걷도록 하렴.\""
1014706-40 = "응! 천천히 걸을게!"
1014706-45 = "천천히 걷자~"
1014706-53 = "흐응~ 아팠을 텐데, 씩씩한 아이네."
1014706-54 = "선생, 어린아이들도 꽤 잘 돌보는구나."
1014706-55 = "[s] \"이래 봬도 선생님이니까.\""
1014706-56 = "후후, 역시 믿을 수 있는 협력자다운 모습이야."
1014706-57 = "그럼 이제 아까의 이야기를 이어서……"
1014706-58 = "사, 살려주세요!!"
1014706-59 = "엣……."
1014706-60 = "[s] \"관광객이 물에 빠졌다?!\""
1014706-64 = "(얕은 곳에서 허우적거리고 있던 관광객을 물 밖으로 꺼내주었다.)"
1014706-67 = "헉, 헉…… 가, 감사합니다…… 발에 쥐가 나서……"
1014706-68 = "얕은 곳인데도 머리가 하얗게 되더라고요……."
1014706-69 = "[s] \"물에 들어가기 전에는 준비 운동을 충분히 하셔야 해요.\""
1014706-70 = "하하, 그러게요. 바다를 보니 저도 모르게 온몸에 힘이 막, 불끈거리면서 뛰어들고 싶은 욕망을 주체하지 못했달까요!! 와하하하!"
1014706-71 = "아무튼 구해주셔서 감사했습니다! 덕분에 살았어요."
1014706-76 = "흐응~ 그렇게 바로 움직이다니."
1014706-77 = "곤경에 빠진 사람을 돕는 게 몸에 밴 모양이야, 선생."
1014706-78 = "하지만 방금은 아슬아슬했다구?#n물에 빠진 사람은 크게 당황해서 구하러 온 사람까지 위험하게 만드는 경우도 있다고 하니까."
1014706-79 = "[s3] \"그건 그래.\"\n[s4] \"허리까지밖에 안 오는 수심이긴 했지만…….\""
1014706-82 = "사람이 많다 보니 이렇게 신경이 분산되는 일도 생기는구나."
1014706-83 = "아무튼……"
1014706-87 = "헛, 혹시 샬레의 선생님?"
1014706-88 = "[s] \"아, 맞아.\""
1014706-89 = "아! 다행이다! 혹시 지금 이쪽 일을 잠깐 도와주실 수 있으실까요?"
1014706-90 = "해변의 집에서 살짝 분쟁이 발생했는데, 양쪽 모두 강경해서요."
1014706-91 = "저희로서는 역부족이라……#n선생님이시라면 중재에도 능하실 거라 생각해서……."
1014706-92 = "[s] \"어느 쪽으로 가면 될까?\""
1014706-96 = "감사합니다! 이쪽으로 오시면 됩니다!"
1014706-104 = "(그 후로 이런저런 사소한 사건들이 계속 발생해서 바쁘게 움직였다…….)"
1014706-107 = "[ns] \"휴우…….\""
1014706-110 = "……."
1014706-111 = "[s] \"미안, 사츠키…… 계속 일이 생기네.\""
1014706-112 = "흐응……."
1014706-113 = "뭐, 어쩔 수 없지."
1014706-114 = "선생은 워낙 바쁜 사람이기도 하고, 이런 저런 일들을 지나치지 못하니까."
1014706-115 = "하지만, 선생의 시야가 너무 넓다는 건 단점이야."
1014706-116 = "사실 오늘 일어난 일 대부분은 굳이 선생이 나서지 않아도 해결됐을 거야."
1014706-117 = "[s] \"그건 맞는 말이야…….\""
1014706-118 = "그러니까, 지금부터는 다른 쪽으로 시선을 돌리면 안 돼."
1014706-119 = "이제부터 선생은 나만 바라보고 있도록 해."
1014706-120 = "이게 해변의 위협에서 나와 선생 스스로를 보호할 수 있는 방법이야."
1014706-121 = "[s] \"다른 쪽을 안 보면 그게 더 위험한 거 아냐?\""
1014706-122 = "아니! 다른 쪽은 내가 보고 있을 테니까.#n그걸로 완벽히 안심이지?"
1014706-123 = "아무튼 선생은 나만 보면 되니까."
1014706-128 = "자아, 자아. 사양 말고 여기 앉도록 해."
1014706-130 = "(잠시 후……)"
1014706-132 = "……"
1014706-133 = "[s] \"저, 사츠키.\""
1014706-134 = "응? 무슨 일이야, 선생?"
1014706-135 = "[s5] \"그런데 사츠키도 아까부터 계속 나만 보고 있는데,\"\n[s6] \"그래서야 다른 곳을 살필 수 없지 않아?\""
1014706-141 = "그, 그랬어?"
1014706-142 = "내가 선생만 바라보고 있었다고?"
1014706-143 = "[s] \"응. 아까부터…….\""
1014706-144 = "……."
1014706-145 = "잘 캐치했네!"
1014706-146 = "선생이 내 말을 주의 깊게 듣고 있었는지 아닌지 알아보기 위한 방법이었달까."
1014706-150 = "자아, 자아. 신경 쓰지 말고 계속하도록 해."
1014706-157 = "(하지만 사츠키가 다른 곳으로 시선을 돌리는 일은 없었다.)"
1014706-158 = "(사츠키는 돌아갈 때까지 계속해서 나만을 바라보고 있었다.)"
