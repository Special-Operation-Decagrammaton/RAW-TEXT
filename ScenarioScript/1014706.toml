1014706-113 = "ก็นะ ช่วยไม่ได้นี่นา"
1014706-114 = "ครูเป็นคนยุ่งอยู่แล้ว แถมยังปล่อยผ่านเรื่องต่างๆ ไม่ได้ด้วย"
1014706-115 = "แต่การที่ครูมองเห็นอะไรกว้างเกินไปเนี่ย ถือเป็นข้อเสียนะ"
1014706-116 = "ความจริงเรื่องส่วนใหญ่ที่เกิดขึ้นวันนี้ ต่อให้ครูไม่ลงมือเองก็คงจัดการได้อยู่แล้ว"
1014706-117 = "[s] \"ก็จริงอย่างที่ว่า...\""
1014706-118 = "เพราะงั้น ตั้งแต่นี้ไปห้ามหันไปมองทางอื่นนะ"
