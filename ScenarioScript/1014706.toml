[translation]
1014706-1 = "皐月的視線對策"
1014706-4 = ""
1014706-5 = "這邊的海灘人果然很多呢～"
1014706-6 = "雖然同樣臨海，遊客人數也會因為地點而相差很多呢。"
1014706-7 = "[s1] 「這種熱鬧的氣氛，該怎麼說呢。」\n[s2] 「很有『這就是海！』的感覺呢。」"
1014706-10 = "對吧？感覺更熱鬧一點。"
1014706-11 = "其實我不太喜歡人多的地方。"
1014706-12 = "人太多注意力會被分散，之後就會頭痛。而且危險因素也會成倍增加。"
1014706-13 = "問我為什麼還要特地來這邊？"
1014706-14 = "這個嘛……想說換個氛圍會怎麼樣～之類的？"
1014706-15 = "最近不知道為什麼，跟老師在一起的時候總是有種奇怪的感覺。"
1014706-16 = "啊，不是不舒服或不好的那種哦。"
1014706-17 = "我自己也不太清楚原因，打算回去後動員情報部的力量查個清楚……"
1014706-20 = ""
1014706-21 = "哇哈哈～～！抓到我就給你100塊～～"
1014706-22 = ""
1014706-24 = ""
1014706-25 = ""
1014706-26 = "等等……啊！"
1014706-27 = ""
1014706-30 = "[ns] 「哎呀，摔得好重……！」"
1014706-31 = "嗚哇啊～～好痛～～！！"
1014706-32 = ""
1014706-36 = "[ns] 「還好嗎？有沒有哪裡受傷？」"
1014706-37 = ""
1014706-38 = "嗚……嗯……"
1014706-39 = "[s] 「在沙灘上跑很容易跌倒，要慢慢走哦。」"
1014706-40 = "嗯！我會慢慢走！"
1014706-41 = ""
1014706-44 = ""
1014706-45 = "慢慢走吧～"
1014706-46 = ""
1014706-48 = ""
1014706-49 = ""
1014706-50 = ""
1014706-51 = ""
1014706-52 = ""
1014706-53 = "哼嗯～應該很痛吧，真是個勇敢的孩子。"
1014706-54 = "老師也很會照顧小孩子呢。"
1014706-55 = "[s] 「我好歹也是老師嘛。」"
1014706-56 = "呵呵，果然是可靠的協力者。"
1014706-57 = "那麼，接著剛才的話題……"
1014706-58 = "救，救命啊！！"
1014706-59 = "咦……"
1014706-60 = "[s] 「有觀光客溺水了！？」"
1014706-64 = "（把在淺水處掙扎的觀光客拉出了水面）"
1014706-66 = ""
1014706-67 = "哈啊，哈啊……謝，謝謝您……我的腳抽筋了……"
1014706-68 = "明明是淺水區，我的腦袋卻一片空白……"
1014706-69 = "[s] 「下水前一定要充分做好暖身運動哦。」"
1014706-70 = "哈哈，說的也是。#n我一看到大海就莫名起勁，忍不住想跳進去！！哇哈哈哈！"
1014706-71 = "總之，謝謝您救了我！多虧有您，我才撿回一命。"
1014706-72 = ""
1014706-74 = ""
1014706-75 = ""
1014706-76 = "哼嗯～竟然馬上就行動了。"
1014706-77 = "看來幫助有困難的人已經成為你的習慣了呢，老師。"
1014706-78 = "不過剛才很驚險哦？#n聽說溺水的人會非常慌張，有時連去救援的人都會陷入危險。"
1014706-79 = "[s3] 「這倒也是。」\n[s4] 「雖然水深只到腰而已……」"
1014706-82 = "人一多，注意力就會像這樣被分散呢。"
1014706-83 = "總之……"
1014706-84 = ""
1014706-87 = "咦，您該不會是夏萊的老師吧？"
1014706-88 = "[s] 「啊，是我。」"
1014706-89 = "啊！太好了！請問您現在能來幫我們一下嗎？"
1014706-90 = "海之家發生了一點糾紛，雙方的態度都很強硬。"
1014706-91 = "我們實在力有未逮……想說老師您應該很擅長調解……"
1014706-92 = "[s] 「要往哪邊走？」"
1014706-93 = ""
1014706-95 = ""
1014706-96 = "謝謝您！請往這邊走！"
1014706-97 = ""
1014706-99 = ""
1014706-101 = ""
1014706-102 = ""
1014706-104 = "（之後又接連發生各種小狀況，忙得團團轉……）"
1014706-107 = "[ns] 「呼……」"
1014706-109 = ""
1014706-110 = "……"
1014706-111 = "[s] 「抱歉，皐月……一直有事發生。」"
1014706-112 = "哼嗯……"
1014706-113 = "這也是沒辦法的事。"
1014706-114 = "畢竟老師本來就很忙，又無法對這些事視而不見。"
1014706-115 = "但老師的視野太廣也是個缺點。"
1014706-116 = "其實今天發生的事，大多就算老師不出面也能解決。"
1014706-117 = "[s] 「這倒是沒錯……」"
1014706-118 = "所以接下來，不准你看別的地方。"
1014706-119 = "從現在起，老師只准看著我。"
1014706-120 = "這樣才能保護我和老師，不受海邊的威脅。"
1014706-121 = "[s] 「不看其他地方，不是更危險嗎？」"
1014706-122 = "不會！其他地方由我來看。這樣就能完全放心了吧？"
1014706-123 = "總之老師只要看著我就好。"
1014706-124 = ""
1014706-126 = ""
1014706-127 = ""
1014706-128 = "好了好了，別客氣，坐這裡吧。"
1014706-130 = "（過了一陣子……）"
1014706-132 = "……"
1014706-133 = "[s] 「那個，皐月。」"
1014706-134 = "嗯？怎麼了，老師？"
1014706-135 = "[s5] 「皐月從剛才開始也一直只看著我……」\n[s6] 「這樣不就沒辦法注意其他地方了嗎？」"
1014706-138 = ""
1014706-140 = ""
1014706-141 = "是，是嗎？"
1014706-142 = "你說我一直只看著老師？"
1014706-143 = "[s] 「嗯。從剛才開始……」"
1014706-144 = "……"
1014706-145 = "被你發現了呢！"
1014706-146 = "這是為了測試老師有沒有認真聽我說話。"
1014706-147 = ""
1014706-149 = ""
1014706-150 = "好了好了，別在意，繼續吧。"
1014706-151 = ""
1014706-154 = ""
1014706-155 = ""
1014706-157 = "（但皐月的視線始終沒有轉向別處）"
1014706-158 = "（直到回去為止，皐月一直都只看著我）"
