[translation]
1014706-1 = "มาตรการรับมือสายตาของซัตสึกิ"
1014706-4 = ""
1014706-5 = "หาดฝั่งนี้คนเยอะจริงๆ ด้วยแฮะ~"
1014706-6 = "ถึงจะติดทะเลเหมือนกัน แต่พอทำเลต่างกัน จำนวนคนมาเที่ยวก็ต่างกันเยอะเลยนะ"
1014706-7 = "[s1] \"บรรยากาศคึกคักแบบนี้ ถือว่ามาถึงทะเลแล้วนะ\"\n[s2] \"ให้ความรู้สึกเหมือน 'นี่แหละทะเล~' เลยนะ\""
1014706-10 = "ใช่มั้ยล่ะ? รู้สึกครึกครื้นกว่ายังไงก็ไม่รู้"
1014706-11 = "ความจริงฉันไม่ค่อยชอบที่ที่คนเยอะเท่าไรหรอก"
1014706-12 = "ถ้าคนเยอะเกินไป สมาธิจะกระเจิง แล้วสุดท้ายก็ปวดหัว แถมปัจจัยเสี่ยงก็เพิ่มขึ้นแบบยกกำลังสองด้วย"
1014706-13 = "แล้วทำไมถึงมาทะเลฝั่งนี้น่ะเหรอ?"
1014706-14 = "นั่นสินะ? ก็แค่อยากรู้ว่าถ้าอยู่ในบรรยากาศแบบอื่นจะเป็นยังไง~ ละมั้ง?"
1014706-15 = "ช่วงนี้เวลาอยู่กับครู ฉันรู้สึกแปลกๆ ยังไงไม่รู้น่ะ"
1014706-16 = "อ๊ะ ไม่ใช่ในแง่ที่ไม่สบายใจหรือไม่ดีหรอกนะ"
1014706-17 = "ฉันเองก็ไม่รู้เหมือนกันว่าเพราะอะไร เลยคิดว่ากลับไปแล้วจะเกณฑ์ฝ่ายข่าวกรองทั้งหมด แล้วหาสาเหตุให้ได้..."
1014706-20 = ""
1014706-21 = "วะฮะฮ่า~~! จับได้ให้ 100 เยน~~"
