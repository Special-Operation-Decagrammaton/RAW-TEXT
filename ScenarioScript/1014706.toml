1014706-78 = "แต่เมื่อกี้ก็เฉียดฉิวเลยนะ? ฉันได้ยินว่าบางครั้งคนที่จมน้ำอาจตื่นตระหนกมาก จนทำให้คนที่มาช่วยตกอยู่ในอันตรายไปด้วยเลย"
1014706-79 = "[s3] \"ก็จริงนะ\"\n[s4] \"ถึงน้ำจะลึกแค่เอวก็เถอะ...\""
1014706-82 = "พอคนเยอะ ก็มีเรื่องทำให้สมาธิกระเจิงแบบนี้เกิดขึ้นด้วยสินะ"
