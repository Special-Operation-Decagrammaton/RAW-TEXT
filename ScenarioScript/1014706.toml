[translation]
1014706-1 = "Satsuki's Attention Plan"
1014706-4 = ""
1014706-5 = "This beach is rather crowded."
1014706-6 = "It's the same ocean, but it's so populated here."
1014706-7 = "[s1] \"It's so lively here...\"\n[s2] \"Like it's THE place to be.\""
1014706-10 = "I agree. Much more lively."
1014706-11 = "In all honesty, I usually avoid places where there are too many people."
1014706-12 = "The more people there are, the harder it is for me to focus. I need to assess the increased danger at all times as well. It makes my head hurt."
1014706-13 = "...Then why did I come this way?"
1014706-14 = "Who knows? Perhaps a change in scenery."
1014706-15 = "I've been having strange feelings around you lately."
1014706-16 = "Oh, not in an unpleasant or bad way."
1014706-17 = "I couldn't determine the exact reason, so I plan on figuring out the reason with the full force of the Intelligence Committee..."
1014706-20 = ""
1014706-21 = "Wahaha! I'll give you a hundred yen if you catch me!"
1014706-22 = ""
1014706-24 = ""
1014706-25 = ""
1014706-26 = "Wait... Ah!"
1014706-27 = ""
1014706-30 = "[ns] \"Ah, they tripped hard...!\""
1014706-31 = "Wah! It hurts!!"
1014706-32 = ""
1014706-36 = "[ns] \"Are you all right? You're not hurt anywhere?\""
1014706-37 = ""
1014706-38 = "*sniffle* No..."
1014706-39 = "[s] \"It's hard running on the sand, so take your time.\""
1014706-40 = "Okay! I'll walk more slowly!"
1014706-41 = ""
1014706-44 = ""
1014706-45 = "Slow! Slow!"
1014706-46 = ""
1014706-48 = ""
1014706-49 = ""
1014706-50 = ""
1014706-51 = ""
1014706-52 = ""
1014706-53 = "Hm? It must have hurt. What a brave kid."
1014706-54 = "Sensei, you're rather good with kids."
1014706-55 = "[s] \"I am a teacher, after all.\""
1014706-56 = "Fufu. As expected from my trustworthy partner!"
1014706-57 = "Now, picking up where we left off..."
1014706-58 = "H-Help me!!"
1014706-59 = "Huh...?"
1014706-60 = "[s] \"A tourist fell in the water?!\""
1014706-64 = "I pulled the tourist, who was flailing in shallow waters, out."
1014706-66 = ""
1014706-67 = "*huff* *huff*... Th-Thank you... I got a cramp in my foot..."
1014706-68 = "Even though it's shallow, I blanked out..."
1014706-69 = "[s] \"You have to properly warm up before getting in the water.\""
1014706-70 = "Yes! I'll be sure to next time! I got a little too excited when I saw the ocean and jumped right in without a thought. Wahahaha!"
1014706-71 = "Anyway, thank you for saving me! I made it out thanks to you."
1014706-72 = ""
1014706-74 = ""
1014706-75 = ""
1014706-76 = "You moved almost by instinct."
1014706-77 = "Helping others has become second nature to you, has it not, Sensei?"
1014706-78 = "However, you must still take care of yourself first. Drowning people will often panic and drag down the person trying to save them."
1014706-79 = "[s3] \"That's true...\"\n[s4] \"Even though it only goes up to my waist...\""
1014706-82 = "With so many people around, we keep being distracted."
1014706-83 = "Anyway..."
1014706-84 = ""
1014706-87 = "Oh? Sensei? From Schale?"
1014706-88 = "[s] \"Ah, that's me.\""
1014706-89 = "Ah! Thank goodness! Do you think you could lend us a hand?"
1014706-90 = "A small fight broke out near the beach house, and both sides are refusing to back down."
1014706-91 = "We can't get them to stop, but you're well known for mediating..."
1014706-92 = "[s] \"Just point me in the right direction.\""
1014706-93 = ""
1014706-95 = ""
1014706-96 = "Thank you! Come this way!"
1014706-97 = ""
1014706-99 = ""
1014706-101 = ""
1014706-102 = ""
1014706-104 = "After that, little incidents kept popping up, one after another..."
1014706-107 = "[ns] \"Phew...\""
1014706-109 = ""
1014706-110 = "..."
1014706-111 = "[s] \"Sorry, Satsuki... We keep getting interrupted.\""
1014706-112 = "Hm..."
1014706-113 = "Well, there's no helping it."
1014706-114 = "That's simply who you are."
1014706-115 = "However, your field of vision is too wide."
1014706-116 = "Most of the incidents we ran into today could have been resolved without your interference."
1014706-117 = "[s] \"You're right about that...\""
1014706-118 = "So from now on, stay focused on me."
1014706-119 = "Only look at me."
1014706-120 = "That's how we can protect ourselves from the multitudes of dangers here."
1014706-121 = "[s] \"Isn't it more dangerous not to be aware of our surroundings?\""
1014706-122 = "Not if we watch each other's backs, correct?"
1014706-123 = "So you need only look my way."
1014706-124 = ""
1014706-126 = ""
1014706-127 = ""
1014706-128 = "Now, now. No protests. Come, sit."
1014706-130 = "A while later..."
1014706-132 = "..."
1014706-133 = "[s] \"Um, Satsuki.\""
1014706-134 = "Hm? What's the matter, Sensei?"
1014706-135 = "[s5] \"If you literally look at nothing else but me...\"\n[s6] \"...you won't be able to keep an eye out, right?\""
1014706-138 = ""
1014706-140 = ""
1014706-141 = "I-Is that so?"
1014706-142 = "I didn't realize I hadn't looked away..."
1014706-143 = "[s] \"Yes. Since then...\""
1014706-144 = "..."
1014706-145 = "Excellent work!"
1014706-146 = "This was a test to ensure you understood my safety lessons."
1014706-147 = ""
1014706-149 = ""
1014706-150 = "Now, now. Think on it no more. Let's continue."
1014706-151 = ""
1014706-154 = ""
1014706-155 = ""
1014706-157 = "But Satsuki never did turn the other way."
1014706-158 = "She kept gazing at me for the rest of the time we were there."
