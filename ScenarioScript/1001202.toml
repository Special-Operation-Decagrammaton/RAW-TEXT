[translation]
1001202-1 = "트레이너 등장!"
1001202-2 = "밀레니엄 헬스장"
1001202-3 = "아, 선생…… 아니 트레이너! 오셨군요!"
1001202-4 = "기다리고 있었습니다."
1001202-5 = "아하하, 아직 트레이너로 부르는 게 익숙하지가 않네요."
1001202-6 = "약속대로, 제 트레이닝 시간표를 만들어 왔습니다."
1001202-7 = "괜찮은지 확인해주실 수 있을까요?"
1001202-10 = "(스미레가 건넨 핸드폰에는 뭔가 어려워 보이는 말들이 잔뜩 적혀 있다.)"
1001202-12 = "어떤가요, 트레이너?"
1001202-13 = "덤벨 오버헤드는 삼두근 발달, 특히 장두 부분을 발달시키기에 좋은 운동이라고 합니다."
1001202-14 = "이 운동으로 탄력 있는 팔을 만들 수 있고, 레그 익스텐션을 통한……."
1001202-15 = "[s] \"저기, 스미레?\""
1001202-16 = "다리의 근력을…… 앗, 네. 트레이너!"
1001202-17 = "[s] \"너무 무리하는 거 아냐?\""
1001202-18 = "음…… 이전보다 조금 무리한 감은 있습니다."
1001202-19 = "아마 예전 같았으면 소화하지 못할 스케쥴이겠죠."
1001202-20 = "하지만 지금은 다릅니다."
1001202-21 = "바, 바로 트레이너가 있기 때문이죠!"
1001202-22 = "[s] \"그, 그런가. 그래도 난 전문 지식이 없는데.\""
1001202-23 = "괜찮습니다!"
1001202-24 = "트레이너는 곁에 함께 하는 것만으로도 빛나는 존재!"
1001202-25 = "제가 오버 워크를 하지 않도록, 잡아 주시는 분이시니까요."
1001202-26 = "이렇게 체계적인 트레이닝을 할 수 있게 된 건, 모두 트레이너 덕분입니다."
1001202-27 = "[s] \"그렇다면 다행이야.\""
1001202-28 = "저, 저야말로 다행입니다."
1001202-29 = "트레이너와 만나기 전에 저는, 아무것도 모르는 햇병아리에 불과했으니까요."
1001202-31 = "밀레니엄 보건실"
1001202-32 = "얼마 전"
1001202-33 = "(드르륵)"
1001202-34 = "앗, 선생님."
1001202-35 = "[s] \"몸은 괜찮아?\""
1001202-36 = "괜찮습니다! 가벼운 탈수 증상을 겪은 것뿐입니다."
1001202-37 = "3번 정도 쓰러지긴 했지만, 지금은 괜찮습니다."
1001202-38 = "네? 어쩌다 그렇게 되었냐고요?"
1001202-39 = "그게…… 최근 학교 내 시험을 준비하면서 자리에 앉아있는 시간이 많다 보니."
1001202-40 = "이전보다 운동량을 더 늘려야겠다고 생각한 나머지, 갑자기 오버 워크를 한 것이 화근이 된 것 같습니다."
1001202-41 = "[s] \"이미 충분히 잘하고 있는 것 아냐?\""
1001202-42 = "그렇지 않습니다."
1001202-43 = "트레이닝은 꾸준히, 계속, 확실히 해야 합니다."
1001202-44 = "그렇게 하지 않으면……."
1001202-45 = "[s] \"하지 않으면?\""
1001202-46 = "근손실이…… 생기거든요."
1001202-47 = "아시겠나요? 내가 지금껏 만들어온 근육들이 사라진다고 생각해보세요."
1001202-48 = "그건 지옥입니다. 고통입니다. 절대 있어서는 안 되는 일입니다!"
1001202-49 = "[s1] \"그, 그렇구나.\"\n[s2] \"지, 진정해.\""
1001202-50 = "아, 앗! 죄송합니다. 제가 잠시 흥분했습니다."
1001202-51 = "아, 앗! 죄송합니다. 제가 잠시 흥분했습니다."
1001202-52 = "후우……."
1001202-53 = "아무튼, 근손실을 피하기 위해 불가피한 일이었습니다."
1001202-54 = "[s] \"운동은 건강을 지키기 위해 하는 거야.\""
1001202-55 = "당연하죠. 저도 알고 있습니다."
1001202-56 = "그래서 이렇게 열심히……."
1001202-57 = "[s] \"<탈수 증상>을 겪는 사람이 건강하다고 할 수는 없잖아?\""
1001202-58 = "?!"
1001202-59 = "아, 네. 당연히…… 그렇겠죠."
1001202-60 = "죄송합니다. 선생님."
1001202-61 = "하아……."
1001202-62 = "평소엔 규칙적으로 트레이닝을 잘해 왔는데."
1001202-63 = "조금이라도 마음이 급해지면 이렇게 실수를 해버리고 맙니다."
1001202-64 = "누군가가 봐준다면 좋을 것 같은데…… 주변에 딱히 부탁할 사람도 없고."
1001202-65 = "어떻게 하는 게 좋을까요."
1001202-66 = "……."
1001202-67 = "[s3] 트레이닝을 도와주겠다고 말한다.\n[s4] \"준비된 트레이너, 지금 여기에 등장!\""
1001202-68 = "네?!"
1001202-69 = "네?!"
1001202-70 = "선생님이 도와주신다고요?"
1001202-71 = "그, 그래도 될까요?"
1001202-72 = "감사합니다! 선생님!"
1001202-73 = "아니, 이제부턴 트레이너라고 불러야 할까요?"
1001202-74 = "[s5] \"응, 그래도 괜찮아.\"\n[s6] \"트레이너라고 부르는 것을 허가하지.\""
1001202-75 = "네!"
1001202-76 = "네!"
1001202-79 = "자, 그럼!"
1001202-80 = "오늘의 트레이닝을 시작해볼까요?"
1001202-81 = "잘 부탁드립니다. 트레이너."
