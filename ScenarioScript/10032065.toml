[translation]
10032065-8 = "……여기로군, 지하 주차장."
10032065-9 = "음……. 아직 접선할 병력이 도착하지 않은 건가? 생각보다는 대응이 느린 걸."
10032065-10 = "아니. 불평하고 있을 때는 아니겠지. 그렇다면 접선 병력이 도착할 때까지 의뢰인을 지킬 뿐."
10032065-11 = "다행히 지형은 충분히 익숙한 형태의 지형이고……."
10032065-15 = "…………."
10032065-16 = "흥신소 68……."
10032065-17 = "이제 거의 다 왔다고 생각했는데, 곤란하게 됐군."
10032065-18 = "[s1] \"여기 있었구나, 사오리.\"\n[s2] \"카요코의 말대로였네.\""
10032065-21 = "선생까지……."
10032065-28 = "……잠깐만."
10032065-29 = "뭐, 뭐지……? 아란치노는……? 아란치노는 어디 간 거야?"
10032065-30 = "등에 그 보따리는 또 뭐고?"
10032065-34 = "설마라고 생각하지만, 일단은 묻겠는데……."
10032065-35 = "[s3] \"……설마 돈 아란치노?\"\n[s4] \"의뢰인을 포대에 싸서 온 거야?\""
10032065-38 = "……?"
10032065-39 = "……그렇다만, 무슨 문제라도 있나?"
10032065-44 = "……?"
10032065-45 = "……?"
10032065-50 = "[ns] \"……?\""
10032065-55 = "화, 확실히 괜찮은 방법일지도……."
10032065-56 = "푸하하하하! 굉장하잖아! 대담한 발상이네!!"
10032065-58 = "아니, 괜찮을 리가 없잖아. 아웃이라고, 완전히."
10032065-59 = "뭐, 뭐냐……? 그런 반응이면 마치 내가 뭔가를 잘못한 것 같잖나."
10032065-60 = "그리고 선생……? 왜 계속 흥신소 68과 같이 있는 거지?"
10032065-61 = "BD는 어떻게 된 거지? 혹시 지금 이것도 BD를 만드는 과정의 일환인가?"
10032065-63 = "……농담하는 거야, 진지하게 물어보는 거야?"
10032065-64 = "저쪽은 저쪽대로 뭔가 상식이 어긋나 있는 건가……."
10032065-66 = "……음?"
10032065-67 = "지금 그게 중요한 게 아니게 됐다고? 그건 또 무슨……."
10032065-79 = "……!"
10032065-80 = "마침 좋은 타이밍이군."
10032065-82 = "뭐, 뭐야……!? 뭔가 검은색 차량들이 쏟아져 들어 오고 있는데!?"
10032065-83 = "굉장한 수잖아?"
10032065-85 = "……늦었나."
10032065-86 = "제, 제가 전부……!"
10032065-91 = "기다려, 하루카. 지금은 일단 상황을 봐야 할 거 같아."
10032065-92 = "아무래도 보스를 데리러 온 갱단의 주 병력인 것 같으니……. 전부 상대하기엔 너무 많아."
10032065-100 = "모두 잘 왔다. 여기 의뢰인을……."
10032065-106 = "손들어! 꼼짝 마라!! 네놈은 포위됐다!!"
10032065-107 = "얌전히 보스를 내려놓아라! 그러면 목숨만은 살려주마!!"
10032065-111 = "……응?"
10032065-112 = "[ns5] \"사오리를 포위했어……?\"\n[ns6] \"어째서 사오리를 겨누는 거지……?\""
10032065-115 = "뭐, 뭐지? 이 상황은……?"
10032065-116 = "잠깐. 뭔가의 착오가 있다. 나는 당신들의 적이 아니야."
10032065-117 = "나는 착실하게 의뢰인의 일을 진행했을 뿐이다. 이렇게 의뢰인을 데리고 여기까지 왔잖나."
10032065-118 = "의뢰인……? 어떤 의뢰인을 말하는 거지! 누구냐, 누가 널 사주했지!!"
10032065-119 = "누구냐니, 그야……."
10032065-126 = "……이 사람이지."
10032065-127 = "이 사람이 자신을 안전하게 도피시켜 달라고 했다. 처음부터 약속돼 있었던 일이다만."
10032065-128 = "…………?"
10032065-129 = "그게 무슨……."
10032065-132 = "그게 무슨 말도 안 되는 소리야!? 지금 그걸 우리더러 믿으라는 거냐!?"
10032065-134 = "……?"
10032065-135 = "뭐라고?"
10032065-136 = "이 자식이 감히 우릴 바보 취급해!? 지금 걸렸다고 발뺌용 거짓말이라도 하는 모양인데……."
10032065-137 = "거짓말에도 성의라는 게 있다고! 성의라는 게!!"
10032065-139 = "또다시 이해하기 어려운 반응이……."
10032065-140 = "어째서 그렇게 되는 거지? 나는 누구도 바보 취급하지 않았다."
10032065-141 = "애초에 이 바닥에서 신참인 내가 일찍부터 일하던 당신들을 바보취급할 이유가 없지."
10032065-145 = "저 녀석, 아까부터 대체 뭐라는 거야……? 이게 바보 취급이 아니라고!?"
10032065-146 = "그 꼴을 보고도 지금 우리 보스를 '의뢰인'이라고 말하려는 거냐!? 그리고 우리더러 그걸 믿으라고!?"
10032065-148 = "이 꼴……? 그게 무슨 뜻이지?"
10032065-149 = "이건 효율적으로 이동하기 위한 방책이었다. 결과적으로 이렇게 빠른 이송을 마치지 않았나."
10032065-150 = "여기에 무슨 문제가 있다는 거냐?"
10032065-152 = "……진심이었구나."
10032065-154 = "…………."
10032065-155 = "[s7] \"사오리라면 그럴 수 있어……. 사오리라면…….\"\n[s8] \"효율……. 효율이란 무엇인가…….\""
10032065-158 = "으음……."
10032065-159 = "곤란하군. 아무래도 서로 간의 오해가 해결되지 않는 분위기인데……."
10032065-160 = "이렇게 된 이상 본인을 깨워서 직접 증언하게 하는 수밖에 없다."
10032065-161 = "이봐, 일어나. 일어나서 우리의 계약 상황을 설명해 줘야겠어."
10032065-162 = "……일어나."
10032065-167 = "으, 흐으……. 후에흐응으……."
10032065-168 = "이, 이 자식이 감히……!! 지금 보스를 친 거냐!?"
10032065-170 = "……???"
10032065-171 = "아니, 친 게 아니다. 난 그저 이 자를 깨우려고……."
10032065-172 = "더는 기다릴 수 없어! 어차피 상대는 한 명이다!! 전부 공격해!!"
10032065-173 = "공격이다, 공겨억-!!"
10032065-178 = "무, 무슨……!! 어째서 이렇게 나오는 거지!?"
10032065-182 = "……설마!!"
10032065-183 = "큭……. 그런 건가. 또 나는 함정에 빠진 건가……!!"
10032065-184 = "또 이렇게 이용만 당하고 버려질 계획이었단 말인가!!"
10032065-185 = "[s9] \"이번엔 조금 다른 느낌이지만…….\"\n[s10] \"사오리……. 그…….\""
10032065-190 = "……후우."
10032065-191 = "……하루카."
10032065-192 = "네, 네! 아루 님!!"
10032065-193 = "……돌입할 준비해. 지금부터 조마에 사오리를 지원할 거야."
10032065-194 = "네, 네!"
10032065-199 = "……네?"
10032065-204 = "응?"
10032065-205 = "아루 쨩, 지금 뭐라고 했어? 돌입한다고?"
10032065-206 = "……사장?"
10032065-207 = "어라……. 그러고 보니……? 저 사람은 우리 적 아니었나요……?"
10032065-208 = "아, 아니! 아니요! 절대 되물은 거 아니고요! 네, 네! 알겠습니다!! 지금 바로 준비하겠습니다!!"
10032065-215 = "[ns11] \"……아루?\"\n[ns12] \"도와주는 거야?\""
10032065-218 = "……흥. 돕다니, 말에 어폐가 있네."
10032065-219 = "그저 의뢰를 완수하려는 것뿐이야. 적과 적이 싸우고 있는 도중이라면, 우리에게도 기회가 있잖아?"
10032065-220 = "움직이지 않을 이유가 없지. 철저하게 계산적인 움직임으로 말이야."
10032065-221 = "……그래. 우리에게 이득이 될 수만 있다면, 상대가 누구든 상황에 따라 손잡기도 하는 것. 그것이 하드보일드의 세계."
10032065-222 = "양보도 협력도 없다고 불과 한 시간 전에 이야기했던 것 같긴 하지만 말이지~."
10032065-223 = "그, 그러니까 양보나 협력이 아니라고! 철저하게 '타깃을 가로채기 위함'이니까!!"
10032065-224 = "……그러니까……!"
10032065-225 = "[s13] \"……고마워, 아루.\"\n[s14] \"벌써 도움을 받게 되네.\""
10032065-230 = "……후후. 잡설이 길었네."
10032065-231 = "아무튼……."
10032065-232 = "모두 진입한다! 저 조마에 사오리를 지원하고, 이번에야말로 돈 아란치노를 탈환하는 거야!!"
10032065-233 = "……공격!!"
