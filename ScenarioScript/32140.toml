[translation]
32140-1 = "제14화;고백"
32140-2 = "선생님의 방"
32140-5 = "아하하…… 안녕하세요, 선생님. 아직 깨어 계셨군요……."
32140-6 = "[s] \"히후미도 잠이 안오나 봐.\""
32140-7 = "네…… 도무지 잠이 안 와서……."
32140-12 = "저도 왔어요♡"
32140-13 = "하나코 쨩……."
32140-18 = "다들 여기서 뭐하는 거야……."
32140-19 = "코하루 쨩까지……."
32140-20 = "내일이 시험이잖아! 쉬는 것도 중요하다며!"
32140-21 = "응, 그러게요……."
32140-22 = "아즈사도 어딘가 나가버린 것 같고……."
32140-23 = "뭐, 긴장되는 건 이해하지만……."
32140-24 = "……."
32140-25 = "좀 전에 시스터후드 분들을 잠깐 만나고 왔어요. 이것저것 알아볼 게 있어서……."
32140-26 = "내일 저희가 시험을 치를 제19분관……"
32140-27 = "서, 설마 장소가 바뀌었나요?!"
32140-28 = "아뇨. 장소는 그대로예요. 대신 거기에 정의실현부 전원이 파견되어 건물 전체를 격리하고 있다고 해요."
32140-30 = "!!?"
32140-31 = "건물 전체를……?"
32140-32 = "에덴조약에 필요한 중요 서류를 보호한다는 명목으로, 티파티의 요청으로 건물 전체가 정의실현부의 특별 방호에 들어갔다고 해요."
32140-33 = "그리고 본관 쪽에도 경비계엄 명령이 내려진 거 같아요. 어제부터 이상하게 조용했던 건 이것 때문인가봐요."
32140-34 = "겨, 경비 계엄…… 처음 봐요. 아우……."
32140-35 = "그 누구도 건물 안으로 들어갈 수 없고, 나갈 수도 없어요. 에덴조약이 체결되기 전까지."
32140-36 = "자, 잠깐? 그럼 어떻게 되는 거야? 내일 우리 시험은?"
32140-37 = "……즉, 그런 거죠. 시험을 치려면 정의실현부 전원을 상대해 봐라……."
32140-38 = "아……."
32140-39 = "그, 그런……. 내, 내가 하스미 선배에게 사정을 말해서……."
32140-40 = "불가능하겠죠. 코하루 쨩. 하스미 씨는 그 임무의 이유도 모르고 있을 거고."
32140-41 = "하스미 씨가 우릴 도와준다면 그것은 명백한 명령불이행. 하스미 씨 또한 정의실현부에서 퇴출될 거예요."
32140-42 = "……."
32140-43 = "이 메시지는 명확해요. 나기사 씨는 자신의 모든 힘을 다해서 보충수업부를 퇴학시키려고 한다……."
32140-44 = "어째서 그렇게까지……."
32140-49 = "나 때문이야."
32140-50 = "아즈사 쨩?! 어, 어디 갔다 온 거예요?!"
32140-51 = "……."
32140-52 = "모두들, 들어줘. 할 말이 있어."
32140-53 = "아즈사 쨩……?"
32140-54 = "……."
32140-55 = "아즈사……? 어, 어디 아파?"
32140-56 = "떨고 있어요……? 아즈사 쨩?"
32140-57 = "……모두에게 숨기고 있었던 게 있었어."
32140-58 = "이제 더 이상 숨길 수 없는 지경에까지 와버렸어……."
32140-64 = "티파티의 나기사가 찾는 <트리니티의 배신자>라는 건 바로 나야."
32140-68 = "……네?"
32140-69 = "응? 가, 갑자기 무슨 소리야?"
32140-70 = "……."
32140-71 = "나는 원래 아리우스 분교 출신이야. 지금은 서류 조작으로 트리니티에 잠입해 있는 거야."
32140-72 = "아, 아리우스요? 잠입……?"
32140-73 = "……."
32140-74 = "……."
32140-75 = "그, 그게 뭐야? 아리우스……?"
32140-76 = "아리우스 분교……. 오래 전에 트리니티의 연합을 반대했던 분파 학원이에요."
32140-77 = "그 때문에 분쟁이 발생했고 그 후 키보토스 어딘가에서 은둔한 채 숨어지내고 있었다고 들었는데……."
32140-78 = "맞아. 나는 여기 오기 전까지는 아리우스 자치구에서 벗어나 본 적이 없었어."
32140-79 = "나는 아리우스에서 시킨 임무를 지원하기 위해 이 학원에 잠입한 거였어……."
32140-81 = "그 임무는 바로……. 티파티 나기사의 헤일로를 파괴하는 것."
32140-82 = "네?! 뭐, 뭐라고요?! 그런……?!"
32140-83 = "즉, 그건…… 주, 죽인다는…… 얘기……?!"
32140-84 = "……."
32140-86 = "그래. 아리우스는 티파티를 없애기 위해서라면 무슨 짓이든 저지를 각오가 되었으니까."
32140-87 = "아리우스는 티파티의 다른 멤버 미카를 속여서 나를 이곳에 집어넣었어. 트리니티와 화해하고 싶다, 그런 거짓말을 했겠지."
32140-88 = "……확실히 미카 씨라면 정치에 적합하지 않다는 평가를 받고 있으니…… 속이기 쉬웠던 걸까요……."
32140-89 = "……아마 모든 일이 끝난 다음에는 그 죄를 미카 씨에게 덮어씌운다, 그런 흐름이었겠네요."
32140-90 = "아리우스가 트리니티를 증오하고 있다는 것은 알고 있었지만…… 이런 일을 꾸미고 있었을 줄은."
32140-91 = "자, 잠깐만…… 이거 무슨 이야기야……? 갑자기 우리들과는 아무 상관없는 무서운 이야기가 나오고 있잖아……."
32140-92 = "아즈사……? 아리우스인가 뭔가 하는 건 잘 모르겠고, 그거랑 우리 보충수업이랑 무슨 상관인 거야……?"
32140-94 = "……."
32140-95 = "……."
32140-96 = "……."
32140-101 = "내일 아침, 아리우스 분교 학생들이 나기사를 노리고 트리니티에 잠입해 들어올 거야."
32140-102 = "……나는 나기사를 지켜야 해."
32140-103 = "……."
32140-104 = "지, 지, 지키러 간다고요? 나기사 님을요?! 내, 내일……? 내일은……."
32140-105 = "?!"
32140-106 = "응. 그걸 막지 않으면 안 돼."
32140-107 = "내일은 마지막 평가 시험일……. 그리고 본관에는 경비 계엄이 내려져 있고, 또한 나기사 씨의 억지로 정의실현부가 본관을 비우고 있는 상태……."
32140-108 = "요인 습격에는 적절한 날이네요. 아리우스도 꽤 머리를 썼네요."
32140-109 = "하나코 쨩……."
32140-110 = "잠깐만! 무슨 소리야, 그럼!"
32140-111 = "아즈사는 높으신 분을 해치러 왔다며? 그런데 왜 구한다는 거야? 말이 안 맞잖아!"
32140-113 = "그건……."
32140-114 = "……. 아즈사 쨩은 처음부터 그 목적으로 트리니티에 온 거군요?"
32140-115 = "……."
32140-116 = "처음부터 나기사 씨를 지키기 위해 이 임무에 참가한 거예요. 말하자면 이중 첩자."
32140-117 = "아리우스 연락책에는 문제없다고 계속 거짓 보고를 해가면서, 사실은 그들을 배신하려고 준비하고 있었던 거네요."
32140-122 = "왜죠? 왜 나기사 씨를 지키려고 하는 거예요? 그건 누구의 명령인가요?"
32140-123 = "……그건 누구의 명령도 아닌 내 판단이야."
32140-124 = "나기사가 없으면 에덴조약이 취소될 거야. 그 평화 조약이 없어지면 앞으로 키보토스에 혼란은 더 가중되겠지."
32140-125 = "아리우스 같은 학원이 더 생기지 않을 거라고 볼 수 없어……."
32140-126 = "그러니까 평화를 위해서라는 건가요?"
32140-127 = "꿈같은 이야기네요. 정말 그 조약의 이름처럼 텅 비어있는 헛된 이야기예요. 아즈사 쨩."
32140-128 = "……."
32140-129 = "아즈사 쨩은 거짓말쟁이예요. 배신자예요."
32140-130 = "아즈사 쨩은 트리니티에서도 본 모습을 숨기고, 아리우스에서도 진심을 속였겠죠. 아즈사 쨩의 주변엔 속은 사람들 밖에 없었어요."
32140-132 = "하나코 쨩……."
32140-133 = "말했잖아. 나는 언젠가 모두를 배신하고, 믿음을 배신하고, 마음을 배신하게 될 거라고……."
32140-134 = "아, 아즈사 쨩……. 아우우……."
32140-135 = "애초에 나기사가 찾는 <트리니티의 배신자>는 나였어. 나 때문에 보충수업부가 이런 위험에 빠진 거야."
32140-136 = "미안해……. 나를 원망해도 좋아. 이 모든 건 내가 초래한 일이니……."
32140-137 = "[s] \"아냐. 아즈사.\""
32140-138 = "……선생님?"
32140-139 = "[s] \"우리가 이런 위기에 처한 것은, 나기사가 그 누구도 믿지 않았기 때문이야.\""
32140-140 = "……."
32140-144 = "[ns] \"나기사가 히후미를, 하나코를, 아즈사를, 하스미와 코하루를 믿었더라면.\""
32140-148 = "[ns] \"미카가 나기사를 믿었더라면.\""
32140-152 = "[ns] \"서로가 서로를 믿지 않았기 때문에 이렇게 된 거야.\""
32140-153 = "……."
32140-154 = "알고 있어요. 선생님. 사실은 저도 그걸 잘 이해하고 있어요."
32140-155 = "나기사 씨처럼, 믿고 싶지 않기에 믿지 않는 사람을 바꾸는 건 불가능에 가깝다는 것도 알아요……."
32140-156 = "그래도 아즈사 쨩은, 우리에게는 진심을 얘기해주었어요. 마치 당연하다는 듯이 사과를 했어요."
32140-157 = "그래서 그냥 심술을 부려보고 싶었어요. 아즈사 쨩의 투명한 얼굴을 보고 있으면 마구 괴롭혀주고 싶어지니까."
32140-158 = "……."
32140-159 = "보충수업부는 말하자면 모든 것이 노출된 스포트라이트를 받는 무대."
32140-160 = "원래라면 아즈사 쨩 같은 <첩자>는 이런 주목받는 곳에 오래 있어서는 안 되었을 거예요."
32140-161 = "아무도 모르게 몰래 사라진다거나, 적당한 방법은 많았겠죠."
32140-162 = "……하지만 그러지 않았죠. 아즈사 쨩은."
32140-163 = "……."
32140-164 = "왜냐면."
32140-165 = "……보충수업이 너무 즐거웠으니까."
32140-166 = "……!"
32140-167 = "공부를 배우는 것도, 다 같이 밥을 먹거나 빨래를 하는 것도, 청소를 하는 것도 어느 것 하나 즐겁지 않은 게 없었으니까."
32140-168 = "그래서, 이 즐거운 시간을 깨고 싶지가 않았던 거죠. 목표를 향해서 다 함께 노력하거나……."
32140-169 = "히후미 쨩, 코하루 쨩, 선생님…… 모두와 함께 몰랐던 걸 배워나가는 게 즐거웠으니까……."
32140-170 = "아닌가요, 아즈사 쨩?"
32140-171 = "……."
32140-172 = "그건……. 나는, 그런……."
32140-173 = "……."
32140-174 = "……아니, 맞아."
32140-175 = "즐거웠어. 그래서 그랬던 거 같아……."
32140-176 = "무언가를 배운다는 게…… 함께 무언가를 한다는 게……."
32140-177 = "그만두고 싶지가 않아서……."
32140-178 = "아직 더 많이 알고싶은 것도 많고……. 바다라든가, 축제나 놀이공원이나……."
32140-179 = "가보고 싶은 곳도, 더 알고 싶은 것도 아직 잔뜩 있어서……."
32140-180 = "아즈사 쨩……."
32140-181 = "……."
32140-182 = "……. 어떤 마음인지 알아요. 제가 알고 있는 어떤 사람이 있는데. 그 사람도 비슷한 마음이었거든요."
32140-183 = "……?"
32140-187 = "그 사람…… 말하자면 요령이 좋아서 무엇을 해도 주변에서 치켜세워주는 그런 타입의 사람은……."
32140-190 = "어머나. 우라와 씨는 정말 대단하시네요. 이런 문제들도 척척 다 해결해버리시고……."
32140-192 = "후후후. 우라와 님. 이 계획에는 당신의 조력이 필요합니다."
32140-194 = "저희와 함께 하지 않겠어요, 우라와 씨? 저 티파티를 견제할 수 있는 건 오직 우리만이……."
32140-196 = "준비를 해두시죠, 하나코 씨. 티파티의 내년 멤버는 당신이 확정적이니까."
32140-198 = "……하아."
32140-199 = "저는…… 그런 사람이 아니에요……."
32140-201 = "저는…… 저는……. 사실……."
32140-203 = "그 사람에게 트리니티 학원은 거짓과 가식과 껍데기로만 가득 차 있는 기만적인 공간이었어요."
32140-204 = "그 누구에게도 진심을 얘기할 수 없었고, 그 누구에게도 자신의 진짜 모습을 보여줄 수 없었죠."
32140-206 = "……."
32140-207 = "그건…… 외롭지 않나요?"
32140-209 = "……."
32140-210 = "그 사람에게 모든 것은 무의미했어요……. 그래서 학원을 그만두려고 했어요."
32140-211 = "그 사람에게 학원이란, 감옥과 다를 바가 없었거든요."
32140-212 = "하지만…… 아즈사 쨩은 그 사람과는 달랐어요."
32140-213 = "아즈사 쨩은, 이번 일이 끝나면 그걸로 학원 생활은 끝나는 거잖아요?"
32140-214 = "애초에 서류 조작으로 들어온 학원이고, 아리우스도 배신할 계획이니, 이 일이 끝나면 돌아갈 곳도 없어지는 거잖아요?"
32140-215 = "어……? 그, 그러고보니……."
32140-216 = "……."
32140-217 = "그런데도 아즈사 쨩은…… 보충수업에 최선을 다하더라구요."
32140-218 = "그 사람은 시험을 일부러 망쳐가면서 학원에서 도망치려고 하는데, 아즈사 쨩은 짧은 학원 생활을 위해 최선을 다해 노력하고 있었어요."
32140-219 = "왜……? 왜 그렇게까지 하는 거죠? 거기에 무슨 의미가 있다고? [ruby=vanitas vanitatum]모든 것은 헛되잖아요?[/ruby]"
32140-220 = "아즈사 쨩도 잘 알잖아요. 입버릇처럼 말하는 그 문장에 진실이 담겨 있잖아요."
32140-221 = "하지만…… 아즈사 쨩은 그 말 뒤에 꼭 덧붙이는 말이 있었죠."
32140-223 = "응. 이해했어. 모든 것이 헛될지라도 바로 오늘 최선을 다하지 않으면 안 돼."
32140-225 = "하지만 언제나 그렇게 괴롭힘 당하고 있기만 하면 안 돼. 모든 것은 헛되더라도 저항을 멈춰서는 안 되니까."
32140-227 = "그 순간…… 그 사람도 깨닫게 된 거예요."
32140-228 = "학원 생활의 즐거움을."
