[translation]
80000068-1 = "발렌타인 초콜릿의 기원"
80000068-2 = "……아! 선생님! 안녕하세요!!"
80000068-3 = "오늘은 발렌타인 데이입니다! 발렌타인 데이이니, 그에 맞게 저도 초콜릿을 준비했죠!"
80000068-4 = "음……. 사실 마음 같아서는 선생님과 함께 강의실에 가서, 발렌타인 데이의 기원에 대한 이야기를 나누고 싶기도 하지만……."
80000068-5 = "[s1] \"서, 설명은 나중에 하자.\"\n[s2] \"오늘은 기념일을 즐기자…….\""
80000068-6 = "하하하……. 역시 그게 맞겠죠? 설명이 필요하실 때라면 언제든 제가 달려갈 테니까요!"
80000068-7 = "하하하……. 역시 그게 맞겠죠? 설명이 필요하실 때라면 언제든 제가 달려갈 테니까요!"
80000068-8 = "그 대신, 오늘의 저는 이걸 준비했습니다! 빠밤 빠밤!!"
80000068-13 = "어떤가요? 선생님이 보시기에는, 어떤 느낌이 드시나요?"
80000068-14 = "[s3] \"옛날 스타일의 포장이네.\"\n[s4] \"혹시 이걸로 설명을 대신하는 거야?\""
80000068-15 = "후훗. 후후훗……!"
80000068-16 = "후훗. 후후훗……!"
80000068-17 = "네, 정답! 바로 그것입니다! 역시 선생님, 척하면 척이시군요!"
80000068-18 = "아무래도 선생님, 오늘은 많이 바쁘실 것 같은 느낌도 있고 말이죠……. 제가 시간을 많이 빼앗기도 어려울 것 같고……."
80000068-19 = "아니면 반대로, 선생님께선 발렌타인 데이나 초콜릿의 유래 정도는 이미 알고 계실지도 모르고……."
80000068-20 = "여러 가지 고민을 한 끝에, 어느 상황에서도 자연스러울 수 있는 것을 나름대로 고민해 보았답니다."
80000068-21 = "바로 이게 그 답이란 거죠. 최초의 발렌타인 초콜릿을 그대로 본떠 만든, 말하자면 발렌타인 초콜릿 복원품!"
80000068-25 = "그러니 선생님께 이걸 전해 드리고, 오늘만큼은 이걸로 설명이 충분하다 생각하며 저는 이만 퇴장……!"
80000068-32 = "……을……?"
80000068-33 = "[s5] 코토리를 붙잡는다.\n[s6] \"퇴장하지 않아도 돼.\""
80000068-34 = "……어라? 선생님? 이건 또 제가 생각하지 못한 방향의……."
80000068-35 = "……어라? 선생님? 이건 또 제가 생각하지 못한 방향의……."
80000068-36 = "……네?"
80000068-37 = "설명은 괜찮지만……. 시간을 쓰는 건 상관없다고요……? 그게 무슨 말씀이시죠?"
80000068-38 = "……아."
80000068-39 = "……같이 먹자고요? 저랑……? 이걸……?"
80000068-43 = "후후……. 정말 매일같이 저를 놀라게 하시는군요, 선생님은."
80000068-44 = "선생님에 대해 스스로 설명할 수 있을 만큼 알려면, 앞으로도 시간이 많이 필요할 것 같아요."
80000068-45 = "좋아요! 마침 바로 옆에 강의실도 비었으니, 들어가서 같이 드시죠!"
80000068-46 = "그리고……."
80000068-50 = "……고맙습니다. 선생님."
80000068-52 = "(이후 코토리와 강의실에서 초콜릿을 맛있게 나눠 먹었다.)"
80000068-56 = "(그리고 결국은 발렌타인 데이에 대한 설명이 터져 나오는 걸 막지 못했다.)"
