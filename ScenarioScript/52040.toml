[translation]
52040-1 = "제4화;카데노코지 가의 귀인"
52040-6 = "저희 카데노코지 가문은 오래전부터 백귀야행 내외의 여러 조직 및 가문과 교류하며 두루 연을 쌓아왔습니다."
52040-7 = "백귀야행을 방문한 명사들께 임시로 숙식과 거처를 제공해 드리기도 하고, 그 대가로 가문의 일에 약간의 도움을 받기도 하였답니다."
52040-8 = "마침 현재 카데노코지 저택에는 저희 가문이 오래전부터 신세를 져 온 의원 한 분이 머무르고 계시거든요."
52040-13 = "의원…… 이라고?"
52040-15 = "예. 비록 이름이 널리 알려진 분은 아니지만, 신묘한 의술을 갖추고 계신 분인지라. 저도 예전에 그분이 주신 약을 먹고 병을 고친 기억이 있답니다."
52040-16 = "무녀의 소임을 내려놓은 지금, 카데노코지 가문의 도움을 받는 것이 내키지는 않지만……"
52040-17 = "나구사 선배의 팔을 치료하기 위해서라면 수단과 방법을 가릴 때가 아니니까요!"
52040-23 = "……유카리. 미안하지만 이 팔은—"
52040-28 = "어머나? 돌아오셨군요, 아가씨."
52040-36 = "최근 연락을 안 받으셔서 얼마나 걱정했는지. 지금이라도 저택에 돌아오셔서 얼마나 다행인지 몰라요."
52040-37 = "이렇게 갑자기 연락도 없이 찾아오시다니, 혹시 지금이라도 마음이 바뀌어 무녀의 일을 다시 맡아주시기로—"
52040-46 = "……는 아니신 것 같군요."
52040-47 = "어서 오세요, 아가씨의 친구 여러분들."
52040-48 = "한창 백화요란의 일로 바쁘실 터인데, 저희 가문에는 무슨 일로 찾아오셨을까요?"
52040-49 = "소녀, 염치없지만 카데노코지 가문의 여식으로서 사적인 부탁을 하나 드리고 싶사와요."
52040-50 = "부, 부탁이요? 아가씨께서 원하시는 게 있으시다면 명하시면 될 것을, 무슨 황송한 말씀을……"
52040-51 = "지금 저택에 머무르고 계신 의원님을 불러 주시겠어요?"
52040-55 = "갑자기 의원님을요? 설마, 아가씨 다치신 곳이라도……"
52040-56 = "다친 것은 제가 아니라 선배님이에요."
52040-57 = "다친 이를 떠나 상처의 치료는 경각을 다투는 일이니, 어서 의원님을 불러 주세요."
52040-61 = "……알겠습니다. 금방 모셔 오겠습니다."
52040-68 = "(잠시 후……)"
52040-73 = "아가씨, 의원님을 모시고 돌아왔습니다."
52040-78 = "……이런, 환자인가요?"
52040-83 = "개인적인 사정이 있어 당분간은 약을 만들지 않으려 했습니다만……"
52040-84 = "그래도 편의를 봐 주시고 계신 카데노코지 가문의 얼굴을 보아 진료 정도는 봐 드리지요."
52040-86 = "어머나……"
52040-88 = "(이 여자…… 어딘가 낯이 익은데……)"
52040-93 = "앗, 저 여자……!"
52040-97 = "무슨 일이야, 렌게. 혹시 아는 사람이야?"
52040-98 = "아니…… 그게 아니라 쓰고 있는 안경, 엄청 힙한데. 도대체 어디서 산 걸까?"
52040-103 = "그건 아무래도 상관없잖아!"
52040-108 = "처음 뵙겠습니다, 백화요란 여러분. 저는 키보토스 곳곳을 이리저리 떠돌며 의술을 연마 중인 방랑 의사, '리쿠'라 합니다."
52040-109 = "사정이 있어 거처를 구하지 못하던 중에 카데노코지 가에서 편의를 제공해 주셔서 잠시 몸을 의탁하고 있었지요."
52040-110 = "변변찮은 의술이지만 카데노코지 가에 도움이 될 수 있다면 기쁘게 협력하겠습니다."
52040-111 = "기꺼이 그리 말씀해 주시니 참으로 감사한 것이어요."
52040-112 = "상태를 봐주셨으면 하는 부위는 이분의 팔입니다만……"
52040-119 = "으음, 외상인가요……? 제 전문 분야는 내과인지라 치료할 수 있을지 확신은 없습니다만……"
52040-124 = "그래도 일단은 확인해 보지요. 자, 붕대를 걷어 주시길."
52040-125 = "………."
52040-135 = "역시…… 다시 보아도 심각한 상처네요."
52040-136 = "어때, 이 팔의 상처를 고칠 수 있겠어?"
52040-141 = "호오……?"
52040-142 = "혹시 팔에 통증이 있으십니까?"
52040-146 = "……아주 가끔씩."
52040-147 = "그렇다면 이 통증의 원인은 환지통이군요."
52040-151 = "……환지통?"
52040-152 = "네, 환지통— 흔히 환상통이라고 불리는 일종의 신경 질환입니다."
52040-153 = "신체 부위의 일부가 결손, 혹은 절단되었을 때 사라진 신경 말단에 가짜 자극이 가해져서 '없는 부위'에 극심한 통증을 느끼는 것이지요."
52040-155 = "그게 무슨……"
52040-156 = "그게 무슨 돌팔이 같은 소리야? 나구사 선배의 팔은 여기 제대로 붙어 있잖아?!"
52040-158 = "아뇨, 환자의 팔은 이곳에 없습니다."
52040-159 = "색을 보아하니 오래전…… 어림잡아 수개월 전에 절단되었고, 현재는 다른 곳에 방치되어 있겠군요."
52040-160 = "앞을 분간할 수 없는, '황혼' 속의 어스름이라던가?"
52040-164 = "……그걸 어떻게?"
52040-165 = "저는 일전에 다양한 효능의 약재를 구하기 위해 키보토스 곳곳을 돌아다녔습니다."
52040-166 = "야생의 동식물은 나고 자란 곳에 따라 그 모습과 효능이 달라지기는 하나, 백귀야행 북방 자치구에서 채집한 몇 개의 식물은 독특한 형질을 띄고 있더군요."
52040-167 = "분명 본래의 성질은 그대로 유지하고 있으나, 날 때부터 '죽은 것처럼' 다른 살아있는 존재와 공존하지 못하는 그림자와 같은 형질……"
52040-168 = "그곳의 주민들은 이를 두고 황혼에 먹힌 것이라고 불렀습니다."
52040-169 = "……어떻습니까. 당신의 그 팔도 황혼에 먹혀, 북쪽의 땅에 버려두고 온 것이 아닌지?"
52040-173 = "……맞아. 이 팔의 상처는 황혼에게 당한 흔적이야."
52040-178 = "이 의사, 돌팔이인 줄 알았더니 은근히 예리한 구석도 있잖아? 팔이 다친 곳을 단번에 알아내다니."
52040-179 = "……렌게. 일단은 카데노코지의 손님이시니, 말을 삼가 줄래."
52040-181 = "바로 상처의 원인을 알아내시다니, 역시 명의셔요!"
52040-182 = "그래서…… 나구사 선배의 이 팔은 어떻게 해야 치료할 수 있는 것인가요?"
52040-186 = "환지통을 완벽히 치료하는 방법은 단 하나, 잃어버린 신체를 다시 이식하는 것뿐이지요."
52040-187 = "황혼 속에 버려진 진짜 팔을 찾기 전까지, 이 고통은 끊임없이 계속될 겁니다."
52040-194 = "역시 그곳에 돌아가지 않으면 안 되는 건가……"
52040-195 = "그 외의 방법은, 없는 건가요?"
52040-196 = "대증요법에 불과하지만 가벼운 체조가 통증을 완화하는 데 도움이 된다는 의견도 있더군요."
52040-197 = "옛 지인이 건강을 위해 즐겨 하던 체조가 하나 있는데, 괜찮으시다면 메일로 영상을 보내 드리지요."
52040-198 = "고마워. 한 번 참고할게."
52040-199 = "하지만 이것만큼은 명심하시길."
52040-205 = "시간이 모든 것을 치료해 주지는 않습니다. 오히려 때를 놓치면 영영 치료할 방도를 찾을 수 없게 되는 경우도 있죠."
52040-206 = "부디 선택을 미루다 중요한 때를 놓치지 마시길."
52040-210 = "………."
52040-211 = "그럼, 쾌차를 기원하겠습니다."
52040-217 = "멀쩡한 팔을 다시 붙여야 한다니, 낮도깨비같은 소리를 하는 의원이네. 정말로 믿어도 괜찮은 걸까?"
52040-218 = "하지만 나구사 선배의 말처럼 그 팔이 황혼에 의한 상처라면, 평범한 방법으로 치료할 순 없겠지."
52040-219 = "소녀도 황혼에 넘어간 존재를 되돌리는 방법에 대해서는 들은 바가 없사와요……"
52040-220 = "애초에 <황혼>이나 <백물어>의 존재도 지난 사건 전까지는 쿠즈노하 님의 이야기처럼 전설로만 여겨지던 존재인데, 이를 대처하는 방법을 논한다 하더라도……"
52040-227 = "잠시, 이야기를 들어줄 수 있을까?"
52040-228 = "사실 나는…… 너희들에게 하지 못했던 말이 하나 더 있어."
52040-234 = "내 부끄러움과 두려움 때문에 말하지 못했던 그날의 이야기를."
52040-238 = "그날, 아야메와 무슨 이야기를 나누었는지. 너희들에게 모두 말해줄게."
52040-242 = "다음화;기억 저편의 그리움"
