[translation]
10029030-1 = "제3화;여행지에 놀러 온 사람처럼"
10029030-2 = "(히마리의 연락을 받고, 다시 히마리가 있는 초현상특무부 관제실로 향했다.)"
10029030-11 = "……!! 이세계!!!"
10029030-12 = "진짜로 이세계에요, 이거 봐요!! 세상에 이럴 수가……!!"
10029030-13 = "이, 이건 꿈이 아니야. 달라요! 인디언 포커랑은 달라!! 진짜 오컬트……!!"
10029030-14 = "그러니까 조금만 얌전히 있어 주시면 좋을 것 같은데 말이죠. 아무리 저 같은 초천재병약미소녀해커를 만나서 황송하시다곤 해도……."
10029030-15 = "저희 입장에선 여러분이 '이세계인'이니 서로가 신기한 건 매한가지……."
10029030-16 = "저거 봐요! 창문 밖으로 하늘에도 뭐가 떠 있어요! 그리고 사람들도……! 도, 동물!? 로봇!?"
10029030-18 = "듣고 있지 않으시군요……."
10029030-22 = "……아. 오셨나요, 선생님?"
10029030-23 = "[s1] \"돌아왔어, 히마리. 그런데…….\"\n[s2] \"저 친구가 그……?\""
10029030-26 = "……네. 맞답니다. 밀레니엄 폐허에서 에이미가 데리고 온 세 사람 중 한 명."
10029030-27 = "사텐 루이코 씨……라고 하시더군요. 꽤나 명랑한 자기소개였어요."
10029030-28 = "……!! 아앗! 또 새로운 이세계인이!!"
10029030-29 = "어라? 어쩐지 한 분은 어른이시네요? ……안녕하세요!"
10029030-30 = "그러고 보니 어라…… 토키와다이 중학교 분들……?"
10029030-31 = "……!? 어라, 미사카 씨……!?"
10029030-32 = "[s3] \"아는 사이야?\"\n[s4] \"이 친구 뭔가 친근한 느낌이네.\""
10029030-35 = "아아. 뭐야, 사텐 씨였구나."
10029030-36 = "……하아."
10029030-37 = "왜 한숨을 쉬시는 거죠!? 왜, 왜 아쉬워하시는 건가요!? 역시 시라이 씨가 아니라서……!"
10029030-38 = "거기서 쿠로코가 왜 나와!? 반대야, 반대! 안도의 한숨이라고!!"
10029030-39 = "사텐 씨라면 그래도 괜찮으니까! 혹시나 누구처럼 수상한 짓 하지 않을까 걱정하지 않아도 되니까!"
10029030-41 = "그러니까 아무 짓도 안 했대도……?"
10029030-42 = "계속 그런 식으로 나오면, 모함받는 게 억울해서라도 진짜 손을 한 번 써 보는 수가……."
10029030-43 = "[s5] \"화, 화제를 돌려볼까!\"\n[s6] \"히, 히마리! 본론으로 넘어가 줘!\""
10029030-46 = "후후. 역시……. 절박해지니 절 찾으시는 건가요, 선생님? 어쩔 수 없군요. 역시 저밖에 없지요?"
10029030-47 = "하지만 괜찮아요. 다른 사람도 아닌 바로 저이니만큼, 그 이상 합당한 판단은 없는 것 또한 사실."
10029030-48 = "물론, 지금 상황에 대한 파악과 해답 또한……. 모두 다 준비해 두었고 말이죠."
10029030-49 = "그 '설비'와 관련된 이야기야? 해석이 끝난 모양이네."
10029030-50 = "당연하죠. 누차 말씀드렸듯, 이 초천재병약미소녀해커에게 불가능한 건 없으니까요."
10029030-52 = "……잠깐. 지금 자기 입으로……."
10029030-53 = "미사카 씨. 저런 타입은 건드릴수록 말이 길어지니 그냥 두는 게 좋다고 생각하는데."
10029030-54 = "기뻐하셔도 좋아요. 여러분을 이곳으로 불러온 설비와 재가동 방법에 대해서도 파악이 모두 끝났으니까요."
10029030-55 = "오작동을 일으킨 부분을 수리하고, 정상화한 후 재가동만 한다면 여러분은 다시 원래 있어야 할 곳으로 돌아갈 수 있답니다."
10029030-56 = "……수리가 필요하다는 뜻인가요? 그럼 수리 방법은……."
10029030-57 = "물론 그에 대한 준비도 모두 마쳐 두었죠. 어린아이라도 할 수 있을 정도로 간단하게 만들어서 말이죠."
10029030-58 = "……선생님. 이 칩을 받아주시겠어요?"
10029030-59 = "[s7] \"이걸 꽂기만 하면 되는 거야?\"\n[s8] \"설비에 이걸 꽂는 곳이 있는 거야……?\""
10029030-62 = "네. 간단하죠? 원래도 완벽한 저이지만, 이쪽은 특히나 전문 분야니까요."
10029030-63 = "설비의 위치와 최단 루트도 거의 다 완성됐답니다. 출발하기 전에 따로 알려 드릴게요."
10029030-64 = "사실 그냥 찾아가서 파괴해 버려도 저희 쪽에는 문제가 없겠지만……."
10029030-65 = "혹시라도 모를 문제를 미연에 방지하려면, 오신 분들도 안전하게 돌려보내 드리는 게 더 안정적이겠지요."
10029030-66 = "어쨌거나 세 분이 오신 시점에서, 두 세계는 약간이라곤 하지만 섞인 상태라고 봐야 하고."
10029030-67 = "그리고……."
10029030-73 = "……찾아온 손님은, 정중하게 배웅해 드리는 게 예의잖아요?"
10029030-74 = "반대로 생각하면, 이왕 여기까지 오셨으니 출발 전에 좀 둘러보고 오시는 건 어떨까요?"
10029030-75 = "이전에는 무단이탈이었지만, 지금은 선생님도 계시겠다, 별문제는 되지 않을 거예요."
10029030-79 = "……아무리 돌아가신 뒤에는 아무 기억도 못 하실 가능성이 높다고 하더라도요."
10029030-80 = "……음?"
10029030-81 = "기억을 못 한다고? 그건 무슨 뜻일까?"
10029030-82 = "말씀드린 그대로예요. 여기서의 일은, 물리적으로 여러분의 입장에선 '발생한 적 없는 일'이 될 것이거든요."
10029030-83 = "돌아가신 뒤에는 각자 여기 오시기 전의 상황에서 그대로 이어지고……."
10029030-84 = "뇌리에 기억된 자극도 없는 상태로 전이될 테니, 애초에 '일어나지 않은 일'을 기억할 수도 없는 법이죠."
10029030-85 = "네에-!? 그럼 꿈이나 다름없잖아요, 아니 꿈보다 못하잖아요!?"
10029030-86 = "모처럼 이세계로 넘어온 경험을 한 건데……! 뭔가 방법이 없나요? 아깝다고요, 그런 건!!"
10029030-87 = "사, 사텐 씨. 그렇게 무슨 여행지에 놀러 온 사람처럼 굴어도 좀……."
10029030-88 = "후후. 그러네요. 여행지라……."
10029030-89 = "오히려 그런 감각으로 있어 주신다면 저희로서도 편하겠어요. 좋은 인상을 가져 준다면, 현지인들로서는 나쁠 게 없겠죠."
10029030-90 = "하지만 그 부분만큼은, 아무리 굉장한 저라도 어떻게 할 수 없는 부분이겠네요. 애초에, 이쪽의 일이 아니니까요."
10029030-91 = "그 대신이라고 하긴 뭐하지만……."
10029030-92 = "……선생님?"
10029030-93 = "[s9] \"……좋아. 내게 맡겨.\"\n[s10] \"이런 가이드라면 즐겁지.\""
10029030-96 = "후후. 네. 그 부분은 어련히 알아서 잘해주시겠죠. 부탁드리겠습니다."
10029030-101 = "……? 무슨 소리야?"
10029030-102 = "가이드라니? 여행? 지금 폐허로 출발하지 않는 거야?"
10029030-103 = "뭐, 그래도 상관은 없지만요. 하지만 이미 오늘은 시간도 조금 늦었고……."
10029030-104 = "괜찮지 않겠어요? 하루 이틀 정도는……. 조금 놀다가 가셔도."
10029030-105 = "……으음."
10029030-106 = "이해가 안 돼."
10029030-107 = "기억하지 못하는 일이라고 했잖아. 없었던 일이 될 거라면, 굳이 할 필요가 있을까?"
10029030-108 = "그다지 효율적인 행동은 아니라고 생각해."
10029030-109 = "후후……. 그렇죠. 에이미라면 그렇게 말할 거라고 생각했어요."
10029030-110 = "그런 의미에서도, 선생님과 함께 하는 여행 가이드-에 에이미를 함께 부탁하고 싶네요."
10029030-111 = "괜찮겠어요, 에이미?"
10029030-113 = "……??? 무슨 이야기인지 통 모르겠어."
10029030-114 = "물론 부장이 시킨다면 하는 건 당연히 문제가 없어. 하지만 의도를 전혀 모르겠는걸."
10029030-115 = "나는 보디가드 역할인 거야?"
10029030-116 = "음……. 그러죠. 지금은 그 정도로도 좋아요. 다른 분들은 어떠신가요? 세 분은?"
10029030-117 = "……? 어, 나?"
10029030-118 = "뭐, 뭐. 상관없지 않겠어? 보아하니 뭔가 심각한 일은 아닌 것 같아서 다행이고……."
10029030-119 = "잘 됐지, 뭐. 오히려 다 놓고 하루 이틀 정도 환기한다고 생각하면 나쁠 것도 없어 보이는데."
10029030-120 = "맞아요!! 이왕 여기까지 왔다고요!! 그냥 바로 돌아가는 건 너무 아깝잖아요! 기억 못 하는 것도 아까운데!!"
10029030-121 = "……그러니까 기억을 못하는데 왜 굳이……."
10029030-122 = "……뭐, 완전히 나랑 상관없는 곳에 왔다는 것도. 어떤 의미로는 치유되는 하루가 될 거 같고. 괜찮지 않겠어?"
10029030-123 = "그럼 뭐……. 아무 데나 나가서, 해 지기 전까지 돌아오기만 하면 되는 걸까?"
10029030-124 = "선생님만 동행이라면? ……각자 개별로 활동하는 것도?"
10029030-125 = "…………."
10029030-126 = "후후……. 맞아요. 다들 적응력이 좋으시네요. 저쪽 동네도 꽤 재미있는 곳인가 봐요?"
10029030-127 = "재미……인가. 하하……. 표현하기에 따라 다르다고 생각하긴 하지만……. 뭐, 일이 많긴 하지."
10029030-128 = "……그, 그럼 선생님……! 괜찮으시다면, 지금 바로……!"
10029030-129 = "시간이 없어요! 이러고 있는 동안에도 자유 시간은 지나가고 있다고요! 빨리 나가죠!"
10029030-130 = "둘러볼 곳 추천은, 선생님께 부탁드릴게요!"
10029030-131 = "……네?"
10029030-132 = "그 전에 받아야 할 게 있다고요? 어……? 그게 뭐죠?"
10029030-133 = "……아. 맞아. 나도 그런 소릴 들었었지."
10029030-134 = "미사카 씨? ……무슨 이야기인지 아시나요?"
10029030-135 = "응. 지금 이거 이야기야. 보이지?"
10029030-136 = "이제 저 선생님이 사텐 씨한테도 건네 줄 거야. 이 동네의 '상식'이라는 거."
10029030-137 = "어……. 아, 네에……."
10029030-144 = "오……. 이건 또 무슨 참신한 이야기……. 총이……. 상식……이라고요?"
10029030-145 = "잊을 만할 때마다 한 번씩, 새삼 이세계라는 게 실감 나네요……."
10029030-146 = "뭐, 이 세계에선 책가방이나 액세서리 정도의 느낌으로 받아들여지는 거 같더라고. 내가 말하고도 믿기 힘들지만……."
10029030-147 = "뭐라더라, 이게 없이 다니는 건 전라보다 더 이상하다……라던가."
10029030-148 = "……??"
10029030-149 = "……뭐라고요?"
10029030-150 = "…………전라?"
10029030-154 = "그, 그런 건가요!? 그럼 저……."
10029030-155 = "방금 전까지 밖에서 전라보다 심한 상태로……!!"
10029030-156 = "[s11] \"아니, 아무리 그래도 그 정도는 과장이야…….\"\n[s12] \"자, 자! 어서 나가자! 1분이라도 더 즐겨야지!\""
10029030-161 = "…………."
10029030-162 = "……에이미."
10029030-163 = "응. 부장."
10029030-164 = "……그럼 다녀올게."
10029030-170 = "(그렇게 하루 종일 이곳저곳을 돌아다니며, 세 사람이 보고 싶은 곳들을 소개시켜 주었다.)"
10029030-171 = "(해가 다 진 밤이 돼서야 돌아온 세 사람은, 지친 탓인지 기절하듯 곤한 잠에 빠져들었다.)"
