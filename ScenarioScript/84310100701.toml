[translation]
84310100701-6 = "……정말로 듣고 싶은 거야, 그 '미완율'의 사정?"
84310100701-7 = "아, 아뇨. 그런 뜻은 아니었어요. 반대로 2%에 들어가기 위한 수준이 어느 정도인지가 궁금해서요."
84310100701-8 = "……네루 정도면 괜찮을 거라고 생각해."
84310100701-10 = "아니, 아슬아슬한데. 작전을 위해 움직이는 것과 계속해서 운동하려고 뛰는 건 별개잖아."
84310100701-11 = "……감정적으로 오기가 생기면 완주할 거야."
84310100701-12 = "그건……"
84310100701-13 = "……그럴 거 같……긴 하네."
84310100701-14 = "(그 정도였군요. 대충 짐작이 가네요.)"
