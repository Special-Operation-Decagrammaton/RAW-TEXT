[translation]
10013090-1 = "제9화;그리고 찾아온 여름의 끝은"
10013090-5 = "노노미~ 갑니다~☆"
10013090-9 = "끄, 끄아악?! 이 녀석들! 역시! 무진장 세?!"
10013090-10 = "으헤~ 뭐, 이 정도는 가뿐하지~"
10013090-11 = "좋았어! 이대로만 쭉쭉 나가면……!"
10013090-12 = "앗! 그런데……! 시즈코 공! 주군은……? 지금 어디 계신 거죠?"
10013090-13 = "어……?"
10013090-19 = "크, 크윽! 이게 대체……! 어떻게 된 거지! 처음부터 아비도스 놈들은 절대로 부를 생각도 없었거늘!"
10013090-20 = "어째서…… 여기까지 와서 날 방해하는 거냐……! 아비도스! 간신히 여기까지 판을 키웠거늘!"
10013090-21 = "[s] \"그러게, 댁도 운수가 사납네.\""
10013090-22 = "……하지만 지난날의 사건 이후, 나도 배운 게 없는 건 아니다!"
10013090-23 = "학생들이 보여주는 신기할 정도의 단결력과 힘 그건 전부, 네놈. 샬레의 선생이 있기에 성립하는 것이지!"
10013090-24 = "그러니, 그 틈새에서 네놈만 제거한다면 흐름을 다시 가져올 수 있을 터!"
10013090-25 = "[s] \"그래서 납치했다는 거구나.\""
10013090-26 = "하! 이런 상황에서도 여유를 가장하다니. 웃기지도 않는군."
10013090-27 = "이대로 인질로 삼아서, 아비도스 녀석들로부터 네놈을 방패로 써먹어 주마!"
10013090-28 = "뒤늦게 이런 일에 끼어들었다고 후회해도 이미 늦었다!"
10013090-29 = "[s] \"그게, 공교롭게도 이전에 비슷한 일을 겪은 적이 있었거든.\""
10013090-30 = "……?"
10013090-31 = "[s1] \"그리고 또 하필 바로 직전에, 그 기억을 떠올리게 되었달지.\"\n[s2] \"타이밍이 좋았달지. 좋지 않았달지.\""
10013090-34 = "네놈 대체 무슨 헛소리를 하는……."
10013090-42 = "무, 무슨 일이냐?!"
10013090-43 = "아비도스 놈들이라면, 헬멧단이 물고 늘어지고 있을 텐데?!"
10013090-51 = "보, 보스! 보고입니다! 외, 외곽에서부터 정체불명의 적이 접근 중……!"
10013090-52 = "패턴…… 진홍입니다!"
10013090-53 = "패턴……? 진홍……? 무슨 헛소리"
10013090-61 = "우후후,"
10013090-66 = "우후후후훗,"
10013090-70 = "우후후후후후!!!!"
10013090-72 = "적의 증원이라고?!"
10013090-74 = "[ns] \"안녕, 와카모. 연락을 받고 바로 달려와 줬구나.\""
10013090-75 = "네에! 저 와카모! 마침 근처에 있던 덕분에 당신의 부름을 받고 곧장 달려왔습니다!"
10013090-76 = "아아~ 지난날의 오해 때문에 그때에는 당신께 실수를 저지르고야 말아버렸사옵니다만."
10013090-77 = "……이번엔 당신께서 직접 호출해주신 몸."
10013090-78 = "악당에게 억류된 당신을, 지금 당장 구해드리겠습니다아!"
10013090-79 = "쏴, 쏴라!"
10013090-83 = "후후, 소용없답니다! 네 소용없어요!"
10013090-87 = "선생님을 향한 제 사랑 앞에서는 그 어느 것도!"
10013090-99 = "제, 제길!"
10013090-103 = "[ns] \"아, 도망갔다.\""
10013090-107 = "어쩔 수 없지! 일단 철수한다! 헬기에 시동 걸어!"
10013090-108 = "네, 넵!"
10013090-113 = "크윽! 아비도스! 샬레의 선생! 거기다 백야당의 네놈들까지!"
10013090-114 = "오늘은 이렇게 얌전히 물러가겠지만 다음번엔……!"
10013090-120 = "감히 주제도 모르고 사랑하는 저의 선생님을 해하려고 한 멍청이를,"
10013090-121 = "이대로 놓칠 것 같으신가요?"
10013090-125 = "어……?"
10013090-136 = "(그렇게 카이저 이사(?)와의 한바탕 소동이 끝난 뒤.)"
10013090-141 = "[ns] \"고마워. 와카모. 괜히 폐를 끼쳤네.\""
10013090-142 = "아, 아, 아뇨! 저 와카모! 비록 오해라고는 했으나, 이전에 선생님께 폐를 끼친 걸 여기서 속죄할 수 있어서 오히려 다행이라고 할까……"
10013090-143 = "저기, 그게……."
10013090-149 = "와카모가, 도움이, 되었을까요?"
10013090-150 = "[s] \"응, 덕분에 살았는걸. 생명의 은인이나 다름없어.\""
10013090-151 = "제가…… 당신의, 은인……?"
10013090-152 = "앗, 아아앗! 당신께서는 감히, 돌이킬 수 없을지 모를 폐를 끼쳐버린 저에게, 여전히 이렇게나…… 이렇게나 다정한 말씀을……!"
10013090-153 = "[s] \"저기, 괜찮으면 같이 돌아가서…….\""
10013090-154 = "와카모! 이 기쁜 마음을 주체할 수 없어서!!"
10013090-155 = "이만, 그, 도, 도, 돌아가 보겠습니다아~!"
10013090-159 = "[ns] \"아, 으응……. 잘 가.\""
10013090-164 = "(그렇게 와카모를 떠나보낸 다음, 다시 현장으로 돌아왔을 때는 이미 대강의 상황이 정리된 뒤였다.)"
10013090-165 = "앗! 주군!"
10013090-166 = "갑자기 자리를 비우시길래 걱정했어요!"
10013090-167 = "선생님……. 화장실, 갔다 왔어?"
10013090-168 = "[s] \"아니, 잠깐 볼일이 있어서 어쩌다 보니…….\""
10013090-169 = "선생님?! 카이저 이사는?! 아니, 영업사원이라고 했던가?! 하여간 녀석은?!"
10013090-170 = "[s] \"정의의 심판을 받았어.\""
10013090-171 = "으, 응? 이젠 볼 수 없을지도 모르고, 혹은 또 나타날지도 몰라……?"
10013090-172 = "뭐야? 그게? 슈뢰딩거의 뭐인가, 하는 그런 거야?"
10013090-173 = "[s] \"그보다 상황은 어때?\""
10013090-174 = "대충 상황은 정리했어. 헬멧단의 문제아 대부분도 쓰러트렸다고 할까……."
10013090-175 = "다들 기운찬 모습으로 도망가버린 거 있죠?"
10013090-176 = "[s] \"도망을 가?\""
10013090-181 = "이 정도의 병력이?! 밀린다고?!"
10013090-182 = "이것이 신입 헬멧단 녀석들의 힘……? 과연, 두렵구나!"
10013090-183 = "아, 근데 곰곰이 생각해보면, 얘네들 내가 뽑은 애들이었지."
10013090-184 = "음! 역시 내가 보는 눈은 있어!"
10013090-185 = "역시 헬멧단의 간부! 코마카제 라브라니까!"
10013090-186 = " 그 덕에 우리가 완전 끝장나게 생겼다구! 라브 대장?!"
10013090-187 = "에잇! 이렇게 된 거……! 전원 후퇴다!"
10013090-188 = "다음에 두고 보자! 이 자식드을! 이 한 번의 패배는 작은 패배일 뿐이지만……! 넓게 봐서는……!"
10013090-189 = " 넓게 봐도 그냥 패배라고!"
10013090-190 = "크헉?!"
10013090-196 = "[ns] \"……아, 그랬구나.\""
10013090-197 = "선생님!"
10013090-198 = "[s] \"시즈코, 모두 괜찮아?\""
10013090-199 = "네! 저희는 괜찮아요! 다친 사람도 없고, 아비도스의 도움으로 무사히 해결할 수 있었던 덕에……."
10013090-200 = "그보다!"
10013090-204 = "드디어 저희 백야당이…… 아니, 모두의 연합이 승리했어요!"
10013090-205 = "[s] \"응, 멋진 승리야. 모두가 힘을 합친 덕분이네.\""
10013090-206 = "굉장해요! 시즈코 쨩!"
10013090-207 = "이것으로 마침내 <로스트 파라다이스 리조트> 전체를 운영할 수 있게 되었네요!"
10013090-208 = "응! 수많은 역경이 있었지만! 이제 걱정 안하고 백야당의, 백야당만의 장사를 시작할 수 있겠어요!"
10013090-214 = "응?"
10013090-215 = "어디선가, 요란한 소리가 들리는 것 같아요-"
10013090-222 = "응~ 현장에 도착~! 으음~ 여름 냄새가 나는 게, 마음에 들어!"
10013090-223 = "모모카. 저희는 놀러 온 게 아니라 업무차 찾아온 겁니다. 총학생회의 일원답게 행동해주세요."
10013090-224 = "엑~ 선배는 너무 딱딱하다니까~"
10013090-225 = "[s] \"린이랑 모모카? 여긴 어쩐 일이야?\""
10013090-226 = "선생님께서 어째서 이곳에……?"
10013090-227 = "아, 아니군요. 생각해보면 이 정도의 소란이 일어난 곳인 만큼, 샬레의 개입이 있었어도 이상하지 않다……로 해석할 수 있을까요?"
10013090-228 = "자, 잠깐! 총학생회가 여기까지 어쩐 일이야? 더구나 이 정도의 소란이라니?"
10013090-230 = "으헤~ 어쩐지, 찌릿찌릿한 느낌만 드는데~"
10013090-231 = "네, 이곳 <로스트 파라다이스 리조트>에서 소유권을 두고 일련의 소동이 있던 걸 확인했습니다."
10013090-232 = "마침 인터넷에서도 시끄럽더라고~ 누가 이겼다느니, 누가 졌다느니 하는 식으로."
10013090-233 = "헌데 이곳은 본래 저희 <총학생회>가 권리를 가지고 있는 토지."
10013090-234 = "그런데 해당 토지 권리서의 위조품으로 인해 소동이 일어났다는 걸 알고, 이렇게 현장에 찾아오게 되었습니다."
10013090-235 = "즉 여기는 우리 거니까 그걸 되찾으러 왔다고나 할까?"
10013090-236 = "[s] \"어, 그러니까. 그 의미는…….\""
10013090-238 = "…………뭐?"
10013090-239 = "물론 갑작스러운 일이라는 건 알고 있고, 절차상에도 순서가 있으므로 당장 퇴거를 요청하는 건 아닙니다."
10013090-243 = "그렇군요. 앞으로 3일 내에, 이곳을 비워주셔야……."
10013090-245 = "어머나……."
10013090-246 = "……그럼 지금까지 저희가 겪은 일들은 전부……."
10013090-247 = "괘, 괜한 소동극이었단 거야?!"
10013090-248 = "[s] \"문어 은행에서 판 권리서 자체가 가짜였나 보네.\""
10013090-250 = "으헤~ 그것참 카이저 코퍼레이션다운 일이네"
10013090-251 = "다운 일이네 하고 끝낼 문제가 아니잖아?! 호시노 선배!"
10013090-252 = "우리가 지금까지 했던 고생은 그럼…… 아니, 너무하지 않아?!"
10013090-254 = "물론 저희로서도 무척이나 죄송스러운 일이긴 합니다만. 절차상 어쩔 수 없는 일인지라……."
10013090-258 = "[ns] \"시즈코.\""
10013090-259 = "시즈코 쨩……."
10013090-260 = "시즈코 공!"
10013090-262 = "사장님!"
10013090-263 = "너구리 씨?"
10013090-264 = "귀여운 아가씨?"
10013090-266 = "……아니아니! 뒤로 갈수록 반응하기 힘들어지는 호칭이니까……!"
10013090-267 = "후우. 알았어. 알았다구~!"
10013090-268 = "[s] \"괜찮아?\""
10013090-269 = "네! 괜찮고 말고요! 저, 이렇게 보여도 납득하는 건 빠르니까!"
10013090-270 = "대신! 조건이 있어!"
10013090-271 = "조건……이라 하심은?"
10013090-272 = "퇴거하기 전!"
10013090-273 = "백야당에서 연회를 열 거야!"
10013090-274 = "모처럼 다 같이 고생을 했으니까-! 축제 한 번 정도는, 열어도 괜찮지?!"
10013090-275 = "응~ 찬성~"
10013090-276 = "모모카?!"
10013090-277 = "[s] \"부탁해. 린.\""
10013090-278 = "……선생님까지………"
10013090-289 = "알겠습니다 그 정도라면……"
10013090-295 = "응! 그럼 어디! 모두 준비해볼까!"
10013090-297 = "오오-!"
10013090-310 = "자, 그럼! 시작할게!"
10013090-311 = "우리 모두의 승리를 축하하는 연회의 자리를!"
10013090-315 = "자자~ 많이들 먹어! 잔뜩 준비했으니까-!"
10013090-318 = "오오! 이거! 이즈나의 입에 딱 맞아요! 엄청 맛있어요!"
10013090-319 = "앗, 주군! 주군도 드셔보실래요?!"
10013090-322 = "후후후- 다들 즐거워 보이네요."
10013090-329 = "…………휘잉휘잉, 바람?"
10013090-334 = "아아아~ 정말 이번엔 진짜 고생이었다니까~"
10013090-336 = "그래도 간만에 운동이 됐어."
10013090-337 = "아하하. 시로코 쨩, 운동 좋아하니까요~"
10013090-339 = "그나저나 시즈코 씨의 수완은 놀랍네요. 이런 연회의 준비도 그렇고- 축제에 관해선, 프로라고 할까."
10013090-340 = "그러게~ 다음에 기회가 되면, 우리 아비도스에서 모래 축제가 다시 개최될 때- 조언을 구하고 싶을 정도인걸~"
10013090-341 = "……응! 그렇네!"
10013090-342 = "네! 모래 축제가! 다시 열리게 되면 그때 또!"
10013090-344 = "후후, 또 이번처럼 협력하면 즐겁겠네요~ 그쵸? 시로코 쨩?"
10013090-345 = "…………응."
10013090-350 = "아, 이거 맛있다."
10013090-351 = "그렇네요……."
10013090-353 = "이게, 백귀야행……의 맛이로군요."
10013090-358 = "[ns] \"……이렇게 된 거야.\""
10013090-360 = "아아~ 그렇군요. 과연~ 결국 제가 틀리고 시즈코 양이 맞았다는 거네요~"
10013090-361 = "냐하핫~ 음양부의 부장으로서 부끄러운걸요~"
10013090-362 = "[s] \"뭐, 정작 시즈코가 문어 은행에 투자했던 펀드 기금이 붕 뜨게 되어버렸지만.\""
10013090-363 = "아, 그거라면 걱정하지 마시길."
10013090-364 = "해당 기금에 대해서라면 자산 동결 신청을 해놨달까~"
10013090-365 = "우후훗. 나름의 방비는 미리 해두었답니다~ 카이저 코퍼레이션도 참 빈틈이 많다니까요~? 이쪽의 뒷공작에 약점을 훤히 내보이다니~"
10013090-366 = "시간이 걸리긴 하겠지만, 다시 되찾을 수 있을 거랍니다."
10013090-367 = "[s] \"응. 니야는 처음부터 시즈코를 걱정하고 있었던 거지?\""
10013090-369 = "……냐하핫. 무슨 말씀이시온지?"
10013090-371 = "[ns] \"처음 사건의 진상을 알았을 때, 시즈코는 모든 일을 혼자 짊어지려고 했어.\""
10013090-375 = "[ns] \"니야가 나를 불러주지 않았으면, 시즈코는 정말로 그랬을 거야.\""
10013090-377 = "……그래서 제가 일부러 움직였다. 그 말씀이신가요?"
10013090-378 = "우후훗, 글쎄요~ 무슨 말씀을 하시는지 저는 도통 모르겠네요~"
10013090-379 = "이번 일에 있어서 저는 시즈코 양의 반대자. 대립자에 지나지 않았답니다."
10013090-380 = "너무 섣부른 추측은 서로에게 무의미한 기대감을 심어주기 마련"
10013090-381 = "그러니 여기에선, 그런 걸로 해두지요. 냐핫."
10013090-382 = "[s] \"응, 뭐, 그런 걸로 해두자.\""
10013090-387 = "[ns] \"그래도 누구 하나쯤은, 알아줘야 하지 않겠어?\""
10013090-388 = "(그리고 마지막으로……)"
10013090-396 = "[ns] \"시즈코, 여기 있었네. 찾았어.\""
10013090-397 = "아, 선생님……"
10013090-403 = "아하하 그냥 연회 속에서 바삐 움직이다 보니, 조금 지쳐버려서……. 평소엔 이렇지 않은데 신기하네요."
10013090-404 = "아니……. 그만큼 정신없는 일이 계속되어서 그런 걸까요."
10013090-405 = "[s] \"정말 고생했어. 시즈코.\""
10013090-406 = "으아아아~! 지쳤어요~!"
10013090-407 = "그러니! 자! 좀 더 위로해주세요! 칭찬의 말씀! 더더욱 해주셔도 좋다구요! 앵콜! 앵콜!"
10013090-408 = "[s] \"응, 시즈코가 아니었으면 이렇게까지 해내지 못했을 거야.\""
10013090-409 = "……제가 직접 요청한 거긴 하지만, 이렇게 들으니 괜히 얼굴이 뜨겁네요."
10013090-410 = "그래도 난리는 전부 수습했으니! 그걸로 OK란 것으로!"
10013090-411 = "[s] \"하지만 이렇게 끝나버리다니, 좀 아쉽지?\""
10013090-412 = "네? 무슨 소리신가요. 선생님."
10013090-413 = "[s] \"응?\""
10013090-414 = "아쉬울 건 하나도 없다구요?"
10013090-416 = "좌충우돌하고 부딪치고, 제가 직접 저지른 실수를 되돌아보는 건……."
10013090-417 = "또 나름대로 엄청나게 괴롭고……."
10013090-418 = "그래서 더욱…… 그, 니야……. 음양부 부장 앞에서 인정하는 건, 뭔가 지는 기분이라 혼자서 멋대로 고집을 부린 셈이지만."
10013090-420 = "그래도 제 선택이 틀리지 않았다는 걸, 모두들 덕분에-"
10013090-421 = "네, 그 누구보다 선생님 덕분에 다시 확인할 수 있었어요."
10013090-423 = "그 덕분에 이번 여름, 제가 한가득 맛본……"
10013090-424 = "달콤하고 쌉싸름하지만……"
10013090-425 = "그래도 또 엄청 행복한 맛이 나는…… 이 추억을 손에 넣은 시점에서……."
10013090-427 = "저로선 이미 아쉬울 것 하나 없이, 대성공이라고요?"
10013090-428 = "[s] \"그래? 다행이네.\""
10013090-432 = "[ns] \"그건 나도 마찬가지거든.\""
10013090-433 = "에헤헷! 네!"
10013090-434 = "그러니 이번 소동은 여기까지! 보다 중요한 건 앞으로의 미래! 인 것으로"
10013090-440 = "그런 의미에서 앞으로도 저희 백귀야행 마츠리운영관리부를."
10013090-441 = "저 부장 카와와 시즈코를 잘 부탁드린다구요……?"
10013090-442 = "선생님!"
10013090-443 = "출장! 백야당 바다의 집 프랜차이즈 계획"
