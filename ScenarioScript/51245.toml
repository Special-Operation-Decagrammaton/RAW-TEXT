51245-4 = "크으윽?!"
51245-5 = "………!"
51245-18 = "[ns] (끝없이 늘어나는 데다가…… 기세가 전혀 줄어들질 않아……!)"
51245-23 = "닥쳐."
51245-25 = "전부 다! 닥쳐닥쳐닥쳐닥쳐!!"
51245-26 = "소용없어. 너희들이 무엇을 하든, 쓰러트릴 수 없어."
51245-27 = "제아무리 번지르르한 말을 떠들어대도."
51245-28 = "이 이야기를 역전하겠다고 발버둥을 친다 해도."
51245-29 = "이미 말했잖아. 이야기의 절대적인 전제 조건은 비틀 수 없어. 처음부터 그건 이번 이야기에서 결정된 사항이니까."
51245-31 = "<자격>이 없는 자는 <백물어>를 쓰러트릴 수 없다."
51245-32 = "이건 그러한 이야기. 첫 단추를 꿰던 시작부터 모든 결말이 정해져 있던 이야기."
51245-33 = "그래……"
51245-34 = "────<백화요란의 부장>이 돌아오지 않는 이상, 아야메가 없는 이상……."
51245-35 = "네놈들도 아야메와 마찬가지로 내 백물어를 이용해 전부 황혼으로 떨어 트려………!!!!"
51245-50 = "뭐야……?"
51245-55 = "뭐냐고."
51245-56 = "응? 저기~ 대체 어떻게 된 거야?"
51245-59 = "분명 궁지에 몰렸었잖아요."
51245-60 = "제가 당신에게 몇 번이고 말해, 마음을 꺾었잖아요."
51245-61 = "그런데."
51245-65 = "보라고요. 나구사 쨩. 당신의 꼬라지를."
51245-66 = "다리는 후들거리고. 얼굴엔 눈물 콧물이 가득한 주제에."
51245-70 = "지금이라도 도망치고 싶어 어쩔 줄 몰라 하는 주제에."
51245-78 = "뭘, 이제와서 그런 <부장>이 된 것 같은 행동을 하고 있는 거야……? 나구사 쨩……!"
51245-79 = "여기까지 와서 무슨 염치로…… 아야메의 흉내 따위를 내고 있는 거냐고!"
