51245-221 = "……!"
51245-222 = "아직, 아직이야……!"
51245-226 = "앗! 수상한 행동은 용납할 수 없사와요!"
51245-236 = "어차피 네 녀석들의 총알은 내게 통하지 않아……"
51245-237 = "그것은 괴서를 지닌 나에게 있어 불변의 진리……! 하! 처음부터 무의미한……!"
51245-239 = "[ns] \"지금이야!\""
51245-243 = "아, 욱……?!"
51245-244 = "어, 떻게, 공격이……!"
51245-257 = "………."
51245-262 = "자격……? 정말……로?"
51245-263 = "나구사 쨩…… 나구사 쨩 따위가……!"
51245-264 = "겨우, 마음가짐을 바꿔 먹은 것, 그 행위 하나로…… 괴서의 신비에 닿는, 다고?"
51245-266 = "하앗!"
51245-271 = "크, 앗! 아니! 아직이야!"
51245-285 = "나의 백물어라면………!"
51245-286 = "[ns] \"렌게! 부탁할게!\""
51245-291 = "하! 맡겨만 줘!"
51245-299 = "뭣?! 한순간에……?!"
51245-307 = "백화요란의 돌격대장. 후와 렌게."
51245-308 = "백화요란 분쟁조정위원회에서 사격술을 단련해 오기를 2년."
51245-310 = "이쪽이 청춘을 바쳐 갈고 닦아온 백화요란식 사격술 앞에서 머릿수 따윈 무의미하다는 걸 아는 게 좋을 거다!"
51245-314 = "제기이이일!"
51245-321 = "우선은 뒤로 빠져나가서!"
51245-326 = "퇴로에서……?!"
51245-329 = "시야가 차단되었다고 판단한 순간, 우선 퇴각을 선택. 이후 안전을 확보한 뒤에 백물어를 불러내겠다……는 심산이겠지만."
51245-333 = "미안하지만 너의 단순한 사고를 읽는 건, 식은 죽 먹기보다도 쉽거든."
51245-337 = "웃기지 마! 키류 키쿄!"
51245-338 = "어차피 네놈의 공격은, 내게 통하지도……!"
51245-345 = "어……?! 바닥이……?"
51245-346 = "공격이 통하지 않는다고 해서 뭐? 그럼 딛고 있는 바닥을 쏴서 넘어트리면 될 일이잖아?"
51245-347 = "설마 괴서를 가지고 있으니 하늘도 날 수 있다고까진 하지 않겠지?"
51245-352 = "……! 그래. 카타시로……! 카타시로라면……!"
51245-354 = "만들다 만 것이라 할지라도! 그것이라면!"
51245-361 = "……없어? 어째서?"
51245-366 = "카타시로라면…… 이미 이 자리에 없사와요."
51245-367 = "소녀의 <감정>을, 더 이상 당신 멋대로 하도록 내버려 두지 않겠다. 결심했으니까."
51245-368 = "……카데노코지 유카리."
51245-369 = "네, 저 카데노코지 유카리."
51245-370 = "백화요란 분쟁조정위원회의 일원으로서……"
51245-371 = "야부키 슈로── 당신을 체포하겠사와요!"
51245-375 = "!!"
51245-381 = "크……윽……!"
51245-382 = "더 이상의 저항은 무의미해."
51245-383 = "어째서야……?"
51245-384 = "……아까까지만 해도 서로를 헐뜯고, 비방하고, 싸우고 있었잖아요?"
51245-385 = "자신을 상처 입힌 거짓말에 대해 성토하고, 상대를 비난하고 있었잖아요?"
51245-386 = "그런데 이제와서…… 싸울 수 있다고? 어째서? 어째서죠? 대체 왜……?"
51245-387 = "……지금이라도 늦지 않게, 마주 보고 싶다고 생각했으니까."
51245-388 = "설사 그것이 <연기>에 지나지 않을지라도."
51245-392 = "백화요란으로서 모두를 마주하고 싶었으니까──"
51245-393 = "네! 그렇사와요!"
51245-395 = "……!!!"
51245-396 = "[ns] \"이걸로 끝이야. 슈로.\""
51245-397 = "샬레의 선생, 까지……"
51245-403 = "하, 하하."
51245-409 = "아하핫, 아하핫!!"
51245-410 = "아하하하하하하하하핫!!!"
51245-414 = "나구사 쨩………"
51245-415 = "나구-사아아!! 쨔아앙!"
51245-423 = "……그래. 좋아. 좋다고. 정말 정말 마음에 안 들지만……!"
51245-424 = "이번 이야기만큼은 네놈들의 승리야…… 그런 결말……이라고 납득, 하겠어."
51245-425 = "하지만…… 아직 전부 끝난 건 아니야."
51245-426 = "다음번엔 반드시…… 나의 손으로……"
51245-427 = "코쿠리코 님에게 바칠 <백물어>를………"
