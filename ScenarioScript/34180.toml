[translation]
34180-1 = "제18화;또 다른 우리"
34180-9 = "이쪽이야, 히요리, 미사키. 여기 숨자."
34180-10 = "어, 언니……"
34180-11 = "쉿- 조용히 해. 고개도 더 숙여."
34180-12 = "네, 네…… 그런데 저기 중앙에 있는 저분은 누구인가요? 어, 어, 엄청 예쁜 옷…… 이, 입고 있는데……."
34180-13 = "나도 잘 몰라……. 엄청 중요한 사람인가 보지."
34180-14 = "공주님이야. 고귀한 혈통을 가졌다나."
34180-15 = "고, 공주님이요?! 공주님인가요?"
34180-16 = "세, 세상엔 공주님도 있는 거예요? 우, 우리 같은 좀도둑과는 다르게……."
34180-17 = "음식을 훔치지도 않을 거고…… 동상도 걸리지 않을 거고…… 길바닥에서 자지도 않겠죠……? 그렇겠죠?"
34180-18 = "으, 으응……?"
34180-19 = "그렇네요. 이 세상에는 고통만 있는 줄 알았는데…… 저렇게 예쁜 공주님도 있는 거군요……. 어쩐지 감동이에요, 으아아아앙-!"
34180-20 = "가, 갑자기 울지 마, 들키잖아!"
34180-21 = "죄송해요, 언니…… 으아아아앙-! 그치만…… 으아아아앙-"
34180-22 = "……공주님이라고 해봤자 우리랑 다를 바 없는 처지, 아니 그 이하의 취급일 거야."
34180-23 = "……?"
34180-24 = "퍼레이드처럼 보이지만 저건 적들에게 우리 쪽의 인질을 보내는 행렬이야. 내전 중이니까, 그런 일도 있는 거겠지."
34180-25 = "저 공주님도 어차피 차가운 감옥에서 벌벌 떨면서 굶게 될걸. 음식 찌꺼기라도 먹을 수 있다면 다행일 거야."
34180-26 = "아, 아으으……."
34180-27 = "그만해, 미사키. 히요리가 겁먹잖아."
34180-28 = "……. 그래서 이제 어쩌려고? 여기까지 왔는데 구경만 하고 돌아갈 거야? 사오리 언니?"
34180-29 = "아니, 당연히 덮쳐야지. 저 인파를 이용해서 값비싸 보이는 걸 최대한 훔치는 거야."
34180-30 = "자, 간다."
34180-38 = "그만둬!!"
34180-39 = "비켜라. 8번 분대장."
34180-40 = "헤일로를 부술 셈이야!!? 그만두라고!"
34180-41 = "제발…… 제발 그만……. 으흑, 으흐흐흑……."
34180-42 = "저 녀석은 우리에게 저항했다. 보통 독종이 아니야. 비키지 않으면 너도 같은 꼴이 될 거다."
34180-43 = "쿨럭, ……쿨럭. 웃기지 마……. 누가……."
34180-44 = "이놈이 감히!!"
34180-45 = "기다려!!"
34180-46 = "내, 내가……!! 내가 이 아이를 가르칠 테니까!"
34180-47 = "가르쳐……?"
34180-48 = "……. 또 쓸데없는 짓을……."
34180-49 = "나, 나는 가르치는 건 잘하잖아? 히요리도, 미사키도 엄청 성적이 좋고, 고, 공주님도 내가 가르치고 있어."
34180-50 = "그러니까, 나에게 맡겨줘. 내, 내가 잘 타이를 테니까……!!"
34180-53 = "……. 아파."
34180-54 = "다시는, 다시는 이러지 마! 미사키, 절대, 절대로……!!"
34180-55 = "……어째서?"
34180-56 = "뭐……?"
34180-57 = "어째서 그래야 하는 거야? 어째서 이런 의미 없는 고통을 이어나가야 하는 거야?"
34180-58 = "춥고, 배고프고, 아프고. 그저 또 고통뿐인 날들이 반복될 뿐이잖아."
34180-59 = "어째서? 어째서 언니는 이 무의미한 고통을 우리에게 강요하는 거야? 여기에 무슨 의미가 있다고?"
34180-60 = "그, 그건……."
34180-61 = "그러니까…… 그건……."
34180-62 = "……봐. 대답하지 못하잖아. 뭐든 알고 있는 척하지만, 사실 언니도 아무것도 모르는 건 마찬가지면서."
34180-65 = "……. 미, 미사……키. 기다려……."
34180-66 = "기다려! 나, 나는……."
34180-68 = "잘못했어요…… 용서해주세요…… 잘못했어요……."
34180-69 = "죄송해요…… 죄송해요…… 다시는 안 그럴게요……."
34180-70 = "다시는 어른의 말을 어기지 않을게요…… 다시는 반항하지 않을게요…… 희망을 품지 않을게요……"
34180-71 = "다시는 행복해지고 싶다고 기도하지 않을게요…… 그러지 않을게요……."
34180-72 = "제발 용서해주세요……. 제발……."
34180-74 = "제발…… 자비를……."
34180-75 = "자비를……."
34180-77 = "……어째서 그렇게까지 저항하는 거지? 아즈사?"
34180-78 = "화해의 상징……? 아니, 그건 기만책일 뿐이다. 넌 그런 존재가 아니야."
34180-79 = "네가 그걸 위해 준비하고 공부해 온 것들은 <살인 임무>에 유용하게 쓰일 거다."
34180-80 = "그러니 포기하고 받아들여라, 모든 것이 헛될 뿐이니까."
34180-81 = "아즈사……?"
34180-82 = "뭐, 뭐라고 했어? 무슨 말을 한 거야? 기다려. 잠깐……."
34180-85 = "어, 어딜 가는 거야? 아즈사!"
34180-86 = "기다려! 뭐라고 한 거야? 무슨 말을…… 넌 어디로 가는 거야? 우린 아직 여기 있는데……."
34180-87 = "아즈사……"
34180-88 = "너, 너는…… 알고 있는 거야? 너는…… 그 답을 알고 있어……?"
34180-89 = "가르쳐 줘, 나는……. 나는……."
34180-90 = "나는 대체…… 어떻게 해야……."
34180-93 = "……. 아즈사……."
34180-94 = "……아즈사?"
34180-95 = "……!! 크, 크윽……."
34180-99 = "…… 으, 으으……."
34180-103 = "……무리야. 그 상처로는 움직일 수 없을 거야. 사오리."
34180-104 = "……그렇군."
34180-105 = "그래. 난 진 건가. 당연한 결과겠지……. 애초에……."
34180-106 = "……이제 됐어."
34180-107 = "이제 됐다고……?"
34180-108 = "……그래. 더 이상 뭘 어떻게 해야 할지 모르겠어."
34180-109 = "늘 이게 옳다고 생각하며 달려왔는데…… 결국 뒤돌아보면 모든 것이 잘못되어 있었어……."
34180-110 = "……아즈사."
34180-111 = "……?"
34180-112 = "넌 아즈사에게 뭘 묻고 싶었던 거야?"
34180-113 = "……들렸던 건가."
34180-114 = "보충수업부의 아즈사 쨩. 애초에 내 쿠데타 계획을 돕기 위해 선택된 스파이였잖아."
34180-115 = "선생님의 도움이 없었다면 아무것도 아니었을 단순한 장기말이었을 텐데……."
34180-116 = "……아즈사는."
34180-117 = "원래 스파이로 선택된 게 아니었어."
34180-118 = "……뭐?"
34180-123 = "처음에 그 아이는……"
34180-124 = "……<화해의 상징>이 될 예정이었어."
34180-125 = "……."
34180-126 = "무슨……"
34180-127 = "트리니티와 아리우스의…… 그 표현을 쓴 건 너였어. 미카."
34180-128 = "무슨 소리야…… 그건…… 응, 기억났어. 선생님을 속이기 위해 대충 둘러댄……"
34180-129 = "아니, 그건 네가 우리를 처음 찾아왔을 때 했던 말이었어."
34180-130 = "그땐 세이아를 습격하는 일이 벌어지기 전이었어. 애초에 에덴조약도, 네 쿠데타 계획도, 아무것도 계획된 게 없었어."
34180-131 = "……."
34180-132 = "너는 그때, 아리우스와 화해하고 싶다고만 했었어."
34180-134 = "안녕, 누군지는 모르겠지만, 네가 아리우스 학생이지……?"
34180-135 = "응, 저기, 오늘 날씨 좋지 않아? 엄청 화창하고 또……."
34180-136 = "용건만 말해라. 트리니티."
34180-137 = "우와…… 아이스 브레이킹 같은 거 싫어하나 보네. ……응. 어쩔 수 없이 그럼 본론부터."
34180-142 = "나는, 너희 아리우스와 화해하고 싶어."
34180-143 = "화해……?"
34180-144 = "응. 조금 과격한 주장일 수도 있지만, 그래도……"
34180-145 = "너희는 아마 아직도 우리를 증오하고 있겠지?"
34180-146 = "그러니까 우리의 도움도, 총학생회의 도움도 거절하고 이런 비밀스러운 자치구에서 고집스럽게 고립되어 있는 거잖아. 과거의 증오 때문에."
34180-147 = "……."
34180-148 = "응, 그치만 이걸 해결하기엔…… 서로 간의 증오는 너무 크고…… 또 쌓인 오해도 상당할 테니까…… 쉽지 않은 문제겠지……."
34180-149 = "나기 쨩도, 세이아 쨩도 반대하는 건 당연해……."
34180-150 = "그치만…… 그냥, 사이좋게 지내자는 게 그렇게 어려운 걸까? 서로 조금씩 노력하면 언젠가는 가능해질 수 있는 거 아닐까?"
34180-151 = "나는 그렇게 생각해……. 그러니 조금씩 노력해보려고 너희와 만난 거야."
34180-152 = "……그 말이 진짜라는 걸 어떻게 믿지?"
34180-153 = "응…… 그 반응도 이해해. 그래서 생각해 봤어."
34180-154 = "너희 아리우스의 학생 한 명을 트리니티로 전학시키는 건 어때? 물론 아무도 모르게."
34180-155 = "내가 뒤를 봐주면 어떻게든 될 거야. 이래 봬도 난 티파티니까."
34180-156 = "……."
34180-157 = "그걸로 아리우스의 학생이 아무런 문제 없이 우리 학원에서 잘 지내며 행복할 수 있다는 걸 모두에게 증명하는 거야."
34180-159 = "말하자면 그 아이가 <화해의 상징>이 되어주는 거지. 어때? 응?"
34180-163 = "……. 어처구니없는 계획이군."
34180-164 = "그, 그치만…… 그런 존재가 있다면 분명 세이아 쨩도, 나기 쨩도 납득해줄 거라고 생각해!"
34180-165 = "……."
34180-166 = "알겠다. 나 혼자 결정할 수 있는 문제는 아니니, 다음 연락을 기다려라."
34180-167 = "어? 자, 잠깐? 그런 아이가 있긴 한 거야?"
34180-168 = "……."
34180-175 = "아즈사. 임무다."
34180-179 = "……뭐지?"
34180-181 = "화해라고요? 어이없을 정도로 한심하고 순진한 발상이군요. 함정이 아니라면 더 이상할 지경이에요."
34180-182 = "흠…… 뭐, 서두를 건 없죠. 순진한 아이인 건지 아니면 속이 시커먼 뱀인 건지 먼저 지켜보도록 하죠."
34180-183 = "일단 거절하세요. 그리고 적당히 구슬리면서 그 여자와의 관계를 유지해 트리니티의 정보를 빼내도록 하세요."
34180-184 = "그건 거절……입니까?"
34180-185 = "물론이죠. 화해의 상징? 무슨 잠꼬대 같은 소리인지. 대신 트리니티의 정보를 빼내는 도구로 이용해주겠어요."
34180-186 = "……."
34180-187 = "응? 사오리? 무슨 문제라도 있나요? 설마 제 허락 없이 멋대로 뭔가 준비하고 있었던 건가요?"
34180-188 = "……아, 아닙니다. 마담."
34180-189 = "잊지 않았겠죠? 너희들이 고통받고 있는 이유를? 춥고 배고프고 절망스러운 이유를?"
34180-190 = "……네. 그건 모두 우리를 추방시킨 트리니티 때문입니다."
34180-191 = "네. 원수와 화해 따윈 없어요. 절대로. 그 증오를 잊지 마시길."
34180-192 = "네. 마담. 절대 잊지 않습니다."
34180-194 = "왜 그랬는지는 나도 잘 모르겠어…… 하지만 아즈사라면……. 그 아즈사라면……."
34180-195 = "나는…… 아즈사가 그런 상징이 되어 주었으면 좋겠다고 생각했던 것일까……."
34180-196 = "……."
34180-197 = "하지만 그걸 확인할 기회는 영영 오지 않았지……."
34180-201 = "……세이아 쨩이 있는 곳은 여기야."
34180-202 = "세이아 쨩은 병원에 장기요양이라도 보내놓고, 호스트 자리를 내가 가지는 거야. 응."
34180-203 = "그러니까, 잘 부탁해."
34180-205 = "……."
34180-206 = "……마담은 그 기회를 놓치지 않았어. 세이아는 마담에게 거슬리는 존재였으니까."
34180-207 = "너는 아마 우리를 자신의 편리한 사병 정도로만 생각한 것이었겠지. 그렇지 않고서야 극비인 세이아의 위치를 알려줬을 리가 없어."
34180-208 = "아니야. 우리는 그런 편리한 폭력단 따위가 아니야. 우리는……."
34180-210 = "<헤일로를 부수는 방법>을 배우고, 훈련하고, 그 도구를 확보한…… 살인자들이야."
34180-212 = "<헤일로를 파괴하는 폭탄>으로 세이아를 죽이는 임무가 우리에게 떨어졌어."
34180-216 = "아즈사는…… 화해의 상징이 되고자 트리니티의 많은 지식들을 갖고 있었기 때문에 그 임무에 투입되었어."
34180-224 = "……. 나기 쨩이 이상한 걸 꾸미고 있어."
34180-225 = "……."
34180-226 = "세이아 쨩이 죽어버리고 나서 정신이 나가버렸나 봐. 게헨나와 평화협정이라니, 정말이지. 나기 쨩도 참……."
34180-227 = "자, 그러니까 저번에 내가 제안한 계획을 다시 시작했으면 해."
34180-229 = "트리니티 내부에 스파이를 심는 거야. 세이아 쨩 때와는 달리 조심스러운 방법으로 말야."
34180-231 = "너는……."
34180-232 = "나는 너를 잘 이해할 수 없었어. 대체 무엇을 원하고 무엇을 추구하는지 도무지 종잡을 수 없는 걸로 보였어."
34180-233 = "그냥 단순히 바보라고 생각하면 쉽겠지만…… 하지만…… 그렇게 간단히 넘길 수는 없었어."
34180-234 = "너에게 <화해>라는 말을 처음 들었을 때도…… 무슨 헛소리를 하는 거냐고 생각하면서도……"
34180-235 = "어쩌면 그런 미래가 우리에게도 있을 수 있지 않을까, 하고……."
34180-236 = "그런 생각을 완전히 지워버릴 수는 없었어……."
34180-237 = "……."
34180-238 = "미카. 너는 아마도……"
34180-243 = "정말로 우리와 화해하고 싶었던 것이겠지."
34180-244 = "……."
34180-245 = "너는 선의를 가지고 우릴 찾아왔던 거야. 그런 너의 마음을 기만하고 속여서 너를 이 지옥으로 이끈 게 바로 나였고."
34180-246 = "너는 이 지옥을 받아들일 수 없었기에…… 너 자신의 기억을 기만하고 부정한 거겠지."
34180-247 = "그래, 너뿐만 아니라……."
34180-248 = "……공주님이 목소리와 얼굴을 숨기고 살아야 했던 것도, 히요리와 미사키를 스쿼드로 끌어들인 것도……"
34180-249 = "<화해의 상징>이 아니라, <살인자>로서, 그리고 모두를 속이고 기만해야 하는 <스파이>로서 또다시 트리니티로 보내져야 했던 아즈사의 일도……."
34180-250 = "그 모든 것들이 나 때문에 벌어진 거야."
34180-251 = "나는…… 사냥개 따위가 아니야. 나는……"
34180-252 = "주변의 모든 것을 고통으로 빠트리는…… 역병이야."
34180-253 = "……."
34180-254 = "아즈사에게 묻고 싶었던 거……? 그래…… 있었어……."
34180-255 = "그 모든 일을 겪어야만 했으면서도 아즈사는……"
34180-256 = "……행복해 보였어."
34180-257 = "누구에게도 감정을 드러내지 않고, 우리를 끝까지 받아들이지 않고 철저하게 외톨이로 지내던 그 아즈사가……."
34180-259 = "그 얼음처럼 쓸쓸했던 아이가……."
34180-270 = "친구들과…… 좋은 어른과 함께 힘을 합쳐……"
34180-271 = "마침내 역경과 고통을 이겨내서……."
34180-272 = "그토록 행복해 보이는 파란 하늘 아래로…… 나아가 버렸어……."
34180-274 = "아냐…… 그럴 리가 없어. 그런 건, 그런 건 거짓이야. 기만이야!"
34180-275 = "언젠간 사라져 버릴 신기루 같은 거야!"
34180-279 = "간절히 기도해봤자 아무것도 달라지지 않아!"
34180-280 = "아즈사, 우리는 결국 행복해질 수 없어. 잘 알고 있잖아. 모든 것은 헛되다는 것을."
34180-282 = "하지만…… 결국 인정하지 않을 수 없었어……."
34180-285 = "아아…… 그렇구나."
34180-286 = "우리들의 증오도…… <모든 것이 헛되다>는 말도…… 내가 해온 모든 행동도……."
34180-287 = "전부 거짓이었구나……."
34180-288 = "멍청하고 아둔하고 나약했던 나는…… 역병처럼 모두를 파멸로 몰아넣었구나……."
34180-299 = "뭐야. 결국 그런 거였구나. 전부 내가 원인이었어."
34180-300 = "아즈사는 나에게서 벗어났기에 행복해질 수 있었던 거야."
34180-301 = "나는 그 진실을 마지막까지 부정하고 싶었던 것뿐이었어……."
34180-303 = "아즈사, 너라면…… 알고 있는 거야? 아즈사, 너는 정답을 알고 있어?"
34180-304 = "아즈사…… 나는……."
34180-305 = "……행복해질 수 있을까?"
34180-306 = "어떻게 해야 나도 너처럼 행복해질 수 있을까, 그런 기회는 존재하긴 할까? 가능하긴 할까……? 내가 그런 걸 바라도 괜찮은 걸까……?"
34180-307 = "만약에…… 내가……."
34180-310 = "……좋은 어른을 조금만 더 일찍 만날 수 있었다면……."
34180-311 = "이런 나에게도…… 다른 삶이 있었을까……."
34180-312 = "이런 비참한 결말이 아닌, 다른 결말을 맞이할 수 있었을까……."
34180-313 = "나에게도…… 그런…… 기회가……."
34180-314 = "아즈사…… 너는…… 그때 뭐라고 말했던 거야?"
34180-315 = "나는……. 그걸……."
34180-319 = "이제 됐어…… 미카."
34180-320 = "마음대로 해. 네가 빼앗긴 것만큼 빼앗도록 해."
34180-321 = "상냥한 마음을 가지고 있던 너를…… 증오만 남은 <마녀>로 만들어버린 건 바로 나니까."
34180-322 = "나는 누군가의 많은 것들을 빼앗아 왔으니, 적어도 이것으로 공평한 이야기가 되겠지……."
34180-332 = "아아…… 나는 언제나 이 역할은 아즈사가 할 거라고 생각했었는데…… 너였던 건가. 미카."
34180-340 = "……."
34180-341 = "……나, 난……"
34180-342 = "난…… 못 해. 그럴 수 없어……."
34180-343 = "그럴 수 없어…… 왜냐면……"
34180-344 = "나도……"
34180-345 = "너처럼 그런 기회를 바랐었어. 나도……."
34180-346 = "나도…… 행복해지고 싶었어……."
34180-347 = "나도 너처럼…… 선생님을 조금만 더 일찍 만났더라면. 그랬더라면…… 내 잘못을 돌이킬 수 있었을까…… 하고 생각했었어……."
34180-352 = "내 고통이 내 죄에 비해 너무 크다고, 억울하다고, 자비를 베풀어달라고 수없이 기도했었어."
34180-353 = "그치만…… 소용없었어."
34180-354 = "내가 저지른 이 돌이킬 수 없는 것들을, 이걸 어떻게 해야 용서받을 수 있을지 전혀 모르겠어……."
34180-355 = "두 번째 기회……?"
34180-356 = "응. 오늘 아침이 되면 선생님과 모두가 날 위해 모여주는…… 그런 기회가 나에게도 있을 거라고…… 그치만 아니었어…… 그런 미래는 없었어……."
34180-357 = "모든 것이 헛되고 헛된 이 세계에서 그저 구원을 갈망하며 고통받을 뿐이었어……."
34180-359 = "너는…… 나야. 사오리……."
34180-360 = "너는 행복해질 수 없어. 내가 행복해질 수 없는 것처럼."
34180-361 = "그런 건 불가능해. 이미 돌이킬 수 없게 되어버린 우리들에게 두 번의 기회 같은 게 있을 리가 없어."
34180-363 = "그러니까 나는 너에게 <공평>한 고통을 원했던 걸지도 몰라……."
34180-364 = "그치만 그렇기 때문에……. 나는 불가능해……."
34180-365 = "내가 이런 결말을 정해버린다면……."
34180-366 = "그건…… 정말로 나에게 구원이 없다는 걸 스스로 증명하는 게 되어버려……."
34180-371 = "미카……. 너는……."
34180-372 = "어째서? 어째서 헤일로를 부수는 폭탄을 쓰지 않은 거야? 어째서?"
34180-373 = "……!!"
34180-374 = "분명 네가 가지고 있다고 들었어…… 쓸 기회는 충분히 많았잖아? 어째서 쓰지 않은 거야?"
34180-375 = "차라리 그랬더라면…… 나는……."
34180-376 = "그건…… 애초에 나에게 없었어."
34180-377 = "선생님에게 압수당했으니까……."
34180-378 = "……응?"
34180-379 = "……압수? 선생님에게?"
34180-380 = "저, 저기……? 갑자기 뭐야? 야한 책이나 알코올 음료 같은 느낌으로……?"
34180-385 = "[ns] \"맞아. 위험한 물건은 선생님에게 압수야.\""
34180-386 = "?!"
34180-387 = "서, 선생님……?!"
34180-388 = "서, 선생님…… 어, 어째서 여기에……!?"
34180-390 = "다음화;무한한 기회"
