[translation]
10056020-1 = "第2話;目が悪い少女"
10056020-2 = ""
10056020-3 = ""
10056020-5 = "（逃げたサユリとマキナを追いかけて、しばらく船上を走り回った）"
10056020-6 = "（しかし二人はなかなか捕まらず、追いかけっこが続いた……）"
10056020-7 = ""
10056020-10 = ""
10056020-11 = "あ……。"
10056020-12 = ""
10056020-17 = "（角の向こうから来た生徒とぶつかってしまった）"
10056020-19 = "[ns] \"ご、ごめん！大丈夫？\""
10056020-21 = ""
10056020-22 = "大丈夫。そっちこそケガはない？"
10056020-23 = "メガネをかけてないからよく見えなくて……私も不注意だった。"
10056020-24 = "早く部室にメガネを取りに行かないと……。"
10056020-25 = "[s] \"よかったら手伝おうか？\""
10056020-26 = "大丈夫。毎日のことだし、目をつぶってでもたどり着けるから。"
10056020-27 = "それに、誰か追いかけてたんじゃないの？こんな話してて平気？"
10056020-28 = "[s] \"……もう逃げられちゃったかな。\""
10056020-29 = "特徴は？"
10056020-30 = "[s1] \"コントローラーを持った青い髪の女の子なんだけど……。\"\n[s2] \"白い水着を着た白い髪の女の子なんだけど……。\""
10056020-31 = "それって……マキナのこと？"
10056020-32 = "それって……サユリのこと？"
10056020-33 = "[s] \"そうそう。君もダイビング部のこと知ってる？\""
10056020-34 = "うちの部員に何か用？"
10056020-35 = "まさか二人に手を出そうなんて――"
10056020-36 = "[s3] \"そんなんじゃないよ！\"\n[s4] \"……ん？「うちの」部員？\""
10056020-39 = "胡散臭い。"
10056020-40 = ""
10056020-42 = ""
10056020-43 = "一緒に来てくれる？#nトライデント本部で確認しないと。"
10056020-44 = "[s5] \"それは構わないけど……。\"\n[s6] \"いま話しかけてるのって私じゃなくてポスターだよ。\""
10056020-47 = ""
10056020-49 = ""
10056020-50 = "あ。"
10056020-51 = ""
10056020-53 = ""
10056020-54 = "目が悪くて……いつも相手を間違えちゃうんだ。"
10056020-55 = ""
10056020-57 = ""
10056020-58 = ""
10056020-59 = "……初めて聞く声だけど……他の学園の人？"
10056020-60 = "[s7] \"あの……近すぎるよ。\"\n[s8] \"もう少し離れてもらえると……。\""
10056020-63 = "うーん……触った感じだと、特徴ある顔ではなさそう。"
10056020-64 = "腕の筋肉は……この程度ならオデュッセイアの生徒じゃないことは確か。"
10056020-65 = "こっちも触ってみよ――"
10056020-66 = "[s9] \"そ、そこはダメぇ！\"\n[s10] \"先にメガネを取りに行こうか！？\""
10056020-69 = "コトネ！"
10056020-70 = ""
10056020-72 = ""
10056020-74 = "また手で触って相手を確認してたの？"
10056020-75 = "こういう時は私を呼んでって言ったよね？ね？"
10056020-76 = "でもココロ部長、この人、マキナとサユリを追いかけてた。"
10056020-77 = "怪しい人かもよ？"
10056020-78 = "今の状況はコトネのほうが怪しいよ……。"
10056020-79 = "[s11] \"ココロ……部長？\"\n[s12] \"じゃあ君もダイビング部員かな？\""
10056020-82 = "は、はいっ！そう、ですが……。"
10056020-83 = "うちの部に何か御用ですか？"
10056020-84 = "それとも、部員が失礼なことでも……。"
10056020-85 = "[s] \"そんなことないよ。\""
10056020-86 = "そうですか……良かった……。#n最近、苦情が多いので……。"
10056020-87 = ""
10056020-89 = ""
10056020-90 = "あ、ご挨拶が遅れました。#n私はダイビング部の部長、[ruby=とうみ]渡海[/ruby]ココロといいます……。"
10056020-91 = "それで、どういったご用件でしょうか？"
10056020-92 = "[s] \"あれ？君はあの時の……。\""
10056020-93 = ""
10056020-95 = ""
10056020-96 = "えっ？もしかして――"
10056020-97 = "あの時の覗き魔！？"
