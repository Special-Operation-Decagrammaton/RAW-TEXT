[translation]
1013602-1 = " 집 앞 산책"
1013602-4 = "안녕, 선생님."
1013602-5 = "[s] \"안녕. 에이미. 부지런하네…….\""
1013602-6 = "상황이 상황이니까. 각자 할 일을 해야지."
1013602-7 = "지금 할 일? 음…… 역시 위력 정찰일까."
1013602-8 = "신호에, 조금 신경 쓰이는 게 잡혀서."
1013602-9 = "[s] \"나도 따라가도 돼?\""
1013602-10 = "안될 건 없지만, 만에 하나 무슨 일이 일어나면……."
1013602-14 = "응. 괜찮아. 내가 지켜 줄게. 어떤 일이 있어도."
1013602-17 = "(에이미를 따라 밖으로 나섰다.)"
1013602-20 = "정찰 코스는 모두 2시간 정도. 크게 반원을 그리는 식으로 진행할 거야."
1013602-21 = "속도는 시속 4km 정도……. 전술행군 정도를 목표로 하고 있어."
1013602-22 = "물론 그것보다 조금 느려도 괜찮아. 너무 많이 뒤처지면 곤란하지만."
1013602-23 = "그랬다가는 내가 선생님을 지켜 주기 어렵게 될 테니까."
1013602-25 = "(그렇게 에이미와 함께 정찰을 시작했다.)"
1013602-29 = "(고등학생의…… 그것도 에이미의 페이스에 맞춘다는 것은 역시나 쉽지만은 않았다…….)"
1013602-32 = "대단하네. 선생님. 잘 따라와 주고 있어서."
1013602-33 = "[s] \"빈말이라도…… 헤엑……. 고마워……. 허어어억…….\""
1013602-34 = "빈말이 아니야. 이거, 리오 회장이었으면 30분 만에 실려 갔을걸?"
1013602-35 = "응? 회장에게 체력 관리에 대해 이야기를 해 줘야 할 것 같다고?"
1013602-36 = "그건 나도 기본적으로는 동의하지만……."
1013602-37 = " ……건투를 빌어. 혹시 또 선생님 말이라면 들을지도 모르지……."
1013602-38 = "?!"
1013602-39 = "선생님, 숨어!"
1013602-43 = "(에이미가 빠르게 금속 지면의 틈새로 나를 숨겼다!)"
1013602-44 = "미안해, 선생님. 조금 놀랐지?"
1013602-45 = "내가 괜찮다고 할 때까지는, 거기에서 나오면 안 돼?"
1013602-46 = "하나, 둘, 셋……. 1개 분대 정도네. 그러면……!"
1013602-53 = "이제 괜찮아. 선생님. 목표는 처리했어."
1013602-54 = "음…… 이게 마지막 목표는 아닐 것 같기는 하지만 말이야."
1013602-56 = "(그 뒤로도 에이미는…….)"
1013602-60 = "적 좌표 확인. 거리…… 427m. 선제 대응할게!"
1013602-63 = "(잘 보이지도 않는 적들을 상대하며…….)"
1013602-66 = "더 모이기를 기다려야 하나……. 아니면 여기에서 선제적으로 정찰대를 처리하고 위치 이동……?"
1013602-67 = "……."
1013602-68 = "일을 키우는 건 비효율적이니까!"
1013602-73 = "확실히 이쪽 위치는 발각되지 않은 듯하고, 무장 정도로 보아 수송대 정도겠지만……."
1013602-74 = "[ruby=Search and Destroy]탐색격멸![/ruby]"
1013602-77 = "(감탄밖에 할 수 없을 만큼 위력 정찰을 성공적으로 시행해 나갔다…….)"
1013602-80 = "이것으로 더 이상의 위험 신호는 없을 것 같아."
1013602-81 = "수고했어, 선생님. 이만 돌아갈까?"
1013602-82 = "[s] \"대단해…….\""
1013602-83 = "별거 아니야. 늘 이랬으니까."
1013602-84 = "본인이 없는 곳에서 이런 말을 하는 것은 좀 그렇지만, 히마리 부장은 사람을 좀 험하게 굴리니까."
1013602-85 = "아닌가? 생각해 보면 난 어차피 부장 앞에서도 이런 말을 하곤 했으니, 딱히 뒷담화는 아닌 건가?"
1013602-86 = "[s] \"사, 사이좋게 지내자…….\""
1013602-87 = "이미 충분히 그렇게 하고 있다고 생각하는데 말이지……."
1013602-88 = "……."
1013602-89 = "그래도, 이렇게 많은 사람들과 일하는 건 처음이긴 해."
1013602-90 = "나는 조직 규모가 너무 커지면, 비효율적이 된다고 생각했거든."
1013602-91 = "……다른 아이들도 나랑 일하는 걸 조금 무서워하기도 했고."
1013602-92 = "나는…… 보통, 이해받지 못하는 쪽이었으니까."
1013602-93 = "[s] \"여기는 달라?\""
1013602-94 = "여기는……."
1013602-95 = "어째서일까. 괜찮다는 느낌이 들어."
1013602-96 = "다들 별종들이어서 그런 걸까? 그래서 오히려 잘 맞는 것 같기도 하고……."
1013602-97 = "응. 마음이 편해."
1013602-98 = "[s] \"또 다른 애들과도 잘 지냈으면 해…….\""
1013602-99 = "또 다른 아이들……."
1013602-100 = "……."
1013602-101 = "예전 같으면, 그런 건 비효율적이라고 생각했을 텐데."
1013602-102 = "신기하네."
1013602-103 = "선생님이 그렇게 말하니까, 그것도 해 볼 만하다는 생각이 들기 시작했어."
1013602-104 = "[s] \"그렇게 생각해 줘서 고마워.\""
1013602-105 = "응."
1013602-106 = "선생님이 한 말이니까."
1013602-108 = "(에이미와 가벼운 이야기를 나누며, 정찰에서 복귀했다.)"
