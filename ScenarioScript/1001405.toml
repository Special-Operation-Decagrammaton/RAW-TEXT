[translation]
1001405-1 = "그래서 이즈나는 좋아한다."
1001405-2 = "(그리하여 시대극 감상회를 열기 위해 이즈나의 집으로 찾아갔다.)"
1001405-3 = "앗앗, 주군! 어서오세요!"
1001405-4 = "오시는 길이 피곤하지는 않으셨나요?"
1001405-5 = "차를 내어드릴까요?"
1001405-6 = "배가 고프시다면 팝콘맛 만쥬도 있어요!"
1001405-7 = "[s1] \"준비성이 철저하네.\"\n[s2] \"이즈나, 뭔가 들뜬 것 같은데.\""
1001405-8 = "에헤헷!"
1001405-9 = "에헤헷!"
1001405-10 = "오늘 볼 시대극 시리즈는 이즈나가 제일 좋아하는 시리즈 중 하나거든요."
1001405-11 = "이걸 주군이랑 같이 보면서, 감상을 나눌 수 있다고 생각하니까."
1001405-12 = "벌써부터 막 가만히 있을 수가 없어서……."
1001405-13 = "모모톡을 보냈을 때부터 줄곧 두둥실 떠 있는 기분이었어요!"
1001405-14 = "[s] \"그래……? 오늘 보는 작품 이름은 뭐야?\""
1001405-15 = "시바견왕왕 감독의 닌자 시대극 명작 '방랑하는 고독한 77인의 닌자' 디럭스 세트예요!"
1001405-16 = "[s3] \"그거, 정말로 고독한 거 맞아?\"\n[s4] \"친구들이 잔뜩인데……?\""
1001405-17 = "그것도 1시간짜리 장편이 총 8편!"
1001405-18 = "그것도 1시간짜리 장편이 총 8편!"
1001405-20 = "무려 8시간짜리 초장편이에요!"
1001405-21 = "[s] \"그런 이야기는 못 들었는데?!\""
1001405-22 = "네? 하지만……."
1001405-23 = "닌자 시대극의 참맛을 알려면 이 정도는 봐줘야 하는데……."
1001405-24 = "아무래도……. 곤란하신가요……. 주군……? (추욱)"
1001405-25 = "[s5] (언제나 정신없이 움직이는 이즈나의 귀가…….)\n[s6] (저렇게나 추욱 늘어져서……!)"
1001405-30 = "[ns7] \"괜찮지! 그렇지 않아도 오늘 하루는.\"\n[ns8] \"닌자 시대극으로 보내고 싶은 참이었어!\""
1001405-33 = "다행이다……!"
1001405-34 = "그럼 같이 봐요! 주군!"
1001405-36 = "영차."
1001405-37 = "플레이어에, 비디오테이프를 넣고."
1001405-41 = "응? 아, 시작했어요!"
1001405-43 = "(그렇게 8시간 내내 이어 이즈나와 함께 시대극을 감상했다.)"
1001405-45 = "후아! 재밌었어요!"
1001405-46 = "주군을 향한 충성!"
1001405-47 = "살아남기 위해 서로에게 칼을 겨눌 수밖에 없는 닌자와 닌자."
1001405-48 = "처절한 싸움! 배신과 배신!"
1001405-49 = "그리고 그 사이에 피어나는 우정과 사랑까지……."
1001405-50 = "주군! 정말 굉장하지 않나요?"
1001405-51 = "보고 있다 보면 이즈나도 저도 모르게 아~ 멋지구나~ 하는 생각이 들어서……!"
1001405-52 = "[s11] \"그러게……. 생각보다 재미있어서 놀랐어.\"\n[s12] \"그야말로 로망이 잔뜩 담겨있네.\""
1001405-53 = "네! 닌자란, 말 그대로 로망이 가득한 존재예요!"
1001405-54 = "네! 닌자란, 말 그대로 로망이 가득한 존재예요!"
1001405-55 = "[s13] \"이즈나가 어째서 이걸 좋아하는지…….\"\n[s14] \"조금 알 것 같은 기분이 들어.\""
1001405-56 = "!!"
1001405-57 = "!!"
1001405-58 = "알아주시는 건가요!"
1001405-59 = "에헤헷! 주군!"
1001405-61 = "정말 좋아해요!"
1001405-62 = "[s] \"우, 우왓, 이즈나?! 진정해!\""
1001405-63 = "에헷♪ 에헤헷~♪"
1001405-68 = "주군~ 주군~!"
1001405-69 = "아! 맞다! 이것도 좋지만, 이즈나가 추천하는 새로운 시리즈도 있어요!"
1001405-70 = "[s] \"으음, 하지만 이즈나 시간이 늦어졌으니까…….\""
1001405-71 = "이것도 같이 보고 감상을 나누고 싶은데……."
1001405-72 = "안, 되나요……? (추욱)"
1001405-75 = "[ns] \"아니! 얼마든지 가능하지!\""
1001405-77 = "네! 두 번째 감상회, 시작이에요~♪"
1001405-79 = "(그렇게 이즈나와 감상회를 계속하며 밤을 지새웠다.)"
