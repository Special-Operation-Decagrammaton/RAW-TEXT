[translation]
1012303-1 = "어려운 대화"
1012303-2 = "샬레 집무실"
1012303-3 = "(세이아를 맞이하기 위해 어지러운 주변을 정돈하고 있었다.)"
1012303-8 = "이런……. 그렇게 준비하실 것까진 없는데."
1012303-9 = "저 때문에 이것저것 준비하시면, 저도 오기가 불편해지지 않겠나요?"
1012303-10 = "[s1] \"……세이아?\"\n[s2] \"아, 도착했구나.\""
1012303-17 = "……아니."
1012303-18 = "사실은 좀 기쁠지도 모르겠네요. 선생님께서 저에 대해 신경 써서 행동하신 일이 늘어난 거니까요."
1012303-19 = "이것도 뭐랄까……. 조금은 '비중이 늘었다'라고 할 수 있을지도."
1012303-20 = "[s3] \"……세이아?\"\n[s4] \"그거 입고 여기까지 온 거니?\""
1012303-23 = "후후, 신경 쓰이시나요?"
1012303-24 = "너무 걱정 마세요. 올 때 차를 타고 오기도 했으니, 그리 이상하지는 않았을 거예요."
1012303-25 = "……네?"
1012303-26 = "이 옷이 마음에 들었냐고요? 아아. 계속 입고 다녀서 그러시는 건가요?"
1012303-27 = "그야 물론이죠. 제가 직접 고른 옷인걸요."
1012303-28 = "그러고 보니 감상을 여쭤본 적이 없네요. 조금 궁금해지는걸요."
1012303-29 = "……어떠신가요? 선생님이 보시기에는."
1012303-30 = "[s5] \"물론 예쁘다고 생각해.\"\n[s6] \"패션 센스가 뛰어나구나, 세이아는.\""
1012303-33 = "……그렇군요."
1012303-34 = "뭐, 선생님이라면 그렇게 말해 주실 거라 생각했죠. 늘 그런 식이시니까요."
1012303-38 = "농담이에요. 순수하게 기쁜 기분이었는데, 그대로 말하기 부끄러워서요."
1012303-39 = "흠……. 패션 센스……. 패션 센스라……."
1012303-40 = "그렇죠. 이래 봬도 은근히 관심이 있는 쪽이거든요, 패션."
1012303-41 = "시즌과 기획에 맞는 옷……. 그러면서도 뻔하지 않게 포인트를 주는 건 재미있죠."
1012303-42 = "뭐랄까……. 좋은 플롯의 글이나 센스 좋은 수수께끼를 만드는 느낌. 이랄까요?"
1012303-43 = "물론 좋아하는 것에 비해, 막상 그걸 실현한 기회는 자주 주어지지 않지만요. 보는 눈도 많고요."
1012303-44 = "그러니 이런 날이라도……. 실력을 발휘해 보는 거죠."
1012303-45 = "그리고 이왕 실력을 발휘했으면, 여러 사람에게 보이고 싶은 것 또한 당연지사."
1012303-46 = "그런 의미에서 선생님께서 해주신 칭찬은 아주 기뻤어요. 감사합니다."
1012303-47 = "……의외신가요?"
1012303-48 = "[s7] \"조금은. 하지만 보기 좋아.\"\n[s8] \"의외의 면을 알아서 즐겁네.\""
1012303-51 = "또, 또. 그런 말씀을."
1012303-52 = "아무튼 마음 같아서는 함께 물놀이라도 가고 싶다는 생각이지만, 지금은 다소 바빠 보이시네요."
1012303-53 = "선생님의 업무를 방해하면서까지 떼를 쓰고 싶지는 않으니……."
1012303-57 = "……아니. 사실 쓰고 싶지만 너무 자주 하기도 그러니, 오늘은 그냥 이곳에서 조금 시간을 보내다 돌아가겠습니다."
1012303-58 = "괜찮으시겠죠? 그 정도는."
1012303-59 = "[s9] \"얼마든지.\"\n[s10] \"있고 싶은 만큼 있다가 가.\""
1012303-62 = "…………."
1012303-66 = "…………."
1012303-67 = "[s11] \"……? 세이아?\"\n[s12] \"뭔가 표정이…….\""
1012303-70 = "……아니에요."
1012303-71 = "그런 분이시라는 걸 모르지 않는데도, 계속 같은 방식을 고수하는 제게 잘못이 있는 거겠죠."
1012303-72 = "알겠습니다. 선생님께선 원래 그런 분이시니, 여기서는 제가 조금 더 나갈 수밖에 없겠네요."
1012303-80 = "[ns13] \"……세, 세이아?\"\n[ns14] \"무릎에 앉았어……?\""
1012303-83 = "여기서 쉬겠습니다. 신경 쓰지 마시고, 편하게 업무를 봐주세요."
1012303-84 = "아니면 제가 조금 거들 수 있는 게 있을지도 모르겠네요. 단순한 업무나, 기밀 서류가 아니라면 도와드리죠."
1012303-85 = "이래 봬도 이런 일, 꽤 잘하는 편이니까요."
1012303-86 = "……네?"
1012303-87 = "왜 그러냐고요? 혹시 화났냐고요?"
1012303-88 = "……후후."
1012303-89 = "아닙니다. 전혀 화나지 않았어요."
1012303-90 = "……아니죠."
1012303-91 = "정확하겐 화났었지만, 방금 선생님의 표정으로 인해 풀렸다……. 그렇게 말해야겠군요."
1012303-92 = "지금은 오히려 좀 즐거워졌으니, 신경 쓰지 않으셔도 된답니다."
1012303-96 = "……이 말은 정말이니, 걱정하지 않으셔도 된답니다."
1012303-97 = "자, 업무를 시작하세요. 선생님. 저도 거들 테니, 빨리 끝내고 쉬시죠."
1012303-98 = "얼른 끝내고……."
1012303-103 = "……휴게실에 가서, 잠시 쉬도록 해요."
1012303-105 = "(이후 세이아의 도움으로 그날의 업무를 빠르게 끝낼 수 있었다.)"
1012303-106 = "(휴게실로 돌아간 세이아는, 소파에서 느긋하게 낮잠을 잔 후 돌아갔다.)"
