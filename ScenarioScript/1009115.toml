[translation]
1009115-1 = "溫暖的音色"
1009115-2 = "（前往和千紗約好的地點）"
1009115-4 = "試聽室大廳"
1009115-8 = "這，這裡到底是什麼地方……？"
1009115-9 = "您好。"
1009115-10 = "歡迎來到Deminton試聽室。"
1009115-11 = "試聽室……？"
1009115-12 = "是可以自由使用各種設備聽音樂的地方……？"
1009115-13 = "原來還有這種地方啊。真神奇……"
1009115-14 = "總覺得有種大人的空間的感覺。"
1009115-15 = "請問要點什麼飲料呢？"
1009115-16 = "飲，飲料？要點什麼嗎？"
1009115-18 = "[ns]「請給我兩杯冰紅茶。」"
1009115-19 = "請問茶葉使用三一糖果配方可以嗎？"
1009115-20 = "好的，稍後為您送上兩杯on the rocks。"
1009115-21 = "那麼請先讓我帶兩位去試聽室。"
1009115-23 = "試聽室內部"
1009115-24 = "要在這個房間聽音樂嗎……？"
1009115-25 = "話說老師剛才很像大人呢。"
1009115-26 = "[s]「畢竟我確實是大人嘛……」"
1009115-27 = "哼嗯～？"
1009115-28 = "話說你常常來這裡嗎？感覺很熟練耶？"
1009115-29 = "……哈哈，開玩笑的，開玩笑。"
1009115-30 = "嗯？是來之前先上網查過的？"
1009115-31 = "這，這樣啊……"
1009115-35 = "抱歉……"
1009115-36 = "[s]「不用道歉啦！」"
1009115-37 = "好，好吧，那麼……"
1009115-38 = "先說說來這裡的目的吧。"
1009115-43 = "嗯？問我是不是出專輯了？"
1009115-44 = "怎麼可能。這只是請人做來收藏用的，而且只做了一張而已。"
1009115-45 = "最近有那種只要把音樂檔案傳過去，就能製作成這種黑膠唱片的公司呢。"
1009115-49 = "……"
1009115-50 = "等等，你心裡是不是在想「連播放設備都沒有為什麼還要做這種東西」？"
1009115-51 = "[s]「我哪有！？」"
1009115-52 = "不過就算你真的這麼想，我也無法反駁就是了……"
1009115-53 = "[s]「我真的沒有這麼想啦……！」"
1009115-54 = "可是老師，有時候感性會超越理性。"
1009115-55 = "就像雖然不是自己喜歡的口味，看到漂亮的蛋糕也會突然想買一樣。"
1009115-56 = "這張黑膠唱片就是這麼來的。"
1009115-57 = "外觀有股微妙的陌生感……散發著一種復古的魅力。"
1009115-58 = "所以就嘗試訂做了一張。很漂亮吧？"
1009115-59 = "不過做都做了，如果只能擺著裝飾不就太可惜了嗎？"
1009115-60 = "而且我聽說黑膠唱片跟數位音源不同，音色聽起來會比較溫暖……於是就有點好奇。"
1009115-61 = "所以才會想找個方法播放看看……"
1009115-62 = "想著想著就決定聯絡老師了。"
1009115-63 = "看來我果然找對人了呢，呵呵。"
1009115-64 = "好，那就來聽聽看吧？"
1009115-65 = "首先要小心地拿出來，不能讓唱片留下指紋……"
1009115-69 = "接著放在唱盤上……"
1009115-70 = "然後是……那個……"
1009115-71 = "話說老師，這個針是要放在唱片的內側還是外側……？"
1009115-72 = "[s]「這，這個嘛……」"
1009115-77 = "（幸好這時店員正巧拿著冰紅茶過來，才得以順利地播放唱片）"
1009115-78 = "（就這樣，千紗的歌曲試聽會開始了）"
1009115-80 = "唔嗯……果然有點不好意思呢。"
1009115-81 = "和老師一起聽我唱的歌……"
1009115-82 = "所以……怎麼樣呢，老師？"
1009115-83 = "[s1]「雖然還有點生疏……」\n[s2]「但是這種青澀的感覺，反而讓人很喜歡。」"
1009115-89 = "生疏，是嗎……"
1009115-90 = "嗯……"
1009115-91 = "[s]「我，我說錯話了嗎！？」"
1009115-92 = "沒有啦，只是幾乎完全被你說中了而已。"
1009115-93 = "現在聽的這個，其實是我們第一次沒有中斷、完整演奏整首曲子時的錄音。"
1009115-94 = "雖然成功演奏到最後很有意義，但難免還是會有點生疏。"
1009115-95 = "有人會突然暴衝，有人整個小節都沒有跟上……"
1009115-96 = "……我自己也破音了好幾次。"
1009115-97 = "不過就是因為這樣，我才想把它做成唱片。"
1009115-98 = "畢竟錄製得很完美的唱片到處都有，卻沒有紀錄著歌曲誕生過程的唱片不是嗎？"
1009115-99 = "雖然有點粗糙，不過那也是回憶的一部分嘛。"
1009115-100 = "嗯，總結來說……"
1009115-101 = "[s] 「就是情懷呢。」"
1009115-102 = "就是情懷沒錯。"
1009115-103 = "……"
1009115-104 = "啊，結束了。"
1009115-105 = "[s]「嗯？後面好像還有？」"
1009115-107 = "（熟悉的聲音，伴隨著熟悉的歌曲流淌而出）"
1009115-108 = "（然而那並不是千紗的聲音）"
1009115-109 = "（這是……）"
1009115-111 = "[ns]「等等，這個聲音是……！」"
1009115-112 = "呵呵，馬上就聽出來了呢，老師。"
1009115-113 = "[s3]「當然！這是我的聲音啊！」\n[s4]「什麼時候錄的！？」"
1009115-116 = "上次一起去卡拉OK的時候錄的。"
1009115-117 = "現在的卡拉OK機器從錄音到傳送檔案，只要按一個按鈕就可以全部搞定哦？"
1009115-118 = "如果仔細聽的話，背景音裡應該還能聽到我打鈴鼓的聲音。"
1009115-119 = "[s5]「真的耶……？」\n[s6]「不過我唱的歌為什麼會在唱片裡……？」"
1009115-122 = "……因為老師也一起努力了嘛。"
1009115-123 = "當然有資格被收錄在唱片裡。"
1009115-124 = "話說回來……"
1009115-125 = "聲音真溫暖呢。"
1009115-126 = "……"
1009115-130 = "不是！我說的是唱片的音色！#n就是那種數位音源感受不到的……類比訊號特有的雜音！#n那個……總之就是……！"
1009115-132 = "……聽起來很溫暖。"
