[translation]
1009115-1 = "A Warm Tone"
1009115-2 = "The next day, I went to meet Kazusa at the spot I had sent her."
1009115-4 = "Audio Room Lobby"
1009115-5 = ""
1009115-7 = ""
1009115-8 = "Wh-What is this place...?"
1009115-9 = "Greetings, guests. "
1009115-10 = "Welcome to Demington Audio Room."
1009115-11 = "\"Audio Room\"...?"
1009115-12 = "\"A space built to allow audiophiles to enjoy music in its numerous forms using our collection of vintage music equipment.\""
1009115-13 = "I didn't know this was a thing. That's cool."
1009115-14 = "Feels kinda...for adults, for some reason."
1009115-15 = "What would you like to drink?"
1009115-16 = "A-A drink? Us?"
1009115-17 = ""
1009115-18 = "[ns] \"Two iced teas, please.\""
1009115-19 = "Would the Trinity Candy Blend be fine?"
1009115-20 = "I'll bring you two glasses on the rocks, right away."
1009115-21 = "Please follow me to the Audio Room."
1009115-23 = "Inside the Audio Room"
1009115-24 = "So I guess people come here to listen to music..."
1009115-25 = "Hey, but, you were such an ADULT back there, Sensei."
1009115-26 = "[s] \"Because I am?\""
1009115-27 = "Hm? What'd you say?"
1009115-28 = "So, have you been here before? You were acting like you owned the place."
1009115-29 = "...Haha, just kidding, just kidding."
1009115-30 = "Wha—? You did some research online before coming here?"
1009115-31 = "Ah, well, um..."
1009115-32 = ""
1009115-34 = ""
1009115-35 = "I'm sorry... "
1009115-36 = "[s] \"You don't have to apologize!\""
1009115-37 = "O-Okay, if you say so..."
1009115-38 = "This is the whole reason why I wanted to come here."
1009115-39 = ""
1009115-41 = ""
1009115-43 = "Hm? Did I release an album?"
1009115-44 = "Hah! No way. It's just one vinyl I recorded, for my personal collection."
1009115-45 = "There are places nowadays that can press one for you if you send them the audio file."
1009115-46 = ""
1009115-48 = ""
1009115-49 = "..."
1009115-50 = "I just saw you think it! \"Why make a vinyl when you don't have a turntable to play it on?\" Right?"
1009115-51 = "[s] \"Me?!\""
1009115-52 = "Well, I guess I wouldn't have anything to say in defense..."
1009115-53 = "[s] \"The thought didn't even cross my mind!\""
1009115-54 = "I've been thinking, Sensei. There are times in life when emotions trump logic."
1009115-55 = "Like how people will buy a cake for its aesthetics, even if they don't like the taste."
1009115-56 = "I think that's why I liked the idea of making a vinyl too."
1009115-57 = "It's a pretty unfamiliar item for students today, which gives it that vintage charm."
1009115-58 = "So that's why I ordered one. I think it turned out pretty nice."
1009115-59 = "Anyway, I thought it'd be a shame to just hang it up and never let it realize its true purpose."
1009115-60 = "I've heard that records can have a...\"warmer\" sort of tone than digital tracks, so I was curious about that too."
1009115-61 = "I was trying to figure out how to play it without buying an entire record player... "
1009115-62 = "And that's when I messaged you."
1009115-63 = "Which was obviously the right move. Heehee."
1009115-64 = "All right. Should we try giving this a spin?"
1009115-65 = "I need to be careful taking it out, so I don't get any fingerprints on it."
1009115-66 = ""
1009115-68 = ""
1009115-69 = "Put it on the turntable..."
1009115-70 = "And then... Um..."
1009115-71 = "Sensei... Do I put the needle on the innermost or outermost groove of the record?"
1009115-72 = "[s] \"Uh, well...\""
1009115-73 = ""
1009115-75 = ""
1009115-77 = "Luckily, a staff member came in with our iced teas, so we were able to get the record playing eventually."
1009115-78 = "We listened to Kazusa's song together."
1009115-80 = "Mm, it's a bit embarrassing."
1009115-81 = "Listening to myself sing with you sitting here, too..."
1009115-82 = "So, what did you think, Sensei?"
1009115-83 = "[s1] \"It's a bit clumsy...\"\n[s2] \"But it's youthful and nice.\""
1009115-86 = ""
1009115-88 = ""
1009115-89 = "\"Clumsy\"..."
1009115-90 = "You say..."
1009115-91 = "[s] \"D-Did I say something wrong?!\""
1009115-92 = "No, that's exactly it."
1009115-93 = "This is the first time Sugar Rush managed a full playthrough of a song without stopping once."
1009115-94 = "So of course it's a little clumsy. What matters is that, regardless, we still did it."
1009115-95 = "Someone went a little overboard, someone else messed up an entire verse..."
1009115-96 = "...and I played the wrong note a bunch of times."
1009115-97 = "All of that is actually exactly why I wanted to...\"record\" it on vinyl."
1009115-98 = "It's normally only the clean, perfectly polished version of a record that gets released. You don't hear behind-the-scenes versions very often."
1009115-99 = "I'll cherish the memories of all the bumps and dips we experienced during the process too."
1009115-100 = "What I'm trying to say is..."
1009115-101 = "[s] \"It's the vibes.\""
1009115-102 = "It's the vibes."
1009115-103 = "..."
1009115-104 = "Ah, the song's over. "
1009115-105 = "[s] \"Hm? It's still playing...\""
1009115-106 = ""
1009115-107 = "There was a familiar voice singing a familiar song."
1009115-108 = "But it wasn't Kazusa's voice."
1009115-109 = "It was..."
1009115-110 = ""
1009115-111 = "[ns] \"Hold on, this is...?!\""
1009115-112 = "Fufu, I knew you'd notice right away, Sensei."
1009115-113 = "[s3] \"Of course I would! It's my voice!\"\n[s4] \"When did you record this?!\""
1009115-116 = "Last time, at karaoke."
1009115-117 = "Didn't you know that karaoke machines can record and even send audio files with the click of a button these days, Sensei?"
1009115-118 = "You might even hear me playing tambourine for you if you listen closely."
1009115-119 = "[s5] \"The world advances so quickly...\"\n[s6] \"But wait, why is my song on the record too?\""
1009115-122 = "...Because you've been working hard at our side this whole time."
1009115-123 = "Isn't it obvious you deserve to be on there, Sensei?"
1009115-124 = "Anyway..."
1009115-125 = "What a warm voice."
1009115-126 = "..."
1009115-127 = ""
1009115-129 = ""
1009115-130 = "No! I meant the tone of the record! The analog exclusive noise that you can't feel from a digital soundtrack is— Yeah! That's it! Just something about that old-school style!"
1009115-132 = "...It's warm."
