[translation]
1009115-1 = "溫暖的音色"
1009115-2 = "（前往和千紗約好的地點）"
1009115-4 = "試聽室大廳"
1009115-8 = "這，這裡到底是什麼地方……？"
1009115-9 = "您好。"
1009115-10 = "歡迎來到Deminton試聽室。"
1009115-11 = "試聽室……？"
1009115-12 = "是可以自由使用各種音響設備聽音樂的地方……？"
1009115-13 = "還有這種地方啊，真神奇……"
1009115-14 = "總覺得有種大人的空間的感覺。"
1009115-15 = "請問要點什麼飲料呢？"
1009115-16 = "呃，飲料？要點什麼嗎？"
1009115-18 = "[ns]「請給我兩杯冰紅茶。」"
1009115-19 = "請問茶葉使用三一水果糖配方可以嗎？"
1009115-20 = "好的，稍後為您送上兩杯on the rocks。"
1009115-21 = "那麼請先讓我帶兩位去試聽室。"
1009115-23 = "試聽室內部"
1009115-24 = "要在這個房間聽音樂嗎……？"
1009115-25 = "話說老師剛才很像大人呢。"
1009115-26 = "[s]「因為是大人嘛……」"
1009115-27 = "哼～？"
1009115-28 = "話說，你很常來嗎？感覺你很熟練呢？"
1009115-29 = "……哈哈，開玩笑的，開玩笑。"
1009115-30 = "嗯？老師是來之前先上網查過的嗎？"
1009115-31 = "是那樣啊，呃……"
1009115-35 = "抱歉……"
1009115-36 = "[s]「不用道歉啦！」"
1009115-37 = "嗯，那，那就……"
1009115-38 = "先說說來這裡的目的吧。"
1009115-43 = "嗯？這不是專輯哦？"
1009115-44 = "這只是請人製作拿來個人收藏用的，而且只做了一張。"
1009115-45 = "最近有那種，只要傳音樂檔案過去就能製作成這種黑膠唱片的公司呢。"
1009115-49 = "……"
1009115-50 = "等等，你心裡是不是在想「連播放器都沒有幹嘛做這種東西」？"
1009115-51 = "[s]「我嗎！？」"
1009115-52 = "嗯……說實話就算這麼想我也沒話說……"
1009115-53 = "[s]「我才沒有這樣想……！」"
1009115-54 = "不過老師，有時候感性會超越理性。"
1009115-55 = "就算不是自己喜歡的口味，看到漂亮的蛋糕也會突然想買，就像那種感覺。"
1009115-56 = "這張黑膠唱片也是因為這樣來的。"
1009115-57 = "外觀有種微妙的陌生感……所以有種復古的魅力。"
1009115-58 = "於是就訂做看看了，很漂亮吧。"
1009115-59 = "不過好不容易做了卻只能擺著裝飾也太可惜了吧？"
1009115-60 = "而且黑膠唱片跟數位音源不同，音色很溫暖……#n這是聽說的，所以我很好奇。"
1009115-61 = "就想找個方法播放看看……"
1009115-62 = "煩惱了一下就聯絡老師了。"
1009115-63 = "結果是正確的呢，呵呵。"
1009115-64 = "好，那就來聽聽看吧？"
1009115-65 = "首先要小心地拿出來，不能讓唱片留下指紋……"
1009115-69 = "放在唱盤上然後……"
1009115-70 = "然後是……呃……"
1009115-71 = "……話說老師，這個針要放在唱片內側還是外側……？"
1009115-72 = "[s]「呃，那個……」"
1009115-77 = "（幸好有正巧拿著冰紅茶過來的店員幫忙，才成功地播放了）"
1009115-78 = "（就這樣，千紗的歌曲試聽會開始了）"
1009115-80 = "嗯，果然有點不好意思呢。"
1009115-81 = "和老師一起聽我唱的歌……"
1009115-82 = "所以……怎麼樣，老師？"
1009115-83 = "[s1]「雖然還有點生疏……」\n[s2]「但這種青澀感，反而讓人很喜歡。」"
1009115-89 = "生疏嗎……"
1009115-90 = "嗯……"
1009115-91 = "[s]「我，我說錯什麼了嗎！？」"
1009115-92 = "沒有，只是因為就像老師說的。"
1009115-93 = "現在聽的這個，是我們第一次沒有中斷，完整演奏整首曲子時的錄音。"
1009115-94 = "完奏是有意義的，但當然會有些生疏。"
1009115-95 = "有人突然暴走，有人整個小節都彈錯……"
1009115-96 = "……我好幾次都破音。"
1009115-97 = "不過正因為如此，才想做成唱片。"
1009115-98 = "錄製精美的歌曲唱片很多，但是卻沒有記錄那首歌誕生過程的唱片吧？"
1009115-99 = "雖然有點粗糙，但那也是回憶的一部分呢。"
1009115-100 = "嗯，總結來說……"
1009115-101 = "[s]（很感性呢）"
1009115-102 = "就是感性。"
1009115-103 = "……"
1009115-104 = "啊，結束了。"
1009115-105 = "[s]「嗯？後面好像還有？」"
1009115-107 = "（熟悉的聲音，熟悉的歌曲流淌而出）"
1009115-108 = "（但那不是千紗的聲音）"
1009115-109 = "（這是……）"
1009115-111 = "[ns]「等等，這個聲音是……！」"
1009115-112 = "呵呵，馬上就聽出來了呢，老師。"
1009115-113 = "[s3]「當然！這是我的聲音啊！」\n[s4]「什麼時候錄的！？」"
1009115-116 = "上次一起去卡拉OK的時候錄的。"
1009115-117 = "現在的卡拉OK機器從錄音到傳送檔案，只要按一個按鈕就可以全部搞定哦？"
1009115-118 = "仔細聽，背景音裡應該能聽到我打的鈴鼓聲哦？"
1009115-119 = "[s5]「真的耶……？」\n[s6]「不過我唱的歌為什麼會在唱片裡……？」"
1009115-122 = "……因為老師也一起努力了嘛。"
1009115-123 = "當然有資格被收錄在唱片裡。"
1009115-124 = "話說回來……"
1009115-125 = "聲音真溫暖呢。"
1009115-126 = "……"
1009115-130 = "不是！我說的是唱片的音色！就是……#n數位音源感受不到的類比特有的噪音，那個……所以就是……！"
1009115-132 = "……這樣的感覺，很溫暖。"
