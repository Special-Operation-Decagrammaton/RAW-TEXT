[translation]
1009115-1 = "น้ำเสียงที่อบอุ่น"
1009115-2 = "(วันต่อมา คุณครูออกไปพบคาซึสะตามสถานที่ที่นัดกันไว้)"
1009115-4 = "ล็อบบี้ห้องฟังเพลง"
1009115-8 = "ทะ... ที่นี่เป็นสถานที่แบบไหนเหรอ...?"
1009115-9 = "สวัสดีค่ะทุกคน"
1009115-10 = "ยินดีต้อนรับสู่ห้องฟังเพลงเดมินตันค่ะ"
1009115-11 = "ห้องฟังเพลง...?"
1009115-12 = "ที่ที่ฟังเพลงได้อย่างอิสระโดยใช้เครื่องเสียงเก่าๆ งั้นเหรอ"
1009115-13 = "มีสถานที่แบบนี้อยู่ด้วยสินะ น่าทึ่งจังเลย..."
1009115-14 = "รู้สึกเหมือนเป็นพื้นที่ของผู้ใหญ่เลยละ"
1009115-15 = "จะรับเครื่องดื่มอะไรดีคะ?"
1009115-16 = "คะ... เครื่องดื่ม? ในที่แบบนี้น่ะเหรอ?"
1009115-18 = "[ns] \"ขอเป็นชาเย็นสองแก้วนะ\""
1009115-19 = "รับเป็นใบชาทรินิตี้ แคนดี้ เบลนด์ดีมั้ยคะ?"
1009115-20 = "ถ้างั้นฉันจะรีบเอาชาออนเดอะร็อกสองแก้วมาเสิร์ฟนะคะ"
1009115-21 = "เอาละค่ะ ฉันจะพาไปที่ห้องฟังเพลงนะคะ"
1009115-23 = "ในห้องฟังเพลง"
1009115-24 = "จะได้ฟังเพลงในห้องนี้งั้นเหรอ..."
1009115-25 = "ว่าแต่ คุณครู เมื่อกี้คุณครูดูเป็นผู้ใหญ่มากเลยละ"
1009115-26 = "[s] \"ก็ครูเป็นผู้ใหญ่นี่นา...\""
1009115-27 = "อืม~?"
1009115-28 = "จะว่าไป คุณครูคงเคยมาที่นี่กับคนอื่นบ่อยๆ สินะ? ดูทำอะไรคล่องเชียวละ?"
1009115-29 = "ฮ่าๆ ฉันล้อเล่นน่า ล้อเล่น..."
1009115-30 = "หืม? คุณครูก็หาข้อมูลจากอินเทอร์เน็ตมาล่วงหน้าเหมือนกันงั้นเหรอ?"
1009115-31 = "อ่า... อย่างนั้นสินะ... อืม..."
1009115-35 = "ขอโทษค่ะ... "
1009115-36 = "[s] \"ไม่เห็นต้องขอโทษสักหน่อย!\""
1009115-37 = "เอาเถอะ... ถะ... ถ้างั้น..."
1009115-38 = "เรามาคุยเรื่องวัตถุประสงค์ของการมาที่นี่กันก่อนดีกว่า"
1009115-43 = "หืม? ถามว่าทำอัลบั้มขายหรือเปล่าน่ะเหรอ?"
1009115-44 = "ไม่มีทางหรอก ฉันแค่ทำเก็บไว้ฟังเป็นการส่วนตัวน่ะ แล้วก็แค่แผ่นเดียวด้วย"
1009115-45 = "เดี๋ยวนี้น่ะมีบริษัทที่ผลิตแผ่นเสียง LP แบบนี้ให้ได้ เราแค่ส่งไฟล์เพลงให้ก็พอ"
1009115-49 = "..."
1009115-50 = "เดี๋ยวนะ กำลังคิดอยู่ใช่มั้ยว่า \"เครื่องเล่นแผ่นเสียงก็ไม่มี แล้วจะทำแผ่นเสียงทำไม?\""
1009115-51 = "[s] \"เปล่าสักหน่อย!\""
1009115-52 = "แต่ก็นะ ต่อให้จะคิดแบบนั้นจริงๆ ฉันก็คงเถียงไม่ออก..."
1009115-53 = "[s] \"ครูไม่ได้คิดแบบนั้นเลยนะ...!\""
1009115-54 = "แต่ว่านะ คุณครู บางครั้งอารมณ์ก็สำคัญกว่าเหตุผลนะ"
1009115-55 = "ก็เหมือนเวลาที่เราเห็นเค้กก้อนสวยๆ แล้วเกิดอยากซื้อขึ้นมาทันที ต่อให้มันจะไม่ใช่รสชาติที่เราชอบ#nก็ตาม"
1009115-56 = "ฉันว่าตัวเองสนใจในแผ่นเสียง LP ด้วยเหตุผลนั้นละ"
1009115-57 = "มันดูแปลกตาดี... แล้วก็มีเสน่ห์แบบวินเทจด้วย"
1009115-58 = "ฉันก็เลยลองสั่งทำดูน่ะ ก็มันสวยนี่นา"
1009115-59 = "อุตส่าห์ทำมาทั้งที แต่ถ้าเอามาวางเป็นของตกแต่งอย่างเดียว มันก็น่าเสียดายไม่ใช่เหรอ?"
1009115-60 = "อีกอย่างนะ ฉันได้ยินว่าเสียงจากแผ่นเสียง LP อบอุ่นกว่าเสียงจากเพลงดิจิทัลด้วย... ฉันก็เลยอยากลองฟังขึ้นมาน่ะ"
1009115-61 = "ก็เลยคิดว่าจะเปิดฟังยังไงได้บ้างนะ... "
1009115-62 = "ฉันคิดเรื่องนี้อยู่พักใหญ่ จนตัดสินใจติดต่อครูไปยังไงล่ะ"
1009115-63 = "ถือว่าฉันทำได้ดีเลยนะ ฮุฮุ"
1009115-64 = "เอาละ งั้นเรามาลองฟังกันเลยมั้ย?"
1009115-65 = "ก่อนอื่นก็เอาแผ่นเสียงออกมาอย่างระมัดระวัง จะได้ไม่มีรอยนิ้วมือบนแผ่น..."
1009115-69 = "แล้วก็เอาวางบนเครื่องเล่นแผ่นเสียง..."
1009115-70 = "จากนั้นก็... อ่า..."
1009115-71 = "คุณครู... ฉันควรวางให้หัวเข็มอยู่ข้างในหรือข้างนอกแผ่นเสียงเหรอ...?"
1009115-72 = "[s] \"อ่า... ครูก็...\""
1009115-77 = "(โชคดีที่พนักงานเอาชาเย็นมาเสิร์ฟพอดี จึงขอความช่วยเหลือจนเปิดฟังแผ่นเสียงได้)"
1009115-78 = "(และการดื่มด่ำกับบทเพลงของคาซึสะก็เริ่มขึ้น)"
1009115-80 = "อืม มันน่าเขินจริงๆ ด้วยนะ"
1009115-81 = "คิดไม่ถึงเลยว่าจะได้มาฟังเพลงที่ฉันร้องเองกับคุณครูแบบนี้..."
1009115-82 = "ว่าไงล่ะ เป็นยังไงบ้าง คุณครู?"
1009115-83 = "[s1] \"ตอนแรกดูเงอะงะหน่อยๆ แต่ก็ฟังดูมีชีวิตชีวาดีนะ\"\n[s2] \"ตอนแรกฟังดูเงอะงะๆ หน่อย แต่ก็ฟังดูมีชีวิตชีวาดีนะ\""
1009115-89 = "เงอะงะ... งั้นเหรอ..."
1009115-90 = "นี่..."
1009115-91 = "[s] \"คะ... ครูพูดอะไรผิดไปงั้นเหรอ?!\""
1009115-92 = "ไม่หรอก มันชัดเจนมากต่างหาก"
1009115-93 = "เพลงที่ฟังอยู่ตอนนี้เป็นการแสดงของวงที่เราทั้งร้องและเล่นจนจบเพลงเป็นครั้งแรก โดยไม่ได้หยุดพักเลยน่ะ"
1009115-94 = "ถึงจะเล่นจนจบเพลง แต่มันก็ต้องฟังดูเงอะงะอยู่แล้วละ"
1009115-95 = "คนหนึ่งโซโล่สดแบบไม่สนใจใคร ส่วนอีกคนก็เล่นผิดจังหวะไปทั้งท่อน..."
1009115-96 = "ส่วนฉันก็ร้องผิดคีย์ไปตั้งหลายรอบ..."
1009115-97 = "แต่ว่านะ พอเป็นแบบนั้นฉันยิ่งอยากทำแผ่นเสียงเก็บไว้"
1009115-98 = "มีแผ่นเสียงมากมายที่บันทึกเพลงที่สมบูรณ์แบบแล้ว แต่ไม่มีแผ่นเสียงไหนที่บันทึกกระบวนการ#nสร้างสรรค์เพลงพวกนั้นขึ้นมาเลยนี่นา?"
1009115-99 = "ถึงจะมีข้อผิดพลาดนิดหน่อย แต่มันก็เป็นส่วนหนึ่งของความทรงจำนะ"
1009115-100 = "อืม ถ้าให้สรุปก็ประมาณนั้นละ..."
1009115-101 = "[s] \"น่าประทับใจดีเลยละ\""
1009115-102 = "น่าประทับใจดีเนอะ"
1009115-103 = "..."
1009115-104 = "อ๊ะ เพลงจบแล้ว "
1009115-105 = "[s] \"หืม? มีเพลงอื่นต่อทันทีเลยนี่นา?\""
1009115-107 = "(บทเพลงและน้ำเสียงที่คุ้นเคยดังขึ้น)"
1009115-108 = "(แต่นั่นไม่ใช่เสียงของคาซึสะ)"
1009115-109 = "(แต่เป็น...)"
1009115-111 = "[ns] \"เดี๋ยวก่อน นี่มันเสียงของ...!\""
1009115-112 = "ฮุฮุ ฟังออกทันทีเลยสินะ คุณครู"
1009115-113 = "[s3] \"ต้องฟังออกอยู่แล้ว! ก็นั่นมันเสียงครูนี่นา!\"\n[s4] \"แอบอัดเสียงครูไว้ตอนไหนน่ะ?!\""
1009115-116 = "ฉันอัดไว้ตอนไปคาราโอเกะด้วยกันคราวก่อนน่ะ"
1009115-117 = "เครื่องคาราโอเกะสมัยนี้น่ะ แค่กดปุ่มครั้งเดียวก็ทำได้ตั้งแต่บันทึกเสียงและส่งไฟล์เสียงได้เลยนะคะ คุณครู"
1009115-118 = "ลองฟังให้ดีสิ บางทีอาจได้ยินเสียงฉันเคาะแทมบูรีนด้วยก็ได้นะ?"
1009115-119 = "[s5] \"จริงด้วยแฮะ...? แต่ทำไมถึงเอาเพลงนี้มา...\"\n[s6] \"แต่ทำไมถึงเอาเพลงที่ครูร้องมาใส่ไว้ด้วยล่ะ...?\""
1009115-122 = "ก็คุณครูพยายามไปกับพวกเราด้วยนี่นา..."
1009115-123 = "งั้นเพลงของคุณครูก็สมควรได้อยู่ในแผ่นเสียงของพวกเราด้วยสิ"
1009115-124 = "จะว่าไป..."
1009115-125 = "น้ำเสียงอบอุ่นจังเลยนะ"
1009115-126 = "..."
1009115-130 = "ไม่ใช่! ฉันหมายถึงเสียงที่ได้ยินจากแผ่นเสียงต่างหาก! เสียงรบกวนที่เป็นเอกลักษณ์ที่หาฟังไม่ได้#nจากเพลงดิจิทัล อะ... อะไรแบบนั้นต่างหาก... ที่มัน...!"
1009115-132 = "อบอุ่น... น่ะ"
