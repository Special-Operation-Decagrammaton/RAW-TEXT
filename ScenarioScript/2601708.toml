2601708-47 = "5;라나;S2_03;아. 파래를 빼먹었군요. 타코야끼의 가장 중요한 부분인 점, 동감합니다.\n#5;em;[반짝]"
2601708-48 = "1;배달 기사;06;그게 아니잖아, 요!!! 저희는 음식만 배달한다고요!\n#1;hophop\n#1;em;[스팀]"
2601708-49 = "5;라나;S2_02;실례합니다만, 음식 배달 프로토콜에서 <음식>의 정의는 어떻게 될까요?\n#5;em;[?]"
2601708-50 = "1;배달 기사;02;프로…… 뭐?"
2601708-51 = "1;배달 기사;01;음식이 뭐냐는 말이야? 당연히 먹을 수 있는 게 음식이지!\n#1;em;[!]"
