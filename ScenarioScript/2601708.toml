[translation]
2601708-1 = "프로토콜의 명세"
2601708-2 = "(라나의 연락을 받고 급하게 1층으로 내려왔다.)"
2601708-6 = "오기만 해봐라, 아주 그냥……!"
2601708-7 = "너무 뭐라 하진 말아주십시오. 선생님께서도 분명 깊이 반성하실 겁니다."
2601708-8 = "너를 혼내려고 부르는 거거든!"
2601708-10 = "[ns] \"저, 저기…… 혹시 무슨 일로…….\""
2601708-12 = "이제야 왔구만! 얘 보호자 맞죠?"
2601708-13 = "[s] \"어른이니까, 모든 아이들의 보호자입니다.\""
2601708-14 = "말은 잘하네, 흥!"
2601708-15 = "대체 무슨 일이 있었는지 알기나 해요? 얘가 말이지……."
2601708-17 = "하이고, 뭔 배달 음식을 이런 곳에서 픽업하라는 거야. 이렇게 멀면 그냥 택배로 보내지……."
2601708-18 = "그래도, 여기서 D.U.까지면 장거리 요금이라 좋긴 하지만."
2601708-19 = "무료 배달 쿠폰이지만 어차피 정산은 들어오니까, 오늘 마수걸이가 좋네!"
2601708-23 = "오, 마중도 나온 건가? 여기 사장님은 친절하구만!"
2601708-27 = "안녕하세요! 배달 음식 픽업하러 왔습니다!"
2601708-28 = "아."
2601708-32 = "안녕하세요, 요리인 타코야끼입니다."
2601708-33 = "저를 픽업해주세 요리-."
2601708-37 = "에?"
2601708-40 = "[ns] \"에?\""
2601708-41 = "그쵸? 당연히 그 반응이 나오죠?"
2601708-42 = "아무튼, 사람은 배달 안 된다고 하는데도 눈 동그랗게 뜨고 말이지-"
2601708-44 = "얘야, 아니, 손님! 이건 음식 배달 서비스거든요?!"
2601708-45 = "머리에 가쓰오부시 올리고 타코야끼라고 해도 안 되거든요?!"
2601708-46 = "보시다시피 타코야끼, 입니다만."
2601708-47 = "아. 파래를 빼먹었군요. 타코야끼의 가장 중요한 부분인 점, 동감합니다."
2601708-48 = "그게 아니잖아, 요!!! 저희는 음식만 배달한다고요!"
2601708-49 = "실례합니다만, 음식 배달 프로토콜에서 <음식>의 정의는 어떻게 될까요?"
2601708-50 = "프로…… 뭐?"
2601708-51 = "음식이 뭐냐는 말이야? 당연히 먹을 수 있는 게 음식이지!"
2601708-52 = "네. 마찬가지로 저도 먹을 수 있습니다."
2601708-53 = "여기, 머리 위에 먹을 수 있는 가쓰오부시가 있습니다."
2601708-54 = "말도 안 되는 소리야! 아주 일부분만 먹을 수 있는 거잖아?"
2601708-55 = "그렇다면, 코코넛이나 대게처럼 먹을 수 있는 부분이 적다면 음식이 아니게 됩니다만."
2601708-56 = "뭐……?! 그, 그렇긴 하지만 그건 음식이잖아?!"
2601708-57 = "그렇지! 너는 일단 살아 있잖아! 그러면 음식이 아니야!"
2601708-58 = "그 논리대로라면, 산낙지도 음식이 아니게 됩니다."
2601708-59 = "아니 진짜!! 음식이란 건 최소한-"
2601708-60 = "그렇다면 이것도 음식이 아닙니다만-"
2601708-61 = "아니! 그건 음식이 맞지! 아휴 진짜, 그러니까 음식이란 건 말야-"
2601708-62 = "정의에 예외가 발생할 때마다 조건을 추가하시는군요."
2601708-63 = "현재 조건문이 17개가 되었습니다만, 재귀적으로 정의하시는 편이 더 효율적일 것 같습니다."
2601708-64 = "뭐, 뭔 소리야?!"
2601708-65 = "자, 그렇다면 이건 과연 음식일까요-"
2601708-68 = "하아……."
2601708-69 = "[s1] \"여기에 데리고 왔다는 건…….\"\n[s2] \"결국 음식이라는 걸 납득했다는 건가요……?\""
2601708-72 = "그럴 리가 있겠냐고!! 수십 분 넘게 계속 말대꾸하니까 지긋지긋해서 그냥 데려온 거지!"
2601708-73 = "음식 배달 프로토콜에 예외 처리가 추가된 것, 아주 기쁩니다."
2601708-74 = "추가 안 됐거든-!!!"
2601708-75 = "요금도 플랫폼에서 제대로 받았고, 장거리도 가끔 뛰니까 문제는 없지만…… 하아."
2601708-76 = "앞으로 다시는 이런 거 안 할 거니까, 제대로 보호자가 타일러둬요!"
2601708-77 = "[s3] \"죄송합니다…….\"\n[s4] \"제대로 보호하겠습니다…….\""
2601708-80 = "나였으니 다행이지, 다른 나쁜 녀석이 받았으면 위험하잖아요?"
2601708-81 = "기사님은 확실히 선량하고 다정하십니다. 아주 기뻤습니다."
2601708-82 = "음식인 제게도 인격적으로 대해주시는 훌륭한 분이십니다."
2601708-83 = "말은 하여튼…… 그럼 갑니다, 흥! 잘 보호해요!"
2601708-88 = "차분히 설명하니 납득하신 것 같아서 다행입니다."
2601708-89 = "[s5] \"전혀 그런 건 아닌 것 같지만…….\"\n[s6] \"다음부터는 좀 더 안전히 오자꾸나.\""
2601708-92 = "여분의 헬멧도 씌워주셔서 안전하게 왔습니다."
2601708-93 = "그래서, 이제부터 뭘 하시겠습니까."
2601708-94 = "[s] \"뭔가 용건이 있어서 온 게 아니었어?\""
2601708-95 = "저는 딱히 용무가 없습니다. 그냥 선생님이 뵙고 싶어서 왔습니다."
2601708-96 = "바쁘실 테니 평소 하던 일을 하시면, 저는 옆에 있겠습니다."
2601708-97 = "[s] \"……나들이라도…… 갈까?\""
2601708-98 = "좋습니다. 운이 좋군요. 때마침 나들이하신다니. 오늘 오길 잘했습니다."
2601708-99 = "따라가겠습니다."
2601708-108 = "벌써 밤이 되었군요."
2601708-109 = "선생님 덕분에 좋은 시간을 보냈습니다."
2601708-110 = "세상에는 재미있는 것들이 여러 가지 있군요."
2601708-111 = "어린아이가 늦은 시간까지 돌아다니면 좋지 않기에, 이만 들어가 보겠습니다."
2601708-112 = "다음에 더 많이 뵙겠으니, 섭섭해하지 않으셨으면 합니다."
2601708-113 = "[s7] \"할 말을 정반대로 전부 빼앗겼어…….\"\n[s8] \"다음엔 배달 서비스로 오면 안 된단다? 약속!\""
2601708-116 = "물론입니다. 선생님과 배달부 두 분께 폐를 끼쳤습니다. 다시는 하지 않겠습니다."
2601708-117 = "당연히, 택배로 가는 것도 하지 않겠습니다. 하지 말라고 하셨던 것 기억하고 있습니다."
2601708-118 = "가는 편은 미리 생각해 둔 게 있습니다."
2601708-119 = "[s] \"다행이다! 그러면 역까지 바래다줄게!\""
2601708-120 = "아닙니다. 공짜로 갈 수 있는 방법이 있습니다."
2601708-121 = "지금 붉은겨울 전산망을 해킹하면, 사무국에서 차로 데리러 올 겁니다."
2601708-122 = "먼저 들어가 보셔도 괜찮습니다. 금방 올 겁니다."
2601708-123 = "[s] \"일단 금지!!! 선생님이 데려다줄 테니까!\""
2601708-124 = "네……?"
2601708-126 = "(이후, 라나를 데려다주었다.)"
2601708-127 = "(라나는 내가 보이지 않을 때까지 손을 흔들며 배웅했다.)"
