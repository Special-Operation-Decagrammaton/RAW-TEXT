[translation]
2601708-1 = "プロトコルの明細"
2601708-2 = "（ラナの連絡を受け、慌てて1階へ駆け下りた）"
2601708-3 = ""
2601708-5 = ""
2601708-6 = "ああっ、もう……！早く来いっての……！"
2601708-7 = "あまり叱らないであげてください。先生も深く反省しているはずです。"
2601708-8 = "あんたを叱るために呼んでるんだよ！"
2601708-9 = ""
2601708-10 = "[ns] \"あ、あの……何かご用でしょうか……。\""
2601708-11 = ""
2601708-12 = "やっと来たな！あんたがこいつの保護者か？"
2601708-13 = "[s] \"大人ですから、すべての子供の保護者です。\""
2601708-14 = "ふんっ、口だけは達者だな！"
2601708-15 = "保護者だっていうなら、ちゃんと監督責任を果たしてからいうんだな……こいつは――"
2601708-17 = "まったく……こんな場所でデリバリーの受け取りってどういうことだよ。#nつかこの距離なら宅配便で送ればいいのに。"
2601708-18 = "まあ、ここからD.U.までだと長距離料金になるからいいけどよ。"
2601708-19 = "無料配達クーポン使ってるみたいだが……#nどのみち後から精算されるから、こっちには関係ないな。"
2601708-20 = ""
2601708-22 = ""
2601708-23 = "お、出迎えか？ありがたいな。"
2601708-24 = ""
2601708-26 = ""
2601708-27 = "お待たせしました！デリバリーの受け取りにあがりました！"
2601708-28 = "あ。"
2601708-29 = ""
2601708-31 = ""
2601708-32 = "こんにちは、たこ焼きです。"
2601708-33 = "私を、受け取ってたこー。"
2601708-34 = ""
2601708-36 = ""
2601708-37 = "へ？"
2601708-40 = "[ns] \"へ？\""
2601708-41 = "な？そんな反応になるだろ？"
2601708-42 = "人はデリバリーできないって何度も言ってんのに、暖簾に腕押しで――"
2601708-43 = ""
2601708-44 = "あん――いや、お客さん！これはデリバリーサービスですよ！？"
2601708-45 = "頭にかつお節を乗せて、自分のことたこ焼きだって言い張ってもダメです！"
2601708-46 = "見ての通り、たこ焼きですが。"
2601708-47 = "あ、青のりを忘れていました。青のりは欠かせませんよね、分かります。"
2601708-48 = "だ・か・ら！！うちは食べ物のデリバリーだって！！！"
2601708-49 = "失礼ですが、出前デリバリーのプロトコルにおいて「食べ物」の定義は何ですか？"
2601708-50 = "ぷろ……何だって？"
2601708-51 = "食べ物の定義を聞いてんのか？そりゃあ、食べられるのが食べ物だろ！"
2601708-52 = "はい、私のことも食べられます。"
2601708-53 = "ほら、頭の上にかつお節が乗っているでしょう？"
2601708-54 = "食べられるって言っても、ほんのちょっとじゃねぇか！？"
2601708-55 = "そのロジックでいうと、#nココナッツやカニも可食部位が少ないため……食べ物とは言えなくなります。"
2601708-56 = "はあ……！？い、いや……それはさすがに食べ物だろ！？"
2601708-57 = "そ、そうだ！お前は生きてるだろ？だから食べ物とは言えない！"
2601708-58 = "そのロジックでいうと、シロウオの踊り食いも食べ物と言えなくなります。"
2601708-59 = "ああ、もう！！食べ物っていうのはな――"
2601708-60 = "そのロジックでいうと――"
2601708-61 = "いや！それは食べ物だろ！だから――"
2601708-62 = "定義に例外が生じる度に条件を加えるのですね。"
2601708-63 = "現在の条件文は17個になりました。#n一度、再帰的に定義することをおすすめします。"
2601708-64 = "は、はあ！？"
2601708-65 = "それでは、これは食べ物と言えるでしょうか――"
2601708-68 = "はあ……。"
2601708-69 = "[s1] \"ここまで連れてきたということは……。\"\n[s2] \"結局、食べ物だと認めたんですか……？\""
2601708-72 = "んなわけあるか！！#nあれ以上言い合ってもらちが明かないから、連れてきただけだ！"
2601708-73 = "出前デリバリーのプロトコルに例外処理が加わったこと、とても嬉しく思います。"
2601708-74 = "加わってねぇ！！"
2601708-75 = "代金もちゃんともらってるし、別にいいけどよ……はぁ。"
2601708-76 = "もう二度とこんなおままごとには付き合わねぇから、ちゃんと叱っておいてくれよ！"
2601708-77 = "[s3] \"すみません……。\"\n[s4] \"よく言っておきます……。\""
2601708-80 = "これが他のやつだったら危なかったかもしれないんだぞ？"
2601708-81 = "はい。配達員さんが優しくて善良な人で良かったです。"
2601708-82 = "食べ物である私のことも、人として扱ってくれました。"
2601708-83 = "だから……！はぁ……もういいや。んじゃ、後は頼んだからな！"
2601708-87 = ""
2601708-88 = "丁寧に説明したら、納得してくれたようで何よりです。"
2601708-89 = "[s5] \"全然そうは見えなかったけどね……。\"\n[s6] \"次からは安全な方法にしようね。\""
2601708-92 = "ヘルメットをつけてくれたので、安全に来ることができました。"
2601708-93 = "それで、今から何をしましょうか？"
2601708-94 = "[s] \"何か用があったんじゃないの？\""
2601708-95 = "いえ、特に。ただ先生に会いたかっただけなので。"
2601708-96 = "お仕事をされるのでしたら、隣で待機します。"
2601708-97 = "[s] \"なら、散歩にでもいこうか。\""
2601708-98 = "いいですね。先生が散歩する時に来られるなんて、運がいいです。"
2601708-99 = "ついていきます。"
2601708-101 = ""
2601708-103 = ""
2601708-105 = ""
2601708-108 = "もう夜ですね。"
2601708-109 = "先生のおかげで楽しい時間になりました。"
2601708-110 = "世の中には、面白いことがたくさんありますね。"
2601708-111 = "……子供が夜遅くに出歩くのはよくないので、もう帰ります。"
2601708-112 = "次はもっと長い時間お付き合いしますので、寂しがらないでくださいね。"
2601708-113 = "[s7] \"言いたいことを全部言われてしまった……。\"\n[s8] \"次はデリバリーサービスで来ちゃダメだからね？約束！\""
2601708-116 = "もちろんです。#n今回は先生と配達員さんに迷惑をかけました。もう二度としません。"
2601708-117 = "宅配も、移動には使いません。注意されたことはちゃんと覚えています。"
2601708-118 = "帰りは問題ないので、ご心配なく。"
2601708-119 = "[s] \"よかった！なら、駅まで送るよ！\""
2601708-120 = "いいえ。それには及びません。"
2601708-121 = "レッドウィンターのサーバーをハッキングすれば、すぐに事務局から車で迎えがきます。"
2601708-122 = "なので、先に帰っていただいて構いません。"
2601708-123 = "[s] \"やっぱり私が送るよ！！\""
2601708-124 = "そうですか？分かりました……？"
2601708-126 = "（その後、ラナを送ってあげた）"
2601708-127 = "（ラナは私の姿が見えなくなるまで手を振ってくれた）"
