2601708-53 = "5;라나;S2_01;여기, 머리 위에 먹을 수 있는 가쓰오부시가 있습니다.\n#5;greeting"
2601708-54 = "1;배달 기사;04;말도 안 되는 소리야! 아주 일부분만 먹을 수 있는 거잖아?"
2601708-55 = "5;라나;S2_02;그렇다면, 코코넛이나 대게처럼 먹을 수 있는 부분이 적다면 음식이 아니게 됩니다만."
2601708-56 = "1;배달 기사;06;뭐……?! 그, 그렇긴 하지만 그건 음식이잖아?!\n#1;em;[?!]\n#1;shake"
2601708-57 = "1;배달 기사;02;그렇지! 너는 일단 살아 있잖아! 그러면 음식이 아니야!"
