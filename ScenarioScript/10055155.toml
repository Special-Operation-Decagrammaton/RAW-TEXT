[translation]
10055155-3 = "당~ 했~ 다~"
10055155-8 = "아직이야. 한 번 더 승부해."
10055155-9 = "시로코 쨩은 쌩쌩하네~ 이 아저씨는 이제 젊은이들 체력은 못 따라가겠어~"
10055155-10 = "아니, 그러니까 나이 차이 얼마 안 난다고!"
10055155-11 = "애초에 가재하고 아야네 쨩이 싸웠는데 왜 선배가 쓰러지는 거야! 빨리 일어나!"
10055155-12 = "아하하…… 시로코 선배. 일단 여기서는 잠깐 휴식하죠."
10055155-13 = "아야네……?"
10055155-14 = "어째서 배신을……? 설마, 마인드 컨트롤……?"
10055155-15 = "시로코 쨩은 발상이 엉뚱해서 귀엽다니까요☆"
10055155-16 = "여기서는 아야네 쨩의 말을 따르죠. 우리 가재군도, 다음 경기를 위해서 푹 쉬어야 하니까요~"
10055155-17 = "다음 경기……? 어라, 이거 경기였나요……?"
10055155-18 = "네? 혹시 모르셨나요? 저희는 선생님이 같이 계시길래 당연히 알고 참여한 줄……."
10055155-19 = "그러면, ……아앗!"
10055155-20 = "죄송합니다! 아무것도 모르는 분들께 승부를 걸었을 줄이야!"
10055155-21 = "음, 용서해 주마."
10055155-22 = "아니, 고생은 저랑 소라게가 다했는데, 왜 마코토 선배가 거들먹……."
10055155-23 = "그나저나, 경기는 무슨 말인가요?! 혹시 축제인가요?! 여기는 평범한 무인도가 아니었던 거네요?!"
10055155-24 = "으헤~ 분하지만, 패배자인 우리는 순순히 대답해 주는 수밖에 없겠네."
10055155-25 = "지금 이 섬에서 벌어지는 것은, 지상최강의 갑각류를 가리는 최악최흉의 배틀로얄……."
10055155-26 = "──이름하여 <천하게일무술대회>-!!"
10055155-27 = "……이름 구려."
10055155-28 = "오오, 이 얼마나 직관적이면서 유머 감각 넘치는 이름인가!"
10055155-29 = "룰은 간단해요. 참가자는 자신의 별을 가지고 있고, 승자는 패자에게서 이 별을 하나 빼앗을 수 있어요."
10055155-30 = "그렇게 가장 먼저 다섯 개의 별을 모으는 팀이 우승하는 대회예요."
10055155-31 = "그리고, 놀라지 말라고! 우승자에게는 세계 최강의 게라는 명예와……."
10055155-32 = "무려 어떤 소원이든 들어주는 <여왕의 소원권>이 한 장 주어져!"
10055155-33 = "이 대회에서 우승해서 학교 빚을 단번에 갚아버릴 거야!"
10055155-34 = "뭣?! 그게 사실이냐?!"
10055155-35 = "아니, 과장이겠죠."
10055155-36 = "아하하…… 저희도 조금 이상하다고 생각하기는 하는데요."
10055155-37 = "어라? 그러고 보니, 저희는 어쩌다 이런 대회에 참가한 거죠……?"
10055155-38 = "아야네 쨩~ 여기 가재군의 치료를 도와줬으면 하는데~"
10055155-39 = "아, 네! 금방 갈게요!"
10055155-43 = "……."
10055155-44 = "표류 끝에 도착한 섬에서, 우연히 타이거샤크마루와 만나, 이런 대회가 개최되고 있다는 걸 알게 되다니……."
10055155-45 = "이건 정말이지……."
10055155-46 = "그야말로, 천운! 하늘이 우리에게 거머쥐라고 내어준 기회나 다름없다!"
10055155-47 = "모두들! 잘 들어라! 우리 만마전은 지금부터 <천하게일무술대회>의 우승을 위해 전 총력전을 선포한다!"
10055155-48 = "총력전-!"
10055155-49 = "우리 목표는 이 대회의 우승! 자, 다들! 이 몸을 따라 전진이다!"
