[translation]
10055155-2 = ""
10055155-3 = "被～打～敗～了～"
10055155-4 = ""
10055155-6 = ""
10055155-8 = "還沒完。再比一場。"
10055155-9 = "白子醬還真有精神呢～大叔已經跟不上年輕人的體力了～"
10055155-10 = "就說了你們的年紀根本沒差多少！"
10055155-11 = "而且明明是螯蝦跟綾音醬在比賽，為什麼倒下的是前輩啊！快起來！"
10055155-12 = "啊哈哈……白子前輩。我們先在這裡休息一下吧。"
10055155-13 = "綾音……？"
10055155-14 = "為什麼要背叛……？難道是心靈控制……？"
10055155-15 = "白子醬的想法總是這麼天馬行空，真可愛☆"
10055155-16 = "這裡就聽綾音醬的吧。#n我們的螯蝦君也得為了下一場比賽好好休息才行～"
10055155-17 = "下一場比賽……？#n咦，這是比賽嗎……？"
10055155-18 = "咦？你們不知道嗎？#n看老師跟你們在一起，我還以為你們肯定知道的……"
10055155-19 = "這麼說來……啊啊！"
10055155-20 = "對不起！沒想到我們竟然向什麼都不知道的人下了戰帖！"
10055155-21 = "嗯，本大人就原諒你們吧。"
10055155-22 = "辛苦的明明是我跟寄居蟹，為什麼是真琴前輩在那邊擺架子啊……"
10055155-23 = "話說，比賽是什麼意思！？難道是祭典嗎！？#n這裡不是普通的無人島嗎！？"
10055155-24 = "唔嘿～雖然不甘心，但身為輸家的我們也只能乖乖回答了。"
10055155-25 = "現在這座島上正在舉行的，是決定地表最強甲殼類的、最惡最兇的大逃殺……"
10055155-26 = "──名為「天下一蟹．武術大會」～！！"
10055155-27 = "……名字好遜。"
10055155-28 = "哦哦，多麼直觀又充滿幽默感的名字啊！"
10055155-29 = "規則很簡單。#n參加者各自持有星星，勝者可以從敗者身上奪走一顆星星。"
10055155-30 = "就這樣，最先集滿五顆星星的隊伍就是大會冠軍。"
10055155-31 = "還有，別嚇到哦！冠軍除了能獲得世界最強螃蟹的名譽之外……"
10055155-32 = "還能拿到一張可以實現任何願望的「女王的許願券」！"
10055155-33 = "我要在這場大會奪冠，一口氣還清學園的債務！"
10055155-34 = "什麼！？此話當真！？"
10055155-35 = "怎麼可能，應該是誇大其詞吧。"
10055155-36 = "啊哈哈……我們也覺得有點奇怪就是了。"
10055155-37 = "咦？這麼說來，我們是怎麼會參加這種大會的……？"
10055155-38 = "綾音醬～希望你來幫忙治療這隻螯蝦君～"
10055155-39 = "啊，好的！我馬上過去！"
10055155-40 = ""
10055155-42 = ""
10055155-43 = "……"
10055155-44 = "漂流到這座島上，偶然遇見虎鯊丸，又得知這裡正在舉辦這種大會……"
10055155-45 = "這可真是……"
10055155-46 = "真是天助我也！簡直就是上天要我們把握的機會啊！"
10055155-47 = "大家都聽好了！#n從現在起，我們萬魔殿將為了奪下「天下一蟹．武術大會」的冠軍展開總力戰！"
10055155-48 = "總力戰～！"
10055155-49 = "我們的目標是奪得這場大會的冠軍！#n來吧各位！跟著本大人前進！"
