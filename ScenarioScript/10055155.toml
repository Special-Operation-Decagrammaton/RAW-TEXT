[translation]
10055155-2 = ""
10055155-3 = "โดน~ ซะ~ แล้ว~"
10055155-4 = ""
10055155-6 = ""
10055155-8 = "ยังหรอก แข่งกันอีกสักตา"
10055155-9 = "ชิโรโกะจังยังฟิตอยู่เลยสินะ~ ลุงคนนี้สู้แรงพวกเด็กๆ ไม่ไหวแล้วละ~"
10055155-10 = "เดี๋ยวสิ ก็บอกแล้วไงว่าอายุไม่ได้ต่างกันเท่าไรน่ะ!"
10055155-11 = "อีกอย่าง คนที่สู้คือกุ้งเครย์ฟิชกับอายาเนะจังนะ ทำไมรุ่นพี่ถึงเป็นคนหมดแรงล่ะ! รีบลุกขึ้นมาเลย!"
10055155-12 = "อะฮะฮ่า... รุ่นพี่ชิโรโกะ ตอนนี้พักกันสักหน่อยก่อนเถอะค่ะ"
10055155-13 = "อายาเนะ...?"
10055155-14 = "ทำไมถึงทรยศกัน...? หรือว่าถูกควบคุมจิตใจอยู่...?"
10055155-15 = "ชิโรโกะจังเวลาคิดอะไรแปลกๆ เนี่ยน่ารักจริงๆ เลยนะคะ☆"
10055155-16 = "ตอนนี้ทำตามที่อายาเนะจังบอกกันเถอะค่ะ ให้น้องกุ้งของเราพักให้เต็มที่ เตรียมพร้อมสำหรับการแข่ง#nครั้งต่อไปเถอะนะคะ"
10055155-17 = "แข่งรอบต่อไป...? เอ๋ นี่เป็นการแข่งขันเหรอคะ...?"
10055155-18 = "คะ? ไม่ทราบงั้นเหรอคะ? พวกเราเห็นว่าคุณครูมาด้วย ก็เลยคิดว่าทุกคนรู้เรื่องแล้วถึงเข้าร่วม..."
10055155-19 = "ถ้าอย่างนั้น... อ๊ะ!"
10055155-20 = "ขอโทษค่ะ! ไม่คิดเลยว่าจะไปท้าแข่งกับคนที่ไม่รู้เรื่องอะไรเลย!"
10055155-21 = "อืม เรายกโทษให้"
10055155-22 = "เดี๋ยวสิ คนที่เหนื่อยคือฉันกับเจ้าปูนี่แท้ๆ ทำไมรุ่นพี่มาโคโตะถึงได้..."
10055155-23 = "ว่าแต่... ที่บอกว่าการแข่งขันนี่หมายความว่ายังไงคะ?! มีงานเทศกาลเหรอคะ?! ที่นี่ไม่ใช่เกาะร้างธรรมดาๆ สินะคะ?!"
10055155-24 = "แหะๆ~ ถึงจะเจ็บใจ แต่พวกเราเป็นฝ่ายแพ้ ก็ต้องตอบให้แต่โดยดีละนะ"
10055155-25 = "สิ่งที่กำลังเกิดขึ้นบนเกาะแห่งนี้ คือศึกแบตเทิลรอยัลสุดโหดสุดอำมหิต เพื่อเฟ้นหาสัตว์เปลือกแข็ง#nที่แข็งแกร่งที่สุดในโลก"
10055155-26 = "การแข่งขันที่มีชื่อว่า... <ศึกชิงเจ้ายุทธภพปู> ยังไงล่ะ!!"
10055155-27 = "ชื่อเชยชะมัด..."
10055155-28 = "โอ้โฮ! ช่างเป็นชื่อที่เข้าใจง่าย แถมมีอารมณ์ขันเหลือล้นเสียจริง!"
10055155-29 = "กติกาง่ายมากค่ะ ผู้เข้าแข่งขันแต่ละคนจะมีดาวของตัวเอง ฝ่ายชนะสามารถยึดดาวจากฝ่ายแพ้ได้#nหนึ่งดวงค่ะ"
10055155-30 = "ทีมที่รวบรวมดาวครบห้าดวงได้ก่อนจะเป็นผู้ชนะการแข่งขันค่ะ"
10055155-31 = "ยังไม่หมดนะ... อย่าตกใจไปล่ะ! ผู้ชนะจะได้รับเกียรติในฐานะปูที่แข็งแกร่งที่สุดในโลก และก็..."
10055155-32 = "ยังได้ <ตั๋วขอพรของราชินี> ที่ทำให้คำขออะไรก็เป็นจริงหนึ่งใบด้วย!"
10055155-33 = "พวกเราเลยคิดจะเอาชนะการแข่งขันนี้ แล้วจ่ายหนี้ของโรงเรียนให้หมดในทีเดียวเลย!"
10055155-34 = "อะไรนะ?! พูดจริงเหรอ?!"
10055155-35 = "ไม่หรอกค่ะ คงพูดเกินจริงละมั้งคะ"
10055155-36 = "อะฮะฮ่า... พวกเราก็คิดว่าแปลกอยู่เหมือนกันค่ะ"
10055155-37 = "เอ๋? จะว่าไปแล้ว พวกเรามาเข้าร่วมการแข่งขันแบบนี้ได้ยังไงนะคะ...?"
10055155-38 = "อายาเนะจัง~ มาช่วยรักษาน้องกุ้งเครย์ฟิชตรงนี้หน่อยสิ~"
10055155-39 = "อ๊ะ ค่ะ! จะไปเดี๋ยวนี้เลยค่ะ!"
10055155-40 = ""
10055155-42 = ""
10055155-43 = "......"
10055155-44 = "ลอยเคว้งจนมาถึงเกาะแห่งนี้ แล้วบังเอิญพบไทเกอร์ชาร์กมารุ แถมยังได้รู้ว่ามีการแข่งขันแบบนี้#nจัดขึ้นอีก..."
10055155-45 = "แบบนี้มัน..."
10055155-46 = "โชคชะตาจากฟากฟ้าโดยแท้! ไม่ต่างจากโอกาสที่สวรรค์ประทานมาให้พวกเราคว้าไว้เลย!"
10055155-47 = "ทุกคน! ฟังให้ดี! นับจากนี้แพนเดโมเนียม โซไซตี้ขอประกาศทุ่มกำลังทั้งหมดที่มีเพื่อคว้าชัยชนะใน <ศึกชิงเจ้ายุทธภพปู>!"
10055155-48 = "ทุ่มกำลังทั้งหมด...!"
10055155-49 = "เป้าหมายของเราคือชัยชนะในการแข่งขันนี้! เอาละ ทุกคน! เดินหน้าตามเรามา!"
