[translation]
10055155-3 = "やられた～"
10055155-8 = "まだ終わってない。もう一回勝負しよう。"
10055155-9 = "シロコちゃんは元気だね～おじさんはもうついていけないよ～"
10055155-10 = "いやだからそんなに年変わらないってば！"
10055155-11 = "そもそも戦ったのはアヤネちゃんなのに、なんで先輩が倒れてるの！"
10055155-12 = "あはは……シロコ先輩。ここは一度休憩しましょう。"
10055155-13 = "アヤネ……？"
10055155-14 = "どうしてそんなこと言うの？もしかしてマインドコントロール……？"
10055155-15 = "そうじゃないですよ、シロコちゃん☆"
10055155-16 = "アヤネちゃんは、次の試合に備えてザリガニさんを休ませようとしてるんです！"
10055155-17 = "次の試合……？これって試合なんですか？"
10055155-18 = "え？知らなかったんですか？#n先生と一緒だったから、てっきり知っているものだと……。"
10055155-19 = "ということは……ああっ！？"
10055155-20 = "ごめんなさい！何も知らない方々に勝負を申し込んでしまいました！"
10055155-21 = "ふむ。このマコト様が寛大な心で許そう。"
10055155-22 = "いや頑張ったのは私とヤドカリなんですけど。"
10055155-23 = "それはそうと、試合ってどういうことなんです？#nここはただの無人島じゃなかったんですか？"
10055155-24 = "う～ん……負けちゃったし、教えてあげよっか。"
10055155-25 = "今この島で行われているのは……。#n地上最強の甲殻類を争う、最恐最悪のバトルロイヤル！"
10055155-26 = "その名も「[ruby=てんかいっかい]天下一蟹[/ruby]・武術大会」！"
10055155-27 = "……名前ダサッ！"
10055155-28 = "おお！なんという直感的かつ、ユーモラスな名前だ！"
10055155-29 = "ルールは簡単です。参加者はそれぞれ星を持ち、それを賭けて勝負をします。#n勝負に勝ったら、相手から星を奪うことができます。"
10055155-30 = "そうして勝負を繰り返し……一番最初に星を5個集めたチームの優勝です。"
10055155-31 = "そしてなんと！優勝者には世界最強のカニという名誉と……。"
10055155-32 = "どんな願いでも叶えてくれる「クイーンのなんでも券」がもらえるのよ！"
10055155-33 = "この大会で優勝して、学校の借金を全部返してみせるわ！"
10055155-34 = "なっ、それは本当か！？"
10055155-35 = "いやウソでしょ。"
10055155-36 = "あはは……私たちも怪しいとは思ってるんですけど……。"
10055155-37 = "あれ？そもそも何で私たちはこの大会に参加したんだっけ……？"
10055155-38 = "アヤネちゃん、このザリガニくんの治療を手伝ってもらいたいんだけど～"
10055155-39 = "あっはい！すぐに行きます！"
10055155-43 = "……。"
10055155-44 = "漂流の末にたどり着いた島で偶然タイガーシャーク丸と出会い、#nこのような大会に巡り合うとは……。"
10055155-45 = "これはまさに……。"
10055155-46 = "天運が味方したとしか考えられまい！天が我々に、チャンスを与えたのだ！"
10055155-47 = "諸君、よく聞け！今から我々万魔殿は、#n総力を挙げて「天下一蟹・武術大会」の優勝を獲りにいく！"
10055155-48 = "総力戦ー！"
10055155-49 = "我々の目標は頂点ただ一つ！さあ、このマコト様に続け――！！"
