[translation]
10055155-2 = ""
10055155-3 = "Aww, we looost..."
10055155-4 = ""
10055155-6 = ""
10055155-8 = "We're not beaten yet. Let's go again."
10055155-9 = "So much energy. This old-timer can't keep up with you youngsters anymore."
10055155-10 = "Again, we're like the SAME AGE!"
10055155-11 = "And why are YOU on the ground? You weren't even fighting! Get up already!"
10055155-12 = "Ahaha... Shiroko, how about we take a little break?"
10055155-13 = "Ayane...?"
10055155-14 = "Why are you betraying me...? Don't tell me... Mind control...?"
10055155-15 = "Shiroko's got such a big imagination. It's so cute. ☆"
10055155-16 = "I think Ayane's got the right idea. Our little critter needs a breather before the next match."
10055155-17 = "\"The next match\"...? Is this some kind of tournament all of a sudden?"
10055155-18 = "Wait, you didn't know? Since Sensei was with you, we just assumed..."
10055155-19 = "So wait, then... Ugh!"
10055155-20 = "I'm so sorry! We just walked up and challenged you to a...whatever that was!"
10055155-21 = "Hmm, I shall forgive you."
10055155-22 = "What is she so smug about? MY crab did all the work..."
10055155-23 = "But wait, if you're here, and you were expecting a match...is there a festival going on or something? Is this island not deserted?"
10055155-24 = "Heh, as much as it pains me, I guess we losers have no choice but to tell you."
10055155-25 = "What's taking place on this island is a brutal battle royale to determine the strongest crustacean alive..."
10055155-26 = "The \"World Crab Martial Arts Tournament\"!"
10055155-27 = "...What a lame name."
10055155-28 = "What a clear, straightforward name!"
10055155-29 = "The rules are simple. Each team has their own stars, and the winner can take one star from the loser."
10055155-30 = "The first team to collect five stars wins the tournament."
10055155-31 = "And get this! The winning crab gets crowned the world's strongest. But more than that..."
10055155-32 = "You win a \"Queen's Wish Ticket\" that can grant ANY wish!"
10055155-33 = "We're going to win this tournament and pay off all our debts, just like that!"
10055155-34 = "What?! Are you serious?!"
10055155-35 = "Obviously not. They're exaggerating at best."
10055155-36 = "Ahaha... Well, it sounds kind of sketchy to us too, honestly."
10055155-37 = "...Come to think of it, how'd we get involved in this, anyway?"
10055155-38 = "Ayane, could you help tend our little crayfish, please?"
10055155-39 = "Oh, sure! I'll be right there!"
10055155-40 = ""
10055155-42 = ""
10055155-43 = "..."
10055155-44 = "To be cast ashore on THIS island, right in front of Tigersharkmaru, AND discover this tournament all at once..."
10055155-45 = "This can only be..."
10055155-46 = "...a stroke of divine providence! Heaven itself has given us this opportunity!"
10055155-47 = "Listen well, all of you! From this moment on, the Pandemonium Society will give its all to win the \"World Crab Martial Arts Tournament\"!"
10055155-48 = "Yeah! We're gonna win!"
10055155-49 = "Yes, now follow me! Onward to victory!"
