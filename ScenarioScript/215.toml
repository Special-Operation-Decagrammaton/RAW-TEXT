[translation]
215-1 = "그리운 과거의 비일상"
215-24 = "미스터 오웰의 심야 토크쇼가 돌아왔습니다!"
215-25 = "그렇다!"
215-26 = "다시 만나 뵙게 되어 반갑습니다. 신사 숙녀 여러분."
215-27 = "새로운 시대의 세상을 정의하는 권력. 이 세계의 모든 파노플리를 여러분께 소개해 드리는 미스터 오웰입니다."
215-28 = "오늘 여러분께 소개해 드릴 텍스트는 일상과 비일상을 가로지르는 경계에서 태어난, 모두에게 친숙한 모습의 크리피파스타입니다."
215-29 = "여러분 앞에…… <악몽 열차>를 소개합니다!"
215-30 = "그렇다! 그렇다!"
215-31 = "수많은 승객을 싣고 궤도 위를 달리는 열차는, 현대 문명을 묘사할 때 빠지지 않고 등장하는 일상의 대표적인 공간 중 하나이지요."
215-32 = "아마 오늘 이 토크쇼를 보기 위해 열차를 타고 오신 분도 이 자리에 계실 겁니다."
215-33 = "그런데 역과 승강장, 열차처럼— 매일 마주하는 이 친숙한 공간에서 어느 순간 기묘한 위화감을 느껴본 적은 없으십니까?"
215-34 = "장소는 바뀌지 않았지만, 내부의 오브제나 시간대가 변화한 것만으로도 일상의 공간이 비일상의 공간으로 여겨지는 기묘한 미시감."
215-35 = "오늘 소개해 드릴 이 <악몽 열차>도 바로 그 미시감에서 탄생한 [ruby=리미널 스페이스]전이공간[/ruby]의 [ruby=에스테틱]미학[/ruby]이라 할 수 있겠습니다."
215-36 = "그렇다!"
215-37 = "이 복제된 열차는 근본적으로 승객의 기억에 기초하여 탄생한 공간이기에, 오래 머무르다 보면 미시감은 사라지고 어느새 아련한 그리움마저 느껴질지도 모릅니다."
215-38 = "하지만 향수에 취해 무심코 경계를 푸는 것은 금물입니다. 이 열차 내에는 무임승차한 승객들을 무자비하게 처리하는 승무원이 상주하고 있으니까요!"
215-39 = "그렇다!"
215-44 = "이 거대한 원숭이 모습의 승무원 애니매트로닉스는 어째서 어울리지 않는 이 추억의 공간에 섞여 들게 된 걸까요?"
215-45 = "누군가가 꾼 질 나쁜 악몽이 다수의 기억 속에 섞여 들었다든가……"
215-46 = "혹은, 이 공간을 처음으로 정의한 '누군가'의 트라우마가 발현한 흔적이라든가?"
215-51 = "하지만 정답은 말씀드리지 않겠습니다.#n기호의 출처를 추리하는 것도 쇼의 놓칠 수 없는 즐거움 중 하나니까요!"
215-52 = "정답을 알고 계신 분들은 아래 주소로 독자 해석을 보내주시기 바랍니다."
215-53 = "추첨을 통해 검은 백조의 깃털을 정답자에게 보내 드릴 예정이니, 부디 많은 참여 부탁드리겠습니다!"
215-54 = "그렇다!"
215-59 = "그럼 저희는 광고 후에 다시 돌아오겠습니다."
215-60 = "다음 텍스트가 이어질 때까지 채널을 고정해 주시길!"
215-61 = "그렇다!"
