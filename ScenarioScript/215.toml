[translation]
215-1 = "懐かしき非日常"
215-21 = ""
215-23 = ""
215-24 = "ミスター・オーウェルの『真夜中はロアと共に』へようこそ。"
215-25 = "そういうこったぁ！"
215-26 = "今宵も迷える皆様にお届けする、深夜番組――"
215-27 = "司会は、新時代の世界を定義する権力――この世すべてのパノプリをお届けする者、#nミスター・オーウェルでお届けいたします。"
215-28 = "今宵、ご紹介するテクストは、日常と非日常をへだてる境界から生まれた、皆様に親しみのあるクリーピーパスタです。"
215-29 = "その名も――「[ruby=ナイトメアトレイン]悪夢急行[/ruby]」。"
215-30 = "そういうこったぁ！そういうこったぁ！"
215-31 = "多くの乗客を連れてレールの上を走る列車は、現代文明の日常を代表する空間のひとつと言えるでしょう。"
215-32 = "今日、この番組の公開収録を見るために、列車でここまでいらっしゃった方もいるのではないでしょうか？"
215-33 = "さて、そんないつもの日常の中――駅やホーム、車内でふとしたタイミングに違和感を覚えたことはありませんか？"
215-34 = "場所は同じなのに、オブジェや時間帯の変化によって日常が非日常のように思える――奇妙な[ruby=ジャメヴ]未視感[/ruby]。"
215-35 = "今宵ご紹介する「[ruby=ナイトメアトレイン]悪夢急行[/ruby]」も、その[ruby=ジャメヴ]未視感[/ruby]から誕生した、[ruby=リミナルスペース]移行的空間[/ruby][ruby=エステティック]の美学と[/ruby]言えるでしょう。"
215-36 = "そういうこったぁ！"
215-37 = "[ruby=ミメシス]複製[/ruby]された列車は、乗客の記憶をもとに生まれた空間。長くそこに留まることで、[ruby=ジャメヴ]未視感[/ruby]は消え――郷愁すら覚えるかもしれません。"
215-38 = "しかし――ここでノスタルジアに酔いしれて警戒を解かないでください。#n「[ruby=ナイトメアトレイン]悪夢急行[/ruby]」は、無賃乗車を決して許しません。厳しく恐ろしい車掌が常駐しているのですから！"
215-39 = "そういうこったぁ！"
215-40 = ""
215-42 = ""
215-43 = ""
215-44 = "サルの姿をしたアニマトロニクスは、何故このような思い出の空間に存在するのでしょうか？"
215-45 = "性質の悪い夢が、大衆の記憶の中にこっそりと紛れ込んだのか――"
215-46 = "それとも、この空間を最初に定義した「誰か」のトラウマが顕現した痕跡か――"
215-47 = ""
215-49 = ""
215-50 = ""
215-51 = "答えはぜひ、皆様で議論していただければと。#n記号の出どころについて推理するのも、ショーの楽しみのひとつですから！"
215-52 = "正解をご存じの皆様は、こちらのアドレスへぜひ考察をお送りください。"
215-53 = "正解された方には抽選で、「黒い白鳥」の羽をお送りいたします。#nふるってご応募ください！"
215-54 = "そういうこったぁ！"
215-55 = ""
215-59 = "それでは、ここでCMをはさみましょう。"
215-60 = "次のテクストをご紹介するまで、チャンネルはそのままで！"
215-61 = "そういうこったぁ！"
215-62 = ""
