[translation]
1600915-1 = "닌자 소녀는 기억되고 싶어!"
1600915-2 = "상점가 초입"
1600915-3 = "후후, 제대로 나와줬군, 선생 공."
1600915-4 = "확실히, 우리처럼 닌자로의 길 위에 올라선 이들이라면 이런 물건에 궁금증이 동할 수밖에 없지……."
1600915-5 = "[s] \"나도 그 길 위에 있는 거였어?!\""
1600915-6 = "후후, 뭘 이제 와서 그렇게 놀라는 것인가, 선생 공."
1600915-7 = "아무튼 그래서, 내가 가져온 고대의 기록 매체란 바로……!"
1600915-8 = "이것이라오!"
1600915-12 = "[ns] \"……비디오테이프?!\""
1600915-13 = "잘 아는군, 선생."
1600915-14 = "맞아, 이것은 지금은 쓰이지 않는…… 더없이 오래된 고대의 기록 매체…… 비디오테이프!"
1600915-15 = "[s1] \"확실히 오래된 것이긴 한데…….\"\n[s2] \"대체 뭐가 찍혀 있는 거야?\""
1600915-18 = "후후, 궁금한가?"
1600915-19 = "이 비디오 안에 담겨 있는 것은 말이지."
1600915-20 = "무려……."
1600915-21 = "[s] \"미치루의 첫걸음마를 찍은 홈비디오 같은 건가?\""
1600915-22 = "우냐악! 그런 거 아니야!"
1600915-23 = "왜 발상이 그쪽으로 먼저 튀는 건데!"
1600915-24 = "[s] \"아닌 건가…….\""
1600915-25 = "그걸 왜 아쉬워하는 거야!"
1600915-26 = "아, 아무튼, 이 비디오에 담긴 것은 말이지……!"
1600915-27 = "선생 공도 당연히 알고 있을, 아니, 닌자의 길을 걷는 이들이라면 모를 수가 없는……."
1600915-28 = "<까마귀냥냥> 감독의 극초기 커리어 흑백 영화!"
1600915-29 = "<숨은 교실의 세 닌자>란 말이지!"
1600915-33 = "[ns] \"……그렇군요.\""
1600915-34 = "뭐야! 그 미적지근한 반응은!"
1600915-35 = "이럴 때는 '역시 너도 알고 있었구나!'라는 눈빛을 서로 교환하고 흐뭇한 미소를 띠며 고개를 끄덕이는 것이 닌자 동지들 간의 당연한 도리잖아!"
1600915-36 = "……아, 지금 처음 들어본 영화라고?"
1600915-37 = "무, 물론 까마귀냥냥 감독의 작품들이라면 워낙에 오래된 것들이긴 하지만…… 그래서 전부 다 흑백 영화뿐인 데다가 이제는 영상을 구할 방법도 거의 없지만……."
1600915-38 = "그래도 교과서에서 다 배우는 내용이잖아?!"
1600915-39 = "[s] \"저희 그런 거 배우면서 자랐나요?!\""
1600915-40 = "아무튼! <숨은 교실의 세 닌자>를 아직도 안 봤다니……."
1600915-41 = "선생 공은 인생의 몇 할은 손해 본 거라고!"
1600915-42 = "암, 그렇고말고."
1600915-43 = "[s] \"그 정도인 거야……?\""
1600915-44 = "물론이지."
1600915-45 = "왜냐하면…… 내가 이 영화를 보고 닌자의 세계에 입문했으니 말이야."
1600915-46 = "[s3] \"미치루를 닌자로 만든 비디오라니…….\"\n[s4] \"갑자기 대단해 보여!\""
1600915-49 = "냐하핫! 그렇지, 그렇지?"
1600915-50 = "[s] \"그렇다면 오늘은 이 비디오의 상영회를 여는 거야?\""
1600915-51 = "마음 같아서는 이 상점가 거리 한복판에서 당장이라도 스크린을 펼쳐서 모두에게 영화를 앰부쉬해 버리고 싶지만……."
1600915-52 = "오늘은 아니야. 다른 용무 때문에 나온 거거든."
1600915-53 = "바로…… 이 비디오테이프 안에 담긴 작품을, 백업해 보려고."
1600915-54 = "[s] \"백업?\""
1600915-55 = "얼마 전 이 상점가에 있는 사진관에서 어떤 새로운 서비스를 개시했다는 소식을 접했어."
1600915-56 = "오래된 비디오테이프에 든 영상을 디지털화시켜 파일로 만든 뒤, 컴퓨터에 백업할 수 있도록 해주는 서비스 말이야."
1600915-57 = "이렇게 하면 비디오에 들어있던 작품을 열어 보기도 편하고, 관리도 훨씬 편해지지 않겠어?"
1600915-58 = "그래서 이 테이프를 가지고 나왔다는 거지!"
1600915-59 = "소중한 것을 좀 더 소중하게 간직할 수 있도록 하는 보존 처리 작업이라고나 할까!"
1600915-60 = "좀 더 이해하기 쉽게 말하자면, 옛 닌자들이 각종 디저트와 식재료들을 오랫동안 보관할 수 있도록 환약 형태로 만들었던 것과 비슷한 맥락이라고나 할까."
1600915-61 = "아무튼, 그런 식품을 병량환이라고 부르는데 말이지……."
1600915-62 = "[s] \"자! 그럼 어서 가볼까!\""
1600915-63 = "우냐악! 그거 내 대사잖아!"
1600915-69 = "이건 좀 힘들겠는데."
1600915-70 = "어, 어째서……?!"
1600915-71 = "돈이 부족한 건가……!"
1600915-72 = "아니, 돈이 아니라 이 비디오테이프가 문제야."
1600915-73 = "이 테이프에서는 영상을 추출할 수가 없어."
1600915-74 = "[s] \"뭔가 방법이 없을까요?\""
1600915-75 = "끄응, 그게, 이 물건 자체가 워낙 오래되었기도 하고……."
1600915-76 = "무엇보다 필름 부분이 물리적으로 손상된 게 가장 큰 문제야."
1600915-77 = "이렇게 되어 버린 것은 나도 어떻게 손쓸 수가 없다고."
1600915-81 = "우냐아아…… 역시 그런가."
1600915-82 = "어쩔 수 없지. 가자고, 선생 공."
1600915-87 = "하아, 아쉽네, 아쉬워."
1600915-88 = "[s] \"어쩐지 묘하게 차분하네, 미치루?\""
1600915-89 = "응? 아아. 사실은 이미 알고 있었거든. 이 비디오테이프가 꽤 오래전에 고장 났다는 거."
1600915-90 = "[s] \"……알고 있었어?\""
1600915-91 = "물론이지. 이 비디오테이프를 몇백 번이나 돌려봤는데."
1600915-92 = "어느 순간부터 제대로 재생이 되지 않는다는 것쯤, 이미 알고 있었어."
1600915-93 = "다만 이런 전문 업체에 맡기면 뭔가 방법이 있을 줄 알았는데…… 결국은 아니었네."
1600915-94 = "[s] \"아쉽지는…… 않아?\""
1600915-95 = "냐하하! 아쉽지 않을 리가!"
1600915-96 = "내 추억의 일부가 이 네모난 스크롤 안에 고스란히 봉인되어 버렸는데, 당연히 아쉽지!"
1600915-97 = "……거기다 이 영화, 이젠 파일 구하기도 힘들고 말이야."
1600915-98 = "[s] \"미치루…….\""
1600915-99 = "가끔 이런 생각을 한다오, 선생 공."
1600915-100 = "진작부터 많은 사람들과 이 즐거움을 나눴더라면."
1600915-101 = "소중하게 모셔 놓고 나 혼자만 볼 게 아니라, 다른 사람들에게도 알리고, 권하고, 그래서 더 많은 사람들의 기억 속에도 남겼더라면……."
1600915-102 = "뭐 그런 생각 말이야."
1600915-103 = "[s] 조용히 미치루의 머리를 쓰다듬는다."
1600915-104 = "헤헤, 고맙소, 선생 공."
1600915-105 = "……。"
1600915-106 = "아앗! 그러고 보니 저번에 갔던 그 인법 도구 가게가 두 블록 너머에 있었을 터!"
1600915-107 = "[s] \"전환이 너무 빠른 거 아냐?!\""
1600915-108 = "그럴 수밖에! 거기다 이번에는 요총 무라마틀링에 이어 저주받은 악의 수류탄 <요폭 마사무네이드>의 진품까지 가게 주인이 들여놨다는 소문도 들려왔다고!"
1600915-110 = "물론 마사무네이드의 경우 오마주라는 핑계로 무라마틀링의 컨셉을 노골적으로 베꼈다는 비판도 듣지만, 어쨌든 지금에 와서는 나름의 영역을 구축한 상징물로 평가받고 있는데 말이야……."
1600915-112 = "(이후, 신나게 닌자 이야기를 떠드는 미치루와 함께 오랫동안 상점가를 둘러보았다.)"
1600915-114 = "(……그러는 동안에도, 미치루는 품에 안은 비디오테이프를 조금도 떼어놓지 않았다.)"
