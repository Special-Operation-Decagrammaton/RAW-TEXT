[translation]
41170-1 = "제17화;클로버 작전 1"
41170-4 = "발키리 경찰학교 본관 내 복도"
41170-10 = "여기는 RABBIT 1. 현재 시각은 2330시. 지금 막 포인트 에코에 도착했습니다."
41170-11 = "해당 위치를 지키고 있는 초병의 존재는 확인되지 않았으며, 맞은편 복도에서 폐쇄회로 영상 장치로 추측되는 다수의 전자기기 신호를 감지했습니다."
41170-12 = "여기는 캠프 RABBIT. 맞은편 복도에 다수의 CCTV가 존재하는 건 사실이지만 방금 내가 해킹으로 제어권을 가져왔어."
41170-13 = "화면으로 보니 그 근처에 경계 중인 경찰은 없는 것 같으니, 안심하고 포인트 시에라까지 진입해도 괜찮아."
41170-14 = "그 짧은 시간 내에 폐쇄회로를 해킹하다니…… 모에 쨩, 진짜 대단해……!"
41170-15 = "쿠히히. 이 정도의 보안을 우회하는 일이야 간단하지."
41170-16 = "……그런데 미안하지만 서버에 30분 간격으로 바뀌는 난수 코드가 걸려 있어서 그 이후의 조작은 장담하기 어려울 것 같아. 작전은 30분 내로 끝내줘."
41170-17 = "……이거 또 베리타스의 그 부부장인가 하는 녀석 짓이지? 진짜 지긋지긋하다니까."
41170-18 = "그래도 명색이 발키리 경찰학교의 본관인데, 순찰을 하는 경비도 없는 건가?"
41170-19 = "방금 내가 한 소리를 뭐로 들은 거야? 감시 카메라와 경보 장치는 내가 무력화시켰다니까!"
41170-20 = "너한테 한 소리 아니야. 감시 카메라만 믿고 순찰을 게을리하는 경비국 녀석들에게 한 소리지."
41170-21 = "……적이지만 한심하군. 이래서 내가 발키리 경찰학교에 가고 싶지 않았던 거라니까."
41170-22 = "여하튼, 공안국의 거래 장부— 아니, 클로버를 보관하고 있는 포인트 시에라는 지하 3층에 위치하고 있어. 통행량이 적은 서편 계단을 사용해."
41170-23 = "……아까도 말했지만, 경보를 무력화할 수 있는 건 30분까지니까. 그전까지는 랑데부 포인트로 꼭 돌아와야 해!"
41170-28 = "RABBIT 1, 수신했습니다."
41170-29 = "그, 그런데 이번 작전에는 선생님은 함께하시지 않는 건가요?"
41170-30 = "지난번과는 달리, 이번에는 은밀한 침투를 위해 고고도 강하를 해야 했으니까요. 훈련된 요원이 아닌 선생님은 위험할 수도 있기에 후방 지원을 부탁드렸습니다."
41170-31 = "게다가 자칫하면 탄막을 가로질러 퇴출을 시도하는 상황이 생길 수도 있으니……"
41170-32 = "[s1] \"미안.\"\n[s2] \"고고도 강하는 무리야.\""
41170-33 = "뭐, 이번에는 우리끼리 알아서 잘 처리하는 수밖에 없지. 원래부터 그래왔었고."
41170-34 = "뭐, 이번에는 우리끼리 알아서 잘 처리하는 수밖에 없지. 원래부터 그래왔었고."
41170-35 = "……마, 맞아. 이런 일은 그동안 우리끼리 해왔었으니까……."
41170-36 = "우리끼리……."
41170-37 = "갑자기 왜 그런 표정을 짓는 거야, 미야코. 무슨 문제라도 있어?"
41170-38 = "……아, 아무것도 아닙니다. 잠시 작전을 생각하고 있었습니다."
41170-42 = "그럼 여러분, 사주를 경계하며 은밀히 포인트 시에라까지 이동합니다!"
41170-47 = "이곳이 발키리 경찰학교의 모든 문서를 보관하고 있는 기록 보관실……."
41170-48 = "범죄와 관련된 여러 가지 증거물이 보관된 장소인 만큼 튼튼한 철문으로 가로막혀 있군요."
41170-50 = "그럼 뭐해. 이곳을 지키고 있어야 할 경비는 코빼기도 보이질 않는데."
41170-51 = "뭐, 그 덕분에 우리 작전은 훨씬 편해졌지만 말이야."
41170-52 = "……그나저나 무얼 기다리고 있는 거야? 시간도 없는데 빨리 들어가질 않고."
41170-53 = "그게, 이 철문은 전자 신호로만 개폐할 수 있는 것 같아서……."
41170-54 = "지금 모에 쨩이 원격으로 열심히 암호를 해제하고 있나 봐."
41170-55 = "뭐어? 그럼 기다리는 시간은 제한 시간인 30분에서 빼 주는 거지?"
41170-60 = "좀 보채지 마! 나도 지금 엄청 서두르고 있거든?"
41170-61 = "쳇. 그냥 샷건이나 폭탄으로 도어 브리칭을 하면 안 되는 건가?"
41170-62 = "두꺼운 철문에 브리칭이 가능하면 직접 해보시든가."
41170-63 = "그리고 그랬다가 발키리 경찰학교의 온 학생들을 다 깨우면 네가 책임질 거야?"
41170-67 = "으음…… 평문을 통해 알아낸 비밀키로 디코드 프로그램을 실행시키면……."
41170-73 = "……됐다!"
41170-79 = "……3분이나 걸렸잖아."
41170-80 = "이것도 최대한 서두른 결과거든?"
41170-81 = "불만 있으면 네가 직접 브리칭 하든가!"
41170-83 = "모두, 지금은 싸우고 있을 때가 아닙니다."
41170-84 = "모에가 말한 보안 시스템이 재개되기까지 시간이 얼마 남지 않았습니다."
41170-85 = "기록 보관실에서 공안국이 저지른 불법 리베이트 증거를 찾는 걸 우선시해주세요."
41170-86 = "……알았어."
41170-87 = "나는 우선 오른쪽의 책장부터 살펴볼게."
41170-93 = "하우우…… 어두운 곳은 싫은데……."
41170-100 = "어디 보자……"
41170-101 = "공안국…… 공안국의 거래 자료가……"
41170-106 = "1주일 전, <카이저 인더스트리>에서 제출된 영수증이라면……"
41170-110 = "……찾았다!"
41170-115 = "잘하셨습니다, 사키. 영수증을 좀 보여주시겠어요?"
41170-120 = "……과연. 그렇게 되었던 것이로군요."
41170-124 = "선생님. 확보 대상, <클로버>— <카이저 인더스트리>와 공안국 사이의 불법 리베이트 증거를 확보했습니다."
41170-125 = "선생님께서 말씀하셨던 것처럼 <카이저 인더스트리>는 코우사기 타운에서 노숙자들을 퇴거 시켜 준다는 약속을 받고 공안국에 무상으로 무기를 제공했습니다."
41170-126 = "[s3] \"역시 추측이 맞았네.\"\n[s4] \"다들 수고 많았어!\""
41170-127 = "네, 이 자료만 있으면 공안국과 카이저 그룹의 음모를 저지할 수 있겠지요."
41170-128 = "네, 이 자료만 있으면 공안국과 카이저 그룹의 음모를 저지할 수 있겠지요."
41170-129 = "공안국 녀석들, 그렇게 잘난 척하더니…… 꼴 좋다!"
41170-137 = "응? 문 앞에서 무얼 하고 있는 거야, 미유."
41170-138 = "그, 그게…… 무, 문이 닫혀 버렸는데……."
41170-139 = "그게 뭐가 걱정이야. 문이 닫혔으면 다시 열면 되지."
41170-140 = "그, 그게 이 문……"
41170-141 = "안쪽에서 여는 손잡이가 없어……."
41170-146 = "뭐라고—?!"
41170-148 = "다음화;클로버 작전 2"
