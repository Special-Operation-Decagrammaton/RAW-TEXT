[translation]
10016150-1 = "후일담;구호기사단 & 응급의학부 편"
10016150-6 = "환자분, 마지막으로 바이탈 체크하겠습니다."
10016150-13 = "음…… 체온도 정상으로 돌아왔고, 맥박과 혈압도 정상이시네요."
10016150-14 = "낮에 열탈진으로 실려 오셨을 때는 체온이 다소 높아서 걱정했었는데……"
10016150-15 = "충분한 수분을 보충하고, 그늘진 곳에서 휴식을 취하니 금방 좋아지셨네요."
10016150-16 = "가, 감사합니다…… 덕분에 완전히 회복한 것 같아요."
10016150-17 = "아뇨, 방심은 금물이에요!"
10016150-18 = "합동의료본부는 이제 곧 철수할 예정이라, 이곳에서 더 도움을 드릴 수는 없지만……"
10016150-19 = "혹시라도 트리니티에 돌아가신 뒤에도 컨디션이 나쁘시다면 꼭 구호기사단을 방문해 주세요!"
10016150-20 = "정의를 수호하는 일도 중요하지만, 건강을 해친다면 아무것도 지킬 수 없는 법이니까요."
10016150-21 = "네, 넵…… 명심할게요!"
10016150-25 = "그런데 저기…… 저쪽에 계신 분은……"
10016150-31 = "혹시 제 도움이 필요한 일이 남아있나요?"
10016150-32 = "아, 아뇨. 도움이 필요한 건 아니지만……"
10016150-33 = "저분은 게헨나의 학생처럼 보이는데, 트리니티의 정의실현부원인 제가 폐를 끼쳐도 괜찮은 걸까요……?"
10016150-34 = "아하, 그 문제라면ㅡ"
10016150-39 = "그 문제라면 신경 쓰지 마시길."
10016150-40 = "응급의학부는 발견한 부상자의 상태나 신원을 묻지 않고 동일한 응급의학부의 '담당'으로 판단합니다. 예외는 없습니다."
10016150-41 = "물론 그 과정에서 여러 가지 방해가 수반될 때도 있지만, 시체…… 아니, 환자가 있는 곳이라면 어디든 달려가는 것이 의료인의 숙명이니까요."
10016150-43 = "세간의 시선이나 편견을 신경 쓰는 것은 그 이후의 문제입니다."
10016150-44 = "그, 그렇군요……."
10016150-45 = "네. 게다가 <황륜대제>는 학원을 가리지 않고 모두가 사이좋게 선의의 경쟁을 치르는 평화의 제전이니까요."
10016150-46 = "저 역시 모든 학원의 환자 여러분이 같은 모습으로 건강히 돌아가실 수 있도록 최선을 다했답니다."
10016150-48 = "그리고 아까 환자분께서 쓰러지셨을 때, 제일 먼저 발견하고 후송을 해 오신 분도 세나 씨였거든요."
10016150-49 = "그, 그랬었군요……!"
10016150-50 = "그런 줄도 모르고 아까는 실례되는 말을 해서 죄송합니다……"
10016150-51 = "아뇨, 괜찮습니다."
10016150-52 = "게다가 환자를 가려가며 후송을 한다면, 질 좋은 시체…… 아니, 부상자들을 마음껏 만질 수 있는 기회를 놓치게 될 테니까요."
10016150-53 = "(시체……?)"
10016150-54 = "여, 여하튼 오늘은 감사했습니다!"
10016150-59 = "오늘 하루, 정말 수고 많으셨습니다!"
10016150-60 = "응급의학부의 여러분께서 힘써 주신 덕분에 평소보다 더 많은 환자를 수월하게 치료할 수 있었던 것 같아요."
10016150-61 = "아뇨. 오히려 구호기사단의 여러분께서 수고해 주신 덕분이지요."
10016150-62 = "고된 일정 속에서도 언제나 미소를 잃지 않고 환자를 대하는 구호기사단의 모습에는 저도 깊은 인상을 받았습니다."
10016150-63 = "그동안 후송이나 응급의학에 대해서는 어느 정도 일가견이 생겼다고 자부하고 있었습니다만, 앞으로도 갈 길이 먼 모양이군요."
10016150-68 = "무슨 걱정이라도 있으신가요?"
10016150-69 = "……아뇨, 구호기사단의 여러분께는 역시 사과를 드리는 편이 좋을지도 모르겠습니다."
10016150-70 = "아까는 세간의 시선이나 편견에 신경 쓰지 말라고 말했습니다만, 사실은 저도 <구호기사단>의 소문을 듣고 조금은 마음의 준비를 하고 있었거든요."
10016150-71 = "소문이요……?"
10016150-72 = "아, 혹시 구호기사단에서는 게헨나의 환자들을 받지 않는다는 유언비어라든가ㅡ"
10016150-73 = "아뇨, 그런 종류의 이야기가 아니라……"
10016150-79 = "구호기사단의 단장이 구호를 시작하면 부상자가 줄기는커녕 오히려 늘어난다는 이야기를 들은 적이 있습니다."
10016150-80 = "일각에서는 '단장이 부수고, 기사단이 치료한다'라는 말도 있는 모양이던데……"
10016150-81 = "이렇게 상냥한 부원들을 이끄는 구호기사단의 단장님이 그런 모습을 보이실 리가 없겠지요."
10016150-82 = "………."
10016150-83 = "그리고 구호기사단의 어떤 간호사는 수면 장애를 앓는 환자를 향해 배트를 휘두르거나, 투구꽃 뿌리로 끓인 차를 대접해서 상태를 악화시키기도 했다고 들었습니다만……"
10016150-84 = "아, 아하하…… 소문은 흔히 과장되는 측면이 있으니까요."
10016150-85 = "네. 오늘 여러분께서 보여주신 모습을 보니 역시 소문은 소문에 불과한 모양입니다."
10016150-86 = "아, 그러고 보니 또 다른 소문도 하나 들었습니다만."
10016150-87 = "또 다른 소문이요……?"
10016150-88 = "네. 구호기사단에는 언제나, 어디서나 나타나는 유령 같은 존재의 간호사가 있다고 들었습니다."
10016150-89 = "소문에 의하면 그 간호사는 환자가 너스콜을 누르기도 전에 나타나서, 환자에게 필요한 조치를 순식간에 끝마치고 사라진다 하더군요."
10016150-90 = "혹시 세리나 씨는 그 유능한 간호사의 정체에 대해 알고 계시는지ㅡ"
10016150-92 = "세, 세나 씨……! 그러고 보니 이후의 <후야제>에서 거대한 캠프파이어를 준비하고 있다고 하던데……"
10016150-93 = "괘, 괜찮으시다면 함께 캠프파이어를 보러 가지 않으시겠어요?"
10016150-94 = "저야 큰 상관은 없습니다만……"
10016150-95 = "큰불을 다루는 장소라면 시체…… 아니, 환자가 발생할지도 모르는 일이니까요."
10016150-96 = "그럼 어서 준비를 할까요? 환자의 조치는 조금도 지체할 수 없으니까요!"
10016150-103 = "……소문에 대한 이야기는 다음번에 다시 여쭈어야겠군요."
