[translation]
70009020-1 = "그러나 사감대는 달린다 2"
70009020-3 = "하아…… 다녀왔습니다."
70009020-7 = "지쳤다, 지쳤어~"
70009020-8 = "사감대장님이 제때 도착하셔서 망정이지. 아니었다면…… 으으, 상상도 하기 싫네."
70009020-13 = "아, 맞다. 개인 작품……."
70009020-17 = "아~ 몰라~ 오늘은 몇 배나 더 힘들었으니까 포상 휴일이야~ 내일 해, 내일~"
70009020-21 = "아~ 침대다~ 좋다~"
70009020-25 = "……마지막으로 붓질한 게 며칠 전이더라……."
70009020-26 = "이런 생각 해서 뭐해. 그럴 시간에 잠이나 자자."
70009020-27 = "하암…… 안녕히 주무세요~"
70009020-32 = "빠바밤밤~!! 빠바바밤~!!"
70009020-33 = "으악?! 뭐, 뭐야?!"
70009020-34 = "누가 이 시간에 노상 공연을…… 아니, 누구인지는 뻔하지만……."
70009020-35 = "또 시작이야!! 잠 좀 자자!!"
70009020-36 = "배경음악부야!! 누가 좀 멈춰!!"
70009020-40 = "전원 기상! 5분 내로 복도에 집합한다! 반복한다! 전원 기상!"
70009020-41 = "아, 아아아아……."
70009020-42 = "……하아. 어쩌겠어, 준비해야지."
70009020-49 = "……약 7분 전, 자유외출부가 학교 담장을 넘어 탈출하려는 정황이 포착되었다."
70009020-50 = "젠장, 또 자유외출부야."
70009020-51 = "이번 달만 벌써 4번째야…… 걔네는 안 자냐……?"
70009020-55 = "현 시각 우리의 최우선 목표는 탈주 저지이고, 차우선 목표는 자유외출부 부장의 신병 확보다. 여기까지 질문 있나?"
70009020-56 = "저, 하나 질문 있습니다."
70009020-57 = "밖에 있는 배경음악부는 내버려둬도 됩니까? 각 기숙사에서 어떻게 해달라는 민원이 속속들이……."
70009020-58 = "음, 배경음악부는 방치한다. 아직 체포 명령이 내려지지 않았기 때문이다."
70009020-59 = "그렇지만, 그러면 학생들이 잠을……."
70009020-60 = "만약 오케스트라의 모든 연주자가 지휘자를 무시하고 스스로 판단한다면 어떻게 될까?"
70009020-61 = "네? 어, ……연주가 엉망이 되겠죠?"
70009020-62 = "같은 이치다. 사감대장님은 체포령을 내리지 않았다. 그 이유를 판단하는 건, 우리 역할이 아니다. 중요한 것은, 저들이 체포 대상이 아니란 거다."
70009020-63 = "명령을 이해하려 하지 마라. ……느끼는 거다!"
70009020-64 = "과연……! 알 것 같습니다……!"
70009020-66 = "(……아무래도 좋으니까 빨리 끝내 줘.)"
70009020-72 = "그러면, 사감대 출동한다! 전속력으로 전진!"
70009020-74 = "와일드헌트 학교 담장 근처"
70009020-76 = "하아, 하아……."
70009020-77 = "야밤에 이게 대체 무슨 고생이야…… 그래도 앞으로 조금이면……."
70009020-86 = "네?! 아니요, 알았습니다."
70009020-91 = "전 부대 정지!"
70009020-95 = "……?"
70009020-96 = "지금부터 배경음악부를 체포하러 간다!"
70009020-97 = "……허?"
70009020-99 = "자유외출부는요? 여기까지 왔는데……."
70009020-100 = "그보다 배경음악부는 아까 체포할 수 있던 거 아니야? 우리 행군할 때, 옆에서 응원가 연주하던데."
70009020-102 = "학생들의 편안한 휴식을 위해 배경음악부 체포를 최우선시하라는 사감대장님의 명령이다!"
70009020-103 = "하지만 제군들의 불만은…… 이해한다."
70009020-104 = "……오?"
70009020-105 = "멀리 있는 자유외출부를 체포하라 했다가, 이동이 끝나니 다시 회군하라니. 확실히 이해하기 어려운 명령이군."
70009020-107 = "(설마, 드디어 깨달은 겁니까……?)"
70009020-108 = "(그래요, 당신이라면 지금이라도 이 상황을…….)"
70009020-110 = "과연…… 사감대장님의 깊은 뜻을 헤아리기는 어렵구나!"
70009020-111 = "가자, 대원들! 다시 되돌아간다! 사감대장님의 명령이니 틀림없다! 전속 전진!"
70009020-116 = "……아~"
70009020-117 = "진짜~!!!"
70009020-121 = "이놈의 학교는 도대체~~~~~!!!"
70009020-125 = "그러나 사감대는 달린다"
