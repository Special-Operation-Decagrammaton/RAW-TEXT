[translation]
83303300200-6 = "아, 어서 오세요. 부장님. 고생하셨습니다."
83303300200-7 = "직접 처리하신 마코토 의장의 동상들 외에, 다른 지역에 있는 것도 전부 회수처리했습니다."
83303300200-8 = "……응, 아코도 고생이야. 대응 고마워."
83303300200-9 = "아니요…… 이 정도는 아무것도 아니죠. 다만……"
83303300200-10 = "마코토 의장…… 진짜 늘 제멋대로네요! 마음 같아선 정면에서 박살을 내주고 싶을 정도예요!"
83303300200-11 = "뭐, 아코의 기분이라면 나도 이해가 가지만."
83303300200-15 = "……으응. 아니, 지금은 그럴 때가 아니니까."
83303300200-16 = "아코, 오늘은 서둘러 선도부의 업무를 끝내두고 싶어. 도와주겠어?"
83303300200-18 = "아, 넵! 바로 시작하겠습니다!"
