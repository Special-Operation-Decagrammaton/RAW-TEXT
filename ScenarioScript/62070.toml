[translation]
62070-1 = "제7화;포르타 파시스 1"
62070-3 = "[ns] \"그게…… 뭐야?\""
62070-4 = "사, 사실 저도…… 잘, 몰라요. 그냥, <포르타 파시스>라는 건물이 아리우스에 있어 왔고……"
62070-5 = "그 건물이, 아주 오래되었다는 것만, 아는 정도예요. 스쿼드 분들은 다를 수도 있겠지만……."
62070-7 = "저희라고 해도 마찬가지인데요……. 그 뜻이 <평화의 문>이라는 것과……."
62070-8 = "……절대로 그곳의 문을 열어서는 안 된다는 말 정도였지."
62070-10 = "그래. 아리우스는…… 언제부터 시작되었는지도 모를 내전으로, 자주 지배 세력이 바뀌고는 했지만."
62070-11 = "그 모두가 공통으로, '포르타 파시스에는 접근하지 말 것'을 철칙처럼 지켰다."
62070-12 = "……지금 생각해 보면, 거기에 얼마나…… 말로 표현할 수 없을 것이 숨겨져 있기에, 그렇게 서로를 없애려 했던 자들이."
62070-13 = "그 철칙 하나만은 그토록 필사적으로 지키려 했던 것인지, 의문이 들 지경이지만……."
62070-14 = "네, 네에……. 그때는 모두가, 하루하루 버텨내는 데 바빴으니까, 다른 생각을 할 여유가 없기도 했죠……."
62070-15 = "저는, 1학년이니까…… 그런 건 알 필요도 없고, 알려고 해서도 안 된다고만, 들었어요……."
62070-16 = "……."
62070-17 = "다만, 이것은 어디까지나 건너 들은 이야기에 지나지 않지만……."
62070-18 = "거기에는 아무에게도 알려지지 않았던, 아리우스의 과거에 대한 것들이 숨겨져 있다는 말을 듣기는 했다."
62070-19 = "[s] \"아리우스의 과거?\""
62070-23 = "그랬던 건가요……? 하지만 그런 건 보통, 선배들로부터 이야기로 전해 들어 왔는데……."
62070-24 = "그랬을 거야. 아리우스의 과거는, 적어도 대외적으로는 트리니티의 공식 기록으로 남은 것이 전부이기도 하고."
62070-25 = "……정작 우리가 트리니티의 공식 기록에 대해 자세히 알아볼 기회는 없었지만, 교육받은 대로라면, 그 대부분이 날조와 은폐로 가득하다고 들었어."
62070-26 = "가, 가령 공의회에서 아리우스가 먼저 물리적인 충돌을 일으켰기에, 불가피하게 파문을 명할 수밖에 없었다거나……."
62070-27 = "……그 당시의 아리우스를 이곳으로 보낼 수밖에 없었던 것은, 그들이 자초한 결과라고 했다던가. 뭐, 그런 이야기였지."
62070-28 = "역사는 승자의 기록이라는 말이 있지만, 이런 경우는…… 특히 더 그렇다고 볼 수 있을 것이고."
62070-33 = "………."
62070-34 = "[s] \"아츠코?\""
62070-35 = "응? 왜 그래, 선생님?"
62070-36 = "뭔가 할 말이 있느냐고?"
62070-37 = "……."
62070-38 = "있잖아, 선생님."
62070-39 = "혹시, 트리니티와 아리우스 양쪽 모두의 역사…… '숨겨진' 부분의 역사에 대해, 잘 알고 있는 학생이 있을까?"
62070-40 = "……그런 게 있을 리 없잖아, 아츠코. 그쪽 애들도 자기가 배운 대로만 배워 왔을 텐데."
62070-41 = "물론 그렇겠지만, 혹시나 해서. 스스로 '진실'을 찾아가는 사람들은, 어디에나 있기 마련이잖아?"
62070-42 = "가령, 트리니티의 '도서부'라던가?"
62070-43 = "[s] \"……! 도서부 아이들을, 알고 있어?\""
62070-44 = "그곳의 학생들에 대해서는 잘 모르지만, 트리니티의 도서부에 대해서는 들은 것들이 있어."
62070-45 = "그리고 거기의 부장님은…… 여러 가지 의미로, 엄청난 성격의 학생이라는 것도."
62070-46 = "[s] (……틀린 말은…… 아니긴 하지…….)"
62070-47 = "어, 어떻게? 그런 거, 우리는 전혀 알 수 없었는데……."
62070-48 = "후훗. 글쎄."
62070-49 = "어떤 의미로는, 이른바 '로열 블러드'의 특권 같은 것이었다고 해 둘까?"
62070-50 = "……그래. 아츠코는 '공주'였으니까."
62070-51 = "그, 그렇죠……. 원래대로였다면, 저 같은 것은 감히, 공주님을 올려다보는 것도……."
62070-52 = "자, 자. 나는 더 이상 그런 게 아니야. 그리고 그냥 편하게 아츠코라고 불러 줘."
62070-56 = "네, 네에?! 하하하하, 하지, 만……!"
62070-57 = "그렇지만 우리, 같은 1학년이잖아? 그렇지, 마이아?"
62070-58 = "그, 그건 그렇기는 한데요! 아무리 그래도……!"
62070-59 = "연습해 보자. 아. 츠. 코."
62070-63 = "아, 아츠코…… 씨."
62070-64 = "응. 잘했어. 악수."
62070-65 = "히이이……."
62070-70 = "……결국 아츠코는, 우리가 알 수 없었던 것들을 알고 있었다는 건가……."
62070-71 = "이해는 할 수 있어. 그런 자리에 있는 사람은, 그렇지 않은 사람보다 필연적으로 어떤 것들을 더 알 수밖에 없었겠지."
62070-72 = "그래서…… 저희에게는…… 이야기하지, 않았던 거군요……."
62070-73 = "그 부분은 미안해. 하지만 내가 함부로 이야기했다가는……."
62070-74 = "그래. 아마도 위험했던 것은, 우리들의 목숨이었을 거다."
62070-75 = "히, 히에에에……."
62070-76 = "아리우스를 나간 다음에는 말해 줄 수 있지 않았을까 하지만……. 뭐, 그쯤 되어서는 아무래도 좋은 이야기들이었던 건가."
62070-77 = "응. 하지만 이젠 아니게 된 것 같네."
62070-78 = "[s] \"알았어, 아츠코.\""
62070-82 = "[ns] \"우이에게는 내가 연락해 볼게.\""
62070-83 = "우이 씨라고 하는구나 그 사람."
62070-88 = "그러면 부탁할게, 선생님."
62070-97 = "사람을 무슨 편리한 만능 백과사전으로 취급하시는 거 아니에요?!?!"
62070-102 = "히, 히잇……! 무서워…… 무서워요……!"
62070-103 = "우, 우아아아아…… 무서워……. 무섭네요오……."
62070-104 = "히, 히요리 씨도요……? 스쿼드 분들은, 아무것도 안 무서워할 줄 알았어요……."
62070-105 = "저희도 무서운 건 무서워요…… 그리고 세상에는 너무 무서운 게 많아요……."
62070-111 = "[ns1] \"미안, 미안…….\"\n[ns2] \"아, 아메리카노 쿠폰 20장 보내 줄까? <화이트&메이슨>으로!\""
62070-117 = "안 돼요, 부장님! 선생님께서는 평소에도 저희에게 도움을 많이 주시잖아요! 오히려 도와드릴 수 있다는 사실에 감사드려야죠!"
62070-119 = "하, 하지만……."
62070-120 = "자꾸 그러면, 저 이대로 부장님 끌고 선생님 계신 곳까지 '출장' 갈 거예요?"
62070-121 = "에으아?!"
62070-127 = "듣던 대로 대단한 분이네……."
62070-128 = "[s] \"우이가 이래서 미안해…….\""
62070-129 = "안녕, 우이 씨. 시미코 씨. 아리우스 분교의 하카리 아츠코야. 잘 부탁해."
62070-130 = "조마에 사오리다."
62070-131 = "……이마시노 미사키."
62070-132 = "츠치나가 히요리, 입니다……. 헤, 헤헤……. 저기, 트리니티 고서관은 키보토스에서도 알아주는 도서관이라고 들었는데요……."
62070-133 = "지난 과월호 잡지 같은 것도…… 있을까요?"
62070-134 = "네. 히요리 씨. 스크랩 용도로 전자 보관 중인 잡지 자료들이 있어요. 나중에 선생님 편으로 데이터 이전해 드릴까요?"
62070-138 = "저, 정말인가요?! 가, 감사합니다! 하, 하지만 저희는 특별히, 드릴 것이 없는데……."
62070-139 = "괜찮습니다. 활자와 지식을 사랑하는 분들은, 모두 저희의 동료와 마찬가지니까요."
62070-140 = "우애애앵~ 살아 있어서 다행이었어요……!"
62070-141 = "인사가 너무 늦었네요. 정식으로 인사드리겠습니다. 엔도우 시미코입니다."
62070-146 = "네? 저, 저도요?! 으, 어…… 타치기 마이아라고, 해요……. 자, 잘 부탁드려요……."
62070-151 = "……."
62070-152 = "부장님?"
62070-156 = "그, 그게…… 하아…… 코제키 우이, 입니다……. 그냥 우리 빠르게 본제로 넘어가죠……."
62070-157 = "[s] \"모모톡으로 사정은 들었지?\""
62070-158 = "네. 저희 쪽에서도 최대한 조사해 보았고, 아마도 선생님께서 원하는 부분을 찾을 수 있었던 것 같아요."
62070-159 = "그런 자료가 있었다고?! 하지만……."
62070-160 = "……물론, 트리니티에서는 준 금서로 지정된 부분인 것들이 맞아요……."
62070-161 = "보기에 따라서는 그럴 만한 자료들이라고 보아줄 수 있는 부분이, 없는 것도 아니기는 하지만……."
62070-162 = "꽉 막힌 티파티, 그리고 시스터후드 녀석들……. 자기들이 지금껏 일 처리를 이렇게 해 왔으니까 더 의심을 사는 거잖아……."
62070-163 = "……여기는 트리니티의 도서부, 그리고 그중에서도 '고서관'이니까요. 웬만한 것들은 거의 찾을 수 있답니다."
62070-164 = "물론 다른 학원에 대한 정보라면, 완전하지 않을 수도 있겠지만……."
62070-165 = "……이건 어떤 의미로는, 트리니티의 과거…… 이기도, 하니까요……."
62070-166 = "권력자 녀석들은 항상, 자기들에게 유리한 상황을 만들고 싶어 하다 보니……."
62070-167 = "특히 이런 것들을 은폐하고 조작해, 더 큰 거짓말로 진실을 덮으려고 하지만……!"
62070-168 = "……어림도, 없죠……."
62070-169 = "알고 있는 것들을 이야기해 줄 수 있을까, 우이 씨?"
62070-170 = "아리우스의 '전' 로열 블러드로서, 부탁할게."
62070-174 = "로열…… 블러드? 당신이……?"
62070-175 = "[s] \"응. 그 말은 사실이야.\""
62070-179 = "……."
62070-180 = "좋아요……. 어차피 이야기할 수 있는 부분까지는, 이야기하려고 했지만……."
62070-181 = "이렇게 된 이상, 무언가를 숨기려고 하거나…… 말하지 않을 필요는, 없겠네요……. 선생님께서도 보증해 주셨고……."
62070-185 = "포르타 파시스는, 원래는 그 이름 그대로 사용하고자 했던 건물이었습니다."
62070-186 = "네. 평화의 문, 그 자체로요."
62070-187 = "……아리우스 분교가, 처음 트리니티 종합학원과 갈라섰을 때 지어진 건물이죠."
62070-188 = "그때는…… 놀랍게도, 트리니티도 아리우스도, 결국 평화롭게 이 문제를…… 해결할 수 있을 것이라고 생각했으니까요……."
62070-189 = "……하지만 그렇게 되지 않았지?"
62070-190 = "……네."
62070-191 = "사실, 이 부분은 저희 쪽에서도 기록이 명확하지 않아요."
62070-192 = "……권력의 진짜 무서움은, 기록하는 것이 아니라 '기록하지 않는 것'에 있다는 말도 있으니까요."
62070-193 = "그래서, 이 대목만큼은……."
62070-194 = "……전체적으로 중요한 부분은 아닐 테니까, 간단하게만 언급할게."
62070-195 = "아리우스에서 끝없이 이어져 왔던 내전의 첫 발단은, 포르타 파시스의 완공을 둘러싸고 일어났어."
62070-199 = "펴, 평화의 문인데요?! 완전 반대잖아요!?"
62070-200 = "정말로 이런 이야기, 들어도 되는 걸까요……."
62070-202 = "……놀랍게도 이런 기념 건축물은, 처음 지었을 때의 의도와 완전히 반대되는 방향으로 전락해 버리는 경우가 많지."
62070-203 = "'상징'이라는 개념이 갖는 특성…… 한계 때문일지도 모르는 일이다. 사람은 한 가지 개념을 너무 강요당하면, 오히려 반발하고 싶어지곤 하니까."
62070-204 = "응. '평화의 문'을 지어도, 결코 평화는 찾아오지 않을 것이라고 생각한 사람들이 있었고."
62070-205 = "그래도, 지금 당장 평화가 찾아오지 않더라도, 먼 훗날의 언젠가 평화가 올 것이라고 생각한 사람들이 있었어."
62070-206 = "……각각의 생각의 기저에는, 트리니티와 아직은 이야기를 나눌 수 있다고 여기는 의견과"
62070-207 = "정확히, 그 반대가 될 수밖에 없다는 의견이 자리하고 있었고. 그리고……."
62070-209 = "그것이, 내전의 발단이었군요……."
62070-210 = "응. 바깥을 향하고 있던 분노가, 안을 향하기 시작한 거지."
62070-211 = "이 부분은 여기까지만 이야기하도록 할게."
62070-212 = "너무 혼란스러웠던 데다 예전의 일이었어서, 아리우스 쪽에서도 제대로 사료가 남아 있지 않은 부분이니까."
62070-213 = "하지만 그때 생겨난 분노는…… 계속해서, 세월을 이어 가며 내려져 왔어."
62070-214 = "트리니티를 향한 분노, 그리고 우리 안의 우리를 향한 분노."
62070-215 = "……지금 와서 생각해 보면, 먼 과거의 일인데도 말이야."
62070-216 = "……사람은, 어쨌든 공감할 수 있는 존재니까요……."
62070-217 = "누군가에게 공감하는 방향으로 진화해서, 지금의 위치를 차지하게 된 것도 맞고……."
62070-218 = "네. 거기에는 역사를 되돌아보며, 옛날 사람이 가졌던 감정들에 대해 공감하며."
62070-219 = "같은 것을 바라보고 같은 것을 느끼는 것 역시, 포함되어 있어요."
62070-220 = "맞아. 아리우스의 분노는, 그런 식으로 계속해서 이어져 왔어."
62070-221 = "처음으로 승리한 쪽, 그러니까 평화의 문은 더 이상 평화의 상징으로서 사용될 수 없다고 생각한 쪽은……."
62070-222 = "본보기와 지표를 세우기 위해, 그 지하에 거대한 '기록 보관소'를 만들기로 했지."
62070-223 = "포르타 파시스의 지하에, 기록 보관소가 있었다고?!"
62070-224 = "그래. 그리고 그 기록 보관소는…… 아리우스에서 일어나는 일들을, 하나하나 기록하기 시작했어."
62070-225 = "……꼭 트리니티의 도서관 같네요."
62070-226 = "무언가를 기록하고 남기려는 것은…… 인간의 본능과도 같은 것이니까요……. 일종의 보편 감정이죠……."
62070-228 = "응. 그렇게 포르타 파시스와 기록 보관소는, 말 그대로 아리우스의 도서관으로 작용했지만……."
62070-229 = "내가 아는 것이 틀리지 않았다면, 150년하고도 조금 더 전, 그때의 아리우스를 지배하고 있었던 세력은."
62070-230 = "포르타 파시스와 그 기록 보관소를, 출입 금지 구역으로 지정했어."
62070-231 = "[s] \"그건, 어째서?\""
62070-232 = "정확한 이유는 몰라. 단지, 이건 내 추측이지만……."
62070-233 = "아마도, 더 이상 감당할 수 없다고 생각했기 때문이 아니었을까."
62070-234 = "쭉 쌓여 왔던 이야기들과, 거기에 얽힌 검은 감정들을 말이지."
62070-235 = "[s3] \"……그런가.\"\n[s4] \"그건 조금, 알 것도 같네…….\""
62070-238 = "……정보 접근 금지 명령이군요……. 트리니티도 그 문제에서 자유롭지 못한 부분이 있죠."
62070-239 = "하여튼 권력자란 것들은……."
62070-240 = "네…… 냉정하게 통치와 지배의 관점에서만 보자면, 어느 정도의 분노는 분명 통치에 도움이 되지만, 지나친 분노는 역효과를 불러일으키죠."
62070-241 = "……적당히 선동대를 조직해서 권력을 잡은 다음, 언제 그랬냐는 듯이 그 선동대를 없애 버리는 건, 너무 흔히 일어나는 일이라서 새로울 것도 없고요……."
62070-243 = "바, 바깥은 그런 식으로 돌아가는 건가요……? 무서워요, 히요리 씨……. 무서워요……."
62070-244 = "저, 저도 그래요……. 조금 더 살 자신이 없어졌어요, 우애애앵……."
62070-245 = "그래도 시미코 씨가 잡지 자료를 준다고 했으니까 아직은 조금 더 희망을 가져 볼래요……."
62070-247 = "아니, 그거 여기에서도 똑같이 일어났던 일이라고. 너희들……."
62070-248 = "그런가. 그래서 아리우스의 역사는, 그 이후로는 '구전'의 형태로 전해져 내려왔던 것이군."
62070-249 = "맞아. 마담……. 베아트리체가 아리우스를 최종적으로 지배하기 전까지, 아리우스의 지배자는 언제나 바뀌어 왔지만."
62070-250 = "그 사람들 모두, 공통적으로 아리우스의 정보에 접근하는 것을 제한하려고 했던 것은, 그 때문이었을 거야."
62070-251 = "……그 이름을 평범하게 부를 수 있게 된 건가."
62070-252 = "응. 이제는 그럴 때가 되었다고 생각해."
62070-253 = "하지만 구전으로 역사를 전하게 되는 과정에서, 부작용은 분명히 발생했다."
62070-254 = "……간단히 이야기하자면, 사람마다 말이 조금씩 달랐지."
62070-256 = "입에서 입으로 전해지는 이야기란 건, 보통 그런 법이니까."
62070-257 = "어떤 건 부풀려지고, 어떤 건 지워지고, 이야기하는 사람의 감정이 섞이면서 어그러지고……."
62070-258 = "아마도 우리들이 들었던 아리우스의 역사는, 실제보다 더 왜곡되어 있었을 거야."
62070-259 = "그래. 나도 이제 와서 포르타 파시스의 기록을 공개해 봤자, 오히려 별로 대단한 것은 없을 거라고 봐."
62070-260 = "거꾸로 그 기록을 재검토하는 것으로, 아리우스의 정상화를 이끄는 첫 단추를 채울 수 있을지도 모르는 일이지."
62070-261 = "그렇다면…… 어째서, 스바루 선배는 그곳으로 가려는 걸까요……?"
62070-262 = "아마도 스바루는, '무언가'를 알았을 거야."
62070-263 = "그 과정까지는 짐작할 수 없지만, 베아트리체가 사라진 다음의 아리우스는…… 어떤 의미로 '모든 것이 허용되는 장소'가 되었을 테니까."
62070-264 = "그, 그건…… 그랬어요……. 그래서 스바루 선배가 다시, 질서를 잡을 때까지…… 여기는……."
62070-265 = "흑……."
62070-266 = "자, 자. 울지 마. 미안해. 그리고 여기에서부터는, 나만이 알고 있었던 이야기를 하도록 할게."
62070-267 = "아마 지금은 스바루 역시 알고 있는 것일 수도 있겠지만 말이야."
62070-272 = "그건…… 뭔가요?"
62070-277 = "포르타 파시스에 감춰진, 아리우스의 <비의>야."
62070-281 = "다음화;포르타 파시스 2"
