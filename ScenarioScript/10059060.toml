[translation]
10059060-1 = "제6화;학원에 숨은 괴도"
10059060-2 = "분위기를 보니, 아무래도 그 고압적인 평의회장께서 또 당신을 괴롭힌 모양이군요?"
10059060-3 = "아, 아니에요. 괴롭히다니……."
10059060-4 = "……괴로운 상황인 건 맞지만요."
10059060-5 = "이 사태가 이어지면…… 저는 물론이고 미리아 님의 신변도 위험해요."
10059060-6 = "마나미 님이 가장 증오하는 당신을, 평의회 부회장인 제가 숨겨주고 있었다니……."
10059060-7 = "아마 우리 둘 다 퇴학으로 끝나진 않겠죠."
10059060-8 = "이 기회에 마나미 씨를 무대에서 내려오게 하면 어떨까요?#n평의회장에서 하차시키는 거예요."
10059060-9 = "그동안 안 좋았던 여론까지 모두 이용한다면 불가능해 보이진 않은데."
10059060-10 = "당신이 이끄는 <장미 화원>도 있으니…… 충분히 할 수 있잖아요?"
10059060-11 = "그건…… 안 돼요."
10059060-12 = "제가 그분을 존경하는 마음은 진심이니까요."
10059060-13 = "<그런 일>을 겪고도 평의회장까지 오르다니……."
10059060-14 = "저라면…… 절대로 불가능했을 거예요."
10059060-15 = "……확실히, 그런 면에서는 대단한 사람이죠."
10059060-16 = "우리의 가치관이 마나미 님과 맞지 않는 건 사실이에요. 하지만……."
10059060-17 = "지금은 내부의 분열을 최소화하고 공공의 적과 맞서야 할 때예요."
10059060-18 = "예술을 돈벌이 수단으로만 보는 쓰레기들에게…… 이용당할 순 없잖아요?"
10059060-19 = "후후, 당신이 그런 거친 말이라니."
10059060-20 = "뭐, 그만큼 심각한 사안이긴 하네요."
10059060-24 = "저도 동의합니다. 이번 일은 가만두고 볼 수 없어요."
10059060-25 = "상대가 일곱 죄수라서 더더욱."
10059060-26 = "이미 누구인지…… 알고 계셨군요?"
10059060-27 = "저도 나름 정보를 모으고 있었으니까요."
10059060-28 = "아마도 이번 사건의 배후는 <배금의 브로커>."
10059060-29 = "블랙마켓의 각종 불법 사업을 우유 유통으로 속여서 부를 챙기고 있는 죄수죠."
10059060-30 = "알고 계신다면 혹시…… 접촉할 수 있는 방법이 있을까요?"
10059060-31 = "아쉽지만 일곱 죄수라고 서로에 대해 잘 아는 건 아니에요."
10059060-32 = "하지만 브로커와 연락이 닿는 사람을 알고 있죠."
10059060-33 = "일곱 죄수 사이에 갈등이 타오르면 가장 곤란한 사람이에요."
10059060-34 = "그 사람을 통해서라면, 이번 불길을 꺼뜨릴 방법도 찾을 수 있겠죠."
10059060-35 = "……아무래도 <그쪽 세계>의 분이신가 보네요."
10059060-36 = "그럼 일단은 믿고 맡길게요. 당신은 제 뒤를 칠 사람이 아니니까."
10059060-40 = "……잊지 마세요."
10059060-41 = "당신이 정체를 숨기고 계속 학원 생활을 할 수 있는 건, 전부 제 덕이라는 거."
10059060-42 = "후후…… 마치 약점을 붙잡고 이용하는 악당 같은 대사였네요."
10059060-43 = "죄송해요. 그런 의미에서 한 말은 아니었는데……."
10059060-44 = "네. 알아요. 당신의 선의엔 항상 감사하고 있으니까."
10059060-45 = "으으…… 이해해 주셔서 감사해요."
10059060-46 = "그럼 뒷일을 잘 부탁드릴게요. 저는 이만……."
10059060-52 = "……상대하기 쉬운 것 같으면서도, 빈틈이 보이지 않는 사람이네요."
10059060-53 = "역시, 장미는 아름답지만 가시가 있는 법이군요."
10059060-55 = "다음 날……."
10059060-62 = "오, 미리아 님? 외출입니까?"
10059060-63 = "네. 시국이 이러합니다만, 외부 조사 업무도 게을리할 수 없으니까요."
10059060-64 = "겸사겸사 이번 사건에 대한 정보도 입수해 볼까 하고요."
10059060-65 = "으으, 대규모 검문을 펼쳤는데도 나오는 게 없다니."
10059060-66 = "좋은 결과가 있었으면 좋겠네요! 학원의 미래가 달렸으니까요!"
10059060-67 = "네. 여러분도 각자의 자리에서 최선을 다해 주시길."
10059060-69 = "(저에게 학원의 미래가 달렸다니. 정말 재미있네요.)"
10059060-71 = "번화가의 어느 사무실"
10059060-74 = "저예요."
10059060-75 = "네. 들어오세요."
10059060-81 = "갑자기 찾아와서 죄송해요."
10059060-85 = "후후, 괜찮아요. 이렇게 대면하는 것도 오랜만이네요."
10059060-86 = "자, 이쪽에 앉으세요. 맛있는 다과를 준비해 두었답니다."
10059060-91 = "그나저나 놀랍네요. 당신의 사무실이 이런 번화가에 있었을 줄이야."
10059060-92 = "후후, 나무를 숨기려면 숲에 숨기라는 말이 있잖아요?"
10059060-93 = "당신이 와일드헌트 학원의 중심에 숨어 있는 것처럼요."
10059060-94 = "아, 그래요. 요즘 학원 생활은 어떠신가요? 불편한 점은 없나요?"
10059060-95 = "사실 그 학원 생활 관련으로 말씀드릴 게 있어 찾아왔습니다만……."
10059060-96 = "최근 우리 학원에 불미스러운 일이 발생했습니다."
10059060-97 = "누군가가 학생들의 작품을 블랙마켓의 자금 세탁에 활용하고 있어요."
10059060-98 = "예술학원 학생으로서도, 자애의 괴도로서도 용납할 수 없는 일이에요."
10059060-99 = "호옴."
10059060-100 = "브로커가 시작한다는 새로운 사업이 아무래도 그거였던 모양이네요."
10059060-101 = "어쩌다 배금의 브로커가 이런 일을 벌였는지 설명을 부탁드려도 될까요?"
10059060-102 = "우선 당신을 불편하게 만든 것부터 사과드리죠."
10059060-103 = "죄송합니다. 제가 좀 더 신경을 써야 했는데."
10059060-104 = "아마 브로커도 당신이 와일드헌트에 있다는 걸 모르고 진행한 일일 거예요."
10059060-105 = "미리아의 정체를 아는 사람은 단둘뿐이니까요."
10059060-106 = "저. 그리고 와일드헌트 예술 평의회의 부회장 씨."
10059060-107 = "……거기에 [USERNAME] 선생님도 추가해 주세요."
10059060-108 = "호옴, 어쩌다 들킨 건가요?"
10059060-109 = "보는 순간 아시더라고요."
10059060-110 = "후후, 역시 얕볼 수 없는 분이네요."
10059060-111 = "뭐, 그분과 당신 사이에 있었던 일들을 미루어 보면…… #n정체를 떠벌리고 다닐 위험은 낮겠죠."
10059060-112 = "그나마 불행 중 다행이네요."
10059060-113 = "아무튼 다시 본론으로 돌아와서."
10059060-114 = "이대로 있다간 당신과 브로커의 갈등이 깊어지겠죠."
10059060-115 = "이미 깊어진 것 같은데요?"
10059060-116 = "……더 악화하는 걸 막기 위해서라도 어떻게든 제가 중재에 나서야겠네요."
10059060-117 = "하지만 브로커에게 당신이 와일드헌트에 있으니 멈춰달라고 말하는 건 위험해요."
10059060-118 = "자칫 잘못했다간, 비밀을 아는 사람이 또 늘어날 테니까."
10059060-119 = "그렇다고 다른 이유로 사업 중지를 요청하기엔 명분이 부족하고……."
10059060-120 = "호옴. 뭔가 좋은 구실이 없으려나."
10059060-124 = "아……."
10059060-125 = "[USERNAME] 선생님은 평의회와 협조 중이죠?"
10059060-126 = "네. 아주 적극적으로요."
10059060-127 = "후후, 역시나."
10059060-128 = "그렇다면 그걸 핑계로 조율해 보면 될지도 모르겠네요."
10059060-129 = "바로 연락을 해보죠."
10059060-137 = "너냐."
10059060-138 = "오랜만입니다, 브로커. 잘 지내고 계신지요?"
10059060-139 = "됐고, 본론만 말해."
10059060-140 = "시간은 돈이니까."
10059060-141 = "후후, 평소와 같은 걸 보니 잘 지내시는 것 같네요."
10059060-142 = "다름이 아니라, 최근 진행 중이신 사업 때문에 연락드렸습니다."
10059060-143 = "<개인적인 루트>로 제보를 하나 받아서요."
10059060-144 = "요즘 누가 내 뒤를 캔다던데, 그거냐?"
10059060-145 = "샬레가 와일드헌트의 예술 평의회에 협조하고 있는 모양이에요."
10059060-146 = "[USERNAME] 선생님에 대해서는 들어보셨죠?"
10059060-147 = "그 위선자 말인가."
10059060-148 = "……알고 있지. 내 뒤를 캐는 거, 그 녀석이잖아."
10059060-152 = "언젠가 충돌할 거란 건 알고 있었다."
10059060-153 = "이 기회에 손봐주지."
10059060-154 = "호옴. 역시 호전적이시군요."
10059060-155 = "저는 가급적 당신이 그분과 대립하는 건 피했으면 하는데요."
10059060-156 = "우리의 대의를 위해서라도 벌써 눈에 띄면 곤란하거든요."
10059060-157 = "그래서, 이번 사업 접으라고?"
10059060-158 = "……이게 미쳤나."
10059060-159 = "내가 선 넘지 말라고 했을 텐데."
10059060-160 = "너도 우유 통에 넣어 바다에 던져줄까?"
10059060-161 = "사업을 철수하라는 게 아니에요. 그저 대의를 위해 조심하자는 것뿐……."
10059060-162 = "제가 준비하고 있는 <그거>, 당신도 기대하고 있잖아요?"
10059060-163 = "……칫."
10059060-164 = "……."
10059060-165 = "뭐, 네 말대로 샬레가 붙었다면 귀찮아질지도."
10059060-166 = "쓸데없는 돈이 깨질 수도 있고……."
10059060-167 = "……젠장."
10059060-172 = "……좋아. 네 체면을 봐서라도 사업 방향을 전환하지."
10059060-173 = "시간 낭비하지 않고 빠르게 끝내는 방법이다."
10059060-174 = "접선 장소와 시간을 알려줄 테니, 너의 그 <개인적인 루트>로 전해."
10059060-175 = "내가 직접 관계자들과 만나 담판을 짓겠다."
10059060-176 = "어머나, 당신다워서 좋은 방법이네요."
10059060-177 = "아, 참고로 말해두지만……."
10059060-178 = "쓸데없는 짓 하면 가만 안 둬."
10059060-179 = "너도, 그 선생 녀석도."
10059060-180 = "후후, 네. 명심하죠."
10059060-184 = "자, 이렇게 무대가 만들어졌네요."
10059060-185 = "이제 관건은…… 선생님과 평의회의 협상 능력일까요?"
10059060-189 = "……아니요."
10059060-190 = "예술을 향한, 우리 모두의 긍지예요."
