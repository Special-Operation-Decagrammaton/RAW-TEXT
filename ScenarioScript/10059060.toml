[translation]
10059060-1 = "第6話;学院に潜む怪盗"
10059060-2 = "そのご様子では……またあの高圧的な評議会長に無理を言われたのですね？"
10059060-3 = "ま、まさか。無理を言われただなんて、そんな。"
10059060-4 = "……苦しい状況なのは、確かですけれど。"
10059060-5 = "この状況が続けば、わたくしだけでなく、ミリア様にも危険が及びます。"
10059060-6 = "マナミ様が最も憎んでいるあなたを……#nよりによってわたくしが匿っていたのですから。"
10059060-7 = "きっと退学程度では済まされないでしょうね。"
10059060-8 = "この機会に、マナミさんにはステージを下りていただくというのはいかがでしょう？#n評議会長の役を降板させるのです。"
10059060-9 = "積み重なった不満を利用すれば、決して不可能ではないと思いますし――"
10059060-10 = "あなたには、自ら率いる「バラ園」もあるのでしょう？#nその気になれば、十分に成し遂げられるはずです。"
10059060-11 = "それは……できません。"
10059060-12 = "わたくしは嘘偽りなく、あの方を敬愛しています。"
10059060-13 = "「あの出来事」を経験しながら、それでも評議会長の座にまで辿り着いた。"
10059060-14 = "もしも同じ状況に置かれたとき……わたくしには到底真似できません。"
10059060-15 = "……たしかに。その点については評価に値します。"
10059060-16 = "わたくし達とマナミ様の価値観が異なることは理解しています。"
10059060-17 = "ですが、今は内輪で争っている場合ではありません。#n手を取り合い、共通の敵に立ち向かうべきです。"
10059060-18 = "芸術を金儲けの道具としか見ないクズに……#n好き勝手に利用されるわけにはいきませんから。"
10059060-19 = "あなたの口から、そんなにも荒っぽい言葉が出るとは。"
10059060-20 = "いえ、それだけ看過できない問題だということですね。"
10059060-24 = "そしてそれは、私も同感です。#nこの件を黙って見過ごすつもりはありません。"
10059060-25 = "相手が七囚人ともあれば、なおさらです。"
10059060-26 = "黒幕を……ご存じなのですね？"
10059060-27 = "私も私なりに、情報を集めていましたから。"
10059060-28 = "おそらく、今回の事件を裏で糸引く者は「拝金のブローカー」。"
10059060-29 = "牛乳の流通を隠れ蓑にして、#nブラックマーケットで様々な違法事業を取り仕切っている七囚人です。"
10059060-30 = "そこまでご存じでしたら……接触する手立てをお持ちなのでは？"
10059060-31 = "残念ながら。#n七囚人だからといって、互いのことをよく知っているわけではありません。"
10059060-32 = "ですが、ブローカーと繋がりのある人物なら、心当たりがあります。"
10059060-33 = "七囚人同士が争うような事態を、最も嫌う方。"
10059060-34 = "その方を頼れば、この騒ぎを収める糸口くらいは見つかるかも。"
10059060-35 = "……裏の世界に顔が利く方のようですね。"
10059060-36 = "では、そちらはお任せします。"
10059060-40 = "ああ、そうそう。これだけは忘れないでください。"
10059060-41 = "あなたが正体を隠したまま、こうして学院生活を続けられているのは――#nすべてわたくしのおかげだということを。"
10059060-42 = "ふふ……これでは弱みを握って利用しているみたいですね。"
10059060-43 = "申し訳ありません。決してそんなつもりで言ったわけではないのですが……。"
10059060-44 = "ええ、分かっています。あなたの善意には、いつも感謝していますから。"
10059060-45 = "うぅ……そう言っていただけると、救われます。"
10059060-46 = "では、あとのことはよろしくお願いいたします。わたくしはこれで……。"
10059060-52 = "……あれほど柔らかな方なのに、付け入る隙はまるでない。"
10059060-53 = "やはり、美しいバラには棘があるものなのでしょうか。"
10059060-55 = "翌日――"
10059060-62 = "おや、ミリア様。お出かけですか？"
10059060-63 = "ええ。#nこのような状況ではありますが、外部の調査も疎かにするわけにはいきませんから。"
10059060-64 = "なにか、事件に関する情報を拾えれば良いのですが。"
10059060-65 = "内部であれだけ大掛かりな検査をしたのに何も出ませんでしたからね。"
10059060-66 = "良い成果を祈ってます！学院の未来がかかってますから！"
10059060-67 = "お二人も、それぞれの持ち場で最善を尽くしてください。"
10059060-69 = "（私に学院の未来がかかっているだなんて。滑稽な話です）"
10059060-71 = "繁華街のとある事務所"
10059060-74 = "私です。"
10059060-75 = "どうぞ、お入りください。"
10059060-81 = "突然のご無礼、お許しください。"
10059060-85 = "お気になさらず。思えば、顔を合わせるのも久しぶりですから。"
10059060-86 = "こちらへどうぞ。美味しいお茶やお菓子を用意してありますよ。"
10059060-91 = "それにしても驚きました。#nあなたの仕事場が、まさかこんな繁華街にあるとは。"
10059060-92 = "木を隠すなら森の中、と言うでしょう？"
10059060-93 = "あなたがワイルドハントに身を潜めているのと同じですよ。"
10059060-94 = "それで、学院生活はいかがです？何か不自由はありませんか？"
10059060-95 = "折しも、学院生活についてお話があるのです。"
10059060-96 = "近頃のワイルドハントは大事件の渦中にありまして。"
10059060-97 = "何者かが生徒の作品を[ruby=マネーロンダリング]資金洗浄[/ruby]に利用しているのです。"
10059060-98 = "ワイルドハントの生徒としても、慈愛の怪盗としても……#n到底、見過ごすことはできません。"
10059060-99 = "ほむ。"
10059060-100 = "新しい商売を始める、とブローカーが言っていましたね……。"
10059060-101 = "目的をご存じなら、ご説明いただけますか？"
10059060-102 = "まずは、あなたを不快な目に遭わせてしまったことをお詫びします。"
10059060-103 = "私がもう少し気を配っておくべきでした。"
10059060-104 = "ブローカーも、あなたがワイルドハントにいるとは知らずに進めたのでしょう。"
10059060-105 = "[ruby=・]ミ[/ruby][ruby=・]リ[/ruby][ruby=・]ア[/ruby]の正体を知っている者は2人しかいませんから。"
10059060-106 = "私と――ワイルドハント芸術評議会の副会長さん。"
10059060-107 = "……そこに、[USERNAME]先生も加えてください。"
10059060-108 = "ほむ。それはまた……。#nどうして見抜かれたんです？"
10059060-109 = "顔を合わせた瞬間に。"
10059060-110 = "やはり、侮れない方ですね。"
10059060-111 = "まあ、あの方とあなたの間にあった事を考えれば、#n正体を言いふらす真似はしないでしょう。"
10059060-112 = "せめてもの、不幸中の幸いですね。"
10059060-113 = "話を戻しましょう。"
10059060-114 = "このままでは、あなたとブローカーの対立は深まる一方です。"
10059060-115 = "すでに許容の範疇を越えておりますが。"
10059060-116 = "……手が付けられなくなる前に、私が間に入るしかなさそうですね。"
10059060-117 = "とはいえ、伝え方が難しいですね。#nあなたのことをブローカーに話すわけにもいきませんし。"
10059060-118 = "下手をすれば、秘密を知る者がまた1人増えてしまいますから。"
10059060-119 = "かといって商売をやめさせるほどの理由付けには、いささか口実が弱い……。"
10059060-120 = "ほむ……何かないものでしょうか。"
10059060-124 = "……ああ。"
10059060-125 = "[USERNAME]先生は評議会に協力しているのでしたね？"
10059060-126 = "ええ。積極的に。"
10059060-127 = "なるほど。"
10059060-128 = "それなら、うまく調整できるかもしれません。"
10059060-129 = "さっそく連絡してみましょう。"
10059060-137 = "アンタか。"
10059060-138 = "お久しぶりです。お元気でしたか？"
10059060-139 = "前置きはいい。用件は？"
10059060-140 = "時は金なり、だろ？"
10059060-141 = "お変わりないようで安心しました。"
10059060-142 = "実は、あなたが最近始めた商売について少しお話がありまして。"
10059060-143 = "ちょっとした伝手から、気になる話を耳にしたんです。"
10059060-144 = "私を嗅ぎ回ってる奴がいるらしいけど、それの話？"
10059060-145 = "シャーレが、ワイルドハントの芸術評議会に肩入れしているそうです。"
10059060-146 = "[USERNAME]先生はご存じでしょう？"
10059060-147 = "ああ、あの偽善者。"
10059060-148 = "なんだ、あいつだったんだ。"
10059060-152 = "どうせいつかはぶつかると思ってたけど。"
10059060-153 = "片づける良い機会か。"
10059060-154 = "ほむ。相変わらず好戦的ですね。"
10059060-155 = "できれば、今はまだ先生との衝突は避けていただきたいのですよ。"
10059060-156 = "私たちの大義のためにも、ここで悪目立ちするのは得策ではありませんから。"
10059060-157 = "だから？今回の商売から手を引けって？"
10059060-158 = "舐めてんの？"
10059060-159 = "私の領分に余計な口出しはするな、って言ったはずだけど。"
10059060-160 = "アンタもミルクタンクに詰めて沈めてあげよっか？"
10059060-161 = "手を引けと言っているわけではありませんよ。#n大義のために慎重に動こう、と言っているだけです。"
10059060-162 = "私が準備している「アレ」、あなたも楽しみにしているでしょう？"
10059060-163 = "……チッ。"
10059060-164 = "まあ……。"
10059060-165 = "アンタの言う通り、シャーレが噛んでるなら面倒ではある。"
10059060-166 = "余計な金まで飛びそうだし……。"
10059060-167 = "……クソッ。"
10059060-172 = "いいよ。アンタの顔を立てて、やり方を変えてやる。"
10059060-173 = "ぐずぐず時間をかけず、一気にケリをつける方法で。"
10059060-174 = "場所と時間を送るから、「伝手」とやらに回して。"
10059060-175 = "私が直接、話をつける。"
10059060-176 = "実にあなたらしいやり方ですね。"
10059060-177 = "言っとくけど――"
10059060-178 = "余計な真似したらただじゃおかないから。"
10059060-179 = "アンタも、先生も。"
10059060-180 = "……ええ。肝に銘じておきます。"
10059060-184 = "さて、これで舞台は整いました。"
10059060-185 = "あとは……先生と評議会の交渉力次第、といったところでしょうか？"
10059060-189 = "いいえ。"
10059060-190 = "これは芸術に携わる私たちの矜持です。"
