[translation]
32060-1 = "제6화;한밤중의 대소동 2"
32060-2 = "……미식연구회?"
32060-3 = "선배, 지금 어디십니까? 빨리 명령을…… 이대로라면 츠루기 선배가 뛰쳐나가 버립니다."
32060-4 = "츠, 츠루기를 일단 막아주세요. 저, 저는 지금 개인적인 용무로 잠깐 밖에……."
32060-5 = "아, 무리무리. 그건 무리입니다. 하스미 선배가 아니면 안 되는 거 알잖습니까."
32060-6 = "앗, 츠루기 선배! 가지 말아주세요! 그쪽은 문이 아니라 벽인데……"
32060-11 = "……가버렸다. 저희도 일단 출격합니다, 선배."
32060-12 = "(철컥)"
32060-13 = "……."
32060-18 = "이 근처인 것 같군. 폭발음으로 볼 때 소요가 발생한 곳은 1km 내외야."
32060-19 = "아, 아우……."
32060-20 = "……여러분."
32060-21 = "급작스럽지만 여러분의 도움이 필요합니다. 저를 도와주시겠어요?"
32060-22 = "지금은 에덴조약을 코앞에 둔 민감한 상황. 이 문제가 정의실현부와 게헨나의 갈등으로 비춰지면 앞으로 불리한 부분이 생겨버립니다."
32060-23 = "여기서는 보충수업부와 <샬레>가 함께 해결해주는 그림이 필요할 것 같네요……. 선생님, 부디……."
32060-24 = "[s] \"알았어. 보충수업부 출동이야.\""
32060-26 = "이해했어. 선생님을 돕는 거라면 문제없어."
32060-27 = "네?! 아, 아우…… 가, 갑자기 싸움인가요……."
32060-28 = "어머나…… 선생님이 그렇게 말씀하신다면야……. 후훗♡"
32060-32 = "아, 나, 나도……? 하스미 선배와 같이……?"
32060-33 = "네. 코하루. 예상보다 더 빨리 함께 임무를 수행하게 되었네요."
32060-34 = "으, 응……! 알겠어요……!"
32060-35 = "그러고보니 선생님의 지휘를 받는 건 이게 처음이네. 나를 마음껏 사용해줘, 선생님."
32060-36 = "어머나……♡"
32060-37 = "[s] \"자, 출발이야!\""
