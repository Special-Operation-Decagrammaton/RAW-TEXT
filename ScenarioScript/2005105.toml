[translation]
2005105-1 = "잘 어울려 레이사"
2005105-2 = "(레이사가 걱정되어서 찾아갔다.)"
2005105-5 = "[ns] \"다행이다, 뭔가 큰일이 난 게 아니라서.\""
2005105-6 = "이 정도로는 이제 놀라거나 궁금해하시지도 않는군요."
2005105-7 = "옷장에 옷을 넣다가, 실수로 겨울 외투에 넣어둔 소이탄이 폭발해서……."
2005105-8 = "허겁지겁 끄긴 했지만……. 옷장의 옷이 전부 젖어버려서…… 아하핫……."
2005105-9 = "마침 세탁소에서 이 옷이 배달오지 않았다면……."
2005105-10 = "집 밖에도 나가지 못할 뻔했습니다……."
2005105-11 = "지금은 새 옷을 사러 가는 길이었습니다!"
2005105-12 = "[s] \"같이 갈래?\""
2005105-13 = "!!"
2005105-14 = "선생님께서 골라주시는 건가요?! 좋습니다!"
2005105-15 = "가, 가시죠! 지금 바로!!"
2005105-18 = "음-"
2005105-19 = "역시 전혀 모르겠네요!"
2005105-20 = "마네킹째로 세트로 사는 게 편하겠네요!"
2005105-21 = "[s] \"패션은 크게 신경 안 쓰는 타입이야?\""
2005105-22 = "장식을 달아서 장식하는 것은 나름 좋아하지만!"
2005105-23 = "어떤 옷이 유행하는지를 잘 몰라서요!"
2005105-24 = "그나마 진열된 그대로 풀세트를 사는 게 실패를 덜 한다 해야 하나……."
2005105-25 = "그러면 일단 이렇게 골라서, 계산을-"
2005105-26 = "어이, 환불이 안 된다니 무슨 소리야!"
2005105-27 = "완전 강매잖냐, 이거!"
2005105-32 = "소, 손님!! 죄송하지만 환불해 드리기 곤란합니다!!"
2005105-33 = "물세탁하면 안 된다고 분명 세탁 태그에 쓰여 있습니다만……."
2005105-34 = "장난하냐, 앙?"
2005105-35 = "그럼 누님이 이 스웨터를 계속 크롭티처럼 입으라는 거냐?"
2005105-36 = "히이익, 무엇보다 영수증도 없으셔서 곤란합니다!!"
2005105-37 = "말로 해선 안 되겠네, 다 박살 내줄까? 앙?"
2005105-38 = "서, 선생님! 이건 말려야 할 것 같은데요……!"
2005105-39 = "하지만, 옷을 갈아입고 오면 늦을 것 같은데……."
2005105-40 = "[s1] \"마법소녀는 이웃을 보호하는 영웅이잖아?\"\n[s2] \"드레스코드가 상황에 딱 맞는걸?\""
2005105-43 = "선생님!"
2005105-44 = "네! 다녀오겠습니다……!"
2005105-45 = "그러면, 후우웁-"
2005105-49 = "삥!! 샤라라라라!! 빠밤빠빠!!!"
2005105-54 = "자경단의 슈퍼스타, 필살의 하트 에이스."
2005105-55 = "우자와 레이사, 등장!!!"
2005105-57 = "뭐, 뭐야 이 녀석은?!"
2005105-58 = "너도 환불하러 온 거냐?"
2005105-59 = "저런 옷도 판다니, 이 가게 대단하구만!!"
2005105-61 = "선량한 시민을 위협하는 당신들을, 용서하지 않겠습니다!"
2005105-62 = "그리고 크롭티, 나름 잘 어울린다고 생각합니다!"
2005105-63 = "뭔 소리를 하는 거야?!"
2005105-64 = "해치워!!"
2005105-73 = "끄에엑……."
2005105-74 = "뭐 이리 무식하게 강해……."
2005105-79 = "정의의 이름으로, 용서하지 않았습니다!"
2005105-80 = "대단하십니다!! 감사합니다!!"
2005105-85 = "진짜 대단했어요, 순식간에 제압하다니!"
2005105-86 = "멋있다! 히어로 같은 건가?"
2005105-87 = "우, 우헤…… 부끄럽군요……."
2005105-88 = "별것 아니었습니다! 모두 안심하고 즐거운 시간 되시기를!"
2005105-94 = "앗, 마법소녀 손님, 실례지만 계산을 안 하셨습니다."
2005105-95 = "태그가 아직 붙어있어서…… 여기서 계산 도와드리겠습니다."
2005105-99 = "어,"
2005105-101 = "네에……!"
2005105-103 = "(부끄러워하는 레이사와 함께 쇼핑을 마쳤다.)"
2005105-104 = "(갈아입은 새 옷이 귀여웠다.)"
