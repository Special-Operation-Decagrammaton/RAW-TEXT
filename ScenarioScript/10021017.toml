[translation]
10021017-9 = "지금 방주의 모든 에너지가 한곳에 모이고 있어요!!"
10021017-10 = "저기에 선생님이 계세요!! 프레나파테스에게 에너지가 집중되는 것 같아요!"
10021017-11 = "우트나피쉬팀의 모든 통신이 불안정해지고 있어!!"
10021017-12 = "저, 저걸 마, 막지 않으면……!!?"
10021017-13 = "이대로 가다간 자폭 시퀀스가……!"
10021017-14 = "더 기다릴 수 없어!! 지금 시퀀스를 기동하지 않으면 모든 게 물거품이 될 거야!!"
10021017-15 = "하지만…… 아직 시퀀스 구축이 완성되지 않았어요. 지금 기동하면 불안정해서……!!"
10021017-16 = "저희가 탈출할 시간을 확보할 수 없을지도 몰라요!"
10021017-17 = "미식연구회와 게임개발부가 지금 관제실에 도착했어요!! 저쪽은 선생님을 지원하며 전투를 벌일 예정이에요!!"
10021017-21 = "……."
10021017-22 = "어, 어떡해? 자폭 버튼을 눌러?"
10021017-23 = "린 선배……."
10021017-24 = "리오 회장."
10021017-28 = "그래. 듣고 있어."
10021017-29 = "다시 확인하겠지만, 당신이 만든 <탈출 시퀀스>는 준비는 끝난 게 맞나요? 사용자가 원할 때 그 즉시 사용할 수 있는 겁니까?"
10021017-30 = "……. 그래. 그렇게 동작해. 방주 내부에 있는 사람을 지상의 좌표로 공간 도약시키는 거니까."
10021017-31 = "이미 시뮬레이션도 몇 번이나 돌려봤어. 그건 문제없어. 탈출 시퀀스의 횟수도 여기 있는 인원수만큼 확보해 뒀어."
10021017-32 = "……선생님까지 23명이니까 23번이겠네요."
10021017-33 = "그래. 총 23번이야."
10021017-34 = "주의할 점은요?"
10021017-36 = "방주의 연산 기능을 이용하는 거라 대상이 방주 안에 있기만 하면 돼. 하지만 방주가 파괴된 뒤에는 사용할 수 없어."
10021017-37 = "즉, 그렇게까지 시간이 많지는 않다는 거군요."
10021017-41 = "……알겠습니다. 지금 당장 할 수밖에 없겠군요."
10021017-42 = "이곳에 있는 모두에게 현 상황을 전달해 주세요. 지금 방주가 폭발할 거니 빠르게 <탈출 시퀀스>를 사용해서 탈출하라고!"
10021017-43 = "네, 네!! 제가 전달할게요!"
10021017-44 = "그럼…… 아트라하시스의 방주 <자폭 시퀀스>, 기동합니다!!"
10021017-46 = "(꾸욱) 자폭 시퀀스, 기동."
10021017-53 = "우와아아아앗-!!!"
10021017-54 = "꺄악?!"
10021017-55 = "아직, 아직이에요! 곧 더 큰 폭발이 올 거예요!"
10021017-56 = "우트나피쉬팀도 같이 터질 거야! 이제 거기서 도망쳐!! <탈출 시퀀스>를 사용해!!"
10021017-60 = "꺄악-?!"
10021017-64 = "아코?! 괜찮아?"
10021017-65 = "위에서 떨어진 파편에 발이 끼어서……."
10021017-66 = "있어 봐. 내가 도와줄 테니……."
10021017-67 = "카, 카요코 씨……."
10021017-68 = "끄으……."
10021017-72 = "……됐어. 빨리 탈출해."
10021017-76 = "……고마워요, 카요코 씨. 그럼 지상에서."
10021017-79 = "남은 탈출 시퀀스 - 23회"
10021017-83 = "남은 탈출 시퀀스 - 22회"
10021017-86 = "……아코는 탈출 완료. 좋아, 이런 느낌인가."
10021017-87 = "그럼 나도. 나머지도 빨리 탈출해!!"
10021017-91 = "남은 탈출 시퀀스 - 21회"
10021017-93 = "좋아, 아코와 카요코까지 탈출 완료!! 다들 서둘러!"
10021017-97 = "우, 우와아- 우리도 빨리!"
10021017-98 = "선배! 얼른 탈출을!!"
10021017-99 = "……저는 제일 마지막에 탈출하겠습니다. 여러분 먼저 탈출하세요."
10021017-100 = "린 선배?"
10021017-101 = "아직 선생님이 저기서 싸우고 있어요. 프레나파테스가 또 무슨 일을 벌일지 모르니…… 저는 여기에 남아 마지막까지 선생님을 돕겠습니다."
10021017-102 = "서, 설마 이상한 생각하는 건 아니지?"
10021017-103 = "제가 그럴 리가 없잖습니까. 선생님과 함께 같이 탈출할 테니, 두 분 다 먼저 내려가 계세요."
10021017-107 = "그, 그럼 알았어! 조금 있다가 봐!"
10021017-108 = "네! 그럼 지상에서……!!"
10021017-113 = "남은 탈출 시퀀스 - 20회"
10021017-117 = "남은 탈출 시퀀스 - 19회"
10021017-119 = "히마리 씨, 저희도!"
10021017-120 = "네. 그 전에…… 린 씨?"
10021017-124 = "아리스가 생성한 방주…… 아니, <빛의 검: 아트라하시스의 슈퍼 노바>를 손봐뒀어요."
10021017-125 = "우트나피쉬팀의 에너지와 연동해 두었으니, 한 번 정도는 사용할 수 있을 거예요. 출력은 그때의 15% 정도지만 그래도 혹시 모르니까요."
10021017-126 = "빛의…… 그 이름으로 결정입니까?"
10021017-127 = "어머? 멋진 이름이지 않나요?"
10021017-128 = "……그냥 주포라고 부르겠습니다."
10021017-129 = "흐응…… 재미없게."
10021017-134 = "이제 가야 해요. 그럼, 린 씨. 조심하세요."
10021017-135 = "……네. 고맙습니다, 하나코 씨. 히마리 씨."
10021017-139 = "남은 탈출 시퀀스 - 18회"
10021017-143 = "남은 탈출 시퀀스 - 17회"
10021017-145 = "자, 그럼 아야네도."
10021017-146 = "아뇨. 저도…… 린 씨와 함께 마지막까지 있겠어요."
10021017-147 = "……아아, 그렇네. 아직 대책위원회가 저기서 싸우고 있으니."
10021017-148 = "네. 그리고…… 저 시로코 선배…… 라고 해야 할까 저 사람을 끝까지 지켜보지 않으면……."
10021017-149 = "그래, 알겠어! 게임개발부도 거기 있으니까, 뒤를 부탁할게!"
10021017-150 = "네!"
10021017-156 = "남은 탈출 시퀀스 - 16회"
10021017-159 = "린 씨! 그럼 이후는……!"
10021017-160 = "네. 저희는 선생님의 전투를 지원합니다!"
10021017-162 = "선생님! 그리고 대책위원회 모두와 게임개발부와 미식연구회!"
10021017-163 = "들리나요? 이쪽은 전부 탈출 완료했어요! 방주도 곧 완전히 파괴될 거예요!!"
10021017-164 = "<탈출 시퀀스>가 준비되었으니 빨리 탈출 부탁드립니다! 저희도 곧 탈출할 거예요!!"
10021017-165 = "……이해했습니다. 그럼 우선 탈진해서 뻗어버린 후우카 씨부터."
10021017-170 = "남은 탈출 시퀀스 - 15회"
10021017-175 = "이곳은 저와 린 씨를 제외하곤 전원 탈출 완료했습니다! 이제 선생님과 그곳의 학생들만 남았어요!"
10021017-176 = "곧 방주가 최종 폭발을 일으킬 거예요……!! 조심하세요, 선생님!!"
10021017-177 = "……여전히 프레나파테스에게 방주의 모든 에너지가 집중되고 있습니다."
10021017-178 = "무슨 짓을 하려는지는 모르겠지만, 저 에너지 규모라면 방주가 우주까지 튕겨져 나갈지도 모릅니다."
10021017-179 = "저걸 그대로 둬선 안 됩니다. 지금 당장 프레나파테스를 막아야 합니다!"
10021017-181 = "선생님! 마지막 싸움을 부탁드립니다!!"
