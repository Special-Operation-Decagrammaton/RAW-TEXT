1014803-67 = ""
1014803-68 = ""
1014803-69 = "[ns11] 「……就這樣？」\n[ns12] 「可以多點一些啊？」"
1014803-72 = "唔嗯……很感謝你的好意，不過我就心領了。"
1014803-73 = "我不太餓，而且也帶了洋芋片當點心。"
1014803-74 = "還有……"
1014803-75 = ""
1014803-77 = ""
1014803-79 = "偷偷跟你說，我其實不太喜歡在這種地方買東西吃。"
1014803-81 = "您點的冰咖啡來了！"
