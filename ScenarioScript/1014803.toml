[translation]
1014803-1 = "出遊少女與意外的邂逅"
1014803-2 = ""
1014803-3 = "[ns1] 「哼，哼，哼！」\n[ns2] 「你慌張的表情真好看！」"
1014803-6 = "……啊，是。嗯。應該是吧？"
1014803-7 = "不管是誰，突然被拖到海邊來應該都會……"
1014803-8 = "你該不會就為了看這個，才把我帶來這裡的吧？"
1014803-9 = "[s3] 「難得放暑假嘛。」\n[s4] 「跟平常一樣度過太可惜了！」"
1014803-12 = "看你二話不說就把我拉出來，我還在想老師該不會打算……"
1014803-13 = "……"
1014803-14 = "不，可是為什麼會是虎丸？"
1014803-15 = "唯獨這個完全扯不上關係吧？"
1014803-16 = "[s5] 「嗯？那是因為……說到海就是戰車……」\n[s6] 「說到夏天的海就是戰車，這是常識吧？」"
1014803-19 = "那是什麼只有長翅膀的傢伙才會說的蠢話……"
1014803-20 = "……不過，既然都糊里糊塗地來到海邊了。"
1014803-21 = ""
1014803-23 = ""
1014803-24 = "就這樣回去確實很可惜呢。"
1014803-25 = "好吧。今天一天，我就配合老師的心血來潮吧。"
1014803-27 = "（過了一陣子……）"
1014803-28 = ""
1014803-29 = "……"
1014803-30 = ""
1014803-32 = ""
1014803-33 = "……"
1014803-34 = "[s7] 「那個，這裡是海邊耶……」\n[s8] 「只顧著看書，不就跟在夏萊一樣嗎？」"
1014803-37 = "是嗎？我倒覺得差很多。"
1014803-38 = "在這種地方看書，可是別有一番滋味哦？"
1014803-39 = "難道你以為我會去玩水……看你的表情，似乎是這樣呢。"
1014803-40 = "抱歉，這麼好的閱讀地點可不多見。#n難得來一趟，我想再多享受一下。"
1014803-41 = "……"
1014803-42 = ""
1014803-44 = ""
1014803-45 = ""
1014803-46 = "……"
1014803-47 = "[s9] 「你會不會餓？或是口渴？」\n[s10] （得在他又進入閱讀模式之前……！）"
1014803-48 = ""
1014803-49 = ""
1014803-51 = ""
1014803-52 = "……也對，畢竟我說過今天一天都會配合老師了。"
1014803-53 = ""
1014803-55 = ""
1014803-56 = "要去隨便逛逛嗎？"
1014803-58 = ""
1014803-59 = "歡迎光臨！要來點什麼嗎！"
1014803-60 = "哦，東西還真多呢。"
1014803-61 = ""
1014803-63 = ""
1014803-64 = "……那麼，我要一杯冰咖啡。"
