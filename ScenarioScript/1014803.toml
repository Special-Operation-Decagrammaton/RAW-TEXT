[translation]
1014803-1 = "นักท่องเที่ยวหญิงกับการหวนพบที่ไม่คาดคิด"
1014803-2 = ""
1014803-3 = "[ns1] \"ฮุ ฮุ ฮุ\"\n[ns2] \"สีหน้าตกใจแบบนั้นดูดีจริงๆ!\""
1014803-6 = "อ่า ค่ะ ก็... คงอย่างนั้นสินะคะ?"
1014803-7 = "ไม่ว่าใคร ถ้าจู่ๆ ถูกลากมาทะเล ก็คง..."
1014803-8 = "อย่าบอกนะคะว่าพามาถึงนี่ เพราะแค่อยากเห็นสีหน้าแบบนั้น?"
1014803-9 = "[s3] \"อุตส่าห์ได้หยุดพักร้อนทั้งทีนี่นา\"\n[s4] \"ใช้เวลาเหมือนทุกวันก็เสียดายแย่สิ!\""
1014803-12 = "จู่ๆ ก็ลากออกมา ฉันเลยนึกว่าคุณครูจะทำอะไรเสียอีก..."
1014803-13 = "..."
1014803-14 = "แต่ว่า ทำไมต้องโทระมารุด้วยล่ะคะ?"
1014803-15 = "โทระมารุไม่เกี่ยวกับเรื่องนี้เลยสักนิดไม่ใช่เหรอคะ?"
1014803-16 = "[s5] \"หืม? ก็... มาทะเลก็ต้องรถถังสิ...\"\n[s6] \"พูดถึงทะเลหน้าร้อนก็ต้องรถถัง ใครๆ ก็รู้นี่นา?\""
1014803-19 = "ว่าไงนะ...? พูดอะไรเหลวไหลเหมือนที่พวกมีขนนกชอบพูดเลย..."
1014803-20 = "แต่ก็มาถึงทะเลแบบงงๆ แล้ว..."
1014803-21 = ""
1014803-23 = ""
1014803-24 = "จะกลับไปเลยแบบนี้ก็น่าเสียดายอยู่นะคะ"
1014803-25 = "ก็ได้ค่ะ วันนี้ฉันจะตามใจคุณครูแล้วกัน"
1014803-27 = "(ผ่านไปสักพัก...)"
1014803-28 = ""
1014803-29 = "..."
1014803-30 = ""
1014803-32 = ""
1014803-33 = "..."
1014803-34 = "[s7] \"เอ่อ นี่อยู่ชายหาดนะ จะทำเหมือนตอนอยู่ชาเล่ต์เหรอ...\"\n[s8] \"ถ้าเอาแต่อ่านหนังสือ ก็ไม่ต่างจากตอนอยู่ชาเล่ต์เลยไม่ใช่เหรอ?\""
1014803-37 = "เหรอคะ? ฉันว่าต่างกันพอสมควรเลยนะคะ"
1014803-38 = "อ่านหนังสือในที่แบบนี้ มันได้ความรู้สึกพิเศษค่ะ"
1014803-39 = "หรือว่าคิดว่าฉันจะลงเล่นน้ำ... ดูจากสีหน้าแล้ว คงคิดแบบนั้นสินะคะ"
1014803-40 = "ขอโทษด้วยค่ะ แต่สถานที่อ่านหนังสือดีๆ แบบนี้หาไม่ได้ง่ายๆ มีโอกาสทั้งที ฉันก็อยากดื่มด่ำ#nกับมันอีกสักหน่อยค่ะ"
1014803-41 = "..."
1014803-42 = ""
1014803-44 = ""
1014803-45 = ""
1014803-46 = "..."
1014803-47 = "[s9] \"รู้สึกหิวบ้างมั้ย? คอแห้งหรือเปล่า?\"\n[s10] (ก่อนจะกลับเข้าโหมดอ่านหนังสืออีก...!)"
1014803-48 = ""
1014803-49 = ""
1014803-51 = ""
1014803-52 = "อืม... นั่นสินะคะ ไหนๆ ก็บอกไว้แล้วว่าวันนี้ฉันจะตามใจคุณครู"
1014803-53 = ""
1014803-55 = ""
1014803-56 = "งั้นไปเดินดูอะไรสักหน่อยมั้ยคะ?"
1014803-58 = ""
1014803-59 = "ยินดีต้อนรับครับ! รับอะไรดีครับ!"
1014803-60 = "โอ้ มีหลายอย่างเลยนะคะ"
1014803-61 = ""
1014803-63 = ""
1014803-64 = "ถ้างั้น... ฉันขอกาแฟเย็นค่ะ"
1014803-65 = ""
1014803-67 = ""
1014803-68 = ""
1014803-69 = "[ns11] \"สั่งแค่นั้นเองเหรอ...? สั่งเพิ่มได้นะ\"\n[ns12] \"สั่งอย่างอื่นด้วยก็ได้นะ?\""
1014803-72 = "อืม... ขอบคุณที่เสนอให้นะคะ แต่ฉันขอไม่รับดีกว่าค่ะ"
1014803-73 = "ฉันไม่ค่อยหิวเท่าไร แล้วก็เตรียมมันฝรั่งทอดไว้กินเป็นของว่างแล้วด้วย"
1014803-74 = "แล้วก็..."
1014803-75 = ""
1014803-77 = ""
1014803-79 = "เรื่องนี้ขอให้รู้กันแค่เรานะคะ ฉันไม่ค่อยชอบซื้อของกินจากร้านแบบนี้เท่าไรค่ะ"
1014803-81 = "กาแฟเย็นที่สั่งได้แล้วครับ!"
1014803-82 = ""
1014803-85 = ""
1014803-86 = ""
1014803-87 = ""
1014803-88 = "อะแฮ่ม..."
1014803-89 = "เอาเป็นว่า ฉันขอแค่กาแฟแล้วกันค่ะ ขอบคุณค่ะ"
1014803-91 = "(หลังจากนั้นคุณครูก็เดินเที่ยวชมที่ต่างๆ ตามชายหาดกับอิโรฮะ)"
1014803-92 = "(แล้วก็...)"
1014803-95 = "..."
1014803-96 = ""
1014803-98 = ""
1014803-99 = "..."
1014803-100 = "[s13] \"ก็เหมือนเมื่อกี้เลยนี่...?\"\n[s14] \"สุดท้ายก็อ่านหนังสือสินะ\""
1014803-103 = "คะ? ไม่เหมือนสักหน่อยค่ะ"
1014803-104 = "ต่างจากเมื่อกี้ตรงที่มีกาแฟเย็น ได้ห่วงยางขนาดพอดีไว้รองหนังสือ แล้วก็เช่าร่มชายหาดคันใหญ่มา#nด้วยค่ะ"
1014803-105 = "ตอนแรกฉันคิดว่าจะยุ่งยาก แต่พอได้มาจริงๆ ก็ถูกใจมากกว่าที่คิดนะคะ"
1014803-106 = ""
1014803-108 = ""
1014803-110 = "(แล้วคุณครูก็นอนอ่านหนังสืออย่างเพลิดเพลินบนชายหาดกับอิโรฮะจนพระอาทิตย์ตก)"
