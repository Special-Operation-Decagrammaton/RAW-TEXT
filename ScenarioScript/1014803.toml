[translation]
1014803-1 = "アウスフルークレリンと特別な夏休み"
1014803-3 = "[ns1] \"ふっふっふっ！\"\n[ns2] \"してやったり！\""
1014803-6 = "……先生が楽しそうでなによりです。"
1014803-7 = "まさか、そのまま海に連れてこられるだなんて……。"
1014803-8 = "もう目的は達成した、なんて言いませんよね？"
1014803-9 = "[s3] \"せっかくの夏休みなんだから。\"\n[s4] \"特別なことをしなきゃ！\""
1014803-12 = "やけに張り切ってるなとは思いましたが……。"
1014803-13 = "そういうことですか……。"
1014803-14 = "それで。どうして[ruby=とらまる]虎丸[/ruby]を？"
1014803-15 = "海には関係ないのでは？"
1014803-16 = "[s5] \"いや？\"\n[s6] \"夏の海と言えば戦車！常識でしょ？\""
1014803-19 = "羽が生えたやつらみたいなことを……。"
1014803-20 = "まあ、せっかく来たんですし。"
1014803-24 = "このまま帰るのは、もったいないですね。"
1014803-25 = "今日ぐらいは、付き合ってあげますよ。"
1014803-27 = "（しばらくして……）"
1014803-29 = "……。"
1014803-33 = "……。"
1014803-34 = "[s7] \"海にいるのに……。\"\n[s8] \"それだといつもと同じじゃない？\""
1014803-37 = "全然違うと思いますけど。"
1014803-38 = "同じ読書だって、場所が違えば特別になります。"
1014803-39 = "そもそも、私が水遊びをするとでも――思ってたんですね。"
1014803-40 = "せっかくですが、このまま満喫していようかと。#nこんな場所で本を読むなんてそうないですから。"
1014803-41 = "……。"
1014803-46 = "……。"
1014803-47 = "[s9] \"お腹空かない？喉渇いてない？\"\n[s10] （読書に集中しちゃう前に……！）"
1014803-52 = "……はぁ。今日は付き合うと言いましたし。"
1014803-56 = "散策くらいはしましょうか。"
1014803-59 = "らっしゃい！"
1014803-60 = "いろいろありますね。"
1014803-64 = "……ではアイスコーヒーを。"
1014803-69 = "[ns11] \"……それだけ？\"\n[ns12] \"もっと頼んでもいいよ。\""
1014803-72 = "いえ、大丈夫です。"
1014803-73 = "お腹は空いてませんし、戻ればポテトチップスがあるので。"
1014803-74 = "それに――"
1014803-79 = "こういう所で食べるのは……あまり好みではなくて。"
1014803-81 = "はいっ、アイスコーヒーね！"
1014803-88 = "……どうも。"
1014803-89 = "これで十分ですよ。"
1014803-91 = "（その後も散策を続けた）"
1014803-92 = "（そして……）"
1014803-95 = "……。"
1014803-99 = "……。"
1014803-100 = "[s13] \"読書に戻っちゃった……。\"\n[s14] \"さっきと同じだよね？\""
1014803-103 = "全然違いますよ。"
1014803-104 = "アイスコーヒー。手を置くのにちょうどいい浮き輪。#nそれに大きなパラソルまでありますから。"
1014803-105 = "これはこれで、意外に良いですね。"
1014803-110 = "（日が沈むまで、イロハと一緒に読書を楽しんだ）"
