1014803-100 = "[s13] 「……這不是跟剛才一樣嗎？」\n[s14] 「結果還是在看書啊。」"
1014803-103 = "咦？才沒有呢。"
1014803-104 = "現在有冰咖啡，還借到了大小剛好能墊書的游泳圈和大遮陽傘。"
1014803-105 = "哎呀，本來還覺得很麻煩，結果真的來了之後倒是比想像中還滿意呢。"
