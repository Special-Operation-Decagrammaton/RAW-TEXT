[translation]
1014803-1 = "아우스플뤼글러린과 뜻밖의 해후"
1014803-3 = "[ns1] \"훗. 훗. 훗!\"\n[ns2] \"당황한 표정이 보기 좋구나!\""
1014803-6 = "……아, 네. 뭐. 그렇겠죠?"
1014803-7 = "누구라도 다짜고짜 바다에 끌려오면, 그야……."
1014803-8 = "설마 그거 하나 보자고, 여기까지 데려온 건가요?"
1014803-9 = "[s3] \"모처럼 여름휴가잖아.\"\n[s4] \"평소랑 똑같이 보내는 건 아깝지!\""
1014803-12 = "……대뜸 끌고 나가시길래, 선생님께서 설마하고 생각했더니……."
1014803-13 = "……."
1014803-14 = "아니, 그래도 왜 토라마루인가요?"
1014803-15 = "이것만큼은 아무런 연관성도 없지 않나요?"
1014803-16 = "[s5] \"응? 그야…… 바다에는 전차고…….\"\n[s6] \"여름 바다하면 전차, 상식이잖아?"
1014803-19 = "뭔……? 무슨 깃털 달린 녀석들이나 할 법한 얼빠진 소릴……."
1014803-20 = "……그래도, 어영부영 바다까지 왔고."
1014803-24 = "이대로 그냥 돌아가는 것은, 확실히 아깝네요."
1014803-25 = "좋습니다. 오늘 하루 정도는, 선생님의 변덕에 맞춰 드릴게요."
1014803-27 = "(잠시 후…….)"
1014803-29 = "……."
1014803-33 = "……."
1014803-34 = "[s7] \"저기요, 해변인데요…….\"\n[s8] \"책만 읽는 건, 샬레에서랑 똑같지 않아?\""
1014803-37 = "그래요? 저는 꽤 다르다고 생각하는데."
1014803-38 = "이런 장소에서 독서는 꽤 각별하다고요?"
1014803-39 = "아니면 설마 제가 물놀이라도 할 줄…… 아셨나 보네요. 그 표정을 보니."
1014803-40 = "죄송하지만, 이렇게 좋은 독서 스팟은 좀처럼 없어서요. 모처럼이니까 좀 더 만끽해 두려고요."
1014803-41 = "……."
1014803-46 = "……."
1014803-47 = "[s9] \"혹시 출출하지 않아? 목마르거나?\"\n[s10] (다시 독서 모드로 들어가기 전에……!)"
1014803-52 = "……뭐, 그렇네요. 오늘 하루는 선생님에게 맞춰드린다고 했으니까요."
1014803-56 = "뭐라도 구경하러 가볼까요?"
1014803-59 = "어서 옵쇼! 뭐로 드릴까요!"
1014803-60 = "오, 여러가지가 있네요."
1014803-64 = "……그러면, 저는 아이스 커피로 부탁할게요."
1014803-69 = "[ns11] \"……그게 끝?\"\n[ns12] \"이것저것 주문해도 되는데?\""
1014803-72 = "음…… 모처럼의 감사한 제안이지만, 사양하도록 할게요."
1014803-73 = "별로 배도 안 고프고, 간식으로 감자칩도 챙겨뒀고."
1014803-74 = "그리고……."
1014803-79 = "이건 저희끼리 얘기지만, 이런 곳에서 뭘 사 먹는 건 별로 안 좋아해서요."
1014803-81 = "주문하신 아이스 커피 나왔습니다!"
1014803-88 = "……흠흠."
1014803-89 = "아무튼, 커피만 받을게요. 감사합니다."
1014803-91 = "(이후에도 이로하와 함께 해변의 여러 장소를 구경하러 다녔다.)"
1014803-92 = "(그리고…….)"
1014803-95 = "……."
1014803-99 = "……."
1014803-100 = "[s13] \"……아까랑 똑같지 않아?\"\n[s14] \"결국, 독서인가.\""
1014803-103 = "네? 그렇지 않아요."
1014803-104 = "아까랑 다르게 아이스 커피도 있고, 책받침으로 딱 좋은 사이즈의 튜브도 구했고, 커다란 파라솔도 빌렸고."
1014803-105 = "이야, 귀찮다고 생각했는데, 막상 생각보다 만족스럽네요."
1014803-110 = "(해가 질 때까지 이로하와 함께 해변에 누워 독서를 즐겼다.)"
