[translation]
10038040-1 = "제4화;과거와 현재를 나누는 경계"
10038040-7 = "어째서, 이런……!"
10038040-8 = "어지러워……. 숨이, 숨이 잘 쉬어지지 않아……!"
10038040-12 = "……."
10038040-13 = "잠시들 쉬고 있어라. 생명에는 지장이 없는 이향(異香)이니."
10038040-18 = "이런 식으로, 돌아온 건가……!"
10038040-19 = "사야 부장이 없는 사이에, 이런 흉계를……."
10038040-28 = "산천은 의구한데, 인걸은 간데없으니."
10038040-29 = "거리는 비었고, 사람의 그림자는 보이지 않는구나."
10038040-30 = "쿡쿡쿡쿡……."
10038040-35 = "준비가 끝났습니다."
10038040-36 = "산해경, 그리고 연단방……."
10038040-37 = "마침내, 돌아왔구나."
10038040-38 = "초라한 환영을 용서해 주십시오."
10038040-39 = "상관없다. 그러면 가 볼까."
10038040-46 = "아아, 그리웠다. 나의 연단방."
10038040-47 = "모든 것이 변했어도, 이곳만은 변치 않았구나."
10038040-48 = "이제 어떻게 하시겠습니까. '그 곳'으로 곧장 향하시겠습니까?"
10038040-49 = "그렇게 하자. 처음부터 목적은 그것뿐이었으니."
10038040-50 = "알겠습니다. 안내해 드리겠습니다."
10038040-56 = "이곳은 잘 지켜지고 있었던 모양이구나."
10038040-57 = "예. 문제는 없었습니다. 단지 야쿠시 사야가 눈치채지 못하도록 하는 것이, 조금 어려운 일이었죠."
10038040-58 = "쿡쿡쿡……. 그 아이는 원래 눈치가 빨랐으니 말이다. 그럴 법도 하지."
10038040-59 = "아니, 여기에서는 그런 사야에게까지 이 시설을 감추고 있었던 너의 수완이 대단했던 것이었다고 해야 할까?"
10038040-60 = "과찬이십니다."
10038040-61 = "……마침내, 돌아왔구나."
10038040-62 = "진정한 연단방 그 자체라고 할 수 있는 곳. 나의 모든 결정체가 담겨 있었던 이 자리……."
10038040-64 = "마음껏 사용하시길 바랍니다. 연단방은 이제 다시 카이 님의 것입니다."
10038040-65 = "모든 약재와 시설은, 카이 님께서 산해경을 떠나셨을 때와 마찬가지로 보존해 두었습니다."
10038040-67 = "수고가 많았다. 그러면 움직여 보도록 할까."
10038040-71 = "쭉 멈추어 있었던, 선단(仙丹)의 완성을 향해서."
10038040-79 = "헉, 헉……!"
10038040-80 = "벌써 숨이 차면 어떡합니까. 그러고도 현룡문의 집행부장인가요?"
10038040-81 = "뭐, 예전에도 본 모습이니 익숙하기는 합니다만."
10038040-82 = "시, 시끄러워! 밤중에 갑자기 불려 나온 거잖나! 어쩔 수 없다고!"
10038040-83 = "아니, 그건 저도 마찬가지입니다만……."
10038040-84 = "으으음. 그렇다고는 해도 문주님께서는 무슨 생각이신 거지……. 왜 현무상회의…… 그것도 하필이면 이 녀석과 같이 일을 집행하라고 하신 건지……."
10038040-85 = "다 들리지 말입니다……. 그보다, 문주님의 명령도 따르지 않는 현룡문의 집행부장이 될 생각입니까?"
10038040-86 = "그 소리를 다른 누구도 아닌 너한테 듣고 싶지는 않다!"
10038040-90 = "우리가 하달받은 것은 연단방이 습격당했다는 소식뿐이다. 구체적으로 어떤 일이 일어나고 있는지는 알지 못해."
10038040-91 = "그렇다고는 해도, 도착한 것 같군요. 어째 평소와는 분위기가……."
10038040-100 = "……많이, 다른 듯합니다."
10038040-101 = "저건…… 산해경에서는 보일 리 없는, 블랙마켓의 용병들? 왜 저런 것들이 연단방에……?!"
10038040-108 = "아프잖아, 이 자식들아!"
10038040-109 = "어떤 의미에서는 전개가 빨라서 좋군요. 머리를 가볍게 해 주는 친구들입니다."
10038040-110 = "……솔직히 말해. 너 머리에 든 거 뇌가 아니라 근육이지."
10038040-111 = "……최소한 그 속을 느와르 영화로 구겨 넣지는 않았는데 말입니다."
10038040-115 = "이 녀석들이……."
10038040-121 = "……방해하지 마라. 사람이 이야기하는 중이잖냐!"
10038040-132 = "정문으로부터의 보고입니다. 습격이 시작되었다고 합니다."
10038040-137 = "블랙마켓에서 고용한 병력을 경비로 세워 두었을 터. 최대한 시간을 끌어 보아라."
10038040-138 = "예. 이미 그렇게 하는 중입니다."
10038040-139 = "(……그렇지만, 산해경에 외부 병력을 들이는 것이 과연 맞는 일일까…….)"
10038040-140 = "……불안한 모양이구나. 쿡쿡쿡……."
10038040-144 = "아, 아닙니다. 저는……!"
10038040-145 = "때로는 혼돈이 발전을 불러오는 법이지. 마치 약재들의 화학작용이 그러하듯이."
10038040-146 = "산해경에는 그동안 그것이 부족했다. 지나칠 정도로 말이야."
10038040-147 = "머물러 있어서는 나아갈 수 없는 법이니, 때로는 바깥으로부터의 큰 울림이 필요하다."
10038040-152 = "……."
10038040-153 = "그리 오래 걸리지는 않을 것이야. 1차 선단(仙丹)의 제조는……. 그렇군. 몇 시간 정도면 결과가 도출된다."
10038040-154 = "그렇게 빠르게 완성하실 수 있었던 것을, 왜 그동안에는……?"
10038040-155 = "이런, 너도 모르고 있었느냐. 어쩔 수 없지. 알려주도록 하마."
10038040-159 = "이 선단(仙丹)은, 키보토스에서도 이곳에서만 만들어질 수 있는 것이기 때문이다."
10038040-160 = "그건…… 입지나 풍수, 그런 이유 때문입니까?"
10038040-161 = "아니. 연단방의 역사가 담긴 약재들과 비법들이 보존된 것은, 이곳이 유일하기 때문이지."
10038040-162 = "거기에, 만년삼을 가장 천연의 상태 그대로 구할 수 있는 곳 역시 이곳 뿐이기도 하고."
10038040-166 = "사야는 그것을 제대로 이어받지 못한 모양이지만 말이다. 쿡쿡쿡……."
10038040-174 = "대강 물리쳤나……?"
10038040-179 = "……우리가 상대한 것은, 선봉대였던 모양입니다."
10038040-187 = "……불쾌하군."
10038040-188 = "어떻게 이 정도의 외부 세력이, 감히 아무도 모르게 산해경에 들어올 수 있었다는 건가!"
10038040-189 = "그건…… 현룡문이 현무상회뿐만 아니라, 산해경의 전반적인 분위기와 출입을 통제한 탓도, 조금은 있지 않습니까?"
10038040-193 = "어…… 음……. 거 뒤끝이 너무 심하네! 상회 거리 며칠 통제한 것 가지고!"
10038040-194 = "상회 입장이 되어 보라고요! 하루만 일을 쉬어도 적자가 얼마인데!"
10038040-200 = "이건 어쩔 수 없겠군."
10038040-201 = "적어도 연단방 내부에 무슨 일이 생겼다는 것은 확실해 보입니다."
10038040-205 = "강행 돌파다. 따라올 수 있겠나?"
10038040-209 = "그쪽이야말로, 뒤처지지 말아 주었으면 하는데요."
10038040-214 = "핫. 자신만만하구만. 좋아!"
