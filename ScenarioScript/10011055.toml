[translation]
10011055-2 = "응~ 모두 수고했어~ 정석대로 통과한 건 아니지만……."
10011055-3 = "선생님의 지휘로 어트랙션을 뚫는 것도…… 후아암~ 아슬아슬하게…… 통과……니까."
10011055-4 = "그, 그렇다는 건…… 지나가도 된다는 거야?"
10011055-5 = "응. 다음 어트랙션 방향은~ 쭉 직진해서 오른쪽이야~"
10011055-6 = "그나저나 방송에서도 그렇고- 인법연구부라고 했었-지?"
10011055-7 = "아, 그, 그건-"
10011055-8 = "응. 닌자란 건 굉장하네."
10011055-10 = "아……."
10011055-11 = "……!"
10011055-12 = "네! 닌자는! 굉장해요!"
10011055-14 = "그럼 나는 이만~ 바이바이~ 선생님이랑 모두~ 힘내~!"
10011055-17 = "부, 부장님. 방금 그 말……"
10011055-18 = "……다른 학생에게, 듣는 건…… 처음, 일지도……."
10011055-19 = "당연한 거지만요! 닌자는 정말 대단하니까! 그쵸. 주군?!"
10011055-20 = "[s] \"응, 그러게. 닌자는 대단해.\""
10011055-21 = "……."
10011055-22 = "자, 그럼 다음으로 가죠. 지금 이러고 있는 동안에도 점점 멀어지고 있을 거예요."
10011055-23 = "우냐악! 조, 좋아! 가자!"
