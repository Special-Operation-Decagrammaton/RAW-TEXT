[translation]
70002020-1 = "키라라와 에리카의 반짝반짝한 하루 2"
70002020-5 = "야호! 반가워!"
70002020-6 = "여기가 만마전 휴게실이 맞을까나?"
70002020-7 = "체험 입부가 가능하다고 해서 왔는데."
70002020-15 = "……왔는가."
70002020-16 = "대 게헨나 학원의 학생회장인 이 몸의 영광을 직접 체험하고 싶다는 자가……!"
70002020-17 = "만마전을 찾아온 것을 환영한다!"
70002020-22 = "응? 잘 모르겠지만, 인사하는 거 맞지?"
70002020-23 = "그런 것 같은데."
70002020-24 = "그러는 당신은, 만마전의 접객 담당이야?"
70002020-26 = "뭣……?! 접객 담당……?!"
70002020-27 = "이 마코토 님의 얼굴을 영접하고도 그런 말을……?!"
70002020-28 = "이 몸은 판데모니움 소사이어티의 영원불멸한 리더! 추후 키보토스를 손에 넣을 가장 위대한 지도자인 마코토 님이시다!"
70002020-29 = "응~ 그래~?"
70002020-30 = "뭔가, 갑자기 엄청 흥미 없다는 얼굴을……."
70002020-31 = "아니……. 아니지. 아직 천지 분간도 하지 못하는 신입의 태도에 일일이 휘둘려서야 쓰나."
70002020-32 = "흠흠. 다시 처음으로 돌아가 정리하자면……."
70002020-33 = "키키킷……! 우리 만마전의 활동을 체험하고 싶다고 했었던가."
70002020-34 = "그야말로 잘 생각했다. 키라라, 그리고 에리카여!"
70002020-35 = "응? 의장님이 우리 이름을 알아?"
70002020-36 = "키시싯. 당연하지 않느냐."
70002020-37 = "우리 만마전으로 직접 찾아와, 심지어 체험 입부까지 하고 싶다 생각하는 갸륵한 정성을 가진 녀석들의 이름을 외우는 것쯤이야."
70002020-38 = "이 마코토 님에겐 아무것도 아닌 법……."
70002020-39 = "크크큭…… 그래. 너희도 꾸준히 정진하여 노력만 한다면, 추후 우리 만마전의 차기 간부가 될 가능성도 충분히……"
70002020-40 = "아, 거기까지는 관심 없는데."
70002020-41 = "뭣?!"
70002020-42 = "크읏. 과연, 거기까진 아직 시간이 필요하다. 이것인가."
70002020-43 = "그래…… 너무 가벼운 것보다는 진중하고 무겁게 움직이는 것 또한, 올바른 지도자로서 갖춰야 할 덕목일 테지……."
70002020-44 = "그래……. 거기까지 내다보고 있던 것인가, 요자쿠라 키라라……!"
70002020-45 = "그런 생각까진 안 했을 텐데 말이야."
70002020-48 = "네, 어서 오세요. 여러분의 체험 입부 환영합니다."
70002020-49 = "그나저나 체험 입부라니, 엄청나게…… 드문 일이긴 하네요."
70002020-51 = "응응! 고마워! 보통 만마전에서는 무슨 일을 해?"
70002020-52 = "우리 게헨나 학원의 학생회 같은 역할을 맡고 있으니까."
70002020-53 = "으음, 학원의 예산 처리라거나, 여러 서류 업무 같은 것이려나?"
70002020-55 = "말씀대로 그런 일도 없는 건 아니에요."
70002020-56 = "그래도 주 업무는 게헨나의 얼굴로서 대외 업무를 진행한다거나 외부 거래 업체와의 계약을 진행한다거나……하는 게 있지만."
70002020-57 = "어째…… 그런 일보다 더 시간을 쏟는 것이, 보통 마코토 선배가 벌려 놓은 일의 뒷처리를 하는 게 아닌가 하는 자괴감도 잔뜩……."
70002020-58 = "…………지그시."
70002020-59 = "응? 뭐냐. 이로하. 이 몸의 얼굴에 뭐가 묻기라도 했느냐?"
70002020-60 = "아뇨…… 아무것도 아니에요. 하아……."
70002020-62 = "뭐…… 그쪽도 나름 고생, 이려나?"
70002020-66 = "다녀왔습니다~!"
70002020-67 = "어라? 귀가부 언니들?"
70002020-69 = "오잉?"
70002020-70 = "이부키 쨩! 안녕!"
70002020-71 = "안녕. 이부키. 또 만났네."
70002020-72 = "와아! 언니들! 반가워! 놀러 온 거야?"
70002020-73 = "오늘은 이부키 쨩이 있는 만마전에 체험 입부! 뭐어, 놀러 온 거나 마찬가지랄까!"
70002020-74 = "정말?! 환영합니다!"
70002020-75 = "그런데 말야, 이부키를 보는 건 되게 오랜만인데도 익숙한 느낌이네?"
70002020-76 = "<주간 만마전> 같은 곳에서 이부키의 사진이나 기사들을 많이 봐서 그런가?"
70002020-78 = "과연…… 마코토 선배가 꾸미고 치아키가 대행해서 하는 일이…… 무의미하지만은 않다, 라는 거군요."
70002020-79 = "크크큭! 이제야 이 몸의 진가를 알아보겠느냐! 이로하!"
70002020-80 = "네네……"
70002020-81 = "흠흠. 그보다도……."
70002020-83 = "이부키~"
70002020-84 = "냉장고에 푸딩을 사 뒀는데……."
70002020-86 = "이부키 쨩, 공기놀이를 완전 잘한다고 들었어! <주간 만마전>에서 읽었거든!"
70002020-87 = "혹시 우리한테 보여줄 수 있을까?"
70002020-88 = "응! 물론이야!"
70002020-89 = "이부키, 공기놀이 잘하니까 언니들한테 가르쳐 줄게!"
70002020-90 = "야호~ 이부키 쨩이랑 공기놀이라니, 완전 두근거릴지도~"
70002020-91 = "자, 여기는 좁으니까 저쪽으로 가서 하자."
70002020-97 = "……."
70002020-98 = "이, 이부키……? 푸딩을…… 저기……"
70002020-99 = "………그……"
70002020-101 = "이, 이부키……?! 나보다 오늘 처음 본 저 녀석들이 더 좋다는 거냐……!"
70002020-102 = "그, 그럴 리가…… 아니지?!"
70002020-103 = "이부키! 거, 거짓말이라고 해다오! 이부키이이………!"
70002020-109 = "뭐, 잘된 셈인가요."
70002020-110 = "이걸로 오늘은 조용히 지나갈지도 모르겠네요."
70002020-116 = "이부키 쨩이랑 노는 거, 완전 재밌었네!"
70002020-117 = "이러다 다음 체험 입부 시간에 늦겠어. 서두르자."
70002020-118 = "아하핫! 그러네. 이번에는 어디였지?"
70002020-120 = "다음은……."
70002020-123 = "어서 오세요! 게헨나 급양부입니다!"
70002020-124 = "체험 입부 환영해요!"
70002020-126 = "음! 맛있는 냄새! 조금 배고파졌을지도!"
70002020-127 = "식당에는 자주 왔지만, 주방까지 들어온 건 처음인걸."
70002020-129 = "그렇지. 이곳이 바로 게헨나 학생들의 식사를 만드는 곳이야. 게헨나의 부엌에 온 걸 환영해."
70002020-130 = "요리를 해본 적은 있어?"
70002020-131 = "으음, 가끔 집에서 고기감자조림을 만드는 정도일까?"
70002020-132 = "아핫! 나는 딱히 없어!"
70002020-134 = "괜찮아요! 요리는 배우면 되는 거니까!"
70002020-135 = "체험 입부지만, 오늘은 열심히 가르쳐 드릴게요!"
70002020-136 = "으음, 나도 도와주고 싶지만, 저녁 급식을 준비해야 해서."
70002020-137 = "………원래라면 식자재를 트럭으로 한 번에 확! 하고 옮겨서, 이렇게 왕창! 하고 준비를 하는 식으로 여유 시간을 확보할 수 있었겠지만……"
70002020-138 = "우리 급양부의 트럭이…… 트럭이………"
70002020-142 = "…………크읏!"
70002020-143 = "후, 후우카 선배!"
70002020-144 = "후우. 그런 만큼 오늘 체험 입부 건은 주리에게 맡길게."
70002020-145 = "네! 걱정 마세요, 후우카 선배! 기초부터 차근차근 가르쳐 드릴 테니까요!"
70002020-146 = "고마워. 그럼……."
70002020-150 = "자, 그럼 두 분은 저를 따라오세요!"
70002020-151 = "급양부 시설을 견학시켜 드리고, 제가 요리 시범도 보여드릴 테니까요!"
70002020-153 = "아하핫! 셰프 키라라의 첫 한 발짝, 이라는 느낌이려나? 두근거리네!"
70002020-156 = "자, 이쪽이 주방 내부예요."
70002020-157 = "여기가 그릇 보관장, 이쪽은 그릴, 이쪽은 화구……."
70002020-159 = "이 넓은 주방에서 음식을 얼마나 만들어?"
70002020-161 = "글쎄요…… 매일 몇천 명분 정도일까요."
70002020-163 = "헉?! 정말?!"
70002020-164 = "하긴, 매일 식당에 오는 학생들만 해도 엄청 많으니까 당연한 일이려나."
70002020-165 = "완전 힘들겠다~."
70002020-166 = "처음엔 많이 힘들었지만, 이제는 익숙해져서 괜찮답니다!"
70002020-167 = "자, 그럼 지금부터 숙련된 조교의 시범을 보여드릴게요!"
70002020-168 = "우선, 가장 기본적인 음식인 오므라이스입니다!"
70002020-169 = "오오……?"
70002020-180 = "이렇게 저렇게 해서, 그릇에 담아내면…… 쨘!"
70002020-182 = "어떤가요?"
70002020-186 = "역시 베테랑은 다르—"
70002020-194 = "……잠깐만. 뭔가 이상한데."
70002020-195 = "오므라이스가 원래 녹색이야?"
70002020-196 = "네? 그렇지 않나요?"
70002020-197 = "그, 그것보다 이거 움직이는데? 뭘 만든 거야?"
70002020-198 = "아하핫! 꿈틀거리는 거, 약간 징글귀염~ 하네!"
70002020-199 = "어? 손 내밀었다. 인사일지도?"
70002020-200 = "자, 잠깐만, 그거 정말로 괜찮은 거야, 키라라?"
70002020-202 = "에이, 귀엽잖아? 자아, 하이 파이브!"
70002020-207 = "교감했다……?!"
70002020-211 = "예상외의 사태지만……"
70002020-212 = "뭐어, 이런 점도 키라라 쨩답다고나 할까."
70002020-213 = "어? 오므 쨩?"
70002020-223 = "앗, 도망쳤다."
70002020-224 = "……그보다 오므 쨩, 이라는 거. 이름이지?"
70002020-225 = "자, 잠시만요! 오므 쨩!"
70002020-226 = "………응. 이름인 거구나."
70002020-227 = "가, 갑자기 달아나면 곤란하다구요?!"
70002020-228 = "거, 거기 멈춰 서주세요~!"
70002020-232 = "급양부도…… 확실히 여러모로 고생, 이구나."
70002020-233 = "아하하핫! 뭔가 유쾌하고 정신없어서 재밌네!"
70002020-234 = "오므 쨔아아앙~~!"
70002020-236 = "(급양부 체험 입부는 주최 측 사정으로 중단되었습니다.)"
70002020-241 = "여러분인가요, 체험 입부자가?"
70002020-243 = "안녕! 키라라입니다! 잘부탁해용~"
70002020-244 = "난 에리카."
70002020-246 = "안녕하십니까. 응급의학부 부장 히무로 세나입니다."
70002020-247 = "그런데 응급의학부에서도 체험 입부를 받다니, 의외네."
70002020-248 = "늘 바빠 보여서 체험 입부까지 받을 여유는 없을 것 같았는데."
70002020-249 = "오히려 반대입니다. 눈코 뜰 새 없이 바쁘니까 체험 입부자를 받은 겁니다."
70002020-250 = "오잉? 그래?"
70002020-251 = "현재 자치구 내에서 불량배들의 영역 싸움이 벌어져 다수의 시체…… 아니 부상자가 이송된 상태."
70002020-253 = "여러분은, 즉시 전력으로서 대응해 주셔야겠습니다."
70002020-254 = "어, 어라? 그래도 괜찮은 거야? 우리, 의료는 아무것도 모르는데?"
70002020-255 = "반창고 붙여주는 정도라면 가능할지도 모르지만~."
70002020-257 = "걱정 마십시오. 비전문가에게 어려운 일은 시키지 않으니까."
70002020-258 = "제가 주사를 준비하는 동안 여러분은 부상자들을 안정시키면 됩니다."
70002020-259 = "그럼, 위치로!"
70002020-261 = "위치로~"
70002020-265 = "일단 해봐야 알겠는걸."
70002020-268 = "아야…… 아파라……"
70002020-269 = "쳇, 더 싸울 수 있었는데, 무릎에 총을 맞는 바람에……."
70002020-270 = "다들 엄살 그만 피워! 이대로 있다간 우리 구역을 영영 잃어버릴지도 모른다고!"
70002020-272 = "겨우 이런 작은 부상으로 여기 누워있을 거냐아아앗!"
70002020-273 = "그, 그러면?!"
70002020-274 = "당연히 전장으로 돌아가야지! 자, 다들 조용히 일어나! 응급의학부장 몰래 나가는 거야!"
70002020-275 = "좋아……!"
70002020-280 = "야호~ 환자 여러분~ 임시 백의의 천사 키라라 등장~ 이라는 느낌?"
70002020-284 = "누, 누구야?!"
70002020-286 = "오늘 하루 체험 입부했거든. 여러분이 이송됐다던 부상자?"
70002020-287 = "잘 부탁해!"
70002020-289 = "잘 부탁하긴 무슨! 우린 지금부터 여길 탈출할 거다!"
70002020-290 = "그래! 이런 곳에 처박혀 있을 수는 없지!"
70002020-292 = "응? 아픈 걸 치료하고 싶지 않은 거야?"
70002020-293 = "크지 않은 부상이라고 해도, 그냥 놔두면 되게 아플 텐데?"
70002020-294 = "긍지 높은 불량배가 그런 걸 알까 보냐!"
70002020-295 = "우리 구역을 지키는 게 더 중요해!"
70002020-297 = "그래? 너네 구역이 어딘데?"
70002020-298 = "그 왜, 사거리에서 좀 들어가면 포장마차 뒤쪽 골목 있잖아? 거기라구."
70002020-299 = "어? 크레이프 포장마차? 나 거기 알아!"
70002020-300 = "완전 맛있지, 거기! 나 거기 단골이거든!"
70002020-302 = "어, 어…… 그래? 그거 우연이네."
70002020-303 = "난 항상 딸기랑 소프트아이스크림, 초코칩으로 주문하는데 너희는 어때?"
70002020-304 = "난 역시 바나나가 좋달까."
70002020-305 = "파인애플이랑 아이스크림으로 먹어 봤어? 궁합이 잘 맞더라고!"
70002020-306 = "앗? 정말? 그건 처음 들어보는데, 맛있을지도?!"
70002020-308 = "난 과일을 싫어해서, 그냥 초코칩 쿠키랑 생크림으로 꽉꽉 채워달라고 해!"
70002020-309 = "우와! 나도 다음에 그렇게 먹어봐야지!"
70002020-310 = "그래! 말 나온 김에 같이—"
70002020-315 = "앗?! 응급의학부장?!"
70002020-325 = "나도 모르게…… 수다를 떨고 말았……."
70002020-331 = "마취 완료."
70002020-332 = "환자한테 그렇게 총을 쏴도 돼?"
70002020-333 = "치료를 위한 조치였습니다. 이 보 전진을 위한 일 보 후퇴랄까요."
70002020-334 = "그나저나 두 사람, 소질이 있군요. 주사를 준비하는 동안 이 말썽쟁이들을 잡아 놓다니."
70002020-335 = "뭐어…… 일부러 노리고 한 건 아니랄까……. 키라라 쨩의 힘이라고 할까……."
70002020-336 = "크레이프…… 같이 먹으러 가고 싶었는데……."
70002020-337 = "전화번호라도 남겨두는 건 어때? 얘들이 깨어나면 같이 가면 되잖아?"
70002020-338 = "앗, 그렇네! 부장, 그래도 괜찮을까?"
70002020-342 = "원래라면 환자와 개인적인 연락은 지양하지만……"
70002020-343 = "그렇게 하시죠. 여러분이 훌륭히 업무를 수행해 준 답례입니다."
70002020-344 = "야호! 고마워 부장! 부장 것도 사줄게!"
70002020-345 = "저는 괜찮습니다만……."
70002020-346 = "괜찮아, 괜찮아! 사양하지 말라구~."
70002020-349 = "푸하! 순식간에 하루가 지나가 버렸네!"
70002020-350 = "학교에 이렇게 많은 동아리가 있을 줄은 몰랐어!"
70002020-351 = "덕분에 나도 새로운 경험을 했는걸."
70002020-352 = "그래서, 찾았어?"
70002020-353 = "응? 뭘?"
70002020-354 = "동아리 체험 입부의 목적을 잊은 거야?"
70002020-355 = "키라라 쨩이 들어가고 싶은 동아리를 찾는 게 목적이었잖아?"
70002020-356 = "아참, 그랬지! 깜빡하고 있었네, 아하핫!"
70002020-357 = "으음, 어디보자아…… 이곳도, 저곳도 완전 재밌었지."
70002020-358 = "새로운 친구도 사귀고, 새로운 경험도 해봤으니까!"
70002020-359 = "체험 입부해본 동아리 중에서 내가 가고 싶은 곳은……."
70002020-363 = "……역시 없는걸!"
70002020-365 = "뭐어?"
70002020-366 = "그치만 방금, 완전 재밌었다고 하지 않았어?"
70002020-367 = "응! 완전 재밌었지! 두근두근하고!"
70002020-368 = "이부키 쨩이랑 노는 것도, 급양부 주방에 들어가본 것도, 환자들을 돌보는 것도!"
70002020-369 = "무엇 하나 빼놓을 수 없이 즐거운 경험이었어!"
70002020-370 = "그럼 어째서?"
70002020-371 = "그야…… 그중에 하나를 선택하라고 하면, 뭔가……."
70002020-372 = "아깝지 않아?!"
70002020-373 = "아…… 까워?"
70002020-374 = "생각해 봐, 에리 쨩!"
70002020-375 = "동아리 하나를 정해서 입부하면, 매일매일이 비슷하지 않겠어?"
70002020-376 = "부원도 매일 같은 친구일 테고, 매일매일 비슷한 활동을 계속해야겠지……!"
70002020-377 = "그건, 완-전 아까운걸!"
70002020-378 = "으음…… 대충 알겠어. 키라라 쨩의 말은, 매일매일 다른 활동을 하고 싶다는 거지?"
70002020-379 = "응! 맞아! 역시 에리 쨩이야! 내 마음을 잘 안다니까!"
70002020-380 = "그러는 편이 완전 반짝반짝하고, 두근두근한 하루가 되지 않겠어?!"
70002020-381 = "그게 바로 청춘이지!"
70002020-386 = "이를테면— 새로운 친구를 사귄다거나,"
70002020-394 = "트럭을 쫓아서 달린다거나?"
70002020-404 = "길 잃은 친구들을 도와준다거나!"
70002020-407 = "그런 예상할 수 없는 이벤트야말로, 내가 하고 싶은 동아리 활동이야!"
70002020-408 = "그치만 그거, 귀가부로 늘 하던 거잖아……? 뭐가 달라?"
70002020-409 = "그건 그렇지만! 일단 동아리라는 형식이 중요한 거라구!"
70002020-410 = "청춘의 꽃은 동아리니까!"
70002020-411 = "아, 네에……."
70002020-412 = "하지만 키라라 쨩이 원하는 활동을 하는 동아리는 없을 것 같은데?"
70002020-413 = "그렇네…… 보통은 정해진 부활동을 열심히 하니까……."
70002020-414 = "으으으으음……."
70002020-418 = "……아! 생각났어!"
70002020-419 = "뭔데?"
70002020-420 = "없으면 만들면 되는 거잖아!"
70002020-421 = "완~전 반짝반짝한 동아리!"
70002020-422 = "매일매일 예상할 수 없어서 두근두근한 동아리를 말야!"
70002020-427 = "동아리 설립…… 그렇네. 키라라 쨩다운 결론인걸."
70002020-428 = "그럼 동아리 이름은 뭘로 할 건데?"
70002020-429 = "으음, 두근두근, 반짝반짝한 동아리였으면 좋겠으니까……."
70002020-431 = "<반짝반짝부>?"
70002020-433 = "응! 어감도 마음에 드는걸! 에리 쨩은 어때?"
70002020-434 = "다른 동아리 이름에 비해 특이한 느낌은 있지만……."
70002020-435 = "당연한 일이겠지. 특이한 동아리니까."
70002020-436 = "나도 찬성이야, <반짝반짝부>."
70002020-437 = "좋네! 그럼 일단 버블티라도 한 잔 마시러 갈까!"
70002020-438 = "어라, 갑자기?"
70002020-439 = "뭐 어때! 하고 싶은 걸 하는 게 우리 부활동이잖아! 마침 목도 좀 마르고!"
70002020-440 = "하긴 그렇네. 늘 하던 것처럼……."
70002020-441 = "좋아, 그럼 가볼까?"
70002020-442 = "전에 그 가게 말고, 봐둔 곳이 있었다구!"
70002020-443 = "그래그래."
70002020-453 = "자, 그럼 지금부터 기념비적인 우리 <반짝반짝부>의 첫 활동……"
70002020-454 = "시작이야!"
70002020-458 = "키라라와 에리카의 반짝반짝한 하루"
