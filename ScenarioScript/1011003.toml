[translation]
1011003-1 = "간호 요청"
1011003-5 = "오셨군요, 선생님. 일부러 먼 길 오시게 만들어 죄송합니다."
1011003-6 = "예상은 하셨겠지만 이번에도 특별히 무슨 일이 있는 것은 아니에요. 그래서 '한가하실 때' 와 주셨으면 한다고 말씀드렸죠."
1011003-7 = "그렇지만 그래도, 굳이 무언가의 이유를 들어 보자면……."
1011003-13 = "……이게 그 '이유'라고 말씀드리고 싶군요."
1011003-14 = "[s1] \"……이건?\"\n[s2] \"뭔가 굉장한 게 나왔어!!\""
1011003-17 = "격무에 지친 사람에겐 당분이 필요하다고 하죠. 이번에 티파티로 공수해 온 간식거리입니다."
1011003-18 = "또 이런 식으로 선생님의 시간을 빼앗았으니, 적어도 그동안만큼은 선생님의 기력과 체력을 챙겨 드려야겠다고 생각했어요."
1011003-19 = "알고 있어요. 스스로 말했지만, 모순되는 이야기지요."
1011003-20 = "선생님의 불안해하는 얼굴을 보고 싶다고 한 주제에, 동시에 함께하는 시간만이라도 푹 쉬게 해드리고 싶다니."
1011003-21 = "뭐, 그렇지만 그 부분은 어쩔 수 없는 것입니다. 그러니 여기서는 당돌하게 양해를 부탁드리겠습니다."
1011003-22 = "괜한 말이 길어지는 것 같으니, 우선 이걸 함께 드시고……."
1011003-28 = "……선생님? 그건……."
1011003-29 = "[s3] \"간호를 위해 사 왔지.\"\n[s4] \"마침 나도 챙겨온 게 있거든.\""
1011003-32 = "어라. 어째서……."
1011003-33 = "의외네요. 당연히 변명거리라 생각해서 빈손으로 오실 줄 알았는데 말이에요."
1011003-34 = "실제로 아프지 않다는 걸 아시는데도, 굳이 병문안을 위한 선물을 챙겨 오셨나요?"
1011003-35 = "……'변명거리인 간호'에 맞는 병문안 선물이라고요?"
1011003-39 = "아하……. 과연."
1011003-40 = "이쪽도 당도 높은 디저트들이었군요. 제품은 다르지만, 제가 준비한 것과 구성도 종류도 거의 똑같아요."
1011003-41 = "병문안이 아니라, 마치 피크닉으로 놀러 온 것 같은 구성……."
1011003-42 = "역시 애초에 제가 뭘 원하고 선생님을 불렀는지, 거기까지 모두 예상하셨던 거군요."
1011003-43 = "[s5] \"미리 마련돼 있을 줄은 몰랐지만 말이야.\"\n[s6] \"세이아의 준비성은 예상 못 했지만 말이지.\""
1011003-46 = "후후. 그런가요."
1011003-47 = "……아쉽네요. 나름대로 고심한 건데, 결과가 중복돼 버리다니."
1011003-49 = "네? 달라……?"
1011003-50 = "오히려 좋다……고요? 그건 어째서……."
1011003-51 = "[s7] \"서로 같은 생각을 한 게 재밌지 않아?\"\n[s8] \"결국 서로가 서로를 위했다는 거잖아.\""
1011003-57 = "……정말이지."
1011003-58 = "같은 상황에 같은 것에 대한 이야기인데도, 이토록 듣기 좋게 해 주실 수 있는 건 선생님 정도밖에 없을 겁니다."
1011003-59 = "놀랍습니다. 겨우 말 한마디인데, 지금 그 말씀 한 번으로 정말 아쉬움이 사라졌어요. 오히려 기대했던 것 이상을 얻은 기분이네요."
1011003-60 = "그렇죠. 처음부터 병문안이라는 건 변명거리였고, 저도 선생님도 그 사실을 알고 있었죠."
1011003-61 = "사리사욕으로 선생님을 부리고 있는 입장이니, 이렇게 모여서 잡담을 나누고 간식거리를 나눠 먹는 것만으로도 만족해야 하겠죠."
1011003-62 = "뭐랄까……."
1011003-63 = "안 그래도 버릇이 좋은 아이라고는 스스로 말할 수 없는데, 점점 더 나빠질 것 같네요."
1011003-64 = "하지만 걱정하진 말아 주세요. 저도 스스로가 최소한의 구분은 할 수 있다고 생각합니다."
1011003-65 = "이런 식으로 구는 건 선생님 한정……."
1011003-66 = "선생님께서 '의도하신 대로', 저 또한 그 선은 확실히 지킬 테니까요."
1011003-67 = "……이제 안심하셨을까요?"
1011003-68 = "[s9] \"물론, 의심한 적도 없어.\"\n[s10] \"세이아를 믿고 있으니까.\""
1011003-71 = "……후후."
1011003-72 = "절로 웃음이 나오네요. 역시 선생님과 있는 시간은 즐거워요. 이런저런 무리수를 감수할 가치가 있습니다."
1011003-73 = "그럼 본론으로 돌아가서, 함께 디저트를 드시도록 하죠."
1011003-77 = "[ns11] \"음? 세이아? 어째서 내건…….\"\n[ns12] \"내가 사 온 것만 테이블 아래로 내렸어?\""
1011003-80 = "그야 당연하죠."
1011003-81 = "제가 준비한 것만으로도 저희 둘이 먹기에는 충분한 양이에요. 게다가 제 쪽은 포장도 돼 있지 않으니, 제 쪽을 먼저 먹는 게 맞겠죠."
1011003-82 = "그리고 외람되는 말씀이지만, 선생님이 가지고 오신 건 전부 오롯이 제 것입니다."
1011003-83 = "이것들은 전부 나중에, 제가 원할 때, 저 혼자 천천히 음미하도록 하겠습니다."
1011003-88 = "……제 방에서는 그게 룰이에요. 아무리 선생님이라도 따라 주셔야 합니다."
1011003-89 = "이 방에서는……."
1011003-91 = "제 말이 곧 트리니티의 법규입니다."
