[translation]
10059100-1 = "제10화;희극의 무대"
10059100-2 = "(마나미의 개인 박물관에 갔던 그다음 날.)"
10059100-6 = "(그곳에서 보았던 티아라가 머릿속을 떠나지 않았다.)"
10059100-7 = "(그 티아라는 분명…….)"
10059100-11 = "[ns1] \"……수집은 시간을 초월하는 감각의 예술.\"\n[ns2] \"설마…….\""
10059100-15 = "(혹시나 하는 마음에 과거의 발레 공연을 찾아보기 시작했다.)"
10059100-16 = "(그러자…….)"
10059100-17 = "[ns] \"……역시 그랬구나.\""
10059100-19 = "(찾아내고야 말았다.)"
10059100-20 = "(와일드헌트 발레단의 작품. <장난감 병정과 발레리나 인형>에서.)"
10059100-23 = "(내가 보았던 티아라를 쓰고, 발레리나 인형 역으로 눈부시게 춤을 추고 있는…….)"
10059100-24 = "(……마나미의 모습을.)"
10059100-26 = "그중에서도 <장난감 병정과 발레리나 인형>이라는 작품을 가장 좋아해요."
10059100-27 = "원전은 외다리 장난감 병정과 발레리나 인형의 슬픈 이야기지만……."
10059100-28 = "해피 엔딩으로 각색된 버전이 이곳에서 공연된 적이 있죠."
10059100-30 = "(하지만 마나미가 무대에 올랐던 건 작년 여름까지였다.)"
10059100-33 = "(작년 여름 이후, 마나미는 더 이상 무대 위에 서지 못했다.)"
10059100-34 = "(그 이유는…….)"
10059100-37 = "[log]와일드헌트의 최정상 발레리나.[/log]"
10059100-39 = "[log][ff4444]심각한 발목 부상으로 은퇴 불가피![-][/log]"
10059100-44 = "(어쩌다가 다쳤는지, 나을 가능성은 있는지, 앞으로의 계획은 어떤지…….)"
10059100-45 = "(마나미가 인터뷰를 전부 거부하는 바람에 자세한 내용은 알려지지 않았다.)"
10059100-46 = "(재활 치료 덕분에 일상을 살아가는 데는 무리가 없게 됐지만, #n이전의 기량을 되찾는 건 불가능했다는 기사가 보였다.)"
10059100-47 = "(그렇게 발레리나 마나미의 이야기는, 허무하게 끝이 났다.)"
10059100-50 = "이 세상에 영원한 건 없는 거예요."
10059100-51 = "찬란히 빛나는 별도, 언젠가 사그라지는 법……."
10059100-53 = "(……결국 그 아이는 꿈을 잃었다.)"
10059100-54 = "(찬란했던 별의 순간은, 가장 원하지 않았던 방향으로 종말을 고했다.)"
10059100-55 = "(하지만, 그럼에도 그 아이는…….)"
10059100-57 = "저는 언젠가, 이보다 더 규모가 큰 박물관을 만들고 싶어요."
10059100-58 = "저뿐만이 아니라, 학생 모두의 추억이 담긴 박물관을 만드는 거죠."
10059100-59 = "그 추억은 학생들이 꿈을 이루는 데 훌륭한 버팀목이 될 거예요."
10059100-60 = "어떤가요? 꽤 좋은 박물관이 될 것 같지 않나요?"
10059100-65 = "(……모두를 위해 계속 앞으로 나아가고 있었다.)"
10059100-69 = "……네. 저는 모두를 위한 큐레이터가 되려 해요."
10059100-70 = "그것이 제가 평의회장이 된 이유니까."
10059100-72 = "(꿈을 잃었던 아이가, 새로운 꿈을 향해 손을 뻗고 있었다.)"
10059100-77 = "[ns] (나는 그런 마나미의 마음이…….)"
10059100-79 = "[ns] (절대로 꺾이게 놔둘 수 없다!!)"
10059100-82 = "……눈빛이 달라졌군, 선생."
10059100-83 = "그래. 기대해 보지."
10059100-84 = "부디 실망시키지 말도록."
