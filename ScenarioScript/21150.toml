[translation]
21150-1 = "제15화;뻗어오는 위험"
21150-2 = "밀레니엄 본교사 통제실"
21150-3 = "차압해온 로봇 군단을 전부 가동시켜!"
21150-4 = "본래는 도색이 끝난 뒤, 학교 청소용 로봇으로 사용하려 했지만……"
21150-5 = "일단은 침입자들을 격퇴하는 데 사용한다!"
21150-6 = "지휘권은 전부 메이드부에게 이양! 아카네!"
21150-7 = "알겠습니다. 로봇들과 함께 게임개발부를 소탕하겠습니다."
21150-9 = "밀레니엄 본교사 복도"
21150-10 = "끄아악!"
21150-11 = "가, 강하다……!"
21150-12 = "이것이…… C&C의 에이전트의 힘……!"
21150-15 = "헤에……."
21150-18 = "(흐음. 이 아이들. 제법이네. 빈말로도 탁월한 전투 능력을 갖춘 건 아니지만……)"
21150-19 = "(팀워크랄까. 마치 두 명이 한 몸처럼 움직여. 이런 게 가능한 건 베테랑들뿐인데.)"
21150-21 = "쌍둥이의 힘이려나~ 아름답네~"
21150-23 = "크윽…… 설마 여기서 아스나 선배와 마주칠 줄이야."
21150-24 = "언니. 안 되겠어. 일단 후퇴야!"
21150-25 = "어쩔 수 없나."
21150-28 = "후퇴~ 그렇게는 안 될걸!"
21150-29 = "(콰앙!)"
21150-30 = "꺄아!"
21150-31 = "대구경 탄환?! 설마……?!"
21150-32 = "카린 선배의…… 서, 설마? 우, 우타하 선배가……? 당한 거야?!"
21150-34 = "밀레니엄 제 3교사 옥상"
21150-35 = "……."
21150-36 = "어라. 내가 왜 누워있지? 그리고 내 얼굴의 바로 앞에 이 커다란 엉덩이는 누구의……?"
21150-37 = "……나다."
21150-38 = "생각보다 빨리도 정신을 차렸네. 꽤 세게 맞았을 텐데."
21150-39 = "미안해. 손대중을 할 겨를은 없었어."
21150-40 = "……아아. 포연 속에서 정확하게 나를 조준하고 저격, 쓰러진 내 곁에 붙는다."
21150-41 = "그래. 이대로라면 선배를 소중히 생각하는 저 박격포 소녀가 옥상 위로 포격은 못 하겠지."
21150-42 = "하…… 계산 밖이네. 포연 속에서 어떻게 정확하게 나를 노릴 수 있었던 거지?"
21150-43 = "고작 시각만으로 적을 포착하는 저격수는, C&C에 없어."
21150-44 = "그보다 너무 떨어지지 마. 나는 마음이, 너는 몸이 아파질 수 있으니까."
21150-45 = "……."
21150-46 = "부탁인데, 박격포에 맞아도 상관없으니 조금만 떨어져 줘. 네 엉덩이 너무 가까워."
21150-47 = "네가 고개 돌리면 되잖아!"
21150-49 = "밀레니엄 본교사 복도"
21150-50 = "하레 선배에게 연락! 카린 선배가 부활했대! 우타하 선배는 붙잡혔고!"
21150-51 = "그건 보면 알아!"
21150-52 = "마키에게서도 연락! 아카네 선배가 셔터를 폭발시키고 탈출!"
21150-53 = "동시에 대규모 로봇들이 전부 이쪽으로 오고 있어!"
21150-54 = "히익……."
21150-57 = "아하하. 잘은 모르겠지만, 느낌이 오네. 우리가 이기고 있다는~ 그런 기분이랑~"
21150-58 = "너희가 지고 있다는, 그런 느낌 말야!"
21150-60 = "우웃……!"
21150-61 = "실패인가……."
21150-62 = "……아니,"
21150-63 = "아직은 아냐."
21150-65 = "밀레니엄 베리타스"
21150-66 = "(15분 전)"
21150-67 = "크윽…… 몇 번을 고민해봐도 결국 여기서 막히는데."
21150-68 = "모두의 시선을 끄는 것까지는 성공할 수 있어."
21150-69 = "아카네, 아스나 봉인, 카린 저지, 학생회 경비 로봇들이랑 대치. 여길 돌파하면 압류품 보관소에 진입하는 것까진 어렵지 않겠지만……"
21150-70 = "하나라도 실패한다면……."
21150-71 = "반드시 실패야. 잘 대비하고 있는 메이드부를 상대로 정면승부를 하는 건 밀레니엄의 어떠한 집단이라도 불가능해."
21150-72 = "히마리 선배의 이름을 팔아 혼선을 준다 해도, 결국 시간만 끌다 포위당하겠지."
21150-73 = "진입 2분 내에 아카네 선배와 아스나 선배 봉인, 5분 후 카린 선배 저지, 11분 후 오토마타 돌파…… 13분째에 거울확보…… 그리고……"
21150-74 = "20분, 전원 체포인 건가."
21150-75 = "……"
21150-76 = "……전원만…… 아니면 되지 않을까?"
21150-77 = "뭐?"
21150-78 = "우리가 이기기 위해선, 우리 중 몇 명은 져야 할지도 몰라."
21150-79 = "그때가 되면……."
21150-80 = "미, 미도리 무슨 얘기를 하는 거야?"
21150-81 = "계획대로 잘 되지 않을 경우까지, 계획에 포함하는 거야."
21150-83 = "밀레니엄 학생회 반성실"
21150-86 = "……아."
21150-87 = "전력 차단……이 이벤트가 의미하는 건……"
21150-89 = "(철컹)"
21150-90 = "EMP 발동…… 하레 선배의 해킹을 통한 설정 변경으로…… #n학생회 건물의 전자식 문이 열린다는 것…… 셔터와 마찬가지."
21150-91 = "좋아."
21150-92 = "아리스. 탈출합니다."
21150-93 = "그럼…… 아리스의 퀘스트는……"
21150-94 = "학생회 압류품 보관소로……."
21150-100 = "밀레니엄 본교사 복도"
21150-101 = "아무리 저 녀석들이라 해도, 갇혀 있는 아리스까지 경계하고 있진 않겠지."
21150-102 = "여기서 붙잡혀도…… 근신 정도면 부실에서 몰래 G.Bible과 함께 테일즈 사가 크로니클 2를 만들 수 있어."
21150-103 = "흐음. 무슨 말을 하는지는 잘 안 들리지만."
21150-104 = "뭔가 필사적인 느낌이 줄었는걸~ 설마 포기한 거야?"
21150-105 = "포기하는 게 정답이긴 하죠."
21150-106 = "윽. 유우카!"
21150-107 = "정말 놀라워. 일단 이렇게까지 우리를 당혹시켰다는 사실만큼은 칭찬해주고 싶어."
21150-108 = "하지만, 이번엔 도가 지나쳤어."
21150-109 = "테러리스트들이랑 힘을 합쳐 학생회를 습격하다니."
21150-110 = "부실 보존에도 유예를 줬지만, 내가 너무 물렀던 것 같네."
21150-111 = "용서 못 해. 이번에 붙잡히면 무조건 1주 정학이나 구금은 각오하는 게 좋을 거야."
21150-113 = "뭐, 뭐라고?!"
21150-114 = "1주면…… 밀레니엄 프라이스가 끝나버려!"
21150-115 = "마침 너희 동료인 아리스 쨩도 구금된 상태니까. 잘됐네. 어린 애 혼자 가둬둬서 마음이 아팠는데. 너희들이 같이 들어가 주면 좋아하겠지."
21150-116 = "으으……!"
21150-117 = "어, 언니……!"
21150-118 = "붙잡혀도 성공일 줄 알았는데."
21150-119 = "이대로 우리가 붙잡히면…… 끝장이야! 설령 거울을 빼간다 쳐도 아리스와 유즈만으로 게임을 만들 순 없으니까."
21150-120 = "어떻게든, 돌파한다!"
21150-122 = "호오. '우리'를?"
21150-123 = "헥헥. 겨우 도착했네요. 왜 이렇게 숨이…… 아 정말로 체중 때문에……? 아, 아니야!"
21150-125 = "히익?!"
21150-126 = "아, 아카네와 전투 로봇들!"
21150-128 = "후우. 이번에야말로 '진짜'로군요."
21150-129 = "처음 뵙겠어요. 모모이 양, 미도리 양."
21150-130 = "마키 양과 코토리 양의 경우, 의혹은 있어도 용서할 수 있는 수준의 문제지만."
21150-131 = "이 내부까지 들어온 당신들에겐, 어떠한 변명의 여지도 없겠군요."
21150-132 = "그리고……."
21150-133 = "선생님도, 샬레에 보내는 항의 서한 정도는 각오하셔야 될 거예요."
21150-136 = "으윽……."
21150-137 = "정말…… 여기가 끝인 거야……? 싫어……!!"
21150-138 = "언니……!"
21150-139 = "미안해 선생님…… 선생님은 최선을 다해주었는데…… 우리가 부족해서…… 우리 때문에!"
21150-140 = "[s1] \"포기하지 마.\"\n[s2] \"너희와 함께 할 수 있어서 영광이었어.\""
21150-141 = "위로해줘서 고맙지만…… 이미 틀렸어."
21150-142 = "앞에는 C&C, 뒤에는 밀레니엄 학생회…… 밀레니엄에서 가장 강한 두 세력이라고."
21150-143 = "이런 상황에서 어떻게 포기하지 말란 말야!"
21150-144 = "선생님……"
21150-145 = "고마워요. 그렇게 말해줘서……"
21150-146 = "하지만…… 이젠 정말로 끝났어요."
21150-148 = "타겟. 확인."
21150-149 = "(우우웅)"
21150-150 = "마력 충전…… 100%……"
21150-151 = "이, 이 소리는……."
21150-152 = "언니! 엎드리자!"
21150-154 = "?"
21150-155 = "어라?"
21150-156 = "……?"
21150-159 = "빛이여!!"
21150-160 = "(콰과과과광!)"
21150-161 = "크윽!!"
21150-162 = "꺄악!"
21150-163 = "아, 아스나 선배?! 괜찮아요?!"
21150-164 = "안 괜찮아~! 와아! 뭐야뭐야뭐야?! 아하하! 정통으로 맞았어! 우와! 엄청나게 아파! 머리끝부터 발끝까지 꼼짝도 못 하겠어!"
21150-165 = "……괜찮아 보이네요."
21150-166 = "이런! 아스나 선배뿐만 아니라 로봇 군단의 절반 이상이 행동 불능……?! 이럴 수가!"
21150-167 = "다, 단 한 방에?"
21150-168 = "카린! 상황을 보고해줘요! 방금 빔 포는 대체 어디서……?"
21150-169 = "카린? 카린?! 그러고 보니 언제부터인가 카린의 지원사격이 끊겼……!"
21150-170 = "(퍼엉~)"
21150-171 = "……저 빛은…… 옥상?!"
21150-173 = "밀레니엄 제 3교사 옥상"
21150-174 = "윽! 눈이! 이런 저 박격포는 섬광탄도 쏠 수 있었던 건가?!"
21150-175 = "내 후배는, 소중한 선배에게 폭격을 가하지 않는 착한 후배……, 맞아."
21150-176 = "그리고 대단히 현명하지."
21150-177 = "이런…… 이렇게 밝아서는…… 아카네를 지원할 수 없어. 대체 어째서 이렇게까지!"
21150-178 = "어째서냐고? 그야 부를 지키고 싶어서가 당연하잖아."
21150-179 = "……소문에 밝지 않은, 나도 들어 아는 건 있어."
21150-180 = "너희 엔지니어부는 몰라도, 저 게임개발부는 제대로 된 부활동이라 말하기 어려워."
21150-181 = "저런 자기만 아는 말썽꾸러기들을, 어째서 너 같은 녀석이 돕는 거지?"
21150-182 = "……자기만 아는 게 아니니까."
21150-183 = "저 아이들은, 친구들을 위해 싸우고 최선을 다하고 있어."
21150-184 = "굳이 부활동이 아니라도, 게임개발은 할 수 있는 거잖아."
21150-185 = "……네 말도 맞아."
21150-186 = "하지만 말야. 그냥 '친구'도 분명 의미 있겠지만……"
21150-187 = "같은 동아리라는 건, 서로를 강하게 묶어주는 이름이기도 해."
21150-188 = "저 아이들도, 함께하고 싶다는 마음이 있기 때문에……"
21150-189 = "이렇게 노력하고 있는 거야."
21150-190 = "……하지만!"
21150-192 = "(휘이잉……)"
21150-194 = "(펑!)"
21150-195 = "이런!"
21150-196 = "……후훗."
21150-199 = "계산대로는 아니지만…… 재미있네."
21150-201 = "밀레니엄 본교사 복도"
21150-202 = "모모이! 미도리!"
21150-203 = "지금입니다!"
21150-204 = "아리스 쨩?!"
21150-205 = "어째서 여기로 온 거야!"
21150-206 = "학생회 압류품 센터로 이동하면서, 곰곰이 생각해봤습니다."
21150-207 = "파이널 판타지아, 드래곤 테스트, 테일즈 오브 페이트, 용기전송, 영웅신화, 아이즈 이터널…… 그리고 테일즈 사가 크로니클……."
21150-208 = "그 어떤 게임에서도 주인공들은……"
21150-209 = "결코, 동료를 포기하진 않습니다."
21150-210 = "아리스도 그렇게 합니다."
21150-212 = "함께, 시련을 돌파하는 겁니다!"
21150-214 = "아리스 쨩……."
21150-215 = "그래. 이대로 붙잡혔으면 어차피 끝이었어."
21150-216 = "가자! 게임개발부!"
21150-217 = "응!"
21150-219 = "큭! 놓치지 않아요!"
21150-220 = "아하하. 아프다! 근데 재미있어! 찌릿찌릿해!"
21150-221 = "아스나 선배…… 정말 아픈 거 맞아요? 그보다 어째서인지 카린의 저격도 멈췄어…… 설마 저쪽에도……?"
21150-222 = "모, 모모이, 미도리가 도망가고 있어!"
21150-223 = "이대로 놓칠 순 없습니다."
21150-224 = "아스나 선배는 물러서요."
21150-226 = "아카네, 전투를 시작합니다!"
