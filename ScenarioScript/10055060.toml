[translation]
10055060-1 = "제6화;캐리비안의 만마전"
10055060-10 = "요호호호! 다들 잘 어울리는군!"
10055060-11 = "다시 한번 우리 [ruby=맨 오브 판데모니움]만마선[/ruby]의 일원이 된 것을 환영한다, 선생!"
10055060-12 = "[s1] \"어라라라~? 이상하다~?\"\n[s2] \"한 사람이 안 보이는데~?\""
10055060-15 = "앗! 이로하 선배가 없다!"
10055060-16 = "이부키가 찾아보고 올게!"
10055060-20 = "으으…… 제가 어째서 이런 우스꽝스러운 꼴을……."
10055060-21 = "이로하 선배! 못 입겠어? 이부키가 도와줄까?"
10055060-22 = "앗…… 괜찮아요. 그냥 좀 마음의 준비를 할 시간이 필요해서……."
10055060-29 = "웃지 마세요."
10055060-30 = "[s3] \"하나도 안 웃겨!\"\n[s4] \"너무 무서운 해적이다!\""
10055060-39 = "[ns5] \"아파팟?!\"\n[ns6] \"말없이 걷어차는 거 무서운데요?!\""
10055060-43 = "아씨…… 한동안 찾지 말아주세요."
10055060-44 = "만마전이라는 게 부끄러워 죽겠어요."
10055060-48 = "와아! 이로하 선배도, 이부키하고 똑같이 해적이야!"
10055060-49 = "이부키, 엄청 기뻐!"
10055060-50 = "……이부키."
10055060-51 = "어쩔 수 없네요. 조금 힘내볼까요."
10055060-55 = "[ns7] \"……?\"\n[ns8] \"나는 왜 맞은……?\""
10055060-59 = "왜 우리가 청소 같은 걸……."
10055060-60 = "세상에 깨끗한 유령선 갑판이 어딨다고……."
10055060-62 = "거기! 군소리가 많다!"
10055060-66 = "떠들 시간이 있으면 손을 움직이도록!"
10055060-67 = "이 배를 새것처럼 반짝반짝하게 닦는 거다!"
10055060-68 = "네에, 네!"
10055060-72 = "캡틴!"
10055060-73 = "넵, 캡틴!"
10055060-77 = "……그래서, 마코토 쨩. 이번에는 어떤 마법을 부린 거야?"
10055060-78 = "응?"
10055060-79 = "해적들 말이야. 어떻게 부하로 삼은 거야?"
10055060-80 = "아아, 그것 말인가!"
10055060-82 = "그건 말이지……."
10055060-84 = "1시간 전……."
10055060-88 = "허억…… 허억……!"
10055060-89 = "끈질긴 녀석들! 언제까지 쫓아올 생각인지!"
10055060-93 = "하아, 하아……! 애초에 우리가 침입자거든요……?!"
10055060-94 = "저기다! 저기서 목소리가 들렸다!"
10055060-95 = "이런!"
10055060-96 = "불평불만하고 있을 때가 아니다!"
10055060-97 = "일단, 저 방으로 도망친다!"
10055060-104 = "여기는, 무슨 방이죠?"
10055060-105 = "그보다 막다른 길이잖아요! 발견 당하면 끝장이에요!"
10055060-106 = "들키지만 않으면 된다!"
10055060-107 = "무슨 말도 안 되는……."
10055060-108 = "나만 믿어라! 문제없다!"
10055060-109 = "……믿으라고요?"
10055060-110 = "믿어서 이 모양, 이 꼴이 된 거잖아요!"
10055060-111 = "애초에 마코토 선배가 무책임하게 이 배에 뛰어들지만 않았어도……!"
10055060-112 = "……."
10055060-117 = "……딸꾹!"
10055060-118 = "아."
10055060-119 = "미안해요, 이부키. 제 목소리가 너무 컸죠."
10055060-120 = "놀라게 할 생각은 없었어요."
10055060-124 = "그치만, 지금 상황에…… 어떻게 해야……."
10055060-125 = "적어도 이부키만이라도 안전하게 빠져나갈 수 있는 방법이……."
10055060-129 = "……."
10055060-133 = "……?! 마코토 선배! 어디로?!"
10055060-134 = "이 느려 터진 유령 놈들! 이 몸은 여기 있다!"
10055060-135 = "어서 쫓아오지 못할까!"
10055060-136 = "저기 있다! 저 녀석을 쫓아라!"
10055060-144 = "……마코토, 선배?"
10055060-146 = "……과연."
10055060-147 = "아니, 전혀 설명이 안 됐잖아?"
10055060-148 = "방금 이야기대로면, 마코토 쨩도 유령이 됐어야 정상 아니야?"
10055060-149 = "설마?! 유령이 되어서?!"
10055060-150 = "아니, 아무리 이 몸이라도 그건……."
10055060-151 = "뭐, 요컨대, 기합이다."
10055060-152 = "기합……?"
10055060-153 = "아아, 마코토 선배가 입에 달고 사는 그거네요!"
10055060-154 = "고양이도 기합이 있으면 사자로 성장할 수 있다고! 늘 주장하셨죠!"
10055060-155 = "음. 그건 주장이 아니라 사실이다."
10055060-159 = "그후의 일을 설명하자면……."
10055060-162 = "…………."
10055060-167 = "찾았다! 저기 있다!"
10055060-168 = "막다른 길이야! 이제 더는 도망치지 못하겠……."
10055060-170 = "이…… 이……."
10055060-177 = "이……."
10055060-178 = "……이 어리석은 놈들!!!"
10055060-184 = "죽어서 유령이 되었다면, 적지 않은 사연이 있을 텐데!"
10055060-185 = "이런 거함을 가지고도 원한을 풀기는커녕 어린아이 겁이나 주고 다니는 게 전부냐!"
10055060-187 = "아, 아니…… 우리는……."
10055060-189 = "시끄럽다! 변명은 듣고 싶지 않다!"
10055060-190 = "숨기려고 해도, 이 몸은 도망치는 와중에도 결국 발견하고 말았다……."
10055060-191 = "여기 상자에 그려진 것은, 다름 아닌 게헨나의 교표!"
10055060-192 = "즉, 너희들은 게헨나의 학생, 아니, 게헨나의 유령인 거겠지!"
10055060-193 = "평범한 유령이라면 몰라도, 게헨나 유령이 쪼잔하게 구는 것은 용납 못 한다!"
10055060-198 = "아니, 갑자기 쳐들어와서 그런 말을 해도……."
10055060-199 = "우리 보고 뭘 어떻게 하라고……."
10055060-201 = "물론, 마음은 이해하고 있다!"
10055060-202 = "게헨나 교정에서 멀리 떨어진 망망대해에서, 유령 해적의 삶이라는 게 쉽지는 않겠지."
10055060-203 = "몸도, 마음도 닳아, 점점 더 모든 것이 멀고 막연하게 느껴졌을 것이다."
10055060-204 = "하지만, 그것은 리더십이 부재했기 때문에 생긴 일!"
10055060-205 = "뛰어난 지도자가 솔선하여 이끌고, 비전을 제시한다면 틀림없이 더 나아질 수 있다!"
10055060-207 = "비전……? 리더십……?"
10055060-209 = "어려울 것 없다!"
10055060-210 = "운 좋게도 너희 눈앞에는 게헨나 역사상 최고의 지도자가 있으니 말이다!"
10055060-211 = "그저 한 가지 규칙만 따르면 된다."
10055060-215 = "지금부터 이 몸을 캡틴 마코토라 부르도록!"
10055060-218 = "……."
10055060-219 = "……."
10055060-220 = "아니, 거짓……"
10055060-222 = "우와! 대단해요!"
10055060-227 = "역시 마코토 선배! 제가 그 자리에 있었어야 했는데! 사진으로 남기지 못한 게 아쉬워요!"
10055060-228 = "오오! 마코토 선배…… 아니, 캡틴 마코토, 멋져!"
10055060-229 = "요호호호! 이 몸을 더욱 칭송하라!"
10055060-234 = "[ns] \"이로하……?\""
10055060-235 = "무슨 말씀인지는 알겠는데요."
10055060-236 = "제가 [ruby=・   ・   ・]도우러[/ruby] [ruby=・   ・]갔을[/ruby] [ruby=・]때[/ruby], 이미 저 상태였어서……."
10055060-237 = "……응?"
10055060-238 = "왜 그러세요?"
10055060-239 = "아니, 아무것도 아니야."
10055060-240 = "일단, 사실만 놓고 보면, 해적들이 마코토 쨩을 캡틴이라 부르며 따르는 건 사실이야."
10055060-241 = "그러니까 어느 정도 과장은 있어도, 전반적으로 실제로 일어난 일이라고 봐야겠지."
10055060-243 = "아니, 그래도 너무 허무맹랑하지 않아요?"
10055060-244 = "우연히 바다를 떠도는 해적선을 만났는데, 하필이면 또 그 해적들이 게헨나 학생들이었다고요?"
10055060-245 = "……아아, 거기서부터 잘못 알고 있구나."
10055060-246 = "네?"
10055060-247 = "이 배는 게헨나의 물건이 맞아. 해적들도 아마 높은 확률로 게헨나의 학생일 거야."
10055060-248 = "하지만……."
10055060-249 = "하지만?"
10055060-253 = "……아니, 이건 아직 추측의 영역이니까."
10055060-254 = "…………."
10055060-256 = "(그리고 시간이 흘러…….)"
10055060-259 = "……."
10055060-260 = "……."
10055060-261 = "처음에는 대뜸 청소하라니까 뭔가 했는데……."
10055060-262 = "막상 깨끗해진 갑판을 보니까……."
10055060-263 = "……엄청 보람찬데!"
10055060-265 = "요호호! 훌륭하다, 제군!"
10055060-266 = "캡틴!"
10055060-267 = "더러웠던 갑판은 제군들의 썩어빠진 패배주의를 투영하고 있었지. 하지만 지금은 어떤가!"
10055060-268 = "감히 누가 이 몸의 배를 보고 볼품없는 유령선이라 부를 수 있겠는가!"
10055060-269 = "제군들은 이미 훌륭한 해적선의 선원이다!"
10055060-271 = "정말이야. 완전히 달라진 기분이야."
10055060-272 = "얼마 전까지 이런 배는 상상도 못 했는데."
10055060-274 = "아직이다!!!"
10055060-281 = "분명, 제군들이 이뤄낸 변화는 위대하다!"
10055060-282 = "하지만 이 장대하고 찬란한 변화조차, 앞으로 제군들의 일생에서 가장 작고 사소한 성공에 불과하겠지!"
10055060-283 = "바로 이 캡틴 마코토의 영도 하에 말이다! 요호호!"
10055060-284 = "캡틴! 캡틴! 캡틴!"
10055060-289 = "……하여간, 말이나 못하면."
10055060-294 = "어머, 잠깐 사이에 몰라보게 깨끗해졌네. 그래서 마코토 쨩, 이제 어쩔 거야?"
10055060-295 = "응?"
10055060-296 = "이 배를 탈취한다는 목표는 달성했잖아?"
10055060-300 = "당연한 것을 묻는군, 사츠키."
10055060-304 = "진정한 해적이 해야 하는 일이라면 단 하나뿐!"
10055060-306 = "키보토스의 모든 금은보화를 노략하는 것이다! 요호호호!"
10055060-311 = "……아니, 뭔……?"
10055060-312 = "육지로 돌아가는 게……."
10055060-313 = "이거는, 완전히 컨셉에 잡아먹혔군요. 한동안은 저 상태겠어요."
10055060-314 = "[s9] \"위험하지 않을까?\"\n[s10] \"해적질이라니…….\""
10055060-317 = "네? 진심이세요?"
10055060-318 = "이 배의 무장을 보세요. 겉모습만 번지르르할 뿐, 실제로는 구닥다리 대포 몇 문이 실렸을 뿐이잖아요."
10055060-319 = "이런 고물선에 털릴 만한 장소는, 키보토스 어디에도 없을걸요? 애초에 편의점에 있는 화약보다 적은데……."
10055060-320 = "[s11] \"그건 그래!\"\n[s12] \"분하지만 맞는 말이다.\""
10055060-323 = "그리고요. 아까 청소하면서 슬쩍 확인했는데, 이 배의 대포들……."
10055060-330 = "뭐, 뭐죠?!"
10055060-331 = "무슨 일이냐! 어디서 총알이 날아왔지?!"
10055060-332 = "캡틴! 적습입니다!"
10055060-333 = "적습이라니?! 여기는 바다 한복판이란 말이다! 누가 우릴 공격할 수 있단 말이냐?!"
10055060-334 = "적함, 수평선 위로 모습이 보입니다!"
10055060-339 = "아니, 진짜, 거짓말……."
10055060-340 = "그토록 바랄 때는 없었다가, 하필이면 이제 와서?"
10055060-343 = "적함 트라이던트입니다!"
10055060-345 = "오디세이아 해양학원의 선도부입니다!"
