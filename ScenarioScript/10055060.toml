10055060-179 = ""
10055060-182 = ""
10055060-184 = "既然死後變成了幽靈，想必有不少故事吧！"
10055060-185 = "明明擁有這麼巨大的船艦卻不去報仇雪恨，只會到處嚇唬小孩子嗎！"
10055060-187 = "不，不是……我們是……"
10055060-189 = "吵死了！本大人不想聽藉口！"
10055060-190 = "就算想隱瞞也沒用，本大人已經在逃跑途中發現了……"
10055060-191 = "這個箱子上畫的不是別的，正是格黑娜的校徽！"
10055060-192 = "也就是說，你們是格黑娜的學生……不，是格黑娜的幽靈吧！"
10055060-193 = "普通的幽靈就算了，本大人可不容許格黑娜的幽靈這麼小家子氣！"
10055060-194 = ""
10055060-197 = ""
10055060-198 = "就算你突然闖進來這麼說……"
10055060-199 = "你要我們怎麼辦啊……"
10055060-201 = "當然，本大人能理解你們的心情！"
10055060-202 = "在遠離格黑娜校園的茫茫大海上，過著幽靈海盜的生活想必很不容易吧。"
10055060-203 = "身心都被消磨殆盡，想必會覺得一切都越來越遙遠、渺茫吧。"
10055060-204 = "但是，那全都是因為缺乏領導才會發生的！"
10055060-205 = "只要有優秀的領導者以身作則、提出願景，情況肯定會變得更好！"
10055060-207 = "願景……？領導力……？"
10055060-209 = "這沒什麼難的！"
10055060-210 = "算你們運氣好，眼前就站著格黑娜史上最偉大的領導者！"
10055060-211 = "你們只要遵守一條規則就行了。"
10055060-212 = ""
10055060-214 = ""
