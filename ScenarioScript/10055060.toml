10055060-304 = "สิ่งที่โจรสลัดที่แท้จริงต้องทำน่ะ มันมีเพียงเรื่องเดียวเท่านั้น!"
10055060-306 = "นั่นก็คือปล้นทองคำและสมบัติทั้งหมดในคิโวทอสยังไงล่ะ! โฮ่ๆๆ!"
