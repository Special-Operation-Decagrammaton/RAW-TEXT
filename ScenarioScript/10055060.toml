10055060-313 = "โดนคอนเซ็ปต์โจรสลัดกลืนกินไปเต็มๆ แล้วสินะคะ ฉันว่าคงเป็นแบบนั้นไปอีกพักใหญ่ๆ เลยค่ะ"
10055060-314 = "[s9] \"จะไม่อันตรายแน่เหรอ?\"\n[s10] \"จะไปเป็นโจรสลัดเนี่ยนะ...\""
10055060-317 = "คะ? พูดจริงเหรอคะ?"
10055060-318 = "ดูอาวุธบนเรือลำนี้สิคะ ดูดีแค่ภายนอกเท่านั้นเอง จริงๆ ก็มีแค่ปืนใหญ่เก่าๆ ไม่กี่กระบอกเองค่ะ"
10055060-319 = "คงไม่มีที่ไหนในคิโวทอสโดนเรือเก่าๆ แบบนี้ปล้นได้หรอกค่ะ แถมดินปืนที่มีอยู่ยังน้อยกว่าในสต๊อกของ#nร้านสะดวกซื้ออีก..."
10055060-320 = "[s11] \"ก็จริงอย่างที่พูดนะ\"\n[s12] \"ฟังแล้วน่าเจ็บใจแต่ก็พูดถูก...\""
10055060-323 = "แล้วก็เมื่อกี้ตอนทำความสะอาด ฉันลองแอบตรวจดูแล้ว ปืนใหญ่บนเรือลำนี้น่ะ..."
10055060-324 = ""
