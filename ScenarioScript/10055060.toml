10055060-243 = "不，就算是這樣，也太荒唐了吧？"
10055060-244 = "碰巧在海上遇到漂流的海盜船，而那些海盜們偏偏又是格黑娜的學生們？"
10055060-245 = "……啊啊，你從那裡就搞錯了啊。"
10055060-246 = "咦？"
10055060-247 = "這艘船確實是格黑娜的東西。海盜們也很有可能是格黑娜的學生。"
10055060-248 = "但是……"
10055060-249 = "但是？"
