10055060-179 = ""
10055060-182 = ""
10055060-184 = "死んで幽霊になったなら、それなりにストーリーがあるのだろう？"
10055060-185 = "これほど巨大な船を持つ者が、怨念を晴らすどころか子どもの恫喝だと！？"
10055060-187 = "あ、いや……あっしらは……。"
10055060-189 = "うるさい！言い訳など聞きたくない！"
10055060-190 = "隠そうたって無駄だ。#nこの私は見つけたのだ……。"
10055060-191 = "この箱に描かれているのは、間違いなくゲヘナのマーク！"
10055060-192 = "つまりお前らはゲヘナの生徒……ゲヘナの幽霊なのだろう？"
10055060-193 = "他校ならまだしも、ゲヘナ生の幽霊の無様など許すまい！"
10055060-194 = ""
10055060-197 = ""
10055060-198 = "いやいきなり突撃してきて、そんなこと言われてもな……。"
10055060-199 = "どうしろって……。"
10055060-201 = "だが気持ちは分かっているとも！"
10055060-202 = "愛しきゲヘナから遠く離れた遠洋で、幽霊海賊生活はさぞ辛かったことだろう。"
10055060-203 = "身も心もすり減っていき、何もかもが遠くに感じる……漠然とした不安に駆られたはずだ。"
10055060-204 = "しかしそれは、リーダー不在がゆえに起こったといえよう！"
10055060-205 = "優秀な指導者が道しるべとなり、ビジョンを提示することで間違いなく状況は改善される！"
10055060-207 = "リーダー……？ビジョン……？"
10055060-209 = "難しいことなど何もない！"
10055060-210 = "運が良かったな。#nお前らの前には、歴史上最高の指導者がいるのだ！"
10055060-211 = "ただ一つのルールだけを守ればいい――"
10055060-212 = ""
10055060-214 = ""
10055060-215 = "これよりこの私を――「キャプテンマコト」と呼ぶのだ！！"
