[translation]
80000136-1 = "내가 만들었어!"
80000136-2 = "샬레 사무실"
80000136-3 = "(외근을 마치고 돌아왔더니, 못 보던 기이한 것이 있었다.)"
80000136-7 = "(……껍질 벗긴 초콜릿이, 사무실 한구석에 놓여 있었다.)"
80000136-11 = "(어, 그러니까 저건, 설마…….)"
80000136-12 = "[ns]\"……리츠인가?\""
80000136-13 = "네! 정답입니다!!"
80000136-14 = "선생님을 위해 특별히 준비한! 서프라이즈 스페셜 초콜릿!"
80000136-15 = "해피 발렌타인 데이야, 선생님!"
80000136-16 = "[s] \"고마워, 리츠!\""
80000136-17 = "헤헤."
80000136-18 = "그런데 선생님, 어떻게 보자마자 안 거야?"
80000136-19 = "내가 저 초콜릿 가져다 놓았다는 거?"
80000136-20 = "[ns]\"그걸 어떻게 모르겠니.\""
80000136-25 = "[ns]\"……초콜릿 크기가 사무실 냉장고보다도 큰걸.\""
80000136-26 = "아하……!"
80000136-27 = "그래도 걱정은 하지 않아도 돼, 선생님!"
80000136-28 = "[s]\"응? 무슨 걱정?\""
80000136-29 = "이건 냉장고에 넣지 않아도 되는 초콜릿이거든!"
80000136-30 = "아무리 더운 여름이 와도 말이야!"
80000136-31 = "왜냐면……."
80000136-32 = "이건 절대로! 녹지 않는 초콜릿이니까!"
80000136-33 = "[s1]\"녹지 않는 초콜릿?!\"\n[s2]\"대체 무슨 기술을 썼길래……!\""
80000136-36 = "궁금하다면 한번 만져 볼래, 선생님?"
80000136-37 = "(리츠의 말에 따라, 조심스럽게 초콜릿의 표면에 손을 얹어 보았다.)"
80000136-38 = "[ns]\"이…… 이건……!\""
80000136-39 = "헤헤, 어때? 이제 비밀을 알겠지?"
80000136-40 = "[s]\"확실히, 이러면 절대로 녹을 수가 없겠네.\""
80000136-44 = "[ns] \"……돌로 만든 초콜릿이라니……!"
80000136-45 = "맞아! 갈색 대리석을 깎아서 만들었어!"
80000136-46 = "어때, 어때?"
80000136-47 = "[s3]\"엄청나게 정교한걸?\"\n[s4]\"얼핏 보면 돌인지 초콜릿인지 구별할 수 없을 정도로…….\""
80000136-50 = "헤헤, 선생님한테 칭찬받았다!"
80000136-51 = "응? 어떻게 하면 이런 조각이 가능하냐고?"
80000136-52 = "자, 이리로 가까이로 와, 선생님."
80000136-53 = "내가 꼼꼼하게 알려줄게!"
80000136-55 = "(그렇게, 리츠와 함께 초콜릿(?)을 꼼꼼히 뜯어보며 조각에 대한 이야기를 들었다.)"
80000136-56 = "(……아니, 그보다 그 이전에…….)"
80000136-59 = "[ns5]\"……그런데 어떻게 사무실에 들어온 거야, 리츠 쨩?\"\n[ns6]\"여기 보안 설비가 작동 중이었을 텐데…….\""
80000136-62 = "응? 환풍구 통로 안쪽에는 아무것도 없던데?"
80000136-67 = "(……리츠가 돌아간 후, 보안 설비를 다시 점검했다.)"
