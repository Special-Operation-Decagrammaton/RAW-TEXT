[translation]
80000027-1 = "빈자의 초콜릿"
80000027-2 = "구교사 227호 인근 폐허"
80000027-6 = "실패했어요……."
80000027-7 = "이번 발렌타인 데이를 기념해서 선생님께 초콜릿을 선물하고 싶었는데……."
80000027-8 = "구교사에서는 도저히 초콜릿은커녕, 초콜릿의 원재료도 구할 수가 없어서……."
80000027-13 = "이것밖에 구하지 못했어요……."
80000027-14 = "[s] \"이건…… 카카오 열매?\""
80000027-15 = "네. 급양부에 아는 친구가 있었거든요."
80000027-16 = "그래서 <체룐카>를 만드는 데 들어가는 카카오 열매를 특별히 부탁해서 받아왔는데……."
80000027-17 = "이것만으로는 어떻게 초콜릿을 만들지 감도 오지 않아서……."
80000027-18 = "우으…… 역시 실망하셨겠죠. 초콜릿 하나도 제대로 선물해주지 못하는 저 같은 학생은……."
80000027-19 = "[s] 카카오 빈을 씹는다."
80000027-23 = "자, 잠깐만요. 선생님, 그거 생으로 먹으면 엄청나게 쓰다고요?"
80000027-24 = "최소한 더운물에 덥히거나 볶아서 먹지 않으면……."
80000027-25 = "[s] \"노도카의 진심이 담긴 초콜릿이니까 괜찮아.\""
80000027-26 = "제 진심이 담긴 초콜릿……."
80000027-27 = "선생님은 이런 물건도 초콜릿이라고 해 주시는군요."
80000027-28 = "역시…… 제가 좋아하는 선생님이에요."
80000027-32 = "선생님, 저 결심했어요."
80000027-33 = "올해는 실패했지만, 내년에는 꼭 카카오 열매뿐만 아니라 버터와 설탕까지 모두 구해서 제대로 된 초콜릿을 선물해 드릴게요!"
80000027-34 = "[s] \"그냥 초콜릿을 구하는 게 더 빠르지 않을까……?\""
80000027-36 = "(이후, 카카오 열매의 답례로, 맛도 볼 겸 노도카에게 고급 초콜릿을 잔뜩 선물해주었다.)"
80000027-37 = "(부담이 되었는지 노도카는 반도 채 먹지 못하고 남겼다…….)"
