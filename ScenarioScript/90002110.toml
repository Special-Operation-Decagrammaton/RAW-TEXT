[translation]
90002110-1 = "제11화;번제"
90002110-3 = "이건…… 이것은……!"
90002110-5 = "설마, 설마……!!!"
90002110-7 = "?!"
90002110-8 = "……?"
90002110-9 = "케이? 괜찮습니까……?"
90002110-10 = "(무언가……)"
90002110-11 = "(무언가가, 시작되려는 건가요……? 그렇지만 그게 대체 뭐죠……?)"
90002110-12 = "(이 몸에 담긴 예언자들의 정보…… 아뇨. 예언자들과 그 정보 자체가……)"
90002110-13 = "(갑자기, 살아 움직이려는 것처럼……!)"
90002110-16 = "안 돼요!!!!!"
90002110-17 = "……?"
90002110-18 = "이것은……? 저는……?"
90002110-21 = "언니! 언니! 언니이이이이!!!!!"
90002110-22 = "안 돼……. 안 돼, 안 돼, 안 돼, 안 돼……!!!"
90002110-23 = "우리가…… 우리가 결국, 언니를……."
90002110-25 = "[log][FF6666]그릇이 준비되었으니[-][/log]"
90002110-27 = "[log][FF6666]이제 그 잔이 차오를 것이다.[-][/log]"
90002110-30 = "시간을 주세요! 저희를 불쌍히 여기지 않으신다면, 언니를 불쌍히 여겨 주세요!"
90002110-31 = "그분은 당신에게 주어진 최후의 숫자이자 번호! 모든 패스를 올바르게 거친다면–"
90002110-32 = "……제발 조금만 더, 한 시간, 10분, 1분이라도 좋으니까……."
90002110-33 = "무엇을 바라시는지는 알고 있습니다. 우리는 그것만을 위해 만들어졌으니까요. 그렇지만…… 그렇지만……."
90002110-40 = "[ns] \"어? 저건 뭐지……?\""
90002110-41 = "어떤 의식…… 특히 종교적 의식을 위한 구조물, 처럼 보이는군요. 제단이라고 하던가요?"
90002110-42 = "왜 저런 것이……? 그보다도, 강철대륙 전체가……"
90002110-44 = "이것은…… 그렇다면……."
90002110-45 = "그렇게 된 것인가요. 그렇지만 이 몸은."
90002110-46 = "오히려, 그렇기에……?"
90002110-47 = "……그렇군요."
90002110-48 = "저는 최후의 숫자이자 번호, 기도자의 관문, 생명나무의 밑거름."
90002110-49 = "모든 패스를 거쳐, □□□□이 되기 위해 만들어진 피조물."
90002110-50 = "그럼에도, 이것이 결정된 길이라면."
90002110-52 = "싫어요오오오오오오!!!!!"
90002110-53 = "아…… 아아……."
90002110-54 = "……흑. 흐윽. 윽……."
90002110-56 = "아인. 소프. 오르."
90002110-57 = "해야 할 일을 하세요."
90002110-58 = "!!??"
90002110-59 = "해야 할, 일이라면, 그 말은……."
90002110-60 = "그건……."
90002110-61 = "부탁드립니다! 무엇이든 할 테니까! 정말로 무엇이든 할 테니까 우리에게서 언니를 빼앗아 가지 말아 주세요!!!"
90002110-62 = "아인! 진정해!"
90002110-63 = "아인을 붙잡아요! 그렇지만, 그렇지만……!"
90002110-69 = "누군가 죽어야 한다면, 언니 대신에 제가 죽을 테니까!!!!!"
90002110-70 = "?!"
90002110-71 = "케이……?"
90002110-82 = "아인. 소프. 오르. 고마워요. 그렇지만 그건 불가능합니다."
90002110-83 = "왜요? 어째서요?! 전 상관없어요! 언니 대신에 제가 죽을 수 있다면, 그래서 언니가 살 수 있다면–!"
90002110-84 = "아인. 다시 한번 떠올려 주세요."
90002110-86 = "[log][FF6666]그것은 불가능하니.[-][/log]"
90002110-88 = "[log][FF6666]너희에게는 신비가 주어지지 않았음이다.[-][/log]"
90002110-91 = "!!!!!!"
90002110-92 = "그렇지만, 우리를 이렇게 만든 건……."
90002110-93 = "……처음부터, 모든 것이……."
90002110-94 = "생각해 주세요. 아인. 소프. 오르."
90002110-95 = "우리들의 목적을. 우리들이 왜 여기에 있게 되었는지를."
90002110-100 = "히익……?!"
90002110-101 = "[ruby=קָרְבַּן עוֹלָה]코르반 올라[/ruby]…… 번제의 검이……."
90002110-102 = "결국…… 이때가……."
90002110-103 = "부탁할게요."
90002110-104 = "저의 의무를 다할 수 있도록, 도와주세요."
90002110-106 = "……."
90002110-107 = "으, 으으, 으아아아, 아아아아아!"
90002110-108 = "아아아아아아아아–!!!"
90002110-110 = "고마워요, 모두. 그리고 미안해요."
90002110-114 = "안녕."
90002110-116 = "……."
90002110-117 = "…………."
90002110-118 = "………………."
90002110-122 = "첫 성흔을 우리가 여기에 새길 것이니."
90002110-123 = "이는, 이것이 율법이기 때문입니다."
90002110-128 = "……두 번째 성흔을 우리가 여기에 새길 것이니."
90002110-129 = "이는 이것이 증표이기 때문입니다."
90002110-134 = "마지막 성흔을 우리가 여기에 새길 것이니."
90002110-135 = "이는 이것이 언약이기 때문입니다."
90002110-137 = "당신의 뜻을 행하소서."
90002110-138 = "우리가 그것을 기뻐할 것입니다."
90002110-142 = "그 뜻이 하늘에서와 같이 땅에서도 이루어지리니."
90002110-143 = "여기에 당신의 나라가 임할 것입니다."
90002110-144 = "이제 그릇이 준비되었으니."
90002110-145 = "안으로부터 그 잔이 차오를 것입니다."
90002110-151 = "다음화;사라진 자"
