[translation]
83301300400-7 = "……그런 이유로 이로하. 네게 카스미의 행방을 묻고 싶어."
83301300400-12 = "아아…… 그랬죠. 만마전이 온천개발 발주를 넣었을 때, 마코토 선배가 직접 대면계약을 했었으니."
83301300400-13 = "아니, 본인이 알려주면 되었을 일을 빙빙 돌리면서 말해주지 않는다는 건가요. ……진짜 귀찮아."
83301300400-14 = "후우, 마코토 선배가 계약 당시 향했던 아지트 장소라면, 제가 알려드릴게요."
83301300400-15 = "여기서 그리 멀지 않아요. 그러니까, 지도에서 보자면 이쪽에……."
