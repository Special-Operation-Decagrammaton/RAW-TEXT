[translation]
203-1 = "환희의 복제"
203-3 = "기저, 모든 감정은 까마득한 근원의 복제로 존재해 왔다고 한다."
203-4 = "기쁨, 환희, 열망, 분노…… 모두 다 무언가의 복제라는 인식이지."
203-6 = "예술가로서, 그런 인식은 나에게 영감을 준다. 이 영감이 나를 어디로 이끌지는 알 수 없으나…… 깊은 고양감으로 가득 찬……."
203-7 = "……."
203-8 = "……실례했군."
203-9 = "반갑다. 선생이여. 이런 흉한 몰골이지만, 반겨주었으면 한다."
203-10 = "나는 그대의 친구는 아니지만, 적도 아니며, 그대의 조력자는 아니지만, 방해자 또한 아니다."
203-11 = "나는 마에스트로. 지금은 게마트리아에서 그렇게 불리고 있다."
203-14 = "이 폐쇄된 유원지에는 수많은 사람들의 즐거움이, 환희가 담겨 있다. 그리고 그것들이 [ruby=미메시스]복제[/ruby]되어 지금 이곳에 현현했다."
203-15 = "고장나서 버려진 어뮤즈 돌에 마침내 의미가 생긴 것이지."
203-16 = "나는 그것들을 미메시스라고 부른다. 신비의 양면성으로서 [ruby=테러]공포[/ruby]의 속성을 가진, 환희의 복제품이다."
203-19 = "부디, 갈채를 내려주길 바란다. 선생이여."
