[translation]
10038095-4 = "으아아! 언제까지 갇혀 있어야 하나 걱정이었던 것이다! 감사를 표하는 것이다, 문주……."
10038095-6 = "건강해 보이는구나. 시간이 없으니, 어서 걸음을 서두르도록 하자."
10038095-7 = "걸음을 서둘러……? 어디로?"
10038095-8 = "그야 당연히, 연단방이 아니겠느냐."
10038095-12 = "?! 그렇지만 너무 무리하고 있는 것 아니냐? 문주는……."
10038095-16 = "괜찮은 것이냐? 문주의 몸은……."
10038095-17 = "후후……. 그런 것을 신경 쓰고 있었는가."
10038095-18 = "지금은 그보다도 중요한 일이 있지 않겠느냐. 우선 그대의 연단방을 되찾아야 할 것이야."
10038095-22 = "앞서가겠다. 따라오도록 하거라."
10038095-28 = "무, 문주?! 문주!?"
10038095-33 = "문주님께 무슨 일이라도 있습니까?"
10038095-34 = "그러게. 연단방을 되찾게 해 준다잖아. 그렇게 당황할 필요가 있어?"
10038095-39 = "그, 그건……!"
10038095-40 = "아니다. 역시 아무것도 아닌 것이다!"
10038095-45 = "(문주의 몸 상태가 걱정되기는 하지만…….)"
10038095-46 = "(연단방을 되찾아야, 이런저런 단약들을 만들 수 있는 것도 사실이기는 하니…….)"
