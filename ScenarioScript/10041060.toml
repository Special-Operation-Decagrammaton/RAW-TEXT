[translation]
10041060-1 = "제6화;빅 시스터 룸"
10041060-7 = "빅 시스터 알고리즘이라……."
10041060-9 = "말하자면……. 나의 과오 같은 거지. 원래라면 절대 사용할 생각이 없는 물건이었지만."
10041060-10 = "과오……?"
10041060-11 = "네 입에서 스스로 '과오' 같은 말이 나올 줄은 몰랐는데."
10041060-12 = "사실이니까. 지금의 나라면 절대로 하지 않을 행위지만, 그때의 나는 서슴지 않았지."
10041060-13 = "효율적인 방법만을 좇던 이전의 나라면, 처음부터 네루에게 부탁하지도 않았을 테고……."
10041060-14 = "바로 빅 시스터 알고리즘의 감시망에서 찾았겠군요. 이곳에 온 모두의 신상 정보를 무단으로 확인해서."
10041060-15 = "……밀레니엄을 떠날 때 철저히 차단 후 격리시켰고, 이후로도 두 번 다시 열 생각은 없었어."
10041060-16 = "하지만 지금은 방법이 없어. 일이 손을 완전히 떠나기 전에 해결하기 위해선, 그것만이 유일한 방법이야."
10041060-17 = "그걸 다시 쓰는 일에 대한 건 전적으로 내 결정이고 내 탓이니……."
10041060-22 = "두 사람은 신경 쓰지 않아도 돼. 혹은, 이만 돌아가도 좋아."
10041060-27 = "……? 뭐?"
10041060-28 = "아니, 아니. 잠깐만. 돌아가라니? 그게 무슨 소리야?"
10041060-30 = "이런 '죄'에 두 사람은 관계없으니까. 이건 온전히 내 죄에 대한 일이니까."
10041060-31 = "그걸 물은 게 아니잖아. 내가 돌아가면, 저건 누가 쓰는데?"
10041060-32 = "그러니까 이제부터는 내가……."
10041060-33 = "네가 거기를 찾아가겠다고? 데이터 센터 안에 있다고 했던 그곳으로?"
10041060-37 = "루트라면 네루 네가 다녀온 길을 통해 어느 정도 확보해 두었어. 불가능한 일은 아니야."
10041060-38 = "그리고 일반적으로 빅 시스터 룸에 들어가기 위해서는, 내 생체 인증 정보가 필요해. 그게 없이 들어가려면 일은 훨씬 더 복잡해져."
10041060-39 = "물론 내 인증을 통해 들어간다면, 내가 다녀갔다는 기록이 데이터 어딘가에 남겠지만……. 지금은 그걸 생각할 때가 아니니까."
10041060-44 = "그건 이 모든 일의 범인으로 당신이 지목될 수도 있다는 뜻이에요, 리오."
10041060-45 = "알아. 그건 중요하지 않아."
10041060-46 = "중요해요."
10041060-50 = "엔지니어부 때도, 게임개발부 때도 이미 당신이 의심받을 수 있는 상황이에요."
10041060-51 = "……그렇지만 이건 내 죄야."
10041060-52 = "이 이상 다른 사람들에게 리스크를 지게 만들 수는 없어."
10041060-57 = "얼씨구."
10041060-62 = "얼씨구……?"
10041060-63 = "정말이지 실망이네요, 리오 씨."
10041060-64 = "……실망?"
10041060-65 = "네. 또 그런 모순되는 말로 저를 떼어 놓으시려는 건가요?"
10041060-66 = "이전에는 없는 게 낫다더니, 이제는 관계가 없는 사람 취급이네요."
10041060-67 = "저를 위한 배려라는 것도 한 번은 이해하지만, 두 번이면 서운해질 수밖에 없어요."
10041060-68 = "……!? 무슨 이야기지? 이건 그런 뜻이……."
10041060-73 = "실컷 귀찮은 거 다 부려 먹어놓고, 이제 와서 혼자 대단한 희생자처럼 굴지 말라고. 그런 걸 포함해서 네가 재수 없단 소릴 듣는 거야."
10041060-77 = "재, 재수……."
10041060-79 = "아무래도 지금은 저희의 생각이 같은 거 같네요."
10041060-80 = "아아. 여기서는 달리 다른 생각을 할 수 없지."
10041060-85 = "그게 무슨 말이지? 같은 생각이라니?"
10041060-86 = "어쩌면 저답지 않을 수 있지만, 여기선 단도직입적으로 말씀드리겠습니다."
10041060-92 = "저희는 리오 씨를 믿을 수 없어요."
10041060-96 = "……!?"
10041060-97 = "믿을 수 없어……?"
10041060-98 = "못 믿지. 믿을 수 있겠냐고. 잘도 안 걸리고 들어가겠다."
10041060-99 = "내가 다녀온 루트를 보고 참고해? 길만 외우면 다 되는 거라고 생각하냐, 진짜?"
10041060-100 = "솔직히 말하지. 너보다는 차라리 여기 이 아가씨……."
10041060-101 = "세이아. 유리조노 세이아입니다."
10041060-102 = "세이아가 훨씬 더 가능성 있어."
10041060-104 = "그, 그건……."
10041060-106 = "리오. 당신을 위해 조금 강하게, 단도직입적으로 이야기할게요."
10041060-107 = "당신은 지금 사적인 감정에 치우쳐 작전을 망치려 하고 있어요. 지금 해야 할 일이 잠입이라면, 당신이 아니라 저희가 해야 할 일입니다."
10041060-108 = "이제 와서 그 기계가 당신의 작품이라는 이유만으로, 저희를 배제한다는 건 말이 안 돼요. 그건 작전과 관계가 없습니다."
10041060-109 = "아아, 말 한번 잘했어. 내 말이 저 말이야."
10041060-110 = "들어가는 건 우리야. 들어가서 그 녀석들의 위치를 찾아내고……."
10041060-111 = "이번에는 '확실하게' 너의 그 기분 나쁜 기계를 폐기시켜 주도록 하지."
10041060-112 = "그래야 나도, 이쪽……. 세이아도."
10041060-116 = "그리고 너도 마음이 편하겠지. 안 그래?"
10041060-121 = "……!!"
10041060-122 = "이 방식이 아니면 안 됩니다. 이 방식이 아니면 리오, 당신은 이번 일이 끝나도 이번 일을 끝내지 못한 게 돼요."
10041060-123 = "오늘 하루 대화를 해본 결과, 유감스럽게도 저는 당신이 굉장히 피곤한 성격을 가진 사람이라는 결론을 내렸거든요."
10041060-124 = "저도 사람 피곤하게 하는 데에는 일가견이 있지만……. 저 이상으로 말이죠."
10041060-126 = "눈썰미 좋네."
10041060-127 = "두 사람……."
10041060-128 = "상황이 촉박합니다. 자세한 이야기는 가면서, 혹은 다 끝난 뒤에 하도록 하죠."
10041060-129 = "시원시원해서 좋네. 원래 성격은 이쪽이었어?"
10041060-130 = "아쉽지만 아닙니다. 원래는 조금 더 주변 분들을 기분 나쁘게 하는 말투거든요."
10041060-131 = "……궁금하시면 이번 일 다 끝난 뒤에, 조금만 보여드리도록 하죠."
10041060-132 = "하하! 재밌네, 혹시라도 손찌검 안 나가게 잘 조절하라고."
10041060-134 = "그, 그런……."
10041060-139 = "……??? 야, 뭐해?"
10041060-145 = "……빨리 길 안내 안 하고."
