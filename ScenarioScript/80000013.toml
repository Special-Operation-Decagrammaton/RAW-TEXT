[translation]
80000013-1 = "초콜릿 속의 바다"
80000013-2 = "(호시노와 시내 순찰을 하던 중, 작은 해양 박물관을 발견했다.)"
80000013-3 = "(호기심을 보이는 호시노를 위해 박물관에서 잠시 관람을 하고 나왔다.)"
80000013-5 = "D.U. 내 구립 해양 박물관 앞"
80000013-6 = "헤에, 설마 이런 곳에 해양 박물관이 있었을 줄이야."
80000013-7 = "규모가 크지는 않지만, 그래도 오랜만에 다양한 물고기를 볼 수 있어서 즐거웠어."
80000013-8 = "게다가 사람도 거의 없어서 방해받지 않고 물고기를 더 오래 지켜볼 수 있었고 말이야. 으헤헤."
80000013-9 = "[s] \"즐거웠다니 다행이야.\""
80000013-10 = "아, 출구 근처에서 기념품을 팔고 있네."
80000013-14 = "선생, 이것 봐! 이 해양 박물관에서 전시 중인 물고기를 모티브로 만든 초콜릿 세트래!"
80000013-18 = "이건 불가사리고, 이건 가시복이고……"
80000013-23 = "이건 고래인가? 아하하, 전부 귀여워!"
80000013-24 = "……어라? 그런데 이 수족관에 분명 고래는 없지 않았던가?"
80000013-25 = "어째서 고래 모양의 초콜릿이 들어있는 거지……."
80000013-26 = "[s1] \"고래가 귀여우니까 그런 게 아닐까?\"\n[s2] \"……어른의 사정이 아닐까.\""
80000013-27 = "음…… 선생 말이 맞아. 고래는 귀여운 생물이니까."
80000013-28 = "물고기 모양 초콜릿을 만든다면 절대로 빠트릴 수 없지. 으헤."
80000013-29 = "으헤, 그런가……."
80000013-30 = "아저씨는 요즘 사람이 아니라서 그런 건 잘 모르겠어……."
80000013-31 = "그래도 물고기 초콜릿 하나 정도는 기념으로 사갈까."
80000013-36 = "자, 선생. 받아."
80000013-37 = "선생에게도 기념으로 하나 나누어 줄게."
80000013-38 = "[s] \"내가 고래 모양 초콜릿을 받아도 괜찮아?\""
80000013-39 = "괜찮아, 괜찮아."
80000013-40 = "어차피 맛은 다 똑같으니까, 뱃속에 들어가면 상관없어진다고. 으헤헤."
80000013-41 = "물론 고래 모양의 기념품이 가장 애착이 가는 건 사실이지만……"
80000013-42 = "그러니까, 선생이 받아줬으면 좋겠어."
