[translation]
10034005-1 = "프롤로그;부족하지 않아?"
10034005-4 = "[log=???]그건 좀 부족하지 않아?[/log]"
10034005-8 = "……응?"
10034005-9 = "아, 미안. 미안. 잠시 딴생각을 좀 하느라……. 뭐라고 그랬어?"
10034005-10 = "조금 부족한 거 아니냐고. 방금 말한 그 <디저트 카페>말이야."
10034005-11 = "물론 나쁘다는 건 아니지만 말이야. 애초에 아이리는 디저트부이기도 하고."
10034005-16 = "그렇지만 보통 이런 학원제에서 '카페'라고 하면 말이지……. 조금 더 특이한 걸 하잖아?"
10034005-17 = "디저트가 나오는 거야 모든 카페가 다 마찬가지라고 할 수도 있으니까."
10034005-18 = "그치, 그치. 이왕이면 조금 개성 있는 걸 더해보는 게 어떠냐는 거지."
10034005-20 = "어라……. 그, 그런가?"
10034005-21 = "듣고 보니 그런 거 같기도……."
10034005-22 = "으음……."
10034005-23 = "으으으으으음……!"
10034005-27 = "……뭐 하지? 뭘 하면 좋을까?"
10034005-29 = "그걸 우리에게 물어봐도……."
10034005-30 = "우리 카페도 아닌 걸 우리가 막 정하기는 좀 그런 걸."
10034005-31 = "뭐, 너무 걱정하진 마! 지금대로라도 우린 아이리네 카페 꼭 들러서 자리 채워줄 테니!"
10034005-32 = "맞아, 맞아. 매출은 걱정하지 말라고! 애들 데리고 가서 거덜 내 줄 테니까!!"
10034005-34 = "아하하하……. 고마워, 나도 너희들 쪽 카페 꼭 들러서……."
10034005-38 = "아. 내릴 역이다. 큰일날 뻔했네."
10034005-39 = "그럼 나머지는 나중에! 나 먼저 간다!"
10034005-41 = "그래~. 조심해서 들어가~."
10034005-42 = "내일 보자! 그렇다고 또 너무 신경 쓰지는 말고!!"
10034005-44 = "응!!"
10034005-46 = "역 앞 광장"
10034005-50 = "으음……."
10034005-54 = "…………."
10034005-56 = "그건 좀 부족하지 않아?"
10034005-59 = "하아……."
10034005-60 = "역시 이 정도로는 부족하려나. 어디서나 볼 법 한 느낌이고……."
10034005-61 = "보통은 뭐라도 한 가지 특이한 걸 가지고 있으니……."
10034005-65 = "으음……."
10034005-66 = "그럼 나는 뭘 해야 더……."
10034005-72 = "……? 기타 소리……?"
10034005-73 = "누가 거리 공연이라도 하고 있는 걸까?"
10034005-74 = "…………"
10034005-75 = "……아. 저기다."
10034005-76 = "…………."
10034005-77 = "……………………."
10034005-86 = "밴드?"
