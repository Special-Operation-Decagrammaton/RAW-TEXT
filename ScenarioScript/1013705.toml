[translation]
1013705-1 = "The Detective's Dress"
1013705-2 = "Yoohoo! There you are, Sensei!"
1013705-3 = "You weren't followed? No tail? The public absolutely can't find out about this."
1013705-4 = "[s1] \"But I don't...have a tail?\"\n[s2] \"What is going on here?\""
1013705-7 = "Let's go inside, where it's more discreet. There are too many eyes out here."
1013705-8 = "Ah. And, as I said... Everything you see from here on out is top secret."
1013705-9 = "Just like the countless secrets you've already forgotten about, you need to forget this one too."
1013705-10 = "[s] \"O-Oookay...!\""
1013705-15 = "What the—! Who's this?"
1013705-16 = "Hello, I've been well. Thank you so much for asking. "
1013705-17 = "They're a customer. Don't worry. I can vouch for their discretion."
1013705-18 = "After all, I wouldn't want anyone dulling the shine of my hidden gem, would I?"
1013705-19 = "Shima Konoka! There you go with that nonsense again!!"
1013705-24 = "A clothing store WANTS to be talked about!!"
1013705-25 = "Eh. But I like shopping here."
1013705-26 = "Exactly! So PLEASE spread the word more!"
1013705-28 = "[ns] \"This place...is a clothing store?\""
1013705-29 = "Bingo! It's THE place to go if you want to get aloha shirts."
1013705-30 = "From vintage to new releases, everything is organized by color! This place really is a hidden gem."
1013705-31 = "You!!! YOU are the one keeping it hidden!"
1013705-32 = "C'mon, I buy enough for at least 10 customers every time I stop by. Isn't that enough?"
1013705-33 = "If trend hunters started coming through here, I'd lose out on this direct line I have to rare and unique pieces!"
1013705-34 = "You! You're Sensei, from Schale! Please feel free to recommend us to anyone you can! Actually, I'm begging you to."
1013705-35 = "I'll be there to stop Sensei from saying a word! BLEH!"
1013705-36 = "Are you a police officer or a thug?!"
1013705-37 = "But still, she's right. There aren't many people out there who appreciate the profound world of aloha shirts."
1013705-38 = "It is nice when you have a clientele that understands that."
1013705-39 = "I knew you'd get it. We'll look around then."
1013705-40 = "It's timeee! Let's find some new friends to take home, heeheehee!"
1013705-44 = "Hmm hmm... When Valkyrie arrives, the Helmet Gang cries...!"
1013705-48 = "And if you run away... You will dieee!  "
1013705-49 = "Ugh, I like the color placement...but the balance is awful, you're out!"
1013705-50 = "[ns3] \"You're well versed in aloha shirts, Konoka.\"\n[ns4] \"Have you always liked them?\""
1013705-53 = "Huh? No. I didn't at all before."
1013705-54 = "I just wasn't interested in wearing them. I kinda hated them, you could say."
1013705-55 = "It was after joining Valkyrie that I finally understood the true potential of the aloha shirt."
1013705-56 = "Are you curious how that happened?"
1013705-57 = "[s] \"How did you learn that from—*gasp*!\""
1013705-58 = "Kyah! Believe it or not, I AM the Deputy Director. I can see through everything."
1013705-59 = "Let's see... When was it..."
1013705-60 = "Ah, I must've been a first year. I'd enrolled because I heard you'd get praised for beating up thugs there."
1013705-61 = "When I first got there, all I knew were fists and bullets. We were all assigned mentors. Mine was the silent type, but also a total nag. She was the bane of my life at one point..."
1013705-62 = "Once, we were checking up on a report when, would ya believe it? It was a trap. I don't even know how many of them ganged up on us."
1013705-63 = "We ended up winning in the end, and they tried to call the police on us! Hah. We were total wrecks, all torn up and bloodied."
1013705-64 = "[s] \"They called the police on the police?\""
1013705-65 = "My mentor walked a fine line between being a criminal and a Valkyrie officer."
1013705-66 = "Anyways, I couldn't go back home like that, so I wanted to change, at least. And this was the only clothing store that was open."
1013705-67 = "Aloha here, aloha there, aloha, aloha, aloha! I don't know why, but it cracked me up!"
1013705-68 = "I first thought she was wearing an aloha shirt because her white shirt was such a mess!"
1013705-69 = "Wow, we even have a vivid testimony from the witness!"
1013705-70 = "So, my mentor and I had no choice but to return in aloha shirts. I thought it actually looked pretty good on me, so I've been wearing them since. And it helps with investigations!"
1013705-74 = "Oh! This is it! I always wanted one with ducks!"
1013705-75 = "There's an extra one right here, so I'll get you the same one too, Sensei. A little gift from me to you!"
1013705-76 = "I'm leaving, boss! Make sure to keep these two for me."
1013705-77 = "Two, got it! I'm sure it will look good on you, Sensei."
1013705-78 = "[s] \"What about the payment?\""
1013705-79 = "The investigator lady paid for about 300 shirts in advance, saying she doesn't want to carry her wallet around."
1013705-80 = "Please come again, and make sure to recommend this place to others!"
1013705-82 = "Kyah! Shopping really is the best!"
1013705-83 = "Please keep this a secret between us. You are only allowed to come here with me."
1013705-84 = "It felt nice reminiscing. I even miss the rough times with my mentor."
1013705-85 = "I really should've taken a photo of Sis in her aloha shirt back then... What a shame."
1013705-86 = "[s] \"'Sis'? Does that mean your mentor was...?!\""
1013705-87 = "Eh? Wasn't obvious? Who else could it be?"
1013705-88 = "I really have to give credit to the higher ups back then. They're the ones who came up with the idea of putting the Feral Hound together with a thug."
1013705-89 = "Well, I'll catch you later! Make sure to wash that before you wear it!"
1013705-90 = "Bye bye!"
1013705-92 = "Konoka disappeared around the corner with a smile."
