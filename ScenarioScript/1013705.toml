[translation]
1013705-1 = "那位刑警的禮服"
1013705-2 = "哈囉～老師。"
1013705-3 = "沒有被跟蹤吧？這可是不能外流的機密情報呢。"
1013705-4 = "[s1] 「應該沒問題……？」\n[s2] 「到底是什麼樣的情報……？」"
1013705-7 = "這裡人太多不太方便，我們先進去吧。"
1013705-8 = "啊，就像我之前說的，接下來老師看到的全都是祕密哦。"
1013705-9 = "就像過去那些早已被遺忘的秘密一樣，老師也必須把這件事徹底忘記才行。"
1013705-10 = "[s] 「嗯，嗯……！」"
1013705-15 = "怎麼，這次又帶誰過來了啊？"
1013705-16 = "啊，我過得很好哦，感謝關心。"
1013705-17 = "我帶客人來了。#n放心，他絕對不會走漏消息的。"
1013705-18 = "這裡依然是只有少部分的人才知道的名店。"
1013705-19 = "志真木乃香……你又自作主張……！！！"
1013705-24 = "我這裡可是服飾店啊！沒有人氣是要怎麼經營！？"
1013705-25 = "哎呀～我不是買了很多嗎～？"
1013705-26 = "拜託讓這裡成為大家都知道的名店吧！！"
1013705-28 = "[ns] 「這裡……是服飾店嗎？」"
1013705-29 = "沒錯。據我所知，沒有比這裡更好買花襯衫的地方了。"
1013705-30 = "從二手到新品都有，而且還依照顏色精心排列……可說是個隱藏聖地哦。"
1013705-31 = "才沒有隱藏！！想隱藏的只有你一個人好嗎！？"
1013705-32 = "我不是每次過來都會貢獻10人份的銷量嗎？你就別生氣了嘛～"
1013705-33 = "要是一堆閒雜人等跑來把消息傳開，跟我搶稀有襯衫的競爭對手可是會增加的耶。"
1013705-34 = "您是夏萊的老師對吧？儘管幫我宣傳沒關係！#n不，拜託您務必幫我這個忙！"
1013705-35 = "我不會讓你得逞的！略略略～！"
1013705-36 = "唉……這到底是警察還是流氓啊……！"
1013705-37 = "不過……你說的倒也沒錯。#n能理解花襯衫優點的人確實不多。"
1013705-38 = "就像這位小姐說的，或許只介紹給有品味的客人也不錯吧。"
1013705-39 = "其實老闆心裡也覺得還不錯嘛。#n那麼，我就來慢慢逛吧～"
1013705-40 = "讓我看看～今天要帶哪些新朋友回家呢～？"
1013705-44 = "哼哼～警察一出現～頭盔團就流淚～"
1013705-48 = "敢逃跑的話～就死定了～"
1013705-49 = "唔嗯，顏色搭配得還算不錯……不過整體的平衡太差了，淘汰！"
1013705-50 = "[ns3] 「木乃香對花襯衫很了解呢。」\n[ns4] 「你從以前就很喜歡嗎？」"
1013705-53 = "以前嗎？其實不是耶。#n我之前從來沒有穿過這種衣服。"
1013705-54 = "不但沒什麼興趣，硬要說的話甚至還有點不太喜歡？"
1013705-55 = "真正開始發現並迷上花襯衫的魅力，已經是來到女武神之後的事了。"
1013705-56 = "怎麼了，老師很好奇嗎？我開始穿上花襯衫的原因。"
1013705-57 = "[s] 「那你開始穿上花襯衫的原因是……咦！！」"
1013705-58 = "哈哈！別看我這樣，好歹也是個副局長。#n那種事我一眼就能看出來了。"
1013705-59 = "話說～那是什麼時候的事呢……"
1013705-60 = "嗯……大概是一年級的時候吧。#n我聽說有間學校只要把討人厭的混混揍扁就能獲得表揚，所以一入學就跑過來了。"
1013705-61 = "因為除了打架和開槍之外什麼都不懂，#n所以就跟其他人一樣被安排了一位負責指導的前輩。#n雖然他平時話不多卻很愛說教，真的很讓人頭痛……"
1013705-62 = "之後有一天收到通報，我們兩個人就一起出勤……結果發現根本是個陷阱。#n才剛抵達現場就遭到了一群人的圍毆。"
1013705-63 = "雖然還是打贏了他們，但是制服也變得破破爛爛的，看起來就跟遊民沒兩樣。#n話說，後來那些傢伙甚至還打算要報警呢。"
1013705-64 = "[s] 「都被警察打了還報警……？」"
1013705-65 = "畢竟我的那位前輩比起「人民的保母」，或許更接近「人民的警棍」吧……"
1013705-66 = "總之，因為那副德性實在沒辦法直接回去，我們就打算先換件衣服……#n結果當時有在營業的服飾店就只有這裡而已。"
1013705-67 = "無論左看右看全都是花襯衫、花襯衫、花襯衫！那時候真的超好笑的！"
1013705-68 = "你那天穿的白襯衫實在破得亂七八糟，我一開始還以為是件花襯衫咧。"
1013705-69 = "哎呀～有當事人在場提供第一手的證詞，故事說起來就更有臨場感了呢！"
1013705-70 = "總之，因為當時實在沒有其他辦法，我跟前輩只好一起穿著花襯衫回去報到。#n後來照鏡子發現還挺適合的，所以就一直穿下去了。而且調查的時候也意外地方便。"
1013705-74 = "哦！就是這個！我正好想要一件鴨子圖案的呢！"
1013705-75 = "這裡剛好還有一件同款的，就當作我送給老師的禮物吧！"
1013705-76 = "老闆，那我先走啦！這兩件再麻煩你囉。"
1013705-77 = "好的，兩件沒問題～老師感覺也很適合呢～"
1013705-78 = "[s] 「不用先結帳嗎？」"
1013705-79 = "因為這位刑警小姐說帶錢包很麻煩，所以已經預付大約300件的錢了。"
1013705-80 = "歡迎再來光顧，店面的宣傳也多多拜託了！"
1013705-82 = "哈啊～血拚果然最棒了～！！"
1013705-83 = "這是我們之間的祕密，絕對不可以說出去哦。#n還有來的時候也只能跟我一起來。"
1013705-84 = "久違回憶一下往事，感覺真不錯呢。#n我也有點懷念那段跟前輩一起打滾的時光。"
1013705-85 = "那時候應該把大姐頭穿花襯衫的模樣拍下來的……真可惜。"
1013705-86 = "[s] 「大姐頭？難道你說的那個前輩就是……！？」"
1013705-87 = "咦？這不是理所當然的嗎？除了那個人之外還能是誰啊？"
1013705-88 = "當時的高層居然能想出讓狂犬跟混混組成搭檔的點子，不得不說還挺有一套的呢。"
1013705-89 = "那就下次見囉。衣服記得一定要先洗過再穿哦！"
1013705-90 = "掰掰～"
1013705-92 = "（之後木乃香帶著燦爛的笑容，悠閒地消失在了巷子的另一頭）"
