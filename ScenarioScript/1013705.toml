[translation]
1013705-1 = "ชุดทำงานของตำรวจ"
1013705-2 = "อ้าว! มาแล้วเหรอคะ คุณครู"
1013705-3 = "ไม่ได้มีใครติดสอยห้อยตามมาใช่มั้ยคะ? ข้อมูลนี้น่ะ ถ้าใครรู้เข้าจะเป็นเรื่องใหญ่นะคะ"
1013705-4 = "[s1] \"ครูก็... มาคนเดียวอยู่แล้วนะ?\"\n[s2] \"ตกลงนี่มันข้อมูลอะไรกัน...?\""
1013705-7 = "จะให้พูดตรงนี้มันไม่เหมาะสมค่ะ เข้าไปก่อนเถอะค่ะ ตรงนี้มีสายตาจับจ้องหลายคู่นะคะ"
1013705-8 = "อ้อ สิ่งที่จะได้เห็นตอนเข้าไปคือความลับนะคะ"
1013705-9 = "แล้วคุณครูก็ต้องลืมมันไปให้ได้ เหมือนความลับมากมายที่ถูกลืมเลือนไปค่ะ"
1013705-10 = "[s] \"อะ... อื้อ...!\""
1013705-14 = ""
1013705-15 = "อะไรเนี่ย พาคนอื่นมาด้วยเหรอ?"
1013705-16 = "อ้อ ฉันก็สบายดีค่ะ ขอบคุณที่อุตส่าห์ถามไถ่สารทุกข์สุขดิบนะคะ "
1013705-17 = "ฉันพาลูกค้ามาด้วยน่ะค่ะ แต่วางใจได้เลยนะคะ ลูกค้าคนนี้ไม่มีทางปล่อยข่าวลืออะไรแน่นอนค่ะ"
1013705-18 = "ที่นี่เป็นสถานที่ลับที่มีแต่คนวงในเท่านั้นที่รู้ เพราะงั้นไม่ต้องกังวลนะคะ"
1013705-19 = "ชิมะ โคโนกะ... นี่เธอเอาอีกแล้วนะ...!!!"
1013705-20 = ""
1013705-22 = ""
1013705-24 = "ที่นี่ร้านขายเสื้อผ้านะ จะให้เป็นสถานที่ลับได้ยังไงล่ะ!!!"
1013705-25 = "คุณลุงพ่อค้านี่ละก็ แต่ฉันก็ช่วยซื้อเยอะเลยไม่ใช่เหรอคะ?"
1013705-26 = "ขอให้ร้านนี้เป็นที่รู้จักของคนอื่นบ้างเถอะน่า!!"
1013705-27 = ""
1013705-28 = "[ns] \"ที่นี่คือ... ร้านขายเสื้อผ้าเหรอ?\""
1013705-29 = "ค่ะ ใช่แล้วค่ะ เท่าที่ฉันรู้มา ไม่มีร้านไหนที่หาเสื้อฮาวายสวยๆ ได้เท่าร้านนี้อีกแล้วค่ะ"
1013705-30 = "นี่คือร้านลับที่เป็นแหล่งเสื้อฮาวายตั้งแต่เสื้อมือสองไปจนถึงสินค้าใหม่ แล้วก็จัดเรียงแยกตามสี#nเอาไว้อย่างดีเลยด้วย"
1013705-31 = "ไม่ได้ซ่อนไว้สักหน่อย!! เธอต่างหากล่ะที่เป็นคนซ่อนร้านน่ะ!"
1013705-32 = "แต่ทุกครั้งที่ฉันมา ฉันก็ซื้อกลับไปเป็นสิบๆ ตัวเลยไม่ใช่เหรอคะ? อย่างอนไปเลยค่ะ"
1013705-33 = "ถ้ามีลูกค้าคนอื่นเข้ามาและมีข่าวลือสะพัดออกไปจนเสื้อหายากถูกแย่งไปหมด ก็มีแต่จะเกิดการแข่งขันนะคะ"
1013705-34 = "คุณครูจากชาเล่ต์ใช่มั้ยครับ? คุณครูจะปล่อยข่าวลือและโปรโมตร้านก็ได้เลยนะครับ!#nไม่สิ ช่วยทำอย่างนั้นให้หน่อยนะครับ ขอร้องละ!"
1013705-35 = "ฉันจะขัดขวางไว้เองค่ะ! แบร่!"
1013705-36 = "เฮ้อ เป็นตำรวจหรือพวกอันธพาลกันแน่เนี่ย...!"
1013705-37 = "แต่เธอก็พูดถูกอยู่นะ ก็ที่นี่มีน้อยคนนักที่เข้าใจความลึกซึ้งของเสื้อฮาวาย"
1013705-38 = "การพาลูกค้าที่มีความรู้เฉพาะด้านเข้ามาแบบนี้ก็ไม่เลวเท่าไรหรอก"
1013705-39 = "เห็นมั้ยล่ะ ลุงเจ้าของร้านก็ชอบใจไม่ใช่เหรอ? งั้นฉันจะเดินดูเสื้อละนะ"
1013705-40 = "จะเอาน้องคนไหน~ กลับบ้านไปดีน้า~ "
1013705-41 = ""
1013705-43 = ""
1013705-44 = "ฮืม ฮืม~ ตำรวจลงที่ไหน~ แก๊งหมวกกันน็อกร้องไห้~ ที่นั่น~"
1013705-45 = ""
1013705-47 = ""
1013705-48 = "หนีไป~ ก็ไม่~ รอดหรอก~  "
1013705-49 = "อืม สีก็สวยอยู่หรอก... แต่สมดุลมันไม่ได้เลย ตัวนี้ไม่ผ่าน!"
1013705-50 = "[ns3] \"โคโนกะดูจะชอบเสื้อฮาวายมากเลยนะ\"\n[ns4] \"โคโนกะชอบเสื้อฮาวายมานานแล้วเหรอ?\""
1013705-53 = "เสื้อฮาวายนี่น่ะเหรอคะ? แต่ก่อนฉันไม่เคยใส่เสื้ออะไรแบบนี้หรอกค่ะ"
1013705-54 = "ฉันไม่ได้สนใจเป็นพิเศษ และถ้าจะให้พูดตรงๆ ฉันไม่ชอบมันด้วยซ้ำค่ะ"
1013705-55 = "ฉันได้มาเริ่มใส่และรู้จักคุณค่าที่แท้จริงของเสื้อฮาวายก็หลังจากมาอยู่ที่วัลคิรี่นี่ละค่ะ"
1013705-56 = "คุณครูสงสัยเหรอคะว่าฉันมาใส่เสื้อฮาวายได้ยังไง?"
1013705-57 = "[s] \"ทำไมถึงได้มาใส่... เฮือก!! รู้ได้ไง!\""
1013705-58 = "เดี๋ยวเหอะ เห็นอย่างนี้ฉันก็เป็นถึงรองหัวหน้ากรมฯ นะคะ ฉันมองทะลุปรุโปร่งทั้งหมดนั่นละ"
1013705-59 = "อืม~ งั้นตั้งแต่เมื่อไรกันนะ~"
1013705-60 = "น่าจะตอนชั้นปีที่หนึ่งนะคะ ฉันได้ยินว่ามีโรงเรียนหนึ่งที่ถ้าไปจับตัวพวกนักเลงหัวไม้ได้ ก็จะได้รับคำชม ฉันก็เลยไปสมัคร น่าจะตั้งแต่ตอนนั้นน่ะค่ะ"
1013705-61 = "ตอนนั้นฉันรู้จักแค่การต่อยกับยิงปืน ก็เลยได้พี่เลี้ยงมาประกบคนหนึ่ง เธอเป็นคนพูดน้อยแต่จู้จี้จุกจิกมาก เรียกว่าเป็นพี่เลี้ยงที่ทำให้ปวดหัวได้เลยละ..."
1013705-62 = "มีอยู่วันหนึ่งเราได้รับแจ้งเบาะแส ก็เลยออกปฏิบัติการกัน แต่มันเป็นกับดักนี่สิ พอรู้เข้าพวกฉันก็รุมซ้อมกันเละเลยค่ะ"
1013705-63 = "พวกนั้นพยายามโทรแจ้งตำรวจด้วยนะคะ ถึงพวกฉันจะชนะมาได้ แต่ก็อยู่ในสภาพยับเยินเลย เสื้อผ้าของฉันขาดวิ่นจนดูเหมือนขอทานเลยละ"
1013705-64 = "[s] \"โทรแจ้งตำรวจเพราะโดนตำรวจรุมเนี่ยนะ...?\""
1013705-65 = "พอดีพี่เลี้ยงของฉันทรงเหมือนผู้ทำลายสันติราษฎร์ มากกว่าผู้พิทักษ์สันติราษฎร์น่ะ..."
1013705-66 = "เอาเป็นว่าฉันกลับไปในสภาพนั้นไม่ได้ ก็เลยคิดว่าจะหาเสื้อเปลี่ยนสักหน่อย แต่แถวนั้นก็มีร้านเสื้อผ้าที่เปิดอยู่ไม่กี่ร้าน"
1013705-67 = "และในร้านที่เปิดอยู่ ไม่ว่าจะมองไปทางไหนก็มีแต่เสื้อฮาวาย เสื้อฮาวาย และเสื้อฮาวาย! ฉันละหัวเราะออกมาเลยค่ะ!"
1013705-68 = "ตอนนั้นเสื้อเชิ้ตสีขาวที่ใส่อยู่มันเลอะเทอะมาก ดูเผินๆ อาจจะคิดว่าเป็นลายของเสื้อฮาวายเลยก็ได้"
1013705-69 = "ฮ่าฮ่าฮ่า ฉันยังจำได้ติดตาเหมือนเรื่องเพิ่งเกิดขึ้นเมื่อวานเลยละค่ะ!"
1013705-70 = "สรุปว่าวันนั้นฉันกับพี่เลี้ยงต้องซื้อเสื้อฮาวายใส่แล้วกลับกันมา แต่พอส่องกระจกก็ได้รู้ว่ามันเหมาะกับ#nฉันทีเดียว ฉันก็เลยใส่เสื้อฮาวายมาตลอดตั้งแต่นั้นมาค่ะ เห็นอย่างนี้มันก็สะดวกกับการสืบสวนดีนะคะ"
1013705-71 = ""
1013705-73 = ""
1013705-74 = "โอ๊ะ! ตัวนี้ละ! กำลังอยากได้เสื้อลายเป็ดอยู่พอดีเลย!"
1013705-75 = "ตรงนี้ยังมีอีกตัวหนึ่ง เดี๋ยวฉันเอาลายเดียวกันให้คุณครูด้วยค่ะ! ขอฉันให้คุณครูเป็นของขวัญนะคะ!"
1013705-76 = "คุณลุงเจ้าของร้าน วันนี้พอเท่านี้ค่ะ! ขอสองตัวนี้ให้ฉันด้วยนะคะ"
1013705-77 = "สองตัวนี้เหรอ ได้เลย~ ดูน่าจะเหมาะกับคุณครูเลยนะ~"
1013705-78 = "[s] \"แล้วไม่จ่ายเงินเหรอ?\""
1013705-79 = "แม่หนูตำรวจคนนี้บอกว่าขี้เกียจพกกระเป๋าสตางค์ ก็เลยจ่ายไว้ล่วงหน้า 300 ตัวแล้วละ"
1013705-80 = "ไว้มาใหม่นะ อย่าลืมหาลูกค้าให้ด้วยล่ะ!"
1013705-82 = "ฮื้ม~ การช็อปปิ้งนี่ทำให้อารมณ์ดีจริงๆ เลยนะ~"
1013705-83 = "เก็บความลับของเราไว้ให้ดีนะคะ คุณครูต้องมาที่นี่กับฉันคนเดียวนะ"
1013705-84 = "นานแล้วนะที่ฉันไม่ได้หวนนึกถึงวันเก่าๆ แบบนี้รู้สึกดีเหมือนกันนะคะ คิดถึงตอนปฏิบัติการคู่กับพี่เลี้ยง#nคนนั้นจัง"
1013705-85 = "ตอนนั้นน่าจะถ่ายรูปที่คุณพี่ใส่เสื้อฮาวายไว้แท้ๆ น่าเสียดายจังเลยค่ะ"
1013705-86 = "[s] \"คุณพี่? งั้นก็แสดงว่าพี่เลี้ยงคนนั้นคือ...?!\""
1013705-87 = "เอ๋? มันก็แน่อยู่แล้วไม่ใช่เหรอคะ? แล้วจะมีใครอื่นอีกล่ะ?"
1013705-88 = "เบื้องบนที่กล้าเอาหมาบ้ามาประกบนักเลงในตอนนั้นน่ะ ถือว่าใจถึงเลยละค่ะ"
1013705-89 = "งั้นเอาไว้เจอกันใหม่นะคะ อย่าลืมซักเสื้อก่อนใส่ด้วยล่ะ!"
1013705-90 = "บ๊ายบาย!"
1013705-92 = "(แล้วโคโนกะก็ยิ้มกว้างให้และเดินหายไปในซอยอย่างสบายใจ)"
