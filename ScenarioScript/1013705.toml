[translation]
1013705-1 = "那位刑警的禮服"
1013705-2 = "哈囉～老師。"
1013705-3 = "沒有被跟蹤吧？因為這是不能讓人知道的情報。"
1013705-4 = "[s1] 「本來就沒有啊……？」\n[s2] 「到底怎麼了……？」"
1013705-7 = "在這裡不太好說，先進去吧，這裡人太多了。"
1013705-8 = "啊，就像我之前說的，接下來看到的都是秘密哦。"
1013705-9 = "就像過去消失的那些秘密一樣，這件事你也要徹底忘記。"
1013705-10 = "[s] 「呃……好……！」"
1013705-15 = "嗯？誰啊？才多久沒見變化也太大了吧。"
1013705-16 = "怎麼這麼冷淡，是我啊。"
1013705-17 = "我帶客人來了。放心，他絕對不會傳出去的。"
1013705-18 = "別擔心，這裡依然是只有少部分的人才知道的名店。"
1013705-19 = "你又自作主張……！！！"
1013705-24 = "我這裡可是服飾店啊！沒有人氣是要怎麼經營啊！？"
1013705-25 = "哎呀～我不是買了很多嗎～？"
1013705-26 = "只靠你一個人的營業額根本做不下去好嗎！？"
1013705-28 = "[ns] 「這裡是……花襯衫專賣店嗎？」"
1013705-29 = "沒錯。據我所知，要買花襯衫的話沒有比這裡更好的地方了。"
1013705-30 = "從二手到新品按顏色有品味地分類，是一間隱藏聖地。"
1013705-31 = "沒有隱藏！！是你在隱藏好嗎！？"
1013705-32 = "但我不是每次來都買十件嗎，別生氣啦～"
1013705-33 = "要是客人變多了，稀有的襯衫也會被搶走啊。"
1013705-34 = "您是夏萊的老師對吧？拜託了！請您幫我宣傳店面！"
1013705-35 = "我不會讓你得逞的！略～！"
1013705-36 = "唉……這到底是警察還是流氓啊……！"
1013705-37 = "不過……說得也是。能理解花襯衫優點的人並不多。"
1013705-38 = "就像小姐說的，只介紹給有品味的客人也是不錯。"
1013705-39 = "老闆也覺得其實還不錯嘛。好了，讓我來看看有什麼吧～"
1013705-40 = "今天要帶哪些回家呢～？"
1013705-44 = "哼～哼～警察一出現～頭盔幫就會哭～"
1013705-48 = "敢逃跑的話～就死定了～"
1013705-49 = "嗯……顏色搭配是不錯……但整體平衡不行，淘汰！"
1013705-50 = "[ns3] 「木乃香對花襯衫很了解呢。」\n[ns4] 「從以前就喜歡嗎？」"
1013705-53 = "不是耶，以前從來沒穿過這種衣服。"
1013705-54 = "原本也不是特別有興趣，硬要說的話是有點不太喜歡吧？"
1013705-55 = "我是來到女武神之後，才開始對花襯衫感興趣的。"
1013705-56 = "老師很好奇嗎？我喜歡上花襯衫的原因。"
1013705-57 = "[s] 「呃……！這麼明顯嗎？」"
1013705-58 = "哈哈！再怎麼樣我也是副局長，我都看穿了。"
1013705-59 = "是從什麼時候開始的呢……"
1013705-60 = "嗯……我記得是一年級的時候，#n聽說有一間學校可以揍那些討厭的流氓還能被表揚。"
1013705-61 = "入學之後因為我只會打架、開槍，所以給我安排了前輩來指導我。#n雖然他話少但是卻很喜歡說教，超級讓人頭痛的……"
1013705-62 = "有一天收到通報，我們就兩個人直接出動了。#n到了現場發現是陷阱，接著一群人跑出來圍毆我們。"
1013705-63 = "贏了是贏了，但是制服變得破破爛爛的。#n最後那些傢伙還發著抖報警呢。"
1013705-64 = "[s] 「被警察打了還報警……？」"
1013705-65 = "我的前輩與其說是「人民的拐杖」，倒更像是「人民的警棍」……"
1013705-66 = "總之也不能就那樣直接回去，所以想換件衣服。#n結果唯一還在營業的服飾店就只有這裡。"
1013705-67 = "然而這間店不管從哪裡看到處都是花襯衫！超級好笑的！"
1013705-68 = "那天小姐穿得白襯衫真的是一團亂，我還以為是穿著花襯衫進來的呢？"
1013705-69 = "哎呀，本人還在場就更有臨場感了！"
1013705-70 = "所以沒辦法，只好和前輩一起穿著花襯衫回去。#n後來照鏡子發現挺適合的，於是從那之後就一直穿著花襯衫，而且調查的時候也挺方便的。"
1013705-74 = "哦！就是這個！正好想要一件鴨子花紋的！"
1013705-75 = "這裡還有一件給老師，就算是我送的禮物！"
1013705-76 = "老闆，我先走啦！我要這兩件。"
1013705-77 = "好的～老師很適合呢～"
1013705-78 = "[s] 「還沒結帳耶？」"
1013705-79 = "刑警小姐說帶錢包很麻煩，所以提前付了大概300件的錢。"
1013705-80 = "請再來光顧哦，店面的宣傳就拜託了！"
1013705-82 = "哈啊～血拚最棒了～！！"
1013705-83 = "這是我們之間的祕密，千萬不能洩漏出去。#n還有，只能跟我一起來哦。"
1013705-84 = "久違地回想起往事也不錯呢，也有點懷念和前輩一起打滾的時候。"
1013705-85 = "那時候應該拍下大姐頭穿花襯衫的照片的，真是可惜。"
1013705-86 = "[s] 「大姐頭？那麼，那個前輩是……！？」"
1013705-87 = "咦？那不是理所當然的嗎？還能有誰？"
1013705-88 = "當時的高層真的很厲害，竟然能想到給小混混配一隻瘋狗。"
1013705-89 = "那就下次見囉，衣服一定要記得洗過再穿哦！"
1013705-90 = "拜拜～"
1013705-92 = "（之後，木乃香面帶笑容悠閒地消失在巷子另一頭）"
