[translation]
12120-1 = "제12화;비밀들"
12120-2 = "쨔안-!"
12120-3 = "봐봐- 호시노 쨩-! 간신히 구한 옛날 아비도스 사막 축제 포스터야!"
12120-4 = "그때는 오아시스가 호수처럼 넓었대. 이거, 기념으로 줄게!"
12120-5 = "에헤헤…… 엄청 멋지지? 만약 기적이 일어나준다면 다시 여기에 사람들이 잔뜩 찾아와줘서 짜안- 하고……."
12120-6 = "기적 같은 건 없습니다. 선배님."
12120-7 = "그런 속편한 것이 세상에 존재할 리가 없지 않습니까!"
12120-8 = "하, 하우우……"
12120-9 = "사막 한가운데에 사람들이 왜 찾아옵니까!! 꿈같은 소리는 그만 하세요!!"
12120-10 = "우웅…… 그치만 호시노 쨩. 미, 미안해……. 내, 내가 바보라서……."
12120-11 = "……!!"
12120-12 = "……기적이니, 행운이니, 다행이니……."
12120-13 = "당신이 아비도스의 학생회장입니다! 조금 더 그 어깨에 놓인 책임의 무게를 자각하셔야죠!!"
12120-14 = "(찌익, 찌이익- 찌이이익-!)"
12120-16 = "대책위원회 동아리실"
12120-17 = "……."
12120-18 = "정말!! 뭐냐고 이게!"
12120-19 = "카이저 코퍼레이션은 대체 거기서 뭘 꾸미고 있는 거지?"
12120-20 = "무언가를 발굴하고 있었던 거 같아요……! 그 보물이라는 게……."
12120-21 = "아뇨, 기만책입니다! 그 사막엔 아무 것도 없어요."
12120-22 = "석유라던가 지하자원 같은 돈이 될만한 것은 하나도 없어요…… 이미 옛날에 조사가 끝난 사실이에요……."
12120-23 = "그럼 땅을 빼앗은 이유는……."
12120-24 = "아니!! 그런 건 중요한 게 아니잖아!! 이 빚은 어떡해? 이번 달까지 갚으라고?! 무슨 수로?!"
12120-25 = "예탁금이라는 것도 요구했어요…… 카이저 론에서 공식 독촉장도 날아왔어요…… 일주일 안에 3억……."
12120-27 = "난 가겠어. 거기서 무슨 일을 하는지 알아내야겠어."
12120-28 = "네?! 시로코 선배?! 어, 어딜 가는……."
12120-29 = "PMC의 시설. 철저하게 준비해서 잠입해서 조사하면 문제 없겠지. 그곳의 정체가 뭔지 확인하겠어."
12120-30 = "무, 무슨 짓이야, 시로코 선배! 일을 키우지 마! 지금은 이 빚이 먼저라고!"
12120-31 = "……."
12120-32 = "빚은…… 이제 정당한 방법으로는 무리야. 수단과 방법을 가리지 않으면……."
12120-33 = "아, 안돼요! 그렇게 되어버리면 또 다시……."
12120-34 = "……좋아! 그런 감상이 무슨 소용이야! 학교가 없어져버리면 모든 게 끝인데! 난 찬성이야!"
12120-35 = "네?! 아, 안돼요!"
12120-36 = "뭐?! 세리카 쨩! 호시노 선배의 말을 어기겠다는 거야!?"
12120-37 = "……그, 그런 말이 아니잖아! 내 말은……."
12120-38 = "세리카 쨩이야 말로 일을 키우고 있잖아! 범죄자라도 될 셈이야?!"
12120-39 = "나, 나는……."
12120-40 = "……."
12120-41 = "자아- 자아. 모두들. 모두들."
12120-42 = "다들 흥분해서 머리에서 김이 나고 있잖아."
12120-43 = "으, 으음……."
12120-44 = "……."
12120-45 = "……."
12120-46 = "……네. 죄송해요……."
12120-47 = "……. 으, 응. 딱히 화를 내려던 건 아니었어……. 미안해."
12120-48 = "이야~ 잘 안다니까. 시로코 쨩은 착한 아이니까."
12120-49 = "……."
12120-50 = "자아, 오늘은 이쯤하자고."
12120-51 = "해산~ 해산이야. 머리를 식히고 내일 다시 모이자고. 부장의 명령이야."
12120-52 = "[s] \"그래. 오늘은 이만 종료하고, 내일 다시 모이자.\""
12120-54 = "(부원들이 하나 둘씩 집으로 돌아가고 호시노와 시로코만 남았다.)"
12120-55 = "어라, 시로코 쨩은 무슨 볼일 있어?"
12120-56 = "……선배. 잠깐 괜찮아?"
12120-57 = "이야~ 시로코 쨩. 나한테 할 말이 있는 거구나?"
12120-58 = "[s] \"나도 있어.\""
12120-59 = "아아……. 선생님도 그런가."
12120-60 = "그치만 오늘은 피곤하기도 하고 여러 일들이 있었잖아?"
12120-61 = "내일 얘기하자고. 무슨 얘기인지는 알겠으니까."
12120-62 = "으, 으응. ……아, 알겠어."
12120-63 = "선생님……."
12120-64 = "[s] 고개를 끄덕인다."
12120-65 = "음. 그럼……."
12120-67 = "어라~ 선생, 우리 귀여운 시로코 쨩이랑 눈인사를 나누는 사이였던 거야?"
12120-68 = "이야, 역시 얕보면 안되는 어른이잖아. 선생. 이 아저씨는 어쩐지 쓸쓸해져 버린다구."
12120-73 = "[ns] \"호시노. 솔직하게 말해줘.\""
12120-74 = "응? 뭘 말이야?"
12120-75 = "[s] 호시노의 탈퇴서를 내민다."
12120-78 = "어라…… 이건……."
12120-79 = "으헤?! 언제?! 아니. 이건 분명 시로코 쨩이지?"
12120-80 = "너무하잖아, 시로코 쨩. 선배의 가방을 뒤지면 안된다고!"
12120-81 = "선생님, 시로코 쨩을 혼내줘-! 저대로 가다간 엄청난 악당이 될 거라고!"
12120-82 = "[s1] \"혼내는 건 나중에.\"\n[s2] \"지금은 호시노와 얘기하고 싶으니까.\""
12120-83 = "……."
12120-84 = "……."
12120-85 = "그런가……."
12120-86 = "[s] \"얘기해줘. 모두에게 말하지 않은 게 있지?\""
12120-87 = "……."
12120-88 = "음……. 그렇게 진지하게 얘기하면……."
12120-89 = "……하아, 알았어."
12120-92 = "……그럼 선생, 잠깐 같이 걸을까?"
12120-93 = "[s] 호시노와 함께 밖으로 나간다."
12120-100 = "콜록, 콜록. 으아, 여기도 모래가 잔뜩 쌓였잖아."
12120-101 = "청소하기엔 사람도 부족하고 건물도 너무 넓어서 말이지……."
12120-102 = "모래 바람이라도 좀 적게 불었으면 좋겠는데……."
12120-103 = "으아~ 이 아저씨의 고교 생활이 온통 모래빛인 건 좀 너무하지 않아?"
12120-104 = "[s] \"호시노는 이 학교를 좋아하는구나.\""
12120-105 = "……으응? 어째서 그렇게 되는 거야?"
12120-106 = "사막화 이전엔 여기가 엄청 크고 강대한 학교였다고 하지만, 그런 기억 같은 건 이 아저씨에겐 전혀 없거든."
12120-107 = "전부 엉망진창에 제대로 된 건 하나도 없는 학교였단 말야."
12120-108 = "이 아저씨가 처음 입학했던 학교 건물은 지금은 사막에 파묻혀버렸고. 알고 지내던 선배들도 모두 사라져버렸고."
12120-109 = "애초에 여기는 아비도스의 본관 건물도 아니고, 사막화를 피해 몇번이나 이사를 해서 마지막으로 오게 된 별관 건물이었고 말이지."
12120-110 = "……뭐, 그치만 여기로 오고나서 시로코 쨩과 노노미 쨩, 아야네 쨩, 세리카 쨩을 만나기도 했으니……."
12120-111 = "……하아."
12120-112 = "……으헤, 역시 조금 좋아하는 건가~"
12120-113 = "[s] \"………….\""
12120-114 = "……선생. 솔직하게 얘기할게."
12120-116 = "나는 2년 전부터 이상한 녀석들에게 어떤 제안을 받고 있었어."
12120-117 = "[s] \"제안?\""
12120-118 = "카이저 코퍼레이션……."
12120-119 = "스카웃 제안이라고 해야 하나……. 아비도스에 입학한 직후부터 계속 몇 번이나……."
12120-120 = "그리고 최근에도 있었고……."
12120-122 = "당신에게 거절하지 못할 제안을 하나 하겠습니다."
12120-123 = "아비도스 학교를 자퇴하고 제가 관리하는 기업 소속이 된다는 조건으로, 지금 아비도스가 진 빚을 절반 탕감해 드리겠습니다."
12120-124 = "큭, 큭큭큭……. 자아, 대답은요? 예스입니까? 그렇다면 어서 여기에 싸인을."
12120-126 = "아니, 몇번이나 대답했잖아. 거절이야."
12120-127 = "……."
12120-129 = "누가봐도 파격적인 조건이었어. 하지만 그 당시엔 내가 없어지면 아비도스 학교 자체가 붕괴될 거라 계속 거절하고 있었지만……."
12120-130 = "그 녀석들, PMC에 쓸만한 인재를 모으고 있는 거 같아."
12120-131 = "[s] \"그 자는 누구지?\""
12120-132 = "나도 정체는 몰라……. 나는 그 녀석을 검은 양복이라고 부르고 있어."
12120-133 = "[s] \"검은 양복…….\""
12120-134 = "어쩐지 소름이 끼치는 녀석이라…… 키보토스에서도 그런 모습을 한 사람은 처음 봤고 말이지……."
12120-135 = "뭔가 수상쩍은 녀석이지만…… 딱히 문제를 일으키진 않았어……."
12120-136 = "하지만 분명한 건 카이저 이사조차 그를 두려워하고 있는 것처럼 보였어."
12120-137 = "[s] \"그럼 이 탈퇴서는…….\""
12120-138 = "……아아."
12120-139 = "……뭐, 예전부터 계속 고민이 없었던 건 아니었으니까. 이건 그 망설임의 흔적 같은 걸까나."
12120-140 = "자, 이건 이렇게……. 쓰레기통에."
12120-142 = "으헤~ 자아. 쓰레기통에 이렇게 버렸으니까."
12120-143 = "괜한 오해를 산 것 같네. 그치만 그런 뒤숭숭한 이야기를 해봤자 좋을 건 없을 거 같아서 말야."
12120-144 = "음…… 그래도 귀여운 후배들에게 언제까지 숨길 수도 없는 노릇이고…… 내일 모두에게 얘기해둘게."
12120-145 = "기분 나쁜 이야기이지만, 숨기지 않는 게 맞겠지."
12120-146 = "사실 지금은 아무런 방법도 떠오르지 않지만……."
12120-147 = "[s] \"아니, 분명 방법이 있을 거야.\""
12120-148 = "……."
12120-149 = "그런가. 기적이라도 일어나 준다면…… 인가."
12120-150 = "……."
12120-151 = "자, 그럼 이 이야기는 이걸로 끝."
12120-152 = "내일 보자고, 선생."
12120-153 = "안녕."
12120-157 = "[ns] \"호시노!\""
12120-158 = "으, 으응?"
12120-159 = "[s] \"어른인 내가 어떻게든 할 테니까! 분명 방법이 있을 거야!\""
12120-160 = "……."
12120-161 = "……으헤헤. 내가 너무 기운 없어 보였으려나?"
12120-165 = "응. 선생. 고마워."
12120-170 = "(다음 날.)"
12120-171 = "실례합니다……. 하아…… 아야네 들어갑니다."
12120-174 = "어라, 제가 제일 1등인가요……."
12120-176 = "……응?"
12120-178 = "……이, 이건……?"
12120-179 = "……."
12120-180 = "꺄아아아아아앗-!!??"
12120-182 = "(책상 위에는 호시노가 남긴 동아리 탈퇴서와 자퇴서, 그리고 편지가 놓여 있었다.)"
12120-184 = "다음화;놓쳐버린 것"
