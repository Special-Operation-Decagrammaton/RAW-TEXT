[translation]
2002903-1 = "여름 바다의 독심술"
2002903-4 = "호텔 방"
2002903-5 = "(간만에, 정말 간만에 늘어지게 잤다.)"
2002903-6 = "(놀랍게도, 아직은 오전이었다.)"
2002903-7 = "[ns] \"흠냐…… 이제부터 뭘 하지……?\""
2002903-14 = "(일단 방을 나서려고 문을 연 순간.)"
2002903-15 = "호텔 복도"
2002903-16 = "아, 선생님."
2002903-17 = "후후, 안녕하세요? 아직은 좋은 아침이네요."
2002903-18 = "지금부터 해변으로 나가시는 건가요?"
2002903-19 = "[s1] \"음…… 딱히 그런 건 아니긴 한데……\"\n[s2] \"내가 뭘 하려고 했더라……\""
2002903-22 = "아하, 그렇군요. 음. 음. 네. 알겠어요."
2002903-23 = "[s] \"뭘?!\""
2002903-24 = "그러면 지금부터…… 선생님의 마음 상태를 알아맞혀 보도록 할까요?"
2002903-25 = "[s] \"알았다. 미모리의 독심술이구나!\""
2002903-26 = "그, 그렇게 반갑다는 듯이 말씀하셔도…… 부끄러워요……"
2002903-31 = "[ns3] \"하지만 이번에는 쉽지 않을 거야.\"\n[ns4] \"왜냐하면, 나도 일어난 지 얼마 안 되어서.\"\n[ns5] \"스스로도 내가 뭘 하고 싶은지 모르겠거든!\""
2002903-35 = "아, 왠지 알 것 같아요. 가끔 있죠. 그럴 때."
2002903-36 = "하지만 그런 때일수록 여러 가지를 생각해 보는 맛이 있다고 할까요?"
2002903-37 = "우선 선생님께서는…… 그렇군요. 막 일어난 김에 무심코 밖으로 나왔지만."
2002903-38 = "아직 나른한 기분도 남아 있고, 여기저기 왠지 뻐근하기도 한 상태이시군요?"
2002903-39 = "[s] \"어, 어어……?\""
2002903-40 = "거기에, 몸이 아직 덜 풀려서 특별히 나가고 싶지도 않지만."
2002903-41 = "그렇다고 이대로 있기도 싫은, 아주 애매한 상태셔요."
2002903-42 = "후훗. 어떠신가요?"
2002903-43 = "[s6] \"듣고 보니 확실히 그런 것 같기도……!\"\n[s7] \"항복. 졌습니다.\""
2002903-46 = "와! 제가 선생님을 이긴 거네요?"
2002903-47 = "그러면 승자의 권리로…… 지금부터 저와 어울려 주셨으면 좋겠어요!"
2002903-48 = "[s] \"……그거, 정말 승자의 권리 맞아……?\""
2002903-57 = "자, 드세요. 선생님. 레모네이드예요."
2002903-58 = "비타민도 풍부하고, 상큼한 맛이 생기를 북돋워 줄 거예요."
2002903-59 = "저런. 입가에 레몬 과육이 묻었네요. 잠시만요. 닦아 드릴게요."
2002903-66 = "자아…… 다 됐어요. 어떠셨나요?"
2002903-67 = "[s8] \"지금 딱 필요한 음료였어.\"\n[s9] \"그런데, 이런 게 정말 미모리가 하고 싶은 거였어?\""
2002903-70 = "네? 승자의 권리라면 좀 더…… 어울리는 것이 있지 않느냐고요?"
2002903-71 = "후훗. 아뇨. 저는 정말로 지금 만족스러운데요?"
2002903-72 = "[s10] \"그렇다면 다행이지만…… 그러고 보니 아까 전에 말인데.\"\n[s11] \"어떻게 내 마음을 알아낸 거야? 역시 초능력?\""
2002903-75 = "아…… 그것 말씀이시군요?"
2002903-76 = "……"
2002903-77 = "후후. 특별히 제가 초능력 같은 걸 갖고 있는 것은 아니에요."
2002903-78 = "선생님의 머리가 헝클어져 있어서, 막 일어나신 상태라는 것을 알 수 있었고."
2002903-79 = "지금부터 해변에 나가려고 제가 여쭈었더니, 딱히 그런 건 아니라고 대답해 주셨죠."
2002903-80 = "무엇보다…… 세수를 안 하신 게 너무 티가 나서, 자연히 그런 결론이 나올 수밖에 없었다고 할까요?"
2002903-84 = "[ns12] \"반성하겠습니다……\"\n[ns13] \"뭔가, 독심술이라기보다는 추리 같네.\""
2002903-87 = "후후, 추리요? 사실 독심술과 추리 사이에는 공통점이 많죠."
2002903-88 = "어쩌면 거의 쌍둥이가 아닐까 싶을 정도로……"
2002903-89 = "네? 제 독심술에는…… 가끔 추리 이상의 무언가가 있는 것 같기도 하다, 고요?"
2002903-90 = "그, 그럴 리가요! 선생님도 참, 가끔 농담이 과하시다니까요……"
2002903-91 = "자, 자! 어서 세수라도 하시고, 오늘도 움직여 봐요."
2002903-92 = "기껏 바다까지 왔는데, 하루 종일 아무것도 안 하고 시간을 보내는 건 너무 아깝잖아요?"
2002903-94 = "(세수를 끝마치고, 왠지 모르게 무언가를 얼버무리려는 듯 한 미모리와 함께 바다로 나갔다.)"
