[translation]
10008070-1 = "제7화;위기일발! 1"
10008070-3 = "당~했~다~!"
10008070-4 = "레드……! 우리의 원대한 꿈이……!"
10008070-5 = "우리의 정의가……. 무뢰배의 손에 의해 끝내 여기서 꺾여버리는 것인가……!"
10008070-12 = "[ns] \"아, 쓰러트렸다.\""
10008070-13 = "해, 해냈어요! 아루 님!"
10008070-14 = "하아아……. 이걸로 간신히 끝난 거야?"
10008070-15 = "으음~ 생각보다 시시했던 것 같긴 하지만……."
10008070-17 = "아니, 이 정도로 충분해. 여기서 더 심한 소동에 휘말리는 건 사절이니까."
10008070-18 = "후후, 모두 고생했어. 우리 흥신소의 단합력이 제대로 빛을 발휘한 거네."
10008070-19 = "아, 물론 선생님의 지휘도 훌륭했어."
10008070-20 = "덕분에 생각보다 쉽게 해결할 수 있었던 셈이니까."
10008070-21 = "흠흠. 그 부분은 특별히 더욱 칭찬하고 있으니까?"
10008070-22 = "역시 우리 흥신소의 동업자야♪"
10008070-23 = "[s] \"몸 둘 바를 모르겠습니다.\""
10008070-27 = "그럼 이대로 카이텐져가 훔친 새전함을 찾아서 회수하면……."
10008070-29 = "하하하, 여러분. 이거 고맙습니다."
10008070-31 = "응……? 이런 타이밍에 또 누구야?"
10008070-32 = "아루 쨩. 저어~기에."
10008070-39 = "이거 참. 저희를 대신하여 직접 무뢰배들로부터 새전함을 되찾아 주시다니 이걸 어떻게 감사 인사를 드려야 할지……."
10008070-41 = "당신은……."
10008070-42 = "대길전의 관리인이야."
10008070-44 = "호오, 그 복장. 혹시 저희 대길전의 무녀 아르바이트생이십니까?"
10008070-45 = "껄껄껄! 이것 참!"
10008070-46 = "아르바이트생분께서도 손수 팔을 걷어붙이고 도와주시고 계셨을 줄이야. 이건 더더욱 감사할 일이로군요!"
10008070-50 = "좋습니다. 새전함을 가지고 돌아가면 제가 직접 여러분께 사례를 하고자 하니, 일단 새전함부터 회수하도록 할까요?"
10008070-51 = "기다려."
10008070-52 = "흐음? 무엇 때문에 그러신지?"
10008070-53 = "……방송에서 이야기하기를, 새전함은 되찾는 쪽이 전부 가져간다. 그런 룰이지 않았어?"
10008070-55 = "확실히……. 살짝 정신없는 나머지 잊고 있었지만……."
10008070-56 = "아핫~ 맞아. 방송에서 그런 말을 했었잖아~?"
10008070-58 = "그런데 여기에서 직접 회수한다니 이야기가 달라졌는데?"
10008070-61 = "……."
10008070-62 = "앗차차. 이거 참. 그러고 보면 그런 이야기를 했었더랬죠."
10008070-63 = "으음, 그것과 관련하여 뭐라고 말씀을 드리면 좋을지. 그게 그러니까 말입니다……."
10008070-74 = "가, 갑자기 튀어나왔다?!"
10008070-75 = "아하하! 뭐야?"
10008070-76 = "뭘 할 생각인 거야?"
10008070-78 = "으음, 눈치채지 못한 채 슬쩍 넘겨주었으면 피차 서로 얼굴 붉힐 일은 없었을 터입니다만."
10008070-79 = "상황이 이렇게 꼬이게 만들다니, 안됩니다. 네. 안 돼요."
10008070-80 = "역시……. 방송에서 했던 말. 원래부터 지킬 생각 따윈 없었던 거지?"
10008070-81 = "[s] \"그럼 왜 방송에서 그런 말을 했던 거야?\""
10008070-82 = "지금까지의 수법과 같다는 거야. SNS나 언론을 이용해, 사람을 움직인다."
10008070-83 = "……즉 내 손을 쓰지 않고 코를 풀겠다. 그런 생각이었던 거겠지."
10008070-85 = "아! 방송을 보는 사람을 이용해서……!"
10008070-87 = "호오. 이거 참. 말씀대로입니다. 매스미디어라는 건 사용하기 나름."
10008070-88 = "새전함을 찾은 사람에게 넘겨준다. 그런 '가벼운 거짓말'을 살짝 보탠 것만으로……."
10008070-92 = "보십시오. 그 말을 믿고, 키보토스 각지에서 여러 사람들이 난동을 부려준 끝에 이렇게 직접 제 앞으로 새전함을 대령해주지 않았습니까?"
10008070-94 = "윽……?!"
10008070-96 = "저희는 그 새전함을 눈앞에서 손에 넣으면 그만. 참으로 훌륭한 방법이 아닐 수 없지요. 언론을 이용한다는 것은."
10008070-97 = "[s] \"이게 검은거북파의 방식…….\""
10008070-98 = "하하. 역시나 거기까지 눈치를 채고 계셨던 거군요?"
10008070-99 = "그래! 이미 다 알고 있다고! 대길전의 새전함은 원래부터 뒷세계의 불법 자금을 세탁하기 위한 용도였다는 것도 전부……!"
10008070-100 = "하하하! 그럼 오히려 이야기가 쉬워지는군요."
10008070-101 = "으, 응?"
10008070-108 = "뒷세계의 주민들답게, 여기에선 힘으로 빼앗을 뿐입니다."
10008070-109 = "[s] \"모두 정신 바짝 차려!\""
10008070-111 = "으, 응?!"
