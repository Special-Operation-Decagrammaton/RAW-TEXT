[translation]
1300415-1 = "남몰래 숨긴 노트"
1300415-2 = "(어느 날 볼일이 있어 대책위원회실로 찾아갔다.)"
1300415-9 = "흐흐흥~ 흐흥~"
1300415-10 = "[ns] \"노노미, 안녕?\""
1300415-15 = "서, 선생님?!"
1300415-16 = "언제 오셨어요?!"
1300415-17 = "바, 방금 오셨다고요…… 문이 열리는 소리도 못 들었네요."
1300415-18 = "미리 말씀하셨다면 과자라도 준비해 뒀을 텐데요."
1300415-19 = "[s] \"그렇게 집중해서 뭘 하고 있었어?\""
1300415-23 = "아, 그게에……"
1300415-24 = "비, 비밀이에요."
1300415-25 = "[s1] \"뭐, 그럼 어쩔 수 없지.\"\n[s2] \"캐묻지는 않을게.\""
1300415-30 = "아, 앗? 이렇게 포기하시는 건가요?"
1300415-31 = "딱히 그렇게 숨길 만큼 엄청난 비밀은 아닌걸요."
1300415-32 = "응, 선생님한테는 특별히 보여드릴게요."
1300415-38 = "[ns] \"이건…… 노트?\""
1300415-39 = "네, 정확히는…… 버킷리스트예요."
1300415-40 = "대책위원회의 모두와 언젠가 함께하고 싶은 일들을 메모해 둔 거죠."
1300415-41 = "가끔 혼자 있을 때 몰래 정리하곤 해요."
1300415-42 = "[s] \"모두와 공유하면 더 좋은 거 아냐?\""
1300415-43 = "으응, 아니에요."
1300415-44 = "제가 이런 걸 정리하고 있다는 사실을 알게 되면 달성하도록 모두들 도와줄 게 뻔하니까요."
1300415-45 = "안 그래도 빚 상환 때문에 모두 여러 가지로 신경 쓰고 있는데, 부담을 늘릴 수는 없죠."
1300415-46 = "그러니까, 혼자서 몰래 작성하고 자연스럽게 달성하는 편이 좋아요."
1300415-47 = "오늘은 선생님께 들켜버렸지만요."
1300415-48 = "[s] \"그런 거였구나…… 캐물어서 미안…….\""
1300415-49 = "괜찮아요. 언젠가는 들킬 거라고 생각했으니까☆"
1300415-50 = "들킨 김에, 한 번 읽어 보시겠어요?"
1300415-51 = "[s3] \"내가 읽어도 되는 거야?\"\n[s4] \"나한테 보여줘도 되는 거야?\""
1300415-54 = "물론이죠. 사실 내용 자체는 별것 없거든요."
1300415-55 = "응응, 같이 봐요."
1300415-65 = "지금까지 달성한 것들에는 빨간 색연필로 표시해 뒀어요."
1300415-66 = "함께 디저트 먹으러 가기, 함께 학교 꾸미기…… 쉽게 달성한 것도, 모두 힘을 모아 달성한 것도 있었죠."
1300415-67 = "가끔은 눈으로 읽기만 해도 그때가 생각나서 즐거워져요."
1300415-71 = "아, 여기 <매운맛 5단계 피자 먹어보기>도 달성했었죠."
1300415-72 = "세리카 쨩, 얼굴이 완전히 빨개졌었는데, 그립네요☆"
1300415-74 = "그리고 이쪽은 아직 달성하지 못한 것들이네요."
1300415-75 = "언젠가는 이 리스트 모두에 빨간 표시를 할 수 있었으면 좋겠다고 생각하지만……."
1300415-76 = "하나를 달성하면 어느새 새로 두 가지가 생각나곤 해요."
1300415-77 = "그래서 줄여 나가기는커녕, 리스트가 점점 늘어나더라고요."
1300415-78 = "지금에 와서는 아직 달성하지 못한 것이 100개가 넘을 정도고요…… 아하하, 곤란하네요."
1300415-79 = "[s] \"오히려 더 좋은 거 아닐까?\""
1300415-83 = "[ns5] \"그만큼 쌓을 추억이 남아있다는 뜻이니까.\"\n[ns6] \"그만큼 즐거운 미래가 기다리고 있는 셈이니까.\""
1300415-90 = "……그렇네요!"
1300415-91 = "빚을 갚느라 늘 허덕이는 대책위원회지만……."
1300415-92 = "모두 함께 추억을 쌓지 말라는 법은 없으니까요."
1300415-93 = "응응, 100% 달성까지, 더욱 힘낼게요!"
1300415-97 = "참, 말이 나온 김에, 선생님도 다음 버킷 리스트 달성을 도와주시겠어요?"
1300415-98 = "[s] \"물론이지, 뭔데?\""
1300415-99 = "스카이다이빙이에요!"
1300415-100 = "4000미터 상공에서 뛰어내리면서 자유를 즐기는…… 생각만 해도 짜릿하지 않으세요?"
1300415-104 = "[ns] \"히익! 저, 저는 괜찮습니다!\""
1300415-107 = "후후, 장난이에요☆"
