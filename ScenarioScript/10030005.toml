[translation]
10030005-1 = "프롤로그;새해 결심"
10030005-2 = "베리타스 해커 휴게실"
10030005-7 = "……마키, 그쪽 상황은 어때? 이쪽 청크의 리소스는 모두 바닥난 것 같은데."
10030005-8 = "이쪽도 마찬가지야. 쓸 만한 건 아까 발견한 게 전부인가 봐."
10030005-9 = "코타마 선배, 구축 중인 논리 회로의 진척 상태는 어때?"
10030005-16 = "……생각보다 까다롭군요. 지난번 업데이트로 규칙 몇 가지가 뒤바뀌며 불필요한 블록이 발생해서……"
10030005-17 = "아무래도 쉽지 않은 싸움이 될 것 같습니다."
10030005-18 = "큿…… 역시 해가 바뀌기 전에 완성하는 건 무리한 계획이었나?"
10030005-19 = "그래도 끝까지 포기해서는 안 됩니다. 그동안 이 계획에 들인 수고를 물거품으로 만들 수는 없으니까요."
10030005-21 = "응. 오늘 밤도 함께 도와줄 테니까—"
10030005-30 = "너희들……"
10030005-34 = "아, 치히로 선배! 어서 와!"
10030005-35 = "어서 와, 부부장. 부실에서 보는 건 정말 오랜만이네."
10030005-36 = "하도 오랫동안 안 와서 얼굴을 잊어버리는 줄 알았습니다."
10030005-38 = "어쩔 수 없지. 지난 몇 주간은 연말 시즌이었으니까…… 보안 감사 일로 찾아가야 할 업체가 여럿 있었거든."
10030005-43 = "그러는 너희야말로 어째서 아무도 연락을 받지 않았던 거야?"
10030005-44 = "오늘도 벌써 세 차례나 전화를 걸었는데, 계속 연락을 받질 않으니 걱정이 되어서 직접 찾아온 거라고."
10030005-51 = "앗, 정말이다…… 부재중 메시지가 잔뜩 쌓여 있었네."
10030005-52 = "미안, 선배. 작업에 열중하느라 핸드폰 확인하는 걸 까맣게 잊고 있었어."
10030005-54 = "그러고 보니 작업을 시작한 지 벌써 하루가 넘게 지났네. 시간 참 빠르다니까……."
10030005-55 = "하지만 이 시기를 놓치면 의미가 없는 중요한 작업이었으니까요."
10030005-57 = "……시기를 놓치면 의미가 없는 중요한 작업?"
10030005-58 = "아, 혹시 전에 말했던 연말 보안 점검을 하고 있었던 거야?"
10030005-59 = "확실히 해가 바뀌기 전에 PC의 보안 상태를 점검하는 건 중요하지. 연말에만 극성을 부리는 웜이나 바이러스도 적지 않으니까."
10030005-60 = "너희가 드디어 올바른 화이트 해커로서의 자각을 갖게 된 것 같아서 조금은 뿌듯한 마음이—"
10030005-62 = "어, 그게 그러니까……"
10030005-63 = "보안 점검을 하고 있었던 건 아니었고……"
10030005-68 = "<미네랄 크래프트>의 새로운 모드를 시험해 보고 있었어!"
10030005-73 = "………뭐?"
10030005-74 = "선배, <미네랄 크래프트>를 모른단 말이야? 요새 키보토스의 게이머들 사이에서 가장 인기가 많은 샌드박스 게임인데."
10030005-75 = "아니, <미네랄 크래프트>라면 알고 있지만……"
10030005-76 = "어째서 그 게임이 이 시기에만 할 수 있는 중요한 작업인데?"
10030005-77 = "그게, 며칠 전에 미네랄 크래프트의 신규 모드가 업데이트되었거든."
10030005-78 = "새로운 장비를 제작할 수 있는 신규 광물은 물론이고, 회로에 사용할 수 있는 새로운 논리 규칙도 추가 되었다고!"
10030005-80 = "이런 대규모의 업데이트는 정말 오랜만이라, 분석을 하는 데에도 시간이 꽤나 오래 걸렸어."
10030005-81 = "……베리타스의 일원으로서, 많은 학생들이 알고 싶어하는 신규 게임의 정보를 빠르게 확보해야 한다고 생각했습니다."
10030005-82 = "맞아. 이것도 따지고 보면 엄연한 베리타스의 임무라고!"
10030005-88 = "……그 말인즉."
10030005-89 = "너희들은 하루 종일 연락도 받지 않고 게임에만 몰두하고 있었다는 뜻이야?"
10030005-93 = "결과적으로는 그런 셈이지만……"
10030005-98 = "너희들은 언제까지 그런 나태한 생활을 계속할 거야?!"
10030005-99 = "아무리 휴일이라고는 하지만 하루 종일 밖에도 나가지 않고 게임만 하다니…… 그러다가는 금방 건강을 해치고 말 거라고!"
10030005-101 = "으윽, 또 잔소리……"
10030005-102 = "알았어, 알았어. 이번 신규 모드의 테스트만 끝나면 다시 원래의 생활로 돌아갈 테니까—"
10030005-103 = "원래의 생활이라고 해도 지금과 다를 게 거의 없잖아?"
10030005-104 = "매일 불량 음식만 먹고, 운동은 거의 하지도 않고……"
10030005-105 = "지난 대운동회 때 너희들의 체력이 얼마나 형편없었는지 확실히 깨달았어."
10030005-106 = "이제 곧 새로운 한 해가 다가오는데, 내년에는 밖에도 좀 나가고. 좀 더 건실한 신년 계획을 세우는 건 어때?"
10030005-107 = "아, 그건 걱정하지 마."
10030005-108 = "이래 보여도 신년 계획만큼은 확실하게 세우고 있으니까!"
10030005-109 = "……그래? 그럼 내년 새해 첫날에는 무얼 할 계획인데?"
10030005-114 = "그야 당연히 새해 첫날에는 해돋이를 보러 가야지!"
10030005-119 = "……의외네. 마키가 새해 첫날부터 그런 액티비티한 활동을 계획하고 있었다니."
10030005-120 = "괜찮으면 나도 같이 갈게. 어디서 해돋이를 볼 예정인데?"
10030005-121 = "늘 가던 대로 <동부 평원 지대>에 갈 거야!"
10030005-122 = "……동부 평원 지대? 키보토스에 그런 장소도 있었나?"
10030005-124 = "아니. 동부 평원 지대는 마키가 하는 MMORPG <월드 오브 아카이브>에 나오는 지명이야."
10030005-125 = "<월드 오브 아카이브>는 현실처럼 매일 오전 6시에 해가 뜨기 때문에, 새해 첫날에는 게임 세계 속의 해돋이를 보기 위해 게이머들이 모두 동부 평원 지대로 몰려들지요."
10030005-127 = "해돋이를 보고 싶어 하는 사람들 중에는 동맹만 있는 게 아니니까. 해가 뜨기 전까지 동부 평원 지대에서 이루어지는 PVP도 연례행사나 다름없지!"
10030005-128 = "서부왕국의 전사들을 모두 물리치고, 길드원들과 함께 해돋이를 보았던 작년의 추억은 아직도 잊을 수가 없어……"
10030005-133 = "(안 되겠어…… 이대로 가다간 후배들이 내년에도 나태한 생활을 계속 이어가게 될 거야……)"
10030005-137 = "다들, 올해 마지막 날은 모두 약속 비워 둬."
10030005-143 = "에에— 그 날은 밤새도록 월드 오브 아카이브에서 사냥을 하려 했는데."
10030005-145 = "부부장 명령이야. 예외는 없으니까 모두 아침 9시까지 부실 앞으로 와."
10030005-147 = "부부장 명령이라면 어쩔 수 없지만……"
10030005-148 = "나도 특별한 일정은 없지만…… 다 같이 모여서 무얼 하려고?"
10030005-150 = "다들 해킹에만 몰두하느라 모니터 밖의 세계를 까맣게 잊어버린 것 같아서 말이야."
10030005-154 = "올해는 모두에게 진짜 해돋이를 보여 주겠어!"
10030005-160 = "에에—?!"
