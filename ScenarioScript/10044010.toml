10044010-55 = "아…… 맞구나. 헤헤……"
10044010-56 = "저, 저는 우츠미 아오바라고 하는데요……"
10044010-57 = "두 분의 운행 도우미로 사무국에서 파견된 엔지니어예요……"
10044010-58 = "아하, 맞아. 엔지니어가 합류한다고 했지."
10044010-59 = "뉴 페이스-"
10044010-60 = "하긴 열차 운행하다가 어디 고장 나면 우리는 못 고치니까. 파햐햐!"
10044010-61 = "네, 네에…… 두, 두 분께서는 운전 실력만 좋아서 간부가 된 애송이들이시니까……"
