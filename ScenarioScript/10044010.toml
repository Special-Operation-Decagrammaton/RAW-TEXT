[translation]
10044010-1 = "제1화;평소의 임무"
10044010-2 = "[log]몇 시간 전……[/log]"
10044010-6 = "……해서, 너희를 부른 거다."
10044010-7 = "뭐야, 그냥 평범한 화물 운송 임무네."
10044010-8 = "평소랑 똑같아- 노잼-"
10044010-9 = "아니…… 잘 들은 거 맞나? 아주 중요한 임무라고 말했는데."
10044010-10 = "어차피 별일 없을 거잖아? 그러면 화물이 뭐든 간에 똑같지."
10044010-11 = "왔다 갔다- 끝-"
10044010-12 = "하아…… 그 시간에 운행 가능한 간부가 너희들뿐이라니, 악몽인가……"
10044010-13 = "아무튼! 됐으니 무사히 운행만 마치도록 해. 엔지니어 한 명 붙여줄 테니까."
10044010-14 = "시간 맞춰서 목적지에 화물을 안전하게 운송한다. 그것만 제대로 부탁……"
10044010-15 = "아~ 아~ 알았다고~"
10044010-16 = "화물- 정해진 시간에 정해진 위치- 왕 쉬움."
10044010-17 = "그러니까 좀 진지하게……!!"
10044010-21 = "잔소리 컷!"
10044010-22 = "렛츠 두 디스-"
10044010-29 = "크큭, 이거 이거…… 괜찮겠습니까?"
10044010-30 = "하아…… 부끄럽습니다만, 실력은 확실한 친구들이니 모쪼록……"
10044010-31 = "보아하니 긴장감이 없는 듯한데…… 오히려 이런 임무에 적격일지도요. 큭큭."
10044010-32 = "예. 화물은 정해진 시간에 무사히 도착할 겁니다."
10044010-33 = "그래야지요. 네. 반드시 그래야 합니다. 크큭……"
10044010-36 = "화물 열차 출발지"
10044010-41 = "이 열차구만? 진짜 평소랑 다를 게 없네."
10044010-42 = "중요 화물이라고 스티커 붙일까-? 왕 큰 거-"
10044010-43 = "파햐햐! 그럼 이런저런 녀석들이 이 열차를 노리고 죄다 달라붙겠지!"
10044010-44 = "나름 재밌을 것 같으니 다음에 해보자고."
10044010-48 = "저, 저어……"
10044010-52 = "아, 안녕하세요…… CCC 간부님들…… 맞으신가요……?"
