[translation]
1009015-1 = "처음, 그리고 마지막"
1009015-2 = "죄송해요, 선생님!"
1009015-3 = "[s1] \"괜찮아, 괜찮아……. 5분밖에 안 지났고.\"\n[s2] \"그런데 드문 일이네. 우미카가 지각하다니.\""
1009015-6 = "그, 그게요……."
1009015-7 = "요 앞에서, 축제 준비를 하고 있어서……. 그걸 보다 보니까……."
1009015-8 = "[s] \"축제 준비?\""
1009015-9 = "네. 상점가에서 작은 축제를 준비하고 있대요."
1009015-10 = "사실상 축제를 겸한 바자회나 작은 장터 같은 느낌이었다고 할까요?"
1009015-11 = "우우……. 아무리 작은 축제라지만, 마츠리운영관리부의 부원으로서 놓치고 있었다니, 반성해야겠어요……."
1009015-12 = "[s] \"여차하면 놓치기 쉬웠을 텐데, 잘 알아봤네. 역시 우미카야.\""
1009015-13 = "뭐, 뭘요. 에헤헤."
1009015-14 = "그래도 그렇게 열심히 준비하시는 분들의 모습을 보면……."
1009015-15 = "저도, 정말 최선을 다해 살아야겠다는 생각이 들거든요."
1009015-16 = "[ns] (어딘가 마음 한구석이 매우 찔렸다…….)"
1009015-17 = "그리고 그런 축제 같은 쉼표가 있어야, 일상을 더 잘 보낼 수 있다고도 생각하고요."
1009015-18 = "네? 그건 무슨 의미냐고요? 음……. 그러니까……."
1009015-19 = "저는요. 축제라는 건 일종의 일탈 같은 것이라고 생각해요. 그 시간과 그 자리에서만, 새로운 세계가 열리는 거죠."
1009015-20 = "아, 물론 그게 꼭 축제일 필요는 없을 거예요. 놀이공원이나 여행, 게임이라든가 영화, 책 같은 것도 어쩌면 비슷하겠죠."
1009015-21 = "중요한 것은…… 사람들이 잠시만이라도 일상을 내려놓고, 다른 어딘가에 다녀왔다는 기분을 주는 것이라고 생각하거든요."
1009015-22 = "네. 새로운 세계예요, 선생님! 아까도 말씀드렸지만요!"
1009015-23 = "잠시 다들 무언가를 내려놓고…… 이른바, '바보'가 되는 시간이라고나 할까요?"
1009015-24 = "아침부터 떠들썩한 축제가 시작되어서, 밤의 불꽃놀이가 막을 내리면, 그 자체로 하나의 세계가 시작되고 닫히는 거죠."
1009015-25 = "그래서 그 세계를 겪고 온 사람들은, 새로워진 기분으로 다시 한번 일상을 힘차게 살아갈 수 있게 되는 거고요."
1009015-26 = "말해 놓고 보니 그거 같아요! 이세계나 이차원, 뭐 그런 거요!"
1009015-27 = "물론 단점이 없는 것은 아니긴 해요……."
1009015-28 = "그 분위기에 홀려서, 앞뒤 생각 안 하고 이것저것 사버리게 되거든요……."
1009015-29 = "[s] \"응……. 있지, 있어……. 그런 거…….\""
1009015-30 = "그, 그래도 후회 안 하는 것도 있어요!"
1009015-31 = "가령, 이것처럼요."
1009015-37 = "[ns] \"그게 뭐야? 인형?\""
1009015-38 = "네. 에헤헤……. 제가…… 처음으로 갔던 축제에서 산 인형이에요."
1009015-39 = "지금보다 키가 절반밖에 되지 않았을 때였죠."
1009015-40 = "지금 생각해 보면, 왜 샀는지 잘 모르겠다는 느낌도 들지만……."
1009015-41 = "그때는, 그냥 한눈에 들어왔고, 이건 살 수밖에 없다고 생각했어요."
1009015-42 = "[ns] \"그런 거 있지, 있어…….\""
1009015-44 = "[ns] \"그런데 이거, 남자아이인지 여자아이인지 헷갈리는데? \""
1009015-45 = "맞아요! 저도 아직 모르거든요!"
1009015-46 = "그때 노점상분도, 맞춰 보라고 하시면서 끝까지 안 알려주셨거든요."
1009015-47 = "언젠가 여쭤봐야지, 여쭤봐야지 하면서 쭉 마음을 졸였는데……."
1009015-48 = "에헤헤. 결국 이렇게 됐네요."
1009015-49 = "[s] \"그야말로 첫 축제의 추억이구나.\""
1009015-50 = "맞아요! 그런 셈이죠!"
1009015-51 = "하지만 여기에서…… 또 다른 서프라이즈가 있답니다!"
1009015-52 = "[s] \"기대되는구만!\""
1009015-53 = "그, 그렇게 대단한 건 아니고요……."
1009015-54 = "사실 이 인형, 또 하나가 있거든요."
1009015-60 = "[ns] \"아하. 둘이서 한 쌍인 거구나.\""
1009015-61 = "네. 바로 그거죠."
1009015-62 = "그때 노점상분은, 이 두 아이를 같이 가지고 다니다가……."
1009015-66 = "……다니다, 가……."
1009015-67 = "[s] \"다니다가?\""
1009015-71 = "아, 아아아아아무것도 아니에요!"
1009015-72 = "죄송합니다, 선생님! 저 오늘 당번인데!"
1009015-73 = "맞아요, 일! 선생님의 일을 도와드려야죠, 네!"
1009015-74 = "[s] \"우미카?\""
1009015-75 = "자, 자아. 선생님! 우리 빨리 일 끝내요!"
1009015-76 = "그리고 축제는 내일 열린다고 하는데요……."
1009015-77 = "혹시, 괜찮으시면 저와……."
1009015-78 = "[s] \"그래. 그러자.\""
1009015-79 = "……!"
1009015-80 = "감사합니다!"
1009015-82 = "(그렇게 우미카와 함께, 일과를 마무리 지어갔다.)"
1009015-83 = "(우미카가 무사히 돌아간 후…….)"
1009015-86 = "[ns] \"어라?\""
1009015-89 = "[ns] \"이건 혹시……?\""
1009015-90 = "(우미카에게 인형을 놓고 간 것 같다고 전화하려던 순간…….)"
1009015-94 = "(……인형을 내려놓고, 모모톡을 보내기로 했다.)"
