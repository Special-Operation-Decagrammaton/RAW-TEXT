[translation]
90002250-1 = "제25화;에필로그 1"
90002250-3 = "아, 선생님!"
90002250-4 = "안녕하세요, 선생님! 아리스도 토키도, 안녕?"
90002250-6 = "안녕하세요!"
90002250-7 = "안녕하십니까. 좋은 날이군요."
90002250-9 = "그러고 보니, 요즘 며칠 잘 안 보이시던데…… 무슨 일이라도 있으셨나요?"
90002250-10 = "맞아요! 저 그저께 샬레 당번이었는데, 책임져 주세요!"
90002250-11 = "[s] \"미안, 미안.\""
90002250-12 = "네? 정말요? 다음 주에요? 약속하신 거예요?"
90002250-20 = "어……? 지금 뭔가 지나가지 않았나요……?"
90002250-22 = "?!?!"
90002250-23 = "아뇨! 아, 아아, 아무것도 아닐 겁니다! 분명 그렇습니다! 그렇지요, 토키?!?!"
90002250-24 = "……네. 그렇, 습니다. 그렇지요……."
90002250-29 = "……?"
90002250-30 = "흐음……?"
90002250-31 = "[s1] \"그, 그래! 맞아!\"\n[s2] \"난 아무것도 못 봤…… 못 느꼈는데?!?!.\""
90002250-34 = "그런가요오~? 이상하다아~?"
90002250-35 = "선생님 뭐 숨기시는 거 아니죠? 이상하게 많이 당황하시는 것 같은데요?"
90002250-36 = "맞아요, 맞아요. 이러면 없던 의심도 생긴다니까요."
90002250-38 = "끄앙! 어떻게 하죠, 토키?!"
90002250-39 = "역시 여차하면 수복한 아비 에슈흐를 불러내서, 물리적인 기억 소거라도……!"
90002250-40 = "그, 그러면 안 된다고 생각합니다……!!!"
90002250-42 = "맞아! CCTV 확인해 보면 되겠다! 할 수 있지?"
90002250-43 = "그 정도야 어렵지 않지."
90002250-44 = "[s] \"그, 그게 돼?! \""
90002250-45 = "되고 말고요. 여긴 밀레니엄인걸요. 어때? 뭐 좀 있었어?"
90002250-49 = "어라……? 정말 아무것도 없네……."
90002250-50 = "에이, 뭐야. 시시하게."
90002250-51 = "[s] \"어험, 어험. 함부로 사람을 의심하면 안 돼요~\""
90002250-52 = "네에~"
90002250-53 = "그러면 선생님 또 뵙겠습니다. 아리스도 토키도, 나중에 봐~"
90002250-60 = "크, 큰일 날 뻔했습니다……."
90002250-61 = "어떻게든 되긴 했군요. 그러면 리오 님, 케이. 이제 나오셔도 될 것 같습니다."
90002250-67 = "다행이었네……."
90002250-68 = "……생각해 보니 말이죠. 리오는 그렇다 쳐도 왜 저까지 숨어야 했던 걸까요……."
90002250-70 = "일종의 팀플레이라는 것이 아니었을까 합니다."
90002250-71 = "자꾸 나오는 대로 이야기하지 말고요……."
90002250-78 = "……."
90002250-79 = "왜 그래요, 리오?"
90002250-80 = "그게……. 정말로 와 버렸구나, 싶어서……."
90002250-81 = "괜찮습니다, 리오. 아리스도 같이 용기를 낼 테니까요! 분명 모든 게 잘될–"
90002250-87 = "어머나. 안녕하세요, 선생님. 아리스 쨩. 토키 씨도 있었군요?"
90002250-88 = "끄, 끄앙?!?!"
90002250-94 = "[ns3] \"아리스? 아리스?! 용기를 낸다며!\"\n[ns4] \"그렇게 갑자기 선생님 뒤에 숨으면……!\""
90002250-97 = "왜 그러나요, 아리스 쨩? 마치 엄청나게 무서운 것을 보았다는 것처럼 말이죠."
90002250-102 = "아, 아닙니다. 죄송합니다……. 그런 것이 아니라……. 그러니까……."
90002250-103 = "후훗. 토키 씨도, 안녕하세요? 보고는 잘 받아 보았습니다. 물론 많이 축약된 것이었을 거라고 믿고 있지만요."
90002250-107 = "네, 네에. 해당 사건에 대한 자세한 사항은, 추후……."
90002250-108 = "[s] (그 토키가…… 겁에 질리다니……!)"
90002250-109 = "괜찮아요. 아리스 쨩. 토키 씨. 여러분은 정말로 수고와 고생만 하셨으니까요."
90002250-110 = "약간 실례가 될지도 모르겠지만, 제가 이 자리에서 조금 더 이야기를 나눠 보고 싶은 분들은–"
90002250-114 = "안녕하세요, 케이 쨩? 직접 만나는 건 처음이죠? 우시오 노아입니다."
90002250-118 = "……여기에서도 케이 쨩 확정이군요……. 네, 네. 텐도 케이입니다. 만나서 반가워요, 노아."
90002250-119 = "후훗. 정말로 반가워요. 앞으로 밀레니엄에서, 잘 부탁할게요."
90002250-120 = "그리고."
90002250-127 = "읏……!"
90002250-128 = "……."
90002250-129 = "……."
90002250-130 = "실로, 오랜만이네요. 리오 회장."
90002250-131 = "기, 기다려 줘. 설명할 수…… 있어."
90002250-132 = "괜찮아요, 리오 회장. 굳이 저에게 설명하지 않으셔도."
90002250-133 = "그, 그래……?"
90002250-134 = "왜냐하면 리오 회장의 설명을 듣고 싶어 하는 사람은, 따로 있거든요."
90002250-135 = "어? 그 이야기는……?!"
90002250-136 = "네."
90002250-140 = "유우카 쨩이, 회장을 쭉 기다리고 있었답니다?"
90002250-141 = "?!?!?!"
90002250-142 = "그러면, 저쪽 문으로 들어가 주시겠어요?"
90002250-148 = "아, 알았어……."
90002250-149 = "……선생님. 이거 저까지 무서워지기 시작했는데요……."
90002250-150 = "[s] \"나도 심장이 얼어붙을 것 같아…….\""
90002250-151 = "그런데, 회장?"
90002250-152 = "으, 응?"
90002250-153 = "유우카 쨩은 평소에 자주 화내는 것처럼 보이고, 토라지기도 하고."
90002250-154 = "그러면서도 웬만한 부탁은 결국 들어주는 상냥한 제 친구이지만."
90002250-155 = "유우카 쨩이 진심으로 화내면, 저도 어떻게 못 해 드린답니다?"
90002250-156 = "그러니 오늘만큼은, 각별히 주의해 주세요?"
90002250-157 = "?!?!!!!!"
90002250-158 = "서, 선생……!"
90002250-159 = "[s] \"리오.\""
90002250-161 = "[ns] \"사람에게는…… 각오를 굳혀야 할 때가 있어……!\""
90002250-162 = "……알았어."
90002250-163 = "이것이, 내가 짊어져야 할 짐이라면……."
90002250-172 = "어머나, 리오 회장. 어서 와. 엄청난 일을 겪었다면서?"
90002250-173 = "밀레니엄에 드디어 복귀한 것을 환영한다고 해야 할까?"
90002250-174 = "결과적으로는 우리가 모르는 사이에, 키보토스를 구하기도 했다고 들었는데."
90002250-175 = "총체적으로, 그 부분은 고생이 많았어."
90002250-176 = "격려하고 인정해야 할 부분을 짚고 넘어가지 않으면, 다음 이야기로 나아갈 수 없잖아?"
90002250-180 = "유우카. 그러니까 그게, 내 말을 들어줘. 내가 다 설명할 수 있어. 그러니까–"
90002250-181 = "왜 그래, 회장?"
90002250-182 = "그러면 내가 마치."
90002250-183 = "예전부터 회장이 숨겨 왔던, 예산 횡령부터 이어졌던 모든 문제에 대해."
90002250-184 = "할 말을, 간신히 참고 있는 것처럼 보이잖아?"
90002250-185 = "으, 읏……!"
90002250-186 = "그러면."
90002250-188 = "이제부터 우리, 조금 더 깊은 이야기로 넘어갈까 하는데."
90002250-189 = "괜찮겠지?"
90002250-190 = "히잇……!"
90002250-197 = "으아앙! 으아앙! 아리스는 무섭습니다!"
90002250-198 = "이것이…… 말로만 듣던……."
90002250-200 = "선생님, 저희는 어떻게 해야……!"
90002250-201 = "[s] \"버텨야 해…… 견디는 거야……!\""
90002250-208 = "음."
90002250-209 = "왠지 모르게, 저까지 스트레스가 풀리는 기분이네요."
90002250-215 = "리, 리오 선배……?"
90002250-216 = "괜찮아요, 리오? 아뇨, 한눈에 보기에도 안 괜찮아 보이지만, 어쨌든……!"
90002250-225 = "[ns] \"어? 코유키는 언제? 왜……?\""
90002250-227 = "……."
90002250-228 = "잘 모르겠습니다만, 아마 그럴 일을 저질렀을 겁니다."
90002250-229 = "[s] \"그건 그렇겠지…….\""
90002250-231 = "[ns] \"그보다 리오! 괜찮아? 무사하지……?\""
90002250-236 = "……."
90002250-237 = "괜찮아."
90002250-238 = "괜찮…… 아."
90002250-239 = "선생의 말대로, 각오는 하고 있었으니까……."
90002250-240 = "어, 각오한 것보다 몇 배는 더 타격이 있어 보이는데요……?"
90002250-241 = "……."
90002250-242 = "선생. 그리고 모두."
90002250-243 = "한 가지, 확실하게 알았어."
90002250-244 = "진실이란 건…… 때로……."
90002250-245 = "사람을…… 정신적으로 거의 죽일 수도…… 있구나……."
90002250-250 = "[ns5] \"리오?! 리오~!!!\"\n[ns6] \"으흐흑……! 리오가 결국 이렇게……!!!\""
90002250-255 = "……관점에 따라서는 가슴 아픈 장면이겠습니다만."
90002250-256 = "동정은 하지 않겠어요, 회장. 그편이 당신에게는 더 비참할 것 같으니까요."
90002250-257 = "애초에 유우카 쨩을 정말로 화나게 한 시점에서, 정상 참작이 어려운 상황이기도 하고요."
90002250-263 = "하아…… 정말이지……."
90002250-264 = "[s7] \"아, 안녕. 유우카……?\"\n[s8] \"우, 우리 뭔가 조금 오랜만인 것 같네! 그, 그렇지?!\""
90002250-267 = "……."
90002250-268 = "네. 안녕하세요. 선생님. 말씀 주신대로, 뭔가 조금 오랜만이네요. 아리스 쨩도 토키도, 그런 것 같고."
90002250-269 = "……!"
90002250-270 = "안녕, 하신가요. 유우카."
90002250-271 = "응. 네루 선배…… 아니, 이 경우는 히마리 선배에게, 안부 전해 달라고 해야겠네."
90002250-272 = "……알겠습니다. 반드시."
90002250-273 = "그리고……."
90002250-277 = "네가, 케이 쨩이겠구나?"
90002250-278 = "……."
90002250-279 = "유, 유우카! 괜찮습니다! 케이는 아무렇지도 않습니다! 문제없습니다! 안전합니다!"
90002250-280 = "뭔가 문제가 생긴다면…… 아, 아리스도 같이 죽겠습니다!"
90002250-281 = "[s9] \"그래! 맞아! 선생님도 어떻게든 책임질 테니까, 응?\"\n[s10] \"일단 기분을 가라앉히고, 어…… 아무튼 천천히 이야기하자!\""
90002250-287 = "네? 갑자기 왜 그러시나요? 아리스 쨩도……."
90002250-288 = "……."
90002250-289 = "좋아요. 특별히 선생님은, 나중에 샬레에서 뵙는 것으로 하죠."
90002250-290 = "……!"
90002250-291 = "그리고 아리스 쨩과 케이 쨩에 대한 것 말인데."
90002250-292 = "끄아앙……."
90002250-293 = "우선 부탁하고 싶은 건, 그렇게 겁먹지 말아 달라는 거야. 나도 대강 사정은 알고 있고."
90002250-294 = "네……?"
90002250-295 = "……네? 그건……."
90002250-296 = "어째서, 입니까. 유우카……?"
90002250-297 = "네 경우와 마찬가지야."
90002250-298 = "네……?"
90002250-303 = "케이 쨩도 전학 수속 밟아야지. 안 그래?"
90002250-305 = "……?"
90002250-307 = "……!"
90002250-308 = "고맙습니다, 유우카!"
90002250-309 = "그래, 그래. 착하지."
90002250-313 = "그리고 앞서 말씀드렸던 것처럼, 선생님은 나중에 저와 이야기 좀 하시죠."
90002250-314 = "[s] \"아, 알겠습니다!\""
90002250-321 = "하–여–튼–! 예전부터 그랬지만, 리오 회장은 말이죠!!!"
90002250-322 = "다른 사람 고생은 생각도 안 하고! 끝만 좋으면 다 될 거라고 생각하고!"
90002250-324 = "무슨 마지막에 벌어서 갚으면 된다는 거예요?! 그거 코유키랑 뭐가 다른데요!"
90002250-325 = "물론 회장이 나쁜 생각으로 그러는 건 아니고!"
90002250-326 = "애초에 마음이 약해서, 나쁜 일 같은 건 생각도 못 하는 사람이라는 것도 알지만 말이죠!"
90002250-327 = "[s11] \"유우카, 유우카! 우리 초콜릿 먹자, 응?!\"\n[s12] \"설탕 안 쓰고 대체당을 넣은 제로 초콜릿이래!\""
90002250-332 = "고마워요, 선생님. 웅냠냠……."
90002250-333 = "후우……. 속이 좀 풀리네요."
90002250-334 = "[s13] (몇 시간 동안 이야기했으니까…….)\n[s14] (그래도 화가 풀렸다니 다행이야…….)"
90002250-337 = "어쨌든 리오 회장에게는, 지금까지 회장의 부재로 발생했던."
90002250-338 = "유형무형의 손해 사항들에 대한 책임을 요구하는 것이, 행정상의 절차가 될 텐데요."
90002250-339 = "우으……. 여기에서 문제가 조금 있었어요. 밀레니엄은 딱히……."
90002250-340 = "……회장이 없었다고 해서, 특별히 손해라고 할 것이 일어나지 않았거든요."
90002250-341 = "오히려 모습을 드러내고 활동했던 다음에야, 손해가 발생했다고 해야 할지 뭐라고 해야 할지……."
90002250-342 = "[s15] \"그, 그러면 그 대신!\"\n[s16] \"리오를 회장직에서 물러나게 하거나, 그러는 거야……?\""
90002250-347 = "아뇨? 리오 회장 말고 누가 회장을 해요?"
90002250-348 = "그, 그렇게 의외라는 표정을 지으셔도 말이죠……? 애초에 밀레니엄은 능력제 학원이고……."
90002250-349 = "순수하게 능력 위주로만 따지면 리오 회장 따라갈 학생도 없을 거고요."
90002250-350 = "거기에 이번 일, 밀레니엄식 보고서로 보고받은 게 전부이지만."
90002250-351 = "그 내용대로라면, 회장이 이뤄낸 성과 자체에 뭐라고 할 수도 없을 것 같고요."
90002250-352 = "아무튼 세상과…… 키보토스를 구한 거니까 말이죠."
90002250-353 = "[s17] \"그렇게 생각해 줘서 고마워…….\"\n[s18] \"그런데 갑자기 이런 걱정도 들어서 그러는데 말이지…….\""
90002250-356 = "네? 여러 가지 의미로 리오 회장을 감당할 수 있겠냐고요……?"
90002250-357 = "……."
90002250-358 = "그러게 말이에요……. 하아……."
90002250-359 = "그래도 해 봐야죠. 선생님은 어떤 학생도 포기하지 않으실 거잖아요?"
90002250-360 = "그런 의미에서 이번에는, 선생님이라는 브레이크도 있을 거고 말이죠!"
90002250-361 = "[s] \"그래. 리오도 많이 배웠을 거야.\""
90002250-363 = "[ns] \"……배웠겠지?\""
90002250-364 = "그걸 왜 저한테 물으세요……. 심정은 이해하지만요."
90002250-365 = "어쨌든, 다음 안건은 케이 쨩의 전학 수속이에요."
90002250-366 = "네? 무사히 잘될 것 같냐고요."
90002250-367 = "……."
90002250-368 = "원칙적으로, 조금 애매하게 해석될 수 있는 부분이 있기는 하죠."
90002250-371 = "어떤 의미로 케이라는 학생이, 갑자기 밀레니엄 사이언스 스쿨 한복판에 '쨘!'하고 나타난 것이나 마찬가지잖아요?"
90002250-372 = "그리고 이렇게 갑자기…… 으, 이런 표현은 별로 좋아하지 않지만요. '마법'처럼 등장한 학생에 대해."
90002250-373 = "어떻게 받아들이고 후속 처리를 진행해야 할지, 밀레니엄의 교칙에는 정해져 있는 부분이 없거든요."
90002250-376 = "[ns] \"……오히려 그런 교칙이 있으면 이상할 것 같네…….\""
90002250-377 = "네. 그렇겠죠. 그러니 여기에서는 이 상황 자체를 특례로 삼아, 행정상 최고 결정권자의 의사를 따르는 것이 맞을 텐데요."
90002250-378 = "때마침, 리오 회장이 복귀한 상황이니 오히려 잘 됐다고도 볼 수 있겠네요."
90002250-379 = "예전…… 가령 일주일 전이었다면, 누가 결정하고 누가 책임을 지고 어떻게 상황을 관찰할 것인지."
90002250-380 = "적게 잡아도 3박 4일 내내 회의를 해야 했겠지만."
90002250-381 = "덕분에, 그 모든 과정을 생략하게 된 셈이죠."
90002250-382 = "[s] \"대답은 짐작이 가지만……. 리오는 뭐래?\""
90002250-383 = "흐응. 뭐라고 했을 것 같으세요, 선생님?"
90002250-384 = "후후. 맞아요. 그리고 학업 의지를 가진 학생을 거부하는 것은, 밀레니엄의 설립 취지에도 어긋나는 것이기도 하고요."
90002250-388 = "그런 의미에서 케이 쨩은, 이제부터 밀레니엄 사이언스 스쿨의 편입생이랍니다!"
90002250-389 = "[s] \"벌써?!\""
90002250-390 = "어차피 아리스 쨩 때에도 해 본 거니까요."
90002250-391 = "처음 하는 게 어렵지, 두 번째는 아무것도 아니죠."
90002250-392 = "그리고…… 제가 여기까지 선생님을 찾아온 이유는, 따로 있으니까 말이에요!"
90002250-393 = "[s] \"그, 그게 뭔데?\""
90002250-394 = "……."
90002250-399 = "제가! 얼마나! 선생님 걱정했는지! 아세요?!"
90002250-400 = "그때도! 간신히 위치를 찾았다고 생각했더니! 툰드라에 가 계시고!"
90002250-401 = "그렇게 걱정했는데, 어떻게든 잘될 거라고만 이야기하시고……. 사정 설명도 잘 안 해 주시고……."
90002250-402 = "물론 그럴 시간도 상황도 아니었다는 걸 알았지만요……. 선생님 덕분에, 강철대륙이라는 위기 현상이 해결된 것도 맞고……."
90002250-403 = "그래도, 그래도……."
90002250-405 = "얼마나, 걱정했는데요……."
90002250-406 = "[s] \"미안해, 유우카.\""
90002250-407 = "몰라요……."
90002250-408 = "[s] \"다시는 안 그럴게.\""
90002250-409 = "결국 비슷한 일이 일어나면 또 그러실 거면서…"
90002250-410 = "[s19] \"어, 음. 부정은 못 하겠지만…….\"\n[s20] \"그래도 아무 이야기도 안 하고 사라지지는 않도록…… 노력할게.\""
90002250-413 = "……정말요?"
90002250-414 = "[s] \"으, 응!\""
90002250-415 = "……알았어요."
90002250-418 = "그러면 그 대신! 이제부터 강철대륙에서 있었던 일, 더 자세히 들려주시는 거예요?"
90002250-419 = "이미 보고받지 않았냐고요? 하지만 말씀드렸잖아요. 그건 '밀레니엄식' 보고서였다고요."
90002250-420 = "최대한 수식어를 제외하고… 감정을 제거한 채 사실만을 언급하며…… 원인과 결과 위주로 간략하게 서술한……."
90002250-421 = "말과 언어 역시 자원이고, 자원은 가능한 한 합리적이고 효율적으로 소비되어야 한다는."
90002250-422 = "그야말로 밀레니엄다운 방식으로 제작된 보고서였다고요."
90002250-423 = "[s] \"그래. 확실히 이건 내가 해야 할 일이겠네.\""
90002250-424 = "후후. 알아주시니 감사하네요."
90002250-428 = "[ns] \"어디 보자……. 그러면 어디부터 시작할까…….\""
90002250-430 = "(그렇게 웃고, 감탄하고, 가끔은 믿지 못하거나 마침내 울기까지 하면서.)"
90002250-431 = "(유우카에게, 모든 이야기를 전달했다.)"
90002250-448 = "(강철대륙. 데카그라마톤. 아인, 소프, 오르.)"
90002250-449 = "(그리고, 케이에 대한 것 역시도.)"
90002250-453 = "선생님."
90002250-454 = "[s] \"응?\""
90002250-455 = "주무세요?"
90002250-456 = "[s] \"조금…… 아니, 꽤 졸리기는 해.\""
90002250-457 = "네."
90002250-458 = "오늘은 이만 쉬세요."
90002250-459 = "그리고 걱정하지 마세요."
90002250-466 = "케이 쨩은 제가 무슨 일이 있어도, 그리고…… 무슨 수를 써서라도."
90002250-467 = "반드시 아리스 쨩과 같이, 밀레니엄에 있을 자리를 만들어 둘 테니까요."
90002250-468 = "너무 수고 많으셨어요."
90002250-472 = "그리고, 감사합니다."
90002250-474 = "다음화;에필로그 2"
