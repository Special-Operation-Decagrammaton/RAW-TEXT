[translation]
10034030-1 = "제3화;와일드헌트의 귀인"
10034030-5 = "음……. 일단 선생님 말씀대로 오기는 했지만……."
10034030-6 = "……아. 저기예요. 낮에는 저기서 버스킹을 하고 있었어요."
10034030-7 = "지금은……. 어라?"
10034030-11 = "[ns1] \"지금도 누군가 버스킹을 하고 있네.\"\n[ns2] \"늦은 시간까지 대단한걸.\""
10034030-14 = "일단 가 볼까요. 어두운 데다 멀어서 아직 잘 안 보이니……."
10034030-20 = "……역시 아니네요. 다른 분이었어요."
10034030-21 = "으음……. 이제 어쩐다……."
10034030-22 = "음? 무슨 일이야, 아가씨?"
10034030-28 = "학생이 이런 시간까지 밖에 돌아다니면 위험하다고. 보호자도 없이……."
10034030-29 = "어라. 아니, 실례되는 말을 했었군. 어른이 함께 있었군요. 하하."
10034030-30 = "어디 보자. 이런 시간까지 길거리 공연을 보겠다고 일부러 왔을 리는 없겠고……."
10034030-31 = "뭔가 이유라도 있나? 찾는 사람이라도 따로 있다던가?"
10034030-32 = "[s3] \"아, 그게 말이죠…….\"\n[s4] 자초지종을 설명한다."
10034030-36 = "과연. 대충 상황은 이해했수다. 그런 일이 있었구만."
10034030-37 = "내가 직접 보진 못했지만……. 다행히 지금 말하는 사람이 누군지는 알 것 같아."
10034030-38 = "정말인가요!? 어, 어떻게……."
10034030-39 = "뭐, 와일드헌트 학생이었으니까 말이지. 실력 또한 와일드헌트 답게 엄청났다고 하고……."
10034030-40 = "와일드헌트……?"
10034030-41 = "아……. 그러고 보니 그 교복……."
10034030-46 = "……역시 그랬구나……. 그런 사람이니까……."
10034030-48 = "아무튼 뭐, 찾고 싶다면 내가 들은 마지막 장소를 가리켜 줄 테니 우선 그쪽으로 가 보도록 하는 게 어떻겠소?"
10034030-49 = "물론 지금은 거기 없겠지만……."
10034030-50 = "거기서 마지막으로 본 사람에게 또 다음 위치를 얻고, 또 찾아가고 하는 식으로 반복하다 보면 언젠가……?"
10034030-51 = "으음……. 하긴, 이런 건 시간이 남아도는 나 같은 사람에게나 맞는 일이려나."
10034030-52 = "그쪽은 선생님이라고 했으니 어지간히 바쁜 사람일 텐데, 나도 모르게 또 실례를 했을지 모르겠군."
10034030-53 = "아, 아니에요. 말씀만으로도 감사합니다."
10034030-59 = "[ns5] \"위치를 가르쳐 주시겠습니까?\"\n[ns6] \"실례일 리가요. 도와주시면 감사하겠습니다.\""
10034030-62 = "선생님……?"
10034030-68 = "하, 하지만 말씀해 주신 대로 시간이 엄청 걸릴 텐데……. 게다가 찾을 수 있다는 보장도 없고……!"
10034030-69 = "……괜찮다고요? 그렇지만……."
10034030-70 = "[s7] \"밤 산책은 좋아하는 편이거든.\"\n[s8] \"책상 작업보단 이게 즐거우니까.\""
10034030-80 = "자, 자. 아가씨. 이럴 땐 어른이 하는 말을 듣는 거니까."
10034030-81 = "위치는 가르쳐 줄 테니, 얼른 가 보시구려. 혹시 알겠수? 타이밍 좋게 거기 있을지."
10034030-82 = "네, 네……! 그럼……!"
10034030-89 = "……감사합니다!"
10034030-94 = "(이후 안내받은 대로, 아이리와 함께 '공연하는 와일드헌트 학생'의 단서들을 찾아 다녔다.)"
10034030-105 = "(……밤을 꼬박 새웠지만, 아무런 수확도 얻지 못한 채 새벽을 맞이하고 말았다.)"
10034030-108 = "……아……. 벌써 시간이……."
10034030-109 = "죄송해요, 선생님. 결국 이렇게 돼버렸네요. 괜히 저 때문에 밤까지 새셨네요."
10034030-110 = "괜찮으시다고요? 하하……."
10034030-111 = "……죄송해요. 선생님께선 늘 그렇게 말씀해 주시지만, 그래도……."
10034030-112 = "아니. 이러면 안 되죠. 이러면 괜히 선생님께서 더 불편해지실 텐데 말이에요."
10034030-113 = "그렇지만……. 알지만……."
10034030-117 = "사실은……. 도중에 몇 번이나 '괜찮으니 돌아가죠'라고 말씀드릴까 생각했었는데."
10034030-118 = "그때 말씀드려서 그만뒀다면, 지금 여기까지 오지도 않았을 텐데 말이에요."
10034030-119 = "애초에 그 사람도 '와일드헌트'의 학생이라고 했었으니, 저 같은 애와는 다른 사람이고……."
10034030-120 = "만약 만났다 해도, 제가 뭘……."
10034030-124 = "[ns9] \"역시 잠시 이야기를…….\"\n[ns10] \"아이리. 잠깐…….\""
10034030-127 = "……꼭두새벽부터 누가 이렇게 부정적인 말씀을 하시는지요."
10034030-132 = "……!? 모, 목소리? 사람……?"
10034030-133 = "듣고 있자니 아무래도 염려가 되어, 그만 달콤한 꿈에서 깨어 버리고 말았답니다."
10034030-142 = "두둥. 잠자던 숲속의 공주……. <시이나 츠무기>의 등장이로군요."
10034030-143 = "공주가 진부하다면 깨어난 마왕이나 발각된 스파이도 좋습니다. 그건 취향대로 하시고……."
10034030-144 = "실은 숲속도 아니고 공주도 아니지만, 여기선 그런……."
10034030-149 = "……'감성'."
10034030-150 = "……이 중요하니까요."
10034030-151 = "지금 무엇보다 중요한 것은 우리의 주인공이 가진 고뇌."
10034030-152 = "그렇습니다. 바로 이 아가씨의 이야기니까요."
10034030-156 = "[ns11] \"야외 덤불 속에서 자고 있었다고!?\"\n[ns12] \"감기 걸리면 어쩌려고……!!\""
10034030-159 = "……어머나."
10034030-160 = " 이 얼마나 정확한 타이밍에 적절한 태클!"
10034030-161 = "이해했습니다. 당신은 그런 캐릭터시군요. 주인공 곁을 지켜주는 감초와도 같은 존재."
10034030-162 = "혹시 모두의 마스코트……. 같은 존재라거나?"
10034030-168 = "……?"
10034030-172 = "아아아아아아아앗-!!!"
10034030-173 = "갑작스러운 발성!"
10034030-174 = "이, 이 이 사람! 이 사람이에요, 선생님!! 제가 말했던 그 분……!!"
10034030-175 = "공연하는 와일드헌트 학생이에요!!"
10034030-176 = "……? 흐음?"
10034030-177 = "어라어라……. 이거, 생각지도 못한 기연이 또……."
10034030-178 = "두 분……."
10034030-179 = "……설마 저를 찾고 계셨던 건가요? 지금까지."
10034030-181 = "과연……. 그렇군요. 이해했습니다."
10034030-182 = "의도한 건 아니지만……. 길고도 험한 발걸음을 하게 만들었군요. 괜히 죄송해지는걸요."
10034030-183 = "아, 아니에요. 절대 그런 의미는……."
10034030-184 = "허나 그러한 여정이 있었기에, 비로소 지금 우리의 만남이 가치를 만들어낸 게 아닐까요?"
10034030-185 = "……?"
10034030-186 = "두 분께는 죄송한 이야기가 될 수 있으나 저는 지금의 상황이 아주 흡족하네요. 마치 삼고초려의 책사……. 혹은 미궁의 보물."
10034030-187 = "아니, 여기선 조금 거창하게 해적왕의 보물이라고 해볼까요? 그런 게 된 기분이라서요."
10034030-192 = "[ns13] 진짜 이 사람이 맞는지, 아이리에게 물어본다.\n[ns14] \"어딘가 이상한 친구 같은데…….\" (소곤)"
10034030-195 = "저, 저도 실제로 대화를 나누는 건 처음이라……. (소곤)"
10034030-197 = "그러나 저희가 이렇게 드라마틱한 만남을 가진 건, 또한 저에게 응할 '책무'가 있다는 것."
10034030-198 = "실제로 그런 규정이나 법 따윈 없겠지만, 여기선 그런……."
10034030-203 = "……'흐름'."
10034030-204 = "……이 중요한 거니까요."
10034030-205 = "좋습니다. 이 시이나 츠무기. 두 분을 위해 전심전력 물심양면으로 돕겠습니다."
10034030-206 = "저, 정말인가요? 정말 그래 주시는 건가요?"
10034030-207 = "곡을 만들어 주는 것도 아니고, 어울리는 곡을 골라 주는 것 정도는 '도움'이라 하기도 민망하지요."
10034030-208 = "어떤 곡이 좋으실까요? 우리의 가련한 주인공은 어떤 BGM을 원하고 있을까요?"
10034030-209 = "좋아하시는 곡, 들려주고픈 곡에 대해 말씀해 주세요. 미력한 힘으로나마, 최대한 쥐어짜 내 보지요."
10034030-210 = "그, 그럼……!"
10034030-211 = "그럼 테스트나 오디션에서 통과할 수 있는……!!"
10034030-212 = "……?"
10034030-213 = "……네?"
10034030-214 = "시연이나 평가에 가장 좋을 것 같은, '좋은 평가를 받을 수 있는 곡'을 골라 주세요!!"
10034030-215 = "……음? 죄송해요. 잠시 이해가 안 갔군요. 지금 뭐라고 말씀하셨죠?"
10034030-216 = "테스트나 평가에 가장 잘 어울릴 수 있는 곡……? 그게 무슨 이야기일까요?"
10034030-217 = "말 그대로예요! 저희는 2주 뒤에 <트리니티 사육제>의 오프닝 공연을 하려고 하거든요."
10034030-218 = "그 공연을 하고……. 사람들에게 잘하는 모습을 보여주려는 게 목표에요. 그러니 그 이전에 테스트 통과를……."
10034030-219 = "……아……하……."
10034030-220 = "……? 어, 어라……."
10034030-221 = "……혹시 뭔가 이상한가요? 혹시 저, 뭔가 무례한 말을……."
10034030-222 = "아뇨. 뭐, 이상할 건 없어요. 음악을 하는 이유, 연주를 하고자 하는 이유에 대해서는 그 누구도 타인에게 간섭할 수 없지요."
10034030-223 = "없지만……. 그렇지만……. 흠……."
10034030-227 = "……과연. 알겠습니다. 이 이야기의 진도는 현재 그런 상황이로군요."
10034030-228 = "일단 말씀은 이해했으니, 당장 떠오르는 곡이 몇 가지 있긴 하군요. 골라드리도록 하죠."
10034030-230 = "……!!"
10034030-231 = "……다만."
10034030-232 = "……!? 네, 네? 다만……?"
10034030-237 = "다만 음……. 그렇군요. 지금은 그런 전개니까……."
10034030-238 = "지금 제가 여기서 이런 말을 한다고 그것이 주인공에게 얼마나 의미가 있을지는 잘 모르겠어요."
10034030-239 = "하지만 원래 '시간이 지나야 깨닫게 되는 키워드'라는 것도 존재하는 법. 저 또한 아주 좋아하는 테마이고요."
10034030-240 = "그러니 일단 말씀드리겠습니다. 지금 당장은 적당히 넘기셔도 좋아요."
10034030-241 = "……??? 음……???"
10034030-242 = "……주인공, 쿠리무라 아이리 씨."
10034030-243 = "……네, 네!?"
10034030-249 = "……음악은 커다란 말과 같아서, 사람의 감정과 마음을 읽는답니다."
10034030-250 = "타는 것을 겁을 먹고 초조해하면 그대가 아니라 음악이 그대를 부릴 것이니,"
10034030-251 = "부디 쫓기지 말고, 타는 것을 두려워하지 말고……."
10034030-256 = "……함께 즐기는 사람이, 되기를 바라겠습니다."
