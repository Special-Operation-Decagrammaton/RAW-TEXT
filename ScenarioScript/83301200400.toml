[translation]
83301200400-6 = "거기, 온천개발 부원. 잠깐 볼 수 있을까?"
83301200400-7 = "응?"
83301200400-8 = "우와아앗?! 선도부장?! 어째서 여기에?!"
83301200400-9 = "나, 난 아무 것도 안 했어! 오늘 오후는 비번이라 잠깐 쉬고 있을 뿐이구!"
83301200400-10 = "딱히 널 탓하거나, 해코지하기 위해 찾아온 게 아니야."
83301200400-11 = "단지…… 오늘 있었던 만마전 의사당 앞 온천개발의 건과 관련해 묻고 싶은 게 있을 뿐이야."
83301200400-12 = "뭣?! 내게서 정보를 캐내겠다는 거야?! 그런 배신 같은 짓을 할까 보냐……!"
83301200400-13 = "배신이라…… 그렇네. 관점에 따라선 그렇게 보일 수도 있겠구나."
83301200400-14 = "……나도 억지로 캐물을 생각까진 없어. 다만."
83301200400-15 = "최근 온천개발부가 무언가 수상한 일을 꾸미고 있다는 소식을 접해서, 그 사실관계를 확인하고 싶었을 뿐."
83301200400-16 = "온천 혁명……이라고 했던가? 거기에 온천 얼리 엑세스 티켓……? 같은 것도 판다고 했고."
83301200400-17 = "무슨 수상한 목적을 가졌는지는 모르겠지만, 그런 이유로 난동을 피우는 건……"
83301200400-18 = "……뭣이라……?"
83301200400-19 = "……?"
83301200400-20 = "수상한 목적이라고 말했겠다!"
83301200400-21 = "헤헹! 그야 고지식하고 꽉 막힌 당신네 같은 선도부는 모르겠지!"
83301200400-22 = "우리 온천개발부의 위대하고도 원대한 목표를! 그걸 위해 카스미 부장과 작업반장 메구 쨩이 얼마나 노력하고 있는지도!"
83301200400-23 = "위대하고, 원대한 목표……."
83301200400-24 = "만마전 주차장에 만들려고 했던 온천은 그저 중간 통과 지점에 지나지 않아……!"
83301200400-25 = "게헨나 곳곳에 굴착 중인 온천 후보지를 전부 완성하게 되면……!"
83301200400-26 = "마침내 이곳 게헨나에는 그 어떤 온천과도 비교 불가능한 가장 완벽한 온천이 완성될 테니까!"
83301200400-27 = "우리 <게헨나 부글부글 대작전>의 성공이 바로 코앞까지 온 거야……!"
83301200400-28 = "<게헨나 부글부글 대작전>………?"
83301200400-29 = "…………아! 열 받아버린 나머지 다 말해버렸다……!"
83301200400-35 = "도, 도망쳐어~~!"
83301200400-39 = "잠깐……!"
