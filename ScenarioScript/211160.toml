211160-215 = "咦……？"
211160-216 = "[s] 「真琴……？」"
211160-217 = "諸君，抬起頭來。然後看清楚。"
211160-218 = "我們這段時間做了什麼？#n明明擁有偉大的鐵血傳統，卻將我們的高貴浪費在瑣碎的脫序與毫無意義的騷亂上。"
211160-219 = "但如今，那種無意義的時光已經結束了。"
211160-220 = "格黑娜的問題絕不會靠多數決、空洞的協商，或是軟弱的妥協來解決。"
211160-221 = "唯有鐵與血！那才是推動歷史車輪的唯一動力！！"
211160-222 = "拿起槍劍！！格黑娜的正當領域並不在這座學園的圍牆之內！"
211160-223 = "我們足跡所至之處、槍口所向的大地，都應當是格黑娜的領土！"
211160-225 = "奇普托斯的弱者們──#n將在團結一致的我們面前心生恐懼、屈膝下跪！！"
211160-228 = ""
211160-229 = "……"
211160-230 = "這，這個笨蛋前輩又在說什麼莫名其妙的話……！！"
211160-231 = "[ns] 「真琴，你到底在說什麼……」"
211160-234 = ""
211160-235 = ""
211160-239 = ""
211160-240 = "哦哦哦！！"
211160-241 = "前進吧！！將格黑娜的力量凝聚為一！！"
211160-242 = "奪回格黑娜的正當領土吧！！戰鬥吧！！"
211160-243 = "什，什麼！？"
211160-244 = "現在到底發生什麼事了？"
