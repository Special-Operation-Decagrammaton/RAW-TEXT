211160-218 = "ที่ผ่านมาพวกเราทำอะไรกันอยู่? ทั้งที่สืบทอดธรรมเนียมอันยิ่งใหญ่แห่งเหล็กและเลือด แต่กลับผลาญ#nความสูงส่งของเราไปกับการนอกลู่นอกทางทีละนิด และความวุ่นวายที่ไร้ความหมาย"
211160-219 = "แต่บัดนี้ ช่วงเวลาอันไร้ความหมายเช่นนั้นได้จบสิ้นลงแล้ว"
211160-220 = "ปัญหาของเกเฮนน่าไม่อาจแก้ได้ด้วยการลงมติเสียงข้างมาก การเจรจาอันว่างเปล่า หรือการประนีประนอมอันอ่อนแอ"
211160-221 = "มีเพียงเหล็กและเลือดเท่านั้น! นั่นคือพลังขับเคลื่อนหนึ่งเดียวที่หมุนกงล้อแห่งประวัติศาสตร์!!"
211160-222 = "จงหยิบอาวุธขึ้นมา!! เขตอำนาจอันชอบธรรมของเกเฮนน่าไม่ได้จำกัดอยู่เพียงภายในกำแพง#nโรงเรียนแห่งนี้!"
211160-223 = "ทุกที่ที่เท้าของเราก้าวไปถึง ทุกผืนดินที่กระบอกปืนของเราหันไปหา จะต้องกลายเป็นดินแดนของเกเฮนน่า!"
211160-225 = "เหล่าผู้ที่อ่อนแอในคิโวทอสจะหวาดกลัวและทรุดเข่าลงต่อหน้าพลังที่รวมเป็นหนึ่งของเรา!!"
