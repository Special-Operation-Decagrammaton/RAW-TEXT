211160-206 = "即刻起，格黑娜萬魔殿議長羽沼真琴向全格黑娜宣告。"
211160-207 = "格黑娜……"
211160-208 = ""
211160-210 = ""
211160-211 = "從現在起，將對全奇普托斯展開無限制鬥爭！！"
