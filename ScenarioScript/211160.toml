211160-15 = "สปอตไลท์ของเกเฮนน่าย่อมต้องสาดส่องมาที่เราผู้นี้!"
211160-16 = "สมกับเป็นมาโคโตะจังเลยนะ เห็นฝูงชนขนาดนี้ก็ยังไม่ประหม่าเลย~"
211160-17 = "สุดยอดเลยค่ะ! ดูเหมือนจะเป็นครั้งที่นักเรียนมารวมตัวกันมากที่สุดในช่วงนี้! แพนเดโมเนียม โซไซตี้#nรายสัปดาห์ฉบับหน้าคงมีเนื้อหาแน่นเอี้ยดเลยนะคะ!"
211160-18 = "โอกาสที่จะได้ถ่ายภาพฝูงชนมากมายขนาดนี้หาไม่ได้ง่ายๆ เลยค่ะ! เอาละ ได้เวลากดชัตเตอร์!"
