211160-281 = "格黑娜的偉大時代再次開始了。"
211160-283 = "[ns] 「陽奈？」"
211160-284 = "為什麼直到現在才明白呢。"
211160-285 = "風紀委員會真正的職責並不是平息格黑娜內部的騷亂，#n而是強制讓格黑娜的意志成為奇普托斯唯一的秩序。"
