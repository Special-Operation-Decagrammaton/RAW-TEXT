211160-293 = "呵呵，真不愧是委員長。"
211160-294 = "咦……？"
211160-295 = ""
211160-297 = ""
211160-298 = ""
211160-299 = "合乎時宜又極為迅速的判斷。#n委員長正為我們指引應當前進的道路。"
211160-300 = "首席行政官……？您那是什麼意思……"
211160-304 = ""
211160-305 = "羽沼真琴議長。你的宣言極為正當。"
211160-306 = "雖然我們之前的關係稱不上好，但那是因為我們沒看見真正該前進的方向。"
211160-307 = "從現在起，風紀委員會將成為格黑娜最銳利的劍、最迅速的子彈──#n在征服奇普托斯的路上打頭陣。"
211160-308 = ""
211160-310 = ""
211160-312 = ""
211160-317 = "嘰嘻嘻……歡迎你，空崎陽奈。"
211160-318 = "可以說格黑娜如今已經真正合而為一了吧。"
211160-320 = "一起摧毀吧。那些圍牆之外的可憎敵人。"
211160-321 = "啊啊，當然。"
211160-322 = ""
211160-325 = "為了導正扭曲的奇普托斯──#n以格黑娜之名建立真正的秩序，開始這場聖戰吧。"
