211160-1 = "第16話;該發生的事終究會發生"
211160-3 = ""
211160-4 = "要做什麼啊？"
211160-5 = "萬魔殿好久沒辦什麼活動了。"
211160-8 = "不過我們有必要特地來聽這個嗎？"
211160-9 = "看他們連音響設備、喇叭之類的都準備了，陣仗挺大的嘛。#n應該會搞點什麼吧。"
211160-10 = "雖然感覺是在浪費時間……好吧，先聽聽看吧。"
211160-13 = "[ns] 「人潮好驚人……！」"
211160-14 = "嘰嘻嘻……！沒錯，本大人要的就是這種反應。"
211160-15 = "格黑娜的聚光燈果然就該集中在本大人身上！"
211160-16 = "真不愧是真琴醬。#n看到這麼多人也毫不緊張呢～"
211160-17 = "好厲害！好像是最近聚集最多學生的一次！#n下週的週刊萬魔殿內容會很豐富呢！"
211160-18 = "能拍到這麼龐大群眾的機會可不多！#n來，快門時機！"
