[translation]
2000306-1 = "저격수의 시련 2"
2000306-2 = "어느 건물 옥상 위"
2000306-3 = "오늘의 훈련은…… 바로 근력 훈련입니다!"
2000306-4 = "가만히 앉아서 적을 노리는 저격수에게 어째서 근력 훈련이 필요하냐고요?"
2000306-5 = "분명 저격을 할 때는 가만히 앉아서 대기해야만 하지만, 좋은 저격 포인트를 찾기 위해서는 부지런히 계단을 오르내려야 합니다."
2000306-6 = "선생님, 제 총을 한 번 들어보시겠습니까?"
2000306-10 = "[s] \"무, 무거워…\""
2000306-13 = "예, 대물 저격총의 무게는 20kg은 가볍게 넘긴답니다."
2000306-14 = "이런 무거운 총을 지고 건물을 오르내리려면 강인한 근력 또한 필수이지요."
2000306-15 = "오늘은 이 30층 건물을 계단으로 5분 만에 오르도록 합시다!"
2000306-16 = "총기는 제가 들 테니, 선생님께서는 탄통을 들고 따라와 주시겠습니까?"
2000306-17 = "[s] \"자, 잠깐만 기다려…\""
2000306-18 = "여유를 부릴 시간은 없습니다!"
2000306-20 = "이후, 녹초가 될 때까지 마시로와 훈련했다."
