[translation]
10013065-3 = "이즈나류 인법-! 초강력 슛이에요!"
10013065-13 = "크, 크으으윽?! 이즈나……! 이 강력한 힘은…… 대체……?!"
10013065-14 = "이즈나는 주군을 만나! 더욱 강해졌어요!"
10013065-15 = "이즈나의 꿈을 이해해주고 인정해준 주군 덕분에!"
10013065-16 = "이즈나는 한 꺼풀 벗고! 성장한 거예요!"
10013065-17 = "그래서……! 수영복 차림이란 것인가!"
10013065-18 = "[s] \"아니! 그건 좀 경우가 다르니까……!\""
10013065-27 = "크 크으윽?!"
10013065-32 = "자! 이것으로 끝이야!"
10013065-33 = "이즈나들의 승리예요!"
10013065-38 = "아니아니아니~! 우째?! 왜 우리 쪽의 병력이 밀려버리는 게지?!"
10013065-39 = "지난번과는 경우가 다르단 말이다! 경우가!"
10013065-40 = "혹시 모를 상황을 대비해 검은거북파 병력에 더해…… 카이저 PMC로부터 병력까지 구매해서 준비해두고 있었거늘?!"
10013065-41 = "[s] (카이저 PMC의 병력……?)"
10013065-42 = "그, 그게 말입니다! 보스! 바로 어제저녁쯤에 방문한 손님 중에……… 그 여우 가면을 쓴 녀석이 있었는데……."
10013065-43 = "그 녀석에게 의자를 앉은 비용을 청구하려고 했더니 역으로 갑자기 공격을 해오는 바람에……."
10013065-44 = "그때 카이저PMC에게서 구매한 병력의 태반이 반파되는 일이……."
10013065-45 = "그런 일이 있으면 미리 말해달라고?! 이놈이고 저놈이고 사업에 있어 가장 중요한 건 보고 및 조치이거늘! 그 기본조차 모르는 게냐?!"
10013065-46 = "[s1] \"뭔가…… 데자뷰 같은 느낌이…….\"\n[s2] \"근데……. 여우 가면을 쓴 손님……?\""
10013065-50 = "자, 여기까지야! 냥텐마루!"
10013065-51 = "네! 정의와 닌자는! 늘 승리하는 법이에요! 닌닌"
10013065-52 = "크, 크읏! 크으윽……! 그렇단…… 말이지."
10013065-56 = "후후…… 후후후! 후후후후!!! 후하하핫!"
10013065-57 = "[s] \"뭔가, 숨겨둔 비장의 한 수라도 있는 건가……?\""
10013065-58 = "모, 모두 방심하지 마!"
10013065-59 = "네! 상대는 누가 뭐라해도 전 백귀야행 상점가의 상인회장! 무시할 수 없는 상대예요!"
10013065-60 = "꿀꺽!"
10013065-66 = "……커흠."
10013065-67 = "언제나 시즈코 양. 자네의 수완에는 늘 감탄하고 있었다네."
10013065-71 = "듣기로는 뭐냐…… 이 <로스트 파라다이스 리조트> 군도에서 프랜차이즈 사업을 확장하고 있다고……?"
10013065-72 = "하하! 정말 좋은 자세일세! 암! 자, 어떤가! 이 냥텐마루와도 프랜차이즈 계약을 맺는 것은!"
10013065-76 = "자네에겐 돈이 필요한 것이겠지?"
10013065-77 = "마침 내겐 검은거북파라는 병력이 있다네. 이걸 활용하면 좀 더 효율적으로 사업을 할 수 있을 게야!"
10013065-81 = "지난날의 앙금은 모두 털어버리고, 함께 돈을 벌지 않겠나!"
10013065-82 = "우리 손을 잡고! 함께 더 넓은 세계로 도약을……!"
10013065-83 = "아, 그거참 듣던 중 반가운 소리인걸."
10013065-84 = "오! 역시 자네야! 알아주는……."
10013065-85 = "덕분에 망설이지 않고 갈 수 있겠어!"
10013065-86 = "무슨 헛소리를 하는 거야아아앗! 시즈코 진심 펀치! 여름 버전!!"
10013065-95 = "……이렇게 되어서, 이쪽을 관리하던 세력이 전부 뿔뿔이 도망가버려서 말이야. 조금 인력을 빌려줬으면 해."
10013065-96 = "아아, 그런 거라면 뭐, 상관없어. 이쪽도 손이 비는 애들이 있는 참이고."
10013065-97 = "그럼 부탁할게."
10013065-101 = "냥텐마루…… 잠깐 한눈을 판 사이에 줄행랑을 쳐버리다니……."
10013065-103 = "이즈나도 깜짝 놀랐어요! 도망치는 게 엄청 빠른 게, 마치……! 니, 닌자는 아니고 그게……."
10013065-104 = "……바퀴벌레?"
10013065-105 = "네! 바로 그거네요!"
10013065-106 = "아하하……."
10013065-107 = "[s] \"어디서 또 만나게 되는 날이 오는 걸까…….\""
10013065-108 = "그건…… 사절하고 싶어요……."
10013065-112 = "자! 일단 이 이야기는 여기까지!"
10013065-116 = "아직 일이 남아있으니, 좀 더 분발하자구요!"
