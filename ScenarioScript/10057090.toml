[translation]
10057090-1 = "第9話;お互いのためにお互いが"
10057090-3 = "な、何言ってんの？あは、は……。"
10057090-4 = "ストーブはさ……朝、切れちゃったじゃん。"
10057090-5 = "……。"
10057090-6 = "……嘘でしょ？嘘だよね？からかってるんだよね？"
10057090-12 = "……。"
10057090-13 = "ほんとなの……？"
10057090-14 = "全部、ストーブに使っちゃった？そ、そんなことありえる……？"
10057090-15 = "……。"
10057090-17 = "エリナ、ミスは誰にでもある。"
10057090-19 = "ミスで一滴も残さなかったってこと？どんな計算をしたらそうなるの？"
10057090-20 = "もう……からかわないでよ、学級委員長～。他の燃料タンク、あるんでしょ～？"
10057090-21 = "……。"
10057090-26 = "ちょっと！！何とか言ってよ！！！"
10057090-27 = "いつもみたいにギャーギャー反論してよぉ！！！"
10057090-34 = "……めん。"
10057090-38 = "え？"
10057090-39 = "ご、めん。うんざりな山奥で、うんざりな私と……またいることになって、ごめん。"
10057090-40 = "あの、エリナ……。"
10057090-46 = "（バタン！！）"
10057090-48 = "[ns1] \"エリナ！！\"\n[ns2] \"アンナ、大丈夫？\""
10057090-51 = "アンナ。"
10057090-52 = "絶対に、問題があると思ってた。"
10057090-53 = "……アンナ。"
10057090-54 = "私が作ったものが、そんなにうまくいくはずがない。"
10057090-55 = "アンナ。"
10057090-56 = "エンジンをかける前に不具合が見つかるって思ってたのに……。"
10057090-57 = "こんなうまくいったら、ダメだ――"
10057090-62 = "アンナ！！"
10057090-66 = "[ns] \"ラナ、落ち着いて……！\""
10057090-67 = "大丈夫です、先生。怒っているわけではありません。"
10057090-68 = "アンナを正気に戻したいだけです。"
10057090-72 = "アンナ、何があったかなんて聞かない。"
10057090-73 = "でも、今はしっかりしないと。"
10057090-78 = "吹雪、来てるね。"
10057090-79 = "……。"
10057090-80 = "え、エリナが風邪をひいちゃう。外はもっと寒くなるのに……。"
10057090-81 = "私のせいで、こんなことに……。"
10057090-82 = "どうしよう……。"
10057090-89 = "先生。"
10057090-90 = "いつも先生に頼って、尋ねて……わがままを言ってすみません。"
10057090-91 = "ですが、知らないことをそのままにはしておけないので――"
10057090-92 = "質問しても、いいですか？"
10057090-93 = "[s3] \"大人は生徒の質問に答えるものだよ。\"\n[s4] \"私は質問の多い生徒が好きだよ。\""
10057090-96 = "……では、質問します。"
10057090-100 = "先生、私たち183号の3人は友達と言えますか？"
10057090-101 = "……。"
10057090-102 = "私たちは3人しかいないのに、毎日喧嘩ばかりしています。"
10057090-103 = "一緒にいると頭にきて、時に憎らしくて……涙も出ます。"
10057090-104 = "私にとって、2人は初めてできた「友達」と言える人です。#nだから「友達」とはどういうものなのか、まだ分かっていません。"
10057090-105 = "毎日うんざりして、心穏やかな日なんてない私たちは……#n本当に友達なのでしょうか？"
10057090-106 = "ラナ……。"
10057090-111 = "[ns] \"人間関係に正解はないけど――\""
10057090-113 = "[ns5] \"私は、友達だと思う。\"\n[ns6] \"それも、ものすごく仲良しの友達。\""
10057090-116 = "どういうところが、友達と言えるんですか？"
10057090-117 = "[s7] \"お互いに関心があるから喧嘩して。\"\n[s8] \"風邪をひかないようにストーブをつけてあげて。\"\n[s9] \"喧嘩を止めようと遠くまで私を訪ねてきて。\""
10057090-121 = "[ns10] \"そして、友達について悩んで。\"\n[ns11] \"友達じゃなきゃ、絶対にできないよ。\""
10057090-124 = "先生……。"
10057090-125 = "先生。"
10057090-126 = "ありがとうございます。"
10057090-131 = "アンナ。先生。"
10057090-136 = "……うん。"
10057090-138 = "[ns] \"友達を迎えにいこう！\""
