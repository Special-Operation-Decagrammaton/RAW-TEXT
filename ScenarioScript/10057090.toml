[translation]
10057090-1 = "제9화;서로에게 서로가"
10057090-3 = "뭐, 뭐라는 거야. 하하, 하……."
10057090-4 = "난로는 새벽에 기름 떨어져서 꺼졌잖아."
10057090-5 = "……."
10057090-6 = "…… 아니지? 장난치는 거지?"
10057090-12 = "……."
10057090-13 = "진짜야……?"
10057090-14 = "연료를 다 난로에 넣은 거야? 실수로? 실수로 그런 거야?"
10057090-15 = "……."
10057090-17 = "에리나. 실수할 수도 있지 않을까."
10057090-19 = "실수로 한 방울도 안 남겼다고? 대체 어떤 계산을 했길래 그렇게 돼?"
10057090-20 = "저기, 장난치지 말고~ 부장님~ 다른 연료통, 있는 거죠?"
10057090-21 = "……."
10057090-26 = "야!! 뭐라고 말이라도 해!!!"
10057090-27 = "매번 따박따박 반론했잖아, 뭐라고 말이라도 해 보라고!!"
10057090-34 = "……해."
10057090-38 = "뭐?"
10057090-39 = "미안, 해. 지긋지긋한 산속에, 지긋지긋한 나하고 더 있게 해서 미안해."
10057090-40 = "저기, 에리나……."
10057090-46 = "(콰당!!)"
10057090-48 = "[ns1] \"에리나!!\"\n[ns2] \"안나, 괜찮니?\""
10057090-51 = "안나."
10057090-52 = "분명 문제가 있을 거라고 생각했는데."
10057090-53 = "……안나."
10057090-54 = "내가 만든 게, 그렇게 잘 될 리가 없었는데."
10057090-55 = "안나."
10057090-56 = "시동 걸기는커녕, 그 전에 문제가 생겨서 주저앉을 거라고 생각했는데."
10057090-57 = "이렇게 잘 됐으면 안 됐-"
10057090-62 = "안나!!"
10057090-66 = "[ns] \"라나, 일단 진정하고……!\""
10057090-67 = "아닙니다, 선생님. 화난 게 아닙니다."
10057090-68 = "안나를 정신 차리게 해야 합니다."
10057090-72 = "안나. 무슨 일인지는 지금은 더 이상 묻지 않을 거야."
10057090-73 = "그런데, 지금은 정신 차려야 해."
10057090-78 = "눈 폭풍, 오고 있어."
10057090-79 = "……."
10057090-80 = "에, 에리나가 감기 걸릴 거야. 밖이 더 추워질 텐데……."
10057090-81 = "내가 잘못해서, 내가 사고 친 거야……."
10057090-82 = "나는, 어떻게 해야……."
10057090-89 = "선생님."
10057090-90 = "매번 선생님께 묻고, 의지하고…… 응석 부려서 죄송합니다."
10057090-91 = "그렇지만, 모르는 것을 모르는 채로 둘 수 없어서-"
10057090-92 = "질문해도, 괜찮을까요."
10057090-93 = "[s3] \"어른은 학생의 질문에 대답해야지.\"\n[s4] \"선생님은 질문이 많은 학생이 좋단다.\""
10057090-96 = "……그러면, 질문하겠습니다."
10057090-100 = "선생님, 우리 183호는 친구가 맞나요?"
10057090-101 = "……."
10057090-102 = "저희는 고작 셋밖에 없으면서, 매일 싸우고 다툽니다. 말싸움도 하고, 몸싸움도 합니다."
10057090-103 = "제 둘뿐인 친구는 같이 있으면 서로 화내고, 미워서 울기도 합니다."
10057090-104 = "저에게는 이 두 사람이 처음으로 생긴, '친구'라고 할 수 있는 사람들입니다. 그래서 저는 '친구'가 어떤 건지 잘 모릅니다."
10057090-105 = "매일매일이 지긋지긋하고, 조용할 날 없는 저희는…… 정말 친구일까요."
10057090-106 = "라나……."
10057090-111 = "[ns] \"관계에 정답은 없지만, 내 생각은 말이지.\""
10057090-113 = "[ns5] \"안나, 에리나, 라나. 세 사람은 친구라고 생각해.\"\n[ns6] \"그것도 아주 절친한 친구.\""
10057090-116 = "어떤 점에서 저희는 친구일까요."
10057090-117 = "[s7] \"서로에 대해 관심을 가져서 다투고,\"\n[s8] \"감기 걸릴까 봐 난로도 챙겨서 켜주고.\"\n[s9] \"싸움을 말리러 멀리까지 오고.\""
10057090-121 = "[ns10] \"그리고, 친구에 대해 고민도 하고.\"\n[ns11] \"이런 모든 것이, 친구라서 가능한 일이야.\""
10057090-124 = "선생님……."
10057090-125 = "선생님."
10057090-126 = "감사합니다."
10057090-131 = "안나. 선생님."
10057090-136 = "……응."
10057090-138 = "[ns] \"친구를 데리러 가자!\""
