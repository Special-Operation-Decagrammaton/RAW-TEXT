[translation]
1012803-1 = "달콤한 대가"
1012803-2 = "(다음 날, 상점가로 나왔다.)"
1012803-3 = "(반드시 찾아내서 사야 할 것이 있었기 때문이다.)"
1012803-6 = "(그렇게 두어 시간을 돌아다닌 뒤…….)"
1012803-9 = "(……슬프게도 목표했던 물건은 찾지 못했다.)"
1012803-10 = "(그런데…….)"
1012803-11 = "오, 선생님?"
1012803-15 = "이런 곳에서 또 만나 뵙게 되네요!"
1012803-16 = "그간 평안하셨는지요!"
1012803-17 = "[s] \"물론. 후유도 잘 지냈어?\""
1012803-18 = "덕분에 잘 지냈습니다!"
1012803-19 = "저는 교역용 투석기가 망가져서 부품을 구입하려 나왔습니다."
1012803-20 = "그리고 곧 있을 전시회에서 쓸 재료들도 구해야 하고……."
1012803-21 = "[s] \"교역품 말고도 여러 가지를 사는구나.\""
1012803-22 = "……후후."
1012803-23 = "그나저나 선생님은 이곳에 무슨 일로 오셨어요?"
1012803-24 = "보아 하니 생필품을 사러 오신 것 같지는 않으시고……."
1012803-25 = "예? 생필품을 사러 온 게 맞으시다고요?"
1012803-26 = "7단 합체 슈퍼합금 변신 로봇……?"
1012803-27 = "멋지군요."
1012803-28 = "확실히, 그 정도라면 생필품의 반열에 들 가치가 있지요."
1012803-29 = "[s] \"물론 구하는 데에는 실패했지만 말이야.\""
1012803-30 = "예? 그런 통탄할 일이……!"
1012803-31 = "그런 일이 있으셨다면 저에게 말씀을 주셨어야죠, 고객님!"
1012803-32 = "[s] \"고객님……?\""
1012803-33 = "시장에서 단종된 물건, 매진되어서 사라진 상품."
1012803-34 = "다 어떻게든 구하는 방법이 있단 말이죠!"
1012803-35 = "[s] \"역시 특수교역부의 영업 실장님……!\""
1012803-36 = "……물론 약간의 대가를 치르셔야 하긴 하겠지만요, 후후."
1012803-37 = "[s] \"대가라면……?\""
1012803-38 = "어……."
1012803-42 = "음……."
1012803-43 = "그…… 어…… 흐음……."
1012803-44 = "[s] \"……?\""
1012803-45 = "그 있잖아요, 뭐, 밥을 사주신다거나……."
1012803-46 = "같이 여, 영화를 보러 간다거나……."
1012803-47 = "아니면, 그, 정 부담되신다면 디저트 카페 정도라도……."
1012803-48 = "[s1] \"그럼 일단 밥을 먹고 영화를 본 뒤에.\"\n[s2] \"디저트 카페에 가서 수다나 떨까?\""
1012803-54 = "네네네네네?!"
1012803-55 = "지지지지진짜요?!"
1012803-56 = "아니지! 네! 그럼요! 에, 그……."
1012803-57 = "좋, 좋아……요……"
1012803-59 = "(그렇게 후유와 식사도 하고, 영화도 보고, 디저트 카페도 가며 하루를 즐겁게 보냈다.)"
1012803-60 = "(……그리고 얼마 뒤, 진짜로 샬레에 그 로봇 장난감이 배송되었다.)"
