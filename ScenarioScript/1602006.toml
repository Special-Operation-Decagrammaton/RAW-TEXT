[translation]
1602006-1 = "ชุดพรางตัวของสไนเปอร์"
1602006-2 = "ทางเข้าโคกิทาวน์"
1602006-3 = ""
1602006-4 = ""
1602006-5 = "อ๊ะ คุณครู ทางนี้ ทางนี้"
1602006-6 = "พอได้ออกมาข้างนอกกับคุณครูโดยที่ไม่เกี่ยวกับเรื่องงานเป็นครั้งแรก ความรู้สึกมันก็แปลกๆ นะ"
1602006-7 = "อ๊ะ นี่ฉันไม่ได้รบกวนวันหยุดพักผ่อนของคุณครูหรอกใช่มั้ย?"
1602006-8 = "มาคิดดูแล้ว คุณครูก็เหมือนจะงานยุ่งทั้งสัปดาห์เลยด้วย..."
1602006-9 = "[s1] \"ไม่เลย ครูก็อยากไปช้อปปิ้งเหมือนกัน\"\n[s2] \"ไม่หรอก ครูก็สงสัยอยู่ด้วยว่าชุดพรางตัวของ SRT เป็นยังไง\""
1602006-12 = "หืม...? คุณครูไม่เคยเห็นการพรางตัวของสไนเปอร์มาก่อนเลยเหรอ?"
1602006-13 = "[s3] \"ก็เคยเห็นนักเรียนคนอื่นใส่ชุดพรางตัวอยู่หรอกนะ\"\n[s4] \"ครูไม่เคยเห็นร้านที่ขายเฉพาะชุดพรางตัวมาก่อนเลย\""
1602006-16 = "อ๊ะ จะว่าไปฉันก็ลืมบอกไปเลย"
1602006-17 = "ร้านที่ฉันชวนไปไม่ใช่ร้านขายอุปกรณ์ทหารโดยเฉพาะ แต่เป็นร้านขายเสื้อผ้าสำเร็จรูปทั่วไปน่ะ"
1602006-18 = "พวกชุดลายพรางสำหรับทุ่งโล่งก็อีกเรื่องหนึ่ง แต่ถ้าเป็นชุดพรางตัวที่ใช้ในปฏิบัติการในเขตเมืองน่ะ ถ้าเอาเสื้อผ้าสำเร็จรูปมาดัดแปลงก็จะมีประสิทธิภาพกว่า"
1602006-19 = "ฉันบังเอิญได้คูปองเสื้อผ้าของร้านในโคกิทาวน์มาจากปฏิบัติการครั้งก่อน ก็เลยว่าจะมาใช้คูปองนั้นที่นี่น่ะ"
1602006-20 = "ฮุฮุ ต้องซื้อชุดสีอะไรดีนะ ถึงจะใส่ไปเนียนได้กับทุกสมรภูมิรบ~"
1602006-21 = "[s5] \"ถ้าพูดถึงชุดพรางตัว ครูก็นึกถึงชุดขาดๆ โทรมๆ แบบนั้น...\"\n[s6] \"พวกชุดพรางตัวผ้าปะเยอะๆ เอามาใส่ในเมืองได้เหรอ?\""
1602006-24 = "อ้อ หมายถึงกิลลี่สูทสินะ"
1602006-25 = "กิลลี่สูทมีโครงสร้างที่เป็นตาข่ายอยู่แล้ว เราเลยเอาเศษผ้าสารพัดแบบมาถักทอ เพื่อปรับแต่งให้เข้ากับปฏิบัติการแต่ละชนิดได้"
1602006-26 = "ในพื้นที่กลางแจ้งที่มีพุ่มไม้ขึ้นรกๆ ทึบๆ ก็มักจะพรางตัวด้วยการใช้ผ้าสีเขียวอมน้ำตาล หรือใบไม้ร่วงๆ แต่ในเขตเมืองที่เต็มไปด้วยป้ายโฆษณาสีสันสดใสและตึกคอนกรีต ก็จะจงใจใช้ผ้าสีสดใสเข้าไปผสมด้วย"
1602006-27 = "เพื่อไม่ให้สีเสื้อผ้าสะดุดตามากเกินไปเมื่ออยู่ท่ามกลางฝูงชน บางครั้งฉันก็ฉีกชุดนักเรียนที่ไม่ได้ใช้แล้วมาใช้ด้วย..."
1602006-28 = "แต่ในเมื่อตอนนี้สถาบัน SRT ปิดตัวแล้ว ชุดนักเรียนก็เลยเป็นสิ่งมีค่าขึ้นมา"
1602006-29 = "ฉันก็เลยไม่ได้คัสตอมชุดพรางตัวแบบกิลลี่สูทด้วยตัวเองมานานแล้วละ"
1602006-30 = "[s] \"ต้องใช้ความพยายามมากกว่าชุดทั่วไปอีกสินะ...\""
1602006-31 = "ใช่แล้วละ เราต้องเตรียมปฏิบัติการให้สมบูรณ์แบบเสมออยู่แล้ว"
1602006-32 = "งั้นเราไปดูเสื้อผ้าแบบจริงจังกันเลยมั้ย?"
1602006-33 = ""
1602006-35 = ""
1602006-37 = ""
1602006-38 = "อืม ชุดนี้สีจัดจ้านไปหน่อย"
1602006-39 = "ส่วนชุดนี้ก็ลวดลายสะดุดตาเกินไป..."
1602006-40 = "โอ้ ชุดกระโปรงตัวนี้ สีสันใช้ได้เลยนะ? น่าจะเข้ากับสีผมของฉันด้วย"
1602006-41 = "คุณครูคิดว่ายังไงเหรอ? ชุดนี้เหมาะกับฉันหรือเปล่า?"
1602006-42 = "[s7] \"อืม...\"\n[s8] \"ก็ไม่เลวหรอกนะ แต่ว่า...\""
1602006-45 = "อะไรกัน ทำไมปฏิกิริยาเฉยชาแบบนี้ล่ะ?"
1602006-46 = "หรือว่าชุดสไตล์ฟรุ้งฟริ้งแบบนี้จะไม่เข้ากับฉัน..."
1602006-47 = "งั้นก็ช่วยไม่ได้ คงต้องเอาเป็นชุดที่ทำจากผ้ายีนส์หรือผ้าลูกฟูกสีกลางๆ..."
1602006-48 = "[s9] \"คะ... ครูไม่ได้หมายความแบบนั้นนะ!\"\n[s10] \"ที่จริงครูก็คิดว่าชุดนี้ดูดีเลย...\""
1602006-51 = "แล้วยังไงเหรอ?"
1602006-52 = "[s] \"แต่ถ้าเอาชุดนี้ไปฉีกเป็นชุดพรางตัว มันก็น่าเสียดายไม่ใช่เหรอ?\""
1602006-53 = "เอ๋?"
1602006-54 = "หมายความว่ายังไง..."
1602006-55 = ""
1602006-57 = ""
1602006-58 = ""
1602006-59 = "อ๊ะ ฉันว่าคุณครูเข้าใจผิดแล้วละ"
1602006-60 = " 'ชุดพรางตัว' ที่ฉันตั้งใจจะซื้อวันนี้คือชุดลำลองที่สามารถสวมใส่สบายๆ ในระหว่างภารกิจแฝงตัว#nทั่วไปได้น่ะ"
1602006-61 = "ปกติเวลาเห็นชุดนักเรียนของเขตปกครองตนเองอื่นที่ไม่เคยเห็นมาก่อน มันจะดึงดูดสายตาเรา#nได้ดีไม่ใช่เหรอ?"
1602006-62 = "ชุดพรางตัวในวันนี้ของฉันคือชุดธรรมดาต่างหาก ฉันไม่ได้จะพรางตัวในระดับที่คนเดินผ่านไปมา#nจะไม่ทันสังเกตว่ามีคนอยู่ตรงนี้สักหน่อย"
1602006-63 = "ต่อให้ฉันจะให้ความสำคัญกับปฏิบัติการแค่ไหน แต่ก็ไม่ได้เป็นคนป่าเถื่อนถึงขนาดเอาเสื้อผ้า#nตัวใหม่มาฉีกทิ้งหรอกนะ..."
1602006-64 = "[ns] \"งั้นก็โล่งอกไปทีนะที่เข้าใจผิด...\""
1602006-66 = "[ns11] \"ถ้าโอโทกิอยากได้ชุดไปฉีก ครูว่าจะให้ของตัวเองอยู่\"\n[ns12] \"ครูกำลังคิดว่าจะให้เสื้อผ้าที่เลิกใส่แล้วไปใช้อยู่เลย\""
1602006-69 = "เอ๋? แบบนั้นก็น่าจะดีเลยนะ"
1602006-70 = "งั้นฉันขอถอนคำพูดที่พูดไปก่อนหน้าได้มั้ย?"
1602006-71 = "[s] \"ไม่ได้\""
1602006-72 = "รู้หรอกน่า ฉันแค่พูดเล่นน่ะ~"
1602006-73 = ""
1602006-75 = ""
1602006-76 = ""
1602006-77 = "สรุปว่าชุดนี้ คุณครูคิดว่าจะเหมาะกับฉันหรือเปล่า?"
1602006-78 = "[s] \"ครูว่าชุดที่ใส่ไปเมื่อกี้สวยกว่านะ\""
1602006-79 = "โอ้ รสนิยมชัดเจนกว่าที่คิดไว้อีกนะเนี่ย"
1602006-80 = "ก็ได้ งั้นไปทางนั้นอีกรอบ~"
1602006-82 = "(หลังจากนั้นคุณครูก็สนุกกับการลองเสื้อผ้าหลายๆ แบบกับโอโทกิ)"
