[translation]
1602006-1 = "A Certain Sniper's Disguise"
1602006-2 = "Corgi Town Entrance"
1602006-3 = ""
1602006-4 = ""
1602006-5 = "Sensei! Over here."
1602006-6 = "It feels a little weird, having non-mission related plans with you."
1602006-7 = "Ah, I didn't get in the way of your weekend, did I?"
1602006-8 = "Come to think of it, you've been super busy this week."
1602006-9 = "[s1] \"No. I felt like shopping as well.\"\n[s2] \"I was also curious what an SRT disguise would look like.\""
1602006-12 = "...Huh? You've never seen sniper disguises before?"
1602006-13 = "[s3] \"Not that I've never seen a disguise before...\"\n[s4] \"But I haven't seen a store that sells disguises specifically.\""
1602006-16 = "Ah. I'm sorry, but actually..."
1602006-17 = "The store I was going to take you to isn't some special military shop. It's just a regular clothing store."
1602006-18 = "It's more effective to modify regular clothes for a disguise. I think you're thinking of camouflage outfits we use out in the field."
1602006-19 = "I got a gift certificate that's good in Corgi Town on my last mission, so I thought I'd do some shopping."
1602006-20 = "Fufu. I'm excited to buy all kinds of outfits for different environments."
1602006-21 = "[s5] \"Those tattered, camouflage outfits I was thinking of...\"\n[s6] \"Can you use those in the city too?\""
1602006-24 = "Ah, you mean a ghillie suit."
1602006-25 = "Since a ghillie suit is basically covered in netting, you can customize it by weaving in various types of fabric to suit your mission."
1602006-26 = "It's better suited for open terrain or out in nature, since you generally use leaves and the such. But there are opportunities in urban areas where you can blend in, like bright billboards, so we'll adjust depending on where we are."
1602006-27 = "Sometimes we'll even tear up old uniforms to use, but..."
1602006-28 = "I don't like to do that, with SRT Academy closed down. There are only so many uniforms left."
1602006-29 = "I actually haven't made a ghillie suit in a while."
1602006-30 = "[s] \"...So it takes more handling than normal clothes.\""
1602006-31 = "Of course. Mission preparation should always be perfect."
1602006-32 = "Now, should we do some shopping?"
1602006-33 = ""
1602006-35 = ""
1602006-37 = ""
1602006-38 = "Hm. This shirt's way too bright."
1602006-39 = "I like this pattern a lot..."
1602006-40 = "Oh, this dress is cute. And the color will match my hair."
1602006-41 = "What do you think, Sensei? Do you think it will look good on me?"
1602006-42 = "[s7] \"Hm...\"\n[s8] \"It's not bad...\""
1602006-45 = "What's with that response?"
1602006-46 = "...You're right. Flowy dresses like this really aren't my style."
1602006-47 = "Oh well. Then I'll play it safe with something like denim or cordu—"
1602006-48 = "[s9] \"Th-That's not what I meant!\"\n[s10] \"I did think it looks good on you...\""
1602006-51 = "Then?"
1602006-52 = "[s] \"Isn't it a shame to rip it up and turn it into a disguise?\""
1602006-53 = "Eh?"
1602006-54 = "What are you..."
1602006-55 = ""
1602006-57 = ""
1602006-58 = ""
1602006-59 = "Gah. That's my bad. I might've explained that badly."
1602006-60 = "I'm just looking for casual clothes, for regular infiltration missions."
1602006-61 = "If you dress in a way that's not familiar to the locals, it draws attention to you."
1602006-62 = "So that's what I mean by a \"disguise.\" Just something that lets me blend in with the crowd."
1602006-63 = "I did say mission prep should be perfect, but I'm not going to rip up brand new clothes for the sake of one..."
1602006-64 = "[ns] \"Phew. I'm glad I misunderstood.\""
1602006-66 = "[ns11] \"I was getting so stressed about you ripping your clothes...\"\n[ns12] \"I was seriously considering giving you some of my old clothes.\""
1602006-69 = "Oh? I like the sound of that."
1602006-70 = "Can I take back what I said?"
1602006-71 = "[s] \"Nope.\""
1602006-72 = "Kidding, kidding."
1602006-73 = ""
1602006-75 = ""
1602006-76 = ""
1602006-77 = "Anyway, so. What do you think of this?"
1602006-78 = "[s] \"I actually think the outfit before was better.\""
1602006-79 = "Oh, you have unexpectedly distinct taste."
1602006-80 = "All right. Then this way we go!"
1602006-82 = "Otogi and I had a ton of fun shopping for clothes together."
