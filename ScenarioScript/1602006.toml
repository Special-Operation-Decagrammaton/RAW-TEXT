[translation]
1602006-1 = "某位狙擊手的迷彩服"
1602006-2 = "柯基町入口"
1602006-3 = ""
1602006-4 = ""
1602006-5 = "啊，老師。這裡這裡。"
1602006-6 = "這還是我第一次因為作戰以外的原因，在外面跟老師見面呢……感覺還挺新奇的。"
1602006-7 = "啊，我該不會打擾到你難得的休假了吧？"
1602006-8 = "仔細想想，這一整週老師好像都很忙……"
1602006-9 = "[s1] 「不會，我也正想去購物呢。」\n[s2] 「而且我也很好奇SRT的迷彩服長什麼樣子。」"
1602006-12 = "……嗯？老師你沒看過迷彩服嗎？"
1602006-13 = "[s3] 「之前是有看其他學生穿過……」\n[s4] 「但我好像從來沒見過專門賣迷彩服的店。」"
1602006-16 = "啊，這麼說來，我好像忘記跟你說了。"
1602006-17 = "我們要去的並不是軍事用品的專賣店，而是販賣普通成衣的服飾店。"
1602006-18 = "撇開野戰用的迷彩服不談……#n執行都市作戰時的迷彩服，用成衣來改造反而更有效率。"
1602006-19 = "剛好上次作戰的時候拿到了能在柯基町使用的服飾禮券，所以想趁機來買點新衣服。"
1602006-20 = "呵呵，該買什麼顏色的衣服，才能用在各種作戰環境呢～"
1602006-21 = "[s5] 「說到迷彩服，會讓人聯想到那種破破爛爛的服裝……」\n[s6] 「那種迷彩服也能用在都市裡嗎？」"
1602006-24 = "啊，你是說吉利服吧。"
1602006-25 = "吉利服基本上都有像網子一樣的骨架，所以能根據作戰編上各種布料進行客製化。"
1602006-26 = "比如在草木茂密的野地會編上綠褐色的布或落葉──#n在原色廣告看板或水泥很多的都市裡，也會刻意混入鮮豔顏色的布。"
1602006-27 = "為了避免在人群之中太過顯眼，有時也會撕破舊制服來製作……"
1602006-28 = "但在SRT學園被關閉的現在，每一件制服都很珍貴。"
1602006-29 = "感覺已經有好一陣子沒做過吉利服了呢。"
1602006-30 = "[s] 「……比起普通的衣服還費工夫呢。」"
1602006-31 = "那當然。作戰準備必須做到隨時完美才行。"
1602006-32 = "好了，我們去看衣服吧？"
1602006-33 = ""
1602006-35 = ""
1602006-37 = ""
1602006-38 = "嗯……這件衣服顏色太鮮豔了。"
1602006-39 = "這件的花紋也太顯眼了……"
1602006-40 = "哦，這件連身裙。#n顏色相當不錯呢？感覺和我的髮色很搭。"
1602006-41 = "老師你覺得呢？這件衣服適合我嗎？"
1602006-42 = "[s7] 「唔嗯……」\n[s8] 「是還不錯啦……」"
1602006-45 = "什麼嘛，反應怎麼這麼平淡？"
1602006-46 = "果然這種輕飄飄的衣服不太適合我嗎……"
1602006-47 = "那就沒辦法了。換件更保險的丹寧或燈芯絨材質的衣服──"
1602006-48 = "[s9] 「不，我不是那個意思！」\n[s10] 「其實我覺得很適合你……」"
1602006-51 = "那是為什麼？"
1602006-52 = "[s] 「那件衣服拿去做迷彩服，不是太可惜了嗎？」"
1602006-53 = "咦？"
1602006-54 = "那是什麼意思……"
1602006-55 = ""
1602006-57 = ""
1602006-58 = ""
1602006-59 = "啊，老師，你是不是誤會了？"
1602006-60 = "我今天想買的「迷彩服」，指的是在普通潛入任務時可以穿的便服。"
1602006-61 = "在其他自治區穿著陌生的制服，不是很容易引人注目嗎？"
1602006-62 = "我所謂的迷彩服指的是這個意思，而不是連路人都察覺不到存在的那種偽裝。"
1602006-63 = "就算我再怎麼重視作戰，也不是會把衣服撕成破布的那種人啊……"
1602006-64 = "[ns] 「幸好只是誤會一場……」"
1602006-66 = "[ns11] 「其實如果御伽你真的需要布料的話……」\n[ns12] 「我還在猶豫要不要把我不穿的衣服給你呢。」"
1602006-69 = "咦？那樣好像挺賺的耶。"
1602006-70 = "我剛剛說的話可以收回嗎？"
1602006-71 = "[s] 「不行。」"
1602006-72 = "我知道啦，開玩笑的～"
1602006-73 = ""
1602006-75 = ""
1602006-76 = ""
1602006-77 = "先不說那些了，你覺得這件衣服穿在我身上怎麼樣？"
1602006-78 = "[s] 「以我個人來說，我覺得剛剛那件更好。」"
1602006-79 = "哦哦，你的喜好比想像中還要明確嘛。"
1602006-80 = "好，那就選這件吧～"
1602006-82 = "（之後，和御伽一起試穿了各式各樣的衣服，度過了愉快的時光）"
