[translation]
1002805-1 = "바니걸의 생태"
1002805-3 = "(휴일이지만 업무 관계로 밀레니엄에 들러 일을 보았다.)"
1002805-4 = "(돌아가는 길에 카페 라운지에 앉아서 잠시 쉬었다. 휴일이라 그런지 다른 학생들은 보이지 않았다.)"
1002805-5 = "어? 주인님이잖아?"
1002805-6 = "그렇잖아도 찾아갈까 했는데 여기서 미리 만나네!"
1002805-7 = "[s1] \"……?\"\n[s2] \"아스나?\""
1002805-13 = "여긴 어쩐 일이야, 주인님? 또 일하러 온 거야?"
1002805-14 = "이상하다……. 오늘은 노는 날이잖아? 주인님은 노는 날도 일하는 사람이야?"
1002805-15 = "……응?"
1002805-16 = "그런 말은 하지 말아 달라고? 아프다고? 주인님!? 어디 아파?"
1002805-17 = "사실 진짜 아픈 건 아니라고? 뭐지? 어느 쪽이야?"
1002805-18 = "아하하하하!"
1002805-19 = "……응? 나? 왜 또 이 옷이냐고? 왜 여기 있냐고?"
1002805-20 = "그야 아직 바니걸에 대해 알아내지 못했기 때문이지! 궁금한 건 알고 싶어지잖아? 안 그래?"
1002805-21 = "바니걸 복장을 입는다고 토끼가 될 수는 없다……!"
1002805-22 = "그럼 대체 바니걸 복장은 뭐지?"
1002805-23 = "뭘 위해 입는 거지……?"
1002805-24 = "그렇게 물어봤더니 다들 \"바니걸 옷을 입으면 사람들을 즐겁게 해줄 수 있다\"고 했거든."
1002805-25 = "그런데 뭔가 이상해. 그럼 바니걸 옷은 좋은 거잖아? 좋은데 왜 다들 하지 않는 거지?"
1002805-26 = "그렇게 물었더니 왜인지 그 뒤로는 아무도 대답해주지 않았어."
1002805-27 = "그러니 직접 확인하기 위해 이렇게 입어보고 있는 중인 거야."
1002805-28 = "아무도 가르쳐주지 않으니, 직접 해보고 확인하는 수밖에!"
1002805-32 = "그런데 분명 어제는 여기도 다른 사람들이 많았는데……."
1002805-33 = "왠지 다들 쳐다보더니 카페 주인이 와서 \"죄송하지만 내일 와주세요.\"라고 하더라고. 그래서 오늘 다시 왔지!"
1002805-34 = "……오늘은 아무도 없네. 다들 어딜 간 걸까. 아하하하하!"
1002805-35 = "[s] \"…….\""
1002805-39 = "……잠깐."
1002805-40 = "아무도 가르쳐주지 않는다……?"
1002805-41 = "흠……."
1002805-42 = "……그치만 선생님은 '가르쳐주는 사람'이잖아?"
1002805-43 = "[s3] \"확실히 그렇기는 합니다만…….\"\n[s4] \"역시 이렇게 나오는 건가.\""
1002805-44 = "선생님! 선생님이니까 선생님이 가르쳐 줘!"
1002805-45 = "선생님! 선생님이니까 선생님이 가르쳐 줘!"
1002805-46 = "바니걸은 왜 있는 거야? 바니걸 옷을 입으면 정말로 즐거워져?"
1002805-47 = "그냥 입는 것만 해도 다른 사람들이 즐거워지는 거야? 아니면 이 상태로 뭔가 다른 걸 해야 하는 거야?"
1002805-48 = "……응?"
1002805-49 = "그런 이야기가 아니야……?"
1002805-50 = "그럼 무슨 이야기인데?"
1002805-51 = "바니걸 옷 그 자체가 아니라 그걸 입는 이유가 중요하다고? 무슨 이유?"
1002805-52 = "……내가 방금 말한 거?"
1002805-53 = "누군가를 즐겁게 해주려고 입은 특별한 옷이니까, 그걸 느낀 사람도 즐거워할 수 있는 거라고?"
1002805-54 = "으음~. 뭔가 알 거 같기도 하고 모를 거 같기도 하고……. 어렵네~."
1002805-55 = "이상하네. 그런데 그러면 평소에 입는 메이드복은?"
1002805-56 = "평소에도 주인님을 기쁘게 해주기 위해 메이드복을 입는 거잖아? 그거랑 이게 다른 거야?"
1002805-57 = "……응?"
1002805-58 = "같은 거라고? 에에~? 진짜?"
1002805-59 = "그럼 결국 메이드복이랑 똑같은 건가?"
1002805-60 = "……흠……."
1002805-61 = "……주인님은 지금 어때? 즐거워?"
1002805-62 = "주인님을 위해서 아스나는 바니걸 옷을 입었습니다! 지금부터 그렇다고 치자!"
1002805-63 = "응! 지금부터 그런 거야!"
1002805-64 = "자, 어때? 즐거워? 그런 기분이 들어?"
1002805-65 = "……응?"
1002805-66 = "……커피 한잔 만들어주면 확실하게 알 수 있을 거 같다고?"
1002805-67 = "정말이야? 진짜지? 좋아-! 그럼 지금 바로 만들어 줄 테니까!"
1002805-68 = "마시고 꼭 말해줘야 해. 알았지?"
1002805-69 = "아스나, 커피 타 옵니다-!"
1002805-74 = "(이후 쉬어가는 시간 내내, 아스나와 카페에서 남은 시간을 보냈다.)"
