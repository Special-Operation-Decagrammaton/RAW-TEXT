[translation]
10026040-1 = "제4화;조사 포인트 B. 지하 건축물"
10026040-4 = "다음 탐색 포인트는……. 여기로군요."
10026040-5 = "음……. 지하실이라곤 해도, 단순한 창고 같지는 않네요. 안도 굉장히 넓고 복잡해 보이니……."
10026040-6 = "전체적으로 상당히 본격적인 건축물……. 같고……. 좀 중요한 곳일지도요."
10026040-7 = "일단은 여기도 떨어져서 찾아보는 게 조사에는 도움이 될 것 같……지만……."
10026040-8 = "너무 멀리 떨어져서 찾지는 말죠. 미메시스도 나오고 했다고 하니……."
10026040-9 = "크게 부르면 닿을 수 있는 거리 정도는 유지하면서……. 찾는 걸로 하겠습니다."
10026040-10 = "……아. 그리고 발밑 조심하세요. 곳곳에 파인 구멍이 있을 수 있거든요. 오래된 곳이다 보니."
10026040-11 = "그럼 저는 이만……."
10026040-15 = "아, 우, 우이 씨. 그……."
10026040-19 = "……가버리셨네요……."
10026040-20 = "위험할 수도 있다면 차라리 다 같이 다니는 게 좋을지도 모르는데……."
10026040-21 = "우이 씨는 그럼에도 역시……. 혼자가 편하신 걸까요……?"
10026040-22 = "……."
10026040-23 = "……선생님."
10026040-24 = "[s1] \"……응.\"\n[s2] \"내가 다녀올 테니 걱정하지 마.\""
10026040-29 = "확실히……. 파인 구멍이 많네……. 세월이 짐작 가는걸……."
10026040-30 = "천장에서 떨어진 물만으로도 이렇게 파일 정도면……."
10026040-34 = "……!? 히, 히에에!?"
10026040-35 = "어……? 서, 선생님……? 깜짝이야……. 왜 선생님께서 여기에……."
10026040-36 = "……네?"
10026040-37 = "걱정이 돼서 따라오셨다고요? 미메시스도 나오고 했었으니까……?"
10026040-38 = "으음……. 그렇게까지 멀리 떨어질 생각은 아니었으니 괜찮다고 생각했는데……."
10026040-39 = "……그러네요. 그래도 선생님의 입장은 또 다르실 수도 있겠죠. 죄송해요. 멋대로 굴어서."
10026040-40 = "그럼 일단 동행하시는 걸로……. 잘 부탁드립니다……."
10026040-42 = "……흠……."
10026040-43 = "뜬금없지만 뭔가 감사하네요. 막상 나쁘지 않은걸요. 선생님께 이런 배려도 다 받고……."
10026040-44 = "솔직히 여기 온 이유나 정황은 하나부터 열까지 다 마음에 들지 않았지만……."
10026040-45 = "그래도 이런 유적 자체는……. 썩 싫어하지 않으니까요."
10026040-46 = "……싫어하지 않죠. 이런 곳……. 아니, 절대 싫어할 리가 없죠."
10026040-47 = "……네?"
10026040-48 = "……무서워할 사람들도 꽤 있겠다고요? ……분위기가?"
10026040-49 = "그렇죠. 그렇다니까요. 그런 점까지도 도무지 좋게 봐주기가 어렵죠 바깥 사람들이란……."
10026040-50 = "……아. 물론 선생님 이야기는 아니에요."
10026040-51 = "그리고 저라고……. 딱히 어두운 곳을 좋아하는 것도 아니고요. 의외시겠지만요."
10026040-52 = "조도가 너무 밝거나 직사광선을 쬐는 건 싫지만, 최소한 책을 보려면 어느 정도 빛이 필요하고……."
10026040-53 = "애초에 말씀드린 부분은 빛이 아니라 '오래된 장소'에 대한 부분……이니까요."
10026040-54 = "보통의 바깥 사람들은 크게 관심조차 가지지 않는, '쌓여 있는 역사'에 관한 이야기에요."
10026040-55 = "그런 것들은……. 어떻게 보면 비단 '고서'만의 이야기도 아니죠."
10026040-56 = "당장 방금 제가 말씀드린……."
10026040-60 = "……저런 것들까지도."
10026040-61 = "[s3] \"……과연.\"\n[s4] \"흔적이라는 거구나.\""
10026040-64 = "……네. 머릿속으로 다 헤아리기 힘든 시간의 증거들. 간직해 온 시대."
10026040-65 = "그런 것들에 대해서는 알지도 못하면서, 귀신이 나온다느니 불쾌하고 음침한 곳이라느니……."
10026040-66 = "실례잖아요. 자신들이 태어나기 훨씬 전부터 이곳을 지키며 많은 것을 후대에 전하려는 이들에게 모욕적인 말이라고요."
10026040-67 = "불평 한마디 없이 세월의 풍화에 사그라져 가면서도 지금은 사라져 버린 당시의 시간을 지키고 있는 존재들에게……."
10026040-68 = "……후……. 말하고 나니 또 불쾌해지네요. 바깥 사람들은 역시 태생적으로 조금……. 무리……."
10026040-72 = "죄송해요. 이젠 이런 말 안 하겠다고 생각했는데……."
10026040-73 = "바깥 사람들이라고 다 그런 게 아니라는 것 정도는……. 저도 이제 알고 있으니까요."
10026040-74 = "히나타 씨도 그렇고, 당장 이번 경우에도 그 하나코 씨라는 분은……. 어째서인지 절 도와주셨고……."
10026040-75 = "정말로 왜인지……. 이유는 잘 모르겠지만……."
10026040-76 = "아무튼 그러니까……. 성격상 좋게 생각하는 게 어렵더라도, 최소한 나쁘게 선입견을 가지지는 말자……."
10026040-77 = "그런 생각을 가졌었는데, 이렇게 금세 또 막말을 흘리고 있었네요."
10026040-78 = "……참, 저는 늘 왜 이런 식인지……."
10026040-79 = "물론 저도 제 성격이 나쁘다는 것 정도는 제대로 인지하고 있으니까요. 고쳐야 한다……. 부끄러운 점이다 하는 것도."
10026040-80 = "그러니 선생님도……."
10026040-81 = "……선생님도 만약, 제가 잘못하고 있을 땐 따끔하게 한 마디 해주세요. 흐……."
10026040-82 = "저는 좀 혼나도 괜찮거든요. ……아니, 좀 혼나야 할 녀석이니까요. 솔직히."
10026040-86 = "어……. 그……. 그러니까……. 잠깐만요. 뭔가 뜻이 좀 이상하게 들릴 수 있을 것 같은데……."
10026040-87 = "그냥 문자 그대로의 이야기에요. 선생님은 선생님이니까……. 같은 학생도 아니고……."
10026040-88 = "선생님이시니까……. 괜찮다는 뜻이었어요. 네. 선생님은……. 절 좀 혼내 주셔도……."
10026040-89 = "…………."
10026040-90 = "……잡담이 길었네요."
10026040-91 = "이 이야기는 여기까지 하기로 하고, 저희는 놀러 온 게 아니니까, 하던 일을 진행하죠."
10026040-93 = "우선 이 건축물 자체는……. 상당히 중요한 곳이라는 게 타당해 보여요."
10026040-95 = "이 정도로 복잡하게 만들었으면서도, 내부 마감은 물론 곳곳에 장식물과 문양들까지 신경을 썼어요."
10026040-96 = "중요하지 않은 곳이라면 하지 않았을 일이죠. 그것도 권위적으로 중요한 곳이 아니고서야……."
10026040-98 = "지하 사령실……? 그게 아니더라도 최소 관리 센터 정도의 역할을 하는 곳……이었을까요?"
10026040-99 = "어쩌면……."
10026040-103 = "히에에!?"
10026040-104 = "하아. 깜짝이야. 방금 전 소리는 뭐죠? 뭔가 떨어지는 소리가 들린 것 같은데……."
10026040-109 = "아니, 무슨……. 대체 이런 곳에서 뭐 저리 과격한 소리를 낼 게 있다고……."
10026040-110 = "……설마 히나타 씨인가? 또 뭔가 잘못 건드려서 부숴버렸다든가……."
10026040-111 = "뭐, 실수가 잦은 사람이긴 하니……. 무리도 아니려나……."
10026040-112 = "[s5] \"사람부터 의심하는 버릇은 좋지 않아, 우이.\"\n[s6] \"대뜸 그런 식으로 말하면 안 되지.\""
10026040-115 = "……아. 그러네요……."
10026040-116 = "흐……. 벌써 혼날 일이 하나 생겨버렸네."
10026040-117 = "저도 히나타 씨를 탓하려고 하는 말은 아니었어요. 그냥 비슷한 일이 고서관에서도 좀 있었다 보니, 또 그런 건가-했을 뿐……."
10026040-118 = "……아니, 이것도 변명이구나. 죄송합니다. 그 시간에 차라리 가서 사과라도 하는 게 낫겠죠."
10026040-119 = "어쩌면 도와드릴 수 있는 게 있을지도 모르니……. 그럼 우선 소리가 난 쪽으로……."
10026040-125 = "……여기 계셨군요. 소리가 나서 와 봤는데, 무슨 일 있나요?"
10026040-126 = "……?"
10026040-127 = "왜 말씀이 없으신지……."
10026040-128 = "……????"
10026040-129 = "저기요. 사람이 말을 하면요. 대답까진 아니라도 반응을 하는 게 예의잖아요."
10026040-130 = "……뭐야."
10026040-131 = "이봐. 지금 뭐 하는 짓……."
10026040-139 = "……어……."
10026040-140 = "…………."
10026040-141 = "…………?"
