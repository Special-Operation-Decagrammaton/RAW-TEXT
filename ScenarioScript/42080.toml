[translation]
42080-1 = "제8화;새로운 대행"
42080-2 = "총학생회 건물 입구"
42080-3 = "(카야가 한 방송을 듣고 총학생회 건물에 찾아왔다.)"
42080-10 = "서, 선생님……!"
42080-11 = "크, 큰일 났어요…… 린 선배가…… 아니, 행정관님이……!"
42080-12 = "[s1] \"무슨 일이야?\"\n[s2] \"일단 진정해, 아유무.\""
42080-13 = "그게…… 그게 그러니까……"
42080-14 = "그게…… 그게 그러니까……"
42080-15 = "린 선배가 연금되었어."
42080-16 = "자신의 이득을 위해 총학생회장의 서한을 위조하고, 다른 임원들을 향해 테러를 사주한 혐의라나."
42080-17 = "[s] \"총학생회장의 서한……?\""
42080-18 = "부, 분명 무슨 오해가 있었을 거예요……!"
42080-19 = "오해는 무슨. 누군가의 음해를 받은 거겠지."
42080-20 = "그 고지식한 선배가 자신의 이득이나 명예를 위해 움직이는 사람이었더라면, 총학생회의 일 처리가 이렇게 빡빡하지도 않았을걸."
42080-21 = "덕분에 이렇게 노골적인 음해에도 눈 하나 깜짝 못하고 당해버렸지만……"
42080-22 = "[s] \"아유무와 모모카는 괜찮은 거야?\""
42080-23 = "……네, 일단은 아무런 이야기도 듣지 못했는데……"
42080-24 = "선배의 연금 소식이 알려지자마자 이어진 불신임 투표에서 후임으로 카야 방위실장을 지지하는 임원들의 목소리가 엄청나게 높아져서……"
42080-25 = "린 선배의 무죄를 주장하는 사람들은 분위기에 떠밀려 회장 밖으로 쫓겨나고 말았어요……"
42080-26 = "평소부터 일하기 싫다고 입버릇처럼 말해 왔었지만, 이런 방식으로 땡땡이를 치는 날이 올 거라곤 상상도 하지 못했었는데……"
42080-33 = "……오셨나요, [USERNAME] 선생님."
42080-34 = "'새 총학생회장 대행'께서 기다리고 계십니다."
42080-35 = "이쪽으로 오시지요."
42080-37 = "……나라면 따라가지 않을 거야, 선생."
42080-38 = "이렇게 노골적으로 덫을 쳐 놓고 들어오라고 하는데, 가는 게 더 이상하잖아?"
42080-39 = "분명 의자에 깔고 앉은 감자칩마냥 험한 꼴을 당하게 될걸."
42080-40 = "[s] \"……아마 괜찮을 거야.\""
42080-42 = "[ns] \"다녀올게. 모모카, 아유무.\""
42080-43 = "하아…… 대책 없이 긍정적인 것이 선생의 장점이라지만, 할 말이 없네."
42080-44 = "나 같은 게으름뱅이는 이럴 때 아무런 도움도 되지 않을 테니까."
42080-45 = "부, 부디 몸 조심히 다녀오세요, 선생님……!"
42080-49 = "……이쪽으로."
42080-51 = "총학생회장 대행 집무실"
42080-52 = "안녕하세요, [USERNAME] 선생님."
42080-53 = "갑자기 이렇게 총학생회의 일로 폐를 끼치게 되어 죄송합니다."
42080-54 = "본래라면 사람을 보내 정식으로 모시는 게 도리에 맞았겠지만, 오늘 오후는 어째서인지 자리를 비우고 계셔서요."
42080-55 = "이미 방송으로도 말씀드렸지만, 지금 일어나고 있는 일은 촌각을 다투는 긴급한 사안이기에 선생님을 공개적으로 호출하는 결례를 저질렀습니다. 부디 용서해 주시길."
42080-59 = "……선생님의 스케줄에 기록된 특별한 일정은 없었는데, 어디 급히 다녀와야 하는 곳이라도 있으셨나요?"
42080-60 = "[s] \"잠시 볼 일이 있어서.\""
42080-62 = "[ns] \"……그보다 린은 어떻게 된 거지?\""
42080-63 = "린 행정관은 약간의 사정이 있어 기숙사에 연금되어 있습니다."
42080-64 = "그리고 직무를 수행할 수 없는 수석행정관을 대신하여, '총학생회장의 서한'에 따라 현재는 제가 총학생회장 대행으로서 직무를 수행하고 있습니다."
42080-65 = "모쪼록, 앞으로 잘 부탁드리겠습니다."
42080-66 = "[s] \"그 총학생회장의 서한은 어디에서 발견한 거야?\""
42080-67 = "……샬레의 지하실입니다."
42080-68 = "그곳에는 크래프트 챔버와 같은 총학생회장의 알려지지 않은 개인 물품들이 보관되어 있거든요."
42080-69 = "아마도 샬레의 권한을 인수인계하는 과정에서 약간의 실수가 있었나 봅니다."
42080-70 = "린 행정관 같은 사람도 가끔씩은 실수를 할 때가 있으니까요."
42080-71 = "[s] \"샬레의 지하실을 무단으로 수색한 사람이 카야였어?\""
42080-75 = "……그렇네요. 그 점은 부인하지 않겠습니다."
42080-76 = "지난번 쿠데타로 D.U.가 혼란에 빠졌을 때, 저는 은밀히 사람을 시켜 샬레의 지하실에서 총학생회장이 남긴 물건을 가져오도록 지시했습니다."
42080-77 = "……이상하다고 생각했거든요. 총학생회장과 같은 초인이 린 행정관처럼 미숙한 사람에게 대행 업무를 맡긴 채 사라지다니."
42080-78 = "분명 무언가 범인이 이해하지 못할 오해가 있었던 게 아닐까 하고."
42080-79 = "그리고 이 수색을 통해, 저는 총학생회장의 진짜 의중을 읽을 수 있게 되었습니다."
42080-80 = "물론 그 과정에서 선생님의 사적인 공간을 다소 침범하기는 했습니다만……"
42080-81 = "[s] \"……어쩔 수 없는 일이라고 생각하고 있구나.\""
42080-82 = "규칙에 얽매여서는 지킬 수 없는 정의가 있다는 것을, 선생님께서도 알고 계시지요?"
42080-83 = "규칙을 관리하는 사람이 초인이 아닌 이상, 세상의 모든 규칙에는 허점이 발생하고 이를 악용하는 벌레들이 꼬이기 마련이지요."
42080-84 = "이 해충을 구제하기 위해서는 강력한 힘이 필요합니다."
42080-85 = "카이저 코퍼레이션도 지난번에는 다소 의욕이 지나치긴 했지만, 그들이 갖고 있는 힘만큼은 거짓이 아니니까요."
42080-86 = "저는 방위실장으로서, 강력한 힘을 조련하고 다루는 데에는 제법 익숙하답니다."
42080-87 = "그래서 이번에는 총학생회장 대행이 된 김에 이 능력을 조금 더 유용하게 사용해 보고자 합니다."
42080-88 = "[s] \"……샬레를 어찌할 생각이지?\""
42080-89 = "샬레를 어찌하다니, 누가 들으면 오해를 하겠네요."
42080-90 = "샬레와 선생님께서는 혼란에 빠진 총학생회를 대신하여 키보토스의 여러 크고 작은 사건들을 해결해 오셨고, 많은 학생으로부터 큰 신임을 받고 있습니다."
42080-91 = "그런 선생님께 답례는 하지 못할망정, 샬레를 어찌하다니— 저희가 그런 염치없는 행동을 할 리가요."
42080-92 = "……하지만 선생님께 과중한 업무와 책임이 집중되고 있는 것도 명백한 사실입니다."
42080-93 = "많은 학생들이 당번 활동과 같은 방법으로 선생님의 업무를 덜어드리고자 노력하고 있습니다만, 샬레의 근본적인 구조 탓에 아직도 선생님께서는 매일 격무에 시달리고 계시지요."
42080-94 = "그래서 '저희'도 많은 고민을 계속해 왔답니다."
42080-95 = "언제나 열심히 노력하고 계신 선생님을 위해, '저희 총학생회에서 뭔가 도울 수 있는 일은 없을까—' 하고 말이지요."
42080-99 = "[ns] \"……이건?\""
42080-100 = "샬레의 신규 행정 절차 개선안입니다."
42080-101 = "검토 부탁드리겠습니다."
42080-102 = "주요 골자는 선생님의 업무 부담을 줄이고 권한을 강화하는 형태로 되어있습니다."
42080-103 = "가볍게 확인하시고, 내용이 마음에 드신다면 서명을 부탁드리겠습니다."
42080-104 = "[s] \"여기에 서명하면…… 무엇이 달라지는 거지?\""
42080-106 = "아무것도…… 달라지지 않습니다."
42080-107 = "선생님께서는 여태껏 그래 오셨던 것처럼 하고 싶은 일을 계속하시면 됩니다."
42080-108 = "학생들과 일상을 보내고, 곤경에 빠진 시민들을 돕고……"
42080-109 = "물론 그 의무를 다하지 않으셔도 괜찮습니다. 갑자기 게으름을 부리신다 해도 선생님을 탓하지 않겠습니다."
42080-110 = "돈이 필요하시면 얼마든지 지원해 드리겠습니다."
42080-111 = "귀찮은 보고서도 저희가 대신 작성해 드리겠습니다."
42080-112 = "……모든 것은 선생님의 자유니까요."
42080-113 = "다만 단 한 가지만 약속 부탁드립니다."
42080-114 = "선생님이 하신 일에 대한 책임은 저희가 지겠습니다."
42080-115 = "샬레의 모든 활동은 총학생회의 이름으로 진행될 것입니다."
42080-116 = "당신이 어떤 죄를 지어도, 어떤 문제를 일으키더라도 저희가 책임지겠습니다."
42080-117 = "나쁜 제안은 아니라고 생각하는데요."
42080-118 = "왜, 어른은 책임을 지는 걸 싫어하잖아요?"
42080-120 = "제가 선생님을 관리해 드리겠습니다."
42080-121 = "저에게 모든 것을 맡기시고 자유롭게, 편해지시면 됩니다."
42080-123 = "[ns] \"괜찮아.\""
42080-125 = "[ns] \"자신이 벌인 일은 자신이 책임질 수 있어야 어른이니까.\""
42080-127 = "………네?"
42080-128 = "선생님, 무언가 오해가 있었던 것 같습니다만……"
42080-129 = "이 개선안은 선생님을 구속하거나 샬레의 권한을 제한하는 내용이 아닙니다."
42080-130 = "오히려 하고 싶으신 일을 더욱 자유롭게 할 수 있도록 부담을 덜어드리는 방향의 제안인데……"
42080-131 = "무언가 마음에 걸리는 조항이라도 있었던 건가요?"
42080-132 = "[s] \"카야의 제안은 확실히 매력적으로 들리긴 하지만……\""
42080-134 = "[ns3] \"어른이 책임에서 도망치는 모습을 보인다면\"\n[ns4] \"선생님으로서 학생들에게 모범이 되지 않으니까.\""
42080-139 = "하아……."
42080-140 = "정말이지 말이 안 통하는 어른이네."
42080-141 = "사회에서 눈을 돌린 채, 어린 아이나 할 법한 공상을 계속해서 품고 있는 한심한 어른이야……"
42080-142 = "이런 어른을 상대하는 것만큼 피곤한 일도 없지만……"
42080-143 = "……알겠습니다. 그렇다면 이 행정 수속 개선안은 잠시 보류하도록 하지요."
42080-148 = "내일부터 저희가 새로 구성한 내각의 주요 행정 개혁안이 적용될 예정입니다."
42080-149 = "이 개혁안에 따라, 키보토스는 규정에 따라 완벽하게 통제되는 안전하고 '멋진 신세계'로 탈바꿈될 것입니다."
42080-150 = "저희가 통제하는 키보토스에서라면 선생님께서도 생각이 바뀌실지도 모르지요."
42080-151 = "저희 방위실…… 아니, 총학생회는 언제나 선생님의 방문을 기다리고 있겠습니다."
42080-152 = "그럼. 앞으로도 잘 부탁드리겠습니다."
42080-153 = "[ns] 돌아간다."
42080-159 = "다음화;D.U.의 새로운 아침"
