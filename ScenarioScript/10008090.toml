[translation]
10008090-1 = "제9화;대책위원회 집결!"
10008090-3 = "이, 이 녀석들……! 무, 무지막지하게 강해!"
10008090-4 = "이야~ 이 아저씨도 할 때는 한다니까~?"
10008090-5 = "병력을 더……! 지원 병력을 더 불러!"
10008090-13 = "이래도 여전히 끝이 없어……!"
10008090-15 = "여럿이 모여서 괴롭히다니 떽이에요!"
10008090-17 = "……!"
10008090-25 = "크억?!"
10008090-29 = "[ns] \"이 무지막지한 개틀링 건의 화력은 설마……!\""
10008090-32 = "아! 노노미 선배까지!"
10008090-33 = "와아~☆ 세리카 쨩! 다 같이 구하러 왔어요!"
10008090-34 = "다 같이라는 건……."
10008090-39 = "응, 나도 왔어. 세리카."
10008090-40 = "거기다 시로코 선배까지?!"
10008090-42 = "으, 응? 뭐, 뭐야? 너희들이 여긴 어떻게……."
10008090-43 = "응? 세리카 쨩이랑 있는 게 흥신소의 아이들이라니."
10008090-44 = "이야~ 선생님, 의외의 조합이잖아. 이 아저씨 깜짝 놀랐어. 아, 그리고 새해 복 많이 받아~"
10008090-45 = "[s] \"새해 복 많이 받아, 가 아니라. 여긴 어떻게 알고?\""
10008090-47 = "세리카로부터 도와달라는 연락을 받았어."
10008090-48 = "연락, 이라면……."
10008090-49 = "아!"
10008090-52 = "이렇게 된 이상, 사람들을 불러서 협력을 요청하겠어!"
10008090-58 = "그 문자 한 통만으로 움직였다는 건가."
10008090-59 = "게다가 그때 마침 TV방송에서도 세리카 쨩이 아르바이트하는 이곳에서 난리가 나는 장면이 나오던 거 있죠?"
10008090-60 = "이거 뭔가 큰일이 나버려서 세리카 쨩. 위험해졌을지도 모르겠다~ 싶어서 말이야~"
10008090-61 = "세리카, 이런 일에 자주 휘말리고는 하니까."
10008090-63 = "내가 그런 이미지야?!"
10008090-69 = "동료를 구하기 위해……. 고작 문자 한 통에 일부러 이런 사지까지 달려오다니……"
10008090-70 = "아루 쨩. 감격한 표정이네~"
10008090-71 = "아, 아니, 딱히 도, 동경한다거나. 그런 거 아니거든?!"
10008090-73 = "그리고 겸사겸사 방송에서 나온 대로 새전함을 손에 넣기 위해 여기 나름의 준비를."
10008090-80 = "아니, 왜 또 여기서 그런 걸 꺼내 드는 거냐고?!"
10008090-81 = "이것도 전부 작전의 성공을 위해서."
10008090-82 = "[s] \"아, 그거 말인데.\""
10008090-83 = "그, 시로코 선배, 새전함이란 게 말이야……."
10008090-84 = "전부 사기였어."
10008090-85 = "……사기?"
10008090-88 = "이야~ 이번 소동의 주범은 카이텐져가 아니라, 진짜 나쁜 놈은 검은거북파였다……라."
10008090-89 = "그거 재난이었네~ 어른의 나쁜 장난이란 말이지~"
10008090-90 = "그건……. 용서할 수 없어요!"
10008090-91 = "사람들을 속이고 돈을 빼앗으려고 들다니! 그쵸. 시로코 쨩?!"
10008090-95 = "……새전함이 사기였다고?"
10008090-96 = "[s] \"시로코, 엄청 충격받은 모양이네.\""
10008090-97 = "시로코 쨩~ 엄청 기대하고 있었으니까~"
10008090-98 = "……처음부터 속인 거라면, 용서할 수 없어."
10008090-100 = "맞아. 용서할 수 없어. 그래서 지금부터 우린 대길전의 관리인이란 녀석에게 한 방 먹여줄 생각이야."
10008090-101 = "그런 의미에서……."
10008090-102 = "도와주지 않겠어?"
10008090-103 = "아핫~ 아루 쨩. 공동전선 제안?"
10008090-104 = "응. 상대는 조무래기라고는 해도 병력의 수가 많아. 그러니 여기에선 협력을 했으면 하는데."
10008090-106 = "뭐, 그런 일이라면야 거절할 이유는 없지?"
10008090-107 = "네! 세리카 쨩과 실망한 시로코 쨩을 위해서라도! 얼마든지요!"
10008090-113 = "……실망 안 했어."
10008090-114 = "이야~ 그것까지 전부 포함해서 되갚아주자구."
10008090-115 = "이 아저씨도 팔을 걷어붙이고 도와줄 테니까."
10008090-117 = "자, 그렇게 결정되었으면……!"
10008090-125 = "여러분! 무사하신가요?!"
10008090-126 = "통신 연결이 잠시 지체되어서……."
10008090-127 = "아야네 쨩 한 박자 늦었어! 그보다 아야네 쨩까지 복면이야?!"
10008090-128 = "어, 이건 시로코 선배가 거사를 치르기 전에 꼭 준비해야 하는 물건이라고……."
10008090-129 = "이미 소용없어졌어."
10008090-130 = "네, 네에……?"
10008090-132 = "아하하핫! 안경 쨩까지! 재밌잖아!"
10008090-133 = "흐으응~ 어쨌거나 그럼 이걸로 앞으로 할 행동은 결정이 난 거지?"
10008090-134 = "[s] \"응? 무츠키?\""
10008090-135 = "모두가 힘을 합쳐서 반격한다! 라는 것도 물론 재미있지만."
10008090-141 = "응~ 역시 그것만으로는 좀 부족하다니깐~ 그러니까~♪"
10008090-145 = "송신 완-료!"
10008090-146 = "무츠키. 지금 건……."
10008090-147 = "이 난장판을 우리만 즐기기엔 너무 아깝잖아?"
10008090-148 = "그래서 한 가지 재미있는 걸 준비했거든."
10008090-149 = "보스의 명령이다! 놈들을 여기서 제압해!"
10008090-158 = "쿠흐흣, 그러니 지금부터 다 같이 축제를 즐기러 가자?"
10008090-159 = "응? 선생님♡"
