[translation]
10007090-1 = "제9화;철거다, 철거!"
10007090-4 = "으으…… 굴착기가…… 대형 온천장의 꿈이……."
10007090-10 = "게헨나의 조무래기들이 감히 붉은겨울의 자치구 내에서 불순한 짓을 저지르려 하다니……."
10007090-11 = "그 죄는 백 번 숙청해 마땅하다!"
10007090-12 = "오오, 마리나. 역시 이 몸의 오른팔 다운 훌륭한 솜씨로군!"
10007090-13 = "붉은겨울 학원의 안위를 위협하는 불순분자들을 훌륭히 처리한 공적을 인정하여, 그대에게는 특별히 <1급 수염 용맹 무공훈장>을 수여하겠다!"
10007090-14 = "감사합니다, 회장님. 불초 마리나, 회장님을 위해 더욱 충성을 다하겠습니다."
10007090-15 = "음. 좋아, 좋아!"
10007090-16 = "이제 남은 일은 이 온천장을 철거하는 일 뿐인가."
10007090-17 = "이처럼 훌륭한 온천장을 철거하려니 아쉽기는 하지만…… 이대로 흉물로 남게 두느니, 자재를 해체해서 이 몸의 조각상을 만드는 데 쓰는 게 훨씬 좋겠지."
10007090-19 = "자, <숙청군 1호>! 철거다, 철거!"
10007090-24 = "……무얼 철거하신다고요?"
10007090-25 = "오, 전(前) 지배인. 마침 도착했는가."
10007090-30 = "온천개발부의 학생들과 사무국 친위대가 잔뜩……"
10007090-31 = "이게 무슨 소란이람?"
10007090-32 = "흥, 알고 보니 게헨나의 이 불순분자들이 온천장의 물이 끊길 위험이 있다며 붉은겨울 자치구를 통째로 폭파시킬 계획을 세우고 있질 않던가!"
10007090-33 = "온천장의 물이…… 끊긴다고요……?"
10007090-34 = "그래. 그런 시시한 이유로 사무국 건물을 날려버린다니, 억지도 유분수지."
10007090-35 = "하지만 걱정하지 말게. 이들의 사악한 계획은 사무국의 용맹한 보안위원들이 이미 일소하였으니!"
10007090-36 = "그럼…… <227호 온천장>은…… 어떻게 되는 거죠?"
10007090-37 = "그야 아마도 물이 끊기면 자연스럽게 폐쇄되겠지?"
10007090-38 = "하지만 그것도 걱정 말게. 그 전에 이 온천장은 우리가 깨끗이 철거하고 갈 테니."
10007090-39 = "온천장에 쓰인 고급 석재와 목재들은 이 체리노 님의 권위를 상징하는 상징물로 재단장하여 사무국 앞에 전시될 테니…… 자랑스럽게 여겨도 좋네, 하하하!"
10007090-43 = "용납할 수…… 없어……"
10007090-45 = "용납할 수 없어요!"
10007090-47 = "가, 갑자기 왜 소리를 지르는 겐가?! 놀라서 넘어질 뻔 했잖나!"
10007090-48 = "회장님이 무슨 권한으로 이 온천장을 폐쇄시킨단 말인가요?"
10007090-49 = "으, 응? 그야…… 회장이니까?"
10007090-50 = "그렇게 회장의 권위를 강조하시는 분이, 저희가 구교사에서 장작 하나 없이 떨고 있었을 때는 무얼 해주셨었나요?"
10007090-51 = "어, 그건 그러니까……."
10007090-52 = "아무리 불순한 의도로 건설된 건물이라 해도, 저희에게는 소중한 온천장이라고요!"
10007090-53 = "이 온천장이야 말로 저희가 모처럼 얻은 행복이었는데……! 유일한 희망이었는데……!"
10007090-54 = "그것마저 가져가시겠다니……!"
10007090-55 = "이 망할 꼬맹이! 가짜 수염! 평생 키가 128cm에서 멈춰버려라!"
10007090-56 = "부, 붉은겨울 학원의 최고 존엄인 이 몸에게 그게 무슨 폭언인가!"
10007090-58 = "자네 제정신인가?"
10007090-59 = "제정신이고 말고요! 원래의 구교사 숙청 생활로 돌아간다는 데 더 이상 무어가 두렵겠어요?"
10007090-60 = "회장님은…… 회장님은……"
10007090-61 = "절대로 용서할 수 없으니까요!"
10007090-62 = "……딸꾹."
10007090-68 = "(소근) 저, 혹시 노도카 양…… 뭘 드신 건가요?"
10007090-69 = "음, 아무래도 아까 건네 준 모르스의 '발효'가 생각보다 더 많이 진행된 것 같아."
10007090-70 = "그렇다고는 하지만 모르스 한 잔 밖에 마시지 않았는데……"
10007090-73 = "우웃, 이 몸도 더 이상 참지는 않을 것이다!"
10007090-75 = "훌륭한 온천 만쥬의 맛을 보아 숙청없이 온천장을 철거하는 것으로 그치려 했는데……."
10007090-77 = "붉은겨울 학원의 최고존엄을 모욕한 죄로 더 가혹한 숙청을 내리겠다! 특별반 녀석들에게는 한 달에 한 번 지급되던 물 섞은 푸딩도 중지야!"
10007090-78 = "그런다고 저희가 무서워할 줄 알고요?"
10007090-79 = "회장님이 계속 억지를 부리시겠다면, 저희에게도 생각이 있지요!"
10007090-84 = "미노리 씨!"
10007090-86 = "음, 우리를 불렀나?"
10007090-87 = "의뢰입니다. 온천 영업으로 번 수익으로 여러분을 직접 고용하겠습니다!"
10007090-92 = "일금 100만 엔! 선지급하겠습니다!"
10007090-93 = "자, 잠깐 노도카. 그건 우리가 이번에 갖고 있는 돈 전부잖아?"
10007090-94 = "그게 무슨 대수야?"
10007090-95 = "이 온천장을 잃어버리면 어차피 다 쓸모없어질 돈이라고!"
10007090-96 = "좋아. 의뢰를 받아들이지. 우리 용역부가 해야하는 일은 뭐지?"
10007090-97 = "이 망할 독재자 꼬맹이와 그 수하들을 온천장에서 몰아내는 일입니다!"
10007090-98 = "그거라면……"
10007090-99 = "하루 종일이라도 할 수 있는 일이지!"
10007090-100 = "동지들, 새로운 일감이다!"
10007090-101 = "우리는 지금부터 특별반의 동지 학생들과 함께 건방진 체리노 회장을 끌어낸다!"
10007090-104 = "혁명이다! 혁명!"
10007090-106 = "특별반과 용역부가 손을 잡았다고?"
10007090-107 = "수, 수가 늘었다고 누가 두려워할 줄 아느냐?"
10007090-108 = "마리나!"
10007090-109 = "이 몸의 권위를 의심하는 저 반동세력을 온천장과 함께 통째로 밀어버려라!"
10007090-110 = "숙청 퍼레이드 개시다!"
