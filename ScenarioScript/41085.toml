[translation]
41085-2 = "쳇, 이 좀도둑 녀석들이 어디로 간 거지?"
41085-3 = "멀리 도망치지는 못했을 거야. 이 근처를 샅샅이 뒤져봐!"
41085-8 = "그러니까 우리는 좀도둑이 아니라고 했잖아!"
41085-9 = "쉿, 사키. 목소리를 줄여주세요. 아직 상대가 가까이 있습니다."
41085-13 = "여기는 RABBIT 1. 캠프 RABBIT, 소대가 막 포인트 에코에 도착했습니다. 목표로 한 <당근>도 무사히 확보. 다행히 부상자는 없습니다만……."
41085-14 = "조금 전의 교전으로 인해 최초에 계획했던 퇴로를 사용할 수 없게 되었습니다."
41085-15 = "게다가 지금도 계속해서 적이 증원되고 있는 상황이라……."
41085-17 = "내 그럴 줄 알았어. 사키가 하는 일이 다 그렇지 뭐."
41085-18 = "이론만 완벽하지, 실기 실습에서는 언제나 실수투성이였으니까."
41085-19 = "시끄러워! 그러는 모에 너도 실기 점수는 언제나 바닥이었잖아?"
41085-20 = "뭐가 문제였지? 분명 완벽한 작전이었는데……!"
41085-21 = "[s] \"세상일이라는 게 생각과는 늘 다른 법이지.\""
41085-22 = "으읏. SRT의 위력을 보여줄 모처럼의 기회였는데. 하필이면 다른 사람도 아닌 샬레의 선생님 앞에서 이런 추태를 보이다니……."
41085-24 = "그나저나 미유는 어디에 있죠? 아까 전부터 모습이 보이지 않습니다만……."
41085-25 = "응? GPS 상에는 지금도 너희랑 같이 있는 것으로 표시되고 있는데?"
41085-27 = "뭐라고? 설마……."
41085-31 = "미유, 이 바보가……!"
41085-32 = "무전기를 가방에 놔둔 채로 가버렸어!"
41085-33 = "아까의 교전 중에 황급히 저격 포인트로 이동하느라 무전기를 챙기는 걸 잊었나 보네요."
41085-34 = "최초로 교전이 벌어진 곳에서 미유가 이동할 수 있을 만한 저격 포인트를 꼽아보자면……"
41085-35 = "B동에 위치한 크레인 타워밖에 없겠군요."
41085-36 = "B동의 크레인 타워? 그 아래에는 지금 경비원들이 잔뜩 몰려 있을 텐데?"
41085-37 = "게다가 그 일대는 몸을 숨길 만한 엄폐물도 거의 없으니, 자력으로 탈출하는 걸 기대하기도 어렵겠어."
41085-38 = "……어떻게 할까요, 사키."
41085-39 = "뭘 묻는 거야. 당연히 구하러 가야지."
41085-40 = "하지만 여기 있는 드럼통은 놔두고 가는 수밖에 없겠어. 아무리 나라도 등에 드럼통을 짊어진 채 싸울 수는 없으니까."
41085-41 = "동감입니다. 아쉽지만 <당근>은 포기하고 아군 구출을 최우선 목표로 변경해야겠네요."
41085-42 = "다만 적의 수가 너무 많아서 이쪽도 피해를 각오해야 할 것 같습니다."
41085-46 = "……선생님? 갑자기 왜 그러시나요?"
41085-47 = "무슨 좋은 작전이라도 떠오르신 건가요?"
41085-48 = "[s] \"여기 있는 드럼통을 뒤집어쓰자!\""
41085-50 = "네에? 드럼통을 뒤집어쓴 채 적의 눈을 속여가며 미유가 있는 곳까지 이동하자고요?"
41085-51 = "그게 갑자기 무슨 뚱딴지 같은 말씀이신지……."
41085-52 = "……아니, 그러고보니 나도 책에서 읽은 기억이 있어."
41085-53 = "주변에 널려 있는 골판지 상자나 드럼통 등을 사용해서 잠입 임무를 성공적으로 수행한 전설적인 공작원이 있다고……."
41085-54 = "아무리 그래도 대놓고 드럼통이 움직이는데, 수상하게 여기지 않을 리가……."
41085-55 = "하지만 그 외의 방법이 없잖아?"
41085-56 = "나도 이 너구리 같은 선생님의 말을 듣는 건, 교범을 라면 받침으로 쓰는 것 이상으로 싫지만……."
41085-57 = "내 실수 때문에 다른 소대원이 다치는 건 보고 싶지 않으니까……."
41085-58 = "……알겠습니다. 이번 작전에서는 당신의 지시에 따르기로 했으니까요."
41085-59 = "지금부터 모두 자신의 키에 맞는 드럼통을 하나씩 장비해주세요."
41085-60 = "지금부터 RABBIT 4를 구출하기 위해 신속히 이동합니다!"
41085-66 = "……응? 방금 저 드럼통, 원래부터 저기에 있었던가?"
41085-67 = "항만 선적장에 드럼통이 있는 건 당연하잖아. 갑자기 새삼스럽게 왜 그래?"
41085-68 = "아니, 뭔가 부자연스러운 느낌이 들어서."
41085-69 = "게다가 아까는 드럼통이 움직인 것처럼 보였고……."
41085-70 = "근무 중에 졸기라도 한 거야?"
41085-71 = "정신 차리고 일해. 지금은 좀도둑을 잡는 게 우선이라고."
41085-77 = "……신기하네요. 정말 이 드럼통을 뒤집어쓰고 있으니 사람들이 저희를 눈치채지 못하네요."
41085-78 = "그러게. 나도 반신반의했었지만……"
41085-79 = "어지간한 위장복이나 차폐물보다 효과가 더 좋은 것 같아."
41085-80 = "드럼통의 효과가 이렇게 뛰어날 줄 알았으면 전략 물자로 쓰게 좀 더 챙겨올 걸 그랬네."
41085-81 = "하하…… 아무리 그래도 잠입한 상태에서 한 사람이 두 개 이상의 드럼통을 동시에 운반하는 건 불가능하니까요."
41085-82 = "하지만 나중에 SRT 학원으로 돌아가게 된다면 작전 비용을 일부 할당해서라도 구매를 고려해봐야겠습니다."
41085-86 = "……RABBIT 2, 이제 곧 랑데부 포인트에 도달합니다. 접선 준비를 부탁드립니다."
41085-91 = "우으, 우으으…… 다들 어디로 간 거지……?"
41085-92 = "사키 쨩…… 미야코 쨩…… 근처에 있으면 대답 좀 해 봐……."
41085-93 = "경비원들이 목소리를 들을까 봐 소리도 크게 못 내고…… 가져온 무전기도 보이질 않고……."
41085-94 = "……다 끝났어. 다들 나를 잊어버린 채 원래의 장소로 돌아간 게 분명해."
41085-95 = "그럼 나는 모두의 기억 밖에서 잊힌 채, 이대로 크레인 위에서 말라죽고 말겠지……."
41085-99 = "어라? 이 소리는……"
41085-103 = "으힉?! 드, 드럼통이 움직였다!"
41085-104 = "미유, 미유!"
41085-105 = "이제는 말까지 하고 있어!"
41085-106 = "저, 저게 뭐지? 신종 UMA? 아니면 기어 다니며 다가오는 혼돈?"
41085-107 = "이 안으로 들어와! 빨리!"
41085-108 = "여, 역시 괴물이 맞았어! 이제는 나를 드럼통 안으로 끌어들여 한 몸이 되려 하고 있잖아?!"
41085-109 = "드, 드럼통 님. 저는 맛이 없어요! 다른 희생자를 찾아봐 주세요!"
41085-110 = "그게 무슨 소리야? 이상한 농담을 하고 있을 시간은 없다고!"
41085-111 = "동료들에게 잊혀져 방치되는 것도 모자라, 이제는 드럼통 괴물에게 잡아먹히게 되다니……"
41085-113 = "더는 싫어……!"
41085-115 = "아, 정말……!"
41085-119 = "나라고, 사키!"
41085-120 = "사키 쨩……?"
41085-121 = "그래. 이 근처에 흔히 보이는 드럼통으로 위장한 것뿐이라고. 뭘 겁내고 있는 거야?"
41085-122 = "우으으…… 사키 쨩…… 나는 다들 나를 버리고 간 줄만 알고…… (훌쩍)"
41085-123 = "그, 그럴 리가 없잖아?"
41085-124 = "그리고 꼴사납게 작전 중에 울지 마! 우리는 SRT의 엘리트라고!"
41085-125 = "알았어……. (훌쩍)"
41085-126 = "일단은 다른 경비원들이 알아차리기 전에 어서 이 드럼통 안으로……."
41085-130 = "침입자다!"
41085-134 = "역시 들켰잖아!"
41085-136 = "적의 접근을 확인…… 엄청난 수의 경비 드론이 몰려들고 있어!"
41085-137 = "RABBIT 2, 어떻게 하죠? 바로 교전에 들어갈까요?"
41085-138 = "이럴 때 쓸 수 있는 전략은 단 하나뿐이지……."
41085-140 = "그냥 뛰어!"
41085-153 = "(이후, 드럼통을 뒤집어쓴 채 빗발치는 총탄 속을 달려 어찌 공원까지 돌아왔다…….)"
41085-155 = "코우사기 공원, 소대 야영지."
41085-158 = "헉, 헉…… 설마 여기까지 쫓아오지는 않겠지……."
41085-159 = "우왓, 이게 뭐야. 크립티드? 아니면 키보토스에 현현한 기어 다니는 혼돈?"
41085-160 = "……잘은 모르겠으니 일단 태워볼까?"
41085-161 = "그만둬! 우리라고, 우리!"
41085-165 = "그보다 왜 너도 미유와 같은 이야기를 하는 거야? 도대체 기어 다니는 혼돈이 뭔데?"
41085-167 = "후우…… 소대원 모두 복귀한 것 같군요."
41085-168 = "다행히 작전 중에 부상을 입거나 낙오한 인원도 없었습니다."
41085-169 = "[USERNAME] 선생님은 다치진 않으셨나요?"
41085-170 = "[s1] \"나도 다친 곳은 없어.\"\n[s2] \"드럼통 덕분에 무사해!\""
41085-171 = "다행이네요. 선생님께서 저희의 작전에 어울려 주시다 크게 다치기라도 하셨더라면……"
41085-172 = "다행이네요. 선생님께서 저희의 작전에 어울려 주시다 크게 다치기라도 하셨더라면……"
41085-173 = "이번에야말로 총학생회의 높으신 분들이 저희를 가만두지 않았을 테니까요."
41085-175 = "그나저나 아까의 그 추태는 뭐야, 사키. 그렇게 자신만만해하더니 결국은 경비에게 들켜 쫓겨다니기나 하고……."
41085-176 = "역시 사키는 실전에 약하다니까."
41085-177 = "시끄러워. 그때 돌발 상황이 발생하지만 않았어도 5분 만에 끝낼 수 있었거든?"
41085-178 = "정말이지, 현실은 언제나 기대를 배신한다니까……."
41085-179 = "사, 상황이 언제나 교범대로 흐르지는 않으니까……."
41085-181 = "그래도 오늘의 작전은 성공입니다. 다친 사람도 없고, 목표도 회수했으니까요."
41085-182 = "이번 작전의 성공은 전적으로 사키의 지휘 덕분입니다."
41085-183 = "……흥."
41085-184 = "아아— 그보다 땀을 잔뜩 흘린 탓에 온몸이 끈적거려."
41085-185 = "자기 전에 목욕이나 했으면 좋겠는데……. 야영 중에 그런 걸 기대하는 건 역시 사치려나."
41085-186 = "쿠히히, 그렇게 말할 줄 알고……"
41085-187 = "이렇게 미리 목욕에 필요한 장작과 수건을 준비해두었다구! 자, 빨리 목욕하자!"
41085-188 = "작전이 끝나지도 않았는데, 혼자서 목욕 준비를 하고 있었단 말이야?"
41085-189 = "규정대로라면 징계감이지만…… 오늘은 어쩔 수 없지. 애초에 목욕을 위한 작전이기도 했고."
41085-193 = "……그럼 지금 바로 시험해볼까?"
41085-196 = "찬성이야! (입니다!)"
41085-207 = "하아…… 살 것 같아……."
41085-208 = "역시 장기 작전으로 쌓인 피로는 따듯한 물로 목욕을 해야 해소된다니까……."
41085-209 = "이 드럼통으로 만든 욕조도 아늑하니 생각보다 나쁘지 않네요."
41085-210 = "물 온도도 딱 적당하고……."
41085-211 = "하우우…… 지금은 괜찮지만, 이대로 온도가 계속 올라서 화상을 입으면 어쩌지……?"
41085-212 = "그 왜. 서서히 끓는 물에 들어간 개구리는 자기가 죽는 줄도 모른다는 말도 있잖아……."
41085-213 = "후후, 걱정 마. 물의 온도는 주변에 설치한 열상 장비로 계속 체크하고 있으니까."
41085-214 = "오히려 내 생각에는 물이 미적지근한 것 같은데……"
41085-215 = "장작에 테르밋 분말이라도 뿌려볼까?"
41085-216 = "무턱대고 소이탄을 쓰는 건 그만둬! 드럼통에 구멍이라도 낼 생각이야?"
41085-217 = "게다가 온도는 지금이 제일 좋다고. 이 이상 온도를 높였다가는 우리 모두 토끼 수프가 되어 버릴 거야."
41085-218 = "공원에서 이렇게 다 같이 목욕을 하는 것도 어쩐지 운치가 있어서 즐겁네요."
41085-219 = "언젠가 SRT 특수학원에 돌아가게 되더라도, 가끔은 야영지에서 이런 시간을 갖는 것도……."
41085-220 = "[s] \"그나저나 이렇게 개방된 장소에서 목욕해도 괜찮아?\""
41085-221 = "뭐 어때. 보는 사람도 없는데."
41085-222 = "어차피 SRT 대원들끼리는 맨몸을 보이는 정도로는 부끄럽지도 않고, 이 공원은 찾는 사람도 거의 없는 외진 곳에 있으니까."
41085-223 = "혹여라도 외부인이 이 근처까지 접근하려면 우선 공원 진입로에 설치된 지뢰와 자동 포탑을 먼저 상대해야 할 거야."
41085-224 = "……그런데 선생님은 왜 여기에 있는 거야?"
41085-225 = "[s3] \"뭐랄까, 어쩌다 보니 자연스럽게……\"\n[s4] \"……감시역?\""
41085-232 = "……."
41085-234 = "잠깐! 뭘 자연스럽게 학생들이 목욕하는 모습을 훔쳐보고 있는 거야!"
41085-235 = "당장 안 돌아가?!"
41085-236 = "역시 우리가 장비를 해제한 틈을 타 수상한 짓을 하려고……"
41085-237 = "……모에. 소이 수류탄의 사용을 허가합니다."
41085-238 = "죽어라, 이 변태!"
41085-244 = "코우사기 공원 인근 뒷골목"
41085-245 = "대장. 이 근처의 공원에 새로운 신입이 들어온 것 같은데요."
41085-246 = "본래 인연이란 바람처럼 찾아왔다 바람처럼 떠나가는 존재……"
41085-247 = "새로운 인연이 찾아왔다 해서 호들갑을 떨 필요는 없습니다."
41085-248 = "다만 그들이 우리와 함께 공존하기를 희망한다면, 물욕을 내려놓고 자연 그대로의 상태를 즐기는— 무소유의 마음을 가져야 할 필요는 있겠지요."
41085-249 = "여러분들이 보시기엔 어떻던가요? 그들 또한 우리와 같이 무소유를 깨우친 고결한 존재던가요?"
41085-250 = "아뇨. 무소유는커녕, 욕심만 그득하던걸요."
41085-251 = "게다가 행동력은 어찌나 재빠른지, 요새는 이 일대에 먹을만한 폐기 도시락을 보기가 어려울 정도입니다. 언제나 남아돌던 숙주 도시락까지요!"
41085-252 = "게다가 나무토막이나 방수포 같은 생존에 필수적인 폐자재도 가리지 않고 수집하고 있어서…… 저희의 성소를 보수하는 계획에도 차질이 생겼습니다."
41085-253 = "저런, 저런. 모처럼 찾아온 인연이 물욕에 눈이 먼 아귀 떼일 줄이야."
41085-260 = "……좋습니다, 동지들. 모두 각자의 무기를 준비해주세요."
41085-262 = "물욕에 눈이 멀어 도덕을 상실한 속물들에게……"
41085-264 = "무소유의 기쁨에 대해 가르쳐줍시다!"
41085-266 = "다음화;수상한 그림자"
