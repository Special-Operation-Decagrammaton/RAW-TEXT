11080-235 = "자, 잘못 나온 거 아닌가요? 저희 이런 걸 낼 돈이 없어요……."
11080-236 = "아냐아냐, 제대로 나왔다고. 580엔 시바세키 라멘 보통 사이즈! 그쵸, 마스터?"
11080-237 = "뭐, 실수로 조금 많이 담았나보군. 신경쓰지 마라."
