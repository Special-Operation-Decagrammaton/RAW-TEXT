[translation]
11080-2 = "제8화;흥신소 등장!"
11080-3 = "대책위원회 동아리실"
11080-4 = "……자, 그러면 아비도스 대책위원회 정기 회의를 시작하겠습니다."
11080-5 = "이번에는 선생님이 참석해 주셨기 때문에, 좀 더 진지한 회의가 될 거라고 생각하는데요……."
11080-6 = "네~☆"
11080-7 = "물론이야."
11080-8 = "뭐야, 언제는 진지하지 않게 한 것처럼……."
11080-9 = "으헤, 잘 부탁해, 선생."
11080-10 = "[s] \"잘 부탁해.\""
11080-12 = "그럼 본론으로 들어가서, 오늘의 안건은 우리의 핵심 문제…… #n<학교의 빚을 어떻게 갚느냐?> 의 구체적인 방법을 논의하겠습니다."
11080-13 = "의견 있으신 학생께서는 손을 들어주세요!"
11080-14 = "나! 나!"
11080-15 = "네, 1학년 쿠로미 세리카 씨. 말씀해주세요."
11080-16 = "……저기, 그 경칭 어떻게 안돼? 적응이 안되는데."
11080-17 = "그치만 모처럼의 회의잖아, 세리카 쨩……."
11080-18 = "뭐 어때. 기분내고 좋잖아. 선생과 함께 하는 회의는 거의 없었으니까."
11080-19 = "거의가 아니라 처음이지."
11080-20 = "맞아요! 제대로 된 위원회 느낌이 나는 거 같아서 좋아요~☆"
11080-21 = "하아, 뭐, 선배들 생각이 그렇다면야……."
11080-22 = "……자, 어쨌든! 대책위원회 회계 담당으로써 말하겠는데, 지금 우리 학교는 파산 직전이야!"
11080-23 = "이대로라면 폐교라고! 모두들 알고 있지?"
11080-24 = "뭐, 그렇지."
11080-25 = "매달 은행에 갚아야 하는 이자만 해도 788만엔! #n우리끼리 겨우 이것저것해서 벌고는 있지만, 한 달 이자를 내기에도 벅차다구."
11080-26 = "지금처럼 지명수배자 체포나 민원 해결, 대외 봉사활동 같은 걸로는 한계가 있어."
11080-27 = "이대로는 답이 없다고! 큰 거! 큰 거 한 방을 노려야 해!"
11080-28 = "큰 거……라면?"
11080-29 = "(팔락~) 바로 이거야! 시내에서 받은 전단지!"
11080-30 = "이, 이건……."
11080-31 = "어디보자……."
11080-32 = "게르마늄 맥반석 팔찌 네트워크 비즈니스로 당신도 이제 부자가 될 수 있……다……?"
11080-33 = "그래! 이 사업으로 왕창 돈을 버는 거야!"
11080-34 = "……."
11080-35 = "저번에 시내에 나갔다가 웬 사람들한테 끌려가 세미나를 들었는데, #n행운을 올려주는 게르마늄 팔찌를 팔고 있다는 거야!"
11080-36 = "……."
11080-37 = "이걸 끼고 있기만 해도 행운이 오른다고 했어! 이걸 주변의 3명에게 팔면……?"
11080-39 = "……. 뭐야, 그 표정들은?"
11080-40 = "기각."
11080-41 = "뭐?! 왜? 어째서?!"
11080-42 = "세리카 쨩……. 이거 다단계 네트워크잖아. 그러니까……"
11080-43 = "사기다."
11080-44 = "뭐?!"
11080-45 = "애초에 게르마늄과 행운이 무슨 상관인지도 잘 모르겠고…….#n이런 수상쩍은 세미나에서 제대로 된 사업 얘기를 할 리가 없잖아……."
11080-46 = "그, 그런 거야? 나 팔찌 2개나 샀는데?!"
11080-47 = "세리카 쨩 속았어요~ 귀여워~☆"
11080-48 = "……!!"
11080-49 = "이야, 세리카 쨩은 순진하다니까. #n좀 더 정신차리지 않으면 나중에 나쁜 어른한테 속아서 인생이 돌이킬 수 없게 된다고?"
11080-50 = "으, 으으……. 분명 그럴 듯해 보였는데……. 이거 사려고 점심도 굶었는데……."
11080-51 = "괜찮아요, 세리카 쨩. 같이 점심 먹어요. 제가 사드릴게요."
11080-52 = "크윽…… 노노미 선배……."
11080-54 = "어……. 그럼 세리카 쨩의 의견은 이걸로 마무리하고, 다음 의견 있으신 분……?"
11080-55 = "나! 나!"
11080-56 = "어…… 네. 3학년 타카나시 호시노 부장님. 어째 불안하지만……."
11080-57 = "흠흠. 엣헴~"
11080-58 = "우리 학교의 가장 큰 문제는 전교생이 우리들 뿐이라는 거야."
11080-59 = "학생 수가 곧 학교의 권력. 트리니티나 게헨나처럼 학생 수가 다섯자리 숫자인 학교는 #n매달 학생회비만 해도 엄청날 거란 말이지."
11080-60 = "어…… 그, 그런가요?"
11080-61 = "그런 거야! 그래서 우리는 학생 수를 늘려야 해. 거기부터 시작인 거지."
11080-62 = "그래야 상원의원도 배출하고 총학에서 발언권도 생기고 하니까."
11080-63 = "좋은 지적이긴 한데…… 무슨 수로……."
11080-64 = "간단해. 다른 학교의 스쿨버스를 납치하는 거야!"
11080-65 = "네?"
11080-66 = "등교길의 스쿨버스를 하이재킹해서 우리 학교 전학신고서에 도장을 찍지 않으면 #n내려주지 않는 거지."
11080-67 = "으헤~ 이걸로 학생 수를 왕창 늘리는 거야!"
11080-68 = "흥미롭네."
11080-69 = "타겟은 트리니티야? 아니면 게헨나? 밀레니엄?"
11080-70 = "타겟에 따라 전술을 바꿔야 할 수도 있으니까."
11080-71 = "엥? ……어, 음…… 글쎄. 트리니티? 아냐, 게헨나가 좋겠다!"
11080-72 = "자, 잠깐만요! 그런 식으로 전학이 가능할 리가 없잖아요!"
11080-73 = "게다가 타학교의 선도부에서 우리를 가만두지 않을 거고……."
11080-74 = "으헤~ 역시 그렇지?"
11080-75 = "역시 그렇지~가 아니잖아요, 호시노 선배…… #n좀 더 진지하게 회의에 임해주시지 않으면……."
11080-77 = "나에게 더 좋은 생각이 있어."
11080-78 = "……네. 2학년 스나오오카미 시로코 씨……."
11080-79 = "은행을 털자."
11080-80 = "네?!"
11080-81 = "확실하고 간단한 방법이지. 이미 타겟도 정해 놨어. #n시내에 있는 제 1중앙은행을 턴다."
11080-82 = "금고 위치, 경비원의 동선, CCTV의 사각, 현금 수송 차량의 주행 루트까지 이미 파악해뒀어."
11080-83 = "아까부터 열심히 보고 있던 게 그거였어요?!"
11080-84 = "5분이면 1억엔을 벌 수 있어. 자, 여기 복면도 준비해 왔다."
11080-88 = "언제 이런 것까지……"
11080-89 = "이야, 시로코 쨩이 직접 바느질한 거야?"
11080-92 = "와아, 이것 보세요! 레슬러 같지 않아요?"
11080-93 = "……."
11080-94 = "이야- 좋다. 역시 인생은 한방이지. 그렇지, 세리카 쨩?"
11080-97 = "그럴 리가 있나!! 기각! 기각이야!"
11080-98 = "마, 맞아요! 범죄는 안돼요!"
11080-101 = "……."
11080-102 = "그런 시무룩한 표정을 지어도 어쩔 수 없는 건 없는 거예요, 시로코 선배!"
11080-103 = "하아……. 여러분 좀 더 제대로 된 아이디어를 주시지 않으면……."
11080-105 = "저기- 저요! 저! 다음은 저예요!"
11080-106 = "네……. 2학년 이자요이 노노미 씨. #n범죄와 사기 빼고 말씀해주세요……."
11080-107 = "네! 범죄도 아니고 다단계도 아니지만 확실한 방법이 있어요!"
11080-108 = "아이돌이에요! 스쿨 아이돌!"
11080-109 = "아, 아이돌……?!"
11080-110 = "네! 애니에서 봤어요. 학원 부흥에는 아이돌이 정석! #n우리 모두 다 같이 아이돌로 데뷔해서……."
11080-111 = "기각."
11080-112 = "어라…… 이것도 안되는 건가요?"
11080-113 = "왜? 확실히 호시노 선배라면 특정 매니아들한테 수요가 있을 것 같은데?"
11080-114 = "으헤- 이런 빈약한 몸을 좋아하는 사람은 글러먹은 인간이라고. #n사형이라고."
11080-115 = "포즈도 생각해 뒀는데……"
11080-116 = "(챡-)"
11080-117 = "수영복 소녀단의 크리스티나~♧"
11080-118 = "뭐가……"
11080-119 = "~♧이야! 그리고 수영복 소녀단은 또 뭐야! 센스 구려!"
11080-120 = "어어- 밤새 생각한 건데……."
11080-122 = "저기…… 논의가 뱅글뱅글 돌고 있는데……. 뭐라도 결정을 해야 하지 않을까요……?"
11080-123 = "결정은 선생에게 맡기자고. 선생은 지금 나온 안건 중에서 뭘 하고 싶어?"
11080-124 = "네?! 여기서 고르는 거예요?! 조, 좀 더 제대로 된 안건을 골라야 하는 거 아니에요?"
11080-125 = "괜찮아, 괜찮아. 선생님이 고르는 거라면 분명 정답일 테니까."
11080-126 = "자, 잠깐만요?! 그, 그럴 리가 없잖아요?!"
11080-128 = "설마 아이돌을 선택하진 않겠지?"
11080-129 = "아이돌-☆ 파이팅-♧"
11080-130 = "……(스윽)"
11080-131 = "[s1] \"스쿨버스 하이재킹이다!\"\n[s2] \"은행을 털자!\"\n[s3] \"내가 프로듀서를 맡겠다!! 아이돌을 하자!\""
11080-135 = "네?! 그걸요?! 저, 정말인가요?! 진짜로요?"
11080-136 = "와하하하-! 좋아. 결정됐네. 그럼 출발이다!"
11080-137 = "꺄아~☆ 재미있겠어요!"
11080-138 = "저, 정말로? 이래도 되는 거야?"
11080-139 = "으헤~ 괜찮지 않을까?"
11080-140 = "계획은 대담할 수록 좋아. 그렇지, 아야네?"
11080-141 = "……되……."
11080-142 = "되……?"
11080-144 = "될 리가 없잖아요!!"
11080-145 = "와장창-!"
11080-146 = "나왔다! 아야네 쨩의 밥상 뒤집기!"
11080-147 = "……."
11080-148 = "꺄아, 아야네 쨩이 화났어요! 비상이에요!"
11080-149 = "으헤~ 뒤집어야 할 때는 확실하게 뒤집는 아이로 성장했구나. 이 엄마는 기쁘단다."
11080-150 = "누가 엄마예요! 정말이지, 제대로 진지하게 해달란 말이에요!"
11080-151 = "맨날맨날 장난만 치고! 은행강도니 다단계 같은 소리나 하고 있고!"
11080-153 = "(뜨끔)"
11080-154 = "……."
11080-156 = "(이후 엉망진창 설교를 들었다.)"
11080-158 = "이야, 미안하다고. 아야네 쨩. 라멘 사줄테니까 화 풀어."
11080-159 = "화 안났어요……."
11080-160 = "자아, 입 닦고. 아이 착하다~☆"
11080-161 = "애 다루듯이 하지 말아주실래요?"
11080-162 = "……다 좋은데 말야. 왜 또 여기 온 거야."
11080-163 = "챠슈 더 먹을래, 아야네?"
11080-164 = "(우물우물) 네."
11080-165 = "(덜컥. 드르륵.)"
11080-166 = "......"
11080-167 = "아…… 저, 저기……."
11080-168 = "어서 오세요! 몇 명인가요?"
11080-169 = "……여, 여기서 제일 싼 메뉴가 어, 얼마인가요?"
11080-170 = "제일 싼 거라면……"
11080-171 = "580엔짜리 시바세키 라멘입니다! 시그니처 메뉴니까 맛있어요!"
11080-172 = "아, 가, 감사합니다!"
11080-173 = "(드르륵-)"
11080-174 = "응?"
11080-175 = "(드르륵-)"
11080-181 = "히히, 드디어 찾았네. 600엔 이하 메뉴!"
11080-183 = "후후후. 역시, 무슨 일이든 해결책은 있는 법이지. #n이미 전부 예측하고 있었어."
11080-184 = "그, 그런가요. 역시 뭐든지 알고 계시는 사장님이시군요……."
11080-185 = "하아……."
11080-188 = "모두 네 분이신가요? 자리로 안내해 드리겠습니다."
11080-189 = "아냐아냐, 우린 한자리로 괜찮아. 하나만 시킬 거니까."
11080-190 = "하나만……? 그래도 편한 자리로 안내해 드릴게요. #n어차피 빈자리 많은 한가한 시간이고."
11080-191 = "오! 친절한데? 고마워, 고마워. 사양하지 않을게."
11080-192 = "아, 신세지는 김에 젓가락은 4개로 부탁할게. 친절한 알바 쨩."
11080-193 = "엑? 4개? 서, 설마 당신들 한 그릇을 나눠먹으려는 거야?"
11080-194 = "죄, 죄, 죄송합니다. 거지라서 죄송합니다!! #n돈이 없어서 죄송합니다!"
11080-195 = "에?! 아, 아니…… 딱히 사과할 일은 아니고……."
11080-196 = "아니에요! 돈이 없으면 죽어야 해요! 살 가치가 없어요! #n벌레만도 못한 존재예요! 벌레 이하라서 죄송합니다……!"
11080-197 = "하아…… 좀 조용히 해, 하루카. 민폐잖아……."
11080-198 = "뭐야?! 돈이 없는 게 죄는 아니잖아! 어깨를 피라고!"
11080-200 = "네? ……네?!"
11080-201 = "돈이란 건 없을 수도 있는 거잖아. 학생이니까! #n그래도 다 같이 동전을 모아서 라멘을 먹으러 온 거잖아? 그게 중요한 거라고!"
11080-202 = "있어 봐, 얼른 가져다 줄테니."
11080-205 = "……어쩐지 이상한 오해를 받은 거 같은데."
11080-206 = "뭐야~ 우리도 딱히 거지는 아닌데. 돈을 다 써버린 아루 쨩 때문이지."
11080-207 = "아루 쨩이 아니라 사장님. 무츠키 실장, 호칭은 꼭 붙여서 써야지."
11080-208 = "응? 퇴근 후에도 사장님이야? #n그런데 무슨 사장님이 직원 라멘도 못사주고 그래?"
11080-209 = "……."
11080-210 = "오늘 습격 임무에 투입할 용역들을 고용한다고 전재산을 써버렸으니……."
11080-211 = "후후후. 그래도 라멘 하나 먹을 돈은 남았잖아? 이 정도는 예측범위 안이야."
11080-212 = "그러니까 네 그릇 먹을 돈을 남겼어야지……."
11080-213 = "솔직히 말해, 아루쨩? 까먹었지? 저녁값을 빼두는 걸 까먹었지?"
11080-214 = "……후후후."
11080-215 = "하아. 뭐, 리스크는 줄일수록 좋은 거고, #n이번 타겟을 헬멧단 같은 피래미처럼 다룰 수는 없다는 건 동의해."
11080-216 = "하지만 사장. 전재산을 다 털어서 용병을 모집할 정도로 아비도스가 위험한 녀석들이야?"
11080-217 = "그건……."
