11080-251 = "응응, 여기 라멘 진짜 최고예요. 다른 지역에서도 먹으러 찾아올 정도니까요."
11080-252 = "아아. 동의해. 수많은 지역을 돌아다니면서 먹어봤지만 이 정도 라멘은 찾아보기 힘들지."
11080-253 = "헤헤…… 저희 단골이기도 해요. 다른 학교 학생들이 와서 먹어주니 어쩐지 기뻐서……."
