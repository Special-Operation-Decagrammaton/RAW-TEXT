[translation]
10010050-1 = "제5화;트리니티의 달리는 섬광탄 1"
10010050-4 = "케이크……. 어떻게든 구하기는 했네요. 그래도 시작이 나쁘지 않아요!"
10010050-5 = "이것도 다 선생님 덕분이겠죠? 정말 감사합니다."
10010050-6 = "[s1] \"아냐. 히나타가 고생했지.\"\n[s2] \"공성 전차께서 고생하셨죠.\""
10010050-7 = "네, 네? 아, 아뇨. 그게 무슨……. 전 한 게 없는 걸요."
10010050-8 = "그, 그 별명은 역시 좀……."
10010050-9 = "아, 아무튼 그럼 우선 이것부터 가져다 드리고……."
10010050-10 = "다음이……. <정성약>과 <물이끼 아교>였죠?"
10010050-11 = "음……. 뭐부터 구하러 가는 게 좋으려나요……?"
10010050-12 = "[s3] \"……정성약?\"\n[s4] \"물이끼 아교부터?\""
10010050-13 = "그럴까요? 그럼……."
10010050-14 = "그럴까요? 그럼……."
10010050-18 = "……!?"
10010050-19 = "……뭐, 뭐죠? 이 소리는……?"
10010050-28 = "히, 히익!? 싸, 싸움……? 어디서 싸움이 난 건가요?"
10010050-29 = "가까운 거 같아요. 빨리 가보죠!"
10010050-30 = "[s] \"케이크는 괜찮아?\""
10010050-31 = "……!"
10010050-32 = "아……. 그……. 어, 그, 그게……."
10010050-37 = "괘, 괜찮아요! 아니……. 어, 어쩔 수 없잖아요……!?"
10010050-38 = "아무리 그래도 이런 소리까지 듣고 그냥 지나친다는 건……. 누군가 곤란에 처했으면 어쩌려고요……."
10010050-39 = "……아, 안 될까요……. 역시?"
10010050-40 = "[s5] \"아니. 물론 안될 거 없지.\"\n[s6] \"히나타라면 그렇게 말할 거 같았어.\""
10010050-41 = "아, 아하하……."
10010050-42 = "아, 아하하……."
10010050-43 = "그, 그럼 지금 바로……!"
10010050-49 = "하아, 하아……."
10010050-50 = "이상하군요. 오늘따라 불량배분들이……. 평소보다 좀 더 질긴 느낌이 들어요."
10010050-52 = "하하! 당연하지! 우리는 아무리 쓰러져도 일어나는 롤리폴리단이거든!"
10010050-54 = "그렇군요……. 여러분의 팀 네임에는 그다지 관심이 없습니다만……."
10010050-55 = "구태여 그걸 저한테 이렇게 밝히시는 이유도 잘 모르겠고 말이죠. 마치 대결이라도 신청하듯이……."
10010050-56 = "응. 맞아. 오늘의 우리는 처음부터 널 노리고 온 거거든."
10010050-57 = "……네?"
10010050-58 = "절 노리고 왔다고요? 어째서……?"
10010050-59 = "어째서냐니!? 진심으로 물어보는 거야!? 네가 지금껏 우리한테 한 걸 생각해 보라고!"
10010050-60 = "그러기에 적당히 설쳤어야지! 정말 이런 날이 올 거라고 생각 못 한 거냐?"
10010050-61 = "오늘은 진짜 각오하는 게 좋을 거다, <트리니티의 달리는 섬광탄>!"
10010050-62 = "또 이상한 별명을 지어내고……."
10010050-63 = "그리고 적반하장이군요. 항상 문제를 일으키던 건 당신들 쪽이지 않습니까."
10010050-64 = "전 그저 누군가는 해야 할 일을 했던 것뿐……."
10010050-66 = "아, 알 게 뭐야!? 우린 그런 녀석들인데!!"
10010050-67 = "게다가 지어내다니? 네 별명은 우리가 지은 게 아냐!"
10010050-68 = "실은 우리도 그게 문제니까 이러는 거고 말이지."
10010050-70 = "……? 문제라니요?"
10010050-71 = "……하! 정말 아무것도 모르는 모양이군."
10010050-72 = "네 녀석, 스스로 한 짓의 파장이 얼마나 큰지 알고 있긴 한 거야?"
10010050-73 = "네 녀석의 그 행적 때문에, 네 녀석을 모방하는 놈들이 생겨나고 있다는 거, 알고는 있냐고!"
10010050-74 = "……모방? 저를요?"
10010050-75 = "왜 저를……? 대체 누구죠, 그건?"
10010050-77 = "한두 녀석이 아냐. 아마도 SNS 같은 데에서 보고, 어설프게 따라 하기 시작한 모양이던데……."
10010050-78 = "자칭 트리니티의 연막탄이라느니 트리니티의 그물망이라느니……! 이상한 이름을 단 짝퉁들 천지라고, 이제!"
10010050-79 = "그러니까 아예 그 원인을 제거하러 온 거야!! 그 원인은 바로 너!!"
10010050-81 = "아니, 아무리 봐도 원인은 당신들이잖습니까……."
10010050-82 = "그래도 뭐……. 대충 이해했습니다. 정작 SNS를 거의 안 하는 저로선 알지도 못했지만……."
10010050-83 = "그런 일이 있었던 거군요. 스스로 나서는 사람들이 늘어난다는 건 좋은 일이죠. 모처럼 듣기 좋은 이야기였군요."
10010050-84 = "그렇지만 다시 한번 말씀드리자면, 그분들과 저는 관계가 없습니다. 서로 아는 사이도 아니에요."
10010050-85 = "그래도 꼭 저와 여기서 결판을 내셔야만 하겠다면……."
10010050-89 = "……좋습니다. 빠르게 끝내시죠."
10010050-91 = "흐, 흡……."
10010050-92 = "야, 쫄지 마. 아무리 저 녀석이라도 이번에는 30대 1이라고. 설마 지겠어?"
10010050-93 = "우리는 '아무리 쓰러져도 일어나는 롤리폴리단'이라고 네가 그랬잖아?"
10010050-94 = "그, 그치만 18대 1까진 이미 져 봤는걸……. 쓰러져도 일어나는 거랑 이기는 건 별개의 문제잖아?"
10010050-95 = "게다가 저번엔 총알 없이 빈 총 한 자루로 우리 쪽 전원을……."
10010050-96 = "아, 조용히 해! 쪽팔리게! 이번엔 확실히 이길 숫자라고 했잖아!"
10010050-98 = "……저기……."
10010050-99 = "……아직인가요? 얼마나 더 기다리면 됩니까?"
10010050-100 = "에잇, 시끄러워! 그놈의 기분 나쁜 여유……!"
10010050-101 = "결판이다, 트리니티의 달리는 섬광탄!!"
10010050-103 = "서, 선생님……!"
10010050-104 = "[s7] \"도와주자.\"\n[s8] \"우선 싸움을 말리자.\""
10010050-105 = "네, 넵……!"
10010050-106 = "네, 넵……!"
