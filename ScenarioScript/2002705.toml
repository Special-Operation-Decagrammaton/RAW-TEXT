[translation]
2002705-1 = "기대감"
2002705-2 = "(시로코에게 고민이 있는지 걱정이 되어, 리조트의 시로코 방 쪽으로 향했다.)"
2002705-3 = "(복도에 도착하자, 복도 너머로 시로코의 모습이 보였다.)"
2002705-11 = "[ns1] \"……? 시로코?\"\n[ns2] \"복도로 나와 있네……?\""
2002705-22 = "[ns] 시로코를 따라간다."
2002705-28 = "[ns] (…………?)"
2002705-30 = "[ns3] \"시로코의 모습이…….\"\n[ns4] \"……사라졌다?\""
2002705-33 = "…………."
2002705-44 = "……선생님."
2002705-46 = "[ns] \"……!?\""
2002705-49 = "[ns5] \"깜짝이야…….\"\n[ns6] \"시로코……?\""
2002705-54 = "……아……."
2002705-55 = "미안해, 선생님. 그렇게 놀랄 줄은 몰랐어."
2002705-56 = "누군가 따라온다고 생각해서, 조금 몸을 숨기고 있었을 뿐."
2002705-57 = "선생님인 걸 알고 나서 다가가 부른 것이었는데……."
2002705-58 = "……응? 어디를 가고 있었냐고? 그건……."
2002705-59 = "딱히……. 아무것도……. 그냥……. 아침 산책을 좀……."
2002705-63 = "……으응. 거짓말이었어, 죄송합니다……."
2002705-64 = "실은……. 조금 아쉬워서, 다시 보러 가고 싶었어."
2002705-65 = "……바닷가."
2002705-66 = "[s7] \"바닷가? 폭죽 쐈던 곳?\"\n[s8] \"아까 바비큐 파티를 했던 곳?\""
2002705-69 = "……응."
2002705-70 = "모두에게도 이야기를 할까 했지만……. 시간도 이미 조금 있으면 새벽이고……."
2002705-71 = "그리고, 괜히 분위기를 무겁게 만들지 않을까 걱정이 돼서."
2002705-72 = "그렇지만, 그때의 일들……. 돌아가면 이제 다시 하기는 어려운 일이라고 생각하니, 역시 이대로 지나가긴 싫어서."
2002705-73 = "그냥 넘어가려니까, 도무지 잠을 잘 수가 없어서……."
2002705-74 = "[s] \"………….\""
2002705-75 = "차라리 한 번 다시 보고 오는 게, 잠을 잘 수 있을 거라고 생각했어."
2002705-76 = "오래 있을 생각은 아니었어. 잠깐이면 될 거라고 생각했으니……."
2002705-80 = "……안 될까, 역시. 너무 늦었을까."
2002705-81 = "[s9] \"뭐, 그럼 같이 갈까?\"\n[s10] \"보호자가 필요한 타이밍이네.\""
2002705-84 = "……!! 선생님도……?"
2002705-85 = "……응. 좋아."
2002705-89 = "……이쪽."
2002705-97 = "……도착……."
2002705-101 = "……어……. 으음……."
2002705-102 = "[s11] \"시로코?\"\n[s12] \"의외로 개운하지 않은 얼굴인걸.\""
2002705-105 = "……응."
2002705-106 = "뭔가 달라……. 저녁때 봤던 것과, 바다의 모습이…… 조금……."
2002705-107 = "……응? 밀물 때라서, 저녁 때 놀던 곳은 지금 물에 잠겨 있다고?"
2002705-108 = "그런……. 그럼 지금은……. 다시 볼 수 없는 거네."
2002705-109 = "그때의 모습은……. 이제는……. 똑같이는……."
2002705-110 = "[s13] \"대신 더 재밌게는 가능하지.\"\n[s14] \"하지만 다르게는 얼마든지 할 수 있어.\""
2002705-113 = "무슨 뜻……이야?"
2002705-114 = "돌아가서도 더 해 줄 수 있다고? 어떻게……? 학교는……. 바다가 아닌데……."
2002705-115 = "……? 바다라서 좋은 게, 아니었을 수도 있다고……?"
2002705-116 = "그런……. 선생님의 말이 무슨 말인지 모르겠어."
2002705-117 = "돌아가서도, 바비큐…… 하게 될까? 폭죽…… 볼 수 있을까?"
2002705-118 = "……응? 아마 아닐 거라고?"
2002705-119 = "……그럼……."
2002705-120 = "[s15] \"그걸 기대하는 게 중요하지 않을까?\"\n[s16] \"그때에는, 그때의 즐거움이 기다리고 있을 거야.\""
2002705-123 = "음……."
2002705-124 = "미안해, 선생님. 아직은 잘 모르겠어. 나한테는, 조금 어려운 이야기일 지도."
2002705-128 = "……그렇지만."
2002705-129 = "응. 선생님의 말이니까……. 뭔가……. 벌써부터 궁금해지기 시작했어."
2002705-130 = "기대……일까? 이게."
2002705-131 = "어쩌면……. 지금은 모른다고 말했지만, 그때에는 알 수 있을지도 몰라."
2002705-132 = "그런 느낌이 들어."
2002705-133 = "…………."
2002705-134 = "……응. 뭔가 즐거워졌어. 마음도 조금, 시원해졌어."
2002705-141 = "……선생님."
2002705-143 = "……기대할게."
