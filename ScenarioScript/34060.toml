[translation]
34060-1 = "제6화;부러져버린 것들"
34060-3 = "으, 응! 연락받고 바로 왔어."
34060-4 = "게다가 단둘이 얘기하고 싶다니, 우와, 세이아 쨩 답지 않게 조금 무서웠달까!"
34060-5 = "그래서 맨날 감시하던 정의부 아이도 문밖에 두고 왔거든? 그러니까……."
34060-6 = "미카……."
34060-7 = "세, 세이아 쨩……? 어라? 괘, 괜찮은 거야? 안색이……. 게다가 몸이 떨리고 있는데? 사,사람을 부를까?"
34060-8 = "……당신이 아리우스 자치구에 접촉했을 때, <스쿼드> 외에 다른 사람을 만난 적은 없었나요?"
34060-9 = "으, 으응……? 아리우스……?"
34060-10 = "아리우스 자치구에는 정말로 단 한 번도 가본 적이 없는 것이 맞나요?"
34060-11 = "어…… 저기…… 세이아 쨩……? 나는……."
34060-12 = "드레스를 입은 키가 큰 붉은 여성을 본 적은 없었나요? <스쿼드>에 대해서 혹시 더 알고 있는 정보는 없나요?"
34060-13 = "……저, 저기, 세이아 쨩. 무슨 소린지 잘……."
34060-14 = "콜록, 콜록……."
34060-15 = "……. 당신이 아리우스에 접촉했기 때문에……."
34060-19 = "……."
34060-20 = "어…… 그, 그렇지? 나 때문에…… 여러 가지가……."
34060-21 = "선생님이……. 스쿼드에게 노려지고……."
34060-22 = "……!?"
34060-23 = "응, 저기…… 세이아 쨩, 뭐라고……?"
34060-28 = "당신이 선생님을 데려왔기 때문에!!"
34060-29 = "……!!?"
34060-30 = "……아뇨. 당신 탓이 아닌데……. 미안해요……. 그건……."
34060-31 = "쿨럭, 쿨럭쿨럭……!!"
34060-33 = "쿨럭쿨럭쿨럭쿨럭……!!"
34060-34 = "(아아…… 안 돼요. 몸이 말을 듣지 않아요…….)"
34060-37 = "(의식이……. 흐려……지……는…….)"
34060-41 = "……."
34060-42 = "……여기는?"
34060-43 = "이 건축 양식…… 여기는 설마, 아리우스 자치구의……?"
34060-44 = "네, 그래요. 아리우스 바실리카라는 곳입니다."
34060-45 = "!!"
34060-51 = "으읍……!!"
34060-52 = "흐응. 역시 당신이었군요. 엿보는 쥐가 있다고 생각했는데, 설마 이 지성소까지 쫓아올 줄이야."
34060-53 = "설마 꿈속이라고 방심했던 것인가요? 예언의 대천사…… 아니, 유리조노 세이아."
34060-54 = "……. 여, 여기는……. 여기가…… 바로 그 제단……."
34060-55 = "네. 그렇습니다. 다른 게마트리아의 동지들에게도 보여주지 않은 비경이죠. 영광으로 생각하시길."
34060-60 = "………!!!"
34060-63 = "세, 세이아 쨩! 정신 차려!! 아, 안 돼!"
34060-64 = "여기!! 여기 사람을 불러 줘!! 세이아 쨩이! 세이아 쨩이 이상해!!"
34060-65 = "아, 네?! 아, 알겠습니다!!"
34060-67 = "(저건……, 대체…….)"
34060-68 = "(보고만 있어도 불길한…… 기운이…….)"
34060-69 = "(이 제단은…… 무언가…… 알 수 없는 어떤 것을…… 부르기 위한……?)"
34060-71 = "(저 아이는……!)"
34060-73 = "(…….)"
34060-74 = "(그런가요. 이건……. 이 의식은…… 설마…… 그런 것이었나요…….)"
34060-78 = "(이 여인은…… 키보토스에 무언가를…… 어떤 무언가를…… 불러오려고…….)"
34060-80 = "아, 아아…… 세이아 쨩, 사람을 불렀으니까, 응?"
34060-81 = "어째서…… 어째서…… 세이아 쨩……. 어째서……. 또 다시 이렇게……."
34060-82 = "나는…… 나는……. 세이아 쨩…… 어째서……."
34060-84 = "미카…… 당신에게…… 저는 또 같은 짓을……."
34060-85 = "미안해요. 미카. 당신 잘못이 아니에요. 이건……. 저의 실수예요……."
34060-86 = "……선생님. 제 목소리가 들리신다면…… 부디……."
34060-87 = "도망치세요. 선생님. 최대한 아리우스 자치구에서 멀어지셔야 합니다."
34060-88 = "그렇지 않으면……. 선생님은……."
34060-89 = "지금이라도…… 선생님을 노리는 자들이……."
34060-90 = "선생님……!!"
34060-92 = "키보토스의 모처. 심야의 뒷골목."
34060-94 = "[ns1] (……방금 뭔가 세이아의 목소리가 들린 것 같았는데.)\n[ns2] (기분 탓인가……. 불길한 기분이…….)"
34060-95 = "(발신 미상의 문자를 받고 이곳을 찾아왔지만, 거리는 텅 비어 있었고 인적을 찾아볼 수도 없었다.)"
34060-96 = "(발신 미상의 문자를 받고 이곳을 찾아왔지만, 거리는 텅 비어 있었고 인적을 찾아볼 수도 없었다.)"
34060-101 = "[ns] (뒤쪽에서 인기척이……?)"
34060-103 = "[ns] \"사오리……?\""
34060-104 = "……."
34060-110 = "다음화;선택과 결정"
