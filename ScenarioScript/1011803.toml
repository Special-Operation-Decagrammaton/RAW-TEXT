[translation]
1011803-1 = "의외의 귀여움"
1011803-2 = "똑똑똑~"
1011803-3 = "안녕~ 선생님!"
1011803-4 = "[s1] \"안녕, 노조미.\"\n[s2] \"무슨 일로 온 거야?\""
1011803-7 = "진짜 별건 아니고, 귀찮은 일이지."
1011803-8 = "자, 이거."
1011803-9 = "[s] \"이건……?\""
1011803-14 = "이건 슈포 쨩이야. 새로 만들어진 행정위원회 마스코트."
1011803-15 = "공모전 당선작이라나, 뭐라나."
1011803-16 = "인기는 그닥인가 봐. 이렇게 굿즈가 남아돌아서 뿌리라고 하는 걸 보면."
1011803-17 = "[s] \"아하, 이걸 전달해 주려고 온 거구나.\""
1011803-18 = "봐, 하이랜더 교복을 입고 있지?"
1011803-19 = "우리 인지도 올리는 목적으로 샬레에 좀 놓고 오래서."
1011803-20 = "이런 걸로 인지도가 올라가려나? 선생님은 이런 거 좋아해?"
1011803-21 = "[s] \"귀여운 건 나름 좋아하지.\""
1011803-22 = "헤에~ 귀엽다고 생각하는구나, 파햐햐!"
1011803-23 = "난 잘 구분이 안 가거든."
1011803-24 = "다른 애들이 막 꺄아꺄아 귀여워어~ 하는 것들 있잖아? 난 모르겠어."
1011803-25 = "뭔가 귀엽다고 느껴본 적이 딱히 없네."
1011803-26 = "대충 그런가 싶기도 하고. 뭐, 아무래도 좋은 일이지!"
1011803-27 = "[s] \"귀엽다고 느낀 게 없다고?\""
1011803-31 = "[ns] \"잠깐 기다려 볼래?\""
1011803-36 = "[ns] \"자, 이건 어때?\""
1011803-37 = "이게 뭔데?"
1011803-38 = "[s] \"저번에 게임 스테이션에서 뽑은 인형이야. 귀엽지 않아?\""
1011803-39 = "헤에~ 그런가~"
1011803-43 = "[ns3] \"반응이 영 시원찮은데!\"\n[ns4] \"그럼 다음으로 간다!\""
1011803-49 = "[ns] \"자, 이건?!\""
1011803-50 = "뭔가…… 기분 나쁘게 생겼는데?"
1011803-51 = "[ns5] \"기분 나쁘다고?! 대괴수 오르테가노스의 피규어가?!\"\n[ns6] \"크윽, 말도 안 돼!\""
1011803-54 = "선생님은 그게 귀여운 거야?"
1011803-55 = "아니, 선생님뿐만 아니라 대부분 귀엽다고 느끼는 건가?"
1011803-56 = "파햐햐! 정말 모르겠단 말야."
1011803-57 = "[s] \"오늘, 노조미에게 귀엽다는 말을 꼭 듣고 말겠어!\""
1011803-59 = "(그 뒤로 계속해서 소장하고 있는 굿즈들을 보여주었으나……)"
1011803-67 = "(도통 소용이 없었다……)"
1011803-70 = "[ns] \"후…… 마지막으로 이건 어떠냐!\""
1011803-72 = "풉-"
1011803-73 = "[ns7] \"어? 반응이 있는데?\"\n[ns8] \"그치? 이거 귀엽지??\""
1011803-76 = "크, 크큭…… 아니…… 그게 아니라."
1011803-80 = "선생님이 계속 뭔가 보여주려고 하잖아?"
1011803-81 = "막 이거저거 꺼내면서, 이건 어때 저건 어때 하면서."
1011803-82 = "그 모습이 뭔가……"
1011803-83 = "귀여워 보였달까?"
1011803-84 = "[ns] \"뭐라고……!!\""
1011803-85 = "파햐햐!! 아니, 진짜로! 그렇다니까?"
1011803-86 = "[ns] \"……\""
1011803-88 = "(왠지 분해서 돌아앉았다……)"
1011803-89 = "크, 크큭…… 선생님~ 삐졌어~?"
1011803-90 = "목적 달성한 거 아냐? 나한테 귀엽다는 말 듣고 싶었다며~"
1011803-96 = "왜~? 선생님이 귀여우면 안 돼?"
1011803-97 = "[s] \"큭……!\""
1011803-99 = "(노조미는 그렇게 한참 동안 나를 놀리다가 돌아갔다……)"
