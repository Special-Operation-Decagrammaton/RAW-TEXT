[translation]
10037060-1 = "제6화;눈 맞은 대나무를 누가 휘었다 하던가."
10037060-3 = "[ns] \"엄청나게 울창한 대나무숲이네…….\""
10037060-4 = "후후. 어떤가, 선생. 인상적이지 않은가?"
10037060-5 = "계절이 맞았다면 죽순을 수확하는 모습도 보여 줄 수 있었을 게다."
10037060-6 = "죽순……?"
10037060-7 = "대나무의 싹이다. 맛이 부드럽고 연한 데다 식감이 좋아, 어떤 요리에 들어가도 어울리지."
10037060-8 = "아마도 어제 현무상회의 요리에서도 재료로 들어갔을 터지만……."
10037060-9 = "아, 그 노랗고 얇은 그거? 고소했지!"
10037060-10 = "음! 산해경의 죽순은 특히나 질이 좋아, 이른 아침부터 먹어도 질리지 않는다는 말이 있을 정도니까!"
10037060-12 = "그래도 오늘은 어제와 달리, 함께 거닐 수 있어서 좋네요. 문주님."
10037060-13 = "그래…… 이 자리에서 어제의 무례를 사과하고 싶구나. 체리노 서기장."
10037060-14 = "응? 갑자기 무슨 말인가, 키사키 문주."
10037060-15 = "교류회를 주최했다는 자가, 귀한 손님들을 제대로 안내하지도 못했으니 말이다."
10037060-21 = "무, 문주님……!"
10037060-23 = "아하, 그것 말인가. 이것 참, 무슨 소리를 하나 했더니. 그런 일을 아직 신경 쓰고 있었단 말인가."
10037060-24 = "이야기가 나온 김에, 이 자리에서 말해 두도록 하지."
10037060-30 = "나, 붉은겨울의 서기장은 그런 하찮은 것에 연연하지 않는 몸인 것이야!"
10037060-35 = "역시 체리노 회장님이십니다!"
10037060-37 = "으, 으음……!"
10037060-38 = "(어디까지가 진의인지는 알 수 없지만, 다행이로다. 체리노 서기장의 기분이 그렇게까지 상한 것은 아닌 듯하니.)"
10037060-39 = "그렇게 너그러이 넘겨준다면, 한층 더 감사해야 할 것은 우리 쪽이겠지. 그러고 보니 간밤의 잠자리는 불편하지 않았는가?"
10037060-40 = "문제없었습니다. 키사키 문주님. 오히려 따듯하고 푹신하여 더할 나위가 없었다고나 할까요."
10037060-41 = "그런데 뭔가…… 처음 맡아보는 향이 나더군요."
10037060-42 = "후후. 그 향 말인가. 마리나 위원장은 후각이 예민하구나. 산해경의 연단방에서 제조한 약향(藥香)이라는 것이다."
10037060-43 = "심신의 안정과 치유에 도움이 된다고는 하는데…… 도움이 되었을지 모르겠구나."
10037060-44 = "네, 네? 그, 말씀을 듣고 보니 그랬던 것 같기도…… 잘 모르겠는 것 같기도……."
10037060-45 = "그건 그렇고, 모처럼 대나무숲까지 왔으니, 좋은 것을 보여 주도록 하마."
10037060-46 = "좋은 것, 말씀이신가요?"
10037060-48 = "좋은 것이라고 하심은……? 아!"
10037060-49 = "그러하다. 산해경 대나무숲의 명물이기도 하지."
10037060-50 = "후후후. 기대해도 좋을 것이다. 여기에서 그것을 보고 좋아하지 않는 학생은 없었으니까!"
10037060-51 = "그러면 가도록 할까. 안내하겠다."
10037060-56 = "저, 저것은……?! 설마, 그, 저기……!"
10037060-57 = "끝내주지? 엄청나지? 믿을 수 없을 만큼 귀엽지?"
10037060-62 = "판다다–!!!"
10037060-63 = "마리나 위원장? 너무 큰 소리를 지르면, 판다들이 놀라서 도망갈지도 모릅니다만……?"
10037060-64 = "헉, 그런가?!"
10037060-66 = "그럴 가능성도 없지는 않겠지만, 저 느린 친구들이 그렇게까지 부지런할지는 또 모르겠구나."
10037060-67 = "(사실 산해경에 도착한 당일 감옥에서 아기 판다를, 여러 가지 이유로 보기는 했지만…….)"
10037060-68 = "(여기에서 그 화제를 꺼내는 것은 경우에 맞지 않겠군요.)"
10037060-69 = "다시 봐도 뭔가, 얼룩무늬 곰처럼 생겼네……."
10037060-70 = "음? 판다를 본 적이 이미 있는가?"
10037060-71 = "네. 자료와 사진으로 본 적이 있답니다. 마리나 위원장은 곰이라면 특히 종류를 가리지 않고 좋아하니까요."
10037060-72 = "후후, 그렇구나. 판다 역시 곰이기는 하지. 엄청난 대나무 먹보이기도 하지만 말이다."
10037060-74 = "그러고 보니, 판다는 대나무만 먹는다고……."
10037060-75 = "그러하다. 거기에 아무 대나무나 먹는 게 아니라, 자기가 먹던 대나무 종류만 먹는 편식쟁이지."
10037060-76 = "거기에 하루 종일 먹고 자는 것 말고는 하는 일이 없기도 하고……."
10037060-77 = "[s] \"먹고 자기만 하면 된다니, 판다 대단해! 부러워!\""
10037060-78 = "서, 선생?"
10037060-79 = "으음, 지금은 뭔가 깊은 어둠이 느껴지는 듯한, 아닌 듯한……."
10037060-80 = "하지만 판다는 귀엽지. 그렇지 않은가?"
10037060-82 = "그렇습니다, 문주님! 이렇게 보고 있는 것만으로……!"
10037060-86 = "뭔가, 마음이 치유 받는 것 같은 기분이……!"
10037060-87 = "후후. 마음껏 즐기거라. 보는 이쪽까지 편안해지는구나. 조금 더 가까이에서 보겠느냐?"
10037060-91 = "그래도 됩니까?!"
10037060-92 = "그래. 미나가 안내할 게다. 이미 저 아이들은 어느 정도 사람에 익숙해져 있기도 하니 말이다. 미나, 부탁한다."
10037060-94 = "예. 문주님."
10037060-98 = "그러면 조심스럽게 다가가 보도록 하지."
10037060-99 = "지나치게 가까이 가면 판다에게도, 사람에게도 좋지 않으니 어디까지나 적절한 거리에서……."
10037060-110 = "자아, 그러면 선생도……."
10037060-114 = "?!?!"
10037060-119 = "(뭐지……? 갑자기, 몸이……!)"
10037060-120 = "(호흡이…… 어렵구나. 머리가 너무 어지러워. 팔다리에 힘이 들어가지 않는다.)"
10037060-121 = "(갑자기, 하필이면 왜 지금……?)"
10037060-122 = "[ns] \"키, 키사키?! 괜찮아?!\""
10037060-128 = "(선생의 목소리가…… 멀리 들린다. 그만큼 거리가 떨어져 있는 것인가?)"
10037060-129 = "(그것이 아니라면…….)"
10037060-137 = "……선생. 묻고 싶은 것이 있다."
10037060-138 = "벌써…… 밤이 된 것인가? 사방이 매우 어둡구나."
10037060-139 = "[ns] (……!)"
10037060-141 = "[ns] \"……응……. 맞아. 어느새 해가 졌네…….\""
10037060-143 = "……."
10037060-144 = "……그러한가."
10037060-145 = "……."
10037060-146 = "부탁이, 있노라. 선생."
10037060-147 = "연단방의 부장을…… 불러 다오."
10037060-149 = "[ns] \"여기서, 사야를……?\""
10037060-150 = "그렇다……. 지금은, 그렇게 하는 것만이 이 사태에 대처할 수 있을 것이니……."
10037060-151 = "그리고…… 체리노 서기장과, 붉은겨울 일행을…… 부탁한다……."
10037060-152 = "미나와 함께…… 자연스럽게, 육화각까지, 안내해 주었으면 하는데……."
10037060-153 = "[ns1] \"그건 내가 어떻게든 할게.\"\n[ns2] \"그보다, 지금은 이미 밤인데……?\""
10037060-154 = "……후후."
10037060-155 = "……후후."
10037060-156 = "선생은, 역시 친절하구나……."
10037060-157 = "하지만…… 그렇게까지 나에게 말을 맞추어 줄 필요는…… 없느니라……."
10037060-163 = "……좋은 소식을 전하지 못하게 되어, 미안한 것이다. 문주."
10037060-164 = "(……? 벌써 도착했나……?)"
10037060-165 = "그렇지만 문주가 정확한 사실을 요구했으니, 나님은 그 요구에 솔직하게 대답할 수밖에 없는 것이다……."
10037060-169 = "(아니…… 아니로구나. 이것은 그때의 기억인가…….)"
10037060-172 = "그러니, 잘 들어주었으면 하는 것이다."
10037060-173 = "문주의 몸은 앞으로, 하루에 제한된 시간밖에는, 제대로 움직이지 못할 것이다……."
10037060-174 = "(그래. 그대는 분명 그렇게 이야기했지…….)"
10037060-175 = "육화각 전체에는 무리이겠지만, 내실에는 약향(藥香)을 피워 두도록 하겠다. 문주의 상태를 조금이나마 호전시킬 수 있을 것이다."
10037060-176 = "그리고 이제부터는, 아침마다 이 단약을 복용해야 하는 것이다. 하루라도 단약을 걸렀다가는, 정말로 큰일이 나고야 말 것이다."
10037060-177 = "또 다른 건 없느냐고? 으음……."
10037060-178 = "매일 스트레칭을 하는 것을 추천하는 것이다. 체조라든가 말이다. 만병의 근원은 혈행의 부족에서 온다는 말도 있고……."
10037060-179 = "알았지? 나님과 약속해 주었으면 하는 것이다."
10037060-180 = "……산해경의 누구라고 해도, 문주를 이런 식으로 잃고 싶지는 않을 것이다……."
10037060-182 = "(그렇지만, 이상한 일이구나.)"
10037060-183 = "(분명 오늘 아침에도, 단약을 제대로 복용했을 터인데…….)"
10037060-184 = "(…….)"
10037060-188 = "(그렇다는 것은…….)"
