[translation]
34270-1 = "제27화;에필로그"
34270-7 = "이, 이쪽 길은 처음 가봐요……."
34270-8 = "어디로 통하는 걸까요……."
34270-9 = "응. 일단 가 보는 수밖에 없어."
34270-10 = "어디든 우리가 처음 가보는 길일 거니까."
34270-11 = "……. 네. 그렇겠네요."
34270-15 = "……어라."
34270-16 = "리, 리더는요?!"
34270-17 = "응?"
34270-18 = "부, 분명 리더가 뒤에서 따라오고 있었는데…… 어, 없어졌어요?!"
34270-20 = "……칫."
34270-21 = "미사키……?"
34270-22 = "리더는 떠났어……."
34270-23 = "떠, 떠났다고요?!"
34270-24 = "그래…… 나에게 멋대로 모두를 부탁한다는 말만 남기고……."
34270-25 = "리더……. 어, 어째서……."
34270-26 = "……."
34270-27 = "치사해…… 사오리. 이런 걸로 내 족쇄를 채워버리면…… 난 또 다시……."
34270-28 = "……. 나한텐 너무 무거워……."
34270-29 = "……괜찮아. 미사키."
34270-30 = "공주……."
34270-35 = "사오리에게는 아직 좀 더 시간이 필요한 거야."
34270-36 = "스스로를 돌아보고, 스스로를 알아갈 시간이."
34270-37 = "스스로에게 그 질문의 답을 하기 위해서."
34270-38 = "리더는…… 사오리 언니는 돌아오는 걸까요?"
34270-39 = "응. 삿 쨩은 돌아올 거야."
34270-40 = "우리끼리…… 헤쳐나가야 하는 건가요?"
34270-41 = "응. 삿 쨩이 지금까지 우리를 보살펴주었잖아? 우리도 삿 쨩 없이 힘내야 해."
34270-43 = "어떻게……."
34270-44 = "우리는 이제 어떻게 해야 하지……?"
34270-45 = "아리우스 자치구에도, 트리니티에도 게헨나에도……. 우리가 갈 곳은 없어."
34270-46 = "거리를 헤맬 수밖에 없겠지……. 추적을 피하기 위해 계속 자리를 옮겨 다녀야 할 거야."
34270-47 = "우리 앞을 기다리는 건 그런 삶이야…… 공주."
34270-48 = "응. 그래도 괜찮아. 우리는 잘 할 수 있을 거야."
34270-49 = "……."
34270-50 = "공주님……."
34270-51 = "공주…… 말처럼 그렇게 쉬운 게 아닐 거야."
34270-52 = "아니, 할 수 있어."
34270-53 = "……."
34270-54 = "그렇게 말한다면, 콘크리트에서 핀 꽃들에게 실례야."
34270-55 = "아즈사는 그때 그 꽃을 보고 이렇게 말했었어."
34270-60 = "헛되고 헛되더라도…… 끝까지 저항하지 않으면 안 된다고."
34270-61 = "아즈사도 해냈으니까 우리가 하지 못할 리가 없어. 우리의 청춘을 얕보지 마."
34270-62 = "우리를 지켜봐주는 사람도 있으니까. 그렇지?"
34270-68 = "……선생님이."
34270-69 = "……그래."
34270-70 = "어떻게든……."
34270-72 = "응. 함께 노력하는 거야."
34270-76 = "……."
34270-86 = "……큭큭큭. 못 보던 얼굴이군요. 그래, 여기까지 흘러들어 왔다는 건 사연이 있는 거겠죠."
34270-87 = "실력만 있으면 뭐든 상관없습니다. 그래, 어떤 의뢰를 원하나요? 쉬운 거? 어려운 거?"
34270-89 = "……어려운 거, 아니. 불가능한 것도 문제없이 해결해 보이지. 비싼 임무를 줘."
34270-94 = "(나는 범죄자야. 쫓기는 몸에다가 일상은 힘들고 고통스럽겠지.)"
34270-95 = "(하지만 그 고통과 고통과 고통의 여정 끝에…….)"
34270-96 = "(우리도 그런 미래에 닿을 수만 있다면…….)"
34270-100 = "응. 닿을 수 있어. 응, 우리도……"
34270-101 = "……마침내 행복해질 수 있다고 믿자."
34270-102 = "사오리. 우리도 그렇게 믿는 거야."
34270-125 = "……."
34270-130 = "……."
34270-135 = "……."
34270-138 = "선생님. 저는…… 이제 더 이상 예지몽을 꿀 수 없게 되었습니다."
34270-139 = "그 꿈에서 빠져나오는 대가였죠……."
34270-140 = "하지만 저는 최후의 예지몽에서 목격한 것들…… 그것을 선생님과 논의하지 않으면 안 됩니다……."
34270-147 = "하지만…… 그건 조금 뒤로 미뤄도 괜찮을까요?"
34270-148 = "지금은 그저…… 이곳에 모인 우리들을 조금이라도 더 기억하고 싶으니까요."
34270-149 = "그리고 언제나 그렇듯…… 우리는……."
34270-150 = "지금처럼 함께 힘을 합쳐 노력해서 그 시련을 이겨낼 거니까."
34270-152 = "[ns] \"자. 그럼 청문회를 시작해볼까.\""
34270-169 = "잠깐 기다려. 약속이 다르잖아!"
34270-170 = "흐음? 무슨 말씀인지 모르겠습니다만."
34270-171 = "이 계산은 뭐지? 받기로 했던 돈의 절반도 안 되잖아!!"
34270-172 = "약속을 어긴 건 그쪽입니다만."
34270-173 = "여기 계약서에도 적혀 있듯이 학생에게는 시급 1천엔입니다."
34270-174 = "그런데 당신은 자퇴생이라는 걸 숨겼잖아요? 그러니까 5백엔입니다."
34270-175 = "뭐? 잠깐, 그건……"
34270-176 = "거기에 세금과 각종 비용과 식대를 제하면 이 계산입니다만. 문제라도?"
34270-177 = "아아. 거기에다가 보아하니 지명수배까지 당한 것 같은데. 이 사실이 알려지면 곤란한 건 그쪽 아닌가요?"
34270-178 = "그렇다면 정보 보호비로 15%는 더 제하겠습니다."
34270-180 = "뭐? 잠깐, 그, 그럼 내가 받을 돈은………"
34270-186 = "0엔이군요."
34270-187 = "자아, 그럼 나가시는 문은 저쪽입니다."
34270-188 = "하실 말씀이라도 있습니까? 아니면 발키리 학교에 전화라도 해서 하소연이라도 해보시겠습니까?"
34270-193 = "……아니. 알겠다."
34270-194 = "교훈을 배운 셈치지."
34270-203 = "시, 실례합니다."
34270-204 = "아니, 당신은……? 저번에 의뢰를 맡겼던……?!"
34270-205 = "아, 네. 네……. 저, 저기……. 깜빡한 게 있어서……."
34270-206 = "깜빡한 것이라뇨? 그때 확실히 정산은 끝냈는데 말이죠."
34270-207 = "네. 그, 그, 그렇죠. 맞아요…… 그, 그래서……."
34270-211 = "…… 요, 용서……."
34270-212 = "용서?"
34270-214 = "용서못해---!!!!!!!"
34270-224 = "히, 히이익?! 사, 살려?!-"
34270-225 = "아루 님의 돈을 떼어먹다니 용서못해---!!!"
34270-237 = "……하아. 하아."
34270-238 = "아, 아루 님이 가서 확실하게 인사하고…… 제, 제대로 계산해 오라고 했으니까…… 그, 그러니까……."
34270-239 = "이, 이 정도면 충분히 인사를 한 거겠죠……?"
34270-240 = "……."
34270-241 = "아, 아앗……!? 다른 분이 계신 줄은 모르고?!"
34270-242 = "소, 소란을 피워서 시, 실례했습니다!!"
34270-243 = "……아, 아니. 별로."
34270-244 = "그, 그럼 다음에 또…… 저는 폭탄을 설치하러 가야 해서……."
34270-248 = "이게 뒷세계의 방식인가……."
34270-251 = "뭐, 뭐라고오----?!"
34270-253 = "죄, 죄송합니다…… 죄송합니다, 죄송합니다……. 그, 그게 인사라는 게 그런 게 아니었다니…… 또 폐를 끼쳐버렸습니다. 주, 죽을까요? 죽을까요?"
34270-254 = "……하아."
34270-255 = "아하하하하하-! 완전 웃겨. 진짜 제대로 인사하고 왔잖아, 하루카 쨩?"
34270-256 = "거기 엄청 무서워보이는 녀석들이었는데 이제 어떡할거야? 응?"
34270-257 = "또 한바탕 소란스러워지겠군……. 조용한 날이 하루도 없어……. 하아."
