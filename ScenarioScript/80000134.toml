[translation]
80000134-1 = "때맞춘 티라미수"
80000134-2 = "(미요의 초대를 받아 와일드헌트의 기숙사를 방문했다.)"
80000134-3 = "(……사감대의 검문이 허술해지는 시간대까지 정확히 알려준 덕에, 평소보다 수월하게 들어갈 수 있었다.)"
80000134-4 = "특수교역부 기숙사실"
80000134-7 = "어서 오세요, 선생님."
80000134-8 = "[s] \"잘 지냈어, 미요?\""
80000134-9 = "소, 소설이 잘 안 써진다는 것 말고는 다 괜찮아요."
80000134-10 = "밀수 작전 계획안은 어쩐지 쓸데없이 술술 나오지만……."
80000134-11 = "[s] \"응?\""
80000134-12 = "그, 그나저나 죄송해요."
80000134-13 = "제가 찾아뵀어야 했는데, 최근 일시적으로 외출 규정이 엄격해져서……."
80000134-14 = "[s] \"괜찮아. 미요의 초대라면 언제든 환영인걸.\""
80000134-15 = "저, 정말요? 헤헤……."
80000134-16 = "[s] \"무엇보다 초대를 거절하면 납치당할지도 모르니까…….\""
80000134-17 = "무, 무슨 흉흉한 말씀이세요! 그런 거 안 해요!"
80000134-18 = "가능은 하지 않느냐고요? 그야 일단 제반 변수들을 고려해 봐야 하지만……."
80000134-22 = "……이 아니라! 제가 그런 걸 왜 하겠어요?!"
80000134-23 = "흐우우……."
80000134-24 = "[s] \"그런데, 뭘 만들고 있던 거야?\""
80000134-25 = "아, 이건……."
80000134-26 = " ……선생님께 드릴 티라미수를 만들던 중이었어요."
80000134-27 = "[s] \"티라미수……?\""
80000134-28 = "예. 오늘 발렌타인 데이잖아요."
80000134-29 = "그래서 선생님 오실 시간에 딱 맞춰서 완성하려 했는데, 어쩐지 조금 오래 걸려 버려서……."
80000134-30 = "처음 만들어보는 것이기도 하고……."
80000134-31 = "[s] \"그럼 같이 마저 만들어볼까?\""
80000134-32 = "괘, 괜찮아요!"
80000134-33 = "이, 이제 거의 다 했으니까요!"
80000134-34 = "커피에 적신 핑거 쿠키와 마스카포네 치즈를 층층이 쌓는 작업……은 끝났고……."
80000134-35 = "이제 이 위에 코코아 파우더만 뿌리면……."
80000134-41 = "선생님."
80000134-42 = "[s] \"응?\""
80000134-43 = "새하얀 마스카포네 치즈 위에 이렇게 까만 파우더를 뿌리는 것……"
80000134-44 = "마치 백지 위에 글을 써 내려가는 것 같지 않나요?"
80000134-45 = "[s] \"음, 그렇게도 볼 수 있겠네.\""
80000134-46 = "가끔은 그런 생각도 해요."
80000134-47 = "글을 쓴다는 건, 각자의 방식으로 흰 종이를 더럽히는 것 아닐까……."
80000134-48 = "뭐, 그런 생각을……."
80000134-53 = "저, 그, 어쨌든 이것으로……!"
80000134-57 = "와, 완성했어요, 선생님!"
80000134-60 = "[ns] \"맛있어 보여……!\""
80000134-61 = "헤, 헤헤, 고마워요, 선생님."
80000134-62 = "저, 저기, 그런데……."
80000134-63 = "[s] \"음?\""
80000134-69 = "저, 저도 오늘에서야 알았는데…… 갓 만든 티라미수를 두 시간 동안 냉장시키면 더 맛있게 먹을 수 있대요."
80000134-70 = "그, 그래서 말인데, 혹시……."
80000134-71 = "서, 선생님만 괜찮으시면……."
80000134-72 = "[s] \"두 시간 정도는 얼마든지 기다릴 수 있지.\""
80000134-73 = "저, 정말요?! 고마워요, 선생님!"
80000134-74 = "그러면 저, 차를 타 올게요."
80000134-75 = "캐모마일 차, 괜찮으시죠?"
80000134-77 = "(그렇게 두 시간 동안 미요와 차담을 나누었다.)"
80000134-78 = "(두 시간 이후 먹은 티라미수의 맛은, 환상적이었다.)"
