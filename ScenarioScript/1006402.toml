[translation]
1006402-1 = "또 다른 오해"
1006402-2 = "D.U. 인근 포목 상가"
1006402-6 = "………저기."
1006402-7 = "앗, 죄송합니다. 들어오신 줄 미처 모르고 있었네요……"
1006402-8 = "휴식 중에 방해한 것 같아서 미안한데…… 새 기모노를 하나 구입하고 싶어서."
1006402-9 = "앗, 무, 물론입니다. 바로 안내해 드리겠습니다!"
1006402-10 = "이쪽으로……."
1006402-12 = "(기모노 장사를 해온 지 어느덧 10년……)"
1006402-13 = "(그동안 이곳에서 수많은 손님을 접객해 왔기에, 이제는 얼굴만 보더라도 어떤 일을 하는 손님인지 감으로 알 수 있다.)"
1006402-14 = "(보통 이 시즌에 방문하는 손님들은 성인식을 앞두고 첫 기모노를 마련하는 학생인 경우가 많지만……)"
1006402-15 = "(안감의 소재까지 깐깐하게 고르는 저 안목, 그리고 몸 전체에서 뿜어져 나오는 살기까지…… 이 손님은 분명, 암흑가 조직의 높으신 분인 게 틀림없어!)"
1006402-16 = "(만에 하나 실수라도 해서 손님의 기분을 상하게 한다면…… 끔찍한 일을 당할지도 몰라……!)"
1006402-18 = "마, 맡겨만 주십시오. 저희 가게에는 손님과 같은 기품있는 분들을 위한 기모노를 다양하게 갖추고 있으니까요!"
1006402-19 = "제가 기필코! 손님께 잘 어울리는 최고의 기모노를 골라드리겠습니다!"
1006402-20 = "아니, 최고의 기모노까지는 필요 없는데……."
1006402-25 = "우선, 이 옷은 어떠십니까?"
1006402-26 = "최고급 명주를 얇게 재단하여 만든 이 매혹적인 기모노는 손님의 매력을 더욱 배가시켜 뭇사람들로 하여금 눈을 떼기 어렵게 만들 겁니다!"
1006402-30 = "이건 조금…… 노출이 심하지 않아?"
1006402-31 = "그, 그렇지요…… 지체 높아 보이시는 손님께 제가 이 무슨 불찰을……!"
1006402-32 = "자, 잠시만 기다려 주십시오!"
1006402-37 = "그, 그럼 이 옷은 어떠십니까?"
1006402-38 = "금실로 호랑이와 용을 새겨 만든 이 화려한 기모노는 입는 것만으로도 주변에 무시무시한 위압감을 줄 수 있지요!"
1006402-42 = "이 옷은 조금…… 지나치게 화려하지 않아?"
1006402-43 = "과, 과연…… 손님께서는 이런 화려한 옷 따윈 필요 없을 정도의 아우라를 갖고 계시니……"
1006402-44 = "죄송합니다! 금방 다음 옷을……"
1006402-49 = "저희 가게에서 취급하고 있는 제일 비싼 옷, 요로이 갑주입니다……!"
1006402-53 = "이제 이건 기모노도 아니잖아……"
1006402-55 = "히, 히익……?!"
1006402-56 = "죄, 죄송합니다!"
1006402-57 = "부디, 목숨만큼은……!"
1006402-58 = "아니, 그게 무슨……"
1006402-59 = "[s] \"……무슨 일이야?\""
1006402-60 = "어라. 선생……?"
1006402-61 = "[s1] \"근처를 지나가다가 카요코의 목소리가 들려서.\"\n[s2] \"무슨 문제라도 있어?\""
1006402-62 = "그게 그러니까……."
1006402-63 = "그게 그러니까……."
1006402-65 = "(이후, 전후 사정을 설명 받고 점원의 오해를 풀어주었다.)"
1006402-67 = "그, 그렇군요. 죄송합니다. 인상만 보고 분명 검은거북파나 어딘가의 높으신 분일 거라고 생각해서……"
1006402-68 = "지레짐작하고 오해를 했네요…… 죄송합니다."
1006402-69 = "신경 쓰지 않아도 괜찮아. 수상한 사람으로 오인 받는 건 익숙하니까."
1006402-70 = "그보다 오해가 풀렸다면 다른 기모노를 볼 수 있을까? ……가급적 평범한 것으로."
1006402-71 = "그럼…… 이쪽의 기모노는 어떠십니까?"
1006402-72 = "검은 바탕의 고급스러운 디자인이 손님의 머리색과 아주 잘 어울릴 거라 생각합니다. 성인식을 앞둔 학생들을 대상으로 나온 제품인지라, 가격도 합리적이고요!"
1006402-73 = "음, 디자인은 마음에 드는데……"
1006402-74 = "검은색의 기모노는 너무 어두워 보이지 않을까? 안 그래도 평소에 인상이 사납다고 오해를 받는 일이 잦은데……"
1006402-75 = "선생은 어떻게 생각해?"
1006402-76 = "[s3] \"내 생각에는 카요코와 잘 어울릴 것 같은데?\"\n[s4] \"분명 카요코의 귀여움이 배가될 거야!\""
1006402-78 = "귀엽다니, 그게 무슨……"
1006402-79 = "……정말이지. 놀리지 말아줘, 선생."
1006402-83 = "그럼, 선생의 추천도 받았으니 이 기모노로 할까……?"
1006402-84 = "네? 다른 옷은 보시지 않아도 괜찮으시겠습니까?"
1006402-85 = "응. 전에 입고 다니던 것과 비슷한 느낌이고, 개인적으로도 이런 색감의 옷은 싫어하지 않으니까."
1006402-86 = "……게다가 선생이 잘 어울릴 것 같다고 말해주기도 했으니……"
1006402-87 = "네, 그럼 바로 준비해 드리겠습니다!"
1006402-93 = "여하튼…… 오늘도 신세를 졌네. 선생에게는 늘 도움만 받는 것 같아."
1006402-94 = "대신이라고 하긴 그렇지만, 다음에 이 기모노를 입은 모습을 보여 줄게."
1006402-95 = "마음 같아서는 지금 바로 보여주고 싶지만 기모노는 입는 데 시간이 오래 걸려서 말이야."
1006402-96 = "[s] \"응. 기대하고 있을게!\""
1006402-97 = "그럼, 나중에 보자. 선생."
