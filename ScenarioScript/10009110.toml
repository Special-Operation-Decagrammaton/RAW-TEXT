[translation]
10009110-1 = "후일담;조용한 대수사선"
10009110-4 = "신념과 긍지를 가슴에!"
10009110-20 = "후우…… 용서하십시오. 이것도 전부 여러분을 위한 구호 활동!"
10009110-24 = "세상이 구호를 필요로 하는 한! 구호기사단은 멈추지 않을 것입니다!"
10009110-25 = "아니, 잠깐! 진짜 뭘 구호하려면"
10009110-27 = "저 단장부터 막아야 하는 거 아…… 꾸엑?!"
10009110-28 = "괜찮으세요? 금방 소독해 드릴게요. 하지만 섣불리 움직이시면 안 돼요?"
10009110-29 = "상처가 덧나기라도 하면 큰일이니까요! 아, 역시 부목으로 온 몸을 고정해 드리는 게 좋을까요, 선배?"
10009110-31 = "병 주고 약 주는 거냐?! 아니면 도와준다고 해 놓고 온몸을 묶어서 구속하려는 거냐?!"
10009110-32 = "큭…… 따지고 보면 구호기사단 녀석들도 딱히 우리 편은 아니긴 했지……!"
10009110-34 = "가, 감사합니다! 구호기사단 여러분! 덕분에 큰 도움이 됐습니다!"
10009110-35 = "아닙니다. 저희는 단지 저희의 의무를 다할 뿐……"
10009110-36 = "그럼에도 이런 소동이 버젓이 일어나고 있다는 사실에, 통탄을 금할 수 없군요."
10009110-38 = "크, 크윽……! 칸나 국장님만 이 자리에 계셨어도……!"
10009110-39 = "하지만 이번 사건에서 공안국은 출동할 수 없다지……"
10009110-40 = "서류 절차상에 문제가 있었으니까."
10009110-41 = "현장 보고 자료에 직인이 찍혀 있지 않았고."
10009110-42 = "지원 요청 서류에 첨부 별지 두 장이 빠져 있었고."
10009110-43 = "별지를 발급받으려면 인증서를 갱신해야 하는데."
10009110-44 = "인증서는 매주 수요일에만 발급하고, 긴급 갱신이라는 수단도 있기는 하지만."
10009110-45 = "그러려면 방위실장님의 허가서가 추가로 필요하지……"
10009110-46 = "잠시만요. 지금의 그 말씀들은 간과할 수 없군요!"
10009110-47 = "사람을 구하는 일입니다! 형식이나 절차가 뭐 그리 중요합니까?!"
10009110-48 = "그런 불필요한 과정이 있기에, 올바른 '구호'가 일어나지 않는 것입니다!"
10009110-49 = "하, 하지만 행정적인 일에는, 아무리 그래도 절차가 필요하다고 할까, 피치 못할 사정이 있는 법이라고 할까……!"
10009110-50 = "그렇다면 제가 직접 발키리 경찰학교의 높으신 분들에게 따지도록 하겠습니다!"
10009110-51 = "아, 아뇨! 아무리 그래도 거기까지는……!"
10009110-52 = "그렇습니다! 미네 단장을 위해서라도 그건…… 자칫하면 학교 간의 내정 간섭이나 분쟁으로까지 이어질 수 있는 문제라고요!"
10009110-54 = "슬픕니다…… 저는 진심으로 슬픕니다! 이렇게 진심이 받아들여지지 않는 상황이라니!"
10009110-55 = "바로 그 절차와 과정의 문제 때문에 '구호'가 이루어지지 않는다고 말씀드리는데, 또다시 절차와 과정의 문제를 이야기하시다니요!"
10009110-57 = "(그 이후 우연히 현장 시찰을 나온 경비국장이 미네와 마주치게 되고,)"
10009110-58 = "(경비국장에게 직접 항의를 전달하려는 미네를 발키리 학생들이 어떻게든 말리려 하고,)"
10009110-59 = "(경비국장은 당황하며 부서가 다르다고 발뺌하려다가 오히려 미네의 감정을 더더욱 돋구는 일들이 일어나기도 했지만……)"
10009110-60 = "(그건 또 다른 이야기.)"
10009110-62 = "흐음? 밖에서 무언가 소란이 일어나고 있는 모양이군요."
10009110-63 = "눈엣가시같던 경비국장과 그 호위 부대도 자리를 비운 것 같고."
10009110-64 = "후후후후후…… 이건 참으로 좋은 기회로군요."
10009110-71 = "자, 다시 한번 시작해 볼까요!"
